window.__LP=lecturePlayer(document.getElementById("app"),{"brand":"접속사 that","title":"Chapter 6 포인트31 관계부사의 역할 및 쓰임 - 문법","audioDir":"grammar_audio","preview":false,"count":34,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">Chapter 6 포인트31 관계부사의 역할 및 쓰임 - 문법\u003c/div>\u003ch1>관계부사의 역할 및 쓰임 완전 정복\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>관계부사의 종류와 올바른 쓰임 및 전치사 + 관계대명사로의 전환을 이해한다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분, 오늘 우리 함께 공부할 포인트는 바로 관계부사예요. 관계부사가 문장에서 어떤 역할을 하고 어떻게 쓰이는지 확실하게 정리해 볼 거랍니다. 오늘 수업을 열심히 들으면 관계부사 관련 문제는 절대 틀리지 않게 될 거예요. 자, 그럼 집중해서 첫 번째 개념부터 바로 시작해 볼까요?","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 4\u003c/span>\u003ch2 class=\"g-h\">관계부사의 기본 역할과 종류\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">관계부사 \u003cb class=\"key\">when\u003c/b>, \u003cb class=\"key\">where\u003c/b>, \u003cb class=\"key\">why\u003c/b>, \u003cb class=\"key\">how\u003c/b>는 접속사와 부사 역할을 하며 뒤에 \u003cb class=\"key\">완전한 절\u003c/b>이 온다.\u003cdiv>\u003cspan class=\"g-formula\">관계부사 + 완전한 절\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">This is the house \u003cspan class=\"fx\">where\u003c/span> I lived.\u003c/div>\u003cdiv class=\"g-ko\">이것은 내가 살았던 집이다.\u003c/div>\u003cdiv class=\"g-note\">장소를 나타내는 선행사 the house 뒤에서 관계부사 where가 완전한 절을 이끕니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>선행사에 알맞은 관계부사를 \u003cb class=\"key\">선택\u003c/b>해야 한다.\u003c/div>","segs":[{"n":2,"text":"첫 번째 개념은 관계부사의 기본 역할과 종류예요. 관계부사에는 when, where, why, how가 있는데요, 이 친구들은 접속사와 부사 역할을 동시에 한답니다. 그래서 뒤에는 주어, 목적어, 보어가 빠짐없이 다 갖춰진 완전한 절이 오게 돼요.","hl":"rule"},{"n":3,"text":"첫 번째 예문을 함께 소리 내어 읽어 볼까요. This is the house where I lived. 해석은 이것은 내가 살았던 집이다. 가 돼요. 장소를 나타내는 선행사 the house 뒤에 관계부사 where가 와서 뒤에 완전한 절을 이끌고 있답니다.","hl":"ex-0"},{"n":4,"text":"잠깐, 여기서 주의할 점이 있어요. 앞에 나오는 선행사의 종류가 시간인지, 장소인지, 이유인지에 따라서 알맞은 관계부사를 골라 써야 한다는 점을 꼭 기억해 두세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 4\u003c/span>\u003ch2 class=\"g-h\">선행사에 따른 관계부사의 구분\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">선행사가 \u003cb class=\"key\">시간\u003c/b>이면 when, \u003cb class=\"key\">장소\u003c/b>이면 where, \u003cb class=\"key\">이유\u003c/b>이면 why를 쓴다.\u003cdiv>\u003cspan class=\"g-formula\">선행사(시간/장소/이유) + when/where/why\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I remember the day \u003cspan class=\"fx\">when\u003c/span> we first met.\u003c/div>\u003cdiv class=\"g-ko\">나는 우리가 처음 만난 날을 기억한다.\u003c/div>\u003cdiv class=\"g-note\">시간을 나타내는 선행사 the day와 함께 관계부사 when이 쓰였습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>선행사와 관계부사의 \u003cb class=\"key\">짝꿍\u003c/b>을 정확히 확인하세요.\u003c/div>","segs":[{"n":5,"text":"두 번째 개념은 선행사에 따른 관계부사의 구분이에요. 방금 이야기했듯이 앞에 있는 선행사가 시간이면 when을 쓰고요, 장소이면 where를 쓴답니다. 그리고 이유를 나타낼 때는 why를 쓰면 되는 거예요.","hl":"rule"},{"n":6,"text":"두 번째 예문을 살펴볼게요. I remember the day when we first met. 이 문장의 뜻은 나는 우리가 처음 만난 날을 기억한다. 이지요. 시간을 나타내는 선행사 the day와 함께 관계부사 when이 쓰인 모습을 확인할 수 있어요.","hl":"ex-0"},{"n":7,"text":"문제를 풀 때 선행사와 관계부사의 짝꿍이 잘 맞는지 꼼꼼하게 확인하는 습관을 들여야 해요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 4\u003c/span>\u003ch2 class=\"g-h\">the way와 how의 관계\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">how\u003c/b>는 선행사 the way와 \u003cb class=\"key\">함께 쓰지 않고\u003c/b> 둘 중 하나만 쓴다.\u003cdiv>\u003cspan class=\"g-formula\">the way how (X) / the way (O) / how (O)\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">This is \u003cspan class=\"fx\">how\u003c/span> he solved the problem.\u003c/div>\u003cdiv class=\"g-ko\">이것이 그가 그 문제를 푼 방식이다.\u003c/div>\u003cdiv class=\"g-note\">the way 없이 관계부사 단독으로 쓰인 문장입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>the way how처럼 \u003cb class=\"key\">중복 사용\u003c/b>하지 않도록 주의한다.\u003c/div>","segs":[{"n":8,"text":"세 번째 개념은 the way와 how의 관계예요. 아주 중요한 함정이 숨어 있는 곳인데요, how는 선행사 the way와 절대 함께 쓸 수 없어요. 둘 다 쓰면 틀리고, the way만 쓰거나 how만 써야 한다는 점을 잊지 마세요.","hl":"rule"},{"n":9,"text":"세 번째 예문을 함께 볼까요. This is how he solved the problem. 해석은 이것이 그가 그 문제를 푼 방식이다. 에요. 여기서는 the way를 쓰지 않고 관계부사 how만 단독으로 쓰였다는 것을 알 수 있죠.","hl":"ex-0"},{"n":10,"text":"시험에서 the way how 형태로 같이 써놓고 틀린 것을 찾는 문제가 아주 자주 나와요. 절대 둘을 같이 쓰지 않도록 주의합시다.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 4 / 4\u003c/span>\u003ch2 class=\"g-h\">관계부사와 전치사 + 관계대명사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">관계부사는 \u003cb class=\"key\">전치사 + 관계대명사\u003c/b>로 \u003cb class=\"key\">바꿔 쓸 수\u003c/b> 있다.\u003cdiv>\u003cspan class=\"g-formula\">when/where/why/how = 전치사 + 관계대명사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">This is the house \u003cspan class=\"fx\">in which\u003c/span> I lived.\u003c/div>\u003cdiv class=\"g-ko\">이것은 내가 살았던 집이다.\u003c/div>\u003cdiv class=\"g-note\">where를 전치사 plus 관계대명사 in which로 바꿔 쓴 문장입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>전치사의 \u003cb class=\"key\">종류\u003c/b>는 선행사의 성격에 따라 달라진다.\u003c/div>","segs":[{"n":11,"text":"마지막 네 번째 개념은 관계부사와 전치사 plus 관계대명사의 관계예요. 관계부사는 전치사와 관계대명사를 합친 것과 똑같아서, 필요할 때 전치사 plus 관계대명사 형태로 바꿔 쓸 수 있답니다.","hl":"rule"},{"n":12,"text":"마지막 예문을 읽어 볼게요. This is the house in which I lived. 뜻은 이것은 내가 살았던 집이다. 이지요. 앞서 봤던 where가 들어간 문장을 전치사 plus 관계대명사 형태인 in which로 바꿔 쓴 문장이에요.","hl":"ex-0"},{"n":13,"text":"전치사 plus 관계대명사로 바꿀 때 어떤 전치사를 써야 할지는 선행사의 의미에 따라 달라지니 앞의 명사를 잘 살펴보아야 해요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>This is the way how he solved the problem.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ This is the way he solved the problem.\u003c/div>\u003cdiv class=\"g-why\">the way와 how는 함께 쓸 수 없기 때문입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>I know the reason when he left.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ I know the reason why he left.\u003c/div>\u003cdiv class=\"g-why\">선행사가 the reason이므로 관계부사는 when이 아니라 why를 써야 합니다.\u003c/div>\u003c/div>","segs":[{"n":14,"text":"학생들이 가장 많이 틀리는 첫 번째 문장이에요. This is the way how he solved the problem. 이라고 쓰면 틀려요. the way와 how는 같이 쓸 수 없으므로 둘 중 하나만 써야 바른 문장이 된답니다.","hl":"mk-0"},{"n":15,"text":"두 번째로 자주 틀리는 문장을 볼게요. I know the reason when he left. 라고 하면 안 돼요. 선행사가 the reason일 때는 시간이 아니라 이유이므로 when이 아니라 why를 써야 올바른 문장이 돼요.","hl":"mk-1"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 빈칸에 들어갈 가장 알맞은 관계부사를 고르시오.\u003c/div>\u003cdiv class=\"g-qs\">This is the place ____ I first met my best friend.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>when\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>where\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>why\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>how\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">where\u003c/span>\u003cdiv class=\"g-exp\">선행사가 장소를 나타내는 the place이므로 관계부사 where가 정답입니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":16,"text":"첫 번째 문제입니다. 빈칸에 들어갈 가장 알맞은 관계부사를 골라 보세요. 문장을 읽어 줄게요. This is the place blank I first met my best friend. 잠시 화면을 멈추고 직접 풀어 보세요.","hl":"q"},{"n":17,"text":"","hl":"q","pause":6},{"n":18,"text":"정답은 두 번째 보기인 관계부사 짝도 맞고 뒤에 완전한 절이 와서 어법상 아주 올바른 문장이랍니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">Chapter 6 포인트31 관계부사의 역할 및 쓰임 - 문법\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>관계부사 \u003cb class=\"key\">when\u003c/b>, \u003cb class=\"key\">where\u003c/b>, \u003cb class=\"key\">why\u003c/b>, \u003cb class=\"key\">how\u003c/b>는 접속사와 부사 역할을 하며 뒤에 \u003cb class=\"key\">완전한 절\u003c/b>이 온다.\u003c/li>\u003cli>\u003cb class=\"key\">how\u003c/b>는 선행사 the way와 \u003cb class=\"key\">함께 쓰지 않고\u003c/b> 둘 중 하나만 쓴다.\u003c/li>\u003cli>관계부사는 \u003cb class=\"key\">전치사 + 관계대명사\u003c/b>로 바꿔 쓸 수 있다.\u003c/li>\u003c/ul>\u003cbutton class=\"pq-go\" data-act=\"practice\">✎ 문제 풀러 가기 (8문제)\u003c/button>","segs":[{"n":34,"text":"오늘 우리는 관계부사의 역할과 종류, the way와 how의 주의할 점, 그리고 전치사 plus 관계대명사로의 전환까지 모두 정리해 보았어요. 오늘 배운 핵심 내용을 꼼꼼히 복습하면서 여러분 것으로 만들어 보아요. 그럼 오늘 강의는 여기서 마칠게요. 수고하셨습니다!","hl":"sum"}]}],"practice":{"unit":"Chapter 6 포인트31 관계부사의 역할 및 쓰임 - 문법","level":"고1·2","ctx":"단원: Chapter 6 포인트31 관계부사의 역할 및 쓰임 - 문법\n강의 제목: 관계부사의 역할 및 쓰임 완전 정복\n목표: 관계부사의 종류와 올바른 쓰임 및 전치사 + 관계대명사로의 전환을 이해한다.\n개념 1. 관계부사의 기본 역할과 종류: 관계부사 when, where, why, how는 접속사와 부사 역할을 하며 뒤에 완전한 절이 온다. [관계부사 + 완전한 절] (주의: 선행사에 알맞은 관계부사를 선택해야 한다.)\n  예문: This is the house where I lived. (이것은 내가 살았던 집이다.)\n개념 2. 선행사에 따른 관계부사의 구분: 선행사가 시간이면 when, 장소이면 where, 이유이면 why를 쓴다. [선행사(시간/장소/이유) + when/where/why] (주의: 선행사와 관계부사의 짝꿍을 정확히 확인하세요.)\n  예문: I remember the day when we first met. (나는 우리가 처음 만난 날을 기억한다.)\n개념 3. the way와 how의 관계: how는 선행사 the way와 함께 쓰지 않고 둘 중 하나만 쓴다. [the way how (X) / the way (O) / how (O)] (주의: the way how처럼 중복 사용하지 않도록 주의한다.)\n  예문: This is how he solved the problem. (이것이 그가 그 문제를 푼 방식이다.)\n개념 4. 관계부사와 전치사 + 관계대명사: 관계부사는 전치사 + 관계대명사로 바꿔 쓸 수 있다. [when/where/why/how = 전치사 + 관계대명사] (주의: 전치사의 종류는 선행사의 성격에 따라 달라진다.)\n  예문: This is the house in which I lived. (이것은 내가 살았던 집이다.)\n자주 하는 실수: This is the way how he solved the problem. → This is the way he solved the problem. / I know the reason when he left. → I know the reason why he left.\n정리: 관계부사 when, where, why, how는 접속사와 부사 역할을 하며 뒤에 완전한 절이 온다. / how는 선행사 the way와 함께 쓰지 않고 둘 중 하나만 쓴다. / 관계부사는 전치사 + 관계대명사로 바꿔 쓸 수 있다.","items":[{"t":"choose","q":"다음 중 밑줄 친 부분의 어법이 올바른 것을 두 개 고르세요.","ref":"","opts":["This is the town [[where]] I was born.","I don't know [[the way how]] she solved the puzzle.","Tell me the reason [[why]] you were late.","Do you remember the day [[where]] we graduated?","This is the museum [[in which]] Picasso worked."],"ans":[1,3,5],"exp":"장소 선행사 town 뒤에는 where, 이유 선행사 reason 뒤에는 why, 장소 선행사 museum 뒤에는 in which가 알맞아요. the way how는 함께 쓸 수 없으며, 시간 선행사 day 뒤에는 where가 아니라 when을 써야 해요. (정답이 3개인 문항입니다)"},{"t":"fix","q":"다음 문장에서 틀린 곳을 하나 찾아 바르게 고치세요.","s":"He explained the way how he fixed my broken bicycle.","wrong":"the way how","right":["the way","how"],"exp":"관계부사 how는 선행사 the way와 함께 쓸 수 없으므로 둘 중 하나만 써야 해요."},{"t":"bank","q":"빈칸에 알맞은 관계부사를 \u003c보기>에서 골라 넣으세요.","bank":["when","where","why","how"],"items":[{"s":"Summer is the season ____ most people go on vacation.","a":"when"},{"s":"Can you tell me the reason ____ you didn't attend the meeting?","a":"why"}],"exp":"시간을 나타내는 선행사 season 뒤에는 when, 이유를 나타내는 선행사 reason 뒤에는 why를 씁니다."},{"t":"match","q":"어법과 문맥상 자연스러운 문장이 되도록 알맞은 것끼리 연결하세요.","pairs":[{"l":"This is the library","r":"where I study English every evening."},{"l":"I'll never forget the day","r":"when I won the first prize."},{"l":"She didn't tell me the reason","r":"why she canceled the trip."}],"exp":"선행사가 장소(library)면 where, 시간(day)면 when, 이유(reason)면 why와 연결해야 자연스러운 관계부사절이 완성됩니다."},{"t":"scene","q":"상황을 보고 주어진 단어를 사용하여 \u003c보기>와 같이 문장을 완성하세요.","ex":{"s":"[[Eating popcorn]], Nari is watching a movie.","hint":"(popcorn, eat)"},"items":[{"scene":"🏫 학생들이 공부하는 학교","pre":"This is the school ","post":" we study hard.","hint":"(where)","a":["where"]}],"exp":"선행사가 장소(the school)이고 뒤에 완전한 절이 오므로 관계부사 where를 써요."},{"t":"order","q":"우리말과 일치하도록 주어진 어구를 알맞게 배열하세요.","ko":"그것이 그가 그 프로젝트를 성공적으로 끝낸 방식이다.","chunks":["This is","how","he finished","the project successfully"],"end":".","alts":["This is the way he finished the project successfully"],"exp":"the way와 how는 함께 쓸 수 없으므로 'This is how~' 또는 'This is the way~' 형태로 배열해야 해요."},{"t":"ox","q":"다음 밑줄 친 부분이 어법상 옳으면 O, 틀리면 X를 고르고 바르게 고치세요.","s":"This is the park [[where]] I used to play soccer.","ok":true,"right":[],"exp":"장소를 나타내는 선행사 the park 뒤에 관계부사 where가 올바르게 쓰였고 뒤에 완전한 절이 이어집니다."},{"t":"ox","q":"다음 밑줄 친 부분이 어법상 옳으면 O, 틀리면 X를 고르고 바르게 고치세요.","s":"I remember the winter [[when]] we had heavy snow.","ok":true,"right":[],"exp":"시간을 나타내는 선행사 the winter 뒤에 관계부사 when이 올바르게 쓰였습니다."}]}});</script><script>function practiceKit(){
  var CIRC="①②③④⑤⑥⑦⑧⑨⑩",COLORS=["#FFD9E2","#FFE4B5","#D7F0E0","#DDE7FF","#EBDDFB","#FCE7C8"];
  var TL={choose:"고르기",fix:"틀린 곳 고치기",bank:"빈칸 채우기",match:"연결하기",scene:"상황 보고 완성",order:"배열하기",ox:"O/X 고치기"};
  function s(x){return x==null?"":String(x);}
  function A(x){return Array.isArray(x)?x:[];}
  function esc(t){return s(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  function ul(t){return esc(t).replace(/\[\[(.+?)\]\]/g,"<u>$1</u>");}
  function plain(t){return s(t).replace(/\[\[|\]\]/g,"");}
  function nz(t){return plain(t).replace(/[’‘`]/g,"'").replace(/[“”]/g,'"').toLowerCase().replace(/[.,!?;:"()]/g," ").replace(/\s+/g," ").trim();}
  function alts(x){if(Array.isArray(x))return x.map(s).map(function(v){return v.trim();}).filter(Boolean);return s(x).split(/\s+\/\s+/).map(function(v){return v.trim();}).filter(Boolean);}
  function blank(t){return s(t).replace(/_{2,}|\(\s*\)|\[\s*\]/g,"____");}
  function shuffle(L){var a=L.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function mix(n){var idx=[];for(var i=0;i<n;i++)idx.push(i);if(n<2)return idx;var r,k=0;do{r=shuffle(idx);k++;}while(k<8&&r.every(function(v,i){return v===i;}));return r;}
  /* ---------- AI가 만든 문제 정리 (틀린 형식은 버림) ---------- */
  function item(x){
    if(!x||typeof x!=="object")return null;
    var t=s(x.t||x.type).toLowerCase().trim(),q=s(x.q||x.question).trim(),exp=s(x.exp||x.explain).trim();
    if(t==="same"||t==="mcq")t="choose";
    if(t==="choose"){
      var opts=A(x.opts||x.options).map(s).filter(function(v){return v.trim();}).slice(0,8),ans=A(Array.isArray(x.ans)?x.ans:[x.ans]),seen={};
      ans=ans.map(function(n){return parseInt(n,10);}).filter(function(n){if(!(n>=1&&n<=opts.length)||seen[n])return false;seen[n]=1;return true;});
      if(opts.length<3||!ans.length)return null;
      return {t:t,q:q||(ans.length>1?"알맞은 것을 "+ans.length+"개 고르세요.":"알맞은 것을 고르세요."),ref:s(x.ref).trim(),opts:opts,ans:ans.sort(),exp:exp};}
    if(t==="fix"){
      var S=s(x.s||x.sentence).trim(),w=s(x.wrong).trim(),r=alts(x.right);
      if(!S||!w||S.indexOf(w)<0||!r.length)return null;
      return {t:t,q:q||"다음 문장에서 틀린 곳을 하나 찾아 바르게 고치세요.",s:S,wrong:w,right:r,exp:exp};}
    if(t==="bank"){
      var bank=A(x.bank).map(s).map(function(v){return v.trim();}).filter(Boolean),low=bank.map(function(v){return nz(v);});
      var its=A(x.items).map(function(it){var ss=blank(it&&it.s);var a=s(it&&it.a).trim(),k=low.indexOf(nz(a));
        if(ss.split("____").length!==2||k<0)return null;return {s:ss,a:bank[k]};}).filter(Boolean).slice(0,8);
      if(bank.length<2||its.length<2)return null;
      return {t:t,q:q||"빈칸에 알맞은 것을 <보기>에서 고르세요.",bank:bank,items:its,exp:exp};}
    if(t==="match"){
      var pr=A(x.pairs).map(function(p){return p&&s(p.l).trim()&&s(p.r).trim()?{l:s(p.l).trim(),r:s(p.r).trim()}:null;}).filter(Boolean).slice(0,7);
      if(pr.length<3)return null;
      return {t:t,q:q||"알맞은 것끼리 연결하세요.",pairs:pr,exp:exp};}
    if(t==="scene"){
      var ex=x.ex&&typeof x.ex==="object"?{s:s(x.ex.s).trim(),hint:s(x.ex.hint).trim()}:{s:"",hint:""};
      var sit=A(x.items).map(function(it){if(!it)return null;var a=alts(it.a);if(!a.length)return null;
        return {scene:s(it.scene).trim(),pre:s(it.pre),post:s(it.post),hint:s(it.hint).trim(),a:a};}).filter(Boolean).slice(0,3);
      if(!sit.length)return null;
      return {t:t,q:q||"상황을 보고 <보기>와 같이 문장을 완성하세요.",ex:ex,items:sit,exp:exp};}
    if(t==="order"){
      var ch=A(x.chunks).map(s).map(function(v){return v.trim();}).filter(Boolean).slice(0,8);
      if(ch.length<3)return null;
      return {t:t,q:q||"우리말과 일치하도록 주어진 어구를 알맞게 배열하세요.",ko:s(x.ko).trim(),chunks:ch,end:s(x.end==null?".":x.end).trim(),alts:alts(x.alts),exp:exp};}
    if(t==="ox"){
