window.__LP=lecturePlayer(document.getElementById("app"),{"brand":"Check Up","title":"Chapter 8 Basic Practice (포인트 43-44)","audioDir":"practice43-44_audio","preview":false,"count":81,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">형용사와 부사의 구별 / 비교급·최상급 / 대동사\u003c/div>\u003ch1>형용사·부사 구별과 비교급·최상급 문제풀이\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘 풀 문제\u003c/b>10문제 · 양자택일, 틀린 부분 고치기, 지문 어법\u003c/div>\u003c/div>","segs":[{"n":1,"text":"여러분 안녕하세요. 오늘은 Chapter 8 Basic Practice, 포인트 사십삼에서 사십사까지, 형용사와 부사, 그리고 비교 표현 문제를 함께 풀어 볼 거예요. 앞부분은 네모 안에서 고르는 문제, 중간은 맞으면 동그라미 치고 틀리면 고치는 문제, 마지막은 지문에서 잘못된 부분을 모두 고치는 문제로 구성되어 있습니다. 오늘 기준만 확실히 잡으면 시험에서 이 유형은 거의 다 맞힐 수 있으니까, 하나씩 차분하게 따라와 주세요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">정도 부사 nearly\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">숫자\u003c/b>나 수량 표현 앞에서 '거의'라는 의미를 더할 때는 부사 \u003cb class=\"key\">nearly\u003c/b>를 씁니다. \u003cb class=\"key\">near\u003c/b>는 '가까운'이라는 형용사나 '~ 근처에'라는 전치사로 쓰입니다.\u003cdiv>\u003cspan class=\"g-formula\">nearly + 숫자 (nearly twenty seconds)\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>숫자·수량 앞에는 nearly\u003c/li>\u003cli>near는 형용사(가까운)·전치사로 쓰임\u003c/li>\u003cli>almost와 바꿔 쓸 수 있음\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">It took nearly two hours.\u003c/div>\u003cdiv class=\"g-ko\">그것은 거의 두 시간이 걸렸다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"먼저 거의라는 뜻을 만드는 부사부터 볼게요. 숫자 앞에서 얼마나 가까운지, 즉 거의라는 의미를 더할 때는 nearly를 씁니다. near는 가깝다는 뜻의 형용사로, 혹은 전치사로 쓰이는 단어예요. 그래서 이십 초 앞에는 nearly를 넣어서 거의 이십 초라고 읽습니다. almost와 거의 같은 뜻으로 바꿔 쓸 수 있다는 점도 같이 기억해 두세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-1\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">He stared at me in silence for \u003cspan class=\"p-box\">\u003cspan>near\u003c/span>\u003ci>/\u003c/i>\u003cspan>nearly\u003c/span>\u003c/span> twenty seconds.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">near\u003c/div>\u003cdiv class=\"p-op\">nearly\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">nearly\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":3,"text":"첫 번째 문제는 near와 nearly 중에서 고르는 문제입니다. 빈칸 뒤에 어떤 표현이 오는지부터 확인해 보세요.","hl":"q"},{"n":4,"text":"","hl":"q","pause":7},{"n":5,"text":"정답은 nearly입니다. 숫자 앞에서 거의라는 뜻을 더해 주는 것은 부사 nearly이기 때문입니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-1\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">He stared at me in silence for \u003cspan class=\"p-box\">\u003cspan>near\u003c/span>\u003ci>/\u003c/i>\u003cspan class=\"ok\">nearly\u003c/span>\u003c/span> twenty seconds.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">near\u003c/div>\u003cdiv class=\"p-op\">nearly\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">숫자 앞 확인\u003c/b>전치사 for 뒤에 \u003cb class=\"key\">twenty seconds\u003c/b>라는 시간 표현이 옵니다. 숫자 앞에는 '거의'라는 뜻을 더하는 \u003cb class=\"key\">부사\u003c/b>가 필요합니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">near와 nearly 비교\u003c/b>\u003cb class=\"key\">near\u003c/b>는 '가까운'이라는 형용사나 '~ 근처에'라는 전치사이고, \u003cb class=\"key\">nearly\u003c/b>는 '거의'라는 부사입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">정답 확인\u003c/b>for \u003cb class=\"key\">nearly\u003c/b> twenty seconds, 즉 '거의 이십 초 동안'이 자연스럽습니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 nearly\u003c/span>\u003cdiv class=\"p-full\">He stared at me in silence for nearly twenty seconds.\u003c/div>\u003cdiv class=\"p-ko\">그는 거의 이십 초 동안 말없이 나를 응시했다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>near를 '거의'라는 뜻으로 착각해 숫자 앞에 그대로 쓰는 실수\u003c/div>","segs":[{"n":6,"text":"먼저 빈칸 뒤를 보면 twenty seconds, 이십 초라는 시간 표현이 나옵니다. 숫자 앞에는 거의라는 뜻을 더해 주는 부사가 필요하다는 점을 먼저 잡아 주세요.","hl":"st-0"},{"n":7,"text":"여기서 헷갈리는 게 near와 nearly인데요. near는 가깝다는 뜻의 형용사로, 혹은 전치사로 쓰이는 단어이고 nearly는 거의라는 뜻의 부사입니다.","hl":"st-1"},{"n":8,"text":"그래서 for nearly twenty seconds, 거의 이십 초 동안이라고 읽어야 자연스럽습니다. 정답은 nearly입니다.","hl":"st-2"},{"n":9,"text":"이 문제의 함정도 짚고 갈게요. near를 '거의'라는 뜻으로 착각해 숫자 앞에 그대로 쓰는 실수","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">respective와 respectful 구별\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">respective\u003c/b>는 '각자의, 각각의'라는 뜻으로 복수 명사 앞에 쓰고, \u003cb class=\"key\">respectful\u003c/b>은 '존경하는, 공손한'이라는 뜻으로 태도를 나타냅니다.\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>respective + 복수 명사(각자의)\u003c/li>\u003cli>respectful은 존중하는 태도\u003c/li>\u003cli>respectable은 '존경할 만한'\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">They returned to their respective homes.\u003c/div>\u003cdiv class=\"g-ko\">그들은 각자의 집으로 돌아갔다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"respective와 respectful은 생김새가 비슷해서 시험에 자주 나옵니다. respective는 각자의, 각각의라는 뜻으로 뒤에 복수 명사가 옵니다. respectful은 존경하는, 공손한이라는 뜻으로 사람의 태도를 나타내는 형용사예요. 각자의 침실이라고 할 때는 respective bedrooms, 선생님을 존경하는 태도라고 할 때는 respectful attitude가 됩니다. 뜻 차이를 꼭 구분해 두세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-2\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">They went into their \u003cspan class=\"p-box\">\u003cspan>respective\u003c/span>\u003ci>/\u003c/i>\u003cspan>respectful\u003c/span>\u003c/span> bedrooms to pack.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">respective\u003c/div>\u003cdiv class=\"p-op\">respectful\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">respective\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":11,"text":"두 번째 문제는 생김새가 비슷한 두 형용사를 고르는 문제입니다. 뒤에 오는 명사가 무엇인지 보고 판단해 보세요.","hl":"q"},{"n":12,"text":"","hl":"q","pause":7},{"n":13,"text":"정답은 respective입니다. 각자의 침실이라는 뜻이 되어야 하니까요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-2\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">They went into their \u003cspan class=\"p-box\">\u003cspan class=\"ok\">respective\u003c/span>\u003ci>/\u003c/i>\u003cspan>respectful\u003c/span>\u003c/span> bedrooms to pack.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">respective\u003c/div>\u003cdiv class=\"p-op\">respectful\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">뒤 명사 확인\u003c/b>빈칸 뒤에 \u003cb class=\"key\">bedrooms\u003c/b>라는 복수 명사가 옵니다. '각자의 침실'이라는 뜻이 자연스럽습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">respective의 뜻\u003c/b>\u003cb class=\"key\">respective\u003c/b>는 '각자의, 각각의'라는 뜻으로 복수 명사 앞에 씁니다.\u003c/div>\u003cdiv class=\"p-st 리\u003c/b>어법에 문제가 없으므로 \u003cb class=\"key\">○\u003c/b>입니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ○\u003c/span>\u003cdiv class=\"p-full\">The company has been investing in costly equipment.\u003c/div>\u003cdiv class=\"p-ko\">그 회사는 값비싼 장비에 투자해 오고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>-ly로 끝나면 무조건 부사라고 판단해 틀렸다고 표시하는 실수\u003c/div>","segs":[{"n":38,"text":"밑줄 친 costly가 equipment라는 명사 앞에서 그 명사를 꾸미고 있습니다. 명사를 꾸미는 자리에는 형용사가 와야 한다는 점을 먼저 확인하세요.","hl":"st-0"},{"n":39,"text":"costly는 ly로 끝나서 부사 같지만 실제로는 값비싼이라는 뜻의 형용사입니다. friendly나 lovely처럼 ly로 끝나는 형용사도 있다는 것을 기억해 주세요.","hl":"st-1"},{"n":40,"text":"형용사가 명사를 제대로 꾸미고 있으니 어법에 문제가 없습니다. 그래서 여기는 동그라미를 치면 됩니다.","hl":"st-2"},{"n":41,"text":"이 문제의 함정도 짚고 갈게요. -ly로 끝나면 무조건 부사라고 판단해 틀렸다고 표시하는 실수","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">as + 형용사 + a + 명사 + as 구문\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">「\u003cb class=\"key\">as + 형용사 + a + 명사 + as\u003c/b>」 어순으로, 형용사가 관사 a보다 앞에 옵니다.\u003cdiv>\u003cspan class=\"g-formula\">as + 형용사 + a + 명사 + as\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>형용사가 a 앞에\u003c/li>\u003cli>명사는 관사 뒤에\u003c/li>\u003cli>원급 비교라 as ~ as 짝을 맞춤\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">He is \u003cspan class=\"fx\">as kind a man as\u003c/span> his father.\u003c/div>\u003cdiv class=\"g-ko\">그는 그의 아버지만큼 친절한 사람이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":42,"text":"as와 as 사이에 형용사가 들어가는 비교 구문을 볼게요. 이때 명사가 함께 오면 형용사가 관사 a보다 앞에 옵니다. 그래서 as great a pride and interest as her father처럼 as, 형용사, a, 명사, as 순서가 됩니다. great a pride처럼 형용사와 관사의 순서를 바꾸면 틀린 문장이 되니 어순을 꼭 기억해 주세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 6 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">B-2\u003c/span>밑줄 친 부분이 어법상 맞으면 ○표 하고, 틀리면 바르게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-q\">Ellen took as \u003cu class=\"p-u\">great\u003c/u> a pride and interest in the garden as her father.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">○\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":43,"text":"두 번째 문제는 as와 as 사이의 어순을 확인하는 문제입니다. 형용사와 관사 중 무엇이 먼저 오는지 보세요.","hl":"q"},{"n":44,"text":"","hl":"q","pause":7},{"n":45,"text":"밑줄 친 부분은 맞습니다. as 형용사 a 명사 as 어순이 정확하기 때문입니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 6 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">B-2\u003c/span>밑줄 친 부분이 어법상 맞으면 ○표 하고, 틀리면 바르게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-q sm\">Ellen took as \u003cu class=\"p-u\">great\u003c/u> a pride and interest in the garden as her father.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">as ~ as 구문 확인\u003c/b>\u003cb class=\"key\">as\u003c/b> great a pride and interest in the garden \u003cb class=\"key\">as\u003c/b> her father, 즉 as와 as로 묶인 원급 비교 구문입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">어순 확인\u003c/b>\u003cb class=\"key\">as + 형용사 + a + 명사 + as\u003c/b> 어순이므로 great이 a 앞에 오는 것이 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">정답 정리\u003c/b>어순이 바르므로 \u003cb class=\"key\">○\u003c/b>입니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ○\u003c/span>\u003cdiv class=\"p-full\">Ellen took as great a pride and interest in the garden as her father.\u003c/div>\u003cdiv class=\"p-ko\">Ellen은 아버지만큼이나 정원에 큰 자부심과 관심을 가졌다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>great a pride라는 어순을 어색하다고 느껴 틀렸다고 판단하는 실수\u003c/div>","segs":[{"n":46,"text":"문장을 보면 as와 as가 형용사와 명사를 감싸고 있습니다. 원급 비교 구문이 제대로 만들어졌는지 확인해 보세요.","hl":"st-0"},{"n":47,"text":"이 구문의 어순은 as, 형용사, a, 명사, as입니다. 그래서 great이 a 앞에 오는 것이 정확한 어순이에요.","hl":"st-1"},{"n":48,"text":"형용사가 관사 앞에 제대로 놓였으니 틀린 곳이 없습니다. 여기도 동그라미입니다.","hl":"st-2"},{"n":49,"text":"이 문제의 함정도 짚고 갈게요. great a pride라는 어순을 어색하다고 느껴 틀렸다고 판단하는 실수","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">형용사와 부사 (hard/hardly, deep/deeply)\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">동사나 과거분사를 꾸미면 \u003cb class=\"key\">부사\u003c/b>를 씁니다. \u003cb class=\"key\">hardly\u003c/b>는 '거의 ~않다'라는 부정의 뜻이고, \u003cb class=\"key\">hard\u003c/b>는 '열심히, 세게'라는 뜻의 부사입니다.\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>hardly = 거의 ~않다\u003c/li>\u003cli>deeply = 깊이(부사)\u003c/li>\u003cli>be deeply liked and respected\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">He was deeply moved by the story.\u003c/div>\u003cdiv class=\"g-ko\">그는 그 이야기에 깊이 감동했다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":50,"text":"동사나 과거분사를 꾸밀 때는 부사를 씁니다. deep은 형용사이지만 deeply는 깊이라는 뜻의 부사라서, be liked and respected처럼 수동태 동사를 꾸밀 수 있어요. hard는 열심히, 세게라는 뜻의 부사이고, hardly는 거의 그렇지 않다는 부정의 뜻을 가진 부사입니다. 그래서 거의 움직이지도 말하지도 못했다는 hardly move or speak로 씁니다.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 7 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">B-3\u003c/span>밑줄 친 부분이 어법상 맞으면 ○표 하고, 틀리면 바르게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-q\">He was so exhausted and dehydrated that he could \u003cu class=\"p-u\">hard\u003c/u> move or speak.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">hardly\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":51,"text":"세 번째 문제는 hard와 hardly 중 어느 것이 맞는지 판단하는 문제입니다. 앞뒤 문맥의 의미를 먼저 파악해 보세요.","hl":"q"},{"n":52,"text":"","hl":"q","pause":7},{"n":53,"text":"hardly로 고쳐야 합니다. 여기서는 거의 할 수 없었다는 부정의 의미가 필요하기 때문입니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 7 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">B-3\u003c/span>밑줄 친 부분이 어법상 맞으면 ○표 하고, 틀리면 바르게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-q sm\">He was so exhausted and dehydrated that he could \u003cu class=\"p-u\">hard\u003c/u> move or speak.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">문장 의미 파악\u003c/b>so ~ that 구문으로 '너무 지쳐서 탈수 상태여서 ~할 수 없었다'는 흐름입니다. 밑줄 친 부분이 \u003cb class=\"key\">move or speak\u003c/b>를 꾸밉니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">hard와 hardly 구별\u003c/b>\u003cb class=\"key\">hard\u003c/b>는 '열심히, 세게'라는 부사이고, \u003cb class=\"key\">hardly\u003c/b>는 '거의 ~않다'라는 부정의 뜻입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">정답 정리\u003c/b>\u003cb class=\"key\">hardly\u003c/b>로 고쳐 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 hardly\u003c/span>\u003cdiv class=\"p-full\">He was so exhausted and dehydrated that he could hardly move or speak.\u003c/div>\u003cdiv class=\"p-ko\">그는 너무 지치고 탈수 상태여서 거의 움직이지도 말하지도 못했다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>hard를 '거의 ~않다'로 착각해 그대로 두는 실수\u003c/div>","segs":[{"n":54,"text":"문장 전체를 보면 너무 지치고 탈수 상태여서 움직이거나 말할 수 없었다는 흐름입니다. 밑줄 친 부분이 move or speak라는 동사를 꾸미고 있어요.","hl":"st-0"},{"n":55,"text":"hard는 열심히, 세게라는 뜻의 부사이고 hardly는 거의 그렇지 않다는 부정의 뜻을 가진 부사입니다. 의미상 여기에는 hardly가 필요합니다.","hl":"st-1"},{"n":56,"text":"그래서 he could hardly move or speak, 거의 움직이지도 말하지도 못했다로 고쳐야 합니다. 정답은 hardly입니다.","hl":"st-2"},{"n":57,"text":"이 문제의 함정도 짚고 갈게요. hard를 '거의 ~않다'로 착각해 그대로 두는 실수","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">비교급과 최상급의 구별 (than vs among)\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">than\u003c/b>이 있으면 비교급, \u003cb class=\"key\">among\u003c/b>이나 \u003cb class=\"key\">in\u003c/b> 같은 범위 표현이 있으면 최상급을 씁니다.\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>than → 비교급\u003c/li>\u003cli>among + 복수 명사 → 최상급\u003c/li>\u003cli>범위 안에서 으뜸이면 최상급\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Korea has the highest sales volume among these countries.\u003c/div>\u003cdiv class=\"g-ko\">한국은 이 나라들 중에서 가장 높은 판매량을 기록한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":58,"text":"비교급과 최상급을 가르는 가장 쉬운 기준은 뒤에 오는 말입니다. than이 오면 비교급, among이나 in처럼 범위를 나타내는 말이 오면 최상급을 씁니다. these countries 가운데에서 가장 높은 판매량이라고 할 때는 highest가 맞아요. higher는 두 나라를 직접 견줄 때만 쓴다고 정리해 두세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 8 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">B-4\u003c/span>밑줄 친 부분이 어법상 맞으면 ○표 하고, 틀리면 바르게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-q\">Norway held the \u003cu class=\"p-u\">higher\u003c/u> sales volume among these countries.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">highest\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":59,"text":"네 번째 문제는 범위 표현이 나오는 문장입니다. 뒤에 붙은 전치사구를 눈여겨보세요.","hl":"q"},{"n":60,"text":"","hl":"q","pause":7},{"n":61,"text":"highest로 고쳐야 합니다. among these countries라는 범위 안에서의 으뜸이니까 최상급을 씁니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 8 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">B-4\u003c/span>밑줄 친 부분이 어법상 맞으면 ○표 하고, 틀리면 바르게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-q sm\">Norway held the \u003cu class=\"p-u\">higher\u003c/u> sales volume among these countries.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">범위 표현 찾기\u003c/b>문장 끝에 \u003cb class=\"key\">among these countries\u003c/b>라는 범위 표현이 있습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">비교급인지 최상급인지 판단\u003c/b>여럿으로 이루어진 범위 안에서 으뜸을 말하므로 \u003cb class=\"key\">최상급\u003c/b>이 필요합니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">정답 정리\u003c/b>\u003cb class=\"key\">higher\u003c/b>를 \u003cb class=\"key\">highest\u003c/b>로 고칩니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 highest\u003c/span>\u003cdiv class=\"p-full\">Norway held the highest sales volume among these countries.\u003c/div>\u003cdiv class=\"p-ko\">노르웨이는 이 나라들 중에서 가장 높은 판매량을 기록했다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>higher가 자연스럽게 들려서 among을 무시하고 넘어가는 실수\u003c/div>","segs":[{"n":62,"text":"문장 끝을 보면 among these countries, 이 나라들 중에서라는 범위 표현이 나옵니다. 이 표현이 답을 결정하는 열쇠입니다.","hl":"st-0"},{"n":63,"text":"여러 나라로 이루어진 범위 안에서 가장 높은 판매량을 말하고 있으니 최상급이 필요합니다. 비교급은 두 나라를 직접 견줄 때만 씁니다.","hl":"st-1"},{"n":64,"text":"그래서 higher를 highest로 고쳐야 합니다. the highest sales volume among these countries가 됩니다.","hl":"st-2"},{"n":65,"text":"이 문제의 함정도 짚고 갈게요. higher가 자연스럽게 들려서 among을 무시하고 넘어가는 실수","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">대동사 do/does/did\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">앞에 나온 동사의 반복을 피할 때 \u003cb class=\"key\">do/does/did\u003c/b>를 씁니다. 시제는 앞 문장에 맞춥니다.\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>앞 동사가 과거면 did\u003c/li>\u003cli>반복되는 일반동사를 대신함\u003c/li>\u003cli>be동사·조동사는 그대로 반복\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">He worked harder than she did.\u003c/div>\u003cdiv class=\"g-ko\">그는 그녀보다 더 열심히 일했다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":66,"text":"앞에 나온 동사를 다시 쓰지 않고 반복을 피할 때 do, does, did를 씁니다. 이때 시제는 앞 문장에 맞춰 주는 것이 정말 중요합니다. 앞에서 deserved라는 과거 동사를 썼으니까 뒤에서는 did를 써서 nobody deserved his reputation more than he did라고 합니다. be동사나 조동사가 나온 문장이라면 각각 be동사나 조동사를 그대로 반복한다는 점도 함께 기억해 두세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 9 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C-1\u003c/span>다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg\">My father was (1) \u003cu class=\"p-u\">deep\u003c/u> liked and respected in our community, and nobody deserved his reputation more than he (2) \u003cu class=\"p-u\">were\u003c/u>. Most of the things I learned of value in my childhood came from watching my father and learning from him. By setting a good example for me, my father showed me the meaning of honesty, hard work, and generosity. Without him, I would (3) \u003cu class=\"p-u\">hard\u003c/u> know the true meaning of life.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">(1) deeply (2) did (3) hardly\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":67,"text":"이번에는 지문형 문제입니다. 세 군데 밑줄이 있는데, 각각 어떤 단어를 꾸미는지, 어떤 시제인지 차례로 확인해 보세요.","hl":"q"},{"n":68,"text":"","hl":"q","pause":7},{"n":69,"text":"첫 번째는 deeply, 두 번째는 did, 세 번째는 hardly로 고칩니다. 부사 자리와 대동사, 부정의 의미를 각각 확인한 결과입니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 9 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C-1\u003c/span>다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg sm\">My father was (1) \u003cu class=\"p-u\">deep\u003c/u> liked and respected in our community, and nobody deserved his reputation more than he (2) \u003cu class=\"p-u\">were\u003c/u>. Most of the things I learned of value in my childhood came from watching my father and learning from him. By setting a good example for me, my father showed me the meaning of honesty, hard work, and generosity. Without him, I would (3) \u003cu class=\"p-u\">hard\u003c/u> know the true meaning of life.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">(1) 확인\u003c/b>(1)은 \u003cb class=\"key\">liked and respected\u003c/b>라는 과거분사를 꾸밉니다. 형용사 deep이 아니라 부사 \u003cb class=\"key\">deeply\u003c/b>가 필요합니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">(2) 확인\u003c/b>(2)는 앞의 \u003cb class=\"key\">deserved\u003c/b>를 반복하지 않고 대신하는 자리입니다. 과거 시제이므로 \u003cb class=\"key\">did\u003c/b>가 맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">(3) 확인\u003c/b>(3)은 '삶의 진정한 의미를 거의 알지 못할 것이다'라는 부정의 의미이므로 \u003cb class=\"key\">hardly\u003c/b>입니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 (1) deeply (2) did (3) hardly\u003c/span>\u003cdiv class=\"p-full\">My father was deeply liked and respected in our community, and nobody deserved his reputation more than he did. Without him, I would hardly know the true meaning of life.\u003c/div>\u003cdiv class=\"p-ko\">우리 아버지는 지역 사회에서 깊이 사랑받고 존경받으셨고, 누구도 그분보다 그런 평판을 받을 자격이 없었다. 그분이 없었다면 나는 삶의 진정한 의미를 거의 알지 못했을 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>(2)에서 주어가 he라서 were가 아니라 was로 고치는 실수\u003c/div>","segs":[{"n":70,"text":"먼저 첫 번째 밑줄을 보겠습니다. be liked and respected, 즉 사랑받고 존경받는다는 수동 표현을 꾸미고 있으니 부사 deeply로 고쳐야 합니다.","hl":"st-0"},{"n":71,"text":"두 번째는 앞에 나온 deserved를 대신하는 자리입니다. 주어가 he인데 were를 쓰면 어색하고, 시제도 과거이므로 did를 씁니다.","hl":"st-1"},{"n":72,"text":"세 번째는 아버지가 없었다면 삶의 진정한 의미를 거의 알지 못했을 것이다라는 의미입니다. 그래서 hard가 아니라 hardly로 고칩니다.","hl":"st-2"},{"n":73,"text":"이 문제의 함정도 짚고 갈게요. (2)에서 주어가 he라서 were가 아니라 was로 고치는 실수","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 10 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C-2\u003c/span>다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg\">One of my (1) \u003cu class=\"p-u\">greater\u003c/u> regrets was not visiting him enough toward the end of his life. He loved to talk about his experiences working in Montreal in a factory during the war and his time with the Canadian Pacific Railway. Toward the end of his life, the events of 50 years ago were more vivid and real to him (2) \u003cu class=\"p-u\">to\u003c/u> what had happened a few days earlier.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">(1) greatest (2) than\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":74,"text":"마지막 지문 문제입니다. 두 군데 밑줄이 있는데, 앞에는 관사 대신 소유격이 있고 뒤에는 비교급 표현이 있다는 점을 눈여겨보세요.","hl":"q"},{"n":75,"text":"","hl":"q","pause":7},{"n":76,"text":"첫 번째는 greatest, 두 번째는 than으로 고칩니다. one of 뒤의 최상급과 more와 짝을 이루는 than을 확인하면 됩니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 10 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C-2\u003c/span>다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg sm\">One of my (1) \u003cu class=\"p-u\">greater\u003c/u> regrets was not visiting him enough toward the end of his life. He loved to talk about his experiences working in Montreal in a factory during the war and his time with the Canadian Pacific Railway. Toward the end of his life, the events of 50 years ago were more vivid and real to him (2) \u003cu class=\"p-u\">to\u003c/u> what had happened a few days earlier.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">(1) 확인\u003c/b>\u003cb class=\"key\">one of my\u003c/b> 뒤에 복수 명사 regrets가 오므로 그 앞에는 \u003cb class=\"key\">최상급\u003c/b>이 필요합니다. 따라서 \u003cb class=\"key\">greatest\u003c/b>입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">(2) 확인\u003c/b>앞에 \u003cb class=\"key\">more vivid and real\u003c/b>이라는 비교급이 있으므로 뒤에는 \u003cb class=\"key\">than\u003c/b>이 와야 합니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">정답 정리\u003c/b>(1) greatest, (2) than으로 고칩니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 (1) greatest (2) than\u003c/span>\u003cdiv class=\"p-full\">One of my greatest regrets was not visiting him enough toward the end of his life. Toward the end of his life, the events of 50 years ago were more vivid and real to him than what had happened a few days earlier.\u003c/div>\u003cdiv class=\"p-ko\">내 가장 큰 후회 중 하나는 그분의 말년에 그분을 충분히 찾아뵙지 못한 것이다. 말년에 그분에게는 오십 년 전의 일들이 며칠 전에 일어난 일보다 더 생생하고 실감 나게 다가왔다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>(2)에서 more ~ than 짝을 놓치고 전치사 to를 그대로 두는 실수\u003c/div>","segs":[{"n":77,"text":"첫 번째 밑줄은 one of my 다음, regrets 앞자리입니다. one of 뒤에는 최상급과 복수 명사가 오니까 greatest로 고쳐야 합니다.","hl":"st-0"},{"n":78,"text":"두 번째 밑줄 앞을 보면 more vivid and real이라는 비교급 표현이 있습니다. 비교급과 짝을 이루는 것은 than이므로 to를 than으로 고칩니다.","hl":"st-1"},{"n":79,"text":"정리하면 첫 번째는 greatest, 두 번째는 than입니다. 최상급 자리와 비교급 짝을 각각 확인한 결과예요.","hl":"st-2"},{"n":80,"text":"이 문제의 함정도 짚고 갈게요. (2)에서 more ~ than 짝을 놓치고 전치사 to를 그대로 두는 실수","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">형용사와 부사의 구별 / 비교급·최상급 / 대동사\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>숫자 앞에서 '거의'는 부사 \u003cb class=\"key\">nearly\u003c/b>, 명사를 꾸미면 \u003cb class=\"key\">respective\u003c/b>와 \u003cb class=\"key\">respectful\u003c/b>을 뜻으로 구별한다.\u003c/li>\u003cli>\u003cb class=\"key\">one of the + 최상급 + 복수 명사\u003c/b>와 \u003cb class=\"key\">비교급 + than\u003c/b>은 짝으로 외워 둔다.\u003c/li>\u003cli>-ly로 끝나도 \u003cb class=\"key\">costly\u003c/b>처럼 형용사인 단어가 있고, \u003cb class=\"key\">hardly\u003c/b>는 '거의 ~않다'라는 부정의 부사다.\u003c/li>\u003cli>범위를 나타내는 \u003cb class=\"key\">among\u003c/b>이 있으면 비교급이 아니라 최상급, 앞 동사를 대신할 때는 시제에 맞는 \u003cb class=\"key\">did\u003c/b>를 쓴다.\u003c/li>\u003c/ul>","segs":[{"n":81,"text":"오늘 문제들을 관통하는 기준은 결국 두 가지였어요. 첫째는 형용사 자리인지 부사 자리인지 확인하는 것, 둘째는 than이면 비교급이고 among이면 최상급이라는 표지를 보는 것입니다. 특히 hardly처럼 뜻이 완전히 달라지는 부사와, one of 뒤의 최상급은 시험에 계속 나오니까 꼭 외워 두세요. 오늘도 수고 많았습니다.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
