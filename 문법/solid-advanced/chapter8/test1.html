}
window.__LP=lecturePlayer(document.getElementById("app"),{"brand":"Check Up","title":"Chapter 8 Chapter Test","audioDir":"test1_audio","preview":false,"count":167,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">비교급·최상급, 형용사와 부사의 구별, 지문 어법\u003c/div>\u003ch1>Chapter 8 Chapter Test 문제풀이 — 비교 표현과 형용사·부사 총정리\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘 풀 문제\u003c/b>20문제 · 양자택일, 틀린 것 고르기, 틀린 부분 고치기, 배열 서술형, 지문 어법, 빈칸 채우기(형태 변형), 지문 어법 + 영작\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 Chapter 8 Chapter Test를 함께 풀어 볼 거예요. 비교 표현과 형용사·부사 구별, 그리고 지문 어법 문제까지 골고루 나오니까 하나씩 차근차근 짚어 볼게요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">alive와 live (서술 용법 형용사)\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">alive는 \u003cb class=\"key\">서술 용법\u003c/b>으로만 쓰는 형용사로 be동사나 감각동사 뒤 보어 자리에 옵니다. live는 명사 앞에서만 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">주어 + feel/seem/be + alive\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>alive는 명사 앞에 쓸 수 없음\u003c/li>\u003cli>live는 명사 앞에서만 (live animals)\u003c/li>\u003cli>감각동사 뒤에는 형용사 보어\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The fish is still alive.\u003c/div>\u003cdiv class=\"g-ko\">그 물고기는 아직 살아 있다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">We saw live animals in the zoo.\u003c/div>\u003cdiv class=\"g-ko\">우리는 동물원에서 살아 있는 동물을 보았다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"여러분, alive와 live는 둘 다 살아 있다는 뜻인데 쓰는 자리가 완전히 달라요. alive는 be동사나 feel 같은 감각동사 뒤에만 오는 서술 용법 형용사예요. 그래서 명사 바로 앞에는 쓸 수가 없죠. 반대로 live는 명사 앞에서만 씁니다. 시험에서는 감각동사 뒤 빈칸에 live를 넣도록 유도하는 함정이 자주 나와요. 보어 자리면 무조건 alive라고 기억해 두세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 20\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">1\u003c/span>괄호 안에서 어법상 알맞은 말을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">The music filled the room, making us feel \u003cspan class=\"p-box\">\u003cspan>alive\u003c/span>\u003ci>/\u003c/i>\u003cspan>live\u003c/span>\u003c/span> and energetic.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">alive\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":3,"text":"첫 번째 문제는 alive와 live 중에서 고르는 문제예요. feel 뒤에 어떤 형용사가 올 수 있는지 자리를 먼저 보세요.","hl":"q"},{"n":4,"text":"","hl":"q","pause":7},{"n":5,"text":"정답은 alive입니다. alive는 감각동사 뒤에서만 쓰는 서술 용법 형용사이고, live는 명사 앞에서만 쓰기 때문이에요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 20\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">1\u003c/span>괄호 안에서 어법상 알맞은 말을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">The music filled the room, making us feel \u003cspan class=\"p-box\">\u003cspan class=\"ok\">alive\u003c/span>\u003ci>/\u003c/i>\u003cspan>live\u003c/span>\u003c/span> and energetic.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">동사 확인\u003c/b>making us feel ~에서 feel은 \u003cb class=\"key\">감각동사\u003c/b>라 뒤에 형용사가 보어로 옵니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">alive vs live\u003c/b>alive는 \u003cb class=\"key\">서술 용법\u003c/b> 전용 형용사로 보어 자리에 맞고, live는 명사 앞에서만 쓰므로 여기에는 부적합합니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 alive\u003c/span>\u003cdiv class=\"p-full\">The music filled the room, making us feel alive and energetic.\u003c/div>\u003cdiv class=\"p-ko\">그 음악은 방을 가득 채워 우리를 생기 있고 활기차게 만들었다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>live를 살아 있는이라는 뜻으로 보어 자리에 넣는 실수\u003c/div>","segs":[{"n":6,"text":"먼저 making us feel 뒤를 보세요. feel은 감각동사라서 뒤에 형용사가 보어로 와요.","hl":"st-0"},{"n":7,"text":"그 자리에 올 수 있는 건 alive예요. alive는 be동사나 감각동사 뒤에서만 쓰는 형용사거든요. live는 명사 앞에서만 쓸 수 있어서 이 자리에는 올 수 없습니다.","hl":"st-1"},{"n":8,"text":"이 문제의 함정도 짚고 갈게요. live를 살아 있는이라는 뜻으로 보어 자리에 넣는 실수","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">헷갈리는 부사 late와 lately, hard와 hardly\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">형용사에 ly를 붙였다고 같은 뜻이 되지 않습니다. \u003cb class=\"key\">lately = 최근에\u003c/b>, \u003cb class=\"key\">hardly = 거의 ~않다\u003c/b>로 뜻이 달라집니다.\u003cdiv>\u003cspan class=\"g-formula\">late(늦게) ↔ lately(최근에) / hard(열심히) ↔ hardly(거의 ~않다)\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>lately는 현재완료와 잘 어울림\u003c/li>\u003cli>hardly는 부정의 의미\u003c/li>\u003cli>late는 형용사와 부사 둘 다 가능\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I have not seen him lately.\u003c/div>\u003cdiv class=\"g-ko\">나는 최근에 그를 못 봤다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">He hardly spoke at the meeting.\u003c/div>\u003cdiv class=\"g-ko\">그는 회의에서 거의 말하지 않았다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"late와 lately, hard와 hardly는 철자만 비슷할 뿐 뜻이 전혀 달라요. late는 늦게, lately는 최근에라는 뜻으로 현재완료와 자주 붙어 다닙니다. hard는 열심히, hardly는 거의 그렇지 않다는 부정의 뜻이에요. 그래서 최근에 그를 봤다고 말할 때 late를 쓰면 늦게 봤다가 되어 버립니다. 문장의 시제와 뜻을 먼저 확인하는 습관이 중요해요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 20\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">2\u003c/span>괄호 안에서 어법상 알맞은 말을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">If you have seen him \u003cspan class=\"p-box\">\u003cspan>late\u003c/span>\u003ci>/\u003c/i>\u003cspan>lately\u003c/span>\u003c/span>, you'll notice that he seems happier than he was.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">lately\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":10,"text":"두 번째 문제는 late와 lately 중에 고르는 문제예요. 문장의 시제를 먼저 확인해 보세요.","hl":"q"},{"n":11,"text":"","hl":"q","pause":7},{"n":12,"text":"정답은 lately입니다. 현재완료 have seen과 함께 쓰여 최근에라는 뜻을 나타내기 때문이에요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 20\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">2\u003c/span>괄호 안에서 어법상 알맞은 말을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">If you have seen him \u003cspan class=\"p-box\">\u003cspan>late\u003c/span>\u003ci>/\u003c/i>\u003cspan class=\"ok\">lately\u003c/span>\u003c/span>, you'll notice that he seems happier than he was.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">시제 확인\u003c/b>have seen이라는 \u003cb class=\"key\">현재완료\u003c/b>가 있으므로 최근에라는 의미가 필요합니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">late vs lately\u003c/b>late는 늦게, \u003cb class=\"key\">lately\u003c/b>는 최근에라는 뜻입니다. 따라서 lately가 알맞습니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 lately\u003c/span>\u003cdiv class=\"p-full\">If you have seen him lately, you'll notice that he seems happier than he was.\u003c/div>\u003cdiv class=\"p-ko\">최근에 그를 보았다면, 그가 예전보다 더 행복해 보인다는 것을 알게 될 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>lately를 늦게라는 뜻으로 착각하는 것\u003c/div>","segs":[{"n":13,"text":"have seen이라는 현재완료가 눈에 들어오죠. 지금까지 이어진 경험을 말하고 있으니 최근에라는 의미가 필요해요.","hl":"st-0"},{"n":14,"text":"여기서 late를 쓰면 늦게 봤다가 되어 의미가 어색해집니다. 최근에라는 뜻의 lately가 정답이에요.","hl":"st-1"},{"n":15,"text":"이 문제의 함정도 짚고 갈게요. lately를 늦게라는 뜻으로 착각하는 것","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">alike와 like\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">alike는 \u003cb class=\"key\">서술 용법\u003c/b> 형용사로 be동사나 look 뒤에 오고, like는 전치사로 뒤에 명사가 옵니다.\u003cdiv>\u003cspan class=\"g-formula\">A and B are alike / A is like B\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>alike는 명사 앞에서 쓸 수 없음\u003c/li>\u003cli>look alike, be alike\u003c/li>\u003cli>like는 전치사로 뒤에 명사\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The twins look alike.\u003c/div>\u003cdiv class=\"g-ko\">그 쌍둥이는 서로 닮았다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">He looks like his father.\u003c/div>\u003cdiv class=\"g-ko\">그는 아버지를 닮았다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":16,"text":"alike와 like도 자리만 보면 바로 구별돼요. alike는 서로 닮은이라는 형용사인데 be동사나 look 뒤에서만 쓰는 서술 용법이에요. like는 전치사라서 뒤에 명사가 따라옵니다. 두 차를 비교하는 문장에서 be동사 뒤가 비어 있으면 alike를 고르면 되고, 뒤에 명사가 보이면 like예요. 자리만 확인해도 정답이 보입니다.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 3 / 20\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">3\u003c/span>괄호 안에서 어법상 알맞은 말을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">The two cars are almost \u003cspan class=\"p-box\">\u003cspan>like\u003c/span>\u003ci>/\u003c/i>\u003cspan>alike\u003c/span>\u003c/span> in terms of their designs and performance.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">alike\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":17,"text":"세 번째 문제는 like와 alike 중에 고르는 문제예요. 빈칸 뒤에 명사가 있는지부터 확인해 보세요.","hl":"q"},{"n":18,"text":"","hl":"q","pause":7},{"n":19,"text":"정답은 alike입니다. be동사 뒤에서 서로 닮은 상태를 나타내는 형용사이고, like는 전치사라 뒤에 명사가 필요하기 때문이에요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 3 / 20\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">3\u003c/span>괄호 안에서 어법상 알맞은 말을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">The two cars are almost \u003cspan class=\"p-box\">\u003cspan>like\u003c/span>\u003ci>/\u003c/i>\u003cspan class=\"ok\">alike\u003c/span>\u003c/span> in terms of their designs and performance.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">자리 확인\u003c/b>are almost 뒤는 \u003cb class=\"key\">주격보어\u003c/b> 자리이고 뒤에 명사가 없습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">alike 선택\u003c/b>like는 전치사라 뒤에 명사가 필요하고, \u003cb class=\"key\">alike\u003c/b>는 서술 용법 형용사로 이 자리에 맞습니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 alike\u003c/span>\u003cdiv class=\"p-full\">The two cars are almost alike in terms of their designs and performance.\u003c/div>\u003cdiv class=\"p-ko\">그 두 차는 디자인과 성능 면에서 거의 비슷하다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>be동사 뒤에 like를 써서 전치사의 목적어가 없는 문장을 만드는 실수\u003c/div>","segs":[{"n":20,"text":"are almost 뒤를 보세요. 주격보어 자리이고 바로 뒤에 명사가 없죠.","hl":"st-0"},{"n":21,"text":"like는 전치사라서 뒤에 명사가 와야 해요. 명사가 없으니 형용사인 alike를 골라야 합니다.","hl":"st-1"},{"n":22,"text":"이 문제의 함정도 짚고 갈게요. be동사 뒤에 like를 써서 전치사의 목적어가 없는 문장을 만드는 실수","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">부정어와 비교 표현 (Nothing is more ~ than, one of the most)\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">Nothing is more + 형용사 + than A\u003c/b>는 A보다 더 ~한 것은 없다는 최상급 의미이고, \u003cb class=\"key\"> class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">배수 비교와 less ~ than\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">배수는 \u003cb class=\"key\">twice as + 원급 + as\u003c/b>처럼 as 사이에 원급을 넣고, \u003cb class=\"key\">less + 원급 + than\u003c/b>으로 덜 ~하다를 표현합니다.\u003cdiv>\u003cspan class=\"g-formula\">twice as + 형용사/부사 + as / less + 형용사/부사 + than\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>배수사는 as ~ as 앞에 옴\u003c/li>\u003cli>less는 than과 짝\u003c/li>\u003cli>more도 than과 짝\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">This bag is twice as expensive as that one.\u003c/div>\u003cdiv class=\"g-ko\">이 가방은 저것보다 두 배 비싸다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">It takes less time than before.\u003c/div>\u003cdiv class=\"g-ko\">그것은 전보다 시간이 덜 걸린다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":30,"text":"배수 표현은 순서가 생명이에요. 두 배라는 말은 as와 as 사이에 원급을 넣고 그 앞에 twice를 붙입니다. as twice라고 쓰면 틀려요. 그리고 less는 덜이라는 비교급이니까 반드시 than과 짝을 이룹니다. as를 끌어오는 함정이 많으니 비교급 뒤에는 than이라고 묶어서 외워 두세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 5 / 20\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">5\u003c/span>괄호 안에서 어법상 알맞은 말을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">Maintaining your success is \u003cspan class=\"p-box\">\u003cspan>twice as\u003c/span>\u003ci>/\u003c/i>\u003cspan>as twice\u003c/span>\u003c/span> difficult as reaching it. It may take less time to lose your achievement \u003cspan class=\"p-box\">\u003cspan>as\u003c/span>\u003ci>/\u003c/i>\u003cspan>than\u003c/span>\u003c/span> to gain it.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">twice as, than\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>"," . as twice라고 배수를 뒤에 쓰는 실수","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">형용사와 부사의 구별\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">동사를 수식하면 \u003cb class=\"key\">부사\u003c/b>, 명사나 보어 자리면 \u003cb class=\"key\">형용사\u003c/b>를 씁니다. 동사 뒤에서 어떻게 했는지를 말하면 부사입니다.\u003cdiv>\u003cspan class=\"g-formula\">동사 + 부사 / be동사·감각동사 + 형용사\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>spoke confidently처럼 동사 수식은 부사\u003c/li>\u003cli>be brave처럼 보어는 형용사\u003c/li>\u003cli>enough는 형용사·부사 뒤에 옴\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">She answered calmly.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 침착하게 대답했다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">He is confident.\u003c/div>\u003cdiv class=\"g-ko\">그는 자신감이 있다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":37,"text":"형용사인지 부사인지는 꾸미는 대상만 보면 됩니다. 명사를 꾸미거나 be동사 뒤에서 주어를 설명하면 형용사, 동사나 형용사를 꾸미면 부사예요. spoke나 answered처럼 동사 뒤에서 어떻게 했는지를 말하면 부사를 씁니다. 비교급 more가 앞에 있으면 뒤에도 부사가 와야 자연스러워요. 품사를 먼저 판단하고 형태를 고르세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 6 / 20\u003c/span>\u003cspan class=\"g-kind\">틀린 것 고르기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">6\u003c/span>다음 중 밑줄 친 부분이 어법상 틀린 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">① He spoke more \u003cu class=\"p-u\">confident\u003c/u> than usual during the presentation.\u003cbr>② The concert was advertised \u003cu class=\"p-u\">well enough\u003c/u>, but ticket sales were poor.\u003cbr>③ He suffered a series of tragedies that \u003cu class=\"p-u\">nearly\u003c/u> drove him to madness.\u003cbr>④ The woman tried to be brave and take the bad news \u003cu class=\"p-u\">calmly\u003c/u>.\u003cbr>⑤ Many of us have experienced an interview that didn't go as \u003cu class=\"p-u\">well\u003c/u> as we had hoped.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">①\u003c/div>\u003cdiv class=\"p-op\">②\u003c/div>\u003cdiv class=\"p-op\">③\u003c/div>\u003cdiv class=\"p-op\">④\u003c/div>\u003cdiv class=\"p-op\">⑤\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">①\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":38,"text":"여섯 번째 문제는 다섯 문장 중에서 어법상 틀린 것을 고르는 문제예요. 각 밑줄이 형용사 자리인지 부사 자리인지 판단해 보세요.","hl":"q"},{"n":39,"text":"","hl":"q","pause":7},{"n":40,"text":"정답은 첫 번째입니다. 동사 spoke를 꾸미는 자리이므로 confident를 부사인 confidently로 고쳐야 해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 6 / 20\u003c/span>\u003cspan class=\"g-kind\">틀린 것 고르기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">6\u003c/span>다음 중 밑줄 친 부분이 어법상 틀린 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">① He spoke more \u003cu class=\"p-u\">confident\u003c/u> than usual during the presentation.\u003cbr>② The concert was advertised \u003cu class=\"p-u\">well enough\u003c/u>, but ticket sales were poor.\u003cbr>③ He suffered a series of tragedies that \u003cu class=\"p-u\">nearly\u003c/u> drove him to madness.\u003cbr>④ The woman tried to be brave and take the bad news \u003cu class=\"p-u\">calmly\u003c/u>.\u003cbr>⑤ Many of us have experienced an interview that didn't go as \u003cu class=\"p-u\">well\u003c/u> as we had hoped.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">①\u003c/div>\u003cdiv class=\"p-op\">②\u003c/div>\u003cdiv class=\"p-op\">③\u003c/div>\u003cdiv class=\"p-op\">④\u003c/div>\u003cdiv class=\"p-op\">⑤\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">① 확인\u003c/b>more가 \u003cb class=\"key\">spoke\u003c/b>를 꾸미는데 형용사 confident가 왔습니다. 부사 \u003cb class=\"key\">confidently\u003c/b>로 고쳐야 합니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">② 확인\u003c/b>advertised를 꾸미는 부사 well 뒤에 enough가 온 \u003cb class=\"key\">well enough\u003c/b>는 알맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">③ 확인\u003c/b>nearly는 거의라는 뜻으로 \u003cb class=\"key\">drove\u003c/b>를 꾸미므로 알맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">④ 확인\u003c/b>take the bad news calmly에서 calmly는 \u003cb class=\"key\">동사 take\u003c/b>를 꾸미는 부사로 알맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-4\">\u003cb class=\"l\">⑤ 확인\u003c/b>as ~ as 사이에는 \u003cb class=\"key\">부사 well\u003c/b>이 와야 하므로 알맞습니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ①\u003c/span>\u003cdiv class=\"p-full\">He spoke more confidently than usual during the presentation.\u003c/div>\u003cdiv class=\"p-ko\">그는 발표하는 동안 평소보다 더 자신감 있게 말했다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>more 뒤에는 무조건 형용사가 온다고 생각하는 것\u003c/div>","segs":[{"n":41,"text":"첫 번째 문장을 보세요. more가 동사 spoke를 꾸미고 있으니 뒤에는 부사가 와야 합니다. confident가 아니라 confidently가 맞아요.","hl":"st-0"},{"n":42,"text":"두 번째는 well enough인데, 부사 뒤에 enough가 온 올바른 어순이라 문제가 없습니다.","hl":"st-1"},{"n":43,"text":"세 번째 nearly는 거의라는 뜻으로 동사 drove를 꾸며 주니 맞습니다.","hl":"st-2"},{"n":44,"text":"네 번째 calmly는 동사 take를 꾸미는 부사라서 알맞아요.","hl":"st-3"},{"n":45,"text":"다섯 번째는 as well as 형태로 원급 사이에 부사가 잘 들어가 있습니다.","hl":"st-4"},{"n":46,"text":"이 문제의 함정도 짚고 갈게요. more 뒤에는 무조건 형용사가 온다고 생각하는 것","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">최상급과 정도 부사 (the least, the very, almost)\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">최상급 앞에는 \u003cb class=\"key\">the\u003c/b>를 쓰고, 가장 ~한은 \u003cb class=\"key\">the least + 형용사\u003c/b>로도 표현합니다. \u003cb class=\"key\">very\u003c/b>는 the와 함께 최상급 앞에 쓸 수 있습니다.\u003cdiv>\u003cspan class=\"g-formula\">the + 최상급 / the least + 형용사 / the very + 최상급\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>최상급 앞 관사 the 필수\u003c/li>\u003cli>the least expensive = 가장 값싼\u003c/li>\u003cli>the very oldest처럼 the와 함께\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">It is the least expensive option.\u003c/div>\u003cdiv class=\"g-ko\">그것은 가장 값싼 선택이다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">This is the very best way.\u003c/div>\u003cdiv class=\"g-ko\">이것이 바로 최고의 방법이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":47,"text":"최상급 앞에는 관사 the가 반드시 필요합니다. 그리고 가장 ~한을 최상급 대신 the least로 표현할 수도 있어요. the least expensive는 가장 값싼이라는 뜻입니다. very를 최상급 앞에 쓸 때는 the very oldest처럼 the와 함께 써야 자연스러워요. 관사 하나가 빠져도 틀린 문장이 되니 꼼꼼히 보세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 7 / 20\u003c/span>\u003cspan class=\"g-kind\">틀린 것 고르기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">7\u003c/span>다음 중 어법상 틀린 문장끼리 짝지어진 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">ⓐ We can never know how nearly the record was to reality.\u003cbr>ⓑ I chose the least expensive airlines for my journey across South America.\u003cbr>ⓒ We are trying to provide as new a customer service as possible.\u003cbr>ⓓ Very oldest church in the city dates back to the 19th century.\u003cbr>ⓔ The few buildings that were almost finished still had numerous problems.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① ⓐ, ⓒ\u003c/div>\u003cdiv class=\"p-op\">② ⓐ, ⓓ\u003c/div>\u003cdiv class=\"p-op\">③ ⓑ, ⓓ\u003c/div>\u003cdiv class=\"p-op\">④ ⓑ, ⓒ, ⓔ\u003c/div>\u003cdiv class=\"p-op\">⑤ ⓒ, ⓓ, ⓔ\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">②\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":48,"text":"일곱 번째 문제는 다섯 문장 중 틀린 것을 두 개 골라 짝지은 선택지를 찾는 문제예요. 최상급과 정도 부사를 중심으로 보세요.","hl":"q"},{"n":49,"text":"","hl":"q","pause":7},{"n":50,"text":"정답은 두 번째 선택지입니다. a는 nearly를 near로, d는 Very oldest를 the oldest로 고쳐야 하니까요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 7 / 20\u003c/span>\u003cspan class=\"g-kind\">틀린 것 고르기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">7\u003c/span>다음 중 어법상 틀린 문장끼리 짝지어진 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">ⓐ We can never know how nearly the record was to reality.\u003cbr>ⓑ I chose the least expensive airlines for my journey across South America.\u003cbr>ⓒ We are trying to provide as new a customer service as possible.\u003cbr>ⓓ Very oldest church in the city dates back to the 19th century.\u003cbr>ⓔ The few buildings that were almost finished still had numerous problems.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① ⓐ, ⓒ\u003c/div>\u003cdiv class=\"p-op\">② ⓐ, ⓓ\u003c/div>\u003cdiv class=\"p-op\">③ ⓑ, ⓓ\u003c/div>\u003cdiv class=\"p-op\">④ ⓑ, ⓒ, ⓔ\u003c/div>\u003cdiv class=\"p-op\">⑤ ⓒ, ⓓ, ⓔ\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">ⓐ 확인\u003c/b>nearly는 거의라는 뜻이라 ~에 가깝다를 표현할 수 없습니다. \u003cb class=\"key\">near\u003c/b> 또는 \u003cb class=\"key\">close to\u003c/b>로 고쳐야 하므로 틀린 문장입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">ⓑ 확인\u003c/b>\u003cb class=\"key\">the least expensive\u003c/b>는 가장 값싼이라는 최상급 표현으로 알맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">ⓒ 확인\u003c/b>\u003cb class=\"key\">as + 형용사 + a + 명사 + as possible\u003c/b> 어순을 지켰으므로 어법상 문제가 없습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">ⓓ 확인\u003c/b>최상급 앞에 관사 \u003cb class=\"key\">the\u003c/b>가 없고 Very도 그대로는 안 됩니다. \u003cb class=\"key\">the oldest\u003c/b> 또는 \u003cb class=\"key\">the very oldest\u003c/b>로 고쳐야 하므로 틀린 문장입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-4\">\u003cb class=\"l\">ⓔ 확인\u003c/b>almost는 nearly와 달리 \u003cb class=\"key\">형용사 finished\u003c/b>를 꾸밀 수 있고 The few buildings도 알맞습니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ②\u003c/span>\u003cdiv class=\"p-full\">We can never know how near the record was to reality. / The oldest church in the city dates back to the 19th century.\u003c/div>\u003cdiv class=\"p-ko\">우리는 그 기록이 현실에 얼마나 가까웠는지 결코 알 수 없다. / 그 도시에서 가장 오래된 교회는 19세기로 거슬러 올라간다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>almost와 nearly를 항상 바꿔 쓸 수 있다고 생각하는 것\u003c/div>","segs":[{"n":51,"text":"a에서 nearly는 거의라는 뜻이에요. ~에 가깝다라는 의미로는 쓸 수 없으니 near나 close to로 고쳐야 합니다.","hl":"st-0"},{"n":52,"text":"b는 the least expensive, 즉 가장 값싼이라는 최상급 표현이 제대로 쓰였습니다.","hl":"st-1"},{"n":53,"text":"c는 as new a customer service as possible로 원급 어순을 잘 지켰어요.","hl":"st-2"},{"n":54,"text":"d는 최상급 oldest 앞에 the가 빠졌고 Very도 그대로 쓸 수 없어요. the oldest나 the very oldest로 고쳐야 합니다.","hl":"st-3"},{"n":55,"text":"e의 almost는 형용사 finished를 꾸밀 수 있어서 문제가 없습니다.","hl":"st-4"},{"n":56,"text":"이 문제의 함정도 짚고 갈게요. almost와 nearly를 항상 바꿔 쓸 수 있다고 생각하는 것","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">비교급·최상급 강조 부사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">비교급 앞에는 \u003cb class=\"key\">much, far, a lot, even, still, (by) far\u003c/b>를 쓰고 \u003cb class=\"key\">very\u003c/b>는 쓸 수 없습니다. very는 원급만 강조합니다.\u003cdiv>\u003cspan class=\"g-formula\">much + 비교급 / very + 원급\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>very better (X) → much better\u003c/li>\u003cli>최상급 앞에는 (by) far, much\u003c/li>\u003cli>even, still도 비교급 강조\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">This is much better than that.\u003c/div>\u003cdiv class=\"g-ko\">이것이 저것보다 훨씬 낫다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">She is very kind.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 매우 친절하다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":57,"text":"비교급을 강조할 때 very를 쓰면 안 됩니다. very는 원급만 강조하는 부사예요. 비교급 앞에는 much, far, a lot, even, still 같은 표현을 씁니다. 문제에서는 very better, very more actionable처럼 very를 끼워 넣어 틀리게 만드는 경우가 정말 많아요. 비교급이 보이면 very를 의심하세요.","hl":"rule"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">문장에 맞는 품사와 비교·최상급 형태\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">be동사나 목적격보어 자리에는 \u003cb class=\"key\">형용사\u003c/b>, 동사·분사를 꾸미면 \u003cb class=\"key\">부사\u003c/b>, the 뒤에서는 \u003cb class=\"key\">최상급\u003c/b>을 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">be동사 + 형용사 / 동사 + 부사 / the + 최상급\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>make + 목적어 + 형용사 (different)\u003c/li>\u003cli>responding positively (동사 수식 부사)\u003c/li>\u003cli>the best answer (최상급)\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Staying calm helps you respond positively.\u003c/div>\u003cdiv class=\"g-ko\">침착함을 유지하면 긍정적으로 반응하게 된다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">This is the best answer.\u003c/div>\u003cdiv class=\"g-ko\">이것이 최선의 답이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":58,"text":"빈칸에 형태를 바꿔 넣을 때는 그 자리에 형용사가 필요한지 부사가 필요한지부터 판단해야 합니다. be동사나 make의 목적격보어 자리, 명사 앞이면 형용사고, 동사를 꾸미면 부사예요. the가 앞에 있으면 최상급, than이 있으면 비교급으로 형태를 바꿉니다. 자리와 신호어를 함께 보면 형태가 저절로 정해져요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 8 / 20\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">8\u003c/span>다음 글의 밑줄 친 부분 중 어법상 틀린 것을 두 개 찾아 바르게 고치시오.\u003c/div>\u003cdiv class=\"p-psg\">The surest way to feel unhappy is to compare yourself to other people. No matter how ⓐ \u003cu class=\"p-u\">successfully\u003c/u> you are, someone is more successful. Focus on what they have or what they seem to have and your life will get ⓑ \u003cu class=\"p-u\">worse and worse\u003c/u>. Instead, focus on what you have. You may find that your life is ⓒ \u003cu class=\"p-u\">very\u003c/u> better than you think. Comparison has never made man happy, nor will it ever.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">ⓐ successfully → successful, ⓒ very → much\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":59,"text":"여덟 번째 문제는 지문에서 틀린 부분 두 개를 찾아 고치는 문제예요. how 뒤와 비교급 앞을 집중해서 보세요.","hl":"q"},{"n":60,"text":"","hl":"q","pause":7},{"n":61,"text":"정답은 successfully를 successful로, very를 much로 고치는 것입니다. how 뒤는 형용사가 와야 하고, 비교급 better 앞에는 much를 써야 하기 때문이에요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 8 / 20\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">8\u003c/span>다음 글의 밑줄 친 부분 중 어법상 틀린 것을 두 개 찾아 바르게 고치시오.\u003c/div>\u003cdiv class=\"p-psg sm\">The surest way to feel unhappy is to compare yourself to other people. No matter how ⓐ \u003cu class=\"p-u\">successfully\u003c/u> you are, someone is more successful. Focus on what they have or what they seem to have and your life will get ⓑ \u003cu class=\"p-u\">worse and worse\u003c/u>. Instead, focus on what you have. You may find that your life is ⓒ \u003cu class=\"p-u\">very\u003c/u> better than you think. Comparison has never made man happy, nor will it ever.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">ⓐ 확인\u003c/b>No matter how 뒤에는 \u003cb class=\"key\">형용사\u003c/b>가 uations where it can backfire. Both men and women who look good might run into jealousy when they seek job opportunities. One study found that if you are interviewed by someone of the same sex, you may have a ⓑ \u003cu class=\"p-u\">lower\u003c/u> chance of being recruited if they judge that you are more attractive than ⓒ \u003cu class=\"p-u\">they do\u003c/u>.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">ⓐ mostly → most, ⓒ they do → they are\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":68,"text":"아홉 번째 문제도 틀린 부분 두 개를 고치는 문제예요. 명사 앞인지, 형용사를 받는 자리인지 확인해 보세요.","hl":"q"},{"n":69,"text":"","hl":"q","pause":7},{"n":70,"text":"정답은 mostly를 most로, they do를 they are로 고치는 것입니다. 명사 앞에는 형용사 most가 와야 하고, 형용사를 받을 때는 be동사를 쓰기 때문이에요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 9 / 20\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">9\u003c/span>다음 글의 밑줄 친 부분 중 어법상 틀린 것을 두 개 찾아 바르게 고치시오.\u003c/div>\u003cdiv class=\"p-psg sm\">Though beauty pays in ⓐ \u003cu class=\"p-u\">mostly\u003c/u> circumstances, there are still situations where it can backfire. Both men and women who look good might run into jealousy when they seek job opportunities. One study found that if you are interviewed by someone of the same sex, you may have a ⓑ \u003cu class=\"p-u\">lower\u003c/u> chance of being recruited if they judge that you are more attractive than ⓒ \u003cu class=\"p-u\">they do\u003c/u>.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">ⓐ 확인\u003c/b>circumstances는 명사이므로 대부분의라는 \u003cb class=\"key\">형용사 most\u003c/b>가 와야 합니다. mostly는 부사입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb clas from winds on the ground? &quot;Winds&quot; refers to the air flow from a region of higher pressure to a region of lower pressure. The air flow is slowed down by the friction between air and the adjacent objects. Obstacles near the ground disrupt air flow, ⓓ \u003cu class=\"p-u\">causing\u003c/u> a larger frictional force; hence, air flow near the ground is slower. On the contrary, there is less friction at a higher place which is ⓔ \u003cu class=\"p-u\">more exposed\u003c/u>. The air flows faster and hence stronger winds. So you can say; \u003cu class=\"p-u\">높은 곳일수록, 바람은 더 강하다.\u003c/u>\u003cbr>(1) 윗글의 밑줄 친 부분 중 어법상 어색한 것을 고르시오.\u003cbr>(2) 윗글의 밑줄 친 우리말과 일치하도록 조건에 맞게 영작하시오. 보기: the, high, the, strong, the place, the wind\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① ⓐ\u003c/div>\u003cdiv class=\"p-op\">② ⓑ\u003c/div>\u003cdiv class=\"p-op\">③ ⓒ\u003c/div>\u003cdiv class=\"p-op\">④ ⓓ\u003c/div>\u003cdiv class=\"p-op\">⑤ ⓔ\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">(1) ③ / (2) the higher the place (is), the stronger the wind (is)\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":139,"text":"열여덟 번째 문제는 지문 어법과 영작이 함께 나오는 문제예요. 먼저 다섯 군데 밑줄을 하나씩 확인해 보세요.","hl":"q"},{"n":140,"text":"","hl":"q","pause":7},{"n":141,"text":"어법상 어색한 것은 세 번째, differently가 쓰인 부분입니다. 형용사 different로 고쳐야 하고, 영작은 the higher the place, the stronger the wind로 쓰면 됩니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 18 / 20\u003c/span>\u003cspan class=\"g-kind\">지문 어법 + 영작\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">18\u003c/span>다음 글을 읽고, 각 물음에 답하시오.\u003c/div>\u003cdiv class=\"p-psg sm\">You may be aware that while hiking in the countryside, winds up a hill are usually found to be stronger than ⓐ \u003cu class=\"p-u\">those\u003c/u> at lower elevations. If you're flying a kite, you may find that the kite may easily fall if it is close to the ground, while it will become steady if it is lifted ⓑ \u003cu class=\"p-u\">high enough\u003c/u>. What makes the winds at high levels ⓒ \u003cu class=\"p-u\">differently\u003c/u> from winds on the ground? &quot;Winds&quot; refers to the air flow from a region of higher pressure to a region of lower pressure. The air flow is slowed down by the friction between air and the adjacent objects. Obstacles near the ground disrupt air flow, ⓓ \u003cu class=\"p-u\">causing\u003c/u> a larger frictional force; hence, air flow near the ground is slower. On the contrary, there is less friction at a higher place which is ⓔ \u003cu class=\"p-u\">more exposed\u003c/u>. The air flows faster and hence stronger winds. So you can say; \u003cu class=\"p-u\">높은 곳일수록, 바람은 더 강하다.\u003c/u>\u003cbr>(1) 윗글의 밑줄 친 부분 중 어법상 어색한 것을 고르시오.\u003cbr>(2) 윗글의 밑줄 친 우리말과 일치하도록 조건에 맞게 영작하시오. 보기: the, high, the, strong, the place, the wind\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① ⓐ\u003c/div>\u003cdiv class=\"p-op\">② ⓑ\u003c/div>\u003cdiv class=\"p-op\">③ ⓒ\u003c/div>\u003cdiv class=\"p-op\">④ ⓓ\u003c/div>\u003cdiv class=\"p-op\">⑤ ⓔ\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">(1) ⓐ 확인\u003c/b>those는 앞에 나온 복수명사 \u003cb class=\"key\">winds\u003c/b>를 대신하는 지시대명사로 알맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">(1) ⓑ 확인\u003c/b>\u003cb class=\"key\">high enough\u003c/b>는 부사 뒤에 enough가 온 올바른 어순입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">(1) ⓒ 확인\u003c/b>make + 목적어 + \u003cb class=\"key\">형용사\u003c/b> 구문이므로 differently를 \u003cb class=\"key\">different\u003c/b>로 고쳐야 합니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">(1) ⓓ, ⓔ 확인\u003c/b>ⓓ causing은 \u003cb class=\"key\">분사구문\u003c/b>으로, ⓔ more exposed는 비교급으로 모두 알맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-4\">\u003cb class=\"l\">(2) 구문 잡기\u003c/b>\u003cb class=\"key\">the + 비교급 + 주어 + 동사, the + 비교급 + 주어 + 동사\u003c/b> 구문으로 만듭니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-5\">\u003cb class=\"l\">(2) 완성\u003c/b>the higher the place (is), the stronger the wind (is) 순서로 배열합니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 (1) ③ / (2) the higher the place (is), the stronger the wind (is)\u003c/span>\u003cdiv class=\"p-full\">What makes the winds at high levels different from winds on the ground? / The higher the place is, the stronger the wind is.\u003c/div>\u003cdiv class=\"p-ko\">높은 곳일수록 바람은 더 강하다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>the 비교급 구문에서 한쪽 the를 빠뜨리는 실수\u003c/div>","segs":[{"n":142,"text":"먼저 a의 those는 앞에 나온 winds를 대신하는 표현이라 알맞습니다.","hl":"st-0"},{"n":143,"text":"b는 부사 high 뒤에 enough가 온 올바른 형태예요.","hl":"st-1"},{"n":144,"text":"c는 make 뒤에 목적어가 오고 그 상태를 설명하는 자리예요. 그 자리에는 형용사가 와야 하므로 differently가 아니라 different입니다.","hl":"st-2"},{"n":145,"text":"d의 causing은 분사구문이라 맞고, e의 more exposed도 비교급이라 문제가 없습니다.","hl":"st-3"},{"n":146,"text":"우리말 영작은 the 비교급 the 비교급 구문으로 만듭니다. 양쪽에 the를 붙이는 게 핵심이에요.","hl":"st-4"},{"n":147,"text":"보기 단어를 순서대로 놓으면 the higher the place, the stronger the wind가 됩니다. 주어와 동사는 생략해도 괜찮아요.","hl":"st-5"},{"n":148,"text":"이 문제의 함정도 짚고 갈게요. the 비교급 구문에서 한쪽 the를 빠뜨리는 실수","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 19 / 20\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">19\u003c/span>다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?\u003c/div>\u003cdiv class=\"p-psg\">The law of diminishing marginal utility states that as more of a good is consumed, the additional satisfaction from another bite will ① \u003cu class=\"p-u\">eventually\u003c/u> decline. The marginal utility is the satisfaction gained from each additional bite. The more of the good is consumed, ② \u003cu class=\"p-u\">less\u003c/u> additional satisfaction we gain from consuming another unit. Thus even if a good were free and you could consume ③ \u003cu class=\"p-u\">as much as\u003c/u> you wanted, there would be a limit to the amount you would consume due to the law of diminishing marginal utility. Summing the marginal utilities ④ \u003cu class=\"p-u\">gives\u003c/u> us the total utility. For example, let's say the first chocolate had a marginal utility of 85 and the second chocolate had a marginal utility of 79. Then, the total utility from consuming two chocolates is 164. ⑤ \u003cu class=\"p-u\">As long as\u003c/u> our marginal utility is positive, our total utility increases.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">①\u003c/div>\u003cdiv class=\"p-op\">②\u003c/div>\u003cdiv class=\"p-op\">③\u003c/div>\u003cdiv class=\"p-op\">④\u003c/div>\u003cdiv class=\"p-op\">⑤\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">②\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":149,"text":"열아홉 번째 문제는 지문 어법 문제예요. 특히 더 많이 소비될수록이라는 표현의 짝을 잘 살펴보세요.","hl":"q"},{"n":150,"text":"","hl":"q","pause":7},{"n":151,"text":"정답은 두 번째입니다. the 비교급 the 비교급 구문이므로 less 앞에 the가 반드시 있어야 해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 19 / 20\u003c/span>\u003cspan class=\"g-kind\">지문 어법\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">19\u003c/span>다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?\u003c/div>\u003cdiv class=\"p-psg sm\">The law of diminishing marginal utility states that as more of a good is consumed, the additional satisfaction from another bite will ① \u003cu class=\"p-u\">eventually\u003c/u> decline. The marginal utility is the satisfaction gained from each additional bite. The more of the good is consumed, ② \u003cu class=\"p-u\">less\u003c/u> additional satisfaction we gain from consuming another unit. Thus even if a good were free and you could consume ③ \u003cu class=\"p-u\">as much as\u003c/u> you wanted, there would be a limit to the amount you would consume due to the law of diminishing marginal utility. Summing the marginal utilities ④ \u003cu class=\"p-u\">gives\u003c/u> us the total utility. For example, let's say the first chocolate had a marginal utility of 85 and the second chocolate had a marginal utility of 79. Then, the total utility from consuming two chocolates is 164. ⑤ \u003cu class=\"p-u\">As long as\u003c/u> our marginal utility is positive, our total utility increases.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">①\u003c/div>\u003cdiv class=\"p-op\">②\u003c/div>\u003cdiv class=\"p-op\">③\u003c/div>\u003cdiv class=\"p-op\">④\u003c/div>\u003cdiv class=\"p-op\">⑤\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">① 확인\u003c/b>eventually는 결국이라는 부사로 decline을 꾸며 알맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">② 확인\u003c/b>앞이 \u003cb class=\"key\">The more\u003c/b>로 시작하는 the 비교급 구문이므로 뒤도 \u003cb class=\"key\">the less\u003c/b>가 되어야 합니다. the가 빠져 틀렸습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">③ 확인\u003c/b>\u003cb class=\"key\">as much as\u003c/b> you wanted는 양을 나타내는 원급 비교로 알맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">④ 확인\u003c/b>동명사 주어 \u003cb class=\"key\">Summing\u003c/b>은 단수 취급하므로 gives가 알맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-4\">\u003cb class=\"l\">⑤ 확인\u003c/b>\u003cb class=\"key\">As long as\u003c/b>는 ~하는 한이라는 조건 접속사로 알맞습니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ②\u003c/span>\
