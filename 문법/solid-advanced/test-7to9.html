}
window.__LP=lecturePlayer(document.getElementById("app"),{"brand":"Check Up","title":"누적 TEST Chapters 7-9","audioDir":"test-7to9_audio","preview":false,"count":117,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">어법 종합(명사절·분사·도치·병렬·강조구문·대명사 일치)\u003c/div>\u003ch1>누적 TEST Chapters 7-9 어법 문제풀이\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘 풀 문제\u003c/b>10문제 · 틀린 것 고르기, 맞는 문장 개수 고르기, 틀린 부분 고치기, 지문 어법 서술형, 배열 서술형, 지문 어법 틀린 것 고르기, 영작 서술형\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 누적 테스트 일곱 장부터 아홉 장까지, 어법 문제 열 개를 한 번에 정리해 볼 거예요. 지문 속 밑줄 친 부분을 하나씩 확인하면서 시험에 자주 나오는 함정까지 같이 짚어 드릴게요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">명사절 접속사 that\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">think, believe, know 같은 동사의 목적어 자리에 \u003cb class=\"key\">완전한 문장\u003c/b>이 오면 접속사 \u003cb class=\"key\">that\u003c/b>을 쓴다.\u003cdiv>\u003cspan class=\"g-formula\">동사 + that + 주어 + 동사 ~\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>that 뒤에는 주어와 동사가 다 있는 완전한 절이 온다\u003c/li>\u003cli>that절은 목적어 역할이므로 생략할 수 있다\u003c/li>\u003cli>전치사 뒤에는 that절을 쓸 수 없다\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Many experts think that it originated in ancient Greece.\u003c/div>\u003cdiv class=\"g-ko\">많은 전문가들은 그것이 고대 그리스에서 시작되었다고 생각한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"먼저 접속사 that부터 볼게요. think나 believe, know 같은 동사 뒤에 완전한 문장이 통째로 목적어로 들어올 때, 그 문장 앞에 that을 붙여 줍니다. 여기서 포인트는 that 뒤에 주어와 동사가 다 갖춰져 있느냐예요. 주어나 목적어가 빠져 있으면 that이 아니라 관계대명사나 what을 써야 하죠. 또 that은 목적어 역할만 하니까 생략해도 뜻은 그대로예요.","hl":"rule"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">동명사와 병렬 구조\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">전치사의 목적어 자리에는 \u003cb class=\"key\">동명사\u003c/b>를 쓰고, and나 but으로 이어지는 자리는 \u003cb class=\"key\">같은 형태\u003c/b>로 맞춘다.\u003cdiv>\u003cspan class=\"g-formula\">전치사 + 동명사(ing) / A and B는 같은 품사·형태\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>전치사 뒤 동사는 반드시 ing 형태\u003c/li>\u003cli>and, but, or 앞뒤는 같은 품사와 형태\u003c/li>\u003cli>앞이 동명사면 뒤도 동명사, 앞이 to부정사면 뒤도 to부정사\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The gyms were not only for physical education, but also for training their brains.\u003c/div>\u003cdiv class=\"g-ko\">그 체육관은 체육 교육뿐만 아니라 두뇌 훈련을 위한 것이었다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">Dancing, sculpting, and painting were all very popular.\u003c/div>\u003cdiv class=\"g-ko\">춤추기, 조각하기, 그리고 그림 그리기는 모두 매우 인기가 있었다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":3,"text":"전치사 뒤에는 동명사를 쓴다는 규칙, 다들 아시죠? for physical education and for training their brains처럼 전치사 for가 나오면 동사는 반드시 ing 형태로 바꿔야 합니다. 그리고 and나 but으로 이어지는 자리는 앞과 똑같은 형태로 맞춰 주세요. 앞이 동명사면 뒤도 동명사, 앞이 to부정사면 뒤도 to부정사예요. 시험에서는 이 병렬 자리에 일부러 다른 형태를 넣어서 틀린 답으로 만듭니다.","hl":"rule"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">형용사와 부사의 구별\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">감각동사\u003c/b>(look, sound, feel, taste, smell)와 be동사 뒤에는 \u003cb class=\"key\">형용사\u003c/b>가 오고, as ~ as 사이에도 형용사나 부사의 원급이 온다.\u003cdiv>\u003cspan class=\"g-formula\">감각동사 + 형용사 / as + 형용사 + as\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>look + 형용사는 주어의 상태를 설명\u003c/li>\u003cli>부사는 동사·형용사·다른 부사를 수식\u003c/li>\u003cli>as와 as 사이에는 원급, 주어의 상태를 말할 때는 형용사\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The sport looked a lot different.\u003c/div>\u003cdiv class=\"g-ko\">그 스포츠는 훨씬 달라 보였다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">They were as steep as today's coasters.\u003c/div>\u003cdiv class=\"g-ko\">그것들은 오늘날의 롤러코스터만큼 가팔랐다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":4,"text":"look, sound, feel, taste, smell, 이 다섯 개를 감각동사라고 부르죠. 감각동사 뒤에는 부사가 아니라 형용사가 옵니다. 주어가 어떤 상태인지 설명해 주는 역할이기 때문이에요. 그래서 look different라고 해야 하고 look differently는 틀린 표현이 됩니다. 또 as와 as 사이에도 형용사나 부사의 원급이 오는데, 주어의 상태를 말할 때는 형용사를 씁니다.","hl":"rule"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">과거분사 후치수식\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">명사 뒤에 붙은 \u003cb class=\"key\">과거분사\u003c/b>는 \u003cb class=\"key\">수동\u003c/b>의 의미로 앞의 명사를 꾸며 준다.\u003cdiv>\u003cspan class=\"g-formula\">명사 + 과거분사(-ed) = who/which is(was) + 과거분사\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>a doctor called Jahn = a doctor who was called Jahn\u003c/li>\u003cli>현재분사는 능동의 의미로 ~하는\u003c/li>\u003cli>명사 뒤 분사는 관계대명사절의 축약형\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Modern gymnastics was invented by a German doctor called Friedrich Ludwig Jahn.\u003c/div>\u003cdiv class=\"g-ko\">현대 체조는 프리드리히 루트비히 얀이라고 불리는 독일 의사에 의해 발명되었다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":5,"text":"명사 뒤에 붙은 과거분사는 수동의 뜻으로 앞의 명사를 꾸며 줍니다. a German doctor called Friedrich Ludwig Jahn은 독일인 의사인데, 그가 불리는 이름이 프리드리히 루트비히 얀이라는 뜻이에요. 이걸 관계대명사절로 풀면 who was called가 됩니다. 반대로 현재분사는 능동의 뜻으로 ~하는이라고 해석한다는 것도 같이 기억해 두세요.","hl":"rule"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">관계대명사 which의 계속적 용법\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">쉼표 뒤의 \u003cb class=\"key\">which\u003c/b>는 앞 명사나 \u003cb class=\"key\">앞 문장 전체\u003c/b>를 이어 받아 설명한다.\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>계속적 용법의 which는 that으로 바꿀 수 없다\u003c/li>\u003cli>which is why ~ 는 그래서 ~이다\u003c/li>\u003cli>앞 절 전체를 받으면 단수 취급\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Jahn believed physical education was important, which is why he created modern gymnastics.\u003c/div>\u003cdiv class=\"g-ko\">얀은 체육이 중요하다고 믿었고, 그런 이유로 현대 체조를 만들었다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":6,"text":"쉼표 뒤에 나오는 which는 계속적 용법이라고 해서, 앞에 나온 명사나 앞 문장 전체를 이어서 설명해 줍니다. 이때는 that으로 바꿀 수 없다는 점이 중요해요. 여기서는 앞 문장 전체를 받아서 그래서 그것이 이유다, 즉 which is why로 자연스럽게 이어집니다. 해석은 앞에서부터 순서대로 하면 됩니다.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 것 고르기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">1\u003c/span>다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?\u003c/div>\u003cdiv class=\"p-psg\">It is difficult to put an exact date on when gymnastics started, but many experts think ① \u003cu class=\"p-u\">that\u003c/u> it originated in ancient Greece. It is thought that the purpose for gymnastics training during this time was to prepare young men for war. At the time, the gyms that the Greeks trained in were not only for physical education, but also for ② \u003cu class=\"p-u\">training\u003c/u> their brains. In ancient gymnastics, the sport looked a lot ③ \u003cu class=\"p-u\">differently\u003c/u> than it does today. Modern gymnastics, as we know it today, was invented by a German doctor ④ \u003cu class=\"p-u\">called\u003c/u> Friedrich Ludwig Jahn in the 1800s. Jahn believed that physical education was important for our health and our national identity, ⑤ \u003cu class=\"p-u\">which\u003c/u> is why he created modern gymnastics. He invented much of the equipment we use today. This has led to him being thought of as the “father of gymnastics.”\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① that\u003c/div>\u003cdiv class=\"p-op\">② training\u003c/div>\u003cdiv class=\"p-op\">③ differently\u003c/div>\u003cdiv class=\"p-op\">④ called\u003c/div>\u003cdiv class=\"p-op\">⑤ which\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">③\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":7,"text":"첫 번째 문제는 체조의 역사에 대한 글이에요. 다섯 군데 밑줄 중 하나만 틀렸다는 말이니까, 동사 뒤의 형태와 전치사 뒤의 형태, 그리고 감각동사 뒤를 눈여겨보면서 읽어 주세요.","hl":"q"},{"n":8,"text":"","hl":"q","pause":7},{"n":9,"text":"정답은 세 번째, differently입니다. look은 감각동사라서 뒤에 형용사 different가 와야 하고, 나머지 네 곳은 모두 어법에 맞습니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 것 고르기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">1\u003c/span>다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?\u003c/div>\u003cdiv class=\"p-psg sm\">It is difficult to put an exact date on when gymnastics started, but many experts think ① \u003cu class=\"p-u\">that\u003c/u> it originated in ancient Greece. It is thought that the purpose for gymnastics training during this time was to prepare young men for war. At the time, the gyms that the Greeks trained in were not only for physical education, but also for ② \u003cu class=\"p-u\">training\u003c/u> their brains. In ancient gymnastics, the sport looked a lot ③ \u003cu class=\"p-u\">differently\u003c/u> than it does today. Modern gymnastics, as we know it today, was invented by a German doctor ④ \u003cu class=\"p-u\">called\u003c/u> Friedrich Ludwig Jahn in the 1800s. Jahn believed that physical education was important for our health and our national identity, ⑤ \u003cu class=\"p-u\">which\u003c/u> is why he created modern gymnastics. He invented much of the equipment we use today. This has led to him being thought of as the “father of gymnastics.”\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① that\u003c/div>\u003cdiv class=\"p-op\">② training\u003c/div>\u003cdiv class=\"p-op\">③ differently\u003c/div>\u003cdiv class=\"p-op\">④ called\u003c/div>\u003cdiv class=\"p-op\">⑤ which\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">① that 확인\u003c/b>experts think 뒤에 it originated in ancient Greece라는 \u003cb class=\"key\">완전한 절\u003c/b>이 오므로 목적어를 이끄는 접속사 that이 맞다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">② training 확인\u003c/b>전치사 for의 목적어이므로 \u003cb class=\"key\">동명사\u003c/b> training이 맞고, for physical education과도 형태가 나란하다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">③ differently 확인\u003c/b>look은 \u003cb class=\"key\">감각동사\u003c/b>라서 뒤에 \u003cb class=\"key\">형용사\u003c/b>가 와야 하므로 differently가 아니라 different가 맞다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">④ called 확인\u003c/b>a German doctor를 뒤에서 꾸며 주는 \u003cb class=\"key\">과거분사\u003c/b>로, 수동의 의미이므로 맞다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-4\">\u003cb class=\"l\">⑤ which 확인\u003c/b>쉼표 뒤 which가 앞 절 전체를 받아 which is why ~ 구조를 만든 경우로 맞다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ③\u003c/span>\u003cdiv class=\"p-full\">In ancient gymnastics, the sport looked a lot different than it does today.\u003c/div>\u003cdiv class=\"p-ko\">고대 체조에서 그 스포츠는 오늘날과는 많이 달라 보였다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>감각동사 look 뒤에 해석이 자연스럽다는 이유로 부사를 쓰는 실수. 상태를 설명할 때는 형용사를 씁니다.\u003c/div>","segs":[{"n":10,"text":"첫 번째로 think 뒤를 보면 주어와 동사가 다 있는 완전한 문장이 통째로 와요. 이럴 때는 목적어를 이끄는 접속사 that을 써야 하니까 여기는 맞습니다.","hl":"st-0"},{"n":11,"text":"두 번째 training은 전치사 for 뒤에 있죠. 전치사 뒤에는 동명사가 오니까 맞고, 앞의 for physical education과도 모양이 잘 나란합니다.","hl":"st-1"},{"n":12,"text":"세 번째를 보세요. look은 감각동사라서 뒤에 형용사가 와야 해요. 그러니까 부사인 differently는 틀렸고 different가 되어야 합니다.","hl":"st-2"},{"n":13,"text":"네 번째 called는 독일 의사라는 명사를 뒤에서 꾸며 주는 과거분사예요. 불리는이라는 수동의 뜻이니까 여기는 맞습니다.","hl":"st-3"},{"n":14,"text":"다섯 번째 which는 쉼표 뒤에서 앞 문장 전체를 받아 그래서 그것이 이유다로 이어 줍니다. 계속적 용법으로 쓰인 거라 맞아요.","hl":"st-4"},{"n":15,"text":"이 문제의 함정도 짚고 갈게요. 감각동사 look 뒤에 해석이 자연스럽다는 이유로 부사를 쓰는 실수. 상태를 설명할 때는 형용사를 씁니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">감탄문 What\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">What + a/an + 형용사 + 명사 + 주어 + 동사\u003c/b> 형태로 명사 덩어리를 강조한다.\u003cdiv>\u003cspan class=\"g-formula\">What + a/an + 형용사 + 명사 + S + V!\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>What은 명사구를 강조, How는 형용사·부사를 강조\u003c/li>\u003cli>a lovely sound처럼 a와 형용사, 명사 순서\u003c/li>\u003cli>감탄문도 주어 + 동사 어순은 그대로\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">What a lovely sound a harp makes!\u003c/div>\u003cdiv class=\"g-ko\">하프가 내는 소리는 정말 아름답구나!\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":16,"text":"감탄문은 두 가지로 나뉘어요. 명사 덩어리를 강조하면 What, 형용사나 부사를 강조하면 How를 씁니다. What a lovely sound a harp makes는 하프가 정말 멋진 소리를 낸다는 뜻으로, What 다음에 관사와 형용사, 명사가 차례로 오죠. 감탄문이라고 해서 어순이 흐트러지는 건 아니고 뒤에는 주어와 동사가 그대로 옵니다.","hl":"rule"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">5형식 목적격보어 to be\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">consider, think, believe는 \u003cb class=\"key\">목적어 + (to be) + 명사·형용사\u003c/b> 형태로 목적격보어를 취한다.\u003cdiv>\u003cspan class=\"g-formula\">consider + 목적어 + (to be) + 명사/형용사\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>consider A (to be) B는 A를 B라고 여기다\u003c/li>\u003cli>to be는 생략 가능\u003c/li>\u003cli>목적격보어 자리에 동사원형은 올 수 없다\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Music experts consider the harp to be one of the oldest instruments.\u003c/div>\u003cdiv class=\"g-ko\">음악 전문가들은 하프를 가장 오래된 악기 중 하나로 여긴다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":17,"text":"consider, think, believe 같은 동사는 목적어 뒤에 목적격보어를 데리고 옵니다. 이때 보어가 명사나 형용사면 to be를 넣어서 consider A to be B, 즉 A를 B라고 여긴다는 형태로 쓸 수 있어요. to be는 생략해도 뜻이 같아서 둘 다 맞는 표현입니다. 대신 목적격보어 자리에 동사원형을 그냥 쓰면 틀려요.","hl":"rule"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">분사구문\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">접속사와 주어가 있는 절을 \u003cb class=\"key\">분사\u003c/b>(-ing/-ed)로 줄여 동시동작이나 결과를 나타낸다.\u003cdiv>\u003cspan class=\"g-formula\">주절 + , + 분사(-ing/-ed) ~\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>주절과 주어가 같으면 주어와 접속사를 생략\u003c/li>\u003cli>능동이면 -ing, 수동이면 -ed\u003c/li>\u003cli>결과는 그래서 ~하게 되다로 해석\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">A harpist can tighten the strings, producing different sounds.\u003c/div>\u003cdiv class=\"g-ko\">하프 연주자는 줄을 팽팽하게 해서 다른 소리를 만들어 낸다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":18,"text":"분사구문은 접속사와 주어가 있는 절을 동사만 ing나 ed로 줄여서 문장에 이어 붙이는 방식이에요. 주절과 주어가 같으면 주어는 생략합니다. 의미가 능동이면 ing, 수동이면 과거분사를 씁니다. 그리고 이렇게 이어진 분사구문은 동시동작이나 결과, 즉 ~하면서 또는 그래서 ~하게 되다로 해석하면 자연스러워요.","hl":"rule"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">도치와 대동사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">앞 내용을 받아 ~도 그렇다고 할 때는 \u003cb class=\"key\">So + (조)동사 + 주어\u003c/b>를 쓰고, 반복되는 동사는 \u003cb class=\"key\">do/does/did\u003c/b>로 대신한다.\u003cdiv>\u003cspan class=\"g-formula\">So + do/does/did + 주어 / 부정어 + 조동사 + 주어 + 동사원형\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>대동사는 주어의 수와 시제에 맞춘다\u003c/li>\u003cli>주어가 단수면 does, 과거면 did\u003c/li>\u003cli>seldom, never 같은 부정어가 문두에 오면 조동사 도치\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">So do I.\u003c/div>\u003cdiv class=\"g-ko\">나도 그래.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">Seldom did they fight in wars.\u003c/div>\u003cdiv class=\"g-ko\">그들은 전쟁에서 거의 싸우지 않았다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":19,"text":"앞 문장과 같은 동작을 반복할 때 do, does, did를 대동사로 씁니다. 예를 들어 앞 사람이 나는 피아노를 친다고 했을 때, 나도 그래요는 So do I라고 하죠. 이때 대동사는 주어의 수와 시제에 맞춰서 does나 did로 바뀔 수 있어요. 그리고 seldom이나 never 같은 부정어가 문장 앞으로 나오면 조동사가 주어 앞으로 나가는 도치가 일어난다는 것도 함께 기억해 두세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 것 고르기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">2\u003c/span>다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?\u003c/div>\u003cdiv class=\"p-psg\">Have you ever heard a harpist play? ① \u003cu class=\"p-u\">What\u003c/u> a lovely sound a harp makes! Music experts consider the harp ② \u003cu class=\"p-u\">to be\u003c/u> one of the oldest instruments. A harp typically has seven pedals on the bottom back, though these pedals are usually not visible to the audience. Many people are surprised to learn about these pedals, which are connected to the strings. By stepping on a particular pedal, a harpist can cause certain strings to tighten or loosen, ③ \u003cu class=\"p-u\">producing\u003c/u> different sounds. So ④ \u003cu class=\"p-u\">do\u003c/u> the way the strings are plucked with the hands. Although harps may appear simple at first glance, they are actually ⑤ \u003cu class=\"p-u\">quite\u003c/u> complicated and require skill to keep in tune. Prior to a performance, a harpist often spends as long as half an hour tuning the harp's strings so that it can produce the correct sounds.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① What\u003c/div>\u003cdiv class=\"p-op\">② to be\u003c/div>\u003cdiv class=\"p-op\">③ producing\u003c/div>\u003cdiv class=\"p-op\">④ do\u003c/div>\u003cdiv class=\"p-op\">⑤ quite\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">④\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":20,"text":"두 번째 문제는 하프에 대한 글이에요. 감탄문, 목적격보어, 분사구문, 그리고 대동사가 나오니까 각각의 자리에 어떤 형태가 와야 하는지 확인하면서 읽어 보세요.","hl":"q"},{"n":21,"text":"","hl":"q","pause":7},{"n":22,"text":"정답은 네 번째입니다. 주어가 the way로 단수이기 때문에 대동사는 does가 되어야 합니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 것 고르기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">2\u003c/span>다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?\u003c/div>\u003cdiv class=\"p-psg sm\">Have you ever heard a harpist play? ① \u003cu class=\"p-u\">What\u003c/u> a lovely sound a harp makes! Music experts consider the harp ② \u003cu class=\"p-u\">to be\u003c/u> one of the oldest instruments. A harp typically has seven pedals on the bottom back, though these pedals are usually not visible to the audience. Many people are surprised to learn about these pedals, which are connected to the strings. By stepping on a particular pedal, a harpist can cause certain strings to tighten or loosen, ③ \u003cu class=\"p-u\">producing\u003c/u> different sounds. So ④ \u003cu class=\"p-u\">do\u003c/u> the way the strings are plucked with the hands. Although harps may appear simple at first glance, they are actually ⑤ \u003cu class=\"p-u\">quite\u003c/u> complicated and require skill to keep in tune. Prior to a performance, a harpist often spends as long as half an hour tuning the harp's strings so that it can produce the correct sounds.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① What\u003c/div>\u003cdiv class=\"p-op\">② to be\u003c/div>\u003cdiv class=\"p-op\">③ producing\u003c/div>\u003cdiv class=\"p-op\">④ do\u003c/div>\u003cdiv class=\"p-op\">⑤ quite\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">① What 확인\u003c/b>What + a + 형용사 + 명사 + 주어 + 동사 어순의 \u003cb class=\"key\">감탄문\u003c/b>으로 맞다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">② to be 확인\u003c/b>consider는 \u003cb class=\"key\">목적격보어\u003c/b>로 to be를 취하므로 consider the harp to be ~가 맞다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">③ producing 확인\u003c/b>앞 절의 결과를 나타내는 \u003cb class=\"key\">분사구문\u003c/b>으로 ~해서 다른 소리를 만들어 낸다는 의미이므로 맞다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">④ do 확인\u003c/b>주어가 the way로 \u003cb class=\"key\">단수\u003c/b>이므로 대동사는 does가 되어야 한다. 따라서 do는 틀렸다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-4\">\u003cb class=\"l\">⑤ quite 확인\u003c/b>quite는 뒤의 형용사 complicated를 수식하는 \u003cb class=\"key\">부사\u003c/b>이므로 맞다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ④\u003c/span>\u003cdiv class=\"p-full\">So does the way the strings are plucked with the hands.\u003c/div>\u003cdiv class=\"p-ko\">손으로 줄을 뜯는 방식도 마찬가지이다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>the way를 의미상 여러 가지로 느껴 do를 고르는 실수. 문법적 주어는 단수 the way입니다.\u003c/div>","segs":[{"n":23,"text":"첫 번째는 감탄문이에요. What 다음에 관사와 형용사, 명사가 오고 주어와 동사가 뒤따르는 형태라서 여기는 맞습니다.","hl":"st-0"},{"n":24,"text":"두 번째 to be는 consider가 목적어 뒤에 보어를 데리고 오는 동사라서 맞아요. to be는 생략해도 되는 형태죠.","hl":"st-1"},{"n":25,"text":"세 번째 producing은 앞 문장 전체를 이어 받아 그 결과 다른 소리를 만들어 낸다는 뜻을 더해 줍니다. 분사구문으로 자연스러운 형태예요.","hl":"st-2"},{"n":26,"text":"네 번째를 보세요. 여기서 주어는 the way, 즉 단수예요. 그래서 대동사는 does가 되어야 합니다. do로 쓴 것은 틀렸습니다.","hl":"st-3"},{"n":27,"text":"다섯 번째 quite는 형용사 complicated를 꾸며 주는 부사입니다. 여기는 아무 문제가 없어요.","hl":"st-4"},{"n":28,"text":"이 문제의 함정도 짚고 갈게요. the way를 의미상 여러 가지로 느껴 do를 고르는 실수. 문법적 주어는 단수 the way입니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">부정대명사 one\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">앞에 나온 \u003cb class=\"key\">셀 수 있는 단수 명사\u003c/b>를 반복하지 않고 \u003cb class=\"key\">one\u003c/b>으로 받는다.\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>복수 명사는 ones\u003c/li>\u003cli>셀 수 없는 명사는 that으로 받는다\u003c/li>\u003cli>heard an owl ~ seen one에서 one은 an owl\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">You have heard an owl rather than seen one.\u003c/div>\u003cdiv class=\"g-ko\">너는 부엉이를 본 것보다는 부엉이 소리를 들었을 가능성이 크다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":29,"text":"앞에 나온 명사를 똑같이 반복하기 싫을 때 쓰는 게 부정대명사 one입니다. 셀 수 있는 단수 명사면 one, 복수면 ones로 받아요. heard an owl rather than seen one은 부엉이를 들었고, 부엉이를 본 것보다는 가능성이 높다는 뜻이죠. 셀 수 없는 명사는 one이 아니라 that으로 받는다는 것도 같이 알아 두세요.","hl":"rule"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">가목적어 it\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">목적어가 \u003cb class=\"key\">to부정사구나 that절\u003c/b>처럼 길면 \u003cb class=\"key\">it\u003c/b>을 목적어 자리에 두고 진목적어를 뒤로 보낸다.\u003cdiv>\u003cspan class=\"g-formula\">make/find/think + it + 형용사 + to부정사\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>가목적어 it은 해석하지 않는다\u003c/li>\u003cli>진목적어는 to부정사나 that절\u003c/li>\u003cli>for + 명사는 to부정사의 의미상 주어\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The darkness makes it harder for them to be seen.\u003c/div>\u003cdiv class=\"g-ko\">어둠은 그들이 보이기 더 어렵게 만든다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":30,"text":"목적어가 to부정사나 that절처럼 길면 문장이 무거워지니까, 목적어 자리에 it을 먼저 놓고 진짜 목적어는 뒤로 보냅니다. 이때 it은 가목적어라고 하고 해석하지 않아요. makes it harder for them to be seen은 그들이 보이게 하는 것을 더 어렵게 만든다, 즉 그들이 보이기 더 어렵게 만든다는 뜻입니다. 목적어 뒤에 형용사 harder가 오고, for them은 to부정사의 의미상 주어 역할을 하죠.","hl":"rule"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">all의 수 일치\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">앞에 나온 \u003cb class=\"key\">복수 명사\u003c/b>를 받는 all은 \u003cb class=\"key\">복수 동사\u003c/b>와 함께 쓴다.\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>Common owls를 받은 all은 복수 취급\u003c/li>\u003cli>all of the + 복수명사는 복수 동사\u003c/li>\u003cli>하나의 전체를 받을 때만 단수 동사\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Common owls have many patterns, but all have a round face.\u003c/div>\u003cdiv class=\"g-ko\">공통부엉이는 무늬가 다양하지만 모두 둥근 얼굴을 가진다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":31,"text":"all은 앞에 나온 복수 명사를 그대로 받아서 모두가라는 뜻으로 쓰일 때 복수 동사를 데리고 옵니다. Common owls are a diverse group인데 all have a round face라고 한 것은, 그 공통부엉이들이 모두 둥근 얼굴을 가졌다는 뜻이에요. all of the 뒤에 복수명사가 오면 역시 복수 동사를 씁니다. 전체를 하나로 보는 단수 명사를 받을 때만 단수 동사를 쓴다는 것도 기억해 두세요.","hl":"rule"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">it ~ that 강조구문\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">It is/was + 강조할 말 + that ~\u003c/b>으로 주어·목적어·부사구를 강조한다.\u003cdiv>\u003cspan class=\"g-formula\">It is/was + 강조어 + that + 나머지\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>강조할 말을 It is와 that 사이에 넣는다\u003c/li>\u003cli>that 뒤에는 강조어가 빠진 불완전한 문장\u003c/li>\u003cli>사람은 who, 사물·부사구는 that\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">It is a light-colored, heart-shaped face that barn owls have.\u003c/div>\u003cdiv class=\"g-ko\">헛간부엉이가 가진 것은 밝은 색의 하트 모양 얼굴이다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">It was under the leadership of a medicine man that the Pueblo planned their attack.\u003c/div>\u003cdiv class=\"g-ko\">푸에블로족이 공격을 계획한 것은 한 주술사의 지도 아래에서였다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":32,"text":"It is나 It was 뒤에 강조하고 싶은 말을 넣고 that으로 이어 주면 그 부분만 콕 집어 강조하는 문장이 됩니다. 주어, 목적어, 부사구까지 강조할 수 있어요. 이때 that 뒤에는 강조한 말이 빠진 불완전한 문장이 옵니다. 사람을 강조하면 who를 쓸 수 있지만, 사물이나 부사구를 강조할 때는 that을 씁니다.","hl":"rule"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">that / those 반복 대명사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">앞 명사를 반복하지 않을 때 \u003cb class=\"key\">단수·셀 수 없는 명사\u003c/b>는 that, \u003cb class=\"key\">복수 명사\u003c/b>는 those로 받는다.\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>The size of the largest owl is as big as that of an eagle\u003c/li>\u003cli>비교 대상의 수를 반드시 맞춘다\u003c/li>\u003cli>of 소유격과 함께 자주 쓰인다\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The size of the largest owl is as big as that of an eagle.\u003c/div>\u003cdiv class=\"g-ko\">가장 큰 부엉이의 크기는 독수리의 크기만큼 크다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":33,"text":"앞에 나온 명사를 반복하지 않고 비교할 때, 단수이거나 셀 수 없는 명사는 that, 복수는 those로 받습니다. The size of the largest owl is as big as that of an eagle은 가장 큰 부엉이의 크기가 독수리의 크기만큼 크다는 뜻이죠. 여기서 비교 대상은 size이므로 단수 that을 써야 합니다. 비교 구문에서는 항상 무엇과 무엇을 비교하는지 수를 맞춰 주세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 3 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 것 고르기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">3\u003c/span>다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?\u003c/div>\u003cdiv class=\"p-psg\">Have you ever heard the sound of an owl in the night? It's more likely that you have heard an owl in the wild rather than seen ① \u003cu class=\"p-u\">one\u003c/u>. Owls are nocturnal, which means that they are active mostly at night. The darkness makes ② \u003cu class=\"p-u\">it\u003c/u> harder for them to be seen by the small animals they hunt. There are more than 175 species of owls, but they are generally divided into two categories—common owls and barn owls. Common owls are a diverse group with many different patterns and colorings, but ③ \u003cu class=\"p-u\">all\u003c/u> have a round face. By contrast, it is a light-colored, heart-shaped face ④ \u003cu class=\"p-u\">that\u003c/u> barn owls have. The size of the largest owl is as big as ⑤ \u003cu class=\"p-u\">those\u003c/u> of an eagle. The smallest is the elf owl, which lives in Mexico and the southwestern United States. It measures only five inches and makes its home in the holes woodpeckers create in large cacti.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① one\u003c/div>\u003cdiv class=\"p-op\">② it\u003c/div>\u003cdiv class=\"p-op\">③ all\u003c/div>\u003cdiv class=\"p-op\">④ that\u003c/div>\u003cdiv class=\"p-op\">⑤ those\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">⑤\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":34,"text":"세 번째 문제는 부엉이에 대한 글이에요. 대명사가 무엇을 받는지, 그리고 비교 구문에서 무엇과 무엇을 비교하는지 표시하면서 읽어 보세요.","hl":"q"},{"n":35,"text":"","hl":"q","pause":7},{"n":36,"text":"정답은 다섯 번째, those입니다. 비교 대상이 단수 명사인 크기이기 때문에 that of an eagle로 받아야 합니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 3 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 것 고르기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">3\u003c/span>다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?\u003c/div>\u003cdiv class=\"p-psg sm\">Have you ever heard the sound of an owl in the night? It's more likely that you have heard an owl in the wild rather than seen ① \u003cu class=\"p-u\">one\u003c/u>. Owls are nocturnal, which means that they are active mostly at night. The darkness makes ② \u003cu class=\"p-u\">it\u003c/u> harder for them to be seen by the small animals they hunt. There are more than 175 species of owls, but they are generally divided into two categories—common owls and barn owls. Common owls are a diverse group with many different patterns and colorings, but ③ \u003cu class=\"p-u\">all\u003c/u> have a round face. By contrast, it is a light-colored, heart-shaped face ④ \u003cu class=\"p-u\">that\u003c/u> barn owls have. The size of the largest owl is as big as ⑤ \u003cu class=\"p-u\">those\u003c/u> of an eagle. The smallest is the elf owl, which lives in Mexico and the southwestern United States. It measures only five inches and makes its home in the holes woodpeckers create in large cacti.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① one\u003c/div>\u003cdiv class=\"p-op\">② it\u003c/div>\u003cdiv class=\"p-op\">③ all\u003c/div>\u003cdiv class=\"p-op\">④ that\u003c/div>\u003cdiv class=\"p-op\">⑤ those\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">① one 확인\u003c/b>앞의 an owl을 대신하는 \u003cb class=\"key\">부정대명사\u003c/b> one으로 맞다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">② it 확인\u003c/b>목적어 자리에 온 \u003cb class=\"key\">가목적어\u003c/b> it이고 진목적어는 to be seen이므로 맞다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">③ all 확인\u003c/b>앞의 Common owls를 받아 모두가라는 뜻의 \u003cb class=\"key\">복수 주어\u003c/b>로 have와 호응하므로 맞다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">④ that 확인\u003c/b>It is ~ that \u003cb class=\"key\">강조구문\u003c/b>으로 a light-colored, heart-shaped face를 강조하므로 맞다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-4\">\u003cb class=\"l\">⑤ those 확인\u003c/b>비교 대상이 The size라는 \u003cb class=\"key\">단수\u003c/b> 명사이므로 those가 아니라 that of an eagle이 되어야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ⑤\u003c/span>\u003cdiv class=\"p-full\">The size of the largest owl is as big as that of an eagle.\u003c/div>\u003cdiv class=\"p-ko\">가장 큰 부엉이의 크기는 독수리의 크기만큼 크다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>앞 명사의 수를 확인하지 않고 무조건 복수 those로 받는 실수. 비교 대상이 size이므로 단수 that입니다.\u003c/div>","segs":[{"n":37,"text":"첫 번째 one은 앞에 나온 부엉이 하나를 그대로 대신하는 말이에요. 셀 수 있는 단수 명사를 받는 부정대명사라서 맞습니다.","hl":"st-0"},{"n":38,"text":"두 번째 it은 목적어 자리에 먼저 놓인 가목적어예요. 진짜 목적어인 to be seen이 뒤에 있으니까 맞습니다.","hl":"st-1"},{"n":39,"text":"세 번째 all은 앞에 나온 공통부엉이들을 받아서 모두가라는 뜻으로 쓰였어요. 복수라서 have와 잘 맞습니다.","hl":"st-2"},{"n":40,"text":"네 번째는 강조구문이에요. 하트 모양 얼굴이라는 부분을 콕 집어 강조하고 있으니 that이 맞습니다.","hl":"st-3"},{"n":41,"text":"다섯 번째를 보세요. 여기서 비교하는 것은 크기, 즉 단수이고 셀 수 없는 명사예요. 그래서 those가 아니라 that을 써야 합니다.","hl":"st-4"},{"n":42,"text":"이 문제의 함정도 짚고 갈게요. 앞 명사의 수를 확인하지 않고 무조건 복수 those로 받는 실수. 비교 대상이 size이므로 단수 that입니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">장소 부사구 도치\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">장소·방향 부사구\u003c/b>가 문두에 오면 주어와 동사가 도치되어 \u003cb class=\"key\">부사구 + 동사 + 주어\u003c/b> 어순이 된다.\u003cdiv>\u003cspan class=\"g-formula\">부사구 + 동사 + 주어\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>Near the coast stands a lighthouse\u003c/li>\u003cli>동사는 뒤에 있는 진짜 주어의 수에 맞춘다\u003c/li>\u003cli>There is, Here comes도 같은 도치\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Near the coast stands a lighthouse with a flashing light at the top.\u003c/div>\u003cdiv class=\"g-ko\">해안 근처에 꼭대기에 깜빡이는 불빛이 있는 등대가 서 있다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":43,"text":"장소나 방향을 나타내는 부사구가 문장 앞에 오면, 주어와 동사가 자리를 바꾸는 도치가 일어납니다. Near the coast stands a lighthouse처럼 부사구, 동사, 주어 순서가 되죠. 이때 동사는 뒤에 있는 진짜 주어의 수에 맞춰야 합니다. There is나 Here comes도 같은 원리의 도치예요.","hl":"rule"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">to부정사 병렬\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">and로 연결된 두 동사는 \u003cb class=\"key\">같은 형태\u003c/b>로 맞춘다. 앞이 to부정사면 뒤도 \u003cb class=\"key\">to 동사원형\u003c/b> 또는 동사원형이다.\u003cdiv>\u003cspan class=\"g-formula\">to + 동사원형 and (to) + 동사원형\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>to maintain and (to) make\u003c/li>\u003cli>forced them to become Catholic and work in the fields\u003c/li>\u003cli>앞 형태를 그대로 복사한다고 생각\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">It was the keeper's job to maintain the lighthouse and make sure it worked properly.\u003c/div>\u003cdiv class=\"g-ko\">등대를 유지하고 제대로 작동하는지 확인하는 것이 관리인의 일이었다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">They forced the people to become Catholic and work in the fields.\u003c/div>\u003cdiv class=\"g-ko\">그들은 사람들을 가톨릭으로 개종시키고 들에서 일하게 했다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":44,"text":"and로 두 개의 동사를 연결할 때는 반드시 같은 형태로 맞춰야 합니다. 앞이 to maintain이면 뒤도 to make, 혹은 to를 생략한 make가 와야 하고 made는 안 됩니다. forced them to become Catholic and work in the fields도 to부정사가 and 뒤에 공유된 경우예요. 병렬 구조는 앞의 형태를 그대로 복사한다고 생각하면 쉬워요.","hl":"rule"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">간접의문문 어순\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">의문사가 이끄는 절이 문장 속에 들어가면 \u003cb class=\"key\">의문사 + 주어 + 동사\u003c/b> 어순으로 쓴다.\u003cdiv>\u003cspan class=\"g-formula\">의문사 + 주어 + 동사\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>where did ~ come from이 아니라 where ~ came from\u003c/li>\u003cli>do/does/did를 쓰지 않는다\u003c/li>\u003cli>when lighthouses first came into existence\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Do you know where roller coasters came from?\u003c/div>\u003cdiv class=\"g-ko\">롤러코스터가 어디에서 유래했는지 아는가?\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">We don't know when lighthouses first came into existence.\u003c/div>\u003cdiv class=\"g-ko\">우리는 등대가 언제 처음 생겼는지 모른다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":45,"text":"의문사가 이끄는 절이 문장 안에 들어가면 간접의문문이 되는데, 이때는 의문사 다음에 주어, 그다음 동사 순서로 평서문 어순을 씁니다. Do you know where roller coasters came from처럼 where 다음에 주어와 동사가 와야 하고 did를 쓰면 안 돼요. when lighthouses first came into existence도 같은 방식입니다. 의문사절은 문장의 일부이므로 물음표나 마침표도 전체 문장 기준으로 정해집니다.","hl":"rule"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">관계대명사 what\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">선행사를 포함\u003c/b>하는 관계대명사 what은 ~하는 것이라는 뜻으로 \u003cb class=\"key\">불완전한 절\u003c/b>을 이끈다.\u003cdiv>\u003cspan class=\"g-formula\">What + 주어 + 동사 ~\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>What we know is that ~\u003c/li>\u003cli>what절은 주어·목적어·보어 역할\u003c/li>\u003cli>선행사가 있으면 which나 that을 쓴다\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">What we know is that the concept of lighthouses is very old.\u003c/div>\u003cdiv class=\"g-ko\">우리가 아는 것은 등대의 개념이 매우 오래되었다는 것이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":46,"text":"관계대명사 what은 선행사를 포함해서 ~하는 것이라는 뜻을 가집니다. 뒤에는 주어나 목적어가 빠진 불완전한 절이 옵니다. What we know is that은 우리가 아는 것은 바로 ~라는 것이다로, what절이 주어 역할을 하고 있죠. 선행사가 따로 있는 자리에는 what을 쓸 수 없고 which나 that을 써야 합니다.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 4 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 것 고르기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">4\u003c/span>다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?\u003c/div>\u003cdiv class=\"p-psg\">Near the coast or shore ① \u003cu class=\"p-u\">stands\u003c/u> a lighthouse with a flashing light at the top. Originally, lighthouses were constructed with living quarters for the lighthouse keeper. It was the job of the keeper to maintain the lighthouse and ② \u003cu class=\"p-u\">made\u003c/u> sure that it was always working properly. Although it could be lonely at times, it was an important job. Today, almost all lighthouses are automated, which means that there is no longer a need for lighthouse keepers. We don't know when lighthouses first ③ \u003cu class=\"p-u\">came\u003c/u> into existence. ④ \u003cu class=\"p-u\">What\u003c/u> we know is that the concept of lighthouses is more than 3,000 years old. An ancient Greek epic poem titled The Iliad was written by a man named Homer around 1200 B.C. In the poem, Homer refers to a lighthouse, ⑤ \u003cu class=\"p-u\">giving\u003c/u> modern scholars an idea of how long lighthouses have been a part of human life.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① stands\u003c/div>\u003cdiv class=\"p-op\">② made\u003c/div>\u003cdiv class=\"p-op\">③ came\u003c/div>\u003cdiv class=\"p-op\">④ What\u003c/div>\u003cdiv class=\"p-op\">⑤ giving\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">②\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":47,"text":"네 번째 문제는 등대에 대한 글이에요. 도치된 문장, and로 이어진 병렬, 그리고 의문사절의 어순을 중심으로 읽어 주세요.","hl":"q"},{"n":48,"text":"","hl":"q","pause":7},{"n":49,"text":"정답은 두 번째, made입니다. and 앞의 to maintain과 병렬이 되어야 하므로 to make 또는 make가 되어야 합니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 4 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 것 고르기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">4\u003c/span>다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?\u003c/div>\u003cdiv class=\"p-psg sm\">Near the coast or shore ① \u003cu class=\"p-u\">stands\u003c/u> a lighthouse with a flashing light at the top. Originally, lighthouses were constructed with living quarters for the lighthouse keeper. It was the job of the keeper to maintain the lighthouse and ② \u003cu class=\"p-u\">made\u003c/u> sure that it was always working properly. Although it could be lonely at times, it was an important job. Today, almost all lighthouses are automated, which means that there is no longer a need for lighthouse keepers. We don't know when lighthouses first ③ \u003cu class=\"p-u\">came\u003c/u> into existence. ④ \u003cu class=\"p-u\">What\u003c/u> we know is that the concept of lighthouses is more than 3,000 years old. An ancient Greek epic poem titled The Iliad was written by a man named Homer around 1200 B.C. In the poem, Homer refers to a lighthouse, ⑤ \u003cu class=\"p-u\">giving\u003c/u> modern scholars an idea of how long lighthouses have been a part of human life.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① stands\u003c/div>\u003cdiv class=\"p-op\">② made\u003c/div>\u003cdiv class=\"p-op\">③ came\u003c/div>\u003cdiv class=\"p-op\">④ What\u003c/div>\u003cdiv class=\"p-op\">⑤ giving\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">① stands 확인\u003c/b>장소 부사구가 문두에 와서 동사 + 주어로 \u003cb class=\"key\">도치\u003c/b>되었고, 주어 a lighthouse가 단수이므로 stands가 맞다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">② made 확인\u003c/b>and 앞의 \u003cb class=\"key\">to maintain\u003c/b>과 병렬이므로 made가 아니라 (to) make가 되어야 한다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">③ came 확인\u003c/b>when이 이끄는 \u003cb class=\"key\">간접의문문\u003c/b>으로 의문사 + 주어 + 동사 어순이므로 came이 맞다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">④ What 확인\u003c/b>선행사를 포함하는 \u003cb class=\"key\">관계대명사\u003c/b> What이 주어 역할을 하므로 맞다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-4\">\u003cb class=\"l\">⑤ giving 확인\u003c/b>결과를 나타내는 \u003cb class=\"key\">분사구문\u003c/b>으로 ~함으로써라는 의미이므로 맞다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ②\u003c/span>\u003cdiv class=\"p-full\">It was the job of the keeper to maintain the lighthouse and make sure that it was always working properly.\u003c/div>\u003cdiv class=\"p-ko\">등대를 유지하고 그것이 항상 제대로 작동하는지 확인하는 것이 관리인의 일이었다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>and 앞의 to부정사를 놓치고 과거동사 made를 그대로 두는 실수. 병렬은 앞 형태를 복사합니다.\u003c/div>","segs":[{"n":50,"text":"첫 번째 문장은 장소 부사구가 앞에 나와서 동사와 주어가 자리를 바꿨어요. 주어가 등대 하나라서 stands가 맞습니다.","hl":"st-0"},{"n":51,"text":"두 번째를 보세요. and 앞에 to maintain이 있으니까 뒤도 같은 형태로 to make, 또는 to를 뺀 make가 와야 합니다. made는 틀렸어요.","hl":"st-1"},{"n":52,"text":"세 번째는 등대가 언제 처음 생겼는지라는 간접의문문이에요. 의문사 다음에 주어, 동사 순서로 와야 하니까 came이 맞습니다.","hl":"st-2"},{"n":53,"text":"네 번째 What은 우리가 아는 것이라는 뜻으로 주어 역할을 하고 있어요. 선행사를 품은 관계대명사라서 맞습니다.","hl":"st-3"},{"n":54,"text":"다섯 번째 giving은 앞 절에 이어져 그 결과 현대 학자들에게 생각거리를 준다는 뜻을 더합니다. 분사구문으로 맞는 형태예요.","hl":"st-4"},{"n":55,"text":"이 문제의 함정도 짚고 갈게요. and 앞의 to부정사를 놓치고 과거동사 made를 그대로 두는 실수. 병렬은 앞 형태를 복사합니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">수동태\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">be + 과거분사\u003c/b>로 ~되다를 표현하고, and로 이어지면 앞의 be동사를 공유할 수 있다.\u003cdiv>\u003cspan class=\"g-formula\">be동사 + 과거분사 (+ by 행위자)\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>hills were built from wood frames and covered with snow\u003c/li>\u003cli>수동태 뒤 목적어는 오지 않는다\u003c/li>\u003cli>행위자가 중요하지 않으면 by를 생략\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Hills were built from wood frames and covered with hard-packed snow.\u003c/div>\u003cdiv class=\"g-ko\">언덕은 나무 뼈대로 만들어졌고 단단히 다져진 눈으로 덮였다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":56,"text":"수동태는 be동사와 과거분사를 합쳐서 ~되다라는 뜻을 만듭니다. hills were built from wood frames and covered with snow에서 뒤쪽은 were가 and 앞에서 공유된 수동태예요. 그래서 to be covered가 아니라 were covered, 또는 반복을 피해 covered만 써도 됩니다. 수동태에서는 행위자가 중요하지 않으면 by를 생략하는 것이 자연스러워요.","hl":"rule"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">동사 강조 do/does/did\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">동사를 강조할 때는 \u003cb class=\"key\">do/does/did + 동사원형\u003c/b>을 써서 정말 ~하다는 뜻을 나타낸다.\u003cdiv>\u003cspan class=\"g-formula\">do/does/did + 동사원형\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>Accidents did happen은 사고가 실제로 일어났다\u003c/li>\u003cli>뒤에는 반드시 동사원형\u003c/li>\u003cli>When they did fight도 같은 강조\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Accidents did happen, but the sport continued.\u003c/div>\u003cdiv class=\"g-ko\">사고가 실제로 일어났지만 그 스포츠는 계속되었다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":57,"text":"동사를 강조하고 싶을 때는 do, does, did를 동사 앞에 넣고 동사는 원형으로 씁니다. Accidents did happen은 사고가 정말로 일어났다, 실제로 있었다는 뜻으로 강조가 들어간 표현이에요. 이때 뒤에 과거형을 또 쓰면 안 되고 반드시 동사원형이 와야 합니다. When they did fight도 그들이 실제로 싸웠을 때라는 뜻으로 같은 방식이죠.","hl":"rule"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">cannot ~ enough\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">cannot/could not + 동사 + enough\u003c/b>는 아무리 ~해도 부족하다, 즉 \u003cb class=\"key\">매우 ~하다\u003c/b>는 강한 긍정이다.\u003cdiv>\u003cspan class=\"g-formula\">cannot + 동사 + enough\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>could not enjoy this sport enough는 아주 많이 즐겼다\u003c/li>\u003cli>부정어가 있어도 뜻은 긍정\u003c/li>\u003cli>enough는 형용사·부사 뒤에 온다\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">People thought that they could not enjoy this sport enough.\u003c/div>\u003cdiv class=\"g-ko\">사람들은 이 스포츠를 아무리 즐겨도 부족하다고 생각했다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":58,"text":"cannot이나 could not 뒤에 enough를 붙이면 아무리 ~해도 부족하다, 즉 매우 ~하다는 강한 긍정이 됩니다. 그래서 could not enjoy this sport enough는 이 스포츠를 아주 많이 즐겼다는 뜻이에요. 부정어가 들어 있다고 해서 부정의 뜻으로 읽으면 안 됩니다. enough는 형용사나 부사 뒤에 온다는 위치도 함께 기억해 두세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 5 / 10\u003c/span>\u003cspan class=\"g-kind\">맞는 문장 개수 고르기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">5\u003c/span>다음 글의 밑줄 친 ⓐ~ⓔ 중 어법상 알맞은 문장의 개수는?\u003c/div>\u003cdiv class=\"p-psg\">Roller coasters are quick trips into total feeling of fear. ⓐ \u003cu class=\"p-u\">Do you know where did roller coasters come from?\u003c/u> Russia. A country of many weather extremes found ice sledding a popular sport. In the 1400s, hills were built from wood frames and ⓑ \u003cu class=\"p-u\">to be covered\u003c/u> with hard-packed snow. Water was sprayed onto the snow to create a frozen downward pathway of increased speed. Some hills reached 70 feet high and were as ⓒ \u003cu class=\"p-u\">steeply\u003c/u> as today's coasters. After a walk to the top, the customer rode down on a two-foot-long sled sitting on a guide's lap. ⓓ \u003cu class=\"p-u\">Accidents did happen\u003c/u> but the sport continued. In the 1700s, colorful lanterns allowed for night sledding in busy Saint Petersburg. People thought that they ⓔ \u003cu class=\"p-u\">could not enjoy this sport enough\u003c/u>, so wheels were added to the sleds to allow warm-weather riding.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① 1개\u003c/div>\u003cdiv class=\"p-op\">② 2개\u003c/div>\u003cdiv class=\"p-op\">③ 3개\u003c/div>\u003cdiv class=\"p-op\">④ 4개\u003c/div>\u003cdiv class=\"p-op\">⑤ 5개\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">②\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":59,"text":"다섯 번째 문제는 롤러코스터의 유래에 대한 글이에요. 다섯 군데를 하나씩 맞는지 틀리는지 판정한 다음 개수를 세면 됩니다.","hl":"q"},{"n":60,"text":"","hl":"q","pause":7},{"n":61,"text":"정답은 두 번째, 두 개입니다. 맞는 것은 사고가 실제로 일어났다는 부분과 이 스포츠를 아주 많이 즐겼다는 부분입니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 5 / 10\u003c/span>\u003cspan class=\"g-kind\">맞는 문장 개수 고르기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">5\u003c/span>다음 글의 밑줄 친 ⓐ~ⓔ 중 어법상 알맞은 문장의 개수는?\u003c/div>\u003cdiv class=\"p-psg sm\">Roller coasters are quick trips into total feeling of fear. ⓐ \u003cu class=\"p-u\">Do you know where did roller coasters come from?\u003c/u> Russia. A country of many weather extremes found ice sledding a popular sport. In the 1400s, hills were built from wood frames and ⓑ \u003cu class=\"p-u\">to be covered\u003c/u> with hard-packed snow. Water was sprayed onto the snow to create a frozen downward pathway of increased speed. Some hills reached 70 feet high and were as ⓒ \u003cu class=\"p-u\">steeply\u003c/u> as today's coasters. After a walk to the top, the customer rode down on a two-foot-long sled sitting on a guide's lap. ⓓ \u003cu class=\"p-u\">Accidents did happen\u003c/u> but the sport continued. In the 1700s, colorful lanterns allowed for night sledding in busy Saint Petersburg. People thought that they ⓔ \u003cu class=\"p-u\">could not enjoy this sport enough\u003c/u>, so wheels were added to the sleds to allow warm-weather riding.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① 1개\u003c/div>\u003cdiv class=\"p-op\">② 2개\u003c/div>\u003cdiv class=\"p-op\">③ 3개\u003c/div>\u003cdiv class=\"p-op\">④ 4개\u003c/div>\u003cdiv class=\"p-op\">⑤ 5개\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">ⓐ 확인\u003c/b>간접의문문은 \u003cb class=\"key\">의문사 + 주어 + 동사\u003c/b> 어순이므로 where roller coasters came from이 되어야 한다. 틀림.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">ⓑ 확인\u003c/b>and 앞의 were built가 \u003cb class=\"key\">수동태\u003c/b>이므로 뒤도 (were) covered로 이어져야 한다. to be covered는 틀림.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">ⓒ 확인\u003c/b>as ~ as 사이에는 주어 hills의 상태를 나타내는 \u003cb class=\"key\">형용사\u003c/b> steep이 와야 한다. steeply는 틀림.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">ⓓ 확인\u003c/b>did happen은 \u003cb class=\"key\">동사 강조\u003c/b>로 정말 일어났다라는 뜻을 나타내므로 어법에 맞다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-4\">\u003cb class=\"l\">ⓔ 확인\u003c/b>could not enjoy ~ enough는 아무리 즐겨도 부족하다, 즉 \u003cb class=\"key\">매우 즐겼다\u003c/b>는 뜻으로 어법에 맞다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-5\">\u003cb class=\"l\">개수 세기\u003c/b>어법에 맞는 것은 ⓓ와 ⓔ 두 개이므로 정답은 ②번이다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ②\u003c/span>\u003cdiv class=\"p-ko\">롤러코스터는 공포에 대한 짧은 여행이며, 그 기원은 러시아의 얼음 썰매 타기에서 찾을 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>cannot ~ enough를 충분히 즐길 수 없다는 부정으로 해석해 틀린 문장으로 착각하는 것.\u003c/div>","segs":[{"n":62,"text":"먼저 a는 롤러코스터가 어디서 왔는지 아느냐는 간접의문문이에요. 의문사 다음에 주어와 동사가 와야 하는데 의문문 어순으로 썼으니 틀렸습니다.","hl":"st-0"},{"n":63,"text":"b는 앞의 were built와 나란히 이어져야 해요. 그래서 were covered, 또는 were를 생략한 covered가 와야 하고 to be covered는 틀립니다.","hl":"st-1"},{"n":64,"text":"c는 as와 as 사이 자리예요. 언덕의 상태를 말하니까 형용사 steep이 와야 하고 부사 steeply는 틀립니다.","hl":"st-2"},{"n":65,"text":"d는 사고가 실제로 일어났다는 뜻으로 did를 이용해 동사를 강조했어요. 뒤에 동사원형이 왔으니 맞습니다.","hl":"st-3"},{"n":66,"text":"e는 아무리 즐겨도 부족하다, 즉 아주 많이 즐겼다는 뜻이에요. cannot에 enough가 붙으면 강한 긍정이 되니까 맞습니다.","hl":"st-4"},{"n":67,"text":"그래서 맞는 문장은 d와 e, 두 개입니다. 정답은 두 번째 선택지예요.","hl":"st-5"},{"n":68,"text":"이 문제의 함정도 짚고 갈게요. cannot ~ enough를 충분히 즐길 수 없다는 부정으로 해석해 틀린 문장으로 착각하는 것.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">a few / a little\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">셀 수 있는 복수 명사\u003c/b> 앞에는 \u003cb class=\"key\">a few\u003c/b>, 셀 수 없는 명사 앞에는 a little을 쓴다.\u003cdiv>\u003cspan class=\"g-formula\">a few + 복수명사 / a little + 불가산명사\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>individuals는 복수라서 a few\u003c/li>\u003cli>a few는 조금 있다는 긍정, few는 거의 없다는 부정\u003c/li>\u003cli>a little도 긍정, little은 부정\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">There were a few individuals who worked to prove the public wrong.\u003c/div>\u003cdiv class=\"g-ko\">대중이 틀렸음을 증명하려는 소수의 사람들이 있었다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":69,"text":"a few와 a little은 뒤에 오는 명사가 셀 수 있느냐로 갈립니다. individuals처럼 셀 수 있는 복수 명사 앞에는 a few를 쓰고, water나 time처럼 셀 수 없는 명사 앞에는 a little을 씁니다. a few는 조금 있다는 긍정의 뜻이고, few는 거의 없다는 부정의 뜻이라는 차이도 있어요.","hl":"rule"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">상관접속사 not only A but also B\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">not only A but also B\u003c/b>는 A뿐만 아니라 B도라는 뜻으로, A와 B를 \u003cb class=\"key\">같은 형태\u003c/b>로 맞춘다.\u003cdiv>\u003cspan class=\"g-formula\">not only + A + but also + B\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>but also를 and also로 쓰면 틀린다\u003c/li>\u003cli>A와 B의 품사·형태를 일치\u003c/li>\u003cli>동사는 B에 수 일치\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">His flight was covered not only by news reporters but also by government officials.\u003c/div>\u003cdiv class=\"g-ko\">그의 비행은 신문 기자들뿐만 아니라 정부 관리들에 의해서도 취재되었다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":70,"text":"not only A but also B는 A뿐만 아니라 B도라는 상관접속사입니다. 여기서 자주 틀리는 게 뒤를 and also로 쓰는 것인데, 반드시 but also로 써야 해요. 그리고 A와 B는 같은 품사와 형태로 맞춰야 합니다. by news reporters와 by government officials처럼 전치사구끼리 나란히 놓인 점을 확인하세요.","hl":"rule"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">later / latter\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">later\u003c/b>는 시간상 나중에라는 부사, \u003cb class=\"key\">latter\u003c/b>는 후자라는 형용사다.\u003cdiv>\u003cspan class=\"g-formula\">시간 표현 + later / the latter\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>Nine days later는 아홉 날 후에\u003c/li>\u003cli>시간 흐름 자리에는 later\u003c/li>\u003cli>the latter는 앞에서 둘 중 후자를 가리킴\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Nine days later, the Wright brothers attempted flight.\u003c/div>\u003cdiv class=\"g-ko\">아흐레 뒤에 라이트 형제가 비행을 시도했다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":71,"text":"later는 시간이 지난 뒤에, 나중에라는 뜻의 부사이고, latter는 앞에서 둘을 말했을 때 후자를 뜻하는 형용사입니다. Nine days later는 아흐레가 지난 뒤에라는 뜻이죠. 뜻이 헷갈리니까 시간 표현 자리에는 later를 쓴다고 기억해 두세요.","hl":"rule"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">최상급 the longest\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">셋 이상 중 가장 ~한 것은 \u003cb class=\"key\">the + 최상급\u003c/b>으로 쓰고, 뒤에 비교 범위가 온다.\u003cdiv>\u003cspan class=\"g-formula\">the + 최상급 + (명사)\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>the long one이 아니라 the longest one\u003c/li>\u003cli>최상급 앞에는 the\u003c/li>\u003cli>one은 앞의 flights를 대신\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">They made several flights, \u003cspan class=\"fx\">the longest one\u003c/span> lasting 59 seconds.\u003c/div>\u003cdiv class=\"g-ko\">그들은 여러 번 비행했는데, 가장 긴 비행은 오십구 초 동안 계속되었다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":72,"text":"여러 개 중에서 가장 ~한 것은 the와 최상급을 함께 씁니다. They made several flights, the longest one lasting 정도로 쓰면 여러 번 비행한 것 중 가장 긴 것이 오십구 초 동안 이어졌다는 뜻이에요. 여기서 one은 앞에 나온 flights를 하나로 받는 말입니다. 최상급 앞에는 the를 꼭 붙여 주세요.","hl":"rule"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">5형식 목적격보어 형용사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">keep, make, find는 \u003cb class=\"key\">목적어 + 형용사\u003c/b> 형태로 목적어의 상태나 결과를 설명한다.\u003cdiv>\u003cspan class=\"g-formula\">keep/make/find + 목적어 + 형용사\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>keep their attempts secret\u003c/li>\u003cli>made the work less burdensome\u003c/li>\u003cli>이 자리에 부사를 쓰면 틀린다\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">They had kept their flight attempts secret.\u003c/div>\u003cdiv class=\"g-ko\">그들은 자신들의 비행 시도를 비밀로 유지했다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">Singing made the work less burdensome.\u003c/div>\u003cdiv class=\"g-ko\">노래를 부르는 것은 그 일을 덜 힘들게 했다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":73,"text":"keep, make, find 같은 동사는 목적어 뒤에 형용사를 붙여서 목적어의 상태나 결과를 설명합니다. keep their flight attempts secret은 그들의 비행 시도를 비밀로 유지했다는 뜻이고, made the work less burdensome은 그 일을 덜 힘들게 만들었다는 뜻이죠. 이 자리에 부사를 쓰면 틀리고 형용사를 써야 합니다.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 6 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">6\u003c/span>다음 글의 밑줄 친 ⓐ~ⓔ를 어법상 맞게 고친 것은?\u003c/div>\u003cdiv class=\"p-psg\">In the first few years of the 20th century, the majority of people strongly believed that man could not and would not ever be able to fly. There were ⓐ \u003cu class=\"p-u\">a little\u003c/u> individuals who worked to prove the public wrong. On December 8, 1903, Samuel Langley attempted to fly his version of an airplane, but his attempt was not successful. Langley was the secretary of the Smithsonian Institution, so his flight was covered not only by news reporters ⓑ \u003cu class=\"p-u\">and\u003c/u> also by government officials. Nine days ⓒ \u003cu class=\"p-u\">latter\u003c/u>, brothers Orville and Wilbur Wright attempted flight. The Wright brothers made several flights, the ⓓ \u003cu class=\"p-u\">long\u003c/u> one lasting an incredible 59 seconds. Since they had kept their flight attempts ⓔ \u003cu class=\"p-u\">secretly\u003c/u>, their miraculous flight was only reported by two newspapers in the United States.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① ⓐ → little\u003c/div>\u003cdiv class=\"p-op\">② ⓑ → or\u003c/div>\u003cdiv class=\"p-op\">③ ⓒ → late\u003c/div>\u003cdiv class=\"p-op\">④ ⓓ → longer\u003c/div>\u003cdiv class=\"p-op\">⑤ ⓔ → secret\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">⑤\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":74,"text":"여섯 번째 문제는 라이트 형제 이야기예요. 다섯 군데 중 네 곳은 잘못 고친 것이고 한 곳만 제대로 고쳤으니, 각 자리에 정말 맞는 형태를 먼저 생각해 보세요.","hl":"q"},{"n":75,"text":"","hl":"q","pause":7},{"n":76,"text":"정답은 다섯 번째입니다. keep 다음에 목적어와 목적격보어가 오는 구조라서 부사 secretly가 아니라 형용사 secret이 되어야 합니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 6 / 10\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">6\u003c/span>다음 글의 밑줄 친 ⓐ~ⓔ를 어법상 맞게 고친 것은?\u003c/div>\u003cdiv class=\"p-psg sm\">In the first few years of the 20th century, the majority of people strongly believed that man could not and would not ever be able to fly. There were ⓐ \u003cu class=\"p-u\">a little\u003c/u> individuals who worked to prove the public wrong. On December 8, 1903, Samuel Langley attempted to fly his version of an airplane, but his attempt was not successful. Langley was the secretary of the Smithsonian Institution, so his flight was covered not only by news reporters ⓑ \u003cu class=\"p-u\">and\u003c/u> also by government officials. Nine days ⓒ \u003cu class=\"p-u\">latter\u003c/u>, brothers Orville and Wilbur Wright attempted flight. The Wright brothers made several flights, the ⓓ \u003cu class=\"p-u\">long\u003c/u> one lasting an incredible 59 seconds. Since they had kept their flight attempts ⓔ \u003cu class=\"p-u\">secretly\u003c/u>, their miraculous flight was only reported by two newspapers in the United States.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① ⓐ → little\u003c/div>\u003cdiv class=\"p-op\">② ⓑ → or\u003c/div>\u003cdiv class=\"p-op\">③ ⓒ → late\u003c/div>\u003cdiv class=\"p-op\">④ ⓓ → longer\u003c/div>\u003cdiv class=\"p-op\">⑤ ⓔ → secret\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">ⓐ a little\u003c/b>individuals는 \u003cb class=\"key\">셀 수 있는 복수 명사\u003c/b>이므로 a little이 아니라 a few가 되어야 한다. ①도 틀림.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">ⓑ and also\u003c/b>not only A \u003cb class=\"key\">but also\u003c/b> B 구조이므로 and가 아니라 but이 되어야 한다. ②도 틀림.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">ⓒ latter\u003c/b>시간이 흐른 뒤를 뜻하므로 \u003cb class=\"key\">later\u003c/b>가 되어야 한다. ③도 틀림.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">ⓓ long\u003c/b>여러 비행 중 가장 긴 것을 뜻하므로 \u003cb class=\"key\">최상급\u003c/b> the longest one이 되어야 한다. ④도 틀림.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-4\">\u003cb class=\"l\">ⓔ secretly\u003c/b>keep + 목적어 + \u003cb class=\"key\">형용사\u003c/b> 구조이므로 부사 secretly가 아니라 secret이 되어야 한다. 정답 ⑤.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ⑤\u003c/span>\u003cdiv class=\"p-full\">Since they had kept their flight attempts secret, their miraculous flight was only reported by two newspapers in the United States.\u003c/div>\u003cdiv class=\"p-ko\">그들은 비행 시도를 비밀로 유지했기 때문에, 그 기적적인 비행은 미국의 신문 두 곳에 의해서만 보도되었다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>keep 뒤에 부사를 쓰는 실수. 목적어의 상태를 설명하는 자리에는 형용사를 씁니다.\u003c/div>","segs":[{"n":77,"text":"a를 보면 뒤에 사람들, 즉 복수 명사가 와요. 셀 수 있는 복수니까 a few가 맞고 a little도 little도 안 됩니다. 그래서 첫 번째 선택지는 오답이에요.","hl":"st-0"},{"n":78,"text":"b는 not only 뒤에 이어지는 자리라서 but also가 되어야 해요. 그러니까 and를 or로 바꾸는 두 번째 선택지는 틀렸습니다.","hl":"st-1"},{"n":79,"text":"c는 아흐레 뒤에라는 시간 표현이에요. 시간이 지난 뒤는 later이므로 late로 바꾸는 세 번째 선택지도 틀립니다.","hl":"st-2"},{"n":80,"text":"d는 여러 번의 비행 중 가장 긴 것을 말하니까 최상급 longest가 와야 해요. longer로 고치는 네 번째 선택지도 정답이 아닙니다.","hl":"st-3"},{"n":81,"text":"e는 목적어 뒤에 목적격보어가 오는 자리예요. 비행 시도를 비밀로 유지했다는 뜻이니 형용사 secret이 와야 합니다. 그래서 다섯 번째 선택지가 정답입니다.","hl":"st-4"},{"n":82,"text":"이 문제의 함정도 짚고 갈게요. keep 뒤에 부사를 쓰는 실수. 목적어의 상태를 설명하는 자리에는 형용사를 씁니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">the 비교급, the 비교급\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">the + 비교급 ~, the + 비교급 ...\u003c/b>는 ~하면 할수록 더 ...하다는 뜻이다.\u003cdiv>\u003cspan class=\"g-formula\">The + 비교급 + S + V, the + 비교급 + S + V\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>앞은 조건, 뒤는 결과\u003c/li>\u003cli>앞뒤 모두 비교급 형태\u003c/li>\u003cli>The easier traveling became, the more trade flourished\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The easier traveling became, the more trade flourished.\u003c/div>\u003cdiv class=\"g-ko\">여행이 더 쉬워질수록 교역은 더 번성했다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":83,"text":"the와 비교급이 두 번 나오는 구문은 ~하면 할수록 더 ...하다는 뜻입니다. 앞에는 조건, 뒤에는 그 결과가 옵니다. The easier traveling became, the more trade flourished는 여행이 더 쉬워질수록 교역이 더 번성했다는 뜻이에요. 앞뒤 모두 비교급 형태를 정확히 맞추는 것이 포인트입니다.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 7 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법 서술형\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">7\u003c/span>다음 글을 읽고, (A), (B)를 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg\">For many years, China was governed by a series of dynasties, or rulers from the same family. The Tang Dynasty, which ruled from about AD 618 to 907, is considered China's Golden Age. Dancing, sculpting, and (A) \u003cu class=\"p-u\">to paint\u003c/u> were all very popular during this time. The capital city, Chang'an, had over one million people. Farmers were allowed to own land, although this later changed. People who wanted to work in the government had to pass a difficult exam. Only the smartest and most educated people could serve as government officials. The (B) \u003cu class=\"p-u\">more easily\u003c/u> traveling became thanks to new roads and waterways, the more trade inside China and to other countries flourished. Today, the Tang Dynasty is seen as a time of great cultural achievement.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">(A) painting (B) easier\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":84,"text":"일곱 번째 문제는 당나라에 대한 글이에요. 두 곳 모두 앞뒤 형태를 맞추는 문제라는 점을 생각하면서 읽어 보세요.","hl":"q"},{"n":85,"text":"","hl":"q","pause":7},{"n":86,"text":"정답은 (A) painting, (B) easier입니다. 동명사 병렬과 the 비교급 구문, 두 가지 규칙으로 해결됩니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 7 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법 서술형\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">7\u003c/span>다음 글을 읽고, (A), (B)를 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg sm\">For many years, China was governed by a series of dynasties, or rulers from the same family. The Tang Dynasty, which ruled from about AD 618 to 907, is considered China's Golden Age. Dancing, sculpting, and (A) \u003cu class=\"p-u\">to paint\u003c/u> were all very popular during this time. The capital city, Chang'an, had over one million people. Farmers were allowed to own land, although this later changed. People who wanted to work in the government had to pass a difficult exam. Only the smartest and most educated people could serve as government officials. The (B) \u003cu class=\"p-u\">more easily\u003c/u> traveling became thanks to new roads and waterways, the more trade inside China and to other countries flourished. Today, the Tang Dynasty is seen as a time of great cultural achievement.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">(A) 확인\u003c/b>Dancing, sculpting, and (A)가 and로 연결된 \u003cb class=\"key\">병렬 구조\u003c/b>이므로 앞이 동명사인 만큼 (A)도 동명사 painting이 되어야 한다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">(B) 확인\u003c/b>뒤에 the more trade가 오는 \u003cb class=\"key\">the 비교급, the 비교급\u003c/b> 구문이므로 앞은 비교급 easier가 되어야 한다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">완성 확인\u003c/b>(A)는 painting, (B)는 easier로 고쳐 쓰면 된다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 (A) painting (B) easier\u003c/span>\u003cdiv class=\"p-full\">Dancing, sculpting, and painting were all very popular during this time. The easier traveling became thanks to new roads and waterways, the more trade inside China and to other countries flourished.\u003c/div>\u003cdiv class=\"p-ko\">춤추기, 조각하기, 그림 그리기는 이 시기에 모두 매우 인기가 있었다. 새 도로와 수로 덕분에 여행이 더 쉬워질수록 중국 내부와 다른 나라와의 교역은 더 번성했다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>(B)에서 easily를 그대로 두거나 more easily를 유지하는 실수. the 비교급 구문은 앞뒤 모두 비교급입니다.\u003c/div>","segs":[{"n":87,"text":"먼저 (A)를 보면 춤추기, 조각하기와 and로 나란히 이어져요. 앞이 모두 동명사니까 (A)도 동명사 painting이 되어야 합니다.","hl":"st-0"},{"n":88,"text":"(B)는 뒤에 the more trade가 오는 비교급 구문이에요. 여행이 더 쉬워질수록이라는 뜻이니 앞도 비교급 easier가 되어야 합니다.","hl":"st-1"},{"n":89,"text":"그래서 답은 (A)는 painting, (B)는 easier입니다. 병렬과 비교급, 두 가지만 정확히 보면 되는 문제였어요.","hl":"st-2"},{"n":90,"text":"이 문제의 함정도 짚고 갈게요. (B)에서 easily를 그대로 두거나 more easily를 유지하는 실수. the 비교급 구문은 앞뒤 모두 비교급입니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">부사의 위치\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">probably, always 같은 부사는 \u003cb class=\"key\">be동사 뒤\u003c/b>, \u003cb class=\"key\">일반동사 앞\u003c/b>에 놓는다.\u003cdiv>\u003cspan class=\"g-formula\">be동사 + 부사 / 부사 + 일반동사\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>was probably connected to religion\u003c/li>\u003cli>조동사가 있으면 조동사 뒤\u003c/li>\u003cli>의문문에서는 위치가 달라질 수 있다\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The earliest music was probably connected to religion.\u003c/div>\u003cdiv class=\"g-ko\">가장 최초의 음악은 아마도 종교와 관련이 있었을 것이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":91,"text":"probably나 always 같은 부사는 be동사 뒤, 일반동사 앞에 놓습니다. The earliest music was probably connected to religion에서 was 뒤에 probably가 온 것이 바로 그 규칙이에요. 조동사가 있으면 조동사 뒤에 놓습니다. 위치가 헷갈릴 때는 be동사와 일반동사를 나눠서 생각하면 쉬워요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 8 / 10\u003c/span>\u003cspan class=\"g-kind\">배열 서술형\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">8\u003c/span>다음 (1), (2)의 밑줄 친 우리말과 같은 뜻이 되도록 괄호 안의 말을 알맞게 배열하시오.\u003c/div>\u003cdiv class=\"p-psg\">Historians say (1) \u003cu class=\"p-u\">가장 최초의 음악은 아마도 종교와 관련이 있었을 것이다\u003c/u>. Long ago, people believed that the world was controlled by a variety of gods and that they had to do something to show respect to the gods. Singing was among the activities that humans engaged in. Singing is still an important part of most religions. If you have ever sung a song—religious or otherwise—you know that singing is fun. The feeling of joy that comes from singing must have made ancient people feel happy. Another time people sang was when they worked. Egyptian slaves sang as they carried the heavy stones to build the pyramids. Soldiers sang as they marched into battle. Farmers sang one song as they planted and another when they harvested. (2) \u003cu class=\"p-u\">노래를 부르는 것은 그 일을 덜 힘들게 했다.\u003c/u>\u003c/div>\u003cdiv class=\"p-q\">(1) (probably / religion / music / connected / to / the / earliest / was) (2) (work / less / made / the / burdensome / singing)\u003c/div>\u003cdiv class=\"p-words\">뜻: (1) 가장 최초의 음악은 아마도 종교와 관련이 있었을 것이다 (2) 노래를 부르는 것은 그 일을 덜 힘들게 했다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">(1) the earliest music was probably connected to religion (2) Singing made the work less burdensome.\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":92,"text":"여덟 번째 문제는 노래의 역사에 대한 글이에요. 주어진 단어를 그대로 쓰되, 부사의 위치와 목적격보어 자리를 신경 써서 배열해 보세요.","hl":"q"},{"n":93,"text":"","hl":"q","pause":7},{"n":94,"text":"정답은 (1) the earliest music was probably connected to religion, (2) Singing made the work less burdensome입니다. be동사 뒤에 probably를 두고, make 뒤에는 목적어와 형용사를 붙입니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 8 / 10\u003c/span>\u003cspan class=\"g-kind\">배열 서술형\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">8\u003c/span>다음 (1), (2)의 밑줄 친 우리말과 같은 뜻이 되도록 괄호 안의 말을 알맞게 배열하시오.\u003c/div>\u003cdiv class=\"p-psg sm\">Historians say (1) \u003cu class=\"p-u\">가장 최초의 음악은 아마도 종교와 관련이 있었을 것이다\u003c/u>. Long ago, people believed that the world was controlled by a variety of gods and that they had to do something to show respect to the gods. Singing was among the activities that humans engaged in. Singing is still an important part of most religions. If you have ever sung a song—religious or otherwise—you know that singing is fun. The feeling of joy that comes from singing must have made ancient people feel happy. Another time people sang was when they worked. Egyptian slaves sang as they carried the heavy stones to build the pyramids. Soldiers sang as they marched into battle. Farmers sang one song as they planted and another when they harvested. (2) \u003cu class=\"p-u\">노래를 부르는 것은 그 일을 덜 힘들게 했다.\u003c/u>\u003c/div>\u003cdiv class=\"p-q sm\">(1) (probably / religion / music / connected / to / the / earliest / was) (2) (work / less / made / the / burdensome / singing)\u003c/div>\u003cdiv class=\"p-words\">뜻: (1) 가장 최초의 음악은 아마도 종교와 관련이 있었을 것이다 (2) 노래를 부르는 것은 그 일을 덜 힘들게 했다.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">(1) 주어·동사 잡기\u003c/b>주어는 \u003cb class=\"key\">the earliest music\u003c/b>, 동사는 was로 시작하고, 부사 probably는 be동사 뒤에, 수동태는 \u003cb class=\"key\">be connected to\u003c/b>로 쓴다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">(2) 5형식 만들기\u003c/b>주어 \u003cb class=\"key\">Singing\u003c/b>, 동사 made, 목적어 the work, 목적격보어 \u003cb class=\"key\">less burdensome\u003c/b> 순서로 배열한다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">전체 확인\u003c/b>(1) the earliest music was probably connected to religion (2) Singing made the work less burdensome.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 (1) the earliest music was probably connected to religion (2) Singing made the work less burdensome.\u003c/span>\u003cdiv class=\"p-full\">(1) The earliest music was probably connected to religion. (2) Singing made the work less burdensome.\u003c/div>\u003cdiv class=\"p-ko\">(1) 가장 최초의 음악은 아마도 종교와 관련이 있었을 것이다. (2) 노래를 부르는 것은 그 일을 덜 힘들게 했다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>(2)에서 목적격보어 자리에 부사 burdensomely를 쓰는 실수. 목적어의 상태는 형용사로 표현합니다.\u003c/div>","segs":[{"n":95,"text":"먼저 (1)이에요. 주어는 가장 최초의 음악, 동사는 was이고, 아마도라는 부사 probably는 be동사 뒤에 놓습니다. 종교와 관련이 있었다는 수동태라서 was connected to religion으로 이어 주면 됩니다.","hl":"st-0"},{"n":96,"text":"(2)는 노래를 부르는 것이 주어예요. 동사 made 다음에 목적어 the work, 그리고 목적어의 상태를 설명하는 형용사 less burdensome을 붙이면 됩니다.","hl":"st-1"},{"n":97,"text":"그래서 완성된 문장은 (1) the earliest music was probably connected to religion, (2) Singing made the work less burdensome입니다. 어순과 형용사 자리만 지키면 되는 문제였어요.","hl":"st-2"},{"n":98,"text":"이 문제의 함정도 짚고 갈게요. (2)에서 목적격보어 자리에 부사 burdensomely를 쓰는 실수. 목적어의 상태는 형용사로 표현합니다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">a number of + 복수명사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">a number of + 복수명사\u003c/b>는 많은 ~이라는 뜻으로 복수 취급하고, the number of는 ~의 수로 단수 취급한다.\u003cdiv>\u003cspan class=\"g-formula\">a number of + 복수명사 + 복수동사\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>a number of the medicine men은 많은 주술사들\u003c/li>\u003cli>뒤에는 반드시 복수명사\u003c/li>\u003cli>the number of + 복수명사 + 단수동사\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The Spanish arrested a number of the traditional Indian medicine men.\u003c/div>\u003cdiv class=\"g-ko\">스페인 사람들은 많은 전통 인디언 주술사들을 체포했다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":99,"text":"a number of는 많은 ~이라는 뜻으로 뒤에 복수 명사를 데리고 오고 복수 취급합니다. 반면 the number of는 ~의 수라는 뜻으로 단수 취급한다는 점이 시험에 자주 나와요. a number of the traditional Indian medicine men은 많은 전통 인디언 주술사들이라는 뜻입니다.","hl":"rule"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">대명사 일치\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">대명사는 앞에 나온 \u003cb class=\"key\">명사의 수와 인칭\u003c/b>에 맞춘다.\u003cdiv>\u003cspan class=\"g-formula\">복수 명사 → they / them / their\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>the Spanish는 복수라서 them\u003c/li>\u003cli>the Pueblo people은 they로 받음\u003c/li>\u003cli>가리키는 말을 먼저 표시하며 읽기\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">About 8,000 Pueblo warriors attacked the Spanish and kicked them out of their land.\u003c/div>\u003cdiv class=\"g-ko\">약 팔천 명의 푸에블로 전사들이 스페인 사람들을 공격해 그들의 땅에서 쫓아냈다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":100,"text":"대명사는 앞에 나온 명사의 수와 인칭에 맞춰 줍니다. the Spanish는 스페인 사람들을 가리키는 복수이므로 them으로 받는 것이 맞습니다. the Pueblo people을 they로 받은 것도 같은 원리예요. 대명사를 고를 때는 반드시 앞 문장에서 무엇을 가리키는지 표시하면서 읽어야 합니다.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 9 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법 틀린 것 고르기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">9\u003c/span>다음 글을 읽고, 윗글의 밑줄 친 부분 중 어법상 어색한 것을 고르시오.\u003c/div>\u003cdiv class=\"p-psg\">The Pueblo tribe consists of twenty-one separate Native American groups that lived in the southwestern area of the United States, primarily in Arizona and New Mexico. The peaceful Pueblo people loved nature, and \u003cu class=\"p-u\">그들은 전쟁에서 거의 싸우지 않았다\u003c/u>. When they ① \u003cu class=\"p-u\">did\u003c/u> fight, it was to protect their people or their land. In 1539, the Spanish took over much of the Pueblo land. They forced the people to become Catholic and ② \u003cu class=\"p-u\">work\u003c/u> in the fields for them. The Pueblo people began to feel like they were being treated little better than slaves. When the Spanish arrested ③ \u003cu class=\"p-u\">a number of\u003c/u> the traditional Indian medicine men, the Pueblo decided to revolt. It was under the leadership of a medicine man named Pope ④ \u003cu class=\"p-u\">which\u003c/u> the Pueblo planned their attack in 1680. About 8,000 Pueblo warriors attacked the Spanish and kicked ⑤ \u003cu class=\"p-u\">them\u003c/u> out of their land.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① did\u003c/div>\u003cdiv class=\"p-op\">② work\u003c/div>\u003cdiv class=\"p-op\">③ a number of\u003c/div>\u003cdiv class=\"p-op\">④ which\u003c/div>\u003cdiv class=\"p-op\">⑤ them\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">④\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":101,"text":"아홉 번째 문제는 푸에블로족에 대한 글이에요. 동사 강조, to부정사 병렬, 그리고 강조구문이 나오니 that 자리와 어순을 특히 확인해 보세요.","hl":"q"},{"n":102,"text":"","hl":"q","pause":7},{"n":103,"text":"정답은 네 번째, which입니다. 강조구문에서 강조하는 말이 부사구이기 때문에 that으로 고쳐야 합니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 9 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법 틀린 것 고르기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">9\u003c/span>다음 글을 읽고, 윗글의 밑줄 친 부분 중 어법상 어색한 것을 고르시오.\u003c/div>\u003cdiv class=\"p-psg sm\">The Pueblo tribe consists of twenty-one separate Native American groups that lived in the southwestern area of the United States, primarily in Arizona and New Mexico. The peaceful Pueblo people loved nature, and \u003cu class=\"p-u\">그들은 전쟁에서 거의 싸우지 않았다\u003c/u>. When they ① \u003cu class=\"p-u\">did\u003c/u> fight, it was to protect their people or their land. In 1539, the Spanish took over much of the Pueblo land. They forced the people to become Catholic and ② \u003cu class=\"p-u\">work\u003c/u> in the fields for them. The Pueblo people began to feel like they were being treated little better than slaves. When the Spanish arrested ③ \u003cu class=\"p-u\">a number of\u003c/u> the traditional Indian medicine men, the Pueblo decided to revolt. It was under the leadership of a medicine man named Pope ④ \u003cu class=\"p-u\">which\u003c/u> the Pueblo planned their attack in 1680. About 8,000 Pueblo warriors attacked the Spanish and kicked ⑤ \u003cu class=\"p-u\">them\u003c/u> out of their land.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① did\u003c/div>\u003cdiv class=\"p-op\">② work\u003c/div>\u003cdiv class=\"p-op\">③ a number of\u003c/div>\u003cdiv class=\"p-op\">④ which\u003c/div>\u003cdiv class=\"p-op\">⑤ them\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">① did 확인\u003c/b>When they did fight는 \u003cb class=\"key\">동사 강조\u003c/b> did + 동사원형으로 그들이 실제로 싸웠을 때라는 뜻이므로 맞다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">② work 확인\u003c/b>forced the people to become Catholic and \u003cb class=\"key\">(to) work\u003c/b>로 to부정사가 병렬된 형태이므로 맞다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">③ a number of 확인\u003c/b>많은 ~이라는 뜻으로 뒤에 \u003cb class=\"key\">복수명사\
