</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;
    if(s.pause){pause(s.pause);return;}
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){var s=segs()[j];if(!noAudio&&s&&!s.pause&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  sl.addEventListener("click",function(e){var t=e.target.closest?e.target.closest(".g-opt,[data-act]"):null;if(!t)return;
    if(t.getAttribute("data-act")==="show"){reveal("ans");return;}
    var g=t.parentNode;if(g&&g.classList.contains("rv"))return;[].forEach.call(g.querySelectorAll(".g-opt"),function(o){if(o!==t)o.classList.remove("picked");});t.classList.toggle("picked");});
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};

lecturePlayer(document.getElementById("app"),{"brand":"포인트 50 어순","title":"헷갈리는 영어 어순을 딱 잡아 주는 포인트 50","audioDir":"point50_audio","preview":false,"count":19,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">포인트 50 어순\u003c/div>\u003ch1>헷갈리는 영어 어순을 딱 잡아 주는 포인트 50\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>간접의문문부터 enough와 5형식 가목적어까지 올바른 어순을 마스터한다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분 오늘 우리는 영어 문장에서 가장 헷갈리기 쉬운 어순을 배워 볼 거예요. 문장 속에서 단어가 제자리에 가지 않으면 전혀 다른 뜻이 되거나 틀린 문장이 된답니다. 오늘 선생님과 함께 차근차근 배워서 시험에 나오는 어순 문제를 다 맞혀 봐요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 4\u003c/span>\u003ch2 class=\"g-h\">간접의문문의 어순\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">간접의문문은 \u003cb class=\"key\">의문사 + 주어 + 동사\u003c/b> 순서로 쓴다.\u003cdiv>\u003cspan class=\"g-formula\">의문사 + 주어 + 동사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Do you know \u003cspan class=\"fx\">where he lives\u003c/span>?\u003c/div>\u003cdiv class=\"g-ko\">그가 어디 사는지 아니?\u003c/div>\u003cdiv class=\"g-note\">의문사 where 뒤에 주어 he와 동사 lives가 온다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>간접의문문에서 \u003cb class=\"key\">의문문 어순\u003c/b>을 그대로 쓰지 않도록 주의한다.\u003c/div>","segs":[{"n":2,"text":"첫 번째로 배워 볼 개념은 간접의문문이에요. 간접의문문은 문장 속에서 명사 역할을 하며, 의문사 뒤에 주어와 동사가 오는 순서로 쓴다는 것을 꼭 기억해야 해요.","hl":"rule"},{"n":3,"text":"첫 번째 예문을 읽어 볼게요. Do you know where he lives? 라는 문장이에요. 뜻은 그가 어디 사는지 아니? 라는 뜻이랍니다. 여기서 where 뒤에 주어인 he와 동사인 lives가 나란히 오는 것을 볼 수 있어요.","hl":"ex-0"},{"n":4,"text":"주의할 점이 있어요. 간접의문문은 평서문 어순이 되어야 하는데 습관적으로 의문문 어순을 그대로 쓰기 쉬우니 조심해야 해요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 4\u003c/span>\u003ch2 class=\"g-h\">5형식 가목적어 it 어순\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">5형식에서 목적어가 길면 \u003cb class=\"key\">동사 + 가목적어 it + 보어 + 진목적어\u003c/b> 순서가 된다.\u003cdiv>\u003cspan class=\"g-formula\">동사 + it + 보어 + to부정사/동명사/that절\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">I \u003cspan class=\"fx\">found it easy to solve\u003c/span> the puzzle.\u003c/div>\u003cdiv class=\"g-ko\">나는 그 퍼즐을 푸는 것이 쉽다는 것을 알았다.\u003c/div>\u003cdiv class=\"g-note\">목적어가 길어 가목적어 it을 목적어 자리에 쓰고 진목적어는 뒤로 보낸다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>가목적어 자리에 it 대신 \u003cb class=\"key\">다른 대명사\u003c/b>를 쓰지 않도록 주의한다.\u003c/div>","segs":[{"n":5,"text":"두 번째 개념은 5형식 문장에서 가목적어 it을 쓰는 어순이에요. 5형식 문장에서 목적어가 너무 길면 뒤로 보내고 그 자리에 가목적어 it을 먼저 쓴답니다.","hl":"rule"},{"n":6,"text":"예문을 함께 볼까요. I found it easy to solve the puzzle. 이라는 문장이에요. 나는 그 퍼즐을 푸는 것이 쉽다는 것을 알았다 라는 뜻이죠. 동사 다음에 가목적어 it이 오고 보어와 진목적어가 차례대로 나오는 어순이에요.","hl":"ex-0"},{"n":7,"text":"이때 가목적어 자리에는 반드시 it만 써야 한다는 점을 잊지 마세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 4\u003c/span>\u003ch2 class=\"g-h\">enough의 위치\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">enough\u003c/b>는 형용사·부사 뒤에서 수식하고, \u003cb class=\"key\">명사\u003c/b> 앞에서는 앞에서 수식한다.\u003cdiv>\u003cspan class=\"g-formula\">형용사/부사 + enough / enough + 명사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">She is \u003cspan class=\"fx\">old enough\u003c/span> to drive.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 운전할 만큼 충분히 나이가 들었다.\u003c/div>\u003cdiv class=\"g-note\">형용사 old 뒤에서 enough가 수식한다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>enough를 \u003cb class=\"key\">명사 앞\u003c/b>에 쓰는지 \u003cb class=\"key\">형용사 뒤\u003c/b>에 쓰는지를 헷갈리지 않게 구별해야 한다.\u003c/div>","segs":[{"n":8,"text":"세 번째로 볼 개념은 enough의 위치예요. enough는 꾸며 주는 대상이 형용사나 부사인지, 아니면 명사인지에 따라 위치가 완전히 달라진답니다.","hl":"rule"},{"n":9,"text":"예문으로 확인해 볼게요. She is old enough to drive. 라는 문장이에요. 그녀는 운전할 만큼 충분히 나이가 들었다 라는 뜻이죠. 여기서 형용사 old 뒤에 enough가 와서 수식해 주고 있어요.","hl":"ex-0"},{"n":10,"text":"시험에서 enough의 위치를 바꾸어 틀린 문장으로 자주 내니 꾸미는 대상이 무엇인지 꼭 확인하세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 4 / 4\u003c/span>\u003ch2 class=\"g-h\">어순의 기타 주의 사항\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">so, such, too, as, how\u003c/b> + 형용사 + a + 명사 어순에도 유의한다.\u003cdiv>\u003cspan class=\"g-formula\">so/such/too/as/how + 형용사 + a + 명사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">It is \u003cspan class=\"fx\">so nice a day\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">정말 멋진 날이구나.\u003c/div>\u003cdiv class=\"g-note\">so + 형용사 + a + 명사 어순을 따른다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>어순을 바꿀 때 \u003cb class=\"key\">관사의 위치\u003c/b>를 틀리지 않도록 집중해야 한다.\u003c/div>","segs":[{"n":11,"text":"마지막 개념은 특별한 단어들이 들어갈 때의 어순이에요. so나 such 같은 단어들이 쓰이면 형용사와 관사, 명사의 순서가 일반적인 것과 달라지므로 주의해야 해요.","hl":"rule"},{"n":12,"text":"예문을 같이 읽어 볼까요. It is so nice a day. 라는 문장이에요. 정말 멋진 날이구나 라는 뜻이지요. so 뒤에 형용사 nice가 오고 그 뒤에 a와 명사 day가 오는 어순을 꼭 기억해 두세요.","hl":"ex-0"},{"n":13,"text":"이 어순 공식은 영작 문제나 서술형에서 아주 자주 나오니까 순서를 통째로 외워 두는 것이 좋아요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>Do you know where does he live?\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ Do you know where he lives?\u003c/div>\u003cdiv class=\"g-why\">간접의문문은 의문사 뒤에 의문문 어순이 아니라 주어와 동사 순서로 써야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>She is enough old to drive.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ She is old enough to drive.\u003c/div>\u003cdiv class=\"g-why\">enough는 형용사를 뒤에서 수식해야 하므로 형용사 앞에 쓰면 틀린다.\u003c/div>\u003c/div>","segs":[{"n":14,"text":"학생들이 가장 많이 하는 실수를 살펴볼게요. Do you know where does he live? 라고 쓰면 틀려요. 간접의문문 속에서는 의문문 어순인 조동사를 쓰지 않고 주어와 동사 순서로 써야 맞답니다.","hl":"mk-0"},{"n":15,"text":"두 번째 함정도 확인해 볼까요. She is enough old to drive. 라고 쓰면 틀린 문장이에요. enough는 형용사를 꾸밀 때 형용사 뒤에 와야 하므로 old enough 순서로 써야 해요.","hl":"mk-1"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 1\u003c/span>\u003cspan class=\"g-kind\">오류 수정\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 중 어법상 틀린 문장을 찾아 바르게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"g-qs\">Do you know where does he live?\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">Do you know where he lives?\u003c/span>\u003cdiv class=\"g-exp\">간접의문문은 [의문사 + 주어 + 동사] 순서여야 하므로 where does he live를 where he lives로 고쳐야 한다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":16,"text":"오늘 배운 내용을 바탕으로 퀴즈를 풀어 볼게요. 화면에 나오는 문장 중 틀린 부분을 찾아 고치는 문제예요. 잠시 영상을 멈추고 직접 정답을 생각해 보세요.","hl":"q"},{"n":17,"text":"","hl":"q","pause":6},{"n":18,"text":"정답은 Do you know where he lives? 예요. 간접의문문 안에서는 의문사 뒤에 주어와 동사 순서가 와야 하므로 does를 빼고 lives로 고쳐야 한답니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">포인트 50 어순\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>간접의문문은 \u003cb class=\"key\">의문사 + 주어 + 동사\u003c/b> 순서로 쓴다.\u003c/li>\u003cli>5형식에서 목적어가 길면 \u003cb class=\"key\">가목적어 it\u003c/b>을 쓴다.\u003c/li>\u003cli>\u003cb class=\"key\">enough\u003c/b>는 형용사·부사 뒤에서 명사 앞에서 수식한다.\u003c/li>\u003c/ul>","segs":[{"n":19,"text":"오늘 우리는 간접의문문 어순과 5형식 가목적어 그리고 enough의 위치까지 중요한 어순 규칙들을 함께 공부했어요. 어순은 영어 문장의 뼈대이므로 오늘 배운 공식들을 꼭 복습해 두기로 해요. 수고 많았어요 다음 시간에 만나요.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
