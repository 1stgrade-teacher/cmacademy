window.__LP=lecturePlayer(document.getElementById("app"),{"brand":"Check Up","title":"Chapter 9 Basic Practice (포인트 47-48)","audioDir":"practice47-48_audio","preview":false,"count":69,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">병렬 구조, 도치, 동명사와 부정사, 주어-동사 수일치, 품사 구별\u003c/div>\u003ch1>Chapter 9 Basic Practice 포인트 47-48 문제풀이\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘 풀 문제\u003c/b>10문제 · 양자택일, 옳고 그름 판단 및 고치기, 지문 어법(밑줄 친 부분 고치기)\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 병렬 구조와 도치, 동명사와 부정사, 주어와 동사의 수일치까지 한 번에 정리하는 시간이에요. 기본 문제부터 지문형 어법까지 차근차근 풀어 볼게요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">병렬 구조\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">같은 역할을 하는 요소는 같은 문법 형태로 나란히 써야 한다. \u003cb class=\"key\">and, or, but also, between A and B\u003c/b> 뒤에는 앞과 같은 형태를 맞춘다.\u003cdiv>\u003cspan class=\"g-formula\">A + and/or + A (같은 형태)\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>either A or B, not only A but also B에서 A와 B는 같은 형태\u003c/li>\u003cli>동사와 동사, 명사와 명사, 동명사와 동명사를 연결\u003c/li>\u003cli>전치사 for 뒤에는 명사 상당어, 동사는 동명사\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I like reading and writing.\u003c/div>\u003cdiv class=\"g-ko\">나는 읽기와 쓰기를 좋아한다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">She is not only smart but also kind.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 영리할 뿐만 아니라 친절하다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":2,"text":"여러분, 병렬 구조는 같은 자리에 들어가는 표현의 모양을 똑같이 맞추는 거예요. and나 or로 두 가지를 연결할 때 앞이 동명사면 뒤도 동명사, 앞이 동사원형이면 뒤도 동사원형이어야 해요. either와 or, not only와 but also도 같은 원리예요. 시험에서는 앞의 형태를 먼저 확인하고 뒤를 맞추는 것이 핵심입니다. 예를 들어 reading and writing처럼 읽기와 쓰기를 같은 동명사로 맞추면 자연스럽죠.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-1\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">We could either hike up the mountain or \u003cspan class=\"p-box\">\u003cspan>swim\u003c/span>\u003ci>/\u003c/i>\u003cspan>to swim\u003c/span>\u003c/span> in the lake.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">swim\u003c/div>\u003cdiv class=\"p-op\">to swim\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">swim\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":3,"text":"첫 번째 문제는 either와 or의 병렬 구조를 묻고 있어요. or 앞의 hike가 어떤 형태인지 먼저 확인해 보세요.","hl":"q"},{"n":4,"text":"","hl":"q","pause":7},{"n":5,"text":"정답은 swim이에요. could 뒤의 hike와 같은 동사원형으로 맞춰야 하니까 to swim이 아니라 swim이 와야 합니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 1 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-1\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">We could either hike up the mountain or \u003cspan class=\"p-box\">\u003cspan class=\"ok\">swim\u003c/span>\u003ci>/\u003c/i>\u003cspan>to swim\u003c/span>\u003c/span> in the lake.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">swim\u003c/div>\u003cdiv class=\"p-op\">to swim\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">앞의 형태 확인\u003c/b>either 뒤의 \u003cb class=\"key\">hike\u003c/b>가 조동사 could 뒤의 동사원형이므로 or 뒤도 동사원형이 와야 한다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">선택지 비교\u003c/b>\u003cb class=\"key\">swim\u003c/b>은 동사원형, \u003cb class=\"key\">to swim\u003c/b>은 to부정사이므로 병렬이 맞는 swim이 정답이다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 swim\u003c/span>\u003cdiv class=\"p-full\">We could either hike up the mountain or swim in the lake.\u003c/div>\u003cdiv class=\"p-ko\">우리는 산으로 하이킹을 하거나 호수에서 수영할 수 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>either A or B에서 A가 동사원형이면 B도 동사원형으로 맞춰야 한다.\u003c/div>","segs":[{"n":6,"text":"먼저 either 뒤에 있는 hike를 보세요. could 뒤에서 동사원형으로 쓰였으니 or 뒤에도 같은 모양이 와야 합니다.","hl":"st-0"},{"n":7,"text":"그래서 swim과 to swim 중에서는 동사원형인 swim을 골라야 하죠.","hl":"st-1"},{"n":8,"text":"이 문제의 함정도 짚고 갈게요. either A or B에서 A가 동사원형이면 B도 동사원형으로 맞춰야 한다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">도치 구문\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">부정어\u003c/b>나 \u003cb class=\"key\">so + 형용사\u003c/b>가 문장 앞에 오면 조동사나 be동사를 주어 앞에 둔다. 가정법에서 if를 생략하면 \u003cb class=\"key\">were/had\u003c/b>가 주어 앞에 온다.\u003cdiv>\u003cspan class=\"g-formula\">부정어/So+형용사 + 조동사 + 주어 + 본동사 / Were + 주어\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>Never, No sooner, Not only가 문두에 오면 조동사 도치\u003c/li>\u003cli>No sooner ... than은 had + 주어 + p.p.\u003c/li>\u003cli>So + 형용사 ... that은 be동사/조동사를 주어 앞에\u003c/li>\u003cli>Were I = If I were\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Never had I seen such a sight.\u003c/div>\u003cdiv class=\"g-ko\">나는 전에 그런 광경을 본 적이 없었다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">So kind was she that everyone loved her.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 너무 친절해서 모두가 그녀를 사랑했다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"도치 구문은 강조하고 싶은 말이 문장 앞으로 나오면서 주어와 동사의 순서가 바뀌는 거예요. Never나 No sooner, Not only 같은 부정어가 앞에 오면 조동사가 주어보다 먼저 나와요. so와 형용사가 앞에 올 때도 be동사나 조동사가 주어 앞으로 갑니다. 가정법에서 if를 생략한 경우에는 were나 had가 주어 앞에 오는 것도 꼭 기억해 주세요. 순서만 정확히 잡으면 어렵지 않아요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-2\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">Never \u003cspan class=\"p-box\">\u003cspan>she had\u003c/span>\u003ci>/\u003c/i>\u003cspan>had she\u003c/span>\u003c/span> seen such an amazing sight before.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">she had\u003c/div>\u003cdiv class=\"p-op\">had she\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">had she\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":10,"text":"두 번째 문제는 Never가 문장 앞에 나온 도치 구문이에요. 주어와 조동사 중 누가 먼저 와야 하는지 생각해 보세요.","hl":"q"},{"n":11,"text":"","hl":"q","pause":7},{"n":12,"text":"정답은 had she입니다. 부정어 Never가 앞에 있으니 조동사 had가 주어 she 앞으로 나와야 해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 10\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">A-2\u003c/span>네모 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">Never \u003cspan class=\"p-box\">\u003cspan>she had\u003c/span>\u003ci>/\u003c/i>\u003cspan class=\"ok\">had she\u003c/span>\u003c/span> seen such an amazing sight before.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">she had\u003c/div>\u003cdiv class=\"p-op\">had she\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">도치 표시 찾기\u003c/b>부정어 \u003cb class=\"key\">Never\u003c/b>가 문장 앞에 있으므로 주어와 조동사의 순서가 바뀐다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">순서 맞추기\u003c/b>조동사 \u003cb g-tags\">\u003cspan class=\"lp-tag\">문제 8 / 10\u003c/span>\u003cspan class=\"g-kind\">옳고 그름 판단 및 고치기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">B-4\u003c/span>밑줄 친 부분이 어법상 맞으면 ○표 하고, 틀리면 바르게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-q sm\">I like Susan not only for her intelligence but also \u003cu class=\"p-u\">for her kindness\u003c/u>.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">not only but also 확인\u003c/b>\u003cb class=\"key\">not only A but also B\u003c/b>에서 A와 B는 같은 형태로 병렬되어야 한다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">병렬 판단\u003c/b>앞의 \u003cb class=\"key\">for her intelligence\u003c/b>와 뒤의 \u003cb class=\"key\">for her kindness\u003c/b>가 모두 전치사 for + 명사로 병렬이 맞다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ○\u003c/span>\u003cdiv class=\"p-full\">I like Susan not only for her intelligence but also for her kindness.\u003c/div>\u003cdiv class=\"p-ko\">나는 Susan을 지능 때문만이 아니라 친절함 때문에도 좋아한다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>for를 생략하면 병렬이 깨질 수 있으므로 앞뒤 전치사까지 확인한다.\u003c/div>","segs":[{"n":51,"text":"not only와 but also 사이의 구조를 보세요. 앞뒤가 같은 형태로 연결되어야 합니다.","hl":"st-0"},{"n":52,"text":"앞에는 for her intelligence, 뒤에는 for her kindness가 와서 전치사 for와 명사 구조가 똑같습니다.","hl":"st-1"},{"n":53,"text":"이 문제의 함정도 짚고 갈게요. for를 생략하면 병렬이 깨질 수 있으므로 앞뒤 전치사까지 확인한다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">주어-동사 수일치\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">진주어\u003c/b>가 뒤에 있는 there 구문에서는 동사가 실제 주어와 수일치한다. 주어가 단수면 단수 동사, 복수면 복수 동사를 쓴다.\u003cdiv>\u003cspan class=\"g-formula\">There + be동사 + 주어\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>there 뒤의 명사가 진짜 주어\u003c/li>\u003cli>a newly opened restaurant는 단수\u003c/li>\u003cli>주어와 동사 사이의 수식어에 흔들리지 않기\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">There is a book on the desk.\u003c/div>\u003cdiv class=\"g-ko\">책상 위에 책 한 권이 있다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">There are two books on the desk.\u003c/div>\u003cdiv class=\"g-ko\">책상 위에 책 두 권이 있다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":54,"text":"there 구문에서는 there를 주어로 착각하면 안 됩니다. there는 유도부사이고, 뒤에 오는 명사가 진짜 주어예요. 그래서 a newly opened restaurant처럼 단수 명사가 오면 was를 써야 합니다. 주어와 동사 사이에 꾸며 주는 말이 많아도 동사는 진짜 주어에 맞춰 주세요.","hl":"rule"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">형용사와 명사 구별\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">명사\u003c/b>가 와야 할 자리에는 명사를, 명사를 꾸밀 때는 형용사를 쓴다. and로 연결된 요소는 같은 품사로 맞춘다.\u003cdiv>\u003cspan class=\"g-formula\">형용사 + 명사 / both + 명사 + and + 명사\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>delicious 뒤에는 명사 taste가 와야 함\u003c/li>\u003cli>tasty는 형용사라 명사 자리에 단독으로 못 씀\u003c/li>\u003cli>both A and B에서 A, B는 같은 품사\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">This soup has a delicious taste.\u003c/div>\u003cdiv class=\"g-ko\">이 수프는 맛있는 맛이 난다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">The food is tasty.\u003c/div>\u003cdiv class=\"g-ko\">그 음식은 맛있다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":55,"text":"품사 문제는 빈칸 앞뒤를 보고 명사 자리인지 형용사 자리인지 판단하는 거예요. delicious는 형용사라서 뒤에 명사가 와야 자연스럽습니다. tasty도 형용사이기 때문에 delicious tasty처럼 형용사만 두 개 이어지면 문장이 어색해요. 그래서 명사인 taste로 바꿔 주면 됩니다. both와 and 사이의 두 표현도 품사를 같게 맞춰 주세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 9 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법(밑줄 친 부분 고치기)\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C-1\u003c/span>다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg\">In the downtown area, there (1) \u003cu class=\"p-u\">were\u003c/u> a newly opened Thai restaurant. The menu featured dishes with names like nam kao tod and khao soi. Not only (2) \u003cu class=\"p-u\">I had\u003c/u> never heard of these meals before, but I was also clueless about what they were made with. Were they beef, noodles, fish? I was overwhelmed. But there was no need to be: Thai food is a beloved cuisine with both rich history and delicious (3) \u003cu class=\"p-u\">tasty\u003c/u>.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">(1) was / (2) had I / (3) taste\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":56,"text":"이번 지문은 세 군데의 밑줄을 차례로 봐야 해요. there 뒤의 주어, Not only 뒤의 어순, delicious 뒤의 품사를 중심으로 보세요.","hl":"q"},{"n":57,"text":"","hl":"q","pause":7},{"n":58,"text":"정답은 첫째 was, 둘째 had I, 셋째 taste입니다. 주어 수일치와 부정어 도치, 형용사와 명사의 구별을 모두 적용한 거예요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 9 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법(밑줄 친 부분 고치기)\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C-1\u003c/span>다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg sm\">In the downtown area, there (1) \u003cu class=\"p-u\">were\u003c/u> a newly opened Thai restaurant. The menu featured dishes with names like nam kao tod and khao soi. Not only (2) \u003cu class=\"p-u\">I had\u003c/u> never heard of these meals before, but I was also clueless about what they were made with. Were they beef, noodles, fish? I was overwhelmed. But there was no need to be: Thai food is a beloved cuisine with both rich history and delicious (3) \u003cu class=\"p-u\">tasty\u003c/u>.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">(1) 주어 찾기\u003c/b>there 구문에서 진짜 주어는 \u003cb class=\"key\">a newly opened Thai restaurant\u003c/b>이고 단수이므로 \u003cb class=\"key\">were\u003c/b>를 \u003cb class=\"key\">was\u003c/b>로 고친다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">(2) 부정어 도치\u003c/b>\u003cb class=\"key\">Not only\u003c/b>가 문장 앞에 와서 \u003cb class=\"key\">had I\u003c/b> 순서로 도치해야 한다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">(3) 명사 자리\u003c/b>\u003cb class=\"key\">delicious\u003c/b> 뒤에는 명사가 와야 하므로 형용사 \u003cb class=\"key\">tasty\u003c/b>를 명사 \u003cb class=\"key\">taste\u003c/b>로 고친다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 (1) was / (2) had I / (3) taste\u003c/span>\u003cdiv class=\"p-full\">In the downtown area, there was a newly opened Thai restaurant. The menu featured dishes with names like nam kao tod and khao soi. Not only had I never heard of these meals before, but I was also clueless about what they were made with. Were they beef, noodles, fish? I was overwhelmed. But there was no need to be: Thai food is a beloved cuisine with both rich history and delicious taste.\u003c/div>\u003cdiv class=\"p-ko\">시내 중심가에 새로 문을 연 태국 음식점이 있었다. 메뉴에는 낯선 태국 음식 이름이 있었고, 나는 그 음식 이름을 들어 본 적이 없어서 무엇으로 만든 것인지 몰랐다는 내용이다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>there 구문에서 there를 주어로 보거나, Not only 뒤 도치를 놓치거나, 형용사 tasty를 명사 자리에 그대로 두지 않는다.\u003c/div>","segs":[{"n":59,"text":"먼저 첫 번째 밑줄을 보세요. there 뒤의 진짜 주어는 a newly opened Thai restaurant이고 단수명사라서 were를 was로 고쳐야 합니다.","hl":"st-0"},{"n":60,"text":"두 번째 밑줄에서는 Not only가 문장 앞에 있으니 조동사 had가 주어 I보다 먼저 와야 해요. 그래서 I had를 had I로 고칩니다.","hl":"st-1"},{"n":61,"text":"세 번째 밑줄은 delicious 뒤에 명사가 와야 한다는 점이 핵심이에요. tasty는 형용사이므로 명사인 taste로 고쳐 주세요.","hl":"st-2"},{"n":62,"text":"이 문제의 함정도 짚고 갈게요. there 구문에서 there를 주어로 보거나, Not only 뒤 도치를 놓치거나, 형용사 tasty를 명사 자리에 그대로 두지 않는다.","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 10 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법(밑줄 친 부분 고치기)\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C-2\u003c/span>다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg\">Your music preference in the moment can depend on how you want to feel. You will pick specific types of music depending on whether you're going to exercise or (1) \u003cu class=\"p-u\">relaxing\u003c/u>. The right music can boost your mood and your motivation to clean up, do homework, or (2) \u003cu class=\"p-u\">working\u003c/u> out. In contrast, you will avoid music that makes you feel sad or bored.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">(1) relax / (2) work\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":63,"text":"이번 지문은 or로 연결된 동사들의 형태를 맞추는 문제예요. 앞에 나온 exercise와 clean up, do homework의 형태를 확인해 보세요.","hl":"q"},{"n":64,"text":"","hl":"q","pause":7},{"n":65,"text":"정답은 첫째 relax, 둘째 work입니다. or로 연결된 동사는 앞의 동사원형과 똑같이 맞춰 주면 돼요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 10 / 10\u003c/span>\u003cspan class=\"g-kind\">지문 어법(밑줄 친 부분 고치기)\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">C-2\u003c/span>다음 글의 밑줄 친 부분을 모두 어법에 맞게 고쳐 쓰시오.\u003c/div>\u003cdiv class=\"p-psg sm\">Your music preference in the moment can depend on how you want to feel. You will pick specific types of music depending on whether you're going to exercise or (1) \u003cu class=\"p-u\">relaxing\u003c/u>. The right music can boost your mood and your motivation to clean up, do homework, or (2) \u003cu class=\"p-u\">working\u003c/u> out. In contrast, you will avoid music that makes you feel sad or bored.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">(1) 병렬 확인\u003c/b>\u003cb class=\"key\">going to exercise or relaxing\u003c/b>에서 \u003cb class=\"key\">exercise\u003c/b>와 or로 연결되므로 \u003cb class=\"key\">relaxing\u003c/b>를 동사원형 \u003cb class=\"key\">relax\u003c/b>로 고친다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">(2) 병렬 확인\u003c/b>\u003cb class=\"key\">clean up, do homework, or working out\u003c/b>에서 앞의 동사원형들과 연결되므로 \u003cb class=\"key\">working\u003c/b>을 \u003cb class=\"key\">work\u003c/b>로 고친다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 (1) relax / (2) work\u003c/span>\u003cdiv class=\"p-full\">Your music preference in the moment can depend on how you want to feel. You will pick specific types of music depending on whether you're going to exercise or relax. The right music can boost your mood and your motivation to clean up, do homework, or work out. In contrast, you will avoid music that makes you feel sad or bored.\u003c/div>\u003cdiv class=\"p-ko\">그 순간의 음악 취향은 자신이 어떤 기분을 원하는지에 따라 달라질 수 있다. 운동을 하거나 긴장을 풀 때 등 상황에 맞는 음악을 고르게 된다는 내용이다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>or로 연결된 동사는 앞의 형태에 맞춰야 하며, be going to 뒤에는 동사원형이 온다.\u003c/div>","segs":[{"n":66,"text":"첫 번째 밑줄은 going to exercise or relaxing을 보세요. exercise와 or로 연결되니 뒤도 동사원형 relax가 와야 합니다.","hl":"st-0"},{"n":67,"text":"두 번째 밑줄은 clean up, do homework, or working out의 연결을 봐요. 앞이 동사원형이므로 working을 work로 고쳐야 합니다.","hl":"st-1"},{"n":68,"text":"이 문제의 함정도 짚고 갈게요. or로 연결된 동사는 앞의 형태에 맞춰야 하며, be going to 뒤에는 동사원형이 온다.","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">병렬 구조, 도치, 동명사와 부정사, 주어-동사 수일치, 품사 구별\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>같은 역할을 하는 말은 \u003cb class=\"key\">병렬 구조\u003c/b>로 형태를 맞춘다.\u003c/li>\u003cli>부정어나 so+형용사가 문두에 오면 \u003cb class=\"key\">도치\u003c/b>가 일어난다.\u003c/li>\u003cli>there 구문에서는 \u003cb class=\"key\">진주어\u003c/b>에 동사를 수일치한다.\u003c/li>\u003cli>명사 자리와 형용사 자리를 구별하고, or로 연결된 동사는 \u003cb class=\"key\">동사원형\u003c/b>으로 맞춘다.\u003c/li>\u003c/ul>","segs":[{"n":69,"text":"오늘은 병렬 구조와 도치, 수일치, 품사 구별을 중심으로 문제를 풀었어요. 문제를 다시 볼 때는 연결되는 앞뒤 표현의 모양과 문장 앞에 나온 강조 표현을 먼저 확인해 보세요. 그 습관만 들이면 기본 문제부터 지문형 어법까지 안정적으로 풀 수 있습니다.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
