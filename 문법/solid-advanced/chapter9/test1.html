s soon as possible.\u003c/div>\u003cdiv class=\"p-ko\">그의 일은 너무 스트레스가 심해서 가능한 한 빨리 그만두고 싶었다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>so가 문두에 있어도 주어가 먼저 온다고 착각하지 않기\u003c/div>","segs":[{"n":6,"text":"문장 앞에 so stressful가 나오면 강조 도치를 의심해야 해요. 이때 be동사가 주어 his job 앞으로 가야 합니다.","hl":"st-0"},{"n":7,"text":"그래서 was his job 순서로 쓰면 되어요. that절에는 그 결과가 이어집니다.","hl":"st-1"},{"n":8,"text":"이 문제의 함정도 짚고 갈게요. so가 문두에 있어도 주어가 먼저 온다고 착각하지 않기","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">감탄문 What과 How\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">What + a/an + 형용사 + 명사 + 주어 + 동사\u003c/b>와 \u003cb class=\"key\">How + 형용사/부사 + 주어 + 동사\u003c/b>를 구별합니다.\u003cdiv>\u003cspan class=\"g-formula\">What + a/an + 형용사 + 명사 + S + V / How + 형용사 + S + V\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>명사가 있으면 What\u003c/li>\u003cli>형용사·부사만 있으면 How\u003c/li>\u003cli>감탄 표현 뒤에는 주어와 동사 순서\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">What a kind boy\u003c/span> he is!\u003c/div>\u003cdiv class=\"g-ko\">그는 얼마나 친절한 소년인지!\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">How interesting\u003c/span> the movie is!\u003c/div>\u003cdiv class=\"g-ko\">그 영화는 얼마나 흥미로운지!\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"감탄문은 what과 how를 구별하는 게 핵심이에요. what은 뒤에 명사가 있을 때, how는 형용사나 부사만 있을 때 씁니다. what a nice boy처럼 관사와 명사가 함께 나오면 what이고, how interesting처럼 형용사만 있으면 how예요. 문장 순서는 감탄 표현 다음에 주어와 동사가 옵니다.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 20\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">2\u003c/span>괄호 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">\u003cspan class=\"p-box\">\u003cspan>What\u003c/span>\u003ci>/\u003c/i>\u003cspan>How\u003c/span>\u003c/span> interesting the new movie is! I guarantee that it will be a hit.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">What\u003c/div>\u003cdiv class=\"p-op\">How\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">How\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":10,"text":"두 번째 문제는 감탄문에서 what과 how 중 무엇을 쓸지 고르는 문제예요. 뒤에 명사가 있는지 보세요.","hl":"q"},{"n":11,"text":"","hl":"q","pause":7},{"n":12,"text":"정답은 how입니다. interesting이라는 형용사만 있으므로 how를 써야 합니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 2 / 20\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">2\u003c/span>괄호 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">\u003cspan class=\"p-box\">\u003cspan>What\u003c/span>\u003ci>/\u003c/i>\u003cspan class=\"ok\">How\u003c/span>\u003c/span> interesting the new movie is! I guarantee that it will be a hit.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">What\u003c/div>\u003cdiv class=\"p-op\">How\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">감탄문 종류 판단\u003c/b>interesting은 형용사이고 뒤에 명사가 없으므로 \u003cb class=\"key\">How + 형용사 + 주어 + 동사\u003c/b>입니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">전체 확인\u003c/b>\u003cb class=\"key\">How interesting the new movie is!\u003c/b>가 알맞습니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 How\u003c/span>\u003cdiv class=\"p-full\">How interesting the new movie is! I guarantee that it will be a hit.\u003c/div>\u003cdiv class=\"p-ko\">그 새 영화는 얼마나 흥미로운지! 나는 그것이 대박이 될 것이라고 장담한다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>형용사만 있을 때 What을 쓰지 않기\u003c/div>","segs":[{"n":13,"text":"interesting은 형용사이고 뒤에 명사가 없어요. 이럴 때는 how를 써서 how interesting the new movie is 순서로 만듭니다.","hl":"st-0"},{"n":14,"text":"그래서 how interesting the new movie is가 알맞은 감탄문입니다.","hl":"st-1"},{"n":15,"text":"이 문제의 함정도 짚고 갈게요. 형용사만 있을 때 What을 쓰지 않기","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">부정어·Only 도치\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">Hardly/Never/Little/Not until/Only then + 조동사 + 주어 + 동사\u003c/b> 어순으로 도치합니다.\u003cdiv>\u003cspan class=\"g-formula\">부정어 + 조동사 + 주어 + 동사원형\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>조동사가 없으면 do/does/did를 넣는다\u003c/li>\u003cli>본동사는 원형으로 쓴다\u003c/li>\u003cli>도치 후에도 주어와 동사의 수를 맞춘다\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Hardly had we\u003c/span> sat down when the phone rang.\u003c/div>\u003cdiv class=\"g-ko\">우리가 앉자마자 전화가 울렸다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Never do they\u003c/span> give up.\u003c/div>\u003cdiv class=\"g-ko\">그들은 결코 포기하지 않는다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":16,"text":"부정어 도치는 hardly, never, little, not until, only then 같은 표현이 문장 앞에 오면 일어납니다. 이때 조동사가 주어 앞으로 나가고, 일반동사는 원형으로 남아요. 조동사가 없으면 do, does, did를 주어 수와 시제에 맞게 넣습니다. 주어와 동사의 수 일치도 꼭 확인하세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 3 / 20\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">3\u003c/span>괄호 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">Hardly \u003cspan class=\"p-box\">\u003cspan>we had\u003c/span>\u003ci>/\u003c/i>\u003cspan>had we\u003c/s 시작했다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>Hardly 뒤에 주어를 먼저 쓰지 않기\u003c/div>","segs":[{"n":20,"text":"문장 앞에 hardly가 나오면 부정어 도치를 먼저 떠올려야 해요.","hl":"st-0"},{"n":21,"text":"그래서 조동사 had가 주어 we 앞으로 가서 hardly had we sat down 순서가 됩니다.","hl":"st-1"},{"n":22,"text":"이 문제의 함정도 짚고 갈게요. Hardly 뒤에 주어를 먼저 쓰지 않기","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">병렬 구조\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">and/or/but/either A or B/not only A but also B/than\u003c/b> 앞뒤는 같은 품사와 형태로 맞춥니다.\u003cdiv>\u003cspan class=\"g-formula\">A + and + B (A와 B는 같은 형태)\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>동사원형과 동사원형\u003c/li>\u003cli>동명사와 동명사\u003c/li>\u003cli>시제와 수도 흐름에 맞춘다\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">He tried to sleep, eat well, and follow the advice.\u003c/div>\u003cdiv class=\"g-ko\">그는 잠을 자고, 잘 먹고, 조언을 따르려고 했다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">Walking is better than sleeping.\u003c/div>\u003cdiv class=\"g-ko\">걷는 것이 자는 것보다 낫다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":23,"text":"병렬 구조는 and, or, but, not only but also, either or, than 같은 연결 표현 앞뒤를 같은 형태로 맞추는 규칙이에요. 앞이 동사원형이면 뒤도 동사원형, 앞이 동명사면 뒤도 동명사로 씁니다. 시제가 같은 흐름이면 동사의 시제도 맞춰 주세요. 이 문제들은 같은 자리에 들어갈 표현의 모양을 비교하면 쉽게 풀립니다.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 4 / 20\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">4\u003c/span>괄호 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">The boy tried to get a lot of sleep, not eat too much, and \u003cspan class=\"p-box\">\u003cspan>follow\u003c/span>\u003ci>/\u003c/i>\u003cspan>following\u003c/span>\u003c/span> his father's advice faithfully. \u003cspan class=\"p-box\">\u003cspan>What\u003c/span>\u003ci>/\u003c/i>\u003cspan>How\u003c/span>\u003c/span> a nice boy he is!\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">follow / following\u003c/div>\u003cdiv class=\"p-op\">What / How\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">follow, What\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":24,"text":"네 번째 문제는 병렬 구조와 감탄문이 함께 나와요. and 앞뒤 형태와 감탄문 뒤에 명사가 있는지 보세요.","hl":"q"},{"n":25,"text":"","hl":"q","pause":7},{"n":26,"text":"정답은 follow와 what입니다. 병렬이므로 follow를 쓰고, a nice boy가 있으므로 what을 씁니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 4 / 20\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">4\u003c/span>괄호 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">The boy tried to get a lot of sleep, not eat too much, and \u003cspan class=\"p-box\">\u003cspan>follow\u003c/span>\u003ci>/\u003c/i>\u003cspan>following\u003c/span>\u003c/span> his father's advice faithfully. \u003cspan class=\"p-box\">\u003cspan>What\u003c/span>\u003ci>/\u003c/i>\u003cspan>How\u003c/span>\u003c/span> a nice boy he is!\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">follow / following\u003c/div>\u003cdiv class=\"p-op\">What / How\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">병렬 구조 확인\u003c/b>to get, not eat, and ___가 병렬이므로 동사원형 \u003cb class=\"key\">follow\u003c/b>가 알맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">감탄문 확인\u003c/b>a nice boy처럼 관사와 명사가 있으므로 \u003cb class=\"key\">What a nice boy he is!\u003c/b>입니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 follow, What\u003c/span>\u003cdiv class=\"p-full\">The boy tried to get a lot of sleep, not eat too much, and follow his father's advice faithfully. What a nice boy he is!\u003c/div>\u003cdiv class=\"p-ko\">그 소년은 잠을 많이 자고, 너무 많이 먹지 않고, 아버지의 조언을 충실히 따르려고 했다. 그는 얼마나 착한 소년인지!\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>and 뒤에서 앞의 동사원형 흐름을 끊지 않기\u003c/div>","segs":[{"n":27,"text":"앞에 to get과 not eat이 이어지고 and로 연결되므로 뒤에도 동사원형 follow가 와야 해요.","hl":"st-0"},{"n":28,"text":"a nice boy라는 명사 표현이 있으므로 what을 써서 what a nice boy he is로 만듭니다.","hl":"st-1"},{"n":29,"text":"이 문제의 함정도 짚고 갈게요. and 뒤에서 앞의 동사원형 흐름을 끊지 않기","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">It is/was 강조구문\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">It is/was + 강조할 말 + that/who + 나머지 문장\u003c/b>으로 강조하며, 사람은 who/that, 사물은 that을 주로 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">It is/was + 강조할 말 + that/who + 나머지 문장\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>사람이면 who/that\u003c/li>\u003cli>사물·시간·장소는 that이 기본\u003c/li>\u003cli>장소 부사구 뒤에서는 where가 가능한 경우도 있다\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">It was Daniel \u003cspan class=\"fx\">who\u003c/span> helped me.\u003c/div>\u003cdiv class=\"g-ko\">나를 도운 것은 다니엘이었다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">It was last week \u003cspan class=\"fx\">that\u003c/span> I met him.\u003c/div>\u003cdiv class=\"g-ko\">내가 그를 만난 것은 지난주였다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":30,"text":"It is나 It was로 시작하는 강조구문은 강조할 내용을 It is와 that 사이에 넣는 구조예요. 강조하는 대상이 사람이면 who를, 사람이 아니면 that을 주로 씁니다. 뒤에는 강조한 부분을 뺀 나머지 문장이 완전한 형태로 이어집니다. 장소를 강조할 때 where가 쓰이는 경우도 있으니 문제의 선택지와 함께 판단하세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 5 / 20\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">5\u003c/span>괄호 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">It was Daniel \u003cspan class=\"p-box\">\u003cspan>who\u003c/span>\u003ci>/\u003c/i>\u003cspan>which\u003c/span>\u003c/span> was a poor student. He waited until the last minute to study for the exam, completed his lab problems in a careless manner, and \u003cspan class=\"p-box\">\u003cspan>lack\u003c/span>\u003ci>/\u003c/i>\u003cspan>lacked\u003c/span>\u003c/span> motivation.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">who / which\u003c/div>\u003cdiv class=\"p-op\">lack / lacked\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">who, lacked\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":31,"text":"다섯 번째 문제는 사람을 강조하는 구문과 병렬 구조를 함께 봐야 해요. Daniel이 사람인지, and 뒤의 시제가 무엇인지 확인하세요.","hl":"q"},{"n":32,"text":"","hl":"q","pause":7},{"n":33,"text":"정답은 who와 lacked입니다. 사람은 who로 강조하고, waited와 completed에 맞춰 lacked를 씁니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 5 / 20\u003c/span>\u003cspan class=\"g-kind\">양자택일\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">5\u003c/span>괄호 안에서 어법상 알맞은 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">It was Daniel \u003cspan class=\"p-box\">\u003cspan>who\u003c/span>\u003ci>/\u003c/i>\u003cspan>which\u003c/span>\u003c/span> was a poor student. He waited until the last minute to study for the exam, completed his lab problems in a careless manner, and \u003cspan class=\"p-box\">\u003cspan>lack\u003c/span>\u003ci>/\u003c/i>\u003cspan>lacked\u003c/span>\u003c/span> motivation.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">who / which\u003c/div>\u003cdiv class=\"p-op\">lack / lacked\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">강조구문 확인\u003c/b>Daniel은 사람이므로 \u003cb class=\"key\">It was Daniel who ...\u003c/b>가 알맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">병렬 구조 확인\u003c/b>waited, completed, and ___가 과거 시제로 병렬이므로 \u003cb class=\"key\">lacked\u003c/b>입니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 who, lacked\u003c/span>\u003cdiv class=\"p-full\">It was Daniel who was a poor student. He waited until the last minute to study for the exam, completed his lab problems in a careless manner, and lacked motivation.\u003c/div>\u003cdiv class=\"p-ko\">가난한 학생이었던 사람은 바로 다니엘이었다. 그는 시험 공부를 마지막 순간까지 미뤘고, 실험 문제를 부주의하게 끝냈으며, 의욕이 부족했다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>사람 강조 뒤에 which를 쓰지 않기 / 병렬 시제 맞추기\u003c/div>","segs":[{"n":34,"text":"다니엘은 사람이므로 강조구문에서 who를 써서 It was Daniel who로 만듭니다.","hl":"st-0"},{"n":35,"text":"앞에 waited와 completed가 과거형으로 이어지므로 and 뒤에도 과거형 lacked가 와야 해요.","hl":"st-1"},{"n":36,"text":"이 문제의 함정도 짚고 갈게요. 사람 강조 뒤에 which를 쓰지 않기 / 병렬 시제 맞추기","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">동명사와 to부정사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">전치사 뒤\u003c/b>에는 동명사를 쓰고, \u003cb class=\"key\">than 앞뒤\u003c/b>에서는 같은 형태를 유지합니다.\u003cdiv>\u003cspan class=\"g-formula\">전치사 + 동명사 / A than B (A와 B는 같은 형태)\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>when it comes to 뒤에는 동명사\u003c/li>\u003cli>비교 표현 than 앞뒤는 같은 형태\u003c/li>\u003cli>동명사와 to부정사 중 문법 자리로 판단\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">When it comes to \u003cspan class=\"fx\">producing\u003c/span> change, patience is needed.\u003c/div>\u003cdiv class=\"g-ko\">변화를 만드는 것에 관해서는 인내가 필요하다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">Walking is better than \u003cspan class=\"fx\">sleeping\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">걷는 것이 자는 것보다 낫다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":37,"text":"동명사와 to부정사는 문장에서 자리와 앞뒤 표현을 보고 고릅니다. 전치사 뒤에는 동명사를 쓰고, when it comes to 뒤에도 동명사가 옵니다. 비교 표현 than 앞뒤에서는 같은 형태를 맞춰야 하므로 앞이 동명사면 뒤도 동명사로 씁니다. 해석만 하지 말고 문법 자리를 먼저 확인하세요.","hl":"rule"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">do/does/did 동사 강조\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">do/does/did + 동사원형\u003c/b>으로 동사를 강조하고, 주어의 인칭·수와 시제에 맞춥니다.\u003cdiv>\u003cspan class=\"g-formula\">do/does/did + 동사원형\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>본동사는 반드시 원형\u003c/li>\u003cli>주어가 3인칭 단수 현재면 does\u003c/li>\u003cli>과거면 did\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">They \u003cspan class=\"fx\">do value\u003c/span> their ancestors' wisdom.\u003c/div>\u003cdiv class=\"g-ko\">그들은 정말로 조상의 지혜를 소중히 여긴다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">She \u003cspan class=\"fx\">does like\u003c/span> him.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 정말로 그를 좋아한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":38,"text":"동사 강조는 일반동사 앞에 do, does, did를 넣어 뜻을 강하게 만드는 방법이에요. 주어가 삼인칭 단수이고 현재면 does, 과거면 did, 그 외에는 do를 씁니다. 이때 본동사는 반드시 원형으로 써야 합니다. 강조의 느낌을 살려 정말로, 분명히 같은 말로 해석하면 됩니다.","hl":"rule"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">보어·장소 부사구 도치\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">보어/장소 부사구 + 동사 + 주어\u003c/b> 어순으로 도치되며, 동사는 뒤의 진주어와 수 일치합니다.\u003cdiv>\u003cspan class=\"g-formula\">보어/장소 표현 + be동사 + 주어\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>문두의 보어가 강조된다\u003c/li>\u003cli>동사가 주어 앞으로 온다\u003c/li>\u003cli>뒤의 진주어와 수를 맞춘다\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">On the table \u003cspan class=\"fx\">was a black cat\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">탁자 위에 검은 고양이가 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">Less well known \u003cspan class=\"fx\">was the fact\u003c/span> that he was kind.\u003c/div>\u003cdiv class=\"g-ko\">덜 알려진 것은 그가 친절했다는 사실이었다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":39,"text":"문장 앞에 보어나 장소 부사구가 오면 주어와 동사가 도치될 수 있습니다. Less well known at the time was the fact처럼 보어가 앞에 나오면 동사 was가 주어 앞으로 갑니다. On the tiny table was a black cat도 장소 표현이 앞에 나온 도치예요. 이때도 동사는 뒤에 있는 진주어와 수를 맞춥니다.","hl":"rule"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">명사절 whether/that\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">whether/that\u003c/b>은 명사절을 이끌며 뒤에는 주어와 동사가 있는 완전한 절이 옵니다.\u003cdiv>\u003cspan class=\"g-formula\">whether + 주어 + 동사 / that + 주어 + 동사\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>whether는 ‘~인지 아닌지’\u003c/li>\u003cli>that은 ‘~라는 것’\u003c/li>\u003cli>보어·목적어 자리에 올 수 있다\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The question is \u003cspan class=\"fx\">whether\u003c/span> emoticons help users.\u003c/div>\u003cdiv class=\"g-ko\">문제는 이모티콘이 사용자에게 도움이 되는지이다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">I know \u003cspan class=\"fx\">that\u003c/span> it is true.\u003c/div>\u003cdiv class=\"g-ko\">나는 그것이 사실이라는 것을 안다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":40,"text":"명사절을 이끄는 whether는 인지 아닌지라는 뜻으로 완전한 절을 데리고 옵니다. The question is whether처럼 보어 자리에 와도 문장 구조는 그대로예요. that도 명사절을 이끌 수 있고, news나 fact 뒤에서 내용을 설명할 때 자주 쓰입니다. 접속사 뒤에는 주어와 동사가 갖춰진 절이 오는지 확인하세요.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 6 / 20\u003c/span>\u003cspan class=\"g-kind\">틀린 것 고르기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">6\u003c/span>다음 중 밑줄 친 부분이 어법상 틀린 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">① Walking for a minute is much better for boosting your energy than \u003cu class=\"p-u\">to sleep\u003c/u>.\u003cbr>② They \u003cu class=\"p-u\">do value\u003c/u> their ancestors' wisdom and follow their teachings.\u003cbr>③ Not until the rain had stopped \u003cu class=\"p-u\">could we\u003c/u> see the magnificent view of the ocean.\u003cbr>④ On the tiny table \u003cu class=\"p-u\">was\u003c/u> a black cat, dozing off in the sunshine.\u003cbr>⑤ The question is \u003cu class=\"p-u\">whether\u003c/u> emoticons help users to understand emotions in online communication.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">①\u003c/div>\u003cdiv class=\"p-op\">②\u003c/div>\u003cdiv class=\"p-op\">③\u003c/div>\u003cdiv class=\"p-op\">④\u003c/div>\u003cdiv class=\"p-op\">⑤\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">① (to sleep → sleeping)\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":41,"text":"여섯 번째 문제는 다섯 문장 중 밑줄 친 부분이 틀린 것을 찾는 문제예요. 비교 표현과 도치, 동사 강조를 차례로 확인하세요.","hl":"q"},{"n":42,"text":"","hl":"q","pause":7},{"n":43,"text":"정답은 첫 번째입니다. Walking과 비교하므로 to sleep이 아니라 sleeping으로 고쳐야 합니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 6 / 20\u003c/span>\u003cspan class=\"g-kind\">틀린 것 고르기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">6\u003c/span>다음 중 밑줄 친 부분이 어법상 틀린 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">① Walking for a minute is much better for boosting your energy than \u003cu class=\"p-u\">to sleep\u003c/u>.\u003cbr>② They \u003cu class=\"p-u\">do value\u003c/u> their ancestors' wisdom and follow their teachings.\u003cbr>③ Not until the rain had stopped \u003cu class=\"p-u\">could we\u003c/u> see the magnificent view of the ocean.\u003cbr>④ On the tiny table \u003cu class=\"p-u\">was\u003c/u> a black cat, dozing off in the sunshine.\u003cbr>⑤ The question is \u003cu class=\"p-u\">whether\u003c/u> emoticons help users to understand emotions in online communication.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">①\u003c/div>\u003cdiv class=\"p-op\">②\u003c/div>\u003cdiv class=\"p-op\">③\u003c/div>\u003cdiv class=\"p-op\">④\u003c/div>\u003cdiv class=\"p-op\">⑤\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">① 확인\u003c/b>앞의 Walking과 비교하므로 than 뒤도 동명사 \u003cb class=\"key\">sleeping\u003c/b>이어야 합니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">② 확인\u003c/b>\u003cb class=\"key\">do value\u003c/b>는 동사 강조로, 주어 They에 맞는 do이므로 알맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">③ 확인\u003c/b>Not until이 문두에 와서 \u003cb class=\"key\">could we\u003c/b>처럼 조동사가 주어 앞으로 간 도치이며 알맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">④ 확인\u003c/b>장소 표현 On the tiny table이 앞에 와서 \u003cb class=\"key\">was a black cat\u003c/b>으로 도치된 형태이며 알맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-4\">\u003cb class=\"l\">⑤ 확인\u003c/b>\u003cb class=\"key\">whether\u003c/b>는 ‘~인지 아닌지’를 이끄는 명사절 접속사로 알맞습니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ① (to sleep → sleeping)\u003c/span>\u003cdiv class=\"p-full\">Walking for a minute is much better for boosting your energy than sleeping.\u003c/div>\u003cdiv class=\"p-ko\">1분 걷는 것은 에너지를 높이는 데 잠자는 것보다 훨씬 낫다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>than 앞뒤는 같은 형태로 맞춰야 한다는 점 놓치지 않기\u003c/div>","segs":[{"n":44,"text":"첫 번째 선택지는 앞에 Walking이라는 동명사가 나오므로 than 뒤도 sleeping으로 맞춰야 해요. to sleep은 병렬이 깨져 틀립니다.","hl":"st-0"},{"n":45,"text":"두 번째 선택지는 주어가 They이고 동사 강조의 do가 쓰였으므로 알맞습니다.","hl":"st-1"},{"n":46,"text":"세 번째 선택지는 not until이 앞에 나와 could we 순서로 도치되었으므로 알맞아요.","hl":"st-2"},{"n":47,"text":"네 번째 선택지는 장소 표현이 앞에 나와 was a black cat 순서로 도치되었으므로 알맞습니다.","hl":"st-3"},{"n":48,"text":"다섯 번째 선택지는 whether가 명사절을 이끌어 알맞습니다.","hl":"st-4"},{"n":49,"text":"이 문제의 함정도 짚고 갈게요. than 앞뒤는 같은 형태로 맞춰야 한다는 점 놓치지 않기","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">가정법 도치\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">If + 주어 + were/had\u003c/b>에서 if를 생략하면 \u003cb class=\"key\">Were/Had + 주어\u003c/b>로 도치합니다.\u003cdiv>\u003cspan class=\"g-formula\">Were + 주어 ~ / Had + 주어 + p.p. ~\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>Were I = If I were\u003c/li>\u003cli>Had he known = If he had known\u003c/li>\u003cli>Had it not been for = If it had not been for\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Were I\u003c/span> in your shoes, I would rethink it.\u003c/div>\u003cdiv class=\"g-ko\">내가 너라면 그것을 다시 생각할 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Had he known\u003c/span> the truth, he would have called me.\u003c/div>\u003cdiv class=\"g-ko\">그가 사실을 알았더라면 나에게 전화했을 텐데.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":50,"text":"가정법에서 if를 생략하면 were나 had가 주어 앞으로 나갑니다. Were I in your shoes는 If I were in your shoes와 같은 뜻이고, Had he known은 If he had known과 같아요. 부정문은 Had it not been for처럼 not을 주어 뒤에 둡니다. 주절에는 would have p.p. 형태가 오는지도 함께 확인하세요.","hl":"rule"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">관계대명사와 관계부사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">관계대명사\u003c/b>는 선행사를 받아 뒤 절에서 주어·목적어 역할을 하고, \u003cb class=\"key\">관계부사 where\u003c/b>는 장소 선행사 뒤에서 완전한 절을 이끕니다.\u003cdiv>\u003cspan class=\"g-formula\">선행사 + who/which/that + 불완전한 절 / 장소 + where + 완전한 절\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>사람은 who/that\u003c/li>\u003cli>사물은 which/that\u003c/li>\u003cli>where 뒤는 완전한 절\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The car \u003cspan class=\"fx\">that is popular\u003c/span> is hybrid.\u003c/div>\u003cdiv class=\"g-ko\">인기 있는 차는 하이브리드 차이다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">This is the house \u003cspan class=\"fx\">where he lived\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">이곳은 그가 살았던 집이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":51,"text":"관계대명사는 선행사를 받아 뒤 문장에서 주어나 목적어 역할을 합니다. 사람은 who나 that, 사물은 which나 that을 쓸 수 있습니다. 관계부사 where는 장소를 나타내는 선행사 뒤에서 뒤 문장이 완전할 때 씁니다. 강조구문인지 관계대명사인지에 따라 that과 which 선택이 달라질 수 있으니 구조를 먼저 보세요.","hl":"rule"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">주어-동사 수 일치\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">동사는 진주어/실제 주어와 수 일치\u003c/b>하며, a number of + 복수명사는 복수로 취급합니다.\u003cdiv>\u003cspan class=\"g-formula\">There are + 복수명사 / 주어(복수) + 복수동사\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>도치문은 뒤의 진주어를 찾는다\u003c/li>\u003cli>a number of는 복수\u003c/li>\u003cli>there 구문은 뒤 명사에 맞춘다\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">There \u003cspan class=\"fx\">are\u003c/span> a number of advantages.\u003c/div>\u003cdiv class=\"g-ko\">많은 장점이 있다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">Not only \u003cspan class=\"fx\">do hybrids\u003c/span> run cleaner, but they also save gas.\u003c/div>\u003cdiv class=\"g-ko\">하이브리드 차는 더 깨끗하게 달릴 뿐 아니라 연료도 절약한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":52,"text":"도치문이나 there 구문에서는 동사의 수를 진짜 주어와 맞춰야 합니다. There are a number of advantages에서 a number of는 많은이라는 뜻이라 복수로 봅니다. Not only does hybrids처럼 조동사가 앞에 나왔을 때도 실제 주어가 hybrids인지 확인하세요. 주어를 찾는 것이 수 일치의 첫걸음입니다.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 7 / 20\u003c/span>\u003cspan class=\"g-kind\">틀린 문장 짝짓기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">7\u003c/span>다음 중 어법상 틀린 문장끼리 짝지어진 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q\">ⓐ They didn't send us the data at the appointed time, nor they called us.\u003cbr>ⓑ Were I in your shoes I would rethink his proposal instead of rejecting it.\u003cbr>ⓒ The company considered either expanding the business or entering a new market.\u003cbr>ⓓ It was deep in the forest where the explorers witnessed the rare bird.\u003cbr>ⓔ Little was people prepared for the flood that devastated the town.\u003c/div>\u003cdiv class=\"p-opts\">\u003cdiv class=\"p-op\">① ⓐ, ⓑ\u003c/div>\u003cdiv class=\"p-op\">② ⓐ, ⓔ\u003c/div>\u003cdiv class=\"p-op\">③ ⓑ, ⓒ\u003c/div>\u003cdiv class=\"p-op\">④ ⓒ, ⓓ\u003c/div>\u003cdiv class=\"p-op\">⑤ ⓓ, ⓔ\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">②\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":53,"text":"일곱 번째 문제는 다섯 문장 중 틀린 문장 두 개를 골라 짝짓는 문제예요. 부정어 도치와 가정법 도치, 병렬을 확인하세요.","hl":"q"},{"n":54,"text":"","hl":"q","pause":7},{"n":55,"text":"정답은 두 번째입니다. 첫 번째 보기는 nor 뒤 도치가 빠졌고, 다섯 번째 보기는 people에 was를 써서 틀렸습니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 7 / 20\u003c/span>\u003cspan class=\"g-kind\">틀린 문장 짝짓기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">7\u003c/span>다음 중 어법상 틀린 문장끼리 짝지어진 것을 고르시오.\u003c/div>\u003cdiv class=\"p-q sm\">ⓐ They didn't send us the data at the appointed time, nor they called us.\u003cbr>ⓑ Were I in your shoes I would rethink his proposal instead of rejecting it.\u003cbr>ⓒ The company considered either expanding the business or entering a new market.\u003cbr>ⓓ It was deep in the forest where the explorers witnessed the rare bird.\u003cbr>ⓔ Little was people prepared for the flood that devastated the town.\u003c/div>\u003cdiv class=\"p-opts sm\">\u003cdiv class=\"p-op\">① ⓐ, ⓑ\u003c/div>\u003cdiv class=\"p-op\">② ⓐ, ⓔ\u003c/div>\u003cdiv class=\"p-op\">③ ⓑ, ⓒ\u003c/div>\u003cdiv class=\"p-op\">④ ⓒ, ⓓ\u003c/div>\u003cdiv class=\"p-op\">⑤ ⓓ, ⓔ\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">ⓐ 확인\u003c/b>nor 뒤에는 \u003cb class=\"key\">nor did they call us\u003c/b>처럼 조동사 도치가 필요하므로 틀립니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">ⓑ 확인\u003c/b>\u003cb class=\"key\">Were I in your shoes\u003c/b>는 If I were의 도치로 알맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">ⓒ 확인\u003c/b>either expanding or entering으로 동명사 병렬이므로 알맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-3\">\u003cb class=\"l\">ⓓ 확인\u003c/b>장소를 강조하는 \u003cb class=\"key\">where\u003c/b> 표현으로 어색하지 않습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-4\">\u003cb class=\"l\">ⓔ 확인\u003c/b>주어 people이 복수이므로 \u003cb class=\"key\">Little were people prepared\u003c/b>가 되어야 합니다. was는 틀립니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-5\">\u003cb class=\"l\">정답 조합\u003c/b>틀린 문장은 \u003cb class=\"key\">ⓐ, ⓔ\u003c/b>이므로 ②입니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ②\u003c/span>\u003cdiv class=\"p-ko\">틀린 문장은 ⓐ와 ⓔ이며, ⓐ는 nor did they call us, ⓔ는 Little were people prepared로 고친다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>Little 뒤에서도 주어 people에 맞춰 were를 써야 함\u003c/div>","segs":[{"n":56,"text":"첫 번째 보기는 nor 뒤에 조동사가 없어서 틀려요. nor did they call us 순서가 되어야 합니다.","hl":"st-0"},{"n":57,"text":"두 번째 보기는 Were I in your shoes가 If I were in your shoes의 도치라서 알맞습니다.","hl":"st-1"},{"n":58,"text":"세 번째 보기는 either 뒤에 expanding, or 뒤에 entering이 와서 병렬이 알맞습니다.","hl":"st-2"},{"n":59,"text":"네 번째 보기는 장소를 강조하는 where 표현으로 이 문제에서는 틀린 문장으로 보지 않아요.","hl":"st-3"},{"n":60,"text":"다섯 번째 보기는 주어 people이 복수인데 was를 써서 틀려요. were people prepared로 고쳐야 합니다.","hl":"st-4"},{"n":61,"text":"그래서 틀린 문장은 첫 번째와 다섯 번째 보기이고, 정답은 두 번째 선택지입니다.","hl":"st-5"},{"n":62,"text":"이 문제의 함정도 짚고 갈게요. Little 뒤에서도 주어 people에 맞춰 were를 써야 함","hl":"trap"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 8 / 20\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">8\u003c/span>다음 글의 밑줄 친 부분 중 어법상 틀린 곳을 두 개 찾아 바르게 고치시오.\u003c/div>\u003cdiv class=\"p-psg\">Since the book was released, readers have said &quot;ⓐ \u003cu class=\"p-u\">What\u003c/u> fantastic it was!&quot; However, once I finished the book, I wondered what the fuss was all about. At first, I thought maybe I was mistaken, so I re-read the ending and still ⓑ \u003cu class=\"p-u\">feeling\u003c/u> confused. I liked components of the plot, such as the ending with the link to the next book. My issue was that I found it predictable. I guessed ⓒ \u003cu class=\"p-u\">who the villain was\u003c/u> and predicted most of the events. That's why I was left disappointed.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">ⓐ What → How, ⓑ feeling → felt\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":63,"text":"여덟 번째 문제는 글에서 밑줄 친 부분 중 틀린 곳 두 군데를 고치는 문제예요. 감탄문과 and 앞뒤 동사 형태를 보세요.","hl":"q"},{"n":64,"text":"","hl":"q","pause":7},{"n":65,"text":"정답은 첫 번째 밑줄을 How로, 두 번째 밑줄을 felt로 고치는 것입니다. 형용사만 있으면 How를 쓰고, re-read와 시제를 맞춰야 해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 8 / 20\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">8\u003c/span>다음 글의 밑줄 친 부분 중 어법상 틀린 곳을 두 개 찾아 바르게 고치시오.\u003c/div>\u003cdiv class=\"p-psg sm\">Since the book was released, readers have said &quot;ⓐ \u003cu class=\"p-u\">What\u003c/u> fantastic it was!&quot; However, once I finished the book, I wondered what the fuss was all about. At first, I thought maybe I was mistaken, so I re-read the ending and still ⓑ \u003cu class=\"p-u\">feeling\u003c/u> confused. I liked components of the plot, such as the ending with the link to the next book. My issue was that I found it predictable. I guessed ⓒ \u003cu class=\"p-u\">who the villain was\u003c/u> and predicted most of the events. That's why I was left disappointed.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">ⓐ 확인\u003c/b>fantastic은 형용사이고 뒤에 명사가 없으므로 \u003cb class=\"key\">How fantastic it was!\u003c/b>가 되어야 합니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">ⓑ 확인\u003c/b>and 앞의 re-read와 병렬이므로 과거형 \u003cb class=\"key\">felt\u003c/b>가 알맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">ⓒ 확인\u003c/b>\u003cb class=\"key\">who the villain was\u003c/b>는 간접의문문 어순으로 알맞습니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ⓐ What → How, ⓑ feeling → felt\u003c/span>\u003cdiv class=\"p-full\">Since the book was released, readers have said &quot;How fantastic it was!&quot; ... so I re-read the ending and still felt confused.\u003c/div>\u003cdiv class=\"p-ko\">책이 출간된 이후 독자들은 그것이 얼마나 환상적이었는지 말했다. 그러나 나는 결말을 다시 읽고도 여전히 혼란스러웠다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\" data-hl=\"trap\">\u003cb>함정 주의\u003c/b>감탄문에서 형용사만 있을 때 What을 쓰지 않기 / and 앞뒤 시제 맞추기\u003c/div>","segs":[{"n":66,"text":"첫 번째 밑줄은 fantastic이라는 형용사만 있으므로 what이 아니라 how를 써서 how fantastic it was로 고쳐야 해요.","hl":"st-0"},{"n":67,"text":"두 번째 밑줄은 and 앞의 re-read와 같은 과거 시제로 맞춰 felt가 되어야 합니다. feeling은 틀려요.","hl":"st-1"},{"n":68,"text":"세 번째 밑줄은 의문사 who 뒤에 주어 the villain과 동사 was가 와서 알맞습니다.","hl":"st-2"},{"n":69,"text":"이 문제의 함정도 짚고 갈게요. 감탄문에서 형용사만 있을 때 What을 쓰지 않기 / and 앞뒤 시제 맞추기","hl":"trap"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">구동사와 대명사 목적어\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">구동사 + 대명사 목적어\u003c/b>는 동사와 부사 사이에 둡니다.\u003cdiv>\u003cspan class=\"g-formula\">put + it + off / take + them + off\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>it/them은 동사와 부사 사이\u003c/li>\u003cli>일반 명사는 사이 또는 뒤에 가능\u003c/li>\u003cli>put off it은 틀린 형태\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">You should \u003cspan class=\"fx\">put it off\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">너는 그것을 미뤄야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">You had better \u003cspan class=\"fx\">take them off\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그것들을 벗는 게 좋겠다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":70,"text":"구동사는 동사와 부사가 붙어 하나의 뜻을 만드는 표현이에요. 목적어가 대명사 it이나 them이면 반드시 동사와 부사 사이에 넣습니다. put it off, take them off처럼 써야 하고 put off it은 틀려요. 목적어가 일반 명사일 때는 사이에 넣거나 뒤에 둘 수 있습니다.","hl":"rule"}]},{"html":"\u003cspan class=\"lp-tag\">개념 정리\u003c/span>\u003ch2 class=\"g-h\">간접의문문 어순\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">의문사 + 주어 + 동사\u003c/b> 어순으로 간접의문문을 만듭니다.\u003cdiv>\u003cspan class=\"g-formula\">의문사 + 주어 + 동사\u003c/span>\u003c/div>\u003c/div>\u003cul class=\"p-pts\" data-hl=\"pts\">\u003cli>do/does/did를 쓰지 않는다\u003c/li>\u003cli>의문사가 목적어 역할을 해도 어순은 같다\u003c/li>\u003cli>문장 안에 들어간 의문문은 평서문 어순\u003c/li>\u003c/ul>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I wonder \u003cspan class=\"fx\">why you keep\u003c/span> procrastinating.\u003c/div>\u003cdiv class=\"g-ko\">나는 네가 왜 계속 미루는지 궁금하다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">Tell me \u003cspan class=\"fx\">what you mean\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">네가 무슨 뜻인지 말해 줘.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":71,"text":"간접의문문은 의문사가 문장 안에 들어갈 때 주어 다음에 동사가 오는 어순을 씁니다. why you keep처럼 의문사 뒤에 주어, 그다음 동사가 와요. what we mean처럼 의문사가 목적어 역할을 해도 어순은 같습니다. 직접의문문의 do you 같은 어순을 그대로 가져오면 틀립니다.","hl":"rule"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 9 / 20\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">9\u003c/span>다음 글의 밑줄 친 부분 중 어법상 틀린 곳을 두 개 찾아 바르게 고치시오.\u003c/div>\u003cdiv class=\"p-psg\">Procrastination is the act of unnecessarily postponing decisions or actions. For example, if someone has an assignment and ⓐ \u003cu class=\"p-u\">puts off it\u003c/u> until right before the deadline for no reason, that person is procrastinating. Many procrastinators know that this behavior hurts them and ⓑ \u003cu class=\"p-u\">that\u003c/u> it would be better for them to start earlier. If you're a procrastinator, you may have asked why ⓒ \u003cu class=\"p-u\">do you\u003c/u> keep procrastinating even though you know that it's bad for you.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">ⓐ puts off it → puts it off, ⓒ do you → you\u003c/span>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":72,"text":"아홉 번째 문제는 구동사 목적어 위치와 간접의문문 어순을 찾는 문제예요. 대명사 it의 위치와 why 뒤 어순을 보세요.","hl":"q"},{"n":73,"text":"","hl":"q","pause":7},{"n":74,"text":"정답은 puts off it을 puts it off로, do you를 you로 고치는 것입니다. 대명사는 동사와 부사 사이에 넣고, 간접의문문은 주어 다음에 동사를 씁니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">문제 9 / 20\u003c/span>\u003cspan class=\"g-kind\">틀린 부분 고치기\u003c/span>\u003cspan class=\"g-kind p-sol\">풀이\u003c/span>\u003c/div>\u003cdiv class=\"p-mini\">\u003cdiv class=\"p-ins\">\u003cspan class=\"p-no\">9\u003c/span>다음 글의 밑줄 친 부분 중 어법상 틀린 곳을 두 개 찾아 바르게 고치시오.\u003c/div>\u003cdiv class=\"p-psg sm\">Procrastination is the act of unnecessarily postponing decisions or actions. For example, if someone has an assignment and ⓐ \u003cu class=\"p-u\">puts off it\u003c/u> until right before the deadline for no reason, that person is procrastinating. Many procrastinators know that this behavior hurts them and ⓑ \u003cu class=\"p-u\">that\u003c/u> it would be better for them to start earlier. If you're a procrastinator, you may have asked why ⓒ \u003cu class=\"p-u\">do you\u003c/u> keep procrastinating even though you know that it's bad for you.\u003c/div>\u003c/div>\u003cdiv class=\"p-steps\">\u003cdiv class=\"p-st\" data-hl=\"st-0\">\u003cb class=\"l\">ⓐ 확인\u003c/b>구동사 put off의 목적어가 대명사 it이므로 \u003cb class=\"key\">puts it off\u003c/b>가 되어야 합니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-1\">\u003cb class=\"l\">ⓑ 확인\u003c/b>know that ... and that ...로 that절이 병렬이므로 알맞습니다.\u003c/div>\u003cdiv class=\"p-st\" data-hl=\"st-2\">\u003cb class=\"l\">ⓒ 확인\u003c/b>간접의문문이므로 \u003cb class=\"key\">why you keep\u003c/b> 어순이어야 합니다. do you는 틀립니다.\u003c/div>\u003c/div>\u003cdiv class=\"p-fin\" data-hl=\"fin\">\u003cspan class=\"p-ab\">정답 ⓐ puts off it → puts it off, ⓒ do you → you\u003c/span>\u003cdiv class=\"p-full\">... if someone has an assignment and puts it off until right before the deadline ... you may have asked why you keep procrastinating ...\u003c/div>\u003cdiv class=\"p-ko\">누군가 과제를 이유 없이 마감 직전까지 미루면 미루는 것이다. 많은 미루는 사람들은 이 행동이 해롭고 더 일찍 시작하는 게 낫다는 것을 안다. 너는 왜 계속 미루는지 물었을지도 모른다.\u003c/div>\u003c/div>\u003cdiv class=\"p-trap\
