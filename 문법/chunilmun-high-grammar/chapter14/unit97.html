    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}

}
lecturePlayer(document.getElementById("app"),{"brand":"Unit 97 도치 1 (부정어구)","title":"도치 1 (부정어구) — 부정어가 앞에 오면 어순이 뒤집힌다!","audioDir":"unit97_audio","preview":false,"count":37,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">Chapter 14 특수구문 | Unit 097 도치 1 (부정어구)\u003c/div>\u003ch1>도치 1 (부정어구) — 부정어가 앞에 오면 어순이 뒤집힌다!\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>부정어구와 only가 문두에 올 때 일어나는 도치 어순을 이해하고, no sooner ~ than / hardly ~ when 구문을 과거완료와 함께 쓸 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘도 만나서 반가워요. 오늘은 특수구문 열네 번째 챕터, 도치 첫 번째 시간이에요. 영어 문장은 보통 주어가 먼저 오지만, 부정어가 앞으로 튀어나오면 어순이 확 뒤집힌다는 사실 알고 있었나요? 오늘 이 규칙 하나만 제대로 잡아도 독해가 훨씬 편해질 거예요. 자, 그럼 시작해 볼까요?","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 3\u003c/span>\u003ch2 class=\"g-h\">부정어가 문두에 오면 조동사가 주어 앞으로 나온다\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">부정어 never, little, hardly, seldom, rarely 등이 문두에 오면 \u003cb class=\"key\">조동사 + 주어 + 동사\u003c/b> 어순으로 도치됩니다. 조동사가 없으면 \u003cb class=\"key\">do / does / did\u003c/b>를 새로 넣어 도치하고, 뒤따르는 동사는 반드시 \u003cb class=\"key\">동사원형\u003c/b>을 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">부정어 + 조동사 + 주어 + 동사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Never have I\u003c/span> seen such a view.\u003c/div>\u003cdiv class=\"g-ko\">나는 그런 경치를 본 적이 없다.\u003c/div>\u003cdiv class=\"g-note\">부정어 Never가 문두에 와서 조동사 have가 주어 I 앞으로 나온 도치 문장입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Seldom does he\u003c/span> eat out.\u003c/div>\u003cdiv class=\"g-ko\">그는 외식하는 일이 거의 없다.\u003c/div>\u003cdiv class=\"g-note\">본동사만 있어서 does를 새로 넣어 도치했고, eat은 원형 그대로입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Little did I\u003c/span> know about it.\u003c/div>\u003cdiv class=\"g-ko\">나는 그것에 대해 거의 알지 못했다.\u003c/div>\u003cdiv class=\"g-note\">Little이 문두에 오면 '거의 ~하지 못했다'는 부정의 뜻이 됩니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>조동사가 없을 때 \u003cb class=\"key\">do / does / did\u003c/b>를 넣는 것을 잊지 마세요. 도치된 뒤의 동사는 반드시 \u003cb class=\"key\">동사원형\u003c/b>입니다.\u003c/div>","segs":[{"n":2,"text":"여러분, 영어 문장은 보통 주어 다음에 동사가 오죠. 그런데 never나 hardly, little처럼 부정의 뜻을 가진 말이 문장 맨 앞으로 나오면 어순이 확 뒤집혀요. 이때는 조동사가 주어보다 먼저 나오고, 그다음 주어, 그다음 동사 순서가 됩니다. 원래 조동사가 없으면 do, does, did를 새로 만들어서 앞에 세워야 하고요, 그 뒤 동사는 꼭 원형으로 돌아가요. 오늘은 이 도치의 기본 모양부터 확실히 잡아 볼게요.","hl":"rule"},{"n":3,"text":"첫 번째 예문 읽어 볼게요. Never have I seen such a view. 뜻은 나는 그런 경치를 본 적이 없다는 거예요. Never가 맨 앞에 있으니까 조동사 have가 주어 I보다 먼저 나왔죠. 이게 바로 부정어 도치의 가장 기본 모양이에요.","hl":"ex-0"},{"n":4,"text":"Seldom does he eat out. 뜻은 그는 외식하는 일이 거의 없다는 거예요. 여기엔 원래 조동사가 없어서 does를 새로 넣었고, 동사 eat은 원형 그대로 남았어요. 이 부분 많이 헷갈리니까 꼭 기억해 두세요.","hl":"ex-1"},{"n":5,"text":"Little did I know about it. 뜻은 나는 그것에 대해 거의 알지 못했다는 거예요. little이 앞에 오면 거의 없다는 부정의 뜻이 되고, 역시 did가 주어 앞으로 나왔어요. 뒤에 오는 know가 원형인 것도 눈여겨보세요.","hl":"ex-2"},{"n":6,"text":"한 가지 함정이 있어요. 조동사가 없는 문장에서 did를 넣었는데 뒤 동사를 과거형으로 그대로 두는 실수가 아주 많아요. did를 넣었으면 뒤에는 반드시 동사원형이 와야 한다는 점, 꼭 기억해 주세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 3\u003c/span>\u003ch2 class=\"g-h\">only와 not until이 이끄는 어구가 문두에 올 때\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">only\u003c/b> + 부사(구·절)가 문두에 오면 '그제야, 오직 ~하고서야'라는 뜻이 되고 \u003cb class=\"key\">조동사 + 주어 + 동사\u003c/b> 어순으로 도치됩니다. \u003cb class=\"key\">not until\u003c/b> ~도 문두에 오면 같은 방식으로 도치되어 '~이 되어서야 비로소'로 해석합니다.\u003cdiv>\u003cspan class=\"g-formula\">Only + 부사(구·절) + 조동사 + 주어 + 동사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Not until midnight \u003cspan class=\"fx\">did he come\u003c/span> home.\u003c/div>\u003cdiv class=\"g-ko\">자정이 되어서야 그는 집에 왔다.\u003c/div>\u003cdiv class=\"g-note\">Not until이 문두에 와서 조동사 did가 주어 앞으로 나왔습니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">Only then \u003cspan class=\"fx\">did she realize\u003c/span> the truth.\u003c/div>\u003cdiv class=\"g-ko\">그제야 그녀는 진실을 깨달았다.\u003c/div>\u003cdiv class=\"g-note\">Only then이 문두에 와서 도치되었고, 동사는 원형 realize입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">Only after the meeting \u003cspan class=\"fx\">did we leave\u003c/span> the office.\u003c/div>\u003cdiv class=\"g-ko\">회의가 끝난 뒤에야 우리는 사무실을 떠났다.\u003c/div>\u003cdiv class=\"g-note\">only + 전치사구가 문두에 온 경우로, 뒤에서 조동사 did가 도치됩니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>only가 문두에 와도 바로 뒤에 \u003cb class=\"key\">주어\u003c/b>가 오면 도치되지 않습니다. Only he knew the answer처럼 only가 주어를 꾸밀 때는 어순이 그대로예요.\u003c/div>","segs":[{"n":7,"text":"이번엔 only와 not until 차례예요. only 뒤에 부사나 부사구, 부사절이 와서 그 덩어리가 문장 앞으로 나오면 그제야, 오직 그렇게 하고서야라는 뜻이 되면서 어순이 뒤집혀요. not until도 마찬가지로 문두에 오면 자정이 되어서야, 그때가 되어서야 비로소라는 뜻이 되죠. 둘 다 조동사가 주어 앞으로 나오는 똑같은 도치 방식이라는 것만 기억하면 아주 쉬워요.","hl":"rule"},{"n":8,"text":"Not until midnight did he come home. 뜻은 자정이 되어서야 그는 집에 왔다는 거예요. Not until이 앞에 있으니까 did가 주어 he보다 먼저 나왔고, 동사는 원형 come이 되었어요. 해석할 때 자정이 되어서야라는 부분을 놓치지 마세요.","hl":"ex-0"},{"n":9,"text":"Only then did she realize the truth. 뜻은 그제야 그녀는 진실을 깨달았다는 거예요. Only then이라는 부사구가 앞에 왔으니 did가 주어 she 앞으로 나왔죠. realize가 원형인 것도 확인해 보세요.","hl":"ex-1"},{"n":10,"text":"Only after the meeting did we leave the office. 뜻은 회의가 끝난 뒤에야 우리는 사무실을 떠났다는 거예요. only 뒤에 전치사구가 길게 와도 그 덩어리 전체가 문두에 있으면 did가 주어 앞으로 나온다는 것, 꼭 기억해 두세요.","hl":"ex-2"},{"n":11,"text":"여기서 조심할 게 하나 있어요. only가 앞에 있다고 무조건 도치되는 건 아니에요. only가 주어를 꾸미는 경우, 예를 들어 Only he knew the answer 같은 문장은 어순이 그대로예요. 도치되는 건 only 뒤에 부사나 부사구, 부사절이 올 때라는 점을 구분해 주세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 3\u003c/span>\u003ch2 class=\"g-h\">no sooner ~ than / hardly ~ when : ~하자마자 …했다\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">no sooner\u003c/b> ~ than ... 과 hardly ~ when ... 은 '~하자마자 …했다'라는 뜻으로, 앞 절에 \u003cb class=\"key\">과거완료\u003c/b> had + 과거분사를 씁니다. no sooner나 hardly가 문두에 오면 \u003cb class=\"key\">had\u003c/b>가 주어 앞으로 나오는 도치가 일어납니다.\u003cdiv>\u003cspan class=\"g-formula\">No sooner had + 주어 + 과거분사 ~ than + 주어 + 과거동사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">No sooner \u003cspan class=\"fx\">had he arrived\u003c/span> than it began to rain.\u003c/div>\u003cdiv class=\"g-ko\">그가 도착하자마자 비가 내리기 시작했다.\u003c/div>\u003cdiv class=\"g-note\">no sooner가 문두에 와서 had가 주어 앞으로 나왔고, 뒤에는 반드시 than을 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">Hardly \u003cspan class=\"fx\">had I sat down\u003c/span> when the phone rang.\u003c/div>\u003cdiv class=\"g-ko\">내가 앉자마자 전화가 울렸다.\u003c/div>\u003cdiv class=\"g-note\">hardly ~ when 짝을 이루고, had가 주어 앞으로 도치되었습니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>\u003cb class=\"key\">than\u003c/b>과 \u003cb class=\"key\">when\u003c/b>의 짝을 바꿔 쓰는 실수가 가장 많습니다. no sooner는 than, hardly는 when이라고 묶어서 외우세요.\u003c/div>","segs":[{"n":12,"text":"마지막은 시간의 연결 표현이에요. no sooner와 than, hardly와 when은 짝을 이뤄서 무언가가 일어나자마자 다른 일이 일어났다는 뜻을 만들어요. 이때 먼저 일어난 일은 과거완료, 즉 had plus 과거분사로 쓰고, 뒤에 일어난 일은 그냥 과거동사로 써요. 그리고 no sooner나 hardly가 문장 앞으로 나오면 had가 주어 앞으로 쏙 나온다는 것까지 세트로 기억해 주세요.","hl":"rule"},{"n":13,"text":"No sooner had he arrived than it began to rain. 뜻은 그가 도착하자마자 비가 내리기 시작했다는 거예요. no sooner가 앞에 왔으니 had가 주어 he 앞으로 나왔고, 뒤에서는 than이 짝을 이뤄요. arrived와 began, 시제 차이도 함께 느껴 보세요.","hl":"ex-0"},{"n":14,"text":"Hardly had I sat down when the phone rang. 뜻은 내가 앉자마자 전화가 울렸다는 거예요. hardly는 when과 짝을 이루고, had가 주어 I 앞으로 나왔죠. 앞 문장에서는 than이었는데 여기서는 when이라는 점, 꼭 비교해 두세요.","hl":"ex-1"},{"n":15,"text":"시험에서 가장 많이 틀리는 부분이 바로 이 짝이에요. no sooner 뒤에는 than, hardly 뒤에는 when이라고 소리 내서 묶어서 외워 두면 절대 안 헷갈려요. 그리고 had + 과거분사, 즉 과거완료를 쓰는 것도 잊지 마세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>Never I have seen such a view.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ Never have I seen such a view.\u003c/div>\u003cdiv class=\"g-why\">부정어 Never가 문두에 오면 조동사 have가 주어 I 앞으로 나와야 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>Only then she realized the truth.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ Only then did she realize the truth.\u003c/div>\u003cdiv class=\"g-why\">Only then이 문두에 왔으므로 did를 넣어 도치하고 동사는 원형으로 써야 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-2\">\u003cdiv class=\"g-wrong\">✗ \u003cs>No sooner he had arrived than it began to rain.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ No sooner had he arrived than it began to rain.\u003c/div>\u003cdiv class=\"g-why\">no sooner가 문두에 오면 had가 주어 앞으로 도치되어야 합니다.\u003c/div>\u003c/div>","segs":[{"n":16,"text":"이 문장은 Never를 앞에 세워 놓고 주어와 조동사를 그대로 둔 경우예요. 부정어가 문두에 오면 무조건 조동사가 주어보다 먼저 와야 하니까 Never have I seen such a view가 맞아요. 어순만 바꿔 주면 되는 아주 간단한 문제죠.","hl":"mk-0"},{"n":17,"text":"Only then이 앞에 나왔는데도 평서문 어순을 그대로 쓴 문장이에요. 이때는 did를 새로 넣어서 주어 앞에 세우고, realized는 원형 realize로 바꿔야 하죠. 그래서 Only then did she realize the truth가 정답이에요.","hl":"mk-1"},{"n":18,"text":"no sooner를 앞에 썼다면 had도 함께 앞으로 나와야 해요. had he arrived처럼 조동사와 주어를 바꿔 주면 되고, 뒤에 than이 오는 것도 그대로 유지해요. 도치를 빠뜨리면 어색한 문장이 되니 꼭 확인하세요.","hl":"mk-2"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 중 어법상 올바른 문장을 고르세요.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>Never I have seen such a view.\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>Never have I seen such a view.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>Never have seen I such a view.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>Never did I have seen such a view.\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">Never have I seen such a view.\u003c/span>\u003cdiv class=\"g-exp\">부정어 Never가 문두에 오면 조동사 have가 주어 I 앞으로 나와야 합니다. 나머지 보기는 조동사와 주어의 자리가 잘못되었습니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":19,"text":"첫 번째 문제는 어법상 올바른 문장을 고르는 문제예요. 첫 번째 보기는 Never I have seen such a view, 두 번째 보기는 Never have I seen such a view, 세 번째 보기는 Never have seen I such a view, 네 번째 보기는 Never did I have seen such a view입니다. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":20,"text":"","hl":"q","pause":6},{"n":21,"text":"정답은 두 번째 보기예요. Never have I seen such a view. 부정어 Never가 문장 앞에 나왔으니까 조동사 have가 주어 I보다 먼저 와야 하죠. 나머지 보기는 조동사와 주어의 자리가 뒤섞여 있어서 모두 틀린 문장이에요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 6\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">빈칸에 알맞은 말을 쓰세요.\u003c/div>\u003cdiv class=\"g-qs\">Not until midnight ____ he come home.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">did\u003c/span>\u003cdiv class=\"g-exp\">Not until이 문두에 왔으므로 과거 시제를 나타내는 조동사 did를 넣어 도치하고, 뒤에는 동사원형 come을 씁니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":22,"text":"두 번째 문제는 빈칸 채우기예요. 자정이 되어서야 그는 집에 왔다는 뜻의 문장인데, 빈칸에 들어갈 말을 생각해 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":23,"text":"","hl":"q","pause":6},{"n":24,"text":"정답은 did예요. Not until이 문두에 왔으니까 조동사를 주어 앞에 세워야 하고, 과거의 일이니까 did를 써요. 그리고 did가 들어갔으니 뒤 동사는 원형 come이 되는 것도 함께 확인해 주세요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 3 / 6\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">빈칸에 알맞은 말을 쓰세요.\u003c/div>\u003cdiv class=\"g-qs\">Only then ____ she realize the truth.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">did\u003c/span>\u003cdiv class=\"g-exp\">Only then이 문두에 와서 도치가 일어났고, 뒤에 동사원형 realize가 있으므로 did가 들어갑니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":25,"text":"세 번째 문제도 빈칸 채우기예요. 그제야 그녀는 진실을 깨달았다는 문장이고, 뒤에 realize라는 원형이 보이죠. 빈칸에 무엇이 들어갈지 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":26,"text":"","hl":"q","pause":6},{"n":27,"text":"정답은 did예요. Only then이 문두에 왔으니 도치가 일어나고, 뒤에 동사원형 realize가 있으니까 시제를 담당하는 did를 주어 앞에 넣어야 해요. 그래서 Only then did she realize the truth가 완성됩니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 4 / 6\u003c/span>\u003cspan class=\"g-kind\">오류 수정\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 문장에서 틀린 부분을 바르게 고쳐 쓰세요.\u003c/div>\u003cdiv class=\"g-qs\">Hardly I had finished my homework when the doorbell rang.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">Hardly had I finished my homework when the doorbell rang.\u003c/span>\u003cdiv class=\"g-exp\">hardly가 문두에 왔으므로 had가 주어 I 앞으로 도치되어야 합니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":28,"text":"네 번째 문제는 오류 수정이에요. 숙제를 끝마치자마자 초인종이 울렸다는 뜻의 문장인데, 어딘가 어순이 어색하죠. 잠시 멈추고 직접 고쳐 보세요.","hl":"q"},{"n":29,"text":"","hl":"q","pause":6},{"n":30,"text":"정답은 Hardly had I finished my homework when the doorbell rang이에요. hardly가 문두에 나왔으니까 had가 주어 I보다 먼저 와야 하죠. 그리고 hardly는 when과 짝을 이룬다는 점도 함께 기억해 주세요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 5 / 6\u003c/span>\u003cspan class=\"g-kind\">배열\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">주어진 단어를 바르게 배열하여 문장을 완성하세요.\u003c/div>\u003cdiv class=\"g-qs\">Never / have / I / such / a / view / seen\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">Never have I seen such a view.\u003c/span>\u003cdiv class=\"g-exp\">부정어 Never 다음에 조동사 have, 주어 I, 동사 seen, 목적어 such a view 순서로 배열합니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":31,"text":"다섯 번째 문제는 단어 배열이에요. Never로 시작하는 도치 문장을 만들어야 합니다. 잠시 멈추고 직접 순서를 맞춰 보세요.","hl":"q"},{"n":32,"text":"","hl":"q","pause":6},{"n":33,"text":"정답은 Never have I seen such a view예요. 부정어 Never가 앞에 오면 조동사 have가 주어 I보다 먼저 나오고, 그 뒤에 동사 seen과 목적어 such a view가 오는 순서가 되죠. 이 어순이 오늘 배운 도치의 기본형이에요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 6 / 6\u003c/span>\u003cspan class=\"g-kind\">영작\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 우리말을 영어로 쓰세요. (힌트: Not until 로 시작하세요)\u003c/div>\u003cdiv class=\"g-qs\">그는 자정이 되어서야 집에 왔다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">Not until midnight did he come home.\u003c/span>\u003cdiv class=\"g-exp\">Not until이 문두에 오면 '~이 되어서야'라는 뜻이 되고, 조동사 did가 주어 앞으로 도치됩니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":34,"text":"마지막 문제는 영작이에요. 자정이 되어서야 그는 집에 왔다는 문장을 Not until로 시작해서 써 보세요. 잠시 멈추고 직접 써 보세요.","hl":"q"},{"n":35,"text":"","hl":"q","pause":6},{"n":36,"text":"정답은 Not until midnight did he come home이에요. Not until이 문두에 오면 문장이 되어서야 비로소라는 뜻이 되고, did가 주어 he 앞으로 나오면서 어순이 뒤집히죠. 뒤에 오는 동사는 원형 come이라는 것도 꼭 챙겨 주세요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">Chapter 14 특수구문 | Unit 097 도치 1 (부정어구)\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>부정어 never, little, hardly 등이 문두에 오면 \u003cb class=\"key\">조동사 + 주어 + 동사\u003c/b> 어순으로 도치된다.\u003c/li>\u003cli>\u003cb class=\"key\">only\u003c/b> + 부사(구·절)나 \u003cb class=\"key\">not until\u003c/b> ~이 문두에 와도 같은 방식으로 도치된다.\u003c/li>\u003cli>\u003cb class=\"key\">no sooner\u003c/b> ~ than, hardly ~ when은 '~하자마자 …했다'로, 앞 절에 \u003cb class=\"key\">과거완료\u003c/b>를 쓴다.\u003c/li>\u003c/ul>","segs":[{"n":37,"text":"오늘 세 가지를 배웠어요. 부정어가 문두에 오면 조동사가 주어 앞으로 나오고, only 뒤에 부사구가 오거나 not until이 앞에 와도 똑같이 도치된다는 것, 그리고 no sooner than과 hardly when은 과거완료와 함께 하자마자라는 뜻을 만든다는 것이었죠. 조동사가 없으면 do, does, did를 넣고 뒤에는 반드시 동사원형을 쓴다는 점만 잊지 않으면 오늘 내용은 완벽해요. 복습할 때 예문을 소리 내어 세 번씩 읽어 보면 훨씬 오래 기억에 남을 거예요. 오늘도 수고 많았습니다, 다음 단원에서 또 만나요!","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
