  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}

    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;

}
lecturePlayer(document.getElementById("app"),{"brand":"Unit 64 화법 전환 1 (평서문)","title":"화법 전환 1 (평서문) — 남의 말을 내 말로 바꾸는 법","audioDir":"unit64_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">Unit 064 화법 전환 1 (평서문)\u003c/div>\u003ch1>화법 전환 1 (평서문) — 남의 말을 내 말로 바꾸는 법\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>직접화법 평서문을 전달동사·인칭대명사·시제·시간 표현을 바꿔 간접화법으로 정확하게 전환할 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 화법 전환 첫 시간으로, 평서문을 간접화법으로 바꾸는 방법을 배워 볼 거예요. 친구가 한 말을 그대로 옮기는 직접화법과, 내 말로 다시 전달하는 간접화법은 생각보다 규칙이 많아요. 오늘 세 가지만 확실히 잡으면 어떤 평서문이 나와도 흔들리지 않을 거예요. 자, 시작해 볼까요?","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 3\u003c/span>\u003ch2 class=\"g-h\">전달동사와 that절로 바꾸기\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">직접화법을 간접화법으로 바꿀 때는 먼저 \u003cb class=\"key\">전달동사\u003c/b>를 확인해요. said는 그대로 두거나, 말하는 상대를 밝혀야 할 때 \u003cb class=\"key\">told\u003c/b>로 바꾸고, 인용부호는 \u003cb class=\"key\">that절\u003c/b>로 바꿔 줘요. told를 쓸 때는 told me처럼 목적어가 반드시 뒤따라야 해요.\u003cdiv>\u003cspan class=\"g-formula\">said (that) + 주어 + 동사 ~ / said to me → told me that ~\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">She said, &quot;I am tired.&quot; → She \u003cspan class=\"fx\">said that she was tired\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 피곤하다고 말했다.\u003c/div>\u003cdiv class=\"g-note\">인용부호가 that절로 바뀌고 said는 그대로 쓰였어요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">She \u003cspan class=\"fx\">told me that she had lost\u003c/span> her bag.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 나에게 가방을 잃어버렸다고 말했다.\u003c/div>\u003cdiv class=\"g-note\">told 뒤에는 목적어 me가 오고 that절이 이어져요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>\u003cb class=\"key\">say\u003c/b>는 목적어를 바로 받지 않으므로 say me가 아니라 \u003cb class=\"key\">say to me\u003c/b>로 쓰고, \u003cb class=\"key\">tell\u003c/b>은 tell me처럼 목적어를 바로 받아요.\u003c/div>","segs":[{"n":2,"text":"자, 첫 번째 개념은 전달동사와 that절이에요. 친구가 한 말을 그대로 옮기는 직접화법에서는 인용부호 안에 문장이 들어가죠. 이걸 간접화법으로 바꿀 때는 인용부호를 없애고 that절로 묶어 주면 돼요. 이때 said는 그대로 써도 되지만, 말하는 상대를 밝히고 싶으면 told를 쓰고 바로 뒤에 목적어를 붙여요. 그래서 She said to me는 She told me로 바꿔 쓸 수 있답니다.","hl":"rule"},{"n":3,"text":"첫 번째 예문이에요. She said, I am tired. 는 그녀가 나는 피곤하다고 말한 거예요. 이걸 간접화법으로 바꾸면 She said that she was tired. 가 됩니다. 인용부호가 that절로 바뀌고, I는 she로, am은 was로 바뀌었죠.","hl":"ex-0"},{"n":4,"text":"이 예문은 She told me that she had lost her bag. 이에요. 뜻은 그녀는 나에게 가방을 잃어버렸다고 말했다. 이고요. told 다음에 me라는 목적어가 오고 that절이 이어진다는 점을 꼭 기억하세요. told는 목적어 없이 혼자 쓰이지 않아요.","hl":"ex-1"},{"n":5,"text":"여기서 많이 헷갈리는 게 say와 tell이에요. say는 목적어를 바로 받지 않아서 say me라고 하면 틀리고, say to me라고 해야 해요. 반대로 tell은 tell me처럼 목적어를 바로 받는답니다.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 3\u003c/span>\u003ch2 class=\"g-h\">인칭대명사와 시제 바꾸기\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">말한 사람과 듣는 사람이 달라지므로 \u003cb class=\"key\">인칭대명사\u003c/b>를 문맥에 맞게 바꿔요. 시제는 한 단계 과거로 물러나서 현재는 \u003cb class=\"key\">과거\u003c/b>로, 과거는 \u003cb class=\"key\">과거완료\u003c/b>로 바꿔요. 미래를 나타내는 will은 would로 바꿔 줘요.\u003cdiv>\u003cspan class=\"g-formula\">현재 → 과거 / 과거 → 과거완료 / will → would\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">She said to me, &quot;I like your bag.&quot; → She told me that \u003cspan class=\"fx\">she liked my bag\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 나에게 내 가방을 좋아한다고 말했다.\u003c/div>\u003cdiv class=\"g-note\">I는 she로, your는 my로, like는 liked로 바뀌어요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">He said, &quot;I finished my homework.&quot; → He said that \u003cspan class=\"fx\">he had finished his homework\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그는 숙제를 끝냈다고 말했다.\u003c/div>\u003cdiv class=\"g-note\">과거 finished가 과거완료 had finished로 바뀌어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>과거를 과거완료로 바꿀 때는 \u003cb class=\"key\">had\u003c/b> 뒤에 \u003cb class=\"key\">과거분사\u003c/b>가 오는 형태를 꼭 확인하세요.\u003c/div>","segs":[{"n":6,"text":"두 번째는 인칭대명사와 시제예요. 말을 옮기면 말한 사람과 듣는 사람이 바뀌니까, I나 my 같은 인칭대명사를 문맥에 맞게 고쳐 줘야 해요. 그리고 시제는 한 단계 과거로 물러나요. 현재는 과거로, 과거는 과거완료로 바뀌고, will은 would로 바뀐답니다. 이 물러나는 느낌을 꼭 기억해 두세요.","hl":"rule"},{"n":7,"text":"She said to me, I like your bag. 는 그녀가 나에게 내 가방을 좋아한다고 말한 거예요. 간접화법으로 바꾸면 She told me that she liked my bag. 이 됩니다. I는 she로, your는 my로, like는 liked로 바뀌었어요.","hl":"ex-0"},{"n":8,"text":"He said, I finished my homework. 는 그는 숙제를 끝냈다고 말한 거예요. 이걸 옮기면 He said that he had finished his homework. 가 돼요. 과거 finished가 한 단계 더 물러나서 had finished가 된 거죠.","hl":"ex-1"},{"n":9,"text":"시제를 바꿀 때 실수하는 게 바로 과거완료 형태예요. had 뒤에는 반드시 과거분사가 와야 하니까 finished, lost처럼 형태를 정확히 챙겨 주세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 3\u003c/span>\u003ch2 class=\"g-h\">시간·장소 표현 바꾸기\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">말한 시점과 장소가 달라지므로 \u003cb class=\"key\">시간 표현\u003c/b>과 \u003cb class=\"key\">장소 표현\u003c/b>도 함께 바꿔요. now는 then, today는 that day, tomorrow는 the next day로 바꾸고, ago는 before, here는 there로 바꿔요.\u003cdiv>\u003cspan class=\"g-formula\">now → then / today → that day / tomorrow → the next day / ago → before / here → there\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">He said, &quot;I will come tomorrow.&quot; → He said that he \u003cspan class=\"fx\">would come the next day\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그는 다음 날 오겠다고 말했다.\u003c/div>\u003cdiv class=\"g-note\">will은 would로, tomorrow는 the next day로 바뀌어요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">She said, &quot;I am busy now.&quot; → She said that she was \u003cspan class=\"fx\">busy then\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 그때 바쁘다고 말했다.\u003c/div>\u003cdiv class=\"g-note\">now가 then으로 바뀌어요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">He said, &quot;I live here.&quot; → He said that he \u003cspan class=\"fx\">lived there\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그는 거기에 산다고 말했다.\u003c/div>\u003cdiv class=\"g-note\">here가 there로, live는 lived로 바뀌어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>시간 표현을 그대로 두면 \u003cb class=\"key\">시제\u003c/b>와 \u003cb class=\"key\">시간 표현\u003c/b>이 서로 어긋나 보이므로, 시제를 바꿀 때 함께 바꿔 주세요.\u003c/div>","segs":[{"n":10,"text":"세 번째는 시간과 장소를 나타내는 표현이에요. 말한 그때와 지금은 시간이 다르기 때문에 now는 then으로, today는 that day로, tomorrow는 the next day로 바꿔 줘요. 그리고 ago는 before로, here는 there로 바꿔 주면 훨씬 자연스러운 간접화법이 완성돼요.","hl":"rule"},{"n":11,"text":"이 예문은 He said, I will come tomorrow. 를 옮긴 거예요. 간접화법으로 바꾸면 He said that he would come the next day. 가 됩니다. 뜻은 그는 다음 날 오겠다고 말했다. 이고, will은 would로, tomorrow는 the next day로 바뀌었어요.","hl":"ex-0"},{"n":12,"text":"She said, I am busy now. 는 그녀가 지금 바쁘다고 말한 거예요. 이걸 옮기면 She said that she was busy then. 이 됩니다. am은 was로, now는 then으로 바뀌었죠.","hl":"ex-1"},{"n":13,"text":"He said, I live here. 는 그가 여기에 산다고 말한 거예요. 간접화법으로 바꾸면 He said that he lived there. 가 돼요. live는 lived로 물러나고, here는 there로 바뀌었답니다.","hl":"ex-2"},{"n":14,"text":"시제만 바꾸고 tomorrow를 그대로 두면 문장이 어색해져요. 시제를 바꿀 때는 시간과 장소 표현도 같이 바꿔야 자연스럽답니다.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>She said me that she was tired.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ She told me that she was tired.\u003c/div>\u003cdiv class=\"g-why\">say는 목적어를 바로 받지 않으므로 said to me나 told me로 써야 해요.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>He said that he will come tomorrow.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ He said that he would come the next day.\u003c/div>\u003cdiv class=\"g-why\">간접화법에서는 will이 would로, tomorrow가 the next day로 바뀌어요.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-2\">\u003cdiv class=\"g-wrong\">✗ \u003cs>She told that she had lost her bag.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ She told me that she had lost her bag.\u003c/div>\u003cdiv class=\"g-why\">tell은 뒤에 목적어가 반드시 필요한 동사예요.\u003c/div>\u003c/div>","segs":[{"n":15,"text":"학생들이 정말 자주 하는 실수예요. say 뒤에 me를 바로 붙이면 틀려요. 상대를 말하고 싶으면 She said to me that she was tired. 처럼 to를 넣거나, She told me that she was tired. 처럼 tell을 쓰면 됩니다.","hl":"mk-0"},{"n":16,"text":"이 문장은 시제와 시간 표현을 둘 다 그대로 둬서 틀렸어요. will은 would로, tomorrow는 the next day로 바꿔야 해요. 그래서 He said that he would come the next day. 가 맞습니다.","hl":"mk-1"},{"n":17,"text":"tell은 목적어를 꼭 데리고 다녀요. 그래서 told만 쓰면 어색하고, told me처럼 누구에게 말했는지를 넣어 줘야 해요. She told me that she had lost her bag. 이렇게 쓰면 완벽합니다.","hl":"mk-2"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 직접화법을 간접화법으로 바르게 바꾼 것을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\">She said, &quot;I am tired.&quot;\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>She said that I am tired.\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>She said that she was tired.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>She said me that she was tired.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>She told that she was tired.\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">She said that she was tired.\u003c/span>\u003cdiv class=\"g-exp\">인용부호를 that절로 바꾸고, I는 she로, am은 was로 바꿔야 해요. say 뒤에 목적어를 바로 붙이거나 told 없이 목적어를 쓰면 틀려요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":18,"text":"첫 번째 문제는 객관식이에요. She said, I am tired. 를 간접화법으로 바르게 바꾼 문장을 골라 보세요. 보기는 네 가지입니다. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":19,"text":"","hl":"q","pause":6},{"n":20,"text":"정답은 두 번째 보기예요. She said that she was tired. 가 맞습니다. 인용부호를 that절로 바꾸고, 현재 am은 과거 was로 물러나죠. 첫 번째 보기는 대명사와 시제가 그대로이고, 세 번째 보기는 say 뒤에 목적어가 바로 왔고, 네 번째 보기는 told에 목적어가 없어서 모두 틀렸어요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 6\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">괄호 안에 알맞은 말을 넣어 간접화법 문장을 완성하세요.\u003c/div>\u003cdiv class=\"g-qs\">He said, &quot;I will come tomorrow.&quot; → He said that he ____ come the next day.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">would\u003c/span>\u003cdiv class=\"g-exp\">간접화법에서는 will을 한 단계 과거인 would로 바꿔요. tomorrow도 the next day로 바뀌었어요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":21,"text":"두 번째 문제는 빈칸 채우기예요. He said, I will come tomorrow. 를 간접화법으로 바꾼 문장에서 빈칸에 들어갈 말을 생각해 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":22,"text":"","hl":"q","pause":6},{"n":23,"text":"정답은 would예요. 간접화법에서는 will이 한 단계 과거로 물러나서 would가 됩니다. 뒤에 있는 tomorrow도 the next day로 바뀌었으니 함께 기억해 두세요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 3 / 6\u003c/span>\u003cspan class=\"g-kind\">오류 수정\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 문장에서 틀린 부분을 바르게 고쳐 쓰세요.\u003c/div>\u003cdiv class=\"g-qs\">She said me that she was busy.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">She told me that she was busy.\u003c/span>\u003cdiv class=\"g-exp\">say는 목적어를 바로 받지 못해요. told me로 고치거나 said to me로 써야 해요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":24,"text":"세 번째 문제는 오류 수정이에요. She said me that she was busy. 이 문장에서 틀린 부분을 찾아 바르게 고쳐 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":25,"text":"","hl":"q","pause":6},{"n":26,"text":"정답은 She told me that she was busy. 예요. say는 목적어를 바로 받지 못하는 동사라서 said me라고 쓰면 안 됩니다. told me로 고치거나, to를 넣어서 She said to me that she was busy. 라고 써야 해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 4 / 6\u003c/span>\u003cspan class=\"g-kind\">배열\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">주어진 단어를 모두 사용해 우리말에 맞는 간접화법 문장을 만드세요.\u003c/div>\u003cdiv class=\"g-qs\">그는 숙제를 끝냈다고 말했다.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>He\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>said\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>that\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>he\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>⑤\u003c/b>had\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>⑥\u003c/b>finished\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>7\u003c/b>his\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>8\u003c/b>homework\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">He said that he had finished his homework.\u003c/span>\u003cdiv class=\"g-exp\">과거 finished를 한 단계 더 물러나 과거완료 had finished로 바꿔요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":27,"text":"네 번째 문제는 단어 배열이에요. 그는 숙제를 끝냈다고 말했다. 라는 뜻이 되도록 주어진 단어를 모두 사용해 문장을 만들어 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":28,"text":"","hl":"q","pause":6},{"n":29,"text":"정답은 He said that he had finished his homework. 예요. 직접화법에서 과거였던 finished는 간접화법에서 한 단계 더 물러나서 had finished가 됩니다. that절 안의 주어는 he로 바뀌는 것도 잊지 마세요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 5 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">빈칸에 들어갈 말로 알맞은 것을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\">She said, &quot;I am busy now.&quot; → She said that she was busy ____.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>now\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>then\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>here\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>that day\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">then\u003c/span>\u003cdiv class=\"g-exp\">now는 간접화법에서 then으로 바뀌어요. here는 there, today는 that day로 바뀌어요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":30,"text":"다섯 번째 문제는 시간 표현이에요. She said, I am busy now. 를 간접화법으로 바꿨을 때 빈칸에 알맞은 말을 골라 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":31,"text":"","hl":"q","pause":6},{"n":32,"text":"정답은 두 번째 보기 then이에요. now는 말하는 시점이 달라지기 때문에 간접화법에서 then으로 바뀝니다. 세 번째 보기 there는 here를 바꾼 것이고, 네 번째 보기 that day는 today를 바꾼 표현이에요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 6 / 6\u003c/span>\u003cspan class=\"g-kind\">영작\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 우리말을 간접화법 영어 문장으로 쓰세요.\u003c/div>\u003cdiv class=\"g-qs\">그녀는 나에게 가방을 잃어버렸다고 말했다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">She told me that she had lost her bag.\u003c/span>\u003cdiv class=\"g-exp\">tell을 쓰면 told me처럼 목적어가 필요하고, 과거 lost는 과거완료 had lost로 바뀌어요.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":33,"text":"마지막 문제는 영작이에요. 그녀는 나에게 가방을 잃어버렸다고 말했다. 라는 문장을 간접화법 영어 문장으로 써 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":34,"text":"","hl":"q","pause":6},{"n":35,"text":"정답은 She told me that she had lost her bag. 이에요. told 뒤에는 me라는 목적어가 꼭 필요하고, 과거 lost는 과거완료 had lost로 물러납니다. 오늘 배운 전달동사와 시제 규칙이 한 문장에 다 들어 있죠.","hl":"ans","reveal":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">Unit 064 화법 전환 1 (평서문)\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>직접화법은 인용부호 대신 \u003cb class=\"key\">that절\u003c/b>로 바꾸고, said to me는 \u003cb class=\"key\">told me\u003c/b>로 바꿔요.\u003c/li>\u003cli>\u003cb class=\"key\">인칭대명사\u003c/b>를 문맥에 맞게 고치고, 시제는 \u003cb class=\"key\">과거\u003c/b>나 \u003cb class=\"key\">과거완료\u003c/b>로 한 단계 물러나요.\u003c/li>\u003cli>\u003cb class=\"key\">시간 표현\u003c/b>과 \u003cb class=\"key\">장소 표현\u003c/b>도 now는 then, tomorrow는 the next day, here는 there처럼 함께 바꿔요.\u003c/li>\u003c/ul>","segs":[{"n":36,"text":"오늘은 평서문 화법 전환을 배웠어요. 인용부호는 that절로 바꾸고, said to me는 told me로 바꿔 준다는 점, 기억나죠? 인칭대명사는 문맥에 맞게 고치고, 시제는 한 단계 과거로 물러나며, now나 tomorrow 같은 시간 표현도 함께 바꿔 줘야 해요. 이 세 가지만 챙기면 어떤 평서문이 나와도 자신 있게 바꿀 수 있을 거예요. 오늘도 수고했어요, 다음 시간에 만나요.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
