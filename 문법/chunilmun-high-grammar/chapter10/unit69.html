  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;
    if(s.pause){pause(s.pause);return;}
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){var s=segs()[j];if(!noAudio&&s&&!s.pause&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  sl.addEventListener("click",function(e){var t=e.target.closest?e.target.closest(".g-opt,[data-act]"):null;if(!t)return;
    if(t.getAttribute("data-act")==="show"){reveal("ans");return;}
    var g=t.parentNode;if(g&&g.classList.contains("rv"))return;[].forEach.call(g.querySelectorAll(".g-opt"),function(o){if(o!==t)o.classList.remove("picked");});t.classList.toggle("picked");});
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Unit 69 이유, 양보의 부사절","title":"이유와 양보의 부사절, 헷갈리지 않고 골라 쓰기","audioDir":"unit69_audio","preview":false,"count":40,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">Unit 069 이유, 양보의 부사절\u003c/div>\u003ch1>이유와 양보의 부사절, 헷갈리지 않고 골라 쓰기\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>이유와 양보를 나타내는 부사절 접속사를 구분해 쓰고, although와 but을 함께 쓰지 않는 규칙을 익힌다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 이유와 양보를 나타내는 부사절을 함께 공부할 거예요. 이유를 말할 때는 because나 since를, 양보를 말할 때는 although나 even if를 쓴다고 배웠는데, 막상 문장을 쓰려면 헷갈릴 때가 많죠. 오늘은 예문을 하나씩 읽으면서 언제 어떤 접속사를 골라야 하는지 확실하게 정리해 볼게요. 특히 시험에 자주 나오는 although와 but의 관계까지 꼼꼼히 짚어 드릴게요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 4\u003c/span>\u003ch2 class=\"g-h\">이유를 나타내는 부사절: because, since, as, now that\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">이유를 나타낼 때는 \u003cb class=\"key\">because\u003c/b>를 가장 기본으로 쓴다. \u003cb class=\"key\">since\u003c/b>와 \u003cb class=\"key\">as\u003c/b>는 상대방도 이미 알고 있는 이유를 말할 때 쓰고, \u003cb class=\"key\">now that\u003c/b>은 '~이므로, ~했으니'라는 뜻으로 상황이 바뀐 것을 바탕으로 이유를 말한다.\u003cdiv>\u003cspan class=\"g-formula\">이유 접속사(because / since / as / now that) + 주어 + 동사, 주절\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Since you are here\u003c/span>, let's begin.\u003c/div>\u003cdiv class=\"g-ko\">네가 와 있으니 시작하자.\u003c/div>\u003cdiv class=\"g-note\">since는 상대도 이미 아는 이유를 말할 때 쓴다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Because it was raining\u003c/span>, we stayed at home.\u003c/div>\u003cdiv class=\"g-ko\">비가 오고 있었기 때문에 우리는 집에 있었다.\u003c/div>\u003cdiv class=\"g-note\">because는 가장 직접적이고 분명한 이유를 나타낸다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Now that you are a high school student\u003c/span>, you should study harder.\u003c/div>\u003cdiv class=\"g-ko\">이제 고등학생이 되었으니 너는 더 열심히 공부해야 한다.\u003c/div>\u003cdiv class=\"g-note\">now that은 상황이 바뀐 것을 바탕으로 이유를 말한다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>since와 as는 '~때문에'와 '~한 이후로' 두 가지 뜻이 있으니 문장의 \u003cb class=\"key\">문맥\u003c/b>으로 판단한다.\u003c/div>","segs":[{"n":2,"text":"이유를 말할 때 가장 먼저 떠올릴 접속사는 because예요. because는 가장 직접적이고 분명한 이유를 말할 때 쓰죠. since와 as는 because보다 이유의 힘이 조금 약한데, 상대방도 이미 알고 있는 이유를 말할 때 자연스러워요. now that은 지금 상황이 바뀐 것을 바탕으로 '이제 ~했으니'라고 이유를 말할 때 씁니다.","hl":"rule"},{"n":3,"text":"첫 번째 예문입니다. Since you are here, let's begin. 네가 와 있으니 시작하자라는 뜻이에요. 여기서 since는 이미 알고 있는 상황을 이유로 삼아 자연스럽게 말하고 있죠.","hl":"ex-0"},{"n":4,"text":"두 번째 예문입니다. Because it was raining, we stayed at home. 비가 오고 있었기 때문에 우리는 집에 있었다라는 뜻이에요. 이렇게 직접적인 이유를 말할 때는 because를 씁니다.","hl":"ex-1"},{"n":5,"text":"세 번째 예문입니다. Now that you are a high school student, you should study harder. 이제 고등학생이 되었으니 너는 더 열심히 공부해야 한다라는 뜻이에요. now that은 이렇게 상황이 바뀐 것을 근거로 이유를 말할 때 씁니다.","hl":"ex-2"},{"n":6,"text":"한 가지 주의할 점이 있어요. since와 as는 이유의 뜻 말고도 '~한 이후로'라는 시간의 뜻도 가지고 있어요. 그러니까 문장의 문맥을 먼저 확인하고 해석해야 합니다.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 4\u003c/span>\u003ch2 class=\"g-h\">양보를 나타내는 부사절: although, though, even though, even if\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">양보는 '비록 ~이지만'처럼 앞의 내용과 반대되는 사실을 인정하는 표현이다. \u003cb class=\"key\">although\u003c/b>와 \u003cb class=\"key\">though\u003c/b>, \u003cb class=\"key\">even though\u003c/b>는 실제로 일어난 사실에 쓰고, \u003cb class=\"key\">even if\u003c/b>는 아직 일어나지 않은 상황을 가정하는 '설령 ~일지라도'에 쓴다.\u003cdiv>\u003cspan class=\"g-formula\">Although / Though / Even though / Even if + 주어 + 동사, 주절\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Although it was late\u003c/span>, she kept working.\u003c/div>\u003cdiv class=\"g-ko\">늦었지만 그녀는 계속 일했다.\u003c/div>\u003cdiv class=\"g-note\">although는 '비록 ~이지만'이라는 양보를 나타낸다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Even if you fail\u003c/span>, you can try again.\u003c/div>\u003cdiv class=\"g-ko\">실패하더라도 다시 시도할 수 있다.\u003c/div>\u003cdiv class=\"g-note\">even if는 아직 일어나지 않은 상황을 가정한다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Even though he was tired\u003c/span>, he finished his homework.\u003c/div>\u003cdiv class=\"g-ko\">그는 피곤했지만 숙제를 끝냈다.\u003c/div>\u003cdiv class=\"g-note\">even though는 실제로 일어난 사실을 인정하는 양보에 쓴다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>even though는 \u003cb class=\"key\">사실\u003c/b>을 인정하고, even if는 \u003cb class=\"key\">가정\u003c/b>하는 표현이라는 차이를 기억한다.\u003c/div>","segs":[{"n":7,"text":"양보는 '비록 ~이지만'처럼 앞의 내용과 반대되는 사실을 인정하면서 말하는 방식이에요. although와 though, even though는 이미 일어난 사실이나 알고 있는 사실을 인정할 때 씁니다. 반면에 even if는 아직 일어나지 않은 일을 가정해서 '설령 ~일지라도'라고 말할 때 쓰죠. although와 though는 거의 같은 뜻이고, even though는 그보다 강조하는 느낌이에요.","hl":"rule"},{"n":8,"text":"첫 번째 예문입니다. Although it was late, she kept working. 늦었지만 그녀는 계속 일했다라는 뜻이에요. 늦었다는 사실을 인정하면서도 계속 일했다는 반대 내용을 이어 주고 있죠.","hl":"ex-0"},{"n":9,"text":"두 번째 예문입니다. Even if you fail, you can try again. 실패하더라도 다시 시도할 수 있다라는 뜻이에요. 아직 실패한 것이 아니라 실패할 수도 있는 상황을 가정하고 있으니까 even if를 씁니다.","hl":"ex-1"},{"n":10,"text":"세 번째 예문입니다. Even though he was tired, he finished his homework. 그는 피곤했지만 숙제를 끝냈다라는 뜻이에요. 실제로 피곤했다는 사실을 인정하니까 even though를 쓴 것입니다.","hl":"ex-2"},{"n":11,"text":"많이 헷갈리는 부분이 바로 even though와 even if예요. even though는 실제로 일어난 사실을 인정하는 것이고, even if는 일어날지 아닐지 모르는 일을 가정하는 것이라고 구분해 두세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 4\u003c/span>\u003ch2 class=\"g-h\">while과 whereas: '~인 반면'\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">while\u003c/b>과 \u003cb class=\"key\">whereas\u003c/b>는 두 가지 사실을 나란히 놓고 '~인 반면'이라고 비교할 때 쓴다. while은 '~하는 동안'이라는 시간의 뜻도 있으니 문맥을 확인해야 하고, \u003cb class=\"key\">whereas\u003c/b>는 비교의 뜻으로만 쓰인다.\u003cdiv>\u003cspan class=\"g-formula\">주절, while / whereas + 주어 + 동사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">My brother likes soccer, \u003cspan class=\"fx\">while I like basketball\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">내 남동생은 축구를 좋아하는 반면, 나는 농구를 좋아한다.\u003c/div>\u003cdiv class=\"g-note\">while은 두 사실을 반면으로 비교할 때 쓴다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">Tom is tall, \u003cspan class=\"fx\">whereas his brother is short\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">톰은 키가 큰 반면, 그의 동생은 키가 작다.\u003c/div>\u003cdiv class=\"g-note\">whereas는 비교의 뜻으로만 쓰인다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>while이 시간의 뜻인지 비교의 뜻인지 헷갈리면 \u003cb class=\"key\">문맥\u003c/b>을 보고 판단한다.\u003c/div>","segs":[{"n":12,"text":"while과 whereas는 두 가지 사실을 나란히 놓고 '~인 반면'이라고 비교할 때 씁니다. 다만 while은 '~하는 동안'이라는 시간의 뜻도 가지고 있어서 문맥을 꼭 확인해야 해요. whereas는 비교의 뜻으로만 쓰이기 때문에 의미가 아주 분명합니다.","hl":"rule"},{"n":13,"text":"첫 번째 예문입니다. My brother likes soccer, while I like basketball. 내 남동생은 축구를 좋아하는 반면, 나는 농구를 좋아한다라는 뜻이에요. 서로 다른 취미를 반면으로 놓고 비교하고 있죠.","hl":"ex-0"},{"n":14,"text":"두 번째 예문입니다. Tom is tall, whereas his brother is short. 톰은 키가 큰 반면, 그의 동생은 키가 작다라는 뜻이에요. whereas는 이렇게 딱 반대되는 두 사실을 비교할 때 씁니다.","hl":"ex-1"},{"n":15,"text":"while이 나오면 잠깐 멈추고 생각해 보세요. '~하는 동안'인지 '~인 반면'인지 문맥으로 판단해야 합니다.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 4 / 4\u003c/span>\u003ch2 class=\"g-h\">although와 but은 함께 쓰지 않는다\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">although\u003c/b>가 이끄는 절이 있으면 뒤 주절에 \u003cb class=\"key\">but\u003c/b>을 쓰지 않는다. although가 이미 양보의 뜻을 담고 있으므로 but을 더하면 접속사가 두 개가 되어 틀린 문장이 된다.\u003cdiv>\u003cspan class=\"g-formula\">Although + 주어 + 동사, 주어 + 동사 (but 없음)\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Although it was late, she kept working\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">늦었지만 그녀는 계속 일했다.\u003c/div>\u003cdiv class=\"g-note\">although가 있으므로 뒤에 but을 쓰지 않았다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>although를 쓰면 but은 \u003cb class=\"key\">삭제\u003c/b>하고, but을 쓰면 although를 \u003cb class=\"key\">삭제\u003c/b>한다.\u003c/div>","segs":[{"n":16,"text":"although와 but은 절대 함께 쓰지 않아요. 우리말로 '비록 늦었지만 그러나 그녀는 계속 일했다'라고 생각해서 but을 붙이기 쉬운데, 영어에서는 접속사 하나만 써야 합니다. although가 이미 양보의 뜻을 담고 있으니까 뒤에 but을 또 쓰면 접속사가 두 개가 되어 틀린 문장이 돼요.","hl":"rule"},{"n":17,"text":"다시 이 예문을 봅시다. Although it was late, she kept working. 늦었지만 그녀는 계속 일했다라는 뜻이에요. 앞에 although가 있으니까 뒤에는 but이 없죠. 이 점이 아주 중요합니다.","hl":"ex-0"},{"n":18,"text":"정리하면 이렇습니다. although를 쓰면 but은 지우고, but을 쓰고 싶으면 앞의 although를 지우세요. 둘 중 하나만 살려 두는 겁니다.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>Although it was late, but she kept working.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ Although it was late, she kept working.\u003c/div>\u003cdiv class=\"g-why\">although와 but은 함께 쓸 수 없기 때문이다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>Because it was raining, so we stayed at home.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ Because it was raining, we stayed at home.\u003c/div>\u003cdiv class=\"g-why\">because와 so도 함께 쓰지 않기 때문이다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-2\">\u003cdiv ext":"정답은 Since you are here, let's begin. 이에요. 이유를 나타내는 since절이 앞에 오고, 그 뒤에 시작하자는 주절이 옵니다. 뜻은 네가 와 있으니 시작하자예요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 6 / 6\u003c/span>\u003cspan class=\"g-kind\">영작\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 우리말을 영어로 쓰세요.\u003c/div>\u003cdiv class=\"g-qs\">그는 피곤했지만 숙제를 끝냈다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">Even though he was tired, he finished his homework.\u003c/span>\u003cdiv class=\"g-exp\">실제로 피곤했다는 사실을 인정하는 양보이므로 even though를 써서 두 문장을 연결한다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":37,"text":"마지막 문제는 영작이에요. 그는 피곤했지만 숙제를 끝냈다. 이 문장을 영어로 써 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":38,"text":"","hl":"q","pause":6},{"n":39,"text":"정답은 Even though he was tired, he finished his homework. 예요. 실제로 피곤했다는 사실을 인정하면서 반대되는 내용을 이어 주니까 even though를 씁니다. although나 though를 써도 같은 뜻이 됩니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">Unit 069 이유, 양보의 부사절\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>이유는 \u003cb class=\"key\">because\u003c/b>를 기본으로 쓰고, 상대도 아는 이유에는 \u003cb class=\"key\">since\u003c/b>와 \u003cb class=\"key\">as\u003c/b>, 상황 변화에는 \u003cb class=\"key\">now that\u003c/b>을 쓴다.\u003c/li>\u003cli>양보는 \u003cb class=\"key\">although\u003c/b>, \u003cb class=\"key\">though\u003c/b>, \u003cb class=\"key\">even though\u003c/b>로 나타내고, 가정에는 \u003cb class=\"key\">even if\u003c/b>를 쓴다.\u003c/li>\u003cli>\u003cb class=\"key\">while\u003c/b>과 \u003cb class=\"key\">whereas\u003c/b>는 '~인 반면'으로 두 사실을 비교한다.\u003c/li>\u003cli>\u003cb class=\"key\">although\u003c/b>와 \u003cb class=\"key\">but\u003c/b>은 한 문장에서 함께 쓰지 않는다.\u003c/li>\u003c/ul>","segs":[{"n":40,"text":"오늘은 이유와 양보의 부사절을 공부했어요. 이유는 because, since, as, now that으로 나타내고, 양보는 although, though, even though, even if로 나타낸다는 것, 꼭 기억해 두세요. 특히 although와 but을 함께 쓰지 않는다는 규칙은 시험에도 자주 나오니까요. 오늘 배운 예문들을 소리 내어 다시 읽어 보면서 익혀 보시고, 다음 시간에 또 만나요.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
