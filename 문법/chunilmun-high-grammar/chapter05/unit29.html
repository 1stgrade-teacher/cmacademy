  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");

  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}

  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}

}
lecturePlayer(document.getElementById("app"),{"brand":"Unit 29 I wish 가정법","title":"I wish 가정법 완전 정복","audioDir":"unit29_audio","preview":false,"count":35,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">Unit 029 I wish 가정법\u003c/div>\u003ch1>I wish 가정법 완전 정복\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>I wish 뒤에 오는 시제 변화를 이해하고 현재·과거·미래의 아쉬움과 바람을 표현할 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 I wish 가정법을 배워 볼 거예요. I wish 뒤에 오는 시제에 따라 현재의 아쉬움, 과거의 후회, 미래의 바람을 어떻게 표현하는지 예문으로 차근차근 익혀 봅시다. 오늘 수업이 끝나면 여러분도 I wish를 사용해 자신의 마음을 영어로 말할 수 있을 거예요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 3\u003c/span>\u003ch2 class=\"g-h\">현재 사실에 대한 아쉬움: I wish + 과거형\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">I wish 뒤에 \u003cb class=\"key\">과거형\u003c/b>을 쓰면 현재 사실과 반대되는 아쉬움을 나타내며 '~라면 좋을 텐데'로 해석합니다. 특히 be동사는 인칭과 관계없이 \u003cb class=\"key\">were\u003c/b>를 쓰는 경우가 대표적입니다. 현재 사실에 대한 아쉬움이지만 동사는 한 단계 물러나 \u003cb class=\"key\">과거\u003c/b> 형태로 쓴다는 점이 핵심입니다.\u003cdiv>\u003cspan class=\"g-formula\">I wish + 주어 + 과거형 / I wish + 주어 + were\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">I wish I were\u003c/span> taller.\u003c/div>\u003cdiv class=\"g-ko\">내가 더 크다면 좋을 텐데.\u003c/div>\u003cdiv class=\"g-note\">현재 키가 크지 않다는 사실에 대한 아쉬움을 were로 표현합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">I wish I knew\u003c/span> the answer.\u003c/div>\u003cdiv class=\"g-ko\">내가 그 답을 안다면 좋을 텐데.\u003c/div>\u003cdiv class=\"g-note\">현재 답을 모른다는 아쉬움을 과거형 knew로 표현합니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>현재 사실에 대한 아쉬움이라도 동사는 \u003cb class=\"key\">과거형\u003c/b>으로 쓰고, be동사는 \u003cb class=\"key\">were\u003c/b>를 사용한다는 점을 주의하세요.\u003c/div>","segs":[{"n":2,"text":"I wish 가정법은 현재 사실을 반대로 상상하면서 아쉬움을 표현하는 문법이에요. I wish 뒤에 과거형을 쓰면 지금은 그렇지 않다는 마음이 담기죠. 특히 be동사는 I wish I were처럼 were를 쓰는 형태를 자주 봅니다. 현재 이야기인데도 동사를 과거형으로 한 단계 물러나게 한다는 점을 꼭 기억해 주세요.","hl":"rule"},{"n":3,"text":"첫 예문은 I wish I were taller예요. 뜻은 내가 더 크다면 좋을 텐데예요. 지금 키가 크지 않다는 사실을 were로 표현한 문장입니다.","hl":"ex-0"},{"n":4,"text":"두 번째 예문은 I wish I knew the answer예요. 뜻은 내가 그 답을 안다면 좋을 텐데예요. 지금 답을 모른다는 현재의 아쉬움을 knew라는 과거형으로 나타냈습니다.","hl":"ex-1"},{"n":5,"text":"현재 사실에 대한 아쉬움이라고 해서 현재형을 쓰면 안 돼요. I wish I am taller가 아니라 I wish I were taller처럼 과거형으로 표현한다는 점을 꼭 기억해 주세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 3\u003c/span>\u003ch2 class=\"g-h\">과거 사실에 대한 후회: I wish + had p.p.\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">I wish 뒤에 \u003cb class=\"key\">had p.p.\u003c/b>를 쓰면 과거에 일어난 일을 바꾸고 싶은 후회를 나타내며 '~했다면 좋을 텐데'로 해석합니다. 이미 지나간 일에 대한 후회이므로 현재형이 아니라 \u003cb class=\"key\">과거완료\u003c/b>를 사용합니다. 과거의 특정 시점보다 더 이전에 일어난 일을 표현하는 \u003cb class=\"key\">had p.p.\u003c/b>의 성격이 그대로 드러납니다.\u003cdiv>\u003cspan class=\"g-formula\">I wish + 주어 + had p.p.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I wish I \u003cspan class=\"fx\">had studied\u003c/span> harder.\u003c/div>\u003cdiv class=\"g-ko\">내가 더 열심히 공부했다면 좋을 텐데.\u003c/div>\u003cdiv class=\"g-note\">과거에 더 열심히 공부하지 못한 일을 후회합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">I wish I \u003cspan class=\"fx\">had brought\u003c/span> my umbrella.\u003c/div>\u003cdiv class=\"g-ko\">내가 우산을 가져왔다면 좋을 텐데.\u003c/div>\u003cdiv class=\"g-note\">과거에 우산을 챙기지 않은 일을 아쉬워합니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>과거의 후회인지 현재의 아쉬움인지 헷갈릴 때는 \u003cb class=\"key\">시간 표현\u003c/b>을 확인하고, 과거 사실에는 \u003cb class=\"key\">had p.p.\u003c/b>를 씁니다.\u003c/div>","segs":[{"n":6,"text":"이번에는 과거 사실에 대한 후회를 표현하는 I wish 가정법이에요. I wish 뒤에 had p.p.를 쓰면 지난 일을 돌이켜 보며 그렇게 하지 못한 아쉬움을 나타냅니다. 이미 지나간 일이니까 현재형이 아니라 과거완료 형태를 쓴다는 점이 중요해요. 뜻은 보통 어땠다면 좋을 텐데로 해석합니다.","hl":"rule"},{"n":7,"text":"대표 예문은 I wish I had studied harder예요. 뜻은 내가 더 열심히 공부했다면 좋을 텐데예요. 과거에 더 열심히 공부하지 못한 일을 후회하는 문장입니다.","hl":"ex-0"},{"n":8,"text":"또 다른 예문은 I wish I had brought my umbrella예요. 뜻은 내가 우산을 가져왔다면 좋을 텐데예요. 과거에 우산을 챙기지 않은 일을 아쉬워하는 표현입니다.","hl":"ex-1"},{"n":9,"text":"과거의 후회인지 현재의 아쉬움인지 헷갈릴 때는 문장에 나오는 시간 표현을 먼저 확인해 보세요. 과거 사실을 바꾸고 싶은 마음이라면 I wish I had studied harder처럼 had p.p.를 써야 합니다.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 3\u003c/span>\u003ch2 class=\"g-h\">미래·현재의 바람: I wish + would/could + 동사원형\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">I wish 뒤에 \u003cb class=\"key\">would\u003c/b>나 \u003cb class=\"key\">could\u003c/b>와 동사원형을 쓰면 미래·현재의 바람을 나타냅니다. would는 주로 다른 사람이나 상황이 바뀌기를 바랄 때 쓰고, could는 자신의 능력이나 가능성에 대한 바람을 나타낼 때 자주 씁니다. 이때도 조동사 뒤에는 반드시 \u003cb class=\"key\">동사원형\u003c/b>이 옵니다.\u003cdiv>\u003cspan class=\"g-formula\">I wish + 주어 + would/could + 동사원형\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I wish it \u003cspan class=\"fx\">would stop\u003c/span> raining.\u003c/div>\u003cdiv class=\"g-ko\">비가 그쳤으면 좋겠다.\u003c/div>\u003cdiv class=\"g-note\">지금 비가 오는 상황이 바뀌기를 바라는 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">I wish I \u003cspan class=\"fx\">could speak\u003c/span> English fluently.\u003c/div>\u003cdiv class=\"g-ko\">내가 영어를 유창하게 말할 수 있다면 좋을 텐데.\u003c/div>\u003cdiv class=\"g-note\">현재 영어를 유창하게 말하지 못하는 능력에 대한 바람을 could로 표현합니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>would와 could 뒤에는 \u003cb class=\"key\">동사원형\u003c/b>을 쓰고, 상황 변화에는 \u003cb class=\"key\">would\u003c/b>, 능력이나 가능성에는 \u003cb class=\"key\">could\u003c/b>가 자주 쓰입니다.\u003c/div>","segs":[{"n":10,"text":"마지막으로 미래나 현재의 바람을 표현하는 I wish 가정법을 볼게요. I wish 뒤에 would와 동사원형을 쓰면 상황이 바뀌기를 바라는 마음을 나타냅니다. could와 동사원형을 쓰면 내가 어떤 일을 할 수 있다면 좋겠다는 바람을 표현할 수 있어요. 조동사 뒤에는 항상 동사원형이 온다는 점도 함께 기억해 주세요.","hl":"rule"},{"n":11,"text":"예문은 I wish it would stop raining이에요. 뜻은 비가 그쳤으면 좋겠다예요. 지금 비가 오는 상황이 바뀌기를 바라는 마음을 would stop으로 표현했습니다.","hl":"ex-0"},{"n":12,"text":"보충 예문은 I wish I could speak English fluently예요. 뜻은 내가 영어를 유창하게 말할 수 있다면 좋을 텐데예요. 현재 영어를 유창하게 말하지 못하는 능력에 대한 바람을 could speak로 나타냈습니다.","hl":"ex-1"},{"n":13,"text":"would 뒤에 동사를 쓸 때는 stops나 stopped가 아니라 stop처럼 동사원형을 써야 해요. 상황이 바뀌기를 바라면 would를, 능력이나 가능성에 대한 바람이면 could를 떠올려 주세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>I wish I am taller.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ I wish I were taller.\u003c/div>\u003cdiv class=\"g-why\">현재 사실에 대한 아쉬움에는 과거형 were를 써야 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>I wish I studied harder yesterday.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ I wish I had studied harder yesterday.\u003c/div>\u003cdiv class=\"g-why\">과거 사실에 대한 후회에는 had p.p.를 써야 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-2\">\u003cdiv class=\"g-wrong\">✗ \u003cs>I wish it stops raining.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ I wish it would stop raining.\u003c/div>\u003cdiv class=\"g-why\">상황이 바뀌기를 바랄 때는 would와 동사원형을 써야 합니다.\u003c/div>\u003c/div>","segs":[{"n":14,"text":"학생들이 자주 하는 실수는 I wish I am taller라고 쓰는 거예요. 현재 사실에 대한 아쉬움이라도 I wish 뒤에는 과거형 were를 써서 I wish I were taller라고 해야 합니다.","hl":"mk-0"},{"n":15,"text":"과거의 일을 후회할 때 I wish I studied harder yesterday라고 쓰면 어색해요. 이미 지나간 일이므로 had p.p.를 사용해서 I wish I had studied harder yesterday라고 표현해야 합니다.","hl":"mk-1"},{"n":16,"text":"상황이 바뀌기를 바랄 때는 I wish it stops raining이 아니라 I wish it would stop raining이라고 해야 해요. would 뒤에는 동사원형 stop이 온다는 점도 꼭 확인해 주세요.","hl":"mk-2"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 중 빈칸에 들어갈 말로 알맞은 것을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\">I wish I ____ taller.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>am\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>were\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>had been\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>will be\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">were\u003c/span>\u003cdiv class=\"g-exp\">현재 키가 크지 않다는 사실에 대한 아쉬움이므로 I wish 뒤에 과거형 were를 씁니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":17,"text":"빈칸에 들어갈 말을 고르는 문제입니다. I wish I 뒤에 빈칸이 있고 taller가 이어지는 문장을 보고 가장 알맞은 보기를 골라 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":18,"text":"","hl":"q","pause":6},{"n":19,"text":"정답은 두 번째 보기인 were예요. 현재 키가 크지 않다는 사실에 대한 아쉬움이므로 I wish 뒤에 과거형 were를 써서 I wish I were taller라고 합니다. 첫 번째 보기 am은 현재형이라 알맞지 않아요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 6\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">과거 사실에 대한 후회가 되도록 빈칸에 알맞은 말을 쓰세요.\u003c/div>\u003cdiv class=\"g-qs\">I wish I ____ harder.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">had studied\u003c/span>\u003cdiv class=\"g-exp\">과거에 더 열심히 공부하지 못한 일을 후회하므로 I wish 뒤에 had p.p. 형태인 had studied를 씁니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":20,"text":"이번에는 빈칸을 직접 채워 보는 문제입니다. I wish I 뒤에 빈칸이 있고 harder가 이어지는 문장이 과거 사실에 대한 후회가 되도록 알맞은
