</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;
    if(s.pause){pause(s.pause);return;}
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}

    if(t.getAttribute("data-act")==="show"){reveal("ans");return;}
    var g=t.parentNode;if(g&&g.classList.contains("rv"))return;[].forEach.call(g.querySelectorAll(".g-opt"),function(o){if(o!==t)o.classList.remove("picked");});t.classList.toggle("picked");});
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Unit 51 with + 명사 + 분사","title":"with + 명사 + 분사, '~한 채로' 상황 묘사하기","audioDir":"unit51_audio","preview":false,"count":35,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">Unit 051 with + 명사 + 분사\u003c/div>\u003ch1>with + 명사 + 분사, '~한 채로' 상황 묘사하기\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>with + 명사 + 분사를 이용해 '~한 채로'라는 부대상황을 능동과 수동에 맞게 표현할 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 with 뒤에 명사와 분사가 함께 오는 표현을 배워 볼 거예요. 이 표현 하나만 잘 익혀도 '~한 채로'라는 상황을 훨씬 생생하게 설명할 수 있답니다. 오늘 예문 몇 개만 확실히 소화하면 바로 써먹을 수 있으니까 편안하게 따라와 주세요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 3\u003c/span>\u003ch2 class=\"g-h\">with + 명사 + 분사는 부대상황 표현\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">with + 명사 + 분사는 '~한 채로, ~하면서'라는 \u003cb class=\"key\">부대상황\u003c/b>을 나타냅니다. 주절의 동작과 함께 일어나는 다른 상황을 덧붙여 설명할 때 씁니다. 이때 with 뒤의 명사는 분사의 \u003cb class=\"key\">의미상 주어\u003c/b> 역할을 합니다.\u003cdiv>\u003cspan class=\"g-formula\">with + 명사 + 분사 = ~한 채로, ~하면서\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The dog slept \u003cspan class=\"fx\">with its tail wagging\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">개는 꼬리를 흔들며 잤다.\u003c/div>\u003cdiv class=\"g-note\">개가 잠자는 동안 꼬리가 계속 흔들리고 있던 상황을 덧붙여 준 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">He walked \u003cspan class=\"fx\">with his dog following him\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그는 개가 따라오는 채로 걸었다.\u003c/div>\u003cdiv class=\"g-note\">개가 스스로 따라오고 있으므로 현재분사 following을 씁니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>주절의 동작과 \u003cb class=\"key\">동시에\u003c/b> 일어나는 상황을 덧붙일 때 쓴다는 점을 기억하세요.\u003c/div>","segs":[{"n":2,"text":"오늘은 with 뒤에 명사와 분사가 함께 오는 표현을 배워 볼게요. 이 표현은 '~한 채로, ~하면서'라는 뜻으로, 주된 동작과 함께 일어나는 다른 상황을 덧붙여 줄 때 사용해요. 이걸 부대상황이라고 부르는데, 문장을 훨씬 생생하게 만들어 주는 아주 좋은 표현이에요. with 뒤에 오는 명사는 뒤에 오는 분사의 의미상 주어 역할을 한다는 점도 꼭 기억해 두세요.","hl":"rule"},{"n":3,"text":"The dog slept with its tail wagging. 개는 꼬리를 흔들며 잤다는 뜻이에요. 개가 잠든 그 순간에도 꼬리는 계속 흔들리고 있었던 상황을 with its tail wagging으로 덧붙여 준 거예요.","hl":"ex-0"},{"n":4,"text":"He walked with his dog following him. 그는 개가 따라오는 채로 걸었다는 뜻이에요. 개가 스스로 따라오고 있는 상황이니까 following이라는 현재분사를 쓴 거죠.","hl":"ex-1"},{"n":5,"text":"이 표현은 주된 동작과 동시에 일어나는 상황을 덧붙일 때 쓴다는 점을 기억해 두세요. 그래서 해석할 때는 '~한 채로'라고 자연스럽게 붙여 주면 됩니다.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 3\u003c/span>\u003ch2 class=\"g-h\">능동이면 -ing, 수동이면 p.p.\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">with 뒤의 명사와 분사의 관계가 \u003cb class=\"key\">능동\u003c/b>이면 현재분사 -ing를 씁니다. 명사가 분사의 동작을 당하는 \u003cb class=\"key\">수동\u003c/b> 관계이면 과거분사 p.p.를 씁니다. 즉 명사가 동작을 하면 -ing, 당하면 p.p.라고 기억하면 됩니다.\u003cdiv>\u003cspan class=\"g-formula\">능동: with + 명사 + -ing / 수동: with + 명사 + p.p.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">She sat \u003cspan class=\"fx\">with her arms crossed\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 팔짱을 낀 채 앉아 있었다.\u003c/div>\u003cdiv class=\"g-note\">팔은 스스로 교차하는 것이 아니라 교차되는 대상이므로 과거분사 crossed를 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">He spoke \u003cspan class=\"fx\">with his eyes closed\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그는 눈을 감은 채 말했다.\u003c/div>\u003cdiv class=\"g-note\">눈은 감기는 대상이므로 수동 관계로 보고 과거분사 closed를 씁니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>명사가 동작을 \u003cb class=\"key\">당하면\u003c/b> 반드시 p.p.를 써야 하며, 이때 \u003cb class=\"key\">수동\u003c/b> 관계를 놓치기 쉽습니다.\u003c/div>","segs":[{"n":6,"text":"이번에는 분사의 형태를 고르는 방법을 알아볼게요. with 뒤에 오는 명사가 그 동작을 스스로 하고 있으면 현재분사인 i n g 형태를 씁니다. 반대로 명사가 그 동작을 당하고 있으면 과거분사 형태를 써야 해요. 그래서 문장을 쓸 때는 항상 명사와 동작의 관계부터 따져 보는 습관이 중요합니다.","hl":"rule"},{"n":7,"text":"She sat with her arms crossed. 그녀는 팔짱을 낀 채 앉아 있었다는 뜻이에요. 팔은 스스로 교차하는 게 아니라 교차되는 대상이기 때문에 과거분사 crossed를 써요.","hl":"ex-0"},{"n":8,"text":"He spoke with his eyes closed. 그는 눈을 감은 채 말했다는 뜻이에요. 눈은 스스로 감는 게 아니라 감기는 대상이니까 수동 관계로 보고 closed를 쓴 겁니다.","hl":"ex-1"},{"n":9,"text":"시험에서 가장 자주 틀리는 부분이 바로 분사의 형태예요. 명사가 동작을 당하는 수동 관계라면 반드시 과거분사를 써야 한다는 점, 잊지 마세요. 답을 쓰기 전에 명사와 동작의 관계를 한 번만 더 확인해 보면 실수를 크게 줄일 수 있어요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 3\u003c/span>\u003ch2 class=\"g-h\">with + 명사 + 형용사·부사·전치사구\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">with + 명사 뒤에는 분사뿐 아니라 \u003cb class=\"key\">형용사\u003c/b>, \u003cb class=\"key\">부사\u003c/b>, \u003cb class=\"key\">전치사구\u003c/b>도 올 수 있습니다. 이때도 '~한 채로'라는 부대상황의 의미는 그대로입니다. 예를 들어 창문이 열린 채로는 with the window open처럼 형용사 open을 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">with + 명사 + 형용사 / 부사 / 전치사구\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">She slept \u003cspan class=\"fx\">with the window open\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 창문을 열어 둔 채 잤다.\u003c/div>\u003cdiv class=\"g-note\">명사 the window 뒤에 형용사 open이 와서 상태를 나타냅니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">He stood \u003cspan class=\"fx\">with his hands in his pockets\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그는 두 손을 주머니에 넣은 채 서 있었다.\u003c/div>\u003cdiv class=\"g-note\">명사 his hands 뒤에 전치사구 in his pockets가 와서 상태를 설명합니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>형용사나 전치사구가 오면 분사 형태를 고민할 필요가 없으니 \u003cb class=\"key\">형태\u003c/b>를 먼저 확인하세요.\u003c/div>","segs":[{"n":10,"text":"마지막으로 분사가 아닌 다른 형태도 올 수 있다는 점을 알아 둘게요. with 뒤에 명사 다음에 형용사나 부사, 전치사구가 와도 똑같이 '~한 채로'라는 의미를 만들어요. 예를 들어 창문이 열려 있는 상태를 말할 때는 형용사 open을 그대로 써 주면 됩니다. 형태는 조금 달라도 부대상황을 나타낸다는 핵심은 변하지 않아요.","hl":"rule"},{"n":11,"text":"She slept with the window open. 그녀는 창문을 열어 둔 채 잤다는 뜻이에요. 창문이 열려 있는 상태를 형용사 open 하나로 표현했죠.","hl":"ex-0"},{"n":12,"text":"He stood with his hands in his pockets. 그는 두 손을 주머니에 넣은 채 서 있었다는 뜻이에요. 이번에는 명사 뒤에 전치사구가 와서 상태를 설명하고 있답니다.","hl":"ex-1"},{"n":13,"text":"형용사나 전치사구가 오는 경우에는 분사 형태를 고민할 필요가 없어요. 빈칸 앞에 오는 말이 명사인지, 그 뒤에 어떤 형태가 자연스러운지 먼저 확인하면 답이 보입니다.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>She sat with her arms crossing.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ She sat with her arms crossed.\u003c/div>\u003cdiv class=\"g-why\">팔은 스스로 교차하는 것이 아니라 교차되는 대상이므로 수동 관계인 과거분사 crossed를 써야 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>The dog slept with its tail wagged.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ The dog slept with its tail wagging.\u003c/div>\u003cdiv class=\"g-why\">꼬리는 스스로 흔들리는 주체이므로 능동 관계인 현재분사 wagging을 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-2\">\u003cdiv class=\"g-wrong\">✗ \u003cs>He spoke with his eyes close.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ He spoke with his eyes closed.\u003c/div>\u003cdiv class=\"g-why\">close는 동사원형이라 명사 뒤에서 상태를 나타낼 수 없고, 수동 관계를 보여 주는 과거분사 closed가 필요합니다.\u003c/div>\u003c/div>","segs":[{"n":14,"text":"첫 번째 문장을 볼게요. She sat with her arms crossing이라고 쓰면 팔이 스스로 교차한다는 어색한 뜻이 돼요. 팔은 교차되는 대상이니까 수동 관계로 보고 crossed로 고쳐야 합니다.","hl":"mk-0"},{"n":15,"text":"두 번째 문장이에요. The dog slept with its tail wagged라고 하면 꼬리가 흔들림을 당한다는 이상한 뜻이 됩니다. 꼬리는 스스로 흔들리는 주체니까 wagging으로 써야 해요.","hl":"mk-1"},{"n":16,"text":"세 번째 문장을 확인해 볼게요. He spoke with his eyes close라고 쓰면 동사원형이 그대로 나와서 문장이 어색해집니다. 눈은 감기는 대상이니까 과거분사 closed를 써야 자연스러워요.","hl":"mk-2"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan clas
