  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}

    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);

}
lecturePlayer(document.getElementById("app"),{"brand":"Unit 46 분사의 쓰임 2: 보어 역할","title":"분사가 보어 자리에 온다고? 주격보어와 목적격보어 완전 정리","audioDir":"unit46_audio","preview":false,"count":40,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">Unit 046 분사의 쓰임 2: 보어 역할\u003c/div>\u003ch1>분사가 보어 자리에 온다고? 주격보어와 목적격보어 완전 정리\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>분사가 주격보어와 목적격보어로 쓰이는 구조를 예문으로 익히고, 목적어의 능동·수동에 따라 -ing와 p.p.를 골라 쓸 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 분사의 쓰임 두 번째 시간으로, 분사가 보어 자리에서 어떻게 쓰이는지 공부할 거예요. 주어를 보충 설명하는 주격보어와 목적어를 보충 설명하는 목적격보어, 이렇게 두 가지를 차례대로 살펴볼게요. 그리고 목적어가 동작을 하는지 당하는지에 따라 형태가 달라지는 규칙까지 정리합니다. 어렵지 않으니까 예문을 소리 내어 읽으면서 천천히 따라와 주세요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 4\u003c/span>\u003ch2 class=\"g-h\">주격보어로 쓰이는 분사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">분사는 주어의 상태나 동작을 보충 설명하는 \u003cb class=\"key\">주격보어\u003c/b>로 쓰일 수 있습니다. \u003cb class=\"key\">keep\u003c/b>, \u003cb class=\"key\">stay\u003c/b>, \u003cb class=\"key\">sit\u003c/b>, \u003cb class=\"key\">lie\u003c/b>, \u003cb class=\"key\">remain\u003c/b> 같은 동사 뒤에 분사를 붙여 주세요.\u003cdiv>\u003cspan class=\"g-formula\">keep / stay / sit / lie / remain + 분사(-ing / p.p.)\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">She \u003cspan class=\"fx\">sat reading\u003c/span> in the garden.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 정원에 앉아 책을 읽었다.\u003c/div>\u003cdiv class=\"g-note\">sit 뒤에 -ing가 와서 '앉아서 책을 읽고 있었다'는 상태를 보충합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">The door \u003cspan class=\"fx\">remained locked\u003c/span> all day.\u003c/div>\u003cdiv class=\"g-ko\">그 문은 하루 종일 잠긴 채로 남아 있었다.\u003c/div>\u003cdiv class=\"g-note\">remain 뒤에 p.p.가 와서 주어가 어떤 상태로 계속 남아 있음을 나타냅니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>주격보어 자리에 동사를 그대로 쓰지 말고 반드시 \u003cb class=\"key\">-ing\u003c/b>나 \u003cb class=\"key\">p.p.\u003c/b> 형태로 바꿔서 넣어야 합니다.\u003c/div>","segs":[{"n":2,"text":"먼저 주격보어로 쓰이는 분사부터 볼게요. 주어의 상태나 동작을 보충해서 설명할 때 동사 뒤에 분사를 붙여서 주격보어로 씁니다. keep, stay, sit, lie, remain 같은 동사들이 여기에 잘 어울려요. 이 동사들 뒤에 -ing가 오면 주어가 그 동작을 하면서 그 상태에 있다는 뜻이 되고, 과거분사가 오면 주어가 어떤 상태로 남아 있다는 뜻이 됩니다.","hl":"rule"},{"n":3,"text":"She sat reading in the garden. 이 문장은 그녀는 정원에 앉아 책을 읽었다, 라는 뜻이에요. 동사 sat 뒤에 reading이 와서 그녀가 앉은 상태에서 책을 읽고 있었다는 걸 보충해 주고 있죠. 이렇게 주어의 동작을 덧붙여 설명하는 자리가 바로 주격보어 자리예요.","hl":"ex-0"},{"n":4,"text":"The door remained locked all day. 이 문장은 그 문은 하루 종일 잠긴 채로 남아 있었다, 라는 뜻이에요. remain 뒤에 과거분사 locked가 와서 문이 잠긴 상태로 계속 남아 있었다는 걸 보여 줍니다. 이렇게 주어가 당하는 상태를 나타낼 때는 과거분사를 쓴다는 점도 같이 기억해 두세요.","hl":"ex-1"},{"n":5,"text":"여기서 실수하기 쉬운 부분이 있는데요. 동사 자리에 동사를 그대로 또 쓰면 안 되고, 반드시 -ing나 과거분사 형태로 바꿔서 넣어야 합니다. 이 형태 변화만 신경 써도 문장이 훨씬 자연스러워져요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 4\u003c/span>\u003ch2 class=\"g-h\">목적격보어로 쓰이는 분사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">지각동사\u003c/b> see, hear, feel 과 \u003cb class=\"key\">find\u003c/b>, keep, leave 뒤에 목적어와 분사를 이어 쓰면 목적어의 동작이나 상태를 보충할 수 있습니다. 이때 목적어 뒤에 오는 분사를 \u003cb class=\"key\">목적격보어\u003c/b>라고 부릅니다.\u003cdiv>\u003cspan class=\"g-formula\">see / hear / feel / find / keep / leave + O + 분사(-ing / p.p.)\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">We \u003cspan class=\"fx\">heard our names called\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">우리는 우리 이름이 불리는 것을 들었다.\u003c/div>\u003cdiv class=\"g-note\">이름은 불리는 대상이므로 p.p.인 called를 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">I \u003cspan class=\"fx\">found him sleeping\u003c/span> on the sofa.\u003c/div>\u003cdiv class=\"g-ko\">나는 그가 소파에서 자고 있는 것을 발견했다.\u003c/div>\u003cdiv class=\"g-note\">him이 직접 자는 동작을 하므로 -ing를 씁니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>목적격보어 자리에는 목적어와 분사의 관계를 먼저 확인하고 형태를 고르세요. 목적어가 동작을 하면 \u003cb class=\"key\">-ing\u003c/b>, 당하면 \u003cb class=\"key\">p.p.\u003c/b>입니다.\u003c/div>","segs":[{"n":6,"text":"이번에는 목적격보어로 쓰이는 분사입니다. see, hear, feel 같은 지각동사나 find, keep, leave 뒤에 목적어를 쓰고 그 뒤에 분사를 붙이면 목적어가 하는 동작이나 받는 상태를 보충해서 설명할 수 있어요. 이때 목적어 뒤에 오는 분사를 목적격보어라고 부릅니다. 우리말로는 목적어가 어찌어찌하는 것을 보다, 듣다, 발견하다처럼 해석하면 자연스러워요.","hl":"rule"},{"n":7,"text":"We heard our names called. 이 문장은 우리는 우리 이름이 불리는 것을 들었다, 라는 뜻이에요. hear 뒤에 목적어 our names가 오고 그 뒤에 called가 왔죠. 이름은 부르는 게 아니라 불리는 대상이니까 과거분사 called를 쓴 겁니다.","hl":"ex-0"},{"n":8,"text":"I found him sleeping on the sofa. 이 문장은 나는 그가 소파에서 자고 있는 것을 발견했다, 라는 뜻이에요. find 뒤에 목적어 him이 오고 그 뒤에 sleeping이 왔습니다. 그가 직접 자고 있는 동작을 하고 있으니까 현재분사 sleeping을 쓴 거예요.","hl":"ex-1"},{"n":9,"text":"목적격보어 문제가 나오면 목적어와 분사의 관계부터 확인하세요. 목적어가 그 동작을 직접 하고 있으면 -ing, 당하고 있으면 과거분사를 고르면 됩니다. 이 순서만 지켜도 답이 보여요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 4\u003c/span>\u003ch2 class=\"g-h\">have / get + O + p.p.와 make oneself understood\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">have\u003c/b>나 \u003cb class=\"key\">get\u003c/b> 뒤에 목적어와 p.p.를 쓰면 '~되게 하다, ~당하다'는 의미가 됩니다. \u003cb class=\"key\">make oneself understood\u003c/b>처럼 목적어가 자기 자신일 때도 p.p.를 써서 '남에게 이해되게 하다'를 표현합니다.\u003cdiv>\u003cspan class=\"g-formula\">have / get + O + p.p. = O가 ~되게 하다, ~당하다\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I \u003cspan class=\"fx\">had my hair cut\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나는 머리를 잘랐다.\u003c/div>\u003cdiv class=\"g-note\">머리는 자르는 대상이므로 p.p. cut을 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">She \u003cspan class=\"fx\">got her car repaired\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 차를 수리했다.\u003c/div>\u003cdiv class=\"g-note\">get + 목적어 + p.p.로 '~되게 하다'를 나타냅니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">He \u003cspan class=\"fx\">made himself understood\u003c/span> in English.\u003c/div>\u003cdiv class=\"g-ko\">그는 영어로 자신의 말이 이해되게 했다.\u003c/div>\u003cdiv class=\"g-note\">make oneself understood는 '자신을 이해시키다'라는 관용 표현입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>have나 get 뒤에 \u003cb class=\"key\">동사원형\u003c/b>이 아니라 \u003cb class=\"key\">p.p.\u003c/b>가 온다는 점, 그리고 '내가 하는 게 아니라 당하는 일'이라는 의미를 꼭 기억하세요.\u003c/div>","segs":[{"n":10,"text":"다음은 have와 get이 들어간 표현입니다. have나 get 뒤에 목적어를 쓰고 과거분사를 붙이면 목적어가 어떤 일이 되게 하다, 또는 당하게 하다는 뜻이 됩니다. 예를 들어 머리를 자르는 것은 내가 자르는 게 아니라 잘리는 거니까 과거분사를 쓰는 거예요. make oneself understood처럼 목적어가 자기 자신일 때도 과거분사를 써서 남에게 이해되게 하다는 뜻을 만들 수 있습니다.","hl":"rule"},{"n":11,"text":"I had my hair cut. 이 문장은 나는 머리를 잘랐다, 라는 뜻이에요. 내가 직접 자른 게 아니라 미용사에게 잘라 달라고 한 상황이죠. 목적어 my hair가 자르는 대상이니까 과거분사 cut을 씁니다.","hl":"ex-0"},{"n":12,"text":"She got her car repaired. 이 문장은 그녀는 차를 수리했다, 라는 뜻이에요. get 뒤에 목적어 her car가 오고 과거분사 repaired가 왔습니다. 차는 수리하는 게 아니라 수리되는 대상이니까 과거분사를 쓴 거예요.","hl":"ex-1"},{"n":13,"text":"He made himself understood in English. 이 문장은 그는 영어로 자신의 말이 이해되게 했다, 라는 뜻이에요. himself가 이해되는 대상이니까 과거분사 understood가 왔습니다. make oneself understood는 자신을 이해시키다라는 뜻으로 통째로 외워 두면 좋아요.","hl":"ex-2"},{"n":14,"text":"여기서 가장 중요한 포인트는 have나 get 뒤에 동사원형이 아니라 과거분사가 온다는 점이에요. 그리고 이 표현은 내가 직접 하는 일이 아니라 당하거나 시키는 일이라는 느낌을 담고 있습니다. 해석할 때 그 느낌을 꼭 살려 주세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 4 / 4\u003c/span>\u003ch2 class=\"g-h\">목적어가 동작을 하면 -ing, 받으면 p.p.\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">목적어가 동작을 직접 하면 현재분사 \u003cb class=\"key\">-ing\u003c/b>를, 동작을 당하면 과거분사 \u003cb class=\"key\">p.p.\u003c/b>를 씁니다. 즉 \u003cb class=\"key\">능동\u003c/b>이면 -ing, \u003cb class=\"key\">수동\u003c/b>이면 p.p.라고 정리할 수 있습니다.\u003cdiv>\u003cspan class=\"g-formula\">O + -ing (능동) / O + p.p. (수동)\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">I \u003cspan class=\"fx\">saw him crossing\u003c/span> the street.\u003c/div>\u003cdiv class=\"g-ko\">나는 그가 길을 건너는 것을 보았다.\u003c/div>\u003cdiv class=\"g-note\">him이 직접 건너는 동작을 하므로 -ing를 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">I \u003cspan class=\"fx\">saw the window broken\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나는 창문이 깨진 것을 보았다.\u003c/div>\u003cdiv class=\"g-note\">창문은 깨지는 대상이므로 p.p.를 씁니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>해석이 애매할 때는 목적어가 동작의 \u003cb class=\"key\">주체\u003c/b>인지 \u003cb class=\"key\">대상\u003c/b>인지 따져 보세요. 주체면 -ing, 대상이면 p.p.입니다.\u003c/div>","segs":[{"n":15,"text":"마지막으로 형태를 고르는 기준을 정리할게요. 목적어가 어떤 동작을 직접 하고 있으면 현재분사 -ing를 쓰고, 목적어가 그 동작을 당하고 있으면 과거분사 p.p.를 씁니다. 쉽게 말해서 능동이면 -ing, 수동이면 p.p.예요. 같은 동사를 쓰더라도 목적어의 관계에 따라 형태가 완전히 달라지니까 해석하면서 판단하는 습관을 들여야 합니다.","hl":"rule"},{"n":16,"text":"I saw him crossing the street. 이 문장은 나는 그가 길을 건너는 것을 보았다, 라는 뜻이에요. him이 직접 길을 건너는 동작을 하고 있으니까 현재분사 crossing을 썼습니다.","hl":"ex-0"},{"n":17,"text":"I saw the window broken. 이 문장은 나는 창문이 깨진 것을 보았다, 라는 뜻이에요. 창문은 스스로 깨는 게 아니라 깨지는 대상이니까 과거분사 broken을 씁니다. 바로 앞 문장과 비교하면서 목적어의 관계만 바꿔서 연습해 보세요.","hl":"ex-1"},{"n":18,"text":"해석만으로 헷갈릴 때는 목적어가 그 동작의 주체인지 대상인지 따져 보세요. 주체면 -ing, 대상이면 과거분사, 이 기준 하나면 충분합니다.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>She sat read in the garden.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ She sat reading in the garden.\u003c/div>\u003cdiv class=\"g-why\">sit 뒤 주격보어 자리에는 동작을 나타내는 -ing 형태가 와야 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>I had my hair cutting.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ I had my hair cut.\u003c/div>\u003cdiv class=\"g-why\">머리는 자르는 주체가 아니라 잘리는 대상이므로 p.p.를 써야 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-2\">\u003cdiv class=\"g-wrong\">✗ \u003cs>We heard our names calling.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ We heard our names called.\u003c/div>\u003cdiv class=\"g-why\">이름은 부르는 주체가 아니라 불리는 대상이므로 p.p. called를 씁니다.\u003c/div>\u003c/div>","segs":[{"n":19,"text":"sit 뒤에 동사를 그대로 쓰면 안 됩니다. 그녀가 앉아서 책을 읽고 있었던 동작을 보충해야 하니까 reading으로 바꿔야 해요.","hl":"mk-0"},{"n":20,"text":"have 뒤에 목적어가 오면 그 목적어가 당하는 일을 나타내요. 머리는 자르는 게 아니라 잘리는 대상이니까 cut이라는 과거분사를 써야 합니다.","hl":"mk-1"},{"n":21,"text":"hear 뒤에 목적어 our names가 왔는데, 이름은 스스로 부르는 게 아니라 불리는 대상이에요. 그래서 현재분사가 아니라 과거분사 called를 써야 합니다.","hl":"mk-2"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">괄호 안의 동사를 알맞은 형태로 바꿔 빈칸을 채우세요.\u003c/div>\u003cdiv class=\"g-qs\">She sat ____ in the garden. (read)\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">reading\u003c/span>\u003cdiv class=\"g-exp\">sit 뒤 주격보어 자리에는 주어의 동작을 나타내는 현재분사가 옵니다. 그녀가 앉아서 읽고 있었으므로 reading이 맞습니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":22,"text":"첫 번째 문제는 빈칸 채우기예요. 괄호 안의 read를 알맞은 형태로 바꿔서 문장을 완성해 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":23,"text":"","hl":"q","pause":6},{"n":24,"text":"정답은 reading입니다. sit 뒤에 주어의 동작을 보충하는 주격보어가 와야 하는데, 그녀가 앉아서 책을 읽고 있었으니까 현재분사 reading을 씁니다. 동사원형을 그대로 넣으면 안 된다는 점도 꼭 기억하세요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">'우리는 우리 이름이 불리는 것을 들었다.'의 바른 영작을 고르세요.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>We heard our names calling.\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>We heard our names called.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>We heard our names to call.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>We heard our names call.\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">We heard our names called.\u003c/span>\u003cdiv class=\"g-exp\">이름은 불리는 대상이므로 목적격보어로 과거분사 called를 씁니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":25,"text":"두 번째 문제는 객관식이에요. 우리는 우리 이름이 불리는 것을 들었다, 라는 뜻이 되는 문장을 골라 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":26,"text":"","hl":"q","pause":6},{"n":27,"text":"정답은 두 번째 보기예요. hear 뒤에 목적어 our names가 오고, 이름은 부르는 주체가 아니라 불리는 대상이니까 과거분사 called를 써야 합니다. calling이라고 하면 이름이 스스로 부르고 있다는 이상한 뜻이 되어 버려요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 3 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 중 어법상 옳은 문장을 고르세요.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>I had my car repairing.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>I got my car repair.\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>③\u003c/b>I had my car repaired.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>I had my car to repair.\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">I had my car repaired.\u003c/span>\u003cdiv class=\"g-exp\">have + 목적어 + p.p. 구조로 '차가 수리되게 하다', 즉 '차를 수리했다'는 뜻을 만듭니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":28,"text":"세 번째 문제는 어법상 옳은 문장을 고르는 거예요. have나 get 뒤에 어떤 형태가 와야 하는지 떠올리면서 골라 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":29,"text":"","hl":"q","pause":6},{"n":30,"text":"정답은 세 번째 보기예요. have 뒤에 목적어 my car가 오고, 차는 수리되는 대상이니까 과거분사 repaired가 와야 합니다. repairing이나 repair, to repair는 모두 이 구조에 맞지 않아요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 4 / 6\u003c/span>\u003cspan class=\"g-kind\">오류 수정\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">문장에서 틀린 부분을 찾아 바르게 고치세요.\u003c/div>\u003cdiv class=\"g-qs\">He remained sit by the window.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">He remained sitting by the window.\u003c/span>\u003cdiv class=\"g-exp\">remain 뒤 주격보어 자리에는 분사가 와야 하므로 sitting으로 고칩니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":31,"text":"네 번째 문제는 오류 수정이에요. remain 뒤에 어떤 형태가 와야 하는지 생각하면서 틀린 부분을 찾아보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":32,"text":"","hl":"q","pause":6},{"n":33,"text":"정답은 sit을 sitting으로 고치는 거예요. remain은 뒤에 주격보어로 분사를 데려오는 동사라서 그가 창가에 앉아 있는 상태를 나타내려면 현재분사 sitting을 써야 합니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 5 / 6\u003c/span>\u003cspan class=\"g-kind\">배열\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">주어진 단어를 바르게 배열해 문장을 완성하세요.\u003c/div>\u003cdiv class=\"g-qs\">found / him / I / on the sofa / sleeping\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">I found him sleeping on the sofa.\u003c/span>\u003cdiv class=\"g-exp\">find + 목적어 + 현재분사 구조로, him이 직접 자는 동작을 하므로 sleeping을 씁니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":34,"text":"다섯 번째 문제는 단어 배열이에요. find 뒤에 목적어와 분사가 오는 순서를 생각하면서 문장을 만들어 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":35,"text":"","hl":"q","pause":6},{"n":36,"text":"정답은 I found him sleeping on the sofa입니다. find 뒤에 목적어 him이 오고, 그가 직접 자고 있는 동작을 하고 있으니까 현재분사 sleeping이 이어집니다. 마지막에 장소를 나타내는 on the sofa를 붙여 주면 됩니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 6 / 6\u003c/span>\u003cspan class=\"g-kind\">영작\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">'그는 영어로 자신의 말이 이해되게 했다.'를 make oneself understood를 이용해 영작하세요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">He made himself understood in English.\u003c/span>\u003cdiv class=\"g-exp\">make oneself understood는 '자신을 이해시키다'라는 표현으로, 목적어 himself가 이해되는 대상이므로 p.p. understood를 씁니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":37,"text":"마지막 문제는 영작이에요. make oneself understood 표현을 그대로 활용해서 문장을 만들어 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":38,"text":"","hl":"q","pause":6},{"n":39,"text":"정답은 He made himself understood in English입니다. make oneself understood는 자신을 이해시키다라는 뜻으로 굳어진 표현이에요. himself가 이해되는 대상이니까 과거분사 understood가 오고, in English로 어떤 언어로 이해시켰는지 덧붙여 주면 됩니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">Unit 046 분사의 쓰임 2: 보어 역할\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>분사는 주격보어와 목적격보어 자리에서 주어나 목적어를 보충 설명하는 역할을 합니다.\u003c/li>\u003cli>\u003cb class=\"key\">keep\u003c/b>, stay, \u003cb class=\"key\">sit\u003c/b>, lie, \u003cb class=\"key\">remain\u003c/b> 같은 동사 뒤에는 분사가 주격보어로 옵니다.\u003c/li>\u003cli>see, hear, feel, find, keep, leave 뒤에는 목적어와 분사가 함께 와서 \u003cb class=\"key\">목적격보어\u003c/b>를 이룹니다.\u003c/li>\u003cli>\u003cb class=\"key\">have\u003c/b> / \u003cb class=\"key\">get\u003c/b> + 목적어 + p.p.는 '~되게 하다, ~당하다'는 뜻을 만듭니다.\u003c/li>\u003cli>목적어가 동작을 하면 \u003cb class=\"key\">-ing\u003c/b>, 당하면 \u003cb class=\"key\">p.p.\u003c/b>를 쓴다는 기준 하나로 정리됩니다.\u003c/li>\u003c/ul>","segs":[{"n":40,"text":"오늘은 분사가 보어 자리에서 쓰이는 경우를 정리했어요. 주격보어는 sit이나 remain 같은 동사 뒤에서 주어를 설명해 주고, 목적격보어는 see나 find 같은 동사 뒤에서 목적어를 설명해 줍니다. 그리고 have나 get 뒤에 과거분사가 오면 목적어가 어떤 일을 당하게 된다는 뜻이 된다는 것도 기억해 주세요. 마지막 기준은 딱 하나예요. 목적어가 동작을 하면 -ing, 당하면 과거분사. 오늘 배운 예문들을 소리 내어 다시 읽으면서 마무리해 봅시다. 수고했어요, 여러분.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
