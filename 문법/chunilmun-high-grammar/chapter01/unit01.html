</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;
    if(s.pause){pause(s.pause);return;}
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){var s=segs()[j];if(!noAudio&&s&&!s.pause&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  sl.addEventListener("click",function(e){var t=e.target.closest?e.target.closest(".g-opt,[data-act]"):null;if(!t)return;
    if(t.getAttribute("data-act")==="show"){reveal("ans");return;}
    var g=t.parentNode;if(g&&g.classList.contains("rv"))return;[].forEach.call(g.querySelectorAll(".g-opt"),function(o){if(o!==t)o.classList.remove("picked");});t.classList.toggle("picked");});
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Unit 1 주어+동사 (SV)","title":"1형식 문장, 주어와 동사만으로 완성하기","audioDir":"unit01_audio","preview":false,"count":37,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">주어+동사 (SV)\u003c/div>\u003ch1>1형식 문장, 주어와 동사만으로 완성하기\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>주어와 동사만으로 완성되는 1형식 문장을 이해하고, 수식어와 There is[are] 구문의 동사 일치를 구분할 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 영어 문장의 가장 기본이 되는 주어와 동사 구조를 배워 볼 거예요. 주어와 동사만으로도 충분히 완전한 문장이 될 수 있다는 사실, 알고 있었나요? 오늘은 완전자동사와 수식어의 역할을 예문으로 차근차근 확인해 볼게요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 3\u003c/span>\u003ch2 class=\"g-h\">주어와 동사만으로 완성되는 1형식\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">1형식 문장은 \u003cb class=\"key\">주어 + 동사\u003c/b>만으로 완성되며, 동사는 목적어가 필요 없는 \u003cb class=\"key\">완전자동사\u003c/b>이다(go, arrive, happen, exist, rise, live 등). 완전자동사 뒤에 목적어를 억지로 붙이면 오히려 틀린 문장이 됩니다.\u003cdiv>\u003cspan class=\"g-formula\">주어 + 완전자동사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">The sun rises\u003c/span> in the east.\u003c/div>\u003cdiv class=\"g-ko\">해는 동쪽에서 뜬다.\u003c/div>\u003cdiv class=\"g-note\">주어 The sun 뒤에 목적어 없이 동사 rises만 와도 문장이 완성됩니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Accidents happen\u003c/span> when we are careless.\u003c/div>\u003cdiv class=\"g-ko\">부주의할 때 사고가 일어난다.\u003c/div>\u003cdiv class=\"g-note\">주어 Accidents 뒤에 완전자동사 happen이 와서 목적어 없이 문장이 완성됩니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">A bird was singing\u003c/span> outside my window.\u003c/div>\u003cdiv class=\"g-ko\">새 한 마리가 내 창문 밖에서 노래하고 있었다.\u003c/div>\u003cdiv class=\"g-note\">주어 A bird와 동사 was singing만으로 기본 문장이 완성됩니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>\u003cb class=\"key\">완전자동사\u003c/b> 뒤에는 목적어를 쓰지 않는다는 점을 기억하세요. 전치사구가 있어도 \u003cb class=\"key\">주어와 동사\u003c/b>만 찾으면 1형식인지 쉽게 판단할 수 있어요.\u003c/div>","segs":[{"n":2,"text":"먼저 주어와 동사만으로 문장이 끝나는 경우를 봅시다. 이런 문장에 쓰이는 동사를 완전자동사라고 하고, go나 arrive, happen, rise, live 같은 동사들이 대표적이에요. 완전자동사는 목적어가 필요 없기 때문에 주어 뒤에 동사만 와도 문장이 완성됩니다. 전치사구나 부사구가 있어도 그것은 뜻을 더해 주는 수식어일 뿐, 문장의 필수 요소는 아니에요.","hl":"rule"},{"n":3,"text":"The sun rises in the east. 해는 동쪽에서 뜬다는 뜻이에요. 여기서 주어는 The sun이고 동사는 rises예요. 목적어 없이도 문장이 완성된다는 점을 눈여겨보세요.","hl":"ex-0"},{"n":4,"text":"Accidents happen when we are careless. 부주의할 때 사고가 일어난다는 뜻이에요. 주어 Accidents 뒤에 동사 happen이 와서 목적어 없이 문장이 완성돼요. when we are careless는 상황을 알려 주는 수식어예요.","hl":"ex-1"},{"n":5,"text":"A bird was singing outside my window. 새 한 마리가 내 창문 밖에서 노래하고 있었다는 뜻이에요. 주어 A bird와 동사 was singing만으로 기본 문장이 완성되고, outside my window는 장소를 더해 주는 수식어예요.","hl":"ex-2"},{"n":6,"text":"완전자동사 뒤에는 목적어를 쓰지 않는다는 점을 기억하세요. 전치사구가 있어도 주어와 동사만 찾으면 일 형식인지 쉽게 판단할 수 있어요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 3\u003c/span>\u003ch2 class=\"g-h\">전치사구와 부사구는 수식어\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">전치사구와 부사구는 문장의 \u003cb class=\"key\">필수 요소\u003c/b>가 아니라 \u003cb class=\"key\">수식어\u003c/b>입니다. 예를 들어 in the east, outside my window 같은 표현은 장소나 상황을 더 자세히 설명해 줄 뿐, 주어와 동사만으로도 문장의 기본 뼈대는 완성됩니다. 따라서 1형식 문장을 판단할 때는 \u003cb class=\"key\">주어와 동사\u003c/b>를 먼저 찾으세요.\u003cdiv>\u003cspan class=\"g-formula\">주어 + 동사 + (수식어)\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The sun rises \u003cspan class=\"fx\">in the east\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">해는 동쪽에서 뜬다.\u003c/div>\u003cdiv class=\"g-note\">in the east는 장소를 더해 주는 전치사구 수식어입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">A bird was singing \u003cspan class=\"fx\">outside my window\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">새 한 마리가 내 창문 밖에서 노래하고 있었다.\u003c/div>\u003cdiv class=\"g-note\">outside my window는 장소를 나타내는 수식어입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">They live \u003cspan class=\"fx\">in Busan\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그들은 부산에 산다.\u003c/div>\u003cdiv class=\"g-note\">live는 목적어 없이 쓰이는 완전자동사이고, in Busan은 장소를 더하는 수식어입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>전치사구는 \u003cb class=\"key\">수식어\u003c/b>라서 없어도 문장의 \u003cb class=\"key\">필수 요소\u003c/b>는 아닙니다.\u003c/div>","segs":[{"n":7,"text":"이번에는 전치사구와 부사구의 역할을 살펴볼게요. in the east나 outside my window 같은 표현은 장소와 상황을 더 자세히 알려 주는 수식어예요. 그래서 이런 표현이 없어도 주어와 동사만 남아 있으면 문장의 기본 뼈대는 그대로 완성됩니다. 문장을 분석할 때는 먼저 주어와 동사를 찾고, 나머지는 수식어인지 확인해 보세요.","hl":"rule"},{"n":8,"text":"The sun rises in the east. 해는 동쪽에서 뜬다는 뜻이에요. in the east는 장소를 더해 주는 수식어이고, 없어도 The sun rises만으로 기본 문장은 완성돼요.","hl":"ex-0"},{"n":9,"text":"A bird was singing outside my window. 새 한 마리가 내 창문 밖에서 노래하고 있었다는 뜻이에요. outside my window는 장소를 더해 주는 수식어이고, A bird was singing만으로도 문장의 기본 뼈대는 완성돼요.","hl":"ex-1"},{"n":10,"text":"They live in Busan. 그들은 부산에 산다는 뜻이에요. live는 목적어 없이 쓰이는 완전자동사이고, in Busan은 장소를 더해 주는 수식어예요.","hl":"ex-2"},{"n":11,"text":"전치사구는 장소나 상황을 더해 주는 수식어예요. 그래서 전치사구가 없어도 주어와 동사만 남아 있으면 문장의 기본 뼈대는 완성된다는 점을 기억하세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 3\u003c/span>\u003ch2 class=\"g-h\">There is[are] 구문의 동사 일치\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">There is[are] ~ 구문도 1형식이며, 동사는 뒤의 \u003cb class=\"key\">주어\u003c/b>에 일치시킵니다. 뒤의 주어가 단수이면 There is를, 복수이면 There are를 씁니다. 이때 There는 '거기에'라는 뜻으로 해석합니다.\u003cdiv>\u003cspan class=\"g-formula\">There + is/are + 주어\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">There is a book\u003c/span> on the desk.\u003c/div>\u003cdiv class=\"g-ko\">책 한 권이 책상 위에 있다.\u003c/div>\u003cdiv class=\"g-note\">단수 주어 a book에 맞춰 There is를 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">There are many students\u003c/span> in the classroom.\u003c/div>\u003cdiv class=\"g-ko\">교실에 많은 학생이 있다.\u003c/div>\u003cdiv class=\"g-note\">복수 주어 many students에 맞춰 There are를 씁니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>There is와 There are 뒤의 \u003cb class=\"key\">주어\u003c/b>에 동사를 일치시키세요. 주어가 복수이면 are를 쓰는 것을 잊지 마세요.\u003c/div>","segs":[{"n":12,"text":"마지막으로 There is와 There are 구문을 배워 볼게요. 이 구문도 주어와 동사로 이루어진 일 형식 문장이에요. 중요한 점은 뒤에 오는 주어에 동사를 맞춘다는 거예요. 주어가 하나면 There is를 쓰고, 여럿이면 There are를 쓴다고 기억하면 쉬워요.","hl":"rule"},{"n":13,"text":"There is a book on the desk. 책 한 권이 책상 위에 있다는 뜻이에요. 뒤에 오는 주어 a book이 단수라서 There is를 쓴 것이죠.","hl":"ex-0"},{"n":14,"text":"There are many students in the classroom. 교실에 많은 학생이 있다는 뜻이에요. 뒤에 오는 주어 many students가 복수라서 There are를 쓴 것이에요.","hl":"ex-1"},{"n":15,"text":"There 구문에서는 뒤에 오는 주어를 먼저 확인하세요. 주어가 복수이면 There are를 쓰고, 단수이면 There is를 써야 자연스러워요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>There is many students in the classroom.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ There are many students in the classroom.\u003c/div>\u003cdiv class=\"g-why\">There 구문에서는 뒤의 주어 many students에 동사를 일치시켜야 하므로 are를 써야 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>I arrived the airport at seven.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ I arrived at the airport at seven.\u003c/div>\u003cdiv class=\"g-why\">arrive는 목적어를 바로 받지 않는 완전자동사라서 장소를 말할 때 전치사 at이 필요합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-2\">\u003cdiv class=\"g-wrong\">✗ \u003cs>The sun rises the east.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ The sun rises in the east.\u003c/div>\u003cdiv class=\"g-why\">장소를 나타내는 전치사 in이 빠져서 in the east로 써야 합니다.\u003c/div>\u003c/div>","segs":[{"n":16,"text":"첫 번째로 자주 틀리는 문장을 보죠. There is many students in the classroom이라고 쓰기 쉬운데, 뒤에 many students라는 복수 주어가 왔으므로 There are many students in the classroom이라고 해야 해요. There 구문에서는 뒤의 주어에 동사를 맞춘다는 점을 기억하세요.","hl":"mk-0"},{"n":17,"text":"두 번째로 arrive는 목적어를 바로 받지 않는 완전자동사예요. 그래서 I arrived at the airport at seven처럼 장소를 말할 때 전치사 at을 함께 써야 자연스러워요.","hl":"mk-1"},{"n":18,"text":"세 번째로 The sun rises the east라고 하면 장소를 나타내는 전치사가 빠진 문장이 돼요. 해는 동쪽에서 뜬다는 뜻으로는 The sun rises in the east라고 해야 하고, in the east는 문장을 완성하는 필수 요소라기보다 수식어라는 점도 함께 기억해요.","hl":"mk-2"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 중 주어와 동사만으로 완전한 1형식 문장인 것을 고르세요.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>The sun rises in the east.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>I bought a new phone.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>She is a teacher.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>They play soccer.\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">The sun rises in the east.\u003c/span>\u003cdiv class=\"g-exp\">The sun rises in the east.는 주어 The sun과 동사 rises로 기본 문장이 완성되는 1형식 문장입니다. in the east는 수식어입니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":19,"text":"다음 중 주어와 동사만으로 완전한 문장을 고르는 문제예요. 첫 번째 보기는 The sun rises in the east이고 두 번째 보기는 I bought a new phone이고 세 번째 보기는 She is a teacher이고 네 번째 보기는 They play soccer예요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":20,"text":"","hl":"q","pause":6},{"n":21,"text":"정답은 첫 번째 보기예요. The sun rises in the east는 해는 동쪽에서 뜬다는 뜻으로 주어 The sun과 동사 rises만으로 문장이 완성돼요. in the east는 장소를 더해 주는 수식어일 뿐이에요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 6\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">주어 Accidents에 알맞은 동사의 형태를 빈칸에 쓰세요.\u003c/div>\u003cdiv class=\"g-qs\">Accidents ____ when we are careless.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">happen\u003c/span>\u003cdiv class=\"g-exp\">Accidents는 복수 주어이므로 현재시제 동사 happen이 알맞습니다. happen은 목적어 없이 쓰이는 완전자동사입니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":22,"text":"다음 빈칸 문제예요. Accidents와 when we are careless 사이에 들어갈 동사를 주어에 맞게 생각해 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":23,"text":"","hl":"q","pause":6},{"n":24,"text":"정답은 happen이에요. Accidents는 복수 주어라서 현재시제 동사 happen이 맞고, happen은 목적어 없이 쓰이는 완전자동사예요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 3 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 문장에서 문장의 필수 요소가 아닌 수식어를 고르세요.\u003c/div>\u003cdiv class=\"g-qs\">A bird was singing outside my window.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>A bird\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>was singing\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>③\u003c/b>outside my window\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>A bird was singing\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">outside my window\u003c/span>\u003cdiv class=\"g-exp\">outside my window는 장소를 더해 주는 수식어입니다. A bird was singing만으로도 문장의 기본 뼈대가 완성됩니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":25,"text":"다음 문장에서 문장의 필수 요소가 아닌 수식어를 고르는 문제예요. A bird was singing outside my window. 첫 번째 보기는 A bird이고 두 번째 보기는 was singing이고 세 번째 보기는 outside my window이고 네 번째 보기는 A bird was singing이에요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":26,"text":"","hl":"q","pause":6},{"n":27,"text":"정답은 세 번째 보기 outside my window예요. A bird was singing만으로도 새가 노래하고 있었다는 문장이 완성되고, outside my window는 장소를 더해 주는 수식어예요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 4 / 6\u003c/span>\u003cspan class=\"g-kind\">오류 수정\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 문장에서 틀린 부분을 바르게 고쳐 쓰세요.\u003c/div>\u003cdiv class=\"g-qs\">There is many students in the classroom.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">There are many students in the classroom.\u003c/span>\u003cdiv class=\"g-exp\">There 구문에서는 뒤의 주어 many students에 동사를 일치시켜야 하므로 There are를 써야 합니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":28,"text":"다음 문장에서 틀린 부분을 바르게 고쳐 보세요. There is many students in the classroom. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":29,"text":"","hl":"q","pause":6},{"n":30,"text":"정답은 There are many students in the classroom이에요. There 구문에서는 뒤에 오는 주어 many students에 동사를 맞추므로 복수 주어에는 are를 써야 해요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 5 / 6\u003c/span>\u003cspan class=\"g-kind\">배열\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 단어를 바르게 배열하여 1형식 문장을 만드세요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">The sun rises in the east.\u003c/span>\u003cdiv class=\"g-exp\">주어 The sun 뒤에 동사 rises가 오고, 장소를 나타내는 수식어 in the east가 뒤에 붙습니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":31,"text":"다음 단어들을 바르게 배열해 완전한 문장을 만들어 보세요. rises와 The sun과 in the east를 사용하면 됩니다. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":32,"text":"","hl":"q","pause":6},{"n":33,"text":"정답은 The sun rises in the east예요. 주어 The sun 다음에 동사 rises가 오고, 장소를 나타내는 in the east가 뒤에 붙는 문장이에요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 6 / 6\u003c/span>\u003cspan class=\"g-kind\">영작\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 우리말을 주어와 동사가 있는 1형식 문장으로 영작하세요.\u003c/div>\u003cdiv class=\"g-qs\">부주의할 때 사고가 일어난다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">Accidents happen when we are careless.\u003c/span>\u003cdiv class=\"g-exp\">주어 Accidents와 동사 happen을 사용하고, when we are careless로 조건을 표현합니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":34,"text":"다음 우리말을 주어와 동사가 있는 완전한 문장으로 영작해 보세요. 부주의할 때 사고가 일어난다. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":35,"text":"","hl":"q","pause":6},{"n":36,"text":"정답은 Accidents happen when we are careless예요. 사고가 일어난다는 뜻으로 주어 Accidents와 동사 happen을 쓰고, 부주의할 때라는 조건은 when we are careless로 표현하면 됩니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">주어+동사 (SV)\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>1형식 문장은 \u003cb class=\"key\">주어\u003c/b>와 \u003cb class=\"key\">완전자동사\u003c/b>만으로 완성됩니다.\u003c/li>\u003cli>전치사구와 부사구는 \u003cb class=\"key\">수식어\u003c/b>일 뿐 \u003cb class=\"key\">필수 요소\u003c/b>가 아닙니다.\u003c/li>\u003cli>There is와 There are 뒤의 \u003cb class=\"key\">주어\u003c/b>에 동사를 일치시킵니다.\u003c/li>\u003c/ul>","segs":[{"n":37,"text":"오늘은 주어와 동사만으로 완성되는 문장을 배웠어요. 완전자동사는 목적어 없이도 문장을 완성하고, 전치사구나 부사구는 수식어라서 없어도 기본 뼈대는 남는다는 점을 기억하세요. There is나 There are를 쓸 때는 뒤에 오는 주어에 동사를 맞추는 것도 잊지 마세요. 오늘 배운 예문을 소리 내어 다시 읽어 보면 좋겠어요.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
