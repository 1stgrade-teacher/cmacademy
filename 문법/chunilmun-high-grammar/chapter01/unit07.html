  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}

}
lecturePlayer(document.getElementById("app"),{"brand":"Unit 7 주어+동사+목적어+보어 (SVOC) 2","title":"동사가 정하는 목적격보어의 얼굴 (SVOC 2)","audioDir":"unit07_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">주어+동사+목적어+보어 (SVOC) 2\u003c/div>\u003ch1>동사가 정하는 목적격보어의 얼굴 (SVOC 2)\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>목적격보어 자리에 to부정사, 동사원형, -ing, 과거분사 중 무엇이 오는지 동사 유형에 따라 구분할 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 목적어 뒤에 따라붙는 보어, 목적격보어를 공부해 볼 거예요. 같은 목적어 뒤라도 동사에 따라 to부정사가 오기도 하고, 동사원형이나 -ing가 오기도 하죠. 그리고 목적어가 어떤 일을 당하는 관계라면 과거분사를 쓴다는 것도 함께 배웁니다. 오늘 규칙 세 가지만 확실히 잡으면 SVOC 문장이 훨씬 편해질 거예요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 3\u003c/span>\u003ch2 class=\"g-h\">목적격보어로 to부정사를 쓰는 동사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">want\u003c/b>, \u003cb class=\"key\">ask\u003c/b>, \u003cb class=\"key\">allow\u003c/b>처럼 목적격보어 자리에 \u003cb class=\"key\">to부정사\u003c/b>를 데려오는 동사들이 있어요. expect, tell, advise, encourage, enable도 모두 같은 방식으로 to부정사를 씁니다. 그래서 목적어 뒤에 동사원형만 덩그러니 쓰면 틀린 문장이 됩니다.\u003cdiv>\u003cspan class=\"g-formula\">주어 + 동사(want/ask/allow/encourage...) + 목적어 + to + 동사원형\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">My parents \u003cspan class=\"fx\">allowed me to go out\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">부모님은 내가 외출하는 것을 허락하셨다.\u003c/div>\u003cdiv class=\"g-note\">allow는 목적어 뒤에 to부정사를 쓰는 대표 동사예요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">The teacher \u003cspan class=\"fx\">encouraged us to try again\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">선생님은 우리에게 다시 시도하라고 격려하셨다.\u003c/div>\u003cdiv class=\"g-note\">encourage도 목적격보어로 to부정사를 씁니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>to부정사를 쓰는 동사는 목적어 뒤에 \u003cb class=\"key\">to\u003c/b>를 빠뜨리면 바로 틀린 문장이 되니, \u003cb class=\"key\">to부정사\u003c/b>를 한 덩어리로 기억하세요.\u003c/div>","segs":[{"n":2,"text":"먼저 to부정사를 목적격보어로 데려오는 동사들을 볼게요. want, ask, allow, expect, tell, advise, encourage, enable 같은 동사들이에요. 이 동사들은 목적어 뒤에 동사원형을 그냥 쓰지 않고, 반드시 to를 붙인 to부정사를 씁니다. 그래서 목적어 다음에 to가 보이면 이 동사 가족을 떠올리시면 좋아요. to를 빠뜨리는 실수가 정말 많으니까 꼭 기억해 두세요.","hl":"rule"},{"n":3,"text":"첫 번째 예문 읽어 볼게요. My parents allowed me to go out. 부모님이 나가도 된다고 허락하셨다는 뜻이에요. allowed 다음에 목적어 me가 오고, 그 뒤에 to go out이라는 to부정사가 왔죠. 여기서 to를 빼면 문장이 틀려요.","hl":"ex-0"},{"n":4,"text":"이번 예문도 함께 볼게요. The teacher encouraged us to try again. 선생님이 우리에게 다시 해 보라고 격려하셨다는 뜻이에요. encouraged 다음에 목적어 us가 오고, 그 뒤에 to try again이 왔습니다. encourage도 to부정사를 데려오는 동사라는 것, 눈에 익혀 두세요.","hl":"ex-1"},{"n":5,"text":"주의할 점이 있어요. allow나 encourage 뒤에서 to를 빠뜨리면 뜻은 통할 것 같아도 문법적으로는 틀린 문장이 됩니다. 목적어 다음에는 꼭 to부정사가 온다고 한 덩어리로 외워 두세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 3\u003c/span>\u003ch2 class=\"g-h\">사역동사와 지각동사의 목적격보어\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">사역동사\u003c/b> make, have, let은 목적어 뒤에 \u003cb class=\"key\">동사원형\u003c/b>을 씁니다. 반면 \u003cb class=\"key\">지각동사\u003c/b> see, hear, feel은 동사원형과 -ing를 모두 쓸 수 있어요. 동사원형은 동작 전체를, -ing는 진행 중인 동작을 느끼게 합니다.\u003cdiv>\u003cspan class=\"g-formula\">make/have/let + 목적어 + 동사원형 (to 없음) / see/hear/feel + 목적어 + 동사원형 또는 -ing\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The teacher \u003cspan class=\"fx\">made us clean\u003c/span> the room.\u003c/div>\u003cdiv class=\"g-ko\">선생님은 우리에게 교실을 청소하게 하셨다.\u003c/div>\u003cdiv class=\"g-note\">사역동사 make 뒤에는 to 없이 동사원형 clean을 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">I \u003cspan class=\"fx\">heard someone knocking\u003c/span> on the door.\u003c/div>\u003cdiv class=\"g-ko\">나는 누군가 문을 두드리는 소리를 들었다.\u003c/div>\u003cdiv class=\"g-note\">지각동사 hear 뒤에는 -ing를 써서 진행 중인 동작을 나타낼 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">My mom \u003cspan class=\"fx\">let me watch\u003c/span> TV.\u003c/div>\u003cdiv class=\"g-ko\">엄마는 내가 TV를 보게 해 주셨다.\u003c/div>\u003cdiv class=\"g-note\">사역동사 let도 목적어 뒤에 동사원형을 씁니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>사역동사 뒤에는 \u003cb class=\"key\">to\u003c/b>를 붙이지 말고, 지각동사 뒤에서는 \u003cb class=\"key\">동사원형\u003c/b>과 -ing 중 의미에 맞는 것을 고르세요.\u003c/div>","segs":[{"n":6,"text":"이번에는 사역동사와 지각동사예요. 사역동사 make, have, let은 누군가에게 어떤 일을 시키거나 하게 할 때 쓰는데, 목적어 뒤에 동사원형을 그대로 씁니다. to는 절대 붙이지 않아요. 지각동사 see, hear, feel은 보고 듣고 느끼는 동사인데, 목적어 뒤에 동사원형도 되고 -ing도 됩니다. 동사원형은 동작이 처음부터 끝까지 일어난 느낌이고, -ing는 그 동작이 진행 중인 느낌이에요.","hl":"rule"},{"n":7,"text":"예문 하나 읽어 볼게요. The teacher made us clean the room. 선생님이 우리에게 교실을 청소하게 하셨다는 뜻이에요. made 다음에 목적어 us가 오고, 그 뒤에 clean이라는 동사원형이 왔죠. made us to clean이라고 하면 틀려요. to가 없어야 합니다.","hl":"ex-0"},{"n":8,"text":"두 번째 예문이에요. I heard someone knocking on the door. 나는 누군가 문을 두드리는 소리를 들었다는 뜻입니다. heard 다음에 someone이 오고, 그 뒤에 knocking이라는 -ing 형태가 왔어요. 문을 계속 두드리고 있는 상황이 그려지죠. 이 자리에 knock라고 써도 되지만, 진행 느낌을 살리고 싶으면 knocking을 씁니다.","hl":"ex-1"},{"n":9,"text":"이 예문도 볼게요. My mom let me watch TV. 엄마가 나를 TV 보게 해 주셨다는 뜻이에요. let 다음에 목적어 me가 오고, 그 뒤에 watch라는 동사원형이 왔습니다. let도 사역동사라서 to를 붙이지 않는다는 점, 꼭 기억하세요.","hl":"ex-2"},{"n":10,"text":"여기서 실수가 자주 갈리는 부분이 있어요. 사역동사 뒤에 to를 붙이면 바로 틀리고요, 지각동사 뒤에서는 동사원형과 -ing가 둘 다 가능하다는 걸 기억하세요. 뜻이 달라지니까 상황에 맞게 골라 쓰시면 됩니다.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 3\u003c/span>\u003ch2 class=\"g-h\">목적어와 수동 관계면 과거분사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">목적어가 보어의 동작을 당하는 \u003cb class=\"key\">수동\u003c/b> 관계이면 목적격보어로 \u003cb class=\"key\">과거분사\u003c/b>를 씁니다. 목적어가 동작을 직접 하는 능동 관계라면 동사원형이나 -ing를 씁니다. 즉 목적어와 보어의 관계를 먼저 따져 보는 것이 핵심입니다.\u003cdiv>\u003cspan class=\"g-formula\">목적어 + 과거분사 (목적어가 ~당하는 관계일 때)\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">I \u003cspan class=\"fx\">had my hair cut\u003c/span> yesterday.\u003c/div>\u003cdiv class=\"g-ko\">나는 어제 머리를 잘랐다.\u003c/div>\u003cdiv class=\"g-note\">머리는 자르는 것이 아니라 잘리는 대상이므로 과거분사 cut을 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">I \u003cspan class=\"fx\">found the door closed\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나는 문이 닫혀 있는 것을 발견했다.\u003c/div>\u003cdiv class=\"g-note\">문은 닫히는 대상이므로 과거분사 closed를 씁니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>목적어가 동작을 \u003cb class=\"key\">당하면\u003c/b> 과거분사, 목적어가 동작을 \u003cb class=\"key\">직접 하면\u003c/b> 동사원형이나 -ing라고 정리해 두세요.\u003c/div>","segs":[{"n":11,"text":"마지막 규칙이에요. 목적격보어 자리에 과거분사가 오는 경우인데, 기준은 아주 단순합니다. 목적어가 그 동작을 당하는 입장이면 과거분사를 쓰고, 목적어가 동작을 직접 하는 입장이면 동사원형이나 -ing를 씁니다. 예를 들어 머리는 자르는 게 아니라 잘리는 대상이니까 과거분사를 쓰는 거예요. 목적어와 보어 사이에 수동 관계가 보이면 바로 과거분사를 떠올리세요.","hl":"rule"},{"n":12,"text":"이 예문을 볼게요. I had my hair cut yesterday. 나는 어제 머리를 잘랐다는 뜻이에요. 내 머리는 자르는 사람이 아니라 잘리는 대상이죠. 그래서 had my hair cut처럼 과거분사 cut을 썼습니다. had my hair cut이 하나의 덩어리처럼 들리면 좋아요.","hl":"ex-0"},{"n":13,"text":"하나 더 볼게요. I found the door closed. 나는 문이 닫혀 있는 걸 발견했다는 뜻입니다. 문은 닫는 주체가 아니라 닫히는 대상이에요. 그래서 closed라는 과거분사가 왔습니다. 이렇게 목적어가 당하는 관계인지 늘 확인해 보세요.","hl":"ex-1"},{"n":14,"text":"정리하면 목적어가 당하는 쪽이면 과거분사, 스스로 하는 쪽이면 동사원형이나 -ing입니다. 해석해 볼 때 목적어가 무엇을 하는지, 당하는지를 먼저 확인하는 습관을 들이세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>My parents allowed me go out.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ My parents allowed me to go out.\u003c/div>\u003cdiv class=\"g-why\">allow는 목적격보어로 to부정사를 쓰므로 to를 빠뜨리면 안 됩니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>The teacher made us to clean the room.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ The teacher made us clean the room.\u003c/div>\u003cdiv class=\"g-why\">사역동사 make 뒤에는 to 없이 동사원형을 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-2\">\u003cdiv class=\"g-wrong\">✗ \u003cs>I heard someone knocked on the door.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ I heard someone knocking on the door.\u003c/div>\u003cdiv class=\"g-why\">지각동사 hear 뒤에는 동사원형이나 -ing를 쓰고 과거형은 쓰지 않습니다.\u003c/div>\u003c/div>","segs":[{"n":15,"text":"첫 번째 실수예요. My parents allowed me go out이라고 쓰면 틀립니다. allow는 목적어 뒤에 to부정사를 데려오는 동사니까요. 그래서 My parents allowed me to go out처럼 to go out으로 써야 맞아요.","hl":"mk-0"},{"n":16,"text":"두 번째 실수도 자주 나와요. The teacher made us to clean the room이라고 하면 틀립니다. make는 사역동사라서 목적어 뒤에 to 없이 동사원형을 씁니다. 그래서 The teacher made us clean the room이 맞아요.","hl":"mk-1"},{"n":17,"text":"세 번째 실수예요. I heard someone knocked on the door라고 하면 어색한 문장이 됩니다. 지각동사 hear 뒤에는 동사원형이나 -ing가 와야 해요. 그래서 I heard someone knocking on the door처럼 knocking을 쓰면 자연스럽습니다.","hl":"mk-2"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">빈칸에 들어갈 말로 알맞은 것을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\">My parents allowed me ____ out.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>to go\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>go\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>going\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>gone\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">to go\u003c/span>\u003cdiv class=\"g-exp\">allow는 목적격보어로 to부정사를 쓰는 동사이므로 to go가 맞습니다.\u003c >","segs":[{"n":30,"text":"다섯 번째 문제는 영작이에요. 선생님은 우리에게 다시 시도하라고 격려하셨다. 이 문장을 영어로 써 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":31,"text":"","hl":"q","pause":6},{"n":32,"text":"정답은 The teacher encouraged us to try again이에요. encourage는 목적어 뒤에 to부정사를 쓰는 동사죠. 그래서 목적어 us 다음에 to try again이 와야 합니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 6 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">빈칸에 들어갈 말로 알맞은 것을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\">I had my hair ____ yesterday.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>cut\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>to cut\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>cutting\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>cuts\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">cut\u003c/span>\u003cdiv class=\"g-exp\">목적어 my hair는 자르는 것이 아니라 잘리는 대상이므로 과거분사 cut을 씁니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":33,"text":"마지막 문제예요. I had my hair, 빈칸, yesterday. 빈칸에 알맞은 것을 골라 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":34,"text":"","hl":"q","pause":6},{"n":35,"text":"정답은 첫 번째 보기, cut이에요. 내 머리는 자르는 사람이 아니라 잘리는 대상이죠. 이렇게 목적어가 동작을 당하는 관계이면 과거분사를 씁니다. 그래서 I had my hair cut yesterday가 맞아요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">주어+동사+목적어+보어 (SVOC) 2\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>to부정사를 목적격보어로 쓰는 동사: \u003cb class=\"key\">want\u003c/b>, \u003cb class=\"key\">ask\u003c/b>, \u003cb class=\"key\">allow\u003c/b>, expect, tell, advise, \u003cb class=\"key\">encourage\u003c/b>\u003c/li>\u003cli>사역동사 make, have, let 뒤에는 \u003cb class=\"key\">동사원형\u003c/b>, 지각동사 see, hear, feel 뒤에는 동사원형 또는 \u003cb class=\"key\">-ing\u003c/b>\u003c/li>\u003cli>목적어가 동작을 \u003cb class=\"key\">당하면\u003c/b> 목적격보어로 \u003cb class=\"key\">과거분사\u003c/b>를 쓴다\u003c/li>\u003c/ul>","segs":[{"n":36,"text":"오늘 세 가지 규칙을 정리해 볼게요. 첫째, want나 allow, encourage처럼 to부정사를 목적격보어로 데려오는 동사들이 있었죠. 둘째, 사역동사 make, have, let 뒤에는 동사원형을 쓰고, 지각동사 see, hear, feel 뒤에는 동사원형이나 -ing를 쓴다는 것도 배웠어요. 셋째, 목적어가 동작을 당하는 관계라면 과거분사를 쓴다는 점도 기억하세요. 오늘 배운 규칙으로 문장을 직접 만들어 보면서 연습해 보면 금방 익숙해질 거예요. 수고했어요, 여러분!","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
