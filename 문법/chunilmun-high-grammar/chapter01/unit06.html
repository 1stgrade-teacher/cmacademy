  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}

  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}

}
lecturePlayer(document.getElementById("app"),{"brand":"Unit 6 주어+동사+목적어+보어 (SVOC) 1","title":"5형식 완전 정복 — 목적어를 설명하는 목적격보어","audioDir":"unit06_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">주어+동사+목적어+보어 (SVOC) 1\u003c/div>\u003ch1>5형식 완전 정복 — 목적어를 설명하는 목적격보어\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>5형식 문장에서 목적격보어 자리에 명사와 형용사가 오는 구조를 이해하고, 직접 문장을 만들 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 오늘도 함께 문장의 뼈대를 세워 볼까요? 오늘은 5형식, 주어와 동사, 목적어, 그리고 목적격보어로 이루어진 문장을 배워요. 목적어를 콕 집어 설명해 주는 자리, 바로 목적격보어가 핵심이에요. 어렵게 느껴지지 않게 예문으로 하나씩 확인해 볼 테니 편하게 따라와 주세요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 3\u003c/span>\u003ch2 class=\"g-h\">5형식의 기본 구조 — 주어, 동사, 목적어, 목적격보어\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">5형식은 \u003cb class=\"key\">주어\u003c/b> + \u003cb class=\"key\">동사\u003c/b> + \u003cb class=\"key\">목적어\u003c/b> + \u003cb class=\"key\">목적격보어\u003c/b> 구조입니다. 이때 목적어와 보어는 \u003cb class=\"key\">주어-술어 관계\u003c/b>를 이룹니다. 즉 목적격보어는 목적어의 상태나 정체를 설명해 주는 역할을 합니다.\u003cdiv>\u003cspan class=\"g-formula\">주어 + 동사 + 목적어 + 목적격보어\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">They elected \u003cspan class=\"fx\">her class president\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그들은 그녀를 반장으로 뽑았다.\u003c/div>\u003cdiv class=\"g-note\">목적어 her와 보어 class president가 '그녀는 반장이다'라는 주어-술어 관계를 이룹니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">The news made \u003cspan class=\"fx\">her happy\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그 소식은 그녀를 행복하게 만들었다.\u003c/div>\u003cdiv class=\"g-note\">목적어 her 뒤에 형용사 happy가 와서 목적어의 상태를 설명합니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>목적격보어는 목적어 바로 뒤에 붙고, 목적어와 \u003cb class=\"key\">주어-술어 관계\u003c/b>가 되는지 확인하면 5형식인지 쉽게 판단할 수 있습니다.\u003c/div>","segs":[{"n":2,"text":"먼저 5형식의 뼈대부터 볼게요. 5형식은 주어, 동사, 목적어, 그리고 목적격보어 이렇게 네 덩어리로 이루어져요. 여기서 중요한 건 목적어와 목적격보어가 주어와 술어의 관계를 이룬다는 점이에요. 목적어가 주어처럼 행동하고, 목적격보어가 그 목적어를 설명해 주는 구조라고 생각하면 쉬워요.","hl":"rule"},{"n":3,"text":"They elected her class president. 뜻은 그들은 그녀를 반장으로 뽑았다는 말이에요. 여기서 her가 목적어, class president가 목적격보어예요. 그녀는 반장이다, 라는 관계가 숨어 있다는 점을 기억해 주세요.","hl":"ex-0"},{"n":4,"text":"The news made her happy. 뜻은 그 소식은 그녀를 행복하게 만들었다는 거예요. her라는 목적어 뒤에 happy가 붙어서 그녀의 상태를 설명해 주죠. 이렇게 목적어 다음에 설명이 붙으면 5형식이에요.","hl":"ex-1"},{"n":5,"text":"판단하는 요령은 간단해요. 목적어와 그 뒤에 오는 말을 따로 떼어서 주어와 술어 관계가 되는지 확인해 보세요. 그녀는 반장이다처럼 말이 되면 5형식이 맞아요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 3\u003c/span>\u003ch2 class=\"g-h\">목적격보어에 명사·형용사를 취하는 동사들\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">목적격보어에 명사나 형용사가 오는 대표 동사로는 \u003cb class=\"key\">make\u003c/b>, \u003cb class=\"key\">elect\u003c/b>, \u003cb class=\"key\">find\u003c/b>를 비롯해 call, name, keep, consider, leave, think가 있습니다. 이 동사들은 목적어 뒤에 목적어를 설명하는 말을 반드시 데리고 옵니다. 동사별로 자주 쓰이는 보어 형태를 함께 익혀 두세요.\u003cdiv>\u003cspan class=\"g-formula\">make / call / name / elect / keep / find / consider / leave / think + 목적어 + 명사·형용사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">This music \u003cspan class=\"fx\">makes me relaxed\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">이 음악은 나를 편안하게 해 준다.\u003c/div>\u003cdiv class=\"g-note\">make + 목적어 + 형용사 구조로, relaxed가 목적어 me의 상태를 설명합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">I \u003cspan class=\"fx\">found the movie boring\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나는 그 영화가 지루하다고 생각했다.\u003c/div>\u003cdiv class=\"g-note\">find + 목적어 + 형용사 구조로, boring이 영화의 성격을 설명합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">They \u003cspan class=\"fx\">named the baby Tom\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그들은 그 아기 이름을 톰이라고 지었다.\u003c/div>\u003cdiv class=\"g-note\">name + 목적어 + 명사 구조로, Tom이 목적어 the baby의 정체를 밝혀 줍니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>동사마다 자주 쓰는 보어 형태가 다르므로 \u003cb class=\"key\">make\u003c/b>, \u003cb class=\"key\">find\u003c/b> 같은 대표 동사는 예문과 함께 통째로 익혀 두세요.\u003c/div>","segs":[{"n":6,"text":"이제 이런 문장을 만드는 동사들을 살펴볼게요. make, call, name, elect, keep, find, consider, leave, think 같은 동사들이 목적어 뒤에 명사나 형용사를 데리고 와요. 이 동사들은 목적어만으로는 말이 끝나지 않고, 목적어를 설명하는 말이 꼭 필요해요. 그래서 동사와 함께 통째로 익혀 두면 훨씬 편해요.","hl":"rule"},{"n":7,"text":"This music makes me relaxed. 뜻은 이 음악은 나를 편안하게 해 준다는 말이에요. makes 다음에 목적어 me가 오고, 그 뒤에 relaxed가 와서 내 상태를 설명해 줘요. make는 목적어 뒤에 형용사를 데리고 오는 대표 동사예요.","hl":"ex-0"},{"n":8,"text":"I found the movie boring. 뜻은 나는 그 영화가 지루하다고 생각했다는 거예요. found 다음에 목적어 the movie가 오고, boring이 그 영화를 설명해 주죠. find는 이렇게 목적어 뒤에 형용사를 붙여서 생각이나 판단을 나타내요.","hl":"ex-1"},{"n":9,"text":"They named the baby Tom. 뜻은 그들은 그 아기 이름을 톰이라고 지었다는 말이에요. named 다음에 목적어 the baby가 오고, 이름을 나타내는 명사 Tom이 목적격보어로 붙었어요. 이번엔 형용사가 아니라 명사가 온 경우예요.","hl":"ex-2"},{"n":10,"text":"동사 하나하나를 따로 외우기보다는, 자주 쓰는 예문을 통째로 기억하는 게 좋아요. make는 형용사와 자주 붙고, name이나 elect는 명사와 자주 붙는다는 느낌을 가져 가면 돼요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 3\u003c/span>\u003ch2 class=\"g-h\">보어 자리에는 형용사, 부사는 안 됩니다\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">목적격보어 자리에는 \u003cb class=\"key\">형용사\u003c/b>를 쓰고 \u003cb class=\"key\">부사\u003c/b>는 쓸 수 없습니다. 목적어의 상태를 설명하는 자리이기 때문입니다. 사람의 기분을 나타낼 때도 부사가 아니라 형용사를 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">목적어 + 형용사 (부사 X)\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">The test \u003cspan class=\"fx\">made me nervous\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그 시험은 나를 긴장하게 만들었다.\u003c/div>\u003cdiv class=\"g-note\">부사 nervously가 아니라 형용사 nervous가 목적격보어로 왔습니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">We should \u003cspan class=\"fx\">keep the room clean\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">우리는 방을 깨끗하게 유지해야 한다.\u003c/div>\u003cdiv class=\"g-note\">keep + 목적어 + 형용사 구조로, clean이 방의 상태를 설명합니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>목적어 뒤에 \u003cb class=\"key\">부사\u003c/b>가 오면 틀린 문장이 되니, 보어 자리에는 반드시 \u003cb class=\"key\">형용사\u003c/b>가 왔는지 확인하세요.\u003c/div>","segs":[{"n":11,"text":"마지막으로 아주 중요한 주의점이에요. 목적격보어 자리에는 형용사를 쓰고, 부사는 쓸 수 없어요. 왜냐하면 이 자리는 목적어의 상태를 설명하는 자리이기 때문이죠. 그래서 그녀를 행복하게, 라고 할 때도 부사가 아니라 형용사를 써야 해요.","hl":"rule"},{"n":12,"text":"The test made me nervous. 뜻은 그 시험은 나를 긴장하게 만들었다는 말이에요. 여기서 nervously라는 부사가 아니라 nervous라는 형용사가 왔다는 점을 꼭 봐 주세요. 목적어 me의 상태를 설명하는 자리니까요.","hl":"ex-0"},{"n":13,"text":"We should keep the room clean. 뜻은 우리는 방을 깨끗하게 유지해야 한다는 거예요. keep 다음에 목적어 the room이 오고, 형용사 clean이 그 상태를 설명해 줘요. 깨끗하게라고 해서 부사를 쓰면 안 된다는 것, 기억해 주세요.","hl":"ex-1"},{"n":14,"text":"시험에서 가장 많이 나오는 함정이 바로 이 부분이에요. 목적어 뒤에 부사가 보이면 일단 의심해 보세요. 상태를 설명하는 자리에는 형용사가 와야 한다는 것, 잊지 마세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>The news made me happily.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ The news made me happy.\u003c/div>\u003cdiv class=\"g-why\">목적격보어 자리에는 부사가 아니라 목적어의 상태를 나타내는 형용사가 와야 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>They elected class president her.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ They elected her class president.\u003c/div>\u003cdiv class=\"g-why\">5형식은 목적어가 먼저 오고 목적격보어가 뒤에 오는 어순을 지켜야 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-2\">\u003cdiv class=\"g-wrong\">✗ \u003cs>I found the movie bored.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ I found the movie boring.\u003c/div>\u003cdiv class=\"g-why\">영화가 지루함을 유발하는 대상이므로 감정을 유발하는 형태인 boring을 써야 합니다.\u003c/div>\u003c/div>","segs":[{"n":15,"text":"The news made me happily는 틀린 문장이에요. 내 상태를 설명하는 자리인데 부사 happily를 썼기 때문이죠. 이때는 형용사 happy로 고쳐서 The news made me happy라고 해야 맞아요.","hl":"mk-0"},{"n":16,"text":"They elected class president her는 어순이 뒤집힌 문장이에요. 5형식에서는 목적어가 먼저 오고 목적격보어가 뒤따라야 하죠. 그래서 They elected her class president라고 써야 맞아요.","hl":"mk-1"},{"n":17,"text":"I found the movie bored는 어색한 문장이에요. 영화는 지루함을 주는 쪽이니까 boring을 써야 하죠. 그래서 I found the movie boring이라고 해야 자연스러워요.","hl":"mk-2"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 빈칸에 들어갈 말로 가장 알맞은 것을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\">The news made her ____.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>happily\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>happy\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>happiness\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>happen\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">happy\u003c/span>\u003cdiv class=\"g-exp\">make는 목적어 뒤에 목적격보어로 형용사를 취하는 동사입니다. 부사 happily는 이 자리에 올 수 없습니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":18,"text":"첫 번째 문제예요. The news made her, 뒤에 빈칸이 있네요. 보기 중에서 가장 알맞은 말을 골라 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":19,"text":"","hl":"q","pause":6},{"n":20,"text":"정답은 두 번째 보기인 happy예요. 목적격보어 자리에는 그녀의 상태를 설명하는 형용사가 와야 하거든요. 부사 happily는 이 자리에 쓸 수 없어요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 중 목적격보어를 취하는 5형식 동사가 아닌 것을 고르세요.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>make\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>call\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>consider\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>④\u003c/b>arrive\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">arrive\u003c/span>\u003cdiv class=\"g-exp\">arrive는 목적어를 취하지 않는 자동사이므로 5형식 동사가 아닙니다. make, call, consider는 목적격보어를 취합니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":21,"text":"두 번째 문제는 동사 찾기예요. 목적격보어를 데리고 오는 동사가 아닌 것을 골라 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":22,"text":"","hl":"q","pause":6},{"n":23,"text":"정답은 네 번째 보기인 arrive예요. arrive는 목적어를 취하지 않는 동사라서 목적격보어를 데리고 올 수 없어요. 나머지 세 동사는 모두 목적어 뒤에 보어를 붙이는 동사들이죠.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 3 / 6\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">괄호 안의 우리말에 맞게 빈칸을 채우세요. (편안하게)\u003c/div>\u003cdiv class=\"g-qs\">This music makes me ____.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">relaxed\u003c/span>\u003cdiv class=\"g-exp\">make + 목적어 + 형용사 구조이므로 목적어 me 뒤에 형용사 relaxed가 옵니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":24,"text":"세 번째 문제는 빈칸 채우기예요. 이 음악은 나를 편안하게 해 준다, 라는 뜻이 되도록 빈칸을 채워 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":25,"text":"","hl":"q","pause":6},{"n":26,"text":"정답은 relaxed예요. make 다음에 목적어 me가 오고, 그 뒤에 형용사 relaxed가 와서 내 상태를 설명해 주죠. 편안하게라고 해서 부사를 쓰면 안 된다는 점도 함께 기억해 주세요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 4 / 6\u003c/span>\u003cspan class=\"g-kind\">오류 수정\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 문장에서 틀린 부분을 찾아 바르게 고치세요.\u003c/div>\u003cdiv class=\"g-qs\">I found the movie bored.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">I found the movie boring.\u003c/span>\u003cdiv class=\"g-exp\">영화가 지루함을 유발하는 대상이므로 boring을 써야 합니다. 목적격보어 자리의 형용사 형태를 확인해야 합니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":27,"text":"네 번째 문제는 틀린 부분을 고치는 문제예요. I found the movie bored, 어디가 어색한지 찾아보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":28,"text":"","hl":"q","pause":6},{"n":29,"text":"정답은 I found the movie boring이에요. 영화는 지루함을 주는 쪽이니까 boring을 써야 자연스러워요. 목적격보어 자리에 알맞은 형용사가 왔는지 늘 확인해 주세요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 5 / 6\u003c/span>\u003cspan class=\"g-kind\">배열\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">주어진 단어를 모두 사용해 우리말 뜻이 되도록 문장을 완성하세요.\u003c/div>\u003cdiv class=\"g-qs\">They / named / the baby / Tom\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">They named the baby Tom.\u003c/span>\u003cdiv class=\"g-exp\">5형식 어순은 주어, 동사, 목적어, 목적격보어 순서입니다. 목적어 the baby 뒤에 명사 Tom이 목적격보어로 옵니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":30,"text":"다섯 번째 문제는 단어 배열이에요. 그들은 그 아기 이름을 톰이라고 지었다, 라는 뜻이 되도록 순서를 맞춰 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":31,"text":"","hl":"q","pause":6},{"n":32,"text":"정답은 They named the baby Tom이에요. 동사 named 다음에 목적어 the baby가 오고, 이름을 나타내는 명사 Tom이 목적격보어로 뒤에 붙죠. 목적어가 먼저, 보어가 나중이라는 순서를 기억해 주세요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 6 / 6\u003c/span>\u003cspan class=\"g-kind\">영작\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 우리말을 5형식 문장으로 영작하세요.\u003c/div>\u003cdiv class=\"g-qs\">그 소식은 그녀를 행복하게 만들었다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">The news made her happy.\u003c/span>\u003cdiv class=\"g-exp\">make + 목적어 + 형용사 구조를 사용합니다. 목적격보어 자리에는 부사가 아니라 형용사 happy가 옵니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":33,"text":"마지막 문제는 영작이에요. 그 소식은 그녀를 행복하게 만들었다, 를 5형식 문장으로 만들어 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":34,"text":"","hl":"q","pause":6},{"n":35,"text":"정답은 The news made her happy예요. make 다음에 목적어 her가 오고, 형용사 happy가 목적격보어로 붙었죠. 이때 happily라는 부사를 쓰면 안 된다는 점도 꼭 기억해 주세요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">주어+동사+목적어+보어 (SVOC) 1\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>5형식은 \u003cb class=\"key\">주어\u003c/b> + \u003cb class=\"key\">동사\u003c/b> + \u003cb class=\"key\">목적어\u003c/b> + \u003cb class=\"key\">목적격보어\u003c/b> 구조이며, 목적어와 보어는 \u003cb class=\"key\">주어-술어 관계\u003c/b>를 이룹니다.\u003c/li>\u003cli>\u003cb class=\"key\">make\u003c/b>, \u003cb class=\"key\">elect\u003c/b>, \u003cb class=\"key\">find\u003c/b> 같은 동사는 목적어 뒤에 명사나 형용사를 목적격보어로 데리고 옵니다.\u003c/li>\u003cli>목적격보어 자리에는 \u003cb class=\"key\">형용사\u003c/b>를 쓰고 \u003cb class=\"key\">부사\u003c/b>는 쓸 수 없습니다.\u003c/li>\u003c/ul>","segs":[{"n":36,"text":"오늘은 5형식 문장을 배웠어요. 주어와 동사, 목적어, 그리고 목적격보어가 한 팀을 이루고, 목적어와 보어가 주어와 술어의 관계를 이룬다는 점이 핵심이었죠. make, elect, find 같은 동사들이 목적어 뒤에 명사나 형용사를 데리고 온다는 것도 기억해 주세요. 그리고 보어 자리에는 형용사를 쓰고 부사는 쓰지 않는다는 점, 꼭 챙겨 가시길 바라요. 오늘도 수고 많았고, 다음 시간에 또 만나요.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
