  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}

}
lecturePlayer(document.getElementById("app"),{"brand":"Unit 15 SVOO 문형의 수동태","title":"목적어가 두 개일 때 수동태, 두 가지 길이 있어요","audioDir":"unit15_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">Unit 015 SVOO 문형의 수동태\u003c/div>\u003ch1>목적어가 두 개일 때 수동태, 두 가지 길이 있어요\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>4형식 SVOO 문장을 간접목적어 주어와 직접목적어 주어의 두 가지 수동태로 바꾸고, 알맞은 전치사를 쓸 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 목적어가 두 개 있는 문장을 수동태로 바꾸는 방법을 배워 볼게요. 같은 문장도 어떤 목적어를 주어로 선택하느냐에 따라 수동태가 달라진다는 점이 아주 중요해요. 예문을 통해 두 가지 방법을 차근차근 익혀 봅시다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 3\u003c/span>\u003ch2 class=\"g-h\">4형식 문장은 수동태로 두 가지 변신이 가능해요\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">4형식 문장은 \u003cb class=\"key\">간접목적어\u003c/b>나 \u003cb class=\"key\">직접목적어\u003c/b>를 주어로 하는 \u003cb class=\"key\">두 가지 수동태\u003c/b>가 가능하다. 즉, 사람 목적어를 주어로 할 수도 있고 사물 목적어를 주어로 할 수도 있다.\u003cdiv>\u003cspan class=\"g-formula\">S + V + IO + DO → IO + be p.p. + DO / DO + be p.p. + prep. + IO\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">She \u003cspan class=\"fx\">was given a prize\u003c/span> by the judge.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 심사위원에게 상을 받았다.\u003c/div>\u003cdiv class=\"g-note\">간접목적어 She가 주어로 나온 수동태예요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">A prize \u003cspan class=\"fx\">was given to her\u003c/span> by the judge.\u003c/div>\u003cdiv class=\"g-ko\">상이 심사위원에 의해 그녀에게 주어졌다.\u003c/div>\u003cdiv class=\"g-note\">직접목적어 A prize가 주어로 나온 수동태예요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>두 수동태 모두 가능하지만 문맥에서 더 자연스러운 쪽을 골라요. 특히 \u003cb class=\"key\">직접목적어\u003c/b>를 주어로 할 때 \u003cb class=\"key\">전치사\u003c/b>를 빠뜨리지 마세요.\u003c/div>","segs":[{"n":2,"text":"목적어가 두 개 있는 문장은 수동태로 바꿀 때 선택지가 두 개예요. 간접목적어를 주어로 세우는 방법과 직접목적어를 주어로 세우는 방법이 있죠. 예를 들어 사람 목적어를 주어로 하면 그 사람이 무엇을 받았는지에 초점이 가고, 사물 목적어를 주어로 하면 그 사물이 누구에게 갔는지에 초점이 갑니다. 두 방법 모두 문법적으로 가능하지만 뒤에 오는 형태가 달라진다는 점을 꼭 기억해 주세요.","hl":"rule"},{"n":3,"text":"She was given a prize by the judge. 이 문장은 그녀는 심사위원에게 상을 받았다는 뜻이에요. 여기서는 간접목적어인 she가 주어로 올라갔고, 직접목적어 a prize는 동사 뒤에 남아 있어요.","hl":"ex-0"},{"n":4,"text":"A prize was given to her by the judge. 이 문장은 상이 심사위원에 의해 그녀에게 주어졌다는 뜻이에요. 직접목적어인 A prize가 주어로 나왔고, 간접목적어 her 앞에는 to가 붙었죠. 같은 상황을 직접목적어 중심으로 표현한 문장이에요.","hl":"ex-1"},{"n":5,"text":"두 문장 모두 문법적으로 가능하지만, 무엇을 강조하고 싶은지에 따라 자연스러운 표현이 달라져요. 특히 직접목적어를 주어로 할 때는 전치사를 꼭 확인해 주세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 3\u003c/span>\u003ch2 class=\"g-h\">직접목적어를 주어로 하면 전치사가 필요해요\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">직접목적어\u003c/b>를 주어로 할 때는 간접목적어 앞에 \u003cb class=\"key\">to, for, of\u003c/b> 같은 \u003cb class=\"key\">전치사\u003c/b>를 붙인다. 이때 간접목적어를 그냥 쓰면 비문이 되기 쉽다.\u003cdiv>\u003cspan class=\"g-formula\">DO + be p.p. + to/for/of + IO (+ by + agent)\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">A prize \u003cspan class=\"fx\">was given to her\u003c/span> by the judge.\u003c/div>\u003cdiv class=\"g-ko\">상이 심사위원에 의해 그녀에게 주어졌다.\u003c/div>\u003cdiv class=\"g-note\">give는 직접목적어 주어일 때 간접목적어 앞에 to를 써요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">The book \u003cspan class=\"fx\">was bought for me\u003c/span> by my aunt.\u003c/div>\u003cdiv class=\"g-ko\">그 책은 이모가 나에게 사 주신 것이다.\u003c/div>\u003cdiv class=\"g-note\">buy는 직접목적어 주어일 때 간접목적어 앞에 for를 써요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">A question \u003cspan class=\"fx\">was asked of him\u003c/span> by the teacher.\u003c/div>\u003cdiv class=\"g-ko\">그에게 선생님이 질문을 하셨다.\u003c/div>\u003cdiv class=\"g-note\">ask는 직접목적어 주어일 때 간접목적어 앞에 of를 쓸 수 있어요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>전치사는 동사에 따라 달라요. give, send, show는 \u003cb class=\"key\">to\u003c/b>, buy, make, cook은 \u003cb class=\"key\">for\u003c/b>, ask는 \u003cb class=\"key\">of\u003c/b>를 자주 써요.\u003c/div>","segs":[{"n":6,"text":"직접목적어를 주어로 세울 때는 간접목적어를 그냥 쓰면 안 되고 앞에 전치사를 붙여요. 주로 to, for, of를 쓰는데 동사에 따라 알맞은 전치사를 골라야 해요. 두 번째 예문을 보면 A prize was given to her by the judge.라고 해서 to her가 되었죠. The book was bought for me by my aunt.에서는 for me를 써서 나에게 사 주신 책이라는 뜻을 자연스럽게 만들어요.","hl":"rule"},{"n":7,"text":"A prize was given to her by the judge. 이 문장은 상이 심사위원에 의해 그녀에게 주어졌다는 뜻이에요. 직접목적어 A prize가 주어로 나왔기 때문에 간접목적어 her 앞에 to를 붙였죠. to her를 한 덩어리로 기억해 두세요.","hl":"ex-0"},{"n":8,"text":"The book was bought for me by my aunt. 이 문장은 그 책은 이모가 나에게 사 주신 것이라는 뜻이에요. 직접목적어 the book이 주어로 나왔고, 간접목적어 me 앞에 for가 붙었죠. buy는 나에게 사 주다처럼 for를 쓰는 동사라는 점을 기억해 주세요.","hl":"ex-1"},{"n":9,"text":"A question was asked of him by the teacher. 이 문장은 그에게 선생님이 질문을 하셨다는 뜻이에요. ask는 직접목적어를 주어로 할 때 간접목적어 앞에 of를 쓰는 경우가 있어요. 전치사 of도 함께 기억해 두세요.","hl":"ex-2"},{"n":10,"text":"전치사는 아무거나 쓰면 안 되고 동사와 함께 익혀야 해요. give나 send는 to, buy나 make는 for, ask는 of가 자연스럽다는 점을 기억해 주세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 3\u003c/span>\u003ch2 class=\"g-h\">buy, make, cook, get은 간접목적어 주어가 어색할 수 있어요\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">buy, make, cook, get 등은 \u003cb class=\"key\">간접목적어\u003c/b>를 주어로 하는 수동태가 \u003cb class=\"key\">어색\u003c/b>할 수 있다. 이때는 직접목적어를 주어로 하고 간접목적어 앞에 for를 쓰는 편이 자연스럽다.\u003cdiv>\u003cspan class=\"g-formula\">buy/make/cook/get + IO + DO → DO + be p.p. + for + IO\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The book \u003cspan class=\"fx\">was bought for me\u003c/span> by my aunt.\u003c/div>\u003cdiv class=\"g-ko\">그 책은 이모가 나에게 사 주신 것이다.\u003c/div>\u003cdiv class=\"g-note\">buy는 간접목적어를 주어로 하기보다 직접목적어 주어와 for를 쓰는 편이 자연스러워요.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">A cake \u003cspan class=\"fx\">was made for her\u003c/span> by him.\u003c/div>\u003cdiv class=\"g-ko\">그 케이크는 그가 그녀를 위해 만들어 준 것이었다.\u003c/div>\u003cdiv class=\"g-note\">make도 직접목적어 주어와 for를 쓰는 형태가 자연스러워요.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>buy, make, cook, get은 간접목적어를 주어로 두면 어색하므로 \u003cb class=\"key\">직접목적어\u003c/b>를 주어로 하고 \u003cb class=\"key\">for\u003c/b>를 쓰는 표현이 자연스러워요.\u003c/div>","segs":[{"n":11,"text":"buy, make, cook, get 같은 동사는 간접목적어를 주어로 세우면 어색하게 들릴 수 있어요. 예를 들어 나는 이모에게 책을 샀다는 뜻을 I was bought a book by my aunt.라고 하면 자연스럽지 않죠. 이럴 때는 직접목적어를 주어로 세우고 for를 붙여 A book was bought for me by my aunt.라고 표현하는 편이 좋아요. 동사마다 어떤 전치사를 쓰는지 함께 익혀 두면 훨씬 안전합니다.","hl":"rule"},{"n":12,"text":"The book was bought for me by my aunt. 이 문장은 그 책은 이모가 나에게 사 주신 것이라는 뜻이에요. buy는 간접목적어를 주어로 두기보다 직접목적어를 주어로 하고 for를 쓰는 편이 자연스러워요. 그래서 the book이 주어로 나온 이 문장이 안정적이에요.","hl":"ex-0"},{"n":13,"text":"A cake was made for her by him. 이 문장은 그 케이크는 그가 그녀를 위해 만들어 준 것이었다는 뜻이에요. make도 간접목적어를 주어로 하기보다 직접목적어를 주어로 하고 for를 쓰는 편이 자연스러워요.","hl":"ex-1"},{"n":14,"text":"buy나 make, cook, get은 간접목적어를 주어로 두면 어색하게 들릴 수 있어요. 그럴 때는 직접목적어를 주어로 하고 for를 붙이는 표현을 떠올려 주세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>A prize was given her by the judge.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ A prize was given to her by the judge.\u003c/div>\u003cdiv class=\"g-why\">직접목적어를 주어로 했으므로 간접목적어 her 앞에 전치사 to가 필요해요.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>The book was bought me by my aunt.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ The book was bought for me by my aunt.\u003c/div>\u003cdiv class=\"g-why\">buy는
