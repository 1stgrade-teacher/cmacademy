  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;
    if(s.pause){pause(s.pause);return;}
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};

  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}

    var g=t.parentNode;if(g&&g.classList.contains("rv"))return;[].forEach.call(g.querySelectorAll(".g-opt"),function(o){if(o!==t)o.classList.remove("picked");});t.classList.toggle("picked");});
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};

lecturePlayer(document.getElementById("app"),{"brand":"Unit 73 소유격 관계대명사","title":"whose와 of which로 소유 관계 완벽 정리","audioDir":"unit73_audio","preview":false,"count":35,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">Unit 073 소유격 관계대명사\u003c/div>\u003ch1>whose와 of which로 소유 관계 완벽 정리\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>소유격 관계대명사 whose와 of which의 쓰임과 어순을 이해하고 문장을 완성할 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 관계대명사 중에서도 소유격을 나타내는 whose를 배워 볼 거예요. 사람이나 사물이 무엇을 소유하는지 이어 줄 때 아주 자주 쓰이는 표현이죠. whose 뒤에는 반드시 명사가 온다는 점을 중심으로, 사물에 쓰는 of which 어순까지 함께 정리해 봅시다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 3\u003c/span>\u003ch2 class=\"g-h\">whose + 명사로 소유 관계 나타내기\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">소유격 관계대명사 \u003cb class=\"key\">whose\u003c/b>는 사람과 사물 모두에 쓰이며 뒤에 \u003cb class=\"key\">명사\u003c/b>를 동반합니다. 즉 whose 뒤에는 항상 '누구의 무엇'에 해당하는 명사가 와서 소유 관계를 분명히 보여 줍니다.\u003cdiv>\u003cspan class=\"g-formula\">선행사 + whose + 명사 + 동사 ~\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I know a girl \u003cspan class=\"fx\">whose father\u003c/span> is a pilot.\u003c/div>\u003cdiv class=\"g-ko\">나는 아버지가 조종사인 소녀를 안다.\u003c/div>\u003cdiv class=\"g-note\">선행사 a girl과 father의 소유 관계를 whose father로 나타냈습니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">She has a dog \u003cspan class=\"fx\">whose tail\u003c/span> is short.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 꼬리가 짧은 개를 키운다.\u003c/div>\u003cdiv class=\"g-note\">사물인 dog에도 whose를 써서 tail의 소유 관계를 나타냅니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>whose 뒤에 명사가 없으면 문장이 성립하지 않으므로 \u003cb class=\"key\">whose + 명사\u003c/b> 덩어리를 한 단위로 익혀 두세요.\u003c/div>","segs":[{"n":2,"text":"소유격 관계대명사 whose는 앞에 나온 사람이나 사물이 무엇을 가지고 있는지, 즉 소유 관계를 이어 줄 때 씁니다. 사람에도 쓰고 사물에도 쓸 수 있다는 점이 중요해요. 그리고 whose 뒤에는 반드시 명사가 와야 합니다. whose만 단독으로 쓰이지 않는다는 점을 꼭 기억해 주세요.","hl":"rule"},{"n":3,"text":"첫 번째 예문은 I know a girl whose father is a pilot.입니다. 나는 아버지가 조종사인 소녀를 안다는 뜻이에요. a girl과 father의 소유 관계를 whose father로 연결했고, whose 뒤에 father라는 명사가 왔다는 점을 확인해 주세요.","hl":"ex-0"},{"n":4,"text":"두 번째 예문은 She has a dog whose tail is short.입니다. 그녀는 꼬리가 짧은 개를 키운다는 뜻이죠. 사람뿐 아니라 개처럼 사물에도 whose를 쓸 수 있고, whose 뒤에 tail이라는 명사가 온다는 점이 핵심이에요.","hl":"ex-1"},{"n":5,"text":"whose 뒤에 명사가 빠지면 소유 관계가 제대로 드러나지 않아요. 그러니까 whose와 바로 뒤의 명사를 한 덩어리로 기억해 두면 좋습니다.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 3\u003c/span>\u003ch2 class=\"g-h\">사물의 소유 관계: of which의 두 가지 어순\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">사물의 경우 \u003cb class=\"key\">whose\u003c/b> 대신 \u003cb class=\"key\">of which\u003c/b>를 쓸 수 있습니다. 이때 [명사 + of which] 또는 [of which + the + 명사] 어순으로 표현합니다.\u003cdiv>\u003cspan class=\"g-formula\">[명사 + of which + 주어 + 동사] / [of which + the + 명사 + 주어 + 동사]\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">The house \u003cspan class=\"fx\">the roof of which\u003c/span> is red is mine.\u003c/div>\u003cdiv class=\"g-ko\">지붕이 빨간 집이 내 집이다.\u003c/div>\u003cdiv class=\"g-note\">사물 house를 [명사 + of which] 어순으로 나타낸 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">The house \u003cspan class=\"fx\">of which the roof\u003c/span> is red is mine.\u003c/div>\u003cdiv class=\"g-ko\">지붕이 빨간 집이 내 집이다.\u003c/div>\u003cdiv class=\"g-note\">[of which + the + 명사] 어순으로 쓴 표현입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>of which는 사물에 주로 쓰며, [명사 + of which]와 [of which + the + 명사]의 \u003cb class=\"key\">어순\u003c/b>을 바꿔 쓰지 않도록 주의하세요.\u003c/div>","segs":[{"n":6,"text":"사물의 소유 관계는 whose로도 표현할 수 있지만, of which를 이용해 조금 더 격식 있게 표현할 수도 있어요. 이때 어순이 중요한데, 명사를 먼저 두고 of which를 붙이는 방식이 있고, of which 뒤에 the와 명사를 두는 방식이 있습니다. 두 어순을 모두 눈에 익혀 두면 문장을 바꿔 쓰기 쉬워져요.","hl":"rule"},{"n":7,"text":"여기서는 사물의 소유 관계를 of which로 바꿔 볼게요. The house the roof of which is red is mine.은 지붕이 빨간 집이 내 집이다라는 뜻이에요. the roof of which처럼 명사 뒤에 of which를 붙이는 어순을 기억해 주세요.","hl":"ex-0"},{"n":8,"text":"이번에는 같은 뜻을 The house of which the roof is red is mine.처럼 표현할 수 있어요. of which 뒤에 the roof를 두는 어순이죠. 두 문장 모두 사물의 소유 관계를 나타내지만 of which와 명사의 위치가 다르다는 점을 비교해 보세요.","hl":"ex-1"},{"n":9,"text":"of which를 쓸 때는 명사와 of which의 위치가 바뀌면 어색해져요. 두 가지 어순을 각각 하나의 틀로 기억해 두세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 3\u003c/span>\u003ch2 class=\"g-h\">whose가 이끄는 절은 완전한 절\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">whose\u003c/b>가 이끄는 절은 \u003cb class=\"key\">완전한 절\u003c/b>입니다. whose + 명사가 주어 역할을 하므로 뒤에는 동사가 오고, 절에 필요한 성분이 빠지지 않습니다.\u003cdiv>\u003cspan class=\"g-formula\">선행사 + whose + 명사 + 동사 ~ (완전한 절)\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The house \u003cspan class=\"fx\">whose roof is red\u003c/span> is mine.\u003c/div>\u003cdiv class=\"g-ko\">지붕이 빨간 집이 내 집이다.\u003c/div>\u003cdiv class=\"g-note\">whose roof가 주어, is red가 동사와 보어인 완전한 절입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">I have a friend \u003cspan class=\"fx\">whose brother studies English\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나는 남동생이 영어를 공부하는 친구가 있다.\u003c/div>\u003cdiv class=\"g-note\">whose brother가 주어, studies English가 동사와 목적어인 완전한 절입니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>whose 절 안에서 \u003cb class=\"key\">주어\u003c/b>와 \u003cb class=\"key\">동사\u003c/b>가 모두 있는지 확인하고, 동사 뒤에 필요한 목적어나 보어가 빠지지 않았는지 점검하세요.\u003c/div>","segs":[{"n":10,"text":"whose가 이끄는 절은 불완전한 절이 아니라 완전한 절이라는 점도 중요해요. whose 뒤의 명사가 주어 역할을 하면 그 뒤에 동사가 오고, 목적어
