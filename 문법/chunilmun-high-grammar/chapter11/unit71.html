    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);

}
lecturePlayer(document.getElementById("app"),{"brand":"Unit 71 주격 관계대명사","title":"주격 관계대명사 who, which, that 완전 정복","audioDir":"unit71_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">Unit 071 주격 관계대명사\u003c/div>\u003ch1>주격 관계대명사 who, which, that 완전 정복\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>주격 관계대명사 who, which, that의 역할을 이해하고, 관계절 동사를 선행사의 수에 맞게 쓸 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘도 만나서 반가워요. 오늘은 관계사 단원에서 아주 중요한 주격 관계대명사를 배워 볼 거예요. who, which, that이 문장에서 어떤 역할을 하는지, 그리고 뒤에 오는 동사를 어떻게 써야 하는지 차근차근 정리해 봅시다. 예문을 함께 읽으면서 감을 잡으면 생각보다 어렵지 않을 거예요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 3\u003c/span>\u003ch2 class=\"g-h\">관계대명사 who, which, that의 역할\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">관계대명사 \u003cb class=\"key\">who\u003c/b>는 사람을, \u003cb class=\"key\">which\u003c/b>는 사물을, \u003cb class=\"key\">that\u003c/b>은 사람과 사물 모두를 가리킵니다. 이들은 접속사와 대명사 역할을 동시에 하며, 앞에 있는 \u003cb class=\"key\">선행사\u003c/b>를 수식하는 관계절을 이끕니다.\u003cdiv>\u003cspan class=\"g-formula\">선행사 + who/which/that + (관계절의) 동사 ~\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The man \u003cspan class=\"fx\">who lives next door\u003c/span> is a doctor.\u003c/div>\u003cdiv class=\"g-ko\">옆집에 사는 남자는 의사이다.\u003c/div>\u003cdiv class=\"g-note\">who가 사람 선행사 the man을 꾸며 주는 관계절을 이끕니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">I read a book \u003cspan class=\"fx\">which was written by a nurse\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나는 간호사가 쓴 책을 읽었다.\u003c/div>\u003cdiv class=\"g-note\">선행사 a book이 사물이므로 which를 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">The woman \u003cspan class=\"fx\">that teaches us English\u003c/span> is very kind.\u003c/div>\u003cdiv class=\"g-ko\">우리에게 영어를 가르치시는 여성분은 매우 친절하다.\u003c/div>\u003cdiv class=\"g-note\">사람 선행사에도 that을 쓸 수 있다는 점을 보여 줍니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>관계대명사는 앞에 있는 \u003cb class=\"key\">선행사\u003c/b>가 사람인지 사물인지에 따라 who, which를 고르고, 둘 다 가능할 때는 \u003cb class=\"key\">that\u003c/b>을 쓸 수 있습니다.\u003c/div>","segs":[{"n":2,"text":"관계대명사는 두 가지 일을 동시에 해요. 앞 문장과 뒤 문장을 이어 주는 접속사 역할, 그리고 앞에 나온 명사를 대신하는 대명사 역할이죠. 사람을 가리킬 때는 who, 사물을 가리킬 때는 which, 둘 다 괜찮을 때는 that을 씁니다. 이때 관계대명사가 꾸며 주는 앞의 명사를 선행사라고 불러요. 예를 들어 the man who lives next door라고 하면 who가 앞의 the man을 꾸며 주는 거예요.","hl":"rule"},{"n":3,"text":"첫 번째 예문 읽어 볼게요. The man who lives next door is a doctor. 뜻은 옆집에 사는 남자는 의사이다, 예요. 여기서 who는 앞에 있는 the man, 즉 사람을 가리키면서 뒤의 lives next door를 이어 주고 있어요. who lives next door가 the man을 꾸며 주는 거죠.","hl":"ex-0"},{"n":4,"text":"두 번째 예문이에요. I read a book which was written by a nurse. 나는 간호사가 쓴 책을 읽었다, 라는 뜻이에요. 여기서는 책, 즉 사물이니까 which를 썼고, which was written by a nurse가 a book을 꾸며 주고 있습니다.","hl":"ex-1"},{"n":5,"text":"보충 예문도 하나 읽어 볼게요. The woman that teaches us English is very kind. 우리에게 영어를 가르치시는 여성분은 매우 친절하다, 라는 뜻이에요. 사람을 가리키지만 that을 써도 자연스럽다는 점을 꼭 기억해 두세요.","hl":"ex-2"},{"n":6,"text":"정리하면 선행사가 사람이면 who, 사물이면 which, 헷갈리거나 둘 다 아우르고 싶으면 that을 떠올리시면 돼요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 3\u003c/span>\u003ch2 class=\"g-h\">주격 관계대명사 뒤에는 동사가 바로 온다\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">주격 관계대명사는 관계절 안에서 \u003cb class=\"key\">주어\u003c/b> 역할을 합니다. 그래서 관계대명사 뒤에는 \u003cb class=\"key\">동사\u003c/b>가 바로 오고, 관계절에는 주어가 따로 없습니다. 이렇게 주어가 빠진 \u003cb class=\"key\">불완전한 절\u003c/b>을 이끄는 것이 주격 관계대명사의 핵심입니다.\u003cdiv>\u003cspan class=\"g-formula\">선행사 + who/which/that + 동사 ~ (관계절 안에 주어 없음)\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The man \u003cspan class=\"fx\">who lives\u003c/span> next door is a doctor.\u003c/div>\u003cdiv class=\"g-ko\">옆집에 사는 남자는 의사이다.\u003c/div>\u003cdiv class=\"g-note\">who 바로 뒤에 동사 lives가 와서 who가 주어 역할을 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">Those are the students \u003cspan class=\"fx\">who study hard\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">저들은 열심히 공부하는 학생들이다.\u003c/div>\u003cdiv class=\"g-note\">who 뒤에 동사 study가 바로 와서 주격 관계대명사의 형태를 보여 줍니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>관계대명사 뒤에 \u003cb class=\"key\">주어\u003c/b>가 또 나오면 주격이 아니라 목적격일 수 있으니, 뒤에 \u003cb class=\"key\">동사\u003c/b>가 바로 오는지 확인하세요.\u003c/div>","segs":[{"n":7,"text":"주격이라는 말이 아주 중요해요. 관계대명사가 뒤 문장에서 주어 역할을 한다는 뜻이거든요. 그래서 who 다음에는 주어 없이 동사가 바로 따라옵니다. 만약 관계대명사 뒤에 주어가 또 보인다면 그건 목적격 관계대명사일 가능성이 커요. 오늘은 주격만 확실히 잡아 봅시다.","hl":"rule"},{"n":8,"text":"다시 첫 번째 예문을 볼게요. The man who lives next door is a doctor. 여기서 who 바로 뒤에 lives라는 동사가 나오죠. who가 주어 역할을 하고 있으니까 주어를 또 넣지 않아요. 그래서 관계절은 주어가 빠진 불완전한 절의 모습이에요.","hl":"ex-0"},{"n":9,"text":"이 예문도 읽어 볼게요. Those are the students who study hard. 저들은 열심히 공부하는 학생들이다, 라는 뜻이에요. who 뒤에 study가 바로 오고, who가 주어 역할을 하고 있어요. 뒤에 주어가 따로 없다는 점을 눈여겨보세요.","hl":"ex-1"},{"n":10,"text":"그러니까 관계대명사 뒤를 볼 때 주어가 또 있는지, 동사가 바로 오는지를 확인하는 습관을 들이면 좋아요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 3\u003c/span>\u003ch2 class=\"g-h\">관계절 동사는 선행사의 수에 일치한다\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">관계절의 동사는 관계대명사가 아니라 \u003cb class=\"key\">선행사\u003c/b>의 수에 일치시킵니다. 선행사가 단수면 관계절 동사도 \u003cb class=\"key\">단수 동사\u003c/b>를, 복수면 \u003cb class=\"key\">복수 동사\u003c/b>를 씁니다. 주절 동사와 헷갈리지 않도록 선행사를 먼저 찾는 습관이 중요합니다.\u003cdiv>\u003cspan class=\"g-formula\">단수 선행사 + who + 단수 동사 / 복수 선행사 + who + 복수 동사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">Those are \u003cspan class=\"fx\">the students who study hard\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">저들은 열심히 공부하는 학생들이다.\u003c/div>\u003cdiv class=\"g-note\">복수 선행사 the students에 맞춰 동사 study를 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">The boy \u003cspan class=\"fx\">who plays\u003c/span> the piano is my cousin.\u003c/div>\u003cdiv class=\"g-ko\">피아노를 치는 그 소년은 내 사촌이다.\u003c/div>\u003cdiv class=\"g-note\">단수 선행사 the boy에 맞춰 동사 plays를 씁니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>관계절 동사를 쓸 때는 반드시 \u003cb class=\"key\">선행사\u003c/b>를 먼저 찾아 \u003cb class=\"key\">수\u003c/b>를 확인하세요.\u003c/div>","segs":[{"n":11,"text":"이번에는 수 일치예요. 관계절 동사는 관계대명사가 아니라 앞에 있는 선행사를 따라갑니다. 선행사가 단수면 단수 동사를, 복수면 복수 동사를 쓰는 거죠. 시험에서 정말 자주 틀리는 부분이니까 선행사를 먼저 찾는 습관을 꼭 들이세요.","hl":"rule"},{"n":12,"text":"Those are the students who study hard. 여기서 선행사는 the students, 복수죠. 그래서 관계절 동사도 studies가 아니라 study를 씁니다. 선행사가 복수이니 동사도 복수형으로 맞춰 준 거예요.","hl":"ex-0"},{"n":13,"text":"보충 예문을 하나 더 볼게요. The boy who plays the piano is my cousin. 피아노를 치는 그 소년은 내 사촌이다, 라는 뜻이에요. 선행사 the boy가 단수이기 때문에 관계절 동사도 plays, 단수형을 썼습니다.","hl":"ex-1"},{"n":14,"text":"관계절 동사를 쓰기 전에 선행사가 단수인지 복수인지 먼저 세어 보는 습관, 정말 중요해요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>The man who live next door is a doctor.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ The man who lives next door is a doctor.\u003c/div>\u003cdiv class=\"g-why\">선행사 The man이 단수이므로 관계절 동사도 단수형 lives를 써야 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>Those are the students who studies hard.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ Those are the students who study hard.\u003c/div>\u003cdiv class=\"g-why\">선행사 the students가 복수이므로 관계절 동사는 study입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-2\">\u003cdiv class=\"g-wrong\">✗ \u003cs>I read a book who was written by a nurse.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ I read a book which was written by a nurse.\u003c/div>\u003cdiv class=\"g-why\">선행사 a book이 사물이므로 who가 아니라 which를 써야 합니다.\u003c/div>\u003c/div>","segs":[{"n":15,"text":"선행사가 the man, 단수죠. 그런데 관계절 동사를 live로 쓰면 수가 맞지 않아요. 선행사가 단수이므로 lives라고 써야 합니다.","hl":"mk-0"},{"n":16,"text":"앞에 있는 the students가 복수라는 걸 놓치면 studies라고 쓰기 쉬워요. 관계절 동사는 항상 선행사를 따라간다는 점을 기억하세요.","hl":"mk-1"},{"n":17,"text":"책은 사물이니까 who가 아니라 which를 써야 해요. 사람일 때만 who라고 기억해 두세요.","hl":"mk-2"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">빈칸에 알맞은 것을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\">The man ____ lives next door is a doctor.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>who\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>which\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>whose\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>what\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">who\u003c/span>\u003cdiv class=\"g-exp\">선행사 The man이 사람이므로 주격 관계대명사 who를 씁니다. 뒤에 동사 lives가 바로 옵니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":18,"text":"첫 번째 문제는 객관식이에요. The man blank lives next door is a doctor. 빈칸에 들어갈 관계대명사를 골라 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":19,"text":"","hl":"q","pause":6},{"n":20,"text":"정답은 첫 번째 보기, who예요. 선행사가 the man, 즉 사람이니까 who를 쓰고, 뒤에는 lives라는 동사가 바로 와요. which는 사물에 쓰고 whose는 소유격이라 여기에는 맞지 않습니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 6\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">빈칸에 알맞은 관계대명사를 쓰세요.\u003c/div>\u00 g well is my sister.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>The girls who sings well are my sisters.\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>③\u003c/b>The girl who sings well is my sister.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>The girl which sings well is my sister.\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">The girl who sings well is my sister.\u003c/span>\u003cdiv class=\"g-exp\">선행사가 사람 단수이므로 who와 단수 동사 sings를 써야 합니다. which는 사물에 씁니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":27,"text":"네 번째 문제는 어법상 올바른 문장 찾기예요. 보기를 하나씩 비교하면서 직접 풀어 보세요. 잠시 멈춰 볼게요.","hl":"q"},{"n":28,"text":"","hl":"q","pause":6},{"n":29,"text":"정답은 세 번째 보기예요. 선행사가 the girl, 단수 사람이니까 who를 쓰고 동사도 sings로 맞춰 줘야 해요. 첫 번째 보기는 동사 형태가, 두 번째 보기는 선행사와 동사의 수가 맞지 않고, 네 번째 보기는 사물에 쓰는 which를 사람에게 썼기 때문에 틀렸습니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 5 / 6\u003c/span>\u003cspan class=\"g-kind\">배열\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">주어진 단어를 바르게 배열하여 문장을 완성하세요.\u003c/div>\u003cdiv class=\"g-qs\">the / boy / who / lives / next door / is / my friend\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">The boy who lives next door is my friend.\u003c/span>\u003cdiv class=\"g-exp\">선행사 The boy 뒤에 who와 동사 lives를 붙여 꾸며 주고, 주절 동사 is를 뒤에 씁니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":30,"text":"다섯 번째 문제는 단어 배열이에요. the, boy, who, lives, next door, is, my friend를 바르게 배열해 문장을 완성해 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":31,"text":"","hl":"q","pause":6},{"n":32,"text":"정답은 The boy who lives next door is my friend예요. 선행사 the boy 뒤에 who와 동사 lives를 붙여 꾸며 주고, 그다음에 주절 동사 is를 써 주면 됩니다. who가 주어 역할을 하니까 뒤에 주어를 또 넣지 않는 게 포인트예요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 6 / 6\u003c/span>\u003cspan class=\"g-kind\">영작\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 우리말을 주격 관계대명사를 사용해 영작하세요.\u003c/div>\u003cdiv class=\"g-qs\">나는 간호사가 쓴 책을 읽었다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">I read a book which was written by a nurse.\u003c/span>\u003cdiv class=\"g-exp\">선행사 a book이 사물이므로 which를 쓰고, which was written by a nurse가 a book을 꾸며 줍니다. that도 가능합니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":33,"text":"마지막 문제는 영작이에요. 나는 간호사가 쓴 책을 읽었다, 라는 문장을 주격 관계대명사를 사용해 영어로 써 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":34,"text":"","hl":"q","pause":6},{"n":35,"text":"정답은 I read a book which was written by a nurse예요. 책은 사물이니까 which를 쓰고, which was written by a nurse가 a book을 꾸며 줍니다. that을 써도 자연스럽고, 뒤에 동사 was written이 바로 온다는 점도 확인해 보세요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">Unit 071 주격 관계대명사\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>관계대명사 \u003cb class=\"key\">who\u003c/b>는 사람, \u003cb class=\"key\">which\u003c/b>는 사물, \u003cb class=\"key\">that\u003c/b>은 둘 다를 가리키며 접속사와 대명사 역할을 합니다.\u003c/li>\u003cli>주격 관계대명사 뒤에는 \u003cb class=\"key\">동사\u003c/b>가 바로 오고, 관계절은 주어가 빠진 \u003cb class=\"key\">불완전한 절\u003c/b>입니다.\u003c/li>\u003cli>관계절의 동사는 관계대명사가 아니라 \u003cb class=\"key\">선행사\u003c/b>의 수에 일치시킵니다.\u003c/li>\u003cli>선행사를 먼저 찾는 습관으로 \u003cb class=\"key\">단수 동사\u003c/b>와 \u003cb class=\"key\">복수 동사\u003c/b>를 정확히 구분합시다.\u003c/li>\u003c/ul>","segs":[{"n":36,"text":"오늘은 주격 관계대명사를 배웠어요. 사람이면 who, 사물이면 which, 둘 다는 that이라는 점, 그리고 뒤에 동사가 바로 온다는 점을 기억해 주세요. 또 관계절 동사는 선행사의 수를 따라간다는 것도 꼭 챙겨야 합니다. 오늘 배운 내용은 예문을 소리 내어 읽으면서 다시 복습해 보세요. 수고했어요, 다음 시간에 만나요!","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
