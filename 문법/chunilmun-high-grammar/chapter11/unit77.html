  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}

}
lecturePlayer(document.getElementById("app"),{"brand":"Unit 77 콤마(,) + 관계사절","title":"콤마 하나로 달라지는 관계사절 — 계속적 용법 완전 정복","audioDir":"unit77_audio","preview":false,"count":33,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">Unit 077 콤마(,) + 관계사절\u003c/div>\u003ch1>콤마 하나로 달라지는 관계사절 — 계속적 용법 완전 정복\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>관계사 앞에 콤마가 있을 때의 계속적 용법을 이해하고, that과 what을 쓸 수 없는 이유와 which가 앞 문장 전체를 받는 쓰임을 예문으로 익힌다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 관계사 앞에 콤마가 붙었을 때 문장이 어떻게 달라지는지 배워 볼 거예요. 콤마 하나만 있어도 해석이 완전히 달라지기 때문에 아주 중요한 포인트예요. 오늘 세 가지 규칙만 확실히 잡으면 시험에서 관계사 문제는 거의 다 맞힐 수 있어요. 자, 그럼 시작해 볼까요?","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 3\u003c/span>\u003ch2 class=\"g-h\">콤마가 붙으면 계속적 용법 — '그리고 그것은 ~'\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">관계사 앞에 \u003cb class=\"key\">콤마\u003c/b>가 있으면 \u003cb class=\"key\">계속적 용법\u003c/b>으로, 선행사를 추가로 설명하며 '그리고 그것은 ~'으로 해석합니다. 콤마가 없으면 선행사를 한정하는 \u003cb class=\"key\">한정적 용법\u003c/b>이 되어 '~하는'으로 해석합니다.\u003cdiv>\u003cspan class=\"g-formula\">선행사 + , + 관계사 + 추가 설명 → 그리고 그것은 ~\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">He has two sons\u003cspan class=\"fx\">, who are doctors\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그에게는 아들이 둘 있는데, 그들은 의사이다.\u003c/div>\u003cdiv class=\"g-note\">콤마 뒤 who가 '아들이 둘 있다'는 정보에 '그들은 의사이다'를 덧붙여 줍니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">We stayed in Jeju\u003cspan class=\"fx\">, where the weather was warm\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">우리는 제주에 머물렀는데, 그곳은 날씨가 따뜻했다.\u003c/div>\u003cdiv class=\"g-note\">장소 선행사 Jeju를 콤마 뒤 where가 '그곳은'이라는 뜻으로 추가 설명합니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>콤마의 유무로 의미가 달라지므로 \u003cb class=\"key\">콤마\u003c/b>를 절대 가볍게 보면 안 됩니다. 콤마가 있으면 \u003cb class=\"key\">추가 설명\u003c/b>, 없으면 \u003cb class=\"key\">한정\u003c/b>이라고 기억하세요.\u003c/div>","segs":[{"n":2,"text":"먼저 콤마의 힘부터 이야기해 볼게요. 관계사 앞에 콤마가 있으면 계속적 용법이라고 해서, 선행사를 딱 정해 주는 게 아니라 이미 정해진 선행사에 설명을 하나 덧붙여 주는 역할을 해요. 그래서 해석할 때는 '그리고 그것은'이나 '그런데 그것은'처럼 앞 내용에 살짝 이어 붙여 주면 됩니다. 반대로 콤마가 없으면 한정적 용법이 되어서 '~하는'이라는 뜻으로 선행사를 콕 집어 줘요. 이 차이를 꼭 기억해 두세요.","hl":"rule"},{"n":3,"text":"첫 번째 예문은 He has two sons, who are doctors. 예요. 뜻은 '그에게는 아들이 둘 있는데, 그들은 의사이다'예요. sons 뒤에 콤마가 있으니 아들이 둘이라는 사실은 이미 정해져 있고, who are doctors가 '그들은 의사이다'라고 설명을 덧붙여 주는 거예요.","hl":"ex-0"},{"n":4,"text":"다음은 We stayed in Jeju, where the weather was warm. 이에요. 해석은 '우리는 제주에 머물렀는데, 그곳은 날씨가 따뜻했다'예요. 장소를 나타내는 Jeju 뒤에 콤마가 있으니 where가 '그곳은'이라는 뜻으로 추가 설명을 해 주는 거죠.","hl":"ex-1"},{"n":5,"text":"여기서 가장 중요한 건 콤마의 유무예요. 콤마가 있으면 추가 설명, 없으면 한정이라고만 기억해도 절반은 끝난 거예요. 시험에서는 콤마 유무에 따라 해석을 고르는 문제가 자주 나오니까요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 3\u003c/span>\u003ch2 class=\"g-h\">that과 what은 콤마 뒤에 올 수 없다\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">that\u003c/b>과 \u003cb class=\"key\">what\u003c/b>은 계속적 용법에 쓸 수 없습니다. 콤마 뒤에서 사람은 who, 사물이나 동물은 \u003cb class=\"key\">which\u003c/b>를 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">, who (사람) / , which (사물·동물) — that, what 불가\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">This book\u003cspan class=\"fx\">, which I bought yesterday\u003c/span>, is very interesting.\u003c/div>\u003cdiv class=\"g-ko\">이 책은 내가 어제 산 것인데, 매우 흥미롭다.\u003c/div>\u003cdiv class=\"g-note\">콤마 뒤에서 사물을 받을 때는 that이 아니라 which를 씁니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>콤마 뒤에 \u003cb class=\"key\">that\u003c/b>을 쓰면 틀린 문장이 되고, \u003cb class=\"key\">what\u003c/b>은 선행사를 포함하는 말이라 콤마 뒤에 올 수 없습니다.\u003c/div>","segs":[{"n":6,"text":"이제 콤마 뒤에 절대 오면 안 되는 아이들을 소개할게요. 바로 that과 what이에요. 계속적 용법에서는 that을 쓸 수 없고, what은 선행사를 품고 있는 말이라 콤마 뒤에 오면 문장이 어색해져요. 그래서 콤마 뒤에서 사람을 설명할 때는 who, 사물이나 동물을 설명할 때는 which를 써야 해요.","hl":"rule"},{"n":7,"text":"This book, which I bought yesterday, is very interesting. 이라는 문장을 볼게요. 뜻은 '이 책은 내가 어제 산 것인데, 매우 흥미롭다'예요. 여기서 콤마 뒤 사물을 받는 말은 that이 아니라 which라는 점, 꼭 확인하고 넘어가세요.","hl":"ex-0"},{"n":8,"text":"콤마 뒤에 that을 써 놓은 문장이 보이면 바로 틀린 문장이라고 표시하세요. 그리고 what은 선행사가 따로 없을 때 쓰는 말이라 콤마 뒤에서는 절대 나올 수 없다는 것도 함께 기억해 주세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 3\u003c/span>\u003ch2 class=\"g-h\">which는 앞 문장 전체를 선행사로 받을 수 있다\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">콤마 뒤 \u003cb class=\"key\">which\u003c/b>는 바로 앞의 명사뿐 아니라 \u003cb class=\"key\">앞 문장 전체\u003c/b>를 선행사로 받을 수 있습니다. 이때 which는 '그리고 그것은 ~' 또는 '그런데 그것은 ~'으로 해석합니다.\u003cdiv>\u003cspan class=\"g-formula\">문장 + , which + 동사 ~ → 그리고 그것은 ~\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">She passed the test\u003cspan class=\"fx\">, which surprised everyone\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 시험에 합격했는데, 그것은 모두를 놀라게 했다.\u003c/div>\u003cdiv class=\"g-note\">which가 시험에 합격한 일 전체를 받아 '그것은'으로 해석됩니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>문장 전체를 받는 which도 \u003cb class=\"key\">that\u003c/b>으로 바꿀 수 없으며, 이때 which는 \u003cb class=\"key\">앞 문장 전체\u003c/b>를 가리킵니다.\u003c/div>","segs":[{"n":9,"text":"마지막은 which의 특별한 능력이에요. 콤마 뒤에 온 which는 앞에 있는 명사 하나만 받을 수도 있지만, 앞 문장 전체를 통째로 받을 수도 있어요. 이때는 '그리고 그것은'이나 '그런데 그것은'으로 해석하면 자연스러워요. 시험에서는 이 which를 가리켜 앞 문장 전체를 받는 관계대명사라고 설명하기도 해요.","hl":"rule"},{"n":10,"text":"She passed the test, which surprised everyone. 이 문장을 보세요. 해석은 '그녀는 시험에 합격했는데, 그것은 모두를 놀라게 했다'예요. 여기서 which는 the test가 아니라 그녀가 시험에 합격했다는 사실 전체를 받고 있어요. 그래서 '그것은'이라고 해석하는 거예요.","hl":"ex-0"},{"n":11,"text":"문장 전체를 받는 which도 that으로 바꿀 수 없다는 점, 꼭 기억하세요. 앞 문장 전체를 받는 which 뒤에는 surprised나 amazed 같은 동사가 자연스럽게 이어져요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>He has two sons, that are doctors.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ He has two sons, who are doctors.\u003c/div>\u003cdiv class=\"g-why\">콤마 뒤 계속적 용법에서는 that을 쓸 수 없고, 사람을 받을 때는 who를 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>She passed the test, that surprised everyone.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ She passed the test, which surprised everyone.\u003c/div>\u003cdiv class=\"g-why\">앞 문장 전체를 받는 계속적 용법에서는 that 대신 which를 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-2\">\u003cdiv class=\"g-wrong\">✗ \u003cs>I know a boy, what is very kind.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ I know a boy, who is very kind.\u003c/div>\u003cdiv class=\"g-why\">what은 선행사를 포함하는 말이라 이미 선행사가 있는 콤마 뒤에 올 수 없습니다.\u003c/div>\u003c/div>","segs":[{"n":12,"text":"자주 나오는 실수 하나 볼게요. He has two sons, that are doctors. 라고 쓰면 틀린 문장이에요. 콤마 뒤 계속적 용법에서는 that을 쓸 수 없으니까, 사람을 받는 who로 고쳐서 He has two sons, who are doctors. 라고 해야 합니다.","hl":"mk-0"},{"n":13,"text":"두 번째 실수는 She passed the test, that surprised everyone. 이에요. 앞 문장 전체를 받을 때도 that은 안 되고 which를 써야 해요. 그래서 She passed the test, which surprised everyone. 이렇게 고쳐 주면 됩니다.","hl":"mk-1"},{"n":14,"text":"세 번째는 what을 콤마 뒤에 쓴 경우예요. I know a boy, what is very kind. 는 틀린 문장이에요. what은 선행사를 포함하는 말이라 이미 선행사가 있는 콤마 뒤에는 올 수 없어요. 그래서 who로 바꿔서 I know a boy, who is very kind. 라고 해야 합니다.","hl":"mk-2"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 중 콤마 뒤 계속적 용법에 쓸 수 없는 관계사를 고르세요.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>who\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>which\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>③\u003c/b>that\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>where\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">that\u003c/span>\u003cdiv class=\"g-exp\">계속적 용법에서는 that을 쓸 수 없습니다. 사람은 who, 사물은 which, 장소는 where로 받아야 합니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":15,"text":"첫 번째 문제예요. 다음 중 콤마 뒤 계속적 용법에 쓸 수 없는 관계사를 고르는 문제입니다. 보기는 who, which, that, where 네 가지예요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":16,"text":"","hl":"q","pause":6},{"n":17,"text":"정답은 세 번째 보기인 that이에요. 계속적 용법에서는 that을 쓸 수 없고, 사람은 who, 사물은 which, 장소는 where를 써야 합니다. 콤마 뒤에 that이 보이면 바로 오답이라고 생각하세요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 6\u003c/span>\u003cspan class=\"g-kind\">빈칸\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">빈칸에 알맞은 관계사를 쓰세요.\u003c/div>\u003cdiv class=\"g-qs\">She passed the test, ____ surprised everyone.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">which\u003c/span>\u003cdiv class=\"g-exp\">앞 문장 전체를 선행사로 받는 자리이므로 which를 씁니다. that은 이 자리에 쓸 수 없습니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":18,"text":"두 번째 문제는 빈칸 채우기예요. She passed the test, 빈칸 surprised everyone. 빈칸에 들어갈 관계사를 생각해 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":19,"text":"","hl":"q","pause":6},{"n":20,"text":"정답은 which예요. 앞에 있는 시험에 합격했다는 사실 전체를 받아서 '그것은'이라고 해석하는 자리니까 which를 써야 합니다. that은 이 자리에 절대 올 수 없다는 것도 함께 기억해 주세요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 3 / 6\u003c/span>\u003cspan class=\"g-kind\">오류 수정\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 문장에서 틀린 부분을 찾아 바르게 고치세요.\u003c/div>\u003cdiv class=\"g-qs\">He has two sons, that are doctors.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">He has two sons, who are doctors.\u003c/span>\u003cdiv class=\"g-exp\">콤마 뒤에서 사람 선행사를 추가 설명할 때는 that이 아니라 who를 씁니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":21,"text":"세 번째 문제는 오류 수정이에요. He has two sons, that are doctors. 라는 문장에서 틀린 부분을 찾아 바르게 고쳐 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":22,"text":"","hl":"q","pause":6},{"n":23,"text":"정답은 He has two sons, who are doctors. 예요. 콤마 뒤에서 사람을 추가로 설명할 때는 that이 아니라 who를 써야 하거든요. that을 who로만 바꿔 주면 되는 문제였어요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 4 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 문장의 해석으로 가장 알맞은 것을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\">We stayed in Jeju, where the weather was warm.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>우리는 날씨가 따뜻한 제주에 머물렀다.\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>우리는 제주에 머물렀는데, 그곳은 날씨가 따뜻했다.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>우리는 제주에 머물렀지만, 날씨는 따뜻하지 않았다.\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>우리는 제주에 머물렀고, 그곳의 날씨는 매우 추웠다.\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">우리는 제주에 머물렀는데, 그곳은 날씨가 따뜻했다.\u003c/span>\u003cdiv class=\"g-exp\">콤마 뒤 where는 '그곳은'이라는 뜻으로 제주를 추가 설명하므로 '그리고 그것은'의 계속적 용법으로 해석합니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":24,"text":"네 번째 문제는 해석이에요. We stayed in Jeju, where the weather was warm. 이 문장의 해석으로 가장 알맞은 것을 고르세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":25,"text":"","hl":"q","pause":6},{"n":26,"text":"정답은 두 번째 보기예요. 콤마 뒤 where는 '그곳은'이라는 뜻으로 제주를 추가 설명해 주니까, 우리는 제주에 머물 \"show\">정답 보기\u003c/button>","segs":[{"n":30,"text":"마지막 문제는 영작이에요. 그녀는 시험에 합격했는데, 그것은 모두를 놀라게 했다. 라는 문장을 콤마와 관계사를 이용해 영어로 써 보세요. 잠시 멈추고 직접 풀어 보세요.","hl":"q"},{"n":31,"text":"","hl":"q","pause":6},{"n":32,"text":"정답은 She passed the test, which surprised everyone. 이에요. 쉼표 뒤 which가 앞 문장 전체를 받아서 '그것은'이라는 뜻을 만들어 줍니다. 여기서도 that이 아니라 which를 써야 한다는 점, 꼭 기억해 두세요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">Unit 077 콤마(,) + 관계사절\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>관계사 앞에 \u003cb class=\"key\">콤마\u003c/b>가 있으면 \u003cb class=\"key\">계속적 용법\u003c/b>으로 '그리고 그것은 ~'으로 해석합니다.\u003c/li>\u003cli>계속적 용법에는 \u003cb class=\"key\">that\u003c/b>과 \u003cb class=\"key\">what\u003c/b>을 쓸 수 없고, 사람은 who, 사물은 which로 받습니다.\u003c/li>\u003cli>콤마 뒤 \u003cb class=\"key\">which\u003c/b>는 \u003cb class=\"key\">앞 문장 전체\u003c/b>를 선행사로 받을 수 있습니다.\u003c/li>\u003c/ul>","segs":[{"n":33,"text":"오늘은 콤마 뒤 관계사절을 배웠어요. 콤마가 있으면 계속적 용법으로 '그리고 그것은'으로 해석하고, that과 what은 쓸 수 없으며, which는 앞 문장 전체를 받을 수 있다는 세 가지가 핵심이었죠. 오늘 배운 예문들을 소리 내어 세 번씩 읽어 보면 훨씬 오래 기억에 남을 거예요. 다음 시간에 또 만나요, 수고했어요!","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
