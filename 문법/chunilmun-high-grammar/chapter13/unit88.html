}
lecturePlayer(document.getElementById("app"),{"brand":"Unit 88 재귀대명사","title":"재귀대명사 완전 정복: myself부터 by oneself까지","audioDir":"unit88_audio","preview":false,"count":37,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">재귀대명사\u003c/div>\u003ch1>재귀대명사 완전 정복: myself부터 by oneself까지\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>주어와 목적어가 같을 때 재귀대명사를 쓰고, 강조 용법과 관용 표현을 구별해 사용할 수 있다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 재귀대명사라는 문법을 배워 볼 거예요. 재귀대명사는 이름 그대로 주어가 자기 자신을 다시 가리킬 때 쓰는 표현이에요. 예문을 통해 언제 herself나 myself를 쓰는지, 그리고 by oneself 같은 관용 표현까지 차근차근 알아볼게요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 3\u003c/span>\u003ch2 class=\"g-h\">주어와 목적어가 같을 때 쓰는 재귀대명사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">주어와 목적어가 \u003cb class=\"key\">같은 대상\u003c/b>을 가리키면 목적어 자리에 재귀대명사(-self/-selves)를 씁니다. 재귀대명사는 \u003cb class=\"key\">주어\u003c/b>의 인칭과 수에 맞춰 형태가 달라집니다. 예를 들어 주어가 she이면 herself, I이면 myself를 씁니다.\u003cdiv>\u003cspan class=\"g-formula\">주어 + 동사 + 재귀대명사(-self/-selves)\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">She introduced \u003cspan class=\"fx\">herself\u003c/span> to the class.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 반 친구들에게 자신을 소개했다.\u003c/div>\u003cdiv class=\"g-note\">주어 She와 목적어 herself가 같은 사람을 가리킵니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">He hurt \u003cspan class=\"fx\">himself\u003c/span> while playing soccer.\u003c/div>\u003cdiv class=\"g-ko\">그는 축구를 하다가 다쳤다.\u003c/div>\u003cdiv class=\"g-note\">주어 He와 목적어 himself가 같은 사람을 가리킵니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>재귀대명사는 \u003cb class=\"key\">주어의 인칭과 수\u003c/b>에 맞춰 형태를 고르고, 목적어 자리에 \u003cb class=\"key\">목적격 대명사\u003c/b>를 쓰지 않도록 주의하세요.\u003c/div>","segs":[{"n":2,"text":"먼저 주어와 목적어가 같은 사람이나 대상을 가리킬 때 재귀대명사를 쓴다는 점을 기억해 주세요. 예를 들어 그녀가 자신을 소개할 때는 목적어 자리에 herself를 써야 해요. 재귀대명사는 주어의 인칭과 수에 따라 myself, yourself, herself, ourselves처럼 모양이 달라집니다. 그래서 문장의 주어를 먼저 확인하는 습관이 중요해요.","hl":"rule"},{"n":3,"text":"첫 번째 예문은 She introduced herself to the class예요. 뜻은 그녀는 반 친구들에게 자신을 소개했다라는 말이죠. 여기서 herself는 주어인 she가 가리키는 그녀 자신을 다시 받아 주는 재귀대명사예요.","hl":"ex-0"},{"n":4,"text":"이번 예문은 He hurt himself while playing soccer예요. 뜻은 그는 축구를 하다가 다쳤다는 말이죠. 여기서도 주어 he와 목적어 himself가 같은 사람이므로 재귀대명사를 썼어요.","hl":"ex-1"},{"n":5,"text":"재귀대명사의 모양은 주어에 따라 달라지므로 주어의 인칭과 수를 꼭 확인해 주세요. 그리고 주어와 같은 사람을 가리킬 때는 him이나 her 같은 목적격 대명사가 아니라 herself나 himself 같은 재귀대명사를 골라야 한다는 점도 기억해 주세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 3\u003c/span>\u003ch2 class=\"g-h\">강조 용법: 생략해도 문장이 성립하는 재귀대명사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">재귀대명사를 \u003cb class=\"key\">강조\u003c/b>의 뜻으로 덧붙여 '직접, 몸소'라는 의미를 나타낼 수 있습니다. 이때 재귀대명사는 \u003cb class=\"key\">생략\u003c/b>해도 문장의 기본 구조가 무너지지 않습니다. 강조하는 대상 바로 뒤나 \u003cb class=\"key\">문장 끝\u003c/b>에 주로 놓습니다.\u003cdiv>\u003cspan class=\"g-formula\">주어 + 동사 + 목적어 + (재귀대명사)\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I did it \u003cspan class=\"fx\">myself\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나는 그것을 직접 했다.\u003c/div>\u003cdiv class=\"g-note\">myself를 빼도 'I did it.'으로 문장이 성립하는 강조 용법입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">The president \u003cspan class=\"fx\">himself\u003c/span> attended the meeting.\u003c/div>\u003cdiv class=\"g-ko\">대통령이 직접 회의에 참석했다.\u003c/div>\u003cdiv class=\"g-note\">강조 대상 The president 뒤에 himself를 붙여 '대통령이 직접'을 강조합니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>강조 용법의 재귀대명사는 \u003cb class=\"key\">생략\u003c/b>할 수 있지만, 주어와 목적어가 같은 대상을 가리키는 \u003cb class=\"key\">재귀 용법\u003c/b>에서는 함부로 생략하면 뜻이 달라질 수 있습니다.\u003c/div>","segs":[{"n":6,"text":"이번에는 강조 용법이에요. 재귀대명사를 덧붙여서 내가 직접 했다, 그 사람이 몸소 했다처럼 강조할 수 있죠. 이때 재귀대명사는 없애도 문장이 성립해요. 그래서 강조 용법인지 확인할 때는 재귀대명사를 빼 보면 쉽게 알 수 있습니다.","hl":"rule"},{"n":7,"text":"이번 예문은 I did it myself예요. 뜻은 나는 그것을 직접 했다라는 말이죠. 여기서 myself는 내가 직접 했다는 점을 강조하고 있어요. myself를 빼도 I did it이라고 문장이 성립하기 때문에 강조 용법이라고 볼 수 있어요.","hl":"ex-0"},{"n":8,"text":"다음 예문은 The president himself attended the meeting이에요. 뜻은 대통령이 직접 회의에 참석했다라는 말이죠. himself가 강조하는 대상은 바로 앞에 있는 the president이고, 이 표현을 빼도 문장은 성립해요.","hl":"ex-1"},{"n":9,"text":"강조 용법은 재귀대명사를 빼도 문장이 자연스럽다는 특징이 있어요. 하지만 주어가 자기 자신을 목적어로 받는 재귀 용법에서는 재귀대명사를 빼면 문장이 어색해지거나 뜻이 달라질 수 있으니 구별해서 기억해 주세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 3\u003c/span>\u003ch2 class=\"g-h\">자주 쓰는 재귀대명사 관용 표현\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">재귀대명사가 포함된 관용 표현은 통째로 익혀야 합니다. \u003cb class=\"key\">by oneself\u003c/b>는 '혼자서', \u003cb class=\"key\">for oneself\u003c/b>는 '스스로', \u003cb class=\"key\">in itself\u003c/b>는 '그 자체로'라는 뜻이고, beside oneself는 '제정신이 아닌'이라는 뜻입니다.\u003cdiv>\u003cspan class=\"g-formula\">by oneself = 혼자서 / for oneself = 스스로 / in itself = 그 자체로 / beside oneself = 제정신이 아닌\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">He lives \u003cspan class=\"fx\">by himself\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그는 혼자 산다.\u003c/div>\u003cdiv class=\"g-note\">by oneself는 '혼자서'라는 뜻의 관용 표현입니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">You should decide \u003cspan class=\"fx\">for yourself\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">너는 스스로 결정해야 한다.\u003c/div>\u003cdiv class=\"g-note\">for oneself는 '스스로'라는 뜻으로, 스스로 판단하거나 결정할 때 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">The problem is not important \u003cspan class=\"fx\">in itself\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그 문제는 그 자체로는 중요하지 않다.\u003c/div>\u003cdiv class=\"g-note\">in itself는 '그 자체로'라는 뜻으로, 다른 요소와 구별해 말할 때 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-3\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">She was \u003cspan class=\"fx\">beside herself\u003c/span> with joy.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 기뻐서 어쩔 줄 몰랐다.\u003c/div>\u003cdiv class=\"g-note\">beside oneself는 감정이 매우 강해 '제정신이 아닌' 상태를 나타냅니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>관용 표현은 \u003cb class=\"key\">by oneself\u003c/b>, \u003cb class=\"key\">for oneself\u003c/b>, \u003cb class=\"key\">in itself\u003c/b>처럼 전치사와 재귀대명사의 결합을 통째로 외우세요. beside oneself는 감정이 매우 강한 상태를 나타낸다는 점도 기억해 두세요.\u003c/div>","segs":[{"n":10,"text":"마지막으로 재귀대명사가 들어간 관용 표현을 익혀 볼게요. by oneself는 혼자서, for oneself는 스스로라는 뜻이에요. in itself는 그 자체로, beside oneself는 제정신이 아니라는 뜻으로 쓰입니다. 이런 표현은 단어 하나하나보다 덩어리로 외워 두면 문장을 훨씬 쉽게 이해할 수 있어요.","hl":"rule"},{"n":11,"text":"이번 예문은 He lives by himself예요. 뜻은 그는 혼자 산다라는 말이죠. 여기서 by himself는 혼자서라는 뜻으로, 재귀대명사가 들어간 대표적인 관용 표현이에요.","hl":"ex-0"},{"n":12,"text":"다음 예문은 You should decide for yourself예요. 뜻은 너는 스스로 결정해야 한다라는 말이죠. for yourself는 스스로라는 뜻으로, 다른 사람에게 맡기지 않고 직접 판단한다는 느낌을 줍니다.","hl":"ex-1"},{"n":13,"text":"또 다른 예문은 The problem is not important in itself예요. 뜻은 그 문제는 그 자체로는 중요하지 않다는 말이죠. in itself는 그 자체로라는 뜻으로, 어떤 것의 본래 성질만 따로 말할 때 사용해요.","hl":"ex-2"},{"n":14,"text":"마지막 예문은 She was beside herself with joy예요. 뜻은 그녀는 기뻐서 어쩔 줄 몰랐다는 말이죠. beside herself는 제정신이 아닌 상태를 나타내서, 감정이 아주 강할 때 쓰는 표현이에요.","hl":"ex-3"},{"n":15,"text":"이 표현들은 전치사와 재귀대명사의 조합이 정해져 있으므로 통째로 외우는 것이 좋아요. 특히 beside oneself는 단순히 옆에 있다는 뜻이 아니라 감정이 매우 강한 상태를 나타낸다는 점을 꼭 기억해 주세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>She introduced her to the class.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ She introduced herself to the class.\u003c/div>\u003cdiv class=\"g-why\">주어 She와 목적어가 같은 사람이면 목적어 자리에 herself를 써야 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>He lives by him.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ He lives by himself.\u003c/div>\u003cdiv class=\"g-why\">by oneself 형태의 관용 표현이므로 재귀대명사 himself를 써야 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-2\">\u003cdiv class=\"g-wrong\">✗ \u003cs>I did it me.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ I did it myself.\u003c/div>\u003cdiv class=\"g-why\">강조 용법에서는 목적격 대명사 me가 아니라 재귀대명사 myself를 씁니다.\u003c/div>\u003c/div>","segs":[{"n":16,"text":"첫 번째로 자주 나오는 실수는 She introduced her to the class라고 쓰는 경우예요. 여기서 her는 다른 여자를 가리킬 수 있기 때문에, 주어인 she가 자기 자신을 소개한다는 뜻을 살리려면 herself를 써야 해요. 그래서 She introduced herself to the class가 맞습니다.","hl":"mk-0"},{"n":17,"text":"by oneself는 혼자서라는 뜻으로 굳어진 관용 표현이에요. 그래서 by him이 아니라 by himself라고 써야 합니다. He lives by himself처럼 재귀대명사 형태를 그대로 기억해 주세요.","hl":"mk-1"},{"n":18,"text":"강조할 때는 me나 him 같은 목적격 대명사가 아니라 myself나 himself 같은 재귀대명사를 써요. 그래서 I did it me가 아니라 I did it myself가 맞습니다.","hl":"mk-2"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 문장의 빈칸에 들어갈 재귀대명사로 알맞은 것을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\">She introduced ____ to the class.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>her\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>herself\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>himself\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>she\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">herself\u003c/span>\u003cdiv class=\"g-exp\">
