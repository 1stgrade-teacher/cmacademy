lecturePlayer(document.getElementById("app"),{"brand":"Unit 92 전치사","title":"전치사 완전 정복: 시간과 장소를 딱 맞게","audioDir":"unit92_audio","preview":false,"count":38,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">Unit 092 전치사\u003c/div>\u003ch1>전치사 완전 정복: 시간과 장소를 딱 맞게\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>시간과 장소를 나타내는 전치사의 쓰임을 구분하고, 전치사 뒤에 명사·대명사·동명사가 오는 규칙을 예문으로 익힌다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 문장에서 시간과 장소를 콕 집어 주는 전치사를 배워 볼 거예요. 전치사는 작아 보이지만 at, on, in처럼 쓰임이 달라서 시험에서도 자주 헷갈리는 부분이죠. 오늘은 선생님 자료의 예문을 중심으로 시간 전치사와 장소 전치사를 구분하고, 전치사 뒤에 어떤 형태가 오는지까지 차근차근 정리해 봅시다.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 3\u003c/span>\u003ch2 class=\"g-h\">시간을 나타내는 전치사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">시간 전치사는 \u003cb class=\"key\">시각\u003c/b>에는 at, \u003cb class=\"key\">요일·날짜\u003c/b>에는 on, \u003cb class=\"key\">월·연도·계절\u003c/b>에는 in을 씁니다. 완료를 기준으로 하는 마감 시점은 by, 계속되는 끝은 until로 구분합니다. 기간은 for, 특정 기간 동안은 during, '~ 이내'는 within으로 나타냅니다.\u003cdiv>\u003cspan class=\"g-formula\">at + 시각 / on + 요일·날짜 / in + 월·연도·계절\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">The meeting starts \u003cspan class=\"fx\">at 3 p.m. on Monday\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">회의는 월요일 오후 3시에 시작한다.\u003c/div>\u003cdiv class=\"g-note\">시각 앞에는 at, 요일 앞에는 on을 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">I will finish \u003cspan class=\"fx\">by Friday\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나는 금요일까지 끝낼 것이다.\u003c/div>\u003cdiv class=\"g-note\">완료의 마감 시점은 by로 나타냅니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">She worked there \u003cspan class=\"fx\">for five years\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 거기서 5년 동안 일했다.\u003c/div>\u003cdiv class=\"g-note\">기간 전체는 for로 나타냅니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>\u003cb class=\"key\">by\u003c/b>는 '~까지 완료', \u003cb class=\"key\">until\u003c/b>은 '~까지 계속'이라는 차이를 꼭 구분하세요. 기간 앞에는 보통 \u003cb class=\"key\">for\u003c/b>를 씁니다.\u003c/div>","segs":[{"n":2,"text":"시간을 나타내는 전치사는 기준에 따라 골라 써야 해요. 시각 앞에는 at을 쓰고, 요일이나 날짜 앞에는 on을 씁니다. 월이나 연도, 계절 앞에는 in을 쓰죠. 그리고 by는 그때까지 끝낸다는 마감의 느낌이고, until은 그때까지 계속한다는 느낌이에요. 기간 전체를 말할 때는 for, 특정 기간 동안을 말할 때는 during, 어떤 기간 이내를 말할 때는 within을 씁니다.","hl":"rule"},{"n":3,"text":"첫 번째 예문은 The meeting starts at three p.m. on Monday입니다. 뜻은 회의는 월요일 오후 세 시에 시작한다는 거예요. 여기서 시각 앞에는 at, 요일 앞에는 on이 쓰였죠.","hl":"ex-0"},{"n":4,"text":"두 번째 예문은 I will finish by Friday입니다. 뜻은 나는 금요일까지 끝낼 것이라는 거예요. 여기서 by는 금요일이라는 마감 시점까지 완료한다는 느낌을 줍니다.","hl":"ex-1"},{"n":5,"text":"세 번째 예문은 She worked there for five years입니다. 뜻은 그녀는 거기서 다섯 해 동안 일했다는 거예요. for 뒤에 기간이 와서 얼마 동안인지를 보여 줍니다.","hl":"ex-2"},{"n":6,"text":"많이 헷갈리는 부분이 by와 until이에요. by는 그 시점까지 끝내는 완료의 느낌이고, until은 그 시점까지 계속하는 지속의 느낌입니다. 그리고 얼마 동안이라는 기간 앞에는 for를 쓴다는 점도 기억해 두세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 3\u003c/span>\u003ch2 class=\"g-h\">장소와 방향을 나타내는 전치사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">장소를 나타낼 때 \u003cb class=\"key\">at\u003c/b>은 특정 지점, \u003cb class=\"key\">in\u003c/b>은 공간 안, \u003cb class=\"key\">on\u003c/b>은 표면 위를 뜻합니다. 이동의 방향은 to, toward, into, through 등으로 나타냅니다. 같은 장소라도 '점, 공간, 표면' 중 무엇을 강조하는지에 따라 전치사가 달라집니다.\u003cdiv>\u003cspan class=\"g-formula\">at + 지점 / in + 공간 안 / on + 표면 위\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">He is \u003cspan class=\"fx\">at the bus stop\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그는 버스 정류장에 있다.\u003c/div>\u003cdiv class=\"g-note\">특정 지점을 나타낼 때 at을 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">The book is \u003cspan class=\"fx\">on the desk\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그 책은 책상 위에 있다.\u003c/div>\u003cdiv class=\"g-note\">표면 위에 닿아 있을 때 on을 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">She walked \u003cspan class=\"fx\">into the room\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그녀는 방 안으로 걸어 들어갔다.\u003c/div>\u003cdiv class=\"g-note\">밖에서 안으로 들어가는 방향은 into로 나타냅니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>\u003cb class=\"key\">at\u003c/b>은 넓은 공간 안이라기보다 한 지점, \u003cb class=\"key\">on\u003c/b>은 접촉한 표면을 떠올리면 쉽습니다.\u003c/div>","segs":[{"n":7,"text":"장소를 말할 때도 전치사를 구분해야 해요. at은 버스 정류장처럼 특정 지점을 가리키고, in은 방이나 상자처럼 공간 안을 가리킵니다. on은 책상 위처럼 표면 위에 닿아 있는 느낌이에요. 이동의 방향을 말할 때는 to, toward, into, through 같은 전치사를 씁니다. 같은 장소라도 무엇을 강조하느냐에 따라 at, in, on이 달라진다는 점이 중요합니다.","hl":"rule"},{"n":8,"text":"이 예문은 He is at the bus stop입니다. 뜻은 그는 버스 정류장에 있다는 거예요. 버스 정류장이라는 특정 지점을 가리키므로 at을 썼습니다.","hl":"ex-0"},{"n":9,"text":"다음 예문은 The book is on the desk입니다. 뜻은 그 책이 책상 위에 있다는 거예요. 책상 표면 위에 놓여 있으므로 on이 자연스럽습니다.","hl":"ex-1"},{"n":10,"text":"이 예문은 She walked into the room입니다. 뜻은 그녀가 방 안으로 걸어 들어갔다는 거예요. 밖에서 공간 안으로 들어가는 방향을 into가 보여 줍니다.","hl":"ex-2"},{"n":11,"text":"at은 지도 위의 한 점처럼 특정 지점을 떠올리면 좋아요. on은 무언가에 닿아 있는 표면을 떠올리면 이해하기 쉽습니다.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 3 / 3\u003c/span>\u003ch2 class=\"g-h\">전치사 뒤에 오는 형태\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">전치사 뒤에는 \u003cb class=\"key\">명사\u003c/b>, \u003cb class=\"key\">대명사\u003c/b>, \u003cb class=\"key\">동명사\u003c/b>가 옵니다. 동사는 전치사 뒤에서 반드시 동명사 형태로 바꿔야 합니다. 전치사의 목적어 자리에 동사 원형을 그대로 쓰지 않도록 주의하세요.\u003cdiv>\u003cspan class=\"g-formula\">전치사 + 명사 / 대명사 / 동명사\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">I am interested \u003cspan class=\"fx\">in music\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">나는 음악에 관심이 있다.\u003c/div>\u003cdiv class=\"g-note\">전치사 in 뒤에 명사 music이 왔습니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">This gift is \u003cspan class=\"fx\">for you\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">이 선물은 너를 위한 것이다.\u003c/div>\u003cdiv class=\"g-note\">전치사 for 뒤에 대명사 you가 왔습니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cspan class=\"g-add\">보충 예문\u003c/span>\u003cdiv class=\"g-en\">He is good \u003cspan class=\"fx\">at playing\u003c/span> the guitar.\u003c/div>\u003cdiv class=\"g-ko\">그는 기타를 잘 친다.\u003c/div>\u003cdiv class=\"g-note\">전치사 at 뒤의 동사는 동명사 playing으로 씁니다.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>전치사 뒤 동사 자리에는 \u003cb class=\"key\">동명사\u003c/b>를 쓰고, \u003cb class=\"key\">to부정사\u003c/b>를 쓰지 않도록 주의하세요.\u003c/div>","segs":[{"n":12,"text":"전치사 뒤에는 명사, 대명사, 동명사가 올 수 있어요. 예를 들어 명사가 오면 전치사의 목적어가 되고, 대명사가 오면 for you처럼 쓰입니다. 동사가 오고 싶을 때는 동사 원형 그대로가 아니라 동명사로 바꿔야 해요. 그래서 전치사 뒤의 동사는 ing 형태가 된다는 점을 꼭 기억해 주세요.","hl":"rule"},{"n":13,"text":"이 예문은 I am interested in music입니다. 뜻은 나는 음악에 관심이 있다는 거예요. 전치사 in 뒤에 명사 music이 왔죠.","hl":"ex-0"},{"n":14,"text":"다음 예문은 This gift is for you입니다. 뜻은 이 선물이 너를 위한 것이라는 거예요. 전치사 for 뒤에 대명사 you가 온 모습을 볼 수 있습니다.","hl":"ex-1"},{"n":15,"text":"이 예문은 He is good at playing the guitar입니다. 뜻은 그가 기타를 잘 친다는 거예요. 전치사 at 뒤에서 동사는 playing이라는 동명사 형태로 쓰였습니다.","hl":"ex-2"},{"n":16,"text":"전치사 뒤에 동사가 오면 동명사를 써야 해요. to부정사를 그대로 넣으면 틀리는 경우가 많으니 조심하세요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>I will finish until Friday.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ I will finish by Friday.\u003c/div>\u003cdiv class=\"g-why\">완료의 마감 시점은 until이 아니라 by로 나타냅니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>She worked there during five years.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ She worked there for five years.\u003c/div>\u003cdiv class=\"g-why\">기간 전체를 나타낼 때는 during이 아니라 for를 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-2\">\u003cdiv class=\"g-wrong\">✗ \u003cs>He is good at play the guitar.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ He is good at playing the guitar.\u003c/div>\u003cdiv class=\"g-why\">전치사 at 뒤의 동사는 동명사 형태로 써야 합니다.\u003c/div>\u003c/div>","segs":[{"n":17,"text":"많이 틀리는 문장이 I will finish until Friday예요. 금요일까지 끝낸다는 완료의 의미이므로 by를 써서 I will finish by Friday라고 해야 합니다. until은 금요일까지 계속한다는 지속의 느낌이라는 점도 기억해 주세요.","hl":"mk-0"},{"n":18,"text":"She worked there during five years라고 쓰면 어색해요. 오 년이라는 기간 전체를 말할 때는 for를 써서 She worked there for five years라고 해야 합니다. during은 특정 기간 동안이라는 뜻으로 쓰입니다.","hl":"mk-1"},{"n":19,"text":"He is good at play the guitar는 틀린 문장이에요. 전치사 at 뒤에 동사가 오므로 동명사로 바꿔 He is good at playing the guitar라고 해야 합니다. 전치사 뒤에는 동명사가 온다는 규칙을 떠올려 주세요.","hl":"mk-2"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 6\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">빈칸에 들어갈 전치사로 알맞은 것을 고르세요.\u003c/div>\u003cdiv class=\"g-qs\">The meeting starts ____ 3 p.m. on Monday.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>①\u003c/b>at\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>②\u003c/b>on\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>in\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>by\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">at\u003c/span>\u003cdiv class=\"g-exp\">시각 앞에는 at을 씁니다. 요일 앞의 on은 이미 문장에 있으므로 빈칸에는 at이 알맞습니다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=
