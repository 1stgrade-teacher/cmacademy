</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"왓츠 리딩 100B Ch.5 Unit 02 A Gift for a Country","audioDir":"reading02_audio","preview":false,"count":42,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.400em\">Ch.5 Unit 02\u003cbr>A Gift for\u003cbr>a Country\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">왓츠 리딩 100B\u003c/div>\u003ch1>Animal Gifts Between Countries\u003c/h1>\u003ch2>나라 사이의 동물 선물\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">한 줄 요약\u003c/span>\u003cspan>동물은 한 나라의 \u003cb class=\"key\">상징\u003c/b>이에요. 나라들은 \u003cb class=\"key\">토종 \u003c/b>\u003cb class=\"key\">동물\u003c/b>을 선물로 보내 다른 나라와의 유대관계를 보여 주지만, \u003cb class=\"key\">받지 \u003c/b>\u003cb class=\"key\">않는\u003c/b> 경우도 있어요.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Countries use their native animals as symbols and gifts to show ties with other countries, but they don't always accept these gifts.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘도 만나서 반가워요. 오늘은 나라를 대표하는 동물 이야기를 읽어 볼 거예요. 어떤 동물들이 다른 나라로 선물을 떠났는지 함께 알아봐요. 오늘 글은 나라들이 토종 동물을 선물로 보내 유대관계를 보여 준다는 내용이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">미리 알면 쉬워요\u003c/span>\u003cdiv class=\"lp-box\">나라마다 그 나라를 대표하는 동물이 있어요. 중국은 \u003cb class=\"key\">판다\u003c/b>, 호주는 \u003cb class=\"key\">코알라\u003c/b>, 태국은 \u003cb class=\"key\">코끼리\u003c/b>가 나라의 상징이에요. 이렇게 나라를 대표하는 동물을 national animal이라고 불러요. 또 다른 나라와 친해지고 싶을 때 그 동물을 \u003cb class=\"key\">선물\u003c/b>(gift)로 보내기도 해요. 우리가 제일 아끼는 인형을 친한 친구에게 선물하는 것과 비슷하답니다.\u003c/div>","segs":[{"n":2,"text":"여러분, 중국 하면 어떤 동물이 떠오르나요? 바로 판다죠. 호주는 코알라, 태국은 코끼리가 나라를 대표해요. 이렇게 나라를 대표하는 동물을 national animal이라고 해요. 나라들은 친해지고 싶을 때 이런 동물을 gift, 즉 선물로 보내기도 해요. 여러분이 제일 아끼는 인형을 친한 친구에게 선물하는 것과 비슷하답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>동물은 나라의 상징\u003csmall>소개 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>어떤 동물들은 한 나라의 \u003cb class=\"key\">상징\u003c/b>이에요. 중국은 \u003cb class=\"key\">판다\u003c/b>, 호주는 \u003cb class=\"key\">코알라\u003c/b>, 태국은 \u003cb class=\"key\">코끼리\u003c/b>로 나라를 나타내요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>선물로 보내는 동물\u003csmall>이유 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>나라들은 다른 나라와의 \u003cb class=\"key\">유대관계\u003c/b>를 보여 주려고 동물을 이용해요. 그래서 자기 나라의 \u003cb class=\"key\">토종 \u003c/b>\u003cb class=\"key\">동물\u003c/b>을 선물로 보내기도 해요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>기린과 판다 선물\u003csmall>예시 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>1800년대에 이집트 지도자가 영국, 오스트리아, 프랑스의 왕에게 \u003cb class=\"key\">기린\u003c/b>을 선물했어요. 중국도 \u003cb class=\"key\">국보\u003c/b>인 자이언트 판다를 다른 나라로 보내요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>받지 않은 선물\u003csmall>바뀜 · 문장 7–10\u003c/small>\u003c/h4>\u003cp>하지만 나라들이 항상 선물을 받는 건 아니에요. 태국이 1860년대에 미국에 \u003cb class=\"key\">코끼리\u003c/b>를 보내려 했지만, \u003cb class=\"key\">링컨\u003c/b> 대통령은 이미 더 좋은 \u003cb class=\"key\">운송 \u003c/b>\u003cb class=\"key\">수단\u003c/b>이 있다며 받지 않았어요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 글의 흐름을 따라 첫 번째 문장부터 마지막 문장까지 함께 걸어 볼까요?","hl":null},{"n":4,"text":"먼저 첫 번째 문장이에요. 어떤 동물들은 한 나라의 symbol, 즉 상징이에요. 두 번째 문장에서 중국은 판다, 호주는 코알라, 태국은 코끼리라고 알려 줘요. 나라마다 자기 동물을 아주 자랑스럽게 생각한답니다.","hl":"f0"},{"n":5,"text":"세 번째 문장에서는 나라들이 다른 나라와의 유대관계를 보여 주려고 동물을 이용한다고 해요. 그래서 네 번째 문장처럼 자기 나라의 native animals, 토종 동물을 선물로 보내기도 해요. 친구에게 내가 좋아하는 것을 나눠 주는 마음과 같아요.","hl":"f1"},{"n":6,"text":"다섯 번째 문장은 기린 이야기예요. 약 이백 년 전에 이집트 지도자가 영국, 오스트리아, 프랑스의 왕에게 기린을 선물했어요. 여섯 번째 문장에서는 중국이 national treasure, 국보인 자이언트 판다를 다른 나라로 보낸다고 해요.","hl":"f2"},{"n":7,"text":"그런데 일곱 번째 문장에서 however, 하지만 나라들이 항상 선물을 받지는 않는다고 해요. 여덟 번째 문장처럼 태국은 미국에 코끼리를 보내려고 했어요. 아홉 번째 문장에서 링컨 대통령은 그 선물을 받지 않았어요. 열 번째 문장에서 미국에는 이미 다른, 더 좋은 종류의 transportation, 운송 수단이 있다고 말했답니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">설명하는 글(예시를 들어 알려 주기)\u003c/span>\u003cspan class=\"lp-pill\">처음\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 '동물은 나라의 상징'이라는 \u003cb class=\"key\">중심 \u003c/b>\u003cb class=\"key\">생각\u003c/b>을 바로 말해요. 그다음 기린, 판다, 코끼리 같은 \u003cb class=\"key\">예시\u003c/b>를 들어 차례대로 보여 줘요. 중간에는 '하지만'을 써서 반대되는 경우까지 알려 줘요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>For example (5)\u003c/b>\u003cspan>예시를 들려고\u003c/span>\u003cb>Also (6)\u003c/b>\u003cspan>내용을 더하려고\u003c/span>\u003cb>However (7)\u003c/b>\u003cspan>반대 내용을 알려 주려고\u003c/span>\u003cb>For example (8)\u003c/b>\u003cspan>예시를 들려고\u003c/span>\u003cb>But (9)\u003c/b>\u003cspan>앞과 반대되는 내용\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">their native animals\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">giraffes\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">its national treasure, giant pandas\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">elephants\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the gift\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>선물을 받은 경우\u003c/th>\u003cth>선물을 받지 않은 경우\u003c/th>\u003c/tr>\u003ctr>\u003ctd>영국·오스트리아·프랑스는 기린을 받았어요\u003c/td>\u003ctd>미국은 코끼리를 받지 않았어요\u003c/td>\u003c/tr>\u003ctr>\u003ctd>중국은 판다를 국보로 보내요\u003c/td>\u003ctd>링컨 대통령은 더 좋은 운송 수단이 있다고 했어요\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 설명하는 글이에요. 중심 문장은 맨 처음인 첫 번째 문장에 나와요. 처음에 주제를 딱 말하고, 그 뒤에 예시를 하나씩 보여 주는 짜임이에요.","hl":"ty"},{"n":9,"text":"길잡이 말도 눈여겨봐요. 다섯 번째 문장의 for example은 예시를 들 때 쓰는 말이에요. 일곱 번째 문장의 however는 앞 내용과 반대되는 이야기를 시작한답니다. 그리고 같은 동물을 native animals, giraffes, giant pandas, elephants, the gift처럼 여러 이름으로 부르고 있어요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 단어\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>symbol\u003c/b>\u003cem>명사\u003c/em>\u003cspan>상징\u003c/span>\u003c/div>\u003cdiv>\u003cb>country\u003c/b>\u003cem>명사\u003c/em>\u003cspan>나라\u003c/span>\u003c/div>\u003cdiv>\u003cb>panda\u003c/b>\u003cem>명사\u003c/em>\u003cspan>판다\u003c/span>\u003c/div>\u003cdiv>\u003cb>koala\u003c/b>\u003cem>명사\u003c/em>\u003cspan>코알라\u003c/span>\u003c/div>\u003cdiv>\u003cb>elephant\u003c/b>\u003cem>명사\u003c/em>\u003cspan>코끼리\u003c/span>\u003c/div>\u003cdiv>\u003cb>tie\u003c/b>\u003cem>명사\u003c/em>\u003cspan>유대관계, 이어 주는 것\u003c/span>\u003c/div>\u003cdiv>\u003cb>sometimes\u003c/b>\u003cem>부사\u003c/em>\u003cspan>때때로\u003c/span>\u003c/div>\u003cdiv>\u003cb>native\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>토종의, 원래 그 나라에 사는\u003c/span>\u003c/div>\u003cdiv>\u003cb>gift\u003c/b>\u003cem>명사\u003c/em>\u003cspan>선물\u003c/span>\u003c/div>\u003cdiv>\u003cb>for example\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>예를 들어\u003c/span>\u003c/div>\u003cdiv>\u003cb>leader\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지도자\u003c/span>\u003c/div>\u003cdiv>\u003cb>giraffe\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기린\u003c/span>\u003c/div>\u003cdiv>\u003cb>national treasure\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>국보\u003c/span>\u003c/div>\u003cdiv>\u003cb>giant\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>거대한, 아주 큰\u003c/span>\u003c/div>\u003cdiv>\u003cb>however\u003c/b>\u003cem>부사\u003c/em>\u003cspan>하지만\u003c/span>\u003c/div>\u003cdiv>\u003cb>accept\u003c/b>\u003cem>동사\u003c/em>\u003cspan>받다, 받아들이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>try\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(해 보려고) 시도하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>president\u003c/b>\u003cem>명사\u003c/em>\u003cspan>대통령\u003c/span>\u003c/div>\u003cdiv>\u003cb>already\u003c/b>\u003cem>부사\u003c/em>\u003cspan>이미\u003c/span>\u003c/div>\u003cdiv>\u003cb>transportation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>운송 수단, 탈것\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"오늘의 단어도 소리 내어 읽어 볼까요? symbol은 상징, native는 토종의라는 뜻이에요. accept는 받아들이다, transportation은 운송 수단이라는 뜻이죠. gift는 선물, leader는 지도자라는 뜻도 함께 기억해요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">accept\u003c/b>\u003cspan class=\"m\">받아들이다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">receive\u003c/span>\u003cspan class=\"s\">take\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">refuse\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">gift\u003c/b>\u003cspan class=\"m\">선물\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">present\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">native\u003c/b>\u003cspan class=\"m\">토종의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">local\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">foreign\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">sometimes\u003c/b>\u003cspan class=\"m\">때때로\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">now and then\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">never\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">send\u003c/b>\u003cspan class=\"m\">보내다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">mail\u003c/span>\u003cspan class=\"s\">deliver\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">receive\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"비슷한 말과 반대말도 함께 익혀 봐요. accept는 receive와 비슷하고 refuse와는 반대예요. gift는 present와 같은 말이에요. native는 local과 비슷하고 foreign과 반대된답니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 10\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 동물들은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Some \u003c/span>\u003cspan class=\"tgt\">animals \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상징입니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">are\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">symbol \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 나라의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">country\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어떤 동물들은 한 나라의 상징입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 동물이 나라를 대표하는 \u003cb class=\"key\">상징\u003c/b>이 된다고 말하며 글의 \u003cb class=\"key\">주제\u003c/b>를 처음 꺼내는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사(be동사)\u003c/span> : 무엇이(Some animals) + 이다(are) + 무엇(a symbol) : \"어떤 동물들은 ~입니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사(전치사)\u003c/span> : a symbol + of + a country = 한 나라의 상징 : \"한 나라의 상징\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Some animals, 어떤 동물들은. are a symbol, 상징입니다. of a country, 한 나라의. 이 문장 전체를 해석하면, 어떤 동물들은 한 나라의 상징입니다.","hl":"m"},{"n":13,"text":"이 문장은 글의 주제를 알려 줘요. 어떤 동물들이 나라를 대표하는 상징이 된다는 이야기예요.","hl":"mn"},{"n":14,"text":"먼저 are는 '~이다'라는 뜻의 be동사예요. 주어인 Some animals가 여러 마리라서 복수니까 are를 써요. 그리고 of는 '~의'라는 뜻의 전치사예요. 그래서 a symbol of a country는 한 나라의 상징이라는 뜻이 된답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">판다가 있습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">are\u003c/span> p\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and\u003c/span>as\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">중국을 위한\u003c/span>\u003cspan class=\"en\">for China,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">호주를 위한 코알라,\u003c/span>\u003cspan class=\"en\">koalas for Australia,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 태국을 위한 코끼리가.\u003c/span>\u003cspan class=\"en\">and elephants for Thailand.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">중국에서는 판다, 호주에서는 코알라, 그리고 태국에서는 코끼리가 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 중국은 판다, 호주는 코알라, 태국은 코끼리처럼 나라마다 대표 동물이 있다는 \u003cb class=\"key\">예시\u003c/b>를 드는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">있음 표현(There is/are)\u003c/span> : 무엇이(There) + 있다(are) + 여러 개(pandas) : \"~이 있습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : pandas + and + koalas = 판다 그리고 코알라 : \"그리고\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"There are pandas, 판다가 있습니다. for China, 중국을 위한. koalas for Australia, 호주를 위한 코알라. and elephants for Thailand, 그리고 태국을 위한 코끼리가.. 이 문장 전체를 해석하면, 중국에서는 판다, 호주에서는 코알라, 그리고 태국에서는 코끼리가 있습니다.","hl":"m"},{"n":16,"text":"이 문장은 나라마다 대표 동물이 있다는 예시를 보여 줘요. 중국은 판다, 호주는 코알라, 태국은 코끼리죠.","hl":"mn"},{"n":17,"text":"먼저 There are는 '여러 개가 있다'라는 뜻이에요. 뒤에는 복수인 pandas, koalas, elephants가 와요. 그리고 and는 '그리고'라는 뜻으로 낱말을 쭉 이어 줘요. 소리 내어 세 번 읽어 보면 금방 외워질 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나라들은 동물들을 이용합니다\u003c/span>\u003cspan class=\"en\">Countries use animals\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 유대관계를 보여 주기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">show\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">their\u003c/span> ties\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 나라와의\u003c/span>\u003cspan class=\"en\">with other countries.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나라들은 다른 나라와의 유대관계를 보여 주기 위해 동물들을 이용합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 나라들이 동물을 이용해 다른 나라와의 \u003cb class=\"key\">유대관계\u003c/b>를 보여 준다는 뜻이에요. 왜 동물을 \u003cb class=\"key\">상징\u003c/b>으로 쓰는지 알려 주는 문장이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사(to + 동사원형)\u003c/span> : use animals + to show = 동물을 이용한다 + 보여 주기 위해 : \"보여 주기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">소유격(소유격)\u003c/span> : 그들의(their) + 무엇(ties) : \"그들의\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Countries use animals, 나라들은 동물들을 이용합니다. to show their ties, 그들의 유대관계를 보여 주기 위해. with other countries, 다른 나라와의. 이 문장 전체를 해석하면, 나라들은 다른 나라와의 유대관계를 보여 주기 위해 동물들을 이용합니다.","hl":"m"},{"n":19,"text":"나라들은 동물을 이용해서 다른 나라와의 유대관계를 보여 줘요. 우리가 나라마다 동물을 상징으로 쓰는 이유가 바로 여기 있답니다.","hl":"mn"},{"n":20,"text":"먼저 to show는 '보여 주기 위해'라는 뜻의 to부정사예요. 어떤 목적이 있는지 알려 주죠. 그리고 their는 '그들의'라는 뜻으로 뒤에 오는 명사를 꾸며 줘요. 여러분도 their mom, 그들의 엄마, 이렇게 말할 수 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나라들은 때때로 보냅니다\u003c/span>\u003cspan class=\"en\">Countries \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">sometimes\u003c/span> send\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 토종 동물들을\u003c/span>\u003cspan class=\"en\">their native animals\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">선물로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">gifts\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나라들은 때때로 선물로 그들의 토종 동물들을 보냅니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 나라들은 가끔 자기 나라에서 원래 사는 동물을 \u003cb class=\"key\">선물\u003c/b>로 보내요. 동물이 나라와 나라를 이어 주는 \u003cb class=\"key\">선물\u003c/b>이 된다는 말이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부사(부사)\u003c/span> : 때때로(sometimes) + 보낸다(send) : \"때때로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사(as) (전치사)\u003c/span> : 무엇으로(as) + 이름 말(gifts) : \"선물로\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Countries sometimes send, 나라들은 때때로 보냅니다. their native animals, 그들의 토종 동물들을. as gifts, 선물로. 이 문장 전체를 해석하면, 나라들은 때때로 선물로 그들의 토종 동물들을 보냅니다.","hl":"m"},{"n":22,"text":"나라들이 가끔 자기 나라에서 원래 사는 동물을 선물로 보낸다는 뜻이에요. 동물이 나라 사이를 이어 주는 선물이 되는 거죠.","hl":"mn"},{"n":23,"text":"먼저 sometimes는 '때때로'라는 부사예요. 동사 앞에서 얼마나 자주 하는지 알려 주죠. 두 번째로 as gifts는 '선물로'라는 뜻이에요. as는 '~로'라는 전치사이고 gifts 앞에 붙어 역할을 말해 줘요. 여러분도 as a gift처럼 쓸 수 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들어, 1800년대에,\u003c/span>\u003cspan class=\"en\">For example, in the 1800s,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 이집트인 지도자가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">Egyptian \u003c/span>\u003cspan class=\"tgt\">leader\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기린을 선물로 주었습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">gave\u003c/span> giraffes as gifts\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왕들에게\u003c/span>\u003cspan class=\"en\">to kings\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">영국, 오스트리아, 그리고 프랑스에\u003c/span>\u003cspan class=\"en\">in England, Austria, and France.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">예를 들어, 1800년대에, 한 이집트인 지도자가 영국, 오스트리아, 그리고 프랑스의 왕에게 기린을 선물로 주었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아주 오래전에 이집트 지도자가 영국, 오스트리아, 프랑스 왕들에게 기린을 \u003cb class=\"key\">선물\u003c/b>로 보냈다는 거예요. 동물을 선물한 진짜 \u003cb class=\"key\">예\u003c/b>를 보여 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">a/an(관사)\u003c/span> : 한 사람(an) + 이집트인(Egyptian) + 지도자(leader) : \"한 이집트인 지도자\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거형(불규칙 과거형)\u003c/span> : 지난 일 + 주었다(gave) + 무엇을(giraffes) : \"주었습니다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"For example, in the 1800s, 예를 들어, 1800년대에. an Egyptian leader, 한 이집트인 지도자가. gave giraffes as gifts, 기린을 선물로 주었습니다. to kings, 왕들에게. in England, Austria, and France, 영국, 오스트리아, 그리고 프랑스에. 이 문장 전체를 해석하면, 예를 들어, 1800년대에, 한 이집트인 지도자가 영국, 오스트리아, 그리고 프랑스의 왕에게 기린을 선물로 주었습니다.","hl":"m"},{"n":25,"text":"오래전에 이집트 지도자가 영국, 오스트리아, 프랑스 왕들에게 기린을 선물로 보냈다는 뜻이에요. 동물을 선물한 진짜 예를 보여 주는 문장이죠.","hl":"mn"},{"n":26,"text":"먼저 gave는 give의 과거형이에요. 이미 지난 일이라 동사가 gave로 바뀐 거죠. 다음으로 an Egyptian leader에서 an은 '한 사람'을 세는 관사예요. Egyptian이 모음 소리로 시작해서 a가 아니라 an을 써요. 그리고 to kings는 '왕들에게'라는 뜻이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또한, 중국은 보냅니다\u003c/span>\u003cspan class=\"en\">Also, China \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">sends\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 나라의 국보인\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">its \u003c/span>\u003cspan class=\"tgt\">national \u003c/span>\u003cspan class=\"tgt\">treasure\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자이언트 판다를\u003c/span>\u003cspan class=\"en\">giant pandas,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 나라들로\u003c/span>\u003cspan class=\"en\">to other countries.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">또한, 중국은 국보인 자이언트 판다를 다른 나라들로 보냅니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 중국이 자기 나라 국보인 자이언트 판다를 다른 나라에 \u003cb class=\"key\">선물\u003c/b>로 보낸다는 말이에요. 앞에 나온 \u003cb class=\"key\">동물 \u003c/b>\u003cb class=\"key\">선물\u003c/b>의 또 다른 예예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">3인칭 단수 -s(3인칭 단수)\u003c/span> : 중국(China) + 보낸다(sends) + 무엇을(pandas) : \"보냅니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">소유격(대명사)\u003c/span> : 그것의(its) + 국보(national treasure) : \"그 나라의 국보\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Also, China sends, 또한, 중국은 보냅니다. its national treasure, 그 나라의 국보인. giant pandas, 자이언트 판다를. to other countries, 다른 나라들로. 이 문장 전체를 해석하면, 또한, 중국은 국보인 자이언트 판다를 다른 나라들로 보냅니다.","hl":"m"},{"n":28,"text":"중국이 자기 나라 국보인 자이언트 판다를 다른 나라에 선물로 보낸다는 뜻이에요. 앞에서 말한 동물 선물의 또 다른 예죠.","hl":"mn"},{"n":29,"text":"먼저 China sends에서 China는 한 나라라서 3인칭 단수예요. 그래서 send 뒤에 s를 붙여 sends로 써요. 두 번째로 its는 '그것의'라는 뜻의 소유격이에요. 나라를 it으로 부르면서 그 나라의 국보라고 말해 주는 거죠. 오늘 세 문장 아주 잘 읽었어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 10\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 나라들은\u003c/span>\u003cspan class=\"en\">However countries\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">항상 받지는 않습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003cspan class=\"tgt\">always \u003c/span>\u003cspan class=\"tgt\">accept\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 나라에서 온 선물을\u003c/span>\u003cspan class=\"en\">gifts \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">other \u003c/span>\u003cspan class=\"tgt\">countries\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 나라들이 항상 다른 나라에서 온 선물을 받지는 않습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 나라들이 다른 나라에서 온 선물을 \u003cb class=\"key\">항상\u003c/b> 받는 것은 아니라는 뜻이에요. 앞에서 선물 이야기를 했지만 \u003cb class=\"key\">예외\u003c/b>가 있다는 것을 알려 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">일반동사 부정문(do/does/did 부정문)\u003c/span> : 누가(Countries) + don't + always + 동사원형(accept) = 항상 ~하지는 않다 : \"항상 받지는 않다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사(장소·시간 짝꿍 말)\u003c/span> : from + 다른 나라(other countries) = 다른 나라에서 온 : \"다른 나라에서 온\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"However countries, 하지만 나라들은. don't always accept, 항상 받지는 않습니다. gifts from other countries, 다른 나라에서 온 선물을. 이 문장 전체를 해석하면, 하지만 나라들이 항상 다른 나라에서 온 선물을 받지는 않습니다.","hl":"m"},{"n":31,"text":"이 문장은 나라들이 다른 나라에서 온 선물을 항상 받는 것은 아니라는 뜻이에요. 앞에서 선물 이야기를 했지만 예외가 있다는 것을 알려 줘요.","hl":"mn"},{"n":32,"text":"첫 번째로 don't는 아닌다는 뜻을 만드는 도와주는 말이에요. accept 앞에 와서 부정의 뜻을 더해요. 두 번째로 from은 어디서 왔는지 알려 주는 전치사예요. gifts from other countries는 다른 나라에서 온 선물이라는 뜻이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들어, 1860년대에, 이집트의 한 지도자가 기린을 선물로 주었습니다 왕들에게 영국, 오스트리아, 프랑스에 있는\u003c/span>\u003cspan class=\"en\">For example, Thailand tried to send elephants to America in the 1860s.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">예를 들어, 태국은 1860년대에 미국으로 코끼리를 보내려고 했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 태국이 미국에 코끼리를 선물로 보내려 했던 \u003cb class=\"key\">예시\u003c/b>를 보여 줘요. 나라가 동물을 \u003cb class=\"key\">선물\u003c/b>로 보내는 일이 실제로 있었음을 알려 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">과거형(불규칙 과거형)\u003c/span> : 누가(leader) + gave + 무엇을(giraffes) = 주었다 : \"주었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">전치사(장소·시간 짝꿍 말)\u003c/span> : to + 사람(kings) = ~에게 : \"왕들에게\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"For example, 예를 들어. in the 1860s, 1860년대에. an Egyptian leader, 이집트의 한 지도자가. gave giraffes as gifts, 기린을 선물로 주었습니다. to kings, 왕들에게. in England, Austria, and France, 영국, 오스트리아, 프랑스에 있는. 이 문장 전체를 해석하면, 예를 들어, 태국은 1860년대에 미국으로 코끼리를 보내려고 했습니다.","hl":"m"},{"n":34,"text":"이 문장은 태국이 미국에 코끼리를 선물로 보내려 했던 예시를 보여 줘요. 나라가 동물을 선물로 보내는 일이 실제로 있었음을 알려 줘요.","hl":"mn"},{"n":35,"text":"첫 번째로 gave는 give의 과거형이에요. 지난 일을 말하니까 동사가 gave로 바뀌었어요. 두 번째로 to는 선물을 받는 대상을 알려 줘요. gave giraffes to kings는 왕들에게 기린을 주었다는 뜻이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 대통령은,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">But\u003c/span> the president,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Abraham Lincoln은,\u003c/span>\u003cspan class=\"en\">Abraham Lincoln,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 선물을 받지 않았습니다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">didn't \u003c/span>\u003cspan class=\"tgt\">accept\u003c/span> the gift.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 Abraham Lincoln 대통령은 그 선물을 받지 않았습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 링컨 대통령이 태국이 보내려던 코끼리 선물을 \u003cb class=\"key\">거절\u003c/b>했다는 내용이에요. 선물을 보내도 \u003cb class=\"key\">받지 \u003c/b>\u003cb class=\"key\">않을\u003c/b> 수 있다는 점을 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사(이어 주는 말)\u003c/span> : But + 문장 = 하지만 ~ : \"그러나\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거 부정문(일반동사 과거 부정문)\u003c/span> : 누가(He) + didn't + 동사원형(accept) = ~하지 않았다 : \"받지 않았다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"But the president, 그러나 대통령은. Abraham Lincoln, Abraham Lincoln은. didn't accept the gift, 그 선물을 받지 않았습니다.. 이 문장 전체를 해석하면, 그러나 Abraham Lincoln 대통령은 그 선물을 받지 않았습니다.","hl":"m"},{"n":37,"text":"이 문장은 링컨 대통령이 태국이 보내려던 코끼리 선물을 거절했다는 내용이에요. 선물을 보내도 받지 않을 수 있다는 점을 보여 줘요.","hl":"mn"},{"n":38,"text":"첫 번째로 But은 앞 문장과 반대되는 생각을 이어 줘요. 앞에서 선물을 보냈다는 말과 반대되는 내용이 이어져요. 두 번째로 didn't는 과거에 하지 않았다는 뜻을 만드는 말이에요. 뒤에는 동사원형 accept가 와요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 말했습니다\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">said\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미국이 이미 가지고 있었다고\u003c/span>\u003cspan class=\"en\">that America \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">already\u003c/span> had\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른, 더 좋은 종류의\u003c/span>\u003cspan class=\"en\">other, \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">better\u003c/span> types\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">운송 수단을\u003c/span>\u003cspan class=\"en\">of transportation.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 미국에는 이미 다른 더 좋은 종류의 운송 수단이 있다고 말했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 링컨 대통령이 코끼리 선물을 받지 않은 까닭을 알려 주는 문장이에요. 미국에는 \u003cb class=\"key\">운송 \u003c/b>\u003cb class=\"key\">수단\u003c/b>이 이미 더 좋은 게 있다는 \u003cb class=\"key\">이유\u003c/b>를 밝히고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(He) + 말했다(said) : \"그는 말했습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">더 자세히 알려 주는 말(부사)\u003c/span> : 이미(already) + 동사(had) : \"이미\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">더 ~한(비교급)\u003c/span> : 더 좋은(better) + 무엇(types) : \"더 좋은\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"He said, 그는 말했습니다. that America already had, 미국이 이미 가지고 있었다고. other, better types, 다른, 더 좋은 종류의. of transportation, 운송 수단을. 이 문장 전체를 해석하면, 그는 미국에는 이미 다른 더 좋은 종류의 운송 수단이 있다고 말했습니다.","hl":"m"},{"n":40,"text":"이 문장은 링컨 대통령이 코끼리 선물을 왜 받지 않았는지 알려 줘요. 미국에는 이미 다른 더 좋은 운송 수단이 있다는 이유를 말한 거예요.","hl":"mn"},{"n":41,"text":"첫 번째, said는 say의 과거형이에요. 지난 일을 말하니까 모양이 이렇게 바뀐 거죠. 두 번째, already는 '이미'라는 뜻으로 동사 앞에 살짝 놓여요. 세 번째, better는 good의 비교급이에요. '더 좋은'이라는 뜻으로 뒤에 오는 명사를 꾸며 줘요. 여러분도 other, better types처럼 말해 보세요. 잘했어요!","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">오늘 배운 내용 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>동물은 한 나라의 \u003cb class=\"key\">상징\u003c/b>이에요.\u003c/li>\u003cli>나라들은 \u003cb class=\"key\">토종 \u003c/b>\u003cb class=\"key\">동물\u003c/b>을 선물로 보내 유대관계를 보여 줘요.\u003c/li>\u003cli>기린, 판다, 코끼리 같은 \u003cb class=\"key\">예시\u003c/b>가 차례대로 나와요.\u003c/li>\u003cli>하지만 선물을 \u003cb class=\"key\">받지 \u003c/b>\u003cb class=\"key\">않는\u003c/b> 경우도 있다는 걸 기억해요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Countries use their native animals as symbols and gifts to show ties with other countries, but they don't always accept these gifts.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">동물은 한 나라의 \u003cb class=\"key\">상징\u003c/b>이에요. 나라들은 \u003cb class=\"key\">토종 \u003c/b>\u003cb class=\"key\">동물\u003c/b>을 선물로 보내 다른 나라와의 유대관계를 보여 주지만, \u003cb class=\"key\">받지 \u003c/b>\u003cb class=\"key\">않는\u003c/b> 경우도 있어요.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":42,"text":"오늘 우리는 나라를 대표하는 동물과 동물 선물 이야기를 배웠어요. 동물은 나라의 상징이고, 나라 사이의 유대관계를 보여 주는 선물이기도 해요. 하지만 항상 받는 것은 아니라는 점도 꼭 기억해요. 오늘도 끝까지 잘 들었어요, 정말 멋졌어요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
