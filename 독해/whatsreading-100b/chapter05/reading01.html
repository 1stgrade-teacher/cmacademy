</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"왓츠 리딩 100B Ch.5 Unit 01 The Giraffe in Paris","audioDir":"reading01_audio","preview":false,"count":48,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.400em\">Ch.5 Unit 01\u003cbr>The Giraffe\u003cbr>in Paris\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">왓츠 리딩 100B\u003c/div>\u003ch1>Zarafa: The Giraffe Who Walked to Paris\u003c/h1>\u003ch2>자라파: 파리까지 걸어간 기린\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">한 줄 요약\u003c/span>\u003cspan>우리 가족이 동물원에서 기린을 보던 날, 아빠가 유럽에 처음 온 기린 중 하나인 \u003cb class=\"key\">Zarafa\u003c/b> 이야기를 들려주셨어요. Zarafa는 프랑스 왕에게 주는 \u003cb class=\"key\">선물\u003c/b>로 잡혀 배를 타고 바다를 건너 걸어서 파리까지 갔고, 그 이야기를 듣고 나는 동물들이 \u003cb class=\"key\">스스로 \u003c/b>\u003cb class=\"key\">선택하지 \u003c/b>\u003cb class=\"key\">못한 \u003c/b>\u003cb class=\"key\">채\u003c/b> 고향을 떠난다는 것이 안타까웠어요.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Zarafa, a baby giraffe given as a gift to the king of France, sailed across the sea and walked all the way to Paris, and her story made the writer feel sad because animals cannot choose to leave their homes.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘 만나 볼 이야기는 프랑스 파리까지 걸어간 기린에 대한 이야기예요. 아주 먼 옛날, 배를 타고 바다를 건너고 두 다리로 팔백팔십 킬로미터를 걸은 기린이 있었어요. 이름은 Zarafa예요. 우리 가족이 동물원에서 기린을 보던 날, 아빠가 들려주신 이 이야기를 함께 읽어 볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">미리 알면 쉬워요\u003c/span>\u003cdiv class=\"lp-box\">1820년대에는 아프리카에 사는 동물을 다른 나라 왕에게 \u003cb class=\"key\">선물\u003c/b>로 보내는 일이 있었어요. 그때는 비행기가 없어서 동물들은 배를 타고 아주 먼 길을 가야 했죠. 기린은 키가 크고 몸이 커서 배에 타는 것도 아주 힘들었대요. 여러분이 동물원 animal 친구들을 볼 때, 그 친구들이 어디서 왔는지 생각해 본 적 있나요? 우리가 친구 집에 놀러 갈 때는 내가 가고 싶어서 가지만, 동물들은 자기 뜻과 상관없이 먼 곳으로 가야 할 때가 많아요.\u003c/div>","segs":[{"n":2,"text":"여러분, 혹시 동물원에 있는 기린이 어디에서 왔는지 생각해 본 적 있나요? 이 이야기가 일어난 천팔백이십칠 년에는 비행기가 없었어요. 그래서 동물을 다른 나라로 보낼 때는 배를 타고 아주 오래 걸려서 가야 했어요. 기린은 키가 크고 몸이 커서 배에 타는 것도 아주 힘들었대요. 친구 집에 놀러 갈 때는 내가 가고 싶어서 가지만, 동물들은 자기 뜻과 상관없이 먼 곳으로 가야 할 때가 많아요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>동물원에서 시작\u003csmall>시작 · 문장 1–4\u003c/small>\u003c/h4>\u003cp>우리 가족이 어제 동물원에 가서 \u003cb class=\"key\">기린\u003c/b>을 보고 있었어요. 그때 아빠가 \u003cb class=\"key\">Zarafa\u003c/b> 이야기를 해 주셨어요. Zarafa는 1827년 프랑스 왕에게 주는 \u003cb class=\"key\">선물\u003c/b>이었고, 잡혔을 때는 아주 어린 \u003cb class=\"key\">새끼\u003c/b>였어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>배 타고 걸어서\u003csmall>이동 · 문장 5–7\u003c/small>\u003c/h4>\u003cp>Zarafa는 \u003cb class=\"key\">나일 \u003c/b>\u003cb class=\"key\">강\u003c/b>을 따라 배를 타고 내려와서 \u003cb class=\"key\">대양\u003c/b>을 건넜어요. 프랑스에 도착한 뒤에는 \u003cb class=\"key\">걸어서\u003c/b> 파리까지 갔어요. 육 주 동안 약 880킬로미터를 걸었대요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>파리의 환영\u003csmall>결과 · 문장 8–10\u003c/small>\u003c/h4>\u003cp>파리의 모든 사람들이 Zarafa를 크게 \u003cb class=\"key\">환영\u003c/b>했어요. 어떤 사람들은 그녀를 \u003cb class=\"key\">아름다운 \u003c/b>\u003cb class=\"key\">아프리카인\u003c/b>이라고 불렀어요. 프랑스에 다른 기린이 없어서 그냥 '그 기린'이라고 부른 사람들도 있었어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>글쓴이의 마음\u003csmall>마무리 · 문장 11–12\u003c/small>\u003c/h4>\u003cp>이야기를 듣고 나서 글쓴이는 마음이 \u003cb class=\"key\">안 \u003c/b>\u003cb class=\"key\">좋았\u003c/b>어요. 동물들이 다른 나라에 선물로 보내지는 것이 유감이었죠. 왜냐하면 그들은 고향을 떠나는 것을 \u003cb class=\"key\">선택\u003c/b>하지 않았기 때문이에요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 동물원에서 시작해서 자라파의 긴 여행, 그리고 글쓴이의 마음으로 이어져요.","hl":null},{"n":4,"text":"첫 번째 단계는 동물원에서 이야기가 시작되는 부분이에요. 우리 가족이 어제 동물원에 갔고, 기린을 보고 있을 때 아빠가 Zarafa 이야기를 해 주셨어요. Zarafa는 유럽에 처음 온 기린 중 하나였고, 프랑스 왕에게 주는 선물이었어요. 잡혔을 때는 아주 어린 새끼였대요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 자라파의 긴 여행이에요. Zarafa는 나일 강을 따라 배를 타고 내려와서 대양을 건넜어요. 프랑스에 도착한 뒤에는 걸어서 파리까지 갔어요. 육 주 동안 팔백팔십 킬로미터를 걸었다고 해요.","hl":"f1"},{"n":6,"text":"세 번째 단계에서는 파리 사람들의 환영이 나와요. 사람들은 Zarafa를 크게 환영했어요. 어떤 사람들은 그녀를 아름다운 아프리카인이라고 불렀고, 프랑스에 다른 기린이 없어서 그냥 그 기린이라고 부른 사람들도 있었어요.","hl":"f2"},{"n":7,"text":"네 번째 단계는 글쓴이의 마음이에요. 이야기를 듣고 나서 글쓴이는 마음이 안 좋았어요. 동물들이 다른 나라에 선물로 보내지는 것이 유감이었죠. 그들은 고향을 떠나는 것을 선택하지 않았기 때문이에요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">이야기 순서\u003c/span>\u003cspan class=\"lp-pill\">끝\u003c/span>\u003cspan class=\"lp-pill\">주제문 11번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 일이 일어난 \u003cb class=\"key\">순서\u003c/b>대로 이어지는 이야기예요. 처음에 동물원에서 이야기가 시작되고, 가운데에 Zarafa의 \u003cb class=\"key\">여행\u003c/b>이 나와요. 마지막에 글쓴이의 \u003cb class=\"key\">생각\u003c/b>이 나오기 때문에 중심이 되는 문장은 끝부분에 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>yesterday (1)\u003c/b>\u003cspan>언제 일어난 일인지 알려 줌\u003c/span>\u003cb>When (2)\u003c/b>\u003cspan>~할 때라고 알려 줌\u003c/span>\u003cb>Then (5)\u003c/b>\u003cspan>다음 순서로 넘어감을 알려 줌\u003c/span>\u003cb>When (6)\u003c/b>\u003cspan>~했을 때라고 알려 줌\u003c/span>\u003cb>because (10)\u003c/b>\u003cspan>이유를 알려 줌\u003c/span>\u003cb>After the story (11)\u003c/b>\u003cspan>이야기 다음에 온 일을 알려 줌\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Zarafa\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">one of the first giraffes in Europe\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a gift for the king of France\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a baby\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the Beautiful African\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the giraffe\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 일이 일어난 순서대로 이어지는 이야기 글이에요. 처음에는 동물원에서 이야기가 시작되고, 가운데에는 Zarafa의 여행이 나와요. 마지막에 글쓴이의 생각이 나오기 때문에 중심이 되는 생각은 글의 끝부분에 있어요.","hl":"ty"},{"n":9,"text":"글에는 순서를 알려 주는 말이 숨어 있어요. yesterday와 When은 언제 일이 일어났는지 알려 주고, Then과 After the story는 다음 일로 넘어간다는 것을 알려 줘요. 그리고 같은 기린을 Zarafa, the Beautiful African, the giraffe처럼 여러 이름으로 부르고 있죠.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 단어\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>visit\u003c/b>\u003cem>동사\u003c/em>\u003cspan>방문하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>zoo\u003c/b>\u003cem>명사\u003c/em>\u003cspan>동물원\u003c/span>\u003c/div>\u003cdiv>\u003cb>yesterday\u003c/b>\u003cem>부사\u003c/em>\u003cspan>어제\u003c/span>\u003c/div>\u003cdiv>\u003cb>watch\u003c/b>\u003cem>동사\u003c/em>\u003cspan>지켜보다, 보다\u003c/span>\u003c/div>\u003cdiv>\u003cb>giraffe\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기린\u003c/span>\u003c/div>\u003cdiv>\u003cb>Europe\u003c/b>\u003cem>명사\u003c/em>\u003cspan>유럽\u003c/span>\u003c/div>\u003cdiv>\u003cb>gift\u003c/b>\u003cem>명사\u003c/em>\u003cspan>선물\u003c/span>\u003c/div>\u003cdiv>\u003cb>king\u003c/b>\u003cem>명사\u003c/em>\u003cspan>왕\u003c/span>\u003c/div>\u003cdiv>\u003cb>France\u003c/b>\u003cem>명사\u003c/em>\u003cspan>프랑스\u003c/span>\u003c/div>\u003cdiv>\u003cb>baby\u003c/b>\u003cem>명사\u003c/em>\u003cspan>새끼, 아기\u003c/span>\u003c/div>\u003cdiv>\u003cb>catch\u003c/b>\u003cem>동사\u003c/em>\u003cspan>잡다\u003c/span>\u003c/div>\u003cdiv>\u003cb>sail\u003c/b>\u003cem>동사\u003c/em>\u003cspan>배를 타고 가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>Nile River\u003c/b>\u003cem>명사\u003c/em>\u003cspan>나일 강\u003c/span>\u003c/div>\u003cdiv>\u003cb>across\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~을 가로질러\u003c/span>\u003c/div>\u003cdiv>\u003cb>ocean\u003c/b>\u003cem>명사\u003c/em>\u003cspan>대양, 바다\u003c/span>\u003c/div>\u003cdiv>\u003cb>arrive\u003c/b>\u003cem>동사\u003c/em>\u003cspan>도착하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>on foot\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>걸어서\u003c/span>\u003c/div>\u003cdiv>\u003cb>kilometer\u003c/b>\u003cem>명사\u003c/em>\u003cspan>킬로미터\u003c/span>\u003c/div>\u003cdiv>\u003cb>welcome\u003c/b>\u003cem>명사\u003c/em>\u003cspan>환영\u003c/span>\u003c/div>\u003cdiv>\u003cb>choose\u003c/b>\u003cem>동사\u003c/em>\u003cspan>선택하다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"오늘 꼭 알아 둘 단어를 소리 내어 읽어 볼게요. visited는 방문했다, gift는 선물, catch는 잡다라는 뜻이에요. sail은 배를 타고 가다, arrive는 도착하다, choose는 선택하다라는 뜻이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">gift\u003c/b>\u003cspan class=\"m\">선물\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">present\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">arrive\u003c/b>\u003cspan class=\"m\">도착하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">come\u003c/span>\u003cspan class=\"s\">reach\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">leave\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">choose\u003c/b>\u003cspan class=\"m\">선택하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">pick\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">leave\u003c/b>\u003cspan class=\"m\">떠나다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">go away\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">stay\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">bad\u003c/b>\u003cspan class=\"m\">안 좋은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">sad\u003c/span>\u003cspan class=\"s\">sorry\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">good\u003c/span>\u003cspan class=\"a\">happy\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"비슷한 말과 반대말도 함께 익혀 볼까요? gift는 present와 뜻이 같아요. arrive는 come이나 reach와 비슷하고, leave는 반대말이에요. choose는 pick과 비슷하고, felt bad는 sad나 sorry와 비슷한 느낌이에요. 이렇게 짝을 지어 외우면 오래 기억에 남아요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 가족은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">My \u003c/span>\u003cspan class=\"tgt\">family \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">동물원을 방문했어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">visited\u003c/span> a zoo\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어제\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">yesterday\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리 가족은 어제 동물원을 방문했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이야기의 시작을 알려 주는 문장이에요. \u003cb class=\"key\">어제\u003c/b> 우리 가족이 동물원에 갔다는 \u003cb class=\"key\">지난 \u003c/b>\u003cb class=\"key\">일\u003c/b>을 말하고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말하기(과거형)\u003c/span> : 누가(My family) + 했다(visited) + 무엇을(a zoo) : \"우리 가족이 방문했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">때를 알려 주는 말(부사)\u003c/span> : 언제(yesterday) : \"어제\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"My family, 우리 가족은. visited a zoo, 동물원을 방문했어요. yesterday, 어제. 이 문장 전체를 해석하면, 우리 가족은 어제 동물원을 방문했습니다.","hl":"m"},{"n":13,"text":"이 문장은 이야기의 시작을 알려 줘요. 어제, 그러니까 지난 일을 말하고 있죠.","hl":"mn"},{"n":14,"text":"첫 번째로 어제 한 일은 동사 뒤에 ed를 붙여 말해요. visit에 ed를 붙여 visited라고 했죠. 두 번째로 yesterday처럼 지난때를 알려 주는 말이 있으면 동사도 꼭 과거형으로 맞춰 줘요. 여러분도 어제 한 일을 영어로 말해 볼까요?","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 보고 있을 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">watching\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기린들을\u003c/span>\u003cspan class=\"en\">the giraffes,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아빠가 내게 말해 주었어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">my \u003c/span>\u003cspan class=\"tgt\">dad \u003c/span>\u003cspan class=\"tgt\">told \u003c/span>\u003cspan class=\"tgt\">me\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Zarafa에 대해\u003c/span>\u003cspan class=\"en\">about Zarafa,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">첫 번째 기린 중 하나\u003c/span>\u003cspan class=\"en\">one of the first giraffes\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유럽에 있는\u003c/span>\u003cspan class=\"en\">in Europe.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리가 기린을 보고 있을 때, 아빠가 유럽의 첫 번째 기린 중 하나인 Zarafa에 대해 내게 말해주었어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 기린을 보고 있을 때 아빠가 Zarafa 이야기를 해 주셨다는 것을 말해요. \u003cb class=\"key\">때\u003c/b>를 알려 주고 \u003cb class=\"key\">이야기\u003c/b>를 이어 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이어 주는 말(when)\u003c/span> : ~할 때(When) + 누가(we) + 하던 중(were watching) : \"우리가 보고 있을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지금 ~하는 중(진행형)\u003c/span> : ~하던 중이었어요(were + watching) : \"보고 있던 중이었어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">지난 일 말하기(과거형)\u003c/span> : 누가(my dad) + 말했어요(told) + 누구에게(me) : \"아빠가 내게 말했어요\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"When we were watching, 우리가 보고 있을 때. the giraffes, 기린들을. my dad told me, 아빠가 내게 말해 주었어요. about Zarafa, Zarafa에 대해. one of the first giraffes, 첫 번째 기린 중 하나. in Europe, 유럽에 있는. 이 문장 전체를 해석하면, 우리가 기린을 보고 있을 때, 아빠가 유럽의 첫 번째 기린 중 하나인 Zarafa에 대해 내게 말해주었어요.","hl":"m"},{"n":16,"text":"우리가 기린을 보고 있을 때 아빠가 유럽의 첫 기린 중 하나인 Zarafa 이야기를 해 주셨어요. 때를 알려 주고 이야기를 이어 주는 문장이죠.","hl":"mn"},{"n":17,"text":"첫 번째로 문장 앞에 when을 붙이면 때를 알려 줄 수 있어요. 두 번째로 were watching은 그때 계속 보고 있던 중이라는 뜻이에요. 세 번째로 told는 tell의 과거형이에요. 규칙대로면 telled가 되어야 하는데 그렇게 하지 않는 불규칙 동사죠. 여러분도 아빠가 들려준 이야기를 떠올리며 읽어 보세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Zarafa는 이었어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Zarafa \u003c/span>\u003cspan class=\"tgt\">was\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">선물이었어요\u003c/span>\u003cspan class=\"en\">a gift\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">프랑스 왕을 위한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">king\u003c/span> of France\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1827년에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">1827\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Zarafa는 1827년 프랑스 왕에게 주는 선물이었어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Zarafa가 프랑스 왕에게 주는 선물이었다는 것을 알려 줘요. \u003cb class=\"key\">누구\u003c/b>를 위한 것인지와 \u003cb class=\"key\">언제\u003c/b>인지가 함께 나와요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사 지난 모습(be동사 과거형)\u003c/span> : 누가(Zarafa) + 이었어요(was) + 무엇(a gift) : \"Zarafa는 ~이었어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소·시간 짝꿍 말(전치사)\u003c/span> : 누구를 위해(for) + 왕(the king) : \"왕을 위한\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">때를 알려 주는 말(전치사)\u003c/span> : 때(in) + 연도(1827) : \"1827년에\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Zarafa was, Zarafa는 이었어요. a gift, 선물이었어요. for the king of France, 프랑스 왕을 위한. in 1827, 1827년에. 이 문장 전체를 해석하면, Zarafa는 1827년 프랑스 왕에게 주는 선물이었어요.","hl":"m"},{"n":19,"text":"Zarafa가 천팔백이십칠 년에 프랑스 왕에게 주는 선물이었다는 걸 알려 줘요. 누구를 위한 선물인지와 언제였는지가 함께 나오죠.","hl":"mn"},{"n":20,"text":"첫 번째로 지난 일이라 is가 was로 바뀌었어요. 두 번째로 for는 누구를 위한 것인지 알려 주는 말이에요. 세 번째로 연도 앞에는 in을 붙여요. in과 연도를 붙이면 그해에라는 뜻이 되죠. 여러분도 자신이 태어난 해를 in과 함께 말해 볼 수 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 ~였어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">She \u003c/span>\u003cspan class=\"tgt\">was\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새끼였어요\u003c/span>\u003cspan class=\"en\">a baby\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀가 잡혔을 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">when\u003c/span> she was caught.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀가 잡혔을 때 그녀는 새끼였어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Zarafa가 잡혔을 때 \u003cb class=\"key\">아기\u003c/b>였다는 걸 알려 줘요. 그래서 \u003cb class=\"key\">어린 \u003c/b>\u003cb class=\"key\">동물\u003c/b>이었던 Zarafa가 안타깝게 느껴져요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사 과거형(be동사 과거형)\u003c/span> : 그녀는(She) + ~였어요(was) + 새끼(a baby) : \"그녀는 새끼였어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : when + 문장 = 할 때 : \"그녀가 잡혔을 때\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"She was, 그녀는 ~였어요. a baby, 새끼였어요. when she was caught, 그녀가 잡혔을 때. 이 문장 전체를 해석하면, 그녀가 잡혔을 때 그녀는 새끼였어요.","hl":"m"},{"n":22,"text":"이 문장은 Zarafa가 잡혔을 때 아기였다는 걸 알려 줘요. 그래서 어린 동물이었던 Zarafa가 안타깝게 느껴져요.","hl":"mn"},{"n":23,"text":"첫 번째로 She was를 볼게요. 지난 일을 말할 때 be동사는 was나 were를 써요. She는 한 사람이라 was를 써요. 두 번째로 when을 볼게요. when은 두 일을 이어 주고 할 때라는 뜻이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러고 나서 그녀는 배를 타고\u003c/span>\u003cspan class=\"en\">Then she \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">sailed\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나일 강을 따라 내려와서\u003c/span>\u003cspan class=\"en\">down the Nile River\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 대양을 건넜어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and\u003c/span> across the ocean.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러고 나서 그녀는 나일 강을 따라 배를 타고 내려와서 대양을 건넜어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Zarafa가 배를 타고 나일 강을 따라 내려와 대양을 건넜다는 \u003cb class=\"key\">이동 \u003c/b>\u003cb class=\"key\">과정\u003c/b>을 말해요. \u003cb class=\"key\">긴 \u003c/b>\u003cb class=\"key\">여행\u003c/b>이 이어졌다는 걸 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 그녀는(She) + 배를 타고 갔어요(sailed) : \"배를 타고 갔어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 내려온 일(and) + 건넌 일 : \"그리고\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Then she sailed, 그러고 나서 그녀는 배를 타고. down the Nile River, 나일 강을 따라 내려와서. and across the ocean, 그리고 대양을 건넜어요. 이 문장 전체를 해석하면, 그러고 나서 그녀는 나일 강을 따라 배를 타고 내려와서 대양을 건넜어요.","hl":"m"},{"n":25,"text":"Zarafa가 배를 타고 나일 강을 따라 내려와 대양을 건넜다는 이동 과정을 말해요. 긴 여행이 이어졌다는 걸 보여 줘요.","hl":"mn"},{"n":26,"text":"첫 번째로 sailed를 볼게요. sailed는 sail에 ed를 붙인 과거 모습이에요. 그래서 지난 일을 말해요. 두 번째로 and를 볼게요. and는 두 가지 일을 이어 줘요. 나일 강을 따라 내려온 일과 대양을 건넌 일이 한 문장에 담겨요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Zarafa가 도착했을 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When\u003c/span> Zarafa arrived\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">프랑스에\u003c/span>\u003cspan class=\"en\">in France,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 파리로 이동했어요\u003c/span>\u003cspan class=\"en\">she \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">moved\u003c/span> to Paris\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">걸어서!\u003c/span>\u003cspan class=\"en\">on foot!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Zarafa는 프랑스에 도착한 후, 걸어서 파리까지 이동했어요!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Zarafa가 프랑스에 도착한 뒤 \u003cb class=\"key\">걸어서\u003c/b> 파리까지 갔다는 걸 알려 줘요. \u003cb class=\"key\">놀라운 \u003c/b>\u003cb class=\"key\">이동\u003c/b>을 보여 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : When + 문장 = 할 때 : \"Zarafa가 도착했을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 그녀는(She) + 이동했어요(moved) : \"이동했어요\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"When Zarafa arrived, Zarafa가 도착했을 때. in France, 프랑스에. she moved to Paris, 그녀는 파리로 이동했어요. on foot!, 걸어서!. 이 문장 전체를 해석하면, Zarafa는 프랑스에 도착한 후, 걸어서 파리까지 이동했어요!","hl":"m"},{"n":28,"text":"Zarafa가 프랑스에 도착한 뒤 걸어서 파리까지 갔다는 걸 알려 줘요. 놀라운 이동을 보여 주는 문장이에요.","hl":"mn"},{"n":29,"text":"첫 번째로 When을 볼게요. When은 두 일을 이어 주고 할 때라는 뜻이에요. 두 번째로 moved를 볼게요. moved는 move에 d를 붙인 과거형이에요. 지난 일을 말해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 12\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 걸었습니다\u003c/span>\u003cspan class=\"en\">She \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">walked\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">약 880킬로미터를\u003c/span>\u003cspan class=\"en\">about 880 kilometers\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">6주 동안.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">six \u003c/span>\u003cspan class=\"tgt\">weeks\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 6주 동안 약 880킬로미터를 걸었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 자라파가 프랑스에 도착한 뒤 \u003cb class=\"key\">파리\u003c/b>까지 걸어간 거리와 기간을 알려 주는 문장이에요. 아주 먼 길을 걸었다는 걸 보여 줘서 \u003cb class=\"key\">놀라움\u003c/b>을 전해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거형(규칙 과거형)\u003c/span> : 누가(She) + 걸었다(walked) : \"걸었습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사(전치사)\u003c/span> : in + 기간(six weeks) = [[~동안]] : \"6주 동안\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"She walked, 그녀는 걸었습니다. about 880 kilometers, 약 880킬로미터를. in six weeks, 6주 동안.. 이 문장 전체를 해석하면, 그녀는 6주 동안 약 880킬로미터를 걸었습니다.","hl":"m"},{"n":31,"text":"이 문장은 자라파가 파리까지 걸어간 거리와 기간을 알려 줘요. 아주 먼 길을 걸었으니 정말 놀라움을 주는 문장이죠.","hl":"mn"},{"n":32,"text":"첫 번째, walked는 walk에 ed를 붙인 과거형이에요. 지난 일이라서 이렇게 모양이 바뀌었어요. 두 번째, in six weeks에서 in은 기간을 나타내서 '여섯 주 동안'이라는 뜻이 돼요. 여러분도 in two days처럼 시간 앞에 in을 붙여 쓸 수 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">파리의 모든 사람들이\u003c/span>\u003cspan class=\"en\">Everyone in Paris\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀에게 주었어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">gave\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">her\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">큰 환영을.\u003c/span>\u003cspan class=\"en\">a big welcome.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">파리의 모든 사람들이 그녀를 크게 환영했어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 파리에 사는 모든 사람이 자라파를 아주 크게 \u003cb class=\"key\">환영\u003c/b>했다는 문장이에요. 자라파가 얼마나 \u003cb class=\"key\">인기\u003c/b>가 많았는지 알려 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거형(불규칙 과거형)\u003c/span> : 누가(Everyone) + 주었다(gave) : \"주었어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">대명사(목적격 대명사)\u003c/span> : gave + 누구에게(her) : \"그녀에게\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"Everyone in Paris, 파리의 모든 사람들이. gave her, 그녀에게 주었어요. a big welcome, 큰 환영을.. 이 문장 전체를 해석하면, 파리의 모든 사람들이 그녀를 크게 환영했어요.","hl":"m"},{"n":34,"text":"파리에 사는 모든 사람이 자라파를 아주 크게 환영했다는 뜻이에요. 자라파가 얼마나 인기가 많았는지 알 수 있죠.","hl":"mn"},{"n":35,"text":"첫 번째, gave는 give의 과거 모양이에요. 지난 일이라서 모양이 이렇게 달라졌어요. 두 번째, her는 '그녀에게'라는 뜻으로, 동사 뒤에서 받는 사람을 알려 줘요. 그래서 gave her a big welcome은 '그녀에게 큰 환영을 주었어요'가 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 사람들은\u003c/span>\u003cspan class=\"en\">Some people\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀를 불렀어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">called\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">her\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">&quot;아름다운 아프리카인&quot;이라고.\u003c/span>\u003cspan class=\"en\">&quot;the Beautiful African.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어떤 사람들은 그녀를 '아름다운 아프리카인'이라고 불렀습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사람들이 자라파를 '아름다운 아프리카인'이라고 불렀다는 문장이에요. 사람들이 자라파를 \u003cb class=\"key\">아름답다\u003c/b>고 생각한 걸 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거형(규칙 과거형)\u003c/span> : 누가(Some people) + 불렀다(called) : \"불렀어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">대명사(목적격 대명사)\u003c/span> : called + 누구를(her) : \"그녀를\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Some people, 어떤 사람들은. called her, 그녀를 불렀어요. \"the Beautiful African.\", \"아름다운 아프리카인\"이라고.. 이 문장 전체를 해석하면, 어떤 사람들은 그녀를 '아름다운 아프리카인'이라고 불렀습니다.","hl":"m"},{"n":37,"text":"사람들이 자라파를 아름다운 아프리카인이라고 불렀어요. 자라파를 정말 아름답다고 생각한 거죠.","hl":"mn"},{"n":38,"text":"첫 번째, called는 call에 ed를 붙인 과거형이에요. 두 번째, her는 '그녀를'이라는 뜻이고, 뒤에 오는 the Beautiful African은 그녀를 뭐라고 불렀는지 알려 줘요. 그래서 '그녀를 아름다운 아프리카인이라고 불렀어요'가 되는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 사람들은 그녀를 불렀어요\u003c/span>\u003cspan class=\"en\">Others \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">called\u003c/span> her\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">'그 기린'이라고\u003c/span>\u003cspan class=\"en\">&quot;the giraffe&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜냐하면 ~이 있었기 때문이에요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">because\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">were\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 기린이 하나도 없었어요\u003c/span>\u003cspan class=\"en\">no other giraffes\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">프랑스에는\u003c/span>\u003cspan class=\"en\">in France.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">다른 사람들은 프랑스에 다른 기린이 없었기 때문에 그녀를 '그 기린'이라고 불렀어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 파리 사람들이 그녀를 이름 대신 \u003cb class=\"key\">그 \u003c/b>\u003cb class=\"key\">기린\u003c/b>이라고 불렀다는 뜻이에요. 프랑스에 기린이 한 마리뿐이라서 그렇게 부른 거예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거형(규칙 동사 과거형)\u003c/span> : 부르다(call) + ed = 불렀다(called) : \"불렀어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이유를 이어 주는 말(접속사)\u003c/span> : 앞 내용 + because + 뒤에는 까닭 : \"~때문에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">There is/are의 과거형(There were)\u003c/span> : There were + 여러 개(복수) = ~이 있었다 : \"있었어요\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"Others called her, 다른 사람들은 그녀를 불렀어요. \"the giraffe\", '그 기린'이라고. because there were, 왜냐하면 ~이 있었기 때문이에요. no other giraffes, 다른 기린이 하나도 없었어요. in France, 프랑스에는. 이 문장 전체를 해석하면, 다른 사람들은 프랑스에 다른 기린이 없었기 때문에 그녀를 '그 기린'이라고 불렀어요.","hl":"m"},{"n":40,"text":"이 문장은 사람들이 그녀를 그냥 '그 기린'이라고 불렀다는 이야기예요. 프랑스에 기린이 한 마리뿐이라서 이름 대신 그렇게 부른 거죠.","hl":"mn"},{"n":41,"text":"먼저 첫 번째, called를 볼까요? call에 ed를 붙이면 불렀다가 돼요. 두 번째, because는 왜 그런지 까닭을 알려 주는 말이에요. 세 번째, there were는 여러 개가 있었다고 말할 때 써요. 지금이 아니라 과거 이야기라는 점도 꼭 기억해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 이야기를 듣고 나서,\u003c/span>\u003cspan class=\"en\">After the story,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 마음이 안 좋았어요\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">felt\u003c/span> bad\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Zarafa와 같은 동물들이\u003c/span>\u003cspan class=\"en\">that animals like Zarafa\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보내진다는 것이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">get \u003c/span>\u003cspan class=\"tgt\">sent\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 나라에\u003c/span>\u003cspan class=\"en\">to other countries\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">선물로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">gifts\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 이야기를 듣고 나서, 나는 Zarafa와 같은 동물들이 다른 나라에 선물로 보내진다는 것이 유감이었어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Zarafa 같은 동물이 다른 나라에 \u003cb class=\"key\">선물\u003c/b>로 보내지는 걸 슬퍼했다는 뜻이에요. 이야기를 듣고 \u003cb class=\"key\">마음\u003c/b>이 무거워진 거예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거형(불규칙 동사 과거형)\u003c/span> : 느끼다(feel) → 느꼈어요(felt) : \"느꼈어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">덩어리 표현(보내지다)\u003c/span> : get sent = 보내지다 : \"보내져요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 as(~로)\u003c/span> : as + 이름 말(명사) = ~로 : \"선물로\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"After the story, 그 이야기를 듣고 나서. I felt bad, 나는 마음이 안 좋았어요. that animals like Zarafa, Zarafa와 같은 동물들이. get sent, 보내진다는 것이. to other countries, 다른 나라에. as gifts, 선물로. 이 문장 전체를 해석하면, 그 이야기를 듣고 나서, 나는 Zarafa와 같은 동물들이 다른 나라에 선물로 보내진다는 것이 유감이었어요.","hl":"m"},{"n":43,"text":"이 문장은 주인공이 이야기를 듣고 마음이 아팠다는 걸 말해요. 동물들이 선물처럼 다른 나라로 보내지는 게 안타까웠던 거죠.","hl":"mn"},{"n":44,"text":"먼저 첫 번째, feel이 felt로 바뀌었어요. 이렇게 규칙 없이 변하면 불규칙 동사라고 해요. 두 번째, get sent는 보내지다라는 뜻이에요. 스스로 가는 게 아니라 보내지는 거라서 이렇게 말해요. 어려우면 그냥 통째로 외워요. 세 번째, as는 선물로처럼 어떤 모습을 말할 때 써요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 12\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 선택하지 않았어요\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003cspan class=\"tgt\">choose\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">떠나는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">leave\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 고향을\u003c/span>\u003cspan class=\"en\">their homes.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 자신의 고향을 떠나는 것을 선택하지 않았어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 동물들은 스스로 고향을 \u003cb class=\"key\">떠나기를\u003c/b> 원한 게 아니라는 뜻이에요. 동물을 \u003cb class=\"key\">생각\u003c/b>해 달라는 글쓴이의 마음이 담긴 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정문(do/does/did 부정문)\u003c/span> : 누가(They) + don't + 동사원형(choose) : \"선택하지 않아요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사(to + 동사원형)\u003c/span> : choose + to + [[동사원형]] = ~하기를 선택하다 : \"떠나기를\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"They don't choose, 그들은 선택하지 않았어요. to leave, 떠나는 것을. their homes, 자신의 고향을. 이 문장 전체를 해석하면, 그들은 자신의 고향을 떠나는 것을 선택하지 않았어요.","hl":"m"},{"n":46,"text":"이 문장은 동물들이 스스로 고향을 떠나기를 원한 게 아니라는 말이에요. 그래서 글쓴이가 동물들의 마음을 생각해 달라고 말하는 거예요.","hl":"mn"},{"n":47,"text":"먼저 첫 번째, don't는 동사 앞에 붙어서 하지 않아요를 만드는 부정문 친구예요. 두 번째, choose 뒤에 to와 동사원형을 붙이면 하기를 선택하다가 돼요. 그래서 to leave는 떠나기를이라는 뜻이 되죠. 오늘 배운 문장들, 소리 내어 세 번씩 읽어 보면 아주 좋아요!","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">오늘 배운 내용 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>아빠가 동물원에서 \u003cb class=\"key\">Zarafa\u003c/b>라는 기린 이야기를 들려주셨어요.\u003c/li>\u003cli>Zarafa는 프랑스 왕에게 주는 \u003cb class=\"key\">선물\u003c/b>로 잡혀 배를 타고 바다를 건넜어요.\u003c/li>\u003cli>프랑스에 도착한 뒤에는 \u003cb class=\"key\">걸어서\u003c/b> 파리까지 880킬로미터를 갔어요.\u003c/li>\u003cli>글쓴이는 동물들이 고향을 떠나는 것을 \u003cb class=\"key\">선택\u003c/b>하지 못한다는 것이 안타까웠어요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Zarafa, a baby giraffe given as a gift to the king of France, sailed across the sea and walked all the way to Paris, and her story made the writer feel sad because animals cannot choose to leave their homes.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">우리 가족이 동물원에서 기린을 보던 날, 아빠가 유럽에 처음 온 기린 중 하나인 \u003cb class=\"key\">Zarafa\u003c/b> 이야기를 들려주셨어요. Zarafa는 프랑스 왕에게 주는 \u003cb class=\"key\">선물\u003c/b>로 잡혀 배를 타고 바다를 건너 걸어서 파리까지 갔고, 그 이야기를 듣고 나는 동물들이 \u003cb class=\"key\">스스로 \u003c/b>\u003cb class=\"key\">선택하지 \u003c/b>\u003cb class=\"key\">못한 \u003c/b>\u003cb class=\"key\">채\u003c/b> 고향을 떠난다는 것이 안타까웠어요.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":48,"text":"오늘 우리는 자라파라는 기린의 긴 여행 이야기를 읽었어요. 배를 타고 바다를 건너고 걸어서 파리까지 간 기린, 정말 대단하죠? 그리고 동물들도 우리처럼 자기 집을 고를 수 있었으면 좋겠다는 글쓴이의 마음도 꼭 기억해 주세요. 오늘도 끝까지 잘 따라온 여러분, 정말 멋졌어요. 다음 시간에 또 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
