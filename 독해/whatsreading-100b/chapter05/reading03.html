</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"왓츠 리딩 100B Ch.5 Unit 03 My Dad's Work","audioDir":"reading03_audio","preview":false,"count":60,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.468em\">Ch.5\u003cbr>Unit 03 My\u003cbr>Dad's Work\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">왓츠 리딩 100B\u003c/div>\u003ch1>My Dad's Work: A Diplomat's Job\u003c/h1>\u003ch2>아빠의 일: 외교관의 직업\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">한 줄 요약\u003c/span>\u003cspan>아빠의 일 때문에 가족이 \u003cb class=\"key\">캐나다\u003c/b>로 이사한 뒤, 아이가 \u003cb class=\"key\">외교관\u003c/b>인 아빠의 일을 하나씩 배워요. 외교관은 나라를 위해 일하고 두 나라 사이 문제를 \u003cb class=\"key\">대화\u003c/b>로 풀며, 이제 아이는 아빠가 \u003cb class=\"key\">자랑스러워요\u003c/b>.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Diplomats work for their country and solve problems between countries by talking together.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘도 만나서 정말 반가워요. 오늘은 한 친구가 아빠의 직업을 배우러 가는 이야기를 읽어 볼 거예요. 아빠는 외교관이고, 아이는 아빠의 일이 얼마나 멋진지 하나씩 알게 된답니다. 자, 그럼 함께 시작해 볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">미리 알면 쉬워요\u003c/span>\u003cdiv class=\"lp-box\">\u003cb class=\"key\">외교관\u003c/b>(diplomat)은 자기 나라를 대신해서 다른 나라와 이야기하는 사람이에요. 우리 반에서 반 대표가 다른 반과 이야기하는 것과 비슷해요. 두 나라 사이에 문제가 생기면 외교관들이 만나 \u003cb class=\"key\">대화\u003c/b>로 풀어 간답니다. 우리가 해외여행을 갈 때 필요한 \u003cb class=\"key\">비자\u003c/b>(visa)와 \u003cb class=\"key\">여권\u003c/b>(passport)도 외교관이 있는 곳에서 만들어요. 그래서 외교관은 나라의 얼굴 같은 역할을 해요.\u003c/div>","segs":[{"n":2,"text":"여러분, 외교관이라는 말 들어 봤나요? 외교관은 diplomat이라고 하는데, 자기 나라를 대신해서 다른 나라와 이야기하는 사람이에요. 우리 반에서 반 대표가 다른 반과 이야기하는 것과 비슷하죠. 두 나라 사이에 문제가 생기면 외교관들이 만나서 대화로 풀어 간답니다. 여러분이 만약 외교관이 된다면 어느 나라에 가 보고 싶나요?","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>이사와 질문\u003csmall>시작 · 문장 1–4\u003c/small>\u003c/h4>\u003cp>가족이 작년에 아빠의 \u003cb class=\"key\">일\u003c/b> 때문에 캐나다로 이사했어요. 어느 날 아이가 아빠에게 \u003cb class=\"key\">직업\u003c/b>에 대해 물었어요. 아빠는 내일 같이 가자고 하며 \u003cb class=\"key\">구경시켜 \u003c/b>\u003cb class=\"key\">주겠다\u003c/b>고 말했어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>외교관 소개\u003csmall>소개 · 문장 5–9\u003c/small>\u003c/h4>\u003cp>다음 날 아이는 아빠의 \u003cb class=\"key\">직장\u003c/b>에 갔어요. 아빠는 외교관은 \u003cb class=\"key\">자신의 \u003c/b>\u003cb class=\"key\">나라\u003c/b>를 위해 일한다고 알려 줬어요. 두 나라 사이에 문제가 있으면 외교관들이 만나 \u003cb class=\"key\">무역\u003c/b>이나 \u003cb class=\"key\">평화\u003c/b>에 대해 이야기한대요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>여러 가지 일\u003csmall>예시 · 문장 10–14\u003c/small>\u003c/h4>\u003cp>아빠가 직장을 구경시켜 주면서 여러 일을 보여 줬어요. 어떤 사람은 우리나라를 \u003cb class=\"key\">소개\u003c/b>하고, 어떤 사람은 \u003cb class=\"key\">비자\u003c/b>나 \u003cb class=\"key\">여권\u003c/b>을 만들어요. 또 다른 사람들은 \u003cb class=\"key\">정치\u003c/b>에 대한 정보를 모은대요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>마음이 바뀜\u003csmall>바뀜 · 문장 15–16\u003c/small>\u003c/h4>\u003cp>처음에는 아빠의 일을 \u003cb class=\"key\">몰랐어요\u003c/b>. 이제는 더 많이 알게 되었고, 아빠가 \u003cb class=\"key\">자랑스러워요\u003c/b>.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 이 이야기가 어떤 순서로 흘러가는지 함께 살펴볼게요.","hl":null},{"n":4,"text":"먼저 첫 번째 단계예요. 아이의 가족이 작년에 아빠의 일 때문에 캐나다로 이사했어요. 어느 날 아이가 아빠에게 직업에 대해 물었죠. 그러자 아빠가 내일 같이 가자, 구경시켜 주겠다고 말했어요.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 아빠의 일이 소개돼요. 다음 날 아이는 아빠의 직장에 갔어요. 아빠는 외교관은 자신의 나라를 위해 일한다고 알려 줬죠. 그리고 두 나라 사이에 문제가 있으면 외교관들이 만나서 무역이나 평화에 대해 이야기한다고 덧붙였어요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 예시를 보여 주는 부분이에요. 아빠가 직장을 구경시켜 주면서 사람들이 하는 여러 일을 알려 줬어요. 어떤 사람은 우리나라를 다른 나라에 소개하고, 어떤 사람은 비자나 여권을 만들어요. 또 다른 사람들은 정치에 대한 정보를 모은답니다.","hl":"f2"},{"n":7,"text":"마지막 단계에서는 아이의 마음이 바뀌어요. 처음에는 아빠의 일을 잘 몰랐어요. 그런데 이제는 더 많이 알게 되었고, 아빠가 자랑스러워요. 여러분도 가족의 일을 물어보면 새로운 걸 많이 알게 될 거예요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">이야기 순서(처음-가운데-끝)\u003c/span>\u003cspan class=\"lp-pill\">끝\u003c/span>\u003cspan class=\"lp-pill\">주제문 16번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 있었던 일을 시간 순서대로 들려주는 \u003cb class=\"key\">이야기\u003c/b>예요. 처음에는 이사와 질문이 나오고, 가운데에는 아빠의 설명이 길게 이어져요. 마지막에 아이가 '이제는 더 많이 알고 \u003cb class=\"key\">자랑스럽다\u003c/b>'고 말해서 글의 중심 생각이 끝에 와요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>because of (1)\u003c/b>\u003cspan>이유를 알려 줌\u003c/span>\u003cb>One day (2)\u003c/b>\u003cspan>이야기 시작을 알려 줌\u003c/span>\u003cb>The next day (5)\u003c/b>\u003cspan>시간 순서를 알려 줌\u003c/span>\u003cb>At first (15)\u003c/b>\u003cspan>처음과 지금을 비교해 줌\u003c/span>\u003cb>Now (16)\u003c/b>\u003cspan>바뀐 지금을 알려 줌\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">my dad\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">him\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">He\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">my dad\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 이야기 순서로 짜여 있어요. 처음에 이사와 질문이 나오고, 가운데에서 아빠의 설명이 이어지고, 끝에서 아이의 마음이 바뀌죠. 글의 중심 문장은 마지막 부분에 있어요. 이제는 더 많이 알고 아빠가 자랑스럽다는 그 문장이 이 글의 중심이에요.","hl":"ty"},{"n":9,"text":"길잡이 말도 눈여겨보세요. because of는 이유를 알려 주고, One day와 The next day는 시간 순서를 알려 줘요. At first와 Now는 처음과 지금을 비교해 주는 말이에요. 또 my dad를 him이나 he로 바꿔 부르면서 같은 사람을 가리킨다는 것도 기억해요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 단어\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>move\u003c/b>\u003cem>동사\u003c/em>\u003cspan>이사하다, 옮기다\u003c/span>\u003c/div>\u003cdiv>\u003cb>because of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~ 때문에\u003c/span>\u003c/div>\u003cdiv>\u003cb>ask\u003c/b>\u003cem>동사\u003c/em>\u003cspan>묻다, 물어보다\u003c/span>\u003c/div>\u003cdiv>\u003cb>show you around\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>너를 구경시켜 주다\u003c/span>\u003c/div>\u003cdiv>\u003cb>workplace\u003c/b>\u003cem>명사\u003c/em>\u003cspan>직장, 일하는 곳\u003c/span>\u003c/div>\u003cdiv>\u003cb>diplomat\u003c/b>\u003cem>명사\u003c/em>\u003cspan>외교관\u003c/span>\u003c/div>\u003cdiv>\u003cb>country\u003c/b>\u003cem>명사\u003c/em>\u003cspan>나라\u003c/span>\u003c/div>\u003cdiv>\u003cb>remain\u003c/b>\u003cem>동사\u003c/em>\u003cspan>남다, 머물다\u003c/span>\u003c/div>\u003cdiv>\u003cb>own\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>자신의\u003c/span>\u003c/div>\u003cdiv>\u003cb>different\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>다른\u003c/span>\u003c/div>\u003cdiv>\u003cb>between\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~ 사이에\u003c/span>\u003c/div>\u003cdiv>\u003cb>trade\u003c/b>\u003cem>명사\u003c/em>\u003cspan>무역, 물건 사고파는 일\u003c/span>\u003c/div>\u003cdiv>\u003cb>peace\u003c/b>\u003cem>명사\u003c/em>\u003cspan>평화\u003c/span>\u003c/div>\u003cdiv>\u003cb>introduce\u003c/b>\u003cem>동사\u003c/em>\u003cspan>소개하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>visa\u003c/b>\u003cem>명사\u003c/em>\u003cspan>비자\u003c/span>\u003c/div>\u003cdiv>\u003cb>passport\u003c/b>\u003cem>명사\u003c/em>\u003cspan>여권\u003c/span>\u003c/div>\u003cdiv>\u003cb>gather\u003c/b>\u003cem>동사\u003c/em>\u003cspan>모으다\u003c/span>\u003c/div>\u003cdiv>\u003cb>information\u003c/b>\u003cem>명사\u003c/em>\u003cspan>정보\u003c/span>\u003c/div>\u003cdiv>\u003cb>proud\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>자랑스러운\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"오늘의 단어도 소리 내어 읽어 볼게요. diplomat은 외교관이라는 뜻이에요. workplace는 직장, passport는 여권, visa는 비자예요. proud는 자랑스러운이라는 뜻이고요. 큰 소리로 따라 읽어 보세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">move\u003c/b>\u003cspan class=\"m\">이사하다, 옮기다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">go\u003c/span>\u003cspan class=\"s\">travel\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">stay\u003c/span>\u003cspan class=\"a\">remain\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">remain\u003c/b>\u003cspan class=\"m\">남다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">stay\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">leave\u003c/span>\u003cspan class=\"a\">move\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">different\u003c/b>\u003cspan class=\"m\">다른\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">other\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">same\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">gather\u003c/b>\u003cspan class=\"m\">모으다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">collect\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">spread\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">peace\u003c/b>\u003cspan class=\"m\">평화\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">quiet\u003c/span>\u003cspan class=\"s\">calm\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">war\u003c/span>\u003cspan class=\"a\">fight\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">proud\u003c/b>\u003cspan class=\"m\">자랑스러운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">glad\u003c/span>\u003cspan class=\"s\">pleased\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"비슷한 말과 반대말도 정리해 봐요. move는 이사하다, remain은 남다라는 뜻이라서 서로 반대말이에요. different는 다르다, same은 같다라서 이것도 반대말이죠. gather는 모으다이고 spread는 흩어지다예요. peace는 평화, war는 전쟁이라서 서로 반대말이고, proud는 기쁘고 뿌듯한 마음이에요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 16\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 가족은 이사했어요\u003c/span>\u003cspan class=\"en\">My family \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">moved\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">캐나다로\u003c/span>\u003cspan class=\"en\">to Canada\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">작년에\u003c/span>\u003cspan class=\"en\">last year\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아빠의 일 때문에\u003c/span>\u003cspan class=\"en\">because of \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">my \u003c/span>\u003cspan class=\"tgt\">dad's \u003c/span>\u003cspan class=\"tgt\">work\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리 가족은 작년에 아빠의 일 때문에 캐나다로 이주했어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이야기의 첫 문장으로, 우리 가족이 캐나다로 간 \u003cb class=\"key\">까닭\u003c/b>을 알려 줘요. 바로 \u003cb class=\"key\">아빠의 \u003c/b>\u003cb class=\"key\">일\u003c/b> 때문이라는 것을 먼저 말해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(My family) + 했어요(moved) + 어디로(to Canada) : \"이사했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">누구의 것 표시(소유격)\u003c/span> : 누구의(my dad's) + 무엇(work) : \"아빠의 일\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"My family moved, 우리 가족은 이사했어요. to Canada, 캐나다로. last year, 작년에. because of my dad's work, 아빠의 일 때문에. 이 문장 전체를 해석하면, 우리 가족은 작년에 아빠의 일 때문에 캐나다로 이주했어요.","hl":"m"},{"n":13,"text":"이 문장은 이야기의 시작이에요. 우리 가족이 왜 캐나다로 갔는지 알려 주죠. 바로 아빠의 일 때문이에요.","hl":"mn"},{"n":14,"text":"첫 번째, moved는 지난 일을 말하는 과거형이에요. 그래서 지금이 아니라 작년에 이사한 일을 말해요. 두 번째, my dad's work에서 's를 붙여 아빠의 일이라고 했어요. 누구의 것인지 알려 주는 소유격이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어느 날,\u003c/span>\u003cspan class=\"en\">One day,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 그에게 물어봤어요\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">asked\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">him\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 직업에 대해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">about \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">job\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어느 날, 나는 아빠에게 아빠의 직업에 대해 물어봤어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아빠의 직업이 궁금해서 \u003cb class=\"key\">질문\u003c/b>한 장면이에요. 이야기가 본격적으로 \u003cb class=\"key\">시작\u003c/b>되는 계기가 되는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(I) + 했어요(asked) + 누구에게(him) : \"물어봤어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">대신하는 말(대명사)\u003c/span> : 그에게(him) : \"그에게(아빠에게)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">장소·시간 짝꿍 말(전치사)\u003c/span> : 무엇에 대해(about) + 그의 직업(his job) : \"그의 직업에 대해\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"One day, 어느 날. I asked him, 나는 그에게 물어봤어요. about his job, 그의 직업에 대해. 이 문장 전체를 해석하면, 어느 날, 나는 아빠에게 아빠의 직업에 대해 물어봤어요.","hl":"m"},{"n":16,"text":"이 문장은 아빠의 직업이 궁금해서 물어본 장면이에요. 여기서부터 이야기가 본격적으로 시작돼요.","hl":"mn"},{"n":17,"text":"첫 번째, asked는 ask에 ed를 붙인 과거형이에요. 이미 지난 어느 날 물어본 일이니까 과거형을 써요. 두 번째, him은 앞에 나온 아빠를 가리키는 대명사예요. 세 번째, about은 무엇에 대해 물었는지 알려 주는 말이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아빠가 말하셨어요, &quot;나와 같이 가자 내일\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">said\u003c/span>, &quot;\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">Come \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">me\u003c/span> tomorrow.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">아빠가 말하셨어요, &quot;내일 나와 같이 가자.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아빠가 나를 \u003cb class=\"key\">직접 \u003c/b>\u003cb class=\"key\">초대\u003c/b>하는 말이에요. 다음 날 함께 회사에 가 보자는 \u003cb class=\"key\">제안\u003c/b>을 하는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(He) + 말했어요(said) : \"말했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">시키는 말(명령문)\u003c/span> : 동사원형(Come) + 함께(with me) : \"나와 같이 와\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"He said, 아빠가 말하셨어요. \"Come with me, \"나와 같이 가자. tomorrow.\", 내일. 이 문장 전체를 해석하면, 아빠가 말하셨어요, \"내일 나와 같이 가자.","hl":"m"},{"n":19,"text":"이 문장은 아빠가 나를 직접 불러 보는 말이에요. 내일 같이 회사에 가 보자는 제안이죠.","hl":"mn"},{"n":20,"text":"첫 번째, said는 say의 과거형인데 모양이 달라서 꼭 외워야 해요. 두 번째, Come with me는 동사원형으로 시작하는 명령문이에요. 그래서 나와 같이 와, 라고 시키는 말이 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내가 보여 줄게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I'll\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">show \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">너에게 여기저기\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">around\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">내가 구경시켜 줄게.&quot;\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아빠가 다음 날 자기 직장에 데려가서 여기저기 \u003cb class=\"key\">구경\u003c/b>시켜 주겠다고 말한 거예요. 이야기가 아빠의 직장으로 넘어가는 짧은 안내 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">앞으로 할 일 말하기(조동사 will)\u003c/span> : 누가(I) + 할게(will show) + 너에게(you) : \"내가 ~해 줄게\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">보여 주다 + 누구를(목적어)\u003c/span> : 보여 주다(show) + 너를(you) + 여기저기(around) : \"너에게 여기저기 구경시켜 주다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"I'll show, 내가 보여 줄게. you around, 너에게 여기저기. 이 문장 전체를 해석하면, 내가 구경시켜 줄게.\"","hl":"m"},{"n":22,"text":"이 문장은 아빠가 하는 말이에요. 다음 날 자기 직장에 데려가서 여기저기 구경시켜 주겠다고 한 거죠. 짧은 말이지만 아빠의 다정한 마음이 느껴져요.","hl":"mn"},{"n":23,"text":"문법을 두 가지 짚어 볼게요. 첫째, I'll은 I will을 줄인 말이에요. will은 앞으로 할 일을 말할 때 동사를 도와주는 조동사예요. 둘째, show you around는 너에게 여기저기 구경시켜 준다는 뜻의 덩어리 표현이에요. show 다음에 사람이 오면 그 사람에게 보여 준다는 뜻이 된답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 다음 날,\u003c/span>\u003cspan class=\"en\">The next day,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 갔어요\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">went\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 직장에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">workplace\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">다음 날, 나는 아빠의 직장에 갔어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아빠가 같이 가자고 한 다음 날, 정말로 아빠의 \u003cb class=\"key\">직장\u003c/b>에 갔다는 뜻이에요. 말로만 끝나지 않고 실제로 함께 갔다는 걸 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말하기(과거형)\u003c/span> : 나는(I) + 갔어요(went) + 직장에(to his workplace) : \"갔어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">가는 곳을 알려 주는 짝꿍 말(전치사 to)\u003c/span> : 갔어요(went) + ~에(to) + 그의 직장(his workplace) : \"그의 직장에\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"The next day, 그 다음 날. I went, 나는 갔어요. to his workplace, 그의 직장에. 이 문장 전체를 해석하면, 다음 날, 나는 아빠의 직장에 갔어요.","hl":"m"},{"n":25,"text":"앞에서 아빠가 같이 가자고 했죠? 그래서 다음 날 정말로 아빠의 직장에 갔다는 뜻이에요. 약속을 지킨 거예요.","hl":"mn"},{"n":26,"text":"문법 두 가지를 짚어 볼게요. 첫째, go의 과거형은 went예요. 지난 일을 말할 때는 동사를 과거형으로 바꿔요. 둘째, to는 '~에, ~로'라는 뜻으로 가는 곳을 알려 주는 전치사예요. 그래서 went와 to his workplace가 짝을 이뤄요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 말했어요,\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">said\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">&quot;나와 같은 외교관들은\u003c/span>\u003cspan class=\"en\">&quot;Diplomats like me\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~을 위해 일해요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">work\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 나라를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">country\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">아빠는 말하셨어요, &quot;나와 같은 외교관들은 자신의 나라를 위해 일한단다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아빠가 자기 일을 설명하는 문장이에요. \u003cb class=\"key\">외교관\u003c/b>은 자기 \u003cb class=\"key\">나라를 \u003c/b>\u003cb class=\"key\">위해\u003c/b> 일한다는 걸 알려 주죠. 이 글의 \u003cb class=\"key\">중심 \u003c/b>\u003cb class=\"key\">생각\u003c/b>이 담긴 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말하기(과거형)\u003c/span> : 그는(He) + 말했어요(said) : \"말했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주어가 여럿일 때 동사 그대로(단수·복수)\u003c/span> : 여러 명(Diplomats) + 일해요(work) : \"일한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">까닭을 알려 주는 짝꿍 말(전치사 for)\u003c/span> : 일해요(work) + ~을 위해(for) + 그들의 나라(their country) : \"그들의 나라를 위해\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"He said, 그는 말했어요. \"Diplomats like me, \"나와 같은 외교관들은. work for, ~을 위해 일해요. their country, 그들의 나라를. 이 문장 전체를 해석하면, 아빠는 말하셨어요, \"나와 같은 외교관들은 자신의 나라를 위해 일한단다.","hl":"m"},{"n":28,"text":"아빠가 자기 일을 직접 설명해 주는 장면이에요. 나 같은 외교관들은 자기 나라를 위해 일한다고 말했죠. 이 문장이 이 글의 중심 생각이에요.","hl":"mn"},{"n":29,"text":"문법을 세 가지 짚어 볼게요. 첫째, say의 과거형은 said예요. 이미 지난 대화라서 과거형으로 말해요. 둘째, 주어가 복수이면 동사 뒤에 -s를 붙이지 않아요. Diplomats가 여럿이라서 work 그대로 쓰는 거예요. 셋째, for는 '~을 위해'라는 뜻의 전치사예요. 그래서 나라를 위해 일한다는 뜻이 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 사람들은 남아요\u003c/span>\u003cspan class=\"en\">Some remain\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 나라에\u003c/span>\u003cspan class=\"en\">in their own country,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 다른 사람들은 이동해요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">and\u003c/span> others move\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 나라로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">different \u003c/span>\u003cspan class=\"tgt\">countries\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어떤 사람들은 자신의 나라에 남고, 다른 사람들은 다른 나라로 이동하기도 해.&quot;\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 외교관마다 일하는 곳이 다르다는 걸 알려 주는 \u003cb class=\"key\">소개\u003c/b> 문장이에요. 어떤 사람은 자기 나라에 남고, 어떤 사람은 다른 나라로 가요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 앞 내용(Some remain) + and + 뒤 내용(others move) : \"그리고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소 짝꿍 말(전치사)\u003c/span> : move + to + 장소(different countries) : \"다른 나라로\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Some remain, 어떤 사람들은 남아요. in their own country, 자신의 나라에. and others move, 그리고 다른 사람들은 이동해요. to different countries, 다른 나라로. 이 문장 전체를 해석하면, 어떤 사람들은 자신의 나라에 남고, 다른 사람들은 다른 나라로 이동하기도 해.\"","hl":"m"},{"n":31,"text":"이 문장은 외교관마다 일하는 곳이 다르다는 걸 알려 주는 소개 문장이에요. 어떤 사람은 자기 나라에 남고, 어떤 사람은 다른 나라로 가요.","hl":"mn"},{"n":32,"text":"첫 번째, and는 앞 내용과 뒤 내용을 나란히 이어 주는 말이에요. 그래서 and는 그리고라는 뜻의 접속사예요. 두 번째, to는 어디로 가는지 장소를 붙여 주는 짝꿍 말이에요. 그래서 move to는 다른 나라로 이동하다라는 뜻이 된답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 또한 덧붙였어요,\u003c/span>\u003cspan class=\"en\">He also added,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">&quot;문제가 있을 때\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">problems\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">두 나라 사이에\u003c/span>\u003cspan class=\"en\">between two countries,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 외교관들이 만나요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">diplomats \u003c/span>\u003cspan class=\"tgt\">meet\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">서로\u003c/span>\u003cspan class=\"en\">with each other.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 또한 덧붙였어요, &quot;두 나라 사이에 문제가 있을 때, 그들의 외교관들이 서로 만난단다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 외교관이 하는 중요한 일을 \u003cb class=\"key\">설명\u003c/b>하는 문장이에요. 두 나라 사이에 문제가 생기면 외교관들이 직접 만나서 이야기해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사) when\u003c/span> : When + 어떤 때(there are problems), 그때 ~해요 : \"문제가 있을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">여러 명일 때 동사 그대로(복수 주어)\u003c/span> : 여러 명(their diplomats) + 한다(meet) : \"그들의 외교관들이 만난다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"He also added, 그는 또한 덧붙였어요. \"When there are problems, \"문제가 있을 때. between two countries, 두 나라 사이에. their diplomats meet, 그들의 외교관들이 만나요. with each other, 서로. 이 문장 전체를 해석하면, 그는 또한 덧붙였어요, \"두 나라 사이에 문제가 있을 때, 그들의 외교관들이 서로 만난단다.","hl":"m"},{"n":34,"text":"이 문장은 외교관이 하는 중요한 일을 설명해요. 두 나라 사이에 문제가 생기면 외교관들이 직접 만나서 이야기한대요.","hl":"mn"},{"n":35,"text":"첫 번째, when은 ~할 때라는 뜻으로 때를 알려 주는 접속사예요. 앞으로 올 상황과 뒷문장을 자연스럽게 이어 주죠. 두 번째, diplomats처럼 여러 명이 주어이면 동사에 s를 붙이지 않아요. 그래서 meet이라고 그대로 쓴답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 ~에 대해 이야기해요\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">talk \u003c/span>\u003cspan class=\"tgt\">about\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무역 같은 것들\u003c/span>\u003cspan class=\"en\">things like \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">trade \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또는 평화\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">peace\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 무역이나 평화와 같은 일들에 대해 논의하지.&quot;\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 외교관들이 만나서 어떤 이야기를 하는지 알려 주는 문장이에요. 무역이나 평화처럼 \u003cb class=\"key\">중요한\u003c/b> 일을 서로 이야기해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">짝꿍 말(전치사) about\u003c/span> : talk + about + 무엇(things) : \"~에 대해 이야기하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">고르는 이어 주는 말(접속사) or\u003c/span> : 무역(trade) + or + 평화(peace) : \"무역 또는 평화\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"They talk about, 그들은 ~에 대해 이야기해요. things like trade, 무역 같은 것들. or peace, 또는 평화. 이 문장 전체를 해석하면, 그들은 무역이나 평화와 같은 일들에 대해 논의하지.\"","hl":"m"},{"n":37,"text":"이 문장은 외교관들이 만나서 어떤 이야기를 하는지 알려 줘요. 무역이나 평화처럼 중요한 일을 서로 이야기한답니다.","hl":"mn"},{"n":38,"text":"첫 번째, about은 ~에 대해서라고 이야기 주제를 붙여 주는 전치사예요. talk와 만나면 이야기하다가 된답니다. 두 번째, or는 두 가지 중 하나를 고를 때 쓰는 접속사예요. 무역이나 평화처럼 말할 때 쓰죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러고 나서 아빠는\u003c/span>\u003cspan class=\"en\">Then he\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나에게 구경시켜 주셨어요.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">showed\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">me\u003c/span> around.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러고 나서 아빠는 나에게 구경시켜 주셨어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 말로 설명을 들은 뒤, 아빠가 직접 나를 데리고 다니며 직장을 \u003cb class=\"key\">구경시켜\u003c/b> 주셨다는 뜻이에요. 설명이 끝나고 진짜 구경이 시작되는 장면이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거형=지난 일 말(과거형)\u003c/span> : 지난 일(Then) + 보여 주다(showed) : \"보여 주셨어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">목적어=무엇을·누구를(목적어)\u003c/span> : 보여 주다(showed) + 누구에게(me) : \"나에게\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"Then he, 그러고 나서 아빠는. showed me around, 나에게 구경시켜 주셨어요.. 이 문장 전체를 해석하면, 그러고 나서 아빠는 나에게 구경시켜 주셨어요.","hl":"m"},{"n":40,"text":"이 문장은 아빠가 말로만 설명하지 않고 직접 나를 데리고 다니며 직장을 구경시켜 주셨다는 뜻이에요. 설명이 끝나고 진짜 구경이 시작되는 장면이죠.","hl":"mn"},{"n":41,"text":"첫 번째, showed는 이미 지난 일이라서 동사 show에 ed를 붙인 과거형이에요. 두 번째, me는 '나에게'라는 목적어예요. show 다음에 누구에게 보여 주는지 꼭 챙겨 주세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여기에 있는 사람들은\u003c/span>\u003cspan class=\"en\">&quot;People here\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 다른 일들을 해.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">do\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">many \u003c/span>\u003cspan class=\"tgt\">other \u003c/span>\u003cspan class=\"tgt\">things\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">&quot;여기에 있는 사람들은 많은 다른 일들을 해.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아빠 직장 사람들은 여러 가지 \u003cb class=\"key\">다른 \u003c/b>\u003cb class=\"key\">일\u003c/b>도 한다는 걸 알려 주는 문장이에요. 다음에 그 일들을 하나씩 설명하려고 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재형=지금 하는 일(현재형)\u003c/span> : 여러 사람(People) + 해요(do) : \"해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수량 표현(many)\u003c/span> : 많은(many) + 다른(other) + 일들(things) : \"많은 다른 일들\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"\"People here, 여기에 있는 사람들은. do many other things, 많은 다른 일들을 해.. 이 문장 전체를 해석하면, \"여기에 있는 사람들은 많은 다른 일들을 해.","hl":"m"},{"n":43,"text":"아빠가 자기 직장 사람들은 여러 가지 다른 일도 한다고 알려 주는 문장이에요. 그래서 다음에 그 일들을 하나씩 보여 주려고 하죠.","hl":"mn"},{"n":44,"text":"먼저, 주어 People은 여러 사람이라서 동사가 do예요. 그래서 s를 붙이지 않는 현재형이죠. 그리고 many는 셀 수 있는 things 앞에 붙어서 '많은'이라는 뜻을 더해 줘요. 마지막으로 here는 People 뒤에 붙어서 '여기에 있는'이라고 꾸며 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몇몇 사람들은 소개한단다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Some\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">introduce \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리나라를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">country \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 이들에게.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">others\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">몇몇 사람들은 우리나라를 다른 나라들에게 소개한단다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 직장 사람들이 하는 일 중 하나로, 우리나라를 다른 나라 사람들에게 \u003cb class=\"key\">소개\u003c/b>한다는 뜻이에요. 아빠의 설명이 점점 자세해지고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">대명사=대신하는 말(대명사)\u003c/span> : Some(몇몇 사람들은) + introduce(소개해요) : \"몇몇 사람들은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to + 대상(전치사)\u003c/span> : 소개하다(introduce) + 무엇을(our country) + to 누구에게(to others) : \"우리나라를 다른 이들에게 소개해요\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"Some introduce, 몇몇 사람들은 소개한단다. our country, 우리나라를. to others, 다른 이들에게.. 이 문장 전체를 해석하면, 몇몇 사람들은 우리나라를 다른 나라들에게 소개한단다.","hl":"m"},{"n":46,"text":"직장 사람들이 하는 일 중 하나로, 우리나라를 다른 나라 사람들에게 소개한다고 말하는 문장이에요. 아빠의 설명이 점점 자세해지고 있네요.","hl":"mn"},{"n":47,"text":"먼저, Some은 앞에 나온 people을 대신하는 대명사예요. 그래서 '몇몇 사람들은'이라는 뜻이 되죠. 그리고 introduce 다음에는 무엇을 소개하는지 our country를 놓고, to 뒤에는 누구에게 소개하는지 others를 놓아요. introduce our country to others, 이렇게 덩어리로 통째로 기억해 두면 아주 좋아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몇몇은 만든다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Some\u003c/span> make\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">비자를\u003c/span>\u003cspan class=\"en\">visas\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또는 여권을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">or\u003c/span> passports.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">몇몇은 비자나 여권을 만들지.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아빠 회사 사람들이 하는 여러 일 중 하나를 말해요. 몇몇은 \u003cb class=\"key\">비자\u003c/b>나 \u003cb class=\"key\">여권\u003c/b>을 만든다고 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">대신하는 말(대명사)\u003c/span> : Some(몇몇은) + 동사(make) : \"몇몇은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : visas(비자) + or(또는) + passports(여권) : \"또는\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"Some make, 몇몇은 만든다. visas, 비자를. or passports, 또는 여권을. 이 문장 전체를 해석하면, 몇몇은 비자나 여권을 만들지.","hl":"m"},{"n":49,"text":"사람들이 하는 여러 일 중 하나를 말하는 문장이에요. 몇몇은 비자나 여권을 만든다고 해요.","hl":"mn"},{"n":50,"text":"첫 번째, Some은 앞에 나온 사람들 중 몇몇을 가리키는 대명사예요. 두 번째, or는 비자 또는 여권처럼 두 가지를 이어 주는 접속사예요. 그래서 '몇몇은 비자 또는 여권을 만들어요'라는 뜻이 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 사람들은 모은다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Others\u003c/span> gather\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정보를\u003c/span>\u003cspan class=\"en\">information\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정치에 대한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">about \u003c/span>\u003cspan class=\"tgt\">politics\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">다른 사람들은 정치에 대한 정보를 모은단다.&quot;\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 몇몇 이야기를 했으니, 이번엔 나머지 사람들이 하는 일을 말해요. 정치에 관한 \u003cb class=\"key\">정보\u003c/b>를 모은다고 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">대신하는 말(대명사)\u003c/span> : Others(다른 사람들은) + 동사(gather) : \"다른 사람들은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">짝꿍 말(전치사)\u003c/span> : information(정보) + about(~에 대한) + politics(정치) : \"정치에 대한\"\u003c/div>\u003c/div>","segs":[{"n":51,"text":"Others gather, 다른 사람들은 모은다. information, 정보를. about politics, 정치에 대한. 이 문장 전체를 해석하면, 다른 사람들은 정치에 대한 정보를 모은단다.\"","hl":"m"},{"n":52,"text":"앞에서 몇몇 이야기를 했으니, 이번에는 다른 사람들이 하는 일을 말해요. 정치에 대한 정보를 모은다고 해요.","hl":"mn"},{"n":53,"text":"첫 번째, Others는 앞에서 말한 몇몇과 짝이 되는 말로, 다른 사람들을 가리키는 대명사예요. 두 번째, about은 '~에 대한'이라는 뜻을 가진 전치사예요. 그래서 어떤 정보인지 정치에 관한 것이라고 알려 주는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 15 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">처음에는\u003c/span>\u003cspan class=\"en\">At first,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 몰랐어요\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">didn't \u003c/span>\u003cspan class=\"tgt\">know\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많이\u003c/span>\u003cspan class=\"en\">much\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아빠의 직업에 대해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">about \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">job\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">처음에 나는 아빠의 직업에 대해 많이 알지 못했어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아빠 직업을 \u003cb class=\"key\">처음\u003c/b>에는 잘 몰랐다는 걸 말해요. 뒤에 나오는 '이제는 더 안다'는 말과 짝을 이루는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 부정문(did 부정문)\u003c/span> : 누가(I) + didn't + 한다(know) : \"몰랐어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">짝꿍 말(전치사)\u003c/span> : much(많이) + about(~에 대해) + his job(아빠의 직업) : \"아빠의 직업에 대해\"\u003c/div>\u003c/div>","segs":[{"n":54,"text":"At first, 처음에는. I didn't know, 나는 몰랐어요. much, 많이. about his job, 아빠의 직업에 대해. 이 문장 전체를 해석하면, 처음에 나는 아빠의 직업에 대해 많이 알지 못했어요.","hl":"m"},{"n":55,"text":"아빠 직업에 대해 처음에는 잘 몰랐다는 걸 말하는 문장이에요. 뒤에 나오는 '이제는 더 안다'는 말과 짝을 이뤄요.","hl":"mn"},{"n":56,"text":"첫 번째, didn't는 지난 일을 하지 않았다고 말할 때 쓰는 말이에요. 이때 동사는 원형 그대로 두고 know에 d를 붙이지 않아요. 두 번째, about은 '~에 대해'라는 뜻이라서 무엇에 대해 많이 아는지 알려 줘요. his는 앞에 나온 아빠를 가리키는 말이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 16 / 16\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이제 나는 더 많이 알게 되었고,\u003c/span>\u003cspan class=\"en\">Now \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">know\u003c/span> more,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 나는 자랑스러워요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">I'm \u003c/span>\u003cspan class=\"tgt\">proud \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내 아빠가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">my \u003c/span>\u003cspan class=\"tgt\">dad\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이제 나는 더 많이 알게 되었고, 내 아빠가 자랑스러워요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 예전에는 아빠 일을 잘 몰랐지만 이제는 더 많이 알게 되어서 아빠가 자랑스럽다는 마음을 말해요. 이야기를 따뜻하게 닫아 주는 \u003cb class=\"key\">마무리\u003c/b> 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재형(현재 시제)\u003c/span> : 누가(I) + 안다(know) : \"나는 알아요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 앞 문장 + and + 뒤 문장 : \"그리고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">be동사 + 꾸며 주는 말(be동사 + 형용사)\u003c/span> : 누가(I) + 이다(am) + 자랑스러운(proud) + 대상(of my dad) : \"나는 내 아빠가 자랑스러워요\"\u003c/div>\u003c/div>","segs":[{"n":57,"text":"Now I know more, 이제 나는 더 많이 알게 되었고. and I'm proud, 그리고 나는 자랑스러워요. of my dad, 내 아빠가. 이 문장 전체를 해석하면, 이제 나는 더 많이 알게 되었고, 내 아빠가 자랑스러워요.","hl":"m"},{"n":58,"text":"이 문장은 이야기의 마지막이에요. 아빠 일을 잘 몰랐던 아이가 이제는 더 많이 알게 되었고, 그래서 아빠가 자랑스럽다고 말해요. 마음이 따뜻해지는 마무리 문장이죠.","hl":"mn"},{"n":59,"text":"문법을 두 가지 짚어 볼게요. 첫 번째, 동사 know는 지금의 상태를 말하는 현재형이에요. 그래서 s를 붙이지 않고 그대로 써요. 두 번째, and는 두 가지 생각을 이어 주는 접속사예요. '이제 더 많이 알아요'와 '아빠가 자랑스러워요'를 자연스럽게 이어 주죠. 그리고 I'm proud of my dad를 볼까요. be동사 am 뒤에 형용사 proud가 와서 자랑스러운 상태를 말해요. 자랑스러운 대상은 of my dad처럼 of로 이어 줘요. 여러분도 가족에게 I'm proud of you라고 말해 보세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">오늘 배운 내용 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>아빠의 일 때문에 가족이 \u003cb class=\"key\">캐나다\u003c/b>로 이사했어요.\u003c/li>\u003cli>\u003cb class=\"key\">외교관\u003c/b>은 자신의 나라를 위해 일해요.\u003c/li>\u003cli>두 나라 사이에 문제가 있으면 외교관들이 만나 \u003cb class=\"key\">무역\u003c/b>과 \u003cb class=\"key\">평화\u003c/b>를 이야기해요.\u003c/li>\u003cli>이제 아이는 아빠의 일을 잘 알게 되어 \u003cb class=\"key\">자랑스러워해요\u003c/b>.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Diplomats work for their country and solve problems between countries by talking together.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">아빠의 일 때문에 가족이 \u003cb class=\"key\">캐나다\u003c/b>로 이사한 뒤, 아이가 \u003cb class=\"key\">외교관\u003c/b>인 아빠의 일을 하나씩 배워요. 외교관은 나라를 위해 일하고 두 나라 사이 문제를 \u003cb class=\"key\">대화\u003c/b>로 풀며, 이제 아이는 아빠가 \u003cb class=\"key\">자랑스러워요\u003c/b>.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":60,"text":"오늘 우리는 외교관인 아빠의 일을 배웠어요. 외교관은 나라를 위해 일하고, 두 나라 사이 문제를 대화로 풀어 간다는 것도 알았죠. 끝까지 집중해서 읽어 준 여러분, 정말 멋져요. 다음 시간에도 재미있는 이야기로 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
