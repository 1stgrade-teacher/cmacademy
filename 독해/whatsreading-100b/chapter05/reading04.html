@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"왓츠 리딩 100B Ch.5 Unit 04 Yi Ye","audioDir":"reading04_audio","preview":false,"count":45,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.668em\">Ch.5\u003cbr>Unit 04\u003cbr>Yi Ye\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">왓츠 리딩 100B\u003c/div>\u003ch1>Yi Ye, the Greatest Diplomat of Joseon\u003c/h1>\u003ch2>조선 최고의 외교관, 이예\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">한 줄 요약\u003c/span>\u003cspan>요약: 조선 시대에 일본의 침략이 많았지만, 외교관 이예는 일본에서 한국인들을 다시 데려왔어요. 어머니를 잃은 \u003cb class=\"key\">아픔\u003c/b>을 알았기에 그는 다른 사람의 고통을 이해하고 적과 \u003cb class=\"key\">평화\u003c/b>를 택한 훌륭한 외교관이 되었어요.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Yi Ye became the greatest diplomat because he understood people's pain and chose peace with Japan.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘 함께 읽을 글은 조선 시대의 외교관 이예 이야기예요. 일본에 끌려간 한국 사람들을 다시 집으로 데려온 멋진 사람이지요. 오늘 글은 한 문장으로 말하면, 이예가 훌륭한 외교관이 된 이유와 그가 한 일에 대한 이야기예요. 자, 그럼 같이 시작해 볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">미리 알면 쉬워요\u003c/span>\u003cdiv class=\"lp-box\">조선은 우리나라의 옛날 나라이고, 일본은 바다 건너에 있는 이웃 나라예요. 옛날에는 두 나라 사이에 \u003cb class=\"key\">전쟁\u003c/b>이 자주 일어났어요. 외교관(diplomat)은 나라와 나라 사이에서 이야기를 풀어 가는 사람이에요. 친구들 사이에서 싸움을 말리는 중간 역할과 비슷하지요. 이예는 일본에 끌려간 한국인들을 다시 집으로 데려온 \u003cb class=\"key\">외교관\u003c/b>이에요.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식부터 알아 볼게요. 조선은 우리나라의 옛날 나라이고, 일본은 바다 건너에 있는 이웃 나라예요. 옛날에는 두 나라 사이에 전쟁이 자주 일어났어요. 그런데 diplomat, 즉 외교관은 나라와 나라 사이에서 이야기를 풀어 가는 사람이에요. 여러분은 친구 사이에서 싸움을 말려 본 적 있나요? 외교관은 그런 중간 역할을 나라 사이에서 하는 사람이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>침략과 사람들\u003csmall>문제 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>조선 시대에 일본 해군이 한국 사람들을 \u003cb class=\"key\">포로\u003c/b>로 잡았어요. 60여 년 동안 \u003cb class=\"key\">침략\u003c/b>이 184번이나 있었지요. 하지만 이예가 \u003cb class=\"key\">외교관\u003c/b>으로 일하자 그 수가 줄어들었어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>이예의 아픔\u003csmall>이유 · 문장 4–6\u003c/small>\u003c/h4>\u003cp>이예는 외교관으로 43년 동안 667명의 한국인을 일본에서 다시 \u003cb class=\"key\">데려왔어요\u003c/b>. 그런데 그는 여덟 살 때 \u003cb class=\"key\">어머니\u003c/b>를 잃었어요. 그래서 남은 생애 동안 어머니를 찾았답니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>이해하는 마음\u003csmall>바뀜 · 문장 7–8\u003c/small>\u003c/h4>\u003cp>어머니를 잃은 아픔 덕분에 그는 다른 사람들의 \u003cb class=\"key\">고통\u003c/b>을 누구보다 잘 이해했어요. 일본을 많이 알았기 때문에 \u003cb class=\"key\">최고의 \u003c/b>\u003cb class=\"key\">외교관\u003c/b>이 되었지요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>평화의 약속\u003csmall>해결 · 문장 9–11\u003c/small>\u003c/h4>\u003cp>그는 일본인들이 한국에 20일 동안 머물 수 있는 \u003cb class=\"key\">조약\u003c/b>을 맺었어요. 머물 곳과 먹을 음식도 주었지요. 이예는 \u003cb class=\"key\">적\u003c/b>과도 평화롭고 친하게 지내는 쪽을 선택했어요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 한 문장으로 먼저 볼게요. 문제가 생기고, 그 문제를 푸는 사람이 나오는 이야기예요.","hl":null},{"n":4,"text":"첫 번째 단계는 침략과 사람들이에요. 조선 시대에 일본 해군이 한국 사람들을 포로로 잡았어요. 예순 해가 넘는 동안 침략이 백여든네 번이나 있었지요. 그런데 이예가 외교관으로 일하자 그 수가 줄어들었어요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 이예의 아픔이에요. 이예는 외교관으로 마흔세 해 동안 육백육십칠 명의 한국인을 일본에서 다시 데려왔어요. 그런데 그는 여덟 살 때 어머니를 잃었어요. 그래서 남은 생애 동안 어머니를 찾았답니다.","hl":"f1"},{"n":6,"text":"세 번째 단계는 이해하는 마음이에요. 어머니를 잃은 아픔이 있었기에 그는 다른 사람들의 고통을 누구보다 잘 이해했어요. 그리고 일본을 많이 알았기 때문에 최고의 외교관이 되었지요.","hl":"f2"},{"n":7,"text":"네 번째 단계는 평화의 약속이에요. 그는 일본 사람들이 한국에 스무 날 동안 머물 수 있는 조약을 맺었어요. 머물 곳과 먹을 음식도 주었지요. 이렇게 이예는 적과도 평화롭고 친하게 지내는 쪽을 선택했어요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결 짜임\u003c/span>\u003cspan class=\"lp-pill\">가운데\u003c/span>\u003cspan class=\"lp-pill\">주제문 8번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 일본의 침략이라는 문제로 시작해요. 가운데에서 이예가 \u003cb class=\"key\">최고의 \u003c/b>\u003cb class=\"key\">외교관\u003c/b>이라는 중심 생각을 말해요. 그 뒤에 그가 한 일을 \u003cb class=\"key\">예시\u003c/b>로 보여 주지요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>When (5)\u003c/b>\u003cspan>때를 알려 줌\u003c/span>\u003cb>However (3)\u003c/b>\u003cspan>앞 내용과 반대되는 내용을 알려 줌\u003c/span>\u003cb>So (7)\u003c/b>\u003cspan>앞의 이유 때문에 생긴 결과를 알려 줌\u003c/span>\u003cb>because (8)\u003c/b>\u003cspan>이유를 알려 줌\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">the Japanese Navy\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Japan\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the Japanese\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the enemy\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글의 짜임은 문제와 해결이에요. 가운데에 중심 문장이 있고, 그 뒤에 그 이유를 보여 주는 예시가 이어져요. 그래서 읽을 때 가운데 문장을 찾으면 글 전체가 쉽게 보여요.","hl":"ty"},{"n":9,"text":"글에는 길잡이 말이 숨어 있어요. However가 나오면 앞 내용과 반대되는 이야기가 시작되고, So가 나오면 앞의 이유 때문에 생긴 결과를 말해요. 그리고 because는 이유를 알려 주지요. 또 일본 해군, Japan, the Japanese, the enemy처럼 같은 대상을 다르게 부르는 말도 찾아보세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 단어\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>during\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~동안\u003c/span>\u003c/div>\u003cdiv>\u003cb>capture\u003c/b>\u003cem>동사\u003c/em>\u003cspan>포로로 잡다\u003c/span>\u003c/div>\u003cdiv>\u003cb>navy\u003c/b>\u003cem>명사\u003c/em>\u003cspan>해군\u003c/span>\u003c/div>\u003cdiv>\u003cb>invasion\u003c/b>\u003cem>명사\u003c/em>\u003cspan>침략\u003c/span>\u003c/div>\u003cdiv>\u003cb>go down\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>줄어들다\u003c/span>\u003c/div>\u003cdiv>\u003cb>diplomat\u003c/b>\u003cem>명사\u003c/em>\u003cspan>외교관\u003c/span>\u003c/div>\u003cdiv>\u003cb>bring back\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>다시 데려오다\u003c/span>\u003c/div>\u003cdiv>\u003cb>the rest of his life\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>그의 남은 생애\u003c/span>\u003c/div>\u003cdiv>\u003cb>pain\u003c/b>\u003cem>명사\u003c/em>\u003cspan>고통, 아픔\u003c/span>\u003c/div>\u003cdiv>\u003cb>understand\u003c/b>\u003cem>동사\u003c/em>\u003cspan>이해하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>greatest\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>가장 훌륭한\u003c/span>\u003c/div>\u003cdiv>\u003cb>sign\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(조약을) 맺다\u003c/span>\u003c/div>\u003cdiv>\u003cb>deal\u003c/b>\u003cem>명사\u003c/em>\u003cspan>조약, 거래\u003c/span>\u003c/div>\u003cdiv>\u003cb>stay\u003c/b>\u003cem>동사\u003c/em>\u003cspan>머물다\u003c/span>\u003c/div>\u003cdiv>\u003cb>peaceful\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>평화로운\u003c/span>\u003c/div>\u003cdiv>\u003cb>friendly\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>친한, 다정한\u003c/span>\u003c/div>\u003cdiv>\u003cb>enemy\u003c/b>\u003cem>명사\u003c/em>\u003cspan>적\u003c/span>\u003c/div>\u003cdiv>\u003cb>choose\u003c/b>\u003cem>동사\u003c/em>\u003cspan>선택하다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"오늘의 단어도 소리 내어 읽어 볼게요. capture는 포로로 잡다, invasion은 침략, diplomat은 외교관이라는 뜻이에요. bring back은 다시 데려오다, pain은 고통, peaceful은 평화로운이라는 뜻이지요. 큰 소리로 따라 읽어 보세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">capture\u003c/b>\u003cspan class=\"m\">포로로 잡다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">catch\u003c/span>\u003cspan class=\"s\">seize\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">free\u003c/span>\u003cspan class=\"a\">release\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">invasion\u003c/b>\u003cspan class=\"m\">침략\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">attack\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">peace\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">pain\u003c/b>\u003cspan class=\"m\">고통\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">hurt\u003c/span>\u003cspan class=\"s\">suffering\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">joy\u003c/span>\u003cspan class=\"a\">comfort\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">peaceful\u003c/b>\u003cspan class=\"m\">평화로운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">calm\u003c/span>\u003cspan class=\"s\">quiet\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">violent\u003c/span>\u003cspan class=\"a\">dangerous\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">enemy\u003c/b>\u003cspan class=\"m\">적\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">foe\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">friend\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">understand\u003c/b>\u003cspan class=\"m\">이해하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">know\u003c/span>\u003cspan class=\"s\">get\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">misunderstand\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"비슷한 말과 반대말도 함께 알아 볼게요. capture는 catch나 seize와 비슷하고, free나 release와 반대예요. pain은 hurt와 비슷하고 joy와 반대지요. peaceful은 calm과 비슷하고 violent와 반대예요. enemy의 반대말은 friend라는 것도 꼭 기억해요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">조선 시대 동안,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">During \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">Joseon \u003c/span>\u003cspan class=\"tgt\">Dynasty\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일본 해군은\u003c/span>\u003cspan class=\"en\">the Japanese Navy\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들을 포로로 잡았습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">captured \u003c/span>\u003cspan class=\"tgt\">people\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한국에서\u003c/span>\u003cspan class=\"en\">from Korea.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">조선 시대 동안, 일본 해군은 한국에서 사람들을 포로로 잡았습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 조선 시대에 일본 해군이 한국 사람들을 잡아간 일을 알려 주는 문장이에요. 이예 이야기의 \u003cb class=\"key\">배경\u003c/b>을 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사(장소·시간 짝꿍 말)\u003c/span> : 시간 짝꿍 말(During) + 때(the Joseon Dynasty) : \"조선 시대 동안\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거형(지난 일 말)\u003c/span> : 잡다(capture) + d = 잡았다(captured) : \"포로로 잡았습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">목적어(무엇을·누구를)\u003c/span> : 했다(captured) + 무엇을(people) : \"사람들을 잡았어요\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"During the Joseon Dynasty, 조선 시대 동안. the Japanese Navy, 일본 해군은. captured people, 사람들을 포로로 잡았습니다. from Korea, 한국에서. 이 문장 전체를 해석하면, 조선 시대 동안, 일본 해군은 한국에서 사람들을 포로로 잡았습니다.","hl":"m"},{"n":13,"text":"이 문장은 조선 시대에 일본 해군이 한국 사람들을 잡아간 일을 알려 줘요. 이예 이야기의 배경을 보여 주는 문장이에요.","hl":"mn"},{"n":14,"text":"첫 번째, During은 '~동안'이라는 뜻의 전치사예요. 뒤에 조선 시대처럼 때를 나타내는 말이 와요. 두 번째, captured는 capture에 d를 붙인 과거형이에요. 지난 일이라서 과거형으로 말했어요. 세 번째, 영어는 누가, 했다, 무엇을 차례예요. people은 무엇을에 해당하는 목적어예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">60여 년 동안\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Over \u003c/span>\u003cspan class=\"tgt\">60 \u003c/span>\u003cspan class=\"tgt\">years\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">있었어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">were\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">184번의 침략이\u003c/span>\u003cspan class=\"en\">184 invasions.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">60여 년간 184번의 침략이 있었어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 60여 년 동안 184번이나 침략이 있었다는 뜻이에요. 일본의 공격이 얼마나 많았는지 \u003cb class=\"key\">숫자\u003c/b>로 보여 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사(장소·시간 짝꿍 말)\u003c/span> : 넘는(Over) + 60년(60 years) : \"60여 년 동안\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">There is/are(~이 있다)\u003c/span> : There + were + 무엇이(184 invasions) : \"있었어요\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Over 60 years, 60여 년 동안. there were, 있었어요. 184 invasions, 184번의 침략이. 이 문장 전체를 해석하면, 60여 년간 184번의 침략이 있었어요.","hl":"m"},{"n":16,"text":"이 문장은 예순 해가 넘는 동안 백팔십사 번이나 침략이 있었다고 알려 줘요. 얼마나 자주 공격을 받았는지 숫자로 보여 주는 문장이에요.","hl":"mn"},{"n":17,"text":"첫 번째, Over는 '~이 넘게'라는 뜻의 전치사예요. 시간 앞에 오면 기간을 말해요. 두 번째, there were는 '~이 있었다'라는 뜻이에요. 지난 일이니까 are 대신 were를 써서 과거를 나타냈어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 그 횟수는\u003c/span>\u003cspan class=\"en\">However, the number\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">줄어들었습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u c/span>\u003cspan class=\"tgt\">43 \u003c/span>\u003cspan class=\"tgt\">years\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">외교관으로서\u003c/span>\u003cspan class=\"en\">as a diplomat,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이예는 데려왔어요\u003c/span>\u003cspan class=\"en\">Yi Ye \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">brought \u003c/span>\u003cspan class=\"tgt\">back\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">667명의 한국인들을\u003c/span>\u003cspan class=\"en\">667 Koreans\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일본에서\u003c/span>\u003cspan class=\"en\">from Japan.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">외교관으로서의 43년 동안, 이예는 667명의 한국인들을 일본에서 다시 데려왔습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이예가 \u003cb class=\"key\">외교관\u003c/b>으로 일한 43년 동안 일본에 끌려간 한국인 667명을 \u003cb class=\"key\">다시 \u003c/b>\u003cb class=\"key\">데려왔다\u003c/b>는 뜻이에요. 힘들었던 사람들을 구한 \u003cb class=\"key\">큰 \u003c/b>\u003cb class=\"key\">성과\u003c/b>를 보여 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사(장소·시간 짝꿍 말)\u003c/span> : 동안(During) + 기간(his 43 years) : \"그의 43년 동안\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거형(지난 일 말)\u003c/span> : 누가(Yi Ye) + 데려왔다(brought back) + 누구를(667 Koreans) : \"데려왔어요\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"During his 43 years, 그의 43년 동안. as a diplomat, 외교관으로서. Yi Ye brought back, 이예는 데려왔어요. 667 Koreans, 667명의 한국인들을. from Japan, 일본에서. 이 문장 전체를 해석하면, 외교관으로서의 43년 동안, 이예는 667명의 한국인들을 일본에서 다시 데려왔습니다.","hl":"m"},{"n":22,"text":"이 문장은 이예가 외교관으로 일한 마흔세 해 동안 어떤 일을 했는지 말해요. 일본에 끌려간 한국인 육백예순일곱 명을 다시 데려왔다는 뜻이죠. 정말 큰 성과예요.","hl":"mn"},{"n":23,"text":"첫 번째, During은 '~동안'이라는 시간을 알려 주는 말 knew, 왜냐하면 그는 알고 있었기 때문에. a lot about Japan, 일본에 대해 많이. 이 문장 전체를 해석하면, 그는 일본에 대해 많이 알았기 때문에 가장 훌륭한 외교관이었습니다.","hl":"m"},{"n":34,"text":"이 문장은 일본을 잘 알았기 때문에 그가 최고의 외교관이었다는 뜻이에요. 이유와 결과가 한 문장 안에 같이 들어 있죠.","hl":"mn"},{"n":35,"text":"첫째, the greatest는 최상급이에요. 여러 명 중에서 가장 으뜸이라는 뜻이죠. 둘째, because는 이유를 이어 주는 접속사예요. 왜 최고였는지 뒤에서 알려 줘요. 이 문장은 꼭 외워 두면 좋아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그가 조약을 맺어서\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">signed\u003c/span> a deal\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서 일본인들이 머물 수 있었어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">so\u003c/span> the Japanese \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">could \u003c/span>\u003cspan class=\"tgt\">stay\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한국에서 20일 동안\u003c/span>\u003cspan class=\"en\">in Korea for 20 days.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그가 조약을 맺어서 일본인들이 한국에서 20일 동안 머물 수 있었어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 그가 일본과 \u003cb class=\"key\">조약\u003c/b>을 맺어서, 일본인들이 한국에서 이십 일 동안만 머물 수 있게 되었다는 뜻이에요. \u003cb class=\"key\">원인\u003c/b>과 \u003cb class=\"key\">결과\u003c/b>를 so로 이어 말해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 지난 일이면 동사 뒤에 -ed(sign → signed) : \"맺었어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 원인(He signed a deal) + so + 결과(the Japanese could stay) : \"그래서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">도와주는 동사(조동사)\u003c/span> : 주어 + could + 동사원형(stay) : \"머물 수 있었어요\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"He signed a deal, 그가 조약을 맺어서. so the Japanese could stay, 그래서 일본인들이 머물 수 있었어요. in Korea for 20 days, 한국에서 20일 동안. 이 문장 전체를 해석하면, 그가 조약을 맺어서 일본인들이 한국에서 20일 동안 머물 수 있었어요.","hl":"m"},{"n":37,"text":"이 문장은 그가 조약을 맺어서 일본인들이 한국에서 이십 일 동안만 머물 수 있게 되었다는 뜻이에요. 원인과 결과가 so로 이어져 있죠.","hl":"mn"},{"n":38,"text":"첫째, signed는 지난 일을 말하는 과거형이에요. sign에 ed를 붙였죠. 둘째, could stay에서 could는 도와주는 동사인 조동사예요. 조동사 뒤에는 동사원형 stay가 와요. 셋째, so는 원인과 결과를 이어 주는 접속사예요. 오늘 세 문장 모두 정말 잘 따라왔어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 또한 얻을 수 있었어요\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">could\u003c/span> also get\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">머물 곳을\u003c/span>\u003cspan class=\"en\">a place \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">stay\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 먹을 음식을\u003c/span>\u003cspan class=\"en\">and food to eat.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 머물 곳과 먹을 음식도 얻을 수 있었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 말한 \u003cb class=\"key\">계약\u003c/b>의 내용을 자세히 알려 줘요. 그들은 \u003cb class=\"key\">머물 \u003c/b>\u003cb class=\"key\">곳\u003c/b>과 \u003cb class=\"key\">먹을 \u003c/b>\u003cb class=\"key\">음식\u003c/b>도 얻을 수 있었다는 뜻이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">도와주는 동사(조동사)\u003c/span> : 누가(They) + 할 수 있었다(could) + 무엇을(get) : \"~할 수 있었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to + 동사원형(to부정사)\u003c/span> : 머물 곳(a place) + to stay(머물) : \"머물\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"They could also get, 그들은 또한 얻을 수 있었어요. a place to stay, 머물 곳을. and food to eat, 그리고 먹을 음식을. 이 문장 전체를 해석하면, 그들은 머물 곳과 먹을 음식도 얻을 수 있었습니다.","hl":"m"},{"n":40,"text":"이 문장은 앞에서 말한 계약의 내용을 자세히 알려 줘요. 그들은 머물 곳과 먹을 음식도 얻을 수 있었다는 뜻이에요.","hl":"mn"},{"n":41,"text":"먼저 could는 can의 과거 모양이고 '할 수 있었다'는 뜻이에요. get 앞에서 조동사로 힘을 보태 주죠. 그리고 to stay는 '머물'이라는 뜻으로 a place를 꾸며 줘요. 이렇게 명사를 꾸미는 to부정사가 '머물 곳'을 만들어 준답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이예는 선택했어요\u003c/span>\u003cspan class=\"en\">Yi Ye \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">chose\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">평화롭고 친하게 지내는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">stay\u003c/span> peaceful and friendly\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">적과\u003c/span>\u003cspan class=\"en\">with the enemy.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이예는 적과 평화롭고 친하게 지내는 것을 선택했어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이예는 싸우지 않고 적과도 평화롭고 친하게 지내려고 했어요. 그래서 이예의 \u003cb class=\"key\">마음가짐\u003c/b>을 잘 보여 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(Yi Ye) + 선택했어요(chose) : \"선택했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to + 동사원형(to부정사)\u003c/span> : 선택했어요(chose) + ~하는 것을(to stay) : \"지내는 것을\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"Yi Ye chose, 이예는 선택했어요. to stay peaceful and friendly, 평화롭고 친하게 지내는 것을. with the enemy, 적과. 이 문장 전체를 해석하면, 이예는 적과 평화롭고 친하게 지내는 것을 선택했어요.","hl":"m"},{"n":43,"text":"이 문장은 이예가 싸우지 않고 적과도 평화롭고 친하게 지내려고 했음을 보여 줘요. 그래서 이예의 마음가짐을 잘 알 수 있답니다.","hl":"mn"},{"n":44,"text":"먼저 chose는 choose의 과거형이에요. 이미 지난 일을 말하니까 chose를 써요. 그리고 chose 뒤에 to stay가 와서 '지내는 것을 선택했다'는 뜻을 만들어요. 이때 to stay는 to부정사랍니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">오늘 배운 내용 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>조선 시대에 일본의 \u003cb class=\"key\">침략\u003c/b>이 많아 한국 사람들이 끌려갔어요.\u003c/li>\u003cli>이예는 여덟 살에 \u003cb class=\"key\">어머니\u003c/b>를 잃고 그 아픔을 알았어요.\u003c/li>\u003cli>그래서 다른 사람의 \u003cb class=\"key\">고통\u003c/b>을 잘 이해하는 \u003cb class=\"key\">최고의 \u003c/b>\u003cb class=\"key\">외교관\u003c/b>이 되었어요.\u003c/li>\u003cli>그는 \u003cb class=\"key\">조약\u003c/b>을 맺어 \u003cb class=\"key\">적\u003c/b>과도 평화롭게 지내려 했어요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Yi Ye became the greatest diplomat because he understood people's pain and chose peace with Japan.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: 조선 시대에 일본의 침략이 많았지만, 외교관 이예는 일본에서 한국인들을 다시 데려왔어요. 어머니를 잃은 \u003cb class=\"key\">아픔\u003c/b>을 알았기에 그는 다른 사람의 고통을 이해하고 적과 \u003cb class=\"key\">평화\u003c/b>를 택한 훌륭한 외교관이 되었어요.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":45,"text":"오늘 우리는 이예 이야기를 읽었어요. 일본의 침략 속에서도 그는 어머니를 잃은 아픔을 딛고 다른 사람의 고통을 이해했어요. 그리고 적과도 평화를 선택한 최고의 외교관이 되었지요. 여러분도 오늘 배운 단어와 길잡이 말을 꼭 기억해 주세요. 정말 잘했어요, 다음에 또 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
