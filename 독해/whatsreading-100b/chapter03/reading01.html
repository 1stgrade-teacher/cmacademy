<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>왓츠 리딩 100B Ch.3 Unit 01 Soul Food — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"왓츠 리딩 100B Ch.3 Unit 01 Soul Food","audioDir":"reading01_audio","preview":false,"count":45,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.520em\">Ch.3\u003cbr>Unit 01\u003cbr>Soul Food\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">왓츠 리딩 100B\u003c/div>\u003ch1>Soul Food: A Taste of Home\u003c/h1>\u003ch2>솔 푸드: 고향의 맛\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">한 줄 요약\u003c/span>\u003cspan>솔 푸드는 미국 남부의 아프리카계 미국인들이 자기 문화를 부르던 말로, 그 뿌리는 \u003cb class=\"key\">아프리카 \u003c/b>\u003cb class=\"key\">노예제도\u003c/b>에 있어요. 노예들은 \u003cb class=\"key\">전통 \u003c/b>\u003cb class=\"key\">조리법\u003c/b>을 간직하며 옥수숫가루와 돼지고기로 고향 맛이 나는 음식을 만들어 위로를 받았어요.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Soul food comes from African slaves' traditional recipes and comforted them with the taste of home.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"여러분, 안녕하세요! 오늘도 함께 영어 지문을 읽어 볼까요? 오늘 읽을 글은 Soul Food, 우리말로 하면 솔 푸드예요. 아주 먼 나라 이야기 같지만, 사실은 사람들의 따뜻한 마음이 담긴 음식 이야기랍니다. 한 줄로 말하면, 솔 푸드는 고향의 맛이 담긴 음식이에요. 자, 그럼 시작해 볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">미리 알면 쉬워요\u003c/span>\u003cdiv class=\"lp-box\">옛날 미국에는 아프리카에서 억지로 끌려온 사람들이 있었어요. 그들을 slave(노예)라고 불렀지요. 그 후손들은 1960년대에 civil rights(시민권)를 얻기 위해 열심히 싸웠어요. 여러분은 할머니가 해 주시는 음식을 먹으면 왜 마음이 편안해지나요? 아마 익숙한 맛이라서 그럴 거예요. 솔 푸드도 바로 그런 \u003cb class=\"key\">고향의 \u003c/b>\u003cb class=\"key\">맛\u003c/b>이 담긴 음식이에요.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 하나 알고 가요. 옛날 미국에는 아프리카에서 억지로 끌려온 사람들이 있었어요. 그들을 영어로 slave, 노예라고 불렀지요. 그리고 그 후손들은 천구백육십 년대에 civil rights, 즉 시민권을 얻기 위해 열심히 싸웠어요. 여러분은 할머니가 해 주시는 음식을 먹으면 왜 마음이 편안해지나요? 아마 익숙한 맛이라서 그럴 거예요. 솔 푸드도 바로 그런 고향의 맛이 담긴 음식이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>말의 시작\u003csmall>소개 · 문장 1–4\u003c/small>\u003c/h4>\u003cp>1960년대까지 '솔 푸드'라는 말은 흔하지 않았어요. 그때 미국 남부의 아프리카계 미국인들은 \u003cb class=\"key\">시민권\u003c/b>을 얻기 위해 싸우고 있었지요. 그래서 자신들의 \u003cb class=\"key\">문화\u003c/b>를 '솔'이라는 말로 부르기 시작했어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>뿌리와 위로\u003csmall>이유 · 문장 5–7\u003c/small>\u003c/h4>\u003cp>솔 푸드는 \u003cb class=\"key\">아프리카 \u003c/b>\u003cb class=\"key\">노예제도\u003c/b>에 뿌리를 두고 있어요. 노예들은 \u003cb class=\"key\">전통 \u003c/b>\u003cb class=\"key\">조리법\u003c/b>을 잃지 않고 간직했지요. 그 음식은 고향 음식과 같은 맛이 나서 그들을 \u003cb class=\"key\">위로\u003c/b>해 주었어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>부족한 재료\u003csmall>문제 · 문장 8–10\u003c/small>\u003c/h4>\u003cp>노예들에게는 매주 \u003cb class=\"key\">옥수숫가루\u003c/b>와 돼지고기가 주어졌어요. 오랜 시간 일하려면 \u003cb class=\"key\">열량이 \u003c/b>\u003cb class=\"key\">높은\u003c/b> 식사가 필요했지요. 그래서 옥수숫가루로 생선을 튀기고 고기를 채소에 더했어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>음식의 완성\u003csmall>마무리 · 문장 11\u003c/small>\u003c/h4>\u003cp>시간이 흐르면서 이 조리법들은 \u003cb class=\"key\">솔 \u003c/b>\u003cb class=\"key\">푸드\u003c/b>가 되었어요. 옥수수 빵, 튀긴 치킨, 허시 퍼피스, 버터밀크 비스킷이 바로 그 음식이에요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 시간이 흐르는 순서를 따라가며 솔 푸드가 어떻게 생겨났는지 설명해요.","hl":null},{"n":4,"text":"먼저 솔 푸드라는 말이 언제 생겼는지부터 볼까요? 천구백육십 년대가 되어서야 이 말이 흔해졌어요. 그때 미국 남부의 많은 아프리카계 미국인들이 시민권을 얻기 위해 싸우고 있었어요. 그래서 그들은 자기들의 문화를 설명할 때 soul이라는 단어를 쓰기 시작했고, 솔 뮤직, 솔 브라더, 솔 푸드가 그 예가 되었답니다.","hl":"f0"},{"n":5,"text":"다음은 이 음식의 뿌리예요. 솔 푸드는 아프리카 노예제도에 뿌리를 두고 있어요. 노예들은 전통 아프리카 조리법을 잃지 않고 간직했어요. 그 음식은 고향 음식과 같은 맛이 나서 그들을 위로해 주었지요.","hl":"f1"},{"n":6,"text":"그런데 노예들에게 주어진 재료는 많지 않았어요. 매주 옥수숫가루와 돼지고기가 주어졌지요. 오랜 시간 일하려면 열량이 높은 식사가 필요했어요. 그래서 그들은 옥수숫가루로 생선 같은 음식을 튀기고, 고기를 채소에 더했답니다.","hl":"f2"},{"n":7,"text":"마지막으로 시간이 흐르면서 이 조리법들은 솔 푸드가 되었어요. 옥수수 빵, 튀긴 치킨, 허시 퍼피스, 버터밀크 비스킷이 바로 그 주인공들이에요. 여러분도 한 번 먹어 보고 싶지 않나요?","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">설명하는 글(시간 순서)\u003c/span>\u003cspan class=\"lp-pill\">가운데\u003c/span>\u003cspan class=\"lp-pill\">주제문 5번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 '솔'이라는 말이 생긴 이야기로 시작해 노예들의 역사로 이어져요. 다섯 번째 문장이 '솔 푸드는 노예제도에 뿌리를 두고 있다'는 \u003cb class=\"key\">중심 \u003c/b>\u003cb class=\"key\">생각\u003c/b>을 딱 말해 주기 때문이에요. 그 뒤에는 왜 그런지 \u003cb class=\"key\">이유\u003c/b>와 음식의 예가 이어져요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>At that time (2)\u003c/b>\u003cspan>시간이 언제인지 알려 줌\u003c/span>\u003cb>because (7)\u003c/b>\u003cspan>이유를 알려 줌\u003c/span>\u003cb>So (10)\u003c/b>\u003cspan>그래서 생긴 결과를 알려 줌\u003c/span>\u003cb>Over time (11)\u003c/b>\u003cspan>시간이 흐르며 바뀐다는 것을 알려 줌\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">African Americans\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the slaves\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">they\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 설명하는 글이고, 시간이 흐르는 순서대로 쓰였어요. 중심 문장은 다섯 번째 문장인데, 솔 푸드가 아프리카 노예제도에 뿌리를 두고 있다는 내용이에요. 앞부분에서는 이름이 어떻게 생겼는지, 뒷부분에서는 그 역사가 어떻게 이어졌는지 알려 주고 있답니다.","hl":"ty"},{"n":9,"text":"글에는 길잡이 말이 숨어 있어요. At that time은 언제인지 알려 주고, because는 이유를, So는 그래서 생긴 결과를, Over time은 시간이 흐르며 바뀐다는 것을 알려 줘요. 그리고 African Americans와 the slaves는 같은 사람들을 다르게 부른 말이에요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 단어\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>common\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>흔한\u003c/span>\u003c/div>\u003cdiv>\u003cb>southern\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>남부의\u003c/span>\u003c/div>\u003cdiv>\u003cb>civil rights\u003c/b>\u003cem>명사\u003c/em>\u003cspan>시민권\u003c/span>\u003c/div>\u003cdiv>\u003cb>describe\u003c/b>\u003cem>동사\u003c/em>\u003cspan>묘사하다, 표현하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>culture\u003c/b>\u003cem>명사\u003c/em>\u003cspan>문화\u003c/span>\u003c/div>\u003cdiv>\u003cb>example\u003c/b>\u003cem>명사\u003c/em>\u003cspan>예, 보기\u003c/span>\u003c/div>\u003cdiv>\u003cb>have its roots in\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 뿌리를 두다\u003c/span>\u003c/div>\u003cdiv>\u003cb>slavery\u003c/b>\u003cem>명사\u003c/em>\u003cspan>노예제도\u003c/span>\u003c/div>\u003cdiv>\u003cb>slave\u003c/b>\u003cem>명사\u003c/em>\u003cspan>노예\u003c/span>\u003c/div>\u003cdiv>\u003cb>traditional\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>전통적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>recipe\u003c/b>\u003cem>명사\u003c/em>\u003cspan>조리법, 요리법\u003c/span>\u003c/div>\u003cdiv>\u003cb>comfort\u003c/b>\u003cem>동사\u003c/em>\u003cspan>위로하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>taste\u003c/b>\u003cem>동사\u003c/em>\u003cspan>~한 맛이 나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>cornmeal\u003c/b>\u003cem>명사\u003c/em>\u003cspan>옥수숫가루\u003c/span>\u003c/div>\u003cdiv>\u003cb>pork\u003c/b>\u003cem>명사\u003c/em>\u003cspan>돼지고기\u003c/span>\u003c/div>\u003cdiv>\u003cb>high-calorie\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>열량이 높은\u003c/span>\u003c/div>\u003cdiv>\u003cb>diet\u003c/b>\u003cem>명사\u003c/em>\u003cspan>식사, 먹는 것\u003c/span>\u003c/div>\u003cdiv>\u003cb>fry\u003c/b>\u003cem>동사\u003c/em>\u003cspan>튀기다\u003c/span>\u003c/div>\u003cdiv>\u003cb>add\u003c/b>\u003cem>동사\u003c/em>\u003cspan>더하다, 추가하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>over time\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>시간이 흐르면서\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"오늘의 단어를 소리 내어 읽어 볼까요? comfort는 위로하다라는 뜻이에요. recipe는 조리법, cornmeal은 옥수숫가루예요. high-calorie는 열량이 높은이라는 뜻이고, have its roots in은 뿌리를 두다라는 표현이랍니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">common\u003c/b>\u003cspan class=\"m\">흔한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">usual\u003c/span>\u003cspan class=\"s\">normal\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">rare\u003c/span>\u003cspan class=\"a\">special\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">traditional\u003c/b>\u003cspan class=\"m\">전통적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">old\u003c/span>\u003cspan class=\"s\">usual\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">new\u003c/span>\u003cspan class=\"a\">modern\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">comfort\u003c/b>\u003cspan class=\"m\">위로하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">cheer up\u003c/span>\u003cspan class=\"s\">help\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hurt\u003c/span>\u003cspan class=\"a\">worry\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">fight for\u003c/b>\u003cspan class=\"m\">~을 위해 싸우다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">work for\u003c/span>\u003cspan class=\"s\">stand up for\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">give up\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">add\u003c/b>\u003cspan class=\"m\">더하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">put in\u003c/span>\u003cspan class=\"s\">include\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">take away\u003c/span>\u003cspan class=\"a\">remove\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"비슷한 말과 반대말도 정리해 봐요. common은 흔한이라는 뜻이고, 비슷한 말은 usual, 반대말은 rare예요. traditional은 전통적인, 비슷한 말은 old, 반대말은 new예요. comfort는 위로하다이고, 반대말은 hurt처럼 마음을 아프게 하는 말이에요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">'솔 푸드'는\u003c/span>\u003cspan class=\"en\">&quot;Soul food&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">흔하지 않았어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">wasn't \u003c/span>\u003cspan class=\"tgt\">common\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1960년대 전까지는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">until \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">1960s\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">'솔 푸드'는 1960년대 전까지는 흔하지 않았습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> '솔 푸드'라는 말이 \u003cb class=\"key\">1960년대\u003c/b> 전에는 잘 쓰이지 않았다는 것을 알려 줘요. 글의 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">배경\u003c/b>을 잡아 주는 첫 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정문(be동사 부정문)\u003c/span> : 무엇이(It) + 아니었다(wasn't) + 흔한(common) : \"흔하지 않았어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사(전치사)\u003c/span> : until + 시간(1960년대) : \"1960년대까지\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"\"Soul food\", '솔 푸드'는. wasn't common, 흔하지 않았어요. until the 1960s, 1960년대 전까지는. 이 문장 전체를 해석하면, '솔 푸드'는 1960년대 전까지는 흔하지 않았습니다.","hl":"m"},{"n":13,"text":"이 문장은 솔 푸드라는 말이 1960년대 전에는 잘 쓰이지 않았다는 걸 알려 줘요. 글의 시간 배경을 잡아 주는 첫 문장이죠.","hl":"mn"},{"n":14,"text":"첫 번째, wasn't는 was에 not을 붙인 말이에요. 뒤에 not이 있으면 아니다라는 뜻이 되죠. 두 번째, until은 시간을 이어 주는 전치사예요. 그래서 until the 1960s는 1960년대 전까지는, 이렇게 해석해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 당시에,\u003c/span>\u003cspan class=\"en\">At that time,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 아프리카계 미국인들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">many \u003c/span>\u003cspan class=\"tgt\">African \u003c/span>\u003cspan class=\"tgt\">Americans\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미국 남부에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">southern \u003c/span>\u003cspan class=\"tgt\">U.S.\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~을 위해 싸웠어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">fought \u003c/span>\u003cspan class=\"tgt\">for\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신들의 시민권을\u003c/span>\u003cspan class=\"en\">their civil rights.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">당시 미국 남부의 많은 아프리카계 미국인들이 자신의 시민권을 얻기 위해 싸웠어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 미국 남부의 많은 아프리카계 미국인들이 \u003cb class=\"key\">시민권\u003c/b>을 얻으려고 싸웠다는 것을 말해요. '솔'이라는 말이 생긴 \u003cb class=\"key\">시대 \u003c/b>\u003cb class=\"key\">상황\u003c/b>을 알려 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수량 표현(many + 복수 명사)\u003c/span> : 많은(many) + 여러 명을 가리키는 말(African Americans) : \"많은 아프리카계 미국인들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사(전치사)\u003c/span> : in + 장소(미국 남부) : \"미국 남부에서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">과거형(불규칙 동사)\u003c/span> : 그들은(They) + 싸웠다(fought) + ~을 위해(for) : \"~을 위해 싸웠어요\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"At that time, 그 당시에. many African Americans, 많은 아프리카계 미국인들이. in the southern U.S, 미국 남부에서. fought for, ~을 위해 싸웠어요. their civil rights, 자신들의 시민권을. 이 문장 전체를 해석하면, 당시 미국 남부의 많은 아프리카계 미국인들이 자신의 시민권을 얻기 위해 싸웠어요.","hl":"m"},{"n":16,"text":"이 문장은 미국 남부의 아프리카계 미국인들이 시민권을 얻으려고 싸웠다는 걸 말해요. 솔이라는 말이 생긴 시대 상황을 알려 주는 문장이죠.","hl":"mn"},{"n":17,"text":"첫 번째, many는 많은이라는 뜻으로 셀 수 있는 이름말 앞에 붙어요. 두 번째, in은 장소를 알려 주는 전치사예요. 그래서 미국 남부 안에서, 이렇게 해석하죠. 세 번째, fight의 과거형은 fought예요. 지난 일이라 모양이 바뀐 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 시작했어요\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">started \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">'솔'이라는 단어를 사용하기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">use\u003c/span> the word &quot;soul&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">묘사하기 위해\u003c/span>\u003cspan class=\"en\">to describe\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신들의 문화를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">culture\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 자신들의 문화를 묘사하기 위해 '솔'이라는 단어를 사용하기 시작했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아프리카계 미국인들이 자기 문화를 \u003cb class=\"key\">설명\u003c/b>하려고 '솔'이라는 말을 \u003cb class=\"key\">쓰기 \u003c/b>\u003cb class=\"key\">시작\u003c/b>했어요. '솔 푸드'라는 말이 나온 \u003cb class=\"key\">이유\u003c/b>를 알려 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to + 동사원형(to부정사)\u003c/span> : 시작했어요(started) + 쓰기를(to use) : \"사용하기를 시작했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">소유격(소유격)\u003c/span> : 그들의(their) + 문화(culture) : \"그들의 문화\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"They started, 그들은 시작했어요. to use the word \"soul\", '솔'이라는 단어를 사용하기를. to describe, 묘사하기 위해. their culture, 자신들의 문화를. 이 문장 전체를 해석하면, 그들은 자신들의 문화를 묘사하기 위해 '솔'이라는 단어를 사용하기 시작했습니다.","hl":"m"},{"n":19,"text":"아프리카계 미국인들이 자기 문화를 설명하려고 솔이라는 말을 쓰기 시작했어요. 솔 푸드라는 말이 나온 이유를 알려 주는 문장이죠.","hl":"mn"},{"n":20,"text":"첫 번째, started 뒤에 to와 동사원형을 붙이면 시작했다는 뜻이 돼요. 두 번째, their는 그들의라는 뜻으로, 문화가 누구 것인지 알려 주는 소유격이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">솔 뮤직, 솔 브라더,\u003c/span>\u003cspan class=\"en\">Soul music, soul brothers,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 솔 푸드가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">and\u003c/span> soul food\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것의 예입니다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">examples \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">this\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">솔 뮤직, 솔 브라더, 솔 푸드가 그 예죠.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞에서 말한 \u003cb class=\"key\">문화\u003c/b>를 세 가지 \u003cb class=\"key\">예\u003c/b>로 보여 줘요. 소울 뮤직, 소울 브라더, 솔 푸드가 그 예라는 뜻이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : A(Soul music) + B(soul brothers) + and + C(soul food) : \"~와 ~\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">am·are·is 친구들(be동사)\u003c/span> : 여러 가지 + are + examples of this(이것의 예) : \"이것의 예입니다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Soul music, soul brothers, 솔 뮤직, 솔 브라더. and soul food, 그리고 솔 푸드가. are examples of this, 이것의 예입니다.. 이 문장 전체를 해석하면, 솔 뮤직, 솔 브라더, 솔 푸드가 그 예죠.","hl":"m"},{"n":22,"text":"이 문장은 앞에서 말한 문화를 세 가지 예로 보여 줘요. 소울 뮤직, 솔 브라더, 솔 푸드가 바로 그 예죠.","hl":"mn"},{"n":23,"text":"먼저 and는 여러 가지를 나열할 때 마지막 앞에 쓰는 이어 주는 말이에요. 다음으로 are는 여러 가지를 묶은 복수 주어에 쓰는 be동사예요. 그래서 are examples of this는 이것의 예입니다라고 해석해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 11\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">솔 푸드는\u003c/span>\u003cspan class=\"en\">Soul food\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">뿌리를 두고 있습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">has\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">its\u003c/span> roots\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아프리카 노예제도에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">African \u003c/span>\u003cspan class=\"tgt\">slavery\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">솔 푸드는 아프리카 노예제도에 뿌리를 두고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 솔 푸드가 어디서 시작되었는지 알려 주는 \u003cb class=\"key\">중심 \u003c/b>\u003cb class=\"key\">문장\u003c/b>이에요. 솔 푸드의 시작이 \u003cb class=\"key\">노예제도\u003c/b>와 연결된다는 점을 말해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">한 사람·한 개일 때 쓰는 has(3인칭 단수)\u003c/span> : 한 개(Soul food) + has + 무엇을(its roots) : \"가지고 있습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">그것의 표시(소유격)\u003c/span> : 그것의(its) + 이름 말(roots) : \" lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거형(지난 일 말)\u003c/span> : 누가(The food) + 했다(comforted) + 누구를(them) : \"위로했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 이유(because) + 누가(it) + 했다(tasted) : \"왜냐하면 그것은 맛이 났기 때문에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">장소·시간 짝꿍 말(전치사)\u003c/span> : ~처럼(like) + 무엇(food) + 어디서 온(from their homes) : \"그들의 고향에서 온 음식처럼\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"The food comforted them, 그 음식은 그들을 위로했어요. because it tasted, 왜냐하면 그것은 맛이 났기 때문이에요. like food, 음식처럼. from their homes, 그들의 고향에서 온. 이 문장 전체를 해석하면, 그 음식은 그들의 고향 음식과 같은 맛이 나서 그들을 위로해 주었어요.","hl":"m"},{"n":31,"text":"이 문장은 노예들에게 음식이 왜 위로가 되었는지 말해 줘요. 고향에서 먹던 맛과 같아서 마음이 편해졌다는 뜻이지요.","hl":"mn"},{"n":32,"text":"첫 번째, comforted는 지난 일을 말하는 과거형이에요. 두 번째, because는 이유를 이어 주는 접속사예요. 세 번째, like는 음식처럼 하고 무엇과 비슷한지 알려 주는 전치사예요. 세 가지를 한 번에 기억해 봐요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">노예들은\u003c/span>\u003cspan class=\"en\">The slaves\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">받았어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">given\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">옥수숫가루와 돼지고기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">cornmeal \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">pork\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매주\u003c/span>\u003cspan class=\"en\">every week.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko v>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 오랜 시간 일하기 위해 열량이 높은 식사가 필요했지요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 노예들이 왜 \u003cb class=\"key\">열량\u003c/b>이 높은 음식을 먹어야 했는지 알려 줘요. 하루 종일 \u003cb class=\"key\">일\u003c/b>을 해서 힘이 많이 들었기 때문이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거형(지난 일 말)\u003c/span> : 누가(They) + 했다(needed) + 무엇을(a high-calorie diet) : \"그들은 필요했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동사-ing가 이름 말처럼 쓰임(동명사)\u003c/span> : ~하기 위해(for) + 하는 것(working) : \"일하기 위해서\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"They needed, 그들은 필요했어요. a high-calorie diet, 열량이 높은 식사를. for working, 일하기 위해서. long days, 긴 하루 동안 일하는 것. 이 문장 전체를 해석하면, 그들은 오랜 시간 일하기 위해 열량이 높은 식사가 필요했지요.","hl":"m"},{"n":37,"text":"이 문장은 노예들이 왜 열량이 높은 음식을 먹어야 했는지 알려 줘요. 하루 종일 일을 해서 힘이 많이 들었기 때문이지요.","hl":"mn"},{"n":38,"text":"첫 번째, needed는 지난 일을 말하는 과거형이에요. 두 번째, for 다음에 working처럼 동사에 ing를 붙이면 일하기 위해서라는 뜻이 돼요. 이렇게 동사가 이름처럼 쓰이는 걸 동명사라고 한답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서 그들은 음식을 튀겼어요\u003c/span>\u003cspan class=\"en\">So they \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">fried\u003c/span> foods\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">생선 같은\u003c/span>\u003cspan class=\"en\">like fish\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">옥수숫가루로 (덮은)\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">cornmeal\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 고기를 추가했어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">added\u003c/span> meat\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">채소에\u003c/span>\u003cspan class=\"en\">to vegetables.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그래서 그들은 옥수숫가루로 덮은 생선 같은 음식을 튀기고, 고기를 채소에 추가했어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 노예들이 어떤 음식을 어떻게 만들어 먹었는지 알려 줘요. \u003cb class=\"key\">옥수숫가루\u003c/b>로 만든 \u003cb class=\"key\">튀긴 \u003c/b>\u003cb class=\"key\">음식\u003c/b>에 \u003cb class=\"key\">고기\u003c/b>를 더했다는 뜻이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(규칙 과거형)\u003c/span> : 하는(fry) + -ed → 했어요(fried) : \"튀겼어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">짝꿍 말(전치사)\u003c/span> : with + 무엇(cornmeal) = 무엇으로 : \"옥수숫가루로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 먼저 한 일(fried) + and + 다음 한 일(added) : \"그리고 추가했어요\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"So they fried foods, 그래서 그들은 음식을 튀겼어요. like fish, 생선 같은. with cornmeal, 옥수숫가루로 (덮은). and added meat, 그리고 고기를 추가했어요. to vegetables, 채소에. 이 문장 전체를 해석하면, 그래서 그들은 옥수숫가루로 덮은 생선 같은 음식을 튀기고, 고기를 채소에 추가했어요.","hl":"m"},{"n":40,"text":"이 문장은 노예들이 어떤 음식을 어떻게 만들었는지 알려 줘요. 옥수숫가루로 만든 튀긴 음식에 고기를 더했다는 뜻이에요.","hl":"mn"},{"n":41,"text":"먼저 fried와 added를 봐요. 지난 일을 말할 때 동사 뒤에 -ed를 붙이는데, 이걸 규칙 과거형이라고 해요. 그리고 and는 두 가지 일을 이어 주는 접속사예요. 마지막으로 with는 무엇으로 만드는지 알려 주는 전치사이고, cornmeal은 옥수숫가루라는 뜻이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시간이 흐르면서\u003c/span>\u003cspan class=\"en\">Over time,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 조리법은 ~이 되었어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">these \u003c/span>\u003cspan class=\"tgt\">recipes\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">became\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">솔 푸드\u003c/span>\u003cspan class=\"en\">soul food —\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">옥수수 빵, 튀긴 치킨,\u003c/span>\u003cspan class=\"en\">cornbread, fried chicken,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">허시 퍼피스, 그리고 버터밀크 비스킷\u003c/span>\u003cspan class=\"en\">hush puppies, and buttermilk biscuits.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">시간이 흐르면서, 이러한 조리법은 솔 푸드인 옥수수 빵, 튀긴 치킨, 허시 퍼피스, 버터밀크 비스킷이 되었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 \u003cb class=\"key\">솔 \u003c/b>\u003cb class=\"key\">푸드\u003c/b>의 대표 음식들을 알려 줘요. 옛날 조리법이 시간이 지나 솔 푸드라는 이름을 얻었다는 뜻이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가리키는 말(지시대명사)\u003c/span> : this(이것) + 여러 개 → these(이것들) : \"이러한 조리법들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지난 일 말(불규칙 과거형)\u003c/span> : …는(these recipes) + …이 되었어요(became) + 솔 푸드(soul food) : \"~이 되었어요\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"Over time, 시간이 흐르면서. these recipes became, 이러한 조리법은 ~이 되었어요. soul food, 솔 푸드. cornbread, fried chicken, 옥수수 빵, 튀긴 치킨. hush puppies, and buttermilk biscuits, 허시 퍼피스, 그리고 버터밀크 비스킷. 이 문장 전체를 해석하면, 시간이 흐르면서, 이러한 조리법은 솔 푸드인 옥수수 빵, 튀긴 치킨, 허시 퍼피스, 버터밀크 비스킷이 되었습니다.","hl":"m"},{"n":43,"text":"이 문장은 솔 푸드의 대표 음식들을 알려 줘요. 옛날 조리법이 시간이 지나 솔 푸드라는 이름을 얻었다는 뜻이에요.","hl":"mn"},{"n":44,"text":"첫 번째, became은 become의 불규칙 과거형이에요. 두 번째, this는 한 개를 가리키고 these는 여러 개를 가리키는 지시대명사예요. 레시피가 여러 개니까 these recipes라고 한 거죠. 마지막으로 over time은 시간이 흐르면서라는 뜻의 덩어리 표현이에요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">오늘 배운 내용 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>'솔 푸드'라는 말은 1960년대에 \u003cb class=\"key\">아프리카계 \u003c/b>\u003cb class=\"key\">미국인\u003c/b>들이 자기 문화를 부르며 쓰기 시작했어요.\u003c/li>\u003cli>솔 푸드는 \u003cb class=\"key\">아프리카 \u003c/b>\u003cb class=\"key\">노예제도\u003c/b>에 뿌리를 두고 있어요.\u003c/li>\u003cli>노예들은 \u003cb class=\"key\">전통 \u003c/b>\u003cb class=\"key\">조리법\u003c/b>을 지키며 고향 맛이 나는 음식으로 위로를 받았어요.\u003c/li>\u003cli>옥수숫가루와 돼지고기로 만든 음식이 오늘날의 \u003cb class=\"key\">솔 \u003c/b>\u003cb class=\"key\">푸드\u003c/b>가 되었어요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Soul food comes from African slaves' traditional recipes and comforted them with the taste of home.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">솔 푸드는 미국 남부의 아프리카계 미국인들이 자기 문화를 부르던 말로, 그 뿌리는 \u003cb class=\"key\">아프리카 \u003c/b>\u003cb class=\"key\">노예제도\u003c/b>에 있어요. 노예들은 \u003cb class=\"key\">전통 \u003c/b>\u003cb class=\"key\">조리법\u003c/b>을 간직하며 옥수숫가루와 돼지고기로 고향 맛이 나는 음식을 만들어 위로를 받았어요.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":45,"text":"오늘 우리는 솔 푸드가 어떻게 생겨났는지 알아봤어요. 이름은 천구백육십 년대에 퍼졌지만, 그 뿌리는 아프리카 노예들의 전통 조리법에 있었지요. 어려운 역사 이야기였는데도 끝까지 잘 따라와 줘서 정말 고마워요. 다음 시간에도 맛있는 이야기로 만나요, 안녕!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
