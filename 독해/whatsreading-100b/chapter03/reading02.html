</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"왓츠 리딩 100B Ch.3 Unit 02 Hush Puppies","audioDir":"reading02_audio","preview":false,"count":51,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.520em\">Ch.3 Unit\u003cbr>02 Hush\u003cbr>Puppies\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">왓츠 리딩 100B\u003c/div>\u003ch1>Hush Puppies: Why Are They Called That?\u003c/h1>\u003ch2>허시 퍼피스: 왜 그런 이름이 붙었을까요?\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">한 줄 요약\u003c/span>\u003cspan>요약: 할머니가 만드는 허시 퍼피스는 \u003cb class=\"key\">옥수숫가루\u003c/b>로 만든 작고 동그란 튀김 음식이에요. 손자는 왜 \u003cb class=\"key\">강아지\u003c/b>라는 이름이 붙었는지 궁금해하고, 할머니는 개들의 짖음을 \u003cb class=\"key\">조용히 \u003c/b>\u003cb class=\"key\">시킨\u003c/b> 이야기에서 이름이 나왔다고 알려 주세요.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Hush puppies are fried cornmeal balls, and their name comes from a story about hushing barking dogs.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘도 만나서 정말 반가워요. 오늘은 할머니와 손자가 부엌에서 나누는 재미있는 대화를 읽어 볼 거예요. 맛있는 음식 이름에 깜짝 이야기가 숨어 있답니다. 그 이름은 바로 허시 퍼피스예요. 자, 함께 시작해 볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">미리 알면 쉬워요\u003c/span>\u003cdiv class=\"lp-box\">미국 남부 지방에는 옥수숫가루로 반죽해 기름에 동그랗게 튀긴 음식이 아주 많아요. 이런 음식은 cornmeal balls, 그러니까 옥수숫가루 덩어리라고 부를 수 있어요. 우리가 좋아하는 도넛처럼 동글동글하고 바삭한 간식이지요. 그런데 이름이 puppies, 즉 \u003cb class=\"key\">강아지\u003c/b>라고 하니 이상하지 않나요? 음식 이름 속에 숨은 \u003cb class=\"key\">이야기\u003c/b>를 찾아보면 단어가 훨씬 재미있어져요.\u003c/div>","segs":[{"n":2,"text":"여러분, 혹시 옥수수로 만든 간식을 먹어 본 적 있나요? 미국 남부 지방에는 옥수숫가루로 반죽해서 기름에 동그랗게 튀긴 음식이 아주 많아요. 이런 음식은 cornmeal balls, 그러니까 옥수수가루 덩어리라고 부를 수 있죠. 우리가 좋아하는 도넛처럼 동글동글하고 바삭한 간식이에요. 그런데 이름이 puppies, 강아지라고 하니 여러분은 어떻게 생각해요?","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>할머니의 부탁\u003csmall>시작 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>아이가 집에 들어갔을 때 할머니가 \u003cb class=\"key\">부엌\u003c/b>에 계셨어요. 할머니는 \u003cb class=\"key\">웃으며\u003c/b> 함께 허시 퍼피스를 만들자고 하세요. 두 사람의 \u003cb class=\"key\">대화\u003c/b>로 이야기가 시작돼요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>강아지라고요?\u003csmall>문제 · 문장 3–6\u003c/small>\u003c/h4>\u003cp>아이는 '퍼피'라는 말을 듣고 \u003cb class=\"key\">강아지\u003c/b>가 나오는 줄 알고 \u003cb class=\"key\">깜짝 \u003c/b>\u003cb class=\"key\">놀라요\u003c/b>. 그래서 '어떤 강아지들이요?'라고 물어요. 할머니는 \u003cb class=\"key\">옥수숫가루\u003c/b>로 만든 작고 동그란 튀김 덩어리이며 미국 \u003cb class=\"key\">남부\u003c/b>에서 인기 있는 음식이라고 알려 주세요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>그래도 궁금해요\u003csmall>바뀜 · 문장 7–9\u003c/small>\u003c/h4>\u003cp>설명을 듣고 아이는 \u003cb class=\"key\">안심\u003c/b>해요. 그래도 왜 그런 이름이 붙었는지는 \u003cb class=\"key\">궁금\u003c/b>해서 다시 물어요. 이 질문이 글의 \u003cb class=\"key\">중심\u003c/b> 질문이에요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>이름의 비밀\u003csmall>해결 · 문장 10–13\u003c/small>\u003c/h4>\u003cp>할머니는 이름에 얽힌 \u003cb class=\"key\">이야기\u003c/b>가 몇 개 있다고 말해요. 개들이 \u003cb class=\"key\">짖을\u003c/b> 때 튀긴 덩어리를 던졌더니 짖는 것을 \u003cb class=\"key\">멈췄\u003c/b>다는 이야기예요. 그래서 그 덩어리가 개들을 '조용히 시켰다'는 뜻으로 허시 퍼피스가 되었어요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 손자의 질문과 할머니의 대답이 오가는 이야기 순서로 되어 있어요.","hl":null},{"n":4,"text":"먼저 아이가 집에 왔을 때 할머니가 부엌에 계셨어요. 할머니는 웃으며 들어와서 같이 만들자고 하세요. 이렇게 두 사람의 대화로 이야기가 시작됩니다.","hl":"f0"},{"n":5,"text":"아이는 puppies라는 말을 듣고 강아지가 나오는 줄 알고 깜짝 놀라요. 그래서 어떤 강아지들이냐고 물어요. 그러자 할머니가 이것은 옥수숫가루로 만든 작고 동그란 튀김 덩어리이고, 미국 남부에서 인기 있는 음식이라고 알려 주세요.","hl":"f1"},{"n":6,"text":"설명을 듣고 아이는 안심해요. 그래도 왜 이런 이름이 붙었는지는 여전히 궁금해서 다시 물어요. 바로 이 질문이 글의 중심 질문이에요.","hl":"f2"},{"n":7,"text":"할머니는 이름에 대한 이야기가 몇 개 있다고 해요. 개들이 짖을 때 튀긴 덩어리를 던졌더니 짖는 것을 멈췄다는 이야기죠. 그래서 그 덩어리가 개들을 조용히 시켰다고 해서 허시 퍼피스라는 이름이 생겼어요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">이야기 순서(질문과 대답으로 궁금증 풀기)\u003c/span>\u003cspan class=\"lp-pill\">끝\u003c/span>\u003cspan class=\"lp-pill\">주제문 13번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">손자가 묻고 할머니가 답하는 방식으로 내용이 이어져요. 처음에 던진 질문이 마지막에 답을 받으니까 \u003cb class=\"key\">이야기 \u003c/b>\u003cb class=\"key\">순서\u003c/b> 글이에요. 그래서 가장 중요한 \u003cb class=\"key\">중심 \u003c/b>\u003cb class=\"key\">문장\u003c/b>이 글 \u003cb class=\"key\">끝\u003c/b>에 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>When (1)\u003c/b>\u003cspan>때를 알려 줌\u003c/span>\u003cb>At first (3)\u003c/b>\u003cspan>처음 순서를 알려 줌\u003c/span>\u003cb>But (8)\u003c/b>\u003cspan>반대되는 내용을 이어 줌\u003c/span>\u003cb>So (13)\u003c/b>\u003cspan>결과를 알려 줌\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">hush puppies\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">puppies\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a popular southern American dish\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the fried round balls\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 처음에 생긴 질문이 끝에서 답을 얻는 이야기 순서 글이에요. 그래서 중심 문장은 글의 끝부분인 열세 번째 문장에 있어요. 질문을 따라가며 읽으면 답이 쏙 들어온답니다.","hl":"ty"},{"n":9,"text":"길잡이 말도 눈여겨보세요. When은 때를 알려 주고, At first는 순서를 알려 줘요. But은 반대되는 내용을, So는 결과를 알려 줍니다. 그리고 같은 음식을 hush puppies, the fried round balls처럼 다르게 부르니 두 표현을 같은 것끼리 연결해 보세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 단어\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>come home\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>집에 오다\u003c/span>\u003c/div>\u003cdiv>\u003cb>kitchen\u003c/b>\u003cem>명사\u003c/em>\u003cspan>부엌\u003c/span>\u003c/div>\u003cdiv>\u003cb>smile\u003c/b>\u003cem>동사\u003c/em>\u003cspan>웃다\u003c/span>\u003c/div>\u003cdiv>\u003cb>at first\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>처음에\u003c/span>\u003c/div>\u003cdiv>\u003cb>shocked\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>깜짝 놀란\u003c/span>\u003c/div>\u003cdiv>\u003cb>ask\u003c/b>\u003cem>동사\u003c/em>\u003cspan>묻다\u003c/span>\u003c/div>\u003cdiv>\u003cb>answer\u003c/b>\u003cem>동사\u003c/em>\u003cspan>대답하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>be made from\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 만들어지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>cornmeal\u003c/b>\u003cem>명사\u003c/em>\u003cspan>옥수숫가루\u003c/span>\u003c/div>\u003cdiv>\u003cb>fried\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>튀긴\u003c/span>\u003c/div>\u003cdiv>\u003cb>round\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>동그란\u003c/span>\u003c/div>\u003cdiv>\u003cb>popular\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>인기 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>southern\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>남부의\u003c/span>\u003c/div>\u003cdiv>\u003cb>dish\u003c/b>\u003cem>명사\u003c/em>\u003cspan>음식\u003c/span>\u003c/div>\u003cdiv>\u003cb>relieved\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>안심한\u003c/span>\u003c/div>\u003cdiv>\u003cb>curious\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>궁금한\u003c/span>\u003c/div>\u003cdiv>\u003cb>hush\u003c/b>\u003cem>동사\u003c/em>\u003cspan>조용히 시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>throw\u003c/b>\u003cem>동사\u003c/em>\u003cspan>던지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>bark\u003c/b>\u003cem>동사\u003c/em>\u003cspan>짖다\u003c/span>\u003c/div>\u003cdiv>\u003cb>stop\u003c/b>\u003cem>동사\u003c/em>\u003cspan>멈추다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"오늘의 단어를 소리 내어 읽어 볼게요. shocked는 깜짝 놀란, curious는 궁금한이라는 뜻이에요. relieved는 안심한, bark는 짖다라는 뜻이고요. hush는 조용히 시키다라는 뜻이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">shocked\u003c/b>\u003cspan class=\"m\">깜짝 놀란\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">surprised\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">calm\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">curious\u003c/b>\u003cspan class=\"m\">궁금한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">interested\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">uninterested\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">popular\u003c/b>\u003cspan class=\"m\">인기 있는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">famous\u003c/span>\u003cspan class=\"s\">liked\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unpopular\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">throw\u003c/b>\u003cspan class=\"m\">던지다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">toss\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">catch\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">stop\u003c/b>\u003cspan class=\"m\">멈추다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">end\u003c/span>\u003cspan class=\"s\">finish\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">start\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"비슷한 말과 반대말도 함께 익혀 봐요. shocked는 surprised와 비슷하고 calm과 반대예요. curious는 interested와 비슷하고, popular는 famous와 비슷해요. throw는 toss와 비슷하고 catch와 반대죠. stop은 start와 반대라는 것도 꼭 기억해요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내가 집에 왔을 때,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">came \u003c/span>\u003cspan class=\"tgt\">home,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">할머니께서는 (계셨어요)\u003c/span>\u003cspan class=\"en\">Grandma \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">was\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">부엌에\u003c/span>\u003cspan class=\"en\">in the kitchen.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">내가 집에 왔을 때, 할머니께서는 부엌에 계셨어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이야기가 시작되는 장면이에요. 내가 집에 돌아왔을 때 할머니가 \u003cb class=\"key\">부엌\u003c/b>에 계셨다는 뜻이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">때를 이어 주는 when(접속사)\u003c/span> : when + 내가 왔다(I came home) + , + 그때 있었던 일 : \"내가 집에 왔을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">is의 지난 모양(be동사 과거형)\u003c/span> : 할머니(Grandma) + 계셨다(was) + 부엌에(in the kitchen) : \"계셨어요\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"When I came home, 내가 집에 왔을 때. Grandma was, 할머니께서는 (계셨어요). in the kitchen, 부엌에. 이 문장 전체를 해석하면, 내가 집에 왔을 때, 할머니께서는 부엌에 계셨어요.","hl":"m"},{"n":13,"text":"이 문장은 이야기의 시작을 알려 줘요. 내가 집에 왔더니 할머니가 부엌에 계셨다는 장면이에요.","hl":"mn"},{"n":14,"text":"먼저 when은 두 가지 일을 이어 주면서 시간을 알려 주는 접속사예요. 그래서 내가 집에 왔을 때라는 뜻이 되죠. 그리고 was는 is의 과거형이에요. 지난 일이라서 was를 썼어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 웃었어요\u003c/span>\u003cspan class=\"en\">She \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">smiled \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 말했어요,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">said\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">들어와\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">Come \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 나를 도와주세요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">help \u003c/span>\u003cspan class=\"tgt\">me \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">허시 퍼피스를 만드는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">hush \u003c/span>\u003cspan class=\"tgt\">puppies.\u003c/span>&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 웃으며 말씀하셨어요, &quot;들어와서 내가 허시 퍼피스를 만드는 것을 좀 도와다오.&quot;\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 할머니가 웃으시면서 나에게 함께 \u003cb class=\"key\">허시 \u003c/b>\u003cb class=\"key\">퍼피스\u003c/b>를 만들자고 하신 장면이에요. 부엌으로 들어오라는 말도 함께 하셨어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 웃었다(smiled) + and + 말했다(said) : \"웃으면서 말했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">시키는 말(명령문)\u003c/span> : 동사원형(Come) + and + 동사원형(help) → '~해라, ~해 줘' : \"들어와서 허시 퍼피스 만드는 것을 도와다오\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"She smiled, 그녀는 웃었어요. and said, 그리고 말했어요. \"Come in, 들어와. and help me, 그리고 나를 도와주세요. make hush puppies.\", 허시 퍼피스를 만드는 것을. 이 문장 전체를 해석하면, 그녀는 웃으며 말씀하셨어요, \"들어와서 내가 허시 퍼피스를 만드는 것을 좀 도와다오.\"","hl":"m"},{"n":16,"text":"할머니가 웃으시면서 나에게 함께 허시 퍼피스를 만들자고 하신 장면이에요. 부엌으로 들어오라는 말도 함께 하셨어요.","hl":"mn"},{"n":17,"text":"첫 번째, smiled and said에서 and는 두 가지를 이어 주는 말이에요. 웃었다와 말했다를 자연스럽게 이어 주죠. 두 번째, Come in and help me는 명령문이에요. 동사원형 Come으로 시작해서 들어와라는 뜻이 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">처음에\u003c/span>\u003cspan class=\"en\">At first,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 깜짝 놀랐어요\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">shocked\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 여쭤봤어요,\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">asked\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">&quot;어떤 강아지들이요?&quot;\u003c/span>\u003cspan class=\"en\">&quot;What puppies?&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">처음에 나는 깜짝 놀라서 &quot;어떤 강아지들이요?&quot;라고 여쭤봤어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> '강아지'라는 말을 듣고 내가 \u003cb class=\"key\">깜짝 \u003c/b>\u003cb class=\"key\">놀라\u003c/b> 되물은 장면이에요. 요리 이름인 줄 모르고 진짜 강아지인 줄 알았어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사 + 꾸며 주는 말(be동사, 형용사)\u003c/span> : 나는(I) + 놀란 상태였다(was + shocked) : \"나는 깜짝 놀랐어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지난 일 말하기(과거형)\u003c/span> : 물었다(ask) + ed → asked : \"여쭤봤어요\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"At first, 처음에. I was shocked, 나는 깜짝 놀랐어요. and asked, 그리고 여쭤봤어요. \"What puppies?\", \"어떤 강아지들이요?\". 이 문장 전체를 해석하면, 처음에 나는 깜짝 놀라서 \"어떤 강아지들이요?\"라고 여쭤봤어요.","hl":"m"},{"n":19,"text":"강아지라는 말을 듣고 내가 깜짝 놀라 되물은 장면이에요. 요리 이름인 줄 모르고 진짜 강아지인 줄 알았죠.","hl":"mn"},{"n":20,"text":"첫 번째, was shocked는 be동사 was 뒤에 형용사 shocked를 붙인 모양이에요. 그래서 놀란 상태였다는 뜻이 되죠. 두 번째, asked는 지난 일이라서 ask에 -ed를 붙인 과거형이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 13\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">할머니께서는\u003c/span>\u003cspan class=\"en\">Grandma\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">웃으시며 대답하셨어요,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">smiled \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">answered\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">&quot;허시\u003c/span>\u003cspan class=\"en\">&quot;Hush\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">퍼피스는 만들어져요\u003c/span>\u003cspan class=\"en\">puppies are made\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">옥수숫가루로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">cornmeal\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">할머니께서는 웃으시며 대답하셨어요, &quot;허시 퍼피스는 옥수숫가루로 만들어진단다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 허시 퍼피스가 무엇으로 만들어지는지 알려 주는 설명 문장이에요. \u003cb class=\"key\">옥수숫가루\u003c/b>로 만든 \u003cb class=\"key\">음식\u003c/b>이라는 뜻이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말하기(과거형)\u003c/span> : 누가(Grandma) + 웃었다(smiled) + 그리고(and) + 대답했다(answered) : \"웃으시고 대답하셨어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사(전치사)\u003c/span> : 무엇으로(from) + 무엇(cornmeal) : \"옥수숫가루로\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Grandma, 할머니께서는. smiled and answered, 웃으시며 대답하셨어요. \"Hush, \"허시. puppies are made, 퍼피스는 만들어져요. from cornmeal, 옥수숫가루로. 이 문장 전체를 해석하면, 할머니께서는 웃으시며 대답하셨어요, \"허시 퍼피스는 옥수숫가루로 만들어진단다.","hl":"m"},{"n":22,"text":"이 문장은 허시 퍼피스가 무엇으로 만들어지는지 알려 줘요. 옥수숫가루로 만든 음식이라는 뜻이죠.","hl":"mn"},{"n":23,"text":"먼저 smiled and answered를 볼까요. 지난 일이라서 동사에 ed를 붙여 과거형으로 말했어요. 그리고 from cornmeal에서 from은 무엇으로 만들어졌는지 이어 주는 전치사예요. 옥수숫가루로라는 뜻이 되죠.","hl":"gr"}]},{"html":"\u003c  class=\"lp-chunk\">\u003cspan class=\"ko\">개들에게\u003c/span>\u003cspan class=\"en\">at dogs\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">개들이 짖고 있을 때.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">when\u003c/span> they \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">barking\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">한 이야기에서는, 사람들은 개들이 짖을 때 튀겨진 동그란 덩어리들을 그것들에게 던졌어.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 옛 \u003cb class=\"key\">이야기\u003c/b> 속에서 사람들이 튀겨진 동그란 덩어리를 \u003cb class=\"key\">짖는 \u003c/b>\u003cb class=\"key\">개\u003c/b>에게 던졌다는 뜻이에요. 이 행동이 '허시 퍼피스' \u003cb class=\"key\">이름\u003c/b>과 어떻게 연결되는지 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 사람들은(people) + 던졌어요(threw) : \"던졌어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 때를 알려 줘요(when) + 개들이 짖고 있을 때(they were barking) : \"~할 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">하고 있던 중(진행형)\u003c/span> : 그들이(they) + 짖고 있었어요(were barking) : \"짖고 있었어요\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"In one story, 한 이야기에서는. people threw, 사람들은 던졌어요. fried round balls, 튀겨진 동그란 덩어리들을. at dogs, 개들에게. when they were barking, 개들이 짖고 있을 때.. 이 문장 전체를 해석하면, 한 이야기에서는, 사람들은 개들이 짖을 때 튀겨진 동그란 덩어리들을 그것들에게 던졌어.","hl":"m"},{"n":43,"text":"옛 이야기 속에서 사람들이 튀겨진 동그란 덩어리를 짖는 개에게 던졌다는 뜻이에요. 이 행동이 허시 퍼피스 이름과 어떻게 연결되는지 보여 줘요.","hl":"mn"},{"n":44,"text":"먼저 threw는 throw의 지난 일을 말하는 과거형이에요. 그래서 people threw는 사람들은 던졌어요가 돼요. 그다음 when은 두 일을 이어 주는 접속사로 때를 나타내요. 마지막으로 were barking은 개들이 짖고 있던 중이라는 진행형 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러자 개들이\u003c/span>\u003cspan class=\"en\">Then the dogs\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">짖는 것을 멈췄지.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">stopped\u003c/span> barking.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러자 개들이 짖는 것을 멈췄지.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 동그란 덩어리를 맞은 개들이 \u003cb class=\"key\">짖기\u003c/b>를 \u003cb class=\"key\">멈췄다\u003c/b>는 뜻이에요. 그래서 그 음식의 \u003cb class=\"key\">이름\u003c/b>이 개를 조용히 시킨 것과 관련 있다는 걸 알려 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 개들은(the dogs) + 멈췄어요(stopped) : \"멈췄어요\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"Then the dogs, 그러자 개들이. stopped barking, 짖는 것을 멈췄지.. 이 문장 전체를 해석하면, 그러자 개들이 짖는 것을 멈췄지.","hl":"m"},{"n":46,"text":"동그란 덩어리를 맞은 개들이 짖기를 멈췄다는 뜻이에요. 그래서 그 음식의 이름이 개를 조용히 시킨 것과 관련 있다는 걸 알려 줘요.","hl":"mn"},{"n":47,"text":"stopped는 지난 일을 말하는 과거형이라서 멈췄어요가 돼요. 그리고 stop 뒤에 동사 ing가 오면 하던 일을 그만둔다는 뜻이 돼요. 그래서 stopped barking은 짖는 것을 멈췄지라고 해석해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 13\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서 사람들은 말했어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">So\u003c/span> people \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">said\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 튀겨진 동그란 덩어리들이\u003c/span>\u003cspan class=\"en\">that the fried round balls\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">개들을 '조용히 시켰다'고!\u003c/span>\u003cspan class=\"en\">'hushed' the dogs!&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그래서 사람들은 그 튀겨진 동그란 덩어리들이 개들을 '조용히 시켰다'고 말했단다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사람들이 그 튀겨진 동그란 음식이 개들을 \u003cb class=\"key\">조용히 \u003c/b>\u003cb class=\"key\">시켰다\u003c/b>고 말한 것을 알려 줘요. 이렇게 해서 이 음식은 \u003cb class=\"key\">허시 \u003c/b>\u003cb class=\"key\">퍼피스\u003c/b>라는 이름을 갖게 된 거예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 앞말 + 그래서(So) + 뒤말 : \"그래서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 말하다(say)가 말했어요(said)로 바뀜 : \"말했어요\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"So people said, 그래서 사람들은 말했어요. that the fried round balls, 그 튀겨진 동그란 덩어리들이. 'hushed' the dogs!, 개들을 '조용히 시켰다'고!. 이 문장 전체를 해석하면, 그래서 사람들은 그 튀겨진 동그란 덩어리들이 개들을 '조용히 시켰다'고 말했단다!","hl":"m"},{"n":49,"text":"이 문장은 왜 이 음식이 허시 퍼피스라고 불리는지 알려 줘요. 사람들이 그 동그란 음식이 개들을 조용히 시켰다고 말했기 때문이에요.","hl":"mn"},{"n":50,"text":"첫 번째, So는 앞의 내용과 결과를 이어 주는 말이에요. 그래서 앞에서 개들이 짖는 것을 멈춘 일을 말하고, 그 결과를 그래서로 이어 줘요. 두 번째, said는 say의 과거형이에요. 이미 지나간 일이라서 과거형을 써요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">오늘 배운 내용 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>할머니가 만드는 허시 퍼피스는 \u003cb class=\"key\">옥수숫가루\u003c/b>로 만든 작고 동그란 튀김 음식이에요.\u003c/li>\u003cli>손자는 '퍼피'라는 말을 듣고 \u003cb class=\"key\">강아지\u003c/b>가 나오는 줄 알고 놀랐어요.\u003c/li>\u003cli>이름이 붙은 까닭은 개들이 짖을 때 덩어리를 던져 \u003cb class=\"key\">조용히 \u003c/b>\u003cb class=\"key\">시켰다\u003c/b>는 이야기 때문이에요.\u003c/li>\u003cli>오늘 이야기는 질문과 대답이 이어지는 \u003cb class=\"key\">이야기 \u003c/b>\u003cb class=\"key\">순서\u003c/b> 글이었어요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Hush puppies are fried cornmeal balls, and their name comes from a story about hushing barking dogs.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: 할머니가 만드는 허시 퍼피스는 \u003cb class=\"key\">옥수숫가루\u003c/b>로 만든 작고 동그란 튀김 음식이에요. 손자는 왜 \u003cb class=\"key\">강아지\u003c/b>라는 이름이 붙었는지 궁금해하고, 할머니는 개들의 짖음을 \u003cb class=\"key\">조용히 \u003c/b>\u003cb class=\"key\">시킨\u003c/b> 이야기에서 이름이 나왔다고 알려 주세요.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":51,"text":"오늘 우리는 허시 퍼피스라는 이름에 숨은 재미있는 이야기를 읽었어요. 강아지가 아니라 옥수숫가루로 만든 튀김 음식이었죠. 이름의 유래까지 알게 되니 단어가 더 친근하게 느껴지지 않나요? 여러분 정말 잘했어요. 다음 시간에도 재미있는 이야기로 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
