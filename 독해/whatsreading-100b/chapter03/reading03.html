</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"왓츠 리딩 100B Ch.3 Unit 03 A Special Day in June","audioDir":"reading03_audio","preview":false,"count":63,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.400em\">Ch.3 Unit\u003cbr>03 A Special\u003cbr>Day in June\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">왓츠 리딩 100B\u003c/div>\u003ch1>Juneteenth: A Special Day to Remember Freedom\u003c/h1>\u003ch2>Juneteenth: 자유를 기억하는 특별한 날\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">한 줄 요약\u003c/span>\u003cspan>Tiera는 밖에서 놀 수 없어 속상했지만, 아빠가 \u003cb class=\"key\">Juneteenth\u003c/b>와 고조할아버지 Willie의 이야기를 들려주었어요. 노예였던 Willie 할아버지가 \u003cb class=\"key\">자유\u003c/b>를 얻은 날을 기억하며 가족은 솔 푸드로 축하하기로 해요.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Juneteenth is a special day to remember Grandpa Willie and celebrate freedom.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘도 만나서 반가워요. 오늘은 Tiera와 아빠가 들려주는 특별한 날 이야기를 읽어 볼 거예요. 바로 Juneteenth와 자유에 관한 이야기예요. Tiera가 속상한 마음을 이겨 내고 소중한 날을 기억하는 내용이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">미리 알면 쉬워요\u003c/span>\u003cdiv class=\"lp-box\">\u003cb class=\"key\">Juneteenth\u003c/b>는 미국에서 유월 십구 일에 자유를 기억하는 날이에요. 영어로 June과 nineteenth를 합친 말이에요. 옛날 미국에는 노예라는 신분으로 \u003cb class=\"key\">자유\u003c/b> 없이 일해야 했던 사람들이 있었어요. 천팔백육십오 년 유월 십구 일에 그들이 드디어 \u003cb class=\"key\">freedom\u003c/b>을 얻었다는 소식을 들었지요. 우리가 운동회에서 오래 기다린 뒤 드디어 달리기 시작할 때처럼, 아주 기다리던 자유를 얻은 날이에요.\u003c/div>","segs":[{"n":2,"text":"여러분, Juneteenth라는 말을 들어 본 적 있나요? 이것은 미국에서 유월 십구 일에 자유를 기억하는 날이에요. 영어로 June과 nineteenth를 합친 말이고, 옛날 미국에는 노예라는 신분으로 자유 없이 일해야 했던 사람들이 있었어요. 그런데 천팔백육십오 년 유월 십구 일에 그들이 드디어 freedom을 얻었다는 소식을 들었지요. 우리가 운동회에서 오래 기다린 뒤 드디어 달리기 시작할 때처럼, 아주 기다리던 자유를 얻은 날이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>속상한 Tiera\u003csmall>문제 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>Tiera는 밖에서 \u003cb class=\"key\">놀고 \u003c/b>\u003cb class=\"key\">싶었지만\u003c/b> 그럴 수 없었어요. 너무 늦고 너무 어두워서 \u003cb class=\"key\">속상해요\u003c/b>.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>아빠의 위로\u003csmall>소개 · 문장 4–8\u003c/small>\u003c/h4>\u003cp>아빠가 Tiera 옆에 앉아 \u003cb class=\"key\">속상해 \u003c/b>\u003cb class=\"key\">하지 \u003c/b>\u003cb class=\"key\">말라\u003c/b>고 해요. 내일은 \u003cb class=\"key\">Juneteenth\u003c/b> 기념 행사라며 고조할아버지 이야기를 시작해요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>Willie 할아버지\u003csmall>예시 · 문장 9–12\u003c/small>\u003c/h4>\u003cp>Willie 할아버지는 \u003cb class=\"key\">노예\u003c/b>였고 오랜 시간 일해야 했어요. 하지만 자유를 원하며 더 나은 미래를 계획했고, 천팔백육십오 년 유월 십구 일에 \u003cb class=\"key\">자유로워졌어요\u003c/b>.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>기억과 축하\u003csmall>마무리 · 문장 13–17\u003c/small>\u003c/h4>\u003cp>그들은 환호하며 축하했고, 그날부터 일해서 \u003cb class=\"key\">돈을 \u003c/b>\u003cb class=\"key\">벌었어요\u003c/b>. 매년 Juneteenth에 \u003cb class=\"key\">자유\u003c/b>의 첫날을 기억하며 솔 푸드로 축하해요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 이 이야기가 어떤 순서로 흘러가는지 함께 살펴볼까요?","hl":null},{"n":4,"text":"먼저 Tiera는 밖에서 놀고 싶었지만 그럴 수 없었어요. 너무 늦고 너무 어두워서 속상해요. 여러분도 재미있게 놀고 싶은데 못 놀면 속상하죠?","hl":"f0"},{"n":5,"text":"그때 아빠가 Tiera 옆에 앉아 속상해 하지 말라고 말해요. 내일은 Juneteenth 기념 행사라며 고조할아버지 이야기를 시작하지요. Tiera는 아빠의 이야기를 들으며 마음이 조금씩 풀려요.","hl":"f1"},{"n":6,"text":"Willie 할아버지는 노예였고 오랜 시간 일해야 했어요. 하지만 자유를 정말 원하면서 더 나은 미래를 계획했어요. 그리고 천팔백육십오 년 유월 십구 일에 마침내 자유로워졌어요.","hl":"f2"},{"n":7,"text":"그들은 환호하며 축하했고, 그날부터 일해서 돈을 벌었어요. 처음부터 쉽지는 않았지만 매년 Juneteenth에 자유의 첫날을 기억했지요. 그래서 Tiera의 아빠도 Willie 할아버지를 기억하며 솔 푸드로 축하하자고 말해요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">이야기 순서\u003c/span>\u003cspan class=\"lp-pill\">끝\u003c/span>\u003cspan class=\"lp-pill\">주제문 16번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">Tiera가 밖에서 놀 수 없어 \u003cb class=\"key\">속상한 \u003c/b>\u003cb class=\"key\">일\u003c/b>로 시작해요. 아빠의 이야기를 통해 \u003cb class=\"key\">Willie \u003c/b>\u003cb class=\"key\">할아버지\u003c/b>가 노예에서 자유로워진 일을 알게 되지요. 마지막에는 \u003cb class=\"key\">Juneteenth\u003c/b>를 기억하고 솔 푸드로 축하하자는 말로 끝나요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>but (1)\u003c/b>\u003cspan>반대 내용을 알려 줘요\u003c/span>\u003cb>Then (8)\u003c/b>\u003cspan>다음 일이 이어짐을 알려 줘요\u003c/span>\u003cb>From that day (14)\u003c/b>\u003cspan>그날 이후의 변화를 알려 줘요\u003c/span>\u003cb>But (16)\u003c/b>\u003cspan>앞과 반대되는 내용을 이어 줘요\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Tiera\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">she\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">her\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 Tiera가 속상한 일로 시작해서 아빠가 Willie 할아버지 이야기를 들려주고 Juneteenth를 기억하는 순서로 이어지는 이야기예요. 중심 문장은 끝부분에 있는 자유의 첫날을 기억한다는 문장이에요. 그래서 처음부터 끝까지 사건이 순서대로 흘러가는 글이라고 볼 수 있지요.","hl":"ty"},{"n":9,"text":"첫 번째 문장에서는 but이 나와서 Tiera가 놀고 싶었지만 그럴 수 없었다는 반대 내용을 알려 줘요. Then은 다음 이야기로 넘어간다는 신호이고, From that day는 그날 이후의 변화를 알려 주지요. 또 Tiera를 she나 her로 다시 부르는 것처럼 같은 사람을 다른 말로 표현하기도 해요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 단어\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>want to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~하고 싶다\u003c/span>\u003c/div>\u003cdiv>\u003cb>outside\u003c/b>\u003cem>부사\u003c/em>\u003cspan>밖에\u003c/span>\u003c/div>\u003cdiv>\u003cb>couldn't\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~할 수 없었다\u003c/span>\u003c/div>\u003cdiv>\u003cb>late\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>늦은\u003c/span>\u003c/div>\u003cdiv>\u003cb>dark\u0 ass=\"a\">happy\u003c/span>\u003cspan class=\"a\">glad\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">dark\u003c/b>\u003cspan class=\"m\">어두운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">dim\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">bright\u003c/span>\u003cspan class=\"a\">light\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">easy\u003c/b>\u003cspan class=\"m\">쉬운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">simple\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hard\u003c/span>\u003cspan class=\"a\">difficult\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">remember\u003c/b>\u003cspan class=\"m\">기억하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">keep in mind\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">forget\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">celebrate\u003c/b>\u003cspan class=\"m\">축하하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">cheer\u003c/span>\u003cspan class=\"s\">have a party\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"upset은 sad나 unhappy와 비슷하고 happy나 glad와 반대예요. dark는 bright나 light와 반대되고, easy는 simple과 비슷하며 hard나 difficult와 반대예요. remember는 forget과 반대이고, celebrate는 cheer와 비슷해요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 17\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Tiera는 원했어요\u003c/span>\u003cspan class=\"en\">Tiera \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">wanted \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">밖에서 노는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">play\u003c/span> outside,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 그녀는 그럴 수 없었어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">but\u003c/span> she couldn't.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Tiera는 밖에서 놀고 싶었지만 그럴 수 없었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Tiera는 밖에서 \u003cb class=\"key\">놀고 \u003c/b>\u003cb class=\"key\">싶었어요\u003c/b>. 그런데 그럴 수 없어서 \u003cb class=\"key\">속상한 \u003c/b>\u003cb class=\"key\">마음\u003c/b>이 들었어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">원하다 + to + 동사원형(to부정사)\u003c/span> : 누가(Tiera) + 원했어요(wanted) + ~하는 것을(to play) : \"노는 것을 원했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 놀고 싶었다(문장) + but + 못 놀았다(반대 문장) : \"그러나, 하지만\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Tiera wanted, Tiera는 원했어요. to play outside, 밖에서 노는 것을. but she couldn't, 하지만 그녀는 그럴 수 없었어요. 이 문장 전체를 해석하면, Tiera는 밖에서 놀고 싶었지만 그럴 수 없었습니다.","hl":"m"},{"n":13,"text":"Tiera는 밖에서 놀고 싶었어요. 그런데 그럴 수 없어서 기분이 좋지 않았어요.","hl":"mn"},{"n":14,"text":"먼저 wanted to play를 볼까요. '~하고 싶다'는 want to 뒤에 동사원형을 붙여 말해요. 여기서는 play가 왔죠. want to 다음에는 동사원형이 온다는 것, 꼭 기억해요. 두 번째로 but은 반대되는 내용을 이어 주는 말이에요. 놀고 싶었지만 못 놀았다는 반대 상황을 but이 이어 주고 있어요. 그래서 Tiera는 속상한 마음이 되었답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 ~였어요\u003c/span>\u003cspan class=\"en\">It \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">너무 늦었어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">too \u003c/span>\u003cspan class=\"tgt\">late\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 너무 어두웠어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">and\u003c/span> too dark.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">너무 늦었고 너무 어두웠거든요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 시간이 \u003cb class=\"key\">늦었고\u003c/b> 주변이 \u003cb class=\"key\">어두웠다\u003c/b>는 뜻이에요. 그래서 Tiera는 밖에서 놀 수 없었어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말하는 be동사(be동사 과거형)\u003c/span> : 상황(It) + 이었다(was) + 늦은(late) : \"~였어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">더 자세히 알려 주는 말(부사)\u003c/span> : too(너무) + 형용사(late) : \"너무 늦은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 늦다(late) + and + 어둡다(dark) : \"그리고\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"It was, 그것은 ~였어요. too late, 너무 늦었어요. and too dark, 그리고 너무 어두웠어요. 이 문장 전체를 해석하면, 너무 늦었고 너무 어두웠거든요.","hl":"m"},{"n":16,"text":"시간이 너무 늦었고 너무 어두웠다는 뜻이에요. 그래서 밖에서 놀 수가 없었던 거죠.","hl":"mn"},{"n":17,"text":"먼저 It was를 볼까요. 지난 일을 말할 때 is는 was로 바뀌어요. 그래서 It was는 '그것은 그랬어요'가 돼요. 두 번째로 too는 너무라는 뜻으로 형용사 앞에 붙어요. late나 dark 앞에 붙어서 정도를 세게 만들어 주죠. 세 번째로 and는 늦었다는 말과 어두웠다는 말을 이어 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 속상했어요\u003c/span>\u003cspan class=\"en\">She \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">upset\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 속상했어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Tiera가 \u003cb class=\"key\">속상했어요\u003c/b>라는 뜻이에요. 밖에서 놀 수 없어서 기분이 좋지 않았던 거죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말하는 be동사(be동사 과거형)\u003c/span> : 누가(She) + 이었다(was) + 속상한(upset) : \"그녀는 ~였어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">꾸며 주는 말(형용사)\u003c/span> : be동사(was) + 형용사(upset) : \"속상한\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"She was upset, 그녀는 속상했어요. 이 문장 전체를 해석하면, 그녀는 속상했어요.","hl":"m"},{"n":19,"text":"Tiera가 속상했어요라는 뜻이에요. 놀고 싶었는데 못 놀아서 기분이 좋지 않았던 거예요.","hl":"mn"},{"n":20,"text":"여기서도 be동사의 과거형 was가 쓰였어요. 주어 She 뒤에 was가 오고, 그 뒤에 upset이라는 형용사가 와서 그녀의 기분을 설명해 줘요. be동사 뒤에 형용사를 붙이면 그 사람의 상태를 아주 쉽게 말할 수 있답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀의 아빠가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Her\u003c/span> dad\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">앉았어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">sat\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀의 옆에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">next \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">her\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀의 아빠가 그녀의 옆에 앉았어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 속상한 티에라 곁에 아빠가 와서 \u003cb class=\"key\">옆에 \u003c/b>\u003cb class=\"key\">앉았다\u003c/b>는 뜻이에요. 아빠가 \u003cb class=\"key\">위로\u003c/b>해 주려는 따뜻한 장면이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">'~의'를 나타내는 소유격(소유격)\u003c/span> : 그녀의(Her) + 명사(dad) : \"그녀의 아빠\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지난 일을 말하는 과거형(과거형)\u003c/span> : 지난 일이라 앉았다(sat) : \"앉았어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">장소를 알려 주는 전치사(전치사)\u003c/span> : 옆에(next to) + 그녀(her) : \"그녀의 옆에\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Her dad, 그녀의 아빠가. sat, 앉았어요. next to her, 그녀의 옆에. 이 문장 전체를 해석하면, 그녀의 아빠가 그녀의 옆에 앉았어요.","hl":"m"},{"n":22,"text":"속상한 티에라 곁으로 아빠가 와서 옆에 앉았다는 뜻이에요. 아빠가 위로해 주려는 따뜻한 장면이죠.","hl":"mn"},{"n":23,"text":"첫 번째, Her는 '그녀의'라는 뜻으로 뒤에 오는 명사 dad를 꾸며 줘요. 두 번째, sat은 sit의 과거형이에요. 지난 일이라서 '앉았어요'라고 해요. 세 번째, next to는 '옆에'라는 뜻의 전치사예요. 그래서 next to her는 '그녀의 옆에'가 된답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 말했어요,\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">said\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">속상해 하지 마세요\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">Don't \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">upset\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">아빠는 &quot;속상해 하지 말거라.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아빠가 속상해하는 티에라에게 다정하게 \u003cb class=\"key\">말했어요\u003c/b>. 이제 \u003cb class=\"key\">아빠의 \u003c/b>\u003cb class=\"key\">말\u003c/b>이 길게 이어지는 부분이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">말하다의 과거형(과거형)\u003c/span> : 말했다(said) : \"말했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">'~하지 마'라고 하는 부정 명령문(명령문)\u003c/span> : 하지 마(Don't) + 속상해(be upset) : \"속상해 하지 마세요\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"He said, 그는 말했어요. \"Don't be upset, 속상해 하지 마세요. 이 문장 전체를 해석하면, 아빠는 \"속상해 하지 말거라.","hl":"m"},{"n":25,"text":"아빠가 속상해하는 티에라에게 속상해 하지 말라고 다정하게 말했어요. 이제 아빠의 말이 길게 이어지는 부분이죠.","hl":"mn"},{"n":26,"text":"첫 번째, said는 say의 과거형이에요. 아빠가 이미 한 말이라서 '말했어요'라고 해요. 두 번째, Don't be upset은 '속상해 하지 마세요'라는 명령문이에요. 명령문에서 '~하지 마'라고 할 때는 Don't를 앞에 붙인답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내일\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Tomorrow\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 가지게 될 거예요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">have\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기념 행사를\u003c/span>\u003cspan class=\"en\">a celebration.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 내일 기념 행사가 있잖니.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아빠가 내일 준틴스를 기념하는 \u003cb class=\"key\">행사\u003c/b>가 있다고 알려 주는 문장이에요. 속상한 마음을 \u003cb class=\"key\">기쁨\u003c/b>으로 바꿔 주는 따뜻한 말이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">때를 알려 주는 부사(부사)\u003c/span> : 내일(Tomorrow) + 문장 : \"내일\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">앞으로 할 일을 말하는 will(미래 시제)\u003c/span> : 누가(we) + ~할 거예요(will have) : \"우리는 가지게 될 거예요\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Tomorrow, 내일. we will have, 우리는 가지게 될 거예요. a celebration, 기념 행사를. 이 문장 전체를 해석하면, 우리는 내일 기념 행사가 있잖니.","hl":"m"},{"n":28,"text":"아빠가 내일 준틴스를 기념하는 행사가 있다고 알려 주는 문장이에요. 속상한 마음을 기쁨으로 바꿔 주는 따뜻한 말이죠.","hl":"mn"},{"n":29,"text":"첫 번째, Tomorrow는 '내일'이라고 때를 알려 주는 부사예요. 두 번째, will은 앞으로 할 일을 말할 때 쓰는 도와주는 동사예요. will 뒤에는 꼭 동사원형이 와서 will have가 된답니다. 그래서 우리는 내일 기념 행사를 가질 거예요라는 뜻이 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">준틴스예요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It's\u003c/span> Juneteenth\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내일이에요\u003c/span>\u003cspan class=\"en\">tomorrow.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">내일이 Juneteenth잖아.&quot;라고 말씀하셨어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 내일이 \u003cb class=\"key\">Juneteenth\u003c/b>라는 특별한 날이라고 알려 주는 말이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">am·are·is 친구들(be동사)\u003c/span> : 그것은(It) + 이에요(is) : \"그것은 ~이에요\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"It's Juneteenth, 준틴스예요. tomorrow.\", 내일이에요. 이 문장 전체를 해석하면, 내일이 Juneteenth잖아.\"라고 말씀하셨어요.","hl":"m"},{"n":31,"text":"아빠가 내일이 특별한 날이라고 알려 줘요. 내일이 바로 Juneteenth예요.","hl":"mn"},{"n":32,"text":"이 문장은 아빠가 내일이 무슨 날인지 알려 주는 말이에요. It's는 It is를 줄인 말이고, 여기서는 be동사예요. 그래서 It's Juneteenth tomorrow는 내일이 Juneteenth라는 뜻이죠. Juneteenth는 미국에서 노예 해방을 기념하는 특별한 날이에요. 오늘도 아빠 말투처럼 씩씩하게 읽어 볼까요?","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러고 나서 그는 시작했어요\u003c/span>\u003cspan class=\"en\">Then \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">started\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">말하기를 그의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">telling\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고조할아버지의 이야기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">great-great-grandpa's\u003c/span> story.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러고 나서 아빠는 그의 고조할아버지의 이야기를 하기 시작하셨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아빠가 \u003cb class=\"key\">고조할아버지\u003c/b> 이야기를 하기 시작했다는 뜻이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 그는(he) + 시작했다(started) : \"그는 시작했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동사-ing(동명사)\u003c/span> : start + 동사-ing = ~하기 시작하다 : \"말하기\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">누구의(소유격)\u003c/span> : 그의(his) + 고조할아버지의(great-great-grandpa's) : \"그의 고조할아버지의\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"Then he started, 그러고 나서 그는 시작했어요. telling his, 말하기를 그의. great-great-grandpa's story, 고조할아버지의 이야기를. 이 문장 전체를 해석하면, 그러고 나서 아빠는 그의 고조할아버지의 이야기를 하기 시작하셨습니다.","hl":"m"},{"n":34,"text":"아빠가 고조할아버지 이야기를 하기 시작했다는 뜻이에요. 여기서 great-great-grandpa는 아주 위쪽 할아버지예요.","hl":"mn"},{"n":35,"text":"먼저 he started는 지난 일이라 과거형을 썼어요. started telling은 '말하기 시작했다'라는 덩어리로 기억해요. telling은 동사-ing 모양이에요. 마지막으로 his와 great-great-grandpa's는 소유격이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Willie 할아버지는\u003c/span>\u003cspan class=\"en\">Grandpa Willie\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">노예였어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was\u003c/span> a slave\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 일해야 했어요\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">work\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오랜 시간 동안\u003c/span>\u003cspan class=\"en\">long hours.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Willie 할아버지는 노예였고 오랜 시간 일해야 했대요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Willie 할아버지가 \u003cb class=\"key\">노예\u003c/b>였고, \u003cb class=\"key\">오랜 \u003c/b>\u003cb class=\"key\">시간\u003c/b> 일해야 했다는 뜻이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">am·are·is 친구들(be동사)\u003c/span> : Willie 할아버지는(Grandpa Willie) + 이었다(was) + 노예(a slave) : \"노예였어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">도와주는 동사(조동사)\u003c/span> : 누가(He) + 해야 했다(had to) + 하다(work) : \"일해야 했어요\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Grandpa Willie, Willie 할아버지는. was a slave, 노예였어요. and had to work, 그리고 일해야 했어요. long hours, 오랜 시간 동안. 이 문장 전체를 해석하면, Willie 할아버지는 노예였고 오랜 시간 일해야 했대요.","hl":"m"},{"n":37,"text":"Willie 할아버지가 노예였고, 오랜 시간 일해야 했다는 뜻이에요. 아주 힘든 삶이었죠.","hl":"mn"},{"n":38,"text":"was는 be동사 is의 과거형이라 '노예였어요'라는 뜻이에요. had to work는 '일해야 했어요'이고, had to는 have to의 과거형이에요. 그래서 조동사 had to를 꼭 기억해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">노예들은 ~하지 않았어요\u003c/span>\u003cspan class=\"en\">Slaves \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">didn't \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자유를 가지지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">have\u003c/span> freedom,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 그들은 정말로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">but\u003c/span> they really\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 원했어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">wanted\u003c/span> it.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">노예들에게는 자유가 없었지만, 그들은 그것을 정말로 원했어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 노예들에게 \u003cb class=\"key\">자유\u003c/b>는 없었지만, 그 마음속에는 자유를 갖고 싶은 \u003cb class=\"key\">마음\u003c/b>이 가득했다는 걸 알려 줘요. 다음 문장에서 그 소망이 어떻게 이루어지는지 이어지는 \u003cb class=\"key\">준비\u003c/b> 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거 부정문(do/does/did 부정문)\u003c/span> : 누가(they) + 않았다(didn't) + 하다(have) : \"가지지 않았어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 문장 + but + 반대되는 문장 : \"하지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">과거형(규칙 과거형)\u003c/span> : 누가(they) + 원했다(wanted) + 그것을(it) : \"원했어요\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"Slaves didn't, 노예들은 ~하지 않았어요. have freedom, 자유를 가지지. but they really, 하지만 그들은 정말로. wanted it, 그것을 원했어요. 이 문장 전체를 해석하면, 노예들에게는 자유가 없었지만, 그들은 그것을 정말로 원했어요.","hl":"m"},{"n":40,"text":"노예들에게는 자유가 없었지만, 마음속으로는 자유를 정말 원했다는 문장이에요. 바로 다음에 그 소망이 이루어지는 이야기가 나온다는 걸 기억해 두세요.","hl":"mn"},{"n":41,"text":"첫 번째, 지난 일을 안 했다고 말할 때는 didn't를 동사 앞에 놓아요. 그래서 didn't have라고 하죠. 두 번째, but은 앞말과 반대되는 내용을 이어 주는 말이에요. 세 번째, wanted는 want에 -ed를 붙인 지난 모양이에요. 오늘 배운 세 가지를 꼭 기억해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 계획을 세웠어요\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">made\u003c/span> plans\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 나은 미래를 위한\u003c/span>\u003cspan class=\"en\">for a \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">better\u003c/span> future.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 더 나은 미래를 위한 계획을 세웠습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 자유가 없는 힘든 상황에서도 노예들은 \u003cb class=\"key\">희망\u003c/b>을 잃지 않고 더 나은 \u003cb class=\"key\">미래\u003c/b>를 위해 무엇을 할지 생각하고 \u003cb class=\"key\">계획\u003c/b>을 세웠다는 뜻이에요. 이 글이 말하고 싶은 중심 생각이 담긴 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거형(불규칙 과거형)\u003c/span> : 누가(They) + 만들었다(made) + 무엇을(plans) : \"세웠어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">더 ~한(비교급)\u003c/span> : 더 ~한(better) + 명사(future) : \"더 나은\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"They made plans, 그들은 계획을 세웠어요. for a better future, 더 나은 미래를 위한. 이 문장 전체를 해석하면, 그들은 더 나은 미래를 위한 계획을 세웠습니다.","hl":"m"},{"n":43,"text":"힘든 상황에서도 노예들은 더 나은 미래를 꿈꾸며 계획을 세웠다는 문장이에요. 희망을 잃지 않는 마음이 참 멋지죠?","hl":"mn"},{"n":44,"text":"첫 번째, made는 make의 지난 모양이에요. -ed를 붙이지 않는 불규칙 동사라서 그대로 외워야 해요. 두 번째, better는 good의 비교급으로 더 나은이라는 뜻이에요. 여러분도 더 나은 미래라는 말을 꼭 기억해 보세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1865년 6월 19일에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">On \u003c/span>\u003cspan class=\"tgt\">June \u003c/span>\u003cspan class=\"tgt\">19th\u003c/span>, 1865,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 자유로워졌어요\u003c/span>\u003cspan class=\"en\">they \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">became\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">free\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">1865년 6월 19일, 그들은 자유로워졌습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 마침내 그날, 노예들이 자유를 얻은 \u003cb class=\"key\">첫날\u003c/b>이 왔다는 뜻이에요. 이 날이 바로 이 글의 제목에 나오는 \u003cb class=\"key\">준틴스\u003c/b>의 시작이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간 짝꿍 말(전치사)\u003c/span> : 짝꿍 말(On) + 날짜(June 19th) : \"6월 19일에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거형(불규칙 과거형)\u003c/span> : 누가(they) + became + 어떤 상태(free) : \"~이 되었어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">보충하는 말(보어)\u003c/span> : they + became + free : \"자유로운(상태)\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"On June 19th, 1865, 1865년 6월 19일에. they became free, 그들은 자유로워졌어요. 이 문장 전체를 해석하면, 1865년 6월 19일, 그들은 자유로워졌습니다.","hl":"m"},{"n":46,"text":"마침내 그날, 노예들이 자유를 얻은 첫날이 왔다는 문장이에요. 이 날이 바로 준틴스가 시작된 날이에요.","hl":"mn"},{"n":47,"text":"첫 번째, 날짜 앞에는 on을 붙여요. 그래서 On June nineteenth라고 말해요. 두 번째, became은 become의 지난 모양이에요. 그래서 그날 자유로워졌다는 뜻이 돼요. 세 번째, free는 became 뒤에서 보어 역할을 해요. 자유로운 상태가 되었다고 해석하면 아주 자연스러워요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 환호했어요\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">cheered\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 축하했어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and\u003c/span> celebrated.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 환호하며 축하했어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 자유를 얻은 사람들이 기쁨을 크게 드러낸 장면이에요. \u003cb class=\"key\">환호\u003c/b>와 \u003cb class=\"key\">축하\u003c/b>가 나란히 나와서 기쁨이 아주 컸다는 걸 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거형(규칙 동사 과거형)\u003c/span> : 그들은(They) + 환호했다(cheered) : \"환호했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 환호했다(cheered) + and + 축하했다(celebrated) : \"그리고\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"They cheered, 그들은 환호했어요. and celebrated, 그리고 축하했어요. 이 문장 전체를 해석하면, 그들은 환호하며 축하했어요.","hl":"m"},{"n":49,"text":"이 문장은 자유를 얻은 사람들이 얼마나 기뻤는지 보여 줘요. 환호와 축하, 두 가지 기쁨 표현이 나란히 나와요.","hl":"mn"},{"n":50,"text":"첫 번째, cheered와 celebrated는 지난 일을 말하니까 동사 뒤에 -ed를 붙인 과거형이에요. 두 번째, and는 환호하는 일과 축하하는 일을 이어 주는 접속사예요. 그래서 두 행동을 한 번에 말할 수 있답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그날부터\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">From \u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">day\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 돈을 벌었어요\u003c/span>\u003cspan class=\"en\">they \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">made\u003c/span> money\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 한 일에 대해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">work\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그날부터 그들은 일을 해서 돈을 벌었어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 자유를 얻은 뒤에 생활이 어떻게 달라졌는지 알려 주는 문장이에요. 이제는 \u003cb class=\"key\">일한 \u003c/b>\u003cb class=\"key\">만큼\u003c/b> \u003cb class=\"key\">돈\u003c/b>을 받게 되었다는 뜻이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">장소·시간 짝꿍 말(전치사)\u003c/span> : From(부터) + that day(그날) : \"그날부터\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거형(불규칙 동사 과거형)\u003c/span> : 그들은(they) + 벌었다(made) + 돈을(money) : \"벌었어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">장소·시간 짝꿍 말(전치사)\u003c/span> : for(대한 것) + their work(그들이 한 일) : \"그들이 한 일에 대해\"\u003c/div>\u003c/div>","segs":[{"n":51,"text":"From that day, 그날부터. they made money, 그들은 돈을 벌었어요. for their work, 그들이 한 일에 대해. 이 문장 전체를 해석하면, 그날부터 그들은 일을 해서 돈을 벌었어요.","hl":"m"},{"n":52,"text":"이 문장은 자유를 얻은 뒤에 생활이 어떻게 달라졌는지 알려 줘요. 이제는 일한 만큼 돈을 받게 되었다는 거예요.","hl":"mn"},{"n":53,"text":"첫 번째, From that day는 그날부터라는 뜻으로 시간을 알려 주는 전치사 덩어리예요. 두 번째, made는 make의 과거형이에요. 세 번째, for their work는 그들이 한 일에 대한, 그러니까 일한 값이라는 뜻이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 15 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">처음부터\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">From \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">beginning\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 쉽지 않았어요\u003c/span>\u003cspan class=\"en\">it \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">wasn't\u003c/span> easy.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">처음부터 쉽지는 않았지요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 자유를 얻었어도 삶이 바로 편해진 건 아니라는 걸 말해요. 앞의 기쁜 장면과 짝을 이뤄 \u003cb class=\"key\">처음\u003c/b>의 어려움을 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">장소·시간 짝꿍 말(전치사)\u003c/span> : From(부터) + the beginning(처음) : \"처음부터\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">am·are·is 친구들(be동사)\u003c/span> : 그것은(it) + 쉽지 않았다(wasn't) + easy : \"쉽지 않았어요\"\u003c/div>\u003c/div>","segs":[{"n":54,"text":"From the beginning, 처음부터. it wasn't easy, 그것은 쉽지 않았어요. 이 문장 전체를 해석하면, 처음부터 쉽지는 않았지요.","hl":"m"},{"n":55,"text":"자유를 얻었어도 삶이 바로 편해진 건 아니라는 뜻이에요. 그래서 앞의 기쁜 장면과 짝을 이루는 문장이에요.","hl":"mn"},{"n":56,"text":"첫 번째, wasn't는 was와 not을 합친 말로, 과거에 그렇지 않았다고 말하는 be동사 부정문이에요. 두 번째, From the beginning은 처음부터라는 뜻으로 때를 알려 주는 전치사 덩어리예요. 쉽지 않았다는 말에 힘을 더해 주죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 16 / 17\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 매년\u003c/span>\u003cspan class=\"en\">But every year\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Juneteenth에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">Juneteenth\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 기억했어요\u003c/span>\u003cspan class=\"en\">they \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">remembered\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자유를 얻은 첫날을\u003c/span>\u003cspan class=\"en\">the first day of freedom.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 매년 Juneteenth에 그들은 자유를 얻은 첫날을 기억했어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 해방된 뒤에도 매년 자유를 얻은 첫날을 잊지 않고 기억했다는 뜻이에요. \u003cb class=\"key\">Juneteenth\u003c/b>가 \u003cb class=\"key\">자유\u003c/b>를 \u003cb class=\"key\">기억\u003c/b>하는 날임을 알려 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간 짝꿍 말(전치사)\u003c/span> : on + 날짜·요일: Juneteenth에 : \"Juneteenth에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 그들은(they) + 기억했어요(remembered) + 첫날을(the first day) : \"기억했어요\"\u003c/div>\u003c/div>","segs":[{"n":57,"text":"But every year, 하지만 매년. on Juneteenth, Juneteenth에. they remembered, 그들은 기억했어요. the first day of freedom, 자유를 얻은 첫날을. 이 문장 전체를 해석하면, 하지만 매년 Juneteenth에 그들은 자유를 얻은 첫날을 기억했어요.","hl":"m"},{"n":58,"text":"이 문장은 해방된 뒤에도 매년 그 첫날을 잊지 않고 기억했다는 뜻이에요. Juneteenth가 자유를 얻은 날을 기억하는 날임을 알려 줘요.","hl":"mn"},{"n":59,"text":"첫 번째, on Juneteenth는 날짜 앞에 쓰는 시간 짝꿍 말이에요. 두 번째, remembered는 지난 일을 말하는 과거형이에요. 그래서 그들은 기억했어요라고 해석해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 17 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Tiera의 아빠는 말씀하셨어요\u003c/span>\u003cspan class=\"en\">Tiera's dad \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">said,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기억하자\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">Let's \u003c/span>\u003cspan class=\"tgt\">remember\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Willie 할아버지를\u003c/span>\u003cspan class=\"en\">Grandpa Willie\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 기념하자\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">celebrate\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내일 솔 푸드로\u003c/span>\u003cspan class=\"en\">with some soul food tomorrow.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Tiera의 아빠는 &quot;Willie 할아버지를 기억하면서 내일 솔 푸드로 기념하도록 하자.&quot;라고 말씀하셨어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Tiera의 아빠가 Willie 할아버지를 \u003cb class=\"key\">기억\u003c/b>하고 내일 \u003cb class=\"key\">솔 \u003c/b>\u003cb class=\"key\">푸드\u003c/b>로 Juneteenth를 \u003cb class=\"key\">기념\u003c/b>하자고 말하는 장면이에요. 가족이 함께 잊지 않고 축하하자는 뜻을 전해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : Tiera의 아빠(dad) + 말했어요(said) : \"말씀하셨어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">함께 하자고 권하는 말(명령문과 Let's)\u003c/span> : Let's + 동사원형: 우리 ~하자 : \"기억하자\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : remember + and + celebrate: 기억하고 기념하다 : \"그리고 기념하자\"\u003c/div>\u003c/div>","segs":[{"n":60,"text":"Tiera's dad said, Tiera의 아빠는 말씀하셨어요. \"Let's remember, 기억하자. Grandpa Willie, Willie 할아버지를. and celebrate, 그리고 기념하자. with some soul food tomorrow.\", 내일 솔 푸드로. 이 문장 전체를 해석하면, Tiera의 아빠는 \"Willie 할아버지를 기억하면서 내일 솔 푸드로 기념하도록 하자.\"라고 말씀하셨어요.","hl":"m"},{"n":61,"text":"Tiera의 아빠가 Willie 할아버지를 기억하고 내일 솔 푸드로 Juneteenth를 기념하자고 말하는 장면이에요. 가족이 함께 잊지 않고 축하하자는 뜻을 전해요.","hl":"mn"},{"n":62,"text":"첫 번째, said는 지난 일을 말하는 과거형이에요. 두 번째, Let's remember는 우리 함께 하자고 권할 때 쓰는 표현이에요. 세 번째, and celebrate에서 and는 두 동작을 이어 줘요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">오늘 배운 내용 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>Tiera는 밖에서 놀 수 없어 \u003cb class=\"key\">속상했어요\u003c/b>.\u003c/li>\u003cli>아빠는 내일이 \u003cb class=\"key\">Juneteenth\u003c/b>라고 알려 주고 Willie 할아버지 이야기를 해 주었어요.\u003c/li>\u003cli>Willie 할아버지는 노예였지만 \u003cb class=\"key\">자유\u003c/b>를 얻었고, 가족은 그날을 기억해요.\u003c/li>\u003cli>우리는 소중한 날을 \u003cb class=\"key\">기억\u003c/b>하고 \u003cb class=\"key\">축하\u003c/b>하는 마음을 배웠어요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Juneteenth is a special day to remember Grandpa Willie and celebrate freedom.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">Tiera는 밖에서 놀 수 없어 속상했지만, 아빠가 \u003cb class=\"key\">Juneteenth\u003c/b>와 고조할아버지 Willie의 이야기를 들려주었어요. 노예였던 Willie 할아버지가 \u003cb class=\"key\">자유\u003c/b>를 얻은 날을 기억하며 가족은 솔 푸드로 축하하기로 해요.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":63,"text":"오늘은 Tiera가 밖에서 놀 수 없어 속상했어요, 아빠가 Juneteenth와 Willie 할아버지 이야기를 들려주었고, Willie 할아버지가 자유를 얻은 날을 기억한다는 내용을 배웠어요. 우리도 소중한 날을 기억하고 축하하는 마음을 가져 봐요. 오늘 정말 잘 따라 왔어요. 다음 시간에도 즐겁게 영어 공부해요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
