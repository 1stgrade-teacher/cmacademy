<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>왓츠 리딩 100B Ch.3 Unit 04 Ray Charles — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"왓츠 리딩 100B Ch.3 Unit 04 Ray Charles","audioDir":"reading04_audio","preview":false,"count":48,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.520em\">Ch.3 Unit\u003cbr>04 Ray\u003cbr>Charles\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">왓츠 리딩 100B\u003c/div>\u003ch1>Ray Charles: The Genius of Soul Music\u003c/h1>\u003ch2>솔 뮤직의 천재, Ray Charles\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">한 줄 요약\u003c/span>\u003cspan>Ray Charles는 여러 종류의 음악을 섞어 \u003cb class=\"key\">솔 \u003c/b>\u003cb class=\"key\">뮤직\u003c/b>을 만든 음악가예요. 눈이 멀었지만 \u003cb class=\"key\">자신만의 \u003c/b>\u003cb class=\"key\">연주 \u003c/b>\u003cb class=\"key\">방식\u003c/b>으로 큰 성공을 거두고 '천재'라는 별명을 얻었어요.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Ray Charles became a famous musician by mixing different kinds of music into his own style, soul music.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘도 만나서 정말 반가워요. 오늘은 특별한 음악가, Ray Charles 이야기를 읽어 볼 거예요. 여러 종류의 음악을 섞어서 자신만의 음악을 만든 멋진 사람이에요. 같이 시작해 볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">미리 알면 쉬워요\u003c/span>\u003cdiv class=\"lp-box\">음악가(musician)는 노래를 만들고 연주하는 사람이에요. 어떤 음악가들은 재즈, 가스펠처럼 여러 종류의 음악을 섞어요(mix). 여러분이 좋아하는 과자 두 봉지를 한 봉지에 섞어 나만의 신기한 맛을 만드는 것과 비슷해요. soul music은 마음을 울리는 음악이라는 뜻의 \u003cb class=\"key\">솔 \u003c/b>\u003cb class=\"key\">뮤직\u003c/b>이에요. 눈이 먼 사람을 blind라고 하는데, Ray Charles는 그런 어려움 속에서도 멋진 음악을 만들었어요.\u003c/div>","segs":[{"n":2,"text":"음악가 musician은 노래를 만들고 연주하는 사람이에요. 어떤 음악가들은 재즈나 가스펠 같은 여러 종류의 음악을 섞어요. 여러분이 좋아하는 과자 두 봉지를 한 봉지에 섞어서 새로운 맛을 만드는 것과 비슷하죠. soul music은 마음을 울리는 음악이라는 뜻이에요. 여러분은 좋아하는 노래 두 개를 섞으면 어떤 노래가 될 것 같아요?","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>음악가 Ray Charles\u003csmall>소개 · 문장 1–4\u003c/small>\u003c/h4>\u003cp>Ray Charles는 \u003cb class=\"key\">음악가\u003c/b>예요. 그는 \u003cb class=\"key\">독특한 \u003c/b>\u003cb class=\"key\">연주 \u003c/b>\u003cb class=\"key\">방식\u003c/b>으로 유명했어요. 여러 음악을 섞어 \u003cb class=\"key\">솔 \u003c/b>\u003cb class=\"key\">뮤직\u003c/b>이라는 새 음악을 만들었답니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>어린 시절\u003csmall>문제 · 문장 5–7\u003c/small>\u003c/h4>\u003cp>그는 다섯 살 전에 피아노를 칠 수 있었어요. 하지만 시력을 잃어 일곱 살에 \u003cb class=\"key\">눈이 \u003c/b>\u003cb class=\"key\">멀었어요\u003c/b>. 그래도 \u003cb class=\"key\">특수학교\u003c/b>에서 오르간과 트럼펫을 배웠어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>시애틀과 나만의 방식\u003csmall>바뀜 · 문장 8–10\u003c/small>\u003c/h4>\u003cp>1947년에 그는 시애틀로 이사해 밴드에서 연주했어요. 처음에는 다른 음악가들과 \u003cb class=\"key\">비슷했지만\u003c/b>, 그 후 계속 여러 방식을 \u003cb class=\"key\">섞어서\u003c/b> 자신만의 방식을 만들었어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>성공과 천재\u003csmall>마무리 · 문장 11–12\u003c/small>\u003c/h4>\u003cp>그의 노래 대부분이 \u003cb class=\"key\">큰 \u003c/b>\u003cb class=\"key\">성공\u003c/b>을 거두었어요. 한 가지 방식만 쓰지 않았기 때문이에요. 그래서 다른 음악가들이 그를 \u003cb class=\"key\">천재\u003c/b>라고 불렀어요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 이제 Ray Charles의 이야기를 시간 순서대로 따라가 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계예요. Ray Charles는 음악가였어요. 그는 독특한 연주 방식으로 유명했어요. 여러 가지 음악을 섞어서 자신만의 음악을 만들었고, 그것이 바로 솔 뮤직이에요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 그의 어린 시절이에요. 그는 다섯 살이 되기 전에 피아노를 칠 수 있었어요. 하지만 시력을 잃어서 일곱 살 때 눈이 멀었어요. 그래도 특수학교에 다니면서 오르간과 트럼펫을 배웠답니다.","hl":"f1"},{"n":6,"text":"세 번째 단계예요. 천구백사십칠 년에 그는 시애틀로 이사해서 밴드에서 연주했어요. 처음에는 그의 연주 방식이 다른 음악가들과 비슷했어요. 그런데 그 후로 계속 여러 방식을 섞어서 자신만의 방식을 만들어 냈어요.","hl":"f2"},{"n":7,"text":"마지막 단계예요. 그의 노래 대부분이 큰 성공을 거두었어요. 왜냐하면 그는 절대 한 가지 방식으로만 작업하지 않았기 때문이에요. 그래서 다른 음악가들은 Charles를 천재라고 불렀어요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">이야기 순서 (인물의 삶을 시간 순서로 설명하기)\u003c/span>\u003cspan class=\"lp-pill\">처음\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 Ray Charles의 인생을 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">순서\u003c/b>대로 설명해요. 처음에 그가 어떤 음악가인지 알려 주고, 어린 시절과 활동, 성공을 차례로 보여 줘요. 그래서 \u003cb class=\"key\">중심 \u003c/b>\u003cb class=\"key\">문장\u003c/b>이 맨 처음에 나오는 글이에요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>But (6)\u003c/b>\u003cspan>반대 내용 알려 줌\u003c/span>\u003cb>In 1947 (8)\u003c/b>\u003cspan>시간 알려 줌\u003c/span>\u003cb>At first (9)\u003c/b>\u003cspan>처음 모습 알려 줌\u003c/span>\u003cb>Then (10)\u003c/b>\u003cspan>순서 알려 줌\u003c/span>\u003cb>because (11)\u003c/b>\u003cspan>이유 알려 줌\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">musician\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Charles\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the Genius\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 인물의 이야기를 시간 순서대로 설명하는 글이에요. 처음에 Ray Charles가 어떤 음악가인지 알려 주고, 어린 시절과 활동, 성공을 차례로 보여 줘요. 그래서 중심 문장이 처음에 나오는 글이에요.","hl":"ty"},{"n":9,"text":"글의 길잡이 말을 잘 찾아보세요. 여섯 번째 문장의 But은 앞 내용과 반대되는 이야기를 시작해요. 아홉 번째 문장의 At first와 열 번째 문장의 Then은 시간이 흘러간다는 것을 알려 주죠. 또 같은 사람을 Ray Charles, Charles, the Genius처럼 다르게 부르기도 해요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 단어\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>musician\u003c/b>\u003cem>명사\u003c/em>\u003cspan>음악가\u003c/span>\u003c/div>\u003cdiv>\u003cb>famous\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>유명한\u003c/span>\u003c/div>\u003cdiv>\u003cb>unique\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>독특한\u003c/span>\u003c/div>\u003cdiv>\u003cb>style\u003c/b>\u003cem>명사\u003c/em>\u003cspan>방식, 스타일\u003c/span>\u003c/div>\u003cdiv>\u003cb>mix\u003c/b>\u003cem>동사\u003c/em>\u003cspan>섞다\u003c/span>\u003c/div>\u003cdiv>\u003cb>create\u003c/b>\u003cem>동사\u003c/em>\u003cspan>만들어 내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>own\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>자신만의\u003c/span>\u003c/div>\u003cdiv>\u003cb>soul music\u003c/b>\u003cem>명사\u003c/em>\u003cspan>솔 뮤직\u003c/span>\u003c/div>\u003cdiv>\u003cb>lose\u003c/b>\u003cem>동사\u003c/em>\u003cspan>잃다\u003c/span>\u003c/div>\u003cdiv>\u003cb>sight\u003c/b>\u003cem>명사\u003c/em>\u003cspan>시력\u003c/span>\u003c/div>\u003cdiv>\u003cb>blind\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>눈이 먼\u003c/span>\u003c/div>\u003cdiv>\u003cb>special\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>특별한, 특수의\u003c/span>\u003c/div>\u003cdiv>\u003cb>organ\u003c/b>\u003cem>명사\u003c/em>\u003cspan>오르간\u003c/span>\u003c/div>\u003cdiv>\u003cb>trumpet\u003c/b>\u003cem>명사\u003c/em>\u003cspan>트럼펫\u003c/span>\u003c/div>\u003cdiv>\u003cb>move\u003c/b>\u003cem>동사\u003c/em>\u003cspan>이사하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>perform\u003c/b>\u003cem>동사\u003c/em>\u003cspan>연주하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>similar\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>비슷한\u003c/span>\u003c/div>\u003cdiv>\u003cb>blend\u003c/b>\u003cem>동사\u003c/em>\u003cspan>섞다\u003c/span>\u003c/div>\u003cdiv>\u003cb>success\u003c/b>\u003cem>명사\u003c/em>\u003cspan>성공\u003c/span>\u003c/div>\u003cdiv>\u003cb>genius\u003c/b>\u003cem>명사\u003c/em>\u003cspan>천재\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"오늘의 단어도 소리 내어 읽어 볼게요. musician은 음악가, famous는 유명한, unique는 독특한이라는 뜻이에요. blend는 섞다, success는 성공이라는 뜻이죠. 크게 따라 읽어 봐요. musician, famous, unique!","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">famous\u003c/b>\u003cspan class=\"m\">유명한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">well-known\u003c/span>\u003cspan class=\"s\">popular\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unknown\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">unique\u003c/b>\u003cspan class=\"m\">독특한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">special\u003c/span>\u003cspan class=\"s\">different\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">common\u003c/span>\u003cspan class=\"a\">usual\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">mix\u003c/b>\u003cspan class=\"m\">섞다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">blend\u003c/span>\u003cspan class=\"s\">put together\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">separate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">similar\u003c/b>\u003cspan class=\"m\">비슷한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">alike\u003c/span>\u003cspan class=\"s\">the same\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">different\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">success\u003c/b>\u003cspan class=\"m\">성공\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">good result\u003c/span>\u003cspan class=\"s\">win\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">failure\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"비슷한 말과 반대말도 정리해 볼게요. famous는 well-known이나 popular와 비슷하고 unknown과는 반대예요. unique는 special, different와 비슷하고 common과는 반대예요. mix는 blend와 비슷하고 separate와는 반대랍니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 12\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">레이 찰스는 ~였어요\u003c/span>\u003cspan class=\"en\">Ray Charles \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">음악가\u003c/span>\u003cspan class=\"en\">a musician.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Ray Charles는 음악가였습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 레이 찰스가 어떤 사람인지 알려 주는 \u003cb class=\"key\">첫 \u003c/b>\u003cb class=\"key\">문장\u003c/b>이에요. 그가 \u003cb class=\"key\">음악가\u003c/b>였다는 것을 소개하며 글을 시작해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사 지난 일 말(be동사 과거형)\u003c/span> : 누가(Ray Charles) + 이었다(was) + 무엇이(a musician) : \"~이었다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Ray Charles was, 레이 찰스는 ~였어요. a musician, 음악가. 이 문장 전체를 해석하면, Ray Charles는 음악가였습니다.","hl":"m"},{"n":13,"text":"이 문장은 레이 찰스가 어떤 사람인지 알려 주는 첫 문장이에요. 그는 음악가였어요.","hl":"mn"},{"n":14,"text":"여기서 was는 be동사의 지난 일 말이에요. 지금 이야기면 is를 쓰지만, 옛날 이야기라서 was를 썼어요. 누가 이었다, 이렇게 기억해 두면 좋아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 유명했어요\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was\u003c/span> famous\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 독특한 ~로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for\u003c/span> his unique\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">연주 방식\u003c/span>\u003cspan class=\"en\">playing style.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 독특한 연주 방식으로 유명했어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 레이 찰스가 \u003cb class=\"key\">왜 \u003c/b>\u003cb class=\"key\">유명한지\u003c/b> 알려 주는 문장이에요. 그의 \u003cb class=\"key\">독특한 \u003c/b>\u003cb class=\"key\">연주 \u003c/b>\u003cb class=\"key\">방식\u003c/b>이 인기의 이유라고 말해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사 지난 일 말(be동사 과거형)\u003c/span> : 누가(He) + 이었다(was) + 어떤 상태(famous) : \"~였다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소·시간 짝꿍 말(전치사)\u003c/span> : 유명하다(famous) + ~로(for) + 무엇 때문에 : \"~로, ~때문에\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"He was famous, 그는 유명했어요. for his unique, 그의 독특한 ~로. playing style, 연주 방식. 이 문장 전체를 해석하면, 그는 독특한 연주 방식으로 유명했어요.","hl":"m"},{"n":16,"text":"이 문장은 레이 찰스가 왜 유명한지 알려 줘요. 바로 그의 독특한 연주 방식 때문이었어요.","hl":"mn"},{"n":17,"text":"먼저 was는 be동사의 지난 일 말이에요. 그리고 famous for는 ~로 유명하다라는 덩어리 표현이에요. for는 ~로, ~때문에라고 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 12\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 섞었어요\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">mixed\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다양한 종류의 음악을\u003c/span>\u003cspan class=\"en\">different kinds of music\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 만들어 냈어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and\u003c/span> created\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신만의 음악을\u003c/span>\u003cspan class=\"en\">his own.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 다양한 종류의 음악을 섞어서 자신만의 음악을 만들어 냈습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 레이 찰스가 여러 음악을 섞어 \u003cb class=\"key\">자신만의 \u003c/b>\u003cb class=\"key\">음악\u003c/b>을 만들었다는 뜻이에요. 이 글의 \u003cb class=\"key\">핵심\u003c/b>이 되는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(He) + 했다(mixed) + 무엇을(different kinds of music) : \"섞었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 섞었다(mixed) + 그리고(and) + 만들었다(created) : \"그리고\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"He mixed, 그는 섞었어요. different kinds of music, 다양한 종류의 음악을. and created, 그리고 만들어 냈어요. his own, 자신만의 음악을. 이 문장 전체를 해석하면, 그는 다양한 종류의 음악을 섞어서 자신만의 음악을 만들어 냈습니다.","hl":"m"},{"n":19,"text":"이 문장은 레이 찰스가 다양한 종류의 음악을 섞어서 자신만의 음악을 만들었다는 뜻이에요. 이 글의 핵심이 되는 문장이에요.","hl":"mn"},{"n":20,"text":"먼저 mixed와 created는 지난 일을 말하는 과거형이에요. 동사 뒤에 -ed를 붙였죠. 그리고 and는 두 가지 한 일을 이어 주는 말이에요. 섞었다, 그리고 만들었다, 이렇게 연결해요. 여러분도 and로 두 가지를 멋지게 이어 봐요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 ~이었어요\u003c/span>\u003cspan class=\"en\">It \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새로운 종류\u003c/span>\u003cspan class=\"en\">a new kind\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">음악의\u003c/span>\u003cspan class=\"en\">of music:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">솔 뮤직\u003c/span>\u003cspan class=\"en\">soul music.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 솔 뮤직이라는 새로운 종류의 음악이었어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 레이가 만든 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">음악\u003c/b>이 바로 \u003cb class=\"key\">솔 \u003c/b>\u003cb class=\"key\">뮤직\u003c/b>이라고 알려 줘요. 글의 \u003cb class=\"key\">중심\u003c/b> 내용으로 이어지는 중요한 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사 과거형(was)\u003c/span> : 주어(It) + 이었다(was) + 보어(a new kind of music) : \"~이었어요\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"It was, 그것은 ~이었어요. a new kind, 새로운 종류. of music, 음악의. soul music, 솔 뮤직. 이 문장 전체를 해석하면, 그것은 솔 뮤직이라는 새로운 종류의 음악이었어요.","hl":"m"},{"n":22,"text":"이 문장은 레이가 만든 새로운 음악이 바로 솔 뮤직이라고 알려 줘요. 글의 중심 내용으로 이어지는 중요한 문장이에요.","hl":"mn"},{"n":23,"text":"여기서 was는 be동사의 과거형이에요. 지난 일을 말할 때 이었다라고 해요. It was는 그것은 이었어요라고 해석하면 자연스러워요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 칠 수 있었어요\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">could \u003c/span>\u003cspan class=\"tgt\">play\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">피아노를\u003c/span>\u003cspan class=\"en\">the piano\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그가 다섯 살이 되기 전에\u003c/span>\u003cspan class=\"en\">before he was five.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 다섯 살이 되기 전에 피아노를 칠 수 있었어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 레이가 \u003cb class=\"key\">다섯 \u003c/b>\u003cb class=\"key\">살\u003c/b>이 되기 전에 이미 \u003cb class=\"key\">피아노\u003c/b>를 칠 수 있었다는 뜻이에요. 어린 나이부터 \u003cb class=\"key\">음악 \u003c/b>\u003cb class=\"key\">재능\u003c/b>이 뛰어났다는 걸 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">할 수 있었다(조동사 can의 과거)\u003c/span> : 누가(He) + 할 수 있었다(could) + 하다(play) + 무엇을(the piano) : \"칠 수 있었어요\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"He could play, 그는 칠 수 있었어요. the piano, 피아노를. before he was five, 그가 다섯 살이 되기 전에. 이 문장 전체를 해석하면, 그는 다섯 살이 되기 전에 피아노를 칠 수 있었어요.","hl":"m"},{"n":25,"text":"레이가 다섯 살이 되기 전에 이미 피아노를 칠 수 있었다는 뜻이에요. 어린 나이부터 음악 재능이 뛰어났다는 걸 보여 줘요.","hl":"mn"},{"n":26,"text":"여기서 could는 can의 과거형이에요. 그래서 할 수 있었다라는 뜻이 돼요. He could play the piano는 그는 피아노를 칠 수 있었어요라고 해석해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 그는\u003c/span>\u003cspan class=\"en\">But he\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">잃기 시작했어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">started \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">lose\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 시력을\u003c/span>\u003cspan class=\"en\">his sight\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 눈이 멀었어요\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">blind\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 나이쯤에\u003c/span>\u003cspan class=\"en\">by the age\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일곱 살의\u003c/span>\u003cspan class=\"en\">of seven.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 그는 시력을 잃어가기 시작했고 일곱 살 때 눈이 멀었어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 레이가 \u003cb class=\"key\">시력\u003c/b>을 잃어 \u003cb class=\"key\">일곱 \u003c/b>\u003cb class=\"key\">살\u003c/b> 때 \u003cb class=\"key\">눈이 \u003c/b>\u003cb class=\"key\">멀\u003c/b>었다는 뜻이에요. 앞의 재능 이야기와 달리 힘든 일을 겪었다는 걸 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to + 동사원형(to부정사)\u003c/span> : 누가(he) + 시작했다(started) + 하기를(to lose) : \"잃기 시작했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be동사 과거형(was) + 형용사(blind)\u003c/span> : 누가(he) + ~였다(was) + 눈이 먼(blind) : \"눈이 멀었어요\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"But he, 하지만 그는. started to lose, 잃기 시작했어요. his sight, 그의 시력을. and was blind, 그리고 눈이 멀었어요. by the age, 그 나이쯤에. of seven, 일곱 살의. 이 문장 전체를 해석하면, 하지만 그는 시력을 잃어가기 시작했고 일곱 살 때 눈이 멀었어요.","hl":"m"},{"n":28,"text":"레이가 시력을 잃어 일곱 살 때 눈이 멀었다는 뜻이에요. 앞의 재능 이야기와 달리 힘든 일을 겪었다는 걸 보여 줘요.","hl":"mn"},{"n":29,"text":"먼저 started to lose는 동사원형을 써서 잃기 시작했다는 뜻을 만들어요. 다음으로 was는 be동사의 과거형이에요. 그래서 was blind는 눈이 먼 상태였다는 말이 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 갔어요\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">went\u003c/span> to\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">특수학교에\u003c/span>\u003cspan class=\"en\">a special school\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 배웠어요 연주하는 법을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">learned\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">play\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오르간과 트럼펫을 거기서\u003c/span>\u003cspan class=\"en\">the organ and trumpet there.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 특수학교에 다니면서 오르간과 트럼펫을 연주하는 법을 배웠어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 그가 다닌 \u003cb class=\"key\">특수학교\u003c/b>에서 오르간과 트럼펫 연주를 배웠다는 말이에요. 어린 레이 찰스가 학교에서 \u003cb class=\"key\">음악\u003c/b>을 익혔다는 것을 알려 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거형(과거 시제)\u003c/span> : 누가(He) + 갔다(went) + 어디로(to a special school) : \"갔어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 한 일(went) + 그리고(and) + 한 일(learned) : \"그리고 배웠어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to + 동사원형(to부정사)\u003c/span> : 배웠다(learned) + 무엇을(to play) : \"연주하는 것을\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"He went to, 그는 갔어요. a special school, 특수학교에. and learned to play, 그리고 배웠어요 연주하는 법을. the organ and trumpet there, 오르간과 트럼펫을 거기서. 이 문장 전체를 해석하면, 그는 특수학교에 다니면서 오르간과 트럼펫을 연주하는 법을 배웠어요.","hl":"m"},{"n":31,"text":"이 문장은 레이 찰스가 특수학교에서 오르간과 트럼펫을 배웠다는 뜻이에요. 어린 시절 학교에서 음악을 익혔다고 기억해 두면 좋아요.","hl":"mn"},{"n":32,"text":"먼저 went는 과거형이에요. 이미 지난 일이라 go가 went로 바뀐 거죠. 두 번째로 and는 두 가지 한 일을 이어 주는 말이에요. 세 번째로 learned to play에는 to부정사가 들어 있어서 연주하는 법을 배웠다는 뜻이 된답니다. 그리고 learned to play는 통째로 외우면 좋은 덩어리예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1947년에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">In \u003c/span>\u003cspan class=\"tgt\">1947,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 시애틀로 이사했어요\u003c/span>\u003cspan class=\"en\">he \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">moved\u003c/span> to Seattle\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 연주했어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">performed\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">밴드에서\u003c/span>\u003cspan class=\"en\">in bands.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">1947년, 그는 시애틀로 건너가 밴드에서 연주를 했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 1947년에 시애틀로 \u003cb class=\"key\">이사\u003c/b>해서 밴드에서 연주를 했다는 뜻이에요. 그가 \u003cb class=\"key\">음악 \u003c/b>\u003cb class=\"key\">활동\u003c/b>을 본격적으로 시작한 때를 알려 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">때를 알려 주는 말(시간 전치사)\u003c/span> : 때(In) + 1947년(1947) : \"1947년에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거형(과거 시제)\u003c/span> : 누가(he) + 이사했다(moved) + 어디로(to Seattle) : \"이사했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 이사했다(moved) + 그리고(and) + 연주했다(performed) : \"그리고 연주했어요\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"In 1947, 1947년에. he moved to Seattle, 그는 시애틀로 이사했어요. and performed, 그리고 연주했어요. in bands, 밴드에서. 이 문장 전체를 해석하면, 1947년, 그는 시애틀로 건너가 밴드에서 연주를 했습니다.","hl":"m"},{"n":34,"text":"이 문장은 1947년에 시애틀로 이사해서 밴드에서 연주를 했다는 뜻이에요. 그가 음악 활동을 본격적으로 시작한 때를 알려 주는 문장이에요.","hl":"mn"},{"n":35,"text":"첫 번째로 In 1947은 언제인지 알려 주는 전치사 In이 들어간 말이에요. 두 번째로 moved는 과거형이라 지난 일이라는 걸 알 수 있죠. 세 번째로 and는 이사했다와 연주했다, 두 가지 일을 이어 주는 말이랍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">처음에\u003c/span>\u003cspan class=\"en\">At first,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 연주 방식은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">his\u003c/span> playing style\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">비슷했어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">was\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">similar \u003c/span>\u003cspan class=\"tgt\">to\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 음악가들과\u003c/span>\u003cspan class=\"en\">other musicians.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">처음에, 그의 연주 방식은 다른 음악가들과 비슷했어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 처음에는 그의 연주 방식이 다른 음악가들과 비슷했다는 뜻이에요. 그가 처음부터 \u003cb class=\"key\">독특\u003c/b>하지는 않았다는 것을 보여 주고, 뒤에 나오는 '자기만의 스타일'과 \u003cb class=\"key\">비교\u003c/b>되는 부분이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">소유격(소유격 대명사)\u003c/span> : 누구의(his) + 무엇(playing style) : \"그의\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be동사(be동사 과거형)\u003c/span> : 주어(his playing style) + 이었다(was) + 설명(similar) : \"이었어요, 였어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">비슷하다 덩어리(형용사 + 전치사)\u003c/span> : 비슷했다(was similar) + 무엇과(to other musicians) : \"다른 음악가들과 비슷했어요\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"At first, 처음에. his playing style, 그의 연주 방식은. was similar to, 비슷했어요. other musicians, 다른 음악가들과. 이 문장 전체를 해석하면, 처음에, 그의 연주 방식은 다른 음악가들과 비슷했어요.","hl":"m"},{"n":37,"text":"이 문장은 처음에는 그의 연주 방식이 다른 음악가들과 비슷했다는 뜻이에요. 처음부터 독특하지는 않았다는 점, 그리고 뒤에 나오는 자기만의 스타일과 비교되는 부분이라는 점을 기억해요.","hl":"mn"},{"n":38,"text":"먼저 his는 '그의'라는 뜻으로 뒤에 오는 명사를 꾸며 줘요. 두 번째로 was는 지난 상태를 말하는 be동사의 과거형이에요. 세 번째로 similar to는 통째로 외우면 좋은 덩어리로, 다른 음악가들과 비슷했다는 뜻이 되죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 후 그는 계속해서\u003c/span>\u003cspan class=\"en\">Then he \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">kept \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다양한 방식을 섞기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">blending\u003c/span> different styles\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 자신만의 방식을 만들어 냈습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">created\u003c/span> his own.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 후 그는 계속해서 다양한 방식을 섞어 자신만의 방식을 만들어 냈습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Ray Charles가 여러 방식을 \u003cb class=\"key\">계속\u003c/b> 섞어 \u003cb class=\"key\">자신만의 \u003c/b>\u003cb class=\"key\">방식\u003c/b>을 만들었다는 것을 알려 줘요. 앞 문장에서 다른 음악가와 비슷했던 것과 반대되는, 아주 중요한 내용이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사-ing(동명사)\u003c/span> : 누가(he) + 계속했다(kept) + 섞기를(blending) : \"섞기를 계속했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 섞었어요(blending) + 그리고(and) + 만들었어요(created) : \"그리고 만들어 냈어요\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"Then he kept, 그 후 그는 계속해서. blending different styles, 다양한 방식을 섞기를. and created his own, 그리고 자신만의 방식을 만들어 냈습니다. 이 문장 전체를 해석하면, 그 후 그는 계속해서 다양한 방식을 섞어 자신만의 방식을 만들어 냈습니다.","hl":"m"},{"n":40,"text":"이 문장은 Ray Charles가 여러 방식을 계속 섞어서 자신만의 방식을 만들었다는 이야기예요. 앞에서는 다른 음악가와 비슷했다고 했죠? 그런데 여기서는 달라졌어요.","hl":"mn"},{"n":41,"text":"첫 번째, kept blending을 볼까요? keep 뒤에 동사-ing가 오면 계속해서 그 일을 한다는 뜻이에요. 그래서 섞는 일을 계속했다는 말이 돼요. 두 번째, and는 섞었다와 만들었다, 두 가지 일을 이어 주는 이어 주는 말이에요. 마지막으로 his own은 자신만의 방식을 가리킨다는 것도 기억해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 노래의 대부분이\u003c/span>\u003cspan class=\"en\">Most of his songs\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">큰 성공이 되었어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">became\u003c/span> a big success\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜냐하면 그는 절대 일하지 않았기 때문이에요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">because\u003c/span> he \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">never\u003c/span> worked\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">딱 한 가지 방식으로만\u003c/span>\u003cspan class=\"en\">in just one style.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그의 노래의 대부분이 큰 성공을 거두었는데, 이는 그가 절대 한 가지 방식으로만 작업하지 않았기 때문입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 노래들이 \u003cb class=\"key\">큰 \u003c/b>\u003cb class=\"key\">성공\u003c/b>을 거둔 까닭은 그가 \u003cb class=\"key\">한 \u003c/b>\u003cb class=\"key\">가지 \u003c/b>\u003cb class=\"key\">방식\u003c/b>에만 머물지 않았기 때문이라는 거예요. 이 글의 \u003cb class=\"key\">중심\u003c/b> 생각을 알려 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거형(과거형)\u003c/span> : 노래들이(songs) + 되었다(became) : \"되었어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 결과 + because + 이유 : \"왜냐하면 ~때문에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">더 자세히 알려 주는 말(부사)\u003c/span> : 그는(he) + 절대(never) + 일했다(worked) : \"절대 ~않다\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"Most of his songs, 그의 노래의 대부분이. became a big success, 큰 성공이 되었어요. because he never worked, 왜냐하면 그는 절대 일하지 않았기 때문이에요. in just one style, 딱 한 가지 방식으로만. 이 문장 전체를 해석하면, 그의 노래의 대부분이 큰 성공을 거두었는데, 이는 그가 절대 한 가지 방식으로만 작업하지 않았기 때문입니다.","hl":"m"},{"n":43,"text":"이 문장은 이 글의 중심 생각을 담고 있어요. 노래가 큰 성공을 거둔 까닭은 딱 한 가지 방식에만 머물지 않았기 때문이에요.","hl":"mn"},{"n":44,"text":"첫 번째, became은 become의 과거형이에요. 지난 일이라서 과거형으로 썼어요. 두 번째, because는 이유를 알려 주는 이어 주는 말이에요. 결과가 왜 생겼는지 뒤에서 설명해 주죠. 세 번째, never는 동사 앞에서 절대 그렇게 하지 않았다는 뜻을 더해 주는 부사예요. 이 세 가지를 꼭 받아 적어 봐요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 음악가들은\u003c/span>\u003cspan class=\"en\">Other \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">musicians\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Charles를 불렀어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">called \u003c/span>\u003cspan class=\"tgt\">Charles \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">천재라고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">Genius\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">다른 음악가들은 Charles를 천재라고 불렀어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 다른 음악가들이 Charles를 \u003cb class=\"key\">천재\u003c/b>라고 불렀다는 말이에요. 글의 마지막에서 그를 \u003cb class=\"key\">칭찬\u003c/b>하며 멋지게 마무리하는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">단수·복수(복수 명사)\u003c/span> : 여러 명이면 (musicians) + 동사는 그대로(called) : \"음악가들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">보충하는 말(보어)\u003c/span> : 불렀어요(called) + Charles를 + 천재라고(the Genius) : \"Charles를 천재라고 불렀어요\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"Other musicians, 다른 음악가들은. called Charles, Charles를 불렀어요. the Genius, 천재라고. 이 문장 전체를 해석하면, 다른 음악가들은 Charles를 천재라고 불렀어요.","hl":"m"},{"n":46,"text":"마지막 문장이에요. 다른 음악가들이 Charles를 천재라고 불렀대요. 글이 그의 재능을 칭찬하면서 끝나는 거예요.","hl":"mn"},{"n":47,"text":"첫 번째, call은 누구를 무엇이라고 부르다라는 뜻이에요. Charles만 있으면 뜻이 부족해서 천재라는 말이 보어로 뒤에서 도와줘요. 두 번째, musicians에는 -s가 붙었죠? 음악가가 여러 명이라서 복수로 쓴 거예요. 여러분도 오늘 배운 문장을 소리 내어 읽으며 멋진 마무리까지 해 봐요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">오늘 배운 내용 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>Ray Charles는 \u003cb class=\"key\">독특한 \u003c/b>\u003cb class=\"key\">연주 \u003c/b>\u003cb class=\"key\">방식\u003c/b>으로 유명한 음악가였어요.\u003c/li>\u003cli>그는 여러 음악을 \u003cb class=\"key\">섞어서\u003c/b> \u003cb class=\"key\">솔 \u003c/b>\u003cb class=\"key\">뮤직\u003c/b>을 만들었어요.\u003c/li>\u003cli>일곱 살에 \u003cb class=\"key\">눈이 \u003c/b>\u003cb class=\"key\">멀었지만\u003c/b> 특수학교에서 오르간과 트럼펫을 배웠어요.\u003c/li>\u003cli>계속 여러 방식을 섞어 \u003cb class=\"key\">큰 \u003c/b>\u003cb class=\"key\">성공\u003c/b>을 거두고 \u003cb class=\"key\">천재\u003c/b>라는 별명을 얻었어요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Ray Charles became a famous musician by mixing different kinds of music into his own style, soul music.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">Ray Charles는 여러 종류의 음악을 섞어 \u003cb class=\"key\">솔 \u003c/b>\u003cb class=\"key\">뮤직\u003c/b>을 만든 음악가예요. 눈이 멀었지만 \u003cb class=\"key\">자신만의 \u003c/b>\u003cb class=\"key\">연주 \u003c/b>\u003cb class=\"key\">방식\u003c/b>으로 큰 성공을 거두고 '천재'라는 별명을 얻었어요.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":48,"text":"오늘 우리는 Ray Charles가 여러 음악을 섞어 자신만의 솔 뮤직을 만든 이야기를 배웠어요. 어려움 속에서도 포기하지 않고 자신만의 방식을 만든 점이 정말 멋지죠. 여러분도 오늘 배운 단어와 문장을 소리 내어 다시 읽어 보세요. 정말 잘했어요, 다음 시간에 또 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
