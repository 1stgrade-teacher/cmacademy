</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"왓츠 리딩 100B Ch.4 Unit 02 Thankful Trees","audioDir":"reading02_audio","preview":false,"count":43,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.425em\">Ch.4 Unit\u003cbr>02 Thankful\u003cbr>Trees\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">왓츠 리딩 100B\u003c/div>\u003ch1>Thankful Trees: Trees That Give Us Many Things\u003c/h1>\u003ch2>고마운 나무들: 우리에게 많은 것을 주는 나무\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">한 줄 요약\u003c/span>\u003cspan>나무는 우리에게 \u003cb class=\"key\">수액\u003c/b>과 \u003cb class=\"key\">약\u003c/b>을 주는 고마운 존재예요. 수액으로 고무와 메이플 시럽을 만들고, 나무껍질과 잎으로 열과 상처, 복통을 낫게 하는 차를 만들어요.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Trees give us many things, like sap for rubber and maple syrup, and medicine for our bodies.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘도 만나서 정말 반가워요. 오늘은 나무가 우리에게 무엇을 주는지 알려 주는 글을 읽어 볼 거예요. 제목은 Thankful Trees, 고마운 나무들이라는 뜻이랍니다. 나무는 우리에게 수액과 약을 준다고 해요. 같이 읽어 볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">미리 알면 쉬워요\u003c/span>\u003cdiv class=\"lp-box\">『아낌없이 주는 나무』라는 책을 아나요? 영어 제목은 The Giving Tree인데, 책 속 나무는 소년에게 그늘도, 사과도, 마지막에는 나무 기둥까지 다 줘요. 실제로도 나무는 우리에게 많은 것을 줘요. 나무에서 나오는 물 같은 것을 \u003cb class=\"key\">수액\u003c/b>이라고 하고, 영어로는 sap이라고 해요. 여러분이 아침에 팬케이크에 발라 먹는 달콤한 시럽도 바로 나무 수액에서 나온 것이랍니다.\u003c/div>","segs":[{"n":2,"text":"여러분, The Giving Tree라는 책을 들어 본 적 있나요? 아낌없이 주는 나무라는 뜻이에요. 그 책에서 나무는 소년에게 그늘도 주고 사과도 주고 마지막에는 나무 기둥까지 다 줘요. 실제로도 나무는 우리에게 아주 많은 것을 줘요. 나무에서 나오는 물 같은 것을 tree sap, 그러니까 나무 수액이라고 해요. 여러분은 팬케이크에 달콤한 메이플 시럽을 발라 먹어 본 적 있나요?","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>책 속 주는 나무\u003csmall>소개 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>『아낌없이 주는 나무』는 1964년에 나온 책이에요. 오늘날에도 많은 사람이 이 책을 좋아해요. 그 책에서 \u003cb class=\"key\">나무\u003c/b>는 소년에게 \u003cb class=\"key\">모든 \u003c/b>\u003cb class=\"key\">것\u003c/b>을 주지요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>우리 주변의 나무\u003csmall>바뀜 · 문장 3\u003c/small>\u003c/h4>\u003cp>그런데 이런 나무는 책에만 있지 않아요. 실제 생활에서도 우리는 주변에서 \u003cb class=\"key\">주는 \u003c/b>\u003cb class=\"key\">나무\u003c/b>를 찾을 수 있어요. 이제 진짜 나무들이 무엇을 주는지 알아볼까요?\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>수액이 주는 것\u003csmall>예시 · 문장 4–7\u003c/small>\u003c/h4>\u003cp>나무의 \u003cb class=\"key\">수액\u003c/b>으로 우리는 많은 것들을 만들어요. 예를 들어 고무는 고무나무의 \u003cb class=\"key\">흰 \u003c/b>\u003cb class=\"key\">수액\u003c/b>으로 만들어지고, 메이플 시럽은 단풍나무 수액으로 만들어져요. 많은 사람이 메이플 시럽을 즐기는 까닭은 \u003cb class=\"key\">맛있기\u003c/b> 때문이에요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>약이 되는 나무\u003csmall>마무리 · 문장 8–11\u003c/small>\u003c/h4>\u003cp>어떤 나무들은 우리에게 \u003cb class=\"key\">약\u003c/b>을 줘요. 오리나무의 잎과 나무껍질로 만든 차는 \u003cb class=\"key\">열과 \u003c/b>\u003cb class=\"key\">상처\u003c/b>를 치료하는 데 도움이 돼요. 배가 아플 때는 느릅나무의 \u003cb class=\"key\">나무껍질\u003c/b>이 도움이 될 수 있답니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 책 속 나무에서 시작해서 실제 생활 속 나무로 넘어가고, 나무가 주는 것들을 예로 들어 설명해요.","hl":null},{"n":4,"text":"먼저 첫 번째 단계에서는 책 이야기가 나와요. The Giving Tree는 아주 오래전에 나왔지만 오늘날에도 사람들이 좋아하는 책이에요. 그 책에서 나무는 소년에게 모든 것을 줘요.","hl":"f0"},{"n":5,"text":"두 번째 단계에서 글은 실제 생활로 넘어가요. In real life, we can find giving trees around us. 실제 생활에서도 우리 주변에서 주는 나무를 찾을 수 있다는 뜻이에요. 책 속 이야기만이 아니라는 거죠.","hl":"f1"},{"n":6,"text":"세 번째 단계는 수액 이야기예요. 나무의 수액으로 우리는 많은 것들을 만들어요. 예를 들어 고무는 고무나무의 흰 수액으로 만들어지고, 메이플 시럽은 단풍나무 수액으로 만들어져요. 사람들이 메이플 시럽을 좋아하는 까닭은 맛있기 때문이에요.","hl":"f2"},{"n":7,"text":"네 번째 단계에서는 약이 되는 나무를 알려 줘요. 어떤 나무들은 우리에게 약을 줘요. 오리나무의 잎과 나무껍질로 만든 차는 열과 상처를 치료하는 데 도움이 돼요. 그리고 배가 아플 때는 느릅나무의 나무껍질이 도움이 될 수 있답니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">설명하기\u003c/span>\u003cspan class=\"lp-pill\">처음\u003c/span>\u003cspan class=\"lp-pill\">주제문 3번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 처음에 책 이야기로 흥미를 끌고, \u003cb class=\"key\">중심 \u003c/b>\u003cb class=\"key\">문장\u003c/b>에서 실생활의 나무를 소개해요. 그 뒤로 고무, 메이플 시럽, 약처럼 \u003cb class=\"key\">예시\u003c/b>를 차례로 보여 주는 글이에요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>but (1)\u003c/b>\u003cspan>반대 내용을 알려 줌\u003c/span>\u003cb>In real life (3)\u003c/b>\u003cspan>화제를 바꿔 줌\u003c/span>\u003cb>For example (5)\u003c/b>\u003cspan>예시를 알려 줌\u003c/span>\u003cb>because (7)\u003c/b>\u003cspan>이유를 알려 줌\u003c/span>\u003cb>When (11)\u003c/b>\u003cspan>때를 알려 줌\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">The Giving Tree\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">giving trees\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">rubber trees\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">maple tree\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">alder trees\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">elm trees\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 처음에 책 이야기로 흥미를 끌고, 중심 문장에서 실생활의 나무를 소개해요. 그 뒤로 고무, 메이플 시럽, 약처럼 예시를 차례로 보여 주는 글이에요.","hl":"ty"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 단어\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>come out\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>출간되다, 나오다\u003c/span>\u003c/div>\u003cdiv>\u003cb>still\u003c/b>\u003cem>부사\u003c/em>\u003cspan>여전히\u003c/span>\u003c/div>\u003cdiv>\u003cb>everything\u003c/b>\u003cem>대명사\u003c/em>\u003cspan>모든 것\u003c/span>\u003c/div>\u003cdiv>\u003cb>real life\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>실생활, c/b>\u003cspan class=\"m\">사랑하다, 좋아하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">like\u003c/span>\u003cspan class=\"s\">enjoy\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">make\u003c/b>\u003cspan class=\"m\">만들다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">create\u003c/span>\u003cspan class=\"s\">build\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">break\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">many\u003c/b>\u003cspan class=\"m\">많은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">a lot of\u003c/span>\u003cspan class=\"s\">lots of\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">few\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">delicious\u003c/b>\u003cspan class=\"m\">맛있는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">tasty\u003c/span>\u003cspan class=\"s\">yummy\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">awful\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">help\u003c/b>\u003cspan class=\"m\">돕다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">aid\u003c/span>\u003cspan class=\"s\">support\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hurt\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">『아낌없이 주는 나무』는\u003c/span>\u003cspan class=\"en\">The Giving Tree\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1964년에 출간되었어요,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">came \u003c/span>\u003cspan class=\"tgt\">out\u003c/span> in 1964,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그런데 사람들은 여전히\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">but\u003c/span> people still\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오늘날에도 그 책을 좋아해요.\u003c/span>\u003cspan class=\"en\">love it today.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">『아낌없이 주는 나무』는 1964년에 출간되었지만 오늘날에도 여전히 사람들은 그 책을 좋아해요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 『아낌없이 주는 나무』라는 책이 \u003cb class=\"key\">오래전\u003c/b>에 나왔는데도 지금도 사람들에게 \u003cb class=\"key\">사랑받는다\u003c/b>는 걸 알려 줘요. 글을 시작하며 책을 소개하는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(The book) + 했다(came out) + 언제(in 1964) : \"1964년에 나왔어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 앞말 + but + 뒷말 : \"그런데, 하지만\"\u003c/div>\u003c/div>","segs":[{"n":10,"text":"The Giving Tree, 『아낌없이 주는 나무』는. came out in 1964, 1964년에 출간되었어요. but people still, 그런데 사람들은 여전히. love it today, 오늘날에도 그 책을 좋아해요.. 이 문장 전체를 해석하면, 『아낌없이 주는 나무』는 1964년에 출간되었지만 오늘날에도 여전히 사람들은 그 책을 좋아해요.","hl":"m"},{"n":11,"text":"이 문장은 책이 오래전에 나왔는데도 지금도 사랑받는다는 걸 알려 주는 소개 문장이에요.","hl":"mn"},{"n":12,"text":"첫 번째, came out은 지난 일을 말하는 과거형이에요. come의 과거형이 came이라고 기억해 두세요. 두 번째, but은 이어 주는 말로 앞과 뒤를 반대로 이어 줘요. 그래서 오래된 책이지만 아직 좋아한다는 뜻이 되죠. 아주 짧은 문장인데도 과거형과 이어 주는 말이 다 들어 있어서 따라 쓰기 참 좋은 문장이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 책에서는,\u003c/span>\u003cspan class=\"en\">In the book,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나무가 줘요\u003c/span>\u003cspan class=\"en\">the tree \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">gives\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">소년에게 모든 것을.\u003c/span>\u003cspan class=\"en\">everything \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">boy\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 책에서 나무는 소년에게 모든 것을 주지요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 책 속의 나무는 소년에게 \u003cb class=\"key\">모든 \u003c/b>\u003cb class=\"key\">것\u003c/b>을 아낌없이 줘요. 앞에서 소개한 책의 \u003cb class=\"key\">내용\u003c/b>을 알려 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">한 사람·한 개일 때 동사 + s(3인칭 단수)\u003c/span> : 누가(The tree) + 준다(gives) + 무엇을(everything) : \"나무가 줘요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">방향을 알려 주는 말(전치사)\u003c/span> : 준다(gives) + 무엇을(everything) + 누구에게(to the boy) : \"소년에게\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"In the book, 그 책에서는. the tree gives, 나무가 줘요. everything to the boy, 소년에게 모든 것을.. 이 문장 전체를 해석하면, 그 책에서 나무는 소년에게 모든 것을 주지요.","hl":"m"},{"n":14,"text":"책 속 나무는 소년에게 모든 것을 다 준다는 뜻이에요. 책 이야기를 알려 주는 문장이죠.","hl":"mn"},{"n":15,"text":"첫 번째, the tree는 한 그루니까 동사에 s를 붙여서 gives라고 해요. 주어가 한 개일 때 동사에 s를 붙인다고 기억해 주세요. 두 번째, 무엇을 주는지 먼저 말하고 to를 붙여서 받는 사람을 뒤에 놓아요. 그래서 everything to the boy, 소년에게 모든 것을, 이렇게 읽으면 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 11\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">실생활에서는,\u003c/span>\u003cspan class=\"en\">In real life,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 찾을 수 있어요\u003c/span>\u003cspan class=\"en\">we \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">find\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 주변에서 주는 나무를.\u003c/span>\u003cspan class=\"en\">giving trees \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">around \u003c/span>\u003cspan class=\"tgt\">us\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">실생활에서, 우리는 우리 주변에서 (아낌없이) 주는 나무를 찾을 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 글의 \u003cb class=\"key\">중심\u003c/b> 문장이에요. 책 속 이야기가 아니라 실제 생활에서도 우리 주변에 \u003cb class=\"key\">주는 \u003c/b>\u003cb class=\"key\">나무\u003c/b>가 있다고 말해요. 뒤에 나오는 나무 이야기들의 \u003cb class=\"key\">시작\u003c/b>이 되는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">도와주는 동사(조동사)\u003c/span> : 누가(we) + 할 수 있다(can) + 찾다(find) : \"찾을 수 있어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소 짝꿍 말(전치사)\u003c/span> : 나무(trees) + 주변에(around) + 우리(us) : \"우리 주변에\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"In real life, 실생활에서는. we can find, 우리는 찾을 수 있어요. giving trees around us, 우리 주변에서 주는 나무를.. 이 문장 전체를 해석하면, 실생활에서, 우리는 우리 주변에서 (아낌없이) 주는 나무를 찾을 수 있어요.","hl":"m"},{"n":17,"text":"책 속 이야기가 아니라 진짜 생활에서도 우리 주변에 주는 나무가 있다는 걸 말해요. 이 글의 중심 문장이죠.","hl":"mn"},{"n":18,"text":"첫 번째, can은 '할 수 있다'는 뜻을 더해 주는 도와주는 동사예요. can 뒤에는 동사원형이 와서 can find, 찾을 수 있어요, 가 돼요. 두 번째, around는 주변이라는 장소를 알려 주는 말이에요. 그래서 around us는 우리 주변에라는 뜻이 되죠. 이 문장은 글의 중심을 알려 주니까 꼭 외워 두면 좋아요. 여러분도 오늘 주변에서 주는 나무를 한 번 찾아볼까요?","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나무 수액으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">With \u003c/span>\u003cspan class=\"tgt\">tree \u003c/span>\u003cspan class=\"tgt\">sap\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 만들 수 있습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">make\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 것들을\u003c/span>\u003cspan class=\"en\">many things.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 나무 수액으로 많은 것들을 만들 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 나무의 \u003cb class=\"key\">수액\u003c/b>으로 우리가 여러 가지 물건을 만들 수 있다고 말해요. 뒤에 나오는 고무와 메이플 시럽 이야기를 꺼내는 \u003cb class=\"key\">도입\u003c/b> 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">장소·재료 짝꿍 말(전치사)\u003c/span> : 만들어요(make) + 무엇으로(with tree sap) : \"나무 수액으로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">도와주는 동사 can(조동사)\u003c/span> : 누가(we) + 할 수 있다(can) + 만들다(make) : \"우리는 만들 수 있어요\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"With tree sap, 나무 수액으로. we can make, 우리는 만들 수 있습니다. many things, 많은 것들을. 이 문장 전체를 해석하면, 우리는 나무 수액으로 많은 것들을 만들 수 있습니다.","hl":"m"},{"n":20,"text":"이 문장은 나무 수액으로 우리가 여러 가지 물건을 만들 수 있다고 말해요. 뒤에 나오는 고무와 메이플 시럽 이야기를 시작하는 문장이랍니다.","hl":"mn"},{"n":21,"text":"첫 번째, With tree sap에서 with는 재료를 알려 주는 짝꿍 말이에요. 두 번째, we can make에서 can은 도와주는 동사예요. can 뒤에는 동사원형 make가 그대로 와요. 세 번째, many things는 셀 수 있는 것 여러 개를 뜻해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 11\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들어,\u003c/span>\u003cspan class=\"en\">For example,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고무는 만들어집니다\u003c/span>\u003cspan class=\"en\">rubber \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">made \u003c/span>\u003cspan class=\"tgt\">from\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">흰 수액으로\u003c/span>\u003cspan class=\"en\">white sap\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고무나무에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">rubber \u003c/span>\u003cspan class=\"tgt\">trees\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">예를 들어, 고무는 고무나무의 흰 수액으로 만들어집니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 고무가 \u003cb class=\"key\">고무나무\u003c/b>의 흰 수액으로 만들어진다는 예를 들어요. 나무 수액으로 무엇을 만드는지 보여 주는 \u003cb class=\"key\">예시\u003c/b> 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">덩어리 표현(~으로 만들어지다)\u003c/span> : 무엇이(rubber) + 만들어져요(is made) + 무엇으로(from white sap) : \"고무는 ~으로 만들어져요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소·재료 짝꿍 말(전치사)\u003c/span> : 만들어져요(is made) + 어디서(from rubber trees) : \"고무나무에서\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"For example, 예를 들어. rubber is made from, 고무는 만들어집니다. white sap, 흰 수액으로. from rubber trees, 고무나무에서. 이 문장 전체를 해석하면, 예를 들어, 고무는 고무나무의 흰 수액으로 만들어집니다.","hl":"m"},{"n":23,"text":"고무가 고무나무의 흰 수액으로 만들어진다는 예를 들어요. 나무 수액으로 무엇을 만드는지 보여 주는 문장이에요.","hl":"mn"},{"n":24,"text":"첫 번째, is made from은 무엇으로 만들어지다라는 덩어리 표현이에요. 두 번째, from rubber trees에서 from은 재료가 어디서 왔는지 알려 주는 짝꿍 말이에요. 고무나무에서 온 수액이라고 이해하면 아주 쉬워요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">메이플 시럽은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Maple \u003c/span>\u003cspan class=\"tgt\">syrup \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만들어져요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">made \u003c/span>\u003cspan class=\"tgt\">from\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단풍나무 수액으로\u003c/span>\u003cspan class=\"en\">maple tree sap.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">메이플 시럽은 단풍나무의 수액으로 만들어져요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 메이플 시럽도 \u003cb class=\"key\">단풍나무\u003c/b> 수액으로 만들어진다고 알려 줘요. 나무가 우리에게 주는 것이 아주 많다는 걸 보여 주는 \u003cb class=\"key\">예시\u003c/b>예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">한 가지 것일 때 be동사 is(be동사)\u003c/span> : 무엇이(Maple syrup) + ~이에요(is) : \"메이플 시럽은 ~이에요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">덩어리 표현(~으로 만들어지다)\u003c/span> : 무엇이(Maple syrup) + 만들어져요(is made) + 무엇으로(from maple tree sap) : \"단풍나무 수액으로 만들어져요\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"Maple syrup, 메이플 시럽은. is made from, 만들어져요. maple tree sap, 단풍나무 수액으로. 이 문장 전체를 해석하면, 메이플 시럽은 단풍나무의 수액으로 만들어져요.","hl":"m"},{"n":26,"text":"메이플 시럽도 단풍나무 수액으로 만들어진다고 알려 줘요. 나무가 우리에게 주는 것이 아주 많다는 걸 보여 주는 문장이에요.","hl":"mn"},{"n":27,"text":"첫 번째, Maple syrup은 하나의 음식을 가리키니까 be동사 is를 써요. 두 번째, is made from은 앞에서 배운 무엇으로 만들어지다라는 덩어리 표현이에요. 단풍나무 수액이 재료라는 걸 알려 주지요. 여러분도 아침에 팬케이크에 시럽을 뿌려 먹으면 이 문장이 떠오를 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 사람들은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Many \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">메이플 시럽을 즐기지요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">enjoy\u003c/span> maple syrup\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 맛있기 때문에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">because \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">delicious\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">많은 사람들은 메이플 시럽이 맛있기 때문에 그것을 즐기지요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 메이플 시럽이 아주 \u003cb class=\"key\">인기\u003c/b> 있다는 걸 알려 줘요. 맛있다는 \u003cb class=\"key\">이유\u003c/b>까지 함께 말해 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">여럿일 때는 동사 그대로(복수 주어)\u003c/span> : 많은 사람들(Many people) + 즐긴다(enjoy) : \"많은 사람들은 즐기지요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이유를 이어 주는 말(접속사)\u003c/span> : 왜냐하면(because) + 그것이(it is) + 맛있다(delicious) : \"그것이 맛있기 때문에\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"Many people, 많은 사람들은. enjoy maple syrup, 메이플 시럽을 즐기지요. because it is delicious, 그것이 맛있기 때문에. 이 문장 전체를 해석하면, 많은 사람들은 메이플 시럽이 맛있기 때문에 그것을 즐기지요.","hl":"m"},{"n":29,"text":"이 문장은 메이플 시럽이 얼마나 인기 있는지 알려 줘요. 맛있어서 많은 사람이 좋아한다는 이유까지 함께 말해 주고 있죠.","hl":"mn"},{"n":30,"text":"첫 번째, because는 이유를 붙여 주는 접속사예요. 맛있다는 이유를 콕 붙여 주고 있죠. 두 번째, Many people은 사람이 여럿이니까 복수예요. 복수일 때는 동사에 s를 붙이지 않고 enjoy 그대로 써요. 여러분도 좋아하는 간식을 친구에게 소개할 때 because를 써 보세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 나무들은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Some \u003c/span>\u003cspan class=\"tgt\">trees\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리에게 약을 줍니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">give \u003c/span>\u003cspan class=\"tgt\">us \u003c/span>\u003cspan class=\"tgt\">medicine\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어떤 나무들은 우리에게 약을 줍니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 나무가 우리에게 \u003cb class=\"key\">약\u003c/b>도 준다는 걸 알려 줘요. 앞의 맛있는 시럽 이야기에서 약 이야기로 넘어가는 \u003cb class=\"key\">연결\u003c/b> 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">여럿일 때 주어(복수 주어)\u003c/span> : 어떤 나무들(Some trees) + 준다(give) : \"어떤 나무들은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주다 표현(동사 + 사람 + 것)\u003c/span> : 준다(give) + 우리에게(us) + 약을(medicine) : \"우리에게 약을 줍니다\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"Some trees, 어떤 나무들은. give us medicine, 우리에게 약을 줍니다. 이 문장 전체를 해석하면, 어떤 나무들은 우리에게 약을 줍니다.","hl":"m"},{"n":32,"text":"이 문장은 나무가 우리에게 약도 준다는 걸 알려 줘요. 앞에서 맛있는 시럽 이야기를 했으니, 이제는 약 이야기로 자연스럽게 연결해 주는 문장이에요.","hl":"mn"},{"n":33,"text":"첫 번째, 나무가 여럿이니까 복수가 되어요. 여럿일 때는 동사에 s를 붙이지 않고 give 그대로 써요. 두 번째, '우리에게 약을'은 영어로 give us medicine 순서로 말해요. 우리말과 순서가 반대라서 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들은 차를 만들 수 있어요\u003c/span>\u003cspan class=\"en\">People \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">make\u003c/span> tea\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나뭇잎과 나무껍질로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">leaves \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">bark\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오리나무의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">alder \u003c/span>\u003cspan class=\"tgt\">trees\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사람들은 오리나무의 나뭇잎과 나무껍질로 차를 만들 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 오리나무 잎과 껍질로 차를 만들 수 있다고 알려 줘요. 나무가 약이 된다는 앞 문장의 \u003cb class=\"key\">예\u003c/b>를 보여 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">할 수 있다(조동사 can)\u003c/span> : 할 수 있어요(can) + 만들다(make) : \"만들 수 있어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">~로, ~을 가지고(전치사)\u003c/span> : ~로(with) + 나뭇잎과 껍질(the leaves and bark) : \"나뭇잎과 나무껍질로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">~의(전치사)\u003c/span> : ~의(of) + 오리나무들(alder trees) : \"오리나무의\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"People can make tea, 사람들은 차를 만들 수 있어요. with the leaves and bark, 나뭇잎과 나무껍질로. of alder trees, 오리나무의. 이 문장 전체를 해석하면, 사람들은 오리나무의 나뭇잎과 나무껍질로 차를 만들 수 있어요.","hl":"m"},{"n":35,"text":"이 문장은 오리나무 잎과 껍질로 차를 만들 수 있다고 알려 줘요. 바로 앞에서 나무가 약이 된다고 했으니, 그 예를 보여 주는 문장이에요.","hl":"mn"},{"n":36,"text":"첫 번째, can은 할 수 있다는 뜻을 더해 주는 조동사예요. can 뒤에는 동사원형 make가 와요. 두 번째, with는 무엇으로 만드는지 재료를 말할 때 써요. 나뭇잎과 껍질이 재료라는 뜻이죠. 세 번째, of는 무엇의 것인지 알려 줘요. 여기서는 오리나무의 잎과 껍질이라는 뜻이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 차는\u003c/span>\u003cspan class=\"en\">The tea\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">치료하는 데 도움이 됩니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">helps\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">treat\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">열과 상처를\u003c/span>\u003cspan class=\"en\">fevers and wounds.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 차는 열과 상처를 치료하는 데 도움이 됩니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 차가 열과 상처를 낫게 도와준다는 뜻이에요. 나무가 우리에게 \u003cb class=\"key\">약\u003c/b>을 준다는 앞 내용을 이어 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">한 사람·한 개일 때 동사 + s(3인칭 단수)\u003c/span> : 그 차(The tea) + 돕는다(helps) + 무엇을(to treat ...) : \"돕습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사\u003c/span> : to + 동사원형(treat) = ~하도록 : \"치료하도록\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"The tea, 그 차는. helps to treat, 치료하는 데 도움이 됩니다. fevers and wounds, 열과 상처를. 이 문장 전체를 해석하면, 그 차는 열과 상처를 치료하는 데 도움이 됩니다.","hl":"m"},{"n":38,"text":"이 문장은 차가 열과 상처를 낫게 도와준다는 뜻이에요. 나무가 우리에게 약을 준다는 앞 내용을 이어 주죠.","hl":"mn"},{"n":39,"text":"첫 번째, The tea는 한 개라서 동사 help에 s를 붙여 helps라고 해요. 두 번째, helps 뒤에 to treat를 붙여 치료하도록 돕다는 뜻을 만들어요. to 뒤에는 동사원형 treat가 와요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">복통이 있을 때는,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When\u003c/span> you have a stomachache,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">느릅나무의 나무껍질이\u003c/span>\u003cspan class=\"en\">the bark of elm trees\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">도움이 될 수 있답니다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">help\u003c/span> you.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">복통이 있을 때는, 느릅나무의 나무껍질이 도움이 될 수 있답니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 복통이 있을 때 느릅나무 껍질이 도움을 줄 수 있다는 뜻이에요. 나무가 \u003cb class=\"key\">약\u003c/b>으로 우리를 돕는 예를 하나 더 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">때를 이어 주는 말(접속사 when)\u003c/span> : When + 문장 = ~할 때 : \"~할 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">도와주는 동사(조동사 can)\u003c/span> : can + 동사원형(help) = ~할 수 있다 : \"도움이 될 수 있습니다\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"When you have a stomachache, 복통이 있을 때는. the bark of elm trees, 느릅나무의 나무껍질이. can help you, 도움이 될 수 있답니다.. 이 문장 전체를 해석하면, 복통이 있을 때는, 느릅나무의 나무껍질이 도움이 될 수 있답니다.","hl":"m"},{"n":41,"text":"이 문장은 복통이 있을 때 느릅나무 껍질이 도움을 줄 수 있다는 뜻이에요. 나무가 약으로 우리를 돕는 예를 하나 더 보여 주죠.","hl":"mn"},{"n":42,"text":"첫 번째, When은 '~할 때'라는 뜻으로 문장 앞에서 때를 알려 줘요. 두 번째, can help는 '도움이 될 수 있다'는 뜻이고 can 뒤에는 동사원형 help가 와요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">오늘 배운 내용 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>『아낌없이 주는 나무』는 1964년에 나왔지만 오늘날에도 사랑받는 책이에요. 책 속 \u003cb class=\"key\">나무\u003c/b>는 소년에게 모든 것을 줘요.\u003c/li>\u003cli>실생활에서도 우리는 주변에서 \u003cb class=\"key\">주는 \u003c/b>\u003cb class=\"key\">나무\u003c/b>를 찾을 수 있어요.\u003c/li>\u003cli>나무의 \u003cb class=\"key\">수액\u003c/b>으로 고무와 메이플 시럽을 만들고, 어떤 나무는 우리에게 \u003cb class=\"key\">약\u003c/b>을 줘요.\u003c/li>\u003cli>오리나무 차는 열과 상처를, 느릅나무 껍질은 \u003cb class=\"key\">복통\u003c/b>을 도와줘요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Trees give us many things, like sap for rubber and maple syrup, and medicine for our bodies.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">나무는 우리에게 \u003cb class=\"key\">수액\u003c/b>과 \u003cb class=\"key\">약\u003c/b>을 주는 고마운 존재예요. 수액으로 고무와 메이플 시럽을 만들고, 나무껍질과 잎으로 열과 상처, 복통을 낫게 하는 차를 만들어요.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":43,"text":"오늘 강의는 여기까지입니다.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
