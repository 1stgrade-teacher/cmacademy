</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"왓츠 리딩 100B Ch.4 Unit 01 A Mysterious Bat","audioDir":"reading01_audio","preview":false,"count":54,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.400em\">Ch.4 Unit 01\u003cbr>A Mysterious\u003cbr>Bat\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">왓츠 리딩 100B\u003c/div>\u003ch1>A Mysterious Bat\u003c/h1>\u003ch2>신비한 방망이\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">한 줄 요약\u003c/span>\u003cspan>숲에서 길을 잃은 젊은이가 오래된 집에서 \u003cb class=\"key\">도깨비\u003c/b>들이 방망이를 휘둘러 금을 만드는 것을 보았어요. 배가 고파 \u003cb class=\"key\">hazelnut\u003c/b>을 깨물어 큰 소리를 내자 도깨비들이 도망갔고, 그는 도깨비가 두고 간 \u003cb class=\"key\">방망이\u003c/b>로 많은 금을 얻었어요.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>A young man got a goblin's magic bat and made a lot of gold with it.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘도 만나서 정말 반가워요. 오늘 함께 읽을 이야기는 A Mysterious Bat, 신비한 방망이 이야기예요. 아주 먼 옛날 숲속에서 길을 잃은 젊은이가 도깨비를 만나는 재미있는 이야기죠. 한 줄로 말하면, 젊은이가 도깨비의 방망이를 얻어서 금을 만들게 되는 이야기예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">미리 알면 쉬워요\u003c/span>\u003cdiv class=\"lp-box\">여러분, 도깨비 이야기 좋아하나요? 우리 옛이야기에는 도깨비가 자주 나오는데, 도깨비는 힘이 세고 신비한 방망이를 들고 다녀요. 영어로 도깨비는 \u003cb class=\"key\">goblin\u003c/b>이라고 해요. 이야기 속 \u003cb class=\"key\">hazelnut\u003c/b>은 개암이라는 작은 견과류인데, 땅에 떨어져 있으면 밟았을 때 딱 소리가 나요. 여러분이 쉬는 시간에 과자 봉지를 딱 하고 뜯는 소리처럼요. 이 이야기에서는 아주 작은 소리 하나가 큰일을 만들어 낸답니다.\u003c/div>","segs":[{"n":2,"text":"여러분, 혹시 도깨비 이야기 좋아하나요? 우리 옛이야기에는 도깨비가 자주 나오는데, 도깨비는 힘도 세고 신비한 방망이를 들고 다녀요. 영어로 도깨비는 goblin이라고 해요. 그리고 이야기 속 hazelnut은 개암이라고 하는 작은 견과류인데, 땅에 떨어져 있으면 밟았을 때 딱 소리가 나요. 여러분이 쉬는 시간에 과자 봉지를 딱 하고 뜯는 소리처럼요. 이 이야기에서는 아주 작은 소리 하나가 큰일을 만들어 낸답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>숲에서 집을 찾다\u003csmall>시작 · 문장 1–4\u003c/small>\u003c/h4>\u003cp>옛날에 한 젊은이가 숲에서 \u003cb class=\"key\">나무를 \u003c/b>\u003cb class=\"key\">베고\u003c/b> 있었어요. 땅에 떨어진 \u003cb class=\"key\">hazelnut\u003c/b>을 주머니에 넣고 집으로 가다가 길을 잃었어요. 그는 오래된 집을 찾아 그곳에서 \u003cb class=\"key\">하룻밤\u003c/b>을 자기로 했어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>도깨비가 나타나다\u003csmall>문제 · 문장 5–7\u003c/small>\u003c/h4>\u003cp>갑자기 \u003cb class=\"key\">도깨비\u003c/b>들이 집으로 들어왔어요. 젊은이는 재빨리 \u003cb class=\"key\">숨었어요\u003c/b>. 도깨비들이 방망이를 휘두르며 &quot;금 나와라!&quot;라고 말하자 \u003cb class=\"key\">금\u003c/b>이 나왔어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>작은 소리가 만든 기회\u003csmall>바뀜 · 문장 8–11\u003c/small>\u003c/h4>\u003cp>배가 고팠던 젊은이가 \u003cb class=\"key\">hazelnut\u003c/b>을 깨물자 아주 큰 \u003cb class=\"key\">소리\u003c/b>가 났어요. 도깨비들은 \u003cb class=\"key\">겁먹고\u003c/b> 도망갔어요. 그런데 자기네 방망이 하나를 두고 갔답니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>방망이를 얻다\u003csmall>해결 · 문장 12–14\u003c/small>\u003c/h4>\u003cp>젊은이는 그 방망이를 집으로 가져갔어요. 방망이를 휘두르며 &quot;금 나와라!&quot;라고 말했어요. 그러자 \u003cb class=\"key\">많은 \u003c/b>\u003cb class=\"key\">금\u003c/b>이 나타났어요!\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 이제 이야기가 어떤 순서로 흘러가는지 함께 살펴볼까요?","hl":null},{"n":4,"text":"먼저 첫 번째 단계예요. 옛날에 한 젊은이가 숲에서 나무를 베고 있었어요. 땅에 떨어진 hazelnut을 주머니에 넣고 집으로 가다가 길을 잃었지요. 그래서 오래된 집을 찾아 그곳에서 하룻밤을 자기로 했어요.","hl":"f0"},{"n":5,"text":"그다음 단계에서는 갑자기 도깨비들이 집으로 들어와요. 놀란 젊은이는 재빨리 숨었어요. 그런데 도깨비들이 방망이를 휘두르며 Come out gold 하고 말하니까 진짜로 금이 나왔어요.","hl":"f1"},{"n":6,"text":"세 번째 단계에서는 배가 고팠던 젊은이가 hazelnut을 깨물어요. 그러자 아주 큰 소리가 났지요. 도깨비들은 겁먹고 도망가 버렸어요. 그런데 자기네 방망이 하나를 집에 두고 갔답니다.","hl":"f2"},{"n":7,"text":"마지막 단계예요. 젊은이는 그 방망이를 집으로 가져갔어요. 그리고 방망이를 휘두르며 Come out gold 하고 말했어요. 그러자 정말 많은 금이 나타났어요. 이렇게 작은 우연이 젊은이에게 큰 행운을 주었답니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">이야기 순서\u003c/span>\u003cspan class=\"lp-pill\">끝\u003c/span>\u003cspan class=\"lp-pill\">주제문 14번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 이야기는 일어난 일을 차례대로 늘어놓는 \u003cb class=\"key\">이야기 \u003c/b>\u003cb class=\"key\">순서\u003c/b> 짜임이에요. 처음에는 숲에서 시작하고, 가운데에서는 도깨비를 만나고, 끝에서는 금을 얻는 모습을 보여 주지요. 이 이야기의 \u003cb class=\"key\">중심 \u003c/b>\u003cb class=\"key\">문장\u003c/b>은 맨 끝에 있어요. 많은 금이 나타났다는 마지막 문장이 결말이자 중심이에요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Long ago (1)\u003c/b>\u003cspan>옛날이야기가 시작됨을 알려 줌\u003c/span>\u003cb>Suddenly (5)\u003c/b>\u003cspan>갑자기 일이 생겼음을 알려 줌\u003c/span>\u003cb>But (8)\u003c/b>\u003cspan>앞 내용과 반대되는 일을 알려 줌\u003c/span>\u003cb>So (8)\u003c/b>\u003cspan>그렇게 한 이유를 알려 줌\u003c/span>\u003cb>Then (14)\u003c/b>\u003cspan>그다음에 이어지는 결과를 알려 줌\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">a young man\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">he\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the young man\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the goblins\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">they\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">one of their bats\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the bat\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">it\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 이야기는 일어난 일을 차례대로 늘어놓는 이야기 순서 짜임이에요. 처음에 숲에서 시작해서 가운데에서 도깨비를 만나고, 끝에서 금을 얻는 모습을 보여 주지요. 이 이야기의 중심이 되는 문장은 맨 끝에 있어요. 많은 금이 나타났다는 마지막 문장이 결말이고 중심이에요.","hl":"ty"},{"n":9,"text":"글의 길잡이 말을 찾아보면 흐름이 더 잘 보여요. 첫 번째 문장의 Long ago는 아주 먼 옛날 이야기가 시작된다는 것을 알려 주고, 다섯 번째 문장의 Suddenly는 갑자기 무슨 일이 생겼다는 신호예요. 여덟 번째 문장의 But은 앞 내용과 반대되는 일이 생긴다는 말이고, So는 그렇게 한 이유를 이어 주는 말이에요. 같은 대상을 다르게 부르는 말도 찾아보세요. 젊은이는 a young man, he, the young man으로 바뀌고, 방망이는 one of their bats, the bat, it으로 바뀌어 나온답니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 단어\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>long ago\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>옛날에\u003c/span>\u003c/div>\u003cdiv>\u003cb>cut down\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>(나무를) 베다\u003c/span>\u003c/div>\u003cdiv>\u003cb>woods\u003c/b>\u003cem>명사\u003c/em>\u003cspan>숲\u003c/span>\u003c/div>\u003cdiv>\u003cb>hazelnut\u003c/b>\u003cem>명사\u003c/em>\u003cspan>헤이즐넛(개암)\u003c/span>\u003c/div>\u003cdiv>\u003cb>ground\u003c/b>\u003cem>명사\u003c/em>\u003cspan>땅, 땅바닥\u003c/span>\u003c/div>\u003cdiv>\u003cb>pocket\u003c/b>\u003cem>명사\u003c/em>\u003cspan>주머니\u003c/span>\u003c/div>\u003cdiv>\u003cb>get lost\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>길을 잃다\u003c/span>\u003c/div>\u003cdiv>\u003cb>decide\u003c/b>\u003cem>동사\u003c/em>\u003cspan>결심하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>overnight\u003c/b>\u003cem>부사\u003c/em>\u003cspan>하룻밤 동안\u003c/span>\u003c/div>\u003cdiv>\u003cb>suddenly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>갑자기\u003c/span>\u003c/div>\u003cdiv>\u003cb>goblin\u003c/b>\u003cem>명사\u003c/em>\u003cspan>도깨비\u003c/span>\u003c/div>\u003cdiv>\u003cb>enter\u003c/b>\u003cem>동사\u003c/em>\u003cspan>들어가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>hide\u003c/b>\u003cem>동사\u003c/em>\u003cspan>숨다\u003c/span>\u003c/div>\u003cdiv>\u003cb>swing\u003c/b>\u003cem>동사\u003c/em>\u003cspan>휘두르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>appear\u003c/b>\u003cem>동사\u003c/em>\u003cspan>나타나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>hungry\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>배고픈\u003c/span>\u003c/div>\u003cdiv>\u003cb>bite\u003c/b>\u003cem>동사\u003c/em>\u003cspan>깨물다\u003c/span>\u003c/div>\u003cdiv>\u003cb>noise\u003c/b>\u003cem>명사\u003c/em>\u003cspan>소리\u003c/span>\u003c/div>\u003cdiv>\u003cb>frightened\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>겁먹은\u003c/span>\u003c/div>\u003cdiv>\u003cb>run away\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>도망가다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"오늘의 단어도 소리 내어 읽어 볼까요? long ago는 옛날에, cut down은 나무를 베다, get lost는 길을 잃다라는 뜻이에요. goblin은 도깨비, swing은 휘두르다, appear는 나타나다라는 뜻이지요. 그리고 frightened는 겁먹은, run away는 도망가다라는 뜻이에요. 선생님을 따라 세 번씩 소리 내어 읽어 보세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">appear\u003c/b>\u003cspan class=\"m\">나타나다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">come out\u003c/span>\u003cspan class=\"s\">show up\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">disappear\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">hide\u003c/b>\u003cspan class=\"m\">숨다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">cover\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">show\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">loud\u003c/b>\u003cspan class=\"m\">소리가 큰\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">noisy\u003c/span>\u003cspan class=\"s\">big\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">quiet\u003c/span>\u003cspan class=\"a\">soft\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">frightened\u003c/b>\u003cspan class=\"m\">겁먹은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">scared\u003c/span>\u003cspan class=\"s\">afraid\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">brave\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">hungry\u003c/b>\u003cspan class=\"m\">배고픈\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">starving\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">full\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">quickly\u003c/b>\u003cspan class=\"m\">재빨리\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">fast\u003c/span>\u003cspan class=\"s\">right away\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">slowly\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"비슷한 말과 반대말도 함께 익혀 볼게요. appear는 나타나다인데 come out이나 show up처럼 비슷하게 쓸 수 있고, 반대로 disappear는 사라지다라는 뜻이에요. frightened는 겁먹은인데 scared나 afraid와 비슷하고, 반대말은 brave처럼 용감한이에요. loud는 소리가 큰인데 noisy와 비슷하고, 반대로 quiet은 조용한이에요. hungry는 배고픈이고 반대말은 full, 배부른이랍니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">옛날에\u003c/span>\u003cspan class=\"en\">Long ago,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 젊은이가\u003c/span>\u003cspan class=\"en\">a young man\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">베고 있었어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">cutting \u003c/span>\u003cspan class=\"tgt\">down\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">숲속에서 나무를\u003c/span>\u003cspan class=\"en\">trees \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">woods\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">옛날에 한 젊은이가 숲속에서 나무를 베고 있었어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 이야기의 시작을 알려 줘요. \u003cb class=\"key\">옛날\u003c/b> \u003cb class=\"key\">숲속\u003c/b>에서 한 \u003cb class=\"key\">젊은이\u003c/b>가 나무를 베는 장면을 그려요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거에 ~하는 중(과거 진행형)\u003c/span> : 누가(a young man) + was + 하고 있었다(cutting down) + 무엇을(trees) : \"나무를 베고 있었어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소 짝꿍 말(전치사)\u003c/span> : 장소 짝꿍 말(in) + 장소(the woods) : \"숲속에서\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Long ago, 옛날에. a young man, 한 젊은이가. was cutting down, 베고 있었어요. trees in the woods, 숲속에서 나무를. 이 문장 전체를 해석하면, 옛날에 한 젊은이가 숲속에서 나무를 베고 있었어요.","hl":"m"},{"n":13,"text":"이 문장은 이야기의 시작을 알려 줘요. 옛날에 한 젊은이가 숲속에서 나무를 베고 있었대요.","hl":"mn"},{"n":14,"text":"첫 번째, Long ago는 지난 때를 알려 줘요. 한참 하던 일이라 was와 동사 ing를 써서 나무를 베고 있었어요라고 해요. 두 번째, in the woods에서 in은 장소 짝꿍 말이에요. 안에라는 뜻으로 숲속을 알려 주죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그때 그는 보았어요\u003c/span>\u003cspan class=\"en\">Then he \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">saw\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">헤이즐넛 몇 개를\u003c/span>\u003cspan class=\"en\">some hazelnuts\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">땅바닥에 있는\u003c/span>\u003cspan class=\"en\">on the ground\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그것들을 넣었어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">put\u003c/span> them\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 주머니 안에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">pocket\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그때 그는 땅바닥에 있는 hazelnut 몇 개를 보고, 그것들을 자신의 주머니 안에 넣었어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 젊은이가 \u003cb class=\"key\">땅바닥\u003c/b>에서 \u003cb class=\"key\">헤이즐넛\u003c/b>을 보고 \u003cb class=\"key\">주머니\u003c/b>에 넣는 장면을 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(he) + 보았다(saw) + 무엇을(hazelnuts) : \"보았어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 보았다(saw) + 그리고(and) + 넣었다(put) : \"그리고 넣었어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">장소 짝꿍 말(전치사)\u003c/span> : 넣었다(put) + 안에(in) + his pocket : \"자신의 주머니 안에\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Then he saw, 그때 그는 보았어요. some hazelnuts, 헤이즐넛 몇 개를. on the ground, 땅바닥에 있는. and put them, 그리고 그것들을 넣었어요. in his pocket, 자신의 주머니 안에. 이 문장 전체를 해석하면, 그때 그는 땅바닥에 있는 hazelnut 몇 개를 보고, 그것들을 자신의 주머니 안에 넣었어요.","hl":"m"},{"n":16,"text":"이 문장은 젊은이가 땅바닥에서 헤이즐넛을 보고 주머니에 넣는 장면을 보여 줘요.","hl":"mn"},{"n":17,"text":"첫 번째, saw는 see의 지난 모습이에요. 이런 친구를 불규칙이라고 해요. 두 번째, and가 saw와 put 두 행동을 이어 줘요. 세 번째, in his pocket에서 in은 주머니 안처럼 장소를 알려 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">집에 돌아가는 길에\u003c/span>\u003cspan class=\"en\">On his way home,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 길을 잃었어요\u003c/span>\u003cspan class=\"en\">he \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">got \u003c/span>\u003cspan class=\"tgt\">lost\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 발견했어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">found\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오래된 집을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">old \u003c/span>\u003cspan class=\"tgt\">house\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">집에 돌아가는 길에, 그는 길을 잃고 오래된 집을 발견했어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 젊은이가 집에 가다가 \u003cb class=\"key\">길을 \u003c/b>\u003cb class=\"key\">잃고\u003c/b> \u003cb class=\"key\">오래된 \u003c/b>\u003cb class=\"key\">집\u003c/b>을 발견한 일을 알려 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">덩어리 표현\u003c/span> : 길을 잃었다(got lost) : \"길을 잃었어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 길을 잃었다(got lost) + 그리고(and) + 발견했다(found) : \"그리고 발견했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">꾸며 주는 말(형용사)\u003c/span> : an + 꾸며 주는 말(old) + 집(house) : \"오래된 집을\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"On his way home, 집에 돌아가는 길에. he got lost, 그는 길을 잃었어요. and found, 그리고 발견했어요. an old house, 오래된 집을. 이 문장 전체를 해석하면, 집에 돌아가는 길에, 그는 길을 잃고 오래된 집을 발견했어요.","hl":"m"},{"n":19,"text":"이 문장은 젊은이가 집에 가다가 길을 잃고 오래된 집을 발견한 일을 알려 줘요.","hl":"mn"},{"n":20,"text":"첫 번째, got lost는 길을 잃다라는 덩어리 표현이에요. 지난 일이라 got으로 바뀌었죠. 두 번째, and가 길을 잃은 일과 집을 발견한 일을 이어 줘요. 세 번째, old가 house를 꾸며 줘요. 그래서 an old house는 오래된 집이에요. old 앞에는 an을 써요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 결심했어요\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">decided\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거기서 자기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">sleep\u003c/span> there\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하룻밤 동안\u003c/span>\u003cspan class=\"en\">overnight.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 거기서 하룻밤 동안 자기로 결심했죠.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 젊은 남자가 빈 집을 발견하고 그곳에서 하룻밤 자기로 마음을 정했다는 걸 알려 줘요. 이야기가 밤으로 넘어가면서 다음 사건을 준비하는 \u003cb class=\"key\">역할\u003c/b>을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거형(지난 일 말)\u003c/span> : 누가(He) + 했어요(decided) + 무엇을 : \"결심했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to + 동사원형(to부정사)\u003c/span> : 결심하다(decided) + to + 하다(sleep) : \"자다 → 자기로\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"He decided, 그는 결심했어요. to sleep there, 거기서 자기를. overnight, 하룻밤 동안. 이 문장 전체를 해석하면, 그는 거기서 하룻밤 동안 자기로 결심했죠.","hl":"m"},{"n":22,"text":"이 문장은 젊은 남자가 집에서 하룻밤 자기로 마음을 정했다는 걸 알려 줘요. 다음 사건을 준비하는 역할을 하는 문장이에요.","hl":"mn"},{"n":23,"text":"첫 번째, decided는 지난 일이라 decide에 -ed를 붙인 과거형이에요. 두 번째, decided to 다음에는 동사원형이 와서 to sleep은 '자다'라는 뜻이 돼요. 여러분도 '나는 자기를 결심했어요'를 영어로 I decided to sleep이라고 말해 볼 수 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">갑자기, 몇몇 도깨비들이\u003c/span>\u003cspan class=\"en\">Suddenly, \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">some \u003c/span>\u003cspan class=\"tgt\">goblins\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 집으로 들어왔어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">entered\u003c/span> the house.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">갑자기, 몇몇 도깨비들이 집으로 들어왔어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 갑자기 도깨비들이 집에 들어오면서 조용했던 밤이 무서운 장면으로 바뀐다는 걸 알려 줘요. \u003cb class=\"key\">갑자기\u003c/b>라는 말로 사건이 확 일어났음을 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수량 표현(some)\u003c/span> : 몇몇(some) + 복수 이름 말(goblins) : \"몇몇 도깨비들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거형(지난 일 말)\u003c/span> : 누가(they) + 했어요(entered) + 어디로 : \"들어왔어요\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Suddenly, some goblins, 갑자기, 몇몇 도깨비들이. entered the house, 그 집으로 들어왔어요. 이 문장 전체를 해석하면, 갑자기, 몇몇 도깨비들이 집으로 들어왔어요.","hl":"m"},{"n":25,"text":"조용했던 밤에 도깨비들이 갑자기 들어와서 분위기가 확 바뀌죠. 사건이 시작되는 아주 중요한 문장이에요.","hl":"mn"},{"n":26,"text":"첫 번째, 셀 수 있는 것 여러 개 앞에 some을 붙여 '몇몇'이라고 해요. goblins처럼 복수랑 같이 써요. 두 번째, entered는 지난 일이라 -ed를 붙인 과거형이에요. 갑자기 무서운 일이 일어난 느낌을 살려서 읽어 보세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 젊은이는\u003c/span>\u003cspan class=\"en\">The young man\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">재빨리 숨었어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">quickly\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">hid\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">젊은이는 재빨리 숨었지요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 젊은 남자가 도깨비들을 보고 얼른 몸을 숨겼다는 걸 알려 줘요. '재빨리'라는 말로 긴장된 \u003cb class=\"key\">분위기\u003c/b>를 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">더 자세히 알려 주는 말(부사)\u003c/span> : 어떻게(quickly) + 했어요(hid) : \"재빨리\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거형(지난 일 말)\u003c/span> : 누가(He) + 했어요(hid) : \"숨었어요\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"The youn  + 겁먹은 상태(frightened) : \"겁먹게 되었어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 도깨비들이(The goblins) + 도망갔다(ran away) : \"도망갔어요\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"The goblins, 도깨비들은. became frightened, 겁먹게 되었어요. and ran away, 그리고 도망갔어요. 이 문장 전체를 해석하면, 도깨비들은 겁먹고 도망갔지요.","hl":"m"},{"n":40,"text":"도깨비들이 큰 소리에 겁먹고 도망간 장면이에요. 여기서 도깨비들이 도망가면서 방망이 하나를 남기게 되지요.","hl":"mn"},{"n":41,"text":"먼저 became frightened를 볼까요. become 뒤에 형용사 frightened가 와서 겁먹은 상태가 되었다는 뜻이 돼요. 그래서 frightened는 보어 역할을 해요. 두 번째로 ran away는 run의 과거형 ran을 써서 지난 일을 말하고 있어요. 여러분도 소리 내어 한 번 읽어 보세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그런데 그들은 두고 갔어요\u003c/span>\u003cspan class=\"en\">But \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">left\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들 방망이 중 하나를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">bats\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">집 안에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">house\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그런데 그들은 자신의 방망이 중 하나를 집 안에 두고 갔답니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 도깨비들이 도망가면서 \u003cb class=\"key\">방망이\u003c/b> 하나를 두고 가는 장면이에요. 이 \u003cb class=\"key\">실수\u003c/b> 덕분에 주인공이 방망이를 얻게 되지요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\ "mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 젊은이는(The young man) + 가져갔다(took) + 무엇을(the bat) : \"젊은이는 가져갔어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">더 자세히 알려 주는 말(부사)\u003c/span> : 가져갔다(took) + 집으로(home) : \"집으로\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"The young man, 젊은이는. took the bat home, 그 방망이를 집으로 가져갔어요. 이 문장 전체를 해석하면, 젊은이는 그 방망이를 집으로 가져갔어요.","hl":"m"},{"n":46,"text":"주인공이 도깨비 방망이를 집으로 가져오는 장면이에요. 이제 이 방망이로 무엇을 할지 기대가 되지요.","hl":"mn"},{"n":47,"text":"먼저 동사 took을 볼까요. take의 과거형이라서 젊은이가 이미 가져간 지난 일을 말해요. 그리고 home은 집으로라는 뜻으로, to를 붙이지 않고 그냥 써요. 이 문장은 짧고 기본이 잘 담겨 있어서 꼭 외워 두면 좋아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 14\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 그것을 휘두르며\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">He \u003c/span>\u003cspan class=\"tgt\">swung\u003c/span> it\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 말했어요,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">said\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">&quot;금 나와라!&quot;\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">Come \u003c/span>\u003cspan class=\"tgt\">out \u003c/span>\u003cspan class=\"tgt\">gold\u003c/span>!&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 그것을 휘두르며 &quot;금 나와라!&quot;라고 말했어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 청년이 고블린의 \u003cb class=\"key\">방망이\u003c/b>를 휘두르며 금을 불러 내는 장면이에요. 방망이의 \u003cb class=\"key\">마법\u003c/b>이 진짜라는 걸 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(He) + 했어요(swung) + 무엇을(it) : \"그는 그것을 휘둘렀어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 했어요(swung it) + 그리고(and) + 말했어요(said) : \"그리고 말했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">시키는 말(명령문)\u003c/span> : 동사원형(Come out) + 무엇이(gold) : \"금 나와라\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"He swung it, 그는 그것을 휘두르며. and said, 그리고 말했어요. \"Come out gold!\", \"금 나와라!\". 이 문장 전체를 해석하면, 그는 그것을 휘두르며 \"금 나와라!\"라고 말했어요.","hl":"m"},{"n":49,"text":"청년이 마법 방망이를 휘두르면서 금을 불러 냈어요. 이제 진짜 마법이 시작되는 순간이에요.","hl":"mn"},{"n":50,"text":"첫 번째, swung은 swing의 과거형이에요. 이미 지난 일이라 과거형으로 바꿔 말해요. 두 번째, and가 휘두르기와 말하기, 두 동작을 이어 줘요. 세 번째, Come out gold는 명령문이에요. 주어 없이 동사원형부터 말하면 나와라는 뜻이 된답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 14\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러자\u003c/span>\u003cspan class=\"en\">Then\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 금이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">lot \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">gold\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나타났어요!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">appeared\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러자 많은 금이 나왔어요!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 청년의 \u003cb class=\"key\">주문\u003c/b>이 진짜로 통해서 금이 많이 생겼어요. 이야기의 \u003cb class=\"key\">결말\u003c/b>에서 청년이 부자가 되는 장면이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">많은 양 말하기(수량 표현)\u003c/span> : 많은(a lot of) + 셀 수 없는 것(gold) : \"많은 금\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 무엇이(gold) + 나타났어요(appeared) : \"나타났어요\"\u003c/div>\u003c/div>","segs":[{"n":51,"text":"Then, 그러자. a lot of gold, 많은 금이. appeared!, 나타났어요!. 이 문장 전체를 해석하면, 그러자 많은 금이 나왔어요!","hl":"m"},{"n":52,"text":"주문이 진짜로 통해서 금이 많이 생겼어요. 이야기의 끝에서 청년이 부자가 되는 장면이에요.","hl":"mn"},{"n":53,"text":"첫 번째, a lot of는 많은이라는 수량 표현이에요. gold는 셀 수 없는 말이라 many를 쓰지 않고 a lot of를 써요. 두 번째, appeared는 appear에 과거 표시를 붙여 나타났어요라는 뜻이 된 말이에요. 그래서 많은 금이 나타났어요가 되는 거예요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">오늘 배운 내용 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>옛날에 한 젊은이가 숲에서 나무를 베다가 \u003cb class=\"key\">hazelnut\u003c/b>을 주머니에 넣었어요.\u003c/li>\u003cli>길을 잃고 오래된 집에서 자다가 \u003cb class=\"key\">도깨비\u003c/b>들이 방망이로 \u003cb class=\"key\">금\u003c/b>을 만드는 것을 보았어요.\u003c/li>\u003cli>배가 고파 hazelnut을 깨물어 큰 \u003cb class=\"key\">소리\u003c/b>가 나자 도깨비들이 도망갔어요.\u003c/li>\u003cli>젊은이는 도깨비가 두고 간 \u003cb class=\"key\">방망이\u003c/b>로 많은 금을 얻었어요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>A young man got a goblin's magic bat and made a lot of gold with it.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">숲에서 길을 잃은 젊은이가 오래된 집에서 \u003cb class=\"key\">도깨비\u003c/b>들이 방망이를 휘둘러 금을 만드는 것을 보았어요. 배가 고파 \u003cb class=\"key\">hazelnut\u003c/b>을 깨물어 큰 소리를 내자 도깨비들이 도망갔고, 그는 도깨비가 두고 간 \u003cb class=\"key\">방망이\u003c/b>로 많은 금을 얻었어요.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":54,"text":"오늘 우리는 신비한 방망이 이야기를 함께 읽었어요. 길을 잃은 젊은이가 도깨비의 방망이를 얻어 금을 만들었다는 이야기, 정말 재미있었죠? Long ago, Suddenly, But, So 같은 길잡이 말을 찾으면서 읽으면 이야기 순서가 더 잘 보여요. 오늘도 끝까지 잘 따라온 여러분, 정말 멋져요. 다음 시간에 또 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
