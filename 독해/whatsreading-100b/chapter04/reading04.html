<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>왓츠 리딩 100B Ch.4 Unit 04 Christmas Tree — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"왓츠 리딩 100B Ch.4 Unit 04 Christmas Tree","audioDir":"reading04_audio","preview":false,"count":42,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.400em\">Ch.4 Unit\u003cbr>04 Christmas\u003cbr>Tree\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">왓츠 리딩 100B\u003c/div>\u003ch1>How the Christmas Tree Tradition Began\u003c/h1>\u003ch2>크리스마스트리 전통은 어떻게 시작되었을까\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">한 줄 요약\u003c/span>\u003cspan>크리스마스트리는 많은 나라의 \u003cb class=\"key\">전통\u003c/b>으로, 사람들은 휴일 동안 나무를 \u003cb class=\"key\">장식\u003c/b>해요. 독일의 Martin Luther가 별 아래 \u003cb class=\"key\">상록수\u003c/b>를 보고 양초로 나무를 장식한 이야기가 오늘날 크리스마스트리 \u003cb class=\"key\">빛\u003c/b> 문화로 이어졌답니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The Christmas tree tradition began with Martin Luther in Germany and spread all over Europe.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘도 만나서 정말 반가워요. 오늘은 크리스마스트리 이야기를 함께 읽어 볼 거예요. 크리스마스트리 전통이 어떻게 시작되었는지, 그 안에 아주 재미있는 이야기가 숨어 있답니다. 우리 같이 읽으면서 tradition과 decorate라는 말도 배워 봐요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">미리 알면 쉬워요\u003c/span>\u003cdiv class=\"lp-box\">크리스마스는 예수님이 태어난 날을 기념하는 날이에요. 그래서 겨울이 되면 많은 나라에서 집 안에 나무를 세우고 \u003cb class=\"key\">장식\u003c/b>(decorate)을 해요. 겨울에도 잎이 초록색으로 남아 있는 나무를 \u003cb class=\"key\">상록수\u003c/b>(evergreen)라고 불러요. 우리가 방에 작은 트리를 놓고 전구를 다는 것처럼, 옛날 사람들은 나무에 \u003cb class=\"key\">양초\u003c/b>(candle)를 달았답니다. 양초는 불이 붙은 초라서 오늘날 반짝이는 전구의 할아버지 같은 것이에요.\u003c/div>","segs":[{"n":2,"text":"여러분, 크리스마스에 집에 트리 세워 본 적 있나요? 크리스마스는 예수님이 태어난 날을 기념하는 날이에요. 그래서 겨울이 되면 많은 나라에서 나무를 세우고 장식을 해요. 겨울에도 잎이 초록색으로 남아 있는 나무를 상록수라고 불러요. 옛날 사람들은 나무에 양초를 달았는데, 그게 오늘날 반짝이는 전구의 할아버지 같은 거예요. 여러분 집 트리에는 어떤 장식이 달려 있나요?","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>크리스마스트리 소개\u003csmall>시작 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>크리스마스트리는 많은 나라에서 지켜 온 \u003cb class=\"key\">전통\u003c/b>이에요. 사람들은 휴일이 되면 나무를 \u003cb class=\"key\">장식\u003c/b>하고 즐겨요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>진짜 나무와 플라스틱\u003csmall>소개 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>어떤 사람은 나무 농장에서 \u003cb class=\"key\">진짜 \u003c/b>\u003cb class=\"key\">나무\u003c/b>를 사고, 어떤 사람은 \u003cb class=\"key\">플라스틱 \u003c/b>\u003cb class=\"key\">나무\u003c/b>를 골라요. 그리고 이 전통에는 여러 가지 \u003cb class=\"key\">이야기\u003c/b>가 전해진다고 알려 줘요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>루터의 겨울밤\u003csmall>예시 · 문장 5–8\u003c/small>\u003c/h4>\u003cp>그중 하나는 독일의 Martin Luther 이야기예요. 어느 겨울 저녁, 그는 별빛 아래 \u003cb class=\"key\">상록수\u003c/b>를 보고 감동했어요. 그리고 그 나무에 \u003cb class=\"key\">양초\u003c/b>를 달아 빛을 더한 첫 사람이 되었답니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>유럽으로 퍼짐\u003csmall>마무리 · 문장 9–10\u003c/small>\u003c/h4>\u003cp>독일인들이 다른 나라로 이주할 때 이 전통을 함께 가져갔어요. 그래서 18세기 즈음에는 \u003cb class=\"key\">유럽\u003c/b> 곳곳에 크리스마스트리가 있었답니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 크리스마스트리 전통이 시작되고 퍼지는 과정을 순서대로 들려주는 글이에요.","hl":null},{"n":4,"text":"먼저 크리스마스트리가 어떤 것인지 알려 줘요. 많은 나라에서 지켜 온 전통이고, 휴일이 되면 사람들이 나무를 장식한다고 해요. 아주 쉬운 소개로 시작하는 거죠.","hl":"f0"},{"n":5,"text":"다음에는 사람들이 어떤 나무를 쓰는지 보여 줘요. 어떤 사람은 나무 농장에서 진짜 나무를 사고, 어떤 사람은 플라스틱 나무를 골라요. 그리고 이 전통에는 여러 가지 이야기가 있다고 살짝 알려 준답니다.","hl":"f1"},{"n":6,"text":"이제 본격적인 이야기가 나와요. 독일의 Martin Luther가 어느 겨울 저녁에 별빛 아래 상록수를 보았어요. 그 장면이 너무 아름다워서 그는 나무에 양초를 달았고, 처음으로 크리스마스트리에 빛을 더한 사람이 되었어요.","hl":"f2"},{"n":7,"text":"마지막으로 이 전통이 넓게 퍼진 이야기가 나와요. 독일인들이 다른 나라로 이주할 때 이 전통을 함께 가져갔어요. 그래서 십팔 세기 즈음에는 유럽 곳곳에 크리스마스트리가 있었답니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">설명하는 글(이야기 순서로 알려 주기)\u003c/span>\u003cspan class=\"lp-pill\">처음\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 크리스마스트리가 많은 나라의 \u003cb class=\"key\">전통\u003c/b>이라고 알려 줘요. 그다음에는 진짜 나무와 플라스틱 나무 이야기를 들려주고, Martin Luther 이야기를 시간 순서대로 보여 줘요. 마지막에는 이 전통이 \u003cb class=\"key\">유럽\u003c/b>으로 퍼진 결말이 나와요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Some ... others (3)\u003c/b>\u003cspan>두 가지를 짝지어 보여 줌\u003c/span>\u003cb>After that (7)\u003c/b>\u003cspan>시간 순서 알려 줌\u003c/span>\u003cb>By the 18th century (10)\u003c/b>\u003cspan>언제쯤인지 알려 줌\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">the Christmas tree\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a real tree\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">plastic trees\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">evergreens\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Christmas trees\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 설명하는 글이에요. 중심 문장은 맨 처음에 나와요. 첫 번째 문장에서 크리스마스트리가 많은 나라의 전통이라고 알려 주니까, 바로 그 문장이 중심 문장이에요.","hl":"ty"},{"n":9,"text":"길잡이 말도 함께 봐요. Some과 others는 두 가지를 짝지어 보여 주고, After that은 시간 순서를 알려 줘요. By the 18th century는 언제쯤인지 알려 주는 말이에요. 또 같은 나무를 real tree, plastic trees, evergreens, Christmas trees처럼 다르게 부르니까, 모두 같은 대상을 가리키는 말인지 확인해 보세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 단어\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>tradition\u003c/b>\u003cem>명사\u003c/em>\u003cspan>전통\u003c/span>\u003c/div>\u003cdiv>\u003cb>country\u003c/b>\u003cem>명사\u003c/em>\u003cspan>나라\u003c/span>\u003c/div>\u003cdiv>\u003cb>decorate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>장식하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>during\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~동안\u003c/span>\u003c/div>\u003cdiv>\u003cb>holiday\u003c/b>\u003cem>명사\u003c/em>\u003cspan>휴일\u003c/span>\u003c/div>\u003cdiv>\u003cb>real\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>진짜의\u003c/span>\u003c/div>\u003cdiv>\u003cb>farm\u003c/b>\u003cem>명사\u003c/em>\u003cspan>농장\u003c/span>\u003c/div>\u003cdiv>\u003cb>choose\u003c/b>\u003cem>동사\u003c/em>\u003cspan>선택하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>plastic\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>플라스틱(의)\u003c/span>\u003c/div>\u003cdiv>\u003cb>story\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이야기\u003c/span>\u003c/div>\u003cdiv>\u003cb>Germany\u003c/b>\u003cem>명사\u003c/em>\u003cspan>독일\u003c/span>\u003c/div>\u003cdiv>\u003cb>winter\u003c/b>\u003cem>명사\u003c/em>\u003cspan>겨울\u003c/span>\u003c/div>\u003cdiv>\u003cb>evening\u003c/b>\u003cem>명사\u003c/em>\u003cspan>저녁\u003c/span>\u003c/div>\u003cdiv>\u003cb>evergreen\u003c/b>\u003cem>명사\u003c/em>\u003cspan>상록수\u003c/span>\u003c/div>\u003cdiv>\u003cb>star\u003c/b>\u003cem>명사\u003c/em>\u003cspan>별\u003c/span>\u003c/div>\u003cdiv>\u003cb>candle\u003c/b>\u003cem>명사\u003c/em>\u003cspan>양초\u003c/span>\u003c/div>\u003cdiv>\u003cb>add\u003c/b>\u003cem>동사\u003c/em>\u003cspan>더하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>light\u003c/b>\u003cem>명사\u003c/em>\u003cspan>빛\u003c/span>\u003c/div>\u003cdiv>\u003cb>move\u003c/b>\u003cem>동사\u003c/em>\u003cspan>이주하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>century\u003c/b>\u003cem>명사\u003c/em>\u003cspan>세기\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"오늘의 단어를 소리 내어 읽어 볼게요. tradition은 전통, decorate는 장식하다, choose는 선택하다, real은 진짜의라는 뜻이에요. 그리고 candle은 양초라는 뜻이죠. 여러분도 한 번씩 따라 읽어 보세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">tradition\u003c/b>\u003cspan class=\"m\">전통\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">custom\u003c/span>\u003cspan class=\"s\">habit\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">decorate\u003c/b>\u003cspan class=\"m\">장식하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">trim\u003c/span>\u003cspan class=\"s\">make pretty\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">choose\u003c/b>\u003cspan class=\"m\">선택하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">pick\u003c/span>\u003cspan class=\"s\">select\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">real\u003c/b>\u003cspan class=\"m\">진짜의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">true\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">fake\u003c/span>\u003cspan class=\"a\">artificial\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">move\u003c/b>\u003cspan class=\"m\">이주하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">go\u003c/span>\u003cspan class=\"s\">travel\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">stay\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">many\u003c/b>\u003cspan class=\"m\">많은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">a lot of\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">few\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"비슷한 말과 반대말도 정리해 봐요. tradition은 custom이나 habit과 비슷해요. choose는 pick, select와 비슷하고요. real의 반대말은 fake예요. move는 go, travel과 비슷하고 반대말은 stay랍니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 10\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">크리스마스트리는\u003c/span>\u003cspan class=\"en\">The Chr\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is\u003c/span>tmas tree\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전통입니다\u003c/span>\u003cspan class=\"en\">is a tradition\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 나라에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">many \u003c/span>\u003cspan class=\"tgt\">countries\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">크리스마스트리는 많은 나라의 전통입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 크리스마스트리는 많은 나라에서 지켜 온 \u003cb class=\"key\">전통\u003c/b>이라고 알려 주는 글의 \u003cb class=\"key\">중심 \u003c/b>\u003cb class=\"key\">문장\u003c/b>이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사(be동사)\u003c/span> : 무엇이(The Christmas tree) + 이다(is) + 무엇(a tradition) : \"전통입니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사(전치사)\u003c/span> : in + 장소 = ~에서, ~안에 : \"많은 나라에서\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"The Christmas tree, 크리스마스트리는. is a tradition, 전통입니다. in many countries, 많은 나라에서. 이 문장 전체를 해석하면, 크리스마스트리는 많은 나라의 전통입니다.","hl":"m"},{"n":13,"text":"이 문장은 글의 첫 문장이에요. 크리스마스트리가 많은 나라에서 지켜 온 전통이라고 알려 주죠. 그래서 이 글의 중심 문장이에요.","hl":"mn"},{"n":14,"text":"첫 번째로 be동사 is를 봐요. 주어 The Christmas tree가 하나니까 is를 써요. 두 번째로 전치사 in이에요. in many countries는 많은 나라에서라는 뜻이죠. 아주 잘 따라왔어요!","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들은 장식해요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">People \u003c/span>\u003cspan class=\"tgt\">decorate\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">크리스마스트리를\u003c/span>\u003cspan class=\"en\">a Christmas tree\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">휴일 동안\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">during \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">holidays\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사람들은 휴일 동안 크리스마스트리를 장식해요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사람들이 휴일 동안 크리스마스트리를 꾸민다고 알려 주는 문장이에요. 첫 번째 문장의 \u003cb class=\"key\">전통\u003c/b>이 무엇인지 구체적으로 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주어 + 동사(일반동사)\u003c/span> : 여러 사람(People) + 한다(decorate) + 무엇을(a Christmas tree) : \"사람들은 장식해요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사(전치사)\u003c/span> : during + 기간 = ~동안 : \"휴일 동안\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"People decorate, 사람들은 장식해요. a Christmas tree, 크리스마스트리를. during the holidays, 휴일 동안. 이 문장 전체를 해석하면, 사람들은 휴일 동안 크리스마스트리를 장식해요.","hl":"m"},{"n":16,"text":"사람들이 휴일 동안 크리스마스트리를 꾸민다는 뜻이에요. 우리 집 거실에 트리를 꾸미는 모습이 떠오르죠?","hl":"mn"},{"n":17,"text":"첫 번째로 주어 People을 봐요. 여러 사람이라서 동사 decorate에 s를 붙이지 않아요. 두 번째로 전치사 during이에요. during the holidays는 휴일 동안이라는 뜻이죠. 아주 잘했어요!","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몇몇 사람들은 진짜 나무를 사고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Some \u003c/span>\u003cspan class=\"tgt\">buy\u003c/span> a real tree\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나무 농장에서\u003c/span>\u003cspan class=\"en\">from a tree farm,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 사람들은 선택합니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">others \u003c/span>\u003cspan class=\"tgt\">choose\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">플라스틱 나무를\u003c/span>\u003cspan class=\"en\">plastic trees.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">몇몇 사람들은 진짜 나무를 나무 농장에서 사고, 다른 사람들은 플라스틱 나무를 선택합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 크리스마스트리를 구하는 두 가지 방법을 알려 주는 문장이에요. 진짜 나무와 \u003cb class=\"key\">플라스틱 \u003c/b>\u003cb class=\"key\">나무\u003c/b> 중에 고른다고 말해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">대명사(대명사)\u003c/span> : 몇몇(Some) + 한다(buy) + 무엇을(a real tree) : \"몇몇 사람들은 사고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사(접속사)\u003c/span> : 앞 내용 + and + 뒤 내용 = 둘을 이어 줌 : \"그리고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">대명사(대명사)\u003c/span> : 다른 사람들(others) + 한다(choose) + 무엇을(plastic trees) : \"다른 사람들은 선택합니다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Some buy a real tree, 몇몇 사람들은 진짜 나무를 사고. from a tree farm, 나무 농장에서. and others choose, 다른 사람들은 선택합니다. plastic trees, 플라스틱 나무를. 이 문장 전체를 해석하면, 몇몇 사람들은 진짜 나무를 나무 농장에서 사고, 다른 사람들은 플라스틱 나무를 선택합니다.","hl":"m"},{"n":19,"text":"어떤 사람은 진짜 나무를 사고, 다른 사람은 플라스틱 나무를 골라요. 두 가지 방법을 나란히 알려 주는 문장이에요.","hl":"mn"},{"n":20,"text":"첫 번째로 대명사 Some이에요. 앞에 나온 사람들 중 몇몇을 가리키죠. 두 번째로 others, 다른 사람들이라는 대명사예요. 세 번째로 접속사 and가 두 가지를 이어 줘요. 오늘도 멋지게 해냈어요!","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">있습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">are\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 이야기가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">many \u003c/span>\u003cspan class=\"tgt\">stories\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">크리스마스트리 전통에 대한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">about \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">Christmas \u003c/span>\u003cspan class=\"tgt\">tree \u003c/span>\u003cspan class=\"tgt\">tradition\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">크리스마스트리 전통에 대한 많은 이야기가 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 크리스마스트리 전통에 관한 \u003cb class=\"key\">이야기\u003c/b>가 아주 많다는 것을 알려 주는 문장이에요. 그래서 다음 문장부터 그 이야기 중 하나를 소개해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">있어요 표현(There is/are)\u003c/span> : There are + 여러 개 = ~들이 있어요 : \"많은 이야기들이 있습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">많은 수 말하기(수량 표현 many)\u003c/span> : many + 셀 수 있는 복수(stories) = 많은 ~들 : \"많은 이야기들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">~에 관한(전치사 about)\u003c/span> : about + 무엇(tradition) = ~에 관한 : \"크리스마스트리 전통에 대한\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"There are, 있습니다. many stories, 많은 이야기가. about the Christmas tree tradition, 크리스마스트리 전통에 대한. 이 문장 전체를 해석하면, 크리스마스트리 전통에 대한 많은 이야기가 있습니다.","hl":"m"},{"n":22,"text":"이 문장은 크리스마스트리 전통에 관한 이야기가 아주 많다는 걸 알려 줘요. 그래서 다음 문장부터 그중 하나를 소개할 거예요.","hl":"mn"},{"n":23,"text":"첫 번째, 여러 개가 있다고 말할 때는 There are를 써요. 하나면 There is지만 이야기가 여럿이니까 There are예요. 두 번째, many는 셀 수 있는 것이 많을 때 쓰는 말이에요. 그래서 story에 s를 붙여 복수 모양인 stories라고 해요. 세 번째, about은 ~에 관한이라는 뜻으로 뒤에 주제를 붙여 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들 중 하나는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">One \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">them\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마틴 루터에 관한 것입니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is\u003c/span> about Martin Luther\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">독일 출신의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">Germany\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것들 중 하나는 독일 출신의 Martin Luther에 관한 것입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 말한 많은 이야기 중 \u003cb class=\"key\">하나\u003c/b>를 콕 집어 소개하는 문장이에요. 독일에서 온 마틴 루터에 관한 이야기라고 알려 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">여러 개 중 하나(one of + 복수)\u003c/span> : One of + 여러 개(them) = 그것들 중 하나 : \"그것들 중 하나는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">하나일 때 be동사 is(3인칭 단수 be동사)\u003c/span> : 하나(One) + 이다(is) : \"~입니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">출신 말하기(전치사 from)\u003c/span> : from + 나라 이름(Germany) = ~ 출신 : \"독일 출신의\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"One of them, 그것들 중 하나는. is about Martin Luther, 마틴 루터에 관한 것입니다. from Germany, 독일 출신의. 이 문장 전체를 해석하면, 그것들 중 하나는 독일 출신의 Martin Luther에 관한 것입니다.","hl":"m"},{"n":25,"text":"앞에서 이야기가 많다고 했죠? 그 많은 이야기 중 하나를 콕 집어 소개하는 문장이에요. 독일 출신의 마틴 루터 이야기래요.","hl":"mn"},{"n":26,"text":"첫 번째, One of them은 여러 개 중에 딱 하나라는 뜻이에요. 그래서 뒤에는 꼭 복수 모양이 와요. 두 번째, 고른 게 하나니까 주어가 하나예요. 그래서 be동사는 is를 써요. 세 번째, from은 출신을 알려 주는 말이에요. from Germany라고 하면 독일 출신이라는 뜻이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어느 겨울 저녁에\u003c/span>\u003cspan class=\"en\">One winter evening,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마틴 루터는\u003c/span>\u003cspan class=\"en\">Martin Luther\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상록수를 보았습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">saw\u003c/span> evergreens\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">별 아래에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">under \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">stars\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어느 겨울 저녁에, Martin Luther는 별 아래에서 상록수를 보았습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 마틴 루터가 어느 겨울 저녁에 \u003cb class=\"key\">별\u003c/b> 아래에 있는 \u003cb class=\"key\">상록수\u003c/b>를 본 장면을 그려 주는 문장이에요. 이 장면이 크리스마스트리 이야기의 시작이 돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말하기(과거형)\u003c/span> : 보다(see) → 보았다(saw) : \"보았습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">위치 말하기(전치사 under)\u003c/span> : under + 무엇(the stars) = ~ 아래에서 : \"별 아래에서\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"One winter evening, 어느 겨울 저녁에. Martin Luther, 마틴 루터는. saw evergreens, 상록수를 보았습니다. under the stars, 별 아래에서. 이 문장 전체를 해석하면, 어느 겨울 저녁에, Martin Luther는 별 아래에서 상록수를 보았습니다.","hl":"m"},{"n":28,"text":"마틴 루터가 어느 겨울 저녁에 별이 빛나는 밤 아래에서 상록수를 본 장면이에요. 이 장면에서 크리스마스트리 이야기가 시작돼요.","hl":"mn"},{"n":29,"text":"첫 번째, saw는 see의 과거형이에요. 지난 일을 말할 때는 동사를 과거형으로 바꿔요. 두 번째, under는 ~ 아래에라는 뜻으로 위치를 알려 줘요. 그래서 under the stars는 별 아래에서라는 뜻이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 10\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 후에\u003c/span>\u003cspan class=\"en\">After that,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 장식했어요\u003c/span>\u003cspan class=\"en\">he \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">decorated\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나무를\u003c/span>\u003cspan class=\"en\">a tree\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">양초로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">candles\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 후에 그는 양초로 나무를 장식했어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 별을 본 다음, 마틴 루터가 \u003cb class=\"key\">양초\u003c/b>로 나무를 꾸몄다는 뜻이에요. 앞 문장에 이어서 next \u003cb class=\"key\">행동\u003c/b>이 일어난 걸 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거형(규칙 과거형)\u003c/span> : 누가(he) + 했다(decorated) + 무엇을(a tree) : \"장식했어요(지난 일)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사(도구의 with)\u003c/span> : 하는 일 + with + 도구(candles) : \"양초로\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"After that, 그 후에. he decorated, 그는 장식했어요. a tree, 나무를. with candles, 양초로. 이 문장 전체를 해석하면, 그 후에 그는 양초로 나무를 장식했어요.","hl":"m"},{"n":31,"text":"별을 본 다음에 마틴 루터가 양초로 나무를 꾸몄다는 뜻이에요. 앞에서 본 장면 바로 다음에 일어난 행동이라서 흐름이 자연스럽게 이어져요.","hl":"mn"},{"n":32,"text":"첫 번째, decorated는 지난 일을 말하는 과거형이에요. 동사 decorate에 -ed를 붙여서 장식했어요가 된 거예요. 두 번째, with candles는 양초로, 하고 도구를 알려 주는 짝꿍 말이에요. 양초를 들고 나무를 꾸미는 그림을 그려 보세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 ~이었어요\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">첫 번째 사람\u003c/span>\u003cspan class=\"en\">the first person\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">빛을 더한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">add\u003c/span> lights\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">크리스마스트리에\u003c/span>\u003cspan class=\"en\">to a Christmas tree.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 최초로 크리스마스트리에 빛을 더한 사람이었지요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 마틴 루터가 크리스마스트리에 \u003cb class=\"key\">빛\u003c/b>을 더한 \u003cb class=\"key\">첫 \u003c/b>\u003cb class=\"key\">번째 \u003c/b>\u003cb class=\"key\">사람\u003c/b>이라는 뜻이에요. 그래서 오늘날에도 나무에 불을 켜는 거예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사(be동사 과거형)\u003c/span> : 주어(He) + was + 보어(the first person) : \"~이었어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사('to + 동사원형')\u003c/span> : the first person + to + 동사원형(add) : \"더한\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"He was, 그는 ~이었어요. the first person, 첫 번째 사람. to add lights, 빛을 더한. to a Christmas tree, 크리스마스트리에. 이 문장 전체를 해석하면, 그는 최초로 크리스마스트리에 빛을 더한 사람이었지요.","hl":"m"},{"n":34,"text":"마틴 루터가 크리스마스트리에 빛을 더한 첫 번째 사람이라는 뜻이에요. 그래서 오늘날 우리도 나무에 불을 켜는 거죠.","hl":"mn"},{"n":35,"text":"첫 번째, was는 is의 지난 모습이에요. 지금이 아니라 과거에 그랬다는 걸 알려 주죠. 두 번째, to add는 더하다는 동사원형 앞에 to를 붙인 to부정사예요. 사람 뒤에 붙어서 빛을 더한 사람, 하고 꾸며 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">독일인들이 가져갔어요\u003c/span>\u003cspan class=\"en\">Germans \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">took\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 전통을\u003c/span>\u003cspan class=\"en\">these traditions\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들과 함께\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">them\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 이주할 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">moved\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 나라로\u003c/span>\u003cspan class=\"en\">to other countries.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">독일인들이 다른 나라로 이주할 때 이 전통을 그들과 함께 가져갔어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 독일 사람들이 다른 나라로 옮겨 갈 때 이 \u003cb class=\"key\">전통\u003c/b>을 함께 챙겨 갔다는 뜻이에요. 그래서 크리스마스트리가 여러 나라로 퍼졌어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거형(불규칙 과거형)\u003c/span> : 주어(Germans) + took(가져갔다) + 목적어(these traditions) : \"가져갔어요(지난 일)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사(함께하는 with)\u003c/span> : with + 대명사(them) → 그들과 함께 : \"그들과 함께\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">접속사(when)\u003c/span> : when + 주어(they) + 동사(moved) → ~할 때 : \"그들이 이주할 때\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Germans took, 독일인들이 가져갔어요. these traditions, 이 전통을. with them, 그들과 함께. when they moved, 그들이 이주할 때. to other countries, 다른 나라로. 이 문장 전체를 해석하면, 독일인들이 다른 나라로 이주할 때 이 전통을 그들과 함께 가져갔어요.","hl":"m"},{"n":37,"text":"독일 사람들이 다른 나라로 이사할 때 이 전통을 함께 가지고 갔다는 뜻이에요. 그래서 크리스마스트리가 널리 퍼졌다는 거죠.","hl":"mn"},{"n":38,"text":"첫 번째, took은 take의 지난 모습이에요. -ed를 붙이지 않는 불규칙 동사라서 꼭 외워 두면 좋아요. 두 번째, with them에서 them은 Germans를 대신하는 대명사예요. 세 번째, when은 할 때, 하고 때를 알려 주는 접속사예요. 두 가지 일을 잘 이어 주는 착한 역할을 한답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">18세기 즈음에는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">By \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">18th \u003c/span>\u003cspan class=\"tgt\">century\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">있었어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">were\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">크리스마스트리들이\u003c/span>\u003cspan class=\"en\">Christmas trees\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유럽 곳곳에\u003c/span>\u003cspan class=\"en\">all over Europe.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">18세기 즈음에는 유럽 곳곳에 크리스마스트리가 있었답니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 18세기 즈음에 크리스마스트리가 유럽 곳곳에 퍼져 있었다는 뜻이에요. 크리스마스트리 \u003cb class=\"key\">전통\u003c/b>이 \u003cb class=\"key\">유럽 \u003c/b>\u003cb class=\"key\">전체\u003c/b>로 넓게 퍼졌다는 것을 알려 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간 짝꿍 말(전치사 by)\u003c/span> : By + 때(the 18th century) = 그때 즈음에는 : \"18세기 즈음에는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">있었어요 표현(There is/are의 과거형)\u003c/span> : 어디에(there) + 있었다(were) + 무엇이(Christmas trees) : \"크리스마스트리들이 있었어요\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"By the 18th century, 18세기 즈음에는. there were, 있었어요. Christmas trees, 크리스마스트리들이. all over Europe, 유럽 곳곳에. 이 문장 전체를 해석하면, 18세기 즈음에는 유럽 곳곳에 크리스마스트리가 있었답니다.","hl":"m"},{"n":40,"text":"이 문장은 십팔 세기 즈음에 크리스마스트리가 유럽 곳곳에 있었다는 걸 알려 줘요. 크리스마스트리 전통이 유럽 전체로 넓게 퍼졌다는 뜻이지요.","hl":"mn"},{"n":41,"text":"먼저 there were를 볼까요? 이건 '~이 있었다'라고 말할 때 쓰는 있었어요 표현이에요. 지금 이야기면 there are, 지난 이야기면 there were라고 바꿔요. 그리고 By는 때를 알려 주는 전치사예요. '즈음에는, 까지'라는 뜻으로 때 앞에 딱 붙죠. 마지막으로 all over는 '곳곳에'라는 뜻이라서 all over Europe은 유럽 곳곳에가 돼요. 여러분, 오늘도 아주 잘했어요!","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">오늘 배운 내용 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>크리스마스트리는 많은 나라의 \u003cb class=\"key\">전통\u003c/b>이고, 사람들은 휴일 동안 나무를 \u003cb class=\"key\">장식\u003c/b>해요.\u003c/li>\u003cli>사람들은 진짜 나무를 사기도 하고 \u003cb class=\"key\">플라스틱 \u003c/b>\u003cb class=\"key\">나무\u003c/b>를 고르기도 해요.\u003c/li>\u003cli>Martin Luther는 별 아래 상록수를 보고 \u003cb class=\"key\">양초\u003c/b>로 나무를 장식했어요.\u003c/li>\u003cli>이 전통은 독일인들을 따라 \u003cb class=\"key\">유럽 \u003c/b>\u003cb class=\"key\">곳곳\u003c/b>으로 퍼졌어요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The Christmas tree tradition began with Martin Luther in Germany and spread all over Europe.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">크리스마스트리는 많은 나라의 \u003cb class=\"key\">전통\u003c/b>으로, 사람들은 휴일 동안 나무를 \u003cb class=\"key\">장식\u003c/b>해요. 독일의 Martin Luther가 별 아래 \u003cb class=\"key\">상록수\u003c/b>를 보고 양초로 나무를 장식한 이야기가 오늘날 크리스마스트리 \u003cb class=\"key\">빛\u003c/b> 문화로 이어졌답니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":42,"text":"오늘 우리는 크리스마스트리 전통이 어떻게 시작되었는지 읽었어요. Martin Luther의 작은 생각이 온 유럽의 전통이 되었다는 게 정말 멋지죠? tradition, decorate, candle 같은 단어도 꼭 기억해 두세요. 오늘도 정말 잘했어요, 다음 시간에 또 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
