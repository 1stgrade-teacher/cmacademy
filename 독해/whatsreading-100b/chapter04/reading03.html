lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"왓츠 리딩 100B Ch.4 Unit 03 Apollo and Daphne","audioDir":"reading03_audio","preview":false,"count":57,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.468em\">Ch.4 Unit\u003cbr>03 Apollo\u003cbr>and Daphne\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">왓츠 리딩 100B\u003c/div>\u003ch1>Apollo and Daphne: The Arrows of Love\u003c/h1>\u003ch2>Apollo와 Daphne: 사랑의 화살\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">한 줄 요약\u003c/span>\u003cspan>Cupid가 Apollo에게 사랑의 화살을 쏘아 Apollo는 Daphne를 사랑하게 되지만, Daphne는 사랑을 싫어하게 되어요. 결국 Daphne는 \u003cb class=\"key\">월계수\u003c/b>가 되고, Apollo는 \u003cb class=\"key\">월계수 \u003c/b>\u003cb class=\"key\">왕관\u003c/b>을 써서 항상 그녀와 함께하려 해요.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Apollo loves Daphne because of Cupid's arrow, but Daphne hates love, so she becomes a bay tree and Apollo wears a crown to be with her.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 Cupid와 Apollo, Daphne가 나오는 재미있는 신화를 읽어 볼 거예요. Cupid의 화살 때문에 Apollo는 사랑에 빠지고 Daphne는 사랑을 싫어하게 되는 이야기죠. 함께 천천히 읽어 봐요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">미리 알면 쉬워요\u003c/span>\u003cdiv class=\"lp-box\">그리스와 로마 신화에는 자연과 사람의 마음을 맡은 신들이 많아요. Cupid는 \u003cb class=\"key\">사랑의 \u003c/b>\u003cb class=\"key\">신\u003c/b>, Apollo는 \u003cb class=\"key\">태양의 \u003c/b>\u003cb class=\"key\">신\u003c/b>이에요. 화살은 영어로 arrow라고 하고, 맞으면 마음이 변한다는 상상이 담겨 있어요. 친구가 초콜릿을 받으면 기분이 좋아지죠. 이 이야기에서는 \u003cb class=\"key\">화살\u003c/b>이 마음을 바꾸는 도구예요.\u003c/div>","segs":[{"n":2,"text":"그리스와 로마 신화에는 자연과 사람의 마음을 맡은 신들이 많아요. Cupid는 사랑의 신이고, Apollo는 태양의 신이에요. 화살은 영어로 arrow라고 해요. 여러분은 친구가 장난으로 쏜 화살을 상상해 본 적 있나요? 마치 초콜릿을 받으면 기분이 좋아지고 장난을 당하면 기분이 나빠지는 것과 비슷해요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>Cupid의 일\u003csmall>소개 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>Cupid는 \u003cb class=\"key\">사랑의 \u003c/b>\u003cb class=\"key\">신\u003c/b>이에요. 그의 일은 활과 화살로 사람들이 사랑에 빠지게 만드는 것이었어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>두 종류 화살\u003csmall>문제 · 문장 3–7\u003c/small>\u003c/h4>\u003cp>Apollo가 Cupid의 일을 \u003cb class=\"key\">존중하지 \u003c/b>\u003cb class=\"key\">않았어요\u003c/b>. 그래서 Cupid는 화가 나서 \u003cb class=\"key\">두 \u003c/b>\u003cb class=\"key\">종류의 \u003c/b>\u003cb class=\"key\">화살\u003c/b>을 준비했어요. Apollo에게는 사랑의 화살을, Daphne에게는 미움의 화살을 쐈죠.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>Daphne의 도움 요청\u003csmall>바뀜 · 문장 8–12\u003c/small>\u003c/h4>\u003cp>Apollo는 Daphne의 사랑을 얻으려고 멈추지 않았어요. Daphne는 그에게서 \u003cb class=\"key\">벗어나고 \u003c/b>\u003cb class=\"key\">싶어\u003c/b> 아버지에게 도움을 청했어요. 그래서 아버지는 Daphne를 \u003cb class=\"key\">월계수\u003c/b>로 변하게 했답니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>Apollo의 왕관\u003csmall>마무리 · 문장 13–15\u003c/small>\u003c/h4>\u003cp>Apollo는 Daphne가 나무가 되어 슬펐어요. 그래서 그 나무의 \u003cb class=\"key\">가지와 \u003c/b>\u003cb class=\"key\">잎\u003c/b>으로 왕관을 만들었어요. 항상 Daphne와 함께 있기 위해 그 \u003cb class=\"key\">왕관\u003c/b>을 썼답니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 이야기는 Cupid의 화살로 마음이 바뀌는 사건부터 시작해 Daphne가 월계수가 되고 Apollo가 왕관을 쓰는 순서로 이어져요.","hl":null},{"n":4,"text":"처음에는 Cupid가 사랑의 신이라고 소개해요. 그의 일은 활과 화살로 사람들이 사랑에 빠지게 만드는 것이었죠. 아주 중요한 시작 부분이에요.","hl":"f0"},{"n":5,"text":"어느 날 태양의 신 Apollo가 Cupid가 하는 일을 존중하지 않았어요. 그래서 Cupid는 화가 나서 두 종류의 화살을 준비했죠. Apollo에게는 사랑의 화살을, Daphne에게는 미움의 화살을 쐈어요.","hl":"f1"},{"n":6,"text":"Apollo는 Daphne의 사랑을 얻으려고 계속 노력했어요. 하지만 Daphne는 그에게서 벗어나고 싶어 했고, 결국 아버지에게 도움을 청했어요. 그래서 아버지는 Daphne를 월계수로 변하게 했답니다.","hl":"f2"},{"n":7,"text":"Apollo는 Daphne가 월계수가 되어서 슬펐어요. 그래서 그 나무의 가지와 잎으로 왕관을 만들었죠. 그리고 항상 Daphne와 함께 있기 위해 그 왕관을 썼답니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">이야기 순서\u003c/span>\u003cspan class=\"lp-pill\">가운데\u003c/span>\u003cspan class=\"lp-pill\">주제문 4번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 사건이 일어난 차례대로 이어지는 \u003cb class=\"key\">이야기 \u003c/b>\u003cb class=\"key\">순서\u003c/b> 글이에요. 가운데의 \u003cb class=\"key\">두 \u003c/b>\u003cb class=\"key\">종류 \u003c/b>\u003cb class=\"key\">화살\u003c/b>이 Apollo와 Daphne의 마음을 바꾸는 중심 사건이에요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>One day (3)\u003c/b>\u003cspan>때를 알려 줌\u003c/span>\u003cb>But (7)\u003c/b>\u003cspan>반대 내용을 이어 줌\u003c/span>\u003cb>but (9)\u003c/b>\u003cspan>반대 내용을 이어 줌\u003c/span>\u003cb>So (12)\u003c/b>\u003cspan>결과를 이어 줌\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">a river spirit\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Daphne\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">her\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Daphne's\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">She\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a bay tree\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the tree\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Apollo\u003c/th>\u003cth>Daphne\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Daphne를 사랑함\u003c/td>\u003ctd>사랑을 싫어함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>계속 따라감\u003c/td>\u003ctd>벗어나고 싶어 함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>월계수 왕관을 씀\u003c/td>\u003ctd>월계수가 됨\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 사건이 일어난 차례대로 이어지는 이야기 순서 글이에요. 처음에는 인물과 일이 소개되고, 가운데에는 두 종류 화살이라는 큰 사건이 나와요. 마지막에는 Daphne가 월계수가 되고 Apollo가 왕관을 쓰면서 이야기가 끝나요.","hl":"ty"},{"n":9,"text":"One day는 이야기가 시작되는 때를 알려 줘요. But은 앞 내용과 반대되는 마음을 보여 주고, So는 앞 일 때문에 생긴 결과를 이어 줘요. 같은 Daphne를 river spirit, she, a bay tree처럼 다르게 부르는 말도 잘 찾아보세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 단어\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>god\u003c/b>\u003cem>명사\u003c/em>\u003cspan>신\u003c/span>\u003c/div>\u003cdiv>\u003cb>love\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사랑\u003c/span>\u003c/div>\u003cdiv>\u003cb>bow\u003c/b>\u003cem>명사\u003c/em>\u003cspan>활\u003c/span>\u003c/div>\u003cdiv>\u003cb>arrow\u003c/b>\u003cem>명사\u003c/em>\u003cspan>화살\u003c/span>\u003c/div>\u003cdiv>\u003cb>respect\u003c/b>\u003cem>명사\u003c/em>\u003cspan>존중\u003c/span>\u003c/div>\u003cdiv>\u003cb>angry\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>화가 난\u003c/span>\u003c/div>\u003cdiv>\u003cb>prepare\u003c/b>\u003cem>동사\u003c/em>\u003cspan>준비하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>shoot\u003c/b>\u003cem>동사\u003c/em>\u003cspan>쏘다\u003c/span>\u003c/div>\u003cdiv>\u003cb>fall in love with\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~와 사랑에 빠지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>river spirit\u003c/b>\u003cem>명사\u003c/em>\u003cspan>강의 요정\u003c/span>\u003c/div>\u003cdiv>\u003cb>hate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>싫어하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>try\u003c/b>\u003cem>동사\u003c/em>\u003cspan>노력하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>cold\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>차가운, 냉담한\u003c/span>\u003c/div>\u003cdiv>\u003cb>get away\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>벗어나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>ask for help\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>도움을 청하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>turn into\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 변하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>branch\u003c/b>\u003cem>명사\u003c/em>\u003cspan>나뭇가지\u003c/span>\u003c/div>\u003cdiv>\u003cb>leaf\u003c/b>\u003cem>명사\u003c/em>\u003cspan>잎\u003c/span>\u003c/div>\u003cdiv>\u003cb>wear\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(옷·모자 등을) 쓰다, 입다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"오늘은 god, love, bow, arrow를 소리 내어 읽어 볼게요. god은 신, bow는 활, arrow는 화살이라는 뜻이에요. respect는 존중하다, prepare는 준비하다, shoot은 쏘다라는 뜻도 기억해요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">love\u003c/b>\u003cspan class=\"m\">사랑\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">like\u003c/span>\u003cspan class=\"s\">care for\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">angry\u003c/b>\u003cspan class=\"m\">화가 난\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">mad\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">calm\u003c/span>\u003cspan class=\"a\">happy\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">hate\u003c/b>\u003cspan class=\"m\">싫어하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">dislike\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">love\u003c/span>\u003cspan class=\"a\">like\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">cold\u003c/b>\u003cspan class=\"m\">차가운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">not warm\u003c/span>\u003cspan class=\"s\">not kind\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">warm\u003c/span>\u003cspan class=\"a\">kind\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">always\u003c/b>\u003cspan class=\"m\">항상\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">all the time\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">never\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"love는 like와 비슷하고 hate와 반대예요. angry는 mad와 비슷하고 calm과 반대죠. hate는 dislike와 비슷하고 love와 반대예요. always는 all the time과 비슷하고 never와 반대랍니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Cupid는 ~이었어요\u003c/span>\u003cspan class=\"en\">Cupid \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 신\u003c/span>\u003cspan class=\"en\">the god\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사랑의\u003c/span>\u003cspan class=\"en\">of love.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Cupid는 사랑의 신이었어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 \u003cb class=\"key\">Cupid\u003c/b>가 어떤 신인지 알려 줘요. 이야기의 인물과 \u003cb class=\"key\">사랑의 \u003c/b>\u003cb class=\"key\">신\u003c/b>이라는 핵심 낱말을 소개하는 첫 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">상태 말(be동사)\u003c/span> : Cupid + was + the god : \"Cupid는 신이었어요\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Cupid was, Cupid는 ~이었어요. the god, 그 신. of love, 사랑의. 이 문장 전체를 해석하면, Cupid는 사랑의 신이었어요.","hl":"m"},{"n":13,"text":"이 문장은 Cupid가 사랑의 신이라고 알려 줘요. 이야기의 인물과 핵심 낱말을 소개하는 첫 문장이에요.","hl":"mn"},{"n":14,"text":"여기서 was는 be동사의 과거 모양이에요. Cupid가 지난 이야기 속에서 신이었어요라고 상태를 말해 주죠. 그래서 과거를 나타낼 때 was를 써요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 일은\u003c/span>\u003cspan class=\"en\">His job\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~하게 만드는 것이었어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">make\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들이 사랑에 빠지게\u003c/span>\u003cspan class=\"en\">people fall in love\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 활로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">with\u003c/span> his bow\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 화살로\u003c/span>\u003cspan class=\"en\">and arrows.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그의 일은 활과 화살로 사람들이 사랑에 빠지게 만드는 것이었죠.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Cupid가 하는 일을 쉽게 풀어 줘요. \u003cb class=\"key\">활과 \u003c/b>\u003cb class=\"key\">화살\u003c/b>로 사람들을 \u003cb class=\"key\">사랑에 \u003c/b>\u003cb class=\"key\">빠지게\u003c/b> 만드는 게 그의 일이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">상태 말(be동사)\u003c/span> : His job + was + ... : \"그의 일은 ~이었어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">~하는 것(to부정사)\u003c/span> : to + make(동사원형) : \"만드는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">짝꿍 말(전치사)\u003c/span> : with + his bow and arrows : \"활과 화살로\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"His job, 그의 일은. was to make, ~하게 만드는 것이었어요. people fall in love, 사람들이 사랑에 빠지게. with his bow, 그의 활로. and arrows, 그리고 화살로. 이 문장 전체를 해석하면, 그의 일은 활과 화살로 사람들이 사랑에 빠지게 만드는 것이었죠.","hl":"m"},{"n":16,"text":"Cupid의 일은 활과 화살로 사람들이 사랑에 빠지게 만드는 것이에요. 이 문장이 Cupid의 일을 쉽게 알려 줘요.","hl":"mn"},{"n":17,"text":"먼저 was는 be동사의 과거 모양이에요. His job이 지난 일이라 과거로 말해요. 두 번째로 to make의 to부정사는 ~하는 것이라는 뜻이에요. to 뒤에는 꼭 동사원형 make가 와요. 세 번째로 with는 무엇으로를 알려 주는 전치사예요. 활과 화살이라는 도구를 소개하죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어느 날,\u003c/span>\u003cspan class=\"en\">One day,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">태양의 신,\u003c/span>\u003cspan class=\"en\">the god of the sun,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Apollo는 보여 주지 않았어요\u003c/span>\u003cspan class=\"en\">Apollo, \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">didn't \u003c/span>\u003cspan class=\"tgt\">show\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Cupid의 일에 대한 존중을\u003c/span>\u003cspan class=\"en\">respect for \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">Cupid's\u003c/span> job.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어느 날, 태양의 신 Apollo는 Cupid가 하는 일을 존중하지 않았어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 태양의 신 Apollo가 Cupid의 일을 \u003cb class=\"key\">존중\u003c/b>하지 않은 장면이에요. 이야기에서 \u003cb class=\"key\">갈등\u003c/b>이 시작되는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">안 ~하다(일반동사 부정문)\u003c/span> : Apollo + didn't + show : \"보여 주지 않았어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">~의 말(소유격)\u003c/span> : Cupid's + job : \"Cupid의 일\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"One day, 어느 날. the god of the sun, 태양의 신. Apollo, didn't show, Apollo는 보여 주지 않았어요. respect for Cupid's job, Cupid의 일에 대한 존중을. 이 문장 전체를 해석하면, 어느 날, 태양의 신 Apollo는 Cupid가 하는 일을 존중하지 않았어요.","hl":"m"},{"n":19,"text":"태양의 신 Apollo가 Cupid의 일을 존중하지 않았어요. 여기서 이야기의 갈등이 시작돼요.","hl":"mn"},{"n":20,"text":"먼저 didn't show는 보여 주지 않았어요라는 과거 부정문이에요. didn't 뒤에는 동사원형 show를 써요. 두 번째로 Cupid's는 Cupid의라는 뜻이에요. 이름 뒤에 's를 붙이면 소유격이 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Cupid는 화가 났어요\u003c/span>\u003cspan class=\"en\">Cupid \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">angry\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 준비했어요\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">prepared\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">두 종류의 화살을\u003c/span>\u003cspan class=\"en\">two kinds of arrows.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Cupid는 화가 나서 두 종류의 화살을 준비했지요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Cupid가 화가 나서 두 종류의 화살을 준비했다는 뜻이에요. 화살이 두 종류라는 점이 뒤 이야기의 \u003cb class=\"key\">시작\u003c/b>이 돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">am·are·is 친구들(be동사)\u003c/span> : 누가(Cupid) + 상태예요(was) + 화난(angry) : \"Cupid는 화가 났어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 준비했다(prepared) = prepare + ed : \"준비했어요\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Cupid was angry, Cupid는 화가 났어요. and prepared, 그리고 준비했어요. two kinds of arrows, 두 종류의 화살을. 이 문장 전체를 해석하면, Cupid는 화가 나서 두 종류의 화살을 준비했지요.","hl":"m"},{"n":22,"text":"Cupid가 화가 나서 두 종류의 화살을 준비했어요. 화살이 두 종류라는 게 아주 중요해요. 하나는 사랑에 빠지게 하고, 다른 하나는 사랑을 싫어하게 만들 거든요.","hl":"mn"},{"n":23,"text":"먼저 was는 is의 지난 모양인 be동사예요. 그래서 Cupid는 화가 났어요, 하고 지난 일로 말해요. 그리고 prepared에는 -ed가 붙었어요. -ed가 붙으면 이미 지난 일이 된답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 쐈어요\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">shot\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">화살 하나를\u003c/span>\u003cspan class=\"en\">an arrow\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Apollo에게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">Apollo\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 Apollo에게 화살 하나를 쐈어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Cupid가 Apollo에게 화살 하나를 쐈다는 뜻이에요. 이 \u003cb class=\"key\">화살\u003c/b>을 맞은 Apollo가 곧 사랑에 빠지게 돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 쐈어요(shot) = shoot의 지난 모양 : \"쐈어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소·시간 짝꿍 말(전치사)\u003c/span> : 쐈어요(shot) + ...에게(at) + Apollo : \"Apollo에게\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"He shot, 그는 쐈어요. an arrow, 화살 하나를. at Apollo, Apollo에게. 이 문장 전체를 해석하면, 그는 Apollo에게 화살 하나를 쐈어요.","hl":"m"},{"n":25,"text":"Cupid가 Apollo에게 화살을 하나 쐈어요. 이 화살을 맞으면 사랑에 빠지게 된답니다. 벌써부터 재미있죠?","hl":"mn"},{"n":26,"text":"먼저 shot은 shoot의 지난 모양이에요. -ed를 붙이지 않는 불규칙 동사라서 통째로 외워 두면 좋아요. 그리고 at은 화살이 날아간 대상을 알려 주는 전치사예요. 그래서 Apollo에게, Apollo를 향해서, 라고 해석해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 15\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Apollo는 사랑에 빠졌어요\u003c/span>\u003cspan class=\"en\">Apollo \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">fell \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">love \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">강의 요정과\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">with\u003c/span> a river spirit,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Daphne와\u003c/span>\u003cspan class=\"en\">Daphne.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Apollo는 강의 요정 Daphne와 사랑에 빠졌답니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Apollo가 강의 요정 Daphne와 사랑에 빠졌다는 뜻이에요. Cupid의 화살 덕분에 이야기가 본격적으로 \u003cb class=\"key\">시작\u003c/b>돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">덩어리 표현(숙어)\u003c/span> : 누가(Apollo) + 사랑에 빠졌어요(fell in love with) + 누구와(with) : \"사랑에 빠졌어요\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Apollo fell in love, Apollo는 사랑에 빠졌어요. with a river spirit, 강의 요정과. Daphne, Daphne와. 이 문장 전체를 해석하면, Apollo는 강의 요정 Daphne와 사랑에 빠졌답니다.","hl":"m"},{"n":28,"text":"Apollo가 강의 요정 Daphne와 사랑에 빠졌어요. Cupid가 쏜 화살을 맞았기 때문이죠. 이제 이야기가 정말 신나게 펼쳐져요.","hl":"mn"},{"n":29,"text":"먼저 fall in love with는 통째로 외워 두면 좋은 덩어리 표현이에요. 뜻은 ~와 사랑에 빠지다, 예요. 그리고 fell은 fall의 지난 모양이라서 빠졌어요, 하고 지난 일로 말해요. 아주 잘 따라오고 있어요!","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Cupid는 또 다른 화살을 쐈어요\u003c/span>\u003cspan class=\"en\">Cupid \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">shot\u003c/span> another arrow\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Daphne에게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">Daphne\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그런데 그 화살은 그녀를 ~하게 만들 뿐이었어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">but\u003c/span> it only made her\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사랑을 싫어하게\u003c/span>\u003cspan class=\"en\">hate love.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Cupid는 Daphne에게 또 다른 화살을 쐈는데, 그 화살은 그녀가 사랑을 싫어하게 만들 뿐이었죠.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Cupid가 쏜 두 번째 화살은 사랑이 아니라 \u003cb class=\"key\">미움\u003c/b>을 만들었어요. 하려던 일과 정반대 결과가 나온 \u003cb class=\"key\">반전\u003c/b>을 보여 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(Cupid) + 쐈다(shot) + 무엇을(another arrow) : \"쐈어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소·시간 짝꿍 말(전치사)\u003c/span> : 쏘다(shot) + …에게(at Daphne) : \"Daphne에게\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 앞 내용 + but(그런데) + 뒤 내용 : \"그런데\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Cupid shot another arrow, Cupid는 또 다른 화살을 쐈어요. at Daphne, Daphne에게. but it only made her, 그런데 그 화살은 그녀를 ~하게 만들 뿐이었어요. hate love, 사랑을 싫어하게. 이 문장 전체를 해석하면, Cupid는 Daphne에게 또 다른 화살을 쐈는데, 그 화살은 그녀가 사랑을 싫어하게 만들 뿐이었죠.","hl":"m"},{"n":31,"text":"Cupid가 쏜 화살은 사랑이 아니라 미움을 만들었어요. 그래서 이 문장은 앞의 계획과 반대로 된 반전을 보여 줍니다.","hl":"mn"},{"n":32,"text":"첫 번째, shot은 shoot의 과거형이에요. 이미 지난 일이라서 동사 모양이 바뀐 거죠. 두 번째, at은 화살이 날아간 곳을 알려 주는 전치사예요. at Daphne이라고 하면 Daphne에게라는 뜻이 돼요. 세 번째, but은 앞과 뒤를 반대로 이어 주는 접속사예요. 사랑을 만들려던 화살이 미움을 만들었다는 반전을 but이 딱 이어 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Apollo는 노력했어요\u003c/span>\u003cspan class=\"en\">Apollo \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">tried\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">얻으려고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">get\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Daphne의 사랑을\u003c/span>\u003cspan class=\"en\">Daphne's love.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Apollo는 Daphne의 사랑을 얻으려고 노력했어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Apollo가 Daphne의 \u003cb class=\"key\">사랑\u003c/b>을 얻으려고 애썼다는 뜻이에요. 이야기의 \u003cb class=\"key\">문제\u003c/b>가 본격적으로 시작되는 부분이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(Apollo) + 노력했다(tried) : \"노력했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to + 동사원형(to부정사)\u003c/span> : 하려고 했다(tried) + to + 하다(get) : \"얻으려고\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"Apollo tried, Apollo는 노력했어요. to get, 얻으려고. Daphne's love, Daphne의 사랑을. 이 문장 전체를 해석하면, Apollo는 Daphne의 사랑을 얻으려고 노력했어요.","hl":"m"},{"n":34,"text":"Apollo가 Daphne의 사랑을 얻으려고 애썼다는 뜻이에요. 이야기의 문제가 본격적으로 시작되는 부분이죠.","hl":"mn"},{"n":35,"text":"첫 번째, tried는 try의 과거형이에요. 지난 일이라서 y를 i로 바꾸고 ed를 붙였죠. 두 번째, to get처럼 to와 동사원형을 붙이면 '얻으려고'라는 뜻이 돼요. 이렇게 쓰는 to부정사는 하려는 행동을 뒤에 살짝 붙여 주는 아주 좋은 표현이에요. 여러분도 I tried to help처럼 써 볼 수 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Daphne는 차가웠어요\u003c/span>\u003cspan class=\"en\">Daphne \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">cold\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그에게\u003c/span>\u003cspan class=\"en\">to him,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그런데 그는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">but\u003c/span> he would\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">절대 멈추지 않았죠\u003c/span>\u003cspan class=\"en\">never stop.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Daphne는 그에게 차가웠지만, 그는 절대 멈추지 않았죠.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Daphne는 마음을 열지 않았지만 Apollo는 \u003cb class=\"key\">포기\u003c/b>하지 않았어요. 두 사람의 마음이 \u003cb class=\"key\">반대\u003c/b>라는 걸 보여 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사 지난 말(be동사 과거형)\u003c/span> : 누가(Daphne) + 이었다(was) + 차가운(cold) : \"차가웠어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 앞 문장 + but(그런데) + 뒤 문장 : \"그런데\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Daphne was cold, Daphne는 차가웠어요. to him, 그에게. but he would, 그런데 그는. never stop, 절대 멈추지 않았죠. 이 문장 전체를 해석하면, Daphne는 그에게 차가웠지만, 그는 절대 멈추지 않았죠.","hl":"m"},{"n":37,"text":"Daphne는 차가웠지만 Apollo는 포기하지 않았어요. 두 사람의 마음이 반대라는 걸 보여 주는 문장이에요.","hl":"mn"},{"n":38,"text":"첫 번째, was는 is의 과거형이에요. 지금이 아니라 그때의 마음을 말할 때 써요. 두 번째, but은 두 사람의 마음이 서로 반대라는 걸 이어 주는 접속사예요. 차가운 마음과 멈추지 않는 마음이 나란히 놓여 있어서 장면이 아주 잘 그려지죠. 여러분도 끝까지 포기하지 않는 멋진 사람이 되어 봐요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 원했어요\u003c/span>\u003cspan class=\"en\">She \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">wanted \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">벗어나기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">get \u003c/span>\u003cspan class=\"tgt\">away\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그에게서\u003c/span>\u003cspan class=\"en\">from \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">him\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 그에게서 벗어나고 싶었어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Daphne가 Apollo에게서 \u003cb class=\"key\">도망가고\u003c/b> 싶어 했다는 뜻이에요. 두 사람의 \u003cb class=\"key\">갈등\u003c/b>이 커지는 장면이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">want + to + 동사원형(to부정사)\u003c/span> : 누가(She) + 원했어요(wanted) + ~하기를(to get away) : \"벗어나고 싶었어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">대신하는 말(대명사) 목적격\u003c/span> : 전치사(from) + 그에게(him) : \"그에게서\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"She wanted, 그녀는 원했어요. to get away, 벗어나기를. from him, 그에게서. 이 문장 전체를 해석하면, 그녀는 그에게서 벗어나고 싶었어요.","hl":"m"},{"n":40,"text":"Daphne가 Apollo에게서 도망가고 싶었다는 뜻이에요. 두 사람의 갈등이 점점 커지는 장면이죠.","hl":"mn"},{"n":41,"text":"먼저 wanted to get away를 봐요. 원하는 마음을 말할 때는 want 뒤에 to부정사를 붙여요. 그래서 벗어나기를 원했어요, 즉 벗어나고 싶었어요가 되는 거예요. 두 번째, him은 그, 그를이라는 뜻이에요. 전치사 from 뒤에서는 He가 him으로 모습을 바꿔요. 그러니까 그에게서, 라고 해석하면 아주 자연스러워요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 청했어요\u003c/span>\u003cspan class=\"en\">She \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">asked\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀의 아버지에게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">her \u003c/span>\u003cspan class=\"tgt\">father \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">도움을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">help\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 자신의 아버지에게 도움을 청했어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Daphne가 혼자 힘으로 안 되자 아버지에게 \u003cb class=\"key\">도움\u003c/b>을 \u003cb class=\"key\">부탁\u003c/b>한 거예요. 이 부탁이 다음 문장의 변신으로 이어져요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(She) + 했어요(asked) + 무엇을 : \"청했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">ask + 사람 + for + 것(부탁하는 표현)\u003c/span> : 누가(She) + 청했어요(asked) + 누구에게(her father) + 무엇을(for help) : \"아버지에게 도움을 청했어요\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"She asked, 그녀는 청했어요. her father, 그녀의 아버지에게. for help, 도움을. 이 문장 전체를 해석하면, 그녀는 자신의 아버지에게 도움을 청했어요.","hl":"m"},{"n":43,"text":"Daphne가 혼자 힘으로 안 되자 아버지에게 도움을 부탁한 거예요. 이 부탁이 바로 다음 장면으로 이어집니다.","hl":"mn"},{"n":44,"text":"먼저 asked는 ask에 -ed를 붙인 과거형이에요. 지난 일이라서 이렇게 말해요. 그리고 ask A for B, 이 짝을 꼭 기억해요. 누구에게를 먼저 말하고, 무엇을은 for 뒤에 붙여요. 그래서 아버지에게 도움을 청했어요, 가 되는 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 15\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서 그는 Daphne를 변하게 했어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">So\u003c/span> he \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">turned \u003c/span>\u003cspan class=\"tgt\">Daphne \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">월계수로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">into \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">bay \u003c/span>\u003cspan class=\"tgt\">tree\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그래서 그녀의 아버지는 Daphne를 월계수로 변하게 했어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아버지의 도움으로 Daphne가 \u003cb class=\"key\">월계수\u003c/b> 나무가 되었다는 뜻이에요. 이야기가 슬픈 \u003cb class=\"key\">결말\u003c/b>로 바뀌는 장면이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 앞 문장 + So + 뒷 문장 : \"그래서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">turn + A + into + B(A를 B로 바꾸다)\u003c/span> : 누가(he) + 바꿨어요(turned) + 무엇을(Daphne) + 무엇으로(into a bay tree) : \"Daphne를 월계수로 바꿨어요\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"So he turned Daphne, 그래서 그는 Daphne를 변하게 했어요. into a bay tree, 월계수로. 이 문장 전체를 해석하면, 그래서 그녀의 아버지는 Daphne를 월계수로 변하게 했어요.","hl":"m"},{"n":46,"text":"아버지의 도움으로 Daphne가 월계수 나무가 되었다는 뜻이에요. 이야기가 슬픈 결말로 바뀌는 장면이죠.","hl":"mn"},{"n":47,"text":"먼저 So는 그래서, 라는 뜻으로 앞 문장과 뒷 문장을 이어 줘요. 그리고 두 번째, turn A into B를 기억해요. A를 B로 바꾼다는 짝이에요. 그래서 turned Daphne into a bay tree는 Daphne를 월계수로 바꿨어요, 가 돼요. 참, bay tree는 월계수 나무라는 뜻도 같이 외워 두면 좋아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Apollo는 ~였어요\u003c/span>\u003cspan class=\"en\">Apollo \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">슬펐어요\u003c/span>\u003cspan class=\"en\">sad.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Apollo는 슬펐어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Daphne가 나무가 된 뒤 Apollo가 \u003cb class=\"key\">슬펐다\u003c/b>는 뜻이에요. 짧지만 Apollo의 \u003cb class=\"key\">마음\u003c/b>을 잘 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사 과거형(be동사)\u003c/span> : 누가(Apollo) + ~였다(was) + 슬픈 상태(sad) : \"Apollo는 슬펐어요\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"Apollo was, Apollo는 ~였어요. sad, 슬펐어요. 이 문장 전체를 해석하면, Apollo는 슬펐어요.","hl":"m"},{"n":49,"text":"Daphne가 나무가 된 뒤에 Apollo의 마음은 아주 슬펐어요. 아주 짧은 문장이지만 Apollo의 마음이 잘 보여요.","hl":"mn"},{"n":50,"text":"여기서 짚을 것은 be동사의 과거형이에요. 첫 번째, 지금이 아니라 과거 이야기라서 is가 was로 바뀌었어요. 두 번째, was 뒤에는 sad처럼 기분을 나타내는 말이 와요. 그래서 Apollo는 슬펐어요라고 읽으면 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서 그는 만들었어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">So\u003c/span> he \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">made\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왕관을\u003c/span>\u003cspan class=\"en\">a crown\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몇몇 나뭇가지로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">some \u003c/span>\u003cspan class=\"tgt\">branches \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 잎으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">leaves\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 나무에서 난\u003c/span>\u003cspan class=\"en\">from the tree.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그래서 그는 그 나무에서 난 나뭇가지와 잎으로 왕관을 만들었어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Apollo가 슬픈 마음을 달래려고 그 나무의 \u003cb class=\"key\">가지와 \u003c/b>\u003cb class=\"key\">잎\u003c/b>으로 \u003cb class=\"key\">왕관\u003c/b>을 만들었다는 뜻이에요. 슬픈 마음이 \u003cb class=\"key\">슬픈 \u003c/b>\u003cb class=\"key\">마음\u003c/b> 그대로 드러나요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 앞 내용(슬펐어요) + 그래서(So) + 뒤 내용(만들었어요) : \"그래서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거형(불규칙)\u003c/span> : 누가(he) + 만들었다(made) + 무엇을(a crown) : \"만들었어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사(with)\u003c/span> : 만들었다(made) + 무엇으로(with) + 나뭇가지와 잎 : \"나뭇가지와 잎으로\"\u003c/div>\u003c/div>","segs":[{"n":51,"text":"So he made, 그래서 그는 만들었어요. a crown, 왕관을. with some branches, 몇몇 나뭇가지로. and leaves, 그리고 잎으로. from the tree, 그 나무에서 난. 이 문장 전체를 해석하면, 그래서 그는 그 나무에서 난 나뭇가지와 잎으로 왕관을 만들었어요.","hl":"m"},{"n":52,"text":"Daphne가 나무가 되었지만 Apollo는 그 나무의 가지와 잎으로 왕관을 만들었어요. 슬픈 마음을 담아 무언가를 만든 거예요.","hl":"mn"},{"n":53,"text":"첫 번째, 문장 앞의 So는 그래서라는 뜻으로 앞뒤 문장을 이어 줘요. 두 번째, made는 make의 과거형이에요. -ed를 붙이지 않는 불규칙 동사라서 꼭 외워 두세요. 세 번째, with는 여기서 나뭇가지와 잎으로처럼 재료를 말할 때 써요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 15 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 썼어요\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">wore\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 왕관을\u003c/span>\u003cspan class=\"en\">the crown\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">항상 있기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">always \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Daphne와 함께\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">Daphne\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">항상 Daphne와 함께 있기 위해 그는 그 왕관을 썼답니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Apollo가 Daphne와 \u003cb class=\"key\">함께\u003c/b> 있고 싶어서 왕관을 \u003cb class=\"key\">썼어요\u003c/b>. 이야기의 마지막 \u003cb class=\"key\">마음\u003c/b>이 담긴 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거형(불규칙)\u003c/span> : 누가(He) + 썼다(wore) + 무엇을(the crown) : \"썼어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사(to + 동사원형)\u003c/span> : to + be(~이다) + with Daphne(Daphne와 함께) : \"항상 Daphne와 함께 있기 위해\"\u003c/div>\u003c/div>","segs":[{"n":54,"text":"He wore, 그는 썼어요. the crown, 그 왕관을. to always be, 항상 있기 위해. with Daphne, Daphne와 함께. 이 문장 전체를 해석하면, 항상 Daphne와 함께 있기 위해 그는 그 왕관을 썼답니다.","hl":"m"},{"n":55,"text":"Apollo는 Daphne와 함께 있고 싶었어요. 그래서 나무로 만든 왕관을 썼어요. 이야기의 마지막 마음이 담긴 문장이에요.","hl":"mn"},{"n":56,"text":"첫 번째, wore는 wear의 과거형이에요. 모자나 왕관을 썼다고 할 때 쓰는 동사예요. 두 번째, to always be는 항상 있기 위해라는 뜻이에요. 왜 왕관을 썼는지 목적을 알려 주는 거죠. 세 번째, with는 여기서 Daphne와 함께라는 뜻으로 쓰였어요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">오늘 배운 내용 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>Cupid는 \u003cb class=\"key\">사랑의 \u003c/b>\u003cb class=\"key\">신\u003c/b>이고, Apollo는 \u003cb class=\"key\">태양의 \u003c/b>\u003cb class=\"key\">신\u003c/b>이에요.\u003c/li>\u003cli>Cupid가 쏜 \u003cb class=\"key\">두 \u003c/b>\u003cb class=\"key\">종류의 \u003c/b>\u003cb class=\"key\">화살\u003c/b> 때문에 Apollo는 사랑에 빠지고 Daphne는 사랑을 싫어했어요.\u003c/li>\u003cli>Daphne는 아버지의 도움으로 \u003cb class=\"key\">월계수\u003c/b>가 되었어요.\u003c/li>\u003cli>Apollo는 \u003cb class=\"key\">월계수 \u003c/b>\u003cb class=\"key\">왕관\u003c/b>을 써서 항상 Daphne와 함께하려 했어요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Apollo loves Daphne because of Cupid's arrow, but Daphne hates love, so she becomes a bay tree and Apollo wears a crown to be with her.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">Cupid가 Apollo에게 사랑의 화살을 쏘아 Apollo는 Daphne를 사랑하게 되지만, Daphne는 사랑을 싫어하게 되어요. 결국 Daphne는 \u003cb class=\"key\">월계수\u003c/b>가 되고, Apollo는 \u003cb class=\"key\">월계수 \u003c/b>\u003cb class=\"key\">왕관\u003c/b>을 써서 항상 그녀와 함께하려 해요.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":57,"text":"오늘은 Cupid의 두 화살 때문에 Apollo와 Daphne의 마음이 달라지는 이야기를 읽었어요. 사랑과 미움, 월계수, 월계수 왕관이라는 핵심 단어도 잘 기억해요. 여러분은 인물의 마음을 비교하며 읽는 방법을 배웠어요. 정말 잘했어요, 다음 시간에 또 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
