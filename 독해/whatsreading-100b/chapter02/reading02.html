</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"왓츠 리딩 100B Ch.2 Unit 02 Old Friends of Humans","audioDir":"reading02_audio","preview":false,"count":51,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.400em\">Ch.2 Unit 02\u003cbr>Old Friends\u003cbr>of Humans\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">왓츠 리딩 100B\u003c/div>\u003ch1>Old Friends of Humans: The Long History of Fungi\u003c/h1>\u003ch2>인류의 오랜 친구, 균류의 긴 역사\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">한 줄 요약\u003c/span>\u003cspan>\u003cb class=\"key\">균류\u003c/b>는 인류보다 먼저 지구에 있었고, 인류는 효모로 빵을 만들고 버섯을 재배했어요. 나중에는 곰팡이에서 \u003cb class=\"key\">페니실린\u003c/b>을 얻어 많은 \u003cb class=\"key\">생명\u003c/b>을 구했어요.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Fungi have helped humans in many ways, from making bread and growing mushrooms to saving lives with medicine.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 아주 오래전부터 인류와 함께 살아온 균류 이야기를 읽어 볼 거예요. 균류는 빵을 폭신하게 만들고, 버섯으로 자라고, 심지어 사람의 생명을 구하는 약이 되기도 했어요. 함께 신 나게 출발해 볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">미리 알면 쉬워요\u003c/span>\u003cdiv class=\"lp-box\">\u003cb class=\"key\">균류\u003c/b>는 버섯, 효모, 곰팡이처럼 넓은 가족을 말해요. 영어로 fungi라고 하고, 효모는 yeast라고 해요. 우리가 먹는 빵도 \u003cb class=\"key\">효모\u003c/b>라는 균류 덕분에 폭신해져요. 또 푸른\u003cb class=\"key\">곰팡이\u003c/b>에서 나온 약이 병을 고치기도 하죠. 어려운 말 같지만, 우리 교실에 있는 여러 도구가 저마다 다른 일을 하는 것처럼 균류도 여러 가지 일을 해요.\u003c/div>","segs":[{"n":2,"text":"여러분, 빵을 먹을 때 빵이 왜 그렇게 폭신한지 생각해 본 적 있나요? 균류는 버섯, 효모, 곰팡이처럼 넓은 가족을 말해요. 영어로는 fungi라고 하고, 효모는 yeast라고 해요. 우리가 먹는 빵도 효모라는 균류 덕분에 폭신해지고, 푸른곰팡이에서 나온 약은 병을 고치기도 해요. 여러 도구가 저마다 다른 일을 하는 것처럼, 균류도 먹을거리와 약까지 여러 가지 일을 한답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>인류보다 먼저\u003csmall>시작 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>균류는 \u003cb class=\"key\">인류\u003c/b>보다 먼저 지구에 있었어요. 기원전 10,000년에 인류는 균류를 처음 \u003cb class=\"key\">사용\u003c/b>하기 시작했고, 여러 가지 쓰임을 찾아냈어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>효모의 힘\u003csmall>바뀜 · 문장 4–7\u003c/small>\u003c/h4>\u003cp>고대 이집트인들은 납작한 플랫브레드를 먹었어요. 나중에 \u003cb class=\"key\">효모\u003c/b>를 찾아 빵을 구울 때 넣자, 빵이 가볍고 \u003cb class=\"key\">폭신\u003c/b>해지고 맛도 더 좋아졌어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>버섯 재배의 발전\u003csmall>발전 · 문장 8–11\u003c/small>\u003c/h4>\u003cp>고대 아즈텍 족과 이집트인들은 균류를 먹었지만 \u003cb class=\"key\">재배\u003c/b>하지는 않았어요. 1700년대에 이르러 사람들은 버섯을 기르는 법을 배웠고, 파리 동굴에서 \u003cb class=\"key\">버섯 \u003c/b>\u003cb class=\"key\">재배\u003c/b>가 \u003cb class=\"key\">큰 \u003c/b>\u003cb class=\"key\">사업\u003c/b>이 되었어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>약이 된 곰팡이\u003csmall>마무리 · 문장 12–14\u003c/small>\u003c/h4>\u003cp>사람들은 약에 \u003cb class=\"key\">곰팡이\u003c/b>를 쓰기도 했어요. Fleming 박사가 푸른곰팡이에서 \u003cb class=\"key\">페니실린\u003c/b>을 발견했고, 그것은 수백만의 \u003cb class=\"key\">생명\u003c/b>을 구했어요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 균류를 처음 사용한 때부터 약으로 쓰인 때까지, 시간 순서대로 이야기해요.","hl":null},{"n":4,"text":"첫 번째 단계에서는 균류가 인류보다 먼저 지구에 있었다는 사실부터 시작해요. 아주 오래전, 기원전 만 년쯤 인류는 균류를 처음 사용하기 시작했고, 여러 가지 쓰임을 찾아냈어요.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 고대 이집트인들이 먹던 플랫브레드가 나와요. 나중에 사람들은 효모를 찾아 빵을 구울 때 넣었고, 그 덕분에 빵이 가볍고 폭신해지고 맛도 더 좋아졌어요.","hl":"f1"},{"n":6,"text":"세 번째 단계에서는 고대 아즈텍 족과 이집트인들이 균류를 먹었지만 재배하지는 않았다는 내용이 나와요. 그 후 사람들은 버섯을 기르는 법을 배웠고, 파리 주변 동굴에서 버섯 재배가 큰 사업이 되었어요.","hl":"f2"},{"n":7,"text":"네 번째 단계에서는 사람들이 약에 곰팡이를 쓰고, Fleming 박사가 푸른곰팡이에서 페니실린을 발견하는 이야기가 나와요. 그 페니실린은 수백만의 생명을 구했답니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간 순서(이야기 순서)\u003c/span>\u003cspan class=\"lp-pill\">처음\u003c/span>\u003cspan class=\"lp-pill\">주제문 3번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 균류의 아주 오래전 시작에서 출발해, 효모와 빵, 버섯 재배, 약으로 쓰인 곰팡이까지 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">순서\u003c/b>대로 이어져요. 세 번째 문장이 '여러 가지 쓰임을 발견했다'는 \u003cb class=\"key\">주제문\u003c/b> 역할을 해요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>before (1)\u003c/b>\u003cspan>시간이 더 앞섬을 알려 줌\u003c/span>\u003cb>Later (5)\u003c/b>\u003cspan>다음 순서를 알려 줌\u003c/span>\u003cb>but (8)\u003c/b>\u003cspan>반대 내용을 이어 줌\u003c/span>\u003cb>Over the next 200 years (11)\u003c/b>\u003cspan>시간이 흐름을 알려 줌\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">fungi\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">them\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">yeast\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">mushrooms\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">mold\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 시간 순서로 이어지는 설명 글입니다. 중심 내용은 세 번째 문장에 있고, 균류를 여러 가지 방법으로 사용했다는 주제문 역할을 해요. 그래서 처음부터 끝까지 그다음에 무슨 일이 있었는지를 따라가며 읽으면 좋아요.","hl":"ty"},{"n":9,"text":"글의 길잡이 말을 찾아보면 흐름이 더 잘 보여요. before는 더 앞선 시간을, Later는 다음 순서를, but은 반대 내용을 알려 줘요. 또 Over the next two hundred years 같은 말은 시간이 길게 흐른다는 것을 알려 준답니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 단어\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>fungi\u003c/b>\u003cem>명사\u003c/em>\u003cspan>균류(버섯·효모·곰팡이 같은 생물)\u003c/span>\u003c/div>\u003cdiv>\u003cb>exist\u003c/b>\u003cem>동사\u003c/em>\u003cspan>존재하다, 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>human\u003c/b>\u003cem>명사\u003c/em>\u003cspan>인류, 사람\u003c/span>\u003c/div>\u003cdiv>\u003cb>start\u003c/b>\u003cem>동사\u003c/em>\u003cspan>시작하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>discover\u003c/b>\u003cem>동사\u003c/em>\u003cspan>발견하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>various\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>다양한\u003c/span>\u003c/div>\u003cdiv>\u003cb>ancient\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>고대의\u003c/span>\u003c/div>\u003cdiv>\u003cb>flatbread\u003c/b>\u003cem>명사\u003c/em>\u003cspan>납작빵\u003c/span>\u003c/div>\u003cdiv>\u003cb>yeast\u003c/b>\u003cem>명사\u003c/em>\u003cspan>효모\u003c/span>\u003c/div>\u003cdiv>\u003cb>bake\u003c/b>\u003cem>동사\u003c/em>\u003cspan>빵을 굽다\u003c/span>\u003c/div>\u003cdiv>\u003cb>airy\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>폭신한\u003c/span>\u003c/div>\u003cdiv>\u003cb>taste\u003c/b>\u003cem>동사\u003c/em>\u003cspan>맛이 나다, 맛\u003c/span>\u003c/div>\u003cdiv>\u003cb>grow\u003c/b>\u003cem>동사\u003c/em>\u003cspan>재배하다, 기르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>mushroom\u003c/b>\u003cem>명사\u003c/em>\u003cspan>버섯\u003c/span>\u003c/div>\u003cdiv>\u003cb>cave\u003c/b>\u003cem>명사\u003c/em>\u003cspan>동굴\u003c/span>\u003c/div>\u003cdiv>\u003cb>perfect\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>완벽한\u003c/span>\u003c/div>\u003cdiv>\u003cb>mold\u003c/b>\u003cem>명사\u003c/em>\u003cspan>곰팡이\u003c/span>\u003c/div>\u003cdiv>\u003cb>medicine\u003c/b>\u003cem>명사\u003c/em>\u003cspan>약, 의학\u003c/span>\u003c/div>\u003cdiv>\u003cb>penicillin\u003c/b>\u003cem>명사\u003c/em>\u003cspan>페니실린\u003c/span>\u003c/div>\u003cdiv>\u003cb>save\u003c/b>\u003cem>동사\u003c/em>\u003cspan>구하다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"오늘의 단어도 소리 내어 읽어 볼까요? fungi는 균류, yeast는 효모, medicine은 약이라는 뜻이에요. ancient는 고대의, perfect는 완벽한이라는 뜻이니 함께 읽어 봐요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">ancient\u003c/b>\u003cspan class=\"m\">고대의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">old\u003c/span>\u003cspan class=\"s\">very old\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">modern\u003c/span>\u003cspan class=\"a\">new\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">various\u003c/b>\u003cspan class=\"m\">다양한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">different\u003c/span>\u003cspan class=\"s\">many kinds\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">same\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">better\u003c/b>\u003cspan class=\"m\">더 좋은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">nicer\u003c/span>\u003cspan class=\"s\">improved\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">worse\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">perfect\u003c/b>\u003cspan class=\"m\">완벽한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">great\u003c/span>\u003cspan class=\"s\">ideal\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">bad\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">save\u003c/b>\u003cspan class=\"m\">구하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">rescue\u003c/span>\u003cspan class=\"s\">protect\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">lose\u003c/span>\u003cspan class=\"a\">harm\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"비슷한 말과 반대말도 정리해 볼게요. ancient는 old와 비슷하고 modern과 반대예요. various는 different와 비슷하고 same과 반대이며, better는 nicer와 비슷하고 worse와 반대예요. perfect는 great와 비슷하고 bad와 반대, save는 rescue와 비슷하고 lose와 반대랍니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">균류는 존재했습니다\u003c/span>\u003cspan class=\"en\">Fungi \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">existed\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지구에\u003c/span>\u003cspan class=\"en\">on Earth\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인류 이전에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">before \u003c/span>\u003cspan class=\"tgt\">humans\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">균류는 인류가 (존재하기) 이전에 지구에 존재했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 \u003cb class=\"key\">균류\u003c/b>가 \u003cb class=\"key\">인류\u003c/b>보다 먼저 지구에 있었다는 것을 알려 줘요. 글의 첫 문장으로 균류의 오랜 역사를 소개하는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(It) + 했어요(existed) + 언제(before) : \"존재했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">시간 짝꿍 말(전치사)\u003c/span> : 전치사(before) + 무엇(humans) = ~보다 먼저 : \"인류 이전에\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Fungi existed, 균류는 존재했습니다. on Earth, 지구에. before humans, 인류 이전에. 이 문장 전체를 해석하면, 균류는 인류가 (존재하기) 이전에 지구에 존재했습니다.","hl":"m"},{"n":13,"text":"이 문장은 균류가 인류보다 먼저 지구에 있었다는 걸 말해요. 글의 첫 문장으로 균류의 오랜 역사를 소개하고 있죠.","hl":"mn"},{"n":14,"text":"먼저 existed를 볼까요. 동사 exist에 d를 붙여서 과거형으로 썼어요. 지난 일을 말할 때 이렇게 써요. 그리고 before humans는 인류 이전에라는 뜻이에요. before가 시간을 알려 주는 전치사거든요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인류는 처음으로 시작했습니다\u003c/span>\u003cspan class=\"en\">Humans first \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">started \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">균류를 사용하기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">use\u003c/span> fungi\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기원전 10,000년에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">10,000 \u003c/span>\u003cspan class=\"tgt\">B.C.\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">인류는 기원전 10,000년에 처음으로 균류를 사용하기 시작했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 인류가 \u003cb class=\"key\">균류\u003c/b>를 쓰기 시작한 때가 아주 오래전이라는 걸 알려 줘요. \u003cb class=\"key\">기원전\u003c/b> 만 년이라는 시간 정보가 이 글의 첫 번째 열쇠예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사(to + 동사원형)\u003c/span> : 동사(started) + to + 동사원형(use) = ~하기 시작했다 : \"사용하기를 시작했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">시간 짝꿍 말(전치사)\u003c/span> : 전치사(in) + 연도 = 그때에 : \"기원전 10,000년에\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Humans first started, 인류는 처음으로 시작했습니다. to use fungi, 균류를 사용하기를. in 10,000 B.C, 기원전 10,000년에. 이 문장 전체를 해석하면, 인류는 기원전 10,000년에 처음으로 균류를 사용하기 시작했습니다.","hl":"m"},{"n":16,"text":"인류가 균류를 쓰기 시작한 때가 아주 오래전이라는 걸 알려 줘요. 기원전 만 년이라는 시간이 이 글의 첫 번째 열쇠예요.","hl":"mn"},{"n":17,"text":"먼저 started to use를 눈여겨보세요. start 뒤에 to와 동사원형을 붙이면 '하기 시작했다'가 돼요. started는 과거형이라 지난 일을 말하고 있죠. 그리고 연도 앞에 온 in은 시간을 알려 주는 전치사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 14\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 발견했어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">They\u003c/span> discovered\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다양한 방법을\u003c/span>\u003cspan class=\"en\">various ways\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들을 사용하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">use \u003c/span>\u003cspan class=\"tgt\">them\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 그것들을 사용하는 다양한 방법을 발견했어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 인류가 균류를 쓰는 \u003cb class=\"key\">여러 \u003c/b>\u003cb class=\"key\">가지 \u003c/b>\u003cb class=\"key\">방법\u003c/b>을 찾아냈다는 뜻이에요. 앞 문장의 \u003cb class=\"key\">균류\u003c/b> 이야기를 자연스럽게 이어 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">대신하는 말(대명사)\u003c/span> : They = 앞에 나온 humans : \"그들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사(to + 동사원형)\u003c/span> : 명사(ways) + to + 동사원형(use) = ~하는 방법 : \"그것들을 사용하는\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"They discovered, 그들은 발견했어요. various ways, 다양한 방법을. to use them, 그것들을 사용하는. 이 문장 전체를 해석하면, 그들은 그것들을 사용하는 다양한 방법을 발견했어요.","hl":"m"},{"n":19,"text":"인류가 균류를 쓰는 여러 가지 방법을 찾아냈다는 뜻이에요. 앞 문장의 균류 이야기를 자연스럽게 이어 주죠.","hl":"mn"},{"n":20,"text":"They는 앞에 나온 humans를 대신하는 대명사예요. 그래서 '그들'이 바로 인류를 말하죠. 그리고 to use them은 ways를 뒤에서 꾸며 주는 to부정사예요. '사용하는 방법'처럼 뒤에서 설명해 주는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고대 이집트인들은\u003c/span>\u003cspan class=\"en\">The ancient Egyptians\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">플랫브레드를 먹었습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">ate\u003c/span> flatbread.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">고대 이집트인들은 플랫브레드를 먹었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 고대 이집트인들이 납작한 빵인 \u003cb class=\"key\">플랫브레드\u003c/b>를 먹었다는 문장이에요. 효모를 쓰기 전 옛날 빵 이야기를 여는 장면이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(The ancient Egyptians) + 먹었다(ate) + 무엇을(flatbread) : \"먹었습니다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"The ancient Egyptians, 고대 이집트인들은. ate flatbread, 플랫브레드를 먹었습니다. 이 문장 전체를 해석하면, 고대 이집트인들은 플랫브레드를 먹었습니다.","hl":"m"},{"n":22,"text":"고대 이집트인들이 납작한 빵인 플랫브레드를 먹었다는 문장이에요. 효모를 쓰기 전 옛날 빵 이야기가 여기서 시작된답니다.","hl":"mn"},{"n":23,"text":"여기서 눈여겨볼 것은 ate예요. eat이 지난 일을 말할 때 ate로 바뀌었어요. 이렇게 지난 일 말 과거형은 모양이 확 달라지는 경우가 많으니 꼭 외워 두세요. eat, ate, 먹었다, 같이 소리 내어 말해 봐요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나중에,\u003c/span>\u003cspan class=\"en\">Later,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 효모를 발견했어요,\u003c/span>\u003cspan class=\"en\">they \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">found\u003c/span> yeast,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">균류의 일종인,\u003c/span>\u003cspan class=\"en\">a type of fungi,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그것을 사용했어요\u003c/span>\u003cspan class=\"en\">and used \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">it\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 빵을 구웠을 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">baked\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나중에, 그들은 균류의 일종인 효모를 발견하여 빵을 구울 때 그것을 사용했어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이집트인들이 \u003cb class=\"key\">균류\u003c/b>의 한 종류인 \u003cb class=\"key\">효모\u003c/b>를 발견해서 빵을 구울 때 썼다는 문장이에요. 사람들이 효모를 알게 된 아주 중요한 장면이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 그들은(they) + 발견했다(found) + 효모를(yeast) : \"발견했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">대신하는 말(대명사)\u003c/span> : it = 앞에 나온 yeast : \"그것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : when + 누가 하던 때(they baked) : \"그들이 빵을 구웠을 때\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Later, 나중에. they found yeast, 그들은 효모를 발견했어요. a type of fungi, 균류의 일종인. and used it, 그리고 그것을 사용했어요. when they baked, 그들이 빵을 구웠을 때. 이 문장 전체를 해석하면, 나중에, 그들은 균류의 일종인 효모를 발견하여 빵을 구울 때 그것을 사용했어요.","hl":"m"},{"n":25,"text":"이집트인들이 균류의 한 종류인 효모를 발견하고, 빵을 구울 때 그것을 썼다는 뜻이에요. 사람들이 효모를 알게 된 아주 중요한 장면이죠.","hl":"mn"},{"n":26,"text":"첫 번째, find의 과거형은 found예요. 그래서 found yeast, 효모를 발견했어요, 가 된답니다. 두 번째, 앞에 나온 yeast를 다시 말하지 않고 it으로 짧게 대신했어요. 세 번째, when은 할 때라는 뜻으로 때를 이어 주는 말이에요. 오늘 배운 found, it, when 세 가지를 꼭 기억해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">효모는\u003c/span>\u003cspan class=\"en\">Yeast\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 빵을 만들었어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">made\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">their\u003c/span> bread\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가볍고 폭신하게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">light \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">airy\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">효모는 그들의 빵을 가볍고 폭신하게 만들었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 효모 덕분에 빵이 \u003cb class=\"key\">가볍고 \u003c/b>\u003cb class=\"key\">폭신\u003c/b>해졌다는 문장이에요. 효모를 쓰기 전 납작한 빵과 어떻게 다른지 알려 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 효모가(Yeast) + 만들었다(made) + 빵을(their bread) : \"만들었어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">소유격 대명사(소유격)\u003c/span> : their + bread = 그들의 빵 : \"그들의\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">꾸며 주는 말(형용사)\u003c/span> : 빵(bread) + 가볍고(light) + 폭신한(airy) : \"가볍고 폭신한\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Yeast, 효모는. made their bread, 그들의 빵을 만들었어요. light and airy, 가볍고 폭신하게. 이 문장 전체를 해석하면, 효모는 그들의 빵을 가볍고 폭신하게 만들었습니다.","hl":"m"},{"n":28,"text":"효모 덕분에 빵이 가볍고 폭신해졌다는 뜻이에요. 예전의 납작한 빵과는 아주 달라졌다는 걸 알려 주는 문장이죠.","hl":"mn"},{"n":29,"text":"먼저 make의 과거형은 made예요. 지난 일이라서 made를 썼어요. 그리고 their는 그들의라는 뜻으로 뒤에 오는 bread를 꾸며 줘요. 마지막으로 light and airy는 빵이 어떤지 알려 주는 형용사 두 개를 and로 이은 거예요. 여러분도 가볍고 폭신한 빵을 떠올리며 소리 내어 읽어 봐요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 또한\u003c/span>\u003cspan class=\"en\">It also\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 빵을 만들었어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">made\u003c/span> the bread\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">맛이 더 좋게\u003c/span>\u003cspan class=\"en\">taste \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">better \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">플랫브레드보다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">flatbread\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 또한 그 빵을 플랫브레드보다 맛이 더 좋게 만들었지요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이스트 덕분에 빵이 가볍고 폭신해진 데다 맛까지 더 좋아졌다는 \u003cb class=\"key\">내용\u003c/b>이에요. 바로 앞 문장에 \u003cb class=\"key\">내용\u003c/b>을 하나 더 보태 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 지난 일 + 만들었어요(made) : \"만들었어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">더 ~한(비교급)\u003c/span> : 더 좋은(better) + 보다(than) + 무엇보다(flatbread) : \"플랫브레드보다 더 좋게\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"It also, 그것은 또한. made the bread, 그 빵을 만들었어요. taste better, 맛이 더 좋게. than flatbread, 플랫브레드보다. 이 문장 전체를 해석하면, 그것은 또한 그 빵을 플랫브레드보다 맛이 더 좋게 만들었지요.","hl":"m"},{"n":31,"text":"이스트 덕분에 빵이 폭신해진 데다 맛까지 더 좋아졌다는 내용이에요. 앞 문장에 내용을 하나 더 보태 주는 문장이죠.","hl":"mn"},{"n":32,"text":"먼저 made를 눈여겨보세요. make의 과거형이라서 지난 일을 말하고 있어요. 다음으로 better than이 나오는데, better는 더 좋은, than은 보다라는 뜻이라서 비교급 표현이에요. 플랫브레드보다 맛이 더 좋다고 콕 집어 비교해 주는 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고대 아즈텍 족은\u003c/span>\u003cspan class=\"en\">The ancient Aztecs\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 이집트인들은\u003c/span>\u003cspan class=\"en\">and Egyptians\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">균류를 먹었어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">ate\u003c/span> fungi,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 그것들을 재배하지는 않았어요\u003c/span>\u003cspan class=\"en\">but \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">didn't \u003c/span>\u003cspan class=\"tgt\">grow\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">them\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">고대 아즈텍 족과 이집트인들은 균류를 먹긴 했지만, 그것들을 재배하지는 않았습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 옛날 사람들이 균류를 먹기는 했지만 직접 \u003cb class=\"key\">재배\u003c/b>하지는 않았다는 뜻이에요. 그래서 다음에 나오는 \u003cb class=\"key\">재배\u003c/b> 이야기로 자연스럽게 이어져요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 옛날에 + 먹었어요(ate) : \"먹었어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">안 ~한다고 말하기(부정문)\u003c/span> : 안 ~했어요(didn't) + 기르다(grow) : \"재배하지 않았어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">대신하는 말(대명사)\u003c/span> : 그것들을(them) = 균류(fungi) : \"그것들을\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"The ancient Aztecs, 고대 아즈텍 족은. and Egyptians, 그리고 이집트인들은. ate fungi, 균류를 먹었어요. but didn't grow them, 하지만 그것들을 재배하지는 않았어요. 이 문장 전체를 해석하면, 고대 아즈텍 족과 이집트인들은 균류를 먹긴 했지만, 그것들을 재배하지는 않았습니다.","hl":"m"},{"n":34,"text":"옛날 사람들이 균류를 먹기는 했지만 직접 기르지는 않았다는 뜻이에요. 그래서 다음에 재배 이야기가 나오는 거죠.","hl":"mn"},{"n":35,"text":"먼저 ate는 eat의 과거형이에요. 그래서 지난 일을 말하고 있죠. 다음으로 didn't grow를 보세요. didn't 뒤에는 동사원형이 와서 부정문을 만들어요. 그래서 그것들을 재배하지는 않았다는 뜻이 되는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1700년대에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">In \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">1700s,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인류는 배웠어요\u003c/span>\u003cspan class=\"en\">humans \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">learned \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">버섯을 재배하는 법을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">grow\u003c/span> mushrooms.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">1700년대에 인류는 버섯을 재배하는 법을 배웠어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 1700년대에 이르러서야 사람들이 버섯을 직접 \u003cb class=\"key\">재배\u003c/b>하는 방법을 배웠다는 \u003cb class=\"key\">내용\u003c/b>이에요. 앞에서 재배하지 않았다던 이야기와 이어지는 변화예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">장소·시간 짝꿍 말(전치사)\u003c/span> : 시간(in) + 천칠백 년대(the 1700s) : \"1700년대에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to + 동사원형(to부정사)\u003c/span> : 배웠어요(learned) + ~하는 것을(to grow) : \"재배하는 법을 배웠어요\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"In the 1700s, 1700년대에. humans learned, 인류는 배웠어요. to grow mushrooms, 버섯을 재배하는 법을. 이 문장 전체를 해석하면, 1700년대에 인류는 버섯을 재배하는 법을 배웠어요.","hl":"m"},{"n":37,"text":"천칠백 년대에 이르러서야 사람들이 버섯을 직접 재배하는 방법을 배웠다는 내용이에요. 앞에서 재배하지 않았다던 이야기와 이어지는 변화죠.","hl":"mn"},{"n":38,"text":"먼저 In the 1700s를 보세요. in은 시간을 알려 주는 전치사라서 천칠백 년대라는 때를 콕 짚어 줘요. 다음으로 learned to grow를 보세요. to부정사인 to grow가 배운 대상을 알려 줘요. 그래서 버섯을 재배하는 법을 배웠다는 뜻이 되는 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 동굴들은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Many \u003c/span>\u003cspan class=\"tgt\">caves\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">파리 주변에 있는\u003c/span>\u003cspan class=\"en\">around Paris\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">완벽한 재배 환경을 갖추고 있었죠\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">had\u003c/span> perfect growing conditions\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">버섯에 맞는\u003c/span>\u003cspan class=\"en\">for mushrooms.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">파리 주변에 있는 많은 동굴들은 버섯에 맞는 완벽한 재배 환경을 갖추고 있었죠.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 파리 주변 동굴이 버섯을 기르기에 아주 좋은 곳이었다는 뜻이에요. 버섯 \u003cb class=\"key\">재배\u003c/b>가 퍼지게 된 까닭을 알려 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">여럿을 말하는 이름 말(복수 명사)\u003c/span> : 여럿(Many) + 이름 말(caves) + s : \"많은 동굴들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(Many caves) + 했다(had) + 무엇을(conditions) : \"갖추고 있었다\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"Many caves, 많은 동굴들은. around Paris, 파리 주변에 있는. had perfect growing conditions, 완벽한 재배 환경을 갖추고 있었죠. for mushrooms, 버섯에 맞는. 이 문장 전체를 해석하면, 파리 주변에 있는 많은 동굴들은 버섯에 맞는 완벽한 재배 환경을 갖추고 있었죠.","hl":"m"},{"n":40,"text":"파리 주변 동굴이 버섯을 기르기에 아주 좋은 곳이었다는 뜻이에요. 버섯 재배가 퍼지게 된 까닭을 알려 주는 문장이에요.","hl":"mn"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 후\u003c/span>\u003cspan class=\"en\">Over the next\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">200년 동안\u003c/span>\u003cspan class=\"en\">200 years,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">버섯을 기르는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">growing \u003c/span>\u003cspan class=\"tgt\">mushrooms\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">되었습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">became\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">'큰 사업'이\u003c/span>\u003cspan class=\"en\">&quot;big business.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 후 200년 동안 버섯 재배는 '큰 사업'이 되었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 버섯을 기르는 일이 200년 동안 돈을 버는 \u003cb class=\"key\">큰 \u003c/b>\u003cb class=\"key\">사업\u003c/b>으로 커졌다는 뜻이에요. 버섯 재배가 아주 중요해졌다는 걸 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사-ing가 이름 말처럼 쓰임(동명사)\u003c/span> : 동사(grow) + ing = 이름 말(growing) + 무엇을(mushrooms) : \"버섯을 기르는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 무엇이(growing mushrooms) + 되었다(became) + 무엇이(big business) : \"되었다\"\u003c/div>\u003c/div>","segs":[{"n":41,"text":"Over the next, 그 후. 200 years, 200년 동안. growing mushrooms, 버섯을 기르는 것은. became, 되었습니다. \"big business.\", '큰 사업'이. 이 문장 전체를 해석하면, 그 후 200년 동안 버섯 재배는 '큰 사업'이 되었습니다.","hl":"m"},{"n":42,"text":"버섯을 기르는 일이 200년 동안 돈을 버는 큰 사업으로 커졌다는 뜻이에요. 버섯 재배가 아주 중요해졌다는 걸 보여 줘요.","hl":"mn"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들은 사용했어요\u003c/span>\u003cspan class=\"en\">People \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">used\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">약간의 곰팡이를\u003c/span>\u003cspan class=\"en\">some mold\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">약에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">medicine\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사람들은 약에 곰팡이를 사용했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사람들이 \u003cb class=\"key\">약\u003c/b>을 만들 때 \u003cb class=\"key\">곰팡이\u003c/b>를 썼다는 뜻이에요. 다음 문장의 페니실린 이야기로 이어지는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(People) + 했다(used) + 무엇을(some mold) : \"사용했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소·짝꿍 말(전치사)\u003c/span> : 전치사(in) + 이름 말(medicine) : \"약에\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"People used, 사람들은 사용했어요. some mold, 약간의 곰팡이를. in medicine, 약에. 이 문장 전체를 해석하면, 사람들은 약에 곰팡이를 사용했습니다.","hl":"m"},{"n":44,"text":"사람들이 약을 만들 때 곰팡이를 썼다는 뜻이에요. 다음 문장의 페니실린 이야기로 이어지는 문장이에요.","hl":"mn"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Fleming 박사는\u003c/span>\u003cspan class=\"en\">Dr. Fleming\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">페니실린을 발견했어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">discovered\u003c/span> penicillin\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">푸른곰팡이에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">green \u003c/span>\u003cspan class=\"tgt\">mold\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Fleming 박사는 푸른곰팡이에서 페니실린을 발견했어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Fleming 박사가 \u003cb class=\"key\">푸른곰팡이\u003c/b>에서 \u003cb class=\"key\">페니실린\u003c/b>이라는 약을 발견했다는 뜻이에요. 작은 곰팡이가 사람을 살리는 약의 시작이 된 거예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(Dr. Fleming) + 했어요(discovered) + 무엇을(penicillin) : \"발견했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소·시간 짝꿍 말(전치사)\u003c/span> : 어디서(from) + 무엇에서(green mold) : \"푸른곰팡이에서\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"Dr. Fleming, Fleming 박사는. discovered penicillin, 페니실린을 발견했어요. from green mold, 푸른곰팡이에서. 이 문장 전체를 해석하면, Fleming 박사는 푸른곰팡이에서 페니실린을 발견했어요.","hl":"m"},{"n":46,"text":"이 문장은 Fleming 박사가 푸른곰팡이에서 페니실린을 발견했다고 말해요. 작은 곰팡이가 사람을 살리는 약이 된 아주 중요한 순간이죠.","hl":"mn"},{"n":47,"text":"첫째, discovered는 discover에 ed를 붙인 과거형이에요. 지나간 일이라서 과거형으로 말해요. 둘째, from은 장소나 출발점을 알려 주는 전치사예요. 그래서 푸른곰팡이에서라는 뜻이 돼요. 여러분도 문장을 소리 내어 읽어 보세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 14\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 페니실린은\u003c/span>\u003cspan class=\"en\">The penicillin\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수백만의 생명을 구했어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">saved\u003c/span> millions of \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">lives\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">페니실린은 수백만의 생명을 구했답니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 페니실린이라는 약이 \u003cb class=\"key\">수백만\u003c/b>의 \u003cb class=\"key\">생명\u003c/b>을 구했다는 뜻이에요. 그래서 곰팡이가 사람에게 아주 고마운 존재라는 걸 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 무엇이(The penicillin) + 했어요(saved) + 무엇을(millions of lives) : \"구했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">여러 개를 말하는 말(복수)\u003c/span> : many(수백만의) + 생명들(lives) : \"생명들\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"The penicillin, 그 페니실린은. saved millions of lives, 수백만의 생명을 구했어요. 이 문장 전체를 해석하면, 페니실린은 수백만의 생명을 구했답니다.","hl":"m"},{"n":49,"text":"이 문장은 페니실린이 수백만의 생명을 구했다고 말해요. 곰팡이에서 나온 약이 정말 많은 사람을 살린 거예요.","hl":"mn"},{"n":50,"text":"첫째, saved는 save에 d를 붙인 과거형이에요. 이미 지나간 일을 말할 때 이렇게 해요. 둘째, lives는 life의 복수형이에요. 생명이 여러 개라서 lives라고 한답니다. 오늘도 문장을 크게 읽어 보세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">오늘 배운 내용 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>균류는 \u003cb class=\"key\">인류\u003c/b>보다 먼저 지구에 있었어요.\u003c/li>\u003cli>고대 사람들은 \u003cb class=\"key\">효모\u003c/b>로 빵을 폭신하게 만들었어요.\u003c/li>\u003cli>1700년대에는 \u003cb class=\"key\">버섯 \u003c/b>\u003cb class=\"key\">재배\u003c/b>가 큰 사업이 되었어요.\u003c/li>\u003cli>푸른곰팡이에서 나온 \u003cb class=\"key\">페니실린\u003c/b>이 많은 생명을 구했어요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Fungi have helped humans in many ways, from making bread and growing mushrooms to saving lives with medicine.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">\u003cb class=\"key\">균류\u003c/b>는 인류보다 먼저 지구에 있었고, 인류는 효모로 빵을 만들고 버섯을 재배했어요. 나중에는 곰팡이에서 \u003cb class=\"key\">페니실린\u003c/b>을 얻어 많은 \u003cb class=\"key\">생명\u003c/b>을 구했어요.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":51,"text":"오늘 우리는 균류가 인류의 오랜 친구라는 것을 배웠어요. 효모는 빵을 폭신하게 했고, 버섯 재배는 큰 사업이 되었고, 페니실린은 많은 생명을 구했어요. 시간 순서를 나타내는 말을 찾으며 다시 읽으면 내용이 더 쉽게 기억날 거예요. 정말 잘했어요, 다음 시간에 또 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
