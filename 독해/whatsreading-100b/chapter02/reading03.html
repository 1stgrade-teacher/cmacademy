</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"왓츠 리딩 100B Ch.2 Unit 03 A Day in the Woods","audioDir":"reading03_audio","preview":false,"count":72,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.425em\">Ch.2 Unit\u003cbr>03 A Day in\u003cbr>the Woods\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">왓츠 리딩 100B\u003c/div>\u003ch1>A Day in the Woods: The Puffball Surprise\u003c/h1>\u003ch2>숲속에서의 하루: 말불버섯 이야기\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">한 줄 요약\u003c/span>\u003cspan>엄마와 나는 가끔 함께 숲에서 버섯을 찾으며 지내요. 어느 날 내가 실수로 밟은 \u003cb class=\"key\">말불버섯\u003c/b>은 오히려 \u003cb class=\"key\">포자\u003c/b>가 사방으로 퍼지도록 도움을 받아서, 나는 기분이 좋아졌어요.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Stepping on puffballs helps their spores spread everywhere, so it is actually good for the mushrooms.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘도 만나서 정말 반가워요. 오늘은 숲에서 버섯을 찾는 아이의 이야기를 읽어 볼 거예요. 제목은 A Day in the Woods, 숲속에서의 하루예요. 실수로 밟은 버섯이 사실은 도움이 되었다는 재미있는 이야기랍니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">미리 알면 쉬워요\u003c/span>\u003cdiv class=\"lp-box\">버섯은 숲에서 스스로 자라는 생물이에요. 버섯은 \u003cb class=\"key\">포자(spore)\u003c/b>라는 아주 작은 가루로 새끼를 퍼뜨려요. 포자는 씨앗(seed)처럼 새 버섯이 자라게 해 주는 것이에요. 말불버섯은 밟으면 연기처럼 포자가 폴폭 퍼져 나와요. 우리가 발로 \u003cb class=\"key\">풍선\u003c/b>을 밟아 터뜨리는 모습과 아주 비슷하답니다.\u003c/div>","segs":[{"n":2,"text":"먼저 버섯에 대해 알아볼까요? 버섯은 숲에서 스스로 자라는 생물이에요. 버섯은 포자라는 아주 작은 가루로 새끼를 퍼뜨려요. 포자는 씨앗처럼 새 버섯을 자라게 해 주지요. 여러분은 풍선을 발로 밟아 본 적 있나요? 말불버섯은 그 풍선처럼 포자를 폴폭 퍼뜨린답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>버섯을 찾는 우리\u003csmall>시작 · 문장 1–4\u003c/small>\u003c/h4>\u003cp>엄마와 나는 가끔 함께 \u003cb class=\"key\">숲에서 \u003c/b>\u003cb class=\"key\">버섯을 \u003c/b>\u003cb class=\"key\">찾아요\u003c/b>. 엄마는 몇 개를 직장에 가져가 \u003cb class=\"key\">연구\u003c/b>하시고, 나는 사진을 찍어요. 집에 오면 책을 보며 버섯의 이름을 \u003cb class=\"key\">알아내려고\u003c/b> 해요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>숲에서 생긴 일\u003csmall>문제 · 문장 5–10\u003c/small>\u003c/h4>\u003cp>어느 날 숲에서 나는 오래된 나무 쪽으로 걷다가 무언가를 \u003cb class=\"key\">밟았어요\u003c/b>. 아래를 보니 발 주위에 \u003cb class=\"key\">작고 \u003c/b>\u003cb class=\"key\">둥근 \u003c/b>\u003cb class=\"key\">하얀 \u003c/b>\u003cb class=\"key\">덩어리\u003c/b>들이 있었어요. 엄마가 그것이 \u003cb class=\"key\">말불버섯\u003c/b>이라고 알려 주셨어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>미안한 마음\u003csmall>이유 · 문장 11–14\u003c/small>\u003c/h4>\u003cp>나는 그것들을 다치게 했다고 생각해서 \u003cb class=\"key\">기분이 \u003c/b>\u003cb class=\"key\">안 \u003c/b>\u003cb class=\"key\">좋아졌어요\u003c/b>. 그런데 엄마는 걱정하지 말라고 하셨어요. 말불버섯은 \u003cb class=\"key\">밟히는 \u003c/b>\u003cb class=\"key\">것을 \u003c/b>\u003cb class=\"key\">좋아한다\u003c/b>고 하셨어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>도움이 된 발걸음\u003csmall>해결 · 문장 15–20\u003c/small>\u003c/h4>\u003cp>밟으면 \u003cb class=\"key\">포자\u003c/b>가 사방으로 퍼져서 버섯이 더 많이 자라요. 그래서 나는 사실 버섯이 \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">자라도록 \u003c/b>\u003cb class=\"key\">도와준\u003c/b> 것이었어요. 기분이 좋아진 나는 더 많은 말불버섯을 밟으며 즐거운 시간을 보냈어요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 이제 이야기가 어떤 순서로 흘러가는지 함께 살펴볼까요?","hl":null},{"n":4,"text":"먼저 첫 번째 단계예요. 엄마와 나는 가끔 함께 숲에서 버섯을 찾아요. 엄마는 몇 개를 직장에 가져가서 연구하시고, 나는 사진을 찍지요. 집에 오면 책을 보며 버섯 이름을 알아내려고 한답니다.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 숲에서 재미있는 일이 생겨요. 어느 날 나는 오래된 나무 쪽으로 걷다가 무언가를 밟았어요. 아래를 보니 발 주위에 작고 둥근 하얀 덩어리들이 있었어요. 엄마가 와서 보시더니 그건 말불버섯이라고 알려 주셨어요.","hl":"f1"},{"n":6,"text":"세 번째 단계에서는 내 마음이 슬퍼져요. 나는 그것들을 다치게 했다고 생각해서 기분이 안 좋아졌어요. 그런데 엄마가 걱정하지 말라고 하셨어요. 말불버섯은 밟히는 것을 좋아한다고 하셨지요.","hl":"f2"},{"n":7,"text":"마지막 단계에서는 기분이 다시 좋아져요. 밟으면 포자가 사방으로 퍼져서 버섯이 더 많이 자란대요. 그래서 나는 사실 버섯이 더 자라도록 도와준 것이었어요. 기분이 좋아진 나는 더 많은 말불버섯을 밟으며 아주 즐거운 시간을 보냈답니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">이야기 순서(처음-가운데-끝)\u003c/span>\u003cspan class=\"lp-pill\">끝\u003c/span>\u003cspan class=\"lp-pill\">주제문 15번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 내가 숲에서 겪은 일을 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">순서\u003c/b>대로 들려줘요. 처음에는 버섯을 찾는 평소 모습이 나오고, 가운데에서 무언가를 밟은 일이 생겨요. 마지막에 엄마의 말로 \u003cb class=\"key\">밟는 \u003c/b>\u003cb class=\"key\">것이 \u003c/b>\u003cb class=\"key\">도움이 \u003c/b>\u003cb class=\"key\">된다\u003c/b>는 것을 알게 되면서 내 기분이 바뀌어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>One day (5)\u003c/b>\u003cspan>이야기가 시작되는 날을 알려 줌\u003c/span>\u003cb>When (6)\u003c/b>\u003cspan>그때 어떤 일이 있었는지 알려 줌\u003c/span>\u003cb>Then (11)\u003c/b>\u003cspan>다음에 일어난 일을 순서대로 이어 줌\u003c/span>\u003cb>actually (17)\u003c/b>\u003cspan>생각과 다르게 사실은 이렇다고 알려 줌\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">mushrooms\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">them\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">little round white balls\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">puffballs\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 내가 겪은 일을 시간 순서대로 들려주는 이야기예요. 처음에 버섯을 찾는 평소 모습이 나오고, 가운데에서 무언가를 밟는 일이 생기고, 끝에서 그 일이 사실은 좋은 일이었다는 걸 알게 돼요. 그래서 이 글의 중심 문장은 끝부분에 있다고 말할 수 있어요.","hl":"ty"},{"n":9,"text":"글의 길잡이 말도 눈여겨보세요. One day는 이야기가 시작되는 날을 알려 주고, When은 그때 어떤 일이 있었는지 알려 줘요. Then은 다음에 일어난 일을 순서대로 이어 주고, actually는 생각과 다르게 사실은 이렇다고 알려 준답니다. 또 같은 버섯을 them이라고 하고, little round white balls라고도 하고, puffballs라고도 다르게 부른다는 점도 기억해요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 단어\u003c/span>\u003cdiv cla pore는 포자, everywhere는 사방에라는 뜻이고 grow는 자라다라는 뜻이랍니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">look for\u003c/b>\u003cspan class=\"m\">찾다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">search for\u003c/span>\u003cspan class=\"s\">hunt for\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">lose\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">identify\u003c/b>\u003cspan class=\"m\">알아내다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">find out\u003c/span>\u003cspan class=\"s\">figure out\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">worry\u003c/b>\u003cspan class=\"m\">걱정하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">be afraid\u003c/span>\u003cspan class=\"s\">feel nervous\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">relax\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">everywhere\u003c/b>\u003cspan class=\"m\">사방에\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">all around\u003c/span>\u003cspan class=\"s\">here and there\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">nowhere\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">grow\u003c/b>\u003cspan class=\"m\">자라다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">get bigger\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">shrink\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"비슷한 말과 반대말도 정리해 볼까요? look for와 비슷한 말은 search for예요. identify는 find out과 비슷하고, worry의 반대말은 relax예요. everywhere와 반대되는 말은 nowhere이고요. grow는 get bigger와 비슷한 말이랍니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 20\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">엄마와 나는\u003c/span>\u003cspan class=\"en\">Mom \u003cspan class=\"mk\">1\u003c/span>\u003c >2\u003c/span>\u003cspan class=\"tgt\">them\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 그것들의 사진을 찍어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 내가 버섯들의 사진을 찍는다는 뜻이에요. 엄마는 버섯을 가져가고 나는 사진을 찍는, 둘의 다른 점을 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지금 하는 일 말하기(현재형)\u003c/span> : 나는(I) + 해요(take) : \"나는 찍어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">대신하는 말(대명사)\u003c/span> : them = 앞에 나온 여러 개(mushrooms) : \"그것들\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"I take, 나는 찍어요. photos of them, 그것들의 사진을. 이 문장 전체를 해석하면, 나는 그것들의 사진을 찍어요.","hl":"m"},{"n":19,"text":"내가 버섯들의 사진을 찍는다는 뜻이에요. 엄마는 버섯을 가져가고 나는 사진을 찍는 거죠.","hl":"mn"},{"n":20,"text":"먼저 현재형을 봐요. 늘 하는 일은 동사를 그대로 써서 I take라고 해요. 두 번째로 them을 봐요. them은 앞에서 나온 버섯들처럼 여러 개를 대신하는 말이에요. 그래서 photos of them은 그것들의 사진이 되는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 20\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">집에 와서,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">come \u003c/span>\u003cspan class=\"tgt\">home,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 책을 들여다보며\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">look\u003c/span> in books\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 애써요\u003c/span>\u003cspan class=\"en\">and try\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들이 모두 무엇인지 알아내려고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">identify\u003c/span> them all.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">집에 와서, 나는 책을 들여다보며 그것들이 모두 무엇인지 알아내려고 해요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 집에 와서 책을 보며 버섯 사진이 무엇인지 모두 알아내는 장면이에요. 숲에서 본 것을 \u003cb class=\"key\">책\u003c/b>으로 확인하는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : ~할 때(When) + 누가(I) + 한다(come) + 집에(home) : \"내가 집에 올 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재형(현재)\u003c/span> : 누가(I) + 한다(look) + 책에서(in books) : \"들여다봐요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to + 동사원형(to부정사)\u003c/span> : try + to + 하다(identify) = ~하려고 애쓰다 : \"알아내려고\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"When I come home, 집에 와서. I look in books, 나는 책을 들여다보며. and try, 그리고 애써요. to identify them all, 그것들이 모두 무엇인지 알아내려고. 이 문장 전체를 해석하면, 집에 와서, 나는 책을 들여다보며 그것들이 모두 무엇인지 알아내려고 해요.","hl":"m"},{"n":22,"text":"이 문장은 집에 와서 책을 보며 버섯 이름을 알아내는 장면을 보여 줘요.","hl":"mn"},{"n":23,"text":"첫째, when은 두 일을 이어 주는 말이고 때를 알려 줘요. 둘째, look은 늘 하는 일이라 현재형으로 써요. 셋째, to identify는 to부정사로 알아내려고 애쓰다는 뜻이에요. 여러분도 책에서 모르는 것을 찾아보면 좋아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 20\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어느 날,\u003c/span>\u003cspan class=\"en\">One day,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 있었어요\u003c/span>\u003cspan class=\"en\">we \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">were\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">숲속에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">woods\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어느 날, 우리는 숲속에 있었어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 어느 날 엄마와 내가 숲속에 있었던 때를 알려 줘요. 앞으로 일어날 \u003cb class=\"key\">이야기\u003c/b>의 시작을 알려 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사의 과거형(과거형)\u003c/span> : 우리(we) + 있었다(were) + 숲속에(in the woods) : \"있었어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소 짝꿍 말(전치사)\u003c/span> : in + 숲(the woods) = 숲속에 : \"숲속에\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"One day, 어느 날. we were, 우리는 있었어요. in the woods, 숲속에. 이 문장 전체를 해석하면, 어느 날, 우리는 숲속에 있었어요.","hl":"m"},{"n":25,"text":"이 문장은 앞으로 일어날 이야기의 시작을 알려 줘요.","hl":"mn"},{"n":26,"text":"첫째, were는 are의 과거형이에요. 지난 일을 말하니까 were를 써요. 둘째, in은 장소를 알려 주는 짝꿍 말이고, the woods는 숲이라는 뜻이에요. 아주 짧지만 이야기의 문을 여는 중요한 문장이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 20\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내가 걷고 있었을 때\u003c/span>\u003cspan class=\"en\">When I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">walking\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오래된 나무 쪽으로\u003c/span>\u003cspan class=\"en\">toward an old tree,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 밟았어요\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">stepped\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무언가 위를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">something\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 오래된 한 나무 쪽으로 걸어가고 있었을 때, 무언가를 밟았습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 오래된 나무 쪽으로 걷고 있을 때 무언가를 밟은 장면이에요. 다음에 이상한 것을 보게 되는 \u003cb class=\"key\">이야기\u003c/b>의 시작이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">그때 ~하는 중(진행형)\u003c/span> : 누가(I) + was + 하고 있었다(walking) : \"걷고 있었어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거형(과거)\u003c/span> : 누가(I) + 밟았어요(stepped) + 무엇을(on something) : \"밟았어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">장소 짝꿍 말(전치사)\u003c/span> : on + 무엇(something) = 무엇 위에 : \"무언가 위를\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"When I was walking, 내가 걷고 있었을 때. toward an old tree, 오래된 나무 쪽으로. I stepped, 나는 밟았어요. on something, 무언가 위를. 이 문장 전체를 해석하면, 나는 오래된 한 나무 쪽으로 걸어가고 있었을 때, 무언가를 밟았습니다.","hl":"m"},{"n":28,"text":"이 문장은 오래된 나무 쪽으로 걷다가 무언가를 밟은 장면을 보여 줘요.","hl":"mn"},{"n":29,"text":"첫째, was walking은 그때 걷고 있었어요라는 뜻이에요. was 뒤에 walking을 붙여서 하는 중을 만들어요. 둘째, stepped는 step의 과거형이에요. 지난 일이라 과거형으로 써요. 셋째, on은 위를 알려 주는 짝꿍 말이고, something은 무언가라는 뜻이에요. 다음 이야기가 아주 궁금해지죠?","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 20\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 아래를 보았어요\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">looked \u003c/span>\u003cspan class=\"tgt\">down\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 작고 둥근\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">saw\u003c/span> little round\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하얀 덩어리들을 보았어요\u003c/span>\u003cspan class=\"en\">white balls\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내 발 주위에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">around \u003c/span>\u003cspan class=\"tgt\">my \u003c/span>\u003cspan class=\"tgt\">foot\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">아래를 보니 내 발 주위에 작고 둥근 하얀 덩어리들을 보았어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 고개를 숙여 \u003cb class=\"key\">아래를 \u003c/b>\u003cb class=\"key\">보니\u003c/b>, 내 \u003cb class=\"key\">발 \u003c/b>\u003cb class=\"key\">주위\u003c/b>에 작고 둥근 하얀 덩어리들이 있었어요. 걸어가다 밟은 것이 무엇인지 \u003cb class=\"key\">확인\u003c/b>하는 장면이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(I) + 했어요(looked) + 아래를(down) : \"아래를 보았어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 보았어요(looked) + 그리고(and) + 보았어요(saw) : \"그리고 보았어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">장소·시간 짝꿍 말(전치사)\u003c/span> : 주위에(around) + 내(my) + 발(foot) : \"내 발 주위에\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"I looked down, 나는 아래를 보았어요. and saw little round, 그리고 작고 둥근. white balls, 하얀 덩어리들을 보았어요. around my foot, 내 발 주위에. 이 문장 전체를 해석하면, 아래를 보니 내 발 주위에 작고 둥근 하얀 덩어리들을 보았어요.","hl":"m"},{"n":31,"text":"고개를 숙여 아래를 보니, 내 발 주위에 작고 둥근 하얀 덩어리들이 있었어요. 걸어가다가 밟은 것이 무엇인지 확인하는 장면이에요.","hl":"mn"},{"n":32,"text":"첫 번째로 looked는 지난 일을 말하는 과거형이에요. 이미 지나간 일이라 look이 아니라 looked를 써요. 이렇게 지난 일을 말할 때는 동사의 모양이 바뀌어요. 두 번째로 and는 두 가지 일을 이어 주는 접속사예요. 아래를 보고, 그리고 보았다, 두 동작을 한 문장으로 묶어 줘요. 마지막으로 around는 주위에라는 뜻이에요. 내 발을 중심으로 둘레를 말할 때 써요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 20\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">엄마가 오셨어요\u003c/span>\u003cspan class=\"en\">Mom \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">came\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 보셨어요\u003c/span>\u003cspan class=\"en\">and looked.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">엄마가 와서 보셨어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 엄마가 \u003cb class=\"key\">다가와서\u003c/b> 내가 본 것을 같이 봐 주셨어요. 내 \u003cb class=\"key\">옆에서\u003c/b> 함께 확인한 장면이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(Mom) + 왔어요(came) : \"오셨어요\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"Mom came, 엄마가 오셨어요. and looked, 그리고 보셨어요. 이 문장 전체를 해석하면, 엄마가 와서 보셨어요.","hl":"m"},{"n":34,"text":"엄마가 다가와서 내가 본 것을 같이 봐 주셨어요. 내 옆에서 함께 확인한 장면이에요.","hl":"mn"},{"n":35,"text":"여기서 눈여겨볼 것은 came이에요. come의 지난 일 말은 came이에요. e가 a로 모양이 바뀌어요. 그리고 두 가지 일을 and로 이어서 왔다, 그리고 봤다라고 말한 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 20\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 말했어요 &quot;아, 네가 찾았구나 말불버섯을!&quot;\u003c/span>\u003cspan class=\"en\">She \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">said\u003c/span>, &quot;Oh, you \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">found \u003c/span>\u003cspan class=\"tgt\">puffballs\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">엄마는 &quot;아, 네가 말불버섯을 찾았구나!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 엄마가 내가 밟은 것이 \u003cb class=\"key\">말불버섯\u003c/b>이라고 \u003cb class=\"key\">알려 \u003c/b>\u003cb class=\"key\">주셨어요\u003c/b>. 놀란 나에게 엄마가 반갑게 말한 장면이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\"> 의미\u003c/b> 밟으면 말불버섯의 \u003cb class=\"key\">포자\u003c/b>가 \u003cb class=\"key\">사방에\u003c/b> 퍼져서, 내가 오히려 도와준 셈이라는 걸 알려 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">한 개일 때 동사 + s(3인칭 단수)\u003c/span> : 그것은(It) + 하게 해요(makes) + 포자들이 가게 : \"하게 해요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">누구의(소유격)\u003c/span> : 그것들의(their) + 포자들(spores) : \"그것들의\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">더 자세히 알려 주는 말(부사)\u003c/span> : 가요(go) + 사방에(everywhere) : \"사방에\"\u003c/div>\u003c/div>","segs":[{"n":54,"text":"It makes, 그것은 하게 해요. their spores, 그것들의 포자들이. go everywhere!\", 사방에 퍼지게!. 이 문장 전체를 해석하면, 그것들의 포자들이 사방에 퍼지게 하니까 말이야!\"","hl":"m"},{"n":55,"text":"밟으면 말불버섯의 포자가 사방에 퍼져서, 내가 오히려 도와준 셈이라는 걸 알려 줘요.","hl":"mn"},{"n":56,"text":"첫 번째로 주어 It이 한 개라서 make에 s가 붙었어요. 두 번째로 their는 말불버섯들의 것을 가리키는 소유격이에요. 세 번째로 everywhere는 go가 어디로 가는지 사방에라고 더 자세히 알려 주는 말이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 16 / 20\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">포자는 이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Spores \u003c/span>\u003cspan class=\"tgt\">are\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">씨앗과 같은\u003c/span>\u003cspan class=\"en\">like seeds\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">버섯에게는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">mushrooms\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">포자는 버섯의 씨앗과 같은 것이에요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 포자가 버섯에게는 씨앗과 같다고 알려 주는 문장이에요. 어려운 낱말 \u003cb class=\"key\">포자\u003c/b>를 \u003cb class=\"key\">씨앗\u003c/b>에 빗대어 쉽게 설명해 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">am·are·is 친구들(be동사)\u003c/span> : 무엇이(Spores) + 이다(are) + 무엇과 같은(like seeds) : \"포자는 씨앗과 같아요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소·시간 짝꿍 말(전치사)\u003c/span> : 무엇을 위한(for) + 무엇(mushrooms) : \"버섯을 위한\"\u003c/div>\u003c/div>","segs":[{"n":57,"text":"Spores are, 포자는 이다. like seeds, 씨앗과 같은. for mushrooms, 버섯에게는. 이 문장 전체를 해석하면, 포자는 버섯의 씨앗과 같은 것이에요.","hl":"m"},{"n":58,"text":"이 문장은 포자가 버섯에게 씨앗 같은 존재라고 알려 줘요. 어려운 말 포자를 씨앗에 빗대어 설명해 주는 아주 친절한 문장이죠.","hl":"mn"},{"n":59,"text":"자, 문법을 짚어 볼게요. 첫 번째, Spores are에서 are를 봐요. 포자는 여럿이라서 is가 아니라 are를 써요. 두 번째, for mushrooms에서 for는 무엇을 위한이라는 뜻의 전치사예요. 전치사는 이름 말 앞에 짝꿍처럼 붙는다는 것, 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 17 / 20\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 사실\u003c/span>\u003cspan class=\"en\">I actually\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들을 도왔어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">helped\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">them\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 많이 자라도록!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">grow \u003c/span>\u003cspan class=\"tgt\">more\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사실 나는 그것들이 더 많이 자라도록[번식하도록] 도왔던 것이었어요!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 내가 밟은 일이 사실은 포자가 퍼지도록 도와준 일이었다는 걸 깨닫는 문장이에요. 그래서 \u003cb class=\"key\">기분\u003c/b>이 나아지기 시작해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거형(과거형)\u003c/span> : 나는(I) + 도왔다(helped) : \"도왔어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">대신하는 말(대명사)\u003c/span> : 그것들(them) = 앞에 나온 포자들 : \"그것들을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">더 ~한(비교급)\u003c/span> : 더 많이(more) + 자라다(grow) : \"더 많이 자라다\"\u003c/div>\u003c/div>","segs":[{"n":60,"text":"I actually, 나는 사실. helped them, 그것들을 도왔어요. grow more!, 더 많이 자라도록!. 이 문장 전체를 해석하면, 사실 나는 그것들이 더 많이 자라도록[번식하도록] 도왔던 것이었어요!","hl":"m"},{"n":61,"text":"이 문장은 내가 한 일이 사실은 포자를 도와준 일이었다는 깨달음을 보여 줘요. 그래서 마음이 조금씩 가벼워지기 시작하죠.","hl":"mn"},{"n":62,"text":"문법을 하나씩 볼게요. 첫 번째, helped는 지난 일이라서 동사에 -ed를 붙인 과거형이에요. 두 번째, them은 앞에 나온 포자들을 가리키는 대명사예요. 세 번째, grow more는 더 많이 자라다라는 뜻이고, more가 비교급을 만들어 줘요. help 다음에는 동사원형 grow가 온다는 것도 함께 기억해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 18 / 20\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 느꼈어요\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">felt\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 좋다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">better\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 기분이 나아졌어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 포자를 도왔다는 걸 알고 나서 마음이 좋아졌다는 것을 보여 주는 문장이에요. 짧지만 \u003cb class=\"key\">기분\u003c/b>이 밝아지는 문장이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거형(과거형)\u003c/span> : 나는(I) + 느꼈다(felt) : \"느꼈어요, 기분이 ~했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">더 ~한(비교급)\u003c/span> : 좋은(good) → 더 좋은(better) : \"더 좋은, 더 나은\"\u003c/div>\u003c/div>","segs":[{"n":63,"text":"I felt, 나는 느꼈어요. better, 더 좋다고. 이 문장 전체를 해석하면, 나는 기분이 나아졌어요.","hl":"m"},{"n":64,"text":"이 문장은 포자를 도왔다는 걸 알고 나서 기분이 좋아졌다는 것을 보여 줘요. 짧지만 마음이 환해지는 문장이죠.","hl":"mn"},{"n":65,"text":"문법을 짚어 볼게요. 첫 번째, felt는 feel의 과거형이에요. 지난 일이라서 felt를 썼어요. 두 번째, better는 good의 비교급이에요. more good이 아니라 better라고 한다는 것, 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 19 / 20\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러고 나서 나는\u003c/span>\u003cspan class=\"en\">Then I\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">밟았어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">stepped\u003c/span> on\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 많은 말불버섯을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">more\u003c/span> puffballs.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그리고 나서 나는 더 많은 말불버섯을 밟았어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 말불버섯을 밟으면 도움이 된다는 걸 안 뒤에, 재미있어서 더 많이 밟았다는 말이에요. \u003cb class=\"key\">지난 \u003c/b>\u003cb class=\"key\">일\u003c/b>이라서 동사에 \u003cb class=\"key\">-ed\u003c/b>를 붙였어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거형(과거형)\u003c/span> : 나는(I) + 밟았다(stepped) + 무엇을(on more puffballs) : \"밟았어요(지난 일)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">비교급(비교급)\u003c/span> : 더 많은(more) + 말불버섯(puffballs) : \"더 많은\"\u003c/div>\u003c/div>","segs":[{"n":66,"text":"Then I, 그러고 나서 나는. stepped on, 밟았어요. more puffballs, 더 많은 말불버섯을. 이 문장 전체를 해석하면, 그리고 나서 나는 더 많은 말불버섯을 밟았어요.","hl":"m"},{"n":67,"text":"이 문장은 말불버섯을 밟으면 오히려 도움이 된다는 걸 안 뒤에, 재미있어서 더 많이 밟았다는 뜻이에요. 지난 일이라서 동사에 -ed가 붙은 것도 기억해요.","hl":"mn"},{"n":68,"text":"첫 번째, stepped를 봐요. 이미 지나간 일을 말할 때는 동사에 -ed를 붙여요. 그래서 step이 stepped가 된 거예요. 두 번째, more는 '더 많은'이라는 뜻이에요. 앞에서 밟은 것보다 양이 늘었다는 걸 보여 주죠. 여러분도 오늘 배운 stepped를 꼭 기억해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 20 / 20\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 ~였어요\u003c/span>\u003cspan class=\"en\">It \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정말 재미있었어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">very \u003c/span>\u003cspan class=\"tgt\">fun\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">정말 재미있었어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 말불버섯을 더 밟아 본 일이 아주 즐거웠다고 느낌을 말하는 문장이에요. 이야기를 \u003cb class=\"key\">재미있었다\u003c/b>는 말로 마무리해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사(be동사)\u003c/span> : 그것(It) + 이었다(was) + 재미있는(fun) : \"~였어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부사(부사)\u003c/span> : very + fun : \"정말 재미있는\"\u003c/div>\u003c/div>","segs":[{"n":69,"text":"It was, 그것은 ~였어요. very fun, 정말 재미있었어요. 이 문장 전체를 해석하면, 정말 재미있었어요.","hl":"m"},{"n":70,"text":"이 문장은 말불버섯을 더 밟아 본 일이 아주 즐거웠다고 느낌을 말해요. 이야기의 마지막을 재미있었다는 말로 마무리하고 있죠.","hl":"mn"},{"n":71,"text":"첫 번째, was를 봐요. 지난 일을 말할 때 is는 was로 바뀌어요. 그래서 '재미있었어요'라는 뜻이 되는 거예요. 두 번째, very는 정말, 매우라는 뜻으로 fun을 더 세게 만들어 줘요. very는 부사라서 이렇게 다른 말 앞에서 힘을 더해 주는 거예요. 아주 잘했어요, 여러분.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">오늘 배운 내용 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>엄마와 나는 가끔 숲에서 \u003cb class=\"key\">버섯\u003c/b>을 찾고, 나는 사진을 찍고 이름을 알아내요.\u003c/li>\u003cli>어느 날 나는 오래된 나무 쪽으로 걷다가 \u003cb class=\"key\">말불버섯\u003c/b>을 밟았어요.\u003c/li>\u003cli>말불버섯은 밟히면 \u003cb class=\"key\">포자\u003c/b>가 사방으로 퍼져서 더 많이 자라요.\u003c/li>\u003cli>나는 버섯을 도와주었다는 것을 알고 \u003cb class=\"key\">기분이 \u003c/b>\u003cb class=\"key\">좋아졌어요\u003c/b>.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Stepping on puffballs helps their spores spread everywhere, so it is actually good for the mushrooms.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">엄마와 나는 가끔 함께 숲에서 버섯을 찾으며 지내요. 어느 날 내가 실수로 밟은 \u003cb class=\"key\">말불버섯\u003c/b>은 오히려 \u003cb class=\"key\">포자\u003c/b>가 사방으로 퍼지도록 도움을 받아서, 나는 기분이 좋아졌어요.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":72,"text":"오늘은 숲에서 말불버섯을 밟은 아이의 이야기를 읽었어요. 우리는 버섯이 포자로 새끼를 퍼뜨린다는 것도 알게 되었지요. 여러분도 오늘 배운 단어와 문장을 소리 내어 한 번 더 읽어 보세요. 정말 잘했어요, 다음 시간에 또 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
