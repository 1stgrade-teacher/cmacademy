</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"왓츠 리딩 100B Ch.2 Unit 04 Poison in Nature","audioDir":"reading04_audio","preview":false,"count":54,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.520em\">Ch.2 Unit\u003cbr>04 Poison\u003cbr>in Nature\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">왓츠 리딩 100B\u003c/div>\u003ch1>Poison in Nature: Myths and Facts About Wild Mushrooms\u003c/h1>\u003ch2>자연 속의 독: 야생 버섯에 대한 믿음과 사실\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">한 줄 요약\u003c/span>\u003cspan>야생 버섯에 대한 잘못된 믿음과 사실을 하나씩 짝지어 알려 주고, 독버섯과 안전한 버섯은 겉으로 \u003cb class=\"key\">구별\u003c/b>할 수 없으니 \u003cb class=\"key\">야생 \u003c/b>\u003cb class=\"key\">버섯\u003c/b>을 함부로 만지지 말라고 말해요.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>You cannot tell poisonous mushrooms from safe ones, so never touch wild mushrooms unless you understand them fully.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘도 만나서 정말 반가워요. 오늘은 자연 속에 숨어 있는 위험에 대한 글을 읽어 볼 거예요. 제목은 Poison in Nature, 자연 속의 독이에요. 한 줄로 말하면, 야생 버섯은 겉만 보고 절대 판단하면 안 된다는 이야기예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">미리 알면 쉬워요\u003c/span>\u003cdiv class=\"lp-box\">버섯(mushroom)은 숲이나 운동장 풀밭에서 자주 볼 수 있어요. 그런데 어떤 버섯은 먹으면 배가 아프고 심하면 목숨을 잃을 수도 있어요. 버섯 속에 든 독을 \u003cb class=\"key\">독소\u003c/b>(poison)라고 해요. 똑같이 생긴 사탕 두 개 중에 하나만 약이 들어 있다면 아주 무섭겠죠? 그래서 숲에서 본 \u003cb class=\"key\">야생 \u003c/b>\u003cb class=\"key\">버섯\u003c/b>은 사진만 찍고 손대지 않는 게 좋아요.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 하나 알려 줄게요. 버섯은 숲이나 운동장 풀밭에서 자주 볼 수 있어요. 그런데 어떤 버섯은 먹으면 배가 아프고, 심하면 목숨을 잃을 수도 있어요. 버섯 속에 든 독을 독소, 영어로 poison이라고 해요. 여러분은 숲에서 버섯을 본 적 있나요? 똑같이 생긴 사탕 두 개 중에 하나만 약이 들어 있다면 아주 무서울 것 같죠? 그래서 숲에서 본 버섯은 사진만 찍고 손대지 않는 게 좋아요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>위험한 버섯\u003csmall>문제 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>매년 사람들이 \u003cb class=\"key\">야생 \u003c/b>\u003cb class=\"key\">버섯\u003c/b> 때문에 아파요. 배가 아프거나 심하면 \u003cb class=\"key\">중독\u003c/b>으로 죽을 수도 있다고 해요. 그래서 이 글은 버섯이 얼마나 위험한지부터 알려 줘요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>믿음과 사실 하나\u003csmall>예시 · 문장 3–7\u003c/small>\u003c/h4>\u003cp>야생 버섯에 대한 \u003cb class=\"key\">잘못된 \u003c/b>\u003cb class=\"key\">믿음\u003c/b>이 있다고 해요. '독버섯은 항상 \u003cb class=\"key\">밝은 \u003c/b>\u003cb class=\"key\">색\u003c/b>이다'라는 믿음은 사실이 아니에요. 알광대버섯처럼 흰색이나 갈색인 독버섯도 있고, 모든 버섯은 \u003cb class=\"key\">손상\u003c/b>시키면 검게 변해요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>믿음과 사실 둘\u003csmall>예시 · 문장 8–11\u003c/small>\u003c/h4>\u003cp>'독버섯은 냄새와 맛이 나쁘다'는 믿음도 틀렸어요. 어떤 사람들은 맛이 좋다고 말해요. '\u003cb class=\"key\">조리\u003c/b>하면 안전해진다'는 생각도 위험해요. \u003cb class=\"key\">열\u003c/b>은 균류의 독을 없애지 못해요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>마지막 당부\u003csmall>해결 · 문장 12–14\u003c/small>\u003c/h4>\u003cp>그래서 우리는 독버섯과 안전한 버섯을 \u003cb class=\"key\">구별\u003c/b>할 수 없어요. 야생 버섯을 \u003cb class=\"key\">완전히 \u003c/b>\u003cb class=\"key\">이해\u003c/b>해야만 해요. 그렇지 않다면 야생에 있는 버섯은 \u003cb class=\"key\">만지지\u003c/b> 마세요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 따라가 볼게요. 위험을 알리는 이야기로 시작해서, 틀린 믿음과 사실을 비교하고, 마지막에 꼭 지킬 약속으로 끝나요.","hl":null},{"n":4,"text":"첫 번째 단계에서는 야생 버섯이 얼마나 위험한지 알아봐요. 매년 사람들이 야생 버섯 때문에 아프대요. 배가 아프거나 심하면 중독으로 죽을 수도 있다고 해요. 조금 무섭지만 꼭 알아야 하는 사실이에요.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 잘못된 믿음과 사실을 하나씩 비교해요. '독버섯은 항상 밝은 색이다'라는 믿음은 사실이 아니에요. 알광대버섯처럼 흰색이나 갈색인 독버섯도 있거든요. 그리고 모든 버섯은 손상시키면 검게 변해요.","hl":"f1"},{"n":6,"text":"세 번째 단계에서는 나머지 두 가지 믿음을 확인해요. '독버섯은 냄새와 맛이 나쁘다'는 말도 틀렸어요. 어떤 사람들은 맛이 좋다고 하니까요. '조리하면 안전해진다'는 생각도 아주 위험해요. 열은 균류의 독을 없애지 못하거든요.","hl":"f2"},{"n":7,"text":"마지막 단계에서는 선생님의 당부가 나와요. 우리는 독버섯과 안전한 버섯을 구별할 수 없어요. 그래서 야생 버섯을 완전히 이해해야만 해요. 그렇지 않다면 야생에 있는 버섯은 절대 만지지 마세요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">비교하며 설명하기\u003c/span>\u003cspan class=\"lp-pill\">끝\u003c/span>\u003cspan class=\"lp-pill\">주제문 12번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 처음에 야생 버섯이 위험하다고 말해요. 가운데에서는 \u003cb class=\"key\">근거 \u003c/b>\u003cb class=\"key\">없는 \u003c/b>\u003cb class=\"key\">믿음\u003c/b>과 \u003cb class=\"key\">사실\u003c/b>을 하나씩 짝지어 보여 줘요. 마지막에 '독버섯과 안전한 버섯을 \u003cb class=\"key\">구별\u003c/b>할 수 없다'는 중심 생각을 말해요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Every year (1)\u003c/b>\u003cspan>언제인지 알려 줌\u003c/span>\u003cb>also (3)\u003c/b>\u003cspan>내용을 더해 줌\u003c/span>\u003cb>like (5)\u003c/b>\u003cspan>예를 들어 줌\u003c/span>\u003cb>If (14)\u003c/b>\u003cspan>조건을 알려 줌\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">wild mushrooms\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">poisonous mushrooms\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">safe ones\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>근거 없는 믿음 (Myth)\u003c/th>\u003cth>사실 (Fact)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>독버섯은 항상 밝은 색\u003c/td>\u003ctd>흰색이나 갈색인 독버섯도 있음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>은이 독버섯을 검게 만듦\u003c/td>\u003ctd>모든 버섯은 손상시키면 검게 됨\u003c/td>\u003c/tr>\u003ctr>\u003ctd>냄새와 맛이 나쁨\u003c/td>\u003ctd>맛이 좋다고 하는 사람도 있음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>조리하면 안전해짐\u003c/td>\u003ctd>열은 균류의 독을 없애지 못함\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 비교하며 설명하는 글이에요. 근거 없는 믿음과 사실을 짝지어 보여 주는 방식이죠. 중심이 되는 문장은 글의 마지막 부분에 나와요. 그래서 끝까지 읽어야 진짜 하고 싶은 말을 알 수 있어요.","hl":"ty"},{"n":9,"text":"글의 길잡이 말도 눈여겨보세요. Every year는 언제인지, also는 내용을 더한다는 것, like는 예를 든다는 것, If는 조건을 알려 줘요. 그리고 wild mushrooms와 poisonous mushrooms, safe ones처럼 같은 대상을 다르게 부르는 말도 꼭 찾아보세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 단어\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>get sick\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>아프다, 병에 걸리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>wild\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>야생의\u003c/span>\u003c/div>\u003cdiv>\u003cb>mushroom\u003c/b>\u003cem>명사\u003c/em>\u003cspan>버섯\u003c/span>\u003c/div>\u003cdiv>\u003cb>stomachache\u003c/b>\u003cem>명사\u003c/em>\u003cspan>배 아픔, 복통\u003c/span>\u003c/div>\u003cdiv>\u003cb>die\u003c/b>\u003cem>동사\u003c/em>\u003cspan>죽다\u003c/span>\u003c/div>\u003cdiv>\u003cb>poisoning\u003c/b>\u003cem>명사\u003c/em>\u003cspan>중독\u003c/span>\u003c/div>\u003cdiv>\u003cb>belief\u003c/b>\u003cem>명사\u003c/em>\u003cspan>믿음\u003c/span>\u003c/div>\u003cdiv>\u003cb>poisonous\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>독이 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>bright\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>밝은, 환한\u003c/span>\u003c/div>\u003cdiv>\u003cb>silver\u003c/b>\u003cem>명사\u003c/em>\u003cspan>은\u003c/span>\u003c/div>\u003cdiv>\u003cb>damage\u003c/b>\u003cem>동사\u003c/em>\u003cspan>망가뜨리다, 상하게 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>smell\u003c/b>\u003cem>동사\u003c/em>\u003cspan>냄새가 나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>taste\u003c/b>\u003cem>동사\u003c/em>\u003cspan>맛이 나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>safe\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>안전한\u003c/span>\u003c/div>\u003cdiv>\u003cb>heat\u003c/b>\u003cem>명사\u003c/em>\u003cspan>열\u003c/span>\u003c/div>\u003cdiv>\u003cb>remove\u003c/b>\u003cem>동사\u003c/em>\u003cspan>없애다, 빼다\u003c/span>\u003c/div>\u003cdiv>\u003cb>tell the difference\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>차이를 구별하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>understanding\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이해\u003c/span>\u003c/div>\u003cdiv>\u003cb>touch\u003c/b>\u003cem>동사\u003c/em>\u003cspan>만지다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"오늘의 단어를 소리 내어 읽어 볼게요. poisonous, 독이 있는이라는 뜻이에요. remove는 없애다, touch는 만지다예요. 여러분도 세 번씩 소리 내어 따라 해 보세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">sick\u003c/b>\u003cspan class=\"m\">아픈\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">ill\u003c/span>\u003cspan class=\"s\">unwell\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">healthy\u003c/span>\u003cspan class=\"a\">well\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">poisonous\u003c/b>\u003cspan class=\"m\">독이 있는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">toxic\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">safe\u003c/span>\u003cspan class=\"a\">harmless\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">bright\u003c/b>\u003cspan class=\"m\">밝은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">light\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">dark\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">damage\u003c/b>\u003cspan class=\"m\">망가뜨리다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">break\u003c/span>\u003cspan class=\"s\">hurt\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">fix\u003c/span>\u003cspan class=\"a\">repair\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">remove\u003c/b>\u003cspan class=\"m\">없애다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">take away\u003c/span>\u003cspan class=\"s\">get rid of\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">keep\u003c/span>\u003cspan class=\"a\">add\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">safe\u003c/b>\u003cspan class=\"m\">안전한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">harmless\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">dangerous\u003c/span>\u003cspan class=\"a\">poisonous\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"비슷한 말과 반대말도 정리해 볼게요. poisonous는 독이 있는, 반대말은 safe, 안전한이에요. sick은 아픈, 비슷한 말은 ill이에요. bright는 밝은, 반대말은 dark, 어두운이에요. remove는 없애다, 반대말은 keep, 그대로 두다예요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매년,\u003c/span>\u003cspan class=\"en\">Every year,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들이 아픕니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">get \u003c/span>\u003cspan class=\"tgt\">sick\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">야생 버섯으로 인해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">wild \u003c/span>\u003cspan class=\"tgt\">mushrooms\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">매년 사람들이 야생 버섯으로 인해 아픕니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 해마다 사람들이 야생 버섯 때문에 아프다는 것을 알려 주는 문장이에요. 글의 \u003cb class=\"key\">처음\u003c/b>에서 야생 버섯이 얼마나 \u003cb class=\"key\">위험\u003c/b>한지 먼저 말해 주는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">하는 일·상태 말(동사)\u003c/span> : 누가(People) + 한다(get) + 어떻게(sick) : \"사람들이 아프게 된다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">짝꿍 말(전치사)\u003c/span> : from + 무엇(mushrooms) = 무엇 때문에 : \"야생 버섯으로 인해\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Every year, 매년. people get sick, 사람들이 아픕니다. from wild mushrooms, 야생 버섯으로 인해. 이 문장 전체를 해석하면, 매년 사람들이 야생 버섯으로 인해 아픕니다.","hl":"m"},{"n":13,"text":"이 문장은 해마다 사람들이 야생 버섯 때문에 아픈 일이 생긴다고 말해요. 글의 처음에서 야생 버섯이 위험하다는 걸 먼저 알려 주는 거예요.","hl":"mn"},{"n":14,"text":"첫 번째, get 뒤에 sick이 오면 아프게 되다라는 뜻이 돼요. 두 번째, People은 여러 사람이라서 동사에 s를 붙이지 않아요. 세 번째, from은 아픈 까닭을 알려 줘요. 야생 버섯이 아픈 이유가 되는 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들은 생길 수 있어요\u003c/span>\u003cspan class=\"en\">People \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">get\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">복통이 또는 심지어 죽을 수도\u003c/span>\u003cspan class=\"en\">stomachaches \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">or\u003c/span> even die\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">버섯 중독으로 인해\u003c/span>\u003cspan class=\"en\">from mushroom poisoning.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사람들은 복통이 생기거나 심지어 버섯 중독으로 죽을 수도 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 배가 아픈 정도가 아니라 죽을 수도 있다고 하면서, 야생 버섯이 얼마나 \u003cb class=\"key\">위험\u003c/b>한지 다시 알려 줘요. \u003cb class=\"key\">가능성\u003c/b>을 말하는 can이 들어 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">도와주는 동사(조동사)\u003c/span> : 누가(People) + 할 수 있다(can) + 하다(get) : \"생길 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : A(stomachaches) + 또는(or) + B(die) : \"복통 또는 죽음\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"People can get, 사람들은 생길 수 있어요. stomachaches or even die, 복통이 또는 심지어 죽을 수도. from mushroom poisoning, 버섯 중독으로 인해. 이 문장 전체를 해석하면, 사람들은 복통이 생기거나 심지어 버섯 중독으로 죽을 수도 있어요.","hl":"m"},{"n":16,"text":"이 문장은 배가 아픈 것만이 아니라 죽을 수도 있다고 말해요. 야생 버섯이 정말 위험하다는 걸 다시 한번 알려 주는 거예요.","hl":"mn"},{"n":17,"text":"첫 번째, can은 동사 앞에서 할 수 있다는 가능성을 더해 줘요. 두 번째, or은 두 가지를 이어 주는 접속사예요. 복통과 죽음을 이어서 또는이라고 하는 거죠. 여러분, 조심해야 한다는 마음이 느껴지나요?","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또한 있습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">are\u003c/span> also\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몇 가지 잘못된 믿음이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">some \u003c/span>\u003cspan class=\"tgt\">wrong \u003c/span>\u003cspan class=\"tgt\">beliefs\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">야생 버섯에 대한\u003c/span>\u003cspan class=\"en\">about wild mushrooms.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">야생 버섯에 대한 잘못된 믿음도 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 야생 버섯에 대해 사람들이 잘못 알고 있는 \u003cb class=\"key\">믿음\u003c/b>이 있다고 말해요. 앞으로 그 믿음들을 하나씩 \u003cb class=\"key\">소개\u003c/b>할 준비를 하는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">있음을 알려 주는 말(There is/are)\u003c/span> : There are + 여러 개(beliefs) : \"~이 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">꾸며 주는 말(형용사)\u003c/span> : some + 꾸며 주는 말(wrong) + 이름 말(beliefs) : \"몇 가지 잘못된 믿음\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"There are also, 또한 있습니다. some wrong beliefs, 몇 가지 잘못된 믿음이. about wild mushrooms, 야생 버섯에 대한. 이 문장 전체를 해석하면, 야생 버섯에 대한 잘못된 믿음도 있습니다.","hl":"m"},{"n":19,"text":"이 문장은 야생 버섯에 대해 사람들이 잘못 알고 있는 믿음이 있다고 말해요. 앞으로 그 믿음들을 하나씩 소개할 준비를 하는 문장이에요.","hl":"mn"},{"n":20,"text":"첫 번째, 여러 개가 있다고 말할 때는 There are를 써요. beliefs가 여러 개라서 are를 쓴 거죠. 두 번째, wrong은 잘못된이라는 꾸며 주는 말이에요. beliefs를 꾸며 주고 있어요. 세 번째, about은 어떤 것에 대한이라는 뜻으로 뒤에 wild mushrooms가 와요. 아주 잘 따라오고 있어요!","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">근거 없는 믿음: &quot;독버섯은\u003c/span>\u003cspan class=\"en\">Myth: &quot;\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Poisonous \u003c/span>\u003cspan class=\"tgt\">mushrooms\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">항상 가지고 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">always \u003c/span>\u003cspan class=\"tgt\">have\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">밝은 색깔을.&quot;\u003c/span>\u003cspan class=\"en\">bright colors.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">근거 없는 믿음: &quot;독버섯은 항상 밝은 색깔이다.&quot;\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 독버섯은 항상 밝은 색이라는 \u003cb class=\"key\">근거 \u003c/b>\u003cb class=\"key\">없는 \u003c/b>\u003cb class=\"key\">믿음\u003c/b>을 소개해요. 글에서 \u003cb class=\"key\">독버섯\u003c/b>에 대한 잘못된 생각을 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">꾸며 주는 말(형용사) + 이름 말(명사)\u003c/span> : 꾸며 주는 말(Poisonous) + 이름 말(mushrooms) : \"독이 있는 버섯들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재시제(일반동사 현재형)\u003c/span> : 누가(They) + 항상(always) + 가지다(have) : \"항상 가지고 있다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Myth: \"Poisonous mushrooms, 근거 없는 믿음: \"독버섯은. always have, 항상 가지고 있다. bright colors.\", 밝은 색깔을.\". 이 문장 전체를 해석하면, 근거 없는 믿음: \"독버섯은 항상 밝은 색깔이다.\"","hl":"m"},{"n":22,"text":"이 문장은 독버섯은 항상 밝은 색깔을 가지고 있다는 근거 없는 믿음을 소개해요. 글에서 독버섯에 대한 잘못된 생각을 보여 주는 거죠.","hl":"mn"},{"n":23,"text":"첫 번째, Poisonous mushrooms에서 Poisonous는 꾸며 주는 말인 형용사예요. mushrooms는 이름 말인 명사이고요. 형용사가 명사 앞에서 어떤 버섯인지 알려 줘요. 두 번째, always have는 현재시제로 항상 가지고 있다는 뜻이에요. always는 have 앞에서 항상이라는 뜻을 더해 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사실: 일부\u003c/span>\u003cspan class=\"en\">Fact: \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Some \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">독버섯은, 알광대버섯과 같은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">poisonous \u003c/span>\u003cspan class=\"tgt\">mushrooms\u003c/span>, like death caps,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">흰색이거나 갈색이다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">white \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">brown\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사실: 알광대버섯과 같은 일부 독버섯은 흰색이거나 갈색이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 독버섯이 꼭 밝은 색은 아니라는 \u003cb class=\"key\">사실\u003c/b>을 알려 줘요. \u003cb class=\"key\">알광대버섯\u003c/b>처럼 흰색이나 갈색인 독버섯도 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수량 표현(some) + 복수 명사\u003c/span> : 몇몇(Some) + 독버섯들(poisonous mushrooms) : \"몇몇 독버섯\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">am·are·is 친구들(be동사)\u003c/span> : 주어(They) + 이다(are) + white or brown : \"흰색이거나 갈색이다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Fact: Some, 사실: 일부. poisonous mushrooms, like death caps, 독버섯은, 알광대버섯과 같은. are white or brown, 흰색이거나 갈색이다.. 이 문장 전체를 해석하면, 사실: 알광대버섯과 같은 일부 독버섯은 흰색이거나 갈색이다.","hl":"m"},{"n":25,"text":"이 문장은 독버섯이 꼭 밝은 색은 아니라는 사실을 알려 줘요. 알광대버섯처럼 흰색이나 갈색인 독버섯도 있다는 거죠.","hl":"mn"},{"n":26,"text":"첫 번째, Some poisonous mushrooms는 수량 표현 some과 복수 명사 mushrooms가 만난 말이에요. some은 몇몇이라는 뜻으로 여러 개를 가리켜요. 두 번째, are white or brown에서 주어가 여러 개라 be동사 are를 써요. white or brown은 흰색이나 갈색 중 하나라는 뜻이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">근거 없는 믿음: &quot;은은 만든다\u003c/span>\u003cspan class=\"en\">Myth: &quot;Silver \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">turns\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">독버섯을 검게.&quot;\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">poisonous \u003c/span>\u003cspan class=\"tgt\">mushrooms\u003c/span> dark.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">근거 없는 믿음: &quot;은은 독버섯을 검게 만든다.&quot;\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 은이 독버섯을 검게 만든다는 것도 \u003cb class=\"key\">근거 \u003c/b>\u003cb class=\"key\">없는 \u003c/b>\u003cb class=\"key\">믿음\u003c/b>이에요. 다음 문장에서 이 생각이 왜 틀렸는지 \u003cb class=\"key\">사실\u003c/b>로 알려 줄 거예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">한 사람·한 개일 때 동사 + s(3인칭 단수)\u003c/span> : 무엇이(Silver) + 만든다(turns) + 무엇을(mushrooms) + 어떻게(dark) : \"은은 만든다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">꾸며 주는 말(형용사) + 이름 말(명사)\u003c/span> : 꾸며 주는 말(poisonous) + 이름 말(mushrooms) : \"독이 있는 버섯들\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Myth: \"Silver turns, 근거 없는 믿음: \"은은 만든다. poisonous mushrooms dark.\", 독버섯을 검게.\". 이 문장 전체를 해석하면, 근거 없는 믿음: \"은은 독버섯을 검게 만든다.\"","hl":"m"},{"n":28,"text":"이 문장은 은이 독버섯을 검게 만든다는 것도 근거 없는 믿음이라고 말해요. 다음 문장에서 이 생각이 왜 틀렸는지 사실로 알려 줄 거예요.","hl":"mn"},{"n":29,"text":"첫 번째, Silver turns에서 Silver는 한 개이므로 동사 turn s mushrooms) + and + B(safe ones) : \"독버섯과 안전한 버섯 사이\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"You cannot tell, 여러분은 구별할 수 없어요. the difference, 차이를. between poisonous mushrooms, 독버섯과. and safe ones, 안전한 버섯 사이의. 이 문장 전체를 해석하면, 여러분은 독버섯과 안전한 버섯의 차이를 구별할 수 없습니다.","hl":"m"},{"n":46,"text":"이 문장은 눈으로 봐서는 독버섯과 안전한 버섯을 구별할 수 없다고 말해요. 그래서 함부로 만지면 안 된다는 걸 알려 주죠.","hl":"mn"},{"n":47,"text":"첫째, cannot tell은 구별할 수 없다는 뜻이에요. 여기서 tell은 말하다가 아니라 알아내다, 구별하다로 쓰여요. 둘째, between은 두 가지 사이를 말하는 전치사예요. between A and B 하면 A와 B 사이라는 뜻이 되죠. 이 문장은 글의 중요한 메시지니까 꼭 외워 두면 좋아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은 꼭 가져야 해요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">You \u003c/span>\u003cspan class=\"tgt\">must \u003c/span>\u003cspan class=\"tgt\">have\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">완전한 이해를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">full \u003c/span>\u003cspan class=\"tgt\">understanding\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">야생 버섯에 대한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">wild \u003c/span>\u003cspan class=\"tgt\">mushrooms\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여러분은 야생 버섯에 대해 완전히 이해해야 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 야생 버섯은 겉만 봐서는 알 수 없으니 \u003cb class=\"key\">완전한 \u003c/b>\u003cb class=\"key\">이해\u003c/b>가 있어야 한다고 말해요. 글의 마지막에서 꼭 지켜야 할 \u003cb class=\"key\">안전 \u003c/b>\u003cb class=\"key\">약속\u003c/b>을 알려 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">도와주는 동사(must)\u003c/span> : 누가(You) + 꼭 ~해야 해요(must) + 가지다(have) : \"여러분은 꼭 가져야 해요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이름 말(명사)\u003c/span> : 가진다(have) + 무엇을(a full understanding) : \"완전한 이해를\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">짝꿍 말(전치사)\u003c/span> : ~에 대한(of) + 야생 버섯(wild mushrooms) : \"야생 버섯에 대한\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"You must have, 여러분은 꼭 가져야 해요. a full understanding, 완전한 이해를. of wild mushrooms, 야생 버섯에 대한. 이 문장 전체를 해석하면, 여러분은 야생 버섯에 대해 완전히 이해해야 합니다.","hl":"m"},{"n":49,"text":"이 문장은 야생 버섯에 대해 완전히 이해해야 한다고 말해요. 글의 마지막에서 꼭 기억해야 할 안전 약속을 알려 주는 거예요.","hl":"mn"},{"n":50,"text":"첫째, must는 동사 앞에서 꼭 해야 한다는 뜻을 더해 주는 도와주는 동사예요. 둘째, 영어에서는 이해하다를 완전한 이해를 가지다처럼 이름 말로 말해요. 셋째, of는 뒤의 말과 짝을 이뤄서 야생 버섯에 대한이라는 한 덩어리를 만들어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 14\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 여러분이 그렇지 않다면,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">If \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">don't\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만지지 마세요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">touch\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">야생에 있는 아무 버섯도\u003c/span>\u003cspan class=\"en\">any in the wild.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그렇지 않다면, 야생에 있는 아무 버섯도 만지지 마세요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 말한 이해가 없다면 \u003cb class=\"key\">야생 \u003c/b>\u003cb class=\"key\">버섯\u003c/b>을 절대 만지지 말라고 해요. 친구들에게 꼭 알려 줘야 할 \u003cb class=\"key\">안전 \u003c/b>\u003cb class=\"key\">규칙\u003c/b>을 담은 마무리 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사 if)\u003c/span> : 만약 ~라면(If) + 누가(you) + 하지 않는다(don't) : \"만약 여러분이 그렇지 않다면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">시키는 말(명령문)\u003c/span> : 하지 마라(do not) + 만지다(touch) : \"만지지 마세요\"\u003c/div>\u003c/div>","segs":[{"n":51,"text":"If you don't, 만약 여러분이 그렇지 않다면. do not touch, 만지지 마세요. any in the wild, 야생에 있는 아무 버섯도. 이 문장 전체를 해석하면, 그렇지 않다면, 야생에 있는 아무 버섯도 만지지 마세요.","hl":"m"},{"n":52,"text":"이 문장은 앞에서 말한 이해가 없다면 야생 버섯을 절대 만지지 말라고 해요. 글을 마무리하면서 꼭 지켜야 할 안전 규칙을 알려 주는 거예요.","hl":"mn"},{"n":53,"text":"먼저 if는 만약 이라면이라는 뜻으로 조건을 이어 주는 이어 주는 말이에요. 그리고 do not touch는 다른 사람에게 하지 말라고 시키는 말이라서 동사원형으로 시작해요. 마지막으로 any는 부정문에서 아무 버섯도처럼 힘을 더해 주는 말이에요. 여러분은 이 약속 꼭 기억하기로 해요!","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">오늘 배운 내용 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>야생 버섯을 먹으면 배가 아프거나 \u003cb class=\"key\">중독\u003c/b>으로 죽을 수도 있어요.\u003c/li>\u003cli>'독버섯은 밝은 색이고 냄새가 나쁘다'는 \u003cb class=\"key\">잘못된 \u003c/b>\u003cb class=\"key\">믿음\u003c/b>이에요.\u003c/li>\u003cli>\u003cb class=\"key\">열\u003c/b>은 균류의 독을 없애지 못해요.\u003c/li>\u003cli>독버섯과 안전한 버섯은 겉으로 \u003cb class=\"key\">구별\u003c/b>할 수 없으니 함부로 만지면 안 돼요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>You cannot tell poisonous mushrooms from safe ones, so never touch wild mushrooms unless you understand them fully.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">야생 버섯에 대한 잘못된 믿음과 사실을 하나씩 짝지어 알려 주고, 독버섯과 안전한 버섯은 겉으로 \u003cb class=\"key\">구별\u003c/b>할 수 없으니 \u003cb class=\"key\">야생 \u003c/b>\u003cb class=\"key\">버섯\u003c/b>을 함부로 만지지 말라고 말해요.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":54,"text":"오늘 우리는 야생 버섯에 대한 믿음과 사실을 배웠어요. 겉만 보고 판단하면 안 된다는 것, 꼭 기억해 두세요. 여러분이 오늘 아주 멋지게 해냈어요. 다음 시간에 또 만나요, 안녕!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
