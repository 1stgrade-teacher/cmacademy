@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"왓츠 리딩 100B Ch.2 Unit 01 Come and Find Me!","audioDir":"reading01_audio","preview":false,"count":66,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.425em\">Ch.2 Unit\u003cbr>01 Come and\u003cbr>Find Me!\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">왓츠 리딩 100B\u003c/div>\u003ch1>Come and Find Me!\u003c/h1>\u003ch2>와서 나를 찾아봐!\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">한 줄 요약\u003c/span>\u003cspan>이 글은 균인 내가 직접 말하는 형식으로, 우리 균류가 버섯·곰팡이·효모로 여러 곳에 살고 있다는 것을 알려 줘요. \u003cb class=\"key\">균류\u003c/b>는 어둡고 서늘하고 습한 곳, 집 안, 음식 속 등 \u003cb class=\"key\">어디에나\u003c/b> 있고 무섭지 않은 존재라고 말해요.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Fungi live everywhere around us, and they are not scary.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘도 만나서 반가워요. 오늘은 균류가 직접 자기 이야기를 들려주는 글을 읽어 볼 거예요. 버섯과 곰팡이, 효모가 어디에 사는지 함께 찾아가 볼까요? 한 줄로 말하면, 균류는 우리 주변 어디에나 살고 있어요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">미리 알면 쉬워요\u003c/span>\u003cdiv class=\"lp-box\">균류(fungi)는 버섯, 곰팡이, 효모처럼 아주 작은 생물이에요. 우리 눈에 잘 안 보여도 \u003cb class=\"key\">공기\u003c/b> 속이나 땅속, 음식 속에 살아요. 여러분이 먹는 폭신한 빵도 효모(yeast)가 반죽을 부풀려 준 덕분이에요. 마치 놀이터 어디에나 숨어 있는 친구를 찾는 것처럼, 균류도 집 안 곳곳에 숨어 있어요. \u003cb class=\"key\">곰팡이\u003c/b>(mold)는 축축한 곳을 좋아해서 욕실 커튼이나 지하실에서 자주 보여요.\u003c/div>","segs":[{"n":2,"text":"균류는 버섯, 곰팡이, 효모처럼 아주 작은 생물이에요. 우리 눈에 잘 안 보여도 공기 속이나 땅속, 음식 속에 살아요. 여러분이 먹는 폭신한 빵도 효모가 반죽을 부풀려 준 덕분이에요. 여러분은 집 안 어디에서 곰팡이를 본 적이 있나요? 놀이터에서 숨은 친구를 찾듯이, 오늘은 집 안 곳곳에 숨은 균류를 찾아볼 거예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>균류의 자기소개\u003csmall>소개 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>글쓴이는 균인 \u003cb class=\"key\">fungus\u003c/b>가 되어 말해요. 우리 주변에는 균류인 \u003cb class=\"key\">fungi\u003c/b>가 아주 많다고 해요. 그리고 우리는 버섯, \u003cb class=\"key\">곰팡이\u003c/b>, 효모가 될 수 있다고 소개해요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>밖에서 만나는 균류\u003csmall>예시 · 문장 4–8\u003c/small>\u003c/h4>\u003cp>버섯은 어둡고 서늘하고 \u003cb class=\"key\">습한\u003c/b> 곳에서 자라요. 그래서 나무 밑에서 버섯을 찾을 수 있어요. 나무를 자세히 보면 그 위에서 초록색 \u003cb class=\"key\">곰팡이\u003c/b>도 볼 수 있어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>집 안의 곰팡이\u003csmall>예시 · 문장 9–12\u003c/small>\u003c/h4>\u003cp>우리는 집 안에도 살아요. \u003cb class=\"key\">지하실\u003c/b>이나 화장실처럼 어둡고 습한 곳을 생각해 보세요. 샤워 커튼에 붙은 검은 무언가도 \u003cb class=\"key\">곰팡이\u003c/b>예요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>음식 속 균류\u003csmall>마무리 · 문장 13–19\u003c/small>\u003c/h4>\u003cp>우리는 빵 같은 음식 안에도 있어요. \u003cb class=\"key\">효모\u003c/b>가 반죽을 부풀게 해서 맛있고 부드러운 빵이 돼요. 우리는 치즈와 요구르트도 만들고, 어디에나 있으며 \u003cb class=\"key\">무섭지 \u003c/b>\u003cb class=\"key\">않은\u003c/b> 친구예요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 따라가 볼게요.","hl":null},{"n":4,"text":"먼저 글쓴이는 균인 fungus가 되어 자기소개를 해요. 우리 주변에는 균류인 fungi가 아주 많다고 말하죠. 그리고 우리는 버섯, 곰팡이, 효모가 될 수 있다고 알려 줘요.","hl":"f0"},{"n":5,"text":"다음은 밖에서 만나는 균류예요. 버섯은 어둡고 서늘하고 습한 곳에서 자라요. 그래서 나무 밑에서 버섯을 찾을 수 있고, 나무를 자세히 보면 초록색 곰팡이도 볼 수 있어요.","hl":"f1"},{"n":6,"text":"이번에는 집 안 이야기예요. 우리는 지하실이나 화장실처럼 어둡고 습한 곳에 살아요. 샤워 커튼에 붙은 검은 무언가도 곰팡이예요.","hl":"f2"},{"n":7,"text":"마지막은 음식 속 균류예요. 효모가 반죽을 부풀게 해서 맛있고 부드러운 빵이 돼요. 우리는 치즈와 요구르트도 만들고, 어디에나 있으며 무섭지 않은 친구예요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">설명하는 글(소개하기)\u003c/span>\u003cspan class=\"lp-pill\">처음과 끝\u003c/span>\u003cspan class=\"lp-pill\">주제문 2번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 균류가 무엇인지 소개하고, 밖과 집 안, 음식 속에서 사는 모습을 차례로 보여 줘요. 그래서 \u003cb class=\"key\">설명하는 \u003c/b>\u003cb class=\"key\">글\u003c/b>이에요. 처음에 우리 균류가 아주 많다고 말하고, 끝에서 \u003cb class=\"key\">어디에나\u003c/b> 있다고 다시 정리해서 중심 문장이 처음과 끝에 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>So (5)\u003c/b>\u003cspan>이유와 결과를 이어 줌\u003c/span>\u003cb>Then (6)\u003c/b>\u003cspan>다음 순서를 알려 줌\u003c/span>\u003cb>also (7)\u003c/b>\u003cspan>새로운 내용을 더해 줌\u003c/span>\u003cb>But (15)\u003c/b>\u003cspan>앞과 다른 내용으로 바꿔 줌\u003c/span>\u003cb>As you can see (17)\u003c/b>\u003cspan>내용을 정리해 줌\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">fungus\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">fungi\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">mushrooms\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">mold\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">yeast\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 설명하는 글이에요. 균류가 무엇이고 어디에 사는지 하나씩 알려 주죠. 중심이 되는 문장은 처음과 끝에 있어요. 처음에서 우리 균류가 많다고 말하고, 끝에서 우리는 어디에나 있다고 다시 정리해요.","hl":"ty"},{"n":9,"text":"길잡이 말을 찾아볼까요. Then은 다음 순서를 알려 주고, also는 새로운 내용을 더할 때 나와요. But은 앞과 다른 이야기를 꺼낼 때 쓰여요. 그리고 fungus와 fungi, mushrooms, mold, yeast는 모두 같은 균류를 다르게 부르는 말이에요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 단어\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>fungus\u003c/b>\u003cem>명사\u003c/em>\u003cspan>균류\u003c/span>\u003c/div>\u003cdiv>\u003cb>around\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~주변에\u003c/span>\u003c/div>\u003cdiv>\u003cb>mushroom\u003c/b>\u003cem>명사\u003c/em>\u003cspan>버섯\u003c/span>\u003c/div>\u003cdiv>\u003cb>mold\u003c/b>\u003cem>명사\u003c/em>\u003cspan>곰팡이\u003c/span>\u003c/div>\u003cdiv>\u003cb>yeast\u003c/b>\u003cem>명사\u003c/em>\u003cspan>효모\u003c/span>\u003c/div>\u003cdiv>\u003cb>grow\u003c/b>\u003cem>동사\u003c/em>\u003cspan>자라다\u003c/span>\u003c/div>\u003cdiv>\u003cb>dark\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>어두운\u003c/span>\u003c/div>\u003cdiv>\u003cb>cool\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>서늘한\u003c/span>\u003c/div>\u003cdiv>\u003cb>humid\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>습한\u003c/span>\u003c/div>\u003cdiv>\u003cb>under\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~아래에\u003c/span>\u003c/div>\u003cdiv>\u003cb>take a close look\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>자세히 살펴보다\u003c/span>\u003c/div>\u003cdiv>\u003cb>green\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>초록색의\u003c/span>\u003c/div>\u003cdiv>\u003cb>inside\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~안에\u003c/span>\u003c/div>\u003cdiv>\u003cb>basement\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지하실\u003c/span>\u003c/div>\u003cdiv>\u003cb>bathroom\u003c/b>\u003cem>명사\u003c/em>\u003cspan>화장실\u003c/span>\u003c/div>\u003cdiv>\u003cb>shower curtain\u003c/b>\u003cem>명사\u003c/em>\u003cspan>샤워 커튼\u003c/span>\u003c/div>\u003cdiv>\u003cb>dough\u003c/b>\u003cem>명사\u003c/em>\u003cspan>반죽\u003c/span>\u003c/div>\u003cdiv>\u003cb>rise\u003c/b>\u003cem>동사\u003c/em>\u003cspan>부풀다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"오늘의 단어를 소리 내어 읽어 볼게요. fungus는 균류, humid는 습한이라는 뜻이에요. dough는 반죽, rise는 부풀다라는 뜻이죠. take a close look은 자세히 살펴보다라는 숙어예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">humid\u003c/b>\u003cspan class=\"m\">습한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">wet\u003c/span>\u003cspan class=\"s\">damp\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">dry\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">dark\u003c/b>\u003cspan class=\"m\">어두운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">black\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">bright\u003c/span>\u003cspan class=\"a\">light\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">inside\u003c/b>\u003cspan class=\"m\">~안에\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">in\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">outside\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">soft\u003c/b>\u003cspan class=\"m\">부드러운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">smooth\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hard\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">everywhere\u003c/b>\u003cspan class=\"m\">어디에나\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">all around\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">nowhere\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"비슷한 말과 반대말도 익혀 볼까요. humid는 wet, damp와 비슷하고 반대말은 dry예요. dark는 bright의 반대말이고, inside는 outside의 반대말이에요. soft는 smooth와 비슷하고 hard와 반대예요. everywhere는 all around와 비슷한 말이에요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">안녕하세요,\u003c/span>\u003cspan class=\"en\">Hello,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 ~입니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">am\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">균이에요\u003c/span>\u003cspan class=\"en\">a fungus.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">안녕하세요, 저는 균입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 글을 말하는 사람이 자신을 \u003cb class=\"key\">균\u003c/b>이라고 소개해요. 앞으로 균이 자기 이야기를 들려준다는 걸 알려 주는 \u003cb class=\"key\">첫 \u003c/b>\u003cb class=\"key\">인사\u003c/b>예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">am·are·is 친구들(be동사)\u003c/span> : 나는(I) + 이다(am) + 균(a fungus) : \"나 n":14,"text":"There are, ~이 있어요. many of us, 우리 중 많은 수가. fungi, 균류가. around you, 여러분 주변에. 이 문장 전체를 해석하면, 여러분 주변에는 우리 균류가 많이 있어요.","hl":"m"},{"n":15,"text":"There are로 '무언가가 있다'고 말하면서, 균류가 여러분 주변에 아주 많다는 걸 알려 줘요. '균은 어디에나 있다'는 글의 주제로 이어지는 도입 문장이에요.","hl":"mn"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 ~가 될 수 있어요\u003c/span>\u003cspan class=\"en\">We \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">be\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">버섯이나 곰팡이,\u003c/span>\u003cspan class=\"en\">mushrooms, mold,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또는 효모가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">or\u003c/span> yeast.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 버섯이나 곰팡이, 또는 효모가 될 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 균류가 가질 수 있는 \u003cb class=\"key\">세 \u003c/b>\u003cb class=\"key\">가지 \u003c/b>\u003cb class=\"key\">모습\u003c/b>을 알려 줘요. \u003cb class=\"key\">can\u003c/b>으로 '될 수 있다'는 가능성을 말하고, or로 보기를 이어 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">도와주는 동사(can)\u003c/span> : 우리는(We) + 될 수 있어요(can be) + 버섯이(mushrooms) : \"우리는 ~가 될 수 있어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : A(mushrooms) + 또는(or) + B(yeast) : \"또는\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"We can be, 우리는 ~가 될 수 있어요. mushrooms, mold, 버섯이나 곰팡이. or yeast, 또는 효모가. 이 문장 전체를 해석하면, 우리는 버섯이나 곰팡이, 또는 효모가 될 수 있어요.","hl":"m"},{"n":17,"text":"균류가 가질 수 있는 세 가지 모습을 알려 줘요. can으로 '될 수 있다'는 가능성을 말하고, or로 보기를 이어 줘요.","hl":"mn"}]},{"html":"\u00  19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 곰팡이예요.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">That's\u003c/span> mold.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 곰팡이입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 나무 위에 있던 \u003cb class=\"key\">초록색\u003c/b>이 바로 곰팡이라고 알려 주는 문장이에요. 아주 짧지만 앞에 나온 것을 다시 콕 집어 주는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사(am·are·is 친구들)\u003c/span> : 그것은(That) + 이에요(is) + 곰팡이(mold) : \"그것은 곰팡이예요\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"That's mold, 그것은 곰팡이예요.. 이 문장 전체를 해석하면, 그것은 곰팡이입니다.","hl":"m"},{"n":31,"text":"나무 위에 있던 초록색, 그게 바로 곰팡이라는 뜻이에요. 짧은 문장이지만 앞에 나온 것을 콕 집어 주는 역할을 해요.","hl":"mn"},{"n":32,"text":"That's는 That is를 줄인 말이에요. 여기서 be동사 is가 '그것은 곰팡이예요'처럼 둘을 이어 주는 역할을 해요. 그래서 물어볼 때도 What's this?처럼 짧게 쓸 수 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 살아요\u003c/span>\u003cspan class=\"en\">We live\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분의 집 안에서,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">inside \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">house\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또한.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">too\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 여러분의 집 안에서도 살아요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 곰팡이가 나무뿐 아니라 우리가 사는 \u003cb class=\"key\">집 \u003c/b>\u003cb class=\"key\">안\u003c/b>에도 산다고 말해요. 새로운 장소를 알려 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">장소·시간 짝꿍 말(전치사)\u003c/span> : 안쪽에(inside) + 여러분의(your) + 집(house) : \"여러분의 집 안에서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">더 자세히 알려 주는 말(부사)\u003c/span> : …도(too) : \"또한\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"We live, 우리는 살아요. inside your house, 여러분의 집 안에서. too, 또한.. 이 문장 전체를 해석하면, 우리는 여러분의 집 안에서도 살아요.","hl":"m"},{"n":34,"text":"곰팡이는 나무뿐만 아니라 우리가 사는 집 안에도 살아요. 다음 문장에서 집 안 어디인지 알려 줄 거예요.","hl":"mn"},{"n":35,"text":"첫 번째, inside는 '안쪽에'라고 장소를 알려 주는 짝꿍 말이에요. 그래서 '집 안에서'는 inside your house라고 해요. 두 번째, too는 문장 끝에 붙어서 또한이라는 뜻을 더해요. '우리도 살아요'처럼 같은 것이 하나 더 있다고 할 때 쓰는 말이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">생각해 보세요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Think \u003c/span>\u003cspan class=\"tgt\">of\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어둡고 서늘하며 습한 곳을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">dark, \u003c/span>\u003cspan class=\"tgt\">cool, \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">humid\u003c/span> places\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지하실처럼\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">basement\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아니면 화장실처럼\u003c/span>\u003cspan class=\"en\">or the bathroom.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">지하실이나 화장실처럼 어둡고 서늘하며 습한 곳을 생각해 보세요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 곰팡이가 사는 \u003cb class=\"key\">장소\u003c/b>가 어디인지 알려 주는 문장이에요. 지하실이나 화장실처럼 어둡고 서늘하고 \u003cb class=\"key\">습한 \u003c/b>\u003cb class=\"key\">곳\u003c/b>을 떠올리게 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문(명령문)\u003c/span> : 동사원형(Think) + of + 무엇을 = ~을 생각해 보세요 : \"생각해 보세요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : A(dark), B(cool), and C(humid) = A, B, 그리고 C : \"어둡고, 서늘하고, 습한\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사(전치사)\u003c/span> : like + 명사(basement) = ~처럼 : \"지하실처럼\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Think of, 생각해 보세요. dark, cool, and humid places, 어둡고 서늘하며 습한 곳을. like the basement, 지하실처럼. or the bathroom, 아니면 화장실처럼. 이 문장 전체를 해석하면, 지하실이나 화장실처럼 어둡고 서늘하며 습한 곳을 생각해 보세요.","hl":"m"},{"n":37,"text":"이 문장은 곰팡이가 사는 장소를 알려 줘요. 우리 집 지하실이나 화장실처럼 어둡고 서늘하고 습한 곳을 떠올리면 되죠.","hl":"mn"},{"n":38,"text":"첫 번째, Think of는 동사원형으로 시작하는 명령문이에요. 그래서 생각해 보세요라는 뜻이 되죠. 두 번째, and는 이어 주는 말이에요. dark, cool, humid 세 가지 특징을 한 번에 이어 줘요. 세 번째, like는 좋아하다 말고도 ~처럼이라는 뜻이 있어요. 여기서는 예시를 들 때 쓴 like예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보이나요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Can \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">see\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">검은 무언가가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">something \u003c/span>\u003cspan class=\"tgt\">dark\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">너희 샤워 커튼 위에서\u003c/span>\u003cspan class=\"en\">on your shower curtains?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">샤워 커튼 위에서 검은 무언가가 보이나요?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 샤워 커튼 위의 검은 것을 \u003cb class=\"key\">질문\u003c/b>으로 찾게 해요. 곰팡이가 \u003cb class=\"key\">집 \u003c/b>\u003cb class=\"key\">안\u003c/b>에도 있다는 걸 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">도와주는 동사 can(조동사)\u003c/span> : Can + 누가(you) + 하다(see)? = ~할 수 있나요? : \"보이나요?\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">형용사가 뒤에서 꾸미기(형용사)\u003c/span> : something + dark(형용사) = 검은 무언가 : \"검은 무언가\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"Can you see, 보이나요. something dark, 검은 무언가가. on your shower curtains?, 너희 샤워 커튼 위에서. 이 문장 전체를 해석하면, 샤워 커튼 위에서 검은 무언가가 보이나요?","hl":"m"},{"n":40,"text":"이 문장은 질문으로 우리를 안내해요. 샤워 커튼에 붙은 검은 것을 찾아보라고 하죠. 곰팡이가 집 안에도 있다는 걸 알려 주는 거예요.","hl":"mn"},{"n":41,"text":"첫 번째, Can은 도와주는 동사 조동사예요. 조동사를 맨 앞으로 보내면 ~할 수 있나요?라는 질문이 돼요. 두 번째, something dark는 검은 무언가라는 뜻이에요. something 같은 말은 형용사를 뒤에 붙여요. 그래서 dark가 something 뒤에 오는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 ~이에요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">That's\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또한 곰팡이에요\u003c/span>\u003cspan class=\"en\">also mold.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것도 곰팡이에요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 본 검은 것이 \u003cb class=\"key\">곰팡이\u003c/b>라고 딱 짚어 주는 문장이에요. 짧게 \u003cb class=\"key\">확인\u003c/b>해 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사 줄임말(be동사)\u003c/span> : That(저것은) + is(이에요) = That's : \"그것은 ~이에요\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"That's, 그것은 ~이에요. also mold, 또한 곰팡이에요. 이 문장 전체를 해석하면, 그것도 곰팡이에요.","hl":"m"},{"n":43,"text":"이 문장은 앞에서 본 검은 것이 곰팡이라고 딱 짚어 줘요. 짧게 확인해 주는 문장이죠.","hl":"mn"},{"n":44,"text":"That's는 That is의 줄임말이에요. be동사 is가 짧게 줄어든 모습이죠. 입말에서 아주 자주 쓰니까 꼭 익혀 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 있어요\u003c/span>\u003cspan class=\"en\">We \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또한 음식 안에\u003c/span>\u003cspan class=\"en\">also \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in\u003c/span> foods\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">빵과 같은\u003c/span>\u003cspan class=\"en\">like bread.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 또한 빵과 같은 음식 안에도 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 집 안의 장소를 말했고, 이제는 \u003cb class=\"key\">음식\u003c/b> 속에도 있다고 말하며 사는 곳을 넓혀요. 그래서 곰팡이류가 우리 주변 어디에나 있다는 느낌을 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">am·are·is 친구들(be동사)\u003c/span> : 누가(We) + 있어요(are) + 음식 안에(in foods) : \"있어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소 짝꿍 말(전치사)\u003c/span> : 무엇 안에(in) + 장소(foods) : \"~안에\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"We are, 우리는 있어요. also in foods, 또한 음식 안에. like bread, 빵과 같은. 이 문장 전체를 해석하면, 우리는 또한 빵과 같은 음식 안에도 있어요.","hl":"m"},{"n":46,"text":"앞에서는 집 안 이야기를 했죠? 이번에는 우리가 빵 같은 음식 속에도 있다고 말해요. 사는 곳을 음식까지 넓혀 주는 문장이에요.","hl":"mn"},{"n":47,"text":"먼저 are는 '있다'라는 뜻을 나타내는 be동사예요. 그리고 in은 '안에'라는 뜻으로 장소를 알려 주는 전치사이고요. We are in foods를 '우리는 음식 안에 있어요'라고 이해하면 쉬워요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">효모는 만들죠\u003c/span>\u003cspan class=\"en\">Yeast \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">makes\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">반죽이 부풀게\u003c/span>\u003cspan class=\"en\">dough rise,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 네가 ~할 때\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">when\u003c/span> you\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 반죽을 구우면\u003c/span>\u003cspan class=\"en\">bake the dough,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 되어요\u003c/span>\u003cspan class=\"en\">it becomes\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">맛있고 부드러운 빵이\u003c/span>\u003cspan class=\"en\">delicious and soft bread.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">효모는 밀가루 반죽이 부풀게 만들고, 그 반죽을 구우면 맛있고 부드러운 빵이 돼요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 효모가 \u003cb class=\"key\">반죽\u003c/b>을 부풀게 하고, 그 반죽을 구우면 맛있는 빵이 된다는 뜻이에요. 곰팡이류가 음식에서 좋은 일을 한다는 것을 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">한 사람·한 개일 때 동사 + s(3인칭 단수)\u003c/span> : 누가(Yeast) + 만든다(makes) + 반죽이 부풀게(dough rise) : \"만들어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">때를 이어 주는 말(접속사)\u003c/span> : when + 누가(you) + 해요(bake) + 무엇을(the dough) : \"~할 때\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"Yeast makes, 효모는 만들죠. dough rise, 반죽이 부풀게. and when you, 그리고 네가 ~할 때. bake the dough, 그 반죽을 구우면. it becomes, 그것은 되어요. delicious and soft bread, 맛있고 부드러운 빵이. 이 문장 전체를 해석하면, 효모는 밀가루 반죽이 부풀게 만들고, 그 반죽을 구우면 맛있고 부드러운 빵이 돼요.","hl":"m"},{"n":49,"text":"효모는 반죽을 부풀게 해요. 그리고 그 반죽을 오븐에 구우면 맛있고 부드러운 빵이 되죠. 곰팡이류가 음식에서 좋은 일도 한다는 걸 알려 주는 문장이에요.","hl":"mn"},{"n":50,"text":"먼저 Yeast는 한 개를 가리키는 주어라서 동사 make에 s를 붙여 makes라고 해요. 다음으로 when은 '~할 때'라는 뜻으로 두 일을 이어 주는 접속사예요. 그래서 when you bake the dough는 '네가 그 반죽을 구울 때'라고 이해하면 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 15 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 그것은\u003c/span>\u003cspan class=\"en\">But that's\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전부가 아니에요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">not\u003c/span> all.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 그게 다가 아닙니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 효모가 빵을 만들고 치즈와 요거트도 만든다고 했죠. 하지만 좋은 일은 \u003cb class=\"key\">그것만\u003c/b>이 아니라는 뜻으로, 다음에 더 놀라운 이야기가 나올 것을 기대하게 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정하는 말(부정문)\u003c/span> : 그것은(That's) + 아니에요(not) + 전부(all) : \"다가 아니에요\"\u003c/div>\u003c/div>","segs":[{"n":51,"text":"But that's, 하지만 그것은. not all, 전부가 아니에요. 이 문장 전체를 해석하면, 하지만 그게 다가 아닙니다.","hl":"m"},{"n":52,"text":"앞에서 효모가 빵을 만들고 치즈와 요거트도 만든다고 했죠. 그런데 좋은 일은 그것만이 아니에요. 그래서 다음에 더 놀라운 이야기가 나올 것 같다는 신호를 주는 문장이에요.","hl":"mn"},{"n":53,"text":"여기서 not은 '아니에요'라고 뜻을 바꾸는 부정문이에요. 그래서 not all은 '전부가 아니에요'라는 뜻이 되죠. But that's not all을 통째로 '하지만 그게 다가 아닙니다'라고 기억해 두면 좋아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 16 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 또한 ~할 수 있어요\u003c/span>\u003cspan class=\"en\">We \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">also \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">훌륭한 치즈를 만들다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">make\u003c/span> great \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">cheese \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 요구르트도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">yogurt\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 훌륭한 치즈와 요구르트도 만들 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 우리가 우리에게 좋은 음식도 만든다고 알려 줘요. 앞에서 말한 빵에 이어 \u003cb class=\"key\">치즈\u003c/b>와 \u003cb class=\"key\">요구르트\u003c/b>로 이야기를 넓혀 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">도와주는 동사 can(조동사)\u003c/span> : 누가(We) + 할 수 있어요(can) + 만들다(make) : \"만들 수도 있어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 치즈(cheese) + 그리고(and) + 요구르트(yogurt) : \"치즈와 요구르트\"\u003c/div>\u003c/div>","segs":[{"n":54,"text":"We can also, 우리는 또한 ~할 수 있어요. make great cheese, 훌륭한 치즈를 만들다. and yogurt, 그리고 요구르트도. 이 문장 전체를 해석하면, 우리는 훌륭한 치즈와 요구르트도 만들 수 있어요.","hl":"m"},{"n":55,"text":"앞에서 우리가 빵을 맛있게 만든다고 했죠. 이번에는 치즈와 요구르트를 소개해요. 우리가 얼마나 쓸모 있는지 보여 주는 문장이에요.","hl":"mn"},{"n":56,"text":"첫 번째, can은 동사를 도와주는 도와주는 동사예요. 그래서 뒤에 오는 make는 동사원형 그대로 써요. 두 번째, also는 '또한'이라는 뜻으로 can 뒤에 와요. 세 번째, and는 치즈와 요구르트를 이어 주는 이어 주는 말이에요. 아주 쉽죠?","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 17 / 19\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보시다시피,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">As \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">see,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 있어요\u003c/span>\u003cspan class=\"en\">we \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어디에나\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">everywhere\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">보시다시피, 우리는 어디에나 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글의 내용을 한 번에 정리하는 \u003cb class=\"key\">중심 \u003c/b>\u003cb class=\"key\">문장\u003c/b>이에요. 집에도, 음식에도 우리가 있다는 걸 다시 알려 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">덩어리 표현(As you can see)\u003c/span> : 보시다시피(As you can see) : \"보시다시피\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be동사(am·are·is 친구들)\u003c/span> : 우리는(we) + 있습니다(are) + 어디에나(everywhere) : \"어디에나 있어요\"\u003c/div>\u003c/div>","segs":[{"n":57,"text":"As you can see, 보시다시피. we are, 우리는 있어요. everywhere, 어디에나. 이 문장 전체를 해석하면, 보시다시피, 우리는 어디에나 있습니다.","hl":"m"},{"n":58,"text":"이 문장은 글을 마무리하며 정리해 주는 문장이에요. 집에도, 빵에도, 우리 몸에도 우리가 있다는 걸 다시 알려 줘요.","hl":"mn"},{"n":59,"text":"첫 번째, As you can see는 통째로 외우는 덩어리 표현이에요. 두 번째, 주어가 we니까 be동사는 are를 써요. 세 번째, everywhere는 어디에나라는 뜻이에요. 여러분도 이 표현을 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 18 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 ~이지 않아요\u003c/span>\u003cspan class=\"en\">We \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">aren't\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무서운\u003c/span>\u003cspan class=\"en\">horrible.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 무섭지 않아요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 우리가 여기저기 있다고 했으니, 무섭게 느낀 친구들의 걱정을 풀어 주는 문장이에요. \u003cb class=\"key\">부정\u003c/b>으로 말해 우리가 나쁜 존재가 아니라고 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사 부정(be동사 + not)\u003c/span> : 우리는(We) + 아니에요(aren't) + 무서운(horrible) : \"무섭지 않아요\"\u003c/div>\u003c/div>","segs":[{"n":60,"text":"We aren't, 우리는 ~이지 않아요. horrible, 무서운. 이 문장 전체를 해석하면, 우리는 무섭지 않아요.","hl":"m"},{"n":61,"text":"앞에서 우리가 집에도, 음식에도 있다고 했죠. 그래서 혹시 무섭게 느낀 친구들에게 아니라고 말해 주는 거예요.","hl":"mn"},{"n":62,"text":"첫 번째, are에 not을 붙이면 aren't가 돼요. 두 번째, be동사 뒤에 not을 붙이면 '~이 아니에요'라는 뜻이 돼요. 그래서 우리는 무섭지 않아요라고 말하는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 19 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 중 몇몇은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Some \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">us\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사실 ~하고 싶어 해요\u003c/span>\u003cspan class=\"en\">actually \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">want \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분의 친구가 되기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be\u003c/span> your friends.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리 중 몇몇은 사실 여러분의 친구가 되고 싶어 해요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 곰팡이가 무섭기만 한 존재가 아니라 \u003cb class=\"key\">친구\u003c/b>가 되고 싶어 하는 존재라고 말해요. 글의 마지막에서 \u003cb class=\"key\">친근하게\u003c/b> 말을 걸어 독자의 마음을 바꾸는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수량 표현(some of)\u003c/span> : 몇몇은(Some of us) + 말해요 : \"우리 중 몇몇은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">want + to 동사원형(want to + 동사원형)\u003c/span> : 누가(we) + 하고 싶다(want) + 되기를(to be) : \"되고 싶어 해요\"\u003c/div>\u003c/div>","segs":[{"n":63,"text":"Some of us, 우리 중 몇몇은. actually want, 사실 ~하고 싶어 해요. to be your friends, 여러분의 친구가 되기를. 이 문장 전체를 해석하면, 우리 중 몇몇은 사실 여러분의 친구가 되고 싶어 해요.","hl":"m"},{"n":64,"text":"이 문장은 곰팡이가 무섭기만 한 존재가 아니라 친구가 되고 싶어 하는 존재라고 말해요. 글의 마지막에서 친근하게 말을 걸어 독자의 마음을 바꾸는 역할을 해요.","hl":"mn"},{"n":65,"text":"첫 번째로 Some of us를 볼까요? some은 몇몇이라는 뜻이고 of us는 우리 중이라는 뜻이에요. 그래서 Some of us는 우리 중 몇몇은이 되죠. 두 번째로 want to be를 보면, want 뒤에 to와 동사원형 be가 와서 되고 싶다는 뜻이 돼요. 여기서는 친구가 되고 싶다는 뜻으로 쓰였어요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">오늘 배운 내용 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>균류는 \u003cb class=\"key\">버섯\u003c/b>, 곰팡이, 효모처럼 여러 가지 모습으로 우리 주변에 있어요.\u003c/li>\u003cli>버섯과 곰팡이는 어둡고 서늘하고 \u003cb class=\"key\">습한\u003c/b> 곳을 좋아해요.\u003c/li>\u003cli>집 안에서는 \u003cb class=\"key\">지하실\u003c/b>과 화장실, 샤워 커튼에서 곰팡이를 볼 수 있어요.\u003c/li>\u003cli>효모는 반죽을 부풀려 빵을 만들고, 우리는 \u003cb class=\"key\">무섭지 \u003c/b>\u003cb class=\"key\">않은\u003c/b> 친구예요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Fungi live everywhere around us, and they are not scary.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">이 글은 균인 내가 직접 말하는 형식으로, 우리 균류가 버섯·곰팡이·효모로 여러 곳에 살고 있다는 것을 알려 줘요. \u003cb class=\"key\">균류\u003c/b>는 어둡고 서늘하고 습한 곳, 집 안, 음식 속 등 \u003cb class=\"key\">어디에나\u003c/b> 있고 무섭지 않은 존재라고 말해요.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":66,"text":"오늘 우리는 균류가 무엇인지, 어디에 사는지 배웠어요. 버섯, 곰팡이, 효모 모두 우리 주변 어디에나 있죠. 무섭게만 생각했던 균류가 사실은 빵과 치즈를 만들어 주는 고마운 친구라는 것도 알았어요. 오늘도 정말 잘했어요, 여러분 최고예요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
