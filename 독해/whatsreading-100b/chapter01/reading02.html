</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"왓츠 리딩 100B Ch.1 Unit 02 A Giant Cactus in the Desert","audioDir":"reading02_audio","preview":false,"count":54,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.400em\">Ch.1 Unit 02\u003cbr>A Giant Cactus\u003cbr>in the Desert\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">왓츠 리딩 100B\u003c/div>\u003ch1>A Giant Cactus in the Desert\u003c/h1>\u003ch2>사막에 사는 거대한 선인장\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">한 줄 요약\u003c/span>\u003cspan>요약: 사막 식물들은 \u003cb class=\"key\">잎을 \u003c/b>\u003cb class=\"key\">작게\u003c/b> 만들어 물을 덜 잃고 살아남아요. 사와로 선인장은 \u003cb class=\"key\">넓은 \u003c/b>\u003cb class=\"key\">뿌리\u003c/b>로 비가 올 때 물을 빨리 흡수해 800리터나 담아 두고, \u003cb class=\"key\">큰 \u003c/b>\u003cb class=\"key\">가시\u003c/b>로 자신을 지키며 동물들에게 집을 내어 줍니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Desert plants have special ways to live without much water.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘도 만나서 반가워요. 오늘은 사막에서 살아남는 신기한 식물 이야기를 읽어 볼 거예요. 제목은 A Giant Cactus in the Desert, 사막에 사는 거대한 선인장이에요. 물이 거의 없는 곳에서 식물이 어떻게 사는지 함께 알아볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">미리 알면 쉬워요\u003c/span>\u003cdiv class=\"lp-box\">사막(desert)은 비가 아주 적게 오고 낮에는 몹시 뜨거운 곳이에요. 그래서 사막에 사는 식물은 물을 아껴 쓰는 특별한 방법을 가지고 있답니다. 선인장(cactus)은 잎을 작게 만들고 가시를 키워서 물이 빠져나가는 것을 줄여요. 이건 목이 마를 때 마시려고 물병에 물을 담아 두는 것과 비슷해요. 사와로 선인장은 800리터, 욕조 여러 개를 채울 만큼의 \u003cb class=\"key\">물\u003c/b>을 몸에 담아 둘 수 있어요.\u003c/div>","segs":[{"n":2,"text":"사막은 비가 아주 조금 오고 낮에는 아주 뜨거운 곳이에요. 여러분이 만약 이런 곳에 가게 된다면 물을 아껴야겠죠? 사막 식물도 똑같아요. 물을 아끼려고 잎을 작게 만들고, 물을 오래 담아 두는 방법을 써요. 여러분은 물을 오래 보관하려면 어떻게 해야 한다고 생각해요? 물병에 물을 담아 두는 것처럼, 이 선인장도 몸속에 물을 담아 둔답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>사막 식물의 지혜\u003csmall>소개 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>모든 사막 식물은 건조한 날씨에서도 살아남을 수 있어요. 그런데 \u003cb class=\"key\">물이 \u003c/b>\u003cb class=\"key\">없이\u003c/b> 어떻게 살까요? 그 비밀은 \u003cb class=\"key\">작은 \u003c/b>\u003cb class=\"key\">잎\u003c/b>이에요. 잎을 작게 만들면 물을 덜 잃는답니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>넓게 퍼진 뿌리\u003csmall>예시 · 문장 4–8\u003c/small>\u003c/h4>\u003cp>어떤 사막 식물은 \u003cb class=\"key\">큰 \u003c/b>\u003cb class=\"key\">뿌리\u003c/b>를 가지고 있어요. 그 예가 사와로 선인장인데, 뿌리가 \u003cb class=\"key\">사막을 \u003c/b>\u003cb class=\"key\">가로질러\u003c/b> 자라요. 모래 아래로 깊이 들어가지는 않지만 비가 오면 \u003cb class=\"key\">물을 \u003c/b>\u003cb class=\"key\">빨리 \u003c/b>\u003cb class=\"key\">흡수\u003c/b>해요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>물을 담아 두기\u003csmall>이유 · 문장 9–10\u003c/small>\u003c/h4>\u003cp>사와로 선인장은 \u003cb class=\"key\">팔백 \u003c/b>\u003cb class=\"key\">리터\u003c/b>만큼 많은 물을 몸에 담을 수 있어요. 그 물을 \u003cb class=\"key\">건기\u003c/b> 동안 조금씩 꺼내 쓰는 거예요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>가시와 동물의 집\u003csmall>마무리 · 문장 11–14\u003c/small>\u003c/h4>\u003cp>사와로 선인장은 \u003cb class=\"key\">큰 \u003c/b>\u003cb class=\"key\">가시\u003c/b>가 있어서 동물이 쉽게 먹지 못해요. 대신 새들이 구멍을 내고 \u003cb class=\"key\">둥지\u003c/b>를 만들어요. 새가 나가면 다른 동물이 그 집을 \u003cb class=\"key\">넘겨받아요\u003c/b>.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 오늘 글의 흐름을 따라가며 읽어 볼까요?","hl":null},{"n":4,"text":"첫 번째 단계는 사막 식물의 지혜예요. 모든 사막 식물은 건조한 날씨에서도 살아남을 수 있어요. 그런데 물이 없이 어떻게 살까요? 그 비밀은 작은 잎에 있어요. 잎을 작게 만들면 물을 덜 잃는대요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 넓게 퍼진 뿌리예요. 어떤 사막 식물은 큰 뿌리를 가지고 있어요. 그 대표가 바로 사와로 선인장인데, 뿌리가 사막을 가로질러 자라요. 모래 아래로 깊이 들어가지는 않지만 비가 오면 물을 빨리 흡수한답니다.","hl":"f1"},{"n":6,"text":"세 번째 단계는 물을 담아 두는 방법이에요. 사와로 선인장은 팔백 리터만큼 많은 물을 몸에 담을 수 있어요. 그 물을 건기 동안 조금씩 꺼내 쓰는 거예요. 물통에 물을 가득 채워 두는 것과 같아요.","hl":"f2"},{"n":7,"text":"마지막 단계는 가시와 동물의 집이에요. 사와로 선인장은 큰 가시가 있어서 동물이 쉽게 먹을 수 없어요. 그런데 이 선인장은 동물에게 집이 되어 줘요. 힐라딱따구리 같은 새가 구멍을 내고 둥지를 만들고, 새들이 나가면 다른 동물이 그 집을 넘겨받는답니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">설명하기(사실을 차례로 알려 주는 글)\u003c/span>\u003cspan class=\"lp-pill\">처음\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 사막 식물은 \u003cb class=\"key\">건조한 \u003c/b>\u003cb class=\"key\">날씨에서 \u003c/b>\u003cb class=\"key\">살아남을 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">있다\u003c/b>고 주제를 먼저 말해요. 그다음 사와로 선인장이라는 \u003cb class=\"key\">예시\u003c/b>를 들어 뿌리, 물, 가시를 차례로 설명해요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>But (7)\u003c/b>\u003cspan>반대 내용을 알려 줌\u003c/span>\u003cb>When (8)\u003c/b>\u003cspan>때를 알려 줌\u003c/span>\u003cb>so (11)\u003c/b>\u003cspan>이유와 결과를 이어 줌\u003c/span>\u003cb>Instead (12)\u003c/b>\u003cspan>다른 쪽 내용으로 바꿔 줌\u003c/span>\u003cb>then (13)\u003c/b>\u003cspan>순서를 알려 줌\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">desert plants\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">some desert plants\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">one plant with huge roots\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a saguaro cactus\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the cactus\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the plant\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 사실을 차례로 알려 주는 설명하는 글이에요. 중심 문장은 첫 번째 문장에 나와요. 모든 사막 식물이 건조한 날씨에서 살아남을 수 있다고 먼저 말하고, 그다음 사와로 선인장을 예로 들어 자세히 설명해요.","hl":"ty"},{"n":9,"text":"글을 읽을 때 길잡이 말을 찾으면 내용이 잘 보여요. 일곱 번째 문장의 But은 앞 내용과 반대되는 이야기를 알려 줘요. 여덟 번째 문장의 When은 언제인지 알려 주고, 열한 번째 문장의 so는 이유와 결과를 이어 줘요. Instead는 다른 방향으로 바꿔 주는 말이고, 사와로 선인장은 the cactus나 the plant처럼 다르게 불리기도 해요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 단어\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>desert\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사막\u003c/span>\u003c/div>\u003cdiv>\u003cb>survive\u003c/b>\u003cem>동사\u003c/em>\u003cspan>살아남다\u003c/span>\u003c/div>\u003cdiv>\u003cb>dry\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>건조한\u003c/span>\u003c/div>\u003cdiv>\u003cb>without\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~없이\u003c/span>\u003c/div>\u003cdiv>\u003cb>leaves\u003c/b>\u003cem>명사\u003c/em>\u003cspan>잎(leaf의 복수)\u003c/span>\u003c/div>\u003cdiv>\u003cb>lose\u003c/b>\u003cem>동사\u003c/em>\u003cspan>잃다\u003c/span>\u003c/div>\u003cdiv>\u003cb>root\u003c/b>\u003cem>명사\u003c/em>\u003cspan>뿌리\u003c/span>\u003c/div>\u003cdiv>\u003cb>huge\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>거대한\u003c/span>\u003c/div>\u003cdiv>\u003cb>grow\u003c/b>\u003cem>동사\u003c/em>\u003cspan>자라다\u003c/span>\u003c/div>\u003cdiv>\u003cb>across\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~을 가로질러\u003c/span>\u003c/div>\u003cdiv>\u003cb>deep\u003c/b>\u003cem>부사\u003c/em>\u003cspan>깊이\u003c/span>\u003c/div>\u003cdiv>\u003cb>sand\u003c/b>\u003cem>명사\u003c/em>\u003cspan>모래\u003c/span>\u003c/div>\u003cdiv>\u003cb>quickly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>빠르게\u003c/span>\u003c/div>\u003cdiv>\u003cb>take in\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>흡수하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>hold\u003c/b>\u003cem>동사\u003c/em>\u003cspan>담다\u003c/span>\u003c/div>\u003cdiv>\u003cb>dry season\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>건기\u003c/span>\u003c/div>\u003cdiv>\u003cb>spine\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가시\u003c/span>\u003c/div>\u003cdiv>\u003cb>instead\u003c/b>\u003cem>부사\u003c/em>\u003cspan>대신에\u003c/span>\u003c/div>\u003cdiv>\u003cb>nest\u003c/b>\u003cem>명사\u003c/em>\u003cspan>둥지\u003c/span>\u003c/div>\u003cdiv>\u003cb>take over\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>넘겨받다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"오늘의 단어도 소리 내어 읽어 볼게요. survive는 살아남다라는 뜻이에요. desert는 사막, huge는 거대한이라는 뜻이고, root는 뿌리예요. take in은 흡수하다, spine은 가시, nest는 둥지라는 뜻이랍니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">survive\u003c/b>\u003cspan class=\"m\">살아남다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">live\u003c/span>\u003cspan class=\"s\">stay alive\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">die\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">huge\u003c/b>\u003cspan class=\"m\">거대한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">big\u003c/span>\u003cspan class=\"s\">large\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">small\u003c/span>\u003cspan class=\"a\">tiny\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">dry\u003c/b>\u003cspan class=\"m\">건조한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">not wet\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">wet\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">quickly\u003c/b>\u003cspan class=\"m\">빠르게\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">fast\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">slowly\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">lose\u003c/b>\u003cspan class=\"m\">잃다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">miss\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">find\u003c/span>\u003cspan class=\"a\">keep\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"비슷한 말과 반대말도 함께 정리해 볼게요. survive는 live와 비슷하고 die와 반대예요. huge는 big이나 large와 비슷하고 small과 반대죠. dry는 wet의 반대이고, quickly는 fast와 비슷하고 slowly와 반대예요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 14\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl= =\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들은 어떻게 살 수 있을까요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">How \u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">live\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 물이 없어도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">without \u003c/span>\u003cspan class=\"tgt\">much \u003c/span>\u003cspan class=\"tgt\">water\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것들은 어떻게 많은 물이 없어도 살 수 있을까요?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사막 식물들이 물 없이 어떻게 사는지 \u003cb class=\"key\">물음\u003c/b>을 던지는 문장이에요. 다음 문장에서 그 답을 알려 줄 거예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">도와주는 동사 can이 든 의문문(조동사 의문문)\u003c/span> : 어떻게(How) + ~할 수 있나요(can) + 그들이(they) + 하다(live) : \"그들이 어떻게 살 수 있을까요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">'~없이'를 뜻하는 짝꿍 말(전치사 without)\u003c/span> : 없이(without) + 많은(much) + 물(water) : \"많은 물 없이\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"How can they live, 그것들은 어떻게 살 수 있을까요. without much water?, 많은 물이 없어도. 이 문장 전체를 해석하면, 그것들은 어떻게 많은 물이 없어도 살 수 있을까요?","hl":"m"},{"n":16,"text":"이 문장은 물이 거의 없는데 사막 식물들이 어떻게 사는지 물음을 던지고 있어요. 바로 다음 문장에서 그 비밀을 알려 준답니다.","hl":"mn"},{"n":17,"text":"먼저 How can they live를 봐요. 궁금한 걸 물을 때는 의문사 How를 맨 앞에 두고 can을 주어 앞으로 보내요. 그래서 어떻게 살 수 있을까요라는 뜻이 되죠. 다음으로 without much water를 봐요. without은 없이라는 뜻을 가진 전치사이고, 물은 셀 수 없으니까 much를 써요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 식물들은\ o 뒤에 동사를 붙이면 하기 위해라는 목적을 나타내고, less는 little의 비교급으로 더 적은이라는 뜻이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몇몇 사막 식물들은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Some \u003c/span>\u003cspan class=\"tgt\">desert \u003c/span>\u003cspan class=\"tgt\">plants\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">큰 뿌리를 가지고 있어요.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">have\u003c/span> big roots.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어떤 사막 식물들은 큰 뿌리를 가지고 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사막 식물들 중에는 \u003cb class=\"key\">큰 \u003c/b>\u003cb class=\"key\">뿌리\u003c/b>를 가진 식물이 있어요. 이 문장은 사막 식물이 물을 구하는 방법 중 하나를 알려 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">복수 명사(단수·복수)\u003c/span> : 여러 개일 때 명사 뒤에 s(plants) : \"몇몇 사막 식물들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">복수 주어와 have(일반동사)\u003c/span> : 여러 개 주어(They) + have + 무엇을(big roots) : \"가지고 있어요\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Some desert plants, 몇몇 사막 식물들은. have big roots, 큰 뿌리를 가지고 있어요.. 이 문장 전체를 해석하면, 어떤 사막 식물들은 큰 뿌리를 가지고 있어요.","hl":"m"},{"n":22,"text":"이 문장은 사막 식물이 큰 뿌리를 가지고 있다고 알려 줘요. 큰 뿌리는 물을 더 많이 모으는 데 도움을 줘요.","hl":"mn"},{"n":23,"text":"첫 번째로 plants처럼 명사 뒤에 s가 붙으면 여러 식물이라는 뜻이에요. 두 번째로 주어가 여러 개일 때는 have를 써서 가지고 있다고 말해요. 그래서 Some desert plants have big roots는 몇몇 사막 식물들은 큰 뿌리를 가지고 있어요라는 뜻이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 식물이\u003c/span>\u003cspan -sno\">문장 7 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 그것은 ~하지 않아요\u003c/span>\u003cspan class=\"en\">But \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">깊이 뻗어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">go\u003c/span> deep\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모래 아래로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">under \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">sand\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 그것은 모래 아래에 깊이 뻗어 있지 않습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사와로 선인장의 뿌리가 \u003cb class=\"key\">모래 \u003c/b>\u003cb class=\"key\">아래\u003c/b>로 깊이 내려가지 않는다는 말이에요. 앞 문장에서 뿌리가 사방으로 \u003cb class=\"key\">넓게\u003c/b> 자란다고 했으니, 깊이가 아니라 넓이라는 걸 알려 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정문(일반동사 부정문)\u003c/span> : 누가(They) + 하지 않는다(don't go) : \"그것은 가지 않아요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사(장소 전치사)\u003c/span> : under + 무엇(the sand) → '~아래에' : \"모래 아래에\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"But they don't, 하지만 그것은 ~하지 않아요. go deep, 깊이 뻗어요. under the sand, 모래 아래로. 이 문장 전체를 해석하면, 하지만 그것은 모래 아래에 깊이 뻗어 있지 않습니다.","hl":"m"},{"n":31,"text":"이 문장은 사와로 선인장의 뿌리가 모래 아래로 깊이 내려가지 않는다고 말해요. 바로 앞에서 뿌리가 넓게 퍼진다고 했으니, 뿌리는 깊은 곳이 아니라 넓은 곳으로 뻗는다는 걸 알려 주는 문장이에요.","hl":"mn"},{"n":32,"text":"첫 번째, they don't go는 '그것은 가지 않아요'라는 부정문이에요. don't는 동사 앞에 와서 '하지 않아요'를 만들어 줘요. 그리고 여기서 they는 앞에 나온 the roots를 대신하는 말이에요. 두 번째, under the sand에서 under는 '아래'라는 뜻의 전치사예요. 그래서 모래 아래로 깊이 내려가지 않는다는 뜻이 되는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 14\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">비가 오면,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">rains\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">뿌리는\u003c/span>\u003cspan class=\"en\">the roots\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">빠르게 ~할 수 있어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">quickly \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">물을 흡수해요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">take \u003c/span>\u003cspan class=\"tgt\">in\u003c/span> water.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">비가 오면 뿌리는 물을 빠르게 흡수할 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 비가 오면 뿌리가 물을 \u003cb class=\"key\">빠르게\u003c/b> \u003cb class=\"key\">흡수\u003c/b>한다는 뜻이에요. 그래서 선인장이 \u003cb class=\"key\">건조한\u003c/b> 날씨에도 살 수 있다는 걸 알려 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사(when)\u003c/span> : When + 누가(it) + 한다(rains) → '~하면' : \"비가 오면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사(can)\u003c/span> : 누가(the roots) + 할 수 있다(can) + 무엇을(take in water) : \"빠르게 흡수할 수 있어요\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"When it rains, 비가 오면. the roots, 뿌리는. can quickly, 빠르게 ~할 수 있어요. take in water, 물을 흡수해요. 이 문장 전체를 해석하면, 비가 오면 뿌리는 물을 빠르게 흡수할 수 있어요.","hl":"m"},{"n":34,"text":"비가 오면 뿌리가 물을 빠르게 흡수한다는 뜻이에요. 그래서 선인장이 건조한 날씨에도 살 수 있다는 걸 알려 주는 거예요.","hl":"mn"},{"n":35,"text":"첫 번째, when은 '~하면'이라고 두 가지 일을 이어 주는 접속사예요. 두 번째, can은 '할 수 있다'라고 도와주는 동사라서 뒤에 동사원형 take가 와요. 그래서 '빠르게 흡수할 수 있어요'가 되는 거예요. 참 쉽죠?","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사와로 선인장은\u003c/span>\u003cspan class=\"en\">A saguaro cactus\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">담을 수 있어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">hold\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~만큼이나 많이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">much \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">800리터의 물을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">800 \u003c/span>\u003cspan class=\"tgt\">liters \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">water\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사와로 선인장은 800리터만큼 많은 물을 담을 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사와로 선인장이 몸 안에 \u003cb class=\"key\">많은 \u003c/b>\u003cb class=\"key\">물\u003c/b>을 \u003cb class=\"key\">저장\u003c/b>할 수 있다는 말이에요. 그 물을 \u003cb class=\"key\">건기\u003c/b>에 쓴다고 다음 문장으로 이어져요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사(can)\u003c/span> : 누가(A saguaro cactus) + 할 수 있다(can hold) + 무엇을(water) : \"담을 수 있어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수량 덩어리 표현(as much as)\u003c/span> : as much as + 숫자 → '숫자만큼이나 많이' : \"800리터만큼이나 많은 물\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"A saguaro cactus, 사와로 선인장은. can hold, 담을 수 있어요. as much as, ~만큼이나 많이. 800 liters of water, 800리터의 물을. 이 문장 전체를 해석하면, 사와로 선인장은 800리터만큼 많은 물을 담을 수 있습니다.","hl":"m"},{"n":37,"text":"사와로 선인장은 몸 안에 많은 물을 저장할 수 있어요. 그 물을 건기에 쓴다고 다음 문장으로 이어지는 거죠. 정말 신기한 식물이죠?","hl":"mn"},{"n":38,"text":"첫 번째, can은 '할 수 있다'라는 도와주는 동사예요. 그래서 뒤에 동사원형 hold가 와요. 그리고 hold는 '담다'라는 뜻이라 물을 몸 안에 저장한다는 말이 돼요. 두 번째, as much as는 '만큼이나 많이'라고 양을 강조하는 덩어리 표현이에요. 숫자 앞에 붙여서 '팔백 리터만큼이나 많이'라고 말할 수 있어요. 여러분도 오늘 배운 문장을 소리 내어 세 번 읽어 볼까요?","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 선인장은 사용해요\u003c/span>\u003cspan class=\"en\">The cactus \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">uses\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 물을\u003c/span>\u003cspan class=\"en\">that water\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">건기 동안.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">during \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">dry \u003c/span>\u003cspan class=\"tgt\">season\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 선인장은 건기 동안 그 물을 사용해요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 선인장이 \u003cb class=\"key\">건기\u003c/b> 동안 그 물을 쓴다는 뜻이에요. 앞에서 물을 많이 \u003cb class=\"key\">저장\u003c/b>한다고 했으니, 그 물을 언제 쓰는지 알려 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">한 사람·한 개일 때 동사 + s(3인칭 단수)\u003c/span> : 한 개(The cactus) + 써요(uses) + 무엇을(that water) : \"사용해요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소·시간 짝꿍 말(전치사)\u003c/span> : ~동안(during) + 건기(the dry season) : \"건기 동안\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"The cactus uses, 그 선인장은 사용해요. that water, 그 물을. during the dry season, 건기 동안.. 이 문장 전체를 해석하면, 그 선인장은 건기 동안 그 물을 사용해요.","hl":"m"},{"n":40,"text":"이 문장은 선인장이 건기 동안 그 물을 사용한다는 뜻이에요. 앞에서 물을 많이 저장한다고 했죠? 그래서 그 물을 언제 쓰는지 알려 주는 거예요.","hl":"mn"},{"n":41,"text":"첫 번째, uses를 눈여겨보세요. 주어 The cactus가 한 개니까 동사에 s가 붙어서 uses가 됐어요. 두 번째, during은 시간 앞에 붙는 전치사예요. during the dry season이라고 하면 건기 동안이라는 뜻이 된답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사와로 선인장이\u003c/span>\u003cspan class=\"en\">A saguaro cactus\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">큰 가시를 가지고 있어서,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">has\u003c/span> big spines,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서 동물들은 할 수 없어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">so\u003c/span> animals \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">can't\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 쉽게 먹는 것을.\u003c/span>\u003cspan class=\"en\">easily eat it.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사와로 선인장이 큰 가시를 가지고 있어서, 동물들은 그것을 쉽게 먹을 수 없습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사와로 선인장은 \u003cb class=\"key\">큰 \u003c/b>\u003cb class=\"key\">가시\u003c/b> 때문에 동물이 쉽게 먹지 못한다는 뜻이에요. 가시가 선인장을 지켜 주는 \u003cb class=\"key\">보호 \u003c/b>\u003cb class=\"key\">장치\u003c/b> 역할을 한다는 걸 알려 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">한 사람·한 개일 때 동사 + s(3인칭 단수)\u003c/span> : 한 개(A saguaro cactus) + 가지고 있어요(has) + 무엇을(big spines) : \"가지고 있어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 이유 + so + 결과 : \"그래서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">도와주는 동사(조동사)\u003c/span> : 동물들은(animals) + 할 수 없다(can't) + 먹다(eat) : \"할 수 없어요\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"A saguaro cactus, 사와로 선인장이. has big spines, 큰 가시를 가지고 있어서. so animals can't, 그래서 동물들은 할 수 없어요. easily eat it, 그것을 쉽게 먹는 것을.. 이 문장 전체를 해석하면, 사와로 선인장이 큰 가시를 가지고 있어서, 동물들은 그것을 쉽게 먹을 수 없습니다.","hl":"m"},{"n":43,"text":"큰 가시 때문에 동물이 이 선인장을 쉽게 먹을 수 없다는 뜻이에요. 가시가 선인장을 지켜 주는 보호 장치인 셈이죠.","hl":"mn"},{"n":44,"text":"첫 번째, has를 보세요. have가 주어가 한 개일 때 has로 바뀐 거예요. 두 번째, so는 그래서라는 뜻으로 앞의 이유와 뒤의 결과를 이어 줘요. 세 번째, can't는 할 수 없다는 뜻을 가진 조동사랍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대신에,\u003c/span>\u003cspan class=\"en\">Instead,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 선인장은 ~이에요\u003c/span>\u003cspan class=\"en\">the cactus \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">집이에요.\u003c/span>\u003cspan class=\"en\">a home.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">대신에, 그 선인장은 집이 됩니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 동물이 먹지 못하는 대신, 그 선인장은 동물에게 \u003cb class=\"key\">집\u003c/b>이 되어 준다는 뜻이에요. 앞 문장과 \u003cb class=\"key\">반대\u003c/b>되는 내용을 instead로 이어 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">am·are·is 친구들(be동사)\u003c/span> : 그 선인장은(the cactus) + ~이에요(is) + 집(a home) : \"~이에요\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"Instead, 대신에. the cactus is, 그 선인장은 ~이에요. a home, 집이에요.. 이 문장 전체를 해석하면, 대신에, 그 선인장은 집이 됩니다.","hl":"m"},{"n":46,"text":"동물이 먹지 못하는 대신, 이 선인장은 동물에게 집이 되어 준다는 뜻이에요. 앞 문장과 반대되는 내용을 instead로 이어 주고 있죠.","hl":"mn"},{"n":47,"text":"is는 be동사예요. 주어가 한 개일 때는 is를 써서 그 선인장은 집이에요라고 말해요. 그리고 Instead는 대신에라는 뜻으로 앞 내용과 반대되는 이야기를 열어 준답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">힐라딱따구리 같은 새들은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Birds \u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">Gila \u003c/span>\u003cspan class=\"tgt\">woodpeckers \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">구멍을 내어\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">make\u003c/span> a hole\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 나서 둥지를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">then\u003c/span> a nest\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 식물 안에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">plant\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">힐라딱따구리 같은 새들은 그 식물 안에 구멍을 내어 둥지를 만들어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 선인장이 동물에게 \u003cb class=\"key\">집\u003c/b>이 되어 줘요. 힐라딱따구리 같은 새가 그 안에 \u003cb class=\"key\">구멍\u003c/b>을 내고 \u003cb class=\"key\">둥지\u003c/b>를 만들어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">여러 마리일 때 동사원형(복수 주어)\u003c/span> : 여러 마리(Birds) + 해요(make) : \"힐라딱따구리 같은 새들이 만들어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말 and(접속사)\u003c/span> : 앞 행동 + and then + 뒤 행동 : \"그리고 나서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">장소를 나타내는 in(전치사)\u003c/span> : in + 장소(the plant) : \"그 식물 안에\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"Birds like Gila woodpeckers, 힐라딱따구리 같은 새들은. make a hole, 구멍을 내어. and then a nest, 그리고 나서 둥지를. in the plant, 그 식물 안에. 이 문장 전체를 해석하면, 힐라딱따구리 같은 새들은 그 식물 안에 구멍을 내어 둥지를 만들어요.","hl":"m"},{"n":49,"text":"이 문장은 선인장이 동물에게 집이 되어 주는 모습을 보여 줘요. Gila woodpeckers 같은 새가 그 식물 안에 구멍을 내고 둥지를 만든다고 말하고 있죠.","hl":"mn"},{"n":50,"text":"첫 번째, Birds like Gila woodpeckers처럼 새가 여러 마리일 때는 동사 make에 s를 붙이지 않고 동사원형을 써요. 두 번째, and then은 '그리고 나서'라는 뜻으로 앞뒤 행동을 이어 주고, then은 '그다음에'라는 느낌을 줘요. 세 번째, in the plant는 '그 식물 안에'라는 뜻으로 장소를 알려 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 나가면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">move \u003c/span>\u003cspan class=\"tgt\">out\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 동물들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">other \u003c/span>\u003cspan class=\"tgt\">animals \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">넘겨받아요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">take\u003c/span> over\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 둥지를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">their\u003c/span> nests.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들이 나가면, 다른 동물들이 그들의 둥지를 넘겨받는답니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 새들이 둥지를 떠나면, 다른 동물들이 그 \u003cb class=\"key\">둥지\u003c/b>를 넘겨받아요. 선인장이 여러 동물에게 \u003cb class=\"key\">집\u003c/b>을 주는 모습을 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">때를 알려 주는 when(접속사)\u003c/span> : When + 누가(they) + 해요(move out), ~해요 : \"그들이 나가면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">여러 마리일 때 동사원형(복수 주어)\u003c/span> : 여러 동물(other animals) + 해요(take) : \"다른 동물들이 넘겨받아요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">소유를 나타내는 their(소유격)\u003c/span> : their + 명사(nests) : \"그들의\"\u003c/div>\u003c/div>","segs":[{"n":51,"text":"When they move out, 그들이 나가면. other animals, 다른 동물들이. take over, 넘겨받아요. their nests, 그들의 둥지를. 이 문장 전체를 해석하면, 그들이 나가면, 다른 동물들이 그들의 둥지를 넘겨받는답니다.","hl":"m"},{"n":52,"text":"이 문장은 새들이 둥지를 떠나면 다른 동물들이 그 둥지를 이어서 쓴다고 말해요. 선인장이 여러 동물에게 집을 주는 모습을 보여 주죠.","hl":"mn"},{"n":53,"text":"첫 번째, When they move out은 '그들이 나가면'이라는 뜻으로 어떤 일이 일어나는 때를 알려 줘요. 두 번째, other animals take에서 animals는 여러 마리라서 take에 s를 붙이지 않고 동사원형을 써요. 세 번째, their는 '그들의'라는 뜻으로 뒤에 오는 nests를 꾸며 줘요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">오늘 배운 내용 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>사막 식물은 \u003cb class=\"key\">잎을 \u003c/b>\u003cb class=\"key\">작게\u003c/b> 만들어 물을 덜 잃어요.\u003c/li>\u003cli>사와로 선인장의 뿌리는 넓게 퍼져서 비가 올 때 \u003cb class=\"key\">물을 \u003c/b>\u003cb class=\"key\">빨리 \u003c/b>\u003cb class=\"key\">흡수\u003c/b>해요.\u003c/li>\u003cli>이 선인장은 \u003cb class=\"key\">팔백 \u003c/b>\u003cb class=\"key\">리터\u003c/b>만큼의 물을 담아 두고 건기에 써요.\u003c/li>\u003cli>\u003cb class=\"key\">큰 \u003c/b>\u003cb class=\"key\">가시\u003c/b>가 동물을 막아 주고, 대신 새와 동물에게 집이 되어 줘요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Desert plants have special ways to live without much water.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: 사막 식물들은 \u003cb class=\"key\">잎을 \u003c/b>\u003cb class=\"key\">작게\u003c/b> 만들어 물을 덜 잃고 살아남아요. 사와로 선인장은 \u003cb class=\"key\">넓은 \u003c/b>\u003cb class=\"key\">뿌리\u003c/b>로 비가 올 때 물을 빨리 흡수해 800리터나 담아 두고, \u003cb class=\"key\">큰 \u003c/b>\u003cb class=\"key\">가시\u003c/b>로 자신을 지키며 동물들에게 집을 내어 줍니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":54,"text":"오늘 우리는 사막 식물이 어떻게 사는지 배웠어요. 잎을 작게 만들어 물을 아끼고, 넓은 뿌리로 물을 빨리 흡수하고, 몸에 물을 담아 두고, 가시로 자신을 지킨다는 것을 꼭 기억해요. 여러분 정말 잘 들었어요! 오늘 배운 문장 몇 개를 소리 내어 읽어 보면 더 좋아요. 다음 시간에 또 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
