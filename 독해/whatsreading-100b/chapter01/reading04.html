</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"왓츠 리딩 100B Ch.1 Unit 04 The Land Full of Salt","audioDir":"reading04_audio","preview":false,"count":45,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.400em\">Ch.1 Unit\u003cbr>04 The Land\u003cbr>Full of Salt\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">왓츠 리딩 100B\u003c/div>\u003ch1>The Land Full of Salt\u003c/h1>\u003ch2>소금으로 가득한 땅\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">한 줄 요약\u003c/span>\u003cspan>사막을 생각하면 뜨겁고 노란 모래가 먼저 떠오르지만, 세상에는 \u003cb class=\"key\">소금\u003c/b>과 \u003cb class=\"key\">광물\u003c/b>로 덮인 소금 사막도 있어요. 소금 사막은 \u003cb class=\"key\">마른 \u003c/b>\u003cb class=\"key\">사막 \u003c/b>\u003cb class=\"key\">호수\u003c/b>로, 물이 마르면 소금이 \u003cb class=\"key\">표면\u003c/b>에 남아 수천 년 동안 쌓이고, 볼리비아의 \u003cb class=\"key\">우유니 \u003c/b>\u003cb class=\"key\">사막\u003c/b>이 가장 큰 예예요.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Salt deserts are dried-up desert lakes where salt and other minerals cover the ground.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 The Land Full of Salt라는 재미있는 글을 함께 읽어 볼 거예요. 이 글은 소금으로 가득한 사막이 무엇인지 알려 주고, 어떻게 소금이 땅 위에 쌓이는지 설명해요. 한 줄로 말하면, 모든 사막이 뜨겁고 노란 모래로 덮인 것은 아니라는 이야기예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">미리 알면 쉬워요\u003c/span>\u003cdiv class=\"lp-box\">사막은 비가 거의 오지 않아 땅이 마른 곳이에요. 보통은 뜨겁고 노란 모래를 떠올리지만, \u003cb class=\"key\">소금 \u003c/b>\u003cb class=\"key\">사막\u003c/b>처럼 하얀 소금과 \u003cb class=\"key\">광물\u003c/b>이 땅을 덮은 곳도 있어요. 이때 소금 사막을 영어로 salt desert, 광물을 mineral이라고 해요. 소금물을 졸이면 냄비 바닥에 하얀 소금이 남는 모습을 생각하면 이해하기 쉬워요. 물이 마르면 소금이 남는다는 점이 소금 사막의 핵심이에요.\u003c/div>","segs":[{"n":2,"text":"여러분, 사막 하면 어떤 모습이 먼저 떠오르나요? 아마 뜨겁고 노란 모래가 끝없이 펼쳐진 모습을 생각하기 쉬울 거예요. 그런데 세상에는 하얀 소금과 광물이 땅을 덮은 소금 사막도 있어요. 소금 사막을 영어로 salt desert, 광물을 mineral이라고 해요. 소금물을 졸이면 냄비 바닥에 하얀 소금이 남는 모습을 떠올리면 이해하기 쉬워요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>사막 하면?\u003csmall>시작 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>사막을 생각하면 보통 뜨겁고 \u003cb class=\"key\">노란 \u003c/b>\u003cb class=\"key\">모래\u003c/b>가 있는 곳이 먼저 떠올라요. 하지만 모든 사막이 뜨겁고 노란 모래를 가진 것은 아니에요. 이 글은 우리의 \u003cb class=\"key\">생각\u003c/b>을 바꾸며 소금 사막을 소개해요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>소금 사막이란?\u003csmall>소개 · 문장 4–6\u003c/small>\u003c/h4>\u003cp>소금 사막은 \u003cb class=\"key\">바싹 \u003c/b>\u003cb class=\"key\">마른 \u003c/b>\u003cb class=\"key\">사막 \u003c/b>\u003cb class=\"key\">호수\u003c/b>예요. 어떤 사람들은 이것을 \u003cb class=\"key\">소금 \u003c/b>\u003cb class=\"key\">평지\u003c/b>라고 불러요. 노란 모래 대신 \u003cb class=\"key\">소금\u003c/b>과 다른 광물이 땅을 덮고 있어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>소금이 남는 과정\u003csmall>이유 · 문장 7–9\u003c/small>\u003c/h4>\u003cp>소금 사막에서는 물이 빠르게 마르고, 물이 마르면 \u003cb class=\"key\">소금\u003c/b>이 땅 \u003cb class=\"key\">표면\u003c/b>에 남아요. 수천 년에 걸쳐 소금이 계속 \u003cb class=\"key\">쌓여요\u003c/b>.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>어디에 있을까?\u003csmall>예시 · 문장 10–11\u003c/small>\u003c/h4>\u003cp>세계에서 가장 큰 소금 사막인 \u003cb class=\"key\">우유니 \u003c/b>\u003cb class=\"key\">사막\u003c/b>은 볼리비아에 있어요. 사하라 사막과 호주의 중앙 사막에서도 다른 소금 사막을 찾을 수 있어요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 사막에 대한 우리의 생각에서 시작해서, 소금 사막이 무엇인지, 어떻게 만들어지는지, 어디에서 볼 수 있는지 차례로 알려 줘요.","hl":null},{"n":4,"text":"먼저 사막을 생각하면 보통 뜨겁고 노란 모래가 있는 곳이 떠오른다고 해요. 하지만 모든 사막이 뜨겁고 노란 모래를 가진 것은 아니에요. 이 글은 우리의 생각을 바꾸면서 소금 사막을 소개해요.","hl":"f0"},{"n":5,"text":"그다음 소금 사막은 바싹 마른 사막 호수라고 설명해요. 어떤 사람들은 이것을 소금 평지, 영어로 salt flat이라고 불러요. 노란 모래 대신 소금과 다른 광물이 땅을 덮고 있다고 해요.","hl":"f1"},{"n":6,"text":"소금 사막에서는 물이 빠르게 마르고, 물이 마르면 소금이 땅 표면에 남아요. 그리고 수천 년에 걸쳐 소금이 계속 쌓여요.","hl":"f2"},{"n":7,"text":"마지막으로 세계에서 가장 큰 소금 사막인 우유니 사막, 영어로 Salar de Uyuni가 볼리비아에 있다고 알려 줘요. 사하라 사막과 호주의 중앙 사막에서도 다른 소금 사막을 찾을 수 있어요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">설명하는 글\u003c/span>\u003cspan class=\"lp-pill\">가운데\u003c/span>\u003cspan class=\"lp-pill\">주제문 4번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 질문으로 시작해 독자의 \u003cb class=\"key\">호기심\u003c/b>을 끌어요. 그리고 가운데에서 소금 사막을 \u003cb class=\"key\">정의\u003c/b>하고, 그다음에 만들어지는 과정과 예를 차례로 설명해요. 그래서 중심 문장이 글 \u003cb class=\"key\">가운데\u003c/b>에 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>However (3)\u003c/b>\u003cspan>반대 내용을 알려 줌\u003c/span>\u003cb>Instead of (6)\u003c/b>\u003cspan>다른 것으로 바뀜을 알려 줌\u003c/span>\u003cb>When (8)\u003c/b>\u003cspan>조건과 때를 알려 줌\u003c/span>\u003cb>Over (9)\u003c/b>\u003cspan>시간이 흐름을 알려 줌\u003c/span>\u003cb>also (11)\u003c/b>\u003cspan>더 있는 내용을 더해 줌\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">a salt desert\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a dried-up desert lake\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a salt flat\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the world's largest salt desert\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the Salar de Uyuni\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>보통 사막\u003c/th>\u003cth>소금 사막\u003c/th>\u003c/tr>\u003ctr>\u003ctd>뜨겁고 노란 모래\u003c/td>\u003ctd>소금과 광물이 지면을 덮음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>물이 적음\u003c/td>\u003ctd>물이 빠르게 마름\u003c/td>\u003c/tr>\u003ctr>\u003ctd>모래가 중심\u003c/td>\u003ctd>소금이 표면에 쌓임\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 설명하는 글이에요. 사막에 대한 질문으로 호기심을 끌어올린 뒤, 가운데에서 소금 사막을 정의하고, 이
