</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"왓츠 리딩 100B Ch.1 Unit 01 A Beautiful Cactus","audioDir":"reading01_audio","preview":false,"count":51,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.400em\">Ch.1 Unit 01\u003cbr>A Beautiful\u003cbr>Cactus\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">왓츠 리딩 100B\u003c/div>\u003ch1>The Couple Who Became a Cactus\u003c/h1>\u003ch2>선인장이 된 연인\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">한 줄 요약\u003c/span>\u003cspan>북미 원주민 마을의 한 남자아이와 \u003cb class=\"key\">추장\u003c/b>의 딸이 \u003cb class=\"key\">사랑\u003c/b>에 빠졌지만, 추장이 반대해서 둘은 산으로 도망쳤어요. 숨을 곳이 없던 두 사람은 \u003cb class=\"key\">대지의 \u003c/b>\u003cb class=\"key\">여신\u003c/b>에게 기도했고, 여신이 \u003cb class=\"key\">산에 \u003c/b>\u003cb class=\"key\">구멍\u003c/b>을 열어 숨겨 주었으며 다음 날 두 사람은 \u003cb class=\"key\">선인장\u003c/b>으로 변했답니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>A boy and a chief's daughter ran away to stay together, and the next day they became a cactus.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘도 만나서 정말 반가워요. 오늘 읽을 이야기는 왓츠 리딩, 첫 번째 유닛의 A Beautiful Cactus, 아름다운 선인장이에요. 한마디로 말하면, 사랑하는 두 사람이 위기를 넘어서 선인장이 되는 신비한 옛이야기랍니다. 같이 힘차게 읽어 볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">미리 알면 쉬워요\u003c/span>\u003cdiv class=\"lp-box\">Native American은 아주 오래전부터 미국 땅에 살던 북미 원주민을 말해요. 그들은 마을마다 \u003cb class=\"key\">추장\u003c/b>(chief)이라는 우두머리를 두고 마을 일을 정했어요. 우리 반에 반장이 있는 것처럼, 마을에는 모두를 이끄는 추장이 있었던 거예요. 또 그들은 산과 땅에 \u003cb class=\"key\">여신\u003c/b>(goddess)이 있다고 믿어서, 힘들 때 자연의 신에게 기도했답니다. 선인장(cactus)은 물이 거의 없는 사막에서도 잘 자라는 튼튼한 식물이에요.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 알아 볼게요. Native American은 아주 오래전부터 미국 땅에 살던 북미 원주민을 말해요. 그들은 마을마다 추장을 두고 마을 일을 정했는데, 추장은 우리 반의 반장보다 훨씬 큰, 마을 전체를 이끄는 사람이었어요. 여러분 반에도 모두를 이끄는 사람이 있죠? 또 그들은 땅과 산에 여신이 있다고 믿어서, 힘들 때 자연의 신에게 기도했어요. 선인장은 물이 거의 없는 사막에서도 잘 자라는 튼튼한 식물이랍니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>꽃과 첫 만남\u003csmall>시작 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>한 \u003cb class=\"key\">북미 \u003c/b>\u003cb class=\"key\">원주민\u003c/b> 마을에서 남자아이가 \u003cb class=\"key\">추장\u003c/b>의 딸을 위해 꽃을 꺾었어요. 두 사람은 함께 자라서 서로 \u003cb class=\"key\">사랑\u003c/b>에 빠졌지요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>추장의 반대\u003csmall>문제 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>그런데 추장은 그 남자아이를 좋아하지 않았어요. 그는 딸이 \u003cb class=\"key\">다른 \u003c/b>\u003cb class=\"key\">사람\u003c/b>과 결혼하기를 원했지요. 이 이야기를 들은 두 사람은 많이 \u003cb class=\"key\">울었어요\u003c/b>.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>산으로 도망\u003csmall>바뀜 · 문장 6–9\u003c/small>\u003c/h4>\u003cp>두 사람은 산으로 \u003cb class=\"key\">도망\u003c/b>쳤어요. 하지만 추장과 다른 남자들이 계속 뒤쫓아 왔어요. 잠시 쉬려고 멈춘 사이, \u003cb class=\"key\">뒤쫓는 \u003c/b>\u003cb class=\"key\">사람들\u003c/b>이 다시 보였지요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>기도와 변신\u003csmall>해결 · 문장 10–13\u003c/small>\u003c/h4>\u003cp>숨을 곳이 없던 두 사람은 \u003cb class=\"key\">대지의 \u003c/b>\u003cb class=\"key\">여신\u003c/b>에게 기도했어요. 여신이 \u003cb class=\"key\">산에 \u003c/b>\u003cb class=\"key\">구멍\u003c/b>을 열어 주어 그곳에 숨었고, 다음 날 두 사람은 \u003cb class=\"key\">선인장\u003c/b>으로 변했답니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 이야기가 어떤 순서로 흘러가는지 함께 살펴볼게요.","hl":null},{"n":4,"text":"이야기는 북미 원주민 마을에서 시작해요. 한 남자아이가 추장의 아름다운 딸을 위해 꽃을 꺾았지요. 두 사람은 함께 자라면서 서로 사랑에 빠졌어요. 정말 예쁜 시작이죠?","hl":"f0"},{"n":5,"text":"그런데 여기서 문제가 생겨요. 추장이 그 남자아이를 좋아하지 않은 거예요. 추장은 자기 딸이 다른 사람과 결혼하기를 원했어요. 그래서 두 사람은 이 이야기를 듣고 많이 울었답니다.","hl":"f1"},{"n":6,"text":"두 사람은 결국 산으로 도망쳤어요. 그런데 추장과 다른 남자들이 계속 뒤쫓아 왔어요. 두 사람은 잠시 쉬려고 멈췄다가, 곧 남자들이 다가오는 것을 보았지요. 얼마나 무서웠을까요?","hl":"f2"},{"n":7,"text":"숨을 곳이 없던 두 사람은 대지의 여신에게 기도했어요. 그러자 여신이 산에 구멍을 열어 주었고, 두 사람은 그곳에 숨었어요. 그리고 다음 날, 두 사람은 선인장으로 변했답니다. 정말 신기하죠?","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">이야기 순서(처음-가운데-끝이 있는 옛이야기)\u003c/span>\u003cspan class=\"lp-pill\">처음\u003c/span>\u003cspan class=\"lp-pill\">주제문 2번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">순서\u003c/b>대로 사건이 이어지는 옛이야기예요. 맨 처음에 두 사람이 \u003cb class=\"key\">사랑\u003c/b>에 빠진 일이 나오고, 바로 이 사랑이 이야기 전체를 움직여요. 그래서 \u003cb class=\"key\">처음\u003c/b>에 나오는 두 번째 문장이 이 글의 중심 생각이라고 볼 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>However (3)\u003c/b>\u003cspan>앞과 반대되는 내용을 알려 줌\u003c/span>\u003cb>When (5)\u003c/b>\u003cspan>어떤 때인지 알려 줌\u003c/span>\u003cb>But (7)\u003c/b>\u003cspan>앞과 반대되는 내용을 알려 줌\u003c/span>\u003cb>Soon (9)\u003c/b>\u003cspan>다음에 이어지는 일을 알려 줌\u003c/span>\u003cb>The next day (13)\u003c/b>\u003cspan>시간이 지났음을 알려 줌\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">a boy\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the daughter of the chief\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">The boy and the girl\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the couple\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">they\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 이야기 순서로 짜인 옛이야기예요. 처음에 두 사람이 사랑에 빠지고, 가운데에 위기가 생기고, 끝에 기적이 일어나지요. 중심이 되는 생각은 맨 처음에 나오는 두 번째 문장, 두 사람이 사랑에 빠졌다는 부분이에요. 이 사랑 덕분에 뒤의 사건들이 모두 일어나니까요.","hl":"ty"},{"n":9,"text":"글의 길잡이 말도 꼭 기억해요. 세 번째 문장의 However와 일곱 번째 문장의 But은 앞 내용과 반대되는 일이 생긴다고 알려 줘요. 다섯 번째 문장의 When은 언제 일어난 일인지 알려 주고, 아홉 번째 문장의 Soon과 열세 번째 문장의 The next day는 시간이 어떻게 흘러가는지 알려 준답니다. 그리고 같은 사람들을 a boy, the couple, they처럼 다르게 부르기도 해요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 단어\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>Native American\u003c/b>\u003cem>명사\u003c/em>\u003cspan>북미 원주민\u003c/span>\u003c/div>\u003cdiv>\u003cb>village\u003c/b>\u003cem>명사\u003c/em>\u003cspan>마을\u003c/span>\u003c/div>\u003cdiv>\u003cb>pick\u003c/b>\u003cem>동사\u003c/em>\u003cspan>꺾다, 따다\u003c/span>\u003c/div>\u003cdiv>\u003cb>chief\u003c/b>\u003cem>명사\u003c/em>\u003cspan>추장, 우두머리\u003c/span>\u003c/div>\u003cdiv>\u003cb>grow up\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>자라다\u003c/span>\u003c/div>\u003cdiv>\u003cb>fall in love\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>사랑에 빠지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>however\u003c/b>\u003cem>부사\u003c/em>\u003cspan>그러나\u003c/span>\u003c/div>\u003cdiv>\u003cb>marry\u003c/b>\u003cem>동사\u003c/em>\u003cspan>결혼하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>someone else\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>다른 사람\u003c/span>\u003c/div>\u003cdiv>\u003cb>couple\u003c/b>\u003cem>명사\u003c/em>\u003cspan>연인, 두 사람\u003c/span>\u003c/div>\u003cdiv>\u003cb>hear about\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 대해 듣다\u003c/span>\u003c/div>\u003cdiv>\u003cb>run away\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>도망치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>come after\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>뒤쫓아 오다\u003c/span>\u003c/div>\u003cdiv>\u003cb>stop\u003c/b>\u003cem>동사\u003c/em>\u003cspan>멈추다\u003c/span>\u003c/div>\u003cdiv>\u003cb>rest\u003c/b>\u003cem>동사\u003c/em>\u003cspan>쉬다\u003c/span>\u003c/div>\u003cdiv>\u003cb>hide\u003c/b>\u003cem>동사\u003c/em>\u003cspan>숨다\u003c/span>\u003c/div>\u003cdiv>\u003cb>nowhere\u003c/b>\u003cem>부사\u003c/em>\u003cspan>어디에도 ~할 곳이 없는\u003c/span>\u003c/div>\u003cdiv>\u003cb>pray\u003c/b>\u003cem>동사\u003c/em>\u003cspan>기도하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>goddess\u003c/b>\u003cem>명사\u003c/em>\u003cspan>여신\u003c/span>\u003c/div>\u003cdiv>\u003cb>turn into\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 변하다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"오늘의 단어도 소리 내어 읽어 볼게요. pick은 꽃을 꺾다, 따다는 뜻이에요. chief는 추장, 다시 말해 마을의 우두머리라는 뜻이고요. fall in love는 사랑에 빠지다, run away는 도망치다, hide는 숨다라는 뜻이에요. pray는 기도하다, goddess는 여신, turn into는 무엇으로 변하다라는 뜻이랍니다. 크게 한 번씩 따라 읽어 보세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">beautiful\u003c/b>\u003cspan class=\"m\">아름다운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">pretty\u003c/span>\u003cspan class=\"s\">lovely\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ugly\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">like\u003c/b>\u003cspan class=\"m\">좋아하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">love\u003c/span>\u003cspan class=\"s\">enjoy\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">cry\u003c/b>\u003cspan class=\"m\">울다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">weep\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">laugh\u003c/span>\u003cspan class=\"a\">smile\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">run away\u003c/b>\u003cspan class=\"m\">도망치다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">escape\u003c/span>\u003cspan class=\"s\">flee\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">stay\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">hide\u003c/b>\u003cspan class=\"m\">숨다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">cover\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">show\u003c/span>\u003cspan class=\"a\">appear\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"비슷한 말과 반대말도 정리해 볼게요. beautiful은 아름답다는 뜻이고, 비슷한 말은 pretty, 반대말은 ugly예요. like는 좋아하다, 비슷한 말은 love, 반대말은 hate예요. cry는 울다, 비슷한 말은 weep, 반대말은 laugh예요. run away는 도망치다, 비슷한 말은 escape, 반대말은 stay예요. 마지막으로 hide는 숨다, 비슷한 말은 cover, 반대말은 show랍니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어느 북미 원주민 마을에서\u003c/span>\u003cspan class=\"en\">In a Native American village,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 남자아이가 꽃을 꺾었어요\u003c/span>\u003cspan class=\"en\">a boy \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">picked\u003c/span> flowers\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아름다운 딸을 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">beautiful \u003c/span>\u003cspan class=\"tgt\">daughter\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">추장의\u003c/span>\u003cspan class=\"en\">of the chief.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어느 북미 원주민 마을에서 한 남자아이가 추장의 아름다운 딸을 위해 꽃을 꺾었어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이야기가 어디서 시작되는지 알려 주는 첫 문장이에요. 북미 원주민 마을에서 한 남자아이가 추장의 딸을 위해 꽃을 꺾었다는 \u003cb class=\"key\">처음 \u003c/b>\u003cb class=\"key\">장면\u003c/b>을 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거형(규칙 과거형)\u003c/span> : 누가(a boy) + 했다(picked) + 무엇을(flowers) : \"꽃을 꺾었어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사(전치사 for)\u003c/span> : for + 누구를 위해(daughter) : \"아름다운 딸을 위해\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"In a Native American village, 어느 북미 원주민 마을에서. a boy picked flowers, 한 남자아이가 꽃을 꺾었어요. for the beautiful daughter, 아름다운 딸을 위해. of the chief, 추장의. 이 문장 전체를 해석하면, 어느 북미 원주민 마을에서 한 남자아이가 추장의 아름다운 딸을 위해 꽃을 꺾었어요.","hl":"m"},{"n":13,"text":"이 문장은 이야기의 배경을 알려 줘요. 북미 원주민 마을에서 한 남자아이가 추장의 딸을 위해 꽃을 꺾었다는 처음 장면이에요.","hl":"mn"},{"n":14,"text":"문법도 짚어 볼게요. 첫 번째, picked는 이미 지난 일이라서 동사 pick에 -ed를 붙인 과거형이에요. 두 번째, for는 '~를 위해'라는 뜻으로 꽃을 꺾은 이유를 알려 줘요. 아주 쉬운 문장이니 여러분도 직접 소리 내어 읽어 봐요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 13\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 남자아이와 여자아이는\u003c/span>\u003cspan class=\"en\">The boy and the girl\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자라서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">grew \u003c/span>\u003cspan class=\"tgt\">up\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사랑에 빠졌지요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">fell \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">love\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 남자아이와 여자아이는 자라서 사랑에 빠졌지요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 두 사람이 자라서 서로 사랑하게 되었다는 이야기예요. 앞으로 이어질 \u003cb class=\"key\">사랑 \u003c/b>\u003cb class=\"key\">이야기\u003c/b>의 시작을 알려 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거형(불규칙 과거형)\u003c/span> : 누가(The boy and the girl) + 자랐어요(grew up) : \"자랐어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 자랐어요(grew up) + and + 사랑에 빠졌어요(fell in love) : \"그리고 사랑에 빠졌어요\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"The boy and the girl, 그 남자아이와 여자아이는. grew up, 자라서. and fell in love, 사랑에 빠졌지요. 이 문장 전체를 해석하면, 그 남자아이와 여자아이는 자라서 사랑에 빠졌지요.","hl":"m"},{"n":16,"text":"두 사람이 자라서 사랑에 빠졌다는 뜻이에요. 이 이야기의 사랑 이야기가 바로 여기서 시작돼요.","hl":"mn"},{"n":17,"text":"문법을 볼게요. 첫 번째, grew up은 grow up의 과거형이에요. grow는 -ed를 붙이지 않는 불규칙 동사라서 grew로 바뀌어요. 두 번째, and는 두 가지 일을 이어 주는 접속사예요. 자랐다는 일과 사랑에 빠졌다는 일을 한 문장으로 이어 줘요. 참 쉽죠?","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">However,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">추장은 좋아하지 않았어요\u003c/span>\u003cspan class=\"en\">the chief \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">didn't \u003c/span>\u003cspan class=\"tgt\">like\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 남자아이를\u003c/span>\u003cspan class=\"en\">the boy.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 추장은 그 남자아이를 좋아하지 않았어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞의 사랑 이야기와 \u003cb class=\"key\">반대\u003c/b>되는 일이 생겼어요. 추장이 그 남자아이를 \u003cb class=\"key\">좋아하지 \u003c/b>\u003cb class=\"key\">않았다\u003c/b>는 걸 알려 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">더 자세히 알려 주는 말(부사)\u003c/span> : However, + 반대되는 내용 : \"그러나\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부정문(일반동사 부정문)\u003c/span> : 누가(the chief) + 하지 않았다(didn't) + 무엇을(like the boy) : \"좋아하지 않았어요\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"However, 그러나. the chief didn't like, 추장은 좋아하지 않았어요. the boy, 그 남자아이를. 이 문장 전체를 해석하면, 그러나 추장은 그 남자아이를 좋아하지 않았어요.","hl":"m"},{"n":19,"text":"앞에서는 두 사람이 사랑에 빠졌는데, 여기서는 추장이 그 남자아이를 싫어해요. 이야기가 반대로 흘러간다는 걸 알려 줘요.","hl":"mn"},{"n":20,"text":"문법 포인트 두 가지예요. 첫 번째, 지난 일을 아니라고 말할 때는 didn't를 쓰고 동사는 원형 그대로 like로 둬요. 두 번째, However는 앞 내용과 반대되는 이야기를 시작할 때 쓰는 말이에요. 사랑에 빠진 다음에 추장이 싫어한다고 하니 긴장되는 순간이죠. 오늘도 아주 잘했어요!","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 원했답니다\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">wanted\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 딸이\u003c/span>\u003cspan class=\"en\">his daughter\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">결혼하기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">marry\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 사람과.\u003c/span>\u003cspan class=\"en\">someone else.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 자신의 딸이 다른 사람과 결혼하기를 원했답니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 추장은 딸이 다른 사람과 결혼하기를 바랐어요. 두 사람의 \u003cb class=\"key\">사랑\u003c/b>을 가로막는 \u003cb class=\"key\">반대\u003c/b>가 이 문장에서 시작돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(He) + 원했다(wanted) + ~하기를(to marry) : \"원했답니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사(to + 동사원형)\u003c/span> : want + to + 동사원형 = ~하기를 원하다 : \"결혼하기를\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"He wanted, 그는 원했답니다. his daughter, 자신의 딸이. to marry, 결혼하기를. someone else, 다른 사람과.. 이 문장 전체를 해석하면, 그는 자신의 딸이 다른 사람과 결혼하기를 원했답니다.","hl":"m"},{"n":22,"text":"이 문장은 추장이 자기 딸을 다른 사람과 결혼시키고 싶어 한다는 뜻이에요. 두 사람의 사랑을 가로막는 반대가 바로 여기서 시작되는 거죠.","hl":"mn"},{"n":23,"text":"먼저 wanted를 볼까요? 이야기가 지난 일이라 동사에 -ed를 붙여 지난 일 말, 과거형으로 썼어요. 그리고 to marry는 want 뒤에 to와 동사원형이 와서 결혼하기를 원하다는 뜻을 만들어요. 오늘은 wanted와 to marry, 이 두 가지를 꼭 기억해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 연인은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When\u003c/span> the couple\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것에 대해 들었을 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">heard\u003c/span> about this,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 울었어요.\u003c/span>\u003cspan class=\"en\">they cried.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 연인은 이것에 대해 들었을 때 울었어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 두 사람은 추장이 반대한다는 소식을 듣고 울었어요. 슬픈 \u003cb class=\"key\">마음\u003c/b>이 그대로 드러나는 장면이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사 when)\u003c/span> : When + 문장, + 문장 = ~했을 때, … : \"~했을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(the couple) + 들었다(heard) + 무엇을(about this) : \"들었어요\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"When the couple, 그 연인은. heard about this, 이것에 대해 들었을 때. they cried, 그들은 울었어요.. 이 문장 전체를 해석하면, 그 연인은 이것에 대해 들었을 때 울었어요.","hl":"m"},{"n":25,"text":"이 문장은 두 사람이 추장이 반대한다는 소식을 듣고 운 이야기예요. 슬픈 마음이 고스란히 보이는 장면이죠.","hl":"mn"},{"n":26,"text":"먼저 When은 두 가지 일을 이어 주면서 ~할 때라는 때를 알려 주는 이어 주는 말이에요. 그리고 heard는 hear의 과거형이라서 들었어요, 라는 지난 일을 말해요. 이렇게 불규칙하게 변하는 단어는 소리 내어 여러 번 읽어 두면 오래 기억에 남아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 도망쳤어요\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">ran\u003c/span> away\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">산으로.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">mountains\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 산으로 도망쳤어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 두 사람은 추장과 사람들을 피해 산으로 도망쳤어요. 도망친 \u003cb class=\"key\">장소\u003c/b>가 산이라는 걸 알려 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(They) + 도망쳤다(ran away) : \"도망쳤어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소·시간 짝꿍 말(전치사 to)\u003c/span> : 동사 + to + 장소 = ~로 : \"산으로\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"They ran away, 그들은 도망쳤어요. to the mountains, 산으로.. 이 문장 전체를 해석하면, 그들은 산으로 도망쳤어요.","hl":"m"},{"n":28,"text":"이 문장은 두 사람이 산으로 도망쳤다는 뜻이에요. 도망친 장소가 산이라는 걸 알려 주는 문장이에요.","hl":"mn"},{"n":29,"text":"먼저 ran은 run의 과거형이에요. run에 -ed를 붙이지 않고 ran으로 모양이 바뀌는 불규칙 친구랍니다. 그리고 to the mountains에서 to는 어디로 가는지 방향을 알려 주는 전치사예요. 도망친 곳이 산이라는 걸 to가 콕 집어 주는 거죠. 여러분도 ran away to the mountains, 소리 내어 읽어 볼까요?","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 추장이\u003c/span>\u003cspan class=\"en\">But \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">chief \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 다른 남자들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">other \u003c/span>\u003cspan class=\"tgt\">men\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들을 뒤쫓았어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">came\u003c/span> after them.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 추장과 다른 남자들이 그들을 뒤쫓았습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 도망친 두 사람을 \u003cb class=\"key\">추장\u003c/b>과 다른 남자들이 \u003cb class=\"key\">뒤쫓았다\u003c/b>는 뜻이에요. 두 사람이 위험해지는 \u003cb class=\"key\">사건\u003c/b>이 시작된다는 걸 알려 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : A(the chief) + and + B(other men) : \"추장과 다른 남자들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(they) + 했어요(came) : \"왔어요, 뒤쫓아 왔어요\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"But the chief, 하지만 추장이. and other men, 그리고 다른 남자들이. came after them, 그들을 뒤쫓았어요. 이 문장 전체를 해석하면, 하지만 추장과 다른 남자들이 그들을 뒤쫓았습니다.","hl":"m"},{"n":31,"text":"도망간 두 사람을 추장과 다른 남자들이 따라왔다는 뜻이에요. 이제 두 사람이 아주 위험해졌어요.","hl":"mn"},{"n":32,"text":"첫 번째, and는 두 가지를 나란히 이어 주는 이어 주는 말이에요. 추장과 다른 남자들처럼 둘을 한꺼번에 말할 때 써요. 두 번째, came은 지난 일을 말하는 과거형이에요. 오늘 일이면 come이지만, 이미 지나간 일이라 came으로 모양이 바뀌었어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 연인은\u003c/span>\u003cspan class=\"en\">The couple\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">멈췄어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">stopped \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">쉬기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">rest\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몇 분 동안\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">few \u003c/span>\u003cspan class=\"tgt\">minutes\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 연인은 잠시 동안 쉬기 위해 멈췄어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 도망가던 연인이 \u003cb class=\"key\">잠깐\u003c/b> \u003cb class=\"key\">숨을 \u003c/b>\u003cb class=\"key\">돌리려고\u003c/b> 멈춘 장면이에요. 곧 닥칠 일을 미리 알려 주는 \u003cb class=\"key\">준비\u003c/b> 부분이지요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to + 동사원형(to부정사)\u003c/span> : 누가(The couple) + 멈췄어요(stopped) + 쉬려고(to rest) : \"쉬기 위해 멈췄어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소·시간 짝꿍 말(전치사)\u003c/span> : for + 시간(a few minutes) : \"몇 분 동안\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"The couple, 그 연인은. stopped, 멈췄어요. to rest, 쉬기 위해. for a few minutes, 몇 분 동안. 이 문장 전체를 해석하면, 그 연인은 잠시 동안 쉬기 위해 멈췄어요.","hl":"m"},{"n":34,"text":"도망가던 연인이 잠깐 쉬려고 발을 멈췄다는 뜻이에요. 짧은 휴식이지만 곧 큰일이 생겨요.","hl":"mn"},{"n":35,"text":"첫 번째, to부정사를 봐요. stopped to rest는 멈췄어요, 그리고 쉬려고, 이렇게 '~하려고'라는 뜻을 만들어요. 두 번째, for는 시간의 길이를 말하는 전치사예요. for a few minutes는 몇 분 동안이라는 뜻이지요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">곧 그들은 보았어요\u003c/span>\u003cspan class=\"en\">Soon \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">saw\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">남자들이\u003c/span>\u003cspan class=\"en\">the men\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들을 뒤쫓아오는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">coming \u003c/span>\u003cspan class=\"tgt\">after \u003c/span>\u003cspan class=\"tgt\">them\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">곧 그들은 남자들이 자신들을 뒤쫓는 것을 보았지요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 쉬는 사이에 \u003cb class=\"key\">남자들\u003c/b>이 가까이 온 것을 보았다는 뜻이에요. 이제 \u003cb class=\"key\">숨을 \u003c/b>\u003cb class=\"key\">곳\u003c/b>이 없다는 긴장이 시작돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(they) + 보았어요(saw) : \"그들은 보았어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">덩어리 표현(동사-ing)\u003c/span> : 누가(the men) + ~하는 중(coming) + 뒤쫓는 : \"그들을 뒤쫓아오는 것을\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Soon they saw, 곧 그들은 보았어요. the men, 남자들이. coming after them, 그들을 뒤쫓아오는 것을. 이 문장 전체를 해석하면, 곧 그들은 남자들이 자신들을 뒤쫓는 것을 보았지요.","hl":"m"},{"n":37,"text":"쉬는 동안 남자들이 가까이 오는 걸 두 사람이 알아챘다는 뜻이에요. 이제 도망칠 시간이 얼마 없어요.","hl":"mn"},{"n":38,"text":"첫 번째, saw는 see의 과거형이에요. 지난 일이라 saw로 모양이 바뀌었어요. 두 번째, coming after them은 덩어리 표현이에요. '그들을 뒤쫓아오는 것'이라는 뜻으로 한 덩어리처럼 외워 두면 좋아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 가지고 있었어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">They \u003c/span>\u003cspan class=\"tgt\">had\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">숨을 곳이 아무 데도 없었어요\u003c/span>\u003cspan class=\"en\">nowhere \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">hide\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 숨을 곳이 어디에도 없었어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 두 사람에게는 \u003cb class=\"key\">숨을 \u003c/b>\u003cb class=\"key\">곳\u003c/b>이 하나도 없다는 뜻이에요. 쫓기는 두 사람의 \u003cb class=\"key\">위험한 \u003c/b>\u003cb class=\"key\">상황\u003c/b>을 잘 보여 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(They) + 가졌다(had) + 무엇을 : \"그들은 가지고 있었어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to + 동사원형(to부정사)\u003c/span> : to + 숨다(hide) : \"숨을\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"They had, 그들은 가지고 있었어요. nowhere to hide, 숨을 곳이 아무 데도 없었어요. 이 문장 전체를 해석하면, 그들은 숨을 곳이 어디에도 없었어요.","hl":"m"},{"n":40,"text":"이 문장은 두 사람이 숨을 곳도 없이 아주 위험한 상황이라는 걸 보여 줘요. 여러분, 그런데도 이들은 아직 포기하지 않아요.","hl":"mn"},{"n":41,"text":"먼저, had는 have의 과거형이에요. 지난 일이라서 had로 말하죠. 그리고 to hide는 to부정사로 숨을이라는 뜻이에요. 그래서 '숨을 곳이 아무 데도 없었다'가 되는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 시작했어요\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">started \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기도하기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">pray\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여신에게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">goddess\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대지의\u003c/span>\u003cspan class=\"en\">of the land.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 대지의 여신에게 기도하기 시작했어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 도와줄 사람이 없어서 두 사람이 \u003cb class=\"key\">대지의 \u003c/b>\u003cb class=\"key\">여신\u003c/b>에게 \u003cb class=\"key\">기도\u003c/b>해요. 이야기가 신비하게 바뀌는 \u003cb class=\"key\">시작점\u003c/b>이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to + 동사원형(to부정사)\u003c/span> : 누가(They) + 시작했다(started) + 하기를(to pray) : \"기도하기 시작했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소·시간 짝꿍 말(전치사)\u003c/span> : pray(기도하다) + to(누구에게) + the goddess(여신) : \"여신에게\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"They started, 그들은 시작했어요. to pray, 기도하기를. to the goddess, 여신에게. of the land, 대지의. 이 문장 전체를 해석하면, 그들은 대지의 여신에게 기도하기 시작했어요.","hl":"m"},{"n":43,"text":"이 문장에서 두 사람은 도와줄 사람이 없어서 대지의 여신에게 기도해요. 여기가 이야기의 시작점이에요. 신비한 일이 곧 일어나죠.","hl":"mn"},{"n":44,"text":"먼저, started 뒤에 to pray가 붙었어요. to부정사는 동사 뒤에서 '~하기를'처럼 이어져요. 그리고 to the goddess의 to는 전치사로 '누구에게'를 알려 줘요. 기도는 누구에게 하는지 꼭 말해 줘야 하니까요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 여신은 열었어요\u003c/span>\u003cspan class=\"en\">The goddess \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">opened\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">구멍을\u003c/span>\u003cspan class=\"en\">a hole\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">산에\u003c/span>\u003cspan class=\"en\">in the mountain,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그들은 숨었어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">hid\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그곳에\u003c/span>\u003cspan class=\"en\">there.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 여신은 산에 구멍을 열었고, 그들은 그곳에 숨었어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 여신이 산에 \u003cb class=\"key\">구멍\u003c/b>을 열어 주어 두 사람이 그곳에 \u003cb class=\"key\">숨었어요\u003c/b>. 위험한 순간에 \u003cb class=\"key\">기적\u003c/b>이 일어난 거예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 여신이(The goddess) + 열었다(opened) + 구멍을(a hole) : \"열었어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 앞의 일 + and + 뒤의 일 : \"그리고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">지난 일 말(불규칙 과거형)\u003c/span> : 그들은(they) + 숨었다(hid) + 그곳에(there) : \"그들은 숨었어요\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"The goddess opened, 그 여신은 열었어요. a hole, 구멍을. in the mountain, 산에. and they hid, 그리고 그들은 숨었어요. there, 그곳에. 이 문장 전체를 해석하면, 그 여신은 산에 구멍을 열었고, 그들은 그곳에 숨었어요.","hl":"m"},{"n":46,"text":"여신이 산에 구멍을 열어 주어서 두 사람이 그곳에 숨었어요. 정말 위험한 순간에 기적이 일어난 거예요.","hl":"mn"},{"n":47,"text":"먼저, opened는 open에 -ed를 붙인 과거형이에요. 지난 일이라서 이렇게 말해요. 다음, and는 접속사로 앞의 일과 뒤의 일을 이어 줘요. 마지막으로 hid는 hide의 과거형인데, 모양이 확 바뀌는 불규칙 동사라서 꼭 외워 두면 좋아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 13\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다음 날,\u003c/span>\u003cspan class=\"en\">The next day,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 연인은\u003c/span>\u003cspan class=\"en\">the couple\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">변했답니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">turned\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">into\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">선인장으로\u003c/span>\u003cspan class=\"en\">a cactus.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">다음 날, 그 연인은 선인장으로 변했답니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이야기의 마지막 장면으로, 사랑하는 두 사람이 마침내 \u003cb class=\"key\">선인장\u003c/b>이 되었다는 뜻이에요. 둘은 이제 \u003cb class=\"key\">영원히\u003c/b> 함께하게 되었답니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거형(지난 일 말)\u003c/span> : 누가(The couple) + 했다(turned) + 어떻게(변했어요) : \"변했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사(장소·시간 짝꿍 말)\u003c/span> : 변하다(turn) + into + 무엇(a cactus) : \"~으로\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"The next day, 다음 날. the couple, 그 연인은. turned into, 변했답니다. a cactus, 선인장으로. 이 문장 전체를 해석하면, 다음 날, 그 연인은 선인장으로 변했답니다.","hl":"m"},{"n":49,"text":"이 문장은 이야기의 마지막 장면이에요. 사랑하는 두 사람이 마침내 선인장이 되어 영원히 함께하게 되었다는 뜻이죠. 여러분, 조금 슬프면서도 따뜻한 결말 같지 않나요?","hl":"mn"},{"n":50,"text":"먼저 turned를 볼까요? 지난 일을 말할 때는 동사 뒤에 -ed를 붙여요. turn은 규칙 동사라서 turn에 -ed를 붙여 turned, 변했어요, 가 된답니다. 그리고 into는 으로, 라는 방향을 알려 주는 짝꿍 말이에요. 무엇이 다른 모습으로 변할 때 turn과 함께 써서 turned into a cactus, 선인장으로 변했어요, 라고 말해요. 아주 잘 따라왔어요!","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">오늘 배운 내용 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>이 이야기는 \u003cb class=\"key\">북미 \u003c/b>\u003cb class=\"key\">원주민\u003c/b> 마을에서 시작해요. 남자아이가 \u003cb class=\"key\">추장\u003c/b>의 딸을 위해 꽃을 꺾었지요.\u003c/li>\u003cli>두 사람은 \u003cb class=\"key\">사랑\u003c/b>에 빠졌지만 추장이 반대해서 산으로 \u003cb class=\"key\">도망\u003c/b>쳤어요.\u003c/li>\u003cli>숨을 곳이 없어 \u003cb class=\"key\">대지의 \u003c/b>\u003cb class=\"key\">여신\u003c/b>에게 기도하자, 여신이 \u003cb class=\"key\">산에 \u003c/b>\u003cb class=\"key\">구멍\u003c/b>을 열어 주었어요.\u003c/li>\u003cli>다음 날 두 사람은 \u003cb class=\"key\">선인장\u003c/b>으로 변했답니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>A boy and a chief's daughter ran away to stay together, and the next day they became a cactus.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">북미 원주민 마을의 한 남자아이와 \u003cb class=\"key\">추장\u003c/b>의 딸이 \u003cb class=\"key\">사랑\u003c/b>에 빠졌지만, 추장이 반대해서 둘은 산으로 도망쳤어요. 숨을 곳이 없던 두 사람은 \u003cb class=\"key\">대지의 \u003c/b>\u003cb class=\"key\">여신\u003c/b>에게 기도했고, 여신이 \u003cb class=\"key\">산에 \u003c/b>\u003cb class=\"key\">구멍\u003c/b>을 열어 숨겨 주었으며 다음 날 두 사람은 \u003cb class=\"key\">선인장\u003c/b>으로 변했답니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":51,"text":"오늘 우리는 사랑하는 두 사람이 산으로 도망쳐 대지의 여신의 도움을 받고, 마침내 선인장이 되는 이야기를 읽었어요. 이야기 순서와 길잡이 말, 그리고 오늘 배운 단어들까지 아주 잘 따라왔어요. 여러분의 상상력이 정말 멋져요! 다음 시간에도 재미있는 이야기로 만나요. 수고했어요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
