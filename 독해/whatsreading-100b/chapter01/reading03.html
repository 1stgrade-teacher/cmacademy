</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"왓츠 리딩 100B Ch.1 Unit 03 The Sad Mother Volcano","audioDir":"reading03_audio","preview":false,"count":51,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.400em\">Ch.1 Unit\u003cbr>03 The Sad\u003cbr>Mother Volcano\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">왓츠 리딩 100B\u003c/div>\u003ch1>The Sad Mother Volcano and the White Salty Land\u003c/h1>\u003ch2>슬픈 엄마 화산과 하얀 소금 땅\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">한 줄 요약\u003c/span>\u003cspan>요약: 오래전 인간처럼 움직이고 말하던 화산들이 아기 화산을 두고 싸워 \u003cb class=\"key\">아기를 \u003c/b>\u003cb class=\"key\">숨겼고\u003c/b>, 신들이 벌을 내려 화산들은 \u003cb class=\"key\">움직이고 \u003c/b>\u003cb class=\"key\">말하는 \u003c/b>\u003cb class=\"key\">능력\u003c/b>을 잃었어요. 엄마 화산 Tunupa의 \u003cb class=\"key\">눈물과 \u003c/b>\u003cb class=\"key\">모유\u003c/b> 때문에 그 땅은 희고 짜게 되었답니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Tunupa's tears and mother's milk made the land white and salty after the volcanoes lost their power to move and talk.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘도 만나서 정말 반가워요. 오늘은 The Sad Mother Volcano, 슬픈 엄마 화산이라는 재미있는 이야기를 읽어 볼 거예요. 옛날에 사람처럼 말하던 화산들 이야기인데요, 한 줄로 말하면 Tunupa의 눈물 때문에 땅이 희고 짜게 되었다는 이야기예요. 우리 같이 신나는 마음으로 시작해 볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">미리 알면 쉬워요\u003c/span>\u003cdiv class=\"lp-box\">여러분, 하얗게 빛나는 소금 사막을 상상해 본 적 있나요? 남아메리카에는 소금으로 덮인 아주 넓은 사막이 있어요. 옛날 사람들은 그 하얀 땅을 보며 '화산이 흘린 눈물이 땅을 하얗게 만들었대' 같은 \u003cb class=\"key\">신화\u003c/b>를 지어냈어요. 신화는 myth라고 해요. 화산은 volcano라고 하죠. 우리 반 친구들이 장난감 하나 때문에 밤새 다투면 기분이 좋을까요? 다툼은 아무것도 해결해 주지 못해요. 이 이야기에서도 화산들의 다툼 때문에 모두가 \u003cb class=\"key\">능력\u003c/b>을 잃게 된답니다.\u003c/div>","segs":[{"n":2,"text":"여러분, 혹시 하얀 소금 사막을 본 적 있나요? 남아메리카에는 소금으로 덮인 아주 넓은 사막이 있어요. 옛날 사람들은 그 하얀 땅을 보면서 화산이 흘린 눈물이 땅을 하얗게 만들었다는 신화를 만들었어요. 신화는 myth, 화산은 volcano라고 한답니다. 우리 반 친구들이 장난감 하나 때문에 밤새 다투면 기분이 좋을까요? 아마 아무도 좋지 않겠죠. 이 이야기에서도 다툼 때문에 모두가 능력을 잃게 된답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>사람 같은 화산\u003csmall>시작 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>오래전에 화산들은 \u003cb class=\"key\">인간\u003c/b>처럼 움직이고 말을 했어요. 그들의 사막 지역에는 \u003cb class=\"key\">여자 \u003c/b>\u003cb class=\"key\">화산\u003c/b>이 딱 하나 있었어요. 그녀의 이름은 \u003cb class=\"key\">Tunupa\u003c/b>였답니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>아기를 둘러싼 다툼\u003csmall>문제 · 문장 4–7\u003c/small>\u003c/h4>\u003cp>Tunupa가 아기 화산을 낳았지만 아빠가 누구인지 아무도 몰랐어요. 남자 화산들이 모두 아빠가 되고 싶어서 밤새도록 \u003cb class=\"key\">싸웠어요\u003c/b>. 결국 그들은 아기를 \u003cb class=\"key\">빼앗아\u003c/b> 숨겼답니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>신들의 벌\u003csmall>바뀜 · 문장 8–10\u003c/small>\u003c/h4>\u003cp>신들이 이 소식을 듣고 \u003cb class=\"key\">화가 \u003c/b>\u003cb class=\"key\">났어요\u003c/b>. 그래서 화산들의 움직이고 말하는 \u003cb class=\"key\">능력\u003c/b>을 빼앗아 버렸어요. Tunupa도 다른 화산들처럼 \u003cb class=\"key\">전혀\u003c/b> 움직이거나 말할 수 없게 되었지요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>희고 짠 땅\u003csmall>마무리 · 문장 11–13\u003c/small>\u003c/h4>\u003cp>Tunupa는 아기를 찾을 수 없어서 \u003cb class=\"key\">울었어요\u003c/b>. 그녀의 \u003cb class=\"key\">눈물\u003c/b>과 모유가 땅 위로 흘러넘쳤지요. 그래서 그 땅은 Tunupa 때문에 \u003cb class=\"key\">희고 \u003c/b>\u003cb class=\"key\">짜게\u003c/b> 되었답니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 이야기가 어떻게 흘러가는지 네 단계로 살펴볼게요.","hl":null},{"n":4,"text":"먼저 첫 번째 단계예요. 오래전에 화산들은 인간처럼 움직이고 말을 했어요. 그 사막 지역에는 여자 화산이 딱 하나 있었고, 이름은 Tunupa였답니다.","hl":"f0"},{"n":5,"text":"두 번째 단계는 문제가 생기는 부분이에요. Tunupa가 아기 화산을 낳았지만 아빠가 누구인지 아무도 몰랐어요. 남자 화산들이 모두 아빠가 되고 싶어서 밤새도록 싸웠고, 결국 아기를 빼앗아 숨겼답니다.","hl":"f1"},{"n":6,"text":"세 번째 단계에서는 신들이 나와요. 신들이 이 소식을 듣고 화가 났어요. 그래서 화산들의 움직이고 말하는 능력을 빼앗아 버렸고, Tunupa도 다른 화산들처럼 전혀 움직이거나 말할 수 없게 되었지요.","hl":"f2"},{"n":7,"text":"마지막 단계는 결말이에요. Tunupa는 아기를 찾을 수 없어서 울었어요. 그녀의 눈물과 모유가 땅 위로 흘러넘쳤고, 그래서 그 땅은 희고 짜게 되었답니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">이야기 순서(처음-가운데-끝이 있는 이야기)\u003c/span>\u003cspan class=\"lp-pill\">끝\u003c/span>\u003cspan class=\"lp-pill\">주제문 13번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 \u003cb class=\"key\">이야기 \u003c/b>\u003cb class=\"key\">순서\u003c/b>로 짜여 있어요. 처음에는 화산들이 말을 하던 옛날을 보여 주고, 가운데에는 \u003cb class=\"key\">아기를 \u003c/b>\u003cb class=\"key\">빼앗는 \u003c/b>\u003cb class=\"key\">사건\u003c/b>, 끝에는 \u003cb class=\"key\">희고 \u003c/b>\u003cb class=\"key\">짠 \u003c/b>\u003cb class=\"key\">땅\u003c/b>이 생긴 결과를 보여 줘요. 마지막 문장이 이 이야기가 하려는 말을 담고 있답니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>A long time ago (1)\u003c/b>\u003cspan>오래전 일이라고 때를 알려 줌\u003c/span>\u003cb>One day (4)\u003c/b>\u003cspan>사건이 시작되는 날을 알려 줌\u003c/span>\u003cb>In the end (7)\u003c/b>\u003cspan>결국 어떻게 되었는지 알려 줌\u003c/span>\u003cb>When (8)\u003c/b>\u003cspan>그 일이 일어났을 때를 알려 줌\u003c/span>\u003cb>because (11)\u003c/b>\u003cspan>이유를 알려 줌\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">the volcanoes\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">one female volcano\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Tunupa\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">she\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">her\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the baby volcano\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">him\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 이야기 순서로 짜인 글, 그러니까 처음과 가운데와 끝이 있는 이야기예요. 결말 문장인 열세 번째 문장이 이 이야기가 하려는 말을 담고 있답니다.","hl":"ty"},{"n":9,"text":"글에는 길잡이 말이 숨어 있어요. 첫 번째 문장의 A long time ago는 오래전 일이라는 것을 알려 주고, 네 번째 문장의 One day는 어느 날 사건이 시작된다는 것을 알려 줘요. 일곱 번째 문장의 In the end는 결국 어떻게 되었는지를 알려 주죠. 그리고 같은 여자 화산을 one female volcano, Tunupa, she, her처럼 여러 가지로 불러요. 같은 대상을 다르게 부르는 말을 찾으면 이야기가 훨씬 잘 보인답니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 단어\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>a long time ago\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>오래전에\u003c/span>\u003c/div>\u003cdiv>\u003cb>move\u003c/b>\u003cem>동사\u003c/em>\u003cspan>움직이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>human\u003c/b>\u003cem>명사\u003c/em>\u003cspan>인간, 사람\u003c/span>\u003c/div>\u003cdiv>\u003cb>desert\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사막\u003c/span>\u003c/div>\u003cdiv>\u003cb>area\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지역\u003c/span>\u003c/div>\u003cdiv>\u003cb>female\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>여자의, 암컷의\u003c/span>\u003c/div>\u003cdiv>\u003cb>volcano\u003c/b>\u003cem>명사\u003c/em>\u003cspan>화산\u003c/span>\u003c/div>\u003cdiv>\u003cb>have a baby\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>아기를 낳다\u003c/span>\u003c/div>\u003cdiv>\u003cb>father\u003c/b>\u003cem>명사\u003c/em>\u003cspan>아빠, 아버지\u003c/span>\u003c/div>\u003cdiv>\u003cb>fight\u003c/b>\u003cem>동사\u003c/em>\u003cspan>싸우다\u003c/span>\u003c/div>\u003cdiv>\u003cb>in the end\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>결국\u003c/span>\u003c/div>\u003cdiv>\u003cb>take away\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>빼앗다, 데려가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>hide\u003c/b>\u003cem>동사\u003c/em>\u003cspan>숨기다\u003c/span>\u003c/div>\u003cdiv>\u003cb>god\u003c/b>\u003cem>명사\u003c/em>\u003cspan>신\u003c/span>\u003c/div>\u003cdiv>\u003cb>hear about\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 대해 듣다\u003c/span>\u003c/div>\u003cdiv>\u003cb>angry\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>화난\u003c/span>\u003c/div>\u003cdiv>\u003cb>ability\u003c/b>\u003cem>명사\u003c/em>\u003cspan>능력\u003c/span>\u003c/div>\u003cdiv>\u003cb>at all\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>전혀\u003c/span>\u003c/div>\u003cdiv>\u003cb>tear\u003c/b>\u003cem>명사\u003c/em>\u003cspan>눈물\u003c/span>\u003c/div>\u003cdiv>\u003cb>salty\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>짠\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"오늘의 단어를 몇 개 소리 내어 읽어 볼게요. a long time ago는 오래전에, move는 움직이다, desert는 사막이에요. female은 여자의, hide는 숨기다, salty는 짠이라는 뜻이죠. 여러분도 한 번씩 따라 읽어 보세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">move\u003c/b>\u003cspan class=\"m\">움직이다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">go\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">stop\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">female\u003c/b>\u003cspan class=\"m\">여자의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">woman\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">male\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">angry\u003c/b>\u003cspan class=\"m\">화난\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">mad\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">happy\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">hide\u003c/b>\u003cspan class=\"m\">숨기다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">cover\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">show\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">take away\u003c/b>\u003cspan class=\"m\">빼앗다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">take\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">give back\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">cry\u003c/b>\u003cspan class=\"m\">울다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">be sad\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">laugh\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"비슷한 말과 반대말도 정리해 볼게요. move는 움직이다, 비슷한 말은 go, 반대말은 stop이에요. female은 여자의, 반대말은 male이죠. angry는 화난, 비슷한 말은 mad, 반대말은 happy예요. hide는 숨기다, 반대말은 show이고, take away는 빼앗다, 반대말은 give back이랍니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오래전에,\u003c/span>\u003cspan class=\"en\">A long time ago,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 화산들은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">volcanoes\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">움직이고 말을 했어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">moved \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">talked\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인간처럼.\u003c/span>\u003cspan class=\"en\">like humans.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">오래전에, 화산들은 인간처럼 움직이고 말을 했어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이야기의 첫 문장으로, 아주 먼 옛날 \u003cb class=\"key\">화산\u003c/b>이 사람처럼 \u003cb class=\"key\">움직이고 \u003c/b>\u003cb class=\"key\">말을 \u003c/b>\u003cb class=\"key\">했다\u003c/b>는 배경을 알려 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">여러 개일 때 명사 + s(복수)\u003c/span> : 여러 개(volcanoes) + 이름 말 뒤에 s : \"화산들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지난 일 말하기(과거형)\u003c/span> : 지난 일(오래전에) + 동사 뒤에 -ed(moved, talked) : \"움직였고 말했어요\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"A long time ago, 오래전에. the volcanoes, 그 화산들은. moved and talked, 움직이고 말을 했어요. like humans, 인간처럼.. 이 문장 전체를 해석하면, 오래전에, 화산들은 인간처럼 움직이고 말을 했어요.","hl":"m"},{"n":13,"text":"이 문장은 옛이야기의 시작이에요. 아주 먼 옛날에는 화산이 사람처럼 움직이고 말을 했다고 해요. 신기하죠?","hl":"mn"},{"n":14,"text":"먼저 the volcanoes를 봐요. 화산이 여러 개니까 이름 말 뒤에 s를 붙여서 복수로 만들어 줬어요. 그리고 moved and talked는 오래전 일을 말하니까 동사 뒤에 ed를 붙인 과거형이에요. 지난 일은 꼭 과거형으로 말한다는 것, 잊지 마세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 사막 지역에는\u003c/span>\u003cspan class=\"en\">In their desert area,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">있었어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">was\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오직 하나\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">only \u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여자 화산이.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">female \u003c/span>\u003cspan class=\"tgt\">volcano\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들의 사막 지역에는 유일한 여자 화산이 있었답니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 화산들이 사는 \u003cb class=\"key\">사막\u003c/b> 지역에 \u003cb class=\"key\">여자 \u003c/b>\u003cb class=\"key\">화산\u003c/b>이 딱 하나뿐이었다는 걸 알려 줘요. 그래서 이 화산이 아주 특별하다는 걸 알 수 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">~이 있다(There is/are)\u003c/span> : There was + 무엇이 = 무엇이 있었어요 : \"있었어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">꾸며 주는 말(형용사)\u003c/span> : 꾸며 주는 말(female) + 이름 말(volcano) : \"오직 하나뿐인 여자 화산\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"In their desert area, 그들의 사막 지역에는. there was, 있었어요. only one, 오직 하나. female volcano, 여자 화산이.. 이 문장 전체를 해석하면, 그들의 사막 지역에는 유일한 여자 화산이 있었답니다.","hl":"m"},{"n":16,"text":"화산들이 사는 사막 지역에 여자 화산이 딱 하나만 있었대요. 그래서 이 여자 화산은 아주 특별한 존재였어요.","hl":"mn"},{"n":17,"text":"먼저 there was는 무엇이 있었어요라고 말할 때 쓰는 표현이에요. 두 번째로 female은 뒤에 오는 volcano를 꾸며 주는 형용사예요. 그래서 여자 화산, 이렇게 꾸며 주는 거죠. 여러분도 a cute dog처럼 꾸며 주는 말을 자주 써 봐요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀의 이름은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Her \u003c/span>\u003cspan class=\"tgt\">name\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Tunupa였지요.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">Tunupa\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀의 이름은 Tunupa였지요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 그 \u003cb class=\"key\">여자 \u003c/b>\u003cb class=\"key\">화산\u003c/b>의 이름이 \u003cb class=\"key\">Tunupa\u003c/b>라고 알려 주는 문장이에요. 이제부터 이야기의 주인공 이름이 나와요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">누구의 것인지 알려 주는 말(소유격)\u003c/span> : 소유격(Her) + 이름 말(name) = 그녀의 이름 : \"그녀의 이름\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">am·are·is 친구들(be동사)\u003c/span> : 주어(Her name) + be동사(was) + 보어(Tunupa) : \"Tunupa였어요\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Her name, 그녀의 이름은. was Tunupa, Tunupa였지요.. 이 문장 전체를 해석하면, 그녀의 이름은 Tunupa였지요.","hl":"m"},{"n":19,"text":"이 여자 화산의 이름을 알려 주는 문장이에요. 이름은 Tunupa래요. 이제 이 화산의 이야기가 본격적으로 시작돼요.","hl":"mn"},{"n":20,"text":"먼저 Her는 그녀의라는 뜻으로, 이름 앞에서 누구의 것인지 알려 줘요. 그다음 was는 is의 과거형이에요. 지금이 아니라 옛날이야기니까 was를 쓴 거죠. 이름을 말할 때 be동사를 쓴다는 것도 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어느 날,\u003c/span>\u003cspan class=\"en\">One day,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 낳았어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">she \u003c/span>\u003cspan class=\"tgt\">had\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아기 화산을,\u003c/span>\u003cspan class=\"en\">a baby volcano,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 아무도 몰랐어요\u003c/span>\u003cspan class=\"en\">but \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">no \u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">knew\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 아기의 아빠가 누구인지.\u003c/span>\u003cspan class=\"en\">who the baby's father was.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어느 날, 그녀는 아기 화산을 낳았지만, 아무도 그 아기의 아빠가 누구인지 알지 못했어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아기 화산이 태어났지만 아빠가 누구인지 아무도 몰랐다는 뜻이에요. 이야기의 \u003cb class=\"key\">문제\u003c/b>가 생기기 시작하는 장면이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거형(지난 일 말)\u003c/span> : 누가(she) + 했다(had) + 무엇을(a baby volcano) : \"그녀는 낳았어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부정 주어(부정을 만드는 말)\u003c/span> : 아무도(no one) + 몰랐다(knew) : \"아무도 몰랐어요\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"One day, 어느 날. she had, 그녀는 낳았어요. a baby volcano, 아기 화산을. but no one knew, 하지만 아무도 몰랐어요. who the baby's father was, 그 아기의 아빠가 누구인지.. 이 문장 전체를 해석하면, 어느 날, 그녀는 아기 화산을 낳았지만, 아무도 그 아기의 아빠가 누구인지 알지 못했어요.","hl":"m"},{"n":22,"text":"아기 화산이 태어났는데 아빠가 누구인지 아무도 몰랐다는 뜻이에요. 이야기의 문제가 바로 여기서 시작되는 거죠.","hl":"mn"},{"n":23,"text":"먼저 had는 have의 과거형이에요. 지난 일이라서 모양이 이렇게 바뀐 거예요. 그리고 no one은 아무도라는 뜻이라서 뒤에 not을 또 붙이지 않아요. 마지막으로 who the baby's father was는 누구인지라는 뜻 덩어리로 통째로 기억해 두면 좋아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든\u003c/span>\u003cspan class=\"en\">All of the\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">남자 화산들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">male \u003c/span>\u003cspan class=\"tgt\">volcanoes\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">되고 싶어 했어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">wanted \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 아기의 아빠가.\u003c/span>\u003cspan class=\"en\">the baby's father.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">모든 남자 화산들은 그 아기의 아빠가 되고 싶어 했어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 남자 화산들이 모두 아기 화산의 아빠가 되고 싶어 했다는 뜻이에요. 그래서 서로 \u003cb class=\"key\">다투게\u003c/b> 돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">여러 개일 때 명사 + s(복수)\u003c/span> : 여러 개(male volcanoes) + es : \"남자 화산들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">want + to 동사원형\u003c/span> : 하고 싶었다(wanted) + to be(~가 되다) : \"되고 싶어 했어요\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"All of the, 모든. male volcanoes, 남자 화산들이. wanted to be, 되고 싶어 했어요. the baby's father, 그 아기의 아빠가.. 이 문장 전체를 해석하면, 모든 남자 화산들은 그 아기의 아빠가 되고 싶어 했어요.","hl":"m"},{"n":25,"text":"남자 화산들이 모두 그 아기의 아빠가 되고 싶어 했다는 뜻이에요. 여기서부터 화산들 사이에 다툼이 생기기 시작해요.","hl":"mn"},{"n":26,"text":"먼저 wanted to be를 보세요. want 뒤에 to 동사원형을 붙이면 하고 싶다라는 뜻이 돼요. 여기서는 to be라서 가 되고 싶다가 되는 거예요. 그리고 volcano에 es를 붙인 이유는 화산이 여러 개이기 때문이에요. 이렇게 여러 개를 말할 때는 복수 모양을 써 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">밤새도록\u003c/span>\u003cspan class=\"en\">All night\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 싸웠어요.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">fought\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 밤새도록 싸웠답니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 남자 화산들이 밤이 새도록 싸웠다는 뜻이에요. 아빠 자리를 두고 \u003cb class=\"key\">다툼\u003c/b>이 아주 커졌어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거형(지난 일 말)\u003c/span> : 그들은(they) + 싸웠다(fought) : \"그들은 싸웠어요\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"All night, 밤새도록. they fought, 그들은 싸웠어요.. 이 문장 전체를 해석하면, 그들은 밤새도록 싸웠답니다.","hl":"m"},{"n":28,"text":"남자 화산들이 밤이 새도록 싸웠다는 뜻이에요. 아빠 자리를 두고 다툼이 아주 커진 거죠.","hl":"mn"},{"n":29,"text":"여기서 눈여겨볼 것은 fought예요. fight의 과거형이라서 -ed를 붙이지 않고 모양이 휙 바뀌었어요. 이런 동사는 하나씩 외워 두면 아주 든든해요. All night은 밤새도록이라는 뜻으로, 얼마나 오래 싸웠는지 알려 주는 말이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">결국,\u003c/span>\u003cspan class=\"en\">In the end,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 가져갔어요\u003c/span>\u003cspan class=\"en\">they \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">took\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아기 화산을 빼앗아\u003c/span>\u003cspan class=\"en\">the baby volcano away\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그를 숨겼어요.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">hid \u003c/span>\u003cspan class=\"tgt\">him\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">결국, 그들은 아기 화산을 빼앗아 그를 숨겼어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 화산들이 결국 아기 화산을 \u003cb class=\"key\">빼앗아\u003c/b> \u003cb class=\"key\">숨겼다\u003c/b>는 뜻이에요. 이야기에서 큰 사건이 터지는 중요한 \u003cb class=\"key\">장면\u003c/b>이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 그들은(they) + 가져갔다(took) + 아기 화산을(the baby volcano) : \"가져갔어요, 빼앗았어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 행동 하나(took) + and + 행동 둘(hid) : \"그리고 그를 숨겼어요\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"In the end, 결국. they took, 그들은 가져갔어요. the baby volcano away, 아기 화산을 빼앗아. and hid him, 그리고 그를 숨겼어요.. 이 문장 전체를 해석하면, 결국, 그들은 아기 화산을 빼앗아 그를 숨겼어요.","hl":"m"},{"n":31,"text":"화산들이 결국 아기 화산을 빼앗아 숨겼다는 뜻이에요. 이야기에서 큰일이 터지는 아주 중요한 장면이죠.","hl":"mn"},{"n":32,"text":"문법은 두 개만 짚어 볼게요. 먼저 took은 take의 과거형이에요. 이미 지난 일이라서 모양이 took으로 바뀐 불규칙 동사예요. 그리고 and는 이어 주는 말, 접속사예요. took과 hid, 두 행동을 나란히 이어 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">신들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When\u003c/span> the gods\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것에 대해 들었을 때,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">heard\u003c/span> about this,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 화가 났어요.\u003c/span>\u003cspan class=\"en\">they \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">were\u003c/span> angry.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">신들이 이것에 대해 들었을 때, 그들은 화가 났어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 신들이 이 소식을 \u003cb class=\"key\">듣고\u003c/b> \u003cb class=\"key\">화\u003c/b>가 났다는 뜻이에요. 그래서 다음에 화산들에게 \u003cb class=\"key\">벌\u003c/b>을 주게 되죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">때를 알려 주는 이어 주는 말(접속사 when)\u003c/span> : When + 있었던 일(신들이 들었다) + , + 그때 일어난 일 : \"~했을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 신들이(the gods) + 들었다(heard) + 이것에 대해(about this) : \"들었어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">am·are·is 친구들(be동사)\u003c/span> : 그들은(they) + 이었다(were) + 화가 난(angry) : \"화가 났어요(그때 상태)\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"When the gods, 신들이. heard about this, 이것에 대해 들었을 때. they were angry, 그들은 화가 났어요.. 이 문장 전체를 해석하면, 신들이 이것에 대해 들었을 때, 그들은 화가 났어요.","hl":"m"},{"n":34,"text":"신들이 이 소식을 듣고 화가 났다는 뜻이에요. 그래서 다음에 화산들에게 벌을 주게 되죠.","hl":"mn"},{"n":35,"text":"먼저 When은 때를 알려 주는 접속사예요. 신들이 들었을 때, 하고 때를 먼저 말해 줘요. heard는 hear의 과거형이고, were는 are의 과거형이에요. 그때의 상태를 말할 때 were를 써요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 13\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 빼앗아 버렸어요\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">took \u003c/span>\u003cspan class=\"tgt\">away\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">화산들의 능력을\u003c/span>\u003cspan class=\"en\">the volcanoes' ability\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">움직이고 말하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">move \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">talk\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 화산들의 움직이고 말하는 능력을 빼앗아 버렸답니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 신들이 화산들의 \u003cb class=\"key\">능력\u003c/b>을 \u003cb class=\"key\">빼앗았다\u003c/b>는 뜻이에요. 그래서 이제 화산은 \u003cb class=\"key\">움직이지\u003c/b>도 말하지도 못해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">빼앗다라는 묶음 표현(take away의 과거)\u003c/span> : 그들은(They) + 빼앗았다(took away) + 무엇을(the volcanoes' ability) : \"빼앗아 버렸어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to + 동사원형(to부정사)\u003c/span> : 능력(ability) + to + 움직이다(move) : \"움직이고 말하는\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"They took away, 그들은 빼앗아 버렸어요. the volcanoes' ability, 화산들의 능력을. to move and talk, 움직이고 말하는. 이 문장 전체를 해석하면, 그들은 화산들의 움직이고 말하는 능력을 빼앗아 버렸답니다.","hl":"m"},{"n":37,"text":"신들이 화산들이 움직이고 말하는 능력을 빼앗았다는 뜻이에요. 그래서 이제 화산은 움직이지도 말하지도 못해요.","hl":"mn"},{"n":38,"text":"먼저 took away는 빼앗다라는 묶음 표현이에요. take의 과거형이라 took으로 썼어요. 그리고 ability 뒤에 to를 붙이면 무엇을 할 능력이라는 뜻이 돼요. 그래서 to move and talk는 움직이고 말하는 능력이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 화산들처럼,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Like \u003c/span>\u003cspan class=\"tgt\">other \u003c/span>\u003cspan class=\"tgt\">volcanoes\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Tunupa는 움직일 수 없었어요\u003c/span>\u003cspan class=\"en\">Tunupa \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">couldn't \u003c/span>\u003cspan class=\"tgt\">move \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또는 전혀 말할 수도 없었어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">talk\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">all\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">다른 화산들처럼, Tunupa도 전혀 움직이거나 말할 수 없었어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 신들이 화산들의 움직이고 말하는 \u003cb class=\"key\">능력\u003c/b>을 빼앗았기 때문에 Tunupa도 \u003cb class=\"key\">꼼짝도 \u003c/b>\u003cb class=\"key\">못 \u003c/b>\u003cb class=\"key\">하게\u003c/b> 되었다는 뜻이에요. 벌이 Tunupa에게도 똑같이 내려진 \u003cb class=\"key\">결과\u003c/b>를 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">~처럼(전치사)\u003c/span> : ~처럼(Like) + 무엇(other volcanoes) : \"다른 화산들처럼\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">할 수 없었다(도와주는 동사 can의 과거 부정)\u003c/span> : 누가(Tunupa) + 할 수 없었다(couldn't) + 하다(move) : \"움직이거나 말할 수 없었어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전혀(부사)\u003c/span> : 전혀(at all) : \"전혀\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"Like other volcanoes, 다른 화산들처럼. Tunupa couldn't move, Tunupa는 움직일 수 없었어요. or talk at all, 또는 전혀 말할 수도 없었어요. 이 문장 전체를 해석하면, 다른 화산들처럼, Tunupa도 전혀 움직이거나 말할 수 없었어요.","hl":"m"},{"n":40,"text":"신들이 화산들의 능력을 빼앗은 뒤에 Tunupa도 다른 화산처럼 꼼짝도 못 하게 되었어요. 이 문장은 벌을 받은 결과를 보여 주는 문장이에요.","hl":"mn"},{"n":41,"text":"첫 번째, like는 '좋아하다'가 아니라 '~처럼'이라는 뜻이에요. 뒤에 이름 말이 오는 전치사죠. 두 번째, can은 '할 수 있다'를 뜻하는 도와주는 동사인데, 지난 일이라 couldn't가 되어 '할 수 없었다'가 돼요. 세 번째, or를 써서 움직이기와 말하기 둘 다 안 된다는 뜻이에요. 그리고 at all은 '전혀'라는 뜻으로 뒤에서 힘을 더해 준답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 13\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 울었어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">She \u003c/span>\u003cspan class=\"tgt\">cried\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜냐하면 그녀는 찾을 수 없었기 때문이에요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">because \u003c/span>\u003cspan class=\"tgt\">she \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">couldn't \u003c/span>\u003cspan class=\"tgt\">find \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 아기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">her \u003c/span>\u003cspan class=\"tgt\">baby\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 자신의 아기를 찾을 수 없었기 때문에 울었어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Tunupa가 \u003cb class=\"key\">아기\u003c/b>를 찾지 못해서 운 까닭을 알려 줘요. \u003cb class=\"key\">because\u003c/b>가 '왜냐하면 ~때문에'로 \u003cb class=\"key\">이유\u003c/b>를 이어 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말하기(과거형)\u003c/span> : 누가(She) + 했다(cried) : \"그녀는 울었어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이유를 이어 주는 말(접속사 because)\u003c/span> : 왜냐하면(because) + 누가(she) + 못 했다(couldn't find) : \"왜냐하면 그녀가 아기를 찾을 수 없었기 때문에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">할 수 없었다(도와주는 동사 can의 과거 부정)\u003c/span> : 누가(she) + 할 수 없었다(couldn't) + 하다(find) : \"찾을 수 없었어요\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"She cried, 그녀는 울었어요. because she couldn't find, 왜냐하면 그녀는 찾을 수 없었기 때문이에요. her baby, 자신의 아기를. 이 문장 전체를 해석하면, 그녀는 자신의 아기를 찾을 수 없었기 때문에 울었어요.","hl":"m"},{"n":43,"text":"Tunupa는 자기 아기를 찾지 못해서 울었어요. because가 '왜 울었는지' 그 이유를 뒤에 붙여 주는 거예요.","hl":"mn"},{"n":44,"text":"첫 번째, cried는 cry에 d를 붙인 과거형이에요. 지난 일이라 이렇게 말해요. 두 번째, because는 이유를 알려 주는 접속사예요. 그래서 뒤에 '아기를 찾을 수 없었다'가 통째로 와요. 세 번째, couldn't 다음에는 동사원형 find가 와요. couldn't finds처럼 쓰면 안 돼요. 아주 잘 따라오고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀의 눈물\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Her \u003c/span>\u003cspan class=\"tgt\">tears\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 엄마의 모유\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">mother's \u003c/span>\u003cspan class=\"tgt\">milk\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">땅 위로 흘러넘쳤어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">ran \u003c/span>\u003cspan class=\"tgt\">over \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">land\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀의 눈물과 모유가 땅 위로 흘러넘쳤지요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Tunupa의 \u003cb class=\"key\">눈물\u003c/b>과 \u003cb class=\"key\">모유\u003c/b>가 땅으로 흘러넘쳤다는 뜻이에요. 이 장면이 다음 문장에서 땅이 하얗고 짜게 되는 \u003cb class=\"key\">이유\u003c/b>가 돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">그녀의(소유격)\u003c/span> : 누구의(Her) + 무엇(tears) : \"그녀의 눈물\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">그리고(접속사 and)\u003c/span> : 무엇(Her tears) + 그리고(and) + 무엇(mother's milk) : \"그리고 엄마의 모유\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">지난 일 말하기(과거형, 불규칙 run-ran)\u003c/span> : 무엇이(milk) + 흘렀다(ran) + 어디로(over the land) : \"땅 위로 흘러넘쳤어요\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"Her tears, 그녀의 눈물. and mother's milk, 그리고 엄마의 모유. ran over the land, 땅 위로 흘러넘쳤어요. 이 문장 전체를 해석하면, 그녀의 눈물과 모유가 땅 위로 흘러넘쳤지요.","hl":"m"},{"n":46,"text":"Tunupa의 눈물과 모유가 땅 위로 흘러넘쳤어요. 그래서 다음 문장에서 땅이 하얗고 짜지게 되는 이유가 돼요.","hl":"mn"},{"n":47,"text":"첫 번째, her는 '그녀의'라는 뜻으로 이름 앞에 붙어 누구 것인지 알려 줘요. 두 번째, and는 눈물과 모유를 나란히 이어 주죠. 그래서 둘이 함께 주어가 돼요. 세 번째, run은 과거에 ran으로 모양이 확 바뀌는 불규칙 동사예요. over는 '위로'라는 뜻이라서 땅 위로 흘러넘쳤다는 말이 되는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 땅은\u003c/span>\u003cspan class=\"en\">The land\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">희고 짜게 되었어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">became\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">white \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">salty\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Tunupa 때문에\u003c/span>\u003cspan class=\"en\">because of Tunupa.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 땅은 Tunupa 때문에 희고 짜게 되었답니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Tunupa의 눈물과 젖 때문에 땅이 \u003cb class=\"key\">희고 \u003c/b>\u003cb class=\"key\">짠 \u003c/b>\u003cb class=\"key\">땅\u003c/b>이 되었다는 뜻이에요. 이야기의 \u003cb class=\"key\">결말\u003c/b>로, Tunupa의 슬픔이 자연을 바꾼 까닭을 알려 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(The land) + 되었다(became) + 어떤 상태로(white and salty) : \"되었답니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">꾸며 주는 말(형용사)\u003c/span> : 무엇이(The land) + 어떤 상태(white and salty) : \"희고 짜게\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"The land, 그 땅은. became white and salty, 희고 짜게 되었어요. because of Tunupa, Tunupa 때문에. 이 문장 전체를 해석하면, 그 땅은 Tunupa 때문에 희고 짜게 되었답니다.","hl":"m"},{"n":49,"text":"이 문장은 Tunupa의 눈물과 젖 때문에 땅이 희고 짠 땅이 되었다는 뜻이에요. 이야기의 결말로, Tunupa의 슬픔이 자연을 바꾼 까닭을 보여 줘요.","hl":"mn"},{"n":50,"text":"먼저 became은 지난 일을 말하는 과거 표현이에요. become이 became로 바뀌어서 되었다는 뜻이 되죠. 두 번째로 white and salty는 땅이 어떤 상태인지 알려 주는 형용사예요. 그래서 희고 짜게라는 뜻으로 land를 꾸며 줘요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">오늘 배운 내용 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>오래전 화산들은 인간처럼 \u003cb class=\"key\">움직이고 \u003c/b>\u003cb class=\"key\">말했어요\u003c/b>.\u003c/li>\u003cli>남자 화산들이 아기를 \u003cb class=\"key\">빼앗아 \u003c/b>\u003cb class=\"key\">숨기자\u003c/b> 신들이 화를 냈어요.\u003c/li>\u003cli>화산들은 움직이고 말하는 \u003cb class=\"key\">능력\u003c/b>을 잃었어요.\u003c/li>\u003cli>Tunupa의 \u003cb class=\"key\">눈물\u003c/b>과 모유 때문에 땅이 희고 짜게 되었어요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Tunupa's tears and mother's milk made the land white and salty after the volcanoes lost their power to move and talk.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: 오래전 인간처럼 움직이고 말하던 화산들이 아기 화산을 두고 싸워 \u003cb class=\"key\">아기를 \u003c/b>\u003cb class=\"key\">숨겼고\u003c/b>, 신들이 벌을 내려 화산들은 \u003cb class=\"key\">움직이고 \u003c/b>\u003cb class=\"key\">말하는 \u003c/b>\u003cb class=\"key\">능력\u003c/b>을 잃었어요. 엄마 화산 Tunupa의 \u003cb class=\"key\">눈물과 \u003c/b>\u003cb class=\"key\">모유\u003c/b> 때문에 그 땅은 희고 짜게 되었답니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":51,"text":"오늘 우리는 Tunupa와 화산들의 이야기를 읽었어요. 화산들이 다투는 바람에 움직이고 말하는 능력을 잃었고, Tunupa의 눈물과 모유가 땅을 희고 짜게 만들었죠. 여러분은 오늘 이야기 순서도 잘 찾고 길잡이 말도 잘 찾았어요. 정말 멋졌어요! 다음 시간에도 재미있는 이야기로 만나요. 안녕!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
