3c/div>\u003cdiv data-hl=\"gb\">\u003cdiv class=\"gblk\">\u003cdiv class=\"gb r-and\">\u003cspan class=\"gt\">이어 주는 말\u003c/span>\u003cspan class=\"ge\">Also,\u003c/span>\u003cspan class=\"gk\">또한,\u003c/span>\u003c/div>\u003cdiv class=\"gb r-be\">\u003cspan class=\"gt\">~이에요\u003c/span>\u003cspan class=\"ge\">there are\u003c/span>\u003cspan class=\"gk\">여러 개가 있어요\u003c/span>\u003c/div>\u003cdiv class=\"gb r-what\">\u003cspan class=\"gt\">무엇을\u003c/span>\u003cspan class=\"ge\">too many stairs,\u003c/span>\u003cspan class=\"gk\">계단이 너무 많아요\u003c/span>\u003c/div>\u003cdiv class=\"gb r-and\">\u003cspan class=\"gt\">이어 주는 말\u003c/span>\u003cspan class=\"ge\">and\u003c/span>\u003cspan class=\"gk\">그리고\u003c/span>\u003c/div>\u003cdiv class=\"gb r-be\">\u003cspan class=\"gt\">~이에요\u003c/span>\u003cspan class=\"ge\">there is\u003c/span>\u003cspan class=\"gk\">하나가 있어요\u003c/span>\u003c/div>\u003cdiv class=\"gb r-not\">\u003cspan class=\"gt\">아니에요\u003c/span>\u003cspan class=\"ge\">no elevator\u003c/span>\u003cspan class=\"gk\">엘리베이터가 없어요\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cdiv data-hl=\"gp\">\u003cdiv class=\"gpic\">\u003cdiv class=\"gpt\">하나 vs 여러 개 vs 없음\u003c/div>\u003cdiv class=\"gpr\">\u003cdiv class=\"gpi\">\u003cdiv class=\"pe\">🚪\u003c/div>\u003cdiv class=\"pn\">There is a door.\u003c/div>\u003cdiv class=\"pk\">문이 하나 있어요\u003c/div>\u003c/div>\u003cdiv class=\"gpi\">\u003cdiv class=\"pe\">🚪🚪\u003c/div>\u003cdiv class=\"pn\">There are doors.\u003c/div>\u003cdiv class=\"pk\">문이 여러 개 있어요\u003c/div>\u003c/div>\u003cdiv class=\"gpi\">\u003cdiv class=\"pe\">🛗\u003c/div>\u003cdiv class=\"pn\">There is no elevator.\u003c/div>\u003cdiv class=\"pk\">엘리베이터가 없어요\u003c/div>\u003cspan class=\"mk x\">X\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"k-ez\" data-hl=\"ge\">하나가 있으면 There is, 여러 개가 있으면 There are라고 해요. 없을 때는 뒤에 no를 붙여서 There is no라고 해요. 그래서 \u003cb class=\"key\">There \u003c/b>\u003cb class=\"key\">is \u003c/b>\u003cb class=\"key\">no \u003c/b>\u003cb class=\"key\">elevator\u003c/b>는 '엘리베이터가 없어요'가 된답니다.\u003c/div>\u003c/div>","segs":[{"n":89,"text":"이번에는 '있어요'를 말하는 방법을 배워 볼게요. 하나가 있으면 There is, 여러 개가 있으면 There are라고 해요. 대표 문장을 하나씩 떼어서 볼까요? there are는 '여러 개가 있어요', too many stairs는 '계단이 너무 많아요', there is는 '하나가 있어요', no elevator는 '엘리베이터가 없어요'라는 뜻이에요. 그래서 '계단이 너무 많고 엘리베이터는 없어요'가 되는 거예요. 없을 때는 There is no라고 하면 된답니다.","hl":"gb"},{"n":90,"text":"하나가 있으면 There is, 여러 개가 있으면 There are라고 해요. 없을 때는 뒤에 no를 붙여서 There is no라고 해요. 그래서 There is no elevator는 '엘리베이터가 없어요'가 된답니다.","hl":"ge"}]},{"html":"\u003cspan class=\"lp-tag\">확인해요\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-gt\">\u003cspan>📍\u003c/span>있어요, 없어요 There is / There are\u003c/div>\u003cdiv class=\"k-ex\" data-hl=\"gx\">\u003cdiv>\u003cspan class=\"e\">🪑\u003c/span>\u003cb>There is a desk in my room.\u003c/b>\u003csmall>내 방에 책상이 하나 있어요.\u003c/small>\u003c/div>\u003cdiv>\u003cspan class=\"e\">📚\u003c/span>\u003cb>There are many books on the desk.\u003c/b>\u003csmall>책상 위에 책이 많이 있어요.\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"k-ck\" data-hl=\"gc\">\u003cdiv class=\"q\">\u003cspan class=\"k-ans\" data-rv=\"gc\">There is\u003c/span> a cat under the chair.\u003c/div>\u003csmall>의자 아래에 고양이가 한 마리 있어요.\u003c/small>\u003cdiv class=\"o\">\u003cspan class=\"k-right\" data-rv=\"gc\">There is\u003c/span>\u003cspan>There are\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":91,"text":"예문을 더 볼까요?","hl":"gx"},{"n":92,"text":"There is a desk in my room.","hl":"gx","v":"n","pause":600},{"n":93,"text":"내 방에 책상이 하나 있어요.","hl":"gx"},{"n":94,"text":"There are many books on the desk.","hl":"gx","v":"n","pause":600},{"n":95,"text":"책상 위에 책이 많이 있어요.","hl":"gx"},{"n":96,"text":"문제를 풀어 볼까요? 빈칸 a cat under the chair. 빈칸에 들어갈 말은 There is, 아니면 There are 중에서 무엇일까요?","hl":"gc"},{"n":97,"text":"정답은 There is! There is a cat under the chair.","hl":"gc","rv":"gc"}]},{"html":"\u003cspan class=\"lp-tag\">문법을 그림으로\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-gt\">\u003cspan>💪\u003c/span>~할 수 있어요 can\u003c/div>\u003cdiv data-hl=\"gb\">\u003cdiv class=\"gblk\">\u003cdiv class=\"gb r-who\">\u003cspan class=\"gt\">누가\u003c/span>\u003cspan class=\"ge\">We\u003c/span>\u003cspan class=\"gk\">우리는\u003c/span>\u003c/div>\u003cdiv class=\"gb r-can\">\u003cspan class=\"gt\">할 수 있어요\u003c/span>\u003cspan class=\"ge\">can\u003c/span>\u003cspan class=\"gk\">할 수 있어요\u003c/span>\u003c/div>\u003cdiv class=\"gb r-do\">\u003cspan class=\"gt\">~해요\u003c/span>\u003cspan class=\"ge\">share\u003c/span>\u003cspan class=\"gk\">나누다\u003c/span>\u003c/div>\u003cdiv class=\"gb r-what\">\u003cspan class=\"gt\">무엇을\u003c/span>\u003cspan class=\"ge\">more ideas\u003c/span>\u003cspan class=\"gk\">더 많은 생각을\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cdiv data-hl=\"gp\">\u003cdiv class=\"gpic\">\u003cdiv class=\"gpt\">can과 can't\u003c/div>\u003cdiv class=\"gpr\">\u003cdiv class=\"gpi\">\u003cdiv class=\"pe\">💬\u003c/div>\u003cdiv class=\"pn\">We can share ideas.\u003c/div>\u003cdiv class=\"pk\">생각을 나눌 수 있어요\u003c/div>\u003cspan class=\"mk o\">O\u003c/span>\u003c/div>\u003cdiv class=\"gpi\">\u003cdiv class=\"pe\">🚫\u003c/div>\u003cdiv class=\"pn\">We can't share ideas.\u003c/div>\u003cdiv class=\"pk\">생각을 나눌 수 없어요\u003c/div>\u003cspan class=\"mk x\">X\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"k-ez\" data-hl=\"ge\">can은 '~할 수 있어요'라고 말할 때 쓰는 아주 힘센 말이에요. can 뒤에는 항상 동사 원형이 와요. 그래서 \u003cb class=\"key\">We \u003c/b>\u003cb class=\"key\">can \u003c/b>\u003cb class=\"key\">share\u003c/b>는 '우리는 나눌 수 있어요'라는 뜻이 된답니다.\u003c/div>\u003c/div>","segs":[{"n":98,"text":"두 번째는 can이에요. can은 '~할 수 있어요'라고 용기를 주는 말이에요. We는 '우리는', can은 '할 수 있어요', share는 '나누다', more ideas는 '더 많은 생각을'이라는 뜻이에요. 그래서 We can share more ideas는 '우리는 더 많은 생각을 나눌 수 있어요'가 돼요. 여러분도 I can do it이라고 하면 '나는 할 수 있어요'라는 뜻이 된답니다.","hl":"gb"},{"n":99,"text":"can은 '~할 수 있어요'라고 말할 때 쓰는 아주 힘센 말이에요. can 뒤에는 항상 동사 원형이 와요. 그래서 We can share는 '우리는 나눌 수 있어요'라는 뜻이 된답니다.","hl":"ge"}]},{"html":"\u003cspan class=\"lp-tag\">확인해요\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-gt\">\u003cspan>💪\u003c/span>~할 수 있어요 can\u003c/div>\u003cdiv class=\"k-ex\" data-hl=\"gx\">\u003cdiv>\u003cspan class=\"e\">🏊\u003c/span>\u003cb>I can swim very well.\u003c/b>\u003csmall>나는 수영을 아주 잘할 수 있어요.\u003c/small>\u003c/div>\u003cdiv>\u003cspan class=\"e\">🤝\u003c/span>\u003cb>We can help our friends.\u003c/b>\u003csmall>우리는 친구들을 도울 수 있어요.\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"k-ck\" data-hl=\"gc\">\u003cdiv class=\"q\">She \u003cspan class=\"k-ans\" data-rv=\"gc\">can\u003c/span> play the piano.\u003c/div>\u003csmall>그녀는 피아노를 칠 수 있어요.\u003c/small>\u003cdiv class=\"o\">\u003cspan class=\"k-right\" data-rv=\"gc\">can\u003c/span>\u003cspan>can't\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":100,"text":"예문을 더 볼까요?","hl":"gx"},{"n":101,"text":"I can swim very well.","hl":"gx","v":"n","pause":600},{"n":102,"text":"나는 수영을 아주 잘할 수 있어요.","hl":"gx"},{"n":103,"text":"We can help our friends.","hl":"gx","v":"n","pause":600},{"n":104,"text":"우리는 친구들을 도울 수 있어요.","hl":"gx"},{"n":105,"text":"문제를 풀어 볼까요? She 빈칸 play the piano. 빈칸에 들어갈 말은 can, 아니면 can't 중에서 무엇일까요?","hl":"gc"},{"n":106,"text":"정답은 can! She can play the piano.","hl":"gc","rv":"gc"}]},{"html":"\u003cspan class=\"lp-tag\">내용 확인 문제\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-qq\" data-hl=\"q0\">\u003ci>1\u003c/i>\u003cdiv>\u003cdiv class=\"q\">Mary는 4학년이에요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q0\">O\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q1\">\u003ci>2\u003c/i>\u003cdiv>\u003cdiv class=\"q\">Andy는 지난주에 팔을 다쳤어요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q1\">X\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q2\">\u003ci>3\u003c/i>\u003cdiv>\u003cdiv class=\"q\">Andy는 지금 무엇을 타고 다니나요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 자전거\u003c/span>\u003cspan>② 휠체어\u003c/span>\u003cspan>③ 버스\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q2\">휠체어\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q3\">\u003ci>4\u003c/i>\u003cdiv>\u003cdiv class=\"q\">Mary가 말한 학교의 문제가 아닌 것은 무엇인가요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 교실 문이 너무 작아요\u003c/span>\u003cspan>② 계단이 너무 많아요\u003c/span>\u003cspan>③ 엘리베이터가 너무 커요\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q3\">엘리베이터가 너무 커요\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":107,"text":"이제 문제를 풀어 볼까요? 지문을 다시 한 번 보고 답을 찾아보세요. 틀려도 괜찮아요. 함께 하나씩 확인해 봐요.","hl":null},{"n":108,"text":"첫 번째 문제. Mary는 4학년이에요. 맞으면 O, 틀리면 X예요.","hl":"q0"},{"n":109,"text":"정답은 O, 맞아요.","hl":"q0","rv":"q0"},{"n":110,"text":"두 번째 문제. Andy는 지난주에 팔을 다쳤어요. 맞으면 O, 틀리면 X예요.","hl":"q1"},{"n":111,"text":"정답은 X, 틀려요.","hl":"q1","rv":"q1"},{"n":112,"text":"세 번째 문제. Andy는 지금 무엇을 타고 다니나요? 첫 번째, 자전거. 두 번째, 휠체어. 세 번째, 버스","hl":"q2"},{"n":113,"text":"정답은 휠체어예요.","hl":"q2","rv":"q2"},{"n":114,"text":"네 번째 문제. Mary가 말한 학교의 문제가 아닌 것은 무엇인가요? 첫 번째, 교실 문이 너무 작아요. 두 번째, 계단이 너무 많아요. 세 번째, 엘리베이터가 너무 커요","hl":"q3"},{"n":115,"text":"정답은 엘리베이터가 너무 커요예요.","hl":"q3","rv":"q3"}]},{"html":"\u003cspan class=\"lp-tag\">이야기 요약하기\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-bank\">\u003cspan>elevator\u003c/span>\u003cspan>problems\u003c/span>\u003cspan>small\u003c/span>\u003cspan>wheelchair\u003c/span>\u003c/div>\u003cdiv class=\"k-sum\" data-hl=\"sm\">Mary's friend Andy is in a \u003cspan class=\"k-ans\" data-rv=\"sm\">wheelchair\u003c/span> now. Mary found some \u003cspan class=\"k-ans\" data-rv=\"sm\">problems\u003c/span> at school: the classroom doors are too \u003cspan class=\"k-ans\" data-rv=\"sm\">small\u003c/span> and there is no \u003cspan class=\"k-ans\" data-rv=\"sm\">elevator\u003c/span>. She hopes the school can do better.\u003c/div>\u003cdiv class=\"k-sk\">Mary의 친구 Andy는 이제 휠체어를 타고 다녀요. Mary는 학교에서 몇 가지 문제를 발견했어요. 교실 문은 너무 작고 엘리베이터가 없어요. 그녀는 학교가 더 잘할 수 있기를 바라요.\u003c/div>\u003c/div>","segs":[{"n":116,"text":"마지막으로 오늘 이야기를 짧게 정리해 볼게요. Andy는 휠체어를 타고, Mary는 작은 문과 많은 계단, 엘리베이터가 없는 문제를 알려 줬어요. 빈칸에 알맞은 낱말을 넣어서 요약을 완성해 보세요.","hl":null},{"n":117,"text":"Mary's friend Andy is in a wheelchair now. Mary found some problems at school: the classroom doors are too small and there is no elevator. She hopes the school can do better.","hl":"sm","rv":"sm","v":"n"},{"n":118,"text":"Mary의 친구 Andy는 이제 휠체어를 타고 다녀요. Mary는 학교에서 몇 가지 문제를 발견했어요. 교실 문은 너무 작고 엘리베이터가 없어요. 그녀는 학교가 더 잘할 수 있기를 바라요.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>Letter to the School 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":119,"text":"여러분, 오늘 정말 잘했어요! 친구를 생각하는 Mary의 마음처럼, 우리도 주변을 잘 살펴보는 멋진 친구가 되어 봐요. 다음 시간에 또 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
