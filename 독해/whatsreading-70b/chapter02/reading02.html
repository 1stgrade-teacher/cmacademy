\u003c/span> Walter. Walter lied that he was the painter, so she \u003cspan class=\"k-ans\" data-rv=\"sm\">hid\u003c/span> and painted all day. Years later, she told the \u003cspan class=\"k-ans\" data-rv=\"sm\">truth\u003c/span> in an interview and said, &quot;I'm the \u003cspan class=\"k-ans\" data-rv=\"sm\">painter\u003c/span>.&quot;\u003c/div>\u003cdiv class=\"k-sk\">Margaret은 거리에서 그림을 그리다가 나중에 Walter와 결혼했어요. Walter가 자기가 화가라고 거짓말해서 그녀는 숨어서 하루 종일 그림만 그렸어요. 몇 년 후, 그녀는 인터뷰에서 진실을 말하며 &quot;내가 그 화가예요&quot;라고 했어요.\u003c/div>\u003c/div>","segs":[{"n":125,"text":"마지막으로 오늘 이야기를 세 문장으로 정리해 볼게요. 빈칸에 들어갈 낱말을 함께 찾아보세요.","hl":null},{"n":126,"text":"Margaret drew pictures on the street and later married Walter. Walter lied that he was the painter, so she hid and painted all day. Years later, she told the truth in an interview and said, \"I'm the painter.\"","hl":"sm","rv":"sm","v":"n"},{"n":127,"text":"Margaret은 거리에서 그림을 그리다가 나중에 Walter와 결혼했어요. Walter가 자기가 화가라고 거짓말해서 그녀는 숨어서 하루 종일 그림만 그렸어요. 몇 년 후, 그녀는 인터뷰에서 진실을 말하며 \"내가 그 화가예요\"라고 했어요.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>Margaret the Painter 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":128,"text":"여러분, 오늘 아주 멋진 이야기를 읽었어요. Margaret은 두려움을 이겨 내고 마침내 진실을 말했어요. 정말 용감했죠? 끝까지 잘 따라와 주어서 고마워요. 다음 시간에 또 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
