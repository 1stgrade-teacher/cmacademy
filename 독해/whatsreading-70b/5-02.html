두 번째, 눈이 와서. 세 번째, 모래여서","hl":"q3"},{"n":115,"text":"정답은 석회석이어서예요.","hl":"q3","rv":"q3"}]},{"html":"\u003cspan class=\"lp-tag\">이야기 요약하기\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-bank\">\u003cspan>Pamukkale\u003c/span>\u003cspan>amazing\u003c/span>\u003cspan>cotton\u003c/span>\u003cspan>limestone\u003c/span>\u003c/div>\u003cdiv class=\"k-sum\" data-hl=\"sm\">My family visited \u003cspan class=\"k-ans\" data-rv=\"sm\">Pamukkale\u003c/span> in Turkey. It looks like white \u003cspan class=\"k-ans\" data-rv=\"sm\">cotton\u003c/span> and it is a World Heritage Site. The floor was hard \u003cspan class=\"k-ans\" data-rv=\"sm\">limestone\u003c/span>, so my feet hurt, but the natural pools were \u003cspan class=\"k-ans\" data-rv=\"sm\">amazing\u003c/span>.\u003c/div>\u003cdiv class=\"k-sk\">우리 가족은 터키의 파묵칼레를 방문했어요. 파묵칼레는 하얀 솜처럼 보이고 세계문화유산이에요. 바닥은 딱딱한 석회석이라 발이 아팠지만, 천연 수영장은 놀라웠어요.\u003c/div>\u003c/div>","segs":[{"n":116,"text":"마지막으로 오늘 이야기를 세 문장으로 정리해 볼게요. 파묵칼레는 솜처럼 하얗고 세계문화유산이지만, 바닥은 석회석이라 딱딱해서 발이 아팠어요. 그래도 천연 수영장은 정말 놀라웠답니다.","hl":null},{"n":117,"text":"My family visited Pamukkale in Turkey. It looks like white cotton and it is a World Heritage Site. The floor was hard limestone, so my feet hurt, but the natural pools were amazing.","hl":"sm","rv":"sm","v":"n"},{"n":118,"text":"우리 가족은 터키의 파묵칼레를 방문했어요. 파묵칼레는 하얀 솜처럼 보이고 세계문화유산이에요. 바닥은 딱딱한 석회석이라 발이 아팠지만, 천연 수영장은 놀라웠어요.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>Amazing Pamukkale 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":119,"text":"여러분, 오늘 정말 열심히 읽고 공부했어요! 하얀 눈처럼 보이는 파묵칼레, 언젠가 진짜로 가 보고 싶지 않나요? 다음 시간에도 신나는 이야기로 만나요. 정말 잘했어요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
