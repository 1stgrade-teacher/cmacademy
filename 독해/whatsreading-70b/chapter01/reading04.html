"text":"She went to the store.","hl":"gx","v":"n","pause":600},{"n":121,"text":"그녀는 상점에 갔어요.","hl":"gx"},{"n":122,"text":"문제를 풀어 볼까요? She 빈칸 flour. 빈칸에 들어갈 말은 buy, 아니면 bought 중에서 무엇일까요?","hl":"gc"},{"n":123,"text":"정답은 bought! She bought flour.","hl":"gc","rv":"gc"}]},{"html":"\u003cspan class=\"lp-tag\">내용 확인 문제\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-qq\" data-hl=\"q0\">\u003ci>1\u003c/i>\u003cdiv>\u003cdiv class=\"q\">암탉은 집 안에서 친구들을 보았어요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q0\">X\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q1\">\u003ci>2\u003c/i>\u003cdiv>\u003cdiv class=\"q\">친구들은 암탉이 피자를 만들 때 도와주지 않았어요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q1\">O\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q2\">\u003ci>3\u003c/i>\u003cdiv>\u003cdiv class=\"q\">암탉이 상점에 간 이유는 무엇인가요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 피자를 먹으려고\u003c/span>\u003cspan>② 밀가루를 사려고\u003c/span>\u003cspan>③ 친구를 만나려고\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q2\">밀가루를 사려고\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q3\">\u003ci>4\u003c/i>\u003cdiv>\u003cdiv class=\"q\">피자를 먹은 뒤 암탉이 친구들에게 부탁한 일은 무엇인가요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 상점에 가기\u003c/span>\u003cspan>② 피자 만들기\u003c/span>\u003cspan>③ 설거지 하기\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q3\">설거지 하기\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":124,"text":"이제 내용을 잘 기억하고 있는지 문제를 풀어 볼까요? 질문을 읽고 지문에서 답을 찾아보세요.","hl":null},{"n":125,"text":"첫 번째 문제. 암탉은 집 안에서 친구들을 보았어요. 맞으면 O, 틀리면 X예요.","hl":"q0"},{"n":126,"text":"정답은 X, 틀려요.","hl":"q0","rv":"q0"},{"n":127,"text":"두 번째 문제. 친구들은 암탉이 피자를 만들 때 도와주지 않았어요. 맞으면 O, 틀리면 X예요.","hl":"q1"},{"n":128,"text":"정답은 O, 맞아요.","hl":"q1","rv":"q1"},{"n":129,"text":"세 번째 문제. 암탉이 상점에 간 이유는 무엇인가요? 첫 번째, 피자를 먹으려고. 두 번째, 밀가루를 사려고. 세 번째, 친구를 만나려고","hl":"q2"},{"n":130,"text":"정답은 밀가루를 사려고예요.","hl":"q2","rv":"q2"},{"n":131,"text":"네 번째 문제. 피자를 먹은 뒤 암탉이 친구들에게 부탁한 일은 무엇인가요? 첫 번째, 상점에 가기. 두 번째, 피자 만들기. 세 번째, 설거지 하기","hl":"q3"},{"n":132,"text":"정답은 설거지 하기예요.","hl":"q3","rv":"q3"}]},{"html":"\u003cspan class=\"lp-tag\">이야기 요약하기\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-bank\">\u003cspan>dishes\u003c/span>\u003cspan>flour\u003c/span>\u003cspan>help\u003c/span>\u003cspan>pizza\u003c/span>\u003c/div>\u003cdiv class=\"k-sum\" data-hl=\"sm\">The hen wanted to make \u003cspan class=\"k-ans\" data-rv=\"sm\">pizza\u003c/span>, but there was no \u003cspan class=\"k-ans\" data-rv=\"sm\">flour\u003c/span>. Her friends did not \u003cspan class=\"k-ans\" data-rv=\"sm\">help\u003c/span>, so she bought flour and made pizza alone. After they ate together, her friends said yes and did the \u003cspan class=\"k-ans\" data-rv=\"sm\">dishes\u003c/span>.\u003c/div>\u003cdiv class=\"k-sk\">암탉은 피자를 만들고 싶었지만 밀가루가 없었어요. 친구들이 도와주지 않아서 암탉이 혼자 밀가루를 사서 피자를 만들었어요. 함께 먹은 뒤 친구들은 설거지를 하겠다고 했어요.\u003c/div>\u003c/div>","segs":[{"n":133,"text":"마지막으로 이야기를 짧게 정리해 볼게요. 암탉은 친구들이 도와주지 않아서 혼자 밀가루를 사고 피자를 만들었고, 함께 먹은 뒤에는 친구들이 설거지를 하겠다고 했어요.","hl":null},{"n":134,"text":"The hen wanted to make pizza, but there was no flour. Her friends did not help, so she bought flour and made pizza alone. After they ate together, her friends said yes and did the dishes.","hl":"sm","rv":"sm","v":"n"},{"n":135,"text":"암탉은 피자를 만들고 싶었지만 밀가루가 없었어요. 친구들이 도와주지 않아서 암탉이 혼자 밀가루를 사서 피자를 만들었어요. 함께 먹은 뒤 친구들은 설거지를 하겠다고 했어요.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>The Hen's Pizza 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":136,"text":"여러분, 오늘 이야기를 끝까지 잘 읽었어요. 암탉처럼 씩씩하게 해내는 모습을 기억해 보세요. 다음에도 재미있는 이야기로 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
