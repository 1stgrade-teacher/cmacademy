inner. Each person likes different toppings, but everyone loves cheese. So I will add more cheese and order the pizza.","hl":"sm","rv":"sm","v":"n"},{"n":113,"text":"오늘 밤 우리 가족은 저녁으로 피자를 먹을 거예요. 사람마다 좋아하는 토핑이 다르지만 모두 치즈를 좋아해요. 그래서 나는 치즈를 더 넣고 피자를 주문할 거예요.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>Pizza for Dinner 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":114,"text":"오늘 여러분은 가족의 취향을 생각하며 피자를 고르는 이야기를 아주 잘 읽었어요. can't와 will도 멋지게 익혔답니다. 다음 시간에도 맛있는 영어 이야기로 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
