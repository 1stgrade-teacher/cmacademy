pan class=\"lp-tag\">내용 확인 문제\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-qq\" data-hl=\"q0\">\u003ci>1\u003c/i>\u003cdiv>\u003cdiv class=\"q\">Paganini는 많은 바이올린 연주 기법을 발명했어요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q0\">O\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q1\">\u003ci>2\u003c/i>\u003cdiv>\u003cdiv class=\"q\">누가 Paganini에게 도전했나요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 또 다른 바이올린 연주자\u003c/span>\u003cspan>② 한 작곡가\u003c/span>\u003cspan>③ Paganini의 친구\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q1\">또 다른 바이올린 연주자\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q2\">\u003ci>3\u003c/i>\u003cdiv>\u003cdiv class=\"q\">Paganini는 한 줄만 남은 바이올린을 보고 연주를 포기했어요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q2\">X\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q3\">\u003ci>4\u003c/i>\u003cdiv>\u003cdiv class=\"q\">Paganini는 결국 어떤 사람으로 불렸나요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 바이올린의 진정한 명인\u003c/span>\u003cspan>② 최고의 작곡가\u003c/span>\u003cspan>③ 아주 빠른 달리기 선수\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q3\">바이올린의 진정한 명인\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":103,"text":"이제 문제를 풀어 볼까요? 글을 다시 떠올리며 맞는지 틀리는지, 알맞은 답을 골라 보세요.","hl":null},{"n":104,"text":"첫 번째 문제. Paganini는 많은 바이올린 연주 기법을 발명했어요. 맞으면 O, 틀리면 X예요.","hl":"q0"},{"n":105,"text":"정답은 O, 맞아요.","hl":"q0","rv":"q0"},{"n":106,"text":"두 번째 문제. 누가 Paganini에게 도전했나요? 첫 번째, 또 다른 바이올린 연주자. 두 번째, 한 작곡가. 세 번째, Paganini의 친구","hl":"q1"},{"n":107,"text":"정답은 또 다른 바이올린 연주자예요.","hl":"q1","rv":"q1"},{"n":108,"text":"세 번째 문제. Paganini는 한 줄만 남은 바이올린을 보고 연주를 포기했어요. 맞으면 O, 틀리면 X예요.","hl":"q2"},{"n":109,"text":"정답은 X, 틀려요.","hl":"q2","rv":"q2"},{"n":110,"text":"네 번째 문제. Paganini는 결국 어떤 사람으로 불렸나요? 첫 번째, 바이올린의 진정한 명인. 두 번째, 최고의 작곡가. 세 번째, 아주 빠른 달리기 선수","hl":"q3"},{"n":111,"text":"정답은 바이올린의 진정한 명인예요.","hl":"q3","rv":"q3"}]},{"html":"\u003cspan class=\"lp-tag\">이야기 요약하기\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-bank\">\u003cspan>perfectly\u003c/span>\u003cspan>skill\u003c/span>\u003cspan>techniques\u003c/span>\u003cspan>violinist\u003c/span>\u003c/div>\u003cdiv class=\"k-sum\" data-hl=\"sm\">Niccolò Paganini was a great \u003cspan class=\"k-ans\" data-rv=\"sm\">violinist\u003c/span>. He invented many violin \u003cspan class=\"k-ans\" data-rv=\"sm\">techniques\u003c/span> and was very proud of his \u003cspan class=\"k-ans\" data-rv=\"sm\">skill\u003c/span>. Even with only one string, he played difficult music \u003cspan class=\"k-ans\" data-rv=\"sm\">perfectly\u003c/span> and was a true master.\u003c/div>\u003cdiv class=\"k-sk\">Niccolò Paganini는 위대한 바이올린 연주자였어요. 그는 많은 바이올린 기법을 발명했고 자신의 실력을 매우 자랑스러워했어요. 단 하나의 줄로도 어려운 음악을 완벽하게 연주했고, 바이올린의 진정한 명인이었어요.\u003c/div>\u003c/div>","segs":[{"n":112,"text":"마지막으로 이야기를 아주 짧게 정리해 볼까요? Paganini가 어떤 연주자였고, 한 줄로 무엇을 보여 주었는지 생각하며 빈칸을 채워 보세요.","hl":null},{"n":113,"text":"Niccolò Paganini was a great violinist. He invented many violin techniques and was very proud of his skill. Even with only one string, he played difficult music perfectly and was a true master.","hl":"sm","rv":"sm","v":"n"},{"n":114,"text":"Niccolò Paganini는 위대한 바이올린 연주자였어요. 그는 많은 바이올린 기법을 발명했고 자신의 실력을 매우 자랑스러워했어요. 단 하나의 줄로도 어려운 음악을 완벽하게 연주했고, 바이올린의 진정한 명인이었어요.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>Niccolò Paganini 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":115,"text":"여러분, 오늘 Niccolò Paganini 이야기를 끝까지 잘 읽었어요. 어려운 상황에서도 포기하지 않고 멋진 연주를 한 Paganini처럼, 여러분도 자신의 재능을 멋지게 보여 주세요. 다음 시간에 또 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
