},{"n":100,"text":"문제를 풀어 볼까요? The bell 빈칸. 빈칸에 들어갈 말은 ring, 아니면 rings 중에서 무엇일까요?","hl":"gc"},{"n":101,"text":"정답은 rings! The bell rings.","hl":"gc","rv":"gc"}]},{"html":"\u003cspan class=\"lp-tag\">내용 확인 문제\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-qq\" data-hl=\"q0\">\u003ci>1\u003c/i>\u003cdiv>\u003cdiv class=\"q\">이 시장은 태국에 있어요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q0\">O\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q1\">\u003ci>2\u003c/i>\u003cdiv>\u003cdiv class=\"q\">기차가 오기 전에 사람들은 물건을 그냥 그대로 둬요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q1\">X\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q2\">\u003ci>3\u003c/i>\u003cdiv>\u003cdiv class=\"q\">기차가 지나가기 전에 무엇이 울리나요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 종\u003c/span>\u003cspan>② 북\u003c/span>\u003cspan>③ 사이렌\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q2\">종\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q3\">\u003ci>4\u003c/i>\u003cdiv>\u003cdiv class=\"q\">방문자들은 기차가 올 때 무엇을 하나요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 멈춰 서서 기다려요\u003c/span>\u003cspan>② 뛰어가며 소리쳐요\u003c/span>\u003cspan>③ 물건을 사러 가요\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q3\">멈춰 서서 기다려요\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":102,"text":"이제 문제를 풀어 볼까요? 지문에서 답을 찾아보면 어렵지 않아요. 하나씩 천천히 확인해 보세요.","hl":null},{"n":103,"text":"첫 번째 문제. 이 시장은 태국에 있어요. 맞으면 O, 틀리면 X예요.","hl":"q0"},{"n":104,"text":"정답은 O, 맞아요.","hl":"q0","rv":"q0"},{"n":105,"text":"두 번째 문제. 기차가 오기 전에 사람들은 물건을 그냥 그대로 둬요. 맞으면 O, 틀리면 X예요.","hl":"q1"},{"n":106,"text":"정답은 X, 틀려요.","hl":"q1","rv":"q1"},{"n":107,"text":"세 번째 문제. 기차가 지나가기 전에 무엇이 울리나요? 첫 번째, 종. 두 번째, 북. 세 번째, 사이렌","hl":"q2"},{"n":108,"text":"정답은 종예요.","hl":"q2","rv":"q2"},{"n":109,"text":"네 번째 문제. 방문자들은 기차가 올 때 무엇을 하나요? 첫 번째, 멈춰 서서 기다려요. 두 번째, 뛰어가며 소리쳐요. 세 번째, 물건을 사러 가요","hl":"q3"},{"n":110,"text":"정답은 멈춰 서서 기다려요예요.","hl":"q3","rv":"q3"}]},{"html":"\u003cspan class=\"lp-tag\">이야기 요약하기\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-bank\">\u003cspan>Thailand\u003c/span>\u003cspan>make way\u003c/span>\u003cspan>special\u003c/span>\u003cspan>train\u003c/span>\u003c/div>\u003cdiv class=\"k-sum\" data-hl=\"sm\">Maeklong Railway Market is a \u003cspan class=\"k-ans\" data-rv=\"sm\">special\u003c/span> market in \u003cspan class=\"k-ans\" data-rv=\"sm\">Thailand\u003c/span>. A \u003cspan class=\"k-ans\" data-rv=\"sm\">train\u003c/span> goes right through the market. When a bell rings, people \u003cspan class=\"k-ans\" data-rv=\"sm\">make way\u003c/span> for the train.\u003c/div>\u003cdiv class=\"k-sk\">Maeklong 기찻길 시장은 태국에 있는 특별한 시장이에요. 기차가 시장 한가운데를 지나가요. 종이 울리면 사람들이 기차가 지나가도록 길을 비켜 줘요.\u003c/div>\u003c/div>","segs":[{"n":111,"text":"마지막으로 오늘 이야기를 세 문장으로 정리해 볼게요. 기차가 시장을 지나가고, 종이 울리면 사람들이 길을 비켜 준다는 것을 꼭 기억해요.","hl":null},{"n":112,"text":"Maeklong Railway Market is a special market in Thailand. A train goes right through the market. When a bell rings, people make way for the train.","hl":"sm","rv":"sm","v":"n"},{"n":113,"text":"Maeklong 기찻길 시장은 태국에 있는 특별한 시장이에요. 기차가 시장 한가운데를 지나가요. 종이 울리면 사람들이 기차가 지나가도록 길을 비켜 줘요.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>A Special Market 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":114,"text":"여러분, 오늘 아주 멋진 시장 이야기를 읽었어요. 기차가 와도 척척 물건을 옮기는 사람들처럼, 여러분도 오늘 배운 can과 s 규칙을 잘 기억해 주세요. 정말 잘했어요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
