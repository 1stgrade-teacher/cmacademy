div>\u003cdiv class=\"o\">\u003cspan>① 왕\u003c/span>\u003cspan>② Margherita 왕비\u003c/span>\u003cspan>③ 요리사\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q2\">Margherita 왕비\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q3\">\u003ci>4\u003c/i>\u003cdiv>\u003cdiv class=\"q\">그 피자에 들어 있지 않은 것은 무엇인가요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 빨간 토마토\u003c/span>\u003cspan>② 하얀 치즈\u003c/span>\u003cspan>③ 노란 옥수수\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q3\">노란 옥수수\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":88,"text":"이제 문제를 풀어 볼까요? 답은 모두 오늘 읽은 지문 안에 있어요. 틀려도 괜찮으니 지문을 다시 찾아보며 함께 풀어 봐요.","hl":null},{"n":89,"text":"첫 번째 문제. 가난한 사람들이 빵 위에 치즈를 얹어 피자가 시작되었어요. 맞으면 O, 틀리면 X예요.","hl":"q0"},{"n":90,"text":"정답은 X, 틀려요.","hl":"q0","rv":"q0"},{"n":91,"text":"두 번째 문제. 새 피자는 이탈리아 국기처럼 보였어요. 맞으면 O, 틀리면 X예요.","hl":"q1"},{"n":92,"text":"정답은 O, 맞아요.","hl":"q1","rv":"q1"},{"n":93,"text":"세 번째 문제. 요리사가 누구를 위해 'Margherita' 피자를 만들었나요? 첫 번째, 왕. 두 번째, Margherita 왕비. 세 번째, 요리사","hl":"q2"},{"n":94,"text":"정답은 Margherita 왕비예요.","hl":"q2","rv":"q2"},{"n":95,"text":"네 번째 문제. 그 피자에 들어 있지 않은 것은 무엇인가요? 첫 번째, 빨간 토마토. 두 번째, 하얀 치즈. 세 번째, 노란 옥수수","hl":"q3"},{"n":96,"text":"정답은 노란 옥수수예요.","hl":"q3","rv":"q3"}]},{"html":"\u003cspan class=\"lp-tag\">이야기 요약하기\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-bank\">\u003cspan>flag\u003c/span>\u003cspan>popular\u003c/span>\u003cspan>queen\u003c/span>\u003cspan>tomatoes\u003c/span>\u003c/div>\u003cdiv class=\"k-sum\" data-hl=\"sm\">Long ago in Italy, poor people put \u003cspan class=\"k-ans\" data-rv=\"sm\">tomatoes\u003c/span> on flatbread. A cook made a new pizza for the \u003cspan class=\"k-ans\" data-rv=\"sm\">queen\u003c/span>, and it had red, white, and green colors like the \u003cspan class=\"k-ans\" data-rv=\"sm\">flag\u003c/span>. The queen loved it, so it became \u003cspan class=\"k-ans\" data-rv=\"sm\">popular\u003c/span> as Pizza Margherita.\u003c/div>\u003cdiv class=\"k-sk\">오래 전 이탈리아에서 가난한 사람들이 납작한 빵 위에 토마토를 얹었어요. 요리사가 왕비를 위해 새로운 피자를 만들었고, 그 피자는 국기처럼 빨강, 하양, 초록색이었어요. 왕비가 아주 좋아해서 'Margherita 피자'로 인기를 얻었어요.\u003c/div>\u003c/div>","segs":[{"n":97,"text":"마지막으로 오늘 이야기를 세 문장으로 줄여 볼게요. 빈칸에 들어갈 낱말을 떠올리며 함께 읽어 봐요.","hl":null},{"n":98,"text":"Long ago in Italy, poor people put tomatoes on flatbread. A cook made a new pizza for the queen, and it had red, white, and green colors like the flag. The queen loved it, so it became popular as Pizza Margherita.","hl":"sm","rv":"sm","v":"n"},{"n":99,"text":"오래 전 이탈리아에서 가난한 사람들이 납작한 빵 위에 토마토를 얹었어요. 요리사가 왕비를 위해 새로운 피자를 만들었고, 그 피자는 국기처럼 빨강, 하양, 초록색이었어요. 왕비가 아주 좋아해서 'Margherita 피자'로 인기를 얻었어요.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>The First Pizza 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":100,"text":"여러분, 오늘 정말 열심히 읽었어요! 이제 여러분은 피자가 어떻게 시작되었는지, 그리고 Margherita 피자의 비밀도 알게 되었어요. 다음 시간에도 재미있는 이야기로 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
