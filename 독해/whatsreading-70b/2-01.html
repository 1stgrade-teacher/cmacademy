 더 예뻤기 때문이에요. 세 번째, 친구들이 학교 앞에서 기다려 주었기 때문이에요","hl":"q2"},{"n":130,"text":"정답은 바지가 더 편해서 빨리 걸을 수 있었어요예요.","hl":"q2","rv":"q2"},{"n":131,"text":"네 번째 문제. 이야기 마지막에 Anne이 놀란 까닭은 무엇인가요? 첫 번째, 모두가 바지를 입고 있었기 때문이에요. 두 번째, 선생님이 크게 화를 냈기 때문이에요. 세 번째, 자기가 바지를 잃어버렸기 때문이에요","hl":"q3"},{"n":132,"text":"정답은 모두가 바지를 입고 있었기 때문이에요예요.","hl":"q3","rv":"q3"}]},{"html":"\u003cspan class=\"lp-tag\">이야기 요약하기\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-bank\">\u003cspan>dresses\u003c/span>\u003cspan>everyone\u003c/span>\u003cspan>pants\u003c/span>\u003c/div>\u003cdiv class=\"k-sum\" data-hl=\"sm\">Long ago, girls only wore \u003cspan class=\"k-ans\" data-rv=\"sm\">dresses\u003c/span>. Anne wanted \u003cspan class=\"k-ans\" data-rv=\"sm\">pants\u003c/span>, so she wore them to school. People were surprised at first, but soon \u003cspan class=\"k-ans\" data-rv=\"sm\">everyone\u003c/span> was wearing pants.\u003c/div>\u003cdiv class=\"k-sk\">오래 전에 여자아이들은 원피스만 입었어요. Anne은 바지를 입고 싶어서 학교에 입고 갔어요. 사람들은 처음에 놀랐지만 곧 모두가 바지를 입고 있었어요.\u003c/div>\u003c/div>","segs":[{"n":133,"text":"마지막으로 오늘 이야기를 세 문장으로 정리해 볼게요. 빈칸에 들어갈 낱말을 떠올리면서 읽어 보세요.","hl":null},{"n":134,"text":"Long ago, girls only wore dresses. Anne wanted pants, so she wore them to school. People were surprised at first, but soon everyone was wearing pants.","hl":"sm","rv":"sm","v":"n"},{"n":135,"text":"오래 전에 여자아이들은 원피스만 입었어요. Anne은 바지를 입고 싶어서 학교에 입고 갔어요. 사람들은 처음에 놀랐지만 곧 모두가 바지를 입고 있었어요.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>Pants for Change! 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":136,"text":"여러분, 오늘 정말 잘했어요! Anne처럼 다르게 생각하는 용기가 세상을 조금씩 바꾼다는 걸 꼭 기억해요. 다음 시간에 또 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
