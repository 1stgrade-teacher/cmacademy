cspan class=\"lp-tag\">문법을 그림으로\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-gt\">\u003cspan>🏅\u003c/span>있어요 There are\u003c/div>\u003cdiv data-hl=\"gb\">\u003cdiv class=\"gblk\">\u003cdiv class=\"gb r-be\">\u003cspan class=\"gt\">~이에요\u003c/span>\u003cspan class=\"ge\">There are\u003c/span>\u003cspan class=\"gk\">있어요\u003c/span>\u003c/div>\u003cdiv class=\"gb r-extra\">\u003cspan class=\"gt\">더하기\u003c/span>\u003cspan class=\"ge\">Summer and Winter\u003c/span>\u003cspan class=\"gk\">여름과 겨울\u003c/span>\u003c/div>\u003cdiv class=\"gb r-who\">\u003cspan class=\"gt\">누가\u003c/span>\u003cspan class=\"ge\">Paralympic Games\u003c/span>\u003cspan class=\"gk\">패럴림픽대회가\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cdiv data-hl=\"gp\">\u003cdiv class=\"gpic\">\u003cdiv class=\"gpt\">하나 vs 여러 개\u003c/div>\u003cdiv class=\"gpr\">\u003cdiv class=\"gpi\">\u003cdiv class=\"pe\">🏅\u003c/div>\u003cdiv class=\"pn\">There is a game.\u003c/div>\u003cdiv class=\"pk\">경기가 하나 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"gpi\">\u003cdiv class=\"pe\">🏅🏅\u003c/div>\u003cdiv class=\"pn\">There are games.\u003c/div>\u003cdiv class=\"pk\">경기가 여러 개 있어요.\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"k-ez\" data-hl=\"ge\">'~이 있어요'라고 말할 때 There are를 써요. 여러 개가 있을 때는 There are, 딱 하나일 때는 There is를 써요.\u003c/div>\u003c/div>","segs":[{"n":86,"text":"두 번째 문법은 There are예요. 무엇이 여러 개 있다고 말할 때 써요. 대표 문장 There are Summer and Winter Paralympic Games를 나눠 보면, There are는 '있어요', Summer and Winter는 '여름과 겨울', Paralympic Games는 '패럴림픽대회'예요. 하나일 때는 There is, 여러 개일 때는 There are라고 꼭 기억해요!","hl":"gb"},{"n":87,"text":"'~이 있어요'라고 말할 때 There are를 써요. 여러 개가 있을 때는 There are, 딱 하나일 때는 There is를 써요.","hl":"ge"}]},{"html":"\u003cspan class=\"lp-tag\">확인해요\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-gt\">\u003cspan>🏅\u003c/span>있어요 There are\u003c/div>\u003cdiv class=\"k-ex\" data-hl=\"gx\">\u003cdiv>\u003cspan class=\"e\">🐱\u003c/span>\u003cb>There are two cats.\u003c/b>\u003csm span>\u003cspan>③ 5천 명\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q3\">5억 명\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":95,"text":"이제 문제를 풀어 볼까요? 답은 꼭 지문 안에서 찾아보세요.","hl":null},{"n":96,"text":"첫 번째 문제. 패럴림픽대회는 올림픽대회가 끝나기 전에 시작해요. 맞으면 O, 틀리면 X예요.","hl":"q0"},{"n":97,"text":"정답은 X, 틀려요.","hl":"q0","rv":"q0"},{"n":98,"text":"두 번째 문제. 패럴림픽대회에는 여름 대회와 겨울 대회가 있어요. 맞으면 O, 틀리면 X예요.","hl":"q1"},{"n":99,"text":"정답은 O, 맞아요.","hl":"q1","rv":"q1"},{"n":100,"text":"세 번째 문제. 패럴림픽대회 선수들은 무엇을 가지고 있나요? 첫 번째, 장애. 두 번째, 날개. 세 번째, 자동차","hl":"q2"},{"n":101,"text":"정답은 장애예요.","hl":"q2","rv":"q2"},{"n":102,"text":"네 번째 문제. 패럴림픽대회는 몇 명의 장애인에게 용기를 주나요? 첫 번째, 5백만 명. 두 번째, 5억 명. 세 번째, 5천 명","hl":"q3"},{"n":103,"text":"정답은 5억 명예요.","hl":"q3","rv":"q3"}]},{"html":"\u003cspan class=\"lp-tag\">이야기 요약하기\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-bank\">\u003cspan>Olympic Games\u003c/span>\u003cspan>Paralympic Games\u003c/span>\u003cspan>courage\u003c/span>\u003cspan>disabilities\u003c/span>\u003c/div>\u003cdiv class=\"k-sum\" data-hl=\"sm\">The \u003cspan class=\"k-ans\" data-rv=\"sm\">Paralympic Games\u003c/span> start after the \u003cspan class=\"k-ans\" data-rv=\"sm\">Olympic Games\u003c/span>. The players have \u003cspan class=\"k-ans\" data-rv=\"sm\">disabilities\u003c/span>, but they can play sports. They give \u003cspan class=\"k-ans\" data-rv=\"sm\">courage\u003c/span> to many people.\u003c/div>\u003cdiv class=\"k-sk\">패럴림픽대회는 올림픽대회가 끝난 뒤에 시작해요. 선수들은 장애가 있지만 운동을 할 수 있어요. 그들은 많은 사람에게 용기를 줘요.\u003c/div>\u003c/div>","segs":[{"n":104,"text":"마지막으로 오늘 이야기를 세 문장으로 줄여 볼게요. 빈칸에 들어갈 낱말을 함께 찾아봐요.","hl":null},{"n":105,"text":"The Paralympic Games start after the Olympic Games. The players have disabilities, but they can play sports. They give courage to many people.","hl":"sm","rv":"sm","v":"n"},{"n":106,"text":"패럴림픽대회는 올림픽대회가 끝난 뒤에 시작해요. 선수들은 장애가 있지만 운동을 할 수 있어요. 그들은 많은 사람에게 용기를 줘요.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>Games for Everyone 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":107,"text":"여러분, 오늘 정말 잘했어요! 패럴림픽대회는 모두를 위한 멋진 대회라는 것, 그리고 can과 There are도 꼭 기억해요. 다음 시간에 또 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
