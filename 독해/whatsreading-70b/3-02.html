>\u003cdiv class=\"q\">We \u003cspan class=\"k-ans\" data-rv=\"gc\">cheered\u003c/span> for our team.\u003c/div>\u003csmall>우리는 우리 팀을 응원했어요.\u003c/small>\u003cdiv class=\"o\">\u003cspan class=\"k-right\" data-rv=\"gc\">cheered\u003c/span>\u003cspan>cheer\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":87,"text":"예문을 더 볼까요?","hl":"gx"},{"n":88,"text":"We played soccer.","hl":"gx","v":"n","pause":600},{"n":89,"text":"우리는 축구를 했어요.","hl":"gx"},{"n":90,"text":"She cleaned her room.","hl":"gx","v":"n","pause":600},{"n":91,"text":"그녀는 방을 청소했어요.","hl":"gx"},{"n":92,"text":"문제를 풀어 볼까요? We 빈칸 for our team. 빈칸에 들어갈 말은 cheered, 아니면 cheer 중에서 무엇일까요?","hl":"gc"},{"n":93,"text":"정답은 cheered! We cheered for our team.","hl":"gc","rv":"gc"}]},{"html":"\u003cspan class=\"lp-tag\">내용 확인 문제\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-qq\" data-hl=\"q0\">\u003ci>1\u003c/i>\u003cdiv>\u003cdiv class=\"q\">오늘은 운동회 날이었어요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q0\">O\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q1\">\u003ci>2\u003c/i>\u003cdiv>\u003cdiv class=\"q\">우리 반은 청팀이었어요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q1\">X\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q2\">\u003ci>3\u003c/i>\u003cdiv>\u003cdiv class=\"q\">우리 팀은 릴레이 경주에서 몇 등을 했나요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 1등\u003c/span>\u003cspan>② 2등\u003c/span>\u003cspan>③ 3등\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q2\">1등\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q3\">\u003ci>4\u003c/i>\u003cdiv>\u003cdiv class=\"q\">최고의 응원상을 받은 팀은 어디인가요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 백팀\u003c/span>\u003cspan>② 청팀\u003c/span>\u003cspan>③ 홍팀\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q3\">청팀\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":94,"text":"이제 문제를 풀어 볼까요? 문장을 다시 찾아보면 답이 보여요.","hl":null},{"n":95,"text":"첫 번째 문제. 오늘은 운동회 날이었어요. 맞으면 O, 틀리면 X예요.","hl":"q0"},{"n":96,"text":"정답은 O, 맞아요.","hl":"q0","rv":"q0"},{"n":97,"text":"두 번째 문제. 우리 반은 청팀이었어요. 맞으면 O, 틀리면 X예요.","hl":"q1"},{"n":98,"text":"정답은 X, 틀려요.","hl":"q1","rv":"q1"},{"n":99,"text":"세 번째 문제. 우리 팀은 릴레이 경주에서 몇 등을 했나요? 첫 번째, 1등. 두 번째, 2등. 세 번째, 3등","hl":"q2"},{"n":100,"text":"정답은 1등예요.","hl":"q2","rv":"q2"},{"n":101,"text":"네 번째 문제. 최고의 응원상을 받은 팀은 어디인가요? 첫 번째, 백팀. 두 번째, 청팀. 세 번째, 홍팀","hl":"q3"},{"n":102,"text":"정답은 청팀예요.","hl":"q3","rv":"q3"}]},{"html":"\u003cspan class=\"lp-tag\">이야기 요약하기\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-bank\">\u003cspan>Sports Day\u003c/span>\u003cspan>White team\u003c/span>\u003cspan>everyone\u003c/span>\u003cspan>first\u003c/span>\u003c/div>\u003cdiv class=\"k-sum\" data-hl=\"sm\">Today was \u003cspan class=\"k-ans\" data-rv=\"sm\">Sports Day\u003c/span>. My class was the \u003cspan class=\"k-ans\" data-rv=\"sm\">White team\u003c/span> and we lost the soccer final, but we came in \u003cspan class=\"k-ans\" data-rv=\"sm\">first\u003c/span> in the relay race. Everyone cheered and \u003cspan class=\"k-ans\" data-rv=\"sm\">everyone\u003c/span> was a winner!\u003c/div>\u003cdiv class=\"k-sk\">오늘은 운동회 날이었어요. 우리 반은 백팀이었고 축구 결승전에서는 졌지만 릴레이 경주에서는 일 등을 했어요. 모두 응원했고 모두가 우승자였어요!\u003c/div>\u003c/div>","segs":[{"n":103,"text":"요약에서는 오늘의 운동회와 우리 반의 결과, 그리고 모두가 우승자였다는 점을 기억하면 돼요.","hl":null},{"n":104,"text":"Today was Sports Day. My class was the White team and we lost the soccer final, but we came in first in the relay race. Everyone cheered and everyone was a winner!","hl":"sm","rv":"sm","v":"n"},{"n":105,"text":"오늘은 운동회 날이었어요. 우리 반은 백팀이었고 축구 결승전에서는 졌지만 릴레이 경주에서는 일 등을 했어요. 모두 응원했고 모두가 우승자였어요!","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>Who is the Winner? 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":106,"text":"오늘 이야기에서 운동회의 즐거움과 함께 모두가 winner가 될 수 있다는 것을 배웠어요. 여러분도 친구들과 함께라면 모두 winner예요. 정말 잘했어요!","hl":null}]}]});</script><script
