ass=\"k-ex\" data-hl=\"gx\">\u003cdiv>\u003cspan class=\"e\">🏊\u003c/span>\u003cb>I can swim.\u003c/b>\u003csmall>나는 수영할 수 있어요.\u003c/small>\u003c/div>\u003cdiv>\u003cspan class=\"e\">🕊️\u003c/span>\u003cb>He can't fly.\u003c/b>\u003csmall>그는 날 수 없어요.\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"k-ck\" data-hl=\"gc\">\u003cdiv class=\"q\">Fish \u003cspan class=\"k-ans\" data-rv=\"gc\">can't\u003c/span> fly.\u003c/div>\u003csmall>물고기는 날 수 없어요.\u003c/small>\u003cdiv class=\"o\">\u003cspan>can\u003c/span>\u003cspan class=\"k-right\" data-rv=\"gc\">can't\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":82,"text":"예문을 더 볼까요?","hl":"gx"},{"n":83,"text":"I can swim.","hl":"gx","v":"n","pause":600},{"n":84,"text":"나는 수영할 수 있어요.","hl":"gx"},{"n":85,"text":"He can't fly.","hl":"gx","v":"n","pause":600},{"n":86,"text":"그는 날 수 없어요.","hl":"gx"},{"n":87,"text":"문제를 풀어 볼까요? Fish 빈칸 fly. 빈칸에 들어갈 말은 can, 아니면 can't 중에서 무엇일까요?","hl":"gc"},{"n":88,"text":"정답은 can't! Fish can't fly.","hl":"gc","rv":"gc"}]},{"html":"\u003cspan class=\"lp-tag\">문법을 그림으로\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-gt\">\u003cspan>⏪\u003c/span>옛날 일엔 -ed를 붙여요\u003c/div>\u003cdiv data-hl=\"gb\">\u003cdiv class=\"gblk\">\u003cdiv class=\"gb r-who\">\u003cspan class=\"gt\">누가\u003c/span>\u003cspan class=\"ge\">The first Olympic Games\u003c/span>\u003cspan class=\"gk\">첫 번째 올림픽 대회는\u003c/span>\u003c/div>\u003cdiv class=\"gb r-do\">\u003cspan class=\"gt\">~해요\u003c/span>\u003cspan class=\"ge\">started\u003c/span>\u003cspan class=\"gk\">시작되었어요\u003c/span>\u003c/div>\u003cdiv class=\"gb r-when\">\u003cspan class=\"gt\">언제\u003c/span>\u003cspan class=\"ge\">in 776 B.C.\u003c/span>\u003cspan class=\"gk\">기원전 776년에\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cdiv data-hl=\"gp\">\u003cdiv class=\"gpic\">\u003cdiv class=\"gpt\">동사가 과거로 변신!\u003c/div>\u003cdiv class=\"gpr\">\u003cdiv class=\"gpi\">\u003cdiv class=\"pe\">▶️\u003c/div>\u003cdiv class=\"pn\">start\u003c/div>\u003cdiv class=\"pk\">지금 시작해요\u003c/div>\u003c/div>\u003cspan class=\"gar\">➜\u003c/span>\u003cdiv class=\"gpi\">\u003cdiv class=\"pe\">⏪\u003c/div>\u003cdiv class=\"pn\">started\u003c/div>\u003cdiv class=\"pk\">과거 — -ed를 붙여요\u003c/div>\u003c/div>\u003cspan class=\"gar\">➜\u003c/span>\u003cdiv class=\"gpi\">\u003cdiv class=\"pe\">🔁\u003c/div>\u003cdiv class=\"pn\">changed\u003c/div>\u003cdiv class=\"pk\">과거 — change에 d만 붙여요\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"k-ez\" data-hl=\"ge\">이미 지나간 옛날 일은 동사 뒤에 -ed를 붙여서 말해요. start는 '시작해요'인데 \u003cb class=\"key\">started\u003c/b>는 '시작했어요'가 돼요. 그래서 첫 번째 올림픽 대회가 언제 시작되었는지 말할 수 있답니다.\u003c/div>\u003c/div>","segs":[{"n":89,"text":"이번에는 옛날 일을 말하는 방법을 배워 볼게요. 이미 지나간 일은 동사 뒤에 -ed를 붙여서 말해요. The first Olympic Games는 '첫 번째 올림픽 대회는', started는 '시작되었어요'라는 뜻이에요. 맨 뒤에 붙은 덩어리는 그 일이 언제 일어났는지 알려 주는 말이랍니다. start에 -ed를 붙이면 started, change에 d를 붙이면 changed가 돼요. 아주 쉽죠?","hl":"gb"},{"n":90,"text":"이미 지나간 옛날 일은 동사 뒤에 -ed를 붙여서 말해요. start는 '시작해요'인데 started는 '시작했어요'가 돼요. 그래서 첫 번째 올림픽 대회가 언제 시작되었는지 말할 수 있답니다.","hl":"ge"}]},{"html":"\u003cspan class=\"lp-tag\">확인해요\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-gt\">\u003cspan>⏪\u003c/span>옛날 일엔 -ed를 붙여요\u003c/div>\u003cdiv class=\"k-ex\" data-hl=\"gx\">\u003cdiv>\u003cspan class=\"e\">⚽\u003c/span>\u003cb>We played soccer yesterday.\u003c/b>\u003csmall>우리는 어제 축구를 했어요.\u003c/small>\u003c/div>\u003cdiv>\u003cspan class=\"e\">📺\u003c/span>\u003cb>She watched TV last night.\u003c/b>\u003csmall>그녀는 어젯밤 TV를 봤어요.\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"k-ck\" data-hl=\"gc\">\u003cdiv class=\"q\">The game \u003cspan class=\"k-ans\" data-rv=\"gc\">started\u003c/span> two hours ago.\u003c/div>\u003csmall>그 경기는 두 시간 전에 시작되었어요.\u003c/small>\u003cdiv class=\"o\">\u003cspan>start\u003c/span>\u003cspan class=\"k-right\" data-rv=\"gc\">started\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":91,"text":"예문을 더 볼까요?","hl":"gx"},{"n":92,"text":"We played soccer yesterday.","hl":"gx","v":"n","pause":600},{"n":93,"text":"우리는 어제 축구를 했어요.","hl":"gx"},{"n":94,"text":"She watched TV last night.","hl":"gx","v":"n","pause":600},{"n":95,"text":"그녀는 어젯밤 TV를 봤어요.","hl":"gx"},{"n":96,"text":"문제를 풀어 볼까요? The game 빈칸 two hours ago. 빈칸에 들어갈 말은 start, 아니면 started 중에서 무엇일까요?","hl":"gc"},{"n":97,"text":"정답은 started! The game started two hours ago.","hl":"gc","rv":"gc"}]},{"html":"\u003cspan class=\"lp-tag\">내용 확인 문제\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-qq\" data-hl=\"q0\">\u003ci>1\u003c/i>\u003cdiv>\u003cdiv class=\"q\">첫 번째 올림픽 대회는 기원전 776년에 시작되었어요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q0\">O\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q1\">\u003ci>2\u003c/i>\u003cdiv>\u003cdiv class=\"q\">사람들은 올림픽 축제를 2년마다 열었어요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q1\">X\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q2\">\u003ci>3\u003c/i>\u003cdiv>\u003cdiv class=\"q\">올림픽 대회를 다시 가져오고 싶어 했던 사람은 누구인가요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① Pierre Coubertin\u003c/span>\u003cspan>② 여자 선수들\u003c/span>\u003cspan>③ 그리스 사람들\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q2\">Pierre Coubertin\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q3\">\u003ci>4\u003c/i>\u003cdiv>\u003cdiv class=\"q\">올림픽 대회가 다시 시작된 때는 언제인가요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 776 B.C.\u003c/span>\u003cspan>② 394 A.D.\u003c/span>\u003cspan>③ 1896\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q3\">1896\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":98,"text":"이제 문제를 풀어 볼까요? 지문을 다시 보면서 답을 찾아보세요. 답이 되는 문장을 손가락으로 짚어 보면 더 좋아요.","hl":null},{"n":99,"text":"첫 번째 문제. 첫 번째 올림픽 대회는 기원전 776년에 시작되었어요. 맞으면 O, 틀리면 X예요.","hl":"q0"},{"n":100,"text":"정답은 O, 맞아요.","hl":"q0","rv":"q0"},{"n":101,"text":"두 번째 문제. 사람들은 올림픽 축제를 2년마다 열었어요. 맞으면 O, 틀리면 X예요.","hl":"q1"},{"n":102,"text":"정답은 X, 틀려요.","hl":"q1","rv":"q1"},{"n":103,"text":"세 번째 문제. 올림픽 대회를 다시 가져오고 싶어 했던 사람은 누구인가요? 첫 번째, Pierre Coubertin. 두 번째, 여자 선수들. 세 번째, 그리스 사람들","hl":"q2"},{"n":104,"text":"정답은 Pierre Coubertin예요.","hl":"q2","rv":"q2"},{"n":105,"text":"네 번째 문제. 올림픽 대회가 다시 시작된 때는 언제인가요? 첫 번째, 776 B.C.. 두 번째, 394 A.D.. 세 번째, 1896","hl":"q3"},{"n":106,"text":"정답은 1896예요.","hl":"q3","rv":"q3"}]},{"html":"\u003cspan class=\"lp-tag\">이야기 요약하기\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-bank\">\u003cspan>1896\u003c/span>\u003cspan>festival\u003c/span>\u003cspan>play\u003c/span>\u003cspan>stopped\u003c/span>\u003c/div>\u003cdiv class=\"k-sum\" data-hl=\"sm\">The Olympic Games are an important \u003cspan class=\"k-ans\" data-rv=\"sm\">festival\u003c/span>. They started long ago, \u003cspan class=\"k-ans\" data-rv=\"sm\">stopped\u003c/span> for a while, and started again in \u003cspan class=\"k-ans\" data-rv=\"sm\">1896\u003c/span>. Now everyone can \u003cspan class=\"k-ans\" data-rv=\"sm\">play\u003c/span>, and there are also winter games.\u003c/div>\u003cdiv class=\"k-sk\">올림픽 대회는 중요한 축제예요. 아주 오래전에 시작해서 한동안 중단되었다가 1896년에 다시 시작되었어요. 지금은 모두가 참가할 수 있고, 겨울 대회도 있어요.\u003c/div>\u003c/div>","segs":[{"n":107,"text":"마지막으로 오늘 읽은 이야기를 세 문장으로 정리해 볼게요. 빈칸에 들어갈 낱말을 함께 찾아보세요.","hl":null},{"n":108,"text":"The Olympic Games are an important festival. They started long ago, stopped for a while, and started again in 1896. Now everyone can play, and there are also winter games.","hl":"sm","rv":"sm","v":"n"},{"n":109,"text":"올림픽 대회는 중요한 축제예요. 아주 오래전에 시작해서 한동안 중단되었다가 1896년에 다시 시작되었어요. 지금은 모두가 참가할 수 있고, 겨울 대회도 있어요.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>The Olympic Games 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":110,"text":"여러분, 오늘 정말 잘했어요! 올림픽이 어떻게 시작되고, 멈추고, 다시 살아났는지 잘 알게 되었네요. 다음 시간에도 재미있는 이야기로 만나요. 안녕!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
