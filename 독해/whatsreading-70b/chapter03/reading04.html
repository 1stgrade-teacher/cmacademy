 class=\"k-sl\">\u003cdiv class=\"k-mb\" data-hl=\"p0\">\u003cspan class=\"e\">🏳️\u003c/span>\u003cspan class=\"l\">문단 1\u003c/span>\u003cspan class=\"t\">올림픽기는 흰 바탕에 다섯 개의 \u003cb class=\"key\">고리\u003c/b>가 있고, Pierre Coubertin이 손으로 디자인했어요.\u003c/span>\u003c/div>\u003cdiv class=\"k-mb\" data-hl=\"p1\">\u003cspan class=\"e\">🌍\u003c/span>\u003cspan class=\"l\">문단 2\u003c/span>\u003cspan class=\"t\">다섯 고리는 세계의 다섯 \u003cb class=\"key\">지역\u003c/b>을 뜻하고, Coubertin은 고리에 다섯 가지 색을 사용했어요.\u003c/span>\u003c/div>\u003cdiv class=\"k-mb\" data-hl=\"p2\">\u003cspan class=\"e\">🌈\u003c/span>\u003cspan class=\"l\">문단 3\u003c/span>\u003cspan class=\"t\">여섯 가지 색을 고른 까닭은 모든 나라의 \u003cb class=\"key\">국기\u003c/b>에 그중 적어도 하나가 들어 있기 때문이에요.\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":75,"text":"첫 번째 문단에서는 Olympic flag가 흰 바탕에 다섯 rings를 가지고 있고 Coubertin이 손으로 디자인한 사실을 읽어요. 두 번째 문단에서는 다섯 rings가 세계의 다섯 지역을 뜻하며 다섯 가지 색을 사용했다는 것을 알아요. 세 번째 문단에서는 여섯 가지 색을 고른 까닭이 모든 나라의 flag에 그중 하나가 있기 때문이라는 점을 확인해요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">문법을 그림으로\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-gt\">\u003cspan>⏳\u003c/span>지난 일은 이렇게 말해요\u003c/div>\u003cdiv data-hl=\"gb\">\u003cdiv class=\"gblk\">\u003cdiv class=\"gb r-who\">\u003cspan class=\"gt\">누가\u003c/span>\u003cspan class=\"ge\">Pierre Coubertin\u003c/span>\u003cspan class=\"gk\">피에르 쿠베르탱은\u003c/span>\u003c/div>\u003cdiv class=\"gb r-do\">\u003cspan class=\"gt\">~해요\u003c/span>\u003cspan class=\"ge\">designed\u003c/span>\u003cspan class=\"gk\">디자인했어요\u003c/span>\u003c/div>\u003cdiv class=\"gb r-what\">\u003cspan class=\"gt\">무엇을\u003c/span>\u003cspan class=\"ge\">the flag\u003c/span>\u003cspan class=\"gk\">그 깃발을\u003c/span>\u003c/div>\u003cdiv class=\"gb r-when\">\u003cspan class=\"gt\">언제\u003c/span>\u003cspan class=\"ge\">in 1913\u003c/span>\u003cspan class=\"gk\">천구백십삼 년에\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cdiv data-hl=\"gp\">\u003cdiv class=\"gpic\">\u003cdiv class=\"gpt\">지난 일의 모양\u003c/div>\u003cdiv class=\"gpr\">\u003cdiv class=\"gpi\">\u003cdiv class=\"pe\">✏️\u003c/div>\u003cdiv class=\"pn\">design → designed\u003c/div>\u003cdiv class=\"pk\">보통은 -ed를 붙여요\u003c/div>\u003c/div>\u003cspan class=\"gar\">➜\u003c/span>\u003cdiv class=\"gpi\">\u003cdiv class=\"pe\">🎨\u003c/div>\u003cdiv class=\"pn\">draw → drew\u003c/div>\u003cdiv class=\"pk\">모양이 달라져요\u003c/div>\u003c/div>\u003cspan class=\"gar\">➜\u003c/span>\u003cdiv class=\"gpi\">\u003cdiv class=\"pe\">✅\u003c/div>\u003cdiv class=\"pn\">choose → chose\u003c/div>\u003cdiv class=\"pk\">모양이 달라져요\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"k-ez\" data-hl=\"ge\">이미 지나간 일을 말할 때는 움직임을 나타내는 말의 모양을 바꿔요. design은 designed처럼 뒤에 -ed를 붙이고, draw는 drew, choose는 chose처럼 모양이 달라져요. 이 이야기에서는 '디자인했어요'를 \u003cb class=\"key\">designed\u003c/b>로 말해요.\u003c/div>\u003c/div>","segs":[{"n":76,"text":"첫 번째 문법은 지난 일을 말하는 방법이에요. 예를 들어 Pierre Coubertin designed the flag in nineteen thirteen. 이 문장을 나누어 볼게요. Pierre Coubertin은 누구인지 말해 주고, designed는 디자인했어요라는 동작을 말해요. the flag는 무엇을 디자인했는지, in nineteen thirteen은 언제였는지를 알려 줘요. 이미 지난 일이라서 design이 designed로 바뀐 점을 기억해요.","hl":"gb"},{"n":77,"text":"이미 지나간 일을 말할 때는 움직임을 나타내는 말의 모양을 바꿔요. design은 designed처럼 뒤에 -ed를 붙이고, draw는 drew, choose는 chose처럼 모양이 달라져요. 이 이야기에서는 '디자인했어요'를 designed로 말해요.","hl":"ge"}]},{"html":"\u003cspan class=\"lp-tag\">확인해요\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-gt\">\u003cspan>⏳\u003c/span>지난 일은 이렇게 말해요\u003c/div>\u003cdiv class=\"k-ex\" data-hl=\"gx\">\u003cdiv>\u003cspan class=\"e\">👵\u003c/span>\u003cb>I visited my grandma yesterday.\u003c/b>\u003csmall>나는 어제 할머니를 방문했어요.\u003c/small>\u003c/div>\u003cdiv>\u003cspan class=\"e\">🌳\u003c/span>\u003cb>He drew a big tree.\u003c/b>\u003csmall>그는 커다란 나무를 그렸어요.\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"k-ck\" data-hl=\"gc\">\u003cdiv class=\"q\">She \u003cspan class=\"k-ans\" data-rv=\"gc\">drew\u003c/span> a picture yesterday.\u003c/div>\u003csmall>그녀는 어제 그림을 그렸어요.\u003c/small>\u00 div>\u003cspan class=\"mk o\">O\u003c/span>\u003c/div>\u003cdiv class=\"gpi\">\u003cdiv class=\"pe\">❌\u003c/div>\u003cdiv class=\"pn\">The flag have five rings.\u003c/div>\u003cdiv class=\"pk\">그 깃발에는 have를 쓰면 틀려요.\u003c/div>\u003cspan class=\"mk x\">X\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"k-ez\" data-hl=\"ge\">무엇이 무엇을 가지고 있다고 말할 때 have를 써요. the flag처럼 하나를 가리키는 말 뒤에서는 \u003cb class=\"key\">has\u003c/b>로 바뀌어요. 'The flag has five rings'는 '그 깃발에는 다섯 개의 고리가 있어요'라는 뜻이에요.\u003c/div>\u003c/div>","segs":[{"n":85,"text":"두 번째 문법은 have와 has로 '있어요'를 말하는 방법이에요. The flag has five rings on a white background. 이 문장을 나누어 볼게요. The flag는 무엇에 대해 말하는지, has는 가지고 있다는 뜻을 나타내요. five rings는 무엇을 가지고 있는지, on a white background는 어디에 있는지를 알려 주지요. the flag처럼 하나를 가리킬 때는 have 대신 has를 쓴다는 점을 기억해요.","hl":"gb"},{"n":86,"text":"무엇이 무엇을 가지고 있다고 말할 때 have를 써요. the flag처럼 하나를 가리키는 말 뒤에서는 has로 바뀌어요. 'The flag has five rings'는 '그 깃발에는 다섯 개의 고리가 있어요'라는 뜻이에요.","hl":"ge"}]},{"html":"\u003cspan class=\"lp-tag\">확인해요\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-gt\">\u003cspan>🖐️\u003c/span>~가 있어요 (have/has)\u003c/div>\u003cdiv class=\"k-ex\" data-hl=\"gx\">\u003cdiv>\u003cspan class=\"e\">🚲\u003c/span>\u003cb>I have a bike.\u003c/b>\u003csmall>나는 자전거가 있어요.\u003c/small>\u003c/div>\u003cdiv>\u003cspan class=\"e\">🐶\u003c/span>\u003cb>She has a cute dog.\u003c/b>\u003csmall>그녀는 귀여운 개가 있어요.\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"k-ck\" data-hl=\"gc\">\u003cdiv class=\"q\">He \u003cspan class=\"k-ans\" data-rv=\"gc\">has\u003c/span> a new book.\u003c/div>\u003csmall>그는 새 책이 있어요.\u003c/small>\u003cdiv class=\"o\">\u003cspan>have\u003c/span>\u003cspan class=\"k-right\" data-rv=\"gc\">has\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":87,"text":"예문을 더 볼까요?","hl":"gx"},{"n":88,"text":"I have a bike.","hl":"gx","v":"n","pause":600},{"n":89,"text":"나는 자전거가 있어요.","hl":"gx"},{"n":90,"text":"She has a cute dog.","hl":"gx","v":"n","pause":600},{"n":91,"text":"그녀는 귀여운 개가 있어요.","hl":"gx"},{"n":92,"text":"문제를 풀어 볼까요? He 빈칸 a new book. 빈칸에 들어갈 말은 have, 아니면 has 중에서 무엇일까요?","hl":"gc"},{"n":93,"text":"정답은 has! He has a new book.","hl":"gc","rv":"gc"}]},{"html":"\u003cspan class=\"lp-tag\">내용 확인 문제\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-qq\" data-hl=\"q0\">\u003ci>1\u003c/i>\u003cdiv>\u003cdiv class=\"q\">올림픽기는 흰색 바탕에 다섯 개의 고리가 있어요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q0\">O\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q1\">\u003ci>2\u003c/i>\u003cdiv>\u003cdiv class=\"q\">Coubertin은 고리를 기계로 색칠했어요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q1\">X\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q2\">\u003ci>3\u003c/i>\u003cdiv>\u003cdiv class=\"q\">다섯 개의 고리는 무엇을 의미해요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 세계의 다섯 지역\u003c/span>\u003cspan>② 올림픽의 다섯 경기\u003c/span>\u003cspan>③ 여섯 가지 색\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q2\">세계의 다섯 지역\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q3\">\u003ci>4\u003c/i>\u003cdiv>\u003cdiv class=\"q\">Coubertin이 바탕색으로 선택한 색은 무엇이에요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 흰색\u003c/span>\u003cspan>② 파란색\u003c/span>\u003cspan>③ 빨간색\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q3\">흰색\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":94,"text":"이제 문제를 풀어 볼까요? 지문에서 답을 찾으며 O, X 문제와 고르기 문제를 차근차근 풀어 보아요.","hl":null},{"n":95,"text":"첫 번째 문제. 올림픽기는 흰색 바탕에 다섯 개의 고리가 있어요. 맞으면 O, 틀리면 X예요.","hl":"q0"},{"n":96,"text":"정답은 O, 맞아요.","hl":"q0","rv":"q0"},{"n":97,"text":"두 번째 문제. Coubertin은 고리를 기계로 색칠했어요. 맞으면 O, 틀리면 X예요.","hl":"q1"},{"n":98,"text":"정답은 X, 틀려요.","hl":"q1","rv":"q1"},{"n":99,"text":"세 번째 문제. 다섯 개의 고리는 무엇을 의미해요? 첫 번째, 세계의 다섯 지역. 두 번째, 올림픽의 다섯 경기. 세 번째, 여섯 가지 색","hl":"q2"},{"n":100,"text":"정답은 세계의 다섯 지역예요.","hl":"q2","rv":"q2"},{"n":101,"text":"네 번째 문제. Coubertin이 바탕색으로 선택한 색은 무엇이에요? 첫 번째, 흰색. 두 번째, 파란색. 세 번째, 빨간색","hl":"q3"},{"n":102,"text":"정답은 흰색예요.","hl":"q3","rv":"q3"}]},{"html":"\u003cspan class=\"lp-tag\">이야기 요약하기\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-bank\">\u003cspan>1913\u003c/span>\u003cspan>at least one\u003c/span>\u003cspan>rings\u003c/span>\u003c/div>\u003cdiv class=\"k-sum\" data-hl=\"sm\">The Olympic flag has five \u003cspan class=\"k-ans\" data-rv=\"sm\">rings\u003c/span> on a white background. Pierre Coubertin designed it in \u003cspan class=\"k-ans\" data-rv=\"sm\">1913\u003c/span>. The five rings mean five parts of the world, and every country's flag has \u003cspan class=\"k-ans\" data-rv=\"sm\">at least one\u003c/span> of the six colors.\u003c/div>\u003cdiv class=\"k-sk\">올림픽기는 흰 바탕에 다섯 개의 고리가 있어요. Pierre Coubertin이 1913년에 디자인했어요. 다섯 고리는 세계의 다섯 지역을 뜻하고, 모든 나라의 국기에는 여섯 가지 색 중 적어도 하나가 들어 있어요.\u003c/div>\u003c/div>","segs":[{"n":103,"text":"마지막으로 이야기를 짧게 요약해 볼게요. 빈칸에 rings, nineteen thirteen, at least one을 넣어 문장을 완성해 보아요.","hl":null},{"n":104,"text":"The Olympic flag has five rings on a white background. Pierre Coubertin designed it in 1913. The five rings mean five parts of the world, and every country's flag has at least one of the six colors.","hl":"sm","rv":"sm","v":"n"},{"n":105,"text":"올림픽기는 흰 바탕에 다섯 개의 고리가 있어요. Pierre Coubertin이 1913년에 디자인했어요. 다섯 고리는 세계의 다섯 지역을 뜻하고, 모든 나라의 국기에는 여섯 가지 색 중 적어도 하나가 들어 있어요.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>The Olympic Flag 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":106,"text":"여러분, 오늘 Olympic flag의 비밀을 아주 잘 알아보았어요. 다섯 rings와 여섯 가지 색이 모든 나라를 이어 주는 멋진 약속이라는 점을 기억해요. 다음 시간에도 신나는 영어 이야기로 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
