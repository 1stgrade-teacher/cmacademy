">한 반이 무지개 마을을 방문해 그 이야기를 들었어요. 모두 떠났지만 한 노인이 남아 집들에 그림을 그렸어요. 학생들이 열한 채의 집을 구했고, 지금은 많은 사람이 마을을 찾아와요.\u003c/div>\u003c/div>","segs":[{"n":123,"text":"마지막으로 오늘 이야기를 세 문장으로 정리해 볼게요. 빈칸에 들어갈 낱말을 떠올리며 따라 읽어 보세요.","hl":null},{"n":124,"text":"A class visited the Rainbow Village and heard its story. Everyone left, but one old man stayed and painted the homes. Students saved 11 homes, and now many people visit the village.","hl":"sm","rv":"sm","v":"n"},{"n":125,"text":"한 반이 무지개 마을을 방문해 그 이야기를 들었어요. 모두 떠났지만 한 노인이 남아 집들에 그림을 그렸어요. 학생들이 열한 채의 집을 구했고, 지금은 많은 사람이 마을을 찾아와요.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>The Rainbow Village 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":126,"text":"여러분, 오늘 정말 멋진 이야기를 읽었어요! 한 할아버지의 그림이 마을을 살린 것처럼, 작은 생각도 큰 힘이 될 수 있답니다. 다음 시간에 또 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
