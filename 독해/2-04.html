u003c/span>\u003cspan>sew\u003c/span>\u003cspan>simple\u003c/span>\u003c/div>\u003cdiv class=\"k-sum\" data-hl=\"sm\">Coco Chanel learned to \u003cspan class=\"k-ans\" data-rv=\"sm\">sew\u003c/span> and sang on stage at night. She opened a hat shop and decided to make \u003cspan class=\"k-ans\" data-rv=\"sm\">simple\u003c/span> and \u003cspan class=\"k-ans\" data-rv=\"sm\">comfortable\u003c/span> clothes. She used the color \u003cspan class=\"k-ans\" data-rv=\"sm\">black\u003c/span> and changed women's clothing forever.\u003c/div>\u003cdiv class=\"k-sk\">코코 샤넬은 바느질을 배우고 밤에는 무대에서 노래를 불렀어요. 그녀는 모자 가게를 열고 간결하고 편한 옷을 만들기로 결심했어요. 그녀는 검은색을 사용해서 여성복을 영원히 바꾸었습니다.\u003c/div>\u003c/div>","segs":[{"n":117,"text":"마지막으로 오늘 이야기를 세 문장으로 정리해 볼게요. 빈칸에 알맞은 낱말을 넣으면서 큰 소리로 읽어 볼까요?","hl":null},{"n":118,"text":"Coco Chanel learned to sew and sang on stage at night. She opened a hat shop and decided to make simple and comfortable clothes. She used the color black and changed women's clothing forever.","hl":"sm","rv":"sm","v":"n"},{"n":119,"text":"코코 샤넬은 바느질을 배우고 밤에는 무대에서 노래를 불렀어요. 그녀는 모자 가게를 열고 간결하고 편한 옷을 만들기로 결심했어요. 그녀는 검은색을 사용해서 여성복을 영원히 바꾸었습니다.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>Coco Chanel 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":120,"text":"여러분, 오늘 Coco Chanel 이야기를 아주 잘 읽었어요! 편한 옷과 검은색으로 세상을 바꾼 그녀처럼 여러분도 멋진 생각을 마음껏 펼쳐 보세요. 다음 시간에 또 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
