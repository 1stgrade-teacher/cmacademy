<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터2 Reading30 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}

.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터2 Reading30","audioDir":"reading30_audio","preview":false,"count":35,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.668em\">Reading\u003cbr>30\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터 레벨2\u003c/div>\u003ch1>How Cities Combat Disease: From Crisis to Progress\u003c/h1>\u003ch2>도시가 질병에 맞서는 법: 위기에서 발전으로\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>건강과 질병의 확산은 \u003cb class=\"key\">도시 \u003c/b>\u003cb class=\"key\">운영\u003c/b> 방식과 밀접하며, 도시는 질병의 고통을 겪은 뒤 \u003cb class=\"key\">도시 \u003c/b>\u003cb class=\"key\">재건\u003c/b>과 위생 시설 구축을 통해 더 발전해 왔습니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Cities have not only survived deadly diseases but also advanced through urban replanning and improved living conditions.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 우리가 사는 도시가 질병의 위협을 어떻게 극복하고 더 나은 곳으로 변해왔는지에 대해 알아볼 거예요. 건강과 질병의 확산은 도시의 운영 방식과 떼려야 뗄 수 없는 관계에 있죠. 도시는 위기 속에서도 상상보다 빨리 회복하며 발전한다는 것이 오늘 지문의 핵심 요지입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">역사적으로 대규모 \u003cb class=\"key\">전염병\u003c/b>(epidemic)은 도시의 구조를 바꾸는 결정적인 계기가 되었습니다. 마치 우리 몸이 병을 앓고 나서 \u003cb class=\"key\">면역력\u003c/b>을 키우듯, 도시도 위생 문제를 해결하며 진화합니다. 19세기 산업 혁명기 유럽은 인구 밀집으로 인해 \u003cb class=\"key\">수인성 \u003c/b>\u003cb class=\"key\">전염병\u003c/b>(waterborne disease)인 콜레라 등이 창궐했습니다. 이를 해결하기 위해 단순한 치료를 넘어 \u003cb class=\"key\">상하수도\u003c/b>(sewage system) 정비와 같은 도시 공학적 접근이 시작되었고, 이는 현대 \u003cb class=\"key\">공중보건\u003c/b>(public health)의 기틀이 되었습니다.\u003c/div>","segs":[{"n":2,"text":"역사적으로 대규모 전염병은 도시의 구조를 바꾸는 결정적인 계기가 되었어요. 마치 우리 몸이 병을 앓고 나서 면역력을 키우는 것과 비슷하죠. 특히 십구 세기 유럽에서는 인구가 밀집하면서 콜레라 같은 질병이 크게 유행했는데, 이를 해결하기 위해 단순한 치료를 넘어 상하수도 정비 같은 공중보건 대책이 나오기 시작했답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>질병과 도시의 관계\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>건강 및 질병 확산이 \u003cb class=\"key\">도시 \u003c/b>\u003cb class=\"key\">운영\u003c/b>과 직결되어 있음을 설명하며, 도시의 빠른 \u003cb class=\"key\">회복력\u003c/b>을 강조합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>과거의 시련과 생존\u003csmall>전환 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>많은 도시가 치명적 질병을 겪었지만, 고통의 시간 뒤에 \u003cb class=\"key\">단순 \u003c/b>\u003cb class=\"key\">생존\u003c/b>을 넘어 \u003cb class=\"key\">발전\u003c/b>했다는 점을 언급합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>유럽 도시의 사례\u003csmall>예시 및 근거 · 문장 5–8\u003c/small>\u003c/h4>\u003cp>독일 의사들의 \u003cb class=\"key\">원인 \u003c/b>\u003cb class=\"key\">발견\u003c/b>과 런던의 \u003cb class=\"key\">하수도 \u003c/b>\u003cb class=\"key\">건설\u003c/b> 사례를 통해 질병이 어떻게 도시 재건으로 이어졌는지 보여줍니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 질병과 도시의 밀접한 관계를 먼저 제시하고, 역사적 사례를 통해 그 변화 과정을 설명하고 있어요.","hl":null},{"n":4,"text":"첫 번째 단계인 도입부에서는 건강과 질병 확산이 우리가 어떻게 살고 도시가 어떻게 operate 되는지와 아주 밀접하게 linked 되어 있다는 점을 짚어줍니다. 그리고 도시의 놀라운 recover 능력을 언급하며 긍정적인 메시지를 전달하죠.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 과거의 사례를 들며, 도시들이 deadly diseases로 인한 고통을 겪은 뒤 단순히 생존하는 것에 그치지 않고 오히려 advanced, 즉 더 발전했다는 반전의 결과를 보여줍니다.","hl":"f1"},{"n":6,"text":"마지막 단계에서는 독일 의사들이 밝혀낸 환경과 질병의 connection을 바탕으로 도시를 재건한 사례를 소개해요. 특히 런던에서 콜레라 확산을 막기 위해 선구적인 sewer system을 구축했다는 구체적인 예시로 마무리합니다.","hl":"f2"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">인과\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">질병과 도시의 \u003cb class=\"key\">상호작용\u003c/b>을 첫 문장에서 주제로 제시합니다. 이후 유럽의 역사적 사례를 통해 질병이라는 원인이 \u003cb class=\"key\">도시 \u003c/b>\u003cb class=\"key\">재건\u003c/b>이라는 결과로 이어지는 과정을 설명합니다. 특히 런던의 사례는 \u003cb class=\"key\">해결책\u003c/b>의 구체적인 예시로 사용되었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>The good news is (2)\u003c/b>\u003cspan>전환 및 강조\u003c/span>\u003cb>For example (3)\u003c/b>\u003cspan>구체적 예시 도입\u003c/span>\u003cb>This led to (7)\u003c/b>\u003cspan>결과 도출\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">linked\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">connection\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">how our cities operate\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">replanning and rebuilding\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">sewer system\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":7,"text":"이 지문은 인과 관계를 중심으로 전개되며, 첫 문장에서 주제를 바로 던지는 두괄식 구성을 취하고 있어요. 질병이라는 문제 상황이 도시 재건이라는 결과로 이어지는 구조를 잘 보여주고 있죠.","hl":"ty"},{"n":8,"text":"두 번째 문장의 The good news is는 분위기를 전환하며 핵심을 강조하고, 세 번째 문장의 For example은 구체적인 증거를 대기 시작합니다. 일곱 번째 문장의 This led to는 원인이 결과로 이어지는 신호어니까 꼭 기억해 두세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>health\u003c/b>\u003cem>명사\u003c/em>\u003cspan>건강\u003c/span>\u003c/div>\u003cdiv>\u003cb>spread\u003c/b>\u003cem>명사\u003c/em>\u003cspan>확산\u003c/span>\u003c/div>\u003cdiv>\u003cb>disease\u003c/b>\u003cem>명사\u003c/em>\u003cspan>질병\u003c/span>\u003c/div>\u003cdiv>\u003cb>closely\u003c/b>\u003cem>부사\u003c/em>\u003cspan>밀접하게\u003c/span>\u003c/div>\u003cdiv>\u003cb>linked\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>연관된\u003c/span>\u003c/div>\u003cdiv>\u003cb>operate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>운영되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>recover\u003c/b>\u003cem>동사\u003c/em>\u003cspan>회복하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>imagine\u003c/b>\u003cem>동사\u003c/em>\u003cspan>상상하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>experience\u003c/b>\u003cem>동사\u003c/em>\u003cspan>경험하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>deadly\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>치명적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>period\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기간\u003c/span>\u003c/div>\u003cdiv>\u003cb>pain\u003c/b>\u003cem>명사\u003c/em>\u003cspan>고통\u003c/span>\u003c/div>\u003cdiv>\u003cb>suffering\u003c/b>\u003cem>명사\u003c/em>\u003cspan>고난\u003c/span>\u003c/div>\u003cdiv>\u003cb>survive\u003c/b>\u003cem>동사\u003c/em>\u003cspan>생존하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>advance\u003c/b>\u003cem>동사\u003c/em>\u003cspan>발전하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>destructive\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>파괴적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>outbreak\u003c/b>\u003cem>명사\u003c/em>\u003cspan>발생\u003c/span>\u003c/div>\u003cdiv>\u003cb>connection\u003c/b>\u003cem>명사\u003c/em>\u003cspan>연관성\u003c/span>\u003c/div>\u003cdiv>\u003cb>condition\u003c/b>\u003cem>명사\u003c/em>\u003cspan>환경\u003c/span>\u003c/div>\u003cdiv>\u003cb>lead to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 이어지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>replanning\u003c/b>\u003cem>명사\u003c/em>\u003cspan>재계획\u003c/span>\u003c/div>\u003cdiv>\u003cb>rebuilding\u003c/b>\u003cem>명사\u003c/em>\u003cspan>재건\u003c/span>\u003c/div>\u003cdiv>\u003cb>pioneering\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>선구적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>sewer system\u003c/b>\u003cem>명사\u003c/em>\u003cspan>하수도 체계\u003c/span>\u003c/div>\u003cdiv>\u003cb>cholera\u003c/b>\u003cem>명사\u003c/em>\u003cspan>콜레라\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"중요한 단어로는 deadly, destructive 같은 질병의 위험성을 나타내는 단어와, survive, advance, pioneering 같이 이를 극복하는 과정을 나타내는 단어들을 잘 챙겨야 합니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">link\u003c/b>\u003cspan class=\"m\">연관성\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">connection\u003c/span>\u003cspan class=\"s\">relation\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">detachment\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">deadly\u003c/b>\u003cspan class=\"m\">치명적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">fatal\u003c/span>\u003cspan class=\"s\">lethal\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">harmless\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">advance\u003c/b>\u003cspan class=\"m\">발전하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">progress\u003c/span>\u003cspan class=\"s\">improve\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">regress\u003c/span>\u003cspan class=\"a\">retreat\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">destructive\u003c/b>\u003cspan class=\"m\">파괴적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">devastating\u003c/span>\u003cspan class=\"s\">ruinous\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">constructive\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">connection\u003c/b>\u003cspan class=\"m\">관계\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">association\u003c/span>\u003cspan class=\"s\">bond\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">separation\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"연관성을 뜻하는 connection은 link나 relation으로 바꿔 쓸 수 있고, 발전을 뜻하는 advance의 반대말은 퇴보를 뜻하는 regress가 될 거예요. 파괴적인 상황을 뜻하는 destructive의 반의어로 constructive도 함께 알아두면 좋겠죠?","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">건강과 질병의 확산은\u003c/span>\u003cspan class=\"en\">Health and the spread of disease\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매우 밀접하게 연관되어 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">very \u003c/span>\u003cspan class=\"tgt\">closely \u003c/span>\u003cspan class=\"tgt\">linked \u003c/span>\u003cspan class=\"tgt\">to\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 어떻게 사는지와\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">live\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">도시가 어떻게 운영되는지에\u003c/span>\u003cspan class=\"en\">and how our cities operate.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">건강과 질병의 확산은 우리가 어떻게 살고, 도시가 어떻게 운영되는지와 매우 밀접하게 연관되어 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 건강과 질병이 인간의 \u003cb class=\"key\">생활 \u003c/b>\u003cb class=\"key\">방식\u003c/b> 및 \u003cb class=\"key\">도시 \u003c/b>\u003cb class=\"key\">시스템\u003c/b>과 떼려야 뗄 수 없는 관계임을 설명하며 글을 시작합니다. \u003cb class=\"key\">환경적 \u003c/b>\u003cb class=\"key\">요인\u003c/b>이 질병의 전파에 결정적인 역할을 한다는 점을 강조하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : be [동사] + [linked (과거분사)] + to [전치사] : \"~와 밀접하게 연관되어 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">간접의문문\u003c/span> : how [의문사] + we [주어] + live [동사] : \"우리가 어떻게 사는지\"\u003c/div>\u003c/div>","segs":[{"n":11,"text":"Health and the spread of disease, 건강과 질병의 확산은. are very closely linked to, 매우 밀접하게 연관되어 있다. how we live, 우리가 어떻게 사는지와. and how our cities operate, 도시가 어떻게 운영되는지에. 이 문장 전체를 해석하면, 건강과 질병의 확산은 우리가 어떻게 살고, 도시가 어떻게 운영되는지와 매우 밀접하게 연관되어 있다.","hl":"m"},{"n":12,"text":"첫 번째 문장은 이 글의 핵심 주제를 던지고 있어요. 우리가 매일 누리는 건강과 무서운 질병의 확산이 결국은 도시의 생활 방식과 운영 체계라는 환경적인 요인에 달려 있다는 뜻이죠.","hl":"mn"},{"n":13,"text":"중요한 어법 두 가지를 볼게요. 첫 번째로 are very closely linked to는 주어가 수동적인 관계임을 나타내는 수동태 표현입니다. 두 번째로 how we live와 how our cities operate는 전치사 to 뒤에 연결된 간접의문문으로 의문사 뒤에 주어와 동사가 차례대로 오는 어순에 주의해야 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">좋은 소식은 ~라는 것이다\u003c/span>\u003cspan class=\"en\">The good news is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">도시가 회복될 수 있다는 것\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">cities \u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">recover\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 빨리\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">quickly \u003c/span>\u003cspan class=\"tgt\">than\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분이 상상할지도 모르는 것보다\u003c/span>\u003cspan class=\"en\">you might imagine.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">좋은 소식은 도시가 여러분이 상상할지도 모르는 것보다 더 빨리 회복될 수 있다는 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 도시가 질병의 위협에 취약할 수 있지만, 동시에 \u003cb class=\"key\">회복력\u003c/b>을 갖추고 있다는 긍정적인 반전을 제시합니다. 도시의 \u003cb class=\"key\">복원 \u003c/b>\u003cb class=\"key\">속도\u003c/b>가 인간의 통념보다 훨씬 빠를 수 있음을 암시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that (명사절)\u003c/span> : is [동사] + that [접속사] + [완전한 문장 (보어)] : \"도시가 회복될 수 있다는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">비교급\u003c/span> : more [부사] + quickly [부사] + than [접속사] : \"~보다 더 빨리\"\u003c/div>\u003c/div>","segs":[{"n":14,"text":"The good news is, 좋은 소식은 ~라는 것이다. that cities can recover, 도시가 회복될 수 있다는 것. more quickly than, 더 빨리. you might imagine, 여러분이 상상할지도 모르는 것보다. 이 문장 전체를 해석하면, 좋은 소식은 도시가 여러분이 상상할지도 모르는 것보다 더 빨리 회복될 수 있다는 것이다.","hl":"m"},{"n":15,"text":"앞 문장에서 질병과 도시의 관계를 언급하며 긴장감을 줬다면, 이번 문장에서는 도시의 강한 생명력에 대해 말하며 분위기를 전환하고 있어요. 도시가 가진 놀라운 회복 능력을 강조하고 있네요.","hl":"mn"},{"n":16,"text":"어법을 살펴보면, 첫 번째로 is 뒤에 나오는 that은 문장 안에서 보어 역할을 하는 명사절 접속사예요. 이 뒤에는 꼭 완전한 문장이 와야 하죠. 두 번째로 more quickly than은 비교급 표현으로 상상하는 것보다 더 빠른 속도를 비교해서 설명해주고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들어\u003c/span>\u003cspan class=\"en\">For example,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 도시들이\u003c/span>\u003cspan class=\"en\">many cities\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지금까지 경험해 왔다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">experienced\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">치명적인 질병을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">deadly\u003c/span> diseases\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">과거에\u003c/span>\u003cspan class=\"en\">in the past.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">예를 들어, 많은 도시들이 지금까지 치명적인 질병을 경험해 왔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 언급한 도시의 회복 가능성을 뒷받침하기 위해 \u003cb class=\"key\">구체적인 \u003c/b>\u003cb class=\"key\">사례\u003c/b>를 도입하는 단계입니다. 과거부터 도시가 겪어온 \u003cb class=\"key\">시련의 \u003c/b>\u003cb class=\"key\">역사\u003c/b>를 언급하며 논거를 마련합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재완료\u003c/span> : have [조동사] + experienced [과거분사] : \"경험해 왔다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">형용사\u003c/span> : dead [명사/형용사] + ly [접미사] : \"치명적인\"\u003c/div>\u003c/div>","segs":[{"n":17,"text":"For example, 예를 들어. many cities, 많은 도시들이. have experienced, 지금까지 경험해 왔다. deadly diseases, 치명적인 질병을. in the past, 과거에. 이 문장 전체를 해석하면, 예를 들어, 많은 도시들이 지금까지 치명적인 질병을 경험해 왔다.","hl":"m"},{"n":18,"text":"도시가 회복력이 있다는 주장에 대한 근거를 대기 시작했어요. 실제로 역사 속에서 수많은 도시가 치명적인 질병이라는 거대한 시련을 겪었지만 결국 극복해냈다는 사실을 보여주려는 것이죠.","hl":"mn"},{"n":19,"text":"첫 번째로 have experienced는 현재완료 시제입니다. 과거의 경험이 현재까지도 의미가 있다는 것을 보여줄 때 써요. 두 번째로 deadly라는 단어는 생김새는 부사 같지만 실제로는 명사를 꾸며주는 형용사라는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어느 정도의 기간 후에\u003c/span>\u003cspan class=\"en\">After some period\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고통과 고난의\u003c/span>\u003cspan class=\"en\">of pain and suffering,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 생존했을 뿐만 아니라\u003c/span>\u003cspan class=\"en\">they \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">only \u003c/span>\u003cspan class=\"tgt\">survived, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">발전했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">but \u003c/span>\u003cspan class=\"tgt\">also \u003c/span>\u003cspan class=\"tgt\">advanced\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어느 정도 고통과 고난의 기간 후에 그들은 생존했을 뿐만 아니라 발전했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 위기를 겪은 도시들이 단순히 원래 상태로 돌아오는 것을 넘어 더 나은 방향으로 \u003cb class=\"key\">발전\u003c/b>한다는 도시의 \u003cb class=\"key\">회복력\u003c/b>을 강조하는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">상관접속사 (not only A but also B)\u003c/span> : not only [동사A] but also [동사B] : \"생존했을 뿐만 아니라 발전했다\"\u003c/div>\u003c/div>","segs":[{"n":20,"text":"After some period, 어느 정도의 기간 후에. of pain and suffering, 고통과 고난의. they not only survived, 그들은 생존했을 뿐만 아니라. but also advanced, 발전했다. 이 문장 전체를 해석하면, 어느 정도 고통과 고난의 기간 후에 그들은 생존했을 뿐만 아니라 발전했다.","hl":"m"},{"n":21,"text":"도시가 큰 시련을 겪고 나서 단순히 버틴 게 아니라 오히려 더 좋게 변했다는 내용이에요. 위기 뒤에 찾아온 도시의 회복력과 발전을 보여주고 있죠.","hl":"mn"},{"n":22,"text":"문장에서 가장 중요한 부분은 상관접속사 구문이에요. 첫 번째 포인트로 not only A but also B 구조를 사용해서 생존과 발전을 동시에 강조하고 있어요. 두 번째로 A와 B 자리에 과거 동사인 survived와 advanced를 써서 병렬 구조를 정확하게 맞췄다는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">19세기와\u003c/span>\u003cspan class=\"en\">In the nineteenth\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">20세기 초에\u003c/span>\u003cspan class=\"en\">and early twentieth centuries,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유럽의 도시들은 보았다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">European \u003c/span>\u003cspan class=\"tgt\">cities \u003c/span>\u003cspan class=\"tgt\">saw\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">파괴적인 발생을\u003c/span>\u003cspan class=\"en\">destructive outbreaks\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">치명적인 질병의\u003c/span>\u003cspan class=\"en\">of deadly diseases.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">19세기와 20세기 초에 유럽의 도시들은 치명적인 질병의 파괴적인 발생을 보았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 도시가 발전하기 직전의 역사적 상황을 제시하며, 유럽 도시들이 겪었던 심각한 \u003cb class=\"key\">전염병\u003c/b> 위기가 얼마나 \u003cb class=\"key\">파괴적인\u003c/b> 수준이었는지 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">무생물 주어 구문\u003c/span> : [주어(장소/시간)] + saw + [목적어] : \"유럽의 도시들은 보았다 (겪었다)\"\u003c/div>\u003c/div>","segs":[{"n":23,"text":"In the nineteenth, 19세기와. and early twentieth centuries, 20세기 초에. European cities saw, 유럽의 도시들은 보았다. destructive outbreaks, 파괴적인 발생을. of deadly diseases, 치명적인 질병의. 이 문장 전체를 해석하면, 19세기와 20세기 초에 유럽의 도시들은 치명적인 질병의 파괴적인 발생을 보았다.","hl":"m"},{"n":24,"text":"과거 유럽 도시들이 아주 무서운 전염병 때문에 큰 위기에 처했던 역사적 배경을 설명하는 문장이에요. 파괴적이라는 표현에서 당시의 심각성을 알 수 있죠.","hl":"mn"},{"n":25,"text":"문장의 주어를 주목해 보세요. 첫 번째 포인트로 사람이 아닌 도시가 주어로 쓰였는데, saw라는 동사를 써서 도시가 그 일을 직접 목격하고 겪었다는 생동감을 주고 있어요. 두 번째로 nineteenth와 twentieth처럼 서수 표현을 사용해 정확한 시대를 나타내고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">독일의 몇몇 유명한 의사들이\u003c/span>\u003cspan class=\"en\">Some famous doctors in Germany\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">연관성을 발견했다\u003c/span>\u003cspan class=\"en\">found the connection\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">열악한 생활 환경과\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">between \u003c/span>\u003cspan class=\"tgt\">poor \u003c/span>\u003cspan class=\"tgt\">living \u003c/span>\u003cspan class=\"tgt\">conditions \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">질병 사이의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">disease\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">독일의 몇몇 유명한 의사들이 열악한 생활 환경과 질병 사이의 연관성을 발견했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 전염병 해결의 실마리를 찾은 지점으로, \u003cb class=\"key\">주거 \u003c/b>\u003cb class=\"key\">환경\u003c/b>이 질병의 주요 \u003cb class=\"key\">원인\u003c/b>임을 과학적으로 밝혀냈음을 의미합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구 (between A and B)\u003c/span> : between [명사A] and [명사B] : \"열악한 생활 환경과 질병 사이의\"\u003c/div>\u003c/div>","segs":[{"n":26,"text":"Some famous doctors in Germany, 독일의 몇몇 유명한 의사들이. found the connection, 연관성을 발견했다. between poor living conditions, 열악한 생활 환경과. and disease, 질병 사이의. 이 문장 전체를 해석하면, 독일의 몇몇 유명한 의사들이 열악한 생활 환경과 질병 사이의 연관성을 발견했다.","hl":"m"},{"n":27,"text":"독일 의사들이 왜 사람들이 자꾸 아픈지 조사하다가, 깨끗하지 못한 생활 환경이 범인이라는 것을 알아냈다는 내용이에요. 해결책의 시작이 되는 중요한 발견이죠.","hl":"mn"},{"n":28,"text":"첫 번째 포인트는 connection이라는 명사를 꾸며주는 뒤의 전치사구예요. 두 번째로 between A and B 구조가 쓰여서 열악한 환경과 질병이라는 두 가지 핵심 요소 사이의 상관관계를 명확히 설명하고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은 ~로 이어졌다\u003c/span>\u003cspan class=\"en\">This \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">led \u003c/span>\u003cspan class=\"tgt\">to\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">도시를 재계획하고 재건하는 것\u003c/span>\u003cspan class=\"en\">the replanning and rebuilding of cities\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">치명적인 질병의 확산을 막기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">stop\u003c/span> the spread of deadly diseases.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것은 치명적인 질병의 확산을 막기 위해 도시를 재계획하고 재건하는 것으로 이어졌다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞선 문장에서 발견한 질병과 환경의 상관관계가 도시의 \u003cb class=\"key\">재설계\u003c/b>를 가져왔다는 내용입니다. \u003cb class=\"key\">공중보건\u003c/b>을 위해 도시의 구조 자체가 변화하게 된 \u003cb class=\"key\">인과관계\u003c/b>를 설명하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">구동사의 결과 표현\u003c/span> : [주어/원인] + led to + [목적어/결과] : \"~로 이어졌다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법 (목적)\u003c/span> : to + [동사원형] : \"막기 위해\"\u003c/div>\u003c/div>","segs":[{"n":29,"text":"This led to, 이것은 ~로 이어졌다. the replanning and rebuilding of cities, 도시를 재계획하고 재건하는 것. to stop the spread of deadly diseases, 치명적인 질병의 확산을 막기 위해. 이 문장 전체를 해석하면, 이것은 치명적인 질병의 확산을 막기 위해 도시를 재계획하고 재건하는 것으로 이어졌다.","hl":"m"},{"n":30,"text":"이 문장은 앞서 의사들이 발견한 사실이 실제 도시의 모습에 어떤 영향을 주었는지 설명하고 있어요. 질병을 막으려는 노력이 단순한 치료에 그치지 않고 도시 재설계라는 거대한 변화를 일으켰다는 뜻이죠.","hl":"mn"},{"n":31,"text":"첫 번째 포인트로 led to라는 표현을 주목해 보세요. lead의 과거형으로 어떤 원인이 특정 결과를 낳았을 때 아주 자주 쓰는 표현이에요. 두 번째로 to stop은 to부정사의 부사적 용법 중 목적에 해당하는데요. 도시를 왜 다시 지었는지 그 이유를 설명해주고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">19세기 중반,\u003c/span>\u003cspan class=\"en\">In the mid-nineteenth century,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">런던의 선구적인 하수도가 건설되었다\u003c/span>\u003cspan class=\"en\">London's pioneering sewer system \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">built\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">콜레라의 확산을 막기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">stop\u003c/span> the spread of cholera.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">19세기 중반, 콜레라의 확산을 막기 위해 런던의 선구적인 하수도가 건설되었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 도시 재건의 구체적인 \u003cb class=\"key\">역사적 \u003c/b>\u003cb class=\"key\">사례\u003c/b>를 제시하고 있습니다. \u003cb class=\"key\">하수도\u003c/b>라는 도시 기반 시설이 \u003cb class=\"key\">콜레라\u003c/b>라는 특정 질병을 막기 위해 탄생했음을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : be동사 + [built (p.p.)] : \"건설되었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법 (목적)\u003c/span> : to + [동사원형] : \"막기 위해\"\u003c/div>\u003c/div>","segs":[{"n":32,"text":"In the mid-nineteenth century, 19세기 중반. London's pioneering sewer system was built, 런던의 선구적인 하수도가 건설되었다. to stop the spread of cholera, 콜레라의 확산을 막기 위해. 이 문장 전체를 해석하면, 19세기 중반, 콜레라의 확산을 막기 위해 런던의 선구적인 하수도가 건설되었다.","hl":"m"},{"n":33,"text":"이번 문장에서는 앞서 말한 도시 재건의 예시로 런던의 하수도 이야기를 하고 있어요. 당시 무서웠던 전염병인 콜레라를 막기 위해 아주 획기적인 시설을 만들었다는 역사적 사실을 전달합니다.","hl":"mn"},{"n":34,"text":"첫 번째로 was built 부분은 수동태예요. 하수도 시스템 입장에서 스스로를 짓는 게 아니라 건설되는 것이기 때문에 be동사와 과거분사를 썼습니다. 두 번째로 to stop은 앞선 문장과 마찬가지로 하수도를 왜 건설했는지 그 목적을 밝혀주는 역할을 합니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>건강과 질병은 \u003cb class=\"key\">도시 \u003c/b>\u003cb class=\"key\">운영\u003c/b> 방식과 매우 밀접하게 연결되어 있습니다.\u003c/li>\u003cli>도시는 치명적인 질병 이후 단순 생존을 넘어 \u003cb class=\"key\">더욱 \u003c/b>\u003cb class=\"key\">발전\u003c/b>하는 경향이 있습니다.\u003c/li>\u003cli>독일 의사들은 \u003cb class=\"key\">생활 \u003c/b>\u003cb class=\"key\">환경\u003c/b>이 질병 확산의 주요 원인임을 밝혀냈습니다.\u003c/li>\u003cli>런던의 \u003cb class=\"key\">하수도 \u003c/b>\u003cb class=\"key\">건설\u003c/b>은 질병 예방을 위한 도시 재건의 대표적 사례입니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Cities have not only survived deadly diseases but also advanced through urban replanning and improved living conditions.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">건강과 질병의 확산은 \u003cb class=\"key\">도시 \u003c/b>\u003cb class=\"key\">운영\u003c/b> 방식과 밀접하며, 도시는 질병의 고통을 겪은 뒤 \u003cb class=\"key\">도시 \u003c/b>\u003cb class=\"key\">재건\u003c/b>과 위생 시설 구축을 통해 더 발전해 왔습니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":35,"text":"질병은 분명 고통스러운 일이지만, 인류는 이를 통해 도시의 위생 시스템을 획기적으로 개선해 왔습니다. 오늘 배운 런던의 하수도 사례처럼 위기를 발전의 기회로 삼는 도시의 저력을 잘 기억해 보세요. 오늘도 공부하느라 고생 많았습니다!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
