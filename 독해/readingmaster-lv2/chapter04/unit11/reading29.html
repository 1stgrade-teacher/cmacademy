<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터2 Reading29 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터2 Reading29","audioDir":"reading29_audio","preview":false,"count":33,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.668em\">Reading\u003cbr>29\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터 레벨2\u003c/div>\u003ch1>The Boundless Capacity of a Trained Memory\u003c/h1>\u003ch2>훈련된 기억력의 무한한 잠재력\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>기억은 \u003cb class=\"key\">근육\u003c/b>과 유사하여 훈련할수록 발달하지만, 신체 근육과 달리 \u003cb class=\"key\">한계\u003c/b>나 부작용 없이 무한히 확장될 수 있는 특징을 가집니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Memory is like a muscle that improves with exercise, but unlike a muscle, it has no limits on how much it can be trained.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 기억력의 신비로운 특징에 대해 함께 공부해 볼 거예요. 이 지문은 기억력이 많이 쓸수록 좋아진다는 점을 근육에 빗대어 아주 흥미롭게 설명하고 있습니다. 우리는 훈련된 기억력이 왜 근육보다 뛰어난지, 그리고 어떤 부수적인 효과가 있는지를 중점적으로 살펴볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">우리 뇌의 기억 메커니즘은 흔히 \u003cb class=\"key\">가소성\u003c/b>(Neuroplasticity)이라는 개념으로 설명됩니다. 이는 뇌가 외부 자극이나 학습에 의해 스스로의 구조와 기능을 변화시킨다는 원리입니다. 지문에서는 이를 \u003cb class=\"key\">근육\u003c/b>(Muscle)에 비유하여 설명하고 있는데, 근육을 키우면 힘이 세지듯 뇌도 쓸수록 효율이 높아집니다. 마치 무거운 덤벨을 들수록 근력이 좋아지는 것과 같습니다. 흥미로운 점은 신체 근육은 과도한 운동 시 \u003cb class=\"key\">근육 \u003c/b>\u003cb class=\"key\">경직\u003c/b>(Muscle-bound) 상태가 될 수 있지만, 인지 능력은 그런 부작용이 거의 없다는 것입니다. 뇌는 무한한 용량을 가진 \u003cb class=\"key\">디스크\u003c/b>와 같아서, 더 많이 담을수록 더 담을 공간이 잘 마련되는 역설적인 특징을 가집니다.\u003c/div>","segs":[{"n":2,"text":"혹시 뇌도 근육처럼 운동할 수 있다는 말을 들어보셨나요? 우리 뇌는 가소성이라는 성질이 있어서 학습할수록 구조가 변하고 똑똑해진답니다. 지문에서는 근육과 기억을 비교하는데요, 보통 신체 근육은 너무 무리하면 근육 경직이 오기도 하죠. 하지만 우리의 인지 능력은 마치 무한한 용량을 가진 디스크처럼 더 많이 기억할수록 공간이 더 넓어지는 마법 같은 일이 일어납니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>도입: 기억과 근육의 비유\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>기억은 많이 할수록 능력이 향상되며, 이는 여러 면에서 \u003cb class=\"key\">근육\u003c/b>과 비슷하다는 \u003cb class=\"key\">비유\u003c/b>로 글을 시작합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>전개: 공통점과 차이점\u003csmall>근거 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>둘 다 \u003cb class=\"key\">연습\u003c/b>과 발달이 필요하지만, 근육은 과훈련의 \u003cb class=\"key\">부작용\u003c/b>이 있는 반면 기억은 한계가 없다는 차이를 강조합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>주장: 기억 훈련의 용이성\u003csmall>주장 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>기억력도 다른 기술처럼 \u003cb class=\"key\">학습\u003c/b>이 가능하며, 특히 \u003cb class=\"key\">악기\u003c/b> 연주보다 더 쉽게 발달시킬 수 있다고 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>결론: 훈련의 부수적 효과\u003csmall>결론 · 문장 7\u003c/small>\u003c/h4>\u003cp>기억력을 훈련하면 집중력, \u003cb class=\"key\">관찰력\u003c/b>, 상상력 등 다른 인지 능력도 함께 \u003cb class=\"key\">습득\u003c/b>하게 됩니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 비유를 통해 시작해서 기억력 훈련의 장점을 나열하는 순서로 전개됩니다.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서는 기억과 근육의 비유를 제시합니다. 많이 기억할수록 더 많이 기억할 수 있다는 역설적인 믿음을 바탕으로 기억을 근육에 비유하며 흥미를 유발하죠.","hl":"f0"},{"n":5,"text":"세 번째와 네 번째 문장은 공통점과 차이점을 다룹니다. 둘 다 연습이 필요하다는 점은 같지만, 근육은 과도하게 훈련하면 뻣뻣해지는 한계가 있는 반면 기억은 한계가 없다는 점을 강조하며 기억의 우수성을 보여줍니다.","hl":"f1"},{"n":6,"text":"다섯 번째와 여섯 번째 문장에서는 기억 훈련이 생각보다 어렵지 않다는 주장을 펼칩니다. 악기를 배우는 것보다 훈련된 기억력을 발달시키는 것이 훨씬 쉽다고 말하며 독자에게 자신감을 심어주네요.","hl":"f2"},{"n":7,"text":"마지막 일곱 번째 문장은 결론입니다. 기억력이 좋아지면 단순히 암기만 잘하는 게 아니라 집중력이나 관찰력, 상상력 같은 다른 소중한 능력들까지 덤으로 얻게 된다고 마무리합니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">비교·대조\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 번째 문장에서 기억력이 \u003cb class=\"key\">사용\u003c/b>할수록 좋아진다는 핵심 주장을 던진 후, 이를 \u003cb class=\"key\">근육\u003c/b>에 비유하여 논리를 전개합니다. 근육과의 공통점과 차이점을 대조하며 기억 훈련의 \u003cb class=\"key\">우월성\u003c/b>과 용이성을 입증하는 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>The difference is (4)\u003c/b>\u003cspan>대조를 통한 특징 강조\u003c/span>\u003cb>As a matter of fact (6)\u003c/b>\u003cspan>사실 강조 및 구체적 비교\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">the more you remember\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Memory\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">muscle\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">trained memory\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">greater power of concentration\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Muscle (근육)\u003c/th>\u003cth>Memory (기억)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>과훈련 시 경직됨\u003c/td>\u003ctd>한계 없이 발달 가능\u003c/td>\u003c/tr>\u003ctr>\u003ctd>적절한 사용이 필수적\u003c/td>\u003ctd>악기보다 배우기 쉬움\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 처음부터 끝까지 기억과 근육을 나란히 놓는 비교 대조의 전개 방식을 취하고 있습니다. 특히 첫 문장에서 주제를 바로 드러내는 두괄식 구조를 가지고 있어서 독자가 글의 방향을 잡기가 아주 편하죠.","hl":"ty"},{"n":9,"text":"문장 사이의 연결 고리를 보면 네 번째 문장에서 The difference is라는 표현으로 차이점을 명확히 짚어줍니다. 또한 여섯 번째 문장의 As a matter of fact는 사실을 강조하면서 구체적인 비교 대상을 제시하는 역할을 하고 있어요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>believe\u003c/b>\u003cem>동사\u003c/em>\u003cspan>믿다\u003c/span>\u003c/div>\u003cdiv>\u003cb>the more ~, the more ...\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>더 많이 ~할수록, 더 많이 ...하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>memo \u003cspan class=\"ko\">말하자면 ~보다\u003c/span>\u003cspan class=\"en\">than, say,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">악기를 연주하는 것을 배우는 것보다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">learn\u003c/span> to play a musical instrument.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사실, 말하자면 악기를 연주하는 것을 배우는 것보다 훈련된 기억력을 발달시키는 것이 훨씬 더 쉽다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 기억력 발달의 \u003cb class=\"key\">난이도\u003c/b>를 구체적인 예시인 악기 연주와 비교합니다. 생각보다 기억력 훈련이 \u003cb class=\"key\">접근성\u003c/b>이 높고 실천하기 쉽다는 점을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가주어\u003c/span> : it [가주어] + is + 형용사 + to-v [진주어] : \"(해석하지 않음)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">비교급 강조 부사\u003c/span> : much [부사] + easier [비교급 형용사] : \"훨씬\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">비교 대상의 병렬 구조\u003c/span> : to develop [진주어] + than + to learn [비교 대상] : \"배우는 것\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"As a matter of fact, 사실. it is much easier, 훨씬 더 쉽다. to develop a trained memory, 훈련된 기억력을 발달시키는 것이. than, say, 말하자면 ~보다. to learn to play a musical instrument, 악기를 연주하는 것을 배우는 것보다. 이 문장 전체를 해석하면, 사실, 말하자면 악기를 연주하는 것을 배우는 것보다 훈련된 기억력을 발달시키는 것이 훨씬 더 쉽다.","hl":"m"},{"n":28,"text":"사실 기억력을 키우는 게 우리가 생각하는 것보다 어렵지 않아요. 악기 하나 마스터하는 것보다 훨씬 더 쉽고 간단하다고 말하고 있네요.","hl":"mn"},{"n":29,"text":"첫 번째로 it은 해석하지 않는 가주어이고, 진짜 주어는 세 번째 조각의 to develop입니다. 두 번째로 much는 비교급 easier를 꾸며주는 비교급 강조 표현이에요. 마지막으로 to learn은 비교하는 대상인 to develop과 짝을 맞추기 위해 to부정사 형태로 쓰인 병렬 구조입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">훈련된 기억력과 함께\u003c/span>\u003cspan class=\"en\">Along with a \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">trained \u003c/span>\u003cspan class=\"tgt\">memory\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은 아마도 얻게 될 것이다\u003c/span>\u003cspan class=\"en\">you will probably acquire\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 큰 집중력을,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">greater \u003c/span>\u003cspan class=\"tgt\">power \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">concentration, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 순수한 관찰력을,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">purer \u003c/span>\u003cspan class=\"tgt\">sense \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">observation, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 아마도, 더 강한 상상력을.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">perhaps, \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">stronger \u003c/span>\u003cspan class=\"tgt\">imagination\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">훈련된 기억력과 함께 여러분은 아마도 더 큰 집중력, 더 순수한 관찰력, 그리고 아마도 더 강한 상상력을 얻게 될 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 기억력을 훈련하는 과정이 단순히 암기력에만 머물지 않고 전반적인 \u003cb class=\"key\">인지 \u003c/b>\u003cb class=\"key\">능력\u003c/b>을 향상시킨다는 결론을 내립니다. 집중력, 관찰력, 상상력이 기억력과 함께 발달하는 \u003cb class=\"key\">동반 \u003c/b>\u003cb class=\"key\">상승\u003c/b> 효과를 강조하며 글을 마무리합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사의 명사 수식\u003c/span> : trained [과거분사] + memory [명사] : \"훈련된 기억력\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명사구의 병렬 구조\u003c/span> : A, B, and C [병렬 구조] : \"더 큰 집중력, 더 순수한 관찰력, 그리고 더 강한 상상력\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Along with a trained memory, 훈련된 기억력과 함께. you will probably acquire, 여러분은 아마도 얻게 될 것이다. a greater power of concentration, 더 큰 집중력을. a purer sense of observation, 더 순수한 관찰력을. and perhaps, a stronger imagination, 그리고 아마도, 더 강한 상상력을.. 이 문장 전체를 해석하면, 훈련된 기억력과 함께 여러분은 아마도 더 큰 집중력, 더 순수한 관찰력, 그리고 아마도 더 강한 상상력을 얻게 될 것이다.","hl":"m"},{"n":31,"text":"기억력 훈련은 단순히 무언가를 외우는 기술에서 끝나지 않아요. 기억력이 좋아지면 집중력이나 관찰력 같은 다른 인지 능력들도 함께 좋아지는 부가적인 이점이 생긴다는 점을 강조하는 문장입니다. 전반적인 사고 능력이 동반 상승한다는 뜻이죠.","hl":"mn"},{"n":32,"text":"어법 포인트 두 가지를 살펴볼게요. 첫 번째로 trained memory를 보면 과거분사 trained가 뒤에 있는 명사를 꾸며주고 있어요. 기억력이 이미 훈련을 받은 완료된 상태를 말하는 거죠. 두 번째로 문장 끝부분에 쉼표와 and를 사용해서 집중력, 관찰력, 상상력이라는 세 가지 명사구가 병렬 구조로 연결되어 동사의 목적어 역할을 하고 있다는 점을 확인하세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>기억력은 사용하면 할수록 그 용량이 확장되는 특징을 가지며, 글쓴이는 이를 \u003cb class=\"key\">근육\u003c/b>에 비유하여 설명합니다.\u003c/li>\u003cli>근육과 기억 모두 \u003cb class=\"key\">연습\u003c/b>이 필수적이지만, 근육은 과도한 훈련 시 뻣뻣해지는 \u003cb class=\"key\">한계\u003c/b>가 있는 반면 기억은 그렇지 않습니다.\u003c/li>\u003cli>기억력 훈련은 기술처럼 배울 수 있으며, \u003cb class=\"key\">악기\u003c/b>를 배우는 것보다 더 쉬운 과정으로 훈련된 기억력을 만들 수 있습니다.\u003c/li>\u003cli>훈련된 기억력을 갖추면 부수적으로 집중력, 관찰력, \u003cb class=\"key\">상상력\u003c/b>과 같은 인지적 이점들을 함께 얻게 됩니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Memory is like a muscle that improves with exercise, but unlike a muscle, it has no limits on how much it can be trained.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">기억은 \u003cb class=\"key\">근육\u003c/b>과 유사하여 훈련할수록 발달하지만, 신체 근육과 달리 \u003cb class=\"key\">한계\u003c/b>나 부작용 없이 무한히 확장될 수 있는 특징을 가집니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":33,"text":"자, 오늘 수업을 통해 기억력은 쓰면 쓸수록 무한히 성장한다는 사실을 배웠습니다. 여러분도 악기를 배우는 것보다 쉬운 기억 훈련을 통해 집중력과 상상력을 키워보길 바랍니다. 오늘 배운 비유와 대조의 구조를 잘 복습해 보세요. 수고하셨습니다!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
