<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터2 Reading28 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터2 Reading28","audioDir":"reading28_audio","preview":false,"count":42,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.668em\">Reading\u003cbr>28\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터 레벨2\u003c/div>\u003ch1>Energy Transfer and the Length of Food Chains\u003c/h1>\u003ch2>먹이 사슬과 에너지 전달의 한계\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>먹이 사슬은 \u003cb class=\"key\">에너지의 \u003c/b>\u003cb class=\"key\">이동\u003c/b> 과정으로, 각 단계에서 발생하는 막대한 \u003cb class=\"key\">열 \u003c/b>\u003cb class=\"key\">손실\u003c/b> 때문에 사슬의 길이는 보통 4~5단계로 제한됩니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The number of links in a food chain is limited due to the significant loss of energy as heat at each transfer level.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 생물학의 기초이면서도 수능 독해에서 자주 다루는 소재인 먹이 사슬과 에너지 효율에 대해 공부해 볼 거예요. 이 글은 먹이 사슬이 단순한 먹고 먹히는 관계를 넘어, 왜 특정 길이 이상으로 길어질 수 없는지를 과학적으로 설명하고 있습니다. 오늘 수업을 통해 먹이 사슬의 에너지 이동과 그 한계에 대한 요지를 완벽하게 파악해 봅시다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">생태계 내에서 에너지는 \u003cb class=\"key\">먹이 \u003c/b>\u003cb class=\"key\">사슬\u003c/b>(food chain)을 통해 한 생명체에서 다른 생명체로 이동합니다. 식물이 태양 빛을 이용해 에너지를 만들면, 이를 먹는 초식 동물과 다시 그 동물을 먹는 육식 동물로 에너지가 흐르는 것이죠. 하지만 에너지가 다음 단계인 \u003cb class=\"key\">영양 \u003c/b>\u003cb class=\"key\">수준\u003c/b>(trophic level)으로 넘어갈 때마다 약 80~90%가 \u003cb class=\"key\">열 \u003c/b>\u003cb class=\"key\">에너지\u003c/b>로 사라져 버립니다. 마치 밑 빠진 독에 물을 붓는 것처럼, 위로 갈수록 남는 에너지가 급격히 줄어듭니다. 이 때문에 먹이 사슬은 무한정 길어질 수 없으며, 사자 같은 \u003cb class=\"key\">최상위 \u003c/b>\u003cb class=\"key\">포식자\u003c/b>가 먹을 에너지가 부족하지 않으려면 사슬이 너무 길어서는 안 됩니다.\u003c/div>","segs":[{"n":2,"text":"본격적인 독해에 앞서 배경지식을 좀 쌓아볼까요? 생태계의 모든 에너지는 식물의 광합성에서 시작됩니다. 이 에너지가 먹이 사슬을 타고 다음 단계로 이동하는데, 여기서 핵심은 에너지 효율이 굉장히 낮다는 점이에요. 유기체가 활동하고 숨 쉬는 과정에서 엄청난 양의 에너지가 열로 빠져나가거든요. 마치 우리가 돈을 송금할 때마다 수수료를 떼이는 것과 비슷하다고 생각하면 이해가 쉬울 거예요. 결국 마지막 단계에 이르면 남는 에너지가 거의 없게 됩니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>먹이 사슬의 정의\u003csmall>도입 · 문장 1–4\u003c/small>\u003c/h4>\u003cp>먹이 사슬은 \u003cb class=\"key\">식물\u003c/b>의 에너지원으로부터 에너지가 전달되는 과정을 의미하며, 일련의 유기체를 거치는 \u003cb class=\"key\">반복적인 \u003c/b>\u003cb class=\"key\">과정\u003c/b>입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>구체적 사례 제시\u003csmall>예시 · 문장 5–7\u003c/small>\u003c/h4>\u003cp>\u003cb class=\"key\">초원\u003c/b>에서 풀, 토끼, 여우로 이어지는 관계를 통해 에너지가 더 높은 \u003cb class=\"key\">영양 \u003c/b>\u003cb class=\"key\">수준\u003c/b>으로 전달되는 모습을 보여줍니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>에너지 손실의 원칙\u003csmall>근거 · 문장 8–9\u003c/small>\u003c/h4>\u003cp>에너지가 이동할 때마다 \u003cb class=\"key\">열\u003c/b>로 상당량이 손실되어, 먹이 사슬의 \u003cb class=\"key\">연결 \u003c/b>\u003cb class=\"key\">고리\u003c/b> 개수가 4~5개로 제한됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>에너지 효율과 사슬의 길이\u003csmall>결론 · 문장 10\u003c/small>\u003c/h4>\u003cp>먹이 사슬의 \u003cb class=\"key\">길이\u003c/b>가 짧을수록 생명체가 섭취할 수 있는 \u003cb class=\"key\">가용 \u003c/b>\u003cb class=\"key\">에너지\u003c/b> 양이 많아집니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 먹이 사슬의 정의에서 시작하여 실제 예시를 거쳐, 에너지 손실이라는 결정적인 이유를 밝히는 구조로 되어 있습니다.","hl":null},{"n":4,"text":"첫 번째 단계인 첫 번째 문장부터 네 번째 문장까지는 먹이 사슬의 정의를 내리고 있어요. 과학 시간에 자주 들어본 Food chain이 사실은 식물이라는 에너지원으로부터 에너지가 이동하는 Transfer 과정이라는 점을 강조하고 있죠.","hl":"f0"},{"n":5,"text":"두 번째 단계인 다섯 번째부터 일곱 번째 문장은 우리에게 익숙한 초원의 예시를 들어줍니다. 풀이 토끼에게, 토끼가 여우에게 먹히는 과정을 통해 에너지가 높은 영양 수준으로 올라가는 구체적인 모습을 보여줍니다.","hl":"f1"},{"n":6,"text":"세 번째 단계인 여덟 번째와 아홉 번째 문장은 이 글의 핵심적인 근거가 나옵니다. 에너지가 이동할 때마다 팔십에서 구십 퍼센트라는 엄청난 양이 열로 사라지기 때문에, 연결 고리가 네다섯 개로 제한될 수밖에 없다는 인과 관계를 설명합니다.","hl":"f2"},{"n":7,"text":"마지막 네 번째 단계인 열 번째 문장은 결론입니다. 먹이 사슬의 길이가 짧으면 짧을수록 그만큼 잃어버리는 에너지가 적기 때문에, 우리가 실제로 섭취할 수 있는 가용 에너지는 더 커진다는 사실을 정리하며 끝을 맺습니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">인과\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 10번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글의 전반부에서는 먹이 사슬의 개념과 예시를 설명하고, 후반부에서 \u003cb class=\"key\">에너지 \u003c/b>\u003cb class=\"key\">손실\u003c/b>이라는 원인을 제시합니다. 이러한 원인 때문에 먹이 사슬의 길이가 제한된다는 \u003cb class=\"key\">인과 \u003c/b>\u003cb class=\"key\">관계\u003c/b>를 도출합니다. 마지막 문장에서 사슬의 길이와 \u003cb class=\"key\">에너지 \u003c/b>\u003cb class=\"key\">섭취량\u003c/b> 사이의 상관관계를 주제로 제시하며 마무리합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>This is an example (6)\u003c/b>\u003cspan>예시 제시\u003c/span>\u003cb>According to observations (8)\u003c/b>\u003cspan>객관적 근거 제시\u003c/span>\u003cb>Hence (9)\u003c/b>\u003cspan>인과적 결론 유도\u003c/span>\u003cb>The shorter ..., the greater ... (10)\u003c/b>\u003cspan>상관관계를 통한 요지 강조\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">food chain\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">transfer of food energy\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">series of organisms\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">trophic level\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">links\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">available energy intake\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 원인과 결과를 설명하는 인과 구조를 취하고 있습니다. 먹이 사슬의 에너지 손실이라는 원인이 사슬의 길이 제한이라는 결과를 만든다는 것이죠. 문장의 구성으로 보면 주제문을 가장 마지막에 배치하여 핵심 내용을 강조하는 미괄식 패턴을 보여주고 있습니다.","hl":"ty"},{"n":9,"text":"문장 속 신호어들을 잘 살펴봐야 해요. 아홉 번째 문장의 Hence는 앞서 말한 에너지 손실의 결과를 이끌어내는 아주 중요한 연결어입니다. 또한 마지막 문장에서 사용된 The shorter, the greater 구문은 두 변수 사이의 상관관계를 나타내며 필자가 하고 싶은 핵심 주장을 아주 강력하게 전달하고 있죠.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>food chain\u003c/b>\u003cem>명사\u003c/em>\u003cspan>먹이 사슬\u003c/span>\u003c/div>\u003cdiv>\u003cb>quite often\u003c/b>\u003cem>부사\u003c/em>\u003cspan>상당히 자주\u003c/span>\u003c/div>\u003cdiv>\u003cb>transfer\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이동, 전달\u003c/span>\u003c/div>\u003cdiv>\u003cb>energy source\u003c/b>\u003cem>명사\u003c/em>\u003cspan>에너지원\u003c/span>\u003c/div>\u003cdiv>\u003cb>organism\u003c/b>\u003cem>명사\u003c/em>\u003cspan>유기체, 생물\u003c/span>\u003c/div>\u003cdiv>\u003cb>repeated\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>반복되는\u003c/span>\u003c/div>\u003cdiv>\u003cb>being eaten\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>먹히는 것\u003c/span>\u003c/div>\u003cdiv>\u003cb>grassland\u003c/b>\u003cem>명사\u003c/em>\u003cspan>초원\u003c/span>\u003c/div>\u003cdiv>\u003cb>in turn\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>결국, 차례로\u003c/span>\u003c/div>\u003cdiv>\u003cb>course\u003c/b>\u003cem>명사\u003c/em>\u003cspan>과정, 경로\u003c/span>\u003c/div>\u003cdiv>\u003cb>trophic level\u003c/b>\u003cem>명사\u003c/em>\u003cspan>영양 수준, 영양 단계\u003c/span>\u003c/div>\u003cdiv>\u003cb>observation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>관찰\u003c/span>\u003c/div>\u003cdiv>\u003cb>potential energy\u003c/b>\u003cem>명사\u003c/em>\u003cspan>잠재적 에너지\u003c/span>\u003c/div>\u003cdiv>\u003cb>be lost as\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 손실되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>heat\u003c/b>\u003cem>명사\u003c/em>\u003cspan>열\u003c/span>\u003c/div>\u003cdiv>\u003cb>hence\u003c/b>\u003cem>부사\u003c/em>\u003cspan>이런 이유로, 따라서\u003c/span>\u003c/div>\u003cdiv>\u003cb>link\u003c/b>\u003cem>명사\u003c/em>\u003cspan>연결, 고리\u003c/span>\u003c/div>\u003cdiv>\u003cb>limited\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>제한된\u003c/span>\u003c/div>\u003cdiv>\u003cb>available\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>이용 가능한\u003c/span>\u003c/div>\u003cdiv>\u003cb>intake\u003c/b>\u003cem>명사\u003c/em>\u003cspan>섭취량\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"중요한 단어를 몇 개 짚어볼까요? Transfer는 단순한 이동을 넘어 에너지가 전달되는 과정을 뜻합니다. Trophic level은 생태학에서 말하는 영양 수준 혹은 영양 단계를 의미하니 꼭 기억해 두세요. 그리고 Potential energy는 잠재적인 에너지를 말하는데, 여기서는 식물이 축적한 본래의 에너지를 뜻합니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">transfer\u003c/b>\u003cspan class=\"m\">이동, 전달\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">transmission\u003c/span>\u003cspan class=\"s\">movement\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">potential\u003c/b>\u003cspan class=\"m\">잠재적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">possible\u003c/span>\u003cspan class=\"s\">latent\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">actual\u003c/span>\u003cspan class=\"a\">definite\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">limited\u003c/b>\u003cspan class=\"m\">제한된\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">restricted\u003c/span>\u003cspan class=\"s\">confined\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">infinite\u003c/span>\u003cspan class=\"a\">boundless\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">repeated\u003c/b>\u003cspan class=\"m\">반복되는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">recurrent\u003c/span>\u003cspan class=\"s\">continuous\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">occasional\u003c/span>\u003cspan class=\"a\">sporadic\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">available\u003c/b>\u003cspan class=\"m\">이용 가능한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">accessible\u003c/span>\u003cspan class=\"s\">obtainable\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unavailable\u003c/span>\u003cspan class=\"a\">inaccessible\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 정리해 봅시다. Transfer는 Transmission이나 Movement로 바꿔 쓸 수 있고, Limited는 Restricted와 비슷한 의미입니다. Limited의 반대말은 끝이 없다는 뜻인 Infinite나 Boundless가 되겠죠. Potential의 반대말로는 실제적인 상태를 뜻하는 Actual이나 Definite를 기억해 두면 도움이 될 거예요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은 들어본 적이 있을 것이다\u003c/span>\u003cspan class=\"en\">You \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">may \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">heard\u003c/span> of\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">먹이 사슬에 대해\u003c/span>\u003cspan class=\"en\">the food chain\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상당히 자주\u003c/span>\u003cspan class=\"en\">quite often\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">과학 시간에\u003c/span>\u003cspan class=\"en\">in science class.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여러분은 과학 시간에 먹이 사슬에 대해 상당히 자주 들어본 적이 있을 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 독자들에게 익숙한 소재인 \u003cb class=\"key\">먹이 \u003c/b>\u003cb class=\"key\">사슬\u003c/b>을 언급하며 글의 화두를 던지는 도입부 문장입니다. \u003cb class=\"key\">조동사\u003c/b> 구문을 통해 과거의 경험을 부드럽게 추측하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 + have p.p.\u003c/span> : may + have + 과거분사(p.p.) : \"들어본 적이 있을 것이다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"You may have heard of, 여러분은 들어본 적이 있을 것이다. the food chain, 먹이 사슬에 대해. quite often, 상당히 자주. in science class, 과학 시간에. 이 문장 전체를 해석하면, 여러분은 과학 시간에 먹이 사슬에 대해 상당히 자주 들어본 적이 있을 것이다.","hl":"m"},{"n":13,"text":"첫 번째 문장은 우리가 학교 과학 시간에 자주 배웠던 먹이 사슬이라는 친숙한 주제로 이야기를 시작하고 있어요.","hl":"mn"},{"n":14,"text":"여기서 핵심 어법은 may have heard입니다. 조동사 may 뒤에 완료형인 have p.p.가 오면 과거 사실에 대한 불확실한 추측을 나타내서 들어봤을지도 모른다는 뜻이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무엇인가\u003c/span>\u003cspan class=\"en\">What \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">먹이 사슬은\u003c/span>\u003cspan class=\"en\">a food chain?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">먹이 사슬은 무엇인가?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 본격적인 설명을 위해 독자에게 \u003cb class=\"key\">질문\u003c/b>을 던져 호기심을 유발하고 \u003cb class=\"key\">정의\u003c/b>를 이끌어내는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사의 의문문\u003c/span> : 의문사 + is(be동사) + 주어 : \"무엇인가\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"What is, 무엇인가. a food chain?, 먹이 사슬은. 이 문장 전체를 해석하면, 먹이 사슬은 무엇인가?","hl":"m"},{"n":16,"text":"두 번째 문장은 짧은 질문을 통해서 먹이 사슬의 정확한 개념이 무엇인지 독자가 생각하게 만듭니다.","hl":"mn"},{"n":17,"text":"의문문 구조를 살펴볼까요. 의문사 What이 가장 앞에 오고 주어와 동사의 순서가 바뀌어 비동사 is가 주어 앞에 위치했습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 의미한다\u003c/span>\u003cspan class=\"en\">It \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">means\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">식품 에너지가 이동하는 것을\u003c/span>\u003cspan class=\"en\">the \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">transfer\u003c/span> of food energy\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">식물에 있는 에너지원으로부터\u003c/span>\u003cspan class=\"en\">from its source in plants.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 식품 에너지가 식물에 있는 에너지원으로부터 이동하는 것을 의미한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 먹이 사슬의 핵심을 \u003cb class=\"key\">에너지 \u003c/b>\u003cb class=\"key\">이동\u003c/b>으로 정의하며, 그 모든 에너지의 시작점이 \u003cb class=\"key\">식물\u003c/b>임을 밝히고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주어와 동사의 수 일치\u003c/span> : It(3인칭 단수 주어) + means(단수 동사) : \"의미한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명사\u003c/span> : the + transfer [명사] + of : \"이동\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"It means, 그것은 의미한다. the transfer of food energy, 식품 에너지가 이동하는 것을. from its source in plants, 식물에 있는 에너지원으로부터. 이 문장 전체를 해석하면, 그것은 식품 에너지가 식물에 있는 에너지원으로부터 이동하는 것을 의미한다.","hl":"m"},{"n":19,"text":"세 번째 문장은 먹이 사슬의 정의를 설명합니다. 모든 에너지의 근원은 식물이며, 그 에너지가 전달되는 과정이 바로 먹이 사슬이라는 것이죠.","hl":"mn"},{"n":20,"text":"첫 번째 어법 포인트는 수 일치입니다. 주어 It이 삼인칭 단수이기 때문에 동사 mean 뒤에 s를 붙인 means가 쓰였습니다. 두 번째로 transfer는 여기서 이동이라는 뜻의 명사로 사용되어 에너지의 흐름을 나타냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 이동은\u003c/span>\u003cspan class=\"en\">The transfer\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이루어진다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">done\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일련의 유기체를 통해\u003c/span>\u003cspan class=\"en\">through a series of organisms\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">반복되는 과정 동안\u003c/span>\u003cspan class=\"en\">during the repeated process\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">먹고 먹히는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">eating \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">being \u003c/span>\u003cspan class=\"tgt\">eaten\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 이동은 먹고 먹히는 반복되는 과정 동안 일련의 유기체를 통해 이루어진다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 에너지가 생태계 내에서 어떻게 이동하는지 구체적으로 설명하는 문장입니다. \u003cb class=\"key\">포식과 \u003c/b>\u003cb class=\"key\">피식\u003c/b>이라는 관계가 반복되면서 생물들 사이에서 \u003cb class=\"key\">에너지 \u003c/b>\u003cb class=\"key\">전달\u003c/b>이 일어남을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태(be + p.p.)\u003c/span> : be동사 (is) + 과거분사 (done) : \"이루어진다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사의 병렬 구조 및 수동형\u003c/span> : 전치사 (of) + [동명사 (eating) + and + 동명사의 수동형 (being eaten)] : \"먹고 먹히는 것의\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"The transfer, 그 이동은. is done, 이루어진다. through a series of organisms, 일련의 유기체를 통해. during the repeated process, 반복되는 과정 동안. of eating and being eaten, 먹고 먹히는. 이 문장 전체를 해석하면, 그 이동은 먹고 먹히는 반복되는 과정 동안 일련의 유기체를 통해 이루어진다.","hl":"m"},{"n":22,"text":"에너지가 생태계에서 어떻게 흐르는지 보여주는 핵심 문장이에요. 포식과 피식이라는 관계가 반복되면서 에너지 전달이 일어난다는 점을 잘 기억해 두세요.","hl":"mn"},{"n":23,"text":"첫 번째로 is done은 이동이 스스로 되는 게 아니라 수동적으로 이루어지는 것이라 수동태를 썼어요. 두 번째로 of 뒤에 eating과 being eaten이 나란히 와서 먹는 행위와 수동형 동명사인 먹히는 행위라는 상호 작용을 동시에 표현하고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">초원에서는\u003c/span>\u003cspan class=\"en\">In a grassland,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">풀이 토끼에게 먹히지만\u003c/span>\u003cspan class=\"en\">grass \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">eaten \u003c/span>\u003cspan class=\"tgt\">by\u003c/span> rabbits,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">결국 토끼는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">while\u003c/span> rabbits in turn\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여우에게 먹힌다.\u003c/span>\u003cspan class=\"en\">are eaten by foxes.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">초원에서는 풀이 토끼에게 먹히지만 결국 토끼는 여우에게 먹힌다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 설명한 일반적인 원리를 \u003cb class=\"key\">초원 \u003c/b>\u003cb class=\"key\">생태계\u003c/b>의 구체적인 예시로 풀어서 보여줍니다. 풀에서 토끼, 그리고 여우로 이어지는 \u003cb class=\"key\">에너지의 \u003c/b>\u003cb class=\"key\">흐름\u003c/b>을 묘사합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : be동사 (is) + 과거분사 (eaten) + by : \"~에게 먹힌다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사(대조/반전)\u003c/span> : S1 + V1, while + S2 + V2 : \"~하지만, ~하는 반면에\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"In a grassland, 초원에서는. grass is eaten by rabbits, 풀이 토끼에게 먹히지만. while rabbits in turn, 결국 토끼는. are eaten by foxes, 여우에게 먹힌다.. 이 문장 전체를 해석하면, 초원에서는 풀이 토끼에게 먹히지만 결국 토끼는 여우에게 먹힌다.","hl":"m"},{"n":25,"text":"초원 생태계를 예로 들어서 설명하고 있죠. 풀과 토끼, 그리고 여우 사이에 형성되는 에너지의 흐름을 실제 사례로 이해하면 더 쉬워요.","hl":"mn"},{"n":26,"text":"첫 번째 어법으로 is eaten by를 보시면 풀이 먹히는 대상이라 be p.p. 수동태가 쓰였어요. 두 번째로 while은 문장 중간에서 상황을 연결하며 반면에 혹은 하지만이라는 의미로 쓰인 접속사입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">This\u003c/span> is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사례이다\u003c/span>\u003cspan class=\"en\">an example of\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단순한 먹이 사슬의\u003c/span>\u003cspan class=\"en\">a simple food chain.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이는 단순한 먹이 사슬의 사례이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞선 초원의 예시를 \u003cb class=\"key\">먹이 \u003c/b>\u003cb class=\"key\">사슬\u003c/b>이라는 용어로 정의하는 문장입니다. 복잡하지 않은 일직선 구조의 \u003cb class=\"key\">에너지 \u003c/b>\u003cb class=\"key\">전달 \u003c/b>\u003cb class=\"key\">단계\u003c/b>를 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지시 대명사\u003c/span> : 주어 (This) : \"이는\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"This is, 이는. an example of, 사례이다. a simple food chain, 단순한 먹이 사슬의. 이 문장 전체를 해석하면, 이는 단순한 먹이 사슬의 사례이다.","hl":"m"},{"n":28,"text":"다섯 번째 문장에서 나온 초원의 예시를 먹이 사슬이라는 용어로 딱 정의해 주는 문장이에요. 아주 기초적이고 전형적인 에너지 전달 단계를 보여주고 있죠.","hl":"mn"},{"n":29,"text":"여기서 주어로 쓰인 This는 지시 대명사인데요. 바로 앞 문장에서 말한 초원의 생물들이 먹고 먹히는 그 구체적인 상황을 가리키고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">과정 속에서\u003c/span>\u003cspan class=\"en\">In the course of\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 먹이 사슬을 따르는\u003c/span>\u003cspan class=\"en\">following this food chain,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">식품 에너지는 전달된다\u003c/span>\u003cspan class=\"en\">food energy \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">transferred\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">식물에서 동물로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">plant \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">animal\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또는 더 높은 영양 수준으로\u003c/span>\u003cspan class=\"en\">or to a higher trophic level.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 먹이 사슬을 따르는 과정 속에서, 식품 에너지는 식물에서 동물로 또는 더 높은 영양 수준으로 전달된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 먹이 사슬을 통해 에너지가 \u003cb class=\"key\">상위 \u003c/b>\u003cb class=\"key\">단계\u003c/b>로 이동하는 원리를 설명합니다. 식물이 생산한 에너지가 포식자에게 순차적으로 \u003cb class=\"key\">전달\u003c/b>됨을 나타냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : be동사 (is) + 과거분사 (transferred) : \"전달된다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">from A to B 구문\u003c/span> : from [출발점] + to [도착점] : \"식물에서 동물로\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"In the course of, 과정 속에서. following this food chain, 이 먹이 사슬을 따르는. food energy is transferred, 식품 에너지는 전달된다. from the plant to the animal, 식물에서 동물로. or to a higher trophic level, 또는 더 높은 영양 수준으로. 이 문장 전체를 해석하면, 이 먹이 사슬을 따르는 과정 속에서, 식품 에너지는 식물에서 동물로 또는 더 높은 영양 수준으로 전달된다.","hl":"m"},{"n":31,"text":"이 문장은 먹이 사슬 내에서 에너지가 어떻게 이동하는지 보여줍니다. 식물이 가진 에너지가 포식자인 동물이나 더 높은 영양 수준으로 이동하는 과정을 설명하고 있어요.","hl":"mn"},{"n":32,"text":"첫 번째로 is transferred를 보면 에너지가 스스로 전달하는 게 아니라 전달되는 것이므로 수동태를 썼습니다. 두 번째로 from the plant to the animal은 에너지가 식물이라는 시작점에서 동물이라는 도달점으로 이동하는 것을 보여주는 중요한 구문입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">관찰에 따르면\u003c/span>\u003cspan class=\"en\">According to observations,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">각각의 이동 단계에서\u003c/span>\u003cspan class=\"en\">at each level of transfer,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">잠재적 에너지의 80~90퍼센트가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">80 \u003c/span>\u003cspan class=\"tgt\">– \u003c/span>\u003cspan class=\"tgt\">90 \u003c/span>\u003cspan class=\"tgt\">percent \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">potential \u003c/span>\u003cspan class=\"tgt\">energy \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">열로 손실된다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">lost\u003c/span> as heat.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">관찰에 따르면, 각각의 이동 단계에서 잠재적 에너지의 80~90퍼센트가 열로 손실된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 에너지 전달 과정의 \u003cb class=\"key\">비효율성\u003c/b>을 수치로 제시합니다. 대부분의 에너지가 다음 단계로 가기 전에 \u003cb class=\"key\">열\u003c/b>의 형태로 사라진다는 핵심 정보를 제공합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부분 표현의 수 일치\u003c/span> : [부분/퍼센트] + of + [명사(potential energy)] + [단수동사(is)] : \"잠재적 에너지의 80~90퍼센트가 ~이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : be동사 (is) + 과거분사 (lost) : \"손실된다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"According to observations, 관찰에 따르면. at each level of transfer, 각각의 이동 단계에서. 80 – 90 percent of the potential energy, 잠재적 에너지의 80~90퍼센트가. is lost as heat, 열로 손실된다. 이 문장 전체를 해석하면, 관찰에 따르면, 각각의 이동 단계에서 잠재적 에너지의 80~90퍼센트가 열로 손실된다.","hl":"m"},{"n":34,"text":"에너지 전달의 효율성을 설명하는 부분입니다. 다음 단계로 넘어갈 때 거의 대부분의 에너지가 열의 형태로 사라진다는 점이 이 글의 논리적 근거가 됩니다.","hl":"mn"},{"n":35,"text":"첫 번째로 주어를 보면 80 – 90 percent of the potential energy처럼 부분이나 퍼센트를 나타내는 말이 나오죠. 이럴 때는 of 뒤의 명사에 수 일치를 시켜야 하는데 energy가 단수이므로 동사도 단수인 is를 썼습니다. 두 번째로 is lost는 에너지가 손실되는 대상임을 나타내는 수동태 표현입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이런 이유로\u003c/span>\u003cspan class=\"en\">Hence\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단계나 연결의 수는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">number \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">steps \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">links\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하나의 과정 안에 있는 것이 제한된다\u003c/span>\u003cspan class=\"en\">in a course \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">limited\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보통 4~5개로\u003c/span>\u003cspan class=\"en\">usually to four or five.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이런 이유로 하나의 과정 안에 있는 단계나 연결의 수는 보통 4~5개로 제한된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 에너지 손실로 인해 먹이 사슬의 길이가 \u003cb class=\"key\">제한\u003c/b>될 수밖에 없는 결과를 도출합니다. 에너지가 부족해지므로 사슬의 \u003cb class=\"key\">단계\u003c/b>가 길어질 수 없음을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">the number of + 복수명사\u003c/span> : the number of + [복수명사(steps or links)] : \"단계나 연결의 수\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : be동사 (is) + 과거분사 (limited) : \"제한된다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Hence, 이런 이유로. the number of steps or links, 단계나 연결의 수는. in a course is limited, 하나의 과정 안에 있는 것이 제한된다. usually to four or five, 보통 4~5개로. 이 문장 전체를 해석하면, 이런 이유로 하나의 과정 안에 있는 단계나 연결의 수는 보통 4~5개로 제한된다.","hl":"m"},{"n":37,"text":"앞에서 말한 엄청난 에너지 손실 때문에 나타나는 최종 결과입니다. 전달할 에너지가 금방 바닥나기 때문에 먹이 사슬은 네다섯 단계 이상으로 길어지기 힘든 것이죠.","hl":"mn"},{"n":38,"text":"첫 번째로 the number of steps or links를 주의 깊게 보세요. the number of는 뒤에 복수명사가 와도 ~의 수라는 뜻이 되어 단수 취급을 하므로 동사를 is로 썼습니다. 두 번째로 is limited는 단계의 수가 제한되어 있다는 상태를 수동태로 깔끔하게 표현하고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 짧을수록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">The \u003c/span>\u003cspan class=\"tgt\">shorter\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">먹이 사슬이,\u003c/span>\u003cspan class=\"en\">the food chain,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 커진다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">greater\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이용 가능한 에너지 섭취량이.\u003c/span>\u003cspan class=\"en\">the available energy intake is.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">먹이 사슬이 짧을수록 이용 가능한 에너지 섭취량이 더 커진다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글의 결론 부분으로, 먹이 사슬의 \u003cb class=\"key\">길이\u003c/b>와 에너지 효율 사이의 관계를 요약합니다. 앞서 설명한 에너지 손실 원리를 바탕으로, \u003cb class=\"key\">단계\u003c/b>가 적을수록 보존되는 에너지가 많다는 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">주제\u003c/b>를 전달합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">the + 비교급 (조건)\u003c/span> : The + [비교급(short-shorter)] + [주어(the food chain)] + [동사(is-생략 가능)] : \"더 짧을수록\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">the + 비교급 (결과)\u003c/span> : the + [비교급(great-greater)] + [주어(the available energy intake)] + [동사(is)] : \"더 커진다\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"The shorter, 더 짧을수록. the food chain, 먹이 사슬이. the greater, 더 커진다. the available energy intake is, 이용 가능한 에너지 섭취량이.. 이 문장 전체를 해석하면, 먹이 사슬이 짧을수록 이용 가능한 에너지 섭취량이 더 커진다.","hl":"m"},{"n":40,"text":"이 문장은 전체 글의 핵심 결론을 담고 있어요. 앞부분에서 에너지가 단계마다 손실된다고 했죠. 그래서 사슬의 단계가 적어질수록 우리가 최종적으로 얻는 에너지 양은 많아진다는 논리적 결과를 보여줍니다.","hl":"mn"},{"n":41,"text":"여기서는 더 비교급 더 비교급 구문이 가장 중요해요. 첫 번째로 등장하는 The shorter는 먹이 사슬이 짧아지는 조건을 나타내고 두 번째로 나오는 the greater는 그 결과로 에너지 양이 많아짐을 강조합니다. 두 사건이 서로 비례해서 변하는 관계를 나타낼 때 쓰는 아주 중요한 표현이에요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>먹이 사슬은 식물에서 시작하여 유기체들을 거쳐 \u003cb class=\"key\">에너지의 \u003c/b>\u003cb class=\"key\">이동\u003c/b>이 일어나는 과정이다.\u003c/li>\u003cli>초원의 풀-토끼-여우 사례처럼 에너지는 더 높은 \u003cb class=\"key\">영양 \u003c/b>\u003cb class=\"key\">수준\u003c/b>으로 순차 전달된다.\u003c/li>\u003cli>이동 단계마다 잠재 에너지의 80~90퍼센트가 \u003cb class=\"key\">열로 \u003c/b>\u003cb class=\"key\">손실\u003c/b>되는 에너지 비효율이 발생한다.\u003c/li>\u003cli>에너지 손실 때문에 먹이 사슬은 대개 4~5단계로 \u003cb class=\"key\">길이가 \u003c/b>\u003cb class=\"key\">제한\u003c/b>되며, 짧을수록 효율이 좋다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The number of links in a food chain is limited due to the significant loss of energy as heat at each transfer level.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">먹이 사슬은 \u003cb class=\"key\">에너지의 \u003c/b>\u003cb class=\"key\">이동\u003c/b> 과정으로, 각 단계에서 발생하는 막대한 \u003cb class=\"key\">열 \u003c/b>\u003cb class=\"key\">손실\u003c/b> 때문에 사슬의 길이는 보통 4~5단계로 제한됩니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":42,"text":"오늘 우리는 먹이 사슬의 길이와 에너지 효율 사이의 관계에 대해 배웠습니다. 에너지는 전달될 때마다 열로 손실되기 때문에 사슬이 짧을수록 유리하다는 점, 이제 확실히 이해되시죠? 독해 지문에서 이런 과학적 원리가 나오면 당황하지 말고 오늘 배운 인과 관계를 떠올려 보세요. 수고 많으셨습니다!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
