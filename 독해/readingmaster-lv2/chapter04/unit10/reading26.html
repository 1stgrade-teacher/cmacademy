<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터2 Reading26 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터2 Reading26","audioDir":"reading26_audio","preview":false,"count":40,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.668em\">Reading\u003cbr>26\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터 레벨2\u003c/div>\u003ch1>The Power of Colors: Enhancing Memory and Brain Function\u003c/h1>\u003ch2>색의 힘: 기억력과 뇌 기능 향상\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>색은 기억력 향상에 도움을 주며, 특히 \u003cb class=\"key\">빨간색\u003c/b>은 사회적 상징성과 주의력을 높이는 특성 덕분에 \u003cb class=\"key\">정보 \u003c/b>\u003cb class=\"key\">회상\u003c/b>에 매우 효과적입니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Colors, especially red, enhance memory and brain function by increasing attention and utilizing societal associations.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 우리가 공부할 때나 일상생활에서 아주 유용한 정보를 담은 지문을 가져왔어요. 바로 색깔이 우리의 기억력에 어떤 영향을 미치는지에 대한 내용인데요. 오늘 수업을 통해 색채가 뇌 기능을 어떻게 돕고, 특히 어떤 색이 기억력을 높이는지 그 이유를 확실히 정리해 봅시다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">색채 심리학(Color Psychology)은 색상이 인간의 감정이나 행동, 인지 능력에 미치는 영향을 연구하는 분야입니다. 특정 색상은 뇌의 특정 영역을 자극하여 \u003cb class=\"key\">주의력(Attention)\u003c/b>을 높이거나 심리적 안정감을 주기도 합니다. 예를 들어, \u003cb class=\"key\">빨간색(Red)\u003c/b>은 자연계나 사회에서 위험이나 멈춤의 신호로 사용되어 우리 뇌를 즉각적으로 \u003cb class=\"key\">각성 \u003c/b>\u003cb class=\"key\">상태\u003c/b>로 만듭니다. 이는 마치 시험지에서 \u003cb class=\"key\">빨간색 \u003c/b>\u003cb class=\"key\">펜\u003c/b>으로 채점된 오답을 더 오래 기억하게 되는 것과 같은 일상적인 원리입니다. 이러한 시각적 자극은 정보가 단기 기억에서 \u003cb class=\"key\">장기 \u003c/b>\u003cb class=\"key\">기억\u003c/b>으로 넘어가는 과정에 도움을 줍니다.\u003c/div>","segs":[{"n":2,"text":"본격적으로 들어가기 전에 배경지식을 좀 알아볼까요? 색채 심리학에서는 색이 인간의 인지 능력에 큰 영향을 준다고 봅니다. 특히 빨간색은 생존과 직결된 위험이나 주의를 상징하기 때문에 우리 뇌를 각성시키는 효과가 있어요. 마치 우리가 길을 가다가 빨간 신호등을 보면 무의식적으로 멈춰 서서 주변을 살피게 되는 것과 같은 원리입니다. 이런 시각적 자극이 뇌에 강하게 남으면서 기억 저장도 더 잘 되게 도와주는 것이죠.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>색과 기억력의 상관관계\u003csmall>도입 · 문장 1\u003c/small>\u003c/h4>\u003cp>색이 \u003cb class=\"key\">기억력 \u003c/b>\u003cb class=\"key\">향상\u003c/b>에 긍정적인 영향을 미칠 수 있다는 일반적인 사실을 제시하며 글을 시작합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>알츠하이머 환자 연구 사례\u003csmall>예시 · 문장 2–3\u003c/small>\u003c/h4>\u003cp>\u003cb class=\"key\">색 \u003c/b>\u003cb class=\"key\">신호\u003c/b>가 알츠하이머 환자들의 이미지 회상을 돕는다는 구체적 실험 결과를 통해 \u003cb class=\"key\">컬러 \u003c/b>\u003cb class=\"key\">이미지\u003c/b>의 우수성을 강조합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>뇌 기능과 색상\u003csmall>근거 · 문장 4\u003c/small>\u003c/h4>\u003cp>빨간색과 파란색이 \u003cb class=\"key\">뇌 \u003c/b>\u003cb class=\"key\">기능\u003c/b>을 향상시키는 데 가장 효과적인 색이라는 또 다른 연구 내용을 소개합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>빨간색의 사회적 역할과 학습\u003csmall>설명 · 문장 5–7\u003c/small>\u003c/h4>\u003cp>정지 신호나 교사의 펜처럼 빨간색이 가진 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">역할\u003c/b> 때문에 사람들이 이를 중요한 것으로 인식하고 더 잘 기억하게 됨을 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>주의력 향상과 최종 결과\u003csmall>결론 · 문장 8–9\u003c/small>\u003c/h4>\u003cp>빨간색이 사람을 \u003cb class=\"key\">주의 \u003c/b>\u003cb class=\"key\">깊게(cautious)\u003c/b> 만들어 \u003cb class=\"key\">세부 \u003c/b>\u003cb class=\"key\">사항\u003c/b>에 집중하게 함으로써 결국 더 나은 기억력을 낳는다는 결론을 도출합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"글의 전체적인 흐름을 먼저 짚어볼게요. 이 글은 색과 기억력의 관계라는 주제를 먼저 던진 후, 구체적인 실험과 빨간색의 사례를 들어 결론으로 나아가는 구조입니다.","hl":null},{"n":4,"text":"첫 번째 단계인 첫 번째 문장에서는 색이 기억력을 향상시킬 수 있다는 핵심 주장을 제시하고 있습니다.","hl":"f0"},{"n":5,"text":"두 번째 단계인 두 번째와 세 번째 문장에서는 알츠하이머 환자들을 대상으로 한 구체적인 사례를 보여주는데요. 환자들이 흑백 이미지는 잊어버려도 컬러 이미지는 잘 기억했다는 점을 통해 색 신호의 중요성을 증명하고 있죠.","hl":"f1"},{"n":6,"text":"세 번째 단계인 네 번째 문장에서는 뇌 기능 향상에 가장 좋은 색으로 빨간색과 파란색을 지목하며 논의의 범위를 좁히고 있습니다.","hl":"f2"},{"n":7,"text":"네 번째 단계인 다섯 번째부터 일곱 번째 문장까지는 빨간색이 왜 일등인지 그 이유를 사회적 역할에서 찾고 있어요. 정지 신호나 선생님의 빨간 펜처럼 우리 삶에서 중요한 의미를 갖기 때문이라는 것이죠.","hl":"f3"},{"n":8,"text":"마지막 다섯 번째 단계인 여덟 번째와 아홉 번째 문장에서는 빨간색이 사람을 더 주의 깊게 만들어서 결국 사물을 더 잘 기억하게 한다는 결론을 내리고 있습니다.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 번째 문장에서 색이 \u003cb class=\"key\">기억력\u003c/b>을 돕는다는 핵심 주장을 던진 후, 이를 뒷받침하는 \u003cb class=\"key\">연구 \u003c/b>\u003cb class=\"key\">사례\u003c/b>와 구체적인 색상인 \u003cb class=\"key\">빨간색\u003c/b>의 작용 원리를 설명하는 구조입니다. 특히 후반부에서는 빨간색이 왜 효과적인지에 대한 \u003cb class=\"key\">인과 \u003c/b>\u003cb class=\"key\">관계\u003c/b>를 상세히 다루고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>For example (2)\u003c/b>\u003cspan>구체적 사례 도입\u003c/span>\u003cb>Furthermore (3)\u003c/b>\u003cspan>내용 첨가\u003c/span>\u003cb>Another study (4)\u003c/b>\u003cspan>추가 증거 제시\u003c/span>\u003cb>This means that (7)\u003c/b>\u003cspan>앞 내용 요약 및 의미 부여\u003c/span>\u003cb>Additionally (8)\u003c/b>\u003cspan>추가적인 원인 설명\u003c/span>\u003cb>This results in (9)\u003c/b>\u003cspan>최종 결과 제시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Colors\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">color cues\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">red and blue\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Red\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">red-colored object\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Colored images\u003c/th>\u003cth>Black-and-white images\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Could remember\u003c/td>\u003ctd>Could not remember\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Help improve recall\u003c/td>\u003ctd>No significant help\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글은 처음에 주제를 던지고 뒤에서 근거를 제시하는 두괄식 구조를 취하고 있습니다. 전개 방식은 주장과 근거, 그리고 구체적인 예시를 활용하는 방식을 사용하고 있어요. 첫 번째 문장이 주제문이라는 것을 기억하면서 읽는 것이 포인트입니다.","hl":"ty"},{"n":10,"text":"글의 흐름을 알려주는 신호어들을 잘 보세요. 두 번째 문장의 For example은 알츠하이머 사례를 소개하고, 세 번째 문장의 Furthermore는 추가 정보를 더해줍니다. 특히 아홉 번째 문장의 This results in은 이 모든 과정의 최종적인 결과를 정리해 주는 아주 중요한 연결고리예요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>improve\u003c/b>\u003cem>동사\u003c/em>\u003cspan>향상시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>memory\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기억력\u003c/span>\u003c/div>\u003cdiv>\u003cb>Alzheimer's\u003c/b>\u003cem>명사\u003c/em>\u003cspan>알츠하이머\u003c/span>\u003c/div>\u003cdiv>\u003cb>patient\u003c/b>\u003cem>명사\u003c/em>\u003cspan>환자\u003c/span>\u003c/div>\u003cdiv>\u003cb>cue\u003c/b>\u003cem>명사\u003c/em>\u003cspan>신호, 단서\u003c/span>\u003c/div>\u003cdiv>\u003cb>recall\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기억, 회상\u003c/span>\u003c/div>\u003cdiv>\u003cb>certain\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>특정한\u003c/span>\u003c/div>\u003cdiv>\u003cb>furthermore\u003c/b>\u003cem>부사\u003c/em>\u003cspan>게다가\u003c/span>\u003c/div>\u003cdiv>\u003cb>black-and-white\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>흑백의\u003c/span>\u003c/div>\u003cdiv>\u003cb>brain function\u003c/b>\u003cem>명사\u003c/em>\u003cspan>뇌 기능\u003c/span>\u003c/div>\u003cdiv>\u003cb>come out on top\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>1위를 차지하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>role\u003c/b>\u003cem>명사\u003c/em>\u003cspan>역할\u003c/span>\u003c/div>\u003cdiv>\u003cb>society\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사회\u003c/span>\u003c/div>\u003cdiv>\u003cb>stop sign\u003c/b>\u003cem>명사\u003c/em>\u003cspan>정지 신호\u003c/span>\u003c/div>\u003cdiv>\u003cb>typically\u003c/b>\u003cem>부사\u003c/em>\u003cspan>전형적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>real world\u003c/b>\u003cem>명사\u003c/em>\u003cspan>현실 세계\u003c/span>\u003c/div>\u003cdiv>\u003cb>be likely to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~할 가능성이 높다\u003c/span>\u003c/div>\u003cdiv>\u003cb>additionally\u003c/b>\u003cem>부사\u003c/em>\u003cspan>게다가\u003c/span>\u003c/div>\u003cdiv>\u003cb>cautious\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>주의 깊은, 조심스러운\u003c/span>\u003c/div>\u003cdiv>\u003cb>detail-oriented\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>세부적인 것을 지향하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>pay attention\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>주의를 기울이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>result in\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 초래하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>object\u003c/b>\u003cem>명사\u003c/em>\u003cspan>물체, 사물\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"여기서 꼭 기억해야 할 단어들이 있어요. 회상이나 기억을 뜻하는 recall, 그리고 전형적으로를 뜻하는 typically라는 단어는 독해에서 자주 나오니 체크해 두세요. 또 주의 깊은이라는 뜻의 cautious도 이 글의 핵심 논리를 설명하는 중요한 단어입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">improve\u003c/b>\u003cspan class=\"m\">향상시키다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">enhance\u003c/span>\u003cspan class=\"s\">boost\u003c/span>\u003cspan class=\"s\">better\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">worsen\u003c/span>\u003cspan class=\"a\">deteriorate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">recall\u003c/b>\u003cspan class=\"m\">회상하다, 기억해내다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">recollect\u003c/span>\u003cspan class=\"s\">remember\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class= 003c/span> memory.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">색은 기억력 향상에 도움을 줄 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글의 \u003cb class=\"key\">도입부\u003c/b>로, 색이 인간의 \u003cb class=\"key\">기억력\u003c/b>에 긍정적인 영향을 미친다는 \u003cb class=\"key\">주제\u003c/b>를 명확히 제시하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">help + 원형부정사\u003c/span> : help + [(to) improve (목적어)] : \"향상시키는 것을 돕다\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"Colors, 색은. can help, 도울 수 있다. improve memory, 기억력을 향상시키는 것을.. 이 문장 전체를 해석하면, 색은 기억력 향상에 도움을 줄 수 있다.","hl":"m"},{"n":14,"text":"이 문장은 전체 글의 주제를 던지고 있어요. 색이라는 요소가 우리 뇌의 기억력을 높이는 데 아주 긍정적인 역할을 한다는 점을 강조하고 있죠.","hl":"mn"},{"n":15,"text":"첫 번째 포인트로 help라는 동사를 봐 주세요. help는 뒤에 나오는 목적어 자리에 to를 생략한 원형부정사를 바로 쓸 수 있어서 여기서는 help improve라는 형태가 쓰였습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들어,\u003c/span>\u003cspan class=\"en\">For example,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">알츠하이머 환자들에 대한 일부 연구는\u003c/span>\u003cspan class=\"en\">some studies on Alzheimer's patients\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">발견했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">found \u003c/span>\u003cspan class=\"tgt\">that\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">색 신호가 향상시키는 것을 돕는다는 것을\u003c/span>\u003cspan class=\"en\">color cues helped improve\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">특정 이미지의 기억을.\u003c/span>\u003cspan class=\"en\">their recall of certain images.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">예를 들어, 알츠하이머 환자들에 대한 일부 연구는 색 신호가 특정 이미지의 기억을 향상시키는 데 도움이 된다는 것을 발견했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞선 주장에 대한 구체적인 \u003cb class=\"key\">예시\u003c/b>를 드는 문장입니다. \u003cb class=\"key\">알츠하이머 \u003c/b>\u003cb class=\"key\">환자\u003c/b>를 대상으로 한 연구를 통해 색이 \u003cb class=\"key\">기억 \u003c/b>\u003cb class=\"key\">회상\u003c/b>에 실질적인 도움을 준다는 근거를 제시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that\u003c/span> : found [타동사] + that [접속사] + S + V : \"~라는 것을 발견했다\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"For example, 예를 들어. some studies on Alzheimer's patients, 알츠하이머 환자들에 대한 일부 연구는. found that, 발견했다. color cues helped improve, 색 신호가 향상시키는 것을 돕는다는 것을. their recall of certain images, 특정 이미지의 기억을.. 이 문장 전체를 해석하면, 예를 들어, 알츠하이머 환자들에 대한 일부 연구는 색 신호가 특정 이미지의 기억을 향상시키는 데 도움이 된다는 것을 발견했다.","hl":"m"},{"n":17,"text":"앞의 주제를 뒷받침하기 위해 구체적인 사례를 들고 있어요. 기억력이 감퇴하는 질환인 알츠하이머 환자들의 사례를 통해 색이 기억에 주는 효과를 증명하고 있죠.","hl":"mn"},{"n":18,"text":"첫 번째로 found 뒤에 나오는 that을 보세요. 이 that은 뒤에 완벽한 문장을 데려와서 전체를 목적어 덩어리로 만드는 명사절 접속사예요. 두 번째로 on Alzheimer's patients에서 on은 알츠하이머 환자들에 대한 연구라는 주제를 나타내는 전치사로 쓰였습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">게다가,\u003c/span>\u003cspan class=\"en\">Furthermore,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 기억할 수 없었지만\u003c/span>\u003cspan class=\"en\">they could not remember\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">흑백 이미지를,\u003c/span>\u003cspan class=\"en\">black-and-white images,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기억할 수는 있었다\u003c/span>\u003cspan class=\"en\">but could remember\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">컬러로 된 이미지를.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">colored \u003c/span>\u003cspan class=\"tgt\">ones\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">게다가, 그들은 흑백 이미지를 기억할 수 없었지만 컬러로 된 이미지를 기억할 수는 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞의 연구 결과를 더 구체화하는 \u003cb class=\"key\">추가 \u003c/b>\u003cb class=\"key\">정보\u003c/b>를 제공합니다. \u003cb class=\"key\">흑백\u003c/b>과 \u003cb class=\"key\">컬러\u003c/b>를 직접 \u003cb class=\"key\">대조\u003c/b>하여 색의 존재가 기억에 미치는 영향을 극명하게 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정대명사 one\u003c/span> : colored [형용사] + ones [대명사] : \"컬러로 된 이미지들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">등위접속사 but의 병렬 구조\u003c/span> : could not [V1] ... but could [V2] : \"~할 수 없었지만 ... 할 수 있었다\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"Furthermore, 게다가. they could not remember, 그들은 기억할 수 없었지만. black-and-white images, 흑백 이미지를. but could remember, 기억할 수는 있었다. colored ones, 컬러로 된 이미지를.. 이 문장 전체를 해석하면, 게다가, 그들은 흑백 이미지를 기억할 수 없었지만 컬러로 된 이미지를 기억할 수는 있었다.","hl":"m"},{"n":20,"text":"추가적인 정보가 덧붙여지고 있어요. 흑백과 컬러를 직접 비교함으로써 색의 유무가 기억에 미치는 결정적인 차이를 보여주는 대목입니다.","hl":"mn"},{"n":21,"text":"첫 번째 포인트는 접속사 but을 중심으로 부정과 긍정의 표현이 대칭을 이루는 병렬 구조입니다. 두 번째는 마지막의 ones라는 단어예요. 이건 앞에 나온 images라는 단어를 또 쓰기 싫어서 대신 쓴 부정대명사인데 이미지가 여러 개니까 복수형인 ones를 쓴 것이죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또 다른 연구는 발견했다\u003c/span>\u003cspan class=\"en\">Another study \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">found \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">빨간색과 파란색이 가장 좋은 색이라는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> red and blue were the best colors\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">뇌 기능을 향상시키는 데\u003c/span>\u003cspan class=\"en\">for \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">improving\u003c/span> brain function.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">또 다른 연구는 빨간색과 파란색이 뇌 기능을 향상시키는 데 가장 좋은 색이라는 것을 발견했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞선 알츠하이머 환자 사례에 이어, 일반적인 \u003cb class=\"key\">뇌 \u003c/b>\u003cb class=\"key\">기능\u003c/b> 향상에 특히 효과적인 색상으로 \u003cb class=\"key\">빨간색과 \u003c/b>\u003cb class=\"key\">파란색\u003c/b>을 지목하며 논거를 확장하는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that\u003c/span> : found [타동사] + [that (접속사) + 주어 + 동사 (목적어절)] : \"~라는 것을 발견했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사\u003c/span> : for [전치사] + [improving (동명사)] : \"향상시키는 것\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"Another study found, 또 다른 연구는 발견했다. that red and blue were the best colors, 빨간색과 파란색이 가장 좋은 색이라는 것을. for improving brain function, 뇌 기능을 향상시키는 데. 이 문장 전체를 해석하면, 또 다른 연구는 빨간색과 파란색이 뇌 기능을 향상시키는 데 가장 좋은 색이라는 것을 발견했다.","hl":"m"},{"n":23,"text":"이 문장은 빨간색과 파란색이 뇌 기능에 긍정적인 영향을 준다는 연구 결과를 소개하고 있어요. 글의 중심 소재인 색상과 뇌 기능의 상관관계를 명확히 밝히는 부분이죠.","hl":"mn"},{"n":24,"text":"첫 번째로 found 뒤의 that은 목적어 역할을 하는 문장을 연결하는 명사절 접속사예요. 두 번째로 전치사 for 뒤에는 명사 형태인 동명사 improving이 와야 한다는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">빨간색은 1위를 차지한다\u003c/span>\u003cspan class=\"en\">Red \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">came \u003c/span>\u003cspan class=\"tgt\">out \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">top\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사회에서 그것의 역할 때문에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">because \u003c/span>\u003cspan class=\"tgt\">of\u003c/span> its role in society.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">빨간색은 사회에서 그것의 역할 때문에 1위를 차지한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 빨간색이 가장 효과적인 색으로 꼽힌 구체적인 이유를 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">역할\u003c/b>이라는 관점에서 제시하며 \u003cb class=\"key\">인과 \u003c/b>\u003cb class=\"key\">관계\u003c/b>를 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관용 표현\u003c/span> : come out [동사] + on top [부사구] : \"1위를 차지하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구\u003c/span> : because of [전치사구] + its role [명사(구)] : \"~ 때문에\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"Red came out on top, 빨간색은 1위를 차지한다. because of its role in society, 사회에서 그것의 역할 때문에. 이 문장 전체를 해석하면, 빨간색은 사회에서 그것의 역할 때문에 1위를 차지한다.","hl":"m"},{"n":26,"text":"빨간색이 왜 뇌 기능 향상에 가장 좋은 색으로 뽑혔는지 그 이유를 설명하고 있어요. 우리가 살아가는 사회 속에서 빨간색이 수행하는 역할에 주목하라는 뜻이죠.","hl":"mn"},{"n":27,"text":"첫 번째로 came out on top은 가장 꼭대기에 올라왔다는 뜻으로 1위를 했다는 의미의 숙어예요. 두 번째로 because of는 전치사구라서 뒤에 its role이라는 명사 덩어리가 온다는 것이 핵심입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">빨간색은 정지신호와 위험의 색이고\u003c/span>\u003cspan class=\"en\">Red is the color of stop signs and danger,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 전형적으로 펜의 색이다\u003c/span>\u003cspan class=\"en\">and it is typically the color of pens\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">선생님들이 사용하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">used\u003c/span> by teachers.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">빨간색은 정지신호와 위험의 색이고, 그것은 전형적으로 선생님들이 사용하는 펜의 색이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사회 속 빨간색의 구체적 사례로 \u003cb class=\"key\">경고\u003c/b>와 \u003cb class=\"key\">권위\u003c/b>를 상징하는 것들을 언급하며, 빨간색이 우리에게 주는 \u003cb class=\"key\">강한 \u003c/b>\u003cb class=\"key\">자극\u003c/b>을 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사의 후치수식\u003c/span> : pens [명사] + used [과거분사] + by [행위자] : \"사용되는\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"Red is the color of stop signs and danger, 빨간색은 정지신호와 위험의 색이고. and it is typically the color of pens, 그것은 전형적으로 펜의 색이다. used by teachers, 선생님들이 사용하는. 이 문장 전체를 해석하면, 빨간색은 정지신호와 위험의 색이고, 그것은 전형적으로 선생님들이 사용하는 펜의 색이다.","hl":"m"},{"n":29,"text":"우리 주변에서 빨간색이 어떻게 쓰이는지 예를 들고 있어요. 정지신호나 선생님의 채점용 펜처럼 주의를 집중시키고 중요성을 강조하는 상황에서 빨간색이 쓰인다는 점을 보여줍니다.","hl":"mn"},{"n":30,"text":"문장 끝부분의 used는 앞에 있는 pens를 꾸며주는 과거분사예요. 펜의 입장에서는 선생님에 의해 사용되는 것이기 때문에 능동형이 아닌 수동 의미의 과거분사를 써야 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은 의미합니다\u003c/span>\u003cspan class=\"en\">This \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">means \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">빨간색이 중요한 색이라는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> red is an important color\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">학습과 현실 세계에서,\u003c/span>\u003cspan class=\"en\">in learning and in the real world,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 사람은 가능성이 더 높습니다\u003c/span>\u003cspan class=\"en\">and a person \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">likely \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">빨간색인 어떤 것을 기억할.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to\u003c/span> remember \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">something \u003c/span>\u003cspan class=\"tgt\">red\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것은 빨간색이 학습과 현실 세계에서 중요한 색이고, 사람은 빨간색인 어떤 것을 기억할 가능성이 더 높다는 것을 의미한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞선 문장에서 언급된 사회적 사례들을 통해 빨간색이 실생활에서 \u003cb class=\"key\">중요한 \u003c/b>\u003cb class=\"key\">색상\u003c/b>임을 강조합니다. 이러한 중요성 덕분에 뇌가 더 자극받아 특정 대상을 \u003cb class=\"key\">기억할 \u003c/b>\u003cb class=\"key\">가능성\u003c/b>이 높아진다는 논리적 귀결을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that (명사절)\u003c/span> : S + means + [that + S + V (목적어)] : \"~라는 것을 의미한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be likely to (형용사구)\u003c/span> : be + likely + [to + 동사원형] : \"~할 가능성이 더 높다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">형용사의 후치 수식\u003c/span> : [something (-thing 명사)] + [red (형용사)] : \"빨간색인 어떤 것\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"This means, 이것은 의미합니다. that red is an important color, 빨간색이 중요한 색이라는 것을. in learning and in the real world, 학습과 현실 세계에서. and a person is more likely, 그리고 사람은 가능성이 더 높습니다. to remember something red, 빨간색인 어떤 것을 기억할.. 이 문장 전체를 해석하면, 이것은 빨간색이 학습과 현실 세계에서 중요한 색이고, 사람은 빨간색인 어떤 것을 기억할 가능성이 더 높다는 것을 의미한다.","hl":"m"},{"n":32,"text":"앞서 언급한 정지 표지판이나 선생님의 펜 같은 사례들을 통해 빨간색이 우리 삶에서 얼마나 중요한지 정리하는 문장이에요. 결과적으로 빨간색이 뇌에 강한 인상을 주어 기억력을 높여준다는 점을 강조하고 있죠.","hl":"mn"},{"n":33,"text":"첫 번째로 means 뒤의 that은 명사절 접속사로 뒤에 완전한 문장을 연결해 줍니다. 두 번째로 be likely to 동사원형은 무엇을 할 가능성이 높다는 뜻으로 자주 쓰이는 숙어예요. 세 번째로 something red처럼 thing으로 끝나는 명사는 형용사가 반드시 뒤에서 수식해야 한다는 점을 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">게다가, 빨간색이 때문에\u003c/span>\u003cspan class=\"en\">Additionally, \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">as\u003c/span> the color red\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들을 주의 깊게 만들기,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">makes \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">cautious\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 세부적인 것을 더 많이 지향하게 되고\u003c/span>\u003cspan class=\"en\">they become more \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">detail-oriented\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">주의를 더 잘 기울인다.\u003c/span>\u003cspan class=\"en\">and pay better attention.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">게다가, 빨간색이 사람들을 주의 깊게 만들기 때문에, 그들은 세부적인 것을 더 많이 지향하게 되고 주의를 더 잘 기울인다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 빨간색이 인간의 심리에 미치는 긍정적 영향을 설명하며, 위험 신호로 인식되는 빨간색이 \u003cb class=\"key\">주의력\u003c/b>을 유발함을 밝힙니다. 이로 인해 사람들이 평소보다 더 \u003cb class=\"key\">세부 \u003c/b>\u003cb class=\"key\">사항\u003c/b>에 집중하게 된다는 원리를 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 as (이유)\u003c/span> : as + [S + V (이유의 부사절)] : \"~하기 때문에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">5형식 문장 (make)\u003c/span> : make + [people (목적어)] + [cautious (목적보어/형용사)] : \"사람들을 주의 깊게 만들다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">복합 형용사\u003c/span> : [detail (명사)] + [oriented (과거분사)] : \"세부적인 것을 지향하는\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"Additionally, as the color red, 게다가, 빨간색이 때문에. makes people cautious, 사람들을 주의 깊게 만들기. they become more detail-oriented, 그들은 세부적인 것을 더 많이 지향하게 되고. and pay better attention, 주의를 더 잘 기울인다.. 이 문장 전체를 해석하면, 게다가, 빨간색이 사람들을 주의 깊게 만들기 때문에, 그들은 세부적인 것을 더 많이 지향하게 되고 주의를 더 잘 기울인다.","hl":"m"},{"n":35,"text":"빨간색이 우리를 긴장시키고 조심스럽게 만드는 심리적 효과를 설명해요. 이런 조심성 덕분에 우리는 실수를 줄이기 위해 더 꼼꼼해지고 집중력도 높아지게 됩니다.","hl":"mn"},{"n":36,"text":"첫 번째로 접속사 as는 여기에서 이유를 나타내는 의미로 사용되었어요. 두 번째로 5형식 동사 make는 목적보어 자리에 반드시 cautious 같은 형용사를 써야지 부사를 쓰면 안 된다는 점이 중요합니다. 세 번째로 detail-oriented는 하이픈으로 연결되어 꼼꼼한 상태를 나타내는 하나의 형용사처럼 쓰였습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은 결과를 낳습니다\u003c/span>\u003cspan class=\"en\">This \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">results \u003c/span>\u003cspan class=\"tgt\">in\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들이 기억하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">recalling\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">빨간색의 사물을\u003c/span>\u003cspan class=\"en\">a red-colored object\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나중에 더 잘.\u003c/span>\u003cspan class=\"en\">better later.\u003c/sp
