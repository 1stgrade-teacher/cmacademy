}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터2 Reading27","audioDir":"reading27_audio","preview":false,"count":42,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.668em\">Reading\u003cbr>27\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터 레벨2\u003c/div>\u003ch1>The Gap Between Knowledge and Emotional Mastery\u003c/h1>\u003ch2>지식과 정서적 숙달 사이의 간극\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>EQ에 대한 관심은 높지만 많은 이들이 \u003cb class=\"key\">감정 \u003c/b>\u003cb class=\"key\">인식\u003c/b>과 관리 능력이 부족하며, 진정한 \u003cb class=\"key\">의사 \u003c/b>\u003cb class=\"key\">결정\u003c/b>을 위해서는 학교에서 가르치는 지식 이상의 \u003cb class=\"key\">정서적 \u003c/b>\u003cb class=\"key\">숙달\u003c/b>이 필수적이다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Beyond factual knowledge, emotional awareness and mastery are crucial for making sound decisions in challenging situations.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 정서 지능이라고 불리는 EQ에 관한 흥미로운 지문을 가져왔어요. 우리가 공부는 열심히 하지만 정작 내 마음을 다스리는 법은 왜 모르는 걸까요? 오늘 수업을 통해 그 이유와 해결책을 함께 정리해 봅시다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">정서 지능(Emotional Intelligence)은 단순히 감정적인 상태를 넘어 자신의 감정을 정확히 \u003cb class=\"key\">인지(Awareness)\u003c/b>하고 조절하는 고차원적 능력입니다. 현대 사회는 \u003cb class=\"key\">지식 \u003c/b>\u003cb class=\"key\">정보(Knowledge)\u003c/b>를 습득하는 교육에는 몰두하지만, 정작 갈등 상황에서 감정을 다스리는 \u003cb class=\"key\">비인지적 \u003c/b>\u003cb class=\"key\">기술(Non-cognitive \u003c/b>\u003cb class=\"key\">Skills)\u003c/b> 교육은 소홀히 하는 경향이 있습니다. 이는 마치 수영 교본을 통달했지만 정작 \u003cb class=\"key\">파도(Challenges)\u003c/b>가 치는 바다에는 한 번도 들어가 보지 않은 상태와 비슷합니다. 결국 복잡한 세상에서 올바른 선택을 하려면 차가운 머리뿐만 아니라 뜨거운 감정을 다스리는 \u003cb class=\"key\">정서적 \u003c/b>\u003cb class=\"key\">숙달(Emotional \u003c/b>\u003cb class=\"key\">Mastery)\u003c/b>이 병행되어야 합니다.\u003c/div>","segs":[{"n":2,"text":"요즘 EQ라는 단어 참 많이 듣죠? 그런데 이게 단순히 착하거나 공감을 잘하는 것만을 의미하지는 않아요. 전문 용어로 메타 인지라고도 하는데, 내가 지금 화가 났는지 슬픈지를 객관적으로 파악하는 정서 지능이 핵심입니다. 하지만 우리 교육 현실은 인지적 영역인 지식 습득에만 몰두하고 있어서, 비인지적 영역인 감정 조절은 뒷전인 경우가 많아요. 마치 전쟁터에 나가기 전에 총 쏘는 법은 배웠지만, 무서움을 이겨내는 법은 배우지 못한 병사와 같은 상황이라고 볼 수 있습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>현실과 통계\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>EQ에 대한 관심 증가에도 불구하고 전 세계적으로 \u003cb class=\"key\">감정 \u003c/b>\u003cb class=\"key\">이해\u003c/b>가 부족하며, 실험 결과 오직 \u003cb class=\"key\">36퍼센트\u003c/b>만이 감정을 정확히 인식한다는 점을 제시합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>감정의 통제\u003csmall>문제 제기 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>대다수의 사람들이 감정에 \u003cb class=\"key\">지배당하고\u003c/b> 있으며, 감정을 자신에게 \u003cb class=\"key\">이로운 \u003c/b>\u003cb class=\"key\">방향\u003c/b>으로 활용하는 기술이 부족함을 지적합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>교육의 부재\u003csmall>원인 분석 · 문장 6–8\u003c/small>\u003c/h4>\u003cp>학교는 \u003cb class=\"key\">지식 \u003c/b>\u003cb class=\"key\">전달\u003c/b>에만 집중할 뿐 감정 인식과 관리 기술을 가르치지 않아, 실전 문제 직면 시 \u003cb class=\"key\">관리 \u003c/b>\u003cb class=\"key\">기술\u003c/b>이 결여된 채 노동 시장에 진입하게 됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>진정한 결정\u003csmall>결론 · 문장 9–10\u003c/small>\u003c/h4>\u003cp>좋은 결정은 사실적 지식을 넘어 \u003cb class=\"key\">자기 \u003c/b>\u003cb class=\"key\">이해\u003c/b>와 \u003cb class=\"key\">정서적 \u003c/b>\u003cb class=\"key\">숙달\u003c/b>을 통해 이루어진다는 핵심 주장을 전달합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 현대인의 낮은 감정 인식 수준을 보여주는 통계에서 시작해서 교육의 한계를 거쳐 결론으로 나아가는 흐름을 보여줍니다.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서는 EQ에 대한 관심은 높지만 실제로는 감정을 이해하는 능력이 전 세계적으로 부족하다는 사실을 보여줘요. 특히 실험을 통해 오직 서른여섯 퍼센트만이 자신의 감정을 정확하게 식별한다는 충격적인 수치를 제시하고 있습니다.","hl":"f0"},{"n":5,"text":"세 번째부터 다섯 번째 문장은 이 통계가 우리에게 주는 의미를 설명해요. 우리 중 삼분의 이가 감정에 통제당하고 있으며, 감정을 발견해서 우리에게 이롭게 사용하는 기술이 아주 부족하다는 문제점을 짚어줍니다.","hl":"f1"},{"n":6,"text":"여섯 번째부터 여덟 번째 문장은 그 원인을 학교 교육에서 찾습니다. 학교에서는 읽고 쓰고 지식을 보고하는 방법만 가르칠 뿐, 정작 갈등 상황에서 감정을 관리하는 법은 가르치지 않는다는 점을 비판하고 있죠.","hl":"f2"},{"n":7,"text":"마지막 아홉 번째와 열 번째 문장에서는 필자의 주장을 강조합니다. 훌륭한 결정을 내리려면 지식보다 훨씬 더 중요한 것이 있는데, 그것이 바로 자기 이해와 정서적 숙달이라는 결론을 내립니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-원인-해결\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 10번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글의 앞부분에서 현대인이 겪는 \u003cb class=\"key\">정서 \u003c/b>\u003cb class=\"key\">관리의 \u003c/b>\u003cb class=\"key\">부재\u003c/b>라는 문제를 제시하고, 그 원인을 \u003cb class=\"key\">학교 \u003c/b>\u003cb class=\"key\">교육\u003c/b>의 편향성에서 찾고 있습니다. 마지막에 이르러 훌륭한 결정을 위해 필요한 \u003cb class=\"key\">정서적 \u003c/b>\u003cb class=\"key\">숙달\u003c/b>의 중요성을 강조하며 마무리하는 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Despite (1)\u003c/b>\u003cspan>양보를 통한 대조\u003c/span>\u003cb>But (5)\u003c/b>\u003cspan>역접 및 문제 구체화\u003c/span>\u003cb>Too often, however (8)\u003c/b>\u003cspan>대조를 통한 한계 지적\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">EQ\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">understanding and managing emotions\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">identify their emotions\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">emotional awareness\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">manage our emotions\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">emotional mastery\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>School/Workforce Education\u003c/th>\u003cth>Emotional Mastery\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Facts and knowledge focus\u003c/td>\u003ctd>Self-knowledge focus\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Reading, writing, reporting\u003c/td>\u003ctd>Accurately identifying emotions\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Lacking in challenging problems\u003c/td>\u003ctd>Required for good decisions\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 지문은 전형적인 문제와 원인 분석 구조를 가지고 있어요. 감정 관리 능력이 부족하다는 문제를 먼저 던지고, 그 원인을 학교 교육의 부재로 설명하죠. 그리고 마지막 부분에 주제가 나오는 미괄식 구조입니다.","hl":"ty"},{"n":9,"text":"문장 중간의 However나 But 같은 신호어들을 잘 봐야 해요. 특히 여덟 번째 문장의 Too often, however는 지식 교육을 받았음에도 불구하고 실제 현장에서 겪는 한계를 명확하게 대조해서 보여주는 중요한 신호입니다. 또한 감정 관리라는 표현이 identify emotions에서 emotional mastery로 재진술되는 과정도 눈여겨보세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>despite\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~에도 불구하고\u003c/span>\u003c/div>\u003cdiv>\u003cb>focus\u003c/b>\u003cem>명사\u003c/em>\u003cspan>초점, 관심\u003c/span>\u003c/div>\u003cdiv>\u003cb>global\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>전 세계적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>lack\u003c/b>\u003cem>명사\u003c/em>\u003cspan>부족, 결핍\u003c/span>\u003c/div>\u003cdiv>\u003cb>manage\u003c/b>\u003cem>동사\u003c/em>\u003cspan>관리하다, 다스리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>remains\u003c/b>\u003cem>동사\u003c/em>\u003cspan>여전히 남아 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>accurately\u003c/b>\u003cem>부사\u003c/em>\u003cspan>정확하게\u003c/span>\u003c/div>\u003cdiv>\u003cb>identify\u003c/b>\u003cem>동사\u003c/em>\u003cspan>식별하다, 확인하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>suggest\u003c/b>\u003cem>동사\u003c/em>\u003cspan>시사하다, 암시하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>typically\u003c/b>\u003cem>부사\u003c/em>\u003cspan>보통, 전형적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>controlled\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>통제되는\u003c/span>\u003c/div>\u003cdiv>\u003cb>skilled at\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 숙련된\u003c/span>\u003c/div>\u003cdiv>\u003cb>spot\u003c/b>\u003cem>동사\u003c/em>\u003cspan>발견하다, 찾다\u003c/span>\u003c/div>\u003cdiv>\u003cb>benefit\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이익, 이점\u003c/span>\u003c/div>\u003cdiv>\u003cb>awareness\u003c/b>\u003cem>명사\u003c/em>\u003cspan>인식, 의식\u003c/span>\u003c/div>\u003cdiv>\u003cb>workforce\u003c/b>\u003cem>명사\u003c/em>\u003cspan>노동 인력, 노동 시장\u003c/span>\u003c/div>\u003cdiv>\u003cb>bodies of knowledge\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>지식의 체계, 지식의 본체\u003c/span>\u003c/div>\u003cdiv>\u003cb>challenging\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>도전적인, 어려운\u003c/span>\u003c/div>\u003cdiv>\u003cb>face\u003c/b>\u003cem>동사\u003c/em>\u003cspan>직면하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>factual\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>사실의, 사실에 입각한\u003c/span>\u003c/div>\u003cdiv>\u003cb>mastery\u003c/b>\u003cem>명사\u003c/em>\u003cspan>숙달, 통달\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"여기서 identify는 단순히 확인하다는 뜻을 넘어 내 상태를 정확히 알아차린다는 의미로 쓰였어요. mastery라는 단어는 어떤 분야를 완전히 통달했다는 뜻인데, 여기서는 감정을 내 마음대로 다룰 수 있는 경지를 말합니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">identify\u003c/b>\u003cspan class=\"m\">식별하다, 확인하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">recognize\u003c/span>\u003cspan class=\"s\">distinguish\u003c/span>\u003cspan class=\"s\">discern\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003cspan class=\"a\">overlook\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">accurately\u003c/b>\u003cspan class=\"m\">정확하게\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">precisely\u003c/span>\u003cspan class=\"s\">correctly\u003c/span>\u003cspan class=\"s\">exactly\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">vaguely\u003c/span>\u003cspan class=\"a\">incorrectly\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">lack\u003c/b>\u003cspan class=\"m\">부족, 결핍\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">shortage\u003c/span>\u003cspan class=\"s\">deficiency\u003c/span>\u003cspan class=\"s\">scarcity\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">abundance\u003c/span>\u003cspan class=\"a\">surplus\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">skilled\u003c/b>\u003cspan class=\"m\">숙련된\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">adept\u003c/span>\u003cspan class=\"s\">proficient\u003c/span>\u003cspan class=\"s\">expert\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">clumsy\u003c/span>\u003cspan class=\"a\">inept\u003c/span>\u003cspan class=\"a\">unskilled\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">mastery\u003c/b>\u003cspan class=\"m\">숙달, 통달\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">command\u003c/span>\u003cspan class=\"s\">expertise\u003c/span>\u003cspan class=\"s\">proficiency\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignorance\u003c/span>\u003cspan class=\"a\">incompetence\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"identify와 비슷한 단어로는 recognize나 discern이 시험에 자주 나와요. 반대로 무시하다는 ignore나 overlook이 있죠. accurately의 동의어로는 precisely가 있고, 숙달을 뜻하는 mastery는 command나 expertise로 바꿔 쓸 수 있으니 꼭 메모해 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">EQ에 대한 관심이 증가하고 있음에도 불구하고,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Despite\u003c/span> the growing focus on EQ,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전 세계적으로 이해하는 데 있어 부족한 부분이\u003c/span>\u003cspan class=\"en\">a global lack in \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">understanding \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 감정을 관리하는 데 있어\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">managing\u003c/span> emotions\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여전히 남아 있다.\u003c/span>\u003cspan class=\"en\">still remains.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">EQ에 대한 관심이 증가하고 있음에도 불구하고, 감정을 이해하고 관리하는 데 있어 전 세계적으로 부족한 부분이 여전히 남아 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사회적으로 \u003cb class=\"key\">EQ\u003c/b>에 대한 관심은 높아졌지만, 실제로는 여전히 자신의 감정을 \u003cb class=\"key\">이해하고 \u003c/b>\u003cb class=\"key\">관리\u003c/b>하는 능력이 세계적으로 부족하다는 문제점을 제기하며 글을 시작합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">양보의 전치사\u003c/span> : Despite [전치사] + [명사(구)] : \"~에도 불구하고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사의 목적어와 병렬 구조\u003c/span> : in [전치사] + [understanding (동명사1)] and [managing (동명사2)] : \"이해하고 관리하는 것\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Despite the growing focus on EQ, EQ에 대한 관심이 증가하고 있음에도 불구하고. a global lack in understanding, 전 세계적으로 이해하는 데 있어 부족한 부분이. and managing emotions, 그리고 감정을 관리하는 데 있어. still remains, 여전히 남아 있다.. 이 문장 전체를 해석하면, EQ에 대한 관심이 증가하고 있음에도 불구하고, 감정을 이해하고 관리하는 데 있어 전 세계적으로 부족한 부분이 여전히 남아 있다.","hl":"m"},{"n":13,"text":"요즘 EQ가 중요하다고들 많이 말하죠. 하지만 실제로는 전 세계 사람들이 자신의 감정을 이해하고 관리하는 데 여전히 서투르다는 점을 강조하고 있어요. 겉으로만 관심을 가질 뿐 실질적인 능력은 부족하다는 점을 꼬집는 문장입니다.","hl":"mn"},{"n":14,"text":"첫 번째로 Despite는 뒤에 명사구가 오는 전치사입니다. Although 같은 접속사와 헷갈리면 안 되니 꼭 명사구인 growing focus를 확인하세요. 두 번째로 in이라는 전치사 뒤에 understanding과 managing이 and로 연결되어 있어요. 이렇게 동명사 두 개가 나란히 쓰인 병렬 구조를 잘 파악해야 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 실험에서,\u003c/span>\u003cspan class=\"en\">In a test,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오직 36퍼센트의 사람들만이\u003c/span>\u003cspan class=\"en\">only 36 percent of the people\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">피실험자의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">tested\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 감정을 정확하게 식별할 수 있었다\u003c/span>\u003cspan class=\"en\">were able to accurately identify their emotions\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 일어날 때.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">happened\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">한 실험에서, 피실험자의 오직 36%만이 그들의 감정이 일어날 때 그것을 정확하게 식별할 수 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사람들이 감정을 실시간으로 파악하는 능력이 생각보다 매우 \u003cb class=\"key\">낮음\u003c/b>을 구체적인 \u003cb class=\"key\">통계 \u003c/b>\u003cb class=\"key\">수치\u003c/b>를 통해 뒷받침하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사와 수동태\u003c/span> : the people [선행사] + who [주격 관계대명사] + were tested [수동태] : \"실험을 받은 (사람들)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">시간의 접속사 as\u003c/span> : as [접속사] + they [주어] + happened [동사] : \"그것들이 발생할 때\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"In a test, 한 실험에서. only 36 percent of the people, 오직 36퍼센트의 사람들만이. who were tested, 피실험자의. were able to accurately identify their emotions, 그들의 감정을 정확하게 식별할 수 있었다. as they happened, 그것이 일어날 때.. 이 문장 전체를 해석하면, 한 실험에서, 피실험자의 오직 36%만이 그들의 감정이 일어날 때 그것을 정확하게 식별할 수 있었다.","hl":"m"},{"n":16,"text":"앞 문장에서 말한 부족함에 대한 증거로 실험 결과를 보여줍니다. 감정이 일어나는 바로 그 순간에 내가 지금 어떤 감정인지 아는 사람이 세 명 중 한 명꼴밖에 안 된다는 놀라운 사실을 전달하죠.","hl":"mn"},{"n":17,"text":"첫 번째로 who were tested 부분을 주목하세요. people을 꾸미는 주격 관계대명사 who가 쓰였고, 실험을 받은 사람들이니 수동태인 were tested를 썼습니다. 두 번째로 as they happened에서 as는 시간의 접속사로 감정이 발생하는 그 때를 의미합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무엇을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">What \u003c/span>\u003cspan class=\"tgt\">does \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은 시사하는가?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">suggest?\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것은 무엇을 시사하는가?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 제시한 36%라는 낮은 통계 수치가 우리에게 어떤 \u003cb class=\"key\">숨은 \u003c/b>\u003cb class=\"key\">의미\u003c/b>를 전달하는지 물으며 독자의 \u003cb class=\"key\">주의를 \u003c/b>\u003cb class=\"key\">환기\u003c/b>시킵니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문문\u003c/span> : What [의문대명사] + does [조동사] + this [주어] + suggest [동사원형]? : \"이것이 무엇을 암시하는가?\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"What does, 무엇을. this suggest?, 이것은 시사하는가?. 이 문장 전체를 해석하면, 이것은 무엇을 시사하는가?","hl":"m"},{"n":19,"text":"짧은 질문이지만 매우 중요해요. 앞에서 말한 겨우 36%만이 감정을 식별한다는 사실이 도대체 우리 삶에 어떤 의미를 갖는지 궁금증을 유발하며 다음 내용을 이끌어냅니다.","hl":"mn"},{"n":20,"text":"일반동사 suggest를 사용한 의문문이에요. 주어인 this가 삼인칭 단수이기 때문에 조동사 does를 주어 앞으로 보낸 점을 눈여겨보세요. 여기서 this는 앞 문장의 실험 결과를 가리키는 대명사입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 의미한다\u003c/span>\u003cspan class=\"en\">It means \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 중 3분의 2는\u003c/span>\u003cspan class=\"en\">two-thirds of us\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보통 통제된다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">typically \u003c/span>\u003cspan class=\"tgt\">controlled\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 감정에 의해\u003c/span>\u003cspan class=\"en\">by our emotions.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 우리 중 3분의 2는 보통 우리의 감정에 의해 통제된다는 것을 의미한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 통계 결과를 토대로, 대다수의 사람들이 감정의 주인이 되지 못하고 \u003cb class=\"key\">수동적\u003c/b>으로 휘둘리고 있음을 결론짓는 문장입니다. 우리가 얼마나 \u003cb class=\"key\">감정 \u003c/b>\u003cb class=\"key\">관리\u003c/b>에 취약한지를 강조하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절 접속사\u003c/span> : means [타동사] + that [접속사] + [절(S+V)] : \"~라는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : be [be동사] + controlled [과거분사(p.p.)] : \"통제된다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"It means that, 그것은 의미한다. two-thirds of us, 우리 중 3분의 2는. are typically controlled, 보통 통제된다는 것을. by our emotions, 우리의 감정에 의해. 이 문장 전체를 해석하면, 그것은 우리 중 3분의 2는 보통 우리의 감정에 의해 통제된다는 것을 의미한다.","hl":"m"},{"n":22,"text":"이 문장은 앞서 나온 통계 수치를 다시 한번 풀어서 설명하고 있어요. 우리들 중 대다수가 감정의 주인이 되지 못하고 감정에 지배당하며 살고 있다는 점을 강조하는 것이죠.","hl":"mn"},{"n":23,"text":"첫 번째로 means 뒤에 나오는 접속사 that은 문장 끝까지를 하나의 덩어리로 묶어 목적어 역할을 하게 해 줍니다. 두 번째로 are controlled는 수동태 표현으로 우리가 감정에 의해 통제받는 상태임을 나타냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만\u003c/span>\u003cspan class=\"en\">But\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 아직 능숙하지 않다\u003c/span>\u003cspan class=\"en\">we are not yet skilled at\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 감정을 찾아내고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">spotting \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">emotions \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들을 사용하는 데\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">using \u003c/span>\u003cspan class=\"tgt\">them\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 이익을 위해\u003c/span>\u003cspan class=\"en\">to our benefit.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 우리는 아직 감정을 찾아내어 우리의 이익을 위해 그것들을 사용하는 데 능숙하지 않다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 단순히 감정에 지배당하는 현실을 넘어, 감정을 포착하고 \u003cb class=\"key\">활용\u003c/b>하는 구체적인 기술이 부족함을 지적합니다. 이는 EQ를 높이기 위한 \u003cb class=\"key\">훈련\u003c/b>의 필요성을 암시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사의 병렬 구조\u003c/span> : spotting [동명사1] + and + using [동명사2] : \"감정을 찾아내고 그것들을 사용하는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">전치사의 목적어(동명사)\u003c/span> : be skilled at [전치사] + spotting [동명사] : \"~하는 데 능숙하지 않다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"But, 하지만. we are not yet skilled at, 우리는 아직 능숙하지 않다. spotting our emotions, 우리의 감정을 찾아내고. and using them, 그것들을 사용하는 데. to our benefit, 우리의 이익을 위해. 이 문장 전체를 해석하면, 하지만 우리는 아직 감정을 찾아내어 우리의 이익을 위해 그것들을 사용하는 데 능숙하지 않다.","hl":"m"},{"n":25,"text":"우리가 왜 감정에 휘둘리는지 그 이유를 설명하고 있어요. 자신의 감정이 어떤 상태인지 제때 알아차리고 이를 나에게 유리하게 활용하는 능력이 아직은 많이 부족하다는 뜻입니다.","hl":"mn"},{"n":26,"text":"첫 번째로 be skilled at은 무엇에 능숙하다는 뜻인데 전치사 at 뒤에는 동명사가 와야 해서 spot이 spotting이 되었습니다. 두 번째로 spotting과 using은 and로 연결되어 둘 다 at에 걸리는 병렬 구조를 이루고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">감정의 인식과 이해는\u003c/span>\u003cspan class=\"en\">Emotional awareness and understanding\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가르치지 않는다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">taught\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">학교에서\u003c/span>\u003cspan class=\"en\">in school.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">감정의 인식과 이해는 학교에서 가르치지 않는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 우리가 감정 관리에 서툰 근본적인 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">배경\u003c/b>을 설명합니다. 지식 위주의 교육 과정에서 \u003cb class=\"key\">감정 \u003c/b>\u003cb class=\"key\">교육\u003c/b>이 소외되어 왔음을 비판적으로 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : be [be동사] + taught [과거분사(p.p.)] : \"가르쳐지지 않는다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Emotional awareness and understanding, 감정의 인식과 이해는. are not taught, 가르치지 않는다. in school, 학교에서. 이 문장 전체를 해석하면, 감정의 인식과 이해는 학교에서 가르치지 않는다.","hl":"m"},{"n":28,"text":"왜 우리가 성인이 되어서도 감정을 잘 다루지 못할까요? 그 이유는 바로 학교 교육 과정에서 이런 감정적인 부분을 제대로 배운 적이 없기 때문이라는 지적입니다.","hl":"mn"},{"n":29,"text":"이 문장의 주어인 인식과 이해는 가르치는 주체가 아니라 학교에서 가르쳐지는 대상이죠. 그래서 be동사 are와 teach의 과거분사인 taught를 결합한 수동태 형태를 사용했습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 노동 시장에 들어간다\u003c/span>\u003cspan class=\"en\">We enter the workforce\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">배우고 나서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">after \u003c/span>\u003cspan class=\"tgt\">learning\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">읽고, 쓰고, 보고하는 방법을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">read, \u003c/span>\u003cspan class=\"tgt\">write, \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">report\u003c/span> on\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지식의 본체에 대해서.\u003c/span>\u003cspan class=\"en\">bodies of knowledge.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 지식의 본체를 읽고, 쓰고, 보고하는 방법을 배우고 나서 노동 시장에 들어간다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 학교 교육이 주로 학문적 지식을 습득하는 데 치중되어 있음을 나타냅니다. 정작 사회생활에 필요한 \u003cb class=\"key\">감정 \u003c/b>\u003cb class=\"key\">조절\u003c/b> 교육은 소외되어 있다는 맥락의 시작입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 뒤의 동명사\u003c/span> : after [전치사] + learning [동명사] : \"배우고 나서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c \u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 훌륭한 결정은 단순한 지식을 넘어 \u003cb class=\"key\">자기 \u003c/b>\u003cb class=\"key\">이해\u003c/b>와 \u003cb class=\"key\">감정 \u003c/b>\u003cb class=\"key\">조절\u003c/b> 능력을 바탕으로 이루어진다는 점을 강조합니다. 감정이 요동치는 순간에 이러한 \u003cb class=\"key\">감정적 \u003c/b>\u003cb class=\"key\">숙달\u003c/b>이 발휘되어야 올바른 판단이 가능하다는 결론을 제시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태(be + p.p.)\u003c/span> : be [am/are/is] + made [과거분사] : \"만들어진다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 + 동명사\u003c/span> : by [전치사] + using [동명사/목적어] : \"사용하여\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">수동태(be + p.p.)\u003c/span> : be [am/are/is] + needed [과거분사] : \"필요하다\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"They are made, 그것들은 만들어진다. by using our self-knowledge and emotional mastery, 우리의 자기 이해와 감정적 숙달을 사용하여. when they are needed most, 그것들이 가장 필요할 때.. 이 문장 전체를 해석하면, 그것들은 가장 필요할 때 우리의 자기 이해와 감정적 숙달을 사용하여 만들어진다.","hl":"m"},{"n":40,"text":"이 문장은 앞서 나온 좋은 결정이 어떻게 내려지는지 설명합니다. 단순히 사실을 아는 것보다 나 자신을 아는 자기 이해와 감정을 다루는 감정적 숙달이 결정적인 순간에 발휘되어야 한다는 뜻이죠.","hl":"mn"},{"n":41,"text":"어법을 살펴볼까요? 첫 번째로 are made는 수동태입니다. 주어인 They가 좋은 결정들이기 때문에 결정이 스스로 만드는 게 아니라 만들어진다는 수동의 의미를 쓴 것이죠. 두 번째로 by using은 수단이나 방법을 나타내요. 전치사 뒤라 동명사 형태를 썼습니다. 세 번째로 are needed 역시 수동태입니다. 필요한 능력이 요구되는 상황을 설명하기 위해 비 동사와 과거분사를 결합했네요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>감성 지능인 EQ에 대한 관심이 커지고 있음에도 불구하고, 실제 \u003cb class=\"key\">감정 \u003c/b>\u003cb class=\"key\">관리\u003c/b> 능력은 여전히 부족한 상태입니다.\u003c/li>\u003cli>대부분의 사람들이 자신의 감정을 실시간으로 \u003cb class=\"key\">정확히 \u003c/b>\u003cb class=\"key\">인식\u003c/b>하지 못해 감정에 휘둘리며 살아가고 있습니다.\u003c/li>\u003cli>학교 교육이 \u003cb class=\"key\">지식 \u003c/b>\u003cb class=\"key\">습득\u003c/b>에만 치중되어 있어, 정작 어려운 상황에서 필요한 \u003cb class=\"key\">정서적 \u003c/b>\u003cb class=\"key\">기술\u003c/b>을 배울 기회가 없습니다.\u003c/li>\u003cli>최선의 결정을 내리기 위해서는 지식보다 \u003cb class=\"key\">자기 \u003c/b>\u003cb class=\"key\">이해\u003c/b>와 감정을 다루는 \u003cb class=\"key\">정서적 \u003c/b>\u003cb class=\"key\">숙달\u003c/b>이 훨씬 더 중요합니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Beyond factual knowledge, emotional awareness and mastery are crucial for making sound decisions in challenging situations.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">EQ에 대한 관심은 높지만 많은 이들이 \u003cb class=\"key\">감정 \u003c/b>\u003cb class=\"key\">인식\u003c/b>과 관리 능력이 부족하며, 진정한 \u003cb class=\"key\">의사 \u003c/b>\u003cb class=\"key\">결정\u003c/b>을 위해서는 학교에서 가르치는 지식 이상의 \u003cb class=\"key\">정서적 \u003c/b>\u003cb class=\"key\">숙달\u003c/b>이 필수적이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":42,"text":"오늘 지문의 핵심은 좋은 결정을 내리려면 지식만으로는 부족하다는 것입니다. 여러분도 공부하면서 스트레스를 받을 때, 그 감정에 휘둘리기보다 지금 내 감정이 어떤지 먼저 들여다보는 연습을 해보길 바라요. 오늘 배운 감정 조절의 중요성 꼭 기억하면서 복습합시다. 수고하셨어요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
