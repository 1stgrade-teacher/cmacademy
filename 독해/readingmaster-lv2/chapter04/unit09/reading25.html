<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터2 Reading25 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터2 Reading25","audioDir":"reading25_audio","preview":false,"count":41,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.668em\">Reading\u003cbr>25\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터 레벨2\u003c/div>\u003ch1>The Urgency of Information Literacy in the Age of Misinformation\u003c/h1>\u003ch2>잘못된 정보의 시대, 정보 문해력의 시급함\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>미디어 사용 시간이 많아도 정보를 \u003cb class=\"key\">비판적으로 \u003c/b>\u003cb class=\"key\">검토\u003c/b>하는 능력은 별개의 문제이며, 전 세대에 걸쳐 나타나는 가짜 정보 문제를 해결하기 위해 개인의 \u003cb class=\"key\">정보 \u003c/b>\u003cb class=\"key\">문해력\u003c/b>과 책임감이 필수적입니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>To combat the widespread problem of misinformation, individuals of all ages must develop information literacy and take personal responsibility.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 우리가 매일 접하는 미디어와 그 속의 가짜 정보, 즉 misinformation에 대해 이야기해보려고 합니다. 많은 시간을 미디어와 함께 보낸다고 해서 우리가 정보를 완벽히 이해하는 것은 아니라는 점이 오늘 글의 핵심이에요. 이번 수업을 통해 정보 문해력이 왜 우리 모두에게 필수적인지 함께 알아봅시다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">우리는 눈을 뜨자마자 스마트폰으로 세상을 접하는 디지털 시대를 살고 있지만, 쏟아지는 정보 중 무엇이 진짜인지 가려내는 \u003cb class=\"key\">정보 \u003c/b>\u003cb class=\"key\">문해력\u003c/b>(Information Literacy)은 여전히 부족합니다. 특히 알고리즘을 통해 교묘하게 유포되는 \u003cb class=\"key\">가짜 \u003c/b>\u003cb class=\"key\">뉴스\u003c/b>(Misinformation)는 사람들의 비판적 사고를 마비시키곤 합니다. 마치 상한 음식을 먹으면 배탈이 나듯이, 검증되지 않은 정보를 무분별하게 수용하는 것은 우리 정신 건강과 사회 안전에 해롭습니다. 일상에서 좋은 식재료를 고르는 \u003cb class=\"key\">안목\u003c/b>이 필요하듯, 온라인에서도 정보의 출처와 의도를 파악하는 \u003cb class=\"key\">필터링\u003c/b> 능력이 현대인의 필수 생존 전략이 되었습니다.\u003c/div>","segs":[{"n":2,"text":"본격적인 시작에 앞서 배경지식을 좀 쌓아볼까요? 정보 문해력, 영어로는 information literate라고 하는 개념은 단순히 글을 읽는 것을 넘어 정보의 진위를 가려내는 능력을 뜻해요. 요즘은 누구나 정보를 생산할 수 있어서 상한 음식 같은 가짜 정보가 넘쳐나죠. 그래서 마치 좋은 식재료를 골라내는 안목이 필요하듯, 우리에게도 정보를 걸러내는 필터링 능력이 정말 중요해졌답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>미디어 노출과 능력의 불일치\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>사람들이 미디어와 보내는 시간은 많지만, 그것이 곧 정보를 \u003cb class=\"key\">비판적으로 \u003c/b>\u003cb class=\"key\">분석\u003c/b>하고 이해하는 기술을 가졌음을 의미하지는 않는다는 \u003cb class=\"key\">역설\u003c/b>을 제시합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>전 세대에 걸친 가짜 정보의 취약성\u003csmall>근거 · 문장 3–6\u003c/small>\u003c/h4>\u003cp>스탠퍼드와 뉴욕대의 연구를 통해 젊은 층뿐 아니라 \u003cb class=\"key\">65세 \u003c/b>\u003cb class=\"key\">이상\u003c/b> 노년층 또한 \u003cb class=\"key\">잘못된 \u003c/b>\u003cb class=\"key\">정보\u003c/b>에 취약하며 이를 많이 공유한다는 사실을 보여줍니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>개별적 책임과 정보 문해력\u003csmall>주장 · 문장 7–10\u003c/small>\u003c/h4>\u003cp>정부나 플랫폼의 역할도 중요하지만, 결국 개인이 \u003cb class=\"key\">정보 \u003c/b>\u003cb class=\"key\">문해력\u003c/b>을 갖추고 이 위협에 맞서려는 \u003cb class=\"key\">책임감\u003c/b>을 가져야 함을 강조하며 결론을 맺습니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 미디어 사용량과 실제 능력 사이의 괴리를 보여주며 시작해서, 구체적인 연구 사례를 거쳐 우리의 책임감으로 마무리됩니다.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서는 도입부를 장식하죠. 사람들은 미디어와 상호 작용하는 데 많은 시간을 쓰지만, 그것이 곧 정보를 주의 깊게 검토하고 이해하는 비판적 기술을 가졌다는 뜻은 아니라고 꼬집고 있어요.","hl":"f0"},{"n":5,"text":"세 번째부터 여섯 번째 문장까지는 흥미로운 연구 결과들이 나옵니다. 젊은이들이 소셜 미디어의 가짜 정보에 쉽게 속는다는 스탠퍼드 대학교의 연구와, 육십오 세 이상 어르신들이 정보를 일곱 배나 더 많이 공유한다는 뉴욕 대학교의 조사 결과가 제시되죠.","hl":"f1"},{"n":6,"text":"마지막 일곱 번째부터 열 번째 문장은 이 문제의 해결책을 제시합니다. 정부와 플랫폼의 차단 역할도 분명 필요하지만, 결국 모든 개인이 스스로 정보를 더 잘 이용하는 능력을 키우고 책임감을 느껴야 한다고 강조하며 글을 마칩니다.","hl":"f2"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 9번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">가짜 정보가 범람하는 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">문제\u003c/b>를 먼저 제시하고, 이에 대한 최종적인 해결책으로 개인의 \u003cb class=\"key\">정보 \u003c/b>\u003cb class=\"key\">문해력\u003c/b> 향상을 제시하고 있습니다. 연구 사례들을 통해 문제의 \u003cb class=\"key\">심각성\u003c/b>을 뒷받침한 뒤, 마지막에 필자의 주장을 강하게 드러내는 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>But (2)\u003c/b>\u003cspan>미디어 노출량과 비판적 능력 사이의 대조 유도\u003c/span>\u003cb>however (5)\u003c/b>\u003cspan>청년층에 국한된 문제가 아님을 나타내는 전환\u003c/span>\u003cb>What's the solution (7)\u003c/b>\u003cspan>주제 제시를 위한 질문\u003c/span>\u003cb>However (9)\u003c/b>\u003cspan>외부적 역할보다 개인의 노력을 강조하는 전환\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">media\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">misinformation\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">this weakness\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">misinformation problem\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">this threat\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Young people\u003c/th>\u003cth>People over 65\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Social media misinformation에 쉽게 속음\u003c/td>\u003ctd>Misinformation을 7배 더 많이 공유함\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":7,"text":"이 글은 전형적인 문제와 해결, 즉 problem and solution 구조를 띄고 있습니다. 앞부분에서 전 세대가 겪는 가짜 정보의 취약성이라는 문제를 제기하고, 뒷부분에서 개인의 문해력 향상이라는 해결책을 제시하는 미괄식 구성이죠.","hl":"ty"},{"n":8,"text":"문장 간의 연결을 보면 두 번째 문장의 But과 다섯 번째 문장의 however가 흐름을 전환하며 긴장감을 줍니다. 특히 아홉 번째 문장의 However는 정부의 역할보다 개인의 노력을 더 강조하기 위해 사용된 아주 중요한 신호어니까 꼭 기억해 두세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>spend\u003c/b>\u003cem>동사\u003c/em>\u003cspan>소비하다, 보내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>interact with\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~와 상호 작용하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>media\u003c/b>\u003cem>명사\u003c/em>\u003cspan>미디어, 매체\u003c/span>\u003c/div>\u003cdiv>\u003cb>critical\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>비판적인, 중요한\u003c/span>\u003c/div>\u003cdiv>\u003cb>skill\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기술, 능력\u003c/span>\u003c/div>\u003cdiv>\u003cb>examine\u003c/b>\u003cem>동사\u003c/em>\u003cspan>검토하다, 조사하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>carefully\u003c/b>\u003cem>부사\u003c/em>\u003cspan>주의 깊게\u003c/span>\u003c/div>\u003cdiv>\u003cb>well-known\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>잘 알려진\u003c/span>\u003c/div>\u003cdiv>\u003cb>fooled\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>속은\u003c/span>\u003c/div>\u003cdiv>\u003cb>misinformation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>잘못된 정보\u003c/span>\u003c/div>\u003cdiv>\u003cb>especially\u003c/b>\u003cem>부사\u003c/em>\u003cspan>특히\u003c/span>\u003c/div>\u003cdiv>\u003cb>weakness\u003c/b>\u003cem>명사\u003c/em>\u003cspan>약점\u003c/span>\u003c/div>\u003cdiv>\u003cb>youth\u003c/b>\u003cem>명사\u003c/em>\u003cspan>젊은이, 청년기\u003c/span>\u003c/div>\u003cdiv>\u003cb>shared\u003c/b>\u003cem>동사\u003c/em>\u003cspan>공유했다\u003c/span>\u003c/div>\u003cdiv>\u003cb>raise a question\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>질문을 제기하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>solution\u003c/b>\u003cem>명사\u003c/em>\u003cspan>해결책\u003c/span>\u003c/div>\u003cdiv>\u003cb>certainly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>분명히, 확실히\u003c/span>\u003c/div>\u003cdiv>\u003cb>role\u003c/b>\u003cem>명사\u003c/em>\u003cspan>역할\u003c/span>\u003c/div>\u003cdiv>\u003cb>blocking\u003c/b>\u003cem>동사\u003c/em>\u003cspan>차단하는 것\u003c/span>\u003c/div>\u003cdiv>\u003cb>individual\u003c/b>\u003cem>명사\u003c/em>\u003cspan>개인\u003c/span>\u003c/div>\u003cdiv>\u003cb>literate\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>읽고 쓸 줄 아는\u003c/span>\u003c/div>\u003cdiv>\u003cb>responsibility\u003c/b>\u003cem>명사\u003c/em>\u003cspan>책임\u003c/span>\u003c/div>\u003cdiv>\u003cb>combating\u003c/b>\u003cem>동사\u003c/em>\u003cspan>싸우는 것, 퇴치하는 것\u003c/span>\u003c/div>\u003cdiv>\u003cb>threat\u003c/b>\u003cem>명사\u003c/em>\u003cspan>위협\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"여기서 critical이라는 단어는 비판적이라는 아주 중요한 뜻으로 쓰였고, misinformation은 잘못된 정보, 즉 가짜 뉴스를 의미합니다. 마지막에 나온 literate는 원래 읽고 쓸 줄 안다는 뜻이지만 여기서는 정보를 활용할 줄 안다는 의미로 확장되었어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">critical\u003c/b>\u003cspan class=\"m\">비판적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">analytical\u003c/span>\u003cspan class=\"s\">evaluative\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">uncritical\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">misinformation\u003c/b>\u003cspan class=\"m\">잘못된 정보\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">fake news\u003c/span>\u003cspan class=\"s\">falsehood\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">truth\u003c/span>\u003cspan class=\"a\">fact\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">examine\u003c/b>\u003cspan class=\"m\">검토하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">inspect\u003c/span>\u003cspan class=\"s\">scrutinize\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">fooled\u003c/b>\u003cspan class=\"m\">속은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">deceived\u003c/span>\u003cspan class=\"s\">tricked\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">literate\u003c/b>\u003cspan class=\"m\">문해력이 있는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">educated\u003c/span>\u003cspan class=\"s\">knowledgeable\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">illiterate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">combating\u003c/b>\u003cspan class=\"m\">싸우는, 퇴치하는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">fighting\u003c/span>\u003cspan class=\"s\">opposing\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">supporting\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"유의어를 정리해 볼까요? critical은 analytical과 비슷하고, misinformation은 fake news라고 바꿔 쓸 수도 있겠죠. 반대로 literate의 반대말은 illiterate, 즉 문맹이라는 뜻인데 함께 외워두면 시험에서 단어 문제를 풀 때 큰 도움이 될 거예요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들은 보낸다\u003c/span>\u003cspan class=\"en\">People \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">spend \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 시간을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">much \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">time \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미디어와 상호 작용하는 데\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">interacting\u003c/span> with media.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사람들은 많은 시간을 미디어와 상호 작용하는 데 보낸다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사람들이 일상에서 미디어를 소비하는 \u003cb class=\"key\">비중\u003c/b>이 매우 크다는 사실을 언급하며 글을 \u003cb class=\"key\">도입\u003c/b>하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">spend + 시간 + v-ing\u003c/span> : spend [타동사] + [시간/돈 (목적어)] + [v-ing (현재분사)] : \"많은 시간을 상호 작용하는 데 보내다\"\u003c/div>\u003c/div>","segs":[{"n":11,"text":"People spend, 사람들은 보낸다. much of their time, 많은 시간을. interacting with media, 미디어와 상호 작용하는 데. 이 문장 전체를 해석하면, 사람들은 많은 시간을 미디어와 상호 작용하는 데 보낸다.","hl":"m"},{"n":12,"text":"우리가 하루 중 얼마나 많은 시간을 미디어와 함께 보내는지 보여주며 이야기를 시작하고 있어요. 현대인의 삶에서 미디어가 차지하는 비중이 매우 높다는 점을 강조하는 도입부죠.","hl":"mn"},{"n":13,"text":"첫 번째 문장에서 가장 중요한 표현은 spend 시간 그리고 동사원형에 ing를 붙인 현재분사 형태입니다. spend much of their time interacting 부분에서 상호 작용하는 데 시간을 보낸다라는 의미를 만들기 위해 현재분사를 쓴 것에 주목하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 그것은 의미하는 것은 아니다\u003c/span>\u003cspan class=\"en\">But that does not mean\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들이 중요한 기술을 가지고 있다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">have\u003c/span> the critical skills\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미디어를 주의 깊게 검토하여\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">examine \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">carefully \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이해하는 데\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">understand \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 그것은 사람들이 미디어를 주의 깊게 검토하여 이해하는 데 중요한 기술을 가지고 있다는 것을 의미하는 것은 아니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 미디어를 많이 접한다고 해서 그것을 제대로 분석하고 이해하는 \u003cb class=\"key\">비판적 \u003c/b>\u003cb class=\"key\">능력\u003c/b>까지 갖춘 것은 아니라는 \u003cb class=\"key\">문제 \u003c/b>\u003cb class=\"key\">제기\u003c/b>를 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that\u003c/span> : mean [타동사] + [that (접속사)] + [주어 + 동사 (완전한 문장)] : \"사람들이 가지고 있다는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법과 병렬 구조\u003c/span> : skills [명사] + [to examine (to부정사1) + and + (to) understand (to부정사2)] : \"주의 깊게 검토하여 이해하는 기술\"\u003c/div>\u003c/div>","segs":[{"n":14,"text":"But that does not mean, 하지만 그것은 의미하는 것은 아니다. that people have the critical skills, 사람들이 중요한 기술을 가지고 있다는 것을. to examine it carefully, 미디어를 주의 깊게 검토하여. and understand it, 이해하는 데. 이 문장 전체를 해석하면, 하지만 그것은 사람들이 미디어를 주의 깊게 검토하여 이해하는 데 중요한 기술을 가지고 있다는 것을 의미하는 것은 아니다.","hl":"m"},{"n":15,"text":"단순히 미디어를 많이 쓴다고 해서 다 잘 아는 건 아니라는 뜻이에요. 미디어를 분석하고 제대로 이해할 수 있는 비판적 사고 능력이 부족할 수 있다는 문제를 짚어주고 있네요.","hl":"mn"},{"n":16,"text":"두 가지 포인트를 볼게요. 첫 번째로 mean 뒤에 나오는 that은 목적어 자리에 문장을 데려오는 명사절 접속사예요. 두 번째로 to examine과 understand는 앞에 있는 skills를 꾸며주는 형용사처럼 쓰였어요. and를 사이에 두고 동사원형 두 개가 나란히 연결된 병렬 구조도 확인하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">잘 알려진 한 연구가 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There's\u003c/span> one well-known study\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">스탠퍼드 대학교의\u003c/span>\u003cspan class=\"en\">from Stanford University\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">2016년\u003c/span>\u003cspan class=\"en\">in 2016.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">2016년 스탠퍼드 대학교의 잘 알려진 한 연구가 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 언급한 문제점을 뒷받침하기 위해 신뢰할 수 있는 \u003cb class=\"key\">구체적 \u003c/b>\u003cb class=\"key\">근거\u003c/b>를 제시하며 논의에 \u003cb class=\"key\">객관성\u003c/b>을 더합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">There is + 단수 주어\u003c/span> : There [유도부사] + is [동사] + study [단수 주어] : \"~가 있다\"\u003c/div>\u003c/div>","segs":[{"n":17,"text":"There's one well-known study, 잘 알려진 한 연구가 있다. from Stanford University, 스탠퍼드 대학교의. in 2016, 2016년. 이 문장 전체를 해석하면, 2016년 스탠퍼드 대학교의 잘 알려진 한 연구가 있다.","hl":"m"},{"n":18,"text":"앞서 말한 내용을 증명하기 위해 실제 연구 사례를 소개하는 문장입니다. 스탠퍼드 대학교라는 구체적인 기관을 언급해서 글의 신뢰도를 높이고 있죠.","hl":"mn"},{"n":19,"text":"문장 처음에 나오는 There's는 There is의 줄임말이에요. 이 구문에서는 뒤에 나오는 명사가 진짜 주어인데, 여기서는 one well-known study라는 단수 명사가 주어이기 때문에 단수 동사인 is를 썼습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 연구는 보여 주었다\u003c/span>\u003cspan class=\"en\">The study showed\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">젊은이들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">young \u003c/span>\u003cspan class=\"tgt\">people\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">잘못된 정보에 쉽게 속는다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">easily \u003c/span>\u003cspan class=\"tgt\">fooled\u003c/span> by misinformation,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">특히\u003c/span>\u003cspan class=\"en\">especially\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 올 때\u003c/span>\u003cspan class=\"en\">when \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">it\u003c/span> comes\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">소셜 미디어 채널을 통해\u003c/span>\u003cspan class=\"en\">through social media channels.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 연구는 젊은이들이 특히 소셜 미디어 채널을 통해 잘못된 정보에 쉽게 속는다는 것을 보여 주었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 젊은 세대가 디지털 기기에 익숙함에도 불구하고 \u003cb class=\"key\">가짜 \u003c/b>\u003cb class=\"key\">뉴스\u003c/b>를 구별하는 데 취약하며, 특히 \u003cb class=\"key\">소셜 \u003c/b>\u003cb class=\"key\">미디어\u003c/b> 환경에서 더 잘 속는다는 연구 결과를 소개합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that\u003c/span> : showed [타동사] + [that + 주어 + 동사 (명사절/목적어)] : \"~라는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : be동사 (are) + 과거분사 (fooled) : \"속는다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">대명사의 지칭\u003c/span> : it = misinformation : \"그것 (잘못된 정보)\"\u003c/div>\u003c/div>","segs":[{"n":20,"text":"The study showed, 그 연구는 보여 주었다. that young people, 젊은이들이. are easily fooled by misinformation, 잘못된 정보에 쉽게 속는다는 것을. especially, 특히. when it comes, 그것이 올 때. through social media channels, 소셜 미디어 채널을 통해. 이 문장 전체를 해석하면, 그 연구는 젊은이들이 특히 소셜 미디어 채널을 통해 잘못된 정보에 쉽게 속는다는 것을 보여 주었다.","hl":"m"},{"n":21,"text":"젊은 사람들이 소셜 미디어를 아주 잘 다루지만 실제로는 잘못된 정보를 가려내는 능력이 부족하다는 연구 결과예요. 디지털 네이티브라고 불리는 세대조차 가짜 뉴스에 쉽게 노출되고 속을 수 있다는 점을 지적하고 있죠.","hl":"mn"},{"n":22,"text":"첫 번째 포인트는 동사 showed 다음에 나오는 접속사 that입니다. 문장 끝까지 이어지는 명사절을 이끌어 목적어 역할을 하고 있어요. 두 번째는 are easily fooled라는 수동태인데 젊은이들이 속임을 당하는 입장이니 현재시제 수동태를 썼습니다. 마지막으로 it은 앞에 나온 잘못된 정보인 misinformation을 가리키는 대명사라는 점도 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 약점은\u003c/span>\u003cspan class=\"en\">This weakness\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">발견되는 것은 아니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">found\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">젊은이에게서만\u003c/span>\u003cspan class=\"en\">only in youth,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">however\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 이러한 약점은 젊은이에게서만 발견되는 것은 아니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 잘못된 정보에 취약한 문제가 특정 세대만의 문제가 아님을 밝히며, 논의의 범위를 \u003cb class=\"key\">전 \u003c/b>\u003cb class=\"key\">연령대\u003c/b>로 확장하는 \u003cb class=\"key\">연결고리\u003c/b> 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태의 부정문\u003c/span> : be동사 (is) + not + 과거분사 (found) : \"발견되지 않는다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">연결 부사\u003c/span> : 문장 끝 혹은 중간에 위치하여 앞 내용과 대조 : \"그러나\"\u003c/div>\u003c/div>","segs":[{"n":23,"text":"This weakness, 이러한 약점은. is not found, 발견되는 것은 아니다. only in youth, 젊은이에게서만. however, 그러나. 이 문장 전체를 해석하면, 그러나 이러한 약점은 젊은이에게서만 발견되는 것은 아니다.","hl":"m"},{"n":24,"text":"가짜 뉴스에 속는 이 약점이 단지 젊은 사람들에게만 해당되는 것이 아니라는 말이에요. 이제 뒤에서 다른 연령대의 사례가 나올 것이라는 걸 암시하고 있죠.","hl":"mn"},{"n":25,"text":"첫 번째로 is not found는 수동태의 부정문이에요. 약점이라는 주어가 발견되는 것이므로 수동태를 썼고 be동사 뒤에 부정어 not을 위치시켰습니다. 두 번째로 문장 끝에 있는 however는 흐름을 뒤집어주는 연결 부사로 하지만이라는 뜻입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">뉴욕 대학교의 조사는 알아냈다\u003 n class=\"gn\">to부정사의 형용사적 용법\u003c/span> : 명사(a role) + to부정사(to play) : \"수행해야 할 역할\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 + 동명사\u003c/span> : 전치사(in) + 동명사(blocking) : \"막는 데 있어\"\u003c/div>\u003c/div>","segs":[{"n":32,"text":"Governments and tech platforms, 정부와 기술 플랫폼은. certainly have a role, 분명히 역할을 가지고 있다. to play, 해야 할. in blocking misinformation, 잘못된 정보를 막아내는 데. 이 문장 전체를 해석하면, 정부와 기술 플랫폼은 분명히 잘못된 정보를 막아내는 데 해야 할 역할이 있다.","hl":"m"},{"n":33,"text":"가짜 뉴스를 차단하기 위해 정부의 정책적 노력과 IT 기업의 기술적 필터링 같은 공적인 시스템의 기여가 반드시 필요하다는 뜻이에요.","hl":"mn"},{"n":34,"text":"첫 번째로 명사 role 뒤에 나온 to play는 형용사처럼 명사를 꾸며주어 해야 할 역할이라고 해석하고요, 두 번째로 전치사 in 다음에는 동사 block에 ing를 붙인 동명사 형태인 blocking을 써야 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나,\u003c/span>\u003cspan class=\"en\">However,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 개인이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">every \u003c/span>\u003cspan class=\"tgt\">individual\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">될 필요가 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">needs \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">become\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정보를 더 잘 이용하게\u003c/span>\u003cspan class=\"en\">more information literate.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 모든 개인이 정보를 더 잘 이용하게 될 필요가 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 외부의 규제도 중요하지만 결국 \u003cb class=\"key\">개별 \u003c/b>\u003cb class=\"key\">수용자\u003c/b>의 정보 \u003cb class=\"key\">판별 \u003c/b>\u003cb class=\"key\">능력\u003c/b>이 핵심적인 해결책임을 강조하는 글의 요지 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">every + 단수명사\u003c/span> : every + 단수명사(individual) : \"모든 개인\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">need의 목적어(to부정사)\u003c/span> : 동사(needs) + to부정사(to become) : \"될 필요가 있다\"\u003c/div>\u003c/div>","segs":[{"n":35,"text":"However, 그러나. every individual, 모든 개인이. needs to become, 될 필요가 있다. more information literate, 정보를 더 잘 이용하게. 이 문장 전체를 해석하면, 그러나 모든 개인이 정보를 더 잘 이용하게 될 필요가 있다.","hl":"m"},{"n":36,"text":"앞에서 정부의 책임을 언급했지만 하지만이라는 역접의 접속사를 통해 진짜 중요한 결론은 우리 각자가 정보 판별 능력을 갖추는 것이라는 점을 강조하고 있어요.","hl":"mn"},{"n":37,"text":"첫 번째로 every 뒤에는 individual처럼 반드시 단수 명사를 써야 한다는 점을 기억하세요. 두 번째로 주어가 단수니까 동사도 needs라고 쓰고, need의 목적어 자리에는 to become이라는 to부정사 형태가 와야 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그들은 책임을 져야 한다\u003c/span>\u003cspan class=\"en\">And they should \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">take \u003c/span>\u003cspan class=\"tgt\">responsibility \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 위협에 맞서 싸울\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">for\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">combating\u003c/span> this threat\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정보를 더 잘 이용하게 됨으로써.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">becoming\u003c/span> more information literate.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그리고 그들은 정보를 더 잘 이용하게 됨으로써 이러한 위협에 맞서 싸울 책임을 져야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 가짜 뉴스 문제 해결을 위해 정부나 플랫폼의 역할뿐만 아니라 각 \u003cb class=\"key\">개인\u003c/b>의 노력이 필수적임을 강조하며 글을 마무리합니다. 스스로 정보의 진위를 가릴 줄 아는 \u003cb class=\"key\">판단력\u003c/b>을 갖추는 것이 해결의 핵심입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사구 관용 표현\u003c/span> : take responsibility for + [명사/동명사] : \"~에 대해 책임을 지다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사의 목적어(동명사)\u003c/span> : for [전치사] + combating [동명사] : \"맞서 싸울\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">수단·방법의 전치사구\u003c/span> : by + [동명사 (~ing)] : \"~하게 됨으로써\"\u003c/div>\u003c/div>","segs":[{"n":38,"text":"And they should take responsibility, 그리고 그들은 책임을 져야 한다. for combating this threat, 이러한 위협에 맞서 싸울. by becoming more information literate, 정보를 더 잘 이용하게 됨으로써.. 이 문장 전체를 해석하면, 그리고 그들은 정보를 더 잘 이용하게 됨으로써 이러한 위협에 맞서 싸울 책임을 져야 한다.","hl":"m"},{"n":39,"text":"이 문장은 가짜 뉴스 문제 해결을 위해 정부나 기업뿐만 아니라 개인의 주체적 노력이 필요함을 강조하며 결론을 내리고 있어요. 정보의 홍수 속에서 개인이 스스로 판단력을 갖추는 것이 근본적인 해결책이라는 뜻이죠.","hl":"mn"},{"n":40,"text":"첫 번째로 take responsibility for는 무엇에 대해 책임을 지다라는 뜻의 중요한 관용구예요. 두 번째로 전치사 for 뒤에는 동사 combat에 ing를 붙인 동명사 형태가 와야 합니다. 마지막으로 by becoming은 수단이나 방법을 나타내어 무엇을 함으로써라고 해석하면 아주 자연스러워요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>사람들의 미디어 사용 시간 증가는 정보를 \u003cb class=\"key\">비판적으로 \u003c/b>\u003cb class=\"key\">분석\u003c/b>하는 능력의 향상으로 직결되지 않습니다.\u003c/li>\u003cli>젊은 층은 소셜 미디어의 가짜 정보에 취약하며, \u003cb class=\"key\">65세 \u003c/b>\u003cb class=\"key\">이상\u003c/b>은 훨씬 더 많은 정보를 공유한다는 연구 결과가 있습니다.\u003c/li>\u003cli>가짜 정보를 막기 위해 정부나 플랫폼의 역할도 중요하지만, 가장 본질적인 해결책은 \u003cb class=\"key\">개인의 \u003c/b>\u003cb class=\"key\">노력\u003c/b>입니다.\u003c/li>\u003cli>모든 개별 사용자는 \u003cb class=\"key\">정보 \u003c/b>\u003cb class=\"key\">문해력\u003c/b>을 갖추고 정보의 위협에 맞설 책임을 가져야 합니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>To combat the widespread problem of misinformation, individuals of all ages must develop information literacy and take personal responsibility.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">미디어 사용 시간이 많아도 정보를 \u003cb class=\"key\">비판적으로 \u003c/b>\u003cb class=\"key\">검토\u003c/b>하는 능력은 별개의 문제이며, 전 세대에 걸쳐 나타나는 가짜 정보 문제를 해결하기 위해 개인의 \u003cb class=\"key\">정보 \u003c/b>\u003cb class=\"key\">문해력\u003c/b>과 책임감이 필수적입니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":41,"text":"오늘 우리는 미디어 시대에 꼭 필요한 정보 문해력과 개인의 책임감에 대해 배웠습니다. 이제는 정보를 볼 때 무조건 믿기보다 한 번 더 의심해 보는 습관을 가져보세요. 오늘 배운 핵심 표현들 복습하는 것 잊지 마시고, 다음 시간에 더 유익한 내용으로 만나요! 수고하셨습니다.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
