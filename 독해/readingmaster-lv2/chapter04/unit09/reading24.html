<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터2 Reading24 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터2 Reading24","audioDir":"reading24_audio","preview":false,"count":42,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.668em\">Reading\u003cbr>24\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터 레벨2\u003c/div>\u003ch1>Newton's Hidden Genius: The Invention of the Pet Door\u003c/h1>\u003ch2>뉴턴의 숨겨진 천재성: 반려동물용 문의 발명\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>위대한 과학자 뉴턴은 \u003cb class=\"key\">반려동물 \u003c/b>\u003cb class=\"key\">애호가\u003c/b>였으며, 개 때문에 연구 노트를 잃는 시련을 겪기도 했지만, 결국 고양이의 방해를 해결하기 위해 오늘날의 \u003cb class=\"key\">반려동물용 \u003c/b>\u003cb class=\"key\">문\u003c/b>을 발명했습니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Isaac Newton, known for his scientific achievements, was also a pet lover who invented the pet door to balance his research and his cat's needs.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 인류 역사상 가장 위대한 과학자 중 한 명인 아이작 뉴턴의 색다른 면모를 살펴보겠습니다. 뉴턴 하면 중력의 법칙만 떠올리겠지만, 사실 그는 대단한 반려동물 애호가였다고 해요. 오늘은 그의 동물이 연구에 어떤 영향을 끼쳤는지, 그리고 오늘날 우리가 쓰는 반려동물용 문이 어떻게 탄생했는지 요지와 함께 정리해 드릴게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">아이작 뉴턴은 사과가 떨어지는 것을 보고 \u003cb class=\"key\">만유인력의 \u003c/b>\u003cb class=\"key\">법칙\u003c/b>(Law of Universal Gravitation)을 발견한 인물로 유명합니다. 그는 평생을 연구에 바친 엄격한 학자 같지만, 사실 일상에서는 여러 마리의 동물을 키우는 \u003cb class=\"key\">애완동물 \u003c/b>\u003cb class=\"key\">애호가\u003c/b>(pet lover)였습니다. 공부할 때 옆에서 방해하는 고양이나 물건을 건드리는 강아지 같은 상황은 현대의 \u003cb class=\"key\">집사\u003c/b>(pet owner)들이 겪는 고민과 매우 비슷합니다. 뉴턴은 이러한 일상의 불편함을 참기만 한 것이 아니라, 과학자답게 \u003cb class=\"key\">창의적 \u003c/b>\u003cb class=\"key\">해결책\u003c/b>(creative solution)을 찾아냈습니다. 마치 우리가 더운 여름을 해결하기 위해 선풍기를 만든 것처럼, 그는 고양이와 평화롭게 공존하기 위해 새로운 통로를 설계한 것입니다.\u003c/div>","segs":[{"n":2,"text":"뉴턴은 근대 과학의 기틀을 마련한 인물입니다. 하지만 그는 학문에만 파묻혀 산 것이 아니라, 강아지와 고양이를 키우며 일상의 기쁨과 고충을 함께 나눴죠. 여러분도 공부할 때 반려동물이 방해해서 난감했던 적이 있나요? 뉴턴도 그런 인간적인 고민을 했습니다. 특히 고양이의 끈질긴 출입 요구를 해결하기 위해 발명한 것이 바로 지금의 pet door입니다. 과학자의 호기심이 일상의 창의적 해결책으로 이어진 아주 재미있는 사례라고 할 수 있어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>뉴턴의 이면\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>아이작 뉴턴의 과학적 업적을 먼저 언급한 뒤, 그가 \u003cb class=\"key\">반려동물 \u003c/b>\u003cb class=\"key\">애호가\u003c/b>였다는 의외의 사실을 소개하며 \u003cb class=\"key\">관심을 \u003c/b>\u003cb class=\"key\">환기\u003c/b>시킵니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>강아지 일화\u003csmall>예시 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>사랑하는 강아지가 양초를 넘어뜨려 소중한 \u003cb class=\"key\">연구 \u003c/b>\u003cb class=\"key\">노트\u003c/b>를 태워버렸던 \u003cb class=\"key\">부정적인 \u003c/b>\u003cb class=\"key\">사례\u003c/b>를 제시합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>고양이와 해결책\u003csmall>전환 및 주장 · 문장 6–8\u003c/small>\u003c/h4>\u003cp>하지만 고양이의 방해는 오히려 \u003cb class=\"key\">반려동물용 \u003c/b>\u003cb class=\"key\">문\u003c/b>이라는 창의적인 \u003cb class=\"key\">해결책\u003c/b>을 고안하는 계기가 되었음을 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>발명의 영향\u003csmall>결론 · 문장 9–10\u003c/small>\u003c/h4>\u003cp>이 발명 덕분에 뉴턴은 방해받지 않았고, 오늘날의 고양이들도 주인에게 \u003cb class=\"key\">감사해야 \u003c/b>\u003cb class=\"key\">할 \u003c/b>\u003cb class=\"key\">혜택\u003c/b>을 누리게 되었습니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"글의 흐름을 보면 위대한 뉴턴의 모습에서 시작해, 그의 사생활과 구체적인 일화 두 가지가 차례대로 나옵니다.","hl":null},{"n":4,"text":"첫 번째에서 세 번째 문장은 도입부예요. 역사적인 과학자 뉴턴이 사실은 동물 친구들 때문에 산만함을 느끼기도 했던 반려동물 애호가였다는 사실을 알려주며 독자의 관심을 끕니다.","hl":"f0"},{"n":5,"text":"네 번째와 다섯 번째 문장은 강아지 일화입니다. 가장 좋아하던 개가 양초를 쳐서 넘어뜨리는 바람에 소중한 연구 노트가 불타버렸고, 뉴턴이 정서적 충격까지 받았던 안타까운 예시를 보여주죠.","hl":"f1"},{"n":6,"text":"여섯 번째에서 여덟 번째 문장은 분위기가 반전됩니다. 짜증 나게 하던 고양이에 대한 대처가 오히려 반려동물용 문이라는 훌륭한 해결책이자 행복한 결과로 이어졌음을 설명합니다.","hl":"f2"},{"n":7,"text":"마지막 아홉 번째와 열 번째 문장은 결론입니다. 이 발명 덕분에 뉴턴은 방해를 받지 않게 되었고, 오늘날의 고양이들도 주인에게 폐를 끼치지 않고 자유롭게 다닐 수 있게 되었다는 감사한 영향을 강조하며 끝납니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">비교·대조\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 3번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글의 앞부분에서 뉴턴의 대중적인 이미지와 상반되는 \u003cb class=\"key\">반려동물 \u003c/b>\u003cb class=\"key\">애호가\u003c/b>로서의 특징을 제시합니다. 이후 강아지로 인한 \u003cb class=\"key\">불행한 \u003c/b>\u003cb class=\"key\">결과\u003c/b>와 고양이로 인한 \u003cb class=\"key\">행복한 \u003c/b>\u003cb class=\"key\">결과\u003c/b>를 대조하여 이야기를 전개합니다. 마지막에는 고양이를 위한 \u003cb class=\"key\">창의적 \u003c/b>\u003cb class=\"key\">발명\u003c/b>이 현대까지 미치는 영향을 강조하며 마무리합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>But (3)\u003c/b>\u003cspan>역접(위대한 과학자 이미지와 다른 사생활 소개)\u003c/span>\u003cb>For instance (4)\u003c/b>\u003cspan>예시(반려동물로 인한 고충의 구체적 사례)\u003c/span>\u003cb>However (6)\u003c/b>\u003cspan>대조(부정적 사례에서 긍정적 사례로의 전환)\u003c/span>\u003cb>So (8)\u003c/b>\u003cspan>인과(짜증나는 상황에 대한 해결책 도출)\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Isaac Newton\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">one of history's greatest scientists\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a pet lover\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">their human friends\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Dog Incident\u003c/th>\u003cth>Cat Incident\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Knocked over a candle\u003c/td>\u003ctd>Interrupted constantly\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Burned research notes\u003c/td>\u003ctd>Invention of pet door\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Emotional breakdown\u003c/td>\u003ctd>Happier result\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 뉴턴의 삶을 다룬 일화 중심의 전개 방식을 취하고 있습니다. 특히 글의 중간에서 핵심 주제가 반려동물 사랑으로 확장되는 중괄식 구조를 가지고 있어요. 위대한 업적 뒤에 숨겨진 인간적인 면을 대조하며 보여주는 것이 특징입니다.","hl":"ty"},{"n":9,"text":"중요한 신호어들을 볼까요? 세 번째 문장의 But은 일반적인 뉴턴의 이미지와 반대되는 사실을 가져오고, 여섯 번째 문장의 However는 강아지 이야기와 고양이 이야기를 대조해줍니다. 여덟 번째 문장의 So는 고양이의 방해라는 원인에 대한 결과로 해결책이 나왔음을 보여주는 핵심 연결어입니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>greatest\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>위대한\u003c/span>\u003c/div>\u003cdiv>\u003cb>lifetime\u003c/b>\u003cem>명사\u003c/em>\u003cspan>일생\u003c/span>\u003c/div>\u003cdiv>\u003cb>numerous\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>수많은\u003c/span>\u003c/div>\u003cdiv>\u003cb>contribution\u003c/b>\u003cem>명사\u003c/em>\u003cspan>공헌\u003c/span>\u003c/div>\u003cdiv>\u003cb>realize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>깨닫다\u003c/span>\u003c/div>\u003cdiv>\u003cb>pet lover\u003c/b>\u003cem>명사\u003c/em>\u003cspan>반려동물 애호가\u003c/span>\u003c/div>\u003cdiv>\u003cb>drive to distraction\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>산만하게 만들다\u003c/span>\u003c/div>\u003cdiv>\u003cb>for instance\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>예를 들어\u003c/span>\u003c/div>\u003cdiv>\u003cb>suffer\u003c/b>\u003cem>동사\u003c/em>\u003cspan>겪다\u003c/span>\u003c/div>\u003cdiv>\u003cb>emotional breakdown\u003c/b>\u003cem>명사\u003c/em>\u003cspan>감정적인 신경쇠약\u003c/span>\u003c/div>\u003cdiv>\u003cb>favorite\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>가장 좋아하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>knock over\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>쳐서 넘어뜨리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>research notes\u003c/b>\u003cem>명사\u003c/em>\u003cspan>연구 노트\u003c/span>\u003c/div>\u003cdiv>\u003cb>dealings\u003c/b>\u003cem>명사\u003c/em>\u003cspan>대처, 관계\u003c/span>\u003c/div>\u003cdiv>\u003cb>annoying\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>짜증나게 하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>lead to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 이어지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>according to legend\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>전해오는 이야기에 따르면\u003c/span>\u003c/div>\u003cdiv>\u003cb>constantly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>끊임없이\u003c/span>\u003c/div>\u003cdiv>\u003cb>interrupt\u003c/b>\u003cem>동사\u003c/em>\u003cspan>방해하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>demand\u003c/b>\u003cem>명사\u003c/em>\u003cspan>요구\u003c/span>\u003c/div>\u003cdiv>\u003cb>be let in\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>안으로 들여보내지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>come up with\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>생각해 내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>solution\u003c/b>\u003cem>명사\u003c/em>\u003cspan>해결책\u003c/span>\u003c/div>\u003cdiv>\u003cb>pet door\u003c/b>\u003cem>명사\u003c/em>\u003cspan>반려동물용 문\u003c/span>\u003c/div>\u003cdiv>\u003cb>disturb\u003c/b>\u003cem>동사\u003c/em>\u003cspan>방해하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>ability\u003c/b>\u003cem>명사\u003c/em>\u003cspan>능력\u003c/span>\u003c/div>\u003cdiv>\u003cb>trouble\u003c/b>\u003cem>동사\u003c/em>\u003cspan>괴롭히다\u003c/span>\u003c/div>\u003cdiv>\u003cb>thank\u003c/b>\u003cem>동사\u003c/em>\u003cspan>감사하다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"단어를 살펴보면 drive to distraction이라는 표현이 나오는데, 누군가를 아주 산만하게 만들거나 괴롭힌다는 뜻이에요. 또 dealings는 여기서 어떤 대상을 다루는 일이나 대처를 의미하죠. 마지막 문장의 ability는 고양이가 스스로 드나들 수 있는 능력을 말합니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">numerous\u003c/b>\u003cspan class=\"m\">수많은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">many\u003c/span>\u003cspan class=\"s\">countless\u003c/span>\u003cspan class=\"s\">abundant\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">few\u003c/span>\u003cspan class=\"a\">scarce\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">realize\u003c/b>\u003cspan class=\"m\">깨닫다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">recognize\u003c/span>\u003cspan class=\"s\">notice\u003c/span>\u003cspan class=\"s\">perceive\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">disturb\u003c/b>\u003cspan class=\"m\">방해하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">interrupt\u003c/span>\u003cspan class=\"s\">bother\u003c/span>\u003cspan class=\"s\">interfere\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">assist\u003c/span>\u003cspan class=\"a\">help\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">annoying\u003c/b>\u003cspan class=\"m\">짜증나게 하는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">irritating\u003c/span>\u003cspan class=\"s\">bothersome\u003c/span>\u003cspan class=\"s\">vexing\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">pleasing\u003c/span>\u003cspan class=\"a\">agreeable\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">constantly\u003c/b>\u003cspan class=\"m\">끊임없이\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">continuously\u003c/span>\u003cspan class=\"s\">persistently\u003c/span>\u003cspan class=\"s\">incessantly\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">occasionally\u003c/span>\u003cspan class=\"a\">rarely\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"핵심 어휘인 numerous는 many나 countless와 같은 동의어로 바꿔 쓸 수 있고, 반대말로는 few를 기억하세요. disturb는 방해하다라는 뜻인데 interrupt와 비슷하고, 도와주다라는 뜻의 assist와는 반의어 관계입니다. annoying은 짜증을 유발하는 상황에서 자주 쓰이는 형용사입니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아이작 뉴턴은 ~이다\u003c/span>\u003cspan class=\"en\">Isaac Newton is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">역사상 가장 위대한 과학자 중 한 명\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">history's \u003c/span>\u003cspan class=\"tgt\">greatest \u003c/span>\u003cspan class=\"tgt\">scientists\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">아이작 뉴턴은 역사상 가장 위대한 과학자 중 한 명이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글의 주인공인 뉴턴을 소개하며 그가 \u003cb class=\"key\">과학계의 \u003c/b>\u003cb class=\"key\">거장\u003c/b>임을 강조하는 도입부 문장입니다. 이후 나올 반려동물 관련 일화와 대비되는 그의 \u003cb class=\"key\">학문적 \u003c/b>\u003cb class=\"key\">업적\u003c/b>을 먼저 언급하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">one of + 최상급 + 복수명사\u003c/span> : one of + the [최상급 형용사] + [복수 명사] : \"가장 위대한 과학자들 중 한 명\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Isaac Newton is, 아이작 뉴턴은 ~이다. one of history's greatest scientists, 역사상 가장 위대한 과학자 중 한 명. 이 문장 전체를 해석하면, 아이작 뉴턴은 역사상 가장 위대한 과학자 중 한 명이다.","hl":"m"},{"n":13,"text":"위대한 과학자로 잘 알려진 뉴턴에 대해 소개하며 글을 시작하고 있어요. 뒤에 나올 반전 내용을 위해 그의 학문적 거장으로서의 면모를 먼저 보여주는 거죠.","hl":"mn"},{"n":14,"text":"여기서는 one of 뒤에 복수 명사가 온다는 점에 주목하세요. 여러 과학자들 중 한 명을 말하니까 scientists 뒤에 S를 꼭 붙여서 복수 명사 형태로 써야 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일생 동안\u003c/span>\u003cspan class=\"en\">During his lifetime\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 수많은 공헌을 했다\u003c/span>\u003cspan class=\"en\">he \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">made \u003c/span>\u003cspan class=\"tgt\">numerous \u003c/span>\u003cspan class=\"tgt\">contributions \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">과학에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to\u003c/span> science.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">일생 동안 그는 과학에 수많은 공헌을 했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 뉴턴이 과학 분야에 남긴 \u003cb class=\"key\">막대한 \u003c/b>\u003cb class=\"key\">영향력\u003c/b>을 설명하며 그의 위상을 공고히 합니다. 반려동물 이야기를 꺼내기 전, 그의 \u003cb class=\"key\">공식적인 \u003c/b>\u003cb class=\"key\">업적\u003c/b>을 마무리하는 단계입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사구 표현(make a contribution to)\u003c/span> : make + contribution + to [전치사] + [명사] : \"~에 수많은 공헌을 하다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"During his lifetime, 일생 동안. he made numerous contributions, 그는 수많은 공헌을 했다. to science, 과학에. 이 문장 전체를 해석하면, 일생 동안 그는 과학에 수많은 공헌을 했다.","hl":"m"},{"n":16,"text":"뉴턴이 살아생전 과학계에 끼친 막대한 영향력이 얼마나 컸는지 설명하는 문장이에요.","hl":"mn"},{"n":17,"text":"여기서 make a contribution to는 어디에 기여하다라는 뜻인데, 수많은이라는 뜻의 형용사 numerous가 들어갔죠. 전치사 to 뒤에는 기여하는 대상인 science가 온다는 걸 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 아는 사람은 거의 없다\u003c/span>\u003cspan class=\"en\">But \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">few \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">realize\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그가 또한 반려동물 애호가였다거나\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">also \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">pet \u003c/span>\u003cspan class=\"tgt\">lover \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">혹은 때때로 그의 많은 동물 친구들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">― \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">sometimes\u003c/span> many of his animal friends\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그를 산만하게 만들 수 있었다는 것을\u003c/span>\u003cspan class=\"en\">could \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">drive \u003c/span>\u003cspan class=\"tgt\">him \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">distraction\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 그가 또한 반려동물 애호가였다거나 때때로 그의 많은 동물 친구들이 그를 산만하게 만들 수 있었다는 것을 아는 사람은 거의 없다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 하지만(But)을 기점으로 분위기가 반전되며, 잘 알려지지 않은 \u003cb class=\"key\">뉴턴의 \u003c/b>\u003cb class=\"key\">사생활\u003c/b>을 소개합니다. 반려동물이 때로는 그의 \u003cb class=\"key\">집중력을 \u003c/b>\u003cb class=\"key\">방해\u003c/b>하기도 했음을 암시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정어 few\u003c/span> : few + [복수 명사] + [긍정형 동사] : \"사람들은 거의 깨닫지 못한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that의 병렬 구조\u003c/span> : realize + [that절 1] + or + [that절 2] : \"~라는 것 또는 ~라는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">관용 표현(drive someone to distraction)\u003c/span> : drive + [목적어] + to distraction : \"그를 산만하게 만들다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"But few people realize, 하지만 아는 사람은 거의 없다. that he was also a pet lover, 그가 또한 반려동물 애호가였다거나. ― or that sometimes many of his animal friends, 혹은 때때로 그의 많은 동물 친구들이. could drive him to distraction, 그를 산만하게 만들 수 있었다는 것을. 이 문장 전체를 해석하면, 하지만 그가 또한 반려동물 애호가였다거나 때때로 그의 많은 동물 친구들이 그를 산만하게 만들 수 있었다는 것을 아는 사람은 거의 없다.","hl":"m"},{"n":19,"text":"대중에게 잘 알려진 과학자로서의 모습과는 다른 뉴턴의 사생활을 보여주며 독자의 호기심을 유발하고 있어요.","hl":"mn"},{"n":20,"text":"첫 번째 포인트는 few입니다. 앞에 a가 없으면 부정의 의미로 해석해서 아는 사람이 거의 없다고 읽어야 해요. 두 번째는 접속사 that이 이끄는 문장 두 개가 or로 연결된 병렬 구조라는 점입니다. 마지막으로 drive someone to distraction은 상대를 아주 정신 산만하게 만든다는 유용한 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들어,\u003c/span>\u003cspan class=\"en\">For instance,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 한때 겪었다\u003c/span>\u003cspan class=\"en\">he once \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">suffered\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">감정적인 신경쇠약을\u003c/span>\u003cspan class=\"en\">an emotional breakdown\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가장 좋아하는 개가 ~했을 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">when\u003c/span> a favorite dog\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">양초를 쳐서 넘어뜨렸을 (때)\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">knocked \u003c/span>\u003cspan class=\"tgt\">over\u003c/span> a candle\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 책상 위에 있던\u003c/span>\u003cspan class=\"en\">on his desk.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">예를 들어, 한번은 가장 좋아하는 개가 그의 책상 위에 있던 양초를 쳐서 넘어뜨렸을 때 그는 감정적인 신경쇠약을 겪었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 뉴턴이 개 때문에 연구 자료를 잃고 \u003cb class=\"key\">정신적 \u003c/b>\u003cb class=\"key\">충격\u003c/b>을 받았던 일화입니다. 글 전체에서 뉴턴이 동물을 사랑했으면서도 그들 때문에 \u003cb class=\"key\">곤혹스러운 \u003c/b>\u003cb class=\"key\">상황\u003c/b>에 처했음을 보여주는 사례입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거 동사(타동사)\u003c/span> : suffered [동사] + an emotional breakdown [목적어] : \"겪었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">시간의 부사절 접속사\u003c/span> : when [접속사] + 주어 + 동사 : \"~했을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">구동사(타동사구)\u003c/span> : knocked over [동사] + a candle [목적어] : \"쳐서 넘어뜨렸다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"For instance, 예를 들어. he once suffered, 그는 한때 겪었다. an emotional breakdown, 감정적인 신경쇠약을. when a favorite dog, 가장 좋아하는 개가 ~했을 때. knocked over a candle, 양초를 쳐서 넘어뜨렸을 (때). on his desk, 그의 책상 위에 있던. 이 문장 전체를 해석하면, 예를 들어, 한번은 가장 좋아하는 개가 그의 책상 위에 있던 양초를 쳐서 넘어뜨렸을 때 그는 감정적인 신경쇠약을 겪었다.","hl":"m"},{"n":22,"text":"뉴턴이 기르던 개 때문에 큰 상처를 입었던 구체적인 예시를 들고 있어요. 개가 양초를 넘어뜨려 연구 자료가 탔을 때 느꼈던 감정적인 신경쇠약 즉 정신적 충격을 설명하고 있죠.","hl":"mn"},{"n":23,"text":"첫 번째로 suffered는 타동사로 쓰여 뒤에 감정적인 신경쇠약이라는 목적어를 바로 취하며 과거 시제를 나타냅니다. 두 번째로 접속사 when이 뒤에 문장을 연결해 사건의 시점을 설명해 주었고요. 세 번째로 knocked over는 무엇을 쳐서 넘어뜨리다라는 뜻의 구동사로 쓰였답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 개는 태웠다\u003c/span>\u003cspan class=\"en\">The dog \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">burned\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 ~ 중 일부를\u003c/span>\u003cspan class=\"en\">some of his\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">중요한 연구 노트를\u003c/span>\u003cspan class=\"en\">important research notes.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 개는 그의 중요한 연구 노트 중 일부를 태웠다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사고의 구체적인 \u003cb class=\"key\">피해 \u003c/b>\u003cb class=\"key\">내용\u003c/b>을 설명합니다. 개가 친 양초 때문에 뉴턴의 \u003cb class=\"key\">중요한 \u003c/b>\u003cb class=\"key\">연구\u003c/b> 자료가 소실되었다는 사실을 전달합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거 동사(타동사)\u003c/span> : burned [동사] + research notes [목적어] : \"태웠다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"The dog burned, 그 개는 태웠다. some of his, 그의 ~ 중 일부를. important research notes, 중요한 연구 노트를. 이 문장 전체를 해석하면, 그 개는 그의 중요한 연구 노트 중 일부를 태웠다.","hl":"m"},{"n":25,"text":"앞 문장에서 말한 사건의 비극적인 결과를 보여주는 문장이에요. 뉴턴에게 가장 소중했을 중요한 연구 자료가 불에 타버린 상황을 간결하게 나타내고 있어요.","hl":"mn"},{"n":26,"text":"문장의 동사인 burned는 무엇을 태우다라는 뜻의 능동태 과거형 동사로 쓰였어요. 뒤에 나오는 research notes라는 명사구를 목적어로 가지는 타동사의 역할을 하고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만,\u003c/span>\u003cspan class=\"en\">However,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~에 대한 그의 대처는\u003c/span>\u003cspan class=\"en\">his \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">dealings\u003c/span> with\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">짜증나게 하는 고양이에 대한\u003c/span>\u003cspan class=\"en\">an \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">annoying\u003c/span> cat\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~로 이어졌다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">led \u003c/span>\u003cspan class=\"tgt\">to\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 행복한 결과로\u003c/span>\u003cspan class=\"en\">a happier result.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만, 짜증나게 하는 고양이에 대한 그의 대처는 더 행복한 결과로 이어졌다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞선 개의 일화와 대조되는 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">사례\u003c/b>로 전환되는 부분입니다. 짜증 나는 상황이 오히려 \u003cb class=\"key\">긍정적인 \u003c/b>\u003cb class=\"key\">결과\u003c/b>인 고양이 문 발명으로 이어졌음을 암시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사 주어\u003c/span> : his dealings [주어/명사] + with [전치사] : \"대처, 관계\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재분사의 형용사적 용법\u003c/span> : annoying [현재분사] + cat [명사] : \"짜증나게 하는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">구동사(인과관계)\u003c/span> : led to [동사구] + a happier result [결과/목적어] : \"~로 이어졌다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"However, 하지만. his dealings with, ~에 대한 그의 대처는. an annoying cat, 짜증나게 하는 고양이에 대한. led to, ~로 이어졌다. a happier result, 더 행복한 결과로. 이 문장 전체를 해석하면, 하지만, 짜증나게 하는 고양이에 대한 그의 대처는 더 행복한 결과로 이어졌다.","hl":"m"},{"n":28,"text":"앞에서는 개 때문에 슬픈 일이 있었지만 하지만이라는 연결어를 사용해 분위기를 바꿨어요. 고양이와 관련된 이번 일은 결과적으로 훨씬 더 행복한 결말을 맺었다는 흐름을 만들어줍니다.","hl":"mn"},{"n":29,"text":"첫 번째로 dealings는 대처나 관계라는 뜻의 명사로 문장의 핵심 주어 역할을 하고 있어요. 두 번째로 annoying은 고양이가 짜증을 유발하는 존재이므로 능동의 의미를 담아 명사를 수식하는 현재분사로 쓰였죠. 세 번째로 led to는 어떤 결과를 초래하다라는 의미로 쓰여 행복한 결과라는 결말을 보여주고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전해오는 이야기에 따르면,\u003c/span>\u003cspan class=\"en\">According to legend,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고양이 한 마리가 끊임없이 뉴턴을 방해했다고 한다\u003c/span>\u003cspan class=\"en\">a cat constantly \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">interrupted\u003c/span> Newton\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">요구하며\u003c/span>\u003cspan class=\"en\">with its demands\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">집 안으로 들여보내 주고 집 밖으로 내보내 달라고.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">let\u003c/span> in and out of the house.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">전해오는 이야기에 따르면, 고양이 한 마리가 끊임없이 뉴턴에게 집 안으로 들여보내 주고 집 밖으로 내보내 달라고 요구하며 방해했다고 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 전해 내려오는 일화를 통해 뉴턴이 겪었던 \u003cb class=\"key\">구체적인 \u003c/b>\u003cb class=\"key\">고충\u003c/b>을 설명하는 문장입니다. 고양이가 계속해서 연구를 방해하는 상황이 발명의 \u003cb class=\"key\">직접적인 \u003c/b>\u003cb class=\"key\">원인\u003c/b>이 되었음을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거 시제 동사\u003c/span> : [주어] + [동사-ed (과거형)] : \"방해했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 수동태\u003c/span> : to + be + [과거분사(p.p.)] : \"들여보내지는 것\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"According to legend, 전해오는 이야기에 따르면. a cat constantly interrupted Newton, 고양이 한 마리가 끊임없이 뉴턴을 방해했다고 한다. with its demands, 요구하며. to be let in and out of the house, 집 안으로 들여보내 주고 집 밖으로 내보내 달라고.. 이 문장 전체를 해석하면, 전해오는 이야기에 따르면, 고양이 한 마리가 끊임없이 뉴턴에게 집 안으로 들여보내 주고 집 밖으로 내보내 달라고 요구하며 방해했다고 한다.","hl":"m"},{"n":31,"text":"이 문장은 뉴턴이 반려동물용 문을 발명하게 된 구체적인 배경을 설명해요. 고양이가 계속해서 들락날락하고 싶어 하는 요구가 과학자의 연구를 방해했다는 구체적인 고충을 강조하고 있죠.","hl":"mn"},{"n":32,"text":"첫 번째로 interrupted는 과거 시제 동사로 쓰여서 뉴턴의 행동을 방해했다는 과거의 사실을 나타내요. 두 번째로 to be let은 to부정사의 수동태 형태예요. 고양이가 주어의 입장에서 들여보내지는 것이기 때문에 수동의 의미를 담은 수동태 구조를 쓴 것이죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서 그 과학자는 짜증이 났고\u003c/span>\u003cspan class=\"en\">So, the scientist \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">annoyed\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">재빨리 생각해 냈다\u003c/span>\u003cspan class=\"en\">and quickly \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">came \u003c/span>\u003cspan class=\"tgt\">up \u003c/span>\u003cspan class=\"tgt\">with\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">해결책인\u003c/span>\u003cspan class=\"en\">a solution ―\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">반려동물용 문을.\u003c/span>\u003cspan class=\"en\">the pet door.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그래서 그 과학자는 짜증이 났고 재빨리 해결책인 반려동물용 문을 생각해 냈다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 고양이의 방해로 인한 뉴턴의 \u003cb class=\"key\">감정적 \u003c/b>\u003cb class=\"key\">반응\u003c/b>이 창의적인 \u003cb class=\"key\">해결책\u003c/b>으로 이어지는 과정을 보여줍니다. '짜증'이라는 부정적 감정이 발명의 \u003cb class=\"key\">동기\u003c/b>가 되었다는 점이 핵심입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태 (감정 표현)\u003c/span> : be + [감정형용사/과거분사] : \"짜증이 났다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">구동사 (3단어 타동사구)\u003c/span> : come + up + with + [목적어] : \"~을 생각해 냈다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"So, the scientist was annoyed, 그래서 그 과학자는 짜증이 났고. and quickly came up with, 재빨리 생각해 냈다. a solution ―, 해결책인. the pet door, 반려동물용 문을.. 이 문장 전체를 해석하면, 그래서 그 과학자는 짜증이 났고 재빨리 해결책인 반려동물용 문을 생각해 냈다.","hl":"m"},{"n":34,"text":"고양이의 방해 때문에 느꼈던 짜증이라는 감정이 발명의 동기가 되었음을 보여줘요. 반려동물용 문이라는 해결책이 나오게 된 결정적인 전환점을 설명하는 문장입니다.","hl":"mn"},{"n":35,"text":"첫 번째로 was annoyed는 과거 수동태로 뉴턴이 어떤 상황 때문에 짜증을 느끼게 된 상태를 말해요. 두 번째로 came up with은 세 단어가 합쳐진 구동사로 어떤 아이디어나 해결책을 머릿속에 떠올리다라는 뜻의 아주 중요한 표현이죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 고양이는 들어올 수 있었다\u003c/span>\u003cspan class=\"en\">The cat \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">could \u003c/span>\u003cspan class=\"tgt\">come \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 뉴턴의 집을 나갈 수 있었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">go \u003c/span>\u003cspan class=\"tgt\">out\u003c/span> of Newton's house\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그를 방해하지 않고.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">without \u003c/span>\u003cspan class=\"tgt\">disturbing\u003c/span> him.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 고양이는 뉴턴을 방해하지 않고 그의 집을 드나들 수 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 뉴턴이 고안한 발명품의 \u003cb class=\"key\">실제 \u003c/b>\u003cb class=\"key\">효능\u003c/b>을 설명합니다. 고양이의 자유로운 이동과 뉴턴의 연구 집중이라는 두 가지 요구가 \u003cb class=\"key\">동시에 \u003c/b>\u003cb class=\"key\">충족\u003c/b>되었음을 시사합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사원형의 병렬 구조\u003c/span> : could + [V1] + and + [V2] : \"들어오고 나갈 수 있었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 + 동명사\u003c/span> : without + [V-ing] : \"방해하지 않고\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"The cat could come in, 그 고양이는 들어올 수 있었다. and go out of Newton's house, 그리고 뉴턴의 집을 나갈 수 있었다. without disturbing him, 그를 방해하지 않고.. 이 문장 전체를 해석하면, 그 고양이는 뉴턴을 방해하지 않고 그의 집을 드나들 수 있었다.","hl":"m"},{"n":37,"text":"뉴턴이 만든 발명품이 어떻게 문제를 해결했는지 그 효능을 보여주는 문장이에요. 이제는 고양이의 이동과 뉴턴의 연구 집중이 동시에 가능해졌다는 긍정적인 결과를 나타내죠.","hl":"mn"},{"n":38,"text":"첫 번째로 could come in and go out은 조동사 could 뒤에 동사원형 두 개가 나란히 연결된 병렬 구조예요. 두 번째로 without disturbing은 전치사 without 뒤에 동명사가 온 형태로 무엇을 하지 않고라는 부대 상황의 의미를 전달합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오늘날, \u003c/span>\u003cspan class=\"en\">Today,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">능력을 가진 모든 고양이들은 \u003c/span>\u003cspan class=\"en\">every cat \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">ability\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">방을 드나들 수 있는 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">enter \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">leave\u003c/span> a room\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인간 친구들을 괴롭히지 않고 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">without \u003c/span>\u003cspan class=\"tgt\">troubling\u003c/span> their human friends\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">뉴턴에게 감사해야 한다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">Newton \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">thank\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">오늘날, 인간 친구들을 괴롭히지 않고 방을 드나들 수 있는 능력을 가진 모든 고양이들은 뉴턴에게 감사해야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글의 마지막에서 고양이 문 발명이라는 뉴턴의 업적이 오늘날 \u003cb class=\"key\">반려묘\u003c/b>의 삶에 어떤 영향을 주었는지 유머러스하게 마무리하는 문장입니다. 뉴턴의 괴짜 같은 면모가 결국 \u003cb class=\"key\">현대적인 \u003c/b>\u003cb class=\"key\">발명품\u003c/b>으로 이어졌음을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 수식\u003c/span> : every cat [주어] + [with the ability (전치사구)] : \"능력을 가진\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : the ability [명사] + [to enter and leave (to부정사구)] : \"드나들 수 있는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 + 동명사\u003c/span> : without [전치사] + [troubling (동명사)] : \"괴롭히지 않고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">관용 표현 (have A to thank)\u003c/span> : has [동사] + Newton [목적어] + [to thank (to부정사구)] : \"뉴턴에게 감사해야 한다\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"Today, 오늘날. every cat with the ability, 능력을 가진 모든 고양이들은. to enter and leave a room, 방을 드나들 수 있는. without troubling their human friends, 인간 친구들을 괴롭히지 않고. has Newton to thank, 뉴턴에게 감사해야 한다.. 이 문장 전체를 해석하면, 오늘날, 인간 친구들을 괴롭히지 않고 방을 드나들 수 있는 능력을 가진 모든 고양이들은 뉴턴에게 감사해야 한다.","hl":"m"},{"n":40,"text":"이 문장은 뉴턴의 발명품인 펫 도어가 오늘날 고양이들에게 얼마나 편리함을 주는지 설명하고 있어요. 고양이 문 덕분에 고양이와 주인 모두가 서로를 방해하지 않고 편안하게 지낼 수 있게 되었다는 점을 강조하며 글을 유머러스하게 끝맺고 있죠.","hl":"mn"},{"n":41,"text":"첫 번째로 with the ability는 전치사구가 앞에 있는 명사 cat을 꾸며주는 구조예요. 두 번째로 to enter and leave는 명사 ability를 뒤에서 수식하는 형용사적 용법으로 쓰였고요. 세 번째로 without 뒤에 troubling이라는 동명사가 와서 주인에게 폐를 끼치지 않는다는 의미를 나타냅니다. 마지막으로 has Newton to thank는 누구 덕분이다라는 관용적인 표현으로 쓰였으니 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>아이작 뉴턴은 과학적 성과 외에도 동물을 매우 사랑한 \u003cb class=\"key\">반려동물 \u003c/b>\u003cb class=\"key\">애호가\u003c/b>였습니다.\u003c/li>\u003cli>한번은 키우던 강아지가 양초를 넘어뜨려 소중한 \u003cb class=\"key\">연구 \u003c/b>\u003cb class=\"key\">노트\u003c/b>가 타버리는 불운을 겪었습니다.\u003c/li>\u003cli>반면, 자꾸 들락거리며 방해하는 고양이 문제를 해결하기 위해 \u003cb class=\"key\">반려동물용 \u003c/b>\u003cb class=\"key\">문\u003c/b>을 발명했습니다.\u003c/li>\u003cli>이 발명은 뉴턴의 연구 시간을 지켜주었으며, 오늘날 반려동물들의 \u003cb class=\"key\">자유로운 \u003c/b>\u003cb class=\"key\">출입\u003c/b>을 가능케 했습니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Isaac Newton, known for his scientific achievements, was also a pet lover who invented the pet door to balance his research and his cat's needs.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">위대한 과학자 뉴턴은 \u003cb class=\"key\">반려동물 \u003c/b>\u003cb class=\"key\">애호가\u003c/b>였으며, 개 때문에 연구 노트를 잃는 시련을 겪기도 했지만, 결국 고양이의 방해를 해결하기 위해 오늘날의 \u003cb class=\"key\">반려동물용 \u003c/b>\u003cb class=\"key\">문\u003c/b>을 발명했습니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":42,"text":"자, 오늘은 뉴턴의 과학적 업적만큼이나 재미있는 반려동물 문의 탄생 배경을 알아봤습니다. 위대한 발명은 거창한 곳이 아니라 우리의 일상적인 불편함을 해결하려는 마음에서 시작된다는 걸 알 수 있었죠? 오늘 배운 표현들 꼭 복습하시고요, 다음 시간에 더 유익한 지문으로 만나요. 수고하셨습니다!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
