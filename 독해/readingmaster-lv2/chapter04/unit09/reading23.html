<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터2 Reading23 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터2 Reading23","audioDir":"reading23_audio","preview":false,"count":45,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.668em\">Reading\u003cbr>23\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터 레벨2\u003c/div>\u003ch1>Why Resolutions Fail: The Trap of False Hope Syndrome\u003c/h1>\u003ch2>결심이 실패하는 이유: 거짓 희망 증후군의 함정\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>사람들은 자신의 \u003cb class=\"key\">능력을 \u003c/b>\u003cb class=\"key\">과신\u003c/b>하고 비현실적인 기대를 갖는 \u003cb class=\"key\">거짓 \u003c/b>\u003cb class=\"key\">희망 \u003c/b>\u003cb class=\"key\">증후군\u003c/b> 때문에 결국 변화를 포기하게 된다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Unrealistic expectations about one's ability to change lead to the false hope syndrome and the eventual failure of resolutions.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 우리가 매번 야심 차게 세우는 새해 결심이 왜 그렇게 쉽게 무너지는지, 그 심리학적인 이유를 함께 파헤쳐 볼 거예요. 이번 지문의 핵심 요약은 우리가 자신의 변화 능력을 너무 믿는 바람에 거짓 희망 증후군에 빠진다는 것이고, 요지는 비현실적인 기대가 결국 결심의 실패를 부른다는 내용입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">심리학에서는 인간이 자신의 능력을 실제보다 높게 평가하는 경향을 연구합니다. 특히 \u003cb class=\"key\">거짓 \u003c/b>\u003cb class=\"key\">희망 \u003c/b>\u003cb class=\"key\">증후군\u003c/b>(False Hope Syndrome)은 목표를 세울 때 느끼는 일시적인 만족감이 실제 실행의 고통을 잊게 만들 때 발생합니다. 마치 \u003cb class=\"key\">헬스장\u003c/b>에 등록하는 순간 이미 몸짱이 된 것 같은 기분에 취해, 매일 운동하는 고통을 \u003cb class=\"key\">과소평가\u003c/b>하는 것과 비슷하죠. 이러한 \u003cb class=\"key\">낙관주의 \u003c/b>\u003cb class=\"key\">편향\u003c/b>은 장기적인 실천력을 떨어뜨리는 주범이 됩니다.\u003c/div>","segs":[{"n":2,"text":"배경지식으로 심리학 용어인 False Hope Syndrome, 즉 거짓 희망 증후군을 이해해야 해요. 우리 인간은 무언가 새로운 목표를 세울 때 낙관주의 편향에 빠지기 쉽거든요. 마치 헬스장 등록만 하면 내일부터 당장 보디빌더가 될 것 같은 착각에 빠지는 일상적인 비유를 생각하면 쉬워요. 이러한 과도한 통제감이 실제 행동의 어려움을 가리게 되는 현상을 기억하세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>결심 실패의 의문\u003csmall>도입 · 문장 1\u003c/small>\u003c/h4>\u003cp>우리가 세운 \u003cb class=\"key\">결심\u003c/b>을 왜 그렇게 자주 지키지 못하는지에 대한 \u003cb class=\"key\">질문\u003c/b>을 던지며 글을 시작합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>거짓 희망 증후군\u003csmall>개념 제시 · 문장 2–4\u003c/small>\u003c/h4>\u003cp>심리학자들은 우리가 자신의 능력에 대해 \u003cb class=\"key\">비현실적인 \u003c/b>\u003cb class=\"key\">기대\u003c/b>를 갖기 때문에 \u003cb class=\"key\">거짓 \u003c/b>\u003cb class=\"key\">희망 \u003c/b>\u003cb class=\"key\">증후군\u003c/b>이 발생한다고 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>비현실적 양상\u003csmall>예시 · 문장 5–7\u003c/small>\u003c/h4>\u003cp>너무 높은 \u003cb class=\"key\">목표 \u003c/b>\u003cb class=\"key\">설정\u003c/b>, 변화의 \u003cb class=\"key\">난이도 \u003c/b>\u003cb class=\"key\">과소평가\u003c/b>, 그리고 너무 \u003cb class=\"key\">빠른 \u003c/b>\u003cb class=\"key\">결과\u003c/b>를 기대하는 구체적인 예시들을 제시합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>실패와 포기\u003csmall>결론 · 문장 8–11\u003c/small>\u003c/h4>\u003cp>기대와 다른 \u003cb class=\"key\">현실\u003c/b>에 부딪히며 결국 변화하려는 \u003cb class=\"key\">시도\u003c/b>를 포기하게 되는 과정을 보여줍니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 질문으로 시작해서 원인 분석과 구체적인 예시, 그리고 최종적인 결과로 이어지는 아주 논리적인 흐름을 가지고 있어요.","hl":null},{"n":4,"text":"첫 번째 문장에서는 왜 우리는 결심을 자주 지키지 못하는가라는 질문으로 독자의 주의를 끕니다. 이 질문이 이 글 전체의 주제가 되죠.","hl":"f0"},{"n":5,"text":"두 번째부터 네 번째 문장까지는 그 원인으로 False Hope Syndrome을 소개합니다. 우리가 스스로를 너무 과신하고 비현실적인 기대를 한다는 점을 짚어주고 있어요.","hl":"f1"},{"n":6,"text":"다섯 번째부터 일곱 번째 문장은 구체적인 예시를 보여줍니다. 너무 과한 목표를 세우거나, 컴퓨터 게임 끊기를 너무 쉽게 보거나, 일주일에 십 파운드씩 빠질 거라는 말도 안 되는 기대를 하는 모습들이죠.","hl":"f2"},{"n":7,"text":"마지막 여덟 번째부터 열한 번째 문장은 그 슬픈 결과를 보여줍니다. 현실은 예상보다 훨씬 어렵고 결과는 더디게 나타나니, 결국 시도를 포기하게 된다는 결론으로 끝납니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">인과\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 2번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 결심 실패의 원인을 \u003cb class=\"key\">심리학적 \u003c/b>\u003cb class=\"key\">관점\u003c/b>에서 분석하는 구조를 가집니다. 두 번째 문장에서 핵심 원인인 \u003cb class=\"key\">비현실적인 \u003c/b>\u003cb class=\"key\">기대\u003c/b>를 언급하고, 이후 \u003cb class=\"key\">거짓 \u003c/b>\u003cb class=\"key\">희망 \u003c/b>\u003cb class=\"key\">증후군\u003c/b>의 구체적 특징과 그로 인한 \u003cb class=\"key\">부정적 \u003c/b>\u003cb class=\"key\">결과\u003c/b>를 인과 관계에 따라 서술합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>According to them (3)\u003c/b>\u003cspan>앞 문장의 심리학자들을 지칭하며 근거 제시\u003c/span>\u003cb>Finally (7)\u003c/b>\u003cspan>비현실적인 기대의 마지막 사례 나열\u003c/span>\u003cb>Because of these (8)\u003c/b>\u003cspan>앞서 언급한 원인들을 결합하여 결과 도출\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">unrealistic expectations\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">false hope syndrome\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">exaggerated feelings of control\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">overconfidence\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">wrong expectations\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Expectation (False Hope)\u003c/th>\u003cth>Reality\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Exaggerated control\u003c/td>\u003ctd>More difficult than expected\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Rapid results\u003c/td>\u003ctd>Slow visible results\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 원인과 결과가 뚜렷한 인과 구조를 취하고 있어요. 글의 앞부분인 두 번째 문장에서 주제가 드러나는 전형적인 두괄식 구성입니다. 비현실적 기대라는 원인이 포기라는 결과로 이어지는 과정을 아주 잘 보여주고 있죠.","hl":"ty"},{"n":9,"text":"글의 흐름을 잡아주는 신호어들을 잘 보세요. 세 번째 문장의 According to them은 앞의 심리학자들을 가리키며 내용을 연결하고요. 일곱 번째 문장의 Finally는 비현실적 기대의 마지막 예시를 보여줍니다. 여덟 번째 문장의 Because of these wrong expectations는 앞의 내용들을 한 단어로 정리해서 결과로 넘겨주는 핵심적인 역할을 합니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>fail to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~하지 못하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>keep one's resolution\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>결심을 지키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>psychologist\u003c/b>\u003cem>명사\u003c/em>\u003cspan>심리학자\u003c/span>\u003c/div>\u003cdiv>\u003cb>suggest\u003c/b>\u003cem>동사\u003c/em>\u003cspan>시사하다, 제안하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>unrealistic\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>비현실적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>expectation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기대, 예상\u003c/span>\u003c/div>\u003cdiv>\u003cb>ability\u003c/b>\u003cem>명사\u003c/em>\u003cspan>능력\u003c/span>\u003c/div>\u003cdiv>\u003cb>behavior\u003c/b>\u003cem>명사\u003c/em>\u003cspan>행동\u003c/span>\u003c/div>\u003cdiv>\u003cb>in general\u003c/b>\u003cem>부사\u003c/em>\u003cspan>일반적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>produce\u003c/b>\u003cem>동사\u003c/em>\u003cspan>만들어내다, 생산하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>false hope syndrome\u003c/b>\u003cem>명사\u003c/em>\u003cspan>거짓 희망 증후군\u003c/span>\u003c/div>\u003cdiv>\u003cb>involve\u003c/b>\u003cem>동사\u003c/em>\u003cspan>포함하다, 수반하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>exaggerated\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>과장된\u003c/span>\u003c/div>\u003cdiv>\u003cb>control\u003c/b>\u003cem>명사\u003c/em>\u003cspan>통제\u003c/span>\u003c/div>\u003cdiv>\u003cb>overconfidence\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지나친 자신감\u003c/span>\u003c/div>\u003cdiv>\u003cb>successfully\u003c/b>\u003cem>부사\u003c/em>\u003cspan>성공적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>exercise\u003c/b>\u003cem>동사\u003c/em>\u003cspan>운동하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>underestimate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>과소평가하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>dramatic\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>극적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>rapid\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>빠른\u003c/span>\u003c/div>\u003cdiv>\u003cb>probably\u003c/b>\u003cem>부사\u003c/em>\u003cspan>아마도\u003c/span>\u003c/div>\u003cdiv>\u003cb>prove to be\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~인 것으로 판명되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>visible\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>눈에 보이는\u003c/span>\u003c/div>\u003cdiv>\u003cb>turn out to be\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~인 것으로 드러나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>attempt\u003c/b>\u003cem>명사\u003c/em>\u003cspan>시도\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"중요한 단어 몇 가지를 볼게요. resolution은 결심이라는 뜻이고, underestimate는 과소평가하다라는 뜻입니다. 특히 prove to be나 turn out to be 같은 표현은 어떠한 결과로 판명되다라는 뜻으로 뒤에 오는 현실적인 결과들을 강조할 때 쓰였습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">unrealistic\u003c/b>\u003cspan class=\"m\">비현실적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">unpractical\u003c/span>\u003cspan class=\"s\">visionary\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">realistic\u003c/span>\u003cspan class=\"a\">practical\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">exaggerated\u003c/b>\u003cspan class=\"m\">과장된\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">overstated\u003c/span>\u003cspan class=\"s\">excessive\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">understated\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">underestimate\u003c/b>\u003cspan class=\"m\">과소평가하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s 흔히 하는 실수인 과소평가에 대해 이야기해요. 나쁜 습관을 고치는 게 얼마나 힘들지 전혀 예상하지 못한다는 뜻이죠.","hl":"mn"},{"n":29,"text":"중요한 어법이 세 가지나 있네요. 첫 번째는 how difficult it will be입니다. 얼마나 어려운지라는 뜻의 의문사절이 목적어 자리에 오면서 의문사 형용사 주어 동사 순서로 쓰였습니다. 두 번째는 그 안에 있는 it과 to change입니다. 가짜 주어 it을 쓰고 진짜 주어인 to부정사를 뒤로 보낸 가주어 진주어 구조예요. 세 번째는 stop 뒤에 오는 stopping입니다. 하던 일을 그만두다라는 의미일 때는 반드시 동명사를 써야 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마지막으로, \u003c/span>\u003cspan class=\"en\">Finally,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 기대하는 경향이 있다 \u003c/span>\u003cspan class=\"en\">we \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">tend \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">expect\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">극적이고 빠른 결과를 \u003c/span>\u003cspan class=\"en\">dramatic, rapid results\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">(예를 들어, “나는 아마 뺄 것이다 \u003c/span>\u003cspan class=\"en\">(e.g., &quot;I'll probably lose\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일주일에 10파운드 정도를!”).\u003c/span>\u003cspan class=\"en\">about 10 pounds a week!&quot;).\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">마지막으로, 우리는 극적이고 빠른 결과를 기대하는 경향이 있다(예를 들어, “나는 아마 일주일에 10파운드 정도를 뺄 것이다!”).\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 결심 실패의 세 번째 원인인 \u003cb class=\"key\">즉각적인 \u003c/b>\u003cb class=\"key\">보상\u003c/b>에 대한 욕구를 설명합니다. 현실보다 훨씬 \u003cb class=\"key\">빠른 \u003c/b>\u003cb class=\"key\">성과\u003c/b>를 바라는 우리의 비현실적인 심리를 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">tend to + 동사원형\u003c/span> : tend [자동사] + to expect [to부정사구/수식어] : \"기대하는 경향이 있다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Finally, 마지막으로. we tend to expect, 우리는 기대하는 경향이 있다. dramatic, rapid results, 극적이고 빠른 결과를. (e.g., \"I'll probably lose, (예를 들어, “나는 아마 뺄 것이다. about 10 pounds a week!\"), 일주일에 10파운드 정도를!”).. 이 문장 전체를 해석하면, 마지막으로, 우리는 극적이고 빠른 결과를 기대하는 경향이 있다(예를 들어, “나는 아마 일주일에 10파운드 정도를 뺄 것이다!”).","hl":"m"},{"n":31,"text":"이 문장은 우리가 결심을 유지하지 못하는 마지막 이유를 말해줍니다. 바로 노력을 시작하자마자 결과가 극적이고 빠르게 나타나기를 바라는 마음이죠.","hl":"mn"},{"n":32,"text":"중요한 어법을 보면 tend to expect가 쓰였어요. tend to는 뒤에 동사원형을 써서 무엇무엇 하는 경향이 있다는 뜻으로 주어의 성향을 나타낼 때 자주 사용됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">때문에, \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Because \u003c/span>\u003cspan class=\"tgt\">of\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 잘못된 기대 \u003c/span>\u003cspan class=\"en\">these wrong expectations,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 대개 실패한다.\u003c/span>\u003cspan class=\"en\">we usually fail.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이러한 잘못된 기대 때문에, 우리는 대개 실패한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 언급된 모든 비현실적인 생각들이 결국 \u003cb class=\"key\">실패\u003c/b>라는 결론으로 이어진다는 \u003cb class=\"key\">인과 \u003c/b>\u003cb class=\"key\">관계\u003c/b>를 나타냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사(구) because of\u003c/span> : Because of [전치사구] + these wrong expectations [명사구] : \"~ 때문에\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"Because of, 때문에. these wrong expectations, 이러한 잘못된 기대. we usually fail, 우리는 대개 실패한다.. 이 문장 전체를 해석하면, 이러한 잘못된 기대 때문에, 우리는 대개 실패한다.","hl":"m"},{"n":34,"text":"앞에서 말한 비현실적인 목표와 빠른 결과에 대한 잘못된 기대가 결국 우리를 실패로 이끈다는 핵심 결론이에요.","hl":"mn"},{"n":35,"text":"첫 번째로 because of를 주의해야 해요. 이 표현은 전치사구이기 때문에 뒤에 절이 아니라 these wrong expectations라는 명사구가 와야 한다는 점이 포인트입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새로운 행동은 \u003c/span>\u003cspan class=\"en\">The new behavior\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">것으로 판명된다 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">proves \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 어려운 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">difficult \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 예상했던 것보다 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">expected\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">새로운 행동은 우리가 예상했던 것보다 더 어려운 것으로 판명된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 기대와 현실 사이의 \u003cb class=\"key\">괴리\u003c/b>를 설명합니다. 결심을 실천하는 것은 생각보다 훨씬 큰 \u003cb class=\"key\">의지력\u003c/b>이 필요함을 시사합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">2형식 동사 prove\u003c/span> : proves [동사] + to be more difficult [보어/형용사구] : \"~인 것으로 판명되다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">비교급 구문\u003c/span> : more difficult [비교급] + than [접속사] + we expected [절] : \"우리가 예상했던 것보다 더 어려운\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"The new behavior, 새로운 행동은. proves to be, 것으로 판명된다. more difficult, 더 어려운. than we expected, 우리가 예상했던 것보다. 이 문장 전체를 해석하면, 새로운 행동은 우리가 예상했던 것보다 더 어려운 것으로 판명된다.","hl":"m"},{"n":37,"text":"막상 행동을 시작해보면 우리가 생각했던 것보다 훨씬 힘들다는 것을 깨닫게 된다는 뜻이에요. 기대와 현실의 차이를 강조하고 있죠.","hl":"mn"},{"n":38,"text":"첫 번째로 proves to be를 볼게요. 어떤 상태임이 드러난다는 뜻으로 보어를 취하는 구조예요. 두 번째로 more difficult than은 비교급 표현으로 우리가 예상했던 것보다 더 어렵다는 비교의 의미를 담고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">눈에 보이는 결과는\u003c/span>\u003cspan class=\"en\">Visible results\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">느린 것으로 판명된다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">turn \u003c/span>\u003cspan class=\"tgt\">out \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be\u003c/span> slow.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">눈에 보이는 결과는 느린 것으로 판명된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 비현실적인 기대치와 달리 실제 성과가 나타나는 속도가 \u003cb class=\"key\">기대보다 \u003c/b>\u003cb class=\"key\">느리다\u003c/b>는 점을 지적하며, 이것이 결심을 포기하게 만드는 \u003cb class=\"key\">좌절의 \u003c/b>\u003cb class=\"key\">원인\u003c/b>임을 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">turn out (to be) 구문\u003c/span> : turn out + [to be (생략가능)] + [보어(형용사/명사)] : \"~인 것으로 판명되다\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"Visible results, 눈에 보이는 결과는. turn out to be slow, 느린 것으로 판명된다.. 이 문장 전체를 해석하면, 눈에 보이는 결과는 느린 것으로 판명된다.","hl":"m"},{"n":40,"text":"우리는 보통 빠른 결과를 기대하지만, 실제로는 가시적인 성과가 나타나기까지 시간이 걸려요. 기대와 현실의 차이가 크다는 점을 보여주며 좌절의 원인을 짚어주는 문장입니다.","hl":"mn"},{"n":41,"text":"첫 번째로 눈여겨볼 표현은 turn out to be입니다. 주어가 결국 어떤 상태라고 밝혀질 때 쓰는 표현인데, 여기서는 기대보다 결과가 느리게 나타난다는 사실을 강조하기 위해 쓰였습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러고 나서 우리는 종종\u003c/span>\u003cspan class=\"en\">Then we often\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">포기한다\u003c/span>\u003cspan class=\"en\">give up\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 시도를\u003c/span>\u003cspan class=\"en\">our \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">attempts \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">변화하려는.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">change\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러고 나서 우리는 종종 변화하려는 시도를 포기한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 결과가 더디게 나타나는 것에 실망하여 결국 자신의 결심을 꺾게 되는 \u003cb class=\"key\">거짓 \u003c/b>\u003cb class=\"key\">희망 \u003c/b>\u003cb class=\"key\">증후군\u003c/b>의 \u003cb class=\"key\">최종 \u003c/b>\u003cb class=\"key\">단계\u003c/b>를 묘사합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : attempts [명사] + [to change (to부정사구)] : \"변화하려는 시도\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"Then we often, 그러고 나서 우리는 종종. give up, 포기한다. our attempts, 우리의 시도를. to change, 변화하려는.. 이 문장 전체를 해석하면, 그러고 나서 우리는 종종 변화하려는 시도를 포기한다.","hl":"m"},{"n":43,"text":"결과가 빨리 나오지 않으니 실망하게 되고, 결국 처음에 가졌던 변화의 의지마저 꺾여버린다는 결말을 보여주네요. 실패의 순환이 마무리되는 과정입니다.","hl":"mn"},{"n":44,"text":"문장 끝부분에 있는 to change라는 표현을 보세요. 이 부분은 앞에 있는 명사 attempts를 뒤에서 수식하는 형용사적 용법의 to부정사예요. 단순히 시도가 아니라 변화를 위한 시도라는 점을 명확히 해줍니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>사람들은 자신의 \u003cb class=\"key\">행동 \u003c/b>\u003cb class=\"key\">변화 \u003c/b>\u003cb class=\"key\">능력\u003c/b>을 실제보다 높게 평가하는 \u003cb class=\"key\">비현실적인 \u003c/b>\u003cb class=\"key\">기대\u003c/b>를 갖는다.\u003c/li>\u003cli>이러한 과신은 \u003cb class=\"key\">거짓 \u003c/b>\u003cb class=\"key\">희망 \u003c/b>\u003cb class=\"key\">증후군\u003c/b>으로 이어져, 과장된 \u003cb class=\"key\">통제감\u003c/b>과 자신감을 유발한다.\u003c/li>\u003cli>비현실적인 목표, 난이도에 대한 \u003cb class=\"key\">과소평가\u003c/b>, 성급한 결과에 대한 \u003cb class=\"key\">기대\u003c/b>가 결합된다.\u003c/li>\u003cli>결국 \u003cb class=\"key\">현실의 \u003c/b>\u003cb class=\"key\">어려움\u003c/b>과 느린 변화 속도에 부딪혀 변화하려는 시도를 \u003cb class=\"key\">포기\u003c/b>하게 된다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Unrealistic expectations about one's ability to change lead to the false hope syndrome and the eventual failure of resolutions.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">사람들은 자신의 \u003cb class=\"key\">능력을 \u003c/b>\u003cb class=\"key\">과신\u003c/b>하고 비현실적인 기대를 갖는 \u003cb class=\"key\">거짓 \u003c/b>\u003cb class=\"key\">희망 \u003c/b>\u003cb class=\"key\">증후군\u003c/b> 때문에 결국 변화를 포기하게 된다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":45,"text":"자, 오늘 지문을 통해 우리가 왜 결심에 실패하는지 심리학적으로 이해해 봤습니다. 단순히 의지력이 부족해서가 아니라, 비현실적인 기대 자체가 문제였다는 점이 흥미롭죠? 이 지문의 구조와 인과 관계를 복습하면서 오늘 배운 핵심 어휘들도 꼭 여러분의 것으로 만드세요. 수고하셨습니다!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
