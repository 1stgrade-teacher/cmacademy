<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터2 Reading38 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터2 Reading38","audioDir":"reading38_audio","preview":false,"count":46,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.668em\">Reading\u003cbr>38\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터 레벨2\u003c/div>\u003ch1>Rewire Your Brain: The Power of Repetition\u003c/h1>\u003ch2>뇌를 재연결하라: 반복의 힘\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>어른들은 새로운 시도에서 쉽게 포기하는 경향이 있으나, \u003cb class=\"key\">반복\u003c/b>은 \u003cb class=\"key\">뇌의 \u003c/b>\u003cb class=\"key\">뉴런 \u003c/b>\u003cb class=\"key\">연결\u003c/b>을 강화하여 새로운 기술이 습관이 되게 만드는 핵심 과정이다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Repetition is essential for strengthening neural connections and mastering new skills through the process of rewiring the brain.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 우리가 새로운 기술을 배울 때 왜 금방 포기하게 되는지, 그리고 어떻게 하면 그것을 극복할 수 있는지 뇌과학적 관점에서 함께 알아보겠습니다. 이 글은 반복이 우리 뇌의 신경 회로를 어떻게 변화시키는지를 다루고 있어요. 요약하자면, 반복은 뇌의 뉴런 연결을 강화해서 새로운 능력을 습관으로 만들어 준다는 것이 이 글의 핵심 요지입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">이 글은 \u003cb class=\"key\">신경가소성\u003c/b>(Neuroplasticity)이라는 뇌과학적 원리를 바탕으로 합니다. 우리의 뇌는 고정된 것이 아니라 경험과 학습에 따라 구조가 변하는 \u003cb class=\"key\">유연한 \u003c/b>\u003cb class=\"key\">조직\u003c/b>입니다. 새로운 기술을 배울 때 뇌 속 뉴런들은 서로 신호를 주고받으며 새로운 통로를 만드는데, 이를 일상적으로는 \u003cb class=\"key\">오솔길\u003c/b>을 내는 과정에 비유할 수 있습니다. 처음에는 길이 없어 걷기 힘들지만, 자꾸 다니면 풀이 눕고 길이 다져지는 것처럼 \u003cb class=\"key\">반복 \u003c/b>\u003cb class=\"key\">학습\u003c/b>을 통해 뇌 회로가 탄탄해집니다. 과학자들은 이를 \u003cb class=\"key\">헵의 \u003c/b>\u003cb class=\"key\">법칙\u003c/b>(Hebb's Rule)이라 부르며, '함께 활성화되는 뉴런은 함께 연결된다'는 원리로 설명합니다.\u003c/div>","segs":[{"n":2,"text":"본격적으로 들어가기 전에 신경가소성이라는 개념을 이해해 볼까요? 우리 뇌는 고정된 벽돌 같은 게 아니라, 경험에 따라 계속 변하는 유연한 조직이에요. 새로운 것을 배울 때 우리 뇌 속에서는 뉴런들이 서로 신호를 보내며 길을 만드는데, 이걸 오솔길을 만드는 과정이라고 생각하면 쉬워요. 처음에는 풀이 무성해서 가기 힘들지만 자꾸 걸어 다니면 반듯한 길이 생기죠. 오늘 지문에서 말하는 반복 학습이 바로 뇌 속에 그 길을 내는 과정입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>어린 시절의 경험\u003csmall>예시/도입 · 문장 1\u003c/small>\u003c/h4>\u003cp>자전거 타기를 배울 때처럼 넘어지더라도 \u003cb class=\"key\">반복해서 \u003c/b>\u003cb class=\"key\">시도\u003c/b>했던 어린 시절의 경험을 상기시킵니다. 그것이 \u003cb class=\"key\">습관\u003c/b>이 될 때까지 멈추지 않았던 끈기를 보여줍니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>성인의 성급한 판단\u003csmall>통념/문제제기 · 문장 2–3\u003c/small>\u003c/h4>\u003cp>성인이 되어서는 새로운 일을 단 한 번만 시도해 보고 \u003cb class=\"key\">성공 \u003c/b>\u003cb class=\"key\">여부\u003c/b>를 성급하게 판단하는 경향이 있습니다. 조금만 \u003cb class=\"key\">어색함\u003c/b>을 느껴도 다시 시도하기보다 실패로 단정 짓고 포기합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>반복의 핵심 가치\u003csmall>주장 · 문장 4\u003c/small>\u003c/h4>\u003cp>이러한 조기 포기는 애석한 일인데, \u003cb class=\"key\">반복\u003c/b>이야말로 우리 뇌의 회로를 \u003cb class=\"key\">재연결\u003c/b>하는 과정에서 가장 핵심적인 요소이기 때문입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>뉴런 연결의 원리\u003csmall>근거/설명 · 문장 5–10\u003c/small>\u003c/h4>\u003cp>뇌 속 \u003cb class=\"key\">뉴런 \u003c/b>\u003cb class=\"key\">연결망\u003c/b>은 반복적인 행동을 통해 강화됩니다. 처음에는 연결이 불안정하여 \u003cb class=\"key\">마구잡이\u003c/b>식 결과가 나오지만, 반복될수록 뉴런 사이의 결합이 단단해진다는 \u003cb class=\"key\">과학적 \u003c/b>\u003cb class=\"key\">원리\u003c/b>를 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>지속적 시도의 이점\u003csmall>결론 · 문장 11\u003c/small>\u003c/h4>\u003cp>결국 새로운 기술을 더 \u003cb class=\"key\">자주 \u003c/b>\u003cb class=\"key\">시도\u003c/b>할수록, 뇌의 연결이 강화되어 필요할 때 그 기술을 더 \u003cb class=\"key\">쉽게 \u003c/b>\u003cb class=\"key\">사용\u003c/b>할 수 있게 됩니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 어린 시절과 성인의 대조적인 모습에서 시작해 과학적인 근거로 나아가는 흐름을 가지고 있어요.","hl":null},{"n":4,"text":"첫 번째 문장에서는 자전거를 배우던 어린 시절을 떠올리게 해요. 넘어지고 다시 타기를 반복하며 결국 자전거 타기가 습관이 될 때까지 노력했던 그 시절의 끈기를 보여주죠.","hl":"f0"},{"n":5,"text":"하지만 두 번째와 세 번째 문장에서는 성인이 된 우리의 모습을 꼬집습니다. 새로운 걸 시도할 때 단 한 번의 시도만으로 성패를 판단해 버리거나, 조금만 어색해도 다시 도전하기보다는 실패라고 단정 지어 버리는 점을 지적해요.","hl":"f1"},{"n":6,"text":"네 번째 문장은 이 글의 가장 중요한 주장입니다. 반복이 우리 뇌를 다시 연결하는 과정에서 핵심적이라고 말하며, 성급한 포기가 안타까운 일임을 강조하고 있어요.","hl":"f2"},{"n":7,"text":"다섯 번째부터 열 번째 문장까지는 그 과학적 근거를 설명합니다. 처음에는 뉴런 연결이 불안정해서 시도가 마구잡이처럼 느껴질 수 있지만, 행동을 반복하면 연관된 뉴런들 사이의 결합이 점점 더 튼튼해진다는 논리죠.","hl":"f3"},{"n":8,"text":"마지막 열한 번째 문장에서는 결론을 내립니다. 새로운 기술을 더 많이 시도해 볼수록 우리 뇌의 연결이 강화되어, 결국 필요할 때 그 기술이 훨씬 더 쉽게 우리에게 다가올 것이라고 응원하고 있습니다.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">비교·대조 및 인과\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 4번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">아이들과 성인의 \u003cb class=\"key\">태도 \u003c/b>\u003cb class=\"key\">차이\u003c/b>를 대조하며 글을 시작합니다. 4번 문장에서 반복이 \u003cb class=\"key\">뇌 \u003c/b>\u003cb class=\"key\">재연결\u003c/b>의 핵심이라는 주제를 던진 후, 이후 문장들에서 뉴런의 결합 원리를 통해 그 \u003cb class=\"key\">인과 \u003c/b>\u003cb class=\"key\">관계\u003c/b>를 과학적으로 뒷받침합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>But (2)\u003c/b>\u003cspan>아이들의 끈기와 성인의 성급함을 대조하는 역접\u003c/span>\u003cb>rather than (3)\u003c/b>\u003cspan>재시도 대신 포기를 선택하는 대조적 상황 강조\u003c/span>\u003cb>because (4)\u003c/b>\u003cspan>반복이 중요한 이유에 대한 근거 제시\u003c/span>\u003cb>In other words (10)\u003c/b>\u003cspan>뉴런 연결 강화 원리를 알기 쉽게 요약 재진술\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">ride a bike\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">something new\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">brain-friendly feedback technique\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">action\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Children (Kids)\u003c/th>\u003cth>Adults\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Keep trying until second nature\u003c/td>\u003ctd>One attempt and judge\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Persistence (Falling off and getting back on)\u003c/td>\u003ctd>Avoidance (Giving it up if awkward)\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글은 먼저 아이들과 성인의 행동 방식을 비교하는 대조 구조로 시작합니다. 그러고 나서 네 번째 문장에서 주제를 던지는 중괄식 구조를 취하고 있어요. 후반부에서는 뇌의 변화라는 원인과 실력 향상이라는 결과가 이어지는 인과 관계를 보여줍니다.","hl":"ty"},{"n":10,"text":"글의 흐름을 바꾸는 신호어들을 잘 보세요. 두 번째 문장의 But은 성급한 성인의 태도를 부각하고, 네 번째 문장의 because는 반복이 왜 중요한지 이유를 설명하기 시작합니다. 열 번째 문장의 In other words는 복잡한 뉴런의 원리를 한 마디로 깔끔하게 정리해 주는 아주 중요한 연결어예요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>second nature\u003c/b>\u003cem>명사\u003c/em>\u003cspan>습관, 제2의 천성\u003c/span>\u003c/div>\u003cdiv>\u003cb>attempt\u003c/b>\u003cem>명사\u003c/em>\u003cspan>시도\u003c/span>\u003c/div>\u003cdiv>\u003cb>judge\u003c/b>\u003cem>동사\u003c/em>\u003cspan>판단하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>succeed\u003c/b>\u003cem>동사\u003c/em>\u003cspan>성공하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>awkward\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>어색한\u003c/span>\u003c/div>\u003cdiv>\u003cb>shot\u003c/b>\u003cem>명사\u003c/em>\u003cspan>시도, 기회\u003c/span>\u003c/div>\u003cdiv>\u003cb>shame\u003c/b>\u003cem>명사\u003c/em>\u003cspan>안타까운 일, 수치심\u003c/span>\u003c/div>\u003cdiv>\u003cb>repetition\u003c/b>\u003cem>명사\u003c/em>\u003cspan>반복\u003c/span>\u003c/div>\u003cdiv>\u003cb>central\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>중심적인, 핵심적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>rewire\u003c/b>\u003cem>동사\u003c/em>\u003cspan>재연결하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>neuron\u003c/b>\u003cem>명사\u003c/em>\u003cspan>뉴런, 신경 세포\u003c/span>\u003c/div>\u003cdiv>\u003cb>brain-friendly\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>뇌 친화적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>feedback\u003c/b>\u003cem>명사\u003c/em>\u003cspan>피드백, 반응\u003c/span>\u003c/div>\u003cdiv>\u003cb>technique\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기술\u003c/span>\u003c/div>\u003cdiv>\u003cb>reliable\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>신뢰할 수 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>effort\u003c/b>\u003cem>명사\u003c/em>\u003cspan>노력\u003c/span>\u003c/div>\u003cdiv>\u003cb>hit-or-miss\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>마구잡이의, 복불복의\u003c/span>\u003c/div>\u003cdiv>\u003cb>involved\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>연관된\u003c/span>\u003c/div>\u003cdiv>\u003cb>fire\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(신경이) 활성화되다, 발화하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>wire\u003c/b>\u003cem>동사\u003c/em>\u003cspan>연결되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>strengthen\u003c/b>\u003cem>동사\u003c/em>\u003cspan>강화하다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"여기서 repetition이라는 단어는 이 글의 주인공과도 같아요. 그리고 second nature는 두 번째 본성, 즉 아주 익숙해진 습관을 뜻하는 아주 멋진 표현이죠. hit-or-miss라는 표현은 결과가 들쭉날쭉하다는 뜻인데, 초보 단계의 불안정한 모습을 잘 보여줍니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">repetition\u003c/b>\u003cspan class=\"m\">반복\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">reiteration\u003c/span>\u003cspan class=\"s\">recurrence\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">central\u003c/b>\u003cspan class=\"m\">핵심적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">essential\u003c/span>\u003cspan class=\"s\">pivotal\u003c/span>\u003cspan class=\"s\">core\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">peripheral\u003c/span>\u003cspan class=\"a\">marginal\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">reliable\u003c/b>\u003cspan class=\"m\">신뢰할 수 있는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">dependable\u003c/span>\u003cspan class=\"s\">trustworthy\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unreliable\u003c/span>\u003cspan class=\"a\">questionable\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">strengthen\u003c/b>\u003cspan class=\"m\">강화하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">reinforce\u003c/span>\u003cspan class=\"s\">fortify\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">weaken\u003c/span>\u003cspan class=\"a\">undermine\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">awkward\u003c/b>\u003cspan class=\"m\">어색한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">clumsy\u003c/span>\u003cspan class=\"s\">uncomfortable\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">natural\u003c/span>\u003cspan class=\"a\">graceful\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"핵심 어휘를 정리해 볼까요? 중심적이라는 뜻의 central은 essential이나 core로 바꿔 쓸 수 있고, 반대말은 주변적이라는 뜻의 peripheral입니다. 강화하다는 뜻의 strengthen은 reinforce와 같은 뜻이며, 약화시키다인 weaken과 반대되는 개념으로 시험에 자주 나옵니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아이였을 때, \u003c/span>\u003cspan class=\"en\">As kids,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 배우는 것에 열심히 노력했다 \u003c/span>\u003cspan class=\"en\">we worked hard at learning\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자전거 타는 법을; \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">ride\u003c/span> a bike;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">넘어지면, \u003c/span>\u003cspan class=\"en\">when we fell off,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 다시 올라탔는데, \u003c/span>\u003cspan class=\"en\">we got back on again,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 될 때까지 그렇게 했다 \u003c/span>\u003cspan class=\"en\">until it became\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리에게 습관이.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">second \u003c/span>\u003cspan class=\"tgt\">nature\u003c/span> to us.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">아이였을 때, 우리는 자전거 타는 법을 열심히 배웠다. 넘어지면 우리는 다시 올라탔는데, 그것이 우리에게 습관이 될 때까지 그렇게 했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 어린 시절 자전거를 배울 때의 \u003cb class=\"key\">반복과 \u003c/b>\u003cb class=\"key\">끈기\u003c/b>를 사례로 들어 글을 시작합니다. 실패해도 다시 도전하여 \u003cb class=\"key\">완전한 \u003c/b>\u003cb class=\"key\">습관\u003c/b>으로 만들었던 과거의 태도를 상기시킵니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문사 + to부정사\u003c/span> : how [의문사] + to ride [to부정사] : \"타는 방법\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관용 표현(보어)\u003c/span> : become [동사] + second nature [명사/보어] : \"습관(제2의 천성)\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"As kids, 아이였을 때. we worked hard at learning, 우리는 배우는 것에 열심히 노력했다. how to ride a bike, 자전거 타는 법을;. when we fell off, 넘어지면. we got back on again, 우리는 다시 올라탔는데. until it became, 그것이 될 때까지 그렇게 했다. second nature to us, 우리에게 습관이.. 이 문장 전체를 해석하면, 아이였을 때, 우리는 자전거 타는 법을 열심히 배웠다. 넘어지면 우리는 다시 올라탔는데, 그것이 우리에게 습관이 될 때까지 그렇게 했다.","hl":"m"},{"n":14,"text":"여러분, 어릴 때 자전거 배운 거 기억나죠? 이 문장은 우리가 어렸을 때 가졌던 반복과 끈기를 보여주면서, 실패해도 다시 도전해서 완전한 습관으로 만들었던 경험을 상기시켜 줍니다.","hl":"mn"},{"n":15,"text":"문법을 두 가지 볼게요. 첫 번째로 how to ride는 의문사 how와 투부정사가 만나서 배우는 대상인 목적어 역할을 하고 있어요. 두 번째로 second nature는 제2의 천성, 즉 아주 익숙한 자연스러운 습관을 의미하는 보어로 쓰였습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 우리가 시도해 볼 때 \u003c/span>\u003cspan class=\"en\">But when we try\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새로운 것을 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">something \u003c/span>\u003cspan class=\"tgt\">new\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어른으로 살면서 \u003c/span>\u003cspan class=\"en\">in our adult lives\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 대개 단 한 번만 시도해 보고 나서 \u003c/span>\u003cspan class=\"en\">we will usually make just one attempt\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">판단하려 한다 \u003c/span>\u003cspan class=\"en\">before judging\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 잘되었는지.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">whether \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">worked\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 어른으로 살면서 새로운 것을 시도해 볼 때 우리는 대개 단 한 번만 시도해 보고 나서 그것이 잘되었는지 판단하려 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 끈기 있게 도전하던 어린 시절과 대조되는 \u003cb class=\"key\">어른의 \u003c/b>\u003cb class=\"key\">태도\u003c/b>를 지적합니다. 충분한 반복 없이 \u003cb class=\"key\">단 \u003c/b>\u003cb class=\"key\">한 \u003c/b>\u003cb class=\"key\">번\u003c/b>의 시도로 성패를 결정짓는 성급함을 비판합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">형용사의 후치 수식\u003c/span> : something [-thing으로 끝나는 대명사] + new [형용사] : \"새로운 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명사절 접속사 whether\u003c/span> : judging [동명사] + whether [접속사] + it worked [주어+동사] : \"그것이 효과가 있었는지 (아닌지)\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"But when we try, 그러나 우리가 시도해 볼 때. something new, 새로운 것을. in our adult lives, 어른으로 살면서. we will usually make just one attempt, 우리는 대개 단 한 번만 시도해 보고 나서. before judging, 판단하려 한다. whether it worked, 그것이 잘되었는지.. 이 문장 전체를 해석하면, 그러나 어른으로 살면서 새로운 것을 시도해 볼 때 우리는 대개 단 한 번만 시도해 보고 나서 그것이 잘되었는지 판단하려 한다.","hl":"m"},{"n":17,"text":"자, 하지만 어른이 되면 달라지죠. 이 문장은 어린 시절의 끈기와 대조되는 어른의 태도를 꼬집고 있어요. 충분히 반복하지도 않고 단 한 번의 시도로 성패를 성급하게 결정짓는다는 거예요.","hl":"mn"},{"n":18,"text":"두 가지 포인트를 짚어볼게요. 첫 번째로 something new는 something처럼 씽으로 끝나는 단어를 형용사가 뒤에서 꾸며주는 후치 수식 구조고요. 두 번째로 whether it worked는 판단하는 내용인 목적어 자리에 와서 그것이 잘 되었는지 아닌지라는 뜻을 전달합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만일 우리가 성공하지 못하거나 \u003c/span>\u003cspan class=\"en\">If we don't succeed\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">처음에, \u003c/span>\u003cspan class=\"en\">the first time,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">혹은 약간 어색한 느낌이 들면, \u003c/span>\u003cspan class=\"en\">or if it feels a little awkward,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">스스로에게 말할 것이다 \u003c/span>\u003cspan class=\"en\">we'll \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">tell \u003c/span>\u003cspan class=\"tgt\">ourselves \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 성공이 아니었다고 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> it wasn't a success\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또 다른 시도를 해보기보다는.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">rather \u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">giving\u003c/span> it another shot.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">만일 우리가 처음에 성공하지 못하거나 혹은 약간 어색한 느낌이 들면, 또 다른 시도를 해보기보다는 스스로에게 그것이 성공이 아니었다고 말할 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 어른들이 새로운 시도를 쉽게 포기하는 \u003cb class=\"key\">구체적 \u003c/b>\u003cb class=\"key\">이유\u003c/b>와 상황을 설명합니다. 즉각적인 성공이나 익숙함이 없으면 \u003cb class=\"key\">재시도\u003c/b>를 하지 않으려는 경향을 나타냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">4형식 구조와 명사절 접속사 that\u003c/span> : tell [동사] + ourselves [간접목적어] + that... [직접목적어/절] : \"우리 자신에게 ~라고 말하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">rather than + 동명사\u003c/span> : rather than [~하기보다] + giving [동명사] : \"주는 것(시도하는 것)보다\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"If we don't succeed, 만일 우리가 성공하지 못하거나. the first time, 처음에. or if it feels a little awkward, 혹은 약간 어색한 느낌이 들면. we'll tell ourselves, 스스로에게 말할 것이다. that it wasn't a success, 그것이 성공이 아니었다고. rather than giving it another shot, 또 다른 시도를 해보기보다는.. 이 문장 전체를 해석하면, 만일 우리가 처음에 성공하지 못하거나 혹은 약간 어색한 느낌이 들면, 또 다른 시도를 해보기보다는 스스로에게 그것이 성공이 아니었다고 말할 것이다.","hl":"m"},{"n":20,"text":"이 문장은 어른들이 왜 그렇게 빨리 포기하는지 구체적인 이유를 보여줘요. 처음 했을 때 바로 안 되거나 조금만 어색해도, 다시 시도하기보다 이건 실패야라고 스스로 단정 지어버린다는 내용입니다.","hl":"mn"},{"n":21,"text":"중요한 문장 구조가 보여요. 첫 번째로 tell ourselves that은 우리 자신에게 대절 이하의 내용을 말해준다는 사형식 문장이고요, 이때 대트는 명사절을 이끕니다. 두 번째로 rather than 뒤에 동명사 giving을 써서 다시 시도하는 것보다라는 비교의 의미를 완성하고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 애석한 일인데,\u003c/span>\u ", 함께 연결된다고요. 이 문장 전체를 해석하면, 그러나 과학자들은 “함께 활성화되는 뉴런들은 함께 연결된다.”라고 말한다.","hl":"m"},{"n":38,"text":"자주 반복해서 뉴런들이 동시에 자극을 받으면 그들 사이에 강력한 연결이 생긴다는 뜻이에요. 필자가 말하고자 하는 반복의 중요성을 과학적 근거로 뒷받침하는 아주 중요한 문장이죠.","hl":"mn"},{"n":39,"text":"첫 번째로 neurons 뒤에 오는 that은 관계사절 안에서 주어 역할을 하는 주격 관계대명사예요. 뒤에 나오는 동사 fire와 wire는 뇌 과학에서 정말 자주 쓰이는 운율 섞인 표현이니까 세트로 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다시 말해서,\u003c/span>\u003cspan class=\"en\">In other words,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 행동의 반복은\u003c/span>\u003cspan class=\"en\">repetition of an action\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">연결을 강화한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">strengthens\u003c/span> the connections\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 행동에 연관된 뉴런들 사이의\u003c/span>\u003cspan class=\"en\">between the neurons \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">involved\u003c/span> in that action.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">다시 말해서, 어떤 행동의 반복은 그 행동에 연관된 뉴런들 사이의 연결을 강화한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 언급된 과학적 격언을 쉽게 설명하며, \u003cb class=\"key\">반복\u003c/b>이 뉴런 사이의 \u003cb class=\"key\">연결 \u003c/b>\u003cb class=\"key\">강화\u003c/b>를 가져온다는 핵심 원리를 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주어-동사 수 일치\u003c/span> : repetition [단수 주어] + strengthens [단수 동사] : \"강화한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사의 후치 수식\u003c/span> : neurons [명사] + involved [과거분사구] : \"연관된\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"In other words, 다시 말해서. repetition of an action, 어떤 행동의 반복은. strengthens the connections, 연결을 강화한다. between the neurons involved in that action, 그 행동에 연관된 뉴런들 사이의. 이 문장 전체를 해석하면, 다시 말해서, 어떤 행동의 반복은 그 행동에 연관된 뉴런들 사이의 연결을 강화한다.","hl":"m"},{"n":41,"text":"과학자들의 격언을 한 번 더 풀어서 친절하게 설명하는 부분이에요. 우리가 어떤 행동을 자꾸 반복하면 우리 뇌 속의 신경세포들이 더 끈끈하게 연결 강화가 된다는 원리를 담고 있습니다.","hl":"mn"},{"n":42,"text":"중요한 문법 포인트를 짚어볼게요. 첫 번째로 주어인 repetition이 삼인칭 단수라서 동사 strengthens에 에스가 붙어 있는 수 일치에 꼭 주의해야 해요. 두 번째로 involved는 과거분사로 쓰여서 앞에 있는 명사인 neurons를 수식하며 연관된 이라는 수동의 의미를 나타내고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 의미한다\u003c/span>\u003cspan class=\"en\">That means\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분이 더 여러 차례 사용해 볼수록\u003c/span>\u003cspan class=\"en\">the more times you \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">try \u003c/span>\u003cspan class=\"tgt\">using\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 새로운 피드백 기술을\u003c/span>\u003cspan class=\"en\">that new feedback technique,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 더 쉽게 여러분에게 다가올 것임을\u003c/span>\u003cspan class=\"en\">the more easily it will come to you\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분이 그것을 필요로 할 때\u003c/span>\u003cspan class=\"en\">when you need it.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 여러분이 그 새로운 피드백 기술을 더 여러 차례 사용해 볼수록, 여러분이 그것을 필요로 할 때 그것이 더 쉽게 여러분에게 다가올 것임을 의미한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 뇌의 과학적 원리를 실제 \u003cb class=\"key\">학습 \u003c/b>\u003cb class=\"key\">상황\u003c/b>에 적용하여, 반복 시도가 실력을 \u003cb class=\"key\">체화\u003c/b>시킨다는 결론을 내립니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">try + 동명사\u003c/span> : try [동사] + using [동명사/목적어] : \"사용해 보다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">더 비교급, 더 비교급\u003c/span> : the more [비교급] + S + V, the more [비교급] + S + V : \"더 여러 차례 ~할수록, 더 쉽게 ...하다\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"That means, 그것은 의미한다. the more times you try using, 여러분이 더 여러 차례 사용해 볼수록. that new feedback technique, 그 새로운 피드백 기술을. the more easily it will come to you, 그것이 더 쉽게 여러분에게 다가올 것임을. when you need it, 여러분이 그것을 필요로 할 때. 이 문장 전체를 해석하면, 그것은 여러분이 그 새로운 피드백 기술을 더 여러 차례 사용해 볼수록, 여러분이 그것을 필요로 할 때 그것이 더 쉽게 여러분에게 다가올 것임을 의미한다.","hl":"m"},{"n":44,"text":"전체 글의 마지막 결론 문장이에요. 새로운 기술을 자꾸 써보는 학습 상황을 반복하다 보면 결국 그 기술이 내 몸에 완전히 익어서 체화된다는 것을 보여주고 있습니다.","hl":"mn"},{"n":45,"text":"서술형으로 나오기 딱 좋은 어법이 있네요. 첫 번째로 더 모어 타임즈와 더 모어 이질리가 짝을 이루는 더 비교급 구문은 더 뭐뭐할수록 더 뭐뭐하다라는 뜻으로 문장의 주제를 강조할 때 정말 자주 쓰여요. 두 번째로 try using에서 동사 try 뒤에 동명사가 오면 시험 삼아 뭐뭐해 보다 혹은 뭐뭐하는 것을 시도하다라는 의미가 됩니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>어린 시절에는 자전거 타기처럼 \u003cb class=\"key\">어려운 \u003c/b>\u003cb class=\"key\">기술\u003c/b>도 습관이 될 때까지 반복해서 시도하며 배운다.\u003c/li>\u003cli>성인이 되면 새로운 시도가 처음에 \u003cb class=\"key\">실패하거나 \u003c/b>\u003cb class=\"key\">어색\u003c/b>하면 곧바로 포기하는 경향이 있다.\u003c/li>\u003cli>과학적으로 볼 때 \u003cb class=\"key\">반복적인 \u003c/b>\u003cb class=\"key\">행동\u003c/b>은 뇌의 뉴런 연결을 더욱 단단하게 만드는 핵심적인 과정이다.\u003c/li>\u003cli>새로운 기술을 더 \u003cb class=\"key\">자주 \u003c/b>\u003cb class=\"key\">사용할수록\u003c/b> 뇌 회로가 재구성되어 기술을 더 쉽게 구사할 수 있게 된다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Repetition is essential for strengthening neural connections and mastering new skills through the process of rewiring the brain.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">어른들은 새로운 시도에서 쉽게 포기하는 경향이 있으나, \u003cb class=\"key\">반복\u003c/b>은 \u003cb class=\"key\">뇌의 \u003c/b>\u003cb class=\"key\">뉴런 \u003c/b>\u003cb class=\"key\">연결\u003c/b>을 강화하여 새로운 기술이 습관이 되게 만드는 핵심 과정이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":46,"text":"오늘 우리는 반복이 뇌의 지도를 어떻게 다시 그리는지 배워보았습니다. 무언가 새로 시작할 때 처음의 어색함에 속지 마세요. 여러분이 반복할수록 여러분의 뇌 속 뉴런들은 더 끈끈하게 연결되고 있다는 걸 잊지 마시기 바랍니다. 오늘 강의 여기서 마치겠습니다. 수고하셨어요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
