<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터2 Reading37 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터2 Reading37","audioDir":"reading37_audio","preview":false,"count":55,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.668em\">Reading\u003cbr>37\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터 레벨2\u003c/div>\u003ch1>The Essence of Trading: An Exchange of Desires\u003c/h1>\u003ch2>거래의 본질: 욕망의 교환\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>인간은 타고난 신체적, 정신적 \u003cb class=\"key\">한계\u003c/b>로 인해 모든 욕구를 스스로 해결할 수 없으므로, 서로의 \u003cb class=\"key\">욕망\u003c/b>을 충족하기 위해 유·무형의 상품을 \u003cb class=\"key\">거래\u003c/b>하며 살아갑니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Trading is essentially a purposeful process of fulfilling diverse human desires by exchanging physical or conceptual commodities that individuals cannot independently provide for themselves.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분, 오늘은 우리가 매일 하는 거래라는 행위 속에 숨겨진 진짜 의미를 찾아볼 거예요. 이번 시간의 핵심은 거래가 단순히 물건을 주고받는 것을 넘어 본질적으로 욕망을 교환하는 과정이라는 점입니다. 인간의 한계와 거래의 필요성을 연결해서 지문을 이해해 보도록 하죠.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">인간은 생물학적으로 모든 방면에서 완벽할 수 없는 \u003cb class=\"key\">한계(limitation)\u003c/b>를 지니고 태어납니다. 이러한 불완전함 때문에 우리는 혼자서 모든 필요를 채우는 \u003cb class=\"key\">자급자족(self-sufficiency)\u003c/b> 대신 타인과의 상호작용을 선택하게 됩니다. 경제학의 기초가 되는 \u003cb class=\"key\">분업(division \u003c/b>\u003cb class=\"key\">of \u003c/b>\u003cb class=\"key\">labor)\u003c/b>과 \u003cb class=\"key\">교환(exchange)\u003c/b>의 원리는 단순히 물건을 주고받는 행위를 넘어, 인간의 내면적 욕구를 효율적으로 해결하려는 의지에서 비롯됩니다. 예를 들어, 맛있는 빵을 먹고 싶은 욕구와 따뜻한 옷을 입고 싶은 욕구가 서로 다른 전문성을 가진 사람들의 \u003cb class=\"key\">거래(trading)\u003c/b>를 통해 동시에 해소되는 것과 같습니다. 이는 공동체 내에서 서로의 부족함을 보완하며 생존하고 번영하기 위한 핵심적인 생존 전략입니다.\u003c/div>","segs":[{"n":2,"text":"우리 인간은 태어날 때부터 모든 분야에서 완벽할 수는 없는 신체적, 정신적 한계를 가지고 있어요. 그래서 자신이 잘하는 것에 집중하고 부족한 것은 남에게 얻는 분업과 교환이라는 전략을 선택하게 된 거죠. 마치 요리는 잘하지만 집은 지을 줄 모르는 사람이 요리를 제공하고 살 곳을 얻는 것과 같습니다. 이러한 상호보완적 관계가 바로 공동체를 유지하는 힘이 된답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>인간의 한계\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>인간은 본질적으로 신체적, 정신적 \u003cb class=\"key\">한계\u003c/b>를 가지고 있어 혼자서는 제한된 수의 \u003cb class=\"key\">개인적인 \u003c/b>\u003cb class=\"key\">욕망\u003c/b>만을 독립적으로 충족할 수 있습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>에디슨의 예시\u003csmall>예시 · 문장 4–6\u003c/small>\u003c/h4>\u003cp>천재 발명가 에디슨도 발명에는 능했지만 농사나 건축에는 소질이 없었기에, 자신의 \u003cb class=\"key\">재능\u003c/b>을 제공하고 필요한 \u003cb class=\"key\">의식주\u003c/b>를 얻어야 했습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>거래의 기능\u003csmall>주장 · 문장 7–8\u003c/small>\u003c/h4>\u003cp>거래는 공동체 내에서 개인의 다양한 욕구를 해결하는 \u003cb class=\"key\">효과적인 \u003c/b>\u003cb class=\"key\">수단\u003c/b>이며, \u003cb class=\"key\">공개 \u003c/b>\u003cb class=\"key\">시장\u003c/b>에서 모든 종류의 상품이 교환됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>상품의 형태\u003csmall>구체화 · 문장 9–12\u003c/small>\u003c/h4>\u003cp>거래되는 상품은 물리적인 물건뿐만 아니라 지식이나 음악 같은 \u003cb class=\"key\">추상적 \u003c/b>\u003cb class=\"key\">형태\u003c/b>로도 존재하며, 타인의 \u003cb class=\"key\">욕망 \u003c/b>\u003cb class=\"key\">충족\u003c/b>을 목적으로 거래됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>거래의 본질\u003csmall>결론 · 문장 13–14\u003c/small>\u003c/h4>\u003cp>개인들은 \u003cb class=\"key\">목적\u003c/b>을 가지고 기꺼이 거래에 참여하며, 결국 거래의 본질은 \u003cb class=\"key\">욕망의 \u003c/b>\u003cb class=\"key\">교환\u003c/b>이라는 결론에 도달합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 인간의 근본적인 한계에서 시작해서 왜 우리가 거래를 할 수밖에 없는지 그 필연성을 단계적으로 보여줍니다.","hl":null},{"n":4,"text":"첫 번째 단계에서는 모든 인간이 가진 신체적, 정신적 한계에 대해 이야기해요. 이러한 제한 때문에 우리는 각자의 개인적인 욕망을 스스로 다 해결하지 못하고 타인에게 의존하게 되는 거죠.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 구체적인 예시로 토마스 에디슨이 등장해요. 에디슨은 전구를 발명하는 뛰어난 지능은 가졌지만 농부나 건축가로서의 능력은 없었기 때문에 먹을 음식과 살 곳을 얻기 위해 자신의 발명품을 제공해야 했습니다.","hl":"f1"},{"n":6,"text":"세 번째 단계는 거래의 사회적 기능을 설명합니다. 거래는 공동체 안에서 다양한 욕구를 해결하는 매우 효과적인 수단이 되며 공개 시장이라는 공간을 통해 활발하게 이루어진다는 점을 짚어줍니다.","hl":"f2"},{"n":7,"text":"네 번째 단계에서는 거래되는 상품의 두 가지 형태를 나누어 설명해요. 음식이나 자동차 같은 물리적인 물건도 있지만 지식이나 음악 같은 추상적인 형태도 모두 거래의 대상이 되며 그 이유는 결국 타인의 욕망을 만족시킬 수 있기 때문입니다.","hl":"f3"},{"n":8,"text":"마지막 다섯 번째 단계는 결론입니다. 사람들은 기꺼이 그리고 분명한 목적을 가지고 이 교환 과정에 참여하고 있으며 따라서 거래의 본질은 결국 서로의 욕망을 맞바꾸는 것이라고 요약합니다.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">양괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 상품의 교환을 \u003cb class=\"key\">욕망의 \u003c/b>\u003cb class=\"key\">교환\u003c/b>으로 정의하며 주제를 던지고, 마지막 문장에서 이를 재확인하는 \u003cb class=\"key\">양괄식\u003c/b> 구조입니다. 중간 부분은 인간의 \u003cb class=\"key\">한계\u003c/b>와 에디슨의 \u003cb class=\"key\">사례\u003c/b>를 통해 왜 거래가 필요한지를 논리적으로 증명하고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Therefore (3)\u003c/b>\u003cspan>인과관계 결론 유도\u003c/span>\u003cb>For instance (4)\u003c/b>\u003cspan>구체적 사례 제시\u003c/span>\u003cb>The reason is that (12)\u003c/b>\u003cspan>이유 및 근거 설명\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">exchange of products\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">exchange of desires\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">trading\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">participating in the exchange\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"이 글은 지문의 처음과 끝에서 동일한 주제를 반복해서 강조하는 양괄식 구조를 가지고 있습니다. 첫 문장에서 정의를 내리고 마지막 문장에서 그 정의를 다시 한번 확인시켜 주며 글의 통일성을 높이고 있죠.","hl":"ty"},{"n":10,"text":"글 전체에서 Therefore라는 인과관계 접속사가 세 번이나 사용되었는데요. 이는 논리적 결론을 도출할 때 쓰는 아주 중요한 신호어입니다. 또한 For instance를 통해 추상적인 개념을 에디슨이라는 구체적인 사례로 쉽게 풀어서 설명하고 있어요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>nature\u003c/b>\u003cem>명사\u003c/em>\u003cspan>본질, 성질\u003c/span>\u003c/div>\u003cdiv>\u003cb>exchange\u003c/b>\u003cem>명사/동사\u003c/em>\u003cspan>교환(하다)\u003c/span>\u003c/div>\u003cdiv>\u003cb>product\u003c/b>\u003cem>명사\u003c/em>\u003cspan>상품, 제품\u003c/span>\u003c/div>\u003cdiv>\u003cb>actually\u003c/b>\u003cem>부사\u003c/em>\u003cspan>사실상, 실제로\u003c/span>\u003c/div>\u003cdiv>\u003cb>desire\u003c/b>\u003cem>명사\u003c/em>\u003cspan>욕망, 욕구\u003c/span>\u003c/div>\u003cdiv>\u003cb>human being\u003c/b>\u003cem>명사\u003c/em>\u003cspan>인간\u003c/span>\u003c/div>\u003cdiv>\u003cb>inherent\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>타고난, 내재된\u003c/span>\u003c/div>\u003cdiv>\u003cb>physical\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>신체적인, 물리적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>mental\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>정신적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>limitation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>한계, 제한\u003c/span>\u003c/div>\u003cdiv>\u003cb>individual\u003c/b>\u003cem>명사\u003c/em>\u003cspan>개인\u003c/span>\u003c/div>\u003cdiv>\u003cb>capable of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 할 수 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>satisfy\u003c/b>\u003cem>동사\u003c/em>\u003cspan>충족시키다, 만족시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>independently\u003c/b>\u003cem>부사\u003c/em>\u003cspan>독립적으로, 혼자서\u003c/span>\u003c/div>\u003cdiv>\u003cb>brilliant\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>뛰어난, 훌륭한\u003c/span>\u003c/div>\u003cdiv>\u003cb>invent\u003c/b>\u003cem>동사\u003c/em>\u003cspan>발명하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>electric light bulb\u003c/b>\u003cem>명사\u003c/em>\u003cspan>전구\u003c/span>\u003c/div>\u003cdiv>\u003cb>ability\u003c/b>\u003cem>명사\u003c/em>\u003cspan>능력\u003c/span>\u003c/div>\u003cdiv>\u003cb>in return\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>그 대가로\u003c/span>\u003c/div>\u003cdiv>\u003cb>effective\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>효과적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>means\u003c/b>\u003cem>명사\u003c/em>\u003cspan>수단, 방법\u003c/span>\u003c/div>\u003cdiv>\u003cb>community\u003c/b>\u003cem>명사\u003c/em>\u003cspan>공동체\u003c/span>\u003c/div>\u003cdiv>\u003cb>commodity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>상품, 원자재\u003c/span>\u003c/div>\u003cdiv>\u003cb>open market\u003c/b>\u003cem>명사\u003c/em>\u003cspan>공개 시장\u003c/span>\u003c/div>\u003cdiv>\u003cb>abstract\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>추상적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>conceptual\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>개념적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>irrespective of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 관계없이\u003c/span>\u003c/div>\u003cdiv>\u003cb>purposely\u003c/b>\u003cem>부사\u003c/em>\u003cspan>목적을 가지고, 고의로\u003c/span>\u003c/div>\u003cdiv>\u003cb>participate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>참여하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>essentially\u003c/b>\u003cem>부사\u003c/em>\u003cspan>본질적으로\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"여기서 nature라는 단어는 자연이 아니라 본질이나 성질이라는 뜻으로 쓰였습니다. 그리고 commodity는 우리가 시장에서 사고파는 상품을 뜻하며 physical과 abstract라는 반대되는 개념의 수식을 각각 받고 있다는 점을 기억하세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">inherent\u003c/b>\u003cspan class=\"m\">타고난\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">innate\u003c/span>\u003cspan class=\"s\">inborn\u003c/span>\u003cspan class=\"s\">natural\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">acquired\u003c/span>\u003cspan class=\"a\">learned\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">satisfy\u003c/b>\u003cspan class=\"m\">충족시키다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">fulfill\u003c/span>\u003cspan class=\"s\">gratify\u003c/span>\u003cspan class=\"s\">meet\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">dissatisfy\u003c/span>\u003cspan class=\"a\">frustrate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">limitation\u003c/b>\u003cspan class=\"m\">한계\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">restriction\u003c/span>\u003cspan class=\"s\">constraint\u003c/span>\u003cspan class=\"s\">boundary\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">strength\u003c/span>\u003cspan class=\"a\">advantage\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">abstract\u003c/b>\u003cspan class=\"m\">추상적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">theoretical\u003c/span>\u003cspan class=\"s\">conceptual\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">concrete\u003c/span>\u003cspan class=\"a\">physical\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">effective\u003c/b>\u003cspan class=\"m\">효과적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">efficient\u003c/span>\u003cspan class=\"s\">productive\u003c/span>\u003cspan class=\"s\">valid\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ineffective\u003c/span>\u003cspan class=\"a\">useless\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"중요한 단어를 짚어보면 inherent는 타고난이라는 뜻으로 innate와 같은 말이고 후천적인 것을 뜻하는 acquired와는 반대됩니다. satisfy는 욕구를 충족시킨다는 뜻으로 fulfill과 바꾸어 쓸 수 있으며 반대말로는 불만족스럽게 한다는 뜻의 dissatisfy가 있어요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">본질적으로,\u003c/span>\u003cspan class=\"en\">By its nature,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상품의 교환은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">exchange\u003c/span> of products\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사실상\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is\u003c/span> actually\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">욕망의 교환이다.\u003c/span>\u003cspan class=\"en\">the exchange of desires.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">본질적으로, 상품의 교환은 사실상 욕망의 교환이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 거래가 표면적으로는 물건을 주고받는 행위처럼 보이지만, 그 핵심은 서로의 \u003cb class=\"key\">욕망\u003c/b>을 채우기 위한 것임을 정의하는 \u003cb class=\"key\">주제문\u003c/b>입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사에서 유래한 명사 주어\u003c/span> : the + exchange [명사/주어] + of [전치사] : \"교환\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주어-동사 수 일치\u003c/span> : the exchange (단수 주어) + is (단수 동사) : \"~이다\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"By its nature, 본질적으로. the exchange of products, 상품의 교환은. is actually, 사실상. the exchange of desires, 욕망의 교환이다.. 이 문장 전체를 해석하면, 본질적으로, 상품의 교환은 사실상 욕망의 교환이다.","hl":"m"},{"n":14,"text":"이 글의 첫 번째 문장은 가장 중요한 주제를 담고 있어요. 우리가 물건을 바꾸는 이유는 사실 그 물건 뒤에 숨겨진 서로의 욕망을 채우기 위해서라는 거죠.","hl":"mn"},{"n":15,"text":"첫 번째로 the exchange는 교환이라는 뜻의 명사 주어로 쓰였어요. 두 번째로 이 주어가 단수이기 때문에 동사 자리에 is를 써서 수 일치를 시켜준 것을 꼭 확인하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 인간에게는\u003c/span>\u003cspan class=\"en\">All human beings\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">있다\u003c/span>\u003cspan class=\"en\">have\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">타고난 신체적, 정신적 한계가.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">inherent\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">physical \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">mental\u003c/span> limitations.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">모든 인간에게는 타고난 신체적, 정신적 한계가 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 인간은 혼자서 모든 것을 해결할 수 없는 \u003cb class=\"key\">태생적 \u003c/b>\u003cb class=\"key\">한계\u003c/b>를 가지고 있다는 점을 지적하며, 교환이 필요한 \u003cb class=\"key\">이유\u003c/b>를 설명하기 시작합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">형용사의 명사 수식\u003c/span> : inherent [형용사] + limitations [명사] : \"타고난\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">형용사의 병렬 구조\u003c/span> : physical [형용사1] + and + mental [형용사2] : \"신체적, 정신적\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"All human beings, 모든 인간에게는. have, 있다. inherent physical and mental limitations, 타고난 신체적, 정신적 한계가.. 이 문장 전체를 해석하면, 모든 인간에게는 타고난 신체적, 정신적 한계가 있다.","hl":"m"},{"n":17,"text":"인간은 누구나 완벽하지 않다는 점을 말하고 있어요. 몸으로 하는 일이든 머리로 하는 일이든 누구나 타고난 한계가 있다는 뜻이죠.","hl":"mn"},{"n":18,"text":"첫 번째로 inherent라는 형용사가 뒤에 있는 limitations를 꾸며주고 있어요. 두 번째로 physical과 mental이라는 두 형용사가 and로 묶여서 병렬 구조를 이루고 있다는 점에 주목하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러므로\u003c/span>\u003cspan class=\"en\">Therefore,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 개인이든 대개\u003c/span>\u003cspan class=\"en\">any individual is usually only\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">충족시킬 수 있을 뿐이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">capable \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">satisfying\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제한된 수의 개인적인 욕망만을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">limited \u003c/span>\u003cspan class=\"tgt\">number \u003c/span>\u003cspan class=\"tgt\">of\u003c/span> personal desires\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">독립적으로.\u003c/span>\u003cspan class=\"en\">independently.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러므로 어떤 개인이든 대개 제한된 수의 개인적인 욕망만을 독립적으로 충족시킬 수 있을 뿐이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 인간의 한계 때문에 타인의 도움 없이 \u003cb class=\"key\">혼자서\u003c/b> (independently) 해결할 수 있는 욕망은 매우 \u003cb class=\"key\">제한적\u003c/b>일 수밖에 없다는 인과관계를 나타냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">형용사구의 전치사 목적어\u003c/span> : be capable of [전치사] + satisfying [동명사] : \"충족시킬 수 있는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수량 형용사구\u003c/span> : a limited number of + [복수 명사] : \"제한된 수의\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"Therefore, 그러므로. any individual is usually only, 어떤 개인이든 대개. capable of satisfying, 충족시킬 수 있을 뿐이다. a limited number of personal desires, 제한된 수의 개인적인 욕망만을. independently, 독립적으로.. 이 문장 전체를 해석하면, 그러므로 어떤 개인이든 대개 제한된 수의 개인적인 욕망만을 독립적으로 충족시킬 수 있을 뿐이다.","hl":"m"},{"n":20,"text":"앞에서 말한 한계 때문에 생기는 결과를 말하죠. 인간은 혼자 힘으로는 아주 적은 양의 욕구만 채울 수 있다는 한계를 강조하고 있습니다.","hl":"mn"},{"n":21,"text":"첫 번째로 be capable of라는 숙어 뒤에는 동명사가 와야 해서 satisfying이라고 썼어요. 두 번째로 a limited number of는 뒤에 항상 복수 명사가 오는데 여기서는 desires가 그 역할을 하고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들어, \u003c/span>\u003cspan class=\"en\">For instance,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">토마스 에디슨은 \u003c/span>\u003cspan class=\"en\">Thomas Edison\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">뛰어난 지성을 가지고 있었을지 모르지만, \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">may \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">had\u003c/span> the brilliant mind\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전구를 발명할 수 있는 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">invent\u003c/span> the electric light bulb,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아마도 적절한 능력을 가지고 있지는 않았을 것이다 \u003c/span>\u003cspan class=\"en\">but he probably didn't have the right ability\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">농부나 건축가가 될 수 있는\u003c/span>\u003cspan class=\"en\">to be a farmer or a builder.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">예를 들어, 토마스 에디슨은 전구를 발명할 수 있는 뛰어난 지성을 가지고 있었을지 모르지만, 아마도 농부나 건축가가 될 수 있는 적절한 능력을 가지고 있지는 않았을 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 에디슨처럼 뛰어난 사람도 모든 것을 스스로 해결할 수는 없다는 인간의 \u003cb class=\"key\">한계\u003c/b>를 설명합니다. 전문적인 \u003cb class=\"key\">재능\u003c/b>은 있으나 생존에 필요한 다른 능력은 부족할 수 있음을 보여주는 \u003cb class=\"key\">예시\u003c/b>입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 + have p.p. (과거의 추측)\u003c/span> : may have [조동사구] + had [과거분사] : \"~했을지도 모른다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : the brilliant mind [명사] + to invent [to부정사구] : \"발명할 수 있는\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"For instance, 예를 들어. Thomas Edison, 토마스 에디슨은. may have had the brilliant mind, 뛰어난 지성을 가지고 있었을지 모르지만. to invent the electric light bulb, 전구를 발명할 수 있는. but he probably didn't have the right ability, 아마도 적절한 능력을 가지고 있지는 않았을 것이다. to be a farmer or a builder, 농부나 건축가가 될 수 있는. 이 문장 전체를 해석하면, 예를 들어, 토마스 에디슨은 전구를 발명할 수 있는 뛰어난 지성을 가지고 있었을지 모르지만, 아마도 농부나 건축가가 될 수 있는 적절한 능력을 가지고 있지는 않았을 것이다.","hl":"m"},{"n":23,"text":"에디슨이라는 구체적인 인물을 통해 인간의 능력이 제한적이라는 점을 설명하고 있어요. 아무리 천재라도 모든 일을 다 잘할 수는 없다는 한계를 예시로 보여주는 문장입니다.","hl":"mn"},{"n":24,"text":"첫 번째로 may have had는 과거 사실에 대한 추측을 나타내는 표현이에요. 에디슨이 과거에 그랬을지도 모른다는 의미죠. 두 번째로 to invent는 앞에 있는 명사 mind를 꾸며주는 형용사적 용법으로 쓰였어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 찾아야 했다 \u003c/span>\u003cspan class=\"en\">He needed to find\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">먹을 만한 좋은 음식과 \u003c/span>\u003cspan class=\"en\">good food \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">eat\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">살 곳을\u003c/span>\u003cspan class=\"en\">and a place \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">live \u003c/span>\u003cspan class=\"tgt\">in\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 먹을 만한 좋은 음식과 살 곳을 찾아야 했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 천재 발명가라도 생존을 위해 필수적인 \u003cb class=\"key\">물리적 \u003c/b>\u003cb class=\"key\">욕구\u003c/b>가 있음을 나타냅니다. 혼자서 모든 것을 해결할 수 없기에 외부에서 \u003cb class=\"key\">자원\u003c/b>을 얻어야 하는 상황을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : food [명사] + to eat [to부정사구] : \"먹을 만한\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : a place [명사] + to live in [to부정사구] : \"살\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"He needed to find, 그는 찾아야 했다. good food to eat, 먹을 만한 좋은 음식과. and a place to live in, 살 곳을. 이 문장 전체를 해석하면, 그는 먹을 만한 좋은 음식과 살 곳을 찾아야 했다.","hl":"m"},{"n":26,"text":"천재 발명가인 에디슨도 결국 인간이기에 먹고 자는 것과 같은 기본적인 물리적 욕구가 있었다는 점을 강조하고 있습니다. 이런 욕구들은 스스로 다 해결하기 어려운 것들이죠.","hl":"mn"},{"n":27,"text":"첫 번째로 to eat은 앞에 있는 명사 food를 꾸며주는 형용사적 용법이에요. 두 번째로 to live in 역시 앞의 명사 place를 꾸며주는데, 살 공간 안에서 사는 것이기 때문에 전치사 in을 빠뜨리지 않도록 주의해야 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그런 욕망을 충족시키기 위해서, \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">In \u003c/span>\u003cspan class=\"tgt\">order \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">satisfy\u003c/span> those desires,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 무언가를 제공할 필요가 있었다 \u003c/span>\u003cspan class=\"en\">he needed to offer something\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">욕망을 충족시킬 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">satisfy\u003c/span> the desires\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 대가로 다른 사람들의\u003c/span>\u003cspan class=\"en\">of other individuals in return.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그런 욕망을 충족시키기 위해서, 그는 그 대가로 다른 사람들의 욕망을 충족시킬 무언가를 제공할 필요가 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 자신의 욕구를 채우기 위해 타인과 상호 보완적인 \u003cb class=\"key\">거래\u003c/b>를 해야 함을 설명합니다. 서로의 \u003cb class=\"key\">필요\u003c/b>를 교환하는 과정이 사회적 작용의 핵심임을 시사합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법 (목적)\u003c/span> : In order to [구] + satisfy [동사원형] : \"충족시키기 위해서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : something [선행사] + that [관계대명사] + would satisfy [동사] : \"충족시킬\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"In order to satisfy those desires, 그런 욕망을 충족시키기 위해서. he needed to offer something, 그는 무언가를 제공할 필요가 있었다. that would satisfy the desires, 욕망을 충족시킬. of other individuals in return, 그 대가로 다른 사람들의. 이 문장 전체를 해석하면, 그런 욕망을 충족시키기 위해서, 그는 그 대가로 다른 사람들의 욕망을 충족시킬 무언가를 제공할 필요가 있었다.","hl":"m"},{"n":29,"text":"자신이 부족한 부분을 채우려면 상대방이 원하는 것을 대신 주어야 한다는 거래의 원리를 설명하고 있어요. 서로의 필요를 채워주는 것이 상호 작용의 핵심이라는 내용입니다.","hl":"mn"},{"n":30,"text":"첫 번째로 In order to satisfy는 목적을 나타내는 표현으로, 무언가를 하기 위해서라는 뜻을 분명하게 전달합니다. 두 번째로 that would satisfy는 주격 관계대명사 절로, 앞에 있는 명사 something을 구체적으로 설명해 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">따라서,\u003c/span>\u003cspan class=\"en\">Therefore,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거래는 ~이 된다\u003c/span>\u003cspan class=\"en\">trading becomes\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">효과적인 수단\u003c/span>\u003cspan class=\"en\">an effective \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">means\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다양한 욕구를 충족시키는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">satisfying\u003c/span> the various desires\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공동체 내 개인의.\u003c/span>\u003cspan class=\"en\">of individuals within a community.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">따라서 거래는 공동체 내에서 개인의 다양한 욕구를 충족시키는 효과적인 수단이 된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 언급된 개인의 능력적 한계를 극복하기 위해, \u003cb class=\"key\">거래\u003c/b>가 사회적 관계 속에서 \u003cb class=\"key\">욕구 \u003c/b>\u003cb class=\"key\">충족\u003c/b>을 위한 도구로 기능함을 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사 means의 수 일치\u003c/span> : an [관사] + effective [형용사] + means [명사] : \"수단\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사의 목적어로 쓰인 동명사\u003c/span> : means [명사] + of [전치사] + satisfying [동명사구] : \"충족시키는 (수단)\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"Therefore, 따라서. trading becomes, 거래는 ~이 된다. an effective means, 효과적인 수단. of satisfying the various desires, 다양한 욕구를 충족시키는. of individuals within a community, 공동체 내 개인의.. 이 문장 전체를 해석하면, 따라서 거래는 공동체 내에서 개인의 다양한 욕구를 충족시키는 효과적인 수단이 된다.","hl":"m"},{"n":32,"text":"따라서(Therefore)라는 연결어를 통해 앞선 내용을 정리하고 있어요. 혼자서는 다 채울 수 없는 인간의 욕구를 공동체 안에서 거래라는 수단을 통해 해결한다는 결론이죠.","hl":"mn"},{"n":33,"text":"첫 번째로 means라는 단어를 보세요. 끝에 s가 붙어 있어서 복수형처럼 보이지만, 앞에 an이 붙어 있는 것처럼 단수와 복수 형태가 똑같은 단수 명사예요. 두 번째 포인트는 of satisfying입니다. 전치사 of 뒤에 동명사가 와서 어떤 수단인지를 구체적으로 수식해주고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 공동체 내에서,\u003c/span>\u003cspan class=\"en\">In the community,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 종류의 상품은\u003c/span>\u003cspan class=\"en\">all kinds of commodities\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">교환될 수 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">exchanged\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공개 시장에서.\u003c/span>\u003cspan class=\"en\">on the open market.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 공동체 내에서 모든 종류의 상품은 공개 시장에서 교환될 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 거래가 구체적으로 어디에서 일어나는지 설명하며, \u003cb class=\"key\">공개 \u003c/b>\u003cb class=\"key\">시장\u003c/b>이라는 장소와 \u003cb class=\"key\">모든 \u003c/b>\u003cb class=\"key\">종류\u003c/b>라는 거래의 범위를 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사가 포함된 수동태\u003c/span> : can [조동사] + be [be동사] + exchanged [과거분사] : \"교환될 수 있다\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"In the community, 그 공동체 내에서. all kinds of commodities, 모든 종류의 상품은. can be exchanged, 교환될 수 있다. on the open market, 공개 시장에서.. 이 문장 전체를 해석하면, 그 공동체 내에서 모든 종류의 상품은 공개 시장에서 교환될 수 있다.","hl":"m"},{"n":35,"text":"앞서 말한 공동체 내에서 실제 거래가 어떻게 이루어지는지 보여줍니다. 공개 시장이라는 열린 장소에서는 어떤 상품이든 서로 바꿀 수 있다는 의미예요.","hl":"mn"},{"n":36,"text":"여기서 핵심 어법은 can be exchanged입니다. 주어인 상품은 스스로를 바꾸는 게 아니라 사람들에 의해 교환되는 대상이죠. 그래서 조동사 뒤에 be동사와 과거분사를 쓴 수동태 형태가 온 것입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거래되는 상품은\u003c/span>\u003cspan class=\"en\">Goods \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">traded\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">존재한다\u003c/span>\u003cspan class=\"en\">exist\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">물리적인 물건의 형태로,\u003c/span>\u003cspan class=\"en\">in the form of physical objects,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">음식, 옷, 자동차와 같은.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">such \u003c/span>\u003cspan class=\"tgt\">as\u003c/span> food, clothes, and cars.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">거래되는 상품은 음식, 옷, 자동차와 같은 물리적인 물건의 형태로 존재한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 거래 대상이 되는 상품의 첫 번째 유형인 \u003cb class=\"key\">물리적 \u003c/b>\u003cb class=\"key\">형태\u003c/b>를 정의하고 일상적인 예시를 통해 \u003cb class=\"key\">구체화\u003c/b>합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법(수동)\u003c/span> : Goods [명사] + to be [be동사] + traded [과거분사] : \"거래될 / 거래되는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">예시를 나타내는 전치사구\u003c/span> : such as + [예시 나열] : \"~와 같은\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"Goods to be traded, 거래되는 상품은. exist, 존재한다. in the form of physical objects, 물리적인 물건의 형태로. such as food, clothes, and cars, 음식, 옷, 자동차와 같은.. 이 문장 전체를 해석하면, 거래되는 상품은 음식, 옷, 자동차와 같은 물리적인 물건의 형태로 존재한다.","hl":"m"},{"n":38,"text":"거래되는 물건들이 어떤 모습인지 설명하기 시작하네요. 먼저 우리 눈에 보이고 손으로 만질 수 있는 음식이나 자동차 같은 구체적인 물건들을 언급하고 있습니다.","hl":"mn"},{"n":39,"text":"문장의 주어 부분을 주의 깊게 보세요. to be traded가 앞에 있는 Goods를 꾸며주고 있어요. 상품은 앞으로 거래될 대상이니까 수동의 의미를 담아 to be p.p. 형식을 썼습니다. 그리고 such as는 물리적인 물건의 예시를 나열할 때 쓰는 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그렇지 않으면 그것들은 존재한다\u003c/span>\u003cspan class=\"en\">Or they exist\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 추상적이거나 개념적인 형태로\u003c/span>\u003cspan class=\"en\">in a more \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">abstract \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">conceptual\u003c/span> form,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지식과 음악처럼\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">such \u003c/span>\u003cspan class=\"tgt\">as\u003c/span> knowledge and music.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그렇지 않으면 지식과 음악처럼 더 추상적이거나 개념적인 형태로 존재한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 상품이 눈에 보이는 물건뿐만 아니라 \u003cb class=\"key\">무형의 \u003c/b>\u003cb class=\"key\">가치\u003c/b>인 지식이나 음악 같은 형태로도 존재할 수 있음을 설명하며, 교환의 대상이 \u003cb class=\"key\">확장\u003c/b>되는 부분입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">형용사의 병렬 구조\u003c/span> : [형용사] + or + [형용사] + form(명사) : \"추상적이거나 개념적인\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">예시의 전치사\u003c/span> : such as + [명사(구)] : \"~와 같은, ~처럼\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"Or they exist, 그렇지 않으면 그것들은 존재한다. in a more abstract or conceptual form, 더 추상적이거나 개념적인 형태로. such as knowledge and music, 지식과 음악처럼. 이 문장 전체를 해석하면, 그렇지 않으면 지식과 음악처럼 더 추상적이거나 개념적인 형태로 존재한다.","hl":"m"},{"n":41,"text":"이 문장은 상품이 우리 눈에 보이는 물건뿐만 아니라 무형의 가치인 지식이나 음악 같은 형태로도 존재할 수 있다는 것을 보여줘요. 거래되는 대상의 범위가 매우 확장되고 있다는 점을 기억하세요.","hl":"mn"},{"n":42,"text":"첫 번째로 abstract or conceptual 부분을 보세요. 등위접속사 or가 두 형용사를 연결해서 뒤에 있는 명사 form을 함께 공통 수식하고 있네요. 두 번째로 such as는 구체적인 예시를 들 때 사용하는 전치사구로 여기서는 지식과 음악을 그 사례로 들고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">형태에 관계없이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Irrespective \u003c/span>\u003cspan class=\"tgt\">of\u003c/span> the form,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 상품들은 거래된다\u003c/span>\u003cspan class=\"en\">these commodities \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">traded\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">형태에 관계없이, 이러한 상품들은 거래된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 물질적이든 추상적이든 상관없이 모든 \u003cb class=\"key\">상품\u003c/b>은 거래의 대상이 될 수 있다는 점을 강조하며 거래의 \u003cb class=\"key\">보편성\u003c/b>을 나타냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">양보 의미의 전치사구\u003c/span> : Irrespective of + [명사(구)] : \"~에 관계없이\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : be동사(are) + 과거분사(traded) : \"거래된다\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"Irrespective of the form, 형태에 관계없이. these commodities are traded, 이러한 상품들은 거래된다. 이 문장 전체를 해석하면, 형태에 관계없이, 이러한 상품들은 거래된다.","hl":"m"},{"n":44,"text":"형태가 무엇이든 상관없이 가치를 지닌 모든 상품은 거래의 대상이 된다는 보편성을 말하고 있어요. 글의 흐름상 거래의 대상을 정리해 주는 문장입니다.","hl":"mn"},{"n":45,"text":"첫 번째로 문장 맨 앞의 Irrespective of는 전치사구로 무엇에 관계없이 라는 양보의 의미를 담고 있습니다. 두 번째로 are traded는 주어인 상품이 거래를 직접 하는 게 아니라 거래되는 대상이기 때문에 수동태로 쓰인 것을 꼭 확인하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 이유는 ~이다\u003c/span>\u003cspan class=\"en\">The reason is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 충족시킬 수 있다는 것\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that\u003c/span> they can satisfy\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 사람들의 욕망을\u003c/span>\u003cspan class=\"en\">the desires of other individuals.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 이유는 그것이 다른 사람들의 욕망을 충족시킬 수 있기 때문이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 거래가 성립되는 \u003cb class=\"key\">근본적인 \u003c/b>\u003cb class=\"key\">이유\u003c/b>를 설명하며, 거래의 본질이 타인의 \u003cb class=\"key\">욕망 \u003c/b>\u003cb class=\"key\">충족\u003c/b>에 있음을 밝히는 핵심 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절 접속사 (보어절)\u003c/span> : The reason is + that + [완전한 문장] : \"~라는 것\"\u003c/div>\u003c/div>","segs":[{"n":46,"text":"The reason is, 그 이유는 ~이다. that they can satisfy, 그것이 충족시킬 수 있다는 것. the desires of other individuals, 다른 사람들의 욕망을. 이 문장 전체를 해석하면, 그 이유는 그것이 다른 사람들의 욕망을 충족시킬 수 있기 때문이다.","hl":"m"},{"n":47,"text":"왜 거래가 일어나는지 그 근본 원인을 명확히 밝히는 중요한 문장이에요. 상품의 가치는 결국 다른 사람의 욕망 충족에서 나온다는 뜻이죠.","hl":"mn"},{"n":48,"text":"여기서 핵심 어법은 that입니다. 이 that은 문장에서 주격 보어 역할을 하는 명사절을 이끄는 접속사예요. 접속사 that 뒤에는 주어, 동사, 목적어가 모두 갖춰진 완전한 문장이 온다는 점을 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러한 개인들은\u003c/span>\u003cspan class=\"en\">Those individuals\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기꺼이 그리고 목적을 가지고 참여하고 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">willingly \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">purposely \u003c/span>\u003cspan class=\"tgt\">participating\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 거래에.\u003c/span>\u003cspan class=\"en\">in the exchange.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러한 개 인들은 기꺼이 그리고 목적을 가지고 그 거래에 참여하고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 거래에 참여하는 사람들이 타인에 의해 강제되는 것이 아니라, 자신의 필요를 채우기 위해 \u003cb class=\"key\">자발적\u003c/b>이고 \u003cb class=\"key\">의도적\u003c/b>으로 행동한다는 점을 강조합니다. 이는 시장 경제의 \u003cb class=\"key\">상호 \u003c/b>\u003cb class=\"key\">호혜성\u003c/b>을 뒷받침하는 근거가 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재진행형\u003c/span> : be 동사(are) + [현재분사(participating)] : \"참여하고 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부사의 병렬 구조\u003c/span> : 부사1 + and + 부사2 : \"기꺼이 그리고 목적을 가지고\"\u003c/div>\u003c/div>","segs":[{"n":49,"text":"Those individuals, 그러한 개인들은. are willingly and purposely participating, 기꺼이 그리고 목적을 가지고 참여하고 있다. in the exchange, 그 거래에.. 이 문장 전체를 해석하면, 그러한 개 인들은 기꺼이 그리고 목적을 가지고 그 거래에 참여하고 있다.","hl":"m"},{"n":50,"text":"거래에 참여하는 사람들은 누가 시켜서 억지로 하는 게 아니에요. 각자 자신의 필요를 채우기 위해 기꺼이 그리고 분명한 목적을 가지고 참여한다는 자발성을 강조하고 있습니다.","hl":"mn"},{"n":51,"text":"첫 번째로 are participating 부분을 보세요. 현재진행형을 써서 지금 거래가 일어나는 현장감을 살려 참여하고 있다는 의미를 전달합니다. 두 번째로 willingly and purposely는 부사가 나란히 연결된 구조로, 어떤 태도로 참여하는지 동사를 자세히 설명해 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러므로,\u003c/span>\u003cspan class=\"en\">Therefore,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거래의 본질은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">nature \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">trading\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">본질적으로 ~이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">essentially \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">욕망의 교환.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">exchange\u003c/span> of desires.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러므로 거래의 본질은 본질적으로 욕망의 교환이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 지문의 결론으로, 거래의 외형은 물건의 이동이지만 그 \u003cb class=\"key\">핵심적 \u003c/b>\u003cb class=\"key\">실체\u003c/b>는 인간의 \u003cb class=\"key\">욕망 \u003c/b>\u003cb class=\"key\">충족\u003c/b>을 위한 상호 교환임을 정의합니다. 첫 번째 문장에서 제시한 주제를 \u003cb class=\"key\">재진술\u003c/b>하며 글을 마무리합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사구 주어\u003c/span> : the nature [명사] + of [전치사] + trading [동명사] : \"거래의 본질\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">2형식 문장\u003c/span> : 주어 + is [연결 동사] + 주격 보어(the exchange) : \"본질적으로 교환이다\"\u003c/div>\u003c/div>","segs":[{"n":52,"text":"Therefore, 그러므로. the nature of trading, 거래의 본질은. is essentially, 본질적으로 ~이다. the exchange of desires, 욕망의 교환.. 이 문장 전체를 해석하면, 그러므로 거래의 본질은 본질적으로 욕망의 교환이다.","hl":"m"},{"n":53,"text":"마지막 결론 문장이네요. 거래라는 행위의 겉모습이 아니라 그 속에 담긴 진짜 정체, 즉 본질은 결국 서로의 욕망을 맞바꾸는 것이라고 요약하고 있습니다.","hl":"mn"},{"n":54,"text":"첫 번째로 주어인 the nature of trading에서 nature는 자연이 아니라 본질이라는 뜻으로 쓰였다는 점에 주의하세요. 두 번째로 is essentially the exchange 부분은 주어인 본질이 무엇인지 보충 설명하는 이형식 구조로, 거래가 근본적으로 무엇인지 정의를 내리고 있습니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>모든 인간은 타고난 \u003cb class=\"key\">신체적, \u003c/b>\u003cb class=\"key\">정신적 \u003c/b>\u003cb class=\"key\">한계\u003c/b>를 지니고 있어 스스로 모든 욕구를 충족할 수 없습니다.\u003c/li>\u003cli>에디슨과 같은 천재도 자신의 전문 분야 외에는 \u003cb class=\"key\">타인의 \u003c/b>\u003cb class=\"key\">도움\u003c/b>과 자원이 필요했음을 예로 들어 설명합니다.\u003c/li>\u003cli>거래는 \u003cb class=\"key\">물리적 \u003c/b>\u003cb class=\"key\">상품\u003c/b>뿐만 아니라 지식과 같은 추상적 가치까지 포함하여 공동체 내에서 이루어집니다.\u003c/li>\u003cli>결론적으로 거래는 단순한 물건의 이동을 넘어 타인의 \u003cb class=\"key\">욕망을 \u003c/b>\u003cb class=\"key\">채워주는 \u003c/b>\u003cb class=\"key\">과정\u003c/b>이자 본질입니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Trading is essentially a purposeful process of fulfilling diverse human desires by exchanging physical or conceptual commodities that individuals cannot independently provide for themselves.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">인간은 타고난 신체적, 정신적 \u003cb class=\"key\">한계\u003c/b>로 인해 모든 욕구를 스스로 해결할 수 없으므로, 서로의 \u003cb class=\"key\">욕망\u003c/b>을 충족하기 위해 유·무형의 상품을 \u003cb class=\"key\">거래\u003c/b>하며 살아갑니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":55,"text":"자, 오늘 우리는 거래가 왜 발생하는지 그리고 그 속의 본질적인 의미가 무엇인지 배워봤습니다. 인간은 한계를 극복하기 위해 서로의 욕망을 채워주며 살아가는 존재라는 점 잊지 마세요. 오늘 배운 내용을 복습하며 거래의 본질인 욕망의 교환이라는 키워드를 꼭 기억하길 바랍니다. 수고하셨어요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
