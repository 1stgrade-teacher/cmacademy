<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터2 Reading39 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터2 Reading39","audioDir":"reading39_audio","preview":false,"count":91,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.668em\">Reading\u003cbr>39\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터 레벨2\u003c/div>\u003ch1>Nellie's First Bike Trip: Overcoming Fear with Friendship\u003c/h1>\u003ch2>Nellie의 첫 자전거 여행: 우정으로 극복한 두려움\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>자전거 초보자인 Nellie가 여행 중 사고를 당해 포기하고 싶어 했으나, 친구 Gaby의 진심 어린 \u003cb class=\"key\">격려\u003c/b>를 통해 두려움을 이겨내고 끝까지 \u003cb class=\"key\">완주\u003c/b>하는 과정을 보여줍니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>A friend's warm encouragement can empower someone to overcome physical pain and mental fear.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 친구의 응원이 우리 삶에 어떤 변화를 주는지 보여주는 감동적인 에피소드를 함께 공부하겠습니다. 이 지문은 자전거 초보자가 사고를 딛고 일어나는 과정을 다루고 있는데요, 핵심 내용은 친구의 진심 어린 격려가 한 사람의 포기하려던 마음을 어떻게 되돌리는가에 대한 것입니다. 요지는 바로 친구의 응원이 두려움과 실패를 극복하는 힘이 된다는 점이죠.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">이 글의 배경은 친구와 함께 떠나는 자전거 여행(bike trip)입니다. 초보 운전자가 겪는 심리적 압박인 \u003cb class=\"key\">공포심\u003c/b>(panic)은 시야를 좁게 만들어 실제 사고로 이어지는 경우가 많은데, 이를 심리학적으로 '표적 고착' 현상이라 부르기도 합니다. 사고 후 밀려오는 \u003cb class=\"key\">당혹감\u003c/b>(embarrassment)은 때로 신체적 고통보다 더 큰 좌절을 주어 중도 포기를 유발합니다. 하지만 타인의 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">지지\u003c/b>(social support)는 스트레스를 완화하고 다시 시도할 용기를 주는 강력한 촉매제가 됩니다. 일상에서 시험 성적이 좋지 않을 때 친구의 따뜻한 응원 한마디가 다시 책상 앞에 앉게 만드는 것과 같은 \u003cb class=\"key\">동기 \u003c/b>\u003cb class=\"key\">부여\u003c/b>의 원리입니다.\u003c/div>","segs":[{"n":2,"text":"본격적인 독해에 앞서 배경을 살펴볼까요? 이야기의 중심 소재는 자전거 여행입니다. 초보 운전자가 겪는 공포심, 즉 panic은 실제 사고를 유발하기 쉬운데요. 사고 직후에 느끼는 당혹감인 embarrassment는 종종 사람을 포기하게 만듭니다. 하지만 심리학적으로 볼 때, 사회적 지지인 social support가 있다면 스트레스를 이겨내고 다시 도전할 수 있는 동기 부여를 얻게 됩니다. 마치 우리가 힘든 순간 친구의 말 한마디에 다시 힘을 내는 것과 같은 원리라고 생각하면 이해하기 쉬울 거예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>불안한 시작\u003csmall>도입 · 문장 1–5\u003c/small>\u003c/h4>\u003cp>여행 준비를 마쳤지만 자전거 \u003cb class=\"key\">초보자\u003c/b>인 Nellie는 걱정에 휩싸이고, Gaby는 그녀를 \u003cb class=\"key\">응원\u003c/b>합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>즐거운 주행과 위기\u003csmall>전개 · 문장 6–12\u003c/small>\u003c/h4>\u003cp>즐겁게 달리던 중 길의 \u003cb class=\"key\">갈림길\u003c/b> 근처에서 Nellie가 공포를 느껴 결국 벽에 \u003cb class=\"key\">충돌\u003c/b>합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>좌절과 포기의 유혹\u003csmall>전환 · 문장 13–15\u003c/small>\u003c/h4>\u003cp>상처를 입은 Nellie는 \u003cb class=\"key\">당혹감\u003c/b>과 두려움 때문에 여행을 포기하고 혼자 \u003cb class=\"key\">기숙사\u003c/b>로 돌아가려 합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>친구의 강력한 지지\u003csmall>주장/근거 · 문장 16–20\u003c/small>\u003c/h4>\u003cp>Gaby는 포기를 허락하지 않고 곁에서 함께 타겠다며 \u003cb class=\"key\">지속적인 \u003c/b>\u003cb class=\"key\">격려\u003c/b>를 건네 다시 시도하게 만듭니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>성공적인 마무리\u003csmall>결론 · 문장 21–26\u003c/small>\u003c/h4>\u003cp>고통을 참고 다시 달린 Nellie는 결국 여행을 마쳤으며, 비록 넘어졌지만 \u003cb class=\"key\">성취\u003c/b>를 이뤄냅니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 시간의 흐름에 따라 다섯 단계로 전개됩니다. 함께 따라가 볼까요?","hl":null},{"n":4,"text":"첫 번째 단계는 여행 준비 과정입니다. 첫 번째 문장부터 다섯 번째 문장까지인데, 자전거 초보자인 Nellie의 걱정과 이를 다독이는 Gaby의 모습이 대조적으로 나타납니다. 여기서 novice라는 단어는 초보자라는 뜻으로 꼭 기억해 두어야 해요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 즐거운 주행과 갑작스러운 사고입니다. 여섯 번째 문장에서 열두 번째 문장까지로, 행복하게 달리던 중 갈림길인 fork 근처에서 Nellie가 공포를 느껴 벽에 충돌하는 위기 상황을 묘사하고 있습니다.","hl":"f1"},{"n":6,"text":"세 번째 단계는 좌절의 순간입니다. 열세 번째 문장부터 열다섯 번째 문장까지인데, 다친 Nellie가 당황스러운 마음과 두려움 때문에 여행을 포기하고 기숙사로 돌아가 혼자 있고 싶어 하는 심리 상태를 보여줍니다.","hl":"f2"},{"n":7,"text":"네 번째 단계는 친구의 강력한 지지입니다. 열여섯 번째 문장부터 스무 번째 문장까지로, Gaby가 Nellie의 포기를 용납하지 않고 곁에서 지켜주겠다고 격려합니다. 여기서 encouragement라는 단어가 이 글의 핵심 키워드가 됩니다.","hl":"f3"},{"n":8,"text":"마지막 다섯 번째 단계는 성공적인 마무리입니다. 스물한 번째 문장부터 끝까지인데, 고통을 참고 다시 페달을 밟아 결국 여행을 완수하며 넘어졌지만 해냈다는 성취를 보여주며 글이 끝납니다.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 26번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 자전거 여행 중에 발생한 사건을 일어난 순서대로 서술하는 \u003cb class=\"key\">시간적 \u003c/b>\u003cb class=\"key\">흐름\u003c/b>을 따르고 있습니다. 초보자의 걱정, 사고, 좌절, 그리고 친구의 도움으로 극복하는 과정을 통해 비록 넘어졌을지라도 결국 목적을 \u003cb class=\"key\">달성\u003c/b>했다는 결론을 마지막에 강조하는 \u003cb class=\"key\">서사적 \u003c/b>\u003cb class=\"key\">구조\u003c/b>입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>In the morning (1)\u003c/b>\u003cspan>시간적 배경 설정\u003c/span>\u003cb>All of a sudden (11)\u003c/b>\u003cspan>사건의 급격한 전환\u003c/span>\u003cb>Finally (12)\u003c/b>\u003cspan>사건의 결과\u003c/span>\u003cb>So (21)\u003c/b>\u003cspan>앞선 격려의 결과로 인한 행동\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">novice\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">worried\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">panic-stricken\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">ran into the wall\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">embarrassed and afraid\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">give up\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">encouragement\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">try again\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">done it\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"이 글은 전형적인 서사적 구조, 즉 시간의 흐름에 따라 사건이 진행되는 방식을 취하고 있습니다. 마지막 문장에서 비록 실수와 실패가 있었지만 결국 해냈다는 사실을 강조하며 교훈을 주는 미괄식 구조로 볼 수 있죠.","hl":"ty"},{"n":10,"text":"글의 흐름을 알려주는 신호어들을 찾아볼까요? 처음에 In the morning으로 시작해 아침 시간을 설정했고, 사고가 일어날 때 All of a sudden이라는 표현으로 분위기를 급반전시킵니다. 그리고 사고의 결과로 Finally를 썼으며, 마지막에 친구의 격려에 대한 결과로 So를 사용하여 행동의 변화를 자연스럽게 이끌어내고 있습니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>pack\u003c/b>\u003cem>동사\u003c/em>\u003cspan>싸다, 짐을 꾸리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>pedal\u003c/b>\u003cem>동사\u003c/em>\u003cspan>페달을 밟다\u003c/span>\u003c/div>\u003cdiv>\u003cb>novice\u003c/b>\u003cem>명사\u003c/em>\u003cspan>초보자, 풋내기\u003c/span>\u003c/div>\u003cdiv>\u003cb>remember\u003c/b>\u003cem>동사\u003c/em>\u003cspan>기억하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>side by side\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>나란히\u003c/span>\u003c/div>\u003cdiv>\u003cb>lead\u003c/b>\u003cem>동사\u003c/em>\u003cspan>이끌다, 이어지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>edge\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가장자리\u003c/span>\u003c/div>\u003cdiv>\u003cb>fork\u003c/b>\u003cem>동사\u003c/em>\u003cspan>갈라지다, 분기하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>fence\u003c/b>\u003cem>명사\u003c/em>\u003cspan>울타리\u003c/span>\u003c/div>\u003cdiv>\u003cb>all of a sudden\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>갑자기\u003c/span>\u003c/div>\u003cdiv>\u003cb>panic-stricken\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>공포에 질린\u003c/span>\u003c/div>\u003cdiv>\u003cb>wall\u003c/b>\u003cem>명사\u003c/em>\u003cspan>벽\u003c/span>\u003c/div>\u003cdiv>\u003cb>run into\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 충돌하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>rush\u003c/b>\u003cem>동사\u003c/em>\u003cspan>급히 가다, 서두르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>rescue\u003c/b>\u003cem>동사\u003c/em>\u003cspan>구조하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>forehead\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이마\u003c/span>\u003c/div>\u003cdiv>\u003cb>scrape\u003c/b>\u003cem>동사\u003c/em>\u003cspan>찰과상을 입히다, 긁다\u003c/span>\u003c/div>\u003cdiv>\u003cb>embarrassed\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>당황스러운, 쑥스러운\u003c/span>\u003c/div>\u003cdiv>\u003cb>give up\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>포기하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>dorm\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기숙사\u003c/span>\u003c/div>\u003cdiv>\u003cb>alone\u003c/b>\u003cem>부사\u003c/em>\u003cspan>혼자\u003c/span>\u003c/div>\u003cdiv>\u003cb>hear of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 대해 듣다, 용납하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>encouragement\u003c/b>\u003cem>명사\u003c/em>\u003cspan>격려, 장려\u003c/span>\u003c/div>\u003cdiv>\u003cb>continue\u003c/b>\u003cem>동사\u003c/em>\u003cspan>계속하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>incident\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사건, 사고\u003c/span>\u003c/div>\u003cdiv>\u003cb>swollen\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>부어오른\u003c/span>\u003c/div>\u003cdiv>\u003cb>fall off\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에서 떨어지다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"주요 단어를 살펴볼까요? 초보자를 뜻하는 novice, 공포에 질린 상태인 panic-stricken, 그리고 당황스러움을 뜻하는 embarrassed는 인물의 상태를 잘 보여줍니다. 또한 상처가 났을 때 쓰는 scrape나 swollen 같은 단어들도 상황 묘사를 위해 잘 익혀두어야 합니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">novice\u003c/b>\u003cspan class=\"m\">초보자\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">beginner\u003c/span>\u003cspan class=\"s\">learner\u003c/span>\u003cspan class=\"s\">neophyte\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">expert\u003c/span>\u003cspan class=\"a\">veteran\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">embarrassed\u003c/b>\u003cspan class=\"m\">당황한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">ashamed\u003c/span>\u003cspan class=\"s\">humiliated\u003c/span>\u003cspan class=\"s\">mortified\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">proud\u003c/span>\u003cspan class=\"a\">confident\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">give up\u003c/b>\u003cspan class=\"m\">포기하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">abandon\u003c/span>\u003cspan class=\"s\">quit\u003c/span>\u003cspan class=\"s\">surrender\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">persist\u003c/span>\u003cspan class=\"a\">continue\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">encouragement\u003c/b>\u003cspan class=\"m\">격려\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">support\u003c/span>\u003cspan class=\"s\">inspiration\u003c/span>\u003cspan class=\"s\">reassurance\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">discouragement\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">incident\u003c/b>\u003cspan class=\"m\">사건\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">event\u003c/span>\u003cspan class=\"s\">occurrence\u003c/span>\u003cspan class=\"s\">accident\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"유의어를 정리해 봅시다. 초보자인 novice는 beginner와 같고, 당황한 상태인 embarrassed는 humiliated로 바꿔 쓸 수 있어요. 포기하다라는 give up은 quit이나 abandon과 같은 의미이며, 격려인 encouragement는 support로 이해하면 됩니다. 이 단어들은 시험에서 핵심 어휘로 자주 등장하니 잘 체크해 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 26\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아침에\u003c/span>\u003cspan class=\"en\">In the morning\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Gaby는 가져왔다\u003c/span>\u003cspan class=\"en\">Gaby \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">brought\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자전거를\u003c/span>\u003cspan class=\"en\">the bikes.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">아침에 Gaby는 자전거를 가져왔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이야기의 배경을 설정하며 Gaby와 Nellie의 \u003cb class=\"key\">자전거 \u003c/b>\u003cb class=\"key\">여행\u003c/b>이 시작되려는 시점임을 보여줍니다. Gaby가 자전거를 가져오며 \u003cb class=\"key\">사건의 \u003c/b>\u003cb class=\"key\">발단\u003c/b>을 제공하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">불규칙 동사의 과거형\u003c/span> : bring [현재형] → brought [과거형] : \"가져왔다\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"In the morning, 아침에. Gaby brought, Gaby는 가져왔다. the bikes, 자전거를. 이 문장 전체를 해석하면, 아침에 Gaby는 자전거를 가져왔다.","hl":"m"},{"n":14,"text":"아침 일찍 Gaby가 자전거를 챙겨오면서 두 친구의 여행이 시작되는 장면이에요. 글의 첫머리에서 시간적 배경과 주요 소재인 자전거를 제시하고 있죠.","hl":"mn"},{"n":15,"text":"첫 번째 문장에서 brought은 bring의 과거형이에요. 이야기 전체가 과거 시제로 진행될 것임을 보여주는 중요한 출발점입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 26\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Gaby와 Nellie는\u003c/span>\u003cspan class=\"en\">Gaby and Nellie\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">도시락을 쌌고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">lunches \u003c/span>\u003cspan class=\"tgt\">packed\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">준비가 되었다\u003c/span>\u003cspan class=\"en\">and were ready\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">페달을 밟을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">pedal\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Gaby와 Nellie는 도시락을 쌌고 페달을 밟을 준비가 되었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 두 사람이 여행을 위해 \u003cb class=\"key\">준비 \u003c/b>\u003cb class=\"key\">완료\u003c/b>된 상태를 묘사합니다. \u003cb class=\"key\">pedal\u003c/b>이라는 단어를 통해 자전거 여행임을 다시 한번 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">5형식 사역동사 구문\u003c/span> : have [동사] + lunches [목적어] + packed [과거분사/목적격 보어] : \"도시락이 싸여지게 했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : ready [형용사] + to pedal [to부정사구] : \"페달을 밟을\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"Gaby and Nellie, Gaby와 Nellie는. had lunches packed, 도시락을 쌌고. and were ready, 준비가 되었다. to pedal, 페달을 밟을. 이 문장 전체를 해석하면, Gaby와 Nellie는 도시락을 쌌고 페달을 밟을 준비가 되었다.","hl":"m"},{"n":17,"text":"Gaby와 Nellie가 모든 준비를 마치고 이제 막 출발하려는 설레는 상황을 설명하고 있어요. 도시락까지 챙긴 걸 보니 꽤 긴 여행을 계획한 것 같네요.","hl":"mn"},{"n":18,"text":"두 번째 문장에서 had lunches packed 부분을 주목하세요. 도시락인 lunches는 스스로 싸는 게 아니라 사람에 의해 싸여지는 것이기 때문에 과거분사인 packed를 썼어요. 그리고 to pedal은 ready라는 형용사를 꾸며주는 형용사적 용법으로 쓰였습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 26\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Nellie는 ~였다\u003c/span>\u003cspan class=\"en\">Nellie was\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">약간 걱정이 되었다.\u003c/span>\u003cspan class=\"en\">a bit \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">worried\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Nellie는 약간 걱정이 되었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 자전거 여행을 앞둔 Nellie의 \u003cb class=\"key\">불안한 \u003c/b>\u003cb class=\"key\">심리\u003c/b>를 직접적으로 드러냅니다. 이는 뒤에 이어지는 사고의 \u003cb class=\"key\">복선\u003c/b> 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">감정의 과거분사\u003c/span> : be동사 + worried [과거분사/보어] : \"걱정스러운\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"Nellie was, Nellie는 ~였다. a bit worried, 약간 걱정이 되었다.. 이 문장 전체를 해석하면, Nellie는 약간 걱정이 되었다.","hl":"m"},{"n":20,"text":"즐거운 여행의 시작이지만 Nellie의 마음 한구석에는 불안함이 자리 잡고 있어요. 이 감정은 Nellie가 아직 자전거를 타는 데 익숙하지 않기 때문이죠.","hl":"mn"},{"n":21,"text":"세 번째 문장의 worried는 감정을 나타내는 분사예요. Nellie가 걱정을 시키는 게 아니라 스스로 걱정을 느끼는 주체이기 때문에 과거분사 형태를 써야 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 26\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 여전히 ~였다\u003c/span>\u003cspan class=\"en\">She was \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">still\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">초보자\u003c/span>\u003cspan class=\"en\">a novice\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자전거에 있어서\u003c/span>\u003cspan class=\"en\">on the bike.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 여전히 자전거 초보자였다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Nellie가 자전거 여행을 앞두고 왜 \u003cb class=\"key\">걱정\u003c/b>하고 있는지 근거를 제시하는 문장입니다. 그녀의 미숙함은 이후에 일어날 벽에 부딪히는 \u003cb class=\"key\">사고\u003c/b>의 복선 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부사의 위치\u003c/span> : be동사/조동사 뒤, 일반동사 앞 : \"여전히\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"She was still, 그녀는 여전히 ~였다. a novice, 초보자. on the bike, 자전거에 있어서. 이 문장 전체를 해석하면, 그녀는 여전히 자전거 초보자였다.","hl":"m"},{"n":23,"text":"넬리가 왜 아까 걱정했는지 이유를 설명하는 부분이에요. 아직 자전거를 잘 타지 못하는 초보자라는 상황이 이후에 벌어질 사건의 원인이 됩니다.","hl":"mn"},{"n":24,"text":"여기서 still은 여전히라는 뜻의 부사로 쓰였어요. 비동사 뒤에 위치해서 초보자라는 상태가 계속 이어지고 있다는 지속성을 강조하고 있네요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 26\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">&quot;오, 넌 할 수 있어, Nellie&quot;라고\u003c/span>\u003cspan class=\"en\">&quot;Oh, you can do it, Nellie,&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 기억한다\u003c/span>\u003cspan class=\"en\">she \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">remembered \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Gaby가 그녀에게 말했던 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">Gaby \u003c/span>\u003cspan class=\"tgt\">saying\u003c/span> to her.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 “오, 넌 할 수 있어, Nellie.”라고 Gaby가 그녀에게 말했던 것을 기억한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 친구 Gaby가 해준 따뜻한 \u003cb class=\"key\">격려\u003c/b>의 말을 떠올리며 불안감을 극복하려는 장면입니다. `remember` 뒤에 동명사를 써서 \u003cb class=\"key\">과거의 \u003c/b>\u003cb class=\"key\">경험\u003c/b>을 회상하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">remember + 동명사\u003c/span> : remember + -ing : \"~했던 것을 기억하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사의 의미상 주어\u003c/span> : 동명사 앞에 명사(목적격) 혹은 소유격 : \"Gaby가 ~하는 것을\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"\"Oh, you can do it, Nellie,\", \"오, 넌 할 수 있어, Nellie\"라고. she remembered, 그녀는 기억한다. Gaby saying to her, Gaby가 그녀에게 말했던 것을. 이 문장 전체를 해석하면, 그녀는 “오, 넌 할 수 있어, Nellie.”라고 Gaby가 그녀에게 말했던 것을 기억한다.","hl":"m"},{"n":26,"text":"가비가 해주었던 따뜻한 격려의 말을 머릿속으로 떠올리는 장면이에요. 과거의 기억을 통해 불안함을 이겨내려는 넬리의 마음이 잘 드러나고 있습니다.","hl":"mn"},{"n":27,"text":"첫 번째로 remember 뒤에 동명사가 오면 과거에 했던 일을 기억한다는 뜻이에요. 두 번째로 가비는 동명사 세잉의 의미상 주어로 쓰여서, 가비가 말했던 것이라고 해석해야 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 26\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">물론이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Sure\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">물론이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 친구의 격려에 대해 스스로 \u003cb class=\"key\">확신\u003c/b>을 갖는 간결하고 강력한 대답입니다. 두려움 속에서도 자전거를 타겠다는 넬리의 \u003cb class=\"key\">의지\u003c/b>가 함축되어 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">독립 부사의 역할\u003c/span> : Sure (as an elliptical sentence) : \"물론이다\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"Sure, 물론이다. 이 문장 전체를 해석하면, 물론이다.","hl":"m"},{"n":29,"text":"가비의 격려에 대해 넬리 스스로가 확신을 갖는 짧지만 강렬한 대목이에요. 자신의 의지를 다시 한번 다지는 느낌을 줍니다.","hl":"mn"},{"n":30,"text":"이 단어는 앞선 상황이나 생각에 대해 강한 긍정을 나타내는 표현이에요. 문장 성분이 생략된 형태지만 그만큼 확실한 어조를 전달하고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 26\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 페달을 밟았고\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">pedaled \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나란히\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">side \u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">side \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">행복했으며\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">happy \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많이 웃었다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">laughed\u003c/span> a lot.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 나란히 페달을 밟았고 행복했으며 많이 웃었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 걱정하던 넬리가 가비와 함께 즐겁게 자전거를 타기 시작하는 장면으로, 두 사람의 \u003cb class=\"key\">우정\u003c/b>과 초반의 \u003cb class=\"key\">긍정적인 \u003c/b>\u003cb class=\"key\">분위기\u003c/b>를 잘 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거 동사의 병렬 구조\u003c/span> : 주어 + [동사1(past)] + ... and [동사2(past)] + ... and [동사3(past)] : \"페달을 밟았고, 행복했으며, 웃었다\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"They pedaled, 그들은 페달을 밟았고. side by side, 나란히. and were happy, 행복했으며. and laughed a lot, 많이 웃었다.. 이 문장 전체를 해석하면, 그들은 나란히 페달을 밟았고 행복했으며 많이 웃었다.","hl":"m"},{"n":32,"text":"초보인 넬리가 걱정했던 것과 달리 두 친구가 즐겁게 자전거를 타는 장면이에요. 사이좋게 나란히 가며 즐거워하는 모습에서 이 글의 초반부 긍정적인 분위기를 느낄 수 있죠.","hl":"mn"},{"n":33,"text":"이 문장에서는 과거형 동사들이 나열된 병렬 구조를 확인해야 해요. 첫 번째 pedaled, 두 번째 were, 그리고 세 번째 laughed가 and로 연결되어 모두 주어인 They에 걸리고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 26\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">길은 그들이 통과하게 이어졌고\u003c/span>\u003cspan class=\"en\">The road \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">led\u003c/span> them\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">도시의 가장자리를\u003c/span>\u003cspan class=\"en\">through the edge of town\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거기서\u003c/span>\u003cspan class=\"en\">and there\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">갈림길이 되었다.\u003c/span>\u003cspan class=\"en\">it \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">forked\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">길은 그들이 도시의 가장자리를 통과하게 이어졌고 거기서 갈림길이 되었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 평화로운 마을을 벗어나 사건이 발생할 장소로 이동하는 과정을 나타내며, \u003cb class=\"key\">갈림길\u003c/b>은 곧 넬리에게 닥칠 \u003cb class=\"key\">선택과 \u003c/b>\u003cb class=\"key\">위기\u003c/b>의 배경이 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사 lead의 과거형\u003c/span> : lead [타동사] + 목적어 + 장소/방향 : \"이끌다, 이어지다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동사 fork의 과거형\u003c/span> : 주어(it/road) + fork [자동사] : \"갈라지다\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"The road led them, 길은 그들이 통과하게 이어졌고. through the edge of town, 도시의 가장자리를. and there, 거기서. it forked, 갈림길이 되었다.. 이 문장 전체를 해석하면, 길은 그들이 도시의 가장자리를 통과하게 이어졌고 거기서 갈림길이 되었다.","hl":"m"},{"n":35,"text":"평탄하게 오던 길이 도시 끝자락에 다다르며 갈라지는 지점에 도착했다는 뜻이에요. 이 갈림길은 곧 넬리에게 닥칠 예기치 못한 사건의 배경이 되는 중요한 장소입니다.","hl":"mn"},{"n":36,"text":"동사 lead는 누구를 어디로 이끌다라는 의미로 쓰였어요. 문장 끝에 나온 forked는 명사가 아니라 갈라지다라는 뜻의 동사로 쓰인 점에 주의하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 26\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 계속해서 갔다\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">stayed \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오른쪽으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to\u003c/span> the right.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 오른쪽으로 계속해서 갔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 갈림길에서의 선택을 보여주는 간결한 문장으로, 이후 \u003cb class=\"key\">Y자 \u003c/b>\u003cb class=\"key\">도로\u003c/b>의 담벼락에 부딪히는 사고로 이어지는 \u003cb class=\"key\">복선\u003c/b>이 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사구 표현\u003c/span> : stay + to + 방향 : \"~쪽으로 계속 가다\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"They stayed, 그들은 계속해서 갔다. to the right, 오른쪽으로. 이 문장 전체를 해석하면, 그들은 오른쪽으로 계속해서 갔다.","hl":"m"},{"n":38,"text":"갈림길에서 오른쪽 길을 선택했다는 아주 짧고 명확한 설명이에요. 뒤에 나올 Y자 도로의 상황으로 이어지는 징검다리 같은 문장입니다.","hl":"mn"},{"n":39,"text":"stay to는 어디를 유지하며 가다라는 표현이에요. 여기서는 오른쪽 방향을 유지하며 진행했다는 뜻으로 이해하면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 26\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">집이 있었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">was\u003c/span> a home\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것 주변에 울타리가 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">fence \u003c/span>\u003cspan class=\"tgt\">around \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">길의 Y자 지점 바로 거기에.\u003c/span>\u003cspan class=\"en\">right at the Y in the road.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Y자형 길 바로 근처에 울타리가 있는 집이 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사건의 배경이 되는 \u003cb class=\"key\">장소의 \u003c/b>\u003cb class=\"key\">묘사\u003c/b>로, Nellie가 자전거를 제어하기 힘든 \u003cb class=\"key\">Y자형 \u003c/b>\u003cb class=\"key\">갈림길\u003c/b>에 도착했음을 알립니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">유도부사 구문\u003c/span> : There [유도부사] + was [동사] + a home [주어] : \"집이 있었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">형용사구(전치사구)\u003c/span> : a home [명사] + with a fence [전치사구] : \"울타리가 있는 집\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"There was a home, 집이 있었다. with a fence around it, 그것 주변에 울타리가 있는. right at the Y in the road, 길의 Y자 지점 바로 거기에.. 이 문장 전체를 해석하면, Y자형 길 바로 근처에 울타리가 있는 집이 있었다.","hl":"m"},{"n":41,"text":"앞으로 벌어질 충돌 사고의 구체적인 장소를 묘사하는 문장이에요. Y자형 갈림길은 초보자인 넬리에게 아주 까다로운 지형이었음을 암시하죠.","hl":"mn"},{"n":42,"text":"첫 번째로 There was 구문에서는 주어가 뒤에 나오는 a home이에요. 그래서 단수 동사 was를 썼다는 점을 꼭 확인하세요. 두 번째로 with a fence around it은 앞의 집을 꾸며주며 어떤 집인지를 구체적으로 설명해 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 26\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">갑자기,\u003c/span>\u003cspan class=\"en\">All of a sudden,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Nellie는 공포에 질렸고,\u003c/span>\u003cspan class=\"en\">Nellie \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">felt \u003c/span>\u003cspan class=\"tgt\">panic-stricken\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 벽을 보았다\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">saw \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">wall \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신에게 바로 다가오는 것을.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">coming\u003c/span> right at her.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">갑자기, Nellie는 공포에 질렸고, 벽이 자신에게 바로 다가오는 것을 보았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사고 직전의 긴박한 순간을 묘사합니다. \u003cb class=\"key\">지각동사\u003c/b>를 활용해 벽이 다가오는 듯한 \u003cb class=\"key\">현장감\u003c/b>을 생생하게 표현했습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">2형식 감각동사 구문\u003c/span> : felt [감각동사] + panic-stricken [형용사/보어] : \"공포에 질린 것을 느꼈다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지각동사의 목적격 보어(현재분사)\u003c/span> : saw [지각동사] + the wall [목적어] + coming [목적격 보어/현재분사] : \"벽이 다가오는 것을 보았다\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"All of a sudden, 갑자기. Nellie felt panic-stricken, Nellie는 공포에 질렸고. and saw the wall, 그리고 벽을 보았다. coming right at her, 자신에게 바로 다가오는 것을.. 이 문장 전체를 해석하면, 갑자기, Nellie는 공포에 질렸고, 벽이 자신에게 바로 다가오는 것을 보았다.","hl":"m"},{"n":44,"text":"자전거를 잘 못 타는 넬리가 갑작스러운 상황에 대처하지 못하고 당황하는 모습이에요. 벽이 자기에게 오는 것 같다는 표현으로 사고 직전의 공포를 잘 보여주고 있죠.","hl":"mn"},{"n":45,"text":"첫 번째로 felt panic-stricken을 보면 감각동사 뒤에 형용사 보어가 온 구조예요. 넬리의 상태를 설명하죠. 두 번째로 saw the wall coming은 아주 중요한 오형식 지각동사 구문이에요. 목적어인 벽이 다가오는 진행의 느낌을 살리기 위해 현재분사 coming을 썼습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 26\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마침내,\u003c/span>\u003cspan class=\"en\">Finally,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 부딪쳤다\u003c/span>\u003cspan class=\"en\">she \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">ran \u003c/span>\u003cspan class=\"tgt\">into\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">벽에.\u003c/span>\u003cspan class=\"en\">the wall.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">마침내, 그녀는 벽에 부딪쳤다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞선 긴장감이 결국 \u003cb class=\"key\">충돌 \u003c/b>\u003cb class=\"key\">사고\u003c/b>라는 결과로 이어지는 지점입니다. \u003cb class=\"key\">run \u003c/b>\u003cb class=\"key\">into\u003c/b>는 물리적인 충돌을 간결하고 강렬하게 전달합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">구동사(충돌)\u003c/span> : run [자동사] + into [전치사] + the wall [목적어] : \"벽에 부딪쳤다\"\u003c/div>\u003c/div>","segs":[{"n":46,"text":"Finally, 마침내. she ran into, 그녀는 부딪쳤다. the wall, 벽에.. 이 문장 전체를 해석하면, 마침내, 그녀는 벽에 부딪쳤다.","hl":"m"},{"n":47,"text":"걱정하던 일이 결국 터지고 말았네요. 넬리가 자전거 제어에 실패해서 벽에 들이받고 마는 장면입니다.","hl":"mn"},{"n":48,"text":"여기서 ran into는 하나의 덩어리로 외워두세요. 전치사 into가 어떤 지점으로 깊숙이 들어가는 느낌을 주기 때문에 쾅 하고 세게 부딪혔다는 뉘앙스가 잘 전달됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 26\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Gaby는 달려갔다\u003c/span>\u003cspan class=\"en\">Gaby rushed\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Nellie를 구하러\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">rescue\u003c/span> Nellie.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Gaby는 Nellie를 구하러 달려갔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 넘어진 친구를 돕기 위해 즉시 \u003cb class=\"key\">행동\u003c/b>에 나선 Gaby의 모습을 통해 두 사람의 깊은 \u003cb class=\"key\">우정\u003c/b>을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : rushed [자동사] + [to rescue (to부정사구/수식어)] : \"~를 구하기 위해\"\u003c/div>\u003c/div>","segs":[{"n":49,"text":"Gaby rushed, Gaby는 달려갔다. to rescue Nellie, Nellie를 구하러. 이 문장 전체를 해석하면, Gaby는 Nellie를 구하러 달려갔다.","hl":"m"},{"n":50,"text":"갑작스러운 사고가 나자 Gaby가 친구를 돕기 위해 즉시 행동에 나선 상황이죠. 이 문장을 통해 두 사람의 끈끈한 관계를 알 수 있습니다.","hl":"mn"},{"n":51,"text":"여기서 to rescue는 앞에 나온 동사를 꾸며주는 부사적 용법의 목적이에요. 무엇을 하러 달려갔는지 그 목적을 나타내는 투부정사입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 26\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Nellie의 코와 이마는\u003c/span>\u003cspan class=\"en\">Nellie's nose and forehead\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">긁혔지만\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">scraped\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자전거는 멀쩡했다\u003c/span>\u003cspan class=\"en\">but the bike was OK.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Nellie의 코와 이마는 긁혔지만 자전거는 멀쩡했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 신체적인 \u003cb class=\"key\">부상\u003c/b>을 입었음에도 불구하고 자전거 상태와 대비시켜 상황의 \u003cb class=\"key\">심각함\u003c/b>과 안도감을 동시에 나타냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : [주어] + [be동사(were)] + [p.p.(scraped)] : \"긁혔다\"\u003c/div>\u003c/div>","segs":[{"n":52,"text":"Nellie's nose and forehead, Nellie의 코와 이마는. were scraped, 긁혔지만. but the bike was OK, 자전거는 멀쩡했다. 이 문장 전체를 해석하면, Nellie의 코와 이마는 긁혔지만 자전거는 멀쩡했다.","hl":"m"},{"n":53,"text":"넘어지는 바람에 얼굴에 찰과상을 입은 넬리의 상태를 묘사하고 있어요. 하지만 다행히 자전거는 크게 고장 나지 않았다는 점을 대비시키고 있네요.","hl":"mn"},{"n":54,"text":"주어인 신체 부위가 긁힌 상태가 된 것이기 때문에 비동사와 과거분사를 결합한 수동태를 사용했어요. 주어인 nose and forehead가 복수라서 비동사로 were를 쓴 점도 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 15 / 26\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Nellie는 느꼈다\u003c/span>\u003cspan class=\"en\">Nellie felt\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">너무나 당황스럽고 두려워서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">so \u003c/span>\u003cspan class=\"tgt\">embarrassed \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">afraid \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여행을 포기해야 할 것 같았다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> she would have to \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">give \u003c/span>\u003cspan class=\"tgt\">up \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">trip \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 기숙사로 돌아가야 할 것 같았다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">go \u003c/span>\u003cspan class=\"tgt\">back \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">dorm \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거기에서 혼자 아름다운 하루를 보내야 할 것 같았다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">spend\u003c/span> the beautiful day there alone.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Nellie는 너무나 당황스럽고 두려워서 여행을 포기하고 기숙사로 돌아가 거기에서 혼자 아름다운 하루를 보내야 할 것 같았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사고 이후 Nellie가 느끼는 \u003cb class=\"key\">심리적 \u003c/b>\u003cb class=\"key\">위축\u003c/b>과 절망감을 \u003cb class=\"key\">so \u003c/b>\u003cb class=\"key\">~ \u003c/b>\u003cb class=\"key\">that\u003c/b> 구문을 통해 강조하여 표현합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">so ~ that 구문\u003c/span> : so [형용사] + that [절] : \"너무 ~해서 ~하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동사원형 병렬 구조\u003c/span> : would have to + [V1] ... and [V2] ... and [V3] : \"여행을 포기하고 돌아가서 보내야 한다\"\u003c/div>\u003c/div>","segs":[{"n":55,"text":"Nellie felt, Nellie는 느꼈다. so embarrassed and afraid, 너무나 당황스럽고 두려워서. that she would have to give up the trip, 여행을 포기해야 할 것 같았다. and go back to the dorm, 그리고 기숙사로 돌아가야 할 것 같았다. and spend the beautiful day there alone, 거기에서 혼자 아름다운 하루를 보내야 할 것 같았다. 이 문장 전체를 해석하면, Nellie는 너무나 당황스럽고 두려워서 여행을 포기하고 기숙사로 돌아가 거기에서 혼자 아름다운 하루를 보내야 할 것 같았다.","hl":"m"},{"n":56,"text":"넘어지면서 느낀 창피함과 무서움 때문에 여행을 중단하고 싶은 넬리의 심리 상태를 아주 상세하게 보여주는 문장입니다.","hl":"mn"},{"n":57,"text":"첫 번째로 주목할 점은 아주 중요한 so that 구문이에요. 너무 당황해서 결국 포기하게 될 것 같다는 인과관계를 나타내죠. 두 번째는 have to 뒤에 이어지는 동사 원형들이에요. give up, go back, 그리고 spend 세 단어가 and로 연결되어 병렬 구조를 이루고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 16 / 26\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Gaby는\u003c/span>\u003cspan class=\"en\">Gaby\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 말을 듣지 않으려고 했다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">hear \u003c/span>\u003cspan class=\"tgt\">of\u003c/span> it.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Gaby는 그 말을 듣지 않으려고 했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사고 이후 자전거 여행을 포기하려는 Nellie의 소극적인 태도를 Gaby가 단호하게 거절하는 장면입니다. Gaby의 강한 \u003cb class=\"key\">의지\u003c/b>를 나타내어 Nellie가 도전을 계속하도록 이끄는 \u003cb class=\"key\">전환점\u003c/b> 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 would의 고집/거부\u003c/span> : 주어 + would not + 동사원형 : \"듣지 않으려고 했다\"\u003c/div>\u003c/div>","segs":[{"n":58,"text":"Gaby, Gaby는. would not hear of it, 그 말을 듣지 않으려고 했다.. 이 문장 전체를 해석하면, Gaby는 그 말을 듣지 않으려고 했다.","hl":"m"},{"n":59,"text":"넘어져서 다친 Nellie가 여행을 포기하고 기숙사로 돌아가겠다고 하자 Gaby가 단호하게 안 된다고 말하는 상황이에요. 친구의 부정적인 생각을 단칼에 거절하며 끝까지 함께하려는 Gaby의 의지가 느껴지네요.","hl":"mn"},{"n":60,"text":"여기에서 would not은 단순히 과거 시제가 아니라 주어의 강한 거부나 고집을 나타내요. 그래서 그 말을 절대 듣지 않으려고 했다는 뉘앙스로 해석하면 훨씬 자연스러워요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 17 / 26\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 타려고 했다\u003c/span>\u003cspan class=\"en\">She would ride\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자기 친구 옆에서.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">next \u003c/span>\u003cspan class=\"tgt\">to\u003c/span> her friend.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 자기 친구 옆에서 (자전거를) 타려고 했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 친구가 다시 용기를 낼 수 있도록 Gaby가 실질적인 \u003cb class=\"key\">도움\u003c/b>을 제안하는 내용입니다. 혼자가 아니라 \u003cb class=\"key\">함께\u003c/b>한다는 사실이 Nellie에게 큰 힘이 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">장소의 전치사구\u003c/span> : next to + 명사(구) : \"친구 옆에서\"\u003c/div>\u003c/div>","segs":[{"n":61,"text":"She would ride, 그녀는 타려고 했다. next to her friend, 자기 친구 옆에서.. 이 문장 전체를 해석하면, 그녀는 자기 친구 옆에서 (자전거를) 타려고 했다.","hl":"m"},{"n":62,"text":"친구가 또 사고가 날까 봐 불안해하지 않도록 Gaby가 바로 옆에서 같이 가주겠다고 약속하는 장면이에요. 진정한 친구의 배려와 우정을 엿볼 수 있는 대목이죠.","hl":"mn"},{"n":63,"text":"표현 중에 next to는 누구 옆에라는 뜻으로 쓰였는데요. Gaby가 Nellie의 바로 옆에서 주행하며 심리적인 안정감을 주겠다는 구체적인 계획을 설명하고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 18 / 26\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Nellie는 아무것도 없었다\u003c/span>\u003cspan class=\"en\">Nellie had \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">nothing \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">두려워할.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">fear\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Nellie는 두려울 것이 없었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Gaby의 든든한 지원 덕분에 Nellie가 느끼던 \u003cb class=\"key\">공포\u003c/b>가 해소되었음을 보여줍니다. 이후 문장에서 Nellie가 다시 자전거에 올라타게 되는 \u003cb class=\"key\">결정적 \u003c/b>\u003cb class=\"key\">이유\u003c/b>가 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : nothing (대명사) + to부정사 : \"두려워할 것\"\u003c/div>\u003c/div>","segs":[{"n":64,"text":"Nellie had nothing, Nellie는 아무것도 없었다. to fear, 두려워할.. 이 문장 전체를 해석하면, Nellie는 두려울 것이 없었다.","hl":"m"},{"n":65,"text":"Gaby가 옆에 있기로 했으니 이제 Nellie에게는 무서워할 이유가 전혀 없다는 뜻이에요. 이 문장은 Nellie가 다시 용기를 내어 자전거에 올라타게 되는 결정적인 계기를 보여줍니다.","hl":"mn"},{"n":66,"text":"nothing 뒤에 나오는 to fear를 주목해 보세요. 이 to부정사가 명사인 nothing을 뒤에서 꾸며주는 형용사 역할을 해서 두려워할 것이라는 의미를 완성하고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 19 / 26\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">&quot;너는\u003c/span>\u003cspan class=\"en\">&quot;You\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">할 수 있어,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">do\u003c/span> it,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">넬리야.&quot;\u003c/span>\u003cspan class=\"en\">Nellie.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“Nellie, 넌 할 수 있어.”\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Gaby가 Nellie에게 용기를 북돋워 주는 \u003cb class=\"key\">직접 \u003c/b>\u003cb class=\"key\">화법\u003c/b>의 문장으로, 사고 후 위축된 Nellie의 \u003cb class=\"key\">자신감\u003c/b>을 회복시키는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 + 동사원형\u003c/span> : can [조동사] + do [동사원형] : \"할 수 있다\"\u003c/div>\u003c/div>","segs":[{"n":67,"text":"\"You, \"너는. can do it, 할 수 있어. Nellie.\", 넬리야.\". 이 문장 전체를 해석하면, “Nellie, 넌 할 수 있어.”","hl":"m"},{"n":68,"text":"사고 때문에 겁먹은 넬리에게 가비가 힘을 주는 장면이죠. 이 말 한마디가 넬리가 포기하지 않게 만드는 중요한 계기가 됩니다.","hl":"mn"},{"n":69,"text":"여기서는 아주 기본적인 조동사의 쓰임을 볼까요? 조동사 can 뒤에 동사원형 do가 쓰여서 넬리의 능력을 강조하고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 20 / 26\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그런 모든 격려를 받고,\u003c/span>\u003cspan class=\"en\">With all that encouragement,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 누가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지 않겠는가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다시 시도하는 것을?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">try\u003c/span> again?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그런 격려를 받고, 누가 다시 시도하지 않을 것인가?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> \u003cb class=\"key\">수사 \u003c/b>\u003cb class=\"key\">의문문\u003c/b> 형식을 빌려, 친구의 진심 어린 격려가 있다면 \u003cb class=\"key\">누구라도\u003c/b> 다시 도전할 용기를 낼 수 있음을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수사 의문문\u003c/span> : who [의문사] + would [조동사] + not [부정어] + try [동사원형] : \"누가 시도하지 않겠는가(누구든 시도할 것이다)\"\u003c/div>\u003c/div>","segs":[{"n":70,"text":"With all that encouragement, 그런 모든 격려를 받고. who, 그 누가. would not, 하지 않겠는가. try again?, 다시 시도하는 것을?. 이 문장 전체를 해석하면, 그런 격려를 받고, 누가 다시 시도하지 않을 것인가?","hl":"m"},{"n":71,"text":"가비의 응원이 정말 큰 힘이 되었다는 걸 보여줍니다. 실제로 질문하는 게 아니라 누구나 당연히 다시 시도할 거라는 걸 강조하는 표현이에요.","hl":"mn"},{"n":72,"text":"이 문장은 수사 의문문이라는 점에 주목하세요. 의문사 who와 조동사 would가 쓰인 의문문 형태지만, 실제로는 모든 사람이 다시 시도할 것이라는 강한 확신을 나타냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 21 / 26\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서, 넬리는\u003c/span>\u003cspan class=\"en\">So, Nellie\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다시 올라탔다\u003c/span>\u003cspan class=\"en\">got back\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자전거에\u003c/span>\u003cspan class=\"en\">on the bike\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고\u003c/span>\u003cspan class=\"en\">and\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">페달 밟기를 계속했다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">continued \u003c/span>\u003cspan class=\"tgt\">pedaling\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그래서 Nellie는 자전거에 다 시 올라타서 계속 페달을 밟았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 격려에 힘입어 넬리가 \u003cb class=\"key\">두려움\u003c/b>을 이겨내고 행동을 지속하는 \u003cb class=\"key\">긍정적 \u003c/b>\u003cb class=\"key\">변화\u003c/b>를 묘사합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">continue의 목적어(동명사)\u003c/span> : continue [동사] + pedaling [동명사/목적어] : \"페달 밟기를 계속했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">동사의 병렬 구조\u003c/span> : got [동사1] + back ... + and [접속사] + continued [동사2] : \"다시 올라타서 그리고 계속했다\"\u003c/div>\u003c/div>","segs":[{"n":73,"text":"So, Nellie, 그래서, 넬리는. got back, 다시 올라탔다. on the bike, 자전거에. and, 그리고. continued pedaling, 페달 밟기를 계속했다.. 이 문장 전체를 해석하면, 그래서 Nellie는 자전거에 다 시 올라타서 계속 페달을 밟았다.","hl":"m"},{"n":74,"text":"가비의 격려 덕분에 넬리가 드디어 행동으로 옮기기 시작했어요. 포기하고 싶었던 마음을 이겨낸 중요한 행동의 변화입니다.","hl":"mn"},{"n":75,"text":"첫 번째로 보실 점은 병렬 구조예요. 과거형 동사인 got back과 continued가 and로 묶여서 일어난 일들을 차례로 말해주고 있죠. 두 번째 포인트는 continue의 목적어인 pedaling입니다. 계속해서 무엇을 하는 중인지를 나타내는 동명사 형태가 쓰였어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 22 / 26\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀의 코는\u003c/span>\u003cspan class=\"en\">Her nose\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">느낌이 별로 좋지 않았다\u003c/span>\u003cspan class=\"en\">did not feel so good\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시원한 바람이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">cool \u003c/span>\u003cspan class=\"tgt\">breeze \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">얼굴을 스쳐 불면서.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">blowing\u003c/span> across her face.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">시원한 바람이 얼굴을 스쳐 불면서 그녀의 코는 느낌이 별로 좋지 않았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 넘어져 코를 다친 탓에 \u003cb class=\"key\">시원한 \u003c/b>\u003cb class=\"key\">바람\u003c/b>이 상처 부위에 닿는 것만으로도 \u003cb class=\"key\">통증\u003c/b>을 느끼는 상태를 묘사합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">with + 목적어 + 분사 (부대상황)\u003c/span> : with + [목적어] + [현재분사(v-ing)] : \"시원한 바람이 불면서\"\u003c/div>\u003c/div>","segs":[{"n":76,"text":"Her nose, 그녀의 코는. did not feel so good, 느낌이 별로 좋지 않았다. with the cool breeze, 시원한 바람이. blowing across her face, 얼굴을 스쳐 불면서.. 이 문장 전체를 해석하면, 시원한 바람이 얼굴을 스쳐 불면서 그녀의 코는 느낌이 별로 좋지 않았다.","hl":"m"},{"n":77,"text":"넬리가 앞에서 자전거를 타다 넘어져서 코를 다쳤잖아요. 그래서 평소라면 기분 좋았을 시원한 바람조차 다친 상처에는 통증으로 느껴지는 상황을 보여주는 장면이에요.","hl":"mn"},{"n":78,"text":"여기서는 전치사 with 뒤에 명사와 분사가 함께 나오는 부대상황 구문을 주목해야 해요. 바람이 직접 부는 능동적인 동작을 강조하고 있기 때문에 현재분사인 blowing을 쓴 것이 핵심이랍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 23 / 26\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들에게는 더 이상의 사건이 없었고\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">no \u003c/span>\u003cspan class=\"tgt\">further \u003c/span>\u003cspan class=\"tgt\">incidents \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">남은 여행 동안\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">rest \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">trip \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">좋은 하루를 즐겼다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">enjoyed\u003c/span> a good day.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들에게는 남은 여행 동안 더 이상의 사건이 없었고 좋은 하루를 즐겼다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 충돌 사고라는 위기를 넘긴 후, 더 이상의 \u003cb class=\"key\">돌발 \u003c/b>\u003cb class=\"key\">상황\u003c/b> 없이 여행을 무사히 마치는 \u003cb class=\"key\">긍정적인 \u003c/b>\u003cb class=\"key\">결말\u003c/b>의 흐름을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사의 병렬 구조\u003c/span> : 동사1 [had] + [목적어] + and + 동사2 [enjoyed] : \"사건이 없었고 즐겼다\"\u003c/div>\u003c/div>","segs":[{"n":79,"text":"They had no further incidents, 그들에게는 더 이상의 사건이 없었고. for the rest of the trip, 남은 여행 동안. and enjoyed a good day, 좋은 하루를 즐겼다.. 이 문장 전체를 해석하면, 그들에게는 남은 여행 동안 더 이상의 사건이 없었고 좋은 하루를 즐겼다.","hl":"m"},{"n":80,"text":"넬리가 사고를 겪었지만 친구 가비의 응원 덕분에 포기하지 않았죠. 그 결과 남은 일정 동안에는 아무런 돌발 상황 없이 즐겁게 여행을 마무리했다는 내용이에요.","hl":"mn"},{"n":81,"text":"이 문장에서는 접속사 and를 중심으로 동사 had와 enjoyed가 나란히 연결된 병렬 구조를 확인해야 해요. 과거에 일어난 일들이니 두 동사 모두 과거 시제로 맞춰준 점을 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 24 / 26\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지친 두 소녀가 기숙사로 페달을 밟아 돌아왔고,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Two \u003c/span>\u003cspan class=\"tgt\">tired \u003c/span>\u003cspan class=\"tgt\">girls\u003c/span> pedaled back to the dorm,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그곳에서\u003c/span>\u003cspan class=\"en\">and there\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여자 사감은 Nellie와 몇 마디 이야기를 나누었다\u003c/span>\u003cspan class=\"en\">the housemother had a few words with Nellie\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀의 부은 코에 대해.\u003c/span>\u003cspan class=\"en\">about her \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">swollen \u003c/span>\u003cspan class=\"tgt\">nose\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">지친 두 소녀가 기숙사로 페달을 밟아 돌아왔고, 그곳에서 여자 사감은 Nellie의 부은 코에 대해 그녀와 몇 마디 이야기를 나누었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 여행을 마치고 돌아온 뒤, \u003cb class=\"key\">사감 \u003c/b>\u003cb class=\"key\">선생님\u003c/b>이 넬리의 상처를 발견하고 걱정스럽게 \u003cb class=\"key\">대화\u003c/b>를 나누는 상황입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사의 명사 수식\u003c/span> : 과거분사 [tired] + 명사 [girls] : \"지친 두 소녀\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사의 명사 수식\u003c/span> : 과거분사 [swollen] + 명사 [nose] : \"부은 코\"\u003c/div>\u003c/div>","segs":[{"n":82,"text":"Two tired girls pedaled back to the dorm, 지친 두 소녀가 기숙사로 페달을 밟아 돌아왔고. and there, 그곳에서. the housemother had a few words with Nellie, 여자 사감은 Nellie와 몇 마디 이야기를 나누었다. about her swollen nose, 그녀의 부은 코에 대해.. 이 문장 전체를 해석하면, 지친 두 소녀가 기숙사로 페달을 밟아 돌아왔고, 그곳에서 여자 사감은 Nellie의 부은 코에 대해 그녀와 몇 마디 이야기를 나누었다.","hl":"m"},{"n":83,"text":"하루 일과를 마치고 돌아왔을 때 사감 선생님이 넬리의 얼굴을 보고 무슨 일이 있었는지 걱정하며 물어보시는 장면이에요. 넬리의 코가 상당히 부어있었음을 짐작할 수 있죠.","hl":"mn"},{"n":84,"text":"여기서는 분사가 명사를 꾸며주는 두 군데를 잘 보세요. 첫 번째는 지치게 된 소녀들을 뜻하는 tired이고, 두 번째는 부어오른 상태가 된 코를 뜻하는 과거분사 swollen이에요. 모두 수동이나 완료의 상태를 설명하고 있답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 25 / 26\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 올라탔고\u003c/span>\u003cspan class=\"en\">She \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">gotten \u003c/span>\u003cspan class=\"tgt\">on\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 자전거에,\u003c/span>\u003cspan class=\"en\">the bike,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 페달을 밟았으며,\u003c/span>\u003cspan class=\"en\">pedaled,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 그리고 떨어졌다.\u003c/span>\u003cspan class=\"en\">and fell off.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 자전거에 올라 페달을 밟다가 떨어졌다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 넘어졌던 사건을 요약하며 주인공이 겪은 \u003cb class=\"key\">시행착오\u003c/b>를 보여주는 문장입니다. 비록 실패했지만 자전거를 다시 타려고 했던 주인공의 \u003cb class=\"key\">도전\u003c/b>을 의미합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거완료 (대과거)\u003c/span> : had + 과거분사(p.p.) : \"올라탔었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">동사의 병렬 구조\u003c/span> : V1, V2, and V3 : \"올라타고, 페달을 밟고, 그리고 떨어졌다\"\u003c/div>\u003c/div>","segs":[{"n":85,"text":"She had gotten on, 그녀는 올라탔고.  the bike,  자전거에.  pedaled,  페달을 밟았으며.  and fell off,  그리고 떨어졌다.. 이 문장 전체를 해석하면, 그녀는 자전거에 올라 페달을 밟다가 떨어졌다.","hl":"m"},{"n":86,"text":"이 문장은 주인공 넬리가 겪은 과정을 담백하게 요약하고 있어요. 비록 결과는 넘어지는 것이었지만 그 과정 자체에 의미가 있음을 시행착오라는 단어로 보여줍니다.","hl":"mn"},{"n":87,"text":"첫 번째로 had gotten on은 과거 시점보다 먼저 일어난 동작을 나타내는 과거완료 시제예요. 대과거라고도 하죠. 두 번째로 쉼표와 접속사 and를 사용해 세 가지 동작을 연결한 병렬 구조를 확인하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 26 / 26\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 그녀는 \u003c/span>\u003cspan class=\"en\">But she\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 해냈다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">done \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 그녀는 해냈다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 넘어진 사실보다 끝까지 포기하지 않고 여정을 마쳤다는 \u003cb class=\"key\">성취감\u003c/b>을 강조하는 결말입니다. 어려움에도 \u003cb class=\"key\">포기하지 \u003c/b>\u003cb class=\"key\">않는\u003c/b> 태도가 중요함을 시사합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거완료 (완료)\u003c/span> : had + done [동사] + it [목적어] : \"그것을 해냈었다\"\u003c/div>\u003c/div>","segs":[{"n":88,"text":"But she, 하지만 그녀는. had done it, 그것을 해냈다.. 이 문장 전체를 해석하면, 하지만 그녀는 해냈다.","hl":"m"},{"n":89,"text":"넘어진 사실보다 끝까지 포기하지 않고 자전거 여행을 마쳤다는 성취감을 강조하는 결말이에요. 어떤 어려움에도 포기하지 않는 마음이 중요함을 시사하죠.","hl":"mn"},{"n":90,"text":"여기서 had done it 역시 과거완료 시제를 사용하여 결과적으로 그 일을 완수했음을 완료의 의미로 강조하고 있습니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>자전거 \u003cb class=\"key\">초보자\u003c/b>인 Nellie는 여행 전 걱정이 많았으나 Gaby의 응원을 받으며 출발했습니다.\u003c/li>\u003cli>주행 중 갑작스러운 \u003cb class=\"key\">공포심\u003c/b>으로 인해 벽에 부딪혀 부상을 입고 심리적으로 위축되었습니다.\u003c/li>\u003cli>포기하고 \u003cb class=\"key\">기숙사\u003c/b>로 돌아가려던 Nellie는 Gaby의 진심 어린 \u003cb class=\"key\">격려\u003c/b>로 다시 용기를 냈습니다.\u003c/li>\u003cli>결국 포기하지 않고 페달을 밟아 남은 여행을 무사히 마치며 \u003cb class=\"key\">성취감\u003c/b>을 얻었습니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>A friend's warm encouragement can empower someone to overcome physical pain and mental fear.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">자전거 초보자인 Nellie가 여행 중 사고를 당해 포기하고 싶어 했으나, 친구 Gaby의 진심 어린 \u003cb class=\"key\">격려\u003c/b>를 통해 두려움을 이겨내고 끝까지 \u003cb class=\"key\">완주\u003c/b>하는 과정을 보여줍니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":91,"text":"오늘 지문을 통해 우리는 실패보다 더 무서운 것은 포기하려는 마음이며, 그 마음을 잡아주는 것은 주변의 따뜻한 격려라는 사실을 배웠습니다. 여러분도 공부하다 힘들 때 오늘 Nellie가 다시 페달을 밟았던 장면을 떠올려 보세요. 오늘 수업은 여기서 마치겠습니다. 수고하셨습니다!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
