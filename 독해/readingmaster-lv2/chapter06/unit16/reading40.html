<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터2 Reading40 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터2 Reading40","audioDir":"reading40_audio","preview":false,"count":79,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.668em\">Reading\u003cbr>40\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터 레벨2\u003c/div>\u003ch1>The Courage to Speak for Equality: A Father's Legacy\u003c/h1>\u003ch2>평등을 위해 목소리를 낼 용기: 아버지의 유산\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>1920년대 \u003cb class=\"key\">인종 \u003c/b>\u003cb class=\"key\">차별\u003c/b>이 극심했던 미국 남부에서 고등학생 신분으로 \u003cb class=\"key\">평등\u003c/b>을 외쳤던 아버지의 용기 있는 연설과 그가 평생 지켜온 \u003cb class=\"key\">삶의 \u003c/b>\u003cb class=\"key\">원칙\u003c/b>에 관한 이야기입니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>True courage is acting on one's convictions and thinking independently even in the face of fear and social opposition.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 1920년대 미국 남부의 차가운 현실 속에서 뜨거운 용기를 보여준 한 아버지의 이야기를 함께 읽어볼 거예요. 이 글은 화자가 우연히 발견한 낡은 연설문을 통해 아버지의 고귀한 신념과 삶의 태도를 배우게 되는 감동적인 수필입니다. 우리는 이 글을 통해 진정한 용기란 무엇인지, 그리고 우리 삶에서 무엇이 정말 중요한지를 생각해보게 될 거예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">1920년대 미국 남부, 특히 테네시(Tennessee)주는 \u003cb class=\"key\">짐 \u003c/b>\u003cb class=\"key\">크로 \u003c/b>\u003cb class=\"key\">법\u003c/b>(Jim Crow laws)이라는 강력한 \u003cb class=\"key\">인종 \u003c/b>\u003cb class=\"key\">분리\u003c/b> 정책이 지배하던 곳이었습니다. 당시 흑인과 백인은 모든 공공장소에서 철저히 격리되었으며, 흑인의 권리를 옹호하는 것은 사회적으로 매우 위험한 행동으로 간주되었습니다. 마치 \u003cb class=\"key\">불구덩이\u003c/b> 속으로 뛰어드는 것과 같은 위험을 무릅쓰고, 글의 아버지는 인종 평등이라는 가치를 내세운 것입니다. 이 지역을 흔히 \u003cb class=\"key\">Deep \u003c/b>\u003cb class=\"key\">South\u003c/b>라고 부르는데, 이는 미국 남부에서도 보수적 색채와 차별이 가장 강했던 지역을 의미합니다. 이러한 배경 속에서 고등학생이 평등을 외쳤다는 것은 단순한 발표를 넘어 \u003cb class=\"key\">목숨을 \u003c/b>\u003cb class=\"key\">건 \u003c/b>\u003cb class=\"key\">도전\u003c/b>이었음을 이해해야 합니다.\u003c/div>","segs":[{"n":2,"text":"글의 배경이 되는 1920년대 미국 테네시주는 인종 차별이 법적으로 정당화되던 Deep South 지역이었어요. 흑인과 백인을 엄격히 나누는 인종 분리 정책이 시행되던 시기라 흑인의 인권을 말하는 것 자체가 목숨을 걸어야 할 만큼 위험한 일이었죠. 마치 날카로운 칼날 위를 걷는 것 같은 상황에서, 고등학생이었던 아버지가 평등을 외쳤다는 건 정말 대단한 일이에요. 당시의 이런 폐쇄적이고 억압적인 사회 분위기를 머릿속에 그리며 지문을 읽어 내려가면 훨씬 깊이 있게 이해할 수 있습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>우연한 발견\u003csmall>도입 · 문장 1–8\u003c/small>\u003c/h4>\u003cp>17세가 된 화자가 아버지의 서재를 정리하던 중, 녹슨 클립에 고정된 낡은 \u003cb class=\"key\">연설문\u003c/b>을 발견하고 읽다가 \u003cb class=\"key\">눈물\u003c/b>을 흘립니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>놀라운 과거\u003csmall>배경 · 문장 9–11\u003c/small>\u003c/h4>\u003cp>1920년 테네시주에서 고등학생이었던 아버지가 \u003cb class=\"key\">인종 \u003c/b>\u003cb class=\"key\">평등\u003c/b>을 주장했다는 사실과 그 \u003cb class=\"key\">용기\u003c/b>에 화자는 크게 감탄합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>딸의 의문\u003csmall>질문 · 문장 12–14\u003c/small>\u003c/h4>\u003cp>당시의 삼엄한 사회 분위기 속에서 어떻게 \u003cb class=\"key\">허락\u003c/b>을 받고 연설을 했는지, \u003cb class=\"key\">두려움\u003c/b>은 없었는지 아버지에게 묻습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>아버지의 신념\u003csmall>주장 및 근거 · 문장 15–21\u003c/small>\u003c/h4>\u003cp>아버지는 허락 대신 \u003cb class=\"key\">스스로에 \u003c/b>\u003cb class=\"key\">대한 \u003c/b>\u003cb class=\"key\">질문\u003c/b>을 던졌으며, 청중이 모두 떠난 뒤에도 \u003cb class=\"key\">주체적 \u003c/b>\u003cb class=\"key\">사고\u003c/b>와 \u003cb class=\"key\">생존\u003c/b>이라는 두 가지 삶의 원칙을 세웠음을 들려줍니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>존경과 인정\u003csmall>결론 · 문장 22\u003c/small>\u003c/h4>\u003cp>화자는 아버지가 그 두 가지 \u003cb class=\"key\">삶의 \u003c/b>\u003cb class=\"key\">약속\u003c/b>을 모두 지켜내셨음을 인정하며 이야기가 \u003cb class=\"key\">감동적\u003c/b>으로 마무리됩니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 연설문의 발견에서 시작해 아버지의 과거 회상과 현재의 인정을 담은 시간 순서대로 진행됩니다.","hl":null},{"n":4,"text":"첫 번째 단계인 첫 번째 문장에서 여덟 번째 문장까지는, 화자가 17세 때 아버지의 서재에서 우연히 낡고 녹슨 클립이 끼워진 연설문을 발견하는 장면입니다. 그 내용을 읽고 화자는 깊은 감동을 느껴 눈물을 흘리게 되죠.","hl":"f0"},{"n":5,"text":"두 번째 단계인 아홉 번째 문장에서 열한 번째 문장에서는 그 연설문의 정체가 드러납니다. 1920년이라는 아주 옛날에, 인종 차별이 심했던 남부에서 고등학생이었던 아버지가 아프리카계 미국인의 평등을 요구했다는 사실에 화자는 경탄하며 궁금증을 갖게 됩니다.","hl":"f1"},{"n":6,"text":"세 번째 단계인 열두 번째 문장에서 열네 번째 문장은 화자가 아버지에게 직접 질문을 던지는 부분입니다. 그 위험한 시절에 어떻게 연설 허가를 받았는지, 그리고 정말 무섭지는 않았는지를 묻는 장면이죠.","hl":"f2"},{"n":7,"text":"네 번째 단계인 열다섯 번째 문장에서 스물한 번째 문장에서는 아버지의 명답이 나옵니다. 아버지는 허락을 구하는 대신 세대의 시대적 과제를 스스로에게 물었고, 청중들이 다 나가버린 무대에서 평생 지켜야 할 두 가지 원칙인 스스로 생각하기와 살아남기를 결심하셨다고 말합니다.","hl":"f3"},{"n":8,"text":"마지막 다섯 번째 단계인 스물두 번째 문장에서 화자는 아버지가 그 두 가지 어려운 약속을 모두 멋지게 해내셨음을 인정하며 훈훈하게 글을 마무리합니다.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 21번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 과거의 \u003cb class=\"key\">에피소드\u003c/b>를 현재 시점에서 회상하며 대화 형식으로 풀어가는 \u003cb class=\"key\">서사적 \u003c/b>\u003cb class=\"key\">구성\u003c/b>을 취하고 있습니다. 전반부에서 연설문의 발견이라는 \u003cb class=\"key\">사건의 \u003c/b>\u003cb class=\"key\">계기\u003c/b>를 제시하고, 후반부 대화를 통해 글쓴이가 전달하고자 하는 핵심 가치인 \u003cb class=\"key\">독립적 \u003c/b>\u003cb class=\"key\">사고\u003c/b>를 강조하는 \u003cb class=\"key\">미괄식\u003c/b> 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Then (8)\u003c/b>\u003cspan>시간의 흐름 제시\u003c/span>\u003cb>I marvelled at (11)\u003c/b>\u003cspan>작가의 감정과 주제 의식 표출\u003c/span>\u003cb>I asked him (12)\u003c/b>\u003cspan>핵심 내용을 끌어내기 위한 질문\u003c/span>\u003cb>Well (15)\u003c/b>\u003cspan>답변의 시작\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">old papers\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a report of some kind\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a speech he had written\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the pages\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">this speech\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"이 글은 과거의 특정 사건을 회상하며 대화로 교훈을 이끌어내는 서사적인 구조를 가지고 있어요. 특히 마지막 부분에 이르러서야 아버지의 삶의 철학이 명확히 드러나는 미괄식 구성을 보여줍니다.","hl":"ty"},{"n":10,"text":"문장 곳곳에 있는 신호들을 살펴볼까요? 여덟 번째 문장의 Then은 사건의 전환을 보여주고, 열한 번째 문장의 marvelled at은 필자가 느낀 경외감을 직접적으로 드러내죠. 열두 번째 문장부터 시작되는 직접 인용구들은 아버지의 목소리를 통해 주제를 생생하게 전달하는 역할을 합니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>discover\u003c/b>\u003cem>동사\u003c/em>\u003cspan>발견하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>study\u003c/b>\u003cem>명사\u003c/em>\u003cspan>서재\u003c/span>\u003c/div>\u003cdiv>\u003cb>organize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>정리하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>paper clip\u003c/b>\u003cem>명사\u003c/em>\u003cspan>종이 클립\u003c/span>\u003c/div>\u003cdiv>\u003cb>rust\u003c/b>\u003cem>명사\u003c/em>\u003cspan>녹\u003c/span>\u003c/div>\u003cdiv>\u003cb>dust\u003c/b>\u003cem>동사\u003c/em>\u003cspan>더럽히다, 가루를 뿌리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>cover sheet\u003c/b>\u003cem>명사\u003c/em>\u003cspan>표지 겉장\u003c/span>\u003c/div>\u003cdiv>\u003cb>speech\u003c/b>\u003cem>명사\u003c/em>\u003cspan>연설(문)\u003c/span>\u003c/div>\u003cdiv>\u003cb>equality\u003c/b>\u003cem>명사\u003c/em>\u003cspan>평등\u003c/span>\u003c/div>\u003cdiv>\u003cb>African-American\u003c/b>\u003cem>명사\u003c/em>\u003cspan>아프리카계 미국인\u003c/span>\u003c/div>\u003cdiv>\u003cb>marvel at\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 경탄하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>courage\u003c/b>\u003cem>명사\u003c/em>\u003cspan>용기\u003c/span>\u003c/div>\u003cdiv>\u003cb>deep South\u003c/b>\u003cem>명사\u003c/em>\u003cspan>미국 최남부 지역\u003c/span>\u003c/div>\u003cdiv>\u003cb>separate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>분리하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>permission\u003c/b>\u003cem>명사\u003c/em>\u003cspan>허락, 허가\u003c/span>\u003c/div>\u003cdiv>\u003cb>scared\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>두려워하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>challenge\u003c/b>\u003cem>명사\u003c/em>\u003cspan>도전 과제\u003c/span>\u003c/div>\u003cdiv>\u003cb>generation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>세대\u003c/span>\u003c/div>\u003cdiv>\u003cb>immediately\u003c/b>\u003cem>부사\u003c/em>\u003cspan>즉시\u003c/span>\u003c/div>\u003cdiv>\u003cb>deliver\u003c/b>\u003cem>동사\u003c/em>\u003cspan>연설을 하다, 전달하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>audience\u003c/b>\u003cem>명사\u003c/em>\u003cspan>청중\u003c/span>\u003c/div>\u003cdiv>\u003cb>stand up\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>일어서다\u003c/span>\u003c/div>\u003cdiv>\u003cb>walk out\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>나가 버리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>stage\u003c/b>\u003cem>명사\u003c/em>\u003cspan>무대\u003c/span>\u003c/div>\u003cdiv>\u003cb>be sure to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>반드시 ~하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>think for oneself\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>스스로 생각하다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"여기서 deliver라는 단어를 주의 깊게 보세요. 보통 배달하다라고 알고 있지만, speech와 함께 쓰이면 연설을 하다라는 아주 중요한 뜻이 됩니다. 그리고 Deep South라는 표현은 단순히 남부 깊숙한 곳이 아니라, 역사적으로 인종 차별이 매우 심했던 지역을 상징하는 표현이라는 점도 기억하세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">courage\u003c/b>\u003cspan class=\"m\">용기\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">bravery\u003c/span>\u003cspan class=\"s\">valor\u003c/span>\u003cspan class=\"s\">fortitude\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">cowardice\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">equality\u003c/b>\u003cspan class=\"m\">평등\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">fairness\u003c/span>\u003cspan class=\"s\">impartiality\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">inequality\u003c/span>\u003cspan class=\"a\">discrimination\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">marvel\u003c/b>\u003cspan class=\"m\">놀라워하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">wonder\u003c/span>\u003cspan class=\"s\">admire\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">separate\u003c/b>\u003cspan class=\"m\">분리하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">segregate\u003c/span>\u003cspan class=\"s\">divide\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unite\u003c/span>\u003cspan class=\"a\">integrate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">immediately\u003c/b>\u003cspan class=\"m\">즉시\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">instantly\u003c/span>\u003cspan class=\"s\">promptly\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">gradually\u003c/span>\u003cspan class=\"a\">later\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어도 챙겨볼까요? courage는 bravery나 valor로 바꿔 쓸 수 있고, 비겁함을 뜻하는 cowardice와는 반대되는 개념이에요. 평등을 뜻하는 equality는 fairness와 비슷하지만 discrimination인 차별과는 정반대의 단어죠. separate는 분리하다라는 뜻으로 segregate와 동의어인데, 반대말인 unite나 integrate도 꼭 함께 외워두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 22\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내가 17살이었을 때,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When\u003c/span> I was 17,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 발견했다\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">discovered\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">놀라운 물건 하나를.\u003c/span>\u003cspan class=\"en\">a wonderful thing.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">내가 17살이었을 때, 나는 놀라운 물건 하나를 발견했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 필자가 17살 때 우연히 발견한 \u003cb class=\"key\">연설문\u003c/b>에 관한 이야기의 시작입니다. 글 전체의 배경이 되는 \u003cb class=\"key\">시간적 \u003c/b>\u003cb class=\"key\">배경\u003c/b>을 제시하며 독자의 궁금증을 유발합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간의 부사절 접속사\u003c/span> : When [접속사] + I [주어] + was [동사] : \"~할 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동사의 과거형\u003c/span> : discover + -ed : \"발견했다\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"When I was 17, 내가 17살이었을 때. I discovered, 나는 발견했다. a wonderful thing, 놀라운 물건 하나를.. 이 문장 전체를 해석하면, 내가 17살이었을 때, 나는 놀라운 물건 하나를 발견했다.","hl":"m"},{"n":14,"text":"이 문장은 이야기의 시작으로 필자가 겪은 특별한 경험의 시간적 배경을 알려줍니다. 필자가 발견한 놀라운 물건이 무엇인지 궁금해지게 만드는 도입부예요.","hl":"mn"},{"n":15,"text":"첫 번째 문법 포인트는 접속사 When입니다. 시간을 나타내는 접속사 When은 뒤에 주어와 동사가 오는 절을 이끌어 뭐뭐 할 때라고 해석합니다. 두 번째는 과거 시제 동사 discovered입니다. 필자가 17살 때라는 과거의 특정 시점에 일어난 일을 말하고 있으므로 과거형을 썼죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 22\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아버지와 나는\u003c/span>\u003cspan class=\"en\">My father and I\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">앉아 있었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">sitting\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바닥에\u003c/span>\u003cspan class=\"en\">on the floor\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 서재의.\u003c/span>\u003cspan class=\"en\">of his study.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">아버지와 나는 그의 서재 바닥에 앉아 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아버지와 함께 서재에서 서류를 정리하던 \u003cb class=\"key\">구체적 \u003c/b>\u003cb class=\"key\">상황\u003c/b>을 묘사합니다. \u003cb class=\"key\">study\u003c/b>는 '공부'가 아니라 '서재'라는 장소를 의미하는 명사로 쓰였습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거진행형\u003c/span> : be동사 과거형(were) + 현재분사(sitting) : \"앉아 있었다\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"My father and I, 아버지와 나는. were sitting, 앉아 있었다. on the floor, 바닥에. of his study, 그의 서재의.. 이 문장 전체를 해석하면, 아버지와 나는 그의 서재 바닥에 앉아 있었다.","hl":"m"},{"n":17,"text":"이 문장은 사건이 일어난 구체적 상황을 묘사하고 있어요. 여기서 study는 공부라는 뜻이 아니라 서재라는 장소를 뜻하는 명사로 쓰였다는 점에 꼭 주의하세요.","hl":"mn"},{"n":18,"text":"문법을 보면 were sitting이라는 과거진행형이 쓰였습니다. 비 동사의 과거형인 were와 현재분사 sitting이 합쳐져 과거 당시에 진행 중이던 동작을 생생하게 강조해줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 22\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는\u003c/span>\u003cspan class=\"en\">We\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정리하고 있었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">organizing\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 오래된 서류들을.\u003c/span>\u003cspan class=\"en\">his old papers.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 그의 오래된 서류들을 정리하고 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 과거의 기록을 \u003cb class=\"key\">정리하던 \u003c/b>\u003cb class=\"key\">중\u003c/b> 무언가를 발견하게 될 것임을 암시합니다. \u003cb class=\"key\">과거진행형\u003c/b> 시제를 사용하여 당시의 배경 상황을 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거진행형\u003c/span> : be동사 과거형(were) + 현재분사(organizing) : \"정리하고 있었다\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"We, 우리는. were organizing, 정리하고 있었다. his old papers, 그의 오래된 서류들을.. 이 문장 전체를 해석하면, 우리는 그의 오래된 서류들을 정리하고 있었다.","hl":"m"},{"n":20,"text":"아버지가 보관해온 오래된 기록들을 정리하던 중이었음을 나타내며 앞으로 일어날 발견을 암시합니다. 차분하게 서류를 정리하던 평범한 일상을 보여주고 있죠.","hl":"mn"},{"n":21,"text":"여기서도 어법 포인트는 과거진행형 시제인 were organizing입니다. 앞 문장과 마찬가지로 과거의 특정 시점에 무엇을 하고 있었는지를 마치 눈앞에서 보듯 생생하게 묘사하고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 22\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">카펫 건너에 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Across \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">carpet\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 보았다\u003c/span>\u003cspan class=\"en\">I saw\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">두꺼운 종이 클립을.\u003c/span>\u003cspan class=\"en\">a fat paper clip.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 카펫 건너에 있는 두꺼운 종이 클립을 보았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 서류 정리 중 우연히 발견한 물건을 묘사하며, 이야기의 발단이 되는 \u003cb class=\"key\">우연한 \u003c/b>\u003cb class=\"key\">발견\u003c/b>의 순간을 나타냅니다. 'fat'이라는 표현을 통해 클립이 집고 있는 종이 뭉치가 꽤 \u003cb class=\"key\">두툼함\u003c/b>을 암시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">장소의 부사구\u003c/span> : [전치사] + [명사구] : \"카펫 건너편에\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"Across the carpet, 카펫 건너에 있는. I saw, 나는 보았다. a fat paper clip, 두꺼운 종이 클립을.. 이 문장 전체를 해석하면, 나는 카펫 건너에 있는 두꺼운 종이 클립을 보았다.","hl":"m"},{"n":23,"text":"아버지가 예전에 쓴 연설문을 발견하게 되는 우연한 계기를 보여주는 문장입니다. 서류들 사이에서 유독 눈에 띄는 두툼한 물건을 발견하며 호기심을 자극하고 있죠.","hl":"mn"},{"n":24,"text":"첫 번째 포인트로 문장 맨 앞의 Across the carpet을 보세요. 장소를 나타내는 부사구인데, 이렇게 문장 앞에 써서 독자의 시선을 카펫 너머의 물건으로 자연스럽게 유도하고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 22\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것의 녹이\u003c/span>\u003cspan class=\"en\">Its rust\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더럽혔다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">dusted\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">표지 겉장 부분을\u003c/span>\u003cspan class=\"en\">the cover sheet\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일종의 보고서의.\u003c/span>\u003cspan class=\"en\">of a report of some kind.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것의 녹이 일종의 보고서의 표지 겉장 부분을 더럽혔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 클립에 생긴 녹을 통해 이 서류가 방치된 채 \u003cb class=\"key\">오랜 \u003c/b>\u003cb class=\"key\">세월\u003c/b>이 흘렀음을 시각적으로 보여줍니다. \u003cb class=\"key\">시간적 \u003c/b>\u003cb class=\"key\">배경\u003c/b>을 직접 설명하지 않고 사물의 상태로 간접 제시하는 표현입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사의 문맥적 의미\u003c/span> : [주어] + [타동사(과거형)] + [목적어] : \"가루를 뿌리듯 더럽혔다\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"Its rust, 그것의 녹이. dusted, 더럽혔다. the cover sheet, 표지 겉장 부분을. of a report of some kind, 일종의 보고서의.. 이 문장 전체를 해석하면, 그것의 녹이 일종의 보고서의 표지 겉장 부분을 더럽혔다.","hl":"m"},{"n":26,"text":"클립에 녹이 슬어 종이에 묻었다는 묘사를 통해 이 서류가 얼마나 오랜 시간 동안 그곳에 있었는지를 보여줍니다. 바로 세월의 흔적이라는 시간적 배경을 시각적으로 아주 잘 나타내고 있죠.","hl":"mn"},{"n":27,"text":"여기서 동사 dusted를 눈여겨봐야 합니다. 보통은 먼지를 털다라는 뜻으로 알고 있겠지만, 여기서는 녹 가루가 먼지처럼 쌓여서 표지를 더럽혔다는 의미로 쓰였어요. 사물이 주어로 쓰여서 상황을 묘사하는 방식입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 22\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 집어\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">picked \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">들었다 그것을.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">up\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 그것을 집어 들었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 필자가 발견한 대상에 대해 적극적인 \u003cb class=\"key\">관심\u003c/b>을 보이기 시작했음을 나타내는 동작입니다. 이 짧은 동작 이후 본격적인 \u003cb class=\"key\">내용 \u003c/b>\u003cb class=\"key\">확인\u003c/b>이 이루어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이어동사(타동사+부사)의 목적어 위치\u003c/span> : pick [동사] + it [대명사 목적어] + up [부사] : \"그것을 집어 들었다\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"I picked, 나는 집어. it up, 들었다 그것을.. 이 문장 전체를 해석하면, 나는 그것을 집어 들었다.","hl":"m"},{"n":29,"text":"아주 짧은 문장이지만 큰 의미가 있습니다. 필자가 단순히 발견하는 것에 그치지 않고 호기심을 가지고 행동에 옮겼음을 보여주죠. 이 행동이 뒤이어 나오는 감동적인 발견으로 이어집니다.","hl":"mn"},{"n":30,"text":"어법에서 정말 중요한 부분이 나왔네요. picked it up처럼 동사와 부사가 결합한 타동사구에서는 목적어가 it 같은 대명사일 때 반드시 그 사이에 들어가야 합니다. picked up it이라고 쓰면 틀리니까 주의하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 22\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 시작했다\u003c/span>\u003cspan class=\"en\">I started\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">읽는 것을.\u003c/span>\u003cspan class=\"en\"> 해석하면, 그것은 아버지가 Tennessee주에서 1920년에 썼던 연설문이었다.","hl":"m"},{"n":38,"text":"필자가 찾은 낡은 종이의 정체는 바로 아버지가 고등학생 때 썼던 연설문이었어요. 1920년의 테네시는 인종 분리법이 존재하던 시기라 이 배경이 아주 중요합니다.","hl":"mn"},{"n":39,"text":"이 문장에는 중요한 포인트가 두 개 있어요. 첫 번째로 speech와 he 사이에는 목적격 관계대명사가 생략되어 뒤에서 연설문을 꾸며주고 있죠. 두 번째로 had written이라는 과거완료 시제를 쓴 이유는 아버지가 연설문을 쓴 게 과거에 발견한 시점보다 훨씬 더 예전 일이라는 것을 나타내기 위해서예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 22\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당시, (아버지는) 겨우 17살이었고\u003c/span>\u003cspan class=\"en\">Then, \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">only \u003c/span>\u003cspan class=\"tgt\">17 \u003c/span>\u003cspan class=\"tgt\">himself \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고등학교를 졸업했을 때인데,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">graduating \u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">high \u003c/span>\u003cspan class=\"tgt\">school\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 요구했다\u003c/span>\u003cspan class=\"en\">he \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">called \u003c/span>\u003cspan class=\"tgt\">for\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아프리카계 미국인들을 위한 평등을\u003c/span>\u003cspan class=\"en\">equality for African-Americans.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">당시 (아버지는) 겨우 17살이었고 고등학교를 졸업했을 때인데, 그는 아프리카계 미국인들을 위한 평등을 요구했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 과거 연설문을 썼던 당시의 상황을 설명하며, \u003cb class=\"key\">인종 \u003c/b>\u003cb class=\"key\">차별\u003c/b>이 당연시되던 시대에 어린 나이에도 불구하고 \u003cb class=\"key\">평등\u003c/b>이라는 진보적인 가치를 주장했음을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">분사구문(부대상황)\u003c/span> : (Being) + 형용사/분사구문 : \"겨우 17살이었고 고등학교를 졸업했을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거완료\u003c/span> : had + p.p. (과거분사) : \"요구했다\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"Then, only 17 himself, 당시, (아버지는) 겨우 17살이었고. and graduating from high school, 고등학교를 졸업했을 때인데. he had called for, 그는 요구했다. equality for African-Americans, 아프리카계 미국인들을 위한 평등을. 이 문장 전체를 해석하면, 당시 (아버지는) 겨우 17살이었고 고등학교를 졸업했을 때인데, 그는 아프리카계 미국인들을 위한 평등을 요구했다.","hl":"m"},{"n":41,"text":"아버지가 연설문을 썼던 천구백이십 년 당시의 구체적인 상황을 보여줍니다. 아프리카계 미국인을 위해 평등을 목소리 높여 외쳤던 아버지의 정의로운 과거를 설명하는 대목이에요.","hl":"mn"},{"n":42,"text":"첫 번째 포인트로, 문장 앞에 접속사가 생략된 분사구문이 쓰였습니다. graduating이라는 현재분사가 당대의 상황을 생동감 있게 묘사하죠. 두 번째로 had called for는 과거완료 시제로, 과거의 시점보다 더 이전에 일어난 대과거를 나타냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 22\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 그의 용기에 놀라워했고\u003c/span>\u003cspan class=\"en\">I marvelled at his courage\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떻게 궁금했다\u003c/span>\u003cspan class=\"en\">and wondered how,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1920년에 그렇게 어리고 백인이었던 그가\u003c/span>\u003cspan class=\"en\">in 1920, so young, so white,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">최남부 지역에서,\u003c/span>\u003cspan class=\"en\">and in the deep South,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">법으로 흑인과 백인을 여전히 분리시켰던\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">where \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">law \u003c/span>\u003cspan class=\"tgt\">still \u003c/span>\u003cspan class=\"tgt\">separated \u003c/span>\u003cspan class=\"tgt\">black \u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">white\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그가 그것(연설)을 할 용기가 있었는지\u003c/span>\u003cspan class=\"en\">he had had \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">courage \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떻게 그것(연설)을 할\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">deliver \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 그의 용기에 놀라워했고 1920년에 법으로 흑인과 백인을 여전히 분리시켰던 최남부 지역에서, 그렇게 어리고 백인이었던 그가 어떻게 그것(연설)을 할 용기가 있었는지 궁금했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 인종 차별이 법으로 강제되던 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">배경\u003c/b>과 대비되는 아버지의 \u003cb class=\"key\">신념\u003c/b>과 용기에 대해 필자가 느끼는 깊은 \u003cb class=\"key\">경외감\u003c/b>을 서술하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계부사의 계속적 용법\u003c/span> : 선행사(the deep South) + , where + 완전한 문장 : \"그곳에서는 법으로 흑인과 백인을 여전히 분리시켰던\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : 명사(courage) + to부정사 : \"그것을 연설할 용기\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">간접의문문과 과거완료\u003c/span> : 의문사 + 주어 + 동사(had had) : \"어떻게 그가 용기를 가졌었는지\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"I marvelled at his courage, 나는 그의 용기에 놀라워했고. and wondered how, 어떻게 궁금했다. in 1920, so young, so white, 1920년에 그렇게 어리고 백인이었던 그가. and in the deep South, 최남부 지역에서. where the law still separated black from white, 법으로 흑인과 백인을 여전히 분리시켰던. he had had the courage, 그가 그것(연설)을 할 용기가 있었는지. to deliver it, 어떻게 그것(연설)을 할. 이 문장 전체를 해석하면, 나는 그의 용기에 놀라워했고 1920년에 법으로 흑인과 백인을 여전히 분리시켰던 최남부 지역에서, 그렇게 어리고 백인이었던 그가 어떻게 그것(연설)을 할 용기가 있었는지 궁금했다.","hl":"m"},{"n":44,"text":"아버지가 겪었을 위험을 짐작하게 합니다. 법적으로 흑백 분리가 엄격했던 남부 지역에서 백인 청년이 평등을 말한다는 것은 엄청난 위험을 무릅쓴 일이었기에, 필자는 그 용기의 원천을 궁금해하고 있어요.","hl":"mn"},{"n":45,"text":"첫 번째로, 콤마 뒤에 쓰인 관계부사 where가 최남부 지역이라는 장소에 대한 배경 설명을 덧붙여줍니다. 두 번째로 wondered의 목적어 자리에 how 주어 동사 어순의 간접의문문이 쓰였고, 과거완료인 had had가 사용된 점에 주목하세요. 마지막으로 to deliver는 courage를 꾸며주는 형용사적 용법입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 22\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 그에게 물었다\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">asked \u003c/span>\u003cspan class=\"tgt\">him \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것에 대해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">about \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 그에게 그것에 대해 물었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 연설문을 보고 느낀 호기심과 경외감을 바탕으로 아버지와 직접적인 \u003cb class=\"key\">대화\u003c/b>를 시작하게 되는 \u003cb class=\"key\">전환점\u003c/b> 역할을 하는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">4형식 같은 3형식 구문\u003c/span> : ask + 목적어 + about + 명사 : \"그에게 그것에 대해 묻다\"\u003c/div>\u003c/div>","segs":[{"n":46,"text":"I asked him, 나는 그에게 물었다. about it, 그것에 대해. 이 문장 전체를 해석하면, 나는 그에게 그것에 대해 물었다.","hl":"m"},{"n":47,"text":"이제 시선이 연설문에서 아버지에게로 옮겨갑니다. 궁금증을 참지 못하고 아버지에게 직접 질문을 던지며 본격적인 뒷이야기를 이끌어냅니다.","hl":"mn"},{"n":48,"text":"간결한 삼형식 문장입니다. 동사 ask 뒤에 물어보는 대상인 him이 오고, 궁금한 내용인 연설문에 대해서는 전치사 about을 사용하여 표현했습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 22\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“아빠,” 나는 말했다,  그에게 연설문을 넘겨주며,  “이 연설문이요― 어떻게 도대체 허락을 받았어요 그것을 할?&quot;\u003c/span>\u003cspan class=\"en\">&quot;Daddy,&quot; I said, \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">handing \u003c/span>\u003cspan class=\"tgt\">him \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">pages\u003c/span>, &quot;this speech―how did you ever get permission \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">give \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“아빠,” 나는 그에게 연설문을 넘겨주며 말했다. “이 연설문이요, 어떻게 그것(연설)을 할 허락을 받았어요?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 딸은 인종 차별이 심했던 과거에 아버지가 어떻게 그런 용감한 \u003cb class=\"key\">평등\u003c/b>에 관한 연설을 할 수 있었는지 \u003cb class=\"key\">의아함\u003c/b>과 존경심을 담아 묻고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재분사 (분사구문)\u003c/span> : handing [현재분사] + him [간접목적어] + the pages [직접목적어] : \"그에게 페이지들을 넘겨주며\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : permission [명사] + to give [to부정사구] : \"그것(연설)을 할\"\u003c/div>\u003c/div>","segs":[{"n":49,"text":"\"Daddy,\" I said, “아빠,” 나는 말했다. handing him the pages, 그에게 연설문을 넘겨주며. \"this speech―, “이 연설문이요―. how did you ever get permission, 어떻게 도대체 허락을 받았어요. to give it?\", 그것을 할?\". 이 문장 전체를 해석하면, “아빠,” 나는 그에게 연설문을 넘겨주며 말했다. “이 연설문이요, 어떻게 그것(연설)을 할 허락을 받았어요?","hl":"m"},{"n":50,"text":"주인공인 딸은 아버지가 쓴 연설문이 당시 사회적으로 얼마나 위험하고 파격적인 내용이었는지 깨닫고 놀라워하고 있어요. 그래서 누군가에게 공식적인 허락을 받은 것인지 묻고 있는 장면이죠.","hl":"mn"},{"n":51,"text":"어법 첫 번째 포인트는 handing입니다. 주어인 내가 연설문을 건네는 동작을 동시에 하고 있음을 나타내는 현재분사 구문이에요. 두 번째는 to give인데요. 명사인 permission을 뒤에서 수식하며 무엇을 할 허락인지 설명해 주는 형용사적 용법입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 22\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 \u003c/span>\u003cspan class=\"en\">And\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">두렵지 않았어요?&quot;\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">weren't \u003c/span>\u003cspan class=\"tgt\">you\u003c/span> scared?&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그리고 두렵지 않았어요?”\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 흑백 분리가 엄격했던 시절에 흑인의 평등을 주장하는 것이 얼마나 \u003cb class=\"key\">위험\u003c/b>한 일이었는지 알기에, 아버지의 \u003cb class=\"key\">감정 \u003c/b>\u003cb class=\"key\">상태\u003c/b>를 묻고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정의문문\u003c/span> : Be동사 과거 부정형(weren't) + 주어(you) : \"않았나요?\"\u003c/div>\u003c/div>","segs":[{"n":52,"text":"And, 그리고. weren't you scared?\", 두렵지 않았어요?\". 이 문장 전체를 해석하면, 그리고 두렵지 않았어요?”","hl":"m"},{"n":53,"text":"딸은 아버지가 겪었을 심리적 압박감을 걱정하며 묻고 있어요. 단순히 궁금해서 묻는 게 아니라 당연히 무서웠을 텐데 어떻게 견뎠는지 묻는 뉘앙스가 포함되어 있습니다.","hl":"mn"},{"n":54,"text":"여기서 weren't you는 부정의문문입니다. 아버지가 처했던 상황이 매우 위험했기 때문에, 당연히 두려웠을 것이라는 딸의 심리가 담겨 있는 강조 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 15 / 22\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“음, 얘야,”  그가 말했다,  “나는 구하지 않았어  허락을.&quot;\u003c/span>\u003cspan class=\"en\">&quot;Well, honey,&quot; he said, &quot;I didn't \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">ask \u003c/span>\u003cspan class=\"tgt\">for\u003c/span> permission.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“음, 얘야”, 그가 말했다. “나는 허락을 구하지 않았어.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아버지의 대답을 통해 그가 외부의 허락보다 자신의 \u003cb class=\"key\">내면적 \u003c/b>\u003cb class=\"key\">신념\u003c/b>에 따라 행동하는 \u003cb class=\"key\">주체적\u003c/b>인 인물임을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사구(구동사)\u003c/span> : ask [동사] + for [전치사] + 목적어 : \"~을 구하다, 요청하다\"\u003c/div>\u003c/div>","segs":[{"n":55,"text":"\"Well, honey,\", “음, 얘야,”. he said, 그가 말했다. \"I didn't ask, “나는 구하지 않았어. for permission.\", 허락을.\". 이 문장 전체를 해석하면, “음, 얘야”, 그가 말했다. “나는 허락을 구하지 않았어.","hl":"m"},{"n":56,"text":"이 짧은 대답에는 아버지의 강직한 성품이 드러납니다. 옳다고 믿는 일을 하기 위해 타인의 허락이 필요하지 않았다는 주체적인 태도를 보여주고 있어요.","hl":"mn"},{"n":57,"text":"ask for는 하나의 덩어리처럼 쓰여서 무엇을 요청하거나 구한다는 뜻을 가집니다. 남에게 허락을 구하기보다 스스로의 신념에 따라 행동했음을 보여주는 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 16 / 22\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 그저 나 자신에게 물었어,\u003c/span>\u003cspan class=\"en\">I just asked myself,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘무엇이 가장 중요한 도전 과제인가\u003c/span>\u003cspan class=\"en\">'What is the most important challenge\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 세대가 직면한?’\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">facing\u003c/span> my generation?'\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 그저 나 자신에게 물었어. ‘우리 세대가 직면한 가장 중요한 도전 과제는 무엇인가?’\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아버지가 외부의 허락을 구하기보다 스스로의 \u003cb class=\"key\">양심\u003c/b>에 따라 행동의 동기를 찾는 장면입니다. 자신의 시대가 해결해야 할 \u003cb class=\"key\">도전 \u003c/b>\u003cb class=\"key\">과제\u003c/b>가 무엇인지 본질적인 질문을 던지고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재분사의 후치 수식\u003c/span> : [명사] + [facing (현재분사구)] : \"직면한\"\u003c/div>\u003c/div>","segs":[{"n":58,"text":"I just asked myself, 나는 그저 나 자신에게 물었어. 'What is the most important challenge, ‘무엇이 가장 중요한 도전 과제인가. facing my generation?', 우리 세대가 직면한?’. 이 문장 전체를 해석하면, 나는 그저 나 자신에게 물었어. ‘우리 세대가 직면한 가장 중요한 도전 과제는 무엇인가?’","hl":"m"},{"n":59,"text":"아버지는 남들의 허락을 받는 것보다 자기 시대의 가장 큰 문제를 찾는 것이 더 중요하다고 생각했어요. 여기서 facing은 우리 세대가 마주하고 있는 도전 과제를 의미합니다.","hl":"mn"},{"n":60,"text":"첫 번째 포인트는 현재분사 facing입니다. 이 단어는 앞에 있는 challenge를 꾸며주는 형용사 역할을 하는데요. 도전 과제가 우리 세대와 마주하고 있는 능동의 관계이기 때문에 현재분사 형태를 사용했습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 17 / 22\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 알았지\u003c/span>\u003cspan class=\"en\">I knew\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바로.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">immediately\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 바로 알았지.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 질문에 대한 답을 고민할 필요도 없이 확신하고 있었음을 나타냅니다. 인종 차별이라는 시대적 \u003cb class=\"key\">모순\u003c/b>을 직시하고 있었다는 \u003cb class=\"key\">확신\u003c/b>을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부사의 동사 수식\u003c/span> : [동사] + [immediately (부사)] : \"즉시, 바로\"\u003c/div>\u003c/div>","segs":[{"n":61,"text":"I knew, 나는 알았지. immediately, 바로.. 이 문장 전체를 해석하면, 나는 바로 알았지.","hl":"m"},{"n":62,"text":"아버지는 자신이 해야 할 일을 이미 마음속으로 결정하고 있었던 거예요. 망설임 없는 확신이 느껴지는 짧고 강렬한 문장입니다.","hl":"mn"},{"n":63,"text":"여기서는 immediately라는 부사가 중요해요. 동사인 knew를 꾸며주면서, 깨달음이 일어난 시점이 즉각적이었다는 것을 강조하고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 18 / 22\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러고 나서 나는 스스로에게 물었어,\u003c/span>\u003cspan class=\"en\">Then I asked myself,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘그리고 내가 두려워하지 않는다면,\u003c/span>\u003cspan class=\"en\">'And \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">if \u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">weren't \u003c/span>\u003cspan class=\"tgt\">afraid, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것에 대해 무엇을 말할까\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">say\u003c/span> about it\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 연설에서?’&quot;\u003c/span>\u003cspan class=\"en\">in this speech?'&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“나는 그것을 썼어.\u003c/span>\u003cspan class=\"en\">&quot;I wrote it.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러고 나서 나는 스스로에게 물었어. ‘내가 두려워하지 않는다면, 내가 이 연설에서 그것에 대해 무엇을 말할까?’ “나는 그것(연설문)을 썼어.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 두려움을 극복하기 위해 사용한 \u003cb class=\"key\">가정법\u003c/b>적 사고방식을 보여줍니다. 자신의 \u003cb class=\"key\">진심\u003c/b>을 말하기 위해 스스로를 두려움이 없는 상태로 설정하고 \u003cb class=\"key\">용기\u003c/b>를 냈음을 알 수 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가정법 과거\u003c/span> : if + 주어 + [과거동사(were)], 주어 + [would/could + 동사원형] : \"만약 내가 두려워하지 않는다면, 무엇을 말할까\"\u003c/div>\u003c/div>","segs":[{"n":64,"text":"Then I asked myself, 그러고 나서 나는 스스로에게 물었어. 'And if I weren't afraid, ‘그리고 내가 두려워하지 않는다면. what would I say about it, 그것에 대해 무엇을 말할까. in this speech?'\", 이 연설에서?’\". \"I wrote it, “나는 그것을 썼어.. 이 문장 전체를 해석하면, 그러고 나서 나는 스스로에게 물었어. ‘내가 두려워하지 않는다면, 내가 이 연설에서 그것에 대해 무엇을 말할까?’ “나는 그것(연설문)을 썼어.","hl":"m"},{"n":65,"text":"당시 흑인 평등을 주장하는 것은 매우 위험하고 두려운 일이었어요. 하지만 아버지는 그 두려움이 없다고 가정했을 때 나올 수 있는 가장 정직한 목소리를 연설문에 담기로 결심한 것이죠.","hl":"mn"},{"n":66,"text":"이 문장은 서술형으로 나오기 아주 좋은 가정법 과거 문장입니다. if I 뒤에 was가 아니라 weren't를 쓴 점에 주의하세요. 그리고 주절에서도 will이 아니라 would를 써서 현재 사실과 반대되는 상황을 가정하고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 19 / 22\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 \u003c/span>\u003cspan class=\"en\">And\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 연설을 했지.\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">delivered\u003c/span> it.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그리고 연설을 했지.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아버지는 연설문을 작성하는 것에 그치지 않고, 청중 앞에서 자신의 생각을 당당히 \u003cb class=\"key\">실행\u003c/b>에 옮겼습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사의 시제와 의미\u003c/span> : deliver [동사 과거형] : \"연설을 했다\"\u003c/div>\u003c/div>","segs":[{"n":67,"text":"And, 그리고. I delivered it, 나는 연설을 했지.. 이 문장 전체를 해석하면, 그리고 연설을 했지.","hl":"m"},{"n":68,"text":"아버지가 단지 생각만 한 것이 아니라 그 생각을 대중 앞에서 실제로 실행에 옮겼음을 보여주는 문장이에요.","hl":"mn"},{"n":69,"text":"여기서 쓰인 deliver는 과거의 사실을 말해주기 위해 과거형으로 쓰였어요. 보통 배달하다는 뜻으로 많이 알지만, speech와 함께 쓰이면 연설을 행하다라는 뜻이 된다는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 20 / 22\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">(연설) 중간쯤 \u003c/span>\u003cspan class=\"en\">About half way through\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 고개를 들어 보았어 \u003c/span>\u003cspan class=\"en\">I looked up \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">see\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">교사, 학생, 학부모인 전체 청중이 \u003c/span>\u003cspan class=\"en\">the entire audience of teachers, students, and parents\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일어나서 나가 버리는 것을.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">stand \u003c/span>\u003cspan class=\"tgt\">up\u003c/span>―and walk out.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 (연설) 중간쯤 교사, 학생, 학부모인 전체 청중이 일어나서 나가 버리는 것을 바라보았어.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 당시 인종 차별이 극심했던 사회에서 아버지가 외친 \u003cb class=\"key\">평등\u003c/b>의 가치가 청중들에게 얼마나 큰 \u003cb class=\"key\">거부감\u003c/b>을 주었는지 보여주는 극적인 장면입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법 (결과)\u003c/span> : look up [동사] + to see [to부정사] : \"보게 되다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지각동사의 목적격 보어\u003c/span> : see [지각동사] + audience [목적어] + stand up [원형부정사] : \"일어나는 것\"\u003c/div>\u003c/div>","segs":[{"n":70,"text":"About half way through, (연설) 중간쯤. I looked up to see, 나는 고개를 들어 보았어. the entire audience of teachers, students, and parents, 교사, 학생, 학부모인 전체 청중이. stand up―and walk out, 일어나서 나가 버리는 것을.. 이 문장 전체를 해석하면, 나는 (연설) 중간쯤 교사, 학생, 학부모인 전체 청중이 일어나서 나가 버리는 것을 바라보았어.","hl":"m"},{"n":71,"text":"아버지가 평등을 주장하자 사람들이 모두 나가버리는 충격적인 상황이에요. 당시 사회가 변화를 얼마나 거부했는지 알 수 있죠.","hl":"mn"},{"n":72,"text":"첫 번째 포인트는 to see예요. 고개를 들어 보니 결과적으로 보게 되었다는 결과의 의미로 해석하면 자연스러워요. 두 번째는 stand up입니다. 지각동사 see의 목적격 보어로 동사원형이 쓰였고, 뒤에 나오는 walk out과 병렬 구조를 이루고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 21 / 22\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무대에 홀로 남아서 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Left \u003c/span>\u003cspan class=\"tgt\">alone\u003c/span> on the stage,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 마음속으로 생각했어, \u003c/span>\u003cspan class=\"en\">I thought to myself,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘그럼, 내 인생에서 두 가지만 확실히 하면 되겠어: \u003c/span>\u003cspan class=\"en\">'Well, I guess I need to be sure to do only two things with my life:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">계속 스스로를 생각할 것과 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">keep \u003c/span>\u003cspan class=\"tgt\">thinking\u003c/span> for myself,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">죽임을 당하지 않는 것.’&quot; \u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">get \u003c/span>\u003cspan class=\"tgt\">killed\u003c/span>.'&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 연설문을 내게 돌려주며 미소 지었다.\u003c/span>\u003cspan class=\"en\">He handed the speech back to me, and smiled.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">무대에 홀로 남아서 나는 마음속으로 생각했어, ‘그럼, 내 인생에서 두 가지만 확실히 하면 되겠어. 계속 스스로를 생각할 것과 죽임을 당하지 않는 것.’ 그는 연설문을 내게 돌려주며 미소 지었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 세상의 외면 속에서도 자신의 \u003cb class=\"key\">신념\u003c/b>을 지키겠다는 결연한 의지와, 생명의 위협이 따르는 \u003cb class=\"key\">엄혹한 \u003c/b>\u003cb class=\"key\">현실\u003c/b>을 동시에 암시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사구문 (수동)\u003c/span> : [Being (생략)] + Left [과거분사] + alone : \"홀로 남겨진 채\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">keep의 목적어 (동명사)\u003c/span> : keep [동사] + thinking [동명사] : \"계속 생각하는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">준동사의 부정과 수동\u003c/span> : not + [동사원형] + get [수동표현 동사] + p.p. : \"죽임을 당하지 않는 것\"\u003c/div>\u003c/div>","segs":[{"n":73,"text":"Left alone on the stage, 무대에 홀로 남아서. I thought to myself, 나는 마음속으로 생각했어. 'Well, I guess I need to be sure to do only two things with my life, ‘그럼, 내 인생에서 두 가지만 확실히 하면 되겠어:. keep thinking for myself, 계속 스스로를 생각할 것과. and not get killed.'\", 죽임을 당하지 않는 것.’\". He handed the speech back to me, and smiled, 그는 연설문을 내게 돌려주며 미소 지었다.. 이 문장 전체를 해석하면, 무대에 홀로 남아서 나는 마음속으로 생각했어, ‘그럼, 내 인생에서 두 가지만 확실히 하면 되겠어. 계속 스스로를 생각할 것과 죽임을 당하지 않는 것.’ 그는 연설문을 내게 돌려주며 미소 지었다.","hl":"m"},{"n":74,"text":"무대에 홀로 남은 아버지는 좌절하지 않고 오히려 자신의 주관을 지키며 살아남겠다는 인생의 신조를 세웠어요. 참 대단한 용기죠?","hl":"mn"},{"n":75,"text":"첫 번째 어법 포인트는 맨 앞의 Left alone이에요. 내가 무대에 홀로 남겨진 상황이라 과거분사로 시작하는 수동 분사구문을 썼어요. 두 번째는 keep thinking인데, keep은 동명사를 목적어로 쓴다는 걸 기억하세요. 마지막으로 not get killed에서는 부정어 not이 맨 앞에 온 점과 수동의 의미인 get p.p. 형태를 잘 보세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 22 / 22\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">&quot;아빠는 ~인 것 같아요\u003c/span>\u003cspan class=\"en\">&quot;You \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">seem \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 그 두 가지를 모두 해낸 것\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">done\u003c/span> both,&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">라고 나는 말했다.\u003c/span>\u003cspan class=\"en\">I said.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“아빠는 그 두 가지를 모두 해낸 것 같아요.”라고 나는 말했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아버지가 젊은 시절 세웠던 \u003cb class=\"key\">두 \u003c/b>\u003cb class=\"key\">가지 \u003c/b>\u003cb class=\"key\">목표\u003c/b>, 즉 스스로 생각하기와 무사히 살아남기를 모두 실현했다는 딸의 \u003cb class=\"key\">긍정적인 \u003c/b>\u003cb class=\"key\">평가\u003c/b>입니다. 과거의 신념을 굽히지 않고 인생을 잘 살아오신 아버지에 대한 \u003cb class=\"key\">존경과 \u003c/b>\u003cb class=\"key\">안도\u003c/b>를 담아 글을 마무리하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">완료 부정사\u003c/span> : seem + [to have + 과거분사(p.p.)] : \"~했던 것처럼 보이다\"\u003c/div>\u003c/div>","segs":[{"n":76,"text":"\"You seem, \"아빠는 ~인 것 같아요.  to have done both,\",  그 두 가지를 모두 해낸 것.  I said, 라고 나는 말했다.. 이 문장 전체를 해석하면, “아빠는 그 두 가지를 모두 해낸 것 같아요.”라고 나는 말했다.","hl":"m"},{"n":77,"text":"아버지가 젊은 시절 다짐했던 두 가지 목표가 있었죠. 바로 스스로 생각하기와 살아남기였는데, 딸이 보기엔 아버지가 그 약속을 정말 잘 지켜온 것 같다는 감동적인 마무리예요.","hl":"mn"},{"n":78,"text":"여기서 가장 중요한 어법은 seem 뒤에 나온 to have done이에요. 이것을 완료 부정사라고 부르는데, 지금 그렇게 보이는 시점보다 더 이전에 일어난 일을 말할 때 써요. 아버지가 지금까지 그 두 가지를 쭉 해오셨다는 의미를 담기 위해 완료 시제를 썼다는 점이 핵심이에요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>화자는 17세 때 아버지의 서재에서 1920년에 쓰인 \u003cb class=\"key\">인종 \u003c/b>\u003cb class=\"key\">평등\u003c/b>에 관한 용기 있는 연설문을 발견했습니다.\u003c/li>\u003cli>당시 미국 남부는 \u003cb class=\"key\">인종 \u003c/b>\u003cb class=\"key\">분리\u003c/b>가 극심했으나, 아버지는 고등학생의 신분으로 사회적 금기에 \u003cb class=\"key\">정면으로 \u003c/b>\u003cb class=\"key\">도전\u003c/b>했습니다.\u003c/li>\u003cli>아버지는 외부의 허락을 구하는 대신, 세대의 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">과제\u003c/b>와 자신의 \u003cb class=\"key\">진실한 \u003c/b>\u003cb class=\"key\">목소리\u003c/b>에 집중하며 연설을 강행했습니다.\u003c/li>\u003cli>청중이 떠나는 냉담한 반응 속에서도 아버지는 \u003cb class=\"key\">주체적 \u003c/b>\u003cb class=\"key\">사고\u003c/b>와 \u003cb class=\"key\">생존\u003c/b>이라는 삶의 두 가지 지표를 세우고 이를 평생 실천했습니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>True courage is acting on one's convictions and thinking independently even in the face of fear and social opposition.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">1920년대 \u003cb class=\"key\">인종 \u003c/b>\u003cb class=\"key\">차별\u003c/b>이 극심했던 미국 남부에서 고등학생 신분으로 \u003cb class=\"key\">평등\u003c/b>을 외쳤던 아버지의 용기 있는 연설과 그가 평생 지켜온 \u003cb class=\"key\">삶의 \u003c/b>\u003cb class=\"key\">원칙\u003c/b>에 관한 이야기입니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":79,"text":"오늘 우리는 한 장의 낡은 종이에서 시작된 위대한 삶의 이야기를 읽었습니다. 남들의 시선이나 사회적 압박에 굴하지 않고, 스스로 생각하며 자신의 신념을 지키는 것이 얼마나 가치 있는 일인지 느끼셨나요? 여러분도 인생에서 중요하다고 생각하는 가치를 찾고, 그것을 지킬 수 있는 용기를 가지길 바랍니다. 오늘 수업은 여기서 마칠게요. 수고하셨습니다!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
