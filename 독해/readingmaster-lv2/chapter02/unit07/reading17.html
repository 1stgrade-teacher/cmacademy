<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터2 Reading17 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터2 Reading17","audioDir":"reading17_audio","preview":false,"count":46,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.520em\">Reading17\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터2\u003c/div>\u003ch1>The Woman Who Named the Coronavirus\u003c/h1>\u003ch2>코로나바이러스에 이름을 붙인 여성\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>June Almeida는 대학 교육을 위한 돈이 없어 열여섯 살에 \u003cb class=\"key\">실험실 \u003c/b>\u003cb class=\"key\">기술자\u003c/b>가 되었지만, \u003cb class=\"key\">현미경\u003c/b>으로 바이러스를 촬영하는 최고 전문가가 되었다. 그녀는 최초로 인간 \u003cb class=\"key\">코로나바이러스\u003c/b>를 확인하고 이름을 붙였으며, 생물학 분야의 기여로 런던 대학에서 고등학교 때부터 원하던 학위를 마침내 받았다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Even without money for college, June Almeida became a top expert in virus imaging, identified the first human coronavirus, and finally received the university degrees she had wanted since high school.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 리딩마스터 투의 Reading Seventeen이에요. June Almeida라는 한 여성 과학자의 이야기인데요, 대학에 갈 돈이 없어서 실험실 기술자로 출발했지만 결국 코로나바이러스를 처음 발견한 사람이 된 이야기예요. 요약하면 이 지문은 가난이라는 벽을 기술과 노력으로 넘어선 인물의 일대기이고, 요지는 배움에 대한 열망이 결국 학위로 돌아왔다는 거예요. 그럼 차근차근 들어가 볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">코로나바이러스(coronavirus)는 표면에 왕관 모양의 돌기가 있는 바이러스예요. 영어 corona는 라틴어로 \u003cb class=\"key\">왕관\u003c/b>을 뜻하는데, 현미경 사진에서 이 돌기가 왕관처럼 보여서 붙은 이름이죠. 바이러스는 너무 작아서 눈으로 볼 수 없고 전자 현미경(electron microscope)으로 확대해야 겨우 모양이 드러나요. 사진이 흐리면 바이러스의 정체를 확인할 수 없으므로, 선명한 이미지를 잡아내는 기술은 \u003cb class=\"key\">바이러스학\u003c/b>의 핵심이 됩니다. 흐린 안경으로는 멀리 있는 글씨를 읽을 수 없듯이, 흐린 사진으로는 새로운 바이러스의 정체를 알 수 없는 거예요. 과거에는 대학을 나오지 않으면 연구직에 오르기 어려웠지만, June Almeida는 \u003cb class=\"key\">기술\u003c/b> 하나로 그 벽을 넘어섰어요.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식부터 짚어 볼게요. 코로나바이러스는 표면에 왕관 모양의 돌기가 있는 바이러스예요. corona는 라틴어로 왕관을 뜻하는데, 현미경 사진에서 그 돌기가 왕관처럼 보여서 붙은 이름이죠. 바이러스는 눈으로 볼 수 없을 만큼 작아서 전자 현미경으로 확대해야 겨우 모양이 드러나요. 그래서 사진이 흐리면 정체를 확인할 수 없고, 선명한 이미지를 잡아내는 기술이 바이러스학의 핵심이 됩니다. 흐린 안경으로는 멀리 있는 글씨를 읽을 수 없듯이, 흐린 사진으로는 새로운 바이러스의 정체를 알 수 없는 거예요. 과거에는 대학을 나오지 않으면 연구직에 오르기 어려웠지만, June Almeida는 기술 하나로 그 벽을 넘어섰답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>과학에 뛰어난 소녀\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>June Almeida는 스코틀랜드에서 1930년에 태어났고 학교에서 \u003cb class=\"key\">과학 \u003c/b>\u003cb class=\"key\">최고상\u003c/b>을 받을 만큼 뛰어났어요. 그런데 고등학교를 나온 뒤에도 과학 공부를 계속하기를 원했지만 \u003cb class=\"key\">대학 \u003c/b>\u003cb class=\"key\">교육\u003c/b>을 위한 돈이 없었죠. 재능은 충분한데 \u003cb class=\"key\">가정 \u003c/b>\u003cb class=\"key\">형편\u003c/b>이 따라주지 못한 상황, 여기서 이야기가 시작됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>실험실 기술자로 출발\u003csmall>전환 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>그래서 Almeida는 열여섯 살의 나이에 \u003cb class=\"key\">실험실 \u003c/b>\u003cb class=\"key\">기술자\u003c/b>로 직업을 얻었어요. 그 후 런던으로 이사했고, 그러고 나서 \u003cb class=\"key\">캐나다\u003c/b>로 자리를 옮겼죠. 대학 대신 현장을 택한 이 결정이 훗날 그녀의 \u003cb class=\"key\">경력\u003c/b>을 열어 주는 계기가 됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>최고 전문가로 성장\u003csmall>근거 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>캐나다에서 그녀는 \u003cb class=\"key\">현미경\u003c/b>을 이용해 바이러스를 찾아내고 자세한 사진을 만드는 일을 했어요. 그 단순해 보이는 일에서 그녀는 최고 \u003cb class=\"key\">전문가\u003c/b> 중 한 명이 되었죠. 학교 대신 실험실에서 \u003cb class=\"key\">실력\u003c/b>을 쌓은 셈입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>코로나바이러스 발견\u003csmall>결정적 성취 · 문장 8–10\u003c/small>\u003c/h4>\u003cp>1964년 런던에서 그녀는 정체를 알 수 없는 바이러스의 선명하고 깨끗한 사진을 만들고 그것을 \u003cb class=\"key\">코로나바이러스\u003c/b>라고 이름 붙였어요. 그것이 인간에게서 확인된 \u003cb class=\"key\">첫 \u003c/b>\u003cb class=\"key\">번째\u003c/b> 코로나바이러스였죠. 그 기여 때문에 런던 대학이 그녀에게 \u003cb class=\"key\">대학 \u003c/b>\u003cb class=\"key\">학위\u003c/b>를 수여했습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>늦게 돌아온 학위\u003csmall>결론 · 문장 11\u003c/small>\u003c/h4>\u003cp>마지막 문장에서 그녀는 고등학교 때부터 원했던 학위를 마침내 받았어요. 앞에서 대학 교육을 위한 돈이 없었다는 \u003cb class=\"key\">결핍\u003c/b>과 정확히 맞물리는 결말이죠. 그래서 이 글의 \u003cb class=\"key\">주제문\u003c/b>은 마지막 문장이 됩니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 다섯 단계로 나눠서 살펴볼게요.","hl":null},{"n":4,"text":"먼저 첫 단계예요. June Almeida는 스코틀랜드에서 태어나 학교에서 과학 최고상을 받을 만큼 뛰어난 학생이었어요. 그런데 고등학교를 나온 뒤 과학 공부를 계속하고 싶었지만 대학 교육을 위한 돈이 없었죠. 재능은 충분한데 가정 형편이 따라주지 못한 상황, 여기서 이야기가 시작됩니다.","hl":"f0"},{"n":5,"text":"그래서 그녀는 열여섯 살에 실험실 기술자로 직업을 얻어요. 그리고 런던으로 이사하고, 그러고 나서 캐나다로 자리를 옮기죠. 대학에 가지 못한 대신 현장을 선택한 이 결정이 훗날 그녀의 경력을 열어 주는 전환점이 됩니다.","hl":"f1"},{"n":6,"text":"캐나다에서 그녀는 현미경을 이용해 바이러스를 찾아내고 자세한 사진을 만드는 일을 해요. 남들이 하찮게 볼 수도 있는 이 일에서 그녀는 최고 전문가 중 한 명이 됩니다. 학교 대신 실험실에서 실력을 쌓은 셈이에요.","hl":"f2"},{"n":7,"text":"그리고 런던에서 그녀는 정체를 알 수 없는 바이러스의 선명하고 깨끗한 사진을 만들어 코로나바이러스라는 이름을 붙입니다. 그것이 인간에게서 확인된 첫 번째 코로나바이러스였어요. 이 기여 때문에 런던 대학이 그녀에게 대학 학위를 수여합니다.","hl":"f3"},{"n":8,"text":"마지막 문장에서 그녀는 고등학교 때부터 원했던 학위를 마침내 받아요. 앞에서 대학 교육을 위한 돈이 없었다는 결핍과 정확히 맞물리는 결말이죠. 그래서 이 글의 주제문은 마지막 문장이 됩니다.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 11번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글의 처음부터 마지막까지 사건이 시간의 흐름을 따라 배열된 \u003cb class=\"key\">시간순\u003c/b> 전개예요. 태어남, 취업, 이주, 발견, 수여가 차례로 이어지죠. 그리고 글의 주제는 마지막 문장에서 완성되므로 \u003cb class=\"key\">미괄식\u003c/b> 구조입니다. 그래서 \u003cb class=\"key\">신호어\u003c/b>인 was born, So, After that, Then, Due to, finally가 각 단계의 경계를 알려 줍니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>was born (1)\u003c/b>\u003cspan>시간의 시작\u003c/span>\u003cb>So (4)\u003c/b>\u003cspan>이유에 따른 결과\u003c/span>\u003cb>After that (5)\u003c/b>\u003cspan>시간의 이동\u003c/span>\u003cb>Then (8)\u003c/b>\u003cspan>사건의 전환\u003c/span>\u003cb>Due to (10)\u003c/b>\u003cspan>원인과 결과\u003c/span>\u003cb>finally (11)\u003c/b>\u003cspan>결론·마무리\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">wanted to continue her studies in science\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">took a job as a lab technician\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">became one of the best experts\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">created a sharp, clear picture\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">awarded her university degrees\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">received the degrees that she had wanted\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>고등학교 졸업 시점\u003c/th>\u003cth>1970~1971년 시점\u003c/th>\u003c/tr>\u003ctr>\u003ctd>대학 교육을 위한 돈이 없어 진학 포기\u003c/td>\u003ctd>생물학 분야 기여로 대학 학위 수여\u003c/td>\u003c/tr>\u003ctr>\u003ctd>실험실 기술자로 취업\u003c/td>\u003ctd>최초의 인간 코로나바이러스 발견\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과학 공부를 계속하고 싶은 열망\u003c/td>\u003ctd>고등학교 때부터 원했던 학위를 마침내 획득\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글은 시간순 전개 방식이에요. 태어남에서 시작해 취업, 이주, 성취, 수여로 시간이 흐르는 대로 사건이 이어지죠. 그리고 마지막 문장에서 글의 주제가 완성되는 미괄식 구조입니다. 그래서 읽을 때는 사건의 순서를 따라가면서 마지막 문장에 힘을 실어 주면 좋아요.","hl":"ty"},{"n":10,"text":"신호어를 눈여겨보세요. 첫 번째 문장의 was born은 시간의 출발점을 알려 주고, 네 번째 문장의 So는 앞의 이유에 따른 결과를, 다섯 번째 문장의 After that은 시간의 이동을 표시해요. 여덟 번째 문장의 Then은 사건의 전환을, 열 번째 문장의 Due to는 원인과 결과를 연결하죠. 마지막 문장의 finally는 결론을 여는 신호이고, wanted가 received로 바뀌는 재진술도 꼭 챙겨 보세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>be born\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>태어나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>excel\u003c/b>\u003cem>동사\u003c/em>\u003cspan>뛰어나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>prize\u003c/b>\u003cem>명사\u003c/em>\u003cspan>상\u003c/span>\u003c/div>\u003cdiv>\u003cb>continue\u003c/b>\u003cem>동사\u003c/em>\u003cspan>계속하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>education\u003c/b>\u003cem>명사\u003c/em>\u003cspan>교육\u003c/span>\u003c/div>\u003cdiv>\u003cb>take a job\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>직업을 얻다\u003c/span>\u003c/div>\u003cdiv>\u003cb>lab technician\u003c/b>\u003cem>명사\u003c/em>\u003cspan>실험실 기술자\u003c/span>\u003c/div>\u003cdiv>\u003cb>move\u003c/b>\u003cem>동사\u003c/em>\u003cspan>이사하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>detect\u003c/b>\u003cem>동사\u003c/em>\u003cspan>찾아내다, 탐지하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>detailed\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>자세한\u003c/span>\u003c/div>\u003cdiv>\u003cb>microscope\u003c/b>\u003cem>명사\u003c/em>\u003cspan>현미경\u003c/span>\u003c/div>\u003cdiv>\u003cb>expert\u003c/b>\u003cem>명사\u003c/em>\u003cspan>전문가\u003c/span>\u003c/div>\u003cdiv>\u003cb>sharp\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>선명한\u003c/span>\u003c/div>\u003cdiv>\u003cb>clear\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>깨끗한, 명확한\u003c/span>\u003c/div>\u003cdiv>\u003cb>mysterious\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>알려지지 않은, 신비한\u003c/span>\u003c/div>\u003cdiv>\u003cb>name\u003c/b>\u003cem>동사\u003c/em>\u003cspan>이름 붙이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>identify\u003c/b>\u003cem>동사\u003c/em>\u003cspan>확인하다, 식별하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>human\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>인간의\u003c/span>\u003c/div>\u003cdiv>\u003cb>due to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~ 때문에\u003c/span>\u003c/div>\u003cdiv>\u003cb>contribution\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기여\u003c/span>\u003c/div>\u003cdiv>\u003cb>field\u003c/b>\u003cem>명사\u003c/em>\u003cspan>분야\u003c/span>\u003c/div>\u003cdiv>\u003cb>biology\u003c/b>\u003cem>명사\u003c/em>\u003cspan>생물학\u003c/span>\u003c/div>\u003cdiv>\u003cb>award\u003c/b>\u003cem>동사\u003c/em>\u003cspan>수여하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>degree\u003c/b>\u003cem>명사\u003c/em>\u003cspan>학위\u003c/span>\u003c/div>\u003cdiv>\u003cb>finally\u003c/b>\u003cem>부사\u003c/em>\u003cspan>마침내\u003c/span>\u003c/div>\u003cdiv>\u003cb>receive\u003c/b>\u003cem>동사\u003c/em>\u003cspan>받다\u003c/span>\u003c/div>\u003cdiv>\u003cb>since\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~ 이래로, ~ 때부터\u003c/span>\u003c/div>\u003cdiv>\u003cb>coronavirus\u003c/b>\u003cem>명사\u003c/em>\u003cspan>코로나바이러스\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"단어 몇 개만 짚어 볼게요. excel은 뛰어나다, detect는 찾아내다는 뜻이에요. mysterious는 알려지지 않은, 수수께끼 같은이라는 의미이고요. contribution은 기여, award는 수여하다라는 뜻으로 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">excel\u003c/b>\u003cspan class=\"m\">뛰어나다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">shine\u003c/span>\u003cspan class=\"s\">stand out\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">fail\u003c/span>\u003cspan class=\"a\">lag\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">continue\u003c/b>\u003cspan class=\"m\">계속하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">keep on\u003c/span>\u003cspan class=\"s\">carry on\u003c/span>\u003cspan class=\"s\">proceed\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">stop\u003c/span>\u003cspan class=\"a\">quit\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">detect\u003c/b>\u003cspan class=\"m\">찾아내다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">find\u003c/span>\u003cspan class=\"s\">discover\u003c/span>\u003cspan class=\"s\">identify\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">miss\u003c/span>\u003cspan class=\"a\">overlook\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">expert\u003c/b>\u003cspan class=\"m\">전문가\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">specialist\u003c/span>\u003cspan class=\"s\">authority\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">beginner\u003c/span>\u003cspan class=\"a\">novice\u003c/span>\u003cspan class=\"a\">amateur\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">sharp\u003c/b>\u003cspan class=\"m\">선명한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">clear\u003c/span>\u003cspan class=\"s\">distinct\u003c/span>\u003cspan class=\"s\">crisp\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">blurry\u003c/span>\u003cspan class=\"a\">vague\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">mysterious\u003c/b>\u003cspan class=\"m\">알려지지 않은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">unknown\u003c/span>\u003cspan class=\"s\">puzzling\u003c/span>\u003cspan class=\"s\">strange\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">known\u003c/span>\u003cspan class=\"a\">familiar\u003c/span>\u003cspan class=\"a\">obvious\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">contribution\u003c/b>\u003cspan class=\"m\">기여\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">input\u003c/span>\u003cspan class=\"s\">dedication\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">neglect\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">finally\u003c/b>\u003cspan class=\"m\">마침내\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">eventually\u003c/span>\u003cspan class=\"s\">ultimately\u003c/span>\u003cspan class=\"s\">at last\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">initially\u003c/span>\u003cspan class=\"a\">first\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어도 정리해 볼게요. excel은 shine이나 stand out으로 바꿔 쓸 수 있고 반대말은 fail이에요. detect는 find나 discover로 바꿀 수 있고 반대는 miss죠. expert는 specialist, 반대는 beginner이고요. sharp는 clear나 crisp로 바꿀 수 있고 반대는 blurry예요. finally는 eventually나 at last로 바꿔 쓸 수 있답니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">June Almeida는\u003c/span>\u003cspan class=\"en\">June Almeida\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">태어났다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">born\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1930년에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">1930 \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">스코틀랜드에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">Scotland\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">June Almeida는 스코틀랜드에서 1930년에 태어났다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 인물의 일생을 다루는 전기 글의 첫 문장으로, 이름과 \u003cb class=\"key\">출생 \u003c/b>\u003cb class=\"key\">연도\u003c/b>, 출생지를 한 번에 제시하며 이야기의 배경을 잡아 주는 역할을 해요. 이런 기본 정보가 맨 앞에 온다는 점을 기억하면 뒤의 사건들이 시간 순서대로 이어진다는 흐름이 보여요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태(be born)\u003c/span> : be동사 + 과거분사 born = [[태어나다]] : \"태어났다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 배열(시간 → 장소)\u003c/span> : [[in + 연도]] + in + 장소 : \"1930년에 스코틀랜드에서\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"June Almeida, June Almeida는. was born, 태어났다. in 1930, 1930년에. in Scotland, 스코틀랜드에서. 이 문장 전체를 해석하면, June Almeida는 스코틀랜드에서 1930년에 태어났다.","hl":"m"},{"n":14,"text":"이 문장은 인물 소개를 여는 첫 문장이에요. 이름과 출생 연도, 출생지를 한 번에 제시하면서 이야기의 배경을 잡아 주죠. 전기 글에서는 이런 기본 정보가 가장 먼저 나온다는 점을 꼭 기억해 두세요.","hl":"mn"},{"n":15,"text":"먼저 was born을 보세요. 태어나는 건 스스로 하는 일이 아니라 수동의 의미라서 be동사 뒤에 과거분사 born이 오는 수동태 형태예요. 두 번째로 in 1930 in Scotland를 보면 시간 표현이 장소 표현보다 앞에 오죠. 영어는 작은 단위인 시간을 먼저 말하고 장소를 뒤에 붙이는 순서를 좋아해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Almeida는 학교에서 뛰어났고\u003c/span>\u003cspan class=\"en\">Almeida \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">excelled \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">school\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 받았다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">won\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">과학 최고상을\u003c/span>\u003cspan class=\"en\">the top science prize\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀의 학교에서\u003c/span>\u003cspan class=\"en\">at her school.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Almeida는 학교에서 뛰어났고 학교에서 과학 최고상을 받았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에 이어 그녀가 학교에서 얼마나 뛰어났는지를 \u003cb class=\"key\">과학 \u003c/b>\u003cb class=\"key\">최고상\u003c/b>이라는 구체적인 결과로 보여 주는 문장이에요. 이렇게 뛰어난 학생이었다는 점이 뒤에 나오는 '돈이 없어 대학에 가지 못했다'는 내용과 대비되면서 안타까움을 더해 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">자동사 + 전치사 in(분야)\u003c/span> : excel [[in]] + 분야 : \"학교에서 뛰어났다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 and의 병렬\u003c/span> : [[excelled]] and [[won]] (과거동사 + 과거동사) : \"그리고 받았다\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"Almeida excelled in school, Almeida는 학교에서 뛰어났고. and won, 그리고 받았다. the top science prize, 과학 최고상을. at her school, 그녀의 학교에서. 이 문장 전체를 해석하면, Almeida는 학교에서 뛰어났고 학교에서 과학 최고상을 받았다.","hl":"m"},{"n":17,"text":"이 문장은 앞 문장에 이어서 그녀가 학교에서 얼마나 뛰어났는지를 보여 줘요. 과학 최고상이라는 구체적인 결과로 능력을 증명하는 흐름이죠. 뒤에 나올 돈이 없어서 대학에 가지 못했다는 내용과 대비되도록, 뛰어난 학생이었다는 점을 미리 강조하는 역할이에요.","hl":"mn"},{"n":18,"text":"먼저 excelled in school을 보세요. excel은 뛰어나다는 뜻의 자동사라서 어떤 분야인지를 in으로 붙여 줘요. 두 번째로 and won을 보면 등위접속사 and가 앞의 과거동사 excelled와 뒤의 과거동사 won을 병렬로 묶어 주죠. 그래서 두 동작의 시제가 똑같이 과거로 맞춰져요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 원했다\u003c/span>\u003cspan class=\"en\">She \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">wanted \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">과학에서 그녀의 공부를 계속하는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">continue\u003c/span> her studies in science\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고등학교를 나온 후에\u003c/span>\u003cspan class=\"en\">after high school,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 돈이 없었다\u003c/span>\u003cspan class=\"en\">but \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">no \u003c/span>\u003cspan class=\"tgt\">money\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀의 대학 교육을 위한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">her \u003c/span>\u003cspan class=\"tgt\">college \u003c/span>\u003cspan class=\"tgt\">education\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">고등학교를 나온 후, 그녀는 과학 공부를 계속하기를 원했지만 대학 교육을 위한 돈이 없었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 그녀의 바람과 현실적인 장벽을 but으로 \u003cb class=\"key\">대비\u003c/b>시켜 보여 주는 문장이에요. 과학 공부를 계속하고 싶었지만 돈이 없었다는 이 장벽 때문에, 다음 문장에서 16살에 실험실 기술자로 일하게 된다는 흐름이 자연스럽게 이어져요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : want + [[to부정사]] (목적어) : \"계속하는 것을 원했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">there be 구문(유도부사)\u003c/span> : [[there]] + be동사 + 주어 (~이 있다) : \"돈이 없었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 for(목적·용도)\u003c/span> : for + 명사 (~을 위한) : \"그녀의 대학 교육을 위한\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"She wanted, 그녀는 원했다. to continue her studies in science, 과학에서 그녀의 공부를 계속하는 것을. after high school, 고등학교를 나온 후에. but there was no money, 하지만 돈이 없었다. for her college education, 그녀의 대학 교육을 위한. 이 문장 전체를 해석하면, 고등학교를 나온 후, 그녀는 과학 공부를 계속하기를 원했지만 대학 교육을 위한 돈이 없었다.","hl":"m"},{"n":20,"text":"이 문장은 그녀가 처한 현실적인 장벽을 보여 줘요. 과학 공부를 계속하고 싶다는 바람과 돈이 없다는 현실을 but으로 대비시키는 구조죠. 이 장벽 때문에 다음 문장에서 그녀가 실험실 기술자로 일하게 된다는 흐름이 자연스럽게 이어져요.","hl":"mn"},{"n":21,"text":"먼저 wanted to continue를 보세요. want 뒤에 to부정사가 와서 '계속하는 것을 원했다'라는 목적어 역할을 해요. 두 번째로 there was no money인데, 여기서 there는 거기에라는 뜻이 아니라 ~이 있다를 만들어 주는 유도부사예요. 그래서 진짜 주어는 뒤에 있는 no money이고 동사도 거기에 맞춰 was가 됐어요. 세 번째로 for her college education에서 for는 ~을 위한이라는 목적을 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서,\u003c/span>\u003cspan class=\"en\">So,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">열여섯 살의 나이에,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">age \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">16\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Almeida는 직업을 얻었다\u003c/span>\u003cspan class=\"en\">Almeida took a job\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">실험실 기술자로서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">lab \u003c/span>\u003cspan class=\"tgt\">technician\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그래서, 16살의 나이에 Almeida는 실험실 기술자로 직업을 얻었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 대학 등록금이 없어 과학 공부를 이어 가지 못한 그녀가 선택한 첫걸음을 보여 주는 문장입니다. 'So'는 앞 문장의 \u003cb class=\"key\">원인\u003c/b>을 받아 결과를 이끄는 접속부사예요. 'at the age of 16'은 그 결정이 얼마나 \u003cb class=\"key\">이른 \u003c/b>\u003cb class=\"key\">시기\u003c/b>에 내려졌는지를 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 용법(시점)\u003c/span> : [at the age of + 나이] = ~살의 나이에 : \"열여섯 살의 나이에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 as (자격·신분)\u003c/span> : take a job [as + 명사] = ~로서 직업을 얻다 : \"실험실 기술자로서\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"So, 그래서. at the age of 16, 열여섯 살의 나이에. Almeida took a job, Almeida는 직업을 얻었다. as a lab technician, 실험실 기술자로서. 이 문장 전체를 해석하면, 그래서, 16살의 나이에 Almeida는 실험실 기술자로 직업을 얻었다.","hl":"m"},{"n":23,"text":"이 문장은 대학 등록금이 없어서 과학 공부를 이어 가지 못한 그녀가 선택한 첫걸음을 보여 줘요. So가 앞 문장의 원인을 받아 결과를 이끌고, at the age of sixteen이 그 결정이 얼마나 이른 시기였는지를 강조하죠. 결국 실험실 기술자라는 직업이 훗날 그녀의 연구 경력에 중요한 발판이 됩니다.","hl":"mn"},{"n":24,"text":"어법 포인트는 두 가지예요. 첫째, at the age of sixteen은 시점을 나타내는 전치사구로 문장 안에서 부사구 역할을 해요. 둘째, as a lab technician의 as는 자격을 나타내는 전치사로, a job이라는 명사 뒤에서 어떤 직업인지 알려 주는 전치사구예요. 그래서 실험실 기술자로서 직업을 얻었다고 해석하면 자연스럽습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 후,\u003c/span>\u003cspan class=\"en\">After that,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 런던으로 이사했다,\u003c/span>\u003cspan class=\"en\">she \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">moved \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">London\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러고 나서 캐나다로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">then \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">Canada\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1954년에\u003c/span>\u003cspan class=\"en\">in 1954.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 후, 그녀는 런던으로 이사했고, 그러고 나서 1954년에 캐나다로 이사했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 그녀의 \u003cb class=\"key\">이동 \u003c/b>\u003cb class=\"key\">경로\u003c/b>를 시간 순서대로 정리해 주는 문장입니다. 'then to Canada'는 앞의 'moved to London'에서 \u003cb class=\"key\">동사 \u003c/b>\u003cb class=\"key\">move\u003c/b>를 반복하지 않고 생략한 표현이에요. 무대가 \u003cb class=\"key\">캐나다\u003c/b>로 옮겨지면서 다음 문장의 바이러스 연구가 시작된다는 점을 예고합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">자동사 move + 전치사 to\u003c/span> : move [to + 장소] = ~로 이사하다 : \"런던으로 이사했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">반복 어구의 생략(공통 요소 생략)\u003c/span> : moved to London, then (moved) [to + 장소] : \"그러고 나서 캐나다로\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"After that, 그 후. she moved to London, 그녀는 런던으로 이사했다. then to Canada, 그러고 나서 캐나다로. in 1954, 1954년에. 이 문장 전체를 해석하면, 그 후, 그녀는 런던으로 이사했고, 그러고 나서 1954년에 캐나다로 이사했다.","hl":"m"},{"n":26,"text":"이 문장은 그녀의 이동 경로를 시간 순서대로 정리해 줘요. 런던에서 캐나다로 무대가 옮겨지는데, 이 캐나다가 바로 다음 문장의 바이러스 연구 현장이죠. 짧은 문장이지만 이야기의 장소가 바뀌는 중요한 연결 고리예요.","hl":"mn"},{"n":27,"text":"여기서 볼 포인트는 생략이에요. 첫째, move는 자동사라서 도착지를 말할 때 전치사 to를 붙여 moved to London처럼 씁니다. 둘째, then to Canada 앞에는 moved가 생략되어 있어요. 똑같은 동사가 반복되니까 소리 내어 읽을 때는 런던으로, 그러고 나서 캐나다로처럼 자연스럽게 이어 주면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그곳에서,\u003c/span>\u003cspan class=\"en\">There,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 직업을 얻었다\u003c/span>\u003cspan class=\"en\">she took a job\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바이러스를 찾는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">detecting \u003c/span>\u003cspan class=\"tgt\">viruses \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그것들의 자세한 사진을 만드는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">making \u003c/span>\u003cspan class=\"tgt\">detailed \u003c/span>\u003cspan class=\"tgt\">pictures \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">them\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">현미경을 이용해서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">using \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">microscope\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그곳에서, 그녀는 현미경을 이용해서 바이러스를 찾고 바이러스의 자세한 사진을 만드는 직업을 얻었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 캐나다에서 그녀가 맡은 일이 \u003cb class=\"key\">바이러스 \u003c/b>\u003cb class=\"key\">탐지\u003c/b>와 현미경 사진 제작이었음을 알려 주는 문장입니다. 'detecting ~ and making ~'은 a job의 내용을 풀어 주는 \u003cb class=\"key\">현재분사\u003c/b>구로, 두 일이 병렬로 연결되어 있어요. 'using a microscope'은 어떤 \u003cb class=\"key\">도구\u003c/b>로 그 일을 했는지 방법을 덧붙입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재분사구의 후치 수식 + 병렬 구조\u003c/span> : [명사 + ~ing ... and ~ing ...] = ~하는 (명사) : \"바이러스를 찾고 그것들의 자세한 사진을 만드는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">분사구문(수단·방법)\u003c/span> : [~ing + 도구] = ~을 이용해서 : \"현미경을 이용해서\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"There, 그곳에서. she took a job, 그녀는 직업을 얻었다. detecting viruses, 바이러스를 찾는. and making detailed pictures of them, 그리고 그것들의 자세한 사진을 만드는. using a microscope, 현미경을 이용해서. 이 문장 전체를 해석하면, 그곳에서, 그녀는 현미경을 이용해서 바이러스를 찾고 바이러스의 자세한 사진을 만드는 직업을 얻었다.","hl":"m"},{"n":29,"text":"이 문장은 캐나다에서 그녀가 맡은 일이 무엇이었는지 구체적으로 알려 줘요. 바이러스를 찾아내고 현미경으로 자세한 사진을 만드는 일이었죠. 바로 이 경험이 훗날 코로나바이러스를 처음으로 찍어 내는 밑거름이 됩니다.","hl":"mn"},{"n":30,"text":"어법은 두 가지로 정리할게요. 첫째, detecting viruses and making detailed pictures of them은 a job을 뒤에서 꾸며 주는 현재분사구이고, 두 동작이 and로 병렬 연결되어 있어요. 둘째, using a microscope은 주어와 접속사를 지운 분사구문으로 현미경을 이용해서라는 수단을 나타냅니다. 그래서 주절 주어 she가 현미경을 이용한 주체라는 점도 함께 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는\u003c/span>\u003cspan class=\"en\">She\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">되었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">became\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">최고 전문가 중 한 명이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">best \u003c/span>\u003cspan class=\"tgt\">experts\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 직업에서\u003c/span>\u003cspan class=\"en\">in that job.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 그 직업에서 최고 전문가 중 한 명이 되었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 열여섯 살에 실험실 기술자로 출발했던 Almeida가 그 일에서 손꼽히는 \u003cb class=\"key\">전문가\u003c/b>로 성장했음을 보여 주는 문장이에요. became은 '~이 되었다'라는 \u003cb class=\"key\">2형식 \u003c/b>\u003cb class=\"key\">동사\u003c/b>로, 뒤에 주어의 변화된 모습을 설명하는 \u003cb class=\"key\">주격보어\u003c/b>가 옵니다. one of the best experts가 '최고 전문가 중 한 명'이라는 뜻이고, in that job이 어느 분야에서인지 범위를 밝혀 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">2형식 동사 become + 주격보어\u003c/span> : 주어 She + became + 주격보어 one of the best experts (명사구) : \"그녀는 최고 전문가 중 한 명이 되었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">one of the + 최상급 + 복수명사\u003c/span> : one of + the + 최상급 형용사 + 복수명사 : \"최고 전문가 중 한 명\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"She, 그녀는. became, 되었다. one of the best experts, 최고 전문가 중 한 명이. in that job, 그 직업에서. 이 문장 전체를 해석하면, 그녀는 그 직업에서 최고 전문가 중 한 명이 되었다.","hl":"m"},{"n":32,"text":"앞에서 열여섯 살에 실험실 기술자로 시작했던 사람이 이제는 그 일에서 손꼽히는 전문가가 되었다는 걸 보여 주는 문장이에요. become은 주어의 변화를 나타내는 2형식 동사라서 뒤에 주격보어가 따라온다는 점도 같이 기억해 두면 좋아요.","hl":"mn"},{"n":33,"text":"첫 번째로 became을 볼게요. become은 주어의 상태 변화를 나타내는 2형식 동사예요. 그래서 뒤에 목적어가 아니라 주어를 설명하는 주격보어가 명사구로 옵니다. 두 번째로 one of the best experts를 보면, one of 뒤에 최상급 형용사가 오고 그다음에 복수명사가 와요. 여럿 중에서 하나를 콕 집는 표현이니까 명사가 복수 형태로 오는 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 후,\u003c/span>\u003cspan class=\"en\">Then,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1964년 런던에서\u003c/span>\u003cspan class=\"en\">in London in 1964,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 선명하고 깨끗한 사진을 만들었고\u003c/span>\u003cspan class=\"en\">she created \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">sharp, \u003c/span>\u003cspan class=\"tgt\">clear \u003c/span>\u003cspan class=\"tgt\">picture \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">알려지지 않은 바이러스의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">mysterious \u003c/span>\u003cspan class=\"tgt\">virus\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 코로나 바이러스라고 이름 붙였다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">named \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">coronavirus\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 후, 1964년 런던에서 그녀는 알려지지 않은 바이러스의 선명하고 깨끗한 사진을 만들었고 그것을 코로나 바이러스라고 이름 붙였다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 그녀가 연구 끝에 마침내 정체를 알 수 없던 바이러스의 모습을 사진으로 잡아낸 결정적인 순간을 담은 문장이에요. created와 named가 and로 이어진 \u003cb class=\"key\">병렬 \u003c/b>\u003cb class=\"key\">구조\u003c/b>이고, named는 목적어 it 뒤에 이름을 붙여 주는 \u003cb class=\"key\">5형식\u003c/b> 동사로 쓰였어요. sharp, clear는 그 사진이 얼마나 \u003cb class=\"key\">선명했는지\u003c/b>를 강조하는 표현입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 후치수식\u003c/span> : 명사 picture + of + 명사구 a mysterious virus : \"알려지지 않은 바이러스의 선명하고 깨끗한 사진\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동사구의 병렬 구조(and)\u003c/span> : created + 목적어 ... and named + 목적어 + 목적격보어 : \"만들었고 … 이름 붙였다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">5형식 동사 + 목적어 + 목적격 보어\u003c/span> : named + 목적어 it + 목적격 보어 coronavirus : \"그것을 코로나 바이러스라고 이름 붙였다\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"Then, 그 후. in London in 1964, 1964년 런던에서. she created a sharp, clear picture, 그녀는 선명하고 깨끗한 사진을 만들었고. of a mysterious virus, 알려지지 않은 바이러스의. and named it coronavirus, 그것을 코로나 바이러스라고 이름 붙였다. 이 문장 전체를 해석하면, 그 후, 1964년 런던에서 그녀는 알려지지 않은 바이러스의 선명하고 깨끗한 사진을 만들었고 그것을 코로나 바이러스라고 이름 붙였다.","hl":"m"},{"n":35,"text":"이 문장이 글의 클라이맥스예요. 그녀가 바이러스의 사진을 찍어 내고 거기에 코로나 바이러스라는 이름을 붙인 장면이죠. 사진이 선명하고 깨끗했다는 표현이 그녀가 얼마나 뛰어난 기술자였는지를 보여 줍니다.","hl":"mn"},{"n":36,"text":"첫 번째는 and로 이어진 병렬 구조예요. created와 named라는 두 동사가 and로 대등하게 연결되어 있고, 둘 다 주어 she가 한 일이라 과거 시제로 똑같이 맞춰져 있어요. 두 번째는 named it coronavirus인데, name은 목적어 뒤에 이름을 붙여 주는 5형식 동사예요. 그래서 it 뒤에 목적격 보어 coronavirus가 명사로 오고, it과 coronavirus가 같은 대상을 가리키게 됩니다. 세 번째로 a picture of a mysterious virus에서 of a mysterious virus는 앞의 명사 picture를 뒤에서 꾸며 주는 후치수식이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이었다\u003c/span>\u003cspan class=\"en\">was\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인간에게서 확인된 첫 번째 코로나 바이러스였다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">first \u003c/span>\u003cspan class=\"tgt\">identified \u003c/span>\u003cspan class=\"tgt\">human \u003c/span>\u003cspan class=\"tgt\">coronavirus\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 인간에게서 확인된 첫 번째 코로나 바이러스였다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 이름 붙인 그 바이러스가 인간에게서 확인된 최초의 코로나 바이러스였음을 못 박는 문장이에요. It이 앞의 coronavirus를 그대로 받아 글의 흐름을 \u003cb class=\"key\">응집\u003c/b>시켜 주고, the first가 그 \u003cb class=\"key\">최초성\u003c/b>을 강조합니다. 짧은 문장이지만 8번 문장의 성과가 얼마나 중요한지 무게를 실어 주는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">대명사 it의 지시 대상\u003c/span> : It = 앞 문장의 coronavirus (a mysterious virus) : \"그것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사의 형용사적 수식(수동의 의미)\u003c/span> : the first + 과거분사 identified + 명사 human coronavirus : \"인간에게서 확인된 첫 번째 코로나 바이러스\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"It, 그것은. was, 이었다. the first identified human coronavirus, 인간에게서 확인된 첫 번째 코로나 바이러스였다. 이 문장 전체를 해석하면, 그것은 인간에게서 확인된 첫 번째 코로나 바이러스였다.","hl":"m"},{"n":38,"text":"앞 문장에서 이름 붙인 그 바이러스가 바로 인간에게서 확인된 최초의 코로나 바이러스였다는 걸 못 박는 문장이에요. 짧지만 이 성과가 얼마나 대단한지 무게를 실어 주는 문장이죠.","hl":"mn"},{"n":39,"text":"첫 번째는 the first identified human coronavirus에서 identified를 보는 거예요. identify의 과거분사로 '확인된'이라는 수동의 뜻을 가지면서 뒤의 명사를 앞에서 꾸며 줍니다. 두 번째로 It은 앞 문장에 나온 코로나 바이러스를 받는 대명사예요. 같은 말을 되풀이하지 않고 짧게 받아 주는 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀가 한 기여 때문에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Due \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">her \u003c/span>\u003cspan class=\"tgt\">contributions\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">생물학 분야에서,\u003c/span>\u003cspan class=\"en\">in the field of biology,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">런던 대학은\u003c/span>\u003cspan class=\"en\">the University of London\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀에게 대학 학위를 수여했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">awarded \u003c/span>\u003cspan class=\"tgt\">her \u003c/span>\u003cspan class=\"tgt\">university \u003c/span>\u003cspan class=\"tgt\">degrees\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1970년과 1971년에.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">1970 \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">1971\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">생물학 분야에서 그녀가 한 기여 때문에, 런던 대학은 그녀에게 대학 학위를 1970년과 1971년에 수여했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 Almeida가 생물학 분야에 기여한 공로로 런던 대학에서 대학 학위를 받았다는 사실을 전합니다. 앞에서 그녀가 경제적 이유로 대학 교육을 받지 못했던 점을 상기하면, 그녀의 \u003cb class=\"key\">기여\u003c/b>가 뒤늦게 \u003cb class=\"key\">학위\u003c/b>로 인정받은 흐름을 보여 줍니다. Due to는 '~ 때문에'로 원인을 나타내며, 수여의 대상과 시점을 함께 제시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">원인을 나타내는 전치사구 due to\u003c/span> : Due to + 명사구 = ~ 때문에 : \"그녀가 한 기여 때문에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수여동사 award의 목적어 두 개 구조\u003c/span> : award + 간접목적어 + 직접목적어 : \"그녀에게 대학 학위를 수여했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사구와 and의 병렬 구조\u003c/span> : in + [연도] and [연도] : \"1970년과 1971년에\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"Due to her contributions, 그녀가 한 기여 때문에. in the field of biology, 생물학 분야에서. the University of London, 런던 대학은. awarded her university degrees, 그녀에게 대학 학위를 수여했다. in 1970 and 1971, 1970년과 1971년에.. 이 문장 전체를 해석하면, 생물학 분야에서 그녀가 한 기여 때문에, 런던 대학은 그녀에게 대학 학위를 1970년과 1971년에 수여했다.","hl":"m"},{"n":41,"text":"이 문장은 Almeida가 생물학 분야에 기여한 공로로 런던 대학에서 대학 학위를 받았다는 사실을 전해요. 앞에서 그녀가 경제적 이유로 대학 교육을 받지 못했던 점을 떠올리면, 그녀의 기여가 뒤늦게 학위로 인정받은 흐름이 잘 드러납니다. Due to는 이유를 이끄는 표현으로 기억해 두세요.","hl":"mn"},{"n":42,"text":"첫 번째, Due to her contributions에서 Due to는 뒤에 명사구가 와서 원인을 나타내는 전치사구를 만들어요. 두 번째, awarded her university degrees는 수여동사 award가 간접목적어 her와 직접목적어 university degrees를 데리고 온 구조예요. 세 번째, in nineteen seventy and nineteen seventy one에서는 and가 두 연도를 병렬로 연결하고 앞의 전치사 in이 두 연도에 함께 걸린다고 보면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 마침내 그 학위들을 받았다\u003c/span>\u003cspan class=\"en\">She finally received the degrees\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀가 원했던\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that\u003c/span> she \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">wanted\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고등학교 때부터.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">since \u003c/span>\u003cspan class=\"tgt\">high \u003c/span>\u003cspan class=\"tgt\">school\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 마침내 그녀가 고등학교 때부터 원했던 학위를 받았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 Almeida가 고등학교 때부터 원해 왔던 대학 학위를 마침내 받았다는 결말을 제시합니다. 앞에서 그녀가 경제적 이유로 대학에 가지 못하고 기술자로 일했던 사실과 연결되어, 오랜 \u003cb class=\"key\">노력\u003c/b>과 \u003cb class=\"key\">기여\u003c/b>가 인정받은 감동적인 마무리를 이룹니다. 관계대명사 that은 the degrees를 꾸미고, had wanted는 received보다 앞선 \u003cb class=\"key\">대과거\u003c/b>를 나타냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 that\u003c/span> : 선행사 + that + 주어 + 동사 : \"그녀가 원했던 (관계절 연결)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거완료 (대과거)\u003c/span> : had + 과거분사 : \"원했던\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 since (기점)\u003c/span> : since + 과거 시점 : \"고등학교 때부터\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"She finally received the degrees, 그녀는 마침내 그 학위들을 받았다. that she had wanted, 그녀가 원했던. since high school, 고등학교 때부터.. 이 문장 전체를 해석하면, 그녀는 마침내 그녀가 고등학교 때부터 원했던 학위를 받았다.","hl":"m"},{"n":44,"text":"이 문장은 Almeida가 고등학교 때부터 원해 왔던 대학 학위를 마침내 받았다는 결말을 보여 줘요. 앞에서 그녀가 경제적 이유로 대학에 가지 못하고 기술자로 일했던 사실과 연결하면, 오랜 노력과 기여가 인정받은 감동적인 마무리가 됩니다. received보다 앞선 시점을 나타내는 대과거 표현도 함께 기억해 두세요.","hl":"mn"},{"n":45,"text":"첫 번째, that은 앞의 the degrees를 받아 관계절을 만들고 뒤에 목적어가 비어 있으니 목적격 관계대명사예요. 두 번째, had wanted는 received보다 앞선 일을 나타내는 과거완료이고, 흔히 대과거라고 불러요. 세 번째, since high school에서 since는 고등학교 때라는 기점을 나타냅니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>June Almeida는 스코틀랜드에서 태어나 학교에서 \u003cb class=\"key\">과학 \u003c/b>\u003cb class=\"key\">최고상\u003c/b>을 받을 만큼 뛰어났지만 대학 교육을 위한 돈이 없었다.\u003c/li>\u003cli>그래서 열여섯 살에 \u003cb class=\"key\">실험실 \u003c/b>\u003cb class=\"key\">기술자\u003c/b>가 되어 런던과 캐나다로 옮겼고, 현미경으로 바이러스를 촬영하는 최고 \u003cb class=\"key\">전문가\u003c/b>가 되었다.\u003c/li>\u003cli>1964년 런던에서 그녀는 정체를 알 수 없는 바이러스의 선명한 사진을 만들어 \u003cb class=\"key\">코로나바이러스\u003c/b>라고 이름 붙였고, 그것은 인간에게서 확인된 첫 번째 코로나바이러스였다.\u003c/li>\u003cli>생물학 분야의 \u003cb class=\"key\">기여\u003c/b>로 런던 대학이 1970년과 1971년에 학위를 수여했고, 그녀는 고등학교 때부터 원했던 학위를 마침내 받았다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Even without money for college, June Almeida became a top expert in virus imaging, identified the first human coronavirus, and finally received the university degrees she had wanted since high school.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">June Almeida는 대학 교육을 위한 돈이 없어 열여섯 살에 \u003cb class=\"key\">실험실 \u003c/b>\u003cb class=\"key\">기술자\u003c/b>가 되었지만, \u003cb class=\"key\">현미경\u003c/b>으로 바이러스를 촬영하는 최고 전문가가 되었다. 그녀는 최초로 인간 \u003cb class=\"key\">코로나바이러스\u003c/b>를 확인하고 이름을 붙였으며, 생물학 분야의 기여로 런던 대학에서 고등학교 때부터 원하던 학위를 마침내 받았다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":46,"text":"오늘 이야기의 핵심은 배움에 대한 열망이 결국 학위로 돌아왔다는 거예요. 대학 문이 닫혀 있어도 실험실에서 실력을 쌓아 최초의 코로나바이러스 발견자가 된 June Almeida, 참 멋진 사람이죠. 여러분도 오늘 배운 시간순 구조와 신호어를 기억해 두면 긴 지문도 쉽게 정리할 수 있을 거예요. 수고했어요, 다음 시간에 만나요.","hl":null}]}]});</script></body></html>
