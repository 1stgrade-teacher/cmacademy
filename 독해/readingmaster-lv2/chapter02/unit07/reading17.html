 data-hl=\"stage-0\"><div class=\"lec-stage-head\">01초기 성장과 한계</div><ul><li>준 알메이다의 학업적 재능에도 불구하고 경제적 어려움으로 상급 학교 진학에 실패했다.</li><li>과학 분야에서 뛰어난 성취와 수상 경력</li><li>대학 진학을 포기하고 16세에 실험실 기술자(lab technician)로 취업</li><li>핵심 키워드: 실험실 기술자(lab technician)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02경력 개발과 전문성 확보</div><ul><li>캐나다로 이주한 후 바이러스 관찰 및 촬영 기술을 연마하며 전문가로 성장했다.</li><li>캐나다에서 바이러스 탐지(detecting viruses) 및 현미경 촬영 업무 수행</li><li>해당 분야에서 최고의 전문가(expert)로 인정받음</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03코로나바이러스 발견</div><ul><li>1964년 런던에서 최초의 인간 코로나바이러스를 발견하고 명명하는 업적을 남겼다.</li><li>신비로운 바이러스의 선명한 이미지 포착</li><li>명칭 부여: 코로나바이러스(coronavirus)</li><li>최초로 확인된 인간 코로나바이러스라는 역사적 의의</li><li>핵심 키워드: 코로나바이러스(coronavirus)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04학문적 결실</div><ul><li>생물학 분야에 기여한 공로를 인정받아 과거 포기했던 대학 학위를 뒤늦게 취득했다.</li><li>런던 대학교(University of London)에서 학위 수여</li><li>고교 시절부터 갈망했던 학문적 목표 달성</li><li>핵심 키워드: 학위(degrees)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">excel</td><td class=\"m\">뛰어나다, 탁월하다</td></tr><tr><td class=\"w\">continue</td><td class=\"m\">지속하다, 계속하다</td></tr><tr><td class=\"w\">lab</td><td class=\"m\">실험실, 연구실</td></tr><tr><td class=\"w\">technician</td><td class=\"m\">기술자, 전문가</td></tr><tr><td class=\"w\">detect</td><td class=\"m\">발견하다, 탐지하다</td></tr><tr><td class=\"w\">detailed</td><td class=\"m\">상세한, 정밀한</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">expert</td><td class=\"m\">전문가, 권위자</td></tr><tr><td class=\"w\">mysterious</td><td class=\"m\">신비한, 알 수 없는</td></tr><tr><td class=\"w\">identify</td><td class=\"m\">확인하다, 식별하다</td></tr><tr><td class=\"w\">due to</td><td class=\"m\">~때문에, ~로 인한</td></tr><tr><td class=\"w\">contribution</td><td class=\"m\">기여, 공헌</td></tr><tr><td class=\"w\">award</td><td class=\"m\">수여하다, 주다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">준 알메이다는</span><span class=\"en\"><b>June Almeida</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">태어났다</span><span class=\"en\"><b><span class=\"grammar-hl\">was born</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">1930년에</span><span class=\"en\"><b>in 1930</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">스코틀랜드에서</span><span class=\"en\"><b>in Scotland.</b></span></div></div><div class=\"lec-sent-ko\">June Almeida는 스코틀랜드에서 1930년에 태어났다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 글의 주인공인 준 알메이다의 출생 시기와 장소를 밝히며, 그녀의 생애를 다루는 전기적 성격의 서술임을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was born (수동태): be동사(was)+p.p.(born) 구조. bear는 타동사(낳다)인데 목적어가 없어서 수동구조 was born 형태로 쓴다. 기본구조: bear + O (누군가를 낳다)</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">알메이다는</span><span class=\"en\"><b>Almeida</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">학교에서 뛰어났다</span><span class=\"en\"><b><span class=\"grammar-hl\">excelled</span> in school,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 받았다</span><span class=\"en\"><b>and won</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">최고의 과학상을</span><span class=\"en\"><b>the top science prize</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">학교에서</span><span class=\"en\"><b>at her school.</b></span></div></div><div class=\"lec-sent-ko\">Almeida는 학교에서 뛰어났고 학교에서 과학 최고상을 받았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 그녀가 어린 시절부터 과학 분야에 남다른 재능과 열정을 가지고 있었음을 보여줌으로써, 훗날 과학자로서 성공하게 되는 배경을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">excelled 동사: 과거형으로 주어(Almeida)의 과거 상태와 행동을 기술함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">excel</td><td class=\"m\">뛰어나다, 탁월하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀는</span><span class=\"en\"><b>She</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">계속하기를 원했다</span><span class=\"en\"><b>wanted <span class=\"grammar-hl\">to continue</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">과학 공부를</span><span class=\"en\"><b><span class=\"grammar-hl\">her studies</span> in science</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">고등학교 졸업 후에</span><span class=\"en\"><b>after high school,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 돈이 없었다</span><span class=\"en\"><b>but there was no money</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">대학 교육을 위한</span><span class=\"en\"><b>for her college education.</b></span></div></div><div class=\"lec-sent-ko\">고등학교를 나온 후, 그녀는 과학 공부를 계속하기를 원했지만 대학 교육을 위한 돈이 없었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급된 그녀의 과학적 재능에도 불구하고 현실적인 경제적 어려움에 부딪혔다는 상황을 제시하여, 주인공이 겪는 초기 난관을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to continue (to부정사): want의 목적어로 쓰인 명사적 용법임</div><div class=\"lec-gr-item\">to continue her studies (to부정사): want + O(to V) 구조에서 목적보어 역할을 수행함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">continue</td><td class=\"m\">지속하다, 계속하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그래서</span><span class=\"en\"><b>So,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">16살의 나이에</span><span class=\"en\"><b><span class=\"grammar-hl\">at the age of 16</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">알메이다는</span><span class=\"en\"><b>Almeida</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">직업을 얻었다</span><span class=\"en\"><b>took a job</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">실험실 기술자로서</span><span class=\"en\"><b>as a lab technician.</b></span></div></div><div class=\"lec-sent-ko\">그래서, 16살의 나이에 Almeida는 실험실 기술자로 직업을 얻었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 경제적 이유로 학업을 포기해야 했던 상황을 받아들이고, 과학과 관련된 현장에서 실무 경험을 쌓기 시작하는 전환점을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">at the age of 16 (관용표현): &#39;~의 나이에&#39;를 뜻하는 숙어적 표현</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">lab</td><td class=\"m\">실험실, 연구실</td></tr><tr><td class=\"w\">technician</td><td class=\"m\">기술자, 전문가</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 후</span><span class=\"en\"><b>After that,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀는 런던으로 이사했고</span><span class=\"en\"><b>she <span class=\"grammar-hl\">moved</span> to London,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그러고 나서 캐나다로 이사했다</span><span class=\"en\"><b>then to Canada</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">1954년에</span><span class=\"en\"><b>in 1954.</b></span></div></div><div class=\"lec-sent-ko\">그 후, 그녀는 런던으로 이사했고, 그러고 나서 1954년에 캐나다로 이사했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 직업적 성장을 위해 거주지를 옮겨 다니며 더 넓은 환경에서 경험을 쌓아가는 과정이 이어집니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">moved 동사: 주어(she)의 장소 이동을 나타내는 과거형 동사</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그곳에서</span><span class=\"en\"><b>There,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀는 직업을 얻었다</span><span class=\"en\"><b>she took a job</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">바이러스를 탐지하는</span><span class=\"en\"><b><span class=\"grammar-hl\">detecting</span> viruses</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그것들의 자세한 사진을 만드는</span><span class=\"en\"><b>and <span class=\"grammar-hl\">making</span> detailed pictures of them</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">현미경을 사용하여</span><span class=\"en\"><b><span class=\"grammar-hl\">using a microscope</span>.</b></span></div></div><div class=\"lec-sent-ko\">그곳에서, 그녀는 현미경을 이용해서 바이러스를 찾고 바이러스의 자세한 사진을 만드는 직업을 얻었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 캐나다에서의 업무 내용을 구체적으로 설명하며, 그녀가 바이러스 관찰이라는 전문적인 기술을 어떻게 연마했는지 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">detecting (현재분사): 병렬 구조로 연결된 동명사(detecting/making) 중 하나로, job이라는 명사를 뒤에서 부연 설명하는 명사적 개념의 동명사</div><div class=\"lec-gr-item\">making (동명사): 전치사(by가 생략된 의미로) 혹은 직업의 내용을 보충하는 명사적 기능</div><div class=\"lec-gr-item\">using a microscope (현재분사): 분사구문으로, &#39;while she used a microscope&#39;라는 부사적 의미를 포함함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">detect</td><td class=\"m\">발견하다, 탐지하다</td></tr><tr><td class=\"w\">detailed</td><td class=\"m\">상세한, 정밀한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀는</span><span class=\"en\"><b>She</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">되었다</span><span class=\"en\"><b>became</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">최고의 전문가들 중 한 명이</span><span class=\"en\"><b><span class=\"grammar-hl\">one of the best experts</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 직업에서</span><span class=\"en\"><b>in that job.</b></span></div></div><div class=\"lec-sent-ko\">그녀는 그 직업에서 최고 전문가 중 한 명이 되었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 오랜 기간 현장에서 쌓아온 실무 경험이 결실을 맺어, 특정 분야에서 독보적인 실력을 갖추게 되었음을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">one of the best experts (관용표현): &#39;one of + 복수명사&#39; 구조로 &#39;~중의 한 명&#39;을 의미함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">expert</td><td class=\"m\">전문가, 권위자</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 후</span><span class=\"en\"><b>Then,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">런던에서</span><span class=\"en\"><b>in London</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">1964년에</span><span class=\"en\"><b>in 1964,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀는 만들었다</span><span class=\"en\"><b>she <span class=\"grammar-hl\">created</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">선명하고 깨끗한 사진을</span><span class=\"en\"><b>a sharp, clear picture</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">의문의 바이러스의</span><span class=\"en\"><b>of a mysterious virus</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 이름 붙였다 그것을</span><span class=\"en\"><b>and named it</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">코로나바이러스라고</span><span class=\"en\"><b>coronavirus.</b></span></div></div><div class=\"lec-sent-ko\">그 후, 1964년 런던에서 그녀는 알려지지 않은 바이러스의 선명하고 깨끗한 사진을 만들었고 그것을 코로나 바이러스라고 이름 붙였다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 전문가로서의 능력을 발휘하여 과학계의 중요한 발견을 이루어낸 결정적인 성과를 기술합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">created 동사: 문장의 서술어로, 과거 시점을 나타내는 일반동사</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">mysterious</td><td class=\"m\">신비한, 알 수 없는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은</span><span class=\"en\"><b>It</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이었다</span><span class=\"en\"><b><span class=\"grammar-hl\">was</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">최초로 확인된 인간 코로나바이러스</span><span class=\"en\"><b>the first <span class=\"grammar-hl\">identified</span> human coronavirus.</b></span></div></div><div class=\"lec-sent-ko\">그것은 인간에게서 확인된 첫 번째 코로나 바이러스였다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 발견한 코로나바이러스가 의학적으로 얼마나 큰 의미를 지니는지를 밝혀 그녀의 업적을 한층 더 높게 평가합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was 동사: 주어(It)와 보어(the first identified human coronavirus)를 연결하는 be동사</div><div class=\"lec-gr-item\">identified (과거분사(형용사)): identified가 coronavirus를 수식(= &#39;확인된 코로나바이러스&#39;)하는 구조이며, &#39;N that was identified&#39;의 축약된 관계절임</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀의 기여 때문에</span><span class=\"en\"><b>Due to her contributions</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">생물학 분야에서의</span><span class=\"en\"><b>in the field of biology,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">런던 대학교는</span><span class=\"en\"><b>the University of London</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수여했다 그녀에게</span><span class=\"en\"><b><span class=\"grammar-hl\">awarded</span> her</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">대학 학위를</span><span class=\"en\"><b>university degrees</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">1970년과 1971년에</span><span class=\"en\"><b>in 1970 and 1971.</b></span></div></div><div class=\"lec-sent-ko\">생물학 분야에서 그녀가 한 기여 때문에, 런던 대학은 그녀에게 대학 학위를 1970년과 1971년에 수여했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 그녀의 과학적 공로가 사회적으로 인정받아, 과거의 경제적 결핍으로 이루지 못했던 대학 교육에 대한 보상을 받게 되었음을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">awarded 5형식(SVOC) 구조: University of London(S) + awarded(V) + her(IO) + university degrees(DO)의 4형식 구조임</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">due to</td><td class=\"m\">~때문에, ~로 인한</td></tr><tr><td class=\"w\">contribution</td><td class=\"m\">기여, 공헌</td></tr><tr><td class=\"w\">award</td><td class=\"m\">수여하다, 주다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 11 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀는</span><span class=\"en\"><b>She</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">마침내 받았다</span><span class=\"en\"><b>finally received</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">학위를</span><span class=\"en\"><b>the degrees</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀가 원했던</span><span class=\"en\"><b><span class=\"grammar-hl\">that she had wanted</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">고등학교 때부터</span><span class=\"en\"><b>since high school.</b></span></div></div><div class=\"lec-sent-ko\">그녀는 마침내 그녀가 고등학교 때부터 원했던 학위를 받았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 어릴 적 꿈이 오랜 시간이 흐른 뒤 비로소 성취되었음을 알리며, 그녀의 인생이 고난을 극복하고 성공으로 마무리되었음을 보여주는 결론입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that she had wanted (관계대명사): that이 이끄는 절이 앞의 명사(the degrees)를 수식하는 형용사절이며, wanted의 목적어가 빠져 있는 목적격 관계대명사 구조임</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>준 알메이다는 과학에 뛰어난 재능이 있었으나 가정 형편으로 대학 진학을 포기했다.</li><li>현장 경험을 쌓으며 바이러스 관찰 전문가로 성장했고, 1964년 최초로 코로나바이러스를 발견했다.</li><li>과학적 공로를 인정받아 런던 대학교에서 명예로운 학위를 수여받으며 어린 시절의 꿈을 이뤘다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">June Almeida overcame financial hardships to become a prominent virologist, and she eventually gained academic recognition for identifying the first human coronavirus.</div>\n              <div class=\"lec-final-sum-ko\">준 알메이다는 경제적 역경을 극복하고 저명한 바이러스학자가 되었으며, 마침내 최초의 인간 코로나바이러스를 발견한 공로로 학문적 인정을 받았다.</div></div></div>"],"segs":[[{"audio":"./reading17_audio/1.mp3","hl":null}],[{"audio":"./reading17_audio/2.mp3","hl":null}],[{"audio":"./reading17_audio/3
