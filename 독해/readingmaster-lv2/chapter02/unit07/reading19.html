<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터2 Reading19 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터2 Reading19","audioDir":"reading19_audio","preview":false,"count":57,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.520em\">Reading19\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터2\u003c/div>\u003ch1>The World's First Female Flight Attendant: Ellen Church\u003c/h1>\u003ch2>세계 최초의 여성 비행 승무원, Ellen Church\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>요약: 간호사였던 Ellen Church는 비행 중 겁에 질린 승객을 간호사가 돌봐야 한다고 제안해 1930년 세계 최초의 \u003cb class=\"key\">여성 \u003c/b>\u003cb class=\"key\">비행 \u003c/b>\u003cb class=\"key\">승무원\u003c/b>이 되었고, 이후 \u003cb class=\"key\">육군 \u003c/b>\u003cb class=\"key\">간호 \u003c/b>\u003cb class=\"key\">부대\u003c/b>에서 부상당한 병사들을 비행기로 대피시키며 \u003cb class=\"key\">항공 \u003c/b>\u003cb class=\"key\">훈장\u003c/b>을 받은 인물이다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Ellen Church, a nurse, became the world's first female flight attendant in 1930 and later served as an army nurse, earning an Air Medal.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"여러분 안녕하세요, 오늘도 함께 공부하게 되어 반가워요. 오늘 읽을 지문은 세계 최초의 여성 비행 승무원 Ellen Church의 이야기예요. 간호사였던 한 사람이 어떻게 하늘 위에서 새로운 직업을 열었는지 요약부터 짚어 볼게요. 핵심은 간호사 경력이 비행 승무원이라는 새 길로 이어졌다는 점이고, 요지는 한 사람의 제안이 직업의 역사를 바꾸었다는 거예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">오늘날 비행기에는 승무원이 타는 것이 당연하지만, 1920년대 후반까지만 해도 \u003cb class=\"key\">비행 \u003c/b>\u003cb class=\"key\">승무원\u003c/b>이라는 직업은 없었어요. 초기 비행기는 무척 흔들렸고 승객들은 멀미와 불안에 시달렸죠. 그래서 항공사는 의료 지식이 있는 사람이 승객을 돌봐 주기를 원했고, 이때 간호사의 \u003cb class=\"key\">전문성\u003c/b>이 주목받았습니다. 이는 마치 배 위에서 흔들리는 승객을 돌보는 간호사를 떠올리게 하죠. 돌봄이 필요한 곳에 간호사가 있었다는 점이 이 이야기의 출발점이에요.\u003c/div>","segs":[{"n":2,"text":"배경지식을 조금 더해 볼게요. 오늘날 비행기에는 당연히 승무원이 타지만, 천구백이십 년대 후반까지만 해도 그런 직업은 없었어요. 비행기는 많이 흔들렸고 승객들은 멀미와 불안에 시달렸죠. 그래서 항공사는 의료 지식이 있는 사람이 승객을 돌봐 주면 좋겠다고 생각했어요. 이때 등장한 개념이 바로 flight attendant, 그러니까 비행 승무원이에요. 간호사가 흔들리는 배 위에서 승객을 돌본다고 상상해 보세요. 돌봄이 필요한 곳에 간호사가 있었다는 발상이 이 이야기의 출발점이었어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>간호사에서 시작\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>1904년 아이오와 주 크레스코에서 태어난 Ellen은 고등학교를 졸업한 뒤 \u003cb class=\"key\">간호학\u003c/b>을 공부했어요. 그녀는 샌프란시스코에서 간호사로 일하며 의료 지식을 쌓았죠. 이 간호사 경력이 훗날 비행기에서 승객을 돌보는 \u003cb class=\"key\">전문성\u003c/b>의 바탕이 됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>보잉에 던진 제안\u003csmall>전환 · 문장 4–7\u003c/small>\u003c/h4>\u003cp>어느 날 Ellen은 Boeing 사무실에 들러 비행기에서 간호사로서 일자리를 얻을 수 있는지 물었어요. 그리고 비행 중 \u003cb class=\"key\">겁에 \u003c/b>\u003cb class=\"key\">질린 \u003c/b>\u003cb class=\"key\">승객\u003c/b>을 간호사가 돌봐야 한다고 제안했죠. 그 제안이 받아들여져 1930년 그녀는 세계 최초의 \u003cb class=\"key\">여성 \u003c/b>\u003cb class=\"key\">비행 \u003c/b>\u003cb class=\"key\">승무원\u003c/b>이 되었습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>비행과 좌절\u003csmall>반전 · 문장 8–10\u003c/small>\u003c/h4>\u003cp>그녀는 오클랜드에서 시카고까지 비행하는 \u003cb class=\"key\">보잉 \u003c/b>\u003cb class=\"key\">80A\u003c/b> 비행기에서 근무했어요. 그러나 교통사고로 인한 \u003cb class=\"key\">부상\u003c/b> 때문에 18개월 후에 어쩔 수 없이 비행을 그만두어야 했죠. 이후 그녀는 밀워키 카운티 병원에서 다시 \u003cb class=\"key\">간호사 \u003c/b>\u003cb class=\"key\">일\u003c/b>을 시작합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>군 복무와 기념\u003csmall>결론 · 문장 11–15\u003c/small>\u003c/h4>\u003cp>제2차 세계대전 중 Ellen은 \u003cb class=\"key\">육군 \u003c/b>\u003cb class=\"key\">간호 \u003c/b>\u003cb class=\"key\">부대\u003c/b>에 입대했어요. 그녀는 부상당한 병사들을 비행기로 대피시키는 일을 도왔고 이 업적으로 \u003cb class=\"key\">항공 \u003c/b>\u003cb class=\"key\">훈장\u003c/b>을 받았죠. 크레스코에 있는 공항이 그녀의 이름을 따서 명명되었고, 그녀는 1965년 승마 사고로 세상을 떠났습니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 네 단계로 따라가 볼게요.","hl":null},{"n":4,"text":"먼저 Ellen Church는 천구백사 년 아이오와 주 크레스코에서 태어났어요. 고등학교를 졸업한 뒤에는 간호학을 공부했고, 샌프란시스코에서 간호사로 일했죠. 이 간호사 경력이 뒤에 아주 중요한 바탕이 됩니다.","hl":"f0"},{"n":5,"text":"어느 날 Ellen은 Boeing 사무실에 들렀어요. 비행기에서 간호사로 일할 수 있는지 물었고, 비행 중 겁에 질린 승객을 간호사가 돌봐야 한다고 제안했죠. 그 제안이 통해서 천구백삼십 년에 세계 최초의 여성 비행 승무원이 됩니다.","hl":"f1"},{"n":6,"text":"그녀는 Oakland에서 Chicago까지 비행하는 Boeing eighty A 비행기에서 근무했어요. 그런데 교통사고로 다친 부상 때문에 십팔 개월 후에 어쩔 수 없이 비행을 그만두어야 했죠. 이후 그녀는 Milwaukee County Hospital에서 다시 간호사 일을 시작합니다.","hl":"f2"},{"n":7,"text":"제이차 세계대전 중 Ellen은 육군 간호 부대에 입대했어요. 부상당한 병사들을 비행기로 대피시키는 일을 도왔고, 이 업적으로 항공 훈장을 받았죠. 크레스코에 있는 공항이 그녀의 이름을 따서 명명되었고, 그녀는 천구백육십오 년에 승마 사고로 세상을 떠났어요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 7번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 출생에서 시작해 공부, 취업, 핵심 사건, 이후의 삶, 죽음까지 시간의 흐름을 그대로 따라가는 \u003cb class=\"key\">시간순\u003c/b> 전개 방식이에요. 글의 중심 내용은 '세계 최초의 여성 비행 승무원이 되었다'는 \u003cb class=\"key\">일곱 \u003c/b>\u003cb class=\"key\">번째 \u003c/b>\u003cb class=\"key\">문장\u003c/b>인데, 이 문장이 글의 앞부분도 뒤부분도 아닌 가운데에 놓여 있어요. 그래서 앞의 간호사 경력은 이 사건의 \u003cb class=\"key\">배경\u003c/b>이 되고, 뒤의 군 복무와 훈장은 그 이후의 삶을 보여 주는 확장이 됩니다. 따라서 중심 내용이 중간에 오는 \u003cb class=\"key\">중괄식\u003c/b> 구조로 판단할 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>After (2)\u003c/b>\u003cspan>시간 순서\u003c/span>\u003cb>One day (4)\u003c/b>\u003cspan>결정적 계기\u003c/span>\u003cb>In 1930 (7)\u003c/b>\u003cspan>핵심 사건 시점\u003c/span>\u003cb>however (9)\u003c/b>\u003cspan>반전·전환\u003c/span>\u003cb>During World War II (11)\u003c/b>\u003cspan>시간 배경 전환\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">a nurse on their airplanes\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">flight attendant\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">her nursing career\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Army Nurse Corps\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">helped evacuate wounded soldiers\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 시간순 전개 방식이에요. 태어남에서 시작해서 공부와 취업, 핵심 사건, 이후의 삶, 그리고 죽음까지 시간의 흐름을 그대로 따라가죠. 가장 중요한 문장은 일곱 번째 문장인데, 세계 최초의 여성 비행 승무원이 되었다는 대목이에요. 핵심 문장이 글의 중간에 놓여 있으니 중괄식 구조로 읽으면 됩니다.","hl":"ty"},{"n":9,"text":"신호어를 짚어 볼게요. 두 번째 문장의 After는 졸업 이후를, 네 번째 문장의 One day는 결정적인 하루를, 일곱 번째 문장의 In 1930은 핵심 사건의 시점을 알려 줘요. 아홉 번째 문장의 however는 앞의 성공과 대비되는 반전을 만들고, 열한 번째 문장의 During World War II는 새로운 시간 배경을 열어 주죠. 또 a nurse on their airplanes가 flight attendant로, 다시 nursing career와 Army Nurse Corps로 이어지면서 간호와 돌봄이라는 개념이 계속 반복됩니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>be born\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>태어나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>graduate from\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 졸업하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>nursing\u003c/b>\u003cem>명사\u003c/em>\u003cspan>간호학\u003c/span>\u003c/div>\u003cdiv>\u003cb>nurse\u003c/b>\u003cem>명사\u003c/em>\u003cspan>간호사\u003c/span>\u003c/div>\u003cdiv>\u003cb>stop in at\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 들르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>get a job\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>일자리를 얻다\u003c/span>\u003c/div>\u003cdiv>\u003cb>suggest\u003c/b>\u003cem>동사\u003c/em>\u003cspan>제안하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>take care of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>돌보다\u003c/span>\u003c/div>\u003cdiv>\u003cb>frightened\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>겁에 질린\u003c/span>\u003c/div>\u003cdiv>\u003cb>passenger\u003c/b>\u003cem>명사\u003c/em>\u003cspan>승객\u003c/span>\u003c/div>\u003cdiv>\u003cb>during\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~동안\u003c/span>\u003c/div>\u003cdiv>\u003cb>flight\u003c/b>\u003cem>명사\u003c/em>\u003cspan>비행\u003c/span>\u003c/div>\u003cdiv>\u003cb>female\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>여성의\u003c/span>\u003c/div>\u003cdiv>\u003cb>flight attendant\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>비행 승무원\u003c/span>\u003c/div>\u003cdiv>\u003cb>fly\u003c/b>\u003cem>동사\u003c/em>\u003cspan>비행하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>however\u003c/b>\u003cem>부사\u003c/em>\u003cspan>그러나\u003c/span>\u003c/div>\u003cdiv>\u003cb>be forced to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>어쩔 수 없이 ~해야 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>quit\u003c/b>\u003cem>동사\u003c/em>\u003cspan>그만두다\u003c/span>\u003c/div>\u003cdiv>\u003cb>due to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~때문에\u003c/span>\u003c/div>\u003cdiv>\u003cb>injury\u003c/b>\u003cem>명사\u003c/em>\u003cspan>부상\u003c/span>\u003c/div>\u003cdiv>\u003cb>accident\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사고\u003c/span>\u003c/div>\u003cdiv>\u003cb>career\u003c/b>\u003cem>명사\u003c/em>\u003cspan>경력, 직업\u003c/span>\u003c/div>\u003cdiv>\u003cb>join\u003c/b>\u003cem>동사\u003c/em>\u003cspan>입대하다, 가입하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>evacuate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>대피시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>wounded\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>부상당한\u003c/span>\u003c/div>\u003cdiv>\u003cb>soldier\u003c/b>\u003cem>명사\u003c/em>\u003cspan>병사\u003c/span>\u003c/div>\u003cdiv>\u003cb>receive\u003c/b>\u003cem>동사\u003c/em>\u003cspan>받다\u003c/span>\u003c/div>\u003cdiv>\u003cb>medal\u003c/b>\u003cem>명사\u003c/em>\u003cspan>훈장\u003c/span>\u003c/div>\u003cdiv>\u003cb>be named after\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~의 이름을 따서 명명되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>horseback riding\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>승마\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"단어도 몇 개만 짚을게요. be forced to는 어쩔 수 없이 해야 한다는 뜻이고, due to는 때문이라는 뜻이에요. evacuate는 대피시키다, be named after는 이름을 따서 명명되다는 뜻이죠.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">frightened\u003c/b>\u003cspan class=\"m\">겁에 질린\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">scared\u003c/span>\u003cspan class=\"s\">afraid\u003c/span>\u003cspan class=\"s\">fearful\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">calm\u003c/span>\u003cspan class=\"a\">brave\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">suggest\u003c/b>\u003cspan class=\"m\">제안하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">propose\u003c/span>\u003cspan class=\"s\">recommend\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">demand\u003c/span>\u003cspan class=\"a\">order\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">quit\u003c/b>\u003cspan class=\"m\">그만두다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">give up\u003c/span>\u003cspan class=\"s\">resign\u003c/span>\u003cspan class=\"s\">leave\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">continue\u003c/span>\u003cspan class=\"a\">start\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">evacuate\u003c/b>\u003cspan class=\"m\">대피시키다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">rescue\u003c/span>\u003cspan class=\"s\">remove\u003c/span>\u003cspan class=\"s\">withdraw\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">remain\u003c/span>\u003cspan class=\"a\">stay\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">receive\u003c/b>\u003cspan class=\"m\">받다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">get\u003c/span>\u003cspan class=\"s\">obtain\u003c/span>\u003cspan class=\"s\">gain\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">give\u003c/span>\u003cspan class=\"a\">send\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">injury\u003c/b>\u003cspan class=\"m\">부상\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">wound\u003c/span>\u003cspan class=\"s\">harm\u003c/span>\u003cspan class=\"s\">damage\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">cure\u003c/span>\u003cspan class=\"a\">recovery\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">join\u003c/b>\u003cspan class=\"m\">가입하다, 입대하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">enter\u003c/span>\u003cspan class=\"s\">enlist\u003c/span>\u003cspan class=\"s\">participate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">leave\u003c/span>\u003cspan class=\"a\">withdraw\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 정리해 볼게요. frightened는 겁에 질린이라는 뜻으로 scared, afraid와 가깝고 calm과는 반대예요. suggest는 제안하다로 propose, recommend와 통하고, quit은 그만두다로 give up, resign과 비슷하죠. evacuate는 대피시키다로 rescue, remove와 가깝고, injury는 부상으로 wound, harm과 연결됩니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">엘렌 처치는\u003c/span>\u003cspan class=\"en\">Ellen Church\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">태어났다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">born\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아이오와 주 크레스코에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">Cresco, \u003c/span>\u003cspan class=\"tgt\">Iowa, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1904년에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">1904\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Ellen Church는 1904년 아이오와 주 크레스코에서 태어났다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 인물 소개 글의 첫 문장으로, 주인공의 출생지와 출생 연도를 제시하며 \u003cb class=\"key\">배경\u003c/b>을 깔아 줍니다. 'be born'은 수동태 모양이지만 '태어나다'로 굳어진 \u003cb class=\"key\">수동태\u003c/b> 관용 표현이에요. 장소 다음에 시간이 오는 \u003cb class=\"key\">영어 \u003c/b>\u003cb class=\"key\">어순\u003c/b>도 함께 익혀 두세요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태(be born: 태어나다)\u003c/span> : [[주어]] + was born + [전치사구] : be동사 + 과거분사([[수동태]]) : \"태어났다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 in의 쓰임(장소·시간)\u003c/span> : in + [장소] + in + [연도] : \"크레스코, 아이오와 주에서 / 1904년에\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Ellen Church, 엘렌 처치는. was born, 태어났다. in Cresco, Iowa, 아이오와 주 크레스코에서. in 1904, 1904년에. 이 문장 전체를 해석하면, Ellen Church는 1904년 아이오와 주 크레스코에서 태어났다.","hl":"m"},{"n":13,"text":"이 문장은 인물 소개 글의 첫 문장으로, 주인공의 출생지와 출생 연도를 알려 주면서 배경을 깔아 줘요. be born은 '태어나다'라는 뜻으로 수동태 모양이지만 수동의 느낌이 거의 사라진 표현이에요. 장소 다음에 시간이 오는 영어 어순도 같이 기억해 두세요.","hl":"mn"},{"n":14,"text":"첫 번째, was born은 be동사에 과거분사가 붙은 수동태 형태예요. 사람은 스스로 태어나는 게 아니라 태어남을 당하는 쪽이라서 수동태로 표현해요. 두 번째, 앞에 나온 in은 장소를, 뒤에 나온 in은 시간을 나타내요. 영어는 보통 장소를 먼저 말하고 시간을 뒤에 붙이는 어순을 가져요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">졸업한 후에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">After \u003c/span>\u003cspan class=\"tgt\">graduating\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고등학교를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">high \u003c/span>\u003cspan class=\"tgt\">school\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 공부했다\u003c/span>\u003cspan class=\"en\">she \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">studied \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">간호학을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">nursing\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">고등학교를 졸업한 후 그녀는 간호학을 공부했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 고등학교를 졸업한 뒤 간호학을 공부했다는 \u003cb class=\"key\">이력\u003c/b>을 더해 주는 문장이에요. After 뒤에 동명사 graduating이 와서 '~한 후에'라는 \u003cb class=\"key\">시간\u003c/b> 표현을 만들어요. 뒤에 이어질 간호사 활동의 \u003cb class=\"key\">배경\u003c/b>이 되는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 after + 동명사(~한 후에)\u003c/span> : After + [[동명사]] + [목적어] : 전치사 after의 목적어로 동명사구 : \"졸업한 후에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">graduate from(~을 졸업하다)\u003c/span> : graduate + [[from]] + [학교] : \"고등학교를 (졸업하다)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동명사의 명사화(간호학)\u003c/span> : study + [nursing (동명사가 명사로 굳어진 형태)] : \"간호학을 공부했다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"After graduating, 졸업한 후에. from high school, 고등학교를. she studied, 그녀는 공부했다. nursing, 간호학을. 이 문장 전체를 해석하면, 고등학교를 졸업한 후 그녀는 간호학을 공부했다.","hl":"m"},{"n":16,"text":"이 문장은 고등학교를 졸업한 뒤 간호학을 공부했다는 이력을 더해 줘요. After 뒤에 동명사가 와서 '한 후에'라는 시간 표현을 만든 구조예요. 뒤에 이어질 간호사 활동의 배경이 되는 문장이죠.","hl":"mn"},{"n":17,"text":"첫 번째, after는 여기서 전치사로 쓰여서 뒤에 동명사 graduating이 왔어요. 주절 주어 she와 graduating의 주체가 같아서 '그녀가 졸업한 후에'로 해석해요. 두 번째, graduate는 자동사라서 졸업한 학교 앞에 전치사 from을 붙여요. 학교에서 나오다라는 그림으로 이해하면 쉬워요. 세 번째, nursing은 동명사이지만 여기서는 간호학이라는 명사처럼 목적어 자리에 쓰였어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 일했다\u003c/span>\u003cspan class=\"en\">She \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">worked \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">간호사로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">nurse\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">샌프란시스코에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">San \u003c/span>\u003cspan class=\"tgt\">Francisco\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 샌프란시스코에서 간호사로 일했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 배운 간호학 공부가 실제 \u003cb class=\"key\">직업\u003c/b>으로 이어졌음을 보여 주는 문장이에요. as a nurse에서 as는 '~로서'라는 \u003cb class=\"key\">자격\u003c/b>을 나타내는 전치사예요. 뒤에 나올 병원 방문과 제안의 \u003cb class=\"key\">발판\u003c/b>이 되는 경력 설명입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 as(~로서)\u003c/span> : work + [[as]] + [직업명] : '~로서 일하다' : \"간호사로 일했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 in(장소)\u003c/span> : in + [도시·지역] : '~에서' : \"샌프란시스코에서\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"She worked, 그녀는 일했다. as a nurse, 간호사로. in San Francisco, 샌프란시스코에서. 이 문장 전체를 해석하면, 그녀는 샌프란시스코에서 간호사로 일했다.","hl":"m"},{"n":19,"text":"이 문장은 간호학 공부가 실제 직업으로 이어졌다는 걸 보여 줘요. as a nurse에서 as는 로서라는 자격을 나타내는 전치사예요. 뒤에 나올 병원 방문과 제안의 발판이 되는 경력 설명이죠.","hl":"mn"},{"n":20,"text":"첫 번째, as는 로서라는 자격을 나타내는 전치사예요. 직업을 말할 때는 a nurse처럼 관사를 붙여서 한 명의 간호사로서라는 느낌을 살려요. 두 번째, 도시처럼 넓은 장소 앞에는 전치사 in을 써서 그 범위 안에서라는 그림을 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어느 날\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">One \u003c/span>\u003cspan class=\"tgt\">day\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Ellen은 들렀다\u003c/span>\u003cspan class=\"en\">Ellen \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">stopped \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Boeing 사무실에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">at\u003c/span> the Boeing office.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어느 날 Ellen은 Boeing 사무실에 들렀다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Ellen이 Boeing 사무실에 우연히 들렀다는 장면을 열어 주는 문장이에요. 여기서 stop in은 단순히 '멈추다'가 아니라 \u003cb class=\"key\">들르다\u003c/b>라는 뜻으로 쓰였어요. 이 사소해 보이는 방문이 훗날 그녀가 \u003cb class=\"key\">승무원\u003c/b>이 되는 계기가 된다는 흐름을 기억하면 좋아요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간 부사구\u003c/span> : One day + [주어 + 동사] = 어느 날 ~했다 : \"어느 날\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">구동사 stop in + 전치사 at\u003c/span> : stop in [at + 장소] = [장소]에 들르다 : \"Boeing 사무실에 들렀다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"One day, 어느 날. Ellen stopped in, Ellen은 들렀다. at the Boeing office, Boeing 사무실에. 이 문장 전체를 해석하면, 어느 날 Ellen은 Boeing 사무실에 들렀다.","hl":"m"},{"n":22,"text":"이 문장은 Ellen이 Boeing 사무실에 우연히 들렀다는 장면을 열어 주는 문장이에요. 여기서 stop in은 그냥 멈추다가 아니라 잠깐 들르다라는 뜻이죠. 이 사소해 보이는 방문이 그녀가 세계 최초의 여성 승무원이 되는 계기가 된답니다.","hl":"mn"},{"n":23,"text":"먼저 stop in at은 잠깐 들르다라는 뜻의 구동사예요. stop을 멈추다로만 외우면 어색해지니까 들르다로 꼭 기억해 두세요. 두 번째로 One day는 어느 날이라는 시간 표현으로, 과거에 있었던 일을 이야기로 시작할 때 문장 앞에 놓는답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 물었다\u003c/span>\u003cspan class=\"en\">She asked\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일자리를 얻을 수 있는지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">if \u003c/span>\u003cspan class=\"tgt\">she \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">could \u003c/span>\u003cspan class=\"tgt\">get \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">job\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">간호사로서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">nurse\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 비행기에서\u003c/span>\u003cspan class=\"en\">on their airplanes.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 비행기에서 간호사로서의 일자리를 얻을 수 있는지 물었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Ellen이 Boeing 측에 직접 나서서 물었다는 내용이에요. 비행기 안에서 \u003cb class=\"key\">간호사\u003c/b>로 일할 수 있는지 물은 거죠. 이미 간호사 경력이 있던 그녀가 자기 \u003cb class=\"key\">경험\u003c/b>을 그대로 살리려 했다는 점이 중요해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">간접의문문을 이끄는 접속사 if\u003c/span> : ask + [if + 주어 + 동사] = ~인지 묻다 : \"일자리를 얻을 수 있는지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 could (시제 일치)\u003c/span> : 주절 과거동사 + [could + 동사원형] : \"얻을 수 있는지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 as (자격·역할)\u003c/span> : as + [관사 + 직업명사] = ~로서 : \"간호사로서\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"She asked, 그녀는 물었다. if she could get a job, 일자리를 얻을 수 있는지. as a nurse, 간호사로서. on their airplanes, 그들의 비행기에서. 이 문장 전체를 해석하면, 그녀는 비행기에서 간호사로서의 일자리를 얻을 수 있는지 물었다.","hl":"m"},{"n":25,"text":"Ellen이 Boeing 측에 직접 물었다는 내용이에요. 비행기 안에서 간호사로 일할 수 있는지 물은 거죠. 이미 간호사 경력이 있던 사람이라서 자기 경험을 그대로 살리고 싶었던 거예요.","hl":"mn"},{"n":26,"text":"첫 번째로 if she could get a job에서 if는 인지라는 뜻으로 의문문을 명사절로 만들어 주는 접속사예요. 그래서 ask 뒤에 if절이 와서 무엇인지 물었다는 구조가 된 거죠. 두 번째로 주절이 과거라서 can이 시제 일치로 could가 된 점을 꼭 기억하세요. 세 번째로 as a nurse에서 as는 간호사로서라는 자격을 나타내는 전치사랍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 15\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Ellen은 제안했다\u003c/span>\u003cspan class=\"en\">Ellen \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">suggested \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">간호사들이 돌봐야 한다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">nurses \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">take \u003c/span>\u003cspan class=\"tgt\">care \u003c/span>\u003cspan class=\"tgt\">of\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">겁에 질린 승객을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">frightened \u003c/span>\u003cspan class=\"tgt\">passengers\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">비행 중에\u003c/span>\u003cspan class=\"en\">during flights.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Ellen은 비행 중 겁에 질린 승객을 간호사가 돌봐야 한다고 제안했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Ellen이 단순히 일자리를 구한 것이 아니라 새로운 역할을 직접 \u003cb class=\"key\">제안\u003c/b>했다는 점이 핵심이에요. 비행 중 겁에 질린 승객을 간호사가 돌보면 좋겠다고 아이디어를 낸 거죠. 이 제안이 오늘날 \u003cb class=\"key\">승무원\u003c/b> 제도의 출발점이 되었다는 흐름까지 함께 잡아 두세요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">제안 동사 suggest + that절 (당위성 should 생략)\u003c/span> : suggest + [that + 주어 + (should) + 동사원형] : \"간호사들이 돌봐야 한다고 제안했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">구동사 take care of\u003c/span> : take care of + [목적어] = ~을 돌보다 : \"돌봐야 한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">감정분사 (과거분사 형용사)\u003c/span> : frightened + [명사] = 겁에 질린 ~ : \"겁에 질린 승객\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Ellen suggested, Ellen은 제안했다. that nurses take care of, 간호사들이 돌봐야 한다고. frightened passengers, 겁에 질린 승객을. during flights, 비행 중에. 이 문장 전체를 해석하면, Ellen은 비행 중 겁에 질린 승객을 간호사가 돌봐야 한다고 제안했다.","hl":"m"},{"n":28,"text":"Ellen이 단순히 일자리를 구한 게 아니라 새로운 역할을 직접 제안했다는 점이 핵심이에요. 비행 중 겁에 질린 승객을 간호사가 돌보면 좋겠다고 아이디어를 낸 거죠. 바로 이 제안이 오늘날 승무원 제도의 출발점이 되었답니다.","hl":"mn"},{"n":29,"text":"첫 번째로 suggested 뒤 that절에서 nurses take care of처럼 동사원형 take가 온 이유를 짚어 볼게요. suggest는 제안을 나타내는 동사라서 should가 생략되고 동사원형이 오는 거예요. 두 번째로 take care of는 돌보다라는 뜻으로 한 덩어리로 쓰는 구동사예요. 세 번째로 frightened passengers는 사람이 겁을 느낀 상태라서 과거분사 frightened로 표현한 거랍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 15\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1930년에\u003c/span>\u003cspan class=\"en\">In 1930,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 ~이 되었다\u003c/span>\u003cspan class=\"en\">she \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">became \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세계 최초의 여성 비행 승무원이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">world's \u003c/span>\u003cspan class=\"tgt\">first \u003c/span>\u003cspan class=\"tgt\">female \u003c/span>\u003cspan class=\"tgt\">flight \u003c/span>\u003cspan class=\"tgt\">attendant\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">1930년에 그녀는 세계 최초의 여성 비행 승무원이 되었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 Ellen Church가 \u003cb class=\"key\">세계 \u003c/b>\u003cb class=\"key\">최초\u003c/b>의 \u003cb class=\"key\">여성 \u003c/b>\u003cb class=\"key\">비행 \u003c/b>\u003cb class=\"key\">승무원\u003c/b>이 된 사건을 알려 줍니다. 앞에서 그녀가 Boeing 사무실에 찾아가 간호사로서 비행기에 타겠다고 제안했던 일이 있었죠. 그 제안이 실제 \u003cb class=\"key\">직업\u003c/b>으로 이어진 순간입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">2형식 동사 become + 명사 보어\u003c/span> : [[주어]] + become + [[명사(보어)]] (신분·상태의 변화) : \"세계 최초의 여성 비행 승무원이 되었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">소유격 world's와 서수+형용사 어순\u003c/span> : [[소유격]] + [[서수]] + 형용사 + 명사 : \"세계 최초의 여성 비행 승무원\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"In 1930, 1930년에. she became, 그녀는 ~이 되었다. the world's first female flight attendant, 세계 최초의 여성 비행 승무원이. 이 문장 전체를 해석하면, 1930년에 그녀는 세계 최초의 여성 비행 승무원이 되었다.","hl":"m"},{"n":31,"text":"이 문장은 Ellen Church가 세계 최초의 여성 비행 승무원이 된 순간을 보여 줍니다. 바로 앞에서 그녀가 Boeing 사무실을 찾아가 간호사로 비행기에 타게 해 달라고 제안했죠. 그 제안이 실제 직업으로 이어진 겁니다.","hl":"mn"},{"n":32,"text":"첫째, became은 2형식 동사라서 뒤에 명사 보어가 와요. 그래서 the world's first female flight attendant 전체가 보어 역할을 합니다. 둘째, the world's는 소유격이고 first는 서수라서 명사 앞에서 차례대로 꾸며 준다는 점도 같이 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 근무했다\u003c/span>\u003cspan class=\"en\">She worked\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보잉 80A 비행기에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">Boeing \u003c/span>\u003cspan class=\"tgt\">80A \u003c/span>\u003cspan class=\"tgt\">airplane\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오클랜드에서 시카고까지 비행하면서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">flying \u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">Oakland \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">Chicago\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 오클랜드에서 시카고까지 비행하면서 보잉 80A 비행기에서 근무했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 그녀가 어떤 비행기에서 어디서 어디까지 일했는지 구체적으로 알려 주는 문장이에요. 앞 문장에서 \u003cb class=\"key\">세계 \u003c/b>\u003cb class=\"key\">최초\u003c/b>의 \u003cb class=\"key\">여성 \u003c/b>\u003cb class=\"key\">비행 \u003c/b>\u003cb class=\"key\">승무원\u003c/b>이 되었다고 했으니, 이제 그 일이 실제로 \u003cb class=\"key\">어디서\u003c/b> 이루어졌는지를 보여 주는 거죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 on + 교통수단\u003c/span> : work on + [[교통수단]] (그 안에 타고 있는 상태) : \"보잉 80A 비행기에서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">분사구문(현재분사의 부대상황)\u003c/span> : [[현재분사]] (~ing) + 나머지 → 접속사와 주어를 생략한 [[분사구문]] : \"오클랜드에서 시카고까지 비행하면서\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"She worked, 그녀는 근무했다. on a Boeing 80A airplane, 보잉 80A 비행기에서. flying from Oakland to Chicago, 오클랜드에서 시카고까지 비행하면서. 이 문장 전체를 해석하면, 그녀는 오클랜드에서 시카고까지 비행하면서 보잉 80A 비행기에서 근무했다.","hl":"m"},{"n":34,"text":"그녀가 어떤 비행기에서 어디서 어디까지 일했는지 구체적으로 알려 주는 문장이에요. 앞 문장에서 세계 최초의 여성 비행 승무원이 되었다고 했으니, 이 문장은 그 일이 실제로 어디서 이루어졌는지를 보여 주는 겁니다.","hl":"mn"},{"n":35,"text":"첫째, flying from Oakland to Chicago는 분사구문이에요. 주절 주어 She와 flying의 주어가 같아서 접속사와 주어를 지우고 현재분사만 남겼습니다. 그래서 '비행하면서'라는 동시 상황으로 읽어요. 둘째, work on은 교통수단 앞에서 타고 있는 상태로 일한다는 뜻을 만들어서 비행기 안에서 근무했다고 해석합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 15\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 Ellen은\u003c/span>\u003cspan class=\"en\">Ellen, however,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">비행을 그만두어야 했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">forced \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">quit \u003c/span>\u003cspan class=\"tgt\">flying\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">18개월 후에\u003c/span>\u003cspan class=\"en\">after eighteen months,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">부상 때문에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">due \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">injury \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">교통사고로 인한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">car \u003c/span>\u003cspan class=\"tgt\">accident\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 Ellen은 교통사고 부상 때문에 18개월 후에 어쩔 수 없이 비행을 그만두어야 했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 \u003cb class=\"key\">세계 \u003c/b>\u003cb class=\"key\">최초\u003c/b>의 여성 비행 승무원이라는 성공담이 이어졌는데, however가 흐름을 \u003cb class=\"key\">반전\u003c/b>시키고 있어요. 그녀는 \u003cb class=\"key\">십팔 \u003c/b>\u003cb class=\"key\">개월\u003c/b>밖에 일하지 못하고 교통사고 부상 때문에 하늘을 떠나야 했습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태 + to부정사(be forced to V)\u003c/span> : [[주어]] + be forced + [[to부정사]] (강요되어 ~하게 되다) : \"비행을 그만두어야 했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사를 목적어로 갖는 동사 quit\u003c/span> : quit + [[동명사]] (~ing) (to부정사는 쓰지 않음) : \"비행을 그만두다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사구 due to (이유)\u003c/span> : due to + [[명사구]] = because of + 명사구 : \"교통사고로 인한 부상 때문에\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Ellen, however, 그러나 Ellen은. was forced to quit flying, 비행을 그만두어야 했다. after eighteen months, 18개월 후에. due to an injury, 부상 때문에. from a car accident, 교통사고로 인한. 이 문장 전체를 해석하면, 그러나 Ellen은 교통사고 부상 때문에 18개월 후에 어쩔 수 없이 비행을 그만두어야 했다.","hl":"m"},{"n":37,"text":"앞에서 세계 최초의 여성 비행 승무원이 되었다는 성공담이 나왔는데, however가 흐름을 반전시켜요. 그녀는 십팔 개월 만에 교통사고 부상 때문에 어쩔 수 없이 하늘을 떠나야 했습니다.","hl":"mn"},{"n":38,"text":"첫째, was forced to quit flying은 수동태에 to부정사가 붙은 형태예요. force A to V가 수동태가 되면 주어가 강요받는 쪽이 되어서 '어쩔 수 없이 ~해야 했다'가 됩니다. 둘째, quit 뒤에는 동명사 flying이 목적어로 와서 '비행을 그만두다'가 돼요. 셋째, due to는 전치사구로 뒤에 명사구를 데리고 와서 그만두게 된 원인을 덧붙여 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는\u003c/span>\u003cspan class=\"en\">She\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시작했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">started \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀의 간호사 일을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">her \u003c/span>\u003cspan class=\"tgt\">nursing \u003c/span>\u003cspan class=\"tgt\">career\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다시\u003c/span>\u003cspan class=\"en\">again\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">밀워키 카운티 병원에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">Milwaukee \u003c/span>\u003cspan class=\"tgt\">County \u003c/span>\u003cspan class=\"tgt\">Hospital\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 밀워키 카운티 병원에서 다시 간호사 일을 시작했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 Ellen이 비행을 그만둔 뒤 \u003cb class=\"key\">밀워키 \u003c/b>\u003cb class=\"key\">카운티 \u003c/b>\u003cb class=\"key\">병원\u003c/b>에서 \u003cb class=\"key\">간호사 \u003c/b>\u003cb class=\"key\">일\u003c/b>을 다시 시작했음을 전하는 문장이에요. 사건의 전환점을 보여 주며, 앞으로 그녀의 간호 경력이 이어진다는 흐름을 만들어 줍니다. 'nursing career'는 '간호 경력'이지만 학생용 해석처럼 '간호사 일'로 이해해도 좋아요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">3형식 문장(주어+동사+목적어)\u003c/span> : She [started] + [her nursing career (목적어)] : \"그녀의 간호사 일을 시작했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 용법(장소)\u003c/span> : at + [장소 명사] = ~에서 : \"밀워키 카운티 병원에서\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"She, 그녀는. started, 시작했다. her nursing career, 그녀의 간호사 일을. again, 다시. at Milwaukee County Hospital, 밀워키 카운티 병원에서. 이 문장 전체를 해석하면, 그녀는 밀워키 카운티 병원에서 다시 간호사 일을 시작했다.","hl":"m"},{"n":40,"text":"이 문장은 Ellen이 밀워키 카운티 병원에서 간호사 일을 다시 시작했다는 내용이에요. 비행을 그만둔 뒤에도 그녀의 간호 경력이 계속 이어진다는 흐름을 보여 주죠.","hl":"mn"},{"n":41,"text":"첫 번째로 started는 타동사라서 뒤에 목적어인 her nursing career가 와요. 그래서 그녀의 간호사 일을 시작했다로 해석해요. 두 번째로 at Milwaukee County Hospital은 전치사 at이 장소를 더해 주는 전치사구예요. 밀워키 카운티 병원이라는 장소에서라는 뜻을 만들어 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제2차 세계대전 중\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">During \u003c/span>\u003cspan class=\"tgt\">World \u003c/span>\u003cspan class=\"tgt\">War \u003c/span>\u003cspan class=\"tgt\">II\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Ellen은\u003c/span>\u003cspan class=\"en\">Ellen\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">육군 간호 부대에 입대했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">joined \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">Army \u003c/span>\u003cspan class=\"tgt\">Nurse \u003c/span>\u003cspan class=\"tgt\">Corps\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">제2차 세계대전 중 Ellen은 육군 간호 부대에 입대했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 Ellen이 \u003cb class=\"key\">제2차 \u003c/b>\u003cb class=\"key\">세계대전\u003c/b> 중 \u003cb class=\"key\">육군 \u003c/b>\u003cb class=\"key\">간호 \u003c/b>\u003cb class=\"key\">부대\u003c/b>에 입대했음을 알려 줘요. 간호사로서의 경험이 전쟁이라는 큰 사건과 연결되며, 이후 부상병 후송 활동의 배경이 됩니다. 'joined'는 여기서 단순한 '가입했다'보다 '\u003cb class=\"key\">입대했다\u003c/b>'로 풀어야 자연스러워요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 during + 명사구(시간)\u003c/span> : During + [기간·사건 명사구] : \"제2차 세계대전 중\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">3형식 문장(타동사 + 목적어)\u003c/span> : Ellen [joined] + [the Army Nurse Corps (목적어)] : \"육군 간호 부대에 입대했다\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"During World War II, 제2차 세계대전 중. Ellen, Ellen은. joined the Army Nurse Corps, 육군 간호 부대에 입대했다. 이 문장 전체를 해석하면, 제2차 세계대전 중 Ellen은 육군 간호 부대에 입대했다.","hl":"m"},{"n":43,"text":"이 문장은 Ellen이 제이차 세계대전 중 육군 간호 부대에 입대했다는 내용이에요. 간호사로서의 경험이 전쟁과 연결되면서 이후 부상병 후송 활동의 배경이 되죠.","hl":"mn"},{"n":44,"text":"첫 번째로 During World War Two에서 during은 특정 기간이나 사건 전체를 가리키는 전치사예요. 그래서 제이차 세계대전 중이라는 시간 의미를 만들어 줍니다. 두 번째로 joined는 여기서 입대하다라는 타동사로 쓰였고 뒤에 목적어인 the Army Nurse Corps가 와요. 그래서 육군 간호 부대에 입대했다로 해석해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 15\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 도왔다\u003c/span>\u003cspan class=\"en\">She \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">helped \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">부상당한 병사들을 대피시키는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">evacuate\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">wounded \u003c/span>\u003cspan class=\"tgt\">soldiers\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">비행기로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">airplane\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 부상당한 병사들을 비행기로 대피시키는 일을 도왔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 Ellen이 전쟁 중 \u003cb class=\"key\">부상당한 \u003c/b>\u003cb class=\"key\">병사들\u003c/b>을 \u003cb class=\"key\">비행기\u003c/b>로 대피시키는 일을 도왔다는 내용이에요. 그녀의 간호 경험과 비행 경험이 결합된 중요한 업적을 보여 주며, 이 공로로 훈장을 받는 흐름으로 이어집니다. 'helped evacuate'는 '대피시키는 것을 도왔다'로, help 뒤에 동사원형이 온 구조예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">help + 동사원형(목적격 보어)\u003c/span> : help + [(목적어) + 동사원형] : \"대피시키는 것을 도왔다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사 형용사\u003c/span> : [wounded (과거분사)] + [soldiers] : \"부상당한 병사들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 by + 교통수단\u003c/span> : by + [교통수단 명사] : \"비행기로\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"She helped, 그녀는 도왔다. evacuate wounded soldiers, 부상당한 병사들을 대피시키는 것을. by airplane, 비행기로. 이 문장 전체를 해석하면, 그녀는 부상당한 병사들을 비행기로 대피시키는 일을 도왔다.","hl":"m"},{"n":46,"text":"이 문장은 Ellen이 부상당한 병사들을 비행기로 대피시키는 일을 도왔다는 내용이에요. 간호 경험과 비행 경험이 함께 쓰인 중요한 업적이고, 이후 훈장을 받는 흐름으로 이어지죠.","hl":"mn"},{"n":47,"text":"첫 번째로 helped 뒤에 evacuate가 to 없이 바로 오는 원형부정사 형태예요. help 뒤에 동사원형이 와서 대피시키는 것을 돕다라는 의미를 만들어요. 두 번째로 wounded는 과거분사로 soldiers를 꾸며 부상당한이라는 수동의 의미를 더합니다. 세 번째로 by airplane은 교통수단 앞에 by를 쓰고 관사 없이 표현해서 비행기로라는 수단을 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 받았다\u003c/span>\u003cspan class=\"en\">She \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">received \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">항공 훈장을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">Air \u003c/span>\u003cspan class=\"tgt\">Medal\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 업적으로.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">this\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 이 업적으로 항공 훈장을 받았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 바로 앞에서 Ellen이 부상병을 비행기로 후송한 공적을 가리키는 문장입니다. 그 공로를 인정받아 \u003cb class=\"key\">항공 \u003c/b>\u003cb class=\"key\">훈장\u003c/b>을 받았다는 뜻으로, 군 간호사로서의 그녀의 활약을 정리해 주는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">타동사 + 목적어(3형식)\u003c/span> : receive [타동사] + [an Air Medal (목적어)] : \"항공 훈장을 받았다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 for의 이유 용법\u003c/span> : for + [this (지시대명사)] : \"이 업적으로\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"She received, 그녀는 받았다. an Air Medal, 항공 훈장을. for this, 이 업적으로.. 이 문장 전체를 해석하면, 그녀는 이 업적으로 항공 훈장을 받았다.","hl":"m"},{"n":49,"text":"앞 문장에서 Ellen이 부상병들을 비행기로 후송하며 큰일을 했죠. 그 공로를 인정받아 항공 훈장을 받았다는 뜻이에요. 그래서 이 문장은 군 간호사로서의 그녀의 활약을 마무리해 주는 역할을 합니다.","hl":"mn"},{"n":50,"text":"먼저 receive는 목적어 하나만 데리고 오는 타동사입니다. 그래서 주어 다음에 동사, 그다음 목적어가 오는 단순한 구조로 쓰였죠. 두 번째로 for this에서 for는 이유를 나타내는 전치사이고, this는 앞 문장의 공적을 가리키는 지시대명사예요. 그래서 '이 업적으로'라고 해석하는 겁니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 Ellen Church Field 공항은\u003c/span>\u003cspan class=\"en\">The Ellen Church Field Airport\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">크레스코에 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">Cresco\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">명명되었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">named \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀의 이름을 따서.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">after \u003c/span>\u003cspan class=\"tgt\">her\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">크레스코에 있는 Ellen Church Field 공항은 그녀의 이름을 따서 명명되었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 그녀의 고향인 크레스코에 있는 공항이 그녀의 이름을 따서 지어졌다는 내용입니다. 인물의 업적이 \u003cb class=\"key\">이름\u003c/b>으로 남았다는 점에서, 그녀가 지역 사회에서 얼마나 존경받았는지를 보여 주는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 용법(명사 수식)\u003c/span> : [The Ellen Church Field Airport] + [in Cresco (전치사구)] : \"크레스코에 있는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">name A after B의 수동태\u003c/span> : [The airport] + was + [named (과거분사)] + after + [her] : \"그녀의 이름을 따서 명명되었다\"\u003c/div>\u003c/div>","segs":[{"n":51,"text":"The Ellen Church Field Airport, 그 Ellen Church Field 공항은. in Cresco, 크레스코에 있는. was named, 명명되었다. after her, 그녀의 이름을 따서.. 이 문장 전체를 해석하면, 크레스코에 있는 Ellen Church Field 공항은 그녀의 이름을 따서 명명되었다.","hl":"m"},{"n":52,"text":"그녀의 고향인 크레스코에 있는 공항이 그녀의 이름을 따서 지어졌다는 내용이에요. 인물의 업적이 이름으로 남았다는 점에서, 그녀가 얼마나 존경받았는지 보여 주는 문장이죠.","hl":"mn"},{"n":53,"text":"먼저 in Cresco는 앞에 있는 Airport를 뒤에서 꾸며 주는 전치사구예요. 그래서 형용사처럼 '크레스코에 있는'이라고 해석하죠. 두 번째로 was named after her는 name A after B, 즉 A를 B의 이름을 따서 명명하다라는 표현이 수동태로 바뀐 형태예요. 이름을 받는 공항이 주어 자리로 나왔기 때문에 be동사와 과거분사가 쓰였고, 이름의 주인인 her는 after 뒤에 그대로 남아 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 15 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 사망했다\u003c/span>\u003cspan class=\"en\">She died\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">승마 사고로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">horseback \u003c/span>\u003cspan class=\"tgt\">riding \u003c/span>\u003cspan class=\"tgt\">accident\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1965년에.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">1965\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 1965년에 승마 사고로 사망했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 승마 사고로 세상을 떠난 그녀의 \u003cb class=\"key\">생애\u003c/b>를 맺는 마지막 문장입니다. 최초의 여성 승무원이자 군 간호사였던 인물의 이야기가 뜻밖의 사고로 끝난다는 점이 인상적입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 in + 사고 명사(원인)\u003c/span> : die + in + [a horseback riding accident (원인)] : \"승마 사고로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명사를 앞에서 꾸미는 복합 표현\u003c/span> : [horseback riding] + [accident] : \"승마\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">연도 앞 전치사 in\u003c/span> : in + [1965 (연도)] : \"1965년에\"\u003c/div>\u003c/div>","segs":[{"n":54,"text":"She died, 그녀는 사망했다. in a horseback riding accident, 승마 사고로. in 1965, 1965년에.. 이 문장 전체를 해석하면, 그녀는 1965년에 승마 사고로 사망했다.","hl":"m"},{"n":55,"text":"승마 사고로 세상을 떠난 그녀의 생애를 마무리하는 문장이에요. 최초의 여성 승무원이자 군 간호사였던 인물의 이야기가 사고라는 뜻밖의 결말로 끝난다는 점이 참 인상적이죠.","hl":"mn"},{"n":56,"text":"먼저 in a horseback riding accident에서 전치사 in은 사망의 원인을 나타냅니다. horseback riding은 승마라는 뜻으로 accident 앞에서 어떤 사고인지 알려 주는 복합명사 역할을 하고요. 그리고 연도 앞에도 전치사 in을 쓴다는 점, 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>Ellen Church는 1904년 아이오와 주 크레스코에서 태어나 고등학교를 졸업한 뒤 \u003cb class=\"key\">간호학\u003c/b>을 공부하고 샌프란시스코에서 간호사로 일했다.\u003c/li>\u003cli>그녀는 Boeing 사무실에 들러 비행기에서 간호사로 일하게 해 달라고 했고, 비행 중 \u003cb class=\"key\">겁에 \u003c/b>\u003cb class=\"key\">질린 \u003c/b>\u003cb class=\"key\">승객\u003c/b>을 간호사가 돌봐야 한다고 제안했다.\u003c/li>\u003cli>1930년 그녀는 세계 최초의 \u003cb class=\"key\">여성 \u003c/b>\u003cb class=\"key\">비행 \u003c/b>\u003cb class=\"key\">승무원\u003c/b>이 되었지만 교통사고 부상 때문에 18개월 후에 어쩔 수 없이 비행을 그만두었다.\u003c/li>\u003cli>제2차 세계대전 중 \u003cb class=\"key\">육군 \u003c/b>\u003cb class=\"key\">간호 \u003c/b>\u003cb class=\"key\">부대\u003c/b>에 입대해 부상당한 병사들을 비행기로 대피시키는 일을 도왔고, 그 공로로 \u003cb class=\"key\">항공 \u003c/b>\u003cb class=\"key\">훈장\u003c/b>을 받았다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Ellen Church, a nurse, became the world's first female flight attendant in 1930 and later served as an army nurse, earning an Air Medal.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: 간호사였던 Ellen Church는 비행 중 겁에 질린 승객을 간호사가 돌봐야 한다고 제안해 1930년 세계 최초의 \u003cb class=\"key\">여성 \u003c/b>\u003cb class=\"key\">비행 \u003c/b>\u003cb class=\"key\">승무원\u003c/b>이 되었고, 이후 \u003cb class=\"key\">육군 \u003c/b>\u003cb class=\"key\">간호 \u003c/b>\u003cb class=\"key\">부대\u003c/b>에서 부상당한 병사들을 비행기로 대피시키며 \u003cb class=\"key\">항공 \u003c/b>\u003cb class=\"key\">훈장\u003c/b>을 받은 인물이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":57,"text":"정리해 볼게요. Ellen Church는 간호사라는 전문성으로 승객을 돌보자는 제안을 했고, 그 제안이 세계 최초의 여성 비행 승무원이라는 새 직업을 열었어요. 이후에도 육군 간호 부대로 부상병을 도우며 항공 훈장까지 받았죠. 오늘 배운 시간순 구조와 신호어를 다른 지문에서도 꼭 활용해 보세요. 수고했어요, 다음 시간에 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
