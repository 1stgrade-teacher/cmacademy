t)이 됨</li><li>오클랜드에서 시카고까지 운행하는 보잉 80A에 탑승</li><li>자동차 사고 부상으로 인해 18개월 만에 비행을 그만둠</li><li>핵심 키워드: 비행 승무원(flight attendant), 사고(accident)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03전후 활동과 업적</div><ul><li>비행을 그만둔 후에도 그녀는 간호사로서 헌신하며 국가적 공로를 인정받았다.</li><li>밀워키 카운티 병원에서 간호 업무 재개</li><li>제2차 세계대전 중 군 간호 장교(Army Nurse Corps)로 복무</li><li>비행기로 부상병을 후송하는 공로로 공군 훈장(Air Medal) 수여</li><li>핵심 키워드: 간호 장교(Army Nurse Corps), 훈장(medal)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04사후의 기념</div><ul><li>엘렌 처치는 비극적인 사고로 생을 마감했으나 그녀의 이름은 역사에 남았다.</li><li>고향 크레스코의 공항 명칭이 그녀의 이름을 따서 명명됨</li><li>1965년 승마 사고로 사망</li><li>핵심 키워드: 엘렌 처치 공항(Ellen Church Field Airport)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">stop in</td><td class=\"m\">잠시 들르다, 잠깐 방문하다</td></tr><tr><td class=\"w\">take care of</td><td class=\"m\">~을 돌보다, ~을 처리하다</td></tr><tr><td class=\"w\">flight attendant</td><td class=\"m\">승무원, 비행기 객실 승무원</td></tr><tr><td class=\"w\">be forced to</td><td class=\"m\">어쩔 수 없이 ~하다, 강요받아 ~하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">due to</td><td class=\"m\">~때문에, ~으로 인한</td></tr><tr><td class=\"w\">evacuate</td><td class=\"m\">대피시키다, 철수시키다</td></tr><tr><td class=\"w\">name after</td><td class=\"m\">~의 이름을 따서 명명하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">엘렌 처치는</span><span class=\"en\"><b>Ellen Church</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">태어났다</span><span class=\"en\"><b><span class=\"grammar-hl\">was born</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아이오와 주 크레스코에서</span><span class=\"en\"><b>in Cresco, Iowa,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">1904년에</span><span class=\"en\"><b>in 1904.</b></span></div></div><div class=\"lec-sent-ko\">Ellen Church는 1904년 아이오와 주 크레스코에서 태어났다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 글의 주인공인 엘렌 처치의 출생지와 출생 연도를 밝히며, 그녀의 삶을 다루는 전기적 형식의 글이 시작됨을 알립니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was born (수동태): be동사(was)+p.p.(born) 구조. bear는 &#39;낳다&#39;라는 의미의 타동사인데 목적어가 없어서 수동구조 was born 형태로 쓴다. 기본구조: bear O (누구를 낳다).</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">고등학교를 졸업한 후</span><span class=\"en\"><b>After <span class=\"grammar-hl\">graduating</span> from high school,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀는 간호학을 공부했다</span><span class=\"en\"><b>she studied nursing.</b></span></div></div><div class=\"lec-sent-ko\">고등학교를 졸업한 후 그녀는 간호학을 공부했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 주인공이 성인이 된 후 선택한 첫 번째 진로를 소개하며, 이후 그녀가 간호사로서 활동하게 되는 배경을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">graduating (동명사): 전치사 &#39;After&#39;의 목적어 역할을 하며 &#39;졸업하는 것&#39;이라는 행위를 나타낸다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀는 일했다</span><span class=\"en\"><b>She <span class=\"grammar-hl\">worked</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">간호사로서</span><span class=\"en\"><b><span class=\"grammar-hl\">as a nurse</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">샌프란시스코에서</span><span class=\"en\"><b>in San Francisco.</b></span></div></div><div class=\"lec-sent-ko\">그녀는 샌프란시스코에서 간호사로 일했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 간호학을 공부한 주인공이 실제 현장에서 전문성을 쌓으며 사회생활을 시작했음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">worked as a nurse (관용표현): work as N 구조로 &#39;~로 일하다&#39;라는 의미의 직업이나 역할을 나타낼 때 쓰는 관용적 표현이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어느 날</span><span class=\"en\"><b>One day</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">엘렌은 들렀다</span><span class=\"en\"><b>Ellen <span class=\"grammar-hl\">stopped in</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">보잉 사무실에</span><span class=\"en\"><b><span class=\"grammar-hl\">at</span> the Boeing office.</b></span></div></div><div class=\"lec-sent-ko\">어느 날 Ellen은 Boeing 사무실에 들렀다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 주인공의 삶이 평범한 간호사에서 항공 업계로 전환되는 계기가 되는 장소로 그녀가 이동했음을 알립니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">stopped in at (관용표현): &#39;잠시 들르다&#39;라는 의미의 구동사(phrasal verb)이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀는 물었다</span><span class=\"en\"><b>She asked</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">일자리를 구할 수 있는지</span><span class=\"en\"><b><span class=\"grammar-hl\">if she could get a job</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">간호사로서</span><span class=\"en\"><b>as a nurse</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 비행기에서</span><span class=\"en\"><b>on their airplanes.</b></span></div></div><div class=\"lec-sent-ko\">그녀는 비행기에서 간호사로서의 일자리를 얻을 수 있는지 물었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 보잉사를 방문한 이유가 비행기라는 새로운 공간에 자신의 전문 분야인 간호 업무를 접목하려는 도전적인 제안이었음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">if she could get a job (간접의문문): ask의 목적어절로 &#39;인지 아닌지&#39;를 나타내는 명사절이다. if+주어(she)+동사(could get) 구조로 평서문 어순을 가진다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">엘렌은 제안했다</span><span class=\"en\"><b>Ellen <span class=\"grammar-hl\">suggested</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">간호사들이 돌봐야 한다고</span><span class=\"en\"><b><span class=\"grammar-hl\">that nurses take care of</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">겁에 질린 승객들을</span><span class=\"en\"><b>frightened passengers</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">비행 중에</span><span class=\"en\"><b>during flights.</b></span></div></div><div class=\"lec-sent-ko\">Ellen은 비행 중 겁에 질린 승객을 간호사가 돌봐야 한다고 제안했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 당시 비행은 대중에게 낯설고 두려운 경험이었기에, 간호사가 기내에 동승하여 승객을 심리적·신체적으로 안정시켜야 한다는 그녀의 구체적인 업무 아이디어를 담고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">suggested that nurses take care of 당위성 that절: suggest(제안하다) 같은 당위성을 나타내는 동사의 목적어 that절이며, 주어(nurses) 뒤에 should가 생략된 동사원형(take)이 쓰인 구조다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">take care of</td><td class=\"m\">~을 돌보다, ~을 처리하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">1930년에</span><span class=\"en\"><b>In 1930,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀는 되었다</span><span class=\"en\"><b>she <span class=\"grammar-hl\">became</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">세계 최초의 여성 비행 승무원이</span><span class=\"en\"><b>the world’s first female flight attendant.</b></span></div></div><div class=\"lec-sent-ko\">1930년에 그녀는 세계 최초의 여성 비행 승무원이 되었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 그녀의 제안이 실제 채용으로 이어져, 역사의 한 페이지를 장식하는 직업적인 성취를 거두었음을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">became 2형식 구조: S+V+C 구조로, Ellen Church가 &#39;세계 최초의 여성 비행 승무원이 되었다&#39;는 상태 변화를 설명한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">flight attendant</td><td class=\"m\">승무원, 비행기 객실 승무원</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀는 근무했다</span><span class=\"en\"><b>She worked</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">보잉 80A 비행기에서</span><span class=\"en\"><b>on a Boeing 80A airplane,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오클랜드에서 시카고까지 비행하면서</span><span class=\"en\"><b><span class=\"grammar-hl\">flying from Oakland to Chicago</span>.</b></span></div></div><div class=\"lec-sent-ko\">그녀는 오클랜드에서 시카고까지 비행하면서 보잉 80A 비행기에서 근무했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 그녀가 실제로 수행했던 구체적인 비행 노선과 기종을 언급하며, 당시 승무원으로서의 삶을 묘사합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">flying from Oakland to Chicago (현재분사(분사구문)): 앞 문장의 주어(She)가 비행기에서 &#39;비행을 하면서&#39;라는 동시동작을 나타낸다. 원래 절로 변환하면 &#39;while she was flying...&#39;으로 바꿀 수 있다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">엘렌은, 그러나</span><span class=\"en\"><b>Ellen, however,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">비행을 그만두어야 했다</span><span class=\"en\"><b><span class=\"grammar-hl\">was forced to quit</span> flying</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">18개월 후에</span><span class=\"en\"><b>after eighteen months,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">부상 때문에</span><span class=\"en\"><b>due to an injury</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자동차 사고로 인한</span><span class=\"en\"><b>from a car accident.</b></span></div></div><div class=\"lec-sent-ko\">그러나 Ellen은 교통사고 부상 때문에 18개월 후에 어쩔 수 없이 비행을 그만두어야 했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 승승장구하던 주인공의 항공 경력이 예기치 못한 사고로 인해 중단되었다는 안타까운 전환점을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was forced to quit (수동태): be동사(was)+p.p.(forced) 구조. force는 타동사로 force+O+toV(5형식) 구조인데, 목적어가 주어로 올라가 수동구조 was forced가 되고 뒤에 toV는 그대로 남는다. 기본구조: force A to V (A에게 ~하도록 강요하다).</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">due to</td><td class=\"m\">~때문에, ~으로 인한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀는 시작했다</span><span class=\"en\"><b>She <span class=\"grammar-hl\">started</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신의 간호사 경력을</span><span class=\"en\"><b><span class=\"grammar-hl\">her nursing career</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다시</span><span class=\"en\"><b>again</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">밀워키 카운티 병원에서</span><span class=\"en\"><b>at Milwaukee County Hospital.</b></span></div></div><div class=\"lec-sent-ko\">그녀는 밀워키 카운티 병원에서 다시 간호사 일을 시작했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 비행기 승무원이라는 특별한 경력 이후, 본래의 직업이었던 간호 업무로 복귀하여 다시 삶을 이어갔음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">started her nursing career (동명사(명사적)): nursing이 뒤의 career를 수식하여 &#39;간호(활동) 경력&#39;이라는 명사적 의미의 복합적 개념을 형성한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 11 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">제2차 세계대전 중</span><span class=\"en\"><b>During World War II,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">엘렌은 입대했다</span><span class=\"en\"><b>Ellen <span class=\"grammar-hl\">joined</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">육군 간호 부대에</span><span class=\"en\"><b>the Army Nurse Corps.</b></span></div></div><div class=\"lec-sent-ko\">제2차 세계대전 중 Ellen은 육군 간호 부대에 입대했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 국가적인 위기 상황에서 전문 지식을 가진 간호사로서 사회적 책임을 다하는 주인공의 새로운 행보를 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">joined 3형식 구조: S+V+O 구조로, 전치사 없이 목적어(the Army Nurse Corps)를 바로 취하는 타동사이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 12 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀는 도왔다</span><span class=\"en\"><b>She <span class=\"grammar-hl\">helped</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">부상당한 병사들을 대피시키는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">evacuate</span> wounded soldiers</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">비행기로</span><span class=\"en\"><b>by airplane.</b></span></div></div><div class=\"lec-sent-ko\">그녀는 부상당한 병사들을 비행기로 대피시키는 일을 도왔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 승무원으로서 비행기를 탔던 과거의 경험이 전쟁터에서 부상병을 살리는 중요한 전문 기술로 다시 활용되었음을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">helped evacuate 5형식 구조: S+V+O+OC 구조에서 help는 목적보어로 to부정사 또는 동사원형(evacuate)을 취하며, 여기서는 동사원형이 쓰였다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">evacuate</td><td class=\"m\">대피시키다, 철수시키다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 13 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀는 받았다</span><span class=\"en\"><b>She <span class=\"grammar-hl\">received</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">항공 훈장을</span><span class=\"en\"><b>an Air Medal</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이것으로</span><span class=\"en\"><b>for this.</b></span></div></div><div class=\"lec-sent-ko\">그녀는 이 업적으로 항공 훈장을 받았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 전쟁 중 그녀가 수행한 구조 활동의 공로를 국가로부터 인정받았음을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">received 3형식 구조: S+V+O 구조로, 주어가 목적어(an Air Medal)를 받는 동작을 나타낸다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 14 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">엘렌 처치 필드 공항은</span><span class=\"en\"><b>The Ellen Church Field Airport</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">크레스코에 있는</span><span class=\"en\"><b>in Cresco</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이름 지어졌다</span><span class=\"en\"><b><span class=\"grammar-hl\">was named</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀를 따서</span><span class=\"en\"><b><span class=\"grammar-hl\">after her</span>.</b></span></div></div><div class=\"lec-sent-ko\">크레스코에 있는 Ellen Church Field 공항은 그녀의 이름을 따서 명명되었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 그녀가 고향을 비롯한 사회 전반에 끼친 영향력을 기리기 위해 그녀의 이름이 공항 시설에 남게 되었음을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was named after her (수동태): be동사(was)+p.p.(named) 구조. name은 타동사로 name+O+after+B(O를 B의 이름을 따서 명명하다) 구조인데 목적어가 주어로 올라가 was named가 되었다. 기본구조: name A after B.</div></div>\n        ","<div class=\"lec-sent-no\">문장 15 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀는 사망했다</span><span class=\"en\"><b>She died</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">승마 사고로</span><span class=\"en\"><b>in a <span class=\"grammar-hl\">horseback riding</span> accident</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">1965년에</span><span class=\"en\"><b>in 1965.</b></span></div></div><div class=\"lec-sent-ko\">그녀는 1965년에 승마 사고로 사망했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 주인공의 삶이 마무리되는 시점과 그 경위를 담담하게 전하며 글을 맺습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">horseback riding (동명사(명사적)): &#39;말을 타는 것&#39;이라는 활동 자체를 나타내며, 뒤의 accident를 꾸며주는 명사적 용법의 복합명사구이다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>엘렌 처치는 간호사로 일하다가 보잉사에 비행기 내 간호사 근무를 제안했다.</li><li>그 결과 세계 최초의 여성 승무원이 되었고, 기내 승객 케어라는 새로운 분야를 개척했다.</li><li>사고로 승무원을 그만둔 뒤에는 전쟁터에서 간호사로 활약하며 부상병을 구호했다.</li><li>그녀의 이름을 딴 공항이 생길 정도로 그 공로를 인정받았으며, 사후에도 영웅으로 기억되고 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Ellen Church became the world’s first flight attendant by introducing nursing to aviation, and she later served as an army nurse during World War II.</div>\n              <div class=\"lec-final-sum-ko\">엘렌 처치는 항공 분야에 간호 업무를 도입하여 세계 최초의 항공 승무원이 되었으며, 이후 제2차 세계 대전 중에는 육군 간호사로 복무했다.</div></div></div>"],"segs":[[{"audio":"./reading19_audio/1.mp3","hl":null}],[{"audio":"./reading19_audio/2.mp3","hl":null}],[{"audio":"./reading19_audio/3.mp3","hl":null},{"audio":"./reading19_audio/4.mp3","hl":"stage-0"},{"audio":"./reading19_audio/5.mp3","hl":"stage-1"},{"audio":"./reading19_audio/6.mp3","hl":"stage-2"},{"audio":"./reading19_audio/7.mp3","hl":"stage-3"}],[{"audio":"./reading19_audio/8.mp3","hl":null}],[{"audio":"./reading19_audio/9.mp3","hl":"main"},{"audio":"./reading19_audio/10.mp3","hl":"meaning"},{"audio":"./reading19_audio/11.mp3","hl":"grammar"}],[{"audio":"./reading19_audio/12.mp3","hl":"main"},{"audio":"./reading19_audio/13.mp3","hl":"meaning"},{"audio":"./reading19_audio/14.mp3","hl":"grammar"}],[{"audio":"./reading19_audio/15.mp3","hl":"main"},{"audio":"./reading19_audio/16.mp3","hl":"meaning"},{"audio":"./reading19_audio/17.mp3","hl":"grammar"}],[{"audio":"./reading19_audio/18.mp3","hl":"main"},{"audio":"./reading19_audio/19.mp3","hl":"meaning"},{"audio":"./reading19_audio/20.mp3","hl":"grammar"}],[{"audio":"./reading19_audio/21.mp3","hl":"main"},{"audio":"./reading19_audio/22.mp3","hl":"meaning"},{"audio":"./reading19_audio/23.mp3","hl":"grammar"}],[{"audio":"./reading19_audio/24.mp3","hl":"main"},{"audio":"./reading19_audio/25.mp3","hl":"meaning"},{"audio":"./reading19_aud
