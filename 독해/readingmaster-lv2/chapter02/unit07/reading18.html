  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터2 Reading18","audioDir":"reading18_audio","preview":false,"count":43,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.520em\">Reading18\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터2\u003c/div>\u003ch1>The Secret: A Treasure Hunt\u003c/h1>\u003ch2>비밀: 보물 찾기\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>\u003cb class=\"key\">Byron \u003c/b>\u003cb class=\"key\">Preiss\u003c/b>의 책 ‘The Secret: A Treasure Hunt’는 미국과 캐나다에 묻힌 12개의 \u003cb class=\"key\">보물 \u003c/b>\u003cb class=\"key\">상자\u003c/b>와 이를 찾기 위한 \u003cb class=\"key\">그림과 \u003c/b>\u003cb class=\"key\">시\u003c/b>의 단서를 담고 있다. 2023년까지 \u003cb class=\"key\">세 \u003c/b>\u003cb class=\"key\">개의 \u003c/b>\u003cb class=\"key\">상자\u003c/b>만 발견되었고, Preiss가 남기지 않은 \u003cb class=\"key\">정확한 \u003c/b>\u003cb class=\"key\">위치\u003c/b> 때문에 많은 사람들이 여전히 \u003cb class=\"key\">보물들을 \u003c/b>\u003cb class=\"key\">찾고\u003c/b> 있다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The book The Secret: A Treasure Hunt contains clues to buried treasures, but because their exact locations were never recorded, many people are still searching for them.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 The Secret라는 책을 통해 실제 보물찾기 이야기를 읽어 볼 거예요. 이 글은 Byron Preiss가 만든 책과 열두 개의 보물 상자, 그림과 시의 단서, 그리고 지금까지 발견된 세 개의 상자와 정확한 위치가 기록되지 않은 사실을 다뤄요. 많은 사람이 여전히 보물들을 찾고 있다는 점이 글의 핵심이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">이 글은 책을 매개로 한 실제 \u003cb class=\"key\">보물찾기\u003c/b>(treasure hunt) 이야기예요. 1980년대에 Byron Preiss는 미국과 캐나다 여러 도시에 작은 상자를 묻고, 책 속 그림과 시에 \u003cb class=\"key\">단서\u003c/b>(clue)를 숨겼어요. 독자들은 그림과 시가 가리키는 장소를 해석해 상자를 찾아야 하고, 상자 안의 열쇠는 뉴욕의 \u003cb class=\"key\">안전 \u003c/b>\u003cb class=\"key\">금고\u003c/b>(safe deposit box)에 있는 보석과 교환할 수 있었죠. 이런 방식은 실제 장소를 찾아가는 \u003cb class=\"key\">위치 \u003c/b>\u003cb class=\"key\">기반 \u003c/b>\u003cb class=\"key\">놀이\u003c/b>(geocaching)와 비슷해요. 마치 친구가 교실 곳곳에 쪽지 단서를 숨겨 두고 “그림이 가리키는 곳을 찾아봐”라고 하는 것과 같아요. 핵심은 \u003cb class=\"key\">그림의 \u003c/b>\u003cb class=\"key\">상징\u003c/b>과 시의 표현을 해석해 실제 장소를 알아내는 것이고, 그래서 많은 사람이 아직도 탐색을 계속한다는 점이에요.\u003c/div>","segs":[{"n":2,"text":"이 이야기는 책을 매개로 한 실제 보물찾기예요. Byron Preiss는 미국과 캐나다 여러 도시에 작은 상자를 묻고 책 속 그림과 시에 단서를 숨겼어요. 독자들은 그림과 시가 가리키는 장소를 해석해 상자를 찾아야 하고, 상자 안의 열쇠는 뉴욕의 안전 금고에 있는 보석과 교환할 수 있었죠. 이런 방식은 실제 장소를 찾아가는 위치 기반 놀이인 geocaching과 비슷해요. 마치 친구가 교실 곳곳에 쪽지 단서를 숨겨 두고 그림이 가리키는 곳을 찾아보라고 하는 것과 같아요. 핵심은 그림의 상징과 시의 표현을 해석해 실제 장소를 알아내는 것이고, 그래서 많은 사람이 아직도 탐색을 계속한다는 점이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>책과 12개의 상자\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>1982년 Byron Preiss는 ‘The Secret: A Treasure Hunt’라는 책을 만들고, 출판 전에 미국과 캐나다 전역에 12개의 작은 \u003cb class=\"key\">보물 \u003c/b>\u003cb class=\"key\">상자\u003c/b>를 묻었어요. 각 상자에는 뉴욕의 안전 금고에 있는 12개의 보석 중 하나와 교환할 수 있는 \u003cb class=\"key\">작은 \u003c/b>\u003cb class=\"key\">열쇠\u003c/b>가 들어 있었죠. 이 단계에서 책과 실제 보물이 연결된 특별한 \u003cb class=\"key\">보물찾기\u003c/b>의 틀이 제시돼요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>그림과 시의 단서\u003csmall>근거 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>책에는 12개의 신비한 그림과 시가 실려 있어요. 그것들은 파묻힌 보물의 위치를 가리키는 \u003cb class=\"key\">정보\u003c/b>를 담고 있죠. 즉 그림과 시가 보물을 찾는 핵심 \u003cb class=\"key\">단서\u003c/b> 역할을 한다는 점이 중요해요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>Bellflower Road 예시\u003csmall>예시 · 문장 6\u003c/small>\u003c/h4>\u003cp>한 그림에 나오는 꽃과 종이 Cleveland의 Bellflower Road를 상징한다는 예시가 나와요. flower와 bell을 합쳐 지명을 떠올리게 하는 방식이죠. 이처럼 그림 속 \u003cb class=\"key\">상징\u003c/b>을 실제 \u003cb class=\"key\">지명\u003c/b>과 연결해 해석해야 해요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>세 상자의 발견\u003csmall>근거 · 문장 7–8\u003c/small>\u003c/h4>\u003cp>2023년까지 12개의 상자 중 오직 세 개만 발견되었어요. 시카고 Grant Park에서 1983년, Cleveland의 그리스 문화 정원에서 2004년, 보스턴 Langone Park에서 2019년에 발견되었죠. 이는 보물찾기가 오랜 시간 이어졌지만 \u003cb class=\"key\">발견된 \u003c/b>\u003cb class=\"key\">상자\u003c/b>는 매우 적다는 것을 보여 줘요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>기록 없는 보물과 현재\u003csmall>결론 · 문장 9–10\u003c/small>\u003c/h4>\u003cp>Preiss는 2005년 자동차 사고로 갑작스럽게 사망하기 전 보물의 \u003cb class=\"key\">정확한 \u003c/b>\u003cb class=\"key\">위치\u003c/b>를 기록으로 남기지 않았어요. 그래서 많은 사람들이 여전히 그 보물들을 \u003cb class=\"key\">찾고\u003c/b> 있어요. 단서는 남아 있지만 정답이 공개되지 않아 탐색이 계속되는 거죠.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 책과 상자, 그림과 시의 단서, 발견된 상자, 그리고 현재의 탐색 순서로 살펴볼게요.","hl":null},{"n":4,"text":"첫 단계는 책과 열두 개의 보물 상자예요. 천구백팔십이 년에 Byron Preiss는 The Secret라는 책을 만들고, 책이 출판되기 전에 미국과 캐나다 전역에 열두 개의 작은 보물 상자를 묻었어요. 각 상자에는 뉴욕의 안전 금고에 있는 보석과 교환할 수 있는 작은 열쇠가 들어 있었죠. 이렇게 책과 실제 보물을 연결한 보물찾기의 틀이 제시돼요.","hl":"f0"},{"n":5,"text":"다음 단계는 그림과 시의 단서예요. 책에는 열두 개의 신비한 그림과 시가 실려 있고, 그것들은 파묻힌 보물의 위치를 가리키는 정보를 담고 있어요. 다시 말해 그림과 시가 보물을 찾는 핵심 단서 역할을 한다는 점이 중요해요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 Bellflower Road 예시예요. 한 그림에 나오는 꽃과 종이 Cleveland의 Bellflower Road를 상징한다는 예시가 나와요. flower와 bell을 합쳐 지명을 떠올리게 하는 방식이죠. 이처럼 그림 속 상징을 실제 지명과 연결해 해석해야 해요.","hl":"f2"},{"n":7,"text":"네 번째 단계는 세 상자의 발견이에요. 이천이십삼 년까지 열두 개의 상자 중 오직 세 개만 발견되었어요. 시카고의 Grant Park에서 천구백팔십삼 년, Cleveland의 그리스 문화 정원에서 이천사 년, 보스턴의 Langone Park에서 이천십구 년에 발견되었죠. 이는 보물찾기가 오랜 시간 이어졌지만 발견된 상자는 매우 적다는 것을 보여 줘요.","hl":"f3"},{"n":8,"text":"마지막 단계는 기록 없는 보물과 현재의 탐색이에요. Preiss는 이천오 년 자동차 사고로 갑작스럽게 사망하기 전 보물의 정확한 위치를 기록으로 남기지 않았어요. 그래서 많은 사람들이 여전히 그 보물들을 찾고 있어요. 단서는 남아 있지만 정답이 공개되지 않아 탐색이 계속되는 거죠.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 10번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 1982년의 책 출간 전 상황에서 시작해 상자가 묻히고 발견된 시점, Preiss의 사망 이후 현재까지 이어지는 \u003cb class=\"key\">시간순\u003c/b> 전개를 보여 줘요. 처음에는 책과 보물 상자 이야기를 제시하고, 중간에는 그림과 시의 단서와 발견 사례를 제시하죠. 마지막 문장에서 많은 사람이 여전히 보물을 찾고 있다는 점을 드러내므로 결론을 끝에 두는 \u003cb class=\"key\">미괄식\u003c/b> 구조로 볼 수 있어요. 이 글의 중심에는 책과 실제 장소를 연결한 \u003cb class=\"key\">보물찾기\u003c/b>가 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Before (2)\u003c/b>\u003cspan>시간 관계\u003c/span>\u003cb>For example (6)\u003c/b>\u003cspan>예시 제시\u003c/span>\u003cb>Up to the year of 2023 (7)\u003c/b>\u003cspan>범위 제시\u003c/span>\u003cb>the most recent (8)\u003c/b>\u003cspan>발견 순서의 마지막 표시\u003c/span>\u003cb>still (10)\u003c/b>\u003cspan>현재까지 계속됨\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">a book\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the book\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the buried treasures\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the twelve boxes\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the treasures' exact locations\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">those treasures\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"이 글은 책이 만들어진 때부터 상자가 묻히고 발견된 시점, 그리고 Preiss의 사망 이후 현재까지 이어지는 시간순 전개예요. 처음에는 책과 보물 상자 이야기를 제시하고, 중간에는 그림과 시의 단서와 발견 사례를 보여 주죠. 마지막 문장에서 많은 사람이 여전히 보물을 찾고 있다는 점을 드러내므로 미괄식 구조로 볼 수 있어요. 그래서 보물찾기의 의미와 현재 상황을 마지막 문장에서 확인하는 것이 중요해요.","hl":"ty"},{"n":10,"text":"Before는 책이 출판되기 전이라는 시간 관계를 알려 주고, For example은 Bellflower Road 예시를 시작해요. Up to the year of two thousand twenty three은 범위를, the most recent는 발견 순서의 마지막을 표시하죠. 또 the twelve boxes와 those treasures처럼 같은 대상을 다른 표현으로 이어 주는 재진술이 보여요. 이 글은 뚜렷한 대조보다 시간의 흐름과 예시로 내용을 전개한다는 점도 기억해 두세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>created\u003c/b>\u003cem>동사\u003c/em>\u003cspan>창작하다, 만들다\u003c/span>\u003c/div>\u003cdiv>\u003cb>publish\u003c/b>\u003cem>동사\u003c/em>\u003cspan>출판하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>bury\u003c/b>\u003cem>동사\u003c/em>\u003cspan>묻다\u003c/span>\u003c/div>\u003cdiv>\u003cb>across\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~전역에, ~을 가로질러\u003c/span>\u003c/div>\u003cdiv>\u003cb>exchange for\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~와 교환하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>jewel\u003c/b>\u003cem>명사\u003c/em>\u003cspan>보석\u003c/span>\u003c/div>\u003cdiv>\u003cb>safe deposit box\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>안전 금고\u003c/span>\u003c/div>\u003cdiv>\u003cb>mysterious\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>신비한\u003c/span>\u003c/div>\u003cdiv>\u003cb>painting\u003c/b>\u003cem>명사\u003c/em>\u003cspan>그림\u003c/span>\u003c/div>\u003cdiv>\u003cb>poem\u003c/b>\u003cem>명사\u003c/em>\u003cspan>시\u003c/span>\u003c/div>\u003cdiv>\u003cb>contain\u003c/b>\u003cem>동사\u003c/em>\u003cspan>담고 있다, 포함하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>information\u003c/b>\u003cem>명사\u003c/em>\u003cspan>정보\u003c/span>\u003c/div>\u003cdiv>\u003cb>indicate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>가리키다, 나타내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>location\u003c/b>\u003cem>명사\u003c/em>\u003cspan>위치\u003c/span>\u003c/div>\u003cdiv>\u003cb>for example\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>예를 들어\u003c/span>\u003c/div>\u003cdiv>\u003cb>image\u003c/b>\u003cem>명사\u003c/em>\u003cspan>그림, 이미지\u003c/span>\u003c/div>\u003cdiv>\u003cb>stand for\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>상징하다, 나타내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>up to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~까지\u003c/span>\u003c/div>\u003cdiv>\u003cb>discover\u003c/b>\u003cem>동사\u003c/em>\u003cspan>발견하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>cultural\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>문화의\u003c/span>\u003c/div>\u003cdiv>\u003cb>recent\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>최근의\u003c/span>\u003c/div>\u003cdiv>\u003cb>leave\u003c/b>\u003cem>동사\u003c/em>\u003cspan>남기다\u003c/span>\u003c/div>\u003cdiv>\u003cb>record\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기록\u003c/span>\u003c/div>\u003cdiv>\u003cb>exact\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>정확한\u003c/span>\u003c/div>\u003cdiv>\u003cb>sudden\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>갑작스러운\u003c/span>\u003c/div>\u003cdiv>\u003cb>death\u003c/b>\u003cem>명사\u003c/em>\u003cspan>죽음, 사망\u003c/span>\u003c/div>\u003cdiv>\u003cb>car accident\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>자동차 사고\u003c/span>\u003c/div>\u003cdiv>\u003cb>still\u003c/b>\u003cem>부사\u003c/em>\u003cspan>여전히\u003c/span>\u003c/div>\u003cdiv>\u003cb>look for\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>찾다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"bury는 묻다, exchange for는 교환하다, contain은 담고 있다, indicate는 가리키다는 뜻이에요. 특히 stand for는 상징하다로, discover는 발견하다로 기억해 두세요. exact는 정확한, sudden은 갑작스러운이라는 뜻이라서 마지막 문장의 의미를 잡는 데 중요해요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">bury\u003c/b>\u003cspan class=\"m\">묻다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">inter\u003c/span>\u003cspan class=\"s\">cover\u003c/span>\u003cspan class=\"s\">conceal\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unearth\u003c/span>\u003cspan class=\"a\">exhume\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">mysterious\u003c/b>\u003cspan class=\"m\">신비한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">puzzling\u003c/span>\u003cspan class=\"s\">enigmatic\u003c/span>\u003cspan class=\"s\">secret\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">clear\u003c/span>\u003cspan class=\"a\">obvious\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">contain\u003c/b>\u003cspan class=\"m\">담고 있다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">include\u003c/span>\u003cspan class=\"s\">hold\u003c/span>\u003cspan class=\"s\">comprise\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">exclude\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">indicate\u003c/b>\u003cspan class=\"m\">가리키다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">show\u003c/span>\u003cspan class=\"s\">point to\u003c/span>\u003cspan class=\"s\">signal\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hide\u003c/span>\u003cspan class=\"a\">conceal\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">discover\u003c/b>\u003cspan class=\"m\">발견하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">find\u003c/span>\u003cspan class=\"s\">uncover\u003c/span>\u003cspan class=\"s\">locate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">lose\u003c/span>\u003cspan class=\"a\">hide\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">exact\u003c/b>\u003cspan class=\"m\">정확한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">precise\u003c/span>\u003cspan class=\"s\">accurate\u003c/span>\u003cspan class=\"s\">specific\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">approximate\u003c/span>\u003cspan class=\"a\">vague\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">sudden\u003c/b>\u003cspan class=\"m\">갑작스러운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">abrupt\u003c/span>\u003cspan class=\"s\">unexpected\u003c/span>\u003cspan class=\"s\">swift\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">gradual\u003c/span>\u003cspan class=\"a\">expected\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"bury의 동의어는 inter, cover, conceal이고 반의어는 unearth, exhume예요. mysterious는 puzzling, enigmatic, secret과 가깝고 clear, obvious와 반대죠. indicate는 show, point to, signal로 바꿔 말할 수 있고 hide, conceal과는 반대예요. discover는 find, uncover, locate와 비슷하고 exact는 precise, accurate, specific처럼 쓸 수 있어요. 마지막으로 sudden은 abrupt, unexpected와 가깝고 gradual, expected와 반대라는 점을 기억하세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">'비밀: 보물 찾기'는\u003c/span>\u003cspan class=\"en\">The Secret: A Treasure Hunt\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">책이다\u003c/span>\u003cspan class=\"en\">is a book\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Byron Preiss에 의해 창작된\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">created \u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">Byron \u003c/span>\u003cspan class=\"tgt\">Preiss\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1982년에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">1982\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">‘비밀: 보물 찾기’는 Byron Preiss에 의해 1982년에 창작된 책이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 책의 제목과 저자, 창작 연도를 한 번에 소개하는 첫 문장이에요. \u003cb class=\"key\">1982년\u003c/b>에 \u003cb class=\"key\">Byron \u003c/b>\u003cb class=\"key\">Preiss\u003c/b>가 만든 책이라는 정보를 먼저 제시하면서 보물찾기 이야기의 배경을 열어 주죠. 뒤에 이어질 보물 매장 사건의 출발점 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사구의 형용사적 용법(후치 수식)\u003c/span> : [명사 a book] + [created by + 행위자 (과거분사구)] : \"Byron Preiss에 의해 창작된\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 용법(시점)\u003c/span> : [주어+동사+명사구] + in + [연도] : \"1982년에\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"The Secret: A Treasure Hunt, '비밀: 보물 찾기'는. is a book, 책이다. created by Byron Preiss, Byron Preiss에 의해 창작된. in 1982, 1982년에. 이 문장 전체를 해석하면, ‘비밀: 보물 찾기’는 Byron Preiss에 의해 1982년에 창작된 책이다.","hl":"m"},{"n":14,"text":"이 문장은 어떤 책이 누가 언제 만든 책인지 소개하고 있어요. 천 구백팔십이 년에 Byron Preiss가 만든 책이라고 밝히면서 보물찾기 이야기의 시작을 알리는 거죠. 뒤에 이어질 보물 묻기 사건의 배경을 깔아 주는 문장입니다.","hl":"mn"},{"n":15,"text":"먼저 created by Byron Preiss를 보세요. 앞에 있는 명사 a book을 뒤에서 꾸며 주는 과거분사구예요. 책은 창작되는 대상이니까 수동의 느낌을 담아 created를 쓴 겁니다. 그리고 in 1982는 시점을 알려 주는 전치사구로 문장 전체를 꾸며 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 책이 출판되기 전에,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Before \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">book \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">published\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Preiss는 묻었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">Preiss \u003c/span>\u003cspan class=\"tgt\">buried \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">12개의 작은 보물 상자를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">12 \u003c/span>\u003cspan class=\"tgt\">small \u003c/span>\u003cspan class=\"tgt\">treasure \u003c/span>\u003cspan class=\"tgt\">boxes\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미국과 캐나다 전역에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">across \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">United \u003c/span>\u003cspan class=\"tgt\">States \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">Canada\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 책이 출판되기 전에, Preiss는 12개의 작은 보물 상자를 미국과 캐나다 전역에 묻었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 책이 세상에 나오기 전에 Preiss가 직접 보물 상자를 숨겼다는 사실을 알려 주는 문장이에요. \u003cb class=\"key\">출판\u003c/b> 이전에 이미 \u003cb class=\"key\">12개의 \u003c/b>\u003cb class=\"key\">상자\u003c/b>를 미국과 캐나다 전역에 묻었다는 점이 이 이야기의 핵심 설정이죠. 앞 문장의 책 소개에 이어, 책의 배경 사건으로 자연스럽게 넘어갑니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 Before + 시간 부사절(수동태)\u003c/span> : Before + [주어 + be동사 + 과거분사], + 주절 : \"그 책이 출판되기 전에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">3형식(주어 + 타동사 + 목적어)\u003c/span> : [주어 Preiss] + [타동사 buried] + [목적어 12 small treasure boxes] : \"Preiss는 12개의 작은 보물 상자를 묻었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 across + 명사(범위)\u003c/span> : across + [지역을 나타내는 명사] : \"미국과 캐나다 전역에\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"Before the book was published, 그 책이 출판되기 전에. Preiss buried, Preiss는 묻었다. 12 small treasure boxes, 12개의 작은 보물 상자를. across the United States and Canada, 미국과 캐나다 전역에. 이 문장 전체를 해석하면, 그 책이 출판되기 전에, Preiss는 12개의 작은 보물 상자를 미국과 캐나다 전역에 묻었다.","hl":"m"},{"n":17,"text":"이 문장은 책이 나오기 전에 Preiss가 직접 상자를 숨겼다는 사실을 알려 줘요. 출판 이전에 이미 열두 개의 상자를 미국과 캐나다 전역에 묻었다는 게 이 이야기의 핵심 설정이죠. 앞 문장에서 책을 소개한 다음, 그 책의 배경 사건으로 이어지는 흐름입니다.","hl":"mn"},{"n":18,"text":"먼저 Before the book was published를 보세요. before가 이끄는 시간 부사절인데, 책은 출판되는 대상이라 수동태 was published로 썼어요. 두 번째로 buried는 타동사라서 뒤에 목적어 twelve small treasure boxes를 바로 데리고 옵니다. 마지막으로 across는 전치사로 미국과 캐나다라는 범위 전체를 나타내고, 두 나라는 and로 병렬 연결되어 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">각각의 상자는 가지고 있었다\u003c/span>\u003cspan class=\"en\">Each box had\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">작은 열쇠를\u003c/span>\u003cspan class=\"en\">a small key\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">교환될 수 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">could \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">exchanged \u003c/span>\u003cspan class=\"tgt\">for\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">12개의 보석 중 하나와\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">12 \u003c/span>\u003cspan class=\"tgt\">jewels\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">뉴욕의 안전 금고에 있는\u003c/span>\u003cspan class=\"en\">in a safe deposit box in New York.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">각각의 상자는 뉴욕의 안전 금고에 있는 12개의 보석 중 하나와 교환될 수 있는 작은 열쇠를 가지고 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 상자 안의 열쇠가 어떤 가치를 지니는지 설명하는 문장이에요. \u003cb class=\"key\">작은 \u003c/b>\u003cb class=\"key\">열쇠\u003c/b> 하나가 뉴욕 금고에 있는 \u003cb class=\"key\">보석\u003c/b> 하나로 바꿀 수 있는 교환권 역할을 한다는 거죠. 보물찾기의 보상 구조를 구체적으로 보여 주는 대목입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : [선행사 a small key] + that + [주어가 빠진 불완전한 절] : \"교환될 수 있는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 + be + 과거분사(수동태)\u003c/span> : [조동사 could] + be + [과거분사 exchanged] + for + [교환 대상] : \"교환될 수 있는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">one of + 복수명사(부분 표현)\u003c/span> : one of + [복수명사] : \"12개의 보석 중 하나\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"Each box had, 각각의 상자는 가지고 있었다. a small key, 작은 열쇠를. that could be exchanged for, 교환될 수 있는. one of 12 jewels, 12개의 보석 중 하나와. in a safe deposit box in New York, 뉴욕의 안전 금고에 있는. 이 문장 전체를 해석하면, 각각의 상자는 뉴욕의 안전 금고에 있는 12개의 보석 중 하나와 교환될 수 있는 작은 열쇠를 가지고 있었다.","hl":"m"},{"n":20,"text":"이 문장은 각 상자 안의 열쇠가 어떤 가치를 지니는지 설명해요. 작은 열쇠 하나가 뉴욕 금고에 있는 보석 하나로 바꿀 수 있는 교환권 역할을 한다는 거죠. 보물찾기의 보상 구조를 구체적으로 보여 주는 대목입니다.","hl":"mn"},{"n":21,"text":"먼저 that could be exchanged for를 보세요. 앞의 a small key를 받는 주격 관계대명사 that이고, 뒤에는 주어가 빠진 불완전한 절이 와요. 열쇠는 교환되는 대상이니까 수동태 could be exchanged로 썼습니다. 그리고 one of twelve jewels는 부분 표현이라 of 뒤에 복수명사가 온다는 점, exchange는 전치사 for와 짝을 이룬다는 점도 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 책은\u003c/span>\u003cspan class=\"en\">The book\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가지고 있다 / 담고 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">12개의 신비한 그림을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">12 \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">mysterious \u003c/span>\u003cspan class=\"tgt\">paintings \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 시를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">poems\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 책에는 12개의 신비한 그림과 시가 실려 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 책 속에 무엇이 들어 있는지 소개하는 대목이에요. have는 '가지다'라는 \u003cb class=\"key\">소유\u003c/b>의 기본 뜻이지만, 책을 주어로 쓰면 '내용으로 담고 있다', 즉 '실려 있다'로 \u003cb class=\"key\">의역\u003c/b>하는 것이 자연스러워요. \u003cb class=\"key\">형용사\u003c/b> mysterious가 paintings 앞에서 꾸며 '신비한 그림'이라는 의미를 만들어 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">타동사 have의 3형식(소유·수록)\u003c/span> : [[주어 The book]] + has + [목적어 12 mysterious paintings and poems] : \"12개의 신비한 그림과 시를 담고 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">형용사의 명사 전치 수식\u003c/span> : [[형용사 mysterious]] + [명사 paintings] : \"신비한 그림들\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"The book, 그 책은. has, 가지고 있다 / 담고 있다. 12 mysterious paintings, 12개의 신비한 그림을. and poems, 그리고 시를. 이 문장 전체를 해석하면, 그 책에는 12개의 신비한 그림과 시가 실려 있다.","hl":"m"},{"n":23,"text":"이 문장은 책 속에 무엇이 들어 있는지 알려 주는 문장이에요. have는 원래 소유의 뜻이지만 책을 주어로 쓰면 실려 있다는 뜻으로 의역해서 읽어요. mysterious 같은 형용사가 paintings 앞에서 꾸며 주는 구조도 함께 익혀 두세요.","hl":"mn"},{"n":24,"text":"첫 번째, 동사 has 뒤에 목적어가 통째로 와서 책이 무엇을 담고 있는지 말해 주는 구조예요. 두 번째, mysterious처럼 형용사는 명사 paintings 앞에서 꾸며 주는 자리를 지킨다는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들은\u003c/span>\u003cspan class=\"en\">They\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">담고 있다\u003c/span>\u003cspan class=\"en\">contain\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 정보를\u003c/span>\u003cspan class=\"en\">the information\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">위치를 가리키는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">indicates \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">location\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">파묻힌 보물의\u003c/span>\u003cspan class=\"en\">of \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">buried \u003c/span>\u003cspan class=\"tgt\">treasures\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것들은 파묻힌 보물의 위치를 가리키는 정보를 담고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 그림과 시, 즉 They가 무엇을 담고 있는지 설명하는 문장이에요. that은 접속사가 아니라 앞의 the information을 받는 \u003cb class=\"key\">주격 \u003c/b>\u003cb class=\"key\">관계대명사\u003c/b>로, '정보'가 '가리키는' 주체가 되는 \u003cb class=\"key\">능동\u003c/b> 관계를 보여 줘요. buried는 '파묻다'의 \u003cb class=\"key\">과거분사\u003c/b>로 '이미 파묻힌' 상태를 나타냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : [선행사 the information] + [[주격 관계대명사 that]] + [동사 indicates] : \"위치를 가리키는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사의 형용사적 용법(수동)\u003c/span> : [[과거분사 buried]] + [명사 treasures] : \"파묻힌 보물\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"They, 그것들은. contain, 담고 있다. the information, 그 정보를. that indicates the location, 위치를 가리키는. of the buried treasures, 파묻힌 보물의. 이 문장 전체를 해석하면, 그것들은 파묻힌 보물의 위치를 가리키는 정보를 담고 있다.","hl":"m"},{"n":26,"text":"여기서 They는 앞에 나온 열두 개의 그림과 시를 가리켜요. that은 접속사가 아니라 the information을 받는 주격 관계대명사이고, buried는 과거분사로 파묻힌 상태를 나타냅니다.","hl":"mn"},{"n":27,"text":"첫 번째, that 앞의 the information이 선행사 역할을 하고 that은 주격 관계대명사예요. 뒤에 동사 indicates가 바로 오는 걸 보면 주격이라는 걸 알 수 있죠. 두 번째, the buried treasures에서 buried는 수동의 뜻을 가진 과거분사로 명사 treasures를 꾸며 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들어\u003c/span>\u003cspan class=\"en\">For example,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">꽃과 종이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">flower \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">bell\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 그림 속에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">image\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상징해요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">stand \u003c/span>\u003cspan class=\"tgt\">for\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">클리블랜드의 Bellflower 길을\u003c/span>\u003cspan class=\"en\">Bellflower Road in Cleveland.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">예를 들어, 한 그림의 꽃(flower)과 종(bell)은 Cleveland의 Bellflower 길을 상징한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 예시를 드는 문장으로, 앞의 '그림과 시가 위치 정보를 담고 있다'는 내용을 구체적으로 보여 줘요. stand for는 '서 있다'가 아니라 '\u003cb class=\"key\">상징하다\u003c/b>'라는 뜻의 \u003cb class=\"key\">구동사\u003c/b>예요. a flower and a bell처럼 and로 이어진 두 \u003cb class=\"key\">명사\u003c/b>가 하나의 주어로 묶여 동사 stand가 복수형으로 쓰였어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">등위접속사 and에 의한 병렬\u003c/span> : [[명사 a flower]] + and + [명사 a bell] : \"꽃과 종\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 수식(후치수식)\u003c/span> : [명사 a bell] + [[전치사구 in one image]] : \"한 그림 속의\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">구동사(phrasal verb)\u003c/span> : [[주어]] + stand for + [목적어] : \"~을 상징하다\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"For example, 예를 들어. a flower and a bell, 꽃과 종이. in one image, 한 그림 속에서. stand for, 상징해요. Bellflower Road in Cleveland, 클리블랜드의 Bellflower 길을. 이 문장 전체를 해석하면, 예를 들어, 한 그림의 꽃(flower)과 종(bell)은 Cleveland의 Bellflower 길을 상징한다.","hl":"m"},{"n":29,"text":"앞에서 말한 걸 구체적인 예로 보여 주는 문장이에요. stand for는 서 있다가 아니라 상징한다는 뜻으로 굳어진 구동사이고, 꽃과 종이 and로 묶여 하나의 주어가 됩니다.","hl":"mn"},{"n":30,"text":"첫 번째, a flower and a bell은 and로 두 명사가 나란히 이어진 병렬 구조라서 동사가 복수형 stand로 와요. 두 번째, in one image는 앞의 a bell을 뒤에서 꾸며 주는 전치사구예요. 세 번째, stand for는 단어 두 개가 굳어져 상징한다는 뜻을 만드는 구동사이니 덩어리로 외워 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">2023년까지,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Up \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">year \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">2023\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">12개의 상자 중 오직 3개만이\u003c/span>\u003cspan class=\"en\">only three of the twelve boxes\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">발견되어 왔다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">been \u003c/span>\u003cspan class=\"tgt\">found\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">2023년까지 12개의 상자 중 오직 3개만이 발견되었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 보물찾기의 결과를 \u003cb class=\"key\">시간의 \u003c/b>\u003cb class=\"key\">범위\u003c/b>로 한정해 요약한 문장이에요. 'only three'라는 \u003cb class=\"key\">한정\u003c/b> 표현 덕분에 아직 아홉 개가 남아 있다는 사실이 자연스럽게 드러나죠. 바로 다음 문장에서 발견된 세 개를 구체적으로 소개하기 위한 \u003cb class=\"key\">도입\u003c/b> 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구(시간의 범위 한정)\u003c/span> : [up to + 명사구] + 주어 + 동사 : \"2023년까지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재완료 수동태\u003c/span> : [have/has] + [been] + [p.p.] : \"발견되어 왔다\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"Up to the year of 2023, 2023년까지. only three of the twelve boxes, 12개의 상자 중 오직 3개만이. have been found, 발견되어 왔다.. 이 문장 전체를 해석하면, 2023년까지 12개의 상자 중 오직 3개만이 발견되었다.","hl":"m"},{"n":32,"text":"이 문장은 이천이십삼 년까지 열두 개 중 세 개만 발견되었다고 말하고 있어요. only three라는 부분에서 아직 아홉 개가 남아 있다는 사실이 자연스럽게 드러나죠. 그래서 다음 문장에서 발견된 세 개를 구체적으로 소개하는 흐름으로 이어집니다.","hl":"mn"},{"n":33,"text":"첫 번째 어법은 Up to the year of 2023이에요. up to는 시간의 범위를 한정하는 전치사로 '이천이십삼 년까지'라는 뜻이죠. 두 번째는 have been found인데, 상자는 발견되는 대상이니까 수동태를 쓰고, 과거부터 지금까지의 결과를 말하니까 현재완료를 쓴 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하나는 시카고의 Grant Park에서 1983년에 발견되었다,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">One \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">discovered\u003c/span> in 1983 in Grant Park in Chicago,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다음 것은 2004년에 Cleveland의 그리스 문화 정원에서,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">next \u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">2004\u003c/span> in the Greek Cultural Garden in Cleveland,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 가장 최근의 것은 보스턴의 Langone Park에서 2019년에 발견되었다.\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">most \u003c/span>\u003cspan class=\"tgt\">recent \u003c/span>\u003cspan class=\"tgt\">one\u003c/span> was found in 2019 in Langone Park in Boston.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하나는 시카고의 Grant Park에서 1983년에 발견되었고, 다음 것은 2004년에 Cleveland의 그리스 문화 정원에서, 가장 최근의 것은 보스턴의 Langone Park에서 2019년에 발견되었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 말한 세 개를 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">순서\u003c/b>대로 나열한 문장이에요. 'One ~, the next one ~, the most recent one ~'처럼 \u003cb class=\"key\">병렬\u003c/b> 구조를 이루고, 두 번째 항목에서는 was discovered가 \u003cb class=\"key\">생략\u003c/b>되어 있죠. 구체적인 연도와 장소를 제시해서 앞 문장의 'only three'를 든든한 \u003cb class=\"key\">근거\u003c/b>로 뒷받침해 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거 수동태\u003c/span> : [주어] + [was/were] + [p.p.] : \"하나는 발견되었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">반복 어구의 생략(병렬 구조)\u003c/span> : [the next one] + [생략된 was discovered] + [in 2004] : \"다음 것은 2004년에 (발견되었다)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">최상급 형용사\u003c/span> : [the most + 형용사] + 명사 : \"가장 최근의 것\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"One was discovered in 1983 in Grant Park in Chicago, 하나는 시카고의 Grant Park에서 1983년에 발견되었다. the next one in 2004 in the Greek Cultural Garden in Cleveland, 다음 것은 2004년에 Cleveland의 그리스 문화 정원에서. and the most recent one was found in 2019 in Langone Park in Boston, 그리고 가장 최근의 것은 보스턴의 Langone Park에서 2019년에 발견되었다.. 이 문장 전체를 해석하면, 하나는 시카고의 Grant Park에서 1983년에 발견되었고, 다음 것은 2004년에 Cleveland의 그리스 문화 정원에서, 가장 최근의 것은 보스턴의 Langone Park에서 2019년에 발견되었다.","hl":"m"},{"n":35,"text":"이 문장은 앞에서 말한 세 개를 발견된 순서대로 나열하고 있어요. 하나는 시카고, 다음은 클리블랜드, 가장 최근은 보스턴이라는 식으로 장소와 연도를 함께 제시하죠. 이렇게 구체적인 근거를 대니까 앞 문장의 only three라는 말이 훨씬 믿음직하게 다가옵니다.","hl":"mn"},{"n":36,"text":"먼저 One was discovered를 보세요. 상자는 발견되는 대상이니까 과거 수동태 was discovered를 썼어요. 그다음 the next one in 2004에서는 앞의 was discovered가 반복되니까 생략한 거예요. 같은 구조를 이어 붙이는 병렬 구조라서 가능한 일이죠. 마지막으로 the most recent one은 세 개 중 마지막 사례를 가리키니까 최상급 the most recent를 쓴 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Preiss는 어떠한 기록도 남기지 않았다\u003c/span>\u003cspan class=\"en\">Preiss \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">didn't \u003c/span>\u003cspan class=\"tgt\">leave \u003c/span>\u003cspan class=\"tgt\">any \u003c/span>\u003cspan class=\"tgt\">record\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보물의 정확한 위치에 대한\u003c/span>\u003cspan class=\"en\">of \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">treasures' \u003c/span>\u003cspan class=\"tgt\">exact \u003c/span>\u003cspan class=\"tgt\">locations\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 갑작스러운 죽음 전에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">before \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">sudden \u003c/span>\u003cspan class=\"tgt\">death\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">2005년 자동차 사고로.\u003c/span>\u003cspan class=\"en\">in a car accident in 2005.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Preiss는 2005년 자동차 사고로 갑작스럽게 사망하기 전에 보물의 정확한 위치에 대한 어떠한 기록도 남겨놓지 않았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 보물이 다 발견되지 않은 이유를 \u003cb class=\"key\">사망\u003c/b> 사실과 함께 밝히는 문장이에요. 'didn't leave any record'라는 \u003cb class=\"key\">부정\u003c/b> 표현이 핵심으로, 위치를 알려 줄 기록이 전혀 없다는 점을 강조하죠. 그래서 사람들이 여전히 \u003cb class=\"key\">추측\u003c/b>하며 찾고 있다는 다음 문장으로 자연스럽게 이어져요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정문에서의 any\u003c/span> : [didn't + 동사원형] + [any + 명사] : \"어떠한 기록도 남기지 않았다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">복수 명사의 소유격\u003c/span> : [복수 명사 + '] + 명사 : \"보물의 정확한 위치\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 before + 명사구\u003c/span> : [before] + [소유격 + 명사] : \"그의 갑작스러운 죽음 전에\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"Preiss didn't leave any record, Preiss는 어떠한 기록도 남기지 않았다. of the treasures' exact locations, 보물의 정확한 위치에 대한. before his sudden death, 그의 갑작스러운 죽음 전에. in a car accident in 2005, 2005년 자동차 사고로.. 이 문장 전체를 해석하면, Preiss는 2005년 자동차 사고로 갑작스럽게 사망하기 전에 보물의 정확한 위치에 대한 어떠한 기록도 남겨놓지 않았다.","hl":"m"},{"n":38,"text":"이 문장은 보물이 아직 다 발견되지 않은 이유를 설명해요. Preiss가 자동차 사고로 갑자기 세상을 떠나면서 정확한 위치를 알려 줄 기록을 남기지 않았다는 거죠. 그래서 다음 문장처럼 여전히 많은 사람이 보물을 찾고 있다는 결론으로 이어집니다.","hl":"mn"},{"n":39,"text":"첫 번째는 didn't leave any record예요. not이 들어간 부정문에서는 some 대신 any를 써서 '어떠한 기록도'라는 뜻을 만들어요. 두 번째는 the treasures' exact locations인데, 복수 명사 treasures에 아포스트로피만 붙여서 소유격을 만든 거예요. 세 번째는 before his sudden death로, before가 전치사로 쓰여 뒤에 명사구가 온 경우랍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 사람들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Many \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여전히 세상에 나가서\u003c/span>\u003cspan c 간적 지속을 강조해서, 미해결의 보물들이 사람들의 관심을 끌고 있음을 드러내죠.","hl":"mn"},{"n":42,"text":"첫 번째로 Many people are에서 Many people이 복수 주어라서 be동사 are를 쓴 수 일치를 확인해요. 두 번째로 are still out there looking은 be동사 뒤에 looking이 와서 진행 중인 동작을 나타내는 현재진행형이에요. 이때 still과 out there는 진행형 사이에 들어간 부사와 부사구로, looking이 동작의 핵심을 만들어 주죠. 세 번째로 for those treasures에서 for는 전치사이고 뒤에 목적격 명사구 those treasures가 목적어로 와요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>\u003cb class=\"key\">Byron \u003c/b>\u003cb class=\"key\">Preiss\u003c/b>는 1982년에 책 ‘The Secret: A Treasure Hunt’를 만들고 미국과 캐나다 전역에 12개의 \u003cb class=\"key\">보물 \u003c/b>\u003cb class=\"key\">상자\u003c/b>를 묻었다.\u003c/li>\u003cli>책 속 12개의 신비한 \u003cb class=\"key\">그림과 \u003c/b>\u003cb class=\"key\">시\u003c/b>는 파묻힌 보물의 위치를 가리키는 정보를 담고 있다.\u003c/li>\u003cli>2023년까지 12개 중 \u003cb class=\"key\">세 \u003c/b>\u003cb class=\"key\">개의 \u003c/b>\u003cb class=\"key\">상자\u003c/b>만 발견되었고, Preiss는 사망 전 \u003cb class=\"key\">정확한 \u003c/b>\u003cb class=\"key\">위치\u003c/b>를 기록으로 남기지 않았다.\u003c/li>\u003cli>많은 사람들이 여전히 그 \u003cb class=\"key\">보물들을 \u003c/b>\u003cb class=\"key\">찾고\u003c/b> 있다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The book The Secret: A Treasure Hunt contains clues to buried treasures, but because their exact locations were never recorded, many people are still searching for them.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">\u003cb class=\"key\">Byron \u003c/b>\u003cb class=\"key\">Preiss\u003c/b>의 책 ‘The Secret: A Treasure Hunt’는 미국과 캐나다에 묻힌 12개의 \u003cb class=\"key\">보물 \u003c/b>\u003cb class=\"key\">상자\u003c/b>와 이를 찾기 위한 \u003cb class=\"key\">그림과 \u003c/b>\u003cb class=\"key\">시\u003c/b>의 단서를 담고 있다. 2023년까지 \u003cb class=\"key\">세 \u003c/b>\u003cb class=\"key\">개의 \u003c/b>\u003cb class=\"key\">상자\u003c/b>만 발견되었고, Preiss가 남기지 않은 \u003cb class=\"key\">정확한 \u003c/b>\u003cb class=\"key\">위치\u003c/b> 때문에 많은 사람들이 여전히 \u003cb class=\"key\">보물들을 \u003c/b>\u003cb class=\"key\">찾고\u003c/b> 있다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":43,"text":"정리해 볼게요. 이 글은 Byron Preiss의 책 The Secret을 중심으로 열두 개의 보물 상자, 그림과 시의 단서, 세 개의 상자 발견, 그리고 정확한 위치가 남지 않은 채 이어지는 탐색을 보여 줘요. 핵심은 단서는 남아 있지만 보물들을 찾고 있는 사람들이 여전히 많다는 점이에요. 오늘 수업은 여기까지예요. 다음 시간에 또 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
