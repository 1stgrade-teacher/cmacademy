e\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03보물 발견의 현황</div><ul><li>수십 년이 지났음에도 불구하고 12개의 보물 중 일부만이 발견되었다.</li><li>2023년까지 총 3개의 상자만 발견됨</li><li>1983년 시카고, 2004년 클리블랜드, 2019년 보스턴에서 발견</li><li>핵심 키워드: 발견(discovered), 기록(record)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04미결된 탐색의 지속</div><ul><li>저자의 갑작스러운 사망으로 위치 기록이 사라졌으나 사람들은 여전히 보물을 찾고 있다.</li><li>저자 바이런 프라이스의 2005년 갑작스러운 사고사</li><li>정확한 위치 정보가 기록으로 남지 않음</li><li>여전히 보물을 찾는 사람들(treasure hunters)의 노력 지속</li><li>핵심 키워드: 사망(death), 탐색(looking for)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">treasure hunt</td><td class=\"m\">보물찾기</td></tr><tr><td class=\"w\">bury</td><td class=\"m\">묻다, 매장하다</td></tr><tr><td class=\"w\">exchange for</td><td class=\"m\">~와 교환하다</td></tr><tr><td class=\"w\">mysterious</td><td class=\"m\">신비한, 알 수 없는</td></tr><tr><td class=\"w\">indicate</td><td class=\"m\">나타내다, 가리키다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">stand for</td><td class=\"m\">~을 의미하다, ~을 상징하다</td></tr><tr><td class=\"w\">discover</td><td class=\"m\">발견하다, 알아내다</td></tr><tr><td class=\"w\">record</td><td class=\"m\">기록, 경력</td></tr><tr><td class=\"w\">sudden</td><td class=\"m\">갑작스러운, 급격한</td></tr><tr><td class=\"w\">look for</td><td class=\"m\">~을 찾다, 기대하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">‘비밀: 보물 찾기’는</span><span class=\"en\"><b>The Secret: A Treasure Hunt</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">책이다</span><span class=\"en\"><b>is a book</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">1982년에 Byron Preiss에 의해 창작된</span><span class=\"en\"><b><span class=\"grammar-hl\">created by Byron Preiss</span> in 1982.</b></span></div></div><div class=\"lec-sent-ko\">‘비밀: 보물 찾기’는 Byron Preiss에 의해 1982년에 창작된 책이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 글의 주제인 보물 찾기 책이 어떤 것인지 소개하며 전체 이야기의 시작점을 알립니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">created by Byron Preiss (과거분사(형용사)): created가 a book을 수식하며, 축약된 관계절(a book that was created by~)의 의미로 &#39;바이런 프라이스에 의해 만들어진 책&#39;을 뜻함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">treasure hunt</td><td class=\"m\">보물찾기</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 책이 출판되기 전에,</span><span class=\"en\"><b>Before the book <span class=\"grammar-hl\">was published</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Preiss는 12개의 작은 보물 상자를 묻었다</span><span class=\"en\"><b>Preiss buried 12 small treasure boxes</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">미국과 캐나다 전역에</span><span class=\"en\"><b>across the United States and Canada.</b></span></div></div><div class=\"lec-sent-ko\">그 책이 출판되기 전에, Preiss는 12개의 작은 보물 상자를 미국과 캐나다 전역에 묻었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 소개한 책과 연관된 구체적인 사건을 제시합니다. 책의 내용을 바탕으로 독자들이 실제로 찾을 수 있는 보물을 숨겨두었다는 점을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was published (수동태): be동사(was)+p.p.(published) 구조. publish는 타동사인데 목적어가 없어서 수동구조 was published 형태로 쓴다. 기본구조: V + O (주어가 목적어를 출판하다)</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">각각의 상자는 작은 열쇠를 가지고 있었다</span><span class=\"en\"><b>Each box had a small key</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">12개의 보석 중 하나와 교환될 수 있는</span><span class=\"en\"><b><span class=\"grammar-hl\">that could be exchanged</span> for one of 12 jewels</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">안전 금고 안에 있는</span><span class=\"en\"><b>in a safe deposit box</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">뉴욕의</span><span class=\"en\"><b>in New York.</b></span></div></div><div class=\"lec-sent-ko\">각각의 상자는 뉴욕의 안전 금고에 있는 12개의 보석 중 하나와 교환될 수 있는 작은 열쇠를 가지고 있었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 보물을 찾는 이유와 그 보상의 정체를 밝히며 독자들의 흥미를 유발합니다. 단순한 상자가 아니라 가치 있는 보석으로 연결된다는 점을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that could be exchanged (관계대명사): 주격 관계대명사 that이 선행사 a small key를 수식함. 관계대명사 뒤에는 불완전한 문장이 오며, 여기서는 that이 수동태 구조(could be exchanged)의 주어 역할을 함</div><div class=\"lec-gr-item\">could be exchanged (수동태): be동사(be)+p.p.(exchanged) 구조. exchange는 타동사인데 목적어가 없어서 수동구조 be exchanged 형태로 쓴다. 기본구조: exchange A for B (A를 B와 교환하다)</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 책은 12개의 신비한 그림과 시를 가지고 있다.</span><span class=\"en\"><b><span class=\"grammar-hl\">The book has 12 mysterious paintings</span> and poems.</b></span></div></div><div class=\"lec-sent-ko\">그 책에는 12개의 신비한 그림과 시가 실려 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 보물을 찾기 위해 필요한 단서가 책 속에 들어 있음을 알려줍니다. 보물을 찾는 과정이 단순한 탐색이 아니라 지적인 암호 해독 작업임을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">The book has 12 mysterious paintings 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">mysterious</td><td class=\"m\">신비한, 알 수 없는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것들은 정보를 담고 있다</span><span class=\"en\"><b>They contain <span class=\"grammar-hl\">the information</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">위치를 가리키는</span><span class=\"en\"><b><span class=\"grammar-hl\">that indicates</span> the location</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">파묻힌 보물들의</span><span class=\"en\"><b>of <span class=\"grammar-hl\">the buried treasures</span>.</b></span></div></div><div class=\"lec-sent-ko\">그것들은 파묻힌 보물의 위치를 가리키는 정보를 담고 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 그림과 시가 단순한 삽화가 아니라 구체적인 보물의 위치를 알려주는 지침서라는 역할을 명확히 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the information that indicates (관계대명사): 주격 관계대명사 that이 선행사 the information을 수식함. 뒤에 주어 없이 동사 indicates가 바로 이어지는 불완전한 절 구조임</div><div class=\"lec-gr-item\">the buried treasures (과거분사(형용사)): buried가 treasures를 수식하며, &#39;묻힌 보물들&#39;이라는 수동적 의미를 나타냄</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">indicate</td><td class=\"m\">나타내다, 가리키다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">예를 들어,</span><span class=\"en\"><b><span class=\"grammar-hl\">For example,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한 그림 속의 꽃과 종은</span><span class=\"en\"><b><span class=\"grammar-hl\">a flower and a</span> bell in one image</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Bellflower 길을 상징한다</span><span class=\"en\"><b>stand for Bellflower Road</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Cleveland의</span><span class=\"en\"><b>in Cleveland.</b></span></div></div><div class=\"lec-sent-ko\">예를 들어, 한 그림의 꽃(flower)과 종(bell)은 Cleveland의 Bellflower 길을 상징한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 일반적인 진술을 뒷받침하는 구체적인 예시를 보여줍니다. 책 속의 추상적인 단서가 어떻게 현실의 특정 지명과 연결되는지를 직접적으로 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">For example, a flower and a 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">stand for</td><td class=\"m\">~을 의미하다, ~을 상징하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">2023년까지,</span><span class=\"en\"><b>Up to the year of 2023,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">12개의 상자 중 오직 3개만이</span><span class=\"en\"><b>only three of the twelve boxes</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">발견되었다.</span><span class=\"en\"><b><span class=\"grammar-hl\">have been found</span>.</b></span></div></div><div class=\"lec-sent-ko\">2023년까지 12개의 상자 중 오직 3개만이 발견되었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 보물 찾기가 생각보다 매우 어렵고 긴 시간이 걸리는 작업임을 수치로 증명하며 현실적인 상황을 짚어줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">have been found (수동태): be동사(been)+p.p.(found) 구조. find는 타동사인데 목적어가 없어서 수동구조 have been found 형태로 쓴다. 기본구조: V + O (주어가 목적어를 찾다)</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하나는 1983년에 발견되었고</span><span class=\"en\"><b>One <span class=\"grammar-hl\">was discovered</span> in 1983</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Grant 공원에서</span><span class=\"en\"><b>in Grant Park</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">시카고의,</span><span class=\"en\"><b>in Chicago,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다음 것은 2004년에 (발견되었고)</span><span class=\"en\"><b>the next one in 2004</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리스 문화 정원에서</span><span class=\"en\"><b>in the Greek Cultural Garden</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Cleveland의,</span><span class=\"en\"><b>in Cleveland,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 가장 최근의 것은 2019년에 발견되었다</span><span class=\"en\"><b>and the most recent one <span class=\"grammar-hl\">was found</span> in 2019</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Langone 공원에서</span><span class=\"en\"><b>in Langone Park</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">보스턴의</span><span class=\"en\"><b>in Boston.</b></span></div></div><div class=\"lec-sent-ko\">하나는 시카고의 Grant Park에서 1983년에 발견되었고, 다음 것은 2004년에 Cleveland의 그리스 문화 정원에서, 가장 최근의 것은 보스턴의 Langone Park에서 2019년에 발견되었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 3개의 사례를 구체적인 시기와 장소로 나열하여 보물이 띄엄띄엄 발견되어 왔다는 사실을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was discovered (수동태): be동사(was)+p.p.(discovered) 구조. discover는 타동사인데 목적어가 없어서 수동구조 was discovered 형태로 쓴다. 기본구조: V + O (주어가 목적어를 발견하다)</div><div class=\"lec-gr-item\">was found (수동태): be동사(was)+p.p.(found) 구조. find는 타동사인데 목적어가 없어서 수동구조 was found 형태로 쓴다. 기본구조: V + O (주어가 목적어를 찾다)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">discover</td><td class=\"m\">발견하다, 알아내다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Preiss는 어떠한 기록도 남기지 않았다</span><span class=\"en\"><b>Preiss <span class=\"grammar-hl\">didn’t leave</span> any record</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">보물의 정확한 위치에 대한</span><span class=\"en\"><b>of the treasures’ exact locations</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그의 갑작스러운 죽음 전에</span><span class=\"en\"><b>before his sudden death</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자동차 사고로 인한</span><span class=\"en\"><b>in a car accident</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">2005년에</span><span class=\"en\"><b>in 2005.</b></span></div></div><div class=\"lec-sent-ko\">Preiss는 2005년 자동차 사고로 갑작스럽게 사망하기 전에 보물의 정확한 위치에 대한 어떠한 기록도 남겨놓지 않았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 나머지 보물을 찾는 것이 왜 이렇게 어려운지에 대한 이유를 설명합니다. 제작자가 사라지면서 단서를 해석하는 유일한 길이 독자들의 몫으로 남았음을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">didn’t leave (대동사(부정문)): 일반동사 leave의 부정문으로 do(did)를 사용하여 서술. 앞의 동사가 일반동사이므로 did를 쓴다</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">record</td><td class=\"m\">기록, 경력</td></tr><tr><td class=\"w\">sudden</td><td class=\"m\">갑작스러운, 급격한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">많은 사람들이</span><span class=\"en\"><b>Many people</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여전히 밖에 있다</span><span class=\"en\"><b>are still out there</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 보물들을 찾으면서</span><span class=\"en\"><b><span class=\"grammar-hl\">looking for</span> those treasures.</b></span></div></div><div class=\"lec-sent-ko\">많은 사람들이 여전히 그 보물들을 찾고 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글을 마무리하며, 이 보물 찾기가 과거의 일이 아니라 현재 진행형인 열정적인 활동임을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">looking for (현재분사): are looking으로 진행형을 구성하며, 주어(Many people)의 동작인 &#39;찾는 중인 상태&#39;를 나타냄</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>바이런 프라이스는 1982년 보물 찾기 책을 출판하며 북미 곳곳에 실제 보물을 숨겼다.</li><li>책 속의 그림과 시에는 보물을 찾을 수 있는 암호와 단서들이 숨겨져 있다.</li><li>보물을 찾는 것은 매우 어려워 수십 년이 지난 지금까지도 대부분 발견되지 않았다.</li><li>제작자의 갑작스러운 사망으로 보물의 위치를 아는 사람이 사라졌음에도, 사람들은 여전히 보물을 찾고 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Byron Preiss hid twelve treasures with cryptic clues in his book, and most remain unfound since his sudden death left their locations a mystery.</div>\n              <div class=\"lec-final-sum-ko\">바이런 프라이스는 자신의 책 속에 암호 같은 단서와 함께 12개의 보물을 숨겼으며, 그의 갑작스러운 죽음으로 보물 위치가 미스터리로 남으면서 대부분 발견되지 않았다.</div></div></div>"],"segs":[[{"audio":"./reading18_audio/1.mp3","hl":null}],[{"audio":"./reading18_audio/2.mp3","hl":null}],[{"audio":"./reading18_audio/3.mp3","hl":null},{"audio":"./reading18_audio/4.mp3","hl":"stage-0"},{"audio":"./reading18_audio/5.mp3","hl":"stage-1"},{"audio":"./reading18_audio/6.mp3","hl":"stage-2"},{"audio":"./reading18_audio/7.mp3","hl":"stage-3"}],[{"audio":"./reading18_audio/8.mp3","hl":null}],[{"audio":"./reading18_audio/9.mp3","hl":"main"},{"audio":"./reading18_audio/10.mp3","hl":"meaning"},{"audio":"./reading18_audio/11.mp3","hl":"grammar"}],[{"audio":"./reading
