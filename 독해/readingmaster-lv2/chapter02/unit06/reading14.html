 Author)&#39;이라는 행사의 성격을 이해하면 더욱 흥미로울 거예요. 이는 주로 도서관이나 서점에서 진행하는 독서 문화 프로그램의 일종으로, 단순히 책을 사는 것을 넘어 저자가 직접 자신의 작품을 낭독(Reading session)하고 창작 뒷이야기를 나누며 독자와 소통하는 특별한 교류의 장이랍니다. 마치 좋아하는 연예인의 팬미팅처럼, 독자들이 저자와 사인회(Book signing)를 통해 직접 만나 교감함으로써 책에 대한 친밀감과 독서에 대한 흥미를 듬뿍 높일 수 있죠. 또한, 이번 지문처럼 어린이를 대상으로 하는 경우 연극 퍼포먼스(Acting performance)를 곁들이기도 하는데, 이는 아이들이 문학적 상상력을 오감을 통해 입체적으로 경험(Experiential learning)할 수 있게 돕는 아주 좋은 학습 방식이랍니다. 이 글은 이러한 행사에 참여할 때 알아야 할 에티켓과 정보를 담고 있으니, 행사의 운영 규칙을 꼼꼼히 확인하며 즐거운 독서 경험을 그려보시기 바랍니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01행사 개요</div><ul><li>수상 경력이 있는 아동 문학 작가 아멜리아 타일러의 신작 낭독회 안내입니다.</li><li>신작 도서: 토미의 바닷속 모험 (Tommy’s Adventure Under the Sea)</li><li>일시 및 장소: 5월 18일 오전 11시, 시립 도서관 닐슨 홀 (Neilson Hall)</li><li>대상: 9세~11세 어린이 (children)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02프로그램 구성</div><ul><li>작가가 직접 참여하는 다채로운 독서 관련 활동이 준비되어 있습니다.</li><li>작가의 신작 낭독 (reading session)</li><li>책 속 장면을 연기하는 공연 (acting performance)</li><li>작가 사인회 (book signing)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03참가 및 주의 사항</div><ul><li>행사에 참여하기 위해 사전에 확인해야 할 필수 수칙들입니다.</li><li>온라인 사전 등록 필수 (register)</li><li>보호자 동반 참석 권장 (guardian)</li><li>낭독 시작 후에는 입장이 제한됨 (arrive on time)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04현장 혜택</div><ul><li>행사가 끝난 후 작가의 저서를 할인된 가격으로 구매할 수 있습니다.</li><li>신작을 포함한 모든 도서 제공</li><li>30% 특별 할인 적용 (discount)</li><li>핵심 키워드: 할인(discount)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">award-winning</td><td class=\"m\">상을 받은, 수상 경력이 있는</td></tr><tr><td class=\"w\">invite</td><td class=\"m\">초대하다, 요청하다</td></tr><tr><td class=\"w\">session</td><td class=\"m\">기간, 시간, 회의</td></tr><tr><td
