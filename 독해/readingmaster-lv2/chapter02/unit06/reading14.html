lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터2 Reading14","audioDir":"reading14_audio","preview":false,"count":20,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.520em\">Reading14\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터2\u003c/div>\u003ch1>A Day with an Author: Special Story Time with Amelia Tylor\u003c/h1>\u003ch2>작가와의 하루: Amelia Tylor와 함께하는 특별한 이야기 시간\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>아동 도서상을 수상한 작가 Amelia Tylor가 새 책 ‘Tommy's Adventure Under the Sea’로 아이들을 위한 \u003cb class=\"key\">작가와의 \u003c/b>\u003cb class=\"key\">하루\u003c/b> 행사에 초대한다. 행사는 5월 18일 토요일 오전 11시부터 오후 1시까지 시립 도서관 Neilson Hall에서 열리며, \u003cb class=\"key\">읽기 \u003c/b>\u003cb class=\"key\">시간\u003c/b>, \u003cb class=\"key\">연기 \u003c/b>\u003cb class=\"key\">공연\u003c/b>, \u003cb class=\"key\">책 \u003c/b>\u003cb class=\"key\">서명\u003c/b>과 함께 \u003cb class=\"key\">등록\u003c/b>·\u003cb class=\"key\">동반\u003c/b>·\u003cb class=\"key\">입장\u003c/b> 조건 및 행사 후 30% \u003cb class=\"key\">할인\u003c/b> 혜택이 안내된다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Amelia Tylor invites children to a special story time event for her new book, providing event details, participation rules, and a post-event book discount.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 작가 Amelia Tylor가 여는 특별한 행사 안내문을 함께 읽어 볼 거예요. 이 글은 새 책 Tommy's Adventure Under the Sea를 소개하며 아이들을 위한 이야기 시간에 초대하고, 행사의 일시와 장소, 활동, 참석 조건과 할인 혜택을 알려 줍니다. 요지는 행사 정보와 유의 사항을 정확히 파악해 참석 계획을 세우라는 것이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">작가와의 하루처럼 작가가 독자와 만나는 행사는 \u003cb class=\"key\">독서 \u003c/b>\u003cb class=\"key\">경험\u003c/b>을 풍부하게 해 주는 프로그램이에요. 특히 \u003cb class=\"key\">story \u003c/b>\u003cb class=\"key\">time\u003c/b>은 작가가 책을 직접 읽어 주는 시간이고, \u003cb class=\"key\">book \u003c/b>\u003cb class=\"key\">signing\u003c/b>은 작가가 책에 사인을 해 주는 활동으로, 팬과의 친밀감을 높이죠. 이런 행사는 보통 \u003cb class=\"key\">사전 \u003c/b>\u003cb class=\"key\">등록\u003c/b>을 받고, 어린아이는 부모나 \u003cb class=\"key\">보호자\u003c/b>와 함께 참석해야 합니다. 공연이나 강연은 시작 후 \u003cb class=\"key\">입장\u003c/b>이 제한될 수 있어서, 영화관에서 상영 시작 뒤 늦게 들어가기 어려운 것과 비슷해요. 마지막으로 행사 후 \u003cb class=\"key\">할인\u003c/b> 판매는 참석자에게 주는 실질적인 혜택이 됩니다.\u003c/div>","segs":[{"n":2,"text":"작가와의 하루 같은 행사는 독자가 작가를 직접 만나 책에 대해 듣는 프로그램이에요. story time은 작가가 책을 소리 내어 읽어 주는 시간이고, book signing은 작가가 책에 사인을 해 주는 활동이죠. 이런 행사는 보통 사전 등록을 받고, 어린아이는 부모나 보호자와 함께 와야 해요. 공연이나 강연에서는 시작 후 입장이 제한될 수 있으니 도착 시간을 지키는 것이 중요해요. 행사 뒤에는 책을 할인 판매하기도 하는데, 이 글도 그런 혜택을 안내하고 있어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>초대\u003csmall>도입 · 문장 1\u003c/small>\u003c/h4>\u003cp>아동 도서상을 수상한 작가 Amelia Tylor가 새 책 ‘Tommy's Adventure Under the Sea’로 독자를 초대한다. 이 글은 작가와의 하루 행사 안내문으로, 아이들을 위한 \u003cb class=\"key\">특별한 \u003c/b>\u003cb class=\"key\">이야기 \u003c/b>\u003cb class=\"key\">시간\u003c/b>을 소개한다. 행사명과 새 책 제목이 함께 제시되어 초대의 목적이 분명해진다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>행사 안내\u003csmall>세부 안내 · 문장 2\u003c/small>\u003c/h4>\u003cp>행사는 5월 18일 토요일 오전 11시부터 오후 1시까지 시립 도서관의 Neilson Hall에서 열린다. 대상은 9~11세 아이들이며, 작가의 \u003cb class=\"key\">읽기 \u003c/b>\u003cb class=\"key\">시간\u003c/b>, 책 장면 연기 공연, 작가의 책 서명이 포함된다. 참석하려면 웹사이트에서 \u003cb class=\"key\">등록\u003c/b>해야 하고, 아이는 부모나 보호자와 함께 와야 한다. 또한 읽기 시간이 시작된 뒤에는 끝날 때까지 \u003cb class=\"key\">입장\u003c/b>할 수 없다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>추가 혜택\u003csmall>결론 · 문장 3\u003c/small>\u003c/h4>\u003cp>행사 후에는 새 책을 포함한 작가의 모든 책을 30% \u003cb class=\"key\">할인\u003c/b>된 가격으로 살 수 있다. 이는 행사 참여가 책 구매로 이어지는 \u003cb class=\"key\">추가 \u003c/b>\u003cb class=\"key\">혜택\u003c/b>임을 보여 준다. 따라서 이 안내문은 행사 참석 조건과 혜택을 함께 알려 주는 실용문이다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 초대, 행사 안내, 추가 혜택의 순서로 살펴볼게요.","hl":null},{"n":4,"text":"첫 단계는 초대예요. 아동 도서상을 수상한 작가 Amelia Tylor가 새 책 Tommy's Adventure Under the Sea로 독자를 부릅니다. 아이들을 위한 특별한 이야기 시간이 열린다는 점이 첫 부분에서 분명히 드러나죠.","hl":"f0"},{"n":5,"text":"두 번째 단계는 행사 안내예요. 언제, 어디서, 아홉 살부터 열한 살까지의 아이들을 위한 행사인지와 함께 읽기 시간, 연기 공연, 책 서명 같은 활동이 제시됩니다. 참석하려면 웹사이트에서 등록해야 하고 아이는 부모나 보호자와 함께 와야 해요. 또 읽기 시간이 시작된 뒤에는 끝날 때까지 입장할 수 없다는 조건도 꼭 기억해야 합니다.","hl":"f1"},{"n":6,"text":"마지막 단계는 추가 혜택이에요. 행사 후에는 새 책을 포함한 작가의 모든 책을 삼십 퍼센트 할인된 가격으로 살 수 있습니다. 그래서 이 안내문은 행사 참석 조건과 함께 책을 구매할 수 있는 혜택까지 알려 주는 실용문이에요.","hl":"f2"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 행사와 새 책을 소개하며 \u003cb class=\"key\">화제\u003c/b>를 제시한다. 이어서 언제, 어디서, 누구를 위한, 무엇을 포함하는지 \u003cb class=\"key\">세부 \u003c/b>\u003cb class=\"key\">정보\u003c/b>를 항목별로 제시한다. 마지막에 등록·동반·입장·할인 같은 유의 사항과 혜택을 덧붙인다. 따라서 핵심이 앞에 나오는 \u003cb class=\"key\">두괄식\u003c/b> 안내문이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>When (2)\u003c/b>\u003cspan>시간 정보 제시\u003c/span>\u003cb>Where (2)\u003c/b>\u003cspan>장소 정보 제시\u003c/span>\u003cb>For whom (2)\u003c/b>\u003cspan>대상 정보 제시\u003c/span>\u003cb>Event Includes (2)\u003c/b>\u003cspan>포함 활동 제시\u003c/span>\u003cb>until (2)\u003c/b>\u003cspan>입장 제한의 종료 시점 제시\u003c/span>\u003cb>After (3)\u003c/b>\u003cspan>행사 후 시간 순서 제시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">kids\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">9 to 11-year-old kids\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Children\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":7,"text":"이 글은 시간순 전개를 활용한 안내문이에요. 먼저 행사와 새 책을 소개하고, 이어서 행사 전 등록과 도착, 행사 중 읽기와 공연과 서명, 행사 후 할인으로 자연스럽게 이어집니다. 전체 핵심은 첫 문장에서 행사와 책을 제시하며 먼저 알려 주기 때문에 두괄식이라고 볼 수 있어요. 그래서 세부 정보를 읽을 때도 앞의 핵심과 뒤의 조건을 연결해서 보면 좋습니다.","hl":"ty"},{"n":8,"text":"When, Where, For whom, Event Includes 같은 표현이 항목별 정보를 표시하는 신호어예요. After는 행사 후라는 시간 순서를 알려 주고, until은 입장 제한이 끝나는 시점을 분명히 하죠. kids가 nine to eleven-year-old kids와 Children으로 다시 표현되는 재진술도 눈여겨보세요. 이 글에는 뚜렷한 대조 구도는 없고 조건과 혜택이 차례로 제시됩니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>award-winning\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>상을 수상한\u003c/span>\u003c/div>\u003cdiv>\u003cb>author\u003c/b>\u003cem>명사\u003c/em>\u003cspan>작가\u003c/span>\u003c/div>\u003cdiv>\u003cb>children's books\u003c/b>\u003cem>명사\u003c/em>\u003cspan>아동 도서\u003c/span>\u003c/div>\u003cdiv>\u003cb>invite\u003c/b>\u003cem>동사\u003c/em>\u003cspan>초대하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>adventure\u003c/b>\u003cem>명사\u003c/em>\u003cspan>모험\u003c/span>\u003c/div>\u003cdiv>\u003cb>join\u003c/b>\u003cem>동사\u003c/em>\u003cspan>함께하다, 참여하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>special\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>특별한\u003c/span>\u003c/div>\u003cdiv>\u003cb>story time\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이야기 시간\u003c/span>\u003c/div>\u003cdiv>\u003cb>kid\u003c/b>\u003cem>명사\u003c/em>\u003cspan>아이\u003c/span>\u003c/div>\u003cdiv>\u003cb>include\u003c/b>\u003cem>동사\u003c/em>\u003cspan>포함하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>reading session\u003c/b>\u003cem>명사\u003c/em>\u003cspan>읽기 시간, 낭독 시간\u003c/span>\u003c/div>\u003cdiv>\u003cb>chapter\u003c/b>\u003cem>명사\u003c/em>\u003cspan>장, 챕터\u003c/span>\u003c/div>\u003cdiv>\u003cb>acting performance\u003c/b>\u003cem>명사\u003c/em>\u003cspan>연기 공연\u003c/span>\u003c/div>\u003cdiv>\u003cb>scene\u003c/b>\u003cem>명사\u003c/em>\u003cspan>장면\u003c/span>\u003c/div>\u003cdiv>\u003cb>book signing\u003c/b>\u003cem>명사\u003c/em>\u003cspan>책 서명\u003c/span>\u003c/div>\u003cdiv>\u003cb>register\u003c/b>\u003cem>동사\u003c/em>\u003cspan>등록하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>attend\u003c/b>\u003cem>동사\u003c/em>\u003cspan>참석하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>event\u003c/b>\u003cem>명사\u003c/em>\u003cspan>행사\u003c/span>\u003c/div>\u003cdiv>\u003cb>parent\u003c/b>\u003cem>명사\u003c/em>\u003cspan>부모\u003c/span>\u003c/div>\u003cdiv>\u003cb>guardian\u003c/b>\u003cem>명사\u003c/em>\u003cspan>보호자\u003c/span>\u003c/div>\u003cdiv>\u003cb>arrive\u003c/b>\u003cem>동사\u003c/em>\u003cspan>도착하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>on time\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>제시간에\u003c/span>\u003c/div>\u003cdiv>\u003cb>enter\u003c/b>\u003cem>동사\u003c/em>\u003cspan>들어가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>hall\u003c/b>\u003cem>명사\u003c/em>\u003cspan>홀, 강당\u003c/span>\u003c/div>\u003cdiv>\u003cb>until\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~까지\u003c/span>\u003c/div>\u003cdiv>\u003cb>buy\u003c/b>\u003cem>동사\u003c/em>\u003cspan>사다, 구매하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>including\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~을 포함하여\u003c/span>\u003c/div>\u003cdiv>\u003cb>discount\u003c/b>\u003cem>명사\u003c/em>\u003cspan>할인\u003c/span>\u003c/div>\u003cdiv>\u003cb>after\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~후에\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"어휘는 register, attend, arrive, enter를 묶어서 익혀 두세요. register는 등록하다, attend는 참석하다, arrive는 도착하다, enter는 들어가다라는 뜻이에요. discount는 할인이라는 뜻으로, 행사 뒤 책을 싸게 살 수 있다는 정보와 함께 기억하면 좋아요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">invite\u003c/b>\u003cspan class=\"m\">초대하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">ask\u003c/span>\u003cspan class=\"s\">welcome\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">exclude\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">include\u003c/b>\u00 >\u003cspan class=\"s\">price cut\u003c/span>\u003cspan class=\"s\">markdown\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">increase\u003c/span>\u003cspan class=\"a\">surcharge\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"invite는 ask나 welcome과 가깝고 exclude와 반대돼요. include는 contain이나 comprise와 비슷하고 exclude나 omit과 반대됩니다. register는 sign up이나 enroll로 바꿔 쓸 수 있고 cancel과 반대되는 느낌이에요. attend는 go to나 be present at으로, arrive는 reach나 get to로 바꿀 수 있습니다. discount는 reduction이나 price cut과 가깝고 increase와 반대된다고 정리해 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 3\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">작가와의 하루\u003c/span>\u003cspan class=\"en\">A Day with an Author\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아동 도서상을 수상한 작가, Amelia Tylor가\u003c/span>\u003cspan class=\"en\">Amelia Tylor, \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">award-winning \u003c/span>\u003cspan class=\"tgt\">author \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">children's \u003c/span>\u003cspan class=\"tgt\">books\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분을 그녀의 새 책으로 초대합니다,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">invites \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">her \u003c/span>\u003cspan class=\"tgt\">new \u003c/span>\u003cspan class=\"tgt\">book\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘Tommy의 해저 모험’.\u003c/span>\u003cspan class=\"en\">Tommy's Adventure Under the Sea.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">작가와의 하루 아동 도서상을 수상한 작가, Amelia Tylor가 여러분을 그녀의 새 책, ‘Tommy의 해저 모험’으로 초대합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글의 도입부로, 수상 경력이 있는 아동 작가 Amelia Tylor의 새 책을 소개하며 행사 초대의 배경을 제시합니다. \u003cb class=\"key\">award-winning\u003c/b>은 ‘상을 받은’이라는 뜻으로 작가의 신뢰도를 높여 주고, \u003cb class=\"key\">invite \u003c/b>\u003cb class=\"key\">you \u003c/b>\u003cb class=\"key\">to\u003c/b>는 ‘여러분을 ~로 초대하다’라는 초대 문구의 핵심 표현입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동격(명사구)\u003c/span> : Amelia Tylor, + [the award-winning author of children's books] (동격 명사구) : \"아동 도서상을 수상한 작가\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">invite + 목적어 + 전치사 to\u003c/span> : invite [목적어] + to [장소·행사] : \"여러분을 그녀의 새 책으로 초대합니다\"\u003c/div>\u003c/div>","segs":[{"n":11,"text":"A Day with an Author, 작가와의 하루. Amelia Tylor, the award-winning author of children's books, 아동 도서상을 수상한 작가, Amelia Tylor가. invites you to her new book, 여러분을 그녀의 새 책으로 초대합니다. Tommy's Adventure Under the Sea, ‘Tommy의 해저 모험’.. 이 문장 전체를 해석하면, 작가와의 하루 아동 도서상을 수상한 작가, Amelia Tylor가 여러분을 그녀의 새 책, ‘Tommy의 해저 모험’으로 초대합니다.","hl":"m"},{"n":12,"text":"이 문장은 글의 도입부예요. 수상 경력이 있는 아동 작가 Amelia Tylor의 새 책을 소개하면서 행사 초대의 배경을 만들어 주죠. award-winning은 상을 받은이라는 뜻이고, invite you to는 여러분을 로 초대하다라는 뜻으로 기억해 두세요.","hl":"mn"},{"n":13,"text":"첫 번째, the award-winning author of children's books는 앞의 Amelia Tylor를 부연 설명하는 동격 표현이에요. 두 번째, invites you to her new book은 invite A to B 형태로 여러분을 어디로 초대하다라는 뜻을 만듭니다. 여기서 to는 방향과 도착점을 나타내는 전치사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 3\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아이들을 위한 특별한 이야기 시간을 그녀와 함께하세요!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Join \u003c/span>\u003cspan class=\"tgt\">her \u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">special \u003c/span>\u003cspan class=\"tgt\">story \u003c/span>\u003cspan class=\"tgt\">time \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">kids!\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">▪ 언제: 5월 18일 토요일, 오전 11시 ~ 오후 1시 ▪ 어디서: 시립 도서관의 넬슨 홀\u003c/span>\u003cspan class=\"en\">▪ When: Saturday, May 18th 11 a.m. ~ 1 p.m. ▪ Where: Neilson Hall in the City Library\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">▪ 누구를 위한: 9살부터 11살까지의 아이들\u003c/span>\u003cspan class=\"en\">▪ For whom: from 9 to \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">11-year-old\u003c/span> kids\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">▪ 행사는 (아래 활동을) 포함합니다 ∙ 작가가 읽어주는 시간 (‘Tommy의 해저 모험’ 챕터 1) ∙ 책의 장면을 연기하는 공연 ∙ 작가의 책 서명\u003c/span>\u003cspan class=\"en\">▪ Event Includes: ∙The author's reading session (Tommy's Adventure Under the Sea, Chapter 1) ∙Acting performance of scenes in the book ∙Book signing by the author\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">※ 행사에 참석하기 위해 www.citylibrary.org/events에서 등록해주세요.\u003c/span>\u003cspan class=\"en\">※ Please register at www.citylibrary.org/events \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">attend \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">event\u003c/span>.\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">※ 아이들은 부모/부모들 또는 보호자와 함께해야 합니다.\u003c/span>\u003cspan class=\"en\">※ Children \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">should \u003c/span>\u003cspan class=\"tgt\">come \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">parent/parents \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">guardian\u003c/span>.\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">※ 시간에 늦지 않게 와주세요.\u003c/span>\u003cspan class=\"en\">※ Please arrive on time.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">아이들을 위한 특별한 이야기 시간을 그녀와 함께하세요!\n▪ 언제: 5월 18일 토요일, 오전 11시 ~ 오후 1시\n▪ 어디서: 시립 도서관의 넬슨 홀\n▪ 누구를 위한: 9살부터 11살까지의 아이들\n▪ 행사는 (아래 활동을) 포함합니다\n∙ 작가가 읽어주는 시간 (‘Tommy의 해저 모험’ 챕터 1)\n∙ 책의 장면을 연기하는 공연\n∙ 작가의 책 서명\n※ 행사에 참석하기 위해 www.citylibrary.org/events에서 등록해주세요.\n※ 아이들은 부모/부모들 또는 보호자와 함께해야 합니다.\n※ 시간에 늦지 않게 와주세요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 행사 안내문으로, 언제·어디서·누구를 대상으로 하는지와 포함 활동을 한눈에 제시합니다. \u003cb class=\"key\">register\u003c/b>는 참석을 위해 미리 등록하다는 뜻이고, \u003cb class=\"key\">come \u003c/b>\u003cb class=\"key\">with\u003c/b>는 부모나 보호자와 동반해야 한다는 규칙을 전달합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문(동사원형으로 시작)\u003c/span> : [동사원형 Join] + [목적어 her] + [전치사구 at a special story time for kids] : \"아이들을 위한 특별한 이야기 시간을 그녀와 함께하세요!\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">복합형용사(단수형)\u003c/span> : [숫자 + year-old] + [명사 kids] : \"11살의\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : register + [to attend the event (to부정사구/목적)] : \"행사에 참석하기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">조동사 should(의무)\u003c/span> : [주어 Children] + should + [동사원형 come] + [with ...] : \"부모/부모들 또는 보호자와 함께해야 합니다\"\u003c/div>\u003c/div>","segs":[{"n":14,"text":"Join her at a special story time for kids!, 아이들을 위한 특별한 이야기 시간을 그녀와 함께하세요!. ▪ When: Saturday, May 18th 11 a.m. ~ 1 p.m. ▪ Where: Neilson Hall in the City Library, ▪ 언제: 5월 18일 토요일, 오전 11시 ~ 오후 1시 ▪ 어디서: 시립 도서관의 넬슨 홀. ▪ For whom: from 9 to 11-year-old kids, ▪ 누구를 위한: 9살부터 11살까지의 아이들. ▪ Event Includes: ∙The author's reading session (Tommy's Adventure Under the Sea, Chapter 1) ∙Acting performance of scenes in the book ∙Book signing by the author, ▪ 행사는 (아래 활동을) 포함합니다 ∙ 작가가 읽어주는 시간 (‘Tommy의 해저 모험’ 챕터 1) ∙ 책의 장면을 연기하는 공연 ∙ 작가의 책 서명. ※ Please register at www.citylibrary.org/events to attend the event, ※ 행사에 참석하기 위해 www.citylibrary.org/events에서 등록해주세요.. ※ Children should come with a parent/parents or guardian, ※ 아이들은 부모/부모들 또는 보호자와 함께해야 합니다.. ※ Please arrive on time, ※ 시간에 늦지 않게 와주세요.. 이 문장 전체를 해석하면, 아이들을 위한 특별한 이야기 시간을 그녀와 함께하세요!\n▪ 언제: 5월 18일 토요일, 오전 11시 ~ 오후 1시\n▪ 어디서: 시립 도서관의 넬슨 홀\n▪ 누구를 위한: 9살부터 11살까지의 아이들\n▪ 행사는 (아래 활동을) 포함합니다\n∙ 작가가 읽어주는 시간 (‘Tommy의 해저 모험’ 챕터 1)\n∙ 책의 장면을 연기하는 공연\n∙ 작가의 책 서명\n※ 행사에 참석하기 위해 www.citylibrary.org/events에서 등록해주세요.\n※ 아이들은 부모/부모들 또는 보호자와 함께해야 합니다.\n※ 시간에 늦지 않게 와주세요.","hl":"m"},{"n":15,"text":"이 안내문은 아이들을 위한 특별한 이야기 시간의 대상과 장소, 활동 내용을 한눈에 제시해요. register는 참석을 위해 미리 등록하다는 뜻이고, come with는 부모나 보호자와 함께 가야 한다는 규칙을 전달합니다.","hl":"mn"},{"n":16,"text":"첫 번째, Join her at a special story time for kids는 주어 없이 동사원형으로 시작하는 명령문이에요. 두 번째, 나이를 형용사로 만들 때는 하이픈으로 연결하고 year를 단수형으로 써요. 세 번째, to attend the event는 등록하는 목적을 나타내는 to부정사로 행사에 참석하기 위해라고 해석해요. 네 번째, should come with a parent or parents or guardian에서 should는 의무를 나타내는 조동사라서 뒤에 동사원형 come이 와요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 3\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">작가의 책 읽기 시간이 시작한 후에는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">After \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">author's \u003c/span>\u003cspan class=\"tgt\">reading \u003c/span>\u003cspan class=\"tgt\">session \u003c/span>\u003cspan class=\"tgt\">begins\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은 홀에 들어갈 수 없습니다\u003c/span>\u003cspan class=\"en\">you \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">cannot \u003c/span>\u003cspan class=\"tgt\">enter \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">hall \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 시간이 끝날 때까지.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">until \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">session \u003c/span>\u003cspan class=\"tgt\">ends\u003c/span>.\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">※ 작가의 모든 책을 구입할 수 있습니다,\u003c/span>\u003cspan class=\"en\">※ You can buy all of the author's books,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새 책을 포함한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">including \u003c/span>\u003cspan class=\"tgt\">her \u003c/span>\u003cspan class=\"tgt\">new \u003c/span>\u003cspan class=\"tgt\">one\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">30% 할인된 가격으로\u003c/span>\u003cspan class=\"en\">at a discount of 30%\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 시간 후.\u003c/span>\u003cspan class=\"en\">after the session.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">작가의 책 읽기 시간이 시작한 후에는 그 시간이 끝날 때까지 홀에 들어갈 수 없습니다. ※ 그 시간 후 새 책을 포함한 작가의 모든 책을 30% 할인된 가격으로 구입할 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 행사 진행 규칙과 할인 혜택을 안내하는 문장입니다. \u003cb class=\"key\">not \u003c/b>\u003cb class=\"key\">until\u003c/b>은 ‘~까지 ...할 수 없다’라는 시간 제한을 나타내고, \u003cb class=\"key\">including\u003c/b>은 새 책도 할인 대상에 포함됨을 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간 부사절의 현재시제\u003c/span> : After + [주어 + 현재동사], [주절] : \"작가의 책 읽기 시간이 시작한 후에는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">not ~ until 구문\u003c/span> : [not] + [동사] + ... + [until] + [절] : \"그 시간이 끝날 때까지 홀에 들어갈 수 없습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">현재분사 including(전치사적 용법)\u003c/span> : [all of the author's books], [including] + [her new one] : \"새 책을 포함한\"\u003c/div>\u003c/div>","segs":[{"n":17,"text":"After the author's reading session begins, 작가의 책 읽기 시간이 시작한 후에는. you cannot enter the hall, 여러분은 홀에 들어갈 수 없습니다. until the session ends, 그 시간이 끝날 때까지.. ※ You can buy all of the author's books, ※ 작가의 모든 책을 구입할 수 있습니다. including her new one, 새 책을 포함한. at a discount of 30%, 30% 할인된 가격으로. after the session, 그 시간 후.. 이 문장 전체를 해석하면, 작가의 책 읽기 시간이 시작한 후에는 그 시간이 끝날 때까지 홀에 들어갈 수 없습니다. ※ 그 시간 후 새 책을 포함한 작가의 모든 책을 30% 할인된 가격으로 구입할 수 있습니다.","hl":"m"},{"n":18,"text":"이 문장은 행사 진행 규칙과 할인 혜택을 안내해요. not until은 그 시간이 끝날 때까지 입장할 수 없다는 시간 제한을 나타내고, including은 새 책도 할인 대상에 포함된다는 점을 보여 줍니다.","hl":"mn"},{"n":19,"text":"첫 번째, After the author's reading session begins에서 시간 부사절은 미래의 일도 현재시제로 표현해요. 두 번째, cannot enter the hall until the session ends는 not until 구문으로 세션이 끝나야 입장할 수 있다는 시간 제한을 나타냅니다. 세 번째, including her new one에서 including은 을 포함하여라는 뜻으로 앞의 명사를 부연 설명하는 분사 표현이에요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>Amelia Tylor가 새 책 ‘Tommy's Adventure Under the Sea’를 주제로 아이들을 위한 \u003cb class=\"key\">작가와의 \u003c/b>\u003cb class=\"key\">하루\u003c/b> 행사를 연다.\u003c/li>\u003cli>행사는 5월 18일 토요일 오전 11시부터 오후 1시까지 시립 도서관 Neilson Hall에서 9~11세 아이들을 대상으로 열린다.\u003c/li>\u003cli>작가의 \u003cb class=\"key\">읽기 \u003c/b>\u003cb class=\"key\">시간\u003c/b>, 책 장면 \u003cb class=\"key\">연기 \u003c/b>\u003cb class=\"key\">공연\u003c/b>, \u003cb class=\"key\">책 \u003c/b>\u003cb class=\"key\">서명\u003c/b>이 포함되며, 참석하려면 웹사이트에서 \u003cb class=\"key\">등록\u003c/b>하고 부모나 보호자와 함께 와야 한다.\u003c/li>\u003cli>읽기 시간 시작 후에는 끝날 때까지 \u003cb class=\"key\">입장\u003c/b>할 수 없고, 행사 후에는 새 책을 포함한 모든 책을 30% \u003cb class=\"key\">할인\u003c/b>받아 살 수 있다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Amelia Tylor invites children to a special story time event for her new book, providing event details, participation rules, and a post-event book discount.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">아동 도서상을 수상한 작가 Amelia Tylor가 새 책 ‘Tommy's Adventure Under the Sea’로 아이들을 위한 \u003cb class=\"key\">작가와의 \u003c/b>\u003cb class=\"key\">하루\u003c/b> 행사에 초대한다. 행사는 5월 18일 토요일 오전 11시부터 오후 1시까지 시립 도서관 Neilson Hall에서 열리며, \u003cb class=\"key\">읽기 \u003c/b>\u003cb class=\"key\">시간\u003c/b>, \u003cb class=\"key\">연기 \u003c/b>\u003cb class=\"key\">공연\u003c/b>, \u003cb class=\"key\">책 \u003c/b>\u003cb class=\"key\">서명\u003c/b>과 함께 \u003cb class=\"key\">등록\u003c/b>·\u003cb class=\"key\">동반\u003c/b>·\u003cb class=\"key\">입장\u003c/b> 조건 및 행사 후 30% \u003cb class=\"key\">할인\u003c/b> 혜택이 안내된다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":20,"text":"오늘 글은 작가와의 하루 행사 안내문이었어요. 행사의 일시와 장소, 대상, 활동, 등록과 동반 조건, 입장 제한, 할인 혜택을 순서대로 정리하면 내용이 쉽게 잡힙니다. 안내문을 읽을 때는 핵심 정보와 조건을 표시하며 읽는 습관을 기억해 주세요. 수고했어요, 다음 글에서 또 만나요.","hl":null}]}]});</script></body></html>
