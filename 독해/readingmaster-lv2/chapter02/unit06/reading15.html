t=\"\"></div>","<div class=\"lec-cover-title\">Dream Company Cruise: An Unforgettable Family Vacation Experience<small>드림 컴퍼니 크루즈: 잊지 못할 가족 휴가 경험</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">본격적으로 크루즈 여행에 대해 알아보기 전, 먼저 &#39;크루즈 관광(Cruise Tourism)&#39;의 개념을 이해하면 좋습니다. 이는 단순히 이동 수단인 배를 타는 것을 넘어, 배 자체가 하나의 움직이는 고급 호텔이자 거대한 테마파크 역할을 하는 여행 형태를 말해요. 마치 바다 위에 떠 있는 도시와 같아서 숙박, 식사, 수영장, 공연장 등 모든 편의 시설이 갖춰져 있는 것이 특징이죠. 보통 이런 크루즈는 &#39;올 인클루시브(All-inclusive)&#39; 성격을 띠는데, 이는 여행 비용에 숙식과 기본적인 여가 활동이 대부분 포함되어 있다는 뜻이에요. 우리가 비행기를 탈 때 목적지에 도착하는 것 자체가 목적인 것과 달리, 크루즈 여행은 항해하는 과정 자체를 즐기는 것이 핵심이라는 점을 기억하면서 지문을 읽어보세요!</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01서비스 소개</div><ul><li>가족들에게 특별한 추억을 선사하는 드림 컴퍼니 크루즈 여행을 제안합니다.</li><li>매직 드림(Magic Dream)호의 고전적 디자인과 현대적 시설</li><li>크루즈 내 최대 규모의 수영장 보유</li><li>핵심 키워드: 드림 컴퍼니 크루즈(Dream Company Cruise)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02여행 일정 및 경로</div><ul><li>4박 5일간 마이애미에서 출발하여 카리브해를 항해하는 일정입니다.</li><li>출발 및 도착지: 플로리다 마이애미 항구(Port of Miami)</li><li>여행 기간: 4월 1일부터 5일까지(4 nights sailing)</li><li>방문지: 카리브해 3개 섬(Three islands in the Caribbean)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03선내 시설 및 활동</div><ul><li>다양한 편의 시설과 흥미로운 선상 프로그램을 제공합니다.</li><li>시설: 수영장 4개, 식당 3개, 스낵바 3개, 헬스장 2개(gyms)</li><li>활동: 마술쇼, 뮤지컬, 야간 불꽃놀이(fireworks)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04이용 정보 및 예약</div><ul><li>식사 서비스, 객실 구성, 가격 및 문의처 정보를 제공합니다.</li><li>식사: 아침, 점심, 저녁 무료 제공(스낵 및 음료는 별도 비용)</li><li>객실: 킹사이즈 침대 2개, 욕실, 냉장고, 무선 인터넷, TV 구비</li><li>가격 및 예약: 4,500달러에서 5,000달러(call 122-341-1234)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td
