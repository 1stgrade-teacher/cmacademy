<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터2 Reading15 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터2 Reading15","audioDir":"reading15_audio","preview":false,"count":28,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.520em\">Reading15\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터2\u003c/div>\u003ch1>Dream Company Cruise: A Dream Holiday for Your Family\u003c/h1>\u003ch2>드림 컴퍼니 유람선: 가족을 위한 꿈같은 휴가\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>\u003cb class=\"key\">드림 \u003c/b>\u003cb class=\"key\">컴퍼니 \u003c/b>\u003cb class=\"key\">유람선 \u003c/b>\u003cb class=\"key\">여행\u003c/b>은 가족이 함께 \u003cb class=\"key\">추억\u003c/b>을 만들 수 있는 꿈같은 휴가 상품으로, 고전적인 디자인과 현대적인 시설, 큰 수영장을 갖춘 배에서 카리브해의 세 섬을 항해해요.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>A Dream Company cruise offers families a memorable four-night Caribbean holiday on the Magic Dream, featuring classical design, modern facilities, and the biggest pool of any cruise ship.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 드림 컴퍼니 유람선 여행 광고 지문을 함께 읽어 볼 거예요. 이 글은 가족을 위한 특별한 휴가 상품을 소개하면서, 매직 드림이라는 배가 가족에게 꿈같은 추억을 만들어 준다고 말하고 있어요. 요약하면 가족이 함께 추억을 만들 수 있는 꿈같은 유람선 여행이고, 요지는 매직 드림이 고전적인 디자인과 현대적인 시설, 그리고 가장 큰 수영장을 갖춘 가족 맞춤 휴가를 제공한다는 거예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">유람선 여행은 영어로 \u003cb class=\"key\">cruise \u003c/b>\u003cb class=\"key\">travel\u003c/b>이라고 하며, 배 자체가 이동 수단이자 숙소·식당·공연장 역할을 하는 여행 형태예요. 그래서 호텔과 놀이공원을 한데 묶어 놓은 것과 비슷하다고 생각하면 이해하기 쉬워요. 이 지문의 four nights sailing은 나흘 밤 동안 항해한다는 뜻이고, departing from과 returning to는 각각 출발지와 도착지를 보여 주는 표현이에요. additional charge는 \u003cb class=\"key\">추가 \u003c/b>\u003cb class=\"key\">비용\u003c/b>이라는 뜻으로, 무료 식사라도 간식과 음료는 따로 돈을 내야 한다는 정보를 줘요. 마지막의 \u003cb class=\"key\">reservation\u003c/b>은 예약이라는 뜻으로, 광고를 실제 구매로 이어지게 하는 중요한 단어예요.\u003c/div>","segs":[{"n":2,"text":"유람선 여행은 영어로 cruise travel이라고 하고, 배 자체가 이동 수단이자 숙소와 식당, 공연장 역할을 하는 여행 형태예요. 그래서 호텔과 놀이공원을 한데 묶어 놓은 것과 비슷하다고 생각하면 이해하기 쉬워요. 이 지문의 four nights sailing은 나흘 밤 동안 항해한다는 뜻이고, departing from과 returning to는 각각 출발지와 도착지를 보여 주는 표현이에요. additional charge는 추가 비용이라는 뜻으로, 무료 식사라도 간식과 음료는 따로 돈을 내야 한다는 정보를 줘요. 마지막의 reservation은 예약이라는 뜻으로, 광고를 실제 구매로 이어지게 하는 중요한 단어예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>질문으로 시작\u003csmall>도입 · 문장 1\u003c/small>\u003c/h4>\u003cp>첫 번째 문장은 '여러분은 여러분의 가족을 위한 특별한 무언가를 찾고 있습니까?'라고 물으며 \u003cb class=\"key\">독자\u003c/b>의 관심을 끌어요. 광고 글은 이렇게 질문으로 시작해 가족 여행을 고민하는 사람을 주목하게 만들죠. 'something special for your family'가 이 글의 \u003cb class=\"key\">타깃\u003c/b>을 분명히 보여 줍니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>가족 추억 제안\u003csmall>주장 · 문장 2\u003c/small>\u003c/h4>\u003cp>두 번째 문장은 드림 컴퍼니 유람선 여행이 가족을 함께 모으는 \u003cb class=\"key\">추억\u003c/b>을 만든다고 말해요. 'bring families together'는 가족을 함께 모은다는 뜻으로, 이 여행이 단순한 휴가가 아니라 가족의 결속을 돕는다는 점을 강조하죠. 그래서 이 문장이 글의 \u003cb class=\"key\">주제\u003c/b>를 이끄는 핵심 문장이 됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>꿈의 배 소개\u003csmall>전환 · 문장 3\u003c/small>\u003c/h4>\u003cp>세 번째 문장은 배 이름인 Magic Dream을 소개하며, 그 배가 여러분이 꿈꾸는 \u003cb class=\"key\">휴가\u003c/b> 그 자체라고 강조해요. 'your dream holiday itself'는 배 자체가 목적지이자 휴가의 완성이라는 뜻이죠. 즉 이 배는 단순한 이동 수단이 아니라 \u003cb class=\"key\">꿈의 \u003c/b>\u003cb class=\"key\">휴가\u003c/b>를 실현하는 공간으로 제시됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>디자인과 시설\u003csmall>근거 · 문장 4\u003c/small>\u003c/h4>\u003cp>네 번째 문장은 이 유람선이 \u003cb class=\"key\">고전적인 \u003c/b>\u003cb class=\"key\">디자인\u003c/b>과 \u003cb class=\"key\">현대적인 \u003c/b>\u003cb class=\"key\">시설\u003c/b>로 유명하다고 해요. 'famous for'는 ~로 유명하다는 뜻으로, 배의 외형과 내부 편의를 동시에 내세우는 표현이죠. 이런 구체적인 장점이 매직 드림을 특별한 배로 보이게 하는 \u003cb class=\"key\">근거\u003c/b>가 됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>최대 수영장과 여행 정보\u003csmall>결론 · 문장 5\u003c/small>\u003c/h4>\u003cp>다섯 번째 문장은 이 배가 어떤 유람선보다 가장 큰 \u003cb class=\"key\">수영장\u003c/b>을 가지고 있다고 자랑해요. 이어지는 안내 정보에서는 출발 날짜와 항해지, 시설, 선상 활동, 식사, 객실, 가격, 예약 전화번호를 차례로 제시하며 구체성을 더하죠. 이 모든 세부 정보가 마지막에 \u003cb class=\"key\">예약\u003c/b>을 부르는 설득 장치가 됩니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 가족을 위한 질문으로 시작해서 배의 장점을 소개하고, 마지막에 구체적인 여행 정보와 예약 안내로 마무리돼요.","hl":null},{"n":4,"text":"첫 번째 문장은 여러분의 가족을 위한 특별한 무언가를 찾고 있냐고 물으면서 독자의 관심을 끌어요. 이 질문은 가족 여행을 고민하는 타깃을 분명하게 보여 줍니다. 광고는 이렇게 질문으로 시작해서 독자가 자기 이야기라고 느끼게 만들죠.","hl":"f0"},{"n":5,"text":"두 번째 문장은 드림 컴퍼니 유람선 여행이 가족을 함께 모으는 추억을 만든다고 말해요. 여기서 create는 추억을 만든다는 뜻이고, bring families together는 가족을 함께 모은다는 뜻이죠. 그래서 이 문장은 이 여행의 핵심 가치와 글의 주제를 함께 보여 줍니다.","hl":"f1"},{"n":6,"text":"세 번째 문장은 배 이름인 매직 드림을 소개하면서, 이 배가 여러분이 꿈꾸는 휴가 그 자체라고 강조해요. your dream holiday itself라는 표현은 배 자체가 목적지이자 휴가의 완성이라는 뜻이죠. 그래서 이 배는 단순한 이동 수단이 아니라 꿈의 휴가를 실현하는 공간으로 제시돼요.","hl":"f2"},{"n":7,"text":"네 번째 문장은 이 유람선이 고전적인 디자인과 현대적인 시설로 유명하다고 해요. classical design은 고전적인 디자인, modern facilities는 현대적인 시설이라는 뜻이죠. 이런 장점은 매직 드림이 편안하면서도 품격 있는 배라는 근거가 됩니다.","hl":"f3"},{"n":8,"text":"다섯 번째 문장은 이 배가 어떤 유람선보다 가장 큰 수영장을 가지고 있다고 자랑해요. 이어지는 안내 정보에서는 사월 일일부터 오일까지 나흘 밤 항해, 마이애미 항구 출발, 카리브해의 세 섬, 시설과 선상 활동, 식사, 객실, 가격, 예약 전화번호를 차례로 제시하죠. 이 구체적인 정보가 마지막으로 예약을 부르는 설득 장치가 됩니다.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">질문-답변\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 2번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장은 'Are you looking for something special for your family?'라는 \u003cb class=\"key\">질문\u003c/b>으로 시작해 독자의 관심을 끌어요. 두 번째 문장에서 드림 컴퍼니 유람선 여행이 가족을 함께 모으는 추억을 만든다고 \u003cb class=\"key\">주제\u003c/b>를 먼저 제시하죠. 그 뒤에는 배의 디자인과 시설, 수영장, 여행 정보 같은 \u003cb class=\"key\">세부 \u003c/b>\u003cb class=\"key\">정보\u003c/b>를 덧붙여 주제를 뒷받침해요. 그래서 질문으로 문을 열고 핵심 주장을 앞부분에 둔 두괄식 광고 글이라고 볼 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Are you looking for (1)\u003c/b>\u003cspan>질문으로 주의 끌기\u003c/span>\u003cb>creates (2)\u003c/b>\u003cspan>주제문 제시\u003c/span>\u003cb>famous for (4)\u003c/b>\u003cspan>장점 근거 제시\u003c/span>\u003cb>also (5)\u003c/b>\u003cspan>추가 장점 제시\u003c/span>\u003cb>biggest (5)\u003c/b>\u003cspan>최상급 강조\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">A Dream Company cruise\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the Magic Dream\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">your dream holiday itself\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">This cruise ship\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"이 글은 질문으로 시작해서 답을 제시하는 질문 답변 방식이에요. 첫 문장에서 질문을 던지고, 두 번째 문장에서 가족을 위한 추억을 만든다는 주제를 먼저 말하죠. 그 뒤에 배의 장점과 여행 정보 같은 세부 정보를 붙여서 주제를 뒷받침해요. 그래서 핵심 주장이 앞부분에 나오는 두괄식 광고 글이라고 볼 수 있어요.","hl":"ty"},{"n":10,"text":"신호어를 보면 첫 문장의 Are you looking for는 질문으로 주의를 끄는 역할을 해요. 두 번째 문장의 creates는 주제문을 만들어 주고, 네 번째 문장의 famous for는 장점의 근거를 제시하죠. 다섯 번째 문장의 also와 biggest는 각각 추가 장점과 최상급 강조를 담당해요. 또 A Dream Company cruise가 the Magic Dream과 This cruise ship으로 바뀌어 반복되는 점도 놓치지 마세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>look for\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>찾다\u003c/span>\u003c/div>\u003cdiv>\u003cb>special\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>특별한\u003c/span>\u003c/div>\u003cdiv>\u003cb>family\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가족\u003c/span>\u003c/div>\u003cdiv>\u003cb>create\u003c/b>\u003cem>동사\u003c/em>\u003cspan>만들다\u003c/span>\u003c/div>\u003cdiv>\u003 합니다.","hl":"mn"},{"n":21,"text":"먼저 콤마 사이에 있는 the Magic Dream은 앞의 Our ship과 같은 대상을 가리키는 동격이에요. 우리의 배, 즉 매직 드림이라고 부연해 주는 거죠. 그리고 마지막 itself는 없어도 문장이 성립하는 재귀대명사인데, 이렇게 쓰이면 강조 용법으로 바로 그 자체라는 뜻을 더해 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 5\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 유람선은\u003c/span>\u003cspan class=\"en\">This cruise ship\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유명합니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">famous \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것의 고전적인 디자인으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">its \u003c/span>\u003cspan class=\"tgt\">classical \u003c/span>\u003cspan class=\"tgt\">design \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 현대적인 시설로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">modern \u003c/span>\u003cspan class=\"tgt\">facilities\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 유람선은 고전적인 디자인과 현대적인 시설로 유명합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 배의 이름을 소개한 뒤, 이 배가 어떤 배인지 성격을 규정하는 문장입니다. \u003cb class=\"key\">고전적 \u003c/b>\u003cb class=\"key\">디자인\u003c/b>과 \u003cb class=\"key\">현대적 \u003c/b>\u003cb class=\"key\">시설\u003c/b>이라는 서로 다른 매력을 \u003cb class=\"key\">병렬\u003c/b>로 묶어, 전통미와 편리함을 동시에 갖췄다는 인상을 줍니다. be famous for는 '~로 유명하다'라는 \u003cb class=\"key\">관용표현\u003c/b>입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be famous for 관용표현(이유·원인)\u003c/span> : [주어] + be famous for + [명사(구)] : \"~로 유명하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 목적어의 병렬구조(and)\u003c/span> : for + [명사구 A: its classical design] + and + [명사구 B: modern facilities] : \"그것의 고전적인 디자인과 현대적인 시설로\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"This cruise ship, 이 유람선은. is famous, 유명합니다. for its classical design, 그것의 고전적인 디자인으로. and modern facilities, 그리고 현대적인 시설로. 이 문장 전체를 해석하면, 이 유람선은 고전적인 디자인과 현대적인 시설로 유명합니다.","hl":"m"},{"n":23,"text":"이 문장은 유람선의 성격을 소개하는 역할을 해요. 고전적인 디자인과 현대적인 시설을 함께 갖췄다고 말하면서 전통미와 편리함을 동시에 지닌 배라는 인상을 주죠. be famous for는 ~로 유명하다라는 뜻의 관용표현이니까 통째로 익혀 두세요.","hl":"mn"},{"n":24,"text":"첫 번째 어법 포인트는 be famous for예요. 주어 This cruise ship 뒤에 is famous for가 이어지면서 ~로 유명하다라는 뜻을 만들어 줍니다. 두 번째는 병렬 구조인데요, 전치사 for의 목적어로 its classical design과 modern facilities, 두 개의 명사구가 and로 대등하게 연결되어 있어요. 전치사를 두 번 쓰지 않고 한 번만 써서 두 명사구 모두에 걸치게 했다는 점, 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 5\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 또한 가지고 있습니다\u003c/span>\u003cspan class=\"en\">It also has\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가장 큰 수영장을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">biggest \u003c/span>\u003cspan class=\"tgt\">pool\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 유람선보다도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">any \u003c/span>\u003cspan class=\"tgt\">cruise \u003c/span>\u003cspan class=\"tgt\">ship\u003c/span>. * Date of Departure: April 1 ― 5 (4 nights sailing) * Departing from / Returning to: Port of Miami, Florida * Sailing to: Three islands in the Caribbean * Facilities: 4 pools, 3 restaurants, 3 snack bars, 2 gyms * Onboard Activities: magic shows, musicals, fireworks at night * Meals: free breakfast, lunch, and dinner (additional charge for snacks and drinks) * Room Description: 2 king beds, bathroom with shower, refrigerator, wireless Internet access, TV with recent movies * Price: $4,500 ~ $5,000 • For more information and reservation, please call (122) 341-1234.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 또한 어떤 유람선보다 가장 큰 수영장을 가지고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 디자인과 시설을 소개한 흐름을 이어, 수영장 크기로 이 배의 특별함을 강조하는 문장입니다. \u003cb class=\"key\">최상급\u003c/b>을 써서 다른 어떤 유람선과 비교해도 가장 크다는 점을 내세웁니다. of any cruise ship은 '어떤 유람선 중에서도'라는 뜻으로 \u003cb class=\"key\">비교\u003c/b>의 범위를 나타냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">최상급 표현(the + 최상급 + 명사)\u003c/span> : the + [최상급 형용사 biggest] + [명사 pool] : \"가장 큰 수영장\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">최상급 + of any + 단수명사\u003c/span> : [최상급] + of any + [단수명사(집합 전체 대표)] : \"어떤 유람선 중에서도(어떤 유람선보다도)\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"It also has, 그것은 또한 가지고 있습니다. the biggest pool, 가장 큰 수영장을. of any cruise ship, 어떤 유람선보다도. 이 문장 전체를 해석하면, 그것은 또한 어떤 유람선보다 가장 큰 수영장을 가지고 있습니다.","hl":"m"},{"n":26,"text":"앞에서 디자인과 시설을 소개한 흐름에 이어, 이번에는 수영장 크기로 이 배의 특별함을 강조하는 문장이에요. 최상급을 써서 다른 어떤 유람선과 견줘도 가장 크다는 점을 내세우고 있죠. 그래서 이 배의 차별점을 확실하게 보여 주는 문장입니다.","hl":"mn"},{"n":27,"text":"첫 번째 어법 포인트는 최상급 표현이에요. the biggest pool처럼 the와 최상급 형용사가 명사를 꾸며 주면 가장 큰 수영장이라는 뜻이 됩니다. 두 번째는 of any cruise ship인데요, 최상급 뒤에 of any와 단수명사가 오면 어떤 유람선 중에서도라는 비교의 범위를 나타내요. 그래서 전체를 어떤 유람선보다도 가장 큰 수영장을 가지고 있다로 해석하면 자연스럽습니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>드림 컴퍼니 유람선 여행은 가족을 위한 특별한 \u003cb class=\"key\">휴가\u003c/b>를 제안하는 광고예요.\u003c/li>\u003cli>매직 드림은 고전적인 디자인과 현대적인 시설, 그리고 어떤 유람선보다 큰 \u003cb class=\"key\">수영장\u003c/b>으로 소개돼요.\u003c/li>\u003cli>4월 1일부터 5일까지 4박 동안 마이애미 항구에서 출발해 카리브해의 세 섬을 항해하는 \u003cb class=\"key\">일정\u003c/b>이에요.\u003c/li>\u003cli>선상 활동, 식사, 객실, 가격과 예약 전화번호 같은 구체적인 정보가 \u003cb class=\"key\">예약\u003c/b>을 유도해요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>A Dream Company cruise offers families a memorable four-night Caribbean holiday on the Magic Dream, featuring classical design, modern facilities, and the biggest pool of any cruise ship.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">\u003cb class=\"key\">드림 \u003c/b>\u003cb class=\"key\">컴퍼니 \u003c/b>\u003cb class=\"key\">유람선 \u003c/b>\u003cb class=\"key\">여행\u003c/b>은 가족이 함께 \u003cb class=\"key\">추억\u003c/b>을 만들 수 있는 꿈같은 휴가 상품으로, 고전적인 디자인과 현대적인 시설, 큰 수영장을 갖춘 배에서 카리브해의 세 섬을 항해해요.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":28,"text":"정리해 볼게요. 이 글은 가족을 위한 특별한 휴가를 제안하는 광고로, 매직 드림의 고전적인 디자인과 현대적인 시설, 가장 큰 수영장, 풍성한 선상 활동과 구체적인 여행 일정, 가격, 예약 안내를 제시해요. 마지막에는 예약을 유도하는 질문 답변 구조의 두괄식 글이었어요. 오늘 배운 흐름을 다른 광고 글에도 적용해 보시고, 수고했어요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
