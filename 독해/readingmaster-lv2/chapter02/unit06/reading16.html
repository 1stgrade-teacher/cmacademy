과 같은 디지털 기기(Digital Devices)를 활용해 교육 콘텐츠를 소비하는 방식을 의미하는데요, 마치 우리가 도서관에서 책을 빌려 보는 대신 태블릿으로 전자책을 읽는 것과 비슷하다고 생각하면 쉽습니다. 특히 에듀테크(EdTech)의 발전으로 인해 학습 도구가 고정된 컴퓨터에서 휴대용 기기(Portable Devices)로 이동하는 변화가 나타나고 있는데, 이는 학생들이 언제 어디서나 학습의 연속성(Continuity of Learning)을 유지하는 데 매우 중요한 역할을 한답니다. 이번 지문에서는 2016년부터 2019년까지 이러한 기기들이 실제로 교육 현장에서 어떻게 활용되었는지 구체적인 데이터를 통해 살펴볼 예정이니, 기술 변화가 교육 환경에 미친 영향에 주목해 보세요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01조사 개요</div><ul><li>유치원생부터 고등학생까지를 대상으로 디지털 교육 콘텐츠 접속 기기를 조사하였다.</li><li>조사 기간: 2016년 및 2019년 (survey years)</li><li>조사 대상: 유치원부터 12학년까지의 학생 (kindergarten to 12th grade)</li><li>핵심 키워드: 디지털 교육 콘텐츠(digital educational content)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02가장 선호된 기기</div><ul><li>노트북과 태블릿은 두 조사 연도 모두에서 높은 사용 비중을 차지하였다.</li><li>가장 대중적인 기기: 노트북 (laptops)</li><li>태블릿 사용 비율: 60퍼센트 이상 (tablets)</li><li>핵심 키워드: 사용 빈도(usage frequency)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03감소 및 유지된 기기 활용도</div><ul><li>데스크톱 이용률은 감소 추세를 보였으며, 스마트폰 이용률은 변화가 없었다.</li><li>데스크톱: 2016년(50% 이상) 대비 2019년(30% 이상) 감소 (desktops)</li><li>스마트폰: 2016년과 2019년 동일한 비율 유지 (smartphones)</li><li>핵심 키워드: 이용률 변화(change in percentage)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04최소 사용 기기</div><ul><li>전자책 단말기는 조사된 모든 기기 중에서 가장 낮은 사용률을 기록하였다.</li><li>전자책 단말기: 두 해 모두 가장 낮은 비율 (E-readers)</li><li>기기별 비교를 통한 최하위 순위 확인</li><li>핵심 키워드: 전자책 단말기(E-readers)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">access</td><td class=\"m\">접근하다, 이용하다</td></tr><tr><td class=\"w\">participate in</td><td class=\"m\">~에 참여하다</td></tr><tr><td class=\"w\">percentage</td><td class=\"m\">비율, 백분율</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">위 그래프는</span><span class=\"en\"><b>The above graph</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리에게 보여준다</span><span class=\"en\"><b><span class=\"grammar-hl\">shows us</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">학생들이 무슨 기기를 사용했는지</span><span class=\"en\"><b><span class=\"grammar-hl\">what devices students used</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">디지털 교육 콘텐츠에 접근하기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to access</span> digital educational content.</b></span></div></div><div class=\"lec-sent-ko\">위 그래프는 학생들이 교육용 디지털 콘텐츠에 접근하기 위해 무슨 기기를 사용했는지를 우리에게 보여준다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 글 전체의 주제를 소개합니다. 독자에게 그래프가 담고 있는 정보의 성격이 무엇인지 명확히 밝히며, 이어질 구체적인 수치 설명의 토대를 마련합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">shows us what devices students used to access (간접의문문): &#39;의문사(what devices)+주어(students)+동사(used)&#39;의 어순으로 명사절을 구성하여 shows의 직접목적어 역할을 함</div><div class=\"lec-gr-item\">to access (to부정사): 부사적 용법(목적)으로 &#39;~하기 위하여&#39;라고 해석하며 사용된 용례</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">access</td><td class=\"m\">접근하다, 이용하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 조사는</span><span class=\"en\"><b>The survey</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수행되었다</span><span class=\"en\"><b><span class=\"grammar-hl\">was done</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">2016년과 2019년 두 해에</span><span class=\"en\"><b>in both 2016 and 2019.</b></span></div></div><div class=\"lec-sent-ko\">조사는 2016년과 2019년 두 해에 수행되었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 문장에서 언급한 데이터의 출처를 설명합니다. 시간에 따른 변화를 비교하기 위해 어떤 시점의 데이터를 가져왔는지 범위를 한정해 주는 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was done (수동태): be동사(was)+p.p.(done) 구조. do는 타동사인데 목적어가 없어서 수동구조 was done 형태로 쓴다. 기본구조: V + O (행위를 하다)</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">유치원부터 12학년까지의 학생들은</span><span class=\"en\"><b>Students from kindergarten to the 12th grade</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 조사에 참여했다</span><span class=\"en\"><b><span class=\"grammar-hl\">participated in</span> the survey,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그들은 사용했다</span><span class=\"en\"><b>and they used</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 종류의 디지털 기기를</span><span class=\"en\"><b>many kinds of digital devices.</b></span></div></div><div class=\"lec-sent-ko\">유치원에서 12학년까지의 학생들이 조사에 참여했으며, 그들은 많은 종류의 디지털 기기를 사용했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 조사 대상의 범위를 구체화합니다. 연령대가 넓은 만큼 디지털 기기 활용의 다양성이 나타날 수밖에 없다는 배경을 제공합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">participated in (관용표현): 동사 participate 뒤에 전치사 in을 반드시 동반하여 &#39;~에 참가하다&#39;라는 의미를 형성함</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">노트북은</span><span class=\"en\"><b>Laptops</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가장 인기 있는 기기였다</span><span class=\"en\"><b>were the most popular device</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">디지털 콘텐츠에 접근하기 위한</span><span class=\"en\"><b><span class=\"grammar-hl\">to access</span> digital content</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">두 해 모두</span><span class=\"en\"><b>in both years.</b></span></div></div><div class=\"lec-sent-ko\">두 해 모두 노트북은 디지털 콘텐츠 접속을 위한 가장 인기 있는 기기였다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 구체적인 분석의 첫 시작으로, 데이터 중에서 가장 높은 비중을 차지하는 항목을 먼저 짚어주어 독자가 그래프의 핵심을 파악하도록 돕습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to access (to부정사): 형용사적 용법으로 앞의 명사 device를 수식하여 &#39;~하는 (기기)&#39;의 의미를 만듦</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">access</td><td class=\"m\">접근하다, 이용하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">2016년과 2019년 모두</span><span class=\"en\"><b>Both in 2016 and in 2019,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">60퍼센트가 넘는 학생들이</span><span class=\"en\"><b>more than 60 percent of the students</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">태블릿을 사용했다</span><span class=\"en\"><b><span class=\"grammar-hl\">used</span> tablets</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">디지털 콘텐츠를 위해</span><span class=\"en\"><b>for digital content.</b></span></div></div><div class=\"lec-sent-ko\">2016년과 2019년 모두 60퍼센트 넘는 학생들이 디지털 콘텐츠를 위해 태블릿을 사용했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 태블릿 활용도가 두 시점 모두 높았다는 점을 강조합니다. 이는 노트북과 함께 태블릿이 디지털 학습의 주류 기기임을 뒷받침하는 근거가 됩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">used 5형식(SVOC) 구조: 본 문장은 3형식이나, use는 보통 목적어 뒤에 목적보어(to부정사/명사구 등)를 취하는 5형식 구조의 기반이 될 수 있음</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">절반이 넘는 학생들이</span><span class=\"en\"><b><span class=\"grammar-hl\">More than half</span> the students</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">데스크톱을 사용했다</span><span class=\"en\"><b>used desktops</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">디지털 콘텐츠를 위해</span><span class=\"en\"><b>for digital content</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">2016년에는</span><span class=\"en\"><b>in 2016,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 30퍼센트 넘는 학생들이</span><span class=\"en\"><b>and more than 30 percent</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">데스크톱을 사용했다</span><span class=\"en\"><b>used desktops</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">디지털 콘텐츠를 위해</span><span class=\"en\"><b>for digital content</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">2019년에는</span><span class=\"en\"><b>in 2019.</b></span></div></div><div class=\"lec-sent-ko\">2016년에는 절반이 넘는 학생들이 디지털 콘텐츠를 위해 데스크톱을 사용했고, 2019년에는 30퍼센트 넘는 학생들이 디지털 콘텐츠를 위해 데스크톱을 사용했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 2016년과 2019년 사이의 변화를 보여줍니다. 데스크톱의 사용 비중이 눈에 띄게 감소했음을 제시하여 독자가 디지털 학습 환경의 변화 추이를 감지하게 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">more than half (관용표현): 수량의 정도를 나타내는 표현으로 &#39;절반이 넘는&#39;이라는 의미의 구문</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">2016년에 스마트폰을 사용한 학생의 비율은</span><span class=\"en\"><b>The percentage of students <span class=\"grammar-hl\">who used smartphones</span> in 2016</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">같았다</span><span class=\"en\"><b>was the same as</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">2019년의 그것과</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> in 2019.</b></span></div></div><div class=\"lec-sent-ko\">2016년에 스마트폰을 사용한 학생의 비율은 2019년에 스마트폰을 사용한 학생들의 비율과 같았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 수치 변화가 없는 항목을 따로 언급함으로써 데이터 간의 대조를 꾀합니다. 변화하는 지표들 사이에서 변함없는 기준점을 제시하여 정보의 균형을 맞춥니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">who used smartphones (관계대명사): 주격 관계대명사 who가 the students를 선행사로 받아 뒤에 동사 used가 이어지는 절을 구성함</div><div class=\"lec-gr-item\">that (관용표현): 앞서 언급된 &#39;the percentage&#39;를 반복하지 않기 위해 대신 사용된 대명사 용법</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">percentage</td><td class=\"m\">비율, 백분율</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">전자책 단말기를 사용한 학생들의 비율은</span><span class=\"en\"><b>The percentages of students <span class=\"grammar-hl\">who used E-readers</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가장 낮았다</span><span class=\"en\"><b>were the lowest</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">두 해 모두</span><span class=\"en\"><b>in both years.</b></span></div></div><div class=\"lec-sent-ko\">전자책 단말기를 사용한 학생들의 비율은 두 해 모두 가장 낮았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 가장 높은 수치를 보였던 앞선 설명들과 대조하여 가장 낮은 항목을 제시함으로써, 그래프상의 전체적인 분포를 마무리 짓는 결론적인 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">who used E-readers (관계대명사): 주격 관계대명사 who가 the percentages of students를 선행사로 받아 뒤에 동사 used가 이어지는 절을 구성함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">percentage</td><td class=\"m\">비율, 백분율</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>2016년과 2019년 학생들의 디지털 학습 기기 활용 실태를 조사했다.</li><li>노트북이 두 해 모두 가장 대중적인 기기였다.</li><li>태블릿 사용 비율은 두 해 모두 60% 이상으로 높게 유지되었다.</li><li>데스크톱 사용은 2016년 대비 2019년에 감소했다.</li><li>스마트폰 사용률은 동일했고, E-리더 사용률은 양쪽 모두 가장 낮았다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Laptops were the most frequently used devices by students in both years, while the usage rates of other digital tools fluctuated or remained consistent.</div>\n              <div class=\"lec-final-sum-ko\">두 해 모두 노트북이 학생들에게 가장 많이 사용된 기기였으며, 다른 디지털 도구들의 사용률은 변동되었거나 일정한 수준을 유지했다.</div></div></div>"],"segs":[[{"audio":"./reading16_audio/1.mp3","hl":null}],[{"audio":"./reading16_audio/2.mp3","hl":null}],[{"audio":"./reading16_audio/3.mp3","hl":null},{"audio":"./reading16_audio/4.mp3","hl":"stage-0"},{"audio":"./reading16_audio/5.mp3","hl":"stage-1"},{"audio":"./reading16_audio/6.mp3","hl":"stage-2"},{"audio":"./reading16_audio/7.mp3","hl":"stage-3"}],[{"audio":"./reading16_audio/8.mp3","hl":null}],[{"audio":"./reading16_audio/9.mp3","hl":"main"},{"audio":"./reading16_audio/10.mp3","hl":"meaning"},{"audio":"./reading16_audio/11.mp3","hl":"grammar"}],[{"audio":"./reading16_audio/12.mp3","hl":"main"},{"audio":"./reading16_audio/13.mp3","hl":"meaning"},{"audio":"./reading16_audio/14.mp3","hl":"grammar"}],[{"audio":"./reading16_audio/15.mp3","hl":"main"},{"audio":"./reading16_audio/16.mp3","hl":"meaning"},{"audio":"./reading16_audio/17.mp3","hl":"grammar"}],[{"audio":"./reading16_audio/
