<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터2 Reading16 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터2 Reading16","audioDir":"reading16_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.520em\">Reading16\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터2\u003c/div>\u003ch1>How Students Accessed Digital Educational Content: 2016 vs. 2019\u003c/h1>\u003ch2>학생들은 어떤 기기로 교육용 디지털 콘텐츠에 접근했을까: 2016년과 2019년\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>이 지문은 2016년과 2019년에 학생들이 교육용 디지털 콘텐츠에 접근하기 위해 사용한 \u003cb class=\"key\">기기\u003c/b>를 비교한 그래프를 설명한다. 두 해 모두 \u003cb class=\"key\">노트북\u003c/b>이 가장 인기 있는 기기였고, \u003cb class=\"key\">전자책 \u003c/b>\u003cb class=\"key\">단말기\u003c/b>를 사용한 학생의 비율이 가장 낮았다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Laptops were the most popular device for accessing digital educational content in both 2016 and 2019, while E-readers showed the lowest percentages in both years.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 볼 지문은 그래프를 설명하는 글이에요. 학생들이 교육용 디지털 콘텐츠에 접근할 때 어떤 기기를 썼는지, 이천십육 년과 이천십구 년을 비교한 자료죠. 요약하면 두 해 모두 노트북이 가장 인기 있었고, 전자책 단말기의 비율이 가장 낮았다는 내용이에요. 이제 그래프 읽는 순서부터 차근차근 짚어 볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">디지털 콘텐츠(digital content)는 종이 교과서 대신 화면으로 읽고 보는 학습 자료를 말해요. 이런 콘텐츠를 보려면 노트북(laptop), 태블릿(tablet), 데스크톱(desktop), 스마트폰(smartphone) 같은 \u003cb class=\"key\">기기\u003c/b>가 필요하죠. 사람들은 화면 크기, 휴대성, 가격 같은 조건에 따라 기기를 고르기 때문에 기기별 사용 \u003cb class=\"key\">비율\u003c/b>은 시대에 따라 달라져요. 예를 들어 무거운 데스크톱은 방에 두고 보는 텔레비전 같고, 스마트폰은 주머니에 넣고 다니는 \u003cb class=\"key\">손전등\u003c/b> 같아서 쓰임새가 다르죠. 이 지문은 2016년과 2019년에 같은 \u003cb class=\"key\">설문 \u003c/b>\u003cb class=\"key\">조사\u003c/b>를 두 번 해서 어떤 기기가 얼마나 쓰였는지 \u003cb class=\"key\">그래프\u003c/b>로 비교한 자료예요. 숫자를 읽을 때는 가장 높은 것과 가장 낮은 것, 그리고 변한 것과 변하지 않은 것을 구분하는 것이 핵심이에요.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식부터 볼게요. 디지털 콘텐츠는 종이 교과서 대신 화면으로 읽고 보는 학습 자료를 말해요. 이런 콘텐츠를 보려면 노트북, 태블릿, 데스크톱, 스마트폰 같은 기기가 필요하죠. 사람들은 화면 크기나 휴대성, 가격 같은 조건에 따라 기기를 고르기 때문에 기기별 사용 비율은 시대에 따라 달라져요. 무거운 데스크톱은 방에 두고 보는 텔레비전 같고, 스마트폰은 주머니에 넣고 다니는 손전등 같아서 쓰임새가 다르죠. 그래서 이 글은 이천십육 년과 이천십구 년에 같은 설문 조사를 두 번 해서, 어떤 기기가 얼마나 쓰였는지 그래프로 비교한 자료라고 이해하시면 돼요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>그래프 소개와 조사 개요\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>첫 문장은 이 그래프가 학생들이 교육용 \u003cb class=\"key\">디지털 \u003c/b>\u003cb class=\"key\">콘텐츠\u003c/b>에 접근할 때 사용한 \u003cb class=\"key\">기기\u003c/b>를 보여 준다고 밝혀요. 이어서 조사가 2016년과 2019년 두 해에 걸쳐 진행되었다는 점과, 유치원부터 12학년까지의 학생들이 참여했다는 \u003cb class=\"key\">배경 \u003c/b>\u003cb class=\"key\">정보\u003c/b>가 나옵니다. 즉 본격적인 수치를 읽기 전에 무엇을, 언제, 누구에게 물었는지 정리해 주는 단계예요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>가장 인기 있는 기기\u003csmall>핵심 결과 · 문장 4\u003c/small>\u003c/h4>\u003cp>네 번째 문장에서 두 해 모두 \u003cb class=\"key\">노트북\u003c/b>이 디지털 콘텐츠 접속을 위한 가장 인기 있는 기기였다고 \u003cb class=\"key\">결론\u003c/b>을 먼저 말해요. 이 문장이 그래프 전체를 관통하는 가장 중요한 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">정보\u003c/b>이므로, 나머지 기기들은 노트북과 비교하며 읽으면 좋아요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>기기별 수치 비교\u003csmall>근거·예시 · 문장 5–7\u003c/small>\u003c/h4>\u003cp>태블릿은 두 해 모두 60퍼센트가 넘었고, \u003cb class=\"key\">데스크톱\u003c/b>은 2016년 절반 이상에서 2019년 30퍼센트 이상으로 줄었어요. 스마트폰은 2016년과 2019년의 \u003cb class=\"key\">비율\u003c/b>이 같았다는 점이 the same as로 제시되죠. 이렇게 기기마다 \u003cb class=\"key\">수치\u003c/b>를 하나씩 짚으며 두 해를 나란히 비교하는 단계예요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>가장 낮은 기기\u003csmall>결론 · 문장 8\u003c/small>\u003c/h4>\u003cp>마지막 문장은 \u003cb class=\"key\">전자책 \u003c/b>\u003cb class=\"key\">단말기\u003c/b>를 사용한 학생들의 비율이 두 해 모두 가장 낮았다고 정리해요. 앞에서 가장 인기 있는 기기가 노트북이었다면, 여기서는 반대편 끝인 \u003cb class=\"key\">최저\u003c/b> 기기를 제시하며 그래프 설명을 마무리하죠.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 네 단계로 나눠서 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 도입이에요. 첫 번째 문장에서 이 그래프가 학생들이 교육용 디지털 콘텐츠에 접근할 때 사용한 기기를 보여 준다고 밝히죠. 이어서 조사가 이천십육 년과 이천십구 년 두 해에 걸쳐 진행되었다는 점, 유치원부터 십이 학년까지의 학생들이 참여했다는 배경 정보가 나와요. 본격적인 수치를 읽기 전에 무엇을, 언제, 누구에게 물었는지 정리하는 단계라고 보시면 됩니다.","hl":"f0"},{"n":5,"text":"두 번째 단계는 가장 인기 있는 기기를 말하는 부분이에요. 네 번째 문장에서 두 해 모두 노트북이 디지털 콘텐츠 접속을 위한 가장 인기 있는 기기였다고 결론을 먼저 말하죠. 이 문장이 그래프 전체를 관통하는 핵심 정보예요. 그래서 나머지 기기들은 노트북과 비교하면서 읽으면 훨씬 편해요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 기기별 수치를 비교하는 부분이에요. 태블릿은 두 해 모두 육십 퍼센트가 넘었고, 데스크톱은 이천십육 년에 절반이 넘었다가 이천십구 년에는 삼십 퍼센트가 넘는 수준으로 줄었어요. 스마트폰은 두 해의 비율이 같았다는 점이 the same as로 제시되죠. 이렇게 기기마다 수치를 하나씩 짚으며 두 해를 나란히 놓고 비교하는 단계예요.","hl":"f2"},{"n":7,"text":"마지막 단계는 가장 낮은 기기를 정리하는 부분이에요. 전자책 단말기를 사용한 학생들의 비율이 두 해 모두 가장 낮았다고 말하죠. 가장 인기 있는 기기가 노트북이었다면, 여기서는 반대편 끝인 최저 기기를 제시하면서 그래프 설명을 마무리해요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">비교·대조\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 번째 문장에서 그래프가 무엇을 보여 주는지 \u003cb class=\"key\">주제\u003c/b>를 먼저 밝히고, 이어서 조사 시기와 참여자 같은 \u003cb class=\"key\">배경 \u003c/b>\u003cb class=\"key\">정보\u003c/b>를 제시해요. 그다음 노트북, 태블릿, 데스크톱, 스마트폰, 전자책 단말기를 차례로 놓고 2016년과 2019년의 \u003cb class=\"key\">비율\u003c/b>을 \u003cb class=\"key\">비교\u003c/b>하는 방식으로 전개되죠. 전체 내용이 하나의 주장이 아니라 수치를 \u003cb class=\"key\">대조\u003c/b>하는 설명이므로 비교·대조 구조로 보는 것이 맞아요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>The above graph shows (1)\u003c/b>\u003cspan>도입·주제 제시\u003c/span>\u003cb>in both years (4)\u003c/b>\u003cspan>공통점 강조\u003c/span>\u003cb>the same as (7)\u003c/b>\u003cspan>동일함 비교\u003c/span>\u003cb>the lowest (8)\u003c/b>\u003cspan>최저값 제시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">devices\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">digital devices\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the most popular device\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">more than 60 percent of the students\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">More than half the students\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">more than 30 percent\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">The percentage of students\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">The percentages of students\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>2016년\u003c/th>\u003cth>2019년\u003c/th>\u003c/tr>\u003ctr>\u003ctd>데스크톱: 절반 이상 사용\u003c/td>\u003ctd>데스크톱: 30퍼센트 이상 사용\u003c/td>\u003c/tr>\u003ctr>\u003ctd>태블릿: 60퍼센트 이상\u003c/td>\u003ctd>태블릿: 60퍼센트 이상\u003c/td>\u003c/tr>\u003ctr>\u003ctd>전자책 단말기: 최저\u003c/td>\u003ctd>전자책 단말기: 최저\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 비교와 대조예요. 첫 번째 문장에서 그래프가 무엇을 보여 주는지 주제를 먼저 던지고, 그다음에 조사 시기와 참여자라는 배경 정보를 붙이는 두괄식 구조죠. 이후에는 노트북, 태블릿, 데스크톱, 스마트폰, 전자책 단말기를 차례로 놓고 이천십육 년과 이천십구 년의 비율을 비교해요. 하나의 주장을 펴는 글이 아니라 수치를 대조하는 설명 글이라는 점을 기억하세요.","hl":"ty"},{"n":9,"text":"신호어를 짚어 볼게요. 첫 번째 문장의 The above graph shows는 도입이면서 주제를 제시하는 신호예요. in both years처럼 두 해를 묶어 주는 표현은 공통점을 강조하고, the same as는 두 해의 수치가 같다는 재진술을 알려 주죠. 마지막의 the lowest는 최저값을 표시하는 신호이므로, 답을 찾을 때 이 표현들 옆의 숫자를 먼저 확인하면 됩니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>above\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>위의\u003c/span>\u003c/div>\u003cdiv>\u003cb>show\u003c/b>\u003cem>동사\u00 >\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">학생들이 어떤 기기들을 사용했는지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">devices \u003c/span>\u003cspan class=\"tgt\">students \u003c/span>\u003cspan class=\"tgt\">used\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">디지털 교육 콘텐츠에 접근하기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">access \u003c/span>\u003cspan class=\"tgt\">digital \u003c/span>\u003cspan class=\"tgt\">educational \u003c/span>\u003cspan class=\"tgt\">content\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">위 그래프는 학생들이 교육용 디지털 콘텐츠에 접근하기 위해 무슨 기기를 사용했는지를 우리에게 보여준다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 그래프의 \u003cb class=\"key\">주제\u003c/b>를 소개하는 도입 문장이에요. show의 목적어 자리에 \u003cb class=\"key\">간접의문문\u003c/b>이 와서 '무엇을 사용했는지'라는 \u003cb class=\"key\">정보\u003c/b>를 그래프가 담고 있음을 밝히죠. 뒤의 to access는 '접근하기 위해'라는 \u003cb class=\"key\">목적\u003c/b>을 나타내요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">간접의문문(4형식 동사 show + 간접의문문 목적어)\u003c/span> : show + [간접목적어 us] + [간접의문문 what devices students used] : \"학생들이 어떤 기기들을 사용했는지 우리에게 보여준다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : used devices + [to access (to부정사구/목적)] : \"디지털 교육 콘텐츠에 접근하기 위해\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"The above graph, 위의 그래프는. shows us, 우리에게 보여준다. what devices students used, 학생들이 어떤 기기들을 사용했는지. to access digital educational content, 디지털 교육 콘텐츠에 접근하기 위해. 이 문장 전체를 해석하면, 위 그래프는 학생들이 교육용 디지털 콘텐츠에 접근하기 위해 무슨 기기를 사용했는지를 우리에게 보여준다.","hl":"m"},{"n":13,"text":"이 문장은 그래프가 무엇을 보여 주는지 알려 주는 도입 문장이에요. show 다음에 what devices students used가 통째로 와서 '무엇을 사용했는지'라는 정보를 전달하죠. 뒤에 붙은 to access는 기기를 사용한 목적, 즉 디지털 교육 콘텐츠에 접근하기 위해서라는 뜻이에요.","hl":"mn"},{"n":14,"text":"첫 번째로, shows us 다음에 what devices students used가 왔죠. 이건 간접의문문인데, 의문사 다음에 주어와 동사가 평서문 어순으로 온다는 점이 핵심이에요. 두 번째로, to access는 to부정사의 부사적 용법으로 목적을 나타내요. 그래서 '접근하기 위해'라고 해석하고, 여기서 to는 전치사가 아니라 to부정사의 표시라고 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 조사는\u003c/span>\u003cspan class=\"en\">The survey\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수행되었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">done\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">2016년과 2019년 두 해에\u003c/span>\u003cspan class=\"en\">in \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">both \u003c/span>\u003cspan class=\"tgt\">2016 \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">2019\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">조사는 2016년과 2019년 두 해에 수행되었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 조사가 언제 실시되었는지 알려 주는 문장이에요. 주어인 the survey가 조사를 '당하는' 대상이므로 \u003cb class=\"key\">수동태\u003c/b>로 표현했죠. both A and B로 두 해를 묶어 \u003cb class=\"key\">비교\u003c/b>의 범위를 제시해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태(be동사 + 과거분사)\u003c/span> : The survey [주어] + was done [be동사 + 과거분사] : \"수행되었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">상관접속사 both A and B\u003c/span> : in [both A and B] (A와 B 둘 다) : \"2016년과 2019년 두 해 모두에\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"The survey, 그 조사는. was done, 수행되었다. in both 2016 and 2019, 2016년과 2019년 두 해에. 이 문장 전체를 해석하면, 조사는 2016년과 2019년 두 해에 수행되었다.","hl":"m"},{"n":16,"text":"이 문장은 조사가 언제 이루어졌는지 알려 주는 역할을 해요. 조사는 사람이 당하는 입장이니까 수동태로 표현했고, 두 해를 모두 포함한다는 점을 both A and B로 강조하고 있죠.","hl":"mn"},{"n":17,"text":"첫 번째로, was done은 수동태예요. be동사가 시제를 맡고 과거분사가 '행해지다'라는 의미를 담는다고 정리해 두세요. 두 번째로, both 2016 and 2019에서 both와 and가 짝을 이루는 상관접속사로 쓰였어요. so both of them, 두 해 모두를 가리킨다고 이해하면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유치원에서 12학년까지의 학생들이\u003c/span>\u003cspan class=\"en\">Students \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">kindergarten \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">12th \u003c/span>\u003cspan class=\"tgt\">grade\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">조사에 참여했으며,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">participated \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">survey\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그들은 사용했다\u003c/span>\u003cspan class=\"en\">and they used\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 종류의 디지털 기기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">many \u003c/span>\u003cspan class=\"tgt\">kinds \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">digital \u003c/span>\u003cspan class=\"tgt\">devices\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">유치원에서 12학년까지의 학생들이 조사에 참여했으며, 그들은 많은 종류의 디지털 기기를 사용했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 조사 대상이 누구이며 무엇을 사용했는지 밝히는 문장이에요. from A to B로 참여자의 \u003cb class=\"key\">범위\u003c/b>를 한정하고, and로 두 사실을 \u003cb class=\"key\">병렬\u003c/b>로 연결하죠. many kinds of로 기기의 \u003cb class=\"key\">다양성\u003c/b>을 강조해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구 from A to B(범위)\u003c/span> : [from A to B] (A부터 B까지) : \"유치원에서 12학년까지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">자동사 + 전치사(participate in)\u003c/span> : participate [자동사] + in + [목적어] : \"조사에 참여했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">수량 표현 many kinds of + 복수명사\u003c/span> : many kinds of + [복수명사 devices] : \"많은 종류의 디지털 기기\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Students from kindergarten to the 12th grade, 유치원에서 12학년까지의 학생들이. participated in the survey, 조사에 참여했으며. and they used, 그리고 그들은 사용했다. many kinds of digital devices, 많은 종류의 디지털 기기를. 이 문장 전체를 해석하면, 유치원에서 12학년까지의 학생들이 조사에 참여했으며, 그들은 많은 종류의 디지털 기기를 사용했다.","hl":"m"},{"n":19,"text":"이 문장은 조사에 누가 참여했고 그들이 무엇을 사용했는지 알려 줘요. 유치원부터 열두 학년까지 범위를 한정해서 대상이 아주 넓다는 점을 보여 주고, and로 두 사실을 나란히 이어 주고 있죠. 그리고 many kinds of로 기기의 종류가 다양하다는 점도 함께 짚어 주고 있어요.","hl":"mn"},{"n":20,"text":"첫 번째로, from kindergarten to the 12th grade는 from A to B 형태로 범위를 나타내요. 이 전치사구가 Students를 뒤에서 꾸며 주는 역할을 한다는 점을 기억하세요. 두 번째로, participate는 전치사 in을 꼭 데리고 다니는 자동사예요. 그래서 참여 대상은 in the survey처럼 전치사구로 받습니다. 세 번째로, many kinds of 뒤에는 복수명사 devices가 와서 여러 종류의 기기를 뜻한다는 것도 챙겨 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">노트북은\u003c/span>\u003cspan class=\"en\">Laptops\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가장 인기 있는 기기였다\u003c/span>\u003cspan class=\"en\">were \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\" \"gn\">수량 표현 주어의 주어-동사 수 일치\u003c/span> : [수량] percent of + [복수명사] + [복수동사] : \"60퍼센트 넘는 학생들이\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Both in 2016 and in 2019, 2016년과 2019년 모두. more than 60 percent of the students, 60퍼센트 넘는 학생들이. used tablets, 태블릿을 사용했다. for digital content, 디지털 콘텐츠를 위해. 이 문장 전체를 해석하면, 2016년과 2019년 모두 60퍼센트 넘는 학생들이 디지털 콘텐츠를 위해 태블릿을 사용했다.","hl":"m"},{"n":25,"text":"태블릿이 두 해 모두 육십 퍼센트를 넘었다는 걸 알려 주는 문장이에요. 노트북 다음으로 많이 쓰인 기기가 태블릿이라는 근거가 되죠. 두 해를 함께 묶어서 같은 경향이 반복된다는 점을 강조합니다.","hl":"mn"},{"n":26,"text":"첫 번째, Both in twenty sixteen and in twenty nineteen은 상관접속사 both A and B예요. 두 가지를 함께 묶어 강조할 때 쓰고, both 뒤와 and 뒤에는 같은 형태가 와야 하죠. 이걸 병렬 구조라고 합니다. 두 번째, more than sixty percent of the students에서 진짜 주어는 of 뒤에 있는 복수명사 students예요. 그래서 동사도 복수형인 used를 씁니다. 수량 표현만 보고 단수 동사를 쓰면 틀리니까 조심하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">절반이 넘는 학생들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">More \u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">half \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">students\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">2016년에 디지털 콘텐츠를 위해 데스크톱을 사용했다\u003c/span>\u003cspan class=\"en\">used desktops for digital content in 2016,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 30퍼센트 넘는 학생들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">30 \u003c/span>\u003cspan class=\"tgt\">percent\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">2019년에 디지털 콘텐츠를 위해 데스크톱을 사용했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">used \u003c/span>\u003cspan class=\"tgt\">desktops \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">digital \u003c/span>\u003cspan class=\"tgt\">content \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">2019\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">2016년에는 절반이 넘는 학생들이 디지털 콘텐츠를 위해 데스크톱을 사용했고, 2019년에는 30퍼센트 넘는 학생들이 디지털 콘텐츠를 위해 데스크톱을 사용했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 데스크톱 사용률이 2016년에는 절반을 넘었지만 2019년에는 30퍼센트대로 크게 줄었다는 점을 보여 줘요. 한 문장 안에서 두 해를 나란히 놓아 변화의 추세를 \u003cb class=\"key\">대조\u003c/b>해 드러냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수량 표현 + 명사 주어\u003c/span> : more than half + [복수명사] (+ 복수동사) : \"절반이 넘는 학생들이\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 and의 병렬 구조\u003c/span> : [문장 1] + , and + [문장 2] : \"그리고 30퍼센트 넘는 학생들이\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">과거시제와 전치사구의 역할\u003c/span> : [주어] + used(과거동사) + [목적어] + for + [목적] + in + [시점] : \"2019년에 디지털 콘텐츠를 위해 데스크톱을 사용했다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"More than half the students, 절반이 넘는 학생들이. used desktops for digital content in 2016, 2016년에 디지털 콘텐츠를 위해 데스크톱을 사용했다. and more than 30 percent, 그리고 30퍼센트 넘는 학생들이. used desktops for digital content in 2019, 2019년에 디지털 콘텐츠를 위해 데스크톱을 사용했다. 이 문장 전체를 해석하면, 2016년에는 절반이 넘는 학생들이 디지털 콘텐츠를 위해 데스크톱을 사용했고, 2019년에는 30퍼센트 넘는 학생들이 디지털 콘텐츠를 위해 데스크톱을 사용했다.","hl":"m"},{"n":28,"text":"이 문장은 데스크톱 사용률이 확 줄었다는 걸 보여 줘요. 이천십육 년에는 절반이 넘었는데 이천십구 년에는 삼십 퍼센트대로 떨어졌죠. 한 문장 안에서 두 해를 나란히 놓아 변화의 추세를 대조해 줍니다.","hl":"mn"},{"n":29,"text":"첫 번째, More than half the students에서 half the students처럼 수량 표현 뒤에 복수명사가 오면 전체를 복수 주어로 봐요. 그래서 동사도 복수형인 used가 옵니다. 두 번째, and는 앞 문장과 뒤 문장을 대등하게 이어 주는 등위접속사예요. 두 해의 자료를 나란히 비교하려는 병렬 구조를 만들어 주죠. 세 번째, used는 이천십구 년이라는 과거 시점을 나타내는 과거동사이고, for는 목적을, in은 시점을 나타내는 전치사예요. 각각 뒤에서 앞의 내용을 꾸며 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">학생들의 비율은\u003c/span>\u003cspan class=\"en\">The percentage of students\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">2016년에 스마트폰을 사용한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">used \u003c/span>\u003cspan class=\"tgt\">smartphones \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">2016\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">2019년의 비율과 같았다\u003c/span>\u003cspan class=\"en\">was the same as that in 2019.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">2016년에 스마트폰을 사용한 학생의 비율은 2019년에 스마트폰을 사용한 학생들의 비율과 같았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 스마트폰 사용률이 두 해에 걸쳐 변하지 않았다는 점을 알려 주는 문장이에요. 그래프에서 스마트폰 항목의 두 막대 높이가 똑같다는 사실을 \u003cb class=\"key\">비율\u003c/b>의 비교로 서술하고 있죠. 같은 명사 반복을 피하려고 that을 써서 '2019년의 그것'이라고 표현한 점이 핵심이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 who\u003c/span> : [선행사 students] + [who + used + 목적어 ~] (관계대명사절이 앞 명사를 수식) : \"2016년에 스마트폰을 사용한\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"The percentage of students, 학생들의 비율은. who used smartphones in 2016, 2016년에 스마트폰을 사용한. was the same as that in 2019, 2019년의 비율과 같았다. 이 문장 전체를 해석하면, 2016년에 스마트폰을 사용한 학생의 비율은 2019년에 스마트폰을 사용한 학생들의 비율과 같았다.","hl":"m"},{"n":31,"text":"이 문장은 스마트폰을 쓴 학생 비율이 두 해에 똑같았다는 걸 말하고 있어요. 그래프에서 스마트폰 막대 두 개의 높이가 같다는 사실을 문장으로 옮긴 거죠. 같은 말을 두 번 하지 않으려고 that으로 받아 준 센스도 같이 기억해 두세요.","hl":"mn"},{"n":32,"text":"먼저 who used smartphones in 2016을 보면, 앞에 있는 students를 꾸며 주는 주격 관계대명사 who가 나왔어요. 관계사절 안에서 who는 주어 역할을 하니까 바로 뒤에 동사 used가 따라온다는 점을 꼭 챙기세요. 두 번째로 was the same as that in 2019에서 that은 지시대명사로, 앞에 나온 the percentage를 그대로 대신 받은 말이에요. 그래서 '2019년의 그것', 즉 2019년의 비율이라고 해석하면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">학생들의 비율은\u003c/span>\u003cspan class=\"en\">The percentages of students\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전자책 단말기를 사용한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">used \u003c/span>\u003cspan class=\"tgt\">E-readers\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">두 해 모두 가장 낮았다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">lowest\u003c/span> in both years.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">전자책 단말기를 사용한 학생들의 비율은 두 해 모두 가장 낮았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 전자책 단말기가 여러 기기 가운데 활용도가 가장 떨어진다는 점을 알려 주는 문장이에요. 그래프에서 E-readers 막대가 두 해 모두 꼬리 쪽에 가장 짧게 놓인 사실을 서술하고 있죠. 앞 문장의 스마트폰 비율과 대조되면서 기기별 순위를 정리해 주는 역할도 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 who\u003c/span> : [선행사 students] + [who + used + 목적어] (관계대명사절이 앞 명사를 수식) : \"전자책 단말기를 사용한\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">최상급과 주어-동사 수 일치\u003c/span> : [The percentages(복수 주어)] + [were] + [the lowest(최상급 형용사 보어)] : \"가장 낮았다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"The percentages of students, 학생들의 비율은. who used E-readers, 전자책 단말기를 사용한. were the lowest in both years, 두 해 모두 가장 낮았다. 이 문장 전체를 해석하면, 전자책 단말기를 사용한 학생들의 비율은 두 해 모두 가장 낮았다.","hl":"m"},{"n":34,"text":"이 문장은 전자책 단말기를 쓴 학생 비율이 두 해 모두 꼴찌였다는 걸 알려 줘요. 그래프에서 E-readers 막대가 가장 짧다는 사실을 그대로 옮긴 문장이죠. 바로 앞의 스마트폰 이야기와 짝을 이루면서 기기별 순위를 마무리해 준다고 보면 됩니다.","hl":"mn"},{"n":35,"text":"먼저 who used E-readers에서 who는 앞에 있는 students를 꾸며 주는 주격 관계대명사예요. 그래서 students who used E-readers를 통째로 '전자책 단말기를 사용한 학생들'로 묶어 읽어야 합니다. 두 번째로 were the lowest를 보면, 주어 The percentages가 복수라서 동사가 were로 맞춰졌고, 최상급 앞에는 the를 붙여 '가장 낮은'이라는 뜻을 만든다는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>이 그래프는 학생들이 교육용 \u003cb class=\"key\">디지털 \u003c/b>\u003cb class=\"key\">콘텐츠\u003c/b>에 접근하기 위해 사용한 기기를 보여 준다.\u003c/li>\u003cli>조사는 2016년과 2019년 두 해에 진행되었고, 유치원부터 12학년까지의 학생들이 \u003cb class=\"key\">참여\u003c/b>했다.\u003c/li>\u003cli>두 해 모두 \u003cb class=\"key\">노트북\u003c/b>이 가장 인기 있는 기기였고, 태블릿은 60퍼센트 넘는 학생들이 사용했다.\u003c/li>\u003cli>\u003cb class=\"key\">데스크톱\u003c/b>은 2016년 절반 이상에서 2019년 30퍼센트 이상으로 줄었고, \u003cb class=\"key\">전자책 \u003c/b>\u003cb class=\"key\">단말기\u003c/b>의 비율은 두 해 모두 가장 낮았다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Laptops were the most popular device for accessing digital educational content in both 2016 and 2019, while E-readers showed the lowest percentages in both years.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">이 지문은 2016년과 2019년에 학생들이 교육용 디지털 콘텐츠에 접근하기 위해 사용한 \u003cb class=\"key\">기기\u003c/b>를 비교한 그래프를 설명한다. 두 해 모두 \u003cb class=\"key\">노트북\u003c/b>이 가장 인기 있는 기기였고, \u003cb class=\"key\">전자책 \u003c/b>\u003cb class=\"key\">단말기\u003c/b>를 사용한 학생의 비율이 가장 낮았다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":36,"text":"오늘 내용 정리해 볼게요. 이 지문은 이천십육 년과 이천십구 년에 학생들이 교육용 디지털 콘텐츠에 접근할 때 쓴 기기를 비교한 그래프 설명이었어요. 두 해 모두 노트북이 가장 인기 있었고, 태블릿은 육십 퍼센트가 넘었으며, 스마트폰 비율은 같았고, 전자책 단말기가 가장 낮았죠. 그래프 문제는 결국 숫자와 대조 표현을 짝지어 읽는 싸움이에요. 오늘도 수고했어요, 다음 시간에 또 만나요.","hl":null}]}]});</script></body></html>
