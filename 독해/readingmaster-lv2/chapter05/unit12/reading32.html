<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터2 Reading32 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터2 Reading32","audioDir":"reading32_audio","preview":false,"count":42,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.668em\">Reading\u003cbr>32\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터 레벨2\u003c/div>\u003ch1>The Power of Predictability: Ensuring Animal Well-being\u003c/h1>\u003ch2>예측 가능성의 힘: 동물의 안녕 보장하기\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>동물에게 \u003cb class=\"key\">일관성\u003c/b> 있고 \u003cb class=\"key\">예측 \u003c/b>\u003cb class=\"key\">가능\u003c/b>한 환경을 제공하여 \u003cb class=\"key\">통제감\u003c/b>을 느끼게 하는 것이 동물의 복지와 정서적 안정에 필수적이다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Providing a predictable environment and consistent emotional support is crucial for ensuring animals' psychological well-being and a sense of control.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 리딩마스터 레벨 투의 서른두 번째 지문을 함께 공부하겠습니다. 이번 지문은 우리가 동물을 돌볼 때 가장 중요하게 생각해야 할 것이 무엇인지에 대해 다루고 있어요. 핵심은 바로 예측 가능성과 일관성인데요, 이를 통해 동물에게 통제감을 주는 것이 왜 중요한지 요지와 함께 살펴봅시다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">심리학에는 \u003cb class=\"key\">통제 \u003c/b>\u003cb class=\"key\">소재\u003c/b>(Locus of Control)라는 개념이 있는데, 이는 자신의 삶에서 일어나는 사건들을 스스로 \u003cb class=\"key\">통제\u003c/b>할 수 있다고 믿는 정도를 뜻합니다. 동물들도 인간과 마찬가지로 자신의 주변 환경이 어떻게 돌아갈지 \u003cb class=\"key\">예측\u003c/b>할 수 없을 때 큰 \u003cb class=\"key\">스트레스\u003c/b>를 받습니다. 마치 우리가 언제 끝날지 모르는 회의에 참석할 때보다, 정확히 한 시간 뒤에 끝난다는 것을 알 때 안도감을 느끼는 것과 비슷합니다. 이 지문은 동물의 \u003cb class=\"key\">심리적 \u003c/b>\u003cb class=\"key\">복지\u003c/b>를 위해 일상의 루틴과 보호자의 일관성이 왜 중요한지를 잘 설명해주고 있습니다.\u003c/div>","segs":[{"n":2,"text":"본격적인 시작에 앞서 심리학 개념 하나를 소개해 드릴게요. 바로 통제 소재라는 개념입니다. 이는 우리가 자신의 삶에서 일어나는 일들을 스스로 얼마나 조절할 수 있다고 믿는지를 말해요. 동물들도 우리 인간과 똑같습니다. 주변 환경이 어떻게 변할지 전혀 예측할 수 없을 때 동물들은 심한 스트레스를 받거든요. 반대로 일상이 규칙적이고 예측 가능하다면 심리적 복지가 크게 향상됩니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>동물 돌봄의 필수 조건\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>좋은 돌봄을 위해서는 동물의 요구가 항상 \u003cb class=\"key\">일관성\u003c/b> 있고 \u003cb class=\"key\">예측 \u003c/b>\u003cb class=\"key\">가능\u003c/b>하게 충족되어야 함을 강조하며 글을 시작합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>통제감의 필요성\u003csmall>핵심 개념 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>동물도 인간처럼 \u003cb class=\"key\">통제감\u003c/b>이 필요하며, 다음에 일어날 일을 모를 때 \u003cb class=\"key\">심리적 \u003c/b>\u003cb class=\"key\">고통\u003c/b>을 겪을 수 있음을 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>구체적인 실천 방법\u003csmall>예시 · 문장 6–8\u003c/small>\u003c/h4>\u003cp>물, 음식, 배변 장소 등 \u003cb class=\"key\">환경적 \u003c/b>\u003cb class=\"key\">요소\u003c/b>를 항상 일정한 시간과 장소에 제공하여 \u003cb class=\"key\">예측 \u003c/b>\u003cb class=\"key\">가능성\u003c/b>을 높이는 구체적 방법을 제시합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>정서적 지지와 결과\u003csmall>결론 · 문장 9–10\u003c/small>\u003c/h4>\u003cp>보호자의 일관된 \u003cb class=\"key\">정서적 \u003c/b>\u003cb class=\"key\">지지\u003c/b>가 더해질 때 동물은 비로소 \u003cb class=\"key\">자신감\u003c/b>과 평온함을 얻게 됩니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"글의 흐름은 동물 돌봄의 원칙에서 시작해서 구체적인 실천 방법, 그리고 그 결과 순서로 이어집니다.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서는 동물에게 좋은 돌봄을 제공하기 위한 전제 조건을 제시합니다. 그것은 바로 동물의 필요가 항상 일관성 있게, 그리고 예측 가능하게 충족되어야 한다는 것이죠.","hl":"f0"},{"n":5,"text":"세 번째부터 다섯 번째 문장까지는 그 이유를 설명합니다. 동물도 인간처럼 통제감이 필요하기 때문에, 다음 상황을 예측할 수 없으면 심리적 고통을 겪게 된다고 말하며 우리가 통제감을 줄 수 있음을 강조합니다.","hl":"f1"},{"n":6,"text":"여섯 번째부터 여덟 번째 문장에서는 아주 구체적인 예시를 들어줍니다. 마시는 물이 항상 같은 곳에 있는지, 식사 시간이 일정한지, 그리고 불편함을 참지 않고 배변할 수 있는 시간과 장소가 보장되는지 같은 환경적 요소들이죠.","hl":"f2"},{"n":7,"text":"마지막 아홉 번째와 열 번째 문장에서는 정서적 측면을 언급합니다. 보호자의 사랑이 변덕스럽지 않고 일관될 때, 동물들은 비로소 자신감과 평온함을 느끼게 된다는 결론으로 마무리됩니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 2번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 동물의 복지를 위해 필요한 핵심 조건으로 \u003cb class=\"key\">예측 \u003c/b>\u003cb class=\"key\">가능성\u003c/b>을 제시하는 구조를 띱니다. 첫 부분에서 동물의 욕구가 일관되게 충족되어야 한다는 \u003cb class=\"key\">주제\u003c/b>를 명시하고, 이후 \u003cb class=\"key\">통제감\u003c/b>이라는 심리적 근거와 구체적인 생활 예시들을 통해 주장을 뒷받침합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>To do that (2)\u003c/b>\u003cspan>앞 문장의 목표를 달성하기 위한 방법 제시\u003c/span>\u003cb>Like humans (3)\u003c/b>\u003cspan>친숙한 대상과의 비교를 통한 이해 증진\u003c/span>\u003cb>So (4)\u003c/b>\u003cspan>앞선 원리에 따른 결과 설명\u003c/span>\u003cb>rather than (9)\u003c/b>\u003cspan>지양해야 할 태도와 지향해야 할 태도의 대조\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">consistently and predictably\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">sense of control\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">predictable\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">consistent emotional support\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">know what to expect\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>불안정한 환경\u003c/th>\u003cth>예측 가능한 환경\u003c/th>\u003c/tr>\u003ctr>\u003ctd>음식 제공 시점 모름\u003c/td>\u003ctd>정해진 시간에 음식 제공\u003c/td>\u003c/tr>\u003ctr>\u003ctd>변덕스러운 애정 표현\u003c/td>\u003ctd>일관된 정서적 지지\u003c/td>\u003c/tr>\u003ctr>\u003ctd>고통과 불안감 유발\u003c/td>\u003ctd>자신감과 평온함 유발\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 처음에 핵심 주장을 던지고 이를 뒷받침하는 근거와 예시를 나열하는 전형적인 주장 근거 구조를 가지고 있습니다. 글의 앞부분인 두 번째 문장에서 이미 주제를 명확히 밝히고 있는 두괄식 구성의 글이라고 할 수 있죠.","hl":"ty"},{"n":9,"text":"문장 사이의 연결을 보면 더 명확해집니다. 두 번째 문장의 To do that은 좋은 돌봄이라는 목표를 달성하기 위한 방법을 연결해주고, 아홉 번째 문장의 rather than은 변덕스러운 태도와 대조되는 일관된 정서적 지지의 중요성을 강조합니다. 또한 예측 가능하다는 표현이 글 전반에 걸쳐 다양한 단어로 반복되며 핵심 주제를 강화하고 있습니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>provide\u003c/b>\u003cem>동사\u003c/em>\u003cspan>제공하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>care\u003c/b>\u003cem>명사\u003c/em>\u003cspan>돌봄, 보살핌\u003c/span>\u003c/div>\u003cdiv>\u003cb>meet\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(요구 등을) 충족시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>consistently\u003c/b>\u003cem>부사\u003c/em>\u003cspan>일관되게\u003c/span>\u003c/div>\u003cdiv>\u003cb>predictably\u003c/b>\u003cem>부사\u003c/em>\u003cspan>예측 가능하게\u003c/span>\u003c/div>\u003cdiv>\u003cb>sense\u003c/b>\u003cem>명사\u003c/em>\u003cspan>감각, 느낌\u003c/span>\u003c/div>\u003cdiv>\u003cb>control\u003c/b>\u003cem>명사\u003c/em>\u003cspan>통제, 제어\u003c/span>\u003c/div>\u003cdiv>\u003cb>appear\u003c/b>\u003cem>동사\u003c/em>\u003cspan>나타나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>experience\u003c/b>\u003cem>동사\u003c/em>\u003cspan>경험하다, 겪다\u003c/span>\u003c/div>\u003cdiv>\u003cb>distress\u003c/b>\u003cem>명사\u003c/em>\u003cspan>고통, 괴로움\u003c/span>\u003c/div>\u003cdiv>\u003cb>ensure\u003c/b>\u003cem>동사\u003c/em>\u003cspan>확실히 하다, 보장하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>environment\u003c/b>\u003cem>명사\u003c/em>\u003cspan>환경\u003c/span>\u003c/div>\u003cdiv>\u003cb>available\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>이용 가능한, 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>morning\u003c/b>\u003cem>명사\u003c/em>\u003cspan>아침\u003c/span>\u003c/div>\u003cdiv>\u003cb>walk\u003c/b>\u003cem>명사\u003c/em>\u003cspan>산책\u003c/span>\u003c/div>\u003cdiv>\u003cb>eliminate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>배변하다, 제거하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>discomfort\u003c/b>\u003cem>명사\u003c/em>\u003cspan>불편함\u003c/span>\u003c/div>\u003cdiv>\u003cb>companion\u003c/b>\u003cem>명사\u003c/em>\u003cspan>반려인, 동료\u003c/span>\u003c/div>\u003cdiv>\u003cb>display\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보여주다, 전시하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>emotional\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>정서적인, 감정적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>support\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지지, 지원\u003c/span>\u003c/div>\u003cdiv>\u003cb>withhold\u003c/b>\u003cem>동사\u003c/em>\u003cspan>주지 않다, 보류하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>expect\u003c/b>\u003cem>동사\u003c/em>\u003cspan>기대하다, 예상하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>confident\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>자신감 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>calm\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>차분한, 평온한\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"여기서 중요한 단어들을 몇 개 짚어볼까요? meet은 만나다가 아니라 충족시키다라는 뜻으로 쓰였고, distress는 단순한 슬픔을 넘어선 괴로움이나 고통을 뜻합니다. 반려인을 뜻하는 companion이라는 단어도 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">consistent\u003c/b>\u003cspan class=\"m\">일관된\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">constant\u003c/span>\u003cspan class=\"s\">steady\u003c/span>\u003cspan class=\"s\">uniform\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">inconsistent\u003c/span>\u003cspan class=\"a\">variable\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">predictable\u003c/b>\u003cspan class=\"m\">예측 가능한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">foreseeable\u003c/span>\u003cspan class=\"s\">expected\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unpredictable\u003c/span>\u003cspan class=\"a\">random\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">distress\u003c/b>\u003cspan class=\"m\">고통\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">suffering\u003c/span>\u003cspan class=\"s\">anguish\u003c/span>\u003cspan class=\"s\">misery\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">comfort\u003c/span>\u003cspan class=\"a\">pleasure\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">ensure\u003c/b>\u003cspan class=\"m\">확실히 하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">guarantee\u003c/span>\u003cspan class=\"s\">assure\u003c/span>\u003cspan class=\"s\">confirm\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">undermine\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">withhold\u003c/b>\u003cspan class=\"m\">주지 않다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">reserve\u003c/span>\u003cspan class=\"s\">retain\u003c/span>\u003cspan class=\"s\">deny\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">grant\u003c/span>\u003cspan class=\"a\">provide\u003c/span>\u003cspan class=\"a\">give\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 정리해 봅시다. 일관된이라는 뜻의 consistent는 constant나 steady와 바꿔 쓸 수 있지만, 변덕스러운 느낌의 inconsistent와는 반대되는 개념입니다. 또한 주지 않다, 보류하다라는 뜻의 withhold는 provide나 grant와 반대되는 행동임을 기억하세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 ~하기를 원한다\u003c/span>\u003cspan class=\"en\">We want \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">좋은 돌봄을 제공하기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">provide\u003c/span> good care\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">동물에게\u003c/span>\u003cspan class=\"en\">for animals.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 동물에게 좋은 돌봄을 제공하고자 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 글의 도입부로, 동물을 잘 돌보고자 하는 우리의 \u003cb class=\"key\">목표\u003c/b>를 제시합니다. 동물 복지의 가장 기본이 되는 \u003cb class=\"key\">돌봄\u003c/b>의 개념을 언급하며 시작합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : want [타동사] + [to provide (to부정사구/목적어)] : \"제공하는 것을\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"We want to, 우리는 ~하기를 원한다. provide good care, 좋은 돌봄을 제공하기를. for animals, 동물에게. 이 문장 전체를 해석하면, 우리는 동물에게 좋은 돌봄을 제공하고자 한다.","hl":"m"},{"n":13,"text":"첫 번째 문장은 이 글의 주제인 동물을 잘 돌보는 법에 대한 이야기를 시작하는 도입부예요. 우리가 동물에게 좋은 돌봄을 제공하려는 목표를 가지고 있다는 점을 보여줍니다.","hl":"mn"},{"n":14,"text":"여기서 어법 포인트는 want라는 동사 뒤에 나오는 to provide예요. want는 뒤에 올 동작을 나타낼 때 목적어 자리에 반드시 to부정사만을 써야 하는 동사라는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그렇게 하기 위해서는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">To \u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">that\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">동물의 요구가\u003c/span>\u003cspan class=\"en\">an animal's needs\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">충족되어야 한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">should \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">met\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일관적이고 예측 가능하게\u003c/span>\u003cspan class=\"en\">consistently and predictably\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">항상\u003c/span>\u003cspan class=\"en\">all the time.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그렇게 하기 위해서는, 동물의 요구가 항상 일관적이고 예측 가능하게 충족되도록 해야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 좋은 돌봄을 위한 구체적인 \u003cb class=\"key\">조건\u003c/b>을 제시합니다. 동물의 욕구가 \u003cb class=\"key\">일관성\u003c/b> 있고 \u003cb class=\"key\">예측 \u003c/b>\u003cb class=\"key\">가능\u003c/b>하게 채워지는 것이 핵심입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : [To do that (to부정사구)] + [주절] : \"그렇게 하기 위해서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사가 포함된 수동태\u003c/span> : should [조동사] + be [동사원형] + met [과거분사] : \"충족되어야 한다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"To do that, 그렇게 하기 위해서는. an animal's needs, 동물의 요구가. should be met, 충족되어야 한다. consistently and predictably, 일관적이고 예측 가능하게. all the time, 항상. 이 문장 전체를 해석하면, 그렇게 하기 위해서는, 동물의 요구가 항상 일관적이고 예측 가능하게 충족되도록 해야 한다.","hl":"m"},{"n":16,"text":"두 번째 문장은 앞 문장의 목표를 이루기 위한 구체적인 방법을 설명해요. 동물이 원하는 것이 늘 일정하고 예측할 수 있는 방식으로 해결되어야 한다는 점이 이 글의 핵심 주장입니다.","hl":"mn"},{"n":17,"text":"두 가지 포인트를 볼게요. 첫 번째로 To do that은 목적을 나타내는 부사적 용법으로 쓰였고요. 두 번째로 should be met은 수동태 표현이에요. 동물의 요구는 충족되는 대상이기 때문에 be 동사와 과거분사인 met을 함께 쓴 것이죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인간과 마찬가지로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Like\u003c/span> humans,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">동물들은 필요하다\u003c/span>\u003cspan class=\"en\">animals need\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">통제감이\u003c/span>\u003cspan class=\"en\">a sense of control.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">인간과 마찬가지로, 동물들은 통제감이 필요하다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 동물의 심리적 욕구인 \u003cb class=\"key\">통제감\u003c/b>을 언급하며 인간과의 \u003cb class=\"key\">공통점\u003c/b>을 강조합니다. 예측 가능한 환경이 왜 중요한지를 설명하는 근거가 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사\u003c/span> : Like [전치사] + humans [명사] : \"인간과 마찬가지로\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Like humans, 인간과 마찬가지로. animals need, 동물들은 필요하다. a sense of control, 통제감이. 이 문장 전체를 해석하면, 인간과 마찬가지로, 동물들은 통제감이 필요하다.","hl":"m"},{"n":19,"text":"세 번째 문장에서는 인간과 동물의 공통점을 언급합니다. 우리 사람들도 자기 삶을 스스로 조절하고 싶어 하듯이, 동물들에게도 통제감이라는 것이 반드시 필요하다는 논리를 펴고 있어요.","hl":"mn"},{"n":20,"text":"여기서 Like는 좋아하다라는 동사가 아니라, 인간과 마찬가지로라는 뜻을 가진 전치사로 쓰였어요. 명사인 humans 앞에 와서 비교의 대상을 나타내고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">따라서, \u003c/span>\u003cspan class=\"en\">So,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">동물은 \u003c/span>\u003cspan class=\"en\">an \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">animal \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">알지 못하는 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">doesn't \u003c/span>\u003cspan class=\"tgt\">know\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">음식이 언제 나타날지를 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">food \u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">appear\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고통을 받을지도 모른다.\u003c/span>\u003cspan class=\"en\">may experience distress.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">따라서 음식이 언제 나타날지를 알지 못하는 동물은 고통을 받을지도 모른다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 음식 공급의 시점이 불확실할 때 동물이 느끼는 \u003cb class=\"key\">심리적 \u003c/b>\u003cb class=\"key\">불안감\u003c/b>을 설명합니다. \u003cb class=\"key\">예측 \u003c/b>\u003cb class=\"key\">가능성\u003c/b>이 결여된 환경이 동물에게 큰 스트레스가 될 수 있음을 시사합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : 선행사(animal) + that [주격 관계대명사] + 동사(doesn't know) : \"알지 못하는 동물\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">간접의문문\u003c/span> : 의문사(when) + 주어(food) + 동사(will appear) : \"음식이 언제 나타날지를\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"So, 따라서. an animal, 동물은. that doesn't know, 알지 못하는. when food will appear, 음식이 언제 나타날지를. may experience distress, 고통을 받을지도 모른다.. 이 문장 전체를 해석하면, 따라서 음식이 언제 나타날지를 알지 못하는 동물은 고통을 받을지도 모른다.","hl":"m"},{"n":22,"text":"음식이 언제 나올지 모르는 불확실한 상황은 동물에게 큰 불안을 줘요. 이 문장은 예측 가능성이 부족할 때 동물이 겪는 심리적 압박을 설명하고 있습니다.","hl":"mn"},{"n":23,"text":"첫 번째로 that은 주어인 animal을 꾸며주는 주격 관계대명사예요. 수 일치에 주의해야 하죠. 두 번째로 when이 이끄는 절은 의문사 주어 동사의 어순을 가진 간접의문문으로, know의 목적어 자리에 쓰였습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 \u003c/span>\u003cspan class=\"en\">We\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">줄 수 있다. \u003c/span>\u003cspan class=\"en\">can provide\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">통제감을 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">sense \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">control\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 통제감을 줄 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 인간이 동물의 환경을 조절함으로써 동물이 느끼는 불안을 해소할 수 있다는 \u003cb class=\"key\">해결책\u003c/b>의 시작입니다. \u003cb class=\"key\">통제감\u003c/b>은 이 글의 핵심 키워드 중 하나입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">타동사의 목적어\u003c/span> : provide [타동사] + a sense of control [목적어] : \"통제감\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"We, 우리는. can provide, 줄 수 있다.. a sense of control, 통제감을. 이 문장 전체를 해석하면, 우리는 통제감을 줄 수 있다.","hl":"m"},{"n":25,"text":"앞서 언급된 동물의 고통을 해결하기 위한 방법이 나와요. 인간이 동물에게 환경을 조절할 수 있다는 통제감을 부여할 수 있다는 뜻입니다.","hl":"mn"},{"n":26,"text":"이 문장은 주어, 동사, 목적어로 이루어진 아주 깔끔한 삼형식 문장이에요. provide라는 타동사의 목적어로 통제감이라는 의미의 명사구인 a sense of control이 쓰였습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 그저 확실히 해 주기만 하면 되는데, \u003c/span>\u003cspan class=\"en\">We just need to \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">ensure \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 동물의 환경을 예측 가능하도록 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> our animal's environment is predictable\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">: \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">것은 마실 수 있는 물이 항상 있고, \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> there is always \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">water \u003c/span>\u003cspan class=\"tgt\">available\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 물이 항상 같은 곳에 있는 것이다.\u003c/span>\u003cspan class=\"en\">and always in the same place.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 그저 우리 동물의 환경을 예측 가능하도록 확실히 해 주기만 하면 되는데, 그것은 마실 수 있는 물이 항상 있고, 그 물이 항상 같은 곳에 있는 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 통제감을 주는 구체적인 방법으로 \u003cb class=\"key\">예측 \u003c/b>\u003cb class=\"key\">가능한 \u003c/b>\u003cb class=\"key\">환경\u003c/b>을 만드는 법을 설명합니다. 물의 존재와 위치를 \u003cb class=\"key\">일관성 \u003c/b>\u003cb class=\"key\">있게\u003c/b> 유지하는 것이 그 예시입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that\u003c/span> : ensure [타동사] + that [접속사] + S + V : \"~를 확실히 하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">콜론을 통한 부연 설명\u003c/span> : 앞 문장 [:] + that절 [부연/동격] : \"즉, ~하는 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">형용사의 후치 수식\u003c/span> : 명사(water) + 형용사(available) : \"이용 가능한 물\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"We just need to ensure, 우리는 그저 확실히 해 주기만 하면 되는데. that our animal's environment is predictable, 우리 동물의 환경을 예측 가능하도록. that there is always water available, 것은 마실 수 있는 물이 항상 있고. and always in the same place, 그 물이 항상 같은 곳에 있는 것이다.. 이 문장 전체를 해석하면, 우리는 그저 우리 동물의 환경을 예측 가능하도록 확실히 해 주기만 하면 되는데, 그것은 마실 수 있는 물이 항상 있고, 그 물이 항상 같은 곳에 있는 것이다.","hl":"m"},{"n":28,"text":"동물에게 어떻게 통제감을 주는지 보여주는 문장이에요. 물을 항상 같은 곳에 두는 것 같은 아주 작은 일관성이 예측 가능한 환경을 만든다는 거죠.","hl":"mn"},{"n":29,"text":"첫 번째로 ensure 뒤의 that은 목적어 절을 이끄는 명사절 접속사예요. 두 번째로 available은 뒤에서 water를 꾸며주는 형용사의 후치 수식 구조고요. 마지막으로 콜론 뒤의 that절은 앞의 내용이 구체적으로 무엇인지 다시 한번 설명해 주는 부연 설명의 역할을 하고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">늘 음식이 있다\u003c/span>\u003cspan class=\"en\">There is always food\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 아침에 일어날 때와\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">get \u003c/span>\u003cspan class=\"tgt\">up \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">morning \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저녁 산책을 한 후에는.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">after \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">evening \u003c/span>\u003cspan class=\"tgt\">walk\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리가 아침에 일어날 때와 저녁 산책을 한 후에는 늘 음식이 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 동물이 언제 음식이 나올지 예측할 수 있도록 \u003cb class=\"key\">정해진 \u003c/b>\u003cb class=\"key\">일과\u003c/b>에 맞춰 음식을 제공해야 한다는 구체적인 예시입니다. 이를 통해 동물은 자신의 환경이 \u003cb class=\"key\">예측 \u003c/b>\u003cb class=\"key\">가능\u003c/b>하다고 느끼게 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간의 부사절\u003c/span> : when [접속사] + 주어 + 동사 : \"우리가 일어날 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부사구의 병렬 구조\u003c/span> : [부사절] + and + [전치사구] : \"아침에 일어날 때와 저녁 산책 후에\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"There is always food, 늘 음식이 있다. when we get up in the morning, 우리가 아침에 일어날 때와. and after our evening walk, 저녁 산책을 한 후에는.. 이 문장 전체를 해석하면, 우리가 아침에 일어날 때와 저녁 산책을 한 후에는 늘 음식이 있다.","hl":"m"},{"n":31,"text":"이 문장은 동물의 환경을 예측 가능하게 만드는 구체적인 방법을 설명하고 있어요. 정해진 시간에 밥을 주는 것이 동물의 정서에 얼마나 중요한지 보여주는 사례입니다.","hl":"mn"},{"n":32,"text":"첫 번째 포인트는 when이 이끄는 시간의 부사절이에요. 우리가 일어나는 때를 명확히 지정해 주죠. 두 번째는 and를 사이에 두고 부사절과 전치사구가 나란히 연결된 병렬 구조에 주목하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">늘 있을 것이다\u003c/span>\u003cspan class=\"en\">There will always be\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">배변할 수 있는 시간과 장소가\u003c/span>\u003cspan class=\"en\">a time and place \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">eliminate\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">참을 필요 없이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">without \u003c/span>\u003cspan class=\"tgt\">having \u003c/span>\u003cspan class=\"tgt\">to\u003c/span> hold things in\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">불편할 정도로.\u003c/span>\u003cspan class=\"en\">to the point of discomfort.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">불편할 정도로 참을 필요 없이 배변할 수 있는 시간과 장소가 늘 있을 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 생리적인 현상을 스스로 조절하지 못할 때 느끼는 \u003cb class=\"key\">불안감\u003c/b>을 제거해 주어야 한다는 의미입니다. 배변 시간을 일정하게 유지하는 것이 동물의 \u003cb class=\"key\">통제권\u003c/b>을 보장하는 방법입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : 명사(time and place) + to eliminate [to부정사] : \"배변할\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 뒤의 동명사\u003c/span> : without [전치사] + having [동명사] + to-v : \"~할 필요 없이\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"There will always be, 늘 있을 것이다. a time and place to eliminate, 배변할 수 있는 시간과 장소가. without having to hold things in, 참을 필요 없이. to the point of discomfort, 불편할 정도로.. 이 문장 전체를 해석하면, 불편할 정도로 참을 필요 없이 배변할 수 있는 시간과 장소가 늘 있을 것이다.","hl":"m"},{"n":34,"text":"동물이 생리적인 욕구를 억지로 참지 않아도 되게끔 일관된 환경을 만들어 주라는 뜻이에요. 이것이 바로 동물에게 주는 통제권의 핵심입니다.","hl":"mn"},{"n":35,"text":"첫 번째로 to eliminate는 앞에 있는 시간과 장소를 꾸며주는 형용사적 용법으로 쓰였어요. 두 번째로 without 뒤에 나오는 having은 전치사의 목적어 역할을 하는 동명사 표현입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">반려인은 보여줄 수 있다\u003c/span>\u003cspan class=\"en\">Human companions can display\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일관된 정서적 지지를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">consistent \u003c/span>\u003cspan class=\"tgt\">emotional \u003c/span>\u003cspan class=\"tgt\">support\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한순간에 애정을 주다가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">rather \u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">providing \u003c/span>\u003cspan class=\"tgt\">love \u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">moment \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그다음에는 애정을 주지 않기보다는.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">withholding \u003c/span>\u003cspan class=\"tgt\">love \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">next\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">반려인(사람 친구)은 한순간에 애정을 주다가 그다음에는 애정을 주지 않기보다는 일관된 정서적 지지를 보여줄 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 물질적인 환경뿐 아니라 주인의 \u003cb class=\"key\">태도\u003c/b>도 일관되어야 함을 강조합니다. 기분에 따라 애정을 줬다 뺏었다 하는 행동은 동물의 \u003cb class=\"key\">심리적 \u003c/b>\u003cb class=\"key\">안정\u003c/b>을 해칩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">형용사의 명사 수식\u003c/span> : consistent [형용사] + emotional [형용사] + support [명사] : \"일관된 정서적 지지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">rather than을 이용한 병렬 구조\u003c/span> : rather than + A(providing...) + and + B(withholding...) : \"A하기보다는 B하다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Human companions can display, 반려인은 보여줄 수 있다. consistent emotional support, 일관된 정서적 지지를. rather than providing love one moment, 한순간에 애정을 주다가. and withholding love the next, 그다음에는 애정을 주지 않기보다는.. 이 문장 전체를 해석하면, 반려인(사람 친구)은 한순간에 애정을 주다가 그다음에는 애정을 주지 않기보다는 일관된 정서적 지지를 보여줄 수 있다.","hl":"m"},{"n":37,"text":"사람의 기분에 따라 동물을 대하는 방식이 바뀌면 안 된다는 점을 꼬집고 있어요. 감정적인 부분에서도 예측 가능성을 주는 것이 중요하다는 뜻이죠.","hl":"mn"},{"n":38,"text":"첫 번째로 consistent emotional support라는 표현에서 형용사들이 명사를 어떻게 수식하는지 확인하세요. 두 번째로 rather than 뒤에 providing과 withholding이라는 두 동명사가 병렬 구조를 이루고 있는 것이 핵심입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">동물들이 알 때\u003c/span>\u003cspan class=\"en\">When animals know\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무엇을 기대할 것인지를,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">expect\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 느낄 것이다\u003c/span>\u003cspan class=\"en\">they will \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">feel \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 자신감 있고 평온함을.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">confident \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">calm\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">무엇을 기대할 것인지를 알 때, 동물들은 더 자신감과 평온함을 느낄 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 지문의 내용을 요약하는 \u003cb class=\"key\">결론\u003c/b>으로, 환경의 \u003cb class=\"key\">예측 \u003c/b>\u003cb class=\"key\">가능성\u003c/b>이 동물의 심리적 안정에 주는 긍정적 효과를 설명합니다. 상황을 통제하고 있다고 느낄 때 동물의 \u003cb class=\"key\">스트레스\u003c/b>가 해소됨을 나타냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문사 + to부정사\u003c/span> : what [의문사] + to expect [to부정사] : \"무엇을 기대할 것인지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">2형식 감각동사\u003c/span> : feel [감각동사] + confident and calm [형용사 보어] : \"더 자신감 있고 평온함을 느끼다\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"When animals know, 동물들이 알 때. what to expect, 무엇을 기대할 것인지를. they will feel, 그들은 느낄 것이다. more confident and calm, 더 자신감 있고 평온함을.. 이 문장 전체를 해석하면, 무엇을 기대할 것인지를 알 때, 동물들은 더 자신감과 평온함을 느낄 것이다.","hl":"m"},{"n":40,"text":"이 문장은 이번 지문의 핵심을 정리하는 결론이에요. 동물이 다음에 어떤 일이 일어날지 미리 알게 되는 예측 가능성이 그들의 심리적 안정에 얼마나 큰 도움이 되는지 강조하고 있습니다.","hl":"mn"},{"n":41,"text":"첫 번째 포인트로 what to expect 부분은 의문사 뒤에 to부정사가 붙어서 명사구 역할을 하고 있어요. 타동사 know의 목적어 자리에서 무엇을 기대할지로 해석하면 자연스럽습니다. 두 번째 포인트로 feel은 감각동사라서 뒤에 형용사가 와야 해요. 그래서 confident와 calm이라는 형용사가 나란히 보어 자리에 온 것이죠. 이 자리에 부사를 쓰지 않도록 주의해야 합니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>동물의 요구사항을 \u003cb class=\"key\">일관적\u003c/b>이고 \u003cb class=\"key\">예측 \u003c/b>\u003cb class=\"key\">가능\u003c/b>하게 충족시키는 것이 좋은 돌봄의 시작이다.\u003c/li>\u003cli>동물도 인간처럼 주변 환경을 스스로 다스릴 수 있다는 \u003cb class=\"key\">통제감\u003c/b>을 가질 때 정서적으로 안정된다.\u003c/li>\u003cli>물, 음식, 배변 장소 등 \u003cb class=\"key\">환경적 \u003c/b>\u003cb class=\"key\">요소\u003c/b>를 항상 일정한 규칙에 따라 제공하여 예측 가능성을 높여야 한다.\u003c/li>\u003cli>반려인의 \u003cb class=\"key\">정서적 \u003c/b>\u003cb class=\"key\">지지\u003c/b> 또한 변덕스럽지 않고 일관되어야 동물이 자신감과 평온함을 느낄 수 있다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Providing a predictable environment and consistent emotional support is crucial for ensuring animals' psychological well-being and a sense of control.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">동물에게 \u003cb class=\"key\">일관성\u003c/b> 있고 \u003cb class=\"key\">예측 \u003c/b>\u003cb class=\"key\">가능\u003c/b>한 환경을 제공하여 \u003cb class=\"key\">통제감\u003c/b>을 느끼게 하는 것이 동물의 복지와 정서적 안정에 필수적이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":42,"text":"오늘 우리는 동물의 행복을 결정짓는 예측 가능성에 대해 배워보았습니다. 일상의 루틴과 일관된 태도가 동물의 자신감을 만든다는 점, 잊지 마세요. 오늘 배운 구문들과 핵심 어휘들을 복습하며 이번 지문을 완벽히 여러분의 것으로 만드시길 바랍니다. 수고하셨습니다!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
