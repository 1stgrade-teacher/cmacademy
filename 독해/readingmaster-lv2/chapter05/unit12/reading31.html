<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터2 Reading31 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터2 Reading31","audioDir":"reading31_audio","preview":false,"count":49,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.668em\">Reading\u003cbr>31\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터 레벨2\u003c/div>\u003ch1>Beyond Entertainment: The Diverse Benefits of Reading Fiction\u003c/h1>\u003ch2>오락 그 이상: 소설 읽기의 다양한 이점들\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>소설 읽기는 \u003cb class=\"key\">창의성\u003c/b> 향상뿐만 아니라 타인에 대한 \u003cb class=\"key\">이해심\u003c/b>과 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">기술\u003c/b>을 길러주며, 등장인물의 실수를 통해 삶의 \u003cb class=\"key\">지혜\u003c/b>를 얻게 해주는 매우 유익한 활동이다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Reading fiction provides multifaceted advantages including enhanced creativity, empathy, and social wisdom beyond mere entertainment.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 우리가 흔히 취미로 즐기는 소설 읽기가 우리 삶에 어떤 긍정적인 영향을 미치는지에 대해 함께 공부해 보겠습니다. 소설은 단순히 재미있는 이야기를 넘어 우리의 창의성과 사회성을 길러주는 아주 특별한 도구인데요. 오늘 지문을 통해 소설 읽기의 구체적인 장점들을 하나씩 정리해 볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">소설을 읽을 때 우리의 뇌는 단순한 텍스트 처리를 넘어, 주인공이 느끼는 감정과 행동을 실제처럼 시뮬레이션합니다. 이를 가능하게 하는 것이 뇌 속의 \u003cb class=\"key\">거울 \u003c/b>\u003cb class=\"key\">뉴런(Mirror \u003c/b>\u003cb class=\"key\">Neurons)\u003c/b>인데, 타인의 고통을 볼 때 내가 아픈 것처럼 느끼게 유도합니다. 이러한 과정은 심리학에서 말하는 \u003cb class=\"key\">마음 \u003c/b>\u003cb class=\"key\">이론(Theory \u003c/b>\u003cb class=\"key\">of \u003c/b>\u003cb class=\"key\">Mind)\u003c/b>, 즉 타인의 의도와 감정을 파악하는 능력을 비약적으로 발달시킵니다. 마치 현실 세계의 복잡한 인간관계를 미리 연습해보는 \u003cb class=\"key\">모의 \u003c/b>\u003cb class=\"key\">훈련\u003c/b>과 같은 역할을 하는 셈이죠. 결국 소설 읽기는 단순한 지식 습득을 넘어 타인과 원만히 소통하는 능력을 기르는 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">인지\u003c/b> 훈련이 됩니다.\u003c/div>","segs":[{"n":2,"text":"본격적인 시작에 앞서 배경지식을 좀 살펴볼게요. 소설을 읽을 때 우리의 뇌는 마치 실제 상황을 겪는 것처럼 활성화된다고 해요. 뇌 속에 있는 거울 뉴런이라는 세포가 주인공의 감정에 공감하게 만들기 때문이죠. 이것은 심리학에서 말하는 마음 이론과도 연결되는데, 타인의 생각과 의도를 파악하는 능력을 키워줍니다. 마치 비행기 조종사가 시뮬레이션 장치로 연습하듯이, 우리도 소설이라는 모의 훈련을 통해 실제 인간관계를 미리 경험해보는 것이랍니다. 이러한 사회적 인지 과정이 우리를 더 성숙하게 만들어 주죠.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>소설의 정의와 대중성\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>소설은 역사적으로 가장 \u003cb class=\"key\">사랑받는 \u003c/b>\u003cb class=\"key\">취미\u003c/b> 중 하나로 자리 잡았습니다. 미스터리부터 판타지까지 소설에 포함되는 \u003cb class=\"key\">다양한 \u003c/b>\u003cb class=\"key\">장르\u003c/b>들을 나열하며 독자의 친숙함을 유도합니다. 본격적인 주장을 펼치기 전 소설의 범주를 명확히 하는 \u003cb class=\"key\">도입부\u003c/b>입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>창의성 향상의 도구\u003csmall>근거1 · 문장 3–6\u003c/small>\u003c/h4>\u003cp>소설 읽기가 \u003cb class=\"key\">창의성 \u003c/b>\u003cb class=\"key\">향상\u003c/b>에 큰 도움이 된다는 핵심적인 사실을 밝힙니다. 독서 과정에서 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">아이디어\u003c/b>를 얻고 세상에 대한 넓은 시야를 갖게 됩니다. 이는 소설이 주는 첫 번째 주요 \u003cb class=\"key\">유익함\u003c/b>을 강조하는 단계입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>공감과 관점의 변화\u003csmall>근거2 · 문장 7–8\u003c/small>\u003c/h4>\u003cp>소설은 타인을 더 잘 \u003cb class=\"key\">이해\u003c/b>하게 만드는 힘이 있습니다. 특히 다른 생각을 가진 사람들에 대한 인식을 바꾸는 데 \u003cb class=\"key\">논픽션\u003c/b>보다 효과적이라는 연구 결과를 제시합니다. \u003cb class=\"key\">객관적 \u003c/b>\u003cb class=\"key\">근거\u003c/b>를 통해 주장의 설득력을 높이고 있습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>사회적 기술과 지혜\u003csmall>근거3 · 문장 9–11\u003c/small>\u003c/h4>\u003cp>소설은 사람들과 더 잘 지내는 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">기술\u003c/b>을 가르쳐 줍니다. 상황에 대한 타인의 \u003cb class=\"key\">반응\u003c/b>을 학습하고 캐릭터의 실수에서 지혜를 얻습니다. 현실에서의 시행착오를 줄여주는 \u003cb class=\"key\">간접 \u003c/b>\u003cb class=\"key\">경험\u003c/b>의 장을 제공합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>스마트폰 대신 소설 읽기\u003csmall>결론 · 문장 12\u003c/small>\u003c/h4>\u003cp>앞서 언급한 모든 \u003cb class=\"key\">이점\u003c/b>들을 요약하며 글을 마무리합니다. 스마트폰을 잠시 내려놓고 소설을 읽으라는 \u003cb class=\"key\">행동 \u003c/b>\u003cb class=\"key\">촉구\u003c/b>를 담고 있습니다. 독자에게 실질적인 \u003cb class=\"key\">변화\u003c/b>를 권유하는 결말입니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 소설 읽기의 유익함을 네 가지 측면에서 차근차근 설명하고 있어요.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장은 도입부예요. 소설 읽기가 역사적으로 얼마나 사랑받아 온 취미인지를 언급하며, 미스터리나 판타지 같은 다양한 장르들을 소설의 범주로 소개하고 있죠.","hl":"f0"},{"n":5,"text":"세 번째부터 여섯 번째 문장에서는 첫 번째 장점인 창의성에 대해 말합니다. 소설이 매우 도움이 된다는 핵심 내용을 던진 후, 새로운 아이디어와 다양한 사고방식을 배울 수 있다는 점을 강조하고 있어요.","hl":"f1"},{"n":6,"text":"일곱 번째와 여덟 번째 문장은 타인에 대한 이해를 다룹니다. 특히 연구 결과에 따르면, 생각의 차이가 있는 사람들에 대한 견해를 바꾸는 데 소설이 논픽션보다 더 효과적이라는 점이 인상적이죠.","hl":"f2"},{"n":7,"text":"아홉 번째부터 열한 번째 문장은 사회적 기술과 지혜를 설명해요. 등장인물들의 실수와 반응을 보며 우리가 실제 삶에서 적용할 수 있는 간접 경험의 가치를 전달하고 있습니다.","hl":"f3"},{"n":8,"text":"마지막 열두 번째 문장은 결론이에요. 앞서 말한 모든 이점들을 바탕으로, 이제 스마트폰을 내려놓고 소설을 한 번 읽어보자고 권유하며 글을 마무리하고 있습니다.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">양괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 3번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글의 초반부인 세 번째 문장에서 소설 읽기가 흥미롭고 도움이 된다는 \u003cb class=\"key\">주제문\u003c/b>을 제시합니다. 이후 창의성, 공감, 지혜라는 세 가지 측면에서 \u003cb class=\"key\">상세 \u003c/b>\u003cb class=\"key\">근거\u003c/b>를 나열합니다. 마지막 문장에서 이러한 장점들을 근거로 독자에게 소설 읽기를 다시 한번 \u003cb class=\"key\">권고\u003c/b>하며 끝을 맺습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>In addition (9)\u003c/b>\u003cspan>정보의 추가 및 열거\u003c/span>\u003cb>With all these benefits in mind (12)\u003c/b>\u003cspan>앞선 내용 요약 및 결론 유도\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Reading fiction\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">fiction\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Reading fiction\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">it\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">reading fiction\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">fiction\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">fiction\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">reading fiction\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">It\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Seeing the mistakes characters make in stories\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">reading some fiction\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Nonfiction (논픽션)\u003c/th>\u003cth>Fiction (소설)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>사실 정보 전달 중심\u003c/td>\u003ctd>창의성 및 사고방식 확장\u003c/td>\u003c/tr>\u003ctr>\u003ctd>관점 변화에 덜 효과적\u003c/td>\u003ctd>타인의 견해를 이해하는 데 더 효과적\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글의 구조는 소설 읽기의 장점을 나열하는 주장과 근거 방식이에요. 특히 세 번째 문장에서 핵심 주제를 던지고 마지막 문장에서 다시 한번 독려하는 양괄식 구성을 취하고 있습니다. 글의 전반부와 후반부가 서로 호응하며 주제를 명확하게 드러내고 있죠.","hl":"ty"},{"n":10,"text":"문장 간의 연결을 돕는 신호어들을 잘 보세요. 아홉 번째 문장의 In addition처럼 정보를 추가할 때 쓰는 표현들이 핵심적인 역할을 합니다. 또한 Reading fiction이라는 표현이 계속해서 반복되거나 It이라는 대명사로 바뀌어 나타나며 글의 응집성을 높여주고 있어요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>fiction\u003c/b>\u003cem>명사\u003c/em>\u003cspan>소설\u003c/span>\u003c/div>\u003cdiv>\u003cb>loved\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>사랑받는\u003c/span>\u003c/div>\u003cdiv>\u003cb>hobby\u003c/b>\u003cem>명사\u003c/em>\u003cspan>취미\u003c/span>\u003c/div>\u003cdiv>\u003cb>of all time\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>역대, 역사상\u003c/span>\u003c/div>\u003cdiv>\u003cb>mystery\u003c/b>\u003cem>명사\u003c/em>\u003cspan>미스터리, 추리물\u003c/span>\u003c/div>\u003cdiv>\u003cb>science fiction\u003c/b>\u003cem>명사\u003c/em>\u003cspan>공상 과학 소설\u003c/span>\u003c/div>\u003cdiv>\u003cb>romance\u003c/b>\u003cem>명사\u003c/em>\u003cspan>로맨스\u003c/span>\u003c/div>\u003cdiv>\u003cb>fantasy\u003c/b>\u003cem>명사\u003c/em>\u003cspan>판타지\u003c/span>\u003c/div>\u003cdiv>\u003cb>exciting\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>흥미진진한\u003c/span>\u003c/div>\u003cdiv>\u003cb>at the same time\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>동시에\u003c/span>\u003c/div>\u003cdiv>\u003cb>helpful\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>도움이 되는\u003c/span>\u003c/div>\u003cdiv>\u003cb>well-known\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>잘 알려진\u003c/span>\u003c/div>\u003cdiv>\u003cb>fact\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사실\u003c/span>\u003c/div>\u003cdiv>\u003cb>improve\u003c/b>\u003cem>동사\u003c/em>\u003cspan>향상시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>creativity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>창의성\u003c/span>\u003c/div>\u003cdiv>\u003cb>various\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>다양한\u003c/span>\u003c/div>\u003cdiv>\u003cb>way of thinking\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>사고방식\u003c/span>\u003c/div>\u003cdiv>\u003cb>indicate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>나타내다, 보여주다\u003c/span>\u003c/div>\u003cdiv>\u003cb>effective\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>효과적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>nonfiction\u003c/b>\u003cem>명사\u003c/em>\u003cspan>논픽션\u003c/span>\u003c/div>\u003cdiv>\u003cb>view\u003c/b>\u003cem>명사\u003c/em>\u003cspan>견해, 관점\u003c/span>\u003c/div>\u003cdiv>\u003cb>in addition\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>게다가\u003c/span>\u003c/div>\u003cdiv>\u003cb>react\u003c/b>\u003cem>동사\u00 span class=\"m\">지혜\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">insight\u003c/span>\u003cspan class=\"s\">sagacity\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">folly\u003c/span>\u003cspan class=\"a\">foolishness\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">view\u003c/b>\u003cspan class=\"m\">견해, 관점\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">perspective\u003c/span>\u003cspan class=\"s\">outlook\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"어휘력을 더 키워볼까요? 향상시키다라는 뜻의 improve는 enhance나 boost로 바꿔 쓸 수 있고, 반대말로는 worsen이 있습니다. 다양한이라는 의미의 various는 diverse로, 효과적인이라는 effective는 efficient로 동의어 정리가 가능하겠네요. 지혜를 뜻하는 wisdom은 insight라는 멋진 유의어와 함께 알아두면 좋습니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">소설을 읽는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Reading \u003c/span>\u003cspan class=\"tgt\">fiction\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이다\u003c/span>\u003cspan class=\"en\">is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가장 사랑받는 취미 중 하나\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">most \u003c/span>\u003cspan class=\"tgt\">loved \u003c/span>\u003cspan class=\"tgt\">hobbies\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">역사상\u003c/span>\u003cspan class=\"en\">of all time.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">소설을 읽는 것은 역사상 가장 사랑받는 취미 중 하나이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글 전체의 주제인 \u003cb class  thinking, 다양한 사고방식을. about the world, 세상에 대한.. 이 문장 전체를 해석하면, 그리고 여러분은 세상에 대한 다양한 사고방식을 배울 수 있다.","hl":"m"},{"n":29,"text":"소설 속에는 다양한 인물과 삶이 들어있죠. 그래서 소설을 읽으면 내가 보지 못한 세상을 보는 눈이 넓어진다는 뜻이에요.","hl":"mn"},{"n":30,"text":"여기서 ways of thinking이라는 표현이 핵심이에요. 전치사 of 뒤에 동명사 thinking이 와서 어떤 방식인지 구체적으로 꾸며주고 있죠. 우리말로는 사고방식이라고 자연스럽게 해석하면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또한 여러분은 할 수 있다\u003c/span>\u003cspan class=\"en\">Also, you can\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 사람들을 더 잘 이해\u003c/span>\u003cspan class=\"en\">understand others better\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분이 소설을 읽을 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">read\u003c/span> fiction.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">또한, 소설을 읽을 때 여러분은 다른 사람들을 더 잘 이해할 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 소설이 \u003cb class=\"key\">공감 \u003c/b>\u003cb class=\"key\">능력\u003c/b>과 타인에 대한 \u003cb class=\"key\">이해심\u003c/b>을 높여준다는 점을 강조하는 문장입니다. 소설 속 인물의 감정을 공유하며 타인을 바라보는 \u003cb class=\"key\">관점\u003c/b>을 넓히는 효과를 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간의 부사절\u003c/span> : when [접속사] + S [주어] + V [동사] : \"여러분이 읽을 때\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"Also, you can, 또한 여러분은 할 수 있다. understand others better, 다른 사람들을 더 잘 이해. when you read fiction, 여러분이 소설을 읽을 때. 이 문장 전체를 해석하면, 또한, 소설을 읽을 때 여러분은 다른 사람들을 더 잘 이해할 수 있다.","hl":"m"},{"n":32,"text":"소설을 읽으면 타인의 감정을 더 깊게 들여다보게 되죠. 결과적으로 공감 능력이 커져서 다른 사람을 이해하는 마음이 깊어진다는 점을 강조하는 문장이에요.","hl":"mn"},{"n":33,"text":"접속사 when이 이끄는 부분은 시간의 부사절이라고 불러요. 여러분이 소설을 읽는다는 시간적 조건을 제시해서 주절의 내용을 꾸며주고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">연구는 ~라는 것을 보여 준다\u003c/span>\u003cspan class=\"en\">Research indicates \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">소설이 더 효과적이라는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">fiction \u003c/span>\u003cspan class=\"tgt\">is\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">effective \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">논픽션보다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">than\u003c/span> nonfiction\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 견해를 바꾸는 데\u003c/span>\u003cspan class=\"en\">in changing our views\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들에 대한\u003c/span>\u003cspan class=\"en\">about people\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 생각을 가지고 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">have\u003c/span> different ideas.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">연구는 다른 생각을 가지고 있는 사람들에 대한 우리의 견해를 바꾸는 데 소설이 논픽션보다 더 효과적이라는 것을 보여 준다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 연구 결과를 인용해 소설이 타인에 대한 \u003cb class=\"key\">편견\u003c/b>을 깨고 \u003cb class=\"key\">포용력\u003c/b>을 넓히는 데 강력한 도구임을 증명합니다. 단순한 지식 전달인 논픽션보다 \u003cb class=\"key\">감정적 \u003c/b>\u003cb class=\"key\">변화\u003c/b>를 이끌어내는 힘이 큽니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that\u003c/span> : indicates [타동사] + that [접속사] + S + V (목적어) : \"소설이 ~라는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">비교급\u003c/span> : more [형용사] + than [비교 대상] : \"보다 더 효과적인\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : people [선행사] + who [관계대명사] + V [동사] : \"가지고 있는 사람들\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"Research indicates that, 연구는 ~라는 것을 보여 준다. fiction is more effective, 소설이 더 효과적이라는 것을. than nonfiction, 논픽션보다. in changing our views, 우리의 견해를 바꾸는 데. about people, 사람들에 대한. who have different ideas, 다른 생각을 가지고 있는. 이 문장 전체를 해석하면, 연구는 다른 생각을 가지고 있는 사람들에 대한 우리의 견해를 바꾸는 데 소설이 논픽션보다 더 효과적이라는 것을 보여 준다.","hl":"m"},{"n":35,"text":"연구 결과를 바탕으로 소설의 구체적인 장점을 논리적으로 설명하고 있어요. 특히 나와 다른 생각을 가진 사람을 대하는 우리의 편견을 없애는 데 소설이 논픽션보다 훨씬 큰 힘을 발휘한다는 뜻이죠.","hl":"mn"},{"n":36,"text":"첫 번째로 indicates의 목적어 자리에 온 that은 명사절 접속사예요. 문장 전체의 목적어 역할을 하며 뒤에는 완전한 문장이 나오죠. 두 번째로 more effective than은 비교급 표현으로 소설이 논픽션보다 우위에 있음을 보여줍니다. 세 번째로 who have는 주격 관계대명사 절로 바로 앞의 선행사인 people을 뒤에서 꾸며주고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">게다가\u003c/span>\u003cspan class=\"en\">In addition,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">소설을 읽는 것은 도움을 줄 수 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">reading\u003c/span> fiction can \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">help \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분이 더 잘 지내게 되는 데\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">become\u003c/span> better\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들과\u003c/span>\u003cspan class=\"en\">with people.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">게다가, 소설을 읽는 것은 여러분이 사람들과 더 잘 지내게 되는 데 도움을 줄 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 소설 읽기가 실제 인간관계에서의 \u003cb class=\"key\">사회성\u003c/b>과 \u003cb class=\"key\">대인 \u003c/b>\u003cb class=\"key\">관계 \u003c/b>\u003cb class=\"key\">능력\u003c/b> 향상으로 이어진다는 결론적 이점을 제시합니다. 타인에 대한 이해가 실제 \u003cb class=\"key\">상호작용\u003c/b>의 개선으로 연결됨을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사 주어\u003c/span> : Reading [동명사/주어] + can help [동사] : \"읽는 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">준사역동사 help\u003c/span> : help [동사] + O [목적어] + O.C [원형부정사/목적격보어] : \"여러분이 되도록 돕다\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"In addition, 게다가. reading fiction can help, 소설을 읽는 것은 도움을 줄 수 있다. you become better, 여러분이 더 잘 지내게 되는 데. with people, 사람들과. 이 문장 전체를 해석하면, 게다가, 소설을 읽는 것은 여러분이 사람들과 더 잘 지내게 되는 데 도움을 줄 수 있다.","hl":"m"},{"n":38,"text":"앞의 내용에 이어 추가적인 장점을 덧붙이고 있네요. 소설을 통해 기른 공감 능력이 실제 현실에서 사람들과 원만한 관계를 맺는 사회성으로 이어진다는 점을 말해주고 있어요.","hl":"mn"},{"n":39,"text":"첫 번째로 reading은 문장의 주어 자리에 온 동명사예요. 읽는 것이라는 명사처럼 해석하죠. 두 번째로 help는 준사역동사라고 불러요. 목적어인 you 뒤에 목적격 보어로 become이라는 동사원형이 왔는데, 이 자리에 to become을 써도 문법적으로 맞아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 여러분에게 가르쳐준다\u003c/span>\u003cspan class=\"en\">It teaches you\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들이 어떻게 반응할 수 있는지에 대해\u003c/span>\u003cspan class=\"en\">about \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">may \u003c/span>\u003cspan class=\"tgt\">react\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상황과 도전에\u003c/span>\u003cspan class=\"en\">to situations and challenges.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 사람들이 상황과 도전에 어떻게 반응할 수 있는지에 대해 여러분에게 가르쳐준다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 소설 속 인물들의 행동을 통해 타인의 \u003cb class=\"key\">반응\u003c/b>과 \u003cb class=\"key\">대처 \u003c/b>\u003cb class=\"key\">방식\u003c/b>을 배울 수 있다는 내용입니다. 실생활에서 겪을 수 있는 인간관계에 대한 \u003cb class=\"key\">이해력\u003c/b>을 높여주는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">간접의문문\u003c/span> : 의문사(how) + 주어(people) + 동사(may react) : \"사람들이 어떻게 반응할 수 있는지\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"It teaches you, 그것은 여러분에게 가르쳐준다. about how people may react, 사람들이 어떻게 반응할 수 있는지에 대해. to situations and challenges, 상황과 도전에. 이 문장 전체를 해석하면, 그것은 사람들이 상황과 도전에 어떻게 반응할 수 있는지에 대해 여러분에게 가르쳐준다.","hl":"m"},{"n":41,"text":"소설을 읽으면 사람들이 특정 상황에서 어떻게 반응하는지 알 수 있어요. 타인의 심리와 대처 방식을 미리 배우며 인간관계에 대한 이해력을 넓혀주는 역할을 하는 문장입니다.","hl":"mn"},{"n":42,"text":"첫 번째 포인트로 전치사 about 뒤에 명사절이 왔는데요. how people may react 처럼 의문사, 주어, 동사 순서인 간접의문문 어순을 꼭 기억해야 해요. 이 전체 덩어리가 전치사의 목적어 역할을 하고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">실수를 보는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Seeing \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">mistakes\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이야기 속 등장인물들이 저지르는\u003c/span>\u003cspan class=\"en\">characters make in stories\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분이 지혜를 얻는 것을 도울 수 있다\u003c/span>\u003cspan class=\"en\">can help you gain wisdom\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분의 자신의 삶에서 사용할\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">use\u003c/span> in your own lives.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">등장인물들이 이야기에서 저지르는 실수를 보는 것은 여러분이 자신의 삶에서 사용할 수 있는 지혜를 얻는 것을 도울 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 소설 속 인물들의 시행착오를 보며 독자가 간접 경험을 하고, 이를 실제 삶의 \u003cb class=\"key\">지혜\u003c/b>로 삼을 수 있다는 뜻입니다. 소설이 실제적인 \u003cb class=\"key\">문제 \u003c/b>\u003cb class=\"key\">해결 \u003c/b>\u003cb class=\"key\">능력\u003c/b>에 도움을 준다는 점을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사 주어\u003c/span> : V-ing (Seeing) + 목적어 (the mistakes) : \"실수를 보는 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : wisdom (명사) + to use (to부정사) : \"사용할 지혜\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"Seeing the mistakes, 실수를 보는 것은. characters make in stories, 이야기 속 등장인물들이 저지르는. can help you gain wisdom, 여러분이 지혜를 얻는 것을 도울 수 있다. to use in your own lives, 여러분의 자신의 삶에서 사용할. 이 문장 전체를 해석하면, 등장인물들이 이야기에서 저지르는 실수를 보는 것은 여러분이 자신의 삶에서 사용할 수 있는 지혜를 얻는 것을 도울 수 있다.","hl":"m"},{"n":44,"text":"다른 사람의 실수를 보면 배우는 게 있죠. 소설 속 인물들의 실수를 보면서 우리 삶에 필요한 진짜 지혜를 얻고 문제 해결 능력을 키울 수 있다는 아주 중요한 문장입니다.","hl":"mn"},{"n":45,"text":"첫 번째로 문장 맨 앞의 Seeing the mistakes는 주어 역할을 하는 동명사구예요. 두 번째로 can help you gain에서 help는 목적격 보어로 동사원형 gain을 썼고요. 마지막에 to use는 앞의 wisdom을 꾸며주는 형용사적 용법으로 쓰였습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 모든 이점들을 염두에 두고,\u003c/span>\u003cspan class=\"en\">With all these benefits in mind,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분의 스마트폰을 제쳐두는 건 어떨까\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">about \u003c/span>\u003cspan class=\"tgt\">setting\u003c/span> aside your smartphone\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 오늘 소설을 좀 읽는 것은?\u003c/span>\u003cspan class=\"en\">and reading some fiction today?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 모든 이점들을 염두에 두고, 오늘은 여러분의 스마트폰을 제쳐두고 소설을 좀 읽는 것은 어떨까?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 지금까지 나열한 소설의 장점들을 근거로 스마트폰 대신 소설 읽기를 권하는 \u003cb class=\"key\">결론\u003c/b>입니다. 독자에게 구체적인 행동의 \u003cb class=\"key\">실천\u003c/b>을 촉구하며 글을 마무리합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">제안의 관용표현\u003c/span> : How about + 동명사(~ing)? : \"~하는 게 어때?\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">동명사의 병렬 구조\u003c/span> : 동명사(A) + and + 동명사(B) : \"제쳐두고 그리고 읽는 것\"\u003c/div>\u003c/div>","segs":[{"n":46,"text":"With all these benefits in mind, 이 모든 이점들을 염두에 두고. how about setting aside your smartphone, 여러분의 스마트폰을 제쳐두는 건 어떨까. and reading some fiction today?, 그리고 오늘 소설을 좀 읽는 것은?. 이 문장 전체를 해석하면, 이 모든 이점들을 염두에 두고, 오늘은 여러분의 스마트폰을 제쳐두고 소설을 좀 읽는 것은 어떨까?","hl":"m"},{"n":47,"text":"마지막 결론이에요. 소설 읽기의 장점이 이렇게나 많으니 스마트폰은 잠시 내려놓고 소설을 읽어보자고 실천을 제안하며 글을 맺고 있습니다.","hl":"mn"},{"n":48,"text":"첫 번째로 how about 뒤에는 동사원형이 아니라 ~ing 형태인 동명사 setting이 와서 권유를 나타내요. 두 번째로 and 뒤의 reading도 앞에 나온 setting과 짝을 맞춘 병렬 구조예요. 그래서 스마트폰을 제쳐두는 것과 소설을 읽는 것 두 가지를 제안하고 있는 거죠.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>소설 읽기는 즐거움뿐만 아니라 \u003cb class=\"key\">창의성\u003c/b>을 향상시키는 매우 유익한 활동이다.\u003c/li>\u003cli>소설 속 다양한 세상과 사고방식을 접하며 창의적인 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">아이디어\u003c/b>를 얻을 수 있다.\u003c/li>\u003cli>소설은 타인의 관점을 이해하게 함으로써 \u003cb class=\"key\">편견\u003c/b>을 깨고 공감 능력을 키워준다.\u003c/li>\u003cli>등장인물의 실수를 통해 얻는 \u003cb class=\"key\">간접 \u003c/b>\u003cb class=\"key\">경험\u003c/b>은 실제 삶에서 큰 지혜가 된다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Reading fiction provides multifaceted advantages including enhanced creativity, empathy, and social wisdom beyond mere entertainment.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">소설 읽기는 \u003cb class=\"key\">창의성\u003c/b> 향상뿐만 아니라 타인에 대한 \u003cb class=\"key\">이해심\u003c/b>과 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">기술\u003c/b>을 길러주며, 등장인물의 실수를 통해 삶의 \u003cb class=\"key\">지혜\u003c/b>를 얻게 해주는 매우 유익한 활동이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":49,"text":"오늘 우리는 소설 읽기가 단순한 재미를 넘어 창의성, 공감, 사회적 지혜까지 주는 최고의 활동임을 배웠습니다. 여러분도 오늘부터는 영어 지문 속의 독해뿐만 아니라, 진정한 의미의 독서를 시작해 보는 게 어떨까요? 수고 많으셨습니다. 다음 시간에 더 유익한 내용으로 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
