<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터2 Reading36 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터2 Reading36","audioDir":"reading36_audio","preview":false,"count":41,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.668em\">Reading\u003cbr>36\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터 레벨2\u003c/div>\u003ch1>Selective Perception: Seeing What We Want to See\u003c/h1>\u003ch2>선택적 지각: 우리가 보고 싶은 것만 보는 방식\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>우리는 자신의 \u003cb class=\"key\">관점\u003c/b>을 뒷받침하기 위해 사건을 \u003cb class=\"key\">선택적으로 \u003c/b>\u003cb class=\"key\">해석\u003c/b>하며, 이는 우리의 목표, 기대, 과거 경험과 같은 \u003cb class=\"key\">주관적 \u003c/b>\u003cb class=\"key\">요인\u003c/b>에 의해 결정된다는 내용이다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>We perceive and interpret reality selectively based on our subjective viewpoints, interests, and expectations.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 우리가 세상을 얼마나 주관적으로 바라보고 있는지에 대한 흥미로운 지문을 함께 공부해 볼 거예요. 이 글은 우리가 보고 싶은 것만 골라 보는 선택적 해석과 그 심리학적 배경을 다루고 있어요. 요지는 간단해요. 우리는 우리의 관점이나 목표에 맞춰서 정보를 골라 듣고 골라 본다는 것이죠.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">이 글은 심리학의 \u003cb class=\"key\">선택적 \u003c/b>\u003cb class=\"key\">지각\u003c/b>(Selective Perception)이라는 개념을 다루고 있습니다. 이는 사람들이 외부의 정보를 모두 공평하게 받아들이는 것이 아니라, 자신의 \u003cb class=\"key\">기존 \u003c/b>\u003cb class=\"key\">신념\u003c/b>이나 관심사에 부합하는 것만 골라서 인식하는 인지적 편향을 의미합니다. 예를 들어, 내가 특정 브랜드의 운동화를 사고 싶어지면 길거리에 그 신발만 유독 많이 보이는 것과 같습니다. 이를 \u003cb class=\"key\">망치의 \u003c/b>\u003cb class=\"key\">원칙\u003c/b>(Law of the Instrument)이라는 비유를 통해 설명하며, 우리가 가진 도구나 목적이 세상을 바라보는 \u003cb class=\"key\">프레임\u003c/b>이 된다는 점을 강조합니다.\u003c/div>","segs":[{"n":2,"text":"혹시 내가 어떤 물건을 사고 싶어지면 길거리에 온통 그 물건만 보이는 경험을 해본 적 있나요? 이걸 심리학에서는 선택적 지각이라고 불러요. 지문에서도 언급되지만, 이걸 설명하는 아주 유명한 격언이 바로 망치의 원칙이에요. 내 손에 망치가 들려 있으면 세상 모든 문제가 해결해야 할 못으로 보인다는 비유죠. 즉, 우리가 가진 프레임이 우리의 인식을 결정한다는 배경지식을 가지고 읽으면 훨씬 이해가 잘 될 거예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>사건의 선택적 해석\u003csmall>도입 · 문장 1–4\u003c/small>\u003c/h4>\u003cp>우리는 사건을 \u003cb class=\"key\">선택적으로 \u003c/b>\u003cb class=\"key\">해석\u003c/b>하는 경향이 있으며, 자신이 원하는 방식에 맞춰 증거를 \u003cb class=\"key\">선택하고 \u003c/b>\u003cb class=\"key\">배열\u003c/b>합니다. 결과적으로 우리의 \u003cb class=\"key\">관점\u003c/b>을 뒷받침하는 방향으로 모든 것이 이루어집니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>지각의 주관적 근거\u003csmall>설명 · 문장 5–7\u003c/small>\u003c/h4>\u003cp>선택적 지각은 우리에게 \u003cb class=\"key\">두드러져 \u003c/b>\u003cb class=\"key\">보이는 \u003c/b>\u003cb class=\"key\">것\u003c/b>에 기반하는데, 이는 사실 우리의 목표, 기대, 혹은 \u003cb class=\"key\">과거의 \u003c/b>\u003cb class=\"key\">경험\u003c/b>과 밀접하게 관련되어 있습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>망치와 못의 비유\u003csmall>비유 및 결론 · 문장 8–10\u003c/small>\u003c/h4>\u003cp>\u003cb class=\"key\">망치\u003c/b>를 들고 있으면 모든 것이 \u003cb class=\"key\">못\u003c/b>으로 보인다는 비유처럼, 우리의 의도에 따라 주변 세상이 다르게 인식될 수 있음을 강조합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 처음에 현상을 제시하고, 그 원인을 분석한 뒤, 강렬한 비유로 마무리하는 삼단계 구성을 취하고 있어요.","hl":null},{"n":4,"text":"첫 번째부터 네 번째 문장까지는 우리가 사건을 선택적으로 해석한다는 점을 말하고 있어요. 우리는 일이 특정한 방식이기를 바라기 때문에, 그 바람에 맞춰서 증거를 선택하고 배열해서 결국 내 관점을 지지하게 만들죠. 여기서 핵심은 우리가 정보를 객관적으로 모으는 게 아니라 내 입맛에 맞게 편집한다는 거예요.","hl":"f0"},{"n":5,"text":"다섯 번째부터 일곱 번째 문장은 왜 이런 현상이 일어나는지 그 근거를 설명해요. 선택적 지각은 우리 눈에 띄는 것에 기반하는데, 사실 그게 눈에 띄는 이유는 우리 마음속에 목표나 관심사, 혹은 과거의 경험 같은 주관적인 요인들이 이미 자리 잡고 있기 때문이라는 거죠. 상황이 우리에게 요구하는 것도 큰 영향을 미치고요.","hl":"f1"},{"n":6,"text":"마지막 여덟 번째부터 열 번째 문장은 망치와 못의 비유를 들어서 이 현상을 한 번 더 강조합니다. 망치를 쓰고 싶다는 욕구가 생기면, 우리 주변 세상이 마치 못으로 가득 찬 것처럼 보이기 시작한다는 결론을 내리며 글을 마무리하고 있네요.","hl":"f2"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-비유\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 번째 문장에서 \u003cb class=\"key\">선택적 \u003c/b>\u003cb class=\"key\">해석\u003c/b>이라는 핵심 주제를 던지는 \u003cb class=\"key\">두괄식\u003c/b> 구조입니다. 이후 그러한 현상이 일어나는 \u003cb class=\"key\">심리학적 \u003c/b>\u003cb class=\"key\">이유\u003c/b>를 상세히 설명하고, 마지막에 \u003cb class=\"key\">망치\u003c/b>라는 일상적인 사물을 활용한 비유로 주제를 명확히 굳힙니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Then (3)\u003c/b>\u003cspan>인과 관계 연결\u003c/span>\u003cb>However (6)\u003c/b>\u003cspan>내용의 심화 및 반전\u003c/span>\u003cb>In other words (7)\u003c/b>\u003cspan>부연 설명 및 요약\u003c/span>\u003cb>It's like (8)\u003c/b>\u003cspan>비유 도입\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">interpret events selectively\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">select, stack, or arrange evidence\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">supports our viewpoint\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Selective perception\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">look as though it is full of nails\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":7,"text":"이 글은 첫 문장에서 핵심 주제를 바로 던지는 전형적인 두괄식 구조를 가지고 있어요. 먼저 주장이나 현상을 말하고 나서, 그 뒤에 구체적인 이유를 덧붙이는 방식이죠. 마지막에는 비유를 사용해서 독자의 이해를 돕고 메시지를 강하게 전달하고 있습니다.","hl":"ty"},{"n":8,"text":"문장 연결 고리들을 살펴볼까요? 세 번째 문장의 Then은 증거를 선택하는 과정을 순서대로 보여줍니다. 여섯 번째 문장의 However는 우리가 단순히 보는 게 아니라 어떤 것과 관련되어 있다는 심화된 내용으로 전환을 시켜주죠. 일곱 번째 문장의 In other words는 그 관련성이 무엇인지 친절하게 풀어서 설명해 주는 신호예요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>interpret\u003c/b>\u003cem>동사\u003c/em>\u003cspan>해석하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>selectively\u003c/b>\u003cem>부사\u003c/em>\u003cspan>선택적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>event\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사건\u003c/span>\u003c/div>\u003cdiv>\u003cb>evidence\u003c/b>\u003cem>명사\u003c/em>\u003cspan>증거\u003c/span>\u003c/div>\u003cdiv>\u003cb>arrange\u003c/b>\u003cem>동사\u003c/em>\u003cspan>배열하다, 정리하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>stack\u003c/b>\u003cem>동사\u003c/em>\u003cspan>쌓다\u003c/span>\u003c/div>\u003cdiv>\u003cb>certainly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>확실히\u003c/span>\u003c/div>\u003cdiv>\u003cb>viewpoint\u003c/b>\u003cem>명사\u003c/em>\u003cspan>관점\u003c/span>\u003c/div>\u003cdiv>\u003cb>perception\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지각, 인식\u003c/span>\u003c/div>\u003cdiv>\u003cb>stand out\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>두드러지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>be related to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~와 관련되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>expectation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기대\u003c/span>\u003c/div>\u003cdiv>\u003cb>demand\u003c/b>\u003cem>명사\u003c/em>\u003cspan>요구\u003c/span>\u003c/div>\u003cdiv>\u003cb>situation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>상황\u003c/span>\u003c/div>\u003cdiv>\u003cb>quote\u003c/b>\u003cem>명사\u003c/em>\u003cspan>인용문\u003c/span>\u003c/div>\u003cdiv>\u003cb>highlight\u003c/b>\u003cem>동사\u003c/em>\u003cspan>강조하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>phenomenon\u003c/b>\u003cem>명사\u003c/em>\u003cspan>현상\u003c/span>\u003c/div>\u003cdiv>\u003cb>look as though\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>마치 ~처럼 보이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>current\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>현재의\u003c/span>\u003c/div>\u003cdiv>\u003cb>select\u003c/b>\u003cem>동사\u003c/em>\u003cspan>선택하다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"여기서 중요한 단어인 interpret은 해석하다라는 뜻인데, 단순히 번역하는 게 아니라 의미를 부여한다는 뉘앙스가 강해요. viewpoint는 관점이라는 뜻이고, highlight는 형광펜으로 칠하듯이 어떤 내용을 강조한다는 뜻으로 쓰였습니다. phenomenon은 현상이라는 뜻의 명사인데, 복수형은 phenomena라는 점도 기억해 두면 좋겠네요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">interpret\u003c/b>\u003cspan class=\"m\">해석하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">understand\u003c/span>\u003cspan class=\"s\">explain\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">misunderstand\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">selectively\u003c/b>\u003cspan class=\"m\">선택적으로\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">discriminately\u003c/span>\u003cspan class=\"s\">partially\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">randomly\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">viewpoint\u003c/b>\u003cspan class=\"m\">관점\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">perspective\u003c/span>\u003cspan class=\"s\">standpoint\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">highlight\u003c/b>\u003cspan class=\"m\">강조하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">emphasize\u003c/span>\u003cspan class=\"s\">underline\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003cspan class=\"a\">overlook\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">phenomenon\u003c/b>\u003cspan class=\"m\">현상\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">occurrence\u003c/span>\u003cspan class=\"s\">happening\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"동의어 공부도 해봅시다. interpret은 explain이나 understand로 바꿔 쓸 수 있지만, 반대로 오해하다라는 뜻의 misunderstand와는 반대되죠. selectively는 선택적으로라는 뜻인데, 무작위로라는 뜻의 randomly와는 반대 개념으로 자주 출제됩니다. viewpoint는 perspective라는 단어와 짝꿍처럼 쓰이니 꼭 함께 외워두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는\u003c/span>\u003cspan class=\"en\">We\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">경향이 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">likely \u003c/span>\u003cspan class=\"tgt\">to\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사건을 해석하는\u003c/span>\u003cspan class=\"en\">interpret events\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">선택적으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">selectively\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 선택적으로 사건을 해석하는 경향이 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 인간은 모든 정보를 객관적으로 받아들이지 않고 자신의 \u003cb class=\"key\">편향\u003c/b>에 따라 정보를 걸러서 받아들인다는 \u003cb class=\"key\">선택적 \u003c/b>\u003cb class=\"key\">지각\u003c/b>의 개념을 도입하는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be likely to-v (형용사구)\u003c/span> : be likely [형용사] + to interpret [to부정사] : \"~하는 경향이 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부사의 동사 수식\u003c/span> : interpret [동사] + selectively [부사] : \"선택적으로\"\u003c/div>\u003c/div>","segs":[{"n":11,"text":"We, 우리는. are likely to, 경향이 있다. interpret events, 사건을 해석하는. selectively, 선택적으로. 이 문장 전체를 해석하면, 우리는 선택적으로 사건을 해석하는 경향이 있다.","hl":"m"},{"n":12,"text":"우리는 세상을 있는 그대로 보기보다는 각자의 입맛에 맞게 골라서 본다는 뜻이에요. 글 전체의 주제인 선택적 지각에 대해 화두를 던지는 첫 번째 문장입니다.","hl":"mn"},{"n":13,"text":"첫 번째 포인트로 be likely to 표현을 보세요. interpret라는 동사원형과 함께 쓰여서 뭐뭐 하는 경향이 있다는 의미를 만듭니다. 두 번째로 selectively라는 부사는 해석하다라는 의미의 동사를 뒤에서 수식하고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 원한다\u003c/span>\u003cspan class=\"en\">We \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">want \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일이 ~이기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">things \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘이런 방식’\u003c/span>\u003cspan class=\"en\">&quot;this way&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또는 ‘저런 방식’\u003c/span>\u003cspan class=\"en\">or &quot;that way&quot;.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 일이 ‘이런 방식’ 또는 ‘저런 방식’이기를 원한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 우리가 정보를 선택적으로 받아들이는 근본적인 원인이 개인의 \u003cb class=\"key\">욕구\u003c/b>나 \u003cb class=\"key\">선입견\u003c/b>에 있음을 설명하며, 특정한 결론을 미리 바라고 있음을 시사합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">5형식 문형 (want + 목적어 + to부정사)\u003c/span> : want [타동사] + things [목적어] + to be [목적격 보어] : \"일이 ~이기를 원하다\"\u003c/div>\u003c/div>","segs":[{"n":14,"text":"We want, 우리는 원한다. things to be, 일이 ~이기를. \"this way\", ‘이런 방식’. or \"that way\", 또는 ‘저런 방식’. 이 문장 전체를 해석하면, 우리는 일이 ‘이런 방식’ 또는 ‘저런 방식’이기를 원한다.","hl":"m"},{"n":15,"text":"사람은 누구나 자기가 바라는 방향이 미리 정해져 있다는 거예요. 내 생각과 일치하는 방향으로 상황이 흘러가길 기대한다는 의미죠.","hl":"mn"},{"n":16,"text":"이 문장은 전형적인 오형식 구조를 가지고 있어요. want라는 동사 뒤에 목적어 things가 나오고, 그 뒤에 투부정사인 to be가 목적격 보어로 쓰여서 목적어가 어떤 상태가 되기를 원하는지 설명해 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러면\u003c/span>\u003cspan class=\"en\">Then\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 선택하거나\u003c/span>\u003cspan class=\"en\">we can \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">select, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">쌓거나\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">stack, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">배열할 수 있다 증거를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">arrange\u003c/span> evidence.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러면 우리는 증거를 선택하거나 쌓거나 배열할 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 바라는 결론에 도달하기 위해 유리한 \u003cb class=\"key\">데이터\u003c/b>만을 수집하고 재조합하는 구체적인 \u003cb class=\"key\">왜곡\u003c/b> 과정을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사의 병렬 구조\u003c/span> : can [조동사] + select [V1], stack [V2], or arrange [V3] : \"선택하거나, 쌓거나, 또는 배열하다\"\u003c/div>\u003c/div>","segs":[{"n":17,"text":"Then, 그러면. we can select, 우리는 선택하거나. stack, 쌓거나. or arrange evidence, 배열할 수 있다 증거를. 이 문장 전체를 해석하면, 그러면 우리는 증거를 선택하거나 쌓거나 배열할 수 있다.","hl":"m"},{"n":18,"text":"내가 바라는 방식이 정해지면, 그때부터는 내 입맛에 맞는 증거들만 골라서 나열하기 시작한다는 거예요. 객관성을 잃어가는 과정을 보여주죠.","hl":"mn"},{"n":19,"text":"조동사 can 뒤에 세 개의 동사가 나란히 연결되어 있어요. select와 stack 그리고 arrange가 쉼표와 접속사 or로 묶여서 병렬 구조를 이루고 있다는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고\u003c/span>\u003cspan class=\"en\">And\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 이루어진다\u003c/span>\u003cspan class=\"en\">it \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">done\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가장 확실히\u003c/span>\u003cspan class=\"en\">most certainly\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">방식으로\u003c/span>\u003cspan class=\"en\">in a way\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 관점을 뒷받침하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">supports\u003c/span> our viewpoint.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그리고 그것은 가장 확실히 우리의 관점을 뒷받침하는 방식으로 이루어진다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 우리가 정보를 선택하고 배열하는 행위가 결국 자신의 \u003cb class=\"key\">주관적 \u003c/b>\u003cb class=\"key\">관점\u003c/b>을 정당화하려는 목적을 가짐을 의미합니다. 자신의 논리에 맞는 증거만 수집하는 \u003cb class=\"key\">확증 \u003c/b>\u003cb class=\"key\">편향\u003c/b>적 특성을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : [be동사] + [과거분사(p.p.)] : \"이루어진다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : 선행사(a way) + [that (주격 관계대명사) + 동사] : \"뒷받침하는\"\u003c/div>\u003c/div>","segs":[{"n":20,"text":"And, 그리고. it is done, 그것은 이루어진다. most certainly, 가장 확실히. in a way, 방식으로. that supports our viewpoint, 우리의 관점을 뒷받침하는. 이 문장 전체를 해석하면, 그리고 그것은 가장 확실히 우리의 관점을 뒷받침하는 방식으로 이루어진다.","hl":"m"},{"n":21,"text":"우리가 정보를 선택하거나 배열하는 모든 과정은 결국 내 생각과 관점이 옳다는 것을 증명하려는 의도를 담고 있다는 설명이에요. 즉, 보고 싶은 것만 보는 현상을 뒷받침하는 문장입니다.","hl":"mn"},{"n":22,"text":"첫 번째로 is done은 수동태 표현이에요. 주어인 it이 어떤 일을 직접 하는 게 아니라 행해지는 대상이라서 수동태를 썼죠. 두 번째로 that supports는 앞에 있는 a way를 꾸며주는 주격 관계대명사예요. 선행사가 하나인 단수라서 support 뒤에 에스(s)를 붙여야 한다는 점에 주의하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">선택적 지각은\u003c/span>\u003cspan class=\"en\">Selective perception\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기반을 둔다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">based \u003c/span>\u003cspan class=\"tgt\">on\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">것들에\u003c/span>\u003cspan class=\"en\">the things\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리에게 보이는\u003c/span>\u003cspan class=\"en\">that seem to us\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">두드러져\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">stand \u003c/span>\u003cspan class=\"tgt\">out\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">선택적 지각은 우리에게 두드러져 보이는 것에 기반을 둔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 모든 정보를 다 받아들이는 것이 아니라, 우리 눈에 유독 \u003cb class=\"key\">눈에 \u003c/b>\u003cb class=\"key\">띄는\u003c/b> 정보만을 골라 인식한다는 원리를 설명합니다. 인식의 \u003cb class=\"key\">선별적 \u003c/b>\u003cb class=\"key\">기준\u003c/b>이 무엇인지 제시하는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태 관용 표현\u003c/span> : be based on + 명사 : \"~에 기반을 두다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 보어 역할\u003c/span> : seem + to [동사원형] : \"두드러져 보이는 것\"\u003c/div>\u003c/div>","segs":[{"n":23,"text":"Selective perception, 선택적 지각은. is based on, 기반을 둔다. the things, 것들에. that seem to us, 우리에게 보이는. to stand out, 두드러져. 이 문장 전체를 해석하면, 선택적 지각은 우리에게 두드러져 보이는 것에 기반을 둔다.","hl":"m"},{"n":24,"text":"우리가 세상을 인식할 때 모든 걸 다 보는 게 아니에요. 우리 주관에 따라 유독 눈에 확 들어오는 것들만 골라서 받아들인다는 뜻입니다.","hl":"mn"},{"n":25,"text":"첫 번째로 is based on은 무엇에 기반을 둔다는 뜻의 아주 중요한 표현이에요. 수동태 형태로 쓰인다는 걸 기억하세요. 두 번째로 stand out 앞에 있는 to는 seem이라는 동사와 짝꿍이에요. 무엇인 것처럼 보인다고 말할 때는 seem 뒤에 to부정사를 써야 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나\u003c/span>\u003cspan class=\"en\">However,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">것은\u003c/span>\u003cspan class=\"en\">the things\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리에게 보이고 있는\u003c/span>\u003cspan class=\"en\">that seem to us\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">두드러져\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">standing \u003c/span>\u003cspan class=\"tgt\">out\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매우 관련 있을지도 모른다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">may \u003c/span>\u003cspan class=\"tgt\">very \u003c/span>\u003cspan class=\"tgt\">well \u003c/span>\u003cspan class=\"tgt\">be\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">특정한 것들과\u003c/span>\u003cspan class=\"en\">related to certain things.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 우리에게 두드러져 보이고 있는 것은 특정한 것들과 매우 관련 있을지도 모른다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 눈에 띄는 현상이 우연이 아니라, 관찰자의 \u003cb class=\"key\">내적 \u003c/b>\u003cb class=\"key\">배경\u003c/b>이나 상황과 밀접하게 연결되어 있음을 암시합니다. 인식의 \u003cb class=\"key\">필연성\u003c/b>을 언급하며 다음 문장의 구체적 예시를 예고합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 진행형\u003c/span> : to + be + [동사원형-ing] : \"두드러져 보이고 있는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 관용구\u003c/span> : may very well + [동사원형] : \"아마 매우 ~일 것이다\"\u003c/div>\u003c/div>","segs":[{"n":26,"text":"However, 그러나. the things, 것은. that seem to us, 우리에게 보이고 있는. to be standing out, 두드러져. may very well be, 매우 관련 있을지도 모른다. related to certain things, 특정한 것들과. 이 문장 전체를 해석하면, 그러나 우리에게 두드러져 보이고 있는 것은 특정한 것들과 매우 관련 있을지도 모른다.","hl":"m"},{"n":27,"text":"어떤 게 우리 눈에 확 띄는 건 그냥 우연이 아니라는 거예요. 사실은 우리가 처한 상황이나 관심사 같은 특정한 요소들과 아주 깊게 연결되어 있다는 반전의 메시지를 주고 있습니다.","hl":"mn"},{"n":28,"text":"첫 번째 포인트는 to be standing out이에요. 그냥 to stand out이라고 써도 되지만, 지금 딱 눈에 띄고 있는 중이라는 진행의 느낌을 살리기 위해 to be ing 형태를 썼어요. 두 번째로 may very well be는 아마 당연히 무엇일 것이다라는 강한 추측을 나타내는 표현입니다. 여기서 be는 뒤에 나오는 related와 연결되어 관련이 있다는 의미를 완성합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">즉,\u003c/span>\u003cspan class=\"en\">In other words,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 ~와 관련되어 있다\u003c/span>\u003cspan class=\"en\">they are related to\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 목표, 관심사, 기대,\u003c/span>\u003cspan class=\"en\">our goals, interests, expectations,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">과거의 경험 또는 현재의 요구와\u003c/span>\u003cspan class=\"en\">past experiences, or current demands\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상황에 대한.\u003c/span>\u003cspan class=\"en\">of the situation.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">즉, 그것은 우리의 목표, 관심사, 기대, 과거의 경험 또는 상황에 대한 현재의 요구와 관련되어 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 언급된 '눈에 띄는 것들'이 결정되는 구체적인 기준들을 나열하며, \u003cb class=\"key\">주관적 \u003c/b>\u003cb class=\"key\">요인\u003c/b>이 우리의 \u003cb class=\"key\">지각\u003c/b>에 개입함을 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">수동태 관용 표현\u003c/span> : be [be동사] + related [과거분사] + to [전치사] : \"~와 관련되다\"\u003c/div>\u003c/div>","segs":[{"n":29,"text":"In other words, 즉. they are related to, 그것은 ~와 관련되어 있다. our goals, interests, expectations, 우리의 목표, 관심사, 기대. past experiences, or current demands, 과거의 경험 또는 현재의 요구와. of the situation, 상황에 대한.. 이 문장 전체를 해석하면, 즉, 그것은 우리의 목표, 관심사, 기대, 과거의 경험 또는 상황에 대한 현재의 요구와 관련되어 있다.","hl":"m"},{"n":30,"text":"우리가 무엇을 선택적으로 보게 되는지는 무작위가 아니에요. 우리의 목표나 과거 경험 같은 주관적 요인이 지각에 큰 영향을 미친다는 점을 강조하고 있죠.","hl":"mn"},{"n":31,"text":"첫 번째로 주목할 문법은 be related to 표현이에요. 주어가 무언가와 연결되어 있다는 상태를 표현할 때 쓰는 수동태 형태의 관용구인데, 여기서 전치사 to를 빠뜨리지 않도록 주의해야 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 ~와 같다\u003c/span>\u003cspan class=\"en\">It's like\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“망치를 손에 들고 있으면,\u003c/span>\u003cspan class=\"en\">&quot;with a hammer in hand,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 것이 못처럼 보인다”\u003c/span>\u003cspan class=\"en\">everything \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">looks \u003c/span>\u003cspan class=\"tgt\">like\u003c/span> a nail.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 “망치를 손에 들고 있으면, 모든 것이 못처럼 보인다”와 같다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> \u003cb class=\"key\">선택적 \u003c/b>\u003cb class=\"key\">지각\u003c/b>을 비유적으로 표현한 격언으로, 자신이 가진 \u003cb class=\"key\">도구\u003c/b>나 \u003cb class=\"key\">관점\u003c/b>에 맞추어 세상을 왜곡하여 해석하게 된다는 뜻입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">감각동사의 보어 형태\u003c/span> : look [감각동사] + like [전치사] + a nail [명사] : \"~처럼 보이다\"\u003c/div>\u003c/div>","segs":[{"n":32,"text":"It's like, 그것은 ~와 같다. \"with a hammer in hand, “망치를 손에 들고 있으면. everything looks like a nail.\", 모든 것이 못처럼 보인다”. 이 문장 전체를 해석하면, 그것은 “망치를 손에 들고 있으면, 모든 것이 못처럼 보인다”와 같다.","hl":"m"},{"n":33,"text":"선택적 지각이라는 어려운 개념을 아주 유명한 비유로 설명하고 있어요. 내가 망치를 가졌다는 사실, 즉 나의 도구나 관점이 세상을 바라보는 방식을 결정한다는 뜻이죠.","hl":"mn"},{"n":34,"text":"여기서 looks like 부분을 보세요. look은 감각동사라 보통 뒤에 형용사가 오지만, 이 문장처럼 명사가 오고 싶을 때는 전치사 like를 반드시 써서 표현해야 한다는 것이 포인트예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 인용문은\u003c/span>\u003cspan class=\"en\">This quote\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">현상을 강조한다\u003c/span>\u003cspan class=\"en\">highlights the phenomenon\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">선택적 지각의.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">selective \u003c/span>\u003cspan class=\"tgt\">perception\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 인용문은 선택적 지각의 현상을 강조한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 제시된 망치 비유가 글의 핵심 주제어인 \u003cb class=\"key\">선택적 \u003c/b>\u003cb class=\"key\">지각\u003c/b>을 상징하는 것임을 명시하며 내용을 \u003cb class=\"key\">요약\u003c/b>합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 of의 동격 표현\u003c/span> : phenomenon [명사] + of [전치사] + selective perception [명사구] : \"선택적 지각이라는 현상\"\u003c/div>\u003c/div>","segs":[{"n":35,"text":"This quote, 이 인용문은. highlights the phenomenon, 현상을 강조한다. of selective perception, 선택적 지각의.. 이 문장 전체를 해석하면, 이 인용문은 선택적 지각의 현상을 강조한다.","hl":"m"},{"n":36,"text":"방금 본 망치 비유가 결국 무엇을 말하려는지 결론을 내려주는 문장이에요. 이 글 전체의 핵심 용어인 선택적 지각이라는 말을 직접적으로 언급하며 내용을 정리하죠.","hl":"mn"},{"n":37,"text":"마지막 부분의 전치사 of를 주의 깊게 보세요. 현상이라는 명사와 선택적 지각이라는 명사구를 연결해서, 선택적 지각이라는 현상이라고 해석되는 동격의 구조를 만들고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 우리가 망치를 사용하기를 원한다면,\u003c/span>\u003cspan class=\"en\">If we \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">want \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">use\u003c/span> a hammer,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러면 우리 주변의 세상은\u003c/span>\u003cspan class=\"en\">then the world around us\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보이기 시작할지도 모른다\u003c/span>\u003cspan class=\"en\">may begin to look\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마치 못으로 가득 찬 것처럼!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">though\u003c/span> it is \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">full \u003c/span>\u003cspan class=\"tgt\">of\u003c/span> nails!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">만약 우리가 망치를 사용하기를 원한다면, 그러면 우리 주변의 세상은 마치 못으로 가득 찬 것처럼 보이기 시작할지도 모른다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 우리가 가진 목적이나 도구에 따라 세상을 편향되게 바라보는 \u003cb class=\"key\">선택적 \u003c/b>\u003cb class=\"key\">지각\u003c/b>의 원리를 망치와 못에 비유하여 설명한 결론 문장입니다. \u003cb class=\"key\">망치\u003c/b>라는 목적이 생기면 모든 상황을 그 목적에만 맞춰 \u003cb class=\"key\">해석\u003c/b>하게 된다는 경고를 담고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : want [동사] + [to use (to부정사/목적어)] : \"사용하기를 원하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 as though\u003c/span> : as though + [주어 + 동사] : \"마치 ~인 것처럼\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">형용사구의 보어 역할\u003c/span> : be full of + [명사] : \"~로 가득 찬\"\u003c/div>\u003c/div>","segs":[{"n":38,"text":"If we want to use a hammer, 만약 우리가 망치를 사용하기를 원한다면. then the world around us, 그러면 우리 주변의 세상은. may begin to look, 보이기 시작할지도 모른다. as though it is full of nails!, 마치 못으로 가득 찬 것처럼!. 이 문장 전체를 해석하면, 만약 우리가 망치를 사용하기를 원한다면, 그러면 우리 주변의 세상은 마치 못으로 가득 찬 것처럼 보이기 시작할지도 모른다!","hl":"m"},{"n":39,"text":"이 문장은 앞서 나온 격언의 의미를 우리 삶의 상황으로 다시 풀어서 설명하고 있어요. 우리가 어떤 특정한 목적이나 도구를 가지게 되면, 세상의 모든 것이 그 목적에 맞춰서만 보이게 된다는 선택적 지각의 원리를 강조하는 아주 중요한 결론입니다.","hl":"mn"},{"n":40,"text":"첫 번째로 want to use는 동사 want가 미래에 하고 싶은 일을 나타내는 to부정사를 목적어로 데려온 형태예요. 두 번째로 as though는 마치 뭐뭐인 것처럼이라는 뜻으로, 뒤에 주어 it과 동사 is가 이어지는 접속사 역할을 하죠. 우리 주변의 세상이 실제로 못밭은 아니지만 그렇게 보인다는 비유적 상황을 생생하게 묘사하고 있습니다. 마지막으로 full of는 명사 nails와 결합하여 무엇으로 가득 차 있는지를 구체적으로 설명해 줍니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>우리는 자신의 \u003cb class=\"key\">관점\u003c/b>을 뒷받침하기 위해 정보를 \u003cb class=\"key\">선택적으로 \u003c/b>\u003cb class=\"key\">해석\u003c/b>하고 배열하는 경향이 있습니다.\u003c/li>\u003cli>\u003cb class=\"key\">선택적 \u003c/b>\u003cb class=\"key\">지각\u003c/b>은 단순히 사실을 보는 것이 아니라, 우리에게 \u003cb class=\"key\">두드러져 \u003c/b>\u003cb class=\"key\">보이는 \u003c/b>\u003cb class=\"key\">것\u003c/b>에 기초합니다.\u003c/li>\u003cli>지각에 영향을 주는 요인은 개인의 \u003cb class=\"key\">목표, \u003c/b>\u003cb class=\"key\">기대\u003c/b>, 과거 경험 및 상황적 요구 등 \u003cb class=\"key\">주관적\u003c/b>인 것들입니다.\u003c/li>\u003cli>\u003cb class=\"key\">망치와 \u003c/b>\u003cb class=\"key\">못\u003c/b>의 비유처럼, 우리가 무엇을 하려느냐에 따라 주변 세상이 \u003cb class=\"key\">다르게 \u003c/b>\u003cb class=\"key\">인식\u003c/b>될 수 있습니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>We perceive and interpret reality selectively based on our subjective viewpoints, interests, and expectations.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">우리는 자신의 \u003cb class=\"key\">관점\u003c/b>을 뒷받침하기 위해 사건을 \u003cb class=\"key\">선택적으로 \u003c/b>\u003cb class=\"key\">해석\u003c/b>하며, 이는 우리의 목표, 기대, 과거 경험과 같은 \u003cb class=\"key\">주관적 \u003c/b>\u003cb class=\"key\">요인\u003c/b>에 의해 결정된다는 내용이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":41,"text":"자, 오늘 지문 정리해 볼게요. 우리는 세상을 있는 그대로 보는 것이 아니라, 우리가 보고 싶은 대로 보고 해석한다는 것이 핵심이었어요. 여러분도 영어를 공부할 때 나는 영어를 잘하고 싶다는 망치를 들고 세상을 보면, 모든 영어 문장이 실력을 쌓는 못처럼 즐겁게 보일 거예요! 오늘 수업 여기서 마칠게요. 수고하셨습니다.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
