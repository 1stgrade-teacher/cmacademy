<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터2 Reading35 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터2 Reading35","audioDir":"reading35_audio","preview":false,"count":39,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.668em\">Reading\u003cbr>35\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터 레벨2\u003c/div>\u003ch1>The Prison of Culture: Why We Stay Inside the Box\u003c/h1>\u003ch2>문화라는 상자: 우리가 그 안에 머무는 이유\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>\u003cb class=\"key\">문화\u003c/b>는 우리가 당연하게 여기는 '상자'와 같아서, 그 안에서 \u003cb class=\"key\">정신적 \u003c/b>\u003cb class=\"key\">위안\u003c/b>과 특권을 누리는 대신 집단의 \u003cb class=\"key\">정체성\u003c/b>과 신념을 따르며 행동하게 만듭니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Culture acts as a social box that provides psychological stability and identity, making it difficult for individuals to truly live outside of its norms.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분! 오늘은 우리가 흔히 쓰는 표현인 '상자 밖에서 생각하라'는 말 속에 숨겨진 날카로운 통찰을 담은 지문을 공부해 볼 거예요. 이 글은 우리가 벗어나려고 애쓰는 그 상자가 사실은 우리의 문화라는 점을 지적하며, 문화가 우리 삶에 어떤 영향을 주는지 명확하게 설명하고 있습니다. 문화라는 틀 안에서 우리가 왜 안주하게 되는지 그 요지를 함께 살펴봅시다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">'Think outside the box'는 창의적인 사고를 강조할 때 흔히 쓰이는 \u003cb class=\"key\">관용구\u003c/b>(idiom)입니다. 이 글은 우리가 벗어나려 노력하는 그 상자가 사실은 우리가 속한 \u003cb class=\"key\">문화\u003c/b>(culture)라고 정의합니다. 마치 \u003cb class=\"key\">물고기\u003c/b>가 물의 존재를 느끼지 못하듯, 우리는 문화라는 환경 안에서 보호받으며 당연하게 행동합니다. 이 안락한 틀을 벗어나면 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">권리\u003c/b>를 잃을 위험이 따르기에, 사람들은 집단의 신념을 따르며 \u003cb class=\"key\">정상\u003c/b>(normal)의 범주 안에 머물려 합니다.\u003c/div>","segs":[{"n":2,"text":"여러분, think outside the box라는 영어 표현 들어본 적 있죠? 창의력을 발휘해서 기존의 틀을 깨라는 뜻인데요. 이 글에서는 이 상자를 우리가 속한 문화, 즉 culture라고 부릅니다. 마치 우리가 숨 쉬는 공기처럼 너무 당연해서 인식하지 못하지만, 우리를 보호하고 안정감을 주는 거대한 시스템을 의미하는 것이죠. 우리가 문화라는 보호막 안에서 어떤 심리적 위안을 얻고 있는지 배경지식으로 꼭 챙겨두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>상자의 정의\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>익숙한 표현인 '상자 밖에서 생각하기'를 언급하며, 그 \u003cb class=\"key\">상자\u003c/b>가 사실은 우리가 속한 \u003cb class=\"key\">문화\u003c/b>임을 밝힙니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>문화의 기능과 대가\u003csmall>전개 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>문화가 주는 \u003cb class=\"key\">정신적 \u003c/b>\u003cb class=\"key\">위안\u003c/b>과 보호를 설명하고, 상자 밖으로 나갈 때 \u003cb class=\"key\">권리와 \u003c/b>\u003cb class=\"key\">특권\u003c/b>을 잃게 된다는 점을 경고합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>순응의 메커니즘\u003csmall>심화 · 문장 6–8\u003c/small>\u003c/h4>\u003cp>집단 신념의 \u003cb class=\"key\">내면화\u003c/b>와 정체성 형성을 통해, 사람들은 의구심 없이 \u003cb class=\"key\">기대되는 \u003c/b>\u003cb class=\"key\">행동\u003c/b>을 수행하게 됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>문화의 최종 역할\u003csmall>결론 · 문장 9\u003c/small>\u003c/h4>\u003cp>결과적으로 문화는 무엇이 \u003cb class=\"key\">정상성\u003c/b>(normal)인지에 대한 기준을 정의하며 글을 마무리합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 따라가 보면서 문화라는 상자의 특징을 네 단계로 나누어 알아볼까요?","hl":null},{"n":4,"text":"첫 번째 단계인 첫 번째와 두 번째 문장에서는 도입부로 상자 밖에서 생각하려고 할 때 그 상자가 바로 우리가 속한 문화라는 점을 정의하며 시작합니다.","hl":"f0"},{"n":5,"text":"두 번째 단계인 세 번째부터 다섯 번째 문장까지는 문화가 주는 정신적 위안과 보호라는 혜택을 언급하면서도, 이 틀을 벗어났을 때 겪게 되는 권리와 특권의 상실이라는 현실적인 제약을 설명하죠.","hl":"f1"},{"n":6,"text":"세 번째 단계인 여섯 번째부터 여덟 번째 문장에서는 우리가 왜 상자 안에 머무는지에 대한 심리적 이유를 다루는데, 집단의 신념을 내면화하고 남들의 기대에 맞춰 행동하게 되는 과정을 보여줍니다.","hl":"f2"},{"n":7,"text":"마지막 네 번째 단계인 아홉 번째 문장에서는 이 모든 과정을 종합하여 문화가 결국 무엇이 정상인지 그 기준을 정의한다는 결론을 내리고 있습니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 9번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">'상자'라는 비유를 통해 문화의 \u003cb class=\"key\">심리적 \u003c/b>\u003cb class=\"key\">통제\u003c/b> 메커니즘을 설명합니다. 초반에 정의를 내리고 중반에 이유를 제시한 뒤, 마지막 문장에서 문화가 \u003cb class=\"key\">정상성\u003c/b>의 기준이라는 핵심 결론을 도출합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>therefore (9)\u003c/b>\u003cspan>인과관계를 통한 결론 도출\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">think outside the box\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the culture which they are a part of\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">that box\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">it\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">group beliefs\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">what it means to be normal\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Inside the Box (Culture)\u003c/th>\u003cth>Outside the Box\u003c/th>\u003c/tr>\u003ctr>\u003ctd>정신적 위안과 보호 제공\u003c/td>\u003ctd>일시적 창의성으로만 인식됨\u003c/td>\u003c/tr>\u003ctr>\u003ctd>모든 권리와 특권 유지\u003c/td>\u003ctd>권리와 특권의 상실 위험\u003c/td>\u003c/tr>\u003ctr>\u003ctd>당연하고 정상적인 행동\u003c/td>\u003ctd>의구심의 대상이 됨\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 전형적인 주장과 근거의 구조를 취하고 있으며, 마지막 문장에 핵심 메시지를 배치한 미괄식 구성이에요. 문화라는 추상적인 개념을 상자라는 비유를 통해 아주 명확하게 전달하고 있죠.","hl":"ty"},{"n":9,"text":"아홉 번째 문장의 therefore라는 연결어는 아주 중요한 신호어예요. 앞에서 언급한 문화의 보호 기능과 순응의 압박을 모두 정리해서, 문화가 곧 정상임의 정의라는 최종 결론으로 이끌어주는 역할을 합니다. 또한 culture와 that box, 그리고 group beliefs로 이어지는 재진술의 연결 고리도 잘 파악해야 합니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>hear of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 대해 듣다\u003c/span>\u003c/div>\u003cdiv>\u003cb>think outside the box\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>고정관념에서 벗어나 생각하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>culture\u003c/b>\u003cem>명사\u003c/em>\u003cspan>문화\u003c/span>\u003c/div>\u003cdiv>\u003cb>part\u003c/b>\u003cem>명사\u003c/em>\u003cspan>일부\u003c/span>\u003c/div>\u003cdiv>\u003cb>religion\u003c/b>\u003cem>명사\u003c/em>\u003cspan>종교\u003c/span>\u003c/div>\u003cdiv>\u003cb>tradition\u003c/b>\u003cem>명사\u003c/em>\u003cspan>전통\u003c/span>\u003c/div>\u003cdiv>\u003cb>mental\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>정신적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>comfort\u003c/b>\u003cem>명사\u003c/em>\u003cspan>위안, 편안함\u003c/span>\u003c/div>\u003cdiv>\u003cb>protection\u003c/b>\u003cem>명사\u003c/em>\u003cspan>보호\u003c/span>\u003c/div>\u003cdiv>\u003cb>wander\u003c/b>\u003cem>동사\u003c/em>\u003cspan>방황하다, 거닐다\u003c/span>\u003c/div>\u003cdiv>\u003cb>perceive\u003c/b>\u003cem>동사\u003c/em>\u003cspan>인식하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>creativity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>창의성\u003c/span>\u003c/div>\u003cdiv>\u003cb>for a little while\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>잠시 동안\u003c/span>\u003c/div>\u003cdiv>\u003cb>maintain\u003c/b>\u003cem>동사\u003c/em>\u003cspan>유지하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>right\u003c/b>\u003cem>명사\u003c/em>\u003cspan>권리\u003c/span>\u003c/div>\u003cdiv>\u003cb>privilege\u003c/b>\u003cem>명사\u003c/em>\u003cspan>특권\u003c/span>\u003c/div>\u003cdiv>\u003cb>pressure\u003c/b>\u003cem>명사\u003c/em>\u003cspan>압박\u003c/span>\u003c/div>\u003cdiv>\u003cb>internalize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>내면화하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>belief\u003c/b>\u003cem>명사\u003c/em>\u003cspan>신념\u003c/span>\u003c/div>\u003cdiv>\u003cb>take on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 취하다, (성질을) 띠다\u003c/span>\u003c/div>\u003cdiv>\u003cb>identity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>정체성\u003c/span>\u003c/div>\u003cdiv>\u003cb>expected\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>기대되는\u003c/span>\u003c/div>\u003cdiv>\u003cb>sense\u003c/b>\u003cem>명사\u003c/em>\u003cspan>의식, 감각\u003c/span>\u003c/div>\u003cdiv>\u003cb>question\u003c/b>\u003cem>동사\u003c/em>\u003cspan>의문을 제기하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>define\u003c/b>\u003cem>동사\u003c/em>\u003cspan>정의하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>normal\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>정상적인\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"지문에서 internalize라는 단어가 나오는데, 이는 외부의 신념을 자신의 것처럼 깊이 받아들이는 내면화를 뜻해요. 또한 privilege는 문화라는 울타리 안에서만 누릴 수 있는 특별한 혜택인 특권을 의미하니 문맥에서 그 의미를 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">perceive\u003c/b>\u003cspan class=\"m\">인식하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">recognize\u003c/span>\u003cspan class=\"s\">notice\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">maintain\u003c/b>\u003cspan class=\"m\">유지하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">keep\u003c/span>\u003cspan class=\"s\">preserve\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">abandon\u003c/span>\u003cspan class=\"a\">lose\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">internalize\u003c/b>\u003cspan class=\"m\">내면화하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">absorb\u003c/span>\u003cspan class=\"s\">adopt\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">externalize\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">privilege\u003c/b>\u003cspan class=\"m\">특권\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">advantage\u003c/span>\u003cspan class=\"s\">benefit\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">disadvantage\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">normal\u003c/b>\u003cspan class=\"m\">정상적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">standard\u003c/span>\u003cspan class=\"s\">ordinary\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">abnormal\u003c/span>\u003cspan class=\"a\">unusual\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"핵심 어휘를 정리해볼까요? 무언가를 인지한다는 뜻의 perceive는 notice나 recognize와 비슷하게 쓰이지만, 무시한다는 뜻의 ignore와는 반대되는 개념이에요. 또한 유지하다라는 maintain은 keep과 유의어이고, 포기하거나 잃어버린다는 뜻의 abandon이나 lose와는 대조를 이루니 함께 외워두면 좋겠죠?","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 ~에 대해 들어본 적이 있는가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Have \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">ever \u003c/span>\u003cspan class=\"tgt\">heard \u003c/span>\u003cspan class=\"tgt\">of\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">&quot;상자 밖에서 생각하다&quot;라는 말\u003c/span>\u003cspan class=\"en\">&quot;think outside the box&quot;?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“상자 밖에서 생각하다”라는 말을 들어본 적이 있는가?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 독자들에게 매우 익숙한 영어 표현을 인용하며 글의 주제인 \u003cb class=\"key\">사고의 \u003c/b>\u003cb class=\"key\">방식\u003c/b>과 틀에 대해 대화를 시작하는 \u003cb class=\"key\">도입부\u003c/b>입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재완료 (경험)\u003c/span> : Have + 주어 + ever + p.p. : \"~에 대해 들어본 적이 있는가\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Have you ever heard of, 당신은 ~에 대해 들어본 적이 있는가. \"think outside the box\"?, \"상자 밖에서 생각하다\"라는 말. 이 문장 전체를 해석하면, “상자 밖에서 생각하다”라는 말을 들어본 적이 있는가?","hl":"m"},{"n":13,"text":"여러분, 새로운 관점에서 생각하라는 의미의 이 숙어는 정말 유명하죠? 작가는 독자들이 다 아는 표현을 사용해서 앞으로 설명할 사고의 틀과 문화에 대해 흥미를 유도하고 있습니다.","hl":"mn"},{"n":14,"text":"첫 번째 문장에서 Have you ever heard of 부분을 봐 주세요. 이 문장은 현재완료의 경험 용법을 사용하고 있어요. 과거 어느 시점부터 지금까지 한 번이라도 들어본 적이 있는지 묻는 것이죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들이 생각하려고 할 때\u003c/span>\u003cspan class=\"en\">When people try to think\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상자 밖에서\u003c/span>\u003cspan class=\"en\">outside the box,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">문화가\u003c/span>\u003cspan class=\"en\">the culture\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 속한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">which \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">part \u003c/span>\u003cspan class=\"tgt\">of\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바로 그 상자이다.\u003c/span>\u003cspan class=\"en\">is that box.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사람들이 상자 밖에서 생각하려고 할 때, 그들이 속한 문화가 바로 ‘그 상자이다.’\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 글의 핵심 주장이 드러나는 문장으로, 우리가 벗어나야 할 상자가 실제로는 우리가 속한 \u003cb class=\"key\">문화\u003c/b>라는 것을 \u003cb class=\"key\">정의\u003c/b>합니다. 사고를 제한하는 보이지 않는 틀이 문화임을 밝히고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사\u003c/span> : 명사(선행사) + which + 주어 + 동사 + 전치사 : \"그들이 속한\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"When people try to think, 사람들이 생각하려고 할 때. outside the box, 상자 밖에서. the culture, 문화가. which they are a part of, 그들이 속한. is that box, 바로 그 상자이다.. 이 문장 전체를 해석하면, 사람들이 상자 밖에서 생각하려고 할 때, 그들이 속한 문화가 바로 ‘그 상자이다.’","hl":"m"},{"n":16,"text":"앞에서 말한 상자가 무엇인지 이 문장이 알려줍니다. 우리가 상자 밖 사고를 하려 할 때, 사실 우리를 가두고 있는 그 상자는 바로 우리가 속한 문화라는 것이죠. 필자의 날카로운 통찰이 담겨 있어요.","hl":"mn"},{"n":17,"text":"두 번째 문장에서는 the culture 뒤에 나오는 which they are a part of가 핵심입니다. 관계대명사 which가 이끄는 절이 문화를 수식하는데, 전치사 of 뒤에 목적어가 빠져 있는 목적격 관계대명사 구조예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">종교나 다른 전통들처럼,\u003c/span>\u003cspan class=\"en\">Like religion or other traditions,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">문화는 우리에게 제공한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">culture \u003c/span>\u003cspan class=\"tgt\">gives \u003c/span>\u003cspan class=\"tgt\">us \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일종의 정신적인 위안과 보호를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">kind \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">mental \u003c/span>\u003cspan class=\"tgt\">comfort \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">protection\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">종교나 다른 전통들처럼, 문화는 우리에게 일종의 정신적인 위안과 보호를 제공한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 문화가 인간에게 주는 \u003cb class=\"key\">긍정적 \u003c/b>\u003cb class=\"key\">혜택\u003c/b>을 나열하고 있습니다. 사람들이 왜 문화라는 상자 안에 머무르려고 하는지에 대한 \u003cb class=\"key\">심리적 \u003c/b>\u003cb class=\"key\">근거\u003c/b>를 제시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">4형식 수여동사\u003c/span> : 주어 + give + 간접목적어(us) + 직접목적어 : \"문화는 우리에게 위안과 보호를 준다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Like religion or other traditions, 종교나 다른 전통들처럼. culture gives us, 문화는 우리에게 제공한다. a kind of mental comfort and protection, 일종의 정신적인 위안과 보호를. 이 문장 전체를 해석하면, 종교나 다른 전통들처럼, 문화는 우리에게 일종의 정신적인 위안과 보호를 제공한다.","hl":"m"},{"n":19,"text":"사람들이 왜 문화 밖으로 나가기를 꺼려할까요? 바로 문화가 종교처럼 우리를 마음 편하게 해주고 우리를 지켜주는 역할을 하기 때문입니다. 문화의 순기능을 설명하는 문장이에요.","hl":"mn"},{"n":20,"text":"세 번째 문장에서는 동사 give의 쓰임에 주목하세요. 우리에게라는 뜻의 us와 위안과 보호라는 뜻의 목적어가 나란히 나오는 사형식 문장이에요. 누구에게 무엇을 제공하는지 확실히 보여주는 구조입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상자 밖에서 방황하는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Wandering\u003c/span> outside the box\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인식될 수 있지만\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">may \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">perceived \u003c/span>\u003cspan class=\"tgt\">as\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">창의성의 행위로\u003c/span>\u003cspan class=\"en\">an act of creativity\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">잠시 동안만이다.\u003c/span>\u003cspan class=\"en\">but only for a little while.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">상자 밖에서 방황하는 것은 창의성의 행위로 인식될 수 있지만, 잠시 동안만이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 집단의 관습을 벗어나는 행위가 처음에는 \u003cb class=\"key\">창의성\u003c/b>으로 긍정적으로 보일 수 있지만, 사회는 이를 \u003cb class=\"key\">일시적\u003c/b>으로만 용인한다는 점을 경고하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사 주어\u003c/span> : [Wandering (동명사)] + [outside the box (수식어)] + [may be (동사)] : \"방황하는 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 수동태\u003c/span> : [may (조동사)] + [be perceived (be+p.p.)] + [as (~로서)] : \"~로 인식될 수 있다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Wandering outside the box, 상자 밖에서 방황하는 것은. may be perceived as, 인식될 수 있지만. an act of creativity, 창의성의 행위로. but only for a little while, 잠시 동안만이다.. 이 문장 전체를 해석하면, 상자 밖에서 방황하는 것은 창의성의 행위로 인식될 수 있지만, 잠시 동안만이다.","hl":"m"},{"n":22,"text":"상자 밖으로 나가는 것이 처음에는 창의성이라는 이름으로 멋져 보일 수 있어요. 하지만 우리 사회는 그런 이탈을 아주 잠시 동안만 너그럽게 봐준다는 현실적인 제약을 말하고 있죠.","hl":"mn"},{"n":23,"text":"첫 번째로 문장 맨 앞의 Wandering은 주어 역할을 하는 동명사예요. 상자 밖을 벗어나는 행동 그 자체를 가리키죠. 두 번째로 may be perceived as는 조동사가 포함된 수동태예요. 주어가 누군가에게 어떻게 인식되는지를 표현하고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들은 상자 밖에서 살면서\u003c/span>\u003cspan class=\"en\">People cannot live outside the box\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여전히 유지할 수는 없다\u003c/span>\u003cspan class=\"en\">and still maintain\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 권리와 특권을\u003c/span>\u003cspan class=\"en\">all the rights and privileges\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 얻을 수 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">get\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상자 안에 있을 때 얻을 수 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">stay\u003c/span> inside it.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사람들은 상자 밖에서 살면서 상자 안에 있을 때 얻을 수 있는 모든 권리와 특권을 유지할 수는 없다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 집단이라는 상자를 벗어나면 그 구성원으로서 누리던 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">혜택\u003c/b>과 \u003cb class=\"key\">권리\u003c/b>를 더 이상 보장받을 수 없다는 사회적 대가를 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사\u003c/span> : [all the rights and privileges (선행사)] + [that (관계대명사)] + [they can get (S+V)] : \"그들이 얻을 수 있는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">시간의 부사절\u003c/span> : [when (접속사)] + [they stay (주어+동사)] : \"그들이 머물 때\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"People cannot live outside the box, 사람들은 상자 밖에서 살면서. and still maintain, 여전히 유지할 수는 없다. all the rights and privileges, 모든 권리와 특권을. that they can get, 그들이 얻을 수 있는. when they stay inside it, 상자 안에 있을 때 얻을 수 있는. 이 문장 전체를 해석하면, 사람들은 상자 밖에서 살면서 상자 안에 있을 때 얻을 수 있는 모든 권리와 특권을 유지할 수는 없다.","hl":"m"},{"n":25,"text":"상자 밖으로 나가는 자유에는 대가가 따른다는 거예요. 사회가 정한 틀 안에 머물 때만 주어지는 혜택과 권리를 포기해야만 밖으로 나갈 수 있다는 현실을 보여줍니다.","hl":"mn"},{"n":26,"text":"첫 번째로 that they can get은 앞에 있는 명사인 권리와 특권을 꾸며주는 목적격 관계대명사절이에요. 어떤 권리인지 상세히 설명해주죠. 두 번째로 when they stay는 그들이 상자 안에 머무는 경우를 나타내는 시간의 부사절입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 상자 안에 남아야 한다는 압박감은\u003c/span>\u003cspan class=\"en\">The pressure \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">remain\u003c/span> within the box\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~에 대한 것이다\u003c/span>\u003cspan class=\"en\">is about\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 집단 신념을 내면화하고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">internalizing \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">group \u003c/span>\u003cspan class=\"tgt\">beliefs \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">집단 정체성을 취하는 것에 대한 것이다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">taking \u003c/span>\u003cspan class=\"tgt\">on\u003c/span> group identities.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 상자 안에 남아야 한다는 압박감은 우리의 집단 신념을 내면화하고 집단 정체성을 취하는 것에 대한 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사회적 압력은 단순히 억압하는 것이 아니라, 개인이 \u003cb class=\"key\">집단의 \u003c/b>\u003cb class=\"key\">가치\u003c/b>를 스스로 수용하고 \u003cb class=\"key\">집단 \u003c/b>\u003cb class=\"key\">정체성\u003c/b>을 갖게 만드는 심리적 기제임을 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : [The pressure (명사)] + [to remain (to부정사)] : \"남아야 한다는 (압박감)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사의 병렬 구조\u003c/span> : [internalizing (동명사1)] + [and (접속사)] + [taking on (동명사2)] : \"집단 신념을 내면화하고 취하는 것\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"The pressure to remain within the box, 그 상자 안에 남아야 한다는 압박감은. is about, ~에 대한 것이다. internalizing our group beliefs, 우리의 집단 신념을 내면화하고. and taking on group identities, 집단 정체성을 취하는 것에 대한 것이다.. 이 문장 전체를 해석하면, 그 상자 안에 남아야 한다는 압박감은 우리의 집단 신념을 내면화하고 집단 정체성을 취하는 것에 대한 것이다.","hl":"m"},{"n":28,"text":"우리가 왜 틀 안에서 벗어나지 못할까요? 그건 바로 사회가 우리에게 집단의 생각을 내 것처럼 받아들이고 그 일원이 되라는 무언의 압력을 주기 때문이에요.","hl":"mn"},{"n":29,"text":"첫 번째로 to remain은 압박감이라는 명사를 수식하는 형용사적 용법의 to부정사예요. 두 번째로 internalizing과 taking on은 전치사 about 뒤에 나란히 연결된 동명사 병렬 구조입니다. 두 가지 행동 모두에 대한 이야기라는 뜻이죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또한, 그것은 ~에 관한 것이다\u003c/span>\u003cspan class=\"en\">Also, it is about\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">행동하는 것\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">acting\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 행동할 것으로 기대되는 대로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">expected \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">act\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">또한, 그것은 우리가 행동할 것으로 기대되는 대로 행동하는 것에 관한 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 문화는 우리가 속한 사회의 \u003cb class=\"key\">기대치\u003c/b>에 부합하도록 개인의 행동을 조절하는 역할을 합니다. 즉, 집단 내에서 요구되는 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">역할\u003c/b>을 수행하는 법을 배우는 과정임을 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사(전치사의 목적어)\u003c/span> : about [전치사] + acting [동명사] : \"행동하는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 as와 수동태\u003c/span> : as [접속사] + we [주어] + are expected [be p.p./수동태] : \"우리가 행동하도록 기대되는 대로\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Also, it is about, 또한, 그것은 ~에 관한 것이다. acting, 행동하는 것. as we are expected to act, 우리가 행동할 것으로 기대되는 대로. 이 문장 전체를 해석하면, 또한, 그것은 우리가 행동할 것으로 기대되는 대로 행동하는 것에 관한 것이다.","hl":"m"},{"n":31,"text":"문화라는 것은 우리가 속한 사회에서 다른 사람들이 우리에게 기대하는 모습대로 행동하는 것에 대한 이야기입니다. 개인의 자유로운 선택보다는 사회적인 기대치를 충족하는 방식에 집중하게 만들죠.","hl":"mn"},{"n":32,"text":"첫 번째로 전치사 about 뒤에 동명사 acting이 와서 행동하는 것이라는 뜻을 나타내고요. 두 번째로 접속사 as가 이끄는 절에서 be expected to act라는 수동태 표현이 쓰여 우리가 사회로부터 행동하기로 기대받는 상태임을 보여줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들은 모두 일을 한다\u003c/span>\u003cspan class=\"en\">People all do things\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전혀 의식하지 않고\u003c/span>\u003cspan class=\"en\">without any sense\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신들이 하고 있는 일이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">they're \u003c/span>\u003cspan class=\"tgt\">doing\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">의문이 제기될 수 있다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">could \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">questioned\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사람들은 모두 자신들이 하고 있는 일에 의문이 제기될 수 있다는 것을 전혀 의식하지 않고 일을 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 문화적 관습은 너무나 당연하게 여겨져서 사람들은 그 행동의 \u003cb class=\"key\">정당성\u003c/b>을 의심하지 않습니다. 이는 사람들이 기존 질서를 \u003cb class=\"key\">무비판적\u003c/b>으로 수용하고 있음을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동격의 접속사\u003c/span> : sense [명사] + that [접속사] + 완전한 절 : \"~라는 (의식)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관계대명사 what\u003c/span> : what [관대] + they [주어] + 're doing [동사] : \"그들이 하고 있는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">조동사 수동태\u003c/span> : could [조동사] + be questioned [be p.p./수동태] : \"의문이 제기될 수 있다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"People all do things, 사람들은 모두 일을 한다. without any sense, 전혀 의식하지 않고. that what they're doing, 자신들이 하고 있는 일이. could be questioned, 의문이 제기될 수 있다는 것을. 이 문장 전체를 해석하면, 사람들은 모두 자신들이 하고 있는 일에 의문이 제기될 수 있다는 것을 전혀 의식하지 않고 일을 한다.","hl":"m"},{"n":34,"text":"사람들은 자신이 매일 하는 행동들이 혹시 틀린 건 아닐까 하는 의심을 전혀 하지 않습니다. 문화의 틀 안에 있으면 자신의 행동이 무비판적으로 당연하게 느껴지기 때문이에요.","hl":"mn"},{"n":35,"text":"첫 번째 포인트는 sense 뒤의 that으로, 앞의 명사 내용을 보충 설명하는 동격의 접속사입니다. 두 번째는 what they're doing이라는 표현인데, 관계대명사 what이 주어 역할을 하는 명사절을 이끌고 있어요. 세 번째는 could be questioned라는 수동태로, 행동에 대해 의문이 제기될 수 있다는 의미를 완성합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러므로 문화는 정의한다\u003c/span>\u003cspan class=\"en\">Culture, therefore, defines\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무엇을 의미하는지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">means \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정상적이라는 것이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">normal\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러므로 문화는 정상적이라는 것이 무엇을 의미하는지를 정의한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 문화는 한 사회에서 무엇이 \u003cb class=\"key\">정상\u003c/b>인지를 결정하는 절대적인 \u003cb class=\"key\">기준\u003c/b>이 됩니다. 개인이 속한 문화적 틀이 곧 그 사람의 \u003cb class=\"key\">세계관\u003c/b>을 형성함을 강조하는 결론 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">간접의문문과 가주어·진주어\u003c/span> : what [의문사] + it [가주어] + means [동사] + to be normal [진주어] : \"정상이라는 것이 무엇을 의미하는지\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Culture, therefore, defines, 그러므로 문화는 정의한다. what it means, 무엇을 의미하는지. to be normal, 정상적이라는 것이. 이 문장 전체를 해석하면, 그러므로 문화는 정상적이라는 것이 무엇을 의미하는지를 정의한다.","hl":"m"},{"n":37,"text":"결론적으로 문화는 무엇이 평범하고 정상적인 것인지를 결정하는 중요한 기준이 됩니다. 우리가 무엇을 정상이라고 믿는지는 결국 우리가 속한 문화의 정의에 따른 것이죠.","hl":"mn"},{"n":38,"text":"여기서 what으로 시작하는 절은 간접의문문으로 defines의 목적어 역할을 합니다. 특히 what it means to be normal 부분에서 it은 가주어이고 뒤에 있는 to be normal이 진짜 주어인 진주어라는 점을 꼭 기억해야 해요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>상자 밖에서 생각하라는 관용구에서 '상자'는 우리가 속한 \u003cb class=\"key\">문화\u003c/b>를 상징합니다.\u003c/li>\u003cli>문화는 우리에게 \u003cb class=\"key\">정신적 \u003c/b>\u003cb class=\"key\">위안\u003c/b>과 보호를 주지만, 그 틀을 벗어나면 사회적 \u003cb class=\"key\">권리와 \u003c/b>\u003cb class=\"key\">특권\u003c/b>을 잃게 됩니다.\u003c/li>\u003cli>우리는 집단 신념을 \u003cb class=\"key\">내면화\u003c/b>하고 사회적 기대에 부응하라는 압박 속에 살고 있습니다.\u003c/li>\u003cli>결국 문화는 의구심 없이 행해지는 모든 행동의 기준인 \u003cb class=\"key\">정상성\u003c/b>을 정의하는 역할을 합니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Culture acts as a social box that provides psychological stability and identity, making it difficult for individuals to truly live outside of its norms.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">\u003cb class=\"key\">문화\u003c/b>는 우리가 당연하게 여기는 '상자'와 같아서, 그 안에서 \u003cb class=\"key\">정신적 \u003c/b>\u003cb class=\"key\">위안\u003c/b>과 특권을 누리는 대신 집단의 \u003cb class=\"key\">정체성\u003c/b>과 신념을 따르며 행동하게 만듭니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":39,"text":"오늘은 우리가 속한 문화가 어떻게 우리의 사고와 행동을 규정하는지 배워보았습니다. 여러분이 당연하게 하는 행동들이 사실은 문화라는 상자의 영향일 수 있다는 점이 참 흥미롭죠? 문화가 정의하는 정상이라는 기준에 대해 다시 한번 생각해보는 시간이 되었길 바랍니다. 오늘 수업은 여기서 마칠게요. 수고하셨어요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
