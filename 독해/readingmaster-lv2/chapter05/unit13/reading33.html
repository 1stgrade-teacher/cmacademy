<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터2 Reading33 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터2 Reading33","audioDir":"reading33_audio","preview":false,"count":45,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.668em\">Reading\u003cbr>33\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터 레벨2\u003c/div>\u003ch1>The True Source of Greatness: Faith in a Cause\u003c/h1>\u003ch2>위대함의 진정한 원천: 대의에 대한 신념\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>위대한 지도자는 \u003cb class=\"key\">타고난 \u003c/b>\u003cb class=\"key\">운명\u003c/b>이 아니라, 모든 것을 바칠 정도로 강력하게 믿는 \u003cb class=\"key\">대의\u003c/b>와 \u003cb class=\"key\">신념\u003c/b>을 통해 만들어집니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>True greatness and leadership are not innate qualities but results of a firm belief in a meaningful cause.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘 우리는 리딩마스터 레벨 2의 Reading 33 지문을 함께 공부할 거예요. 이 글은 위대한 지도자가 어떻게 탄생하는지에 대한 아주 흥미로운 통찰을 담고 있습니다. 핵심 요지는 위대함이란 타고난 혈통이나 운명이 아니라, 자신이 믿는 대의에 대한 강력한 확신에서 나온다는 내용이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">우리는 흔히 역사적 인물을 보며 그들이 \u003cb class=\"key\">천부적 \u003c/b>\u003cb class=\"key\">재능(innate \u003c/b>\u003cb class=\"key\">talent)\u003c/b>을 타고났다고 생각합니다. 하지만 이 글은 위대함의 근원을 개인이 아닌 그가 품은 \u003cb class=\"key\">대의(cause)\u003c/b>에서 찾습니다. 마치 \u003cb class=\"key\">작은 \u003c/b>\u003cb class=\"key\">불씨\u003c/b>가 거대한 숲을 태우는 동력이 되듯, 확고한 목표 의식은 평범한 사람을 특별한 지도자로 변화시키는 \u003cb class=\"key\">촉매(catalyst)\u003c/b>가 됩니다. 이는 심리학의 \u003cb class=\"key\">내적 \u003c/b>\u003cb class=\"key\">동기(intrinsic \u003c/b>\u003cb class=\"key\">motivation)\u003c/b> 이론과도 일맥상통하며, 신념이 어떻게 인간의 잠재력을 폭발시키는지 설명합니다.\u003c/div>","segs":[{"n":2,"text":"본격적으로 들어가기 전에 배경지식을 좀 쌓아볼까요? 우리는 보통 세종대왕이나 링컨 같은 인물을 보며 처음부터 위대하게 태어났다고 생각하곤 하죠. 영어로는 이런 걸 innate talent, 즉 천부적 재능이라고 합니다. 하지만 이 지문은 개인의 능력보다 cause, 즉 대의가 더 중요하다고 말해요. 마치 작은 촉매제가 화학 반응을 일으키듯, 확고한 신념이 한 사람의 잠재력을 폭발시켜 세상을 바꾼다는 사회심리학적인 시각을 보여줍니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>지도자에 대한 통념과 반박\u003csmall>통념 및 반박 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>역사적 인물들이 \u003cb class=\"key\">태생적\u003c/b>으로 지도자였다는 통념은 사실이 아니라고 \u003cb class=\"key\">반박\u003c/b>하며 시작합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>누구나 지도자가 될 수 있는 가능성\u003csmall>주장 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>언제 어디서든 누구나 \u003cb class=\"key\">카리스마\u003c/b>를 가진 지도자가 되어 세상을 주목시킬 수 있음을 \u003cb class=\"key\">강조\u003c/b>합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>위대함의 진정한 원천\u003csmall>원인 제시 · 문장 6–9\u003c/small>\u003c/h4>\u003cp>사람을 위대하게 만드는 것은 스스로가 아니라 그들이 믿는 \u003cb class=\"key\">대의(cause)\u003c/b>라는 핵심 \u003cb class=\"key\">진리\u003c/b>를 밝힙니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>신념이 가져오는 변화와 결과\u003csmall>결론 · 문장 10–11\u003c/small>\u003c/h4>\u003cp>확고한 \u003cb class=\"key\">신념\u003c/b>이 모든 행동의 \u003cb class=\"key\">촉매\u003c/b>가 되어 결국 세상을 놀라게 한다는 결론을 내립니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 이제 글이 어떻게 흘러가는지 단계별로 자세히 살펴볼까요?","hl":null},{"n":4,"text":"첫 번째 단계인 첫 번째 문장부터 세 번째 문장까지는 통념을 깨는 것으로 시작해요. 역사 속 인물들을 보며 그들이 지도자로 태어났다는 말이 흔히 들리지만, 사실 그 말은 들리는 것만큼 진짜가 아니라고 반박하고 있죠. 바로 태생적 지도자라는 말에 대해 의문을 던지는 겁니다.","hl":"f0"},{"n":5,"text":"두 번째 단계인 네 번째 문장과 다섯 번째 문장에서는 가능성을 이야기해요. 언제 어디서든 누구나 지도자가 될 수 있고, 그 카리스마로 전 세계를 깜짝 놀라게 할 수 있다는 긍정적인 메시지를 전달하고 있습니다.","hl":"f1"},{"n":6,"text":"세 번째 단계인 여섯 번째 문장부터 아홉 번째 문장까지가 이 글의 핵심이에요. 무엇이 사람을 위대하게 만드는가라는 질문을 던지고, 그 정답은 바로 그들이 믿는 대의라고 명확하게 밝힙니다. 스스로를 위대하게 만드는 것이 아니라는 점이 포인트예요.","hl":"f2"},{"n":7,"text":"마지막 단계인 열 번째 문장과 열한 번째 문장에서는 그 원리를 설명합니다. 배경이 어떻든 모든 것을 바칠 정도의 명확한 목표와 신념이 있다면, 그것이 감정과 행동의 촉매가 되어 세상을 경이롭게 만든다는 결론으로 마무리됩니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">질문-답변 및 통념-반박\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 9번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">초반에 '지도자는 타고난다'는 \u003cb class=\"key\">통념\u003c/b>을 제시한 후 이를 반박하며 흥미를 유발합니다. 여덟 번째 문장의 \u003cb class=\"key\">질문\u003c/b>에 대해 아홉 번째 문장에서 바로 \u003cb class=\"key\">답변\u003c/b>을 제시하며 주제를 명확히 드러내는 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Well (3)\u003c/b>\u003cspan>통념에 대한 반전 신호\u003c/span>\u003cb>Then what makes people great? (8)\u003c/b>\u003cspan>핵심 주제로 유도하는 질문\u003c/span>\u003cb>It is... (9)\u003c/b>\u003cspan>질문에 대한 명쾌한 답변\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">great leader\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">what makes people great\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the cause they believe in\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">clear goal, belief, or something\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">that faith\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Common Myth\u003c/th>\u003cth>The Truth\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Born to be a leader\u003c/td>\u003ctd>Anyone can become a leader\u003c/td>\u003c/tr>\u003ctr>\u003ctd>People make themselves great\u003c/td>\u003ctd>The cause makes them great\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식을 보면 질문과 답변 구조가 아주 돋보여요. 여덟 번째 문장에서 사람을 위대하게 만드는 게 무엇인지 묻고, 아홉 번째 문장에서 곧바로 답을 주죠. 글 전체적으로는 주제문이 중간 부분에 위치한 중괄식 구조를 띠고 있습니다.","hl":"ty"},{"n":9,"text":"신호어들을 잘 봐야 해요. 세 번째 문장의 Well은 앞에서 말한 통념을 뒤집는 신호입니다. 그리고 아홉 번째 문장의 It is the cause는 바로 앞 문장의 질문에 대한 핵심적인 답변이자 이 글의 주제문 역할을 하고 있어요. Chain을 보면 위대한 지도자에서 대의로, 그리고 다시 신념으로 개념이 확장되는 것을 알 수 있습니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>look back at\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 되돌아보다\u003c/span>\u003c/div>\u003cdiv>\u003cb>individual\u003c/b>\u003cem>명사\u003c/em>\u003cspan>개인, 사람\u003c/span>\u003c/div>\u003cdiv>\u003cb>statement\u003c/b>\u003cem>명사\u003c/em>\u003cspan>발언, 진술\u003c/span>\u003c/div>\u003cdiv>\u003cb>so and so\u003c/b>\u003cem>명사\u003c/em>\u003cspan>아무개\u003c/span>\u003c/div>\u003cdiv>\u003cb>born to be\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~할 운명으로 태어나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>often\u003c/b>\u003cem>부사\u003c/em>\u003cspan>종종, 자주\u003c/span>\u003c/div>\u003cdiv>\u003cb>as true as\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>~만큼 사실인\u003c/span>\u003c/div>\u003cdiv>\u003cb>sound\u003c/b>\u003cem>동사\u003c/em>\u003cspan>~하게 들리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>charismatic\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>카리스마가 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>entire\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>전체의\u003c/span>\u003c/div>\u003cdiv>\u003cb>sit up and take notice\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>자세를 바로잡고 주목하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>basic truth\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기본적인 진리\u003c/span>\u003c/div>\u003cdiv>\u003cb>cause\u003c/b>\u003cem>명사\u003c/em>\u003cspan>대의, 명분, 원인\u003c/span>\u003c/div>\u003cdiv>\u003cb>believe in\u003c/b>\u003cem>동사\u003c/em>\u003cspan>~의 가치를 믿다\u003c/span>\u003c/div>\u003cdiv>\u003cb>no matter\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>~이든 상관없이\u003c/span>\u003c/div>\u003cdiv>\u003cb>background\u003c/b>\u003cem>명사\u003c/em>\u003cspan>배경\u003c/span>\u003c/div>\u003cdiv>\u003cb>environment\u003c/b>\u003cem>명사\u003c/em>\u003cspan>환경\u003c/span>\u003c/div>\u003cdiv>\u003cb>willing to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>기꺼이 ~하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>give up\u003c/b>\u003cem>동사\u003c/em>\u003cspan>포기하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>faith\u003c/b>\u003cem>명사\u003c/em>\u003cspan>신념, 믿음\u003c/span>\u003c/div>\u003cdiv>\u003cb>catalyst\u003c/b>\u003cem>명사\u003c/em>\u003cspan>촉매, 자극제\u003c/span>\u003c/div>\u003cdiv>\u003cb>wholly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>전적으로, 완전히\u003c/span>\u003c/div>\u003cdiv>\u003cb>convinced\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>확신하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>amazement\u003c/b>\u003cem>명사\u003c/em>\u003cspan>놀라움\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"주요 단어를 체크해 볼까요? catalyst는 화학에서 촉매라는 뜻인데, 여기서는 어떤 행동을 일으키는 자극제라는 의미로 쓰였어요. 그리고 sit up and take notice는 자세를 고쳐 앉아 주목한다는 아주 생동감 넘치는 표현이죠. cause는 원인이라는 뜻도 있지만, 여기서는 대의라는 중요한 뜻으로 쓰였다는 걸 꼭 기억하세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">great\u003c/b>\u003cspan class=\"m\">위대한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">extraordinary\u003c/span>\u003cspan class=\"s\">remarkable\u003c/span>\u003cspan class=\"s\">outstanding\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ordinary\u003c/span>\u003cspan class=\"a\">mediocre\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">cause\u003c/b>\u003cspan class=\"m\">대의, 명분\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">principle\u003c/span>\u003cspan class=\"s\">ideal\u003c/span>\u003cspan class=\"s\">purpose\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">charismatic\u003c/b>\u003cspan class=\"m\">카리스마 있는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">captivating\u003c/span>\u003cspan class=\"s\">magnetic\u003c/span>\u003cspan class=\"s\">appealing\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">faith\u003c/b>\u003cspan class=\"m\">신념\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">belief\u003c/span>\u003cspan class=\"s\">conviction\u003c/span>\u003cspan class=\"s\">trust\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">doubt\u003c/span>\u003cspan class=\"a\">disbelief\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">wholly\u003c/b>\u003cspan class=\"m\">전적으로\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">completely\u003c/span>\u003cspan class=\"s\">entirely\u003c/span>\u003cspan class=\"s\">fully\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">partially\u003c/span>\u003cspan class=\"a\">slightly\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어도 정리해 봅시다. faith는 belief나 conviction과 같은 뜻으로 쓰였고, 전적으로를 뜻하는 wholly는 completely로 바꿔 쓸 수 있어요. 반대로 위대한을 뜻하는 great의 반대말은 평범한이라는 뜻의 ordinary나 mediocre가 되겠습니다. 이 단어들은 시험에 자주 나오니 꼭 챙겨두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">돌아보자\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Let's \u003c/span>\u003cspan class=\"tgt\">look \u003c/span>\u003cspan class=\"tgt\">back \u003c/span>\u003cspan class=\"tgt\">at\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유명한 사람들을\u003c/span>\u003cspan class=\"en\">famous individuals\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">역사상\u003c/span>\u003cspan class=\"en\">in history.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">역사상 유명한 사람들을 돌아보자.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글의 도입부로, \u003cb class=\"key\">역사적 \u003c/b>\u003cb class=\"key\">인물\u003c/b>들의 사례를 통해 지도력에 관한 통념을 점검해 보자는 제안을 합니다. 독자의 \u003cb class=\"key\">관심을 \u003c/b>\u003cb class=\"key\">유도\u003c/b>하여 앞으로 전개될 리더십의 본질에 대한 논의를 시작하는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">Let's + 동사원형\u003c/span> : Let's [청유] + look back at [동사원형/구동사] : \"~를 돌아보자\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Let's look back at, 돌아보자. famous individuals, 유명한 사람들을. in history, 역사상. 이 문장 전체를 해석하면, 역사상 유명한 사람들을 돌아보자.","hl":"m"},{"n":13,"text":"여러분, 역사 속 인물들을 예로 들어 이야기를 시작하죠. 이 문장은 역사적 인물들을 살펴보며 지도력에 대한 우리의 관심을 유도하는 도입부 역할을 합니다.","hl":"mn"},{"n":14,"text":"첫 번째 문법 포인트를 보면 Let's 뒤에 동사원형 look이 왔죠. 상대방에게 함께 무언가를 하자고 제안하는 제안의 표현입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘아무개는 ~라는 식의 발언이\u003c/span>\u003cspan class=\"en\">Statements like &quot;So and so\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">될 운명으로 태어났다’는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">born \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">위대한 지도자가\u003c/span>\u003cspan class=\"en\">a great leader&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자주 나온다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">often \u003c/span>\u003cspan class=\"tgt\">made\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">‘아무개는 위대한 지도자가 될 운명으로 태어났다’는 식의 발언이 자주 나온다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 지도자는 타고나는 것이라는 흔한 \u003cb class=\"key\">운명론적 \u003c/b>\u003cb class=\"key\">시각\u003c/b>을 소개합니다. 많은 사람이 믿고 있는 \u003cb class=\"key\">고정관념\u003c/b>을 먼저 제시하여, 나중에 나올 필자의 주장과 대조를 이루게 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be born to-v\u003c/span> : be born [동사구] + to be [to부정사] : \"~가 될 운명으로 태어났다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태 (be + p.p.)\u003c/span> : Statements [주어] + are [be동사] + made [과거분사] : \"자주 나온다(만들어진다)\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Statements like \"So and so, ‘아무개는 ~라는 식의 발언이. was born to be, 될 운명으로 태어났다’는. a great leader\", 위대한 지도자가. are often made, 자주 나온다.. 이 문장 전체를 해석하면, ‘아무개는 위대한 지도자가 될 운명으로 태어났다’는 식의 발언이 자주 나온다.","hl":"m"},{"n":16,"text":"지도자는 타고나는 것이라는 흔한 믿음을 소개하고 있어요. 리더십에 대한 사람들의 운명론적 시각이나 대중적인 고정관념을 보여주는 문장입니다.","hl":"mn"},{"n":17,"text":"첫 번째 포인트로 주어인 Statements가 직접 만드는 것이 아니라 사람들에 의해 만들어지는 것이죠. 그래서 be동사와 과거분사를 결합한 수동태를 썼습니다. 두 번째로 be born 뒤에 to부정사가 오면 숙어처럼 쓰여요. 특정한 소명을 가지고 태어났다는 관용적 표현입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">글쎄,\u003c/span>\u003cspan class=\"en\">Well,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 말은\u003c/span>\u003cspan class=\"en\">those words\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">종종 ~은 아니다\u003c/span>\u003cspan class=\"en\">are often not\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사실인 것만큼\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">true \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">들리는 것만큼.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">as\u003c/span> they \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">sound\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">글쎄, 그 말은 종종 들리는 것만큼 사실은 아니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 언급한 통념이 \u003cb class=\"key\">사실이 \u003c/b>\u003cb class=\"key\">아님\u003c/b>을 명확히 밝히며 글의 흐름을 전환합니다. 리더십은 타고난 운명보다 \u003cb class=\"key\">다른 \u003c/b>\u003cb class=\"key\">요인\u003c/b>에 의해 결정된다는 주제를 암시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">원급 비교\u003c/span> : as [부사] + true [형용사] + as [접속사] : \"~만큼 사실인\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">감각동사\u003c/span> : they [주어] + sound [감각동사] + (true) [보어/생략] : \"들리다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Well, 글쎄. those words, 그 말은. are often not, 종종 ~은 아니다. as true, 사실인 것만큼. as they sound, 들리는 것만큼.. 이 문장 전체를 해석하면, 글쎄, 그 말은 종종 들리는 것만큼 사실은 아니다.","hl":"m"},{"n":19,"text":"앞서 말한 통념이 사실이 아닐 수도 있다는 반전을 줍니다. 고정관념이 사실이 아님을 짚어주며 독자에게 다른 요인이 중요할 수 있다는 단서를 제공하죠.","hl":"mn"},{"n":20,"text":"첫 번째로 as와 as 사이에 형용사가 들어갔네요. 두 대상을 비교해서 정도가 같음을 나타내는 원급 비교 구문입니다. 두 번째 포인트인 sound는 감각을 나타내는 동사예요. 뒤에 부사가 아닌 true 같은 형용사가 와서 주어의 상태를 설명하는 형용사 보어 역할을 하게 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">누구나\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Anyone\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">언제 어디서나\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">any \u003c/span>\u003cspan class=\"tgt\">time \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">any \u003c/span>\u003cspan class=\"tgt\">place\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지도자가 될 수 있다.\u003c/span>\u003cspan class=\"en\">can become a leader.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">언제 어디서나 누구나 지도자가 될 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 리더십이 특정 소수의 전유물이 아니라, 모든 사람에게 열려 있는 \u003cb class=\"key\">보편적 \u003c/b>\u003cb class=\"key\">가능성\u003c/b>임을 선언하는 문장입니다. 리더의 탄생에는 시간이나 장소 같은 \u003cb class=\"key\">환경적 \u003c/b>\u003cb class=\"key\">제약\u003c/b>이 중요하지 않다는 점을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정대명사 주어\u003c/span> : Anyone [주어] + (수식어구) + can become [동사] : \"누구나\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">병렬 구조\u003c/span> : at any time [전치사구1] + and [연결어] + in any place [전치사구2] : \"언제 어디서나\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Anyone, 누구나. at any time and in any place, 언제 어디서나. can become a leader, 지도자가 될 수 있다.. 이 문장 전체를 해석하면, 언제 어디서나 누구나 지도자가 될 수 있다.","hl":"m"},{"n":22,"text":"누구나 리더가 될 수 있다는 희망적인 메시지를 던지고 있어요. 시간과 장소라는 환경적 제약보다 개인의 보편적 가능성을 더 중요하게 본 것이죠.","hl":"mn"},{"n":23,"text":"첫 번째로 Anyone이라는 단어는 긍정문에서 어떠한 누구라도라는 뜻의 강조를 담고 있어요. 두 번째로 and를 중심으로 시간과 장소를 나타내는 두 개의 전치사구가 나란히 연결된 병렬 구조도 눈여겨보세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 ~일 수 있다\u003c/span>\u003cspan class=\"en\">They can be\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">너무나 카리스마가 있어서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">so \u003c/span>\u003cspan class=\"tgt\">charismatic \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전 세계가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> the entire world\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">주목할 것이다.\u003c/span>\u003cspan class=\"en\">will \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">sit \u003c/span>\u003cspan class=\"tgt\">up \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">take \u003c/span>\u003cspan class=\"tgt\">notice\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 너무나 카리스마가 있어서 전 세계가 주목할 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 리더가 가진 강렬한 \u003cb class=\"key\">매력과 \u003c/b>\u003cb class=\"key\">영향력\u003c/b>을 설명하며, 그 결과가 전 세계적인 \u003cb class=\"key\">관심\u003c/b>으로 이어진다는 인과관계를 나타냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">so ~ that 구문\u003c/span> : so [부사] + charismatic [형용사] + that [접속사] + 절 : \"너무 카리스마가 있어서 ~하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관용 표현\u003c/span> : sit up [동사1] + and [연결어] + take notice [동사2] : \"주목하다, 비상한 관심을 보이다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"They can be, 그들은 ~일 수 있다. so charismatic, 너무나 카리스마가 있어서. that the entire world, 전 세계가. will sit up and take notice, 주목할 것이다.. 이 문장 전체를 해석하면, 그들은 너무나 카리스마가 있어서 전 세계가 주목할 것이다.","hl":"m"},{"n":25,"text":"리더가 내뿜는 카리스마가 얼마나 강력한지를 보여주는 문장이에요. 그 영향력이 너무 커서 결국 전 세계 사람들이 관심을 갖게 된다는 결과를 보여주죠.","hl":"mn"},{"n":26,"text":"첫 번째 핵심은 so와 that 사이에 형용사를 써서 너무 뭐뭐해서 그 결과 어떠하다라고 해석하는 원인과 결과 구문이에요. 두 번째로 sit up and take notice는 아주 중요하게 다루거나 주목한다는 뜻의 멋진 관용구입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것을 이해하기 위해서는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">To \u003c/span>\u003cspan class=\"tgt\">understand \u003c/span>\u003cspan class=\"tgt\">this\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">먼저 알아야 한다\u003c/span>\u003cspan class=\"en\">one must first know\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기본적인 진리를\u003c/span>\u003cspan class=\"en\">the basic truth\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무엇이 사람을 위대하게 만드는가에 대한.\u003c/span>\u003cspan class=\"en\">about \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">makes \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">great\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것을 이해하기 위해서는 먼저 무엇이 사람을 위대하게 만드는가에 대한 기본적인 진리를 알아야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞선 내용에 대한 의문을 해소하기 위해, 위대함의 \u003cb class=\"key\">본질적인 \u003c/b>\u003cb class=\"key\">원동력\u003c/b>이 무엇인지 파헤쳐야 한다는 \u003cb class=\"key\">논리적 \u003c/b>\u003cb class=\"key\">전개\u003c/b>를 시작하는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법\u003c/span> : To [to부정사] + understand [동사원형] : \"이것을 이해하기 위해서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">간접의문문/명사절\u003c/span> : what [의문사/주어] + makes [동사] + people [목적어] + great [목적보어] : \"무엇이 사람을 위대하게 만드는가\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"To understand this, 이것을 이해하기 위해서는. one must first know, 먼저 알아야 한다. the basic truth, 기본적인 진리를. about what makes people great, 무엇이 사람을 위대하게 만드는가에 대한.. 이 문장 전체를 해석하면, 이것을 이해하기 위해서는 먼저 무엇이 사람을 위대하게 만드는가에 대한 기본적인 진리를 알아야 한다.","hl":"m"},{"n":28,"text":"누구나 리더가 될 수 있다는 사실을 제대로 이해하려면, 먼저 위대함의 뿌리가 무엇인지 알아야 한다고 말하며 주제를 던지고 있어요.","hl":"mn"},{"n":29,"text":"첫 번째로 문장 맨 앞의 To understand는 이해하기 위해서라는 목적을 나타내는 부사적 용법이에요. 두 번째로 what으로 시작하는 부분은 전치사 about 뒤에서 명사 역할을 하며, 특히 great라는 형용사를 사용해 목적보어를 완성한 오형식 문장이라는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 진리는\u003c/span>\u003cspan class=\"en\">That truth is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들이 만들지는 않는다는 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">스스로를 위대하게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">themselves \u003c/span>\u003cspan class=\"tgt\">great\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 진리는 사람들이 스스로를 위대하게 만들지는 않는다는 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 위대함은 개인의 타고난 재능이나 노력만으로 생기는 것이 아니라는 \u003cb class=\"key\">기본적인 \u003c/b>\u003cb class=\"key\">진실\u003c/b>을 말합니다. 위대함의 근원이 개인의 내면보다는 \u003cb class=\"key\">외부적인 \u003c/b>\u003cb class=\"key\">요인\u003c/b>에 있을 수 있음을 암시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that (명사절 보어)\u003c/span> : be동사 (is) + [that + 주어 + 동사 (보어절)] : \"사람들이 스스로를 위대하게 만들지는 않는다는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">재귀대명사의 재귀 용법\u003c/span> : make [동사] + [themselves (목적어)] : \"스스로를\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"That truth is, 그 진리는. that people don't make, 사람들이 만들지는 않는다는 것이다. themselves great, 스스로를 위대하게. 이 문장 전체를 해석하면, 그 진리는 사람들이 스스로를 위대하게 만들지는 않는다는 것이다.","hl":"m"},{"n":31,"text":"이 문장은 리더의 위대함이 어디서 오는지에 대한 통찰을 줍니다. 위대함이란 자기 혼자만의 힘으로 성취하는 것이 아니라는 기본적인 진실을 강조하고 있죠.","hl":"mn"},{"n":32,"text":"첫 번째로 동사 is 뒤에 나온 that은 문장에서 보어 역할을 하는 명사절 접속사예요. 두 번째로 목적어 자리에 쓰인 themselves는 주어인 people을 다시 가리키는 재귀대명사입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그렇다면 무엇이\u003c/span>\u003cspan class=\"en\">Then \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들을 위대하게 만드는가?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">makes \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">great\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그렇다면 무엇이 사람들을 위대하게 만드는가?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 부정했던 내용을 바탕으로, 진정한 위대함을 만드는 \u003cb class=\"key\">진짜 \u003c/b>\u003cb class=\"key\">요인\u003c/b>에 대해 질문을 던집니다. 독자의 궁금증을 유발하며 글의 \u003cb class=\"key\">논점\u003c/b>을 전환하는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문 대명사 주어\u003c/span> : what [주어/의문사] + [makes (동사)] : \"무엇이 만드는가\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">5형식 문형 (사역/상태 변화)\u003c/span> : make [동사] + [people (목적어)] + [great (목적격 보어)] : \"사람들을 위대하게 만들다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"Then what, 그렇다면 무엇이. makes people great?, 사람들을 위대하게 만드는가?. 이 문장 전체를 해석하면, 그렇다면 무엇이 사람들을 위대하게 만드는가?","hl":"m"},{"n":34,"text":"앞에서 사람들이 스스로를 위대하게 만드는 게 아니라고 했으니, 그럼 대체 무엇이 그런 변화를 일으키는지 진짜 요인을 묻고 있어요. 글의 흐름을 핵심 답변으로 연결해주는 질문이죠.","hl":"mn"},{"n":35,"text":"첫 번째로 what은 무엇이라는 뜻의 의문사이면서 동시에 이 문장의 주어 역할을 하고 있어요. 두 번째로 make는 목적어와 목적격 보어를 가지는 오형식 동사로 쓰여서 사람들의 상태를 설명해 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은\u003c/span>\u003cspan class=\"en\">It is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대의이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">cause \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 믿는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">believe \u003c/span>\u003cspan class=\"tgt\">in\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것 은 그들이 믿는 대의이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞선 질문에 대한 핵심적인 답변으로, 위대함의 원천은 개인의 자질이 아니라 그들이 헌신하는 \u003cb class=\"key\">대의명분\u003c/b>임을 밝힙니다. 리더를 만드는 것은 결국 그가 가진 \u003cb class=\"key\">신념\u003c/b>이라는 뜻입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 생략\u003c/span> : the cause [선행사] + [(which/that) 생략] + [they believe in (관계사절)] : \"그들이 믿는 대의\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">구동사 (전치사의 목적어)\u003c/span> : believe [동사] + [in (전치사)] : \"~를 믿다, ~의 가치를 믿다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"It is, 그것은. the cause, 대의이다. they believe in, 그들이 믿는. 이 문장 전체를 해석하면, 그것 은 그들이 믿는 대의이다.","hl":"m"},{"n":37,"text":"위대함의 정체는 바로 개인이 가슴에 품은 대의명분이라고 설명합니다. 사람이 대단해서가 아니라 그 사람이 믿는 가치가 그 사람을 위대하게 만든다는 아주 중요한 문장이에요.","hl":"mn"},{"n":38,"text":"첫 번째로 명사인 the cause 뒤에 주어와 동사가 바로 나오면 목적격 관계대명사가 생략된 것으로 보고 뒤에서 앞으로 수식해 주세요. 두 번째로 전치사 in은 무엇의 가치를 믿는지 나타낼 때 꼭 필요한 짝꿍이랍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 사람에게 ~일 때,\u003c/span>\u003cspan class=\"en\">When a person,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">배경이나 환경이 어떻든지 간에,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">no \u003c/span>\u003cspan class=\"tgt\">matter \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">background \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">environment\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">명확한 목표, 믿음, 또는 그들이 원하는 어떤 것이 있을 때,\u003c/span>\u003cspan class=\"en\">has a clear goal, belief, or \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">something \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">want \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 그것을 위해 모든 것을 기꺼이 포기할,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">willing \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">give \u003c/span>\u003cspan class=\"tgt\">up \u003c/span>\u003cspan class=\"tgt\">everything \u003c/span>\u003cspan class=\"tgt\">for\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 신념은 촉매가 될 것이다\u003c/span>\u003cspan class=\"en\">that faith will be the catalyst\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 감정, 힘, 그리고 행동을 위한.\u003c/span>\u003cspan class=\"en\">for their emotions, strength, and actions.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">배경이나 환경이 어떻든지 간에 어떤 사람에게 명확한 목표, 믿음, 또는 그들이 그것을 위해 모든 것을 기꺼이 포기할 원하는 어떤 것이 있을 때, 그 신념은 그의 감정, 힘, 그리고 행동을 위한 촉매가 될 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 리더를 만드는 것은 타고난 환경이 아니라 내면의 \u003cb class=\"key\">확고한 \u003c/b>\u003cb class=\"key\">목표\u003c/b>라는 점을 설명합니다. 모든 것을 걸 수 있는 \u003cb class=\"key\">희생정신\u003c/b>이 담긴 신념이 결국 사람의 행동을 변화시키는 \u003cb class=\"key\">강력한 \u003c/b>\u003cb class=\"key\">동기\u003c/b>가 된다는 맥락입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">no matter를 이용한 양보의 부사구\u003c/span> : no matter + [명사구] : \"배경이나 환경이 어떻든지 간에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관계대명사의 이중 제한(수식)\u003c/span> : [선행사] + (목적격 관계대명사 생략) + [절1] + [관계대명사 절2] : \"그들이 원하는, 모든 것을 기꺼이 포기할 어떤 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">조동사적 관용 표현\u003c/span> : be willing + to [동사원형] : \"기꺼이 ~하려고 하다\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"When a person, 어떤 사람에게 ~일 때. no matter their background or environment, 배경이나 환경이 어떻든지 간에. has a clear goal, belief, or something they want, 명확한 목표, 믿음, 또는 그들이 원하는 어떤 것이 있을 때. that they are willing to give up everything for, 그들이 그것을 위해 모든 것을 기꺼이 포기할. that faith will be the catalyst, 그 신념은 촉매가 될 것이다. for their emotions, strength, and actions, 그의 감정, 힘, 그리고 행동을 위한.. 이 문장 전체를 해석하면, 배경이나 환경이 어떻든지 간에 어떤 사람에게 명확한 목표, 믿음, 또는 그들이 그것을 위해 모든 것을 기꺼이 포기할 원하는 어떤 것이 있을 때, 그 신념은 그의 감정, 힘, 그리고 행동을 위한 촉매가 될 것이다.","hl":"m"},{"n":40,"text":"리더가 되는 것은 타고난 배경이 아니라 그 사람이 가진 강력한 신념에 달려 있다는 뜻이에요. 모든 것을 포기할 만큼 간절한 목표가 있을 때 비로소 내면의 힘이 밖으로 표출된다는 핵심적인 문장입니다.","hl":"mn"},{"n":41,"text":"첫 번째로 문장 중간에 삽입된 no matter their background or environment는 배경이나 환경에 상관없다는 양보의 의미를 나타내요. 두 번째로 something 뒤에는 목적격 관계대명사가 생략된 they want와 that 이하의 두 가지 관계사절이 연달아 나와서 무언가를 구체적으로 설명하고 있어요. 마지막 세 번째로 be willing to는 기꺼이 무엇을 하려 한다는 뜻으로 강한 의지를 나타내는 중요한 표현이랍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">누군가가\u003c/span>\u003cspan class=\"en\">When someone\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 것에 대해 전적으로 확신할 때,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">wholly \u003c/span>\u003cspan class=\"tgt\">convinced \u003c/span>\u003cspan class=\"tgt\">of\u003c/span> something,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세상은 놀라서 지켜볼 것이다.\u003c/span>\u003cspan class=\"en\">the world will watch \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">amazement\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">누군가가 어떤 것에 대해 전적으로 확신할 때, 세상은 놀라서 지켜볼 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 개인의 확고한 \u003cb class=\"key\">확신\u003c/b>이 타인과 세상에 미치는 \u003cb class=\"key\">영향력\u003c/b>을 보여줍니다. 내면의 확신이 밖으로 드러날 때 사람들은 그 리더의 모습에 \u003cb class=\"key\">경탄\u003c/b>하며 주목하게 된다는 결론입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">상태를 나타내는 수동태\u003c/span> : be + [과거분사(p.p.)] + of : \"~에 대해 전적으로 확신하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 용법\u003c/span> : in + [추상명사] : \"놀라서, 경탄하며\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"When someone, 누군가가. is wholly convinced of something, 어떤 것에 대해 전적으로 확신할 때. the world will watch in amazement, 세상은 놀라서 지켜볼 것이다.. 이 문장 전체를 해석하면, 누군가가 어떤 것에 대해 전적으로 확신할 때, 세상은 놀라서 지켜볼 것이다.","hl":"m"},{"n":43,"text":"앞선 문장에 대한 결론으로 개인이 내면의 확신을 가졌을 때 비로소 세상이 그를 리더로서 주목하기 시작한다는 의미예요. 확신이 가진 놀라운 힘을 강조하고 있죠.","hl":"mn"},{"n":44,"text":"첫 번째로 is wholly convinced of 표현을 주목하세요. convince가 확신시키다라는 뜻이라서 주어가 확신을 가질 때는 수동태 형태를 쓴답니다. 두 번째로 부사인 wholly가 수동태 사이에서 의미를 강조하고 있고 마지막으로 세 번째 표현인 in amazement는 전치사와 추상명사가 합쳐져서 놀랍게도라는 부사처럼 해석하면 자연스러워요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>위대한 지도자는 타고난 것이라는 \u003cb class=\"key\">통념\u003c/b>은 사실과 다릅니다.\u003c/li>\u003cli>누구나 신념을 가지면 전 세계가 \u003cb class=\"key\">주목\u003c/b>하는 지도자가 될 수 있습니다.\u003c/li>\u003cli>사람을 위대하게 만드는 것은 그들 자신이 아니라 그들이 믿는 \u003cb class=\"key\">대의\u003c/b>입니다.\u003c/li>\u003cli>목표를 위해 모든 것을 바치는 \u003cb class=\"key\">확신\u003c/b>이 행동을 변화시키는 촉매가 됩니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>True greatness and leadership are not innate qualities but results of a firm belief in a meaningful cause.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">위대한 지도자는 \u003cb class=\"key\">타고난 \u003c/b>\u003cb class=\"key\">운명\u003c/b>이 아니라, 모든 것을 바칠 정도로 강력하게 믿는 \u003cb class=\"key\">대의\u003c/b>와 \u003cb class=\"key\">신념\u003c/b>을 통해 만들어집니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":45,"text":"오늘 지문을 통해 위대함의 진짜 정체가 무엇인지 배워봤습니다. 여러분도 여러분만의 명확한 목표와 대의를 찾는다면 누구나 세상을 놀라게 할 지도자가 될 수 있을 거예요. 오늘 배운 catalyst와 cause 같은 핵심 어휘들 잊지 마시고, 다음 시간에 만나요! 수고하셨습니다.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
