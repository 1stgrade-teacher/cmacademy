<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터2 Reading34 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터2 Reading34","audioDir":"reading34_audio","preview":false,"count":42,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.668em\">Reading\u003cbr>34\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터 레벨2\u003c/div>\u003ch1>The Bridge Between Worlds: Why Frogs Still Need Water\u003c/h1>\u003ch2>세계를 잇는 다리: 개구리가 여전히 물을 필요로 하는 이유\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>개구리는 육지로 진출했음에도 불구하고, \u003cb class=\"key\">피부 \u003c/b>\u003cb class=\"key\">호흡\u003c/b>과 \u003cb class=\"key\">수중 \u003c/b>\u003cb class=\"key\">번식\u003c/b>을 위해 물에 의존하며 \u003cb class=\"key\">탈바꿈\u003c/b>을 통해 두 환경 사이의 생존을 이어갑니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Frogs maintain an essential connection to water for respiration and reproduction, utilizing metamorphosis to transition from aquatic young to terrestrial adults.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분! 오늘은 양서류의 대표 주자, 개구리가 어떻게 물과 육지라는 두 세계를 오가며 사는지에 대해 알아볼 거예요. 이번 지문은 개구리의 진화적 배경과 생리적 특징을 설명하고, 마지막에 요지인 탈바꿈의 의미를 정리하는 아주 논리적인 글입니다. 개구리가 육지로 나왔음에도 왜 물을 떠나지 못하는지 그 이유를 중심으로 함께 살펴봅시다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">개구리는 \u003cb class=\"key\">양서류\u003c/b>(Amphibian)에 속하는데, 이 명칭은 그리스어로 '양쪽(amphi)'에서 '사는 것(bios)'을 의미합니다. 진화 과정에서 물 밖으로 나온 \u003cb class=\"key\">사지동물\u003c/b>(Tetrapod)의 후손이지만, 개구리는 완전히 독립하지 못한 \u003cb class=\"key\">반수생\u003c/b> 생물입니다. 이는 마치 배터리 효율이 낮아 주기적으로 \u003cb class=\"key\">충전기\u003c/b>(물)를 찾아가야 하는 스마트폰과 비슷한 처지라고 볼 수 있습니다. 이러한 생리적 특성 때문에 이들은 물과 육지라는 \u003cb class=\"key\">이중적인 \u003c/b>\u003cb class=\"key\">환경\u003c/b>에 적응하는 독특한 생존 전략을 가지게 되었습니다.\u003c/div>","segs":[{"n":2,"text":"여러분, 양서류를 뜻하는 영어 단어 Amphibian은 두 가지 삶을 산다는 뜻을 가지고 있어요. 개구리는 아주 오래전 물고기 같은 조상에서 진화해 육지로 올라왔지만, 여전히 몸의 일부는 물에 묶여 있는 독특한 동물이죠. 마치 물 밖으로 나온 탐험가 같지만, 생존을 위해 주기적으로 수분을 충전해야 하는 특성을 가지고 있습니다. 이런 배경지식을 가지고 지문을 보면 개구리의 행동이 더 잘 이해될 거예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>진화적 배경\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>개구리의 조상이 \u003cb class=\"key\">수중 \u003c/b>\u003cb class=\"key\">동물\u003c/b>이었음을 밝히고, 육지로 진출하여 얻은 \u003cb class=\"key\">생태적 \u003c/b>\u003cb class=\"key\">이점\u003c/b>을 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>호흡의 제약\u003csmall>근거 · 문장 3–7\u003c/small>\u003c/h4>\u003cp>개구리의 약한 폐 기능과 이를 보완하기 위한 \u003cb class=\"key\">피부 \u003c/b>\u003cb class=\"key\">호흡\u003c/b>의 필요성, 그리고 이를 위해 \u003cb class=\"key\">수분\u003c/b>이 필수적임을 강조합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>번식의 제약\u003csmall>근거 · 문장 8–9\u003c/small>\u003c/h4>\u003cp>조상처럼 \u003cb class=\"key\">물속에 \u003c/b>\u003cb class=\"key\">산란\u003c/b>해야 하며, 어린 유생이 살아남기 위해 \u003cb class=\"key\">수중 \u003c/b>\u003cb class=\"key\">생물\u003c/b>로 발달해야 함을 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>탈바꿈의 역할\u003csmall>결론 · 문장 10\u003c/small>\u003c/h4>\u003cp>\u003cb class=\"key\">탈바꿈\u003c/b>이 수중 생활을 하는 어린 시절과 육지 생활을 하는 성체를 이어주는 \u003cb class=\"key\">다리\u003c/b> 역할을 한다는 핵심을 제시합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 과거의 조상 이야기에서 시작해 현재 개구리가 겪는 생리적 제약들을 거쳐 마지막 결론으로 이어집니다.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서는 개구리의 뿌리가 물속 동물이었음을 언급하며, 육지에서 먹이와 거처를 구하기 위해 진출했다는 역사적 사실을 보여줍니다.","hl":"f0"},{"n":5,"text":"세 번째 문장부터 일곱 번째 문장까지는 개구리가 육지에 살면서도 왜 물가에 머물러야 하는지 설명해요. 폐가 약해서 피부를 통해 산소를 얻어야 하는데, 이 피부 호흡이 가능하려면 피부가 항상 촉촉해야 하기 때문이죠. 그래서 이따금 물에 몸을 담가 건조함을 막는 것입니다.","hl":"f1"},{"n":6,"text":"여덟 번째와 아홉 번째 문장에서는 또 다른 이유인 번식을 다룹니다. 개구리는 조상들처럼 알을 물속에 낳아야 하고, 그 알에서 깨어난 새끼들이 물속 생물로 자라나야만 생존할 수 있다는 점을 짚어줍니다.","hl":"f2"},{"n":7,"text":"마지막 열 번째 문장은 이 글의 결론입니다. 물에 사는 어린 시절과 육지에 사는 성체 사이를 이어주는 다리가 바로 탈바꿈, 즉 metamorphosis라는 점을 강조하며 마무리합니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">인과\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 10번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">개구리가 육지에 살면서도 여전히 \u003cb class=\"key\">물과의 \u003c/b>\u003cb class=\"key\">연관성\u003c/b>을 가질 수밖에 없는 생리적·번식적 이유들을 먼저 제시합니다. 이후 이러한 제약 조건을 해결해 주는 생물학적 기제인 \u003cb class=\"key\">탈바꿈\u003c/b>을 최종 결론으로 제시하여 \u003cb class=\"key\">글의 \u003c/b>\u003cb class=\"key\">완성도\u003c/b>를 높입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>But (3)\u003c/b>\u003cspan>전환: 육지 진출 뒤에도 남은 제약\u003c/span>\u003cb>And so (6)\u003c/b>\u003cspan>인과: 피부 호흡을 위해 물가에 거주\u003c/span>\u003cb>also (8)\u003c/b>\u003cspan>추가: 호흡 외에 번식의 측면 제시\u003c/span>\u003cb>thus (10)\u003c/b>\u003cspan>결론: 탈바꿈의 의의 정리\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">water-dwelling, fishlike animals\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">ties to the water\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">water creatures\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">water-dwelling young forms\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 전형적인 인과 관계를 따르는 미괄식 구조입니다. 개구리가 물을 떠날 수 없는 여러 가지 이유를 먼저 나열한 뒤, 마지막에 탈바꿈이라는 개념으로 모든 내용을 하나로 묶어 정리하고 있어요.","hl":"ty"},{"n":9,"text":"문장 곳곳에 단서가 숨어 있어요. 다섯 번째 문장의 But은 호흡을 위한 조건을 제시하고, 여섯 번째 문장의 And so는 그로 인한 거주지의 제한을 보여줍니다. 특히 마지막 문장의 thus는 지금까지 설명한 모든 내용을 결론으로 이끄는 아주 중요한 신호어입니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>ancestor\u003c/b>\u003cem>명사\u003c/em>\u003cspan>조상\u003c/span>\u003c/div>\u003cdiv>\u003cb>water-dwelling\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>물에 사는\u003c/span>\u003c/div>\u003cdiv>\u003cb>fishlike\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>물고기 같은\u003c/span>\u003c/div>\u003cdiv>\u003cb>relative\u003c/b>\u003cem>명사\u003c/em>\u003cspan>동족, 친척\u003c/span>\u003c/div>\u003cdiv>\u003cb>gain\u003c/b>\u003cem>동사\u003c/em>\u003cspan>얻다\u003c/span>\u003c/div>\u003cdiv>\u003cb>ability\u003c/b>\u003cem>명사\u003c/em>\u003cspan>능력\u003c/span>\u003c/div>\u003cdiv>\u003cb>opportunity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기회\u003c/span>\u003c/div>\u003cdiv>\u003cb>shelter\u003c/b>\u003cem>명사\u003c/em>\u003cspan>거처, 은신처\u003c/span>\u003c/div>\u003cdiv>\u003cb>tie\u003c/b>\u003cem>명사\u003c/em>\u003cspan>연관성, 유대\u003c/span>\u003c/div>\u003cdiv>\u003cb>lung\u003c/b>\u003cem>명사\u003c/em>\u003cspan>폐\u003c/span>\u003c/div>\u003cdiv>\u003cb>oxygen\u003c/b>\u003cem>명사\u003c/em>\u003cspan>산소\u003c/span>\u003c/div>\u003cdiv>\u003cb>breathing\u003c/b>\u003cem>명사\u003c/em>\u003cspan>호흡\u003c/span>\u003c/div>\u003cdiv>\u003cb>skin\u003c/b>\u003cem>명사\u003c/em>\u003cspan>피부\u003c/span>\u003c/div>\u003cdiv>\u003cb>properly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>제대로, 적절히\u003c/span>\u003c/div>\u003cdiv>\u003cb>moist\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>촉촉한, 습기 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>remain\u003c/b>\u003cem>동사\u003c/em>\u003cspan>남아 있다, 머무르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>take a dip\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>물을 잠깐 담그다\u003c/span>\u003c/div>\u003cdiv>\u003cb>every now and then\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>때때로, 이따금\u003c/span>\u003c/div>\u003cdiv>\u003cb>keep from ~ing\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~하는 것을 막다\u003c/span>\u003c/div>\u003cdiv>\u003cb>drying out\u003c/b>\u003cem>명사\u003c/em>\u003cspan>건조해짐\u003c/span>\u003c/div>\u003cdiv>\u003cb>lay\u003c/b>\u003cem>동사\u003c/em>\u003cspan>낳다\u003c/span>\u003c/div>\u003cdiv>\u003cb>develop\u003c/b>\u003cem>동사\u003c/em>\u003cspan>발달하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>survive\u003c/b>\u003cem>동사\u003c/em>\u003cspan>살아남다\u003c/span>\u003c/div>\u003cdiv>\u003cb>metamorphosis\u003c/b>\u003cem>명사\u003c/em>\u003cspan>탈바꿈, 변태\u003c/span>\u003c/div>\u003cdiv>\u003cb>bridge\u003c/b>\u003cem>명사\u003c/em>\u003cspan>다리, 가교\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"중요한 단어들을 살펴볼까요? 피부가 축축해야 한다는 뜻의 moist와, 산소를 얻는 과정인 breathing은 개구리의 생존에 필수적입니다. 그리고 가장 핵심적인 단어인 metamorphosis, 즉 탈바꿈은 이 지문의 주제를 관통하는 용어이니 반드시 외워두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">ancestor\u003c/b>\u003cspan class=\"m\">조상\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">predecessor\u003c/span>\u003cspan class=\"s\">forefather\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">descendant\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">properly\u003c/b>\u003cspan class=\"m\">제대로\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">appropriately\u003c/span>\u003cspan class=\"s\">correctly\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">improperly\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">moist\u003c/b>\u003cspan class=\"m\">촉촉한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">damp\u003c/span>\u003cspan class=\"s\">humid\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">dry\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">survive\u003c/b>\u003cspan class=\"m\">살아남다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">endure\u003c/span>\u003cspan class=\"s\">persist\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">perish\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">metamorphosis\u003c/b>\u003cspan class=\"m\">탈바꿈\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">transformation\u003c/span>\u003cspan class=\"s\">mutation\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어 공부도 해볼까요? ancestor의 반대말인 descendant, 즉 후손이라는 단어는 시험에 단골로 등장합니다. moist와 비슷한 뜻으로는 damp나 humid가 있고, survive와 반대되는 perish라는 단어도 함께 기억하면 독해 실력이 쑥쑥 늘 거예요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">과학자들은 믿는다\u003c/span>\u003cspan class=\"en\">Scientists believe\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">개구리의 조상이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that\u003c/span> frogs' ancestors\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">물에 사는, 물고기 같은 동물이었다고.\u003c/span>\u003cspan class=\"en\">were \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">water-dwelling\u003c/span>, fishlike animals.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">과학자들은 개구리의 조상이 물에 사는, 물고기 같은 동물이었다고 믿는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 개구리의 기원을 설명하며, 원래는 육지가 아닌 \u003cb class=\"key\">수중 \u003c/b>\u003cb class=\"key\">생물\u003c/b>이었음을 명시하여 글의 논의를 시작합니다. \u003cb class=\"key\">진화론적 \u003c/b>\u003cb class=\"key\">관점\u003c/b>에서 개구리의 조상이 물고기와 유사했음을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that (명사절)\u003c/span> : believe [타동사] + that [접속사] + S + V [목적어 절] : \"~라고 / ~라는 점을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">합성 형용사\u003c/span> : 명사-현재분사 [형용사 역할] : \"물에 거주하는 (물에 사는)\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Scientists believe, 과학자들은 믿는다. that frogs' ancestors, 개구리의 조상이. were water-dwelling, fishlike animals, 물에 사는, 물고기 같은 동물이었다고.. 이 문장 전체를 해석하면, 과학자들은 개구리의 조상이 물에 사는, 물고기 같은 동물이었다고 믿는다.","hl":"m"},{"n":13,"text":"이 문장은 개구리의 뿌리가 어디인지 알려주는 도입부예요. 과학자들은 개구리의 조상이 원래는 우리처럼 육지 동물이 아니라 물속에서 살던 수중 생물이었다고 보고 있죠.","hl":"mn"},{"n":14,"text":"첫 번째 포인트는 접속사 that이에요. 믿는 내용 전체를 하나의 덩어리로 묶어서 believe의 목적어 역할을 하게 해 주죠. 두 번째는 water-dwelling이라는 표현인데요. 명사와 분사를 연결해서 물에 사는이라는 뜻의 형용사처럼 사용되어 뒤에 나오는 동물을 꾸며주고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">최초의 개구리와 그들의 동족은\u003c/span>\u003cspan class=\"en\">The first frogs and their relatives\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">능력을 얻었다\u003c/span>\u003cspan class=\"en\">gained the ability\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">육지로 나와\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">come \u003c/span>\u003cspan class=\"tgt\">out\u003c/span> onto land\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기회를 누릴 수 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">enjoy\u003c/span> the opportunities\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그곳에서 먹이와 거처에 대한.\u003c/span>\u003cspan class=\"en\">for food and shelter there.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">최초의 개구리와 그들의 동족은 육지로 나와 그곳에서 먹이와 거처에 대한 기회를 누릴 수 있는 능력을 얻었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 개구리가 수중 생물에서 \u003cb class=\"key\">육상 \u003c/b>\u003cb class=\"key\">생물\u003c/b>로 진화하며 얻게 된 \u003cb class=\"key\">이점\u003c/b>을 설명합니다. 육지에서의 생존을 가능하게 한 \u003cb class=\"key\">능력의 \u003c/b>\u003cb class=\"key\">획득\u003c/b>을 핵심으로 다룹니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : the ability [명사] + to-v [형용사구] : \"나올 수 있는 (나오는)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">병렬 구조\u003c/span> : to [come out] and [(to) enjoy] : \"그리고 누릴 수 있는\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"The first frogs and their relatives, 최초의 개구리와 그들의 동족은. gained the ability, 능력을 얻었다. to come out onto land, 육지로 나와. and enjoy the opportunities, 기회를 누릴 수 있는. for food and shelter there, 그곳에서 먹이와 거처에 대한.. 이 문장 전체를 해석하면, 최초의 개구리와 그들의 동족은 육지로 나와 그곳에서 먹이와 거처에 대한 기회를 누릴 수 있는 능력을 얻었다.","hl":"m"},{"n":16,"text":"이제 개구리가 물 밖으로 나오기 시작한 시점을 설명해요. 육지로 진출하면서 먹을 것도 많아지고 안전한 집도 찾을 수 있게 된 건데, 생존을 위한 아주 큰 변화였다고 할 수 있죠.","hl":"mn"},{"n":17,"text":"첫 번째로 볼 문법은 to come out이에요. 앞에 있는 명사인 ability를 꾸며주는 형용사적 용법으로 쓰여서 육지로 나오는 능력이라고 해석합니다. 두 번째는 and 뒤에 나오는 enjoy예요. 이 단어는 앞에 나온 come out과 짝을 이루어 둘 다 능력을 수식하고 있어요. 그래서 누릴 수 있는 능력이라고 자연스럽게 연결되는 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만\u003c/span>\u003cspan class=\"en\">But\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 여전히 유지했다\u003c/span>\u003cspan class=\"en\">they still \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">kept\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러 인연을\u003c/span>\u003cspan class=\"en\">many \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">ties \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">물과의.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to\u003c/span> the water.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 그들은 여전히 물과의 여러 인연을 유지했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 육지로 진출했음에도 불구하고 물을 완전히 떠날 수 없는 개구리의 \u003cb class=\"key\">이중적 \u003c/b>\u003cb class=\"key\">특성\u003c/b>을 시사합니다. 이후 문장에서 나올 물에 대한 \u003cb class=\"key\">의존성\u003c/b>을 예고하는 복선 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거 시대 동사\u003c/span> : S + kept [과거동사] + O : \"유지했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명사와 전치사의 호응\u003c/span> : ties [명사] + to [전치사] + 명사 : \"~와의 유대/관계/인연\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"But, 하지만. they still kept, 그들은 여전히 유지했다. many ties, 여러 인연을. to the water, 물과의.. 이 문장 전체를 해석하면, 하지만 그들은 여전히 물과의 여러 인연을 유지했다.","hl":"m"},{"n":19,"text":"방금 전 문장에서 육지로 나왔다고 했지만, 그렇다고 물을 완전히 버린 건 아니었어요. 개구리는 여전히 물에 꼭 붙어 있어야만 하는 이유가 있었다는 걸 보여주는 반전 문장입니다.","hl":"mn"},{"n":20,"text":"여기서 동사 kept는 개구리가 과거부터 쭉 유지해온 사실을 말하기 위해 과거형으로 쓰였어요. 그리고 ties to라는 표현을 꼭 기억하세요. 명사 tie가 누구와의 관계나 인연을 뜻할 때는 전치사 to를 사용해서 그 대상을 뒤에 연결해 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">개구리의 폐는\u003c/span>\u003cspan class=\"en\">A frog's lungs\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 그다지 잘 기능하지 않고,\u003c/span>\u003cspan class=\"en\">do not work very well,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 그것은 얻는다\u003c/span>\u003cspan class=\"en\">and they get\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 산소를 일부\u003c/span>\u003cspan class=\"en\">part of their oxygen\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 피부를 통해 호흡함으로써.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">breathing\u003c/span> through their skin.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">개구리의 폐는 그다지 잘 기능하지 않고, 그것(개구리)은 피부를 통해 호흡함으로써 산소를 일부 얻는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 개구리의 폐가 불완전하여 부족한 산소를 \u003cb class=\"key\">피부 \u003c/b>\u003cb class=\"key\">호흡\u003c/b>을 통해 보충한다는 신체적 특징을 설명합니다. 생존을 위해 보조적인 \u003cb class=\"key\">호흡 \u003c/b>\u003cb class=\"key\">방식\u003c/b>을 채택하고 있음을 보여주는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">\u003c/span> : by + [동명사] : \"호흡함으로써\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"A frog's lungs, 개구리의 폐는.  do not work very well,  그다지 잘 기능하지 않고.  and they get,  그것은 얻는다.  part of their oxygen,  산소를 일부.  by breathing through their skin,  피부를 통해 호흡함으로써.. 이 문장 전체를 해석하면, 개구리의 폐는 그다지 잘 기능하지 않고, 그것(개구리)은 피부를 통해 호흡함으로써 산소를 일부 얻는다.","hl":"m"},{"n":22,"text":"개구리는 육지에 살지만 폐가 발달하지 않았어요. 그래서 부족한 산소를 채우기 위해 피부로 숨을 쉬는 아주 특별한 보충 방법을 사용한다는 내용입니다.","hl":"mn"},{"n":23,"text":"문장에서 by breathing 부분을 주목해 보세요. 전치사 by 뒤에 동명사를 써서 숨을 쉬는 행위가 산소를 얻는 수단임을 나타내고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 이런 종류의 ‘호흡’이\u003c/span>\u003cspan class=\"en\">But \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">kind \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">&quot;breathing&quot; \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 제대로 이뤄지기 위해서는,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">work\u003c/span> properly,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 개구리의 피부가\u003c/span>\u003cspan class=\"en\">the frog's skin\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 촉촉하게 유지되어야 한다.\u003c/span>\u003cspan class=\"en\">must \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">stay \u003c/span>\u003cspan class=\"tgt\">moist\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 이런 종류의 ‘호흡’이 제대로 이뤄지기 위해서는, 개구리의 피부가 촉촉하게 유지되어야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 언급한 피부 호흡이 가능하기 위한 필수적인 \u003cb class=\"key\">신체 \u003c/b>\u003cb class=\"key\">조건\u003c/b>을 제시합니다. 피부가 반드시 \u003cb class=\"key\">습기\u003c/b>가 있어야만 산소 흡수가 가능하다는 원리를 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">\u003c/span> : for + [명사(의미상 주어)] + [to부정사] : \"이런 종류의 호흡이 제대로 이뤄지기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">\u003c/span> : stay [상태 유지 동사] + [형용사 (보어)] : \"촉촉하게 유지되다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"But for this kind of \"breathing\", 하지만 이런 종류의 ‘호흡’이.  to work properly,  제대로 이뤄지기 위해서는.  the frog's skin,  개구리의 피부가.  must stay moist,  촉촉하게 유지되어야 한다.. 이 문장 전체를 해석하면, 하지만 이런 종류의 ‘호흡’이 제대로 이뤄지기 위해서는, 개구리의 피부가 촉촉하게 유지되어야 한다.","hl":"m"},{"n":25,"text":"방금 말한 피부 호흡에는 까다로운 조건이 하나 붙어요. 바로 피부가 항상 젖어 있어야 한다는 건데, 이것이 개구리의 생활 방식을 결정짓는 핵심 이유가 됩니다.","hl":"mn"},{"n":26,"text":"첫 번째 포인트로 to work 앞에 나온 for this kind of breathing은 to부정사의 주체를 밝혀주는 의미상 주어 구문입니다. 두 번째로 stay 뒤에는 moist라는 형용사가 와서 촉촉한 상태를 유지한다는 뜻을 완성합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서,\u003c/span>\u003cspan class=\"en\">And so,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 개구리는\u003c/span>\u003cspan class=\"en\">the frog\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 물의 근처에 있어야 한다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">must \u003c/span>\u003cspan class=\"tgt\">remain\u003c/span> near the water.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그래서 개구리는 물의 근처에 있어야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 피부를 촉촉하게 유지해야 한다는 생물학적 이유 때문에 발생하는 개구리의 \u003cb class=\"key\">서식지\u003c/b> 제약을 설명합니다. \u003cb class=\"key\">인과관계\u003c/b>에 따라 개구리가 물가에 사는 이유를 결론짓습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">\u003c/span> : must [조동사] + [동사원형] : \"남아 있어야 한다/있어야 한다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"And so, 그래서.  the frog,  개구리는.  must remain near the water,  물의 근처에 있어야 한다.. 이 문장 전체를 해석하면, 그래서 개구리는 물의 근처에 있어야 한다.","hl":"m"},{"n":28,"text":"피부가 마르면 숨을 못 쉬니까 결국 개구리는 물을 떠나서 살 수가 없다는 결론이 나오죠. 물가는 개구리에게 단순한 집 이상의 생존 공간입니다.","hl":"mn"},{"n":29,"text":"조동사 must 다음에 동사원형 remain이 쓰였습니다. 반드시 그 장소에 머물러야 한다는 강력한 필요성을 보여주는 표현입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거기에 서\u003c/span>\u003cspan class=\"en\">There,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 몸을 잠깐 담글 수 있다\u003c/span>\u003cspan class=\"en\">it can take a dip\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이따금\u003c/span>\u003cspan class=\"en\">every now and then\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">피부를 유지하기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">keep \u003c/span>\u003cspan class=\"tgt\">its \u003c/span>\u003cspan class=\"tgt\">skin \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">건조해지는 것을 막기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">drying \u003c/span>\u003cspan class=\"tgt\">out\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">거기에 서 그것은 피부가 건조해지는 것을 막기 위해 이따금 물에 몸을 잠깐 담글 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 개구리가 피부로 호흡하기 위해 \u003cb class=\"key\">수분\u003c/b>을 유지해야 함을 설명합니다. 물 근처에 살며 규칙적으로 몸을 담가 \u003cb class=\"key\">건조\u003c/b>를 방지한다는 내용입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : [to + keep (동사원형)] : \"유지하기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">keep A from -ing\u003c/span> : keep + [A(목적어)] + from + [v-ing(동명사)] : \"피부가 건조해지는 것을 막다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"There, 거기에 서. it can take a dip, 그것은 몸을 잠깐 담글 수 있다. every now and then, 이따금. to keep its skin, 피부를 유지하기 위해. from drying out, 건조해지는 것을 막기 위해. 이 문장 전체를 해석하면, 거기에 서 그것은 피부가 건조해지는 것을 막기 위해 이따금 물에 몸을 잠깐 담글 수 있다.","hl":"m"},{"n":31,"text":"개구리는 피부로도 숨을 쉬기 때문에 항상 촉촉해야 해요. 그래서 물 근처에서 지내다가 피부가 마르지 않게 한 번씩 물속에 들어간다는 이야기죠.","hl":"mn"},{"n":32,"text":"첫 번째 포인트는 `to keep`인데요, 목적을 나타내는 부사적 용법으로 쓰였어요. 두 번째는 `keep` 뒤에 `from`이 오는 구조인데, 피부가 건조해지는 것을 방해하거나 막는다는 의미를 완성하죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">개구리 역시 알을 낳아야 한다\u003c/span>\u003cspan class=\"en\">Frogs must also \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">lay\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 알을 물속에\u003c/span>\u003cspan class=\"en\">their eggs in water,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">물고기 같은 조상이 그랬던 것처럼\u003c/span>\u003cspan class=\"en\">as their fishlike ancestors \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">did\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">물고기 같은 조상이 그랬던 것처럼, 개구리 역시 물속에 알을 낳아야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 개구리의 번식 방식이 수중 생활을 하던 \u003cb class=\"key\">조상\u003c/b>의 습성을 그대로 물려받았음을 보여줍니다. 육상 생활을 하지만 \u003cb class=\"key\">생식\u003c/b>은 여전히 물에 의존함을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">타동사 lay\u003c/span> : [lay (타동사)] + [their eggs (목적어)] : \"낳다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">대동사\u003c/span> : [did (대동사)] : \"그랬던 것처럼\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"Frogs must also lay, 개구리 역시 알을 낳아야 한다. their eggs in water, 그들의 알을 물속에. as their fishlike ancestors did, 물고기 같은 조상이 그랬던 것처럼. 이 문장 전체를 해석하면, 물고기 같은 조상이 그랬던 것처럼, 개구리 역시 물속에 알을 낳아야 한다.","hl":"m"},{"n":34,"text":"개구리는 육지에서도 살지만, 조상인 물고기들처럼 알은 꼭 물속에 낳아야 한다는 습성을 설명하고 있어요.","hl":"mn"},{"n":35,"text":"첫 번째 포인트는 `lay`입니다. 뒤에 알이라는 목적어가 나오는 타동사 자리죠. 두 번째 `did`는 앞에 나온 `laid`를 대신하는 대동사로 쓰였습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 물속에 낳은 알이\u003c/span>\u003cspan class=\"en\">And eggs \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">laid\u003c/span> in the water\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">물에 사는 생물로 발달해야 한다\u003c/span>\u003cspan class=\"en\">must develop into water creatures\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">살아남으려면\u003c/span>\u003cspan class=\"en\">if they \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">survive\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그리고 물속에 낳은 알이 살아남으려면, 물에 사는 생물로 발달해야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 알이 물속에서 부화하여 살아남기 위해 초기 단계에서는 \u003cb class=\"key\">수중 \u003c/b>\u003cb class=\"key\">생물\u003c/b>의 형태를 띠어야 한다는 논리적 연결입니다. 이는 나중에 언급될 \u003cb class=\"key\">변태\u003c/b>의 필요성을 암시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사구\u003c/span> : eggs [명사] + [laid (과거분사구)] : \"낳은(낳아진)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be to 용법(의도)\u003c/span> : if + 주어 + [be to + survive (동사원형)] : \"살아남으려면\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"And eggs laid in the water, 그리고 물속에 낳은 알이. must develop into water creatures, 물에 사는 생물로 발달해야 한다. if they are to survive, 살아남으려면. 이 문장 전체를 해석하면, 그리고 물속에 낳은 알이 살아남으려면, 물에 사는 생물로 발달해야 한다.","hl":"m"},{"n":37,"text":"물속에 낳은 알이 생존하려면 당연히 물에서 살 수 있는 모습으로 자라야겠죠? 올챙이 같은 형태를 떠올려 보세요.","hl":"mn"},{"n":38,"text":"첫 번째 `laid`는 명사 `eggs`를 수식하는 과거분사예요. 두 번째 `are to survive`는 생존하고자 하는 의도나 조건을 나타내는 `be to` 용법입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">개구리에게 있어서,\u003c/span>\u003cspan class=\"en\">For frogs,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">탈바꿈은 따라서 제공한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">metamorphosis \u003c/span>\u003cspan class=\"tgt\">thus \u003c/span>\u003cspan class=\"tgt\">provides\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다리를\u003c/span>\u003cspan class=\"en\">the bridge\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">물에 사는 어린 형체와\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">between \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">water-dwelling \u003c/span>\u003cspan class=\"tgt\">young \u003c/span>\u003cspan class=\"tgt\">forms \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">육지에 사는 성체 사이의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">land-dwelling \u003c/span>\u003cspan class=\"tgt\">adults\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">따라서, 개구리에게 있어서 탈바꿈은 물에 사는 어린 형체와 육지에 사는 성체를 이어주는 다리를 제공한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 개구리가 물속의 \u003cb class=\"key\">올챙이\u003c/b>에서 육지의 \u003cb class=\"key\">성체\u003c/b>로 변화하는 과정을 통해 두 환경을 연결한다는 내용입니다. 앞선 문장들의 근거를 바탕으로 \u003cb class=\"key\">변태(탈바꿈)\u003c/b>가 생존에 필수적인 역할을 수행함을 결론짓고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주어와 동사의 수 일치\u003c/span> : metamorphosis [단수 주어] + provides [단수 동사] : \"탈바꿈은 따라서 제공한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">상관 접속사 between A and B\u003c/span> : between [A] + and [B] : \"물에 사는 어린 형체와 육지에 사는 성체 사이의\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"For frogs, 개구리에게 있어서. metamorphosis thus provides, 탈바꿈은 따라서 제공한다. the bridge, 다리를. between the water-dwelling young forms, 물에 사는 어린 형체와. and the land-dwelling adults, 육지에 사는 성체 사이의. 이 문장 전체를 해석하면, 따라서, 개구리에게 있어서 탈바꿈은 물에 사는 어린 형체와 육지에 사는 성체를 이어주는 다리를 제공한다.","hl":"m"},{"n":40,"text":"이 문장은 글의 결론 부분으로 개구리가 물과 육지라는 두 세계를 어떻게 넘나드는지 설명해요. metamorphosis 즉 탈바꿈이라는 과정이 물속의 어린 시절과 육지의 어른 시절을 연결하는 핵심적인 다리 역할을 한다는 점을 강조하고 있죠.","hl":"mn"},{"n":41,"text":"문법 포인트 두 가지 짚어볼게요. 첫 번째로 주어 metamorphosis는 단수 형태이기 때문에 동사 provides 뒤에 반드시 에스(s)를 붙여서 수 일치를 시켜주어야 해요. 두 번째로 between A and B 구조를 사용해서 물에 사는 어린 모습과 육지에 사는 성체라는 두 대상을 명확하게 연결해주고 있습니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>개구리의 조상은 \u003cb class=\"key\">수중 \u003c/b>\u003cb class=\"key\">동물\u003c/b>이었으나 진화 과정에서 \u003cb class=\"key\">육지 \u003c/b>\u003cb class=\"key\">진출\u003c/b>에 성공했습니다.\u003c/li>\u003cli>폐 기능이 약한 개구리는 \u003cb class=\"key\">피부 \u003c/b>\u003cb class=\"key\">호흡\u003c/b>을 위해 항상 피부를 \u003cb class=\"key\">촉촉하게\u003c/b> 유지해야 합니다.\u003c/li>\u003cli>\u003cb class=\"key\">번식\u003c/b> 과정에서도 조상처럼 \u003cb class=\"key\">수중 \u003c/b>\u003cb class=\"key\">산란\u003c/b>을 해야 하며 새끼는 물에서 자라야 합니다.\u003c/li>\u003cli>\u003cb class=\"key\">탈바꿈\u003c/b>은 개구리의 수중 유생기와 육지 성체기를 잇는 생태적 \u003cb class=\"key\">가교\u003c/b> 역할을 합니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Frogs maintain an essential connection to water for respiration and reproduction, utilizing metamorphosis to transition from aquatic young to terrestrial adults.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">개구리는 육지로 진출했음에도 불구하고, \u003cb class=\"key\">피부 \u003c/b>\u003cb class=\"key\">호흡\u003c/b>과 \u003cb class=\"key\">수중 \u003c/b>\u003cb class=\"key\">번식\u003c/b>을 위해 물에 의존하며 \u003cb class=\"key\">탈바꿈\u003c/b>을 통해 두 환경 사이의 생존을 이어갑니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":42,"text":"오늘은 개구리가 물과 육지라는 두 세계를 연결하며 살아가는 방식에 대해 배웠습니다. 특히 탈바꿈이 생태적으로 어떤 의미를 갖는지 이해하는 것이 이번 수업의 핵심이었어요. 오늘 배운 구조와 연결어들을 복습하면서 여러분의 논리 독해 실력도 함께 키워보길 바랍니다. 수고하셨습니다!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
