t-size:13px;color:#9b9484;margin-bottom:8px}.lec-chunks{display:flex;flex-wrap:wrap;gap:22px 16px;margin-bottom:16px}.lec-chunk{display:flex;flex-direction:column;align-items:flex-start}.lec-chunk .ko{font-size:13.5px;color:#ffd9a0;font-weight:700;margin-bottom:0;line-height:1.25}.lec-chunk .en{font-size:25px;color:#f4f1ea;font-weight:700;line-height:1.3}.lec-chunk .en .grammar-hl{background:transparent;border:0;padding:0;color:#ffe08a;font-weight:800;text-decoration:underline;text-decoration-color:#ffb347;text-decoration-thickness:2px;text-underline-offset:3px}.lec-sent-en{font-size:25px;font-weight:700;line-height:1.35;margin-bottom:12px;color:#fff}.lec-sent-ko{font-size:15px;color:#ffd9a0;line-height:1.4;margin-bottom:12px}.lec-grammar{font-size:15px;color:#d2ccbc;line-height:1.4;background:#211f18;border-left:3px solid #4338CA;border-radius:6px;padding:9px 13px;margin-top:8px}.lec-grammar.lec-meaning{border-left-color:#ffd9a0}.lec-gr-h{display:inline-block;font-weight:800;color:#9aa8ff;margin-right:4px}.lec-gr-item{margin:2px 0}.lec-grammar .lec-gr-item+.lec-gr-item{margin-top:3px}.lec-voca-list{list-style:none;margin:10px 0 0;padding:0;columns:2;column-gap:28px}.lec-voca-list li{font-size:15px;line-height:1.5;color:#ddd7c7;break-inside:avoid}.lec-voca-list li:before{content:"\2022 ";color:#9b9484}.lec-voca-list .w{font-weight:700;color:#fff}.lec-voca-list .m{color:#c7c1b1}.lec-section-tag{font-size:13px;font-weight:800;letter-spacing:.05em;color:#9b9484;margin-bottom:10px;text-transform:uppercase}.lec-sum-body{display:flex;gap:24px;flex:1;min-height:0;align-items:flex-start}.lec-sum-img{flex:0 0 42%;max-width:42%;align-self:stretch;display:flex;align-items:center;justify-content:center;background:#211f18;border-radius:10px;overflow:hidden}.lec-sum-img img{width:100%;height:100%;object-fit:contain}.lec-sum-text{flex:1;min-width:0}.lec-summary-bullets{font-size:17px;line-height:1.7;color:#ddd7c7;padding-left:20px}.lec-summary-line{font-size:19px;color:#ffd9a0;margin:6px 0 16px;line-height:1.45}.lec-hl{background:rgba(255,196,84,.22);box-shadow:0 0 26px 6px rgba(255,178,54,.36);border-radius:10px;transition:background .18s ease,box-shadow .18s ease}@media (max-width:680px){html,body{height:auto;min-height:100%}.stage{width:100vw;height:100vh;height:100dvh;margin:0;border-radius:0;box-shadow:none}.top{padding:9px 14px;font-size:13px}.slide{padding:16px 15px}.bar{padding:9px 11px;gap:7px}button{padding:8px 11px;font-size:13px}.cnt{font-size:12px}.lec-cover-title{font-size:21px;line-height:1.25}.lec-cover-title small{font-size:13.5px;margin-top:4px}.lec-cover-body,.lec-sum-body{flex-direction:column;gap:13px;align-items:stretch}.lec-cover-img,.lec-sum-img{flex:0 0 auto;width:100%;max-width:100%;max-height:30vh;align-self:auto}.lec-flow{overflow:visible}.lec-stage{padding:9px 12px;margin-bottom:7px}.lec-stage-head{font-size:14px}.lec-stage ul{font-size:13px;padding-left:16px;line-height:1.5}.lec-sent-no{font-size:12.5px;margin-bottom:6px}.lec-chunks{gap:13px 12px;margin-bottom:12px}.lec-chunk .en{font-size:18px;line-height:1.3}.lec-chunk .ko{font-size:12.5px}.lec-sent-en{font-size:18px;line-height:1.35;margin-bottom:9px}.lec-sent-ko{font-size:13.5px;margin-bottom:9px}.lec-grammar,.lec-grammar.lec-meaning{font-size:13.5px;padding:8px 11px}.lec-voca-list{columns:1;margin-top:8px}.lec-voca-list li{font-size:14px;line-height:1.45}.lec-section-tag{font-size:12px;margin-bottom:8px}.lec-summary-bullets{font-size:15px;line-height:1.6}.lec-summary-line{font-size:16px;margin:5px 0 12px}}</style></head><body><div class="stage"><div class="top">AI 강의</div><div class="slide" id="s"></div><div class="bar"><div class="tl" id="tl"><i id="fill"></i></div><span class="cnt" id="c"></span><button onclick="go(-1)">◀</button><button class="pl" id="pp" onclick="toggle()">▶ 재생</button><button onclick="go(1)">▶</button></div></div><script>var D={"slides":["<div class=\"lec-cover-title\">Beyond Health: Why Young Adults Are Choosing Vegetarianism<small>건강 그 이상: 청년들이 채식을 선택하는 이유</small></div>\n        <div class=\"lec-cover-body\"><div class=\"lec-flow\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01채식의 인기와 건강상 이점</div><ul><li>젊은 층을 중심으로 고기와 생선을 먹지 않는 채식이 대중화되고 있으며 이는 건강에 유익하다.</li><li>계획된 채식 식단(vegetarian diets)은 영양가 있고 건강함</li><li>질병의 예방 및 치료(preventing and treating)에 효과적임</li><li>핵심 키워드: 채식주의(vegetarianism)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02동물 권리 보호를 위한 선택</div><ul><li>건강뿐만 아니라 동물의 복지를 고려하여 고기를 먹지 않기로 결정하기도 한다.</li><li>식용 가축 대다수가 좁은 우리(small cages)에 갇혀 사육됨</li><li>열악한 사육 조건에 항의(protest)하는 의미로 육식을 거부함</li><li>핵심 키워드: 동물 권리(animal rights)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03환경 보호를 위한 실천</div><ul><li>육류 생산 과정이 환경에 미치는 부정적인 영향을 줄이기 위해 채식을 선택한다.</li><li>육류 생산(meat production)은 수자원, 토지, 에너지 등을 대량 소비함</li><li>가축 폐기물로 인한 오염(pollution) 문제 유발</li><li>핵심 키워드: 환경 지원(support the environment)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04결론 및 시사점</div><ul><li>현대 청년들은 식습관을 통해 자신의 사회적 인식과 가치관을 드러낸다.</li><li>동물권과 환경 문제에 대해 과거보다 더 민감하게(sensitive) 반응함</li><li>가치 중심적인 소비와 생활 방식이 확산됨</li><li>핵심 키워드: 인식 변화(more aware)</li></ul></div></div></div>","<div class=\"lec-section-tag\">단어 정리</div><ul class=\"lec-voca-list\"><li><span class=\"w\">vegetarian</span> <span class=\"m\">채식의</span></li><li><span class=\"w\">nutritious</span> <span class=\"m\">영양가가 높은</span></li><li><span class=\"w\">prevent</span> <span class=\"m\">예방하다, 막다</span></li><li><span class=\"w\">out of concern for</span> <span class=\"m\">~에 대한 걱정(염려) 때문에</span></li><li><span class=\"w\">animal rights</span> <span class=\"m\">동물 권리(동물권)</span></li><li><span class=\"w\">statistics</span> <span class=\"m\">통계, 통계 수치</span></li><li><span class=\"w\">majority</span> <span class=\"m\">대다수, 대부분</span></li><li><span class=\"w\">raise</span> <span class=\"m\">(가축 등을) 기르다, 사육하다</span></li><li><span class=\"w\">protest</span> <span class=\"m\">항의하다, 반대하다</span></li><li><span class=\"w\">turn to</span> <span class=\"m\">~로 돌아서다, ~에 의지하다</span></li><li><span class=\"w\">result in</span> <span class=\"m\">~을 야기하다, ~라는 결과를 낳다</span></li><li><span class=\"w\">be aware of</span> <span class=\"m\">~을 인식하다, 알다</span></li><li><span class=\"w\">sensitive</span> <span class=\"m\">민감한, 예민한</span></li></ul>","<div class=\"lec-sent-no\">문장 1 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">채식은</span><span class=\"en\"><b><span class=\"grammar-hl\">Vegetarian eating</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">점점 더 인기를 얻고 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">is becoming</span> more popular</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">점점 더 많은 젊은 성인들이</span><span class=\"en\"><b>as more and more young adults</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">반대하면서</span><span class=\"en\"><b>say no to</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">고기와 생선을 먹는 것에.</span><span class=\"en\"><b><span class=\"grammar-hl\">eating meat and fish</span>.</b></span></div></div><div class=\"lec-sent-ko\">채식은 점점 더 많은 젊은 성인들이 고기와 생선을 먹는 것에 반대하면서 더 인기를 얻고 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 도입부로서 최근 젊은 층 사이에서 채식이 확산되고 있는 사회적 현상을 제시하며 글의 전체적인 주제를 설정합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Vegetarian eating (동명사): -ing가 문장의 주어 역할을 하는 명사적 용법으로 쓰였다.</div><div class=\"lec-gr-item\">is becoming (현재진행): be동사(is) + 현재분사(becoming) 형태로 &#39;~해지고 있다&#39;라는 진행 중인 변화를 나타낸다.</div><div class=\"lec-gr-item\">eating meat and fish (동명사): -ing가 전치사 to의 목적어 역할을 하는 명사적 용법으로 쓰였다.</div></div>\n        <ul class=\"lec-voca-list\"><li><span class=\"w\">vegetarian</span> <span class=\"m\">채식의</span></li></ul>","<div class=\"lec-sent-no\">문장 2 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">~에 따르면</span><span class=\"en\"><b><span class=\"grammar-hl\">According to</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">미국 영양학 협회</span><span class=\"en\"><b>the American Dietetic Association,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">계획된 채식주의 식단은</span><span class=\"en\"><b><span class=\"grammar-hl\">planned vegetarian diets</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">건강에 좋고 영양가가 높다.</span><span class=\"en\"><b>are healthful and nutritious.</b></span></div></div><div class=\"lec-sent-ko\">미국 영양학 협회에 따르면, 계획된 채식주의 식단은 건강에 좋고 영양가가 높다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 채식의 장점 중 첫 번째인 &#39;건강&#39; 측면을 언급합니다. 공신력 있는 기관(미국 영양사 협회)의 의견을 인용하여 채식의 긍정적인 면에 대한 객관적 근거를 제공합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">According to (관용표현): &#39;~에 따르면&#39;이라는 뜻으로 뒤에 정보의 출처인 명사가 오는 전치사구이다.</div><div class=\"lec-gr-item\">planned vegetarian diets (과거분사(형용사)): planned가 뒤의 명사 diets를 수식(= &quot;계획된 채식 식단&quot;). p.p. + N 구조로 &#39;diets that are planned&#39;의 의미를 갖는다.</div></div>\n        <ul class=\"lec-voca-list\"><li><span class=\"w\">vegetarian</span> <span class=\"m\">채식의</span></li><li><span class=\"w\">nutritious</span> <span class=\"m\">영양가가 높은</span></li></ul>","<div class=\"lec-sent-no\">문장 3 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것들은 또한 제공한다</span><span class=\"en\"><b>They also provide</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">건강상의 이점을</span><span class=\"en\"><b>health benefits</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">예방하고 치료하는 데</span><span class=\"en\"><b>in <span class=\"grammar-hl\">preventing and treating</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">특정 질병을.</span><span class=\"en\"><b>certain diseases.</b></span></div></div><div class=\"lec-sent-ko\">그것들은 또한 특정 질병을 예방하고 치료하는 데 건강상의 이점을 제공한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 건강 관련 내용을 구체화하여, 채식이 단순히 영양 보급을 넘어 질병 관리에도 효과적임을 추가로 설명하며 논리를 강화합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">preventing and treating (동명사): -ing가 전치사 in의 목적어 역할을 하는 명사적 용법으로 쓰였다.</div></div>\n        <ul class=\"lec-voca-list\"><li><span class=\"w\">prevent</span> <span class=\"m\">예방하다, 막다</span></li></ul>","<div class=\"lec-sent-no\">문장 4 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만</span><span class=\"en\"><b>However,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">젊은 성인들은 결정하지 않는다</span><span class=\"en\"><b>young adults don’t <span class=\"grammar-hl\">decide</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">식단을 바꾸기로</span><span class=\"en\"><b><span class=\"grammar-hl\">to change</span> their diets</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오직 염려 때문만으로</span><span class=\"en\"><b>only <span class=\"grammar-hl\">out of concern</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 건강에 대한.</span><span class=\"en\"><b>for their health.</b></span></div></div><div class=\"lec-sent-ko\">하지만, 젊은 성인들은 그들의 건강에 대한 염려 때문만으로 식단을 바꾸기로 결정하는 것은 아니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 역접의 접속사 &#39;However&#39;를 사용하여 글의 흐름을 전환합니다. 건강이 유일한 이유가 아님을 밝힘으로써, 뒤에 이어질 사회적·윤리적 동기들을 도입하는 징검다리 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">decide to change (to부정사): to+동사원형이 동사 decide의 목적어 역할을 하는 명사적 용법으로 쓰였다.</div><div class=\"lec-gr-item\">out of concern (관용표현): &#39;걱정/관심 때문에&#39;라는 의미로, 동기나 원인을 나타낼 때 쓰는 표현이다.</div></div>\n        <ul class=\"lec-voca-list\"><li><span class=\"w\">out of concern for</span> <span class=\"m\">~에 대한 걱정(염려) 때문에</span></li></ul>","<div class=\"lec-sent-no\">문장 5 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어떤 이들은</span><span class=\"en\"><b>Some</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 선택을 한다</span><span class=\"en\"><b>make the choice</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">관심 때문에</span><span class=\"en\"><b><span class=\"grammar-hl\">out of concern</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">동물의 권리에 대한.</span><span class=\"en\"><b>for animal rights.</b></span></div></div><div class=\"lec-sent-ko\">어떤 이들은 동물의 권리에 대한 관심 때문에 그 선택을 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 건강 외의 첫 번째 추가 동기로 &#39;동물 권리&#39;를 제시하며 논의의 범위를 확장합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">out of concern (관용표현): &#39;걱정/관심 때문에&#39;라는 의미로, 명사 choice를 하게 된 원인을 나타내는 부사구이다.</div></div>\n        <ul class=\"lec-voca-list\"><li><span class=\"w\">out of concern for</span> <span class=\"m\">~에 대한 걱정(염려) 때문에</span></li><li><span class=\"w\">animal rights</span> <span class=\"m\">동물 권리(동물권)</span></li></ul>","<div class=\"lec-sent-no\">문장 6 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">많은 통계는 보여준다</span><span class=\"en\"><b>Many statistics show</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">대부분의 동물들이</span><span class=\"en\"><b>that the majority of the <span class=\"grammar-hl\">animals</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">식용으로 길러지는</span><span class=\"en\"><b><span class=\"grammar-hl\">raised for food</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">작은 우리에 갇혀 있다는 것을.</span><span class=\"en\"><b><span class=\"grammar-hl\">are kept</span> in small cages.</b></span></div></div><div class=\"lec-sent-ko\">많은 통계는 식용으로 길러지는 대부분의 동물들이 작은 우리에 갇혀 있다는 것을 보여준다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 &#39;동물 권리&#39;에 대한 우려가 구체적으로 어떤 현실적 문제(열악한 사육 환경)에서 비롯되었는지 객관적 자료를 근거로 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">animals raised for food (과거분사(형용사)): raised가 앞의 명사 animals를 수식(= &quot;식용으로 길러진 동물들&quot;). N + p.p. 구조로 &#39;animals that are raised&#39;의 의미를 갖는다.</div><div class=\"lec-gr-item\">are kept (수동태): be동사(are)+p.p.(kept) 구조. keep은 타동사인데 뒤에 직접적인 목적어가 없어서 수동구조 are kept 형태로 쓴다. 기본구조: keep + O + Adverbial(부사구).</div></div>\n        <ul class=\"lec-voca-list\"><li><span class=\"w\">statistics</span> <span class=\"m\">통계, 통계 수치</span></li><li><span class=\"w\">majority</span> <span class=\"m\">대다수, 대부분</span></li><li><span class=\"w\">raise</span> <span class=\"m\">(가축 등을) 기르다, 사육하다</span></li></ul>","<div class=\"lec-sent-no\">문장 7 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그래서 많은 십 대들은</span><span class=\"en\"><b>So, many teens</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">고기를 포기한다</span><span class=\"en\"><b><span class=\"grammar-hl\">give up</span> meat</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저항하기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to protest</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그러한 조건에.</span><span class=\"en\"><b>those conditions.</b></span></div></div><div class=\"lec-sent-ko\">그래서, 많은 십 대들은 그러한 조건에 저항하기 위해 고기를 포기한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 결과의 접속사 &#39;So&#39;를 통해, 열악한 사육 환경이라는 원인이 청소년들의 &#39;채식 선택&#39;이라는 행동(항의의 수단)으로 이어졌음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">give up (관용표현): &#39;~을 포기하다, 그만두다&#39;라는 의미를 가진 구동사(phrasal verb)이다.</div><div class=\"lec-gr-item\">to protest (to부정사): to+동사원형이 &#39;~하기 위해서&#39;라는 목적을 나타내는 부사적 용법으로 쓰였다.</div></div>\n        <ul class=\"lec-voca-list\"><li><span class=\"w\">protest</span> <span class=\"m\">항의하다, 반대하다</span></li></ul>","<div class=\"lec-sent-no\">문장 8 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">다른 사람들은</span><span class=\"en\"><b>Others</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">채식주의가 된다</span><span class=\"en\"><b><span class=\"grammar-hl\">turn to</span> vegetarianism</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지지하기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to support</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">환경을.</span><span class=\"en\"><b>the environment.</b></span></div></div><div class=\"lec-sent-ko\">다른 사람들은 환경을 지지하기 위해 채식주의가 된다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 건강, 동물 권리에 이은 세 번째 주요 동기로 &#39;환경 보호&#39;를 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">turn to (관용표현): &#39;~에 의지하다, (채식주의)로 눈을 돌리다/전향하다&#39;라는 의미로 쓰였다.</div><div class=\"lec-gr-item\">to support (to부정사): to+동사원형이 &#39;~하기 위해서&#39;라는 목적을 나타내는 부사적 용법으로 쓰였다.</div></div>\n        <ul class=\"lec-voca-list\"><li><span class=\"w\">vegetarian</span> <span class=\"m\">채식의</span></li><li><span class=\"w\">turn to</span> <span class=\"m\">~로 돌아서다, ~에 의지하다</span></li></ul>","<div class=\"lec-sent-no\">문장 9 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">고기 생산은 사용한다</span><span class=\"en\"><b>Meat production <span class=\"grammar-hl\">uses</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 양의</span><span class=\"en\"><b><span class=\"grammar-hl\">large amounts of</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">물, 땅, 곡물과 에너지를.</span><span class=\"en\"><b>water, land, grain, and energy.</b></span></div></div><div class=\"lec-sent-ko\">고기 생산은 많은 양의 물, 땅, 곡물과 에너지를 사용한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 육류 생산 과정에서 발생하는 자원 소모 문제를 구체적으로 나열하여, 왜 육식을 피하는 것이 환경 보호와 연결되는지 논리적으로 뒷받침합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">uses large amounts of 3형식(SVOC) 구조: 주어(Meat production) + 동사(uses) + 목적어(large amounts of...)의 구조로 이루어진 문장이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 또한 만들어 낸다</span><span class=\"en\"><b>It also creates</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가축의 배설물 문제를</span><span class=\"en\"><b>problems with <span class=\"grammar-hl\">animal waste</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오염을 일으키는.</span><span class=\"en\"><b><span class=\"grammar-hl\">resulting in pollution</span>.</b></span></div></div><div class=\"lec-sent-ko\">그것은 또한 오염을 일으키는 가축의 배설물 문제를 만들어 낸다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 자원 소모 외에 &#39;오염(폐기물)&#39;이라는 또 다른 환경적 문제점을 추가하여, 육류 생산이 환경에 미치는 부정적 영향의 폭을 넓힙니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">animal waste resulting in pollution (현재분사(형용사)): resulting in이 앞의 명사 animal waste를 수식(= &quot;오염을 초래하는 동물 폐기물&quot;). N + -ing 구조로, &#39;animal waste that results in pollution&#39;의 의미를 나타낸다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 11 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이러한 경향은 보여준다</span><span class=\"en\"><b>These trends show</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오늘날 젊은이들이</span><span class=\"en\"><b>that today’s youth</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 인식하고</span><span class=\"en\"><b>are more <span class=\"grammar-hl\">aware of</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">~에 더 민감하다는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">and sensitive to</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">동물의 권리와 환경 문제에.</span><span class=\"en\"><b>animal rights and environmental problems.</b></span></div></div><div class=\"lec-sent-ko\">이러한 경향은 오늘날 젊은이들이 동물의 권리와 환경 문제를 더 인식하고 그것에 더 민감하다는 것을 보여준다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 마지막 문장으로, 앞서 언급한 채식의 여러 동기(건강, 동물권, 환경)를 종합하여 현대 젊은 세대가 사회적·윤리적 가치에 높은 의식을 가지고 있음을 강조하며 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">aware of and sensitive to (관용표현): &#39;be aware of(~을 알다/인식하다)&#39;와 &#39;be sensitive to(~에 민감하다)&#39;가 병렬 구조로 연결되어 주어의 상태를 설명하는 보어로 쓰였다.</div></div>\n        <ul class=\"lec-voca-list\"><li><span class=\"w\">animal rights</span> <span class=\"m\">동물 권리(동물권)</span></li><li><span class=\"w\">sensitive</span> <span class=\"m\">민감한, 예민한</span></li></ul>","<div class=\"lec-section-tag\">최종 정리</div>\n        <div class=\"lec-sum-body\">\n          <div class=\"lec-sum-text\">\n            <div class=\"lec-sent-en\">Young adults increasingly embrace vegetarianism to achieve personal health benefits while advocating for animal welfare and environmental preservation.</div>\n            <div class=\"lec-summary-line\">개인적인 건강상의 이점을 달성하는 동시에 동물 복지와 환경 보존을 옹호하기 위해 청년층의 채식 참여가 증가하고 있다.</div>\n            \n          </div>\n        </div>"],"segs":[[{"audio":"./reading03_audio/1.mp3","hl":null},{"audio":"./reading03_audio/2.mp3","hl":"stage-0"},{"audio":"./reading03_audio/3.mp3","hl":"stage-1"},{"audio":"./reading03_audio/4.mp3","hl":"stage-2"},{"audio":"./reading03_audio/5.mp3","hl":"stage-3"}],[{"audio":"./reading03_audio/6.mp3","hl":null}],[{"audio":"./reading03_audio/7.mp3","hl":"main"},{"audio":"./reading03_audio/8.mp3","hl":"meaning"},{"audio":"./reading03_audio/9.mp3","hl":"grammar"}],[{"audio":"./reading03_audio/10.mp3","hl":"main"},{"audio":"./reading03_audio/11.mp3","hl":"meaning"},{"audio":"./reading03_audio/12.mp3","hl":"grammar"}],[{"audio":"./reading03_audio/13.mp3","hl":"main"},{"audio":"./reading03_audio/14.mp3","hl":"meaning"},{"audio":"./reading03_audio/15.mp3","hl":"grammar"}],[{"audio":"./reading03_audio/16.mp3","hl":"main"},{"audio":"./reading03_audio/17.mp3","hl":"meaning"},{"audio":"./reading03_audio/18.mp3","hl":"grammar"}],[{"audio":"./reading03_audio/19.mp3","hl":"main"},{"audio":"./reading03_audio/20.mp3","hl":"meaning"},{"audio":"./reading03_audio/21.mp3","hl":"grammar"}],[{"audio":"./reading03_audio/22.mp3","hl":"main"},{"audio":"./reading03_audio/23.mp3","hl":"meaning"},{"audio":"./reading03_audio/24.mp3","hl":"grammar"}],[{"audio":"./reading03_audio/25.mp3","hl":"main"},{"audio":"./reading03_audio/26.mp3","hl":"meaning"},{"audio":"./reading03_audio/27.mp3","hl":"grammar"}],[{"audio":"./reading03_audio/28.mp3","hl":"main"},{"audio":"./reading03_audio/29.mp3","hl":"meaning"},{"audio":"./reading03_audio/30.mp3","hl":"grammar"}],[{"audio":"./reading03_audio/31.mp3","hl":"main"},{"audio":"./reading03_audio/32.mp3","hl":"meaning"},{"audio":"./reading03_audio/33.mp3"
