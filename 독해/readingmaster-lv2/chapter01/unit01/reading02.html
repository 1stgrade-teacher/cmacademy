<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터2 Reading02 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터2 Reading02","audioDir":"reading02_audio","preview":false,"count":40,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.520em\">Reading02\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터2\u003c/div>\u003ch1>Why Milk Is Not Sold in Cans\u003c/h1>\u003ch2>우유는 왜 캔에 담기지 않을까\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>요약: 우유는 온도에 매우 민감해 저온에서 보관되어야 하는데, 캔은 \u003cb class=\"key\">열 \u003c/b>\u003cb class=\"key\">전도\u003c/b>가 잘되어 우유를 빨리 상하게 하고 고온·고압 과정에서 \u003cb class=\"key\">갈변\u003c/b>이 생겨 맛과 특성을 바꾼다. 여기에 \u003cb class=\"key\">생산 \u003c/b>\u003cb class=\"key\">비용\u003c/b>과 \u003cb class=\"key\">포장 \u003c/b>\u003cb class=\"key\">시설\u003c/b>의 부족까지 더해져 캔 우유는 덜 매력적인 선택이 된다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Milk is rarely sold in cans because cans conduct heat well, high-temperature processing causes browning that changes its taste and properties, and canning is more expensive and requires proper packaging facilities.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"여러분, 안녕하세요. 오늘은 우유가 왜 캔에 담겨 팔리지 않는지 그 이유를 함께 읽어 볼 거예요. 짧지만 이유가 아주 알차게 정리된 지문이죠. 핵심은 우유가 온도에 민감하고, 캔의 성질과 잘 맞지 않으며, 비용도 더 든다는 점이에요. 이 세 가지를 중심으로 글의 흐름을 따라가 볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">우유는 미생물이 자라기 쉬운 식품이라 \u003cb class=\"key\">온도 \u003c/b>\u003cb class=\"key\">관리\u003c/b>가 무엇보다 중요합니다. 그래서 대부분의 우유는 섭씨 0도에서 4도 사이의 저온에서 냉장 유통(cold chain)됩니다. 그런데 캔은 금속이라 열을 잘 전도하는(conduct heat) 성질이 있어 이런 \u003cb class=\"key\">저온\u003c/b>을 오래 유지하기 어렵습니다. 또한 캔 식품은 보통 고온·고압으로 가열해 살균(sterilization)하는데, 우유는 이 과정에서 당과 단백질이 반응하는 \u003cb class=\"key\">갈변\u003c/b>(browning)이 일어나 색과 맛이 변합니다. 일상 비유로 말하면, 아이스크림을 금속 통에 담아 두는 것과 비슷합니다. 결국 우유를 캔에 담는 일은 \u003cb class=\"key\">포장 \u003c/b>\u003cb class=\"key\">비용\u003c/b>과 \u003cb class=\"key\">시설\u003c/b> 문제까지 겹쳐 쉽게 선택하기 어려운 일입니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경을 조금 알아 볼까요? 우유는 미생물이 자라기 쉬운 식품이라 온도 관리가 정말 중요해요. 그래서 보통 섭씨 영도에서 사도 사이의 저온에서 냉장 유통되죠. 캔은 금속이라 열을 잘 전도하는 성질이 있어서 이런 저온을 오래 유지하기 어려워요. 또 캔 식품은 보통 고온과 고압으로 살균하는데, 우유는 이 과정에서 갈변이 일어나 색과 맛이 변할 수 있어요. 아이스크림을 금속 통에 담아 두는 것과 비슷하다고 생각하면 이해가 쉬울 거예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>질문으로 시작\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>캔에 든 우유를 본 적이 있는지 묻는 \u003cb class=\"key\">질문\u003c/b>으로 글을 엽니다. 우리는 종이 팩이나 플라스틱 병에 담긴 우유에는 \u003cb class=\"key\">익숙\u003c/b>하지만 캔에 담긴 우유는 낯설다는 점을 짚습니다. 이 \u003cb class=\"key\">통념\u003c/b> 확인이 뒤에 나올 이유 설명의 발판이 됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>주제문 제시\u003csmall>주제 제시 · 문장 3\u003c/small>\u003c/h4>\u003cp>이어서 이 현상에는 \u003cb class=\"key\">흥미로운 \u003c/b>\u003cb class=\"key\">이유\u003c/b>들이 있다고 말하며 글의 \u003cb class=\"key\">주제\u003c/b>를 던집니다. 짧은 문장 하나로 독자의 궁금증을 붙잡는 \u003cb class=\"key\">주제문\u003c/b> 역할을 합니다. 뒤따르는 문장들은 모두 이 주제를 뒷받침하는 \u003cb class=\"key\">근거\u003c/b>가 됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>온도와 열 전도\u003csmall>근거 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>우유는 온도에 매우 \u003cb class=\"key\">민감\u003c/b>해서 섭씨 0도에서 4도 사이에서 \u003cb class=\"key\">보관\u003c/b>되어야 한다고 설명합니다. 그런데 캔은 \u003cb class=\"key\">열 \u003c/b>\u003cb class=\"key\">전도\u003c/b>가 잘되어 우유를 빨리 \u003cb class=\"key\">상하게\u003c/b> 만들 수 있습니다. 우유의 특성과 캔의 성질이 서로 맞지 않는다는 \u003cb class=\"key\">인과\u003c/b> 관계를 보여 줍니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>고온·고압과 갈변\u003csmall>근거 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>게다가 많은 캔 식품은 높은 온도에서 가열되고 높은 \u003cb class=\"key\">압력\u003c/b>에 노출됩니다. 우유가 이런 \u003cb class=\"key\">과정\u003c/b>을 거치면 \u003cb class=\"key\">갈변\u003c/b> 때문에 맛과 특성이 바뀔 수 있습니다. 앞의 근거에 두 번째 \u003cb class=\"key\">이유\u003c/b>를 더하는 흐름입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>비용과 시설, 결론\u003csmall>결론 · 문장 8–9\u003c/small>\u003c/h4>\u003cp>또한 캔은 종이 팩이나 플라스틱 병보다 \u003cb class=\"key\">생산 \u003c/b>\u003cb class=\"key\">비용\u003c/b>이 더 많이 듭니다. 결국 위에서 언급한 이유들과 적절한 \u003cb class=\"key\">포장 \u003c/b>\u003cb class=\"key\">시설\u003c/b>의 부족이 캔 우유를 덜 \u003cb class=\"key\">매력적인 \u003c/b>\u003cb class=\"key\">선택\u003c/b>으로 만듭니다. 근거를 모아 \u003cb class=\"key\">결론\u003c/b>을 내리는 마무리 단계입니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 지문의 흐름을 다섯 단계로 나눠서 살펴볼게요.","hl":null},{"n":4,"text":"글은 캔에 든 우유를 본 적이 있는지 묻는 질문으로 시작해요. 우리는 종이 팩이나 플라스틱 병에 담긴 우유에는 익숙하지만 캔에 담긴 우유는 낯설다는 점을 짚어 주죠. 이런 통념 확인이 뒤에 나올 이유 설명의 발판이 됩니다.","hl":"f0"},{"n":5,"text":"이어서 이 현상에는 흥미로운 이유들이 있다고 말하면서 글의 주제를 던져요. 짧은 문장 하나로 독자의 궁금증을 붙잡는 주제문 역할을 하죠. 뒤에 오는 문장들은 모두 이 주제를 뒷받침하는 근거가 됩니다.","hl":"f1"},{"n":6,"text":"우유는 온도에 매우 민감해서 섭씨 영도에서 사도 사이에서 보관되어야 한다고 설명해요. 그런데 캔은 열 전도가 잘되어 우유를 빨리 상하게 만들 수 있죠. 우유의 특성과 캔의 성질이 서로 맞지 않는다는 인과 관계를 보여 주는 부분이에요.","hl":"f2"},{"n":7,"text":"게다가 많은 캔 식품은 높은 온도에서 가열되고 높은 압력에 노출된다고 해요. 우유가 이런 과정을 거치면 갈변 때문에 맛과 특성이 바뀔 수 있죠. 앞의 근거에 두 번째 이유를 더하는 흐름입니다.","hl":"f3"},{"n":8,"text":"또한 캔은 종이 팩이나 플라스틱 병보다 생산 비용이 더 많이 들어요. 결국 위에서 언급한 이유들과 적절한 포장 시설의 부족이 캔 우유를 덜 매력적인 선택으로 만듭니다. 근거를 모아 결론을 내리는 마무리 단계예요.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">질문-답변\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 3번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 질문을 던지고, 세 번째 문장에서 흥미로운 이유들이 있다며 \u003cb class=\"key\">주제\u003c/b>를 먼저 밝힙니다. 이후 네 번째부터 여덟 번째 문장까지 \u003cb class=\"key\">근거\u003c/b>를 하나씩 열거하고, 마지막 문장에서 이를 묶어 \u003cb class=\"key\">결론\u003c/b>을 냅니다. 그래서 중심 생각이 앞에 나오는 \u003cb class=\"key\">두괄식\u003c/b> 구조이고, 질문에 차례로 답해 가는 \u003cb class=\"key\">질문-답변\u003c/b> 전개 방식입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Have you ever seen (1)\u003c/b>\u003cspan>도입 질문\u003c/span>\u003cb>While (2)\u003c/b>\u003cspan>대조\u003c/span>\u003cb>There are interesting reasons (3)\u003c/b>\u003cspan>주제문 제시\u003c/span>\u003cb>Unfortunately (5)\u003c/b>\u003cspan>부정적 결과 강조\u003c/span>\u003cb>Furthermore (6)\u003c/b>\u003cspan>근거 추가\u003c/span>\u003cb>But (7)\u003c/b>\u003cspan>전환\u003c/span>\u003cb>Additionally (8)\u003c/b>\u003cspan>근거 추가\u003c/span>\u003cb>Although (9)\u003c/b>\u003cspan>양보 후 결론\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">go bad quickly\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">change the taste and properties\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">less attractive option\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>캔 (Cans)\u003c/th>\u003cth>종이 팩·플라스틱 병 (Cartons &amp; Plastic Bottles)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>열을 잘 전도해 우유를 빨리 상하게 함\u003c/td>\u003ctd>우유가 익숙하게 담기는 일반적 포장\u003c/td>\u003c/tr>\u003ctr>\u003ctd>고온·고압 과정에서 갈변이 생김\u003c/td>\u003ctd>그런 가열·압력 문제가 언급되지 않음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>생산 비용이 더 비쌈\u003c/td>\u003ctd>캔보다 비용 부담이 적음\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글은 질문에 답하는 질문-답변 전개 방식이에요. 첫 문장에서 질문을 던지고 세 번째 문장에서 흥미로운 이유들이 있다며 주제를 먼저 밝히죠. 그래서 중심 생각이 앞에 나오는 두괄식 구조입니다. 뒤에는 근거가 차곡차곡 이어지고 마지막 문장에서 결론을 정리해요.","hl":"ty"},{"n":10,"text":"신호어를 눈여겨보면 흐름이 훨씬 잘 보여요. Unfortunately는 부정적인 결과를 알려 주고, Furthermore와 Additionally는 근거를 하나 더 추가한다는 신호예요. But은 우유가 과정을 거치면 어떻게 되는지 전환해서 보여 주고, Although는 양보하면서 마지막 결론으로 데려다줍니다. 이런 신호어를 따라가면 이유가 몇 개인지가 저절로 세어져요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>be familiar with\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 익숙하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>carton\u003c/b>\u003cem>명사\u003c/em>\u003cspan>종이 팩, 우유갑\u003c/span>\u003c/div>\u003cdiv>\u003cb>probably\u003c/b>\u003cem>부사\u003c/em>\u003cspan>아마도\u003c/span>\u003c/div>\u003cdiv>\u003cb>sensitive\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>민감한\u003c/span>\u003c/div>\u003cdiv>\u003cb>temperature\u003c/b>\u003cem>명사\u003c/em>\u003cspan>온도\u003c/span>\u003c/div>\u003cdiv>\u003cb>store\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보관하다, 저장하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>unfortunately\u003c/b>\u003cem>부사\u003c/em>\u003cspan>불행히도\u003c/span>\u003c/div>\u003cdiv>\u003cb>go bad\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>상하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>conduct\u003c/b>\u003cem>동사\u003c/em>\u003cspan>전도하다, 전달하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>heat\u003c/b>\u003cem>명사\u003c/em>\u003cspan>열\u003c/span>\u003c/div>\u003cdiv>\u003cb>furthermore\u003c/b>\u003cem>부사\u003c/em>\u003cspan>게다가, 더욱이\u003c/span>\u003c/div>\u003cdiv>\u003cb>canned\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>캔에 든, 통조림의\u003c/span>\u003c/div>\u003cdiv>\u003cb>be exposed to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 노출되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>pressure\u003c/b>\u003cem>명사\u003c/em>\u003cspan>압력\u003c/span>\u003c/div>\u003cdiv>\u003cb>go through\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 거치다, 겪다\u003c/span>\u003c/div>\u003cdiv>\u003cb>process\u003c/b>\u003cem>명사\u003c/em>\u003cspan>과정\u003c/span>\u003c/div>\u003cdiv>\u003cb>property\u003c/b>\u003cem>명사\u003c/em>\u003cspan>특성, 성질\u003c/span>\u003c/div>\u003cdiv>\u003cb>due to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~ 때문에\u003c/span>\u003c/div>\u003cdiv>\u003cb>browning\u003c/b>\u003cem>명사\u003c/em>\u003cspan>갈변\u003c/span>\u003c/div>\u003cdiv>\u003cb>additionally\u003c/b>\u003cem>부사\u003c/em>\u003cspan>게다가\u003c/span>\u003c/div>\u003cdiv>\u003cb>expensive\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>비싼\u003c/span>\u003c/div>\u003cdiv>\u003cb>produce\u003c/b>\u003cem>동사\u003c/em>\u003cspan>생산하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>although\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>비록 ~일지라도\u003c/span>\u003c/div>\u003cdiv>\u003cb>producer\u003c/b>\u003cem>명사\u003c/em>\u003cspan>생산자\u003c/span>\u003c/div>\u003cdiv>\u003cb>mention\u003c/b>\u003cem>동사\u003c/em>\u003cspan>언급하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>lack of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~의 부족\u003c/span>\u003c/div>\u003cdiv>\u003cb>proper\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>적절한, 알맞은\u003c/span>\u003c/div>\u003cdiv>\u003cb>facility\u003c/b>\u003cem>명사\u003c/em>\u003cspan>시설\u003c/span>\u003c/div>\u003cdiv>\u003cb>attractive\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>매력적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>option\u003c/b>\u003cem>명사\u003c/em>\u003cspan>선택, 선택지\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"핵심 단어도 짚고 갈게요. sensitive는 민감한, store는 보관하다, conduct heat는 열을 전도하다라는 뜻이에요. go through는 과정을 거치다, property는 특성, lack of는 부족이라는 표현이고요. attractive는 매력적이라는 뜻으로 마지막 문장에서 아주 중요하게 쓰입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">sensitive\u003c/b>\u003cspan class=\"m\">민감한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">delicate\u003c/span>\u003cspan class=\"s\">responsive\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">insensitive\u003c/span>\u003cspan class=\"a\">numb\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">store\u003c/b>\u003cspan class=\"m\">보관하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">keep\u003c/span>\u003cspan class=\"s\">preserve\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">discard\u003c/span>\u003cspan class=\"a\">dispose\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">conduct\u003c/b>\u003cspan class=\"m\">전도하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">transmit\u003c/span>\u003cspan class=\"s\">transfer\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">insulate\u003c/span>\u003cspan class=\"a\">block\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">be exposed to\u003c/b>\u003cspan class=\"m\">~에 노출되다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">be subjected to\u003c/span>\u003cspan class=\"s\">be vulnerable to\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">be protected from\u003c/span>\u003cspan class=\"a\">be shielded from\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">expensive\u003c/b>\u003cspan class=\"m\">비싼\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">costly\u003c/span>\u003cspan class=\"s\">pricey\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">cheap\u003c/span>\u003cspan class=\"a\">inexpensive\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">lack\u003c/b>\u003cspan class=\"m\">부족\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">shortage\u003c/span>\u003cspan class=\"s\">deficiency\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">abundance\u003c/span>\u003cspan class=\"a\">sufficiency\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">attractive\u003c/b>\u003cspan class=\"m\">매력적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">appealing\u003c/span>\u003cspan class=\"s\">tempting\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unattractive\u003c/span>\u003cspan class=\"a\">undesirable\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">probably\u003c/b>\u003cspan class=\"m\">아마도\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">likely\u003c/span>\u003cspan class=\"s\">presumably\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unlikely\u003c/span>\u003cspan class=\"a\">improbably\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어도 함께 정리해 볼게요. sensitive는 delicate나 responsive로 바꿔 쓸 수 있고 반대말은 insensitive예요. conduct는 transmit이나 transfer와 가깝고, 반대는 insulate로 열을 막는다는 뜻이죠. expensive는 costly나 pricey와 같고 반대는 cheap이에요. lack은 shortage나 deficiency로 바꿀 수 있고 반대는 abundance입니다. attractive는 appealing이나 tempting과 가깝고 반대는 unattractive예요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 지금까지 ~해 본 적이 있나요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Have \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">ever \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우유를 본\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">seen\u003c/span> milk\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">캔에 들어 있는\u003c/span>\u003cspan class=\"en\">in a can?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">당신은 캔에 들어 있는 우유를 본 적이 있는가?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 독자에게 말을 거는 \u003cb class=\"key\">의문문\u003c/b>으로 글을 시작해 흥미를 끄는 문장이에요. 캔에 든 우유는 낯설다는 점을 환기시키려는 \u003cb class=\"key\">도입\u003c/b> 역할을 하죠. 'ever'는 '지금까지 한 번이라도'라는 뜻으로 \u003cb class=\"key\">경험\u003c/b>을 묻는 표지어예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재완료(경험) 의문문\u003c/span> : Have + 주어 + ever + p.p.~? : \"당신은 지금까지 ~을 본 적이 있나요\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"Have you ever, 당신은 지금까지 ~해 본 적이 있나요. seen milk, 우유를 본. in a can?, 캔에 들어 있는. 이 문장 전체를 해석하면, 당신은 캔에 들어 있는 우유를 본 적이 있는가?","hl":"m"},{"n":14,"text":"이 문장은 질문을 던져서 독자의 관심을 끄는 도입 문장이에요. 우리는 우유를 팩이나 병으로만 보니까 캔에 든 우유라는 말이 낯설게 느껴지죠. 그래서 ever를 넣어서 지금까지 한 번이라도 본 적이 있는지 물어보는 겁니다.","hl":"mn"},{"n":15,"text":"첫 번째로 Have you ever seen은 현재완료 경험 용법이에요. have 다음에 과거분사 seen이 오고, ever가 끼어서 지금까지 한 번이라도라는 뜻을 만들어 줍니다. 두 번째로 전치사 in은 캔이라는 공간 안에 담겨 있다는 의미로 쓰였으니 캔에 들어 있는으로 해석하면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 익숙할 수 있지만\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">While \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">may \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">familiar \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">종이 팩이나 플라스틱 병에 들어 있는 우유에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">with\u003c/span> milk in cartons or plastic bottles,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 아마 그것을 본 적이 없을 것이다\u003c/span>\u003cspan class=\"en\">you probably \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">haven't \u003c/span>\u003cspan class=\"tgt\">seen\u003c/span> it\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">캔에 들어 있는\u003c/span>\u003cspan class=\"en\">in cans.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">당신은 종이 팩이나 플라스틱 병에 들어 있는 우유에 익숙할 수 있지만, 아마도 캔에 들어 있는 우유를 본 적이 없을 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 우유는 보통 팩이나 병에 담긴다는 \u003cb class=\"key\">일반 \u003c/b>\u003cb class=\"key\">상식\u003c/b>을 먼저 인정한 뒤, 캔에 든 우유는 낯설다는 점을 \u003cb class=\"key\">대조\u003c/b>로 부각하는 문장이에요. 대명사 it은 앞에 나온 \u003cb class=\"key\">milk\u003c/b>를 가리키고, probably와 haven't seen이 '아마 본 적이 없을 것'이라는 조심스러운 추측을 만들어 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">양보의 접속사 while\u003c/span> : While + 주어 + 동사, 주어 + 동사 (~이지만, ~인 반면에) : \"당신은 ~에 익숙할 수 있지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">형용사 + 전치사 관용표현\u003c/span> : be familiar with + 명사 (~에 익숙하다) : \"~에 익숙하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">현재완료(경험) 부정문\u003c/span> : have/has not + p.p. : \"본 적이 없다\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"While you may be familiar, 당신은 익숙할 수 있지만. with milk in cartons or plastic bottles, 종이 팩이나 플라스틱 병에 들어 있는 우유에. you probably haven't seen it, 당신은 아마 그것을 본 적이 없을 것이다. in cans, 캔에 들어 있는. 이 문장 전체를 해석하면, 당신은 종이 팩이나 플라스틱 병에 들어 있는 우유에 익숙할 수 있지만, 아마도 캔에 들어 있는 우유를 본 적이 없을 것이다.","hl":"m"},{"n":17,"text":"이 문장은 우리가 아는 일반 상식을 먼저 인정해 주고, 그다음에 캔에 든 우유는 낯설다는 점을 대조로 보여 줍니다. 여기서 it은 앞에 나온 milk를 가리키는 대명사예요. probably를 넣어서 단정하지 않고 아마도라고 조심스럽게 말하고 있습니다.","hl":"mn"},{"n":18,"text":"첫 번째로 While은 여기서 동안이 아니라 이지만이라는 뜻의 양보 접속사예요. 앞뒤 내용이 반대 방향이라서 그렇게 읽어야 합니다. 두 번째로 be familiar with는 ~에 익숙하다라는 관용 표현이니 with를 빠뜨리지 마세요. 세 번째로 haven't seen은 지금까지의 경험을 말하는 현재완료 부정형입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">are\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">흥미로운 이유들이\u003c/span>\u003cspan class=\"en\">interesting reasons\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것에 대한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">this\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것에 대한 흥미로운 이유들이 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 말한 '캔에 든 우유를 보기 힘든 현상'에 대한 \u003cb class=\"key\">원인\u003c/b>을 곧 제시하겠다고 예고하는 \u003cb class=\"key\">연결\u003c/b> 문장이에요. 지시대명사 this는 앞 문장 전체, 즉 캔 우유가 낯설다는 내용을 가리킵니다. 뒤에 나올 이유들을 나열하는 \u003cb class=\"key\">도입\u003c/b> 역할을 하죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">There is/are 존재 구문(유도부사)\u003c/span> : There + be동사 + 주어 (~이 있다) : \"~들이 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지시대명사 this\u003c/span> : 전치사 + this (앞의 내용 전체를 지시) : \"이것에 대한\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"There are, 있다. interesting reasons, 흥미로운 이유들이. for this, 이것에 대한. 이 문장 전체를 해석하면, 이것에 대한 흥미로운 이유들이 있다.","hl":"m"},{"n":20,"text":"이 문장은 앞에서 던진 질문에 대한 답을 곧 시작하겠다고 알려 주는 연결 문장이에요. this는 앞 문장 전체, 그러니까 캔에 든 우유를 본 적이 없다는 내용을 통째로 가리킵니다. 그래서 다음 문장부터 이유가 줄줄이 나올 것이라고 예고하는 셈이죠.","hl":"mn"},{"n":21,"text":"첫 번째로 There are는 무엇이 있다는 뜻을 전하는 존재 구문이에요. 진짜 주어인 reasons가 뒤에 있으니까 복수에 맞춰 are를 쓴 겁니다. 두 번째로 for this의 this는 지시대명사로 앞 문장 전체를 받아요. 그래서 이것에 대한이라고만 해석하지 말고 앞 내용을 떠올리며 읽는 게 중요합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우유는 온도에 매우 민감하고\u003c/span>\u003cspan class=\"en\">Milk \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">very \u003c/span>\u003cspan class=\"tgt\">sensitive \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">temperature\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 보관되어야 한다\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">must \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">stored\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">섭씨 0도에서 4도 사이의 온도에서\u003c/span>\u003cspan class=\"en\">at temperatures \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">between \u003c/span>\u003cspan class=\"tgt\">0 \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">4 \u003c/span>\u003cspan class=\"tgt\">degrees \u003c/span>\u003cspan class=\"tgt\">Celsius\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우유는 온도에 매우 민감하고 섭씨 0도에서 4도 사이의 온도에서 보관되어야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 캔 우유를 만들기 어려운 이유를 본격적으로 제시하는 첫 문장이에요. 우유는 \u003cb class=\"key\">민감\u003c/b>한 식품이라서 섭씨 0도에서 4도 사이의 좁은 온도 범위를 반드시 지켜야 한다는 점을 말하고 있죠. 이 조건이 뒤에 나오는 캔의 열전도성 문제와 바로 이어지도록 흐름을 여는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be sensitive to 구문(형용사 + 전치사)\u003c/span> : [주어] + be [형용사] + to + [명사]: be sensitive to + 대상 : \"온도에 매우 민감하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 must + 수동태\u003c/span> : must + be + [과거분사(stored)] : \"보관되어야 한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 between A and B\u003c/span> : between + [A] + and + [B] : \"섭씨 0도에서 4도 사이\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"Milk is very sensitive to temperature, 우유는 온도에 매우 민감하고. and must be stored, 그리고 보관되어야 한다. at temperatures between 0 and 4 degrees Celsius, 섭씨 0도에서 4도 사이의 온도에서. 이 문장 전체를 해석하면, 우유는 온도에 매우 민감하고 섭씨 0도에서 4도 사이의 온도에서 보관되어야 한다.","hl":"m"},{"n":23,"text":"이 문장은 우유를 캔에 담기 어려운 이유를 처음으로 꺼내는 문장이에요. 우유는 민감한 식품이라서 섭씨 0도에서 4도 사이의 온도를 지켜야만 한다는 거죠. 이런 조건이 뒤에 나오는 캔 이야기와 자연스럽게 이어지도록 흐름을 열어 주는 역할을 해요.","hl":"mn"},{"n":24,"text":"첫 번째로 is very sensitive to temperature에서 sensitive to는 온도에 민감하다라는 뜻을 만드는 형용사 표현이에요. 두 번째로 must be stored는 조동사 must 뒤에 be동사와 과거분사가 온 수동태로, 우유가 보관되는 대상이라는 점을 보여 주죠. 세 번째로 between 0 and 4 degrees Celsius는 between A and B, 곧 A와 B 사이를 뜻하는 전치사 표현이고 degrees Celsius는 섭씨 온도 단위랍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">불행히도\u003c/span>\u003cspan class=\"en\">Unfortunately,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">캔은 우유를 빨리 상하게 만들 수 있다\u003c/span>\u003cspan class=\"en\">cans \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">milk \u003c/span>\u003cspan class=\"tgt\">go \u003c/span>\u003cspan class=\"tgt\">bad\u003c/span> quickly\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜냐하면 캔은 열을 잘 전달하기 때문에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">because \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">conduct \u003c/span>\u003cspan class=\"tgt\">heat \u003c/span>\u003cspan class=\"tgt\">well\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">불행히도, 캔은 열을 잘 전달하기 때문에 우유를 빨리 상하게 만들 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 캔이 우유에 적합하지 않은 첫 번째 이유를 알려 주는 문장이에요. 캔은 열을 잘 전달하는 재질이라서, 우유가 상하지 않게 지켜야 하는 \u003cb class=\"key\">저온\u003c/b> 조건을 오히려 깨뜨린다는 거죠. 앞 문장의 온도 민감성 설명을 캔의 재질 문제와 바로 연결해 주고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">사역동사 make 5형식(목적격보어로 동사원형)\u003c/span> : make + [목적어(milk)] + [동사원형(go bad)] : \"우유를 빨리 상하게 만들 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이유를 나타내는 접속사 because\u003c/span> : [주절] + because + [이유 절(주어 + 동사)] : \"왜냐하면 캔은 열을 잘 전달하기 때문에\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"Unfortunately, 불행히도. cans can make milk go bad quickly, 캔은 우유를 빨리 상하게 만들 수 있다. because they conduct heat well, 왜냐하면 캔은 열을 잘 전달하기 때문에. 이 문장 전체를 해석하면, 불행히도, 캔은 열을 잘 전달하기 때문에 우유를 빨리 상하게 만들 수 있다.","hl":"m"},{"n":26,"text":"캔이 우유를 상하게 하는 이유를 알려 주는 문장이에요. 캔은 열을 잘 전달하는 재질이라서 우유가 상하기 좋은 환경을 만들어 버린다는 뜻이죠. 앞 문장에서 강조한 온도 민감성과 바로 맞물리는 내용이라서 흐름이 아주 자연스러워요.","hl":"mn"},{"n":27,"text":"첫 번째로 can make milk go bad는 사역동사 make가 목적어 milk와 동사원형 go bad를 데리고 온 오 형식 구조예요. 목적어를 어떤 상태가 되게 만든다는 뜻으로 읽으면 돼요. 두 번째로 because they conduct heat well은 이유를 이끄는 접속사 절이고, conduct heat은 열을 전달하다라는 뜻으로 쓰였어요. go bad가 상하다라는 동사구라는 점도 함께 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">게다가\u003c/span>\u003cspan class=\"en\">Furthermore,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 캔 식품들은 높은 온도에서 가열되고\u003c/span>\u003cspan class=\"en\">many canned foods \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">heated \u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">high \u003c/span>\u003cspan class=\"tgt\">temperatures\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">높은 압력에 노출된다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">exposed \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">high \u003c/span>\u003cspan class=\"tgt\">pressures\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">게다가, 많은 캔 식품들은 높은 온도에서 가열되고 높은 압력에 노출된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 캔 제품의 제조 공정 자체가 우유에 해롭다는 점을 덧붙이는 문장이에요. 통조림은 고온과 고압을 견디는 과정을 거치는데, 우유에 이 과정을 적용하면 갈변 때문에 맛과 성질이 변해 버린다는 내용으로 이어지죠. Furthermore로 앞 문장의 이유에 하나를 더 보태고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태(be동사 + 과거분사)\u003c/span> : be + [과거분사(heated)] + at + [온도] : \"높은 온도에서 가열된다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태구의 병렬(be동사 생략)\u003c/span> : are heated + and + (are) exposed to + [명사] : \"그리고 높은 압력에 노출된다\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"Furthermore, 게다가. many canned foods are heated at high temperatures, 많은 캔 식품들은 높은 온도에서 가열되고. and exposed to high pressures, 높은 압력에 노출된다. 이 문장 전체를 해석하면, 게다가, 많은 캔 식품들은 높은 온도에서 가열되고 높은 압력에 노출된다.","hl":"m"},{"n":29,"text":"캔 제품의 제조 과정이 우유에는 잘 맞지 않는다는 점을 덧붙이는 문장이에요. 대부분의 캔 식품은 고온과 고압을 견디는 과정을 거치게 되죠. 우유가 이런 과정을 지나면 갈변 때문에 맛과 성질이 변한다는 다음 내용으로 자연스럽게 이어져요.","hl":"mn"},{"n":30,"text":"첫 번째로 are heated at high temperatures는 be동사와 과거분사로 만든 수동태예요. 캔 식품이 가열되는 대상이라는 점을 꼭 챙기세요. 두 번째로 and exposed to high pressures는 앞의 are heated와 병렬로 묶이면서 be동사가 생략된 구조예요. be exposed to는 노출되다라는 뜻의 관용 표현이니 한 덩어리로 외워 두면 좋아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만\u003c/span>\u003cspan class=\"en\">But\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우유가 이 과정을 거치면,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">milk \u003c/span>\u003cspan class=\"tgt\">goes \u003c/span>\u003cspan class=\"tgt\">through \u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">process\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 바꿀 수 있다\u003c/span>\u003cspan class=\"en\">it \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">change\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">맛과 특성을\u003c/span>\u003cspan class=\"en\">the taste and properties\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우유의\u003c/span>\u003cspan class=\"en\">of the milk\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">갈변으로 인해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">due \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">browning\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 우유가 이 과정을 거치면, 갈변으로 인해 우유의 맛과 특성을 바꿀 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 캔 우유가 왜 매력적이지 않은지 설명하는 흐름에서, 고온·고압 살균 과정이 우유의 \u003cb class=\"key\">맛과 \u003c/b>\u003cb class=\"key\">특성\u003c/b>을 변화시킬 수 있다는 점을 덧붙입니다. \u003cb class=\"key\">갈변\u003c/b>은 열 때문에 색이 변하고 풍미가 달라지는 현상으로, 캔 가공이 우유에 부정적 영향을 준다는 근거예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 when의 시간 부사절\u003c/span> : [[when]] + [주어 milk] + [동사 goes through] + [목적어 this process] : \"우유가 이 과정을 거치면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 can + 동사원형\u003c/span> : [can] + [동사원형 change] : \"바꿀 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사구 due to + 명사\u003c/span> : [[due to]] + [명사구 browning] : \"갈변으로 인해\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"But, 하지만. when milk goes through this process, 우유가 이 과정을 거치면. it can change, 그것은 바꿀 수 있다. the taste and properties, 맛과 특성을. of the milk, 우유의. due to browning, 갈변으로 인해. 이 문장 전체를 해석하면, 하지만 우유가 이 과정을 거치면, 갈변으로 인해 우유의 맛과 특성을 바꿀 수 있다.","hl":"m"},{"n":32,"text":"이 문장은 캔 우유가 왜 덜 매력적인지 설명하는 흐름에서, 열처리 과정이 우유의 맛과 특성을 바꿀 수 있다는 점을 말해요. 여기서 갈변은 열 때문에 색과 풍미가 달라지는 현상으로, 캔 가공이 우유에 부정적인 영향을 준다는 근거가 됩니다.","hl":"mn"},{"n":33,"text":"첫 번째로 when milk goes through this process에서 when은 우유가 이 과정을 거칠 때라는 시간을 나타내는 접속사예요. 두 번째로 can change에서 can은 가능성을 나타내고 뒤에 동사원형 change가 와요. 세 번째로 due to browning에서 due to는 갈변으로 인해라는 원인을 나타내는 전치사구입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 9\u003c/div>\u003cdiv data-h >\u003cspan class=\"gn\">비교급 than의 비교 대상과 or 병렬\u003c/span> : [비교급 more expensive] + [than + 비교 대상] : \"종이 팩이나 플라스틱 병보다\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"Additionally, 게다가. cans are more expensive, 캔은 더 비싸다. to produce, 생산하는 것이. than cartons or plastic bottles, 종이 팩이나 플라스틱 병보다. 이 문장 전체를 해석하면, 게다가, 캔은 종이 팩이나 플라스틱 병보다 생산하는 것이 더 비싸다.","hl":"m"},{"n":35,"text":"이 문장은 캔 우유가 잘 나오지 않는 또 하나의 이유로 생산 비용을 제시해요. 캔이 종이 팩이나 플라스틱 병보다 생산하는 것이 더 비싸다는 비교 표현을 통해 경제성이 떨어진다는 점을 강조합니다.","hl":"mn"},{"n":36,"text":"첫 번째로 more expensive는 more를 붙여 만든 비교급이에요. 두 번째로 to produce는 생산하는 데라는 뜻으로 형용사 expensive의 판단 기준을 보충하는 to부정사입니다. 세 번째로 than cartons or plastic bottles에서 than 뒤에는 비교 대상이 오고, cartons와 plastic bottles는 or로 병렬 연결됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우유 생산자들이 캔 우유를 생산할 수는 있지만,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Although \u003c/span>\u003cspan class=\"tgt\">milk \u003c/span>\u003cspan class=\"tgt\">producers \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">could \u003c/span>\u003cspan class=\"tgt\">produce \u003c/span>\u003cspan class=\"tgt\">canned \u003c/span>\u003cspan class=\"tgt\">milk\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">위에서 언급한 이유\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">reasons \u003c/span>\u003cspan class=\"tgt\">mentioned \u003c/span>\u003cspan class=\"tgt\">above\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 적절한 포장 시설의 부족은\u003c/span>\u003cspan class=\"en\">and a lack of proper packaging facilities\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 덜 매력적인 선택으로 만든다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">less \u003c/span>\u003cspan class=\"tgt\">attractive \u003c/span>\u003cspan class=\"tgt\">option\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우유 생산자들이 캔 우유를 생산할 수는 있지만, 위에서 언급한 이유와 적절한 포장 시설의 부족은 그것을 덜 매력적인 선택으로 만든다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글의 결론으로, 캔 우유 생산이 기술적으로 불가능한 것은 아니지만 여러 \u003cb class=\"key\">단점\u003c/b>과 \u003cb class=\"key\">포장 \u003c/b>\u003cb class=\"key\">시설 \u003c/b>\u003cb class=\"key\">부족\u003c/b> 때문에 선택되지 않는다는 점을 정리합니다. Although로 양보를 표현한 뒤, 앞에서 든 이유들을 주어로 묶어 \u003cb class=\"key\">덜 \u003c/b>\u003cb class=\"key\">매력적인 \u003c/b>\u003cb class=\"key\">선택\u003c/b>이라는 평가를 내려요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">양보의 접속사 although\u003c/span> : [[Although]] + [주어 milk producers] + [조동사 could] + [동사원형 produce] : \"우유 생산자들이 캔 우유를 생산할 수는 있지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 could + 동사원형\u003c/span> : [could] + [동사원형 produce] : \"생산할 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">과거분사 mentioned의 명사 수식\u003c/span> : [명사 the reasons] + [과거분사 mentioned] + [부사 above] : \"위에서 언급한 이유\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">5형식 동사 make + 목적어 + 목적격 보어\u003c/span> : [make] + [목적어 it] + [목적격 보어 a less attractive option] : \"그것을 덜 매력적인 선택으로 만든다\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"Although milk producers could produce canned milk, 우유 생산자들이 캔 우유를 생산할 수는 있지만. the reasons mentioned above, 위에서 언급한 이유. and a lack of proper packaging facilities, 그리고 적절한 포장 시설의 부족은. make it a less attractive option, 그것을 덜 매력적인 선택으로 만든다. 이 문장 전체를 해석하면, 우유 생산자들이 캔 우유를 생산할 수는 있지만, 위에서 언급한 이유와 적절한 포장 시설의 부족은 그것을 덜 매력적인 선택으로 만든다.","hl":"m"},{"n":38,"text":"이 문장은 글의 결론으로, 캔 우유 생산이 기술적으로 불가능한 것은 아니지만 여러 단점과 포장 시설 부족 때문에 선택되지 않는다는 점을 정리해요. Although로 양보를 표현한 뒤, 앞에서 든 이유들을 주어로 묶어 덜 매력적인 선택이라는 평가를 내립니다.","hl":"mn"},{"n":39,"text":"첫 번째로 Although milk producers could produce canned milk에서 although는 양보를 나타내는 접속사예요. 두 번째로 could produce에서 could는 가능성을 나타내고 뒤에 동사원형 produce가 와요. 세 번째로 the reasons mentioned above에서 mentioned는 과거분사로 the reasons를 뒤에서 수식하며 수동의 의미를 냅니다. 네 번째로 make it a less attractive option은 make가 목적어 it과 목적격 보어 a less attractive option을 취하는 오형식 구조입니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>우유는 온도에 매우 민감해 섭씨 0도에서 4도 사이에서 \u003cb class=\"key\">보관\u003c/b>되어야 한다.\u003c/li>\u003cli>캔은 \u003cb class=\"key\">열 \u003c/b>\u003cb class=\"key\">전도\u003c/b>가 잘되어 우유를 빨리 상하게 하고, 고온·고압 \u003cb class=\"key\">과정\u003c/b>에서 \u003cb class=\"key\">갈변\u003c/b>이 생겨 맛과 특성을 바꾼다.\u003c/li>\u003cli>게다가 캔은 종이 팩이나 플라스틱 병보다 \u003cb class=\"key\">생산 \u003c/b>\u003cb class=\"key\">비용\u003c/b>이 더 비싸다.\u003c/li>\u003cli>이런 이유들과 \u003cb class=\"key\">포장 \u003c/b>\u003cb class=\"key\">시설\u003c/b>의 부족 때문에 캔 우유는 덜 \u003cb class=\"key\">매력적인 \u003c/b>\u003cb class=\"key\">선택\u003c/b>이 된다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Milk is rarely sold in cans because cans conduct heat well, high-temperature processing causes browning that changes its taste and properties, and canning is more expensive and requires proper packaging facilities.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: 우유는 온도에 매우 민감해 저온에서 보관되어야 하는데, 캔은 \u003cb class=\"key\">열 \u003c/b>\u003cb class=\"key\">전도\u003c/b>가 잘되어 우유를 빨리 상하게 하고 고온·고압 과정에서 \u003cb class=\"key\">갈변\u003c/b>이 생겨 맛과 특성을 바꾼다. 여기에 \u003cb class=\"key\">생산 \u003c/b>\u003cb class=\"key\">비용\u003c/b>과 \u003cb class=\"key\">포장 \u003c/b>\u003cb class=\"key\">시설\u003c/b>의 부족까지 더해져 캔 우유는 덜 매력적인 선택이 된다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":40,"text":"오늘 글은 우유를 캔에 담지 않는 이유를 온도, 갈변, 비용이라는 세 가지 근거로 설명했어요. 질문으로 시작해서 근거를 열거하고 결론으로 묶는 두괄식 구조를 꼭 기억해 두세요. 신호어를 따라가며 근거를 세는 연습을 하면 비슷한 글도 훨씬 쉽게 읽힐 거예요. 수고했어요, 다음 시간에 또 만나요.","hl":null}]}]});</script></body></html>
