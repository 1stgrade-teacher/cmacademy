t-size:13px;color:#9b9484;margin-bottom:8px}.lec-chunks{display:flex;flex-wrap:wrap;gap:22px 16px;margin-bottom:16px}.lec-chunk{display:flex;flex-direction:column;align-items:flex-start}.lec-chunk .ko{font-size:13.5px;color:#ffd9a0;font-weight:700;margin-bottom:0;line-height:1.25}.lec-chunk .en{font-size:25px;color:#f4f1ea;font-weight:700;line-height:1.3}.lec-chunk .en .grammar-hl{background:transparent;border:0;padding:0;color:#ffe08a;font-weight:800;text-decoration:underline;text-decoration-color:#ffb347;text-decoration-thickness:2px;text-underline-offset:3px}.lec-sent-en{font-size:25px;font-weight:700;line-height:1.35;margin-bottom:12px;color:#fff}.lec-sent-ko{font-size:15px;color:#ffd9a0;line-height:1.4;margin-bottom:12px}.lec-grammar{font-size:15px;color:#d2ccbc;line-height:1.4;background:#211f18;border-left:3px solid #4338CA;border-radius:6px;padding:9px 13px;margin-top:8px}.lec-grammar.lec-meaning{border-left-color:#ffd9a0}.lec-gr-h{display:inline-block;font-weight:800;color:#9aa8ff;margin-right:4px}.lec-gr-item{margin:2px 0}.lec-grammar .lec-gr-item+.lec-gr-item{margin-top:3px}.lec-voca-list{list-style:none;margin:10px 0 0;padding:0;columns:2;column-gap:28px}.lec-voca-list li{font-size:15px;line-height:1.5;color:#ddd7c7;break-inside:avoid}.lec-voca-list li:before{content:"\2022 ";color:#9b9484}.lec-voca-list .w{font-weight:700;color:#fff}.lec-voca-list .m{color:#c7c1b1}.lec-section-tag{font-size:13px;font-weight:800;letter-spacing:.05em;color:#9b9484;margin-bottom:10px;text-transform:uppercase}.lec-sum-body{display:flex;gap:24px;flex:1;min-height:0;align-items:flex-start}.lec-sum-img{flex:0 0 42%;max-width:42%;align-self:stretch;display:flex;align-items:center;justify-content:center;background:#211f18;border-radius:10px;overflow:hidden}.lec-sum-img img{width:100%;height:100%;object-fit:contain}.lec-sum-text{flex:1;min-width:0}.lec-summary-bullets{font-size:17px;line-height:1.7;color:#ddd7c7;padding-left:20px}.lec-summary-line{font-size:19px;color:#ffd9a0;margin:6px 0 16px;line-height:1.45}.lec-hl{background:rgba(255,196,84,.22);box-shadow:0 0 26px 6px rgba(255,178,54,.36);border-radius:10px;transition:background .18s ease,box-shadow .18s ease}@media (max-width:680px){html,body{height:auto;min-height:100%}.stage{width:100vw;height:100vh;height:100dvh;margin:0;border-radius:0;box-shadow:none}.top{padding:9px 14px;font-size:13px}.slide{padding:16px 15px}.bar{padding:9px 11px;gap:7px}button{padding:8px 11px;font-size:13px}.cnt{font-size:12px}.lec-cover-title{font-size:21px;line-height:1.25}.lec-cover-title small{font-size:13.5px;margin-top:4px}.lec-cover-body,.lec-sum-body{flex-direction:column;gap:13px;align-items:stretch}.lec-cover-img,.lec-sum-img{flex:0 0 auto;width:100%;max-width:100%;max-height:30vh;align-self:auto}.lec-flow{overflow:visible}.lec-stage{padding:9px 12px;margin-bottom:7px}.lec-stage-head{font-size:14px}.lec-stage ul{font-size:13px;padding-left:16px;line-height:1.5}.lec-sent-no{font-size:12.5px;margin-bottom:6px}.lec-chunks{gap:13px 12px;margin-bottom:12px}.lec-chunk .en{font-size:18px;line-height:1.3}.lec-chunk .ko{font-size:12.5px}.lec-sent-en{font-size:18px;line-height:1.35;margin-bottom:9px}.lec-sent-ko{font-size:13.5px;margin-bottom:9px}.lec-grammar,.lec-grammar.lec-meaning{font-size:13.5px;padding:8px 11px}.lec-voca-list{columns:1;margin-top:8px}.lec-voca-list li{font-size:14px;line-height:1.45}.lec-section-tag{font-size:12px;margin-bottom:8px}.lec-summary-bullets{font-size:15px;line-height:1.6}.lec-summary-line{font-size:16px;margin:5px 0 12px}}</style></head><body><div class="stage"><div class="top">AI 강의</div><div class="slide" id="s"></div><div class="bar"><div class="tl" id="tl"><i id="fill"></i></div><span class="cnt" id="c"></span><button onclick="go(-1)">◀</button><button class="pl" id="pp" onclick="toggle()">▶ 재생</button><button onclick="go(1)">▶</button></div></div><script>var D={"slides":["<div class=\"lec-cover-title\">Why Milk Is Not Sold in Cans<small>왜 우유는 캔에 담겨 판매되지 않는가</small></div>\n        <div class=\"lec-cover-body\"><div class=\"lec-flow\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01일상의 의문 제기</div><ul><li>종이 팩이나 플라스틱 병과 달리 캔에 담긴 우유를 보기 어려운 현상을 제시한다.</li><li>대중적인 포장재: 종이 팩(cartons)과 플라스틱 병(plastic bottles)</li><li>드문 사례: 캔(can)에 들어 있는 우유</li><li>핵심 키워드: 익숙함(familiar)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02온도 민감성과 열전도율</div><ul><li>우유는 온도에 매우 민감하며 캔의 높은 열전도율은 우유의 변질을 유도한다.</li><li>적정 보관 온도: 섭씨 0도에서 4도(0 and 4 degrees Celsius)</li><li>캔의 특성: 열을 잘 전달함(conduct heat well)</li><li>결과: 우유가 빨리 상하게 됨(go bad quickly)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03가공 과정의 부작용</div><ul><li>통조림을 만드는 고온 고압의 처리 과정이 우유의 성질을 변화시킨다.</li><li>가공 방식: 고온 및 고압(high temperatures and pressures) 노출</li><li>화학적 변화: 갈변 현상(browning) 발생</li><li>결과: 우유의 맛과 성질(taste and properties)이 변함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04경제성 및 인프라의 한계</div><ul><li>비싼 생산 비용과 전용 시설의 부족으로 인해 캔 우유는 사업성이 떨어진다.</li><li>비용 문제: 캔의 높은 생산 비용(more expensive to produce)</li><li>인프라 부족: 적절한 포장 시설(proper packaging facilities)의 결여</li><li>결론: 생산자에게 매력적이지 않은 선택지(less attractive option)</li></ul></div></div></div>","<div class=\"lec-section-tag\">단어 정리</div><ul class=\"lec-voca-list\"><li><span class=\"w\">familiar</span> <span class=\"m\">익숙한</span></li><li><span class=\"w\">sensitive</span> <span class=\"m\">민감한</span></li><li><span class=\"w\">store</span> <span class=\"m\">보관하다</span></li><li><span class=\"w\">go bad</span> <span class=\"m\">상하다</span></li><li><span class=\"w\">conduct</span> <span class=\"m\">(열, 전기를) 전도하다</span></li><li><span class=\"w\">expose</span> <span class=\"m\">노출시키다</span></li><li><span class=\"w\">go through</span> <span class=\"m\">겪다, 거치다</span></li><li><span class=\"w\">process</span> <span class=\"m\">과정, 절차</span></li><li><span class=\"w\">property</span> <span class=\"m\">성질, 특성</span></li><li><span class=\"w\">browning</span> <span class=\"m\">갈변 (현상)</span></li><li><span class=\"w\">mention</span> <span class=\"m\">언급하다</span></li><li><span class=\"w\">lack</span> <span class=\"m\">부족, 결핍</span></li><li><span class=\"w\">proper</span> <span class=\"m\">적절한, 올바른</span></li><li><span class=\"w\">facility</span> <span class=\"m\">시설, 설비</span></li><li><span class=\"w\">attractive</span> <span class=\"m\">매력적인</span></li></ul>","<div class=\"lec-sent-no\">문장 1 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신은 본 적이 있는가</span><span class=\"en\"><b><span class=\"grammar-hl\">Have you ever seen</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우유를</span><span class=\"en\"><b>milk</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">캔에 들어 있는</span><span class=\"en\"><b>in a can?</b></span></div></div><div class=\"lec-sent-ko\">당신은 캔에 들어 있는 우유를 본 적이 있는가?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자에게 친숙하지 않은 상황을 질문으로 던지며 글의 소재인 &#39;캔 우유&#39;에 대한 호기심을 유발하고 주제를 도입합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Have you ever seen (현재완료): &#39;have + 주어 + p.p.&#39; 형태의 의문문으로, 과거부터 현재까지의 &#39;경험&#39;을 묻는 용법으로 쓰였다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신이 익숙할 수 있지만</span><span class=\"en\"><b>While you may <span class=\"grammar-hl\">be familiar</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우유에</span><span class=\"en\"><b><span class=\"grammar-hl\">with</span> milk</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">종이 팩이나 플라스틱 병에 들어 있는</span><span class=\"en\"><b>in cartons or plastic bottles,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신은 아마도 그것을 본 적이 없을 것이다</span><span class=\"en\"><b>you probably haven’t seen it</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">캔 안에서</span><span class=\"en\"><b>in cans.</b></span></div></div><div class=\"lec-sent-ko\">당신은 종이 팩이나 플라스틱 병에 들어 있는 우유에 익숙할 수 있지만, 아마도 캔에 들어 있는 우유를 본 적이 없을 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 우리가 흔히 보는 우유 용기(종이팩, 플라스틱)와 대조되는 &#39;캔&#39;이라는 소재를 부각하며, 캔 우유가 왜 드문지에 대한 의문을 구체화합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">be familiar with (관용표현): &#39;~에 익숙하다/친숙하다&#39;라는 의미로, 주어가 특정 대상에 대해 잘 알고 있는 상태를 나타낸다.</div></div>\n        <ul class=\"lec-voca-list\"><li><span class=\"w\">familiar</span> <span class=\"m\">익숙한</span></li></ul>","<div class=\"lec-sent-no\">문장 3 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">~이 있다</span><span class=\"en\"><b>There are</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">흥미로운 이유들이</span><span class=\"en\"><b><span class=\"grammar-hl\">interesting</span> reasons</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이것에 대한</span><span class=\"en\"><b>for this.</b></span></div></div><div class=\"lec-sent-ko\">이것에 대한 흥미로운 이유들이 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 제기한 현상(캔 우유가 없는 이유)에 대해 이제부터 본격적인 근거들을 나열하겠다는 신호를 주는 전환 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">interesting (현재분사(형용사)): interesting이 명사인 reasons를 앞에서 수식하여 &#39;흥미로운 이유들&#39;이라는 능동의 의미를 나타낸다. (reasons that are interesting)</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우유는 ~이다</span><span class=\"en\"><b>Milk is</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매우 민감한</span><span class=\"en\"><b>very sensitive</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">온도에</span><span class=\"en\"><b>to temperature</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 보관되어야 한다</span><span class=\"en\"><b>and <span class=\"grammar-hl\">must be stored</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">온도에서</span><span class=\"en\"><b>at temperatures</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">섭씨 0도에서 4도 사이의</span><span class=\"en\"><b>between 0 and 4 degrees Celsius.</b></span></div></div><div class=\"lec-sent-ko\">우유는 온도에 매우 민감하고 섭씨 0도에서 4도 사이의 온도에서 보관되어야 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 첫 번째 이유인 &#39;온도 민감성&#39;을 설명하기 위해 우유의 생물학적 특성을 먼저 제시합니다. 이는 다음 문장에서 캔의 열전도율과 연결되는 논리적 기초가 됩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">must be stored (수동태): 조동사(must) 뒤에 be동사(be)+p.p.(stored)가 결합된 구조. store는 타동사인데 뒤에 직접적인 목적어가 없어서 수동구조 be stored 형태로 쓴다. 기본구조: store + O (O를 저장하다)</div></div>\n        <ul class=\"lec-voca-list\"><li><span class=\"w\">sensitive</span> <span class=\"m\">민감한</span></li><li><span class=\"w\">store</span> <span class=\"m\">보관하다</span></li></ul>","<div class=\"lec-sent-no\">문장 5 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">불행히도</span><span class=\"en\"><b>Unfortunately,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">캔은 만들 수 있다</span><span class=\"en\"><b>cans can <span class=\"grammar-hl\">make</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우유가 빨리 상하게</span><span class=\"en\"><b><span class=\"grammar-hl\">milk go bad</span> quickly</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들이 전달하기 때문에</span><span class=\"en\"><b>because they conduct</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">열을 잘</span><span class=\"en\"><b>heat well.</b></span></div></div><div class=\"lec-sent-ko\">불행히도, 캔은 열을 잘 전달하기 때문에 우유를 빨리 상하게 만들 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 우유의 온도 민감성과 &#39;열전도가 잘 되는 캔의 물리적 특성&#39;을 결합하여, 캔이 우유 보관에 부적합한 첫 번째 이유(부패 위험)를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">make milk go bad 5형식(SVOC) 구조: 사역동사(make) + 목적어(milk) + 목적격보어(동사원형 go bad) 구조로, 목적어가 보어의 동작을 하게 만드는 인과 관계를 나타낸다.</div><div class=\"lec-gr-item\">go bad (관용표현): 음식이 &#39;상하다&#39; 혹은 상태가 &#39;나빠지다&#39;라는 의미로 쓰이는 이디엄이다.</div></div>\n        <ul class=\"lec-voca-list\"><li><span class=\"w\">go bad</span> <span class=\"m\">상하다</span></li><li><span class=\"w\">conduct</span> <span class=\"m\">(열, 전기를) 전도하다</span></li></ul>","<div class=\"lec-sent-no\">문장 6 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">게다가</span><span class=\"en\"><b>Furthermore,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 캔 식품들은</span><span class=\"en\"><b>many <span class=\"grammar-hl\">canned foods</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가열된다</span><span class=\"en\"><b>are heated</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">높은 온도에서</span><span class=\"en\"><b>at high temperatures</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 노출된다</span><span class=\"en\"><b>and exposed</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">높은 압력에</span><span class=\"en\"><b>to high pressures.</b></span></div></div><div class=\"lec-sent-ko\">게다가, 많은 캔 식품들은 높은 온도에서 가열되고 높은 압력에 노출된다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> &#39;Furthermore&#39;를 통해 추가적인 이유를 제시합니다. 통조림 제조 공정(고온·고압)의 일반적인 특징을 설명하며 논의를 확장합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">canned foods (과거분사(형용사)): canned가 명사 foods를 앞에서 수식하여 &#39;통조림에 담긴 식품&#39;이라는 의미를 나타낸다. (foods that are canned)</div><div class=\"lec-gr-item\">are heated ... and exposed (수동태): be동사(are)에 과거분사 heated와 exposed가 병렬로 연결된 구조. heat와 expose는 모두 타동사인데 뒤에 목적어가 없어서 수동구조 are heated / are exposed 형태로 쓴다. 기본구조: heat + O (O를 가열하다), expose + O (O를 노출시키다)</div></div>\n        <ul class=\"lec-voca-list\"><li><span class=\"w\">expose</span> <span class=\"m\">노출시키다</span></li></ul>","<div class=\"lec-sent-no\">문장 7 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만</span><span class=\"en\"><b>But</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우유가 거칠 때</span><span class=\"en\"><b>when milk <span class=\"grammar-hl\">goes through</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 과정을</span><span class=\"en\"><b>this process,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 바꿀 수 있다</span><span class=\"en\"><b>it can change</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">맛과 특성을</span><span class=\"en\"><b>the taste and properties</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우유의</span><span class=\"en\"><b>of the milk</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">갈변으로 인해</span><span class=\"en\"><b><span class=\"grammar-hl\">due to</span> browning.</b></span></div></div><div class=\"lec-sent-ko\">하지만 우유가 이 과정을 거치면, 갈변으로 인해 우유의 맛과 특성을 바꿀 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 고온·고압 공정이 우유에 미치는 부정적 영향(갈변 및 변질)을 설명합니다. 이는 캔 용기 자체의 문제뿐만 아니라 제조 공정상의 한계를 지적하는 것입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">goes through (관용표현): &#39;go through&#39;는 특정한 과정이나 경험을 &#39;겪다&#39; 또는 &#39;거치다&#39;라는 의미의 숙어이다.</div><div class=\"lec-gr-item\">due to (관용표현): 전치사구로 뒤에 명사 browning을 동반하여 &#39;~ 때문에&#39;라는 원인이나 이유를 나타낸다.</div></div>\n        <ul class=\"lec-voca-list\"><li><span class=\"w\">process</span> <span class=\"m\">과정, 절차</span></li><li><span class=\"w\">browning</span> <span class=\"m\">갈변 (현상)</span></li><li><span class=\"w\">proper</span> <span class=\"m\">적절한, 올바른</span></li></ul>","<div class=\"lec-sent-no\">문장 8 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">게다가</span><span class=\"en\"><b>Additionally,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">캔은 ~이다</span><span class=\"en\"><b>cans are</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 비싼</span><span class=\"en\"><b>more expensive</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">생산하기에</span><span class=\"en\"><b><span class=\"grammar-hl\">to produce</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">종이 팩이나 플라스틱 병보다</span><span class=\"en\"><b>than cartons or plastic bottles.</b></span></div></div><div class=\"lec-sent-ko\">게다가, 캔은 종이 팩이나 플라스틱 병보다 생산하는 것이 더 비싸다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> &#39;Additionally&#39;를 사용하여 품질상의 문제 외에도 &#39;경제적 비용&#39;이라는 또 다른 측면의 부정적 요인을 추가합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to produce (to부정사): 부사적 용법 중 형용사 수식에 해당하며, 앞의 형용사 expensive를 수식하여 &#39;~하기에(생산하기에)&#39;라는 의미를 더한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">비록 우유 생산자들이</span><span class=\"en\"><b>Although milk producers</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">생산할 수 있을지라도</span><span class=\"en\"><b>could produce</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">캔 우유를</span><span class=\"en\"><b><span class=\"grammar-hl\">canned milk</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">위에서 언급된 이유들과</span><span class=\"en\"><b>the <span class=\"grammar-hl\">reasons mentioned</span> above</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">부족은</span><span class=\"en\"><b>and a lack</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">적절한 포장 시설의</span><span class=\"en\"><b>of proper <span class=\"grammar-hl\">packaging facilities</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것을 만든다</span><span class=\"en\"><b><span class=\"grammar-hl\">make it</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">덜 매력적인 선택으로</span><span class=\"en\"><b><span class=\"grammar-hl\">a less attractive option</span>.</b></span></div></div><div class=\"lec-sent-ko\">우유 생산자들이 캔 우유를 생산할 수는 있지만, 위에서 언급한 이유와 적절한 포장 시설의 부족은 그것을 덜 매력적인 선택으로 만든다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글 전체의 결론으로, 지금까지 언급한 과학적·경제적 이유와 더불어 설비 부족 문제까지 종합하여 왜 결국 캔 우유가 시장에서 선택받지 못하는지를 최종적으로 정리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">canned milk (과거분사(형용사)): canned가 명사 milk를 수식하여 &#39;통조림에 든 우유&#39;라는 의미를 나타낸다. (milk that is canned)</div><div class=\"lec-gr-item\">reasons mentioned (과거분사(형용사)): mentioned가 앞의 명사 reasons를 뒤에서 수식하여 &#39;언급된 이유들&#39;이라는 의미를 나타낸다. (reasons that were mentioned)</div><div class=\"lec-gr-item\">packaging facilities (동명사(명사적)): packaging(포장 작업/활동) + facilities(시설)가 결합하여 &#39;포장용 시설&#39;이라는 용도와 목적을 나타낸다.</div><div class=\"lec-gr-item\">make it a less attractive option 5형식(SVOC) 구조: 동사(make) + 목적어(it) + 목적격보어(명사구 a less attractive option) 구조로, 목적어를 특정 상태나 존재로 만든다는 의미를 나타낸다.</div></div>\n        <ul class=\"lec-voca-list\"><li><span class=\"w\">mention</span> <span class=\"m\">언급하다</span></li><li><span class=\"w\">lack</span> <span class=\"m\">부족, 결핍</span></li><li><span class=\"w\">proper</span> <span class=\"m\">적절한, 올바른</span></li><li><span class=\"w\">attractive</span> <span class=\"m\">매력적인</span></li></ul>","<div class=\"lec-section-tag\">최종 정리</div>\n        <div class=\"lec-sum-body\">\n          <div class=\"lec-sum-text\">\n            <div class=\"lec-sent-en\">Milk is rarely packaged in cans because of its high sensitivity to heat and the significant production costs involved.</div>\n            <div class=\"lec-summary-line\">우유는 열에 대한 높은 민감성과 상당한 생산 비용 때문에 캔으로 거의 포장되지 않는다.</div>\n            \n          </div>\n        </div>"],"segs":[[{"audio":"./reading02_audio/1.mp3","hl":null},{"audio":"./reading02_audio/2.mp3","hl":"stage-0"},{"audio":"./reading02_audio/3.mp3","hl":"stage-1"},{"audio":"./reading02_audio/4.mp3","hl":"stage-2"},{"audio":"./reading02_audio/5.mp3","hl":"stage-3"}],[{"audio":"./reading02_audio/6.mp3","hl":null}],[{"audio":"./reading02_audio/7.mp3","hl":"main"},{"audio":"./reading02_audio/8.mp3","hl":"meaning"},{"audio":"./reading02_audio/9.mp3","hl":"grammar"}],[{"audio":"./reading02_audio/10.mp3","hl":"main"},{"audio":"./reading02_audio/11.mp3","hl":"meaning"},{"audio":"./reading02_audio/12.mp3","hl":"grammar"}],[{"audio":"./reading02_audio/13.mp3","hl":"main"},{"audio":"./reading02_audio/14.mp3","hl":"meaning"},{"audio":"./reading02_audio/15.mp3","hl":"grammar"}],[{"audio":"./reading02_audio/16.mp3","hl":"main"},{"audio":"./reading02_audio/17.mp3","hl":"meaning"},{"audio":"./reading02_audio/18.mp3","hl":"grammar"}],[{"audio":"./reading02_audio/19.mp3","hl":"main"},{"audio":"./reading02_audio/20.mp3","hl":"meaning"},{"audio":"./reading02_audio/21.mp3","hl":"grammar"}],[{"audio":"./reading02_audio/22.mp3","hl":"main"},{"audio":"./reading02_audio/23.mp3","hl":"meaning"},{"audio":"./reading02_audio/24.mp3","hl":
