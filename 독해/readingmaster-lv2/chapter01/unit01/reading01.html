<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터2 Reading01 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-sno{font-size:13px;color:#8493A1;font-weight:700;margin-bottom:8px}

.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}

.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}
.lp-tag{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700;padding:2px 12px}

.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}

.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터2 Reading01","audioDir":"reading01_audio","preview":false,"count":46,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.520em\">Reading01\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터2\u003c/div>\u003ch1>Why We Don't Look as Good in Pictures as in the Mirror\u003c/h1>\u003ch2>왜 우리는 거울 속에서만큼 사진에서 좋아 보이지 않을까?\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>우리가 거울 속에서 볼 때만큼 사진에서 좋아 보이지 않는 이유로 \u003cb class=\"key\">거울 \u003c/b>\u003cb class=\"key\">이미지에 \u003c/b>\u003cb class=\"key\">대한 \u003c/b>\u003cb class=\"key\">익숙함\u003c/b>, 사진을 찍을 때의 \u003cb class=\"key\">긴장과 \u003c/b>\u003cb class=\"key\">어색한 \u003c/b>\u003cb class=\"key\">미소\u003c/b>, 그리고 \u003cb class=\"key\">2차원\u003c/b>으로 평면화된 사진의 특성이 제시된다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Three factors — our familiarity with the mirrored image, nervous smiles in front of a camera, and the flat, two-dimensional nature of photographs — can make us feel uncomfortable with how we look in pictures.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 왜 우리가 거울 속에서 볼 때만큼 사진에서는 좋아 보이지 않는지, 그 이유를 세 가지로 설명하는 글이에요. 글은 익숙한 거울 이미지, 사진 찍을 때의 긴장, 그리고 이차원 사진이라는 세 가지 요인을 차례로 보여 줍니다. 요지는 결국 이 세 가지 요인이 겹쳐서 사진 속 우리 모습이 불편하게 느껴진다는 거예요. 자, 그럼 차근차근 들어가 볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">우리가 거울에서 보는 얼굴은 좌우가 뒤집힌 \u003cb class=\"key\">거울상\u003c/b>이에요. 사람의 얼굴은 완전히 좌우대칭이 아니어서 뒤집힌 모습과 실제 모습은 미묘하게 달라 보이죠. 심리학에서는 자주 접하는 것에 더 호감을 느끼는 현상을 \u003cb class=\"key\">단순 \u003c/b>\u003cb class=\"key\">노출 \u003c/b>\u003cb class=\"key\">효과\u003c/b>(mere exposure effect)라고 부르는데, 매일 보는 거울 속 얼굴이 우리에게 가장 익숙한 기준이 되는 거예요. 이는 매일 쓰던 안경을 새 안경으로 바꾸면 내 얼굴이 낯설게 느껴지는 것과 같은 이치예요. 또한 카메라는 실제 공간을 \u003cb class=\"key\">2차원\u003c/b> 평면에 눌러 담기 때문에(2-D flattening) 깊이감과 입체감이 줄어들어요. 그래서 조명과 각도에 따라 얼굴이 납작하거나 어색하게 기록될 수 있어요.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 조금 짚어 볼게요. 우리가 거울에서 보는 얼굴은 좌우가 뒤집힌 거울상이에요. 사람 얼굴은 완벽한 좌우대칭이 아니라서 뒤집힌 모습과 실제 모습은 미묘하게 달라 보이죠. 심리학에서는 자주 접하는 것에 더 호감을 느끼는 현상을 단순 노출 효과, 영어로 mere exposure effect라고 불러요. 매일 보는 거울 속 얼굴이 우리에게는 가장 익숙한 기준이 되는 거예요. 매일 쓰던 안경을 새 안경으로 바꾸면 내 얼굴이 낯설게 느껴지는 것과 같은 이치죠. 여기에 카메라가 실제 공간을 이차원 평면에 눌러 담기 때문에 깊이감이 줄어든다는 점도 함께 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>질문 던지기\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>글은 왜 우리가 거울 속에서 볼 때만큼 사진에서 좋아 보이지 않는지 \u003cb class=\"key\">의문\u003c/b>을 던지며 시작해요. 곧바로 몇 가지 가능한 이유가 있다고 말하며 \u003cb class=\"key\">문제 \u003c/b>\u003cb class=\"key\">제기\u003c/b>를 하죠. 독자는 이 두 문장만 읽어도 이 글이 '사진이 어색하게 나오는 이유'를 다룬다는 것을 알 수 있어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>거울 이미지\u003csmall>근거 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>무엇보다도 우리는 매일 거울 속에서 우리 자신을 봐요. 그래서 우리 얼굴의 가장 친숙한 이미지는 거울에 비친 \u003cb class=\"key\">반사된 \u003c/b>\u003cb class=\"key\">모습\u003c/b>이에요. 문제는 이 이미지가 사진에서 \u003cb class=\"key\">좌우 \u003c/b>\u003cb class=\"key\">반전\u003c/b>되면 낯설게 느껴진다는 점이죠. 익숙함이 기준이 되기 때문에 그 기준에서 벗어난 사진이 부자연스럽게 보이는 거예요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>미소와 긴장\u003csmall>근거 · 문장 6–8\u003c/small>\u003c/h4>\u003cp>두 번째 이유는 우리의 미소예요. 거울을 볼 때 우리는 보통 편안하고 자신감이 넘치며 자연스럽게 미소 지어요. 반대로 사진을 찍을 때는 긴장해서 \u003cb class=\"key\">어색한 \u003c/b>\u003cb class=\"key\">미소\u003c/b>를 짓게 되죠. 같은 얼굴인데도 \u003cb class=\"key\">긴장\u003c/b>이 표정을 딱딱하게 만든다는 설명이에요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>2차원 사진\u003csmall>근거 · 문장 9–10\u003c/small>\u003c/h4>\u003cp>마지막으로 사진은 실제 삶의 \u003cb class=\"key\">2차원 \u003c/b>\u003cb class=\"key\">버전\u003c/b>이에요. 입체적인 실제 모습이 평면에 담기면서 깊이감이 사라지죠. 그래서 사진은 우리를 이상하거나 \u003cb class=\"key\">부자연스럽게\u003c/b> 보이게 하는 경향이 있어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>결론\u003csmall>결론 · 문장 11\u003c/small>\u003c/h4>\u003cp>이렇게 세 가지 요인이 모여 최종적인 \u003cb class=\"key\">결론\u003c/b>으로 이어져요. 이러한 요인들이 우리가 사진 속 우리 모습에 \u003cb class=\"key\">불편함\u003c/b>을 느끼도록 만든다는 거죠. 거울은 익숙하고 사진은 낯설다는 \u003cb class=\"key\">대조\u003c/b>가 글 전체를 관통하는 핵심이에요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 질문 하나에서 시작해 세 가지 이유를 차례로 보여 주고, 마지막에 하나로 묶어 결론을 내는 흐름으로 전개돼요.","hl":null},{"n":4,"text":"글은 왜 우리가 거울 속에서 볼 때만큼 사진에서 좋아 보이지 않는지 의문을 던지며 시작해요. 이어서 몇 가지 가능한 이유가 있다고 말하면서 문제 제기를 하죠. 독자는 이 두 문장만 읽어도 이 글이 사진이 어색하게 나오는 이유를 다루는 글이라는 걸 알 수 있어요.","hl":"f0"},{"n":5,"text":"무엇보다도 우리는 매일 거울 속에서 우리 자신을 봐요. 그래서 우리 얼굴의 가장 친숙한 이미지는 거울에 비친 반사된 모습이에요. 문제는 이 이미지가 사진에서 좌우 반전되면 낯설게 느껴진다는 점이죠. 익숙함이 기준이 되기 때문에 그 기준에서 벗어난 사진이 부자연스럽게 보이는 거예요.","hl":"f1"},{"n":6,"text":"두 번째 이유는 우리의 미소예요. 거울을 볼 때 우리는 보통 편안하고 자신감이 넘치며 자연스럽게 미소 지어요. 반대로 사진을 찍을 때는 긴장해서 어색한 미소를 짓게 되죠. 같은 얼굴인데도 긴장이 표정을 딱딱하게 만든다는 설명이에요.","hl":"f2"},{"n":7,"text":"마지막으로 사진은 실제 삶의 이차원 버전이에요. 입체적인 실제 모습이 평면에 담기면서 깊이감이 사라지죠. 그래서 사진은 우리를 이상하거나 부자연스럽게 보이게 하는 경향이 있어요.","hl":"f3"},{"n":8,"text":"이렇게 세 가지 요인이 모여 최종적인 결론으로 이어져요. 이러한 요인들이 우리가 사진 속 우리 모습에 불편함을 느끼도록 만든다는 거죠. 거울은 익숙하고 사진은 낯설다는 대조가 글 전체를 관통하는 핵심이에요.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">질문-답변(열거)\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 11번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 첫 문장에서 질문을 던지고 마지막 문장에서 답을 정리하는 \u003cb class=\"key\">질문-답변\u003c/b> 구조예요. 이유를 먼저 쭉 나열한 뒤 마지막에 These factors로 묶어 결론을 내리기 때문에 \u003cb class=\"key\">미괄식\u003c/b> 전개로 보는 것이 자연스러워요. 세 가지 이유를 차례로 제시하는 \u003cb class=\"key\">열거\u003c/b> 방식이지만, 각 이유는 결국 '익숙함과 낯설음'이라는 하나의 \u003cb class=\"key\">대조\u003c/b> 축으로 묶여요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Why don't we (1)\u003c/b>\u003cspan>질문 제기\u003c/span>\u003cb>Here are some possible reasons (2)\u003c/b>\u003cspan>답변 예고\u003c/span>\u003cb>First of all (3)\u003c/b>\u003cspan>첫째 근거 제시\u003c/span>\u003cb>also (6)\u003c/b>\u003cspan>둘째 근거 추가\u003c/span>\u003cb>Finally (9)\u003c/b>\u003cspan>마지막 근거 제시\u003c/span>\u003cb>These factors (11)\u003c/b>\u003cspan>요약·결론\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">look as good in pictures\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">seems unnatural\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">make an awkward smile\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">look strange or unnatural\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">feel uncomfortable with how we look in pictures\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>거울 속 모습\u003c/th>\u003cth>사진 속 모습\u003c/th>\u003c/tr>\u003ctr>\u003ctd>익숙하고 자연스러움\u003c/td>\u003ctd>낯설고 부자연스러움\u003c/td>\u003c/tr>\u003ctr>\u003ctd>편안하고 자신감 있음\u003c/td>\u003ctd>긴장하고 어색한 미소\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3차원 실제 모습\u003c/td>\u003ctd>2차원 평면 이미지\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글은 첫 번째 문장에서 질문을 던지고 마지막 문장에서 답을 정리하는 질문-답변 구조예요. 이유를 먼저 쭉 나열하고 마지막에 These factors로 묶어 결론을 내리기 때문에 미괄식 전개로 보는 게 자연스러워요. 세 가지 이유를 차례로 제시하는 열거 방식이지만, 각 이유는 결국 익숙함과 낯설음이라는 하나의 대조 축으로 묶여요.","hl":"ty"},{"n":10,"text":"신호어를 눈여겨보세요. 첫 번째 문장의 Why don't we로 질문이 열리고, 두 번째 문장의 Here are some possible reasons가 답변을 미리 알려 주죠. First of all과 also, Finally가 세 가지 근거를 순서대로 표시해 주고요. 마지막 문장의 These factors는 앞에 나온 세 가지 이유를 한꺼번에 받아 주는 재진술 표현이에요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>mirror\u003c/b>\u003cem>명사\u003c/em>\u003cspan>거울\u003c/span>\u003c/div>\u003cdiv>\u003cb>possible\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>가능한\u003c/span>\u003c/div>\u003cdiv>\u003cb>reason\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이유\u003c/span>\u003c/div>\u003cdiv>\u003cb>first of all\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>무엇보다도\u003c/span>\u003c/div>\u003cdiv>\u003cb>familiar\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>익숙한, 친숙한\u003c/span>\u003c/div>\u003cdiv>\u003cb>image\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이미지, 모습\u003c/span>\u003c/div>\u003cdiv>\u003cb>reflection\u003c/b>\u003cem>명사\u003c/em>\u003cspan>반사, 비친 모습\u003c/span>\u003c/div>\u003cdiv>\u003cb>be used to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 익숙하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>reversed\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>뒤바뀐, 반전된\u003c/span>\u003c/div>\u003cdiv>\u003cb>seem\u003c/b>\u003cem>동사\u003c/em>\u003cspan>~처럼 보이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>unnatural\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>부자연스러운\u003c/span>\u003c/div>\u003cdiv>\u003cb>smile\u003c/b>\u003cem>명사\u003c/em>\u003cspan>미소\u003c/span>\u003c/div>\u003cdiv>\u003cb>relaxed\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>편안한\u003c/span>\u003c/div>\u003cdiv>\u003cb>confident\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>자신감 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>be likely to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~할 가능성이 크다\u003c/span>\u003c/div>\u003cdiv>\u003cb>act\u003c/b>\u003cem>동사\u003c/em>\u003cspan>행동하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>naturally\u003c/b>\u003cem>부사\u003c/em>\u003cspan>자연스럽게\u003c/span>\u003c/div>\u003cdiv>\u003cb>have one's picture taken\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>사진을 찍히다\u003c/span>\u003c/div>\u003cdiv>\u003cb>nervous\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>긴장한\u003c/span>\u003c/div>\u003cdiv>\u003cb>awkward\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>어색한\u003c/span>\u003c/div>\u003cdiv>\u003cb>finally\u003c/b>\u003cem>부사\u003c/em>\u003cspan>마지막으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>version\u003c/b>\u003cem>명사\u003c/em>\u003cspan>버전, 판\u003c/span>\u003c/div>\u003cdiv>\u003cb>real\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>실제의\u003c/span>\u003c/div>\u003cdiv>\u003cb>tend to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~하는 경향이 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>strange\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>이상한, 낯선\u003c/span>\u003c/div>\u003cdiv>\u003cb>factor\u003c/b>\u003cem>명사\u003c/em>\u003cspan>요인\u003c/span>\u003c/div>\u003cdiv>\u003cb>lead A to B\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>A가 B하도록 이끌다\u003c/span>\u003c/div>\u003cdiv>\u003cb>uncomfortable\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>불편한\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"단어도 몇 개 짚고 갈게요. be used to는 익숙하다, reversed는 뒤바뀐, awkward는 어색한이라는 뜻이에요. tend to는 하는 경향이 있다, lead A to B는 A가 B하도록 이끌다로 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">familiar\u003c/b>\u003cspan class=\"m\">익숙한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">well-known\u003c/span>\u003cspan class=\"s\">accustomed\u003c/span>\u003cspan class=\"s\">acquainted\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unfamiliar\u003c/span>\u003cspan class=\"a\">strange\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">unnatural\u003c/b>\u003cspan class=\"m\">부자연스러운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">awkward\u003c/span>\u003cspan class=\"s\">strange\u003c/span>\u003cspan class=\"s\">odd\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">natural\u003c/span>\u003cspan class=\"a\">normal\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">relaxed\u003c/b>\u003cspan class=\"m\">편안한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">comfortable\u003c/span>\u003cspan class=\"s\">calm\u003c/span>\u003cspan class=\"s\">at ease\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">nervous\u003c/span>\u003cspan class=\"a\">tense\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">confident\u003c/b>\u003cspan class=\"m\">자신감 있는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">assured\u003c/span>\u003cspan class=\"s\">self-assured\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">insecure\u003c/span>\u003cspan class=\"a\">doubtful\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">awkward\u003c/b>\u003cspan class=\"m\">어색한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">clumsy\u003c/span>\u003cspan class=\"s\">unnatural\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">natural\u003c/span>\u003cspan class=\"a\">graceful\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">reversed\u003c/b>\u003cspan class=\"m\">뒤바뀐\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">flipped\u003c/span>\u003cspan class=\"s\">turned around\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">kept\u003c/span>\u003cspan class=\"a\">maintained\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">uncomfortable\u003c/b>\u003cspan class=\"m\">불편한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">uneasy\u003c/span>\u003cspan class=\"s\">awkward\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">comfortable\u003c/span>\u003cspan class=\"a\">relaxed\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어도 정리해 볼게요. familiar는 well-known, accustomed와 가깝고 반대말은 unfamiliar, strange예요. relaxed는 comfortable, calm과 통하고 nervous, tense와 반대죠. awkward는 clumsy, unnatural과 비슷하고 natural, graceful과 반대예요. uncomfortable은 uneasy와 가깝고 comfortable, relaxed와 반대라는 점도 함께 외워 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜 우리는 보이지 않을까\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Why \u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003cspan class=\"tgt\">we\u003c/span> look\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사진에서 그만큼 좋게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">good \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">pictures \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 거울에서 그런 것만큼\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">as\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">do\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거울 속에서\u003c/span>\u003cspan class=\"en\">in the mirror?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">왜 우리는 거울 속에서 보이는 것만큼 사진에서는 좋아 보이지 않을까?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사진과 거울에서의 모습 차이를 질문으로 던지며 글의 \u003cb class=\"key\">문제 \u003c/b>\u003cb class=\"key\">제기\u003c/b>를 하는 도입 문장이에요. \u003cb class=\"key\">거울\u003c/b>에서는 익숙하게 보이는 모습이 \u003cb class=\"key\">사진\u003c/b>에서는 왜 다르게 느껴지는지 독자의 관심을 끌어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정의문문(수사 의문문)\u003c/span> : Why + don't + 주어 + 동사원형? : \"왜 우리는 ...하지 않을까?\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">원급 비교(as ~ as)\u003c/span> : as + [형용사 good] + as + [비교 대상] : \"사진에서 ...만큼 좋게\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">대동사 do\u003c/span> : do = look good in the mirror : \"우리가 거울에서 그런 것처럼\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"Why don't we look, 왜 우리는 보이지 않을까. as good in pictures, 사진에서 그만큼 좋게. as we do, 우리가 거울에서 그런 것만큼. in the mirror?, 거울 속에서. 이 문장 전체를 해석하면, 왜 우리는 거울 속에서 보이는 것만큼 사진에서는 좋아 보이지 않을까?","hl":"m"},{"n":14,"text":"이 문장은 사진과 거울에서의 모습 차이를 질문으로 던지면서 글의 문제 제기를 하는 도입이에요. 우리에게 익숙한 거울 속 모습과 달리 사진에서는 왜 다르게 보이는지 독자의 관심을 끌죠.","hl":"mn"},{"n":15,"text":"첫 번째 어법은 부정의문문이에요. Why don't we로 시작하지만 답을 요구하는 질문이 아니라 독자를 끌어들이는 수사 의문문으로 봐야 해요. 두 번째는 원급 비교로, as와 as 사이에 good이 들어가 사진에서 보이는 정도와 거울에서 보이는 정도를 비교해요. 세 번째는 대동사 do인데, 앞의 look을 반복하지 않으려고 do가 그 역할을 대신해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여기 ...이 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Here \u003c/span>\u003cspan class=\"tgt\">are\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몇 가지 가능한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">some \u003c/span>\u003cspan class=\"tgt\">possible \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이유가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">reasons\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여기 몇 가지 가능한 이유가 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞의 질문에 대한 답으로 \u003cb class=\"key\">몇 \u003c/b>\u003cb class=\"key\">가지 \u003c/b>\u003cb class=\"key\">가능한 \u003c/b>\u003cb class=\"key\">이유\u003c/b>를 제시하며, 이어질 내용이 \u003cb class=\"key\">이유 \u003c/b>\u003cb class=\"key\">열거\u003c/b>임을 알리는 문장이에요. 아래에 세 가지 이유가 나올 것임을 자연스럽게 예고해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">도치(Here + be동사 + 주어)\u003c/span> : Here + are + [복수 주어] : \"여기 ...가 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">형용사 possible의 명사 수식\u003c/span> : some + [형용사 possible] + [명사 reasons] : \"몇 가지 가능한 이유\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"Here are, 여기 ...이 있다. some possible, 몇 가지 가능한. reasons, 이유가. 이 문장 전체를 해석하면, 여기 몇 가지 가능한 이유가 있다.","hl":"m"},{"n":17,"text":"이 문장은 앞의 질문에 대한 답으로 몇 가지 가능한 이유를 제시하는 역할을 해요. 이어질 내용이 이유 열거라는 것을 알려 주면서 독자가 다음 설명을 기대하게 만들죠.","hl":"mn"},{"n":18,"text":"첫 번째 어법은 도치예요. Here가 문두에 오면 be동사 are가 주어 앞으로 나오고, 진주어인 some possible reasons가 뒤에 와요. 두 번째는 형용사 possible이 명사 reasons를 앞에서 꾸미는 구조예요. some과 possible과 reasons가 함께 명사구를 이루면서 몇 가지 가능한 이유라는 뜻을 만들어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무엇보다도,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">First \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">all\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 우리 자신을 본다\u003c/span>\u003cspan class=\"en\">we see \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">ourselves\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매일\u003c/span>\u003cspan class=\"en\">every day\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거울 속에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">mirror\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">무엇보다도, 우리는 매일 거울 속에서 우리 자신을 본다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 첫 번째 이유로, 우리가 매일 \u003cb class=\"key\">거울\u003c/b>을 통해 자기 모습을 본다는 점을 말해요. 반복적인 \u003cb class=\"key\">거울\u003c/b> 경험 때문에 그 모습이 가장 익숙해진다는 흐름의 출발점이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">열거의 관용 표현\u003c/span> : First of all, + [문장] : \"무엇보다도, 우선\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">재귀대명사\u003c/span> : 주어 + see + [재귀대명사] : \"우리 자신을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 용법(장소)\u003c/span> : see + [목적어] + in + [장소] : \"거울 속에서\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"First of all, 무엇보다도. we see ourselves, 우리는 우리 자신을 본다. every day, 매일. in the mirror, 거울 속에서. 이 문장 전체를 해석하면, 무엇보다도, 우리는 매일 거울 속에서 우리 자신을 본다.","hl":"m"},{"n":20,"text":"이 문장은 첫 번째 이유를 꺼내는 문장이에요. 우리가 매일 거울을 통해 자기 모습을 본다는 점을 말하면서, 반복적인 거울 경험이 우리에게 그 모습을 익숙하게 만든다는 흐름으로 이어져요.","hl":"mn"},{"n":21,"text":"첫 번째 어법은 열거의 관용 표현이에요. First of all은 첫 번째 이유를 소개할 때 쓰는 말이에요. 두 번째는 재귀대명사로, 목적어가 주어와 같은 우리 자신을 가리키기 때문에 ourselves를 써요. 세 번째는 전치사구로, in the mirror가 동사 see를 꾸며 보는 장소를 알려 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가장 친숙한 이미지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">The \u003c/span>\u003cspan class=\"tgt\">most \u003c/span>\u003cspan class=\"tgt\">familiar\u003c/span> image\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 얼굴의\u003c/span>\u003cspan class=\"en\">of our faces\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 반영이다\u003c/span>\u003cspan class=\"en\">is \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">reflection \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 거울에서 보는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">see \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">mirror\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리 얼굴의 가장 친숙한 이미지는 거울에 비친 모습이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 우리 얼굴에서 가장 \u003cb class=\"key\">친숙한\u003c/b> 이미지가 무엇인지 딱 정리해 주는 문장이에요. 뒤에 오는 we see in the mirror가 the reflection을 꾸며서 '거울에서 우리가 보는 \u003cb class=\"key\">반영\u003c/b>'이라고 알려주죠. 앞 문장의 '거울에서 자신을 본다'는 내용을 이어받아, 우리가 매일 보는 것이 바로 \u003cb class=\"key\">거울 \u003c/b>\u003cb class=\"key\">속 \u003c/b>\u003cb class=\"key\">이미지\u003c/b>임을 강조해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">최상급(the + 최상급)\u003c/span> : the + [최상급 형용사] + 명사 : \"가장 친숙한\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 생략\u003c/span> : [선행사] + [(which/that) + 주어 + 동사] : \"우리가 거울에서 보는 반영\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"The most familiar image, 가장 친숙한 이미지. of our faces, 우리 얼굴의. is the reflection, 그 반영이다. we see in the mirror, 우리가 거울에서 보는. 이 문장 전체를 해석하면, 우리 얼굴의 가장 친숙한 이미지는 거울에 비친 모습이다.","hl":"m"},{"n":23,"text":"이 문장은 우리가 매일 보는 얼굴이 결국 거울에 비친 모습이라는 걸 정리해 주는 문장이에요. 앞에서 거울 이야기가 나왔으니까, 여기서 친숙한 이미지가 무엇인지 콕 집어 주는 거죠. 거울 속 이미지가 우리가 가장 많이 본 얼굴이라는 점을 기억해 두세요.","hl":"mn"},{"n":24,"text":"먼저 the reflection we see in the mirror를 보세요. the reflection 뒤에 목적격 관계대명사 which나 that이 생략된 형태예요. 그리고 The most familiar에서 최상급 앞에는 the를 붙인다는 것도 같이 챙겨 주세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 거울 속의 이미지에 너무 익숙하기에\u003c/span>\u003cspan class=\"en\">Since we \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">so \u003c/span>\u003cspan class=\"tgt\">used \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">image \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">mirror\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 이미지가 사진 속에서 뒤바뀌면\u003c/span>\u003cspan class=\"en\">when this image \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">reversed\u003c/span> in pictures,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 부자연스럽게 보인다\u003c/span>\u003cspan class=\"en\">it \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">seems \u003c/span>\u003cspan class=\"tgt\">unnatural\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 거울 속의 이미지에 너무 익숙하기에, 이 이미지가 사진 속에서 뒤바뀌면, 부자연스럽게 보인다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 거울 속 이미지에 \u003cb class=\"key\">익숙하다\u003c/b>는 점 때문에, 사진에서 이미지가 \u003cb class=\"key\">뒤바뀌면\u003c/b> 부자연스럽게 느껴진다는 인과 관계를 담고 있어요. Since가 이끄는 절이 \u003cb class=\"key\">원인\u003c/b>을, when 절이 상황을, 마지막 절이 결과를 나타내는 구조죠. 4번 문장의 거울 이미지가 사진 속에서 왜 낯설게 보이는지로 이어지는 흐름이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be used to + 명사(익숙하다)\u003c/span> : be used to + [명사/동명사] : \"거울 속의 이미지에 너무 익숙하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태(be + p.p.)\u003c/span> : be + [과거분사] : \"뒤바뀐다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">2형식 동사 seem + 형용사\u003c/span> : seem + [형용사] : \"부자연스럽게 보인다\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"Since we are so used to the image in the mirror, 우리는 거울 속의 이미지에 너무 익숙하기에. when this image is reversed in pictures, 이 이미지가 사진 속에서 뒤바뀌면. it seems unnatural, 그것은 부자연스럽게 보인다. 이 문장 전체를 해석하면, 우리는 거울 속의 이미지에 너무 익숙하기에, 이 이미지가 사진 속에서 뒤바뀌면, 부자연스럽게 보인다.","hl":"m"},{"n":26,"text":"거울에서 늘 보던 얼굴이 사진에서는 좌우가 뒤집히니까 낯설게 느껴진다는 이야기예요. 익숙함이 오히려 사진 속 얼굴을 어색하게 만드는 원인이 되는 거죠. 그래서 이 문장은 앞 문장의 거울 이미지 이야기를 이유로 연결해 주는 역할을 해요.","hl":"mn"},{"n":27,"text":"첫 번째로, are so used to에서 be used to는 익숙하다라는 뜻이고 뒤에 명사가 와요. 두 번째로, this image is reversed는 be동사 더하기 과거분사, 그러니까 수동태로 뒤바뀌다라는 뜻이에요. 세 번째로, it seems unnatural은 seem 뒤에 형용사가 오는 구조라는 것도 함께 기억해 주세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 미소도\u003c/span>\u003cspan class=\"en\">Our smiles\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또한 ~가 될 수 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">could \u003c/span>\u003cspan class=\"tgt\">also \u003c/span>\u003cspan class=\"tgt\">be\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하나의 이유\u003c/span>\u003cspan class=\"en\">a reason.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리의 미소도 이유가 될 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> '우리의 \u003cb class=\"key\">미소\u003c/b>도 이유가 될 수 있다'며 두 번째 이유를 꺼내는 \u003cb class=\"key\">전환\u003c/b> 문장이에요. 앞에서 말한 거울 이미지 이유에 이어, 표정이라는 새로운 요인을 예고하죠. could를 써서 단정하지 않고 \u003cb class=\"key\">가능성\u003c/b>으로 부드럽게 제시해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 could + 동사원형(가능성)\u003c/span> : could + [동사원형] : \"또한 ~일 수 있다\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"Our smiles, 우리의 미소도. could also be, 또한 ~가 될 수 있다. a reason, 하나의 이유. 이 문장 전체를 해석하면, 우리의 미소도 이유가 될 수 있다.","hl":"m"},{"n":29,"text":"여기서 두 번째 이유가 시작돼요. 거울 이미지 이야기를 마치고 미소라는 새 이유를 꺼내는 전환점이죠. could를 써서 단정하지 않고 가능성으로 부드럽게 말하는 점도 눈여겨보세요.","hl":"mn"},{"n":30,"text":"could also be에서 could는 조동사라서 뒤에 동사원형 be가 와요. 조동사가 있으면 뒤에는 언제나 동사원형이 온다는 것, 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 거울 속의 우리 자신을 볼 때,\u003c/span>\u003cspan class=\"en\">When we look at \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">ourselves\u003c/span> in the mirror,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 보통 편안하고, 자신감이 넘치며,\u003c/span>\u003cspan class=\"en\">we're usually \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">relaxed, \u003c/span>\u003cspan class=\"tgt\">confident\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 자연스럽게 미소 짓고 행동할 가능성이 더 크다.\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">likely \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">smile \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">act \u003c/span>\u003cspan class=\"tgt\">naturally\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리가 거울 속의 우리 자신을 볼 때, 우리는 보통 편안하고, 자신감이 넘치며, 자연스럽게 미소 짓고 행동할 가능성이 더 크다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 거울 속에서는 편안하고 자신감이 넘쳐서 표정과 행동이 자연스럽게 나온다는 점을 짚는 대목입니다. 이는 사진에서 굳은 \u003cb class=\"key\">표정\u003c/b>이 나오는 이유와 대비되는 두 번째 근거예요. '~할 가능성이 더 크다'는 표현으로 \u003cb class=\"key\">거울\u003c/b> 상황에서의 결과를 부드럽게 말하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">재귀대명사(재귀용법)\u003c/span> : [주어] + [동사] + [재귀대명사(목적어)] : \"우리 자신을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">형용사 병렬(주격보어)\u003c/span> : 주어 + be동사 + [형용사1], [형용사2] : \"편안하고, 자신감이 넘치며\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">비교급 be likely to + to부정사 병렬\u003c/span> : be + [more likely] + [to smile] + and + [(to) act] : \"미소 짓고 행동할 가능성이 더 크다\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"When we look at ourselves in the mirror, 우리가 거울 속의 우리 자신을 볼 때. we're usually relaxed, confident, 우리는 보통 편안하고, 자신감이 넘치며. and more likely to smile and act naturally, 그리고 자연스럽게 미소 짓고 행동할 가능성이 더 크다.. 이 문장 전체를 해석하면, 우리가 거울 속의 우리 자신을 볼 때, 우리는 보통 편안하고, 자신감이 넘치며, 자연스럽게 미소 짓고 행동할 가능성이 더 크다.","hl":"m"},{"n":32,"text":"이 문장은 거울 속 모습과 사진 속 모습이 왜 다른지 두 번째 이유를 설명해요. 거울을 볼 때는 편안하고 자신감이 있어서 표정이 자연스럽고 행동도 여유롭다는 거죠. 그래서 거울 앞에서의 그런 편안함과 달리 사진에서는 굳은 표정이 나오면 더 어색하게 느껴진다는 흐름으로 이어집니다.","hl":"mn"},{"n":33,"text":"첫 번째로 ourselves, 이건 재귀대명사예요. 주어 we와 목적어가 같은 사람일 때 우리 자신이라는 뜻으로 재귀대명사를 씁니다. 두 번째로 relaxed, confident는 be동사 뒤에서 주어의 상태를 설명하는 주격보어 자리이고, 두 형용사가 쉼표로 병렬 연결되어 있어요. 세 번째로 more likely to smile and act naturally, 여기서 be likely to는 가능성이 있다는 뜻이고 more가 붙어서 비교급이 됐어요. to smile과 to act가 병렬로 이어지면서 두 번째 to는 생략된 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 우리가 사진을 찍을 때,\u003c/span>\u003cspan class=\"en\">But when we \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">pictures \u003c/span>\u003cspan class=\"tgt\">taken\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 긴장하기 시작하고\u003c/span>\u003cspan class=\"en\">we start \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">feel \u003c/span>\u003cspan class=\"tgt\">nervous \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어색한 미소를 짓기 시작한다!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">awkward \u003c/span>\u003cspan class=\"tgt\">smile\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 우리가 사진을 찍을 때, 우리는 긴장하고 어색한 미소를 짓기 시작한다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사진이 어색하게 나오는 이유를 표정에서 찾는 문장입니다. 사진 앞에서는 \u003cb class=\"key\">긴장\u003c/b>이 생겨 억지로 미소를 짓게 된다는 것이죠. 바로 앞의 \u003cb class=\"key\">편안함\u003c/b>과 정반대되는 상황을 보여 주며 두 번째 이유를 마무리합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">사역동사 have + 목적어 + 과거분사\u003c/span> : have + [목적어] + [과거분사(목적보어)] : \"우리가 사진을 찍을 때(사진이 찍히게 될 때)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 병렬\u003c/span> : start + [to feel] + and + [(to) make] : \"긴장하고 어색한 미소를 짓기 시작하다\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"But when we have our pictures taken, 하지만 우리가 사진을 찍을 때. we start to feel nervous, 우리는 긴장하기 시작하고. and make an awkward smile!, 어색한 미소를 짓기 시작한다!. 이 문장 전체를 해석하면, 하지만 우리가 사진을 찍을 때, 우리는 긴장하고 어색한 미소를 짓기 시작한다!","hl":"m"},{"n":35,"text":"이 문장은 사진이 어색하게 나오는 이유를 표정에서 찾고 있어요. 사진을 찍을 때는 긴장이 생겨서 억지로 미소를 짓게 된다는 거죠. 바로 앞에서 거울 볼 때는 편안하다고 했으니, 그 편안함과 정반대되는 상황을 보여 주는 겁니다.","hl":"mn"},{"n":36,"text":"첫 번째로 have our pictures taken, 이건 사역동사 have 다음에 목적어, 그리고 과거분사가 오는 형태예요. 목적어 our pictures가 찍히는 쪽이니까 수동 관계라서 과거분사를 목적보어로 씁니다. 두 번째로 to feel nervous and make an awkward smile, start 뒤에 to부정사가 와서 시작하다는 뜻을 만들고, to feel과 to make가 병렬로 연결되면서 두 번째 to는 생략돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마지막으로,\u003c/span>\u003cspan class=\"en\">Finally,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사진은 2D 버전이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">pictures \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">2-D \u003c/span>\u003cspan class=\"tgt\">version \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">실제 삶의.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">real \u003c/span>\u003cspan class=\"tgt\">life\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">마지막으로, 사진은 실제 삶의 2D 버전이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사진이 실제 모습과 다르게 느껴지는 마지막 이유로 사진이 \u003cb class=\"key\">이차원\u003c/b>이라는 점을 듭니다. 입체적인 \u003cb class=\"key\">실제 \u003c/b>\u003cb class=\"key\">삶\u003c/b>을 \u003cb class=\"key\">평면\u003c/b>으로 옮긴 것이 사진이라 낯설게 보일 수 있다는 뜻이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사 + 주격보어(명사)\u003c/span> : [주어] + be동사 + [주격보어(명사구)] : \"사진은 실제 삶의 2D 버전이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 용법\u003c/span> : [명사 version] + [of + 명사 real life] : \"실제 삶의 2D 버전\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"Finally, 마지막으로. pictures are a 2-D version, 사진은 2D 버전이다. of real life, 실제 삶의.. 이 문장 전체를 해석하면, 마지막으로, 사진은 실제 삶의 2D 버전이다.","hl":"m"},{"n":38,"text":"마지막 이유는 사진이 이차원, 즉 평면이라는 점이에요. 우리 눈앞의 실제 삶은 입체적인데 사진은 그걸 평면으로 눌러 담으니까 낯설게 보일 수밖에 없죠. 그래서 앞의 두 이유까지 합쳐서 사진 속 내 모습이 불편하게 느껴진다고 정리하는 흐름입니다.","hl":"mn"},{"n":39,"text":"첫 번째로 pictures are a two-D version of real life, be동사 are 뒤에 명사구가 와서 주어 pictures의 정체를 설명하는 주격보어 자리예요. 주어와 보어가 같은 대상을 가리키니까 사진은 곧 이차원 버전이라는 등식이 성립하죠. 두 번째로 a two-D version of real life, 전치사 of가 이끄는 전치사구가 앞의 명사 version을 뒤에서 꾸며 주는 형용사적 역할을 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들은\u003c/span>\u003cspan class=\"en\">They\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~하는 경향이 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">tend \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리를 보이게 만들다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">us \u003c/span>\u003cspan class=\"tgt\">look\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이상하거나 부자연스럽게\u003c/span>\u003cspan class=\"en\">strange or unnatural.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것들은 우리를 이상하거나 부자연스럽게 보이게 하는 경향이 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 내용, 즉 사진은 2차원이라 실제와 다르다는 점을 이어 받아, 사진이 우리를 이상하게 보이게 만드는 \u003cb class=\"key\">경향\u003c/b>이 있다고 정리하는 문장이에요. \u003cb class=\"key\">tend \u003c/b>\u003cb class=\"key\">to\u003c/b>로 일반적인 경향을, \u003cb class=\"key\">사역동사\u003c/b> make로 사진이 주는 효과를 표현했어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">tend to부정사(경향)\u003c/span> : tend + [to make (to부정사)] : \"~하는 경향이 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">사역동사 make + 목적어 + 원형부정사\u003c/span> : make + [목적어 us] + [동사원형 look (목적격보어)] : \"우리를 보이게 만들다\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"They, 그것들은. tend to, ~하는 경향이 있다. make us look, 우리를 보이게 만들다. strange or unnatural, 이상하거나 부자연스럽게. 이 문장 전체를 해석하면, 그것들은 우리를 이상하거나 부자연스럽게 보이게 하는 경향이 있다.","hl":"m"},{"n":41,"text":"앞에서 사진은 이차원 버전이라고 했죠. 그래서 사진이 우리를 실제와 다르게 보이게 만드는 경향이 있다고 정리하는 문장이에요. 경향이라는 말과 사역동사라는 말을 꼭 기억해 두세요.","hl":"mn"},{"n":42,"text":"첫 번째로 tend to 다음에는 동사원형이 와서 경향을 나타내요. 그래서 tend to make는 하는 경향이 있다로 읽습니다. 두 번째로 make는 사역동사라서 목적어 us 뒤에 동사원형이 오죠. 그래서 make us look, 우리를 보이게 만들다가 되는 겁니다. 여기서 to look이라고 쓰면 틀린다는 점 꼭 체크하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 요인들은\u003c/span>\u003cspan class=\"en\">These factors\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리를 이끌 수 있다\u003c/span>\u003cspan class=\"en\">can \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">lead \u003c/span>\u003cspan class=\"tgt\">us \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">불편하게 느끼도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">feel\u003c/span> uncomfortable\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 사진 속에서 어떻게 보이는지에 대해\u003c/span>\u003cspan class=\"en\">with \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">look \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">pictures\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이러한 요인들은 우리가 사진 속의 우리 모습에 대해 불편하게 느끼도록 만들 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 거울 이미지, 긴장한 표정, 이차원 사진이라는 세 가지 이유를 하나로 묶어 결론짓는 문장이에요. \u003cb class=\"key\">lead \u003c/b>\u003cb class=\"key\">A \u003c/b>\u003cb class=\"key\">to \u003c/b>\u003cb class=\"key\">B\u003c/b>로 원인과 결과를 연결하고, how we look은 \u003cb class=\"key\">간접의문문\u003c/b>으로 with의 목적어 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">5형식 lead + 목적어 + to부정사\u003c/span> : lead + [목적어 us] + [to feel (to부정사/목적격보어)] : \"우리가 느끼도록 이끌다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">간접의문문(의문사 + 주어 + 동사)\u003c/span> : 전치사 with + [how + 주어 we + 동사 look + 수식어 in pictures] : \"우리가 사진에서 어떻게 보이는지\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"These factors, 이러한 요인들은. can lead us, 우리를 이끌 수 있다. to feel uncomfortable, 불편하게 느끼도록. with how we look in pictures, 우리가 사진 속에서 어떻게 보이는지에 대해. 이 문장 전체를 해석하면, 이러한 요인들은 우리가 사진 속의 우리 모습에 대해 불편하게 느끼도록 만들 수 있다.","hl":"m"},{"n":44,"text":"거울 이미지, 어색한 미소, 이차원 사진이라는 세 가지를 하나로 묶어 결론짓는 문장이에요. 결국 이런 요인들 때문에 사진 속 내 모습이 불편하게 느껴진다는 거죠. 글의 마무리 문장이니 주제와 함께 기억해 두세요.","hl":"mn"},{"n":45,"text":"첫 번째로 lead us to feel은 목적어 뒤에 to부정사가 오는 구조예요. 목적격보어 자리에 to부정사가 와서 우리가 느끼도록 이끈다는 인과관계를 만들어 줍니다. 두 번째로 how we look in pictures는 의문사가 이끄는 간접의문문이고, 전치사 with의 목적어로 쓰였어요. 그래서 우리가 사진에서 어떻게 보이는지에 대해라는 뜻이 됩니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>글은 왜 우리가 거울 속에서 볼 때만큼 사진에서 좋아 보이지 않는지 \u003cb class=\"key\">의문\u003c/b>을 던지며 시작한다.\u003c/li>\u003cli>우리 얼굴의 가장 친숙한 이미지는 거울에 \u003cb class=\"key\">반사된 \u003c/b>\u003cb class=\"key\">모습\u003c/b>이라서, 사진에서 좌우가 뒤바뀌면 \u003cb class=\"key\">부자연스럽게\u003c/b> 느껴진다.\u003c/li>\u003cli>거울을 볼 때는 편안하고 \u003cb class=\"key\">자신감\u003c/b> 있게 자연스러운 미소를 짓지만, 사진을 찍을 때는 긴장해서 \u003cb class=\"key\">어색한 \u003c/b>\u003cb class=\"key\">미소\u003c/b>를 짓는다.\u003c/li>\u003cli>사진은 실제 삶의 \u003cb class=\"key\">2차원 \u003c/b>\u003cb class=\"key\">버전\u003c/b>이라 입체감이 줄어들고, 이 세 요인이 겹쳐 사진 속 내 모습이 \u003cb class=\"key\">불편\u003c/b>하게 느껴진다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Three factors — our familiarity with the mirrored image, nervous smiles in front of a camera, and the flat, two-dimensional nature of photographs — can make us feel uncomfortable with how we look in pictures.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">우리가 거울 속에서 볼 때만큼 사진에서 좋아 보이지 않는 이유로 \u003cb class=\"key\">거울 \u003c/b>\u003cb class=\"key\">이미지에 \u003c/b>\u003cb class=\"key\">대한 \u003c/b>\u003cb class=\"key\">익숙함\u003c/b>, 사진을 찍을 때의 \u003cb class=\"key\">긴장과 \u003c/b>\u003cb class=\"key\">어색한 \u003c/b>\u003cb class=\"key\">미소\u003c/b>, 그리고 \u003cb class=\"key\">2차원\u003c/b>으로 평면화된 사진의 특성이 제시된다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":46,"text":"오늘 글은 사진이 어색하게 나오는 이유를 익숙함, 긴장, 이차원이라는 세 가지 열쇠로 설명했어요. 거울 속 모습이 기준이 되고, 사진에서는 긴장과 평면화가 더해져서 불편함이 생긴다는 흐름이었죠. 시험에서는 세 가지 근거를 표시하는 신호어와 These factors가 무엇을 가리키는지 꼭 확인하세요. 오늘도 수고했어요, 다음 시간에 또 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
