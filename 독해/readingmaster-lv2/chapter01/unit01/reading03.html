<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터2 Reading03 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}

.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터2 Reading03","audioDir":"reading03_audio","preview":false,"count":46,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.520em\">Reading03\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터2\u003c/div>\u003ch1>Why Young Adults Choose Vegetarianism: Health, Animals, and the Environment\u003c/h1>\u003ch2>젊은 성인들이 채식을 선택하는 이유: 건강, 동물, 환경\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>채식은 건강에 좋고 영양가가 높지만, 젊은 성인들은 \u003cb class=\"key\">건강\u003c/b>에 대한 염려 때문만이 아니라 \u003cb class=\"key\">동물의 \u003c/b>\u003cb class=\"key\">권리\u003c/b>와 \u003cb class=\"key\">환경\u003c/b> 문제에 대한 관심 때문에 채식을 선택한다. 이러한 경향은 오늘날 젊은이들이 그 문제들을 더 인식하고 더 민감하다는 것을 보여 준다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Young adults are turning to vegetarianism not only for their health but also out of concern for animal rights and the environment.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 젊은 성인들이 왜 채식을 선택하는지 설명하는 글이에요. 채식이 건강에 좋다는 이야기에서 시작해서 동물의 권리와 환경이라는 더 넓은 이유로 확장되는 흥미로운 글이죠. 요약하면 젊은이들은 건강뿐 아니라 동물의 권리와 환경에 대한 관심 때문에 채식을 선택한다는 것이고, 이것이 오늘날 젊은이들의 인식을 보여 준다는 것이 이 글의 요지예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">채식주의(vegetarianism)는 고기와 생선을 먹지 않는 식습관을 말해요. 사람들은 흔히 채식을 건강 관리라고만 생각하지만, 실제로는 \u003cb class=\"key\">동물의 \u003c/b>\u003cb class=\"key\">권리\u003c/b>(animal rights)나 \u003cb class=\"key\">환경\u003c/b> 보호(environmental protection) 같은 가치 때문에 선택하기도 해요. 예를 들어 공장식 축산에서는 동물이 아주 좁은 우리에서 길러지고, 고기를 만들기 위해 엄청난 양의 물과 곡물이 들어갑니다. 이것은 편하다고 무조건 택시를 타는 사람과 환경을 생각해 자전거를 타는 사람의 차이와 비슷해요. 그래서 식탁 위의 선택 하나가 그 사람의 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">가치\u003c/b>를 보여 주는 지표가 될 수 있답니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 조금 쌓아 볼게요. 채식주의는 고기와 생선을 먹지 않는 식습관을 말합니다. 그런데 채식은 단순히 다이어트가 아니라 가치의 문제이기도 해요. 공장식 축산에서는 동물이 아주 좁은 우리에서 길러지고, 고기를 만들기 위해 엄청난 양의 물과 곡물이 들어갑니다. 이건 편하다고 무조건 택시를 타는 사람과 환경을 생각해서 자전거를 타는 사람의 차이와 비슷해요. 그래서 식탁 위의 선택 하나가 그 사람의 사회적 가치를 보여 주는 지표가 될 수 있답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>채식의 확산\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>채식은 점점 더 많은 젊은 성인들이 고기와 생선을 먹는 것에 \u003cb class=\"key\">반대\u003c/b>하면서 더 인기를 얻고 있어요. 미국 영양학 협회에 따르면 계획된 채식주의 \u003cb class=\"key\">식단\u003c/b>은 건강에 좋고 영양가가 높다고 해요. 또한 특정 \u003cb class=\"key\">질병\u003c/b>을 예방하고 치료하는 데에도 건강상의 이점을 제공한답니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>건강만이 아닌 이유\u003csmall>전환 · 문장 4\u003c/small>\u003c/h4>\u003cp>그런데 여기서 글의 방향이 바뀌어요. 젊은 성인들은 자신의 건강에 대한 \u003cb class=\"key\">염려\u003c/b> 때문만으로 식단을 바꾸기로 결정하는 것은 아니에요. However라는 신호어가 앞의 내용을 \u003cb class=\"key\">반박\u003c/b>하며 새로운 주장을 던지는 지점이죠.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>동물의 권리\u003csmall>근거 · 문장 5–7\u003c/small>\u003c/h4>\u003cp>어떤 이들은 동물의 \u003cb class=\"key\">권리\u003c/b>에 대한 관심 때문에 그 선택을 해요. 많은 통계는 식용으로 길러지는 대부분의 동물들이 작은 \u003cb class=\"key\">우리\u003c/b>에 갇혀 있다는 것을 보여 주죠. 그래서 많은 십 대들은 그러한 조건에 \u003cb class=\"key\">저항\u003c/b>하기 위해 고기를 포기한답니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>환경 보호\u003csmall>근거 · 문장 8–10\u003c/small>\u003c/h4>\u003cp>다른 사람들은 \u003cb class=\"key\">환경\u003c/b>을 지지하기 위해 채식주의가 돼요. 고기 생산은 많은 양의 물과 땅, 곡물과 에너지를 사용해요. 그것은 또한 \u003cb class=\"key\">오염\u003c/b>을 일으키는 가축의 \u003cb class=\"key\">배설물\u003c/b> 문제를 만들어 내죠.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>젊은이들의 인식\u003csmall>결론 · 문장 11\u003c/small>\u003c/h4>\u003cp>이러한 \u003cb class=\"key\">경향\u003c/b>은 오늘날 젊은이들이 동물의 권리와 환경 문제를 더 \u003cb class=\"key\">인식\u003c/b>하고 그것에 더 민감하다는 것을 보여 줘요. 결국 이 글은 채식이라는 식습관을 통해 젊은 세대의 가치관을 읽어 내는 글이에요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 다섯 단계로 나누어 따라가 볼게요.","hl":null},{"n":4,"text":"첫 단계는 도입이에요. 채식은 점점 더 많은 젊은 성인들이 고기와 생선을 먹는 것에 반대하면서 더 인기를 얻고 있어요. 미국 영양학 협회에 따르면 계획된 채식주의 식단은 건강에 좋고 영양가가 높다고 합니다. 또한 특정 질병을 예방하고 치료하는 데에도 건강상의 이점을 제공한다는 점을 기억해 두세요.","hl":"f0"},{"n":5,"text":"두 번째 단계에서 글의 방향이 바뀝니다. 젊은 성인들은 자신의 건강에 대한 염려 때문만으로 식단을 바꾸기로 결정하는 것은 아니에요. However라는 신호어가 앞의 내용을 반박하면서 새로운 주장을 던지는 거죠. 이 전환이 이 글의 진짜 주제를 여는 열쇠예요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 동물의 권리라는 근거입니다. 어떤 이들은 동물의 권리에 대한 관심 때문에 그 선택을 해요. 많은 통계는 식용으로 길러지는 대부분의 동물들이 작은 우리에 갇혀 있다는 것을 보여 주죠. 그래서 많은 십 대들은 그러한 조건에 저항하기 위해 고기를 포기한답니다.","hl":"f2"},{"n":7,"text":"네 번째 단계는 환경이라는 또 다른 근거예요. 다른 사람들은 환경을 지지하기 위해 채식주의가 됩니다. 고기 생산은 많은 양의 물과 땅, 곡물과 에너지를 사용해요. 그것은 또한 오염을 일으키는 가축의 배설물 문제를 만들어 내죠.","hl":"f3"},{"n":8,"text":"마지막 단계는 결론입니다. 이러한 경향은 오늘날 젊은이들이 동물의 권리와 환경 문제를 더 인식하고 그것에 더 민감하다는 것을 보여 줘요. 결국 이 글은 채식이라는 식습관을 통해 젊은 세대의 가치관을 읽어 내는 글이라고 정리할 수 있습니다.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 4번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 채식이 건강에 좋다는 일반적인 \u003cb class=\"key\">통념\u003c/b>을 앞부분에서 먼저 제시해요. 그러나 However로 방향을 틀어 건강 때문만은 아니라는 \u003cb class=\"key\">주장\u003c/b>을 네 번째 문장에서 먼저 던지고, 동물의 권리와 환경이라는 두 가지 근거를 차례로 붙이죠. 마지막 문장에서 이 경향이 젊은이들의 인식을 보여 준다고 \u003cb class=\"key\">정리\u003c/b>하기 때문에, 주장이 앞에 나오는 두괄식 구조로 볼 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>However (4)\u003c/b>\u003cspan>전환·반박\u003c/span>\u003cb>Some (5)\u003c/b>\u003cspan>첫 번째 근거 제시\u003c/span>\u003cb>So (7)\u003c/b>\u003cspan>인과·결과\u003c/span>\u003cb>Others (8)\u003c/b>\u003cspan>두 번째 근거 제시\u003c/span>\u003cb>also (10)\u003c/b>\u003cspan>내용 추가\u003c/span>\u003cb>These trends show that (11)\u003c/b>\u003cspan>결론 제시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Vegetarian eating\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">change their diets\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the choice\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">give up meat\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">vegetarianism\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"전개방식은 주장과 근거로 이루어진 구조예요. 글은 채식이 건강에 좋다는 통념을 먼저 제시한 뒤, However로 방향을 틀어 건강 때문만은 아니라는 주장을 네 번째 문장에서 먼저 던집니다. 그다음 동물의 권리와 환경이라는 두 가지 근거를 차례로 붙이죠. 주장이 앞에 나오고 근거가 뒤따르는 두괄식 구조라서, 앞부분에서 중심 문장을 잡으면 나머지는 쉽게 따라옵니다.","hl":"ty"},{"n":10,"text":"신호어를 짚어 볼게요. However는 앞 내용을 뒤집는 전환 신호이고, Some과 Others는 근거를 나란히 늘어놓는 짝 신호예요. So는 앞의 조건 때문에 뒤의 행동이 일어난다는 인과를 표시하고, also는 내용을 하나 더 추가한다는 표시입니다. 마지막의 These trends show that은 앞의 모든 내용을 묶어 결론으로 정리하는 신호라는 것도 꼭 기억하세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>vegetarian\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>채식의, 채식주의의\u003c/span>\u003c/div>\u003cdiv>\u003cb>popular\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>인기 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>say no to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 반대하다, 거절하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>according to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 따르면\u003c/span>\u003c/div>\u003cdiv>\u003cb>diet\u003c/b>\u003cem>명사\u003c/em>\u003cspan>식단, 식습관\u003c/span>\u003c/div>\u003cdiv>\u003cb>healthful\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>건강에 좋은\u003c/span>\u003c/div>\u003cdiv>\u003cb>nutritious\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>영양가가 높은\u003c/span>\u003c/div>\u003cdiv>\u003cb>provide\u003c/b>\u003cem>동사\u003c/em>\u003cspan>제공하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>benefit\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이점, 혜택\u003c/span>\u003c/div>\u003cdiv>\u003cb>prevent\u003c/b>\u003cem>동사\u003c/em>\u003cspan>예방하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>treat\u003c/b>\u003cem>동사\u003c/em>\u003cspan>치료하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>disease\u003c/b>\u003cem>명사\u003c/em>\u003cspan>질병\u003c/span>\u003c/div>\u003cdiv>\u003cb>however\u003c/b>\u003cem>부사\u003c/em>\u003cspan>그러나, 하지만\u003c/span>\u003c/div>\u003cdiv>\u003cb>concern\u003c/b>\u003cem>명사\u003c/em>\u003cspan>관심, 염려\u003c/span>\u003c/div>\u003cdiv>\u003cb>make a choice\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>선택하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>rights\u003c/b>\u003cem>명사\u003c/em>\u003cspan>권리\u003c/span>\u003c/div>\u003cdiv>\u003cb>statistics\u003c/b>\u003cem>명사\u003c/em>\u003cspan>통계\u003c/span>\u003c/div>\u003cdiv>\u003cb>majority\u003c/b>\u003cem>명사\u003c/em>\u003cspan>대다수, 대부분\u003c/span>\u003c/div>\u003cdiv>\u003cb>raise\u003c/b>\u003cem>동사\u003c/em>\u003cspan>기르다, 사육하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>cage\u003c/b>\u003cem>명사\u003c/em>\u003cspan>우리, 새장\u003c/span>\u003c/div>\u003cdiv>\u003cb>give up\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>포기하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>protest\u003c/b>\u003cem>동사\u003c/em>\u003cspan>저항하다, 항의하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>condition\u003c/b>\u003cem>명사\u003c/em>\u003cspan>조건, 상태\u003c/span>\u003c/div>\u003cdiv>\u003cb>turn to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 돌아서다, 의지하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>vegetarianism\u003c/b>\u003cem>명사\u003c/em>\u003cspan>채식주의\u003c/span>\u003c/div>\u003cdiv>\u003cb>environment\u003c/b>\u003cem>명사\u003c/em>\u003cspan>환경\u003c/span>\u003c/div>\u003cdiv>\u003cb>production\u003c/b>\u003cem>명사\u003c/em>\u003cspan>생산\u003c/span>\u003c/div>\u003cdiv>\u003cb>waste\u003c/b>\u003cem>명사\u003c/em>\u003cspan>배설물, 폐기물\u003c/span>\u003c/div>\u003cdiv>\u003cb>pollution\u003c/b>\u003cem>명사\u003c/em>\u003cspan>오염\u003c/span>\u003c/div>\u003cdiv>\u003cb>trend\u003c/b>\u003cem>명사\u003c/em>\u003cspan>경향, 추세\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"핵심 단어도 짚고 갈게요. concern은 관심이나 염려라는 뜻으로 out of concern for animal rights처럼 쓰이고, protest는 저항하다, give up은 포기하다, turn to는 돌아서다라는 뜻이에요. nutritious는 영양가가 높은, healthful은 건강에 좋은이라는 형용사로 구분해서 외워 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">popular\u003c/b>\u003cspan class=\"m\">인기 있는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">well-liked\u003c/span>\u003cspan class=\"s\">widespread\u003c/span>\u003cspan class=\"s\">common\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unpopular\u003c/span>\u003cspan class=\"a\">rare\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">healthful\u003c/b>\u003cspan class=\"m\">건강에 좋은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">healthy\u003c/span>\u003cspan class=\"s\">wholesome\u003c/span>\u003cspan class=\"s\">beneficial\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">harmful\u003c/span>\u003cspan class=\"a\">unhealthy\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">prevent\u003c/b>\u003cspan class=\"m\">예방하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">avoid\u003c/span>\u003cspan class=\"s\">stop\u003c/span>\u003cspan class=\"s\">block\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">cause\u003c/span>\u003cspan class=\"a\">allow\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">concern\u003c/b>\u003cspan class=\"m\">관심, 염려\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">worry\u003c/span>\u003cspan class=\"s\">interest\u003c/span>\u003cspan class=\"s\">care\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">indifference\u003c/span>\u003cspan class=\"a\">unconcern\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">majority\u003c/b>\u003cspan class=\"m\">대다수\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">most\u003c/span>\u003cspan class=\"s\">the greater part\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">minority\u003c/span>\u003cspan class=\"a\">few\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">give up\u003c/b>\u003cspan class=\"m\">포기하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">quit\u003c/span>\u003cspan class=\"s\">abandon\u003c/span>\u003cspan class=\"s\">stop\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">keep\u003c/span>\u003cspan class=\"a\">continue\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">protest\u003c/b>\u003cspan class=\"m\">저항하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">oppose\u003c/span>\u003cspan class=\"s\">object to\u003c/span>\u003cspan class=\"s\">resist\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">support\u003c/span>\u003cspan class=\"a\">accept\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">aware of\u003c/b>\u003cspan class=\"m\">~을 인식하는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">conscious of\u003c/span>\u003cspan class=\"s\">mindful of\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unaware of\u003c/span>\u003cspan class=\"a\">ignorant of\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어도 함께 정리해 볼게요. popular는 well-liked나 widespread로 바꿔 쓸 수 있고 반대말은 unpopular예요. healthful은 healthy나 wholesome과 가깝고 반대는 harmful입니다. prevent는 avoid나 stop으로, concern은 worry나 interest로 바꿀 수 있어요. majority는 most이고 반대는 minority이며, give up은 quit이나 abandon, protest는 oppose나 object to로 표현할 수 있습니다. aware는 conscious of나 mindful of와 가깝고 반대는 unaware of라는 점도 챙겨 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">채식은\u003c/span>\u003cspan class=\"en\">Vegetarian eating\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 인기를 얻고 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">becoming\u003c/span> more popular\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">점점 더 많은 젊은 성인들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">as\u003c/span> more and more young adults\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">반대하면서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">say \u003c/span>\u003cspan class=\"tgt\">no \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고기와 생선을 먹는 것\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">eating\u003c/span> meat and fish.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">채식은 점점 더 많은 젊은 성인들이 고기와 생선을 먹는 것에 반대하면서 더 인기를 얻고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 \u003cb class=\"key\">채식\u003c/b>이 젊은 성인들 사이에서 \u003cb class=\"key\">인기\u003c/b>가 커지는 흐름을 제시하며 글의 \u003cb class=\"key\">주제\u003c/b>를 연다. 'say no to'는 단순히 '아니라고 말하다'가 아니라 '~에 반대하다'라는 뜻으로, 고기와 생선 섭취를 거부하는 태도를 나타낸다. 뒤 문장에서 채식의 건강상 이점과 동기 설명으로 이어지는 도입 역할을 한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재진행형(진행 중인 변화)\u003c/span> : [[주어]] + is/are + [[동사-ing]] : \"더 인기를 얻고 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이유·배경의 접속사 as\u003c/span> : [[as]] + 주어 + 동사 : \"점점 더 많은 젊은 성인들이 ... 반대하면서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">say no to + 동명사(전치사 to의 목적어)\u003c/span> : [[say no to]] + [[동명사]] : \"~하는 것에 반대하다\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"Vegetarian eating, 채식은. is becoming more popular, 더 인기를 얻고 있다. as more and more young adults, 점점 더 많은 젊은 성인들이. say no to, 반대하면서. eating meat and fish, 고기와 생선을 먹는 것. 이 문장 전체를 해석하면, 채식은 점점 더 많은 젊은 성인들이 고기와 생선을 먹는 것에 반대하면서 더 인기를 얻고 있다.","hl":"m"},{"n":14,"text":"이 문장은 채식이 젊은 성인들 사이에서 인기가 커지는 흐름을 열어 주는 도입 문장이에요. say no to는 단순히 아니라고 말한다가 아니라 고기와 생선 먹는 것에 반대한다는 뜻으로 기억하세요. 뒤에서 건강과 동물권, 환경 같은 구체적인 이유가 이어지죠.","hl":"mn"},{"n":15,"text":"문법 포인트를 짚어 볼게요. 첫 번째로 is becoming은 현재진행형으로 최근 이어지는 변화를 나타내요. 그래서 더 인기를 얻고 있다처럼 변화의 흐름을 강조하죠. 두 번째로 as는 이유나 배경을 이끄는 접속사로 채식 인기가 늘어난 이유를 설명해요. 세 번째로 say no to는 전치사 to 뒤에 동명사 eating이 온 관용 표현이고 무엇에 반대한다는 뜻이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미국 영양학 협회에 따르면,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">According \u003c/span>\u003cspan class=\"tgt\">to\u003c/span> the American Dietetic Association,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">계획된 채식주의 식단은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">planned\u003c/span> vegetarian diets\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">건강에 좋고\u003c/span>\u003cspan class=\"en\">are \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">healthful \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">영양가가 높다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">nutritious\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">미국 영양학 협회에 따르면, 계획된 채식주의 식단은 건강에 좋고 영양가가 높다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 권위 있는 기관의 \u003cb class=\"key\">근거\u003c/b>를 들어 계획된 채식 식단이 건강에 좋다는 점을 뒷받침한다. 앞에서 언급한 채식 인기 상승 흐름에 신뢰성을 더하는 \u003cb class=\"key\">인용\u003c/b> 역할을 한다. 'planned'는 아무렇게나 먹는 채식이 아니라 \u003cb class=\"key\">계획된\u003c/b> 식단이라는 점을 강조한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구 according to(~에 따르면)\u003c/span> : [[According to]] + 명사(구) : \"미국 영양학 협회에 따르면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사 형용사(수동 의미)\u003c/span> : [[과거분사]] + 명사 : \"계획된\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">형용사 병렬 구조\u003c/span> : [[형용사]] + and + [[형용사]] : \"건강에 좋고 영양가가 높은\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"According to the American Dietetic Association, 미국 영양학 협회에 따르면. planned vegetarian diets, 계획된 채식주의 식단은. are healthful, 건강에 좋고. and nutritious, 영양가가 높다.. 이 문장 전체를 해석하면, 미국 영양학 협회에 따르면, 계획된 채식주의 식단은 건강에 좋고 영양가가 높다.","hl":"m"},{"n":17,"text":"이 문장은 미국 영양학 협회라는 권위 있는 기관을 근거로 제시해서 계획된 채식 식단이 건강에 좋고 영양가가 높다는 점을 뒷받침해요. planned가 붙어서 아무렇게나 먹는 채식이 아니라 계획된 식단이라는 점도 꼭 기억하세요.","hl":"mn"},{"n":18,"text":"문법 포인트를 짚어 볼게요. 첫 번째로 According to는 따르면이라는 뜻의 전치사구라서 뒤에 명사구가 와요. 두 번째로 planned는 과거분사로 식단이 계획된 대상이라는 수동 의미를 담아 diets를 꾸며요. 세 번째로 healthful and nutritious는 형용사 병렬 구조로 두 성질을 함께 설명해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">They\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또한 제공한다\u003c/span>\u003cspan class=\"en\">also \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">provide\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">건강상의 이점을\u003c/span>\u003cspan class=\"en\">health benefits\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예방하고 치료하는 데\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">preventing \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">treating\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">특정 질병을\u003c/span>\u003cspan class=\"en\">certain diseases.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것들은 또한 특정 질병을 예방하고 치료하는 데 건강상의 이점을 제공한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 채식 식단이 특정 질병의 \u003cb class=\"key\">예방\u003c/b>과 \u003cb class=\"key\">치료\u003c/b>에 도움을 준다는 추가 \u003cb class=\"key\">이점\u003c/b>을 설명한다. 앞 문장의 '건강에 좋고 영양가가 높다'를 구체화하며, 채식이 건강에 유익하다는 주장을 강화한다. 'in -ing'는 '~하는 데 있어서'라는 뜻으로 분야를 나타낸다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">대명사 They의 지시 대상\u003c/span> : [[They]] + 동사 : \"그것들(채식 식단들)은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주어-동사 수 일치\u003c/span> : 복수 주어 [[They]] + [[동사원형]] provide : \"제공한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 in + 동명사구(병렬)\u003c/span> : [[in]] + [[동명사]] + and + [[동명사]] : \"예방하고 치료하는 데\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"They, 그것들은. also provide, 또한 제공한다. health benefits, 건강상의 이점을. in preventing and treating, 예방하고 치료하는 데. certain diseases, 특정 질병을. 이 문장 전체를 해석하면, 그것들은 또한 특정 질병을 예방하고 치료하는 데 건강상의 이점을 제공한다.","hl":"m"},{"n":20,"text":"이 문장은 채식 식단이 특정 질병의 예방과 치료에 도움을 준다는 추가 이점을 설명해요. 앞 문장에서 말한 건강상 이점을 구체적인 질병 예방과 치료로 확장해서 채식의 유익함을 더 강하게 보여 주죠.","hl":"mn"},{"n":21,"text":"문법 포인트를 짚어 볼게요. 첫 번째로 They는 앞 문장의 planned vegetarian diets를 받는 대명사예요. 두 번째로 provide는 복수 주어 They에 맞춘 동사원형이라 수 일치가 중요해요. 세 번째로 in preventing and treating은 전치사 in 뒤에 동명사가 온 구조이고 preventing과 treating이 and로 병렬을 이뤄요. 그래서 예방하고 치료하는 데라는 뜻이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만,\u003c/span>\u003cspan class=\"en\">However,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">젊은 성인들은 결정하지 않는다\u003c/span>\u003cspan class=\"en\">young adults don't decide\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 식단을 바꾸기로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">change \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">diets\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단지 염려 때문만으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">only \u003c/span>\u003cspan class=\"tgt\">out \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">concern \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 건강에 대한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">health\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만, 젊은 성인들은 그들의 건강에 대한 염려 때문만으로 식단을 바꾸기로 결정하는 것은 아니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 인정한 채식의 건강상 이점을 정면으로 부정하지 않으면서, 이유가 하나가 아니라는 점을 알리는 \u003cb class=\"key\">전환\u003c/b> 문장이다. not과 only가 함께 쓰여 '단지 ~때문만은 아니다'라는 \u003cb class=\"key\">부분 \u003c/b>\u003cb class=\"key\">부정\u003c/b>을 만든다. 이 문장 이후에 동물 권리, 환경 같은 다른 이유들이 이어질 것을 \u003cb class=\"key\">예고\u003c/b>한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(decide의 목적어)\u003c/span> : decide + [to change (to부정사구/목적어)] : \"그들의 식단을 바꾸기로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부분 부정(not ... only)과 원인 전치사구\u003c/span> : not + [동사] + only + out of + [명사] = '단지 ~때문만은 아니다' : \"단지 그들의 건강에 대한 염려 때문만은\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"However, 하지만. young adults don't decide, 젊은 성인들은 결정하지 않는다. to change their diets, 그들의 식단을 바꾸기로. only out of concern, 단지 염려 때문만으로. for their health, 그들의 건강에 대한. 이 문장 전체를 해석하면, 하지만, 젊은 성인들은 그들의 건강에 대한 염려 때문만으로 식단을 바꾸기로 결정하는 것은 아니다.","hl":"m"},{"n":23,"text":"이 문장은 앞에서 인정한 채식의 건강상 이점을 슬쩍 뒤집는 전환 문장이에요. 젊은 성인들이 식단을 바꾸는 이유가 건강에 대한 염려 하나뿐만은 아니라는 부분 부정이죠. 그래서 다음 문장부터 다른 이유들이 나올 거라는 신호를 주고 있어요.","hl":"mn"},{"n":24,"text":"첫 번째 어법 포인트는 decide 뒤에 온 to부정사예요. decide는 목적어로 to부정사를 쓰는 동사라서 decide to change처럼 to가 붙은 목적어가 와요. 두 번째는 only가 부정어와 만나서 만드는 부분 부정이에요. not only out of concern for their health라고 하면 단지 건강에 대한 염려 때문만은 아니라는 뜻이 되죠. 그리고 out of는 여기서 원인을 나타내는 전치사구로 쓰였어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 이들은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Some\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 선택을 한다\u003c/span>\u003cspan class=\"en\">make the choice\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">관심 때문에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">out \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">concern \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">동물의 권리에 대한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">animal \u003c/span>\u003cspan class=\"tgt\">rights\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어떤 이들은 동물의 권리에 대한 관심 때문에 그 선택을 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 '건강만이 이유는 아니다'라고 했으니, 그 첫 번째 대안을 제시하는 \u003cb class=\"key\">예시\u003c/b> 문장이다. Some은 앞에 나온 젊은 성인들 가운데 일부를 가리키고, the choice는 앞 문장의 식단을 바꾸는 선택을 받아낸 표현이다. 뒤에 나오는 Others와 짝을 이루어 이유를 \u003cb class=\"key\">나열\u003c/b>하는 흐름을 만든다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정대명사 Some(‘어떤 이들은’)\u003c/span> : Some + [복수동사] ~. Others + [복수동사] ... : \"어떤 이들은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 용법(원인)\u003c/span> : [동사] + out of + [감정명사] = '~때문에' : \"동물의 권리에 대한 관심 때문에\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"Some, 어떤 이들은. make the choice, 그 선택을 한다. out of concern, 관심 때문에. for animal rights, 동물의 권리에 대한. 이 문장 전체를 해석하면, 어떤 이들은 동물의 권리에 대한 관심 때문에 그 선택을 한다.","hl":"m"},{"n":26,"text":"이 문장은 건강이 아닌 다른 이유를 처음 꺼내는 예시 문장이에요. 어떤 이들은 동물의 권리에 대한 관심 때문에 채식을 선택한다는 거죠. 바로 뒤에 나오는 Others와 짝을 이루면서 이유를 하나씩 나열하는 흐름을 만들어요.","hl":"mn"},{"n":27,"text":"첫 번째는 부정대명사 Some이에요. 앞에 나온 young adults 가운데 일부를 가리키면서 뒤에 나올 Others와 짝을 이루죠. 두 번째는 out of인데요, 여기서는 장소가 아니라 감정 명사 앞에서 원인을 나타내는 전치사구로 쓰였어요. 그리고 concern for는 관심이나 염려를 나타내는 전치사 결합이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 통계는 보여준다\u003c/span>\u003cspan class=\"en\">Many statistics show\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대부분의 동물들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">majority \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">animals \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">식용으로 길러지는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">raised \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">food \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">갇혀 있다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">kept \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">작은 우리에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">small \u003c/span>\u003cspan class=\"tgt\">cages\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">많은 통계는 식용으로 길러지는 대부분의 동물들이 작은 우리에 갇혀 있다는 것을 보여준다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 꺼낸 동물 권리 관심의 근거를 \u003cb class=\"key\">통계\u003c/b>로 제시하는 문장이다. that절 안에서 '식용으로 길러지는'은 \u003cb class=\"key\">과거분사\u003c/b>가 명사를 뒤에서 꾸미고, '갇혀 있다'는 \u003cb class=\"key\">수동태\u003c/b>로 표현되어 동물이 당하는 처지임을 분명히 한다. 이 객관적 근거 덕분에 다음 문장의 항의가 자연스러워진다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 명사절(show의 목적어)\u003c/span> : show + [that + 주어 + 동사 ...] (that절/목적어) : \"식용으로 길러지는 대부분의 동물들이 작은 우리에 갇혀 있다는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사의 후치 수식(수동의 의미)\u003c/span> : [명사] + [p.p. + 전치사구] = '~되어지는 명사' : \"식용으로 길러지는 동물들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">수동태(be + p.p.)\u003c/span> : [주어] + be + p.p. + [전치사구] = '~되다, ~되어 있다' : \"작은 우리에 갇혀 있다\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"Many statistics show, 많은 통계는 보여준다. that the majority of the animals, 대부분의 동물들이. raised for food, 식용으로 길러지는. are kept, 갇혀 있다는 것을. in small cages, 작은 우리에. 이 문장 전체를 해석하면, 많은 통계는 식용으로 길러지는 대부분의 동물들이 작은 우리에 갇혀 있다는 것을 보여준다.","hl":"m"},{"n":29,"text":"이 문장은 앞에서 말한 동물 권리에 대한 관심이 왜 생겼는지 근거를 대는 문장이에요. 많은 통계가 식용으로 길러지는 동물들이 작은 우리에 갇혀 있다는 사실을 보여준다고 하죠. 그래서 다음 문장에서 청소년들이 항의한다는 흐름으로 자연스럽게 이어져요.","hl":"mn"},{"n":30,"text":"첫 번째는 show 뒤에 온 that절이에요. show는 타동사라서 목적어가 필요한데, 그 자리에 that절이 통째로 들어간 거죠. 두 번째는 animals 뒤에 온 raised for food인데요, 과거분사가 명사를 뒤에서 꾸미면서 수동의 의미를 내요. 세 번째는 are kept, 수동태예요. 동물이 사람에 의해 갇히는 것이니까 be kept in small cages라고 수동으로 표현한 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서,\u003c/span>\u003cspan class=\"en\">So,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 십 대들은\u003c/span>\u003cspan class=\"en\">many teens\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고기를 포기한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">give \u003c/span>\u003cspan class=\"tgt\">up\u003c/span> meat\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러한 조건에 저항하기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">protest \u003c/span>\u003cspan class=\"tgt\">those \u003c/span>\u003cspan class=\"tgt\">conditions\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그래서, 많은 십 대들은 그러한 조건에 저항하기 위해 고기를 포기한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 동물들이 좁은 우리에 갇혀 있다는 통계를 제시한 뒤, 그에 대한 반응으로 십 대들이 고기를 끊는 이유를 설명하는 문장이에요. give up meat는 '고기를 포기하다'라는 \u003cb class=\"key\">구동사\u003c/b>로 통째로 익혀야 해요. to protest는 '저항하기 위해'라는 \u003cb class=\"key\">목적\u003c/b>을 나타내는 to부정사로, 행동의 이유를 뒤에서 붙여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">구동사(동사+부사)\u003c/span> : give up + [목적어(meat)] : \"고기를 포기하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : give up + [목적어] + [to protest (to부정사구/목적)] : \"그러한 조건에 저항하기 위해\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"So, 그래서. many teens, 많은 십 대들은. give up meat, 고기를 포기한다. to protest those conditions, 그러한 조건에 저항하기 위해. 이 문장 전체를 해석하면, 그래서, 많은 십 대들은 그러한 조건에 저항하기 위해 고기를 포기한다.","hl":"m"},{"n":32,"text":"이 문장은 앞에서 동물들이 좁은 우리에 갇혀 있다는 통계를 보여 준 다음, 그래서 많은 십 대들이 고기를 끊는다고 말하고 있어요. protest는 '저항하다, 항의하다'라는 뜻이고 those conditions는 바로 앞에 나온 좁은 우리 같은 사육 조건을 가리키죠. 결국 채식을 선택하는 이유가 건강이 아니라 동물권이라는 흐름을 이어 주는 문장이에요.","hl":"mn"},{"n":33,"text":"어법 포인트 두 개만 짚을게요. 첫 번째, give up은 동사와 부사가 만나 '포기하다'가 되는 구동사예요. 그래서 give up meat를 '고기를 포기하다'로 통째로 외워 두세요. 두 번째, to protest는 '저항하기 위해'라는 목적을 나타내는 to부정사 부사적 용법이에요. 고기를 포기하는 이유를 뒤에서 붙여 주는 역할을 한답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 사람들은\u003c/span>\u003cspan class=\"en\">Others\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">채식주의로 돌아서고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">turn \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">vegetarianism\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">환경을 지지하기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">support \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">environment\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">다른 사람들은 환경을 지지하기 위해 채식주의가 된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 동물권을 이유로 채식을 선택한 사람들에 이어, 이번에는 \u003cb class=\"key\">환경\u003c/b>을 생각하는 또 다른 집단을 소개하며 이유를 하나 더 추가하는 문장이에요. Others는 앞에 나온 some과 짝을 이루어 '다른 사람들은'이라는 뜻이에요. turn to는 '~로 돌아서다'라는 \u003cb class=\"key\">관용 \u003c/b>\u003cb class=\"key\">표현\u003c/b>으로 여기서는 채식주의로 방향을 바꾼다는 의미입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관용 표현(turn to + 명사)\u003c/span> : turn to + [명사(vegetarianism)] : \"채식주의로 돌아서다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : turn to + [명사] + [to support (to부정사구/목적)] : \"환경을 지지하기 위해\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"Others, 다른 사람들은. turn to vegetarianism, 채식주의로 돌아서고. to support the environment, 환경을 지지하기 위해. 이 문장 전체를 해석하면, 다른 사람들은 환경을 지지하기 위해 채식주의가 된다.","hl":"m"},{"n":35,"text":"앞 문장에서 동물권 때문에 채식을 선택한 사람들을 말했으니, 이 문장은 또 다른 사람들을 소개하면서 이유를 하나 더 붙여요. Others는 '다른 사람들은'이라는 뜻으로 앞에 나온 some과 짝을 이루는 표현이죠. 그리고 support는 '지지하다'인데, 여기서는 환경을 생각하고 돕는다는 의미로 이해하시면 자연스러워요.","hl":"mn"},{"n":36,"text":"어법 포인트는 두 가지예요. 첫째, turn to는 '~로 돌아서다'라는 관용 표현이에요. 그래서 turn to vegetarianism을 '채식주의로 돌아서다, 채식주의가 되다'로 해석해요. 둘째, to support는 '지지하기 위해'라는 목적의 to부정사 부사적 용법이에요. 왜 채식을 택했는지 그 목적을 뒤에서 설명해 주고 있죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고기 생산은\u003c/span>\u003cspan class=\"en\">Meat production\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 양의 ~을 사용한다\u003c/span>\u003cspan class=\"en\">uses \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">large \u003c/span>\u003cspan class=\"tgt\">amounts \u003c/span>\u003cspan class=\"tgt\">of\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">물, 땅, 곡물, 그리고 에너지를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">water, \u003c/span>\u003cspan class=\"tgt\">land, \u003c/span>\u003cspan class=\"tgt\">grain, \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">energy\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">고기 생산은 많은 양의 물, 땅, 곡물과 에너지를 사용한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 채식주의를 택하는 환경적 이유를 구체적으로 뒷받침하는 문장이에요. 고기 생산이 물, 땅, 곡물, 에너지를 많이 소비한다는 사실을 나열하며 \u003cb class=\"key\">근거\u003c/b>를 제시하죠. large amounts of는 셀 수 없는 명사와 함께 쓰는 \u003cb class=\"key\">수량 \u003c/b>\u003cb class=\"key\">표현\u003c/b>이라는 점을 꼭 기억하세요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수량 표현(amounts of + 불가산명사)\u003c/span> : large amounts of + [불가산명사] : \"많은 양의\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">병렬 구조\u003c/span> : [명사 A], [명사 B], [명사 C], and [명사 D] : \"물, 땅, 곡물, 그리고 에너지\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"Meat production, 고기 생산은. uses large amounts of, 많은 양의 ~을 사용한다. water, land, grain, and energy, 물, 땅, 곡물, 그리고 에너지를. 이 문장 전체를 해석하면, 고기 생산은 많은 양의 물, 땅, 곡물과 에너지를 사용한다.","hl":"m"},{"n":38,"text":"이 문장은 환경을 생각해서 채식을 한다는 주장에 구체적인 근거를 대 주는 역할이에요. 고기 생산에 물과 땅과 곡물과 에너지가 얼마나 많이 들어가는지 나열하면서 자원 소비가 크다는 점을 보여 주죠. 다음 문장에서는 동물 폐기물로 인한 오염 문제까지 이어지니까, 이 문장이 환경 근거의 출발점이라고 보시면 됩니다.","hl":"mn"},{"n":39,"text":"첫 번째 포인트는 수량 표현이에요. water나 energy처럼 셀 수 없는 불가산명사에는 many를 쓰지 않고 large amounts of를 써요. 그래서 many가 아니라 large amounts of water가 된 거죠. 두 번째는 병렬 구조예요. 물, 땅, 곡물, 에너지 네 개의 명사가 and로 나란히 묶여서 uses의 목적어 역할을 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 또한\u003c/span>\u003cspan class=\"en\">It also\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">문제를 만들어 낸다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">creates \u003c/span>\u003cspan class=\"tgt\">problems \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가축의 배설물과 관련된\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">animal \u003c/span>\u003cspan class=\"tgt\">waste\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오염을 일으키는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">resulting \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">pollution\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 또한 오염을 일으키는 가축의 배설물 문제를 만들어 낸다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 고기 생산이 물·땅·곡물·에너지를 많이 쓴다고 했죠. 이 문장은 거기에 더해 \u003cb class=\"key\">가축의 \u003c/b>\u003cb class=\"key\">배설물\u003c/b>이 \u003cb class=\"key\">오염\u003c/b>까지 일으킨다는 또 하나의 환경 문제를 제시합니다. resulting in pollution은 배설물이 오염을 초래하는 능동 관계임을 보여 주는 표현입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 with의 용법(~와 관련된)과 주어-동사 수의 일치\u003c/span> : create + [목적어 problems] + with + [대상] : \"가축의 배설물과 관련된 문제를 만들어 낸다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재분사의 형용사적 용법(능동)\u003c/span> : [명사 animal waste] + resulting in + [결과 pollution] : \"오염을 일으키는\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"It also, 그것은 또한. creates problems, 문제를 만들어 낸다. with animal waste, 가축의 배설물과 관련된. resulting in pollution, 오염을 일으키는. 이 문장 전체를 해석하면, 그것은 또한 오염을 일으키는 가축의 배설물 문제를 만들어 낸다.","hl":"m"},{"n":41,"text":"앞에서 고기 생산이 물과 땅과 곡물과 에너지를 많이 쓴다고 했죠. 이 문장은 거기에 더해 가축의 배설물이 오염까지 일으킨다는 또 하나의 환경 문제를 짚어 줍니다. 그래서 고기 생산은 자원도 많이 쓰고 환경도 더럽힌다는 흐름이 여기서 완성되는 거예요.","hl":"mn"},{"n":42,"text":"먼저 resulting in pollution을 보세요. animal waste가 오염을 일으키는 주체라서 능동 관계이기 때문에 현재분사 resulting을 씁니다. 그리고 이 분사구는 앞에 있는 명사를 꾸며 준다는 점을 꼭 기억하세요. 두 번째로 problems with animal waste에서 with는 관련의 의미로 문제의 내용을 설명해 주고, 주어 It이 삼인칭 단수라서 동사에 삼인칭 단수 표시가 붙는다는 것도 함께 챙겨 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 경향은 보여준다\u003c/span>\u003cspan class=\"en\">These trends show\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오늘날 젊은이들이 …라는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">today's \u003c/span>\u003cspan class=\"tgt\">youth \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 인식하고 더 민감하다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">aware \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">sensitive \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">동물의 권리와 환경 문제에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">animal \u003c/span>\u003cspan class=\"tgt\">rights \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">environmental \u003c/span>\u003cspan class=\"tgt\">problems\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이러한 경향은 오늘날 젊은이들이 동물의 권리와 환경 문제를 더 인식하고 그것에 더 민감하다는 것을 보여준다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞부분에서 동물 권리 문제와 환경 문제를 차례로 다뤘죠. 이 문장은 그 모든 내용을 하나로 묶는 \u003cb class=\"key\">요약\u003c/b> 문장으로, 오늘날 젊은이들의 인식 수준이 높아졌음을 강조합니다. These trends라는 \u003cb class=\"key\">지시어\u003c/b>가 앞의 흐름 전체를 받는다는 점이 핵심입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that의 명사절(타동사 show의 목적어)\u003c/span> : show + [that + 주어 + 동사 ~ ] : \"오늘날 젊은이들이 …라는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">병렬구조와 비교급\u003c/span> : more [aware of] and [sensitive to] + [목적어] : \"더 인식하고 더 민감한\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"These trends show, 이러한 경향은 보여준다. that today's youth are, 오늘날 젊은이들이 …라는 것을. more aware of and sensitive to, 더 인식하고 더 민감하다. animal rights and environmental problems, 동물의 권리와 환경 문제에. 이 문장 전체를 해석하면, 이러한 경향은 오늘날 젊은이들이 동물의 권리와 환경 문제를 더 인식하고 그것에 더 민감하다는 것을 보여준다.","hl":"m"},{"n":44,"text":"앞에서 동물 권리 문제와 환경 문제를 차례로 다뤘죠. 이 문장은 그 흐름 전체를 하나로 묶어 주는 요약 문장이에요. These trends라는 지시어가 앞의 모든 내용을 받아서 오늘날 젊은이들의 인식이 높아졌다고 말해 주는 겁니다.","hl":"mn"},{"n":45,"text":"첫 번째로 that은 show 뒤에서 목적어 역할을 하는 명사절을 이끌어요. youth는 복수 취급이라서 are가 온다는 것도 꼭 기억하세요. 두 번째로 aware of and sensitive to는 병렬구조라서 뒤에 오는 animal rights and environmental problems를 두 전치사가 함께 공유한다는 점이 중요합니다. more는 비교급으로 두 형용사를 통째로 수식한다는 것도 챙겨 두세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>채식은 점점 더 많은 젊은 성인들이 고기와 생선을 먹는 것에 \u003cb class=\"key\">반대\u003c/b>하면서 더 인기를 얻고 있다.\u003c/li>\u003cli>계획된 채식주의 식단은 건강에 좋고 영양가가 높으며 특정 \u003cb class=\"key\">질병\u003c/b>을 예방하고 치료하는 이점을 제공한다.\u003c/li>\u003cli>그러나 젊은 성인들은 \u003cb class=\"key\">건강\u003c/b>에 대한 염려 때문만이 아니라 \u003cb class=\"key\">동물의 \u003c/b>\u003cb class=\"key\">권리\u003c/b>와 환경에 대한 관심 때문에 식단을 바꾼다.\u003c/li>\u003cli>식용 동물의 사육 조건과 고기 생산의 환경 문제에 민감한 오늘날 젊은이들의 \u003cb class=\"key\">인식\u003c/b>을 보여 주는 글이 이다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Young adults are turning to vegetarianism not only for their health but also out of concern for animal rights and the environment.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">채식은 건강에 좋고 영양가가 높지만, 젊은 성인들은 \u003cb class=\"key\">건강\u003c/b>에 대한 염려 때문만이 아니라 \u003cb class=\"key\">동물의 \u003c/b>\u003cb class=\"key\">권리\u003c/b>와 \u003cb class=\"key\">환경\u003c/b> 문제에 대한 관심 때문에 채식을 선택한다. 이러한 경향은 오늘날 젊은이들이 그 문제들을 더 인식하고 더 민감하다는 것을 보여 준다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":46,"text":"오늘 글의 핵심을 다시 한번 정리해 볼게요. 젊은 성인들은 건강에 대한 염려뿐 아니라 동물의 권리와 환경에 대한 관심 때문에 채식을 선택합니다. 그리고 이러한 경향은 오늘날 젊은이들이 그 문제들을 더 인식하고 더 민감하다는 것을 보여 줘요. 여러분도 식탁 위의 선택이 어떤 가치를 담고 있는지 한 번쯤 생각해 보면 좋겠습니다. 오늘 수업도 수고 많았어요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
