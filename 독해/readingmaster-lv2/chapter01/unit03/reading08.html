<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터2 Reading08 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터2 Reading08","audioDir":"reading08_audio","preview":false,"count":49,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.520em\">Reading08\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터2\u003c/div>\u003ch1>Teachers' Body Language Is Always at Work\u003c/h1>\u003ch2>교사의 몸짓 언어는 언제나 작동한다\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>교사가 학생들에게 보내는 \u003cb class=\"key\">비언어적 \u003c/b>\u003cb class=\"key\">메시지\u003c/b>인 \u003cb class=\"key\">몸짓 \u003c/b>\u003cb class=\"key\">언어\u003c/b>는 학생과의 관계와 \u003cb class=\"key\">교실 \u003c/b>\u003cb class=\"key\">분위기\u003c/b>에 상당한 차이를 만들 수 있으므로, 교사는 그것이 항상 작동하고 있음을 기억해야 한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Teachers should remember that their body language, such as a welcoming smile, can significantly affect their relationship with students and the classroom climate.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 오늘은 교사의 몸짓 언어에 관한 지문을 함께 읽어 볼 거예요. 이 글은 교사의 몸짓 언어, 즉 body language가 학생들과의 관계와 교실 분위기에 어떤 영향을 주는지 이야기해요. 핵심은 교사의 비언어적 메시지가 학생에게 큰 차이를 만들 수 있으니, 자신의 몸짓 언어가 항상 작동한다는 점을 기억하자는 거예요. 그럼 지문을 차근차근 살펴볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">\u003cb class=\"key\">비언어적 \u003c/b>\u003cb class=\"key\">의사소통\u003c/b>(nonverbal communication)은 말이 아닌 표정, 몸짓, 시선, 자세 등으로 감정과 의도를 전달하는 방식이에요. 그중 \u003cb class=\"key\">몸짓 \u003c/b>\u003cb class=\"key\">언어\u003c/b>(body language)는 상대방에 대한 호감이나 긴장, 편안함을 순식간에 보여 주죠. 사람들은 말의 내용보다 표정과 태도에서 더 많은 정보를 얻기도 하기 때문에, 교실에서 교사의 미소나 시선은 학생의 \u003cb class=\"key\">심리적 \u003c/b>\u003cb class=\"key\">안전감\u003c/b>에 큰 영향을 줘요. 이것은 마치 식당에 들어갔을 때 직원의 환한 미소 한 번에 매장 전체의 분위기가 달라지는 것과 비슷해요. 특히 학생들은 교사의 작은 몸짓도 민감하게 읽기 때문에, 교사는 자신의 몸짓 언어가 늘 \u003cb class=\"key\">메시지\u003c/b>를 보내고 있음을 알아야 해요.\u003c/div>","segs":[{"n":2,"text":"비언어적 의사소통, 즉 nonverbal communication은 말이 아닌 표정과 몸짓, 시선, 자세로 감정과 의도를 전달하는 방식이에요. 그중 몸짓 언어, body language는 상대방에 대한 호감이나 긴장, 편안함을 순식간에 보여 주죠. 사람들은 말의 내용보다 표정과 태도에서 더 많은 정보를 얻기도 하기 때문에, 교실에서 교사의 미소나 시선은 학생의 심리적 안전감에 큰 영향을 줘요. 이것은 식당에 들어갔을 때 직원의 환한 미소 한 번에 매장 전체의 분위기가 달라지는 것과 비슷해요. 특히 학생들은 교사의 작은 몸짓도 민감하게 읽기 때문에, 교사는 자신의 몸짓 언어가 늘 메시지를 보내고 있음을 알아야 해요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>몸짓 언어의 개념\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>일부 전문가들은 우리가 몸을 움직임으로써 의사소통을 한다고 말합니다. 이것은 우리가 \u003cb class=\"key\">몸짓 \u003c/b>\u003cb class=\"key\">언어\u003c/b>를 사용한다는 것을 의미합니다. 즉, 말이 아닌 몸의 움직임도 중요한 \u003cb class=\"key\">의사소통 \u003c/b>\u003cb class=\"key\">수단\u003c/b>이라는 출발점입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>교사에게 주는 의미\u003csmall>주장 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>글은 교사인 여러분이 학생들에게 보내는 \u003cb class=\"key\">비언어적 \u003c/b>\u003cb class=\"key\">메시지\u003c/b>에 주목해 보자고 합니다. 그러한 메시지는 학생들과의 \u003cb class=\"key\">관계\u003c/b>에 상당한 차이를 가져올 수 있습니다. 여기서 글의 핵심 주장이 제시됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>학생의 민감한 인식\u003csmall>근거 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>일반적으로 대부분의 학생들은 자신의 선생님의 \u003cb class=\"key\">몸짓 \u003c/b>\u003cb class=\"key\">언어\u003c/b>를 매우 인식합니다. 예를 들어 학생들이 처음 교실에 들어가면 자신의 선생님을 찾습니다. 학생들이 교사의 몸짓을 먼저 살핀다는 점이 \u003cb class=\"key\">근거\u003c/b>로 제시됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>환영의 미소와 효과\u003csmall>예시 · 문장 7–11\u003c/small>\u003c/h4>\u003cp>선생님이 친근한 인사와 환영의 미소를 짓는다고 상상해 보면, 그것은 학생에게 격려가 되고 힘을 줍니다. 선생님은 학생들에게 자신이 그들을 보게 되어 기쁘다는 것을 알리기 위해 미소를 짓습니다. 그것은 많은 시간이나 노력을 요구하지 않지만, 수업 시작과 동시에 \u003cb class=\"key\">교실 \u003c/b>\u003cb class=\"key\">분위기\u003c/b>에 상당한 차이를 가져올 수 있습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>항상 작동하는 몸짓 언어\u003csmall>결론 · 문장 12\u003c/small>\u003c/h4>\u003cp>선생님은 학생들과 함께 있을 때 자신의 \u003cb class=\"key\">몸짓 \u003c/b>\u003cb class=\"key\">언어\u003c/b>가 항상 작동하고 있다는 것을 기억해야 합니다. 작은 미소 하나도 끊임없이 학생에게 \u003cb class=\"key\">메시지\u003c/b>를 보내고 있다는 결론입니다. 그래서 교사는 자신의 몸짓을 의식적으로 활용할 필요가 있습니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 지문의 흐름을 몸짓 언어의 개념부터 학생의 인식, 환영의 미소의 효과, 그리고 결론까지 따라가 볼게요.","hl":null},{"n":4,"text":"먼저 일부 전문가들은 우리가 몸을 움직임으로써 의사소통을 한다고 말해요. 이것은 우리가 몸짓 언어를 사용한다는 뜻이죠. 즉, 말이 아닌 몸의 움직임도 중요한 의사소통 수단이라는 출발점이에요.","hl":"f0"},{"n":5,"text":"다음으로 글은 교사인 여러분이 학생들에게 보내는 비언어적 메시지에 주목해 보자고 해요. 그러한 메시지는 학생들과의 관계에 상당한 차이를 가져올 수 있다고 하죠. 여기서 글의 핵심 주장이 제시되는 거예요.","hl":"f1"},{"n":6,"text":"이어서 일반적으로 대부분의 학생들은 자신의 선생님의 몸짓 언어를 매우 인식한다고 설명해요. 예를 들어 학생들이 처음 교실에 들어가면 자신의 선생님을 찾는다고 하죠. 학생들이 교사의 몸짓을 먼저 살핀다는 점이 중요한 근거가 되는 거예요.","hl":"f2"},{"n":7,"text":"그다음 선생님이 친근한 인사와 환영의 미소를 짓는다고 상상해 보세요. 그것은 학생에게 격려가 되고 힘을 주며, 선생님은 자신이 그들을 보게 되어 기쁘다는 것을 알리기 위해 미소를 짓는 거예요. 이런 미소는 많은 시간이나 노력을 요구하지 않지만, 수업 시작과 동시에 교실 분위기에 상당한 차이를 가져올 수 있어요.","hl":"f3"},{"n":8,"text":"마지막으로 선생님은 학생들과 함께 있을 때 자신의 몸짓 언어가 항상 작동하고 있다는 것을 기억해야 해요. 작은 미소 하나도 끊임없이 학생에게 메시지를 보내고 있다는 결론이죠. 그래서 교사는 자신의 몸짓을 의식적으로 활용할 필요가 있어요.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 4번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 첫 부분에서 교사의 \u003cb class=\"key\">비언어적 \u003c/b>\u003cb class=\"key\">메시지\u003c/b>에 주목하자고 하며 그 중요성을 먼저 밝힙니다. 이어서 학생들이 교사의 \u003cb class=\"key\">몸짓 \u003c/b>\u003cb class=\"key\">언어\u003c/b>를 잘 인식한다는 일반적 근거와 환영의 미소라는 구체적 \u003cb class=\"key\">예시\u003c/b>를 제시합니다. 마지막에는 교사의 몸짓 언어가 항상 작동한다는 결론으로 마무리합니다. 따라서 중심 내용이 앞부분에 제시되는 \u003cb class=\"key\">두괄식\u003c/b>이자 주장과 근거가 이어지는 전개 방식입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>This means (2)\u003c/b>\u003cspan>재진술\u003c/span>\u003cb>In general (5)\u003c/b>\u003cspan>일반화\u003c/span>\u003cb>For example (6)\u003c/b>\u003cspan>예시\u003c/span>\u003cb>But (11)\u003c/b>\u003cspan>전환·대조\u003c/span>\u003cb>should remember (12)\u003c/b>\u003cspan>결론·당부\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">moving our bodies\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">body language\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">nonverbal messages\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">teacher's body language\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">friendly greeting and a welcoming smile\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">smiles at students\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">body language is always at work\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"이 글은 교사의 비언어적 메시지가 중요하다는 주장을 먼저 내세우고, 학생의 인식과 환영의 미소라는 근거를 뒤에 붙이는 주장과 근거의 전개 방식이에요. 중심 내용이 앞부분에 먼저 나오기 때문에 두괄식 구조로 볼 수 있죠. 그래서 첫 부분에서 필자가 왜 교사의 몸짓 언어를 강조하는지 잡고, 뒤의 예시가 그 주장을 어떻게 뒷받침하는지 확인하면 돼요.","hl":"ty"},{"n":10,"text":"This means는 앞 내용을 다시 말해 주는 재진술 신호예요. In general은 일반화 신호이고, For example은 구체적인 예시를 시작하는 신호죠. But은 앞의 내용과 다른 방향으로 돌아서는 전환 신호로 볼 수 있어요. 마지막의 should remember는 교사에게 당부하는 결론의 신호 역할을 해요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>expert\u003c/b>\u003cem>명사\u003c/em>\u003cspan>전문가\u003c/span>\u003c/div>\u003cdiv>\u003cb>communicate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>의사소통하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>move\u003c/b>\u003cem>동사\u003c/em>\u003cspan>움직이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>mean\u003c/b>\u003cem>동사\u003c/em>\u003cspan>의미하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>body language\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>몸짓 언어\u003c/span>\u003c/div>\u003cdiv>\u003cb>pay attention to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 주목하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>nonverbal\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>비언어적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>message\u003c/b>\u003cem>명사\u003c/em>\u003cspan>메시지\u003c/span>\u003c/div>\u003cdiv>\u003cb>significant\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>상당한, 중요한\u003c/span>\u003c/div>\u003cdiv>\u003cb>difference\u003c/b>\u003cem>명사\u003c/em>\u003cspan>차이\u003c/span>\u003c/div>\u003cdiv>\u003cb>relationship\u003c/b>\u003cem>명사\u003c/em>\u003cspan>관계\u003c/span>\u003c/div>\u003cdiv>\u003cb>in general\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>일반적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>aware of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 인식하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>enter\u003c/b>\u003cem>동사\u003c/em>\u003cspan>들어가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>look for\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>찾다\u003c/span>\u003c/div>\u003cdiv>\u003cb>imagine\u003c/b>\u003cem>동사\u003c/em>\u003cspan>상상하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>friendly\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>친근한\u003c/span>\u003c/div>\u003cdiv>\u003cb>greeting\u003c/b>\u003cem>명사\u003c/em>\u003cspan>인사\u003c/span>\u003c/div>\u003cdiv>\u003cb>welcoming\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>환영하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>smile\u003c/b>\u003cem>명사\u003c/em>\u003cspan>미소\u003c/span>\u003c/div>\u003cdiv>\u003cb>encouraging\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>격려가 되는\u003c/span>\u003c/div>\u003cdiv>\u003cb>empowering\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>힘을 주는\u003c/span>\u003c/div>\u003cdiv>\u003cb>glad\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>기쁜\u003c/span>\u003c/div>\u003cdiv>\u003cb>require\u003c/b>\u003cem>동사\u003c/em>\u003cspan>요구하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>a great deal of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>많은\u003c/span>\u003c/div>\ ss=\"a\">cold\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">encouraging\u003c/b>\u003cspan class=\"m\">격려가 되는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">supportive\u003c/span>\u003cspan class=\"s\">heartening\u003c/span>\u003cspan class=\"s\">motivating\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">discouraging\u003c/span>\u003cspan class=\"a\">disheartening\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">glad\u003c/b>\u003cspan class=\"m\">기쁜\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">pleased\u003c/span>\u003cspan class=\"s\">happy\u003c/span>\u003cspan class=\"s\">delighted\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">sad\u003c/span>\u003cspan class=\"a\">unhappy\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">difference\u003c/b>\u003cspan class=\"m\">차이\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">distinction\u003c/span>\u003cspan class=\"s\">gap\u003c/span>\u003cspan class=\"s\">contrast\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">similarity\u003c/span>\u003cspan class=\"a\">sameness\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">remember\u003c/b>\u003cspan class=\"m\">기억하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">recall\u003c/span>\u003cspan class=\"s\">recollect\u003c/span>\u003cspan class=\"s\">keep in mind\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">forget\u003c/span>\u003cspan class=\"a\">overlook\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어도 함께 정리해 볼게요. significant는 important, meaningful과 가깝고, insignificant나 trivial과 반대돼요. aware는 conscious, mindful과 비슷하고 unaware나 oblivious과 반대죠. friendly는 warm, kind와 가깝고 hostile이나 unfriendly와 반대되며, encouraging은 supportive, motivating과 가깝고 discouraging과 반대예요. 마지막으로 remember는 recall, recollect와 비슷하고 forget과 반대라는 점을 기억하세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일부 전문가들은\u003c/span>\u003cspan class=\"en\">Some experts\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~라고 말한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">say \u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 의사소통을 한다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">communicate \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 몸을 움직임으로써\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">moving \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">bodies\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">일부 전문가들은 우리가 몸을 움직임으로써 의사소통을 한다고 말한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글의 화제를 여는 첫 문장으로, 전문가들의 말을 빌려 의사소통의 수단이 말이 아니라 \u003cb class=\"key\">몸의 \u003c/b>\u003cb class=\"key\">움직임\u003c/b>이라는 점을 먼저 던져 줍니다. 여기서 communicate by moving은 '몸을 움직여서 소통한다'는 뜻으로, 뒤에 나올 \u003cb class=\"key\">body \u003c/b>\u003cb class=\"key\">language\u003c/b> 개념의 발판이 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that (목적어절 유도)\u003c/span> : say + [that + 주어 + 동사 ~] (that절/목적어) : \"우리가 몸을 움직임으로써 의사소통을 한다고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 by + 동명사 (수단·방법)\u003c/span> : by + [[동명사]] (~함으로써) : \"우리 몸을 움직임으로써\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동명사의 목적어\u003c/span> : [[동명사]] + 목적어(our bodies) : \"우리 몸을 움직이는 것\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"Some experts, 일부 전문가들은. say that, ~라고 말한다. we communicate, 우리가 의사소통을 한다고. by moving our bodies, 우리 몸을 움직임으로써. 이 문장 전체를 해석하면, 일부 전문가들은 우리가 몸을 움직임으로써 의사소통을 한다고 말한다.","hl":"m"},{"n":14,"text":"이 문장은 글 전체의 화제를 여는 첫 문장이에요. 일부 전문가들의 말을 빌려 우리가 몸을 움직여서 의사소통을 한다는 사실을 먼저 꺼내고 있죠. 여기서 중요한 건 소통의 수단이 말이 아니라 몸의 움직임이라는 점이에요.","hl":"mn"},{"n":15,"text":"첫째로 say that을 보면 say 뒤에 완전한 절이 와서 목적어 역할을 하고 있어요. 이때 절을 이끄는 접속사가 that이고, 그래서 say that we communicate라고 쓴 거예요. 둘째로 by moving을 보면 전치사 by 뒤에 동사원형이 아니라 동명사 moving이 왔죠. 전치사 뒤에는 동명사가 와서 우리 몸을 움직임으로써라는 수단을 나타냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은 의미한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">This\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">means \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 '몸짓 언어'를 사용한다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">use \u003c/span>\u003cspan class=\"tgt\">'body \u003c/span>\u003cspan class=\"tgt\">language'\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것은 우리가 ‘몸짓 언어’를 사용한다는 것을 의미한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 내용을 This로 받아 핵심 용어를 정리해 주는 문장입니다. 몸을 움직여 소통한다는 말이 결국 \u003cb class=\"key\">몸짓 \u003c/b>\u003cb class=\"key\">언어\u003c/b>를 쓴다는 뜻이라고 풀어 주는 것이죠. 이 글의 주제어인 \u003cb class=\"key\">body \u003c/b>\u003cb class=\"key\">language\u003c/b>가 처음 등장하는 자리이기도 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지시대명사 this\u003c/span> : [[This]] + 동사 (주어 역할) : \"이것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 that의 생략 (목적어절)\u003c/span> : mean + [(that) + 주어 + 동사 ~] : \"우리가 ‘몸짓 언어’를 사용한다는 것을 의미한다\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"This means, 이것은 의미한다. we use 'body language', 우리가 '몸짓 언어'를 사용한다는 것을. 이 문장 전체를 해석하면, 이것은 우리가 ‘몸짓 언어’를 사용한다는 것을 의미한다.","hl":"m"},{"n":17,"text":"이 문장은 앞 문장의 내용을 받아서 핵심 용어를 정리하는 역할을 해요. 몸을 움직여 의사소통한다는 말이 결국 몸짓 언어를 사용한다는 뜻이라고 풀어 주는 거죠. 그래서 이 글의 주제어인 body language가 여기서 처음 등장합니다.","hl":"mn"},{"n":18,"text":"먼저 This는 앞 문장 전체를 받는 지시대명사예요. 그래서 이것은이라고 해석하고 주어로 봅니다. 그다음 means 뒤를 보면 we use body language라는 절이 목적어로 통째로 와 있죠. 이때 접속사 that이 생략되어 있어서 동사가 바로 이어지는 것처럼 보이는 거예요. 그러니 목적어절이 왔다고 생각하고 해석하면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~에 주목해 보자\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Let's \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">pay \u003c/span>\u003cspan class=\"tgt\">attention \u003c/span>\u003cspan class=\"tgt\">to\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">비언어적인 메시지에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">nonverbal \u003c/span>\u003cspan class=\"tgt\">messages \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분 교사들이 보내는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">teachers \u003c/span>\u003cspan class=\"tgt\">send\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분의 학생들에게\u003c/span>\u003cspan class=\"en\">to your students.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">교사인 여러분이 여러분의 학생들에게 보내는 비언어적인 메시지에 주목해보자.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 말한 몸짓 언어를 이제 교사가 학생에게 보내는 \u003cb class=\"key\">비언어적 \u003c/b>\u003cb class=\"key\">메시지\u003c/b>로 좁혀 이야기하는 문장입니다. 즉 이 글의 대상이 '교사'임을 밝히며 본격적인 조언을 시작하는 \u003cb class=\"key\">화제 \u003c/b>\u003cb class=\"key\">제시\u003c/b> 역할을 합니다. you teachers는 '교사인 여러분'이라는 뜻으로 독자를 직접 끌어들이는 표현입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">청유문 Let's\u003c/span> : [[Let's]] + 동사원형 ~ : \"~에 주목해 보자\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관용표현 pay attention to\u003c/span> : pay attention [[to]] + 명사 : \"~에 주목하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사의 생략\u003c/span> : 선행사 + [[(which/that)]] + 주어 + 동사 : \"여러분 교사들이 보내는 비언어적인 메시지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">동격의 인칭대명사\u003c/span> : [[you]] + 복수명사 (여러분 ~들) : \"교사인 여러분\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"Let's pay attention to, ~에 주목해 보자. the nonverbal messages, 비언어적인 메시지에. you teachers send, 여러분 교사들이 보내는. to your students, 여러분의 학생들에게. 이 문장 전체를 해석하면, 교사인 여러분이 여러분의 학생들에게 보내는 비언어적인 메시지에 주목해보자.","hl":"m"},{"n":20,"text":"이 문장은 앞에서 말한 몸짓 언어를 교사가 학생에게 보내는 비언어적 메시지로 좁혀 주는 문장이에요. 그래서 이제 글의 대상이 교사라는 점이 분명해지죠. 독자를 교사인 여러분이라고 직접 부르면서 본격적인 조언을 시작하는 화제 제시 역할을 합니다.","hl":"mn"},{"n":21,"text":"첫째로 Let's는 Let us의 줄임말로 청유를 나타내요. 뒤에는 동사원형 pay가 온다는 것도 꼭 기억하세요. 둘째로 pay attention to에서 to는 전치사예요. 그래서 뒤에 the nonverbal messages라는 명사구가 오는 거죠. 셋째로 the nonverbal messages you teachers send를 보면 messages와 you 사이에 목적격 관계대명사가 생략되어 있어요. messages가 send의 목적어로 들어가는 구조라고 이해하면 됩니다. 넷째로 you teachers는 you와 teachers가 동격으로 묶여서 교사인 여러분이라는 뜻을 만들어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 만들 수 있다\u003c/span>\u003cspan class=\"en\">It \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상당한 차이를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">significant \u003c/span>\u003cspan class=\"tgt\">difference\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분의 관계에\u003c/span>\u003cspan class=\"en\">in your relationship\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">학생들과의\u003c/span>\u003cspan class=\"en\">with students.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 학생들과 여러분의 관계에 상당한 차이를 가져올 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 여기서 \u003cb class=\"key\">It\u003c/b>은 앞 문장에 나온 '학생들에게 보내는 비언어적 메시지', 즉 교사의 \u003cb class=\"key\">몸짓 \u003c/b>\u003cb class=\"key\">언어\u003c/b>를 가리켜요. 교사가 몸짓 언어에 관심을 기울이는 것만으로 학생들과의 \u003cb class=\"key\">관계\u003c/b>에 상당한 차이를 만들 수 있다는 뜻이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 + 동사원형\u003c/span> : can[조동사] + make[동사원형] : \"~할 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관용표현 make a difference\u003c/span> : make + a + (형용사) + difference : \"상당한 차이를 만들다\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"It can make, 그것은 만들 수 있다. a significant difference, 상당한 차이를. in your relationship, 여러분의 관계에. with students, 학생들과의. 이 문장 전체를 해석하면, 그것은 학생들과 여러분의 관계에 상당한 차이를 가져올 수 있다.","hl":"m"},{"n":23,"text":"여기서 It은 바로 앞에 나온 비언어적 메시지, 즉 교사의 몸짓 언어를 가리켜요. 그러니까 교사가 몸짓 언어에 관심을 기울이면 학생들과의 관계에 상당한 차이를 만들 수 있다는 말이죠. can이 들어 있어서 가능하다는 느낌을 살려 주세요.","hl":"mn"},{"n":24,"text":"먼저 can make에서 can은 조동사예요. 조동사 뒤에는 동사원형이 오기 때문에 make를 그대로 쓴 겁니다. 그리고 make a difference는 차이를 만들다, 다시 말해 영향을 주다라는 관용표현이에요. 여기에 significant가 끼어서 상당한 차이를 만든다, 즉 큰 변화를 준다는 뜻이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일반적으로,\u003c/span>\u003cspan class=\"en\">In general,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대부분의 학생들은 흔히\u003c/span>\u003cspan class=\"en\">most students \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">often \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매우 인식하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">very \u003c/span>\u003cspan class=\"tgt\">aware \u003c/span>\u003cspan class=\"tgt\">of\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 선생님의 몸짓 언어를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">teacher's \u003c/span>\u003cspan class=\"tgt\">body \u003c/span>\u003cspan class=\"tgt\">language\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">일반적으로 대부분의 학생들은 흔히 자신의 선생님의 몸짓 언어를 매우 인식한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> \u003cb class=\"key\">In \u003c/b>\u003cb class=\"key\">general\u003c/b>은 글의 흐름을 넓게 일반화하는 표현이에요. 대부분의 학생들은 교사의 \u003cb class=\"key\">몸짓 \u003c/b>\u003cb class=\"key\">언어\u003c/b>를 흔히 \u003cb class=\"key\">인식하고\u003c/b> 있다, 즉 눈치채고 있다는 뜻이죠. 그래서 교사의 표정과 태도가 학생에게 그대로 전달된다는 점을 강조해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be aware of 관용표현(형용사 + 전치사)\u003c/span> : be동사 + aware[형용사] + of + 명사 : \"~을 인식하고 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명사 소유격\u003c/span> : their + teacher's + body language : \"자신의 선생님의 몸짓 언어\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"In general, 일반적으로. most students are often, 대부분의 학생들은 흔히. very aware of, 매우 인식하는. their teacher's body language, 자신의 선생님의 몸짓 언어를. 이 문장 전체를 해석하면, 일반적으로 대부분의 학생들은 흔히 자신의 선생님의 몸짓 언어를 매우 인식한다.","hl":"m"},{"n":26,"text":"In general은 글의 흐름을 넓게 일반화하는 표현이에요. 대부분의 학생들은 선생님의 몸짓 언어를 흔히 눈치채고 있다는 뜻이죠. 그래서 교사의 표정이나 태도가 학생에게 그대로 전달된다는 점을 말하고 있어요.","hl":"mn"},{"n":27,"text":"먼저 are often very aware of에서 aware는 인식하고 있는이라는 형용사예요. 형용사라서 be동사 뒤에 오고, aware of 형태로 굳어져서 을, 를 인식하다로 해석합니다. 두 번째로 their teacher's body language를 보면 students를 받는 소유격 their 뒤에 teacher's라는 소유격이 한 번 더 와서 학생들 각자의 선생님이라는 뜻을 만들어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들어,\u003c/span>\u003cspan class=\"en\">For example,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">학생들이 처음 교실에 들어가면,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">students \u003c/span>\u003cspan class=\"tgt\">first \u003c/span>\u003cspan class=\"tgt\">enter \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">classroom\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 찾는다\u003c/span>\u003cspan class=\"en\">they \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">look \u003c/span>\u003cspan class=\"tgt\">for\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 선생님을\u003c/span>\u003cspan class=\"en\">their teacher.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">예를 들어, 학생들이 처음 교실에 들어가면 그들은 자신의 선생님을 찾는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> \u003cb class=\"key\">For \u003c/b>\u003cb class=\"key\">example\u003c/b>은 앞 문장의 주장을 구체적인 장면으로 보여 주는 \u003cb class=\"key\">예시\u003c/b> 표현이에요. 학생들이 수업 시작 때 교실에 들어와 가장 먼저 하는 행동이 선생님을 \u003cb class=\"key\">찾는\u003c/b> 일이라는 걸 보여 주죠. 그래서 교사의 첫인상과 몸짓 언어가 얼마나 중요한지 자연스럽게 이어 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 when의 시간 부사절\u003c/span> : When + 주어 + 동사, 주어 + 동사 : \"학생들이 처음 교실에 들어갈 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">구동사 look for\u003c/span> : look[동사] + for[전치사] + 목적어 : \"~을 찾다\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"For example, 예를 들어. when students first enter the classroom, 학생들이 처음 교실에 들어가면. they look for, 그들은 찾는다. their teacher, 자신의 선생님을. 이 문장 전체를 해석하면, 예를 들어, 학생들이 처음 교실에 들어가면 그들은 자신의 선생님을 찾는다.","hl":"m"},{"n":29,"text":"For example은 앞 문장의 주장을 구체적인 장면으로 보여 주는 예시 표현이에요. 학생들은 교실에 들어오자마자 선생님을 찾는다는 아주 자연스러운 장면을 그려 주죠. 이 장면 덕분에 교사의 첫인상과 몸짓 언어가 얼마나 중요한지가 더 쉽게 와닿습니다.","hl":"mn"},{"n":30,"text":"먼저 when students first enter the classroom에서 when은 할 때를 이끄는 접속사예요. 뒤에 주어와 동사가 갖춰진 부사절을 만들어서 주절이 언제 일어나는지를 알려 줍니다. 두 번째로 look for는 보다라는 look에 for가 붙어서 찾다라는 뜻이 된 구동사예요. 그래서 their teacher를 목적어로 받아 선생님을 찾는다가 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상상해보라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Imagine\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 선생님이 가지고 있다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">teacher \u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">친근한 인사를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">friendly \u003c/span>\u003cspan class=\"tgt\">greeting \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 환영의 미소를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">welcoming \u003c/span>\u003cspan class=\"tgt\">smile.\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 선생님이 친근한 인사를 하고 환영의 미소를 짓는다고 상상해보라.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 교실에 들어온 학생들이 가장 먼저 마주하게 될 \u003cb class=\"key\">장면\u003c/b>을 상상해 보라고 요청하는 문장이에요. 앞에서 말한 body language라는 추상적인 개념을 \u003cb class=\"key\">친근한 \u003c/b>\u003cb class=\"key\">인사\u003c/b>와 \u003cb class=\"key\">환영의 \u003c/b>\u003cb class=\"key\">미소\u003c/b>라는 눈에 보이는 구체적 행동으로 바꿔 제시해, 교사의 비언어적 신호가 관계에 차이를 만든다는 흐름을 자연스럽게 이어 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문(동사원형으로 시작)\u003c/span> : [동사원형] + 목적어 (주어 You 생략) : \"상상해보라\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 that의 명사절(목적어)\u003c/span> : imagine + [that + 주어 + 동사 + 목적어] : \"그 선생님이 친근한 인사와 환영의 미소를 가지고 있다고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">현재분사형 형용사\u003c/span> : [welcome + -ing] + 명사 : \"환영의 미소\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"Imagine, 상상해보라. that the teacher has, 그 선생님이 가지고 있다고. a friendly greeting, 친근한 인사를. and a welcoming smile, 그리고 환영의 미소를. 이 문장 전체를 해석하면, 그 선생님이 친근한 인사를 하고 환영의 미소를 짓는다고 상상해보라.","hl":"m"},{"n":32,"text":"이 문장은 교실에 들어온 학생들이 마주할 장면을 상상해 보라고 말하고 있어요. 친근한 인사와 환영의 미소라는 구체적인 예시를 통해, 앞에서 나온 body language라는 추상적인 개념을 눈에 보이는 행동으로 바꿔 주는 역할을 합니다.","hl":"mn"},{"n":33,"text":"먼저, 이 문장은 동사원형 Imagine으로 시작하니까 주어 You가 생략된 명령문이에요. 두 번째로, 동사 imagine 뒤에 that절이 통째로 와서 목적어 역할을 하고, 그 안은 주어와 동사와 목적어를 다 갖춘 완전한 문장 구조라는 점을 기억하세요. 마지막으로, welcoming은 동사 welcome에 ing가 붙은 현재분사형 형용사로 smile을 꾸며 주고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 분명 그러할 것이다\u003c/span>\u003cspan class=\"en\">It \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">must \u003c/span>\u003cspan class=\"tgt\">be\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">격려가 되고 힘을 주는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">encouraging \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">empowering\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">학생에게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">student\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 학생에게 분명 격려가 되고 힘을 줄 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 상상한 친근한 인사와 미소가 학생에게 주는 \u003cb class=\"key\">효과\u003c/b>를 정리하는 문장이에요. must를 사용해 '분명 그러할 것이다'라는 \u003cb class=\"key\">강한 \u003c/b>\u003cb class=\"key\">추측\u003c/b>을 나타내면서, 그 효과가 \u003cb class=\"key\">격려\u003c/b>와 \u003cb class=\"key\">힘\u003c/b>을 동시에 준다는 점을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 must + 동사원형(강한 추측)\u003c/span> : must + [동사원형 be] : \"분명 ~일 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">형용사 병렬 구조\u003c/span> : [형용사 A] and [형용사 B] → 주격보어 : \"격려가 되고 힘을 주는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 for(감정·판단의 대상)\u003c/span> : for + [명사] : \"학생에게\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"It must be, 그것은 분명 그러할 것이다. encouraging and empowering, 격려가 되고 힘을 주는. for a student, 학생에게. 이 문장 전체를 해석하면, 그것은 학생에게 분명 격려가 되고 힘을 줄 것이다.","hl":"m"},{"n":35,"text":"앞에서 상상한 친근한 인사와 미소가 학생에게 주는 효과를 말하는 문장이에요. must를 써서 분명 그럴 거라는 강한 추측을 나타내고, 그 효과가 격려와 힘을 동시에 준다는 점을 강조하고 있습니다.","hl":"mn"},{"n":36,"text":"먼저, must 뒤에 동사원형 be가 와서 분명 그럴 것이라는 강한 추측을 나타내는 부분이에요. 두 번째로, encouraging과 empowering이 and로 이어진 병렬 구조이고, 두 형용사가 주격보어 자리를 함께 채우고 있어요. 마지막으로 전치사 for는 감정이나 판단의 대상, 즉 학생에게라는 뜻으로 해석된다는 점을 챙겨 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">선생님은 학생들에게 미소를 짓는다\u003c/span>\u003cspan class=\"en\">The teacher smiles at students\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 알도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">let \u003c/span>\u003cspan class=\"tgt\">them \u003c/span>\u003cspan class=\"tgt\">know\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 또는 그녀가 기쁘다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">she \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">glad \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들을 보게 되어\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">see \u003c/span>\u003cspan class=\"tgt\">them\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">선생님은 학생들에게 그 또는 그녀가 그들을 보게 되어 기쁘다는 것을 알리기 위해 미소를 짓는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 교사가 미소를 짓는 \u003cb class=\"key\">이유\u003c/b>와 그 미소에 담긴 \u003cb class=\"key\">의미\u003c/b>를 설명하는 문장이에요. 목적을 나타내는 to부정사로 이유를 밝히고, that절로 '너희를 만나 기쁘다'는 마음을 전달하면서 앞에 나온 '환영의 미소'를 구체적으로 풀어 줍니다. 결국 교사의 \u003cb class=\"key\">비언어적 \u003c/b>\u003cb class=\"key\">신호\u003c/b>가 학생에게 메시지를 전하는 방식임을 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : [주절] + to + [동사원형] (목적: ~하기 위해) : \"그들이 알도록, 알리기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">사역동사 let + 목적어 + 동사원형\u003c/span> : let + [목적어] + [동사원형(목적격보어)] : \"그들이 알게 하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">접속사 that의 명사절(목적어)\u003c/span> : know + [that + 주어 + 동사 + 보어] : \"그 또는 그녀가 그들을 보게 되어 기쁘다는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">감정의 원인을 나타내는 to부정사\u003c/span> : be glad + [to + 동사원형] : \"그들을 보게 되어 기쁜\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"The teacher smiles at students, 선생님은 학생들에게 미소를 짓는다. to let them know, 그들이 알도록. that he or she is glad, 그 또는 그녀가 기쁘다는 것을. to see them, 그들을 보게 되어. 이 문장 전체를 해석하면, 선생님은 학생들에게 그 또는 그녀가 그들을 보게 되어 기쁘다는 것을 알리기 위해 미소를 짓는다.","hl":"m"},{"n":38,"text":"이 문장은 교사가 미소를 짓는 이유와 그 미소에 담긴 의미를 설명하고 있어요. 목적을 나타내는 to부정사로 이유를 밝히고, that절로 너희를 만나 기쁘다는 마음을 전달하면서 앞에 나온 환영의 미소를 구체적으로 풀어 줍니다. 결국 교사의 비언어적 신호가 학생에게 메시지를 전하는 방식이라는 흐름을 마무리하는 문장입니다.","hl":"mn"},{"n":39,"text":"먼저, to let them know에서 to부정사가 목적을 나타내는 부사적 용법으로 쓰였어요. 두 번째, let은 사역동사라서 목적어 them 뒤에 동사원형 know가 오는 목적격보어 구조를 만듭니다. 세 번째, know 뒤의 that절은 명사절로 know의 목적어 역할을 해요. 마지막으로 glad 뒤의 to부정사는 감정의 원인을 나타내서 보게 되어 기쁘다는 뜻이 된답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은\u003c/span>\u003cspan class=\"en\">It\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">요구하지 않는다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">does \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">require\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 시간을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">great \u003c/span>\u003cspan class=\"tgt\">deal \u003c/span>\u003cspan class=\"tgt\">of\u003c/span> time\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">혹은 노력을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">effort\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 많은 시간이나 노력을 요구하지 않는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> It은 앞 문장에서 말한 '학생을 향해 미소 지으며 반기는 행동'을 가리킵니다. 그런 행동은 많은 시간이나 노력을 \u003cb class=\"key\">요구하지 \u003c/b>\u003cb class=\"key\">않는다\u003c/b>는 뜻으로, 누구나 부담 없이 실천할 수 있음을 보여 줍니다. 그래서 다음 문장의 But과 이어지며 '작은 행동이지만 \u003cb class=\"key\">효과\u003c/b>는 크다'는 흐름을 만들어 주는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">일반동사 부정문(do/does/did + not + 동사원형)\u003c/span> : [주어 It] + does not + [동사원형 require] + [목적어] : \"요구하지 않는다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수량 표현(a great deal of + 불가산명사)\u003c/span> : a great deal of + [불가산명사 time] : \"많은 시간\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">부정문에서의 or\u003c/span> : [부정문] + A or B = A나 B(둘 다 아님) : \"혹은 노력을\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"It, 그것은. does not require, 요구하지 않는다. a great deal of time, 많은 시간을. or effort, 혹은 노력을. 이 문장 전체를 해석하면, 그것은 많은 시간이나 노력을 요구하지 않는다.","hl":"m"},{"n":41,"text":"여기서 It은 앞 문장의 웃으며 반기는 행동, 그러니까 학생에게 미소 짓는 일을 가리켜요. 그런 행동은 많은 시간이나 노력을 요구하지 않는다는 뜻으로, 부담 없이 실천할 수 있다는 점을 강조하죠. 그래서 다음에 나오는 But과 이어지면서 작은 행동이지만 효과는 크다는 흐름의 발판이 됩니다.","hl":"mn"},{"n":42,"text":"첫 번째, does not require를 보세요. 일반동사를 부정할 때는 조동사 do를 빌려서 does not 다음에 동사원형이 온다는 점이 핵심이에요. 주어가 3인칭 단수라서 does를 쓴 겁니다. 두 번째, a great deal of는 뒤에 불가산명사인 time이 오기 때문에 many 대신 쓰인 수량 표현이에요. 세 번째, or effort는 부정문 안에서 쓰여서 노력도 필요 없다는 뜻, 즉 시간과 노력 둘 다 요구되지 않는다는 의미를 만들어 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만\u003c/span>\u003cspan class=\"en\">But\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 가져올 수 있다\u003c/span>\u003cspan class=\"en\">it \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상당한 차이를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">significant \u003c/span>\u003cspan class=\"tgt\">difference\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">교실 분위기에\u003c/span>\u003cspan class=\"en\">in the classroom climate\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수업 시작과 동시에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">right \u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">start \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">class\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 그것은 수업 시작과 동시에 교실 분위기에 상당한 차이를 가져올 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> it은 앞 문장의 미소 짓고 인사하는 행동을 그대로 받습니다. 그 작은 행동이 \u003cb class=\"key\">수업 \u003c/b>\u003cb class=\"key\">시작\u003c/b>과 동시에 교실 분위기에 \u003cb class=\"key\">상당한 \u003c/b>\u003cb class=\"key\">차이\u003c/b>를 만들 수 있다는 것이죠. 앞 문장의 '부담 없음'과 이 문장의 '큰 효과'가 But으로 연결되며 글의 핵심 주장이 완성됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 can + 동사원형\u003c/span> : [조동사 can] + [동사원형 make] : \"가져올 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관용 표현(make a difference)\u003c/span> : make a difference (in + 장소·분위기) : \"상당한 차이를 가져오다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">강조 부사 right + 전치사구\u003c/span> : right + [전치사구 from ~] = 바로 ~부터 : \"수업 시작과 동시에\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"But, 하지만. it can make, 그것은 가져올 수 있다. a significant difference, 상당한 차이를. in the classroom climate, 교실 분위기에. right from the start of class, 수업 시작과 동시에. 이 문장 전체를 해석하면, 하지만 그것은 수업 시작과 동시에 교실 분위기에 상당한 차이를 가져올 수 있다.","hl":"m"},{"n":44,"text":"it은 앞 문장의 미소 짓고 인사하는 행동을 그대로 받아요. 그 작은 행동이 수업 시작과 동시에 교실 분위기에 상당한 차이를 만들 수 있다는 것이죠. 앞 문장의 부담 없음과 이 문장의 큰 효과가 But으로 연결되면서 글의 핵심 주장이 완성됩니다.","hl":"mn"},{"n":45,"text":"첫 번째, can make에서 조동사 can 뒤에는 반드시 동사원형이 와요. makes가 아니라는 점을 꼭 확인하세요. 두 번째, make a significant difference는 차이를 만들다, 영향을 주다라는 관용 표현이에요. 통째로 외워 두면 서술형에서도 바로 쓸 수 있습니다. 세 번째, right from the start of class에서 right는 전치사구 앞에서 의미를 강조하는 부사로, 바로 그때부터라는 느낌을 더해 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">선생님은 기억해야 한다\u003c/span>\u003cspan class=\"en\">Teachers \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">should \u003c/span>\u003cspan class=\"tgt\">remember\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 몸짓 언어가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">body \u003c/span>\u003cspan class=\"tgt\">language \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">항상 작동하고 있다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">always \u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">work\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 학생들과 함께 있을 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">students\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">선생님은 그들이 학생들과 함께 있을 때, 그들의 몸짓 언어가 항상 작동하고 있다는 것을 기억해야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글 전체를 맺는 \u003cb class=\"key\">결론\u003c/b>입니다. 교사의 몸짓 언어는 학생과 함께 있는 동안 잠시 멈출 수 있는 것이 아니라 \u003cb class=\"key\">항상 \u003c/b>\u003cb class=\"key\">작동\u003c/b>하고 있다는 뜻이죠. 그래서 자신의 표정과 몸짓이 늘 메시지를 보내고 있음을 기억하자는 당부로 글을 마무리합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 should(당위) + 동사원형\u003c/span> : [주어 Teachers] + should + [동사원형 remember] : \"기억해야 한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 명사절(목적어)\u003c/span> : remember + that + [주어 + 동사 ~] : \"그들의 몸짓 언어가 항상 작동하고 있다는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">접속사 when의 시간 부사절\u003c/span> : [주절] + when + [주어 + 동사 ~] : \"그들이 학생들과 함께 있을 때\"\u003c/div>\u003c/div>","segs":[{"n":46,"text":"Teachers should remember, 선생님은 기억해야 한다. that their body language, 그들의 몸짓 언어가. is always at work, 항상 작동하고 있다는 것을. when they are with their students, 그들이 학생들과 함께 있을 때. 이 문장 전체를 해석하면, 선생님은 그들이 학생들과 함께 있을 때, 그들의 몸짓 언어가 항상 작동하고 있다는 것을 기억해야 한다.","hl":"m"},{"n":47,"text":"이 문장은 글 전체를 맺는 결론이에요. 교사의 몸짓 언어는 학생과 함께 있는 동안 잠시 멈출 수 있는 것이 아니라 항상 작동하고 있다는 뜻이죠. 그래서 자신의 표정과 몸짓이 늘 메시지를 보내고 있음을 명심하라는 당부로 글을 마무리합니다.","hl":"mn"},{"n":48,"text":"첫 번째, should remember에서 should는 당위의 조동사이고 뒤에는 동사원형이 와요. 두 번째, that their body language is always at work는 remember의 목적어로 쓰인 명사절이에요. 여기서 접속사 that은 해석하지 않는다는 점을 기억하세요. 세 번째, when they are with their students는 when이 이끄는 시간 부사절로 '~할 때'라고 해석합니다. 시제는 주절과 맞춰 현재로 쓴 것도 함께 봐 두세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>일부 전문가들은 우리가 몸을 움직임으로써 의사소통을 하며 이것이 \u003cb class=\"key\">몸짓 \u003c/b>\u003cb class=\"key\">언어\u003c/b>를 사용한다는 것을 의미한다고 말한다.\u003c/li>\u003cli>교사가 학생들에게 보내는 \u003cb class=\"key\">비언어적 \u003c/b>\u003cb class=\"key\">메시지\u003c/b>는 학생들과의 관계에 상당한 차이를 가져올 수 있다.\u003c/li>\u003cli>대부분의 학생들은 교사의 몸짓 언어를 잘 인식하며, 친근한 인사와 환영의 미소는 학생에게 \u003cb class=\"key\">격려\u003c/b>와 힘을 준다.\u003c/li>\u003cli>그러한 몸짓은 많은 시간이나 노력을 요구하지 않지만 \u003cb class=\"key\">교실 \u003c/b>\u003cb class=\"key\">분위기\u003c/b>를 바꿀 수 있으므로, 교사는 자신의 몸짓 언어가 항상 \u003cb class=\"key\">작동\u003c/b>하고 있음을 기억해야 한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Teachers should remember that their body language, such as a welcoming smile, can significantly affect their relationship with students and the classroom climate.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">교사가 학생들에게 보내는 \u003cb class=\"key\">비언어적 \u003c/b>\u003cb class=\"key\">메시지\u003c/b>인 \u003cb class=\"key\">몸짓 \u003c/b>\u003cb class=\"key\">언어\u003c/b>는 학생과의 관계와 \u003cb class=\"key\">교실 \u003c/b>\u003cb class=\"key\">분위기\u003c/b>에 상당한 차이를 만들 수 있으므로, 교사는 그것이 항상 작동하고 있음을 기억해야 한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":49,"text":"정리해 볼게요. 교사의 몸짓 언어는 학생과의 관계와 교실 분위기에 큰 차이를 만들 수 있어요. 환영의 미소처럼 작은 몸짓도 학생에게는 중요한 메시지가 되고, 교사의 몸짓 언어는 항상 작동한다는 점을 잊지 마세요. 오늘 수업도 여기까지예요, 수고했어요.","hl":null}]}]});</script></body></html>
