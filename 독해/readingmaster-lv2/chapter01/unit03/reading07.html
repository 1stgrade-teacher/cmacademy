<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터2 Reading07 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터2 Reading07","audioDir":"reading07_audio","preview":false,"count":52,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.520em\">Reading07\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터2\u003c/div>\u003ch1>Keep Eggs on the Menu and Label Them Instead\u003c/h1>\u003ch2>달걀은 남기고, 대신 라벨을 붙이자\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>요약: Cathy Brown은 담임 선생님의 달걀 음식 제공 중단 제안에 반대하며, 달걀은 \u003cb class=\"key\">영양소\u003c/b>가 풍부하고 아이들의 \u003cb class=\"key\">성장\u003c/b>에 꼭 필요하므로 메뉴에서 빼기보다 \u003cb class=\"key\">라벨\u003c/b> 표시로 알레르기 문제를 해결하자고 제안한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The mother opposes removing egg-based foods from the school menu and suggests labeling them instead.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 글은 Alcanse 중학교 교장 선생님께 보내는 Cathy Brown의 이메일이에요. 담임 선생님이 달걀 음식을 없애자고 제안한 상황에서 학부모가 어떤 주장을 펼치는지 살펴볼 거예요. 핵심은 달걀을 메뉴에서 빼는 대신 라벨을 붙이자는 것이랍니다. 그럼 함께 시작해 볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">달걀은 단백질(protein)을 비롯한 필수 영양소가 풍부한 대표 식품이에요. 그런데 일부 사람들은 달걀 단백질에 면역 체계가 과민 반응하는 \u003cb class=\"key\">알레르기\u003c/b>(allergy)를 가지고 있어요. 그래서 학교 급식에서는 알레르기 유발 식품을 표시하도록 하는 관리 기준이 널리 쓰이고 있죠. 이는 특정 음식을 아예 없애는 \u003cb class=\"key\">전면 \u003c/b>\u003cb class=\"key\">금지\u003c/b>와는 다른 접근이에요. 마치 운동장에서 뛰지 못하게 하는 대신 위험 지역만 표시해 주는 것과 비슷하죠. 소수에게 위험한 음식이라도 다수에게 필요한 영양 공급을 생각하면 \u003cb class=\"key\">균형\u003c/b> 잡힌 해결이 필요하답니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 짚어 볼게요. 달걀은 protein, 그러니까 단백질을 비롯한 필수 영양소가 풍부한 대표 식품이에요. 그런데 일부 사람들은 달걀 단백질에 면역 체계가 과민 반응하는 allergy, 즉 알레르기를 가지고 있죠. 그래서 학교 급식에서는 알레르기 유발 식품을 표시하도록 하는 관리 기준이 널리 쓰이고 있어요. 이건 특정 음식을 아예 없애는 전면 금지와는 다른 접근이에요. 운동장에서 뛰지 못하게 하는 대신 위험 지역만 표시해 주는 것과 비슷하다고 생각하면 이해가 쉬울 거예요. 소수에게 위험한 음식이라도 다수에게 필요한 영양 공급을 생각하면 균형 잡힌 해결이 필요하답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>이메일의 도입\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>발신인 Cathy Brown이 Alcanse 중학교 \u003cb class=\"key\">교장\u003c/b>에게 보내는 이메일이에요. 자신의 딸 Amy가 그 학교 \u003cb class=\"key\">학생\u003c/b>임을 밝히고, 담임 선생님에게서 받은 메시지에 대한 \u003cb class=\"key\">답변\u003c/b>으로 글을 쓴다고 말해요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>제안 소개와 반대\u003csmall>통념 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>담임 선생님은 학교가 \u003cb class=\"key\">달걀\u003c/b>로 만든 음식을 제공하는 것을 중단하자고 \u003cb class=\"key\">제안\u003c/b>해요. 그러자 영양소를 많이 필요로 하는 소녀의 어머니로서 Cathy는 그 제안에 강력히 \u003cb class=\"key\">반대\u003c/b>한다고 밝혀요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>양보 뒤의 반박\u003csmall>반박 · 문장 6–8\u003c/small>\u003c/h4>\u003cp>그녀는 일부 학생들이 달걀에 \u003cb class=\"key\">알레르기\u003c/b>가 있다는 점을 인정해요. 그러나 그 제안은 다른 학생들에게 \u003cb class=\"key\">불공평\u003c/b>하다고 반박하며, 우리 아이들에게는 \u003cb class=\"key\">균형 \u003c/b>\u003cb class=\"key\">잡힌\u003c/b> 식사가 필요하다고 강조해요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>반대의 근거\u003csmall>근거 · 문장 9–10\u003c/small>\u003c/h4>\u003cp>달걀에는 단백질 같은 많은 \u003cb class=\"key\">영양소\u003c/b>가 있고 매우 많은 종류의 음식에 널리 쓰인다고 설명해요. 달걀을 메뉴에서 \u003cb class=\"key\">제외\u003c/b>하면 아이들의 음식 선택이 제한되고 \u003cb class=\"key\">성장\u003c/b>이 방해받는다는 것이죠.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>대안과 마무리\u003csmall>결론 · 문장 11–13\u003c/small>\u003c/h4>\u003cp>대신 학교가 달걀을 포함할지도 모르는 음식에 명확히 \u003cb class=\"key\">라벨\u003c/b>을 붙이자고 제안해요. 학생들이 계속해서 다양한 음식을 \u003cb class=\"key\">선택\u003c/b>하는 것이 중요하다는 말로 글을 맺어요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 따라가 볼게요.","hl":null},{"n":4,"text":"먼저 Cathy Brown이 Alcanse 중학교 교장에게 이메일을 보내요. 자신의 딸 Amy가 그 학교 학생이라고 소개하고, 담임 선생님에게서 받은 메시지에 대한 답변으로 글을 쓴다고 밝히죠.","hl":"f0"},{"n":5,"text":"담임 선생님은 학교가 달걀로 만든 음식 제공을 중단하자고 제안해요. 그러자 영양소를 많이 필요로 하는 소녀의 어머니로서 Cathy는 그 제안에 강력히 반대한다고 말합니다.","hl":"f1"},{"n":6,"text":"그녀는 일부 학생들이 달걀에 알레르기가 있다는 점을 인정해요. 하지만 그 제안은 다른 학생들에게 불공평하다고 반박하고, 우리 아이들에게는 균형 잡힌 식사가 필요하다고 강조하죠.","hl":"f2"},{"n":7,"text":"달걀에는 단백질 같은 많은 영양소가 있고 매우 많은 종류의 음식에 널리 쓰인다고 설명해요. 달걀을 메뉴에서 제외하면 아이들의 음식 선택이 제한되고 성장이 방해받는다는 거예요.","hl":"f3"},{"n":8,"text":"그래서 대신 학교가 달걀을 포함할지도 모르는 음식에 명확히 라벨을 붙이자고 제안해요. 학생들이 계속해서 다양한 음식을 선택하는 것이 중요하다는 말로 글을 맺습니다.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 5번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 담임의 제안을 소개한 뒤 곧바로 반대 \u003cb class=\"key\">주장\u003c/b>을 내세우고, 그 이유를 차례로 제시해요. 여섯 번째부터 여덟 번째 문장에서 알레르기를 인정하는 \u003cb class=\"key\">양보\u003c/b>를 한 다음 불공평하다고 반박하고, 아홉 번째부터 열 번째 문장에서 영양소와 성장이라는 \u003cb class=\"key\">근거\u003c/b>를 제시하죠. 마지막에 라벨 표시라는 \u003cb class=\"key\">대안\u003c/b>을 내놓아 주장을 뒷받침하므로 주장-근거 전개이고, 주장이 글 앞부분에 나오므로 \u003cb class=\"key\">두괄식\u003c/b>이에요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>in response to (3)\u003c/b>\u003cspan>글의 목적·계기 제시\u003c/span>\u003cb>However (7)\u003c/b>\u003cspan>양보 뒤 대조·반박\u003c/span>\u003cb>such as (9)\u003c/b>\u003cspan>예시 제시\u003c/span>\u003cb>Instead (11)\u003c/b>\u003cspan>대안으로의 전환\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">He is suggesting that the school stop serving food made with eggs\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the suggestion\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">his suggestion\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Removing them from the menu\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>달걀 유지 + 라벨 표시\u003c/th>\u003cth>달걀 음식 전면 제외\u003c/th>\u003c/tr>\u003ctr>\u003ctd>영양소 공급과 균형 잡힌 식사 보장\u003c/td>\u003ctd>알레르기 위험은 줄지만 영양 공급이 줄어듦\u003c/td>\u003c/tr>\u003ctr>\u003ctd>다양한 음식 선택권 유지\u003c/td>\u003ctd>음식 선택 제한과 성장 방해\u003c/td>\u003c/tr>\u003ctr>\u003ctd>소수 알레르기 학생은 라벨로 보호\u003c/td>\u003ctd>다수 학생에게 불공평한 결과\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글의 전개 방식은 주장과 근거예요. 담임의 제안을 소개한 뒤 곧바로 반대 주장을 내세우고, 그 이유를 차례로 제시하죠. 주장이 글 앞부분에 나오기 때문에 두괄식 구조로 볼 수 있어요. 마지막에는 라벨 표시라는 대안까지 내놓아 주장을 단단하게 마무리합니다.","hl":"ty"},{"n":10,"text":"신호어를 눈여겨보세요. 일곱 번째 문장의 However는 앞의 인정을 뒤집는 반박 신호예요. 열한 번째 문장의 Instead는 없애는 대신 다른 방법을 쓰자는 대안 전환 신호죠. 또 in response to는 글을 쓰게 된 계기를, such as는 예시를 보여 줍니다. 이렇게 재진술과 대조를 표시하면서 읽으면 필자의 주장이 또렷하게 보여요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>principal\u003c/b>\u003cem>명사\u003c/em>\u003cspan>교장\u003c/span>\u003c/div>\u003cdiv>\u003cb>in response to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 대한 답변으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>homeroom teacher\u003c/b>\u003cem>명사\u003c/em>\u003cspan>담임 선생님\u003c/span>\u003c/div>\u003cdiv>\u003cb>suggest\u003c/b>\u003cem>동사\u003c/em>\u003cspan>제안하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>stop -ing\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~하는 것을 중단하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>be made with\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 만들어지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>nutrient\u003c/b>\u003cem>명사\u003c/em>\u003cspan>영양소\u003c/span>\u003c/div>\u003cdiv>\u003cb>strongly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>강력히\u003c/span>\u003c/div>\u003cdiv>\u003cb>oppose\u003c/b>\u003cem>동사\u003c/em>\u003cspan>반대하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>suggestion\u003c/b>\u003cem>명사\u003c/em>\u003cspan>제안\u003c/span>\u003c/div>\u003cdiv>\u003cb>be allergic to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 알레르기가 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>unfair\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>불공평한\u003c/span>\u003c/div>\u003cdiv>\u003cb>well-balanced\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>균형 잡힌\u003c/span>\u003c/div>\u003cdiv>\u003cb>diet\u003c/b>\u003cem>명사\u003c/em>\u003cspan>식사, 식단\u003c/span>\u003c/div>\u003cdiv>\u003cb>such as\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~와 같은\u003c/span>\u003c/div>\u003cdiv>\u003cb>protein\u003c/b>\u003cem>명사\u003c/em>\u003cspan>단백질\u003c/span>\u003c/div>\u003cdiv>\u003cb>widely\u003c/b>\u003cem>부사\u003c/em>\u003cspan>널리\u003c/span>\u003c/div>\u003cdiv>\u003cb>remove\u003c/b>\u003cem>동사\u003c/em>\u003cspan>제외하다, 제거하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>menu\u003c/b>\u003cem>명사\u003c/em>\u003cspan>메뉴\u003c/span>\u003c/div>\u003cdiv>\u003cb>limit\u003c/b>\u003cem>동사\u003c/em>\u003cspan>제한하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>food choices\u003c/b>\u003cem>명사\u003c/em>\u003cspan>음식 선택\u003c/span>\u003c/div>\u003cdiv>\u003cb>hinder\u003c/b>\u003cem>동사\u003c/em>\u003cspan>방해하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>growth\u003c/b>\u003cem>명사\u003c/em>\u003cspan>성장\u003c/span>\u003c/div>\u003cdiv>\u003cb>instead\u003c/b>\u003cem>부사\u003c/em>\u003cspan>대신에\u003c/span>\u003c/div>\u003cdiv>\u003cb>clearly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>명확하게\u003c/span>\u003c/div>\u003cdiv>\u003cb>label\u003c/b>\u003cem>동사\u003c/em>\u003cspan>라벨을 붙이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>contain\u003c/b>\u003cem>동사\u003c/em>\u003cspan>포함하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>continue to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>계속 ~하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>wide\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>폭넓은, 다양한\u003c/span>\u003c/div>\u003cdiv>\u003cb>sincerely\u003c/b>\u003cem>부사\u003c/em>\u003cspan>진심으로\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"핵심 단어도 짚어 볼게요. oppose는 반대하다, hinder는 방해하다라는 뜻이고요. remove는 제외하다, contain은 포함하다로 정리해 두세요. well-balanced는 균형 잡힌이라는 뜻으로, well-balanced diet가 균형 잡힌 식사라는 표현이 된답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">oppose\u003c/b>\u003cspan class=\"m\">반대하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">object to\u003c/span>\u003cspan class=\"s\">resist\u003c/span>\u003cspan class=\"s\">be against\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">support\u003c/span>\u003cspan class=\"a\">approve\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">suggest\u003c/b>\u003cspan class=\"m\">제안하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">propose\u003c/span>\u003cspan class=\"s\">recommend\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">unfair\u003c/b>\u003cspan class=\"m\">불공평한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">unjust\u003c/span>\u003cspan class=\"s\">biased\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">fair\u003c/span>\u003cspan class=\"a\">just\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">hinder\u003c/b>\u003cspan class=\"m\">방해하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">block\u003c/span>\u003cspan class=\"s\">obstruct\u003c/span>\u003cspan class=\"s\">impede\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">help\u003c/span>\u003cspan class=\"a\">promote\u003c/span>\u003cspan class=\"a\">encourage\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">remove\u003c/b>\u003cspan class=\"m\">제외하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">eliminate\u003c/span>\u003cspan class=\"s\">exclude\u003c/span>\u003cspan class=\"s\">take away\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">include\u003c/span>\u003cspan class=\"a\">add\u003c/span>\u003cspan class=\"a\">keep\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">limit\u003c/b>\u003cspan class=\"m\">제한하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">restrict\u003c/span>\u003cspan class=\"s\">confine\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">expand\u003c/span>\u003cspan class=\"a\">free\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">contain\u003c/b>\u003cspan class=\"m\">포함하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">include\u003c/span>\u003cspan class=\"s\">hold\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">exclude\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어도 함께 익혀 두면 좋아요. oppose의 동의어는 object to나 resist이고, 반의어는 support예요. unfair는 unjust가 동의어이고 fair가 반의어죠. hinder는 block이나 impede와 가깝고, 반대말은 help나 promote예요. remove는 eliminate나 exclude와 같고, 반의어는 include나 keep입니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Alcanse 중학교 교장 선생님께,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">To \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">Principal \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">Alcanse \u003c/span>\u003cspan class=\"tgt\">Middle \u003c/span>\u003cspan class=\"tgt\">School\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제 이름은\u003c/span>\u003cspan class=\"en\">My name\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Cathy Brown입니다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">Cathy \u003c/span>\u003cspan class=\"tgt\">Brown\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Alcanse 중학교 교장 선생님께, 제 이름은 Cathy Brown입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 이메일의 \u003cb class=\"key\">수신인\u003c/b>을 밝히는 첫머리예요. 보내는 사람이 \u003cb class=\"key\">Alcanse \u003c/b>\u003cb class=\"key\">Middle \u003c/b>\u003cb class=\"key\">School\u003c/b>의 \u003cb class=\"key\">교장\u003c/b>에게 이메일을 보내는 것임을 분명히 하고, 이어서 자신을 소개하죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 to의 수신 대상 표시\u003c/span> : To + [수신인] : [수신인]에게 : \"Alcanse 중학교 교장 선생님께\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">2형식 문장의 주격 보어\u003c/span> : [주어] + is + [명사 보어] : \"Cathy Brown입니다\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"To the Principal of Alcanse Middle School, Alcanse 중학교 교장 선생님께. My name, 제 이름은. is Cathy Brown, Cathy Brown입니다.. 이 문장 전체를 해석하면, Alcanse 중학교 교장 선생님께, 제 이름은 Cathy Brown입니다.","hl":"m"},{"n":14,"text":"이 문장은 이메일의 수신인을 밝히는 첫머리예요. 편지를 쓰는 사람이 Alcanse Middle School의 교장에게 보내는 것임을 분명히 하고, 이어서 자신을 소개하죠.","hl":"mn"},{"n":15,"text":"첫 번째로 To the Principal of Alcanse Middle School에서 to는 받는 사람을 향하는 방향을 나타내요. 그래서 교장 선생님께처럼 수신인을 표시하는 역할을 해요. 두 번째로 is Cathy Brown에서 is 뒤의 Cathy Brown이 주어 My name의 신분을 설명하는 주격 보어예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제 딸 Amy는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">My \u003c/span>\u003cspan class=\"tgt\">daughter, \u003c/span>\u003cspan class=\"tgt\">Amy,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">학생입니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">student\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신의 학교에 다니는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\" u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 이메일을\u003c/span>\u003cspan class=\"en\">this email\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~에 대한 답변으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">response \u003c/span>\u003cspan class=\"tgt\">to\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 메시지에\u003c/span>\u003cspan class=\"en\">the message\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제가 받은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">received\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀의 담임 선생님으로부터\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">her \u003c/span>\u003cspan class=\"tgt\">homeroom \u003c/span>\u003cspan class=\"tgt\">teacher\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">저는 그녀의 담임 선생님으로부터 받은 메시지에 대한 답변으로 이 이메일을 쓰고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 이메일을 쓰는 \u003cb class=\"key\">목적\u003c/b>을 밝혀요. Amy의 \u003cb class=\"key\">담임 \u003c/b>\u003cb class=\"key\">선생님\u003c/b>이 보낸 메시지에 \u003cb class=\"key\">답변\u003c/b>하기 위해 이메일을 쓰고 있다는 뜻이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재진행형\u003c/span> : [주어] + am/is/are + [동사-ing] : \"저는 쓰고 있습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관용 전치사구\u003c/span> : in response to + [명사] : [명사]에 대한 응답으로 : \"~에 대한 답변으로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 생략\u003c/span> : [선행사] + (that/which) + [주어] + [타동사] : \"내가 받은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">전치사 from의 출처 표시\u003c/span> : from + [사람/장소] : ...로부터 : \"그녀의 담임 선생님으로부터\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"I'm writing, 저는 쓰고 있습니다. this email, 이 이메일을. in response to, ~에 대한 답변으로. the message, 그 메시지에. I received, 제가 받은. from her homeroom teacher, 그녀의 담임 선생님으로부터. 이 문장 전체를 해석하면, 저는 그녀의 담임 선생님으로부터 받은 메시지에 대한 답변으로 이 이메일을 쓰고 있습니다.","hl":"m"},{"n":20,"text":"이 문장은 이메일을 쓰는 목적을 밝혀요. Amy의 담임 선생님이 보낸 메시지에 답변하기 위해 이메일을 쓰고 있다는 뜻이죠.","hl":"mn"},{"n":21,"text":"첫 번째로 I'm writing은 현재진행형이에요. am과 writing이 결합해 지금 쓰고 있다는 진행 의미를 만들어요. 두 번째로 in response to는 ~에 대한 답변으로라는 관용 전치사구예요. 세 번째로 I received는 앞의 the message를 꾸미는 관계사절이고 목적격 관계대명사가 생략된 형태예요. 네 번째로 from은 메시지의 출처를 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 제안하고 있습니다\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">suggesting\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">학교가 제공하는 것을 중단할 것을\u003c/span>\u003cspan class=\"en\">that \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">school \u003c/span>\u003cspan class=\"tgt\">stop \u003c/span>\u003cspan class=\"tgt\">serving\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">달걀로 만든 음식을\u003c/span>\u003cspan class=\"en\">food \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">made \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">eggs\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 학교가 달걀로 만든 음식을 제공하는 것을 중단할 것을 제안하고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 학부모가 담임교사에게 받은 메시지의 내용을 정리해 전달하는 부분이에요. 교사가 \u003cb class=\"key\">달걀\u003c/b>이 들어간 음식 제공을 그만두자고 \u003cb class=\"key\">제안\u003c/b>했다는 사실을 소개하죠. 바로 뒤에 이어질 학부모의 \u003cb class=\"key\">반대\u003c/b> 주장이 무엇을 향한 것인지 알려 주는 도입 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재진행형\u003c/span> : be동사 + [동사원형 + -ing] : \"제안하고 있습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">가정법 현재(제안·요구 뒤 that절의 동사원형)\u003c/span> : suggest + that + [주어] + [(should) + 동사원형] : \"학교가 제공하는 것을 중단할 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">과거분사의 형용사적 용법(수동)\u003c/span> : [명사 food] + made + with + [재료] : \"달걀로 만들어진\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"He is suggesting, 그는 제안하고 있습니다. that the school stop serving, 학교가 제공하는 것을 중단할 것을. food made with eggs, 달걀로 만든 음식을. 이 문장 전체를 해석하면, 그는 학교가 달걀로 만든 음식을 제공하는 것을 중단할 것을 제안하고 있습니다.","hl":"m"},{"n":23,"text":"이 문장은 담임교사가 보낸 메시지의 내용을 학부모가 정리해서 전하는 부분이에요. 교사가 달걀이 들어간 음식을 학교에서 제공하지 말자고 제안했다는 사실을 먼저 알려 주죠. 이 제안 내용이 뒤에서 학부모가 반대할 대상이 된다는 점을 기억하세요.","hl":"mn"},{"n":24,"text":"첫 번째로 is suggesting은 be동사에 동사원형 ing가 붙은 현재진행형이에요. 두 번째로 the school stop serving에서 제안을 뜻하는 동사 suggest 뒤 that절에는 should가 생략되어 동사원형 stop이 온다는 점이 핵심이에요. 세 번째로 made with eggs에서 과거분사 made는 앞의 food를 뒤에서 꾸며 주고, with는 재료를 나타내요. 그래서 달걀로 만들어진 음식이라는 뜻이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">소녀의 어머니로서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">As \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">mother \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">girl\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 영양소를 필요로 하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">needs \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">lot \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">nutrients\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 강력히 반대합니다\u003c/span>\u003cspan class=\"en\">I strongly \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">oppose \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 제안에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">suggestion\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">많은 영양소를 필요로 하는 소녀의 어머니로서, 저는 그 제안에 강력히 반대합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글쓴이의 \u003cb class=\"key\">주장\u003c/b>이 처음으로 분명하게 드러나는 글의 중심 문장이에요. 영양이 필요한 아이의 \u003cb class=\"key\">어머니\u003c/b>라는 자신의 위치를 근거로 내세워 교사의 제안에 반대하는 \u003cb class=\"key\">입장\u003c/b>을 밝히죠. 이후 문단 전체가 이 반대 주장을 뒷받침하는 구조로 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 as(~로서)\u003c/span> : As + [신분·자격을 나타내는 명사구] : \"소녀의 어머니로서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 who\u003c/span> : [선행사 a girl] + who + [동사 needs] : \"많은 영양소를 필요로 하는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">타동사 oppose + 목적어\u003c/span> : oppose + [목적어] (전치사 없음) : \"그 제안에 반대하다\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"As the mother of a girl, 소녀의 어머니로서. who needs a lot of nutrients, 많은 영양소를 필요로 하는. I strongly oppose, 저는 강력히 반대합니다. the suggestion, 그 제안에. 이 문장 전체를 해석하면, 많은 영양소를 필요로 하는 소녀의 어머니로서, 저는 그 제안에 강력히 반대합니다.","hl":"m"},{"n":26,"text":"이 문장은 글쓴이의 주장이 처음으로 분명하게 드러나는 중심 문장이에요. 영양이 필요한 아이의 어머니라는 자신의 위치를 근거로 내세우면서 교사의 제안에 반대한다는 입장을 밝히죠. 앞으로 이어질 모든 근거가 이 주장을 뒷받침하는 구조라는 점을 기억하세요.","hl":"mn"},{"n":27,"text":"먼저 As the mother of a girl에서 as는 '~로서'라는 자격을 나타내는 전치사예요. 두 번째로 who needs a lot of nutrients는 a girl을 꾸며 주는 주격 관계대명사 절이고, 그래서 뒤에 동사 needs가 왔어요. 세 번째로 oppose는 타동사라서 전치사 없이 the suggestion이 바로 목적어로 온다는 점을 꼭 기억하세요. 문장 앞부분에서 자신의 입장을 먼저 밝혀 주니 주장이 훨씬 부드럽게 들립니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 이해합니다\u003c/span>\u003cspan class=\"en\">I understand\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몇몇 학생들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">some \u003c/span>\u003cspan class=\"tgt\">students \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">달걀에 알레르기가 있다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">allergic \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">eggs\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">저는 몇몇 학생들이 달걀에 알레르기가 있다는 것을 이해합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 상대의 문제 제기를 먼저 인정해 주는 \u003cb class=\"key\">양보\u003c/b>의 표현이에요. 달걀 알레르기가 있다는 사실을 부정하지 않음으로써 글쓴이는 자신의 \u003cb class=\"key\">설득력\u003c/b>을 높이죠. 하지만 다음 문장에서 however가 나오며 곧바로 \u003cb class=\"key\">반대\u003c/b> 주장으로 방향이 바뀔 준비를 하는 부분입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 명사절(목적어)\u003c/span> : understand + [that + 주어 + 동사 ~] : \"몇몇 학생들이 달걀에 알레르기가 있다는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be allergic to(~에 알레르기가 있다)\u003c/span> : be allergic to + [명사] : \"달걀에 알레르기가 있다\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"I understand, 저는 이해합니다. that some students, 몇몇 학생들이. are allergic to eggs, 달걀에 알레르기가 있다는 것을. 이 문장 전체를 해석하면, 저는 몇몇 학생들이 달걀에 알레르기가 있다는 것을 이해합니다.","hl":"m"},{"n":29,"text":"이 문장은 상대의 문제 제기를 먼저 인정해 주는 양보의 표현이에요. 달걀 알레르기가 있다는 사실을 부정하지 않으면서 자신의 설득력을 높이죠. 바로 다음에 however가 나와 반대 주장으로 넘어갈 준비를 하는 부분이라는 흐름을 기억하세요.","hl":"mn"},{"n":30,"text":"첫 번째로 that some students are allergic to eggs에서 접속사 that은 understand의 목적어 자리를 채우는 명사절을 이끌어요. 두 번째로 are allergic to eggs에서 allergic 뒤에는 전치사 to가 와서 '~에 알레르기가 있다'라는 표현을 만든다는 점이 중요해요. 그래서 달걀을 뜻하는 eggs 앞에 반드시 to가 있어야 자연스럽습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나,\u003c/span>\u003cspan class=\"en\">However,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 제안은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">suggestion\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">불공평합니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">unfair \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 학생들에게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">other \u003c/span>\u003cspan class=\"tgt\">students\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만, 그의 제안은 다른 학생들에게 불공평합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 달걀 알레르기 학생을 인정했지만, 이 제안이 다수 학생에게 피해를 준다는 \u003cb class=\"key\">반론\u003c/b>을 펴는 문장이에요. However가 앞 내용과의 \u003cb class=\"key\">대조\u003c/b>를 표시하고, unfair to가 '누구에게 불공평한지' 그 \u003cb class=\"key\">대상\u003c/b>을 밝혀 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">소유격 + 명사 (주어 명사구)\u003c/span> : [his (소유격)] + [suggestion (명사)] + [동사 is] : \"그의 제안은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be동사 + 형용사 + 전치사 to (판단의 대상)\u003c/span> : [주어] + be + [unfair (형용사)] + to + [대상] : \"다른 학생들에게 불공평하다\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"However, 그러나. his suggestion, 그의 제안은. is unfair, 불공평합니다. to the other students, 다른 학생들에게. 이 문장 전체를 해석하면, 하지만, 그의 제안은 다른 학생들에게 불공평합니다.","hl":"m"},{"n":32,"text":"여기서 However는 앞에서 알레르기 학생을 이해한다고 했던 흐름과 정반대 방향으로 돌아선다는 신호예요. 즉 이 제안이 나머지 학생들에게는 손해라는 반론을 펴는 거죠. unfair to는 누구에게 불공평한지 그 대상을 to로 붙인다는 것도 꼭 기억해 두세요.","hl":"mn"},{"n":33,"text":"어법은 두 개만 짚을게요. 첫 번째, his suggestion은 소유격 his가 명사 suggestion을 꾸미는 주어 명사구예요. 두 번째, is unfair to the other students에서 unfair는 형용사이고, 판단의 대상은 전치사 to로 연결해요. 전치사 to를 빠뜨리면 무엇에 불공평한지가 사라지니까 꼭 챙기세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 아이들은\u003c/span>\u003cspan class=\"en\">Our children\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">필요합니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">need \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">균형 잡힌 식사가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">well-balanced \u003c/span>\u003cspan class=\"tgt\">diet\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리 아이들은 균형 잡힌 식사가 필요합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 7번에서 '불공평하다'고 주장했으니, 이제 그 \u003cb class=\"key\">근거\u003c/b>를 대는 문장이에요. 아이들에게 필요한 것은 특정 재료를 뺀 식단이 아니라 \u003cb class=\"key\">균형 \u003c/b>\u003cb class=\"key\">잡힌 \u003c/b>\u003cb class=\"key\">식사\u003c/b>라는 점을 강조하죠. well-balanced가 '영양이 골고루 갖춰진'이라는 뜻이라, 9번의 영양소 설명으로 \u003cb class=\"key\">자연스럽게 \u003c/b>\u003cb class=\"key\">연결\u003c/b>됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">타동사 need + 목적어\u003c/span> : need [타동사] + [a well-balanced diet (목적어)] : \"균형 잡힌 식사가 필요하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">합성 형용사 (부사 + 과거분사)\u003c/span> : [well (부사)] + [balanced (과거분사)] + [명사] : \"균형 잡힌 식사\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"Our children, 우리 아이들은. need, 필요합니다. a well-balanced diet, 균형 잡힌 식사가. 이 문장 전체를 해석하면, 우리 아이들은 균형 잡힌 식사가 필요합니다.","hl":"m"},{"n":35,"text":"앞에서 불공평하다고 했으니 이제 왜 그런지 근거를 대야겠죠. 그 근거가 바로 균형 잡힌 식사예요. 특정 재료를 통째로 빼는 일은 균형이라는 원칙 자체를 흔든다는 뜻이에요.","hl":"mn"},{"n":36,"text":"어법 두 개 볼게요. 첫 번째, need는 여기서 타동사로 목적어 a well-balanced diet를 바로 받아요. 두 번째, well-balanced는 부사 well과 과거분사 balanced가 합쳐진 합성 형용사예요. 잘 균형이 잡힌이라는 뜻으로 명사 diet 앞에서 꾸며 주는 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">달걀은 많은 영양소를 가지고 있고\u003c/span>\u003cspan class=\"en\">Eggs have lots of nutrients\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단백질과 같은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">such \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">protein\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 널리 사용됩니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">widely \u003c/span>\u003cspan class=\"tgt\">used \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매우 많은 종류의 음식에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">so \u003c/span>\u003cspan class=\"tgt\">many \u003c/span>\u003cspan class=\"tgt\">types \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">food\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">달걀은 단백질과 같은 많은 영양소를 가지고 있고 매우 많은 종류의 음식에 널리 사용됩니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 달걀을 빼면 안 되는 \u003cb class=\"key\">이유\u003c/b>를 영양과 활용도, 두 가지로 제시하는 문장이에요. such as protein이 영양소의 \u003cb class=\"key\">예시\u003c/b>를 들고, are widely used가 달걀이 이미 수많은 음식에 \u003cb class=\"key\">널리 \u003c/b>\u003cb class=\"key\">쓰인다\u003c/b>는 점을 보여 주죠. 그래서 10번의 '선택 제한과 성장 저해'라는 \u003cb class=\"key\">결론\u003c/b>으로 자연스럽게 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">such as (예시 제시)\u003c/span> : [명사 nutrients] + such as + [예 protein] : \"단백질과 같은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동사구의 병렬 (have ~ and are ~)\u003c/span> : [have lots of nutrients] + and + [are widely used] : \"그리고 널리 사용된다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">수동태 (be + 과거분사)\u003c/span> : [be동사 are] + [부사 widely] + [과거분사 used] + [전치사구] : \"매우 많은 종류의 음식에 널리 사용된다\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"Eggs have lots of nutrients, 달걀은 많은 영양소를 가지고 있고. such as protein, 단백질과 같은. and are widely used, 그리고 널리 사용됩니다. in so many types of food, 매우 많은 종류의 음식에. 이 문장 전체를 해석하면, 달걀은 단백질과 같은 많은 영양소를 가지고 있고 매우 많은 종류의 음식에 널리 사용됩니다.","hl":"m"},{"n":38,"text":"달걀을 빼면 안 되는 이유를 영양과 활용도, 두 가지로 보여 주는 문장이에요. 단백질 같은 영양소가 풍부하고, 이미 수많은 음식에 들어가 있다는 거죠. 그래서 메뉴에서 빼는 순간 선택의 폭이 줄고 성장이 막힌다는 다음 문장으로 이어집니다.","hl":"mn"},{"n":39,"text":"어법은 순서대로 짚을게요. 첫 번째, such as protein에서 such as는 앞의 nutrients를 구체적인 예로 풀어 주는 표현이에요. 두 번째, and are widely used는 앞의 have lots of nutrients와 동사구를 나란히 잇는 병렬 구조예요. 주어 Eggs를 두 번 쓰지 않고 and로 묶었죠. 세 번째, are widely used in so many types of food는 be동사와 과거분사로 만든 수동태예요. 달걀은 사용되는 입장이라 수동으로 쓰고, 부사 widely가 be동사와 과거분사 사이에 들어간다는 점까지 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들을 메뉴에서 제외하는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Removing \u003c/span>\u003cspan class=\"tgt\">them \u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">menu\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 아이들의 음식 선택을 제한할 것입니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">limit\u003c/span> our children's food choices\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그들의 성장을 방해할 것입니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">hinder\u003c/span> their growth.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">달걀을 메뉴에서 제외하는 것은 우리 아이들의 음식 선택을 제한하고 그들의 성장을 방해할 것입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 달걀을 빼면 아이들이 고를 수 있는 음식이 줄어든다는 점을 강조하는 문장이에요. 앞 문장의 달걀 제외 주장에 반대하는 근거로, \u003cb class=\"key\">선택의 \u003c/b>\u003cb class=\"key\">제한\u003c/b>과 \u003cb class=\"key\">성장 \u003c/b>\u003cb class=\"key\">방해\u003c/b>라는 두 가지 부정적 결과를 나란히 제시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사구 주어\u003c/span> : [Removing(동명사) + 목적어 them + 장소 from the menu] + 단수 동사 : \"그것들을 메뉴에서 제외하는 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 would + 동사원형\u003c/span> : [would + 동사원형 limit] : \"제한할 것입니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">병렬 구조(동사원형 병렬)\u003c/span> : [would limit ~ and (would) hinder ~] : \"그리고 방해할 것입니다\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"Removing them from the menu, 그것들을 메뉴에서 제외하는 것은. would limit our children's food choices, 우리 아이들의 음식 선택을 제한할 것입니다. and hinder their growth, 그리고 그들의 성장을 방해할 것입니다. 이 문장 전체를 해석하면, 달걀을 메뉴에서 제외하는 것은 우리 아이들의 음식 선택을 제한하고 그들의 성장을 방해할 것입니다.","hl":"m"},{"n":41,"text":"이 문장은 달걀을 메뉴에서 빼면 어떤 일이 생기는지 두 가지로 보여 줘요. 하나는 선택의 제한이고, 또 하나는 성장 방해예요. 그래서 앞에서 나온 달걀 제외 주장에 정면으로 반대하는 근거가 되는 거죠.","hl":"mn"},{"n":42,"text":"먼저 Removing them from the menu에서 Removing은 동명사로 문장의 주어 역할을 해요. 동명사구가 주어가 되면 단수로 취급한다는 점, 꼭 기억해 두세요. 두 번째로 would limit의 would는 가정적인 결과를 부드럽게 말하는 조동사라서 뒤에 동사원형 limit이 온다는 것도 확인해 주세요. 세 번째로 and 뒤의 hinder는 앞의 would limit과 병렬로 이어지기 때문에 조동사를 다시 쓰지 않고 동사원형만 온 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대신에,\u003c/span>\u003cspan class=\"en\">Instead,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">학교는 음식에 명확하게 라벨을 붙일 수 있습니다\u003c/span>\u003cspan class=\"en\">the school \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">could\u003c/span> clearly label foods\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">달걀을 포함할지도 모르는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">may \u003c/span>\u003cspan class=\"tgt\">contain \u003c/span>\u003cspan class=\"tgt\">eggs\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">대신에, 학교는 달걀을 포함할지도 모르는 음식에 명확하게 라벨을 붙일 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 달걀을 아예 빼지 말고, 달걀이 들었을 수 있다고 \u003cb class=\"key\">표시\u003c/b>하자는 \u003cb class=\"key\">대안\u003c/b>을 제시하는 문장이에요. 금지보다 정보 제공이 낫다는 논리로, 앞 문장의 문제를 풀어 주는 실질적인 해결책 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 could(제안·가능)\u003c/span> : [could + 동사원형 label] : \"라벨을 붙일 수 있습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관계대명사 that(주격)\u003c/span> : [선행사 foods + that + 동사 may contain + 목적어 eggs] : \"달걀을 포함할지도 모르는\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"Instead, 대신에. the school could clearly label foods, 학교는 음식에 명확하게 라벨을 붙일 수 있습니다. that may contain eggs, 달걀을 포함할지도 모르는. 이 문장 전체를 해석하면, 대신에, 학교는 달걀을 포함할지도 모르는 음식에 명확하게 라벨을 붙일 수 있습니다.","hl":"m"},{"n":44,"text":"여기서 글쓴이는 금지 대신 대안을 꺼내요. 달걀을 아예 빼지 말고, 달걀이 들어 있을 수 있다고 표시하자는 거죠. 이렇게 표시를 해 주면 정보를 주는 방법이라서 금지보다 훨씬 낫다는 논리예요.","hl":"mn"},{"n":45,"text":"첫 번째로 could는 상대에게 부드럽게 제안할 때 쓰는 조동사예요. 그래서 뒤에 동사원형 label이 오고, clearly는 그 사이에서 동사를 꾸며 주는 거죠. 두 번째로 that may contain eggs에서 that은 앞의 foods를 받는 주격 관계대명사예요. 관계사절 안에 조동사 may가 들어가서 '달걀을 포함할지도 모르는'이라는 추측의 의미가 된답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">중요합니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">important\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">학생들이 계속 가지는 것이\u003c/span>\u003cspan class=\"en\">students \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">continue \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">have\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다양한 음식 선택을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">wide \u003c/span>\u003cspan class=\"tgt\">choice \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">foods\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">학생들이 계속해서 다양한 음식을 선택하는 것이 중요합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글쓴이가 이메일 전체에서 말하고자 하는 핵심 주장을 다시 한번 못 박는 문장이에요. 학생들에게 \u003cb class=\"key\">다양한 \u003c/b>\u003cb class=\"key\">음식 \u003c/b>\u003cb class=\"key\">선택\u003c/b>이 보장되어야 한다는 점을 강조하며 글을 마무리합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가주어 It / 진주어 that절\u003c/span> : [It(가주어) + is + 형용사 + (that)절(진주어)] : \"중요합니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : [continue(타동사) + to have(to부정사구/목적어)] : \"계속 가지는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">형용사 수식 + of 구\u003c/span> : [a wide(형용사) + choice(명사) + of foods(범위)] : \"다양한 음식 선택\"\u003c/div>\u003c/div>","segs":[{"n":46,"text":"It is important, 중요합니다. students continue to have, 학생들이 계속 가지는 것이. a wide choice of foods, 다양한 음식 선택을. 이 문장 전체를 해석하면, 학생들이 계속해서 다양한 음식을 선택하는 것이 중요합니다.","hl":"m"},{"n":47,"text":"이 문장은 글 전체의 주장을 마지막에 다시 정리하는 역할이에요. 학생들에게 다양한 음식 선택이 계속 보장되어야 한다는 점을 강조하면서 글을 닫는 거죠.","hl":"mn"},{"n":48,"text":"첫 번째로 It is important의 It은 해석하지 않는 가주어예요. 진짜 주어는 뒤에 나오는 students continue to have 이하의 절이고, 그 앞의 that은 생략되어 있다고 보면 됩니다. 두 번째로 continue to have에서 to have는 동사 continue의 목적어로 쓰인 to부정사예요. 세 번째로 a wide choice of foods에서는 wide가 choice를 꾸며 주고, of foods가 선택의 범위를 밝혀 주는 구조라는 점도 함께 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">진심을 담아,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Sincerely,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Cathy Brown 드림\u003c/span>\u003cspan class=\"en\">Cathy Brown\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Cathy Brown 드림\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 편지를 끝맺을 때 쓰는 \u003cb class=\"key\">맺음말\u003c/b> 표현이에요. 앞에서 학교에 계란 요리 중단 제안에 반대하며 자기 의견을 정중히 전달했으니, 그 주장을 \u003cb class=\"key\">공손하게\u003c/b> 마무리하는 역할을 해요. 마지막에 자신의 이름을 밝혀 이 이메일이 \u003cb class=\"key\">학부모 \u003c/b>\u003cb class=\"key\">본인\u003c/b>이 보낸 것임을 분명히 하죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">편지 맺음말(서명 앞 인사 표현)\u003c/span> : Sincerely, + [보내는 사람 이름] : \"진심을 담아, (…드림)\"\u003c/div>\u003c/div>","segs":[{"n":49,"text":"Sincerely, 진심을 담아. Cathy Brown, Cathy Brown 드림. 이 문장 전체를 해석하면, Cathy Brown 드림","hl":"m"},{"n":50,"text":"이 문장은 편지의 맺음말이에요. 앞에서 계란 요리를 없애자는 제안에 반대하는 의견을 말했으니, 그 주장을 공손하게 마무리하는 부분이죠. 마지막에 자기 이름을 밝혀서 이 이메일을 학부모 본인이 보냈다는 것을 확실히 해 줍니다.","hl":"mn"},{"n":51,"text":"첫 번째로, Sincerely 뒤에는 쉼표를 꼭 찍는다는 점을 기억하세요. 두 번째로, 그다음 줄에는 보내는 사람 이름인 Cathy Brown 을 그대로 씁니다. 이렇게 인사말과 이름을 갖추는 것이 영어 편지의 맺음말 형식이에요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>Cathy Brown은 딸 Amy의 담임 선생님이 보낸 메시지에 \u003cb class=\"key\">답변\u003c/b>하기 위해 교장에게 이메일을 쓴다.\u003c/li>\u003cli>담임은 달걀 음식 제공을 중단하자고 \u003cb class=\"key\">제안\u003c/b>했지만, 그녀는 아이들의 \u003cb class=\"key\">영양\u003c/b>을 생각해 강력히 반대한다.\u003c/li>\u003cli>알레르기 학생을 이해하면서도 그 제안은 다른 학생들에게 \u003cb class=\"key\">불공평\u003c/b>하고 성장을 \u003cb class=\"key\">방해\u003c/b>할 수 있다고 본다.\u003c/li>\u003cli>그래서 달걀을 메뉴에서 빼는 대신 \u003cb class=\"key\">라벨\u003c/b>을 붙여 학생들의 다양한 \u003cb class=\"key\">선택\u003c/b>을 지키자고 제안한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The mother opposes removing egg-based foods from the school menu and suggests labeling them instead.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: Cathy Brown은 담임 선생님의 달걀 음식 제공 중단 제안에 반대하며, 달걀은 \u003cb class=\"key\">영양소\u003c/b>가 풍부하고 아이들의 \u003cb class=\"key\">성장\u003c/b>에 꼭 필요하므로 메뉴에서 빼기보다 \u003cb class=\"key\">라벨\u003c/b> 표시로 알레르기 문제를 해결하자고 제안한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":52,"text":"오늘 글의 핵심을 다시 정리해 볼게요. Cathy는 달걀 음식 제공 중단 제안에 반대하고, 영양과 성장을 근거로 들었어요. 그리고 전면 제외 대신 라벨 표시라는 대안을 제시했죠. 주장과 근거, 대안이 어떻게 이어지는지 꼭 기억해 두세요. 수고했어요, 다음 시간에 또 만나요!","hl":null}]}]});</script></body></html>
