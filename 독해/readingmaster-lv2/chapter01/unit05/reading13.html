<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터2 Reading13 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터2 Reading13","audioDir":"reading13_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.520em\">Reading13\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터2\u003c/div>\u003ch1>The Mere Presence of a Cell Phone Harms Your Connection\u003c/h1>\u003ch2>휴대전화가 놓여 있는 것만으로도 관계는 해친다\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>방에 \u003cb class=\"key\">휴대전화\u003c/b>가 놓여 있기만 해도 서로 모르는 사람들의 대화에서 \u003cb class=\"key\">관계의 \u003c/b>\u003cb class=\"key\">질\u003c/b>과 \u003cb class=\"key\">공감\u003c/b>은 더 낮아졌다. 휴대전화를 집어 들지 않아도 확인하지 않은 메시지는 맞은편에 앉아 있는 사람과의 \u003cb class=\"key\">연결\u003c/b>을 해치고 있다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Even a cell phone that is merely placed on the table, without being picked up, harms the quality of a conversation and the connection with the person sitting across from you.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 볼 지문은 리딩마스터 투에 실린, 휴대전화가 대화에 어떤 영향을 주는지에 관한 글이에요. 서로 모르는 사람들이 대화할 때 방에 휴대전화가 놓여 있기만 해도 관계의 질과 공감에 차이가 생긴다는 실험이 나오죠. 결국 휴대전화를 만지지 않고 그냥 탁자 위에 두기만 해도 맞은편 사람과의 연결이 약해진다는 것이 이 글의 요지예요. 오늘은 이 흐름을 차근차근 따라가 볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">우리는 흔히 \u003cb class=\"key\">휴대전화\u003c/b>가 울리거나 직접 만질 때만 대화를 방해한다고 생각해요. 그런데 심리학에서는 상대와의 \u003cb class=\"key\">주의\u003c/b>가 나뉘는 것 자체가 관계에 영향을 준다고 봅니다. 이때 자주 쓰이는 개념이 \u003cb class=\"key\">분할된 \u003c/b>\u003cb class=\"key\">주의\u003c/b>(divided attention)와 \u003cb class=\"key\">주의 \u003c/b>\u003cb class=\"key\">잔여\u003c/b>(attention residue)예요. 주의 잔여란 어떤 일을 완전히 끝내지 않은 채 다른 일을 시작할 때 이전 일에 마음이 남아 있는 상태를 말하죠. 비유하자면 숙제를 하다가 친구와 대화를 시작해도 머릿속 한쪽에는 계속 숙제가 걸려 있는 것과 같아요. 탁자 위의 휴대전화는 확인하지 않은 \u003cb class=\"key\">메시지\u003c/b>가 남아 있다는 신호라서, 만지지 않아도 우리의 주의를 조금씩 붙잡습니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식부터 짚어 볼게요. 우리는 보통 휴대전화가 울리거나 직접 만질 때만 대화를 방해한다고 생각하죠. 그런데 심리학에서는 상대와의 주의가 나뉘는 것 자체가 관계에 영향을 준다고 봅니다. 이때 자주 나오는 개념이 분할된 주의, 영어로 divided attention이고요, 또 하나는 주의 잔여, 영어로 attention residue예요. 주의 잔여는 어떤 일을 완전히 끝내지 않은 채 다른 일을 시작할 때 이전 일에 마음이 남아 있는 상태를 말해요. 숙제를 하다가 친구와 대화를 시작해도 머릿속 한쪽에는 계속 숙제가 걸려 있는 것과 같죠. 탁자 위의 휴대전화는 확인하지 않은 메시지가 남아 있다는 신호라서, 만지지 않아도 우리의 주의를 조금씩 붙잡습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>실험 설계\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>연구자들은 서로 모르는 사람끼리 \u003cb class=\"key\">짝\u003c/b>을 이루어 방에서 대화를 나누게 했어요. 그리고 절반의 방에는 가까운 탁자 위에 \u003cb class=\"key\">휴대전화\u003c/b>를 놓아 두고, 나머지 절반의 방에는 휴대전화를 두지 않았죠. 한 가지 조건만 다르게 만든 비교 실험의 출발점이에요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>대화 후 평가\u003csmall>근거 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>대화가 끝난 뒤 참가자들은 서로에 대해 어떻게 생각하는지 답했어요. 휴대전화가 있던 방의 참가자들은 \u003cb class=\"key\">관계의 \u003c/b>\u003cb class=\"key\">질\u003c/b>이 더 나쁘다고 보고했고, 상대가 \u003cb class=\"key\">공감\u003c/b>을 덜 보였다고 느꼈죠. 즉 휴대전화가 놓여 있기만 해도 상대에 대한 인식이 달라진 거예요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>일상 속 상황\u003csmall>예시 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>이제 글은 우리의 일상으로 무대를 옮겨요. 친구와 점심을 먹으며 휴대전화를 탁자 위에 놓는 장면을 상상하게 하죠. 메시지를 확인하려고 집어 들지 않았으니 스스로는 \u003cb class=\"key\">절제\u003c/b>하고 있다고 느낄 수 있어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>숨은 영향\u003csmall>주장 · 문장 8\u003c/small>\u003c/h4>\u003cp>하지만 확인하지 않은 \u003cb class=\"key\">메시지\u003c/b>도 여전히 맞은편에 앉아 있는 사람과의 \u003cb class=\"key\">연결\u003c/b>을 해친다는 것이 글쓴이의 주장이에요. 휴대전화를 만지지 않는 것과 대화에 온전히 집중하는 것은 다르다는 뜻이죠.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 이 글의 흐름을 실험 설계부터 마지막 주장까지 네 단계로 나눠서 따라가 볼게요.","hl":null},{"n":4,"text":"첫 단계는 실험 설계예요. 연구자들은 서로 모르는 사람끼리 짝을 이루어 방에서 대화를 나누게 합니다. 그리고 절반의 방에는 가까운 탁자 위에 휴대전화를 놓아 두고, 나머지 절반의 방에는 휴대전화를 두지 않았어요. 한 가지 조건만 다르게 만든 아주 깔끔한 비교 실험이죠.","hl":"f0"},{"n":5,"text":"두 번째 단계는 대화가 끝난 뒤의 평가예요. 참가자들에게 서로에 대해 어떻게 생각하는지 물었더니, 휴대전화가 있던 방의 사람들은 관계의 질이 더 나쁘다고 보고했어요. 게다가 상대가 공감을 덜 보였다고 느꼈죠. 휴대전화가 그냥 놓여 있기만 했는데도 상대에 대한 인식이 이렇게 달라진 거예요.","hl":"f1"},{"n":6,"text":"세 번째 단계에서는 글쓴이가 우리 일상으로 무대를 옮깁니다. 여러분이 친구와 점심을 먹으려고 앉아서 휴대전화를 탁자 위에 놓는다고 상상해 보세요. 메시지를 확인하려고 집어 들지 않았으니 자기 자신이 잘하고 있다고 느낄 수 있어요. 스스로는 절제하고 있다고 생각하는 거죠.","hl":"f2"},{"n":7,"text":"마지막 단계가 이 글의 핵심이에요. 하지만 확인하지 않은 메시지도 여전히 맞은편에 앉아 있는 사람과의 연결을 해치고 있다고 글쓴이는 말합니다. 만지지 않는 것과 온전히 집중하는 것은 다르다는 거예요. 그래서 이 글의 주제문은 마지막 문장이 됩니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">근거-주장(실험·예시)\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 8번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 실험 결과를 먼저 제시하고 마지막 문장에서 주장을 끌어내는 \u003cb class=\"key\">미괄식\u003c/b> 전개예요. 첫 문장부터 다섯 번째 문장까지는 연구 절차와 \u003cb class=\"key\">실험 \u003c/b>\u003cb class=\"key\">결과\u003c/b>라는 근거를 차곡차곡 쌓고, 여섯 번째와 일곱 번째 문장에서는 친구와의 점심이라는 익숙한 \u003cb class=\"key\">예시\u003c/b>로 독자를 끌어들입니다. 그리고 마지막 문장에서 'But'으로 '잘하고 있다'는 \u003cb class=\"key\">통념\u003c/b>을 뒤집으며 핵심 주장을 던지기 때문에 주제문은 여덟 번째 문장이에요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>In one study (1)\u003c/b>\u003cspan>근거 도입\u003c/span>\u003cb>After the conversations ended (3)\u003c/b>\u003cspan>시간 순서·결과 제시\u003c/span>\u003cb>When (4)\u003c/b>\u003cspan>조건 제시\u003c/span>\u003cb>But (8)\u003c/b>\u003cspan>전환·반박\u003c/span>\u003cb>still (8)\u003c/b>\u003cspan>강조\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">a cell phone was placed on a nearby table\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a cell phone was present in the room\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the rooms with cell phones\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">set your phone on the table\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">your unchecked messages\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">hurting your connection with the person sitting across from you\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>휴대전화가 있는 방\u003c/th>\u003cth>휴대전화가 없는 방\u003c/th>\u003c/tr>\u003ctr>\u003ctd>관계의 질이 더 나쁘다고 보고\u003c/td>\u003ctd>상대적으로 관계의 질이 더 좋음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>상대가 공감을 덜 보였다고 평가\u003c/td>\u003ctd>상대가 공감을 더 보인 것으로 평가\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 실험과 예시로 근거를 쌓고 마지막에 주장을 던지는 근거와 주장의 구조예요. 위치로 보면 결론이 맨 끝에 오는 미괄식이죠. 첫 번째부터 다섯 번째 문장까지는 실험 결과라는 근거를 쌓고, 여섯 번째와 일곱 번째 문장에서는 친구와의 점심이라는 익숙한 예시로 독자를 끌어들입니다. 그리고 여덟 번째 문장에서 주제를 확실하게 못 박기 때문에 주제문은 마지막 문장이에요.","hl":"ty"},{"n":9,"text":"신호어도 꼭 챙겨 보세요. 첫 번째 문장의 In one study는 근거를 도입하는 표현이고, 세 번째 문장의 After the conversations ended는 시간의 흐름과 결과를 알려 줍니다. 네 번째 문장의 When은 조건을 제시하고, 마지막 문장의 But은 앞의 통념을 뒤집는 전환 신호예요. 그리고 같은 마지막 문장의 still은 그래도 여전히 영향이 남는다는 점을 강조하죠.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>in one study\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>한 연구에서\u003c/span>\u003c/div>\u003cdiv>\u003cb>researcher\u003c/b>\u003cem>명사\u003c/em>\u003cspan>연구자\u003c/span>\u003c/div>\u003cdiv>\u003cb>pair\u003c/b>\u003cem>명사\u003c/em>\u003cspan>한 쌍, 짝\u003c/span>\u003c/div>\u003cdiv>\u003cb>stranger\u003c/b>\u003cem>명사\u003c/em>\u003cspan>낯선 사람, 모르는 사람\u003c/span>\u003c/div>\u003cdiv>\u003cb>chat\u003c/b>\u003cem>동사\u003c/em>\u003cspan>이야기를 나누다\u003c/span>\u003c/div>\u003cdiv>\u003cb>place\u003c/b>\u003cem>동사\u003c/em>\u003cspan>놓다, 두다\u003c/span>\u003c/div>\u003cdiv>\u003cb>nearby\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>근처의, 가까운\u003c/span>\u003c/div>\u003cdiv>\u003cb>present\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>있는, 존재하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>conversation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>대화\u003c/span>\u003c/div>\u003cdiv>\u003cb>participant\u003c/b>\u003cem>명사\u003c/em>\u003cspan>참가자\u003c/span>\u003c/div>\u003cdiv>\u003cb>think of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 대해 생각하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>report\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보고하다, 말하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>quality\u003c/b>\u003cem>명사\u003c/em>\u003cspan>질, 수준\u003c/span>\u003c/div>\u003cdiv>\u003cb>relationship\u003c/b>\u003cem>명사\u003c/em>\u003cspan>관계\u003c/span>\u003c/div>\u003cdiv>\u003cb>worse\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>더 나쁜\u003c/span>\u003c/div>\u003cdiv>\u003cb>cell phone-free\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>휴대전화가 없는\u003c/span>\u003c/div>\u003cdiv>\u003cb>less\u003c/b>\u003cem>부사\u003c/em>\u003cspan>덜, 더 적게\u003c/span>\u003c/div>\u003cdiv>\u003cb>empathy\u003c/b>\u003cem>명사\u003c/em>\u003cspan>공감\u003c/span>\u003c/div>\u003cdiv>\u003cb>imagine\u003c/b>\u003cem>동사\u003c/em>\u003cspan>상상하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>set\u003c/b>\u003cem>동사\u003c/em>\u003cspan>놓다, 두다\u003c/span>\u003c/div>\u003cdiv>\u003cb>feel good about\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 대해 좋게 느끼다, 만족하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>pick up\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>집어 들다\u003c/span>\u003c/div>\u003cdiv>\u003cb>check\u003c/b>\u003cem>동사\u003c/em>\u003cspan>확인하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>message\u003c/b>\u003cem>명사\u003c/em>\u003cspan>메시지, 문자\u003c/span>\u003c/div>\u003cdiv>\u003cb>unchecked\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>확인하지 않은\u003c/span>\u003c/div>\u003cdiv>\u003cb>hurt\u003c/b>\u003cem>동사\u003c/em>\u003cspan>해치다, 상하게 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>connection\u003c/b>\u003cem>명사\u003c/em>\u003cspan>연결, 유대, 관계\u003c/span>\u003c/div>\u003cdiv>\u003cb>across from\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~의 맞은편에\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"단어도 몇 개만 짚어 볼게요. empathy는 공감이라는 뜻이고, unchecked는 확인하지 않은이라는 뜻이에요. connection은 관계나 유대를 뜻하는데, 여기서는 맞은편 사람과의 연결이라는 의미로 쓰였습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">stranger\u003c/b>\u003cspan class=\"m\">낯선 사람\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">unknown person\u003c/span>\u003cspan class=\"s\">outsider\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">acquaintance\u003c/span>\u003cspan class=\"a\">friend\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">present\u003c/b>\u003cspan class=\"m\">있는, 존재하는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">available\u003c/span>\u003cspan class=\"s\">existing\u003c/span>\u003cspan class=\"s\">there\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">absent\u003c/span>\u003cspan class=\"a\">missing\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">report\u003c/b>\u003cspan class=\"m\">보고하다, 말하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">state\u003c/span>\u003cspan class=\"s\">claim\u003c/span>\u003cspan class=\"s\">announce\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">conceal\u003c/span>\u003cspan class=\"a\">hide\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">quality\u003c/b>\u003cspan class=\"m\">질, 수준\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">standard\u003c/span>\u003cspan class=\"s\">level\u003c/span>\u003cspan class=\"s\">grade\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">empathy\u003c/b>\u003cspan class=\"m\">공감\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">understanding\u003c/span>\u003cspan class=\"s\">sympathy\u003c/span>\u003cspan class=\"s\">compassion\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">indifference\u003c/span>\u003cspan class=\"a\">apathy\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">hurt\u003c/b>\u003cspan class=\"m\">해치다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">harm\u003c/span>\u003cspan class=\"s\">damage\u003c/span>\u003cspan class=\"s\">impair\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">help\u003c/span>\u003cspan class=\"a\">benefit\u003c/span>\u003cspan class=\"a\">heal\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">connection\u003c/b>\u003cspan class=\"m\">연결, 유대\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">bond\u003c/span>\u003cspan class=\"s\">link\u003c/span>\u003cspan class=\"s\">relationship\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">disconnection\u003c/span>\u003cspan class=\"a\">separation\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"시험에 자주 나오는 어휘는 동의어와 반의어로 묶어서 기억해 두세요. stranger는 낯선 사람인데 acquaintance나 friend의 반대말이죠. present는 있는, 존재하는이라는 뜻으로 available이나 existing과 가깝고 absent가 반대말이에요. report는 보고하다, 말하다라는 뜻으로 state나 claim과 바꿔 쓸 수 있습니다. empathy는 understanding이나 sympathy로 바꿀 수 있고 indifference는 반대 개념이에요. hurt는 harm이나 damage로, connection은 bond나 link로 바꿔 쓸 수 있다는 점도 기억해 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 연구에서,\u003c/span>\u003cspan class=\"en\">In one study,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">연구자들은 요청했다\u003c/span>\u003cspan class=\"en\">researchers \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">asked \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">서로 모르는 사람끼리 짝을 이룬 사람들에게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">pairs \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">strangers \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 방에 앉아서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">sit \u003c/span>\u003cspan class=\"tgt\">down \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">room \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이야기를 나누도록.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">chat\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">한 연구에서, 연구자들은 서로 모르는 사람끼리 짝을 이룬 사람들에게 한 방에 앉아서 이야기를 나누도록 요청했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 실험의 첫 장면을 여는 \u003cb class=\"key\">도입 \u003c/b>\u003cb class=\"key\">문장\u003c/b>이에요. 연구자들이 \u003cb class=\"key\">서로 \u003c/b>\u003cb class=\"key\">모르는 \u003c/b>\u003cb class=\"key\">사람\u003c/b> 두 명을 짝지어 방에 앉혀 대화를 시켰다는 뜻이죠. 뒤에 이어질 \u003cb class=\"key\">휴대전화\u003c/b> 유무 실험의 무대를 미리 깔아 주는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">5형식 동사 ask + 목적어 + to부정사(목적격보어)\u003c/span> : ask + [목적어(pairs of strangers)] + [to부정사구(to sit down ...)] : \"서로 모르는 사람끼리 짝을 이룬 사람들에게 앉도록 요청했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동사원형의 병렬 구조(to부정사 하나가 두 동사 이끎)\u003c/span> : to + [동사원형 A(sit down)] + and + [동사원형 B(chat)] : \"방에 앉아서 그리고 이야기를 나누도록\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"In one study, 한 연구에서. researchers asked, 연구자들은 요청했다. pairs of strangers, 서로 모르는 사람끼리 짝을 이룬 사람들에게. to sit down in a room, 한 방에 앉아서. and chat, 이야기를 나누도록.. 이 문장 전체를 해석하면, 한 연구에서, 연구자들은 서로 모르는 사람끼리 짝을 이룬 사람들에게 한 방에 앉아서 이야기를 나누도록 요청했다.","hl":"m"},{"n":13,"text":"이 문장은 실험이 어떻게 시작됐는지 알려 주는 도입 문장이에요. 모르는 사람 두 명을 짝지어 방에서 대화하게 했다는 점이 핵심이죠. 바로 다음 문장에서 그 방에 휴대전화를 두느냐 마느냐로 조건이 갈리니까, 이 문장은 실험의 무대를 세팅하는 역할을 한다고 보면 돼요.","hl":"mn"},{"n":14,"text":"첫 번째로 asked pairs of strangers to sit down을 보세요. ask가 목적어와 to부정사를 데리고 '에게 하도록 요청하다'라는 다섯 형식 문장을 만든 거예요. 두 번째로 to sit down in a room and chat에서는 to부정사 to 하나가 sit down과 chat 두 동사를 함께 이끌면서 병렬로 묶여 있어요. 그래서 '방에 앉아서 이야기를 나누도록'이라는 뜻이 자연스럽게 나옵니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">절반의 방에는\u003c/span>\u003cspan class=\"en\">In half of the rooms,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">휴대전화가 놓여 있었다\u003c/span>\u003cspan class=\"en\">a cell phone \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">placed\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">근처의 탁자 위에;\u003c/span>\u003cspan class=\"en\">on a nearby table;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나머지 절반의 방에는\u003c/span>\u003cspan class=\"en\">in the other half,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">휴대전화가 없었다.\u003c/span>\u003cspan class=\"en\">no phone \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">present\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">절반의 방에는 근처의 탁자 위에 휴대전화가 놓여 있었고, 나머지 절반의 방에는 휴대전화가 없었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 방을 절반씩 나눠 한쪽에는 \u003cb class=\"key\">휴대전화\u003c/b>를 두고, 다른 쪽에는 두지 않았다는 뜻이에요. 두 집단을 \u003cb class=\"key\">대조\u003c/b>시켜 비교하는 실험 설계의 핵심 부분이죠. 세미콜론을 기준으로 두 조건이 나란히 놓여 있어서 앞뒤가 \u003cb class=\"key\">대칭\u003c/b>을 이룹니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태(과거시제)\u003c/span> : [주어 a cell phone] + [be동사 과거 was] + [과거분사 placed] : \"놓여 있었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">형용사의 서술적 용법(주격보어)\u003c/span> : [주어 no phone] + [be동사 was] + [형용사 present(주격보어)] : \"있었다(존재했다)\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"In half of the rooms, 절반의 방에는. a cell phone was placed, 휴대전화가 놓여 있었다. on a nearby table, 근처의 탁자 위에;. in the other half, 나머지 절반의 방에는. no phone was present, 휴대전화가 없었다.. 이 문장 전체를 해석하면, 절반의 방에는 근처의 탁자 위에 휴대전화가 놓여 있었고, 나머지 절반의 방에는 휴대전화가 없었다.","hl":"m"},{"n":16,"text":"이 문장은 실험 조건을 두 갈래로 나누는 부분이에요. 한쪽 방에는 휴대전화를 탁자 위에 올려 두고, 다른 쪽 방에는 아예 두지 않았다는 거죠. 이렇게 두 집단을 대조해 놓아야 뒤에서 나오는 대화의 질 차이를 비교할 수 있는 거예요.","hl":"mn"},{"n":17,"text":"먼저 a cell phone was placed를 보면, 휴대전화는 누군가가 놓는 대상이니까 수동태로 표현했어요. be동사 was 뒤에 과거분사 placed가 온 과거 수동태 형태죠. 다음으로 no phone was present에서 present는 존재한다는 뜻의 형용사로 be동사 뒤에서 주격보어 역할을 합니다. 그래서 휴대전화가 없었다라고 해석하는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대화가 끝나고 나서,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">After \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">conversations \u003c/span>\u003cspan class=\"tgt\">ended\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">연구자들은 참가자들에게 물었다\u003c/span>\u003cspan class=\"en\">the researchers asked the participants\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">서로에 대해 어떻게 생각하는지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">thought \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">each \u003c/span>\u003cspan class=\"tgt\">other\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">대화가 끝나고 나서, 연구자들은 참가자들에게 서로에 대해 어떻게 생각하는지 물었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 대화가 끝난 뒤 참가자들에게 서로에 대한 인상을 물었다는 내용이에요. 여기서 참가자들이 느낀 \u003cb class=\"key\">관계의 \u003c/b>\u003cb class=\"key\">질\u003c/b>을 측정하는 단계가 시작되죠. 다음 문장에서 휴대전화가 있던 방의 결과가 본격적으로 제시됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간을 나타내는 접속사 after의 부사절\u003c/span> : After + [주어 + 동사](부사절), + [주어 + 동사](주절) : \"대화가 끝난 후에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">간접의문문(의문사절)의 목적어 역할\u003c/span> : ask + [목적어 the participants] + [의문사 what + 주어 they + 동사 thought] : \"서로에 대해 어떻게 생각하는지\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"After the conversations ended, 대화가 끝나고 나서. the researchers asked the participants, 연구자들은 참가자들에게 물었다. what they thought of each other, 서로에 대해 어떻게 생각하는지. 이 문장 전체를 해석하면, 대화가 끝나고 나서, 연구자들은 참가자들에게 서로에 대해 어떻게 생각하는지 물었다.","hl":"m"},{"n":19,"text":"대화가 끝난 직후에 연구자들이 참가자들에게 서로에 대한 느낌을 물어봤다는 문장이에요. 여기서부터가 진짜 측정 단계인데, 상대방의 인상과 관계의 질을 확인하는 거죠. 그래서 다음 문장에 나오는 실험 결과로 자연스럽게 이어집니다.","hl":"mn"},{"n":20,"text":"먼저 After the conversations ended는 시간을 알려 주는 부사절이에요. 대화가 끝난 시점을 먼저 제시하고 그다음에 주절의 본동사를 읽으면 흐름이 잘 잡힙니다. 두 번째로 what they thought of each other는 의문사 what이 이끄는 간접의문문으로, asked의 목적어 자리에 통째로 들어가 있어요. 의문문처럼 어순을 뒤집지 않고 주어 다음에 동사가 온다는 점도 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">방에 휴대전화가 있을 때,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">cell \u003c/span>\u003cspan class=\"tgt\">phone \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">present \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">room\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">참가자들은 보고했다\u003c/span>\u003cspan class=\"en\">the participants \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">reported \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 관계의 질이 더 나빴다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">quality \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">relationship \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">worse\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">휴대전화가 없는 방에서 대화한 참가자들보다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">those \u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">talked \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">cell \u003c/span>\u003cspan class=\"tgt\">phone-free \u003c/span>\u003cspan class=\"tgt\">room\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">방에 휴대전화가 있을 때 참가자들은 휴대전화가 없는 방에서 대화한 참가자들보다 그들의 관계의 질이 더 나빴다고 보고했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 실험 결과를 정리해 주는 문장으로, 휴대전화가 방에 놓여 있기만 해도 \u003cb class=\"key\">관계의 \u003c/b>\u003cb class=\"key\">질\u003c/b>이 더 나쁘게 평가되었다는 \u003cb class=\"key\">실험 \u003c/b>\u003cb class=\"key\">결과\u003c/b>를 전달해요. those는 앞에 나온 the participants를 대신하는 \u003cb class=\"key\">대명사\u003c/b>라서, 비교 대상이 사람들임을 정확히 밝혀 주죠. 5번 문장의 근거가 되는 핵심 결과 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 when의 시간 부사절\u003c/span> : [When + 주어 + 동사], [주절] : \"방에 휴대전화가 있을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">that이 생략된 목적어절(report + 목적절)\u003c/span> : report + [(that) + 주어 + 동사] : \"그들의 관계의 질이 더 나빴다고 보고했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">비교급 than + 대명사 those + 주격 관계대명사 who\u003c/span> : [비교급 worse] + than + [those(복수 대명사) + who + 동사] : \"휴대전화가 없는 방에서 대화한 참가자들보다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"When a cell phone was present in the room, 방에 휴대전화가 있을 때. the participants reported, 참가자들은 보고했다. the quality of their relationship was worse, 그들의 관계의 질이 더 나빴다고. than those who talked in a cell phone-free room, 휴대전화가 없는 방에서 대화한 참가자들보다. 이 문장 전체를 해석하면, 방에 휴대전화가 있을 때 참가자들은 휴대전화가 없는 방에서 대화한 참가자들보다 그들의 관계의 질이 더 나빴다고 보고했다.","hl":"m"},{"n":22,"text":"이 문장은 실험이 끝난 뒤 나온 결과를 정리하는 문장이에요. 방에 휴대전화가 놓여 있기만 해도 참가자들이 느끼는 관계의 질이 더 나빴다고 보고했다는 실험 결과를 전달하고 있죠. 여기서 those는 앞에 나온 the participants를 대신 받는 대명사라서 비교 대상이 사람이라는 점을 놓치지 마세요.","hl":"mn"},{"n":23,"text":"첫 번째 어법 포인트는 접속사 when이 이끄는 시간 부사절이에요. when 절이 문장 앞에서 상황을 제시하고, present는 형용사로 쓰여 있는 상태를 나타내죠. 두 번째는 report 뒤에 that이 생략된 목적어절 구조예요. that이 없어도 was가 이끄는 목적어절이 통째로 reported의 목적어로 들어간다고 이해하면 됩니다. 세 번째는 비교급 than 뒤에 those를 쓴 표현이에요. 반복을 피하려고 those로 비교 대상을 받았고, 그 뒤를 주격 관계대명사 who가 수식해서 대화한 사람들을 가리키는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">휴대전화가 있는 방에서 대화한 쌍들은\u003c/span>\u003cspan class=\"en\">The pairs \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">talked \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">rooms \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">cell \u003c/span>\u003cspan class=\"tgt\">phones\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">생각했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">thought \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 상대가 공감을 덜 보였다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">partners \u003c/span>\u003cspan class=\"tgt\">showed \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">less \u003c/span>\u003cspan class=\"tgt\">empathy\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">휴대전화가 있는 방에서 대화한 쌍들은 자신의 상대가 공감을 덜 보였다고 생각했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 4번 문장의 결과를 참가자들의 주관적 평가로 한 번 더 풀어 주는 문장이에요. 휴대전화가 있으면 상대가 \u003cb class=\"key\">공감\u003c/b>을 덜 보인다고 느꼈다는, 즉 휴대전화가 상대에 대한 \u003cb class=\"key\">인상\u003c/b>까지 낮춘다는 점을 보여 줘요. 남의 평가가 아니라 '당사자들이 그렇게 느꼈다'는 점이 핵심이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 who (선행사 수식)\u003c/span> : [선행사 The pairs] + [who + 동사 talked ~] : \"휴대전화가 있는 방에서 대화한\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">that이 생략된 목적어절(think + 목적절)\u003c/span> : think + [(that) + 주어 + 동사] : \"자신의 상대가 공감을 덜 보였다고 생각했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">less + 불가산명사(little의 비교급)\u003c/span> : [less] + [불가산명사 empathy] : \"공감을 덜\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"The pairs who talked in the rooms with cell phones, 휴대전화가 있는 방에서 대화한 쌍들은. thought, 생각했다. their partners showed less empathy, 자신의 상대가 공감을 덜 보였다고. 이 문장 전체를 해석하면, 휴대전화가 있는 방에서 대화한 쌍들은 자신의 상대가 공감을 덜 보였다고 생각했다.","hl":"m"},{"n":25,"text":"이 문장은 실험 결과를 참가자들의 느낌으로 한 번 더 풀어 주는 문장이에요. 휴대전화가 방에 있으면 상대가 공감을 덜 보인다고 느꼈다는 거죠. 결국 휴대전화가 상대에 대한 인상 자체를 낮춘다는 점이 이 문장의 핵심이에요.","hl":"mn"},{"n":26,"text":"첫 번째는 주격 관계대명사 who예요. 선행사 The pairs가 사람이기 때문에 who가 나와서 선행사를 뒤에서 꾸며 주고, '휴대전화가 있는 방에서 대화한 쌍들'이라는 의미를 만듭니다. 두 번째는 think 뒤에 that이 생략된 목적어절 구조예요. that 생략이 일어나면 주어 their partners가 바로 이어지고, showed가 이끄는 목적어절이 통째로 thought의 목적어가 된답니다. 세 번째는 less empathy인데, empathy는 셀 수 없는 명사라서 little의 비교급인 less를 써서 공감의 정도를 비교해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상상해 보라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Imagine \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분이 친구와 점심을 먹으려고 자리에 앉아서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">sit \u003c/span>\u003cspan class=\"tgt\">down\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">lunch\u003c/span> with a friend\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">휴대전화를 탁자 위에 놓는다고\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">set \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">phone \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">table\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여러분이 친구와 점심을 먹으려고 자리에 앉아서 휴대전화를 탁자 위에 놓는다고 상상해 보라.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞의 실험 결과를 독자 자신의 일상 장면으로 끌어오는 \u003cb class=\"key\">도입\u003c/b> 문장이에요. 친구와의 점심이라는 익숙한 \u003cb class=\"key\">가정\u003c/b>을 통해, 휴대전화를 탁자에 두는 행동이 왜 문제인지 독자가 스스로 느끼게 만들죠. 다음 문장에서 '메시지를 확인하지 않아도 괜찮다'는 안심이 곧 깨진다는 흐름으로 이어져요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문 + that이 생략된 목적어절\u003c/span> : [동사원형 Imagine] + [(that) + 주어 + 동사] : \"여러분이 자리에 앉는다고 상상해 보라\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : [동사 sit down] + [to + 동사원형(목적)] : \"점심을 먹으려고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">set + 목적어 + 장소 전치사구(5형식 유사 구조)\u003c/span> : set + [목적어 your phone] + [on the table(장소)] : \"휴대전화를 탁자 위에 놓다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Imagine, 상상해 보라. you sit down to have lunch with a friend, 여러분이 친구와 점심을 먹으려고 자리에 앉아서. and set your phone on the table, 휴대전화를 탁자 위에 놓는다고. 이 문장 전체를 해석하면, 여러분이 친구와 점심을 먹으려고 자리에 앉아서 휴대전화를 탁자 위에 놓는다고 상상해 보라.","hl":"m"},{"n":28,"text":"이 문장은 앞에서 본 실험 결과를 독자 자신의 일상으로 가져오는 도입 문장이에요. 친구와 점심을 먹는 익숙한 장면을 가정하면서, 휴대전화를 탁자에 두는 행동이 왜 문제인지 스스로 느끼게 만드는 거죠. 그래서 다음 문장에서 이어지는 '확인하지 않아도 괜찮다'는 안심이 곧 깨지게 됩니다.","hl":"mn"},{"n":29,"text":"첫 번째는 Imagine이 명령문이라 동사원형으로 시작한다는 점이에요. 그 뒤에는 that이 생략된 목적어절이 와서, 여러분이 앉는 장면 전체가 상상하는 내용이 됩니다. 두 번째는 to have lunch인데, to부정사의 부사적 용법으로 '점심을 먹으려고'라는 목적을 나타내요. 세 번째는 set your phone on the table 구조예요. set이 목적어 your phone을 취하고, on the table이 놓이는 장소를 알려 주면서 '탁자 위에 놓다'라는 의미를 완성한답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 자신에 대해 기분이 좋을지 모른다\u003c/span>\u003cspan class=\"en\">You \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">might \u003c/span>\u003cspan class=\"tgt\">feel\u003c/span> good about yourself\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜냐하면 당신이 그것을 집어 들지 않기 때문에\u003c/span>\u003cspan class=\"en\">because you \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003cspan class=\"tgt\">pick \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">up\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신의 메시지를 확인하려고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">check \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">messages\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">메시지를 확인하려고 휴대전화를 집어 들지 않기 때문에 자기 자신이 잘하고 있다고 느낄지 모른다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 휴대전화를 집어 들지 않았다는 이유만으로 스스로 \u003cb class=\"key\">칭찬\u003c/b>하게 되는 심리를 말해요. 하지만 손대지 않은 것과 메시지가 주는 \u003cb class=\"key\">영향\u003c/b>은 별개라는 점을 암시하죠. 뒤에 오는 because 이하가 그 이유를 설명해 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 might (추측)\u003c/span> : [주어] + might + [동사원형] : \"기분이 좋을지 모른다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">구동사 pick up과 대명사 목적어의 어순\u003c/span> : pick + [it (대명사 목적어)] + up : \"그것을 집어 들지 않는다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : [행동] + to + [동사원형] (~하기 위해) : \"메시지를 확인하려고\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"You might feel good about yourself, 당신은 자신에 대해 기분이 좋을지 모른다. because you don't pick it up, 왜냐하면 당신이 그것을 집어 들지 않기 때문에. to check your messages, 당신의 메시지를 확인하려고. 이 문장 전체를 해석하면, 메시지를 확인하려고 휴대전화를 집어 들지 않기 때문에 자기 자신이 잘하고 있다고 느낄지 모른다.","hl":"m"},{"n":31,"text":"여기서 핵심은 스스로를 칭찬하고 있다는 점이에요. 휴대전화를 집어 들지 않았으니까 잘하고 있다고 느끼죠. 그런데 손대지 않은 것과 메시지가 주는 영향은 전혀 별개의 문제라는 걸 이 문장이 암시하고 있어요.","hl":"mn"},{"n":32,"text":"첫 번째, might feel에서 might는 조동사예요. 조동사 뒤에는 반드시 동사원형이 오고, 여기서는 약한 추측을 나타내죠. 두 번째, don't pick it up을 보세요. pick up처럼 동사와 부사가 붙은 구동사는 목적어가 대명사일 때 동사와 부사 사이에 넣어요. 그래서 pick it up이지 pick up it이 아니에요. 세 번째, to check your messages는 to부정사의 부사적 용법으로 집어 드는 목적을 나타내요. 해석은 메시지를 확인하려고 이렇게 하면 자연스러워요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 당신의 확인하지 않은 메시지들은\u003c/span>\u003cspan class=\"en\">But \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">unchecked \u003c/span>\u003cspan class=\"tgt\">messages\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여전히 해치고 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">still \u003c/span>\u003cspan class=\"tgt\">hurting\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 사람과의 당신의 관계를\u003c/span>\u003cspan class=\"en\">your connection with the person\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신 맞은편에 앉아 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">sitting \u003c/span>\u003cspan class=\"tgt\">across \u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">you\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 여러분이 확인하지 않은 메시지도 여전히 맞은편에 앉아 있는 사람과의 관계를 해치고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 휴대전화를 내려놓았어도 확인하지 않은 메시지는 여전히 상대와의 \u003cb class=\"key\">관계\u003c/b>를 해친다는 뜻이에요. 앞 문장의 안도감을 But으로 뒤집는 \u003cb class=\"key\">반전\u003c/b>의 문장이죠. 이 글의 \u003cb class=\"key\">주제\u003c/b>를 그대로 담고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사 unchecked의 형용사적 용법\u003c/span> : [과거분사] + [명사] (수동·완료 의미) : \"당신이 확인하지 않은 메시지들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재진행형\u003c/span> : be동사 + [동사원형-ing] (진행) : \"여전히 해치고 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">현재분사구의 형용사적 용법\u003c/span> : [명사] + [동사원형-ing ~] (능동·진행) : \"당신 맞은편에 앉아 있는\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"But your unchecked messages, 그러나 당신의 확인하지 않은 메시지들은. are still hurting, 여전히 해치고 있다. your connection with the person, 그 사람과의 당신의 관계를. sitting across from you, 당신 맞은편에 앉아 있는. 이 문장 전체를 해석하면, 그러나 여러분이 확인하지 않은 메시지도 여전히 맞은편에 앉아 있는 사람과의 관계를 해치고 있다.","hl":"m"},{"n":34,"text":"앞 문장에서 휴대전화를 안 들어서 다행이라고 안심했죠. 그런데 이 문장이 But으로 분위기를 확 뒤집어요. 확인하지 않은 메시지도 여전히 눈앞의 사람과의 관계를 해친다는 반전이고, 이게 바로 이 글의 주제예요.","hl":"mn"},{"n":35,"text":"첫 번째, unchecked는 과거분사예요. check에 과거분사형 어미가 붙어서 확인되지 않은, 즉 수동의 의미를 가진 형용사가 되어 messages를 꾸며 줍니다. 두 번째, are still hurting은 현재진행형이에요. 지금도 계속되고 있는 진행 상황에 still이 붙어서 여전히라는 느낌을 더해 주죠. 세 번째, sitting across from you는 현재분사구예요. the person을 뒤에서 꾸미면서 그 사람이 능동으로 맞은편에 앉아 있는 상태를 나타냅니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>연구자들은 서로 모르는 사람들의 \u003cb class=\"key\">대화\u003c/b>에서 휴대전화의 존재가 어떤 영향을 주는지 실험했어요.\u003c/li>\u003cli>휴대전화가 놓인 방의 참가자들은 \u003cb class=\"key\">관계의 \u003c/b>\u003cb class=\"key\">질\u003c/b>이 더 나쁘다고 보고했고 상대가 \u003cb class=\"key\">공감\u003c/b>을 덜 보였다고 느꼈어요.\u003c/li>\u003cli>친구와 점심을 먹을 때 휴대전화를 집어 들지 않으면 스스로는 \u003cb class=\"key\">절제\u003c/b>하고 있다고 느낄 수 있어요.\u003c/li>\u003cli>그러나 확인하지 않은 메시지는 여전히 맞은편 사람과의 \u003cb class=\"key\">연결\u003c/b>을 해친다는 것이 이 글의 주장이에요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Even a cell phone that is merely placed on the table, without being picked up, harms the quality of a conversation and the connection with the person sitting across from you.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">방에 \u003cb class=\"key\">휴대전화\u003c/b>가 놓여 있기만 해도 서로 모르는 사람들의 대화에서 \u003cb class=\"key\">관계의 \u003c/b>\u003cb class=\"key\">질\u003c/b>과 \u003cb class=\"key\">공감\u003c/b>은 더 낮아졌다. 휴대전화를 집어 들지 않아도 확인하지 않은 메시지는 맞은편에 앉아 있는 사람과의 \u003cb class=\"key\">연결\u003c/b>을 해치고 있다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":36,"text":"정리해 볼게요. 휴대전화는 만질 때만이 아니라 놓여 있기만 해도 대화의 질과 공감을 떨어뜨립니다. 확인하지 않은 메시지도 여전히 맞은편 사람과의 연결을 해치고 있다는 점이 이 글의 핵심이에요. 오늘 내용 잘 정리해 두고, 다음 시간에 또 만나요. 수고했어요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
