 수 있다는 사실을 먼저 이해하고 글을 읽어보시면 훨씬 더 잘 와닿으실 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01연구 설정</div><ul><li>낯선 사람들을 대상으로 휴대폰 유무가 대화에 미치는 영향을 확인하기 위한 실험을 수행했다.</li><li>낯선 사람(strangers)끼리 대화하도록 실험 구성</li><li>실험군: 휴대폰(cell phone)이 있는 방과 없는 방으로 구분</li><li>핵심 키워드: 실험(study), 휴대폰(cell phone)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02실험 결과</div><ul><li>휴대폰이 방에 있을 때 대화 참여자들의 관계 평가가 더 부정적으로 나타났다.</li><li>휴대폰이 있었던 그룹의 관계 질(quality of relationship)이 낮게 평가됨</li><li>대화 상대방이 공감(empathy)을 덜 보인다고 느낌</li><li>핵심 키워드: 관계의 질(relationship quality), 공감(empathy)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03실생활 적용</div><ul><li>휴대폰을 사용하지 않더라도 식탁 위에 올려두는 행위 자체가 관계에 악영향을 준다.</li><li>휴대폰을 확인하지 않아도 존재만으로 관계에 해를 끼침</li><li>눈앞에 있는 사람과의 연결(connection)을 방해함</li><li>핵심 키워드: 메시지(messages), 연결(connection)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">stranger</td><td class=\"m\">낯선 사람, 타인</td></tr><tr><td class=\"w\">be present</td><td class=\"m\">존재하다, 출석하다</td></tr><tr><td class=\"w\">participant</td><td class=\"m\">참가자, 참여자</td></tr><tr><td class=\"w\">quality</td><td class=\"m\">질, 품질, 특성</td></tr><tr><td class=\"w\">relationship</td><td class=\"m\">관계, 관련성</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">empathy</td><td class=\"m\">공감, 감정이입</td></tr><tr><td class=\"w\">set</td><td class=\"m\">놓다, 배치하다</td></tr><tr><td class=\"w\">pick up</td><td class=\"m\">집어 들다, 잡다</td></tr><tr><td class=\"w\">connection</td><td class=\"m\">연결, 관계, 유대</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">한 연구에서,</span><span class=\"en\"><b>In one study,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">연구자들은 낯선 사람들의 쌍에게 요청했다</span><span class=\"en\"><b>researchers <span class=\"grammar-hl\">asked pairs of strangers</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">방에 앉아서</span><span class=\"en\"><b><span class=\"grammar-hl\">to sit down</span> in a room</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이야기를 나누라고</span><span class=\"en\"><b>and chat.</b></span></div></div><div class=\"lec-sent-ko\">한 연구에서, 연구자들은 서로 모르는 사람끼리 짝을 이룬 사람들에게 한 방에 앉아서 이야기를 나누도록 요청했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 실험의 전체적인 배경을 제시하는 도입부입니다. 뒤이어 나올 실험 결과가 어떤 상황에서 도출된 것인지 구체적인 환경을 설정합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">asked pairs of strangers to sit down 5형식(SVOC) 구조: ask는 &#39;ask + O + toV&#39; 구조로, 목적어(pairs of strangers)가 목적보어(to sit down)하도록 요청하다는 의미를 가진다.</div><div class=\"lec-gr-item\">to sit down (to부정사): 5형식 구조에서 목적어의 동작을 보충 설명하는 목적보어 역할을 한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">stranger</td><td class=\"m\">낯선 사람, 타인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">방들의 절반에는,</span><span class=\"en\"><b>In half of the rooms,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">휴대전화가 놓여 있었다</span><span class=\"en\"><b>a cell phone <span class=\"grammar-hl\">was placed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">근처 탁자 위에;</span><span class=\"en\"><b>on a nearby table;</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나머지 절반의 방에는,</span><span class=\"en\"><b>in the other half,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">전화기가 없었다</span><span class=\"en\"><b>no phone was present.</b></span></div></div><div class=\"lec-sent-ko\">절반의 방에는 근처의 탁자 위에 휴대전화가 놓여 있었고, 나머지 절반의 방에는 휴대전화가 없었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 실험 상황을 구체화합니다. 휴대전화의 유무라는 변수를 도입하여, 이것이 인간관계에 어떤 영향을 미치는지 확인하려는 실험의 핵심 설계를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was placed (수동태): be동사(was) + p.p.(placed) 구조. place는 타동사인데 목적어가 없어서 수동구조 was placed 형태로 쓴다. 기본구조: place + O + on/in 장소 (O를 장소에 두다).</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">대화가 끝난 후에,</span><span class=\"en\"><b><span class=\"grammar-hl\">After the conversations ended</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">연구자들은 참가자들에게 물었다</span><span class=\"en\"><b>the researchers asked the participants</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 어떻게 생각하는지</span><span class=\"en\"><b><span class=\"grammar-hl\">what they thought</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">서로에 대해</span><span class=\"en\"><b><span class=\"grammar-hl\">of each other</span>.</b></span></div></div><div class=\"lec-sent-ko\">대화가 끝나고 나서, 연구자들은 참가자들에게 서로에 대해 어떻게 생각하는지 물었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 실험의 측정 방법을 나타냅니다. 앞서 설정한 변수(휴대전화 유무)가 대화 후 상대방에 대한 인상이나 관계의 질에 어떤 변화를 주었는지 확인하려는 의도입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">After the conversations ended (절(주어+동사)): 접속사 After가 이끄는 부사절이다.</div><div class=\"lec-gr-item\">what they thought of each other (간접의문문): &#39;의문사(what) + S + V&#39; 구조로, asked의 직접목적어 역할을 하는 명사절이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">participant</td><td class=\"m\">참가자, 참여자</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">휴대전화가 방에 존재했을 때,</span><span class=\"en\"><b><span class=\"grammar-hl\">When a cell phone was present</span> in the room,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">참가자들은 보고했다</span><span class=\"en\"><b>the participants reported</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들 관계의 질이 더 나빴다고</span><span class=\"en\"><b>the quality of their relationship was worse</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">휴대전화가 없는 방에서 대화했던 사람들보다</span><span class=\"en\"><b>than <span class=\"grammar-hl\">those who talked</span> in a <span class=\"grammar-hl\">cell phone-free</span> room.</b></span></div></div><div class=\"lec-sent-ko\">방에 휴대전화가 있을 때 참가자들은 휴대전화가 없는 방에서 대화한 참가자들보다 그들의 관계의 질이 더 나빴다고 보고했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 설정한 실험의 결과입니다. 휴대전화의 존재 자체가 상대방과의 상호작용에 부정적인 영향을 미쳤음을 명확히 밝히고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">When a cell phone was present (부사절): 접속사 When이 이끄는 시간의 부사절이다.</div><div class=\"lec-gr-item\">those who talked (관계대명사): 주격 관계대명사 who가 those를 수식하는 형용사절이다. 관계대명사 뒤에는 주어가 빠진 불완전한 절이 온다.</div><div class=\"lec-gr-item\">cell phone-free (관용표현): &#39;-free&#39;는 &#39;~이 없는&#39;이라는 뜻의 접미사로, 여기서는 휴대폰이 없는 상태를 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">participant</td><td class=\"m\">참가자, 참여자</td></tr><tr><td class=\"w\">quality</td><td class=\"m\">질, 품질, 특성</td></tr><tr><td class=\"w\">relationship</td><td class=\"m\">관계, 관련성</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">휴대전화가 있는 방에서 대화한 쌍들은</span><span class=\"en\"><b><span class=\"grammar-hl\">The pairs who talked</span> in the rooms with cell phones</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">생각했다 그들의 상대가</span><span class=\"en\"><b>thought their partners</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">공감을 덜 보였다고</span><span class=\"en\"><b>showed less empathy.</b></span></div></div><div class=\"lec-sent-ko\">휴대전화가 있는 방에서 대화한 쌍들은 자신의 상대가 공감을 덜 보였다고 생각했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 결과에 대한 구체적인 이유를 제시합니다. 단순한 &#39;관계의 질&#39; 저하가 실제로는 상대방의 공감 부족으로 느껴졌음을 보여주며, 휴대전화가 대화 상대에 대한 심리적 거리를 멀게 함을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">The pairs who talked (관계대명사): 주격 관계대명사 who가 앞의 명사(The pairs)를 수식한다. 절 내부에 주어 역할을 하는 who가 포함되어 있다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">empathy</td><td class=\"m\">공감, 감정이입</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">상상해 보라</span><span class=\"en\"><b>Imagine</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신이 친구와 점심을 먹으려 자리에 앉아</span><span class=\"en\"><b>you <span class=\"grammar-hl\">sit down to have lunch</span> with a friend</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">휴대전화를 탁자 위에 두는 것을</span><span class=\"en\"><b>and <span class=\"grammar-hl\">set your phone on the table</span>.</b></span></div></div><div class=\"lec-sent-ko\">여러분이 친구와 점심을 먹으려고 자리에 앉아서 휴대전화를 탁자 위에 놓는다고 상상해 보라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 실험 결과를 일상적인 상황으로 확장합니다. 독자가 스스로 경험할 법한 구체적인 사례를 제시함으로써 글의 내용을 실생활과 연결합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">sit down to have lunch (to부정사): 부사적 용법으로, &#39;점심을 먹기 위해&#39;라는 목적을 나타낸다.</div><div class=\"lec-gr-item\">set your phone on the table (동사구): &#39;set + O + 전치사구&#39; 구조로, 휴대폰을 테이블 위에 두다라는 의미이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">set</td><td class=\"m\">놓다, 배치하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신은 자신에 대해 좋게 느낄지도 모른다</span><span class=\"en\"><b>You might feel good about yourself</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신이 그것을 집어 들지 않기 때문에</span><span class=\"en\"><b>because you don’t pick it up</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">메시지를 확인하려고</span><span class=\"en\"><b><span class=\"grammar-hl\">to check your messages</span>.</b></span></div></div><div class=\"lec-sent-ko\">메시지를 확인하려고 휴대전화를 집어 들지 않기 때문에 자기 자신이 잘하고 있다고 느낄지 모른다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 우리가 흔히 하는 오해를 보여줍니다. 단순히 &#39;전화기를 사용하지 않는 것&#39;이 상대를 존중하는 행동이라고 착각하는 심리를 짚어냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to check your messages (to부정사): 부사적 용법(목적)으로, &#39;메시지를 확인하기 위해&#39;라는 동작의 의도를 나타낸다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만 당신의 확인하지 않은 메시지는</span><span class=\"en\"><b>But your <span class=\"grammar-hl\">unchecked</span> messages</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여전히 해치고 있다</span><span class=\"en\"><b>are still hurting</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 사람과의 당신의 관계를</span><span class=\"en\"><b>your connection with the person</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신 맞은편에 앉아 있는</span><span class=\"en\"><b><span class=\"grammar-hl\">sitting across from you</span>.</b></span></div></div><div class=\"lec-sent-ko\">그러나 여러분이 확인하지 않은 메시지도 여전히 맞은편에 앉아 있는 사람과의 관계를 해치고 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글 전체의 결론이자 핵심 주장입니다. 전화기를 사용하지 않아도 그 존재만으로 대화 상대와의 정서적 연결을 방해하고 있다는 경고를 담고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">unchecked (과거분사): 과거분사 unchecked가 명사(messages)를 앞에서 수식하여 &#39;확인되지 않은 메시지&#39;라는 의미를 나타낸다.</div><div class=\"lec-gr-item\">sitting across from you (현재분사): 현재분사 sitting이 명사(the person)를 뒤에서 수식한다. &#39;당신 맞은편에 앉아 있는 사람&#39;이라는 의미로 동작의 상태를 설명한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">connection</td><td class=\"m\">연결, 관계, 유대</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>연구를 통해 낯선 사람과의 대화 중 휴대전화 존재 여부가 관계의 질에 미치는 영향을 확인했다.</li><li>휴대전화가 방에 있으면 상대가 공감을 덜 한다고 느끼며 관계 만족도가 떨어졌다.</li><li>우리가 전화기를 직접 보지 않아도, 그 존재만으로 대화 상대와의 유대감은 훼손된다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The presence of a cell phone during conversation decreases perceived empathy, and it ultimately undermines the quality of human connection.</div>\n              <div class=\"lec-final-sum-ko\">대화 중 휴대전화의 존재는 체감되는 공감도를 낮추며, 결과적으로 인간관계의 질을 저하시킨다.</div></div></div>"],"segs":[[{"audio":"./reading13_audio/1.mp3","hl":null}],[{"audio":"./reading13_audio/2.mp3","hl":null}],[{"audio":"./read
