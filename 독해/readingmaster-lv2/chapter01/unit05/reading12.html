<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터2 Reading12 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터2 Reading12","audioDir":"reading12_audio","preview":false,"count":45,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.520em\">Reading12\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터2\u003c/div>\u003ch1>AI and the Changing World of Work\u003c/h1>\u003ch2>AI 시대, 일자리와 업무의 변화\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>AI가 단순 업무를 자동화해 \u003cb class=\"key\">일자리 \u003c/b>\u003cb class=\"key\">감소\u003c/b>를 초래할 수 있지만 새 일자리 기회도 창출한다는 두 전망이 있다. 진실은 그 사이에 있으나 AI가 \u003cb class=\"key\">업무의 \u003c/b>\u003cb class=\"key\">본질\u003c/b>을 바꾸므로 근로자는 새로운 기술과 기량을 익혀 \u003cb class=\"key\">변화\u003c/b>에 적응해야 한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>AI is changing the nature of work, so workers and organizations must adapt by acquiring new skills and preparing for new job categories.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 AI와 고용 시장의 변화에 관한 지문을 함께 읽어 볼게요. 이 글은 AI가 일자리를 줄일 수 있다는 전망과 새 일자리를 만들 수 있다는 전망을 함께 다루면서, 결국 업무의 본질이 변하므로 적응이 필요하다고 말하고 있어요. 요지는 AI 변화에 맞추어 근로자와 조직이 새로운 기술과 기량을 갖추어야 한다는 것입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">AI는 사람처럼 학습하고 판단하는 기술로, \u003cb class=\"key\">자동화\u003c/b>를 통해 여러 산업의 일을 바꿉니다. 자동화가 확산되면 \u003cb class=\"key\">고용 \u003c/b>\u003cb class=\"key\">시장\u003c/b>에서는 어떤 일이 줄고 어떤 일이 새로 생길 수 있습니다. 예를 들어 내비게이션 앱이 운전 경로를 대신 찾아 주는 것처럼, AI도 단순한 업무를 대신 처리해 줍니다. 그래서 사람들은 reskilling, 즉 새로운 기술을 다시 배우며 변화에 대비해야 합니다. 또한 AI ethics처럼 AI를 책임 있게 사용하는 규칙과 직업도 중요해집니다.\u003c/div>","segs":[{"n":2,"text":"AI는 사람처럼 학습하고 판단하는 기술이에요. 공장이나 사무실에서 반복되는 일을 기계가 대신하는 것을 automation, 즉 자동화라고 하죠. 자동화가 확산되면 job market, 다시 말해 고용 시장에서 어떤 일은 줄고 어떤 일은 새로 생길 수 있어요. 예를 들어 내비게이션 앱이 운전 경로를 대신 찾아 주는 것처럼, AI도 단순한 업무를 대신 처리해 줍니다. 그래서 사람들은 reskilling, 즉 새로운 기술을 다시 배우며 변화에 대비해야 해요. AI ethics 같은 개념도 중요해지는데, AI를 책임 있게 쓰는 규칙이 필요하기 때문입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>변화의 시작\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>글은 AI가 \u003cb class=\"key\">고용 \u003c/b>\u003cb class=\"key\">시장\u003c/b>을 빠르게 바꾸고 있다고 시작해요. 일부 전문가들은 AI가 많은 \u003cb class=\"key\">단순 \u003c/b>\u003cb class=\"key\">업무\u003c/b>를 자동화해 특정 산업에서 \u003cb class=\"key\">일자리 \u003c/b>\u003cb class=\"key\">감소\u003c/b>를 초래할 것이라고 예측하죠. 이 도입부는 앞으로 이어질 논의의 출발점을 제시합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>두 전망과 중심 주장\u003csmall>전환 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>하지만 다른 전문가들은 AI가 \u003cb class=\"key\">일자리 \u003c/b>\u003cb class=\"key\">기회\u003c/b>를 창출할 것이라고 믿어요. 진실은 아마도 두 주장 사이에 있지만, 글은 AI가 \u003cb class=\"key\">업무의 \u003c/b>\u003cb class=\"key\">본질\u003c/b>을 바꾸고 있다는 점을 분명히 합니다. 이 부분이 글의 중심 주장으로, 단순한 찬반을 넘어 변화에 주목하게 해요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>적응과 새 직업\u003csmall>근거·예시 · 문장 6–10\u003c/small>\u003c/h4>\u003cp>다양한 산업의 근로자는 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">기술\u003c/b>에 적응하고 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">기량\u003c/b>을 습득해야 합니다. 고객 서비스에서 AI를 쓰는 경우에는 \u003cb class=\"key\">대인 \u003c/b>\u003cb class=\"key\">관계 \u003c/b>\u003cb class=\"key\">기술\u003c/b>을 향상하고 인간 중심 기술에 익숙해져야 하죠. 또한 AI 윤리 책임자처럼 \u003cb class=\"key\">직업 \u003c/b>\u003cb class=\"key\">범주\u003c/b>가 새로 생길 수 있으며, 이들은 AI가 책임감 있고 윤리적으로 사용되도록 합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>결론\u003csmall>결론 · 문장 11\u003c/small>\u003c/h4>\u003cp>마지막으로 AI가 계속 \u003cb class=\"key\">고용 \u003c/b>\u003cb class=\"key\">시장\u003c/b>에 영향을 미침에 따라 근로자와 조직이 \u003cb class=\"key\">변화\u003c/b>에 적응해야 한다고 정리합니다. 이는 앞에서 제시된 예시와 중심 주장을 하나로 묶는 결론이에요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 차례대로 짚어 볼게요.","hl":null},{"n":4,"text":"먼저 글은 AI가 고용 시장을 빠르게 바꾸고 있다고 시작해요. 일부 전문가들은 AI가 많은 단순 업무를 자동화해서 특정 산업에서 일자리 감소를 초래할 것이라고 예측하죠. 이 부분은 앞으로 이어질 논의의 출발점이에요.","hl":"f0"},{"n":5,"text":"그다음에는 다른 전문가들이 AI가 일자리 기회를 창출할 것이라고 말해요. 진실은 아마도 두 주장 사이에 있지만, 글은 AI가 업무의 본질을 바꾸고 있다는 점을 분명히 하죠. 여기서 단순한 찬반을 넘어 변화 자체에 주목하게 됩니다.","hl":"f1"},{"n":6,"text":"이어서 다양한 산업의 근로자가 새로운 기술에 적응하고 새로운 기량을 습득해야 한다고 설명해요. 고객 서비스에서 AI를 쓰는 경우에는 대인 관계 기술을 향상하고 인간 중심 기술에 익숙해져야 하죠. 또한 AI 윤리 책임자처럼 직업 범주가 새로 생길 수 있고, 이들은 AI가 책임감 있고 윤리적으로 사용되도록 합니다.","hl":"f2"},{"n":7,"text":"마지막으로 AI가 계속 고용 시장에 영향을 미치기 때문에 근로자와 조직이 변화에 적응해야 한다고 정리해요. 앞에서 나온 예시와 중심 주장을 하나로 묶는 결론이죠.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">비교·대조\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 5번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 먼저 AI가 \u003cb class=\"key\">일자리 \u003c/b>\u003cb class=\"key\">감소\u003c/b>를 초래한다는 전망을 제시하고, 이어서 \u003cb class=\"key\">일자리 \u003c/b>\u003cb class=\"key\">기회\u003c/b>를 창출한다는 반대 전망을 보여 줍니다. 두 전망을 나열한 뒤 다섯 번째 문장에서 But을 사용해 AI가 \u003cb class=\"key\">업무의 \u003c/b>\u003cb class=\"key\">본질\u003c/b>을 바꾼다는 중심 주장을 꺼내죠. 이후 구체적 예시와 새 직업 범주를 근거로 제시하고 마지막 문장에서 적응을 강조하므로, 중심 주장이 글 중간에 놓인 중괄식 구조로 볼 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>However (3)\u003c/b>\u003cspan>앞 전망에 대한 반대 전망 제시\u003c/span>\u003cb>But (5)\u003c/b>\u003cspan>중심 주장으로 전환\u003c/span>\u003cb>For example (7)\u003c/b>\u003cspan>구체적 예시 제시\u003c/span>\u003cb>In addition (9)\u003c/b>\u003cspan>추가 근거 제시\u003c/span>\u003cb>As (11)\u003c/b>\u003cspan>결론·조건 제시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">changing the job market\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">create new job opportunities\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">changing the nature of work\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">adapt to new technologies\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">development of new job categories\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">have an impact on the job market\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">adapt to the changes\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>일자리 감소 전망\u003c/th>\u003cth>새 기회 창출 전망\u003c/th>\u003c/tr>\u003ctr>\u003ctd>단순 업무 자동화로 일자리 감소\u003c/td>\u003ctd>새로운 일자리 기회 창출\u003c/td>\u003c/tr>\u003ctr>\u003ctd>특정 산업에 타격\u003c/td>\u003ctd>AI 윤리 책임자 등 새 직업 등장\u003c/td>\u003c/tr>\u003ctr>\u003ctd>변화에 대한 우려\u003c/td>\u003ctd>적응과 새 기량 습득 강조\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 두 관점을 나란히 보여 주는 비교와 대조의 전개 방식을 사용해요. 먼저 일자리 감소 전망을 제시하고, 이어서 일자리 기회 창출 전망을 보여 주죠. 그러고 나서 다섯 번째 문장에서 But을 사용해 AI가 업무의 본질을 바꾼다는 중심 주장을 꺼냅니다. 중심 주장이 글 중간에 있으므로 중괄식 구조라고 볼 수 있어요.","hl":"ty"},{"n":9,"text":"신호어를 보면 글의 뼈대가 더 선명해져요. 세 번째 문장의 However는 앞의 전망에 대해 반대 전망을 제시하는 신호이고, 다섯 번째 문장의 But은 중심 주장으로 전환하는 신호예요. 일곱 번째 문장의 For example은 구체적인 예시를, 아홉 번째 문장의 In addition은 추가 근거를 알려 줍니다. 마지막 문장의 As는 조건과 결론을 연결해 주는 표현이에요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>artificial intelligence\u003c/b>\u003cem>명사\u003c/em>\u003cspan>인공지능\u003c/span>\u003c/div>\u003cdiv>\u003cb>rapidly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>빠르게\u003c/span>\u003c/div>\u003cdiv>\u003cb>job market\u003c/b>\u003cem>명사\u003c/em>\u003cspan>고용 시장\u003c/span>\u003c/div>\u003cdiv>\u003cb>expert\u003c/b>\u003cem>명사\u003c/em>\u003cspan>전문가\u003c/span>\u003c/div>\u003cdiv>\u003cb>predict\u003c/b>\u003cem>동사\u003c/em>\u003cspan>예측하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>lead to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 이어지다, 초래하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>job loss\u003c/b>\u003cem>명사\u003c/em>\u003cspan>일자리 감소\u003c/span>\u003c/div>\u003cdiv>\u003cb>industry\u003c/b>\u003cem>명사\u003c/em>\u003cspan>산업\u003c/span>\u003c/div>\u003cdiv>\u003cb>automate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>자동화하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>simple task\u003c/b>\u003cem>명사\u003c/em>\u003cspan>단순 업무\u003c/span>\u003c/div>\u003cdiv>\u003cb>create\u003c/b>\u003cem>동사\u003c/em>\u003cspan>창출하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>opportunity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기회\u003c/span>\u003c/div>\u003cdiv>\u003cb>truth\u003c/b>\u003cem>명사\u003c/em>\u003cspan>진실\u003c/span>\u003c/div>\u003cdiv>\u003cb>likely\u003c/b>\u003cem>부사\u003c/em>\u003cspan>아마도\u003c/span>\u003c/div>\u003cdiv>\u003cb>in between\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>그 사이에\u003c/span>\u003c/div>\u003cdiv>\u003cb>nature\u003c/b>\u003cem>명사\u003c/em>\u003cspan>본질\u003c/span>\u003c/div>\u003cdiv>\u003cb>adapt to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 적응하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>acquire\u003c/b>\u003cem>동사\u003c/em>\u003cspan>습득하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>skill\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기술, 기량\u003c/span>\u003c/div>\u003cdiv>\u003cb>customer service\u003c/b>\u003cem>명사\u003c/em>\u003cspan>고객 서비스\u003c/span>\u003c/div>\u003cdiv>\u003cb>require\u003c/b>\u003cem>동사\u003c/em>\u003cspan>요구하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>improve\u003c/b>\u003cem>동사\u003c/em>\u003cspan>향상시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>interpersonal\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>대인 관계의\u003c/span>\u003c/div>\u003cdiv>\u003cb>human-centered\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>인간 중심의\u003c/span>\u003c/div>\u003cdiv>\u003cb>development\u003c/b>\u003cem>명사\u003c/em>\u003cspan>개발\u003c/span>\u003c/div>\u003cdiv>\u003cb>job category\u003c/b>\u003cem>명사\u003c/em>\u003cspan>직업 범주\u003c/span>\u003c/div>\u003cdiv>\u003cb>ethics officer\u003c/b>\u003cem>명사\u003c/em>\u003cspan>윤리 책임자\u003c/span>\u003c/div>\u003cdiv>\u003cb>responsible\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>책임감 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>ethical\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>윤리적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>impact\u003c/b>\u003cem>명사\u003c/em>\u003cspan>영향\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어부터 짚어 볼게요. lead to는 어떤 결과로 이어진다는 뜻이고, automate는 자동화하다, acquire는 습득하다라는 의미예요. adapt to는 적응하다, responsible은 책임감 있는, ethical은 윤리적인이라는 뜻으로 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">rapidly\u003c/b>\u003cspan class=\"m\">빠르게\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">quickly\u003c/span>\u003cspan class=\"s\">swiftly\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">slowly\u003c/span>\u003cspan class=\"a\">gradually\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">predict\u003c/b>\u003cspan class=\"m\">예측하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">forecast\u003c/span>\u003cspan class=\"s\">anticipate\u003c/span>\u003cspan class=\"s\">foresee\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">create\u003c/b>\u003cspan class=\"m\">창출하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">produce\u003c/span>\u003cspan class=\"s\">generate\u003c/span>\u003cspan class=\"s\">make\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">destroy\u003c/span>\u003cspan class=\"a\">eliminate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">opportunity\u003c/b>\u003cspan class=\"m\">기회\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">chance\u003c/span>\u003cspan class=\"s\">opening\u003c/span>\u003cspan class=\"s\">possibility\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">adapt to\u003c/b>\u003cspan class=\"m\">~에 적응하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">adjust to\u003c/span>\u003cspan class=\"s\">acclimate to\u003c/span>\u003cspan class=\"s\">get used to\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">resist\u003c/span>\u003cspan class=\"a\">reject\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">acquire\u003c/b>\u003cspan class=\"m\">습득하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">obtain\u003c/span>\u003cspan class=\"s\">gain\u003c/span>\u003cspan class=\"s\">attain\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">lose\u003c/span>\u003cspan class=\"a\">forfeit\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">improve\u003c/b>\u003cspan class=\"m\">향상시키다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">enhance\u003c/span>\u003cspan class=\"s\">better\u003c/span>\u003cspan class=\"s\">upgrade\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">worsen\u003c/span>\u003cspan class=\"a\">deteriorate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">ethical\u003c/b>\u003cspan class=\"m\">윤리적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">moral\u003c/span>\u003cspan class=\"s\">principled\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unethical\u003c/span>\u003cspan class=\"a\">immoral\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 함께 정리해 볼게요. rapidly는 quickly나 swiftly와 가깝고 반대말은 slowly예요. predict는 forecast나 anticipate로 바꿔 쓸 수 있어요. create는 produce나 generate, opportunity는 chance나 opening과 연결되고, adapt to는 adjust to나 acclimate to와 비슷하죠. acquire는 obtain이나 gain, improve는 enhance나 better로 기억하면 좋아요. ethical은 moral이나 principled와 가깝고 반대말은 unethical이에요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인공지능(AI)은\u003c/span>\u003cspan class=\"en\">Artificial intelligence (AI)\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">빠르게 변화시키고 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">rapidly \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">changing \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고용 시장을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">job \u003c/span>\u003cspan class=\"tgt\">market\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">인공지능(AI)이 고용 시장을 빠르게 변화시키고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글 전체의 \u003cb class=\"key\">주제\u003c/b>를 처음 던지는 문장으로, AI가 지금 고용 시장을 바꾸고 있다는 큰 흐름을 제시해요. 변화가 이미 진행 중이라는 점을 \u003cb class=\"key\">현재진행형\u003c/b>으로 강조해, 뒤에 이어질 찬반 논의의 출발점을 만들어 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재진행형(be + -ing)\u003c/span> : [[주어]] + is + [부사] + [동사-ing] : \"빠르게 변화시키고 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">3형식(타동사 + 목적어)\u003c/span> : change + [목적어] : \"고용 시장을 변화시키다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Artificial intelligence (AI), 인공지능(AI)은. is rapidly changing, 빠르게 변화시키고 있다. the job market, 고용 시장을. 이 문장 전체를 해석하면, 인공지능(AI)이 고용 시장을 빠르게 변화시키고 있다.","hl":"m"},{"n":13,"text":"이 문장은 글의 첫 문장으로, 인공지능이 고용 시장을 빠르게 바꾸고 있다는 주제를 던지고 있어요. 변화가 이미 벌어지고 있다는 점을 현재진행형으로 살짝 눌러 주고 있죠.","hl":"mn"},{"n":14,"text":"첫 번째 어법 포인트는 is rapidly changing이에요. be동사에 동사원형에 ing를 붙인 현재진행형이 와서 지금 진행 중인 변화를 나타냅니다. 두 번째는 changing the job market인데, change가 타동사로 쓰여서 뒤에 목적어 the job market을 데리고 오는 삼 형식 구조예요. 그래서 고용 시장을, 하고 목적어 해석이 붙는 겁니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일부 전문가들은 예측한다\u003c/span>\u003cspan class=\"en\">Some experts \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">predict \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">AI가 일자리 감소를 초래할 것이라고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">AI \u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">lead \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">job \u003c/span>\u003cspan class=\"tgt\">loss\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">특정 산업에서\u003c/span>\u003cspan class=\"en\">in certain industries\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 단순 업무를 자동화함으로써\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">automating \u003c/span>\u003cspan class=\"tgt\">many \u003c/span>\u003cspan class=\"tgt\">simple \u003c/span>\u003cspan class=\"tgt\">tasks\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">일부 전문가들은 AI가 많은 단순 업무를 자동화함으로써 특정 산업의 일자리 감소를 초래할 것이라 예측한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> AI를 위협으로 보는 첫 번째 입장을 소개하는 문장이에요. 핵심은 by automating, 즉 \u003cb class=\"key\">자동화\u003c/b>라는 수단이 특정 산업의 \u003cb class=\"key\">일자리 \u003c/b>\u003cb class=\"key\">감소\u003c/b>를 만든다는 인과 구조죠. 바로 다음 문장의 반대 주장과 \u003cb class=\"key\">대조\u003c/b>를 이루도록 근거를 깔아 주는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 명사절(목적어)\u003c/span> : predict + [that + 주어 + 동사 ~] : \"AI가 일자리 감소를 초래할 것이라고 예측한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">자동사 lead + 전치사 to\u003c/span> : lead to + [명사] : \"일자리 감소를 초래하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 by + 동명사(수단)\u003c/span> : by + [동사-ing] + 목적어 : \"많은 단순 업무를 자동화함으로써\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Some experts predict, 일부 전문가들은 예측한다. that AI will lead to job loss, AI가 일자리 감소를 초래할 것이라고. in certain industries, 특정 산업에서. by automating many simple tasks, 많은 단순 업무를 자동화함으로써. 이 문장 전체를 해석하면, 일부 전문가들은 AI가 많은 단순 업무를 자동화함으로써 특정 산업의 일자리 감소를 초래할 것이라 예측한다.","hl":"m"},{"n":16,"text":"이 문장은 AI를 위협으로 보는 첫 번째 입장을 소개하고 있어요. 관건은 by automating, 즉 자동화라는 수단이 일자리 감소를 만든다는 인과 구조라는 점이죠. 바로 뒤에 나올 반대 주장과 대조를 이루도록 근거를 깔아 주는 문장입니다.","hl":"mn"},{"n":17,"text":"첫 번째는 predict that AI will lead to job loss예요. predict 뒤에 접속사 that이 명사절을 이끌어서 목적어 역할을 하고 있죠. 두 번째는 lead to job loss인데, lead가 전치사 to와 묶여서 초래하다라는 뜻을 만들고 뒤에 명사가 오는 구조예요. 세 번째는 by automating many simple tasks로, 전치사 by 뒤에 동명사 automating이 와서 수단을 나타냅니다. 전치사 뒤에는 명사 역할이 와야 하니까 동명사를 쓴 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">However,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 전문가들은 믿는다\u003c/span>\u003cspan class=\"en\">other experts \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">believe \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">AI가 창출할 것이라고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">AI \u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">create \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새로운 일자리 기회를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">new \u003c/span>\u003cspan class=\"tgt\">job \u003c/span>\u003cspan class=\"tgt\">opportunities\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만, 다른 전문가들은 AI가 새로운 일자리 기회를 창출할 것이라고 믿는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장과 정반대되는 입장을 However로 \u003cb class=\"key\">전환\u003c/b>해서 보여주는 문장이에요. AI를 위협이 아니라 \u003cb class=\"key\">기회\u003c/b>로 보는 시각이 있다는 점을 분명히 밝혀 두죠. 이렇게 두 주장을 나란히 놓아 두었기 때문에 다음 문장에서 절충하는 흐름이 자연스럽게 시작됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속부사(전환)\u003c/span> : [접속부사] + 주어 + 동사 : \"하지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 명사절(목적어)\u003c/span> : believe + [that + 주어 + 동사 ~] : \"AI가 새로운 일자리 기회를 창출할 것이라고 믿는다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"However, 하지만. other experts believe, 다른 전문가들은 믿는다. that AI will create, AI가 창출할 것이라고. new job opportunities, 새로운 일자리 기회를. 이 문장 전체를 해석하면, 하지만, 다른 전문가들은 AI가 새로운 일자리 기회를 창출할 것이라고 믿는다.","hl":"m"},{"n":19,"text":"앞 문장과 정반대되는 입장을 However로 전환해서 보여주는 문장이에요. AI를 위협이 아니라 기회로 보는 시각이 있다는 점을 분명히 해 두죠. 두 주장이 나란히 놓였으니, 다음 문장에서 절충하는 흐름이 자연스럽게 시작됩니다.","hl":"mn"},{"n":20,"text":"첫 번째는 문장 앞에 온 However예요. 앞 내용과 반대 방향으로 전환할 때 쓰는 접속부사죠. 두 번째는 believe that AI will create new job opportunities인데, believe 뒤에 접속사 that이 이끄는 명사절이 목적어로 왔어요. think나 believe 같은 동사는 이렇게 that절을 목적어로 자주 데려간다는 점을 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">진실은\u003c/span>\u003cspan class=\"en\">The truth\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아마도 놓여 있을 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">likely\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">lies\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 사이 어딘가에\u003c/span>\u003cspan class=\"en\">somewhere in between.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">진실은 아마도 그 사이 어딘가에 있을 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> AI가 일자리를 없앤다는 주장과 새 일자리를 만든다는 주장 사이에서, 실제 \u003cb class=\"key\">진실\u003c/b>은 어느 한쪽 극단이 아니라 \u003cb class=\"key\">중간\u003c/b>쯤에 있다는 뜻이에요. 앞의 두 상반된 예측을 한데 묶어 균형을 잡아 주고, 바로 뒤에서 '업무의 본질이 변한다'는 분명한 사실로 초점을 좁히는 발판이 되는 문장이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부사(동사 수식)\u003c/span> : [[주어 The truth]] + [부사 likely] + [동사 lies] : \"아마도 ~일 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">자동사 lie(놓여 있다)의 3인칭 단수\u003c/span> : [주어 The truth] + [동사 lies] + [부사구 somewhere in between] : \"놓여 있다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"The truth, 진실은. likely lies, 아마도 놓여 있을 것이다. somewhere in between, 그 사이 어딘가에. 이 문장 전체를 해석하면, 진실은 아마도 그 사이 어딘가에 있을 것이다.","hl":"m"},{"n":22,"text":"이 문장은 앞에서 나온 두 가지 상반된 예측을 정리해 주는 역할을 해요. AI 때문에 일자리가 줄 거라는 쪽과 늘어날 거라는 쪽, 그 사이에서 실제 진실은 어느 한쪽 극단이 아니라 중간쯤에 있다는 거죠. 그래서 다음 문장에서 업무의 본질이 변한다는 분명한 사실로 초점을 좁혀 갈 수 있습니다.","hl":"mn"},{"n":23,"text":"어법 포인트는 두 가지예요. 첫째, likely는 동사 lies를 꾸며 주는 부사로 쓰였어요. '아마도'라는 추측의 느낌을 더해 주는 거죠. 둘째, lies는 '놓여 있다'라는 뜻의 자동사라서 목적어가 필요 없어요. '~을 놓다'라는 타동사 lay와 헷갈리지 않게 꼭 구분해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만\u003c/span>\u003cspan class=\"en\">But\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~은 분명하다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">clear \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">AI가 바꾸고 있다는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> AI \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">changing\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">업무의 본질을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">nature \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">work\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 AI가 업무의 본질을 바꾸고 있다는 것은 분명하다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 두 전문가의 예측이 엇갈렸지만, 그와 별개로 AI가 일하는 방식 자체를 흔들고 있다는 점만큼은 누구도 부인할 수 없다는 뜻이에요. 그래서 이 문장은 '무엇이 \u003cb class=\"key\">분명\u003c/b>한가'로 논점을 정리하며, 다음 문장의 근로자 행동 요령으로 자연스럽게 넘어가는 \u003cb class=\"key\">전환\u003c/b> 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가주어 it / 진주어 that절\u003c/span> : It is + [형용사 clear] + that + [주어 + 동사 ~] : \"~라는 것은 분명하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재진행형\u003c/span> : be동사 + [[동사원형-ing]] : \"바꾸고 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사구(of work)의 형용사적 수식\u003c/span> : [the nature] + [of + 명사 work] : \"업무의 본질\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"But, 하지만. it is clear, ~은 분명하다. that AI is changing, AI가 바꾸고 있다는 것은. the nature of work, 업무의 본질을. 이 문장 전체를 해석하면, 하지만 AI가 업무의 본질을 바꾸고 있다는 것은 분명하다.","hl":"m"},{"n":25,"text":"이 문장은 앞에서 두 전문가의 예측이 엇갈렸지만, 그와 별개로 AI가 일하는 방식 자체를 흔들고 있다는 점은 분명하다고 말하고 있어요. 여기서 무엇이 분명한지를 짚어 주면서 논점을 한곳으로 모으는 거죠. 그리고 다음 문장에서 근로자가 무엇을 해야 하는지로 자연스럽게 전환됩니다.","hl":"mn"},{"n":26,"text":"어법 포인트를 짚어 볼게요. 먼저 it is clear that에서 진짜 주어는 뒤에 있는 that절인데 너무 길어서 뒤로 보내고, 빈자리에 가주어 it을 세운 구조예요. 해석할 때 it은 '그것은'으로 옮기지 않는 게 자연스럽죠. 다음으로 is changing은 지금 계속되고 있는 변화를 나타내는 현재진행형이에요. 마지막으로 the nature of work에서 of work는 앞의 nature를 뒤에서 꾸며 주는 전치사구예요. '업무의 본질'이라고 묶어서 읽어 주세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다양한 산업의 근로자들은\u003c/span>\u003cspan class=\"en\">Workers \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">various \u003c/span>\u003cspan class=\"tgt\">industries\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~할 필요가 있을 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">need\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새로운 기술에 적응하는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">adapt \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">new \u003c/span>\u003cspan class=\"tgt\">technologies \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 새로운 기량을 습득하는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">acquire \u003c/span>\u003cspan class=\"tgt\">new \u003c/span>\u003cspan class=\"tgt\">skills\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">다양한 산업에 종사하는 근로자들은 새로운 기술에 적응하고 새로운 기량을 습득해야 할 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> AI가 일자리를 없애기만 하는 것이 아니라 업무의 방식 자체를 바꾸기 때문에, 근로자가 스스로 \u003cb class=\"key\">적응\u003c/b>하고 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">능력\u003c/b>을 갖춰야 한다는 결론으로 이어지는 문장이에요. 앞 문장의 '업무의 본질 변화'를 구체적인 \u003cb class=\"key\">행동\u003c/b>으로 옮긴 부분이고, 바로 뒤에 고객 서비스 사례가 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 용법\u003c/span> : [명사 Workers] + [전치사구 in various industries] : \"다양한 산업에 종사하는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 will + 동사원형\u003c/span> : [조동사 will] + [동사원형 need] : \"~해야 할 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법 + 병렬\u003c/span> : need + [to adapt to A] + and + [(to) acquire B] : \"새로운 기술에 적응하고 새로운 기량을 습득하는 것\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Workers in various industries, 다양한 산업의 근로자들은. will need, ~할 필요가 있을 것이다. to adapt to new technologies, 새로운 기술에 적응하는 것을. and acquire new skills, 그리고 새로운 기량을 습득하는 것을. 이 문장 전체를 해석하면, 다양한 산업에 종사하는 근로자들은 새로운 기술에 적응하고 새로운 기량을 습득해야 할 것이다.","hl":"m"},{"n":28,"text":"이 문장은 앞에서 말한 업무의 본질 변화가 근로자에게 어떤 행동을 요구하는지 알려 줘요. AI가 일자리를 없애기만 하는 게 아니라 일하는 방식 자체를 바꾸기 때문에, 근로자는 스스로 적응해야 하고 새로운 능력도 갖춰야 한다는 거죠. 그래서 다음 문장에서는 고객 서비스처럼 구체적인 예를 들어 설명하게 됩니다.","hl":"mn"},{"n":29,"text":"어법 포인트는 세 가지예요. 첫째, in various industries는 앞의 명사 Workers를 뒤에서 꾸며 주는 형용사구 역할을 해요. 둘째, will need에서 will 뒤에는 항상 동사원형이 온다는 점을 기억하세요. 셋째, to adapt to new technologies and acquire new skills는 need의 목적어로 쓰인 to부정사인데, and 뒤에서는 반복을 피하려고 to를 생략했어요. 두 동작이 병렬로 나란히 연결된 구조랍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들어,\u003c/span>\u003cspan class=\"en\">For example,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고객 서비스에서 AI를 사용하는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">use \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">AI\u003c/span> in customer service\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">근로자들에게 요구한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">requires \u003c/span>\u003cspan class=\"tgt\">workers \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 대인 관계 기술을 향상시키는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">improve\u003c/span> their interpersonal skills.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">예를 들어, 고객 서비스에서 AI를 사용하는 것은 근로자들에게 그들의 대인 관계 기술을 향상시키는 것을 요구한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 AI가 일자리에 영향을 준다고 말한 뒤, 여기서는 그 구체적인 \u003cb class=\"key\">예시\u003c/b>를 드는 문장이에요. 고객 서비스에 AI가 들어오면 단순 업무는 줄어도 사람은 오히려 \u003cb class=\"key\">대인 \u003c/b>\u003cb class=\"key\">관계 \u003c/b>\u003cb class=\"key\">기술\u003c/b>이 더 중요해지죠. 그래서 AI 시대에는 근로자에게 새로운 기술 습득을 \u003cb class=\"key\">요구\u003c/b>한다는 흐름을 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동작명사 use + of 전치사구\u003c/span> : the use of [목적어] = [목적어]를 사용함 : \"AI를 사용하는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">목적격보어로 쓰인 to부정사\u003c/span> : require + [목적어(workers)] + [to improve (to부정사구/목적격보어)] : \"근로자들이 향상시키도록 요구한다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"For example, 예를 들어. the use of AI in customer service, 고객 서비스에서 AI를 사용하는 것은. requires workers, 근로자들에게 요구한다. to improve their interpersonal skills, 그들의 대인 관계 기술을 향상시키는 것을. 이 문장 전체를 해석하면, 예를 들어, 고객 서비스에서 AI를 사용하는 것은 근로자들에게 그들의 대인 관계 기술을 향상시키는 것을 요구한다.","hl":"m"},{"n":31,"text":"이 문장은 앞에서 AI가 일자리에 영향을 준다고 말한 뒤에 구체적인 예시를 드는 역할을 해요. 고객 서비스에 AI가 들어오면 단순한 일은 줄어도 사람은 오히려 대인 관계 기술이 더 중요해진다는 거죠. 그래서 근로자에게 새로운 기술 습득을 요구한다는 흐름으로 읽으면 됩니다.","hl":"mn"},{"n":32,"text":"첫 번째 포인트는 the use of AI인데요, 동사 use가 명사 자리로 오면 사용이라는 동작명사가 되고 of 뒤에 대상이 붙어서 AI를 사용함이라는 명사구를 만들어요. 두 번째는 requires workers to improve인데, require는 목적어 뒤에 to부정사를 목적격보어로 데리고 오는 동사예요. 그래서 to improve는 향상시키기 위해가 아니라 향상시키는 것을으로 해석해야 하고, 이 to improve가 목적격보어라는 점이 핵심이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 또한 필요로 한다\u003c/span>\u003cspan class=\"en\">They also \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">need \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">익숙해지고 편안해지는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">familiar \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">comfortable\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인간 중심적인 기술에\u003c/span>\u003cspan class=\"en\">with human-centered technology.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 또한 인간 중심적인 기술에 익숙해지고 편안해질 필요가 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에 이어 근로자가 갖춰야 할 자세를 덧붙이는 문장이에요. 인간 중심의 기술에 \u003cb class=\"key\">익숙\u003c/b>해지고 \u003cb class=\"key\">편안\u003c/b>해져야 한다는, 태도와 적응의 문제를 말하죠. 기술을 배우는 것뿐 아니라 기술과 편하게 함께 일하는 \u003cb class=\"key\">적응력\u003c/b>이 필요하다는 뜻입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">일반동사 need + to부정사(목적어)\u003c/span> : need + [to부정사(목적어)] = ~할 필요가 있다 : \"~할 필요가 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">형용사의 병렬 구조(and)\u003c/span> : [형용사] and [형용사] + 공통 전치사 with : \"익숙하고 편안한\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"They also need, 그들은 또한 필요로 한다. to be familiar and comfortable, 익숙해지고 편안해지는 것을. with human-centered technology, 인간 중심적인 기술에. 이 문장 전체를 해석하면, 그들은 또한 인간 중심적인 기술에 익숙해지고 편안해질 필요가 있다.","hl":"m"},{"n":34,"text":"앞 문장에 이어서 근로자가 갖춰야 할 자세를 덧붙이는 문장이에요. 인간 중심의 기술에 익숙해지고 편안해져야 한다는, 태도와 적응의 문제를 말하고 있죠. 기술을 배우는 것뿐 아니라 기술과 편하게 함께 일하는 적응력이 필요하다는 뜻이에요.","hl":"mn"},{"n":35,"text":"첫 번째는 need to be인데요, 여기서 need는 조동사가 아니라 일반동사라서 뒤에 to부정사를 목적어로 데리고 와요. 그래서 익숙해지고 편안해지는 것을 필요로 한다, 즉 그럴 필요가 있다로 해석합니다. 두 번째는 familiar and comfortable인데, 두 형용사가 and로 병렬로 연결되면서 뒤에 오는 with를 함께 받아요. 그래서 기술에 익숙하고 기술에 편안한, 이렇게 해석해야 자연스럽습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">게다가,\u003c/span>\u003cspan class=\"en\">In addition,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">AI는 아마 ~로 이어질 것이다\u003c/span>\u003cspan class=\"en\">AI \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">likely \u003c/span>\u003cspan class=\"tgt\">lead \u003c/span>\u003cspan class=\"tgt\">to\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새로운 직업 범주의 발전으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">development \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">new \u003c/span>\u003cspan class=\"tgt\">job \u003c/span>\u003cspan class=\"tgt\">categories\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">AI 윤리 책임자와 같은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">such \u003c/span>\u003cspan class=\"tgt\">as 나온 new job categories의 구체적 예를 들어 주는 표현이에요. 그래서 AI 윤리 책임자와 같은으로 해석하면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 임무는\u003c/span>\u003cspan class=\"en\">Their job\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~일 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">be\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">확실히 하는 것\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">sure\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">AI 시스템이 사용되도록\u003c/span>\u003cspan class=\"en\">that AI systems \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">used\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">책임감 있고 윤리적인 방식으로\u003c/span>\u003cspan class=\"en\">in a \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">responsible \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">ethical\u003c/span> manner.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들의 임무는 AI 시스템이 책임감 있고 윤리적인 방식으로 사용되도록 하는 것일 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> AI 윤리 책임자 같은 새 직군이 실제로 어떤 일을 하는지 구체적으로 밝히는 문장이다. make sure that은 '반드시 ~하도록 \u003cb class=\"key\">보장하다\u003c/b>'라는 뜻으로, AI 활용에 \u003cb class=\"key\">책임\u003c/b>과 \u003cb class=\"key\">윤리\u003c/b>가 필요하다는 점을 강조한다. would는 단정 대신 \u003cb class=\"key\">추측\u003c/b>의 어조를 담아 역할을 부드럽게 서술한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 would (추측)\u003c/span> : [주어] + would + [동사원형/명사 보어] : \"~일 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법 (주격 보어)\u003c/span> : [주어] + be동사 + [to부정사구(주격 보어)] : \"확실히 하는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : [that] + [주어] + be동사 + [과거분사] : \"사용된다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">형용사 병렬 구조\u003c/span> : [형용사 A] + and + [형용사 B] + [명사] : \"책임감 있고 윤리적인\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"Their job, 그들의 임무는. would be, ~일 것이다. to make sure, 확실히 하는 것. that AI systems are used, AI 시스템이 사용되도록. in a responsible and ethical manner, 책임감 있고 윤리적인 방식으로. 이 문장 전체를 해석하면, 그들의 임무는 AI 시스템이 책임감 있고 윤리적인 방식으로 사용되도록 하는 것일 것이다.","hl":"m"},{"n":40,"text":"이 문장은 AI 윤리 책임자 같은 새 직업이 실제로 무슨 일을 하는지 알려 줍니다. 핵심은 make sure, 그러니까 반드시 보장한다는 표현이에요. AI가 책임 있고 윤리적인 방식으로 쓰이도록 살피는 역할이라는 점을 꼭 기억하세요.","hl":"mn"},{"n":41,"text":"첫 번째로 would be는 단정하지 않고 추측하는 조동사 would예요. 두 번째로 to make sure는 주어 Their job의 내용을 채워 주는 to부정사의 명사적 용법, 주격 보어 자리입니다. 세 번째로 are used는 AI 시스템이 사용되는 쪽이니까 수동태로 쓴 거예요. 네 번째로 responsible and ethical은 두 형용사를 and로 나란히 연결한 병렬 구조입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">AI가 계속됨에 따라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">As \u003c/span>\u003cspan class=\"tgt\">AI \u003c/span>\u003cspan class=\"tgt\">continues\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고용 시장에 영향을 미치게 되면서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">impact \u003c/span>\u003cspan class=\"tgt\">on\u003c/span> the job market,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 필요하다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">necessary\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">근로자와 조직이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">workers \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">organizations \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">변화에 적응하는 것이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">adapt\u003c/span> to the changes.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">AI가 계속해서 고용 시장에 영향을 미침에 따라, 근로자와 조직이 변화에 적응하는 것이 필요하다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> AI가 고용 시장에 \u003cb class=\"key\">영향\u003c/b>을 주는 상황에서 근로자와 조직 모두 \u003cb class=\"key\">적응\u003c/b>이 필요하다는 글의 결론이다. 가주어 it과 진주어 to부정사로 '~하는 것이 필요하다'를 표현했고, adapt to는 이 글의 핵심 어구인 '\u003cb class=\"key\">적응하다\u003c/b>'이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 As (~함에 따라)\u003c/span> : [As + 주어 + 동사], [주절] : \"AI가 계속됨에 따라\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법 (목적어)\u003c/span> : continue + [to부정사구(목적어)] : \"영향을 미치는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">가주어 it / 진주어 to부정사\u003c/span> : It is + [형용사] + for + [의미상 주어] + to부정사 : \"~하는 것이 필요하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">to부정사의 의미상 주어 (for + 목적격)\u003c/span> : for + [목적격] + to부정사 : \"근로자와 조직이 적응하는 것\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"As AI continues, AI가 계속됨에 따라. to have an impact on the job market, 고용 시장에 영향을 미치게 되면서. it is necessary, 그것은 필요하다. for workers and organizations, 근로자와 조직이. to adapt to the changes, 변화에 적응하는 것이. 이 문장 전체를 해석하면, AI가 계속해서 고용 시장에 영향을 미침에 따라, 근로자와 조직이 변화에 적응하는 것이 필요하다.","hl":"m"},{"n":43,"text":"이 문장은 글 전체를 맺는 결론이에요. AI가 고용 시장에 영향을 주니까 근로자와 조직 모두 적응해야 한다는 메시지죠. adapt to, 즉 적응하다라는 표현이 이 글의 핵심 키워드입니다.","hl":"mn"},{"n":44,"text":"첫 번째로 As는 앞뒤 상황이 함께 간다는 접속사로, 여기서는 함에 따라로 해석해요. 두 번째로 continue to have는 continue 뒤에 to부정사가 와서 영향을 미치는 일이 계속된다는 뜻을 만듭니다. 세 번째로 it is necessary는 가주어 it을 쓴 형태이고, 진짜 주어는 뒤에 오는 to adapt to the changes예요. 네 번째로 for workers and organizations는 to부정사의 의미상 주어를 for로 이끈 표현입니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>AI가 \u003cb class=\"key\">고용 \u003c/b>\u003cb class=\"key\">시장\u003c/b>을 빠르게 변화시키며 일부 산업에서는 \u003cb class=\"key\">일자리 \u003c/b>\u003cb class=\"key\">감소\u003c/b>를 초래할 수 있다.\u003c/li>\u003cli>다른 전문가들은 AI가 \u003cb class=\"key\">일자리 \u003c/b>\u003cb class=\"key\">기회\u003c/b>를 창출할 것이라고 보지만, 진실은 두 전망 사이에 있다.\u003c/li>\u003cli>AI는 \u003cb class=\"key\">업무의 \u003c/b>\u003cb class=\"key\">본질\u003c/b>을 바꾸므로 근로자는 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">기술\u003c/b>과 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">기량\u003c/b>을 갖추어야 한다.\u003c/li>\u003cli>AI 윤리 책임자 같은 \u003cb class=\"key\">직업 \u003c/b>\u003cb class=\"key\">범주\u003c/b>가 생기며, 근로자와 조직은 변화에 \u003cb class=\"key\">적응\u003c/b>해야 한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>AI is changing the nature of work, so workers and organizations must adapt by acquiring new skills and preparing for new job categories.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">AI가 단순 업무를 자동화해 \u003cb class=\"key\">일자리 \u003c/b>\u003cb class=\"key\">감소\u003c/b>를 초래할 수 있지만 새 일자리 기회도 창출한다는 두 전망이 있다. 진실은 그 사이에 있으나 AI가 \u003cb class=\"key\">업무의 \u003c/b>\u003cb class=\"key\">본질\u003c/b>을 바꾸므로 근로자는 새로운 기술과 기량을 익혀 \u003cb class=\"key\">변화\u003c/b>에 적응해야 한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":45,"text":"오늘 글은 AI가 고용 시장과 업무의 본질을 바꾸는 상황에서 우리가 무엇을 준비해야 하는지 말해 줍니다. 일자리 감소와 새 기회라는 두 전망을 함께 보되, 결국 새로운 기술과 기량을 익히고 변화에 적응하는 태도가 중요하죠. AI 윤리 책임자처럼 새로 생기는 직업에도 관심을 가져 보세요. 오늘 수업은 여기까지입니다. 수고했어요.","hl":null}]}]});</script></body></html>
