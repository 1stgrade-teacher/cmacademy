><div class=\"lec-stage-head\">01AI가 불러온 노동 시장의 변화</div><ul><li>AI의 급격한 발전이 일자리 시장에 미치는 영향에 대해 전문가들의 의견이 갈리고 있다.</li><li>AI로 인한 단순 업무 자동화(automation)와 일자리 감소 우려</li><li>새로운 일자리 창출 가능성에 대한 기대</li><li>핵심 키워드: 인공지능(Artificial intelligence), 자동화(automation)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02업무 환경의 변화와 적응</div><ul><li>AI 기술이 일하는 방식 자체를 변화시키고 있어 근로자들의 적응이 필수적이다.</li><li>기존 산업 전반에서 새로운 기술(new technologies)에 대한 적응력 요구</li><li>기술 역량뿐만 아니라 대인 관계 기술(interpersonal skills)의 중요성 증대</li><li>인간 중심 기술(human-centered technology)에 대한 친숙함 필요</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03새로운 직업군의 등장</div><ul><li>AI의 활용 범위가 넓어짐에 따라 이전에는 없던 새로운 형태의 직업들이 생겨나고 있다.</li><li>AI 윤리 담당관(AI ethics officers)과 같은 새로운 직업군 탄생</li><li>책임감 있고 윤리적인(ethical) AI 사용을 감독하는 역할 수행</li><li>핵심 키워드: 직업군(job categories), 윤리(ethics)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04변화를 위한 대응 전략</div><ul><li>AI가 일자리에 미치는 영향이 계속될 것이므로 변화에 선제적으로 대비해야 한다.</li><li>노동자와 조직(organizations) 차원의 변화 대응력 제고</li><li>끊임없는 기술 습득 및 업무 방식의 유연한 변화 시도</li><li>핵심 키워드: 적응(adapt), 일자리 시장(job market)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">lead to</td><td class=\"m\">~을 초래하다, ~로 이어지다</td></tr><tr><td class=\"w\">automate</td><td class=\"m\">자동화하다, 기계화하다</td></tr><tr><td class=\"w\">be likely to</td><td class=\"m\">~할 가능성이 있다, 아마 ~일 것이다</td></tr><tr><td class=\"w\">nature</td><td class=\"m\">본질, 성격, 자연</td></tr><tr><td class=\"w\">adapt to</td><td class=\"m\">~에 적응하다, ~에 맞추다</td></tr><tr><td class=\"w\">acquire</td><td class=\"m\">습득하다, 얻다, 획득하다</td></tr><tr><td class=\"w\">interpersonal</td><td class=\"m\">대인 관계의, 사람 사이의</td></tr><tr><td class=\"w\">be familiar with</td><td class=\"m\">~에 익숙하다, ~을 잘 알다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">human-centered</td><td class=\"m\">인간 중심의, 사람을 중심에 둔</td></tr><tr><td class=\"w\">make sure</td><td class=\"m\">확실하게 하다, 반드시 ~하도록 하다</td></tr><tr><td class=\"w\">responsible</td><td class=\"m\">책임 있는, 책임감 있는</td></tr><tr><td class=\"w\">ethical</td><td class=\"m\">윤리적인, 도덕적인</td></tr><tr><td class=\"w\">manner</td><td class=\"m\">방식, 태도, 예절</td></tr><tr><td class=\"w\">have an impact on</td><td class=\"m\">~에 영향을 미치다</td></tr><tr><td class=\"w\">necessary</td><td class=\"m\">필요한, 필수적인</td></tr><tr><td class=\"w\">organization</td><td class=\"m\">조직, 단체, 기구</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">인공지능(AI)은</span><span class=\"en\"><b>Artificial intelligence (AI)</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">빠르게 변화시키고 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">is rapidly changing</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">고용 시장을</span><span class=\"en\"><b>the job market.</b></span></div></div><div class=\"lec-sent-ko\">인공지능(AI)이 고용 시장을 빠르게 변화시키고 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 글의 핵심 주제를 제시하는 문장입니다. AI가 단순히 기술적인 도구에 머무는 것이 아니라, 사람들이 일하고 일자리를 구하는 환경 전체를 뒤흔들고 있다는 점을 강조하며 논의를 시작합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is rapidly changing (현재진행): be동사(is) + 현재분사(changing)의 구조로, 현재 진행 중인 동작을 나타냄</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">일부 전문가들은 예측한다</span><span class=\"en\"><b>Some experts <span class=\"grammar-hl\">predict</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">AI가 일자리 감소를 초래할 것이라고</span><span class=\"en\"><b><span class=\"grammar-hl\">that AI will lead to</span> job loss</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">특정 산업에서</span><span class=\"en\"><b>in certain industries</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 단순 업무를 자동화함으로써</span><span class=\"en\"><b><span class=\"grammar-hl\">by automating</span> many simple tasks.</b></span></div></div><div class=\"lec-sent-ko\">일부 전문가들은 AI가 많은 단순 업무를 자동화함으로써 특정 산업의 일자리 감소를 초래할 것이라 예측한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 변화의 부정적인 측면을 보여줍니다. AI가 인간이 하던 반복적이고 기계적인 일을 대신하게 되면서 생기는 고용 불안정성을 설명하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">predict that AI will lead to (명사절(that절)): predict의 목적어 역할을 하는 명사절로, 문장에서 핵심적인 내용을 전달함</div><div class=\"lec-gr-item\">by automating (동명사): 전치사(by)의 목적어로 쓰여 &#39;수단&#39;을 나타냄</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">lead to</td><td class=\"m\">~을 초래하다, ~로 이어지다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만,</span><span class=\"en\"><b>However,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 전문가들은 믿는다</span><span class=\"en\"><b>other experts <span class=\"grammar-hl\">believe</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">AI가 창출할 것이라고</span><span class=\"en\"><b><span class=\"grammar-hl\">that AI will create</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">새로운 일자리 기회를</span><span class=\"en\"><b>new job opportunities.</b></span></div></div><div class=\"lec-sent-ko\">하지만, 다른 전문가들은 AI가 새로운 일자리 기회를 창출할 것이라고 믿는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 일자리 감소 우려에 대응하는 반론입니다. 기술의 발전이 기존의 일자리를 없애는 동시에, 과거에는 존재하지 않았던 새로운 형태의 업무 영역을 만들어낼 수 있다는 낙관적인 시각을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">believe that AI will create (명사절(that절)): believe의 목적어 역할을 하는 명사절</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">진실은</span><span class=\"en\"><b>The truth</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아마도 있을 것이다</span><span class=\"en\"><b>likely <span class=\"grammar-hl\">lies</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 사이 어딘가에</span><span class=\"en\"><b>somewhere in between.</b></span></div></div><div class=\"lec-sent-ko\">진실은 아마도 그 사이 어딘가에 있을 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 일자리 감소와 창출이라는 상반된 두 의견을 모두 수용하는 중립적인 입장입니다. 양극단의 예측 모두가 일리가 있으며, 현실은 이 두 가능성이 복합적으로 뒤섞인 형태로 나타날 것임을 암시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">lies (자동사): lie는 목적어를 취하지 않는 자동사로, &#39;놓여 있다/존재하다&#39;라는 의미의 1형식 구조</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만</span><span class=\"en\"><b>But</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">분명하다</span><span class=\"en\"><b><span class=\"grammar-hl\">it is clear</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">AI가 변화시키고 있다는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">that AI is changing</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">업무의 본질을</span><span class=\"en\"><b>the nature of work.</b></span></div></div><div class=\"lec-sent-ko\">하지만 AI가 업무의 본질을 바꾸고 있다는 것은 분명하다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 일자리가 늘어날지 줄어들지에 대한 논쟁을 넘어, &#39;일하는 방식&#39; 자체가 근본적으로 달라지고 있다는 사실을 환기합니다. 글쓴이는 결과적으로 어떠한 상황이 오든 노동자가 겪어야 할 변화는 피할 수 없음을 강력하게 시사합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">it is clear that AI is changing (가주어): 진주어: it이 가주어로 쓰였고, 진주어인 that절이 문장의 보어 내용을 구체적으로 설명함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">nature</td><td class=\"m\">본질, 성격, 자연</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">다양한 산업의 근로자들은</span><span class=\"en\"><b>Workers in various industries</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">적응할 필요가 있을 것이다</span><span class=\"en\"><b>will <span class=\"grammar-hl\">need to adapt</span> to</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">새로운 기술에</span><span class=\"en\"><b>new technologies</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 습득할 필요가 있을 것이다</span><span class=\"en\"><b>and acquire</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">새로운 기량을</span><span class=\"en\"><b>new skills.</b></span></div></div><div class=\"lec-sent-ko\">다양한 산업에 종사하는 근로자들은 새로운 기술에 적응하고 새로운 기량을 습득해야 할 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 업무 환경 변화에 대응하기 위해 노동자가 취해야 할 구체적인 행동 강령입니다. 수동적으로 변화를 지켜보기보다 능동적으로 기술을 배우고 역량을 키워야 살아남을 수 있다는 현실적인 요구를 담고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">need to adapt (to부정사): 동사(need)의 목적어 역할을 하는 명사적 용법</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">adapt to</td><td class=\"m\">~에 적응하다, ~에 맞추다</td></tr><tr><td class=\"w\">acquire</td><td class=\"m\">습득하다, 얻다, 획득하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">예를 들어,</span><span class=\"en\"><b>For example,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">고객 서비스에서의 AI 사용은</span><span class=\"en\"><b>the use of AI in customer service</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">요구한다</span><span class=\"en\"><b><span class=\"grammar-hl\">requires workers</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">근로자들이 향상시키도록</span><span class=\"en\"><b><span class=\"grammar-hl\">to improve</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 대인 관계 기술을</span><span class=\"en\"><b>their interpersonal skills.</b></span></div></div><div class=\"lec-sent-ko\">예를 들어, 고객 서비스에서 AI를 사용하는 것은 근로자들에게 그들의 대인 관계 기술을 향상시키는 것을 요구한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 &#39;새로운 능력 습득&#39;에 대한 구체적인 예시입니다. AI가 단순 문의를 처리하는 동안, 사람은 AI가 해결하기 어려운 공감과 소통 같은 인간 고유의 영역에 더 집중해야 하는 상황을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">requires workers to improve 5형식(SVOC) 구조: require + 목적어(workers) + 목적보어(to improve)로 이루어진 구조로, 목적어에게 특정 행동을 요구함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">interpersonal</td><td class=\"m\">대인 관계의, 사람 사이의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은 또한 될 필요가 있다</span><span class=\"en\"><b>They also <span class=\"grammar-hl\">need to be</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">익숙하고 편안해질</span><span class=\"en\"><b><span class=\"grammar-hl\">familiar and comfortable</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인간 중심적인 기술에</span><span class=\"en\"><b>with human-centered technology.</b></span></div></div><div class=\"lec-sent-ko\">그들은 또한 인간 중심적인 기술에 익숙해지고 편안해질 필요가 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> AI와 공존하기 위해 노동자가 갖춰야 할 태도입니다. 기술을 거부하거나 두려워하지 말고, AI를 자신의 업무를 보조하는 도구로서 자연스럽게 활용할 수 있어야 함을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">need to be familiar and comfortable (to부정사): 동사(need)의 목적어 역할을 하며, be동사가 원형으로 연결되어 상태를 나타냄</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">human-centered</td><td class=\"m\">인간 중심의, 사람을 중심에 둔</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">게다가,</span><span class=\"en\"><b>In addition,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">AI는 아마 이어질 것이다</span><span class=\"en\"><b>AI will likely lead to</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">새로운 직업 범주의 개발로,</span><span class=\"en\"><b>the development of new job categories,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">AI 윤리 책임자와 같은</span><span class=\"en\"><b><span class=\"grammar-hl\">such as</span> AI ethics officers.</b></span></div></div><div class=\"lec-sent-ko\">게다가, AI는 아마 AI 윤리 책임자와 같은 새로운 직업 범주의 개발로 이어질 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> AI가 일자리를 없애기만 하는 것이 아니라, AI 자체를 관리하고 감독하는 새로운 역할이 생겨나고 있음을 보여주는 사례입니다. 이는 기술 발전이 직업 체계의 지형도를 어떻게 바꾸는지 구체화합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">such as (관용표현): 예시를 나열할 때 사용하는 숙어로 &#39;예를 들어 ~와 같은&#39;의 의미</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">lead to</td><td class=\"m\">~을 초래하다, ~로 이어지다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들의 임무는</span><span class=\"en\"><b>Their job</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">~일 것이다</span><span class=\"en\"><b>would be</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">확실히 하는 것</span><span class=\"en\"><b>to <span class=\"grammar-hl\">make sure</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">AI 시스템이 사용되도록</span><span class=\"en\"><b><span class=\"grammar-hl\">that AI systems are used</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">책임감 있고 윤리적인 방식으로</span><span class=\"en\"><b>in a responsible and ethical manner.</b></span></div></div><div class=\"lec-sent-ko\">그들의 임무는 AI 시스템이 책임감 있고 윤리적인 방식으로 사용되도록 하는 것일 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 &#39;AI 윤리 책임자&#39;가 구체적으로 무엇을 하는지 설명합니다. 기술이 가진 힘을 제어하고 사회적 기준에 맞게 운용되도록 감시하는 일이 인공지능 시대의 핵심 직무가 될 것임을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">make sure that AI systems are used (수동태): be동사(are) + p.p.(used) 구조. use는 타동사인데 목적어가 없어서 수동구조(are used) 형태로 쓴다. 기본구조: use + O(목적어)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">make sure</td><td class=\"m\">확실하게 하다, 반드시 ~하도록 하다</td></tr><tr><td class=\"w\">responsible</td><td class=\"m\">책임 있는, 책임감 있는</td></tr><tr><td class=\"w\">ethical</td><td class=\"m\">윤리적인, 도덕적인</td></tr><tr><td class=\"w\">manner</td><td class=\"m\">방식, 태도, 예절</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 11 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">AI가 계속해서 영향을 미침에 따라</span><span class=\"en\"><b><span class=\"grammar-hl\">As AI continues to have</span> an impact</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">고용 시장에,</span><span class=\"en\"><b>on the job market,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">필요하다</span><span class=\"en\"><b><span class=\"grammar-hl\">it is necessary</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">근로자와 조직이</span><span class=\"en\"><b><span class=\"grammar-hl\">for workers and organizations</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">변화에 적응하는 것이</span><span class=\"en\"><b><span class=\"grammar-hl\">to adapt</span> to the changes.</b></span></div></div><div class=\"lec-sent-ko\">AI가 계속해서 고용 시장에 영향을 미침에 따라, 근로자와 조직이 변화에 적응하는 것이 필요하다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 전체 글의 결론입니다. AI의 영향력이 일시적인 현상이 아니라 지속적인 흐름이므로, 개인인 노동자와 기업이라는 조직 모두가 생존을 위해 변화를 수용해야 한다는 점을 다시 한번 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">As AI continues to have (현재분사(분사구문)): 접속사 As(시간/이유: ~함에 따라) + 주어(AI) + 동사(continues)가 결합된 부사적 구문</div><div class=\"lec-gr-item\">it is necessary for workers and organizations to adapt (가주어): 진주어: it이 가주어이며, to부정사(to adapt)가 진주어로 쓰였고 for workers and organizations는 to부정사의 의미상 주어임</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">adapt to</td><td class=\"m\">~에 적응하다, ~에 맞추다</td></tr><tr><td class=\"w\">have an impact on</td><td class=\"m\">~에 영향을 미치다</td></tr><tr><td class=\"w\">necessary</td><td class=\"m\">필요한, 필수적인</td></tr><tr><td class=\"w\">organization</td><td class=\"m\">조직, 단체, 기구</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>AI가 노동 시장을 빠르게 변화시키며 일자리에 큰 영향을 주고 있다.</li><li>AI로 인한 일자리 감소 우려와 신규 일자리 창출 기대가 공존하고 있다.</li><li>중요한 것은 업무의 방식이 변하고 있으며, 노동자는 이에 맞춰 새로운 기술과 역량을 갖춰야 한다.</li><li>AI 윤리 책임자처럼 기술 도입에 따른 새로운 직무도 생겨나고 있다.</li><li>결국 변화하는 흐름 속에서 노동자와 기업 모두 능동적인 적응이 필수적이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">AI is reshaping the job market by automating tasks while creating new roles, so workers must adapt by developing new skills and embracing technological changes.</div>\n              <div class=\"lec-final-sum-ko\">AI는 업무를 자동화하고 새로운 역할을 창출하며 고용 시장을 재편하고 있으므로, 근로자들은 새로운 기술을 개발하고 기술적 변화를 수용함으로써 적응해야 한다.</div></div></div>"],"segs":[[{"audio":"./reading12_audio/1.mp3","hl":null}],[{"audio":"./reading12_audio/2.mp3","hl":null}],[{"audio":"./reading12_audio/3.mp3","hl":null},{"audio":"./reading12_audio/4.mp3","hl":"stage-0"},{"audio":"./reading12_audio/5.mp3","hl":"stage-1"},{"audio":"./reading12_audio/6.mp3","hl":"stage-2"},{"audio":"./reading12_audio/7.mp3","hl":"stage-3"}],[{"audio":"./reading12_audio/8.mp3","hl":null}],[{"audio":"./reading12_audio/9.mp3","hl":"main"},{"audio":"./reading12_audio/10.mp3","hl":"meaning"},{"audio":"./reading12_audio/11.mp3","hl":"grammar"}],[{"audio":"./reading12_audio/12.mp3","hl":"main"},{"audio":"./reading12_audio/13.mp3","hl":"meaning"},{"audio":"./reading12_audio/14.mp3","hl":"grammar"}],[{"audio":"./reading12_audio/15.mp3","hl":"main"},{"audio":"./reading12_audio/16.mp3","hl":"meaning"},{"audio":"./reading12_audio/17.mp3","hl":"grammar"}],[{"audio":"./reading12_audio/18.mp3","hl":"main"},{"audio":"./reading12_audio/19.mp3","hl":"meaning"},{"audio":"./reading12_audio/20.mp3","hl":"grammar"}],[{"audio":"./reading12_audio/21.mp3","hl":"main"},{"audio":"./reading12_audio/22.mp3","hl":"meaning"},{"audio":"./reading12_audio/23.mp3","hl":"grammar"}],[{"audio":"./reading12_audio/24.mp3
