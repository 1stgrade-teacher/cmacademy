품의 놀라운 특징(amazing features)만 강조하면 설명문처럼 느껴짐</li><li>일상 속에서 제품을 활용하는 모습을 보여주면 기억에 훨씬 오래 남음</li><li>핵심 키워드: 기능 설명(explanation), 기억에 남는(memorable)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03성공적인 광고의 전략</div><ul><li>광고는 기능 자체가 아닌 그것이 제공하는 유익함을 전달해야 한다.</li><li>소비자가 제품을 통해 얻을 가치를 제시해야 함</li><li>제품으로 인해 삶이 더 풍요롭고 편리해질 수 있음을 보여줌</li><li>핵심 키워드: 성공적인 광고(successful advertisement), 혜택 판매(sell benefits)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">grab</td><td class=\"m\">붙잡다, 움켜잡다</td></tr><tr><td class=\"w\">attention</td><td class=\"m\">주의, 주목</td></tr><tr><td class=\"w\">emotional</td><td class=\"m\">감정의, 정서적인</td></tr><tr><td class=\"w\">feature</td><td class=\"m\">특징, 특색</td></tr><tr><td class=\"w\">explanation</td><td class=\"m\">설명, 해명</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">effective</td><td class=\"m\">효과적인, 유효한</td></tr><tr><td class=\"w\">memorable</td><td class=\"m\">기억할 만한, 인상적인</td></tr><tr><td class=\"w\">benefit</td><td class=\"m\">이점, 혜택</td></tr><tr><td class=\"w\">successful</td><td class=\"m\">성공적인, 성공한</td></tr><tr><td class=\"w\">convenient</td><td class=\"m\">편리한, 알맞은</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">중요하다</span><span class=\"en\"><b><span class=\"grammar-hl\">It is important</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">광고가</span><span class=\"en\"><b><span class=\"grammar-hl\">for advertisements</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들의 관심을 끄는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">to grab</span> people’s attention.</b></span></div></div><div class=\"lec-sent-ko\">광고가 사람들의 관심을 끄는 것은 중요하다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 광고의 첫 번째 존재 이유를 밝히며, 이어지는 문장들에서 광고가 어떻게 사람들의 시선을 붙잡아야 하는지에 대한 논의의 시작점을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It is important for advertisements to grab (가주어): 진주어: It은 가주어, for advertisements는 to부정사의 의미상 주어, to grab people’s attention이 진주어인 구조입니다.</div><div class=\"lec-gr-item\">to grab (to부정사): 진주어 역할을 하는 명사적 용법의 to부정사입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">grab</td><td class=\"m\">붙잡다, 움켜잡다</td></tr><tr><td class=\"w\">attention</td><td class=\"m\">주의, 주목</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은 사람들에게 다가갈 필요가 있다</span><span class=\"en\"><b>They <span class=\"grammar-hl\">need to reach</span> people</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">감정적인 차원에서</span><span class=\"en\"><b>on an emotional level.</b></span></div></div><div class=\"lec-sent-ko\">그들은 감정적인 차원에서 사람들에게 다가갈 필요가 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 문장에서 언급한 &#39;관심 끌기&#39;를 달성하는 구체적인 방법으로 감정적 접근이 필요함을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">need to reach (to부정사): need의 목적어 역할을 하는 명사적 용법의 to부정사입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">emotional</td><td class=\"m\">감정의, 정서적인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">즉,</span><span class=\"en\"><b>That is,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 광고는 보여줄 필요가 있다</span><span class=\"en\"><b>the advertisement <span class=\"grammar-hl\">needs to show</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">제품이 어떻게 그들을 도울 수 있는지를</span><span class=\"en\"><b><span class=\"grammar-hl\">how the product can help them</span>.</b></span></div></div><div class=\"lec-sent-ko\">즉, 광고는 제품이 어떻게 그들을 도울 수 있는지를 보여줄 필요가 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 &#39;감정적 수준에서의 접근&#39;이 무엇을 의미하는지 구체적으로 풀어서 설명하며, 광고의 핵심 목적을 정의합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">needs to show (to부정사): need의 목적어 역할을 하는 명사적 용법의 to부정사입니다.</div><div class=\"lec-gr-item\">how the product can help them (간접의문문): 의문사(how)+주어(the product)+동사(can help) 순서의 명사절로 show의 목적어 역할을 합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">모든 좋은 제품이나 서비스는</span><span class=\"en\"><b>Every good product or service</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들을 도울 수 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">can help people</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 삶을 살고, 일하고, 더 즐기도록</span><span class=\"en\"><b><span class=\"grammar-hl\">live, work, or enjoy</span> their lives more.</b></span></div></div><div class=\"lec-sent-ko\">모든 좋은 제품이나 서비스는 사람들이 그들의 삶을 더 많이 살고, 일하고, 즐기도록 도울 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 제품의 기능적인 측면을 넘어 인간의 삶에 미치는 실질적인 효용성을 언급함으로써, 광고가 나아가야 할 방향의 정당성을 뒷받침합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">can help people live, work, or enjoy (5형식(SVOC)): help는 5형식 사역동사(준사역)로 쓰였으며, 목적어(people) 뒤에 목적보어로 동사원형(live, work, enjoy)이 온 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">예를 들어,</span><span class=\"en\"><b>For example,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">새로운 스마트폰을 위한 광고를 상상해보라</span><span class=\"en\"><b>imagine <span class=\"grammar-hl\">an advertisement for a new smartphone</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그저 그것의 놀라운 기능들에 대해서만 이야기하는</span><span class=\"en\"><b><span class=\"grammar-hl\">that just talks about its amazing features</span>.</b></span></div></div><div class=\"lec-sent-ko\">예를 들어, 새로운 스마트폰의 놀라운 기능에 대해서만 이야기하는 광고를 상상해보라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 &#39;도움을 보여주는 광고&#39;와 대비되는 사례를 제시하여, 단순히 제품의 스펙만 나열하는 방식이 비효율적임을 드러내기 위한 준비 단계입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">an advertisement for a new smartphone that just talks about its amazing features (관계대명사): that은 주격 관계대명사로 선행사 a new smartphone을 수식하며, 뒤에 주어가 없는 불완전한 절이 옵니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">feature</td><td class=\"m\">특징, 특색</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 광고는</span><span class=\"en\"><b>That advertisement</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">설명처럼 느껴진다</span><span class=\"en\"><b><span class=\"grammar-hl\">feels like</span> an explanation.</b></span></div></div><div class=\"lec-sent-ko\">그 광고는 설명처럼 느껴진다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 제품의 특징만을 나열하는 방식이 소비자에게는 정보 전달 이상의 감흥을 주지 못하는 건조한 서술에 불과하다는 점을 짚어줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">feels like (관용표현): &#39;~처럼 느껴지다&#39;라는 의미로, like 뒤에 명사(explanation)를 취하여 상태를 설명합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">explanation</td><td class=\"m\">설명, 해명</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">유감스럽게도,</span><span class=\"en\"><b>Unfortunately,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 아닐 것이다</span><span class=\"en\"><b><span class=\"grammar-hl\">it would not be</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매우 효과적인 광고가</span><span class=\"en\"><b>a very effective advertisement.</b></span></div></div><div class=\"lec-sent-ko\">유감스럽게도, 그것은 그다지 효과적인 광고는 아닐 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 소비자의 공감을 얻지 못하는 정보 위주의 광고는 상업적 목적을 달성하기 어렵다는 평가를 내립니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">it would not be (가정법): would를 사용해 현재의 상황을 가정한 표현입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">effective</td><td class=\"m\">효과적인, 유효한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이제 광고를 상상해보라</span><span class=\"en\"><b>Now imagine <span class=\"grammar-hl\">an advertisement</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들이 일상생활에서 아름다운 사진을 찍거나</span><span class=\"en\"><b><span class=\"grammar-hl\">showing people taking beautiful photos</span> in their daily lives</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 새로운 스마트폰으로 영화를 보는 것을 보여주는</span><span class=\"en\"><b>or watching movies on their new smartphone.</b></span></div></div><div class=\"lec-sent-ko\">이제 일상에서 아름다운 사진을 찍거나 새로운 스마트폰으로 영화를 보는 사람들을 보여주는 광고를 상상해보라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 소비자가 제품을 사용할 때 얻게 될 긍정적인 경험을 보여주는 효과적인 광고 사례를 제시하여 앞선 사례와 대조시킵니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">an advertisement showing people taking beautiful photos (현재분사): showing이 앞의 명사 an advertisement를 수식하며, 목적보어 자리의 taking은 5형식 구조에서 people이 사진을 찍는 동작을 나타내는 현재분사입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 훨씬 더 기억에 남을 것이다</span><span class=\"en\"><b>It <span class=\"grammar-hl\">would be far more memorable</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 사람들은 그것에 관심을 가질 것이다</span><span class=\"en\"><b>and people <span class=\"grammar-hl\">would be interested in it</span>.</b></span></div></div><div class=\"lec-sent-ko\">그것은 훨씬 더 기억에 남을 것이고 사람들은 그것에 관심을 가질 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 구체적인 사용 사례를 제시하는 광고가 소비자에게 깊은 인상을 남기고 관심을 유발하는 구체적인 결과임을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">would be far more memorable (관용표현): far는 비교급(more memorable) 앞에서 비교급의 정도를 강조하는 &#39;훨씬&#39;이라는 의미로 쓰였습니다.</div><div class=\"lec-gr-item\">would be interested in it (관용표현): be interested in (~에 관심이 있다)은 상태를 나타내는 수동구조적 표현입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">memorable</td><td class=\"m\">기억할 만한, 인상적인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">광고는 혜택을 판매한다,</span><span class=\"en\"><b><span class=\"grammar-hl\">Advertisements sell benefits,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">기능이 아니라</span><span class=\"en\"><b><span class=\"grammar-hl\">not features.</span></b></span></div></div><div class=\"lec-sent-ko\">광고는 기능이 아닌 혜택을 판매한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞의 예시들을 바탕으로, 광고의 본질은 제품 자체가 가진 스펙이 아니라 그 제품이 가져다주는 삶의 향상이라는 점을 힘주어 요약합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Advertisements sell benefits, not features. (기본구조): 주어(Advertisements)+동사(sell)+목적어(benefits)의 3형식 문장입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">feature</td><td class=\"m\">특징, 특색</td></tr><tr><td class=\"w\">benefit</td><td class=\"m\">이점, 혜택</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 11 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러므로,</span><span class=\"en\"><b>Therefore,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">성공적인 광고는</span><span class=\"en\"><b>a successful advertisement</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들에게 보여주어야 한다</span><span class=\"en\"><b><span class=\"grammar-hl\">must show people</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것의 제품이 어떻게 그들의 삶을 더 풍부하고 편리하게 만들 수 있는지를</span><span class=\"en\"><b><span class=\"grammar-hl\">how its product can make their lives richer and more convenient</span>.</b></span></div></div><div class=\"lec-sent-ko\">그러므로, 성공적인 광고는 사람들에게 그것의 제품이 어떻게 그들의 삶을 더 풍부하고 편리하게 만들 수 있는지 보여주어야 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글 전체의 논의를 종합하여, 성공적인 광고가 갖추어야 할 최종적인 조건과 방향을 결론으로 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">must show people how its product can make their lives richer and more convenient (5형식(SVOC)): show는 수여동사로 쓰였고, how 이하의 간접의문문이 목적어 역할을 합니다. 그 안의 make는 5형식 동사로 목적어(their lives)와 목적보어(richer and more convenient)를 갖습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">successful</td><td class=\"m\">성공적인, 성공한</td></tr><tr><td class=\"w\">convenient</td><td class=\"m\">편리한, 알맞은</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>광고는 사람들의 관심을 끌기 위해 감정적인 수준에서 접근해야 한다.</li><li>단순히 제품의 기능(features)을 나열하는 설명식 광고는 효과가 없다.</li><li>소비자가 제품을 통해 얻는 혜택(benefits)을 보여줄 때 광고는 더 기억에 남는다.</li><li>성공적인 광고는 제품이 어떻게 삶을 풍요롭고 편리하게 만드는지를 보여주는 것이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Advertisements should move beyond listing product features, as they must illustrate personal benefits to capture consumer interest and emotional connection.</div>\n              <div class=\"lec-final-sum-ko\">광고는 소비자의 관심과 감정적 연결을 이끌어내기 위해 제품의 특징을 나열하는 것을 넘어 실질적인 혜택을 보여주어야 한다.</div></div></div>"],"segs":[[{"audio":"./reading11_audio/1.mp3","hl":null}],[{"audio":"./reading11_audio/2.mp3","hl":null}],[{"audio":"./reading11_audio/3.mp3","hl":null},{"audio":"./reading11_audio/4.mp3","hl":"stage-0"},{"audio":"./reading11_audio/5.mp3","hl":"stage-1"},{"audio":"./reading11_audio/6.mp3","hl":"stage-2"}],[{"audio":"./reading11_audio/7.mp3","hl":null}],[{"audio":"./reading11_audio/8.mp3","hl":"main"},{"audio":"./reading11_audio/9.mp3","hl":"meaning"},{"audio":"./reading11_audio/10.mp3","hl":"grammar"}],[{"audio":"./
