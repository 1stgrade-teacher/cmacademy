<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터2 Reading11 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터2 Reading11","audioDir":"reading11_audio","preview":false,"count":46,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.520em\">Reading11\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터2\u003c/div>\u003ch1>Advertisements Sell Benefits, Not Features\u003c/h1>\u003ch2>광고는 기능이 아닌 혜택을 판매한다\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>광고는 제품의 기능을 나열하는 데서 그치지 않고, 그 제품이 사람들의 삶을 어떻게 더 풍부하고 편리하게 만드는지를 보여주어야 한다. 즉 광고가 파는 것은 기능이 아니라 \u003cb class=\"key\">혜택\u003c/b>이다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>A successful advertisement should sell benefits, not features, by showing how its product makes people's lives richer and more convenient.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 광고에 관한 글이에요. 광고는 기능이 아니라 혜택을 판매한다는 아주 명쾌한 주장을 담고 있죠. 이 글은 광고가 사람들의 관심을 끄는 데서 출발해서, 결국 소비자의 삶이 어떻게 달라지는지를 보여줘야 한다고 말해요. 오늘 강의 목표는 이 흐름을 여러분 머릿속에 또렷하게 그리는 거예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">광고의 첫 번째 임무는 사람들의 시선을 붙잡는 일이에요. 하지만 시선만 끄는 광고는 금방 잊히기 때문에, 감정을 건드리는 것이 중요하죠. 마케팅에서는 이때 기능(feature)과 혜택(benefit)을 구분해요. 기능은 제품이 가진 성질이고, 혜택은 그 성질이 소비자의 삶에 만들어 내는 변화예요. 예를 들어 아주 선명한 카메라 렌즈는 기능이지만, 아이의 생일 사진이 흐릿하지 않게 남는다는 것은 혜택이죠. 사람들은 렌즈의 성능보다 그 장면에 마음이 움직인다는 점이 이 글의 바탕이에요.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식부터 짚어 볼게요. 광고의 첫 번째 임무는 사람들의 시선을 붙잡는 일이에요. 하지만 시선만 끄는 광고는 금방 잊히죠. 그래서 마케팅에서는 기능과 혜택이라는 두 단어를 구분해요. 기능은 제품이 가진 성질이고, 혜택은 그 성질이 소비자의 삶에 만들어 내는 변화를 말해요. 예를 들어 아주 선명한 카메라 렌즈는 기능이지만, 아이의 생일 사진이 흐릿하지 않게 남는다는 건 혜택이에요. 사람들은 렌즈보다 그 장면에 마음이 움직인다는 걸 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>관심과 감정\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>글은 광고가 사람들의 \u003cb class=\"key\">관심\u003c/b>을 끄는 것이 중요하다고 시작한다. 이어서 감정적인 차원에서 사람들에게 다가갈 필요가 있다고 말한다. 즉 시선만 끄는 것으로는 부족하고 마음을 건드려야 한다는 뜻이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>혜택 제시\u003csmall>주장 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>그래서 광고는 제품이 어떻게 그들을 \u003cb class=\"key\">도울 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">있는지\u003c/b>를 보여줄 필요가 있다고 한다. 모든 좋은 제품이나 서비스는 사람들이 삶을 더 많이 살고, 일하고, 즐기도록 도울 수 있기 때문이다. 여기서 제품이 삶에 주는 도움이라는 \u003cb class=\"key\">혜택\u003c/b> 개념이 등장한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>기능만 나열한 광고\u003csmall>반례 · 문장 5–7\u003c/small>\u003c/h4>\u003cp>스마트폰의 놀라운 \u003cb class=\"key\">기능\u003c/b>만 이야기하는 광고를 상상해 보자. 그런 광고는 \u003cb class=\"key\">설명\u003c/b>처럼 느껴지고, 유감스럽게도 그다지 \u003cb class=\"key\">효과적\u003c/b>이지 않다. 기능 나열이 왜 실패하는지를 보여주는 반례다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>삶의 장면을 보여주는 광고\u003csmall>예시 · 문장 8–9\u003c/small>\u003c/h4>\u003cp>반대로 일상에서 아름다운 사진을 찍거나 영화를 보는 사람들을 보여주는 광고를 상상해 보자. 이런 광고는 훨씬 더 \u003cb class=\"key\">기억에 \u003c/b>\u003cb class=\"key\">남고\u003c/b>, 사람들은 그것에 \u003cb class=\"key\">관심\u003c/b>을 가진다. 같은 제품도 무엇을 보여주느냐에 따라 반응이 달라진다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>혜택의 판매\u003csmall>결론 · 문장 10–11\u003c/small>\u003c/h4>\u003cp>글은 광고가 기능이 아닌 \u003cb class=\"key\">혜택\u003c/b>을 판매한다고 단언한다. 그러므로 성공적인 광고는 제품이 어떻게 삶을 더 \u003cb class=\"key\">풍부하고 \u003c/b>\u003cb class=\"key\">편리하게\u003c/b> 만드는지 보여주어야 한다. 결국 소비자의 \u003cb class=\"key\">삶의 \u003c/b>\u003cb class=\"key\">변화\u003c/b>를 보여주는 것이 핵심이다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 지문을 다섯 단계로 나눠서 따라가 볼게요.","hl":null},{"n":4,"text":"글은 먼저 광고가 사람들의 관심을 끄는 것이 중요하다고 말해요. 그리고 감정적인 차원에서 사람들에게 다가갈 필요가 있다고 이어가죠. 즉 눈길만 잡는 것으로는 부족하고 마음을 건드려야 한다는 뜻이에요.","hl":"f0"},{"n":5,"text":"그래서 광고는 제품이 어떻게 그들을 도울 수 있는지를 보여줄 필요가 있다고 해요. 모든 좋은 제품이나 서비스는 사람들이 삶을 더 많이 살고, 일하고, 즐기도록 도울 수 있기 때문이죠. 여기서 우리가 기억할 단어가 바로 혜택이에요. 제품이 삶에 주는 도움이 곧 혜택이거든요.","hl":"f1"},{"n":6,"text":"이제 반례가 나옵니다. 새로운 스마트폰의 놀라운 기능만 이야기하는 광고를 상상해 보라고 해요. 그런 광고는 설명처럼 느껴지고, 유감스럽게도 그다지 효과적이지 않을 거예요. 기능을 나열하는 순간 광고가 설명문으로 변해 버린다는 점을 꼭 짚어 주세요.","hl":"f2"},{"n":7,"text":"반대 상황도 상상해 봐요. 일상에서 아름다운 사진을 찍거나 새 스마트폰으로 영화를 보는 사람들을 보여주는 광고죠. 이런 광고는 훨씬 더 기억에 남고 사람들은 그것에 관심을 가질 거예요. 같은 제품이라도 무엇을 보여주느냐에 따라 반응이 이렇게 달라진다는 거죠.","hl":"f3"},{"n":8,"text":"마지막으로 글이 단언합니다. 광고는 기능이 아닌 혜택을 판매한다고요. 그러므로 성공적인 광고는 제품이 어떻게 삶을 더 풍부하고 편리하게 만드는지 보여주어야 해요. 결국 소비자의 삶의 변화를 보여주는 것이 광고의 핵심이라는 말로 정리할 수 있어요.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거(예시)\u003c/span>\u003cspan class=\"lp-pill\">양괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 11번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 앞부분에서 제품이 어떻게 \u003cb class=\"key\">도울 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">있는지\u003c/b>를 보여주라고 주장하고, 마지막 문장에서 삶을 \u003cb class=\"key\">풍부하고 \u003c/b>\u003cb class=\"key\">편리하게\u003c/b> 만드는 모습을 보여주라고 다시 말한다. 처음과 끝에서 같은 주장을 반복하므로 \u003cb class=\"key\">양괄식\u003c/b> 구조다. 가운데에는 스마트폰 광고라는 구체적인 \u003cb class=\"key\">예시\u003c/b>가 근거로 놓여 주장을 뒷받침한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>That is (3)\u003c/b>\u003cspan>재진술(바꿔 말하기)\u003c/span>\u003cb>For example (5)\u003c/b>\u003cspan>예시 제시\u003c/span>\u003cb>Unfortunately (7)\u003c/b>\u003cspan>부정적 평가·반전\u003c/span>\u003cb>Now imagine (8)\u003c/b>\u003cspan>대조 전환\u003c/span>\u003cb>Therefore (11)\u003c/b>\u003cspan>결론 도출\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">show how the product can help them\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">help people live, work, or enjoy their lives more\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">benefits\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">make their lives richer and more convenient\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>기능 중심 광고 (features)\u003c/th>\u003cth>혜택 중심 광고 (benefits)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>놀라운 기능만 나열\u003c/td>\u003ctd>일상의 장면을 보여줌\u003c/td>\u003c/tr>\u003ctr>\u003ctd>설명처럼 느껴짐\u003c/td>\u003ctd>훨씬 더 기억에 남음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>효과적이지 않음\u003c/td>\u003ctd>사람들이 관심을 가짐\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글은 주장을 먼저 던지고, 예시로 확인한 뒤, 마지막에 다시 주장으로 묶는 구조예요. 처음에 제품이 어떻게 도움이 되는지를 보여주라고 했다가, 마지막 문장에서 삶을 풍부하고 편리하게 만드는 모습을 보여주라고 다시 말하죠. 그래서 앞과 뒤에서 같은 주장을 반복하는 양괄식 구조로 볼 수 있어요. 가운데에는 스마트폰 광고라는 구체적인 예시가 근거로 놓여 있습니다.","hl":"ty"},{"n":10,"text":"신호어도 꼭 챙겨 보세요. That is는 앞의 내용을 다른 말로 바꿔 주는 재진술 신호예요. For example은 예시를 꺼내는 신호이고, Unfortunately는 앞의 광고를 부정적으로 평가하는 반전의 신호죠. Now imagine은 기능 중심 광고와 혜택 중심 광고를 나란히 놓는 대조의 신호이고, Therefore는 결론으로 넘어가는 신호예요. 이 다섯 개만 잡아도 글의 뼈대가 그대로 보입니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>advertisement\u003c/b>\u003cem>명사\u003c/em>\u003cspan>광고\u003c/span>\u003c/div>\u003cdiv>\u003cb>grab\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(관심을) 끌다, 붙잡다\u003c/span>\u003c/div>\u003cdiv>\u003cb>attention\u003c/b>\u003cem>명사\u003c/em>\u003cspan>관심, 주의\u003c/span>\u003c/div>\u003cdiv>\u003cb>reach\u003c/b>\u003cem>동사\u003c/em>\u003cspan>다가가다, 도달하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>emotional\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>감정적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>level\u003c/b>\u003cem>명사\u003c/em>\u003cspan>차원, 수준\u003c/span>\u003c/div>\u003cdiv>\u003cb>that is\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>즉\u003c/span>\u003c/div>\u003cdiv>\u003cb>product\u003c/b>\u003cem>명사\u003c/em>\u003cspan>제품\u003c/span>\u003c/div>\u003cdiv>\u003cb>show\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보여주다\u003c/span>\u003c/div>\u003cdiv>\u003cb>service\u003c/b>\u003cem>명사\u003c/em>\u003cspan>서비스\u003c/span>\u003c/div>\u003cdiv>\u003cb>enjoy\u003c/b>\u003cem>동사\u003c/em>\u003cspan>즐기다\u003c/span>\u003c/div>\u003cdiv>\u003cb>for example\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>예를 들어\u003c/span>\u003c/div>\u003cdiv>\u003cb>imagine\u003c/b>\u003cem>동사\u003c/em>\u003cspan>상상하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>smartphone\u003c/b>\u003cem>명사\u003c/em>\u003cspan>스마트폰\u003c/span>\u003c/div>\u003cdiv>\u003cb>amazing\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>놀라운\u003c/span>\u003c/div>\u003cdiv>\u003cb>feature\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기능, 특징\u003c/span>\u003c/div>\u003cdiv>\u003cb>feel like\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~처럼 느껴지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>explanation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>설명\u003c/span>\u003c/div>\u003cdiv>\u003cb>unfortunately\u003c/b>\u003cem>부사\u003c/em>\u003cspan>유감스럽게도\u003c/span>\u003c/div>\u003cdiv>\u003cb>effective\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>효과적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>daily life\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>일상\u003c/span>\u003c/div>\u003cdiv>\u003cb>take photos\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>사진을 찍다\u003c/span>\u003c/div>\u003cdiv>\u003cb>far\u003c/b>\u003cem>부사\u003c/em>\u003cspan>훨씬\u003c/span>\u003c/div>\u003cdiv>\u003cb>memorable\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>기억에 남는\u003c/span>\u003c/div>\u003cdiv>\u003cb>be interested in\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 관심을 가지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>benefit\u003c/b>\u003cem>명사\u003c/em>\u003cspan>혜택, 이점\u003c/span>\u003c/div>\u003cdiv>\u003cb>therefore\u003c/b>\u003cem>부사\u003c/em>\u003cspan>그러므로\u003c/span>\u003c/div>\u003cdiv>\u003cb>successful\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>성공적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>rich\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>풍부한\u003c/span>\u003c/div>\u003cdiv>\u003cb>convenient\u003c/b>\u003cem>형  class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">grab \u003c/span>\u003cspan class=\"tgt\">people's \u003c/span>\u003cspan class=\"tgt\">attention\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">광고가 사람들의 관심을 끄는 것은 중요하다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글의 도입 문장으로, 광고의 첫 번째 조건이 \u003cb class=\"key\">관심 \u003c/b>\u003cb class=\"key\">끌기\u003c/b>임을 밝혀요. 뒤에 나올 감정적 접근과 혜택 제시도 모두 이 관심에서 출발한다는 흐름을 열어 주는 \u003cb class=\"key\">주제문\u003c/b> 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가주어 it\u003c/span> : It is [형용사] for [의미상 주어] to [진주어] : \"그것은 (…이) 중요하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 의미상 주어(for + 목적격)\u003c/span> : for + [목적격] + to부정사 : \"광고가 사람들의 관심을 끄는 것\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"It is important, 그것은 중요하다. for advertisements, 광고가. to grab people's attention, 사람들의 관심을 끄는 것은. 이 문장 전체를 해석하면, 광고가 사람들의 관심을 끄는 것은 중요하다.","hl":"m"},{"n":14,"text":"이 문장은 글의 첫 문장으로, 광고에서 가장 기본이 되는 조건이 관심 끌기라는 점을 말하고 있어요. 뒤에 이어질 감정적 접근과 혜택 제시도 결국 이 관심에서 출발한다는 흐름을 열어 주는 주제문이에요.","hl":"mn"},{"n":15,"text":"먼저 It은 진짜 주어가 아니라 가주어예요. 진짜 주어인 to grab people's attention이 너무 길어서 앞자리를 비워 두고 가주어 It을 세운 거죠. 그래서 해석할 때는 It을 그것으로 옮기지 말고 진주어인 to부정사부터 광고가 사람들의 관심을 끄는 것이라고 풀어 주면 됩니다. 두 번째로 for advertisements는 to부정사의 의미상 주어로, 관심을 끄는 주체가 advertisements라는 걸 알려 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 사람들에게 다가갈 필요가 있다\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">need \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">reach\u003c/span> people\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">감정적인 차원에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">emotional \u003c/span>\u003cspan class=\"tgt\">level\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 감정적인 차원에서 사람들에게 다가갈 필요가 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 관심을 끈 다음 단계로, 소비자에게 \u003cb class=\"key\">감정적으로\u003c/b> 다가가야 한다고 말해요. 제품 설명보다 사람의 마음을 움직이는 쪽이 효과적이라는 \u003cb class=\"key\">글의 \u003c/b>\u003cb class=\"key\">방향\u003c/b>을 제시하는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">need + to부정사(일반동사 need의 목적어)\u003c/span> : need [타동사] + [to reach (to부정사구/목적어)] : \"다가갈 필요가 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 역할\u003c/span> : on + [추상명사] + level = '~한 차원에서' : \"감정적인 차원에서\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"They need to reach people, 그들은 사람들에게 다가갈 필요가 있다. on an emotional level, 감정적인 차원에서. 이 문장 전체를 해석하면, 그들은 감정적인 차원에서 사람들에게 다가갈 필요가 있다.","hl":"m"},{"n":17,"text":"이 문장은 관심을 끈 다음 단계로, 소비자에게 감정적으로 다가가야 한다고 말해요. 제품 설명보다 사람의 마음을 움직이는 쪽이 효과적이라는 글의 방향을 제시하는 문장이죠.","hl":"mn"},{"n":18,"text":"먼저 need to reach에서 need는 조동사가 아니라 일반동사예요. 그래서 뒤에 to부정사가 목적어로 와서 다가갈 필요가 있다라고 해석합니다. 두 번째로 on an emotional level은 전치사구가 문장 뒤에서 어떤 차원에서인지를 덧붙여 주는 형태예요. on a personal level처럼 level 앞에 형용사를 넣어 자주 쓴다는 것도 함께 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">즉,\u003c/span>\u003cspan class=\"en\">That is,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">광고는 보여줄 필요가 있다\u003c/span>\u003cspan class=\"en\">the advertisement \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">needs \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">show\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제품이 어떻게 그들을 도울 수 있는지를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">product \u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">help \u003c/span>\u003cspan class=\"tgt\">them\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">즉, 광고는 제품이 어떻게 그들을 도울 수 있는지를 보여줄 필요가 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장을 That is로 다시 풀어 주면서, 감정적 접근의 구체적인 방법은 제품이 그들을 어떻게 돕는지 \u003cb class=\"key\">보여 \u003c/b>\u003cb class=\"key\">주는 \u003c/b>\u003cb class=\"key\">것\u003c/b>이라고 설명해요. 여기서 말하는 '도움'이 바로 뒤에 나오는 \u003cb class=\"key\">혜택\u003c/b>의 씨앗이 돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">일반동사 현재형의 주어와 수 일치 + to부정사 목적어\u003c/span> : the advertisement [단수 주어] + needs [동사-s] + to show : \"광고는 보여줄 필요가 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">간접의문문(의문사절)의 목적어 역할\u003c/span> : show + [how + 주어 + 동사] — 간접의문문은 '의문사 + 주어 + 동사' 어순 : \"제품이 어떻게 그들을 도울 수 있는지\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"That is, 즉. the advertisement needs to show, 광고는 보여줄 필요가 있다. how the product can help them, 제품이 어떻게 그들을 도울 수 있는지를. 이 문장 전체를 해석하면, 즉, 광고는 제품이 어떻게 그들을 도울 수 있는지를 보여줄 필요가 있다.","hl":"m"},{"n":20,"text":"앞 문장을 That is로 다시 풀어 주는 문장이에요. 감정적 접근의 구체적인 방법은 제품이 그들을 어떻게 돕는지 보여 주는 것이라고 설명하고 있죠. 여기서 말하는 도움이 바로 뒤에 나오는 혜택의 씨앗이 됩니다.","hl":"mn"},{"n":21,"text":"먼저 needs to show에서 주어 the advertisement가 단수이기 때문에 동사 need에 s가 붙어 주어와 수 일치를 했어요. 뒤의 to show는 need의 목적어로 쓰인 to부정사입니다. 두 번째로 how the product can help them은 의문사 how가 이끄는 절이 show의 목적어 자리에 통째로 들어간 간접의문문이에요. 직접의문문처럼 도치하지 않고 how 다음에 주어 the product, 그다음 조동사 can이 오는 어순을 지킨다는 점을 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 좋은 제품이나 서비스는\u003c/span>\u003cspan class=\"en\">Every good product or service\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들이 하도록 도울 수 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">help \u003c/span>\u003cspan class=\"tgt\">people\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 많이 살고, 일하고, 즐기도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">live, \u003c/span>\u003cspan class=\"tgt\">work, \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">enjoy\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">lives \u003c/span>\u003cspan class=\"tgt\">more\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">모든 좋은 제품이나 서비스는 사람들이 그들의 삶을 더 많이 살고, 일하고, 즐기도록 도울 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 광고는 기능이 아니라 \u003cb class=\"key\">혜택\u003c/b>을 말해야 한다는 글의 주장을 뒷받침하는 문장이에요. 좋은 제품이나 서비스라면 사람들의 삶을 더 낫게 만드는 혜택이 반드시 있으니, 광고는 바로 그 혜택을 보여 줘야 한다는 뜻이죠. live, work, enjoy는 삶의 여러 영역을 나란히 늘어놓은 \u003cb class=\"key\">병렬\u003c/b> 표현이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 can + 준사역동사 help\u003c/span> : [조동사 can] + [동사원형 help] + [목적어 people] : \"사람들이 하도록 도울 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동사원형의 병렬(준사역동사 help의 목적격보어)\u003c/span> : help + [목적어] + [동사원형 A], [동사원형 B], or [동사원형 C] : \"살고, 일하고, 또는 즐기도록\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">비교급 부사 more\u003c/span> : [동사 enjoy] + [목적어 their lives] + [부사 more] : \"그들의 삶을 더 많이\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"Every good product or service, 모든 좋은 제품이나 서비스는. can help people, 사람들이 하도록 도울 수 있다. live, work, or enjoy their lives more, 더 많이 살고, 일하고, 즐기도록. 이 문장 전체를 해석하면, 모든 좋은 제품이나 서비스는 사람들이 그들의 삶을 더 많이 살고, 일하고, 즐기도록 도울 수 있다.","hl":"m"},{"n":23,"text":"이 문장은 광고가 기능이 아니라 혜택을 말해야 한다는 주장의 근거가 돼요. 좋은 제품이라면 사람들의 삶을 더 낫게 만드는 혜택이 반드시 있으니까요. 그래서 live, work, enjoy처럼 삶의 여러 영역을 병렬로 늘어놓아 혜택의 폭이 넓다는 걸 보여 주는 겁니다.","hl":"mn"},{"n":24,"text":"첫 번째 어법 포인트는 help의 쓰임이에요. 조동사 can 뒤에는 동사원형이 오고, help는 목적어 뒤에 동사원형을 데려오는 준사역동사라서 to 없이 live, work, enjoy가 그대로 옵니다. 두 번째는 병렬 구조예요. 같은 자격의 동사원형 셋을 쉼표와 or로 나란히 연결했고, enjoy만 목적어 their lives를 따로 데려오죠. 세 번째는 비교급 more인데, enjoy를 꾸며 더 많이, 더 풍요롭게라는 정도를 나타냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들어,\u003c/span>\u003cspan class=\"en\">For example,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 광고를 상상해보라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">imagine \u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">advertisement\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새로운 스마트폰을 위한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">new \u003c/span>\u003cspan class=\"tgt\">smartphone\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단지 그것의 놀라운 기능에 대해서만 이야기하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\"  feel 뒤에 like와 명사가 오면 설명처럼 느껴진다라는 뜻의 전치사 구문이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유감스럽게도,\u003c/span>\u003cspan class=\"en\">Unfortunately,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 ~하지 않을 것이다\u003c/span>\u003cspan class=\"en\">it \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">be\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그다지 효과적인 광고가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">very \u003c/span>\u003cspan class=\"tgt\">effective \u003c/span>\u003cspan class=\"tgt\">advertisement\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">유감스럽게도, 그것은 그다지 효과적인 광고는 아닐 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 기능만 나열하는 스마트폰 광고를 상상했는데, 이 문장은 그 광고의 결과에 대한 \u003cb class=\"key\">결론\u003c/b>을 내려요. would not be는 현재 사실에 대한 \u003cb class=\"key\">추측\u003c/b>으로 '~하지 않을 것이다'라는 뜻이고, not이 a very effective advertisement 전체를 \u003cb class=\"key\">부정\u003c/b>해 '그다지 효과적이지 않은 광고'가 됩니다. 독자에게 부정적인 결과를 먼저 보여 줌으로써 뒤에 나올 좋은 광고의 조건을 더 설득력 있게 만들어 주는 역할이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 would의 추측 용법\u003c/span> : [주어] + would (not) + [동사원형] (~(하지) 않을 것이다) : \"~하지 않을 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">2형식 주격 보어\u003c/span> : [주어] + be동사 + [주격 보어(명사구)] : \"그다지 효과적인 광고(라는 보어)\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"Unfortunately, 유감스럽게도. it would not be, 그것은 ~하지 않을 것이다. a very effective advertisement, 그다지 효과적인 광고가. 이 문장 전체를 해석하면, 유감스럽게도, 그것은 그다지 효과적인 광고는 아닐 것이다.","hl":"m"},{"n":32,"text":"앞에서 스마트폰 기능만 설명하는 광고를 상상했죠. 이 문장은 그런 광고가 왜 실패하는지 결론을 내리는 문장이에요. would not be는 '~하지 않을 것이다'라는 추측 표현이고, 여기서 not은 그다지 효과적인 광고라는 부분 전체를 부정한다는 점도 같이 기억해 두세요.","hl":"mn"},{"n":33,"text":"첫 번째, would not be에서 would는 현재 사실에 대한 추측으로 '~일 것이다'라고 해석해요. 두 번째, a very effective advertisement는 be동사 뒤에 온 주격 보어로, 문장이 주어와 be동사, 보어로 이루어진 두 형식 구조를 만든다는 점을 짚어 주세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이제 상상해보세요\u003c/span>\u003cspan class=\"en\">Now imagine\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">광고를\u003c/span>\u003cspan class=\"en\">an \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">advertisement \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들을 보여주는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">showing \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일상에서 아름다운 사진을 찍는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">taking \u003c/span>\u003cspan class=\"tgt\">beautiful \u003c/span>\u003cspan class=\"tgt\">photos \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">daily \u003c/span>\u003cspan class=\"tgt\">lives \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">혹은 그들의 새로운 스마트폰으로 영화를 보는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">watching \u003c/span>\u003cspan class=\"tgt\">movies\u003c/span> on their new smartphone.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이제 일상에서 아름다운 사진을 찍거나 새로운 스마트폰으로 영화를 보는 사람들을 보여주는 광고를 상상해보라.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 기능만 설명하는 광고를 상상했는데, 이번에는 그와 \u003cb class=\"key\">대조\u003c/b>되는 장면을 상상하게 하는 문장이에요. 제품의 성능이 아니라 사람들이 그것을 쓰며 사진을 찍고 영화를 보는 \u003cb class=\"key\">일상\u003c/b>의 모습을 그려 보라는 거죠. 광고가 사람의 삶과 감정에 닿아야 한다는 글이 흐름에서 구체적인 예시를 완성하는 부분입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재분사의 형용사적 용법(명사 수식)\u003c/span> : [명사] + [현재분사(~ing) ...] → 뒤에서 앞의 명사를 수식 : \"사람들을 보여주는 광고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">목적격 보어로 쓰인 현재분사\u003c/span> : show + [목적어(people)] + [현재분사(taking, 목적격 보어)] : \"사람들이 아름다운 사진을 찍는 것(을 보여주다)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">or로 연결된 병렬 구조\u003c/span> : [taking ...] or [watching ...] → 동일한 형태끼리 연결 : \"사진을 찍는 것 혹은 영화를 보는 것\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"Now imagine, 이제 상상해보세요. an advertisement, 광고를. showing people, 사람들을 보여주는. taking beautiful photos in their daily lives, 일상에서 아름다운 사진을 찍는. or watching movies on their new smartphone, 혹은 그들의 새로운 스마트폰으로 영화를 보는. 이 문장 전체를 해석하면, 이제 일상에서 아름다운 사진을 찍거나 새로운 스마트폰으로 영화를 보는 사람들을 보여주는 광고를 상상해보라.","hl":"m"},{"n":35,"text":"앞에서는 기능만 설명하는 광고를 상상했죠. 이번에는 그와 대조되는 장면이에요. 사람들이 일상에서 사진을 찍고 영화를 보는 모습을 보여주는 광고를 떠올려 보라는 거예요. 제품이 아니라 사람의 삶을 보여준다는 점이 이 예시의 핵심입니다.","hl":"mn"},{"n":36,"text":"첫 번째, advertisement showing people에서 showing은 앞의 명사를 꾸미는 현재분사예요. 광고가 보여주는 주체이니까 과거분사가 아니라 ing 형태를 쓴 겁니다. 두 번째, people taking beautiful photos는 show 다음에 목적어 people이 오고 그 뒤에 목적격 보어 taking이 이어진 구조예요. 사람들이 사진을 찍는 것은 능동이니까 현재분사가 목적격 보어로 온 거죠. 세 번째, taking과 watching이 or로 나란히 연결된 병렬 구조예요. 둘 다 people이 하는 일이라서 형태를 똑같이 맞춰 줬습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 ~일 것이고\u003c/span>\u003cspan class=\"en\">It would be\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">훨씬 더 기억에 남는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">far \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">memorable\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 사람들은 그것에 관심을 가질 것이다\u003c/span>\u003cspan class=\"en\">and people \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">interested \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 훨씬 더 기억에 남을 것이고 사람들은 그것에 관심을 가질 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 상상한, 사람들의 일상을 보여주는 광고의 결과를 정리하는 문장이에요. 기능만 나열한 광고와 비교해 훨씬 기억에 남고 사람들의 관심을 끈다는 뜻이죠. 이렇게 좋은 광고의 모습을 먼저 보여 주고 나서 '광고는 기능이 아니라 \u003cb class=\"key\">혜택\u003c/b>을 판다'는 다음 문장의 결론으로 자연스럽게 넘어갑니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">비교급 강조\u003c/span> : far + [비교급] (~훨씬 더 ...한) : \"훨씬 더 기억에 남는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">감정을 나타내는 분사 표현(be interested in)\u003c/span> : [주어] + be interested in + [명사/대명사] (~에 관심이 있다) : \"그것에 관심을 가질 것이다\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"It would be, 그것은 ~일 것이고. far more memorable, 훨씬 더 기억에 남는. and people would be interested in it, 그리고 사람들은 그것에 관심을 가질 것이다. 이 문장 전체를 해석하면, 그것은 훨씬 더 기억에 남을 것이고 사람들은 그것에 관심을 가질 것이다.","hl":"m"},{"n":38,"text":"앞에서 상상한, 사람들의 일상을 보여주는 광고의 결과를 말하는 문장이에요. 기능만 설명한 광고와 비교해서 훨씬 기억에 남고 사람들의 관심을 끈다는 뜻이죠. 바로 그래서 광고는 혜택을 보여줘야 한다는 다음 문장으로 자연스럽게 이어집니다.","hl":"mn"},{"n":39,"text":"첫 번째, far more memorable에서 far는 비교급을 강조하는 강조어예요. much나 even을 넣어도 똑같이 훨씬 더라는 뜻이 됩니다. 두 번째, be interested in it은 사람의 감정을 나타내는 표현이에요. 감정을 느끼는 주어에는 과거분사 형태를 쓴다는 점, 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">광고는\u003c/span>\u003cspan class=\"en\">Advertisements\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">판매한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">sell \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">혜택을,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">benefits\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기능이 아니라.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">features\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">광고는 기능이 아닌 혜택을 판매한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글의 \u003cb class=\"key\">주제문\u003c/b> 역할을 하며, 앞에서 예시로 설명한 내용을 한 줄로 압축한 핵심이에요. 소비자가 광고에서 실제로 사는 것은 스펙 같은 기능이 아니라 그 기능이 주는 \u003cb class=\"key\">혜택\u003c/b>이라는 뜻이죠. features와 benefits를 \u003cb class=\"key\">대조\u003c/b>시켜 '광고는 기능을 팔지 않는다'는 메시지를 짧고 강하게 전달합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">완전타동사(3형식) 구문\u003c/span> : sell + [목적어 benefits] : \"혜택을 판매한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부정어를 이용한 대조 표현(생략 구문)\u003c/span> : [A], not [B] → 'B가 아니라 A' (not 뒤에 앞 동사 [[생략]]) : \"기능이 아니라\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"Advertisements, 광고는. sell, 판매한다. benefits, 혜택을. not features, 기능이 아니라.. 이 문장 전체를 해석하면, 광고는 기능이 아닌 혜택을 판매한다.","hl":"m"},{"n":41,"text":"이 문장은 이 글의 주제문이에요. 소비자가 광고에서 진짜 사는 것은 스펙 같은 기능이 아니라 그 기능이 주는 혜택이라는 거죠. 그래서 앞에서 스마트폰 예시로 보여 준 이야기를 혜택이라는 말로 일반화하면서, 글의 중심 생각을 한 줄로 딱 정리해 줍니다.","hl":"mn"},{"n":42,"text":"먼저 sell benefits를 보세요. sell은 목적어를 바로 데리고 오는 타동사라서 benefits가 목적어로 오는 구조예요. 두 번째로 쉼표 뒤의 not features를 눈여겨보세요. 혜택과 기능을 나란히 놓고 not으로 대조를 만든 표현인데, not 뒤에는 앞의 동사 sell이 생략되어 있다고 보면 해석이 아주 자연스럽습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러므로,\u003c/span>\u003cspan class=\"en\">Therefore,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">성공적인 광고는\u003c/span>\u003cspan class=\"en\">a successful advertisement\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들에게 보여주어야 한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">must \u003c/span>\u003cspan class=\"tgt\">show\u003c/span> people\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것의 제품이 어떻게 만들 수 있는지를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">its \u003c/span>\u003cspan class=\"tgt\">product \u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 삶을 더 풍부하고 더 편리하게.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">lives \u003c/span>\u003cspan class=\"tgt\">richer \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">convenient\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러므로, 성공적인 광고는 사람들에게 그것의 제품이 어떻게 그들의 삶을 더 풍부하고 편리하게 만들 수 있는지 보여주어야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Therefore로 앞의 내용을 정리하며 성공적인 광고가 갖춰야 할 \u003cb class=\"key\">조건\u003c/b>을 제시하는 결론 문장이에요. 기능이 아니라 \u003cb class=\"key\">혜택\u003c/b>을 보여줘야 한다는 주제를 '삶이 더 풍부해지고 편리해진다'는 구체적인 \u003cb class=\"key\">결과\u003c/b>의 모습으로 다시 표현했죠. show는 '설명해 주다'가 아니라 '몸으로 보여 주다'라는 뜻으로, \u003cb class=\"key\">시각적\u003c/b>인 광고 이미지를 떠올리게 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 must + 동사원형\u003c/span> : [[조동사]] must + [동사원형 show] : \"보여주어야 한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">간접의문문(의문사절)이 목적어로 쓰인 구조\u003c/span> : show + [사람] + [[how + 주어 + 동사]] ~ : \"그것의 제품이 어떻게 그들의 삶을 더 풍부하고 편리하게 만들 수 있는지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">목적어 + 목적격 보어(형용사) 구문과 비교급 병렬\u003c/span> : make + [목적어 their lives] + [목적격 보어 richer and more convenient] : \"그들의 삶을 더 풍부하고 더 편리하게 만들다\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"Therefore, 그러므로. a successful advertisement, 성공적인 광고는. must show people, 사람들에게 보여주어야 한다. how its product can make, 그것의 제품이 어떻게 만들 수 있는지를. their lives richer and more convenient, 그들의 삶을 더 풍부하고 더 편리하게.. 이 문장 전체를 해석하면, 그러므로, 성공적인 광고는 사람들에게 그것의 제품이 어떻게 그들의 삶을 더 풍부하고 편리하게 만들 수 있는지 보여주어야 한다.","hl":"m"},{"n":44,"text":"Therefore로 앞 문장의 결론을 받으면서, 성공적인 광고가 갖춰야 할 조건을 마지막으로 정리하는 문장이에요. 기능이 아니라 혜택을 보여줘야 한다는 말을, 삶이 더 풍부해지고 편리해진다는 구체적인 결과의 모습으로 다시 풀어 준 거죠. 그래서 이 문장이 글 전체를 마무리하는 결론 역할을 합니다.","hl":"mn"},{"n":45,"text":"먼저 must show에서 must는 동사원형 show를 데리고 오는 조동사예요. 두 번째로 show people 뒤에 how its product can make가 이어지는데, 이건 의문사 how가 이끄는 간접의문문이 목적어로 온 형태라서 '어떻게 ~하는지'로 해석합니다. 여기서 의문사 다음에 주어, 그다음 조동사가 오는 어순을 꼭 확인하세요. 마지막으로 make their lives richer and more convenient는 make가 목적어 뒤에 형용사 목적격 보어를 데리고 오는 구조이고, richer와 more convenient가 and로 병렬 연결되어 목적격 보어 역할을 함께 한다는 점도 기억해 두세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>광고는 사람들의 \u003cb class=\"key\">관심\u003c/b>을 끌고 \u003cb class=\"key\">감정적인 \u003c/b>\u003cb class=\"key\">차원\u003c/b>에서 다가가야 한다.\u003c/li>\u003cli>좋은 제품은 사람들의 삶을 더 낫게 만들 수 있으므로, 광고는 제품이 어떻게 \u003cb class=\"key\">도울 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">있는지\u003c/b>를 보여줘야 한다.\u003c/li>\u003cli>기능만 나열한 광고는 \u003cb class=\"key\">설명\u003c/b>처럼 느껴져 효과적이지 않지만, 삶의 장면을 보여주는 광고는 \u003cb class=\"key\">기억에 \u003c/b>\u003cb class=\"key\">남는다\u003c/b>.\u003c/li>\u003cli>결국 광고는 기능이 아닌 \u003cb class=\"key\">혜택\u003c/b>을 팔며, 삶을 풍부하고 편리하게 만드는 모습을 보여주어야 한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>A successful advertisement should sell benefits, not features, by showing how its product makes people's lives richer and more convenient.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">광고는 제품의 기능을 나열하는 데서 그치지 않고, 그 제품이 사람들의 삶을 어떻게 더 풍부하고 편리하게 만드는지를 보여주어야 한다. 즉 광고가 파는 것은 기능이 아니라 \u003cb class=\"key\">혜택\u003c/b>이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":46,"text":"오늘 글의 핵심은 아주 간단해요. 광고는 기능이 아니라 혜택을 판매한다는 것, 그래서 제품이 삶을 어떻게 더 풍부하고 편리하게 만드는지 보여줘야 한다는 것이죠. 여러분이 나중에 어떤 광고를 보더라도 기능 뒤에 숨은 혜택을 찾아보세요. 그 눈이 독해력도, 세상을 보는 힘도 키워 줄 거예요. 오늘 수업 수고했어요.","hl":null}]}]});</script></body></html>
