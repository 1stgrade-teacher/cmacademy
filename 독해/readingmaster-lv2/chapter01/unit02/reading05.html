<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터2 Reading05 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터2 Reading05","audioDir":"reading05_audio","preview":false,"count":48,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.520em\">Reading05\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터2\u003c/div>\u003ch1>Lighting Techniques That Shape a Movie's Mood\u003c/h1>\u003ch2>영화의 분위기를 만드는 조명 기법\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>영화에서 \u003cb class=\"key\">조명\u003c/b>은 단순히 대상이 보이게 하는 것을 넘어, 밝기와 \u003cb class=\"key\">그림자\u003c/b>, 광원의 위치를 통해 관객의 관심과 감정, 그리고 장면의 \u003cb class=\"key\">분위기\u003c/b>를 만들어 내는 중요한 기법이다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Lighting techniques in movies, such as brightness, shadows, and the position of the light source, create specific atmospheres and emotions.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 영화 속 조명이 어떻게 관객의 감정을 움직이는지 함께 읽어 볼 거예요. 이 지문은 조명이 단순히 화면을 밝히는 도구가 아니라 분위기와 감정을 만드는 장치라고 말하고 있습니다. 요지는 밝기와 그림자, 그리고 광원의 위치라는 세 가지 조명 기법이 영화의 분위기를 결정한다는 것이에요. 그럼 차근차근 들어가 볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">영화에서 조명(lighting)은 단순히 화면을 밝히는 도구가 아니라 감정을 설계하는 장치예요. 밝은 빛은 \u003cb class=\"key\">관심\u003c/b>을 끌고 어두운 빛은 \u003cb class=\"key\">긴장\u003c/b>을 만들며, 그림자(shadow)의 양과 방향에 따라 같은 장면도 전혀 다르게 느껴집니다. 할리우드에서는 이를 하이키 조명(high-key lighting)과 로우키 조명(low-key lighting)으로 나눠 부르는데, 하이키는 그림자를 최소화해 코미디나 로맨스에, 로우키는 강한 \u003cb class=\"key\">대비\u003c/b>로 공포나 스릴러에 주로 쓰여요. 광원(light source)의 위치도 중요한데, 아래에서 위로 향하는 빛이나 머리 위에서 내리쬐는 빛은 인물의 인상을 완전히 바꿔 놓죠. 마치 교실 형광등 아래에서 찍은 셀카와 노을 진 카페 창가에서 찍은 셀카가 전혀 다른 분위기를 내는 것과 같아요. 이처럼 조명은 \u003cb class=\"key\">의미\u003c/b>를 만드는 문법과도 같아서, 그 원리를 알면 영화가 훨씬 다르게 보입니다.\u003c/div>","segs":[{"n":2,"text":"영화에서 조명은 단순히 화면을 밝히는 도구가 아니라 감정을 설계하는 장치예요. 밝은 빛은 관심을 끌고 어두운 빛은 긴장을 만들며, 그림자의 양과 방향에 따라 같은 장면도 전혀 다르게 느껴집니다. 할리우드에서는 이를 하이키 조명과 로우키 조명으로 나눠 부르는데, 하이키는 그림자를 최소화해서 코미디나 로맨스에, 로우키는 강한 대비로 공포나 스릴러에 주로 쓰여요. 광원의 위치도 중요한데, 아래에서 위로 향하는 빛이나 머리 위에서 내리쬐는 빛은 인물의 인상을 완전히 바꿔 놓죠. 마치 교실 형광등 아래에서 찍은 셀카와 노을 진 카페 창가에서 찍은 셀카가 전혀 다른 분위기를 내는 것과 같아요. 이렇게 조명은 의미를 만드는 문법과도 같아서, 그 원리를 알면 영화가 훨씬 다르게 보입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>조명의 기본 역할\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>영화에서 조명은 우리가 무엇이 일어나고 있는지를 \u003cb class=\"key\">보게 \u003c/b>\u003cb class=\"key\">해주는\u003c/b> 것 이상의 역할을 해요. 밝게 비춰지는 대상은 자연스럽게 사람들의 \u003cb class=\"key\">관심\u003c/b>을 끌고, 어둑하게 비춰지는 대상은 \u003cb class=\"key\">호기심과 \u003c/b>\u003cb class=\"key\">두려움\u003c/b>을 유발할 수 있죠. 이처럼 밝기만으로도 관객의 시선과 감정이 달라진다는 점을 먼저 짚어 주고 있어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>그림자의 활용\u003csmall>근거 · 문장 4–9\u003c/small>\u003c/h4>\u003cp>그림자가 어떻게 사용되는지도 조명의 중요한 한 부분이에요. 그림자를 최소화하는 밝은 빛은 \u003cb class=\"key\">밝고 \u003c/b>\u003cb class=\"key\">쾌활한 \u003c/b>\u003cb class=\"key\">분위기\u003c/b>를 만들어 코미디와 액션 영화에 쓰이고, 어두운 그림자로 \u003cb class=\"key\">강한 \u003c/b>\u003cb class=\"key\">대비\u003c/b>를 만들면 피사체를 강조하고 \u003cb class=\"key\">긴장감\u003c/b>을 조성해 공포 영화에 쓰여요. 같은 빛이라도 그림자의 양에 따라 분위기와 장르가 갈린다는 것이 핵심이에요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>광원의 위치\u003csmall>예시 · 문장 10–11\u003c/small>\u003c/h4>\u003cp>여기서 한 단계 더 나아가 \u003cb class=\"key\">광원의 \u003c/b>\u003cb class=\"key\">위치\u003c/b>도 다양한 극적 효과를 만들어 낸다고 설명해요. 대상을 아래로 직접 비추는 빛은 \u003cb class=\"key\">신성함과 \u003c/b>\u003cb class=\"key\">신비감\u003c/b>을 만들어 내죠. 즉 빛이 들어오는 방향만 바꿔도 관객이 느끼는 감정이 달라진다는 거예요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>이해와 즐거움\u003csmall>결론 · 문장 12\u003c/small>\u003c/h4>\u003cp>마지막으로 이런 조명 기술과 효과를 이해하면 영화를 보는 것이 훨씬 더 \u003cb class=\"key\">흥미로워진다\u003c/b>고 정리해요. 조명을 하나의 \u003cb class=\"key\">의미 \u003c/b>\u003cb class=\"key\">전달 \u003c/b>\u003cb class=\"key\">장치\u003c/b>로 읽을 수 있게 된다는 뜻이죠. 그래서 이 글은 조명 기법의 이해가 곧 영화 감상의 즐거움이라는 결론으로 마무리돼요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 지문을 네 단계로 나눠서, 조명의 기본 역할부터 결론까지 순서대로 따라가 볼게요.","hl":null},{"n":4,"text":"자, 먼저 첫 단계예요. 영화에서 조명은 우리가 무엇이 일어나고 있는지를 보게 해주는 것 이상의 역할을 합니다. 밝게 비춰지는 대상은 자연스럽게 사람들의 관심을 끌고, 어둑하게 비춰지는 대상은 호기심과 두려움을 유발할 수 있죠. 밝기만으로도 관객의 시선과 감정이 달라진다는 점을 먼저 기억해 두세요.","hl":"f0"},{"n":5,"text":"다음은 그림자 이야기예요. 그림자를 최소화하기 위해 밝은 빛을 쓰면 밝고 쾌활한 분위기가 만들어지고, 이 효과는 코미디와 액션 영화에 주로 쓰입니다. 반대로 빛으로 어두운 그림자를 만들면 밝은 장면과 어두운 장면 사이에 강한 대비가 생기고, 이것이 피사체를 강조하면서 긴장감을 조성해요. 그래서 공포 영화나 어두운 분위기의 영화에 사용되죠.","hl":"f1"},{"n":6,"text":"세 번째 단계에서는 광원의 위치를 봅니다. 광원의 위치만 바꿔도 다양한 극적 효과가 만들어진다는 거예요. 예를 들어 대상을 아래로 직접 비추는 빛은 신성함과 신비감을 만들어냅니다. 빛의 방향 하나로 관객이 느끼는 감정이 완전히 달라지는 거죠.","hl":"f2"},{"n":7,"text":"마지막 문장은 정리예요. 이런 조명 기술과 그 효과를 이해하면 영화를 보는 것이 훨씬 더 흥미로워진다고 합니다. 조명을 의미를 전달하는 장치로 읽을 수 있게 된다는 뜻이에요. 오늘 배운 세 가지 조명 기법을 영화를 볼 때 한번 찾아보세요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">분류\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 조명이 '보게 해주는 것 이상'이라고 \u003cb class=\"key\">주제\u003c/b>를 먼저 던진 뒤, 밝기와 그림자, 광원의 위치라는 세 가지 \u003cb class=\"key\">기법\u003c/b>으로 나눠 설명하므로 \u003cb class=\"key\">분류\u003c/b>의 전개 방식이에요. 각 기법마다 코미디나 공포 영화 같은 구체적인 \u003cb class=\"key\">예시\u003c/b>와 그 효과를 짝지어 붙여 놓았죠. 마지막 문장에서 다시 주제를 \u003cb class=\"key\">재진술\u003c/b>하며 글을 닫기 때문에 핵심이 앞에 놓인 \u003cb class=\"key\">두괄식\u003c/b> 구조로 볼 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>On the other hand (3)\u003c/b>\u003cspan>대조\u003c/span>\u003cb>also (4)\u003c/b>\u003cspan>내용 추가\u003c/span>\u003cb>So (9)\u003c/b>\u003cspan>결과·결론\u003c/span>\u003cb>For example (11)\u003c/b>\u003cspan>예시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">lighting\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">light\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">light source\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">lighting techniques\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>밝은 빛 (Bright light)\u003c/th>\u003cth>어두운 그림자 (Dark shadows)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>그림자를 최소화해 밝고 쾌활한 분위기 조성\u003c/td>\u003ctd>강한 대비로 피사체를 강조하고 긴장감 조성\u003c/td>\u003c/tr>\u003ctr>\u003ctd>코미디·액션 영화에 주로 사용\u003c/td>\u003ctd>공포·어두운 분위기 영화에 사용\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 분류예요. 첫 번째 문장에서 조명이 보게 해주는 것 이상의 역할을 한다고 주제를 던진 다음, 밝기와 그림자, 그리고 광원의 위치라는 세 가지 기법으로 나눠서 설명하죠. 각 기법마다 어떤 효과가 생기는지를 짝지어 놓았기 때문에 항목별로 정리하며 읽으면 좋아요. 주제가 앞에 나오는 두괄식 구조이고, 마지막 문장에서 주제를 한 번 더 정리해 줍니다.","hl":"ty"},{"n":9,"text":"신호어를 눈여겨보세요. 세 번째 문장의 On the other hand는 밝게 비춰지는 대상과 어둑하게 비춰지는 대상을 대조하는 신호이고, 열한 번째 문장의 For example은 광원의 위치를 구체적인 예로 보여 주는 신호예요. 아홉 번째 문장의 So는 앞의 내용이 어떤 장르로 이어지는지 결과를 정리해 주죠. 이렇게 대조와 예시, 결과의 신호어를 따라가면 글의 뼈대가 그대로 보입니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>take place\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>일어나다, 발생하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>brightly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>밝게\u003c/span>\u003c/div>\u003cdiv>\u003cb>lit\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>빛을 받은, 밝혀진\u003c/span>\u003c/div>\u003cdiv>\u003cb>subject\u003c/b>\u003cem>명사\u003c/em>\u003cspan>대상, 피사체\u003c/span>\u003c/div>\u003cdiv>\u003cb>naturally\u003c/b>\u003cem>부사\u003c/em>\u003cspan>자연스럽게, 당연히\u003c/span>\u003c/div>\u003cdiv>\u003cb>attract\u003c/b>\u003cem>동사\u003c/em>\u003cspan>끌다, 유인하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>attention\u003c/b>\u003cem>명사\u003c/em>\u003cspan>관심, 주의\u003c/span>\u003c/div>\u003cdiv>\u003cb>on the other hand\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>반면에\u003c/span>\u003c/div>\u003cdiv>\u003cb>dimly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>어둑하게, 희미하게\u003c/span>\u003c/div>\u003cdiv>\u003cb>curiosity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>호기심\u003c/span>\u003c/div>\u003cdiv>\u003cb>fear\u003c/b>\u003cem>명사\u003c/em>\u003cspan>두려움\u003c/span>\u003c/div>\u003cdiv>\u003cb>shadow\u003c/b>\u003cem>명사\u003c/em>\u003cspan>그림자\u003c/span>\u003c/div>\u003cdiv>\u003cb>minimize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>최소화하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>cheerful\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>쾌활한, 명랑한\u003c/span>\u003c/div>\u003cdiv>\u003cb>atmosphere\u003c/b>\u003cem>명사\u003c/em>\u003cspan>분위기\u003c/span>\u003c/div>\u003cdiv>\u003cb>effect\u003c/b>\u003cem>명사\u003c/em>\u003cspan>효과, 영향\u003c/span>\u003c/div>\u003cdiv>\u003cb>comedy\u003c/b>\u003cem>명사\u003c/em>\u003cspan>코미디, 희극\u003c/span>\u003c/div>\u003cdiv>\u003cb>contrast\u003c/b>\u003cem>명사\u003c/em>\u003cspan>대비\u003c/span>\u003c/div>\u003cdiv>\u003cb>scene\u003c/b>\u003cem>명사\u003c/em>\u003cspan>장면\u003c/span>\u003c/div>\u003cdiv>\u003cb>emphasize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>강조하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>tension\u003c/b>\u003cem>명사\u003c/em>\u003cspan>긴장감\u003c/span>\u003c/div>\u003cdiv>\u003cb>horror\u003c/b>\u003cem>명사\u003c/em>\u003cspan>공포\u003c/span>\u003c/div>\u003cdiv>\u003cb>position\u003c/b>\u003cem>명사\u003c/em>\u003cspan>위치\u003c/span>\u003c/div>\u003cdiv>\u003cb>light source\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>광원\u003c/span>\u003c/div>\u003cdiv>\u003cb>produce\u003c/b>\u003cem>동사\u003c/em>\u003cspan>만들어 내다, 생산하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>various\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>다양한\u003c/span>\u003c/div>\u003cdiv>\u003cb>dramatic\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>극적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>directly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>직접, 똑바로\u003c/span>\u003c/div>\u003cdiv>\u003cb>holiness\u003c/b>\u003cem>명사\u003c/em>\u003cspan>신성함\u003c/span>\u003c/div>\u003cdiv>\u003cb>technique\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기술, 기법\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"단어도 몇 개 짚고 갈게요. attract는 관심을 끌다, dimly는 어둑하게, minimize는 최소화하다라는 뜻이고요. emphasize는 강조하다, tension은 긴장감, holiness는 신성함이라는 뜻으로 함께 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">attract\u003c/b>\u003cspan class=\"m\">끌다, 유인하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">draw\u003c/span>\u003cspan class=\"s\">appeal to\u003c/span>\u003cspan class=\"s\">captivate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">repel\u003c/span>\u003cspan class=\"a\">repulse\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">dimly\u003c/b>\u003cspan class=\"m\">어둑하게\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">faintly\u003c/span>\u003cspan class=\"s\">darkly\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">brightly\u003c/span>\u003cspan class=\"a\">vividly\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">minimize\u003c/b>\u003cspan class=\"m\">최소화하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">reduce\u003c/span>\u003cspan class=\"s\">lessen\u003c/span>\u003cspan class=\"s\">decrease\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">maximize\u003c/span>\u003cspan class=\"a\">increase\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">cheerful\u003c/b>\u003cspan class=\"m\">쾌활한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">bright\u003c/span>\u003cspan class=\"s\">joyful\u003c/span>\u003cspan class=\"s\">merry\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">gloomy\u003c/span>\u003cspan class=\"a\">sad\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">emphasize\u003c/b>\u003cspan class=\"m\">강조하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">highlight\u003c/span>\u003cspan class=\"s\">stress\u003c/span>\u003cspan class=\"s\">underline\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">downplay\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">tension\u003c/b>\u003cspan class=\"m\">긴장감\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">strain\u003c/span>\u003cspan class=\"s\">suspense\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">relaxation\u003c/span>\u003cspan class=\"a\">calm\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">various\u003c/b>\u003cspan class=\"m\">다양한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">diverse\u003c/span>\u003cspan class=\"s\">varied\u003c/span>\u003cspan class=\"s\">assorted\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">uniform\u003c/span>\u003cspan class=\"a\">identical\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">directly\u003c/b>\u003cspan class=\"m\">직접, 똑바로\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">straight\u003c/span>\u003cspan class=\"s\">immediately\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">indirectly\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"시험에 자주 나오는 어휘도 정리해 볼게요. attract는 draw나 captivate로 바뀌어 나올 수 있고 반대말은 repel이에요. minimize는 reduce, lessen과 같은 뜻이고 반대는 maximize죠. cheerful은 bright, joyful로 바뀌고 반대는 gloomy이고, emphasize는 highlight, stress와 같고 반대는 downplay예요. tension의 반대는 relaxation이나 calm이라고 기억해 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">영화에서\u003c/span>\u003cspan class=\"en\">In a movie,\u003c/span>\u003c/div>\u003cdiv cl \"무엇이 일어나고 있는지\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"In a movie, 영화에서. lighting does more than, 조명은 ~ 이상의 역할을 한다. just allow us to see, 단지 우리가 보게 하는. what is taking place, 무엇이 일어나고 있는지를. 이 문장 전체를 해석하면, 영화에서 조명은 우리가 무엇이 일어나고 있는지를 보게 해주는 것 이상의 역할을 한다.","hl":"m"},{"n":13,"text":"이 문장은 글 전체의 주제문이에요. 조명이 단순히 사물을 보이게 하는 도구가 아니라 감정과 분위기를 만드는 연출 장치라는 점을 먼저 못 박고 있죠. 그래서 뒤에 밝은 조명과 어두운 조명 이야기가 자연스럽게 이어집니다.","hl":"mn"},{"n":14,"text":"첫 번째로 does more than just allow를 보면 more than 뒤에 to 없이 동사원형이 오는 구조이고, 앞에 조동사 does가 있으니 본동사는 원형 allow가 됩니다. 두 번째로 allow us to see는 allow가 목적어와 to부정사를 데리고 오는 5형식 동사라서 우리가 보게 하다로 해석해요. 세 번째로 what is taking place에서 what은 선행사를 포함하는 관계대명사로 명사절을 만들고 see의 목적어 역할을 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">밝게 비춰지는 대상은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Brightly \u003c/span>\u003cspan class=\"tgt\">lit \u003c/span>\u003cspan class=\"tgt\">subjects\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자연스럽게 끈다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">naturally \u003c/span>\u003cspan class=\"tgt\">attract\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들의 관심을\u003c/span>\u003cspan class=\"en\">people's attention.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">밝게 비춰지는 대상은 자연스럽게 사람들의 관심을 끈다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 밝은 조명이 관객의 \u003cb class=\"key\">시선\u003c/b>을 끄는 효과를 설명하는 문장이에요. 사람은 밝은 곳을 먼저 보게 되므로 감독은 관심을 원하는 대상으로 \u003cb class=\"key\">유도\u003c/b>할 수 있습니다. 바로 다음 문장의 어두운 조명과 짝을 이루는 내용이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사에 의한 명사 03cspan class=\"ko\">만약 밝은 빛이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">If \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">bright \u003c/span>\u003cspan class=\"tgt\">light \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사용되면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">used \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그림자를 최소화하기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">minimize \u003c/span>\u003cspan class=\"tgt\">shadows\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 만들어낸다\u003c/span>\u003cspan class=\"en\">it creates\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">밝고 쾌활한 분위기를\u003c/span>\u003cspan class=\"en\">a \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">bright \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">cheerful\u003c/span> atmosphere.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그림자를 최소화하기 위해 밝은 빛이 사용되면 그것은 밝고 쾌활한 분위기를 만들어낸다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞에서 말한 그림자를 어떻게 다루느냐에 따라 분위기가 달라진다는 흐름을 구체적으로 보여줘요. 밝은 빛으로 \u003cb class=\"key\">그림자\u003c/b>를 줄이면 밝고 쾌활한 \u003cb class=\"key\">분위기\u003c/b>가 만들어진다는 예시를 제시하는 거죠. 그래서 다음 문장에서 이 효과가 어떤 장르에 쓰이는지 설명할 수 있는 발판이 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">if 조건 부사절\u003c/span> : If + 주어 + 동사 ~, 주어 + 동사 ~ : \"만약 밝은 빛이 그림자를 최소화하기 위해 사용되면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태(be동사 + 과거분사)\u003c/s lass=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">action \u003c/span>\u003cspan class=\"tgt\">movies\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 효과는 코미디와 액션 영화에 주로 사용된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞에서 설명한 밝고 쾌활한 조명 효과가 실제로 어디에 쓰이는지 \u003cb class=\"key\">예시\u003c/b>를 들어주는 역할을 해요. 코미디와 액션 영화처럼 밝고 활기찬 장르에서 자주 쓰인다는 걸 알 수 있죠. 이렇게 '효과 → 활용 장르' 순서로 묶어 주면 앞 문장의 내용이 구체적인 사례로 확장됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태에서 빈도부사의 위치\u003c/span> : 주어 + be동사 + [[빈도부사]] + p.p. : \"주로 사용된다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사의 목적어 병렬 구조\u003c/span> : [[in]] + 명사 + and + 명사 : \"코미디와 액션 영화에서\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"This effect, 이 효과는. is usually used, 주로 사용된다. in comedies, 코미디에서. and action movies, 그리고 액션 영화에서. 이 문장 전체를 해석하면, 이 효과는 코미디와 액션 영화에 주로 사용된다.","hl":"m"},{"n":28,"text":"이 문장은 앞에서 설명한 밝고 쾌활한 조명 효과가 실제로 어디에 쓰이는지 예시를 들어주는 역할을 해요. 코미디와 액션 영화처럼 밝고 활기찬 장르에서 자주 쓰인다는 걸 알 수 있죠. 이렇게 효과 다음에 활용 장르를 붙여 주면 앞 문장의 내용이 구체적인 사례로 확장됩니다.","hl":"mn"},{"n":29,"text":"먼저 is usually used를 보면 수동태인데, 빈도부사 usually가 be동사 뒤에 왔어요. 빈도부사는 일반동사 앞, be동사 뒤에 놓인다는 규칙을 그대로 따른 거예요. 두 번째로 in comedies and action movies에서 전치사 in이 두 명사를 함께 이끄는 병렬 구조라는 점도 짚어 두세요. 그래서 in의 의미가 코미디와 액션 영화 모두에 적용됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">빛은 또한 만들 수 있다\u003c/span>\u003cspan class=\"en\">Light \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">also \u003c/span>\u003cspan class=\"tgt\">make\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어두운 그림자를\u003c/span>\u003cspan class=\"en\">dark shadows\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">강한 대비를 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">strong \u003c/span>\u003cspan class=\"tgt\">contrast\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">밝은 장면과 어두운 장면 사이의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">between \u003c/span>\u003cspan class=\"tgt\">bright \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">dark \u003c/span>\u003cspan class=\"tgt\">scenes\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">빛은 또한 밝은 장면과 어두운 장면 사이의 강한 대비를 위해 어두운 그림자를 만들 수도 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 빛이 어두운 그림자를 만들어 밝은 장면과 어두운 장면 사이에 강한 \u003cb class=\"key\">대비\u003c/b>를 연출한다는 내용이에요. 앞 문장의 밝은 조명과 반대되는 \u003cb class=\"key\">어두운 \u003c/b>\u003cb class=\"key\">그림자\u003c/b> 활용법으로, 글의 흐름이 밝은 쪽에서 어두운 쪽으로 \u003cb class=\"key\">대조\u003c/b>를 이루는 부분이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 can + 동사원형\u003c/span> : [주어] + can + [동사원형] : \"~할 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 for의 목적 용법\u003c/span> : [명사구] + for + [목적어] : \"강한 대비를 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 between (~사이에)\u003c/span> : between + [A] + and + [B] : \"밝은 장면과 어두운 장면 사이의\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Light can also make, 빛은 또한 만들 수 있다. dark shadows, 어두운 그림자를. for a strong contrast, 강한 대비를 위해. between bright and dark scenes, 밝은 장면과 어두운 장면 사이의. 이 문장 전체를 해석하면, 빛은 또한 밝은 장면과 어두운 장면 사이의 강한 대비를 위해 어두운 그림자를 만들 수도 있다.","hl":"m"},{"n":31,"text":"이 문장은 빛이 밝은 쪽만이 아니라 어두운 쪽도 연출한다는 걸 말해요. 밝은 장면과 어두운 장면 사이에 강한 대비를 만들기 위해 일부러 어두운 그림자를 만든다는 뜻이죠. 바로 앞에서 밝은 조명 이야기가 나왔으니, 여기서는 어두운 그림자로 대조를 만드는 경우라고 정리해 두면 좋아요.","hl":"mn"},{"n":32,"text":"첫 번째로 can also make에서 조동사 can 뒤에는 동사원형이 온다는 점을 꼭 기억해요. 두 번째로 for a strong contrast에서 전치사 for는 목적을 나타내서 강한 대비를 위해라고 해석해요. 세 번째로 between bright and dark scenes에서 between은 두 대상 사이를 뜻하니까 밝은 장면과 어두운 장면 사이로 읽으면 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은 피사체를 강조할 수 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">This\u003c/span> can \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">emphasize \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">subject \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 긴장감을 조성한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">create \u003c/span>\u003cspan class=\"tgt\">tension\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것은 피사체를 강조하고 긴장감을 조성한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 어두운 그림자로 대비를 만들면 피사체가 더 \u003cb class=\"key\">강조\u003c/b>되고 \u003cb class=\"key\">긴장감\u003c/b>이 생긴다는 효과를 설명해요. 그래서 다음 문장에서 공포 영화에 쓰인다는 결론으로 이어지는 \u003cb class=\"key\">인과\u003c/b>의 흐름을 만들어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지시대명사 This\u003c/span> : This + [동사] (앞 문장 내용을 받음) : \"이것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동사원형 병렬 구조\u003c/span> : can + [동사원형 A] + and + [동사원형 B] : \"피사체를 강조하고 긴장감을 조성한다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"This can emphasize the su  비추는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주어-동사 수일치(단수 주어)\u003c/span> : [a light (단수 주어)] + [creates (단수 동사)] : \"만들어낸다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 수식과 and 병렬\u003c/span> : [a feeling] + [of holiness and mystery (전치사구)] : \"신성함과 신비감이라는 느낌\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"For example, 예를 들어. a light, 빛은. shining directly down on the subject, 대상을 아래로 직접 비추는. creates, 만들어낸다. a feeling of holiness and mystery, 신성함과 신비감이라는 느낌을. 이 문장 전체를 해석하면, 예를 들어, 대상을 아래로 직접 비추는 빛은 신성함과 신비감을 만들어낸다.","hl":"m"},{"n":43,"text":"이 문장은 광원의 위치가 만드는 극적 효과를 구체적인 예로 보여 줘요. 빛이 위에서 아래로 곧장 내리쬐면 그림자가 강해지면서 신성함과 신비감이 생긴다는 거죠. 앞 문장의 다양한 극적 효과라는 말을 바로 뒷받침하는 사례예요.","hl":"mn"},{"n":44,"text":"어법 포인트 세 가지 짚어 볼게요. 첫 번째, shining directly down on the subject는 앞에 있는 a light를 뒤에서 꾸며 주는 현재분사구예요. 빛이 비추는 쪽이니까 수동이 아니라 현재분사 shining을 씁니다. 두 번째, 주어가 a light 하나라서 동사에 s가 붙은 creates가 와요. 세 번째, a feeling of holiness and mystery에서 of 이하는 feeling의 내용을 풀어 주고, holiness와 mystery는 and로 나란히 연결된 병렬 구조예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 조명 기술과 효과를 이해하는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Understanding \u003c/span>\u003cspan class=\"tgt\">these \u003c/span>\u003cspan class=\"tgt\">lighting \u003c/span>\u003cspan class=\"tgt\">techniques \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">effects\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만든다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">makes \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">영화를 보는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">watching \u003c/span>\u003cspan class=\"tgt\">movies \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">훨씬 더 흥미롭게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">even \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">exciting\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이러한 조명 기술과 효과를 이해하는 것은 영화를 보는 것을 훨씬 더 흥미롭게 만든다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글 전체를 정리하는 결론 문장이에요. 앞에서 설명한 밝기, 그림자, 광원의 위치 같은 \u003cb class=\"key\">조명 \u003c/b>\u003cb class=\"key\">기술\u003c/b>을 알면 영화 감상이 더 즐거워진다고 말하죠. 결국 이 글의 목적이 '조명을 이해하고 영화를 더 재미있게 보자'는 \u003cb class=\"key\">당부\u003c/b>라는 점을 분명히 해 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사구 주어\u003c/span> : [Understanding ~ (동명사구/주어)] + [makes (단수 동사)] : \"이러한 조명 기술과 효과를 이해하는 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">5형식(make + 목적어 + 목적격보어)\u003c/span> : [make] + [watching movies (목적어)] + [even more exciting (목적격보어)] : \"영화를 보는 것을 훨씬 더 흥미롭게 만든다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">비교급 강조 부사 even\u003c/span> : [even (강조 부사)] + [more exciting (비교급)] : \"훨씬 더 흥미롭게\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"Understanding these lighting techniques and their effects, 이러한 조명 기술과 효과를 이해하는 것은. makes, 만든다. watching movies, 영화를 보는 것을. even more exciting, 훨씬 더 흥미롭게. 이 문장 전체를 해석하면, 이러한 조명 기술과 효과를 이해하는 것은 영화를 보는 것을 훨씬 더 흥미롭게 만든다.","hl":"m"},{"n":46,"text":"이 문장은 글 전체를 정리하는 결론이에요. 앞에서 설명한 밝기와 그림자, 그리고 광원의 위치 같은 조명 기술을 알면 영화 감상이 더 즐거워진다고 말하죠. 결국 이 글은 조명을 이해하고 영화를 더 재미있게 보자는 당부를 담고 있습니다.","hl":"mn"},{"n":47,"text":"어법 포인트 세 가지예요. 첫 번째, Understanding these lighting techniques and their effects는 동명사구가 통째로 주어가 된 구조예요. 동명사구 주어는 단수로 취급해서 동사가 makes가 됩니다. 두 번째, makes watching movies even more exciting은 make가 목적어와 목적격보어를 함께 데리고 와서 목적어를 어떻게 만들다라고 말하는 형식이에요. 여기서는 watching movies가 목적어, even more exciting이 목적격보어죠. 세 번째, even은 비교급 more exciting 앞에서 훨씬이라고 강조해 주는 부사예요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>영화에서 조명은 대상을 보이게 하는 것을 넘어 관객의 \u003cb class=\"key\">시선과 \u003c/b>\u003cb class=\"key\">감정\u003c/b>을 조절하는 장치이다.\u003c/li>\u003cli>밝게 비춰지는 대상은 \u003cb class=\"key\">관심\u003c/b>을 끌고, 어둑하게 비춰지는 대상은 호기심과 \u003cb class=\"key\">두려움\u003c/b>을 유발한다.\u003c/li>\u003cli>그림자를 최소화하면 밝고 쾌활한 분위기의 \u003cb class=\"key\">코미디·액션\u003c/b> 영화에, 강한 대비를 만들면 \u003cb class=\"key\">긴장감\u003c/b>을 주는 공포 영화에 쓰인다.\u003c/li>\u003cli>광원의 \u003cb class=\"key\">위치\u003c/b>까지 활용하면 다양한 극적 효과가 생기므로, 이 조명 기법들을 이해하면 영화 감상이 더 \u003cb class=\"key\">흥미로워진다\u003c/b>.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Lighting techniques in movies, such as brightness, shadows, and the position of the light source, create specific atmospheres and emotions.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">영화에서 \u003cb class=\"key\">조명\u003c/b>은 단순히 대상이 보이게 하는 것을 넘어, 밝기와 \u003cb class=\"key\">그림자\u003c/b>, 광원의 위치를 통해 관객의 관심과 감정, 그리고 장면의 \u003cb class=\"key\">분위기\u003c/b>를 만들어 내는 중요한 기법이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":48,"text":"오늘 내용 정리해 볼게요. 조명은 밝기로 관심과 두려움을 만들고, 그림자로 분위기와 장르를 결정하며, 광원의 위치로 신성함과 신비감까지 만들어 냅니다. 이 세 가지만 기억해도 영화 속 장면이 다르게 읽히기 시작할 거예요. 오늘도 수고하셨습니다, 다음 시간에 또 만나요!","hl":null}]}]});</script></body></html>
