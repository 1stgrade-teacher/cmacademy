<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터2 Reading04 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}

.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터2 Reading04","audioDir":"reading04_audio","preview":false,"count":43,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.520em\">Reading04\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터2\u003c/div>\u003ch1>The Life and Death of a Star: It All Depends on Mass\u003c/h1>\u003ch2>별의 탄생과 죽음: 모든 것은 질량에 달려 있다\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>별은 가스와 먼지의 구름이 중력으로 수축하고 핵융합이 시작되면서 탄생하며, 연료가 다 떨어진 뒤의 운명은 처음에 모인 \u003cb class=\"key\">먼지의 \u003c/b>\u003cb class=\"key\">양\u003c/b>, 즉 \u003cb class=\"key\">질량\u003c/b>에 달려 있다. 대부분의 별은 연료를 다 써버리고 일련의 단계를 거쳐 다시 \u003cb class=\"key\">가스와 \u003c/b>\u003cb class=\"key\">먼지의 \u003c/b>\u003cb class=\"key\">구름\u003c/b>으로 돌아간다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>A star is born when a cloud of gas and dust contracts under gravity and starts nuclear fusion, and what happens after it dies depends on how much mass gathered in the first place.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 별이 어떻게 태어나고 어떻게 죽는지를 다룬 지문을 함께 읽어 볼 거예요. 이 글은 별이 가스와 먼지의 구름에서 시작해서 핵융합으로 빛나다가, 연료가 다 떨어지면 어떤 최후를 맞는지를 설명하고 있죠. 요지는 별이 태어나는 과정과, 연료가 바닥난 뒤의 운명이 처음 모인 질량에 달려 있다는 것입니다. 그럼 차근차근 들어가 볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">별은 수소 같은 \u003cb class=\"key\">가스\u003c/b>와 미세한 \u003cb class=\"key\">먼지\u003c/b>가 중력으로 뭉쳐서 만들어집니다. 이렇게 만들어진 덩어리를 성운(nebula)이라고 부르고, 중심부가 뜨거워지면 \u003cb class=\"key\">핵융합\u003c/b>(nuclear fusion)이 시작되면서 스스로 빛을 냅니다. 핵융합은 가벼운 원자핵들이 합쳐져 더 무거운 원자핵이 되는 과정으로, 이때 나오는 엄청난 \u003cb class=\"key\">에너지\u003c/b>가 별의 빛과 열이 됩니다. 그래서 연료가 떨어지면 별은 더는 빛나지 못하고 죽음을 맞습니다. 별의 일생은 장작을 때는 난로와 비슷해서, 장작이 다 타면 불이 꺼지듯 별도 연료가 바닥나면 더는 빛나지 못합니다. \u003cb class=\"key\">질량\u003c/b>이 큰 별일수록 연료를 빠르게 태워 수명이 짧고, 질량이 작은 별은 연료를 아껴 쓰며 오래 살다가 아주 천천히 사라집니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식부터 짚어 볼게요. 별은 수소 같은 gas와 아주 작은 dust가 중력으로 뭉쳐서 만들어집니다. 이렇게 뭉친 덩어리를 nebula, 우리말로 성운이라고 부르는데, 중심부가 뜨거워지면서 nuclear fusion, 즉 핵융합이 시작되면 스스로 빛을 내는 별이 되죠. 핵융합은 가벼운 원자핵이 합쳐져 더 무거운 원자핵이 되는 과정이고, 이때 엄청난 energy가 나옵니다. 쉽게 말해 장작을 때는 난로와 같아요. 장작이 다 타면 불이 꺼지듯, 별도 연료가 바닥나면 더는 빛나지 못합니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>별의 탄생\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>별은 \u003cb class=\"key\">가스와 \u003c/b>\u003cb class=\"key\">먼지\u003c/b>의 구름으로 시작한다는 사실을 먼저 제시한다. 수백만 년이 지나면 \u003cb class=\"key\">중력\u003c/b>이 가스와 먼지에 함께 힘을 가하기 때문에 이 구름들은 \u003cb class=\"key\">수축\u003c/b>하기 시작한다. 즉 별의 출발점은 단단한 물체가 아니라 흩어져 있던 재료의 덩어리라는 점을 기억해야 한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>가열과 핵융합\u003csmall>과정 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>구름이 압축되면서 뜨거워져 \u003cb class=\"key\">젊은 \u003c/b>\u003cb class=\"key\">별\u003c/b>이 만들어진다. 화씨 \u003cb class=\"key\">2,700만 \u003c/b>\u003cb class=\"key\">도\u003c/b>에 도달하면 \u003cb class=\"key\">핵융합\u003c/b>을 시작할 만큼 충분히 뜨거워진다. 이 반응이 있어야 비로소 새로운 별이 형성된다는 점이 강조된다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>모양 유지와 빛\u003csmall>근거 · 문장 6\u003c/small>\u003c/h4>\u003cp>핵융합으로 나온 \u003cb class=\"key\">에너지\u003c/b>가 별을 존재하게 하는 힘이다. 그 에너지 덕분에 별은 자기 \u003cb class=\"key\">모양\u003c/b>을 유지하고 \u003cb class=\"key\">빛날\u003c/b> 수 있다. 결국 별이 빛난다는 것은 내부 반응이 계속 돌아가고 있다는 신호다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>죽음 이후를 묻다\u003csmall>전환 · 문장 7–8\u003c/small>\u003c/h4>\u003cp>연료가 다 떨어져 별이 죽으면 무엇이 일어나는지 \u003cb class=\"key\">질문\u003c/b>을 던진다. 답은 처음에 얼마나 많은 \u003cb class=\"key\">먼지\u003c/b>가 모였는가에 달려 있다. 다시 말해 별의 최후는 처음의 재료 양, 곧 \u003cb class=\"key\">질량\u003c/b>이 결정한다는 것이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>사례와 결론\u003csmall>결론 · 문장 9–10\u003c/small>\u003c/h4>\u003cp>태양 질량의 절반 이하의 질량을 가진 별들은 매우 천천히 \u003cb class=\"key\">사라진다\u003c/b>. 그러나 대부분의 별들은 연료를 다 써버리고 일련의 단계를 거쳐 마침내 \u003cb class=\"key\">가스와 \u003c/b>\u003cb class=\"key\">먼지의 \u003c/b>\u003cb class=\"key\">구름\u003c/b>으로 돌아간다. 결국 별의 일생은 재료에서 시작해 다시 재료로 돌아가는 \u003cb class=\"key\">순환\u003c/b>으로 정리된다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 다섯 단계로 나눠서 살펴볼게요.","hl":null},{"n":4,"text":"첫 단계는 별의 탄생입니다. 별은 clouds of gas and dust, 즉 가스와 먼지의 구름으로 시작해요. 수백만 년이 지나면 gravity, 중력이 이 가스와 먼지를 함께 끌어당기기 때문에 구름이 shrink, 수축하기 시작합니다. 별의 출발점은 단단한 물체가 아니라 흩어져 있던 재료의 덩어리라는 점을 기억해 두세요.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 구름이 가열됩니다. 구름이 squeeze, 압축되면서 뜨거워져 젊은 별이 만들어지죠. 화씨 이천칠백만 도에 reach, 도달하면 nuclear fusion을 시작할 만큼 충분히 뜨거워집니다. 바로 이 reaction이 있어야 새로운 별이 만들어질 수 있어요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 에너지의 역할입니다. 핵융합으로 나온 energy가 별을 존재하게 하는 힘이에요. 그 에너지 덕분에 별은 자기 shape, 모양을 유지하고 shine, 빛날 수 있습니다. 별이 빛난다는 건 내부에서 반응이 계속 돌아가고 있다는 신호라고 이해하면 됩니다.","hl":"f2"},{"n":7,"text":"네 번째 단계에서 글은 질문을 던집니다. 연료가 다 떨어지고 별이 죽을 때 무엇이 일어나는지 묻죠. 답은 처음에 얼마나 많은 dust가 gather, 모였는가에 달려 있습니다. 결국 별의 최후는 처음의 재료 양, 다시 말해 질량이 결정한다는 겁니다.","hl":"f3"},{"n":8,"text":"마지막 단계는 사례와 결론입니다. 태양 질량의 절반 이하의 질량을 가진 별들은 아주 천천히 fade away, 사라집니다. 반면 대부분의 별들은 연료를 use up, 다 써버리고 일련의 단계를 거쳐 마침내 clouds of gas and dust로 돌아가죠. 결국 별의 일생은 재료에서 시작해 다시 재료로 돌아가는 순환이라고 정리할 수 있습니다.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">질문-답변\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 8번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 별이 태어나 빛나는 과정을 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">순서\u003c/b>대로 설명하다가 일곱 번째 문장에서 \u003cb class=\"key\">질문\u003c/b>을 던진다. 여덟 번째 문장이 '처음에 얼마나 많은 먼지가 모였는가'에 달려 있다고 \u003cb class=\"key\">답\u003c/b>을 제시하므로 이것이 주제문이다. 이어지는 아홉 번째 문장은 \u003cb class=\"key\">예시\u003c/b>, 열 번째 문장은 일반적인 \u003cb class=\"key\">결론\u003c/b>으로 그 답을 뒷받침하므로 핵심 주장이 뒤쪽에 오는 미괄식이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>After millions of years (2)\u003c/b>\u003cspan>시간 경과 표시\u003c/span>\u003cb>because (2)\u003c/b>\u003cspan>원인 제시\u003c/span>\u003cb>If (4)\u003c/b>\u003cspan>조건 제시\u003c/span>\u003cb>For example (9)\u003c/b>\u003cspan>예시 제시\u003c/span>\u003cb>But (10)\u003c/b>\u003cspan>전환·대조\u003c/span>\u003cb>finally (10)\u003c/b>\u003cspan>시간 순서 마무리\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">clouds of gas and dust\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the gas and dust together\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">shrink\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">squeezed\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">use up their fuel\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">return to clouds of gas and dust\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"이 글은 질문에 답하는 방식으로 전개되는 미괄식 구조예요. 처음부터 여섯 번째 문장까지는 별이 태어나 빛나는 과정을 시간 순서대로 설명하다가, 일곱 번째 문장에서 연료가 떨어지면 어떻게 되는지 질문을 던집니다. 여덟 번째 문장에서 그 답을 제시하는데, 바로 처음에 모인 먼지의 양에 달려 있다는 것이죠. 그래서 핵심 주장이 글 뒤쪽에 놓이는 미괄식이고, 마지막 두 문장은 예시와 결론으로 그 답을 받쳐 줍니다.","hl":"ty"},{"n":10,"text":"신호어도 눈여겨보세요. After millions of years나 finally 같은 표현은 시간의 흐름을 알려 주고, because는 원인을, If는 조건을 표시합니다. For example이 나오면 앞의 주장을 뒷받침하는 예시가 이어진다는 뜻이고, 마지막 문장의 But은 앞의 예시와 다른 일반적인 경우로 시선을 돌리는 전환 신호예요. 또 shrink와 squeezed처럼 같은 개념을 다르게 표현한 재진술도 놓치지 마세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>start out\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>시작하다, 출발하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>cloud\u003c/b>\u003cem>명사\u003c/em>\u003cspan>구름; (가스·먼지의) 덩어리\u003c/span>\u003c/div>\u003cdiv>\u003cb>dust\u003c/b>\u003cem>명사\u003c/em>\u003cspan>먼지\u003c/span>\u003c/div>\u003cdiv>\u003cb>shrink\u003c/b>\u003cem>동사\u003c/em>\u003cspan>수축하다, 줄어들다\u003c/span>\u003c/div>\u003cdiv>\u003cb>gravity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>중력\u003c/span>\u003c/div>\u003cdiv>\u003cb>force\u003c/b>\u003cem>동사\u003c/em>\u003cspan>강제로 ~하게 하다, 밀어붙이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>squeeze\u003c/b>\u003cem>동사\u003c/em>\u003cspan>압축하다, 짜내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>heat up\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>가열되다, 뜨거워지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>form\u003c/b>\u003cem>동사\u003c/em>\u003cspan>형성하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>reach\u003c/b>\u003cem>동사\u003c/em>\u003cspan>도달하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>degree\u003c/b>\u003cem>명사\u003c/em>\u003cspan>도(온도 단위)\u003c/span>\u003c/div>\u003cdiv>\u003cb>Fahrenheit\u003c/b>\u003cem>명사\u003c/em>\u003cspan>화씨(의)\u003c/span>\u003c/div>\u003cdiv>\u003cb>nuclear fusion\u003c/b>\u003cem>명사\u003c/em>\u003cspan>핵융합\u003c/span>\u003c/div>\u003cdiv>\u003cb>reaction\u003c/b>\u003cem>명사\u003c/em>\u003cspan>반응\u003c/span>\u003c/div>\u003cdiv>\u003cb>be needed for\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 필요하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>energy\u003c/b>\u003cem>명사\u003c/em>\u003cspan>에너지\u003c/span>\u003c/div>\u003cdiv>\u003cb>enable\u003c/b>\u003cem>동사\u003c/em>\u003cspan>~할 수 있게 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>keep\u003c/b>\u003cem>동사\u003c/em>\u003cspan>유지하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>shape\u003c/b>\u003cem>명사\u003c/em>\u003cspan>모양, 형태\u003c/span>\u003c/div>\u003cdiv>\u003cb>shine\u003c/b>\u003cem>동사\u003c/em>\u003cspan>빛나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>fuel\u003c/b>\u003cem>명사\u003c/em>\u003cspan>연료\u003c/span>\u003c/div>\u003cdiv>\u003cb>run out\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>다 떨어지다, 고갈되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>depend on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 달려 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>gather\u003c/b>\u003cem>동사\u003c/em>\u003cspan>모이다, 모으다\u003c/span>\u003c/div>\u003cdiv>\u003cb>in the first place\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>처음에, 애초에\u003c/span>\u003c/div>\u003cdiv>\u003cb>mass\u003c/b>\u003cem>명사\u003c/em>\u003cspan>질량\u003c/span>\u003c/div>\u003cdiv>\u003cb>fade away\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>서서히 사라지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>use up\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>다 써버리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>a series of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>일련의\u003c/span>\u003c/div>\u003cdiv>\u003cb>finally\u003c/b>\u003cem>부사\u003c/em>\u003cspan>마침내, 결국\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"핵심 단어도 몇 개 짚을게요. shrink는 수축하다, squeeze는 압축하다라는 뜻이고, enable은 할 수 있게 하다, run out은 다 떨어지다라는 표현입니다. depend on은 달려 있다, fade away는 서서히 사라지다로 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">shrink\u003c/b>\u003cspan class=\"m\">수축하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">contract\u003c/span>\u003cspan class=\"s\">reduce\u003c/span>\u003cspan class=\"s\">decrease\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">expand\u003c/span>\u003cspan class=\"a\">grow\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">force\u003c/b>\u003cspan class=\"m\">강제로 ~하게 하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">compel\u003c/span>\u003cspan class=\"s\">drive\u003c/span>\u003cspan class=\"s\">push\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">restrain\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">gather\u003c/b>\u003cspan class=\"m\">모이다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">collect\u003c/span>\u003cspan class=\"s\">accumulate\u003c/span>\u003cspan class=\"s\">assemble\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">scatter\u003c/span>\u003cspan class=\"a\">disperse\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">enable\u003c/b>\u003cspan class=\"m\">~할 수 있게 하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">allow\u003c/span>\u003cspan class=\"s\">permit\u003c/span>\u003cspan class=\"s\">let\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">prevent\u003c/span>\u003cspan class=\"a\">block\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">run out\u003c/b>\u003cspan class=\"m\">다 떨어지다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">be used up\u003c/span>\u003cspan class=\"s\">give out\u003c/span>\u003cspan class=\"s\">be exhausted\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">fade away\u003c/b>\u003cspan class=\"m\">서서히 사라지다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">disappear\u003c/span>\u003cspan class=\"s\">vanish\u003c/span>\u003cspan class=\"s\">dwindle\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">brighten\u003c/span>\u003cspan class=\"a\">intensify\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">depend on\u003c/b>\u003cspan class=\"m\">~에 달려 있다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">rely on\u003c/span>\u003cspan class=\"s\">hinge on\u003c/span>\u003cspan class=\"s\">be determined by\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">finally\u003c/b>\u003cspan class=\"m\">마침내\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">eventually\u003c/span>\u003cspan class=\"s\">ultimately\u003c/span>\u003cspan class=\"s\">at last\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">initially\u003c/span>\u003cspan class=\"a\">first\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어도 함께 정리해 볼게요. shrink는 contract, reduce와 비슷하고 반대말은 expand나 grow입니다. gather는 collect, accumulate와 가깝고 반대는 scatter, disperse죠. run out은 be exhausted나 give out으로 바꿔 쓸 수 있고, fade away는 disappear, vanish와 비슷하며 반대말은 brighten입니다. depend on은 rely on, hinge on으로 바꿔 쓸 수 있다는 점도 기억해 주세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">별들은 출발한다\u003c/span>\u003cspan class=\"en\">Stars \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">start \u003c/span>\u003cspan class=\"tgt\">out \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">구름으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">as\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">clouds \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가스와 먼지로 이루어진\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">gas \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">dust\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">별들은 가스와 먼지의 구름으로 시작한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 별의 일생을 설명하는 글의 첫 문장으로, 별이 \u003cb class=\"key\">가스와 \u003c/b>\u003cb class=\"key\">먼지\u003c/b>의 구름에서 시작한다는 \u003cb class=\"key\">출발점\u003c/b>을 제시해요. 이후 문장에서 별이 어떻게 변해 가는지 설명하기 위한 도입 역할을 하는 문장이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 as의 용법(~로서, ~로)\u003c/span> : start out [자동사] + as + [명사(역할·자격)] : \"구름으로 시작한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 of(~로 이루어진, ~의)\u003c/span> : [명사] + of + [재료·구성 명사] : \"가스와 먼지로 이루어진 구름\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"Stars start out, 별들은 출발한다. as clouds, 구름으로. of gas and dust, 가스와 먼지로 이루어진. 이 문장 전체를 해석하면, 별들은 가스와 먼지의 구름으로 시작한다.","hl":"m"},{"n":14,"text":"이 문장은 별의 일생을 여는 첫 문장이에요. 별이 가스와 먼지로 이루어진 구름에서 출발한다는 출발점을 먼저 제시하는 거죠. 그래서 앞으로 별이 어떻게 변해 가는지 궁금하게 만드는 도입 역할을 해요.","hl":"mn"},{"n":15,"text":"먼저 start out as를 보세요. start out은 출발하다라는 자동사이고, 뒤에 붙은 as는 으로서라는 자격을 나타내요. 그래서 as clouds는 별이 처음에 구름 상태라는 걸 보여 주죠. 그리고 clouds of gas and dust에서 of는 앞의 명사가 무엇으로 구성되는지 알려 주는 역할이에요. 그래서 가스와 먼지로 이루어진 구름이라는 뜻이 되는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수백만 년 후에,\u003c/span>\u003cspan class=\"en\">After millions of years,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 구름들은 수축하기 시작한다\u003c/span>\u003cspan class=\"en\">these clouds \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">begin \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">shrink\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">중력이 힘을 가하기 때문에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">because \u003c/span>\u003cspan class=\"tgt\">gravity \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">forces \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가스와 먼지를 함께\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">gas \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">dust \u003c/span>\u003cspan class=\"tgt\">together\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">수백만 년 후에, 중력이 가스와 먼지에 함께 힘을 가하기 때문에 이 구름들은 수축하기 시작한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 별의 재료인 구름이 왜 줄어드는지를 알려 주는 문장이에요. 시간이 흐른 뒤 \u003cb class=\"key\">중력\u003c/b> 때문에 구름이 수축한다는 원인과 결과를 한 번에 보여 주죠. 앞 문장에서 별이 구름에서 시작한다고 했으니 그다음 단계로 자연스럽게 이어지는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사를 목적어로 취하는 동사(begin)\u003c/span> : begin + [to shrink (to부정사/목적어)] : \"수축하기 시작한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이유를 나타내는 접속사 because\u003c/span> : [주절] + because + [주어 + 동사 (이유 부사절)] : \"중력이 힘을 가하기 때문에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">타동사 force + 목적어 + 부사(together)\u003c/span> : force + [목적어(the gas and dust)] + [together (부사)] : \"가스와 먼지를 함께 힘을 가하다(한데 모으다)\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"After millions of years, 수백만 년 후에. these clouds begin to shrink, 이 구름들은 수축하기 시작한다. because gravity forces, 중력이 힘을 가하기 때문에. the gas and dust together, 가스와 먼지를 함께. 이 문장 전체를 해석하면, 수백만 년 후에, 중력이 가스와 먼지에 함께 힘을 가하기 때문에 이 구름들은 수축하기 시작한다.","hl":"m"},{"n":17,"text":"이 문장은 별의 재료인 구름이 왜 줄어드는지 알려 줘요. 시간이 흐른 뒤 중력 때문에 구름이 수축한다는 원인과 결과를 한 번에 보여 주죠. 앞 문장에서 별이 구름에서 시작한다고 했으니 그다음 단계로 자연스럽게 이어지는 문장이에요.","hl":"mn"},{"n":18,"text":"먼저 begin to shrink를 보세요. begin은 뒤에 to부정사를 목적어로 데려와서 하기 시작하다라는 뜻을 만들어요. 시작을 나타내는 동사라서 동명사보다 to부정사를 주로 쓴다는 점도 기억해 두세요. 두 번째로 because는 앞 문장의 원인을 뒤에서 설명하는 접속사예요. 구름이 수축하는 이유가 중력이라는 걸 분명히 밝혀 주죠. 마지막으로 forces the gas and dust together에서 force는 힘을 가하다라는 타동사이고, 목적어 뒤에 together가 붙어서 함께 한데 모으다라는 의미를 완성해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 압축되면서,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">As \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">squeezed\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">구름은 가열된다\u003c/span>\u003cspan class=\"en\">the cloud heats up\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">젊은 별을 형성하기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">form \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">young \u003c/span>\u003cspan class=\"tgt\">star\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것이 압축되면서, 구름은 젊은 별을 형성하기 위해 가열된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 수축한 구름이 열을 얻어 별이 되어 가는 과정을 이어서 보여 주는 문장이에요. 압축되면 온도가 올라가고, 그 열이 결국 젊은 별을 만든다는 흐름을 담고 있죠. 여기서 it은 앞 문장의 the cloud를 가리키고, 앞 문장의 수축이 이 문장의 가열로 자연스럽게 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간을 나타내는 접속사 As + 수동태\u003c/span> : As + [주어 + be동사 + p.p. (수동태)] : \"그것이 압축되면서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : heats up + [to form a young star (to부정사구/목적)] : \"젊은 별을 형성하기 위해\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"As it is squeezed, 그것이 압축되면서. the cloud heats up, 구름은 가열된다. to form a young star, 젊은 별을 형성하기 위해. 이 문장 전체를 해석하면, 그것이 압축되면서, 구름은 젊은 별을 형성하기 위해 가열된다.","hl":"m"},{"n":20,"text":"이 문장은 수축한 구름이 열을 얻어 별이 되어 가는 과정을 이어서 보여 줘요. 압축되면 온도가 올라가고, 그 열이 결국 젊은 별을 만든다는 흐름을 담고 있죠. 여기서 it은 앞 문장의 the cloud를 가리키고, 앞 문장의 수축이 이 문장의 가열로 자연스럽게 이어지는 거예요.","hl":"mn"},{"n":21,"text":"먼저 As it is squeezed를 보세요. as는 하면서라는 시간을 나타내는 접속사이고, 뒤에는 be동사와 과거분사가 붙은 수동태가 와서 압축된다는 수동의 의미를 만들어요. 두 번째로 to form a young star에서 to부정사는 하기 위해라는 목적을 나타내는 부사구로 쓰였어요. 구름이 가열되는 이유를 뒤에서 설명해 주는 역할이죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 이것이 도달한다면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">If \u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">reaches \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">화씨 2,700만 도에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">27 \u003c/span>\u003cspan class=\"tgt\">million \u003c/span>\u003cspan class=\"tgt\">degrees \u003c/span>\u003cspan class=\"tgt\">Fahrenheit\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 충분히 뜨겁다\u003c/span>\u003cspan class=\"en\">it is \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">hot \u003c/span>\u003cspan class=\"tgt\">enough \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">핵융합을 시작할 만큼\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">start\u003c/span> nuclear fusion.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">만약 이것이 화씨 2,700만 도에 도달한다면, 핵융합을 시작할 만큼 충분히 뜨겁다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 구름이 압축되면서 뜨거워져 어린 별이 된다고 했죠. 이 문장은 그 온도가 화씨 2,700만 도까지 올라가야 \u003cb class=\"key\">핵융합\u003c/b>이 시작된다는 조건을 제시해요. 결국 이만큼 뜨거워져야 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">별\u003c/b>이 제대로 태어날 수 있다는 뜻이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조건의 부사절 접속사 if\u003c/span> : If + 주어 + 동사, 주어 + 동사 : \"만약 이것이 화씨 2,700만 도에 도달한다면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">enough to부정사(부사적 용법·정도)\u003c/span> : 형용사 + enough + to부정사 → '~할 만큼 충분히 …한' : \"핵융합을 시작할 만큼 충분히 뜨거운\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"If this reaches, 만약 이것이 도달한다면. 27 million degrees Fahrenheit, 화씨 2,700만 도에. it is hot enough, 그것은 충분히 뜨겁다. to start nuclear fusion, 핵융합을 시작할 만큼. 이 문장 전체를 해석하면, 만약 이것이 화씨 2,700만 도에 도달한다면, 핵융합을 시작할 만큼 충분히 뜨겁다.","hl":"m"},{"n":23,"text":"구름이 압축되면서 뜨거워진다는 앞 내용을 이어받은 문장이에요. 온도가 화씨 이천칠백만 도까지 올라가야 핵융합이 시작된다는 조건을 말하고 있죠. 결국 이만큼 뜨거워져야 새로운 별이 제대로 태어난다는 뜻이에요.","hl":"mn"},{"n":24,"text":"먼저 if는 만약이라는 조건을 이끄는 접속사예요. 조건절에서는 앞으로의 일도 현재시제 reaches로 쓴다는 점을 꼭 기억하세요. 두 번째로 hot enough to start에서 enough는 형용사 뒤에 붙어 정도를 나타내요. 뒤의 to부정사는 그 정도를 설명하는 부사적 용법이고요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 반응은\u003c/span>\u003cspan class=\"en\">This reaction\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">필요하다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">needed\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새로운 별이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">new \u003c/span>\u003cspan class=\"tgt\">star \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">형성되기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">form\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 반응은 새로운 별이 형성되기 위해 필요하다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 핵융합 반응이 있어야만 새로운 별이 만들어질 수 있다는 것을 정리한 문장이에요. 즉 이 반응은 별이 \u003cb class=\"key\">형성\u003c/b>되는 데 반드시 갖춰져야 하는 \u003cb class=\"key\">조건\u003c/b>이라는 뜻이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태(be동사 + 과거분사)\u003c/span> : be동사 + 과거분사(needed) : \"필요하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 의미상 주어(for + 목적격)\u003c/span> : for + 목적격 + to부정사 : \"새로운 별이 형성되기 위해\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"This reaction, 이 반응은. is needed, 필요하다. for a new star, 새로운 별이. to form, 형성되기 위해. 이 문장 전체를 해석하면, 이 반응은 새로운 별이 형성되기 위해 필요하다.","hl":"m"},{"n":26,"text":"앞에서 나온 핵융합 반응이 있어야 새로운 별이 만들어질 수 있다는 걸 정리한 문장이에요. 그래서 이 반응은 별이 형성되는 데 꼭 갖춰져야 하는 조건이라고 볼 수 있겠죠.","hl":"mn"},{"n":27,"text":"첫 번째로 is needed는 수동태예요. be동사에 과거분사가 붙어서 '필요하게 되다'가 되고, 우리말로는 그냥 필요하다로 읽으면 됩니다. 두 번째로 for a new star to form에서 to form의 주체는 a new star죠. 이렇게 to부정사 앞에 for와 목적격을 붙여 의미상 주어를 밝혀 준다는 점을 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 에너지는\u003c/span>\u003cspan class=\"en\">The energy\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">별이 가능하게 한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">enables \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">star\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것의 모양을 유지하는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">keep \u003c/span>\u003cspan class=\"tgt\">its \u003c/span>\u003cspan class=\"tgt\">shape \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 빛나는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">shine\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 에너지는 별이 그것의 모양을 유지하고 빛날 수 있게 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 핵융합으로 생긴 에너지가 별을 붙잡아 주는 힘이 된다는 내용이에요. 그 덕분에 별은 \u003cb class=\"key\">모양\u003c/b>을 잃지 않고 계속 \u003cb class=\"key\">빛날\u003c/b> 수 있다는 것이죠. 에너지의 기능을 한 문장으로 정리한 핵심 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">목적격보어를 갖는 동사 enable\u003c/span> : enable + 목적어 + to부정사(목적격보어) : \"별이 (~하도록) 가능하게 한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사 안의 동사원형 병렬\u003c/span> : to + 동사원형 A and (to) 동사원형 B : \"그것의 모양을 유지하고 빛나는 것\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"The energy, 그 에너지는. enables a star, 별이 가능하게 한다. to keep its shape, 그것의 모양을 유지하는 것을. and shine, 그리고 빛나는 것을. 이 문장 전체를 해석하면, 그 에너지는 별이 그것의 모양을 유지하고 빛날 수 있게 한다.","hl":"m"},{"n":29,"text":"핵융합으로 생긴 에너지가 별을 붙잡아 주는 힘이 된다는 내용이에요. 그 덕분에 별은 모양을 잃지 않고 계속 빛날 수 있다는 거죠. 에너지의 역할을 한 문장으로 정리한 아주 중요한 문장이에요.","hl":"mn"},{"n":30,"text":"먼저 enables는 목적어 뒤에 to부정사를 목적격보어로 데려오는 동사예요. 그래서 별이 어떤 상태가 되도록 가능하게 한다는 틀로 읽으면 됩니다. 두 번째로 to keep its shape and shine에서 keep과 shine은 and로 나란히 이어진 병렬 구조예요. 앞에 있는 to가 두 동사 모두에 걸린다고 생각하시면 쉬워요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무엇이 일어나는가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">What \u003c/span>\u003cspan class=\"tgt\">happens\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">연료가 다 떨어질 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">fuel \u003c/span>\u003cspan class=\"tgt\">runs \u003c/span>\u003cspan class=\"tgt\">out \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 별이 죽을 때?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">star \u003c/span>\u003cspan class=\"tgt\">dies\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">연료가 다 떨어지고 별이 죽을 때 무엇이 일어나는가?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 별의 죽음 다음에 벌어지는 일을 묻는 \u003cb class=\"key\">도입 \u003c/b>\u003cb class=\"key\">질문\u003c/b>이에요. 앞 문장에서 '별이 죽는다'는 상황을 던진 뒤, 그 결과가 하나로 정해져 있지 않음을 질문 형식으로 자연스럽게 이어 주는 역할을 해요. when은 '~할 때'라는 \u003cb class=\"key\">시간\u003c/b>의 의미로, 두 가지 일인 연료 고갈과 별의 죽음을 and로 나란히 묶었어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문사가 주어인 의문문\u003c/span> : What(의문사=주어) + happens(자동사) : \"무엇이 일어나는가\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">시간 부사절 (접속사 when)\u003c/span> : when + [주어] + [동사] : \"연료가 다 떨어질 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">and에 의한 절의 병렬\u003c/span> : [절 A] + and + [절 B] : \"연료가 다 떨어지고 별이 죽는다\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"What happens, 무엇이 일어나는가. when the fuel runs out, 연료가 다 떨어질 때. and the star dies?, 그리고 별이 죽을 때?. 이 문장 전체를 해석하면, 연료가 다 떨어지고 별이 죽을 때 무엇이 일어나는가?","hl":"m"},{"n":32,"text":"이 문장은 별이 죽으면 그다음에 어떤 일이 벌어지는지 학생들에게 던지는 질문이에요. 바로 다음 문장에서 그 답을 알려 주기 때문에 글의 흐름을 자연스럽게 이어 주는 도입 질문이죠.","hl":"mn"},{"n":33,"text":"첫 번째로 What happens에서 What은 의문사이면서 동시에 주어예요. 그래서 do나 does 같은 조동사를 넣지 않고 동사 happens를 바로 붙여요. 두 번째로 when은 시간을 나타내는 접속사라서 뒤에 주어와 동사가 다 있는 절이 와요. 세 번째로 the fuel runs out과 the star dies가 and로 나란히 연결된 병렬 구조라는 점도 꼭 챙겨 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 ~에 달려 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It \u003c/span>\u003cspan class=\"tgt\">depends \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">얼마나 많은 먼지가 모였는가에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">much \u003c/span>\u003cspan class=\"tgt\">dust \u003c/span>\u003cspan class=\"tgt\">gathered\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">애초에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">first \u003c/span>\u003cspan class=\"tgt\">place\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 처음에 얼마나 많은 먼지가 모였는가에 달려 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞의 질문에 대한 답으로, 별의 최후가 하나로 정해진 게 아니라 어떤 \u003cb class=\"key\">조건\u003c/b>에 따라 달라진다고 말해요. 그 조건은 바로 '처음에 얼마나 많은 \u003cb class=\"key\">먼지\u003c/b>가 모였는가'예요. depend on 뒤에 how much dust gathered라는 \u003cb class=\"key\">의문사절\u003c/b>이 통째로 와서 '무엇에 달려 있는지'를 채워 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">간접의문문 (의문사절)\u003c/span> : depend on + [how much + 명사 + 동사] : \"그것은 얼마나 많은 먼지가 모였는가에 달려 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관용 표현 (부사구)\u003c/span> : in the first place = 애초에, 처음부터 : \"애초에, 처음에\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"It depends on, 그것은 ~에 달려 있다. how much dust gathered, 얼마나 많은 먼지가 모였는가에. in the first place, 애초에. 이 문장 전체를 해석하면, 그것은 처음에 얼마나 많은 먼지가 모였는가에 달려 있다.","hl":"m"},{"n":35,"text":"앞에서 던진 질문에 대한 답이에요. 별이 죽는 방식은 하나로 정해진 게 아니라 처음에 먼지가 얼마나 모였는지에 따라 달라진다는 거죠.","hl":"mn"},{"n":36,"text":"첫 번째로 depend on 뒤에 how much dust gathered가 통째로 왔어요. 이건 간접의문문이라서 의문사 다음에 주어와 동사가 오는 평서문 어순을 지켜요. 두 번째로 in the first place는 애초에라는 뜻의 관용 표현이고, 문장 끝에서 시간 의미를 더해 준답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들어,\u003c/span>\u003cspan class=\"en\">For example,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">별들은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">stars \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">태양의 절반 이하의 질량을 가진\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">less \u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">half \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">mass \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">sun\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사라진다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">fade \u003c/span>\u003cspan class=\"tgt\">away\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매우 천천히\u003c/span>\u003cspan class=\"en\">very slowly.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">예를 들어, 태양의 절반 이하의 질량을 가진 별들은 매우 천천히 사라진다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 말한 '먼지 양에 따라 달라진다'는 내용을 구체적인 \u003cb class=\"key\">예시\u003c/b>로 보여 주는 문장이에요. 질량이 태양의 절반도 안 되는 작은 별은 매우 천천히 \u003cb class=\"key\">사라진다\u003c/b>는 경우를 든 거예요. with는 '~을 가진'이라는 뜻으로 stars를 뒤에서 꾸며 주는 \u003cb class=\"key\">수식어구\u003c/b>를 이끌어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 with의 형용사적 용법\u003c/span> : [명사] + with + [명사구] : \"태양의 절반 이하의 질량을 가진 별들은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">비교급 (less than)\u003c/span> : less than + [명사] : \"태양 질량의 절반 이하\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">구동사 (동사 + 부사)\u003c/span> : fade + away : \"사라지다\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"For example, 예를 들어. stars, 별들은. with less than half the mass of the sun, 태양의 절반 이하의 질량을 가진. fade away, 사라진다. very slowly, 매우 천천히. 이 문장 전체를 해석하면, 예를 들어, 태양의 절반 이하의 질량을 가진 별들은 매우 천천히 사라진다.","hl":"m"},{"n":38,"text":"앞에서 별의 죽음이 먼지 양에 달려 있다고 했죠. 이 문장은 그걸 구체적인 예시로 보여 줘요. 질량이 작은 별은 아주 천천히 사라진다는 경우를 든 거예요.","hl":"mn"},{"n":39,"text":"첫 번째로 with는 여기서 갖다라는 뜻으로 stars를 뒤에서 꾸며 주는 수식어구를 이끌어요. 두 번째로 less than은 비교급 표현이라서 태양 질량의 절반보다 적다는 의미를 만들어요. 세 번째로 fade away는 동사에 away가 붙어서 서서히 사라지다라는 뜻을 가진 구동사가 된 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 대부분의 별들은\u003c/span>\u003cspan class=\"en\">But \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">most \u003c/span>\u003cspan class=\"tgt\">stars\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 연료를 다 써버리고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">use \u003c/span>\u003cspan class=\"tgt\">up\u003c/span> their fuel\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 마침내 돌아간다\u003c/span>\u003cspan class=\"en\">and finally \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">return \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가스와 먼지의 구름으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">clouds \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">gas \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">dust\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일련의 단계를 거쳐\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">after \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">series \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">steps\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 대부분의 별들은 그들의 연료를 다 써버리고 일련의 단계를 거쳐 마침내 가스와 먼지의 구름으로 돌아간다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 별들의 일반적인 최후를 정리하는 문장이에요. 바로 앞에서 질량이 작은 별은 아주 천천히 사라진다고 했으니, But으로 \u003cb class=\"key\">대조\u003c/b>하며 '대부분의 별'은 다른 길을 간다고 말하는 거죠. 연료를 다 쓴 별이 가스와 먼지의 구름으로 \u003cb class=\"key\">되돌아간다\u003c/b>는 표현은 첫 문장의 시작 상태로 다시 돌아가는 별의 \u003cb class=\"key\">순환\u003c/b>을 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">most + 복수 가산명사(형용사적 용법)\u003c/span> : most + [복수명사 stars] → '[[대부분의]] ~' : \"대부분의 별들은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">구동사(동사+부사)의 타동사 용법\u003c/span> : use up + [목적어 their fuel] : \"그들의 연료를 다 써버리고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">자동사 return + 전치사 to\u003c/span> : return [자동사] + to + [도달점] : \"가스와 먼지의 구름으로 돌아간다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">전치사 after의 부사구\u003c/span> : after + [명사구 a series of steps] → 문장 전체를 수식하는 [[부사구]] : \"일련의 단계를 거쳐\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"But most stars, 그러나 대부분의 별들은. use up their fuel, 그들의 연료를 다 써버리고. and finally return, 그리고 마침내 돌아간다. to clouds of gas and dust, 가스와 먼지의 구름으로. after a series of steps, 일련의 단계를 거쳐. 이 문장 전체를 해석하면, 그러나 대부분의 별들은 그들의 연료를 다 써버리고 일련의 단계를 거쳐 마침내 가스와 먼지의 구름으로 돌아간다.","hl":"m"},{"n":41,"text":"이 문장은 별들의 일반적인 마지막 모습을 정리해 주는 문장이에요. 앞 문장에서 질량이 작은 별은 아주 천천히 사라진다고 했죠? 그래서 여기서는 But, 즉 대조를 걸어서 대부분의 별은 그렇게 사라지는 게 아니라고 말해 주는 겁니다. 연료를 다 써버린 별이 가스와 먼지의 구름으로 되돌아간다는 건, 첫 문장에서 별이 가스와 먼지 구름으로 시작했다는 내용과 이어지면서 별이 결국 처음 자리로 돌아가는 순환을 보여 주는 표현이에요.","hl":"mn"},{"n":42,"text":"먼저 most stars를 보세요. most가 형용사처럼 복수명사 stars를 꾸며서 대부분의 별들이라는 뜻을 만드는 거예요. 두 번째로 use up인데, use에 부사 up이 붙어서 하나의 구동사가 되고 뒤에 목적어 their fuel을 받아요. up이 완전히, 다라는 의미를 더해서 다 써버리다가 되는 거죠. 세 번째는 return to인데, return은 자동사라서 전치사 to를 통해서만 도착점을 연결할 수 있어요. 네 번째로 after a series of steps는 전치사 after가 명사구를 이끄는 부사구로, 돌아가는 시점이 일련의 단계를 거친 후라는 걸 알려 줍니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>별은 \u003cb class=\"key\">가스와 \u003c/b>\u003cb class=\"key\">먼지\u003c/b>의 구름으로 시작해서, 중력이 재료들을 함께 힘을 가하기 때문에 구름이 수축하면서 탄생한다.\u003c/li>\u003cli>구름이 압축되어 \u003cb class=\"key\">2,700만 \u003c/b>\u003cb class=\"key\">도\u003c/b>까지 가열되면 \u003cb class=\"key\">핵융합\u003c/b>이 시작되고, 그 에너지로 별은 모양을 유지하며 빛난다.\u003c/li>\u003cli>연료가 다 떨어졌을 때 무엇이 일어나는지는 처음에 얼마나 많은 \u003cb class=\"key\">먼지\u003c/b>가 모였는가, 즉 \u003cb class=\"key\">질량\u003c/b>에 달려 있다.\u003c/li>\u003cli>태양의 절반 이하의 질량을 가진 별들은 천천히 사라지지만, 대부분의 별들은 연료를 다 써버리고 일련의 단계를 거쳐 \u003cb class=\"key\">가스와 \u003c/b>\u003cb class=\"key\">먼지의 \u003c/b>\u003cb class=\"key\">구름\u003c/b>으로 돌아간다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>A star is born when a cloud of gas and dust contracts under gravity and starts nuclear fusion, and what happens after it dies depends on how much mass gathered in the first place.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">별은 가스와 먼지의 구름이 중력으로 수축하고 핵융합이 시작되면서 탄생하며, 연료가 다 떨어진 뒤의 운명은 처음에 모인 \u003cb class=\"key\">먼지의 \u003c/b>\u003cb class=\"key\">양\u003c/b>, 즉 \u003cb class=\"key\">질량\u003c/b>에 달려 있다. 대부분의 별은 연료를 다 써버리고 일련의 단계를 거쳐 다시 \u003cb class=\"key\">가스와 \u003c/b>\u003cb class=\"key\">먼지의 \u003c/b>\u003cb class=\"key\">구름\u003c/b>으로 돌아간다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":43,"text":"오늘 내용을 정리해 볼게요. 별은 가스와 먼지의 구름이 중력으로 수축하고 핵융합이 시작되면서 태어나고, 그 에너지로 모양을 유지하며 빛납니다. 연료가 다 떨어진 뒤의 운명은 처음에 모인 먼지의 양, 즉 질량에 달려 있고, 대부분의 별은 다시 가스와 먼지의 구름으로 돌아간다는 점이 핵심이에요. 오늘도 끝까지 잘 따라와 줘서 고맙고, 다음 시간에 또 만나요.","hl":null}]}]});</script></body></html>
