<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터2 Reading06 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터2 Reading06","audioDir":"reading06_audio","preview":false,"count":39,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.520em\">Reading06\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터2\u003c/div>\u003ch1>The Waste of Things We Buy but Never Use\u003c/h1>\u003ch2>사고도 쓰지 않는 물건의 낭비\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>우리는 결국 사용하지 않을 물건을 사면서 돈과 시간을 낭비한다. 호주인들의 미사용 물품 지출 통계와 전문가 인용을 통해, \u003cb class=\"key\">사고도 \u003c/b>\u003cb class=\"key\">사용하지 \u003c/b>\u003cb class=\"key\">않는 \u003c/b>\u003cb class=\"key\">모든 \u003c/b>\u003cb class=\"key\">것\u003c/b>은 곧 \u003cb class=\"key\">낭비\u003c/b>라는 점을 강조한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Buying things we never use is a waste of money, time, and resources.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 리딩마스터 교재의 Reading 지문을 함께 읽겠습니다. 이 글은 우리가 물건을 사고도 결국 사용하지 않는 상황에서 시작해, 왜 그것이 문제인지 보여 줍니다. 핵심은 사고도 사용하지 않는 모든 것이 결국 낭비라는 점이에요. 요지는 Buying things we never use is a waste of money, time, and resources, 즉 사용하지 않는 물건을 사는 것은 돈과 시간의 낭비라는 것입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">우리는 필요해서라기보다 충동적으로 물건을 사는 경우가 많다. 이런 \u003cb class=\"key\">과소비\u003c/b>는 집 안에 쓰지 않는 물건을 쌓이게 하고, 소비가 실제 만족으로 이어지지 못하게 한다. 경제학에서는 쓰지 않는 물건에 쓴 돈을 \u003cb class=\"key\">기회비용\u003c/b> 관점에서 생각해 볼 수 있는데, 그 돈으로 더 필요한 것을 살 수 있었기 때문이다. 냉장고에 사 두고 상하게 한 음식도 돈은 냈지만 실제로 쓰지 못했다면 \u003cb class=\"key\">낭비\u003c/b>가 된다. 이런 일이 사회 전체에서 반복되면 자원 낭비도 커진다. 그래서 이 글은 소비 자체보다 실제 사용 여부에 주목하자고 말한다.\u003c/div>","segs":[{"n":2,"text":"우리는 때로 필요해서가 아니라 충동적으로 물건을 사요. 이런 과소비는 집 안에 쓰지 않는 물건을 쌓이게 하죠. 경제학에서는 쓰지 않는 물건에 쓴 돈을 기회비용 관점에서 생각해 볼 수 있어요. 예를 들어 냉장고에 사 두고 상하게 하는 음식도 돈을 냈지만 실제로는 쓰지 못한 것이니 낭비가 되죠. 이런 일이 한 사람이 아니라 사회 전체에서 반복되면 자원의 낭비도 커집니다. 그래서 이 글은 소비 자체보다 실제 사용 여부에 주목하자고 말하는 셈이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>구매 후 미사용 경험\u003csmall>도입 · 문장 1–4\u003c/small>\u003c/h4>\u003cp>글은 독자에게 물건을 사고도 결국 사용하지 않았던 경험을 떠올려 보라고 한다. 옷, 책, 전자기기 같은 구체적 예를 연달아 제시해 \u003cb class=\"key\">공감\u003c/b>을 형성한다. 이 도입은 뒤에서 제시될 \u003cb class=\"key\">미사용 \u003c/b>\u003cb class=\"key\">물품\u003c/b>의 낭비 문제로 자연스럽게 이어진다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>미사용 지출 통계\u003csmall>근거 · 문장 5–7\u003c/small>\u003c/h4>\u003cp>이어서 호주인들만 보아도 사용하지 않는 물건에 매년 평균 108억 호주 달러를 쓴다는 \u003cb class=\"key\">통계\u003c/b>를 제시한다. 이 금액이 대학과 도로에 쓰는 정부 지출 총액을 넘고 가구당 평균 1,250 호주 달러에 이른다고 덧붙인다. 구체적 수치는 \u003cb class=\"key\">낭비\u003c/b>의 규모가 생각보다 크다는 점을 실감하게 한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>낭비의 규정\u003csmall>주장 · 문장 8\u003c/small>\u003c/h4>\u003cp>그런 다음 글은 우리가 구입하고 전혀 사용하지 않는 모든 물건을 \u003cb class=\"key\">낭비\u003c/b>라고 규정한다. 돈 낭비, 시간 낭비, 그리고 순전히 쓸모없는 물건이라는 의미의 낭비로 범위를 넓힌다. 여기서 \u003cb class=\"key\">주제문\u003c/b>이 분명하게 드러난다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>전문가 인용\u003csmall>결론 · 문장 9\u003c/small>\u003c/h4>\u003cp>마지막으로 작가 Clive Hamilton의 말을 인용해 주장을 뒷받침한다. 우리가 사는 물건에서 우리가 사용하는 것을 뺀 것이 낭비라는 \u003cb class=\"key\">권위\u003c/b> 있는 표현을 제시한다. 이 인용은 앞의 통계와 정의를 하나의 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">메시지\u003c/b>로 묶어 준다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 네 단계로 나누어 볼게요.","hl":null},{"n":4,"text":"첫 단계는 도입이에요. 글은 물건을 사고도 결국 사용하지 않았던 경험을 떠올려 보라고 하면서 독자의 공감을 불러일으킵니다. 옷이나 책, 전자기기처럼 구체적인 예를 보여 주어 미사용 물품이라는 문제를 자연스럽게 떠올리게 하죠.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 통계가 나옵니다. 호주인들만 보아도 사용하지 않는 물건에 매년 평균 백팔억 호주 달러를 쓴다고 추정해요. 이 금액이 대학과 도로에 쓰는 정부 지출 총액을 넘고 가구당 평균 천이백오십 호주 달러에 이른다고 덧붙입니다. 이 수치는 낭비의 규모가 생각보다 크다는 것을 실감하게 합니다.","hl":"f1"},{"n":6,"text":"세 번째 단계에서 글은 주장을 분명히 합니다. 우리가 구입하고 전혀 사용하지 않는 모든 물건은 낭비라고 규정하죠. 돈 낭비, 시간 낭비, 그리고 순전히 쓸모없는 물건이라는 의미의 낭비로 범위를 넓혀요. 바로 이 부분이 글의 주제문입니다.","hl":"f2"},{"n":7,"text":"마지막 단계는 권위 있는 인용으로 마무리됩니다. 작가 Clive Hamilton은 우리가 사는 물건에서 우리가 사용하는 것을 뺀 것이 낭비라고 말합니다. 이 인용은 앞의 통계와 정의를 하나의 핵심 메시지로 묶어 주는 역할을 해요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">예시-근거-주장\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 8번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 1~4번에서 구매 후 사용하지 않은 경험과 예를 질문으로 제시해 \u003cb class=\"key\">문제\u003c/b>를 환기한다. 5~7번에서는 호주인의 지출 통계라는 \u003cb class=\"key\">근거\u003c/b>를 제시해 규모를 부각한다. 8번에서 모든 미사용 물건은 낭비라는 \u003cb class=\"key\">주제문\u003c/b>을 밝히고, 9번의 인용으로 이를 강화하므로 주장이 뒤에 나오는 미괄식이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>for a moment (1)\u003c/b>\u003cspan>도입·질문 유도\u003c/span>\u003cb>It is estimated (5)\u003c/b>\u003cspan>통계 근거 제시\u003c/span>\u003cb>That is (6)\u003c/b>\u003cspan>앞 수치 부연\u003c/span>\u003cb>As the author Clive Hamilton observes (9)\u003c/b>\u003cspan>권위 인용\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">bought something and never ended up using it\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">never ended up wearing\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">never read\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">never even came out of the box\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">goods they do not use\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">all the things we buy and then never use\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">waste\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Things we buy\u003c/th>\u003cth>Things we use\u003c/th>\u003c/tr>\u003ctr>\u003ctd>사용하지 않으면 돈과 시간의 낭비가 됨\u003c/td>\u003ctd>실제 사용을 통해 가치를 만듦\u003c/td>\u003c/tr>\u003ctr>\u003ctd>지출은 있지만 효용은 없음\u003c/td>\u003ctd>효용이 있는 소비\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 예시와 근거를 먼저 제시한 뒤 주장으로 향하는 예시 근거 주장 구조예요. 앞부분에서 구매 후 사용하지 않은 경험을 질문으로 던져 문제를 환기하죠. 중반에는 호주인의 지출 통계라는 근거를 제시해 낭비의 규모를 부각합니다. 그리고 뒤늦게 모든 미사용 물건은 낭비라는 주제문이 나오기 때문에 미괄식이라고 볼 수 있어요.","hl":"ty"},{"n":9,"text":"신호어를 보면 도입의 for a moment는 잠시 생각해 보자는 질문을 열어 주고, It is estimated는 통계 근거가 시작된다는 표시예요. That is는 앞의 수치를 다시 풀어 강조하는 연결어이고, As the author observes는 권위 있는 인용을 불러오는 표현입니다. 또 bought something and never ended up using it이 goods they do not use와 all the things we buy and then never use로 반복되면서 waste라는 결론으로 재진술됩니다. 사는 것과 쓰는 것의 대조도 낭비라는 핵심 개념을 선명하게 만들어 줍니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>think about\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 대해 생각하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>for a moment\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>잠시\u003c/span>\u003c/div>\u003cdiv>\u003cb>end up\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>결국 ...하게 되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>use\u003c/b>\u003cem>동사\u003c/em>\u003cspan>사용하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>item\u003c/b>\u003cem>명사\u003c/em>\u003cspan>물건, 품목\u003c/span>\u003c/div>\u003cdiv>\u003cb>clothing\u003c/b>\u003cem>명사\u003c/em>\u003cspan>의류, 옷\u003c/span>\u003c/div>\u003cdiv>\u003cb>wear\u003c/b>\u003cem>동사\u003c/em>\u003cspan>입다\u003c/span>\u003c/div>\u003cdiv>\u003cb>read\u003c/b>\u003cem>동사\u003c/em>\u003cspan>읽다\u003c/span>\u003c/div>\u003cdiv>\u003cb>electronic equipment\u003c/b>\u003cem>명사\u003c/em>\u003cspan>전자기기\u003c/span>\u003c/div>\u003cdiv>\u003cb>even\u003c/b>\u003cem>부사\u003c/em>\u003cspan>심지어\u003c/span>\u003c/div>\u003cdiv>\u003cb>come out of the box\u003c/b>\u0 어 역할을 해요. 의문사가 이끄는 절은 항상 의문사 다음에 주어, 그다음 동사 순서, 즉 평서문 어순을 지킨다는 점 꼭 기억하세요. 세 번째로, ended up 뒤에는 using처럼 동명사가 와서 '결국 ~하게 되다'라는 결과를 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">옷 한 점\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">An \u003c/span>\u003cspan class=\"tgt\">item \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">clothing\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">결국에는 여러분이 한 번도 입지 않은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">never \u003c/span>\u003cspan class=\"tgt\">ended \u003c/span>\u003cspan class=\"tgt\">up \u003c/span>\u003cspan class=\"tgt\">wearing\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">결국에는 여러분이 한 번도 입지 않은 옷 한 점?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 something을 구체적인 사물로 바꿔 보여 주는 \u003cb class=\"key\">예시\u003c/b> 문장이에요. 옷이라는 \u003cb class=\"key\">구체적 \u003c/b>\u003cb class=\"key\">사물\u003c/b>을 던져 주면 독자가 자기 경험을 훨씬 쉽게 떠올리게 되죠. 물음표를 붙여 앞으로 이어질 \u003cb class=\"key\">열거\u003c/b>의 흐름을 만들어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 수식\u003c/span> : [An item] + [of clothing (전치사구/형용사구)] : \"옷 한 점\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사의 생략\u003c/span> : [선행사 an item of clothing] + [(which/that) + 주어 + 동사 ~] : \"여러분이 결국 한 번도 입지 않게 된\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"An item of clothing, 옷 한 점. you never ended up wearing?, 결국에는 여러분이 한 번도 입지 않은. 이 문장 전체를 해석하면, 결국에는 여러분이 한 번도 입지 않은 옷 한 점?","hl":"m"},{"n":16,"text":"이 문장은 앞 문장의 stimated that이라고 밝혀서 확정된 사실이 아니라 추정임을 분명히 하고, alone과 on average로 이게 어느 한 사람 이야기가 아니라는 걸 짚어 주죠. 뒤에서 이 금액을 정부 지출과 비교하기 위한 기준점을 만들어 주는 문장입니다.","hl":"mn"},{"n":26,"text":"첫 번째, 문장 앞의 It은 가주어예요. 진짜 주어인 진주어는 that 뒤에 오는 절이고, 그 절이 길어서 앞자리를 It으로 비워 둔 겁니다. 뒤에 오는 절은 주어와 동사가 다 있는 완전한 절이라는 점도 확인해 두세요. 두 번째, goods 뒤에는 목적격 관계대명사가 생략되어 있어요. use 뒤에 목적어가 비어 있으니 바로 알 수 있죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 ~이다\u003c/span>\u003cspan class=\"en\">That is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~보다 많은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">than\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정부의 총지출\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">total \u003c/span>\u003cspan class=\"tgt\">government \u003c/span>\u003cspan class=\"tgt\">spending\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대학과 도로에 쓰이는\u003c/span>\u003cspan class=\"en\">on universities and roads.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 대학과 도로에 사용하는 정부 지출 총액을 넘어서는 금액이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 제시한 소비 금액이 대학과 도로에 들어가는 정부 \u003cb class=\"key\">지출 \u003c/b>\u003cb class=\"key\">총액\u003c/b>보다 크다고 비교하는 문장이에요. 숫자만으로는 감이 안 오니까 누구나 규모를 아는 \u003cb class=\"key\">공공 \u003c/b>\u003cb class=\"key\">지출\u003c/b>에 견주어 \u003cb class=\"key\">충격\u003c/b>을 키우죠. 낭비의 심각성을 강조하는 흐름의 핵심입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">비교급 표현 more than\u003c/span> : [A] is more than [B] : \"~을 넘어서는, ~보다 많은\"\ 으로 바꿔 마치 우리 집 살림의 지출처럼 느끼게 만듭니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지시대명사 That\u003c/span> : That(지시대명사) + is[be동사] + [명사 보어] : \"그것은 ~이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 for(배분·기준)\u003c/span> : an average of [금액] + for [each household] : \"가구당(각 가구를 기준으로 하면)\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"That is, 그것은 ~이다. an average of $1,250 AUD, 평균 1,250 호주 달러. (roughly $1,156 USD), (약 1,156 미국 달러). for each household, 가구당. 이 문장 전체를 해석하면, 그 금액은 가구당 평균 1,250 호주 달러(약 1,156 미국 달러)이다.","hl":"m"},{"n":31,"text":"이 문장은 앞에서 말한 큰 금액을 가구 하나하나의 기준으로 다시 계산해 주는 문장이에요. 총액만 보면 감이 잘 안 오니까, 가구당 평균으로 바꿔서 독자가 자기 집 살림처럼 느끼게 해 주는 거죠.","hl":"mn"},{"n":32,"text":"먼저 That은 앞 문장의 금액 전체를 받는 지시대명사예요. 두 번째로 for each household에서 for는 기준과 배분을 나타내서 가구당이라는 뜻을 만들어 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 물건은\u003c/span>\u003cspan class=\"en\">All the things\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 사고 전혀 사용하지 않는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">buy \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">then \u003c/span>\u003cspan class=\"tgt\">never \u003c/span>\u003cspan class=\"tgt\">use\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">낭비인데\u003c/span>\u003cspan class=\"en\">are waste\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">― 돈 낭비, 시간 낭비,\u003c/span>\u003cspan class=\"en\">― \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">waste \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">money, \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">waste \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">time, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 순전히 쓸모없는 물건이라는 의미에서 낭비이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">waste \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">sense \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">pure \u003c/span>\u003cspan class=\"tgt\">rubbish\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리가 구입하고 전혀 사용하지 않는 모든 물건은 낭비인데, 돈 낭비, 시간 낭비, 그리고 순전히 쓸모없는 물건이라는 의미에서 낭비이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 예로 든 물건들을 한데 묶어, 사고 쓰지 않는 모든 것이 결국 \u003cb class=\"key\">낭비\u003c/b>임을 세 가지 관점에서 규정하는 문장입니다. 돈과 시간, 그리고 물질 그 자체라는 세 층위로 \u003cb class=\"key\">쓸모없는 \u003c/b>\u003cb class=\"key\">물건\u003c/b>임을 못 박아 글의 논지를 선명하게 만듭니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사의 생략\u003c/span> : All the things + [(which/that) + we buy and never use] → 선행사 + [(목적격 관계대명사) + 주어 + 동사] : \"우리가 사고 결코 사용하지 않는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">대시(―)를 이용한 동격·병렬\u003c/span> : [명사 waste] ― [A, B, and C] (앞 명사를 구체화하는 동격 나열) : \"돈 낭비, 시간 낭비, 그리고 순전히 쓸모없는 물건이라는 의미에서 낭비\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">관용 표현(in the sense of)\u003c/span> : in the sense of + [명사] = '~라는 의미에서' : \"~라는 의미에서\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"All the things, 모든 물건은. we buy and then never use, 우리가 사고 전혀 사용하지 않는. are waste, 낭비인데. ― a waste of money, a waste of time, ― 돈 낭비, 시간 낭비. and waste in the sense of pure rubbish, 그리고 순전히 쓸모없는 물건이라는 의미에서 낭비이다. 이 문장 전체를 해석하면, 우리가 구입하고 전혀 사용하지 않는 모든 물건은 낭비인데, 돈 낭비, 시간 낭비, 그리고 순전히 쓸모없는 물건이라는 의미에서 낭비이다.","hl":"m"},{"n":34,"text":"이 문장은 사고 쓰지 않는 모든 것이 결국 낭비라는 걸 세 가지로 못 박아 주는 문장이에요. 돈 낭비, 시간 낭비, 그리고 물질 자체가 쓸모없는 물건이 된다는 의미에서의 낭비라는 거죠.","hl":"mn"},{"n":35,"text":"먼저 we buy and then never use 앞에는 목적격 관계대명사가 생략되어 있어요. All the things 뒤에 원래 which나 that이 있어야 할 자리가 비어 있는 거죠. 두 번째로 대시 뒤에 나오는 동격 표현이 앞의 waste를 구체적으로 풀어 주고, 세 가지 항목이 병렬로 나열돼요. 마지막으로 in the sense of는 어떤 의미로 그 단어를 쓰는지 밝혀 주는 관용 표현입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">작가 Clive Hamilton이 말하는 것처럼,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">As \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">author \u003c/span>\u003cspan class=\"tgt\">Clive \u003c/span>\u003cspan class=\"tgt\">Hamilton \u003c/span>\u003cspan class=\"tgt\">observes\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 사는 물건과\u003c/span>\u003cspan class=\"en\">'The difference between \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">stuff \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">buy\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 사용하는 것 사이의 차이는\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">use\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">낭비이다\u003c/span>\u003cspan class=\"en\">is waste.'\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">작가 Clive Hamilton이 말하는 것처럼 ‘우리가 사는 물건에서 우리가 사용하는 것을 뺀 것은 낭비이다.’\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 권위 있는 저자의 인용을 빌려, '산 것에서 쓴 것을 뺀 나머지'가 곧 \u003cb class=\"key\">낭비\u003c/b>라는 정의를 제시하며 글을 맺는 문장입니다. 앞 문장의 주장을 \u003cb class=\"key\">전문가\u003c/b>의 말로 뒷받침해 설득력을 높이고, 글 전체의 결론을 한 줄로 압축합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 As(~하는 것처럼, ~대로)\u003c/span> : As + [주어 + 동사], + [주절] : \"작가 Clive Hamilton이 말하는 것처럼\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사의 생략\u003c/span> : the stuff + [(which/that) + we buy] : \"우리가 사는 물건\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">관계대명사 what\u003c/span> : what + [목적어가 빠진 불완전한 절] = the thing(s) that ~ : \"우리가 사용하는 것\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"As the author Clive Hamilton observes, 작가 Clive Hamilton이 말하는 것처럼. 'The difference between the stuff we buy, 우리가 사는 물건과. and what we use, 우리가 사용하는 것 사이의 차이는. is waste.', 낭비이다. 이 문장 전체를 해석하면, 작가 Clive Hamilton이 말하는 것처럼 ‘우리가 사는 물건에서 우리가 사용하는 것을 뺀 것은 낭비이다.’","hl":"m"},{"n":37,"text":"이 문장은 저자의 인용을 빌려서, 산 것에서 쓴 것을 뺀 나머지가 바로 낭비라고 정의하면서 글을 마무리해요. 전문가의 말을 그대로 가져오니까 주장에 힘이 실리는 거죠.","hl":"mn"},{"n":38,"text":"먼저 As는 여기서 ~가 말하는 것처럼이라는 양태의 접속사예요. 두 번째로 the stuff we buy에는 목적격 관계대명사가 생략되어 있고, 세 번째로 what we use의 what은 선행사를 포함하는 관계대명사입니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>글은 물건을 사고도 결국 사용하지 않은 경험을 질문하며 \u003cb class=\"key\">공감\u003c/b>을 유도한다.\u003c/li>\u003cli>호주인들이 사용하지 않는 물건에 매년 막대한 돈을 쓴다는 \u003cb class=\"key\">통계\u003c/b>가 제시된다.\u003c/li>\u003cli>사용하지 않는 물건은 돈·시간·물건의 \u003cb class=\"key\">낭비\u003c/b>라고 규정한다.\u003c/li>\u003cli>Clive Hamilton의 인용은 사는 것과 사용하는 것의 \u003cb class=\"key\">차이\u003c/b>가 곧 낭비라는 핵심 메시지를 강화한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Buying things we never use is a waste of money, time, and resources.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">우리는 결국 사용하지 않을 물건을 사면서 돈과 시간을 낭비한다. 호주인들의 미사용 물품 지출 통계와 전문가 인용을 통해, \u003cb class=\"key\">사고도 \u003c/b>\u003cb class=\"key\">사용하지 \u003c/b>\u003cb class=\"key\">않는 \u003c/b>\u003cb class=\"key\">모든 \u003c/b>\u003cb class=\"key\">것\u003c/b>은 곧 \u003cb class=\"key\">낭비\u003c/b>라는 점을 강조한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":39,"text":"정리해 볼게요. 이 글은 우리가 사고도 쓰지 않는 물건이 얼마나 큰 낭비인지 예시와 통계, 인용을 통해 보여 줍니다. 읽을 때는 사는 것과 쓰는 것의 차이에 주목하고, waste라는 핵심어가 어떻게 결론으로 이어지는지 기억하세요. 오늘도 수고 많았습니다. 다음 시간에 또 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
