<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터2 Reading10 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터2 Reading10","audioDir":"reading10_audio","preview":false,"count":52,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.520em\">Reading10\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터2\u003c/div>\u003ch1>Step Out of Your Comfort Zone to Succeed\u003c/h1>\u003ch2>성공하려면 안락지대에서 벗어나세요\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>성공을 원한다면 \u003cb class=\"key\">불편함\u003c/b>을 편안하게 받아들이고 \u003cb class=\"key\">편안한 \u003c/b>\u003cb class=\"key\">영역\u003c/b> 밖으로 나가야 합니다. 새로운 것에 도전하면 성장의 기회와 자기 이해, 새로운 관계라는 세 가지 이점을 얻어 결국 \u003cb class=\"key\">시야\u003c/b>를 넓히고 성공을 이룰 수 있습니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Stepping out of your comfort zone and trying new things brings personal growth, self-discovery, and new relationships, which can lead you to expand your horizons and achieve success.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 성공을 원한다면 불편함과 친해져야 한다는 이야기예요. 내용은 아주 단순합니다. 편안한 영역 밖으로 나가서 새로운 것에 도전하면 성장의 기회와 자기 이해, 그리고 새로운 관계라는 세 가지 선물을 얻는다는 거죠. 오늘 수업이 끝날 때쯤이면 여러분은 comfort zone이라는 말을 아주 편하게 쓸 수 있게 될 거예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">\u003cb class=\"key\">안락지대\u003c/b>(comfort zone)는 심리학에서 자주 쓰는 말로, 사람이 불안을 느끼지 않고 편하게 머무는 상태나 범위를 뜻해요. 이 영역 안에서는 마음이 편한 대신 자극과 배움이 적어서 성장의 속도도 더뎌지기 쉬워요. 반대로 그 바로 바깥의 '학습 영역(learning zone)'은 약간의 긴장과 불편함이 있지만 새로운 기술을 익히는 구간이에요. 자전거를 처음 배울 때 넘어질까 봐 무서운데도 페달을 밟아야만 균형을 익히게 되는 것과 같은 이치죠. 그래서 전문가들은 불편함(discomfort)을 없애려 하기보다 그 불편함을 \u003cb class=\"key\">성장의 \u003c/b>\u003cb class=\"key\">신호\u003c/b>로 받아들이라고 말해요. 이 글도 같은 맥락에서 \u003cb class=\"key\">도전\u003c/b>이 주는 이점을 세 가지로 정리하고 있습니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식부터 짚어 볼게요. comfort zone은 사람이 불안을 느끼지 않고 편하게 머무는 범위를 말합니다. 이 안에 있으면 마음은 편하지만 자극이 적어서 성장도 느려지기 쉬워요. 그래서 심리학자들은 comfort zone 바로 바깥의 learning zone에서 진짜 배움이 일어난다고 이야기합니다. 자전거를 처음 배울 때 넘어질까 봐 무섭지만 페달을 밟아야 균형을 익히는 것과 같은 이치예요. 이 지문도 그 불편함을 성장의 신호로 받아들이라고 말하고 있습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>불편함과 친해지기\u003csmall>도입·주장 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>성공을 원한다면 먼저 \u003cb class=\"key\">불편함\u003c/b>과 친해져야 한다고 주장하며 글을 엽니다. 편안함에 머무르지 말고 \u003cb class=\"key\">안락지대\u003c/b> 밖으로 한 걸음 나가라는 뜻이지요. 이어서 in other words라는 표현으로 앞 문장을 쉬운 말로 다시 풀어 주고 있습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>성장의 기회\u003csmall>주제문·근거 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>안락지대 밖에서 새로운 것을 시도하면 여러 면에서 큰 도움을 받는다는 \u003cb class=\"key\">주제문\u003c/b>이 나옵니다. 이어서 첫 번째 근거로 \u003cb class=\"key\">성장\u003c/b>의 기회를 제시합니다. 스스로에게 \u003cb class=\"key\">도전\u003c/b>하는 일이 새로운 경험과 예상치 못한 변화를 만들고, 그것이 결국 개인의 성장으로 이어진다는 설명입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>자기 발견\u003csmall>근거 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>두 번째 이점은 \u003cb class=\"key\">자기 \u003c/b>\u003cb class=\"key\">이해\u003c/b>입니다. 새로운 것에 도전하는 과정에서 자신의 재능과 관심사, 강점과 약점을 \u003cb class=\"key\">발견\u003c/b>하게 된다는 것이지요. 경험이 쌓일수록 나를 더 정확하게 아는 계기가 된다는 뜻입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>새로운 관계\u003csmall>근거 · 문장 8–11\u003c/small>\u003c/h4>\u003cp>세 번째 근거는 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">관계\u003c/b>입니다. 새로운 일을 시도하면 그렇지 않으면 만날 기회가 없었던 사람들을 만나게 되고, 그 관계가 삶을 더 \u003cb class=\"key\">흥미롭게\u003c/b> 만든다고 합니다. 만난 사람들에게서 배우는 것도 있다는 점까지 덧붙입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>시야 확장과 성공\u003csmall>전환·결론 · 문장 12–13\u003c/small>\u003c/h4>\u003cp>마지막으로 \u003cb class=\"key\">생소함\u003c/b>은 분명 불편하게 느껴진다는 점을 솔직하게 인정합니다. 하지만 그 불편함을 지나면 \u003cb class=\"key\">시야\u003c/b>를 넓히고 성공을 이룰 수 있다고 마무리합니다. however로 반대 상황을 한 번 짚은 뒤 결론을 강화하는 흐름입니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 지문이 어떤 순서로 흘러가는지, 문장을 하나씩 따라가며 살펴볼게요.","hl":null},{"n":4,"text":"첫 번째 문장부터 작가의 주장이 아주 강하게 나옵니다. 성공하고 싶다면 discomfort, 즉 불편함과 친해져야 한다는 거죠. 두 번째 문장에서는 in other words라고 하면서 같은 말을 쉽게 바꿔 줍니다. 편안한 영역, 다시 말해 안락지대 밖으로 나오라는 이야기예요.","hl":"f0"},{"n":5,"text":"세 번째 문장이 이 글의 주제문입니다. comfort zone 밖에서 새로운 것을 시도하면 여러 면에서 큰 도움을 받는다는 거죠. 이어서 첫 번째 근거로 성장의 기회를 꺼냅니다. 스스로에게 도전하면 새로운 경험과 예상치 못한 변화가 생기고, 그것이 개인의 성장으로 이어진다고 설명합니다.","hl":"f1"},{"n":6,"text":"두 번째 근거는 자신에 대해 배우는 거예요. 새로운 것에 도전하다 보면 내 재능과 관심사, 강점과 약점을 발견하게 됩니다. 경험이 쌓일수록 나를 더 정확하게 아는 계기가 되는 거죠.","hl":"f2"},{"n":7,"text":"세 번째 근거는 새로운 관계입니다. 새로운 일을 시도하면 그렇지 않으면 평생 만날 기회가 없었을 사람들을 만나게 됩니다. 그 사람들이 삶을 더 흥미롭게 만들어 주고, 우리는 그들에게서 또 배우게 된다는 거예요.","hl":"f3"},{"n":8,"text":"마지막으로 작가는 솔직해집니다. 낯선 상황에서 느끼는 생소함은 분명히 불편하게 느껴진다고 인정하죠. 하지만 however, 그 불편함을 지나면 시야를 넓히고 성공을 이룰 수 있다고 단단하게 마무리합니다.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 3번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 \u003cb class=\"key\">주장\u003c/b>을 먼저 던지고 근거를 뒤에 붙이는 \u003cb class=\"key\">주장과 \u003c/b>\u003cb class=\"key\">근거\u003c/b> 방식으로 전개됩니다. 첫 문장에서 불편함을 받아들이라고 주장하고, 세 번째 문장에서 이점이 많다는 \u003cb class=\"key\">주제문\u003c/b>을 놓은 뒤 First, Furthermore, Finally로 근거 세 가지를 나열합니다. 마지막 두 문장에서 불편함을 인정하면서도 성공을 강조하며 끝나므로 중심 내용이 앞부분에 몰린 \u003cb class=\"key\">두괄식\u003c/b> 구성입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>In other words (2)\u003c/b>\u003cspan>재진술\u003c/span>\u003cb>First (4)\u003c/b>\u003cspan>첫 번째 근거 제시\u003c/span>\u003cb>Furthermore (6)\u003c/b>\u003cspan>추가 근거 제시\u003c/span>\u003cb>Finally (8)\u003c/b>\u003cspan>마지막 근거 제시\u003c/span>\u003cb>However (13)\u003c/b>\u003cspan>전환·결론 강화\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">get comfortable with discomfort\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">step out of your comfort zone\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">trying new things outside of your comfort zone\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">challenging yourself\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">try something new\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"이 글은 주장을 먼저 던지고 근거를 뒤에 붙이는 주장과 근거의 구조입니다. 첫 문장에서 주장을 꺼내고, 세 번째 문장에서 이점이 많다는 주제문을 놓은 다음에 근거를 세 개 늘어놓죠. 그래서 글의 중심 내용이 앞부분에 몰려 있는 두괄식 구성이라고 볼 수 있습니다. 답안을 쓸 때도 주제문이 앞에 있다는 점을 기억하면 요지를 잡기가 훨씬 쉬워요.","hl":"ty"},{"n":10,"text":"신호어를 눈여겨보세요. in other words는 앞 문장을 다시 풀어 주는 재진술 신호입니다. first, furthermore, finally는 근거를 순서대로 나열하는 신호어이고, 마지막의 however는 불편함이라는 반대 상황을 한 번 짚고 결국 성공으로 간다는 전환 신호예요. 이런 신호어만 표시해도 글의 뼈대가 그대로 보입니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>get comfortable with\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 편안해지다, 익숙해지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>discomfort\u003c/b>\u003cem>명사\u003c/em>\u003cspan>불편함\u003c/span>\u003c/div>\u003cdiv>\u003cb>succeed\u003c/b>\u003cem>동사\u003c/em>\u003cspan>성공하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>in other words\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>다시 말해\u003c/span>\u003c/div>\u003cdiv>\u003cb>step out of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에서 벗어나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>comfort zone\u003c/b>\u003cem>명사\u003c/em>\u003cspan>안락지대, 편안한 영역\u003c/span>\u003c/div>\u003cdiv>\u003cb>benefit\u003c/b>\u003cem>동사\u003c/em>\u003cspan>도움이 되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>valuable\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>귀중한\u003c/span>\u003c/div>\u003cdiv>\u003cb>opportunity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기회\u003c/span>\u003c/div>\u003cdiv>\u003cb>growth\u003c/b>\u003cem>명사\u003c/em>\u003cspan>성장\u003c/span>\u003c/div>\u003cdiv>\u003cb>challenge\u003c/b>\u003cem>동사\u003c/em>\u003cspan>도전하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>provide\u003c/b>\u003cem>동사\u003c/em>\u003cspan>제공하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>unexpected\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>예상치 못한\u003c/span>\u003c/div>\u003cdiv>\u003cb>lead to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 이어지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>furthermore\u003c/b>\u003cem>부사\u003c/em>\u003cspan>게다가\u003c/span>\u003c/div>\u003cdiv>\u003cb>discover\u003c/b>\u003cem>동사\u003c/em>\u003cspan>발견하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>talent\u003c/b>\u003cem>명사\u003c/em>\u003cspan>재능\u003c/span>\u003c/div>\u003cdiv>\u003cb>interest\u003c/b>\u003cem>명사\u003c/em>\u003cspan>관심사\u003c/span>\u003c/div>\u003cdiv>\u003cb>strength\u003c/b>\u003cem>명사\u003c/em>\u003cspan>강점\u003c/span>\u003c/div>\u003cdiv>\u003cb>weakness\u003c/b>\u003cem>명사\u003c/em>\u003cspan>약점\u003c/span>\u003c/div>\u003cdiv>\u003cb>finally\u003c/b>\u003cem>부사\u003c/em>\u003cspan>마지막으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>build\u003c/b>\u003cem>동사\u003c/em>\u003cspan>형성하다, 쌓다\u003c/span>\u003c/div>\u003cdiv>\u003cb>relationship\u003c/b>\u003cem>명사\u003c/em>\u003cspan>관계\u003c/span>\u003c/div>\u003cdiv>\u003cb>otherwise\u003c/b>\u003cem>부사\u003c/em>\u003cspan>그렇지 않으면\u003c/span>\u003c/div>\u003cdiv>\u003cb>exciting\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>흥미진진한\u003c/span>\u003c/div>\u003cdiv>\u003cb>unfamiliarity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>생소함\u003c/span>\u003c/div>\u003cdiv>\u003cb>expand\u003c/b>\u003cem>동사\u003c/em>\u003cspan>넓히다\u003c/span>\u003c/div>\u003cdiv>\u003cb>horizon\u003c/b>\u003cem>명사\u003c/em>\u003cspan>시야, 지평\u003c/span>\u003c/div>\u003cdiv>\u003cb>achieve\u003c/b>\u003cem>동사\u003c/em>\u003cspan>이루다, 달성하다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"단어도 몇 개 짚고 갈게요. get comfortable with는 어떤 상황에 익숙해지다, 편안해지다는 뜻이고, step out of는 밖으로 벗어나다는 의미예요. lead to는 이어지다, unfamiliarity는 생소함, expand your horizons는 시야를 넓히다라는 표현으로 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">succeed\u003c/b>\u003cspan class=\"m\">성공하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">achieve\u003c/span>\u003cspan class=\"s\">triumph\u003c/span>\u003cspan class=\"s\">prosper\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">fail\u003c/span>\u003cspan class=\"a\">flop\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">benefit\u003c/b>\u003cspan class=\"m\">도움이 되다, 이익\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">help\u003c/span>\u003cspan class=\"s\">advantage\u003c/span>\u003cspan class=\"s\">profit\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">harm\u003c/span>\u003cspan class=\"a\">damage\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">opportunity\u003c/b>\u003cspan class=\"m\">기회\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">chance\u003c/span>\u003cspan class=\"s\">occasion\u003c/span>\u003cspan class=\"s\">opening\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">discover\u003c/b>\u003cspan class=\"m\">발견하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">find\u003c/span>\u003cspan class=\"s\">detect\u003c/span>\u003cspan class=\"s\">uncover\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003cspan class=\"a\">overlook\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">expand\u003c/b>\u003cspan class=\"m\">넓히다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">broaden\u003c/span>\u003cspan class=\"s\">enlarge\u003c/span>\u003cspan class=\"s\">extend\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">narrow\u003c/span>\u003cspan class=\"a\">shrink\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">exciting\u003c/b>\u003cspan class=\"m\">흥미진진한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">thrilling\u003c/span>\u003cspan class=\"s\">stimulating\u003c/span>\u003cspan class=\"s\">interesting\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">boring\u003c/span>\u003cspan class=\"a\">dull\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">uncomfortable\u003c/b>\u003cspan class=\"m\">불편한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">uneasy\u003c/span>\u003cspan class=\"s\">awkward\u003c/span>\u003cspan class=\"s\">unpleasant\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">comfortable\u003c/span>\u003cspan class=\"a\">relaxed\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">unexpected\u003c/b>\u003cspan class=\"m\">예상치 못한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">unforeseen\u003c/span>\u003cspan class=\"s\">surprising\u003c/span>\u003cspan class=\"s\">unpredictable\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">expected\u003c/span>\u003cspan class=\"a\">predictable\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"시험에 자주 나오는 어휘는 동의어와 반의어로 묶어 두면 좋습니다. succeed는 achieve, triumph와 가깝고 fail의 반대말이에요. benefit은 help나 advantage로 바꿔 쓸 수 있고 harm은 반대말입니다. discover는 find, uncover와 같은 뜻이고 ignore는 정반대의 태도죠. expand는 broaden, extend와 통하고 narrow, shrink와는 반대 방향입니다. exciting은 thrilling, interesting과 가깝고 boring, dull와는 반대라는 점도 함께 기억해 주세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 편안해질 필요가 있다\u003c/span>\u003cspan class=\"en\">You \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">need \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">get \u003c/span>\u003cspan class=\"tgt\">comfortable\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">불편함에 대해서\u003c/span>\u003cspan class=\"en\">with discomfort\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 당신이 성공하기를 원한다면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">if \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">want \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">succeed\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">성공하고 싶다면 불편함을 편안하게 받아들여야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글 전체의 \u003cb class=\"key\">주제 \u003c/b>\u003cb class=\"key\">문장\u003c/b>으로, 성공이라는 목표를 이루려면 불편함을 피하지 말고 그것에 \u003cb class=\"key\">익숙해지다\u003c/b>는 뜻을 담고 있어요. get comfortable with는 '불편함에 편안해지는', 즉 '익숙해지는'이라는 의미로, discomfort와 짝을 이루어 역설적으로 강조한 표현이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사적 need + to부정사\u003c/span> : need + [to get (to부정사)] : \"편안해질 필요가 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">if 조건의 부사절(시간·조건 부사절의 현재시제)\u003c/span> : if + [주어 + 현재동사], [주어 + 조동사] : \"만약 당신이 성공하기를 원한다면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(want의 목적어)\u003c/span> : want + [to succeed (to부정사/목적어)] : \"성공하기를\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"You need to get comfortable, 당신은 편안해질 필요가 있다. with discomfort, 불편함에 대해서. if you want to succeed, 만약 당신이 성공하기를 원한다면. 이 문장 전체를 해석하면, 성공하고 싶다면 불편함을 편안하게 받아들여야 한다.","hl":"m"},{"n":14,"text":"이 문장은 글의 주제 문장이에요. 성공을 원한다면 불편함을 피하지 말고 그것을 편안하게 받아들이라는 뜻이죠. get comfortable with는 불편함에 익숙해지다, 편안해지다로 해석하면 됩니다.","hl":"mn"},{"n":15,"text":"첫 번째로 need to get comfortable을 볼게요. need 뒤에 to부정사가 와서 ~할 필요가 있다는 뜻을 만듭니다. 두 번째로 if you want to succeed는 조건의 부사절이에요. 조건의 부사절에서는 미래의 일도 현재시제로 쓴다는 점, 꼭 기억해 두세요. 세 번째로 to succeed는 want의 목적어로 쓰인 to부정사예요. 그래서 성공하기를 원한다고 해석합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다시 말해,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">In \u003c/span>\u003cspan class=\"tgt\">other \u003c/span>\u003cspan class=\"tgt\">words\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 벗어나야 한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">should \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">step \u003c/span>\u003cspan class=\"tgt\">out \u003c/span>\u003cspan class=\"tgt\">of\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신의 편안한 영역(안락지대)에서\u003c/span>\u003cspan class=\"en\">your comfort zone.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">다시 말해, 당신은 당신의 편안한 영역(안락지대)에서 벗어나야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장을 \u003cb class=\"key\">바꿔 \u003c/b>\u003cb class=\"key\">말해\u003c/b> 주는 정리 문장이에요. get comfortable with discomfort를 편안한 영역 밖으로 나가라는 표현으로 바꾼 것이죠. 여기서 comfort zone은 익숙하고 편한 \u003cb class=\"key\">안락지대\u003c/b>를 뜻하는 관용적 표현이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관용 표현(환언의 연결어)\u003c/span> : In other words, + [앞 내용의 바꿔 말하기] : \"다시 말해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 should(당위)\u003c/span> : [주어] + should + [동사원형] : \"당신은 ~해야 한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">구동사(동사 + 부사 + 전치사)\u003c/span> : step + out of + [목적어] : \"~에서 벗어나다\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"In other words, 다시 말해. you should step out of, 당신은 벗어나야 한다. your comfort zone, 당신의 편안한 영역(안락지대)에서. 이 문장 전체를 해석하면, 다시 말해, 당신은 당신의 편안한 영역(안락지대)에서 벗어나야 한다.","hl":"m"},{"n":17,"text":"이 문장은 앞 문장을 바꿔 말해 주는 문장이에요. 다시 말해 편안한 영역, 즉 안락지대에서 벗어나야 한다는 거죠. 결국 불편함을 받아들이라는 첫 번째 문장을 다른 표현으로 정리한 셈이에요.","hl":"mn"},{"n":18,"text":"첫 번째는 In other words, 앞 내용을 이어 주는 연결어예요. 두 번째는 조동사 should인데요, should 뒤에는 반드시 동사원형이 옵니다. 세 번째는 step out of, 동사와 전치사가 묶인 구동사로 ~에서 벗어나다라는 뜻이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새로운 것들을 시도하는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Trying \u003c/span>\u003cspan class=\"tgt\">new \u003c/span>\u003cspan class=\"tgt\">things\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신의 편안한 영역 밖에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">outside \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">comfort \u003c/span>\u003cspan class=\"tgt\">zone\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신에게 크게 도움이 될 것이다\u003c/span>\u003cspan class=\"en\">will greatly \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">benefit \u003c/span>\u003cspan class=\"tgt\">you\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 면에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">many \u003c/span>\u003cspan class=\"tgt\">ways\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">당신의 편안한 영역 밖에서 새로운 것들을 시도하는 것은 많은 면에서 당신에게 큰 도움이 될 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞으로 이어질 내용의 \u003cb class=\"key\">주제\u003c/b>를 미리 던지는 문장이에요. 편안한 영역 밖에서의 시도가 많은 면에서 도움이 된다는 긍정적 결론을 제시하죠. 여기서는 Trying new things라는 \u003cb class=\"key\">동명사구\u003c/b>가 문장 전체의 주어 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사구 주어\u003c/span> : [Trying new things (동명사구)] + 단수동사 : \"새로운 것들을 시도하는 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구(명사 수식)\u003c/span> : [명사] + outside of + [명사] : \"당신의 편안한 영역 밖에서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">타동사 benefit(3형식)\u003c/span> : benefit + [목적어] : \"당신에게 도움이 되다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">전치사구(부사적 용법)\u003c/span> : in many ways : \"많은 면에서\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"Trying new things, 새로운 것들을 시도하는 것은. outside of your comfort zone, 당신의 편안한 영역 밖에서. will greatly benefit you, 당신에게 크게 도움이 될 것이다. in many ways, 많은 면에서. 이 문장 전체를 해석하면, 당신의 편안한 영역 밖에서 새로운 것들을 시도하는 것은 많은 면에서 당신에게 큰 도움이 될 것이다.","hl":"m"},{"n":20,"text":"이 문장은 글 전체의 주제를 미리 던지는 문장이에요. 편안한 영역 밖에서 새로운 것을 시도하는 일이 많은 면에서 도움이 된다는 거죠. Trying new things라는 동명사구가 문장의 주어 역할을 한다는 것도 같이 기억해 두세요.","hl":"mn"},{"n":21,"text":"첫 번째, Trying new things는 동명사구 주어예요. 동명사 주어는 단수로 취급한다는 점 기억하세요. 두 번째, outside of your comfort zone은 전치사구로 앞의 new things를 꾸며 줍니다. 세 번째, benefit은 타동사라서 전치사 없이 바로 you를 목적어로 받아요. 네 번째, in many ways는 부사구로 많은 면에서라는 뜻을 더해 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">첫째,\u003c/span>\u003cspan clas ur talents, interests, 자신의 재능, 관심사. strengths and weaknesses, 강점과 약점을. 이 문장 전체를 해석하면, 당신이 새로운 것들을 시도하면서 자신의 재능, 관심사, 강점과 약점을 발견하게 될 것이다.","hl":"m"},{"n":32,"text":"이 문장은 새로운 것에 도전하는 과정에서 자신의 재능, 관심사, 강점과 약점을 알게 된다는 뜻이에요. 앞의 자기 자신에 대해 배운다는 두 번째 이점을 구체화하고, 다음의 새로운 관계 형성으로 이어지는 흐름을 만들어 줍니다.","hl":"mn"},{"n":33,"text":"첫 번째로, As you try new things에서 as는 시간의 의미를 나타내는 접속사예요. 두 번째로, will discover에서 will은 결과를 예측하고 뒤에 동사원형 discover가 와요. 세 번째로, your talents, interests, strengths and weaknesses는 discover의 목적어로 명사가 쉼표와 and로 병렬된 구조예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마지막으로,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Finally,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 또한 ~할 수 있다\u003c/span>\u003cspan class=\"en\">you \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">also \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새로운 관계를 만들다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">build\u003c/span> new relationships.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">마지막으로, 당신은 또한 새로운 관계를 만들 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 말한 성장과 자기 이해에 이어, 세 번째 이점으로 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">관계\u003c/b>를 만들 수 있음을 제시하는 문장이에요. 새로운 시도가 \u003cb class=\"key\">인간관계\u003c/b>를 넓혀 준다는 점을 알려 주며, 다음 문장의 만남과 배움으로 자연스럽게 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">문장 연결 부사 Finally\u003c/span> : Finally, + [주어] + [동사] ... : \"마지막으로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 can + 부사 also + 동사원형\u003c/span> : [주어] + can + also + [동사원형] : \"또한 ~할 수 있다\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"Finally, 마지막으로. you can also, 당신은 또한 ~할 수 있다. build new relationships, 새로운 관계를 만들다.. 이 문장 전체를 해석하면, 마지막으로, 당신은 또한 새로운 관계를 만들 수 있다.","hl":"m"},{"n":35,"text":"이 문장은 세 번째 이점으로 새로운 관계를 만들 수 있음을 제시해요. 새로운 시도가 인간관계를 넓혀 준다는 점을 알려 주며, 다음 문장의 만남과 배움으로 이어집니다.","hl":"mn"},{"n":36,"text":"첫 번째로, Finally는 앞의 First, Furthermore와 이어지는 열거 표현이에요. 두 번째로, can also build에서 can 뒤에는 동사원형 build가 오고, also는 첨가의 의미를 더해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 당신이 새로운 것을 시도한다면,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">If \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">try \u003c/span>\u003cspan class=\"tgt\">something \u003c/span>\u003cspan class=\"tgt\">new,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 새로운 사람들을 만날 수 있다\u003c/span>\u003cspan class=\"en\">you can meet new people\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 사람들은 당신이 그렇지 않았으면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">who\u003c/span> you otherwise\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">결코 가질 수 없었을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">never \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">had\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만날 기회를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">chance \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">meet\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">만약 당신이 새로운 것을 시도한다면, 당신은 그렇지 않았으면 결코 만날 기회가 없었을 새로운 사람들을 만날 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 새로운 것에 도전하면, 그렇지 않았을 때는 만날 수 없었던 사람들을 만나게 된다는 의미예요. 이는 앞의 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">관계\u003c/b> 형성이라는 이점을 \u003cb class=\"key\">인과 \u003c/b>\u003cb class=\"key\">관계\u003c/b>로 뒷받침하고, 새로운 사람에게서 배우는 다음 내용으로 이어 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조건의 접속사 if\u003c/span> : If + [주어] + [현재동사], [주어] + can + [동사원형] : \"만약 당신이 새로운 것을 시도한다면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 who\u003c/span> : [선행사 new people] + who + [주어 you] + [동사 meet] : \"당신이 만날 새로운 사람들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">가정적 would have p.p. (otherwise)\u003c/span> : otherwise + [주어] + would never have + [p.p.] : \"그렇지 않았으면 결코 갖지 못했을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : [명사 the chance] + to + [동사원형 meet] : \"만날 기회\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"If you try something new, 만약 당신이 새로운 것을 시도한다면. you can meet new people, 당신은 새로운 사람들을 만날 수 있다. who you otherwise, 그 사람들은 당신이 그렇지 않았으면. would never have had, 결코 가질 수 없었을. the chance to meet, 만날 기회를. 이 문장 전체를 해석하면, 만약 당신이 새로운 것을 시도한다면, 당신은 그렇지 않았으면 결코 만날 기회가 없었을 새로운 사람들을 만날 수 있다.","hl":"m"},{"n":38,"text":"이 문장은 새로운 것에 도전하면 그렇지 않았을 때는 만날 수 없었던 사람들을 만나게 된다는 의미예요. 앞의 새로운 관계 형성이라는 이점을 인과 관계로 뒷받침하고, 새로운 사람에게서 배우는 다음 내용으로 이어 줍니다.","hl":"mn"},{"n":39,"text":"첫 번째로, If you try something new에서 if는 실제로 일어날 수 있는 조건을 나타내는 접속사예요. 두 번째로, who는 앞의 선행사 new people을 꾸미고 meet의 목적어 역할을 하는 목적격 관계대명사예요. 세 번째로, would never have had는 otherwise가 만드는 가정 속에서 과거 사실의 반대를 나타내요. 네 번째로, the chance to meet에서 to meet은 명사 chance를 뒤에서 꾸미는 형용사적 용법이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만들 수 있다\u003c/span>\u003cspan class=\"en\">can \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신의 삶을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">life \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 흥미롭게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">exciting\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 당신의 삶을 더 흥미롭게 만들 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 말한 '새로운 사람들을 만나는 일'이 삶을 더 흥미롭게 만든다는 뜻이에요. 글의 흐름에서 세 번째 이점인 '새로운 관계 맺기'를 \u003cb class=\"key\">마무리\u003c/b>하는 문장이죠. 주어 \u003cb class=\"key\">It\u003c/b>이 구체적인 사물이 아니라 앞 내용 전체를 받는다는 점이 핵심이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지시대명사(앞 문장 내용 받기)\u003c/span> : It = 앞 문장의 내용(새로운 사람들을 만나는 것) : \"그것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">5형식 make + 목적어 + 목적격 보어\u003c/span> : make + [목적어(your life)] + [목적격 보어(more exciting)] : \"당신의 삶을 더 흥미롭게 만들다\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"It, 그것은. can make, 만들 수 있다. your life, 당신의 삶을. more exciting, 더 흥미롭게. 이 문장 전체를 해석하면, 그것은 당신의 삶을 더 흥미롭게 만들 수 있다.","hl":"m"},{"n":41,"text":"여기서 It은 바로 앞에서 말한 새로운 사람들을 만나는 일을 통째로 받아요. 결국 새로운 관계를 맺는 것이 당신의 삶을 더 흥미롭게 만든다는 세 번째 이점의 마무리 문장이죠.","hl":"mn"},{"n":42,"text":"첫 번째, It은 앞 문장의 내용 전체를 받는 지시대명사예요. 두 번째, make는 목적어와 목적격 보어를 데리고 오는 5형식 동사이고, your life가 목적어, more exciting이 목적격 보어예요. 그래서 '당신의 삶을 더 흥미롭게 만들다'로 해석합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고\u003c/span>\u003cspan class=\"en\">And\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 배울 것이다\u003c/span>\u003cspan class=\"en\">you \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">learn\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들로부터 또한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">them\u003c/span>, too.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그리고 당신은 그들로부터 배울 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 새로 만난 사람들에게서도 얻는 것이 있다는 뜻으로, '새로운 관계'라는 이점을 한 번 더 강조해요. 앞 문장의 \u003cb class=\"key\">new \u003c/b>\u003cb class=\"key\">people\u003c/b>을 \u003cb class=\"key\">them\u003c/b>이 그대로 받고 있죠. '배움'과 '관계'를 연결하는 \u003cb class=\"key\">추가\u003c/b> 설명이라고 보면 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 will + 동사원형\u003c/span> : [조동사 will] + [동사원형 learn] : \"배울 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 from + 목적격 대명사\u003c/span> : learn + [from + 목적격(them)] : \"그들로부터\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"And, 그리고. you will learn, 당신은 배울 것이다. from them, too, 그들로부터 또한. 이 문장 전체를 해석하면, 그리고 당신은 그들로부터 배울 것이다.","hl":"m"},{"n":44,"text":"새로 만난 사람들에게서도 배울 것이 있다는 말이에요. 앞 문장에 나 "mn"},{"n":48,"text":"첫 번째, feel은 감각동사라서 뒤에 부사가 아니라 형용사 very uncomfortable가 주격 보어로 와요. 두 번째, The unfamiliarity는 the가 붙은 추상명사로 '그 생소함'이라는 특정 개념을 가리킵니다. 그래서 '생소함은 매우 불편하게 느껴질 것이다'로 해석해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만,\u003c/span>\u003cspan class=\"en\">However,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 ~할 수 있을 것이다\u003c/span>\u003cspan class=\"en\">you \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">able \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시야를 넓히다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">expand \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">horizons \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 성공을 이룰 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">achieve \u003c/span>\u003cspan class=\"tgt\">success\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만, 당신은 시야를 넓히고 성공을 이룰 수 있을 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 낯섦이 주는 불편함을 인정한 뒤, 그럼에도 그 불편함을 넘어서면 얻게 되는 긍정적 결과를 정리하는 마무리 문장이에요. \u003cb class=\"key\">However\u003c/b>가 불편함과 성취를 \u003cb class=\"key\">대조\u003c/b>로 이어 주며, 시야 확장과 성공이라는 두 가지 결실을 제시해 글 전체를 긍정적으로 닫아 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 상당 표현 be able to (미래의 능력)\u003c/span> : [주어] + will be able to + [동사원형] : \"~할 수 있을 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 병렬 구조\u003c/span> : to + [동사원형 A] and [동사원형 B] : \"시야를 넓히고 성공을 이루다\"\u003c/div>\u003c/div>","segs":[{"n":49,"text":"However, 하지만. you will be able to, 당신은 ~할 수 있을 것이다. expand your horizons, 시야를 넓히다. and achieve success, 그리고 성공을 이룰 것이다. 이 문장 전체를 해석하면, 하지만, 당신은 시야를 넓히고 성공을 이룰 수 있을 것이다.","hl":"m"},{"n":50,"text":"이 문장은 글의 마지막 문장이에요. 바로 앞에서 낯선 것들이 주는 불편함을 이야기했죠. 그런데 however로 방향을 틀어서, 그 불편함을 견디면 시야가 넓어지고 성공까지 이룰 수 있다고 긍정적으로 마무리하는 거예요.","hl":"mn"},{"n":51,"text":"먼저 will be able to를 보세요. can은 미래를 말하기 어려워서 미래의 능력은 be able to로 표현해요. 두 번째로 to expand your horizons and achieve success를 보면 to부정사 하나에 동사원형 두 개가 and로 병렬 연결되어 있어요. 그래서 achieve 앞에는 to를 다시 쓰지 않는 거예요. 마지막으로 horizons는 원래 지평선이라는 뜻인데 여기서는 시야, 견문이라는 뜻으로 쓰였으니 그 느낌으로 해석해 주세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>성공하려면 \u003cb class=\"key\">불편함\u003c/b>을 편안하게 받아들이고 안락지대에서 벗어나야 합니다.\u003c/li>\u003cli>안락지대 밖에서의 새로운 시도는 \u003cb class=\"key\">성장\u003c/b>의 기회와 예상치 못한 변화를 줍니다.\u003c/li>\u003cli>도전하는 과정에서 자신의 재능과 강점, 약점을 알게 되어 \u003cb class=\"key\">자기 \u003c/b>\u003cb class=\"key\">이해\u003c/b>가 깊어집니다.\u003c/li>\u003cli>새로운 사람들을 만나 \u003cb class=\"key\">관계\u003c/b>를 쌓고 그들에게서 배우며, 결국 시야를 넓혀 성공을 이룹니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Stepping out of your comfort zone and trying new things brings personal growth, self-discovery, and new relationships, which can lead you to expand your horizons and achieve success.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">성공을 원한다면 \u003cb class=\"key\">불편함\u003c/b>을 편안하게 받아들이고 \u003cb class=\"key\">편안한 \u003c/b>\u003cb class=\"key\">영역\u003c/b> 밖으로 나가야 합니다. 새로운 것에 도전하면 성장의 기회와 자기 이해, 새로운 관계라는 세 가지 이점을 얻어 결국 \u003cb class=\"key\">시야\u003c/b>를 넓히고 성공을 이룰 수 있습니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":52,"text":"오늘 읽은 글은 결국 한 문장으로 정리됩니다. 편안함에 머물지 말고 불편함을 받아들이며 한 걸음 나아가라는 거죠. 그 한 걸음이 성장의 기회와 자기 이해, 그리고 새로운 관계를 데려다줍니다.
