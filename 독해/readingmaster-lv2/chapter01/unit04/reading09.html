<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터2 Reading09 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터2 Reading09","audioDir":"reading09_audio","preview":false,"count":43,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.520em\">Reading09\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터2\u003c/div>\u003ch1>Saving the Great Barrier Reef: A Call for Immediate Action\u003c/h1>\u003ch2>그레이트 배리어 리프를 구하자: 즉각적인 행동을 향한 외침\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>호주의 Great Barrier Reef는 세계에서 가장 큰 산호초 시스템 중 하나이자 다양한 해양 종의 서식지이지만, \u003cb class=\"key\">지구 \u003c/b>\u003cb class=\"key\">온난화\u003c/b>로 인한 \u003cb class=\"key\">산호 \u003c/b>\u003cb class=\"key\">탈색\u003c/b>과 \u003cb class=\"key\">수질 \u003c/b>\u003cb class=\"key\">오염\u003c/b>이라는 환경 문제에 직면해 있다. 따라서 우리는 온실가스 배출량을 줄이고 수질을 개선하는 복합적인 노력을 통해 이 생태계를 \u003cb class=\"key\">즉각적으로 \u003c/b>\u003cb class=\"key\">보호\u003c/b>해야 하며, 그 미래는 우리의 행동에 달려 있다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The Great Barrier Reef is threatened by global warming and water pollution, so we must take immediate action to protect it and its marine life.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 리딩마스터 투의 아홉 번째 지문이고, 제목은 Saving the Great Barrier Reef, 우리말로는 그레이트 배리어 리프를 구하자예요. 이 글은 호주의 거대한 산호초가 지구 온난화와 수질 오염으로 위협받고 있으니 즉각적으로 보호해야 한다는 내용을 담고 있어요. 요약하면 산호초의 가치, 그것을 위협하는 두 가지 문제, 그리고 우리가 해야 할 행동을 차례로 보여 주는 글이에요. 그럼 시작해 볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">산호초(coral reef)는 산호충이 만들어 낸 단단한 골격이 오랜 세월 쌓여 형성된 해저 구조물이에요. 산호는 몸속에 사는 공생조류(zooxanthellae)에게서 영양분을 얻고 그 조류 덕분에 색깔도 갖게 되는데, 이 관계를 공생(symbiosis)이라고 불러요. 그런데 수온이 오르면 산호가 스트레스를 받아 공생조류를 내보내면서 하얗게 변하는데, 이것이 바로 \u003cb class=\"key\">산호 \u003c/b>\u003cb class=\"key\">탈색\u003c/b>(coral bleaching)이에요. 색을 잃는 것으로 끝나지 않고 영양 공급이 끊겨 \u003cb class=\"key\">죽음\u003c/b>에 이르기도 하죠. 비유하자면 산호는 집을 짓는 건축가이자 그 집에 사는 세입자 같은 존재라서, 산호가 사라지면 1,500종이 넘는 물고기를 포함한 수많은 해양 생물이 \u003cb class=\"key\">서식지\u003c/b>를 잃게 돼요. 여기에 농업용수와 산업 폐기물이 만드는 \u003cb class=\"key\">수질 \u003c/b>\u003cb class=\"key\">오염\u003c/b>까지 더해지면 산호초가 회복할 시간은 점점 줄어들어요.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식부터 짚고 갈게요. 산호초는 산호충이 만들어 낸 단단한 골격이 오랜 세월 쌓여 형성된 해저 구조물이에요. 산호는 몸속에 사는 공생조류에게서 영양분을 얻고, 그 조류 덕분에 색깔도 갖게 되죠. 그런데 수온이 오르면 산호가 스트레스를 받아 공생조류를 내보내면서 하얗게 변하는데, 이것을 산호 탈색이라고 불러요. 색을 잃는 것으로 끝나지 않고 영양 공급이 끊겨 죽음에 이르기도 하죠. 산호는 집을 짓는 건축가이자 그 집에 사는 세입자 같은 존재라서, 산호가 사라지면 수많은 해양 생물이 서식지를 잃게 돼요. 여기에 수질 오염까지 더해지면 산호초가 회복할 시간은 점점 줄어든다는 점을 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>산호초 소개\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>글은 먼저 호주의 Great Barrier Reef가 세계에서 가장 큰 \u003cb class=\"key\">산호초\u003c/b> 시스템 중 하나라고 소개해요. 이어서 이곳이 1,500종이 넘는 물고기를 포함한 다양한 해양 생물의 \u003cb class=\"key\">서식지\u003c/b>라는 점을 밝히죠. 독자는 이 두 문장만으로 이곳이 얼마나 \u003cb class=\"key\">생물다양성\u003c/b>이 풍부한 장소인지 알게 돼요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>문제 제기\u003csmall>전환 · 문장 3\u003c/small>\u003c/h4>\u003cp>그런데 세 번째 문장에서 However가 등장하며 분위기가 바뀌어요. 최근 몇 년 동안 이곳이 수많은 \u003cb class=\"key\">환경 \u003c/b>\u003cb class=\"key\">문제\u003c/b>에 직면해 왔다고 문제를 던지죠. 앞의 찬사와 뒤의 경고가 \u003cb class=\"key\">대조\u003c/b>를 이루는 지점이에요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>원인 분석\u003csmall>근거 · 문장 4–6\u003c/small>\u003c/h4>\u003cp>네 번째와 다섯 번째 문장은 \u003cb class=\"key\">지구 \u003c/b>\u003cb class=\"key\">온난화\u003c/b>가 해양 온도를 올려 산호 탈색을 초래하고, 결국 산호가 색을 잃고 죽게 된다는 인과를 설명해요. 여섯 번째 문장에서는 농업용수와 산업 폐기물로 인한 \u003cb class=\"key\">수질 \u003c/b>\u003cb class=\"key\">오염\u003c/b>이 수질을 악화시킨다고 덧붙이죠. 문제의 원인이 두 갈래로 제시되는 부분이에요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>해결 방안\u003csmall>주장 · 문장 7–8\u003c/small>\u003c/h4>\u003cp>일곱 번째 문장에서 필자는 우리가 즉각적인 \u003cb class=\"key\">조치\u003c/b>를 취해야 한다고 강하게 주장해요. 여덟 번째 문장은 그 방법으로 온실가스 배출량을 줄이는 것과 \u003cb class=\"key\">수질 \u003c/b>\u003cb class=\"key\">개선\u003c/b>을 결합한 복합적인 노력이 필요하다고 근거를 제시하죠. 주장과 근거가 나란히 놓이는 대목이에요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>미래의 조건\u003csmall>결론 · 문장 9–10\u003c/small>\u003c/h4>\u003cp>아홉 번째 문장은 산호초와 그곳을 집이라고 부르는 수백만 종의 미래가 우리의 행동에 달려 있다고 정리해요. 마지막 문장은 조치가 없다면 이 놀라운 \u003cb class=\"key\">생태계\u003c/b>의 미래는 불확실하다는 경고로 글을 맺죠. 결국 모든 논의가 우리의 실천으로 수렴되는 구조예요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 다섯 단계로 나눠서 따라가 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 산호초 소개예요. 글은 호주의 Great Barrier Reef가 세계에서 가장 큰 산호초 시스템 중 하나라고 말해요. 그리고 1,500종이 넘는 물고기를 포함한 다양한 해양 생물의 서식지라는 점을 덧붙이죠. 이 두 문장만 읽어도 이곳이 얼마나 생물다양성이 풍부한 곳인지 느낄 수 있어요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 문제 제기예요. 세 번째 문장에서 However가 나오면서 분위기가 확 바뀌죠. 최근 몇 년 동안 이곳이 수많은 환경 문제에 직면해 왔다고 문제를 던져요. 앞에서 칭찬하던 내용과 뒤의 경고가 대조를 이루는 지점이에요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 원인 분석이에요. 네 번째와 다섯 번째 문장은 지구 온난화가 해양 온도를 올려 산호 탈색을 초래하고, 결국 산호가 색을 잃고 죽게 된다는 인과를 보여 줘요. 여섯 번째 문장에서는 농업용수와 산업 폐기물로 인한 수질 오염이 수질을 악화시킨다고 덧붙이죠. 문제의 원인이 두 갈래로 제시되는 셈이에요.","hl":"f2"},{"n":7,"text":"네 번째 단계는 해결 방안이에요. 일곱 번째 문장에서 필자는 우리가 즉각적인 조치를 취해야 한다고 강하게 주장해요. 여덟 번째 문장은 그 방법으로 온실가스 배출량을 줄이는 것과 수질 개선을 결합한 복합적인 노력이 필요하다고 말하죠.","hl":"f3"},{"n":8,"text":"다섯 번째 단계는 미래의 조건이에요. 아홉 번째 문장은 산호초와 그곳에 서식하는 수백만 종의 미래가 우리의 행동에 달려 있다고 정리해요. 마지막 문장은 조치가 없다면 이 놀라운 생태계의 미래는 불확실하다는 경고로 글을 닫죠.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 7번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 문제를 제시하고 해결책을 요구하는 \u003cb class=\"key\">문제-해결\u003c/b> 구조예요. 세 번째 문장에서 환경 문제를 꺼내고, 네 번째부터 여섯 번째 문장까지 원인을 밝힌 뒤, 일곱 번째와 여덟 번째 문장에서 해결 방안을 제시하죠. 필자의 주장이 담긴 \u003cb class=\"key\">주제문\u003c/b>은 일곱 번째 문장이고, 마지막 두 문장의 경고가 그 주장을 받쳐 주는 \u003cb class=\"key\">미괄식\u003c/b> 구성이에요. 따라서 중심 내용이 글 후반부에서 힘을 얻는 방식으로 전개된다고 볼 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>However (3)\u003c/b>\u003cspan>화제 전환\u003c/span>\u003cb>resulting in (4)\u003c/b>\u003cspan>인과\u003c/span>\u003cb>This causes (5)\u003c/b>\u003cspan>인과\u003c/span>\u003cb>Furthermore (6)\u003c/b>\u003cspan>정보 추가\u003c/span>\u003cb>must (7)\u003c/b>\u003cspan>강한 주장\u003c/span>\u003cb>requires (8)\u003c/b>\u003cspan>근거 제시\u003c/span>\u003cb>Without action (10)\u003c/b>\u003cspan>조건·결론\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">environmental challenges\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">coral bleaching\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">lose its color and even die\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">poor water quality\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">take immediate action\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a combination of efforts\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">depends on it\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"이 글의 전개 방식은 문제-해결이에요. 세 번째 문장에서 문제를 꺼내고, 네 번째부터 여섯 번째 문장까지 원인을 밝힌 다음, 일곱 번째와 여덟 번째 문장에서 해결 방안을 제시하죠. 필자의 주장이 담긴 주제문은 일곱 번째 문장이고, 마지막 두 문장의 경고가 그것을 받쳐 주는 미괄식 구성이에요. 그래서 읽을 때는 문제 덩어리와 해결 덩어리를 나눠 표시하면서 앞에서 뒤로 따라가면 돼요.","hl":"ty"},{"n":10,"text":"신호어를 눈여겨보세요. 세 번째 문장의 However는 화제를 전환하는 신호이고, 네 번째 문장의 resulting in과 다섯 번째 문장의 This causes는 인과를 이어 주는 표현이에요. 여섯 번째 문장의 Furthermore는 문제를 하나 더 추가한다는 표시이고, 일곱 번째 문장의 must는 필자의 강한 주장을 알려 주죠. 마지막 문장의 Without action은 조건을 제시하며 결론을 맺는 신호라는 것도 함께 기억해 두세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>coral reef\u003c/b>\u003cem>명사\u003c/em>\u003cspan>산호초\u003c/span>\u003c/div>\u003cdiv>\u003cb>be home to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~의 서식지이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>various\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>다양한\u003c/span>\u003c/div>\u003cdiv>\u003cb>marine\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>해양의, 바다의\u003c/span>\u003c/div>\u003cdiv>\u003cb>species\u003c/b>\u003cem>명사\u003c/em>\u003cspan>종\u003c/span>\u003c/div>\u003cdiv>\u003cb>including\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~을 포함하여\u003c/span>\u003c/div>\u003cdiv>\u003cb>environmental\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>환경의\u003c/span>\u003c/div>\u003cdiv>\u003cb>challenge\u003c/b>\u003cem>명사\u003c/em>\u003cspan>문제, 도전\u003c/span>\u003c/div>\u003cdiv>\u003cb>global warming\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지구 온난화\u003c/span>\u003c/div>\u003cdiv>\u003cb>cause\u003c/b>\u003cem>동사\u003c/em>\u003cspan>일으키다, 초래하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>increase\u003c/b>\u003cem>명사\u003c/em>\u003cspan>증가\u003c/span>\u003c/div>\u003cdiv>\u003cb>ocean temperature\u003c/b>\u003cem>명사\u003c/em>\u003cspan>해양 온도\u003c/span>\u003c/div>\u003cdiv>\u003cb>result in\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 초래하다, ~라는 결과를 낳다\u003c/span>\u003c/div>\u003cdiv>\u003cb>coral bleaching\u003c/b>\u003cem>명사\u003c/em>\u003cspan>산호 탈색\u003c/span>\u003c/div>\u003cdiv>\u003cb>lose\u003c/b>\u003cem>동사\u003c/em>\u003cspan>잃다\u003c/span>\u003c/div>\u003cdiv>\u003cb>furthermore\u003c/b>\u003cem>부사\u003c/em>\u003cspan>게다가, 더욱이\u003c/span>\u003c/div>\u003cdiv>\u003cb>pollution\u003c/b>\u003cem>명사\u003c/em>\u003cspan>오염\u003c/span>\u003c/div>\u003cdiv>\u003cb>agriculture\u003c/b>\u003cem>명사\u003c/em>\u003cspan>농업\u003c/span>\u003c/div>\u003cdiv>\u003cb>industrial waste\u003c/b>\u003cem>명사\u003c/em>\u003cspan>산업 폐기물\u003c/span>\u003c/div>\u003cdiv>\u003cb>water quality\u003c/b>\u003cem>명사\u003c/em>\u003cspan>수질\u003c/span>\u003c/div>\u003cdiv>\u003cb>immediate\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>즉각적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>action\u003c/b>\u003cem>명사\u003c/em>\u003cspan>조치, 행동\u003c/span>\u003c/div>\u003cdiv>\u003cb>protect\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보호하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>require\u003c/b>\u003cem>동사\u003c/em>\u003cspan>필요로 하다, 요구하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>combination\u003c/b>\u003cem>명사\u003c/em>\u003cspan>결합, 조합\u003c/span>\u003c/div>\u003cdiv>\u003cb>effort\u003c/b>\u003cem>명사\u003c/em>\u003cspan>노력\u003c/span>\u003c/div>\u003cdiv>\u003cb>reduce\u003c/b>\u003cem>동사\u003c/em>\u003cspan>줄이다, 감소시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>greenhouse gas emissions\u003c/b>\u003cem>명사\u003c/em>\u003cspan>온실가스 배출량\u003c/span>\u003c/div>\u003cdiv>\u003cb>improve\u003c/b>\u003cem>동사\u003c/em>\u003cspan>개선하다, 향상시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>depend on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 달려 있다, ~에 의존하다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"단어도 몇 개만 짚어 볼게요. be home to는 서식지이다라는 뜻의 숙어이고, result in은 초래하다, require는 필요로 하다라는 뜻이에요. depend on은 달려 있다, greenhouse gas emissions는 온실가스 배출량으로 정리해 두면 좋아요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">various\u003c/b>\u003cspan class=\"m\">다양한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">diverse\u003c/span>\u003cspan class=\"s\">varied\u003c/span>\u003cspan class=\"s\">assorted\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">uniform\u003c/span>\u003cspan class=\"a\">identical\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">challenge\u003c/b>\u003cspan class=\"m\">문제, 도전\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">difficulty\u003c/span>\u003cspan class=\"s\">problem\u003c/span>\u003cspan class=\"s\">obstacle\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ease\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">cause\u003c/b>\u003cspan class=\"m\">일으키다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">lead to\u003c/span>\u003cspan class=\"s\">bring about\u003c/span>\u003cspan class=\"s\">trigger\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">prevent\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">increase\u003c/b>\u003cspan class=\"m\">증가\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">rise\u003c/span>\u003cspan class=\"s\">growth\u003c/span>\u003cspan class=\"s\">gain\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">decrease\u003c/span>\u003cspan class=\"a\">reduction\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">protect\u003c/b>\u003cspan class=\"m\">보호하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">preserve\u003c/span>\u003cspan class=\"s\">safeguard\u003c/span>\u003cspan class=\"s\">conserve\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">harm\u003c/span>\u003cspan class=\"a\">damage\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">reduce\u003c/b>\u003cspan class=\"m\">줄이다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">decrease\u003c/span>\u003cspan class=\"s\">lessen\u003c/span>\u003cspan class=\"s\">cut\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">increase\u003c/span>\u003cspan class=\"a\">expand\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">improve\u003c/b>\u003cspan class=\"m\">개선하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">enhance\u003c/span>\u003cspan class=\"s\">better\u003c/span>\u003cspan class=\"s\">upgrade\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">worsen\u003c/span>\u003cspan class=\"a\">deteriorate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">uncertain\u003c/b>\u003cspan class=\"m\">불확실한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">unclear\u003c/span>\u003cspan class=\"s\">doubtful\u003c/span>\u003cspan class=\"s\">unpredictable\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">certain\u003c/span>\u003cspan class=\"a\">definite\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어도 함께 정리해요. various는 diverse나 varied로 바꿔 쓸 수 있고, 반대말은 uniform이에요. protect는 preserve나 safeguard와 가깝고, 반대는 harm이나 damage죠. reduce는 decrease나 lessen으로 바꿀 수 있고 반대는 increase예요. improve는 enhance나 better로 바꿀 수 있고 반대는 worsen이에요. 그리고 uncertain은 unclear나 doubtful로 바꿀 수 있고 반대는 certain이라는 점도 챙겨 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그레이트 배리어 리프는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">The \u003c/span>\u003cspan class=\"tgt\">Great \u003c/span>\u003cspan class=\"tgt\">Barrier \u003c/span>\u003cspan class=\"tgt\">Reef \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">호주의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">Australia\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가장 큰 것 중 하나이다\u003c/span>\u003cspan class=\"en\">is \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">largest \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">산호초 시스템\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">coral \u003c/span>\u003cspan class=\"tgt\">reef \u003c/span>\u003cspan class=\"tgt\">systems\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세계에서\u003c/span>\u003cspan class=\"en\">in the world.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">호주의 Great Barrier Reef는 세계에서 가장 큰 산호초 시스템 중 하나이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 지문의 \u003cb class=\"key\">도입\u003c/b>으로, 호주의 \u003cb class=\"key\">그레이트 \u003c/b>\u003cb class=\"key\">배리어 \u003c/b>\u003cb class=\"key\">리프\u003c/b>가 세계에서 가장 큰 \u003cb class=\"key\">산호초 \u003c/b>\u003cb class=\"key\">시스템\u003c/b> 중 하나임을 소개하며 화제를 꺼내요. one of the largest는 '가장 큰 것들 중 하나'라는 뜻으로, 규모가 대단하다는 점을 강조하는 표현이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 수식(명사 뒤 수식)\u003c/span> : [명사] + [[in + 장소]] → '~에 있는 명사' : \"호주의 그레이트 배리어 리프\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">one of the + 최상급 + 복수명사\u003c/span> : [[one of]] + the + [[최상급]] + [[복수명사]] : \"가장 큰 산호초 시스템 중 하나\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"The Great Barrier Reef, 그레이트 배리어 리프는. in Australia, 호주의. is one of the largest, 가장 큰 것 중 하나이다. coral reef systems, 산호초 시스템. in the world, 세계에서. 이 문장 전체를 해석하면, 호주의 Great Barrier Reef는 세계에서 가장 큰 산호초 시스템 중 하나이다.","hl":"m"},{"n":14,"text":"이 문장은 지문의 도입 부분이에요. 호주의 그레이트 배리어 리프가 세계에서 가장 큰 산호초 시스템 중 하나라고 소개하면서 이야기를 시작하죠. one of the largest라고 하면 가장 큰 것들 중 하나라는 뜻이라서, 규모가 정말 어마어마하다는 느낌을 줘요.","hl":"mn"},{"n":15,"text":"첫 번째로, The Great Barrier Reef in Australia에서 in Australia라는 전치사구가 명사 뒤에서 꾸며 주고 있어요. 영어는 명사를 꾸미는 전치사구를 명사 뒤에 붙인다는 점, 꼭 기억해 두세요. 두 번째로, one of the largest coral reef systems에서 one of the 다음에는 최상급과 복수명사가 온다는 규칙이에요. 여럿 중에 하나니까 뒤에 복수명사가 와야 한다는 것, 시험에 정말 자주 나와요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이곳은 ~의 서식지다\u003c/span>\u003cspan class=\"en\">It \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">home \u003c/span>\u003cspan class=\"tgt\">to\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다양한 해양 종들의\u003c/span>\u003cspan class=\"en\">various marine species\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1,500종이 넘는 다양한 종류의 물고기를 포함한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">including \u003c/span>\u003cspan class=\"tgt\">over \u003c/span>\u003cspan class=\"tgt\">1,500 \u003c/span>\u003cspan class=\"tgt\">different \u003c/span>\u003cspan class=\"tgt\">types \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">fish\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이곳은 1,500종이 넘는 다양한 종류의 물고기를 포함한 다양한 해양 종들의 서식지다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 소개한 리프가 얼마나 \u003cb class=\"key\">생물 \u003c/b>\u003cb class=\"key\">다양성\u003c/b>이 풍부한 곳인지 알려 주는 문장이에요. be home to는 '~의 \u003cb class=\"key\">서식지\u003c/b>이다'라는 관용 표현이고, including은 '~을 포함하여'로 구체적인 예시를 덧붙이는 표현이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관용 표현 be home to\u003c/span> : [주어] + be home to + [명사] → '~의 서식지이다' : \"~의 서식지이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재분사 including의 전치사적 용법\u003c/span> : [앞 명사] + [[including]] + [예시 명사] : \"1,500종이 넘는 다양한 종류의 물고기를 포함하여\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"It is home to, 이곳은 ~의 서식지다. various marine species, 다양한 해양 종들의. including over 1,500 different types of fish, 1,500종이 넘는 다양한 종류의 물고기를 포함한. 이 문장 전체를 해석하면, 이곳은 1,500종이 넘는 다양한 종류의 물고기를 포함한 다양한 해양 종들의 서식지다.","hl":"m"},{"n":17,"text":"앞 문장에서 소개한 리프가 얼마나 생물 다양성이 풍부한 곳인지 알려 주는 문장이에요. be home to는 서식지라는 뜻의 관용 표현이고, including은 구체적인 예시를 덧붙이는 표현이죠.","hl":"mn"},{"n":18,"text":"첫 번째로, is home to에서 home을 그냥 집이라고만 생각하면 안 돼요. be home to는 '~의 서식지이다'라는 관용 표현이에요. 두 번째로, including은 동사 include에서 온 현재분사인데, 여기서는 전치사처럼 쓰여서 뒤에 예시 명사구를 달고 나온다는 점을 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">However\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">최근 몇 년 동안\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">recent \u003c/span>\u003cspan class=\"tgt\">years\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 직면해 왔다\u003c/span>\u003cspan class=\"en\">it \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">been \u003c/span>\u003cspan class=\"tgt\">facing\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수많은 환경 문제에\u003c/span>\u003cspan class=\"en\">numerous environmental challenges.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나, 최근 몇 년 동안, 그것은 수많은 환경 문제에 직면해 왔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 \u003cb class=\"key\">긍정적\u003c/b> 소개와 대조되며 흐름을 바꾸는 \u003cb class=\"key\">전환\u003c/b> 문장이에요. however로 방향을 틀고, 현재완료진행 has been facing으로 문제가 최근까지 \u003cb class=\"key\">계속\u003c/b> 이어지고 있음을 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">연결부사 however(역접)\u003c/span> : [문장] + [[However]], + [문장] → 앞 내용과 반대되는 흐름 : \"그러나\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재완료와 함께 쓰는 시간 표현\u003c/span> : [[in recent years]] + 현재완료 : \"최근 몇 년 동안\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">현재완료진행(have/has been + -ing)\u003c/span> : [주어] + [[has been]] + [[-ing]] → '계속 ~해 왔다' : \"직면해 왔다\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"However, 그러나. in recent years, 최근 몇 년 동안. it has been facing, 그것은 직면해 왔다. numerous environmental challenges, 수많은 환경 문제에. 이 문장 전체를 해석하면, 그러나, 최근 몇 년 동안, 그것은 수많은 환경 문제에 직면해 왔다.","hl":"m"},{"n":20,"text":"여기서 글의 분위기가 확 바뀌죠. 앞에서는 리프가 얼마나 대단한 곳인지 긍정적으로 소개했는데, however로 방향을 틀어서 이제 문제를 꺼내는 전환 문장이에요. 현재완료진행을 써서 최근 몇 년 동안 계속 겪어 오고 있다는 점을 강조하고 있어요.","hl":"mn"},{"n":21,"text":"먼저 however는 역접을 나타내는 연결부사예요. 접속사가 아니라서 앞 문장과 콤마로만 이어 준다는 점을 기억하세요. 두 번째로 in recent years는 현재완료와 잘 어울리는 시간 표현이에요. 그래서 세 번째로 나오는 has been facing이 현재완료진행 형태로 쓰인 거죠. 과거에 시작해서 지금까지 계속되고 있다는 뜻을 담고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지구 온난화로 인해\u003c/span>\u003cspan class=\"en\">Global warming\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">초래했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">caused\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">해양 온도의 상승을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">increase \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">ocean \u003c/span>\u003cspan class=\"tgt\">temperatures\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 결과 산호 탈색을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">resulting \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">coral \u003c/span>\u003cspan class=\"tgt\">bleaching\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">지구 온난화로 인해 해양 온도가 상승하여 산호 탈색을 초래했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 지구 온난화가 해양 온도를 높여 산호 탈색을 일으켰다는 \u003cb class=\"key\">인과 \u003c/b>\u003cb class=\"key\">관계\u003c/b>를 한 문장으로 정리한 부분입니다. 앞 문장에서 던진 '환경 문제'의 첫 번째 원인을 구체화하며, resulting in은 앞 절 전체를 원인으로 받아 결과를 이어 주는 표현입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재완료(have/has + p.p.)\u003c/span> : [주어 Global warming] + [has + p.p. caused] : \"초래해 왔다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 명사 수식\u003c/span> : [명사 an increase] + [전치사구 in ocean temperatures] : \"해양 온도의 상승\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">분사구문(결과)\u003c/span> : [주절] , + [resulting in + 명사] (능동 분사구문) : \"그 결과 산호 탈색을 초래하면서\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"Global warming, 지구 온난화로 인해. has caused, 초래했다. an increase in ocean temperatures, 해양 온도의 상승을. resulting in coral bleaching, 그 결과 산호 탈색을. 이 문장 전체를 해석하면, 지구 온난화로 인해 해양 온도가 상승하여 산호 탈색을 초래했다.","hl":"m"},{"n":23,"text":"이 문장은 지구 온난화가 해양 온도를 올리고, 그 결과 산호 탈색이 일어난다는 인과 관계를 담고 있어요. 앞 문장에서 환경 문제가 생겼다고 했으니, 여기서는 그 첫 번째 원인을 구체적으로 제시하는 거죠. 핵심은 원인과 결과가 한 문장 안에서 이어진다는 점이에요.","hl":"mn"},{"n":24,"text":"먼저 has caused는 현재완료예요. 과거에 시작된 온난화가 지금까지 이어지면서 결과를 만든다는 뜻이죠. 두 번째로 an increase in ocean temperatures에서 전치사구가 increase를 뒤에서 꾸며 주는 명사 수식 구조를 확인하세요. 마지막으로 resulting in coral bleaching은 앞 절 전체가 원인이 되어 생긴 결과를 나타내는 분사구문이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은 만들죠\u003c/span>\u003cspan class=\"en\">This \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">causes \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">산호가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">coral \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">색깔을 잃게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">lose \u003c/span>\u003cspan class=\"tgt\">its \u003c/span>\u003cspan class=\"tgt\">color \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 심지어 죽게까지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">even \u003c/span>\u003cspan class=\"tgt\">die\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것은 산호가 색깔을 잃게 하고 심지어 죽게 만든다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 산호 탈색이 산호에게 미치는 피해를 색을 잃는 단계에서 죽음까지 확장해 보여 줍니다. even이 '\u003cb class=\"key\">심지어\u003c/b>'로 피해의 심각성을 강조하고, 이는 뒤에 나올 \u003cb class=\"key\">보호의 \u003c/b>\u003cb class=\"key\">필요성\u003c/b>을 뒷받침합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">5형식(cause + 목적어 + to부정사)\u003c/span> : cause + [목적어 the coral] + [to부정사 to lose] : \"산호가 색을 잃게 만든다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 병렬 구조\u003c/span> : [to lose its color] and [even die] (to부정사구 병렬) : \"색깔을 잃고 심지어 죽게\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"This causes, 이것은 만들죠. the coral, 산호가. to lose its color, 색깔을 잃게. and even die, 그리고 심지어 죽게까지. 이 문장 전체를 해석하면, 이것은 산호가 색깔을 잃게 하고 심지어 죽게 만든다.","hl":"m"},{"n":26,"text":"앞 문장에서 산호 탈색이 일어났다고 했죠. 이 문장은 그 산호 탈색이 산호에게 어떤 피해를 주는지 색을 잃는 것에서 죽음으로까지 단계적으로 보여 줘요. even이 붙어서 피해가 훨씬 심각하다는 느낌을 강조합니다.","hl":"mn"},{"n":27,"text":"먼저 causes the coral to lose는 목적어 뒤에 to부정사가 오는 5형식이에요. cause가 '~하게 만들다'라는 뜻으로 쓰인 거죠. 두 번째로 to lose its color and even die를 보면 and 뒤의 die도 같은 to를 공유하는 병렬 구조라서 동사원형으로 쓰였어요. 그리고 even은 '심지어'라는 강조 부사로 피해의 심각성을 더해 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">게다가\u003c/span>\u003cspan class=\"en\">Furthermore,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수질 오염은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">water \u003c/span>\u003cspan class=\"tgt\">pollution\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">농업에 사용되는 물로 인한\u003c/span>\u003cspan class=\"en\">from \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">water \u003c/span>\u003cspan class=\"tgt\">used \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">agriculture\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 산업 폐기물로 인한\u003c/span>\u003cspan class=\"en\">and industrial waste\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수질을 나쁘게 만든다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">makes \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">water \u003c/span>\u003cspan class=\"tgt\">quality \u003c/span>\u003cspan class=\"tgt\">poor\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">게다가, 농업에 사용되는 물과 산업 폐기물로 인한 수질 오염은 수질을 악화시킨다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 온난화에 이어 두 번째 환경 문제로 \u003cb class=\"key\">수질 \u003c/b>\u003cb class=\"key\">오염\u003c/b>을 제시하는 문장입니다. Furthermore가 앞 내용에 원인을 하나 더 \u003cb class=\"key\">추가\u003c/b>한다는 신호를 주고, 긴 주어 때문에 '무엇이 수질을 나쁘게 만드는가'를 정확히 잡아야 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주어-동사 수 일치\u003c/span> : [단수 주어 water pollution] + [단수 동사 makes] : \"수질 오염은 … 만든다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사의 형용사적 용법(수동)\u003c/span> : [명사 water] + [used (과거분사) for agriculture] : \"농업에 사용되는 물\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">5형식(make + 목적어 + 형용사 목적격보어)\u003c/span> : make + [목적어 the water quality] + [형용사 poor] : \"수질을 나쁘게 만든다\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"Furthermore, 게다가. water pollution, 수질 오염은. from water used for agriculture, 농업에 사용되는 물로 인한. and industrial waste, 그리고 산업 폐기물로 인한. makes the water quality poor, 수질을 나쁘게 만든다. 이 문장 전체를 해석하면, 게다가, 농업에 사용되는 물과 산업 폐기물로 인한 수질 오염은 수질을 악화시킨다.","hl":"m"},{"n":29,"text":"앞에서 온난화라는 원인을 봤으니, 여기서는 두 번째 원인인 수질 오염을 추가하는 문장이에요. Furthermore로 앞 내용에 이어 붙이고 있죠. 주어가 아주 길지만 결국 수질 오염이 수질을 나쁘게 만든다는 단순한 구조라는 걸 잡아야 해요.","hl":"mn"},{"n":30,"text":"먼저 water pollution이 주어인데 단수라서 동사가 makes로 수 일치를 한다는 점을 기억하세요. 두 번째로 water used for agriculture에서 water와 use는 수동 관계라서 과거분사 used가 명사를 뒤에서 꾸며 줍니다. 마지막으로 makes the water quality poor는 목적어 뒤에 형용사가 오는 5형식으로 '~을 나쁘게 만들다'라고 해석해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 취해야 한다\u003c/span>\u003cspan class=\"en\">We \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">must \u003c/span>\u003cspan class=\"tgt\">take\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">즉각적인 조치를\u003c/span>\u003cspan class=\"en\">immediate action\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보호하기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">protect \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그레이트 배리어 리프를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">Great \u003c/span>\u003cspan class=\"tgt\">Barrier \u003c/span>\u003cspan class=\"tgt\">Reef \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그곳의 해양 생물을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">its \u003c/span>\u003cspan class=\"tgt\">marine \u003c/span>\u003cspan class=\"tgt\">life\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 Great Barrier Reef와 그곳의 해양 생물을 보호하기 위해 즉각적인 조치를 취해야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 리프가 겪는 환경 문제를 쭉 나열한 뒤, 글쓴이가 독자에게 \u003cb class=\"key\">즉각적인 \u003c/b>\u003cb class=\"key\">조치\u003c/b>를 요구하는 문장이에요. 보호의 대상이 리프 하나가 아니라 그곳의 \u003cb class=\"key\">해양 \u003c/b>\u003cb class=\"key\">생물\u003c/b>까지 포함된다는 점이 중요합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 must (강한 의무)\u003c/span> : [주어] + must + [동사원형] : \"~해야 한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : [행위] + to + [동사원형] (~하기 위해) : \"그레이트 배리어 리프와 그곳의 해양 생물을 보호하기 위해\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"We must take, 우리는 취해야 한다. immediate action, 즉각적인 조치를. to protect, 보호하기 위해. the Great Barrier Reef, 그레이트 배리어 리프를. and its marine life, 그리고 그곳의 해양 생물을. 이 문장 전체를 해석하면, 우리는 Great Barrier Reef와 그곳의 해양 생물을 보호하기 위해 즉각적인 조치를 취해야 한다.","hl":"m"},{"n":32,"text":"이 문장은 글쓴이가 독자에게 던지는 촉구예요. 앞에서 리프가 겪는 문제를 쭉 나열한 다음, 이제는 반드시 행동해야 한다고 강하게 말하고 있죠. 보호 대상이 리프 하나가 아니라 그곳의 해양 생물까지라는 점도 꼭 기억해 두세요.","hl":"mn"},{"n":33,"text":"첫 번째로 must take를 보세요. must는 의무를 나타내는 조동사라서 뒤에 동사원형 take가 그대로 온답니다. 두 번째로 to protect는 즉각적인 조치를 취하는 목적이 무엇인지 알려 주는 to부정사예요. 그래서 보호하기 위해라고 해석하면 자연스럽습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은 필요로 한다\u003c/span>\u003cspan class=\"en\">This requires\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">노력들의 조합을,\u003c/span>\u003cspan class=\"en\">a combination of efforts,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들어 줄이는 것과 같은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">such \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">reducing \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">온실가스 배출량을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">amount \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">greenhouse \u003c/span>\u003cspan class=\"tgt\">gas \u003c/span>\u003cspan class=\"tgt\">emissions \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 수질을 개선하는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">improving \u003c/span>\u003cspan class=\"tgt\">water \u003c/span>\u003cspan class=\"tgt\">quality\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이를 위해서는 온실가스 배출량을 줄이는 것과 수질을 개선하는 것과 같은 복합적인 노력이 필요하다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 '즉각적인 조치'가 구체적으로 무엇인지 풀어 주는 문장이에요. 하나의 방법이 아니라 \u003cb class=\"key\">복합적인 \u003c/b>\u003cb class=\"key\">노력\u003c/b>이 필요하다는 뜻으로, 온실가스 감축과 수질 개선을 예로 들고 있습니다. This는 바로 앞 문장의 \u003cb class=\"key\">즉각적인 \u003c/b>\u003cb class=\"key\">조치\u003c/b>를 가리킵니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 such as + 동명사(예시)\u003c/span> : such as + [동명사 A] + and + [동명사 B] : \"온실가스 배출량을 줄이는 것과 수질을 개선하는 것과 같은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사구의 병렬 구조\u003c/span> : [동명사 A] + and + [동명사 B] : \"온실가스 배출량을 줄이는 것과 수질을 개선하는 것\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"This requires, 이것은 필요로 한다. a combination of efforts, 노력들의 조합을. such as reducing, 예를 들어 줄이는 것과 같은. the amount of greenhouse gas emissions, 온실가스 배출량을. and improving water quality, 그리고 수질을 개선하는 것을. 이 문장 전체를 해석하면, 이를 위해서는 온실가스 배출량을 줄이는 것과 수질을 개선하는 것과 같은 복합적인 노력이 필요하다.","hl":"m"},{"n":35,"text":"이 문장은 앞의 즉각적인 조치가 구체적으로 무엇을 뜻하는지 알려 주는 역할을 해요. 하나의 방법이 아니라 여러 노력이 합쳐져야 한다는 점이 핵심이죠. 그래서 combination이라는 단어를 쓴 겁니다.","hl":"mn"},{"n":36,"text":"첫 번째로 such as를 짚어 볼까요. such as는 앞에 나온 efforts의 예를 들어 주는 전치사 표현이에요. 두 번째로 전치사 뒤에는 동사원형이 아니라 동명사가 와야 하죠. 그래서 reduce가 아니라 reducing, improve가 아니라 improving이 쓰였습니다. 세 번째로 이 두 동명사가 and로 묶여 병렬을 이루고 있다는 것도 꼭 받아 적어 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그레이트 배리어 리프의 미래는\u003c/span>\u003cspan class=\"en\">The future of the Great Barrier Reef\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 수백만 종의\u003c/span>\u003cspan class=\"en\">and the millions of species\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 집이라고 부르는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">call \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">home\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것에 달려 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">depends \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Great Barrier Reef와 그것을 집이라고 부르는(그곳에 서식하는) 수백만 종의 미래가 그것에 달려 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글 전체를 마무리하며, 리프와 그곳에 서식하는 수백만 종의 미래가 우리의 행동(\u003cb class=\"key\">it\u003c/b>)에 달려 있다고 정리하는 문장이에요. call it home은 '그것을 집이라고 부르다', 즉 \u003cb class=\"key\">서식하다\u003c/b>로 풀어 읽으면 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : [선행사 the millions of species] + that + [동사 call] : \"그것을 집이라고 부르는(그곳에 서식하는)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">5형식 (call + 목적어 + 목적격 보어)\u003c/span> : call + [목적어 it] + [목적격 보어 home] : \"그것을 집이라고 부르다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">주어-동사 수 일치\u003c/span> : [주어 The future (단수)] + [동사 depends] : \"그것에 달려 있다\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"The future of the Great Barrier Reef, 그레이트 배리어 리프의 미래는. and the millions of species, 그리고 수백만 종의. that call it home, 그것을 집이라고 부르는. depends on it, 그것에 달려 있다. 이 문장 전체를 해석하면, Great Barrier Reef와 그것을 집이라고 부르는(그곳에 서식하는) 수백만 종의 미래가 그것에 달려 있다.","hl":"m"},{"n":38,"text":"이 문장은 글 전체를 마무리하는 문장이에요. 리프와 그곳에 사는 수많은 종의 미래가 지금 우리의 행동에 달려 있다고 정리하고 있죠. 앞 문장에서 말한 행동을 it으로 받아서 다시 강조하고 있습니다.","hl":"mn"},{"n":39,"text":"첫 번째로 that call it home을 보세요. 앞의 the millions of species를 꾸며 주는 주격 관계대명사 that이에요. 두 번째로 call은 목적어 it 뒤에 목적격 보어 home을 데리고 오는 동사랍니다. 그래서 call it home은 그것을 집이라고 부르다, 즉 그곳에 서식하다로 이해하면 돼요. 세 번째로 depends on it에서 진짜 주어는 of 뒤가 아니라 The future이고, 그래서 단수 동사 depends가 온다는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">조치가 없다면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Without \u003c/span>\u003cspan class=\"tgt\">action\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미래는\u003c/span>\u003cspan class=\"en\">the future\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 놀라운 생태계의\u003c/span>\u003cspan class=\"en\">of this incredible ecosystem\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">불확실하다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">uncertain\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">조치가 없다면, 이 놀라운 생태계의 미래는 불확실하다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 보호를 위한 즉각적인 \u003cb class=\"key\">조치\u003c/b>가 필요하다고 주장한 뒤, 조치가 없을 때의 결과를 경고하며 글을 맺는 문장이에요. Without action은 '만약 조치가 없다면'이라는 \u003cb class=\"key\">조건\u003c/b>을 나타내고, uncertain은 미래가 \u003cb class=\"key\">불확실하다\u003c/b>, 즉 보장되지 않는다는 뜻이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 without의 조건 표현\u003c/span> : Without + [명사(구)] = If there is no + [명사(구)] : \"조치가 없다면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">2형식 문장(주어 + be동사 + 주격보어)\u003c/span> : [주어] + is + [형용사(주격보어)] : \"불확실하다\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"Without action, 조치가 없다면. the future, 미래는. of this incredible ecosystem, 이 놀라운 생태계의. is uncertain, 불확실하다. 이 문장 전체를 해석하면, 조치가 없다면, 이 놀라운 생태계의 미래는 불확실하다.","hl":"m"},{"n":41,"text":"이 문장은 앞에서 보호를 위해 즉각적인 조치가 필요하다고 말한 뒤, 조치가 없을 때의 결과를 경고하면서 글을 맺고 있어요. Without action은 만약 조치가 없다면이라는 조건을 나타내고, uncertain은 미래가 불확실하다, 다시 말해 보장되지 않는다는 뜻이에요.","hl":"mn"},{"n":42,"text":"먼저 Without action은 전치사 without 뒤에 명사 action이 온 전치사구로, 만약 조치가 없다면이라는 조건의 의미를 만들어요. 두 번째로 is uncertain은 주어 the future를 설명하는 주격보어 uncertain이 be동사 뒤에 온 구조예요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>호주의 Great Barrier Reef는 세계에서 가장 큰 \u003cb class=\"key\">산호초\u003c/b> 시스템 중 하나이며 1,500종이 넘는 물고기를 포함한 다양한 해양 생물의 서식지이다.\u003c/li>\u003cli>최근 이곳은 \u003cb class=\"key\">지구 \u003c/b>\u003cb class=\"key\">온난화\u003c/b>로 인한 해양 온도 상승과 농업용수·산업 폐기물로 인한 \u003cb class=\"key\">수질 \u003c/b>\u003cb class=\"key\">오염\u003c/b>이라는 환경 문제에 직면해 있다.\u003c/li>\u003cli>수온 상승은 \u003cb class=\"key\">산호 \u003c/b>\u003cb class=\"key\">탈색\u003c/b>을 일으켜 산호가 색을 잃고 죽게 만들고, 오염된 물은 수질을 악화시킨다.\u003c/li>\u003cli>우리는 온실가스 배출량 감축과 수질 개선을 결합한 즉각적인 조치를 취해야 하며, 이 \u003cb class=\"key\">생태계\u003c/b>의 미래는 바로 그것에 달려 있다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The Great Barrier Reef is threatened by global warming and water pollution, so we must take immediate action to protect it and its marine life.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">호주의 Great Barrier Reef는 세계에서 가장 큰 산호초 시스템 중 하나이자 다양한 해양 종의 서식지이지만, \u003cb class=\"key\">지구 \u003c/b>\u003cb class=\"key\">온난화\u003c/b>로 인한 \u003cb class=\"key\">산호 \u003c/b>\u003cb class=\"key\">탈색\u003c/b>과 \u003cb class=\"key\">수질 \u003c/b>\u003cb class=\"key\">오염\u003c/b>이라는 환경 문제에 직면해 있다. 따라서 우리는 온실가스 배출량을 줄이고 수질을 개선하는 복합적인 노력을 통해 이 생태계를 \u003cb class=\"key\">즉각적으로 \u003c/b>\u003cb class=\"key\">보호\u003c/b>해야 하며, 그 미래는 우리의 행동에 달려 있다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":43,"text":"오늘 글은 산호초의 아름다움에서 시작해 위협, 그리고 우리가 해야 할 행동으로 이어지는 글이었어요. 문제와 원인, 해결책을 구분해서 읽는 습관이 이런 글에서 특히 중요하죠. 산호초와 그곳에 사는 수백만 종의 미래는 결국 우리의 즉각적인 조치에 달려 있다는 문장을 꼭 기억해 주세요. 오늘도 수고했어요, 다음 시간에 만나요.","hl":null}]}]});</script></body></html>
