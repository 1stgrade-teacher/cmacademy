<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터2 Reading20 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터2 Reading20","audioDir":"reading20_audio","preview":false,"count":46,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.520em\">Reading20\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터2\u003c/div>\u003ch1>The Home of Their Dreams\u003c/h1>\u003ch2>그들이 꿈꾸던 집\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>Alex와 Angie는 새 집의 주방과 거실, 침실과 마당을 둘러보며 \u003cb class=\"key\">만족감\u003c/b>을 느끼고, 이웃에서 들려오는 아이들의 웃음소리에서 \u003cb class=\"key\">따뜻한 \u003c/b>\u003cb class=\"key\">분위기\u003c/b>를 확인한다. 결국 그들은 이곳이 \u003cb class=\"key\">꿈꾸던 \u003c/b>\u003cb class=\"key\">집\u003c/b>이며 자신들이 여기에 속한다는 것을 깨닫는다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Alex and Angie feel at home in their new house and realize that it is the home of their dreams where they truly belong.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 새 집을 둘러보는 부부의 이야기예요. Alex와 Angie가 작은 새집에 들어가 주방과 거실, 침실과 마당을 확인하고, 마지막에는 이웃의 웃음소리까지 듣게 되죠. 이 글의 요지는 결국 이 집이 그들이 꿈꾸던 집이고 자신들이 여기에 속한다는 것을 깨닫는다는 거예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">사람이 집을 고를 때 가장 먼저 확인하는 것은 \u003cb class=\"key\">공간\u003c/b> 자체지만, 실제로 살아 보면 마음의 만족은 다른 데서 옵니다. 주방이나 거실이 주는 \u003cb class=\"key\">편안함\u003c/b>도 중요하지만, 이웃과 동네가 만들어 주는 \u003cb class=\"key\">소속감\u003c/b>(sense of belonging)은 돈으로 사기 어려운 요소예요. 그래서 부동산에서는 흔히 입지, 즉 location을 강조하고, 심리학에서는 안전감(sense of safety)과 프라이버시(privacy)를 행복의 기본 조건으로 꼽습니다. 이 지문의 울타리 친 마당처럼 경계가 분명한 공간은 아이에게는 안전한 놀이터가 되고 부모에게는 마음의 여유가 됩니다. 새 학기 첫날 교실에 들어가 친구들이 웃고 떠드는 소리를 들으면 낯선 공간이 갑자기 내 자리처럼 느껴지는 것과 비슷하죠. 결국 좋은 집은 건물의 조건이 아니라 그 안에서 느끼는 \u003cb class=\"key\">따뜻한 \u003c/b>\u003cb class=\"key\">분위기\u003c/b>와 사람들 사이의 연결이 만들어 주는 것입니다.\u003c/div>","segs":[{"n":2,"text":"집을 고를 때 우리는 보통 공간이 넓은지, 방이 몇 개인지를 먼저 봅니다. 하지만 실제로 살아 보면 마음의 만족은 다른 곳에서 오기도 하죠. 주방이나 거실이 주는 편안함도 중요하지만, 이웃과 동네가 만들어 주는 소속감, 영어로 sense of belonging은 돈으로 사기 어려운 요소예요. 그래서 부동산에서는 입지, 즉 location을 강조하고, 심리학에서는 안전감과 프라이버시, privacy를 행복의 기본 조건으로 꼽습니다. 울타리 친 마당처럼 경계가 분명한 공간은 아이에게는 안전한 놀이터가 되고 부모에게는 마음의 여유가 됩니다. 새 학기 첫날 교실에서 친구들이 웃고 떠드는 소리를 들으면 낯선 공간이 갑자기 내 자리처럼 느껴지는 것과 비슷하죠. 결국 좋은 집은 건물의 조건이 아니라 그 안에서 느끼는 따뜻한 분위기와 사람들 사이의 연결이 만들어 주는 것입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>집 안 둘러보기\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>Alex와 Angie는 새로 얻은 작은 집을 \u003cb class=\"key\">둘러보며\u003c/b> 즉시 편안함을 느낀다. 주방은 요리할 공간이 넉넉해 마음에 들었고, 거실은 큰 창문 덕분에 \u003cb class=\"key\">편안한 \u003c/b>\u003cb class=\"key\">휴식 \u003c/b>\u003cb class=\"key\">공간\u003c/b>을 제공한다. 집의 내부 조건이 먼저 \u003cb class=\"key\">만족감\u003c/b>의 근거로 제시되는 부분이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>위층과 아래층\u003csmall>예시 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>위층의 침실은 아늑해서 \u003cb class=\"key\">달콤한 \u003c/b>\u003cb class=\"key\">꿈\u003c/b>을 약속하고, 아래층 가족실은 영화의 밤과 게임을 기다린다. 두 공간 모두 생활의 즐거움을 예고하는 \u003cb class=\"key\">구체적 \u003c/b>\u003cb class=\"key\">장면\u003c/b>이다. 이런 묘사가 이어진 뒤 두 사람은 만족한 채 마당으로 나간다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>울타리 친 마당\u003csmall>근거 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>울타리가 쳐진 마당은 그들의 필요에 완벽했고 \u003cb class=\"key\">안전감과 \u003c/b>\u003cb class=\"key\">사생활 \u003c/b>\u003cb class=\"key\">보호\u003c/b>를 제공했다. 그래서 두 사람은 다가오는 봄에 \u003cb class=\"key\">정원 \u003c/b>\u003cb class=\"key\">가꾸기\u003c/b>를 시작할 것에 신이 났고 작은 개를 키우는 이야기까지 나눈다. 집이 단순한 건물이 아니라 \u003cb class=\"key\">미래의 \u003c/b>\u003cb class=\"key\">계획\u003c/b>을 그리는 공간이 된 셈이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>이웃의 웃음소리\u003csmall>전환 · 문장 8–10\u003c/small>\u003c/h4>\u003cp>갑자기 이웃에서 아이들의 \u003cb class=\"key\">웃음소리\u003c/b>가 들려오며 따뜻하고 친근한 분위기가 만들어진다. 이 소리는 딸 Sarah에게 많은 \u003cb class=\"key\">놀이 \u003c/b>\u003cb class=\"key\">친구\u003c/b>가 생길 것이라는 기대와 연결된다. 집 안의 조건만 보던 시선이 \u003cb class=\"key\">이웃과의 \u003c/b>\u003cb class=\"key\">관계\u003c/b>로 넓어지는 전환점이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>꿈의 집 확인\u003csmall>결론 · 문장 11\u003c/small>\u003c/h4>\u003cp>마지막 문장에서 두 사람은 이곳이 \u003cb class=\"key\">꿈꾸던 \u003c/b>\u003cb class=\"key\">집\u003c/b>이며 자신들이 여기에 \u003cb class=\"key\">속한다\u003c/b>는 것을 안다. 앞에서 확인한 공간의 편안함과 이웃의 온기가 하나로 합쳐지며 \u003cb class=\"key\">소속감\u003c/b>이라는 결론에 도달한다. 그래서 이 글의 주제문은 마지막 문장이 된다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 집 안에서 시작해 마당, 그리고 이웃으로 시선을 넓혀 가는 순서로 전개됩니다.","hl":null},{"n":4,"text":"먼저 첫 번째 문장부터 세 번째 문장까지는 집 안을 둘러보는 장면이에요. Alex와 Angie는 새로 얻은 작은 집을 둘러보며 즉시 편안함을 느낍니다. 주방은 요리할 공간이 넉넉해 마음에 들었고, 거실은 큰 창문 덕분에 편안한 휴식 공간을 제공하죠. 집의 내부 조건이 먼저 만족감의 근거로 제시되는 부분입니다.","hl":"f0"},{"n":5,"text":"네 번째와 다섯 번째 문장에서는 위층과 아래층으로 시선이 올라갔다 내려옵니다. 위층 침실은 아늑해서 달콤한 꿈을 약속하고, 아래층 가족실은 영화의 밤과 게임을 기다리고 있어요. 두 공간 모두 생활의 즐거움을 예고하는 구체적인 장면이고, 이 묘사가 끝난 뒤 두 사람은 만족한 채 마당으로 나갑니다.","hl":"f1"},{"n":6,"text":"여섯 번째와 일곱 번째 문장은 마당 이야기예요. 울타리가 쳐진 마당은 그들의 필요에 완벽했고 안전감과 사생활 보호를 제공했습니다. 그래서 두 사람은 다가오는 봄에 정원 가꾸기를 시작할 것에 신이 났고 작은 개를 키우는 이야기까지 나누죠. 집이 단순한 건물이 아니라 미래의 계획을 그리는 공간이 된 셈입니다.","hl":"f2"},{"n":7,"text":"여덟 번째부터 열 번째 문장에서 글이 한 번 전환됩니다. 갑자기 이웃에서 아이들의 웃음소리가 들려오며 따뜻하고 친근한 분위기가 만들어지죠. 이 소리는 딸 Sarah에게 많은 놀이 친구가 생길 것이라는 기대와 연결됩니다. 집 안의 조건만 보던 시선이 이웃과의 관계로 넓어지는 전환점이에요.","hl":"f3"},{"n":8,"text":"마지막 문장에서 두 사람은 이곳이 꿈꾸던 집이며 자신들이 여기에 속한다는 것을 압니다. 앞에서 확인한 공간의 편안함과 이웃의 온기가 하나로 합쳐지면서 소속감이라는 결론에 도달하죠. 그래서 이 글의 주제문은 마지막 문장이 됩니다.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 11번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 주방과 거실에서 시작해 위층과 아래층, 마당, 그리고 이웃으로 \u003cb class=\"key\">공간 \u003c/b>\u003cb class=\"key\">이동\u003c/b> 순서를 따라 전개된다. 각 공간에서 확인된 편안함과 안전감이 \u003cb class=\"key\">근거\u003c/b>로 차곡차곡 쌓인다. 그 근거가 마지막 문장에서 이 집이 \u003cb class=\"key\">꿈꾸던 \u003c/b>\u003cb class=\"key\">집\u003c/b>이고 자신들이 여기에 속한다는 \u003cb class=\"key\">주제\u003c/b>로 묶이므로 결론이 뒤에 오는 미괄식이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>immediately (1)\u003c/b>\u003cspan>도입에서 즉시 만족감을 못 박는 부사\u003c/span>\u003cb>while (4)\u003c/b>\u003cspan>위층과 아래층 공간을 병렬로 연결\u003c/span>\u003cb>Suddenly (8)\u003c/b>\u003cspan>시선을 집 밖 이웃으로 돌리는 전환 신호\u003c/span>\u003cb>This was (11)\u003c/b>\u003cspan>앞 내용을 묶어 결론을 이끄는 지시 표현\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">felt at home\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a comfortable place to relax\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">cozy\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a sense of safety and privacy\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a warm and friendly atmosphere\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the home of their dreams\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">they belonged here\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"이 글은 공간을 옮겨 가며 이야기를 풀어 가는 시간순 전개 방식이고, 결론이 마지막에 나오는 미괄식 구조예요. 주방과 거실, 위층과 아래층, 마당, 이웃으로 이동할 때마다 편안함과 안전감이라는 근거가 차곡차곡 쌓입니다. 그 근거가 마지막 문장에서 꿈꾸던 집이라는 하나의 주제로 묶이기 때문에 두괄식이 아니라 미괄식으로 보는 거죠.","hl":"ty"},{"n":10,"text":"신호어를 짚어 볼게요. 첫 번째 문장의 immediately는 즉시 편안함을 느꼈다는 점을 강조하며 도입을 엽니다. 네 번째 문장의 while은 위층 침실과 아래층 가족실을 나란히 연결해 주고, 여덟 번째 문장의 Suddenly는 시선을 집 밖 이웃으로 확 돌려놓는 전환 신호예요. 그리고 마지막 문장의 This was가 앞의 모든 내용을 하나로 묶어 결론을 이끌어 냅니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>look around\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>둘러보다\u003c/span>\u003c/div>\u003cdiv>\u003cb>immediately\u003c/b>\u003cem>부사\u003c/em>\u003cspan>즉시\u003c/span>\u003c/div>\u003cdiv>\u003cb>delightful\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>기분 좋은, 즐거운\u003c/span>\u003c/div>\u003cdiv>\u003cb>plenty of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>많은, 넉넉한\u003c/span>\u003c/div>\u003cdiv>\u003cb>offer\u003c/b>\u003cem>동사\u003c/em>\u003cspan>제공하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>comfortable\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>편안한\u003c/span>\u003c/div>\u003cdiv>\u003cb>relax\u003c/b>\u003cem>동사\u003c/em>\u003cspan>휴식하다, 쉬다\u003c/span>\u003c/div>\u003cdiv>\u003cb>upstairs\u003c/b>\u003cem>부사\u003c/em>\u003cspan>위층에\u003c/span>\u003c/div>\u003cdiv>\u003cb>cozy\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>아늑한\u003c/span>\u003c/div>\u003cdiv>\u003cb>promise\u003c/b>\u003cem>동사\u003c/em>\u003cspan>약속하다, ~을 기대하게 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>downstairs\u003c/b>\u003cem>부사\u003c/em>\u003cspan>아래층에\u003c/span>\u003c/div>\u003cdiv>\u003cb>await\u003c/b>\u003cem>동사\u003c/em>\u003cspan>기다리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>satisfied\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>만족한\u003c/span>\u003c/div>\u003cdiv>\u003cb>yard\u003c/b>\u003cem>명사\u003c/em>\u003cspan>마당\u003c/span>\u003c/div>\u003cdiv>\u003cb>fenced-in\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>울타리가 쳐진\u003c/span>\u003c/div>\u003cdiv>\u003cb>perfect\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>완벽한, 더할 나위 없는\u003c/span>\u003c/div>\u003cdiv>\u003cb>provide\u003c/b>\u003cem>동사\u003c/em>\u003cspan>제공하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>sense of safety\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>안전감\u003c/span>\u003c/div>\u003cdiv>\u003cb>privacy\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사생활 보호, 프라이버시\u003c/span>\u003c/div>\u003cdiv>\u003cb>be excited to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~하게 되어 신이 난\u003c/span>\u003c/div>\u003cdiv>\u003cb>plant\u003c/b>\u003cem>동사\u003c/em>\u003cspan>심다\u003c/span>\u003c/div>\u003cdiv>\u003cb>coming\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>다가오는\u003c/span>\u003c/div>\u003cdiv>\u003cb>discuss\u003c/b>\u003cem>동사\u003c/em>\u003cspan>논의하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>suddenly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>갑자기\u003c/span>\u003c/div>\u003cdiv>\u003cb>laughter\u003c/b>\u003cem>명사\u003c/em>\u003cspan>웃음소리\u003c/span>\u003c/div>\u003cdiv>\u003cb>neighborhood\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이웃, 동네\u003c/span>\u003c/div>\u003cdiv>\u003cb>create\u003c/b>\u003cem>동사\u003c/em>\u003cspan>만들어 내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>atmosphere\u003c/b>\u003cem>명사\u003c/em>\u003cspan>분위기\u003c/span>\u003c/div>\u003cdiv>\u003cb>playmate\u003c/b>\u003cem>명사\u003c/em>\u003cspan>놀이 친구\u003c/span>\u003c/div>\u003cdiv>\u003cb>belong\u003c/b>\u003cem>동사\u003c/em>\u003cspan>속하다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"단어도 몇 개 짚고 갈게요. delightful은 기분 좋은, 즐거운이라는 뜻이고, plenty of는 많은, 넉넉한이라는 숙어예요. await은 기다리다, fenced-in은 울타리가 쳐진, privacy는 사생활 보호라는 뜻으로 꼭 기억해 두세요. 마지막 문장의 belong은 속하다라는 뜻으로 이 글의 결론을 잡아 주는 핵심 동사입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">delightful\u003c/b>\u003cspan class=\"m\">기분 좋은, 즐거운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">pleasant\u003c/span>\u003cspan class=\"s\">lovely\u003c/span>\u003cspan class=\"s\">enjoyable\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unpleasant\u003c/span>\u003cspan class=\"a\">awful\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">comfortable\u003c/b>\u003cspan class=\"m\">편안한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">cozy\u003c/span>\u003cspan class=\"s\">snug\u003c/span>\u003cspan class=\"s\">relaxed\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">uncomfortable\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">satisfied\u003c/b>\u003cspan class=\"m\">만족한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">content\u003c/span>\u003cspan class=\"s\">pleased\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">dissatisfied\u003c/span>\u003cspan class=\"a\">unhappy\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">provide\u003c/b>\u003cspan class=\"m\">제공하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">supply\u003c/span>\u003cspan class=\"s\">offer\u003c/span>\u003cspan class=\"s\">give\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">take\u003c/span>\u003cspan class=\"a\">deprive\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">suddenly\u003c/b>\u003cspan class=\"m\">갑자기\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">abruptly\u003c/span>\u003cspan class=\"s\">all of a sudden\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">gradually\u003c/span>\u003cspan class=\"a\">slowly\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">privacy\u003c/b>\u003cspan class=\"m\">사생활 보호\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">seclusion\u003c/span>\u003cspan class=\"s\">solitude\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">publicity\u003c/span>\u003cspan class=\"a\">exposure\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">discuss\u003c/b>\u003cspan class=\"m\">논의하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">talk about\u003c/span>\u003cspan class=\"s\">debate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어로 정리해 볼게요. delightful은 pleasant, lovely와 가깝고 unpleasant와 반대됩니다. comfortable은 cozy, snug와 동의어이고 uncomfortable과 반대죠. satisfied는 content, pleased와 같고 dissatisfied와 반대이며, discuss는 talk about, debate와 가깝습니다. provide는 supply, offer와 같고, suddenly는 abruptly와 같지만 gradually와는 반대예요. privacy는 seclusion과 가깝고 publicity와 반대라는 점도 함께 기억해 주세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Alex와 Angie는\u003c/span>\u003cspan class=\"en\">Alex and Angie\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">둘러보았다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">looked \u003c/span>\u003cspan class=\"tgt\">around\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 새로운 작은 집을\u003c/span>\u003cspan class=\"en\">their new little house\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 즉시 편안함을 느꼈다\u003c/span>\u003cspan class=\"en\">and immediately \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">felt \u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">home\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Alex와 Angie는 그들의 새로운 작은 집을 둘러보았고 즉시 편안함을 느꼈다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 새 집에 들어선 두 사람이 집 안을 \u003cb class=\"key\">둘러보고\u003c/b> 바로 \u003cb class=\"key\">편안함\u003c/b>을 느꼈다는 첫인상 장면이에요. 글 전체가 '꿈의 집'을 소개하는 흐름이라, 이 문장은 그 소개의 출발점 역할을 하죠. felt at home은 '집처럼 편안하게 느끼다'라는 \u003cb class=\"key\">관용 \u003c/b>\u003cb class=\"key\">표현\u003c/b>이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">구동사(look around)\u003c/span> : [look around (자동사구) + 목적어] = ~을 둘러보다 : \"둘러보았다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관용 표현(feel at home)\u003c/span> : [feel + at home (전치사구가 형용사 역할)] = 편안함을 느끼다 : \"편안함을 느꼈다\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"Alex and Angie, Alex와 Angie는. looked around, 둘러보았다. their new little house, 그들의 새로운 작은 집을. and immediately felt at home, 그리고 즉시 편안함을 느꼈다. 이 문장 전체를 해석하면, Alex와 Angie는 그들의 새로운 작은 집을 둘러보았고 즉시 편안함을 느꼈다.","hl":"m"},{"n":14,"text":"두 사람이 새 집을 둘러보고 바로 편안함을 느꼈다는 장면이에요. 집에 대한 첫인상이 아주 좋았다는 걸 보여 주죠. felt at home은 '집처럼 편안함을 느끼다'라는 관용 표현으로 익혀 두세요.","hl":"mn"},{"n":15,"text":"먼저 looked around는 '주위를 둘러보다'라는 구동사예요. around가 동사 뒤에서 방향을 잡아 주는 거죠. 두 번째로 felt at home은 feel과 at home이 만나 편안함을 느끼다라는 관용 표현이 되었어요. at home을 집에서로만 해석하면 어색하다는 점을 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">주방은\u003c/span>\u003cspan class=\"en\">The kitchen\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마음에 들었다\u003c/span>\u003cspan class=\"en\">was delightful,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공간이 많았고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">plenty \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">space \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">요리할 수 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">cooking\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">주방 마음에 들었고 요리할 수 있는 공간이 많았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 주방이 마음에 들었고 \u003cb class=\"key\">요리할 \u003c/b>\u003cb class=\"key\">공간\u003c/b>이 넉넉했다는 내용이에요. 집의 장점을 하나씩 나열하는 흐름 속에서 주방의 \u003cb class=\"key\">실용성\u003c/b>을 강조하는 부분이죠. delightful은 '즐거운, 아주 마음에 드는'이라는 \u003cb class=\"key\">긍정적인 \u003c/b>\u003cb class=\"key\">평가\u003c/b>를 담고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 with의 부대상황(첨가) 구문\u003c/span> : [with + 명사구 (+ 전치사구)] = ~이 있는 상태로, ~하면서 : \"요리할 공간이 많으면서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 for + 동명사\u003c/span> : [명사 + for + 동명사] = ~하기 위한 명사 : \"요리할 공간\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"The kitchen, 주방은. was delightful, 마음에 들었다. with plenty of space, 공간이 많았고. for cooking, 요리할 수 있는. 이 문장 전체를 해석하면, 주방 마음에 들었고 요리할 수 있는 공간이 많았다.","hl":"m"},{"n":17,"text":"주방이 마음에 들었고 요리할 공간이 넉넉했다는 내용이에요. 집의 장점을 하나씩 소개하는 흐름에서 주방의 실용성을 강조하는 문장이죠. delightful은 아주 마음에 드는이라는 긍정적인 평가를 담고 있어요.","hl":"mn"},{"n":18,"text":"첫 번째로 with plenty of space는 with가 명사구를 끌고 와서 공간이 많으면서라는 상태를 덧붙여 주는 구조예요. 두 번째로 space for cooking에서 for 뒤에 동명사 cooking이 와서 요리하기 위한 공간이라는 뜻을 만들어요. 전치사 for 뒤에는 동명사가 온다는 점을 꼭 기억해 주세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가족실은\u003c/span>\u003cspan class=\"en\">The family room\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">큰 창문이 있었고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">large \u003c/span>\u003cspan class=\"tgt\">window \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 제공했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">offered\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">편안한 휴식 공간을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">comfortable \u003c/span>\u003cspan class=\"tgt\">place \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">relax\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">거실은 창문이 컸고 편안한 휴식 공간을 제공했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 가족실에 큰 창문이 있어 밝고, \u003cb class=\"key\">편안한 \u003c/b>\u003cb class=\"key\">휴식 \u003c/b>\u003cb class=\"key\">공간\u003c/b>을 제공한다는 내용이에요. 앞 문장에 이어 집의 장점을 \u003cb class=\"key\">병렬\u003c/b>로 이어 나가는 부분이죠. to relax는 place를 꾸며 '쉴 장소'라고 \u003cb class=\"key\">해석\u003c/b>하는 형용사적 용법이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">등위접속사 and의 병렬 구조\u003c/span> : [동사 A + and + 동사 B] (주어 공유) : \"큰 창문이 있었고 ~을 제공했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : [명사 + to부정사] = ~할 명사 : \"편안하게 쉴 장소\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"The family room, 가족실은. had a large window, 큰 창문이 있었고. and offered, 그리고 제공했다. a comfortable place to relax, 편안한 휴식 공간을. 이 문장 전체를 해석하면, 거실은 창문이 컸고 편안한 휴식 공간을 제공했다.","hl":"m"},{"n":20,"text":"가족실에 큰 창문이 있어 밝고 편안한 휴식 공간을 제공한다는 내용이에요. 앞 문장에 이어 집의 장점을 계속 이어 붙이는 부분이죠. to relax는 place를 꾸며 쉴 장소라고 해석하는 형용사적 용법이에요.","hl":"mn"},{"n":21,"text":"첫 번째로 a comfortable place to relax에서 to relax는 앞의 명사 place를 꾸며 주는 형용사적 용법의 to부정사예요. 그래서 편안하게 쉴 장소라고 해석하죠. 두 번째로 had와 offered는 and로 나란히 연결된 병렬 구조예요. 주어 The family room을 두 동사가 함께 공유하고, 시제도 과거형으로 일치한다는 점을 짚어 주세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">위층에서,\u003c/span>\u003cspan class=\"en\">Upstairs,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">침실은 아늑했고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">bedrooms \u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">cozy \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">달콤한 꿈을 약속했고,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">promised \u003c/span>\u003cspan class=\"tgt\">sweet \u003c/span>\u003cspan class=\"tgt\">dreams\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한편 아래층의 거실은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">while \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">family \u003c/span>\u003cspan class=\"tgt\">room \u003c/span>\u003cspan class=\"tgt\">downstairs \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">영화의 밤과 게임을 기다리고 있었다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">awaited \u003c/span>\u003cspan class=\"tgt\">movie \u003c/span>\u003cspan class=\"tgt\">nights \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">games\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">위층에서, 침실은 아늑했고 달콤한 꿈을 약속하는 한편, 아래층의 거실은 영화의 밤과 게임을 기다리고 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 새 집의 공간을 위층과 아래층으로 나누어 보여 주면서, 두 곳이 각각 다른 즐거움을 \u003cb class=\"key\">약속\u003c/b>한다는 것을 전하는 문장입니다. 접속사 \u003cb class=\"key\">while\u003c/b>이 위층 침실과 아래층 거실을 \u003cb class=\"key\">대조\u003c/b>하며 이어 주고 있어요. 침실이 '달콤한 꿈을 약속했다'는 것은 잠자리가 편안하다는 뜻을 \u003cb class=\"key\">의인화\u003c/b>로 표현한 것입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">병렬 구조(be동사+형용사 / 일반동사+목적어)\u003c/span> : 주어 + [be동사 + 형용사] and [일반동사 + 목적어] : \"침실은 아늑했고 달콤한 꿈을 약속했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 while(대조)\u003c/span> : [절] + while + [절] (앞 절과 반대·대조되는 내용 연결) : \"한편 아래층의 거실은 영화의 밤과 게임을 기다리고 있었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">부사의 후치 수식\u003c/span> : [명사] + [부사] (부사가 명사를 뒤에서 수식) : \"아래층의 거실\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"Upstairs, 위층에서. the bedrooms were cozy, 침실은 아늑했고. and promised sweet dreams, 달콤한 꿈을 약속했고. while a family room downstairs, 한편 아래층의 거실은. awaited movie nights and games, 영화의 밤과 게임을 기다리고 있었다.. 이 문장 전체를 해석하면, 위층에서, 침실은 아늑했고 달콤한 꿈을 약속하는 한편, 아래층의 거실은 영화의 밤과 게임을 기다리고 있었다.","hl":"m"},{"n":23,"text":"이 문장은 새 집의 위층과 아래층을 나란히 보여 주면서 두 공간이 서로 다른 즐거움을 약속한다고 말해요. 접속사 while이 위층 침실과 아래층 거실을 대조해서 이어 주고 있죠. 침실이 달콤한 꿈을 약속했다는 건 잠자리가 편안하다는 걸 의인화해서 표현한 거예요.","hl":"mn"},{"n":24,"text":"첫 번째로 the bedrooms were cozy and promised sweet dreams를 보세요. be동사에 형용사가 붙은 부분과 일반동사에 목적어가 붙은 부분이 and로 이어진 병렬 구조예요. 그리고 두 동사 모두 과거형이라 시제를 맞춰 줬다는 점도 기억해 두세요. 두 번째로 while a family room downstairs awaited movie nights and games에서 while은 반면에라는 뜻으로 두 절을 대조해서 묶어 주는 접속사예요. 위층과 아래층의 즐거움을 나란히 병치하는 역할을 하죠. 세 번째로 a family room downstairs에서 downstairs는 형용사가 아니라 부사라서 명사 뒤에서 꾸며 주는 후치 수식이 된대요. 그래서 아래층에 있는 거실, 이렇게 해석합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 만족했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">They \u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">satisfied \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 나갔다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">went \u003c/span>\u003cspan class=\"tgt\">out \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">작은 마당으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">small \u003c/span>\u003cspan class=\"tgt\">yard\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 만족하며 작은 마당으로 나갔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 집 안을 둘러본 부부가 만족감을 느끼고 다음 행동으로 넘어가는 장면입니다. 앞 문장에서 집 안 설명이 끝나고, 이제 \u003cb class=\"key\">마당\u003c/b>이라는 새로운 공간으로 \u003cb class=\"key\">화제\u003c/b>가 옮겨 가는 연결 지점이에요. satisfied는 '만족하게 만들어진' 상태, 즉 \u003cb class=\"key\">감정\u003c/b>을 나타내는 표현입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">감정을 나타내는 과거분사(수동태적 형용사)\u003c/span> : 주어 + be동사 + [감정 과거분사(satisfied)] : \"그들은 만족했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">병렬 구조(be동사 / 일반동사)\u003c/span> : 주어 + [be동사 + 형용사] and [일반동사 + 전치사구] : \"그들은 만족했고 나갔다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 to(방향·도착점)\u003c/span> : [이동동사 go out] + to + [도착 장소] : \"작은 마당으로 나갔다\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"They were satisfied, 그들은 만족했다. and went out, 그리고 나갔다. to the small yard, 작은 마당으로. 이 문장 전체를 해석하면, 그들은 만족하며 작은 마당으로 나갔다.","hl":"m"},{"n":26,"text":"집 안을 다 둘러본 부부가 만족감을 느끼고 밖으로 나가는 장면이에요. 집 안 설명이 끝나고 이제 마당이라는 새로운 공간으로 화제가 넘어가는 연결 지점이죠. satisfied는 만족하게 되어 있는 상태, 즉 감정을 나타내는 표현이라고 보시면 됩니다.","hl":"mn"},{"n":27,"text":"첫 번째로 They were satisfied를 보세요. satisfy가 만족하게 하다는 뜻의 타동사라서, 사람이 주어일 때는 과거분사 형태로 써서 만족한 상태, 즉 감정을 나타내요. 그래서 be동사와 함께 쓰인답니다. 두 번째로 They were satisfied and went out은 같은 주어에 be동사 부분과 일반동사 부분이 and로 이어진 병렬 구조예요. 그리고 마지막으로 went out to the small yard에서 to는 뒤에 명사가 오는 전치사로, 이동의 도착점을 나타내요. 작은 마당으로, 하고 방향을 살려 해석하면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">울타리가 쳐진 그 마당은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan 신이 났고 심지어 작은 개를 키우는 것에 대해서도 논의했다.","hl":"m"},{"n":32,"text":"이 문장은 두 사람이 이 집에서의 삶을 미래 계획으로 확장하는 장면이에요. be excited to는 ~하게 되어 신이 나다라는 뜻으로, 감정이 생긴 원인을 to부정사로 붙인 표현이죠. 정원 가꾸기와 강아지 키우기 같은 미래 계획을 이야기하면서 이 집이 마음에 든다는 걸 보여 줍니다.","hl":"mn"},{"n":33,"text":"첫 번째로 were excited to start를 볼게요. 감정을 나타내는 형용사 excited 뒤에 to부정사가 오면 왜 그 감정이 생겼는지 원인을 설명해 주는 자리예요. 그래서 시작할 것에 신이 났다, 이렇게 해석합니다. 두 번째로 start planting에서는 start가 목적어로 동명사 planting을 받아서 식물을 심는 행위를 목적어로 삼은 거예요. 세 번째로 discuss는 동명사만 목적어로 받는 동사라서 getting a small dog처럼 동명사를 써야 하고 discuss to get은 틀린 표현이 된다는 점을 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">갑자기\u003c/span>\u003cspan class=\"en\">Suddenly,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아이들의 웃음소리가 들려왔다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">children's \u003c/span>\u003cspan class=\"tgt\">laughter\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">came \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이웃에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">neighborhood\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 만들어냈다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">created\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">따뜻하고 친근한 분위기를\u003c/span>\u003cspan class=\"en\">a warm and friendly atmosphere.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">갑자기 이웃에서 아이들의 웃음소리가 들려오며 따뜻하고 친근한 분위기가 만들어졌다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 집 안을 둘러보던 흐름에서 시선이 집 밖 이웃으로 넓어지는 장면이에요. 아이들의 \u003cb class=\"key\">웃음소리\u003c/b>는 이 집이 아이 키우기 좋은 곳임을 알려 주는 신호이고, 이웃의 \u003cb class=\"key\">분위기\u003c/b>를 따뜻하게 그려 다음 문장의 근거를 만들어 줍니다. 그래서 이 문장은 딸 Sarah에게 놀이 친구가 많을 것이라는 \u003cb class=\"key\">기대\u003c/b>로 자연스럽게 이어지죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사의 소유격(불규칙 복수형 children's)\u003c/span> : [children's (소유격)] + [laughter (명사)] → '아이들의 웃음소리' : \"아이들의 웃음소리\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">자동사 + 전치사(from)의 결합\u003c/span> : came [자동사] + from [전치사] + the neighborhood [출처·기원] : \"이웃에서 들려왔다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동사의 병렬 구조(주어 공유)\u003c/span> : laughter [주어] + came ... + and + created ... → 두 [[동사]]가 같은 주어를 공유 : \"그리고 만들어냈다\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"Suddenly, 갑자기. children's laughter came, 아이들의 웃음소리가 들려왔다. from the neighborhood, 이웃에서. and created, 그리고 만들어냈다. a warm and friendly atmosphere, 따뜻하고 친근한 분위기를. 이 문장 전체를 해석하면, 갑자기 이웃에서 아이들의 웃음소리가 들려오며 따뜻하고 친근한 분위기가 만들어졌다.","hl":"m"},{"n":35,"text":"여기서 시선이 집 안에서 집 밖 이웃으로 넓어져요. 아이들의 웃음소리는 이 집이 아이 키우기 좋은 곳이라는 신호이고, 이웃의 분위기를 따뜻하게 그려서 다음 문장의 근거를 만들어 주죠. 그래서 이 문장은 딸 Sarah에게 놀이 친구가 많을 거라는 기대라는 마음으로 자연스럽게 이어집니다.","hl":"mn"},{"n":36,"text":"첫 번째로 children's laughter를 보면 child의 불규칙 복수형 children에 소유격 표시를 붙여 아이들의 웃음소리라는 뜻을 만들었어요. 두 번째로 came from the neighborhood에서 come은 목적어를 직접 받지 않는 자동사라서 출처를 나타낼 때 from이 붙은 전치사구를 씁니다. 세 번째로 and created에서는 주어를 다시 쓰지 않고 동사만 이어 붙여, 웃음소리가 들려오고 분위기를 만들었다는 두 동작을 병렬로 연결했어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아주 좋았다!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Great\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">아주 좋았다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 바로 앞에서 이웃 아이들의 웃음소리가 들려온 상황을 두 사람이 반갑게 받아들이는 짧은 \u003cb class=\"key\">감탄\u003c/b>이에요. 화자가 직접 소리 내어 기뻐하는 느낌을 주어, 다음 문장에서 딸 Sarah에게 놀이 친구가 많을 것이라는 \u003cb class=\"key\">전망\u003c/b>으로 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">감탄 표현의 생략 구문\u003c/span> : [It/That was] + Great! → 주어와 be동사가 [[생략]] : \"아주 좋았다!\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"Great!, 아주 좋았다!. 이 문장 전체를 해석하면, 아주 좋았다!","hl":"m"},{"n":38,"text":"이 짧은 한마디는 앞에서 이웃 아이들의 웃음소리가 들려온 상황을 두 사람이 반갑게 받아들이는 감탄이에요. 화자가 직접 소리 내어 기뻐하는 느낌을 주고, 다음 문장에서 딸 Sarah에게 놀이 친구가 많을 거라는 전망으로 이어지죠.","hl":"mn"},{"n":39,"text":"Great는 원래 It was Great에서 주어와 be동사가 생략된 감탄 표현이에요. 앞 문장의 상황 전체를 긍정적으로 평가할 때 이렇게 한 단어로 던지는 거죠. 그래서 뒤에 이어지는 놀이 친구 이야기도 아주 자연스럽게 받아들여집니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Sarah는,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Sarah, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 딸인,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">daughter,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가지게 될 것이었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">have\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 놀이 친구들을\u003c/span>\u003cspan class=\"en\">many playmates.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들의 딸인 Sarah에게는 많은 놀이 친구들이 있을 것이었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 바로 앞 문장에서 들린 아이들 웃음소리가 왜 반가운지 설명해 주는 문장이에요. 딸 Sarah에게 \u003cb class=\"key\">놀이 \u003c/b>\u003cb class=\"key\">친구\u003c/b>가 생길 것이라는 기대를 담아, 이 집이 아이 키우기에 좋은 곳임을 보여 줍니다. would는 과거 시점에서 바라본 \u003cb class=\"key\">미래\u003c/b>를 나타내는 조동사예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동격 (콤마로 이어진 동격)\u003c/span> : [명사] + , + [동격 명사] + , : 앞 명사를 다른 말로 부연 : \"Sarah, 그들의 딸인\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 would (과거에서 본 미래)\u003c/span> : [주어] + would + [동사원형] : ~할 것이었다 : \"가지게 될 것이었다\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"Sarah, Sarah는. their daughter, 그들의 딸인. would have, 가지게 될 것이었다. many playmates, 많은 놀이 친구들을. 이 문장 전체를 해석하면, 그들의 딸인 Sarah에게는 많은 놀이 친구들이 있을 것이었다.","hl":"m"},{"n":41,"text":"바로 앞에서 아이들 웃음소리가 들렸죠. 그 소리가 왜 반가운지 알려 주는 문장이에요. 딸 Sarah에게 놀이 친구가 생길 거라는 기대를 담아서, 이 집이 아이 키우기에 참 좋은 곳이라는 걸 보여 주는 거예요.","hl":"mn"},{"n":42,"text":"첫 번째로 Sarah와 their daughter를 보세요. 같은 사람을 두 번 불러 주는 동격이에요. 콤마 두 개 사이에 쏙 들어가서 부연 설명을 해 주는 거죠. 두 번째로 would have인데요, 글 전체가 과거 이야기라서 미래를 말할 때 will 대신 would를 써서 과거 시점의 미래를 나타내요. 그리고 조동사 뒤에는 동사원형 have가 온다는 것도 같이 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이곳은 ~이었다\u003c/span>\u003cspan class=\"en\">This was\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 꿈꾸던 집이,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">home \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">dreams\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그들은 알았다\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">knew \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 여기에 속한다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">belonged \u003c/span>\u003cspan class=\"tgt\">here\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이곳은 그들이 꿈꾸던 집이었고, 그들은 자신들이 여기에 속한다는 것을 알았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이사를 결심하게 된 이유를 정리하는 \u003cb class=\"key\">마무리 \u003c/b>\u003cb class=\"key\">문장\u003c/b>이에요. 집의 조건뿐 아니라 아이들 웃음소리까지 더해져 '\u003cb class=\"key\">꿈꾸던 \u003c/b>\u003cb class=\"key\">집\u003c/b>'이라는 확신에 이르렀다는 뜻이죠. belong here는 '여기가 바로 내 자리다'라는 \u003cb class=\"key\">소속감\u003c/b>을 나타내는 표현이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 of의 형용사적 용법\u003c/span> : [명사] + of + [명사] : ~의 / ~한 (앞 명사를 뒤에서 수식) : \"그들이 꿈꾸던 집\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 that의 생략 (목적어절)\u003c/span> : [동사 knew] + (that) + [주어 + 동사] : \"그들이 ~라는 것을 알았다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">자동사 belong (수동태 불가)\u003c/span> : [주어] + belong + [전치사/부사] : ~에 속하다 : \"여기에 속했다\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"This was, 이곳은 ~이었다. the home of their dreams, 그들이 꿈꾸던 집이. and they knew, 그리고 그들은 알았다. they belonged here, 그들이 여기에 속한다는 것을. 이 문장 전체를 해석하면, 이곳은 그들이 꿈꾸던 집이었고, 그들은 자신들이 여기에 속한다는 것을 알았다.","hl":"m"},{"n":44,"text":"드디어 결론이에요. 집의 조건도 좋았지만 아이들 웃음소리까지 더해지면서 이 집이 꿈꾸던 집이라는 확신이 든 거죠. belong here는 여기가 바로 내 자리라는 소속감을 담은 표현이에요.","hl":"mn"},{"n":45,"text":"먼저 the home of their dreams인데요, of 뒤에 오는 말이 앞의 home을 꾸며 주는 형용사구 역할을 해요. 그래서 꿈꾸던 집, 이렇게 해석하는 거예요. 두 번째로 they knew 다음을 보면 접속사 that이 생략되어 있어요. 목적어절이 바로 이어지니까 해석할 때는 라는 것을을 넣어서 읽어 주세요. 세 번째로 belonged here인데, belong은 자동사라서 수동태로 쓰지 않아요. 여기에 속한다는 소속감을 나타내는 관용 표현으로 익혀 두세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>Alex와 Angie는 새 집의 주방과 거실을 둘러보고 \u003cb class=\"key\">편안함\u003c/b>을 느꼈다.\u003c/li>\u003cli>위층 침실과 아래층 가족실은 아늑함과 즐거움을 약속하며 \u003cb class=\"key\">만족감\u003c/b>을 더했다.\u003c/li>\u003cli>울타리 친 마당은 \u003cb class=\"key\">안전감과 \u003c/b>\u003cb class=\"key\">사생활 \u003c/b>\u003cb class=\"key\">보호\u003c/b>를 주었고 두 사람은 정원과 작은 개를 계획했다.\u003c/li>\u003cli>이웃의 아이들 웃음소리는 \u003cb class=\"key\">따뜻한 \u003c/b>\u003cb class=\"key\">분위기\u003c/b>를 만들었고, 두 사람은 이곳이 꿈꾸던 집이며 자신들이 \u003cb class=\"key\">속한다\u003c/b>는 것을 알았다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Alex and Angie feel at home in their new house and realize that it is the home of their dreams where they truly belong.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">Alex와 Angie는 새 집의 주방과 거실, 침실과 마당을 둘러보며 \u003cb class=\"key\">만족감\u003c/b>을 느끼고, 이웃에서 들려오는 아이들의 웃음소리에서 \u003cb class=\"key\">따뜻한 \u003c/b>\u003cb class=\"key\">분위기\u003c/b>를 확인한다. 결국 그들은 이곳이 \u003cb class=\"key\">꿈꾸던 \u003c/b>\u003cb class=\"key\">집\u003c/b>이며 자신들이 여기에 속한다는 것을 깨닫는다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":46,"text":"정리해 볼게요. 이 글은 새 집을 둘러보는 장면에서 시작해 마당과 이웃으로 시선을 넓히고, 마지막에 이곳이 꿈꾸던 집이며 자신들이 여기에 속한다는 결론에 도달합니다. 공간의 편안함, 안전감과 사생활 보호, 그리고 이웃의 따뜻한 분위기가 모두 소속감으로 모이는 구조였죠. 오늘 내용 복습 잘 하셨고요, 다음 시간에 또 만나요.","hl":null}]}]});</script></body></html>
