faction)&#39;라는 개념을 이해하면 좋습니다. 이는 단순히 집의 물리적 형태뿐만 아니라, 이웃과의 교류나 안전함처럼 환경적 맥락이 삶의 질에 어떤 긍정적 변화를 주는지 설명해 주는 중요한 지표랍니다. 마치 낯선 옷을 입었을 때보다 내 몸에 딱 맞는 옷을 입었을 때 편안함을 느끼는 것처럼, 공간이 주는 안정감과 &#39;소속감(Sense of Belonging)&#39;은 우리가 정서적으로 뿌리 내릴 수 있는 든든한 기반이 되어주죠. 또한 사회 심리학에서는 이를 &#39;장소 애착(Place Attachment)&#39;이라고 부르는데, 단순히 머무는 공간을 넘어 그곳에서의 기억과 유대감이 쌓일 때 비로소 진정한 의미의 &#39;집&#39;이 완성된다는 점을 기억해 보세요. 이런 배경지식을 바탕으로 지문을 읽으시면 알렉스와 앤지 가족이 느끼는 행복이 단순한 기쁨을 넘어 삶의 새로운 출발을 알리는 정서적 안정감임을 더 깊이 공감하실 수 있을 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01내부 공간 확인</div><ul><li>알렉스와 앤지는 새집의 내부 구조와 환경에 매우 만족한다.</li><li>부엌(kitchen)과 가족실(family room)의 충분한 공간</li><li>아늑한 침실과 지하의 여가 공간</li><li>핵심 키워드: 주거 공간(living space), 만족감(satisfaction)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02외부 환경 탐색</div><ul><li>집 주변의 야외 환경은 안전함과 즐거운 미래를 약속한다.</li><li>울타리가 있어 안전하고 사적인 마당(fenced-in yard)</li><li>봄에 정원을 가꾸고 강아지를 키우려는 계획</li><li>핵심 키워드: 마당(yard), 사생활(privacy)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03이웃과의 조화</div><ul><li>들려오는 아이들의 웃음소리는 집의 따뜻한 분위기를 완성한다.</li><li>평화로운 동네의 따뜻한 분위기(warm atmosphere)</li><li>딸 사라의 새로운 친구들에 대한 기대</li><li>핵심 키워드: 이웃(neighborhood), 소속감(belonging)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">look around</td><td class=\"m\">~을 둘러보다, 살펴보다</td></tr><tr><td class=\"w\">feel at home</td><td class=\"m\">마음이 편안하다, 편히 쉬다</td></tr><tr><td class=\"w\">delightful</td><td class=\"m\">아주 기분 좋은, 유쾌한</td></tr><tr><td class=\"w\">cozy</td><td class=\"m\">아늑한, 따뜻한</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">satisfied</td><td class=\"m\">만족한, 흡족해하는</td></tr><tr><td class=\"w\">fenced-in</td><td class=\"m\">울타리가 쳐진</td></tr><tr><td class=\"w\">sense of</td><td class=\"m\">~감, 의식</td></tr><tr><td class=\"w\">belong</td><td class=\"m\">~에 속하다, ~에 알맞다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">알렉스와 앤지는</span><span class=\"en\"><b>Alex and Angie</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 새로운 작은 집을 둘러보았고</span><span class=\"en\"><b>looked around their new little house</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">즉시 편안함을 느꼈다.</span><span class=\"en\"><b>and immediately felt <span class=\"grammar-hl\">at home</span>.</b></span></div></div><div class=\"lec-sent-ko\">Alex와 Angie는 그들의 새로운 작은 집을 둘러보았고 즉시 편안함을 느꼈다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 공간 이동의 서술을 바탕으로, 두 사람이 새로운 환경을 낯설어하기보다 자신의 공간으로 자연스럽게 받아들이고 있음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">at home (관용표현): &#39;집처럼 편안한&#39;이라는 의미의 숙어로, 특정 장소에서 안락함을 느끼는 상태를 나타냄</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">주방은 마음에 들었다,</span><span class=\"en\"><b>The kitchen was delightful,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">요리를 위한 충분한 공간이 있어서.</span><span class=\"en\"><b>with plenty of space <span class=\"grammar-hl\">for cooking</span>.</b></span></div></div><div class=\"lec-sent-ko\">주방 마음에 들었고 요리할 수 있는 공간이 많았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 느낀 전반적인 편안함을 구체적인 장소인 부엌의 특징을 들어 뒷받침하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">for cooking (동명사): &#39;cooking&#39;은 전치사 &#39;for&#39;의 목적어이자 용도를 나타내는 명사적 개념으로 사용됨</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">delightful</td><td class=\"m\">아주 기분 좋은, 유쾌한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">거실은 창문이 컸고</span><span class=\"en\"><b>The family room had a large window</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">편안한 휴식 공간을 제공했다</span><span class=\"en\"><b>and offered a comfortable place</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">할 수 있는</span><span class=\"en\"><b><span class=\"grammar-hl\">to relax</span>.</b></span></div></div><div class=\"lec-sent-ko\">거실은 창문이 컸고 편안한 휴식 공간을 제공했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 부엌에 이어 집의 또 다른 공간인 가족실을 묘사하며, 이 집이 휴식과 여유를 즐기기에 적합한 곳임을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to relax (to부정사): 앞의 명사 &#39;place&#39;를 수식하는 형용사적 용법으로, &#39;쉴 곳&#39;이라는 의미를 가짐</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">위층은,</span><span class=\"en\"><b><span class=\"grammar-hl\">Upstairs</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">침실들이 아늑했고</span><span class=\"en\"><b>the bedrooms were cozy</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">달콤한 꿈을 약속했다,</span><span class=\"en\"><b>and promised sweet dreams,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">반면에 아래층의 거실은</span><span class=\"en\"><b>while a family room downstairs</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">영화의 밤과 게임을 기다리고 있었다.</span><span class=\"en\"><b>awaited movie nights and games.</b></span></div></div><div class=\"lec-sent-ko\">위층에서, 침실은 아늑했고 달콤한 꿈을 약속하는 한편, 아래층의 거실은 영화의 밤과 게임을 기다리고 있었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 공간 묘사를 확장하여, 위층과 아래층 각각의 공간이 가족의 일상을 어떻게 채워줄지에 대한 기대감을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Upstairs (관용표현): 부사로 쓰여 &#39;위층으로&#39; 혹은 &#39;위층에&#39;라는 의미를 나타내며 문장의 도입부에서 장소를 설정함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">cozy</td><td class=\"m\">아늑한, 따뜻한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은 만족했고</span><span class=\"en\"><b>They <span class=\"grammar-hl\">were satisfied</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">작은 마당으로 나갔다.</span><span class=\"en\"><b>and went out to the small yard.</b></span></div></div><div class=\"lec-sent-ko\">그들은 만족하며 작은 마당으로 나갔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 실내 공간에 대한 만족감을 확인한 후, 장소를 집 외부인 마당으로 전환하며 탐색 범위를 넓히는 연결고리 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">were satisfied (수동태): be동사(were)+과거분사(satisfied) 구조. satisfy는 타동사인데 목적어가 없어서 수동구조(be동사+p.p.)로 쓴다. 기본구조: satisfy+O (누구를 만족시키다)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">satisfied</td><td class=\"m\">만족한, 흡족해하는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">울타리가 쳐진 마당은</span><span class=\"en\"><b>The <span class=\"grammar-hl\">fenced-in</span> yard</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 필요에 완벽했고</span><span class=\"en\"><b>was perfect for their needs</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">안전감과 사생활 보호를 제공했다.</span><span class=\"en\"><b>and provided a sense of safety and privacy.</b></span></div></div><div class=\"lec-sent-ko\">울타리가 쳐진 그 마당은 그들의 필요에 완벽했고 안전감과 사생활 보호를 제공했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 마당으로 나간 행위에 이어, 마당이라는 공간이 이들에게 어떤 심리적 만족감(안전과 독립성)을 주는지 구체적으로 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">fenced-in (과거분사): &#39;fenced-in&#39;이 &#39;yard&#39;를 수식하며 &#39;울타리가 쳐진&#39;이라는 상태를 설명하는 형용사적 역할을 함. 축약 관계절: yard that is fenced-in</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fenced-in</td><td class=\"m\">울타리가 쳐진</td></tr><tr><td class=\"w\">sense of</td><td class=\"m\">~감, 의식</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">알렉스와 앤지는 신이 났다</span><span class=\"en\"><b>Alex and Angie were excited</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">정원에 식물을 심기 시작하는 것에</span><span class=\"en\"><b><span class=\"grammar-hl\">to start</span> <span class=\"grammar-hl\">planting a garden</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다가오는 봄에</span><span class=\"en\"><b><span class=\"grammar-hl\">in the coming spring</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 심지어 작은 개를 얻는 것을 논의했다.</span><span class=\"en\"><b>and even discussed <span class=\"grammar-hl\">getting a small dog</span>.</b></span></div></div><div class=\"lec-sent-ko\">Alex와 Angie는 다가오는 봄에 정원에 식물을 심기 시작할 것에 신이 났고 심지어 작은 개를 키우는 것에 대해서도 논의했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 집에서의 미래를 구체적으로 계획하는 모습인데, 이는 이곳을 단순히 머무는 공간이 아닌 삶을 일구어 나갈 생활 터전으로 여기고 있음을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to start (to부정사): &#39;were excited&#39;의 원인이나 이유를 설명하는 부사적 용법의 원인 결과</div><div class=\"lec-gr-item\">planting a garden (동명사): &#39;start&#39;의 목적어로 쓰인 명사적 용법으로 &#39;정원을 가꾸는 행위&#39;를 나타냄</div><div class=\"lec-gr-item\">in the coming spring (현재분사): &#39;coming&#39;이 &#39;spring&#39;을 수식하며 &#39;다가오는 봄&#39;이라는 동작/상태를 나타내는 형용사적 용법</div><div class=\"lec-gr-item\">getting a small dog (동명사): &#39;discussed&#39;의 목적어로 쓰인 명사적 용법으로 &#39;강아지를 키우는 행위&#39;를 나타냄</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">갑자기,</span><span class=\"en\"><b>Suddenly,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아이들의 웃음소리가 이웃에서 들려왔고</span><span class=\"en\"><b><span class=\"grammar-hl\">children’s laughter</span> came from the neighborhood</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">따뜻하고 친근한 분위기를 만들었다.</span><span class=\"en\"><b>and created a warm and friendly atmosphere.</b></span></div></div><div class=\"lec-sent-ko\">갑자기 이웃에서 아이들의 웃음소리가 들려오며 따뜻하고 친근한 분위기가 만들어졌다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 집 내부의 만족감을 넘어, 주변 환경인 이웃으로부터 긍정적인 자극이 더해지면서 주거 환경에 대한 만족이 완성 단계로 나아갑니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">children’s laughter (관용표현): 소유격 명사를 사용하여 &#39;아이들의 웃음소리&#39;라는 소유 관계를 표현함</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">아주 좋았다!</span><span class=\"en\"><b><span class=\"grammar-hl\">Great!</span></b></span></div></div><div class=\"lec-sent-ko\">아주 좋았다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 아이들의 웃음소리라는 상황이 자신의 딸에게 줄 긍정적인 영향을 즉각적으로 파악하며 기쁨을 표현합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Great! (관용표현): 감탄사로 상황에 대한 긍정적인 평가나 기쁨을 짧게 표현함</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사라가, 그들의 딸인,</span><span class=\"en\"><b>Sarah, their daughter,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 놀이 친구를 가질 것이었다.</span><span class=\"en\"><b><span class=\"grammar-hl\">would have</span> many playmates.</b></span></div></div><div class=\"lec-sent-ko\">그들의 딸인 Sarah에게는 많은 놀이 친구들이 있을 것이었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 아이들의 웃음소리라는 상황이 자신의 딸에게 줄 긍정적인 영향을 즉각적으로 파악하며 기쁨을 표현합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">would have (관용표현): 미래의 상황을 추측하거나 예정된 일로 가정하여 표현하는 조동사 구문</div></div>\n        ","<div class=\"lec-sent-no\">문장 11 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것은 그들의 꿈의 집이었다,</span><span class=\"en\"><b>This was <span class=\"grammar-hl\">the home of their dreams</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그들은 알았다</span><span class=\"en\"><b>and they knew</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 여기에 속한다는 것을.</span><span class=\"en\"><b>they belonged here.</b></span></div></div><div class=\"lec-sent-ko\">이곳은 그들이 꿈꾸던 집이었고, 그들은 자신들이 여기에 속한다는 것을 알았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 지금까지의 공간 묘사와 주변 환경에 대한 긍정적 반응을 종합하여, 이 집이 단순한 건물이 아니라 가족의 정체성과 완벽히 일치하는 공간임을 결론짓습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the home of their dreams (관용표현): &#39;꿈에 그리던 집&#39;이라는 의미를 지닌 명사구</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">belong</td><td class=\"m\">~에 속하다, ~에 알맞다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>알렉스와 앤지는 새로운 집에 들어서자마자 안락함을 느끼고 만족해합니다.</li><li>부엌, 가족실, 침실 등 내부 공간 하나하나가 가족의 생활 방식에 완벽하게 부합합니다.</li><li>마당과 정원, 반려동물 계획을 통해 이 집에서 가꿀 미래를 기대합니다.</li><li>이웃의 친근한 분위기까지 더해지면서, 이들은 이곳이 자신들이 머물 운명의 장소임을 확신합니다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Alex and Angie feel comfortable in their new home while they look forward to creating happy memories with their family.</div>\n              <div class=\"lec-final-sum-ko\">알렉스와 앤지는 새 보금자리에서 편안함을 느끼며 가족과 함께 행복한 추억을 만들기를 기대한다.</div></div></div>"],"segs":[[{"audio":"./reading20_audio/1.mp3","hl":null}],[{"audio":"./reading20_audio/2.mp3","hl":null}],[{"audio":"./reading20_audio/3.mp3","hl":null},{"audio":"./reading20_audio/4.mp3","hl":"stage-0"},{"audio":"./reading20_audio/5.mp3","hl":"stage-1"},{"audio":"./reading20_audio/6.mp3","hl":"stage-2"}],[{"audio":"./reading20_audio/7.mp3","hl":null}],[{"audio":"./reading20_audio/8.mp3","hl":"main"},{"audio":"./reading20_audio/9.mp3","hl":"meaning"},{"audio":"./reading20_audio/10.mp3","hl":"grammar"}],[{"audio":"./reading20_audio/11.mp3","hl":"main"},{"audio":"./reading20_audio/12.mp3","hl":"meaning"},{"audio":"./reading20_audio/13.mp3","hl":"grammar"}],[{"audio":"./reading20_audio/14.mp3","hl":"main"},{"audio":"./reading20_audio/15.mp3","hl":"meaning"},{"audio":"./reading20_audio/16.mp3","hl":"grammar"}],[{"audio":"./reading20_audio
