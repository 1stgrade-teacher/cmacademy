<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터2 Reading21 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터2 Reading21","audioDir":"reading21_audio","preview":false,"count":39,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.668em\">Reading\u003cbr>21\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터 레벨2\u003c/div>\u003ch1>Finding Joy in Small Gestures: Emily's Roses\u003c/h1>\u003ch2>작은 배려에서 찾는 기쁨: Emily의 장미\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>고된 업무로 지친 Emily가 남편의 깜짝 \u003cb class=\"key\">장미 \u003c/b>\u003cb class=\"key\">선물\u003c/b>을 통해 스트레스를 해소하고, 일상 속 \u003cb class=\"key\">사랑과 \u003c/b>\u003cb class=\"key\">감사\u003c/b>의 가치를 깨닫는 과정을 담고 있습니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Small gestures of love from a partner can provide strength and a positive perspective even during difficult times.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘 우리가 함께 살펴볼 지문은 지친 일상 속에서 발견하는 작은 행복에 관한 이야기입니다. 고된 업무로 힘들어하던 주인공 Emily가 남편의 선물 하나로 어떻게 마음의 치유를 얻는지 그 과정을 담고 있는데요. 오늘 강의를 통해 지친 마음을 위로하는 법과 감사의 가치를 함께 배워보도록 하겠습니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">현대 사회의 직장인들은 흔히 업무 과다로 인한 \u003cb class=\"key\">번아웃(Burnout)\u003c/b>이나 심리적 소진을 경험하곤 합니다. 심리학에서는 이러한 스트레스를 극복하기 위해 주변 사람들의 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">지지(Social \u003c/b>\u003cb class=\"key\">Support)\u003c/b>가 결정적인 역할을 한다고 강조하죠. 마치 스마트폰 배터리가 방전되었을 때 보조 배터리를 연결하는 것과 같습니다. 이 지문의 Emily 역시 남편의 배려라는 에너지원을 통해 \u003cb class=\"key\">정서적 \u003c/b>\u003cb class=\"key\">회복탄력성(Resilience)\u003c/b>을 얻게 됩니다. 장미는 단순한 꽃이 아니라 힘든 현실을 버티게 하는 \u003cb class=\"key\">심리적 \u003c/b>\u003cb class=\"key\">상징물\u003c/b>이 되어 준 셈입니다.\u003c/div>","segs":[{"n":2,"text":"본격적인 독해에 앞서 배경지식을 좀 쌓아볼까요? 요즘 직장인들 사이에서 Burnout이라는 말이 참 많이 쓰이죠. 에너지가 다 소진되어 버리는 상태를 말하는데요. 이런 상태를 극복하기 위해서는 가족이나 친구의 Social Support, 즉 사회적 지지가 아주 중요합니다. 마치 배터리가 나갔을 때 보조 배터리를 꽂아 충전하는 것과 같은 원리예요. 오늘 지문에 나오는 장미꽃은 바로 Emily의 회복탄력성인 Resilience를 높여주는 아주 중요한 심리적 도구가 됩니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>업무 스트레스\u003csmall>도입 · 문장 1\u003c/small>\u003c/h4>\u003cp>Emily가 직장에서 보낸 \u003cb class=\"key\">고된 \u003c/b>\u003cb class=\"key\">한 \u003c/b>\u003cb class=\"key\">주\u003c/b>와 업무적 압박감을 배경으로 제시합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>남편의 깜짝 선물\u003csmall>전환 · 문장 2–4\u003c/small>\u003c/h4>\u003cp>남편이 준비한 \u003cb class=\"key\">장미 \u003c/b>\u003cb class=\"key\">선물\u003c/b>을 통해 Emily가 큰 기쁨을 느끼고 사랑받고 있음을 깨닫는 과정입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>심경의 변화\u003csmall>주장 · 문장 5–7\u003c/small>\u003c/h4>\u003cp>장미를 보며 \u003cb class=\"key\">스트레스\u003c/b>를 해소하고, 일상의 사소한 행복과 동반자의 \u003cb class=\"key\">소중함\u003c/b>을 다시 인식하게 됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>감사와 축복\u003csmall>결론 · 문장 8–9\u003c/small>\u003c/h4>\u003cp>남편에게 \u003cb class=\"key\">감사 \u003c/b>\u003cb class=\"key\">인사\u003c/b>를 전하며, 자신의 삶이 진정으로 \u003cb class=\"key\">축복받았다\u003c/b>고 느끼며 마무리됩니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 부정적인 상황에서 긍정적인 상황으로 변화하는 전형적인 흐름을 가지고 있습니다.","hl":null},{"n":4,"text":"첫 번째 단계에서는 Emily가 직장에서 겪은 고된 한 주와 마감 기한에 대한 압박감을 보여줍니다. 주인공의 힘든 상황을 먼저 제시해서 뒤에 나올 기쁨을 극대화하는 도입부 역할을 하고 있죠.","hl":"f0"},{"n":5,"text":"두 번째 단계는 분위기가 반전되는 지점이에요. 남편이 깜짝 장미 선물을 건네자 Emily가 아주 기뻐하는 모습이 나옵니다. 특히 남편의 정성이 담긴 선물 덕분에 자신이 사랑받고 있다는 사실을 깨닫는 감정의 변화가 핵심입니다.","hl":"f1"},{"n":6,"text":"세 번째 단계에서는 장미를 감상하며 이야기를 나누는 동안 스트레스와 걱정이 눈 녹듯 사라지는 과정을 묘사합니다. 가장 힘든 날에도 항상 웃을 이유가 있다는 아주 긍정적인 깨달음을 얻게 되는 대목입니다.","hl":"f2"},{"n":7,"text":"마지막 단계는 결론으로 남편에게 감사를 전하며 Emily가 자신의 삶을 얼마나 축복받은 것으로 느끼는지 강조하며 마무리됩니다. 장미가 단순한 꽃을 넘어 두 사람의 Partnership을 상징하게 되는 장면이죠.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">인과 및 시간순\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 9번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 Emily가 겪은 \u003cb class=\"key\">부정적 \u003c/b>\u003cb class=\"key\">상황\u003c/b>이 남편의 선물이라는 계기를 통해 \u003cb class=\"key\">긍정적 \u003c/b>\u003cb class=\"key\">감정\u003c/b>으로 변화하는 과정을 시간 순서대로 서술하고 있습니다. 마지막 문장에서 이러한 감정적 경험이 Emily를 \u003cb class=\"key\">축복받은 \u003c/b>\u003cb class=\"key\">존재\u003c/b>로 느끼게 했다는 주제를 명확히 드러내는 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>So (2)\u003c/b>\u003cspan>인과 관계 유도\u003c/span>\u003cb>As (5)\u003c/b>\u003cspan>상황의 진행 배경\u003c/span>\u003cb>even on (6)\u003c/b>\u003cspan>조건의 강조\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">a tough week\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">overjoyed\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">refreshing\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">appreciated and loved\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">melt away\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">truly blessed\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글의 전체적인 구조는 인과 관계와 시간의 흐름을 따르고 있습니다. 업무 스트레스라는 원인이 남편의 선물이라는 계기를 만나 축복이라는 결과로 이어지는 방식이죠. 주제문이 마지막에 위치한 미괄식 구조라고 볼 수 있습니다.","hl":"ty"},{"n":9,"text":"두 번째 문장의 So는 앞의 힘든 상황과 뒤의 기분 전환을 인과적으로 연결하는 강력한 신호어입니다. 다섯 번째 문장의 As는 함께 이야기를 나누는 상황적인 배경을 설명해주고 있고요. 여섯 번째 문장의 even on은 극한의 상황에서도 희망이 있다는 점을 강조하는 표현으로 쓰였습니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>tough\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>힘든, 고된\u003c/span>\u003c/div>\u003cdiv>\u003cb>long hours\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>장시간 노동\u003c/span>\u003c/div>\u003cdiv>\u003cb>tight deadline\u003c/b>\u003cem>명사\u003c/em>\u003cspan>빠듯한 마감 기한\u003c/span>\u003c/div>\u003cdiv>\u003cb>surprise\u003c/b>\u003cem>동사\u003c/em>\u003cspan>놀라게 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>overjoyed\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>매우 기뻐하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>vibrant\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>강렬한, 선명한\u003c/span>\u003c/div>\u003cdiv>\u003cb>delicate\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>섬세한, 연약한\u003c/span>\u003c/div>\u003cdiv>\u003cb>petal\u003c/b>\u003cem>명사\u003c/em>\u003cspan>꽃잎\u003c/span>\u003c/div>\u003cdiv>\u003cb>refreshing\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>상쾌한, 신선한\u003c/span>\u003c/div>\u003cdiv>\u003cb>put thought into\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 생각을 기울이다, 정성을 들이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>appreciated\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>감사히 여겨지는, 인정받는\u003c/span>\u003c/div>\u003cdiv>\u003cb>admire\u003c/b>\u003cem>동사\u003c/em>\u003cspan>감상하다, 칭찬하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>melt away\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>녹아 없어지다, 사라지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>toughest\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>가장 힘든\u003c/span>\u003c/div>\u003cdiv>\u003cb>joy\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기쁨\u003c/span>\u003c/div>\u003cdiv>\u003cb>serve as\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~의 역할을 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>symbol\u003c/b>\u003cem>명사\u003c/em>\u003cspan>상징\u003c/span>\u003c/div>\u003cdiv>\u003cb>partnership\u003c/b>\u003cem>명사\u003c/em>\u003cspan>동반자 관계, 협력\u003c/span>\u003c/div>\u003cdiv>\u003cb>lucky\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>운이 좋은\u003c/span>\u003c/div>\u003cdiv>\u003cb>by one's side\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~의 곁에\u003c/span>\u003c/div>\u003cdiv>\u003cb>blessed\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>축복받은\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"중요한 단어들을 살펴볼까요? vibrant는 색이 아주 선명하고 활기차다는 뜻이고 delicate는 꽃잎이 섬세하고 연약하다는 느낌을 줍니다. 그리고 마지막 문장의 blessed는 종교적인 의미를 넘어 진정으로 운이 좋고 축복받았다는 깊은 감사를 나타내는 핵심 형용사입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">tough\u003c/b>\u003cspan class=\"m\">힘든\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">difficult\u003c/span>\u003cspan class=\"s\">demanding\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">easy\u003c/span>\u003cspan class=\"a\">effortless\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">overjoyed\u003c/b>\u003cspan class=\"m\">매우 기쁜\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">ecstatic\u003c/span>\u003cspan class=\"s\">delighted\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">miserable\u003c/span>\u003cspan class=\"a\">depressed\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">vibrant\u003c/b>\u003cspan class=\"m\">선명한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">vivid\u003c/span>\u003cspan class=\"s\">bright\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">dull\u003c/span>\u003cspan class=\"a\">pale\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">delicate\u003c/b>\u003cspan class=\"m\">섬세한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">fragile\u003c/span>\u003cspan class=\"s\">exquisite\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">coarse\u003c/span>\u003cspan class=\"a\">sturdy\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">appreciate\u003c/b>\u003cspan class=\"m\">고마워하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">value\u003c/span>\u003cspan class=\"s\">cherish\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003cspan class=\"a\">neglect\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">blessed\u003c/b>\u003cspan class=\"m\">축복받은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">fortunate\u003c/span>\u003cspan class=\"s\">favored\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">cursed\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어 공부도 해봅시다. 매우 기쁘다는 뜻의 overjoyed는 ecstatic이나 delighted로 바꿔 쓸 수 있어요. 반대로 아주 비참하다는 뜻의 miserable과는 반대말이 되겠죠. 소중히 여기다라는 뜻의 appreciate는 value나 cherish와 비슷한 맥락에서 자주 출제됩니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Emily는 가졌다\u003c/span>\u003cspan class=\"en\">Emily had\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">힘든 한 주를\u003c/span>\u003cspan class=\"en\">a tough week\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">직장에서,\u003c/span>\u003cspan class=\"en\">at work,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">장시간의 노동과\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">long \u003c/span>\u003cspan class=\"tgt\">hours \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">빠듯한 마감일로.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">tight \u003c/span>\u003cspan class=\"tgt\">deadlines\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Emily는 장시간의 노동과 빠듯한 마감일로 직장에서 힘든 한 주를 보냈다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 주인공 Emily가 처한 \u003cb class=\"key\">고단한 \u003c/b>\u003cb class=\"key\">상황\u003c/b>을 제시하여, 이후에 일어날 사건의 정서적 \u003cb class=\"key\">대비\u003c/b>를 위한 배경을 설정합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부수적 상황을 나타내는 전치사구\u003c/span> : with + 명사(구) : \"장시간의 노동과 빠듯한 마감일로\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Emily had, Emily는 가졌다. a tough week, 힘든 한 주를. at work, 직장에서. with long hours, 장시간의 노동과. and tight deadlines, 빠듯한 마감일로.. 이 문장 전체를 해석하면, Emily는 장시간의 노동과 빠듯한 마감일로 직장에서 힘든 한 주를 보냈다.","hl":"m"},{"n":13,"text":"주인공인 Emily가 직장에서 얼마나 힘들고 고단한 시간을 보냈는지 보여주는 문장이에요. 이 힘든 상황은 나중에 남편의 선물을 받았을 때 느낄 기쁨을 더 극적으로 만들어주는 배경이 됩니다.","hl":"mn"},{"n":14,"text":"첫 번째로 문장 끝에 나온 with가 이끄는 부분에 주목해 보세요. 전치사 with는 여기서 단순히 함께 있다는 뜻이 아니라 장시간 근무와 마감 기한이라는 구체적인 상황이 덧붙여져 있음을 설명해 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서, 그녀의 남편이 ~했을 때\u003c/span>\u003cspan class=\"en\">So, \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">her \u003c/span>\u003cspan class=\"tgt\">husband \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀를 놀라게 (했을 때)\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">surprised \u003c/span>\u003cspan class=\"tgt\">her\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아름다운 장미로\u003c/span>\u003cspan class=\"en\">with beautiful roses\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">점심 식사 후에,\u003c/span>\u003cspan class=\"en\">after lunch,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 매우 기뻐했다.\u003c/span>\u003cspan class=\"en\">she was \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">overjoyed\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그래서 그녀의 남편이 점심 식사 후에 아름다운 장미로 그녀를 놀라게 했을 때, 그녀는 매우 기뻐했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 남편의 사려 깊은 행동을 통해 Emily의 기분이 \u003cb class=\"key\">전환\u003c/b>되는 지점이며, 글의 전체적인 \u003cb class=\"key\">분위기\u003c/b>가 밝게 바뀝니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간의 부사절\u003c/span> : when + 주어 + 동사 : \"그녀의 남편이 그녀를 놀라게 했을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">감정을 나타내는 분사 형용사\u003c/span> : be동사 + overjoyed(과거분사) : \"매우 기뻐하는\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"So, when her husband, 그래서, 그녀의 남편이 ~했을 때. surprised her, 그녀를 놀라게 (했을 때). with beautiful roses, 아름다운 장미로. after lunch, 점심 식사 후에. she was overjoyed, 그녀는 매우 기뻐했다.. 이 문장 전체를 해석하면, 그래서 그녀의 남편이 점심 식사 후에 아름다운 장미로 그녀를 놀라게 했을 때, 그녀는 매우 기뻐했다.","hl":"m"},{"n":16,"text":"앞 문장의 우울했던 분위기를 한순간에 바꿔주는 핵심 문장이에요. 남편이 준비한 깜짝 선물이 에밀리에게 큰 위로와 기쁨이 되었다는 사실을 전달하고 있죠.","hl":"mn"},{"n":17,"text":"첫 번째로 접속사 when이 이끄는 절은 주절의 내용이 언제 일어났는지 시점을 알려줍니다. 두 번째로 overjoyed라는 단어를 보면 에밀리가 기쁨을 직접 느끼는 상태이기 때문에 과거분사 형태의 형용사가 쓰였다는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">선명한 색과\u003c/span>\u003cspan class=\"en\">The vibrant colors\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">섬세한 꽃잎이\u003c/span>\u003cspan class=\"en\">and delicate petals\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상쾌했다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">were\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">refreshing\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">선명한 색과 섬세한 꽃잎이 상쾌했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 선물의 시각적인 아름다움을 묘사하여 에밀리가 느낀 \u003cb class=\"key\">정서적 \u003c/b>\u003cb class=\"key\">환기\u003c/b>와 \u003cb class=\"key\">생동감\u003c/b>을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주어와 동사의 수 일치\u003c/span> : 복수 주어(A and B) + were : \"~했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재분사의 보어 역할\u003c/span> : be동사 + refreshing(현재분사/보어) : \"상쾌한, 신선한\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"The vibrant colors, 선명한 색과. and delicate petals, 섬세한 꽃잎이. were refreshing, 상쾌했다.. 이 문장 전체를 해석하면, 선명한 색과 섬세한 꽃잎이 상쾌했다.","hl":"m"},{"n":19,"text":"장미꽃의 생생한 색감과 부드러운 꽃잎을 구체적으로 묘사하고 있어요. 이런 아름다운 모습이 지쳐 있던 에밀리의 마음을 시원하게 씻어주었다는 의미입니다.","hl":"mn"},{"n":20,"text":"첫 번째로 주어 부분을 보면 colors와 petals라는 두 개의 명사가 and로 묶여 있어요. 주어가 복수이기 때문에 동사는 was가 아니라 were를 써야 합니다. 두 번째로 refreshing은 장미가 주는 느낌을 설명하는 것이니까 능동의 의미를 담은 현재분사 형태를 사용한 것이죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 알 수 있었고\u003c/span>\u003cspan class=\"en\">She could tell\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 남편이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that\u003c/span> her husband\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 선물에 많은 생각을 기울였음을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">put\u003c/span> a lot of thought into the gift,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 그녀가 느끼게 했다\u003c/span>\u003cspan class=\"en\">and it \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">made \u003c/span>\u003cspan class=\"tgt\">her \u003c/span>\u003cspan class=\"tgt\">feel\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">감사함과 사랑을\u003c/span>\u003cspan class=\"en\">appreciated and loved.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 자신의 남편이 그 선물에 많은 생각을 기울였음을 알 수 있었고, 그것은 그녀가 감사함과 사랑을 느끼게 했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 남편의 세심한 배려가 담긴 선물을 통해 에밀리가 깊은 \u003cb class=\"key\">위로\u003c/b>와 \u003cb class=\"key\">정서적 \u003c/b>\u003cb class=\"key\">지지\u003c/b>를 받는 장면입니다. 단순히 꽃을 받은 것이 아니라 그 이면에 담긴 \u003cb class=\"key\">남편의 \u003c/b>\u003cb class=\"key\">진심\u003c/b>을 읽어내는 것이 핵심입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that\u003c/span> : tell [타동사] + [that (접속사) + S + V (목적어절)] : \"~라는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거완료 시제\u003c/span> : had + p.p. : \"기울였음을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">사역동사 구문\u003c/span> : make [사역동사] + her [목적어] + feel [동사원형/목적격 보어] : \"그녀가 느끼게 했다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"She could tell, 그녀는 알 수 있었고. that her husband, 자신의 남편이. had put a lot of thought into the gift, 그 선물에 많은 생각을 기울였음을. and it made her feel, 그것은 그녀가 느끼게 했다. appreciated and loved, 감사함과 사랑을. 이 문장 전체를 해석하면, 그녀는 자신의 남편이 그 선물에 많은 생각을 기울였음을 알 수 있었고, 그것은 그녀가 감사함과 사랑을 느끼게 했다.","hl":"m"},{"n":22,"text":"남편의 세심한 배려가 담긴 선물을 통해 에밀리가 깊은 위로와 정서적 지지를 받는 장면이에요. 단순히 꽃을 받은 것이 아니라 그 이면에 담긴 남편의 진심을 읽어내는 것이 핵심이죠.","hl":"mn"},{"n":23,"text":"첫 번째로 that은 타동사 tell의 목적어 역할을 하는 명사절을 이끄는 접속사예요. 두 번째로 had put은 과거완료 시제로 알 수 있었던 과거 시점보다 남편의 정성이 들어간 것이 더 이전의 일임을 나타내죠. 세 번째로 made her feel은 사역동사 구문으로 목적격 보어 자리에 동사원형을 써서 상태 변화를 강조해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 그곳에 서서\u003c/span>\u003cspan class=\"en\">As they stood there\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이야기를 나누며 장미를 감상하고 있을 때,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">chatting \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">admiring\u003c/span> the roses,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Emily는 그녀의 스트레스와 걱정이\u003c/span>\u003cspan class=\"en\">Emily \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">felt \u003c/span>\u003cspan class=\"tgt\">her \u003c/span>\u003cspan class=\"tgt\">stress \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">worries \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사라지는 것을 느꼈다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">melt \u003c/span>\u003cspan class=\"tgt\">away\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들이 그곳에 서서 이야기를 나누며 장미를 감상하고 있을 때, Emily는 그녀의 스트레스와 걱정이 사라지는 것을 느꼈다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 부부간의 대화와 아름다운 꽃을 보는 행위가 에밀리의 고단한 일상을 \u003cb class=\"key\">치유\u003c/b>하는 과정입니다. 스트레스가 '녹아내린다'는 표현으로 \u003cb class=\"key\">심리적 \u003c/b>\u003cb class=\"key\">이완\u003c/b>을 시각적으로 묘사했습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">분사구문 (동시 동작)\u003c/span> : [V-ing, V-ing] : \"이야기를 나누고 감상하며\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지각동사 구문\u003c/span> : feel [지각동사] + [목적어] + melt [동사원형/목적격 보어] : \"스트레스와 걱정이 사라지는 것을 느꼈다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"As they stood there, 그들이 그곳에 서서. chatting and admiring the roses, 이야기를 나누며 장미를 감상하고 있을 때. Emily felt her stress and worries, Emily는 그녀의 스트레스와 걱정이. melt away, 사라지는 것을 느꼈다.. 이 문장 전체를 해석하면, 그들이 그곳에 서서 이야기를 나누며 장미를 감상하고 있을 때, Emily는 그녀의 스트레스와 걱정이 사라지는 것을 느꼈다.","hl":"m"},{"n":25,"text":"부부간의 대화와 아름다운 꽃을 보는 행위가 에밀리의 고단한 일상을 치유하는 과정이에요. 스트레스가 녹아내린다는 표현으로 심리적 이완을 시각적으로 묘사했죠.","hl":"mn"},{"n":26,"text":"첫 번째로 chatting and admiring은 분사구문으로 주어의 동작과 동시에 일어나는 일을 나타내는 현재분사 병렬 구조예요. 두 번째로 felt her stress and worries melt away는 지각동사 구문인데 목적격 보어로 동사원형을 써서 직접 경험을 생생하게 보여주고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 생각했다\u003c/span>\u003cspan class=\"en\">She thought\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">심지어 가장 힘든 날에도,\u003c/span>\u003cspan class=\"en\">that even on the toughest of days,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">항상 이유가 있다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">are\u003c/span> always reasons\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세상에는 웃고 기쁨을 찾을 수 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">smile \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">find \u003c/span>\u003cspan class=\"tgt\">joy\u003c/span> in the world.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 심지어 가장 힘든 날에도, 세상에는 항상 웃고 기쁨을 찾을 수 있는 이유가 있다고 생각했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 개인적인 경험을 통해 얻은 삶의 \u003cb class=\"key\">낙관적인 \u003c/b>\u003cb class=\"key\">태도\u003c/b>를 보여줍니다. 주변에 있는 \u003cb class=\"key\">작은 \u003c/b>\u003cb class=\"key\">행복\u003c/b>이 고난을 이겨낼 힘이 된다는 \u003cb class=\"key\">교훈적 \u003c/b>\u003cb class=\"key\">메시지\u003c/b>를 담고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">유도부사 구문\u003c/span> : There [부사] + are [동사] + reasons [주어] : \"이유가 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : reasons [명사] + [to smile and find joy (to부정사구)] : \"웃고 기쁨을 찾을 (이유)\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"She thought, 그녀는 생각했다. that even on the toughest of days, 심지어 가장 힘든 날에도. there are always reasons, 항상 이유가 있다고. to smile and find joy in the world, 세상에는 웃고 기쁨을 찾을 수 있는. 이 문장 전체를 해석하면, 그녀는 심지어 가장 힘든 날에도, 세상에는 항상 웃고 기쁨을 찾을 수 있는 이유가 있다고 생각했다.","hl":"m"},{"n":28,"text":"개인적인 경험을 통해 얻은 삶의 낙관적인 태도를 보여줘요. 주변에 있는 작은 행복이 고난을 이겨낼 힘이 된다는 교훈적 메시지를 담고 있죠.","hl":"mn"},{"n":29,"text":"첫 번째로 to smile and find joy는 명사인 reasons를 뒤에서 꾸며주는 형용사적 용법의 to부정사예요. 두 번째로 there are 구문은 주어가 뒤에 나오는 도치 형태인데 복수 주어인 reasons에 맞춰서 복수 동사 are를 사용했답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">장미는\u003c/span>\u003cspan class=\"en\">The roses\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상징 역할을 했고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">served \u003c/span>\u003cspan class=\"tgt\">as\u003c/span> a symbol\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 사랑과 동반자 관계의\u003c/span>\u003cspan class=\"en\">of their love and partnership,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Emily는 행운이라고 느꼈다\u003c/span>\u003cspan class=\"en\">and Emily felt lucky\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이렇게 멋진 사람이 있다는 것이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">have\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">such \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">wonderful \u003c/span>\u003cspan class=\"tgt\">person\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀의 곁에\u003c/span>\u003cspan class=\"en\">by her side.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">장미는 그들의 사랑과 동반자 관계의 상징 역할을 했고, Emily는 그녀의 곁에 이렇게 멋진 사람이 있다는 것이 행운이라고 느꼈다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 장미라는 선물이 단순한 물건을 넘어 부부 사이의 유대감을 나타내는 \u003cb class=\"key\">상징\u003c/b>임을 나타냅니다. 힘든 시간을 보낸 후 곁을 지켜주는 사람에 대한 \u003cb class=\"key\">감사함\u003c/b>을 강조하며 글의 분위기를 따뜻하게 전환합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">자동사+전치사 관용표현\u003c/span> : serve [자동사] + as [전치사] + 명사 : \"~의 역할을 했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(원인)\u003c/span> : felt lucky [형용사] + to have [to부정사구] : \"있어서 (행운이라고)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">such의 어순\u003c/span> : such + a/an + 형용사 + 명사 : \"이렇게 멋진 사람\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"The roses, 장미는. served as a symbol, 상징 역할을 했고. of their love and partnership, 그들의 사랑과 동반자 관계의. and Emily felt lucky, Emily는 행운이라고 느꼈다. to have such a wonderful person, 이렇게 멋진 사람이 있다는 것이. by her side, 그녀의 곁에. 이 문장 전체를 해석하면, 장미는 그들의 사랑과 동반자 관계의 상징 역할을 했고, Emily는 그녀의 곁에 이렇게 멋진 사람이 있다는 것이 행운이라고 느꼈다.","hl":"m"},{"n":31,"text":"장미가 단순히 예쁜 꽃이 아니라 부부 사이의 끈끈한 유대감을 보여주는 상징이라는 점이 중요해요. 곁에 있는 소중한 사람 덕분에 힘든 마음이 위로받고 있다는 것을 표현하고 있습니다.","hl":"mn"},{"n":32,"text":"첫 번째로 served as는 무엇의 역할을 하다는 뜻의 표현이고요. 두 번째로 to have는 왜 행운이라고 느꼈는지 그 이유를 설명해 주는 부사적 용법입니다. 세 번째로 such a wonderful person은 어순이 시험에 자주 나오니 꼭 person이라는 명사 앞에 형용사와 관사가 오는 순서를 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 남편을 안고\u003c/span>\u003cspan class=\"en\">She \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">hugged \u003c/span>\u003cspan class=\"tgt\">her \u003c/span>\u003cspan class=\"tgt\">husband \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그에게 감사를 전했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">thanked \u003c/span>\u003cspan class=\"tgt\">him \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">깜짝 선물에 대한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">for\u003c/span> the surprise.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 남편을 안고 그에게 깜짝 선물에 대한 감사를 전했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 받은 위로에 대해 적극적으로 \u003cb class=\"key\">애정 \u003c/b>\u003cb class=\"key\">표현\u003c/b>을 하는 장면입니다. 남편의 배려에 대한 Emily의 직접적인 \u003cb class=\"key\">반응\u003c/b>을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사의 병렬 구조\u003c/span> : subject + [V1 (hugged)] + and + [V2 (thanked)] : \"남편을 안았고 감사했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동사구 전치사\u003c/span> : thank + A(사람) + for + B(이유) : \"그에게 ~에 대해 감사했다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"She hugged her husband, 그녀는 남편을 안고. and thanked him, 그에게 감사를 전했다. for the surprise, 깜짝 선물에 대한. 이 문장 전체를 해석하면, 그녀는 남편을 안고 그에게 깜짝 선물에 대한 감사를 전했다.","hl":"m"},{"n":34,"text":"Emily가 남편에게 고마운 마음을 행동으로 직접 보여주는 장면이에요. 힘든 한 주를 보낸 그녀에게 남편의 선물과 포옹이 큰 힘이 되었음을 알 수 있습니다.","hl":"mn"},{"n":35,"text":"첫 번째로 hugged와 thanked라는 두 과거 동사가 and를 중심으로 나란히 연결된 병렬 구조를 확인하세요. 두 번째로 thanked him for는 누구에게 무엇 때문에 고마워하는지를 나타낼 때 전치사 for를 쓴다는 점이 핵심입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이런 순간들이었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">moments \u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Emily를 하게 한 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">made \u003c/span>\u003cspan class=\"tgt\">Emily \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">진정으로 축복받은 것처럼 느끼게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">feel\u003c/span> truly blessed.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이런 순간들이 Emily를 진정으로 축복받은 것처럼 느끼게 했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 거창한 사건이 아니라 일상의 소박한 순간이 주는 \u003cb class=\"key\">행복의 \u003c/b>\u003cb class=\"key\">가치\u003c/b>를 요약합니다. Emily의 정서적 상태가 'stress'에서 'blessed'로 완전히 바뀌었음을 나타내는 \u003cb class=\"key\">결말\u003c/b> 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">It ~ that 강조구문\u003c/span> : It + was + [강조 대상] + that + [나머지 문장] : \"바로 이런 순간들이 ~했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">사역동사의 목적격 보어\u003c/span> : make [사역동사] + Emily [목적어] + feel [동사원형] : \"Emily를 느끼게 만들었다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"It was moments like this, 이런 순간들이었다. that made Emily, Emily를 하게 한 것은. feel truly blessed, 진정으로 축복받은 것처럼 느끼게. 이 문장 전체를 해석하면, 이런 순간들이 Emily를 진정으로 축복받은 것처럼 느끼게 했다.","hl":"m"},{"n":37,"text":"이 지문의 주제를 담고 있는 아주 중요한 문장이에요. 남편과 함께하는 소소한 일상의 순간이 Emily에게 얼마나 큰 축복인지를 강조하며 마무리하고 있습니다.","hl":"mn"},{"n":38,"text":"첫 번째로 It was와 that 사이에 강조하고 싶은 말을 넣는 강조 구문이 쓰였어요. 두 번째로 사역동사 made 때문에 목적어 Emily 다음에는 feel이라는 동사원형이 와야 한다는 점을 꼭 기억해야 합니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>Emily는 직장에서의 \u003cb class=\"key\">과중한 \u003c/b>\u003cb class=\"key\">업무\u003c/b>와 마감 시한으로 인해 매우 힘든 시기를 보내고 있었습니다.\u003c/li>\u003cli>남편이 선물한 \u003cb class=\"key\">장미 \u003c/b>\u003cb class=\"key\">꽃다발\u003c/b>은 그녀에게 큰 기쁨을 주었으며 남편의 정성을 느끼게 했습니다.\u003c/li>\u003cli>꽃을 감상하며 대화를 나누는 과정에서 Emily는 그동안의 \u003cb class=\"key\">스트레스와 \u003c/b>\u003cb class=\"key\">걱정\u003c/b>이 사라짐을 느꼈습니다.\u003c/li>\u003cli>어려운 상황 속에서도 \u003cb class=\"key\">행복의 \u003c/b>\u003cb class=\"key\">이유\u003c/b>가 있음을 깨달으며 자신의 삶에 대해 깊이 감사합니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Small gestures of love from a partner can provide strength and a positive perspective even during difficult times.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">고된 업무로 지친 Emily가 남편의 깜짝 \u003cb class=\"key\">장미 \u003c/b>\u003cb class=\"key\">선물\u003c/b>을 통해 스트레스를 해소하고, 일상 속 \u003cb class=\"key\">사랑과 \u003c/b>\u003cb class=\"key\">감사\u003c/b>의 가치를 깨닫는 과정을 담고 있습니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":39,"text":"자, 오늘 Emily의 이야기를 통해 작은 선물이 주는 큰 힘에 대해 생각해보았습니다. 여러분도 공부하다가 힘들 때 주변의 작은 기쁨을 찾아보는 건 어떨까요? 지문 속의 복잡한 문장 구조보다는 인물의 감정 변화를 나타내는 표현들을 다시 한 번 복습해보시기 바랍니다. 수고하셨습니다!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
