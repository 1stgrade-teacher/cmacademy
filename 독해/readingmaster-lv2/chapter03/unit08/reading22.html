<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터2 Reading22 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터2 Reading22","audioDir":"reading22_audio","preview":false,"count":42,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.668em\">Reading\u003cbr>22\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터 레벨2\u003c/div>\u003ch1>Evelyn's Disappointing Quest for Rare Fossils\u003c/h1>\u003ch2>희귀 화석을 향한 Evelyn의 실망스러운 탐사\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>\u003cb class=\"key\">희귀 \u003c/b>\u003cb class=\"key\">공룡 \u003c/b>\u003cb class=\"key\">화석\u003c/b>을 찾겠다는 평생의 꿈을 품고 알버타의 배드랜즈를 찾은 \u003cb class=\"key\">아마추어 \u003c/b>\u003cb class=\"key\">발굴자\u003c/b> Evelyn이 결국 아무런 성과 없이 \u003cb class=\"key\">실망\u003c/b>하며 탐사를 마무리하는 내용입니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Despite her high expectations and eager search for rare dinosaur fossils in the Badlands, Evelyn ended her first trip in deep disappointment and frustration.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 리딩마스터 레벨 투의 이십이 번 지문을 함께 분석해 보겠습니다. 이 글은 희귀 공룡 화석을 찾아 나선 한 탐험가의 기대와 실망을 다루고 있어요. 요약하자면, 평생의 꿈을 안고 배드랜즈를 찾은 주인공이 결국 빈손으로 돌아오며 느끼는 좌절감을 보여주는 글입니다. 요지는 큰 기대와 노력에도 불구하고 결국 실패로 끝난 화석 탐사의 허무함이라고 할 수 있겠네요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">캐나다 알버타주의 \u003cb class=\"key\">배드랜즈(Badlands)\u003c/b>는 부드러운 퇴적암과 점토가 풍부하여 침식 작용이 활발하며, 이 과정에서 숨겨져 있던 \u003cb class=\"key\">공룡 \u003c/b>\u003cb class=\"key\">화석(dinosaur \u003c/b>\u003cb class=\"key\">fossils)\u003c/b>이 지표면으로 잘 드러나는 세계적인 명소입니다. 주인공은 화석을 전문적으로 연구하는 학자가 아니라 취미로 뼈를 찾아다니는 \u003cb class=\"key\">아마추어(amateur)\u003c/b> 발굴자입니다. 희귀한 화석을 발견하는 것은 마치 길에서 \u003cb class=\"key\">보물 \u003c/b>\u003cb class=\"key\">지도\u003c/b>를 발견하는 것만큼이나 드물고 어려운 일입니다. 광활하고 황량한 지형에서 단 하나의 화석을 찾는 것은 \u003cb class=\"key\">모래사장에서 \u003c/b>\u003cb class=\"key\">바늘 \u003c/b>\u003cb class=\"key\">찾기\u003c/b>와 같은 엄청난 인내심을 요구하는 작업입니다.\u003c/div>","segs":[{"n":2,"text":"지문에 나오는 Alberta의 Badlands는 실제 캐나다에 있는 화석의 성지 같은 곳이에요. 이곳은 침식 작용이 심해서 땅속에 있던 공룡 화석들이 밖으로 잘 드러나기로 유명하죠. 하지만 지문 속 주인공인 amateur bone-hunter, 즉 아마추어 발굴자에게는 그 과정이 결코 쉽지 않습니다. 전문가가 아닌 입장에서 희귀 화석을 찾는 건 모래사장에서 바늘 찾기처럼 엄청난 행운이 따라야 하는 일이니까요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>기대 가득한 출발\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>Evelyn이 화석으로 유명한 \u003cb class=\"key\">배드랜즈\u003c/b>를 처음 방문하며 아마추어 발굴자로서 커다란 \u003cb class=\"key\">기대감\u003c/b>에 부풀어 있습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>평생의 꿈과 목표\u003csmall>배경 설명 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>흔한 종이 아닌 \u003cb class=\"key\">희귀 \u003c/b>\u003cb class=\"key\">화석\u003c/b>을 찾겠다는 \u003cb class=\"key\">평생의 \u003c/b>\u003cb class=\"key\">꿈\u003c/b>을 실현하기 위해 간절하게 수색을 시작합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>현실적인 난관\u003csmall>전환 · 문장 6–8\u003c/small>\u003c/h4>\u003cp>시간이 흐르고 \u003cb class=\"key\">일몰\u003c/b>이 다가오지만, 성과 없이 \u003cb class=\"key\">어두워지는 \u003c/b>\u003cb class=\"key\">땅\u003c/b>만 바라보며 목표와 멀어집니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>실망과 좌절\u003csmall>결론 · 문장 9–10\u003c/small>\u003c/h4>\u003cp>자신의 노력이 \u003cb class=\"key\">헛걸음\u003c/b>이었다고 자책하며 이번 탐사를 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">낭비\u003c/b>라고 결론짓습니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 주인공의 마음이 설렘에서 좌절로 바뀌는 과정을 시간의 흐름에 따라 보여주고 있습니다.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장은 도입부로, Evelyn이 수많은 화석으로 유명한 배드랜즈를 처음 방문하며 느끼는 설렘과 기대감을 강조하고 있습니다.","hl":"f0"},{"n":5,"text":"세 번째부터 다섯 번째 문장에서는 그녀의 구체적인 목표를 설명해요. 흔한 종이 아니라 희귀 화석을 찾겠다는 평생의 꿈을 실현하기 위해 아주 열정적으로 수색을 시작하죠.","hl":"f1"},{"n":6,"text":"여섯 번째부터 여덟 번째 문장은 분위기가 반전되는 지점입니다. several hours가 지났지만 아무것도 찾지 못했고, 해가 지기 시작하면서 목표가 손에서 멀어지는 절망적인 상황이 묘사됩니다.","hl":"f2"},{"n":7,"text":"마지막 아홉 번째와 열 번째 문장에서는 결국 자신의 노력이 헛수고였다고 한탄하며, 이번 탐사를 시간 낭비라고 자책하는 결론을 내립니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 10번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글 전체가 탐사를 시작해서 끝날 때까지의 \u003cb class=\"key\">시간의 \u003c/b>\u003cb class=\"key\">흐름\u003c/b>을 따르고 있습니다. 초반의 \u003cb class=\"key\">긍정적 \u003c/b>\u003cb class=\"key\">기대\u003c/b>가 후반부의 \u003cb class=\"key\">부정적 \u003c/b>\u003cb class=\"key\">결말\u003c/b>로 급격히 반전되는 구조입니다. 마지막 문장에서 주인공의 \u003cb class=\"key\">최종적인 \u003c/b>\u003cb class=\"key\">감정\u003c/b>이 강렬하게 표출되며 글이 마무리됩니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>however (6)\u003c/b>\u003cspan>기대와 대비되는 실패의 상황을 강조\u003c/span>\u003cb>Now (7)\u003c/b>\u003cspan>시간의 경과와 현재의 위박감을 나타냄\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Evelyn\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">young amateur bone-hunter\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">she\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">rare fossils of dinosaurs\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">them\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 지문은 시간의 순서에 따라 사건이 전개되는 narrative, 즉 이야기체 구조를 가지고 있어요. 특히 마지막에 주인공의 감정이 직접적으로 표출되는 미괄식 구조를 취하고 있습니다.","hl":"ty"},{"n":9,"text":"여섯 번째 문장의 however는 앞서 가졌던 기대감과 대비되는 부정적인 결과가 시작됨을 알려주는 아주 중요한 신호어입니다. 일곱 번째 문장의 Now는 시간의 경과를 나타내며 상황의 긴박함을 더해주죠. 또한 rare fossils라는 표현이 다섯 번째 문장에서 them으로 재진술되는 부분도 눈여겨보세요.","hl":"sg"}]},{"html":"\u003cs >동사\u003c/em>\u003cspan>(해가) 지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>beyond reach\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>손이 닿지 않는 곳에\u003c/span>\u003c/div>\u003cdiv>\u003cb>darkening\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>어두워지는\u003c/span>\u003c/div>\u003cdiv>\u003cb>sigh\u003c/b>\u003cem>동사\u003c/em>\u003cspan>한숨짓다\u003c/span>\u003c/div>\u003cdiv>\u003cb>for nothing\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>헛되이\u003c/span>\u003c/div>\u003cdiv>\u003cb>waste\u003c/b>\u003cem>명사\u003c/em>\u003cspan>낭비\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"중요한 단어를 살펴보면, 기대감을 뜻하는 anticipation과 인적이 드문 이라는 의미의 deserted, 그리고 헛수고라는 뜻의 for nothing 같은 표현들이 주인공의 심경과 상황을 잘 대변해주고 있습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">anticipation\u003c/b>\u003cspan class=\"m\">기대감\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">expectation\u003c/span>\u003cspan class=\"s\">excitement\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">dread\u003c/span>\u003cspan class=\"a\">apprehension\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">rare\u003c/b>\u003cspan class=\"m\">희귀한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">uncommon\u003c/span>\u003cspan class=\"s\">scarce\u003c/span>\u003cspan class=\"s\">unusual\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">common\u003c/span>\u003cspan class=\"a\">ordinary\u003c/span>\u003cspan class=\"a\">plentiful\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">deserted\u003c/b>\u003cspan class=\"m\">인적이 드문\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">abandoned\u003c/span>\u003cspan class=\"s\">uninhabited\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">crowded\u003c/span>\u003cspan class=\"a\">populated\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">unsuccessful\u003c/b>\u003cspan class=\"m\">실패한\u003c/s u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 그것을 열심히 찾기 시작했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 꿈이 이루어질 것이라는 믿음을 가지고 \u003cb class=\"key\">의욕적으로\u003c/b> 탐색을 시작하는 주인공의 \u003cb class=\"key\">능동적인\u003c/b> 태도를 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사 목적어\u003c/span> : began [동사] + searching [동명사/목적어] : \"찾는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">대명사의 지칭\u003c/span> : rare fossils (복수) -&gt; them : \"그것들(희귀 화석들)\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"She began, 그녀는 시작했다. eagerly searching, 열심히 찾는 것을. for them, 그것들을.. 이 문장 전체를 해석하면, 그녀는 그것을 열심히 찾기 시작했다.","hl":"m"},{"n":25,"text":"화석을 곧 찾을 수 있을 거라는 확신에 차서 아주 적극적으로 행동하는 모습이에요. 여기서 them은 바로 앞 문장의 희귀 공룡 화석들을 가리키죠.","hl":"mn"},{"n":26,"text":"첫 번째로 searching은 시작하다라는 뜻의 동사 began의 목적어 자리에 온 동명사예요. 두 번째로 search for는 무엇을 찾다라는 뜻의 숙어입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몇 시간 후에\u003c/span>\u003cspan class=\"en\">After many hours\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">헤매고 다닌\u003c/span>\u003cspan class=\"en\">of \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">wandering\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인적이 드문 땅을 가로질러,\u003c/span>\u003cspan class=\"en\">throughout the deserted lands,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">however\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 성공하지 못했다.\u003c/span>\u003cspan class=\"en\">she was unsuccessful.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 몇 시간 동안 인적이 드문 땅을 헤매고 다녔지만, 그녀는 성공하지 못했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 열정적인 탐색에도 불구하고 결과가 좋지 않았음을 보여주며, 글의 분위기가 \u003cb class=\"key\">기대\u003c/b>에서 \u003cb class=\"key\">실망\u003c/b>으로 전환되는 지점입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사\u003c/span> : of [전치사] + wandering [동명사] : \"헤매고 다닌\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">연결부사(역접)\u003c/span> : 콤마(,) 사이에 위치한 부사 : \"그러나\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"After many hours, 몇 시간 후에. of wandering, 헤매고 다닌. throughout the deserted lands, 인적이 드문 땅을 가로질러. however, 그러나. she was unsuccessful, 그녀는 성공하지 못했다.. 이 문장 전체를 해석하면, 그러나 몇 시간 동안 인적이 드문 땅을 헤매고 다녔지만, 그녀는 성공하지 못했다.","hl":"m"},{"n":28,"text":"아무리 열심히 찾아도 성과가 없었다는 반전이 일어납니다. 간절했던 노력에 비해 결과가 따르지 않아 느끼는 좌절감을 however로 강조하고 있네요.","hl":"mn"},{"n":29,"text":"첫 번째로 wandering은 전치사 of 뒤에 와서 헤맨 것이라는 명사 구실을 하는 동명사예요. 두 번째로 however는 보통 문장 앞에 쓰지만 이렇게 중간에 삽입되어도 앞뒤 내용을 뒤집는 역할을 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이제,\u003c/span>\u003cspan class=\"en\">Now,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">해가 지기 시작하고 있었고,\u003c/span>\u003cspan class=\"en\">the sun \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">beginning\u003c/span> to set,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀의 목표는 여전히\u003c/span>\u003cspan class=\"en\">and her goal was still\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀의 손길이 닿는 곳 훨씬 너머에 있었다.\u003c/span>\u003cspan class=\"en\">far \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">beyond \u003c/span>\u003cspan class=\"tgt\">her \u003c/span>\u003cspan class=\"tgt\">reach\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이제, 해가 지기 시작하고 있었고, 그녀의 목표는 그녀의 손길이 닿는 곳 훨씬 너머에 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 시간이 흘러 해가 지고 있다는 \u003cb class=\"key\">배경 \u003c/b>\u003cb class=\"key\">묘사\u003c/b>를 통해 주인공의 다급함과 \u003cb class=\"key\">좌절감\u003c/b>을 나타냅니다. 꿈꾸던 목표가 멀어지고 있다는 상황을 \u003cb class=\"key\">비유적\u003c/b>으로 표현하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거진행형\u003c/span> : be동사 과거형(was/were) + [동사원형-ing] : \"시작하고 있었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 관용적 표현\u003c/span> : beyond + [소유격] + reach : \"그녀의 손길이 닿는 곳 너머에\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Now, 이제. the sun was beginning to set, 해가 지기 시작하고 있었고. and her goal was still, 그녀의 목표는 여전히. far beyond her reach, 그녀의 손길이 닿는 곳 훨씬 너머에 있었다.. 이 문장 전체를 해석하면, 이제, 해가 지기 시작하고 있었고, 그녀의 목표는 그녀의 손길이 닿는 곳 훨씬 너머에 있었다.","hl":"m"},{"n":31,"text":"시간이 흐르면서 에블린의 희망이 사라지는 상황을 묘사합니다. 해가 진다는 것은 활동할 수 있는 시간이 끝났음을 의미하며 주인공이 느끼는 좌절감을 보여주죠.","hl":"mn"},{"n":32,"text":"첫 번째로 was beginning은 과거진행 시제로 해가 지고 있는 그 순간의 움직임을 생생하게 보여줘요. 두 번째로 beyond her reach는 도달할 수 없는 이라는 뜻의 중요한 전치사구 표현입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 바라보고 있었다\u003c/span>\u003cspan class=\"en\">She was looking at\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">서서히 어두워지는 땅을\u003c/span>\u003cspan class=\"en\">the slowly \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">darkening\u003c/span> ground\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신 앞에서.\u003c/span>\u003cspan class=\"en\">before her.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 자신 앞에서 서서히 어두워지는 땅을 바라보고 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 어두워지는 주변 환경을 통해 주인공의 \u003cb class=\"key\">어두운 \u003c/b>\u003cb class=\"key\">심경\u003c/b>을 간접적으로 투영합니다. \u003cb class=\"key\">시각적 \u003c/b>\u003cb class=\"key\">묘사\u003c/b>를 통해 쓸쓸한 분위기를 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재분사\u003c/span> : [동사원형-ing] + 명사(ground) : \"어두워지는\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"She was looking at, 그녀는 바라보고 있었다. the slowly darkening ground, 서서히 어두워지는 땅을. before her, 자신 앞에서.. 이 문장 전체를 해석하면, 그녀는 자신 앞에서 서서히 어두워지는 땅을 바라보고 있었다.","hl":"m"},{"n":34,"text":"에블린의 시선이 어두워지는 땅을 향하며 심리적인 우울함을 시각적으로 나타냅니다. 땅이 어두워지는 것은 그녀의 상실감을 상징하죠.","hl":"mn"},{"n":35,"text":"여기서 darkening은 뒤에 나오는 명사를 수식해주는 현재분사예요. 땅이 스스로 어두워지는 능동적인 상태를 나타내기 위해 ing 형태를 썼답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 혼자 한숨지으며, “믿을 수가 없네. 여기까지 온 것을 헛걸음을 했다니.&quot;\u003c/span>\u003cspan class=\"en\">She \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">sighed \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">herself\u003c/span>, &quot;I can't believe I came all this way \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">nothing\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 혼자 한숨지으며 “여기까지 와서 헛걸음을 했다니 믿을 수가 없네.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 기대가 컸던 만큼 깊은 \u003cb class=\"key\">실망감\u003c/b>을 독백을 통해 드러냅니다. 노력에 비해 아무런 \u003cb class=\"key\">수확이 \u003c/b>\u003cb class=\"key\">없는\u003c/b> 상황에 대한 허탈함을 나타냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관용구\u003c/span> : sigh + to oneself : \"혼자 한숨짓다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구(부사적 용법)\u003c/span> : for + nothing : \"헛되이, 아무것도 얻지 못한 채\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"She sighed to herself, 그녀는 혼자 한숨지으며. \"I can't believe, “믿을 수가 없네.. I came all this way, 여기까지 온 것을. for nothing.\", 헛걸음을 했다니.\". 이 문장 전체를 해석하면, 그녀는 혼자 한숨지으며 “여기까지 와서 헛걸음을 했다니 믿을 수가 없네.","hl":"m"},{"n":37,"text":"자신의 노력이 아무런 결과도 내지 못했다는 것에 대한 허탈함을 직접적으로 말하고 있어요. 실망 섞인 목소리가 느껴지는 대목입니다.","hl":"mn"},{"n":38,"text":"첫 번째로 sighed to herself는 마음속으로 또는 혼자서 한숨을 쉰다는 의미예요. 두 번째로 for nothing은 아무런 소득 없이라는 뜻의 핵심 관용구니까 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정말 낭비\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">What \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">waste \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시간이었네!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">time!\u003c/span>&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">정말 시간 낭비였네!”라고 말했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 오랜 시간 동안 성과 없이 헤맨 후 에블린이 느끼는 깊은 \u003cb class=\"key\">실망감\u003c/b>과 허탈함을 보여주는 \u003cb class=\"key\">감탄문\u003c/b>입니다. 화석 탐험에 대한 기대가 \u003cb class=\"key\">좌절\u003c/b>로 바뀌었음을 극적으로 나타냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">감탄문 (What으로 시작하는 감탄문)\u003c/span> : What + a(an) + 명사 (+ 주어 + 동사)! : \"정말 시간 낭비로구나!\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"What a waste, 정말 낭비. of time!, 시간이었네!. 이 문장 전체를 해석하면, 정말 시간 낭비였네!”라고 말했다.","hl":"m"},{"n":40,"text":"이 문장은 주인공 에블린이 하루 종일 공룡 화석을 찾아 헤맸지만 결국 아무것도 찾지 못했을 때 느끼는 허탈함을 강조하는 표현이에요. 처음의 부풀었던 기대가 실망으로 바뀌는 지점이죠.","hl":"mn"},{"n":41,"text":"첫 번째로 살펴볼 부분은 What으로 시작하는 감탄문 구조예요. 여기서는 명사인 waste가 핵심이기 때문에 How가 아닌 What을 썼습니다. 원래는 문장 끝에 주어와 동사인 it was가 있었지만 생략되어 더 간결하게 실망감을 전달하고 있어요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>\u003cb class=\"key\">Evelyn\u003c/b>은 공룡 화석으로 유명한 캐나다의 \u003cb class=\"key\">배드랜즈\u003c/b>로 첫 탐사를 떠났습니다.\u003c/li>\u003cli>\u003cb class=\"key\">아마추어 \u003c/b>\u003cb class=\"key\">발굴자\u003c/b>로서 그녀는 \u003cb class=\"key\">희귀 \u003c/b>\u003cb class=\"key\">화석\u003c/b>을 찾겠다는 평생의 꿈에 대한 기대로 가득 찼습니다.\u003c/li>\u003cli>몇 시간 동안 \u003cb class=\"key\">인적이 \u003c/b>\u003cb class=\"key\">드문 \u003c/b>\u003cb class=\"key\">땅\u003c/b>을 열심히 수색했지만, 결국 아무것도 발견하지 못하는 \u003cb class=\"key\">실패\u003c/b>를 겪었습니다.\u003c/li>\u003cli>해가 저물자 그녀는 이번 탐사가 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">낭비\u003c/b>였다고 느끼며 깊은 \u003cb class=\"key\">허탈감\u003c/b>에 빠졌습니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Despite her high expectations and eager search for rare dinosaur fossils in the Badlands, Evelyn ended her first trip in deep disappointment and frustration.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">\u003cb class=\"key\">희귀 \u003c/b>\u003cb class=\"key\">공룡 \u003c/b>\u003cb class=\"key\">화석\u003c/b>을 찾겠다는 평생의 꿈을 품고 알버타의 배드랜즈를 찾은 \u003cb class=\"key\">아마추어 \u003c/b>\u003cb class=\"key\">발굴자\u003c/b> Evelyn이 결국 아무런 성과 없이 \u003cb class=\"key\">실망\u003c/b>하며 탐사를 마무리하는 내용입니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":42,"text":"오늘 지문은 기대가 크면 실망도 크다는 감정의 변화를 잘 보여주었습니다. 이런 글을 읽을 때는 주인공의 태도를 나타내는 부사 eagerly나 동사 sigh 같은 단어들에 집중해서 읽는 습관을 들이세요. 고생하셨습니다. 다음 시간에 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
