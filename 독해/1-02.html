지 않아요. 여러분도 '나는 어제 티비를 보지 않았어요'를 I didn't watch TV yesterday라고 말해 볼 수 있겠죠?","hl":"gb"},{"n":107,"text":"'~하지 않았어요'라고 말할 때는 didn't를 써요. didn't 안에 이미 '안 했다'는 뜻이 들어 있어서, 뒤에는 동사를 그대로 써요. 그래서 smiled가 아니라 smile이에요.","hl":"ge"}]},{"html":"\u003cspan class=\"lp-tag\">확인해요\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-gt\">\u003cspan>🚫\u003c/span>~하지 않았어요 didn't\u003c/div>\u003cdiv class=\"k-ex\" data-hl=\"gx\">\u003cdiv>\u003cspan class=\"e\">⚽\u003c/span>\u003cb>I didn't play soccer yesterday.\u003c/b>\u003csmall>나는 어제 축구를 하지 않았어요.\u003c/small>\u003c/div>\u003cdiv>\u003cspan class=\"e\">🥕\u003c/span>\u003cb>She didn't like carrots.\u003c/b>\u003csmall>그녀는 당근을 좋아하지 않았어요.\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"k-ck\" data-hl=\"gc\">\u003cdiv class=\"q\">He \u003cspan class=\"k-ans\" data-rv=\"gc\">didn't\u003c/span> go to school yesterday.\u003c/div>\u003csmall>그는 어제 학교에 가지 않았어요.\u003c/small>\u003cdiv class=\"o\">\u003cspan class=\"k-right\" data-rv=\"gc\">didn't\u003c/span>\u003cspan>doesn't\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":108,"text":"예문을 더 볼까요?","hl":"gx"},{"n":109,"text":"I didn't play soccer yesterday.","hl":"gx","v":"n","pause":600},{"n":110,"text":"나는 어제 축구를 하지 않았어요.","hl":"gx"},{"n":111,"text":"She didn't like carrots.","hl":"gx","v":"n","pause":600},{"n":112,"text":"그녀는 당근을 좋아하지 않았어요.","hl":"gx"},{"n":113,"text":"문제를 풀어 볼까요? He 빈칸 go to school yesterday. 빈칸에 들어갈 말은 didn't, 아니면 doesn't 중에서 무엇일까요?","hl":"gc"},{"n":114,"text":"정답은 didn't! He didn't go to school yesterday.","hl":"gc","rv":"gc"}]},{"html":"\u003cspan class=\"lp-tag\">문법을 그림으로\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-gt\">\u003cspan>⏰\u003c/span>동사를 과거로 -ed\u003c/div>\u003cdiv data-hl=\"gb\">\u003cdiv class=\"gblk\">\u003cdiv class=\"gb r-when\">\u003cspan class=\"gt\">언제\u003c/span>\u003cspan class=\"ge\">One day,\u003c/span>\u003cspan class=\"gk\">어느 날\u003c/span>\u003c/div>\u003cdiv class=\"gb r-who\">\u003cspan class=\"gt\">누가\u003c/span>\u003cspan class=\"ge\">I\u003c/span>\u003cspan class=\"gk\">나는\u003c/span>\u003c/div>\u003cdiv class=\"gb r-do\">\u003cspan class=\"gt\">~해요\u003c/span>\u003cspan class=\"ge\">talked\u003c/span>\u003cspan class=\"gk\">말했어요\u003c/span>\u003c/div>\u003cdiv class=\"gb r-with\">\u003cspan class=\"gt\">누구와\u003c/span>\u003cspan class=\"ge\">to Green\u003c/span>\u003cspan class=\"gk\">Green에게\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cdiv data-hl=\"gp\">\u003cdiv class=\"gpic\">\u003cdiv class=\"gpt\">동사의 과거 변신\u003c/div>\u003cdiv class=\"gpr\">\u003cdiv class=\"gpi\">\u003cdiv class=\"pe\">💬\u003c/div>\u003cdiv class=\"pn\">talk\u003c/div>\u003cdiv class=\"pk\">말하다 (지금)\u003c/div>\u003c/div>\u003cspan class=\"gar\">➜\u003c/span>\u003cdiv class=\"gpi\">\u003cdiv class=\"pe\">💬\u003c/div>\u003cdiv class=\"pn\">talked\u003c/div>\u003cdiv class=\"pk\">말했어요 (-ed를 붙여요)\u003c/div>\u003c/div>\u003cspan class=\"gar\">➜\u003c/span>\u003cdiv class=\"gpi\">\u003cdiv class=\"pe\">📚\u003c/div>\u003cdiv class=\"pn\">listen → listened\u003c/div>\u003cdiv class=\"pk\">듣다 → 들었어요 (-ed)\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"k-ez\" data-hl=\"ge\">이미 지난 일을 말할 때는 동사 뒤에 \u003cb class=\"key\">-ed\u003c/b>를 붙여요. talk는 talked, listen은 listened가 돼요. 대신 didn't 뒤에서는 -ed를 붙이지 않아요.\u003c/div>\u003c/div>","segs":[{"n":115,"text":"두 번째 문법은 동사를 과거 모습으로 바꾸는 방법이에요. One day, I talked to Green에서 talked는 talk에 -ed를 붙인 말이에요. One day는 '어느 날', I는 '나는', talked는 '말했어요', to Green은 'Green에게'라는 뜻이지요. 대부분의 동사는 뒤에 -ed를 붙이면 '~했어요'가 된답니다. play는 played, watch는 watched가 돼요. 그리고 아까 배운 didn't 뒤에는 -ed를 붙이지 않는다는 것도 꼭 기억해 두세요!","hl":"gb"},{"n":116,"text":"이미 지난 일을 말할 때는 동사 뒤에 -ed를 붙여요. talk는 talked, listen은 listened가 돼요. 대신 didn't 뒤에서는 -ed를 붙이지 않아요.","hl":"ge"}]},{"html":"\u003cspan class=\"lp-tag\">확인해요\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-gt\">\u003cspan>⏰\u003c/span>동사를 과거로 -ed\u003c/div>\u003cdiv class=\"k-ex\" data-hl=\"gx\">\u003cdiv>\u003cspan class=\"e\">🐶\u003c/span>\u003cb>I played with my dog yesterday.\u003c/b>\u003csmall>나는 어제 강아지와 놀았어요.\u003c/small>\u003c/div>\u003cdiv>\u003cspan class=\"e\">🎬\u003c/span>\u003cb>We watched a movie last night.\u003c/b>\u003csmall>우리는 어젯밤 영화를 봤어요.\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"k-ck\" data-hl=\"gc\">\u003cdiv class=\"q\">She \u003cspan class=\"k-ans\" data-rv=\"gc\">helped\u003c/span> her mom yesterday.\u003c/div>\u003csmall>그녀는 어제 엄마를 도왔어요.\u003c/small>\u003cdiv class=\"o\">\u003cspan class=\"k-right\" data-rv=\"gc\">helped\u003c/span>\u003cspan>help\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":117,"text":"예문을 더 볼까요?","hl":"gx"},{"n":118,"text":"I played with my dog yesterday.","hl":"gx","v":"n","pause":600},{"n":119,"text":"나는 어제 강아지와 놀았어요.","hl":"gx"},{"n":120,"text":"We watched a movie last night.","hl":"gx","v":"n","pause":600},{"n":121,"text":"우리는 어젯밤 영화를 봤어요.","hl":"gx"},{"n":122,"text":"문제를 풀어 볼까요? She 빈칸 her mom yesterday. 빈칸에 들어갈 말은 helped, 아니면 help 중에서 무엇일까요?","hl":"gc"},{"n":123,"text":"정답은 helped! She helped her mom yesterday.","hl":"gc","rv":"gc"}]},{"html":"\u003cspan class=\"lp-tag\">내용 확인 문제\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-qq\" data-hl=\"q0\">\u003ci>1\u003c/i>\u003cdiv>\u003cdiv class=\"q\">Brown은 과거에 자주 웃었어요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q0\">X\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q1\">\u003ci>2\u003c/i>\u003cdiv>\u003cdiv class=\"q\">Red는 Brown에게 '너는 특별해'라고 말했어요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q1\">O\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q2\">\u003ci>3\u003c/i>\u003cdiv>\u003cdiv class=\"q\">Brown이 처음으로 말을 건 친구는 누구인가요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① Green\u003c/span>\u003cspan>② Red\u003c/span>\u003cspan>③ Blue\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q2\">Green\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q3\">\u003ci>4\u003c/i>\u003cdiv>\u003cdiv class=\"q\">Brown은 Red의 말을 듣고 어떻게 했나요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 자주 웃고 남의 말을 들어 줬어요.\u003c/span>\u003cspan>② 친구들을 만나지 않았어요.\u003c/span>\u003cspan>③ 친구들에게 화만 냈어요.\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q3\">자주 웃고 남의 말을 들어 줬어요.\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":124,"text":"이제 문제를 풀어 볼까요? 지문에서 답을 찾을 때는 Brown이 언제 어떻게 변했는지, 누가 무슨 말을 했는지 잘 살펴보세요.","hl":null},{"n":125,"text":"첫 번째 문제. Brown은 과거에 자주 웃었어요. 맞으면 O, 틀리면 X예요.","hl":"q0"},{"n":126,"text":"정답은 X, 틀려요.","hl":"q0","rv":"q0"},{"n":127,"text":"두 번째 문제. Red는 Brown에게 '너는 특별해'라고 말했어요. 맞으면 O, 틀리면 X예요.","hl":"q1"},{"n":128,"text":"정답은 O, 맞아요.","hl":"q1","rv":"q1"},{"n":129,"text":"세 번째 문제. Brown이 처음으로 말을 건 친구는 누구인가요? 첫 번째, Green. 두 번째, Red. 세 번째, Blue","hl":"q2"},{"n":130,"text":"정답은 Green예요.","hl":"q2","rv":"q2"},{"n":131,"text":"네 번째 문제. Brown은 Red의 말을 듣고 어떻게 했나요? 첫 번째, 자주 웃고 남의 말을 들어 줬어요.. 두 번째, 친구들을 만나지 않았어요.. 세 번째, 친구들에게 화만 냈어요.","hl":"q3"},{"n":132,"text":"정답은 자주 웃고 남의 말을 들어 줬어요.예요.","hl":"q3","rv":"q3"}]},{"html":"\u003cspan class=\"lp-tag\">이야기 요약하기\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-bank\">\u003cspan>didn't\u003c/span>\u003cspan>good friend\u003c/span>\u003cspan>himself\u003c/span>\u003cspan>like\u003c/span>\u003c/div>\u003cdiv class=\"k-sum\" data-hl=\"sm\">Brown \u003cspan class=\"k-ans\" data-rv=\"sm\">didn't\u003c/span> smile or listen in the past, so his friends didn't like him. Green and Red told him to be a \u003cspan class=\"k-ans\" data-rv=\"sm\">good friend\u003c/span> and to like \u003cspan class=\"k-ans\" data-rv=\"sm\">himself\u003c/span>. Now Brown smiles and listens, and all his friends \u003cspan class=\"k-ans\" data-rv=\"sm\">like\u003c/span> him.\u003c/div>\u003cdiv class=\"k-sk\">Brown은 과거에 웃지도 듣지도 않아서 친구들이 그를 좋아하지 않았어요. Green과 Red는 그에게 좋은 친구가 되고 자기 자신을 좋아하라고 말했어요. 이제 Brown은 자주 웃고 남의 말을 들어 주어서 모든 친구가 그를 좋아해요.\u003c/div>\u003c/div>","segs":[{"n":133,"text":"마지막으로 이야기를 짧게 정리해 볼게요. 빈칸에 들어갈 말을 생각하면서 아래 요약을 다시 읽어 보세요.","hl":null},{"n":134,"text":"Brown didn't smile or listen in the past, so his friends didn't like him. Green and Red told him to be a good friend and to like himself. Now Brown smiles and listens, and all his friends like him.","hl":"sm","rv":"sm","v":"n"},{"n":135,"text":"Brown은 과거에 웃지도 듣지도 않아서 친구들이 그를 좋아하지 않았어요. Green과 Red는 그에게 좋은 친구가 되고 자기 자신을 좋아하라고 말했어요. 이제 Brown은 자주 웃고 남의 말을 들어 주어서 모든 친구가 그를 좋아해요.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>Becoming Good Friends 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":136,"text":"오늘 여러분은 Brown의 이야기로 didn't와 -ed까지 멋지게 배웠어요. 여러분도 Brown처럼 먼저 다가가고 자기 자신을 소중히 여기는 좋은 친구가 되어 보아요. 정말 잘했어요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
