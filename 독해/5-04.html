\">O\u003c/span>\u003c/div>\u003cdiv class=\"gpi\">\u003cdiv class=\"pe\">🌧️\u003c/div>\u003cdiv class=\"pn\">because of it rained\u003c/div>\u003cdiv class=\"pk\">비가 왔기 때문에 (뒤에 문장은 안 돼요)\u003c/div>\u003cspan class=\"mk x\">X\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"k-ez\" data-hl=\"ge\">왜 그랬는지 말하고 싶을 때 \u003cb class=\"key\">because \u003c/b>\u003cb class=\"key\">of\u003c/b>를 써요. '꽃 장갑 때문에'는 because of the flower gloves가 되는 거예요.\u003c/div>\u003c/div>","segs":[{"n":95,"text":"두 번째 문법은 because of, '때문에'예요. 이유를 말할 때 아주 자주 쓰는 말이랍니다. 대표 문장 The hens didn't hear the fox because of the flower gloves를 덩어리로 나눠 볼게요. The hens는 '암탉들은', didn't hear는 '듣지 못했어요', the fox는 '그 여우를'이라는 뜻이에요. because of는 '때문에'라는 이유를 알려 주고, the flower gloves는 '그 꽃 장갑'이에요. 그래서 '암탉들은 꽃 장갑 때문에 여우를 듣지 못했어요'가 되지요.","hl":"gb"},{"n":96,"text":"왜 그랬는지 말하고 싶을 때 because of를 써요. '꽃 장갑 때문에'는 because of the flower gloves가 되는 거예요.","hl":"ge"}]},{"html":"\u003cspan class=\"lp-tag\">확인해요\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-gt\">\u003cspan>🧤\u003c/span>~ 때문에 because of\u003c/div>\u003cdiv class=\"k-ex\" data-hl=\"gx\">\u003cdiv>\u003cspan class=\"e\">🌧️\u003c/span>\u003cb>We stayed home because of the rain.\u003c/b>\u003csmall>우리는 비 때문에 집에 있었어요.\u003c/small>\u003c/div>\u003cdiv>\u003cspan class=\"e\">🐕\u003c/span>\u003cb>The cat ran away because of the dog.\u003c/b>\u003csmall>그 고양이는 개 때문에 도망갔어요.\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"k-ck\" data-hl=\"gc\">\u003cdiv class=\"q\">I can't sleep \u003cspan class=\"k-ans\" data-rv=\"gc\">because of\u003c/span> the noise.\u003c/div>\u003csmall>나는 소음 때문에 잠을 잘 수 없어요.\u003c/small>\u003cdiv class=\"o\">\u003cspan class=\"k-right\" data-rv=\"gc\">because of\u003c/span>\u003cspan>because\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":97,"text":"예문을 더 볼까요?","hl":"gx"},{"n":98,"text":"We stayed home because of the rain.","hl":"gx","v":"n","pause":600},{"n":99,"text":"우리는 비 때문에 집에 있었어요.","hl":"gx"},{"n":100,"text":"The cat ran away because of the dog.","hl":"gx","v":"n","pause":600},{"n":101,"text":"그 고양이는 개 때문에 도망갔어요.","hl":"gx"},{"n":102,"text":"문제를 풀어 볼까요? I can't sleep 빈칸 the noise. 빈칸에 들어갈 말은 because of, 아니면 because 중에서 무엇일까요?","hl":"gc"},{"n":103,"text":"정답은 because of! I can't sleep because of the noise.","hl":"gc","rv":"gc"}]},{"html":"\u003cspan class=\"lp-tag\">내용 확인 문제\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-qq\" data-hl=\"q0\">\u003ci>1\u003c/i>\u003cdiv>\u003cdiv class=\"q\">디기탈리스는 위험한 독이 있어서 심장약에 쓸 수 없어요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q0\">X\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q1\">\u003ci>2\u003c/i>\u003cdiv>\u003cdiv class=\"q\">이야기에 따르면, 누군가 디기탈리스를 집 안으로 가져가면 요정들이 화를 내요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q1\">O\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q2\">\u003ci>3\u003c/i>\u003cdiv>\u003cdiv class=\"q\">여우가 암탉을 사냥할 때 암탉이 여우를 듣지 못한 이유는 무엇인가요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 꽃 장갑 때문에\u003c/span>\u003cspan>② 비가 많이 와서\u003c/span>\u003cspan>③ 여우가 아주 작아서\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q2\">꽃 장갑 때문에\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q3\">\u003ci>4\u003c/i>\u003cdiv>\u003cdiv class=\"q\">요정들이 꽃을 만지면 무엇을 남기나요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 흰 반점\u003c/span>\u003cspan>② 빨간 꽃잎\u003c/span>\u003cspan>③ 검은 가루\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q3\">흰 반점\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":104,"text":"이제 문제를 풀어 볼까요? 지문을 다시 한번 떠올리며 O인지 X인지, 그리고 맞는 답을 골라 보세요.","hl":null},{"n":105,"text":"첫 번째 문제. 디기탈리스는 위험한 독이 있어서 심장약에 쓸 수 없어요. 맞으면 O, 틀리면 X예요.","hl":"q0"},{"n":106,"text":"정답은 X, 틀려요.","hl":"q0","rv":"q0"},{"n":107,"text":"두 번째 문제. 이야기에 따르면, 누군가 디기탈리스를 집 안으로 가져가면 요정들이 화를 내요. 맞으면 O, 틀리면 X예요.","hl":"q1"},{"n":108,"text":"정답은 O, 맞아요.","hl":"q1","rv":"q1"},{"n":109,"text":"세 번째 문제. 여우가 암탉을 사냥할 때 암탉이 여우를 듣지 못한 이유는 무엇인가요? 첫 번째, 꽃 장갑 때문에. 두 번째, 비가 많이 와서. 세 번째, 여우가 아주 작아서","hl":"q2"},{"n":110,"text":"정답은 꽃 장갑 때문에예요.","hl":"q2","rv":"q2"},{"n":111,"text":"네 번째 문제. 요정들이 꽃을 만지면 무엇을 남기나요? 첫 번째, 흰 반점. 두 번째, 빨간 꽃잎. 세 번째, 검은 가루","hl":"q3"},{"n":112,"text":"정답은 흰 반점예요.","hl":"q3","rv":"q3"}]},{"html":"\u003cspan class=\"lp-tag\">이야기 요약하기\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-bank\">\u003cspan>angry\u003c/span>\u003cspan>gloves\u003c/span>\u003cspan>medicine\u003c/span>\u003cspan>poison\u003c/span>\u003c/div>\u003cdiv class=\"k-sum\" data-hl=\"sm\">Foxgloves have \u003cspan class=\"k-ans\" data-rv=\"sm\">poison\u003c/span>, but they help make \u003cspan class=\"k-ans\" data-rv=\"sm\">medicine\u003c/span>. In one story, a fox uses the flowers as \u003cspan class=\"k-ans\" data-rv=\"sm\">gloves\u003c/span> to hunt hens. In the other story, fairies get \u003cspan class=\"k-ans\" data-rv=\"sm\">angry\u003c/span> if you take the flowers inside.\u003c/div>\u003cdiv class=\"k-sk\">디기탈리스는 독이 있지만 약을 만드는 데 도움이 돼요. 한 이야기에서는 여우가 그 꽃을 장갑처럼 써서 암탉을 사냥해요. 다른 이야기에서는 꽃을 안으로 가져가면 요정들이 화를 내요.\u003c/div>\u003c/div>","segs":[{"n":113,"text":"마지막으로 오늘 이야기를 세 문장으로 정리해 볼게요. 독이 있지만 약이 되는 꽃, 여우의 꽃 장갑, 그리고 화를 내는 요정, 이 세 가지만 기억하면 돼요.","hl":null},{"n":114,"text":"Foxgloves have poison, but they help make medicine. In one story, a fox uses the flowers as gloves to hunt hens. In the other story, fairies get angry if you take the flowers inside.","hl":"sm","rv":"sm","v":"n"},{"n":115,"text":"디기탈리스는 독이 있지만 약을 만드는 데 도움이 돼요. 한 이야기에서는 여우가 그 꽃을 장갑처럼 써서 암탉을 사냥해요. 다른 이야기에서는 꽃을 안으로 가져가면 요정들이 화를 내요.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>Everybody Likes Foxgloves 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":116,"text":"오늘 여러분은 디기탈리스에 얽힌 두 가지 이야기를 멋지게 읽었어요. 위험하지만 쓸모 있는 꽃이라는 점도 꼭 기억해 주세요. 다음 시간에 또 신기한 이야기로 만나요, 수고했어요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
