Hera로부터 숨으려고 했어요. 맞으면 O, 틀리면 X예요.","hl":"q0"},{"n":117,"text":"정답은 O, 맞아요.","hl":"q0","rv":"q0"},{"n":118,"text":"두 번째 문제. Hera는 Leto를 돕기 위해 뱀을 보냈어요. 맞으면 O, 틀리면 X예요.","hl":"q1"},{"n":119,"text":"정답은 X, 틀려요.","hl":"q1","rv":"q1"},{"n":120,"text":"세 번째 문제. Leto가 바다로 뛰어든 까닭은 무엇인가요? 첫 번째, 뱀을 피하려고. 두 번째, 바위를 찾으려고. 세 번째, Hera를 만나려고","hl":"q2"},{"n":121,"text":"정답은 뱀을 피하려고예요.","hl":"q2","rv":"q2"},{"n":122,"text":"네 번째 문제. 바다에 떠 있던 바위는 결국 무엇이 되었나요? 첫 번째, 섬. 두 번째, 배. 세 번째, 산","hl":"q3"},{"n":123,"text":"정답은 섬예요.","hl":"q3","rv":"q3"}]},{"html":"\u003cspan class=\"lp-tag\">이야기 요약하기\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-bank\">\u003cspan>Hera\u003c/span>\u003cspan>island\u003c/span>\u003cspan>rock\u003c/span>\u003cspan>snake\u003c/span>\u003c/div>\u003cdiv class=\"k-sum\" data-hl=\"sm\">Leto wanted to hide from \u003cspan class=\"k-ans\" data-rv=\"sm\">Hera\u003c/span>, so Hera did not allow her on the earth. Hera sent a \u003cspan class=\"k-ans\" data-rv=\"sm\">snake\u003c/span>, and Leto jumped into the sea. She gave birth on a floating \u003cspan class=\"k-ans\" data-rv=\"sm\">rock\u003c/span>, and it became an \u003cspan class=\"k-ans\" data-rv=\"sm\">island\u003c/span>.\u003c/div>\u003cdiv class=\"k-sk\">Leto는 Hera로부터 숨고 싶었지만 Hera는 지상에서 그녀를 허락하지 않았어요. Hera가 뱀을 보내자 Leto는 바다로 뛰어들었어요. Leto는 떠 있는 바위에서 아기들을 낳았고, 그 바위는 섬이 되었어요.\u003c/div>\u003c/div>","segs":[{"n":124,"text":"마지막으로 이야기를 짧게 정리해 볼게요. 빈칸에 Hera, snake, rock, island가 들어가면 이야기가 깔끔하게 정리된답니다.","hl":null},{"n":125,"text":"Leto wanted to hide from Hera, so Hera did not allow her on the earth. Hera sent a snake, and Leto jumped into the sea. She gave birth on a floating rock, and it became an island.","hl":"sm","rv":"sm","v":"n"},{"n":126,"text":"Leto는 Hera로부터 숨고 싶었지만 Hera는 지상에서 그녀를 허락하지 않았어요. Hera가 뱀을 보내자 Leto는 바다로 뛰어들었어요. Leto는 떠 있는 바위에서 아기들을 낳았고, 그 바위는 섬이 되었어요.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>Delos Island 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":127,"text":"여러분, 오늘 Delos Island 신화를 끝까지 잘 읽었어요. Leto가 어려움을 이겨 내고 아기들을 낳은 장면을 기억해 보세요. 다음 시간에도 재미있는 이야기로 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
