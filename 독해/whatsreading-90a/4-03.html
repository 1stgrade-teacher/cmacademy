003cspan>true\u003c/span>\u003c/div>\u003cdiv class=\"k-sum\" data-hl=\"sm\">Legends are very old stories, like \u003cspan class=\"k-ans\" data-rv=\"sm\">myths\u003c/span>. They are based on \u003cspan class=\"k-ans\" data-rv=\"sm\">facts\u003c/span>, but they are not always \u003cspan class=\"k-ans\" data-rv=\"sm\">true\u003c/span>. For example, Robin Hood was a \u003cspan class=\"k-ans\" data-rv=\"sm\">real\u003c/span> person, but most stories about him are not true.\u003c/div>\u003cdiv class=\"k-sk\">전설은 신화처럼 아주 오래된 이야기예요. 전설은 사실에 근거하지만 항상 사실인 것은 아니에요. 예를 들어 로빈 후드는 실제 인물이었지만, 그에 관한 대부분의 이야기는 사실이 아니에요.\u003c/div>\u003c/div>","segs":[{"n":111,"text":"마지막으로 오늘 읽은 내용을 짧게 정리해 볼게요. 전설은 신화처럼 오래된 이야기이고, 사실에 근거하지만 항상 사실은 아니에요.","hl":null},{"n":112,"text":"Legends are very old stories, like myths. They are based on facts, but they are not always true. For example, Robin Hood was a real person, but most stories about him are not true.","hl":"sm","rv":"sm","v":"n"},{"n":113,"text":"전설은 신화처럼 아주 오래된 이야기예요. 전설은 사실에 근거하지만 항상 사실인 것은 아니에요. 예를 들어 로빈 후드는 실제 인물이었지만, 그에 관한 대부분의 이야기는 사실이 아니에요.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>Legends 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":114,"text":"여러분, 오늘 정말 잘했어요! 전설이 무엇인지, 그리고 전설이 왜 사실처럼 들리는지 알게 되었죠? 다음 시간에도 재미있는 이야기로 만나요. 수고했어요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
