>\u003ci>1\u003c/i>\u003cdiv>\u003cdiv class=\"q\">나그네는 밝은 낮에 길을 걷고 있었어요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q0\">X\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q1\">\u003ci>2\u003c/i>\u003cdiv>\u003cdiv class=\"q\">등불을 든 남자는 앞을 보지 못했어요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q1\">O\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q2\">\u003ci>3\u003c/i>\u003cdiv>\u003cdiv class=\"q\">앞을 보지 못하는 남자가 등불을 든 까닭은 무엇인가요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 사람들이 자기를 볼 수 있게 하려고\u003c/span>\u003cspan>② 길을 예쁘게 꾸미려고\u003c/span>\u003cspan>③ 나그네에게 등불을 주려고\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q2\">사람들이 자기를 볼 수 있게 하려고\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q3\">\u003ci>4\u003c/i>\u003cdiv>\u003cdiv class=\"q\">남자의 따뜻한 마음을 가장 잘 나타낸 말은 무엇인가요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 그의 따뜻한 마음은 등불보다 더 밝았어요.\u003c/span>\u003cspan>② 그는 길을 잃어서 울었어요.\u003c/span>\u003cspan>③ 그는 등불을 길에 버렸어요.\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q3\">그의 따뜻한 마음은 등불보다 더 밝았어요.\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":122,"text":"이제 문제를 풀어 볼까요? 이야기를 떠올리면서 천천히 답을 찾아보세요.","hl":null},{"n":123,"text":"첫 번째 문제. 나그네는 밝은 낮에 길을 걷고 있었어요. 맞으면 O, 틀리면 X예요.","hl":"q0"},{"n":124,"text":"정답은 X, 틀려요.","hl":"q0","rv":"q0"},{"n":125,"text":"두 번째 문제. 등불을 든 남자는 앞을 보지 못했어요. 맞으면 O, 틀리면 X예요.","hl":"q1"},{"n":126,"text":"정답은 O, 맞아요.","hl":"q1","rv":"q1"},{"n":127,"text":"세 번째 문제. 앞을 보지 못하는 남자가 등불을 든 까닭은 무엇인가요? 첫 번째, 사람들이 자기를 볼 수 있게 하려고. 두 번째, 길을 예쁘게 꾸미려고. 세 번째, 나그네에게 등불을 주려고","hl":"q2"},{"n":128,"text":"정답은 사람들이 자기를 볼 수 있게 하려고예요.","hl":"q2","rv":"q2"},{"n":129,"text":"네 번째 문제. 남자의 따뜻한 마음을 가장 잘 나타낸 말은 무엇인가요? 첫 번째, 그의 따뜻한 마음은 등불보다 더 밝았어요.. 두 번째, 그는 길을 잃어서 울었어요.. 세 번째, 그는 등불을 길에 버렸어요.","hl":"q3"},{"n":130,"text":"정답은 그의 따뜻한 마음은 등불보다 더 밝았어요.예요.","hl":"q3","rv":"q3"}]},{"html":"\u003cspan class=\"lp-tag\">이야기 요약하기\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-bank\">\u003cspan>blind\u003c/span>\u003cspan>right way\u003c/span>\u003cspan>see\u003c/span>\u003cspan>traveler\u003c/span>\u003c/div>\u003cdiv class=\"k-sum\" data-hl=\"sm\">One dark night, a \u003cspan class=\"k-ans\" data-rv=\"sm\">traveler\u003c/span> got lost. A \u003cspan class=\"k-ans\" data-rv=\"sm\">blind\u003c/span> man with a lamp came to him. The man carried the lamp so people could \u003cspan class=\"k-ans\" data-rv=\"sm\">see\u003c/span> him, and he showed the traveler the \u003cspan class=\"k-ans\" data-rv=\"sm\">right way\u003c/span>. His warm heart was brighter than the lamp.\u003c/div>\u003cdiv class=\"k-sk\">어두운 어느 밤, 한 나그네가 길을 잃었어요. 등불을 든 앞을 보지 못하는 남자가 그에게 다가왔어요. 그 남자는 사람들이 자기를 볼 수 있도록 등불을 들었고, 나그네에게 맞는 길을 알려 주었어요. 그의 따뜻한 마음은 등불보다 더 밝았어요.\u003c/div>\u003c/div>","segs":[{"n":131,"text":"마지막으로 이야기를 짧게 정리해 볼까요? 어두운 밤에 나그네가 길을 잃었지만, 등불을 든 남자가 맞는 길을 알려 주었어요.","hl":null},{"n":132,"text":"One dark night, a traveler got lost. A blind man with a lamp came to him. The man carried the lamp so people could see him, and he showed the traveler the right way. His warm heart was brighter than the lamp.","hl":"sm","rv":"sm","v":"n"},{"n":133,"text":"어두운 어느 밤, 한 나그네가 길을 잃었어요. 등불을 든 앞을 보지 못하는 남자가 그에게 다가왔어요. 그 남자는 사람들이 자기를 볼 수 있도록 등불을 들었고, 나그네에게 맞는 길을 알려 주었어요. 그의 따뜻한 마음은 등불보다 더 밝았어요.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>A Man with a Lamp 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":134,"text":"여러분, 오늘 정말 잘했어요! 남을 먼저 생각하는 따뜻한 마음이 등불보다 더 밝다는 것을 꼭 기억해요. 다음 시간에 또 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
