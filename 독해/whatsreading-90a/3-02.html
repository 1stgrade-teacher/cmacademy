>내 행성에서 아시아 출신인 사람은 몇 명인가요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 60명\u003c/span>\u003cspan>② 16명\u003c/span>\u003cspan>③ 25명\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q2\">60명\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q3\">\u003ci>4\u003c/i>\u003cdiv>\u003cdiv class=\"q\">내 행성에서 15세에서 64세 사이인 사람은 몇 명인가요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 25명\u003c/span>\u003cspan>② 66명\u003c/span>\u003cspan>③ 16명\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q3\">66명\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":110,"text":"이제 문제를 풀어 볼까요? 지문을 다시 보면서 답을 찾아보세요. 숫자가 나오면 꼼꼼히 세어 보는 게 좋아요.","hl":null},{"n":111,"text":"첫 번째 문제. 지구에는 약 78억 명의 사람들이 있어요. 맞으면 O, 틀리면 X예요.","hl":"q0"},{"n":112,"text":"정답은 O, 맞아요.","hl":"q0","rv":"q0"},{"n":113,"text":"두 번째 문제. 내 행성에는 남자가 60명, 여자가 40명이에요. 맞으면 O, 틀리면 X예요.","hl":"q1"},{"n":114,"text":"정답은 X, 틀려요.","hl":"q1","rv":"q1"},{"n":115,"text":"세 번째 문제. 내 행성에서 아시아 출신인 사람은 몇 명인가요? 첫 번째, 60명. 두 번째, 16명. 세 번째, 25명","hl":"q2"},{"n":116,"text":"정답은 60명예요.","hl":"q2","rv":"q2"},{"n":117,"text":"네 번째 문제. 내 행성에서 15세에서 64세 사이인 사람은 몇 명인가요? 첫 번째, 25명. 두 번째, 66명. 세 번째, 16명","hl":"q3"},{"n":118,"text":"정답은 66명예요.","hl":"q3","rv":"q3"}]},{"html":"\u003cspan class=\"lp-tag\">이야기 요약하기\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-bank\">\u003cspan>cultures\u003c/span>\u003cspan>imagine\u003c/span>\u003cspan>male\u003c/span>\u003cspan>places\u003c/span>\u003c/div>\u003cdiv class=\"k-sum\" data-hl=\"sm\">My teacher asked us to \u003cspan class=\"k-ans\" data-rv=\"sm\">imagine\u003c/span> a planet with only 100 people. On my planet, there are 50 \u003cspan class=\"k-ans\" data-rv=\"sm\">male\u003c/span> and 50 female people of different ages. We come from different \u003cspan class=\"k-ans\" data-rv=\"sm\">places\u003c/span> and have different \u003cspan class=\"k-ans\" data-rv=\"sm\">cultures\u003c/span>, and everyone is unique.\u003c/div>\u003cdiv class=\"k-sk\">선생님이 백 명만 사는 행성을 상상해 보라고 하셨어요. 내 행성에는 나이가 다른 남자 오십 명과 여자 오십 명이 살아요. 우리는 서로 다른 곳에서 왔고 다른 문화를 가지고 있으며, 모두 독특해요.\u003c/div>\u003c/div>","segs":[{"n":119,"text":"마지막으로 오늘 이야기를 세 문장으로 정리해 볼게요. 빈칸에 들어갈 낱말을 함께 찾아봐요.","hl":null},{"n":120,"text":"My teacher asked us to imagine a planet with only 100 people. On my planet, there are 50 male and 50 female people of different ages. We come from different places and have different cultures, and everyone is unique.","hl":"sm","rv":"sm","v":"n"},{"n":121,"text":"선생님이 백 명만 사는 행성을 상상해 보라고 하셨어요. 내 행성에는 나이가 다른 남자 오십 명과 여자 오십 명이 살아요. 우리는 서로 다른 곳에서 왔고 다른 문화를 가지고 있으며, 모두 독특해요.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>Welcome to My Planet! 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":122,"text":"오늘 여러분은 나만의 행성을 상상하며 영어 지문을 멋지게 읽었어요. 모두 독특한 사람들이 모여 사는 행성처럼, 여러분도 세상에 하나뿐인 소중한 사람이에요. 다음 시간에 또 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
