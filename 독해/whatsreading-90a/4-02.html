\" data-hl=\"gc\">\u003cdiv class=\"q\">The sun was very hot, \u003cspan class=\"k-ans\" data-rv=\"gc\">so\u003c/span> the wax melted.\u003c/div>\u003csmall>태양이 아주 뜨거워서 밀랍이 녹았어요.\u003c/small>\u003cdiv class=\"o\">\u003cspan class=\"k-right\" data-rv=\"gc\">so\u003c/span>\u003cspan>because\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":109,"text":"예문을 더 볼까요?","hl":"gx"},{"n":110,"text":"It was raining, so I took an umbrella.","hl":"gx","v":"n","pause":600},{"n":111,"text":"비가 와서 우산을 챙겼어요.","hl":"gx"},{"n":112,"text":"I was hungry, so I ate a sandwich.","hl":"gx","v":"n","pause":600},{"n":113,"text":"배가 고파서 샌드위치를 먹었어요.","hl":"gx"},{"n":114,"text":"문제를 풀어 볼까요? The sun was very hot, 빈칸 the wax melted. 빈칸에 들어갈 말은 so, 아니면 because 중에서 무엇일까요?","hl":"gc"},{"n":115,"text":"정답은 so! The sun was very hot, so the wax melted.","hl":"gc","rv":"gc"}]},{"html":"\u003cspan class=\"lp-tag\">내용 확인 문제\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-qq\" data-hl=\"q0\">\u003ci>1\u003c/i>\u003cdiv>\u003cdiv class=\"q\">Daedalus는 Minos 왕의 궁전 안에 미로를 만들었어요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q0\">O\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q1\">\u003ci>2\u003c/i>\u003cdiv>\u003cdiv class=\"q\">Icarus는 아버지의 경고를 잘 듣고 낮게 날았어요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q1\">X\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q2\">\u003ci>3\u003c/i>\u003cdiv>\u003cdiv class=\"q\">Minos 왕은 Daedalus와 Icarus를 어디에 가두었나요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 바다 위의 배\u003c/span>\u003cspan>② 미로 안\u003c/span>\u003cspan>③ 왕의 궁전 정원\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q2\">미로 안\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q3\">\u003ci>4\u003c/i>\u003cdiv>\u003cdiv class=\"q\">Icarus가 바다에 빠진 까닭은 무엇인가요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 날개가 너무 무거워서\u003c/span>\u003cspan>② 태양의 열로 밀랍이 녹아서\u003c/span>\u003cspan>③ 비가 많이 내려서\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q3\">태양의 열로 밀랍이 녹아서\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":116,"text":"이제 문제를 풀어 볼까요? 글을 다시 한 번 보면서 맞으면 O, 틀리면 X를 찾고, 무엇이 정답인지 차근차근 골라 보세요.","hl":null},{"n":117,"text":"첫 번째 문제. Daedalus는 Minos 왕의 궁전 안에 미로를 만들었어요. 맞으면 O, 틀리면 X예요.","hl":"q0"},{"n":118,"text":"정답은 O, 맞아요.","hl":"q0","rv":"q0"},{"n":119,"text":"두 번째 문제. Icarus는 아버지의 경고를 잘 듣고 낮게 날았어요. 맞으면 O, 틀리면 X예요.","hl":"q1"},{"n":120,"text":"정답은 X, 틀려요.","hl":"q1","rv":"q1"},{"n":121,"text":"세 번째 문제. Minos 왕은 Daedalus와 Icarus를 어디에 가두었나요? 첫 번째, 바다 위의 배. 두 번째, 미로 안. 세 번째, 왕의 궁전 정원","hl":"q2"},{"n":122,"text":"정답은 미로 안예요.","hl":"q2","rv":"q2"},{"n":123,"text":"네 번째 문제. Icarus가 바다에 빠진 까닭은 무엇인가요? 첫 번째, 날개가 너무 무거워서. 두 번째, 태양의 열로 밀랍이 녹아서. 세 번째, 비가 많이 내려서","hl":"q3"},{"n":124,"text":"정답은 태양의 열로 밀랍이 녹아서예요.","hl":"q3","rv":"q3"}]},{"html":"\u003cspan class=\"lp-tag\">이야기 요약하기\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-bank\">\u003cspan>maze\u003c/span>\u003cspan>melted\u003c/span>\u003cspan>sea\u003c/span>\u003cspan>wings\u003c/span>\u003c/div>\u003cdiv class=\"k-sum\" data-hl=\"sm\">Daedalus built a \u003cspan class=\"k-ans\" data-rv=\"sm\">maze\u003c/span> and was kept in it with his son. He made \u003cspan class=\"k-ans\" data-rv=\"sm\">wings\u003c/span> with feathers and wax to escape. Icarus forgot the warning and flew to the sun, so the wax \u003cspan class=\"k-ans\" data-rv=\"sm\">melted\u003c/span> and he fell into the \u003cspan class=\"k-ans\" data-rv=\"sm\">sea\u003c/span>.\u003c/div>\u003cdiv class=\"k-sk\">Daedalus는 미로를 만들었지만 아들과 함께 그 안에 갇혔어요. 탈출하려고 깃털과 밀랍으로 날개를 만들었어요. Icarus는 경고를 잊고 태양으로 날아갔고, 밀랍이 녹아서 바다에 빠졌어요.\u003c/div>\u003c/div>","segs":[{"n":125,"text":"마지막으로 오늘 이야기를 짧은 영어로 정리해 볼까요? 빈칸에 들어갈 낱말을 떠올리며 함께 소리 내어 읽어 보아요.","hl":null},{"n":126,"text":"Daedalus built a maze and was kept in it with his son. He made wings with feathers and wax to escape. Icarus forgot the warning and flew to the sun, so the wax melted and he fell into the sea.","hl":"sm","rv":"sm","v":"n"},{"n":127,"text":"Daedalus는 미로를 만들었지만 아들과 함께 그 안에 갇혔어요. 탈출하려고 깃털과 밀랍으로 날개를 만들었어요. Icarus는 경고를 잊고 태양으로 날아갔고, 밀랍이 녹아서 바다에 빠졌어요.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>Flying High with Wings 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":128,"text":"여러분, 오늘 정말 멋지게 읽었어요! Daedalus의 지혜와 Icarus의 실수를 모두 기억하고 있나요? 다음 시간에도 재미있는 이야기로 만나요, 안녕!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
