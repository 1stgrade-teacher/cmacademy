 신들의 아버지였어요.","hl":"ko"},{"n":84,"text":"여기서 he, 이 말이 가리키는 것은 무엇일까요?","hl":"pt"},{"n":85,"text":"바로 the god Atum, Atum 신이에요.","hl":"pt","rv":"pt"},{"n":86,"text":"creator는 '만드는 사람', father of the gods는 '신들의 아버지'라는 뜻이에요.","hl":"tp"}]},{"html":"\u003cspan class=\"lp-tag\">문단의 요점\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-mb\" data-hl=\"p0\">\u003cspan class=\"e\">📜\u003c/span>\u003cspan class=\"l\">문단 1\u003c/span>\u003cspan class=\"t\">신화는 자연을 설명하지 못한 사람들이 \u003cb class=\"key\">신\u003c/b>이 한 일이라고 믿으며 만들어 자식에게 전한 이야기예요.\u003c/span>\u003c/div>\u003cdiv class=\"k-mb\" data-hl=\"p1\">\u003cspan class=\"e\">🌍\u003c/span>\u003cspan class=\"l\">문단 2\u003c/span>\u003cspan class=\"t\">모든 문화에 신화가 있고, 신화 속 신들은 인간과 자연을 \u003cb class=\"key\">통제\u003c/b>하는 힘을 가지고 있어요.\u003c/span>\u003c/div>\u003cdiv class=\"k-mb\" data-hl=\"p2\">\u003cspan class=\"e\">⚡\u003c/span>\u003cspan class=\"l\">문단 3\u003c/span>\u003cspan class=\"t\">Zeus는 번개와 폭풍을 통제했고, Atum은 세계의 \u003cb class=\"key\">창조자\u003c/b>였어요.\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":87,"text":"첫 번째 문단은 신화가 어떻게 생겨났는지 알려 줘요. 옛날 사람들은 자연을 설명할 수 없어서 신이 한 일이라고 믿었어요. 두 번째 문단에서는 모든 문화에 신화가 있고, 신들이 인간과 자연을 통제하는 힘을 가진다고 해요. 세 번째 문단에서는 Zeus와 Atum이라는 신의 예를 들어 주고 있어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">문법을 그림으로\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-gt\">\u003cspan>🚫\u003c/span>~할 수 없었어요 couldn't\u003c/div>\u003cdiv data-hl=\"gb\">\u003cdiv class=\"gblk\">\u003cdiv class=\"gb r-who\">\u003cspan class=\"gt\">누가\u003c/span>\u003cspan class=\"ge\">people\u003c/span>\u003cspan class=\"gk\">사람들은\u003c/span>\u003c/div>\u003cdiv class=\"gb r-not\">\u003cspan class=\"gt\">아니에요\u003c/span>\u003cspan class=\"ge\">couldn't\u003c/span>\u003cspan class=\"gk\">~할 수 없었어요\u003c/span>\u003c/div>\u003cdiv class=\"gb r-do\">\u003cspan class=\"gt\">~해요\u003c/span>\u003cspan class=\"ge\">explain\u003c/span>\u003cspan class=\"gk\">설명하다\u003c/span>\u003c/div>\u003cdiv class=\"gb r-what\">\u003cspan class=\"gt\">무엇을\u003c/span>\u003cspan class=\"ge\">many things\u003c/span>\u003cspan class=\"gk\">많은 것들을\u003c/span>\u003c/div>\u003cdiv class=\"gb r-extra\">\u003cspan class=\"gt\">더하기\u003c/span>\u003cspan class=\"ge\">about nature or history\u003c/span>\u003cspan class=\"gk\">자연이나 역사에 대해\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cdiv data-hl=\"gp\">\u003cdiv class=\"gpic\">\u003cdiv class=\"gpt\">할 수 있어요 vs 할 수 없었어요\u003c/div>\u003cdiv class=\"gpr\">\u003cdiv class=\"gpi\">\u003cdiv class=\"pe\">✅\u003c/div>\u003cdiv class=\"pn\">can explain\u003c/div>\u003cdiv class=\"pk\">설명할 수 있어요\u003c/div>\u003cspan class=\"mk o\">O\u003c/span>\u003c/div>\u003cdiv class=\"gpi\">\u003cdiv class=\"pe\">❌\u003c/div>\u003cdiv class=\"pn\">couldn't explain\u003c/div>\u003cdiv class=\"pk\">설명할 수 없었어요\u003c/div>\u003cspan class=\"mk x\">X\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"k-ez\" data-hl=\"ge\">couldn't는 '~할 수 없었어요'라는 뜻이에요. 지금은 can이지만, 옛날 일을 말할 때는 couldn't를 써요. 옛날 사람들은 자연에 대해 \u003cb class=\"key\">설명할 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">없었어요\u003c/b>.\u003c/div>\u003c/div>","segs":[{"n":88,"text":"첫 번째 문법은 couldn't예요. 이 말은 '할 수 없었어요'라는 뜻이에요. 대표 문장을 조각조각 나눠 볼게요. people은 '사람들은', couldn't는 '할 수 없었어요', explain은 '설명하다', many things는 '많은 것들', about nature or history는 '자연이나 역사에 대해'라는 뜻이에요. 옛날 사람들은 자연을 설명할 수 없어서 신 이야기를 만들었어요. 여러분도 '나는 그때 수영을 할 수 없었어요'처럼 couldn't를 써 보세요.","hl":"gb"},{"n":89,"text":"couldn't는 '~할 수 없었어요'라는 뜻이에요. 지금은 can이지만, 옛날 일을 말할 때는 couldn't를 써요. 옛날 사람들은 자연에 대해 설명할 수 없었어요.","hl":"ge"}]},{"html":"\u003cspan class=\"lp-tag\">확인해요\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-gt\">\u003cspan>🚫\u003c/span>~할 수 없었어요 couldn't\u003c/div>\u003cdiv class=\"k-ex\" data-hl=\"gx\">\u003cdiv>\u003cspan class=\"e\">🏊\u003c/span>\u003cb>I couldn't swim when I was six.\u003c/b>\u003csmall>나는 여섯 살 때 수영을 할 수 없었어요.\u003c/small>\u003c/div>\u003cdiv>\u003cspan class=\"e\">🎒\u003c/span>\u003cb>He couldn't find his bag.\u003c/b>\u003csmall>그는 가방을 찾을 수 없었어요.\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"k-ck\" data-hl=\"gc\">\u003cdiv class=\"q\">Long ago, people \u003cspan class=\"k-ans\" data-rv=\"gc\">couldn't\u003c/span> explain many things.\u003c/div>\u003csmall>오래전에 사람들은 많은 것을 설명할 수 없었어요.\u003c/small>\u003cdiv class=\"o\">\u003cspan>could\u003c/span>\u003cspan class=\"k-right\" data-rv=\"gc\">couldn't\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":90,"text":"예문을 더 볼까요?","hl":"gx"},{"n":91,"text":"I couldn't swim when I was six.","hl":"gx","v":"n","pause":600},{"n":92,"text":"나는 여섯 살 때 수영을 할 수 없었어요.","hl":"gx"},{"n":93,"text":"He couldn't find his bag.","hl":"gx","v":"n","pause":600},{"n":94,"text":"그는 가방을 찾을 수 없었어요.","hl":"gx"},{"n":95,"text":"문제를 풀어 볼까요? Long ago, people 빈칸 explain many things. 빈칸에 들어갈 말은 could, 아니면 couldn't 중에서 무엇일까요?","hl":"gc"},{"n":96,"text":"정답은 couldn't! Long ago, people couldn't explain many things.","hl":"gc","rv":"gc"}]},{"html":"\u003cspan class=\"lp-tag\">문법을 그림으로\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-gt\">\u003cspan>🌩️\u003c/span>~하곤 했어요 would\u003c/div>\u003cdiv data-hl=\"gb\">\u003cdiv class=\"gblk\">\u003cdiv class=\"gb r-who\">\u003cspan class=\"gt\">누가\u003c/span>\u003cspan class=\"ge\">Zeus\u003c/span>\u003cspan class=\"gk\">Zeus는\u003c/span>\u003c/div>\u003cdiv class=\"gb r-do\">\u003cspan class=\"gt\">~해요\u003c/span>\u003cspan class=\"ge\">would show\u003c/span>\u003cspan class=\"gk\">보여 주곤 했어요\u003c/span>\u003c/div>\u003cdiv class=\"gb r-what\">\u003cspan class=\"gt\">무엇을\u003c/span>\u003cspan class=\"ge\">his anger\u003c/span>\u003cspan class=\"gk\">자신의 화를\u003c/span>\u003c/div>\u003cdiv class=\"gb r-with\">\u003cspan class=\"gt\">누구와\u003c/span>\u003cspan class=\"ge\">with storms\u003c/span>\u003cspan class=\"gk\">폭풍으로\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cdiv data-hl=\"gp\">\u003cdiv class=\"gpic\">\u003cdiv class=\"gpt\">will이 would로\u003c/div>\u003cdiv class=\"gpr\">\u003cdiv class=\"gpi\">\u003cdiv class=\"pe\">⚡\u003c/div>\u003cdiv class=\"pn\">will show\u003c/div>\u003cdiv class=\"pk\">보여 줄 거예요 (앞으로)\u003c/div>\u003c/div>\u003cspan class=\"gar\">➜\u003c/span>\u003cdiv class=\"gpi\">\u003cdiv class=\"pe\">🌩️\u003c/div>\u003cdiv class=\"pn\">would show\u003c/div>\u003cdiv class=\"pk\">보여 주곤 했어요 (옛날에 자주)\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"k-ez\" data-hl=\"ge\">would는 '~하곤 했어요'라는 뜻으로, 옛날에 자주 하던 일을 말해요. Zeus는 화가 났을 때 \u003cb class=\"key\">폭풍으로\u003c/b> 화를 보여 주곤 했어요.\u003c/div>\u003c/div>","segs":[{"n":97,"text":"두 번째 문법은 would예요. would는 '~하곤 했어요'라는 뜻으로, 옛날에 자주 하던 일을 말해요. Zeus는 'Zeus는', would show는 '보여 주곤 했어요', his anger는 '자신의 화를', with storms는 '폭풍으로'라는 뜻이에요. 화가 날 때마다 폭풍을 일으켰다는 뜻이라서, '가끔 그랬다'보다 '자주 그랬다'는 느낌이 들지요. 할머니가 이야기를 해 주곤 하셨다는 말도 would로 할 수 있어요.","hl":"gb"},{"n":98,"text":"would는 '~하곤 했어요'라는 뜻으로, 옛날에 자주 하던 일을 말해요. Zeus는 화가 났을 때 폭풍으로 화를 보여 주곤 했어요.","hl":"ge"}]},{"html":"\u003cspan class=\"lp-tag\">확인해요\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-gt\">\u003cspan>🌩️\u003c/span>~하곤 했어요 would\u003c/div>\u003cdiv class=\"k-ex\" data-hl=\"gx\">\u003cdiv>\u003cspan class=\"e\">🎠\u003c/span>\u003cb>When I was young, I would play here.\u003c/b>\u003csmall>어릴 때 나는 여기서 놀곤 했어요.\u003c/small>\u003c/div>\u003cdiv>\u003cspan class=\"e\">👵\u003c/span>\u003cb>My grandma would tell me stories.\u003c/b>\u003csmall>할머니는 나에게 이야기를 해 주곤 했어요.\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"k-ck\" data-hl=\"gc\">\u003cdiv class=\"q\">Zeus \u003cspan class=\"k-ans\" data-rv=\"gc\">would\u003c/span> show his anger with storms.\u003c/div>\u003csmall>Zeus는 폭풍으로 자신의 화를 보여 주곤 했어요.\u003c/small>\u003cdiv class=\"o\">\u003cspan class=\"k-right\" data-rv=\"gc\">would\u003c/span>\u003cspan>will\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":99,"text":"예문을 더 볼까요?","hl":"gx"},{"n":100,"text":"When I was young, I would play here.","hl":"gx","v":"n","pause":600},{"n":101,"text":"어릴 때 나는 여기서 놀곤 했어요.","hl":"gx"},{"n":102,"text":"My grandma would tell me stories.","hl":"gx","v":"n","pause":600},{"n":103,"text":"할머니는 나에게 이야기를 해 주곤 했어요.","hl":"gx"},{"n":104,"text":"문제를 풀어 볼까요? Zeus 빈칸 show his anger with storms. 빈칸에 들어갈 말은 would, 아니면 will 중에서 무엇일까요?","hl":"gc"},{"n":105,"text":"정답은 would! Zeus would show his anger with storms.","hl":"gc","rv":"gc"}]},{"html":"\u003cspan class=\"lp-tag\">내용 확인 문제\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-qq\" data-hl=\"q0\">\u003ci>1\u003c/i>\u003cdiv>\u003cdiv class=\"q\">오래전 사람들은 자연에 대해 모든 것을 설명할 수 있었어요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q0\">X\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q1\">\u003ci>2\u003c/i>\u003cdiv>\u003cdiv class=\"q\">모든 문화에는 신화가 있어요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q1\">O\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q2\">\u003ci>3\u003c/i>\u003cdiv>\u003cdiv class=\"q\">그리스 신화에서 번개와 폭풍을 통제한 신은 누구인가요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① Zeus\u003c/span>\u003cspan>② Atum\u003c/span>\u003cspan>③ Zeus의 아들\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q2\">Zeus\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q3\">\u003ci>4\u003c/i>\u003cdiv>\u003cdiv class=\"q\">이집트 신화에서 Atum은 무엇이었나요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 세계의 창조자\u003c/span>\u003cspan>② 폭풍의 신\u003c/span>\u003cspan>③ 그리스의 왕\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q3\">세계의 창조자\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":106,"text":"이제 문제를 풀어 볼까요? 글에서 답을 찾을 때는 꼭 근거가 되는 문장을 먼저 찾아보세요. 우리 함께 하나씩 풀어 봐요.","hl":null},{"n":107,"text":"첫 번째 문제. 오래전 사람들은 자연에 대해 모든 것을 설명할 수 있었어요. 맞으면 O, 틀리면 X예요.","hl":"q0"},{"n":108,"text":"정답은 X, 틀려요.","hl":"q0","rv":"q0"},{"n":109,"text":"두 번째 문제. 모든 문화에는 신화가 있어요. 맞으면 O, 틀리면 X예요.","hl":"q1"},{"n":110,"text":"정답은 O, 맞아요.","hl":"q1","rv":"q1"},{"n":111,"text":"세 번째 문제. 그리스 신화에서 번개와 폭풍을 통제한 신은 누구인가요? 첫 번째, Zeus. 두 번째, Atum. 세 번째, Zeus의 아들","hl":"q2"},{"n":112,"text":"정답은 Zeus예요.","hl":"q2","rv":"q2"},{"n":113,"text":"네 번째 문제. 이집트 신화에서 Atum은 무엇이었나요? 첫 번째, 세계의 창조자. 두 번째, 폭풍의 신. 세 번째, 그리스의 왕","hl":"q3"},{"n":114,"text":"정답은 세계의 창조자예요.","hl":"q3","rv":"q3"}]},{"html":"\u003cspan class=\"lp-tag\">이야기 요약하기\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-bank\">\u003cspan>creator\u003c/span>\u003cspan>gods\u003c/span>\u003cspan>myth\u003c/span>\u003cspan>power\u003c/span>\u003c/div>\u003cdiv class=\"k-sum\" data-hl=\"sm\">A \u003cspan class=\"k-ans\" data-rv=\"sm\">myth\u003c/span> is a story about gods. Long ago, people couldn't explain nature, so they made up stories about \u003cspan class=\"k-ans\" data-rv=\"sm\">gods\u003c/span> and told them to their children. In myths, gods have \u003cspan class=\"k-ans\" data-rv=\"sm\">power\u003c/span> over humans and nature, like Zeus with storms and Atum the \u003cspan class=\"k-ans\" data-rv=\"sm\">creator\u003c/span>.\u003c/div>\u003cdiv class=\"k-sk\">신화는 신들에 관한 이야기예요. 오래전 사람들은 자연을 설명할 수 없어서 신들에 관한 이야기를 만들어 자식들에게 전했어요. 신화에서 신들은 인간과 자연에 대한 힘을 가지고 있어요. 폭풍의 Zeus와 창조자 Atum처럼요.\u003c/div>\u003c/div>","segs":[{"n":115,"text":"마지막으로 글 전체를 짧게 정리해 볼게요. 신화는 신들에 관한 옛이야기이고, 신들은 자연을 통제하는 힘을 가지고 있어요. 빈칸에 알맞은 낱말을 넣어 볼까요?","hl":null},{"n":116,"text":"A myth is a story about gods. Long ago, people couldn't explain nature, so they made up stories about gods and told them to their children. In myths, gods have power over humans and nature, like Zeus with storms and Atum the creator.","hl":"sm","rv":"sm","v":"n"},{"n":117,"text":"신화는 신들에 관한 이야기예요. 오래전 사람들은 자연을 설명할 수 없어서 신들에 관한 이야기를 만들어 자식들에게 전했어요. 신화에서 신들은 인간과 자연에 대한 힘을 가지고 있어요. 폭풍의 Zeus와 창조자 Atum처럼요.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>Stories about Gods 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":118,"text":"오늘 여러분은 신화가 무엇인지 아주 잘 배웠어요! 어려운 낱말도, couldn't와 would도 멋지게 이해했답니다. 다음에 그리스 신화도 한번 읽어 보세요. 정말 재미있을 거예요. 수고했어요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
