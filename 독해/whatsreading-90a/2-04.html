>bikes\u003c/span>\u003cspan>interesting\u003c/span>\u003cspan>poison\u003c/span>\u003cspan>rivers\u003c/span>\u003c/div>\u003cdiv class=\"k-sum\" data-hl=\"sm\">There are many \u003cspan class=\"k-ans\" data-rv=\"sm\">interesting\u003c/span> jobs around the world. Snake milkers collect snake \u003cspan class=\"k-ans\" data-rv=\"sm\">poison\u003c/span> for scientists, and water slide testers check the safety of slides. Bicycle fishers in Amsterdam take old \u003cspan class=\"k-ans\" data-rv=\"sm\">bikes\u003c/span> out of \u003cspan class=\"k-ans\" data-rv=\"sm\">rivers\u003c/span>.\u003c/div>\u003cdiv class=\"k-sk\">전 세계에는 많은 흥미로운 직업이 있어요. 스네이크 밀커들은 과학자를 위해 뱀의 독을 모으고, 워터 슬라이드 검사자는 슬라이드의 안전을 점검해요. 암스테르담의 자전거 낚시꾼들은 강에서 오래된 자전거를 꺼낸답니다.\u003c/div>\u003c/div>","segs":[{"n":125,"text":"오늘 이야기를 세 문장으로 줄여 볼게요. 흥미로운 직업들, 뱀의 독, 강에서 꺼낸 자전거, 이 세 가지 열쇠말을 떠올리며 빈칸을 채워 보세요.","hl":null},{"n":126,"text":"There are many interesting jobs around the world. Snake milkers collect snake poison for scientists, and water slide testers check the safety of slides. Bicycle fishers in Amsterdam take old bikes out of rivers.","hl":"sm","rv":"sm","v":"n"},{"n":127,"text":"전 세계에는 많은 흥미로운 직업이 있어요. 스네이크 밀커들은 과학자를 위해 뱀의 독을 모으고, 워터 슬라이드 검사자는 슬라이드의 안전을 점검해요. 암스테르담의 자전거 낚시꾼들은 강에서 오래된 자전거를 꺼낸답니다.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>Interesting Jobs 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":128,"text":"여러분, 오늘 정말 멋졌어요! 세상에는 신기하고 다양한 직업이 아주 많다는 걸 알게 되었죠? 오늘 배운 낱말과 can, There are를 집에서도 한 번씩 말해 보면 더 오래 기억할 거예요. 다음 시간에 또 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
