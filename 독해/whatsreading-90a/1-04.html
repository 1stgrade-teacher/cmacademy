q3","rv":"q3"}]},{"html":"\u003cspan class=\"lp-tag\">이야기 요약하기\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-bank\">\u003cspan>1929\u003c/span>\u003cspan>exist\u003c/span>\u003cspan>free meal\u003c/span>\u003cspan>soup kitchen\u003c/span>\u003c/div>\u003cdiv class=\"k-sum\" data-hl=\"sm\">A \u003cspan class=\"k-ans\" data-rv=\"sm\">soup kitchen\u003c/span> gives a \u003cspan class=\"k-ans\" data-rv=\"sm\">free meal\u003c/span> to people with little money. It started in the U.S. in \u003cspan class=\"k-ans\" data-rv=\"sm\">1929\u003c/span> and helped many people. Today, soup kitchens still \u003cspan class=\"k-ans\" data-rv=\"sm\">exist\u003c/span> and give out clothes, too.\u003c/div>\u003cdiv class=\"k-sk\">soup kitchen은 돈이 거의 없는 사람들에게 무료 식사를 줘요. 그것은 1929년 미국에서 시작되어 많은 사람을 도왔어요. 오늘날에도 soup kitchen은 여전히 있고 옷도 나눠 줘요.\u003c/div>\u003c/div>","segs":[{"n":107,"text":"마지막으로 오늘 이야기를 세 문장으로 정리해 볼게요. soup kitchen은 어려운 사람에게 무료 식사를 주고, 천구백이십구 년 미국에서 시작되었으며, 오늘날에도 여전히 음식과 옷을 나눠 준답니다.","hl":null},{"n":108,"text":"A soup kitchen gives a free meal to people with little money. It started in the U.S. in 1929 and helped many people. Today, soup kitchens still exist and give out clothes, too.","hl":"sm","rv":"sm","v":"n"},{"n":109,"text":"soup kitchen은 돈이 거의 없는 사람들에게 무료 식사를 줘요. 그것은 1929년 미국에서 시작되어 많은 사람을 도왔어요. 오늘날에도 soup kitchen은 여전히 있고 옷도 나눠 줘요.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>Place for the Hungry 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":110,"text":"오늘 여러분은 soup kitchen에 대한 이야기를 멋지게 읽어 냈어요. 따뜻한 마음으로 남을 돕는 곳이라는 점, 꼭 기억해 주세요. 다음 시간에도 재미있는 이야기로 만나요, 안녕!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
