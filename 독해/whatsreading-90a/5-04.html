살고 있어요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q0\">X\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q1\">\u003ci>2\u003c/i>\u003cdiv>\u003cdiv class=\"q\">한국인 노동자들은 하루에 열두 시간 동안 일해야 했어요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q1\">O\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q2\">\u003ci>3\u003c/i>\u003cdiv>\u003cdiv class=\"q\">1890년에 하시마 섬을 산 회사는 어디인가요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① Mitsubishi\u003c/span>\u003cspan>② Samsung\u003c/span>\u003cspan>③ Hyundai\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q2\">Mitsubishi\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q3\">\u003ci>4\u003c/i>\u003cdiv>\u003cdiv class=\"q\">그 섬은 '지옥섬'과 함께 무엇으로 불렸나요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① Prison Island\u003c/span>\u003cspan>② Sun Island\u003c/span>\u003cspan>③ Coal Island\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q3\">Prison Island\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":100,"text":"이제 내용 확인 문제를 풀어 볼까요? 지문에서 답을 찾으며 O인지 X인지, 알맞은 보기는 무엇인지 차근차근 골라 보세요.","hl":null},{"n":101,"text":"첫 번째 문제. 하시마 섬에는 지금도 많은 사람들이 살고 있어요. 맞으면 O, 틀리면 X예요.","hl":"q0"},{"n":102,"text":"정답은 X, 틀려요.","hl":"q0","rv":"q0"},{"n":103,"text":"두 번째 문제. 한국인 노동자들은 하루에 열두 시간 동안 일해야 했어요. 맞으면 O, 틀리면 X예요.","hl":"q1"},{"n":104,"text":"정답은 O, 맞아요.","hl":"q1","rv":"q1"},{"n":105,"text":"세 번째 문제. 1890년에 하시마 섬을 산 회사는 어디인가요? 첫 번째, Mitsubishi. 두 번째, Samsung. 세 번째, Hyundai","hl":"q2"},{"n":106,"text":"정답은 Mitsubishi예요.","hl":"q2","rv":"q2"},{"n":107,"text":"네 번째 문제. 그 섬은 '지옥섬'과 함께 무엇으로 불렸나요? 첫 번째, Prison Island. 두 번째, Sun Island. 세 번째, Coal Island","hl":"q3"},{"n":108,"text":"정답은 Prison Island예요.","hl":"q3","rv":"q3"}]},{"html":"\u003cspan class=\"lp-tag\">이야기 요약하기\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-bank\">\u003cspan>died\u003c/span>\u003cspan>lives\u003c/span>\u003cspan>sad\u003c/span>\u003cspan>terrible\u003c/span>\u003c/div>\u003cdiv class=\"k-sum\" data-hl=\"sm\">Hashima Island has a \u003cspan class=\"k-ans\" data-rv=\"sm\">sad\u003c/span> history. The Japanese made Chinese and Korean workers work in \u003cspan class=\"k-ans\" data-rv=\"sm\">terrible\u003c/span> conditions, and 122 Korean workers \u003cspan class=\"k-ans\" data-rv=\"sm\">died\u003c/span> there. Now no one \u003cspan class=\"k-ans\" data-rv=\"sm\">lives\u003c/span> on the island.\u003c/div>\u003cdiv class=\"k-sk\">하시마 섬은 슬픈 역사를 가지고 있어요. 일본인들은 중국인과 한국인 노동자들을 끔찍한 환경에서 일하게 했고, 백이십이 명의 한국인 노동자가 그곳에서 목숨을 잃었어요. 지금은 아무도 그 섬에 살지 않아요.\u003c/div>\u003c/div>","segs":[{"n":109,"text":"마지막으로 슬픈 역사, 끔찍한 환경, 목숨을 잃은 사람들, 지금은 아무도 살지 않는 섬을 떠올리며 요약해 볼게요. 빈칸에 알맞은 낱말을 넣어 이야기를 완성해 보세요.","hl":null},{"n":110,"text":"Hashima Island has a sad history. The Japanese made Chinese and Korean workers work in terrible conditions, and 122 Korean workers died there. Now no one lives on the island.","hl":"sm","rv":"sm","v":"n"},{"n":111,"text":"하시마 섬은 슬픈 역사를 가지고 있어요. 일본인들은 중국인과 한국인 노동자들을 끔찍한 환경에서 일하게 했고, 백이십이 명의 한국인 노동자가 그곳에서 목숨을 잃었어요. 지금은 아무도 그 섬에 살지 않아요.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>Prison Island 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":112,"text":"여러분, 오늘 하시마 섬의 슬픈 역사를 끝까지 잘 읽었어요. 어려운 낱말과 문법도 포기하지 않고 따라온 모습이 정말 멋졌어요. 다음 시간에도 함께 재미있게 영어를 공부해요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
