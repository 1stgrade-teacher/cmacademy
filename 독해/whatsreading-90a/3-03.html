03cspan class=\"ge\">people in Britain\u003c/span>\u003cspan class=\"gk\">영국 사람들은\u003c/span>\u003c/div>\u003cdiv class=\"gb r-do\">\u003cspan class=\"gt\">~해요\u003c/span>\u003cspan class=\"ge\">celebrated\u003c/span>\u003cspan class=\"gk\">기념했어요\u003c/span>\u003c/div>\u003cdiv class=\"gb r-what\">\u003cspan class=\"gt\">무엇을\u003c/span>\u003cspan class=\"ge\">Hallowmas\u003c/span>\u003cspan class=\"gk\">만성절을\u003c/span>\u003c/div>\u003cdiv class=\"gb r-extra\">\u003cspan class=\"gt\">더하기\u003c/span>\u003cspan class=\"ge\">a three-day festival\u003c/span>\u003cspan class=\"gk\">사흘 동안 열리는 축제\u003c/span>\u003c/div>\u003cdiv class=\"gb r-when\">\u003cspan class=\"gt\">언제\u003c/span>\u003cspan class=\"ge\">between October 31 and November 2\u003c/span>\u003cspan class=\"gk\">시월 삼십일일과 십일월 이일 사이에\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cdiv data-hl=\"gp\">\u003cdiv class=\"gpic\">\u003cdiv class=\"gpt\">동사가 과거로 변신\u003c/div>\u003cdiv class=\"gpr\">\u003cdiv class=\"gpi\">\u003cdiv class=\"pe\">🎉\u003c/div>\u003cdiv class=\"pn\">celebrate\u003c/div>\u003cdiv class=\"pk\">지금 하는 일이에요\u003c/div>\u003c/div>\u003cspan class=\"gar\">➜\u003c/span>\u003cdiv class=\"gpi\">\u003cdiv class=\"pe\">➕\u003c/div>\u003cdiv class=\"pn\">+ d\u003c/div>\u003cdiv class=\"pk\">d를 붙여요\u003c/div>\u003c/div>\u003cspan class=\"gar\">➜\u003c/span>\u003cdiv class=\"gpi\">\u003cdiv class=\"pe\">📜\u003c/div>\u003cdiv class=\"pn\">celebrated\u003c/div>\u003cdiv class=\"pk\">과거 이야기가 돼요\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"k-ez\" data-hl=\"ge\">이미 지나간 일을 말할 때는 동사 뒤에 d나 ed를 붙여요. celebrate에 d만 붙이면 \u003cb class=\"key\">celebrated\u003c/b>, '기념했어요'가 돼요.\u003c/div>\u003c/div>","segs":[{"n":92,"text":"다음은 지난 일을 말하는 방법이에요. 이미 지나간 일은 동사 뒤에 d나 ed를 붙여서 말해요. 대표 문장을 볼까요? In the past는 '과거에', people in Britain은 '영국 사람들은', celebrated는 '기념했어요'라는 뜻이에요. 그리고 Hallowmas는 '만성절을', a three-day festival은 '사흘 동안 열리는 축제'라는 뜻이지요. celebrate에 d만 붙여도 '기념했어요'가 된답니다.","hl":"gb"},{"n":93,"text":"이미 지나간 일을 말할 때는 동사 뒤에 d나 ed를 붙여요. celebrate에 d만 붙이면 celebrated, '기념했어요'가 돼요.","hl":"ge"}]},{"html":"\u003cspan class=\"lp-tag\">확인해요\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-gt\">\u003cspan>📜\u003c/span>지난 일엔 -d, -ed 붙이기\u003c/div>\u003cdiv class=\"k-ex\" data-hl=\"gx\">\u003cdiv>\u003cspan class=\"e\">⚽\u003c/span>\u003cb>I played soccer yesterday.\u003c/b>\u003csmall>어제 축구를 했어요.\u003c/small>\u003c/div>\u003cdiv>\u003cspan class=\"e\">🎬\u003c/span>\u003cb>We watched a movie last night.\u003c/b>\u003csmall>어젯밤에 영화를 봤어요.\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"k-ck\" data-hl=\"gc\">\u003cdiv class=\"q\">They \u003cspan class=\"k-ans\" data-rv=\"gc\">celebrated\u003c/span> Halloween last year.\u003c/div>\u003csmall>그들은 작년에 핼러윈을 기념했어요.\u003c/small>\u003cdiv class=\"o\">\u003cspan class=\"k-right\" data-rv=\"gc\">celebrated\u003c/span>\u003cspan>celebrate\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":94,"text":"예문을 더 볼까요?","hl":"gx"},{"n":95,"text":"I played soccer yesterday.","hl":"gx","v":"n","pause":600},{"n":96,"text":"어제 축구를 했어요.","hl":"gx"},{"n":97,"text":"We watched a movie last night.","hl":"gx","v":"n","pause":600},{"n":98,"text":"어젯밤에 영화를 봤어요.","hl":"gx"},{"n":99,"text":"문제를 풀어 볼까요? They 빈칸 Halloween last year. 빈칸에 들어갈 말은 celebrated, 아니면 celebrate 중에서 무엇일까요?","hl":"gc"},{"n":100,"text":"정답은 celebrated! They celebrated Halloween last year.","hl":"gc","rv":"gc"}]},{"html":"\u003cspan class=\"lp-tag\">내용 확인 문제\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-qq\" data-hl=\"q0\">\u003ci>1\u003c/i>\u003cdiv>\u003cdiv class=\"q\">핼러윈이라는 말은 '만성절 전날'을 뜻하는 이름에서 바뀐 말이에요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q0\">O\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q1\">\u003ci>2\u003c/i>\u003cdiv>\u003cdiv class=\"q\">옛날 사람들은 유령이 여름에 나온다고 믿었어요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q1\">X\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q2\">\u003ci>3\u003c/i>\u003cdiv>\u003cdiv class=\"q\">사람들이 유령처럼 옷을 입은 까닭은 무엇인가요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 유령처럼 보이는 것이 더 안전하다고 생각해서\u003c/span>\u003cspan>② 유령을 하나도 무서워하지 않아서\u003c/span>\u003cspan>③ 축제에서 상을 받고 싶어서\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q2\">유령처럼 보이는 것이 더 안전하다고 생각해서\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q3\">\u003ci>4\u003c/i>\u003cdiv>\u003cdiv class=\"q\">오늘날 핼러윈 장식에 주로 쓰는 색 두 가지는 무엇인가요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 검은색과 주황색\u003c/span>\u003cspan>② 빨간색과 초록색\u003c/span>\u003cspan>③ 파란색과 흰색\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q3\">검은색과 주황색\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":101,"text":"이제 문제를 풀어 볼까요? 답이 적힌 문장을 지문에서 다시 찾아보면 훨씬 쉬워요.","hl":null},{"n":102,"text":"첫 번째 문제. 핼러윈이라는 말은 '만성절 전날'을 뜻하는 이름에서 바뀐 말이에요. 맞으면 O, 틀리면 X예요.","hl":"q0"},{"n":103,"text":"정답은 O, 맞아요.","hl":"q0","rv":"q0"},{"n":104,"text":"두 번째 문제. 옛날 사람들은 유령이 여름에 나온다고 믿었어요. 맞으면 O, 틀리면 X예요.","hl":"q1"},{"n":105,"text":"정답은 X, 틀려요.","hl":"q1","rv":"q1"},{"n":106,"text":"세 번째 문제. 사람들이 유령처럼 옷을 입은 까닭은 무엇인가요? 첫 번째, 유령처럼 보이는 것이 더 안전하다고 생각해서. 두 번째, 유령을 하나도 무서워하지 않아서. 세 번째, 축제에서 상을 받고 싶어서","hl":"q2"},{"n":107,"text":"정답은 유령처럼 보이는 것이 더 안전하다고 생각해서예요.","hl":"q2","rv":"q2"},{"n":108,"text":"네 번째 문제. 오늘날 핼러윈 장식에 주로 쓰는 색 두 가지는 무엇인가요? 첫 번째, 검은색과 주황색. 두 번째, 빨간색과 초록색. 세 번째, 파란색과 흰색","hl":"q3"},{"n":109,"text":"정답은 검은색과 주황색예요.","hl":"q3","rv":"q3"}]},{"html":"\u003cspan class=\"lp-tag\">이야기 요약하기\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-bank\">\u003cspan>Halloween\u003c/span>\u003cspan>celebrated\u003c/span>\u003cspan>fun\u003c/span>\u003cspan>ghosts\u003c/span>\u003c/div>\u003cdiv class=\"k-sum\" data-hl=\"sm\">In the past, people \u003cspan class=\"k-ans\" data-rv=\"sm\">celebrated\u003c/span> a festival called Hallowmas, and it slowly became \u003cspan class=\"k-ans\" data-rv=\"sm\">Halloween\u003c/span>. They believed ghosts came out in winter, so they made pumpkin lanterns and dressed like \u003cspan class=\"k-ans\" data-rv=\"sm\">ghosts\u003c/span>. Today people do those things just for \u003cspan class=\"k-ans\" data-rv=\"sm\">fun\u003c/span>.\u003c/div>\u003cdiv class=\"k-sk\">옛날 사람들은 만성절이라는 축제를 지냈고, 그것이 서서히 핼러윈이 되었어요. 그들은 겨울에 유령이 나온다고 믿어서 호박 랜턴을 만들고 유령처럼 옷을 입었어요. 오늘날 사람들은 그런 것들을 그냥 재미로 해요.\u003c/div>\u003c/div>","segs":[{"n":110,"text":"마지막으로 오늘 읽은 이야기를 정리해 볼게요. 옛날 사람들은 만성절을 지냈고 그것이 핼러윈이 되었으며, 유령을 쫓으려고 호박 랜턴을 만들고 유령처럼 옷을 입었는데 오늘날에는 그냥 재미로 그렇게 해요. 이제 빈칸에 들어갈 낱말을 하나씩 맞춰 보세요.","hl":null},{"n":111,"text":"In the past, people celebrated a festival called Hallowmas, and it slowly became Halloween. They believed ghosts came out in winter, so they made pumpkin lanterns and dressed like ghosts. Today people do those things just for fun.","hl":"sm","rv":"sm","v":"n"},{"n":112,"text":"옛날 사람들은 만성절이라는 축제를 지냈고, 그것이 서서히 핼러윈이 되었어요. 그들은 겨울에 유령이 나온다고 믿어서 호박 랜턴을 만들고 유령처럼 옷을 입었어요. 오늘날 사람들은 그런 것들을 그냥 재미로 해요.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>Halloween 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":113,"text":"오늘 여러분은 핼러윈이 어떻게 시작되었는지 아주 멋지게 배웠어요. because로 까닭을 말하는 방법과 지난 일에 d나 ed를 붙이는 방법도 꼭 기억해 두세요. 정말 잘했어요, 다음 시간에 또 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
