v>\u003cdiv class=\"k-sum\" data-hl=\"sm\">A man fell into the water and woke up in an \u003cspan class=\"k-ans\" data-rv=\"sm\">underwater palace\u003c/span>. The king forgave him and gave him a white \u003cspan class=\"k-ans\" data-rv=\"sm\">puppy\u003c/span>. The puppy \u003cspan class=\"k-ans\" data-rv=\"sm\">took\u003c/span> him home, but soon it was dead.\u003c/div>\u003cdiv class=\"k-sk\">한 남자가 물에 빠졌다가 물속 궁전에서 눈을 떴어요. 왕은 그를 용서하고 흰 강아지를 주었어요. 강아지는 그를 집으로 데려다주었지만, 곧 죽었어요.\u003c/div>\u003c/div>","segs":[{"n":129,"text":"마지막으로 이야기를 세 문장으로 정리해 볼게요. 남자는 물속 궁전에서 용서를 받고 흰 강아지를 선물로 받았지만, 강아지는 그를 집으로 데려다주고 곧 죽었어요.","hl":null},{"n":130,"text":"A man fell into the water and woke up in an underwater palace. The king forgave him and gave him a white puppy. The puppy took him home, but soon it was dead.","hl":"sm","rv":"sm","v":"n"},{"n":131,"text":"한 남자가 물에 빠졌다가 물속 궁전에서 눈을 떴어요. 왕은 그를 용서하고 흰 강아지를 주었어요. 강아지는 그를 집으로 데려다주었지만, 곧 죽었어요.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>A King's Gift 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":132,"text":"오늘 여러분은 어려운 신화 이야기를 끝까지 멋지게 읽어 냈어요! when과 -ed도 아주 잘 이해했답니다. 다음 시간에 또 재미있는 이야기로 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
