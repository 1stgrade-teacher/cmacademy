":"정답은 해류예요.","hl":"q3","rv":"q3"}]},{"html":"\u003cspan class=\"lp-tag\">이야기 요약하기\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-bank\">\u003cspan>currents\u003c/span>\u003cspan>garbage islands\u003c/span>\u003cspan>world map\u003c/span>\u003c/div>\u003cdiv class=\"k-sum\" data-hl=\"sm\">Some islands are not on a \u003cspan class=\"k-ans\" data-rv=\"sm\">world map\u003c/span>. They are \u003cspan class=\"k-ans\" data-rv=\"sm\">garbage islands\u003c/span> made of plastic and fishing nets, and ocean \u003cspan class=\"k-ans\" data-rv=\"sm\">currents\u003c/span> move them around. The plastic comes from all over the world.\u003c/div>\u003cdiv class=\"k-sk\">어떤 섬들은 세계 지도에 없어요. 그것들은 플라스틱과 어망으로 만들어진 쓰레기 섬이고, 해류가 그것들을 여기저기 옮겨요. 그 플라스틱은 전 세계에서 옵니다.\u003c/div>\u003c/div>","segs":[{"n":111,"text":"마지막으로 오늘 이야기를 짧게 정리해 볼게요. 빈칸에 들어갈 낱말을 생각하면서 함께 따라 읽어 봐요.","hl":null},{"n":112,"text":"Some islands are not on a world map. They are garbage islands made of plastic and fishing nets, and ocean currents move them around. The plastic comes from all over the world.","hl":"sm","rv":"sm","v":"n"},{"n":113,"text":"어떤 섬들은 세계 지도에 없어요. 그것들은 플라스틱과 어망으로 만들어진 쓰레기 섬이고, 해류가 그것들을 여기저기 옮겨요. 그 플라스틱은 전 세계에서 옵니다.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>Plastic Islands 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":114,"text":"여러분, 오늘 정말 열심히 공부했어요! 바다를 지키는 일은 우리의 작은 실천에서 시작된대요. 다음 시간에도 신나는 이야기로 만나요. 수고했어요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
