xt":"She dropped her book.","hl":"gx","v":"n","pause":600},{"n":102,"text":"그녀는 책을 떨어뜨렸어요.","hl":"gx"},{"n":103,"text":"문제를 풀어 볼까요? He 빈칸 the ball yesterday. 빈칸에 들어갈 말은 drop, 아니면 dropped 중에서 무엇일까요?","hl":"gc"},{"n":104,"text":"정답은 dropped! He dropped the ball yesterday.","hl":"gc","rv":"gc"}]},{"html":"\u003cspan class=\"lp-tag\">문법을 그림으로\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-gt\">\u003cspan>🔗\u003c/span>그래서 so\u003c/div>\u003cdiv data-hl=\"gb\">\u003cdiv class=\"gblk\">\u003cdiv class=\"gb r-who\">\u003cspan class=\"gt\">누가\u003c/span>\u003cspan class=\"ge\">The god\u003c/span>\u003cspan class=\"gk\">신은\u003c/span>\u003c/div>\u003cdiv class=\"gb r-do\">\u003cspan class=\"gt\">~해요\u003c/span>\u003cspan class=\"ge\">got angry,\u003c/span>\u003cspan class=\"gk\">화가 났어요,\u003c/span>\u003c/div>\u003cdiv class=\"gb r-and\">\u003cspan class=\"gt\">이어 주는 말\u003c/span>\u003cspan class=\"ge\">so\u003c/span>\u003cspan class=\"gk\">그래서\u003c/span>\u003c/div>\u003cdiv class=\"gb r-extra\">\u003cspan class=\"gt\">더하기\u003c/span>\u003cspan class=\"ge\">he buried them\u003c/span>\u003cspan class=\"gk\">그들을 묻었어요\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cdiv data-hl=\"gp\">\u003cdiv class=\"gpic\">\u003cdiv class=\"gpt\">so는 까닭 다음 결과\u003c/div>\u003cdiv class=\"gtl\">\u003cdiv class=\"gpi\">\u003cspan class=\"tk\">화가 났어요\u003c/span>\u003cdiv class=\"pe\">😠\u003c/div>\u003cdiv class=\"pn\">got angry\u003c/div>\u003c/div>\u003cdiv class=\"gpi\">\u003cspan class=\"tk\">그래서 묻었어요\u003c/span>\u003cdiv class=\"pe\">🪦\u003c/div>\u003cdiv class=\"pn\">so he buried them\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"k-ez\" data-hl=\"ge\">앞에서 일어난 일 때문에 뒤의 일이 생겼을 때 so를 써요. '신은 화가 났어요, 그래서 그들을 묻었어요'처럼 \u003cb class=\"key\">까닭\u003c/b>과 결과를 이어 줘요.\u003c/div>\u003c/div>","segs":[{"n":105,"text":"두 번째 문법은 까닭과 결과를 이어 주는 so예요. The god는 신은, got angry는 화가 났어요, so는 그래서, he buried them은 그들을 묻었어요라는 뜻이에요. 앞에서 신이 화가 났고, 그 까닭에 뒤에서 남자들을 묻었다는 것이 자연스럽게 이어져요. 그래서 so는 '그래서'라는 마법의 연결 말이라고 기억해 두면 좋아요.","hl":"gb"},{"n":106,"text":"앞에서 일어난 일 때문에 뒤의 일이 생겼을 때 so를 써요. '신은 화가 났어요, 그래서 그들을 묻었어요'처럼 까닭과 결과를 이어 줘요.","hl":"ge"}]},{"html":"\u003cspan class=\"lp-tag\">확인해요\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-gt\">\u003cspan>🔗\u003c/span>그래서 so\u003c/div>\u003cdiv class=\"k-ex\" data-hl=\"gx\">\u003cdiv>\u003cspan class=\"e\">☔\u003c/span>\u003cb>It was raining, so I took an umbrella.\u003c/b>\u003csmall>비가 와서 우산을 챙겼어요.\u003c/small>\u003c/div>\u003cdiv>\u003cspan class=\"e\">😴\u003c/span>\u003cb>I was tired, so I went to bed.\u003c/b>\u003csmall>피곤해서 잠자리에 들었어요.\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"k-ck\" data-hl=\"gc\">\u003cdiv class=\"q\">He was hungry, \u003cspan class=\"k-ans\" data-rv=\"gc\">so\u003c/span> he ate lunch.\u003c/div>\u003csmall>그는 배가 고팠어요, 그래서 점심을 먹었어요.\u003c/small>\u003cdiv class=\"o\">\u003cspan class=\"k-right\" data-rv=\"gc\">so\u003c/span>\u003cspan>but\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":107,"text":"예문을 더 볼까요?","hl":"gx"},{"n":108,"text":"It was raining, so I took an umbrella.","hl":"gx","v":"n","pause":600},{"n":109,"text":"비가 와서 우산을 챙겼어요.","hl":"gx"},{"n":110,"text":"I was tired, so I went to bed.","hl":"gx","v":"n","pause":600},{"n":111,"text":"피곤해서 잠자리에 들었어요.","hl":"gx"},{"n":112,"text":"문제를 풀어 볼까요? He was hungry, 빈칸 he ate lunch. 빈칸에 들어갈 말은 so, 아니면 but 중에서 무엇일까요?","hl":"gc"},{"n":113,"text":"정답은 so! He was hungry, so he ate lunch.","hl":"gc","rv":"gc"}]},{"html":"\u003cspan class=\"lp-tag\">내용 확인 문제\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-qq\" data-hl=\"q0\">\u003ci>1\u003c/i>\u003cdiv>\u003cdiv class=\"q\">신의 딸은 다섯 개의 돌을 아주 가볍게 들 수 있었어요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q0\">X\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q1\">\u003ci>2\u003c/i>\u003cdiv>\u003cdiv class=\"q\">하늘에서 가장 힘센 남자는 거문고 소리를 듣고도 자신의 일을 잊지 않았어요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q1\">X\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q2\">\u003ci>3\u003c/i>\u003cdiv>\u003cdiv class=\"q\">신은 왜 가장 힘센 남자를 지상으로 보냈나요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 돌을 찾아오라고\u003c/span>\u003cspan>② 거문고를 배우라고\u003c/span>\u003cspan>③ 딸과 놀라고\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q2\">돌을 찾아오라고\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q3\">\u003ci>4\u003c/i>\u003cdiv>\u003cdiv class=\"q\">신은 두 명의 남자가 일을 잊자 어떻게 했나요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 그들을 묻었다\u003c/span>\u003cspan>② 그들을 하늘로 보냈다\u003c/span>\u003cspan>③ 그들에게 돌을 주었다\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q3\">그들을 묻었다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":114,"text":"이제 내용을 잘 기억했는지 문제로 확인해 볼까요? 글에서 찾은 근거를 떠올리며 O와 X, 그리고 알맞은 답을 골라 보세요.","hl":null},{"n":115,"text":"첫 번째 문제. 신의 딸은 다섯 개의 돌을 아주 가볍게 들 수 있었어요. 맞으면 O, 틀리면 X예요.","hl":"q0"},{"n":116,"text":"정답은 X, 틀려요.","hl":"q0","rv":"q0"},{"n":117,"text":"두 번째 문제. 하늘에서 가장 힘센 남자는 거문고 소리를 듣고도 자신의 일을 잊지 않았어요. 맞으면 O, 틀리면 X예요.","hl":"q1"},{"n":118,"text":"정답은 X, 틀려요.","hl":"q1","rv":"q1"},{"n":119,"text":"세 번째 문제. 신은 왜 가장 힘센 남자를 지상으로 보냈나요? 첫 번째, 돌을 찾아오라고. 두 번째, 거문고를 배우라고. 세 번째, 딸과 놀라고","hl":"q2"},{"n":120,"text":"정답은 돌을 찾아오라고예요.","hl":"q2","rv":"q2"},{"n":121,"text":"네 번째 문제. 신은 두 명의 남자가 일을 잊자 어떻게 했나요? 첫 번째, 그들을 묻었다. 두 번째, 그들을 하늘로 보냈다. 세 번째, 그들에게 돌을 주었다","hl":"q3"},{"n":122,"text":"정답은 그들을 묻었다예요.","hl":"q3","rv":"q3"}]},{"html":"\u003cspan class=\"lp-tag\">이야기 요약하기\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-bank\">\u003cspan>buried\u003c/span>\u003cspan>geomungo\u003c/span>\u003cspan>job\u003c/span>\u003cspan>special stones\u003c/span>\u003c/div>\u003cdiv class=\"k-sum\" data-hl=\"sm\">Long ago, a god's daughter dropped five \u003cspan class=\"k-ans\" data-rv=\"sm\">special stones\u003c/span> to the earth. The god sent strong men, but they heard a \u003cspan class=\"k-ans\" data-rv=\"sm\">geomungo\u003c/span> and forgot their \u003cspan class=\"k-ans\" data-rv=\"sm\">job\u003c/span>. The angry god \u003cspan class=\"k-ans\" data-rv=\"sm\">buried\u003c/span> them and put a big stone on the ground.\u003c/div>\u003cdiv class=\"k-sk\">먼 옛날, 신의 딸이 다섯 개의 특별한 돌을 땅에 떨어뜨렸어요. 신은 힘센 남자들을 보냈지만, 그들은 거문고 소리를 듣고 자신들의 일을 잊었어요. 화가 난 신은 그들을 묻고 땅 위에 큰 돌을 놓았어요.\u003c/div>\u003c/div>","segs":[{"n":123,"text":"마지막으로 이야기 전체를 쉬운 영어로 요약해 볼 거예요. 빈칸에 들어갈 핵심 낱말을 생각하며 읽어 보세요.","hl":null},{"n":124,"text":"Long ago, a god's daughter dropped five special stones to the earth. The god sent strong men, but they heard a geomungo and forgot their job. The angry god buried them and put a big stone on the ground.","hl":"sm","rv":"sm","v":"n"},{"n":125,"text":"먼 옛날, 신의 딸이 다섯 개의 특별한 돌을 땅에 떨어뜨렸어요. 신은 힘센 남자들을 보냈지만, 그들은 거문고 소리를 듣고 자신들의 일을 잊었어요. 화가 난 신은 그들을 묻고 땅 위에 큰 돌을 놓았어요.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>Five Special Stones 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":126,"text":"오늘 여러분은 신비한 신화를 읽고 과거형과 so까지 잘 익혔어요. 정말 멋졌어요! 다음 시간에도 재미있는 이야기로 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
