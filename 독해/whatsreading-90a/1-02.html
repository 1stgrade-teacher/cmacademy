법은 지난 일을 말할 때 동사의 모양이 바뀌는 것이에요. 마치 사진을 찍어 두었다가 나중에 보여 주는 것처럼, 이미 지나간 일을 말할 때 써요. 대표 문장을 덩어리로 나누어 보면, Franklin은 누가 했는지, knew는 그때 알았다는 동작을 말해요. about this는 무엇에 대해 알았는지, and는 두 동작을 이어 준다는 것을 알려 줘요. decided는 결심했다는 동작을, to ask them a favor는 무엇을 하기로 결심했는지 보여 주지요. 그래서 이미 지난 일은 knew, decided처럼 과거 모양으로 바뀐다는 점을 기억해 주세요.","hl":"gb"},{"n":95,"text":"이야기 속 프랭클린은 이미 지난 일을 말해요. 그래서 was, knew, decided처럼 동사의 모양이 과거로 바뀌어요. 이미 지나간 일은 동사의 모양이 달라진다는 점을 기억해요.","hl":"ge"}]},{"html":"\u003cspan class=\"lp-tag\">확인해요\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-gt\">\u003cspan>🕰️\u003c/span>지난 일은 과거 모양!\u003c/div>\u003cdiv class=\"k-ex\" data-hl=\"gx\">\u003cdiv>\u003cspan class=\"e\">🎬\u003c/span>\u003cb>I watched a movie yesterday.\u003c/b>\u003csmall>나는 어제 영화를 봤어요.\u003c/small>\u003c/div>\u003cdiv>\u003cspan class=\"e\">🌙\u003c/span>\u003cb>She was happy last night.\u003c/b>\u003csmall>그녀는 어젯밤 행복했어요.\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"k-ck\" data-hl=\"gc\">\u003cdiv class=\"q\">He \u003cspan class=\"k-ans\" data-rv=\"gc\">borrowed\u003c/span> a book yesterday.\u003c/div>\u003csmall>그는 어제 책을 빌렸어요.\u003c/small>\u003cdiv class=\"o\">\u003cspan class=\"k-right\" data-rv=\"gc\">borrowed\u003c/span>\u003cspan>borrow\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":96,"text":"예문을 더 볼까요?","hl":"gx"},{"n":97,"text":"I watched a movie yesterday.","hl":"gx","v":"n","pause":600},{"n":98,"text":"나는 어제 영화를 봤어요.","hl":"gx"},{"n":99,"text":"She was happy last night.","hl":"gx","v":"n","pause":600},{"n":100,"text":"그녀는 어젯밤 행복했어요.","hl":"gx"},{"n":101,"text":"문제를 풀어 볼까요? He 빈칸 a book yesterday. 빈칸에 들어갈 말은 borrowed, 아니면 borrow 중에서 무엇일까요?","hl":"gc"},{"n":102,"text":"정답은 borrowed! He borrowed a book yesterday.","hl":"gc","rv":"gc"}]},{"html":"\u003cspan class=\"lp-tag\">문법을 그림으로\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-gt\">\u003cspan>🌱\u003c/span>~이 되다 become\u003c/div>\u003cdiv data-hl=\"gb\">\u003cdiv class=\"gblk\">\u003cdiv class=\"gb r-when\">\u003c ndly는 어떤 상태가 되는지, with that person은 누구와 친해지는지 보여 주지요. 그래서 become friendly는 '친해지다', become good friends는 '좋은 친구가 되다'라는 뜻이에요.","hl":"gb"},{"n":104,"text":"become은 '~이 되다'라는 뜻이에요. 그래서 become friendly는 '친해지다', become good friends는 '좋은 친구가 되다'가 돼요. 어떤 모습으로 변할 때 become을 써요.","hl":"ge"}]},{"html":"\u003cspan class=\"lp-tag\">확인해요\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-gt\">\u003cspan>🌱\u003c/span>~이 되다 become\u003c/div>\u003cdiv class=\"k-ex\" data-hl=\"gx\">\u003cdiv>\u003cspan class=\"e\">👨‍🏫\u003c/span>\u003cb>He became a teacher.\u003c/b>\u003csmall>그는 선생님이 되었어요.\u003c/small>\u003c/div>\u003cdiv>\u003cspan class=\"e\">😊\u003c/span>\u003cb>We become friendly.\u003c/b>\u003csmall>우리는 친해져요.\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"k-ck\" data-hl=\"gc\">\u003cdiv class=\"q\">They \u003cspan class=\"k-ans\" data-rv=\"gc\">became\u003c/span> good friends last year.\u003c/div>\u003csmall>그들은 작년에 좋은 친구가 되었어요.\u003c/small>\u003cdiv class=\"o\">\u003cspan class=\"k-right\" data-rv=\"gc\">became\u003c/span>\u003cspan>become\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":105,"text":"예문을 더 볼까요?","hl":"gx"},{"n":106,"text":"He became a teacher.","hl":"gx","v":"n","pause":600},{"n":107,"text":"그는 선생님이 되었어요.","hl":"gx"},{"n":108,"text":"We become friendly.","hl":"gx","v":"n","pause":600},{"n":109,"text":"우리는 친해져요.","hl":"gx"},{"n":110,"text":"문제를 풀어 볼까요? They 빈칸 good friends last year. 빈칸에 들어갈 말은 became, 아니면 become 중에서 무엇일까요?","hl":"gc"},{"n":111,"text":"정답은 became! They became good friends last year.","hl":"gc","rv":"gc"}]},{"html":"\u003cspan class=\"lp-tag\">내용 확인 문제\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-qq\" data-hl=\"q0\">\u003ci>1\u003c/i>\u003cdiv>\u003cdiv class=\"q\">프랭클린은 처음부터 모든 사람에게 사랑받는 과학자였어요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q0\">X\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q1\">\u003ci>2\u003c/i>\u003cdiv>\u003cdiv class=\"q\">프랭클린은 그 사람에게 책을 빌려 달라고 했어요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q1\">O\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q2\">\u003ci>3\u003c/i>\u003cdiv>\u003cdiv class=\"q\">그 사람은 프랭클린에게 책을 빌려준 뒤 어떻게 했나요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 책을 빌려주지 않았어요\u003c/span>\u003cspan>② 감사 편지를 받고 프랭클린을 좋아하기 시작했어요\u003c/span>\u003cspan>③ 책을 돌려달라고 화를 냈어요\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q2\">감사 편지를 받고 프랭클린을 좋아하기 시작했어요\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q3\">\u003ci>4\u003c/i>\u003cdiv>\u003cdiv class=\"q\">이야기에서 말하는 '벤자민 프랭클린 효과'는 무엇인가요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 누군가에게 부탁을 하면 그 사람과 친해지는 것\u003c/span>\u003cspan>② 책을 많이 읽으면 과학자가 되는 것\u003c/span>\u003cspan>③ 싫어하는 사람과는 절대 말하지 않는 것\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q3\">누군가에게 부탁을 하면 그 사람과 친해지는 것\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":112,"text":"이제 문제를 풀어 볼까요? 글을 다시 떠올리며 OX 문제와 고르기 문제를 차근차근 풀어 보세요.","hl":null},{"n":113,"text":"첫 번째 문제. 프랭클린은 처음부터 모든 사람에게 사랑받는 과학자였어요. 맞으면 O, 틀리면 X예요.","hl":"q0"},{"n":114,"text":"정답은 X, 틀려요.","hl":"q0","rv":"q0"},{"n":115,"text":"두 번째 문제. 프랭클린은 그 사람에게 책을 빌려 달라고 했어요. 맞으면 O, 틀리면 X예요.","hl":"q1"},{"n":116,"text":"정답은 O, 맞아요.","hl":"q1","rv":"q1"},{"n":117,"text":"세 번째 문제. 그 사람은 프랭클린에게 책을 빌려준 뒤 어떻게 했나요? 첫 번째, 책을 빌려주지 않았어요. 두 번째, 감사 편지를 받고 프랭클린을 좋아하기 시작했어요. 세 번째, 책을 돌려달라고 화를 냈어요","hl":"q2"},{"n":118,"text":"정답은 감사 편지를 받고 프랭클린을 좋아하기 시작했어요예요.","hl":"q2","rv":"q2"},{"n":119,"text":"네 번째 문제. 이야기에서 말하는 '벤자민 프랭클린 효과'는 무엇인가요? 첫 번째, 누군가에게 부탁을 하면 그 사람과 친해지는 것. 두 번째, 책을 많이 읽으면 과학자가 되는 것. 세 번째, 싫어하는 사람과는 절대 말하지 않는 것","hl":"q3"},{"n":120,"text":"정답은 누군가에게 부탁을 하면 그 사람과 친해지는 것예요.","hl":"q3","rv":"q3"}]},{"html":"\u003cspan class=\"lp-tag\">이야기 요약하기\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-bank\">\u003cspan>borrowed\u003c/span>\u003cspan>effect\u003c/span>\u003cspan>friends\u003c/span>\u003cspan>thank-you letter\u003c/span>\u003c/div>\u003cdiv class=\"k-sum\" data-hl=\"sm\">Benjamin Franklin \u003cspan class=\"k-ans\" data-rv=\"sm\">borrowed\u003c/span> a book from a person who didn't like him. He wrote a \u003cspan class=\"k-ans\" data-rv=\"sm\">thank-you letter\u003c/span> and returned the book, and they became \u003cspan class=\"k-ans\" data-rv=\"sm\">friends\u003c/span>. This is called the Benjamin Franklin \u003cspan class=\"k-ans\" data-rv=\"sm\">effect\u003c/span>.\u003c/div>\u003cdiv class=\"k-sk\">벤자민 프랭클린은 자신을 싫어하던 사람에게 책을 빌렸어요. 그는 감사 편지를 쓰고 책을 돌려주었고, 그들은 친구가 되었어요. 이것을 벤자민 프랭클린 효과라고 불러요.\u003c/div>\u003c/div>","segs":[{"n":121,"text":"마지막으로 이야기를 짧게 요약해 볼게요. 프랭클린이 책을 빌리고 감사 편지를 보내 친구가 된 일, 그리고 이것이 벤자민 프랭클린 효과라는 점을 기억하며 빈칸을 채워 보세요.","hl":null},{"n":122,"text":"Benjamin Franklin borrowed a book from a person who didn't like him. He wrote a thank-you letter and returned the book, and they became friends. This is called the Benjamin Franklin effect.","hl":"sm","rv":"sm","v":"n"},{"n":123,"text":"벤자민 프랭클린은 자신을 싫어하던 사람에게 책을 빌렸어요. 그는 감사 편지를 쓰고 책을 돌려주었고, 그들은 친구가 되었어요. 이것을 벤자민 프랭클린 효과라고 불러요.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>Franklin's Favor 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":124,"text":"여러분, 오늘 이야기에서 부탁이 친구를 만드는 힘이 된다는 것을 배웠어요. 어려운 낱말과 문법도 끝까지 잘 따라와 주어서 정말 멋져요. 다음 시간에도 재미있는 이야기로 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
