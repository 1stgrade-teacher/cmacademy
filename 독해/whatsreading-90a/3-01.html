장에서 with를 찾아 손가락으로 짚어 볼까요?","hl":"gb"},{"n":96,"text":"with는 '함께'라는 뜻도 있지만 '가진'이라는 뜻도 있어요. people with different skin colors는 '다른 피부색을 가진 사람들'이라는 뜻이에요. 가진이라는 뜻으로 쓰인 with를 찾아보세요.","hl":"ge"}]},{"html":"\u003cspan class=\"lp-tag\">확인해요\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-gt\">\u003cspan>🧢\u003c/span>with는 '가진'이라는 뜻도 있어요\u003c/div>\u003cdiv class=\"k-ex\" data-hl=\"gx\">\u003cdiv>\u003cspan class=\"e\">🎒\u003c/span>\u003cb>I go to school with my sister.\u003c/b>\u003csmall>나는 언니와 함께 학교에 가요.\u003c/small>\u003c/div>\u003cdiv>\u003cspan class=\"e\">🧢\u003c/span>\u003cb>I see a boy with a red cap.\u003c/b>\u003csmall>나는 빨간 모자를 쓴 소년을 봐요.\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"k-ck\" data-hl=\"gc\">\u003cdiv class=\"q\">I see a dog \u003cspan class=\"k-ans\" data-rv=\"gc\">with\u003c/span> long ears.\u003c/div>\u003csmall>나는 긴 귀를 가진 개를 봐요.\u003c/small>\u003cdiv class=\"o\">\u003cspan class=\"k-right\" data-rv=\"gc\">with\u003c/span>\u003cspan>and\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":97,"text":"예문을 더 볼까요?","hl":"gx"},{"n":98,"text":"I go to school with my sister.","hl":"gx","v":"n","pause":600},{"n":99,"text":"나는 언니와 함께 학교에 가요.","hl":"gx"},{"n":100,"text":"I see a boy with a red cap.","hl":"gx","v":"n","pause":600},{"n":101,"text":"나는 빨간 모자를 쓴 소년을 봐요.","hl":"gx"},{"n":102,"text":"문제를 풀어 볼까요? I see a dog 빈칸 long ears. 빈칸에 들어갈 말은 with, 아니면 and 중에서 무엇일까요?","hl":"gc"},{"n":103,"text":"정답은 with! I see a dog with long ears.","hl":"gc","rv":"gc"}]},{"html":"\u003cspan class=\"lp-tag\">내용 확인 문제\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-qq\" data-hl=\"q0\">\u003ci>1\u003c/i>\u003cdiv>\u003cdiv class=\"q\">나는 계피처럼 어두운 피부를 가지고 있어요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q0\">O\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q1\">\u003ci>2\u003c/i>\u003cdiv>\u003cdiv class=\"q\">엄마는 빨강, 노랑, 검정, 흰색을 섞으면 무엇이 된다고 했나요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 딱 맞는 갈색\u003c/span>\u003cspan>② 연한 노란색\u003c/span>\u003cspan>③ 초콜릿 색\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q1\">딱 맞는 갈색\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q2\">\u003ci>3\u003c/i>\u003cdiv>\u003cdiv class=\"q\">Lena의 피부는 초콜릿 갈색이에요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q2\">X\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q3\">\u003ci>4\u003c/i>\u003cdiv>\u003cdiv class=\"q\">나는 집에 와서 무엇을 하나요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 그림을 그려요\u003c/span>\u003cspan>② 잠을 자요\u003c/span>\u003cspan>③ 공원에 가요\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q3\">그림을 그려요\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":104,"text":"이제 문제를 풀어 볼까요? 지문을 다시 보면서 답을 찾아보세요. 답이 되는 문장을 손가락으로 짚으면 더 쉬워요.","hl":null},{"n":105,"text":"첫 번째 문제. 나는 계피처럼 어두운 피부를 가지고 있어요. 맞으면 O, 틀리면 X예요.","hl":"q0"},{"n":106,"text":"정답은 O, 맞아요.","hl":"q0","rv":"q0"},{"n":107,"text":"두 번째 문제. 엄마는 빨강, 노랑, 검정, 흰색을 섞으면 무엇이 된다고 했나요? 첫 번째, 딱 맞는 갈색. 두 번째, 연한 노란색. 세 번째, 초콜릿 색","hl":"q1"},{"n":108,"text":"정답은 딱 맞는 갈색예요.","hl":"q1","rv":"q1"},{"n":109,"text":"세 번째 문제. Lena의 피부는 초콜릿 갈색이에요. 맞으면 O, 틀리면 X예요.","hl":"q2"},{"n":110,"text":"정답은 X, 틀려요.","hl":"q2","rv":"q2"},{"n":111,"text":"네 번째 문제. 나는 집에 와서 무엇을 하나요? 첫 번째, 그림을 그려요. 두 번째, 잠을 자요. 세 번째, 공원에 가요","hl":"q3"},{"n":112,"text":"정답은 그림을 그려요예요.","hl":"q3","rv":"q3"}]},{"html":"\u003cspan class=\"lp-tag\">이야기 요약하기\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-bank\">\u003cspan>beautiful\u003c/span>\u003cspan>different\u003c/span>\u003cspan>mix\u003c/span>\u003cspan>paint\u003c/span>\u003c/div>\u003cdiv class=\"k-sum\" data-hl=\"sm\">Mom teaches me how to \u003cspan class=\"k-ans\" data-rv=\"sm\">mix\u003c/span> colors to make the right brown. At the playground and the park, I see people with \u003cspan class=\"k-ans\" data-rv=\"sm\">different\u003c/span> skin colors. At home, I \u003cspan class=\"k-ans\" data-rv=\"sm\">paint\u003c/span> everyone. The colors of us are different, but \u003cspan class=\"k-ans\" data-rv=\"sm\">beautiful\u003c/span>.\u003c/div>\u003cdiv class=\"k-sk\">엄마는 딱 맞는 갈색을 만들려고 색을 섞는 법을 가르쳐 주세요. 놀이터와 공원에서 나는 다른 피부색을 가진 사람들을 봐요. 집에서 나는 모두를 그려요. 우리의 색은 다르지만 아름다워요.\u003c/div>\u003c/div>","segs":[{"n":113,"text":"마지막으로 오늘 이야기를 정리해 볼까요? 엄마가 색을 섞는 법을 알려 주셨고, 우리는 여러 피부색을 가진 사람들을 만났어요. 그리고 그 모두를 그렸지요.","hl":null},{"n":114,"text":"Mom teaches me how to mix colors to make the right brown. At the playground and the park, I see people with different skin colors. At home, I paint everyone. The colors of us are different, but beautiful.","hl":"sm","rv":"sm","v":"n"},{"n":115,"text":"엄마는 딱 맞는 갈색을 만들려고 색을 섞는 법을 가르쳐 주세요. 놀이터와 공원에서 나는 다른 피부색을 가진 사람들을 봐요. 집에서 나는 모두를 그려요. 우리의 색은 다르지만 아름다워요.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>The Colors of Us 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":116,"text":"여러분, 오늘 정말 잘했어요! 우리의 색은 모두 다르지만 아름답다는 것을 꼭 기억해요. 다음 시간에도 재미있는 이야기로 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
