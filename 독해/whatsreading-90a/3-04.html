\"q3\">네덜란드\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":104,"text":"문제를 풀면서 이야기를 다시 떠올려 볼까요? 답은 꼭 지문 속에서 찾아보세요.","hl":null},{"n":105,"text":"첫 번째 문제. 흰색을 입는 풍습은 2,000년보다 나중에 시작되었어요. 맞으면 O, 틀리면 X예요.","hl":"q0"},{"n":106,"text":"정답은 X, 틀려요.","hl":"q0","rv":"q0"},{"n":107,"text":"두 번째 문제. 중동의 사막에서는 흰색이 우유와 관련이 있어요. 맞으면 O, 틀리면 X예요.","hl":"q1"},{"n":108,"text":"정답은 O, 맞아요.","hl":"q1","rv":"q1"},{"n":109,"text":"세 번째 문제. 서양 문화에서 주황색이 뜻하는 것은 무엇인가요? 첫 번째, 가을과 수확. 두 번째, 죽음과 유령. 세 번째, 순수함","hl":"q2"},{"n":110,"text":"정답은 가을과 수확예요.","hl":"q2","rv":"q2"},{"n":111,"text":"네 번째 문제. 주황색 유니폼을 입은 선수들이 있는 나라는 어디인가요? 첫 번째, 네덜란드. 두 번째, 태국. 세 번째, 인도","hl":"q3"},{"n":112,"text":"정답은 네덜란드예요.","hl":"q3","rv":"q3"}]},{"html":"\u003cspan class=\"lp-tag\">이야기 요약하기\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-bank\">\u003cspan>death\u003c/span>\u003cspan>harvest\u003c/span>\u003cspan>holy\u003c/span>\u003cspan>purity\u003c/span>\u003c/div>\u003cdiv class=\"k-sum\" data-hl=\"sm\">White is the color of \u003cspan class=\"k-ans\" data-rv=\"sm\">purity\u003c/span> and thanks, but it can also mean \u003cspan class=\"k-ans\" data-rv=\"sm\">death\u003c/span>. Orange means fall and \u003cspan class=\"k-ans\" data-rv=\"sm\">harvest\u003c/span>, and it also means something \u003cspan class=\"k-ans\" data-rv=\"sm\">holy\u003c/span> in Southeast Asia.\u003c/div>\u003cdiv class=\"k-sk\">흰색은 순수함과 감사의 색이지만, 죽음을 뜻하기도 해요. 주황색은 가을과 수확을 의미하고, 동남아시아에서는 신성함을 뜻하기도 해요.\u003c/div>\u003c/div>","segs":[{"n":113,"text":"이제 오늘 읽은 내용을 쉬운 영어로 짧게 정리해 볼게요. 빈칸에 들어갈 낱말을 생각하면서 따라 읽어 보아요.","hl":null},{"n":114,"text":"White is the color of purity and thanks, but it can also mean death. Orange means fall and harvest, and it also means something holy in Southeast Asia.","hl":"sm","rv":"sm","v":"n"},{"n":115,"text":"흰색은 순수함과 감사의 색이지만, 죽음을 뜻하기도 해요. 주황색은 가을과 수확을 의미하고, 동남아시아에서는 신성함을 뜻하기도 해요.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>White and Orange 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":116,"text":"오늘도 정말 잘했어요! 흰색과 주황색이 나라와 문화마다 다르게 느껴진다는 게 참 신기하죠? 다음 시간에도 재미있는 색깔 이야기로 만나요. 안녕!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
