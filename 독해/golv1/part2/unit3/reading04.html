-2\"><div class=\"lec-stage-head\">03음악적 공간과 정체성 배치</div><ul><li>대중음악의 다양한 요소들은 개인의 정체성을 사회적으로 위치시키는 장소가 된다.</li><li>선호하는 장르, 아티스트, 노래는 정체성이 위치하는 잠재적 장소(places)임</li><li>음악을 통해 타인과의 관계 속에서 자신의 위치를 설정함 (positioned)</li><li>핵심 키워드: 대중음악(popular music)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04정체성을 고정하는 사슬</div><ul><li>음악에 대한 공유된 열정은 개인의 정체성을 안정적으로 유지하는 역할을 한다.</li><li>음악적 연결은 정체성의 일부를 제자리에 붙잡아 두는 사슬(chains)로 작용함</li><li>공유된 음악적 열정을 통해 형성되는 강력한 결속력</li><li>핵심 키워드: 사슬(chains)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05공동체 의식과 정서적 안정</div><ul><li>음악적 유대감은 비슷한 사람들과의 연결을 통해 심리적 안정감을 제공한다.</li><li>유사한 성향을 가진 사람들의 집단이 존재한다는 생각에서 오는 안도감</li><li>공동체(community)라는 느낌이 주는 안전함과 보안 제공</li><li>핵심 키워드: 안전과 보안(safety and security)</li></ul></div></div></div>","<div class=\"lec-section-tag\">단어 정리</div><ul class=\"lec-voca-list\"><li><span class=\"w\">particular</span> <span class=\"m\">특정한</span></li><li><span class=\"w\">significance</span> <span class=\"m\">중요성</span></li><li><span class=\"w\">identity</span> <span class=\"m\">정체성</span></li><li><span class=\"w\">largely</span> <span class=\"m\">주로, 대체로</span></li><li><span class=\"w\">in relation to</span> <span class=\"m\">~와 관련하여</span></li><li><span class=\"w\">argue</span> <span class=\"m\">주장하다</span></li><li><span class=\"w\">function</span> <span class=\"m\">기능하다, 역할을 하다</span></li><li><span class=\"w\">potential</span> <span class=\"m\">잠재적인</span></li><li><span class=\"w\">position</span> <span class=\"m\">배치하다, 위치를 정하다</span></li><li><span class=\"w\">in place</span> <span class=\"m\">제자리에 (고정된)</span></li><li><span class=\"w\">passion</span> <span class=\"m\">열정</span></li><li><span class=\"w\">notion</span> <span class=\"m\">개념, 관념</span></li><li><span class=\"w\">security</span> <span class=\"m\">안보, 안정</span></li></ul>","<div class=\"lec-sent-no\">문장 1 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">음악은 사람들을 연결한다</span><span class=\"en\"><b>Music connects people</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">서로에게</span><span class=\"en\"><b>to one another</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">~을 통해서뿐만 아니라</span><span class=\"en\"><b><span class=\"grammar-hl\">not only through</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">공유된 관심사나 취미</span><span class=\"en\"><b><span class=\"grammar-hl\">a shared interest or hobby,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">~을 통해서도</span><span class=\"en\"><b><span class=\"grammar-hl\">but also through</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">감정적인 연결</span><span class=\"en\"><b><span class=\"grammar-hl\">emotional connections</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">특정한 노래, 공동체, 그리고 예술가에 대한.</span><span class=\"en\"><b>to particular songs, communities, and artists.</b></span></div></div><div class=\"lec-sent-ko\">음악은 공통의 관심사나 취미를 통해서 뿐만 아니라 특정한 노래, 공동체, 그리고 예술가에 대한 감정적 연결을 통해서도 사람들을 서로 연결한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 음악이 사람들 사이의 유대감을 형성하는 두 가지 경로(단순 취미와 깊은 정서적 유대)를 제시하며 글을 시작합니다. 음악이 단순한 즐거움을 넘어 사회적 결합의 매개체가 됨을 시사합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">not only through a shared interest or hobby, but also through emotional connections (관용표현): not only A but also B (A뿐만 아니라 B도) 구조로, 전치사구(through...) 두 개가 병렬 구조로 연결되어 있다.</div><div class=\"lec-gr-item\">shared interest (과거분사(형용사)): shared가 interest를 수식(= &quot;공유된 관심사&quot;)하는 구조이다. interest that is shared에서 주격 관계대명사와 be동사가 축약된 형태로 볼 수 있다.</div></div>\n        <ul class=\"lec-voca-list\"><li><span class=\"w\">particular</span> <span class=\"m\">특정한</span></li></ul>","<div class=\"lec-sent-no\">문장 2 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">타인들의 중요성은</span><span class=\"en\"><b>The significance of others</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신을 찾는 과정에서</span><span class=\"en\"><b>in the search for the self</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">의미가 있다</span><span class=\"en\"><b>is meaningful;</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Agger가</span><span class=\"en\"><b>as Agger,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사회학 교수인 (그가)</span><span class=\"en\"><b>a sociology professor,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">진술하듯이</span><span class=\"en\"><b>states,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">“정체성은 ~이다</span><span class=\"en\"><b>“identities are</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">주로 사회적 산물</span><span class=\"en\"><b>largely social products,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">타인과의 관계에서 형성되는</span><span class=\"en\"><b><span class=\"grammar-hl\">formed in relation to others</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 우리가 생각하기에</span><span class=\"en\"><b>and <span class=\"grammar-hl\">how we think</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 우리를 어떻게 보는지에서.”</span><span class=\"en\"><b><span class=\"grammar-hl\">they view us</span>.”</b></span></div></div><div class=\"lec-sent-ko\">자신을 찾아가는 과정 속에서 다른 사람들의 중요성은 의미가 있다. 사회학 교수인 Agger가 진술하듯이, “정체성은 주로 다른 사람들과의 관계 속에서 그리고 우리 생각에 그들이 우리를 어떻게 보느냐에서 형성되는 사회적 산물이다.”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 &#39;사람들 사이의 연결&#39;이 왜 중요한지를 사회학적 관점에서 뒷받침합니다. 자아 정체성은 혼자 만드는 것이 아니라 타인과의 상호작용 속에서 형성된다는 이론적 근거를 제공합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">formed in relation to others (분사구문): 과거분사 formed가 부사적 기능(부대상황)을 수행하며 주절의 주어인 identities의 상태를 설명한다. 접속사+주어+동사 절로 변환하면 as they(=identities) are formed in relation to others로 쓸 수 있다.</div><div class=\"lec-gr-item\">how we think they view us (간접의문문): 의문사(how) + 주어(we) + 동사(think) 어순의 절이 states의 목적어로 쓰인 하위 구조의 일부다. think와 they view us 사이에는 접속사 that이 생략되어 있다.</div></div>\n        <ul class=\"lec-voca-list\"><li><span class=\"w\">significance</span> <span class=\"m\">중요성</span></li><li><span class=\"w\">largely</span> <span class=\"m\">주로, 대체로</span></li><li><span class=\"w\">in relation to</span> <span class=\"m\">~와 관련하여</span></li></ul>","<div class=\"lec-sent-no\">문장 3 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그리고 Frith는</span><span class=\"en\"><b>And Frith,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사회음악학자인</span><span class=\"en\"><b>a socio-musicologist,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">~라고 주장한다</span><span class=\"en\"><b><span class=\"grammar-hl\">argues that</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">대중음악이</span><span class=\"en\"><b><span class=\"grammar-hl\">popular music</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그러한 연결을 가지고 있다고.</span><span class=\"en\"><b><span class=\"grammar-hl\">has such connections</span>.</b></span></div></div><div class=\"lec-sent-ko\">그리고 사회음악학자인 Frith는 대중음악이 그러한 연결을 가지고 있다고 주장한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급된 일반적인 사회학적 원리(타인을 통한 정체성 형성)를 다시 &#39;음악&#39;이라는 구체적인 영역으로 연결합니다. 음악이 바로 그 &#39;타인과의 관계&#39;를 맺어주는 도구임을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">argues that popular music has such connections 접속사 that: 타동사 argue의 목적어로 쓰이는 명사절을 이끌며, 뒤에는 주어(popular music)와 동사(has)를 갖춘 완전한 문장이 이어진다.</div></div>\n        <ul class=\"lec-voca-list\"><li><span class=\"w\">argue</span> <span class=\"m\">주장하다</span></li></ul>","<div class=\"lec-sent-no\">문장 4 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">음악 팬들에게</span><span class=\"en\"><b>For music fans,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">장르, 예술가, 그리고 노래는</span><span class=\"en\"><b>the genres, artists, and songs</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들이 그 속에서 의미를 찾는</span><span class=\"en\"><b><span class=\"grammar-hl\">in which people find meaning</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">따라서 기능을 한다</span><span class=\"en\"><b>thus, function</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">잠재적인 ‘장소’로서</span><span class=\"en\"><b>as potential “places”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것을 통해</span><span class=\"en\"><b><span class=\"grammar-hl\">through which</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한 개인의 정체성이</span><span class=\"en\"><b><span class=\"grammar-hl\">one’s identity</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">위치할 수 있는</span><span class=\"en\"><b><span class=\"grammar-hl\">can be positioned</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">타인들과의 관계 속에서</span><span class=\"en\"><b>in relation to others:</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들은 사슬로서 역할을 한다</span><span class=\"en\"><b>they act as <span class=\"grammar-hl\">chains</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">붙잡아두는</span><span class=\"en\"><b><span class=\"grammar-hl\">that hold</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">적어도 일부분을</span><span class=\"en\"><b>at least parts of</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한 사람의 정체성을 제자리에.</span><span class=\"en\"><b>one’s identity in place.</b></span></div></div><div class=\"lec-sent-ko\">따라서, 음악 팬들에게, 사람들이 그 속에서 의미를 찾는 장르, 예술가, 그리고 노래는 자신의 정체성이 다른 사람들과 연관되어 자리 잡힐 수 있는 잠재적인 ‘장소’로서 기능을 한다. 말하자면 그것들은 사람들의 정체성의 적어도 일부분을 제자리에 묶어두는 사슬로서 역할을 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 음악이 정체성 형성에 기여하는 구체적인 방식을 설명합니다. 좋아하는 음악은 내가 사회 속에서 어디에 속해 있는지 알려주는 지표가 되며, 흔들릴 수 있는 자아를 붙들어 주는 고정 장치(사슬)가 된다는 논리적 귀결입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">in which people find meaning (관계대명사절): 전치사(in) + 관계대명사(which) + S(people) + V(find) + O(meaning) 구조다. 관계대명사 뒤에는 주어+동사가 갖춰진 완전한 절(완전문장)이 오며 앞의 선행사들을 수식한다.</div><div class=\"lec-gr-item\">through which one’s identity can be positioned (관계대명사절): 전치사(through) + 관계대명사(which) + S(one&#39;s identity) + V(can be positioned) 구조다. 관계대명사 뒤에는 주어+동사가 갖춰진 완전한 절(완전문장)이 온다.</div><div class=\"lec-gr-item\">can be positioned (수동태): be동사(be)+p.p.(positioned) 구조. position은 타동사인데 뒤에 목적어가 없어서 수동구조 can be positioned 형태로 쓴다. 기본구조: V(position) + O(목적어).</div><div class=\"lec-gr-item\">chains that hold (관계대명사): 주격 관계대명사 that이 이끄는 절이 선행사 chains를 수식하며, that은 절 내에서 주어 역할을 수행한다.</div></div>\n        <ul class=\"lec-voca-list\"><li><span class=\"w\">identity</span> <span class=\"m\">정체성</span></li><li><span class=\"w\">in relation to</span> <span class=\"m\">~와 관련하여</span></li><li><span class=\"w\">function</span> <span class=\"m\">기능하다, 역할을 하다</span></li><li><span class=\"w\">potential</span> <span class=\"m\">잠재적인</span></li><li><span class=\"w\">position</span> <span class=\"m\">배치하다, 위치를 정하다</span></li><li><span class=\"w\">in place</span> <span class=\"m\">제자리에 (고정된)</span></li></ul>","<div class=\"lec-sent-no\">문장 5 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">연결은</span><span class=\"en\"><b>The <span class=\"grammar-hl\">connections</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">만들어진</span><span class=\"en\"><b><span class=\"grammar-hl\">made through</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">공유된 음악적 열정을 통해</span><span class=\"en\"><b><span class=\"grammar-hl\">shared musical passions</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">~라는 감각을 제공한다</span><span class=\"en\"><b>provide a sense of</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">안전감과 안정감</span><span class=\"en\"><b>safety and security</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">~라는 생각 안에서</span><span class=\"en\"><b>in the <span class=\"grammar-hl\">notion</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">집단들이 있다는</span><span class=\"en\"><b><span class=\"grammar-hl\">that there are groups</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">비슷한 사람들의</span><span class=\"en\"><b><span class=\"grammar-hl\">of similar people</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">제공해 줄 수 있는</span><span class=\"en\"><b>who can provide</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">공동체라는 느낌을.</span><span class=\"en\"><b>the feeling of a community.</b></span></div></div><div class=\"lec-sent-ko\">공통된 음악적 열정을 통해 만들어진 연결은 공동체라는 느낌을 제공해 줄 수 있는 비슷한 사람들의 집단이 있다는 점에서 안전감과 안정감을 제공한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 최종 결론으로, 음악을 통해 형성된 사회적 유대감이 인간에게 주는 심리적 혜택(안정감과 소속감)을 언급하며 논의를 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">connections made through (과거분사(형용사)): 과거분사구인 made through...가 앞의 명사 connections를 후치 수식(= &quot;~를 통해 만들어진 연결&quot;)하는 구조다. connections that are made의 축약 형태로 볼 수 있다.</div><div class=\"lec-gr-item\">shared musical passions (과거분사(형용사)): shared가 passions를 수식(= &quot;공유된 음악적 열정&quot;)하는 구조이다. passions that are shared의 축약 구조로 볼 수 있다.</div><div class=\"lec-gr-item\">notion that there are groups of similar people 동격의 that: 명사(notion) + that + S + V ... 구조로, 뒤의 완전한 절이 앞 명사인 notion의 구체적인 내용을 설명한다.</div><div class=\"lec-gr-item\">people who can provide (관계대명사): 주격 관계대명사 who가 이끄는 절이 선행사 people을 수식하며, who는 절 내에서 주어 역할을 한다.</div></div>\n        <ul class=\"lec-voca-list\"><li><span class=\"w\">passion</span> <span class=\"m\">열정</span></li><li><span class=\"w\">notion</span> <span class=\"m\">개념, 관념</span></li><li><span class=\"w\">security</span> <span class=\"m\">안보, 안정</span></li></ul>"],"segs":[[{"audio":"audio/reading04_001.mp3","hl":null},{"audio":"audio/reading04_002.mp3","hl":"stage-0"},{"audio":"audio/reading04_003.mp3","hl":"stage-1"},{"audio":"audio/reading04_004.mp3","hl":"stage-2"},{"audio":"audio/reading04_005.mp3","hl":"stage-3"},{"audio":"audio/reading04_006.mp3","hl":"stage-4"}],[{"audio":"audio/reading04_007.mp3","hl":null}],[{"audio":"audio/reading04_008.mp3","hl":"main"},{"audio":"audio/reading04_009.mp3","hl":"meaning"},{"audio":"audio/reading04_010.mp3","hl":"grammar"}],[{"audio":"audio/reading04_011.mp3","hl":"main"},{"audio":"audio/reading04_012.mp3","hl":"meaning"},{"audio":"audio/reading04_013.mp3","hl":"grammar"}],[{"audio":"audio/reading04_014.mp3","hl":"main"},{"audio":"audio/reading04_015.mp3","hl":"meaning"},{"audio":"audio/reading04_016.mp3","hl":"grammar"}],[{"audio":"audio/reading04_017.mp3","hl":"main"},{"audio":"audio/reading04_018.mp3","hl":"meaning"},{"audio":"audio/reading04_019.mp3","hl":"grammar"}],[{"audio":"audio/reading04_020.mp3","hl":"main"},{"audio":"audio/reading04_021.mp3","hl":"meaning"},{"audio":"audio/reading04_022.mp3","hl":"grammar"}]]};var i=0,j=0,playing=false;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}funct
