고기 비가 내린다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 도입부입니다. 평범한 비 상황을 가정하게 하여 독자의 주의를 끕니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It’s raining (현재진행): be동사(is) + 현재분사(raining)가 결합하여 현재 일어나고 있는 동작을 나타냄</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">잠깐,</span><span class=\"en\"><b>Wait,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저건 물이 아니다.</span><span class=\"en\"><b><span class=\"grammar-hl\">that’s</span> not water.</b></span></div></div><div class=\"lec-sent-ko\">잠깐, 저건 물이 아니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> Wait은 사전적으로 &#39;기다리다&#39;이지만, 여기서는 독자의 생각을 멈추게 하고 주의를 환기하는 감탄사적 표현입니다. 뒤에 나올 비정상적인 현상을 강조하기 위해 이 단어를 골랐습니다. 앞 문장의 &#39;비&#39;라는 통념을 반전시키는 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that’s (축약): that is의 줄임말이며, 여기서 that은 앞서 언급된 대상을 가리키는 지시대명사</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 무엇인가?</span><span class=\"en\"><b><span class=\"grammar-hl\">What is it</span>?</b></span></div></div><div class=\"lec-sent-ko\">그것은 무엇인가?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 궁금증을 유발하여 독자가 다음 내용을 계속 읽게 만드는 질문입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">What is it (의문문): be동사가 주어 앞으로 이동하여 의문을 나타내는 기본 의문문 구조</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">물고기들이 떨어지고 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">Fish are falling</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하늘에서</span><span class=\"en\"><b>from the sky!</b></span></div></div><div class=\"lec-sent-ko\">물고기들이 하늘에서 떨어지고 있다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 눈앞의 상황을 설명하는 핵심 문장입니다. 독자가 생각지도 못한 충격적인 사실을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Fish are falling (현재진행): be동사(are) + 현재분사(falling)가 결합하여 현재 벌어지는 현상을 묘사함</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">온두라스에서는,</span><span class=\"en\"><b>In Honduras,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">물고기 비가 내린다</span><span class=\"en\"><b><span class=\"grammar-hl\">it rains</span> fish</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">일 년에 한두 번</span><span class=\"en\"><b>once or twice a year.</b></span></div></div><div class=\"lec-sent-ko\">온두라스에서는, 일 년에 한두 번 물고기 비가 내린다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 물고기 비가 내리는 구체적인 장소와 빈도를 밝히며 앞 문장의 내용을 뒷받침합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">it rains (일반동사): 주어 it(비인칭주어)과 함께 자연현상을 나타내는 기본 문장 구조</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사람들은 보통 그것을 본다</span><span class=\"en\"><b>People <span class=\"grammar-hl\">usually</span> see it</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">5월과 6월 중에</span><span class=\"en\"><b>during May and June.</b></span></div></div><div class=\"lec-sent-ko\">사람들은 보통 5월과 6월 중에 그것을 본다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 현상이 발생하는 구체적인 시기를 언급하며 글의 신뢰도를 높입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">usually (빈도부사): 일반동사 see 앞에 위치하여 동작의 빈도를 나타냄</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">큰 폭풍우 후에,</span><span class=\"en\"><b>After a big rainstorm,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">도로는 물고기들로 가득 찬다.</span><span class=\"en\"><b>the roads <span class=\"grammar-hl\">are full of</span> fish.</b></span></div></div><div class=\"lec-sent-ko\">큰 폭풍우 후에, 도로는 물고기들로 가득 찬다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 물고기 비가 내리는 구체적인 상황을 묘사하여 현상을 시각화합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are full of (관용표현): &#39;~로 가득 찬&#39;이라는 의미의 형용사구 구조</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어디에서</span><span class=\"en\"><b><span class=\"grammar-hl\">Where</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 물고기들은 오는가?</span><span class=\"en\"><b><span class=\"grammar-hl\">do the fish come from</span>?</b></span></div></div><div class=\"lec-sent-ko\">그 물고기들은 어디에서 오는가?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 자연스럽게 원인에 대한 질문으로 넘어가 글의 논리적 흐름을 이어갑니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Where do the fish come from 간접의문문과 유사한 의문문 구조: 의문사(Where) + 조동사(do) + 주어(the fish) + 동사원형(come)의 순서로 구성됨</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">물고기들은 ~이 아니다</span><span class=\"en\"><b>The fish <span class=\"grammar-hl\">are not</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 지역에서 오는 것이</span><span class=\"en\"><b>from the area.</b></span></div></div><div class=\"lec-sent-ko\">물고기들은 그 지역에서 오는 것이 아니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 물고기가 원래 그곳에 살던 것이 아님을 밝혀 궁금증을 더욱 증폭시킵니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are not (부정문): be동사 뒤에 not을 붙여 상태를 부정함</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것들은 올지도 모른다</span><span class=\"en\"><b>They <span class=\"grammar-hl\">might come</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">대서양에서</span><span class=\"en\"><b>from the Atlantic Ocean.</b></span></div></div><div class=\"lec-sent-ko\">그것들은 대서양에서 오는 것일지도 모른다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 현상의 원인에 대한 가설을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">might come (조동사): might를 사용하여 미래나 불확실한 추측을 나타내는 동사구</div></div>\n        ","<div class=\"lec-sent-no\">문장 11 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만,</span><span class=\"en\"><b>However,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 바다는 너무 멀리 떨어져 있다</span><span class=\"en\"><b>the ocean is <span class=\"grammar-hl\">too far away</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">온두라스에서</span><span class=\"en\"><b>from Honduras.</b></span></div></div><div class=\"lec-sent-ko\">하지만, 그 바다는 온두라스에서 너무 멀리 떨어져 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> However를 사용해 앞의 가설(대서양 유래설)을 부정하며 논리적 반전을 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">too far away (부사구): &#39;너무 멀리&#39;라는 의미로 형용사 far를 수식하는 강조 부사 too가 결합된 구조</div></div>\n        ","<div class=\"lec-sent-no\">문장 12 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">과학자들조차</span><span class=\"en\"><b>Even scientists</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것을 설명할 수 없다.</span><span class=\"en\"><b><span class=\"grammar-hl\">can’t explain</span> it.</b></span></div></div><div class=\"lec-sent-ko\">과학자들조차 그것을 설명할 수 없다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 전문가들도 이 현상을 해결하지 못했다는 점을 통해 이 사건이 매우 미스터리함을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">can’t explain (조동사): 부정 조동사 can&#39;t을 사용하여 능력의 부정을 나타냄</div></div>\n        ","<div class=\"lec-sent-no\">문장 13 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그래서,</span><span class=\"en\"><b>So,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">물고기 비의 원인은</span><span class=\"en\"><b>the cause of fish rain</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아직도 미스터리이다.</span><span class=\"en\"><b><span class=\"grammar-hl\">is still a mystery</span>.</b></span></div></div><div class=\"lec-sent-ko\">그래서, 물고기 비의 원인은 아직도 미스터리이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞의 내용들을 종합하여 현재까지 결론이 나지 않았음을 명확히 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is still a mystery (명사보어): be동사 뒤에 명사 mystery가 위치하여 주어의 상태를 설명함</div></div>\n        ","<div class=\"lec-sent-no\">문장 14 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 자연 현상은</span><span class=\"en\"><b>This <span class=\"grammar-hl\">natural event</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또한 일어난다</span><span class=\"en\"><b>also happens</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 다른 나라에서도</span><span class=\"en\"><b>in many other countries.</b></span></div></div><div class=\"lec-sent-ko\">이 자연 현상은 많은 다른 나라에서도 일어난다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 온두라스만의 특수한 사건이 아니라 전 세계적인 현상임을 알려 주제를 확장합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">natural event 형용사 수식: 명사 event를 형용사 natural이 앞에서 수식하는 명사구</div></div>\n        ","<div class=\"lec-sent-no\">문장 15 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">자연은</span><span class=\"en\"><b>Nature</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한다</span><span class=\"en\"><b>does</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이상하고 특별한 일들을 많이</span><span class=\"en\"><b>a lot of <span class=\"grammar-hl\">strange and special things</span>.</b></span></div></div><div class=\"lec-sent-ko\">자연은 이상하고 특별한 일들을 많이 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 개별적인 사건에서 자연 전체의 경이로움으로 시야를 넓히는 일반적인 진술입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">strange and special things 형용사 병렬: 두 형용사 strange와 special이 하나의 명사 things를 동시에 수식함</div></div>\n        ","<div class=\"lec-sent-no\">문장 16 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">자연은</span><span class=\"en\"><b>It</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자주 놀라게 한다</span><span class=\"en\"><b>often <span class=\"grammar-hl\">surprises</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리를</span><span class=\"en\"><b><span class=\"grammar-hl\">us</span>!</b></span></div></div><div class=\"lec-sent-ko\">자연은 자주 우리를 놀라게 한다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 마무리로서, 자연의 미스터리에 대한 인간의 경외심을 드러내며 글을 끝맺습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">surprises us 3인칭 단수: 주어 It에 맞추어 일반동사 surprise에 -s가 붙은 형태</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>온두라스에는 매년 하늘에서 물고기가 떨어지는 기이한 현상이 발생한다.</li><li>과학자들도 이 현상의 명확한 원인을 밝혀내지 못했다.</li><li>이러한 사건은 다른 국가들에서도 드물게 나타난다.</li><li>자연은 때때로 우리가 이해할 수 없는 놀라운 일들을 만들어낸다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Fish rain is a mysterious natural event that happens in Honduras, and it remains unexplained by scientists despite its occurrence in various countries.</div>\n              <div class=\"lec-final-sum-ko\">물고기 비는 온두라스에서 일어나는 신비한 자연 현상이며, 여러 나라에서 발생함에도 불구하고 과학적으로 밝혀지지 않았다.</div></div></div>"],"segs":[[{"audio":"./1_audio/1.mp3","hl":null}],[{"audio":"./1_audio/2.mp3","hl":null}],[{"audio":"./1_audio/3.mp3","hl":"main"},{"audio":"./1_audio/4.mp3","hl":"meanin
