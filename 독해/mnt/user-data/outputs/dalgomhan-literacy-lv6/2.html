상의 뿌리를 찾는 &#39;가계 유전자 검사(Ancestry DNA test)&#39;가 큰 인기를 끌고 있는데, 이는 우리 몸속의 DNA(Deoxyribonucleic acid) 안에 수만 년 전 조상으로부터 물려받은 유전적 정보가 그대로 기록되어 있기 때문이에요. 마치 우리 몸이 하나의 살아있는 역사책(living history book)과 같아서, 과학자들은 특정 유전자 변이를 분석해 우리가 세계 어느 지역에서 온 사람들과 유전적으로 가까운지 추적할 수 있답니다. 마치 퍼즐 조각을 맞추듯 우리의 뿌리를 찾아가는 이 과정은, 잃어버린 가족의 역사를 복원하는 흥미로운 과학적 탐험이라고 할 수 있어요. 이번 지문을 읽기 전에, 생물학적 정보가 단순히 건강 상태를 넘어 우리의 뿌리와 정체성(roots and identity)을 연결해 주는 열쇠가 될 수 있다는 점을 먼저 기억해 주세요!</div></div>","<div class=\"lec-sent-no\">문장 1 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">가족 내력은</span><span class=\"en\"><b><span class=\"grammar-hl\">Family History</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">침 속에 들어 있다!</span><span class=\"en\"><b><span class=\"grammar-hl\">in Your Spit!</span></b></span></div></div><div class=\"lec-sent-ko\">(침 속에 들어 있는 가족 내력!)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 도입부로서, 독자들에게 가족의 뿌리에 대해 질문을 던져 흥미를 유발하고 주제를 자연스럽게 제시하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Family History in Your Spit! (명사구): Family History(가족 역사)라는 명사가 전치사구 in Your Spit(너의 침 속의)의 수식을 받는 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신은 알고 있는가</span><span class=\"en\"><b><span class=\"grammar-hl\">Do you know</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신 가족의 내력을</span><span class=\"en\"><b>your family’s history?</b></span></div></div><div class=\"lec-sent-ko\">당신은 당신 가족의 내력을 알고 있는가?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 도입부로서, 독자들에게 가족의 뿌리에 대해 질문을 던져 흥미를 유발하고 주제를 자연스럽게 제시하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Do you know (대동사): Do는 일반동사 know를 보조하여 의문문을 만드는 역할을 합니다. 일반동사를 부정하거나 의문문으로 만들 때 do, does, did를 사용합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어디</span><span class=\"en\"><b><span class=\"grammar-hl\">Where</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신의 조상은</span><span class=\"en\"><b><span class=\"grammar-hl\">are your ancestors</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">출신인가?</span><span class=\"en\"><b><span class=\"grammar-hl\">from?</span></b></span></div></div><div class=\"lec-sent-ko\">당신의 조상은 어디 출신인가?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 &#39;가족의 역사&#39;를 &#39;조상의 출신지&#39;라는 구체적인 개념으로 연결하여 독자가 스스로 생각해보게 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Where are your ancestors from? 간접의문문(의문사 구문): Where(의문부사)를 활용한 의문문으로, 장소를 묻는 구조입니다. be동사(are)가 주어 앞에 위치한 도치 형태입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">많은 사람들이</span><span class=\"en\"><b>Many people</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모르지만</span><span class=\"en\"><b>don’t know,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것을</span><span class=\"en\"><b>but</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">확인하는 것은 쉽다</span><span class=\"en\"><b><span class=\"grammar-hl\">it’s easy</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">확인하는 것은 쉽다.</span><span class=\"en\"><b><span class=\"grammar-hl\">to check</span>.</b></span></div></div><div class=\"lec-sent-ko\">많은 사람들이 모르지만, 그것을 확인하는 것은 쉽다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 사람들의 일반적인 상태(모름)를 언급한 뒤, 그것을 해결할 수 있는 방법이 간단하다는 점을 강조하여 이어질 내용을 기대하게 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">it’s easy to check (가주어): 진주어: it은 가주어이며, to check(확인하는 것)가 진주어로 문장의 진짜 주어 역할을 합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">받기만 하면 된다</span><span class=\"en\"><b>You just need <span class=\"grammar-hl\">to take</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">침 검사를</span><span class=\"en\"><b>a spit test!</b></span></div></div><div class=\"lec-sent-ko\">침 검사를 받기만 하면 된다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 여기서 spit은 사전적으로 &#39;침(뱉다)&#39;이라는 뜻인데, 여기서는 의학적·과학적 검사를 위해 채취하는 &#39;타액&#39;을 의미합니다. 단순히 침을 뱉는 행위가 아니라 DNA 검사의 핵심 도구임을 강조하기 위해 이 단어를 골랐습니다. 3번 문장에서 언급한 &#39;확인하는 방법&#39;이 무엇인지 구체적으로 밝힙니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to take (to부정사): need라는 동사의 목적어 역할을 하는 명사적 용법입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어떻게</span><span class=\"en\"><b><span class=\"grammar-hl\">How</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">침 검사는</span><span class=\"en\"><b><span class=\"grammar-hl\">does the spit test</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">진행되는가?</span><span class=\"en\"><b><span class=\"grammar-hl\">work?</span></b></span></div></div><div class=\"lec-sent-ko\">침 검사는 어떻게 진행되는가?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자가 가질 수 있는 궁금증을 대신 질문하는 형식을 취해, 독자의 집중력을 유지하며 다음 설명으로 넘어갑니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">How does the spit test work? (간접의문문): 의문사 How를 사용하여 방식(어떻게)을 묻는 구조입니다. 일반동사 work를 위해 조동사 does가 사용되었습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신의 침 안에는</span><span class=\"en\"><b><span class=\"grammar-hl\">Your spit</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">있다</span><span class=\"en\"><b><span class=\"grammar-hl\">has</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신의 DNA가</span><span class=\"en\"><b><span class=\"grammar-hl\">your DNA</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">안에.</span><span class=\"en\"><b><span class=\"grammar-hl\">in it.</span></b></span></div></div><div class=\"lec-sent-ko\">당신의 침 안에는 당신의 DNA가 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 타액 검사의 작동 원리를 설명하는 첫 번째 단계로, 타액 속에 생물학적 정보인 DNA가 포함되어 있음을 알립니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Your spit has your DNA in it. 3형식 구조: 주어(Your spit) + 동사(has) + 목적어(your DNA)로 이루어진 문장입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그리고 당신의 DNA에는</span><span class=\"en\"><b>And your DNA</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">들어 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">contains</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 정보가</span><span class=\"en\"><b>a lot of information</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신에 관한.</span><span class=\"en\"><b>about you.</b></span></div></div><div class=\"lec-sent-ko\">그리고 당신의 DNA에는 당신에 관한 많은 정보가 들어 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 나온 DNA가 단순한 물질이 아니라 &#39;개인에 대한 정보&#39;를 담고 있다는 점을 강조하여, 검사가 왜 의미 있는지 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">contains (일반동사): 주어(your DNA)의 상태를 설명하며 정보를 포함하고 있다는 의미의 타동사입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">과학자들은</span><span class=\"en\"><b>Scientists</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">분석할 수 있다</span><span class=\"en\"><b>can <span class=\"grammar-hl\">analyze</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것을.</span><span class=\"en\"><b>it.</b></span></div></div><div class=\"lec-sent-ko\">과학자들은 그것을 분석할 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 축적된 DNA 정보를 과학적 기술을 통해 해석할 수 있다는 점을 언급하며 검사의 신뢰성을 부여합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">analyze 조동사 구문: can(조동사) + 동사원형(analyze) 구조로, 동작의 가능성을 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은</span><span class=\"en\"><b><span class=\"grammar-hl\">They</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">알아볼 수 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">can see</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신 가족의 내력과 배경을.</span><span class=\"en\"><b>your family’s history and background.</b></span></div></div><div class=\"lec-sent-ko\">그들은 당신 가족의 내력과 배경을 알아볼 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 과학자들이 분석한 결과로 무엇을 알아낼 수 있는지(가족의 역사)를 직접적으로 밝혀 앞서 던진 질문에 대한 답을 완성합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">They can see 조동사 구문: can(조동사) + 동사원형(see) 구조로, 주어(They)가 능력을 가지고 있음을 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 11 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">때때로</span><span class=\"en\"><b>Sometimes</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">결과는</span><span class=\"en\"><b>the results</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">놀랍다.</span><span class=\"en\"><b><span class=\"grammar-hl\">are surprising</span>.</b></span></div></div><div class=\"lec-sent-ko\">때때로 결과는 놀랍다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 단순히 정보를 아는 것을 넘어, 예상치 못한 사실을 발견할 수 있다는 점을 언급하여 호기심을 자극합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are surprising (현재분사): surprising은 형용사처럼 쓰여 결과(results)가 놀라움을 주는 상태임을 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 12 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">한 유명한 한국인이</span><span class=\"en\"><b>A famous Korean person</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">받았다</span><span class=\"en\"><b><span class=\"grammar-hl\">took</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 검사를.</span><span class=\"en\"><b>the test.</b></span></div></div><div class=\"lec-sent-ko\">한 유명한 한국인이 그 검사를 받았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자들에게 익숙한 사례를 제시하여 검사의 실제 효용성을 체감하게 하려는 의도입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">took (과거시제): 일반동사 take의 과거형으로, 이미 완료된 사건을 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 13 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">결과에 따르면,</span><span class=\"en\"><b><span class=\"grammar-hl\">According to</span> the results,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는</span><span class=\"en\"><b>he</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">있다</span><span class=\"en\"><b>has</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">조상들이</span><span class=\"en\"><b>ancestors</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">시베리아 출신의.</span><span class=\"en\"><b>from Siberia!</b></span></div></div><div class=\"lec-sent-ko\">결과에 따르면, 그는 시베리아 출신의 조상들이 있다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 말한 &#39;놀라운 결과&#39;의 구체적인 예시를 들어 독자의 관심을 더욱 높입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">According to (관용표현): ~에 따르면이라는 뜻으로 쓰이는 전치사구입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 14 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">아마</span><span class=\"en\"><b>Maybe</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는</span><span class=\"en\"><b>he</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아직도</span><span class=\"en\"><b><span class=\"grammar-hl\">still</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">있다</span><span class=\"en\"><b>has</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가족이</span><span class=\"en\"><b>family</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그곳에.</span><span class=\"en\"><b>there.</b></span></div></div><div class=\"lec-sent-ko\">아마 그는 아직도 그곳에 가족이 있을지도 모른다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> DNA 분석을 통해 현재의 가족 관계까지 연결될 가능성을 언급하며, 이 검사가 가진 인간적인 의미를 부각합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">still 부사: 상태가 계속 유지됨을 나타내며 동사 has를 수식합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 15 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">멋지지</span><span class=\"en\"><b><span class=\"grammar-hl\">How cool</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">않은가?</span><span class=\"en\"><b><span class=\"grammar-hl\">is that?</span></b></span></div></div><div class=\"lec-sent-ko\">멋지지 않은가?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자의 공감을 유도하는 감탄문으로, 검사에 대한 긍정적인 인상을 심어줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">How cool is that? (도치): 감탄문 형식의 의문문으로, 강조를 위해 형용사(cool)가 앞으로 나가며 &#39;be동사(is) + 주어(that)&#39; 순으로 도치되었습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 16 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">재미있다</span><span class=\"en\"><b><span class=\"grammar-hl\">It’s fun</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">알게 되는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">to learn</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신 가족의 과거에 대해.</span><span class=\"en\"><b>about your family’s past.</b></span></div></div><div class=\"lec-sent-ko\">당신 가족의 과거에 대해 알게 되는 것은 재미있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞의 내용을 요약하며, 가족사를 아는 행위가 유익하고 즐거운 경험임을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It’s fun to learn (가주어): 진주어: it은 가주어이며, to learn(배우는 것)이라는 to부정사구가 진주어 역할을 합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 17 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신은 한번 해 보고 싶은가</span><span class=\"en\"><b>Do you want <span class=\"grammar-hl\">to try</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">침 검사를.</span><span class=\"en\"><b>the spit test?</b></span></div></div><div class=\"lec-sent-ko\">당신은 침 검사를 한번 해 보고 싶은가?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 마지막으로 독자에게 검사를 직접 해볼 것을 권유하며 글을 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to try (to부정사): want라는 동사의 목적어로 쓰인 명사적 용법입니다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>많은 사람이 자신의 가족 역사를 모르지만, 타액(DNA) 검사로 쉽게 확인할 수 있다.</li><li>타액 속 DNA에는 개인의 정보가 담겨 있어, 과학적 분석을 통해 조상의 뿌리까지 찾아낼 수 있다.</li><li>예기치 못한 조상의 출신지를 알게 되는 등 가족사를 배우는 일은 흥미로운 경험이 된다.</li><li>저자는 독자들에게 이 검사를 시도해 볼 것을 권장한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">People can easily discover their family history by analyzing their DNA, and this process often reveals surprising information about their ancestors.</div>\n              <div class=\"lec-final-sum-ko\">사람들은 DNA 분석을 통해 자신의 가족 역사를 쉽게 찾을 수 있으며, 이 과정은 종종 조상에 대한 놀라운 정보를 알려준다.</div></div></div>"],"segs":[[{"audio":"./2_audio/1.mp3","hl":null}],[{"audio":"./2_audio/2.mp3","hl":null}],[{"audio":"./2_audio/3.mp3","hl":"
