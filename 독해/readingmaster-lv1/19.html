<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터1 Reading 19 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터1 Reading 19","audioDir":"19_audio","preview":false,"count":54,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.668em\">Reading\u003cbr>19\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터1\u003c/div>\u003ch1>Elizabeth Catlett: Art That Spoke Against Injustice\u003c/h1>\u003ch2>부당함에 맞서 목소리를 낸 예술, Elizabeth Catlett\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>요약: Elizabeth Catlett은 흑인이라는 이유만으로 대학에서 \u003cb class=\"key\">거부\u003c/b>를 당했지만 Howard 대학교에서 미술을 공부하고 석사 학위를 취득한 뒤, 평생 \u003cb class=\"key\">예술 \u003c/b>\u003cb class=\"key\">창작\u003c/b>을 통해 사회의 \u003cb class=\"key\">부당함\u003c/b>과 그로 인해 고통받는 사람들을 보여 준 인물이다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Throughout her life, Elizabeth Catlett created art that revealed the injustice of society and the people who suffered from it.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 화가 Elizabeth Catlett의 삶을 담은 글이에요. 이 글은 태어난 곳과 가족 배경에서 시작해 교육, 작품 활동, 그리고 말년까지 시간 순서대로 이어집니다. 요약하면 그녀는 차별을 견디고 미술을 공부해 사회의 부당함을 작품으로 보여 준 인물이에요. 요지는 그녀가 평생 예술로 사회의 불공평과 그로 인해 고통받는 사람들을 드러냈다는 것이죠.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">이 지문의 배경에는 20세기 초 미국의 인종 차별과 분리 정책이 자리 잡고 있습니다. 흑인 학생들은 대부분이 백인 학생들인 대학에 지원해도 입학을 거부당하는 일이 흔했고, 그래서 흑인 학생들을 위한 대학(HBCU, Historically Black Colleges and Universities)이 중요한 통로가 되었습니다. Howard 대학교는 그런 대학의 대표적인 예이며, MFA는 미술 분야의 석사 학위를 뜻하는 용어입니다. Catlett은 차별을 피해 멕시코로 삶의 터전을 옮겨 시민권까지 얻었고, 그곳에서도 작품 활동과 수상을 이어 갔습니다. 우리 일상에 비유하면, 실력은 충분한데 조건 하나 때문에 시험 응시 자체가 막힌 상황과 비슷합니다. 그런 \u003cb class=\"key\">차별\u003c/b>의 벽을 돌아 \u003cb class=\"key\">예술\u003c/b>이라는 자기 길을 만든 사람의 이야기로 읽으면 이해가 쉬워집니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 짚어 볼게요. 지문에 나오는 시기는 미국에서 인종 분리가 법과 관습으로 자리 잡았던 때예요. 그래서 흑인 학생들은 대부분이 백인 학생들인 대학에 지원해도 쉽게 받아들여지지 않았죠. 이런 상황에서 흑인 학생들을 위한 대학을 가리켜 HBCU라고 부르는데, Howard 대학교가 대표적인 예예요. MFA는 미술 분야의 석사 학위를 뜻하는 표현이고요. 우리 일상에 비유하면, 실력은 충분한데 조건 하나 때문에 시험 응시 자체가 막힌 상황과 비슷해요. 그런 차별의 벽을 돌아 예술이라는 자기 길을 만든 사람의 이야기라고 생각하면 이해가 쉬울 거예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>출생과 가족 배경\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>이 글은 화가 Elizabeth Catlett의 삶을 시간 순서대로 따라갑니다. 그녀는 1915년 워싱턴 D.C.에서 태어났고, 조부모가 \u003cb class=\"key\">노예\u003c/b>였습니다. 그래서 할머니에게서 노예 이야기를 자주 \u003cb class=\"key\">들었다\u003c/b>는 점이 어린 시절 배경으로 제시됩니다. 이 대목은 훗날 그녀의 작품 세계가 왜 사회 문제로 향했는지 짐작하게 하는 출발점입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>차별과 교육\u003csmall>전환 · 문장 4–7\u003c/small>\u003c/h4>\u003cp>그녀의 삶에는 분명한 장애물이 있었습니다. 대부분이 백인 학생들인 대학이 그녀가 \u003cb class=\"key\">흑인\u003c/b>이라는 이유만으로 그녀를 \u003cb class=\"key\">거부\u003c/b>했습니다. 그러나 그녀는 Instead로 방향을 틀어 흑인 학생들을 위한 대학교인 \u003cb class=\"key\">Howard \u003c/b>\u003cb class=\"key\">대학교\u003c/b>에서 디자인과 그림을 공부했습니다. 이어 Iowa 대학교에서 미술 석사 학위를 취득한 최초의 세 명의 학생들 중 한 명이 되었습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>예술과 사회 메시지\u003csmall>주장 · 문장 8–10\u003c/small>\u003c/h4>\u003cp>평생 동안 그녀는 \u003cb class=\"key\">예술 \u003c/b>\u003cb class=\"key\">창작\u003c/b> 활동을 했습니다. 그녀의 작품은 사회의 부당함, 즉 \u003cb class=\"key\">불공평\u003c/b>을 드러내는 데 집중했습니다. 여기서 injustice를 unfairness로 다시 풀어 말하며 의미를 분명히 합니다. 또한 그 부당함으로 인해 \u003cb class=\"key\">고통받는 \u003c/b>\u003cb class=\"key\">사람들\u003c/b>을 함께 보여 주어, 작품의 시선이 약자를 향했음을 알 수 있습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>수상과 말년\u003csmall>결론 · 문장 11–14\u003c/small>\u003c/h4>\u003cp>그녀의 이런 활동은 많은 \u003cb class=\"key\">수상\u003c/b>으로 이어졌습니다. 그녀는 미국과 멕시코에서 많은 상을 받았고, 멕시코에서 60년 이상을 보냈습니다. 1962년에는 \u003cb class=\"key\">멕시코 \u003c/b>\u003cb class=\"key\">시민\u003c/b>이 되었으며, 2012년 멕시코에 있는 그녀의 집에서 사망했습니다. 마지막 문장까지 이어지는 시간 흐름이 한 인물의 삶을 담담하게 정리합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 네 단계로 나눠서 따라가 볼게요.","hl":null},{"n":4,"text":"첫 단계는 출생과 가족 배경이에요. Elizabeth Catlett은 Washington, D.C.에서 태어났고, 그녀의 조부모는 노예였어요. 그래서 할머니에게서 노예 이야기를 자주 들었다는 점이 소개되죠. 이 배경이 왜 그녀의 작품이 사회 문제를 향하게 되었는지 알려 주는 실마리가 됩니다.","hl":"f0"},{"n":5,"text":"두 번째 단계는 차별과 교육이에요. 대부분이 백인 학생들인 대학이 그녀가 흑인이라는 이유만으로 그녀를 거부했죠. 그런데 여기서 Instead가 나오면서 방향이 바뀌어요. 그녀는 흑인 학생들을 위한 대학교인 Howard 대학교에서 디자인과 그림을 공부했고, Iowa 대학교에서 미술 석사 학위를 취득한 최초의 세 명의 학생들 중 한 명이 되었어요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 예술과 사회 메시지예요. 평생 동안 그녀는 예술 창작 활동을 했어요. 그녀의 작품은 사회의 부당함, 즉 불공평을 보여 주었죠. 그리고 그 부당함으로 인해 고통받는 사람들도 함께 보여 주었어요. 그래서 그녀의 예술은 감상용을 넘어 사회를 향한 목소리였다고 정리할 수 있습니다.","hl":"f2"},{"n":7,"text":"네 번째 단계는 수상과 말년이에요. 그녀는 미국과 멕시코에서 많은 상을 받았고, 멕시코에서 육십 년 이상을 보냈어요. 그리고 천구백육십이 년에 멕시코 시민이 되었고, 이천십이 년에 멕시코에 있는 그녀의 집에서 사망했습니다. 시간 흐름이 마지막까지 흔들림 없이 이어진다는 점을 확인해 주세요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 8번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 태어난 때부터 죽음까지 사건을 시간 순서대로 배열한 \u003cb class=\"key\">시간순\u003c/b> 전개입니다. 그 가운데 8번부터 10번 문장에서 그녀가 만든 예술과 그 메시지를 제시해 글의 중심을 만듭니다. 앞쪽에는 출생과 교육, 뒤쪽에는 수상과 말년이 놓여 있으므로 중심 내용이 가운데 있는 \u003cb class=\"key\">중괄식\u003c/b>으로 볼 수 있습니다. 따라서 주제문은 그녀의 작업 태도를 밝힌 \u003cb class=\"key\">8번 \u003c/b>\u003cb class=\"key\">문장\u003c/b>으로 잡는 것이 자연스럽습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>just because (4)\u003c/b>\u003cspan>이유 강조\u003c/span>\u003cb>Instead (5)\u003c/b>\u003cspan>전환\u003c/span>\u003cb>Throughout her life (8)\u003c/b>\u003cspan>시간 범위 제시\u003c/span>\u003cb>also (10)\u003c/b>\u003cspan>내용 첨가\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">injustice\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">unfairness\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the people who suffered from it\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>대부분이 백인 학생들인 대학\u003c/th>\u003cth>Howard 대학교\u003c/th>\u003c/tr>\u003ctr>\u003ctd>흑인이라는 이유만으로 Catlett을 거부\u003c/td>\u003ctd>흑인 학생들을 위한 대학교로 진학 허용\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"전개 방식을 정리해 볼게요. 이 글은 사건을 시간 순서대로 배열한 시간순 전개예요. 중심이 되는 내용은 그녀가 만든 예술과 그 메시지를 다룬 가운데 부분이고, 앞에는 출생과 교육, 뒤에는 수상과 말년이 놓여 있어요. 그래서 중심 내용이 가운데 있는 중괄식으로 보는 게 자연스럽고, 주제문은 여덟 번째 문장으로 잡으면 됩니다.","hl":"ty"},{"n":9,"text":"신호어도 꼭 챙겨야 해요. 먼저 눈여겨볼 것은 Instead인데, 앞의 거부와 뒤의 진학을 갈라 주는 전환이죠. just because는 이유만으로 차별이 이루어졌다는 점을 강조하고요. Throughout her life는 그녀의 작업이 평생 이어졌다는 시간 범위를 알려 줍니다. 그리고 injustice를 unfairness로 다시 풀어 말한 재진술을 발견하면 의미가 강화된다는 것도 기억해 두세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>be born\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>태어나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>grandparent\u003c/b>\u003cem>명사\u003c/em>\u003cspan>조부모\u003c/span>\u003c/div>\u003cdiv>\u003cb>slave\u003c/b>\u003cem>명사\u003c/em>\u003cspan>노예\u003c/span>\u003c/div>\u003cdiv>\u003cb>hear\u003c/b>\u003cem>동사\u003c/em>\u003cspan>듣다\u003c/span>\u003c/div>\u003cdiv>\u003cb>story\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이야기\u003c/span>\u003c/div>\u003cdiv>\u003cb>mostly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>대부분, 주로\u003c/span>\u003c/div>\u003cdiv>\u003cb>turn down\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>거절하다, 거부하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>just because\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>단지 ~라는 이유만으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>instead\u003c/b>\u003cem>부사\u003c/em>\u003cspan>대신에\u003c/span>\u003c/div>\u003cdiv>\u003cb>design\u003c/b>\u003cem>명사\u003c/em>\u003cspan>디자인\u003c/span>\u003c/div>\u003cdiv>\u003cb>drawing\u003c/b>\u003cem>명사\u003c/em>\u003cspan>그림, 소묘\u003c/span>\u003c/div>\u003cdiv>\u003cb>university\u003c/b>\u003cem>명사\u003c/em>\u003cspan>대학교\u003c/span>\u003c/div>\u003cdiv>\u003cb>earn\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(학위를) 따다, 얻다\u003c/span>\u003c/div>\u003cdiv>\u003cb>master's degree\u003c/b>\u003cem>명사\u003c/em>\u003cspan>석사 학위\u003c/span>\u003c/div>\u003cdiv>\u003cb>fine arts\u003c/b>\u003cem>명사\u003c/em>\u003cspan>미술, 순수 예술\u003c/span>\u003c/div>\u003cdiv>\u003cb>one of the first\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>최초의 ~ 중 하나\u003c/span>\u003c/div>\u003cdiv>\u003cb>throughout\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~동안 내내\u003c/span>\u003c/div>\u003cdiv>\u003cb>create\u003c/b>\u003cem>동사\u003c/em>\u003cspan>창작하다, 창조하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>injustice\u003c/b>\u003cem>명사\u003c/em>\u003cspan>부당함\u003c/span>\u003c/div>\u003cdiv>\u003cb>unfairness\u003c/b>\u003cem>명사\u003c/em>\u003cspan>불공평\u003c/span>\u003c/div>\u003cdiv>\u003cb>society\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사회\u003c/span>\u003c/div>\u003cdiv>\u003cb>suffer from\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 고통받다\u003c/span>\u003c/div>\u003cdiv>\u003cb>receive\u003c/b>\u003cem>동사\u003c/em>\u003cspan>받다\u003c/span>\u003c/div>\u003cdiv>\u003cb>prize\u003c/b>\u003cem>명사\u003c/em>\u003cspan>상\u003c/span>\u003c/div>\u003cdiv>\u003cb>spend\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(시간을) 보내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>citizen\u003c/b>\u003cem>명사\u003c/em>\u003cspan>시민\u003c/span>\u003c/div>\u003cdiv>\u003cb>die\u003c/b>\u003cem>동사\u003c/em>\u003cspan>죽다, 사망하다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"단어는 나온 순서대로 정리해 볼게요. turn down은 지원자를 거부한다는 뜻이고, earn a degree는 학위를 취득하다는 표현이에요. injustice는 부당함, unfairness는 불공평, suffer from은 고통받다로 묶어서 외워 두면 좋아요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">turn down\u003c/b>\u003cspan class=\"m\">거절하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">refuse\u003c/span>\u003cspan class=\"s\">decline\u003c/span>\u003cspan class=\"s\">reject\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">accept\u003c/span>\u003cspan class=\"a\">approve\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">earn\u003c/b>\u003cspan class=\"m\">(학위를) 따다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">gain\u003c/span>\u003cspan class=\"s\">obtain\u003c/span>\u003cspan class=\"s\">acquire\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">lose\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">injustice\u003c/b>\u003cspan class=\"m\">부당함\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">unfairness\u003c/span>\u003cspan class=\"s\">inequality\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">justice\u003c/span>\u003cspan class=\"a\">fairness\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">suffer\u003c/b>\u003cspan class=\"m\">고통받다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">endure\u003c/span>\u003cspan class=\"s\">undergo\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">enjoy\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">receive\u003c/b>\u003cspan class=\"m\">받다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">get\u003c/span>\u003cspan class=\"s\">obtain\u003c/span>\u003cspan class=\"s\">accept\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">give\u003c/span>\u003cspan class=\"a\">send\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">create\u003c/b>\u003cspan class=\"m\">창작하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">make\u003c/span>\u003cspan class=\"s\">produce\u003c/span>\u003cspan class=\"s\">generate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">destroy\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">throughout\u003c/b>\u003cspan class=\"m\">~동안 내내\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">during\u003c/span>\u003cspan class=\"s\">all through\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 정리해 볼게요. turn down은 refuse, decline과 가깝고 반대말은 accept, approve예요. earn은 gain, obtain으로 바꿔 쓸 수 있고 receive는 get, accept와 통합니다. injustice는 unfairness, inequality와 같은 편이고 반대말은 justice, fairness죠. suffer는 endure, undergo와 가깝고 반대 방향은 enjoy로 기억하면 됩니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">엘리자베스 캐틀렛은\u003c/span>\u003cspan class=\"en\">Elizabeth Catlett\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">태어났다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">born\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">워싱턴 D.C.에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">Washington, \u003c/span>\u003cspan class=\"tgt\">D.C.\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1915년에\u003c/span>\u003cspan class=\"en\">in 1915.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Elizabeth Catlett은 1915년 워싱턴 D.C.에서 태어났다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 인물 소개의 \u003cb class=\"key\">도입 \u003c/b>\u003cb class=\"key\">문장\u003c/b>으로, 누가 언제 어디서 태어났는지를 한 번에 제시합니다. 'was born'은 '태어나다'라는 뜻으로 굳어진 \u003cb class=\"key\">수동태\u003c/b> 표현이에요. 뒤에 오는 두 전치사구가 각각 \u003cb class=\"key\">장소와 \u003c/b>\u003cb class=\"key\">시간\u003c/b>을 알려 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태(be + 과거분사)\u003c/span> : [[주어]] + be동사 + [[과거분사]] : \"태어났다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 in + 명사(장소·시간)\u003c/span> : in + [[명사]] → 장소나 시간을 나타내는 전치사구 : \"워싱턴 D.C.에서\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Elizabeth Catlett, 엘리자베스 캐틀렛은. was born, 태어났다. in Washington, D.C, 워싱턴 D.C.에서. in 1915, 1915년에. 이 문장 전체를 해석하면, Elizabeth Catlett은 1915년 워싱턴 D.C.에서 태어났다.","hl":"m"},{"n":13,"text":"이 문장은 인물 소개의 도입 문장이에요. 누가 언제 어디서 태어났는지를 한 번에 제시해 주죠. was born은 태어나다는 뜻의 수동태 표현이고, 뒤에 오는 전치사구가 장소와 시간을 차례로 알려 줍니다.","hl":"mn"},{"n":14,"text":"첫 번째 포인트는 수동태예요. be동사에 과거분사 born이 붙어서 태어나다는 의미가 되죠. 두 번째 포인트는 전치사 in이에요. in Washington, D.C.는 장소와 시간 중에서 장소를, in nineteen fifteen은 시간을 나타내요. 그래서 같은 in이라도 뒤에 오는 말에 따라 해석이 달라진다는 걸 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀의 조부모는\u003c/span>\u003cspan class=\"en\">Her grandparents\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">노예였다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">slaves\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀의 조부모는 노예였다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 그녀 가족의 과거를 알려 주는 문장으로, 조부모가 \u003cb class=\"key\">노예\u003c/b>였음을 밝힙니다. 이 사실이 다음 문장에서 할머니에게 노예 이야기를 들었다는 내용의 \u003cb class=\"key\">배경\u003c/b>이 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">2형식 동사 + 주격보어\u003c/span> : [[주어]] + be동사 + [[명사(주격보어)]] : \"노예였다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Her grandparents, 그녀의 조부모는. were slaves, 노예였다. 이 문장 전체를 해석하면, 그녀의 조부모는 노예였다.","hl":"m"},{"n":16,"text":"이 문장은 그녀 가족의 과거를 알려 주는 문장이에요. 조부모가 노예였다는 사실이 다음 문장에서 할머니에게 노예 이야기를 들었다는 내용의 배경이 되죠.","hl":"mn"},{"n":17,"text":"be동사 뒤에 slaves가 와서 주어인 Her grandparents의 신분을 설명하는 주격보어 역할을 해요. 그리고 주어가 복수니까 보어도 복수 형태인 slaves로 수 일치를 맞춘 것도 함께 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서\u003c/span>\u003cspan class=\"en\">So\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 자주 들었다\u003c/span>\u003cspan class=\"en\">she \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">often \u003c/span>\u003cspan class=\"tgt\">heard\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">노예들에 관한 이야기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">stories \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">slaves\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀의 할머니로부터\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">her \u003c/span>\u003cspan class=\"tgt\">grandmother\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그래서 그녀는 할머니에게서 노예 이야기를 자주 들었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 조부모가 노예였다는 \u003cb class=\"key\">배경\u003c/b>을 So로 이어 받아, 할머니에게서 노예 이야기를 자주 들었다고 말합니다. 과거의 반복된 일이라 \u003cb class=\"key\">과거시제\u003c/b> heard를 썼고, often이 그 반복을 강조해요. 어린 시절의 경험이 훗날 그녀의 작품 세계로 이어지는 흐름을 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">빈도부사의 위치\u003c/span> : [[주어]] + 빈도부사 + [[일반동사]] : \"자주 들었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 수식\u003c/span> : [[명사]] + of + 명사 → 앞의 명사를 뒤에서 수식 : \"노예들에 관한 이야기\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 from의 출처 표현\u003c/span> : from + [[사람·장소]] → 출처를 나타내는 부사구 : \"그녀의 할머니로부터\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"So, 그래서. she often heard, 그녀는 자주 들었다. the stories of slaves, 노예들에 관한 이야기를. from her grandmother, 그녀의 할머니로부터. 이 문장 전체를 해석하면, 그래서 그녀는 할머니에게서 노예 이야기를 자주 들었다.","hl":"m"},{"n":19,"text":"앞 문장에서 조부모가 노예였다는 배경을 So로 이어 받아서, 그래서 할머니에게서 노예 이야기를 자주 들었다고 말하는 문장이에요. 과거에 반복된 일이라 과거시제 heard를 썼고 often이 그 반복을 강조하죠.","hl":"mn"},{"n":20,"text":"첫 번째 포인트는 빈도부사의 위치예요. often은 일반동사 heard 앞에 놓여서 반복의 의미를 더해 줍니다. 두 번째 포인트는 전치사구의 형용사적 수식이에요. the stories of slaves에서 of slaves가 앞의 명사를 뒤에서 꾸며 주는 형용사구 역할을 하죠. 세 번째 포인트는 전치사 from이에요. from her grandmother는 정보의 출처를 알려 주는 부사구로, 어디서 이야기를 들었는지를 밝혀 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대부분이 백인 학생들인 한 대학은\u003c/span>\u003cspan class=\"en\">A mostly white college\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Catlett을 거부했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">turned \u003c/span>\u003cspan class=\"tgt\">Catlett \u003c/span>\u003cspan class=\"tgt\">down\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단지 ~라는 이유만으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">just \u003c/span>\u003cspan class=\"tgt\">because \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀가 흑인이었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">she \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">black\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">대부분이 백인 학생들인 한 대학은 그녀가 흑인이라는 이유만으로 Catlett을 거부했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Catlett이 흑인이라는 이유 하나만으로 대학에서 거절당한 사건을 담은 문장이에요. turned down이 '거부하다'로 굳어져 쓰였고, 뒤의 because절이 그 \u003cb class=\"key\">이유\u003c/b>를 정확히 밝혀 주죠. just가 붙어 '단지 그 이유만으로'라는 뉘앙스가 생기면서 \u003cb class=\"key\">차별\u003c/b>의 부당함이 더 또렷해져요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">구동사(phrasal verb)와 목적어 위치\u003c/span> : turn + [목적어] + down / turn down + [목적어] (대명사면 turn + it + down) : \"Catlett을 거부했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이유를 나타내는 부사절 접속사 because\u003c/span> : just because + [주어] + [동사] ~ (이유 부사절) : \"단지 그녀가 흑인이었기 때문에\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"A mostly white college, 대부분이 백인 학생들인 한 대학은. turned Catlett down, Catlett을 거부했다. just because, 단지 ~라는 이유만으로. she was black, 그녀가 흑인이었다. 이 문장 전체를 해석하면, 대부분이 백인 학생들인 한 대학은 그녀가 흑인이라는 이유만으로 Catlett을 거부했다.","hl":"m"},{"n":22,"text":"이 문장은 Catlett이 흑인이라는 이유 하나만으로 대학에서 거절당한 사건을 담고 있어요. turned down이 '거부하다'라는 뜻으로 묶여 쓰였고, 뒤의 because절이 그 이유를 정확히 알려 주죠. just가 붙으면서 '단지 그 이유만으로'라는 뉘앙스가 생기니까 부당한 차별이라는 점을 꼭 기억해 두세요.","hl":"mn"},{"n":23,"text":"먼저 turn down을 보세요. 동사와 부사가 굳어져 '거부하다'가 된 구동사예요. 목적어가 Catlett처럼 명사면 down 앞뒤 어디에나 올 수 있지만, 대명사일 때는 반드시 목적어를 가운데 넣어서 turned her down처럼 써야 한다는 게 시험 포인트죠. 그리고 just because는 이유를 이끄는 접속사 because 앞에 just가 붙어서 '단지 그 이유만으로'라는 강조를 만들어요. because 뒤에는 주어와 동사가 다 있는 완전한 절이 온다는 것도 함께 기억해 주세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대신에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Instead,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Catlett은 디자인과 그림을 공부했다\u003c/span>\u003cspan class=\"en\">Catlett \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">studied \u003c/span>\u003cspan class=\"tgt\">design \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">drawing\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Howard 대학교에서\u003c/span>\u003cspan class=\"en\">at Howard University,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">흑인 학생들을 위한 대학교인\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">university \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">black \u003c/span>\u003cspan class=\"tgt\">students\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">대신에 Catlett은 흑인 학생들을 위한 대학교인 Howard 대학교에서 디자인과 그림을 공부했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 백인 중심 대학에 거절당했죠. 그 대신 Catlett이 택한 길이 Howard 대학교에서 디자인과 그림을 공부한 거예요. 콤마 뒤의 a university for black students가 그 학교가 어떤 곳인지 덧붙여 설명하면서 선택의 배경까지 알려 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속부사 Instead의 문장 연결 기능\u003c/span> : Instead, + [주어] + [동사] ~ (앞 문장과 반대되는 대안 제시) : \"대신에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 and의 병렬 구조\u003c/span> : studied + [design] and [drawing] : \"디자인과 그림을 공부했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">콤마로 이어진 명사구의 동격\u003c/span> : [명사], [앞 명사를 부연 설명하는 명사구] : \"흑인 학생들을 위한 대학교인\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Instead, 대신에. Catlett studied design and drawing, Catlett은 디자인과 그림을 공부했다. at Howard University, Howard 대학교에서. a university for black students, 흑인 학생들을 위한 대학교인. 이 문장 전체를 해석하면, 대신에 Catlett은 흑인 학생들을 위한 대학교인 Howard 대학교에서 디자인과 그림을 공부했다.","hl":"m"},{"n":25,"text":"앞 문장에서 백인 중심 대학에 거절당했어요. 그 대신 Catlett이 선택한 길이 Howard 대학교에서 디자인과 그림을 공부한 거예요. 뒤에 붙은 a university for black students가 그 학교가 어떤 곳인지 설명해 주면서, 왜 그 학교를 택했는지도 자연스럽게 알려 줘요.","hl":"mn"},{"n":26,"text":"먼저 문장 맨 앞의 Instead를 보세요. 앞 문장과 반대되는 대안을 제시하는 접속부사라서 문장 전체를 이어 주는 역할만 하고, 주어나 목적어 같은 문장 성분이 되지는 않아요. 다음으로 studied 뒤의 design and drawing은 and로 대등하게 묶인 병렬 구조라서 두 명사가 함께 목적어 역할을 해요. 마지막으로 콤마 뒤의 a university for black students는 앞에 있는 Howard University를 그대로 다시 설명해 주는 동격이에요. 같은 대상을 가리키니까 콤마로 살짝 끊어서 붙여 주는 거랍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 땄다\u003c/span>\u003cspan class=\"en\">She \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">earned\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미술 석사 학위를, MFA라고 하는\u003c/span>\u003cspan class=\"en\">a master's degree \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">fine \u003c/span>\u003cspan class=\"tgt\">arts\u003c/span> (MFA)\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Iowa 대학교에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">University \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">Iowa\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 Iowa 대학교에서 미술 석사 학위를 받았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Catlett이 Iowa 대학교에서 미술 석사 학위를 땄다는 이력을 알려 주는 문장이에요. 앞에서 디자인과 그림을 공부했다는 흐름을 이어 받아, 그 공부가 정식 \u003cb class=\"key\">학위\u003c/b>로 이어졌음을 보여 주죠. 괄호 안의 MFA가 미술 석사라는 것을 분명히 해 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">목적어 하나를 갖는 완전타동사\u003c/span> : earn + [목적어] (사람을 간접목적어로 쓰지 않음) : \"(학위를) 땄다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">분야를 나타내는 전치사 in\u003c/span> : a degree in + [학문 분야] : \"미술 분야의\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">장소·기관을 나타내는 전치사 at\u003c/span> : at + the University of + [지명] : \"Iowa 대학교에서\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"She earned, 그녀는 땄다. a master's degree in fine arts (MFA), 미술 석사 학위를, MFA라고 하는. at the University of Iowa, Iowa 대학교에서. 이 문장 전체를 해석하면, 그녀는 Iowa 대학교에서 미술 석사 학위를 받았다.","hl":"m"},{"n":28,"text":"이 문장은 Catlett이 Iowa 대학교에서 미술 석사 학위를 땄다는 이력을 알려 줘요. 앞에서 디자인과 그림을 공부했다는 흐름을 이어 받아서, 그 공부가 정식 학위로 이어졌다는 걸 보여 주죠. 괄호 안에 MFA라는 약어까지 있으니 미술 분야 석사라는 점이 더 분명해져요.","hl":"mn"},{"n":29,"text":"먼저 earned를 보세요. '학위를 따다'라는 뜻의 타동사라서 뒤에 a master's degree가 바로 목적어로 와요. 목적어를 하나만 갖는 동사라는 점이 핵심이에요. 그다음 학위 이름 뒤에 붙은 in은 어떤 분야의 학위인지를 밝혀 주는 전치사예요. 우리말로는 '미술의 석사'처럼 소유 관계로 이해하면 자연스럽고요. 마지막 at은 학교라는 장소를 나타내는 전치사로 쓰였고, of는 Iowa라는 이름을 대학교에 연결해 주는 역할을 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 ~이 되었다\u003c/span>\u003cspan class=\"en\">She \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">became \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">최초의 세 명의 학생들 중 한 명\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">first \u003c/span>\u003cspan class=\"tgt\">three \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">students \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미술 석사 학위를 취득한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">earn \u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">MFA\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 대학교에서\u003c/span>\u003cspan class=\"en\">at the university.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 그 대학교에서 미술 석사 학위를 취득한 최초의 세 명의 학생들 중 한 명이 되었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Catlett이 그 대학교에서 \u003cb class=\"key\">최초\u003c/b>로 미술 석사 학위를 받은 사람 중 하나였음을 알려 주는 문장이에요. one of the first three students는 '\u003cb class=\"key\">최초의 \u003c/b>\u003cb class=\"key\">세 \u003c/b>\u003cb class=\"key\">명\u003c/b> 중 한 명'이라는 뜻이고, to earn an MFA는 그 students를 뒤에서 꾸며 주는 \u003cb class=\"key\">to부정사\u003c/b> 표현이에요. 앞 문장의 학위 이야기를 마무리하면서, 이어지는 평생 예술 활동으로 넘어가는 \u003cb class=\"key\">성취\u003c/b> 정보 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">2형식 동사(become) + 주격 보어\u003c/span> : become + [명사구 보어] : \"최초의 세 명의 학생들 중 한 명이 되었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">one of the + 서수/최상급 + 복수명사\u003c/span> : one of the [first + 복수명사] : \"최초의 세 명의 학생들 중 한 명\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : [명사] + [to + 동사원형] : \"미술 석사 학위를 취득한 학생들\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"She became, 그녀는 ~이 되었다. one of the first three students, 최초의 세 명의 학생들 중 한 명. to earn an MFA, 미술 석사 학위를 취득한. at the university, 그 대학교에서. 이 문장 전체를 해석하면, 그녀는 그 대학교에서 미술 석사 학위를 취득한 최초의 세 명의 학생들 중 한 명이 되었다.","hl":"m"},{"n":31,"text":"여기서 꼭 잡아야 하는 건 최초라는 표현이에요. 앞에서 아이오와 대학교에서 석사 과정을 밟았다고 했죠. 그 대학교에서 미술 석사 학위를 받은 최초의 세 명, 그중 한 명이었다는 뜻이에요. 최초의 세 명 중 한 명으로 정확히 해석해 주시고, 이 문장이 뒤에 나오는 평생의 예술 활동으로 넘어가는 성취 정보라는 점도 기억해 두세요.","hl":"mn"},{"n":32,"text":"어법은 세 군데만 짚을게요. 첫 번째, one of the first three students에서 one of 뒤에는 반드시 복수명사가 와요. 그래서 students가 복수로 쓰인 거죠. 두 번째, students to earn an MFA에서 to earn은 앞의 students를 뒤에서 꾸며 주는 to부정사의 형용사적 용법이에요. 취득한 학생들, 이렇게 해석하면 자연스럽죠. 세 번째, became은 2형식 동사라서 뒤에 주격 보어가 필요해요. 여기서는 one of the first three students가 통째로 보어 역할을 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">평생 동안\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Throughout \u003c/span>\u003cspan class=\"tgt\">her \u003c/span>\u003cspan class=\"tgt\">life\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 예술 창작 활동을 했다\u003c/span>\u003cspan class=\"en\">she \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">created \u003c/span>\u003cspan class=\"tgt\">art\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">평생 동안 그녀는 예술 창작 활동을 했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 그녀의 일생 전체를 한 줄로 묶어 주는 \u003cb class=\"key\">연결 \u003c/b>\u003cb class=\"key\">문장\u003c/b>이에요. 앞에서 학교와 학위 이야기가 끝나고, 이제 예술가로서의 삶으로 화제가 넘어가는 신호입니다. Throughout her life가 뒤에 나올 작품 세계 설명의 \u003cb class=\"key\">시간적 \u003c/b>\u003cb class=\"key\">배경\u003c/b>을 깔아 주고, 다음 문장부터 작품의 내용이 구체적으로 제시돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 용법\u003c/span> : Throughout + [명사], 주어 + 동사 : \"평생 동안\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">불가산명사의 무관사 용법\u003c/span> : create + [art (불가산명사)] : \"예술 창작 활동을 했다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"Throughout her life, 평생 동안. she created art, 그녀는 예술 창작 활동을 했다. 이 문장 전체를 해석하면, 평생 동안 그녀는 예술 창작 활동을 했다.","hl":"m"},{"n":34,"text":"이 문장은 그녀의 일생 전체를 한 줄로 요약하는 연결 문장이에요. 앞에서 학교 이야기가 끝나고, 이제 예술가로서의 삶으로 넘어가는 신호예요. Throughout her life는 평생 내내라는 뜻으로, 뒤에 나오는 작품 세계 설명의 시간적 배경을 깔아 줍니다.","hl":"mn"},{"n":35,"text":"첫 번째, Throughout her life에서 throughout는 ~내내라는 뜻의 전치사예요. 전치사구가 문장 앞에 와서 시간을 알려 주는 부사구 역할을 하죠. 두 번째, created art에서 art는 불가산명사라서 관사 없이 그냥 씁니다. 작품 하나하나가 아니라 예술 창작이라는 활동 전체를 가리키는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예술에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">In \u003c/span>\u003cspan class=\"tgt\">her \u003c/span>\u003cspan class=\"tgt\">art\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 보여 주었다\u003c/span>\u003cspan class=\"en\">she showed\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">부당함이나 불공평을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">injustice \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">unfairness \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사회의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">society\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">예술에서 그녀는 사회의 부당함이나 불공평을 보여 주었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 지문의 주제를 가장 잘 담고 있는 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">문장\u003c/b>이에요. 그녀의 작품이 사회의 부당함, 즉 injustice와 unfairness를 드러냈다는 뜻입니다. 뜻이 비슷한 두 단어를 or로 이어 \u003cb class=\"key\">의미 \u003c/b>\u003cb class=\"key\">강조\u003c/b>를 했고, 바로 다음 문장에서 그 부당함으로 고통받는 사람들까지 그렸다는 내용으로 이어져요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 문두 강조 어순\u003c/span> : In + [명사], 주어 + 동사 : \"예술에서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">A or B 병렬(동의어 연결)\u003c/span> : the [명사 A] or [명사 B] of [명사] : \"사회의 부당함이나 불공평\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"In her art, 예술에서. she showed, 그녀는 보여 주었다. the injustice or unfairness, 부당함이나 불공평을. of society, 사회의. 이 문장 전체를 해석하면, 예술에서 그녀는 사회의 부당함이나 불공평을 보여 주었다.","hl":"m"},{"n":37,"text":"이 문장이 이 지문의 주제를 가장 잘 담고 있어요. 그녀의 작품이 사회의 부당함, 그러니까 injustice와 unfairness를 드러냈다는 거죠. 뜻이 비슷한 두 단어를 나란히 쓴 건 같은 의미를 반복해서 강조하려는 의도예요. 그리고 바로 다음 문장에서 그 부당함으로 고통받는 사람들까지 보여 줬다는 내용으로 이어집니다.","hl":"mn"},{"n":38,"text":"첫 번째, In her art라는 전치사구가 문장 앞에 나와서 무대를 먼저 깔아 줍니다. 예술이라는 공간 안에서 무슨 일이 있었는지를 강조하는 문두 강조 어순이에요. 두 번째, the injustice or unfairness of society에서 injustice와 unfairness는 뜻이 비슷한 동의어를 or로 병렬 연결한 표현이에요. 그래서 부당함이나 불공평이라고 묶어서 해석하면 됩니다. of society는 두 명사를 함께 꾸며 주는 거고요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 또한 보여 주었다\u003c/span>\u003cspan class=\"en\">She also showed\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들을\u003c/span>\u003cspan class=\"en\">the people\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그로 인해 고통받는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">suffered \u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 또한 그로 인해 고통받는 사람들도 보여 주었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 그녀가 사회의 \u003cb class=\"key\">부당함\u003c/b>을 작품에 담았다고 했죠. 이 문장은 그 부당함 때문에 \u003cb class=\"key\">고통받는 \u003c/b>\u003cb class=\"key\">사람들\u003c/b>까지 함께 보여 주었다는 뜻이에요. 여기서 \u003cb class=\"key\">it\u003c/b>은 바로 앞의 the injustice를 가리키는 지시어라서 '그로 인해'로 해석합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 who\u003c/span> : [선행사 the people] + [who + 동사(suffered) ~] : \"그로 인해 고통받는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">자동사 suffer + 전치사 from\u003c/span> : suffer [자동사] + from + [고통의 원인] : \"그로 인해 고통받다\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"She also showed, 그녀는 또한 보여 주었다. the people, 사람들을. who suffered from it, 그로 인해 고통받는. 이 문장 전체를 해석하면, 그녀는 또한 그로 인해 고통받는 사람들도 보여 주었다.","hl":"m"},{"n":40,"text":"앞에서 사회의 부당함을 보여 주었다고 했죠. 이 문장은 그 부당함 때문에 고통받는 사람들까지 함께 담았다는 뜻이에요. 여기서 it은 앞 문장의 부당함, 즉 injustice를 가리키는 지시어예요.","hl":"mn"},{"n":41,"text":"먼저 who는 the people을 꾸며 주는 관계대명사예요. who 뒤에 동사 suffered가 바로 오니까 주격으로 쓰인 거죠. 그리고 suffer는 자동사라서 from을 붙여 원인을 나타내요. 그래서 수동태가 아니라 고통받는다는 능동의 의미가 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 받았다\u003c/span>\u003cspan class=\"en\">She \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">received \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 상을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">many \u003c/span>\u003cspan class=\"tgt\">prizes\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미국에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">United \u003c/span>\u003cspan class=\"tgt\">States \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 멕시코에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">Mexico\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 미국과 멕시코에서 많은 상을 받았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 그녀가 사회의 부당함과 고통받는 사람들을 작품에 담았다고 했죠. 이 문장은 그런 작품 활동의 결과로 \u003cb class=\"key\">많은 \u003c/b>\u003cb class=\"key\">상\u003c/b>을 받았다는 사실을 덧붙여요. 미국과 멕시코 두 나라에서 인정받았다는 점이 \u003cb class=\"key\">활동 \u003c/b>\u003cb class=\"key\">범위\u003c/b>를 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">3형식 타동사 receive\u003c/span> : [주어] + receive + [목적어(many prizes)] : \"많은 상을 받았다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 목적어의 병렬 구조\u003c/span> : in + [the United States] and [Mexico] : \"미국과 멕시코에서\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"She received, 그녀는 받았다. many prizes, 많은 상을. in the United States, 미국에서. and Mexico, 그리고 멕시코에서. 이 문장 전체를 해석하면, 그녀는 미국과 멕시코에서 많은 상을 받았다.","hl":"m"},{"n":43,"text":"앞에서 그녀가 사회의 부당함과 고통받는 사람들을 작품에 담았다고 했죠. 이 문장은 그런 활동의 결과로 많은 상을 받았다는 사실을 덧붙여 줍니다. 미국과 멕시코 두 나라에서 인정받았다는 점이 활동 범위를 보여 줘요.","hl":"mn"},{"n":44,"text":"먼저 receive는 목적어만 취하는 타동사예요. 그래서 many prizes가 바로 목적어로 오는 거고, 수여동사가 아니라는 점을 기억해 두세요. 두 번째로 in은 전치사 하나인데 the United States와 Mexico가 and로 병렬 연결되어 있어서 두 곳 모두에서 받았다고 해석합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 보냈다\u003c/span>\u003cspan class=\"en\">She \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">spent \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">60년 이상을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">over \u003c/span>\u003cspan class=\"tgt\">sixty \u003c/span>\u003cspan class=\"tgt\">years\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">멕시코에서\u003c/span>\u003cspan class=\"en\">in Mexico.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 멕시코에서 60년 이상을 보냈다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 미국과 멕시코에서 상을 받았다고 했는데, 이 문장은 그중 멕시코에 얼마나 오래 머물렀는지를 알려 줘요. \u003cb class=\"key\">60년 \u003c/b>\u003cb class=\"key\">이상\u003c/b>이라는 기간은 그녀의 삶에서 멕시코가 차지한 \u003cb class=\"key\">비중\u003c/b>을 보여 줍니다. 다음 문장의 시민권 취득으로 자연스럽게 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">3형식 동사 spend + 기간 목적어\u003c/span> : spend + [시간·돈] + (on/in) + [대상] : \"60년 이상을 보냈다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 over (~이상)\u003c/span> : over + [수·양] : \"60년 이상\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"She spent, 그녀는 보냈다. over sixty years, 60년 이상을. in Mexico, 멕시코에서. 이 문장 전체를 해석하면, 그녀는 멕시코에서 60년 이상을 보냈다.","hl":"m"},{"n":46,"text":"앞 문장에서 미국과 멕시코에서 상을 받았다고 했는데, 이 문장은 그중 멕시코에 얼마나 오래 머물렀는지를 알려 줘요. 60년 이상이라는 기간은 그녀의 삶에서 멕시코가 차지한 비중을 보여 줍니다. 다음 문장의 시민권 취득으로 자연스럽게 이어지는 흐름이에요.","hl":"mn"},{"n":47,"text":"먼저 spend는 시간을 보내다라는 타동사라서 over sixty years가 목적어로 와요. 그리고 뒤에 in Mexico가 붙어서 멕시코에서라는 장소가 더해지는 거죠. 두 번째로 over는 원래 위에라는 뜻인데 숫자 앞에서는 초과, 즉 이상이라는 의미로 쓰여요. more than과 같은 표현이라고 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는\u003c/span>\u003cspan class=\"en\">She\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">되었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">became \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">멕시코 시민이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">Mexican \u003c/span>\u003cspan class=\"tgt\">citizen\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1962년에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">1962\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 1962년에 멕시코 시민이 되었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 1962년에 멕시코 시민권을 취득했다는 \u003cb class=\"key\">구체적 \u003c/b>\u003cb class=\"key\">사실\u003c/b>을 통해 Catlett이 멕시코에서 오랜 시간 뿌리를 내렸음을 보여 준다. 앞 문장의 '60년 넘게 멕시코에서 지냈다'는 내용을 뒷받침하는 대목이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">불완전 자동사 become + 주격 보어\u003c/span> : become [불완전 자동사] + [명사 보어] : \"멕시코 시민이 되었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">시간을 나타내는 전치사구\u003c/span> : in + [연도] : \"1962년에\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"She, 그녀는. became, 되었다. a Mexican citizen, 멕시코 시민이. in 1962, 1962년에. 이 문장 전체를 해석하면, 그녀는 1962년에 멕시코 시민이 되었다.","hl":"m"},{"n":49,"text":"이 문장은 Catlett이 천구백육십이 년에 멕시코 시민이 되었다는 구체적 사실을 전해요. 앞에서 육십 년 넘게 멕시코에서 지냈다고 했으니, 그 삶이 얼마나 깊게 멕시코와 연결되었는지 보여 주는 대목이에요.","hl":"mn"},{"n":50,"text":"먼저 became은 주어 She의 상태를 보충하는 주격 보어를 필요로 하는 불완전 자동사예요. a Mexican citizen이 바로 주격 보어 역할을 해서 '멕시코 시민이 되었다'라는 뜻을 완성하죠. 그리고 in nineteen sixty two는 시간의 전치사 in이 들어간 시간의 전치사구로, 사건이 일어난 때를 알려 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Catlett은\u003c/span>\u003cspan class=\"en\">Catlett\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사망했다\u003c/span>\u003cspan class=\"en\">died\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">2012년에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">2012\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">멕시코에 있는 그녀의 집에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">her \u003c/span>\u003cspan class=\"tgt\">home\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">Mexico\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Catlett은 2012년 멕시코에 있는 그녀의 집에서 사망했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Catlett의 생애를 마무리하며 사망 시기와 장소를 제시한다. '멕시코에 있는 그녀의 집'은 그녀가 말년까지 멕시코에 \u003cb class=\"key\">정착\u003c/b>했음을 보여 준다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간을 나타내는 전치사구\u003c/span> : in + [연도] : \"2012년에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소를 나타내는 전치사 at\u003c/span> : at + [특정 지점/좁은 장소] : \"그녀의 집에서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">장소를 나타내는 전치사 in\u003c/span> : in + [국가·도시 등 넓은 장소] : \"멕시코에(서)\"\u003c/div>\u003c/div>","segs":[{"n":51,"text":"Catlett, Catlett은. died, 사망했다. in 2012, 2012년에. at her home in Mexico, 멕시코에 있는 그녀의 집에서. 이 문장 전체를 해석하면, Catlett은 2012년 멕시코에 있는 그녀의 집에서 사망했다.","hl":"m"},{"n":52,"text":"이 문장은 Catlett의 생애를 마무리하면서 사망 시기와 장소를 알려 줘요. 멕시코에 있는 그녀의 집에서 세상을 떠났다는 점은 그녀가 말년까지 멕시코에 정착했음을 보여 주는 대목이에요.","hl":"mn"},{"n":53,"text":"먼저 in twenty twelve는 연도 앞에 쓰는 시간의 전치사 in이 들어간 시간의 전치사구예요. at her home은 특정 지점을 나타내는 전치사 at 뒤에 소유격 her가 붙은 home이 온 표현이죠. 마지막 in Mexico는 국가처럼 넓은 장소를 나타내는 전치사 in으로, 앞의 at her home과 함께 장소의 범위를 넓혀 주는 표현이에요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>Elizabeth Catlett은 1915년 워싱턴 D.C.에서 \u003cb class=\"key\">노예\u003c/b>였던 조부모의 손녀로 태어났다.\u003c/li>\u003cli>대부분이 백인 학생들인 대학이 그녀를 \u003cb class=\"key\">흑인\u003c/b>이라는 이유만으로 거부했지만, 그녀는 Howard 대학교에서 디자인과 그림을 공부하고 Iowa 대학교에서 \u003cb class=\"key\">미술 \u003c/b>\u003cb class=\"key\">석사\u003c/b> 학위를 받았다.\u003c/li>\u003cli>평생 동안 그녀는 \u003cb class=\"key\">예술 \u003c/b>\u003cb class=\"key\">창작\u003c/b>을 하며 사회의 부당함과 그로 인해 고통받는 사람들을 작품에 담았다.\u003c/li>\u003cli>그녀는 미국과 멕시코에서 많은 \u003cb class=\"key\">상\u003c/b>을 받았고, 멕시코에서 60년 이상을 살며 1962년 시민이 되었고 2012년 세상을 떠났다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Throughout her life, Elizabeth Catlett created art that revealed the injustice of society and the people who suffered from it.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: Elizabeth Catlett은 흑인이라는 이유만으로 대학에서 \u003cb class=\"key\">거부\u003c/b>를 당했지만 Howard 대학교에서 미술을 공부하고 석사 학위를 취득한 뒤, 평생 \u003cb class=\"key\">예술 \u003c/b>\u003cb class=\"key\">창작\u003c/b>을 통해 사회의 \u003cb class=\"key\">부당함\u003c/b>과 그로 인해 고통받는 사람들을 보여 준 인물이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":54,"text":"오늘 글은 한 인물의 삶을 시간 순서로 따라가며 그가 남긴 예술의 의미를 보여 주는 지문이었어요. 출생과 차별, 교육, 작품 활동, 수상과 말년이라는 네 단계만 머릿속에 남겨도 전체가 정리됩니다. 복습할 때는 시간 표현에 표시를 하고, 가운데에 있는 여덟 번째 문장을 주제문으로 확인해 보세요. 수고했습니다, 다음 시간에 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
