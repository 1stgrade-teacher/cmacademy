<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터1 Reading 21 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터1 Reading 21","audioDir":"reading21_audio","preview":false,"count":58,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.668em\">Reading\u003cbr>21\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터1\u003c/div>\u003ch1>A Lucky Meal After Hunger: Joy Around the Fire\u003c/h1>\u003ch2>배고픔 끝의 행운의 식사, 불가에 피어난 기쁨\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>먹을 것이 거의 없었기 때문에 그들은 한 달 동안 매우 배가 고팠고, 사냥에 서툴렀지만 3일 동안 굶은 끝에 운좋게 다람쥐를 잡아 불에 구웠다. 그들은 \u003cb class=\"key\">기쁨\u003c/b>을 숨기지 못했고, 맛있는 \u003cb class=\"key\">냄새\u003c/b>가 공기를 가득 채웠다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>After starving for three days, Salva and the boys luckily catch and roast a squirrel, and their joy fills the air.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 배고픔 끝에 작은 먹을거리를 얻은 소년들의 이야기를 함께 읽어 볼 거예요. 이 지문은 Salva와 소년들이 사흘 동안 굶은 끝에 다람쥐를 잡아 불에 구우며 기뻐하는 장면을 담고 있고, 핵심은 절박한 배고픔이 작은 성공과 큰 기쁨으로 바뀐다는 점이에요. 그럼 지문을 한 문장씩 따라가며 흐름과 표현을 자세히 살펴볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">이 지문은 극심한 \u003cb class=\"key\">배고픔\u003c/b> 속에서 작은 먹잇감을 얻은 순간을 담은 생존 이야기예요. 오랫동안 먹지 못하면 몸은 에너지를 아끼고, 사람은 먹을 것을 찾는 데 집중하게 되죠. 사냥(hunting)은 동물을 쫓아 잡는 활동이고, 채집(gathering)은 자연에서 먹을 수 있는 것을 모으는 활동이에요. 불(fire)은 고기를 익히고 냄새를 퍼뜨려, 단순한 식사를 따뜻한 사건으로 바꿔 줍니다. 마치 친구들과 라면을 끓여 먹을 때 작은 소리와 냄새까지 기쁨으로 느껴지는 것과 비슷해요. 이 글은 \u003cb class=\"key\">생존\u003c/b>의 절박함과 \u003cb class=\"key\">기쁨\u003c/b>을 함께 보여 주어 감정의 변화를 느끼게 합니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식부터 짚어 볼게요. 이 글은 극심한 배고픔 속에서 작은 먹잇감을 얻은 순간을 담은 생존 이야기예요. 오랫동안 먹지 못하면 몸은 에너지를 아끼고, 사람은 먹을 것을 찾는 데 집중하게 되죠. 사냥은 동물을 쫓아 잡는 활동이고, 채집은 자연에서 먹을 수 있는 것을 모으는 활동이에요. 불은 고기를 익히고 냄새를 퍼뜨려 단순한 식사를 따뜻한 사건으로 바꿔 주고, 마치 친구들과 라면을 끓여 먹을 때 작은 소리와 냄새까지 기쁨으로 느껴지는 것과 비슷해요. 이 글은 생존의 절박함과 기쁨을 함께 보여 주어 감정의 변화를 느끼게 합니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>한 달의 배고픔\u003csmall>문제 · 문장 1–4\u003c/small>\u003c/h4>\u003cp>Salva와 소년들은 먹을 것이 거의 없어 한 달 동안 매우 \u003cb class=\"key\">배고픔\u003c/b>을 겪었습니다. 그래서 동물을 사냥하려 했지만 사냥에 너무 \u003cb class=\"key\">서툴렀\u003c/b>죠. 하지만 사흘 동안 굶은 끝에 운좋게 먹을 것을 얻습니다. 이 부분은 절박한 \u003cb class=\"key\">문제\u003c/b>를 제시합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>다람쥐 포획과 불\u003csmall>해결 · 문장 5–7\u003c/small>\u003c/h4>\u003cp>사냥하는 동안 소년들 중 한 명이 \u003cb class=\"key\">다람쥐\u003c/b>를 잡고, 소년들은 불을 피울 \u003cb class=\"key\">나무\u003c/b>를 모읍니다. 이어서 다람쥐를 불에 구웠습니다. 작은 먹잇감이지만 배고픔을 해결하는 실제 \u003cb class=\"key\">해결책\u003c/b>이 된 셈입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>숨길 수 없는 기쁨\u003csmall>결과 · 문장 8–10\u003c/small>\u003c/h4>\u003cp>이 과정은 조용히 일어나지 않았습니다. 소년들은 목소리에 \u003cb class=\"key\">기쁨\u003c/b>을 숨길 수 없었고, 그날이 최고의 날인 것처럼 느꼈습니다. 절박했던 상황이 \u003cb class=\"key\">감격\u003c/b>과 \u003cb class=\"key\">환호\u003c/b>로 바뀌는 장면입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>불을 키우는 대화\u003csmall>예시 · 문장 11–13\u003c/small>\u003c/h4>\u003cp>이어서 소년들의 생생한 대화가 나옵니다. 불이 더 커야 한다고 말하고, 더 많은 \u003cb class=\"key\">나무\u003c/b>가 필요하다고 재촉하며, 빨리 뒤집으라고 외칩니다. 짧은 대화가 \u003cb class=\"key\">긴장\u003c/b>과 \u003cb class=\"key\">활기\u003c/b>를 동시에 보여 줍니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>맛있는 냄새의 마무리\u003csmall>마무리 · 문장 14–15\u003c/small>\u003c/h4>\u003cp>마지막으로 다람쥐의 육즙이 떨어지고 \u003cb class=\"key\">지글지글\u003c/b> 끓는 소리가 묘사됩니다. 공기는 맛있는 \u003cb class=\"key\">냄새\u003c/b>로 가득 찹니다. 소리와 냄새 같은 \u003cb class=\"key\">감각\u003c/b> 묘사가 기쁨을 더 생생하게 만듭니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 차례대로 나누어 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 한 달의 배고픔입니다. Salva와 소년들은 먹을 것이 거의 없어서 한 달 동안 매우 배고팠어요. 그래서 동물을 사냥하려고 했지만 사냥에 너무 서툴렀죠. 이 부분이 글의 절박한 문제를 보여 줍니다.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 사냥 중에 한 소년이 다람쥐를 잡습니다. 소년들은 불을 피울 나무를 모으고, 그 다람쥐를 불에 구웠어요. 작은 먹잇감이지만 이것이 배고픔을 해결하는 실제 해결책이 된 셈입니다.","hl":"f1"},{"n":6,"text":"세 번째 단계는 숨길 수 없는 기쁨입니다. 이 과정은 조용히 일어나지 않았어요. 소년들은 목소리에 기쁨을 숨길 수 없었고, 그날이 최고의 날인 것처럼 느꼈습니다. 절박했던 상황이 감격과 환호로 바뀌는 장면이에요.","hl":"f2"},{"n":7,"text":"네 번째 단계에서는 불을 키우는 대화가 이어집니다. 소년들은 불이 더 커야 한다고 말하고, 더 많은 나무가 필요하다고 재촉하며, 빨리 뒤집으라고 외쳐요. 짧은 대화가 긴장과 활기를 동시에 보여 줍니다.","hl":"f3"},{"n":8,"text":"마지막 단계는 맛있는 냄새의 마무리입니다. 다람쥐의 육즙이 떨어지고 지글지글 끓는 소리가 묘사돼요. 공기는 맛있는 냄새로 가득 차고, 소리와 냄새 같은 감각 묘사가 기쁨을 더 생생하게 만듭니다.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 10번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 먹을 것이 거의 없는 \u003cb class=\"key\">배고픔\u003c/b>이라는 문제에서 시작해, 다람쥐를 잡아 불에 굽는 \u003cb class=\"key\">해결\u003c/b>로 나아갑니다. 사건이 시간 순서대로 이어지지만, 중심 생각은 뒤늦게 최고의 날이라는 표현에서 드러납니다. 그래서 주제문을 끝부분에 두는 \u003cb class=\"key\">미괄식\u003c/b>으로 볼 수 있습니다. However와 Then 같은 신호어가 전환과 다음 행동을 안내합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>But (3)\u003c/b>\u003cspan>앞의 시도와 반대되는 상황 제시\u003c/span>\u003cb>However (4)\u003c/b>\u003cspan>역접 전환\u003c/span>\u003cb>Then (7)\u003c/b>\u003cspan>다음 행동으로 시간 순서 연결\u003c/span>\u003cb>None of this (8)\u003c/b>\u003cspan>부정 표현으로 조용하지 않았음을 강조\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">very hungry\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">little food\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">starving\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">something to eat\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a squirrel\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">roasted it on the fire\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">couldn't hide the joy in their voices\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the best day\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>사냥 실패와 배고픔\u003c/th>\u003cth>사냥 성공과 기쁨\u003c/th>\u003c/tr>\u003ctr>\u003ctd>먹을 것이 거의 없어 한 달 동안 배고픔\u003c/td>\u003ctd>다람쥐를 잡아 불에 구워 먹음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사냥에 너무 서툴렀음\u003c/td>\u003ctd>운좋게 먹을 것을 얻음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>조용한 분위기\u003c/td>\u003ctd>기쁨을 숨기지 못하고 소리침\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글은 문제와 해결의 구조로 읽을 수 있어요. 먹을 것이 거의 없는 배고픔이라는 문제에서 시작해 다람쥐를 잡아 불에 굽는 해결로 나아가죠. 사건은 시간 순서대로 이어지지만 중심 생각은 뒤늦게 최고의 날이라는 표현에서 드러나요. 그래서 주제문을 끝부분에 두는 미괄식으로 볼 수 있습니다.","hl":"ty"},{"n":10,"text":"신호어를 보면 흐름이 더 선명해져요. 세 번째 문장의 But은 사냥하려는 시도와 반대되는 상황을 알려 주고, 네 번째 문장의 However는 역접 전환을 표시합니다. 일곱 번째 문장의 Then은 다음 행동으로 시간 순서를 이어 주고, 여덟 번째 문장의 None of this는 조용하지 않았음을 강조하는 부정 표현이에요. 이런 신호어와 재진술을 함께 표시하면 글의 구조가 쉽게 잡힙니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>hungry\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>배가 고픈\u003c/span>\u003c/div>\u003cdiv>\u003cb>food\u003c/b>\u003cem>명사\u003c/em>\u003cspan>음식, 먹을 것\u003c/span>\u003c/div>\u003cdiv>\u003cb>eat\u003c/b>\u003cem>동사\u003c/em>\u003cspan>먹다\u003c/span>\u003c/div>\u003cdiv>\u003cb>try\u003c/b>\u003cem>동사\u003c/em>\u003cspan>시도하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>hunt\u003c/b>\u003cem>동사\u003c/em>\u003cspan>사냥하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>animal\u003c/b>\u003cem>명사\u003c/em>\u003cspan>동물\u003c/span>\u003c/div>\u003cdiv>\u003cb>poor at\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 서툰\u003c/span>\u003c/div>\u003cdiv>\u003cb>however\u003c/b>\u003cem>부사\u003c/em>\u003cspan>그러나\u003c/span>\u003c/div>\u003cdiv>\u003cb>starve\u003c/b>\u003cem>동사\u003c/em>\u003cspan>굶다\u003c/span>\u003c/div>\u003cdiv>\u003cb>luckily\u003c/b>\u003cem>부사\u003c/em>\u003cspan>운좋게\u003c/span>\u003c/div>\u003cdiv>\u003cb>get\u003c/b>\u003cem>동사\u003c/em>\u003cspan>얻다\u003c/span>\u003c/div>\u003cdiv>\u003cb>while\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>~하는 동안\u003c/span>\u003c/div>\u003cdiv>\u003cb>catch\u003c/b>\u003cem>동사\u003c/em>\u003cspan>잡다\u003c/span>\u003c/div>\u003cdiv>\u003cb>squirrel\u003c/b>\u003cem>명사\u003c/em>\u003cspan>다람쥐\u003c/span>\u003c/div>\u003cdiv>\u003cb>gather\u003c/b>\u003cem>동사\u003c/em>\u003cspan>모으다\u003c/span>\u003c/div>\u003cdiv>\u003cb>wood\u003c/b>\u003cem>명사\u003c/em>\u003cspan>나무, 장작\u003c/span>\u003c/div>\u003cdiv>\u003cb>build\u003c/b>\u003cem>동사\u003c/em>\u003cspan>짓다, 피우다\u003c/span>\u003c/div>\u003cdiv>\u003cb>fire\u003c/b>\u003cem>명사\u003c/em>\u003cspan>불\u003c/span>\u003c/div>\u003cdiv>\u003cb>roast\u003c/b>\u003cem>동사\u003c/em>\u003cspan>굽다\u003c/span>\u003c/div>\u003cdiv>\u003cb>take place\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>일어나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>silently\u003c/b>\u003cem>부사\u003c/em>\u003cspan>조용히\u003c/span>\u003c/div>\u003cdiv>\u003cb>hide\u003c/b>\u003cem>동사\u003c/em>\u003cspan>숨기다\u003c/span>\u003c/div>\u003cdiv>\u003cb>joy\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기쁨\u003c/span>\u003c/div>\u003cdiv>\u003cb>voice\u003c/b>\u003cem>명사\u003c/em>\u003cspan>목소리\u003c/span>\u003c/div>\u003cdiv>\u003cb>seem\u003c/b>\u003cem>동사\u003c/em>\u003cspan>~인 것 같다\u003c/span>\u003c/div>\u003cdiv>\u003cb>need\u003c/b>\u003cem>동사\u003c/em>\u003cspan>필요로 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>turn over\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>뒤집다\u003c/span>\u003c/div>\u003cdiv>\u003cb>burn\u003c/b>\u003cem>동사\u003c/em>\u003cspan>타다, 태우다\u003c/span>\u003c/div>\u003cdiv>\u003cb>delicious\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>맛있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>smell\u003c/b>\u003cem>명사\u003c/em>\u003cspan>냄새\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"핵심 단어도 몇 개 짚어 볼게요. hungry는 배가 고픈, starve는 굶다, gather는 모으다, roast는 굽다는 뜻이에요. poor at은 서툴다는 숙어이고, take place는 일어나다, turn over는 뒤집다로 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">hungry\u003c/b>\u003cspan class=\"m\">배가 고픈\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">starving\u003c/span>\u003cspan class=\"s\">famished\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">full\u003c/span>\u003cspan class=\"a\">satisfied\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">hunt\u003c/b>\u003cspan class=\"m\">사냥하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">chase\u003c/span>\u003cspan class=\"s\">pursue\u003c/span>\u003cspan class=\"s\">seek\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">gather\u003c/b>\u003cspan class=\"m\">모으다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">collect\u003c/span>\u003cspan class=\"s\">assemble\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">scatter\u003c/span>\u003cspan class=\"a\">disperse\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">hide\u003c/b>\u003cspan class=\"m\">숨기다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">conceal\u003c/span>\u003cspan class=\"s\">cover\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">reveal\u003c/span>\u003cspan class=\"a\">show\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">joy\u003c/b>\u003cspan class=\"m\">기쁨\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">delight\u003c/span>\u003cspan class=\"s\">happiness\u003c/span>\u003cspan class=\"s\">gladness\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">sorrow\u003c/span>\u003cspan class=\"a\">sadness\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">delicious\u003c/b>\u003cspan class=\"m\">맛있는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">tasty\u003c/span>\u003cspan class=\"s\">appetizing\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">tasteless\u003c/span>\u003cspan class=\"a\">disgusting\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">silently\u003c/b>\u003cspan class=\"m\">조용히\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">quietly\u003c/span>\u003cspan class=\"s\">soundlessly\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">loudly\u003c/span>\u003cspan class=\"a\">noisily\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어도 함께 정리해 볼게요. hungry의 동의어는 starving, famished이고 반의어는 full, satisfied예요. gather는 collect, assemble과 가깝고 scatter, disperse와 반대되며, hide는 conceal, cover와 비슷하고 reveal, show와 반대죠. joy는 delight, happiness와 가깝고 sorrow, sadness와 반대이며, delicious는 tasty, appetizing과 비슷하고 tasteless, disgusting과 반대예요. silently는 quietly, soundlessly와 가깝고 loudly, noisily와 반대입니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 매우 배가 고팠다\u003c/span>\u003cspan class=\"en\">They were very hungry\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 달 동안\u003c/span>\u003cspan class=\"en\">for a month\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜냐하면 먹을 것이 거의 없었기 때문에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">because \u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">little \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">food \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">먹을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">eat\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">먹을 것이 거의 없었기 때문에 그들은 한 달 동안 매우 배가 고팠다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 한 달 동안 먹을 것이 거의 없어서 계속 배가 고팠다는 상황을 알려 주는 문장이에요. 뒤에 이어지는 사냥 시도가 왜 필요했는지 \u003cb class=\"key\">이유\u003c/b>를 미리 깔아 주는 \u003cb class=\"key\">배경\u003c/b> 역할을 합니다. because절이 뒤에서 이유를 붙여 주고, little이 '거의 없는'이라는 부정의 느낌을 담고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이유를 나타내는 접속사 because\u003c/span> : [[because]] + [주어 + 동사] (이유의 종속절) : \"왜냐하면 먹을 것이 거의 없었기 때문에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부정 의미의 little (형용사)\u003c/span> : [[little]] + [불가산명사] : \"거의 없는 먹을 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : [명사] + [[to eat]] (명사를 뒤에서 수식) : \"먹을 음식\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"They were very hungry, 그들은 매우 배가 고팠다. for a month, 한 달 동안. because there was little food, 왜냐하면 먹을 것이 거의 없었기 때문에. to eat, 먹을. 이 문장 전체를 해석하면, 먹을 것이 거의 없었기 때문에 그들은 한 달 동안 매우 배가 고팠다.","hl":"m"},{"n":14,"text":"이 문장은 그들이 왜 배고팠는지 이유를 알려 주는 문장이에요. 한 달 동안이나 먹을 것이 거의 없었기 때문에 계속 배가 고팠다는 상황을 전달하고 있죠. 뒤에 나오는 사냥 시도가 왜 필요했는지 배경을 깔아 주는 역할을 합니다.","hl":"mn"},{"n":15,"text":"첫 번째, because는 두 문장을 이어 이유를 설명하는 접속사예요. 뒤에는 항상 주어와 동사가 있는 완전한 절이 온다는 점을 기억하세요. 두 번째, little은 셀 수 없는 명사 앞에서 거의 없다는 부정의 뜻을 가져요. a little과 헷갈리면 뜻이 완전히 반대가 되니 조심하세요. 세 번째, to eat은 앞에 있는 food를 뒤에서 꾸며 주는 형용사 역할을 해요. 그래서 먹을 음식이라는 뜻이 되는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 시도했다\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">tried \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">동물을 사냥하는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">hunt\u003c/span> animals\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">먹을 것을 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">food\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 먹을 것을 위해 동물을 사냥하려고 했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 배고픔을 해결하려고 그들이 실제로 행동에 나섰다는 것을 보여 주는 문장이에요. try to부정사가 '~하려고 시도했다'는 \u003cb class=\"key\">의도\u003c/b>를 담고, for food가 그 행동의 \u003cb class=\"key\">목적\u003c/b>을 분명히 해 줍니다. 앞 문장의 배고픔과 다음 문장의 실패를 이어 주는 다리 역할을 하죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : [try] + [[to hunt]] (to부정사구가 타동사 try의 목적어) : \"사냥하는 것을 시도했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">목적을 나타내는 전치사 for\u003c/span> : [[for]] + [명사] (~을 위해) : \"먹을 것을 위해\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"They tried, 그들은 시도했다. to hunt animals, 동물을 사냥하는 것을. for food, 먹을 것을 위해. 이 문장 전체를 해석하면, 그들은 먹을 것을 위해 동물을 사냥하려고 했다.","hl":"m"},{"n":17,"text":"이 문장은 그들이 배고픔을 해결하려고 실제로 행동에 나섰다는 것을 보여 줘요. try to부정사로 그들이 무엇을 하려 했는지 의도를 나타내고, for food가 그 행동의 목적을 분명히 해 줍니다. 앞의 배고픔과 뒤의 실패를 이어 주는 다리 같은 문장이에요.","hl":"mn"},{"n":18,"text":"첫 번째, tried to hunt에서 to hunt는 try의 목적어 자리를 채우는 명사적 용법이에요. 그래서 사냥하는 것을 시도했다는 뜻이 되죠. 두 번째, for food에서 for는 뒤에 명사를 붙여 목적을 나타내는 전치사예요. 사냥을 하는 이유가 먹을 것임을 알려 주는 표현입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">But\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 너무 서툴렀다\u003c/span>\u003cspan class=\"en\">they were \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">too \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">poor \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사냥에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">hunting\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 그들은 사냥에 너무 서툴렀다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 사냥을 시도했다는 내용과 반대되는 결과를 But으로 이어 주는 문장이에요. 그들이 사냥에 \u003cb class=\"key\">서툴렀다\u003c/b>는 점이 이후에도 굶주림이 계속되는 \u003cb class=\"key\">원인\u003c/b>이 됩니다. too가 '지나치게'라는 정도를 더해 실패의 느낌을 강하게 만들어 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">역접의 접속사 But\u003c/span> : [[But]] + [주어 + 동사] : \"그러나\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부사 too의 강조 용법\u003c/span> : [[too]] + [형용사] (정도가 지나치게 ~한) : \"너무 서툰\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 at + 동명사 (be poor at)\u003c/span> : be [[poor at]] + [동명사] : \"사냥에 서툴다\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"But, 그러나. they were too poor, 그들은 너무 서툴렀다. at hunting, 사냥에. 이 문장 전체를 해석하면, 그러나 그들은 사냥에 너무 서툴렀다.","hl":"m"},{"n":20,"text":"앞에서 사냥을 시도했다는 내용과 반대되는 결과를 But으로 이어 주는 문장이에요. 그들이 사냥에 서툴렀다는 점이 이후에도 굶주림이 계속되는 원인이 됩니다. too가 지나치게라는 정도를 더해서 실패의 느낌을 강하게 만들어 주고요.","hl":"mn"},{"n":21,"text":"첫 번째, too는 형용사 앞에서 너무 지나치게라는 강조의 뜻을 더해요. 두 번째, be poor at은 ~에 서툴다는 관용 표현이고, 전치사 at 뒤에는 동명사 hunting이 와야 합니다. 세 번째, But은 앞 문장과 반대되는 내용을 이어 주는 역접의 접속사예요. 사냥을 시도했지만 서툴렀다는 흐름을 만들어 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만,\u003c/span>\u003cspan class=\"en\">However,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">3일 동안 굶은 끝에,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">after \u003c/span>\u003cspan class=\"tgt\">starving \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">three \u003c/span>\u003cspan class=\"tgt\">days\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Salva와 소년들은\u003c/span>\u003cspan class=\"en\">Salva and the boys\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">운좋게 얻었다\u003c/span>\u003cspan class=\"en\">luckily got\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">먹을 것을.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">something \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">eat\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 3일 동안 굶은 끝에 Salva와 소년들은 운좋게 먹을 것을 얻었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사냥에 서툴렀다는 앞 문장과 However로 \u003cb class=\"key\">반전\u003c/b>을 이루며, 사흘을 굶은 끝에 운좋게 먹을 것을 얻었다는 이야기의 \u003cb class=\"key\">전환점\u003c/b>을 제시합니다. luckily는 '운 좋게도'로, 힘든 상황이 \u003cb class=\"key\">호전\u003c/b>되는 분위기를 만들어 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 after + 동명사(starving)\u003c/span> : [전치사 after] + [[동명사]] (~ing) → '~한 뒤에' : \"3일 동안 굶은 끝에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : [[something]] + [to + 동사원형] (to부정사구가 앞 명사를 수식) : \"먹을 것\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"However, 하지만. after starving for three days, 3일 동안 굶은 끝에. Salva and the boys, Salva와 소년들은. luckily got, 운좋게 얻었다. something to eat, 먹을 것을.. 이 문장 전체를 해석하면, 하지만 3일 동안 굶은 끝에 Salva와 소년들은 운좋게 먹을 것을 얻었다.","hl":"m"},{"n":23,"text":"앞 문장에서 그들이 사냥에 너무 서툴렀다고 했죠. 그런데 However가 나오면서 분위기가 반전됩니다. 사흘을 굶은 끝에 운 좋게 먹을 것을 얻었다는, 이야기의 중요한 전환점이에요.","hl":"mn"},{"n":24,"text":"첫 번째, after 뒤에 온 starving은 동명사예요. 전치사 뒤에는 절이 아니라 동명사가 와서 굶은 뒤라는 시간을 만들어 줍니다. 두 번째, something to eat에서 to eat은 앞에 있는 something을 꾸며 주는 형용사 역할이에요. 그래서 먹을 것이라는 뜻이 되죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사냥하는 동안,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">While \u003c/span>\u003cspan class=\"tgt\">hunting\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들 중 한 명이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">them\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다람쥐를 잡았다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">caught \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">squirrel\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사냥하는 동안, 그들 중 한 명이 다람쥐를 잡았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사냥하던 중 그들 중 한 명이 다람쥐를 잡았다는 장면으로, 앞에서 사냥에 서툴렀다던 흐름이 드디어 \u003cb class=\"key\">풀리는\u003c/b> 순간입니다. 작은 먹잇감이지만 이후 불을 피워 굽는 장면으로 이어지는 \u003cb class=\"key\">출발점\u003c/b> 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 while + 분사구문(부사절 축약)\u003c/span> : While + [[현재분사]] (~ing) = While + 주어 + be동사 + ~ing의 축약 : \"사냥하는 동안\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">one of + 복수대명사 (단수 취급)\u003c/span> : [[one]] of + 복수명사·대명사 → '~들 중 한 명' : \"그들 중 한 명\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">불규칙 동사 catch의 과거형\u003c/span> : catch － [[caught]] － caught : \"다람쥐를 잡았다\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"While hunting, 사냥하는 동안. one of them, 그들 중 한 명이. caught a squirrel, 다람쥐를 잡았다.. 이 문장 전체를 해석하면, 사냥하는 동안, 그들 중 한 명이 다람쥐를 잡았다.","hl":"m"},{"n":26,"text":"사냥하던 중에 그들 중 한 명이 다람쥐를 잡았다는 장면이에요. 앞에서 사냥에 서툴렀다고 했는데, 이제는 작은 먹잇감을 잡았다는 뜻이죠. 이야기가 드디어 풀리는 순간입니다.","hl":"mn"},{"n":27,"text":"첫 번째, While hunting은 While they were hunting에서 주어와 be동사가 생략된 분사구문이에요. 주절 주어가 사냥하는 주체라서 현재분사 hunting을 씁니다. 두 번째, one of them은 그들 중 한 명이라는 뜻이고, 주어의 핵심이 one이라서 동사는 단수로 caught를 씁니다. 세 번째, catch의 과거형은 caught라는 불규칙 변화라는 점도 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 15\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 모았다\u003c/span>\u003cspan class=\"en\">They gathered\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나무를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">wood\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">불을 피우기 위해.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">build \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">fire\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 불을 피울 나무를 모았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 다람쥐를 잡은 다음, 그것을 구울 준비를 하는 장면입니다. 나무를 모은 \u003cb class=\"key\">목적\u003c/b>이 불을 피우는 것이라는 흐름을 잡으면 되고, 앞의 사냥 장면과 자연스럽게 이어지는 \u003cb class=\"key\">준비\u003c/b> 단계입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">불가산명사 wood\u003c/span> : [[불가산명사]] wood → a·an 없이 단독 사용 : \"나무(땔감)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : [주어 + 동사 + 목적어] + [[to + 동사원형]] → '~하기 위해' : \"불을 피우기 위해\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"They gathered, 그들은 모았다. wood, 나무를. to build a fire, 불을 피우기 위해.. 이 문장 전체를 해석하면, 그들은 불을 피울 나무를 모았다.","hl":"m"},{"n":29,"text":"다람쥐를 잡은 다음에 이제는 그것을 구울 준비를 하는 장면이에요. 나무를 모은 목적이 불을 피우는 것이라는 흐름만 잡으면 아주 자연스럽습니다.","hl":"mn"},{"n":30,"text":"첫 번째, to build a fire는 목적을 나타내는 to부정사예요. 불을 피우기 위해라고 해석하고, in order to build로 바꿔도 같은 뜻이 됩니다. 두 번째, wood는 목재나 땔감을 뜻하는 셀 수 없는 명사라서 a wood처럼 쓰지 않아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그런 다음\u003c/span>\u003cspan class=\"en\">Then\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 구웠다\u003c/span>\u003cspan class=\"en\">they \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">roasted\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">it\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">불에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">fire\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그런 다음 그것을 불에 구웠다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 잡은 다람쥐를 불에 구워 먹는 장면이 이어져요. \u003cb class=\"key\">then\u003c/b>은 사냥과 불 준비에 이어 마지막 행동인 \u003cb class=\"key\">roast\u003c/b>를 시작한다는 표시예요. 대명사 \u003cb class=\"key\">it\u003c/b>은 바로 앞의 다람쥐를 가리켜요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거시제(단순과거)\u003c/span> : [주어] + [동사 과거형] + [목적어] : \"구웠다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">대명사(목적격)\u003c/span> : [동사] + [it (목적어)] : \"그것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사구(장소)\u003c/span> : [동사] + [목적어] + on + the fire : \"불에\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"Then, 그런 다음. they roasted, 그들은 구웠다. it, 그것을. on the fire, 불에. 이 문장 전체를 해석하면, 그런 다음 그것을 불에 구웠다.","hl":"m"},{"n":32,"text":"앞에서 잡은 다람쥐를 불에 구워 먹는 장면이에요. then은 사냥과 불 준비에 이어 마지막 행동인 roast를 시작한다는 표시이고, it은 바로 앞의 다람쥐를 가리켜요.","hl":"mn"},{"n":33,"text":"먼저 roasted는 과거에 일어난 일을 순서대로 말하므로 roast의 과거형 roasted로 쓰였어요. 두 번째로 it은 앞에 나온 a squirrel을 다시 가리키는 목적어예요. 세 번째로 on the fire는 구운 장소를 나타내는 전치사구로 동사 roasted를 꾸며 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 15\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것 중 아무것도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">None \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">this\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일어나지 않았다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">took \u003c/span>\u003cspan class=\"tgt\">place\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">조용히\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">silently\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것 중 아무것도 조용히 일어나지 않았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 벌어진 불 피우기, 굽기, 소리치는 장면이 모두 \u003cb class=\"key\">조용하지 \u003c/b>\u003cb class=\"key\">않았다\u003c/b>는 뜻이에요. 즉 소란과 \u003cb class=\"key\">기쁨\u003c/b>이 가득한 상황을 강조하며, 다음 문장의 큰 소리 대사로 자연스럽게 이어져요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정대명사 none of + 단수명사\u003c/span> : None of + [단수명사/this] + [단수동사] : \"이것 중 아무것도\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">자동사구 take place(일어나다)\u003c/span> : take place = happen : \"일어났다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">부사(양태)\u003c/span> : [동사] + [부사] : \"조용히\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"None of this, 이것 중 아무것도. took place, 일어나지 않았다. silently, 조용히. 이 문장 전체를 해석하면, 이것 중 아무것도 조용히 일어나지 않았다.","hl":"m"},{"n":35,"text":"앞에서 벌어진 불 피우기와 굽기, 소리치는 장면이 모두 조용하지 않았다는 뜻이에요. 즉 소란과 기쁨이 가득한 상황을 강조하면서 다음 문장의 큰 소리 대사로 이어져요.","hl":"mn"},{"n":36,"text":"첫 번째로 None of this는 '이것 중 아무것도'라는 뜻이고, none of는 this를 받아 단수로 취급해요. 두 번째로 took place는 take place의 과거형으로 '일어나다'라는 뜻이에요. 세 번째로 silently는 동사 took place를 꾸며 조용히라는 양태를 나타내는 부사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 15\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은\u003c/span>\u003cspan class=\"en\">They\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">숨길 수 없었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">couldn't \u003c/span>\u003cspan class=\"tgt\">hide\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기쁨을\u003c/span>\u003cspan class=\"en\">\u003c  것 같았다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It \u003c/span>\u003cspan class=\"tgt\">seemed \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 ~이었다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">최고의 날!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">best \u003c/span>\u003cspan class=\"tgt\">day\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">최고의 날인 것 같았다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 그날의 기분을 감탄하듯 표현한 문장이에요. It은 \u003cb class=\"key\">가주어\u003c/b>, that절은 \u003cb class=\"key\">진주어\u003c/b>로 '~인 것 같았다'라는 전체 의미를 만들어요. 굶주리던 끝에 얻은 한 끼가 소년들에게는 \u003cb class=\"key\">최고의 \u003c/b>\u003cb class=\"key\">날\u003c/b>처럼 느껴진 거예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가주어 It / that절 진주어\u003c/span> : It(가주어) + seem(불완전자동사) + that절(진주어) : \"최고의 날인 것 같았다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">최상급\u003c/span> : the + 최상급 + 명사 : \"최고의 날\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"It seemed, 인 것 같았다. that it was, 그것이 ~이었다고. the best day!, 최고의 날!. 이 문장 전체를 해석하면, 최고의 날인 것 같았다!","hl":"m"},{"n":41,"text":"이 문장은 그날의 기분을 감탄하듯 정리한 거예요. 앞에서 사냥하고 불 피우고 구워 먹은 장면을 한마디로 마무리하는 역할을 하죠. 힘들게 굶던 아이들에게 그 한 끼는 정말 최고의 날처럼 느껴졌던 거예요.","hl":"mn"},{"n":42,"text":"첫 번째로 가주어 It을 봐요. that절이 진짜 주어인데 너무 길어서 뒤로 보내고 그 자리에 가주어 It을 세운 구조예요. 이때 that절은 진주어 역할을 하죠. 두 번째로 seem은 인 것 같다라는 뜻으로 that절과 짝을 이루는 동사예요. 세 번째로 the best day는 최상급 표현이라 앞에 the를 꼭 붙여요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 불은\u003c/span>\u003cspan class=\"en\">&quot;The fire\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~이어야 할 필요가 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">needs \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 커야\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">bigger\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">불이 더 커야 해.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 불을 더 키워 달라는 \u003cb class=\"key\">요청\u003c/b>의 말이에요. 다람쥐를 구우려면 불이 약해서 안 되니 소년들이 서로 재촉하는 장면이죠. 명령문 대신 need를 써서 '~할 필요가 있다'는 \u003cb class=\"key\">필요성\u003c/b>을 부드럽게 전달해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">need + to부정사(목적어)\u003c/span> : need [타동사] + to be bigger (to부정사구/목적어) : \"더 커야 한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">비교급 형용사\u003c/span> : big + -er (비교급) : \"더 큰\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"The fire, 그 불은. needs to be, ~이어야 할 필요가 있다. bigger, 더 커야. 이 문장 전체를 해석하면, 불이 더 커야 해.","hl":"m"},{"n":44,"text":"다람쥐를 구우려는데 불이 약해서 소년들이 서로 재촉하는 요청의 말이에요. 명령문 대신 need를 써서 불을 키울 필요성을 부드럽게 말하고 있죠. 앞 문장의 즐거운 분위기 속에서 실제로 해야 할 일을 알려주는 역할도 해요.","hl":"mn"},{"n":45,"text":"첫 번째로 needs to be를 보면 need 뒤에 to부정사가 목적어로 와서 할 필요가 있다는 뜻이 돼요. to be는 be동사로 주어 The fire의 상태를 설명하죠. 두 번째로 bigger는 to be의 보어로 쓰여서 더 크게 키우자는 비교의 뜻을 담고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 15\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 지속되지 않을 것이다\u003c/span>\u003cspan class=\"en\">&quot;It \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">won't \u003c/span>\u003cspan class=\"tgt\">last\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">충분히 오래\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">long \u003c/span>\u003cspan class=\"tgt\">enough\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 ~가 필요하다\u003c/span>\u003cspan class=\"en\">― \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">need \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 많은 나무가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">wood\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">충분히 오래가지 않을 거야. 더 많은 나무가 필요해.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 불이 오래가지 못할 것 같으니 나무를 더 모으자는 \u003cb class=\"key\">실용적\u003c/b> 판단이에요. won't로 미래에 대한 \u003cb class=\"key\">부정\u003c/b> 예측을 하고, 대시 뒤에는 그 이유와 \u003cb class=\"key\">해결책\u003c/b>이 이어져요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 will의 부정(won't)\u003c/span> : won't (= will not) + 동사원형 : \"지속되지 않을 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">enough의 후치 수식\u003c/span> : 형용사·부사 + enough : \"충분히 오래\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">need + 목적어 / 비교급 more\u003c/span> : need [타동사] + more wood (목적어) : \"우리는 더 많은 나무가 필요하다\"\u003c/div>\u003c/div>","segs":[{"n":46,"text":"It won't last, 그것은 지속되지 않을 것이다. long enough, 충분히 오래. ― we need, 우리는 ~가 필요하다. more wood, 더 많은 나무가. 이 문장 전체를 해석하면, 충분히 오래가지 않을 거야. 더 많은 나무가 필요해.","hl":"m"},{"n":47,"text":"불이 오래가지 못할 것 같으니 나무를 더 모으자는 실용적인 판단이에요. won't로 미래에 대한 부정 예측을 하고, 대시 뒤에는 그 이유와 해결책이 이어지죠. 앞에서 불을 키우자는 말에 자연스럽게 이어지는 흐름이에요.","hl":"mn"},{"n":48,"text":"첫 번째로 won't last를 보면 미래에 대한 부정 예측이라 will not이 won't로 줄었고, 조동사 뒤에는 동사원형 last가 와요. 두 번째로 long enough에서 enough는 형용사나 부사를 꾸밀 때 반드시 그 뒤에 온다는 어순을 기억하세요. 세 번째로 we need more wood에서 need는 타동사로 명사 목적어를 받고 more는 비교급처럼 더 많은이라는 뜻을 더해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">빨리,\u003c/span>\u003cspan class=\"en\">&quot;Quick,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 뒤집어,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">turn \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">over\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">타고 있어!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">it's \u003c/span>\u003cspan class=\"tgt\">burning\u003c/span>!&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“빨리, 그것을 뒤집어, 타고 있어!”\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 다람쥐를 불에 굽는 중에 소년들이 서로 다급하게 소리치는 장면이에요. \u003cb class=\"key\">명령문\u003c/b>으로 빠르게 재촉하고 \u003cb class=\"key\">현재진행형\u003c/b>으로 지금 불이 타오르는 중임을 알려 긴박함을 전합니다. 짧게 끊어지는 세 마디가 \u003cb class=\"key\">현장감\u003c/b>을 생생하게 살려 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">구동사 + 대명사 목적어 어순\u003c/span> : turn + [[대명사 it]] + over (동사 + 목적어 + 부사) : \"그것을 뒤집어라\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재진행형\u003c/span> : [[주어]] + be동사 + [[동사-ing]] : \"타고 있어 (지금 불이 붙어 있는 중)\"\u003c/div>\u003c/div>","segs":[{"n":49,"text":"Quick, 빨리. turn it over, 그것을 뒤집어. it's burning!, 타고 있어!. 이 문장 전체를 해석하면, “빨리, 그것을 뒤집어, 타고 있어!”","hl":"m"},{"n":50,"text":"다람쥐를 불에 굽던 소년들이 서로 소리치는 장면이에요. 명령문으로 다급하게 재촉하고, 현재진행형으로 지금 불이 타오르는 중이라고 알려 주죠. 짧게 끊어지는 문장이라 생생한 현장감이 그대로 느껴져요.","hl":"mn"},{"n":51,"text":"첫 번째로 turn it over를 보세요. over가 붙은 구동사에서 목적어가 대명사일 때는 반드시 동사와 부사 사이에 넣어서 turn it over라고 해요. 그래서 turn over it이라고 하면 어색하죠. 두 번째로 it's burning은 현재진행형이에요. be동사에 동사-ing를 붙여서 지금 타고 있는 중이라는 즉각적인 상황을 살려 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것의 육즙이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">The \u003c/span>\u003cspan class=\"tgt\">juice \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">떨어지고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">dripped \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지글지글 끓었다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">sizzled\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것의 육즙이 떨어지고 지글지글 끓었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 불에 구운 다람쥐에서 육즙이 뚝뚝 떨어지고 지글지글 소리를 내는 장면이에요. \u003cb class=\"key\">감각적 \u003c/b>\u003cb class=\"key\">묘사\u003c/b>로 군침 도는 분위기를 만들어 냅니다. \u003cb class=\"key\">dripped\u003c/b>와 \u003cb class=\"key\">sizzled\u003c/b>처럼 소리까지 들리는 동사를 골라 생동감을 더했어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 수식\u003c/span> : [[명사 The juice]] + of + [[대명사 it]] : \"그것의 육즙\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동사 병렬 구조(and)\u003c/span> : [[주어]] + 동사1(dripped) + and + 동사2(sizzled) : \"떨어지고 지글지글 끓었다\"\u003c/div>\u003c/div>","segs":[{"n":52,"text":"The juice of it, 그것의 육즙이. dripped, 떨어지고. and sizzled, 지글지글 끓었다.. 이 문장 전체를 해석하면, 그것의 육즙이 떨어지고 지글지글 끓었다.","hl":"m"},{"n":53,"text":"불에 구운 고기에서 육즙이 뚝뚝 떨어지고 지글지글 소리를 내는 장면이에요. 감각적인 묘사로 군침 도는 분위기를 만들어 주죠. 특히 dripped와 sizzled처럼 소리까지 들리는 동사를 골라서 생동감을 더했어요.","hl":"mn"},{"n":54,"text":"첫 번째로 The juice of it을 보세요. of it이 앞에 있는 명사 juice를 뒤에서 꾸며 주는 형용사구 역할을 해요. 그래서 그것의 육즙, 이렇게 해석하죠. 두 번째로 dripped and sizzled는 동사 병렬이에요. and는 같은 문법 형태끼리 묶어 주니까 과거형 동사 두 개가 나란히 병렬을 이루면서 두 동작이 함께 일어났음을 보여 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 15 / 15\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공기는\u003c/span>\u003cspan class=\"en\">The air\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가득 찼다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">filled \u003c/span>\u003cspan class=\"tgt\">with\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">맛있는 냄새로.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">delicious \u003c/span>\u003cspan class=\"tgt\">smell\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">공기는 맛있는 냄새로 가득 찼다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 고기를 굽는 냄새가 공기 중에 퍼진 장면으로, 앞의 \u003cb class=\"key\">감각적 \u003c/b>\u003cb class=\"key\">묘사\u003c/b>를 마무리하는 문장이에요. \u003cb class=\"key\">수동태\u003c/b> be filled with를 써서 공기가 냄새로 가득 찬 상태를 표현합니다. 굶주림이 기쁨으로 바뀌는 \u003cb class=\"key\">분위기\u003c/b>를 담아내요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태(be + 과거분사 + with)\u003c/span> : [[주어 The air]] + was + [[filled(과거분사)]] + with + [[명사]] : \"~로 가득 찼다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">형용사의 명사 앞 수식\u003c/span> : [[형용사 delicious]] + [[명사 smell]] : \"맛있는 냄새\"\u003c/div>\u003c/div>","segs":[{"n":55,"text":"The air, 공기는. was filled with, 가득 찼다. a delicious smell, 맛있는 냄새로.. 이 문장 전체를 해석하면, 공기는 맛있는 냄새로 가득 찼다.","hl":"m"},{"n":56,"text":"고기를 굽는 맛있는 냄새가 공기 중에 퍼진 장면이에요. 앞에서 이어진 감각적 묘사를 마무리하는 문장이죠. 수동태 be filled with를 써서 공기가 냄새로 가득 찬 상태를 표현했고, 배고팠던 소년들에게 최고의 날이 된 분위기를 담고 있어요.","hl":"mn"},{"n":57,"text":"첫 번째로 was filled with를 보세요. 주어 The air는 스스로 무언가를 채우는 게 아니라 냄새로 채워지는 대상이니까 수동태를 써야 해요. be filled with는 ~로 가득 차다라는 관용 표현으로 굳어져 있으니 통째로 외워 두면 좋아요. 두 번째로 a delicious smell에서는 형용사 delicious가 명사 smell 앞에서 꾸며 주고 있죠. 영어에서는 형용사가 명사 앞에 온다는 어순을 꼭 확인해 두세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>Salva와 소년들은 먹을 것이 거의 없어 한 달 동안 매우 \u003cb class=\"key\">배고팠다\u003c/b>.\u003c/li>\u003cli>그들은 동물을 사냥하려 했지만 사냥에 너무 \u003cb class=\"key\">서툴렀다\u003c/b>.\u003c/li>\u003cli>3일 동안 굶은 끝에 운좋게 다람쥐를 잡아 불에 \u003cb class=\"key\">구웠다\u003c/b>.\u003c/li>\u003cli>그들은 \u003cb class=\"key\">기쁨\u003c/b>을 숨기지 못했고, 맛있는 냄새가 공기를 가득 채웠다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>After starving for three days, Salva and the boys luckily catch and roast a squirrel, and their joy fills the air.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">먹을 것이 거의 없었기 때문에 그들은 한 달 동안 매우 배가 고팠고, 사냥에 서툴렀지만 3일 동안 굶은 끝에 운좋게 다람쥐를 잡아 불에 구웠다. 그들은 \u003cb class=\"key\">기쁨\u003c/b>을 숨기지 못했고, 맛있는 \u003cb class=\"key\">냄새\u003c/b>가 공기를 가득 채웠다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":58,"text":"정리해 볼게요. 이 글은 배고픔과 사냥 실패라는 문제에서 시작해 다람쥐를 구워 먹는 해결과 기쁨으로 나아가는 이야기예요. However와 Then 같은 신호어, 그리고 소리와 냄새의 감각 묘사를 함께 기억하면 좋습니다. 오늘 수업은 여기까지예요, 끝까지 잘 따라와 주셔서 고맙습니다.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
