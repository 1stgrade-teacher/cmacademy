<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터1 Reading 22 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터1 Reading 22","audioDir":"reading22_audio","preview":false,"count":46,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.668em\">Reading\u003cbr>22\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터1\u003c/div>\u003ch1>Not a Cell Phone, but a Little Book\u003c/h1>\u003ch2>휴대폰이 아니라 작은 책 한 권\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>쇼핑몰에서 돌아오시는 엄마를 기다리던 주인공은 \u003cb class=\"key\">새 \u003c/b>\u003cb class=\"key\">휴대폰\u003c/b>을 선물로 받을 것이라 확신하며 앱과 게임을 상상한다. 그러나 실제로 받은 것은 \u003cb class=\"key\">작은 \u003c/b>\u003cb class=\"key\">책 \u003c/b>\u003cb class=\"key\">한 \u003c/b>\u003cb class=\"key\">권\u003c/b>이었고, 책 안에도 휴대폰은 없었다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The narrator expected a new cell phone but received a little book instead, realizing the gap between expectation and reality.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 특별한 선물을 기다리는 한 아이의 이야기예요. 엄마가 쇼핑몰에서 돌아오시기를 기다리던 아이는 새 휴대폰을 받을 거라고 확신했지만, 실제로 받은 것은 작은 책 한 권이었죠. 기대와 현실이 이렇게 다를 수 있다는 걸 아주 생생하게 보여 주는 글이에요. 요지는 결국 기대했던 선물과 실제로 받은 선물이 달랐다는 것이고, 그 간극을 아이가 천천히 깨달아 간다는 점이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">우리는 흔히 무언가를 간절히 바랄 때 그 결과를 미리 \u003cb class=\"key\">상상\u003c/b>하고, 마치 이미 이루어진 것처럼 느낍니다. 심리학에서는 이를 \u003cb class=\"key\">기대 \u003c/b>\u003cb class=\"key\">효과\u003c/b>(expectation effect)라고 부르는데, 기대가 클수록 실제 결과가 다를 때 느끼는 \u003cb class=\"key\">실망\u003c/b>도 커지기 마련입니다. 비유하자면 시험 전날 만점을 기대했다가 예상보다 낮은 점수를 받았을 때의 허탈함과 비슷하죠. 이 지문의 주인공도 새 휴대폰이라는 큰 기대를 품었기 때문에, 작은 책 한 권을 받았을 때 그 \u003cb class=\"key\">간극\u003c/b>이 더 크게 느껴진 것입니다. 참고로 서사문에서는 인물의 감정 변화와 전환 신호어가 주제를 드러내는 열쇠가 됩니다.\u003c/div>","segs":[{"n":2,"text":"우리는 흔히 무언가를 간절히 바랄 때 그 결과를 미리 상상하고, 마치 이미 이루어진 것처럼 느끼죠. 심리학에서는 이걸 기대 효과, 영어로 expectation effect라고 부르는데, 기대가 클수록 실제 결과가 다를 때 느끼는 실망도 커지기 마련이에요. 비유하자면 시험 전날 만점을 기대했다가 예상보다 낮은 점수를 받았을 때의 그 허탈함과 비슷하죠. 이 지문의 주인공도 새 휴대폰이라는 큰 기대를 품었기 때문에, 작은 책 한 권을 받았을 때 그 간극이 더 크게 느껴졌던 거예요. 그래서 서사문을 읽을 때는 인물의 감정 변화를 함께 따라가 주는 게 중요합니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>기대의 시작\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>주인공은 엄마가 쇼핑몰에서 자신을 위한 \u003cb class=\"key\">특별한 \u003c/b>\u003cb class=\"key\">선물\u003c/b>을 가지고 돌아오시기를 기다리고 있었다. 그는 그 선물이 무엇인지 이미 알고 있다고 꽤 \u003cb class=\"key\">확신\u003c/b>하고 있었다. 아직 받지도 않았는데 마음속으로는 답을 정해 둔 상태였던 것이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>기대의 고조\u003csmall>구체화 · 문장 3–6\u003c/small>\u003c/h4>\u003cp>그는 곧 \u003cb class=\"key\">새 \u003c/b>\u003cb class=\"key\">휴대폰\u003c/b>으로 소통할 수 있다는 생각에 매우 신이 났다. 멋진 \u003cb class=\"key\">앱\u003c/b>을 다운로드하고 싶었고, 모든 앱을 사용하는 꿈을 꾸었다. 친구들과 게임을 하는 \u003cb class=\"key\">상상\u003c/b>까지 하면서 기대는 점점 커져 갔다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>예상 밖의 선물\u003csmall>전환 · 문장 7–8\u003c/small>\u003c/h4>\u003cp>그런데 엄마는 웃으시며 \u003cb class=\"key\">책\u003c/b> 한 권을 건네주셨다. 그는 받은 책의 \u003cb class=\"key\">페이지\u003c/b>를 휙휙 넘겨 보았다. 기대와 전혀 다른 선물에 당황하게 되는 순간이었다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>마지막 희망\u003csmall>반전 · 문장 9–10\u003c/small>\u003c/h4>\u003cp>그는 엄마가 새 휴대폰을 책 안에 \u003cb class=\"key\">숨겼을지도\u003c/b> 모른다고 생각했다. 하지만 그의 선물이 새 휴대폰이 아니라 그저 \u003cb class=\"key\">작은 \u003c/b>\u003cb class=\"key\">책\u003c/b> 한 권이라는 걸 천천히 \u003cb class=\"key\">깨달았다\u003c/b>. 기대가 실망으로 바뀌는 지점이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>확인된 현실\u003csmall>결론 · 문장 11\u003c/small>\u003c/h4>\u003cp>책 안에는 새 휴대폰이 \u003cb class=\"key\">없었다\u003c/b>. 짧은 이 마지막 문장이 글 전체의 결론 역할을 하며, 그의 기대와 \u003cb class=\"key\">현실\u003c/b>이 완전히 다르다는 사실을 확정해 준다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 다섯 단계로 나눠서 살펴볼게요.","hl":null},{"n":4,"text":"먼저 첫 단계는 도입이에요. 주인공은 엄마가 쇼핑몰에서 자신을 위한 특별한 선물을 가지고 돌아오시기를 기다리고 있어요. 그리고 그 선물이 무엇인지 이미 알고 있다고 꽤 확신하고 있죠. 아직 받지도 않았는데 마음속으로는 답을 정해 둔 상태라는 점이 중요해요.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 기대가 본격적으로 커집니다. 곧 새 휴대폰으로 소통할 수 있다는 생각에 매우 신이 나 있고, 멋진 앱을 다운로드하고 싶어 해요. 모든 앱을 사용하는 꿈을 꾸고, 친구들과 게임하는 상상까지 하고 있죠. 이 상상이 길면 길수록 뒤에 오는 반전이 더 크게 다가옵니다.","hl":"f1"},{"n":6,"text":"세 번째 단계에서 분위기가 확 뒤집혀요. 그런데 엄마가 웃으시며 책 한 권을 건네주시는 거예요. 주인공은 받은 책의 페이지를 휙휙 넘기면서 무언가 다른 게 있지 않을까 확인하죠. 기대와 전혀 다른 선물에 당황하는 순간입니다.","hl":"f2"},{"n":7,"text":"네 번째 단계는 마지막 희망을 붙잡는 장면이에요. 주인공은 엄마가 새 휴대폰을 책 안에 숨겼을지도 모른다고 생각해요. 하지만 곧 자신의 선물이 새 휴대폰이 아니라 그저 작은 책 한 권이라는 걸 천천히 깨닫게 되죠. 여기서 아이의 감정이 기대에서 실망으로 바뀝니다.","hl":"f3"},{"n":8,"text":"마지막 단계에서 현실이 완전히 확인돼요. 책 안에는 새 휴대폰이 없었다는 사실이 분명해지죠. 주인공은 자신의 기대와 실제 현실이 다르다는 것을 마침내 받아들이게 됩니다. 이 짧은 마지막 문장이 글 전체의 결론 역할을 해요.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 10번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 사건이 시간의 흐름에 따라 전개되는 \u003cb class=\"key\">시간순\u003c/b> 구성을 띠지만, 그 안에 '기대와 현실'의 \u003cb class=\"key\">대조\u003c/b>가 뚜렷하게 자리한다. 첫 번째부터 여섯 번째 문장까지는 휴대폰에 대한 기대가 고조되다가, 일곱 번째 문장의 however를 기점으로 \u003cb class=\"key\">반전\u003c/b>이 일어난다. 핵심 내용이 마지막에 드러나므로 \u003cb class=\"key\">미괄식\u003c/b> 구조이며, 주제문은 열 번째 문장으로 볼 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>pretty sure (2)\u003c/b>\u003cspan>강한 확신 표현\u003c/span>\u003cb>However (7)\u003c/b>\u003cspan>전환·반전 신호\u003c/span>\u003cb>maybe (9)\u003c/b>\u003cspan>불확실한 추측\u003c/span>\u003cb>But (10)\u003c/b>\u003cspan>대조·깨달음 표시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">a special present\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">what it was\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a new cell phone\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a book\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">just a little book\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>새 휴대폰에 대한 기대\u003c/th>\u003cth>책이라는 현실\u003c/th>\u003c/tr>\u003ctr>\u003ctd>마음속으로 이미 확신하고 상상함\u003c/td>\u003ctd>직접 받은 것은 책 한 권\u003c/td>\u003c/tr>\u003ctr>\u003ctd>앱과 게임을 떠올리며 신이 남\u003c/td>\u003ctd>책 안에도 휴대폰이 없었음\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글의 전개 방식은 시간순 서사이면서 동시에 기대와 현실의 대조를 활용한 구조예요. 처음부터 여섯 번째 문장까지는 기대가 점점 커지고, 일곱 번째 문장의 however를 기점으로 반전이 일어나죠. 핵심이 마지막에 드러나는 미괄식 구조라서 결론 문장까지 집중해서 읽어야 해요. 주제문은 열 번째 문장, 즉 선물이 새 휴대폰이 아니라 작은 책 한 권이었다는 깨달음 부분이라고 볼 수 있습니다.","hl":"ty"},{"n":10,"text":"신호어를 눈여겨보세요. 두 번째 문장의 pretty sure는 주인공의 강한 확신을 보여 주고, 아홉 번째 문장의 maybe는 불확실한 추측을 나타내죠. 그리고 일곱 번째 문장의 however와 열 번째 문장의 but이 기대와 현실을 갈라 놓는 결정적인 전환 신호예요. 또한 special present라는 표현이 a book, just a little book으로 바뀌어 가는 재진술의 흐름도 함께 짚어 두면 좋습니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>wait for\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 기다리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>come back\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>돌아오다\u003c/span>\u003c/div>\u003cdiv>\u003cb>mall\u003c/b>\u003cem>명사\u003c/em>\u003cspan>쇼핑몰\u003c/span>\u003c/div>\u003cdiv>\u003cb>special\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>특별한\u003c/span>\u003c/div>\u003cdiv>\u003cb>present\u003c/b>\u003cem>명사\u003c/em>\u003cspan>선물\u003c/span>\u003c/div>\u003cdiv>\u003cb>pretty\u003c/b>\u003cem>부사\u003c/em>\u003cspan>꽤, 상당히\u003c/span>\u003c/div>\u003cdiv>\u003cb>sure\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>확신하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>thrilled\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>매우 신이 난\u003c/span>\u003c/div>\u003cdiv>\u003cb>soon\u003c/b>\u003cem>부사\u003c/em>\u003cspan>곧\u003c/span>\u003c/div>\u003cdiv>\u003cb>cell phone\u003c/b>\u003cem>명사\u003c/em>\u003cspan>휴대폰\u003c/span>\u003c/div>\u003cdiv>\u003cb>communicate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>소통하다, 의사소통하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>download\u003c/b>\u003cem>동사\u003c/em>\u003cspan>다운로드하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>cool\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>멋진\u003c/span>\u003c/div>\u003cdiv>\u003cb>app\u003c/b>\u003cem>명사\u003c/em>\u003cspan>앱, 응용 프로그램\u003c/span>\u003c/div>\u003cdiv>\u003cb>daydream\u003c/b>\u003cem>동사\u003c/em>\u003cspan>공상하다, 몽상하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>imagine\u003c/b>\u003cem>동사\u003c/em>\u003cspan>상상하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>play games\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>게임을 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>however\u003c/b>\u003cem>부사\u003c/em>\u003cspan>그러나, 하지만\u003c/span>\u003c/div>\u003cdiv>\u003cb>smile\u003c/b>\u003cem>동사\u003c/em>\u003cspan>미소 짓다, 웃다\u003c/span>\u003c/div>\u003cdiv>\u003cb>hand\u003c/b>\u003cem>동사\u003c/em>\u003cspan>건네주다\u003c/span>\u003c/div>\u003cdiv>\u003cb>flip through\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>(책장을) 휙휙 넘기다\u003c/span>\u003c/div>\u003cdiv>\u003cb>page\u003c/b>\u003cem>명사\u003c/em>\u003cspan>페이지, 쪽\u003c/span>\u003c/div>\u003cdiv>\u003cb>maybe\u003c/b>\u003cem>부사\u003c/em>\u003cspan>아마도\u003c/span>\u003c/div>\u003cdiv>\u003cb>hide\u003c/b>\u003cem>동사\u003c/em>\u003cspan>숨기다\u003c/span>\u003c/div>\u003cdiv>\u003cb>inside\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~안에\u003c/span>\u003c/div>\u003cdiv>\u003cb>slowly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>천천히\u003c/span>\u003c/div>\u003cdiv>\u003cb>realize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>깨닫다\u003c/span>\u003c/div>\u003cdiv>\u003cb>just\u003c/b>\u003cem>부사\u003c/em>\u003cspan>그저, 단지\u003c/span>\u003c/div>\u003cdiv>\u003cb>little\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>작은\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"핵심 단어 몇 개만 짚어 볼게요. thrilled는 매우 신이 난이라는 뜻으로 주인공의 들뜬 감정을 담고 있어요. flip through는 책장을 휙휙 넘기다라는 뜻이고, realize는 깨닫다라는 의미죠. hide는 숨기다, inside는 안에라는 뜻이라서 책 안에 휴대폰을 숨겼을지도 모른다는 문장이 자연스럽게 이해됩니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">thrilled\u003c/b>\u003cspan class=\"m\">매우 신이 난\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">excited\u003c/span>\u003cspan class=\"s\">delighted\u003c/span>\u003cspan class=\"s\">elated\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">bored\u003c/span>\u003cspan class=\"a\">indifferent\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">special\u003c/b>\u003cspan class=\"m\">특별한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">unique\u003c/span>\u003cspan class=\"s\">particular\u003c/span>\u003cspan class=\"s\">extraordinary\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ordinary\u003c/span>\u003cspan class=\"a\">common\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">realize\u003c/b>\u003cspan class=\"m\">깨닫다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">notice\u003c/span>\u003cspan class=\"s\">recognize\u003c/span>\u003cspan class=\"s\">understand\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003cspan class=\"a\">overlook\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">hide\u003c/b>\u003cspan class=\"m\">숨기다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">conceal\u003c/span>\u003cspan class=\"s\">cover\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">reveal\u003c/span>\u003cspan class=\"a\">expose\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">sure\u003c/b>\u003cspan class=\"m\">확신하는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">certain\u003c/span>\u003cspan class=\"s\">confident\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unsure\u003c/span>\u003cspan class=\"a\">doubtful\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">slowly\u003c/b>\u003cspan class=\"m\">천천히\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">gradually\u003c/span>\u003cspan class=\"s\">leisurely\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">quickly\u003c/span>\u003cspan class=\"a\">rapidly\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">communicate\u003c/b>\u003cspan class=\"m\">소통하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">connect\u003c/span>\u003cspan class=\"s\">interact\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">isolate\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어도 정리해 볼게요. thrilled는 excited, delighted와 비슷하고 bored와는 반대돼요. special은 unique, particular와 가깝고 ordinary와는 반대죠. realize는 notice, recognize와 비슷하고 ignore와는 반대됩니다. hide는 conceal과 같고 reveal, expose와는 반대라는 점도 기억해 두세요. sure는 certain, confident와 비슷하고 doubtful과 반대됩니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 엄마를 기다리고 있었다\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">waiting\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">my \u003c/span>\u003cspan class=\"tgt\">mom \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">쇼핑몰에서 돌아오시기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">come \u003c/span>\u003cspan class=\"tgt\">back\u003c/span> from the mall\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나를 위한 특별한 선물을 가지고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">special \u003c/span>\u003cspan class=\"tgt\">present \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">me\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 엄마가 나를 위한 특별한 선물을 가지고 쇼핑몰에서 돌아오시길 기다리고 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 주인공이 엄마의 귀가를 \u003cb class=\"key\">기다리는\u003c/b> 장면을 그린 문장이에요. 글의 \u003cb class=\"key\">도입\u003c/b>에서 '특별한 선물'이라는 \u003cb class=\"key\">복선\u003c/b>을 깔아 독자의 기대감을 만듭니다. 아직 선물의 정체가 밝혀지지 않아 뒤 내용이 궁금해지게 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거진행형\u003c/span> : [[주어]] + was/were + [[동사-ing]] : \"기다리고 있었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">wait for + 목적어 + to부정사(목적격보어)\u003c/span> : wait for + [[목적어]] + [[to부정사]] : \"엄마가 돌아오시기를 기다리다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 with의 동반 표현\u003c/span> : with + [[명사구]] : \"나를 위한 특별한 선물을 가지고\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"I was waiting for my mom, 나는 엄마를 기다리고 있었다. to come back from the mall, 쇼핑몰에서 돌아오시기를. with a special present for me, 나를 위한 특별한 선물을 가지고. 이 문장 전체를 해석하면, 나는 엄마가 나를 위한 특별한 선물을 가지고 쇼핑몰에서 돌아오시길 기다리고 있었다.","hl":"m"},{"n":14,"text":"이 문장은 주인공이 엄마의 귀가를 기다리는 장면이에요. 글의 도입에서 특별한 선물이라는 복선을 깔아서 독자의 기대감을 만들어 주죠. 아직 선물이 뭔지 안 알려 주니까 다음 내용이 궁금해지도록 만드는 문장이에요.","hl":"mn"},{"n":15,"text":"첫 번째, was waiting은 과거진행형이에요. be동사 과거형 was에 동사-ing를 붙여서 그때 하고 있던 일을 나타내죠. 두 번째, wait for 다음에 my mom이라는 목적어가 오고 to come back이 이어지면서 목적격보어 구조를 만들어요. 그래서 '엄마가 돌아오시기를 기다리다'가 되는 거예요. 세 번째, with a special present for me에서 with는 '~을 가지고'라는 동반의 뜻으로, 선물을 들고 돌아오는 모습을 그려 주는 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 꽤 확신했다\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">pretty \u003c/span>\u003cspan class=\"tgt\">sure\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내가 알고 있다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">knew\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 무엇인지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">was\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 그것이 무엇인지 알고 있다고 꽤 확신했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 선물이 새 휴대폰이라고 \u003cb class=\"key\">확신\u003c/b>하는 장면이에요. 앞 문장의 기대감을 이어 받으면서 \u003cb class=\"key\">간접의문문\u003c/b>으로 생각의 내용을 보여 주고, 뒤에 올 \u003cb class=\"key\">반전\u003c/b>을 더 크게 만들어 줍니다. 자신감이 클수록 실망도 커지는 구조예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be sure + that절\u003c/span> : [[주어]] + be sure + [[that절]] : \"꽤 확신했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 that (명사절)\u003c/span> : be sure + [[that]] + 주어 + 동사 : \"내가 알고 있다고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">간접의문문\u003c/span> : [[의문사]] + 주어 + 동사 : \"그것이 무엇인지\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"I was pretty sure, 나는 꽤 확신했다. that I knew, 내가 알고 있다고. what it was, 그것이 무엇인지. 이 문장 전체를 해석하면, 나는 그것이 무엇인지 알고 있다고 꽤 확신했다.","hl":"m"},{"n":17,"text":"이 문장은 선물이 새 휴대폰이라고 확신하는 장면이에요. 앞 문장의 기대감을 이어 받으면서 간접의문문으로 생각의 내용을 보여 주죠. 이렇게 자신만만해할수록 뒤에 오는 반전이 더 크게 느껴진답니다.","hl":"mn"},{"n":18,"text":"첫 번째, was pretty sure에서 sure는 '확신하는'이라는 형용사라서 뒤에 that절을 받아 확신의 내용을 채워요. 여기서 pretty는 '꽤'라는 부사라는 것도 같이 기억해 두세요. 두 번째, that I knew의 that은 뒤 문장을 통째로 묶어 주는 명사절 접속사예요. 그래서 '내가 알고 있다고'라는 한 덩어리가 되는 거죠. 세 번째, what it was는 간접의문문이에요. 의문문이 문장 속으로 들어가면 의문사 다음에 주어, 동사 순서로 바뀌기 때문에 what was it이 아니라 what it was가 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 매우 신이 났다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">thrilled\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜냐하면 곧 가지게 될 것이기 때문이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">because \u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">soon \u003c/span>\u003cspan class=\"tgt\">have\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새 휴대폰을\u003c/span>\u003cspan class=\"en\">a new cell phone\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것으로 소통할\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">communicate \u003c/span>\u003cspan class=\"tgt\">with\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">곧 새 휴대폰으로 소통할 수 있게 되어서 매우 신이 났다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 새 휴대폰으로 \u003cb class=\"key\">소통\u003c/b>할 생각에 들뜬 감정을 나타내는 문장이에요. 기대가 \u003cb class=\"key\">최고조\u003c/b>에 이른 지점이라, 뒤에서 책을 건네받는 \u003cb class=\"key\">반전\u003c/b>과 강한 대비를 이룹니다. 감정이 클수록 이야기의 재미가 살아나는 부분이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">감정을 나타내는 형용사\u003c/span> : [[주어]] + be + [[감정형용사]] : \"나는 매우 신이 났다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">감정의 원인을 나타내는 접속사 because\u003c/span> : 감정형용사 + [[because]] + 주어 + 동사 : \"왜냐하면 곧 가지게 될 것이기 때문이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">과거에서 본 미래 (would)\u003c/span> : [[would]] + 동사원형 : \"곧 가지게 될 것이었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : [[명사]] + to부정사 : \"그것으로 소통할\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"I was thrilled, 나는 매우 신이 났다. because I would soon have, 왜냐하면 곧 가지게 될 것이기 때문이다. a new cell phone, 새 휴대폰을. to communicate with!, 그것으로 소통할. 이 문장 전체를 해석하면, 곧 새 휴대폰으로 소통할 수 있게 되어서 매우 신이 났다!","hl":"m"},{"n":20,"text":"이 문장은 새 휴대폰으로 소통할 생각에 들뜬 감정을 나타내요. 기대가 최고조에 이른 지점이라서, 뒤에서 책을 건네받는 반전과 정말 강한 대비를 이루죠. 감정이 크면 클수록 이야기가 더 재미있어지는 부분이에요.","hl":"mn"},{"n":21,"text":"첫 번째, I was thrilled에서 thrilled는 '신이 난'이라는 감정을 나타내는 형용사예요. 감정을 느끼는 사람이 주어일 때 이렇게 씁니다. 두 번째, because I would soon have의 because절은 왜 신이 났는지 그 원인을 설명해 줘요. 세 번째, would soon have는 과거에서 본 미래라서 will 대신 would를 쓴 거예요. soon이 붙어서 '곧'이라는 뜻을 더해 주죠. 네 번째, to communicate with는 앞에 있는 a new cell phone을 뒤에서 꾸며 주는 형용사적 쓰임이에요. with의 목적어가 바로 앞의 cell phone이라는 점도 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 정말 원했다\u003c/span>\u003cspan class=\"en\">I really \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\ n>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 앱을.\u003c/span>\u003cspan class=\"en\">all of the apps.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 모든 앱을 사용하는 꿈을 꾸고 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 휴대전화로 할 수 있는 일을 미리 \u003cb class=\"key\">상상\u003c/b>하며 기대에 젖어 있다는 뜻이에요. daydreaming about using은 단순히 사용한다는 사실이 아니라 사용하는 장면을 머릿속으로 그린다는 느낌이에요. 앞 문장의 다운로드 욕구가 모든 앱 사용으로 확장된 흐름이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거진행형\u003c/span> : was + [daydreaming (현재분사)] : \"꿈꾸고 있었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 about + 동명사\u003c/span> : daydream about + [using (동명사)] : \"사용하는 것에 대해\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"I was daydreaming, 나는 꿈꾸고 있었다. about using, 사용하는 것에 대해. all of the apps, 모든 앱을.. 이 문장 전체를 해석하면, 나는 모든 앱을 사용하는 꿈을 꾸고 있었다.","hl":"m"},{"n":26,"text":"휴대전화로 할 수 있는 일을 미리 상상하며 기대에 젖어 있다는 뜻이에요. daydreaming about using은 단순히 사용한다는 사실이 아니라 사용하는 장면을 머릿속으로 그린다는 느낌이에요. 앞 문장의 다운로드 욕구가 모든 앱 사용으로 확장된 흐름이에요.","hl":"mn"},{"n":27,"text":"첫 번째로 was daydreaming은 과거에 진행 중이던 상상을 나타내는 과거진행형이에요. 두 번째로 about using은 전치사 about 뒤에 동명사 using이 온 구조예요. 전치사 뒤에서는 동사원형이 아니라 동명사를 써야 해서 사용하는 것에 대해라는 의미가 만들어져요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 상상하고 있었다\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">imagining\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">게임하는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">playing \u003c/span>\u003cspan class=\"tgt\">games\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내 친구들과\u003c/span>\u003cspan class=\"en\">with my friends,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또한!\u003c/span>\u003cspan class=\"en\">too!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">친구들과 게임을 하는 상상도 하고 있었다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 친구들과 게임하는 장면까지 머릿속으로 \u003cb class=\"key\">상상\u003c/b>하며 기대가 커진 상태예요. too는 앞의 앱 사용 상상에 게임 상상까지 더해진다는 뜻을 담아요. 새 휴대전화를 받기 전부터 즐거움을 미리 그리는 \u003cb class=\"key\">설렘\u003c/b>이 잘 드러나요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거진행형\u003c/span> : was + [imagining (현재분사)] : \"상상하고 있었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사구(목적어)\u003c/span> : imagine + [playing games (동명사구/목적어)] : \"게임하는 것을\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"I was imagining, 나는 상상하고 있었다. playing games, 게임하는 것을. with my friends, 내 친구들과. too!, 또한!. 이 문장 전체를 해석하면, 친구들과 게임을 하는 상상도 하고 있었다!","hl":"m"},{"n":29,"text":"친구들과 게임하는 장면까지 머릿속으로 상상하며 기대가 커진 상태예요. too는 앞의 앱 사용 상상에 게임 상상까지 더해진다는 뜻을 담아요. 새 휴대전화를 받기 전부터 즐거움을 미리 그리는 설렘이 잘 드러나요.","hl":"mn"},{"n":30,"text":"첫 번째로 was imagining은 과거에 진행 중이던 상상을 나타내는 과거진행형이에요. 두 번째로 playing games는 imagine 뒤에서 게임하는 것을 상상하다의 목적어 역할을 하는 동명사구예요. imagine 뒤에는 동사원형 play가 아니라 playing이 와야 한다는 점을 꼭 기억해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그런데\u003c/span>\u003cspan class=\"en\">However,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">엄마가 웃으시며\u003c/span>\u003cspan class=\"en\">my mom \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">smiled \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 나에게 책 한 권을 건네주셨다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">handed \u003c/span>\u003cspan class=\"tgt\">me \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">book\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그런데 엄마가 웃으시며 한 권의 책을 건네주셨다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 새 휴대폰을 기대하던 화자의 마음과 정반대되는 장면으로, 이야기의 \u003cb class=\"key\">반전\u003c/b>을 알리는 문장이에요. 엄마의 \u003cb class=\"key\">미소\u003c/b>는 장난스러운 분위기를 만들고, a book이라는 표현이 독자의 예상을 깨뜨리죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사의 병렬 구조\u003c/span> : [동사 A] + and + [동사 B] (같은 주어 my mom을 공유) : \"웃으시며 … 건네주셨다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수여동사(4형식) 구문\u003c/span> : hand + [간접목적어(사람)] + [직접목적어(사물)] : \"나에게 책 한 권을 건네주셨다\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"However, 그런데. my mom smiled, 엄마가 웃으시며. and handed me a book, 그리고 나에게 책 한 권을 건네주셨다. 이 문장 전체를 해석하면, 그런데 엄마가 웃으시며 한 권의 책을 건네주셨다.","hl":"m"},{"n":32,"text":"여기서 however가 나오죠? 앞에서는 새 휴대폰을 기대하고 있었는데, 이 문장에서 이야기가 완전히 뒤집혀요. 그래서 이 문장이 글의 반전을 알려 주는 신호예요. 엄마의 미소까지 함께 떠올리면 장면이 훨씬 생생하게 그려질 거예요.","hl":"mn"},{"n":33,"text":"먼저 smiled and handed를 보세요. 주어 my mom 하나에 동사 두 개가 and로 나란히 붙은 병렬 구조예요. 그래서 두 동사 모두 과거형으로 모양을 똑같이 맞춰 줍니다. 두 번째로 handed me a book, 여기서 hand는 수여동사예요. 사람인 간접목적어 me가 먼저 오고, 물건인 직접목적어 a book이 뒤에 오죠. '나에게 책을'이라는 순서, 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 휙휙 넘겼다\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">flipped \u003c/span>\u003cspan class=\"tgt\">through\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 페이지들을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">pages\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 페이지를 휙휙 넘겼다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 책을 받은 화자가 실망과 궁금증 사이에서 페이지를 빠르게 넘기는 \u003cb class=\"key\">행동\u003c/b>을 보여줘요. 혹시 책 속에 뭐가 들어 있지 않을까 하는 \u003cb class=\"key\">기대\u003c/b>가 담긴 동작이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">구동사(동사+전치사)\u003c/span> : flip through + [목적어(the pages)] : \"휙휙 넘기다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">정관사 the의 특정 용법\u003c/span> : the + [복수명사] : \"그 페이지들을\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"I flipped through, 나는 휙휙 넘겼다. the pages, 그 페이지들을. 이 문장 전체를 해석하면, 나는 페이지를 휙휙 넘겼다.","hl":"m"},{"n":35,"text":"책을 건네받은 화자가 페이지를 빠르게 넘겨 보는 장면이에요. 혹시 책 안에 뭐가 숨어 있지 않을까 하는 마음이 담긴 행동이죠. 이 짧은 동작 하나로 화자의 기대가 아직 살아 있다는 게 드러나요.","hl":"mn"},{"n":36,"text":"먼저 flipped through, 이건 동사 flip에 전치사 through가 붙어서 하나의 의미를 만든 구동사예요. 그래서 뒤에 목적어 the pages가 자연스럽게 따라옵니다. 그리고 the pages에서 the는 바로 앞에 나온 a book의 페이지를 다시 가리키는 정관사예요. 이미 나온 대상을 다시 말할 때 the를 쓴다는 점, 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 생각했다\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">thought \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아마 그녀가 숨겼었을지도 모른다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">maybe \u003c/span>\u003cspan class=\"tgt\">she \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">hidden \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내 새 휴대폰을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">my \u003c/span>\u003cspan class=\"tgt\">new \u003c/span>\u003cspan class=\"tgt\">phone \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">책 안에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">inside \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">book\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 그녀가 내 새 휴대폰을 책 안에 숨겼을지도 모른다고 생각했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 책을 받고도 휴대폰에 대한 \u003cb class=\"key\">기대\u003c/b>를 완전히 놓지 못한 화자의 마음이 드러나요. that절 안에 \u003cb class=\"key\">과거완료\u003c/b>를 써서 '책을 건네기 전에 이미 숨겨 두었을 것'이라는 \u003cb class=\"key\">추측\u003c/b>을 담았죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 명사절(목적어)\u003c/span> : think + [that + 주어 + 동사 ~] (that절 = 목적어) : \"…라고 생각했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거완료(대과거)\u003c/span> : had + [과거분사] : \"(그전에) 숨겼었을지도 모른다\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"I thought, 나는 생각했다. that maybe she had hidden, 아마 그녀가 숨겼었을지도 모른다고. my new phone, 내 새 휴대폰을. inside the book, 책 안에. 이 문장 전체를 해석하면, 나는 그녀가 내 새 휴대폰을 책 안에 숨겼을지도 모른다고 생각했다.","hl":"m"},{"n":38,"text":"책을 받았는데도 화자는 아직 휴대폰에 대한 기대를 놓지 못하고 있어요. 혹시 책 안에 진짜 선물이 숨어 있지 않을까 하고 추측하는 장면이죠. 이 문장 하나에 화자의 간절한 마음이 다 담겨 있다고 보면 돼요.","hl":"mn"},{"n":39,"text":"먼저 I thought 뒤에 that절이 통째로 와서 생각의 내용을 채우는 명사절 역할을 해요. that은 해석하지 않고 절을 연결만 해 준다는 점이 핵심입니다. 두 번째로 had hidden, 여기서는 과거완료를 썼어요. 생각한 시점보다 숨긴 일이 더 먼저 일어났기 때문에 대과거로 시간 차이를 표시하는 거예요. 그래서 '숨겼었을지도 모른다'처럼 앞선 시점으로 해석합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만\u003c/span>\u003cspan class=\"en\">But\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 천천히 깨달았다\u003c/span>\u003cspan class=\"en\">I slowly realized\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내 선물이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">my \u003c/span>\u003cspan class=\"tgt\">present \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새 휴대폰이 아니라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">new \u003c/span>\u003cspan class=\"tgt\">cell \u003c/span>\u003cspan class=\"tgt\">phone, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그저 작은 책 한 권이라는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">just \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">little \u003c/span>\u003cspan class=\"tgt\">book\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 내 선물이 새 휴대폰이 아니라 그저 작은 책 한 권이라는 걸 천천히 깨달았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 주인공이 기대했던 \u003cb class=\"key\">새 \u003c/b>\u003cb class=\"key\">휴대폰이 \u003c/b>\u003cb class=\"key\">아니라\u003c/b> 실제 선물은 \u003cb class=\"key\">작은 \u003c/b>\u003cb class=\"key\">책\u003c/b>임을 \u003cb class=\"key\">깨달았다\u003c/b>는 핵심 장면이에요. 앞에서 휴대폰을 기대하던 흐름이 여기서 반전되며, 실망감이 드러납니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that의 명사절(목적어)과 not A, just B\u003c/span> : realize + [that + 주어 + 동사 ...] / not + A, just + B : \"내 선물이 새 휴대폰이 아니라 그저 작은 책 한 권이라는 것\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"But, 하지만. I slowly realized, 나는 천천히 깨달았다. that my present was, 내 선물이. not a new cell phone, 새 휴대폰이 아니라. just a little book, 그저 작은 책 한 권이라는 것을. 이 문장 전체를 해석하면, 하지만 내 선물이 새 휴대폰이 아니라 그저 작은 책 한 권이라는 걸 천천히 깨달았다.","hl":"m"},{"n":41,"text":"이 문장은 주인공이 기대했던 새 휴대폰이 아니라 실제 선물은 작은 책임을 깨달았다는 핵심 장면이에요. 앞에서 휴대폰을 기대하던 흐름이 여기서 반전되며 실망감이 드러납니다.","hl":"mn"},{"n":42,"text":"realize 뒤에 that이 이끄는 that절이 와서 목적어 역할을 해요. 그 안의 not A, just B는 A가 아니라 B라는 대조를 나타내죠. 그래서 새 휴대폰이 아니라 그저 작은 책이라는 해석이 자연스러워요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새 휴대폰이 없었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">new \u003c/span>\u003cspan class=\"tgt\">cell \u003c/span>\u003cspan class=\"tgt\">phone\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">책 안에는\u003c/span>\u003cspan class=\"en\">inside the book!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">책 안에는 새 휴대폰이 없었다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 책 안을 확인했지만 \u003cb class=\"key\">책 \u003c/b>\u003cb class=\"key\">안\u003c/b>에 \u003cb class=\"key\">새 \u003c/b>\u003cb class=\"key\">휴대폰\u003c/b>이 \u003cb class=\"key\">없었다\u003c/b>는 사실을 강조해요. 앞 문장의 깨달음을 다시 한번 확인하며 실망감을 강하게 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">There is/are 구문의 부정\u003c/span> : There + be동사 + not + 주어 + 장소 : \"새 휴대폰이 없었다\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"There was not a new cell phone, 새 휴대폰이 없었다. inside the book!, 책 안에는. 이 문장 전체를 해석하면, 책 안에는 새 휴대폰이 없었다!","hl":"m"},{"n":44,"text":"이 문장은 책 안을 확인했지만 책 안에 새 휴대폰이 없었다는 사실을 강조해요. 앞 문장의 깨달음을 다시 한번 확인하며 실망감을 강하게 보여 줍니다.","hl":"mn"},{"n":45,"text":"There was는 무엇이 있었다는 뜻의 존재 구문이고, 여기에 not이 붙어 이 없었다는 부정의 뜻이 됩니다. be동사 뒤의 a new cell phone은 의미상의 주어 역할을 해요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>주인공은 엄마가 쇼핑몰에서 \u003cb class=\"key\">특별한 \u003c/b>\u003cb class=\"key\">선물\u003c/b>을 가지고 돌아오시기를 기다리며, 그것이 새 휴대폰이라고 확신했다.\u003c/li>\u003cli>그는 곧 새 휴대폰으로 소통할 수 있다는 생각에 \u003cb class=\"key\">매우 \u003c/b>\u003cb class=\"key\">신이 \u003c/b>\u003cb class=\"key\">났고\u003c/b>, 멋진 앱과 친구들과의 게임을 상상했다.\u003c/li>\u003cli>그런데 엄마는 웃으시며 \u003cb class=\"key\">책 \u003c/b>\u003cb class=\"key\">한 \u003c/b>\u003cb class=\"key\">권\u003c/b>을 건네주셨고, 그는 책 안에 휴대폰이 숨겨져 있을지도 모른다고 생각했다.\u003c/li>\u003cli>결국 그는 선물이 새 휴대폰이 아니라 \u003cb class=\"key\">작은 \u003c/b>\u003cb class=\"key\">책 \u003c/b>\u003cb class=\"key\">한 \u003c/b>\u003cb class=\"key\">권\u003c/b>임을 깨달았고, 책 안에는 휴대폰이 없었다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The narrator expected a new cell phone but received a little book instead, realizing the gap between expectation and reality.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">쇼핑몰에서 돌아오시는 엄마를 기다리던 주인공은 \u003cb class=\"key\">새 \u003c/b>\u003cb class=\"key\">휴대폰\u003c/b>을 선물로 받을 것이라 확신하며 앱과 게임을 상상한다. 그러나 실제로 받은 것은 \u003cb class=\"key\">작은 \u003c/b>\u003cb class=\"key\">책 \u003c/b>\u003cb class=\"key\">한 \u003c/b>\u003cb class=\"key\">권\u003c/b>이었고, 책 안에도 휴대폰은 없었다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":46,"text":"정리해 볼게요. 이 글은 새 휴대폰을 기대한 주인공이 작은 책 한 권을 받고 기대와 현실의 차이를 깨닫는 이야기예요. however와 but 같은 전환 신호를 중심으로 감정의 변화를 따라 읽는 것이 핵심입니다. 여러분도 글을 읽을 때 인물이 무엇을 기대했고 실제로 무엇을 얻었는지 비교해 보세요. 오늘 수업도 수고 많았고, 다음에 또 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
