<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터1 Reading 27 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터1 Reading 27","audioDir":"27_audio","preview":false,"count":48,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.668em\">Reading\u003cbr>27\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터1\u003c/div>\u003ch1>Find Safe Drinking Water First to Survive\u003c/h1>\u003ch2>생존을 위해 안전한 물을 먼저 찾아라\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>무인도에서 생존하려면 가장 먼저 \u003cb class=\"key\">마실 \u003c/b>\u003cb class=\"key\">물\u003c/b>을 찾아야 한다. 시냇물과 강물의 \u003cb class=\"key\">질병\u003c/b> 위험을 주의하고, \u003cb class=\"key\">빗물\u003c/b>과 코코넛·과일 속 수분을 활용해 \u003cb class=\"key\">안전한 \u003c/b>\u003cb class=\"key\">물\u003c/b>을 확보해야 한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>To survive on a desert island, find safe drinking water first and use reliable sources such as rainwater and moisture in foods.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 무인도에서 생존하는 상황을 다룬 짧은 글을 함께 읽어 볼 거예요. 이 글은 무인도에 혼자 남았을 때 무엇을 먼저 해야 하는지 질문하고, 가장 먼저 마실 물을 찾아야 한다고 말해요. 핵심은 물의 중요성과 안전한 물을 찾는 구체적인 방법이고, 전체 요지는 생존을 위해 안전한 물을 먼저 확보하라는 것이죠.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">무인도 생존(survival)에서 가장 먼저 해결할 문제는 \u003cb class=\"key\">물\u003c/b>이다. 인간은 음식 없이도 수 주일 버틸 수 있지만 물 없이는 며칠 안에 \u003cb class=\"key\">탈수\u003c/b>(dehydration)로 위험해질 수 있다. 몸의 수분은 체온 조절과 노폐물 배출에 쓰이므로, 물 부족은 혈액 순환과 장기 기능을 빠르게 떨어뜨린다. 시냇물이나 강물은 겉보기에 깨끗해도 \u003cb class=\"key\">병원체\u003c/b>(pathogen)나 질병을 옮길 수 있어 주의해야 한다. 빗물이나 코코넛·과일 속 수분은 비교적 안전한 대안이 될 수 있다. 마치 등산 중 물을 다 마셨을 때 가장 먼저 식수대를 찾는 것처럼, 생존 상황에서도 \u003cb class=\"key\">안전한 \u003c/b>\u003cb class=\"key\">물\u003c/b> 확보가 첫걸음이다.\u003c/div>","segs":[{"n":2,"text":"무인도 생존에서는 가장 먼저 물이 문제예요. 사람은 음식 없이도 수 주일을 버틸 수 있지만 물 없이는 며칠 만에 탈수로 위험해질 수 있죠. 몸의 수분은 체온 조절과 노폐물 배출에 꼭 필요해서, 물이 부족하면 장기 기능이 빠르게 떨어져요. 시냇물이나 강물은 겉으로 깨끗해 보여도 병원체나 질병을 옮길 수 있으니 조심해야 해요. 빗물이나 코코넛과 과일 속 수분은 좋은 대안이 될 수 있고요. 등산 중 물을 다 마셨을 때 식수대를 먼저 찾는 것처럼, 생존 상황에서도 안전한 물 확보가 첫걸음이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>상황 제시와 질문\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>무인도에 혼자 남는 상황을 상상하게 하는 \u003cb class=\"key\">도입\u003c/b>으로 시작한다(1). 이어 가장 먼저 할 일을 질문하고(2), 'SOS sign'이나 'food' 찾기 같은 일반적 답을 제시해 독자의 예상을 이끈다(3). 아직 글쓴이의 주장은 나오지 않고, 뒤에서 제시될 \u003cb class=\"key\">마실 \u003c/b>\u003cb class=\"key\">물\u003c/b> 주장과 대비될 배경을 만든다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>물을 먼저 찾자는 주장\u003csmall>주장·근거 · 문장 4–6\u003c/small>\u003c/h4>\u003cp>글쓴이는 일반적 답과 달리 \u003cb class=\"key\">마실 \u003c/b>\u003cb class=\"key\">물\u003c/b>을 먼저 찾자고 제안한다(4). 물이 생존을 돕는 가장 중요한 것임을 밝히고(5), 몸에 충분한 물이 없으면 사흘 만에도 죽을 수 있다는 \u003cb class=\"key\">근거\u003c/b>를 든다(6). 이로써 물 확보가 생존의 첫 조건임을 분명히 한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>안전한 물이라는 기준\u003csmall>전제·강조 · 문장 7\u003c/small>\u003c/h4>\u003cp>앞의 생존 근거를 바탕으로 \u003cb class=\"key\">안전한 \u003c/b>\u003cb class=\"key\">물\u003c/b>을 찾아야 한다고 강조한다. 물을 구하는 것 자체보다 마시기에 안전한지가 핵심 \u003cb class=\"key\">전제\u003c/b>임을 밝힌다. 이 문장이 뒤에 이어질 구체적 \u003cb class=\"key\">조언\u003c/b>의 기준을 세워 준다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>물 찾기 조언과 결론\u003csmall>해결·예시·결론 · 문장 8–13\u003c/small>\u003c/h4>\u003cp>깨끗한 마실 물을 찾는 \u003cb class=\"key\">조언\u003c/b>을 제시한다(8). 시냇물·강물은 대체로 안전하지만 \u003cb class=\"key\">질병\u003c/b>이 있을 수 있고(9-10), \u003cb class=\"key\">빗물\u003c/b>을 저장하거나 코코넛·과일 속 수분을 활용하라고 한다(11-12). 마지막으로 조언을 \u003cb class=\"key\">명심\u003c/b>하면 무인도에서 더 안전해질 것이라고 마무리한다(13).\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 무인도에서 무엇을 먼저 할지 묻는 도입에서 시작해, 물을 먼저 찾자는 주장과 구체적인 조언으로 이어져요.","hl":null},{"n":4,"text":"첫 단계는 상황을 상상하게 하는 도입이에요. 무인도에 혼자 머물러야 한다고 상상해 보라고 하죠. 그리고 가장 먼저 무엇을 하겠냐고 질문한 뒤, SOS sign을 만들거나 음식을 찾겠다고 답할 수 있다고 말해요. 이렇게 독자의 예상을 열어 두고, 뒤에서 나올 마실 물 주장과 대비되는 배경을 만들어 줍니다.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 글쓴이가 But을 쓰며 주장을 전환해요. SOS sign이나 음식 찾기 대신 마실 물을 먼저 찾자고 제안하죠. 그리고 물이 생존을 돕는 가장 중요한 것이라고 말하고, 몸에 충분한 물이 없으면 사흘 만에도 죽을 수 있다는 근거를 제시해요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 안전한 물을 찾아야 한다는 전제를 세우는 부분이에요. 앞에서 물이 생존에 필수라고 했으니, 이제는 마시기에 안전한 물이어야 한다고 강조하죠. 이 기준이 뒤에 나오는 구체적인 조언들을 이끌어 줍니다.","hl":"f2"},{"n":7,"text":"네 번째 단계에서는 깨끗한 마실 물을 찾는 구체적인 조언이 나와요. 시냇물이나 강물은 대체로 안전하지만 질병이 있을 수 있다고 주의를 주고, 빗물을 저장하거나 코코넛과 과일 속 수분을 활용하라고 해요. 마지막으로 이런 조언을 명심하면 무인도에서 더 안전해질 것이라고 정리하죠.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 4번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">도입에서 무인도 상황과 일반적 답을 제시한 뒤, 네 번째 문장에서 \u003cb class=\"key\">마실 \u003c/b>\u003cb class=\"key\">물\u003c/b>을 먼저 찾자는 주장을 내세운다. 이후 물의 중요성과 \u003cb class=\"key\">생존\u003c/b> 근거를 제시하고, \u003cb class=\"key\">안전한 \u003c/b>\u003cb class=\"key\">물\u003c/b>을 찾는 구체적 \u003cb class=\"key\">조언\u003c/b>으로 문제를 해결한다. 따라서 문제 제기 뒤 해결책을 제시하는 \u003cb class=\"key\">문제-해결\u003c/b> 전개이며, 핵심 주장이 앞부분에 놓인 \u003cb class=\"key\">두괄식\u003c/b>으로 볼 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>But (4)\u003c/b>\u003cspan>전환·주장\u003c/span>\u003cb>For this reason (7)\u003c/b>\u003cspan>이유·결론\u003c/span>\u003cb>Here are (8)\u003c/b>\u003cspan>조언 제시\u003c/span>\u003cb>First (9)\u003c/b>\u003cspan>첫째 나열\u003c/span>\u003cb>Second (11)\u003c/b>\u003cspan>둘째 나열\u003c/span>\u003cb>Third (12)\u003c/b>\u003cspan>셋째 나열\u003c/span>\u003cb>If (13)\u003c/b>\u003cspan>조건·결론\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">water to drink\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">water\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">safe to drink\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">clean drinking water\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">drinkable\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">safer\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>일반적 예상\u003c/th>\u003cth>글쓴이 주장\u003c/th>\u003c/tr>\u003ctr>\u003ctd>SOS sign·food 찾기\u003c/td>\u003ctd>마실 물 먼저 찾기\u003c/td>\u003c/tr>\u003ctr>\u003ctd>즉각적 행동\u003c/td>\u003ctd>생존을 위한 필수 조건\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 문제 제기 뒤에 해결책을 제시하는 문제-해결 전개예요. 무인도에서 무엇을 먼저 할지라는 문제를 던진 뒤, 네 번째 문장에서 마실 물을 먼저 찾자는 주장을 내세우죠. 그리고 물의 중요성과 생존 근거를 제시한 다음, 안전한 물을 찾는 조언으로 해결책을 구체화해요. 핵심 주장이 도입 뒤 앞부분에 놓이므로 두괄식으로 볼 수 있습니다.","hl":"ty"},{"n":9,"text":"신호어를 보면 흐름이 잘 보여요. 네 번째 문장의 But은 일반적인 예상과 글쓴이의 주장을 대조해 주는 전환이에요. 일곱 번째 문장의 For this reason은 앞의 생존 근거를 받아 안전한 물을 찾아야 한다는 결론으로 이어 주죠. 그리고 First, Second, Third가 구체적인 조언을 순서대로 나열하고, water to drink와 drinkable처럼 같은 개념을 바꿔 말하는 재진술도 확인할 수 있어요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>imagine\u003c/b>\u003cem>동사\u003c/em>\u003cspan>상상하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>alone\u003c/b>\u003cem>부사\u003c/em>\u003cspan>혼자서\u003c/span>\u003c/div>\u003cdiv>\u003cb>desert island\u003c/b>\u003cem>명사\u003c/em>\u003cspan>무인도\u003c/span>\u003c/div>\u003cdiv>\u003cb>maybe\u003c/b>\u003cem>부사\u003c/em>\u003cspan>아마도\u003c/span>\u003c/div>\u003cdiv>\u003cb>sign\u003c/b>\u003cem>명사\u003c/em>\u003cspan>표지, 사인\u003c/span>\u003c/div>\u003cdiv>\u003cb>find\u003c/b>\u003cem>동사\u003c/em>\u003cspan>찾다\u003c/span>\u003c/div>\u003cdiv>\u003cb>food\u003c/b>\u003cem>명사\u003c/em>\u003cspan>음식\u003c/span>\u003c/div>\u003cdiv>\u003cb>suggest\u003c/b>\u003cem>동사\u003c/em>\u003cspan>제안하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>water\u003c/b>\u003cem>명사\u003c/em>\u003cspan>물\u003c/span>\u003c/div>\u003cdiv>\u003cb>drink\u003c/b>\u003cem>동사\u003c/em>\u003cspan>마시다\u003c/span>\u003c/div>\u003cdiv>\u003cb>important\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>중요한\u003c/span>\u003c/div>\u003cdiv>\u003cb>survive\u003c/b>\u003cem>동사\u003c/em>\u003cspan>생존하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>enough\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>충분한\u003c/span>\u003c/div>\u003cdiv>\u003cb>die\u003c/b>\u003cem>동사\u003c/em>\u003cspan>죽다\u003c/span>\u003c/div>\u003cdiv>\u003cb>reason\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이유\u003c/span>\u003c/div>\u003cdiv>\u003cb>safe\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>안전한\u003c/span>\u003c/div>\u003cdiv>\u003cb>tip\u003c/b>\u003cem>명사\u003c/em>\u003cspan>조언, 요령\u003c/span>\u003c/div>\u003cdiv>\u003cb>clean\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>깨끗한\u003c/span>\u003c/div>\u003cdiv>\u003cb>stream\u003c/b>\u003cem>명사\u003c/em>\u003cspan>시냇물\u003c/span>\u003c/div>\u003cdiv>\u003cb>river\u003c/b>\u003cem>명사\u003c/em>\u003cspan>강\u003c/span>\u003c/div>\u003cdiv>\u003cb>usually\u003c/b>\u003cem>부사\u003c/em>\u003cspan>대부분, 보통\u003c/span>\u003c/div>\u003cdiv>\u003cb>remember\u003c/b>\u003cem>동사\u003c/em>\u003cspan>기억하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>disease\u003c/b>\u003cem>명사\u003c/em>\u003cspan>질병\u003c/span>\u003c/div>\u003cdiv>\u003cb>save\u003c/b>\u003cem>동사\u003c/em>\u003cspan>저장하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>rainwater\u003c/b>\u003cem>명사\u003c/em>\u003cspan>빗물\u003c/span>\u003c/div>\u003cdiv>\u003cb>drinkable\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>마실 수 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>coconut\u003c/b>\u003cem>명사\u003c/em>\u003cspan>코코넛\u003c/span>\u003c/div>\u003cdiv>\u003cb>fruit\u003c/b>\u003cem>명사\u003c/em>\u003cspan>과일\u003c/span>\u003c/div>\u003cdiv>\u003cb>keep in mind\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>명심하다\u003c/span c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">recall\u003c/span>\u003cspan class=\"s\">keep in mind\u003c/span>\u003cspan class=\"s\">bear in mind\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">forget\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">clean\u003c/b>\u003cspan class=\"m\">깨끗한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">pure\u003c/span>\u003cspan class=\"s\">clear\u003c/span>\u003cspan class=\"s\">uncontaminated\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">dirty\u003c/span>\u003cspan class=\"a\">polluted\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">find\u003c/b>\u003cspan class=\"m\">찾다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">discover\u003c/span>\u003cspan class=\"s\">locate\u003c/span>\u003cspan class=\"s\">search out\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">lose\u003c/span>\u003cspan class=\"a\">miss\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">suggest\u003c/b>\u003cspan class=\"m\">제안하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">propose\u003c/span>\u003cspan class=\"s\">recommend\u003c/span>\u003cspan class=\"s\">advise\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">oppose\u003c/span>\u003cspan class=\"a\">reject\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"시험에 자주 나오는 어휘도 동의어와 반의어로 정리해 볼게요. survive의 동의어는 endure, outlast, live through이고 반의어는 die, perish예요. important는 essential, crucial, significant와 가깝고, safe는 secure, protected, harmless와 가까워요. enough의 동의어는 sufficient, adequate, ample이고 반의어는 insufficient, lacking이에요. remember는 recall, keep in mind와 바꿔 쓸 수 있고, clean은 pure, clear, uncontaminated와 연결해 기억하면 좋아요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상상해 보라\u003c/span>\u003cspan class=\"en\">Imagine\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 혼자 머물러야 한다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">stay \u003c/span>\u003cspan class=\"tgt\">alone \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무인도에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">desert \u003c/span>\u003cspan class=\"tgt\">island\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">무인도에 혼자 머물러야 한다고 상상해 보라.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 독자에게 무인도라는 \u003cb class=\"key\">가상 \u003c/b>\u003cb class=\"key\">상황\u003c/b>을 던지며 글을 여는 문장이에요. 'Imagine that ~'은 상대를 문제 상황 속으로 끌어들여 흥미를 유발하는 \u003cb class=\"key\">도입 \u003c/b>\u003cb class=\"key\">표현\u003c/b>이죠. desert는 '사막'이 아니라 '사람이 살지 않는'이라는 뜻이라서 desert island가 \u003cb class=\"key\">무인도\u003c/b>가 된다는 점도 꼭 기억해야 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that의 명사절(타동사의 목적어)\u003c/span> : Imagine [타동사] + [that + 주어 + 동사 ~ (명사절/목적어)] : \"당신이 무인도에 혼자 머물러야 한다고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 have to(의무)\u003c/span> : have to + [동사원형] : \"머물러야 한다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Imagine, 상상해 보라. that you have to stay alone, 당신이 혼자 머물러야 한다고. on a desert island, 무인도에. 이 문장 전체를 해석하면, 무인도에 혼자 머물러야 한다고 상상해 보라.","hl":"m"},{"n":13,"text":"이 문장은 글의 도입부예요. 무인도에 혼자 남겨진 가상 상황을 제시하면서 독자의 흥미를 끄는 도입 표현이죠. 여기서 desert는 사막이 아니라 사람이 살지 않는이라는 뜻이라서 desert island는 무인도라는 점도 꼭 챙겨 두세요.","hl":"mn"},{"n":14,"text":"어법 포인트는 두 가지예요. 첫째, Imagine 뒤에 that이 나오면 목적어 역할을 하는 명사절이 시작돼요. that절 안에는 you have to stay처럼 주어와 동사가 다 들어 있는 완전한 문장이 와요. 둘째, have to는 의무를 나타내는 준조동사라서 뒤에 반드시 동사원형 stay가 와요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무엇을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">What \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은 하겠는가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">do\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가장 먼저\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">first\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여러분은 가장 먼저 무엇을 하겠는가?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 도입 상황에 이어 독자에게 \u003cb class=\"key\">질문\u003c/b>을 던져 스스로 생각하게 만드는 문장이에요. would는 현실이 아닌 \u003cb class=\"key\">가정 \u003c/b>\u003cb class=\"key\">상황\u003c/b> 속 대답을 이끌어 내는 표현이죠. first는 '첫 번째로'가 아니라 '\u003cb class=\"key\">가장 \u003c/b>\u003cb class=\"key\">먼저\u003c/b>'로 해석하는 게 자연스러워요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문사 도치(의문사 + 조동사 + 주어 + 동사)\u003c/span> : [의문사 What] + [조동사 would] + [주어 you] + [동사원형 do]? : \"여러분은 무엇을 하겠는가\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부사 first(시간적 순서)\u003c/span> : [first] = 가장 먼저, 첫 번째로 : \"가장 먼저\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"What, 무엇을. would you do, 여러분은 하겠는가. first?, 가장 먼저. 이 문장 전체를 해석하면, 여러분은 가장 먼저 무엇을 하겠는가?","hl":"m"},{"n":16,"text":"이 문장은 독자에게 질문을 던져 스스로 생각해 보게 만드는 역할이에요. would는 가정 상황에 대한 상상을 이끌어 내는 표현이고, first는 첫 번째로가 아니라 가장 먼저라고 해석해야 자연스러워요. 질문 하나로 독자를 글 안으로 끌어들이는 거죠.","hl":"mn"},{"n":17,"text":"어법 포인트는 두 가지예요. 첫째, What이 목적어 역할로 앞에 나가면 조동사가 주어 앞으로 오는 도치가 일어나요. 그래서 What would you do 순서가 되는 거죠. 둘째, first는 여기서 형용사가 아니라 순서를 나타내는 부사로 쓰여서 가장 먼저라고 해석해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은 말할지도 모른다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Maybe\u003c/span> you would say,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">SOS 사인을 만들어라\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">Make \u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">SOS \u003c/span>\u003cspan class=\"tgt\">sign\u003c/span>,&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또는 음식 좀 찾아라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">or\u003c/span> &quot;Find some food.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여러분은 ‘SOS 사인 만들기’ 또는 ‘음식 찾기’라고 대답할지도 모른다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞의 질문에 대해 독자가 할 법한 \u003cb class=\"key\">예상 \u003c/b>\u003cb class=\"key\">답변\u003c/b>을 먼저 제시하는 문장이에요. Maybe와 would를 함께 써서 '아마 ~라고 말할지도 모른다'는 \u003cb class=\"key\">추측\u003c/b>의 어조를 만들어 내죠. 인용부호 안의 Make와 Find는 모두 \u003cb class=\"key\">명령문\u003c/b> 형태지만, 해석할 때는 '만들기', '찾기'처럼 명사구로 옮겨요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부사 Maybe(추측)\u003c/span> : [Maybe] + [주어 + 조동사 + 동사 ~] : \"아마 ~일지도 모른다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명령문(동사원형으로 시작)\u003c/span> : [동사원형 Make] + [목적어 an SOS sign] : \"SOS 사인을 만들어라\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">등위접속사 or(선택)\u003c/span> : [A] or [B] = A 또는 B : \"또는\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Maybe you would say, 여러분은 말할지도 모른다. \"Make an SOS sign,\", SOS 사인을 만들어라. or \"Find some food.\", 또는 음식 좀 찾아라. 이 문장 전체를 해석하면, 여러분은 ‘SOS 사인 만들기’ 또는 ‘음식 찾기’라고 대답할지도 모른다.","hl":"m"},{"n":19,"text":"이 문장은 앞의 질문에 대해 독자가 할 법한 예상 답변을 먼저 꺼내 놓는 역할이에요. Maybe와 would를 함께 써서 아마 그럴지도 모른다는 추측의 어조를 만들고 있죠. 그리고 인용부호 안의 말들은 명령문이지만 우리말로는 만들기, 찾기처럼 명사구로 옮겨서 해석해요.","hl":"mn"},{"n":20,"text":"어법 포인트는 세 가지예요. 첫째, Maybe는 문장 앞에서 추측의 태도를 더하는 부사예요. would와 만나면 아마 그렇게 말할지도 모른다는 공손한 추측이 되죠. 둘째, 인용부호 안의 Make와 Find는 동사원형으로 시작하는 명령문이고, 여기서는 명사구처럼 해석돼요. 셋째, or가 두 명령문을 대등하게 연결해서 선택 관계를 만들어 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나\u003c/span>\u003cspan class=\"en\">But\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 추천한다\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">suggest \u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분이 마실 물을 좀 찾기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">find\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">some \u003c/span>\u003cspan class=\"tgt\">water \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">drink\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가장 먼저\u003c/span>\u003cspan class=\"en\">first.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 나는 여러분이 가장 먼저 마실 물을 찾는 것을 추천한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 나온 예상, 즉 SOS sign이나 food를 But으로 뒤집으면서 글쓴이의 \u003cb class=\"key\">주장\u003c/b>을 꺼내는 문장이에요. suggest that절을 써서 '먼저 마실 물을 찾으라'는 의견을 정중하게 제시하죠. water to drink는 '마실 물'이라는 뜻으로 \u003cb class=\"key\">to부정사\u003c/b>가 water를 뒤에서 꾸며 주는 구조예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">제안·요구 동사 suggest + that절 (should 생략)\u003c/span> : suggest + [that + 주어 + (should) + 동사원형] : \"여러분이 (물을) 찾기를 추천한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법 (명사 수식)\u003c/span> : [명사 water] + [to drink (to부정사구/형용사적 용법)] : \"마실 물\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"But, 그러나. I suggest that, 나는 추천한다. you find some water to drink, 여러분이 마실 물을 좀 찾기를. first, 가장 먼저. 이 문장 전체를 해석하면, 그러나 나는 여러분이 가장 먼저 마실 물을 찾는 것을 추천한다.","hl":"m"},{"n":22,"text":"앞 문장에서 나온 예상, 즉 SOS sign이나 food를 But으로 뒤집으면서 글쓴이의 주장을 꺼내는 문장이에요. suggest that절을 써서 '먼저 마실 물을 찾으라'는 의견을 정중하게 제시하죠. water to drink는 '마실 물'이라는 뜻으로 to부정사가 water를 뒤에서 꾸며 주는 구조예요.","hl":"mn"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">물은\u003c/span>\u003cspan class=\"en\">Water\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가장 중요한 것이다\u003c/span>\u003cspan class=\"en\">is \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">most \u003c/span>\u003cspan class=\"tgt\">important \u003c/span>\u003cspan class=\"tgt\">thing\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분이 생존하도록 돕는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">help \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">survive\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">물은 여러분이 생존하도록 돕는 가장 중요한 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 물이 생존에 가장 중요한 요소라는 점을 최상급 표현으로 못 박는 \u003cb class=\"key\">중심 \u003c/b>\u003cb class=\"key\">문장\u003c/b>이에요. to help you survive가 thing을 꾸며 주면서 물의 \u003cb class=\"key\">역할\u003c/b>을 구체적으로 밝혀 주죠. 바로 다음 문장에서 물이 없을 때 벌어지는 일을 근거로 제시하게 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">최상급 형용사에 의한 명사 수식\u003c/span> : the + most + [형용사 important] + [명사 thing] : \"가장 중요한 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법 (명사 수식)\u003c/span> : [명사 thing] + [to help (to부정사구/형용사적 용법)] : \"여러분이 생존하도록 돕는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">help + 목적어 + 동사원형\u003c/span> : help + [목적어 you] + [동사원형 survive] : \"여러분이 생존하도록 돕다\"\u003c/div>\u003c/div>","segs":[{"n":23,"text":"Water, 물은. is the most important thing, 가장 중요한 것이다. to help you survive, 여러분이 생존하도록 돕는. 이 문장 전체를 해석하면, 물은 여러분이 생존하도록 돕는 가장 중요한 것이다.","hl":"m"},{"n":24,"text":"물이 생존에 가장 중요한 요소라는 점을 최상급 표현으로 못 박는 중심 문장이에요. to help you survive가 thing을 꾸며 주면서 물의 역할을 구체적으로 밝혀 주죠. 바로 다음 문장에서 물이 없을 때 벌어지는 일을 근거로 제시하게 됩니다.","hl":"mn"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약에 충분한 물이 없다면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">If \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspa  enough water, 만약에 충분한 물이 없다면. in your body, 몸에. you will die, 여러분은 죽을 것이다. even in just three days, 심지어 단지 사흘 만에도. 이 문장 전체를 해석하면, 만약에 몸에 충분한 물이 없다면, 여러분은 심지어 3일 만에도 죽을 것이다.","hl":"m"},{"n":26,"text":"앞 문장에서 말한 물의 중요성을 if 조건절과 결과로 뒷받침하는 근거 문장이에요. 사흘처럼 아주 짧은 시간에 even을 붙여 위험의 심각성을 강조하죠. 그래서 다음 문장의 '안전한 물을 찾아야 한다'는 결론으로 자연스럽게 이어집니다.","hl":"mn"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 이유 때문에,\u003c/span>\u003cspan class=\"en\">For this reason,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은 물을 찾아야 한다\u003c/span>\u003cspan class=\"en\">you \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">must \u003c/span>\u003cspan class=\"tgt\">find\u003c/span> water\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마시기에 안전한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">safe \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">drink\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이러한 이유 때문에, 여러분은 마시기에 안전한 물을 찾아야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 물이 생존에 가장 중요하다고 했으니, 그래서 안전한 물을 찾아야 한다고 말하는 문장이에요. must가 들어 있어서 단순한 권유가 아니라 꼭 해야 하는 \u003cb class=\"key\">강한 \u003c/b>\u003cb class=\"key\">필요\u003c/b>를 나타내죠. 뒤에 붙은 \u003cb class=\"key\">that절\u003c/b>이 어떤 물인지 구체적으로 알려 주는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 must (강한 의무)\u003c/span> : [주어] + must + [동사원형 find] : \"반드시 찾아야 한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan >\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 명사절(목적어)\u003c/span> : remember + [that + 주어 + 동사 + 목적어 + 전치사구] : \"그 안에 여전히 질병이 있을 수 있다는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 + 대명사(지칭)\u003c/span> : [전치사] + [대명사] : \"그 안에\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"But, 그러나. you should remember, 당신은 기억해야 한다. that it may still have, 그 안에 여전히 있을 수 있다는 것을. some diseases in it, 약간의 질병이 그 안에. 이 문장 전체를 해석하면, 그러나 여기에도 질병이 있을 수 있다는 것을 기억해야 한다.","hl":"m"},{"n":37,"text":"이 문장은 앞에서 강물이 대체로 안전하다고 말한 바로 다음에 나와요. 그래서 안전하다고 끝내지 않고 질병이 있을 수도 있다는 주의를 덧붙이는 거죠. 여기서 it이 무엇을 가리키는지, 바로 앞에 나온 강물이라는 점을 꼭 확인하세요.","hl":"mn"},{"n":38,"text":"첫 번째, should remember에서 should는 당위를 나타내는 조동사예요. 그래서 뒤에는 반드시 동사원형 remember가 옵니다. 두 번째, remember 뒤의 that은 명사절을 이끄는 접속사로 목적어 역할을 하고요. 세 번째, in it의 it은 앞에 나온 물을 가리키는 지칭 대명사라는 것도 챙겨 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">둘째,\u003c/span>\u003cspan class=\"en\">Second,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">빗물을 좀 저장해라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">save \u003c/span>\u003cspan class=\"tgt\">some \u003c/span>\u003cspan class=\"tgt\">rainwater\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜냐하면 그것은 마실 수 있으니까\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">because \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">drinkable\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">둘째, 빗물은 마실 수 있으므로 빗물을 저장해라.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 두 번째 팁으로 빗물을 저장하라고 권하는 문장이에요. 왜 저장해야 하는지 \u003cb class=\"key\">이유\u003c/b>를 because로 붙여 분명히 밝혀 주고 있죠. it은 앞에 나온 rainwater를 그대로 받습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문(동사원형으로 시작)\u003c/span> : [동사원형] + [목적어] : \"빗물을 좀 저장해라\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이유를 나타내는 접속사 because\u003c/span> : [명령문] + because + [주어 + 동사 + 형용사] : \"왜냐하면 그것은 마실 수 있으니까\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">be동사 + 형용사(서술적 용법)\u003c/span> : [주어] + be동사 + [형용사] : \"마실 수 있다\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"Second, 둘째. save some rainwater, 빗물을 좀 저장해라. because it is drinkable, 왜냐하면 그것은 마실 수 있으니까. 이 문장 전체를 해석하면, 둘째, 빗물은 마실 수 있으므로 빗물을 저장해라.","hl":"m"},{"n":40,"text":"두 번째 팁으로 빗물을 저장하라고 권하는 문장이에요. 왜 저장해야 하는지 이유를 because로 붙여서 분명히 밝혀 주고 있습니다. 여기서 it은 바로 앞에 나온 rainwater를 그대로 받는다는 점도 기억해 두세요.","hl":"mn"},{"n":41,"text":"첫 번째, save로 시작하는 명령문이에요. 명령문은 주어 you를 생략하고 동사원형으로 시작하죠. 두 번째, because는 이유를 이끄는 접속사로 뒤에 절이 통째로 옵니다. 세 번째, drinkable은 drink에 able이 붙어 마실 수 있는이라는 뜻을 가진 형용사이고, be동사 뒤에서 주어의 성질을 설명하고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">셋째,\u003c/span>\u003cspan class=\"en\">Third,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">물이 좀 있습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">some \u003c/span>\u003cspan class=\"tgt\">water\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 음식 안에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">many \u003c/span>\u003cspan class=\"tgt\">foods\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">코코넛과 과일 같은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">such \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">coconuts \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">fruit\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">셋째, 코코넛이나 과일과 같은 많은 음식에는 물이 들어 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 세 번째 팁으로 음식 속에 들어 있는 물을 활용하라는 내용이에요. 코코넛과 과일을 구체적인 \u003cb class=\"key\">예\u003c/b>로 들어 이해를 돕고 있죠. 앞의 두 팁과 마찬가지로 물을 구하는 방법을 하나 더 제시하는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">There is 구문(유도부사)\u003c/span> : There + be동사 + [주어] + [장소 부사구] : \"물이 좀 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구(장소)\u003c/span> : [전치사] + [명사구] : \"많은 음식 안에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">such as(예시 제시)\u003c/span> : [앞의 명사] + such as + [예] : \"코코넛과 과일 같은\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"Third, 셋째. there is some water, 물이 좀 있습니다. in many foods, 많은 음식 안에. such as coconuts and fruit, 코코넛과 과일 같은. 이 문장 전체를 해석하면, 셋째, 코코넛이나 과일과 같은 많은 음식에는 물이 들어 있다.","hl":"m"},{"n":43,"text":"세 번째 팁으로 음식 속에 들어 있는 물을 활용하라는 내용이에요. 코코넛과 과일을 구체적인 예로 들어서 이해를 돕고 있죠. 앞의 두 팁처럼 물을 구하는 방법을 하나 더 제시하는 문장입니다.","hl":"mn"},{"n":44,"text":"첫 번째, there is some water는 유도부사 there가 이끄는 구문이에요. 뒤에 나오는 water가 진짜 주어이고, 그래서 동사도 is로 맞춰 줍니다. 두 번째, in many foods는 물이 어디에 있는지 알려 주는 전치사구예요. 세 번째, such as는 앞의 many foods를 코코넛과 과일로 예시해 주는 표현이고, water는 셀 수 없는 명사라서 some을 붙여 좀이라는 의미를 나타냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 여러분이 이러한 조언을 명심한다면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">If \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">keep \u003c/span>\u003cspan class=\"tgt\">these \u003c/span>\u003cspan class=\"tgt\">tips \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">mind\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은 더욱 안전해질 것이다\u003c/span>\u003cspan class=\"en\">you \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">safer\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무인도에서\u003c/span>\u003cspan class=\"en\">on a desert island.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이러한 조언을 명심한다면 여러분은 무인도에서 더욱 안전해질 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞에서 제시한 물 찾기 조언을 모두 \u003cb class=\"key\">명심\u003c/b>할 때 얻는 결과를 말하며 글을 맺는 \u003cb class=\"key\">결론\u003c/b> 문장이에요. if로 \u003cb class=\"key\">조건\u003c/b>을 제시하고, 그 조건을 지키면 무인도에서 더 안전해진다는 점을 강조해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조건의 부사절(if + 현재시제, 주절 will)\u003c/span> : If + [주어] + [현재시제 동사], [주어] + will + [동사원형] : \"이러한 조언을 명심한다면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">5형식 관용 표현(keep + 목적어 + in mind)\u003c/span> : keep + [목적어] + in mind : \"이러한 조언을 명심하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">미래시제 + 비교급\u003c/span> : will + be + [비교급 형용사] : \"더욱 안전해질 것이다\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"If you keep these tips in mind, 만약 여러분이 이러한 조언을 명심한다면. you will be safer, 여러분은 더욱 안전해질 것이다. on a desert island, 무인도에서. 이 문장 전체를 해석하면, 이러한 조언을 명심한다면 여러분은 무인도에서 더욱 안전해질 것이다.","hl":"m"},{"n":46,"text":"이 문장은 앞에서 말한 물 찾기 조언들을 모두 명심했을 때 어떤 결과가 생기는지 알려 주는 결론 문장이에요. if로 조건을 제시하고, 그 조건을 지키면 무인도에서 더 안전해진다는 점을 정리해 줍니다.","hl":"mn"},{"n":47,"text":"첫 번째로 If you keep these tips in mind는 조건을 나타내는 부사절이고, 미래의 일이지만 if절에는 현재시제를 써요. 두 번째로 keep these tips in mind는 목적어를 마음에 두라는 뜻의 명심하다라는 관용 표현이에요. 세 번째로 will be safer에서 safer는 safe의 비교급이고, will be는 미래의 결과 상태를 보여 줘요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>무인도에 혼자 남았을 때 글쓴이는 가장 먼저 \u003cb class=\"key\">마실 \u003c/b>\u003cb class=\"key\">물\u003c/b>을 찾으라고 제안한다.\u003c/li>\u003cli>물은 생존에 가장 중요하며, 몸에 충분한 물이 없으면 \u003cb class=\"key\">사흘\u003c/b> 만에도 죽을 수 있다.\u003c/li>\u003cli>따라서 마시기에 \u003cb class=\"key\">안전한 \u003c/b>\u003cb class=\"key\">물\u003c/b>을 찾아야 하며, 시냇물·강물의 \u003cb class=\"key\">질병\u003c/b> 위험을 주의해야 한다.\u003c/li>\u003cli>\u003cb class=\"key\">빗물\u003c/b>을 저장하고 코코넛·과일 속 수분을 활용하는 조언을 명심하면 무인도에서 더 안전해질 것이다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>To survive on a desert island, find safe drinking water first and use reliable sources such as rainwater and moisture in foods.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">무인도에서 생존하려면 가장 먼저 \u003cb class=\"key\">마실 \u003c/b>\u003cb class=\"key\">물\u003c/b>을 찾아야 한다. 시냇물과 강물의 \u003cb class=\"key\">질병\u003c/b> 위험을 주의하고, \u003cb class=\"key\">빗물\u003c/b>과 코코넛·과일 속 수분을 활용해 \u003cb class=\"key\">안전한 \u003c/b>\u003cb class=\"key\">물\u003c/b>을 확보해야 한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":48,"text":"자, 정리해 볼게요. 무인도에서 가장 먼저 필요한 것은 마실 물이고, 물은 생존에 가장 중요한 요소예요. 안전한 물을 찾기 위해 시냇물과 강물의 질병 위험을 알고, 빗물과 코코넛, 과일 속 수분도 활용해야 하죠. 오늘 배운 조언을 명심하면 무인도 같은 상황에서도 더 안전하게 대처할 수 있을 거예요, 수고했어요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
