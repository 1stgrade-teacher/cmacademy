<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터1 Reading 16 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터1 Reading 16","audioDir":"16_audio","preview":false,"count":48,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.668em\">Reading\u003cbr>16\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터1\u003c/div>\u003ch1>Health Care Spending as a Percentage of GDP in 2018\u003c/h1>\u003ch2>2018년 GDP 대비 의료비 지출 비율\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>위 그래프는 2018년 GDP 대비 의료비 지출 비율을 보여 주며, 미국이 가장 높은 비율을 지출했고 여러 국가의 지출 수준을 서로 \u003cb class=\"key\">비교\u003c/b>합니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The graph compares the percentage of GDP spent on health care among several countries in 2018, with the US spending the highest.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 이천십팔 년 GDP 대비 의료비 지출 비율을 다룬 그래프 지문을 함께 읽어 볼게요. 이 글은 여러 나라가 GDP에서 의료비로 얼마나 지출했는지 비교하고, 미국이 가장 높은 비율을 보였다는 점을 전하고 있어요. 핵심은 국가별 지출 비율을 비교하며 차이를 파악하는 거예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">GDP는 Gross Domestic Product의 약자로, 한 나라가 일정 기간 안에 생산한 최종 재화와 서비스의 시장 가치를 뜻합니다. 의료비 지출을 GDP로 나눈 \u003cb class=\"key\">비율\u003c/b>을 보면 경제 규모가 다른 나라도 같은 기준에서 비교할 수 있습니다. 이 그래프는 2018년 각국이 GDP에서 차지하는 health care spending, 즉 의료비 지출 비율을 보여 줍니다. 예를 들어 용돈이 다른 친구들이 각자 용돈의 몇 퍼센트를 간식에 쓰는지 비교하는 것과 비슷합니다. 이때 percentage는 비율, compare는 비교하다, highest는 가장 높은이라는 뜻으로 함께 익혀 두면 좋습니다. 결국 이 글은 국가별 \u003cb class=\"key\">의료비\u003c/b> 부담을 숫자로 비교해 차이를 파악하는 자료입니다.\u003c/div>","segs":[{"n":2,"text":"먼저 GDP가 뭔지 짚어 볼게요. GDP는 Gross Domestic Product, 즉 한 나라가 일정 기간 안에 생산한 최종 재화와 서비스의 시장 가치를 말해요. 의료비 지출을 GDP로 나눈 비율을 보면 경제 규모가 다른 나라도 서로 비교할 수 있죠. 예를 들어 용돈이 다른 친구들이 각자 용돈의 몇 퍼센트를 간식에 쓰는지 비교하는 것과 비슷해요. 그래서 이 그래프는 각국의 경제 규모 대비 의료비 부담을 보여 주는 자료라고 이해하면 됩니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>그래프 제시\u003csmall>도입 · 문장 1–5\u003c/small>\u003c/h4>\u003cp>위 그래프는 2018년 GDP 대비 의료비 지출 비율을 보여 줍니다. 이어서 가장 많이와 가장 적게 지출한 국가, 국가 간 큰 차이 여부를 \u003cb class=\"key\">질문\u003c/b>으로 던집니다. 학생들은 그래프를 보고 \u003cb class=\"key\">비교\u003c/b>해 보라는 안내를 받습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>최고 지출국\u003csmall>근거 · 문장 6–8\u003c/small>\u003c/h4>\u003cp>미국은 표시된 국가들 중 의료비에 GDP 대비 가장 높은 \u003cb class=\"key\">비율\u003c/b>을 지출했습니다. 스위스는 GDP의 12.2퍼센트를 지출했는데, 이는 미국보다 \u003cb class=\"key\">적은\u003c/b> 수치입니다. 두 나라를 통해 최고 지출국과 그다음 수준을 \u003cb class=\"key\">비교\u003c/b>합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>프랑스와 튀르키예\u003csmall>예시 · 문장 9–10\u003c/small>\u003c/h4>\u003cp>프랑스는 벨기에보다 의료비에 GDP 대비 더 높은 비율을 지출했습니다. 튀르키예는 GDP의 5퍼센트 \u003cb class=\"key\">미만\u003c/b>을 의료비에 지출했습니다. 이는 국가별 \u003cb class=\"key\">지출\u003c/b> 차이를 보여 주는 예입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>영국과 그리스\u003csmall>비교 · 문장 11–12\u003c/small>\u003c/h4>\u003cp>영국과 그리스는 GDP의 같은 비율을 의료비에 지출했습니다. 두 나라는 또한 각각 GDP의 5퍼센트 \u003cb class=\"key\">이상\u003c/b>을 지출했습니다. 같은 비율과 5퍼센트 기준을 함께 \u003cb class=\"key\">비교\u003c/b>한 부분입니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 그래프 제시, 최고 지출국, 프랑스와 튀르키예, 영국과 그리스 순서로 살펴볼게요.","hl":null},{"n":4,"text":"첫 단계는 그래프를 제시하는 부분이에요. 위 그래프가 이천십팔 년 GDP 대비 의료비 지출 비율을 보여 준다고 말하죠. 이어서 가장 많이 지출한 국가와 가장 적게 지출한 국가, 국가 간 큰 차이가 있는지를 질문하고 함께 비교해 보자고 안내해요. 여기서 질문과 비교라는 핵심어를 기억해 두면 좋아요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 최고 지출국을 다뤄요. 미국이 표시된 국가들 중 의료비에 GDP 대비 가장 높은 비율을 지출했다고 설명하죠. 스위스는 GDP의 십이 점 이 퍼센트를 지출했는데, 이는 미국보다 적은 수치예요. 이 부분에서 최고 지출국과 그다음 수준을 비교한다는 점을 잡아 주세요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 프랑스와 튀르키예를 봅니다. 프랑스는 벨기에보다 의료비에 GDP 대비 더 높은 비율을 지출했어요. 반면 튀르키예는 GDP의 오 퍼센트 미만을 의료비에 지출했습니다. 이는 국가별 지출 차이를 보여 주는 예가 됩니다.","hl":"f2"},{"n":7,"text":"네 번째 단계는 영국과 그리스입니다. 영국과 그리스는 GDP의 같은 비율을 의료비에 지출했어요. 두 나라는 또한 각각 GDP의 오 퍼센트 이상을 지출했습니다. 같은 비율과 오 퍼센트 기준을 함께 비교한 부분이에요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">비교·대조\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 그래프의 주제를 먼저 제시하고, 이어서 여러 국가의 수치를 \u003cb class=\"key\">예시\u003c/b>로 나열합니다. 미국, 스위스, 프랑스, 벨기에, 튀르키예, 영국, 그리스의 지출을 \u003cb class=\"key\">비교\u003c/b>하며 차이를 보여 줍니다. 마지막 문장은 전체를 요약하기보다 영국과 그리스의 \u003cb class=\"key\">공통점\u003c/b>을 덧붙입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>above (1)\u003c/b>\u003cspan>그래프 지시\u003c/span>\u003cb>most (2)\u003c/b>\u003cspan>최상급 비교 질문\u003c/span>\u003cb>least (3)\u003c/b>\u003cspan>최하급 비교 질문\u003c/span>\u003cb>compare (5)\u003c/b>\u003cspan>비교 안내\u003c/span>\u003cb>highest (6)\u003c/b>\u003cspan>최고 비율 제시\u003c/span>\u003cb>less than (8)\u003c/b>\u003cspan>비교 기준\u003c/span>\u003cb>higher (9)\u003c/b>\u003cspan>비교 우위\u003c/span>\u003cb>same (11)\u003c/b>\u003cspan>동일 비율 표시\u003c/span>\u003cb>more than (12)\u003c/b>\u003cspan>비교 기준\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">the percentage of GDP spent on health care\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">spent the highest percentage of GDP on health care\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">spent 12.2 percent of its GDP on health care\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">spent a higher percentage of its GDP on health care\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">spent less than 5 percent of its GDP on health care\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">spent the same percentage of their GDP on health care\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">spent more than 5 percent of their GDP on health care\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>미국\u003c/th>\u003cth>튀르키예\u003c/th>\u003c/tr>\u003ctr>\u003ctd>GDP 대비 가장 높은 의료비 지출\u003c/td>\u003ctd>GDP의 5퍼센트 미만 의료비 지출\u003c/td>\u003c/tr>\u003ctr>\u003ctd>표시된 국가 중 최고 비율\u003c/td>\u003ctd>5퍼센트 기준보다 낮음\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 비교와 대조의 전개 방식으로 되어 있어요. 첫 문장에서 그래프의 주제를 먼저 제시한 뒤, 여러 국가의 수치를 예시로 나열하는 두괄식 구조로 볼 수 있죠. 미국과 스위스, 프랑스와 벨기에, 튀르키예, 영국과 그리스를 차례로 비교하며 지출 비율의 차이를 보여 줍니다. 마지막 문장은 전체 요약이라기보다 영국과 그리스의 공통점을 덧붙이는 역할을 해요.","hl":"ty"},{"n":9,"text":"신호어를 보면 above가 그래프를 가리키고, most와 least가 최상급 비교 질문을 만들어 줍니다. highest, less than, higher than, same, more than 같은 표현이 국가 간 지출 비율의 차이를 분명히 보여 주죠. 같은 개념은 spent on health care와 percentage of GDP라는 표현이 반복되며 이어집니다. 이렇게 비교 표현을 중심으로 읽으면 국가별 위치를 쉽게 정리할 수 있어요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>graph\u003c/b>\u003cem>명사\u003c/em>\u003cspan>그래프\u003c/span>\u003c/div>\u003cdiv>\u003cb>above\u003c/b>\u003cem>부사\u003c/em>\u003cspan>위의, 위에\u003c/span>\u003c/div>\u003cdiv>\u003cb>show\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보여 주다\u003c/span>\u003c/div>\u003cdiv>\u003cb>percentage\u003c/b>\u003cem>명사\u003c/em>\u003cspan>비율, 퍼센트\u003c/span>\u003c/div>\u003cdiv>\u003cb>GDP\u003c/b>\u003cem>명사\u003c/em>\u003cspan>국내총생산\u003c/span>\u003c/div>\u003cdiv>\u003cb>spend\u003c/b>\u003cem>동사\u003c/em>\u003cspan>지출하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>health care\u003c/b>\u003cem>명사\u003c/em>\u003cspan>의료, 건강 관리\u003c/span>\u003c/div>\u003cdiv>\u003cb>country\u003c/b>\u003cem>명사\u003c/em>\u003cspan>국가\u003c/span>\u003c/div>\u003cdiv>\u003cb>most\u003c/b>\u003cem>부사\u003c/em>\u003cspan>가장 많이\u003c/span>\u003c/div>\u003cdiv>\u003cb>among\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~중에서\u003c/span>\u003c/div>\u003cdiv>\u003cb>least\u003c/b>\u003cem>부사\u003c/em>\u003cspan>가장 적게\u003c/span>\u003c/div>\u003cdiv>\u003cb>difference\u003c/b>\u003cem>명사\u003c/em>\u003cspan>차이\u003c/span>\u003c/div>\u003cdiv>\u003cb>between\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~사이에\u003c/span>\u003c/div>\u003cdiv>\u003cb>compare\u003c/b>\u003cem>동사\u003c/em>\u003cspan>비교하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>highest\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>가장 높은\u003c/span>\u003c/div>\u003cdiv>\u003cb>percent\u003c/b>\u003cem>명사\u003c/em>\u003cspan>퍼센트\u003c/span>\u003c/div>\u003cdiv>\u003cb>less than\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~보다 적게\u003c/span>\u003c/div>\u003cdiv>\u003cb>higher\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>더 높은\u003c/span>\u003c/div>\u003cdiv>\u003cb>same\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>같은\u003c/span>\u003c/div>\u003cdiv>\u003cb>also\u003c/b>\u003cem>부사\u003c/em>\u003cspan>또한\u003c/span>\u003c/div>\u003cdiv>\u003cb>each\u003c/b>\u003cem>부사\u003c/em>\u003cspan>각각\u003c/span>\u003c/div>\u003cdiv>\u003cb>more than\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~보다 많이\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어로는 spend, percentage, compare를 꼭 기억해 주세요. spend는 지출하다, percentage는 비율, compare는 비교하다라는 뜻이에요. highest와 least처럼 높고 낮음을 나타내는 표현도 함께 챙겨 두면 좋습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">spend\u003c/b>\u003cspan class=\"m\">지출하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">pay\u003c/span>\u003cspan class=\"s\">use\u003c/span>\u003cspan class=\"s\">expend\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">save\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">percentage\u003c/b>\u003cspan class=\"m\">비율\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">proportion\u003c/span>\u003cspan class=\"s\">rate\u003c/span>\u003cspan class=\"s\">share\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">compare\u003c/b>\u003cspan class=\"m\">비교하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">contrast\u003c/span>\u003cspan class=\"s\">weigh\u003c/span>\u003cspan class=\"s\">match\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">highest\u003c/b>\u003cspan class=\"m\">가장 높은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">greatest\u003c/span>\u003cspan class=\"s\">top\u003c/span>\u003cspan class=\"s\">maximum\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">lowest\u003c/span>\u003cspan class=\"a\">minimum\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">least\u003c/b>\u003cspan class=\"m\">가장 적은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">smallest\u003c/span>\u003cspan class=\"s\">lowest\u003c/span>\u003cspan class=\"s\">minimum\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">most\u003c/span>\u003cspan class=\"a\">greatest\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">difference\u003c/b>\u003cspan class=\"m\">차이\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">gap\u003c/span>\u003cspan class=\"s\">variation\u003c/span>\u003cspan class=\"s\">distinction\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">similarity\u003c/span>\u003cspan class=\"a\">sameness\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">same\u003c/b>\u003cspan class=\"m\">같은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">equal\u003c/span>\u003cspan class=\"s\">identical\u003c/span>\u003cspan class=\"s\">alike\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">different\u003c/span>\u003cspan class=\"a\">unequal\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">more than\u003c/b>\u003cspan class=\"m\">~보다 많이\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">over\u003c/span>\u003cspan class=\"s\">above\u003c/span>\u003cspan class=\"s\">exceeding\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">less than\u003c/span>\u003cspan class=\"a\">under\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 정리해 볼게요. spend는 pay나 use로 바꿔 말할 수 있고, percentage는 proportion이나 rate와 가깝습니다. compare는 contrast나 weigh와 비슷하고, highest의 반대는 lowest예요. least의 반대는 most나 greatest로 기억하면 좋아요. difference는 gap이나 variation과 비슷하고, same은 equal이나 identical로 바꿔 쓸 수 있으며, more than은 over나 above, 반대는 less than으로 정리할 수 있습니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">위의 그래프는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">The \u003c/span>\u003cspan class=\"tgt\">graph \u003c/span>\u003cspan class=\"tgt\">above\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보여 줍니다\u003c/span>\u003cspan class=\"en\">shows\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">GDP의 비율을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">percentage \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">GDP\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">의료비로 지출된\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">spent \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">health \u003c/span>\u003cspan class=\"tgt\">care\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">2018년에\u003c/span>\u003cspan class=\"en\">in 2018.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">2018년 GDP 대비 의료비 지출 비율 위 그래프는 2018년 GDP 대비 의료비 지출 비율을 보여 줍니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 그래프의 주제를 밝히는 첫 문장으로, 위 그래프가 무엇을 나타내는지 알려 줍니다. 곧 \u003cb class=\"key\">GDP\u003c/b> 대비 \u003cb class=\"key\">의료비 \u003c/b>\u003cb class=\"key\">지출 \u003c/b>\u003cb class=\"key\">비율\u003c/b>을 보여 준다는 뜻이죠. 이 글 전체가 이 그래프를 읽고 비교하는 흐름이라서, 이 문장이 내용의 \u003cb class=\"key\">출발점\u003c/b> 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부사 above의 후치 수식\u003c/span> : [명사 The graph] + [부사 above] : \"위의 그래프는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 of의 소유·관계\u003c/span> : [the percentage] + [of GDP] : \"GDP의 비율\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">과거분사의 형용사적 용법(수동)\u003c/span> : [명사 the percentage of GDP] + [spent(과거분사) on health care] : \"의료비로 지출된\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"The graph above, 위의 그래프는. shows, 보여 줍니다. the percentage of GDP, GDP의 비율을. spent on health care, 의료비로 지출된. in 2018, 2018년에. 이 문장 전체를 해석하면, 2018년 GDP 대비 의료비 지출 비율 위 그래프는 2018년 GDP 대비 의료비 지출 비율을 보여 줍니다.","hl":"m"},{"n":13,"text":"이 문장은 그래프의 주제를 밝히는 문장이에요. 위 그래프가 무엇을 보여 주는지, 바로 GDP 대비 의료비 지출 비율을 알려 주죠. 글 전체가 이 그래프를 읽고 비교하는 흐름이라서, 이 문장이 내용의 출발점 역할을 합니다.","hl":"mn"},{"n":14,"text":"어법 포인트 세 개만 짚을게요. 첫 번째, The graph above에서 above는 형용사가 아니라 부사라서 명사 뒤에서 후치 수식을 해요. 두 번째, the percentage of GDP에서 of는 앞뒤 명사의 소유·관계를 이어 주고, 여기서는 GDP를 기준으로 한 비율이라는 뜻이에요. 세 번째, spent on health care에서 지출되는 대상은 비율이니까 수동의 의미로 과거분사 spent가 뒤에서 명사 수식을 해요. spending이라고 쓰면 의미가 달라지니 꼭 구분하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어느 나라가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Which \u003c/span>\u003cspan class=\"tgt\">country\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가장 많이 지출했나요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">spent \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">most\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">표시된 국가들 중에서?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">among \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">countries \u003c/span>\u003cspan class=\"tgt\">shown\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">표시된 국가 중 가장 많이 지출한 국가는 어디인가요?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 그래프를 본격적으로 읽기 전에 던지는 확인 질문입니다. 표시된 국가들 가운데 의료비 지출 비율이 가장 높은 나라를 찾아보게 하죠. 바로 다음 문장에서 최상위 국가인 \u003cb class=\"key\">미국\u003c/b>을 언급하기 위한 \u003cb class=\"key\">도입 \u003c/b>\u003cb class=\"key\">질문\u003c/b>이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문형용사 which\u003c/span> : [Which] + [명사 country] : \"어느 나라가\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">최상급 부사 the most\u003c/span> : [동사 spent] + [the most] : \"가장 많이 지출했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">과거분사의 후치 수식\u003c/span> : [the countries] + [shown(과거분사)] : \"표시된 국가들 중에서\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Which country, 어느 나라가. spent the most, 가장 많이 지출했나요. among the countries shown?, 표시된 국가들 중에서?. 이 문장 전체를 해석하면, 표시된 국가 중 가장 많이 지출한 국가는 어디인가요?","hl":"m"},{"n":16,"text":"이 문장은 그래프를 읽기 전에 던지는 확인 질문이에요. 표시된 국가들 가운데 의료비 지출 비율이 가장 높은 나라를 스스로 찾아보게 하죠. 바로 다음 문장에서 최상위 국가인 미국을 꺼내기 위한 도입 질문이라고 보면 됩니다.","hl":"mn"},{"n":17,"text":"어법은 세 가지예요. 첫 번째, Which country에서 which는 명사 앞에서 의문형용사로 쓰여 '어느 나라'라는 뜻을 만들어요. 두 번째, spent the most에서 most는 동사를 꾸미는 최상급 부사이고, 최상급 앞에는 the를 붙여요. 세 번째, among the countries shown에서 shown은 수동의 의미를 가진 과거분사로 뒤에서 the countries를 꾸미는 분사구예요. the countries which are shown을 줄인 형태라고 이해하면 쉬워요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어느 나라가\u003c/span>\u003cspan class=\"en\">Which country\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가장 적게 지출했나요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">spent \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">least\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">표시된 국가들 중에서?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">among \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">countries \u003c/span>\u003cspan class=\"tgt\">shown\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">표시된 국가 중 가장 적게 지출한 국가는 어디인가요?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장과 짝을 이루는 질문으로, 이번에는 가장 적게 지출한 나라를 묻습니다. 최고와 최저를 나란히 물어보면서 그래프의 양 끝을 확인하게 하죠. 두 질문을 통해 \u003cb class=\"key\">최댓값\u003c/b>과 \u003cb class=\"key\">최솟값\u003c/b>을 먼저 파악하라는 의도예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">최상급 부사 the least\u003c/span> : [동사 spent] + [the least] : \"가장 적게 지출했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사의 후치 수식\u003c/span> : [the countries] + [shown(과거분사)] : \"표시된 국가들 중에서\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Which country, 어느 나라가. spent the least, 가장 적게 지출했나요. among the countries shown?, 표시된 국가들 중에서?. 이 문장 전체를 해석하면, 표시된 국가 중 가장 적게 지출한 국가는 어디인가요?","hl":"m"},{"n":19,"text":"이 문장은 앞 문장과 짝을 이루는 질문이에요. 이번에는 가장 적게 지출한 나라를 물으면서 그래프의 반대쪽 끝을 확인하게 하죠. 최고와 최저를 나란히 물어봄으로써 최댓값과 최솟값을 먼저 파악하라는 의도예요.","hl":"mn"},{"n":20,"text":"어법 두 가지만 볼게요. 첫 번째, spent the least에서 least는 little의 최상급으로 '가장 적게'라는 부사 역할을 하고, 최상급이니까 앞에 the가 붙어요. 두 번째, among the countries shown에서 shown은 수동의 뜻을 가진 과거분사로 뒤에서 the countries를 꾸미는 분사구예요. 앞 문장과 똑같은 구조라서 함께 외워 두면 좋습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">있나요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Is \u003c/span>\u003cspan class=\"tgt\">there\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">큰 차이가\u003c/span>\u003cspan class=\"en\">a big difference\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">국가들 사이에?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">between \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">countries\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">국가간에 큰 차이가 있나요?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 그래프에 나온 국가들의 의료비 지출 비율이 서로 크게 다른지 묻는 질문이에요. 본격적인 비교 전에 \u003cb class=\"key\">큰 \u003c/b>\u003cb class=\"key\">차이\u003c/b>가 있는지 확인하려는 역할을 하죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">there be 구문(존재 표현)의 의문문\u003c/span> : Is there + [주어]? : \"~이 있나요?\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 between + 복수명사\u003c/span> : between + [복수명사] : \"국가들 사이에\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Is there, 있나요. a big difference, 큰 차이가. between the countries?, 국가들 사이에?. 이 문장 전체를 해석하면, 국가간에 큰 차이가 있나요?","hl":"m"},{"n":22,"text":"이 문장은 그래프에 나온 국가들의 의료비 지출 비율이 서로 크게 다른지 묻는 질문이에요. 본격적인 비교 전에 큰 차이가 있는지 확인하려는 역할을 하죠.","hl":"mn"},{"n":23,"text":"첫 번째로 Is there는 무언가가 있나요라고 묻는 존재 표현이에요. 실제 주어는 뒤에 오는 a big difference이고, 두 번째로 between the countries는 국가들 사이에라는 뜻으로 between 뒤에 복수명사가 와서 여러 국가 사이의 관계를 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">봅시다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Let's\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">look \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 비교해 봅시다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">compare\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">보고 비교해 봅시다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 그래프를 함께 보자는 \u003cb class=\"key\">권유\u003c/b>를 담은 문장이에요. 이어서 나올 국가별 수치를 학생들이 직접 보고 비교하게 만들죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">청유문 Let's\u003c/span> : Let us + [동사원형] : \"~합시다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동사원형 병렬\u003c/span> : [동사원형] and [동사원형] : \"보고 비교하다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Let's look, 봅시다. and compare, 그리고 비교해 봅시다.. 이 문장 전체를 해석하면, 보고 비교해 봅시다.","hl":"m"},{"n":25,"text":"그래프를 함께 보자는 권유를 담은 문장이에요. 이어서 나올 국가별 수치를 학생들이 직접 보고 비교하게 만들죠.","hl":"mn"},{"n":26,"text":"첫 번째로 Let's는 let us의 줄임말로, 상대에게 함께 하자고 권유할 때 쓰는 표현이에요. 두 번째로 and가 두 동사원형 look과 compare를 같은 자격으로 연결한 병렬 구조라서 두 행동이 대등하게 이어집니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미국은\u003c/span>\u003cspan class=\"en\">The US\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가장 높은 비율을 지출했습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">spent \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">highest \u003c/span>\u003cspan class=\"tgt\">percentage\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">GDP의\u003c/span>\u003cspan class=\"en\">of GDP\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">의료비에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">health \u003c/span>\u003cspan class=\"tgt\">care\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">표시된 국가들 중에서.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">among \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">countries \u003c/span>\u003cspan class=\"tgt\">shown\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">미국은 표시된 국가들 중에서 의료비에 GDP 대비 가장 높은 비율을 지출했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 그래프의 핵심 결론으로, 미국이 표시된 국가들 중 의료비에 GDP 대비 가장 높은 비율을 썼다는 점을 말해요. 뒤에 나오는 다른 국가 수치와 비교할 때 \u003cb class=\"key\">기준점\u003c/b>이 되는 문장이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">최상급 the highest + 명사\u003c/span> : the + [최상급] + [명사] : \"가장 높은 비율\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 on (지출 대상)\u003c/span> : spend + [금액/비율] + on + [대상] : \"의료비에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">과거분사 후치수식 + among\u003c/span> : among + [복수명사] + [과거분사] : \"표시된 국가들 중에서\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"The US, 미국은. spent the highest percentage, 가장 높은 비율을 지출했습니다. of GDP, GDP의. on health care, 의료비에. among the countries shown, 표시된 국가들 중에서.. 이 문장 전체를 해석하면, 미국은 표시된 국가들 중에서 의료비에 GDP 대비 가장 높은 비율을 지출했습니다.","hl":"m"},{"n":28,"text":"이 문장은 그래프의 핵심 결론으로, 미국이 표시된 국가들 중 의료비에 GDP 대비 가장 높은 비율을 썼다는 점을 말해요. 뒤에 나오는 다른 국가 수치와 비교할 때 기준점이 되는 문장이죠.","hl":"mn"},{"n":29,"text":"첫 번째로 the highest는 셋 이상 중 가장 높은 정도를 나타내는 최상급 표현이고, the highest 뒤에 percentage가 와서 가장 높은 비율이라는 명사구를 만들어요. 두 번째로 spend는 지출 대상 앞에 전치사 on을 쓰기 때문에 on health care가 의료비에로 해석됩니다. 세 번째로 shown은 countries를 뒤에서 꾸미는 과거분사이고, among은 비교 범위를 한정해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">스위스는 지출했습니다\u003c/span>\u003cspan class=\"en\">Switzerland spent\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">GDP의 12.2퍼센트를\u003c/span>\u003cspan class=\"en\">12.2 percent of \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">its\u003c/span> GDP\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">의료비에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">health \u003c/span>\u003cspan class=\"tgt\">care\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">스위스는 GDP의 12.2퍼센트를 의료비에 지출했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 스위스가 의료비로 GDP의 12.2퍼센트를 썼다는 \u003cb class=\"key\">수치\u003c/b>를 제시해요. 앞 문장에서 미국이 가장 높다고 했으니, 스위스는 미국과 \u003cb class=\"key\">비교\u003c/b>하기 위한 두 번째 기준점 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">소유격 대명사\u003c/span> : [its] + [명사(GDP)] : \"그것(스위스)의\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 on + 명사(지출의 대상)\u003c/span> : spend + [목적어(금액·비율)] + on + [명사(분야)] : \"의료비에\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Switzerland spent, 스위스는 지출했습니다. 12.2 percent of its GDP, GDP의 12.2퍼센트를. on health care, 의료비에. 이 문장 전체를 해석하면, 스위스는 GDP의 12.2퍼센트를 의료비에 지출했습니다.","hl":"m"},{"n":31,"text":"이 문장은 스위스가 의료비로 GDP의 십이 점 이 퍼센트를 썼다고 알려 줘요. 앞 문장에서 미국이 가장 높다고 했으니, 스위스의 수치는 미국과 비교하기 위한 두 번째 기준점이 되는 거죠.","hl":"mn"},{"n":32,"text":"먼저 its는 앞에 나온 Switzerland를 가리키는 소유격이에요. 국가 이름도 it으로 받는다는 점을 기억해 두세요. 그리고 spend는 목적어 뒤에 on을 붙여서 돈을 쓴 대상을 표시해요. 그래서 on health care가 의료비에라는 뜻이 되는 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">That's\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 적습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">less \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미국보다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">US\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 미국보다 적습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> \u003cb class=\"key\">That\u003c/b>은 바로 앞 문장의 12.2퍼센트라는 수치를 받아요. 스위스의 수치가 미국보다 \u003cb class=\"key\">적다\u003c/b>는 뜻으로, 두 나라를 잇는 \u003cb class=\"key\">비교\u003c/b> 흐름을 만들어 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지시대명사 That + be동사 축약\u003c/span> : [That is] → [That's] : \"그것은 ~이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">비교급 less than\u003c/span> : [less] + than + [비교 대상] : \"미국보다 적은\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"That's, 그것은. less, 더 적습니다. than the US, 미국보다. 이 문장 전체를 해석하면, 그것은 미국보다 적습니다.","hl":"m"},{"n":34,"text":"That은 바로 앞 문장의 십이 점 이 퍼센트라는 수치를 받아요. 스위스의 수치가 미국보다 적다는 뜻으로, 두 나라를 비교하는 흐름이 그대로 이어지고 있어요.","hl":"mn"},{"n":35,"text":"첫 번째로 That's는 That is의 줄임말이고, That은 앞 문장의 수치를 받는 지시대명사예요. 두 번째로 less는 little의 비교급이라서 뒤에 than이 자연스럽게 따라옵니다. 수치를 비교할 때는 than 뒤에 비교 대상을 그대로 두면 된다는 것도 함께 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">프랑스는 지출했습니다\u003c/span>\u003cspan class=\"en\">France spent\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 높은 비율을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">higher \u003c/span>\u003cspan class=\"tgt\">percentage\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">GDP 대비\u003c/span>\u003cspan class=\"en\">of its GDP\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">의료비에\u003c/span>\u003cspan class=\"en\">on health care\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">벨기에보다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">Belgium\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">프랑스는 벨기에보다 의료비에 GDP 대비 더 높은 비율을 지출했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 프랑스가 벨기에보다 의료비 비율이 \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">높다\u003c/b>는 \u003cb class=\"key\">비교\u003c/b> 문장이에요. 그래프에서 두 나라의 \u003cb class=\"key\">순위\u003c/b>를 판단하는 근거가 되어 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">비교급 형용사 higher\u003c/span> : [higher] + [명사(percentage)] : \"더 높은 비율\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">비교 대상 than + 명사\u003c/span> : [비교급] + than + [비교 대상] : \"벨기에보다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"France spent, 프랑스는 지출했습니다. a higher percentage, 더 높은 비율을. of its GDP, GDP 대비. on health care, 의료비에. than Belgium, 벨기에보다. 이 문장 전체를 해석하면, 프랑스는 벨기에보다 의료비에 GDP 대비 더 높은 비율을 지출했습니다.","hl":"m"},{"n":37,"text":"프랑스가 벨기에보다 의료비에 GDP 대비 더 높은 비율을 썼다는 비교 문장이에요. 그래프에서 두 나라의 순위를 확인할 때 근거가 되는 문장이죠.","hl":"mn"},{"n":38,"text":"첫 번째로 higher는 high의 비교급으로, 뒤에 오는 명사 percentage를 꾸며요. 두 번째로 비교급이 나오면 than이 짝을 이루는데, 여기서는 than Belgium이 비교의 기준이에요. 세 번째로 than 뒤에는 spent가 반복되지 않고 생략되어 있다는 점도 눈여겨보세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">튀르키예는\u003c/span>\u003cspan class=\"en\">Türkiye\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">5퍼센트 미만을 지출했습니다\u003c/span>\u003cspan class=\"en\">spent \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">less \u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">5 \u003c/span>\u003cspan class=\"tgt\">percent\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자기 GDP의\u003c/span>\u003cspan class=\"en\">of \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">its \u003c/span>\u003cspan class=\"tgt\">GDP\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">의료비에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">health \u003c/span>\u003cspan class=\"tgt\">care\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">튀르키예는 GDP의 5퍼센트 미만을 의료비에 지출했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 튀르키예가 의료비로 쓴 비율이 5퍼센트도 되지 않는다는 사실을 전하는 문장입니다. 앞선 프랑스·벨기에 비교에 이어, \u003cb class=\"key\">less \u003c/b>\u003cb class=\"key\">than\u003c/b>이라는 \u003cb class=\"key\">비교급\u003c/b> 표현으로 낮은 수치를 짚어 줍니다. 그래프에서 아래쪽 끝에 놓인 나라임을 알 수 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">비교급 less than(~미만)\u003c/span> : [less than] + [수량] → '~미만' : \"5퍼센트 미만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">소유격 대명사 its의 지칭\u003c/span> : [its] + [명사] ← 앞에 나온 단수 국가명을 받음 : \"자기 GDP의\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 on(지출의 대상)\u003c/span> : spend + [금액·비율] + [on + 명사] → '~에 돈을 쓰다' : \"의료비에\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"Türkiye, 튀르키예는. spent less than 5 percent, 5퍼센트 미만을 지출했습니다. of its GDP, 자기 GDP의. on health care, 의료비에. 이 문장 전체를 해석하면, 튀르키예는 GDP의 5퍼센트 미만을 의료비에 지출했습니다.","hl":"m"},{"n":40,"text":"이 문장은 튀르키예가 의료비로 쓴 돈이 GDP의 다섯 퍼센트도 안 된다는 걸 알려 줘요. 앞에서 프랑스와 벨기에를 비교했으니, 여기서는 아주 낮은 수치를 가진 나라를 하나 더 보여 주는 거죠. less than을 써서 미만이라는 비교급 표현으로 그래프의 아래쪽 끝을 짚어 주고 있습니다.","hl":"mn"},{"n":41,"text":"첫 번째로 less than은 little의 비교급이에요. 그래서 뒤에 다섯 퍼센트가 오면 그 수량에 못 미친다는 미만의 뜻이 되죠. 두 번째로 동사 spend는 어디에 썼는지를 전치사 on으로 붙여요. 그래서 on health care가 의료비에라는 대상이 되는 겁니다. 세 번째로 its는 앞에 나온 튀르키예를 받는 소유격 대명사라서 나라 이름을 다시 쓰지 않아도 된답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">영국과 그리스는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">The \u003c/span>\u003cspan class=\"tgt\">UK \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">Greece\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">같은 비율을 지출했습니다\u003c/span>\u003cspan class=\"en\">spent \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">same \u003c/span>\u003cspan class=\"tgt\">percentage\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 GDP의\u003c/span>\u003cspan class=\"en\">of \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">GDP\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">의료비에\u003c/span>\u003cspan class=\"en\">on health care.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">영국과 그리스는 GDP의 같은 비율을 의료비에 지출했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 영국과 그리스가 의료비에 쓴 비율이 완전히 똑같다는 것을 말하는 문장입니다. \u003cb class=\"key\">the \u003c/b>\u003cb class=\"key\">same\u003c/b>을 써서 두 나라 사이에 \u003cb class=\"key\">차이\u003c/b>가 없다는 점을 한 번에 정리했어요. 이어서 두 나라가 함께 5퍼센트를 넘는다는 내용으로 자연스럽게 연결됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">and로 연결된 복수 주어\u003c/span> : [A and B] + [복수 동사 spent] : \"영국과 그리스는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">the same + 명사(동일한 ~)\u003c/span> : [the same] + [명사] → '같은 ~' : \"같은 비율\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">복수 주어를 받는 소유격 their\u003c/span> : [their] + [명사] ← 복수 주어 The UK and Greece 지칭 : \"그들의 GDP\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"The UK and Greece, 영국과 그리스는. spent the same percentage, 같은 비율을 지출했습니다. of their GDP, 그들의 GDP의. on health care, 의료비에. 이 문장 전체를 해석하면, 영국과 그리스는 GDP의 같은 비율을 의료비에 지출했습니다.","hl":"m"},{"n":43,"text":"영국과 그리스가 의료비에 쓴 비율이 똑같다는 걸 말해 주는 문장이에요. the same을 써서 두 나라 사이에 차이가 없다는 점을 한 번에 정리한 거죠. 바로 다음 문장에서 두 나라가 함께 다섯 퍼센트를 넘는다는 사실로 이어집니다.","hl":"mn"},{"n":44,"text":"첫 번째로 영국과 그리스를 and로 묶으면 주어가 복수가 돼요. 그래서 동사도 복수 주어에 맞춰 쓰인 거죠. 두 번째로 the same은 관사 the를 꼭 붙여서 완전히 동일하다는 뜻을 만드는 표현이에요. 여기서는 두 나라의 비율이 같다는 걸 보여 줍니다. 세 번째로 주어가 두 나라라서 소유격도 its가 아니라 their를 써서 그들의 GDP라고 한답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 또한 각각\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">also \u003c/span>\u003cspan class=\"tgt\">each\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">5퍼센트 이상을 지출했습니다\u003c/span>\u003cspan class=\"en\">spent \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">5 \u003c/span>\u003cspan class=\"tgt\">percent\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 GDP의\u003c/span>\u003cspan class=\"en\">of \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">GDP\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">의료비에\u003c/span>\u003cspan class=\"en\">on health care.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 또한 각각 GDP의 5퍼센트 이상을 의료비에 지출했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 두 나라의 비율이 같다고 했던 영국과 그리스가, 각각 5퍼센트를 넘겼다는 점을 덧붙이는 문장입니다. \u003cb class=\"key\">also\u003c/b>와 \u003cb class=\"key\">each\u003c/b>로 '추가'와 '하나하나'를 함께 짚어 주지요. 같은 비율이면서도 기준선보다 높다는 사실로 그래프 설명을 마무리합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부사의 위치(일반동사 앞)\u003c/span> : [주어] + [also / each] + [일반동사 spent] : \"또한 각각\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">비교급 more than(~이상)\u003c/span> : [more than] + [수량] → '~보다 많은, ~이상' : \"5퍼센트 이상\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">복수 대명사 they의 소유격\u003c/span> : [They] ... [their] + [명사] → 같은 대상 반복 : \"그들의 GDP\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"They also each, 그들은 또한 각각. spent more than 5 percent, 5퍼센트 이상을 지출했습니다. of their GDP, 그들의 GDP의. on health care, 의료비에. 이 문장 전체를 해석하면, 그들은 또한 각각 GDP의 5퍼센트 이상을 의료비에 지출했습니다.","hl":"m"},{"n":46,"text":"앞에서 영국과 그리스의 비율이 같다고 했죠. 여기서는 그 두 나라가 각각 다섯 퍼센트를 넘겼다는 점을 덧붙여요. also와 each로 추가와 개별을 함께 짚어 주면서, 두 나라가 같은 비율이면서도 기준선보다 높다는 걸 마무리한 문장입니다.","hl":"mn"},{"n":47,"text":"첫 번째로 also와 each는 일반동사 앞에 놓여서 동작 전체를 꾸며 줘요. 그래서 또한 각각이라는 추가와 개별의 느낌을 함께 전해 주죠. 두 번째로 more than은 much의 비교급 more에 than을 붙인 표현이라, 그 수량보다 많다, 즉 이상이라는 뜻이 돼요. 앞 문장의 less than과 짝을 이루어 두 나라가 기준선 위에 있다는 걸 보여 줍니다. 세 번째로 주어 They가 영국과 그리스를 받으니까 소유격도 their가 되어 그들의 GDP라고 표현한답니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>위 그래프는 2018년 GDP 대비 \u003cb class=\"key\">의료비\u003c/b> 지출 비율을 보여 줍니다.\u003c/li>\u003cli>미국은 표시된 국가 중 가장 높은 \u003cb class=\"key\">비율\u003c/b>을 지출했습니다.\u003c/li>\u003cli>스위스는 12.2퍼센트로 미국보다 적고, 프랑스는 벨기에보다 \u003cb class=\"key\">높은\u003c/b> 비율을 지출했습니다.\u003c/li>\u003cli>튀르키예는 5퍼센트 \u003cb class=\"key\">미만\u003c/b>, 영국과 그리스는 같은 비율로 각각 5퍼센트 \u003cb class=\"key\">이상\u003c/b>을 지출했습니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The graph compares the percentage of GDP spent on health care among several countries in 2018, with the US spending the highest.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">위 그래프는 2018년 GDP 대비 의료비 지출 비율을 보여 주며, 미국이 가장 높은 비율을 지출했고 여러 국가의 지출 수준을 서로 \u003cb class=\"key\">비교\u003c/b>합니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":48,"text":"오늘 글은 여러 나라의 GDP 대비 의료비 지출 비율을 비교하는 그래프 설명이었어요. 미국이 가장 높은 비율을 보였고, 스위스는 미국보다 적게, 프랑스는 벨기에보다 높게 지출했습니다. 튀르키예는 오 퍼센트 미만, 영국과 그리스는 같은 비율로 각각 오 퍼센트 이상을 지출했죠. 비교 표현을 중심으로 국가별 차이를 정리해 두면 시험에서도 흔들리지 않을 테니 오늘 수업도 수고 많았습니다.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
