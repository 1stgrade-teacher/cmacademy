<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터1 Reading 17 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터1 Reading 17","audioDir":"17_audio","preview":false,"count":48,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.668em\">Reading\u003cbr>17\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터1\u003c/div>\u003ch1>Benjamin Franklin and the Secret of Mrs. Silence Dogood\u003c/h1>\u003ch2>Benjamin Franklin과 Mrs. Silence Dogood의 비밀\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>Benjamin Franklin은 17명의 자녀 중 15번째로 태어나 대부분 \u003cb class=\"key\">스스로 \u003c/b>\u003cb class=\"key\">공부\u003c/b>했고, 12세에 형의 신문사에서 일하며 \u003cb class=\"key\">필명\u003c/b> Mrs. Silence Dogood으로 이야기를 써 사람들의 사랑을 받았다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Benjamin Franklin, mostly self-taught, began writing stories under the pen name Mrs. Silence Dogood as a boy and was loved by readers.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 Benjamin Franklin의 어린 시절과 필명 이야기를 담은 지문을 함께 읽어 볼 거예요. 이 글은 Franklin이 미국 역사상 가장 중요한 인물 중 한 명이라는 소개에서 시작해, 그가 Mrs Silence Dogood이라는 필명으로 이야기를 쓰고 독자들을 사로잡은 일을 들려줍니다. 핵심 요지는 Franklin이 대부분 스스로 공부한 소년이었지만 필명으로 글을 써 사람들을 놀라게 했다는 거예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">Benjamin Franklin은 미국 건국의 아버지 중 한 명이자 출판업자, 작가, 발명가, 과학자로 활동한 \u003cb class=\"key\">다방면의 \u003c/b>\u003cb class=\"key\">천재\u003c/b>(polymath)입니다. 당시 미국 식민지 시대에는 신문과 인쇄소가 정보를 퍼뜨리는 중요한 공간이었고, 어린 나이에 인쇄소에서 일하는 \u003cb class=\"key\">견습생\u003c/b>(apprentice) 경험이 글쓰기로 이어지기도 했습니다. \u003cb class=\"key\">필명\u003c/b>(pen name)은 오늘날 인터넷 아이디나 익명 닉네임처럼 자신의 진짜 이름을 숨기고 쓰는 이름입니다. 그래서 독자는 글만 보고 글쓴이의 나이와 정체를 정확히 알기 어려웠습니다. 이 지문은 그러한 시대적 배경 속에서 Franklin이 어떻게 \u003cb class=\"key\">글쓰기\u003c/b>를 시작했는지 보여 줍니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 짚어 볼게요. Benjamin Franklin은 미국 건국의 아버지 중 한 명이자 출판업자, 작가, 발명가, 과학자로 활동한 polymath였어요. 당시 미국 식민지 시대에는 신문과 인쇄소가 정보를 퍼뜨리는 중요한 공간이었고, 어린 나이에 인쇄소에서 일하는 apprentice 경험이 글쓰기로 이어지기도 했죠. pen name은 오늘날 인터넷 아이디나 익명 닉네임처럼 자신의 진짜 이름을 숨기고 쓰는 이름이에요. 그래서 독자는 글만 보고 글쓴이의 나이와 정체를 정확히 알기 어려웠답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>인물 소개\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>글은 Benjamin Franklin을 미국 역사상 가장 \u003cb class=\"key\">중요한 \u003c/b>\u003cb class=\"key\">인물\u003c/b> 중 한 명으로 소개하며 시작합니다. 이어서 그가 출판업자, 작가, 발명가, 과학자였다고 \u003cb class=\"key\">직업\u003c/b>을 나열합니다. 독자는 그가 얼마나 다양한 분야에서 활동한 \u003cb class=\"key\">인물\u003c/b>인지 먼저 알게 됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>출생과 교육\u003csmall>배경 · 문장 3–6\u003c/small>\u003c/h4>\u003cp>그는 1706년 1월 17일 보스턴에서 태어났고, 17명의 자녀 중 \u003cb class=\"key\">15번째\u003c/b>였습니다. 아버지는 비누와 양초를 만드는 일을 했습니다. 그는 어느 정도 \u003cb class=\"key\">학교 \u003c/b>\u003cb class=\"key\">교육\u003c/b>을 받았지만 대부분 \u003cb class=\"key\">스스로 \u003c/b>\u003cb class=\"key\">공부\u003c/b>한 사람이었습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>신문사 경험\u003csmall>계기 · 문장 7–8\u003c/small>\u003c/h4>\u003cp>12세에 그는 형의 \u003cb class=\"key\">신문사\u003c/b>에서 일하기 시작했습니다. 그곳에서 4년 동안 일한 뒤, 자신의 \u003cb class=\"key\">이야기\u003c/b>를 쓰기 시작했습니다. 이 경험이 훗날 그가 글을 쓰는 \u003cb class=\"key\">계기\u003c/b>가 된 셈입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>필명과 반전\u003csmall>결론 · 문장 9–12\u003c/small>\u003c/h4>\u003cp>그는 진짜 이름 대신 Mrs. Silence Dogood이라는 \u003cb class=\"key\">필명\u003c/b>으로 글을 썼습니다. 사람들은 그의 이야기를 좋아했고, 작가가 \u003cb class=\"key\">유부녀\u003c/b>일지도 모른다고 생각했습니다. 하지만 사람들은 그녀가 16세 \u003cb class=\"key\">소년\u003c/b>이라고는 결코 생각하지 못했습니다. 이 마지막 문장이 글의 \u003cb class=\"key\">반전\u003c/b>을 만듭니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 네 단계로 나누어 살펴볼게요.","hl":null},{"n":4,"text":"첫 단계는 Franklin을 미국 역사상 가장 중요한 인물 중 한 명으로 소개하는 부분이에요. 이어서 그가 출판업자, 작가, 발명가, 과학자였다고 직업을 나열하죠. 독자는 그가 여러 분야에서 활동한 다재다능한 인물임을 먼저 알게 됩니다.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 그의 출생과 가족 배경이 나와요. 그는 보스턴에서 태어나 열일곱 명의 자녀 중 열다섯 번째였고, 아버지는 비누와 양초를 만들었어요. 그는 어느 정도 학교 교육을 받았지만 대부분 스스로 공부한 사람이었다는 점이 중요합니다.","hl":"f1"},{"n":6,"text":"세 번째 단계에서는 열두 살에 형의 신문사에서 일하기 시작한 일이 소개돼요. 그는 그곳에서 사 년 동안 일한 뒤 자신의 이야기를 쓰기 시작했죠. 이 경험이 그를 글쓰기의 세계로 이끈 계기가 됩니다.","hl":"f2"},{"n":7,"text":"마지막 단계에서는 필명으로 글을 쓰는 이야기가 나와요. 그는 진짜 이름 대신 Mrs Silence Dogood이라는 필명을 사용했고, 사람들은 그의 이야기를 좋아했어요. 독자들은 작가가 유부녀일지도 모른다고 생각했지만, 그녀가 열여섯 살 소년이라고는 결코 생각하지 못했습니다. 이 마지막 문장이 글의 반전을 만들어 줍니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 12번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 Franklin의 출생, 가족, 교육, 직장 경험, 필명 활동을 차례로 제시하는 \u003cb class=\"key\">시간순\u003c/b> 전개입니다. 문장 3부터 8까지는 어린 시절과 형의 신문사 경험을 시간에 따라 보여 주고, 문장 9부터 12까지는 필명과 독자 반응으로 이어집니다. 핵심이 되는 놀라운 사실이 마지막 문장에서 드러나므로 \u003cb class=\"key\">미괄식\u003c/b>으로 볼 수 있습니다. 마지막의 \u003cb class=\"key\">반전\u003c/b>이 글의 재미와 중심 내용을 완성합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>But (6)\u003c/b>\u003cspan>대조\u003c/span>\u003cb>At the age of 12 (7)\u003c/b>\u003cspan>시간적 계기 제시\u003c/span>\u003cb>After (8)\u003c/b>\u003cspan>시간 순서 연결\u003c/span>\u003cb>Instead of (9)\u003c/b>\u003cspan>대조·전환\u003c/span>\u003cb>never (12)\u003c/b>\u003cspan>강조·반전\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">author\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">write his own stories\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a pen name\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Mrs. Silence Dogood\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the writer\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">she\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a 16-year-old boy\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Mrs. Silence Dogood\u003c/th>\u003cth>Benjamin Franklin\u003c/th>\u003c/tr>\u003ctr>\u003ctd>사람들이 생각한 작가\u003c/td>\u003ctd>실제 글쓴이\u003c/td>\u003c/tr>\u003ctr>\u003ctd>유부녀일지도 모른다고 생각함\u003c/td>\u003ctd>16세 소년\u003c/td>\u003c/tr>\u003ctr>\u003ctd>필명\u003c/td>\u003ctd>진짜 이름\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 시간순으로 인물의 생애를 따라가는 전기 형식이에요. 도입에서 인물 소개를 한 뒤, 출생과 가족, 교육, 직장 경험, 필명 활동으로 차례차례 이어지죠. 결정적인 반전이 마지막 문장에서 드러나기 때문에 전체 구조는 미괄식으로 볼 수 있어요. 즉, 글의 재미와 핵심이 마지막에 터지도록 배치한 구성입니다.","hl":"ty"},{"n":9,"text":"신호어를 보면 At the age of라는 표현이 열두 살이라는 시간적 계기를 알려 주고, After가 사 년 뒤라는 시간 순서를 이어 줍니다. Instead of는 진짜 이름과 필명을 대조시키는 전환 신호예요. 또 But과 never는 독자의 생각과 실제 사실이 다르다는 점을 강조하면서 반전을 만들어 줍니다. 이런 신호어를 따라가면 글의 흐름과 필명의 의미가 훨씬 선명해져요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>important\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>중요한\u003c/span>\u003c/div>\u003cdiv>\u003cb>history\u003c/b>\u003cem>명사\u003c/em>\u003cspan>역사\u003c/span>\u003c/div>\u003cdiv>\u003cb>publisher\u003c/b>\u003cem>명사\u003c/em>\u003cspan>출판업자\u003c/span>\u003c/div>\u003cdiv>\u003cb>author\u003c/b>\u003cem>명사\u003c/em>\u003cspan>작가\u003c/span>\u003c/div>\u003cdiv>\u003cb>inventor\u003c/b>\u003cem>명사\u003c/em>\u003cspan>발명가\u003c/span>\u003c/div>\u003cdiv>\u003cb>scientist\u003c/b>\u003cem>명사\u003c/em>\u003cspan>과학자\u003c/span>\u003c/div>\u003cdiv>\u003cb>be born\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>태어나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>child\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자녀, 아이\u003c/span>\u003c/div>\u003cdiv>\u003cb>formal\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>공식적인, 정규의\u003c/span>\u003c/div>\u003cdiv>\u003cb>education\u003c/b>\u003cem>명사\u003c/em>\u003cspan>교육\u003c/span>\u003c/div>\u003cdiv>\u003cb>mostly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>대부분, 주로\u003c/span>\u003c/div>\u003cdiv>\u003cb>self-taught\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>독학의, 스스로 배운\u003c/span>\u003c/div>\u003cdiv>\u003cb>at the age of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~살에\u003c/span>\u003c/div>\u003cdiv>\u003cb>start\u003c/b>\u003cem>동사\u003c/em>\u003cspan>시작하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>work for\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~를 위해 일하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>newspaper\u003c/b>\u003cem>명사\u003c/em>\u003cspan>신문사, 신문\u003c/span>\u003c/div>\u003cdiv>\u003cb>after\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>~한 후에\u003c/span>\u003c/div>\u003cdiv>\u003cb>begin\u003c/b>\u003cem>동사\u003c/em>\u003cspan>시작하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>story\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이야기\u003c/span>\u003c/div>\u003cdiv>\u003cb>instead of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~대신에\u003c/span>\u003c/div>\u003cdiv>\u003cb>real\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>실제의, 진짜의\u003c/span>\u003c/div>\u003cdiv>\u003cb>write\u003c/b>\u003cem>동사\u003c/em>\u003cspan>쓰다\u003c/span>\u003c/div>\u003cdiv>\u003cb>pen name\u003c/b>\u003cem>명사\u003c/em>\u003cspan>필명\u003c/span>\u003c/div>\u003cdiv>\u003cb>love\u003c/b>\u003cem>동사\u003c/em>\u003cspan>사랑하다, 좋아하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>writer\u003c/b>\u003cem>명사\u003c/em>\u003cspan>작가, 글쓴이\u003c/span>\u003c/div>\u003cdiv>\u003cb>think\u003c/b>\u003cem>동사\u003c/em>\u003cspan>생각하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>married\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>결혼한\u003c/span>\u003c/div>\u003cdiv>\u003cb>woman\u003c/b>\u003cem>명사\u003c/em>\u003cspan>여자, 여성\u003c/span>\u003c/div>\u003cdiv>\u003cb>never\u003c/b>\u003cem>부사\u003c/em>\u003cspan>결코 ~않다\u003c/span>\u003c/div>\u003cdiv>\u003cb>boy\u003c/b>\u003cem>명사\u003c/em>\u003cspan>소년\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어 몇 개만 짚어 볼게요. self-taught는 스스로 배운, 독학의라는 뜻이고, pen name은 필명을 의미해요. instead of는 대신에, never는 결코 아니라는 뜻으로 글의 반전을 이해하는 열쇠가 됩니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">important\u003c/b>\u003cspan class=\"m\">중요한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">significant\u003c/span>\u003cspan class=\"s\">essential\u003c/span>\u003cspan class=\"s\">crucial\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unimportant\u003c/span>\u003cspan class=\"a\">trivial\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">formal\u003c/b>\u003cspan class=\"m\">공식적인, 정규의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">official\u003c/span>\u003cspan class=\"s\">structured\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">informal\u003c/span>\u003cspan class=\"a\">casual\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">self-taught\u003c/b>\u003cspan class=\"m\">독학의, 스스로 배운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">self-educated\u003c/span>\u003cspan class=\"s\">autodidactic\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">formally trained\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">begin\u003c/b>\u003cspan class=\"m\">시작하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">start\u003c/span>\u003cspan class=\"s\">commence\u003c/span>\u003cspan class=\"s\">initiate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">end\u003c/span>\u003cspan class=\"a\">finish\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">real\u003c/b>\u003cspan class=\"m\">실제의, 진짜의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">actual\u003c/span>\u003cspan class=\"s\">genuine\u003c/span>\u003cspan class=\"s\">true\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">false\u003c/span>\u003cspan class=\"a\">fake\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">love\u003c/b>\u003cspan class=\"m\">사랑하다, 좋아하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">like\u003c/span>\u003cspan class=\"s\">adore\u003c/span>\u003cspan class=\"s\">cherish\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hate\u003c/span>\u003cspan class=\"a\">dislike\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 함께 정리해 볼게요. important는 significant, essential과 가깝고 unimportant와 반대돼요. self-taught는 self-educated와 비슷하고 formally trained와 반대되는 표현으로 기억해 두세요. begin은 commence, start와 가깝고 end, finish와 반대됩니다. real은 actual, genuine과 가깝고 false, fake와 반대된다는 점도 챙겨 주세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">벤저민 프랭클린은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Benjamin \u003c/span>\u003cspan class=\"tgt\">Franklin \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가장 중요한 인물 중 한 명이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">most \u003c/span>\u003cspan class=\"tgt\">important \u003c/span>\u003cspan class=\"tgt\">people\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미국 역사상\u003c/span>\u003cspan class=\"en\">in American history.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Benjamin Franklin은 미국 역사상 가장 중요한 인물 중 한 명이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 벤저민 프랭클린이 미국 역사에서 차지하는 위상을 소개하며 글을 여는 \u003cb class=\"key\">도입\u003c/b> 문장이에요. '가장 중요한 인물 중 한 명'이라는 \u003cb class=\"key\">최상급\u003c/b> 표현으로 그를 강하게 띄워 주죠. 뒤에 이어질 그의 다양한 업적 이야기를 예고하는 \u003cb class=\"key\">주제문\u003c/b> 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주어 + be동사 + 주격보어\u003c/span> : [[주어]] + [[be동사]] + [[명사구(주격보어)]] → 주어와 보어가 같은 대상 : \"벤저민 프랭클린은 가장 중요한 인물들 중 한 명이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">one of + 최상급 + 복수명사\u003c/span> : one of the + [최상급 형용사] + [복수명사] → '가장 ~한 것들 중 하나' : \"가장 중요한 사람들 중 한 명\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Benjamin Franklin, 벤저민 프랭클린은. is one of the most important people, 가장 중요한 인물 중 한 명이다. in American history, 미국 역사상. 이 문장 전체를 해석하면, Benjamin Franklin은 미국 역사상 가장 중요한 인물 중 한 명이다.","hl":"m"},{"n":13,"text":"이 문장은 벤저민 프랭클린이 미국 역사에서 어떤 위상을 가진 인물인지 소개하는 도입 문장이에요. 가장 중요한 인물 중 한 명이라는 최상급 표현으로 그를 강하게 띄워 주고 있죠. 그래서 다음 문장부터 이어질 그의 업적 이야기를 자연스럽게 예고하는 주제문 역할을 합니다.","hl":"mn"},{"n":14,"text":"첫 번째 어법 포인트는 one of the most important people이에요. one of 뒤에는 반드시 복수명사가 와야 하고, 진짜 주어는 one이기 때문에 동사는 is처럼 단수 형태를 씁니다. 두 번째로 이 문장은 주어와 be동사, 그리고 명사구 주격보어로 이루어져 있어요. 주어인 Benjamin Franklin과 보어인 one of the most important people이 같은 사람을 가리키는 동격 관계라는 점도 꼭 챙겨 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 ~였다\u003c/span>\u003cspan class=\"en\">He was\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">출판업자, 작가, 발명가, 과학자\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">publisher, \u003c/span>\u003cspan class=\"tgt\">author, \u003c/span>\u003cspan class=\"tgt\">inventor, \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">scientist\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 출판업자, 작가, 발명가, 과학자였다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 말한 '중요한 인물'이 구체적으로 어떤 일을 했는지 알려 주는 문장이에요. 네 가지 직업을 \u003cb class=\"key\">병렬\u003c/b>로 나열해 그의 다양한 면모를 \u003cb class=\"key\">구체화\u003c/b>하죠. 뒤에서 이어질 출판·발명·과학 이야기의 \u003cb class=\"key\">근거\u003c/b>가 되어 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관사 하나로 묶는 명사 병렬\u003c/span> : a + [명사1], [명사2], [명사3], and [명사4] : \"출판업자, 작가, 발명가, 그리고 과학자\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"He was, 그는 ~였다. a publisher, author, inventor, and scientist, 출판업자, 작가, 발명가, 과학자. 이 문장 전체를 해석하면, 그는 출판업자, 작가, 발명가, 과학자였다.","hl":"m"},{"n":16,"text":"앞 문장에서 말한 중요한 인물이 구체적으로 어떤 일을 했는지 알려 주는 문장이에요. 출판업자, 작가, 발명가, 과학자라는 네 가지 직업을 나란히 놓아서 그의 다양한 면모를 한 번에 보여 주죠. 뒤에서 이어질 이야기들의 근거가 되는 목록이라고 보면 됩니다.","hl":"mn"},{"n":17,"text":"여기서 볼 포인트는 병렬 구조예요. a publisher, author, inventor, and scientist처럼 명사들을 콤마와 and로 이어 주면 앞에 있는 관사 a 하나가 네 명사를 모두 받아 줍니다. 그래서 한 사람이 이 모든 일을 했다는 의미가 자연스럽게 살아나죠. 같은 사람의 여러 직업을 나열할 때는 이렇게 관사를 한 번만 쓰는 병렬 구조를 쓴다는 것, 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 태어났다\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">born\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보스턴에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">Boston\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1706년 1월 17일에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">January \u003c/span>\u003cspan class=\"tgt\">17, \u003c/span>\u003cspan class=\"tgt\">1706\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 1706년 1월 17일 보스턴에서 태어났다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 그의 출생지와 출생 연도를 밝히는 \u003cb class=\"key\">배경 \u003c/b>\u003cb class=\"key\">정보\u003c/b> 문장이에요. 보스턴에서 태어났다는 사실을 \u003cb class=\"key\">구체적\u003c/b>으로 제시하며 인물 소개를 이어 가죠. 이어지는 어린 시절과 형의 신문사 이야기에 \u003cb class=\"key\">시간적 \u003c/b>\u003cb class=\"key\">토대\u003c/b>를 마련해 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태 관용 표현(be born)\u003c/span> : [[be동사]] + [[born(과거분사)]] → '태어나다' : \"태어났다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 in + 도시\u003c/span> : [[in]] + [도시·국가] → '~에서' : \"보스턴에서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 on + 특정 날짜\u003c/span> : [[on]] + [날짜·요일] / in + [연도·월] / at + [시각] : \"1706년 1월 17일에\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"He was born, 그는 태어났다. in Boston, 보스턴에서. on January 17, 1706, 1706년 1월 17일에. 이 문장 전체를 해석하면, 그는 1706년 1월 17일 보스턴에서 태어났다.","hl":"m"},{"n":19,"text":"이 문장은 그의 출생지와 출생 연도를 밝히는 배경 정보 문장이에요. 보스턴에서 태어났다는 사실을 구체적으로 제시하면서 인물 소개를 이어 가고 있죠. 그래서 다음에 나올 어린 시절과 형의 신문사 이야기에 시간적 토대를 마련해 줍니다.","hl":"mn"},{"n":20,"text":"첫 번째 포인트는 was born이에요. bear의 과거분사 born을 be동사와 함께 써서 태어나다는 뜻을 만드는 수동태 관용 표현이죠. 두 번째로 in Boston에서 도시 앞에는 전치사 in을 씁니다. 세 번째로 날짜 앞에는 on을 쓴다는 것, January seventeenth처럼 콕 집어지는 하루에는 on을 붙인다고 기억하세요. 연도 앞에는 원래 in을 쓰지만 날짜가 중심이 되면 on이 이끌고 나온다는 것도 함께 알아 두면 좋아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 ~이었다\u003c/span>\u003cspan class=\"en\">He was\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">15번째(였다)\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">15th\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">17명의 자녀 중\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">17 \u003c/span>\u003cspan class=\"tgt\">children\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 17명의 자녀 중 15번째였다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 \u003cb class=\"key\">서수\u003c/b> 표현을 써서 그가 대가족의 열다섯째 아들이었다는 사실을 알려 줍니다. 17명 중 15번째라는 정보는 뒤에 나오는 그의 \u003cb class=\"key\">독학\u003c/b>과 어린 시절 노동을 이해하는 배경이 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">정관사 the + 서수\u003c/span> : the + [서수 15th] → '몇 번째의' : \"15번째\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">of + 복수명사(전체 중 일부)\u003c/span> : the [서수] + of + [복수명사] → '~ 중 몇 번째' : \"17명의 자녀 중\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"He was, 그는 ~이었다. the 15th, 열다섯 번째(였다). of 17 children, 17명의 자녀 중. 이 문장 전체를 해석하면, 그는 17명의 자녀 중 열다섯 번째였다.","hl":"m"},{"n":22,"text":"이 문장은 열다섯 번째라는 서수를 써서 그가 대가족의 열다섯째였다는 걸 알려 줘요. 열일곱 명 중 열다섯 번째라는 정보는 뒤에 나오는 그의 독학과 어린 시절 노동을 이해하는 배경이 되어 줍니다.","hl":"mn"},{"n":23,"text":"먼저 the fifteenth를 보면, 서수 앞에는 정관사 the를 붙여서 순서를 나타내요. 두 번째로 of seventeen children에서 of가 '열일곱 명 중에서'라는 부분 관계를 만들어 주죠. 그래서 '열일곱 명의 자녀 가운데 열다섯 번째'라는 전체와 부분 구조가 완성됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 아버지는\u003c/span>\u003cspan class=\"en\">His father\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만들었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">made \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">비누와 양초를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">soap \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">candles\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그의 아버지는 비누와 양초를 만들었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 그의 아버지가 \u003cb class=\"key\">비누와 \u003c/b>\u003cb class=\"key\">양초\u003c/b>를 만드는 일을 했다는 \u003cb class=\"key\">배경 \u003c/b>\u003cb class=\"key\">정보\u003c/b>를 전해 줍니다. 집안 형편을 짐작하게 하는 대목이라서, 뒤에 이어지는 그이의 독학과 어린 나이의 노동을 자연스럽게 이해하게 해 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">3형식(주어 + 타동사 + 목적어)\u003c/span> : [주어 His father] + made(타동사) + [목적어 soap and candles] : \"비누와 양초를 만들었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">and 병렬 구조\u003c/span> : [명사 A] + and + [명사 B] → 같은 자격으로 연결 : \"비누와 양초\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"His father, 그의 아버지는. made, 만들었다. soap and candles, 비누와 양초를. 이 문장 전체를 해석하면, 그의 아버지는 비누와 양초를 만들었다.","hl":"m"},{"n":25,"text":"이 문장은 아버지의 직업을 알려 주는 배경 정보예요. 비누와 양초를 만드는 일을 하셨다는 대목이 집안 형편을 짐작하게 해 주고, 뒤에 나오는 그이의 독학과 어린 나이의 노동을 자연스럽게 이해하게 해 줍니다.","hl":"mn"},{"n":26,"text":"첫 번째로 made soap and candles를 보면, make는 만들다라는 뜻의 타동사라서 뒤에 목적어가 꼭 필요해요. 여기서는 비누와 양초가 목적어로 왔죠. 두 번째로 soap and candles에서 and는 같은 품사나 같은 역할의 말을 대등하게 이어 줘요. 명사 두 개를 병렬로 묶어 하나의 목적어 덩어리로 만든 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 받았다\u003c/span>\u003cspan class=\"en\">He got\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">약간의 정규 교육을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">some \u003c/span>\u003cspan class=\"tgt\">formal \u003c/span>\u003cspan class=\"tgt\">education\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">but\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 대부분\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">mostly \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">독학이었다(스스로 배웠다)\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">self-taught\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 학교 교육을 받았지만 대부분 스스로 공부했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 그가 정규 교육을 조금밖에 받지 못했지만 \u003cb class=\"key\">대부분 \u003c/b>\u003cb class=\"key\">독학\u003c/b>으로 지식을 얻었다는 뜻이에요. but을 중심으로 앞뒤 내용이 \u003cb class=\"key\">대조\u003c/b>를 이루면서, 뒤에 이어지는 형의 신문사 일과 필명 활동의 토대가 되어 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">some + 불가산명사\u003c/span> : some + [불가산명사 education] → '약간의 ~' : \"약간의 정규 교육을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 but(대조)\u003c/span> : [절 A] + but + [절 B] → 앞뒤 내용을 대조 : \"그러나\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">be동사 + 형용사(합성 형용사 self-taught)\u003c/span> : [주어] + be + [형용사 self-taught] : \"그는 대부분 독학이었다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"He got, 그는 받았다. some formal education, 약간의 정규 교육을. but, 그러나. he was mostly, 그는 대부분. self-taught, 독학이었다(스스로 배웠다). 이 문장 전체를 해석하면, 그는 학교 교육을 받았지만 대부분 스스로 공부했다.","hl":"m"},{"n":28,"text":"이 문장은 그가 정규 교육을 조금밖에 받지 못했지만 대부분 독학으로 공부했다는 걸 말해 줘요. but을 중심으로 앞뒤 내용이 대조를 이루면서, 뒤에 이어지는 신문사 일과 글쓰기 이야기의 토대가 되어 줍니다.","hl":"mn"},{"n":29,"text":"첫 번째로 some formal education에서 education은 셀 수 없는 불가산명사라서 some과 함께 '약간의 교육'이라는 수량을 나타내요. 관사 a를 붙이지 않는다는 점을 꼭 기억하세요. 두 번째로 but은 두 개의 절을 대등하게 이으면서 앞뒤를 대조시켜 주는 접속사예요. 세 번째로 self-taught는 스스로 가르침을 받았다는 뜻의 합성 형용사이고, be동사 뒤에서 주어의 상태를 설명하는 주격 보어 역할을 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">12세에\u003c/span>\u003cspan class=\"en\">At the age of 12,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 일하기 시작했다\u003c/span>\u003cspan class=\"en\">he \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">started \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">work\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">형의 신문사에서\u003c/span>\u003cspan class=\"en\">for his brother's newspaper.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">12세에 그는 형의 신문사에서 일하기 시작했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 프랭클린이 열두 살이라는 어린 나이에 형의 신문사에서 \u003cb class=\"key\">일을 \u003c/b>\u003cb class=\"key\">시작\u003c/b>했다는 사실을 전해 줘요. 앞에서 그가 대부분 \u003cb class=\"key\">스스로 \u003c/b>\u003cb class=\"key\">공부\u003c/b>했다는 내용과 이어지며, 그가 일찍부터 실제 사회 경험을 쌓았음을 보여 주는 대목입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : start [동사] + [to work (to부정사구/목적어)] : \"일하기 시작했다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"At the age of 12, 12세에. he started to work, 그는 일하기 시작했다. for his brother's newspaper, 형의 신문사에서. 이 문장 전체를 해석하면, 12세에 그는 형의 신문사에서 일하기 시작했다.","hl":"m"},{"n":31,"text":"이 문장은 프랭클린이 열두 살에 형의 신문사에서 일을 시작했다는 걸 말해요. 앞에서 스스로 공부했다는 이야기 뒤에 나와서, 그가 어린 나이부터 실제 일을 경험했다는 흐름을 보여 주죠.","hl":"mn"},{"n":32,"text":"먼저 started to work를 보세요. start 뒤에 to부정사가 와서 목적어 역할을 하고, '일하기 시작하다'라는 뜻을 만들어요. 그리고 for his brother's newspaper에서 전치사 for는 일하는 대상을 연결해 준다는 점도 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그가 4년 동안 일한 후에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">After \u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">worked \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">four \u003c/span>\u003cspan class=\"tgt\">years\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 쓰기 시작했다\u003c/span>\u003cspan class=\"en\">he \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">began \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">write\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 이야기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">own \u003c/span>\u003cspan class=\"tgt\">stories\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 4년 동안 일한 후, 자신의 이야기를 쓰기 시작했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 그가 사 년 동안 일한 뒤에 자신만의 이야기를 \u003cb class=\"key\">쓰기 \u003c/b>\u003cb class=\"key\">시작\u003c/b>했다는 걸 알려 줘요. 일을 배우며 보낸 시간이 쌓인 다음 \u003cb class=\"key\">창작\u003c/b>으로 넘어간 흐름이 드러나는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 after의 시간 부사절\u003c/span> : After + [주어 he] + [동사 worked] + [for four years (기간)] : \"그가 4년 동안 일한 후에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : begin [동사] + [to write (to부정사구/목적어)] : \"쓰기 시작했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">소유격 강조 own\u003c/span> : [소유격 his] + [own] + [명사 stories] : \"그 자신의 이야기\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"After he worked for four years, 그가 4년 동안 일한 후에. he began to write, 그는 쓰기 시작했다. his own stories, 자신의 이야기를. 이 문장 전체를 해석하면, 그는 4년 동안 일한 후, 자신의 이야기를 쓰기 시작했다.","hl":"m"},{"n":34,"text":"이 문장은 그가 사 년 동안 일한 뒤에 자신만의 이야기를 쓰기 시작했다는 걸 알려 줘요. 일을 배운 시간이 쌓인 다음 창작으로 넘어간 흐름이 잘 드러나죠.","hl":"mn"},{"n":35,"text":"먼저 After he worked for four years를 보세요. after가 시간을 이끄는 접속사로 쓰여서 뒤에 주어와 동사가 있는 절이 왔어요. 그리고 began to write에서 begin도 뒤에 to부정사를 목적어로 받아 '쓰기 시작했다'가 됩니다. 마지막으로 his own stories의 own은 '자기 자신의'를 강조하는 한정사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">진짜 이름 대신\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Instead \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">real \u003c/span>\u003cspan class=\"tgt\">name\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 필명으로 썼다\u003c/span>\u003cspan class=\"en\">he \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">wrote \u003c/span>\u003cspan class=\"tgt\">under \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">pen \u003c/span>\u003cspan class=\"tgt\">name, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Mrs. Silence Dogood이라는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">Mrs. \u003c/span>\u003cspan class=\"tgt\">Silence \u003c/span>\u003cspan class=\"tgt\">Dogood\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">진짜 이름 대신 Mrs. Silence Dogood이라는 필명으로 썼다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 그가 진짜 이름을 숨기고 \u003cb class=\"key\">필명\u003c/b>으로 글을 썼다는 사실을 전해요. 앞에서 이야기를 쓰기 시작했다는 내용에 이어, 어떤 이름으로 세상에 나왔는지를 설명해 주는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구 instead of\u003c/span> : Instead of + [명사 his real name] : \"그의 진짜 이름 대신에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 under의 관용 표현\u003c/span> : write + [under + a pen name] : \"필명으로 썼다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동격(콤마)\u003c/span> : [명사 a pen name] + , + [동격 Mrs. Silence Dogood] : \"필명, 즉 Mrs. Silence Dogood\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Instead of his real name, 진짜 이름 대신. he wrote under a pen name, 그는 필명으로 썼다. Mrs. Silence Dogood, Mrs. Silence Dogood이라는. 이 문장 전체를 해석하면, 진짜 이름 대신 Mrs. Silence Dogood이라는 필명으로 썼다.","hl":"m"},{"n":37,"text":"이 문장은 그가 진짜 이름을 숨기고 필명으로 글을 썼다는 사실을 전해요. 앞에서 이야기를 쓰기 시작했다는 내용에 이어, 어떤 이름으로 세상에 나왔는지를 설명해 주죠.","hl":"mn"},{"n":38,"text":"먼저 Instead of his real name에서 instead of는 '~대신에'라는 전치사구이고 뒤에 명사가 와요. 다음으로 wrote under a pen name에서 under는 '~이라는 이름으로'라는 관용 표현으로 쓰였어요. 마지막으로 콤마 뒤의 Mrs. Silence Dogood은 앞의 a pen name을 풀어 주는 동격이라는 점도 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들은\u003c/span>\u003cspan class=\"en\">People\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">좋아했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">loved \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 이야기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">stories\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사람들은 그의 이야기를 좋아했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 사람들이 그의 이야기를 좋아했다는 뜻으로, 앞으로 이어질 \u003cb class=\"key\">독자 \u003c/b>\u003cb class=\"key\">반응\u003c/b>을 긍정적으로 보여 줘요. 인기가 많았다는 점이 뒤에서 작가의 \u003cb class=\"key\">정체\u003c/b>를 오해하는 내용과 대비되죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">단순과거 타동사와 목적어\u003c/span> : love + 목적어 → loved + 목적어 : \"그의 이야기를 좋아했다\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"People, 사람들은. loved, 좋아했다. his stories, 그의 이야기를. 이 문장 전체를 해석하면, 사람들은 그의 이야기를 좋아했다.","hl":"m"},{"n":40,"text":"이 문장은 사람들이 그의 이야기를 좋아했다는 뜻이에요. 여기서 독자 반응이 긍정적이라는 점이 중요하고, 뒤에서 작가의 정체를 오해하는 내용과 대비돼요.","hl":"mn"},{"n":41,"text":"첫 번째로 loved는 과거 시제 동사라서 과거에 사람들이 좋아했던 일을 말해요. 두 번째로 his stories는 loved의 목적어로, 무엇을 좋아했는지를 알려 주죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그들은 생각했다\u003c/span>\u003cspan class=\"en\">And they \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">thought\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">작가가\u003c/span>\u003cspan class=\"en\">that the writer\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~일지도 모른다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">might \u003c/span>\u003cspan class=\"tgt\">be\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유부녀라고\u003c/span>\u003cspan class=\"en\">a married woman.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그리고 그들은 작가가 유부녀일지도 모른다고 생각했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 이야기가 인기를 끌었다는 내용을 받아, 사람들이 작가를 \u003cb class=\"key\">유부녀\u003c/b>로 상상했다는 뜻이에요. 즉 \u003cb class=\"key\">작가의 \u003c/b>\u003cb class=\"key\">정체\u003c/b>에 대한 \u003cb class=\"key\">추측\u003c/b>이 뒤에서 뒤집힌다는 흐름의 준비죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">that절을 목적어로 취하는 타동사\u003c/span> : think + that + 주어 + 동사 ~ : \"생각했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 might + 동사원형\u003c/span> : might + be : \"~일지도 모른다\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"And they thought, 그리고 그들은 생각했다. that the writer, 작가가. might be, ~일지도 모른다고. a married woman, 유부녀라고. 이 문장 전체를 해석하면, 그리고 그들은 작가가 유부녀일지도 모른다고 생각했다.","hl":"m"},{"n":43,"text":"앞에서 이야기가 인기를 끌었다는 내용을 받아, 사람들이 작가를 유부녀라고 상상했다는 뜻이에요. 즉 작가의 정체에 대한 추측이 뒤에서 뒤집힌다는 흐름의 준비죠.","hl":"mn"},{"n":44,"text":"첫 번째로 thought 뒤에 that절이 와서 작가가 유부녀일지도 모른다는 생각의 내용 전체가 목적어가 돼요. 두 번째로 might be는 might 뒤에 동사원형 be가 온 형태로, 현재 사실에 대한 추측을 나타내죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들은\u003c/span>\u003cspan class=\"en\">People\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">결코 생각하지 않았다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">never \u003c/span>\u003cspan class=\"tgt\">thought\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀가 ~라고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">she \u003c/span>\u003cspan class=\"tgt\">was\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">16세 소년이라고!\u003c/span>\u003cspan class=\"en\">a \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">16-year-old\u003c/span> boy!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사람들은 결코 그녀가 16세 소년이라고는 생각하지 않았다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사람들이 작가를 결혼한 여성으로만 상상했지만, 실제 정체는 16세 소년이었다는 \u003cb class=\"key\">반전\u003c/b>을 보여 줘요. never가 들어가 \u003cb class=\"key\">부정어\u003c/b>의 강한 부정을 만들고, 마지막에 \u003cb class=\"key\">정체\u003c/b>가 드러나죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정 부사 never + 과거 동사\u003c/span> : never + 동사 : \"결코 생각하지 않았다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">that절(명사절) 목적어\u003c/span> : think + that + 주어 + 동사 : \"그녀가 ~라고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">복합형용사\u003c/span> : 숫자-year-old + 명사 : \"16세의\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"People, 사람들은. never thought, 결코 생각하지 않았다. that she was, 그녀가 ~라고. a 16-year-old boy!, 16세 소년이라고!. 이 문장 전체를 해석하면, 사람들은 결코 그녀가 16세 소년이라고는 생각하지 않았다!","hl":"m"},{"n":46,"text":"사람들이 작가를 결혼한 여성으로만 상상했지만, 실제 정체는 열여섯 살 소년이었다는 반전을 보여 줘요. never가 들어가 부정어의 강한 부정을 만들고, 마지막에 정체가 드러나죠.","hl":"mn"},{"n":47,"text":"첫 번째로 never thought에서 never가 부정어로 쓰여 한 번도 생각하지 않았다는 강한 부정을 만들어요. 두 번째로 that she was는 thought의 목적어로 명사절이 와서 생각의 내용을 채우는 구조예요. 세 번째로 sixteen-year-old는 숫자와 year, old를 붙여 만든 복합형용사로, year를 단수로 써야 해요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>Benjamin Franklin은 미국 역사상 가장 중요한 인물 중 한 명으로, \u003cb class=\"key\">출판업자\u003c/b>·작가·발명가·과학자였습니다.\u003c/li>\u003cli>그는 1706년 보스턴에서 17명 중 15번째로 태어나 일부 \u003cb class=\"key\">학교 \u003c/b>\u003cb class=\"key\">교육\u003c/b>을 받았지만 대부분 \u003cb class=\"key\">스스로 \u003c/b>\u003cb class=\"key\">공부\u003c/b>했습니다.\u003c/li>\u003cli>12세에 형의 신문사에서 일하다가 4년 후 자신의 \u003cb class=\"key\">이야기\u003c/b>를 쓰기 시작했습니다.\u003c/li>\u003cli>그는 Mrs. Silence Dogood이라는 \u003cb class=\"key\">필명\u003c/b>으로 글을 써 사랑받았고, 사람들은 그가 16세 \u003cb class=\"key\">소년\u003c/b>이라고는 생각하지 못했습니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Benjamin Franklin, mostly self-taught, began writing stories under the pen name Mrs. Silence Dogood as a boy and was loved by readers.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">Benjamin Franklin은 17명의 자녀 중 15번째로 태어나 대부분 \u003cb class=\"key\">스스로 \u003c/b>\u003cb class=\"key\">공부\u003c/b>했고, 12세에 형의 신문사에서 일하며 \u003cb class=\"key\">필명\u003c/b> Mrs. Silence Dogood으로 이야기를 써 사람들의 사랑을 받았다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":48,"text":"정리해 볼게요. 이 글은 Benjamin Franklin이 열일곱 명 중 열다섯 번째로 태어나 대부분 스스로 공부하고, 형의 신문사에서 일하다가 필명으로 이야기를 쓰게 된 과정을 보여 줍니다. 독자들은 그를 유부녀라고 생각했지만 실제 글쓴이는 열여섯 살 소년이었다는 반전이 핵심이에요. 오늘 배운 시간순 구조와 필명, self-taught, pen name을 꼭 기억해 주세요. 수고했어요, 다음에 또 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
