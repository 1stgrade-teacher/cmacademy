<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터1 Reading 12 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터1 Reading 12","audioDir":"12_audio","preview":false,"count":54,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.668em\">Reading\u003cbr>12\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터1\u003c/div>\u003ch1>How to Overcome Time Famine\u003c/h1>\u003ch2>시간 기근을 극복하는 방법\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>시간이 부족한데 할 일이 많다고 느끼는 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">기근\u003c/b>은 긴장과 짜증, 스트레스를 일으키지만, \u003cb class=\"key\">할 \u003c/b>\u003cb class=\"key\">일 \u003c/b>\u003cb class=\"key\">목록\u003c/b>과 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">절약 \u003c/b>\u003cb class=\"key\">서비스\u003c/b>로 시간을 절약하면 이를 극복하고 더 편안해질 수 있다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Time famine can make students stressed, but saving time with a to-do list and time-saving services helps overcome it and feel more relaxed.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 리딩마스터의 이번 지문을 함께 읽어 볼게요. 이 글은 시간이 부족한데 할 일이 많다고 느끼는 시간 기근과 그 해결 방법을 다루고 있어요. 핵심은 시간 기근이 긴장과 스트레스를 주지만, 할 일 목록과 시간 절약 서비스로 시간을 절약하면 더 편안해질 수 있다는 점이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">\u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">기근\u003c/b>은 실제로 시간이 없는데 해야 할 일이 많다고 느끼는 심리적 압박을 뜻해요. 경제학에서는 돈이 부족한 상황과 비슷하게 시간이 부족한 상태를 time poverty라고 부르기도 하죠. 예를 들어 시험 전날 여러 과목의 숙제가 한꺼번에 몰린 상황을 떠올리면 이해가 쉬워요. 이런 압박은 단순히 바쁜 것보다 스트레스와 긴장을 크게 만들 수 있어요. 그래서 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">관리\u003c/b>가 중요한데, 해야 할 일을 적는 \u003cb class=\"key\">할 \u003c/b>\u003cb class=\"key\">일 \u003c/b>\u003cb class=\"key\">목록\u003c/b>은 긴급한 일을 골라 집중하게 해 줘요. 배달 앱 같은 시간 절약 서비스를 활용하는 것도 시간을 벌어 주는 현실적인 방법이에요.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식부터 볼게요. 시간 기근은 실제로 시간이 없는데 해야 할 일이 많다고 느끼는 심리적 압박을 뜻해요. 경제학에서는 돈이 부족한 상황과 비슷하게 시간이 부족한 상태를 time poverty라고 부르기도 하죠. 시험 전날 여러 과목의 숙제가 한꺼번에 몰린 상황을 떠올리면 이해가 쉬울 거예요. 이런 압박은 단순히 바쁜 것보다 스트레스와 긴장을 크게 만들 수 있어요. 그래서 시간 관리가 중요한데, 해야 할 일을 적는 할 일 목록은 긴급한 일을 골라 집중하게 해 주고, 배달 앱 같은 시간 절약 서비스는 시간을 벌어 주는 현실적인 방법이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>시간 부족과 시간 기근\u003csmall>도입·문제 제기 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>글은 시간이 충분하지 않다고 자주 느끼는지 묻으며 시작해요. 이어서 시간이 부족할 때 할 일이 너무 많다고 느끼는 감정을 설명하고, 그것을 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">기근\u003c/b>이라고 이름 붙여요. 즉 첫 단계는 일상에서 흔히 겪는 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">부족\u003c/b> 문제를 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">기근\u003c/b>이라는 개념으로 정의하는 부분이에요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>시간 기근의 영향\u003csmall>문제 심화·근거 · 문장 4–7\u003c/small>\u003c/h4>\u003cp>시간 기근은 사람을 \u003cb class=\"key\">긴장\u003c/b>하게 하고 짜증 나게 한다고 설명해요. 이어 시험공부를 할 때 이런 경험을 할 수 있다는 예를 들고, 한 연구가 시간 기근이 낮은 점수보다 더 큰 \u003cb class=\"key\">스트레스\u003c/b>를 줄 수 있다고 밝혀요. 문제의 심각성을 \u003cb class=\"key\">연구 \u003c/b>\u003cb class=\"key\">결과\u003c/b>로 뒷받침하는 단계예요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>해결의 전환\u003csmall>전환·해결 제시 · 문장 8–10\u003c/small>\u003c/h4>\u003cp>걱정하지 말라는 말과 함께 이를 극복하는 방법이 있다고 \u003cb class=\"key\">전환\u003c/b>해요. 그리고 시간을 절약하면 더 \u003cb class=\"key\">편안\u003c/b>해질 수 있다고 해결의 방향을 제시하죠. 문제를 키우는 데서 멈추지 않고 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">절약\u003c/b>이라는 실천적 해법으로 넘어가는 부분이에요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>구체적 해결책\u003csmall>해결책·예시 · 문장 11–14\u003c/small>\u003c/h4>\u003cp>시간을 절약하려면 먼저 \u003cb class=\"key\">할 \u003c/b>\u003cb class=\"key\">일 \u003c/b>\u003cb class=\"key\">목록\u003c/b>을 만들라고 조언해요. 그것이 더 \u003cb class=\"key\">긴급한 \u003c/b>\u003cb class=\"key\">일\u003c/b>에 집중하도록 도와주기 때문이죠. 또한 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">절약 \u003c/b>\u003cb class=\"key\">서비스\u003c/b>를 이용하라고 하며, 외식이나 요리 대신 음식 배달 서비스를 쓰는 예를 들어요. 추상적 해결책을 구체적인 행동과 예시로 풀어 주는 단계예요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 네 단계로 나누어 살펴볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 시간 부족 문제를 시간 기근이라는 개념으로 정의하는 부분이에요. 글은 시간이 충분하지 않다고 자주 느끼는지 물으며 시작하죠. 이어서 시간이 부족할 때 할 일이 너무 많다고 느끼는 감정을 설명하고, 그것을 시간 기근이라고 이름 붙여요. 즉 일상에서 흔히 겪는 시간 부족 문제를 시간 기근이라는 개념으로 정리하는 단계예요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 시간 기근의 영향을 보여 주는 부분이에요. 시간 기근은 사람을 긴장하게 하고 짜증 나게 한다고 설명하죠. 이어 시험공부를 할 때 이런 경험을 할 수 있다는 예를 들고, 한 연구가 시간 기근이 낮은 점수보다 더 큰 스트레스를 줄 수 있다고 밝혀요. 문제의 심각성을 연구 결과로 뒷받침하는 단계예요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 해결의 방향으로 전환하는 부분이에요. 걱정하지 말라는 말과 함께 이를 극복하는 방법이 있다고 전환하죠. 그리고 시간을 절약하면 더 편안해질 수 있다고 해결의 방향을 제시해요. 문제를 키우는 데서 멈추지 않고 시간 절약이라는 실천적 해법으로 넘어가는 단계예요.","hl":"f2"},{"n":7,"text":"네 번째 단계는 구체적인 해결책과 예시를 제시하는 부분이에요. 시간을 절약하려면 먼저 할 일 목록을 만들라고 조언하죠. 그것이 더 긴급한 일에 집중하도록 도와주기 때문이에요. 또한 시간 절약 서비스를 이용하라고 하며, 외식이나 요리 대신 음식 배달 서비스를 쓰는 예를 들어요. 추상적인 해결책을 구체적인 행동과 예시로 풀어 주는 단계예요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 9번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 먼저 시간 부족과 시간 기근의 영향이라는 문제를 제시하고, 8번의 But 뒤인 9번에서 이를 극복하는 방법이 있다고 \u003cb class=\"key\">주제문\u003c/b>을 제시해요. 이어 10~14번에서 시간 절약과 구체적 방법을 \u003cb class=\"key\">해결책\u003c/b>으로 제시하죠. 그래서 전개 방식은 문제와 해결의 구조이고, 핵심 주장이 뒤쪽에 나오는 \u003cb class=\"key\">미괄식\u003c/b>으로 볼 수 있어요. 문제의 심각성을 충분히 보여 준 뒤 해결 방향을 제시해 설득력을 높이는 구조예요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>One study shows (7)\u003c/b>\u003cspan>연구 근거 제시\u003c/span>\u003cb>But (8)\u003c/b>\u003cspan>문제에서 해결로 전환\u003c/span>\u003cb>To save time (11)\u003c/b>\u003cspan>목적을 밝히는 표현\u003c/span>\u003cb>Also (13)\u003c/b>\u003cspan>해결책 추가\u003c/span>\u003cb>For instance (14)\u003c/b>\u003cspan>구체적 예시 제시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">not enough time\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">too much to do when you do not have enough time\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">time famine\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">this\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">overcome this\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">saving time\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">time-saving services\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 문제와 해결의 구조예요. 먼저 시간 부족과 시간 기근의 영향을 문제로 길게 제시하고, But 뒤에 나오는 문장에서 이를 극복하는 방법이 있다고 주제문을 제시하죠. 이어서 시간 절약과 구체적인 방법을 해결책으로 보여 줍니다. 핵심 주장이 앞부분이 아니라 문제 설명 뒤에 나오기 때문에 미괄식으로 볼 수 있어요.","hl":"ty"},{"n":9,"text":"신호어를 보면 글의 구조가 더 선명해져요. One study shows는 연구 근거를 제시하고, But은 문제에서 해결로 방향을 전환하죠. To save time은 목적을 밝히고, Also는 해결책을 하나 더 추가하며, For instance는 구체적인 예시를 이끌어 냅니다. 또한 this나 time-saving services처럼 앞의 내용을 다시 받아 말하는 재진술도 눈여겨보세요. instead of는 외식이나 요리 대신 배달을 선택하는 대조를 보여 줍니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>often\u003c/b>\u003cem>부사\u003c/em>\u003cspan>자주\u003c/span>\u003c/div>\u003cdiv>\u003cb>enough\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>충분한\u003c/span>\u003c/div>\u003cdiv>\u003cb>feeling\u003c/b>\u003cem>명사\u003c/em>\u003cspan>감정, 느낌\u003c/span>\u003c/div>\u003cdiv>\u003cb>too much\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>너무 많은\u003c/span>\u003c/div>\u003cdiv>\u003cb>famine\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기근\u003c/span>\u003c/div>\u003cdiv>\u003cb>nervous\u feeling\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가지는 것의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">having \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">할 일이 너무 많은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">too \u003c/span>\u003cspan class=\"tgt\">much \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">do\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신에게 충분한 시간이 없을 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">enough \u003c/span>\u003cspan class=\"tgt\">time\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 시간이 충분하지 않을 때 할 일이 너무 많다고 느끼는 감정이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> '시간 기근'의 정체를 \u003cb class=\"key\">정의\u003c/b>해 주는 문장이에요. 할 일은 많은데 \u003cb class=\"key\">시간\u003c/b>이 부족한 상태를 하나의 \u003cb class=\"key\">감정\u003c/b>으로 표현했죠. when이 '~할 때'라는 상황을 붙여 주어 뜻이 정확해집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 of + 동명사(동명사의 목적어)\u003c/span> : the feeling [of + having(동명사) + 목적어] : \"할 일이 너무 많다는 (느낌의)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법(명사 수식)\u003c/span> : [명사] much + [to do (to부정사/형용사적)] : \"할 일이 너무 많은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">접속사 when이 이끄는 시간 부사절\u003c/span> : when + 주어 + 동사 ~ (시간 부사절) : \"당신에게 충분한 시간이 없을 때\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"It is the feeling, 그것은 ~한 감정이다. of having, 가지는 것의. too much to do, 할 일이 너무 많은. when you do not have enough time, 당신에게 충분한 시간이 없을 때. 이 문장 전체를 해석하면, 그것은 시간이 충분하지 않을 때 할 일이 너무 많다고 느끼는 감정이다.","hl":"m"},{"n":16,"text":"이 문장은 시간 기근이라는 개념을 정의해 주는 문장이에요. 할 일은 많은데 시간이 부족한 상태를 하나의 감정으로 딱 짚어 주고 있죠.","hl":"mn"},{"n":17,"text":"먼저 전치사 of 뒤에 동명사 having이 와서 앞의 명사 feeling의 내용을 설명해 줘요. 두 번째로 to do는 형용사적 용법으로 앞의 much를 꾸며 주는 to부정사예요. 마지막으로 when이 이끄는 부사절이 시간 상황을 붙여 준다는 것도 함께 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 ~이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시간 기근\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">time \u003c/span>\u003cspan class=\"tgt\">famine\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것이 바로 ‘시간 기근’이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 풀어 설명한 감정에 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">기근\u003c/b>이라는 이름을 붙이는 문장이에요. famine은 원래 '기근'인데, 여기서는 시간이 심하게 \u003cb class=\"key\">부족\u003c/b>한 상태를 비유한 표현이죠. 이 글 전체를 이끌어 가는 \u003cb class=\"key\">주제어\u003c/b>를 제시하는 핵심 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">2형식 문장(주격 보어)\u003c/span> : [주어] It + [동사] is + [주격 보어] time famine : \"그것은 시간 기근이다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"It is, 그것은 ~이다. time famine, 시간 기근. 이 문장 전체를 해석하면, 그것이 바로 ‘시간 기근’이다.","hl":"m"},{"n":19,"text":"앞에서 설명한 감정에 시간 기근이라는 이름표를 붙이는 문장이에요. famine이 원래 기근이라는 뜻이라, 시간이 심하게 부족한 상태를 비유하는 표현이 된다는 것도 눈여겨보세요.","hl":"mn"},{"n":20,"text":"여기서 It은 앞 문장의 감정을 가리키는 지시대명사예요. be동사 뒤에 명사 time famine이 와서 주어의 정체를 밝히는 주격 보어 역할을 하고, 이렇게 해서 이 글의 주제어가 완성됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은\u003c/span>\u003cspan class=\"en\">It\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분을 만들게 한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">makes \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">긴장을 느끼도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">feel\u003c/span> nervous.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 여러분을 긴장하게 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 time famine, 즉 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">기근\u003c/b>이 사람을 \u003cb class=\"key\">긴장\u003c/b>하게 만든다는 뜻이에요. \u003cb class=\"key\">사역동사\u003c/b> make가 '하게 만들다'라는 인과 관계를 드러내면서, 시간 부족이 주는 감정을 설명하는 흐름이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">사역동사 make + 목적어 + 동사원형\u003c/span> : make + [목적어 you] + [동사원형 feel (목적격보어)] : \"여러분이 긴장하게 만든다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"It, 그것은. makes you, 여러분을 만들게 한다. feel nervous, 긴장을 느끼도록. 이 문장 전체를 해석하면, 그것은 여러분을 긴장하게 한다.","hl":"m"},{"n":22,"text":"여기서 It은 바로 앞에 나온 시간 부족, 그러니까 time famine을 가리켜요. 그 현상이 여러분을 긴장하게 만든다는 뜻이죠. 시간 기근이 주는 감정을 설명하는 문장이에요.","hl":"mn"},{"n":23,"text":"첫 번째, make는 사역동사예요. 그래서 뒤에 오는 feel이 to부정사가 아니라 동사원형 그대로 나와요. 두 번째, makes you feel nervous를 통째로 '여러분을 긴장하게 만든다'로 덩어리로 읽어 두면 해석이 훨씬 빨라져요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은\u003c/span>\u003cspan class=\"en\">It\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분을 만들게 한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">makes \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">짜증 나게, 또한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">annoyed\u003c/span>, too.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">짜증 나게도 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장과 똑같은 \u003cb class=\"key\">사역\u003c/b> 구조를 다시 써서, 시간 부족이 주는 부정적 \u003cb class=\"key\">감정\u003c/b>이 짜증까지 포함한다는 걸 보여 줘요. too가 '역시'라는 뜻으로 앞 내용을 \u003cb class=\"key\">추가\u003c/b>하는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">사역동사 make + 목적어 + 형용사(목적격보어)\u003c/span> : make + [목적어 you] + [형용사 annoyed (목적격보어)] : \"여러분을 짜증 나게 만든다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"It, 그것은. makes you, 여러분을 만들게 한다. annoyed, too, 짜증 나게, 또한. 이 문장 전체를 해석하면, 짜증 나게도 한다.","hl":"m"},{"n":25,"text":"앞 문장과 똑같이 make를 써서 감정을 하나 더 붙였어요. 긴장에 이어서 짜증까지, 시간 부족이 주는 감정이 두 가지라는 걸 알려 주죠. too가 '역시'라는 말로 앞 내용을 추가해 주는 역할을 해요.","hl":"mn"},{"n":26,"text":"첫 번째, 여기서도 make가 사역동사로 쓰였어요. 두 번째, 이번에는 목적어 you 뒤에 동사원형이 아니라 형용사 annoyed가 왔죠. 목적어의 상태를 설명하는 목적격보어 자리예요. 세 번째, annoyed는 '짜증이 난'이라는 감정 형용사라서 사람인 you와 아주 잘 어울려요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은 이것을 경험할 수도 있다\u003c/span>\u003cspan class=\"en\">You \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">may \u003c/span>\u003cspan class=\"tgt\">experience\u003c/span> this\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공부할 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">study \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시험을 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">exams\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">시험공부를 할 때 이런 경험을 할 수도 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> this가 앞에서 말한 \u003cb class=\"key\">긴장\u003c/b>과 짜증, 그 감정들을 통째로 가리키는 \u003cb class=\"key\">지시어\u003c/b>예요. when절이 '시험공부를 할 때'라는 \u003cb class=\"key\">상황\u003c/b>을 콕 집어 주면서, 추상적인 이야기를 실제 경험으로 연결해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 may + 동사원형\u003c/span> : [조동사 may] + [동사원형 experience] : \"경험할 수도 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 when이 이끄는 시간 부사절\u003c/span> : [접속사 when] + [주어 you] + [동사 study] + [수식어 for exams] : \"시험공부를 할 때\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"You may experience this, 여러분은 이것을 경험할 수도 있다. when you study, 공부할 때. for exams, 시험을 위해. 이 문장 전체를 해석하면, 시험공부를 할 때 이런 경험을 할 수도 있다.","hl":"m"},{"n":28,"text":"this는 앞에서 나온 긴장과 짜증을 통째로 가리키는 지시어예요. when절이 '시험공부를 할 때'라는 상황을 콕 집어 주죠. 그래서 추상적인 이야기가 시험공부라는 실제 경험으로 이어지는 문장이에요.","hl":"mn"},{"n":29,"text":"첫 번째, may는 조동사라서 뒤에 동사원형 experience가 와요. '경험할 수도 있다'라는 가능성의 느낌이죠. 두 번째, when은 '~할 때'라는 시간 부사절을 이끄는 접속사예요. 그래서 when you study for exams 전체가 '시험공부를 할 때'라는 덩어리로 문장 뒤에 붙는답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 연구는 보여준다\u003c/span>\u003cspan class=\"en\">One study shows\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시간 기근이 학생들을 만들 수 있다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">time \u003c/span>\u003cspan class=\"tgt\">famine \u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">students \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 많은 스트레스를 받게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">feel \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">stressed\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 낮은 점수를 받을 때보다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">get \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">low \u003c/span>\u003cspan class=\"tgt\">score\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">한 연구에 따르면 시간 기근으로 인해 학생들은 낮은 점수를 받았을 때보다 더 많은 스트레스를 받을 수 있다고 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 시간 기근이 학생들의 스트레스에 큰 영향을 준다는 \u003cb class=\"key\">연구 \u003c/b>\u003cb class=\"key\">결과\u003c/b>를 제시하는 문장이에요. 점수가 낮을 때보다 오히려 시간이 부족할 때 더 \u003cb class=\"key\">스트레스\u003c/b>를 받는다는 점을 강조하죠. than when은 '~할 때보다'로 해석하는 \u003cb class=\"key\">비교\u003c/b> 표현이라는 점도 기억해야 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 목적어절(명사절)\u003c/span> : shows [that + 주어 + 동사 ~ (목적어절)] : \"시간 기근이 학생들을 더 스트레스 받게 만들 수 있다고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">사역동사 make + 목적어 + 원형부정사(목적격보어)\u003c/span> : make + [목적어 students] + [feel (원형부정사)] : \"학생들이 더 스트레스를 받게 만들다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">비교급 than + when절\u003c/span> : more stressed than [when + 주어 + 동사] : \"그들이 낮은 점수를 받을 때보다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"One study shows, 한 연구는 보여준다. that time famine can make students, 시간 기근이 학생들을 만들 수 있다고. feel more stressed, 더 많은 스트레스를 받게. than when they get a low score, 그들이 낮은 점수를 받을 때보다. 이 문장 전체를 해석하면, 한 연구에 따르면 시간 기근으로 인해 학생들은 낮은 점수를 받았을 때보다 더 많은 스트레스를 받을 수 있다고 한다.","hl":"m"},{"n":31,"text":"이 문장은 시간 기근이 학생들에게 얼마나 큰 영향을 주는지 보여주는 연구 결과를 소개하고 있어요. 점수가 낮을 때보다 오히려 시간이 없을 때 더 스트레스를 받는다는 거죠. 여기서 than when은 앞뒤 상황을 견주는 비교 표현이니까 '~할 때보다'로 자연스럽게 해석하면 됩니다.","hl":"mn"},{"n":32,"text":"먼저 첫 번째로 that time famine can make students feel more stressed에서 that은 show 뒤에서 목적어절을 여는 접속사예요. 두 번째로 make students feel에서 make는 사역동사라서 목적격보어에 to가 없는 원형부정사 feel이 온다는 점을 꼭 기억하세요. 세 번째로 more stressed than when they get a low score에서 than은 비교급과 짝을 이루어 비교 대상을 이끌고, 그 대상이 시간이기 때문에 when절이 오는 구조예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만\u003c/span>\u003cspan class=\"en\">But\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">걱정하지 마라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">worry\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 걱정하지 마라.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 시간 기근의 부정적인 영향 곧 스트레스를 이야기한 뒤 분위기를 바꾸는 \u003cb class=\"key\">전환\u003c/b> 문장이에요. worry는 '걱정하다'로, 독자에게 부담을 주지 않으려는 \u003cb class=\"key\">명령\u003c/b>의 표현이죠. 뒤에 해결책이 나온다는 신호를 주는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정 명령문(Do not + 동사원형)\u003c/span> : Do not + [동사원형 worry] : \"걱정하지 마라\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"But, 하지만. do not worry, 걱정하지 마라. 이 문장 전체를 해석하면, 하지만 걱정하지 마라.","hl":"m"},{"n":34,"text":"앞에서 시간 기근 때문에 스트레스를 받는다는 부정적인 이야기가 나왔죠. 그 흐름을 부드럽게 바꿔 주는 전환 문장이에요. worry는 걱정하다라는 뜻이고, 걱정하지 말라고 독자에게 가볍게 말을 거는 명령 표현이라서 뒤에 해결책이 나올 것이라는 신호를 줍니다.","hl":"mn"},{"n":35,"text":"do not worry는 부정 명령문이에요. 명령문에서 부정은 Do not을 앞에 두고 동사원형 worry를 그대로 쓰면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">방법이 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">way \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것을 극복하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">overcome \u003c/span>\u003cspan class=\"tgt\">this\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이를 극복하는 방법이 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞의 걱정을 잠재우고 해결책을 예고하는 \u003cb class=\"key\">전환\u003c/b> 문장이에요. a way to overcome this는 '이것을 극복하는 방법'이고, this는 앞에서 말한 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">기근\u003c/b>을 가리키죠. 뒤 문장에서 구체적인 방법이 나온다는 \u003cb class=\"key\">도입\u003c/b> 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">유도부사 There + be동사 구문\u003c/span> : There + be동사 + [주어 a way] : \"방법이 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : [명사 a way] + [to overcome (to부정사)] : \"이것을 극복하는 방법\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"There is a way, 방법이 있다. to overcome this, 이것을 극복하는. 이 문장 전체를 해석하면, 이를 극복하는 방법이 있다.","hl":"m"},{"n":37,"text":"걱정하지 말라는 말에 이어서 해결책을 예고하는 문장이에요. a way to overcome this는 이것을 극복하는 방법이라는 뜻이고, 여기서 this는 앞에서 나온 시간 기근을 가리킵니다. 그래서 뒤에 구체적인 방법이 나오겠다는 도입 역할을 하는 문장이에요.","hl":"mn"},{"n":38,"text":"There is a way는 '~이 있다'를 나타내는 유도부사 구문이에요. 진짜 주어는 be동사 뒤에 있는 a way이고, 해석할 때는 a way가 있다는 순서로 읽습니다. 그리고 a way to overcome this에서 to overcome은 앞의 명사를 꾸며 주는 형용사적 용법으로 '이것을 극복하는 방법'이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">너는 느낄 수 있다\u003c/span>\u003cspan class=\"en\">You \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">feel\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 편안하게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">relaxed\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시간을 절약함으로써\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">saving \u003c/span>\u003cspan class=\"tgt\">time\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">시간을 절약함으로써 더 편안해질 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 시간을 절약하는 것이 더 편안함을 느끼게 하는 \u003cb class=\"key\">수단\u003c/b>이 된다는 뜻이에요. 앞 문장에서 시간 부족을 극복하는 방법이 있다고 했으니, 그 방법의 \u003cb class=\"key\">결과\u003c/b>를 먼저 제시하는 문장이죠. by saving time은 '시간을 절약함으로써'라는 \u003cb class=\"key\">수단\u003c/b>을 나타내는 표현이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 can + 동사원형\u003c/span> : [[조동사 can]] + [동사원형 feel] : \"느낄 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">비교급(more + 형용사)\u003c/span> : more + [형용사 relaxed] : \"더 편안하게\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 by + 동명사(수단·방법)\u003c/span> : by + [[동명사]] (~함으로써) : \"시간을 절약함으로써\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"You can feel, 너는 느낄 수 있다. more relaxed, 더 편안하게. by saving time, 시간을 절약함으로써. 이 문장 전체를 해석하면, 시간을 절약함으로써 더 편안해질 수 있다.","hl":"m"},{"n":40,"text":"이 문장은 시간을 절약하는 것이 더 편안함을 느끼게 하는 수단이 된다는 뜻이에요. 앞에서 시간 부족을 극복하는 방법이 있다고 했으니, 그 방법의 결과를 먼저 보여 주는 거죠.","hl":"mn"},{"n":41,"text":"첫 번째로 can feel은 조동사 can 뒤에 동사원형이 온 형태예요. 두 번째로 more relaxed는 형용사 relaxed에 more를 붙인 비교급이에요. 세 번째로 by saving time에서 by 뒤에 동명사 saving이 와서 시간을 절약함으로써라는 수단을 나타냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시간을 절약하려면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">To \u003c/span>\u003cspan class=\"tgt\">save \u003c/span>\u003cspan class=\"tgt\">time\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만들라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">할 일 목록을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">to-do \u003c/span>\u003cspan class=\"tgt\">list\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">시간을 절약하려면 할 일 목록을 만들라.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 시간 절약의 \u003cb class=\"key\">구체적 \u003c/b>\u003cb class=\"key\">방법\u003c/b> 첫 번째로 할 일 목록 만들기를 제안하는 문장이에요. To save time은 '시간을 절약하려면'이라는 \u003cb class=\"key\">목적\u003c/b>을 나타내는 to부정사이고, make로 시작하는 \u003cb class=\"key\">명령문\u003c/b>으로 독자에게 행동을 권하고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : [[To]] + [동사원형 save] + 목적어 : \"시간을 절약하려면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명령문(동사원형으로 시작)\u003c/span> : [[동사원형]] + 목적어 (~하라) : \"할 일 목록을 만들라\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"To save time, 시간을 절약하려면. make, 만들라. a to-do list, 할 일 목록을. 이 문장 전체를 해석하면, 시간을 절약하려면 할 일 목록을 만들라.","hl":"m"},{"n":43,"text":"이 문장은 시간을 절약하는 구체적 방법 첫 번째로 할 일 목록 만들기를 제안하고 있어요. 앞의 목적 표현과 뒤의 명령문이 자연스럽게 이어지는 구조죠.","hl":"mn"},{"n":44,"text":"첫 번째로 To save time은 to부정사의 부사적 용법으로 목적을 나타내요. 두 번째로 make a to-do list는 동사원형으로 시작하는 명령문이에요. 그래서 주어 없이 동사원형으로 바로 시작한답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 너를 돕는다\u003c/span>\u003cspan class=\"en\">It \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">helps \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">집중하도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">focus \u003c/span>\u003cspan class=\"tgt\">on\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 긴급한 일들에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">urgent \u003c/span>\u003cspan class=\"tgt\">things\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">더 긴급한 c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시간 절약 서비스를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">time-saving \u003c/span>\u003cspan class=\"tgt\">services\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">또한 시간 절약 서비스를 이용하라.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 시간을 절약하는 구체적인 방법으로 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">절약 \u003c/b>\u003cb class=\"key\">서비스\u003c/b>를 이용하라는 \u003cb class=\"key\">명령\u003c/b>을 전달해요. 앞에서 시간을 아끼는 방법을 말한 뒤, 또 하나의 \u003cb class=\"key\">추가 \u003c/b>\u003cb class=\"key\">방법\u003c/b>을 제시하는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문(동사원형으로 시작하는 명령)\u003c/span> : [(주어 You 생략) + 동사원형 use + 목적어] : \"이용하라\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">복합형용사 + 명사\u003c/span> : [time-saving(시간을 절약하는) + services(서비스들)] : \"시간 절약 서비스를\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"Also, 또한. use, 이용하라. time-saving services, 시간 절약 서비스를. 이 문장 전체를 해석하면, 또한 시간 절약 서비스를 이용하라.","hl":"m"},{"n":49,"text":"이 문장은 시간을 절약하는 구체적인 방법으로 시간 절약 서비스를 이용하라는 명령을 전달해요. 앞에서 시간을 아끼는 방법을 말한 뒤, 또 하나의 추가 방법을 제시하는 역할을 해요.","hl":"mn"},{"n":50,"text":"첫 번째 어법은 명령문이에요. 주어 You를 생략하고 동사원형으로 시작해서 상대에게 명령을 나타내요. 그래서 use가 아니라 동사원형으로 쓰인 점을 기억해요. 두 번째 어법은 time-saving services인데요. time과 saving이 결합해 services를 꾸미는 복합형용사 역할을 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들어,\u003c/span>\u003cspan class=\"en\">For instance,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">너는 이용할 수 있다\u003c/span>\u003cspan class=\"en\">you \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">use\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">음식 배달 서비스를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">food \u003c/span>\u003cspan class=\"tgt\">delivery \u003c/span>\u003cspan class=\"tgt\">service\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대신에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">instead \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">외식하거나 요리하는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">eating \u003c/span>\u003cspan class=\"tgt\">out \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">cooking \u003c/span>\u003cspan class=\"tgt\">meals\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">예를 들어, 외식이나 요리 대신 음식 배달 서비스를 이용할 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 시간 절약 서비스의 \u003cb class=\"key\">구체적 \u003c/b>\u003cb class=\"key\">예\u003c/b>로 음식 배달 서비스를 제시해요. 외식이나 요리 대신 배달을 이용하면 \u003cb class=\"key\">시간\u003c/b>을 아낄 수 있다는 점을 알려 주죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 can + 동사원형\u003c/span> : [주어 you + 조동사 can + 동사원형 use] : \"이용할 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">복합명사\u003c/span> : [food delivery(음식 배달) + service(서비스)] : \"음식 배달 서비스를\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 instead of + 동명사\u003c/span> : [instead of + 동명사 eating out / cooking meals] : \"외식하거나 요리하는 것 대신에\"\u003c/div>\u003c/div>","segs":[{"n":51,"text":"For instance, 예를 들어. you can use, 너는 이용할 수 있다. a food delivery service, 음식 배달 서비스를. instead of, 대신에. eating out or cooking meals, 외식하거나 요리하는 것을. 이 문장 전체를 해석하면, 예를 들어, 외식이나 요리 대신 음식 배달 서비스를 이용할 수 있다.","hl":"m"},{"n":52,"text":"이 문장은 시간 절약 서비스의 구체적 예로 음식 배달 서비스를 제시해요. 외식이나 요리 대신 배달을 이용하면 시간을 아낄 수 있다는 점을 알려 주죠.","hl":"mn"},{"n":53,"text":"첫 번째 어법은 조동사 can이에요. can 뒤에는 동사원형 use가 와서 이용할 수 있다는 가능을 나타내요. 두 번째 어법은 a food delivery service인데, food delivery가 service를 꾸미는 복합명사 구조예요. 세 번째 어법은 instead of 뒤에 eating out or cooking meals처럼 동명사가 와서 외식하거나 요리하는 것 대신에라고 해석해요. eating out과 cooking meals는 or로 연결된 병렬 구조예요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>시간이 부족한데 할 일이 많다고 느끼는 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">기근\u003c/b>은 일상에서 흔히 경험하는 감정이다.\u003c/li>\u003cli>시간 기근은 사람을 \u003cb class=\"key\">긴장\u003c/b>하고 \u003cb class=\"key\">짜증\u003c/b> 나게 하며, 시험공부 중에는 낮은 점수보다 더 큰 \u003cb class=\"key\">스트레스\u003c/b>를 줄 수 있다.\u003c/li>\u003cli>걱정하지 말고 시간을 절약하면 더 \u003cb class=\"key\">편안\u003c/b>해질 수 있으며, 이를 위해 \u003cb class=\"key\">할 \u003c/b>\u003cb class=\"key\">일 \u003c/b>\u003cb class=\"key\">목록\u003c/b>을 만들 수 있다.\u003c/li>\u003cli>또한 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">절약 \u003c/b>\u003cb class=\"key\">서비스\u003c/b>를 이용해 외식이나 요리 대신 음식 배달을 활용하는 것도 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">기근\u003c/b>을 극복하는 방법이다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Time famine can make students stressed, but saving time with a to-do list and time-saving services helps overcome it and feel more relaxed.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">시간이 부족한데 할 일이 많다고 느끼는 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">기근\u003c/b>은 긴장과 짜증, 스트레스를 일으키지만, \u003cb class=\"key\">할 \u003c/b>\u003cb class=\"key\">일 \u003c/b>\u003cb class=\"key\">목록\u003c/b>과 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">절약 \u003c/b>\u003cb class=\"key\">서비스\u003c/b>로 시간을 절약하면 이를 극복하고 더 편안해질 수 있다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":54,"text":"정리해 볼게요. 시간 기근은 할 일이 많다고 느껴지는 심리적 압박이지만, 할 일 목록으로 긴급한 일에 집중하고 시간 절약 서비스를 활용하면 충분히 극복할 수 있어요. 오늘 배운 시간 기근과 시간 절약이라는 핵심어를 꼭 기억해 주세요. 수고했어요, 다음 시간에 또 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
