<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터1 Reading 03 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터1 Reading 03","audioDir":"reading03_audio","preview":false,"count":57,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.668em\">Reading\u003cbr>03\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터1\u003c/div>\u003ch1>The Joy of Viewing the World Differently\u003c/h1>\u003ch2>세상을 다르게 보는 기쁨\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>때때로 \u003cb class=\"key\">다른 \u003c/b>\u003cb class=\"key\">관점\u003c/b>은 우리를 즐겁게 한다. Picasso는 Three Musicians에서 \u003cb class=\"key\">추상적인 \u003c/b>\u003cb class=\"key\">형태\u003c/b>로 연주자들을 표현해, 계속 보면 작품을 이해하고 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">기쁨\u003c/b>을 느끼게 한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Viewing things differently can help us understand art and bring us new joy.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 Pablo Picasso의 작품을 통해 다른 관점이 주는 즐거움을 읽어 볼 거예요. 이 글은 Picasso가 Three Musicians에서 추상적인 형태로 연주자들을 표현했다는 내용을 담고 있어요. 처음에는 낯설지만 계속 보면 작품이 보이고, 결국 새로운 기쁨을 얻는다는 이야기예요. 그럼 함께 시작해 볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">20세기 초 미술에서는 사물을 사실적으로 그리는 대신 여러 시점을 한 화면에 담는 \u003cb class=\"key\">입체파\u003c/b>가 등장했어요. Picasso는 대표적인 입체파 화가로, 대상을 그대로 베끼기보다 여러 관점을 조각처럼 재구성했죠. 이런 \u003cb class=\"key\">추상 \u003c/b>\u003cb class=\"key\">미술\u003c/b>은 처음 보면 무엇을 그린 것인지 낯설고 \u003cb class=\"key\">퍼즐\u003c/b>처럼 느껴질 수 있어요. 마치 처음 보는 지도를 돌려 가며 보면 길이 갑자기 보이는 것과 비슷해요. 작품을 계속 보기와 여러 각도에서 생각하기를 반복하면 숨은 형태가 서서히 눈에 들어오고 감상의 즐거움이 커져요.\u003c/div>","segs":[{"n":2,"text":"지난 세기 초 미술에서는 사물을 사실적으로 그리는 대신 여러 시점을 한 화면에 담는 입체파가 등장했어요. Picasso는 대표적인 입체파 화가로, 대상을 그대로 베끼기보다 여러 관점을 조각처럼 재구성했죠. 이런 추상 미술은 처음 보면 무엇을 그린 것인지 낯설고 퍼즐처럼 느껴질 수 있어요. 마치 처음 보는 지도를 돌려 가며 보면 길이 갑자기 보이는 것과 비슷해요. 작품을 계속 보기와 여러 각도에서 생각하기를 반복하면 숨은 형태가 서서히 눈에 들어오고 감상의 즐거움이 커져요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>다른 관점의 즐거움\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>글은 때때로 \u003cb class=\"key\">다른 \u003c/b>\u003cb class=\"key\">관점\u003c/b>이 우리를 즐겁게 한다는 일반적인 생각으로 시작해요. 이어서 유명한 예술가인 Picasso가 세상을 다르게 보려고 노력했다는 사례를 제시하며 \u003cb class=\"key\">즐거움\u003c/b>의 근원이 새로운 시선임을 암시해요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>추상화 속 숨은 연주자\u003csmall>예시 · 문장 3–8\u003c/small>\u003c/h4>\u003cp>Picasso는 Three Musicians에서 세 명의 연주자를 그렸지만 사람 대신 \u003cb class=\"key\">추상적인 \u003c/b>\u003cb class=\"key\">형태\u003c/b>를 사용했어요. 처음에는 연주자를 \u003cb class=\"key\">알아차리기\u003c/b> 어렵고 아무것도 이해되지 않지만, \u003cb class=\"key\">계속 \u003c/b>\u003cb class=\"key\">보기\u003c/b>를 하면 그림 속에서 그들을 볼 수 있다고 설명해요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>퍼즐 같은 특별한 그림\u003csmall>해석 · 문장 9–12\u003c/small>\u003c/h4>\u003cp>작품 감상은 마치 \u003cb class=\"key\">퍼즐\u003c/b>과 같아요. Picasso는 형태와 사물과 색깔을 \u003cb class=\"key\">실제 \u003c/b>\u003cb class=\"key\">세상\u003c/b>과 매우 다르게 사용하는 \u003cb class=\"key\">특별한 \u003c/b>\u003cb class=\"key\">방식\u003c/b>으로 그림을 그렸고, 그래서 그의 작품은 매우 독특해 보여요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>새로운 시선, 새로운 기쁨\u003csmall>결론 · 문장 13–15\u003c/small>\u003c/h4>\u003cp>작품을 이해하려면 사물을 \u003cb class=\"key\">완전히 \u003c/b>\u003cb class=\"key\">다르게\u003c/b> 보아야 해요. 그럴 때 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">기쁨\u003c/b>이 생기며, 글은 결국 \u003cb class=\"key\">세상을 \u003c/b>\u003cb class=\"key\">다르게 \u003c/b>\u003cb class=\"key\">보는 \u003c/b>\u003cb class=\"key\">기쁨\u003c/b>으로 마무리돼요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 네 단계로 나누어 살펴보면, 다른 관점에서 시작해 Picasso의 작품 예시를 거쳐 마지막에 새로운 기쁨으로 나아갑니다.","hl":null},{"n":4,"text":"먼저 첫 단계는 도입이에요. 글은 때때로 다른 관점이 우리를 즐겁게 한다는 생각으로 시작해요. 이어서 Picasso가 세상을 다르게 보려고 노력했다는 사례를 꺼내며, 즐거움의 근원이 새로운 시선이라는 점을 암시하죠.","hl":"f0"},{"n":5,"text":"두 번째 단계는 작품 예시예요. Picasso는 Three Musicians에서 세 명의 연주자를 그렸지만 사람 대신 추상적인 형태를 사용했어요. 처음에는 연주자를 알아차리기 어렵고 아무것도 이해되지 않지만, 계속 보기를 하면 그림 속에서 그들을 볼 수 있다고 설명해요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 해석이에요. 작품 감상은 마치 퍼즐과 같다고 말해요. Picasso는 형태와 사물과 색깔을 실제 세상과 매우 다르게 사용하는 특별한 방식으로 그림을 그렸고, 그래서 그의 작품은 매우 독특해 보여요.","hl":"f2"},{"n":7,"text":"마지막 단계는 결론이에요. 작품을 이해하려면 사물을 완전히 다르게 보아야 해요. 그럴 때 새로운 기쁨이 생기며, 글은 결국 세상을 다르게 보는 기쁨으로 마무리돼요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">예시\u003c/span>\u003cspan class=\"lp-pill\">양괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 다른 관점이 즐거움을 준다는 주제를 먼저 제시하고, Picasso의 작품을 \u003cb class=\"key\">예시\u003c/b>로 들어 설명해요. 마지막 문장에서 세상을 다르게 보는 기쁨이라는 결론으로 주제를 다시 강조하므로 \u003cb class=\"key\">양괄식\u003c/b> 구조로 볼 수 있어요. 따라서 중심 내용을 담은 \u003cb class=\"key\">주제문\u003c/b>은 첫 번째 문장으로 잡는 것이 자연스러워요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>For example (2)\u003c/b>\u003cspan>예시 제시\u003c/span>\u003cb>But (4)\u003c/b>\u003cspan>앞 내용 전환\u003c/span>\u003cb>Instead (5)\u003c/b>\u003cspan>대안 제시\u003c/span>\u003cb>But when (8)\u003c/b>\u003cspan>조건 전환\u003c/span>\u003cb>so (11)\u003c/b>\u003cspan>정도 강조\u003c/span>\u003cb>To understand (13)\u003c/b>\u003cspan>목적·결론 유도\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">a different view\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">see the world differently\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">view things completely differently\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">viewing the world differently\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>실제 세상 그대로 보기\u003c/th>\u003cth>Picasso처럼 다르게 보기\u003c/th>\u003c/tr>\u003ctr>\u003ctd>형태와 색을 사실적으로 표현\u003c/td>\u003ctd>추상적인 형태로 재구성\u003c/td>\u003c/tr>\u003ctr>\u003ctd>처음에는 이해하기 어려움\u003c/td>\u003ctd>계속 보면 연주자가 보임\u003c/td>\u003c/tr>\u003ctr>\u003ctd>익숙하지만 새로운 기쁨은 적음\u003c/td>\u003ctd>낯설지만 새로운 기쁨을 얻음\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 예시예요. 첫 문장에서 주제를 제시한 뒤 Picasso의 작품을 예로 들어 설명하고, 마지막 문장에서 다시 주제를 강조해요. 그래서 처음과 끝에 중심 내용이 놓이는 양괄식 구조로 볼 수 있어요. 중심 내용을 담은 주제문은 첫 번째 문장으로 잡는 것이 자연스러워요.","hl":"ty"},{"n":9,"text":"신호어를 보면 글의 흐름이 잘 보여요. For example은 예시를 꺼내는 표시이고, But과 Instead는 앞 내용을 전환하고 대안을 제시하는 표시예요. But when은 처음과 계속 보기의 대조를 만들고, To understand는 결론으로 가는 길을 열어 주죠. 또 a different view와 see the world differently처럼 같은 생각을 바꿔 말하는 재진술도 눈여겨보세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>different\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>다른\u003c/span>\u003c/div>\u003cdiv>\u003cb>view\u003c/b>\u003cem>명사\u003c/em>\u003cspan>관점, 견해\u003c/span>\u003c/div>\u003cdiv>\u003cb>please\u003c/b>\u003cem>동사\u003c/em>\u003cspan>기쁘게 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>for example\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>예를 들어\u003c/span>\u003c/div>\u003cdiv>\u003cb>famous\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>유명한\u003c/span>\u003c/div>\u003cdiv>\u003cb>artist\u003c/b>\u003cem>명사\u003c/em>\u003cspan>예술가\u003c/span>\u003c/div>\u003cdiv>\u003cb>try\u003c/b>\u003cem>동사\u003c/em>\u003cspan>시도하다, 노력하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>world\u003c/b>\u003cem>명사\u003c/em>\u003cspan>세상\u003c/span>\u003c/div>\u003cdiv>\u003cb>differently\u003c/b>\u003cem>부사\u003c/em>\u003cspan>다르게\u003c/span>\u003c/div>\u003cdiv>\u003cb>work\u003c/b>\u003cem>명사\u003c/em>\u003cspan>작품\u003c/span>\u003c/div>\u003cdiv>\u003cb>paint\u003c/b>\u003cem>동사\u003c/em>\u003cspan>그리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>player\u003c/b>\u003cem>명사\u003c/em>\u003cspan>연주자\u003c/span>\u003c/div>\u003cdiv>\u003cb>draw\u003c/b>\u003cem>동사\u003c/em>\u003cspan>그리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>instead\u003c/b>\u003cem>부사\u003c/em>\u003cspan>대신에\u003c/span>\u003c/div>\u003cdiv>\u003cb>abstract\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>추상적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>shape\u003c/b>\u003cem>명사\u003c/em>\u003cspan>형태\u003c/span>\u003c/div>\u003cdiv>\u003cb>notice\u003c/b>\u003cem>동사\u003c/em>\u003cspan>알아차리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>make sense\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>이해되다, 말이 되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>keep\u003c/b>\u003cem>동사\u003c/em>\u003cspan>계속하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>look at\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 보다\u003c/span>\u003c/div>\u003cdiv>\u003cb>painting\u003c/b>\u003cem>명사\u003c/em>\u003cspan>그림\u003c/span>\u003c/div>\u003cdiv>\u003cb>puzzle\u003c/b>\u003cem>명사\u003c/em>\u003cspan>퍼즐\u003c/span>\u003c/div>\u003cdiv>\u003cb>special\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>특별한\u003c/span>\u003c/div>\u003cdiv>\u003cb>way\u003c/b>\u003cem>명사\u003c/em>\u003cspan>방식, 방법\u003c/span>\u003c/div>\u003cdiv>\u003cb>object\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사물, 물체\u003c/span>\u003c/div>\u003cdiv>\u003cb>real world\u003c/b>\u003cem>명사\u003c/em>\u003cspan>실제 세상\u003c/span>\u003c/div>\u003cdiv>\u003cb>unique\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>독특한\u003c/span>\u003c/div>\u003cdiv>\u003cb>understand\u003c/b>\u003cem>동사\u003c/em>\u003cspan>이해하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>completely\u003c/b>\u003cem>부사\u003c/em>\u003cspan>완전히\u003c/span>\u003c/div>\u003cdiv>\u003cb>joy\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기쁨\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어도 짚어 볼게요. abstract는 추상적인, shape는 형태, notice는 알아차리다, unique는 독특한이라는 뜻이에요. make sense는 이해되다, instead는 대신에, completely는 완전히로 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">different\u003c/b>\u003cspan class=\"m\">다른\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">distinct\u003c/span>\u003cspan class=\"s\">diverse\u003c/span>\u003cspan class=\"s\">unlike\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">same\u003c/span>\u003cspan class=\"a\">similar\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">view\u003c/b>\u003cspan class=\"m\">관점\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">perspective\u003c/span>\u003cspan class=\"s\">outlook\u003c/span>\u003cspan class=\"s\">opinion\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">famous\u003c/b>\u003cspan class=\"m\">유명한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">well-known\u003c/span>\u003cspan class=\"s\">renowned\u003c/span>\u003cspan class=\"s\">celebrated\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unknown\u003c/span>\u003cspan class=\"a\">obscure\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">abstract\u003c/b>\u003cspan class=\"m\">추상적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">conceptual\u003c/span>\u003cspan class=\"s\">theoretical\u003c/span>\u003cspan class=\"s\">nonrepresentational\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">concrete\u003c/span>\u003cspan class=\"a\">realistic\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">notice\u003c/b>\u003cspan class=\"m\">알아차리다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">observe\u003c/span>\u003cspan class=\"s\">detect\u003c/span>\u003cspan class=\"s\">recognize\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003cspan class=\"a\">overlook\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">unique\u003c/b>\u003cspan class=\"m\">독특한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">distinctive\u003c/span>\u003cspan class=\"s\">unusual\u003c/span>\u003cspan class=\"s\">original\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">common\u003c/span>\u003cspan class=\"a\">ordinary\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">understand\u003c/b>\u003cspan class=\"m\">이해하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">comprehend\u003c/span>\u003cspan class=\"s\">grasp\u003c/span>\u003cspan class=\"s\">realize\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">misunderstand\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">joy\u003c/b>\u003cspan class=\"m\">기쁨\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">delight\u003c/span>\u003cspan class=\"s\">pleasure\u003c/span>\u003cspan class=\"s\">happiness\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">sorrow\u003c/span>\u003cspan class=\"a\">sadness\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"시험에 자주 나오는 어휘는 동의어와 반의어까지 묶어서 기억하면 좋아요. different의 동의어는 distinct, diverse, unlike이고 반의어는 same, similar예요. famous는 well-known, renowned와 가깝고 unknown, obscure와 반대돼요. abstract는 conceptual, theoretical과 연결되고 concrete, realistic과 반대이며, unique는 distinctive, original과 가깝고 common, ordinary와 반대예요. joy는 delight, pleasure와 같고 sorrow, sadness와 반대라는 점도 함께 정리해 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">때때로\u003c/span>\u003cspan class=\"en\">Sometimes\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 관점은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">different \u003c/span>\u003cspan class=\"tgt\">view\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리를 즐겁게 한다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">pleases\u003c/span> us.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">때때로 다른 관점은 우리를 즐겁게 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글의 첫 문장으로, '다른 관점이 주는 즐거움'이라는 \u003cb class=\"key\">주제\u003c/b>를 먼저 던지는 문장이에요. 뒤에 이어질 피카소 이야기가 이 주장을 뒷받침하는 \u003cb class=\"key\">예시\u003c/b>가 되므로, 결론을 먼저 말하고 근거를 붙이는 \u003cb class=\"key\">두괄식\u003c/b> 도입이라고 볼 수 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">형용사의 명사 수식\u003c/span> : [a] + [different (형용사)] + [view (명사)] : \"다른 관점\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주어-동사 수 일치(삼인칭 단수 현재)\u003c/span> : [주어 a different view (단수)] + [동사 pleases] + [목적어 us] : \"우리를 즐겁게 한다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Sometimes, 때때로. a different view, 다른 관점은. pleases us, 우리를 즐겁게 한다.. 이 문장 전체를 해석하면, 때때로 다른 관점은 우리를 즐겁게 한다.","hl":"m"},{"n":13,"text":"이 문장은 글의 첫 문장이에요. 다른 관점이 우리를 즐겁게 한다는 주제를 먼저 던지고 있죠. 바로 뒤에 나오는 피카소 이야기가 이 주장을 받쳐 주는 예시가 된답니다.","hl":"mn"},{"n":14,"text":"먼저 different를 보세요. 명사 view 앞에서 명사 수식을 하면서 다른이라는 뜻을 더해 주고 있어요. 두 번째로 주어가 a different view, 단수죠. 그래서 동사에 s가 붙은 pleases를 쓴 겁니다. 주어와 동사의 수 일치는 시험에 정말 자주 나오니까 꼭 챙겨 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 15\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들어,\u003c/span>\u003cspan class=\"en\">For example,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">파블로 피카소는,\u003c/span>\u003cspan class=\"en\">Pablo Picasso,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유명한 예술가인,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">famous \u003c/span>\u003cspan class=\"tgt\">artist\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보려고 노력했다\u003c/span>\u003cspan class=\"en\">tried \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">see\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세상을 다르게.\u003c/span>\u003cspan class=\"en\">the world \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">differently\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">예를 들어, 유명한 예술가인 파블로 피카소는 세상을 다르게 보려고 노력했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 '다른 관점은 즐겁다'는 주장에 실제 인물을 붙여 \u003cb class=\"key\">근거\u003c/b>를 대는 문장이에요. 피카소가 세상을 다르게 보려고 노력한 사람이라는 점을 먼저 제시해, 뒤에 나올 그의 작품 설명으로 자연스럽게 넘어가게 해요. 콤마 사이의 a famous artist는 피카소를 풀어 주는 \u003cb class=\"key\">동격\u003c/b> 표현이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동격(콤마로 연결된 명사구)\u003c/span> : [Pablo Picasso] , [a famous artist] , (앞 명사를 부연 설명하는 동격) : \"유명한 예술가인\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : tried + [to see (to부정사구/목적어)] : \"보는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">부사의 동사구 수식\u003c/span> : [see + the world] + [differently (부사)] : \"다르게\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"For example, 예를 들어. Pablo Picasso, 파블로 피카소는. a famous artist, 유명한 예술가인. tried to see, 보려고 노력했다. the world differently, 세상을 다르게.. 이 문장 전체를 해석하면, 예를 들어, 유명한 예술가인 파블로 피카소는 세상을 다르게 보려고 노력했다.","hl":"m"},{"n":16,"text":"앞 문장에서 다른 관점이 즐겁다고 했죠. 이 문장은 그 주장을 증명할 사례로 피카소를 데려옵니다. 피카소가 세상을 다르게 보려고 노력한 사람이라는 점을 먼저 알려 주는 거예요.","hl":"mn"},{"n":17,"text":"첫 번째로 콤마 사이의 a famous artist를 보세요. 앞의 Pablo Picasso와 동격 관계로, 같은 사람을 풀어 설명하는 표현입니다. 두 번째로 tried to see에서 to see는 try의 목적어 역할을 하는 to부정사구예요. 마지막에 differently가 동사구 see the world를 수식해서 세상을 다르게 본다는 뜻을 만들어 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 유명한 작품 ‘세 명의 악사들’에서,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">In \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">famous \u003c/span>\u003cspan class=\"tgt\">work \u003c/span>\u003cspan class=\"tgt\">Three \u003c/span>\u003cspan class=\"tgt\">Musicians\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 그렸다\u003c/span>\u003cspan class=\"en\">he \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">painted\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세 명의 연주자들을.\u003c/span>\u003cspan class=\"en\">three music players.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그의 유명한 작품 ‘세 명의 악사들’에서, 그는 세 명의 연주자들을 그렸다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 피카소가 어떤 작품에서 무엇을 그렸는지 구체적으로 밝히는 문장이에요. 작품 이름과 대상인 '세 명의 연주자'를 먼저 제시해 두었다가, 다음 문장에서 '사람을 그리지는 않았다'고 \u003cb class=\"key\">반전\u003c/b>을 만들 준비를 하는 거죠. 작품 제목은 대문자로 표기해 \u003cb class=\"key\">고유명사\u003c/b>임을 드러내요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구(부사구)의 문두 배치\u003c/span> : [In + 명사구 (전치사구/부사구)] + [주어 + 동사] : \"그의 유명한 작품 ‘세 명의 악사들’에서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">완전타동사의 목적어\u003c/span> : [주어 he] + [동사 painted] + [목적어 three music players] : \"그는 세 명의 연주자들을 그렸다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"In his famous work Three Musicians, 그의 유명한 작품 ‘세 명의 악사들’에서. he painted, 그는 그렸다. three music players, 세 명의 연주자들을.. 이 문장 전체를 해석하면, 그의 유명한 작품 ‘세 명의 악사들’에서, 그는 세 명의 연주자들을 그렸다.","hl":"m"},{"n":19,"text":"이 문장은 피카소가 어떤 작품에서 무엇을 그렸는지 구체적으로 알려 줍니다. 작품 이름을 먼저 말하고, 그 안에 세 명의 연주자가 있다고 밝히고 있죠. 다음 문장에서 사람을 그리지는 않았다고 뒤집을 준비를 하는 셈이에요.","hl":"mn"},{"n":20,"text":"먼저 문장 앞에 나온 In his famous work Three Musicians를 보세요. 작품이라는 배경을 먼저 보여 주려고 전치사구를 문두에 둔 것이고, 주어 he와 동사 painted의 순서는 그대로예요. 두 번째로 painted는 목적어 하나만 있으면 뜻이 완성되는 완전타동사라서 뒤에 three music players가 목적어로 옵니다. 작품 제목은 대문자로 시작한다는 점도 함께 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만\u003c/span>\u003cspan class=\"en\">But\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 그리지 않았다\u003c/span>\u003cspan class=\"en\">he \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">did \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">draw\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세 사람을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">three \u003c/span>\u003cspan class=\"tgt\">people\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 그는 세 사람을 그리지 않았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 세 명의 연주자를 그렸다고 말한 뒤, 실제로는 사람을 그대로 그린 것이 아니라는 점을 'But'으로 뒤집어 보여 주는 문장이에요. 이 \u003cb class=\"key\">대조\u003c/b>가 다음 문장의 추상적 형태 설명으로 이어지는 흐름을 만들어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거 부정문\u003c/span> : 주어 + did not + 동사원형 : \"그리지 않았다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">타동사의 목적어\u003c/span> : draw + 목적어 : \"세 사람을\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"But, 하지만. he did not draw, 그는 그리지 않았다. three people, 세 사람을. 이 문장 전체를 해석하면, 하지만 그는 세 사람을 그리지 않았다.","hl":"m"},{"n":22,"text":"앞에서는 세 명의 연주자를 그렸다고 했죠. 그런데 But이 앞 내용과 대조를 이루면서 사람을 그대로 그린 게 아니라는 점을 분명히 해요. 그래서 다음에 추상적인 형태를 사용했다는 설명으로 자연스럽게 이어집니다.","hl":"mn"},{"n":23,"text":"첫 번째로 did not draw는 과거 사실을 부정하는 형태예요. 조동사 did와 not을 쓰고, 본동사는 동사원형 draw로 둡니다. 두 번째로 three people이 와서 목적어 역할을 하죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대신,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Instead,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 사용하였다\u003c/span>\u003cspan class=\"en\">he \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">used \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">추상적인 형태를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">abstract \u003c/span>\u003cspan class=\"tgt\">shapes\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">대신, 그는 추상적인 형태를 사용하였다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 피카소가 사람을 사실적으로 그리는 대신 추상적인 형태를 선택했다는 \u003cb class=\"key\">대안\u003c/b>을 제시해요. 앞 문장의 부정 내용과 'Instead'가 연결되어 \u003cb class=\"key\">대조\u003c/b>의 흐름을 완성합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">문장 전환 부사\u003c/span> : Instead + , + 주어 + 동사 : \"대신에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">타동사와 목적어\u003c/span> : used + 목적어 : \"추상적인 형태를 사용하였다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Instead, 대신. he used, 그는 사용하였다. abstract shapes, 추상적인 형태를. 이 문장 전체를 해석하면, 대신, 그는 추상적인 형태를 사용하였다.","hl":"m"},{"n":25,"text":"앞에서 사람을 그리지 않았다고 했죠. 그 대안으로 추상적인 형태를 사용했다는 말이 이어집니다. Instead가 앞 내용과 대조의 흐름을 만들면서 피카소의 독특한 방식을 보여 줘요.","hl":"mn"},{"n":26,"text":"첫 번째로 Instead는 앞 문장과 이어 주는 전환어예요. '대신에'라는 뜻으로 대안을 제시하죠. 두 번째로 used는 타동사라서 뒤에 목적어가 필요해요. 여기서는 abstract shapes가 목적어 역할을 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분이 이 작품을 처음 볼 때는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">first \u003c/span>\u003cspan class=\"tgt\">see \u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">work\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은 알아차리지 못할 수도 있다\u003c/span>\u003cspan class=\"en\">you \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">may \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">notice\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 연주자들을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">players\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여러분이 이 작품을 처음 볼 때는 그 연주자들을 알아차리지 못할 수도 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 작품을 처음 볼 때는 연주자들이 잘 보이지 않을 수 있다는 \u003cb class=\"key\">시간적 \u003c/b>\u003cb class=\"key\">조건\u003c/b>을 제시해요. 이 문장은 다음의 '아무것도 이해되지 않는다'는 반응으로 이어지고, 뒤에서 계속 보면 보인다는 \u003cb class=\"key\">반전\u003c/b>을 준비합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간의 부사절을 이끄는 접속사 when\u003c/span> : When + 주어 + 동사, 주어 + 동사 : \"여러분이 이 작품을 처음 볼 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 may의 부정\u003c/span> : may not + 동사원형 : \"알아차리지 못할 수도 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">정관사 the\u003c/span> : the + 복수 명사 : \"그 연주자들을\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"When you first see this work, 여러분이 이 작품을 처음 볼 때는. you may not notice, 여러분은 알아차리지 못할 수도 있다. the players, 그 연주자들을. 이 문장 전체를 해석하면, 여러분이 이 작품을 처음 볼 때는 그 연주자들을 알아차리지 못할 수도 있다.","hl":"m"},{"n":28,"text":"작품을 처음 볼 때는 연주자들이 잘 안 보일 수 있다는 시간적 조건을 말해요. 이 문장 덕분에 다음에 나오는 '아무것도 이해되지 않는다'는 반응이 자연스럽게 이어지죠. 그리고 계속 보면 보인다는 뒤의 반전을 준비하는 역할도 합니다.","hl":"mn"},{"n":29,"text":"첫 번째로 When은 '~할 때'라는 시간의 부사절을 이끌어요. 이때 부사절에서는 미래의 의미라도 현재시제를 씁니다. 두 번째로 may not notice에서 may는 추측을 나타내고, not은 '알아차리지 못할 수도 있다'는 부분 부정의 느낌을 줘요. 마지막으로 the players는 앞에서 언급된 연주자들을 가리키므로 정관사 the를 쓴 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아무것도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Nothing\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이해되지 않을 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">makes \u003c/span>\u003cspan class=\"tgt\">sense\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분에게는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">you\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">아무것도 이해되지 않을 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 작품을 처음 보면 무엇 하나 이해되지 않을 것이라는 뜻이에요. 주어 \u003cb class=\"key\">Nothing\u003c/b>이 '아무것도'라는 뜻으로 쓰여 \u003cb class=\"key\">부정\u003c/b>의 느낌을 분명히 해 줍니다. 그래서 앞에서 연주자들이 잘 보이지 않는다는 흐름을 이어 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정대명사(주어)\u003c/span> : [Nothing (부정대명사)] + [makes (단수 동사)] : \"아무것도\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관용표현(make sense)\u003c/span> : [make sense] = 이해가 되다, 말이 되다 : \"이해되다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 to의 대상\u003c/span> : [make sense + to + 대상] : \"여러분에게\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Nothing, 아무것도. makes sense, 이해되지 않을 것이다. to you, 여러분에게는. 이 문장 전체를 해석하면, 아무것도 이해되지 않을 것이다.","hl":"m"},{"n":31,"text":"이 문장은 작품을 처음 보면 무엇 하나 이해되지 않을 것이라는 뜻이에요. 주어 Nothing이 아무것도라는 뜻으로 쓰여 부정의 느낌을 분명히 해 줍니다. 그래서 앞에서 연주자들이 잘 보이지 않는다는 흐름을 이어 줘요.","hl":"mn"},{"n":32,"text":"첫 번째로 Nothing은 아무것도라는 뜻의 부정대명사예요. 두 번째로 makes sense는 이해가 되다라는 뜻의 관용표현이죠. 세 번째로 to you에서 to는 판단이나 이해의 대상을 나타내서 여러분에게로 해석해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 15\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만\u003c/span>\u003cspan class=\"en\">But\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분이 계속해서 보면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">when\u003c/span> you \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">keep \u003c/span>\u003cspan class=\"tgt\">looking\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 그림을\u003c/span>\u003cspan class=\"en\">at the painting,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은 그들을 볼 수 있다\u003c/span>\u003cspan class=\"en\">you \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">see\u003c/span> \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">them\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 안에서!\u003c/span>\u003cspan class=\"en\">in it!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 계속해서 그 그림을 보면, 여러분은 그 그림 속에서 그들을 볼 수 있다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 처음에는 이해가 안 되지만 계속 보면 그림 속에서 연주자들을 발견할 수 있다는 뜻이에요. when 절은 '계속해서 그 그림을 보면'이라는 \u003cb class=\"key\">시간적 \u003c/b>\u003cb class=\"key\">배경\u003c/b>을 만들고, keep looking은 보는 행동의 \u003cb class=\"key\">지속\u003c/b>을 나타내요. them은 앞에 나온 세 명의 연주자들을 가리키는 \u003cb class=\"key\">대명사\u003c/b>예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 when(시간 부사절)\u003c/span> : [when + 주어 + 동사], [주어 + 동사] : \"~하면, ~할 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">keep + 동명사\u003c/span> : [keep + -ing] = 계속 ~하다 : \"계속 보다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">조동사 can + 동사원형\u003c/span> : [can + 동사원형] = ~할 수 있다 : \"볼 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">인칭대명사(목적격)\u003c/span> : [see + them (목적어)] : \"그들을\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"But, 하지만. when you keep looking, 여러분이 계속해서 보면. at the painting, 그 그림을. you can see them, 여러분은 그들을 볼 수 있다. in it!, 그 안에서!. 이 문장 전체를 해석하면, 하지만 계속해서 그 그림을 보면, 여러분은 그 그림 속에서 그들을 볼 수 있다!","hl":"m"},{"n":34,"text":"이 문장은 처음에는 이해가 안 되지만 계속 보면 그림 속에서 연주자들을 발견할 수 있다는 뜻이에요. when 절은 계속해서 그 그림을 보면이라는 시간적 배경을 만들고, keep looking은 보는 행동의 지속을 나타내요. them은 앞에 나온 세 명의 연주자들을 가리키는 대명사예요.","hl":"mn"},{"n":35,"text":"첫 번째로 when은 시간 부사절을 이끄는 접속사예요. 두 번째로 keep looking은 keep 뒤에 동명사 looking이 와서 계속 보다라는 지속의 의미를 만들어요. 세 번째로 can see는 조동사 can 뒤에 동사원형 see가 온 형태죠. 네 번째로 them은 앞에 나온 세 명의 연주자들을 가리키는 목적격 대명사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It's\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마치 같다는 뜻\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">like\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">퍼즐\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">puzzle\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 마치 퍼즐과 같다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 피카소의 작품을 보는 과정이 퍼즐을 푸는 것과 비슷하다고 비유해요. 앞에서 계속 보면 연주자들이 보인다고 했으니, 처음엔 헷갈려도 조각을 맞추듯 이해하게 된다는 \u003cb class=\"key\">비유\u003c/b>예요. like는 '좋아하다'가 아니라 '~와 같은'이라는 \u003cb class=\"key\">전치사\u003c/b>로 쓰였어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사 축약형\u003c/span> : [It's = It is] : \"그것은 ~이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 like\u003c/span> : [be + like + 명사] = ~와 같다 : \"~와 같은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">명사 보어\u003c/span> : [주어 + be + like + 명사(보어)] : \"퍼즐\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"It's, 그것은. like, 마치 같다는 뜻. a puzzle, 퍼즐. 이 문장 전체를 해석하면, 그것은 마치 퍼즐과 같다.","hl":"m"},{"n":37,"text":"이 문장은 피카소의 작품을 보는 과정이 퍼즐을 푸는 것과 비슷하다고 비유해요. 앞에서 계속 보면 연주자들이 보인다고 했으니, 처음엔 헷갈려도 조각을 맞추듯 이해하게 된다는 비유예요. like는 좋아하다가 아니라 와 같은이라는 뜻의 전치사로 쓰였어요.","hl":"mn"},{"n":38,"text":"첫 번째로 It's는 It is의 축약형이에요. 두 번째로 like는 동사가 아니라 와 같은이라는 뜻의 전치사로 쓰였죠. 세 번째로 a puzzle은 주어 It의 상태를 설명하는 보어예요. 그래서 그것은 마치 퍼즐과 같다로 해석해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 15\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">피카소의 작품은\u003c/span>\u003cspan class=\"en\">Picasso's work\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보여 준다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">shows\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">특별한 그림의 방식을\u003c/span>\u003cspan class=\"en\">a special way \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">painting\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">피카소의 작품은 특별한 그림의 방식을 보여 준다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 피카소의 작품이 어떤 점에서 특별한지 제시하는 \u003cb class=\"key\">주제문\u003c/b> 역할을 해요. 'a special way of painting'은 그림을 그리는 특별한 \u003cb class=\"key\">방식\u003c/b>을 뜻하며, 뒤 문장에서 피카소가 실제와 다르게 표현했음을 설명하는 흐름을 열어 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">단수 주어 현재시제\u003c/span> : [단수 주어 Picasso's work] + [동사 shows] : \"보여 준다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 of + 동명사\u003c/span> : [명사 a special way] + [of + 동명사 painting] : \"그림의\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"Picasso's work, 피카소의 작품은. shows, 보여 준다. a special way of painting, 특별한 그림의 방식을. 이 문장 전체를 해석하면, 피카소의 작품은 특별한 그림의 방식을 보여 준다.","hl":"m"},{"n":40,"text":"이 문장은 피카소의 작품이 어떤 점에서 특별한지 말해 주는 주제문 역할을 해요. a special way of painting은 그림을 그리는 특별한 방식이라는 뜻이고, 피카소가 실제와 다른 독특한 표현을 사용했음을 암시해요.","hl":"mn"},{"n":41,"text":"첫 번째로 shows는 주어 Picasso's work가 단수라서 동사에 s가 붙은 현재형이에요. 두 번째로 of painting에서 painting은 동명사로 그림 그리기를 뜻하고, 전치사 of가 이끄는 구가 a special way를 뒤에서 수식해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 15\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 작품은\u003c/span>\u003cspan class=\"en\">His work\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사용했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">used\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">형태, 사물, 그리고 색깔을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">shapes, \u003c/span>\u003cspan class=\"tgt\">objects, \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">colors\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">실제 세상과 매우 다르게\u003c/span>\u003cspan class=\"en\">so differently from the real world.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그의 작품은 형태, 사물, 그리고 색깔을 실제 세상과 매우 다르게 사용했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 피카소가 형태, 사물, 색깔을 실제 세상과 아주 다르게 사용했음을 구체적으로 보여 줘요. 'so differently from the real world'가 \u003cb class=\"key\">실제와의 \u003c/b>\u003cb class=\"key\">차이\u003c/b>를 강조하며, 앞 문장의 특별한 그림 방식을 뒷받침하는 \u003cb class=\"key\">예시\u003c/b>가 돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거시제\u003c/span> : [주어 His work] + [동사 used] : \"사용했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">병렬 구조\u003c/span> : [명사 A shapes], [명사 B objects], and [명사 C colors] : \"형태, 사물, 그리고 색깔\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"His work, 그의 작품은. used, 사용했다. shapes, objects, and colors, 형태, 사물, 그리고 색깔을. so differently from the real world, 실제 세상과 매우 다르게. 이 문장 전체를 해석하면, 그의 작품은 형태, 사물, 그리고 색깔을 실제 세상과 매우 다르게 사용했다.","hl":"m"},{"n":43,"text":"이 문장은 피카소가 형태와 사물과 색깔을 실제 세상과 아주 다르게 사용했음을 구체적으로 설명해요. so differently from the real world가 실제와의 차이를 강조하고, 앞 문장의 특별한 그림 방식을 뒷받침하는 예시가 돼요.","hl":"mn"},{"n":44,"text":"첫 번째로 used는 과거에 일어난 일을 나타내는 과거형 동사예요. 두 번째로 shapes, objects, and colors는 세 명사를 and로 묶은 병렬 구조예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 그림들은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">His \u003c/span>\u003cspan class=\"tgt\">paintings \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매우 독특해 보인다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">look \u003c/span>\u003cspan class=\"tgt\">very \u003c/span>\u003cspan class=\"tgt\">unique\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그의 그림들은 매우 독특해 보인다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 피카소 그림의 겉모습이 얼마나 \u003cb class=\"key\">독특한지\u003c/b> 요약해요. look 뒤에 very unique가 와서 '매우 독특해 보인다'라는 \u003cb class=\"key\">감각동사\u003c/b> 구조를 이루며, 실제와 다른 표현 때문에 그림이 독특해 보인다는 흐름을 마무리해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주어-동사 수 일치\u003c/span> : [복수 주어 His paintings] + [복수 동사 look] : \"그의 그림들은 보인다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">감각동사 look + 형용사\u003c/span> : [주어] + [감각동사 look] + [형용사 very unique] : \"매우 독특해 보인다\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"His paintings, 그의 그림들은. look very unique, 매우 독특해 보인다.. 이 문장 전체를 해석하면, 그의 그림들은 매우 독특해 보인다.","hl":"m"},{"n":46,"text":"이 문장은 피카소 그림의 겉모습이 얼마나 독특한지 요약해요. look 뒤에 very unique가 와서 매우 독특해 보인다는 감각동사 구조를 이뤄요. 앞에서 설명한 실제와 다른 표현 때문에 그림이 독특해 보인다는 흐름을 마무리해요.","hl":"mn"},{"n":47,"text":"첫 번째로 His paintings는 복수 주어라서 동사 look도 복수형으로 쓰인 수 일치를 보여 줘요. 두 번째로 look은 감각동사라서 뒤에 형용사 very unique가 주격보어로 와요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 15\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 작품을 이해하기 위해서는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">To \u003c/span>\u003cspan class=\"tgt\">understand \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">work\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은 사물을 보아야 한다\u003c/span>\u003cspan class=\"en\">you \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">should \u003c/span>\u003cspan class=\"tgt\">view\u003c/span> things\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">완전히 다르게\u003c/span>\u003cspan class=\"en\">completely differently.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">작품을 이해하기 위해서 여러분은 사물을 완전히 다르게 보아야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 피카소의 작품을 이해하는 방법을 제시해요. 작품 속 사물을 현실과 똑같이 보려 하지 말고 \u003cb class=\"key\">완전히 \u003c/b>\u003cb class=\"key\">다르게\u003c/b> 보라는 뜻이죠. 이는 뒤에 나오는 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">기쁨\u003c/b>으로 이어지는 중요한 안내예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : To + 동사원형 + 목적어, 주어 + should + 동사원형 : \"그 작품을 이해하기 위해서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 should(당위)\u003c/span> : 주어 + should + 동사원형 : \"보아야 한다\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"To understand the work, 그 작품을 이해하기 위해서는. you should view things, 여러분은 사물을 보아야 한다. completely differently, 완전히 다르게. 이 문장 전체를 해석하면, 작품을 이해하기 위해서 여러분은 사물을 완전히 다르게 보아야 한다.","hl":"m"},{"n":49,"text":"이 문장은 피카소의 작품을 어떻게 이해해야 하는지 알려 줘요. 작품 속 사물을 현실과 똑같이 보려 하지 말고 완전히 다르게 보라는 뜻이죠. 그래야 뒤에 나오는 새로운 기쁨으로 이어질 수 있어요.","hl":"mn"},{"n":50,"text":"첫 번째로 To understand는 목적을 나타내는 to부정사의 부사적 용법이에요. 그 작품을 이해하기 위해서라는 뜻으로 뒤의 행동 이유를 제시하죠. 두 번째로 should는 당위를 나타내는 조동사예요. 그래서 사물을 보아야 한다처럼 해야 할 행동을 말해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은 될 수 있다\u003c/span>\u003cspan class=\"en\">This \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">be\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">완전히 새로운 기쁨\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">whole \u003c/span>\u003cspan class=\"tgt\">new \u003c/span>\u003cspan class=\"tgt\">joy\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것은 완전히 새로운 기쁨이 될 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞의 새로운 관점이 주는 결과를 말해요. 다르게 보는 것이 단순한 이해를 넘어 \u003cb class=\"key\">완전히 \u003c/b>\u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">기쁨\u003c/b>이 될 수 있다는 뜻이죠. 다음 문장의 \u003cb class=\"key\">세상을 \u003c/b>\u003cb class=\"key\">다르게 \u003c/b>\u003cb class=\"key\">보는 \u003c/b>\u003cb class=\"key\">기쁨\u003c/b>으로 자연스럽게 이어져요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 can(가능성)\u003c/span> : 주어 + can + 동사원형 : \"~이 될 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">형용사의 명사 수식\u003c/span> : 한정사 + 형용사 + 형용사 + 명사 : \"완전히 새로운 기쁨\"\u003c/div>\u003c/div>","segs":[{"n":51,"text":"This can be, 이것은 될 수 있다. a whole new joy, 완전히 새로운 기쁨. 이 문장 전체를 해석하면, 이것은 완전히 새로운 기쁨이 될 수 있다.","hl":"m"},{"n":52,"text":"이 문장은 앞에서 말한 새로운 관점이 어떤 결과를 주는지 말해요. 다르게 보는 것이 단순한 이해를 넘어 완전히 새로운 기쁨이 될 수 있다는 뜻이죠. 그래서 다음 문장의 세상을 다르게 보는 기쁨으로 자연스럽게 이어져요.","hl":"mn"},{"n":53,"text":"첫 번째로 can be는 가능성을 나타내는 조동사 can에 동사원형 be가 온 형태예요. 그래서 기쁨이 될 수 있다처럼 앞의 내용이 어떤 결과로 이어질 가능성을 말하죠. 두 번째로 a whole new joy에서는 whole과 new가 명사 joy를 앞에서 꾸며 주는 명사 수식 구조예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 15 / 15\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 이다\u003c/span>\u003cspan class=\"en\">It is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 기쁨\u003c/span>\u003cspan class=\"en\">the joy\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세상을 보는 것의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">viewing\u003c/span> the world\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다르게\u003c/span>\u003cspan class=\"en\">differently.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 세상을 다르게 보는 기쁨이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글의 결론으로, 앞에서 말한 새로운 기쁨의 정체를 밝혀요. 그 기쁨은 바로 \u003cb class=\"key\">세상을 \u003c/b>\u003cb class=\"key\">다르게 \u003c/b>\u003cb class=\"key\">보는 \u003c/b>\u003cb class=\"key\">기쁨\u003c/b>이라는 뜻이죠. 피카소처럼 \u003cb class=\"key\">다른 \u003c/b>\u003cb class=\"key\">관점\u003c/b>으로 세상을 바라볼 때 얻는 즐거움을 강조하며 글을 마무리해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 of + 동명사\u003c/span> : 전치사 + 동명사(-ing) : \"~하는 것의\"\u003c/div>\u003c/div>","segs":[{"n":54,"text":"It is, 그것은 이다. the joy, 그 기쁨. of viewing the world, 세상을 보는 것의. differently, 다르게. 이 문장 전체를 해석하면, 그것은 세상을 다르게 보는 기쁨이다.","hl":"m"},{"n":55,"text":"이 문장은 글의 결론으로 앞에서 말한 새로운 기쁨의 정체를 밝혀요. 그 기쁨은 바로 세상을 다르게 보는 기쁨이라는 뜻이죠. 피카소처럼 다른 관점으로 세상을 바라볼 때 얻는 즐거움을 강조하며 글을 마무리해요.","hl":"mn"},{"n":56,"text":"여기서 of viewing은 전치사 of 뒤에 동명사 viewing이 온 구조예요. 전치사 뒤에서는 동사원형이 아니라 동명사를 써서 세상을 보는 것이라는 뜻을 만들어요. 그래서 the joy of viewing은 세상을 보는 기쁨으로 해석하죠.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>때때로 \u003cb class=\"key\">다른 \u003c/b>\u003cb class=\"key\">관점\u003c/b>은 우리에게 즐거움을 준다.\u003c/li>\u003cli>Picasso는 Three Musicians에서 사람 대신 \u003cb class=\"key\">추상적인 \u003c/b>\u003cb class=\"key\">형태\u003c/b>를 사용했다.\u003c/li>\u003cli>처음에는 \u003cb class=\"key\">퍼즐\u003c/b>처럼 보여도 계속 보면 연주자들이 보인다.\u003c/li>\u003cli>결국 세상을 \u003cb class=\"key\">다르게 \u003c/b>\u003cb class=\"key\">보기\u003c/b>는 새로운 기쁨을 준다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Viewing things differently can help us understand art and bring us new joy.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">때때로 \u003cb class=\"key\">다른 \u003c/b>\u003cb class=\"key\">관점\u003c/b>은 우리를 즐겁게 한다. Picasso는 Three Musicians에서 \u003cb class=\"key\">추상적인 \u003c/b>\u003cb class=\"key\">형태\u003c/b>로 연주자들을 표현해, 계속 보면 작품을 이해하고 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">기쁨\u003c/b>을 느끼게 한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":57,"text":"오늘 글은 다른 관점이 우리를 즐겁게 한다는 데서 출발했어요. Picasso는 Three Musicians에서 추상적인 형태를 사용해 처음에는 퍼즐처럼 보이게 했죠. 하지만 계속 보면 연주자들이 보이고, 결국 다르게 보기가 새로운 기쁨을 준다는 점을 기억하면 돼요. 오늘도 세상을 조금 다르게 바라보는 연습을 하며 마무리할게요, 수고했어요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
