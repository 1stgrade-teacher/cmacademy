피카소의 독창적인 표현 방식은 사물을 완전히 다르게 바라보는 새로운 즐거움을 선사한다.</li><li>현실 세계와 다른 형태, 색상(colors)의 활용</li><li>고정관념을 깬 독특한(unique) 예술 세계</li><li>세상을 다르게 보는 즐거움(joy of viewing)</li><li>핵심 키워드: 통찰(insight)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">please</td><td class=\"m\">기쁘게 하다, 만족시키다</td></tr><tr><td class=\"w\">abstract</td><td class=\"m\">추상적인, 관념적인</td></tr><tr><td class=\"w\">notice</td><td class=\"m\">알아차리다, 인지하다</td></tr><tr><td class=\"w\">make sense</td><td class=\"m\">이해가 되다, 타당하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">keep looking at</td><td class=\"m\">계속 바라보다, 지켜보다</td></tr><tr><td class=\"w\">unique</td><td class=\"m\">독특한, 유일무이한</td></tr><tr><td class=\"w\">view</td><td class=\"m\">여기다, 바라보다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">때때로</span><span class=\"en\"><b>Sometimes</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 관점이</span><span class=\"en\"><b>a different view</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리를 즐겁게 한다</span><span class=\"en\"><b><span class=\"grammar-hl\">pleases</span> us.</b></span></div></div><div class=\"lec-sent-ko\">때때로 다른 관점은 우리를 즐겁게 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글 전체의 주제를 제시하는 문장입니다. 사물을 기존과 다른 시각으로 바라보는 행위가 단순한 정보 전달을 넘어 심리적인 만족감을 줄 수 있음을 시사하며, 뒤이어 나올 피카소의 사례를 이끌어내는 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">pleases 5형식(SVOC) 구조와 관련하여, pleasing은 &#39;pleasing to us&#39;와 같이 쓰일 수 있으나 여기서는 주어(a different view)가 목적어(us)를 기쁘게 하는 능동적 동작을 나타내는 단순 3형식 구조로 쓰였습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">please</td><td class=\"m\">기쁘게 하다, 만족시키다</td></tr><tr><td class=\"w\">view</td><td class=\"m\">여기다, 바라보다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">예를 들어,</span><span class=\"en\"><b>For example,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">유명한 예술가인 파블로 피카소는</span><span class=\"en\"><b>Pablo Picasso, <span class=\"grammar-hl\">a famous artist</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">세상을 보려고 노력했다</span><span class=\"en\"><b>tried <span class=\"grammar-hl\">to see</span> the world</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다르게</span><span class=\"en\"><b>differently.</b></span></div></div><div class=\"lec-sent-ko\">예를 들어, 유명한 예술가인 파블로 피카소는 세상을 다르게 보려고 노력했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 일반적인 진술을 피카소라는 구체적인 인물을 통해 예증합니다. 그의 예술적 시도가 단순히 독특함을 추구하는 것이 아니라, 세상을 보는 방식을 전환하려는 의도적인 노력이었음을 밝히고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">a famous artist (동격): 콤마를 사용하여 앞의 명사(Pablo Picasso)와 뒤의 명사구(a famous artist)가 동일인물임을 보충 설명하는 구조입니다.</div><div class=\"lec-gr-item\">to see (to부정사): try의 목적어 역할을 하며 &#39;~하는 것을 시도하다&#39;라는 의미로 명사적 용법으로 쓰였습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그의 유명한 작품 &#39;세 명의 악사들&#39;에서,</span><span class=\"en\"><b>In his famous work <span class=\"grammar-hl\">Three Musicians</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는 세 명의 연주자들을 그렸다</span><span class=\"en\"><b>he painted three music players.</b></span></div></div><div class=\"lec-sent-ko\">그의 유명한 작품 ‘세 명의 악사들’에서, 그는 세 명의 연주자들을 그렸다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 피카소의 구체적인 작품을 언급하며, 작가가 다루고자 하는 예술적 대상을 소개합니다. 이후 문장에서 나타날 추상적 표현과 대비되는 &#39;인물&#39;이라는 객관적 실체를 먼저 명시하여 관객의 이해를 돕습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Three Musicians (동격): 앞의 명사(his famous work)와 뒤의 고유명사(Three Musicians)가 동일한 대상임을 나타내며 구체화하는 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만</span><span class=\"en\"><b>But</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는 그리지 않았다</span><span class=\"en\"><b>he <span class=\"grammar-hl\">did not draw</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">세 사람을</span><span class=\"en\"><b>three people.</b></span></div></div><div class=\"lec-sent-ko\">하지만 그는 세 사람을 그리지 않았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 음악가라는 대상을 그렸음에도, 우리가 흔히 생각하는 사실적인 인물 묘사 방식과는 다르다는 점을 강조하여 독자의 주의를 환기합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">did not draw (대동사(do)): 앞 문장의 행위를 대신하거나 부정하는 구조에서 일반동사의 부정문을 만들 때 사용하는 조동사입니다. 앞의 동사가 일반동사이면 do[does, did]를 씁니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">대신에,</span><span class=\"en\"><b>Instead,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는 사용했다</span><span class=\"en\"><b>he <span class=\"grammar-hl\">used</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">추상적인 형태를</span><span class=\"en\"><b>abstract shapes.</b></span></div></div><div class=\"lec-sent-ko\">대신, 그는 추상적인 형태를 사용하였다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 부정적 서술을 이어받아, 피카소가 선택한 대안적인 기법을 설명합니다. 구체적인 형상 대신 도형이라는 도구를 통해 대상을 재구성했다는 점을 드러냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">used 5형식 구조의 확장: 여기서는 주어-동사-목적어의 3형식 구조로 쓰였으나, Picasso가 대상을 특정 방식(abstract shapes)으로 변형하여 표현하는 맥락을 형성합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">abstract</td><td class=\"m\">추상적인, 관념적인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여러분이 처음 이 작품을 볼 때,</span><span class=\"en\"><b><span class=\"grammar-hl\">When you first see this work</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분은 알아차리지 못할 수도 있다</span><span class=\"en\"><b>you may not notice</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">연주자들을</span><span class=\"en\"><b>the players.</b></span></div></div><div class=\"lec-sent-ko\">여러분이 이 작품을 처음 볼 때는 그 연주자들을 알아차리지 못할 수도 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자의 일반적인 반응을 가정합니다. 사실적 묘사가 없는 예술 작품을 처음 접할 때 느끼는 당혹감이나 낯설음을 묘사함으로써, 뒤따르는 &#39;깨달음의 과정&#39;을 더욱 극적으로 만들기 위한 밑작업입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">When you first see this work 분사구문(의미상 접속사 절): &#39;when + you + see&#39;의 구조로, 시간을 나타내는 부사절로 문장의 배경을 설명합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">notice</td><td class=\"m\">알아차리다, 인지하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">아무것도</span><span class=\"en\"><b>Nothing</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이해되지 않는다</span><span class=\"en\"><b><span class=\"grammar-hl\">makes sense</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분에게</span><span class=\"en\"><b>to you.</b></span></div></div><div class=\"lec-sent-ko\">아무것도 이해되지 않을 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이전 문장에서 언급한 &#39;알아차리지 못함&#39;을 더욱 강하게 표현한 것입니다. 익숙한 사물의 형태가 보이지 않을 때 관객이 느끼는 혼란을 직설적으로 전달하여, 이 작품이 일반적인 감상 방식을 거부한다는 점을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">makes sense (관용표현): &#39;이치에 맞다/이해가 되다&#39;라는 뜻의 숙어로, 주어(Nothing)의 상태나 결과를 설명하는 표현입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만</span><span class=\"en\"><b>But</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분이 계속해서 그 그림을 볼 때,</span><span class=\"en\"><b><span class=\"grammar-hl\">when you keep looking at the painting</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분은 그들을 볼 수 있다</span><span class=\"en\"><b>you can see them</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 안에서</span><span class=\"en\"><b>in it!</b></span></div></div><div class=\"lec-sent-ko\">하지만 계속해서 그 그림을 보면, 여러분은 그 그림 속에서 그들을 볼 수 있다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자의 혼란이 점진적인 관찰을 통해 어떻게 해결될 수 있는지 보여줍니다. 대상을 즉각적으로 인지하는 대신, 시간을 들여 관찰함으로써 비로소 피카소가 의도한 형태를 발견하는 능동적인 감상 과정을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">when you keep looking at the painting 분사구문(의미상 접속사 절): &#39;when + you + keep looking&#39;의 구조로, 조건 혹은 시간적 상황을 설정하는 부사절입니다.</div><div class=\"lec-gr-item\">keep looking (현재분사): &#39;keep + -ing&#39; 구조에서 look에 -ing가 붙어 &#39;지속적으로 ~하는 상태&#39;를 유지함을 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">keep looking at</td><td class=\"m\">계속 바라보다, 지켜보다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 ~와 같다</span><span class=\"en\"><b><span class=\"grammar-hl\">It’s like</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">퍼즐</span><span class=\"en\"><b><span class=\"grammar-hl\">a puzzle.</span></b></span></div></div><div class=\"lec-sent-ko\">그것은 마치 퍼즐과 같다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 예술 작품 감상을 능동적인 문제 해결 과정으로 비유합니다. 단순한 관람에서 벗어나 그림 속에 숨겨진 조각들을 맞추듯 대상을 찾아내는 것이 피카소 작품 감상의 묘미라는 점을 명확히 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It’s like a puzzle. (관용표현): &#39;be like&#39;는 &#39;~와 같다&#39;라는 의미로 사물의 성질을 비유할 때 사용하는 전치사구 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">피카소의 작품은</span><span class=\"en\"><b>Picasso’s work</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">보여준다</span><span class=\"en\"><b>shows</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">특별한 그림의 방식을</span><span class=\"en\"><b><span class=\"grammar-hl\">a special way of painting</span>.</b></span></div></div><div class=\"lec-sent-ko\">피카소의 작품은 특별한 그림의 방식을 보여 준다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 퍼즐 비유를 바탕으로, 피카소만의 예술적 기법이 가지는 독창성을 일반화하여 요약합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">a special way of painting (동명사): 전치사 of 뒤에 쓰인 painting은 &#39;~하는 행위/활동&#39;이라는 명사적 개념으로 사용되었습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 11 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그의 작품은</span><span class=\"en\"><b>His work</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">형태, 사물, 그리고 색깔을 사용했다</span><span class=\"en\"><b>used shapes, objects, and colors</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매우 다르게</span><span class=\"en\"><b><span class=\"grammar-hl\">so differently</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">실제 세상과는</span><span class=\"en\"><b><span class=\"grammar-hl\">from the real world</span>.</b></span></div></div><div class=\"lec-sent-ko\">그의 작품은 형태, 사물, 그리고 색깔을 실제 세상과 매우 다르게 사용했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 피카소의 &#39;특별한 방식&#39;이 구체적으로 무엇인지 정의합니다. 현실의 모사(재현)를 거부하고, 작가 본인의 시각으로 재구성한 조형 요소를 사용했음을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">so differently from the real world (관용표현): &#39;differently from&#39;은 비교 대상을 나타내는 숙어적 표현으로, 두 대상의 차이를 나타낼 때 사용합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 12 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그의 그림들은</span><span class=\"en\"><b><span class=\"grammar-hl\">His paintings</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">보인다</span><span class=\"en\"><b><span class=\"grammar-hl\">look</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매우 독특하게</span><span class=\"en\"><b><span class=\"grammar-hl\">very unique.</span></b></span></div></div><div class=\"lec-sent-ko\">그의 그림들은 매우 독특해 보인다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 위에서 설명한 기법적 특징들로 인해 나타난 최종적인 시각적 결과물에 대해 평가합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">His paintings look very unique. 5형식(SVOC) 구조의 변형: look은 2형식 동사로 쓰여 뒤에 주격보어(unique)를 취해 주어의 상태를 설명합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">unique</td><td class=\"m\">독특한, 유일무이한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 13 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 작품을 이해하기 위해서,</span><span class=\"en\"><b><span class=\"grammar-hl\">To understand</span> the work,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분은 사물을 보아야 한다</span><span class=\"en\"><b>you should view things</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">완전히 다르게</span><span class=\"en\"><b>completely differently.</b></span></div></div><div class=\"lec-sent-ko\">작품을 이해하기 위해서 여러분은 사물을 완전히 다르게 보아야 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글 전체를 관통하는 핵심 교훈을 제시합니다. 피카소의 예술을 이해하는 것은 곧 세상을 바라보는 고정관념을 버리고 새로운 시각을 갖추는 연습과 같음을 역설합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">To understand (to부정사): 문장 전체를 수식하는 부사적 용법으로 &#39;~하기 위해서&#39;라는 목적을 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">view</td><td class=\"m\">여기다, 바라보다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 14 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것은</span><span class=\"en\"><b>This</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">될 수 있다</span><span class=\"en\"><b>can be</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">완전히 새로운 기쁨이</span><span class=\"en\"><b><span class=\"grammar-hl\">a whole new joy</span>.</b></span></div></div><div class=\"lec-sent-ko\">이것은 완전히 새로운 기쁨이 될 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 새로운 시각을 갖게 되었을 때 얻는 긍정적인 감정적 보상을 설명합니다. 고정관념에서 벗어나는 과정 자체가 하나의 지적 유희가 될 수 있음을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">a whole new joy (관용표현): &#39;a whole new&#39;는 &#39;완전히 새로운&#39;이라는 강조의 의미로 사용되는 관용구입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 15 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 ~이다</span><span class=\"en\"><b><span class=\"grammar-hl\">It is</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">기쁨</span><span class=\"en\"><b><span class=\"grammar-hl\">the joy</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">세상을 다르게 보는</span><span class=\"en\"><b><span class=\"grammar-hl\">of viewing</span> the world differently.</b></span></div></div><div class=\"lec-sent-ko\">그것은 세상을 다르게 보는 기쁨이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 결론입니다. 피카소의 예술 작품을 통한 경험이 결국 세상을 확장해서 바라보는 태도로 연결되며, 이것이 인간이 누릴 수 있는 깊은 기쁨임을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It is the joy of viewing (가주어): 진주어: &#39;It&#39;은 형식적인 주어이며, 뒤의 &#39;viewing~&#39;은 이 문장의 핵심 내용을 담고 있지는 않으나, 구조상 &#39;the joy&#39;를 설명하는 보어 자리입니다.</div><div class=\"lec-gr-item\">viewing (동명사): 전치사 of의 목적어로 쓰여 &#39;보는 행위/활동&#39;이라는 명사적 의미를 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">view</td><td class=\"m\">여기다, 바라보다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>일반적인 사물 인식 방식은 익숙하지만 때로는 색다른 관점이 필요하다.</li><li>피카소는 &#39;세 명의 악사&#39;를 통해 사물을 사실적으로 묘사하지 않고 추상적인 도형으로 재구성했다.</li><li>처음에는 이해되지 않던 작품 속 형상을 지속적인 관찰을 통해 찾아내는 과정은 마치 퍼즐을 푸는 것과 같다.</li><li>피카소처럼 세상을 다르게 보는 방식은 예술적 이해를 넘어 새로운 즐거움을 제공한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Picasso used abstract shapes to challenge traditional perceptions, and viewing his work offers the unique joy of seeing the world differently.</div>\n              <div class=\"lec-final-sum-ko\">피카소는 전통적인 인식을 깨기 위해 추상적인 형태를 사용했으며, 그의 작품을 감상하는 것은 세상을 다르게 보는 독특한 즐거움을 선사한다.</div></div></div>"],"segs":[[{"audio":"./reading03_audio/1.mp3","hl":null}],[{"audio":"./reading03_audio/2.mp3","hl":null}],[{"audio":"./reading03_audio/3.mp3","hl":null},{"audio":"./reading03_audio/4.mp3","hl":"stage-0"},{"audio":"./reading03_audio/5.mp3","hl":"stage-1"},{"audio":"./reading03_audio/6.mp3","hl":"stage-2"},{"audio":"./reading03_audio/7.mp3","hl":"stage-3"}],[{"audio":"./reading03_audio/8.mp3","hl":null}],[{"audio":"./reading03_audio/9.mp3","hl":"main"},{"audio":"./reading03_audio/10.mp3","hl":"meaning"},{"audio":"./reading03_audio/11.mp3","hl":"grammar"}],[{"audio":"./reading03_audio/12.mp3","hl":"main"},{"audio":"./reading03_audio/13.mp3","hl":"meaning"},{"audio":"./reading03_audio/14.mp3","hl":"grammar"}],[{"audio":"./reading03_audio/15.mp3","hl":"main"},{"audio":"./reading03_audio/16.mp3","hl":"meaning"},{"audio":"./reading03_audio/17.mp3","hl":"grammar"}],[{"audio":"./reading03_audio/18.mp3","hl":"main"},{"audio":"./reading03_audio/19.mp3","hl":"meaning"},{"audio":"./reading03_audio/20.mp3","hl":"grammar"}],[{"audio":"./reading03_audio/21.mp3","hl":"main"},{"audio":"./reading03_audio/22.mp3","hl":"meaning"},{"audio":"./reading03_audio/23.mp3","hl":"grammar"}],[{"audi
