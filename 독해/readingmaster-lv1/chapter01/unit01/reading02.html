 class=\"lec-cover-title\">Exploring the Wonders and Activities of Iguazú National Park<small>이구아수 국립공원의 경이로움과 즐길 거리 탐험</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">이과수 국립공원을 방문하기 전에 먼저 알아두면 좋을 개념은 바로 세계자연유산(World Heritage Site)과 열대우림(Rainforest) 생태계예요. 유네스코가 지정한 세계자연유산인 이곳은 수많은 폭포가 빚어내는 장관뿐만 아니라, 생물다양성(Biodiversity)이 매우 풍부하여 희귀한 야생 동식물이 서식하는 중요한 보금자리랍니다. 마치 거대한 빗줄기가 쏟아지는 듯한 &#39;악마의 목구멍&#39;처럼, 거대한 폭포는 낙차(Drop)와 엄청난 수량으로 인해 주변에 항상 안개와 습기를 만들어내며 독특한 기후를 형성해요. 따라서 이곳을 탐험할 때는 기상 조건(Weather conditions)을 미리 확인하고, 갑작스러운 물보라에 대비해 준비물(Essentials)을 잘 챙기는 것이 여행을 제대로 즐기는 핵심 팁이랍니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01공원 개요</div><ul><li>아르헨티나는 세계적인 규모의 이구아수 국립공원을 보유하고 있다.</li><li>세계적인 국립공원 (National Park)</li><li>아르헨티나(Argentina)에 위치함</li><li>핵심 키워드: 국립공원(National Park)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02폭포 탐방</div><ul><li>세계 최대 규모인 이구아수 폭포의 장관을 다양한 방법으로 즐길 수 있다.</li><li>약 275개의 폭포로 구성된 세계 최대 폭포 (Waterfalls)</li><li>가장 높은 지점인 &#39;악마의 목구멍&#39; (Devil’s Throat)</li><li>보트, 헬리콥터, 도보 등 다양한 체험 수단</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03야생동물 관찰</div><ul><li>공원 내에서 다양한 종류의 야생 동물들을 직접 만날 수 있다.</li><li>재규어(Jaguars), 물고기(Fish), 거북이(Turtles), 원숭이(Monkeys) 서식</li><li>다채로운 생태계 경험</li><li>핵심 키워드: 야생 동물(Wild animals)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04하이킹 및 주의사항</div><ul><li>공원 곳곳을 누비는 하이킹 활동 시 옷차림에 유의해야 한다.</li><li>열대우림과 폭포 주변 하이킹 가능</li><li>폭포 꼭대기까지 이어지는 탐방로</li><li>젖을 수 있으므로 우비(Raincoat) 지참 필수</li><li>핵심 키워드: 하이킹(Hiking)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">experience</td><td class=\"m\">경험하다, 겪다</td></tr><tr><td class=\"w\">such as</td><td class=\"m\">~와 같은, 예를 들어</td></tr><tr><td class=\"w\">raincoat</td><td class=\"m\">비옷, 우의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이구아수 국립공원은</span><span class=\"en\"><b><span class=\"grammar-hl\">Iguazú National Park</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매우 큰 국립공원이다</span><span class=\"en\"><b><span class=\"grammar-hl\">is a very big national park</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아르헨티나에서</span><span class=\"en\"><b><span class=\"grammar-hl\">in Argentina.</span></b></span></div></div><div class=\"lec-sent-ko\">이구아수 국립공원은 아르헨티나에서 매우 큰 국립공원이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 도입부로서, 여행지인 이과수 국립공원의 위치와 규모를 소개하며 앞으로 펼쳐질 관광 정보의 배경을 설정합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Iguazú National Park is a very big national park in Argentina. 2형식 구조: S(Iguazú National Park) + V(is) + C(a very big national park)의 기본 문장 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신은 즐길 수 있다</span><span class=\"en\"><b>You can <span class=\"grammar-hl\">enjoy</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 종류의 활동들을</span><span class=\"en\"><b><span class=\"grammar-hl\">many types of activities</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그곳에서</span><span class=\"en\"><b>there.</b></span></div></div><div class=\"lec-sent-ko\">그곳에서 다양한 종류의 활동을 즐길 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 장소의 특징을 이어받아, 방문객이 공원에서 누릴 수 있는 체험의 다양성을 강조하며 전체 글의 주제를 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">enjoy many types of activities 3형식 구조: S(You) + V(enjoy) + O(many types of activities)로 구성된 문장입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">먼저,</span><span class=\"en\"><b>First,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신은 볼 수 있다</span><span class=\"en\"><b>you <span class=\"grammar-hl\">can see</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이구아수 폭포를</span><span class=\"en\"><b><span class=\"grammar-hl\">the Iguazú Falls</span>.</b></span></div></div><div class=\"lec-sent-ko\">먼저, 여러분은 이구아수 폭포를 볼 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 구체적인 활동 사례를 나열하는 첫 번째 순서로, 공원의 가장 핵심적인 명소인 폭포를 소개합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">can see the Iguazú Falls 3형식 구조: S(you) + V(can see) + O(the Iguazú Falls)의 기본 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것들은 세계 최대의 폭포이다</span><span class=\"en\"><b>They’re the <span class=\"grammar-hl\">world’s biggest waterfalls</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">약 275개의 다양한 폭포를 가진</span><span class=\"en\"><b>with about 275 different waterfalls.</b></span></div></div><div class=\"lec-sent-ko\">그것은 약 275개의 다양한 폭포로 이루어진 세계 최대의 폭포이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 소개한 폭포의 규모를 수치로 상세히 설명하여, 왜 이곳이 중요한 관광지인지 방문객에게 설득력을 더합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">world’s biggest waterfalls (최상급): 형용사 big의 최상급인 biggest를 사용하여 여러 폭포 중 가장 큰 규모임을 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신은 경험할 수 있다</span><span class=\"en\"><b>You can experience</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가장 높은 지점인 &#39;악마의 목구멍&#39;을</span><span class=\"en\"><b>the highest point, the Devil’s Throat,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">보트 투어나 헬리콥터 타기</span><span class=\"en\"><b><span class=\"grammar-hl\">by taking a boat tour</span>, helicopter ride,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">혹은 단지 산책로를 걸음으로써</span><span class=\"en\"><b>or just <span class=\"grammar-hl\">by walking on the trails</span>.</b></span></div></div><div class=\"lec-sent-ko\">가장 높은 지점인 ‘악마의 목구멍’은 보트 투어를 하거나 헬리콥터를 타거나 산책로를 걷는 것만으로 경험할 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 폭포를 감상하는 구체적인 방법을 제시하는데, 이는 앞 문장에서 말한 규모를 실감 나게 체험하기 위한 구체적인 수단들입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">by taking a boat tour (동명사): 전치사 by의 목적어로 taking(타는 것/이용하는 것)이 쓰여 구체적인 방법을 설명합니다.</div><div class=\"lec-gr-item\">by walking on the trails (동명사): 전치사 by의 목적어로 walking(걷는 것)이 쓰여 수단과 방법을 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">experience</td><td class=\"m\">경험하다, 겪다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신은 또한 볼 수 있다</span><span class=\"en\"><b>You <span class=\"grammar-hl\">can also see</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">야생동물들을</span><span class=\"en\"><b><span class=\"grammar-hl\">wild animals</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 공원에서</span><span class=\"en\"><b>in the park.</b></span></div></div><div class=\"lec-sent-ko\">공원에서는 야생동물도 볼 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 설명한 자연 경관 감상에 이어 또 다른 즐길 거리인 생태 체험으로 내용을 전환합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">can also see wild animals 3형식 구조: S(You) + V(can see) + O(wild animals)의 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">있다</span><span class=\"en\"><b><span class=\"grammar-hl\">There are</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 종류의 동물들이</span><span class=\"en\"><b><span class=\"grammar-hl\">many kinds of animals</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">재규어, 물고기, 거북이, 그리고 원숭이와 같은</span><span class=\"en\"><b>such as jaguars, fish, turtles, and monkeys.</b></span></div></div><div class=\"lec-sent-ko\">재규어, 물고기, 거북, 원숭이와 같은 많은 종류의 동물들이 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 야생 동물의 범주를 구체적인 예시를 들어 보충 설명하며 생태적 풍요로움을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">There are many kinds of animals (도치): 유도부사 There로 시작하여 V(are) + S(many kinds of animals) 순서로 주어와 동사가 위치가 바뀐 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">such as</td><td class=\"m\">~와 같은, 예를 들어</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">마지막으로,</span><span class=\"en\"><b>Last,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신은 하이킹을 갈 수 있다</span><span class=\"en\"><b>you can go hiking</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러 곳으로</span><span class=\"en\"><b><span class=\"grammar-hl\">to different places</span>.</b></span></div></div><div class=\"lec-sent-ko\">마지막으로, 여러분은 여러 곳으로 하이킹을 갈 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 공원에서 즐길 수 있는 마지막 활동인 하이킹을 제시하며 나열의 끝을 맺습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to different places (to부정사): 부사적 용법으로 go(가다)라는 동작의 목적지나 방향을 나타내며 문장을 수식합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신은 하이킹할 수 있다</span><span class=\"en\"><b>You <span class=\"grammar-hl\">can hike</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">열대 우림 주변을,</span><span class=\"en\"><b><span class=\"grammar-hl\">around the rainforest</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">폭포 아래를,</span><span class=\"en\"><b>below the falls,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 심지어 폭포 위를</span><span class=\"en\"><b>and even on top of the falls.</b></span></div></div><div class=\"lec-sent-ko\">열대 우림 주변, 폭포 아래, 심지어 폭포 위에서도 하이킹을 할 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 하이킹이라는 활동을 어디서 할 수 있는지 구체적인 장소를 나열하여, 방문객이 기대할 수 있는 경험의 범위를 확장합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">can hike around the rainforest 3형식 구조: S(You) + V(can hike) + 전치사구(around the rainforest)의 기본 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">단지 기억해라</span><span class=\"en\"><b>Just <span class=\"grammar-hl\">remember</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신의 비옷을 가져올 것을,</span><span class=\"en\"><b><span class=\"grammar-hl\">to bring</span> your raincoat,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그렇지 않으면 당신은 젖을지도 모른다</span><span class=\"en\"><b>or you may get wet.</b></span></div></div><div class=\"lec-sent-ko\">비옷을 가져가는 것만 기억해라, 그렇지 않으면 젖을 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞의 즐거운 경험들이 자칫 불편함으로 이어지지 않도록, 실질적인 준비물을 안내하며 여행객을 위한 조언으로 글을 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">remember to bring (to부정사): remember의 목적어로 to부정사가 쓰였으며, 미래에 해야 할 일(가져오는 것)을 기억하라는 의미를 담고 있습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">raincoat</td><td class=\"m\">비옷, 우의</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>아르헨티나의 이과수 국립공원은 규모가 크고 즐길 거리가 다양하다.</li><li>주요 볼거리인 거대한 이과수 폭포는 보트나 헬기, 산책로 등으로 다채롭게 즐길 수 있다.</li><li>공원 내에는 다양한 야생 동물이 서식하고 있어 생태 탐방이 가능하다.</li><li>열대우림과 폭포 일대에서 하이킹을 할 수 있으며, 젖을 수 있으니 비옷 준비가 필요하다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Visitors can enjoy the massive Iguazú Falls and diverse wildlife, and they can also explore the rainforest through various hiking trails.</div>\n              <div class=\"lec-final-sum-ko\">방문객들은 거대한 이구아수 폭포와 다양한 야생 동물을 즐길 수 있으며, 여러 하이킹 코스를 통해 열대 우림을 탐험할 수 있다.</div></div></div>"],"segs":[[{"audio":"./reading02_audio/1.mp3","hl":null}],[{"audio":
