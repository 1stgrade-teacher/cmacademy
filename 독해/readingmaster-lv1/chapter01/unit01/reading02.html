<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터1 Reading 02 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}

.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터1 Reading 02","audioDir":"reading02_audio","preview":false,"count":42,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.668em\">Reading\u003cbr>02\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터1\u003c/div>\u003ch1>Iguazú National Park: Waterfalls, Wildlife, and Hiking\u003c/h1>\u003ch2>이구아수 국립공원: 폭포, 야생동물, 하이킹\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>이구아수 국립공원에서는 \u003cb class=\"key\">이구아수 \u003c/b>\u003cb class=\"key\">폭포\u003c/b> 감상, \u003cb class=\"key\">야생동물\u003c/b> 관찰, \u003cb class=\"key\">하이킹\u003c/b> 등 다양한 활동을 즐길 수 있으며, 폭포 주변에서는 \u003cb class=\"key\">비옷\u003c/b>을 준비해야 한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Iguazú National Park offers visitors diverse activities such as seeing the Iguazú Falls, watching wild animals, and going hiking.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"오늘은 Iguazu National Park, 이구아수 국립공원에 관한 글을 읽어 볼 거예요. 이 글은 이구아수 국립공원에서 즐길 수 있는 세 가지 활동, 즉 이구아수 폭포 감상과 야생동물 관찰, 그리고 하이킹을 소개하고 있죠. 전체 요지는 공원에서 다양한 활동을 즐길 수 있고, 마지막에는 비옷을 준비하라는 당부까지 있다는 거예요. 그럼 글의 흐름을 함께 따라가 볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">이구아수 국립공원은 아르헨티나에 있는 \u003cb class=\"key\">국립공원\u003c/b>으로, 거대한 폭포와 열대우림이 어우러진 곳이에요. 국립공원(national park)은 자연경관과 생태계를 보호하면서 일반인에게 공개하는 보호 구역이라, \u003cb class=\"key\">생태관광\u003c/b>(ecotourism)의 대표 무대가 됩니다. 이구아수 폭포는 여러 개의 폭포가 이어진 거대한 폭포군으로, '악마의 목구멍(Devil's Throat)'처럼 높낮이와 물줄기가 다양한 지점이 있어요. 열대우림(rainforest)은 습도가 높고 생물 다양성이 커서 재규어, 거북, 원숭이 같은 \u003cb class=\"key\">야생동물\u003c/b>이 살아요. 마치 거대한 자연 테마파크에서 물놀이, 동물원, 등산 코스를 한 번에 체험하는 것과 비슷하지만, 실제로는 보호가 우선인 자연 공간이라는 점이 달라요.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식이에요. 이구아수 국립공원은 아르헨티나에 있는 큰 국립공원으로, 거대한 폭포와 열대우림이 함께 있는 곳이에요. 국립공원, national park는 자연경관과 생태계를 보호하면서 사람들에게 공개하는 보호 구역이라서 생태관광의 대표 무대가 되죠. 이구아수 폭포는 여러 폭포가 이어진 거대한 폭포군이고, 악마의 목구멍처럼 높낮이와 물줄기가 다양한 지점이 있어요. 열대우림, rainforest는 습도가 높고 생물 다양성이 커서 재규어, 거북, 원숭이 같은 야생동물이 살아요. 거대한 자연 테마파크에서 물놀이와 동물 관찰과 등산을 한 번에 하는 것과 비슷하지만, 실제로는 보호가 우선인 자연 공간이라는 점을 기억해 주세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>공원 소개\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>아르헨티나의 큰 \u003cb class=\"key\">국립공원\u003c/b>인 이구아수 국립공원에서는 다양한 종류의 \u003cb class=\"key\">활동\u003c/b>을 즐길 수 있다고 전체 내용을 예고해요. 이 문장이 뒤에 이어질 세 가지 체험의 \u003cb class=\"key\">주제문\u003c/b> 역할을 합니다. 먼저 공원의 규모와 위치를 제시한 뒤, 활동의 다양성을 강조하는 흐름이에요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>폭포 체험\u003csmall>예시 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>첫 번째 활동은 \u003cb class=\"key\">이구아수 \u003c/b>\u003cb class=\"key\">폭포\u003c/b>를 보는 것이에요. 약 275개의 다양한 폭포로 이루어진 세계 최대 폭포이며, 가장 높은 지점인 \u003cb class=\"key\">악마의 \u003c/b>\u003cb class=\"key\">목구멍\u003c/b>은 보트 투어, 헬리콥터, 산책로 걷기로 경험할 수 있어요. 구체적인 수치와 체험 방법을 제시해 폭포의 규모와 접근법을 함께 알려 줍니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>동물 관찰\u003csmall>예시 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>두 번째 활동은 공원에서 \u003cb class=\"key\">야생동물\u003c/b>을 보는 것이에요. 재규어, 물고기, 거북, 원숭이처럼 여러 종류의 동물이 산다는 점을 \u003cb class=\"key\">such \u003c/b>\u003cb class=\"key\">as\u003c/b>로 예시해요. 앞의 폭포와 달리 살아 있는 생물을 관찰하는 체험이라는 점이 특징입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>하이킹과 주의\u003csmall>결론 · 문장 8–10\u003c/small>\u003c/h4>\u003cp>마지막 활동은 여러 장소로 \u003cb class=\"key\">하이킹\u003c/b>을 가는 것이에요. 열대 우림 주변, 폭포 아래, 폭포 위에서도 걸을 수 있다고 구체적인 장소를 제시해요. 그리고 \u003cb class=\"key\">비옷\u003c/b>을 가져가라는 당부로 글을 마무리하며, 그렇지 않으면 젖을 수 있다고 \u003cb class=\"key\">주의\u003c/b>를 줍니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 공원 소개에서 시작해 폭포, 야생동물, 하이킹으로 이어지는 세 가지 활동을 차례로 보여 줍니다.","hl":null},{"n":4,"text":"첫 번째 단계는 도입이에요. 첫 번째와 두 번째 문장에서 아르헨티나의 큰 국립공원인 이구아수 국립공원을 소개하고, 그곳에서 다양한 종류의 활동을 즐길 수 있다고 말하죠. 이 두 번째 문장이 뒤에 이어질 세 가지 체험의 주제문 역할을 해요. 그래서 전체 글의 방향을 미리 잡아 주는 단계라고 볼 수 있습니다.","hl":"f0"},{"n":5,"text":"두 번째 단계는 첫 번째 활동인 폭포 체험이에요. 세 번째부터 다섯 번째 문장에서 이구아수 폭포를 소개하고, 약 이백칠십오 개의 다양한 폭포로 이루어진 세계 최대 폭포라고 설명하죠. 가장 높은 지점인 악마의 목구멍은 보트 투어나 헬리콥터, 또는 산책로 걷기로 경험할 수 있다고 해요. 구체적인 수치와 체험 방법을 함께 제시해서 폭포의 규모와 접근법을 분명히 보여 줍니다.","hl":"f1"},{"n":6,"text":"세 번째 단계는 두 번째 활동인 동물 관찰이에요. 여섯 번째와 일곱 번째 문장에서 공원에서 야생동물을 볼 수 있다고 말하고, 재규어, 물고기, 거북, 원숭이 같은 동물을 such as로 예시하죠. 앞에서 본 폭포와 달리 살아 있는 생물을 관찰하는 체험이라는 점이 특징이에요. 그래서 폭포 감상과 구분되는 또 다른 활동으로 이해하면 됩니다.","hl":"f2"},{"n":7,"text":"마지막 단계는 세 번째 활동인 하이킹과 주의예요. 여덟 번째부터 열 번째 문장에서 여러 장소로 하이킹을 갈 수 있다고 말하며, 열대 우림 주변과 폭포 아래, 심지어 폭포 위에서도 걸을 수 있다고 설명하죠. 그리고 비옷을 가져가라는 당부로 글을 마무리하면서, 그렇지 않으면 젖을 수 있다고 주의를 줍니다. 이 마지막 당부가 실제 방문객에게 필요한 실용적인 조언이 되는 거예요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">분류\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 2번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">2번 문장에서 다양한 활동을 즐길 수 있다고 \u003cb class=\"key\">주제\u003c/b>를 먼저 제시한 뒤, First, also, Last로 세 가지 활동을 \u003cb class=\"key\">열거\u003c/b>하는 \u003cb class=\"key\">두괄식\u003c/b> 구조예요. 각 활동은 폭포, 야생동물, 하이킹으로 서로 다른 범주를 이루므로 분류의 방식으로 볼 수 있어요. 마지막에는 비옷을 가져가라는 실용적 주의를 덧붙여 글을 마무리합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>First (3)\u003c/b>\u003cspan>첫 번째 활동 제시\u003c/span>\u003cb>also (6)\u003c/b>\u003cspan>추가 활동 제시\u003c/span>\u003cb>Last (8)\u003c/b>\u003cspan>마지막 활동 제시\u003c/span>\u003cb>Just remember (10)\u003c/b>\u003cspan>당부·주의\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">many types of activities\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">see the Iguazú Falls\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">see wild animals\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">go hiking\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 분류, 그중에서도 열거에 가까워요. 두 번째 문장에서 다양한 활동을 즐길 수 있다는 주제를 먼저 제시한 뒤, First, also, Last로 세 가지 활동을 차례로 열거하죠. 그래서 글의 구조는 주제가 앞에 나오는 두괄식이라고 볼 수 있어요. 각 활동이 폭포, 야생동물, 하이킹이라는 서로 다른 범주를 이룬다는 점도 함께 기억해 주세요.","hl":"ty"},{"n":9,"text":"신호어를 보면 First가 세 번째 문장에서 첫 번째 활동을 열어 주고, also가 여섯 번째 문장에서 두 번째 활동을 더해 주며, Last가 여덟 번째 문장에서 마지막 활동을 알려 줘요. Just remember는 열 번째 문장에서 당부와 주의를 이끌어 내는 신호어입니다. 이 글에서는 같은 개념을 바꿔 말하는 재진술이 많지는 않지만, many types of activities가 뒤의 폭포 감상, 야생동물 관찰, 하이킹으로 구체화된다는 점을 연결해서 읽으면 좋아요. 대조 구도는 거의 없으므로 신호어를 따라 활동을 구분하는 데 집중하면 됩니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>national park\u003c/b>\u003cem>명사\u003c/em>\u003cspan>국립공원\u003c/span>\u003c/div>\u003cdiv>\u003cb>enjoy\u003c/b>\u003cem>동사\u003c/em>\u003cspan>즐기다\u003c/span>\u003c/div>\u003cdiv>\u003cb>type\u003c/b>\u003cem>명사\u003c/em>\u003cspan>종류\u003c/span>\u003c/div>\u003cdiv>\u003cb>activity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>활동\u003c/span>\u003c/div>\u003cdiv>\u003cb>falls\u003c/b>\u003cem>명사\u003c/em>\u003cspan>폭포\u003c/span>\u003c/div>\u003cdiv>\u003cb>world\u003c/b>\u003cem>명사\u003c/em>\u003cspan>세계\u003c/span>\u003c/div>\u003cdiv>\u003cb>biggest\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>가장 큰\u003c/span>\u003c/div>\u003cdiv>\u003cb>waterfall\u003c/b>\u003cem>명사\u003c/em>\u003cspan>폭포\u003c/span>\u003c/div>\u003cdiv>\u003cb>about\u003c/b>\u003cem>부사\u003c/em>\u003cspan>약\u003c/span>\u003c/div>\u003cdiv>\u003cb>different\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>다양한, 다른\u003c/span>\u003c/div>\u003cdiv>\u003cb>experience\u003c/b>\u003cem>동사\u003c/em>\u003cspan>경험하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>highest\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>가장 높은\u003c/span>\u003c/div>\u003cdiv>\u003cb>point\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지점\u003c/span>\u003c/div>\u003cdiv>\u003cb>take a boat tour\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>보트 투어를 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>helicopter ride\u003c/b>\u003cem>명사\u003c/em>\u003cspan>헬리콥터 타기\u003c/span>\u003c/div>\u003cdiv>\u003cb>trail\u003c/b>\u003cem>명사\u003c/em>\u003cspan>산책로\u003c/span>\u003c/div>\u003cdiv>\u003cb>wild animal\u003c/b>\u003cem>명사\u003c/em>\u003cspan>야생동물\u003c/span>\u003c/div>\u003cdiv>\u003cb>kind\u003c/b>\u003cem>명사\u003c/em>\u003cspan>종류\u003c/span>\u003c/div>\u003cdiv>\u003cb>such as\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~와 같은\u003c/span>\u003c/div>\u003cdiv>\u003cb>last\u003c/b>\u003cem>부사\u003c/em>\u003cspan>마지막으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>go hiking\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>하이킹을 가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>around\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>주변에\u003c/span>\u003c/div>\u003cdiv>\u003cb>rainforest\u003c/b>\u003cem>명사\u003c/em>\u003cspan>열대 우림\u003c/span>\u003c/div>\u003cdiv>\u003cb>below\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>아래에\u003c/span>\u003c/div>\u003cdiv>\u003cb>even\u003c/b>\u003cem>부사\u003c/em>\u003cspan>심지어\u003c/span>\u003c/div>\u003cdiv>\u003cb>on top of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~위에\u003c/span>\u003c/div>\u003cdiv>\u003cb>remember\u003c/b>\u003cem>동사\u003c/em>\u003cspan>기억하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>bring\u003c/b>\u003cem>동사\u003c/em>\u003cspan>가져오다\u003c/span>\u003c/div>\u003cdiv>\u003cb>raincoat\u003c/b>\u003cem>명사\u003c/em>\u003cspan>비옷\u003c/span>\u003c/div>\u003cdiv>\u003cb>get wet\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>젖다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어로는 enjoy, experience, trail, rainforest, raincoat를 꼭 챙겨 주세요. enjoy는 즐기다, experience는 경험하다, trail은 산책로, rainforest는 열대 우림, raincoat는 비옷이라는 뜻이에요. 특히 take a boat tour와 get wet 같은 숙어는 문장 전체를 통째로 익혀 두면 좋습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">enjoy\u003c/b>\u003cspan class=\"m\">즐기다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">like\u003c/span>\u003cspan class=\"s\">love\u003c/span>\u003cspan class=\"s\">take pleasure in\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">dislike\u003c/span>\u003cspan class=\"a\">hate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">big\u003c/b>\u003cspan class=\"m\">큰\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">large\u003c/span>\u003cspan class=\"s\">huge\u003c/span>\u003cspan class=\"s\">massive\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">small\u003c/span>\u003cspan class=\"a\">tiny\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">different\u003c/b>\u003cspan class=\"m\">다양한, 다른\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">various\u003c/span>\u003cspan class=\"s\">diverse\u003c/span>\u003cspan class=\"s\">varied\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">same\u003c/span>\u003cspan class=\"a\">identical\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">remember\u003c/b>\u003cspan class=\"m\">기억하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">recall\u003c/span>\u003cspan class=\"s\">keep in mind\u003c/span>\u003cspan class=\"s\">bear in mind\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">forget\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">wet\u003c/b>\u003cspan class=\"m\">젖은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">damp\u003c/span>\u003cspan class=\"s\">soaked\u003c/span>\u003cspan class=\"s\">moist\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">dry\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">highest\u003c/b>\u003cspan class=\"m\">가장 높은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">tallest\u003c/span>\u003cspan class=\"s\">topmost\u003c/span>\u003cspan class=\"s\">peak\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">lowest\u003c/span>\u003cspan class=\"a\">bottom\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">wild\u003c/b>\u003cspan class=\"m\">야생의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">untamed\u003c/span>\u003cspan class=\"s\">natural\u003c/span>\u003cspan class=\"s\">free-living\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">tame\u003c/span>\u003cspan class=\"a\">domestic\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 정리해 볼게요. enjoy는 like, love와 가깝고 dislike, hate와 반대되는 말이에요. big은 large, huge, massive와 비슷하고 small, tiny와 반대되며, different는 various, diverse와 가깝고 same, identical과 반대됩니다. remember는 recall, keep in mind로 바꿔 쓸 수 있고 forget과 반대되고, wet은 damp, soaked와 비슷하며 dry와 반대돼요. highest는 tallest, topmost와 가깝고 lowest와 반대된다는 점도 함께 기억해 주세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이구아수 국립공원은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Iguazú \u003c/span>\u003cspan class=\"tgt\">National \u003c/span>\u003cspan class=\"tgt\">Park \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">is\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매우 큰 국립공원\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">very \u003c/span>\u003cspan class=\"tgt\">big \u003c/span>\u003cspan class=\"tgt\">national \u003c/span>\u003cspan class=\"tgt\">park\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아르헨티나에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">Argentina\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이구아수 국립공원은 아르헨티나에서 매우 큰 국립공원이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글의 \u003cb class=\"key\">대상\u003c/b>인 이구아수 국립공원이 아르헨티나에 있는 매우 큰 국립공원임을 소개합니다. \u003cb class=\"key\">National \u003c/b>\u003cb class=\"key\">Park\u003c/b>라는 표현으로 공원의 성격을 밝히고, \u003cb class=\"key\">in \u003c/b>\u003cb class=\"key\">Argentina\u003c/b>로 위치를 알려 주어 앞으로 이어질 활동 설명의 배경을 만듭니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주어와 be동사의 수 일치\u003c/span> : [단수 주어] + [is] : \"이구아수 국립공원은 ~이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부사 very의 형용사 수식\u003c/span> : [very + 형용사] + 명사 : \"매우 큰 국립공원\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 수식\u003c/span> : [명사] + in + [장소] : \"아르헨티나에 있는\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Iguazú National Park, 이구아수 국립공원은. is, 이다. a very big national park, 매우 큰 국립공원. in Argentina, 아르헨티나에서. 이 문장 전체를 해석하면, 이구아수 국립공원은 아르헨티나에서 매우 큰 국립공원이다.","hl":"m"},{"n":13,"text":"이 문장은 글의 대상인 이구아수 국립공원을 소개해요. National Park라는 표현으로 공원의 성격을 밝히고, in Argentina로 위치를 알려 주어 뒤에 이어질 활동 설명의 배경을 만들어 줍니다.","hl":"mn"},{"n":14,"text":"먼저 주어 Iguazú National Park는 하나의 공원을 가리키는 단수라서 be동사 is를 써요. very는 big의 정도를 강조하고, big은 national park를 꾸며 하나의 명사구를 만듭니다. 마지막으로 in Argentina는 앞의 national park를 뒤에서 꾸며 어느 나라의 공원인지 알려 주는 전치사구예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은\u003c/span>\u003cspan class=\"en\">You\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">즐길 수 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">enjoy\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다양한 종류의 활동을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">many \u003c/span>\u003cspan class=\"tgt\">types \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">activities\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그곳에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">there\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그곳에서 다양한 종류의 활동을 즐길 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 이구아수 국립공원에서 \u003cb class=\"key\">다양한 \u003c/b>\u003cb class=\"key\">활동\u003c/b>을 즐길 수 있다는 글의 중심 내용을 제시합니다. 뒤에서 폭포 보기, 동물 관찰, 하이킹 같은 \u003cb class=\"key\">구체적인 \u003c/b>\u003cb class=\"key\">예\u003c/b>가 이어지므로, 이 문장은 전체 내용을 묶어 주는 \u003cb class=\"key\">도입\u003c/b> 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 can + 동사원형\u003c/span> : [can] + [동사원형] : \"즐길 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">many + 복수명사 / types of 구문\u003c/span> : [many + 복수명사 types] + of + [복수명사 activities] : \"다양한 종류의 활동\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">장소 부사 there\u003c/span> : [동사] + there : \"그곳에서\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"You, 여러분은. can enjoy, 즐길 수 있다. many types of activities, 다양한 종류의 활동을. there, 그곳에서. 이 문장 전체를 해석하면, 그곳에서 다양한 종류의 활동을 즐길 수 있다.","hl":"m"},{"n":16,"text":"이 문장은 이구아수 국립공원에서 다양한 활동을 즐길 수 있다는 글의 중심 내용을 제시해요. 뒤에서 폭포 보기, 동물 관찰, 하이킹 같은 구체적인 예가 이어지므로 이 문장은 전체 내용을 묶어 주는 도입 역할을 합니다.","hl":"mn"},{"n":17,"text":"먼저 can은 가능이나 능력을 나타내는 조동사라서 뒤에 동사원형 enjoy가 와요. many는 복수명사 types를 꾸미고, of activities는 어떤 활동의 종류인지 알려 주는 전치사구예요. 전체로는 다양한 종류의 활동이라는 명사구를 이룹니다. 마지막 there는 앞에서 말한 국립공원을 가리키며 활동이 이루어지는 장소를 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">먼저,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">First,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은\u003c/span>\u003cspan class=\"en\">you\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">볼 수 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">see\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이구아수 폭포를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">Iguazú \u003c/span>\u003cspan class=\"tgt\">Falls\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">먼저, 여러분은 이구아수 폭포를 볼 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 공원에서 할 수 있는 첫 번째 활동으로 \u003cb class=\"key\">이구아수 \u003c/b>\u003cb class=\"key\">폭포\u003c/b> 보기를 제시합니다. \u003cb class=\"key\">First\u003c/b>가 앞으로 이어질 활동 소개의 \u003cb class=\"key\">시작\u003c/b>을 알려 주고, 뒤 문장에서 폭포의 규모와 체험 방법이 자세히 설명됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">문장 부사 / 순서 전환어\u003c/span> : [First,] + [문장] : \"먼저,\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 can + 동사원형\u003c/span> : [can] + [동사원형] : \"볼 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">정관사 the의 특정 대상 지시\u003c/span> : [the] + [고유명사/복수명사] : \"이구아수 폭포를\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"First, 먼저. you, 여러분은. can see, 볼 수 있다. the Iguazú Falls, 이구아수 폭포를. 이 문장 전체를 해석하면, 먼저, 여러분은 이구아수 폭포를 볼 수 있다.","hl":"m"},{"n":19,"text":"이 문장은 공원에서 할 수 있는 첫 번째 활동으로 이구아수 폭포 보기를 제시해요. First가 앞으로 이어질 활동 소개의 시작을 알려 주고, 뒤 문장에서 폭포의 규모와 체험 방법이 자세히 설명됩니다.","hl":"mn"},{"n":20,"text":"먼저 First는 앞으로 나올 첫 활동을 소개하며 글의 순서를 분명히 하는 전환어예요. can은 가능을 나타내고 뒤에는 동사원형 see가 옵니다. the는 여러 폭포로 이루어진 이구아수 폭포라는 특정한 대상을 가리키기 위해 붙어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들은\u003c/span>\u003cspan class=\"en\">They're\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세계에서 가장 큰 폭포들이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">world's \u003c/span>\u003cspan class=\"tgt\">biggest \u003c/span>\u003cspan class=\"tgt\">waterfalls\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">약 275개의 다양한 폭포로 이루어진\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">about \u003c/span>\u003cspan class=\"tgt\">275 \u003c/span>\u003cspan class=\"tgt\">different \u003c/span>\u003cspan class=\"tgt\">waterfalls\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 약 275개의 다양한 폭포로 이루어진 세계 최대의 폭포이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 이과수 폭포가 세계에서 가장 큰 폭포군임을 강조하며, 그 \u003cb class=\"key\">규모\u003c/b>를 구체적인 수치로 뒷받침해요. 약 275개의 서로 다른 폭포가 모여 있다는 점에서 \u003cb class=\"key\">다양성\u003c/b>도 함께 드러납니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u0  taking a boat tour, 보트 투어를 하거나. helicopter ride, 헬리콥터를 타거나. or just by walking on the trails, 또는 그냥 산책로를 걷는 것만으로. 이 문장 전체를 해석하면, 가장 높은 지점인 ‘악마의 목구멍’은 보트 투어를 하거나 헬리콥터를 타거나 산책로를 걷는 것만으로 경험할 수 있다.","hl":"m"},{"n":25,"text":"이 문장은 악마의 목구멍이라는 가장 높은 지점을 여러 방법으로 체험할 수 있다고 안내해요. 보트 투어와 헬리콥터와 산책로 걷기처럼 접근 방법이 다양하다는 점을 강조합니다.","hl":"mn"},{"n":26,"text":"첫 번째로 can experience에서 can은 동사원형 experience 앞에서 가능의 의미를 나타내요. 두 번째로 the highest point, the Devil's Throat,에서 뒤의 표현은 앞의 지점을 풀어 주는 동격이에요. 세 번째로 by taking a boat tour에서 by 뒤의 동명사 taking은 수단을 나타내고요. 네 번째로 or just by walking on the trails는 앞의 by taking과 by walking을 or로 이은 병렬 구조예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 또한 볼 수 있다\u003c/span>\u003cspan class=\"en\">You \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">also \u003c/span>\u003cspan class=\"tgt\">see\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">야생동물을\u003c/span>\u003cspan class=\"en\">wild animals\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공원에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">park\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">공원에서는 야생동물도 볼 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 공원에서 할 수 있는 또 다른 활동으로 \u003cb class=\"key\">야생동물 \u003c/b>\u003cb class=\"key\">관찰\u003c/b>을 제시해요. 앞에서 폭포를 소개한 뒤 also를 통해 새로운 즐길 거리를 추가한다는 흐름을 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 can + 부사 also\u003c/span> : [조동사] + [부사] + [동사원형] : \"또한 볼 수 있다\"\u003c/div>\u003cdiv class=\"gi\" \"mk\">2\u003c/span>\u003cspan class=\"gn\">such as(예시)\u003c/span> : 명사 + such as + 예시 : \"~와 같은\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"There are, 있다. many kinds of animals, 많은 종류의 동물들이. such as jaguars, fish, turtles, and monkeys, 재규어, 물고기, 거북, 원숭이와 같은. 이 문장 전체를 해석하면, 재규어, 물고기, 거북, 원숭이와 같은 많은 종류의 동물들이 있다.","hl":"m"},{"n":31,"text":"이 문장은 공원에서 볼 수 있는 야생 동물의 구체적인 예를 보여 줘요. such as는 앞에 나온 many kinds of animals를 예시로 풀어 주는 표현이죠. 그래서 어떤 동물이 있는지 바로 이해할 수 있어요.","hl":"mn"},{"n":32,"text":"첫 번째로 There are는 유도부사 There 뒤에 be동사가 와서 존재를 나타내는 구문이에요. 두 번째로 such as는 앞의 many kinds of animals를 재규어, 물고기, 거북, 원숭이 같은 구체적인 예로 설명해 주는 표현이죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마지막으로,\u003c/span>\u003cspan class=\"en\">Last,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은 하이킹을 갈 수 있다\u003c/span>\u003cspan class=\"en\">you \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">go\u003c/span> hiking\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러 곳으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">different \u003c/span>\u003cspan class=\"tgt\">places\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">마지막으로, 여러분은 여러 곳으로 하이킹을 갈 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 공원에서 할 수 있는 마지막 활동으로 하이킹을 소개해요. \u003cb class=\"key\">Last\u003c/b>는 앞에서 열거한 활동들을 마무리하는 \u003cb class=\"key\">전환어\u003c/b>로 쓰였고, go hiking은 '하이킹하러 가다'라는 \u003cb class=\"key\">관용 \u003c/b>\u003cb class=\"key\">표현\u003c/b>이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 can(가능)\u003c/span> : 주어 + can + 동사원형 : \"~할 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 to(방향)\u003c/span> : go + to + 장소 : \"~로 가다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"Last, 마지막으로. you can go hiking, 여러분은 하이킹을 갈 수 있다. to different places, 여러 곳으로. 이 문장 전체를 해석하면, 마지막으로, 여러분은 여러 곳으로 하이킹을 갈 수 있다.","hl":"m"},{"n":34,"text":"이 문장은 공원에서 할 수 있는 마지막 활동으로 하이킹을 소개해요. Last는 앞에서 열거한 활동들을 마무리하는 전환어로 쓰였죠. go hiking은 하이킹하러 가다라는 관용 표현으로 익혀 두면 좋아요.","hl":"mn"},{"n":35,"text":"첫 번째로 can go는 조동사 can 뒤에 동사원형 go가 온 형태로 갈 수 있다라는 가능을 나타내요. 두 번째로 to different places는 go 뒤에서 여러 곳으로라는 이동의 방향을 보여 주는 전치사구예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은 하이킹을 할 수 있다\u003c/span>\u003cspan class=\"en\">You \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">hike\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">열대 우림 주변에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">around \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">rainforest, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">폭포 아래에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">below \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">falls, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">심지어 폭포 위에서도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">even \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">top \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">falls\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">열대 우림 주변, 폭포 아래, 심지어 폭포 위에서도 하이킹을 할 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 하이킹을 할 수 있는 구체적인 장소들을 나열하며 앞 문장의 different places를 풀어 줘요. \u003cb class=\"key\">around\u003c/b>, \u003cb class=\"key\">below\u003c/b>, \u003cb class=\"key\">on \u003c/b>\u003cb class=\"key\">top \u003c/b>\u003cb class=\"key\">of\u003c/b>가 각각 '주변', '아래', '위'라는 위치를 보여 주고, even은 '심지어'라는 강조를 더해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 can(가능)\u003c/span> : 주어 + can + 동사원형 : \"~할 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 병렬\u003c/span> : 전치사구 A, 전치사구 B, and 전치사구 C : \"열대 우림 주변, 폭포 아래, 그리고 심지어 폭포 위에서도\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"You can hike, 여러분은 하이킹을 할 수 있다. around the rainforest, 열대 우림 주변에서. below the falls, 폭포 아래에서. and even on top of the falls, 심지어 폭포 위에서도. 이 문장 전체를 해석하면, 열대 우림 주변, 폭포 아래, 심지어 폭포 위에서도 하이킹을 할 수 있다.","hl":"m"},{"n":37,"text":"이 문장은 하이킹을 할 수 있는 구체적인 장소들을 나열하면서 앞 문장의 different places를 풀어 줘요. around는 주변, below는 아래, on top of는 위라는 위치를 보여 주고 even은 심지어라는 강조를 더하죠. 그래서 폭포 주변과 아래뿐 아니라 위에서도 하이킹할 수 있다는 점이 강조돼요.","hl":"mn"},{"n":38,"text":"첫 번째로 can hike는 조동사 can 뒤에 동사원형 hike가 온 형태로 하이킹할 수 있다라는 가능을 나타내요. 두 번째로 around the rainforest, below the falls, and even on top of the falls는 세 개의 전치사구가 쉼표와 and로 연결된 병렬 구조예요. 각각 열대 우림 주변, 폭포 아래, 심지어 폭포 위에서라는 장소를 차례로 보여 주죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그저 가져오는 것만 기억해라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Just \u003c/span>\u003cspan class=\"tgt\">remember\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">bring\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">네 비옷을,\u003c/span>\u003cspan class=\"en\">your raincoat,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그렇지 않으면 너는 젖을 수 있다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">may \u003c/span>\u003cspan class=\"tgt\">get \u003c/span>\u003cspan class=\"tgt\">wet\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">비옷을 가져가는 것만 기억해라, 그렇지 않으면 젖을 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 공원 안내를 마치며 \u003cb class=\"key\">비옷\u003c/b>을 챙기라는 실용적 주의를 전하는 마무리 문장이에요. 'Just remember to bring'은 '그저 ~을 가져오는 것만 기억해라'라는 뜻으로, 앞의 활동 뒤에 젖을 수 있으니 준비물을 잊지 말라는 \u003cb class=\"key\">당부\u003c/b>를 담고 있어요. 'or'는 '그렇지 않으면'으로 \u003cb class=\"key\">결과\u003c/b>를 경고하는 표현이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문(동사원형으로 시작)\u003c/span> : 동사원형 + 목적어/보어 (주어 You 생략) : \"그저 기억해라\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(remember의 목적어)\u003c/span> : remember + to bring (to부정사구/목적어) : \"가져가는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">등위접속사 or(명령문 + or: 그렇지 않으면)\u003c/span> : 명령문 + or + 주어 + may + 동사원형 : \"그렇지 않으면 너는 젖을 수 있다\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"Just remember to bring, 그저 가져오는 것만 기억해라. your raincoat, 네 비옷을. or you may get wet, 그렇지 않으면 너는 젖을 수 있다.. 이 문장 전체를 해석하면, 비옷을 가져가는 것만 기억해라, 그렇지 않으면 젖을 수 있다.","hl":"m"},{"n":40,"text":"이 문장은 공원 안내를 마치면서 비옷을 챙기라는 실용적인 주의를 전하는 마무리예요. 앞에서 소개한 활동을 하다 보면 젖을 수 있으니 준비물을 잊지 말라는 당부를 담고 있죠. or는 그렇지 않으면이라는 뜻으로, 명령을 따르지 않았을 때의 결과를 경고하는 표현이에요.","hl":"mn"},{"n":41,"text":"먼저 Just remember는 주어를 생략한 명령문이에요. 동사원형으로 시작해서 기억하라는 명령을 나타내죠. 두 번째로 to bring은 remember의 목적어로 쓰인 to부정사예요. 앞으로 할 일을 기억하라는 뜻을 만들어요. 세 번째로 or you may get wet에서 or는 그렇지 않으면이라는 뜻으로, 앞의 명령을 따르지 않을 때 생기는 결과를 이어 주고 may는 가능성을 나타내요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>이구아수 국립공원은 아르헨티나의 큰 \u003cb class=\"key\">국립공원\u003c/b>으로, 다양한 활동을 즐길 수 있는 곳이다.\u003c/li>\u003cli>첫째로 약 275개의 폭포로 이루어진 \u003cb class=\"key\">이구아수 \u003c/b>\u003cb class=\"key\">폭포\u003c/b>와 \u003cb class=\"key\">악마의 \u003c/b>\u003cb class=\"key\">목구멍\u003c/b>을 보트, 헬리콥터, 산책로로 경험할 수 있다.\u003c/li>\u003cli>둘째로 재규어, 거북, 원숭이 같은 \u003cb class=\"key\">야생동물\u003c/b>을 관찰할 수 있고, 마지막으로 열대 우림과 폭포 주변에서 \u003cb class=\"key\">하이킹\u003c/b>을 할 수 있다.\u003c/li>\u003cli>폭포 근처에서는 젖을 수 있으므로 \u003cb class=\"key\">비옷\u003c/b>을 가져가야 한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Iguazú National Park offers visitors diverse activities such as seeing the Iguazú Falls, watching wild animals, and going hiking.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">이구아수 국립공원에서는 \u003cb class=\"key\">이구아수 \u003c/b>\u003cb class=\"key\">폭포\u003c/b> 감상, \u003cb class=\"key\">야생동물\u003c/b> 관찰, \u003cb class=\"key\">하이킹\u003c/b> 등 다양한 활동을 즐길 수 있으며, 폭포 주변에서는 \u003cb class=\"key\">비옷\u003c/b>을 준비해야 한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":42,"text":"정리해 볼게요. 이 글은 이구아수 국립공원에서 이구아수 폭포와 악마의 목구멍 체험, 야생동물 관찰, 하이킹을 소개했죠. 마지막으로 젖지 않으려면 비옷을 꼭 가져가야 한다는 당부도 잊지 마세요. 오늘 수업은 여기까지입니다, 수고했어요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
