<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터1 Reading 01 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}

.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터1 Reading 01","audioDir":"reading01_audio","preview":false,"count":45,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.668em\">Reading\u003cbr>01\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터1\u003c/div>\u003ch1>How Polar Bears Stay Warm in the Freezing Arctic\u003c/h1>\u003ch2>북극곰은 어떻게 혹독한 북극에서 따뜻하게 지낼까\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>북극곰은 \u003cb class=\"key\">특별한 \u003c/b>\u003cb class=\"key\">털\u003c/b>과 \u003cb class=\"key\">검은 \u003c/b>\u003cb class=\"key\">피부\u003c/b>, 그리고 \u003cb class=\"key\">체지방\u003c/b> 덕분에 영하의 북극에서도 추위를 느끼지 않는다. 털은 공기를 가두어 열을 붙잡고 물을 튕겨 내며, 검은 피부는 햇빛을 흡수하고 두꺼운 지방층은 수영 중에도 체온을 유지해 준다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Polar bears stay warm in the freezing Arctic because their special hair traps heat and repels water, while their black skin and thick body fat absorb sunlight and retain warmth.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 리딩마스터 원의 Reading one 지문, 북극곰이 혹독한 추위를 이기는 비밀을 함께 읽어 볼 거예요. 이 글은 북극곰이 특별한 털과 검은 피부, 그리고 두꺼운 체지방 덕분에 따뜻하게 지낸다는 내용을 다루고 있어요. 핵심은 털이 열을 가두고 물을 막으며, 검은 피부와 지방이 햇빛과 체온을 지켜 준다는 점이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">북극처럼 \u003cb class=\"key\">영하\u003c/b>의 혹한 환경에서는 체온을 잃지 않는 것이 생존의 핵심이에요. 온혈동물(warm-blooded animal)은 주변 온도와 관계없이 \u003cb class=\"key\">체온\u003c/b>을 일정하게 유지해야 하므로, 추위를 막는 단열(insulation) 구조가 중요하죠. 북극곰의 투명한 털은 속이 비어 있어 \u003cb class=\"key\">공기층\u003c/b>을 만들고, 이 공기가 열의 이동을 막아 보온 효과를 냅니다. 또 기름진 털은 물을 튕겨 내는 발수성(water-repellent)을 가져 젖은 상태에서 체온을 빼앗기는 일을 줄여요. 검은 색은 햇빛을 잘 \u003cb class=\"key\">흡수\u003c/b>하는데, 이는 여름에 검은 옷이 더 뜨겁게 느껴지는 일상 경험과 같은 원리예요. 마지막으로 피부 아래의 두꺼운 \u003cb class=\"key\">지방층\u003c/b>은 수영할 때도 열을 잃지 않게 도와주는 천연 단열재 역할을 합니다.\u003c/div>","segs":[{"n":2,"text":"북극처럼 영하의 혹한 환경에서는 체온을 잃지 않는 것이 생존의 핵심이에요. 온혈 동물, 즉 warm blooded animal은 주변 온도와 관계없이 체온을 일정하게 유지해야 하죠. 그래서 추위를 막는 단열, 즉 insulation 구조가 중요해요. 북극곰의 투명한 털은 속이 비어 있어 공기층을 만들고, 이 공기가 열의 이동을 막아 보온 효과를 냅니다. 또 기름진 털은 water repellent 성질을 가져서 젖은 상태에서 체온을 빼앗기는 일을 줄여요. 여름에 검은 옷이 더 뜨겁게 느껴지는 것처럼, 검은색은 햇빛을 잘 흡수하고 피부 아래의 두꺼운 지방층은 천연 단열재 역할을 합니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>문제 제기\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>북극곰은 \u003cb class=\"key\">온혈 \u003c/b>\u003cb class=\"key\">동물\u003c/b>이지만 영하의 북극 기온에서 추위를 느끼지 않는다고 제시한다. 이어서 그 비결을 \u003cb class=\"key\">특별한 \u003c/b>\u003cb class=\"key\">털\u003c/b>과 \u003cb class=\"key\">검은 \u003c/b>\u003cb class=\"key\">피부\u003c/b>라고 밝히며 글의 주제를 던진다. 독자는 왜 추운 지역에서도 체온을 유지하는지 궁금하게 된다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>털의 구조\u003csmall>근거 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>첫째, 북극곰의 털은 대부분 \u003cb class=\"key\">투명하고 \u003c/b>\u003cb class=\"key\">무색\u003c/b>이며 빈 튜브처럼 생겼다고 설명한다. 털 안은 \u003cb class=\"key\">공기\u003c/b>로 채워져 있어 태양열을 가두고, 털 자체가 \u003cb class=\"key\">기름지다\u003c/b>는 점도 함께 제시한다. 이는 털이 단순한 털이 아니라 보온 장치임을 보여 준다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>물 튕기기\u003csmall>예시 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>북극곰이 수영 후 몸을 흔들면 물이 몸에서 바로 떨어진다는 \u003cb class=\"key\">예시\u003c/b>가 이어진다. 기름진 털이 물을 막아 \u003cb class=\"key\">젖는 \u003c/b>\u003cb class=\"key\">것\u003c/b>을 막아 주므로, 젖은 몸으로 체온을 빼앗기는 일을 줄인다. 즉 털의 기름기는 보온과 \u003cb class=\"key\">발수\u003c/b>에 모두 기여한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>피부와 지방\u003csmall>근거 · 문장 8–11\u003c/small>\u003c/h4>\u003cp>둘째, 북극곰은 털 아래에 \u003cb class=\"key\">검은 \u003c/b>\u003cb class=\"key\">피부\u003c/b>가 있어 햇빛을 흡수하고 쉽게 추워지지 않는다. 게다가 검은 피부 아래에는 두꺼운 \u003cb class=\"key\">체지방층\u003c/b>이 있어 수영하는 동안에도 \u003cb class=\"key\">따뜻하게 \u003c/b>\u003cb class=\"key\">유지\u003c/b>된다. 털, 피부, 지방이 각각 다른 방식으로 보온에 기여한다는 점이 정리된다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 첫 번째 단계부터 마지막 단계까지 차례대로 짚어 볼게요.","hl":null},{"n":4,"text":"먼저 글은 북극곰이 온혈 동물이지만 영하의 북극 기온에서 추위를 느끼지 않는다고 시작해요. 이어서 그 비결이 특별한 털과 검은 피부에 있다고 말하면서 독자의 궁금증을 자아내죠. 왜 추운 지역에서도 체온을 유지할 수 있는지 자연스럽게 궁금해지게 만드는 도입부예요.","hl":"f0"},{"n":5,"text":"첫 번째 근거는 털의 구조예요. 북극곰의 털은 대부분 투명하고 무색이며, 빈 튜브처럼 생겼다고 설명하죠. 털 안은 공기로 채워져 있어 태양열을 가두고, 털 자체가 기름지다는 점도 함께 짚어요. 이 부분은 털이 단순한 털이 아니라 보온을 위한 장치임을 보여 줍니다.","hl":"f1"},{"n":6,"text":"다음으로 수영 후 몸을 흔들면 물이 몸에서 바로 떨어진다는 예시가 나와요. 기름진 털이 물을 막아서 젖는 것을 막아 주고, 젖은 몸으로 체온을 빼앗기는 일을 줄여 주죠. 결국 털의 기름기는 보온과 발수에 모두 기여한다고 정리할 수 있어요.","hl":"f2"},{"n":7,"text":"두 번째 근거는 피부와 지방이에요. 북극곰은 털 아래에 검은 피부가 있어 햇빛을 흡수하고 쉽게 추워지지 않죠. 게다가 검은 피부 아래에는 두꺼운 체지방층이 있어서 수영하는 동안에도 따뜻하게 유지됩니다. 털과 피부와 지방이 각각 다른 방식으로 보온에 힘을 보태는 거예요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 2번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">두 번째 문장에서 특별한 털과 검은 피부 덕분에 따뜻하게 지낸다는 \u003cb class=\"key\">주제문\u003c/b>이 먼저 나온다. 이후 First와 Second로 \u003cb class=\"key\">근거\u003c/b>를 나누어 제시하므로 주장-근거 구조다. 각 근거는 털의 공기와 기름, 피부의 햇빛 흡수, 지방층의 보온으로 구체화된다. 따라서 핵심 주장을 앞에 두고 세부 근거를 뒤에 붙인 \u003cb class=\"key\">두괄식\u003c/b> 전개다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>thanks to (2)\u003c/b>\u003cspan>원인·근거 제시\u003c/span>\u003cb>First (3)\u003c/b>\u003cspan>첫 번째 근거 나열\u003c/span>\u003cb>Second (8)\u003c/b>\u003cspan>두 번째 근거 나열\u003c/span>\u003cb>Moreover (10)\u003c/b>\u003cspan>추가 근거 제시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">keep warm\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">traps the sun's heat\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">soaks up the sunlight\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">don't easily get cold\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">keeps them warm\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 두 번째 문장에서 특별한 털과 검은 피부 덕분에 따뜻하게 지낸다는 주제문을 먼저 제시해요. 그다음 First와 Second로 근거를 나누어 설명하니까 주장과 근거의 구조로 볼 수 있죠. 핵심 주장이 앞에 나오고 세부 근거가 뒤에 붙으므로 두괄식 전개입니다. 중심 내용을 먼저 잡고 세부 설명을 따라가면 이해가 쉬워요.","hl":"ty"},{"n":9,"text":"신호어를 보면 thanks to가 두 번째 문장에서 원인과 근거를 제시해요. First는 세 번째 문장에서 첫 번째 근거를, Second는 여덟 번째 문장에서 두 번째 근거를 이끌죠. Moreover는 열 번째 문장에서 추가 근거를 붙여 줍니다. 이런 신호어를 따라가면 글의 뼈대가 또렷하게 보여요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>warm-blooded\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>온혈의\u003c/span>\u003c/div>\u003cdiv>\u003cb>freezing\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>몹시 추운, 영하의\u003c/span>\u003c/div>\u003cdiv>\u003cb>Arctic\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>북극의\u003c/span>\u003c/div>\u003cdiv>\u003cb>temperature\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기온, 온도\u003c/span>\u003c/div>\u003cdiv>\u003cb>keep warm\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>따뜻하게 유지하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>thanks to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~ 덕분에\u003c/span>\u003c/div>\u003cdiv>\u003cb>special\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>특별한\u003c/span>\u003c/div>\u003cdiv>\u003cb>mostly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>대부분, 주로\u003c/span>\u003c/div>\u003cdiv>\u003cb>clear\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>투명한\u003c/span>\u003c/div>\u003cdiv>\u003cb>colorless\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>무색의\u003c/span>\u003c/div>\u003cdiv>\u003cb>empty\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>빈, 비어 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>tube\u003c/b>\u003cem>명사\u003c/em>\u003cspan>튜브, 관\u003c/span>\u003c/div>\u003cdiv>\u003cb>fill\u003c/b>\u003cem>동사\u003c/em>\u003cspan>채우다\u003c/span>\u003c/div>\u003cdiv>\u003cb>trap\u003c/b>\u003cem>동사\u003c/em>\u003cspan>가두다, 붙잡다\u003c/span>\u003c/div>\u003cdiv>\u003cb>heat\u003c/b>\u003cem>명사\u003c/em>\u003cspan>열, 열기\u003c/span>\u003c/div>\u003cdiv>\u003cb>oily\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>기름진\u003c/span>\u003c/div>\u003cdiv>\u003cb>shake\u003c/b>\u003cem>동사\u003c/em>\u003cspan>흔들다\u003c/span>\u003c/div>\u003cdiv>\u003cb>come off\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>떨어져 나가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>right away\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>즉시, 바로\u003c/span>\u003c/div>\u003cdiv>\u003cb>stop A from -ing\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>A가 ~하는 것을 막다\u003c/span>\u003c/div>\u003cdiv>\u003cb>wet\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>젖은\u003c/span>\u003c/div>\u003cdiv>\u003cb>underneath\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~ 아래에\u003c/span>\u003c/div>\u003cdiv>\u003cb>fur\u003c/b>\u003cem>명사\u003c/em>\u003cspan>털\u003c/span>\u003c/div>\u003cdiv>\u003cb>soak up\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>흡수하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>sunlight\u003c/b>\u003cem>명사\u003c/em>\u003cspan>햇빛\u003c/span>\u003c/div>\u003cdiv>\u003cb>easily\u003c/b>\u003cem>부사\u003c/em>\u003cspan>쉽게\u003c/span>\u003c/div>\u003cdiv>\u003cb>moreover\u003c/b>\u003cem>부사\u003c/em>\u003cspan>게다가\u003c/span>\u003c/div>\u003cdiv>\u003cb>thick\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>두꺼운\u003c/span>\u003c/div>\u003cdiv>\u003cb>layer\u003c/b>\u003cem>명사\u003c/em>\u003cspan>층\u003c/span>\u003c/div>\u003cdiv>\u003cb>body fat\u003c/b>\u003cem>명사\u003c/em>\u003cspan>체지방\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"어휘에서는 clear가 눈에 비치는 투명한이라는 뜻이고, colorless가 무색의라는 뜻이라는 점을 구분해 두세요. trap은 열이나 공기를 가두다로, soak up은 햇빛을 흡수하다로 기억하면 좋아요. stop A from doing은 A가 하는 것을 막다라는 숙어로 꼭 익혀 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">keep warm\u003c/b>\u003cspan class=\"m\">따뜻하게 유지하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">stay warm\u003c/span>\u003cspan class=\"s\">retain heat\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">freeze\u003c/span>\u003cspan class=\"a\">cool down\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">trap\u003c/b>\u003cspan class=\"m\">가두다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">hold\u003c/span>\u003cspan class=\"s\">capture\u003c/span>\u003cspan class=\"s\">contain\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">release\u003c/span>\u003cspan class=\"a\">let out\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">clear\u003c/b>\u003cspan class=\"m\">투명한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">transparent\u003c/span>\u003cspan class=\"s\">see-through\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">opaque\u003c/span>\u003cspan class=\"a\">cloudy\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">soak up\u003c/b>\u003cspan class=\"m\">흡수하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">absorb\u003c/span>\u003cspan class=\"s\">take in\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">release\u003c/span>\u003cspan class=\"a\">emit\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">easily\u003c/b>\u003cspan class=\"m\">쉽게\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">readily\u003c/span>\u003cspan class=\"s\">effortlessly\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hardly\u003c/span>\u003cspan class=\"a\">with difficulty\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">thick\u003c/b>\u003cspan class=\"m\">두꺼운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">dense\u003c/span>\u003cspan class=\"s\">deep\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">thin\u003c/span>\u003cspan class=\"a\">narrow\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">freezing\u003c/b>\u003cspan class=\"m\">몹시 추운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">icy\u003c/span>\u003cspan class=\"s\">bitterly cold\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">boiling\u003c/span>\u003cspan class=\"a\">hot\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 함께 정리해 볼게요. keep warm은 stay warm이나 retain heat로 바꿔 말할 수 있고, 반대 표현은 freeze나 cool down이에요. trap은 hold나 capture와 가깝고, release와는 반대됩니다. clear는 transparent나 see through로 표현할 수 있고, opaque나 cloudy와는 반대예요. soak up은 absorb나 take in으로 바꿀 수 있으니 함께 외워 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">북극곰은\u003c/span>\u003cspan class=\"en\">Reading 01 Polar bears\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">온혈 동물이지만,\u003c/span>\u003cspan class=\"en\">are \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">warm-blooded\u003c/span> animals,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그런데 추위를 느끼지 않아요\u003c/span>\u003cspan class=\"en\">but they don't \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">feel \u003c/span>\u003cspan class=\"tgt\">cold\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">영하의 북극 기온에서\u003c/span>\u003cspan class=\"en\">in the \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">freezing \u003c/span>\u003cspan class=\"tgt\">Arctic \u003c/span>\u003cspan class=\"tgt\">temperatures\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">북극곰은 온혈 동물이지만, 영하의 북극 기온에서 추위를 느끼지 않는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 북극곰이 영하의 혹한에서도 추위를 느끼지 않는다는 \u003cb class=\"key\">사실\u003c/b>을 먼저 꺼내 놓으며 글의 흐름을 여는 문장이에요. warm-blooded는 체온을 스스로 유지하는 \u003cb class=\"key\">온혈\u003c/b>이라는 뜻이고, but 뒤에서 그런데도 춥지 않다고 말해 독자의 \u003cb class=\"key\">궁금증\u003c/b>을 자아냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">복합 형용사(명사 + -ed)\u003c/span> : [warm + blood + -ed → 형용사] + [명사 animals] : \"온혈의\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">감각동사 + 형용사(주격보어)\u003c/span> : feel [감각동사] + [cold (형용사/보어)] : \"추위를 느끼다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">현재분사가 명사를 수식\u003c/span> : [freeze + -ing → freezing] + [명사구] : \"얼어붙을 듯한 북극의 기온\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Polar bears, 북극곰은. are warm-blooded animals, 온혈 동물이지만. but they don't feel cold, 그런데 추위를 느끼지 않아요. in the freezing Arctic temperatures, 영하의 북극 기온에서. 이 문장 전체를 해석하면, 북극곰은 온혈 동물이지만, 영하의 북극 기온에서 추위를 느끼지 않는다.","hl":"m"},{"n":13,"text":"이 문장은 북극곰이 영하의 혹한에서도 추위를 느끼지 않는다는 사실을 먼저 꺼내 놓으면서 글을 시작하고 있어요. warm-blooded는 체온을 스스로 유지하는 온혈이라는 뜻이죠. 그런데 but 뒤에서 그런데도 춥지 않다고 말하니까 독자의 궁금증이 자연스럽게 생깁니다.","hl":"mn"},{"n":14,"text":"첫 번째, warm-blooded는 blood에 -ed를 붙여 만든 복합 형용사로 뒤에 오는 animals를 꾸며 줍니다. 두 번째, feel cold에서 feel은 감각동사라서 뒤에 부사가 아니라 형용사 cold가 그대로 보어로 와요. 세 번째, freezing은 freeze에 -ing가 붙어서 명사 Arctic temperatures를 꾸며 주는 현재분사예요. 얼어붙을 듯한 추위라는 뜻이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 따뜻하게 지내요\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">keep \u003c/span>\u003cspan class=\"tgt\">warm\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">북극에서\u003c/span>\u003cspan class=\"en\">in the Arctic\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 특별한 털과 검은 피부 덕분에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">thanks \u003c/span>\u003cspan class=\"tgt\">to\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">special \u003c/span>\u003cspan class=\"tgt\">hair \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">black \u003c/span>\u003cspan class=\"tgt\">skin\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 특별한 털과 검은 피부 덕분에 북극에서 따뜻하게 지낸다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 1번 문장에서 던진 궁금증에 대한 \u003cb class=\"key\">답\u003c/b>을 주는 문장이에요. 추위를 이겨내는 \u003cb class=\"key\">비결\u003c/b>이 특별한 털과 검은 피부임을 밝히고, thanks to로 그 이유를 '\u003cb class=\"key\">~덕분에\u003c/b>'라고 연결합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">keep + 형용사(2형식 상태 유지)\u003c/span> : keep [주어의 상태를 나타내는 형용사] : \"따뜻하게 지내다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구(이유)\u003c/span> : thanks to + [명사구] : \"~덕분에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">명사구 병렬(A and B)\u003c/span> : [명사구 A] and [명사구 B] : \"그들의 특별한 털과 검은 피부\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"They keep warm, 그들은 따뜻하게 지내요. in the Arctic, 북극에서. thanks to their special hair and black skin, 그들의 특별한 털과 검은 피부 덕분에. 이 문장 전체를 해석하면, 그들은 특별한 털과 검은 피부 덕분에 북극에서 따뜻하게 지낸다.","hl":"m"},{"n":16,"text":"이 문장은 첫 번째 문장에서 던진 궁금증에 대한 답을 주고 있어요. 추위를 이겨내는 비결이 특별한 털과 검은 피부라는 걸 밝히죠. thanks to는 ~덕분에라는 뜻으로 이유를 이어 주는 표현입니다.","hl":"mn"},{"n":17,"text":"첫 번째, keep warm에서 keep은 형용사 warm을 보어로 데리고 주어가 그 상태를 유지한다는 뜻을 만들어요. warmly라고 쓰면 안 되겠죠. 두 번째, thanks to는 전치사 덩어리라서 뒤에 명사구가 와서 이유를 나타냅니다. 세 번째, their special hair와 black skin이 and로 나란히 연결된 병렬 구조예요.","h ata-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">stop + 목적어 + from -ing (방지)\u003c/span> : stop + [목적어] + from + [동명사] : \"그들이 젖는 것을 막는다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"This, 이것은. stops them, 그들이 ~하는 것을 막는다. from getting wet, 젖는 것을. 이 문장 전체를 해석하면, 이것은 그들이 젖는 것을 막는다.","hl":"m"},{"n":31,"text":"이 문장은 앞에서 설명한 기름진 털의 효과를 정리하는 문장이에요. 물이 몸에 남지 않아 젖는 것을 막는다는 뜻이죠. 그래서 북극곰이 수영한 뒤에도 몸을 금방 말릴 수 있다는 흐름으로 이어져요.","hl":"mn"},{"n":32,"text":"첫 번째 어법 포인트는 stop 목적어 from 동명사 구조예요. 여기서 stop은 목적어가 어떤 행동을 하지 못하게 막는다는 뜻이고, from 뒤에는 동명사 getting이 와서 젖는 것을 막는다는 의미를 만들어요. 그래서 stops them from getting wet 전체를 '그들이 젖는 것을 막는다'로 해석하면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">둘째로,\u003c/span>\u003cspan class=\"en\">Second,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">북극곰은\u003c/span>\u003cspan class=\"en\">polar bears\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가지고 있다\u003c/span>\u003cspan class=\"en\">have\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">검은 피부를\u003c/span>\u003cspan class=\"en\">black skin\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 털 아래에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">underneath \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">fur\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">둘째로, 북극곰은 털 아래에 검은 피부가 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 두 번째 이유를 시작하며 북극곰의 검은 피부를 소개합니다. \u003cb class=\"key\">털 \u003c/b>\u003cb class=\"key\">아래\u003c/b>에 있는 \u003cb class=\"key\">검은 \u003c/b>\u003cb class=\"key\">피부\u003c/b>가 다음 문장에서 햇빛을 흡수하는 역할을 하게 됩니다. 즉, 앞의 털 설명에서 피부 설명으로 화제를 전환하는 역할이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 underneath + 목적어\u003c/span> : underneath + [명사구] : \"그들의 털 아래에\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"Second, 둘째로. polar bears, 북극곰은. have, 가지고 있다. black skin, 검은 피부를. underneath their fur, 그들의 털 아래에. 이 문장 전체를 해석하면, 둘째로, 북극곰은 털 아래에 검은 피부가 있다.","hl":"m"},{"n":34,"text":"이 문장은 두 번째 이유를 시작하면서 북극곰의 검은 피부를 소개해요. 털 아래에 있는 검은 피부가 다음 문장에서 햇빛을 흡수하는 역할을 하게 됩니다. 앞의 털 설명에서 피부 설명으로 화제를 전환하는 역할이죠.","hl":"mn"},{"n":35,"text":"첫 번째 어법 포인트는 underneath their fur예요. underneath는 '아래에'라는 뜻의 전치사로, 뒤에 목적어 their fur를 받아 위치를 나타내요. 그래서 '그들의 털 아래에'로 해석합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이\u003c/span>\u003cspan class=\"en\">It\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">햇빛을 흡수한다,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">soaks \u003c/span>\u003cspan class=\"tgt\">up\u003c/span> the sunlight,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">so \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 쉽게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003cspan class=\"tgt\">easily \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">추워지지 않는다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">get \u003c/span>\u003cspan class=\"tgt\">cold\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것이 햇빛을 흡수해서 북극곰들은 쉽게 추워지지 않는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 검은 피부가 햇빛을 흡수해 몸이 쉽게 차가워지지 않는다는 결과를 설명합니다. \u003cb class=\"key\">햇빛\u003c/b>을 흡수하는 것이 \u003cb class=\"key\">검은 \u003c/b>\u003cb class=\"key\">피부\u003c/b>의 핵심 기능이며, 그래서 북극곰이 추위 속에서도 덜 춥게 지낼 수 있다는 흐름입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">구동사(동사 + 부사)\u003c/span> : soak up + [목적어] : \"흡수하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">so (결과) 접속사\u003c/span> : ..., so + [주어] + [동사] ... : \"그래서 그들은 쉽게 추워지지 않는다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"It, 그것이. soaks up the sunlight, 햇빛을 흡수한다. so, 그래서. they don't easily, 그들은 쉽게. get cold, 추워지지 않는다.. 이 문장 전체를 해석하면, 그것이 햇빛을 흡수해서 북극곰들은 쉽게 추워지지 않는다.","hl":"m"},{"n":37,"text":"이 문장은 검은 피부가 햇빛을 흡수해 몸이 쉽게 차가워지지 않는다는 결과를 설명해요. 햇빛을 흡수하는 것이 검은 피부의 핵심 기능이고, 그래서 북극곰이 추위 속에서도 덜 춥게 지낼 수 있다는 흐름이에요.","hl":"mn"},{"n":38,"text":"첫 번째 어법 포인트는 soak up이에요. soak up은 동사와 부사가 결합한 구동사로, 목적어 the sunlight를 받아 '흡수하다'라는 뜻을 만들어요. 두 번째 어법 포인트는 so they don't easily get cold예요. 앞 문장의 결과를 이어 주는 등위접속사 so가 쓰였고, get은 주격보어 cold를 가지는 동사로 '추워지다'를 나타냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">게다가,\u003c/span>\u003cspan class=\"en\">Moreover,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">검은 피부 아래에는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">underneath \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">black \u003c/span>\u003cspan class=\"tgt\">skin \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">is \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">두꺼운 층이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">thick \u003c/span>\u003cspan class=\"tgt\">layer \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">체지방의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">body \u003c/span>\u003cspan class=\"tgt\">fat\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">게다가, 검은 피부 아래에는 두꺼운 체지방층이 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞의 검은 피부 설명에 정보를 하나 더 보태는 문장으로, 북극곰이 추위를 견디는 이유를 한 가지 더 제시한다. \u003cb class=\"key\">게다가\u003c/b>라는 연결어로 내용을 추가하고, 장소 표현이 앞으로 나온 \u003cb class=\"key\">도치\u003c/b> 구조라 '~아래에 …이 있다'로 해석한다. body fat은 몸속에 저장된 지방, 즉 체지방을 뜻한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부사구 도치(장소 표현 문두 도치)\u003c/span> : [장소 부사구] + [동사] + [주어] → Underneath the black skin + is + a thick layer of body fat : \"검은 피부 아래에는 두꺼운 층이 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수량 표현(a + 단위명사 + of + 명사)\u003c/span> : a thick layer + of + [불가산명사 body fat] : \"두꺼운 체지방층\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"Moreover, 게다가. underneath the black skin, 검은 피부 아래에는. is, 있다. a thick layer, 두꺼운 층이. of body fat, 체지방의. 이 문장 전체를 해석하면, 게다가, 검은 피부 아래에는 두꺼운 체지방층이 있다.","hl":"m"},{"n":40,"text":"이 문장은 검은 피부 이야기에 정보를 하나 더 보태는 문장이에요. 게다가라는 말로 시작해서 검은 피부 아래에 두꺼운 체지방층이 있다는 사실을 알려 주죠. 그래서 북극곰이 추위를 견디는 이유가 하나 더 늘어나는 거예요.","hl":"mn"},{"n":41,"text":"먼저, underneath the black skin처럼 장소를 나타내는 부사구가 문장 앞에 오면 주어와 동사가 자리를 바꾸는 도치가 일어나요. 그래서 is a thick layer처럼 동사가 먼저 나오고 주어가 뒤따르죠. 두 번째로, a thick layer of body fat에서 layer는 층이라는 단위명사라서 a thick layer처럼 관사와 형용사를 붙여 쓸 수 있고, of 뒤에는 셀 수 없는 불가산명사 body fat이 와요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 유지해 준다\u003c/span>\u003cspan class=\"en\">It \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">keeps \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들을 따뜻하게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">them \u003c/span>\u003cspan class=\"tgt\">warm\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수영하는 동안\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">while \u003c/span>\u003cspan class=\"tgt\">swimming\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 (북극곰들이) 수영하는 동안 그들을 따뜻하게 유지해 준다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 말한 두꺼운 체지방층이 실제로 어떤 역할을 하는지 밝히는 문장이다. 수영하는 동안에도 몸을 따뜻하게 유지해 준다는 뜻으로, 체지방층의 기능을 정리하며 단락을 마무리한다. It은 바로 앞의 \u003cb class=\"key\">체지방층\u003c/b>을 가리키고, them은 북극곰들을 가리킨다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">5형식 동사 keep + 목적어 + 목적격 보어(형용사)\u003c/span> : keep + [목적어 them] + [목적격 보어 warm(형용사)] : \"그들을 따뜻하게 유지해 준다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 while + 현재분사(분사구문)\u003c/span> : while + [주어·be동사 생략] + -ing → while (they are) swimming : \"수영하는 동안\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"It keeps, 그것은 유지해 준다. them warm, 그들을 따뜻하게. while swimming, 수영하는 동안. 이 문장 전체를 해석하면, 그것은 (북극곰들이) 수영하는 동안 그들을 따뜻하게 유지해 준다.","hl":"m"},{"n":43,"text":"이 문장은 앞에서 말한 두꺼운 체지방층이 실제로 어떤 일을 해 주는지 알려 줘요. 북극곰이 수영하는 동안에도 몸을 따뜻하게 유지해 준다는 뜻이죠. 그래서 체지방층의 역할을 깔끔하게 정리하는 마무리 문장이에요.","hl":"mn"},{"n":44,"text":"먼저, keeps them warm을 보면 keep이 목적어 them 뒤에 형용사 warm을 데리고 와서 목적격 보어로 쓰였어요. 그래서 '그들을 따뜻하게 유지한다'라는 5형식 문장이 되죠. 두 번째로, while swimming은 while they are swimming에서 주어와 be동사가 생략된 분사구문이에요. while이 '~하는 동안'이라는 시간의 뜻을 이끌고 있다는 점도 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>북극곰은 \u003cb class=\"key\">온혈 \u003c/b>\u003cb class=\"key\">동물\u003c/b>이지만 영하의 북극 기온에서도 추위를 느끼지 않는다.\u003c/li>\u003cli>첫째, \u003cb class=\"key\">투명한 \u003c/b>\u003cb class=\"key\">털\u003c/b>은 공기를 가두어 태양열을 붙잡고, 기름진 성질로 물을 튕겨 낸다.\u003c/li>\u003cli>둘째, 털 아래의 \u003cb class=\"key\">검은 \u003c/b>\u003cb class=\"key\">피부\u003c/b>는 햇빛을 흡수해 몸이 쉽게 추워지지 않게 한다.\u003c/li>\u003cli>또한 \u003cb class=\"key\">두꺼운 \u003c/b>\u003cb class=\"key\">체지방층\u003c/b>이 수영하는 동안 체온을 유지해 준다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Polar bears stay warm in the freezing Arctic because their special hair traps heat and repels water, while their black skin and thick body fat absorb sunlight and retain warmth.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">북극곰은 \u003cb class=\"key\">특별한 \u003c/b>\u003cb class=\"key\">털\u003c/b>과 \u003cb class=\"key\">검은 \u003c/b>\u003cb class=\"key\">피부\u003c/b>, 그리고 \u003cb class=\"key\">체지방\u003c/b> 덕분에 영하의 북극에서도 추위를 느끼지 않는다. 털은 공기를 가두어 열을 붙잡고 물을 튕겨 내며, 검은 피부는 햇빛을 흡수하고 두꺼운 지방층은 수영 중에도 체온을 유지해 준다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":45,"text":"정리해 볼게요. 북극곰은 투명한 털로 열을 가두고 물을 튕겨 내며, 검은 피부로 햇빛을 흡수하고 두꺼운 체지방으로 체온을 지켜요. 결국 여러 보온 장치가 함께 작동하기 때문에 혹독한 북극에서도 따뜻하게 지낼 수 있는 거죠. 오늘 내용 잘 복습하고, 다음 지문에서 또 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
