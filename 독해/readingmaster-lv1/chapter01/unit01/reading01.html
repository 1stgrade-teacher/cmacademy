apping the sun’s heat)</li><li>기름기 있는 털로 인한 방수 효과(oily hair)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03피부의 역할</div><ul><li>검은색 피부는 햇빛을 효과적으로 흡수하여 추위를 방지한다.</li><li>털 아래 위치한 검은 피부(black skin underneath their fur)</li><li>태양빛 흡수(soaks up the sunlight)를 통한 체온 유지</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04두꺼운 지방층의 보온</div><ul><li>피부 아래에 있는 두꺼운 지방층은 수영 중에도 체온을 지켜준다.</li><li>검은 피부 아래의 두꺼운 지방층(thick layer of body fat)</li><li>수영하는 동안 체온을 유지(keeps them warm while swimming)</li><li>핵심 키워드: 신체 지방(body fat)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">warm-blooded</td><td class=\"m\">온혈의, 정온동물의</td></tr><tr><td class=\"w\">freezing</td><td class=\"m\">몹시 추운, 결빙의</td></tr><tr><td class=\"w\">thanks to</td><td class=\"m\">~덕분에, ~ 때문에</td></tr><tr><td class=\"w\">colorless</td><td class=\"m\">색이 없는, 무색의</td></tr><tr><td class=\"w\">trap</td><td class=\"m\">가두다, 포획하다</td></tr><tr><td class=\"w\">oily</td><td class=\"m\">기름진, 유성의</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">come off</td><td class=\"m\">떨어져 나가다, 제거되다</td></tr><tr><td class=\"w\">right away</td><td class=\"m\">즉시, 바로</td></tr><tr><td class=\"w\">underneath</td><td class=\"m\">prep.</td></tr><tr><td class=\"w\">soak up</td><td class=\"m\">흡수하다, 빨아들이다</td></tr><tr><td class=\"w\">moreover</td><td class=\"m\">게다가, 더욱이</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">북극곰은</span><span class=\"en\"><b>Polar bears</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">온혈 동물이다,</span><span class=\"en\"><b><span class=\"grammar-hl\">are</span> warm-blooded animals,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 그들은 추위를 느끼지 않는다</span><span class=\"en\"><b>but they don’t feel cold</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">얼어붙는 북극 기온 속에서</span><span class=\"en\"><b>in the freezing Arctic temperatures.</b></span></div></div><div class=\"lec-sent-ko\">북극곰은 온혈 동물이지만, 영하의 북극 기온에서 추위를 느끼지 않는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 북극곰의 생물학적 특성과 그들이 사는 극한 환경 사이의 모순적인 상황을 제시하며, 이후 이어질 그들만의 특별한 생존 비결을 소개하는 도입부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are 2형식 구조: 주어(Polar bears) + be동사(are) + 보어(warm-blooded animals)의 기본 문장 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">warm-blooded</td><td class=\"m\">온혈의, 정온동물의</td></tr><tr><td class=\"w\">freezing</td><td class=\"m\">몹시 추운, 결빙의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은 따뜻함을 유지한다</span><span class=\"en\"><b>They keep warm</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">북극에서</span><span class=\"en\"><b>in the Arctic</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 특별한 털과 검은 피부 덕분에</span><span class=\"en\"><b><span class=\"grammar-hl\">thanks to</span> their special hair and black skin.</b></span></div></div><div class=\"lec-sent-ko\">그들은 특별한 털과 검은 피부 덕분에 북극에서 따뜻하게 지낸다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 제기된 의문점인 &#39;어떻게 추위를 이겨내는가&#39;에 대해 두 가지 핵심 요인(털과 피부)을 지목하며 글의 전체 구조를 잡아주는 길잡이 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">thanks to (관용표현): &#39;~덕분에&#39;라는 의미의 전치사구로, 뒤에 명사구가 이어집니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">thanks to</td><td class=\"m\">~덕분에, ~ 때문에</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">첫째로,</span><span class=\"en\"><b>First,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 털은 대부분 투명하고 무색이다,</span><span class=\"en\"><b>their hair <span class=\"grammar-hl\">is</span> mostly clear and colorless,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">빈 튜브처럼</span><span class=\"en\"><b>like an empty tube.</b></span></div></div><div class=\"lec-sent-ko\">첫째, 그들의 털은 빈 튜브처럼 대부분 투명하고 무색이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 두 가지 요인 중 첫 번째인 &#39;털&#39;에 대해 상세히 설명하기 시작하는 부분입니다. 털의 물리적 구조를 비유를 통해 설명하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is 2형식 구조: 주어(their hair) + be동사(is) + 보어(mostly clear and colorless) 형태입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">colorless</td><td class=\"m\">색이 없는, 무색의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 털은</span><span class=\"en\"><b>The hair</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">공기로 채워져 있다,</span><span class=\"en\"><b><span class=\"grammar-hl\">is filled with</span> air,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그것은 태양열을 가둔다</span><span class=\"en\"><b>and it traps the sun’s heat.</b></span></div></div><div class=\"lec-sent-ko\">털은 공기로 채워져 있고 태양열을 가둔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 투명한 털이 단순한 구조물이 아니라, 외부의 열에너지를 효율적으로 잡아두는 보온 장치 역할을 한다는 원리를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is filled with (수동태): be동사(is) + p.p.(filled) 구조입니다. fill은 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조(is filled) 형태로 씁니다. 기본구조: fill A with B(A를 B로 채우다).</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">trap</td><td class=\"m\">가두다, 포획하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">북극곰의 털은</span><span class=\"en\"><b>Polar bears’ hair</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또한 기름지다</span><span class=\"en\"><b><span class=\"grammar-hl\">is</span> also oily.</b></span></div></div><div class=\"lec-sent-ko\">북극곰의 털은 또한 기름지다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 털의 또 다른 특성인 &#39;기름기&#39;를 추가로 제시하여, 털이 가진 이중적인 기능(보온과 방수)을 연결하는 연결 고리 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is 2형식 구조: 주어(Polar bears’ hair) + be동사(is) + 보어(oily) 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">oily</td><td class=\"m\">기름진, 유성의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들이 몸을 흔들면</span><span class=\"en\"><b><span class=\"grammar-hl\">When they shake their body</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수영한 후에,</span><span class=\"en\"><b><span class=\"grammar-hl\">after swimming</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">물이 그들의 몸에서 떨어진다</span><span class=\"en\"><b>the water comes off their body</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">즉시</span><span class=\"en\"><b>right away.</b></span></div></div><div class=\"lec-sent-ko\">북극곰들이 수영 후에 몸을 흔들면 물이 몸에서 바로 떨어진다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 기름기 덕분에 발생하는 실질적인 결과입니다. 털이 젖지 않게 하여 극한 환경에서 체온이 뺏기는 것을 방지하는 과정을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">When they shake their body after swimming (분사구문): swimming은 전치사 after 뒤에 쓰인 동명사입니다. &#39;수영하기&#39;라는 명사적 개념으로 쓰였습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">right away</td><td class=\"m\">즉시, 바로</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것은 그들이 ~하는 것을 막는다</span><span class=\"en\"><b>This <span class=\"grammar-hl\">stops them</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">젖는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">from getting wet</span>.</b></span></div></div><div class=\"lec-sent-ko\">이것은 그들이 젖는 것을 막는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 설명한 털의 기름기가 수행하는 핵심 기능을 요약하여, 왜 그들이 물속을 드나들어도 안전한지를 명확히 정리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">stops them from getting wet 5형식 구조: stop + O(them) + from + V-ing 구조입니다. 여기서 getting은 전치사 from의 목적어로 쓰인 동명사입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">둘째로,</span><span class=\"en\"><b>Second,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">북극곰은 검은 피부를 가지고 있다</span><span class=\"en\"><b>polar bears <span class=\"grammar-hl\">have</span> black skin</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 털 아래에</span><span class=\"en\"><b>underneath their fur.</b></span></div></div><div class=\"lec-sent-ko\">둘째로, 북극곰은 털 아래에 검은 피부가 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 두 번째 요인인 &#39;검은 피부&#39;에 대한 설명으로 넘어가는 전환점입니다. 시선이 털에서 그 아래의 피부층으로 이동합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">have 3형식 구조: 주어(polar bears) + 타동사(have) + 목적어(black skin) 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">underneath</td><td class=\"m\">prep.</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 햇빛을 흡수한다,</span><span class=\"en\"><b>It soaks up the sunlight,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그래서 그들은 쉽게 추워지지 않는다</span><span class=\"en\"><b>so they don’t easily <span class=\"grammar-hl\">get</span> cold.</b></span></div></div><div class=\"lec-sent-ko\">그것이 햇빛을 흡수해서 북극곰들은 쉽게 추워지지 않는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 검은색이 빛을 흡수한다는 과학적 원리를 통해, 피부가 어떻게 추가적인 열원을 확보하여 체온을 지키는지 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">get 2형식 구조: &#39;상태의 변화&#39;를 나타내는 get + 형용사(cold) 형태로 &#39;~한 상태가 되다&#39;라는 의미입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">게다가,</span><span class=\"en\"><b>Moreover,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">검은 피부 아래에는</span><span class=\"en\"><b><span class=\"grammar-hl\">underneath the black skin</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">두꺼운 체지방층이 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">is a thick layer of body fat</span>.</b></span></div></div><div class=\"lec-sent-ko\">게다가, 검은 피부 아래에는 두꺼운 체지방층이 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 지금까지 언급된 털과 피부 외에도, 체온 유지를 돕는 또 하나의 장치인 &#39;지방층&#39;을 추가로 덧붙여 설명의 완성도를 높입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">underneath the black skin is a thick layer of body fat (도치): 장소를 나타내는 부사구(underneath the black skin)가 문두로 나오면서 주어(a thick layer of body fat)와 동사(is)의 위치가 바뀐 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">underneath</td><td class=\"m\">prep.</td></tr><tr><td class=\"w\">moreover</td><td class=\"m\">게다가, 더욱이</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 11 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 그들을 따뜻하게 유지해 준다</span><span class=\"en\"><b>It keeps them warm</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수영하는 동안에</span><span class=\"en\"><b><span class=\"grammar-hl\">while swimming</span>.</b></span></div></div><div class=\"lec-sent-ko\">그것은 (북극곰들이) 수영하는 동안 그들을 따뜻하게 유지해 준다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 마지막으로 지방층이 가진 구체적인 역할인 &#39;수중 보온 기능&#39;을 언급하며, 글을 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">while swimming (분사구문): 접속사 while 뒤에 주어+be동사가 생략된 형태입니다. &#39;그들이 수영을 하는 동안에&#39;라는 의미로, 원래는 &#39;while they are swimming&#39;에서 유도되었습니다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>북극곰은 혹독한 추위 속에서도 온혈 동물로서 체온을 유지하며 살아간다.</li><li>털은 속이 비어 열을 가두고 기름기가 많아 물기를 빠르게 털어낸다.</li><li>검은 피부는 태양열을 효과적으로 흡수하는 역할을 한다.</li><li>피하 지방층은 수영 중에도 몸의 온기가 빠져나가지 않도록 돕는다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Polar bears utilize heat-trapping hair and sun-absorbing black skin, and they rely on a layer of body fat to maintain warmth.</div>\n              <div class=\"lec-final-sum-ko\">북극곰은 열을 가두는 털과 햇빛을 흡수하는 검은 피부를 활용하며, 체온 유지를 위해 두꺼운 지방층에 의존한다.</div></div></div>"],"segs":[[{"audio":"./reading01_audio/1.mp3","hl":null}],[{"audio":"./reading01_audio/2.mp3","hl":null}],[{"audio":"./reading01_audio/3.mp3","hl":null},{"audio":"./reading01_audio/4.mp3","hl":"stage-0"},{"audio":"./reading01_audio/5.mp3","hl":"stage-1"},{"audio":"./reading01_audio/6.mp3","hl":"stage-2"},{"audio":"./reading01_audio/7.mp3","hl":"stage-3"}],[{"audio":"./reading01_audio/8.mp3","hl":null}],[{"audio":"./reading01_audio/9.mp3","hl":"main"},{"audio":"./reading01_audio/10.mp3","hl":"meaning"},{"audio":"./reading01_audio/11.mp3","hl":"grammar"}],[{"audio":"./reading01_audio/12.mp3","hl":"main"},{"audio":"./reading01_audio/13.mp3","hl":"meaning"},{"audio":"./reading01_audio/14.mp3","hl":"grammar"}],[{"audio":"./reading01_audio/15.mp3","hl":"main"},{"audio":"./reading01_audio/16.mp3","hl":"meaning"},{"audio":"./reading01_audio/17.mp3","hl":"grammar"}],[{"audio":"./reading01_audio/18.mp3","hl":"main"},{"audio":"./reading01_audio/19.mp3","hl":"meaning"},{"audio":"./reading01_audio/20.mp3","hl":"grammar"}],[{"audio":"./reading01_audio/21.mp3","hl":"main"},{"audio":"./reading01_audio/22.mp3","hl":"meaning"},{"audio":"./reading01_audio/23.mp3","hl":"grammar"}],[{"audio":"./reading01_audio/24.mp3","hl":"main"},{"audio":"./reading01_audio/25.mp3","hl":"meaning"},{"audio":"./reading01_audio/26.mp3","hl":"grammar"}],[{"audio":"./read
