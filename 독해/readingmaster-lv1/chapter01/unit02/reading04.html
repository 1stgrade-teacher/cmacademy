iv class=\"lec-stage-head\">02고양이를 향한 극진한 대우</div><ul><li>부유한 이집트 가정은 고양이를 귀하게 여기고 정성껏 돌보았다.</li><li>장신구(jewelry)를 착용시켜 고양이를 치장함</li><li>최고급 사료와 질 좋은 음식(high-quality food) 제공</li><li>고양이 보호를 사회적 의무로 여김</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03슬픔의 표현과 애도</div><ul><li>반려묘가 죽었을 때 이집트인들은 신체적인 변화를 통해 슬픔을 드러냈다.</li><li>고양이의 죽음에 대한 애도의 표시로 눈썹을 깎음(shave eyebrows)</li><li>눈썹이 다시 자랄 때까지 슬픔을 유지함</li><li>고양이와의 깊은 유대감(bond)을 방증함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04법적 보호와 지위</div><ul><li>고양이는 단순한 동물을 넘어 법적 보호를 받는 절대적인 존재였다.</li><li>고양이를 해친 자에게 사형(killed)이라는 엄격한 처벌 부과</li><li>고양이는 반려동물 이상의 특별한 지위(special status)를 가짐</li><li>핵심 키워드: 법적 보호(protected by law)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">ancient</td><td class=\"m\">고대의, 아주 오래된</td></tr><tr><td class=\"w\">magical</td><td class=\"m\">마법의, 신비로운</td></tr><tr><td class=\"w\">creature</td><td class=\"m\">생명체, 동물</td></tr><tr><td class=\"w\">honor</td><td class=\"m\">공경하다, 기리다</td></tr><tr><td class=\"w\">high-quality</td><td class=\"m\">질이 높은, 고급의</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">shave</td><td class=\"m\">면도하다, 깎다</td></tr><tr><td class=\"w\">eyebrow</td><td class=\"m\">눈썹</td></tr><tr><td class=\"w\">protect</td><td class=\"m\">보호하다, 지키다</td></tr><tr><td class=\"w\">clearly</td><td class=\"m\">분명히, 명확하게</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">고대 이집트인들에게</span><span class=\"en\"><b><span class=\"grammar-hl\">For ancient Egyptians,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">고양이는</span><span class=\"en\"><b><span class=\"grammar-hl\">cats</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이었다</span><span class=\"en\"><b><span class=\"grammar-hl\">were</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가장 특별한 동물</span><span class=\"en\"><b><span class=\"grammar-hl\">the most special animal.</span></b></span></div></div><div class=\"lec-sent-ko\">고대 이집트인들에게 고양이는 가장 특별한 동물이었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 고대 이집트 사회에서 고양이가 차지하는 남다른 위상을 전체 글의 주제로서 먼저 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">For ancient Egyptians, cats were the most special animal. (관용표현): For + N (~에게 있어서) 구조를 사용하여 뒤에 오는 절의 관점을 나타냄.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">ancient</td><td class=\"m\">고대의, 아주 오래된</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은</span><span class=\"en\"><b><span class=\"grammar-hl\">They</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">처음에 고양이를 키웠다</span><span class=\"en\"><b><span class=\"grammar-hl\">first kept cats</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">반려동물로서</span><span class=\"en\"><b><span class=\"grammar-hl\">as pets.</span></b></span></div></div><div class=\"lec-sent-ko\">그들은 처음으로 고양이를 반려동물로 키웠다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 특별함이 어떤 방식으로 시작되었는지 역사적 사실을 통해 구체적으로 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">They first kept cats as pets. 5형식(SVOC) 구조: &#39;keep + O + C&#39; 형태(O를 C인 상태로 유지하다/기르다)에서 cats가 목적어, as pets가 보어 역할을 함.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이집트인들은</span><span class=\"en\"><b><span class=\"grammar-hl\">Egyptians</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">믿었다</span><span class=\"en\"><b><span class=\"grammar-hl\">believed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">고양이가</span><span class=\"en\"><b><span class=\"grammar-hl\">cats</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">마법의 동물이라고</span><span class=\"en\"><b><span class=\"grammar-hl\">were magical creatures.</span></b></span></div></div><div class=\"lec-sent-ko\">이집트인들은 고양이가 마법의 동물이라고 믿었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 고양이를 단순한 동물을 넘어 신비로운 힘을 가진 영적인 존재로 인식했다는 정신적 배경을 보여 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Egyptians believed cats were magical creatures. 명사절(that절) 목적어: believe(타동사) 뒤에 접속사 that이 생략된 형태의 명사절이 와서 믿음의 내용을 설명함.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">magical</td><td class=\"m\">마법의, 신비로운</td></tr><tr><td class=\"w\">creature</td><td class=\"m\">생명체, 동물</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은</span><span class=\"en\"><b><span class=\"grammar-hl\">They</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">생각했다</span><span class=\"en\"><b><span class=\"grammar-hl\">thought</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">고양이가 행운을 가져다준다고</span><span class=\"en\"><b><span class=\"grammar-hl\">that cats brought good luck.</span></b></span></div></div><div class=\"lec-sent-ko\">그들은 고양이가 행운을 가져다준다고 생각했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 &#39;마법을 지닌 존재&#39;라는 믿음이 구체적으로 어떤 긍정적인 기대감으로 이어졌는지 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">They thought that cats brought good luck. 명사절(that절) 목적어: thought(타동사) 뒤에 접속사 that이 이끄는 절이 목적어 역할을 하여 생각의 내용을 구체화함.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">고양이들에게 경의를 표하기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">To honor the cats,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">부유한 가정은</span><span class=\"en\"><b>rich families</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">보석을 걸어 주었다</span><span class=\"en\"><b><span class=\"grammar-hl\">put jewelry</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들에게</span><span class=\"en\"><b><span class=\"grammar-hl\">on them</span>.</b></span></div></div><div class=\"lec-sent-ko\">고양이들에게 경의를 표하기 위해, 부유한 가정은 그들에게 보석을 걸어 주었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 행운을 주는 존재에 대한 존경심이 상류층의 구체적인 행동, 즉 장신구 착용이라는 방식으로 나타났음을 보여 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">To honor the cats, (to부정사): 문장 맨 앞에서 부사적 용법(목적)으로 쓰여 &#39;~하기 위해서&#39;라고 해석됨.</div><div class=\"lec-gr-item\">put jewelry on them (관용표현): put A on B(A를 B 위에 놓다/착용시키다) 구조가 사용됨.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">honor</td><td class=\"m\">공경하다, 기리다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은</span><span class=\"en\"><b>They</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또한 고품질의 음식을 주었다</span><span class=\"en\"><b>also <span class=\"grammar-hl\">gave high-quality food</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">고양이들에게</span><span class=\"en\"><b><span class=\"grammar-hl\">to the cats</span>.</b></span></div></div><div class=\"lec-sent-ko\">자신들은 또한 고양이들에게 고품질의 음식을 주었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 보석을 걸어 주는 것에 이어, 먹이까지 최고급으로 제공할 정도로 고양이를 극진히 대접했다는 사실을 덧붙입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">gave high-quality food to the cats 4형식(SVOO) 전환: give + 간접목적어(사람) + 직접목적어(물건) 구조를 &#39;give + 직접목적어 + to + 간접목적어&#39; 형태로 바꾼 구조임.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">high-quality</td><td class=\"m\">질이 높은, 고급의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">고양이는</span><span class=\"en\"><b><span class=\"grammar-hl\">Cats</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이었다</span><span class=\"en\"><b><span class=\"grammar-hl\">were</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">중요한 부분</span><span class=\"en\"><b><span class=\"grammar-hl\">an important part</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">고대 이집트 생활의</span><span class=\"en\"><b><span class=\"grammar-hl\">of ancient Egyptian life.</span></b></span></div></div><div class=\"lec-sent-ko\">고양이는 고대 이집트 생활의 중요한 부분이었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 지금까지 나열한 고양이에 대한 대우가 단순한 애호를 넘어 이집트인들의 일상 속에 깊이 뿌리내리고 있었음을 요약합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Cats were an important part of ancient Egyptian life. be동사 보어: be동사 were 뒤에 명사구 an important part가 주격 보어로 와서 주어의 상태를 설명함.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">ancient</td><td class=\"m\">고대의, 아주 오래된</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">고양이가 죽었을 때</span><span class=\"en\"><b><span class=\"grammar-hl\">When cats died,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 주인들은</span><span class=\"en\"><b><span class=\"grammar-hl\">their owners</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">눈썹을 밀곤 했다</span><span class=\"en\"><b><span class=\"grammar-hl\">would shave their eyebrows.</span></b></span></div></div><div class=\"lec-sent-ko\">고양이들이 죽었을 때, 그들의 주인들은 그들의 눈썹을 밀곤 했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 고양이를 잃은 슬픔을 표현하기 위해 자신의 신체 일부를 변형하는 독특한 장례 의식을 소개합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">When cats died, their owners would shave their eyebrows. (분사구문(축약절)): When절은 &#39;When + they(cats) + died&#39;의 구조로, 시간의 부사절을 이끎.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">shave</td><td class=\"m\">면도하다, 깎다</td></tr><tr><td class=\"w\">eyebrow</td><td class=\"m\">눈썹</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은</span><span class=\"en\"><b>They</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">슬픔을 드러냈다</span><span class=\"en\"><b>showed their sadness</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">눈썹이 다시 자랄 때까지</span><span class=\"en\"><b><span class=\"grammar-hl\">until their eyebrows grew back.</span></b></span></div></div><div class=\"lec-sent-ko\">그들은 눈썹이 다시 자랄 때까지 슬픔을 드러냈다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 눈썹을 미는 행위가 일회성 이벤트가 아니라, 슬픔을 지속적으로 표출하는 기간을 의미했음을 알려 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">until their eyebrows grew back. (전치사/접속사): until이 접속사로 쓰여 뒤에 주어(eyebrows)와 동사(grew)가 이끄는 절을 연결함.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">eyebrow</td><td class=\"m\">눈썹</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">고대 이집트인들은</span><span class=\"en\"><b><span class=\"grammar-hl\">The ancient Egyptians</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">고양이를 보호했다</span><span class=\"en\"><b><span class=\"grammar-hl\">protected cats</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">심지어 법으로</span><span class=\"en\"><b><span class=\"grammar-hl\">even by law.</span></b></span></div></div><div class=\"lec-sent-ko\">고대 이집트인들은 심지어 법으로 고양이를 보호했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 개인적인 존중과 종교적 믿음을 넘어 사회적인 법적 체계 안에서 고양이를 보호했음을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">The ancient Egyptians protected cats even by law. (관용표현): by + law(법에 의하여)라는 수단/방법을 나타내는 전치사구 표현임.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">ancient</td><td class=\"m\">고대의, 아주 오래된</td></tr><tr><td class=\"w\">protect</td><td class=\"m\">보호하다, 지키다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 11 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사람이 고양이를 죽였을 때</span><span class=\"en\"><b><span class=\"grammar-hl\">When a human killed a cat,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 사람은</span><span class=\"en\"><b><span class=\"grammar-hl\">he or she</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">죽임을 당했다</span><span class=\"en\"><b><span class=\"grammar-hl\">was killed,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또한</span><span class=\"en\"><b><span class=\"grammar-hl\">too.</span></b></span></div></div><div class=\"lec-sent-ko\">사람이 고양이를 죽였을 때, 그 사람 또한 죽임을 당했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 법적 보호의 강력함을 보여 주는 사례로, 고양이의 생명이 인간의 생명과 동일한 가치를 지녔음을 극명하게 드러냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">When a human killed a cat, he or she was killed, too. (수동태): be동사(was)+p.p.(killed) 구조. kill은 타동사인데 목적어가 없어서 수동구조 was killed 형태로 씀. 기본구조: S + kill + O(목적어)를 능동태로 사용함.</div></div>\n        ","<div class=\"lec-sent-no\">문장 12 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">고양이는</span><span class=\"en\"><b><span class=\"grammar-hl\">Cats</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">분명히 ~였다</span><span class=\"en\"><b><span class=\"grammar-hl\">were clearly</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">단순한 반려동물 그 이상</span><span class=\"en\"><b><span class=\"grammar-hl\">more than just pets</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들에게는</span><span class=\"en\"><b><span class=\"grammar-hl\">to them.</span></b></span></div></div><div class=\"lec-sent-ko\">그들에게 고양이들은 분명히 반려동물 그 이상이었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글 전체에서 다룬 여러 사례를 종합하여 고양이가 이집트 문화에서 신성하고 불가침한 존재였음을 결론짓습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Cats were clearly more than just pets to them. (관용표현): more than (~이상으로)이라는 비교 표현이 강조의 의미로 사용됨.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">clearly</td><td class=\"m\">분명히, 명확하게</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>고대 이집트인들에게 고양이는 행운과 마법을 가져다주는 신성한 존재였다.</li><li>그들은 고양이를 보석으로 치장하고 고급 음식을 주는 등 극진히 대접했다.</li><li>고양이가 죽으면 눈썹을 밀며 슬퍼할 정도로 가족과 같은 깊은 유대감을 가졌다.</li><li>법을 통해 고양이를 해친 자를 엄벌할 만큼, 고양이는 반려동물 그 이상의 사회적 위상을 지녔다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Ancient Egyptians revered cats as magical symbols of good luck, and they enforced strict laws to ensure their protection.</div>\n              <div class=\"lec-final-sum-ko\">고대 이집트인들은 고양이를 행운을 가져다주는 마법적인 존재로 숭배했으며, 이들을 보호하기 위해 엄격한 법을 시행했다.</div></div></div>"],"segs":[[{"audio":"./reading04_audio/1.mp3","hl":null}],[{"audio":"./reading04_audio/2.mp3","hl":null}],[{"audio":"./reading04_audio/3.mp3","hl":null},{"audio":"./reading04_audio/4.mp3","hl":"stage-0"},{"audio":"./reading04_audio/5.mp3","hl":"stage-1"},{"audio":"./reading04_audio/6.mp3","hl":"stage-2"},{"audio":"./reading04_audio/7.mp3","hl":"stage-3"}],[{"audio":"./reading04_audio/8.mp3","hl":null}],[{"audio":"./reading04_audio/9.mp3","hl":"main"},{"audio":"./reading04_audio/10.mp3","hl":"meaning"},{"audio":"./reading04_audio/11.mp3","hl":"grammar"}],[{"audio":"./reading04_audio/12.mp3","hl":"main"},{"audio":"./reading04_audio/13.mp3","hl":"meaning"},{"audio":"./reading04_audio/14.mp3","hl":"gramm
