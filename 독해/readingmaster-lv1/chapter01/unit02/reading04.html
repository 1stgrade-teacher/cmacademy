<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터1 Reading 04 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터1 Reading 04","audioDir":"reading04_audio","preview":false,"count":48,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.668em\">Reading\u003cbr>04\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터1\u003c/div>\u003ch1>Cats: More Than Pets in Ancient Egypt\u003c/h1>\u003ch2>고양이: 고대 이집트에서 반려동물 그 이상\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>고대 이집트인들은 고양이를 \u003cb class=\"key\">특별한 \u003c/b>\u003cb class=\"key\">동물\u003c/b>로 여겨 반려동물로 키웠고, 고양이가 \u003cb class=\"key\">마법의 \u003c/b>\u003cb class=\"key\">동물\u003c/b>로서 행운을 가져다준다고 믿었다. 고양이는 보석과 고품질의 음식으로 경의를 받았고 법으로 보호될 만큼 고대 이집트 생활의 \u003cb class=\"key\">중요한 \u003c/b>\u003cb class=\"key\">부분\u003c/b>이었다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>For ancient Egyptians, cats were revered as magical luck-bringing creatures and were protected by law, making them far more than just pets.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 오늘은 고대 이집트에서 고양이가 얼마나 특별했는지 살펴볼 거예요. 이 글은 고양이를 가장 특별한 동물로 여긴 고대 이집트인의 생각과 생활을 담고 있어요. 고양이는 마법의 동물로 믿어졌고 고대 이집트 생활의 중요한 부분이었으며, 결국 반려동물 그 이상이었다는 내용이에요. 함께 문장을 하나씩 읽으며 주제와 흐름을 잡아 봅시다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">고대 이집트에서는 동물을 신성하게 여기는 \u003cb class=\"key\">동물 \u003c/b>\u003cb class=\"key\">숭배\u003c/b>(animal worship) 문화가 발달했어요. 특히 고양이는 곡식을 해치는 설치류를 잡아 주어 공동체에 도움을 주었고, 이런 실용적 가치가 \u003cb class=\"key\">마법\u003c/b>적 존재라는 믿음과 결합했죠. 오늘날 사람들이 반려동물을 가족처럼 대하는 모습을 떠올리면 이해가 쉬워요. 이집트인들은 고양이가 행운을 가져온다고 믿어 보석과 좋은 음식으로 예우했고, 죽었을 때는 \u003cb class=\"key\">애도\u003c/b>의 표시로 눈썹을 밀었어요. 또한 고양이를 죽인 사람에게 사형을 내릴 만큼 \u003cb class=\"key\">법\u003c/b>으로 보호했답니다.\u003c/div>","segs":[{"n":2,"text":"배경을 조금 알아볼게요. 고대 이집트에는 동물을 신성하게 여기는 동물 숭배 문화가 있었어요. 고양이는 곡식을 해치는 설치류를 잡아 주어 사람들에게 실용적인 도움을 주었고, 이런 점이 마법적인 존재라는 믿음과 자연스럽게 이어졌죠. 오늘날 반려동물을 가족처럼 아끼는 모습을 떠올리면 이해가 쉬울 거예요. 이집트인들은 고양이가 죽었을 때 눈썹을 밀며 애도를 표했고, 고양이를 법으로 보호하기까지 했답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>특별한 동물\u003csmall>도입 · 문장 1–4\u003c/small>\u003c/h4>\u003cp>고대 이집트인들에게 고양이는 가장 \u003cb class=\"key\">특별한 \u003c/b>\u003cb class=\"key\">동물\u003c/b>이었어요. 그들은 고양이를 처음으로 \u003cb class=\"key\">반려동물\u003c/b>로 키웠고, 고양이를 \u003cb class=\"key\">마법의 \u003c/b>\u003cb class=\"key\">동물\u003c/b>로 여겼죠. 또한 고양이가 행운을 가져다준다고 믿었어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>경의와 중요성\u003csmall>예시 · 문장 5–7\u003c/small>\u003c/h4>\u003cp>고양이에게 경의를 표하기 위해 부유한 가정은 보석을 걸어 주고 고품질의 음식을 주었어요. 이런 예우는 고양이가 \u003cb class=\"key\">고대 \u003c/b>\u003cb class=\"key\">이집트 \u003c/b>\u003cb class=\"key\">생활\u003c/b>의 중요한 부분이었음을 보여 주죠. 즉 고양이는 단순한 동물을 넘어 \u003cb class=\"key\">존경의 \u003c/b>\u003cb class=\"key\">대상\u003c/b>이었어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>애도와 보호\u003csmall>근거 · 문장 8–10\u003c/small>\u003c/h4>\u003cp>고양이가 죽으면 주인들은 눈썹을 밀며 \u003cb class=\"key\">슬픔\u003c/b>을 드러냈어요. 눈썹이 다시 자랄 때까지 애도했다는 점이 고양이에 대한 \u003cb class=\"key\">애정\u003c/b>을 보여 줍니다. 이집트인들은 심지어 \u003cb class=\"key\">법\u003c/b>으로 고양이를 보호했어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>반려동물 그 이상\u003csmall>결론 · 문장 11–12\u003c/small>\u003c/h4>\u003cp>사람이 고양이를 죽이면 그 사람도 죽임을 당할 만큼 처벌은 엄격했어요. 이는 고양이의 \u003cb class=\"key\">생명\u003c/b>을 매우 중하게 여겼다는 뜻이죠. 결국 고양이는 그들에게 \u003cb class=\"key\">반려동물 \u003c/b>\u003cb class=\"key\">그 \u003c/b>\u003cb class=\"key\">이상\u003c/b>이었습니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 차례대로 살펴볼게요.","hl":null},{"n":4,"text":"먼저 고대 이집트인들에게 고양이는 가장 특별한 동물이었어요. 그들은 고양이를 처음으로 반려동물로 키웠고, 고양이를 마법의 동물로 여겼죠. 그리고 고양이가 행운을 가져다준다고 믿었어요.","hl":"f0"},{"n":5,"text":"다음으로 고양이에게 경의를 표하는 모습이 나와요. 부유한 가정은 고양이에게 보석을 걸어 주고 고품질의 음식을 주었죠. 이런 예우는 고양이가 고대 이집트 생활의 중요한 부분이었음을 보여 줘요. 즉 고양이는 당시 사람들에게 존경의 대상이었어요.","hl":"f1"},{"n":6,"text":"고양이가 죽으면 주인들은 눈썹을 밀며 슬픔을 드러냈어요. 눈썹이 다시 자랄 때까지 애도했다는 점은 고양이에 대한 애정을 잘 보여 주죠. 이집트인들은 심지어 법으로 고양이를 보호했어요.","hl":"f2"},{"n":7,"text":"마지막으로 사람이 고양이를 죽이면 그 사람도 죽임을 당할 만큼 처벌이 엄격했어요. 이것은 고양이의 생명을 매우 중하게 여겼다는 뜻이죠. 결국 고양이는 그들에게 반려동물 그 이상이었습니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">예시\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 고양이가 가장 \u003cb class=\"key\">특별한 \u003c/b>\u003cb class=\"key\">동물\u003c/b>이었다고 주제를 먼저 제시했어요. 이어서 반려동물로 키운 사실, 마법적 존재라는 믿음, 보석과 음식, 눈썹 애도, 법적 보호 같은 \u003cb class=\"key\">구체적 \u003c/b>\u003cb class=\"key\">예시\u003c/b>를 나열하며 주제를 뒷받침합니다. 마지막 문장에서 고양이가 반려동물 그 이상이었다고 다시 정리해 주제를 강조해요. 그래서 핵심이 앞에 나오고 뒤에서 예시로 받쳐 주는 \u003cb class=\"key\">두괄식\u003c/b> 구조로 볼 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>For ancient Egyptians (1)\u003c/b>\u003cspan>대상과 도입 제시\u003c/span>\u003cb>also (6)\u003c/b>\u003cspan>내용 추가\u003c/span>\u003cb>When (8)\u003c/b>\u003cspan>시간적 상황 제시\u003c/span>\u003cb>even (10)\u003c/b>\u003cspan>강조\u003c/span>\u003cb>clearly (12)\u003c/b>\u003cspan>결론 강조\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">the most special animal\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">magical creatures\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">brought good luck\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">an important part of ancient Egyptian life\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">more than just pets\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 예시를 중심으로 한 설명이에요. 첫 문장에서 고양이가 가장 특별한 동물이라는 주제를 먼저 던지고, 뒤에서 여러 구체적 예시로 그것을 받쳐 줍니다. 마지막에는 고양이가 반려동물 그 이상이었다고 다시 정리하며 주제를 강조해요. 그래서 핵심이 앞에 나오는 두괄식 구조로 보는 것이 자연스럽습니다.","hl":"ty"},{"n":9,"text":"신호어를 보면 첫 문장의 For ancient Egyptians가 글의 대상을 소개해요. also는 앞의 내용에 정보를 더하고, When은 고양이가 죽었을 때라는 상황을 이끌죠. even과 clearly는 보호의 강도와 결론을 강조하는 표현이에요. 마지막 문장은 앞의 내용을 반려동물 그 이상이라는 말로 재진술하며 주제를 다시 확인해 줍니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>ancient\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>고대의\u003c/span>\u003c/div>\u003cdiv>\u003cb>Egyptian\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이집트인\u003c/span>\u003c/div>\u003cdiv>\u003cb>special\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>특별한\u003c/span>\u003c/div>\u003cdiv>\u003cb>animal\u003c/b>\u003cem>명사\u003c/em>\u003cspan>동물\u003c/span>\u003c/div>\u003cdiv>\u003cb>keep\u003c/b>\u003cem>동사\u003c/em>\u003cspan>키우다, 기르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>pet\u003c/b>\u003cem>명사\u003c/em>\u003cspan>반려동물\u003c/span>\u003c/div>\u003cdiv>\u003cb>believe\u003c/b>\u003cem>동사\u003c/em>\u003cspan>믿다\u003c/span>\u003c/div>\u003cdiv>\u003cb>magical\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>마법의\u003c/span>\u003c/div>\u003cdiv>\u003cb>creature\u003c/b>\u003cem>명사\u003c/em>\u003cspan>생물, 동물\u003c/span>\u003c/div>\u003cdiv>\u003cb>bring\u003c/b>\u003cem>동사\u003c/em>\u003cspan>가져다주다\u003c/span>\u003c/div>\u003cdiv>\u003cb>good luck\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>행운\u003c/span>\u003c/div>\u003cdiv>\u003cb>honor\u003c/b>\u003cem>동사\u003c/em>\u003cspan>경의를 표하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>rich\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>부유한\u003c/span>\u003c/div>\u003cdiv>\u003cb>put\u003c/b>\u003cem>동사\u003c/em>\u003cspan>걸다, 달다\u003c/span>\u003c/div>\u003cdiv>\u003cb>jewelry\u003c/b>\u003cem>명사\u003c/em>\u003cspan>보석, 장신구\u003c/span>\u003c/div>\u003cdiv>\u003cb>high-quality\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>고품질의\u003c/span>\u003c/div>\u003cdiv>\u003cb>food\u003c/b>\u003cem>명사\u003c/em>\u003cspan>음식\u003c/span>\u003c/div>\u003cdiv>\u003cb>important\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>중요한\u003c/span>\u003c/div>\u003cdiv>\u003cb>part\u003c/b>\u003cem>명사\u003c/em>\u003cspan>부분\u003c/span>\u003c/div>\u003cdiv>\u003cb>owner\u003c/b>\u003cem>명사\u003c/em>\u003cspan>주인\u003c/span>\u003c/div>\u003cdiv>\u003cb>shave\u003c/b>\u003cem>동사\u003c/em>\u003cspan>밀다\u003c/span>\u003c/div>\u003cdiv>\u003cb>eyebrow\u003c/b>\u003cem>명사\u003c/em>\u003cspan>눈썹\u003c/span>\u003c/div>\u003cdiv>\u003cb>sadness\u003c/b>\u003cem>명사\u003c/em>\u003cspan>슬픔\u003c/span>\u003c/div>\u003cdiv>\u003cb>grow back\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>다시 자라다\u003c/span>\u003c/div>\u003cdiv>\u003cb>protect\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보호하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>law\u003c/b>\u003cem>명사\u003c/em>\u003cspan>법\u003c/span>\u003c/div>\u003cdiv>\u003cb>human\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사람\u003c/span>\u003c/div>\u003cdiv>\u003cb>kill\u003c/b>\u003cem>동사\u003c/em>\u003cspan>죽이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>clearly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>분명히\u003c/span>\u003c/div>\u003cdiv>\u003cb>more than\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~ 이상, ~ 그 이상\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"ancient는 고대의, honor는 경의를 표하다, protect는 보호하다라는 뜻이에요. shave는 밀다, eyebrow는 눈썹, grow back은 다시 자라다로 기억해 두세요. high-quality는 고품질의, clearly는 분명히라는 의미도 함께 익혀 봅시다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">special\u003c/b>\u003cspan class=\"m\">특별한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">exceptional\u003c/span>\u003cspan class=\"s\">unique\u003c/span>\u003cspan class=\"s\">particular\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ordinary\u003c/span>\u003cspan class=\"a\">common\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">magical\u003c/b>\u003cspan class=\"m\">마법의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">mystical\u003c/span>\u003cspan class=\"s\">supernatural\u003c/span>\u003cspan class=\"s\">enchanted\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ordinary\u003c/span>\u003cspan class=\"a\">natural\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">honor\u003c/b>\u003cspan class=\"m\">경의를 표하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">respect\u003c/span>\u003cspan class=\"s\">revere\u003c/span>\u003cspan class=\"s\">admire\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">disrespect\u003c/span>\u003cspan class=\"a\">insult\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">protect\u003c/b>\u003cspan class=\"m\">보호하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">guard\u003c/span>\u003cspan class=\"s\">defend\u003c/span>\u003cspan class=\"s\">shield\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">harm\u003c/span>\u003cspan class=\"a\">endanger\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">important\u003c/b>\u003cspan class=\"m\">중요한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">significant\u003c/span>\u003cspan class=\"s\">crucial\u003c/span>\u003cspan class=\"s\">essential\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">trivial\u003c/span>\u003cspan class=\"a\">minor\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">sadness\u003c/b>\u003cspan class=\"m\">슬픔\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">sorrow\u003c/span>\u003cspan class=\"s\">grief\u003c/span>\u003cspan class=\"s\">unhappiness\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">joy\u003c/span>\u003cspan class=\"a\">happiness\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">kill\u003c/b>\u003cspan class=\"m\">죽이다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">murder\u003c/span>\u003cspan class=\"s\">slay\u003c/span>\u003cspan class=\"s\">take life\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">save\u003c/span>\u003cspan class=\"a\">spare\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"핵심 어휘의 동의어와 반의어도 정리해 볼게요. special은 exceptional이나 unique로 바꿀 수 있고 반대말은 ordinary나 common이에요. honor는 respect나 revere로 표현할 수 있으며 반대말은 disrespect입니다. protect는 guard나 defend로 바꿀 수 있고 반대말은 harm이나 endanger예요. important는 significant나 crucial로, sadness는 sorrow나 grief로 바꿔 말할 수 있습니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고대 이집트인들에게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">For \u003c/span>\u003cspan class=\"tgt\">ancient \u003c/span>\u003cspan class=\"tgt\">Egyptians\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고양이는 ~이었다\u003c/span>\u003cspan class=\"en\">cats were\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가장 특별한 동물\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">most \u003c/span>\u003cspan class=\"tgt\">special\u003c/span> animal.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">고대 이집트인들에게 고양이는 가장 특별한 동물이었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글 전체의 주제를 여는 첫 문장으로, 고양이가 고대 이집트인들에게 얼마나 \u003cb class=\"key\">특별한 \u003c/b>\u003cb class=\"key\">존재\u003c/b>였는지를 먼저 던져 줍니다. 앞에 놓인 For ancient Egyptians는 '고대 이집트인들의 입장에서 보면'이라는 \u003cb class=\"key\">관점\u003c/b>을 제시해, 뒤에 나올 최상급 표현의 범위를 분명히 해 주는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 for의 관점 용법(∼에게는)\u003c/span> : For + [사람 명사] , + 주어 + 동사 ~ → '~에게는 / ~의 입장에서는' : \"고대 이집트인들에게\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">최상급(the + most + 형용사)\u003c/span> : the + most + [형용사] + [명사] → '가장 …한 ~' : \"가장 특별한\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"For ancient Egyptians, 고대 이집트인들에게. cats were, 고양이는 ~이었다. the most special animal, 가장 특별한 동물. 이 문장 전체를 해석하면, 고대 이집트인들에게 고양이는 가장 특별한 동물이었다.","hl":"m"},{"n":13,"text":"이 문장은 글의 첫 문장이에요. 고양이가 고대 이집트인들에게 얼마나 특별한 존재였는지, 글 전체의 주제를 던져 주고 있죠. For ancient Egyptians는 '고대 이집트인들의 입장에서는'이라는 관점을 먼저 제시해서, 뒤에 나오는 비교의 범위를 잡아 주는 역할을 합니다.","hl":"mn"},{"n":14,"text":"첫 번째로 문장 맨 앞의 For ancient Egyptians를 보세요. for가 여기서는 '~에게는, ~의 입장에서는'이라는 관점을 나타내는 전치사로 쓰였어요. 두 번째로 the most special을 보면 최상급인데, 최상급 앞에는 범위를 한정하는 정관사 the가 반드시 붙는다는 점 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 처음으로 키웠다\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">first \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">kept \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고양이를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">cats \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">반려동물로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">pets\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 처음으로 고양이를 반려동물로 키웠다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이집트인들과 고양이의 관계가 시작된 지점을 알려 주는 문장입니다. 고양이가 단순한 야생 동물이 아니라 사람 곁에서 함께 산 \u003cb class=\"key\">반려동물\u003c/b>이었다는 사실을 first로 강조하며, 앞 문장의 '특별한 동물'이라는 평가에 근거를 더해 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부사의 위치(일반동사 앞)\u003c/span> : 주어 + [부사] + [일반동사] ~ : \"처음으로 키웠다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">keep + 목적어 + as + 명사(목적격 보어)\u003c/span> : keep [목적어] + as [명사] → '~을 …로 키우다/유지하다' : \"고양이를 반려동물로 키웠다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"They first kept, 그들은 처음으로 키웠다. cats, 고양이를. as pets, 반려동물로. 이 문장 전체를 해석하면, 그들은 처음으로 고양이를 반려동물로 키웠다.","hl":"m"},{"n":16,"text":"이 문장은 이집트인들과 고양이의 관계가 어디서 시작됐는지를 알려 줘요. 고양이가 그냥 스쳐 지나가는 동물이 아니라 사람 곁에서 함께 산 반려동물이었다는 점을 first로 콕 짚어 주고 있죠. 앞 문장에서 말한 '특별한 동물'이라는 평가에 근거를 더해 주는 문장입니다.","hl":"mn"},{"n":17,"text":"첫 번째로 first의 위치를 보세요. first는 일반동사 kept 바로 앞에 놓여서 '처음으로'라는 시간의 의미를 더해 주고 있어요. 두 번째로 kept cats as pets에서 as는 '~로서'라는 자격을 나타내는 전치사이고, as pets가 목적어 cats를 설명하는 목적격 보어 역할을 합니다. keep은 목적어 뒤에 as를 붙여 '~을 …로 키우다'라는 표현을 만든다는 것도 함께 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이집트인들은 믿었다\u003c/span>\u003cspan class=\"en\">Egyptians \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">believed \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고양이는 ~이었다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">cats \u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마법의 동물\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">magical \u003c/span>\u003cspan class=\"tgt\">creatures\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이집트인들은 고양이가 마법의 동물이라고 믿었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 고양이를 반려동물로 키웠다는 사실에 이어, 그 이유가 되는 이집트인들의 \u003cb class=\"key\">믿음\u003c/b>을 제시합니다. 고양이는 단순한 동물이 아니라 초자연적인 힘을 가진 존재로 여겨졌다는 뜻으로, 뒤에 나올 행운·보석·음식 같은 대접의 근거가 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that의 생략(목적어 명사절)\u003c/span> : believe + [(that) + 주어 + 동사 ~] : \"고양이가 ~라고 믿었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">목적어 역할을 하는 명사절\u003c/span> : [타동사] + [주어 + 동사 + 목적격 보어] (명사절) : \"고양이가 마법의 동물이라고\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Egyptians believed, 이집트인들은 믿었다. cats were, 고양이는 ~이었다고. magical creatures, 마법의 동물. 이 문장 전체를 해석하면, 이집트인들은 고양이가 마법의 동물이라고 믿었다.","hl":"m"},{"n":19,"text":"이 문장은 앞에서 고양이를 반려동물로 키웠다는 이야기에 이어, 그 이유가 되는 이집트인들의 믿음을 보여 줍니다. 고양이가 그냥 평범한 동물이 아니라 초자연적인 힘을 가진 존재로 여겨졌다는 거죠. 그래서 뒤에 행운이라든가 보석, 좋은 음식 같은 대접 이야기가 이어지는 겁니다.","hl":"mn"},{"n":20,"text":"첫 번째로 believed와 cats were 사이를 잘 보세요. 여기에는 접속사 that이 생략되어 있습니다. 두 번째로 cats were magical creatures 전체가 believed의 목적어 역할을 하는 명사절이에요. 절 전체를 목적어로 받으니까 '고양이가 마법의 동물이라고'라는 뜻으로 해석되는 겁니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 생각했다\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">thought \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고양이가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> cats\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">행운을 가져다준다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">brought \u003c/span>\u003cspan class=\"tgt\">good \u003c/span>\u003cspan class=\"tgt\">luck\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 고양이가 행운을 가져다준다고 생각했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 이집트인들이 고양이를 특별하게 여긴 이유를 구체적으로 밝혀 줘요. 앞 문장에서 고양이를 \u003cb class=\"key\">마법의 \u003c/b>\u003cb class=\"key\">존재\u003c/b>라고 했는데, 그 믿음의 내용이 바로 \u003cb class=\"key\">행운\u003c/b>을 가져다준다는 것이었죠. that절이 '생각한 내용'을 통째로 채우는 구조입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 명사절(목적어)\u003c/span> : think + [that + 주어 + 동사 (명사절/목적어)] : \"~라고 생각했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">시제 일치(과거 → 과거)\u003c/span> : 주절 동사(과거) + that절 동사(과거형) : \"행운을 가져다주었다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"They thought, 그들은 생각했다. that cats, 고양이가. brought good luck, 행운을 가져다준다고. 이 문장 전체를 해석하면, 그들은 고양이가 행운을 가져다준다고 생각했다.","hl":"m"},{"n":22,"text":"이 문장은 이집트인들이 고양이를 왜 특별하게 여겼는지 그 이유를 알려 줘요. 바로 고양이가 행운을 가져다준다고 믿었기 때문이죠. 앞에서 고양이를 마법의 존재라고 했는데, 그 믿음이 구체적으로는 행운이라는 모습으로 나타난 거예요.","hl":"mn"},{"n":23,"text":"먼저, thought 뒤에 that이 나오면 '~라고'라는 뜻으로 생각의 내용을 채우는 명사절이 시작돼요. 이 명사절은 통째로 think의 목적어절 역할을 하니까 해석할 때 that을 따로 옮기지 않아요. 그리고 주절 동사가 과거인 thought이기 때문에 that절 안의 동사도 시제 일치에 따라 brought로 과거를 써 준다는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고양이들에게 경의를 표하기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">To \u003c/span>\u003cspan class=\"tgt\">honor \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">cats\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">부유한 가정은\u003c/span>\u003cspan class=\"en\">rich families\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보석을 걸어 주었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">put \u003c/span>\u003cspan class=\"tgt\">jewelry \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들에게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">them\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">고양이들에게 경의를 표하기 위해, 부유한 가정은 그들에게 보석을 걸어 주었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 '행운을 가져다준다'는 믿음이 실제 행동으로 이어진 예를 보여 줘요. \u003cb class=\"key\">부유한 \u003c/b>\u003cb class=\"key\">가정\u003c/b>이 고양이에게 보석을 걸어 준 것은 고양이에게 \u003cb class=\"key\">경의\u003c/b>를 표하는 방식이었죠. 목적을 나타내는 to부정사구가 문장 앞에서 이유를 먼저 제시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : To + [동사원형] + 목적어, 주어 + 동사 ~ (목적의 to부정사구) : \"고양이들에게 경의를 표하기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">3단 변화가 같은 불규칙 동사(put-put-put)\u003c/span> : put(현재) - put(과거) - put(과거분사) : \"걸어 주었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">put + 목적어 + 전치사구\u003c/span> : put + [목적어] + [전치사구(on/to/into ...)] : \"그들에게 보석을 걸어 주었다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"To honor the cats, 고양이들에게 경의를 표하기 위해. rich families, 부유한 가정은. put jewelry, 보석을 걸어 주었다. on them, 그들에게. 이 문장 전체를 해석하면, 고양이들에게 경의를 표하기 위해, 부유한 가정은 그들에게 보석을 걸어 주었다.","hl":"m"},{"n":25,"text":"이 문장은 앞에서 말한 행운에 대한 믿음이 실제 행동으로 이어진 모습을 보여 줘요. 부유한 가정이 고양이에게 보석을 걸어 준 것은 고양이에게 경의를 표하는 방식이었죠. 그래서 고양이는 그냥 동물이 아니라 대접받는 존재였다는 흐름이 이어져요.","hl":"mn"},{"n":26,"text":"먼저 문장 앞에 온 to honor는 '~하기 위해'라는 목적을 나타내는 to부정사예요. 뒤에 오는 전체 행동의 이유를 미리 던져 주는 거죠. 그리고 put은 현재, 과거, 과거분사가 모두 똑같은 불규칙 동사라서 여기서는 형태는 그대로지만 과거로 해석해요. 마지막으로 put은 목적어와 전치사구를 함께 데리고 와서 put A on B, 즉 무언가를 어딘가에 걸다라는 관용 패턴을 만들어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 또한 주었다\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">also\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">gave \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고품질의 음식을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">high-quality \u003c/span>\u003cspan class=\"tgt\">food \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고양이들에게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">cats\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">자신들은 또한 고양이들에게 고품질의 음식을 주었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 고양이를 특별하게 대우한 예를 하나 더 제시하는 문장이에요. 앞 문장의 보석에 이어 \u003cb class=\"key\">고품질의 \u003c/b>\u003cb class=\"key\">음식\u003c/b>까지 주었다는 사실로 고양이에 대한 \u003cb class=\"key\">경의\u003c/b>가 얼마나 컸는지 보여 줍니다. give가 '사물 + to + 사람' 순서로 재배열된 형태입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">첨가의 부사 위치\u003c/span> : 주어 + [also] + 일반동사 ~ : \"또한\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">4형식의 3형식 전환(give + 직접목적어 + to + 간접목적어)\u003c/span> : give + [사물(직접목적어)] + to + [사람(간접목적어)] : \"고양이들에게 고품질의 음식을 주었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">복합형용사에 의한 명사 수식\u003c/span> : [형용사 + 명사] + 명사 (하이픈으로 연결된 복합형용사) : \"고품질의 음식\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"They also gave, 그들은 또한 주었다. high-quality food, 고품질의 음식을. to the cats, 고양이들에게. 이 문장 전체를 해석하면, 자신들은 또한 고양이들에게 고품질의 음식을 주었다.","hl":"m"},{"n":28,"text":"이 문장은 고양이를 특별하게 대우한 예를 하나 더 보여 줘요. 앞에서 보석을 걸어 주었다고 했는데, 여기서는 고품질의 음식까지 주었다고 말하죠. 이런 예들이 쌓이면서 고양이가 이집트인들에게 얼마나 중요한 존재였는지가 분명해져요.","hl":"mn"},{"n":29,"text":"먼저 give는 원래 사람에게 사물을 주는 4형식 동사인데, 여기서는 사물을 먼저 말하고 사람 앞에 to를 붙인 3형식으로 바뀌었어요. 다음으로 high-quality는 high와 quality가 하이픈으로 묶여 하나의 형용사처럼 food를 꾸미는 표현이고, 이때는 단수 형태를 그대로 쓴다는 규칙이 있어요. 마지막으로 also는 '또한'이라는 첨가의 의미를 더하는 부사인데, 일반동사 앞에 놓인다는 위치까지 함께 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고양이는\u003c/span>\u003cspan class=\"en\">Cats\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">중요한 부분이었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">important \u003c/span>\u003cspan class=\"tgt\">part \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고대 이집트 생활의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">ancient \u003c/span>\u003cspan class=\"tgt\">Egyptian \u003c/span>\u003cspan class=\"tgt\">life\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">고양이는 고대 이집트 생활의 중요한 부분이었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 말한 고양이에 대한 대접과 믿음을 한 줄로 묶어 주는 \u003cb class=\"key\">요약\u003c/b> 문장이에요. 고양이가 그냥 기르는 동물이 아니라 이집트인들의 \u003cb class=\"key\">일상\u003c/b> 깊숙이 자리 잡은 존재였음을 알려 주죠. 그래서 뒤에 이어지는 \u003cb class=\"key\">법\u003c/b>으로 보호하고 애도하는 이야기의 근거가 되어 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사 + 명사 보어(주격 보어)\u003c/span> : Cats(주어) + were(be동사) + [an important part of ~ (명사구/주격보어)] : \"고대 이집트 생활의 중요한 부분이었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 of를 포함한 덩어리 표현\u003c/span> : an important part + of + [명사(구)] : \"~의 중요한 부분\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Cats, 고양이는. were an important part, 중요한 부분이었다. of ancient Egyptian life, 고대 이집트 생활의. 이 문장 전체를 해석하면, 고양이는 고대 이집트 생활의 중요한 부분이었다.","hl":"m"},{"n":31,"text":"이 문장은 앞에서 이야기한 고양이 대접을 한 줄로 묶어 주는 요약 문장이에요. 고양이가 고대 이집트인들의 일상에서 아주 중요한 존재였다는 거죠. 그래서 뒤에 법으로 보호하고 애도하는 이야기가 자연스럽게 이어집니다.","hl":"mn"},{"n":32,"text":"첫 번째, be동사 were 뒤에 명사구가 와서 주어 Cats의 정체를 설명하고 있어요. 주격 보어 자리라고 기억해 두세요. 두 번째, an important part of는 '~의 중요한 부분'이라는 하나의 덩어리 표현이에요. of 뒤에는 전체가, 앞에는 그 일부가 온다고 정리해 두면 좋아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고양이들이 죽었을 때,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">cats \u003c/span>\u003cspan class=\"tgt\">died\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 주인들은\u003c/span>\u003cspan class=\"en\">their owners\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 눈썹을 밀곤 했다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">shave\u003c/span> their eyebrows.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">고양이들이 죽었을 때, 그들의 주인들은 그들의 눈썹을 밀곤 했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 고양이가 죽었을 때 이집트인들이 얼마나 \u003cb class=\"key\">깊은 \u003c/b>\u003cb class=\"key\">상실감\u003c/b>을 느꼈는지 보여 주는 문장이에요. 눈썹을 미는 행동은 우리에게는 낯설지만, 그들에게는 \u003cb class=\"key\">공식적인 \u003c/b>\u003cb class=\"key\">애도\u003c/b> 방식이었죠. 바로 다음 문장과 이어지면서 \u003cb class=\"key\">슬픔의 \u003c/b>\u003cb class=\"key\">기간\u003c/b>을 설명하게 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간을 나타내는 접속사 when의 부사절\u003c/span> : When + [주어 + 동사](부사절) + [주어 + 동사](주절) : \"고양이들이 죽었을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">would + 동사원형 (과거의 습관)\u003c/span> : would + [동사원형] : \"밀곤 했다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"When cats died, 고양이들이 죽었을 때. their owners, 그들의 주인들은. would shave their eyebrows, 그들의 눈썹을 밀곤 했다.. 이 문장 전체를 해석하면, 고양이들이 죽었을 때, 그들의 주인들은 그들의 눈썹을 밀곤 했다.","hl":"m"},{"n":34,"text":"이 문장은 고양이가 죽었을 때 사람들이 얼마나 큰 상실감을 느꼈는지 보여 줘요. 눈썹을 미는 행동은 우리에게는 낯설지만 그들에게는 공식적인 애도 방식이었죠. 바로 다음 문장과 이어지면서 슬픔의 기간을 설명하게 됩니다.","hl":"mn"},{"n":35,"text":"첫 번째, When cats died는 '~할 때'라는 시간을 알려 주는 부사절이에요. 부사절이 앞에 오면 뒤에 쉼표를 찍어 주절과 나눠 준다는 것도 같이 기억해요. 두 번째, would shave는 would에 동사원형이 붙어서 과거에 되풀이된 습관을 나타내요. 그래서 '밀곤 했다'라는 과거의 의미로 해석하는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은\u003c/span>\u003cspan class=\"en\">They\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">슬픔을 드러냈다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">showed \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">sadness\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 눈썹이 다시 자랄 때까지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">until \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">eyebrows \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">grew \u003c/span>\u003cspan class=\"tgt\">back\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 눈썹이 다시 자랄 때까지 슬픔을 드러냈다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 눈썹 미는 행동이 언제까지 이어졌는지 알려 주는 문장이에요. 눈썹이 다시 자랄 때까지 슬픔을 드러냈다는 것은 애도의 \u003cb class=\"key\">기간\u003c/b>이 꽤 길었다는 뜻이죠. 결국 고양이가 그들에게 얼마나 \u003cb class=\"key\">특별한 \u003c/b>\u003cb class=\"key\">존재\u003c/b>였는지를 다시 한 번 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">3형식 문장(과거 시제)\u003c/span> : They(주어) + showed(타동사) + their sadness(목적어) : \"그들은 슬픔을 드러냈다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 until (계속 ~할 때까지)\u003c/span> : [주어 + 동사] + until + [주어 + 동사](부사절) : \"그들의 눈썹이 다시 자랄 때까지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">grow의 과거형 + 부사 back\u003c/span> : grow(자동사) + back(부사) = 다시 자라다 : \"다시 자랐다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"They, 그들은. showed their sadness, 슬픔을 드러냈다. until their eyebrows grew back, 그들의 눈썹이 다시 자랄 때까지. 이 문장 전체를 해석하면, 그들은 눈썹이 다시 자랄 때까지 슬픔을 드러냈다.","hl":"m"},{"n":37,"text":"이 문장은 앞 문장에서 눈썹을 미는 행동이 언제까지 이어졌는지 알려 줘요. 눈썹이 다시 자랄 때까지 슬픔을 드러냈다는 건 애도의 기간이 꽤 길었다는 뜻이죠. 그래서 고양이가 얼마나 특별한 존재였는지가 다시 한 번 강조됩니다.","hl":"mn"},{"n":38,"text":"첫 번째, until은 앞의 동작이 끝나는 시점을 알려 주는 접속사예요. '~할 때까지'로 해석하고 뒤에는 절이 온다고 정리해 두세요. 두 번째, grew back은 grow의 과거형에 back이 붙어서 다시 자라다, 원래대로 되돌아오다는 뜻이 돼요. 세 번째, showed는 show의 과거 시제로, 타동사라서 뒤에 목적어 their sadness가 와요. 과거 시제 표시도 놓치지 마세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고대 이집트인들은\u003c/span>\u003cspan class=\"en\">The ancient Egyptians\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고양이를 보호했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">protected \u003c/span>\u003cspan class=\"tgt\">cats\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">심지어 법으로(까지)\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">even \u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">law\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">고대 이집트인들은 심지어 법으로 고양이를 보호했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 고양이 보호가 개인 차원을 넘어 \u003cb class=\"key\">법\u003c/b>이라는 제도로까지 이어졌음을 말합니다. even은 '심지어'라는 뜻으로 보호의 강도를 \u003cb class=\"key\">강조\u003c/b>합니다. 앞 문장에서 슬퍼하는 모습을 보여 줬다면, 여기서는 사회 전체가 고양이를 지켰다는 점이 드러납니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">3형식(타동사+목적어)\u003c/span> : protect + [목적어 cats] = 고양이를 보호하다 : \"고양이를 보호했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">강조 부사 even + 전치사 by(수단)\u003c/span> : even + [by + 명사] = 심지어 ~에 의해서까지 : \"심지어 법으로(까지)\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"The ancient Egyptians, 고대 이집트인들은. protected cats, 고양이를 보호했다. even by law, 심지어 법으로(까지). 이 문장 전체를 해석하면, 고대 이집트인들은 심지어 법으로 고양이를 보호했다.","hl":"m"},{"n":40,"text":"이 문장은 고양이 보호가 개인 차원을 넘어 법이라는 제도로까지 이어졌다는 뜻이에요. even은 심지어라는 뜻으로 보호의 강도를 강조하죠. 앞 문장에서는 슬퍼하는 모습을 보여 줬는데, 여기서는 사회 전체가 고양이를 지켰다는 점이 드러납니다.","hl":"mn"},{"n":41,"text":"여기서는 두 가지를 짚을게요. 먼저 protected cats에서 protect는 타동사라서 뒤에 목적어인 cats가 반드시 필요해요. 그래서 고양이를 보호하다라는 뜻이 되죠. 그리고 even by law에서 even은 뒤에 오는 표현을 강조하고, by는 수단을 나타내는 전치사라서 법에 의해서라는 뜻을 만들어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람이 고양이를 죽였을 때,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">human \u003c/span>\u003cspan class=\"tgt\">killed \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">cat\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 사람은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">she \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또한 죽임을 당했다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">killed\u003c/span>, \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">too\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사람이 고양이를 죽였을 때, 그 사람 또한 죽임을 당했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 법이 실제로 얼마나 엄격했는지 구체적 사례로 보여 주는 문장입니다. 고양이를 죽인 사람은 똑같이 \u003cb class=\"key\">죽임을 \u003c/b>\u003cb class=\"key\">당했다\u003c/b>는 점에서, 고양이 목숨이 사람 목숨과 같은 무게로 여겨졌음을 알 수 있습니다. he or she는 성별과 상관없이 \u003cb class=\"key\">모든 \u003c/b>\u003cb class=\"key\">사람\u003c/b>을 가리키는 표현입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간 부사절 접속사 When\u003c/span> : When + [주어 + 동사], [주절] = ~했을 때 : \"사람이 고양이를 죽였을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태(과거시제)\u003c/span> : [주어] + was + [과거분사 killed] = ~는 죽임을 당했다 : \"그 사람은 죽임을 당했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">첨가의 부사 too\u003c/span> : [긍정문] + too = 또한 ~도 : \"또한\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"When a human killed a cat, 사람이 고양이를 죽였을 때. he or she, 그 사람은. was killed, too, 또한 죽임을 당했다.. 이 문장 전체를 해석하면, 사람이 고양이를 죽였을 때, 그 사람 또한 죽임을 당했다.","hl":"m"},{"n":43,"text":"이 문장은 법이 실제로 얼마나 엄격했는지 구체적인 사례로 보여 줘요. 고양이를 죽인 사람은 똑같이 죽임을 당했다는 점에서 고양이 목숨이 사람 목숨과 같은 무게로 여겨졌다는 걸 알 수 있죠. he or she는 성별과 상관없이 모든 사람을 가리키는 표현이에요.","hl":"mn"},{"n":44,"text":"첫 번째로 When a human killed a cat에서 When은 시간을 나타내는 부사절을 이끌어요. 절 안에는 주어 a human과 동사 killed가 제대로 갖춰져 있죠. 두 번째로 he or she was killed는 주어가 죽이는 쪽이 아니라 죽임을 당하는 쪽이라서 수동태를 쓴 거예요. 세 번째로 too는 앞의 내용에 같은 상황을 첨가해서 그 사람도 똑같이라는 뜻을 더해 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고양이들은\u003c/span>\u003cspan class=\"en\">Cats \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">분명히\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">clearly\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단지 반려동물 그 이상이었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">just \u003c/span>\u003cspan class=\"tgt\">pets\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들에게는.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">them\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들에게 고양이들은 분명히 반려동물 그 이상이었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 지문 전체를 정리하는 마무리 문장입니다. more than just pets는 '단지 반려동물 그 이상'이라는 뜻으로, 고양이가 \u003cb class=\"key\">반려동물\u003c/b>을 넘어 신성한 존재이자 법의 보호 대상이었음을 압축합니다. to them은 '그들(고대 이집트인들)에게는'이라는 뜻으로 \u003cb class=\"key\">판단의 \u003c/b>\u003cb class=\"key\">기준\u003c/b>을 제시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부사 clearly의 위치\u003c/span> : be동사 + [부사 clearly] + [형용사/명사구] : \"분명히 ~이었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">비교급 more than (~보다 더, ~ 이상)\u003c/span> : more than + [명사] = ~ 그 이상 : \"단지 반려동물 그 이상\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 to (판단의 기준, 입장)\u003c/span> : more than ~ + to + [사람] = 그들에게 ~ 이상 : \"그들에게는\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"Cats were, 고양이들은. clearly, 분명히. more than just pets, 단지 반려동물 그 이상이었다. to them, 그들에게는.. 이 문장 전체를 해석하면, 그들에게 고양이들은 분명히 반려동물 그 이상이었다.","hl":"m"},{"n":46,"text":"이 문장은 지문 전체를 정리하는 마무리 문장이에요. more than just pets는 단지 반려동물 그 이상이라는 뜻으로, 고양이가 반려동물을 넘어 신성한 존재이자 법의 보호 대상이었다는 걸 압축해서 보여 주죠. to them은 그들인 고대 이집트인들에게는이라는 뜻으로 판단의 기준을 제시해요.","hl":"mn"},{"n":47,"text":"첫 번째로 more than just pets에서 more than은 원래 비교 표현이지만 여기서는 그것을 넘어서는이라는 뜻으로 쓰였어요. just는 단지라는 뜻으로 범위를 한정해 주고요. 두 번째로 to them에서 to는 입장이나 판단의 기준을 나타내는 전치사라서 그들에게 있어서라는 뜻을 만들어요. 세 번째로 clearly는 부사로 be동사 뒤에 놓여서 분명히라는 확신을 강조합니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>고대 이집트인들에게 고양이는 가장 \u003cb class=\"key\">특별한 \u003c/b>\u003cb class=\"key\">동물\u003c/b>이었고, 처음으로 \u003cb class=\"key\">반려동물\u003c/b>로 키워졌다.\u003c/li>\u003cli>이집트인들은 고양이를 \u003cb class=\"key\">마법의 \u003c/b>\u003cb class=\"key\">동물\u003c/b>로 믿어 행운을 가져다준다고 생각했다.\u003c/li>\u003cli>부유한 가정은 보석과 고품질의 음식으로 고양이에게 \u003cb class=\"key\">경의\u003c/b>를 표했고, 고양이는 고대 이집트 생활의 중요한 부분이었다.\u003c/li>\u003cli>고양이가 죽으면 주인들은 눈썹을 밀며 \u003cb class=\"key\">슬픔\u003c/b>을 드러냈고, 고양이는 \u003cb class=\"key\">법\u003c/b>으로 보호될 만큼 반려동물 그 이상이었다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>For ancient Egyptians, cats were revered as magical luck-bringing creatures and were protected by law, making them far more than just pets.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">고대 이집트인들은 고양이를 \u003cb class=\"key\">특별한 \u003c/b>\u003cb class=\"key\">동물\u003c/b>로 여겨 반려동물로 키웠고, 고양이가 \u003cb class=\"key\">마법의 \u003c/b>\u003cb class=\"key\">동물\u003c/b>로서 행운을 가져다준다고 믿었다. 고양이는 보석과 고품질의 음식으로 경의를 받았고 법으로 보호될 만큼 고대 이집트 생활의 \u003cb class=\"key\">중요한 \u003c/b>\u003cb class=\"key\">부분\u003c/b>이었다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":48,"text":"오늘 글에서 고양이는 고대 이집트인들에게 가장 특별한 동물이자 마법의 동물이었어요. 사람들은 고양이에게 경의를 표했고 법으로 보호했으며, 죽었을 때는 진심으로 슬퍼했죠. 결국 고양이는 단순한 반려동물이 아니라 반려동물 그 이상이었습니다. 이 구조와 어휘를 복습하며 오늘 수업을 마무리할게요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
