<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터1 Reading 05 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터1 Reading 05","audioDir":"reading05_audio","preview":false,"count":58,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.668em\">Reading\u003cbr>05\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터1\u003c/div>\u003ch1>Space Food: How Astronauts Eat in Space\u003c/h1>\u003ch2>우주 음식: 우주비행사들은 우주에서 어떻게 먹을까\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>우주비행사들은 지구에서처럼 하루 세 끼를 먹지만, 우주선에는 \u003cb class=\"key\">냉장고\u003c/b>가 없어 모든 음식이 \u003cb class=\"key\">포장\u003c/b>된 형태로 보관된다. \u003cb class=\"key\">오븐\u003c/b>으로 음식을 데울 수 있고 소금은 \u003cb class=\"key\">액체\u003c/b>로, 소스는 \u003cb class=\"key\">튜브\u003c/b>에 담겨 나오며, 이런 다양한 우주 음식 덕분에 우주비행사들은 우주에서도 \u003cb class=\"key\">건강\u003c/b>을 유지한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Since a spacecraft has no refrigerator, all space food comes in packets, but with an oven, liquid salt, and tube sauces, astronauts can eat various foods and stay healthy in space.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 우주비행사들이 우주에서 무엇을 어떻게 먹는지 다룬 글이에요. 캠핑 갈 때 음식 챙기는 이야기에서 시작해서, 우주 음식의 종류와 조리, 보관 방법, 그리고 양념까지 차례로 설명하고 있죠. 요약하면 우주선에는 냉장고가 없어서 모든 음식이 포장된 형태로 오고, 오븐과 액체 소금, 튜브 소스 덕분에 우주비행사들이 우주에서도 건강을 유지한다는 내용이에요. 그럼 함께 시작해 볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">우주는 \u003cb class=\"key\">무중력\u003c/b>(microgravity) 상태라서 지구에서 당연하게 여기는 것들이 모두 달라져요. 음식 부스러기나 액체 방울은 아래로 떨어지지 않고 그냥 떠다니기 때문에, 우주 음식은 부스러기가 적고 한 번에 먹기 좋은 형태로 개발됩니다. 또 우주선 안에서는 무게와 부피를 줄이는 것이 중요해서 물기를 뺀 \u003cb class=\"key\">건조식\u003c/b>(dried food)이 기본이 되고, 통조림처럼 오래 보관되는 식품도 많이 쓰여요. 지구의 캠핑과 비슷하다고 생각하면 이해가 쉬운데, 짐을 최대한 줄이고 상하지 않는 음식 위주로 챙기는 것과 같은 원리예요. \u003cb class=\"key\">냉장고\u003c/b>(refrigerator) 같은 냉장 설비는 전력과 공간을 많이 차지해서 초기 우주선에는 없었고, 그래서 음식을 작은 \u003cb class=\"key\">포장\u003c/b>(packet) 단위로 나누어 쉽게 보관합니다. 소금이나 소스처럼 흩날리기 쉬운 양념은 \u003cb class=\"key\">액체\u003c/b>나 \u003cb class=\"key\">튜브\u003c/b>(tube) 형태로 만들어 안전하게 사용해요.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식부터 짚어 볼게요. 우주는 무중력 상태라서 음식 부스러기나 액체 방울이 아래로 떨어지지 않고 그냥 떠다녀요. 그래서 우주 음식은 부스러기가 적고 한 번에 먹기 좋은 형태로 만들어지고, 물기를 뺀 건조식이 기본이 됩니다. 여러분이 캠핑 갈 때 짐을 줄이고 상하지 않는 음식 위주로 챙기는 것과 똑같은 원리예요. 냉장고 같은 설비는 전력과 공간을 많이 차지해서 초기 우주선에는 없었고, 그래서 음식을 작은 포장 단위로 나누어 쉽게 보관했어요. 소금이나 소스처럼 흩날리기 쉬운 양념은 액체나 튜브 형태로 만들어 안전하게 사용한답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>캠핑 비유로 시작\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>글은 캠핑을 갈 때 반드시 충분한 \u003cb class=\"key\">음식\u003c/b>을 챙긴다는 일상적인 상황에서 출발해요. 이어서 우주비행사들도 우주에 갈 때 똑같이 음식을 준비한다고 말하며 \u003cb class=\"key\">우주 \u003c/b>\u003cb class=\"key\">음식\u003c/b>이라는 화제로 자연스럽게 넘어갑니다. 익숙한 캠핑에 빗대어 설명하니 독자가 부담 없이 글에 들어갈 수 있어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>하루 세 끼, 다양한 음식\u003csmall>예시 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>우주비행사들도 지구에서와 마찬가지로 하루 \u003cb class=\"key\">세 \u003c/b>\u003cb class=\"key\">끼\u003c/b>를 먹는다는 점이 먼저 제시돼요. 그리고 우주에는 그들을 위한 매우 \u003cb class=\"key\">다양한 \u003c/b>\u003cb class=\"key\">음식\u003c/b>이 있다는 사실이 이어지면서, 글의 초점이 음식의 종류로 옮겨갑니다. 지구의 식사 습관과 크게 다르지 않다는 공통점을 먼저 보여 준 셈이에요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>음식의 종류와 가열\u003csmall>근거 · 문장 6–9\u003c/small>\u003c/h4>\u003cp>구체적인 음식 목록이 나오는데, \u003cb class=\"key\">건조된 \u003c/b>\u003cb class=\"key\">음식\u003c/b>이 흔하고 통조림으로 된 감자와 고기도 있다고 해요. 우주선은 \u003cb class=\"key\">신선한 \u003c/b>\u003cb class=\"key\">과일과 \u003c/b>\u003cb class=\"key\">채소\u003c/b>도 어느 정도 저장할 수 있고, \u003cb class=\"key\">오븐\u003c/b>이 있어서 음식을 따뜻하게 만들 수도 있습니다. 즉 우주 음식은 종류가 다양할 뿐 아니라 데우기까지 가능하다는 점을 보여 줘요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>냉장고가 없다는 한계\u003csmall>전환 · 문장 10–11\u003c/small>\u003c/h4>\u003cp>그런데 여기서 \u003cb class=\"key\">냉장고\u003c/b>가 없다는 전환이 나옵니다. 그래서 모든 음식이 쉽게 보관할 수 있도록 \u003cb class=\"key\">포장\u003c/b>된 형태로 온다고 설명해요. 앞에서 다양한 음식과 오븐을 말한 뒤 한계를 제시하고, 그 한계에 대한 대응을 알려 주는 \u003cb class=\"key\">전환\u003c/b>의 흐름이에요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>액체 소금과 튜브 소스\u003csmall>결론 · 문장 12–15\u003c/small>\u003c/h4>\u003cp>냉장고가 없는 상황에서 양념은 어떻게 할까요. 소금은 \u003cb class=\"key\">액체\u003c/b>로 나오는데, 보통의 소금은 그냥 \u003cb class=\"key\">떠다니고\u003c/b> 말 것이기 때문이에요. 케첩, 머스타드, 마요네즈 같은 소스도 \u003cb class=\"key\">튜브\u003c/b>에 담겨 이용할 수 있고, 글은 이런 다양한 우주 음식 덕분에 우주비행사들이 우주에서 \u003cb class=\"key\">건강\u003c/b>하게 지낼 수 있다고 마무리합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 캠핑 비유에서 출발해 우주 음식의 종류, 조리, 보관, 양념 순서로 흘러가고 마지막에 결론을 맺는 구조예요.","hl":null},{"n":4,"text":"먼저 글은 캠핑을 갈 때 충분한 음식을 챙긴다는 익숙한 상황에서 출발해요. 그리고 우주비행사들도 우주에 갈 때 똑같이 음식을 준비한다고 말하면서 우주 음식이라는 화제로 넘어가죠. 일상적인 비유로 시작하니까 독자가 아주 편하게 글 속으로 들어올 수 있어요.","hl":"f0"},{"n":5,"text":"이어서 우주비행사들도 지구에서와 마찬가지로 하루 세 끼를 먹는다는 점이 나와요. 그리고 우주에는 그들을 위한 매우 다양한 음식이 있다는 말이 이어지면서 관심이 음식의 종류로 옮겨갑니다. 지구의 식사 습관과 크게 다르지 않다는 공통점을 먼저 보여 주는 거예요.","hl":"f1"},{"n":6,"text":"여기서 구체적인 음식 목록이 등장하는데, 건조된 음식이 흔하고 통조림으로 된 감자와 고기도 있다고 해요. 우주선은 신선한 과일과 채소도 어느 정도 저장할 수 있고, 오븐이 있어서 음식을 따뜻하게 만들 수도 있죠. 그러니까 종류도 다양하고 데우기까지 된다는 걸 알려 주는 부분이에요.","hl":"f2"},{"n":7,"text":"그런데 여기서 But, 냉장고가 없다는 이야기가 나옵니다. 그래서 모든 음식이 쉽게 보관할 수 있도록 포장된 형태로 온다고 설명하죠. 다양한 음식과 오븐을 말한 다음에 한계를 제시하고, 그 한계에 어떻게 대응하는지를 보여 주는 전환의 흐름이에요.","hl":"f3"},{"n":8,"text":"마지막으로 냉장고가 없을 때 양념은 어떻게 하는지가 나와요. 소금은 액체로 나오는데, 보통의 소금은 그냥 떠다니고 말 것이기 때문이죠. 케첩, 머스타드, 마요네즈 같은 소스도 튜브에 담겨 이용할 수 있고, 이런 다양한 우주 음식 덕분에 우주비행사들이 우주에서 건강하게 지낼 수 있다고 마무리해요.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">비교·대조와 예시를 통한 설명\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 15번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 우주 음식의 종류와 조리, 보관, 양념을 차례로 소개한 뒤 마지막 문장에서 \u003cb class=\"key\">건강 \u003c/b>\u003cb class=\"key\">유지\u003c/b>라는 결론을 제시해요. 주제를 처음에 못 박기보다 구체적인 사례를 쌓아 올린 끝에 \u003cb class=\"key\">결론\u003c/b>을 내는 \u003cb class=\"key\">미괄식\u003c/b> 구성입니다. 중간에 \u003cb class=\"key\">냉장고\u003c/b>가 없다는 정보를 넣어 오븐이 있다는 설명과 \u003cb class=\"key\">대조\u003c/b>를 이루고, 액체 소금과 튜브 소스 같은 사례가 그 한계를 어떻게 해결하는지 보여 줘요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Like on Earth (4)\u003c/b>\u003cspan>비교\u003c/span>\u003cb>also (9)\u003c/b>\u003cspan>추가\u003c/span>\u003cb>But (10)\u003c/b>\u003cspan>대조·전환\u003c/span>\u003cb>So (11)\u003c/b>\u003cspan>인과·결과\u003c/span>\u003cb>also (14)\u003c/b>\u003cspan>추가\u003c/span>\u003cb>With these various space foods (15)\u003c/b>\u003cspan>결론·요약\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">many different foods\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">dried food\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">canned potatoes and meats\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">fresh fruit and vegetables\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">food comes in packets\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">liquid salt\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">sauces in tubes\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">various space foods\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>우주선 안\u003c/th>\u003cth>지구에서\u003c/th>\u003c/tr>\u003ctr>\u003ctd>[[오븐]]이 있어 음식을 따뜻하게 할 수 있음\u003c/td>\u003ctd>다양한 조리 기구로 음식을 데움\u003c/td>\u003c/tr>\u003ctr>\u003ctd>[[냉장고]]가 없음\u003c/td>\u003ctd>냉장고로 신선식을 보관함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>소금이 [[액체]]로 나옴\u003c/td>\u003ctd>보통의 고체 소금을 뿌림\u003c/td>\u003c/tr>\u003ctr>\u003ctd>소스가 [[튜브]]에 담겨 있음\u003c/td>\u003ctd>병이나 통에 담긴 소스를 사용함\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글의 전개 방식은 비교와 대조, 그리고 예시를 함께 쓴 설명 방식이에요. 주제를 처음에 딱 정해 놓기보다 구체적인 사례를 차곡차곡 쌓아 올린 끝에 마지막 문장에서 건강 유지라는 결론을 내죠. 그래서 두괄식이 아니라 미괄식 구조로 보는 게 맞아요. 중간에 냉장고가 없다는 정보를 넣어서 오븐이 있다는 설명과 대조를 이루게 한 점도 눈여겨보세요.","hl":"ty"},{"n":10,"text":"신호어를 먼저 보면, 네 번째 문장의 Like on Earth는 지구와 우주를 비교한다는 신호예요. 열 번째 문장의 But은 오븐이 있다는 흐름을 냉장고가 없다는 쪽으로 뒤집는 전환이고, 열한 번째 문장의 So는 그래서 포장된 음식이 온다는 결과를 이끌어 내죠. 마지막 문장의 With these various space foods는 앞의 내용을 한데 묶어 결론으로 가는 요약 신호입니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>make sure\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>확실히 하다, 반드시 ~하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>enough\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>충분한\u003c/span>\u003c/div>\u003cdiv>\u003cb>astronaut\u003c/b>\u003cem>명사\u003c/em>\u003cspan>우주비행사\u003c/span>\u003c/div>\u003cdiv>\u003cb>prepare\u003c/b>\u003cem>동사\u003c/em>\u003cspan>준비하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>meal\u003c/b>\u003cem>명사\u003c/em>\u003cspan>(한 끼의) 식사\u003c/span>\u003c/div>\u003cdiv>\u003cb>dried\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>건조된\u003c/span>\u003c/div>\u003cdiv>\u003cb>common\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>흔한, 일반적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>canned\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>통조림으로 된\u003c/span>\u003c/div>\u003cdiv>\u003cb>spacecraft\u003c/b>\u003cem>명사\u003c/em>\u003cspan>우주선\u003c/span>\u003c/div>\u003cdiv>\u003cb>store\u003c/b>\u003cem>동사\u003c/em>\u003cspan>저장하다, 보관하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>fresh\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>신선한\u003c/span>\u003c/div>\u003cdiv>\u003cb>oven\u003c/b>\u003cem>명사\u003c/em>\u003cspan>오븐\u003c/span>\u003c/div>\u003cdiv>\u003cb>warm\u003c/b>\u003cem>동사\u003c/em>\u003cspan>따뜻하게 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>refrigerator\u003c/b>\u003cem>명사\u003c/em>\u003cspan>냉장고\u003c/span>\u003c/div>\u003cdiv>\u003cb>packet\u003c/b>\u003cem>명사\u003c/em>\u003cspan>(작은) 포장, 봉지\u003c/span>\u003c/div>\u003cdiv>\u003cb>storage\u003c/b>\u003cem>명사\u003c/em>\u003cspan>보관, 저장\u003c/span>\u003c/div>\u003cdiv>\u003cb>liquid\u003c/b>\u003cem>명사\u003c/em>\u003cspan>액체\u003c/span>\u003c/div>\u003cdiv>\u003cb>ordinary\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>보통의, 평범한\u003c/span>\u003c/div>\u003cdiv>\u003cb>float away\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>떠내려가다, 떠다니다\u003c/span>\u003c/div>\u003cdiv>\u003cb>sauce\u003c/b>\u003cem>명사\u003c/em>\u003cspan>소스\u003c/span>\u003c/div>\u003cdiv>\u003cb>mustard\u003c/b>\u003cem>명사\u003c/em>\u003cspan>머스타드\u003c/span>\u003c/div>\u003cdiv>\u003cb>mayonnaise\u003c/b>\u003cem>명사\u003c/em>\u003cspan>마요네즈\u003c/span>\u003c/div>\u003cdiv>\u003cb>available\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>이용할 수 있는, 구할 수 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>tube\u003c/b>\u003cem>명사\u003c/em>\u003cspan>튜브, 관\u003c/span>\u003c/div>\u003cdiv>\u003cb>various\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>다양한\u003c/span>\u003c/div>\u003cdiv>\u003cb>stay healthy\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>건강하게 지내다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"단어는 몇 개만 짚어 볼게요. spacecraft는 우주선, refrigerator는 냉장고, ordinary는 보통의라는 뜻이에요. store는 저장하다, available은 이용할 수 있는, various는 다양한이라는 의미로 꼭 기억해 두세요. float away는 떠다니다, 떠내려가다로 해석하면 됩니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">enough\u003c/b>\u003cspan class=\"m\">충분한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">sufficient\u003c/span>\u003cspan class=\"s\">adequate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">insufficient\u003c/span>\u003cspan class=\"a\">lacking\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">common\u003c/b>\u003cspan class=\"m\">흔한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">usual\u003c/span>\u003cspan class=\"s\">widespread\u003c/span>\u003cspan class=\"s\">prevalent\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">rare\u003c/span>\u003cspan class=\"a\">uncommon\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">store\u003c/b>\u003cspan class=\"m\">저장하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">keep\u003c/span>\u003cspan class=\"s\">hold\u003c/span>\u003cspan class=\"s\">save\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">discard\u003c/span>\u003cspan class=\"a\">remove\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">ordinary\u003c/b>\u003cspan class=\"m\">보통의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">normal\u003c/span>\u003cspan class=\"s\">regular\u003c/span>\u003cspan class=\"s\">usual\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">special\u003c/span>\u003cspan class=\"a\">extraordinary\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">various\u003c/b>\u003cspan class=\"m\">다양한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">diverse\u003c/span>\u003cspan class=\"s\">assorted\u003c/span>\u003cspan class=\"s\">different\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">same\u003c/span>\u003cspan class=\"a\">uniform\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">available\u003c/b>\u003cspan class=\"m\">이용할 수 있는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">accessible\u003c/span>\u003cspan class=\"s\">obtainable\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unavailable\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">fresh\u003c/b>\u003cspan class=\"m\">신선한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">new\u003c/span>\u003cspan class=\"s\">recent\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">stale\u003c/span>\u003cspan class=\"a\">old\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어도 정리해 볼게요. enough는 sufficient, adequate와 가깝고 반대는 insufficient예요. common은 usual, widespread와 같은 뜻이고 반대는 rare, uncommon이죠. ordinary는 normal, regular로 바꿔 쓸 수 있고 반대는 special, extraordinary예요. various는 diverse, assorted와 통하고 반대는 same, uniform이고요. 마지막으로 available은 accessible, obtainable과 가깝고 반대는 unavailable입니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 15\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">캠핑을 갈 때,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">go \u003c/span>\u003cspan class=\"tgt\">camping\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은 반드시 해야 한다\u003c/span>\u003cspan class=\"en\">you \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">sure \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">충분한 음식을 가지고 가는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">bring\u003c/span> enough food.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">캠핑을 갈 때, 여러분은 반드시 충분한 음식을 가지고 가야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글의 도입부에서 캠핑을 갈 때는 음식 준비가 필수라는 \u003cb class=\"key\">일반 \u003c/b>\u003cb class=\"key\">상식\u003c/b>을 꺼내 놓은 문장이에요. 이 익숙한 상황을 기준점으로 삼아, 뒤에 나오는 우주비행사 이야기와 \u003cb class=\"key\">비교\u003c/b>하려는 장치예요. make sure to는 '반드시 ~하다'라는 \u003cb class=\"key\">강한 \u003c/b>\u003cb class=\"key\">당위\u003c/b>를 담고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간 부사절 접속사 when\u003c/span> : When + [주어] + [동사] , + [주절] : \"캠핑을 갈 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">make sure + to부정사(관용 표현)\u003c/span> : make sure + [to bring (to부정사구)] : \"반드시 가지고 가도록 하다\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"When you go camping, 캠핑을 갈 때. you make sure, 여러분은 반드시 해야 한다. to bring enough food, 충분한 음식을 가지고 가는 것을. 이 문장 전체를 해석하면, 캠핑을 갈 때, 여러분은 반드시 충분한 음식을 가지고 가야 한다.","hl":"m"},{"n":14,"text":"이 문장은 글의 첫 문장이에요. 캠핑 갈 때 음식 챙기는 건 당연한 상식이죠. 그 익숙한 상황을 기준으로 삼아서, 다음에 나올 우주비행사 이야기와 비교하려는 준비 단계라고 보면 됩니다.","hl":"mn"},{"n":15,"text":"첫 번째로 when은 '~할 때'라는 시간의 뜻으로 절을 이끄는 접속사예요. 그래서 when you go camping 전체가 '캠핑을 갈 때'라는 시간 덩어리가 됩니다. 두 번째로 make sure to는 '반드시 ~하다'라는 관용 표현이에요. make sure 뒤에 to부정사가 붙어서 강한 당위를 만들어 낸다는 것, 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우주비행사들은\u003c/span>\u003cspan class=\"en\">Astronauts\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">같은 일을 한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">same \u003c/span>\u003cspan class=\"tgt\">thing\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 우주에 갈 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">go \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">space\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우주비행사들이 우주에 갈 때도 같은 일을 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 캠핑 상황을 \u003cb class=\"key\">그대로\u003c/b> 우주 상황에 옮겨 오는 문장이에요. do the same thing이 앞 내용을 통째로 받아 '음식을 챙긴다'는 행동을 \u003cb class=\"key\">반복\u003c/b>시키죠. 캠핑과 우주여행을 \u003cb class=\"key\">비교\u003c/b>하며 글의 화제를 우주로 옮기는 연결 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">대동사 do와 the same의 지시 용법\u003c/span> : do + [the same thing] (앞 문장의 동작을 대신 받는 do) : \"같은 일을 하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">시간 부사절 접속사 when\u003c/span> : when + [주어] + [동사] + [전치사구] : \"그들이 우주에 갈 때\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"Astronauts, 우주비행사들은. do the same thing, 같은 일을 한다. when they go to space, 그들이 우주에 갈 때. 이 문장 전체를 해석하면, 우주비행사들이 우주에 갈 때도 같은 일을 한다.","hl":"m"},{"n":17,"text":"이 문장은 앞에서 말한 캠핑 이야기를 우주로 옮겨 오는 다리 역할을 해요. 같은 일을 한다고 했으니, 우주비행사들도 음식을 챙긴다는 걸 자연스럽게 알 수 있죠. 캠핑과 우주여행을 비교하면서 글의 화제가 우주로 넘어갑니다.","hl":"mn"},{"n":18,"text":"첫 번째로 do는 앞 문장의 동작을 통째로 대신 받는 대동사예요. 그래서 do the same thing은 '앞에서 한 그 일을 똑같이 한다'는 뜻이 됩니다. 두 번째로 when they go to space에서 when은 또 한 번 시간의 부사절을 이끌고 있어요. 같은 모양의 when 절이 반복되면서 두 상황을 나란히 비교해 주는 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 준비한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">They\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">prepare \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">음식을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">food\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 음식을 준비한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 'same thing'이 구체적으로 무엇인지 \u003cb class=\"key\">풀어 \u003c/b>\u003cb class=\"key\">주는\u003c/b> 문장이에요. 우주비행사들이 하는 일이 바로 \u003cb class=\"key\">음식 \u003c/b>\u003cb class=\"key\">준비\u003c/b>라는 점을 짧게 확정 지어 줍니다. 이후 문장들에서 구체적인 우주 음식 목록이 이어지도록 \u003cb class=\"key\">발판\u003c/b>을 놓는 역할이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">대명사의 지시(문맥 지칭)\u003c/span> : They → [앞 문장의 Astronauts] : \"그들은 (우주비행사들은)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">타동사 prepare + 목적어\u003c/span> : prepare + [food (목적어)] : \"음식을 준비하다\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"They prepare, 그들은 준비한다. food, 음식을. 이 문장 전체를 해석하면, 그들은 음식을 준비한다.","hl":"m"},{"n":20,"text":"이 문장은 앞 문장에서 말한 same thing이 구체적으로 무엇인지 알려 줘요. 우주비행사들이 하는 일이 바로 음식 준비라는 걸 딱 정해 주는 거죠. 그래서 다음 문장부터 구체적인 우주 음식 이야기가 자연스럽게 이어집니다.","hl":"mn"},{"n":21,"text":"첫 번째로 They가 무엇을 가리키는지부터 잡아야 해요. 바로 앞 문장의 Astronauts, 즉 우주비행사들을 받는 대명사입니다. 두 번째로 prepare는 목적어를 바로 받는 타동사예요. 그래서 전치사 없이 prepare food라고 쓴 것이고, '~을 위해 준비하다'라고 할 때만 prepare for를 쓴다는 차이도 함께 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지구에서와 마찬가지로,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Like \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">Earth\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우주비행사들은 먹는다\u003c/span>\u003cspan class=\"en\">astronauts eat\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하루에 세 끼를.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">three \u003c/span>\u003cspan class=\"tgt\">meals \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">day\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">지구에서와 마찬가지로, 우주비행사들은 하루에 세 끼를 먹는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 우주비행사들도 지구에서처럼 음식을 준비한다고 했으니, 그 구체적인 식사 방식을 \u003cb class=\"key\">지구\u003c/b>와 비교해 설명하는 문장이에요. '하루에 세 끼'라는 \u003cb class=\"key\">빈도\u003c/b> 표현으로 규칙적인 식사를 보여 주고, 뒤에 나올 다양한 우주 음식 이야기로 넘어가는 \u003cb class=\"key\">도입\u003c/b> 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 like의 비교 용법\u003c/span> : Like + [명사(구)] (~와 마찬가지로) : \"지구에서와 마찬가지로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">빈도·단위를 나타내는 표현\u003c/span> : [수량] + [복수명사] + a day (하루에 ~번) : \"하루에 세 끼를\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"Like on Earth, 지구에서와 마찬가지로. astronauts eat, 우주비행사들은 먹는다. three meals a day, 하루에 세 끼를.. 이 문장 전체를 해석하면, 지구에서와 마찬가지로, 우주비행사들은 하루에 세 끼를 먹는다.","hl":"m"},{"n":23,"text":"앞에서 우주비행사들도 음식을 준비한다고 했죠. 이 문장은 그 식사 방식을 지구와 비교해서 설명하고 있어요. 하루에 세 끼라는 빈도 표현으로 규칙적으로 먹는다는 걸 보여 주고, 뒤에 나올 다양한 우주 음식 이야기로 넘어가는 도입 역할을 한답니다.","hl":"mn"},{"n":24,"text":"첫 번째 어법 포인트는 Like on Earth예요. 여기서 like는 동사가 아니라 전치사로 쓰여서 지구에서와 마찬가지로라는 뜻을 만들어 줘요. 두 번째는 three meals a day인데, a day가 하루에라는 뜻의 빈도 단위 표현이에요. 그래서 세 끼를 하루에, 즉 하루에 세 끼로 해석하면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">are\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 다양한 음식들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">many \u003c/span>\u003cspan class=\"tgt\">different \u003c/span>\u003cspan class=\"tgt\">foods\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우주비행사들을 위한\u003c/span>\u003cspan class=\"en\">for astronauts\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우주에는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">space\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우주에는 우주비행사들을 위한 많은 다양한 음식들이 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 우주에서 먹을 수 있는 음식의 \u003cb class=\"key\">종류\u003c/b>가 매우 다양하다는 것을 알려 주는 문장이에요. there are 구문으로 '~이 있다'를 자연스럽게 표현했고, 뒤 문장들에서 구체적인 \u003cb class=\"key\">예시\u003c/b>를 하나씩 꺼내기 위한 \u003cb class=\"key\">포괄적\u003c/b> 진술이라고 볼 수 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">유도부사 there + be동사 구문\u003c/span> : There + be동사 + [주어] (~이 있다) : \"있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수량 형용사 + 성질 형용사의 명사 수식\u003c/span> : [many] + [different] + [복수명사] : \"많은 다양한 음식들이\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 용법(장소)\u003c/span> : in + [장소명사] : \"우주에는\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"There are, 있다. many different foods, 많은 다양한 음식들이. for astronauts, 우주비행사들을 위한. in space, 우주에는. 이 문장 전체를 해석하면, 우주에는 우주비행사들을 위한 많은 다양한 음식들이 있다.","hl":"m"},{"n":26,"text":"이 문장은 우주에서 먹을 수 있는 음식의 종류가 매우 다양하다는 걸 알려 줘요. there are 구문으로 ~이 있다를 자연스럽게 표현했고, 뒤 문장들에서 구체적인 예시를 하나씩 꺼내기 위한 포괄적 진술이라고 보면 됩니다.","hl":"mn"},{"n":27,"text":"첫 번째는 There are예요. ~이 있다는 뜻을 만들 때 there를 앞에 세우고 be동사를 뒤따르게 하죠. 이때 진짜 주어는 be동사 뒤의 명사라서 many different foods가 복수라 are가 왔다는 점을 꼭 기억하세요. 두 번째는 many different foods인데, 수량 형용사 many와 성질 형용사 different가 함께 foods를 꾸며서 다양한이라는 의미를 더해 줘요. 세 번째는 in space로, 전치사 in이 장소의 범위를 나타내서 우주에는으로 해석됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">건조된 음식은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Dried \u003c/span>\u003cspan class=\"tgt\">food\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매우 흔하다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">very \u003c/span>\u003cspan class=\"tgt\">common\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">건조된 음식은 매우 흔하다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 여러 우주 음식 가운데 \u003cb class=\"key\">건조\u003c/b> 음식이 가장 흔한 종류라는 점을 짚어 주는 문장이에요. dried food처럼 \u003cb class=\"key\">과거분사\u003c/b>가 명사를 앞에서 꾸미면 '건조된'이라는 수동의 의미가 담기고, 이 문장이 뒤에 이어지는 \u003cb class=\"key\">저장\u003c/b> 방식 설명의 출발점이 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사의 명사 수식(형용사적 용법)\u003c/span> : [과거분사] + [명사] (수동·완료의 의미) : \"건조된 음식\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">2형식 문장(주격 보어)\u003c/span> : [주어] + be동사 + [주격 보어(형용사)] : \"매우 흔하다\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"Dried food, 건조된 음식은. is very common, 매우 흔하다.. 이 문장 전체를 해석하면, 건조된 음식은 매우 흔하다.","hl":"m"},{"n":29,"text":"이 문장은 여러 우주 음식 가운데 건조 음식이 가장 흔한 종류라는 점을 짚어 줘요. dried food처럼 과거분사가 명사를 꾸미면 건조된이라는 수동의 의미가 담기고, 이 문장이 뒤에 이어지는 저장 방식 설명의 출발점이 된답니다.","hl":"mn"},{"n":30,"text":"첫 번째 포인트는 Dried food예요. dry의 과거분사인 dried가 food 앞에서 형용사처럼 꾸며서 건조된 음식이라는 뜻을 만들어요. 두 번째는 is very common인데, 주어 Dried food의 상태를 설명하는 주격 보어 자리예요. very가 그 보어를 강조하고 있어서 건조된 음식은 매우 흔하다로 해석하면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">are\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">통조림으로 된 감자\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">canned\u003c/span> potatoes\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 고기\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">meats\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">통조림으로 된 감자와 고기가 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 우주 음식 중 \u003cb class=\"key\">통조림\u003c/b>으로 된 감자와 여러 종류의 고기가 있다는 뜻이에요. 앞에서 \u003cb class=\"key\">건조식품\u003c/b>이 흔하다고 한 뒤 구체적인 예를 보여 주는 문장이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">There is/are 존재 구문\u003c/span> : There + be동사 + [주어] : [주어]가 있다 : \"통조림으로 된 감자와 고기가 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사의 형용사적 용법\u003c/span> : [과거분사] + [명사] : ~된 [명사] : \"통조림으로 된\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">물질명사의 복수형\u003c/span> : [물질명사] + -s : 여러 종류의 ~ : \"여러 종류의 고기\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"There are, 있다. canned potatoes, 통조림으로 된 감자. and meats, 그리고 고기. 이 문장 전체를 해석하면, 통조림으로 된 감자와 고기가 있다.","hl":"m"},{"n":32,"text":"이 문장은 우주 음식 가운데 통조림으로 된 감자와 여러 종류의 고기가 있다는 걸 알려 줘요. 앞에서 건조식품이 흔하다고 했으니 이번에는 구체적인 예를 보여 주는 거죠. 그래서 우주에서도 다양한 식사가 가능하다는 흐름을 만들어요.","hl":"mn"},{"n":33,"text":"첫 번째로 There are는 존재 구문이에요. 뒤에 복수 주어가 와서 통조림으로 된 감자와 고기가 있다는 뜻을 만들어요. 두 번째로 canned는 과거분사가 형용사처럼 쓰여 통조림으로 된이라는 뜻을 더해 줘요. 세 번째로 meats는 고기를 여러 종류라는 의미로 복수형으로 쓴 가산화된 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우주선은\u003c/span>\u003cspan class=\"en\">A spacecraft\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저장할 수 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">store\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">약간의 신선한 과일\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">some\u003c/span> fresh \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">fruit \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 채소를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">vegetables\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우주선은 신선한 과일과 채소를 저장할 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 우주선이 신선한 과일과 채소를 \u003cb class=\"key\">저장\u003c/b>할 수 있다는 내용이에요. 가공식품을 소개한 뒤에도 \u003cb class=\"key\">신선한 \u003c/b>\u003cb class=\"key\">식품\u003c/b>을 어느 정도 보관할 수 있다는 점을 덧붙이는 문장이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 can + 동사원형\u003c/span> : can + [동사원형] : ~할 수 있다 : \"저장할 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">한정사 some의 용법\u003c/span> : some + [복수명사/불가산명사] : 약간의 ~ : \"약간의\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">명사 병렬 구조\u003c/span> : [명사 A] + and + [명사 B] : A와 B : \"과일과 채소\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"A spacecraft, 우주선은. can store, 저장할 수 있다. some fresh fruit, 약간의 신선한 과일. and vegetables, 그리고 채소를. 이 문장 전체를 해석하면, 우주선은 신선한 과일과 채소를 저장할 수 있다.","hl":"m"},{"n":35,"text":"이 문장은 우주선이 신선한 과일과 채소를 저장할 수 있다는 내용이에요. 가공식품을 소개한 뒤에도 신선한 식품을 어느 정도 보관할 수 있다는 점을 덧붙이는 거죠. 그래서 우주에서도 영양을 챙길 수 있다는 흐름으로 이어져요.","hl":"mn"},{"n":36,"text":"첫 번째로 can store는 조동사 can 뒤에 동사원형 store가 온 형태예요. 그래서 저장할 수 있다는 가능성의 뜻을 만들어요. 두 번째로 some은 복수명사나 불가산명사 앞에서 약간의라는 수량을 나타내요. 세 번째로 fruit and vegetables는 두 명사를 and로 연결한 병렬 구조예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또한 오븐이 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">is\u003c/span> also an oven\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우주선 안에는\u003c/span>\u003cspan class=\"en\">in a spacecraft\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그것은 음식을 따뜻하게 만들 수 있다\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">it\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">food \u003c/span>\u003cspan class=\"tgt\">warm\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우주선 안에는 오븐도 있고 그것은 음식을 따뜻하게 만들 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 우주선 안에 \u003cb class=\"key\">오븐\u003c/b>이 있어서 음식을 \u003cb class=\"key\">따뜻하게\u003c/b> 할 수 있다는 뜻이에요. 앞에서 여러 우주 음식을 소개한 뒤 조리와 가열이 가능하다는 점을 덧붙이는 문장이죠. 바로 뒤에는 \u003cb class=\"key\">냉장고\u003c/b>가 없다는 한계가 이어져요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">There is/are 존재 구문\u003c/span> : There + be동사 + [주어] : [주어]가 있다 : \"오븐이 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">대명사 it의 지시\u003c/span> : [앞의 명사] + it : 그것 : \"그것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">조동사 can + 5형식 make\u003c/span> : can + make + [목적어] + [형용사] : [목적어]를 [형용사]하게 만들 수 있다 : \"음식을 따뜻하게 만들 수 있다\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"There is also an oven, 또한 오븐이 있다. in a spacecraft, 우주선 안에는. and it can make food warm, 그리고 그것은 음식을 따뜻하게 만들 수 있다. 이 문장 전체를 해석하면, 우주선 안에는 오븐도 있고 그것은 음식을 따뜻하게 만들 수 있다.","hl":"m"},{"n":38,"text":"이 문장은 우주선 안에 오븐이 있어서 음식을 따뜻하게 할 수 있다는 걸 알려 줘요. 앞에서 여러 우주 음식을 소개한 뒤 조리와 가열이 가능하다는 점을 덧붙이는 거죠. 하지만 바로 다음에는 냉장고가 없다는 한계가 이어지니 함께 기억해 두세요.","hl":"mn"},{"n":39,"text":"첫 번째로 There is는 존재 구문이에요. 뒤에 an oven이 와서 오븐이 있다는 뜻을 만들어요. 두 번째로 it은 앞에 나온 an oven을 가리키는 대명사예요. 세 번째로 can make food warm은 조동사 can 뒤에 make가 오고 food가 목적어, warm이 목적격 보어로 쓰인 구조예요. 음식을 따뜻하게 만들 수 있다는 뜻이 되죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">But\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">냉장고가 없다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">no \u003c/span>\u003cspan class=\"tgt\">refrigerator\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 냉장고가 없다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 우주선에는 \u003cb class=\"key\">냉장고\u003c/b>가 없다는 점을 분명히 밝히는 문장이에요. 앞에서 오븐이 있다고 했지만 보관을 위한 냉장고는 없다는 \u003cb class=\"key\">대조\u003c/b>를 보여 주고, 다음 문장에서 모든 음식이 포장되는 이유로 이어져요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">등위접속사 But\u003c/span> : But + [문장] = 그러나 ~ : \"하지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">There is 구문과 no 부정\u003c/span> : There is + no + [명사] = [명사]가 없다 : \"냉장고가 없다\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"But, 하지만. there is no refrigerator, 냉장고가 없다.. 이 문장 전체를 해석하면, 하지만 냉장고가 없다.","hl":"m"},{"n":41,"text":"우주선에는 냉장고가 없다는 점을 분명히 말하는 문장이에요. 앞에서 오븐이 있다고 했지만 보관을 위한 냉장고는 없다는 대조를 보여 주고, 다음 문장에서 모든 음식이 포장되는 이유로 이어지죠.","hl":"mn"},{"n":42,"text":"첫 번째, But은 앞 내용과 대조되는 말을 이어 주는 등위접속사예요. 두 번째, there is no refrigerator는 There is 구문에 no가 붙어 냉장고가 없다는 부정의 뜻을 만들어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 15\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">So\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 음식은\u003c/span>\u003cspan class=\"en\">all the food\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">포장되어 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">comes \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">packets\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">쉽게 보관할 수 있도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">easy \u003c/span>\u003cspan class=\"tgt\">storage\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그래서 모든 음식은 쉽게 보관할 수 있도록 포장되어 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 냉장고가 없기 때문에 모든 음식이 \u003cb class=\"key\">포장된 \u003c/b>\u003cb class=\"key\">형태\u003c/b>로 제공된다는 것을 말해요. 앞 문장의 \u003cb class=\"key\">원인\u003c/b>과 이 문장의 결과를 So로 연결하며, 우주 음식 보관 방식의 핵심을 설명해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속부사 So(결과)\u003c/span> : So + [문장] = 그래서 ~ : \"그래서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 in + 복수명사(상태)\u003c/span> : come + in + [복수명사] = [명사]의 형태로 나오다 : \"포장된 형태로 나오다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 for의 목적\u003c/span> : for + [명사] = [명사]하기 위해 : \"쉽게 보관하기 위해\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"So, 그래서. all the food, 모든 음식은. comes in packets, 포장되어 있다. for easy storage, 쉽게 보관할 수 있도록. 이 문장 전체를 해석하면, 그래서 모든 음식은 쉽게 보관할 수 있도록 포장되어 있다.","hl":"m"},{"n":44,"text":"냉장고가 없기 때문에 모든 음식이 포장된 형태로 제공된다는 것을 말해요. 앞 문장의 원인과 이 문장의 결과를 So로 연결하며, 우주 음식 보관 방식의 핵심을 설명해요.","hl":"mn"},{"n":45,"text":"첫 번째, So는 앞 문장의 결과를 이끄는 접속부사예요. 두 번째, comes in packets는 물건이 어떤 형태나 상태로 존재한다는 걸 보여 줘요. 세 번째, for easy storage에서 for는 목적을 나타내고 뒤에 명사 storage가 왔어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">소금은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Salt\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나온다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">comes \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">액체로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">liquid\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">소금은 액체로 나온다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 우주에서는 소금이 일반 가루가 아니라 \u003cb class=\"key\">액체\u003c/b> 형태로 제공된다는 뜻이에요. 일반 소금은 \u003cb class=\"key\">중력\u003c/b>이 없으면 떠다니기 때문에 액체로 쓰는 것이라는 다음 문장의 설명으로 이어져요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">불가산명사\u003c/span> : [불가산명사] + 단수 동사 : \"소금은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 as(형태·자격)\u003c/span> : come + as + [명사] = [명사]로 나오다 : \"액체로 나온다\"\u003c/div>\u003c/div>","segs":[{"n":46,"text":"Salt, 소금은. comes, 나온다. as liquid, 액체로. 이 문장 전체를 해석하면, 소금은 액체로 나온다.","hl":"m"},{"n":47,"text":"우주에서는 소금이 액체 형태로 나와요. 일반 소금은 중력이 없으면 떠다니기 때문에 액체로 쓰는 거죠.","hl":"mn"},{"n":48,"text":"첫 번째, Salt는 셀 수 없는 불가산명사라서 관사 없이 쓰고 단수 취급해요. 두 번째, comes as liquid에서 as는 ‘~로서, ~의 형태로’라는 뜻으로 뒤에 명사 liquid를 받아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보통의 소금은\u003c/span>\u003cspan class=\"en\">Ordinary salt\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그냥\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">simply \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">떠다니고 말 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">float \u003c/span>\u003cspan class=\"tgt\">away\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">보통의 소금은 그냥 떠다니고 말 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 우주에서는 중력이 거의 없어서 소금 같은 가루가 접시에 담겨 있어도 그냥 \u003cb class=\"key\">떠다니게\u003c/b> 된다는 것을 보여 줍니다. 그래서 앞 문장에서 소금이 액체 상태로 온다고 설명한 이유가 여기서 드러납니다. 짧은 문장이지만 우주 환경의 \u003cb class=\"key\">특수성\u003c/b>을 강조하는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 would (현재 상황에 대한 강한 추측)\u003c/span> : [주어] + would + [부사] + [동사원형] : \"그냥 떠다니고 말 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">구동사(동사 + 부사)\u003c/span> : float(동사) + away(부사) = 떠서 멀리 가다 : \"떠다니다\"\u003c/div>\u003c/div>","segs":[{"n":49,"text":"Ordinary salt, 보통의 소금은. would simply, 그냥. float away, 떠다니고 말 것이다. 이 문장 전체를 해석하면, 보통의 소금은 그냥 떠다니고 말 것이다.","hl":"m"},{"n":50,"text":"여기서는 소금을 그냥 접시에 담아 두면 어떻게 되는지 상상해 보는 거예요. 우주에서는 중력이 거의 없어서 보통 소금은 그냥 떠다니고 말죠. 그래서 바로 앞 문장에서 소금이 액체로 온다고 했던 이유가 여기에 있는 거예요.","hl":"mn"},{"n":51,"text":"어법 포인트 첫 번째, would simply float away에서 would는 과거가 아니라 지금 상황에 대한 강한 추측을 나타내요. 두 번째, float away는 동사 float에 방향을 더하는 부사 away가 붙은 구동사로, 떠서 멀리 사라진다는 뜻이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">케첩, 머스타드, 마요네즈 같은 소스도\u003c/span>\u003cspan class=\"en\">Sauces \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">ketchup, \u003c/span>\u003cspan class=\"tgt\">mustard, \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">mayonnaise\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또한 이용할 수 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">also \u003c/span>\u003cspan class=\"tgt\">available\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">튜브에 넣어져\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">tubes\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">케첩, 머스타드, 마요네즈 같은 소스도 튜브에 넣어져 이용할 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 소금에 이어서 이번에는 소스 이야기입니다. 케첩이나 머스타드 같은 소스도 병이 아니라 \u003cb class=\"key\">튜브\u003c/b>에 담겨 와서 짜서 쓸 수 있다는 뜻이죠. 흘러내리기 쉬운 음식일수록 우주에서는 \u003cb class=\"key\">튜브 \u003c/b>\u003cb class=\"key\">포장\u003c/b>이 안전하다는 점을 알려 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 like(예시) + 명사 병렬\u003c/span> : [명사] + like + [명사 A], [명사 B], and [명사 C] : \"케첩, 머스타드, 마요네즈 같은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be동사 + 형용사 (서술적 용법)\u003c/span> : [주어] + be동사 + [형용사 available] : \"또한 이용할 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사구 (수단·상태)\u003c/span> : in + [명사] = ~에 담겨, ~의 형태로 : \"튜브에 넣어져\"\u003c/div>\u003c/div>","segs":[{"n":52,"text":"Sauces like ketchup, mustard, and mayonnaise, 케첩, 머스타드, 마요네즈 같은 소스도. are also available, 또한 이용할 수 있다. in tubes, 튜브에 넣어져. 이 문장 전체를 해석하면, 케첩, 머스타드, 마요네즈 같은 소스도 튜브에 넣어져 이용할 수 있다.","hl":"m"},{"n":53,"text":"소금 이야기에 이어서 소스 이야기가 나와요. 케첩이나 머스타드, 마요네즈 같은 소스도 병이 아니라 튜브에 담겨 와서 짜서 쓸 수 있다는 뜻이죠. 흘러내리기 쉬운 음식은 튜브에 담아야 안전하다는 걸 보여 주는 문장이에요.","hl":"mn"},{"n":54,"text":"어법 포인트 첫 번째, like는 좋아한다는 동사가 아니라 ~와 같은이라는 전치사로 앞의 sauces를 예시로 풀어 줍니다. 두 번째, 케첩, 머스타드, 마요네즈 세 명사가 and로 병렬 연결되어 있으니 같은 자격으로 나열된 걸 확인하세요. 세 번째, are also available은 be동사 뒤에 형용사 available이 와서 주어의 상태를 설명하는 서술적 용법이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 15 / 15\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 다양한 우주 음식들로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">With \u003c/span>\u003cspan class=\"tgt\">these \u003c/span>\u003cspan class=\"tgt\">various \u003c/span>\u003cspan class=\"tgt\">space \u003c/span>\u003cspan class=\"tgt\">foods\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우주비행사들은 건강하게 지낼 수 있다\u003c/span>\u003cspan class=\"en\">astronauts can \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">stay \u003c/span>\u003cspan class=\"tgt\">healthy\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우주에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">space\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이러한 다양한 우주 음식들로, 우주비행사들은 우주에서 건강하게 지낼 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 설명한 여러 우주 음식을 정리하며 글을 맺는 문장입니다. 다양한 음식이 있기 때문에 우주비행사가 우주에서도 \u003cb class=\"key\">건강\u003c/b>을 유지할 수 있다는 결론이죠. 즉 이 문장은 글 전체의 \u003cb class=\"key\">주제\u003c/b>를 한 줄로 요약하는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 with (수단·도구)\u003c/span> : With + [명사구], + [주어] + [동사] : \"이러한 다양한 우주 음식들로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">2형식 동사 + 형용사 보어\u003c/span> : stay(상태 유지 동사) + [형용사 healthy (주격 보어)] : \"건강하게 지내다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사구 (장소)\u003c/span> : in + [장소 명사] : \"우주에서\"\u003c/div>\u003c/div>","segs":[{"n":55,"text":"With these various space foods, 이러한 다양한 우주 음식들로. astronauts can stay healthy, 우주비행사들은 건강하게 지낼 수 있다. in space, 우주에서. 이 문장 전체를 해석하면, 이러한 다양한 우주 음식들로, 우주비행사들은 우주에서 건강하게 지낼 수 있다.","hl":"m"},{"n":56,"text":"이 문장은 글 전체를 마무리하는 문장이에요. 앞에서 설명한 다양한 우주 음식 덕분에 우주비행사들이 우주에서도 건강을 유지할 수 있다는 결론이죠. 그래서 이 문장은 글의 주제를 한 줄로 정리해 주는 역할을 합니다.","hl":"mn"},{"n":57,"text":"어법 포인트 첫 번째, 문장 앞의 With는 ~을 가지고, ~로라는 수단을 나타내는 전치사예요. 두 번째, stay는 계속 그 상태로 있다는 2형식 동사라서 뒤에 부사가 아니라 형용사 healthy가 보어로 와요. 세 번째, in space는 장소를 나타내는 전치사구로, 건강을 유지하는 공간이 우주임을 알려 줍니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>캠핑에서 음식을 챙기듯 우주비행사들도 우주에 갈 때 \u003cb class=\"key\">음식\u003c/b>을 준비한다.\u003c/li>\u003cli>우주비행사들은 지구에서처럼 하루 \u003cb class=\"key\">세 \u003c/b>\u003cb class=\"key\">끼\u003c/b>를 먹고, 건조식과 통조림, 신선식 등 \u003cb class=\"key\">다양한 \u003c/b>\u003cb class=\"key\">음식\u003c/b>이 있다.\u003c/li>\u003cli>우주선에는 \u003cb class=\"key\">오븐\u003c/b>이 있어 데울 수 있지만 \u003cb class=\"key\">냉장고\u003c/b>가 없어 모든 음식이 \u003cb class=\"key\">포장\u003c/b>되어 온다.\u003c/li>\u003cli>소금은 \u003cb class=\"key\">액체\u003c/b>로, 소스는 \u003cb class=\"key\">튜브\u003c/b>로 나오며, 이런 우주 음식 덕분에 우주비행사들은 우주에서 \u003cb class=\"key\">건강\u003c/b>을 유지한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Since a spacecraft has no refrigerator, all space food comes in packets, but with an oven, liquid salt, and tube sauces, astronauts can eat various foods and stay healthy in space.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">우주비행사들은 지구에서처럼 하루 세 끼를 먹지만, 우주선에는 \u003cb class=\"key\">냉장고\u003c/b>가 없어 모든 음식이 \u003cb class=\"key\">포장\u003c/b>된 형태로 보관된다. \u003cb class=\"key\">오븐\u003c/b>으로 음식을 데울 수 있고 소금은 \u003cb class=\"key\">액체\u003c/b>로, 소스는 \u003cb class=\"key\">튜브\u003c/b>에 담겨 나오며, 이런 다양한 우주 음식 덕분에 우주비행사들은 우주에서도 \u003cb class=\"key\">건강\u003c/b>을 유지한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":58,"text":"오늘 글의 핵심은 결국 냉장고가 없는 우주선에서도 포장과 오븐, 액체 소금과 튜브 소스 덕분에 우주비행사들이 다양한 음식을 먹으며 건강을 유지한다는 거예요. 구조는 사례를 쌓아 올린 뒤 마지막에 결론을 내는 미괄식이라는 점, 그리고 But과 So 같은 신호어가 흐름을 바꾼다는 점도 함께 기억해 두세요. 오늘 수업 여기까지고요, 다음 시간에 또 만나요. 수고했어요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
