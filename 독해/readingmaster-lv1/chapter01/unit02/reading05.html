칙적으로 해결하기 위해 음식을 준비한다.</li><li>지구와 유사한 식습관 유지 (three meals a day)</li><li>우주 임무를 위한 철저한 식량 준비 (prepare food)</li><li>핵심 키워드: 우주 식량(space food)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02우주 식량의 구성 및 형태</div><ul><li>다양한 형태의 보관 용이한 음식들이 우주선 내에 구비되어 있다.</li><li>흔히 먹는 건조 식품 (dried food)</li><li>통조림 식품 및 소량의 신선 채소/과일 (canned potatoes and meats)</li><li>보관을 용이하게 하는 포장 방식 (packets)</li><li>핵심 키워드: 저장 방식(storage)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03우주선 내 조리 및 편의 시설</div><ul><li>우주선 내부에는 음식을 따뜻하게 데우는 장비는 있지만 냉장고는 존재하지 않는다.</li><li>음식 가열을 위한 오븐 구비 (oven)</li><li>냉장 시설의 부재 (no refrigerator)</li><li>핵심 키워드: 조리 시설(cooking facility)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04무중력 환경을 고려한 특수 식품</div><ul><li>떠다니는 현상을 방지하기 위해 액체형 조미료나 튜브형 소스를 사용한다.</li><li>날아다니는 가루 방지를 위한 액체 소금 (liquid salt)</li><li>튜브에 담긴 각종 소스류 (tubes)</li><li>핵심 키워드: 무중력(microgravity)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05결론</div><ul><li>다양하게 준비된 우주 식량을 통해 우주비행사들은 우주에서도 건강을 유지한다.</li><li>건강한 신체 상태 유지 (stay healthy)</li><li>우주 환경에 최적화된 식단 체계 구축</li><li>핵심 키워드: 건강 유지(maintaining health)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">make sure to</td><td class=\"m\">~하도록 확실히 하다, 꼭 ~하다</td></tr><tr><td class=\"w\">dried</td><td class=\"m\">말린, 건조된</td></tr><tr><td class=\"w\">common</td><td class=\"m\">흔한, 공통의</td></tr><tr><td class=\"w\">canned</td><td class=\"m\">통조림으로 된, 캔에 든</td></tr><tr><td class=\"w\">spacecraft</td><td class=\"m\">우주선</td></tr><tr><td class=\"w\">store</td><td class=\"m\">저장하다, 보관하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">refrigerator</td><td class=\"m\">냉장고</td></tr><tr><td class=\"w\">packet</td><td class=\"m\">봉지, 작은 꾸러미</td></tr><tr><td class=\"w\">ordinary</td><td class=\"m\">보통의, 일반적인</td></tr><tr><td class=\"w\">float away</td><td class=\"m\">떠내려가다, 둥둥 떠다니다</td></tr><tr><td class=\"w\">available</td><td class=\"m\">이용 가능한, 구할 수 있는</td></tr><tr><td class=\"w\">various</td><td class=\"m\">여러 가지의, 다양한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">캠핑을 갈 때,</span><span class=\"en\"><b><span class=\"grammar-hl\">When you go camping</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분은 확실히 한다</span><span class=\"en\"><b>you make sure</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가져오는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">to bring</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">충분한 음식을</span><span class=\"en\"><b>enough food.</b></span></div></div><div class=\"lec-sent-ko\">캠핑을 갈 때, 여러분은 반드시 충분한 음식을 가지고 가야 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 캠핑이라는 일상적인 상황을 예로 들어, 외부 환경으로 떠날 때 식량을 준비하는 보편적인 행동을 언급하며 글을 시작합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">When you go camping (분사구문): 접속사(when)가 포함된 부사절로 문장의 시간적 배경을 설명한다. 원래 절로 변환하면 &#39;when you are camping&#39;으로 볼 수 있다.</div><div class=\"lec-gr-item\">to bring (to부정사): make sure(확실히 하다)의 목적어로 쓰인 명사적 용법의 to부정사 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">make sure to</td><td class=\"m\">~하도록 확실히 하다, 꼭 ~하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우주비행사들은 같은 일을 한다</span><span class=\"en\"><b>Astronauts do the same thing</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 갈 때</span /b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하루에</span><span class=\"en\"><b>a day.</b></span></div></div><div class=\"lec-sent-ko\">지구에서와 마찬가지로, 우주비행사들은 하루에 세 끼를 먹는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 우주라는 낯선 환경에서도 지구에서의 기본적인 생활 습관인 규칙적인 식사를 유지한다는 점을 통해 인간의 적응 방식을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Like on Earth, astronauts eat three 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">많은 다양한 음식들이 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">There are many different foods</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우주비행사들을 위한</span><span class=\"en\"><b><span class=\"grammar-hl\">for</span> astronauts</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우주에는</span><span class=\"en\"><b>in space.</b></span></div></div><div class=\"lec-sent-ko\">우주에는 우주비행사들을 위한 많은 다양한 음식들이 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 우주 식단이 단조롭지 않고 여러 종류로 구성되어 있다는 점을 보여주며 이후 이어질 구체적인 예시들의 토대를 마련합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">There are many different foods for 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">건조된 음식은</span><span class=\"en\"><b><span class=\"grammar-hl\">Dried</span> food</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매우 흔하다</span><span class=\"en\"><b>is very common.</b></span></div></div><div class=\"lec-sent-ko\">건조된 음식은 매우 흔하다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 우주라는 특수한 환경에서 보관의 용이함을 위해 주로 어떤 형태의 음식을 섭취하는지 첫 번째 사례를 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Dried (과거분사(형용사)): 과거분사 dried가 food를 수식하는 구조이며, &#39;p.p.된 N&#39; 의미로 &#39;건조된 음식&#39;을 뜻한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">dried</td><td class=\"m\">말린, 건조된</td></tr><tr><td class=\"w\">common</td><td class=\"m\">흔한, 공통의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">있다</span><span class=\"en\"><b>There are</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">통조림으로 된 감자와 고기가</span><span class=\"en\"><b><span class=\"grammar-hl\">canned</span> potatoes and meats.</b></span></div></div><div class=\"lec-sent-ko\">통조림으로 된 감자와 고기가 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 건조 식품 외에도 식재료를 보존할 수 있는 또 다른 방식인 통조림 형태의 음식들이 활용됨을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">canned (과거분사(형용사)): 과거분사 canned가 potatoes와 meats를 수식하며, &#39;통조림으로 만들어진&#39;이라는 의미를 가진다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">canned</td><td class=\"m\">통조림으로 된, 캔에 든</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우주선은</span><span class=\"en\"><b><span class=\"grammar-hl\">A spacecraft</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저장할 수 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">can store</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">약간의 신선한 과일과 채소를</span><span class=\"en\"><b><span class=\"grammar-hl\">some fresh</span> fruit and vegetables.</b></span></div></div><div class=\"lec-sent-ko\">우주선은 신선한 과일과 채소를 저장할 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 가공된 식품만 먹는 것이 아니라, 신선한 식재료도 제한적이지만 우주선 내부에 비치하고 있음을 알려줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">A spacecraft can store some fresh 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">spacecraft</td><td class=\"m\">우주선</td></tr><tr><td class=\"w\">store</td><td class=\"m\">저장하다, 보관하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">오븐도 또한 있다</span><span class=\"en\"><b>There is also an oven</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우주선 안에</span><span class=\"en\"><b>in a spacecraft</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그것은 만들 수 있다</span><span class=\"en\"><b>and it can <span class=\"grammar-hl\">make</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">음식을 따뜻하게</span><span class=\"en\"><b><span class=\"grammar-hl\">food warm</span>.</b></span></div></div><div class=\"lec-sent-ko\">우주선 안에는 오븐도 있고 그것은 음식을 따뜻하게 만들 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 차가운 가공식품을 먹는 것에 그치지 않고, 조리 도구를 통해 식사의 질을 높이는 환경이 조성되어 있음을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">make food warm 5형식(SVOC) 구조: make + O(food) + C(warm/형용사) 구조로, 목적어인 음식의 상태를 보어로 설명한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">spacecraft</td><td class=\"m\">우주선</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만</span><span class=\"en\"><b><span class=\"grammar-hl\">But there is no refrigerator.</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">냉장고가 없다.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">하지만 냉장고가 없다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 조리 도구는 갖춰져 있으나 일반 가정과는 달리 냉장 시설은 부재하다는 제약을 언급하며 우주 식량 관리의 어려움을 지적합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">But there is no refrigerator. 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">refrigerator</td><td class=\"m\">냉장고</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 11 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그래서</span><span class=\"en\"><b><span class=\"grammar-hl\">So</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모든 음식은</span><span class=\"en\"><b><span class=\"grammar-hl\">all the food</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나온다</span><span class=\"en\"><b><span class=\"grammar-hl\">comes</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">포장된 상태로</span><span class=\"en\"><b><span class=\"grammar-hl\">in</span> packets</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">쉬운 보관을 위해</span><span class=\"en\"><b>for easy storage.</b></span></div></div><div class=\"lec-sent-ko\">그래서 모든 음식은 쉽게 보관할 수 있도록 포장되어 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 냉장고가 없는 환경적 한계를 극복하기 위해 모든 식재료를 부피가 작고 보관이 용이한 형태로 가공하여 공급한다는 인과관계를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">So all the food comes in 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">packet</td><td class=\"m\">봉지, 작은 꾸러미</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 12 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">소금은</span><span class=\"en\"><b><span class=\"grammar-hl\">Salt</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나온다</span><span class=\"en\"><b><span class=\"grammar-hl\">comes</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">액체 형태로</span><span class=\"en\"><b><span class=\"grammar-hl\">as liquid.</span></b></span></div></div><div class=\"lec-sent-ko\">소금은 액체로 나온다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 무중력 공간에서는 가루 형태의 소금이 사방으로 퍼질 위험이 있어 이를 방지하기 위한 특수한 조치임을 암시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Salt comes as liquid. 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        ","<div class=\"lec-sent-no\">문장 13 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">보통의 소금은</span><span class=\"en\"><b><span class=\"grammar-hl\">Ordinary salt</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그냥 떠다닐 것이다</span><span class=\"en\"><b><span class=\"grammar-hl\">would simply float away.</span></b></span></div></div><div class=\"lec-sent-ko\">보통의 소금은 그냥 떠다니고 말 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 액체 소금을 사용하는 이유를 무중력이라는 우주 공간의 물리적 특성과 연결하여 구체적으로 밝힙니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Ordinary salt would simply float away. 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">ordinary</td><td class=\"m\">보통의, 일반적인</td></tr><tr><td class=\"w\">float away</td><td class=\"m\">떠내려가다, 둥둥 떠다니다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 14 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">소스들은</span><span class=\"en\"><b>Sauces</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">케첩, 머스타드, 그리고 마요네즈와 같은</span><span class=\"en\"><b>like ketchup, mustard, and mayonnaise</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또한 이용 가능하다</span><span class=\"en\"><b><span class=\"grammar-hl\">are also available</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">튜브 안에</span><span class=\"en\"><b>in tubes.</b></span></div></div><div class=\"lec-sent-ko\">케첩, 머스타드, 마요네즈 같은 소스도 튜브에 넣어져 이용할 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 소금과 마찬가지로 흩날리지 않도록 튜브를 활용하여 소스를 공급하는 또 다른 사례를 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are also available 형용사 보어 구조: be동사(are) 뒤에 형용사(available)가 보어로 쓰여 주어의 상태를 설명한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">available</td><td class=\"m\">이용 가능한, 구할 수 있는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 15 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이러한 다양한 우주 음식들로,</span><span class=\"en\"><b>With these various space foods,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우주비행사들은 머물 수 있다</span><span class=\"en\"><b>astronauts can stay</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">건강하게</span><span class=\"en\"><b>healthy</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우주에서</span><span class=\"en\"><b>in space.</b></span></div></div><div class=\"lec-sent-ko\">이러한 다양한 우주 음식들로, 우주비행사들은 우주에서 건강하게 지낼 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 나열한 모든 노력과 준비가 결국 우주비행사들의 신체적 안녕을 보장하기 위한 것임을 밝히며 글을 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to stay (to부정사): 문장의 목적을 나타내는 부사적 용법으로, &#39;건강을 유지하기 위해서&#39;로 해석된다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">various</td><td class=\"m\">여러 가지의, 다양한</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>우주비행사들도 지구에서의 캠핑처럼 출발 전 식량을 꼼꼼히 준비한다.</li><li>우주는 냉장고가 없는 환경이라 음식을 주로 건조하거나 포장지에 담아 보관한다.</li><li>무중력 상태를 고려해 가루 형태는 피하고 액체나 튜브형 식재료를 사용한다.</li><li>이러한 맞춤형 식단 덕분에 우주에서도 건강한 생활을 이어갈 수 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Astronauts eat a variety of specially stored foods because there are no refrigerators in space, and they use liquid seasonings to prevent them from floating away.</div>\n              <div class=\"lec-final-sum-ko\">우주에는 냉장고가 없기에 우주 비행사들은 다양하게 저장된 음식을 섭취하며, 음식물이 떠다니는 것을 방지하기 위해 액체 형태의 양념을 사용한다.</div></div></div>"],"segs":[[{"audio":"./reading05_audio/1.mp3","hl":null}],[{"audio":"./reading05_audio/2.mp3","hl":null}],[{"audio":"./reading05_audio/3.mp3","hl":null},{"audio":"./reading05_audio/4.mp3","hl":"stage-0"},{"audio":"./reading05_audio/5.mp3","hl":"stage-1"},{"audio":"./rea
