v class=\"lec-cover-bkg-txt\">성공의 이면에는 필연적으로 수많은 실패가 존재한다는 사실을 이해하는 것이 무엇보다 중요합니다. 흔히 성취 지향적인 태도로 알려진 성장 마인드셋(Growth Mindset)은 지능이나 능력이 고정된 것이 아니라 노력과 실패를 통해 얼마든지 발전할 수 있다고 믿는 심리적 개념입니다. 마치 근육을 키우기 위해 헬스장에서 무거운 무게를 들며 근섬유가 미세하게 파열되는 과정을 겪어야 더 단단해지는 것과 같은 이치이지요. 이와 관련해 심리학자 캐롤 드웩(Carol Dweck)은 실패를 좌절이 아닌 학습의 기회(Learning Opportunity)로 바라보는 태도가 장기적인 성취에 결정적인 역할을 한다고 강조했습니다. 따라서 여러분도 로저 페더러의 사례처럼 실패를 부정적인 종착점이 아니라, 성공을 향한 필수적인 과정(Necessary Step)으로 받아들이는 유연한 사고방식을 가져보시길 바랍니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01질문을 통한 사례 도입</div><ul><li>세상에 실패 없는 완벽한 사람은 존재하지 않는다는 사실을 질문을 통해 환기한다.</li><li>성공만 기록한 스포츠 선수는 존재하기 어려움</li><li>실패 경험이 없는 사람을 찾기는 매우 힘듦</li><li>핵심 키워드: 실패(failure), 성공(success)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02로저 페더러의 사례 제시</div><ul><li>최고의 테니스 선수조차 수많은 패배를 경험했음을 예시로 든다.</li><li>로저 페더러(Roger Federer)의 그랜드 슬램 우승 이면의 기록</li><li>전체 대회 중 3분의 2 이상에서 패배함</li><li>패배보다 승리가 적음에도 그는 챔피언으로 기억됨</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03실패에 대한 인식 전환</div><ul><li>실패를 두려워하지 말고 성공을 위한 필수적인 과정으로 바라보아야 한다.</li><li>실패는 성공을 만드는 핵심 요인(Failure makes success)</li><li>경기 패배나 시험 불합격은 누구나 겪을 수 있는 자연스러운 일</li><li>핵심 키워드: 완벽함(perfect), 두려움(afraid)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04수용과 극복</div><ul><li>자신의 실패를 있는 그대로 받아들이고 다음 단계로 나아가는 태도가 중요하다.</li><li>자신의 불완전함을 인정하고 수용하기</li><li>실패에 머물지 않고 앞으로 나아갈 것(move on)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">failure</td><td class=\"m\">실패, 낙제</td></tr><tr><td class=\"w\">in other words</td><td class=\"m\">다시 말해서, 바꿔 말하면</td></tr><tr><td class=\"w\">champion</td><td class=\"m\">우승자, 챔피언</td></tr><tr><td class=\"w\">be afraid of</td><td class=\"m\">~을 두려워하다, ~을 무서워하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">pass</td><td class=\"m\">통과하다, 합격하다</td></tr><tr><td class=\"w\">perfect</td><td class=\"m\">완벽한, 결함 없는</td></tr><tr><td class=\"w\">accept</td><td class=\"m\">받아들이다, 수용하다</td></tr><tr><td class=\"w\">move on</td><td class=\"m\">나아가다, 다음 단계로 넘어가다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여러분은 누군가를 아나요</span><span class=\"en\"><b><span class=\"grammar-hl\">Do you know anybody</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">전혀 실패가 없는</span><span class=\"en\"><b>with no failure at all?</b></span></div></div><div class=\"lec-sent-ko\">여러분은 전혀 실패한 적 없는 사람을 알고 있나요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 실패를 한 번도 경험하지 않은 사람이 존재하는지에 대해 독자에게 질문을 던지며, 완벽한 성공만 존재하는 것은 현실적으로 불가능하다는 주제를 환기합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Do you know anybody (간접의문문): anybody를 선행사로 하는 관계대명사절이 생략된 구조로 볼 수 있으나, 문장 전체는 의문문 어순을 따르는 일반 의문문 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">failure</td><td class=\"m\">실패, 낙제</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">아니면 스포츠 역사상 누군가를 떠올릴 수 있나요</span><span class=\"en\"><b>Or <span class=\"grammar-hl\">can you think of</span> anyone in sports history</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오직 우승 기록만 가진</span><span class=\"en\"><b>with a record of only wins?</b></span></div></div><div class=\"lec-sent-ko\">아니면 스포츠 역사상 우승 기록만 있는 사람을 생각할 수 있나요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 질문을 구체화하여, 스포츠라는 경쟁 분야조차도 무패 기록을 가진 사람이 없다는 사실을 통해 실패의 필연성을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">can you think of (관용표현): think of A (A를 생각하다/떠올리다) 구조가 의문문 형태로 쓰였습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">아마 아닐 겁니다.</span><span class=\"en\"><b><span class=\"grammar-hl\">Probably not</span>.</b></span></div></div><div class=\"lec-sent-ko\">아마 아닐 겁니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞의 두 질문에 대한 답을 짧게 제시하며, 성공과 실패는 분리될 수 없다는 논리를 전개할 준비를 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Probably not (대동사(생략)): 앞선 문장의 &#39;think of anyone...&#39;이라는 동사구 전체를 받는 부정 표현으로, 문맥상 동사가 일반동사이므로 do가 생략된 형태로 이해합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">로저 페더러는, 예를 들어,</span><span class=\"en\"><b>Roger Federer, for example,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">세계에서 가장 위대한 테니스 선수입니다</span><span class=\"en\"><b><span class=\"grammar-hl\">is</span> the world’s greatest tennis player</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">20개의 그랜드 슬램 타이틀을 가진</span><span class=\"en\"><b>with twenty Grand Slam titles.</b></span></div></div><div class=\"lec-sent-ko\">예를 들어, Roger Federer는 20개의 그랜드 슬램 타이틀을 보유한 세계 최고의 테니스 선수입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 스포츠 분야의 대표적인 성공 사례를 언급하며, 이후 문장에서 그의 실패 기록을 대조적으로 보여주기 위한 전제 정보를 제공합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is 2형식 구조: 주어(Roger Federer) + 동사(is) + 보어(the world&#39;s greatest tennis player)가 명사구 보어로 연결되었습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만 그는 실제로 경기를 했습니다</span><span class=\"en\"><b>But he actually <span class=\"grammar-hl\">played</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">60개가 넘는 그랜드 슬램 토너먼트에서</span><span class=\"en\"><b>in more than sixty Grand Slam tournaments.</b></span></div></div><div class=\"lec-sent-ko\">그러나 그는 실제로 60개 이상의 그랜드 슬램 토너먼트에서 경기를 했습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 20번의 우승이라는 겉으로 드러난 성공 뒤에는 수많은 도전과 탈락이 숨겨져 있음을 밝히며 논리적 반전을 시도합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">played 과거 시제: 주어(he)의 과거 동작을 나타내며, 1형식 구조로 쓰였습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">다시 말해서,</span><span class=\"en\"><b><span class=\"grammar-hl\">In other words</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는 졌습니다</span><span class=\"en\"><b>he lost</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">토너먼트의 3분의 2 이상에서</span><span class=\"en\"><b>in more than two-thirds of the tournaments.</b></span></div></div><div class=\"lec-sent-ko\">다시 말해서, 그는 토너먼트의 2/3이상에서 패했습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 우승 횟수보다 패배 횟수가 훨씬 많다는 수치적 사실을 제시하여, 대중이 인식하는 &#39;챔피언&#39;의 모습 뒤에 가려진 실패의 비중을 구체적으로 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">In other words (관용표현): 앞 문장의 내용을 부연 설명하기 위해 사용하는 접속 부사구(다시 말해서)입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">in other words</td><td class=\"m\">다시 말해서, 바꿔 말하면</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 훨씬 더 많은 토너먼트에서 졌습니다</span><span class=\"en\"><b>He <span class=\"grammar-hl\">lost</span> many more tournaments</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그가 이긴 것보다</span><span class=\"en\"><b>than he won.</b></span></div></div><div class=\"lec-sent-ko\">그는 이긴 것보다 더욱 많은 토너먼트에서 졌습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 수치를 정리하며, 성공한 사람도 실제로는 패배의 기록을 훨씬 많이 가지고 있다는 점을 재확인합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">lost 타동사 구조: lost는 뒤에 목적어(tournaments)를 취하는 타동사로 사용되었습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그럼에도,</span><span class=\"en\"><b><span class=\"grammar-hl\">Still,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 그를 생각합니다</span><span class=\"en\"><b><span class=\"grammar-hl\">we think of him</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">챔피언으로,</span><span class=\"en\"><b><span class=\"grammar-hl\">as</span> a champion,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">실패자가 아닌</span><span class=\"en\"><b>not as a failure.</b></span></div></div><div class=\"lec-sent-ko\">여전히, 우리는 그를 실패자가 아니라 챔피언으로 생각합니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 사람들의 인식 속에 존재하는 &#39;챔피언&#39;이라는 가치가 무패 기록에서 오는 것이 아님을 지적하며, 성공에 대한 통념을 바로잡습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Still, we think of him as 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">failure</td><td class=\"m\">실패, 낙제</td></tr><tr><td class=\"w\">champion</td><td class=\"m\">우승자, 챔피언</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">실패가 성공을 만듭니다.</span><span class=\"en\"><b>Failure <span class=\"grammar-hl\">makes</span> success.</b></span></div></div><div class=\"lec-sent-ko\">실패는 성공을 만듭니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞의 사례를 바탕으로 도출한 핵심 주장입니다. 실패가 성공을 가로막는 장애물이 아니라, 성공을 구성하는 필수적인 과정임을 단언합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">makes 5형식(SVOC) 구조: Failure(S) + makes(V) + success(O) 형태의 3형식 문장이지만, 넓은 의미에서 성공을 만드는 주체로서의 동사 역할을 수행합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">failure</td><td class=\"m\">실패, 낙제</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러니 두려워하지 마세요</span><span class=\"en\"><b>So <span class=\"grammar-hl\">don’t be afraid</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">실패를</span><span class=\"en\"><b><span class=\"grammar-hl\">of</span> failure.</b></span></div></div><div class=\"lec-sent-ko\">그러니 실패를 두려워하지 마세요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 증명한 논리를 바탕으로, 독자에게 실패를 대하는 태도 변화를 촉구하는 권유의 메시지를 전달합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">don’t be afraid of (관용표현): be afraid of (~를 두려워하다) 구조의 부정 명령문입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">failure</td><td class=\"m\">실패, 낙제</td></tr><tr><td class=\"w\">be afraid of</td><td class=\"m\">~을 두려워하다, ~을 무서워하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 11 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">경기에서 지는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">Losing a game</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또는 시험을 통과하지 못하는 것은</span><span class=\"en\"><b>or <span class=\"grammar-hl\">not passing a test</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">괜찮습니다.</span><span class=\"en\"><b>is okay.</b></span></div></div><div class=\"lec-sent-ko\">경기에서 지거나 시험을 통과하지 못하는 것은 괜찮습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 일상에서 겪는 구체적인 실패 상황들을 예시로 들어, 그러한 경험들이 인간으로서 지극히 자연스러운 과정임을 안심시킵니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Losing a game (동명사): 문장의 주어 역할을 하며, -ing가 &#39;게임을 잃는 것&#39;이라는 명사적 행위 개념으로 쓰였습니다.</div><div class=\"lec-gr-item\">not passing a test (동명사): 문장의 주어 역할을 하며, -ing가 &#39;시험에 통과하지 못하는 것&#39;이라는 명사적 행위 개념으로 쓰였습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">pass</td><td class=\"m\">통과하다, 합격하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 12 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">아무도 완벽하지 않습니다.</span><span class=\"en\"><b>No one <span class=\"grammar-hl\">is perfect</span>.</b></span></div></div><div class=\"lec-sent-ko\">그 누구도 완벽하지는 않습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 실패에 좌절하는 독자들을 위로하며, 모든 인간은 불완전한 존재라는 보편적 사실을 상기시킵니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is perfect 2형식 구조: 주어(No one) + 동사(is) + 형용사 보어(perfect) 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">perfect</td><td class=\"m\">완벽한, 결함 없는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 13 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여러분의 실패를 받아들이려고 노력하세요</span><span class=\"en\"><b><span class=\"grammar-hl\">Try to accept</span> your failure</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 나아가세요</span><span class=\"en\"><b>and <span class=\"grammar-hl\">move on</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것으로부터</span><span class=\"en\"><b>from it.</b></span></div></div><div class=\"lec-sent-ko\">여러분의 실패를 받아들이고 그것으로부터 나아가려고 노력하세요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글 전체의 결론으로, 실패를 부정하기보다 자신의 일부로 수용하고 그 성장의 발판으로 삼으라는 실천적인 조언을 남깁니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Try to accept (to부정사): 동사 try의 목적어 역할을 하며, 목적어 자리에서 명사적 용법으로 사용되었습니다.</div><div class=\"lec-gr-item\">move on (관용표현): (이전의 상황에서 벗어나) 나아가다/계속하다는 의미의 이어동사(phrasal verb)입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">failure</td><td class=\"m\">실패, 낙제</td></tr><tr><td class=\"w\">accept</td><td class=\"m\">받아들이다, 수용하다</td></tr><tr><td class=\"w\">move on</td><td class=\"m\">나아가다, 다음 단계로 넘어가다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>누구도 무패의 삶을 살 수는 없으며, 스포츠 영웅인 페더러조차 우승보다 패배가 훨씬 많다.</li><li>대중은 결과를 보고 그를 챔피언이라 부르며, 사실 실패는 성공을 구성하는 필수적인 요소이다.</li><li>따라서 실패를 두려워할 필요가 없으며, 자신의 불완전함을 인정하고 실패를 성장의 발판으로 삼아야 한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Even the greatest champions experience frequent losses, yet they use these setbacks as opportunities to grow instead of fearing them.</div>\n              <div class=\"lec-final-sum-ko\">위대한 챔피언들조차 빈번한 패배를 경험하지만, 그들은 실패를 두려워하는 대신 성장의 기회로 삼는다.</div></div></div>"],"segs":[[{"audio":"./reading06_audio/1.mp3","hl":null}],[{"audio":"./reading06_audio/2.mp3","hl":null}],[{"audio":"./reading06_audio/3.mp3","hl":null},{"audio":"./reading06_audio/4.mp3","hl":"stage-0"},{"audio":"./reading06_audio/5.mp3","hl":"stage-1"},{"audio":"./reading06_audio/6.mp3","hl":"stage-2"},{"audio":"./reading06_audio/7.mp3","hl":"stage-3"}],[{"audio":"./reading06_audio/8.mp3","hl":null}],[{"audio":"./reading06_audio/9.mp3","hl":"main"},{"audio":"./reading06_audio/10.mp3","hl":"meaning"},{"audio":"./reading06_audio/11.mp3","hl":"grammar"}],[{"audio":"./reading06_audio/12.mp3","hl":"main"},{"audio":"./reading06_audio/13.mp3","hl":"meaning"},{"audio":"./reading06_audio/14.mp3","hl":"grammar"}],[{"audio":"./reading06_audio/15.mp3","hl":"main"},{"audio":"./reading06_audio/16.mp3","hl":"meaning"},{"audio":"./reading06_audio/17.mp3","hl":"grammar"}],[{"audio":"./reading06_audio/18.mp3","hl":"main"},{"audio":"./reading06_audio/19.mp3","hl":"meaning"},{"audio":"./reading06_audio/20.mp3","hl":"grammar"}],[{"audio":"./reading06_audio/21.mp3","hl":"main"},{"audio":"./reading06_audio/22.mp3","hl":"meaning"},{"audio":"./reading06_audio/23.mp3","hl":"grammar"}],[{"audio":"./reading06_audio/24.mp3","hl":"main"},{"audio":"./reading06_audio/25.mp3","hl":"meaning"},{"audio":"./reading06_audio/26.mp3","hl":"grammar"}],
