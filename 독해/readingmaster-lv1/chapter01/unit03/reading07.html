7dPoOaac8HPfn3PI/n2p3BA+ZeenzDr12/X26dfegDOenrjIyPwyenX8M0f1t8v6ffzC1rW2Sta36/15iEjOO/1z+P0/Og9M46dPyOMfXBGfzoGD2yD+vp1H+NDEkcgHAbOB8o2DJ/XPbHfOBTW61tqvzX9a9hq71WunS+/Tvbqf//Z\" alt=\"\"></div>","<div class=\"lec-cover-title\">A Request for Cooperation to Protect Zoo Animals from Trash<small>동물들을 쓰레기로부터 보호하기 위한 협조 요청</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">동물원에서 관람객의 부주의한 행동이 동물의 건강에 미치는 악영향인 &#39;동물원 안전 관리(Zoo Safety Management)&#39;와 &#39;생태적 보전(Ecological Conservation)&#39;의 중요성을 이해하는 것이 중요합니다. 특히 동물들은 호기심이 많아 주변 물건을 입으로 확인하는 습성이 있는데, 이를 이식증(Pica)과 유사하게 아무것이나 삼키려는 행동으로 오해하기 쉽지만 실제로는 생존 본능의 일부입니다. 무심코 버린 쓰레기가 동물에게는 치명적인 소화기 폐색(Gastrointestinal Obstruction)을 유발할 수 있으며, 이는 마치 우리가 실수로 먹지 못할 물건을 삼키는 것과 같은 심각한 건강 위협이 됩니다. 따라서 동물원 관람 시 규칙을 준수하는 것은 단순한 에티켓을 넘어 동물들의 생명권을 보호하는 필수적인 윤리적 행동임을 기억해야 합니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01방문 감사 및 목적</div><ul><li>동물원 가이드로서 현장학습을 온 강 선생님께 감사 인사를 전하며 부탁의 말을 시작합니다.</li><li>현장학습(field trip) 방문에 대한 감사</li><li>동물원 내 질서 유지를 위한 협조 요청</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02학생 행동 지도 요청</div><ul><li>학생들이 동물원 내에 쓰레기를 버리지 않도록 사전에 지도해 주길 당부합니다.</li><li>동물원 곳곳에 설치된 쓰레기통(trash cans) 사용 안내</li><li>쓰레기 투기 금지 요청</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03쓰레기 투기가 위험한 이유</div><ul><li>동물들이 쓰레기를 먹이로 오해하여 섭취할 경우 건강에 치명적인 문제가 발생합니다.</li><li>호기심 많은 동물들의 습성(test things with their mouths)</li><li>쓰레기를 먹이로 착각하여 삼키는 위험성(mistake for food)</li><li>섭취 시 동물의 건강 악화(make them very sick)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04결론 및 당부</div><ul><li>동물들의 건강과 안전을 위해 다시 한번 쓰레기 투기 금지에 대한 협조를 강조합니다.</li><li>동물의 건강(health) 보호를 위한 필수 사항</li><li>학생들의 올바른 관람 문화 정착 협조(cooperation) 부탁</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">field trip</td><td class=\"m\">현장 학습, 견학</td></tr><tr><td class=\"w\">ask a favor</td><td class=\"m\">부탁하다, 호의를 구하다</td></tr><tr><td class=\"w\">in place</td><td class=\"m\">준비되어 있는, 적절한 자리에 있는</td></tr><tr><td class=\"w\">harmful</td><td class=\"m\">해로운, 유해한</td></tr><tr><td class=\"w\">mistake</td><td class=\"m\">잘못 생각하다, 오인하다</td></tr><tr><td class=\"w\">cooperation</td><td class=\"m\">협력, 협조</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">강 선생님께</span><span class=\"en\"><b><span class=\"grammar-hl\">Dear Mr. Kang,</span></b></span></div></div><div class=\"lec-sent-ko\">강 선생님께</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> Dear Mr. Kang은 편지를 시작하며 수신인이 누구인지 밝히는 전통적인 인사 방식입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Dear Mr. Kang, (관용표현): 편지의 시작 부분에서 수신인을 정중하게 지칭할 때 사용하는 정형화된 인사말입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">저는 ~입니다</span><span class=\"en\"><b><span class=\"grammar-hl\">I am a tour guide</span> at Fun&amp;Joy Zoo.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">관광 안내원</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">Fun&amp;Joy 동물원의</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">저는 Fun&amp;Joy 동물원의 관광 안내원입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> I am a tour guide at Fun&amp;Joy Zoo는 화자가 누구이며 어떤 위치에서 이 편지를 쓰는지 신분을 명확히 밝혀 신뢰를 형성합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I am a tour guide (2형식): &#39;주어(I) + be동사(am) + 보어(a tour guide)&#39; 구조로 주어의 신분을 설명합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">감사합니다</span><span class=\"en\"><b>Thank you for <span class=\"grammar-hl\">visiting</span> our zoo for your field trip!</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저희 동물원을 방문해 주셔서</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">현장 학습으로</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">현장 학습으로 저희 동물원을 방문해 주셔서 감사합니다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> Thank you for visiting은 방문객에게 감사를 표함으로써 앞으로 이어질 부탁을 정중하게 요청하기 위한 예의 바른 도입부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">visiting (동명사): 전치사(for)의 목적어 자리에 위치하여 &#39;방문하는 것&#39;이라는 명사적 역할을 수행합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">field trip</td><td class=\"m\">현장 학습, 견학</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">바랍니다</span><span class=\"en\"><b><span class=\"grammar-hl\">I hope you will have</span> a wonderful day here.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">멋진 하루를 보내시기를</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">이곳에서</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">이곳에서 멋진 하루를 보내시기 바랍니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> I hope you will have a wonderful day here는 상대방의 즐거운 경험을 바라는 덕담으로, 부드러운 분위기 속에서 본론을 꺼낼 준비를 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I hope you will have (목적어절): &#39;I hope (that) you will have~&#39;에서 that이 생략된 형태입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">부탁드리고 싶습니다</span><span class=\"en\"><b><span class=\"grammar-hl\">I would like to ask you a favor</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">선생님께</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">한 가지 부탁을</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">선생님께 부탁드리고 싶은 게 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> I would like to ask you a favor는 본격적으로 상대방에게 협조를 구하는 문장으로, 앞선 인사말들에 이어 요청 사항을 공손하게 예고하는 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I would like to ask you a favor 5형식(간접의문문/구조변형): &#39;would like to + 동사원형&#39;은 희망을 나타내는 관용표현이며, ask + 간접목적어(you) + 직접목적어(a favor)의 4형식 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">방문하시기 전에</span><span class=\"en\"><b>Before your visit, please <span class=\"grammar-hl\">advise your students not to throw</span> waste in the zoo.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">학생들에게 지도해 주십시오</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">쓰레기를 버리지 않도록</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">동물원에</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">방문하시기 전에 학생들에게 동물원에 쓰레기를 버리지 않도록 지도해 주십시오.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> please advise your students not to throw waste는 이 글의 핵심 목적으로, 인솔자인 선생님이 학생들을 직접 통제해 달라는 구체적인 행동을 요청합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">advise your students not to throw (5형식): &#39;advise + 목적어(your students) + 목적격보어(to부정사)&#39; 구조입니다. 부정어(not)가 to부정사 앞에 위치하여 동작을 부정합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">쓰레기통은</span><span class=\"en\"><b>Trash cans are <span class=\"grammar-hl\">in place</span> all around the zoo.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">비치되어 있습니다</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">동물원 곳곳에</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">쓰레기통은 동물원 곳곳에 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> Trash cans are in place all around the zoo는 쓰레기를 버릴 곳이 이미 마련되어 있음을 알려, 쓰레기를 바닥에 버리는 행위가 불필요함을 논리적으로 뒷받침합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">in place (관용표현): &#39;제자리에 있는, 준비된&#39;이라는 의미를 가진 부사적 어구입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">in place</td><td class=\"m\">준비되어 있는, 적절한 자리에 있는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">비닐봉지와 기타 쓰레기들은</span><span class=\"en\"><b>Plastic bags and other trash <span class=\"grammar-hl\">can be</span> very harmful to our animals.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매우 해로울 수 있습니다</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리 동물들에게</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">비닐봉지와 기타 쓰레기들은 우리 동물들에게 매우 해로울 수 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> Plastic bags and other trash can be very harmful은 왜 쓰레기를 버리면 안 되는지에 대한 구체적인 이유를 제시하여 학생들의 주의를 환기합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">can be 조동사 구문: 조동사(can) 뒤에 be동사가 동사원형으로 온 형태입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">harmful</td><td class=\"m\">해로운, 유해한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어린아이들처럼</span><span class=\"en\"><b><span class=\"grammar-hl\">Like small children</span>, animals love <span class=\"grammar-hl\">to test</span> things with their mouths.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">동물들은</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">사물을 시험하는 것을 아주 좋아합니다</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">입으로</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">어린아이들처럼 동물들은 입으로 사물을 시험하는 것을 아주 좋아합니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> Like small children은 동물들이 본능적으로 입을 사용한다는 점을 비유를 통해 설명하여, 왜 그들이 위험에 노출되기 쉬운지를 이해하기 쉽게 풀이합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Like small children (관용표현): 전치사 &#39;like(~와 같이)&#39;를 사용한 비교 예시 표현입니다.</div><div class=\"lec-gr-item\">to test (to부정사): 동사(love)의 목적어 자리에 위치한 명사적 용법입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">동물들은</span><span class=\"en\"><b>They may mistake this trash for food and swallow it.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 쓰레기를 착각하여</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">음식으로</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">삼킬 수도 있습니다.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">동물들은 이 쓰레기를 음식으로 착각하여 삼킬 수도 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> mistake this trash for food는 앞 문장에서 언급한 동물의 습성이 어떻게 사고로 이어질 수 있는지 인과관계를 구체적으로 보여 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">mistake A for B (관용표현): &#39;A를 B로 착각하다&#39;라는 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">mistake</td><td class=\"m\">잘못 생각하다, 오인하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 11 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것이</span><span class=\"en\"><b><span class=\"grammar-hl\">It can make them very sick</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들을 만들 수 있습니다</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">매우 아프게</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">그것이 그들을 매우 아프게 할 수 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> It can make them very sick은 쓰레기 섭취가 단순히 불결한 문제가 아니라 동물의 생명에 지장을 주는 심각한 결과임을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It can make them very sick (5형식): &#39;make + 목적어(them) + 목적격보어(형용사: sick)&#39; 구조로, 목적어의 상태를 설명합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 12 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러므로</span><span class=\"en\"><b>So, <span class=\"grammar-hl\">for the health of our lovely animals</span>, students should not throw waste in the zoo.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 사랑스러운 동물들의 건강을 위해</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">학생들이</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">쓰레기를 버리면 안 됩니다</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">동물원에</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">그러므로 우리의 사랑스러운 동물들의 건강을 위해 학생들이 동물원에 쓰레기를 버리면 안 됩니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> for the health of our lovely animals는 앞서 설명한 모든 위험 요소를 정리하며, 학생들에게 준수해야 할 규칙을 다시 한번 당부하는 결론입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">for the health of our lovely animals (관용표현): &#39;~를 위하여&#39;라는 의미의 전치사구입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 13 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">감사합니다</span><span class=\"en\"><b><span class=\"grammar-hl\">I thank you for your cooperation</span>.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">협조해 주셔서</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">협조해 주셔서 감사합니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> I thank you for your cooperation은 상대방이 자신의 요청을 들어줄 것이라 기대하며 미리 감사를 전해, 협조를 자연스럽게 이끌어내는 정중한 마무리 인사입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I thank you for your cooperation (관용표현): &#39;thank + 목적어 + for + 명사&#39; 구조로 상대의 도움에 대해 감사할 때 쓰는 정형화된 표현입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">cooperation</td><td class=\"m\">협력, 협조</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 14 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">드림</span><span class=\"en\"><b><span class=\"grammar-hl\">Sincerely,</span></b></span></div></div><div class=\"lec-sent-ko\">Danna Smith 드림</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> Sincerely는 편지의 끝을 맺는 격식 있는 표현으로, 격식을 갖추어 글을 마치는 관습적인 문구입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Sincerely, (관용표현): 편지의 끝인사로 격식을 차릴 때 사용하는 표현입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 15 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\"></span><span class=\"en\"><b><span class=\"grammar-hl\">Danna Smith</span></b></span></div></div><div class=\"lec-sent-ko\">Danna Smith 드림</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> Sincerely는 편지의 끝을 맺는 격식 있는 표현으로, 격식을 갖추어 글을 마치는 관습적인 문구입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Danna Smith (기본구조): 문장의 발신자를 나타내는 고유명사입니다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>동물원 가이드가 현장 학습을 오는 선생님께 학생들의 쓰레기 투기 방지를 부탁함.</li><li>동물들은 쓰레기를 먹이로 오인해 삼킬 위험이 크기 때문임.</li><li>동물원 내 비치된 쓰레기통을 이용하도록 학생들을 지도해 달라고 요청함.</li><li>동물들의 건강과 안전을 위해 방문객의 협조를 구하는 내용임.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Students should avoid throwing waste in the zoo, as animals might ingest it and suffer from serious health problems.</div>\n              <div class=\"lec-final-sum-ko\">동물들이 쓰레기를 먹고 심각한 건강 문제를 겪을 수 있으므로, 학생들은 동물원 내에 쓰레기를 버리지 않아야 한다.</div></div></div>"],"segs":[[{"audio":"./reading07_audio/1.mp3","hl":null}],[{"audio":"./reading07_audio/2.mp3","hl":null}],[{"audio":"./reading07_audio/3.mp3","hl":null},{"audio":"./reading07_audio/4.mp3","hl":"stage-0"},{"audio":"./reading07_audio/5.mp3","hl":"stage-1"},{"audio":"./reading07_audio/6.mp3","hl":"stage-2"},{"audio":"./reading07_audio/7.mp3","hl":"stage-3"}],[{"audio":"./reading07_audio/8.mp3","hl":null}],[{"audio":"./reading07_audio/9.mp3","hl":"main"},{"audio":"./reading07_audio/10.mp3","hl":"meaning"},{"audio":"./reading07_audio/11.mp3","hl":"grammar"}],[{"audio":"./reading07_audio/12.mp3","hl":"main"},{"audio":"./reading07_audio/13.mp3","hl":"meaning"},{"audio":"./reading07_audio/14.mp3","hl":"grammar"}],[{"audio":"./reading07_audio/15.mp3","hl":"main"},{"audio":"./reading07_audio/16.mp3","hl":"meaning"},{"audio":"./reading07_audio/17.mp3","hl":"grammar"}],[{"audio":"./reading07_audio/18.mp3","hl":"main"},{"audio":"./reading07_audio/19.mp3","hl":"meaning"},{"audio":"./reading07_audio/20.mp3","hl":"grammar"}],[{"audio":"./reading07_audio/21.mp3","hl":"main"},{"audio":"./reading07_audio/22.mp3","hl":"meaning"},{"audio":"./reading07_audio/23.mp3","hl":"grammar"}],[{"audio":"./reading07_audio/24.mp3","hl":"main"},{"audio":"./reading07_audio/25.mp3","hl":"meaning"},{"audio":"./reading07_audio/26.mp3","hl":"grammar"}],[{"audio":"./reading07_audio/27.mp3","hl":"main"},{"audio":"./reading07_audio/28.mp3","hl":"meaning"},{"audio":"./reading07_audio/29.mp3","hl":"grammar"}],[{"audio":"./reading07_audio/30.mp3","hl":"main"},{"audio":"./reading07_audio/31.mp3","hl":"meaning"},{"audio":"./reading07_audio/32.mp3","hl":"
