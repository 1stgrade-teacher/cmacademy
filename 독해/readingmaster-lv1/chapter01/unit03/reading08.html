HHcf1p2wL0746c/l19Mdj6dOJQHGfkbJPHynH0HTJznIHPOTSFGHIVu/G1vbH+IB9CDnFOTb0vfTprd6Xdu17W6X23JvvfZLXr2b9Vby7+RGQc56EcZHbt9O36Uf5/z/n1zmpPLkY/6t8n/AGG+np04/r0o2SA8xv8AKSfuEc/kce/Pr14qPnt/Vh32vo7Xd3stLt+n/DdRVHXII6Z9z+fI/Q5PtiQAEgdfTgfe7D8+/wDLrQqSHB8t8MOPlb8yNvQYPTuce9WIYJGdY/KZt7qFBRscsMdumcYAGTgDoeWmk1Love7qys7t7W6vXpbTQHtbydr6201fW2i1fo77H//Z\" alt=\"\"></div>","<div class=\"lec-cover-title\">Wait Before You Click: The Necessity of Reviewing Emails<small>전송 버튼을 누르기 전 기다려라: 이메일 검토의 필요성</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">이 글을 읽기 전에 먼저 이해하면 좋은 개념은 디지털 환경에서의 &#39;쿨다운 타임(Cool-down Time)&#39;이라는 개념이에요. 우리가 이메일을 보내거나 중요한 과제를 제출하기 직전에 잠시 멈추는 행위를 심리적 거리두기(Psychological Distancing)라고 하는데, 이는 뇌가 오류를 더 잘 포착하도록 도와주는 아주 유용한 방법이죠. 마치 뜨거운 요리를 식혀야 맛을 제대로 느낄 수 있는 것처럼, 쓴 글을 잠시 묵혀두면 자신의 실수를 객관적인 시각에서 바라볼 수 있는 인지적 여유가 생기거든요. 특히 업무나 학업에서 흔히 발생하는 &#39;전송 후 후회&#39;를 방지하기 위해 많은 전문가들은 &#39;지연 전송(Delayed Sending)&#39; 기능을 활용하곤 하는데요. 이러한 작은 인내의 시간이 곧 여러분의 신뢰도와 완성도를 높여주는 핵심 열쇠라는 점을 기억하며 글을 읽어보시면 훨씬 더 큰 공감이 될 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01발송 전의 상태</div><ul><li>이메일을 보내기 전에는 아직 실수를 바로잡을 수 있는 안전한 상태이다.</li><li>전송 버튼을 누르기 전에는 아무런 문제가 발생하지 않음</li><li>글에는 오타(misspellings)나 사실 오류(errors of fact)가 있을 수 있음</li><li>핵심 키워드: 전송 버튼(Send button)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02검토의 이점</div><ul><li>전송을 잠시 미루면 실수를 수정할 시간을 확보할 수 있다.</li><li>서두르지 않고 시간을 갖는 것의 중요성</li><li>검토를 통해 실수를 고치면 누구도 원본의 차이를 알 수 없음</li><li>핵심 키워드: 수정(fix)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03올바른 순서</div><ul><li>효과적인 의사소통을 위해서는 발송보다 검토가 우선되어야 한다.</li><li>내용 확인과 수정이 우선시되어야 함</li><li>발송(sending)은 반드시 그 뒤에 이루어져야 함</li><li>핵심 키워드: 우선순위(priority)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04발송 후의 위험</div><ul><li>이미 발송된 이후에 발견된 실수는 수습하기 어려운 큰 문제가 된다.</li><li>메일 발송 후 실수를 발견하면 곤란한 상황 발생</li><li>학업 과제(school assignments)나 업무용 편지(business letters)도 동일함</li><li>핵심 키워드: 신중함(careful)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">right away</td><td class=\"m\">즉시, 당장</td></tr><tr><td class=\"w\">happen</td><td class=\"m\">일어나다, 발생하다</td></tr><tr><td class=\"w\">misspelling</td><td class=\"m\">철자 오류, 잘못된 철자</td></tr><tr><td class=\"w\">it doesn’t matter</td><td class=\"m\">상관없다, 중요하지 않다</td></tr><tr><td class=\"w\">take time</td><td class=\"m\">시간을 내다, 시간을 들이다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">hurry</td><td class=\"m\">서두르다, 재촉하다</td></tr><tr><td class=\"w\">come first</td><td class=\"m\">우선이다, 가장 중요하다</td></tr><tr><td class=\"w\">the same goes for</td><td class=\"m\">~도 마찬가지이다</td></tr><tr><td class=\"w\">assignment</td><td class=\"m\">과제, 임무</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">누르지 마십시오</span><span class=\"en\"><b>Don’t click</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">보내기 버튼을</span><span class=\"en\"><b>the Send button</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">바로</span><span class=\"en\"><b>right away</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이메일을 보낼 때</span><span class=\"en\"><b><span class=\"grammar-hl\">when you send emails</span>.</b></span></div></div><div class=\"lec-sent-ko\">이메일을 보낼 때 보내기 버튼을 바로 누르지 마십시오.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이메일 작성이라는 일상적인 상황에서 서두르지 않는 태도가 필요함을 강조하며 글의 전체 주제를 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to click (to부정사): 동사 click 앞에 to를 붙여 명사/형용사/부사적 역할을 수행하는 구조입니다. 여기서는 when절 내에서 부사적 용법(시간의 조건)으로 쓰였습니다.</div><div class=\"lec-gr-item\">when you send emails 관계부사(접속사적 기능): 시간의 부사절을 이끄는 접속사 when으로, &#39;네가 이메일을 보낼 때&#39;라는 의미로 문장 전체의 시간을 설정합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">right away</td><td class=\"m\">즉시, 당장</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">끔찍한 일이</span><span class=\"en\"><b>Nothing terrible</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">일어나지 않을 것입니다</span><span class=\"en\"><b>will happen</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">누르기 전에는</span><span class=\"en\"><b>before you click</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">보내기 버튼을</span><span class=\"en\"><b>the Send button.</b></span></div></div><div class=\"lec-sent-ko\">보내기 버튼을 누르기 전에는 끔찍한 일이 일어나지 않을 것입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 &#39;서두를 필요 없음&#39;의 근거를 제시하며, 전송 전까지는 모든 것을 통제하고 수정할 수 있는 여유가 있음을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to click (to부정사): 부사적 용법으로, &#39;클릭하기 전에&#39;라는 시간적 의미를 나타내는 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">happen</td><td class=\"m\">일어나다, 발생하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">있을 수 있습니다</span><span class=\"en\"><b><span class=\"grammar-hl\">There can be</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">잘못된 철자나</span><span class=\"en\"><b>misspellings</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사실의 오류가</span><span class=\"en\"><b>or errors of fact</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분의 글에는</span><span class=\"en\"><b>in your writing.</b></span></div></div><div class=\"lec-sent-ko\">여러분의 글에는 잘못된 철자나 사실의 오류가 있을 수 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 실수가 발생할 수 있는 구체적인 가능성을 언급하여, 검토 과정이 왜 필요한지에 대한 실질적인 이유를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">There can be (도치): 유도부사 There로 시작하여 주어(misspellings or errors)와 동사(can be)의 위치가 바뀐 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">misspelling</td><td class=\"m\">철자 오류, 잘못된 철자</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러나</span><span class=\"en\"><b>However,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">상관없습니다</span><span class=\"en\"><b>it doesn’t matter</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">누르지 않으면</span><span class=\"en\"><b>if you don’t click</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">보내기 버튼을</span><span class=\"en\"><b>the Send button.</b></span></div></div><div class=\"lec-sent-ko\">그러나 보내기 버튼을 누르지 않으면 상관없습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 실수 가능성을 수용하되, &#39;전송하지 않은 상태&#39;라는 안전한 상황에서는 그 실수가 수정 가능한 상태임을 알려줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to click (to부정사): if절 내부에서 명사적/부사적 의도로 사용된 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">it doesn’t matter</td><td class=\"m\">상관없다, 중요하지 않다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">왜일까요?</span><span class=\"en\"><b><span class=\"grammar-hl\">Why?</span></b></span></div></div><div class=\"lec-sent-ko\">왜일까요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자의 주의를 환기하여 뒤에 이어질 해결책과 그 논리에 집중하게 만드는 질문입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Why? 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">시간을 내서</span><span class=\"en\"><b>You can take some time</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">실수를 수정할 수 있으니까요.</span><span class=\"en\"><b><span class=\"grammar-hl\">to fix</span> mistakes.</b></span></div></div><div class=\"lec-sent-ko\">시간을 내서 실수를 수정할 수 있으니까요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 실수를 고칠 수 있는 시간적 여유가 우리에게 있다는 사실을 통해 신중함의 가치를 부각합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to fix (to부정사): take(취하다)라는 동사 뒤에서 &#39;수정하기 위해(시간을 쓰다)&#39;라는 부사적 목적의 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그리고 아무도</span><span class=\"en\"><b>And nobody</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">알 수 없을 것입니다</span><span class=\"en\"><b><span class=\"grammar-hl\">will be able to know</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 차이를</span><span class=\"en\"><b>the difference.</b></span></div></div><div class=\"lec-sent-ko\">그리고 아무도 그 차이를 알 수 없을 것입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 실수를 고쳐서 보냈을 때 상대방은 완벽한 결과물만 보게 되므로, 나의 실수를 들킬 염려가 없다는 안심을 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">will be able to know (관용표현): &#39;be able to V&#39;는 &#39;~할 수 있다&#39;라는 의미로, 조동사 can과 같은 의미를 가지며 능력이나 가능성을 나타내는 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러니</span><span class=\"en\"><b>So,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">절대로 급하게 ~하지 마십시오</span><span class=\"en\"><b>never hurry</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">누르지</span><span class=\"en\"><b><span class=\"grammar-hl\">to click</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">보내기 버튼을</span><span class=\"en\"><b>the Send button.</b></span></div></div><div class=\"lec-sent-ko\">그러니 보내기 버튼을 절대로 급하게 누르지 마십시오.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 근거들을 바탕으로 독자에게 서두르지 말 것을 다시 한번 강력하게 권고합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to click (to부정사): hurry라는 동사 뒤에서 &#39;클릭하는 것을 서두르다&#39;와 같이 동작의 방향성을 제시하는 부사적 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">hurry</td><td class=\"m\">서두르다, 재촉하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">다시 보고 수정하는 것이</span><span class=\"en\"><b><span class=\"grammar-hl\">Looking again</span> and <span class=\"grammar-hl\">fixing</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우선이고</span><span class=\"en\"><b>should come first;</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">보내는 것이</span><span class=\"en\"><b><span class=\"grammar-hl\">sending</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나중에 와야 합니다.</span><span class=\"en\"><b>should come later.</b></span></div></div><div class=\"lec-sent-ko\">다시 보고 수정하는 것이 우선이고 보내는 것이 나중에 와야 합니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 업무나 연락의 순서를 명확히 정해주며, 효율적이고 정확한 커뮤니케이션을 위한 구체적인 방법론을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Looking again (동명사): 문장의 주어 역할을 하며, &#39;다시 보는 것&#39;이라는 행위를 명사화한 구조입니다.</div><div class=\"lec-gr-item\">fixing (동명사): 문장의 주어 역할을 하며, &#39;수정하는 것&#39;이라는 행위를 명사화한 구조입니다.</div><div class=\"lec-gr-item\">sending (동명사): 문장의 주어 역할을 하며, &#39;보내는 것&#39;이라는 행위를 명사화한 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">come first</td><td class=\"m\">우선이다, 가장 중요하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">실수를 발견하면</span><span class=\"en\"><b>If you see any mistakes</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이메일을 보낸 후에</span><span class=\"en\"><b>after <span class=\"grammar-hl\">sending</span> an email,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">될 수 있습니다</span><span class=\"en\"><b>it can be</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">큰 문제가</span><span class=\"en\"><b>a big problem.</b></span></div></div><div class=\"lec-sent-ko\">이메일을 보낸 후에 실수를 발견하면 큰 문제가 될 수 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 반대로 신중하지 못했을 때 겪게 될 부정적인 결과를 보여주어, 앞선 권고 사항의 중요성을 뒷받침합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">sending (동명사): 전치사 after의 목적어 자리에서 &#39;보내는 것&#39;이라는 행위를 나타내는 명사적 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 11 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">따라서</span><span class=\"en\"><b>So,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">잊지 마십시오</span><span class=\"en\"><b>don’t forget</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">글을 주의 깊게 읽는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">to read</span> your writing carefully</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">누르기 전에</span><span class=\"en\"><b>before you click</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">보내기 버튼을</span><span class=\"en\"><b>the Send button.</b></span></div></div><div class=\"lec-sent-ko\">따라서 보내기 버튼을 누르기 전에 글을 주의 깊게 읽는 것을 잊지 마십시오.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 본문의 핵심 메시지를 요약하며 다시 한번 주의 깊은 검토를 당부합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to read (to부정사): 동사 forget의 목적어 자리에 위치하여 &#39;~할 것을 잊다&#39;라는 의미를 완성하는 명사적 용법의 구조입니다.</div><div class=\"lec-gr-item\">to click (to부정사): before절 내에서 시간적 배경을 설명하는 부사적 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 12 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">경우에도 마찬가지입니다</span><span class=\"en\"><b>The same goes for</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">학교 과제나 업무 서신을 보내는</span><span class=\"en\"><b><span class=\"grammar-hl\">sending school assignments or business letters</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이메일로</span><span class=\"en\"><b>by email.</b></span></div></div><div class=\"lec-sent-ko\">이메일로 학교 과제나 업무 서신을 보내는 경우에도 마찬가지입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 원칙이 단순한 이메일을 넘어 공식적인 문서 등 다양한 상황에도 공통으로 적용되는 규칙임을 명시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">sending school assignments or business letters (동명사): 전치사 for의 목적어 역할을 하며, &#39;과제나 편지를 보내는 것&#39;이라는 행위를 명사화한 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">the same goes for</td><td class=\"m\">~도 마찬가지이다</td></tr><tr><td class=\"w\">assignment</td><td class=\"m\">과제, 임무</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>이메일 전송 버튼을 누르기 전에는 수정할 시간이 충분하다.</li><li>실수를 발견하고 고치는 것이 전송하는 것보다 우선순위가 높다.</li><li>전송 후의 실수는 큰 문제를 일으킬 수 있으므로 꼼꼼한 검토가 필수적이다.</li><li>이러한 원칙은 일상적 연락뿐 아니라 과제나 비즈니스 상황에도 똑같이 적용된다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">One should carefully review emails for errors before sending them, as this habit prevents problems that occur after the Send button is clicked.</div>\n              <div class=\"lec-final-sum-ko\">이메일을 전송 버튼을 누른 후 발생하는 문제를 예방하기 위해, 보내기 전에 오류를 꼼꼼히 검토해야 한다.</div></div></div>"],"segs":[[{"audio":"./reading08_audio/1.mp3","hl":null}],[{"audio":"./reading08_audio/2.mp3","hl":null}],[{"audio":"./reading08_audio/3.mp3","hl":null},{"audio":"./reading08_audio/4.mp3","hl":"stage-0"},{"audio":"./reading08_audio/5.mp3","hl":"stage-1"},{"audio":"./reading08_audio/6.mp3","hl":"stage-2"},{"audio":"./reading08_audio/7.mp3","hl":"stage-3"}],[{"audio":"./reading08_audio/8.mp3","hl":null}],[{"audio":"./reading08_audio/9.mp3","hl":"main"},{"audio":"./reading
