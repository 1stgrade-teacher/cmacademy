<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터1 Reading 08 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터1 Reading 08","audioDir":"reading08_audio","preview":false,"count":49,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.668em\">Reading\u003cbr>08\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터1\u003c/div>\u003ch1>Read It Again Before You Hit Send\u003c/h1>\u003ch2>보내기 전에 다시 읽는 습관\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>이메일을 보낼 때는 \u003cb class=\"key\">보내기 \u003c/b>\u003cb class=\"key\">버튼\u003c/b>을 바로 누르지 말고, 시간을 내서 \u003cb class=\"key\">철자 \u003c/b>\u003cb class=\"key\">오류\u003c/b>나 사실의 오류를 수정해야 한다. 다시 보고 고치는 것이 우선이고 보내는 것은 나중이며, 보낸 뒤에 실수를 발견하면 \u003cb class=\"key\">큰 \u003c/b>\u003cb class=\"key\">문제\u003c/b>가 될 수 있으므로 누르기 전에 글을 주의 깊게 읽어야 한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>You should take time to look again and fix mistakes before clicking the Send button, because errors found after sending can become a big problem.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 이메일을 보낼 때의 습관에 관한 글이에요. 핵심은 아주 단순합니다. 보내기 버튼을 누르기 전에 잠깐 멈추고 다시 읽어 보라는 것이죠. 이 글은 그렇게 해야 하는 이유를 차분하게 하나씩 설명하고 있어요. 요지는 다시 보고 고치는 일이 먼저이고 보내는 일은 나중이라는 것입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">우리는 하루에도 여러 번 이메일과 메시지를 보낸다. 그런데 \u003cb class=\"key\">보내기 \u003c/b>\u003cb class=\"key\">버튼\u003c/b>을 누르는 순간 그 글은 되돌릴 수 없이 상대방에게 전달된다. 그래서 보내기 전에 오류를 찾아 고치는 습관이 중요하며, 이런 교정 작업을 \u003cb class=\"key\">proofreading\u003c/b>이라고 부른다. 결정을 잠시 미루는 시간을 \u003cb class=\"key\">cooling-off \u003c/b>\u003cb class=\"key\">period\u003c/b>라고 하는데, 이메일을 보내기 전의 짧은 점검도 같은 역할을 한다. 요리로 비유하면 간을 보기도 전에 소금을 더 넣지 않는 것과 같다. 한 번 넣으면 되돌릴 수 없기 때문이다.\u003c/div>","segs":[{"n":2,"text":"우리는 하루에도 몇 번씩 이메일이나 메시지를 보내죠. 그런데 보내기 버튼을 누르는 순간 그 글은 되돌릴 수 없이 상대방에게 날아갑니다. 그래서 많은 회사와 기관에서는 보내기 전에 한 번 더 확인하는 습관을 강조해요. 이렇게 글의 오류를 찾아 고치는 작업을 영어로 proofreading이라고 부릅니다. 또 결정을 잠시 미루는 시간을 cooling-off period라고 하는데, 이메일을 보내기 전의 짧은 망설임도 같은 역할을 하죠. 요리로 비유하면 간을 보기도 전에 소금을 더 넣지 않는 것과 같아요. 한 번 넣으면 되돌릴 수 없으니까요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>보내기 버튼, 잠깐!\u003csmall>주장 · 문장 1\u003c/small>\u003c/h4>\u003cp>글은 이메일을 보낼 때 \u003cb class=\"key\">보내기 \u003c/b>\u003cb class=\"key\">버튼\u003c/b>을 바로 누르지 말라고 시작합니다. 첫 문장에서 핵심 행동을 부정 명령으로 못 박아 두죠. 독자는 왜 그래야 하는지 궁금해지면서 글 속으로 들어가게 됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>기다려도 손해 없다\u003csmall>근거 · 문장 2–7\u003c/small>\u003c/h4>\u003cp>보내기 버튼을 누르기 전에는 \u003cb class=\"key\">끔찍한 \u003c/b>\u003cb class=\"key\">일\u003c/b>이 일어나지 않는다고 안심시킵니다. 글에는 \u003cb class=\"key\">철자 \u003c/b>\u003cb class=\"key\">오류\u003c/b>나 사실의 오류가 있을 수 있지만 누르지 않으면 상관없다는 것이죠. 왜냐하면 시간을 내서 \u003cb class=\"key\">실수를 \u003c/b>\u003cb class=\"key\">수정\u003c/b>할 수 있고, 아무도 그 차이를 알 수 없기 때문입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>다시 보기가 먼저\u003csmall>전환 · 문장 8–9\u003c/small>\u003c/h4>\u003cp>그래서 보내기 버튼을 절대로 급하게 누르지 말라고 \u003cb class=\"key\">강조\u003c/b>합니다. 다시 보고 수정하는 것이 우선이고 보내는 것은 나중에 와야 한다는 순서를 제시하죠. 행동의 \u003cb class=\"key\">우선순위\u003c/b>를 분명히 밝히는 대목입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>보낸 뒤엔 늦다\u003csmall>반례 · 문장 10\u003c/small>\u003c/h4>\u003cp>이메일을 보낸 후에 실수를 발견하면 \u003cb class=\"key\">큰 \u003c/b>\u003cb class=\"key\">문제\u003c/b>가 될 수 있다고 경고합니다. 앞에서 말한 '누르지 않으면 괜찮다'는 주장의 \u003cb class=\"key\">반대 \u003c/b>\u003cb class=\"key\">상황\u003c/b>을 보여 주는 셈이죠. 그래서 잠깐 미루는 시간이 아깝지 않다는 점이 더 설득력 있게 다가옵니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>모든 글에 똑같이\u003csmall>결론 · 문장 11–12\u003c/small>\u003c/h4>\u003cp>따라서 보내기 버튼을 누르기 전에 글을 \u003cb class=\"key\">주의 \u003c/b>\u003cb class=\"key\">깊게 \u003c/b>\u003cb class=\"key\">읽는 \u003c/b>\u003cb class=\"key\">것\u003c/b>을 잊지 말라고 당부합니다. 그리고 이메일로 학교 과제나 업무 서신을 보내는 경우에도 \u003cb class=\"key\">마찬가지\u003c/b>라고 범위를 넓힙니다. 하나의 습관을 \u003cb class=\"key\">일반 \u003c/b>\u003cb class=\"key\">원칙\u003c/b>으로 확장하며 글을 맺습니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 지문의 흐름을 함께 따라가 볼게요.","hl":null},{"n":4,"text":"글은 첫 문장에서 바로 요구합니다. 이메일을 보낼 때 보내기 버튼을 바로 누르지 말라고요. 핵심 행동을 부정 명령으로 못 박아 두는 아주 강한 출발이에요. 독자는 자연스럽게 왜 그래야 하는지 궁금해집니다.","hl":"f0"},{"n":5,"text":"그다음에는 안심시키는 근거가 이어집니다. 보내기 버튼을 누르기 전에는 끔찍한 일이 일어나지 않는다고 말하죠. 여러분의 글에는 철자 오류나 사실의 오류가 있을 수 있지만, 누르지 않으면 아무 문제가 없다는 겁니다. 왜냐하면 시간을 내서 실수를 수정할 수 있고, 아무도 그 차이를 알 수 없기 때문이에요.","hl":"f1"},{"n":6,"text":"그래서 글은 보내기 버튼을 절대로 급하게 누르지 말라고 강조합니다. 다시 보고 수정하는 것이 우선이고, 보내는 것은 나중에 와야 한다고 순서를 정해 주죠. 여기서 행동의 우선순위가 아주 분명해집니다.","hl":"f2"},{"n":7,"text":"그다음에는 반대 상황을 보여 줍니다. 이메일을 보낸 후에 실수를 발견하면 큰 문제가 될 수 있다고 경고해요. 앞에서 누르지 않으면 괜찮다고 했으니, 누른 뒤에는 이미 늦는다는 점이 더 또렷하게 다가옵니다.","hl":"f3"},{"n":8,"text":"마지막은 당부와 확장이에요. 보내기 버튼을 누르기 전에 글을 주의 깊게 읽는 것을 잊지 말라고 합니다. 그리고 학교 과제나 업무 서신을 보낼 때도 마찬가지라고 범위를 넓히죠. 하나의 습관을 일반 원칙으로 키워서 글을 맺습니다.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 \u003cb class=\"key\">보내기 \u003c/b>\u003cb class=\"key\">버튼\u003c/b>을 바로 누르지 말라는 주장을 먼저 제시합니다. 이어서 그렇게 해도 되는 이유와 \u003cb class=\"key\">실수를 \u003c/b>\u003cb class=\"key\">수정\u003c/b>할 시간이라는 근거를 댑니다. 그리고 보낸 뒤에 실수를 발견하면 큰 문제가 된다는 \u003cb class=\"key\">반례\u003c/b>로 주장을 단단하게 만들죠. 마지막에는 같은 주장을 넓혀 \u003cb class=\"key\">일반 \u003c/b>\u003cb class=\"key\">원칙\u003c/b>으로 반복하므로 두괄식 주장-근거 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>However (4)\u003c/b>\u003cspan>전환\u003c/span>\u003cb>Why? (5)\u003c/b>\u003cspan>질문 제시\u003c/span>\u003cb>So (8)\u003c/b>\u003cspan>정리·강조\u003c/span>\u003cb>If (10)\u003c/b>\u003cspan>조건·반례 제시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Don't click the Send button right away\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">never hurry to click the Send button\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">sending should come later\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">read your writing carefully before you click the Send button\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>보내기 전 (before sending)\u003c/th>\u003cth>보낸 후 (after sending)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>시간을 내서 실수를 수정할 수 있음\u003c/td>\u003ctd>실수를 발견하면 큰 문제가 될 수 있음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>아무도 그 차이를 알 수 없음\u003c/td>\u003ctd>이미 상대방에게 전달된 뒤임\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글은 주장과 근거로 이루어져 있어요. 첫 문장에서 보내지 말라는 주장을 먼저 던지고, 그 뒤에 이유와 사례를 붙입니다. 그래서 결론이 맨 앞에 오는 두괄식 구성이에요. 독자는 첫 문장만 붙잡아도 글의 방향을 놓치지 않습니다.","hl":"ty"},{"n":10,"text":"신호어를 눈여겨보세요. However가 나오면 앞의 걱정을 뒤집는 전환이 일어나고, Why라는 질문 뒤에는 그 이유가 따라옵니다. If는 조건을 걸어 반대 상황을 보여 주는 표시예요. 같은 내용이 표현만 바뀌어 반복되는 것도 꼭 짚어야 합니다. 처음의 보내기 버튼을 누르지 말라는 말이 마지막에는 글을 주의 깊게 읽으라는 말로 바뀌어 다시 나오니까요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>click\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(버튼을) 누르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>right away\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>즉시, 곧바로\u003c/span>\u003c/div>\u003cdiv>\u003cb>terrible\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>끔찍한, 형편없는\u003c/span>\u003c/div>\u003cdiv>\u003cb>happen\u003c/b>\u003cem>동사\u003c/em>\u003cspan>일어나다, 발생하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>misspelling\u003c/b>\u003cem>명사\u003c/em>\u003cspan>철자 오류, 잘못된 철자\u003c/span>\u003c/div>\u003cdiv>\u003cb>error\u003c/b>\u003cem>명사\u003c/em>\u003cspan>오류, 잘못\u003c/span>\u003c/div>\u003cdiv>\u003cb>fact\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사실\u003c/span>\u003c/div>\u003cdiv>\u003cb>however\u003c/b>\u003cem>부사\u003c/em>\u003cspan>그러나, 하지만\u003c/span>\u003c/div>\u003cdiv>\u003cb>matter\u003c/b>\u003cem>동사\u003c/em>\u003cspan>문제가 되다, 중요하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>take some time\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>시간을 좀 내다, 들이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>fix\u003c/b>\u003cem>동사\u003c/em>\u003cspan>고치다, 수정하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>mistake\u003c/b>\u003cem>명사\u003c/em>\u003cspan>실수, 오류\u003c/span>\u003c/div>\u003cdiv>\u003cb>be able to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~할 수 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>difference\u003c/b>\u003cem>명사\u003c/em>\u003cspan>차이\u003c/span>\u003c/div>\u003cdiv>\u003cb>hurry\u003c/b>\u003cem>동사\u003c/em>\u003cspan>서두르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>look again\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>다시 보다\u003c/span>\u003c/div>\u003cdiv>\u003cb>come first\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>우선이다, 먼저 오다\u003c/span>\u003c/div>\u003cdiv>\u003cb>problem\u003c/b>\u003cem>명사\u003c/em>\u003cspan>문제\u003c/span>\u003c/div>\u003cdiv>\u003cb>forget\u003c/b>\u003cem>동사\u003c/em>\u003cspan>잊다\u003c/span>\u003c/div>\u003cdiv>\u003cb>carefully\u003c/b>\u003cem>부사\u003c/em>\u003cspan>주의 깊게, 신중하게\u003c/span>\u003c/div>\u003cdiv>\u003cb>before\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~전에\u003c/span>\u003c/div>\u003cdiv>\u003cb>the same goes for\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~도 마찬가지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>assignment\u003c/b>\u003cem>명사\u003c/em>\u003cspan>과제\u003c/span>\u003c/div>\u003cdiv>\u003cb>business letter\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>업무 서신\u003c/span>\u003c/div>\u003cdiv>\u003cb>writing\u003c/b>\u003cem>명사\u003c/em>\u003cspan>글, 작성한 내용\u003c/span>\u003c/div>\u003cdiv>\u003cb>nobody\u003c/b>\u003cem>명사\u003c/em>\u003cspan>아무도 (~않다)\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"단어는 몇 개만 짚어 볼게요. click은 버튼을 누르다는 뜻이고, right away는 즉시, 곧바로라는 표현이에요. misspelling은 철자 오류, error는 일반적인 오류를 말하죠. fix는 고치다, 수정하다는 뜻으로 이 글 전체를 관통하는 핵심 동사입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">fix\u003c/b>\u003cspan class=\"m\">고치다, 수정하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">repair\u003c/span>\u003cspan class=\"s\">correct\u003c/span>\u003cspan class=\"s\">mend\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">break\u003c/span>\u003cspan class=\"a\">damage\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">mistake\u003c/b>\u003cspan class=\"m\">실수, 오류\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">error\u003c/span>\u003cspan class=\"s\">fault\u003c/span>\u003cspan class=\"s\">slip\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">accuracy\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">hurry\u003c/b>\u003cspan class=\"m\">서두르다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">rush\u003c/span>\u003cspan class=\"s\">hasten\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">delay\u003c/span>\u003cspan class=\"a\">slow down\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">terrible\u003c/b>\u003cspan class=\"m\">끔찍한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">awful\u003c/span>\u003cspan class=\"s\">horrible\u003c/span>\u003cspan class=\"s\">dreadful\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">wonderful\u003c/span>\u003cspan class=\"a\">pleasant\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">carefully\u003c/b>\u003cspan class=\"m\">주의 깊게\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">cautiously\u003c/span>\u003cspan class=\"s\">attentively\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">carelessly\u003c/span>\u003cspan class=\"a\">recklessly\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">right away\u003c/b>\u003cspan class=\"m\">즉시, 곧바로\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">immediately\u003c/span>\u003cspan class=\"s\">at once\u003c/span>\u003cspan class=\"s\">instantly\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">later\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">problem\u003c/b>\u003cspan class=\"m\">문제\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">trouble\u003c/span>\u003cspan class=\"s\">issue\u003c/span>\u003cspan class=\"s\">difficulty\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">solution\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어도 정리해 볼게요. fix는 repair, correct와 가깝고, 반대로 break나 damage와는 반대말이에요. hurry는 rush, hasten과 비슷하고 delay와는 반대됩니다. terrible은 awful, horrible과 통하고 wonderful과는 정반대죠. carefully는 cautiously, attentively와 가깝고 carelessly와는 반대예요. mistake는 error, fault와 같은 말로 기억해 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">누르지 마십시오\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Don't \u003c/span>\u003cspan class=\"tgt\">click\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보내기 버튼을\u003c/span>\u003cspan class=\"en\">the Send button\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바로\u003c/span>\u003cspan class=\"en\">right away\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이메일을 보낼 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">send \u003c/span>\u003cspan class=\"tgt\">emails\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이메일을 보낼 때 보내기 버튼을 바로 누르지 마십시오.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글 전체를 이끄는 \u003cb class=\"key\">주제 \u003c/b>\u003cb class=\"key\">문장\u003c/b>으로, 이메일을 보낼 때 보내기 버튼을 바로 누르지 말라는 핵심 조언을 먼저 던지고 있어요. right away는 '바로, 즉시'라는 뜻으로, 서두르지 말라는 뒤 문장의 흐름과 자연스럽게 이어집니다. when you send emails는 '이메일을 보낼 때'라는 상황을 알려 주는 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">부사절\u003c/b>이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정 명령문\u003c/span> : Don't + [동사원형] (~하지 마라) : \"누르지 마십시오\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">시간 부사절(when)\u003c/span> : when + [주어] + [동사] (시간의 접속사절) : \"이메일을 보낼 때\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"Don't click, 누르지 마십시오. the Send button, 보내기 버튼을. right away, 바로. when you send emails, 이메일을 보낼 때. 이 문장 전체를 해석하면, 이메일을 보낼 때 보내기 버튼을 바로 누르지 마십시오.","hl":"m"},{"n":14,"text":"이 문장은 글의 주제 문장이에요. 이메일을 보낼 때 보내기 버튼을 바로 누르지 말라고 핵심 조언을 먼저 던지는 거죠. right away는 바로, 즉시라는 뜻이라서 서두르지 말라는 뒤 내용과 자연스럽게 이어집니다.","hl":"mn"},{"n":15,"text":"첫 번째, Don't click은 동사원형으로 시작하는 부정 명령문이에요. 상대에게 하지 말라고 금지할 때 Don't를 앞에 붙이는 거죠. 두 번째, when you send emails는 시간 부사절이고, 시간 부사절 안에서는 미래의 일도 현재시제로 쓴다는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">끔찍한 일은 아무것도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Nothing \u003c/span>\u003cspan class=\"tgt\">terrible\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일어나지 않을 것입니다\u003c/span>\u003cspan class=\"en\">will happen\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">누르기 전에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">before \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">click \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보내기 버튼을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">Send \u003c/span>\u003cspan class=\"tgt\">button\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">보내기 버튼을 누르기 전에는 끔찍한 일이 일어나지 않을 것입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 보내기 버튼을 누르기 전에는 아무 문제도 생기지 않으니, 충분히 시간을 두고 고칠 수 있다는 뜻이에요. Nothing terrible은 '끔찍한 일은 아무것도'라는 뜻으로 형용사 terrible이 뒤에서 명사를 꾸미는 \u003cb class=\"key\">후치수식\u003c/b> 형태입니다. before you click은 '누르기 전에'라는 조건을 제시하는 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">부사절\u003c/b>로, 주절보다 먼저 일어나는 일이라 현재시제를 썼어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">형용사의 후치 수식(something/nothing류)\u003c/span> : Nothing + [형용사] (부정대명사를 뒤에서 수식) : \"끔찍한 일은 아무것도\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">시간 부사절(before)\u003c/span> : before + [주어] + [동사] (~하기 전에) : \"보내기 버튼을 누르기 전에\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"Nothing terrible, 끔찍한 일은 아무것도. will happen, 일어나지 않을 것입니다. before you click, 누르기 전에. the Send button, 보내기 버튼을. 이 문장 전체를 해석하면, 보내기 버튼을 누르기 전에는 끔찍한 일이 일어나지 않을 것입니다.","hl":"m"},{"n":17,"text":"이 문장은 보내기 버튼을 누르기 전이라면 아무 문제도 생기지 않는다고 말해요. 그러니 마음 놓고 시간을 두고 고칠 수 있다는 뜻이죠. 앞 문장의 조언에 이유를 붙여 주는 역할을 합니다.","hl":"mn"},{"n":18,"text":"첫 번째, Nothing terrible을 보세요. something이나 nothing 같은 부정대명사는 형용사가 뒤에서 꾸며 주는 후치수식을 해요. 두 번째, before you click은 시간 접속사 before가 이끄는 시간 부사절이고, 주절보다 먼저 일어나는 일이라 현재시제 click을 씁니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">있을 수 있습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">be\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">잘못된 철자나 사실의 오류가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">misspellings \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">errors \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">fact\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분의 글에는\u003c/span>\u003cspan class=\"en\">in your writing.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여러분의 글에는 잘못된 철자나 사실의 오류가 있을 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 여러분이 쓴 글에는 철자 실수나 사실 관계의 오류가 들어 있을 수 있다는 뜻이에요. There can be는 '~이 있을 수 있다'라는 \u003cb class=\"key\">유도부사\u003c/b> 구문으로, 진짜 주어는 뒤에 오는 misspellings or errors of fact입니다. misspellings와 errors of fact가 or로 묶인 \u003cb class=\"key\">병렬 \u003c/b>\u003cb class=\"key\">구조\u003c/b>라는 점도 눈여겨보세요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">유도부사 there + be동사 구문\u003c/span> : There + [be동사] + [주어] (~이 있다) : \"~이 있을 수 있습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">or에 의한 병렬 구조\u003c/span> : [명사] or [명사] (대등한 요소의 병렬) : \"잘못된 철자나 사실의 오류\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"There can be, 있을 수 있습니다. misspellings or errors of fact, 잘못된 철자나 사실의 오류가. in your writing, 여러분의 글에는. 이 문장 전체를 해석하면, 여러분의 글에는 잘못된 철자나 사실의 오류가 있을 수 있습니다.","hl":"m"},{"n":20,"text":"이 문장은 여러분이 쓴 글에 철자 실수나 사실 관계의 오류가 들어 있을 수 있다고 말해요. 그래서 보내기 전에 다시 확인해야 한다는 앞뒤 흐름을 받쳐 주는 문장입니다.","hl":"mn"},{"n":21,"text":"첫 번째, There can be는 유도부사 there 구문이에요. 뒤에 오는 명사가 진짜 주어이고, can이 붙어서 있을 수 있다는 가능성을 나타냅니다. 두 번째, misspellings or errors of fact는 or로 두 명사를 대등하게 이은 병렬 구조이고, of fact는 errors를 뒤에서 꾸며 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나\u003c/span>\u003cspan class=\"en\">However,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상관없습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">doesn't \u003c/span>\u003cspan class=\"tgt\">matter\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 당신이 누르지 않는다면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">if \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003cspan class=\"tgt\">click \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보내기 버튼을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">Send \u003c/span>\u003cspan class=\"tgt\">button\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 보내기 버튼을 누르지 않으면 상관없습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 이메일에 오타나 사실 오류가 있을 수 있다고 했지만, 아직 \u003cb class=\"key\">보내기 \u003c/b>\u003cb class=\"key\">버튼\u003c/b>을 누르지 않았다면 걱정할 필요가 없다는 뜻이에요. 즉 \u003cb class=\"key\">전송 \u003c/b>\u003cb class=\"key\">전\u003c/b>이라면 실수는 얼마든지 고칠 수 있는 상태라는 것을 강조하는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">비인칭 대명사 it (가주어적 쓰임)\u003c/span> : It doesn't matter + [if절] : \"~해도 상관없다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">if 조건의 부사절\u003c/span> : if + [주어] + [동사] , [주절] : \"만약 당신이 보내기 버튼을 누르지 않는다면\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"However, 그러나. it doesn't matter, 상관없습니다. if you don't click, 만약 당신이 누르지 않는다면. the Send button, 보내기 버튼을. 이 문장 전체를 해석하면, 그러나 보내기 버튼을 누르지 않으면 상관없습니다.","hl":"m"},{"n":23,"text":"앞에서 오타나 사실 오류가 있을 수 있다고 했죠. 하지만 아직 보내기 버튼을 누르지 않았다면 전혀 문제되지 않아요. 전송 전이라는 상태가 실수를 고칠 수 있는 여유를 준다는 점을 기억하세요.","hl":"mn"},{"n":24,"text":"첫 번째로 it doesn't matter의 it은 특정 사물을 가리키는 게 아니라 막연한 상황을 받는 비인칭 it이에요. 두 번째로 뒤에 오는 if you don't click the Send button은 조건을 나타내는 부사절이고, 미래 상황이어도 현재시제 don't를 쓴다는 점을 짚어 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜일까요?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Why?\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">왜일까요?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 '보내기 버튼을 누르지 않으면 상관없다'고 했으니, 그 이유가 무엇인지 독자에게 \u003cb class=\"key\">질문\u003c/b>을 던지는 문장이에요. 다음 문장에서 그 \u003cb class=\"key\">이유\u003c/b>가 바로 제시되는 글의 연결 장치 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문사 단독 사용(생략 구문)\u003c/span> : Why (do you think so)? : \"왜일까요?\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"Why?, 왜일까요?. 이 문장 전체를 해석하면, 왜일까요?","hl":"m"},{"n":26,"text":"바로 앞에서 보내기 버튼을 누르지 않으면 상관없다고 했죠. 그러면 독자는 당연히 왜 그런지 궁금해져요. 이 한 단어짜리 질문이 다음 문장의 이유 설명으로 자연스럽게 이어 주는 다리 역할을 합니다.","hl":"mn"},{"n":27,"text":"여기서 Why는 완전한 의문문에서 되풀이되는 부분을 생략하고 의문사만 남긴 형태예요. 앞 문장의 내용을 그대로 이어받아 왜 그런지 되묻는 생략 표현이라고 설명해 주세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 시간을 좀 낼 수 있습니다\u003c/span>\u003cspan class=\"en\">You \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">take\u003c/span> some time\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">실수를 수정하기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">fix \u003c/span>\u003cspan class=\"tgt\">mistakes\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">시간을 내서 실수를 수정할 수 있으니까요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞의 '왜?'에 대한 답으로, 전송 전에는 \u003cb class=\"key\">시간을 \u003c/b>\u003cb class=\"key\">내서\u003c/b> 오타나 사실 오류 같은 \u003cb class=\"key\">실수를 \u003c/b>\u003cb class=\"key\">수정\u003c/b>할 수 있다는 뜻이에요. 즉 보내기 전에 기다리는 것이 실수를 고칠 기회를 준다는 글의 핵심 이유를 제시하는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 can (가능)\u003c/span> : [주어] + can + [동사원형] : \"~할 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : [주어] + [동사] + [to + 동사원형 (목적)] : \"실수를 수정하기 위해\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"You can take some time, 당신은 시간을 좀 낼 수 있습니다. to fix mistakes, 실수를 수정하기 위해. 이 문장 전체를 해석하면, 시간을 내서 실수를 수정할 수 있으니까요.","hl":"m"},{"n":29,"text":"왜 상관없냐고 물었죠. 아직 보내지 않았으니까 시간을 좀 낼 수 있고, 그 시간에 실수를 수정할 수 있기 때문이에요. 기다림이 곧 오류를 바로잡을 기회라는 점이 이 글의 핵심 이유입니다.","hl":"mn"},{"n":30,"text":"첫 번째로 to fix mistakes에서 to부정사가 '실수를 수정하기 위해'라는 목적을 나타내고 있어요. 두 번째로 can take의 can은 '할 수 있다'라는 가능의 조동사이고, 조동사 뒤에는 동사원형 take가 온다는 규칙을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 아무도\u003c/span>\u003cspan class=\"en\">And \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">nobody\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~할 수 있을 것입니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">able \u003c/span>\u003cspan class=\"tgt\">to\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 차이를 알 수 없을 것입니다\u003c/span>\u003cspan class=\"en\">know the difference.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그리고 아무도 그 차이를 알 수 없을 것입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 여기서 말하는 차이는 메일을 바로 보냈는지, 아니면 시간을 두고 고쳐서 보냈는지 그 차이예요. 받는 사람은 \u003cb class=\"key\">완성된 \u003c/b>\u003cb class=\"key\">결과\u003c/b>만 보게 되니 내 \u003cb class=\"key\">수정 \u003c/b>\u003cb class=\"key\">과정\u003c/b>은 알 수 없다는 뜻이죠. 그래서 서두를 이유가 없다는 흐름을 만들어 주는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정대명사 주어\u003c/span> : [Nobody + 동사] = 아무도 ~하지 않다(추가 부정 불필요) : \"아무도 …않을 것입니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be able to (능력·가능 표현)\u003c/span> : [조동사 will] + [be able to + 동사원형] : \"~할 수 있을 것입니다\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"And nobody, 그리고 아무도. will be able to, ~할 수 있을 것입니다. know the difference, 그 차이를 알 수 없을 것입니다. 이 문장 전체를 해석하면, 그리고 아무도 그 차이를 알 수 없을 것입니다.","hl":"m"},{"n":32,"text":"여기서 말하는 차이는 바로 보낸 메일과 고쳐서 보낸 메일의 차이예요. 받는 사람은 완성된 결과만 보게 되니까 내 수정 과정은 알 수 없다는 뜻이죠. 그래서 이 문장은 서두를 이유가 없다는 흐름을 자연스럽게 만들어 줍니다.","hl":"mn"},{"n":33,"text":"첫 번째, nobody를 보세요. nobody 안에 이미 부정의 뜻이 있어서 뒤에 not을 또 붙이면 이중 부정이 되고 뜻이 반대로 뒤집혀요. 두 번째, will be able to는 미래에 할 수 있다는 뜻을 만들 때 will can 대신 쓰는 표현이에요. 그래서 뒤에는 동사원형 know가 옵니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러니\u003c/span>\u003cspan class=\"en\">So,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">절대 급하게 서두르지 마십시오\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">never \u003c/span>\u003cspan class=\"tgt\">hurry\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보내기 버튼을 누르는 일에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">click\u003c/span> the Send button.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러니 보내기 버튼을 절대로 급하게 누르지 마십시오.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 이유를 다 설명했으니 이제 실천으로 옮기라는 \u003cb class=\"key\">명령\u003c/b>이에요. 보내기 전에 멈춰서 확인하라는 글쓴이의 \u003cb class=\"key\">실천 \u003c/b>\u003cb class=\"key\">지침\u003c/b>을 가장 직접적으로 보여 주는 문장이죠. 맨 앞의 So가 앞 내용과 \u003cb class=\"key\">원인과 \u003c/b>\u003cb class=\"key\">결과\u003c/b>로 이어진다는 신호를 주고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정 명령문(never + 동사원형)\u003c/span> : [Never + 동사원형] = [don't + 동사원형]보다 강한 금지 : \"절대 서두르지 마십시오\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사(hurry to do 관용 표현)\u003c/span> : [hurry + to + 동사원형] = ~하는 데 서두르다 : \"누르는 데 (서두르지 마십시오)\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"So, 그러니. never hurry, 절대 급하게 서두르지 마십시오. to click the Send button, 보내기 버튼을 누르는 일에. 이 문장 전체를 해석하면, 그러니 보내기 버튼을 절대로 급하게 누르지 마십시오.","hl":"m"},{"n":35,"text":"앞에서 이유를 다 설명했으니 이제 실천으로 옮기라는 명령이에요. 보내기 전에 멈춰서 확인하라는 실천 지침을 가장 직접적으로 보여 주는 문장이죠. 맨 앞의 So가 앞 내용과 원인과 결과로 이어진다는 신호를 주고 있습니다.","hl":"mn"},{"n":36,"text":"첫 번째, never hurry를 보세요. 명령문을 부정할 때 보통 don't를 쓰지만 never를 쓰면 강한 금지의 명령이 돼요. 그리고 never 뒤에는 언제나 동사원형이 온다는 것도 같이 기억해 두세요. 두 번째, hurry to click은 '누르는 일에 서두르다'라는 뜻이에요. hurry가 to부정사와 만나면 그 행동을 서둘러 한다는 의미가 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다시 보고 수정하는 것이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Looking \u003c/span>\u003cspan class=\"tgt\">again \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">fixing\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우선이어야 합니다;\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">should \u003c/span>\u003cspan class=\"tgt\">come \u003c/span>\u003cspan class=\"tgt\">first\u003c/span>;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보내는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">sending\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나중에 와야 합니다.\u003c/span>\u003cspan class=\"en\">should come later.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">다시 보고 수정하는 것이 우선이고 보내는 것이 나중에 와야 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글 전체의 결론을 한 줄로 압축한 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">문장\u003c/b>이에요. 다시 보고 고치는 일과 보내는 일 가운데 무엇이 먼저인지 \u003cb class=\"key\">우선순위\u003c/b>를 딱 정해 주죠. 세미콜론을 사이에 두고 앞과 뒤가 \u003cb class=\"key\">대조\u003c/b>를 이루면서 균형 있게 마무리됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사구 주어\u003c/span> : [동명사 + 목적어] and [동명사 + 목적어] + 단수 동사 : \"다시 보고 수정하는 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 should (당위·의무)\u003c/span> : [should + 동사원형] = ~해야 한다 : \"우선이어야 합니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동명사 주어(대조되는 두 번째 주어)\u003c/span> : [동명사 + 동사] ; [동명사 + 동사] : \"보내는 것은\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"Looking again and fixing, 다시 보고 수정하는 것이. should come first, 우선이어야 합니다;. sending, 보내는 것은. should come later, 나중에 와야 합니다.. 이 문장 전체를 해석하면, 다시 보고 수정하는 것이 우선이고 보내는 것이 나중에 와야 합니다.","hl":"m"},{"n":38,"text":"이 문장은 글의 결론을 한 줄로 압축한 핵심 문장이에요. 다시 보고 고치는 일과 보내는 일 중에 무엇이 먼저인지 우선순위를 딱 정해 주죠. 세미콜론을 사이에 두고 앞뒤가 대조를 이루면서 균형 있게 마무리됩니다.","hl":"mn"},{"n":39,"text":"첫 번째, 문장 앞의 Looking again and fixing은 동명사 주어예요. -ing로 시작하니까 명령문이 아니라 '~하는 것'이라는 주어로 봐야 하고, 동명사 주어는 단수 취급합니다. 두 번째, should come first에서 should는 당위를 나타내서 '우선이어야 한다'로 해석해요. 세 번째, 세미콜론 뒤의 sending도 동명사 주어인데, 앞의 fixing과 대조를 이루면서 '보내는 것은 나중에'라는 균형을 만들어 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 네가 어떤 실수들을 보게 된다면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">If \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">see \u003c/span>\u003cspan class=\"tgt\">any \u003c/span>\u003cspan class=\"tgt\">mistakes\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이메일을 보낸 후에,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">after \u003c/span>\u003cspan class=\"tgt\">sending \u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">email\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 큰 문제가 될 수 있습니다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">big \u003c/span>\u003cspan class=\"tgt\">problem\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이메일을 보낸 후에 실수를 발견하면 큰 문제가 될 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 '보내기 전에 다시 읽고 고쳐야 한다'고 했죠. 이 문장은 그 이유를 \u003cb class=\"key\">조건\u003c/b>으로 제시해요. 이메일을 보내 버린 뒤에 실수를 발견하면 되돌릴 수 없어 \u003cb class=\"key\">큰 \u003c/b>\u003cb class=\"key\">문제\u003c/b>가 될 수 있다는 뜻입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조건의 부사절 접속사 if\u003c/span> : [[If]] + [주어 + 동사] , [주절] : \"만약 네가 어떤 실수들을 보게 된다면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 after + 동명사(동명사구)\u003c/span> : [[after]] + [동사-ing (동명사)] : \"이메일을 보낸 후에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">조동사 can (가능성)\u003c/span> : [주어] + [[can]] + [동사원형] : \"그것은 큰 문제가 될 수 있다\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"If you see any mistakes, 만약 네가 어떤 실수들을 보게 된다면. after sending an email, 이메일을 보낸 후에. it can be a big problem, 그것은 큰 문제가 될 수 있습니다.. 이 문장 전체를 해석하면, 이메일을 보낸 후에 실수를 발견하면 큰 문제가 될 수 있습니다.","hl":"m"},{"n":41,"text":"앞에서 보내기 전에 다시 읽고 고치라고 했죠. 이 문장은 그 이유를 조건으로 보여줘요. 이메일을 보내 버린 뒤에 실수를 발견하면 되돌릴 수 없어서 큰 문제가 될 수 있다는 거예요.","hl":"mn"},{"n":42,"text":"첫 번째로, If you see any mistakes에서 if는 조건을 나타내는 접속사예요. 두 번째로, after sending an email에서 after는 전치사로 쓰여서 뒤에 동명사가 왔어요. 세 번째로, it can be a big problem에서 can은 가능성, 즉 큰 문제가 될 수도 있다는 뜻을 담고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서,\u003c/span>\u003cspan class=\"en\">So,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">네가 쓴 글을 주의 깊게 읽는 것을 잊지 마세요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003cspan class=\"tgt\">forget \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">read\u003c/span> your writing carefully\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보내기 버튼을 누르기 전에.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">before \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">click \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">Send \u003c/span>\u003cspan class=\"tgt\">button\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">따라서 보내기 버튼을 누르기 전에 글을 주의 깊게 읽는 것을 잊지 마십시오.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글 전체의 \u003cb class=\"key\">결론\u003c/b>이에요. 보내기 전에 꼭 다시 읽으라는 \u003cb class=\"key\">당부\u003c/b>를 담고 있죠. 앞에서 말한 실수를 막는 가장 확실한 방법을 명령문으로 정리한 것입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정명령문 + forget의 to부정사 목적어\u003c/span> : [[Don't]] + [동사원형] / forget + [[to read (to부정사/목적어)]] : \"읽는 것을 잊지 마세요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 before + 시간 부사절\u003c/span> : [[before]] + [주어 + 동사] (시간 부사절) : \"보내기 버튼을 누르기 전에\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"So, 그래서. don't forget to read your writing carefully, 네가 쓴 글을 주의 깊게 읽는 것을 잊지 마세요. before you click the Send button, 보내기 버튼을 누르기 전에.. 이 문장 전체를 해석하면, 따라서 보내기 버튼을 누르기 전에 글을 주의 깊게 읽는 것을 잊지 마십시오.","hl":"m"},{"n":44,"text":"그래서 이 문장은 글 전체의 결론이에요. 보내기 전에 꼭 다시 읽으라는 당부를 담고 있죠. 앞에서 말한 실수를 막는 가장 확실한 방법이라는 거예요.","hl":"mn"},{"n":45,"text":"첫 번째로, don't forget to read에서 Don't는 부정명령문이고 forget 뒤에 to부정사가 와서 읽는 것을 잊지 말라는 강한 당부가 돼요. 두 번째로, before you click the Send button에서 before는 시간을 나타내는 접속사로 뒤에 완전한 절이 왔고, 미래의 일이지만 현재 시제로 썼어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~도 마찬가지입니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">The \u003c/span>\u003cspan class=\"tgt\">same \u003c/span>\u003cspan class=\"tgt\">goes \u003c/span>\u003cspan class=\"tgt\">for\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">학교 과제나 업무 서신을 보내는 것도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">sending \u003c/span>\u003cspan class=\"tgt\">school \u003c/span>\u003cspan class=\"tgt\">assignments \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">business \u003c/span>\u003cspan class=\"tgt\">letters\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이메일로.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">email\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이메일로 학교 과제나 업무 서신을 보내는 경우에도 마찬가지입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글을 맺는 문장이에요. 앞에서 한 조언이 학교 과제나 업무 서신을 보낼 때도 똑같이 적용된다고 \u003cb class=\"key\">범위\u003c/b>를 넓혀 줍니다. 'the same goes for ~'는 앞 내용을 다른 대상에 그대로 연결하는 \u003cb class=\"key\">관용 \u003c/b>\u003cb class=\"key\">표현\u003c/b>이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관용 표현 (the same goes for ~)\u003c/span> : [[The same goes for]] + [명사/동명사] : \"~도 마찬가지다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 for의 목적어로 쓰인 동명사 + or 병렬\u003c/span> : for + [[동명사구]] (sending A [[or]] B) : \"학교 과제나 업무 서신을 보내는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">수단의 전치사 by + 무관사 명사\u003c/span> : [[by]] + [수단 명사 (관사 없음)] : \"이메일로\"\u003c/div>\u003c/div>","segs":[{"n":46,"text":"The same goes for, ~도 마찬가지입니다. sending school assignments or business letters, 학교 과제나 업무 서신을 보내는 것도. by email, 이메일로.. 이 문장 전체를 해석하면, 이메일로 학교 과제나 업무 서신을 보내는 경우에도 마찬가지입니다.","hl":"m"},{"n":47,"text":"이 문장은 글을 맺는 문장이에요. 앞에서 한 조언이 학교 과제나 업무 서신을 보낼 때도 똑같이 적용된다고 범위를 넓혀 주죠. 앞의 내용을 다른 대상에 그대로 연결하는 관용 표현이에요.","hl":"mn"},{"n":48,"text":"첫 번째로, The same goes for는 앞의 내용이 다른 대상에도 똑같이 적용된다는 관용 표현이에요. 두 번째로, sending school assignments or business letters에서 전치사 for 뒤라서 send가 동명사 sending으로 바뀌었고, 두 명사는 or로 병렬 연결됐어요. 세 번째로, by email에서 by는 수단을 나타내며 관사 없이 명사를 바로 붙여요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>이메일을 보낼 때는 \u003cb class=\"key\">보내기 \u003c/b>\u003cb class=\"key\">버튼\u003c/b>을 바로 누르지 말아야 합니다.\u003c/li>\u003cli>보내기 전에는 \u003cb class=\"key\">철자 \u003c/b>\u003cb class=\"key\">오류\u003c/b>나 사실의 오류가 있어도 시간을 내서 고칠 수 있습니다.\u003c/li>\u003cli>\u003cb class=\"key\">다시 \u003c/b>\u003cb class=\"key\">보고 \u003c/b>\u003cb class=\"key\">수정하는 \u003c/b>\u003cb class=\"key\">것\u003c/b>이 우선이고 보내는 것은 나중에 와야 합니다.\u003c/li>\u003cli>보낸 후에 실수를 발견하면 \u003cb class=\"key\">큰 \u003c/b>\u003cb class=\"key\">문제\u003c/b>가 될 수 있으므로 누르기 전에 글을 주의 깊게 읽어야 합니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>You should take time to look again and fix mistakes before clicking the Send button, because errors found after sending can become a big problem.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">이메일을 보낼 때는 \u003cb class=\"key\">보내기 \u003c/b>\u003cb class=\"key\">버튼\u003c/b>을 바로 누르지 말고, 시간을 내서 \u003cb class=\"key\">철자 \u003c/b>\u003cb class=\"key\">오류\u003c/b>나 사실의 오류를 수정해야 한다. 다시 보고 고치는 것이 우선이고 보내는 것은 나중이며, 보낸 뒤에 실수를 발견하면 \u003cb class=\"key\">큰 \u003c/b>\u003cb class=\"key\">문제\u003c/b>가 될 수 있으므로 누르기 전에 글을 주의 깊게 읽어야 한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":49,"text":"정리해 볼게요. 이메일을 보낼 때는 보내기 버튼을 바로 누르지 말고, 시간을 내서 실수를 수정해야 합니다. 다시 보고 고치는 일이 먼저이고 보내는 일은 나중이라는 점, 꼭 기억하세요. 오늘 배운 습관을 학교 과제와 업무 서신에도 그대로 적용해 보면 좋겠습니다. 수고했어요, 다음 시간에 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
