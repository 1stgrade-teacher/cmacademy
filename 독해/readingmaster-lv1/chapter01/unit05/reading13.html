<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터1 Reading 13 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터1 Reading 13","audioDir":"reading13_audio","preview":false,"count":45,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.668em\">Reading\u003cbr>13\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터1\u003c/div>\u003ch1>A Note That Brought Shared Toilet Paper Back\u003c/h1>\u003ch2>공용 화장지를 돌려놓은 메모\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>셰어 하우스에서 공용 화장지가 금방 사라지자 Rhonda는 화장실 한 곳에 \u003cb class=\"key\">메모\u003c/b>를 붙였고, 그 화장실에서는 화장지가 다시 돌아왔다. 메모가 없는 다른 화장실에서는 이런 변화가 없었다는 점이 \u003cb class=\"key\">공유 \u003c/b>\u003cb class=\"key\">물품\u003c/b>을 공평하게 쓰도록 하는 작은 안내의 힘을 보여 준다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>A simple note asking housemates to respect shared toilet paper led to a surprising change, showing that clear reminders can encourage fair use of shared items.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 오늘은 공유 생활 공간에서 일어난 화장지 소동을 다룬 지문을 함께 읽어 볼 거예요. 이 글은 Rhonda가 공용 화장지 문제를 해결하려고 메모를 붙인 이야기예요. 핵심은 작은 안내가 사람들의 행동을 바꾸어 공유 물품을 공평하게 쓰도록 도왔다는 점이에요. 그럼 지문을 차근차근 살펴볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">여러 사람이 집을 함께 쓰는 share house 생활에서는 공용 물건을 두고 갈등이 생기기 쉬워요. 공용 물품은 영어로 shared item이라고 하며, 누군가 더 많이 쓰면 다른 사람이 피해를 보는 공유지의 비극 tragedy of the commons 문제로 이어질 수 있죠. 이는 냉장고에 붙은 작은 이름표처럼, 모두가 함께 쓰는 물건에 대한 규칙이 없을 때 더 자주 생겨요. 작은 \u003cb class=\"key\">메모\u003c/b>나 안내문은 사람들의 행동을 부드럽게 바꾸는 nudge 역할을 할 수 있어요. 그래서 공유 공간에서는 \u003cb class=\"key\">공평한 \u003c/b>\u003cb class=\"key\">몫\u003c/b>을 지키도록 서로 알려 주는 장치가 중요해요. 이런 장치는 \u003cb class=\"key\">공유 \u003c/b>\u003cb class=\"key\">물품\u003c/b>을 모두가 오래도록 함께 쓰게 돕습니다.\u003c/div>","segs":[{"n":2,"text":"여러 사람이 집을 함께 쓰는 share house 생활에서는 공용 물건을 두고 갈등이 생기기 쉬워요. 공유 물품은 shared item이라고 하며, 누군가 더 많이 쓰면 다른 사람이 피해를 보는 tragedy of the commons 문제로 이어질 수 있죠. 이는 냉장고에 붙은 작은 이름표처럼, 모두가 함께 쓰는 물건에 대한 규칙이 없을 때 더 자주 생겨요. 작은 메모나 안내문은 사람들의 행동을 부드럽게 바꾸는 nudge 역할을 할 수 있어요. 그래서 공유 공간에서는 공평한 몫을 지키도록 서로 알려 주는 장치가 중요해요. 이런 장치는 공유 물품을 모두가 오래도록 함께 쓰게 돕습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>문제 발생\u003csmall>문제 · 문장 1–5\u003c/small>\u003c/h4>\u003cp>Rhonda는 여러 사람이 함께 사는 집에서 공용 화장지 문제를 겪어요. 청소부들이 주말마다 화장실 두 곳에 화장지를 남겨도 월요일이면 모두 사라지죠. 일부가 \u003cb class=\"key\">공평한 \u003c/b>\u003cb class=\"key\">몫\u003c/b>보다 더 많이 가져가자 그녀는 \u003cb class=\"key\">문제\u003c/b>에 대해 속상해해요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>메모 부착\u003csmall>해결 시도 · 문장 6–9\u003c/small>\u003c/h4>\u003cp>그래서 Rhonda는 화장실 한 곳에 \u003cb class=\"key\">메모\u003c/b>를 붙이기로 결심해요. 메모에는 화장지를 모두 가져가지 말라는 당부와 함께 그것이 \u003cb class=\"key\">공유 \u003c/b>\u003cb class=\"key\">물품\u003c/b>이며 모두를 위한 것이라는 내용이 담겨 있어요. 말 대신 짧은 글로 모두에게 알린 셈이에요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>메모의 효과\u003csmall>결과 · 문장 10–11\u003c/small>\u003c/h4>\u003cp>그러자 \u003cb class=\"key\">놀라운 \u003c/b>\u003cb class=\"key\">변화\u003c/b>가 일어나요. 메모가 있는 화장실에서는 몇 시간 후에 \u003cb class=\"key\">화장지\u003c/b> 한 통이 돌아오고 다음 날 또 한 통이 돌아와요. Rhonda는 이 모습을 보고 기뻐해요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>메모 없음의 차이\u003csmall>대조 · 문장 12\u003c/small>\u003c/h4>\u003cp>반면 메모가 없는 다른 화장실에서는 \u003cb class=\"key\">대조\u003c/b>적인 결과가 나타나요. 그곳에는 청소부들이 더 가져올 때까지 화장지가 돌아오지 않아요. 같은 상황에서도 \u003cb class=\"key\">메모\u003c/b>의 유무가 결과를 갈랐다는 점이 드러나요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 문제가 생기고, 메모라는 해결 시도가 나오고, 그 결과가 대조되는 흐름을 따라가 볼게요.","hl":null},{"n":4,"text":"먼저 Rhonda가 사는 share house에서 문제가 시작돼요. 청소부들이 주말마다 화장실 두 곳에 화장지를 남겨 두지만 월요일이면 모두 사라지죠. 일부 사람들이 공평한 몫보다 더 많이 가져가서 Rhonda는 그 문제에 대해 속상해해요.","hl":"f0"},{"n":5,"text":"그래서 Rhonda는 화장실 한 곳에 메모를 붙이기로 결심해요. 메모에는 화장지를 모두 가져가지 말고, 이것이 공유 물품이며 모두를 위한 것이라고 적혀 있어요. 그녀는 말 대신 짧은 글로 모두에게 알린 거예요.","hl":"f1"},{"n":6,"text":"그러자 놀라운 변화가 일어나요. 메모가 있는 화장실에서는 몇 시간 후에 화장지 한 통이 돌아오고 다음 날 또 한 통이 돌아와요. Rhonda는 이 모습을 보고 기뻐하죠.","hl":"f2"},{"n":7,"text":"반면 메모가 없는 다른 화장실에서는 대조적인 결과가 나타나요. 그곳에는 청소부들이 더 가져올 때까지 화장지가 돌아오지 않아요. 같은 상황에서도 메모의 유무가 결과를 갈랐다는 점이 드러나요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결과 비교·대조\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 11번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 문제와 해결의 흐름 위에 비교와 \u003cb class=\"key\">대조\u003c/b>를 얹은 구조예요. 처음에는 화장지가 사라지는 문제를 제시하고, 중간에는 메모라는 해결 시도를 보여 주죠. 마지막 부분에서 메모가 있는 경우와 없는 경우의 결과 차이를 드러내며 핵심을 완성해요. 그래서 핵심 내용이 뒤에서 완성되는 \u003cb class=\"key\">미괄식\u003c/b>으로 볼 수 있고, 놀라운 변화를 말하는 \u003cb class=\"key\">주제문\u003c/b>은 열한 번째 문장으로 잡을 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>However (3)\u003c/b>\u003cspan>문제 상황 전환\u003c/span>\u003cb>but (4)\u003c/b>\u003cspan>원인 제시\u003c/span>\u003cb>So (6)\u003c/b>\u003cspan>해결 행동\u003c/span>\u003cb>Then (10)\u003c/b>\u003cspan>결과 전환\u003c/span>\u003cb>However (12)\u003c/b>\u003cspan>대조\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">toilet paper\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">shared item\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">for everyone\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">one roll\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">another\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>메모가 있는 화장실\u003c/th>\u003cth>메모가 없는 화장실\u003c/th>\u003c/tr>\u003ctr>\u003ctd>안내문이 붙어 있음\u003c/td>\u003ctd>안내문이 없음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>화장지가 다시 돌아옴\u003c/td>\u003ctd>청소부가 올 때까지 돌아오지 않음\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 문제와 해결의 흐름 위에 비교와 대조를 얹은 구조예요. 처음에는 화장지가 사라지는 문제를 보여 주고, 중간에는 메모라는 해결 시도를 제시하죠. 마지막 부분에서 메모가 있는 경우와 없는 경우의 결과 차이를 드러내며 핵심을 완성해요. 그래서 핵심 내용이 뒤에서 완성되는 미괄식으로 볼 수 있고, 주제문은 놀라운 변화를 말하는 열한 번째 문장으로 잡을 수 있어요.","hl":"ty"},{"n":9,"text":"신호어를 보면 흐름이 잘 보여요. 세 번째 문장의 However는 기대와 다른 문제 상황을 알려 주고, 여섯 번째 문장의 So는 해결 행동으로 이어 줘요. 열 번째 문장의 Then은 결과로 넘어가는 전환점이고, 열두 번째 문장의 However는 메모가 있는 쪽과 없는 쪽의 대조를 분명히 해요. 또한 shared item과 for everyone은 같은 개념을 다시 말하는 재진술이에요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>share house\u003c/b>\u003cem>명사\u003c/em>\u003cspan>셰어 하우스, 공동 주택\u003c/span>\u003c/div>\u003cdiv>\u003cb>cleaner\u003c/b>\u003cem>명사\u003c/em>\u003cspan>청소부\u003c/span>\u003c/div>\u003cdiv>\u003cb>on weekends\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>주말마다\u003c/span>\u003c/div>\u003cdiv>\u003cb>leave\u003c/b>\u003cem>동사\u003c/em>\u003cspan>남겨 두다, 떠나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>toilet paper\u003c/b>\u003cem>명사\u003c/em>\u003cspan>화장지\u003c/span>\u003c/div>\u003cdiv>\u003cb>bathroom\u003c/b>\u003cem>명사\u003c/em>\u003cspan>화장실\u003c/span>\u003c/div>\u003cdiv>\u003cb>be gone\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>없어지다, 다 떨어지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>by\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~쯤까지\u003c/span>\u003c/div>\u003cdiv>\u003cb>fair share\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>공평한 몫\u003c/span>\u003c/div>\u003cdiv>\u003cb>take\u003c/b>\u003cem>동사\u003c/em>\u003cspan>가져가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>feel upset\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>화가 나다, 속상하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>matter\u003c/b>\u003cem>명사\u003c/em>\u003cspan>문제, 일\u003c/span>\u003c/div>\u003cdiv>\u003cb>decide\u003c/b>\u003cem>동사\u003c/em>\u003cspan>결심하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>put a note\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>메모를 붙이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>note\u003c/b>\u003cem>명사\u003c/em>\u003cspan>메모, 쪽지\u003c/span>\u003c/div>\u003cdiv>\u003cb>shared\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>공유의, 공동의\u003c/span>\u003c/div>\u003cdiv>\u003cb>item\u003c/b>\u003cem>명사\u003c/em>\u003cspan>물품\u003c/span>\u003c/div>\u003cdiv>\u003cb>surprising\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>놀라운\u003c/span>\u003c/div>\u003cdiv>\u003cb>change\u003c/b>\u003cem>명사\u003c/em>\u003cspan>변화\u003c/span>\u003c/div>\u003cdiv>\u003cb>glad\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>기쁜\u003c/span>\u003c/div>\u003cdiv>\u003cb>roll\u003c/b>\u003cem>명사\u003c/em>\u003cspan>한 통, 두루마리\u003c/span>\u003c/div>\u003cdiv>\u003cb>come back\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>돌아오다\u003c/span>\u003c/div>\u003cdiv>\u003cb>in a few hours\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>몇 시간 후에\u003c/span>\u003c/div>\u003cdiv>\u003cb>until\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~까지\u003c/span>\u003c/div>\u003cdiv>\u003cb>bring\u003c/b>\u003cem>동사\u003c/em>\u003cspan>가져오다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"단어는 문장 속 쓰임으로 익혀 보세요. fair share는 공평한 몫, be gone은 없어지다, come back은 돌아오다, bring은 가져오다는 뜻이에요. put a note처럼 동사와 명사가 붙은 표현도 통째로 기억해 두면 좋아요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">fair\u003c/b>\u003cspan class=\"m\">공평한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">just\u003c/span>\u003cspan class=\"s\">equal\u003c/span>\u003cspan class=\"s\">impartial\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unfair\u003c/span>\u003cspan class=\"a\">partial\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">upset\u003c/b>\u003cspan class=\"m\">속상한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">distressed\u003c/span>\u003cspan class=\"s\">troubled\u003c/span>\u003cspan class=\"s\">unhappy\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">calm\u003c/span>\u003cspan class=\"a\">pleased\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">shared\u003c/b>\u003cspan class=\"m\">공유의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">common\u003c/span>\u003cspan class=\"s\">joint\u003c/span>\u003cspan class=\"s\">mutual\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">private\u003c/span>\u003cspan class=\"a\">individual\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">surprising\u003c/b>\u003cspan class=\"m\">놀라운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">unexpected\u003c/span>\u003cspan class=\"s\">astonishing\u003c/span>\u003cspan class=\"s\">amazing\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">expected\u003c/span>\u003cspan class=\"a\">ordinary\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">glad\u003c/b>\u003cspan class=\"m\">기쁜\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">pleased\u003c/span>\u003cspan class=\"s\">happy\u003c/span>\u003cspan class=\"s\">delighted\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">sad\u003c/span>\u003cspan class=\"a\">displeased\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">gone\u003c/b>\u003cspan class=\"m\">없어진\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">missing\u003c/span>\u003cspan class=\"s\">absent\u003c/span>\u003cspan class=\"s\">vanished\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">present\u003c/span>\u003cspan class=\"a\">available\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"시험에 자주 나오는 어휘도 동의어와 반의어로 묶어 볼게요. upset은 distressed나 troubled와 가깝고 calm이나 pleased와 반대예요. shared는 common이나 joint와 비슷하고 private과 반대되는 말이에요. surprising은 unexpected나 astonishing과 연결되고 expected와는 반대죠. glad는 pleased나 happy와 가깝고 sad와 반대라는 점도 기억해 주세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Rhonda는\u003c/span>\u003cspan class=\"en\">Reading 13 Rhonda\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">살고 있었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">living\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">셰어 하우스에.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">share \u003c/span>\u003cspan class=\"tgt\">house\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Rhonda는 셰어 하우스에 살고 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글의 배경과 주인공 Rhonda의 주거 상황을 소개해요. \u003cb class=\"key\">셰어 \u003c/b>\u003cb class=\"key\">하우스\u003c/b>는 여러 사람이 공간을 함께 쓰는 집이라, 뒤에 나오는 \u003cb class=\"key\">공용 \u003c/b>\u003cb class=\"key\">화장지\u003c/b> 문제의 자연스러운 배경이 돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거진행형\u003c/span> : 주어 + was/were + 동사원형-ing : \"살고 있었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구(장소)\u003c/span> : in + 장소명사구 : \"셰어 하우스에\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Rhonda, Rhonda는. was living, 살고 있었다. in a share house, 셰어 하우스에.. 이 문장 전체를 해석하면, Rhonda는 셰어 하우스에 살고 있었다.","hl":"m"},{"n":13,"text":"이 문장은 글의 배경과 주인공 Rhonda의 주거 상황을 소개해요. 셰어 하우스는 여러 사람이 공간을 함께 쓰는 집이라, 뒤에 나오는 공용 화장지 문제의 자연스러운 배경이 돼요.","hl":"mn"},{"n":14,"text":"여기서 was living은 과거진행형이에요. 과거의 어느 때에 진행 중이던 상황을 보여 주죠. 그리고 in a share house는 전치사구로, in이 장소를 이끌어서 살고 있는 곳을 보충해 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">청소부들이 왔을 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">cleaners \u003c/span>\u003cspan class=\"tgt\">came \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">주말마다,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">weekends,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 남겨 두었다\u003c/span>\u003cspan class=\"en\">they left\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">화장지를 약간\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">some \u003c/span>\u003cspan class=\"tgt\">toilet \u003c/span>\u003cspan class=\"tgt\">paper\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">두 곳의 화장실에.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">two \u003c/span>\u003cspan class=\"tgt\">bathrooms\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">청소부들은 주말마다 와서 두 곳의 화장실에 화장지를 약간 남겨 두었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 청소부들이 주말마다 화장지를 두 화장실에 조금씩 남겨 두었다는 장면이에요. 이는 뒤에서 \u003cb class=\"key\">화장지\u003c/b>가 공용 물품임을 알려 주는 \u003cb class=\"key\">배경 \u003c/b>\u003cb class=\"key\">정보\u003c/b>가 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간을 나타내는 접속사 when절\u003c/span> : When + 주어 + 동사, + 주절 : \"청소부들이 주말마다 왔을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">some + 불가산명사\u003c/span> : some + 불가산명사 : \"화장지 약간\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사구(장소)\u003c/span> : in + the + 명사 : \"두 곳의 화장실에\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"When the cleaners came, 청소부들이 왔을 때. on weekends, 주말마다. they left, 그들은 남겨 두었다. some toilet paper, 화장지를 약간. in the two bathrooms, 두 곳의 화장실에.. 이 문장 전체를 해석하면, 청소부들은 주말마다 와서 두 곳의 화장실에 화장지를 약간 남겨 두었다.","hl":"m"},{"n":16,"text":"청소부들이 주말마다 화장지를 두 화장실에 조금씩 남겨 두었다는 장면이에요. 이 장면은 뒤에서 화장지가 공용 물품임을 알려 주는 배경 정보가 됩니다.","hl":"mn"},{"n":17,"text":"먼저 when은 접속사로 청소부들이 주말마다 온 시간을 이끌어요. some toilet paper에서 toilet paper는 불가산명사라서 some과 함께 썼고, some은 여기서 양을 나타내요. in the two bathrooms는 장소를 나타내는 전치사구로, 화장지를 남겨 둔 위치를 알려 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나,\u003c/span>\u003cspan class=\"en\">However,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 화장지가\u003c/span>\u003cspan class=\"en\">all the toilet paper\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">없어졌다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">gone\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">월요일쯤.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">Monday\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나, 모든 화장지가 월요일쯤 다 떨어졌다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 화장지가 남겨졌지만 월요일쯤 모두 사라졌다는 \u003cb class=\"key\">대조\u003c/b>와 \u003cb class=\"key\">결과\u003c/b>를 보여 줘요. However가 앞 내용과 반대되는 상황을 이어 주고, by Monday가 \u003cb class=\"key\">시간적 \u003c/b>\u003cb class=\"key\">기준\u003c/b>을 제시해 문제의 심각성을 드러내요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be + 과거분사(상태)\u003c/span> : be동사 + 과거분사 : \"없어졌다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">by + 시간\u003c/span> : by + 시간 : \"월요일쯤에는\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"However, 그러나. all the toilet paper, 모든 화장지가. was gone, 없어졌다. by Monday, 월요일쯤.. 이 문장 전체를 해석하면, 그러나, 모든 화장지가 월요일쯤 다 떨어졌다.","hl":"m"},{"n":19,"text":"앞 문장에서 화장지가 남겨졌지만 월요일쯤 모두 사라졌다는 대조와 결과를 보여 줘요. However가 앞 내용과 반대되는 상황을 이어 주고, by Monday가 시간적 기준을 제시해서 문제의 심각성을 드러내요.","hl":"mn"},{"n":20,"text":"was gone은 be동사와 과거분사가 결합해서 화장지가 더 이상 남아 있지 않은 상태를 나타내요. 단순한 수동태보다 결과의 의미가 강하죠. by Monday에서 by는 어떤 시간까지의 완료나 기한을 나타내는 전치사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">화장지는\u003c/span>\u003cspan class=\"en\">The toilet paper\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 사람을 위한 것이었지만\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">everyone\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 일부는 가져갔다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">but\u003c/span> some \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">took \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자기 공평한 몫보다 더 많이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">fair \u003c/span>\u003cspan class=\"tgt\">share\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">화장지는 모든 사람을 위한 것이었지만 일부는 공평한 몫보다 더 많이 가져갔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 화장지가 왜 사라졌는지 그 이유를 밝히는 문장이에요. 화장지는 \u003cb class=\"key\">공용\u003c/b> 물건인데 일부가 \u003cb class=\"key\">공평한 \u003c/b>\u003cb class=\"key\">몫\u003c/b>보다 더 많이 가져갔다는 \u003cb class=\"key\">대조\u003c/b> 구조죠. more than their fair share는 '자기 몫보다 더 많이'라는 뜻으로, 이기적인 행동을 짚어 주는 표현이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 for의 의미(대상)\u003c/span> : [be동사] + [for + 명사(대상)] : \"모든 사람을 위한 것이었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 but(대조)\u003c/span> : [절] + but + [절] : \"그러나\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">비교급 more than\u003c/span> : [동사] + [more] + [than + 비교 대상] : \"공평한 몫보다 더 많이 가져갔다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"The toilet paper, 화장지는. was for everyone, 모든 사람을 위한 것이었지만. but some took, 그러나 일부는 가져갔다. more than their fair share, 자기 공평한 몫보다 더 많이. 이 문장 전체를 해석하면, 화장지는 모든 사람을 위한 것이었지만 일부는 공평한 몫보다 더 많이 가져갔다.","hl":"m"},{"n":22,"text":"이 문장은 화장지가 왜 사라졌는지 그 이유를 밝히는 부분이에요. 화장지는 everyone, 즉 모든 사람을 위한 공용 물건인데 일부가 자기 공평한 몫보다 더 많이 가져갔다는 거죠. 앞의 모두를 위한 것과 뒤의 과도한 행동이 대조를 이루면서 문제 상황을 또렷하게 보여 줍니다.","hl":"mn"},{"n":23,"text":"먼저 was for everyone에서 for는 대상을 나타내요. 화장지의 용도가 모든 사람에게 열려 있다는 뜻이죠. 두 번째로 took more than their fair share에서 more는 비교급이고 than이 비교 대상을 이어 줘요. 그래서 자기 몫보다 더 많이 가져갔다는 과도함이 드러납니다. 마지막으로 but은 등위접속사로 앞뒤 절을 대조로 이어 주는 역할을 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 느꼈어요\u003c/span>\u003cspan class=\"en\">She \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">felt \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">화가 난 상태를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">upset\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 문제에 대해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">about \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">matter\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 그 문제에 대해 화가 났다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 화장지가 사라진 일에 대해 Rhonda가 어떤 \u003cb class=\"key\">감정\u003c/b>을 느꼈는지 알려 주는 문장이에요. feel 뒤에 \u003cb class=\"key\">형용사\u003c/b> upset이 와서 '화가 난 상태'를 설명하죠. 이 감정이 다음 문장의 \u003cb class=\"key\">행동\u003c/b>(메모 붙이기)으로 이어지는 흐름의 출발점이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">상태동사 feel + 형용사(주격보어)\u003c/span> : [feel] + [형용사(주격보어)] : \"화가 난 상태를 느꼈다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 about(감정의 대상)\u003c/span> : [감정 형용사] + about + [명사] : \"그 문제에 대해\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"She felt, 그녀는 느꼈어요. upset, 화가 난 상태를. about the matter, 그 문제에 대해. 이 문장 전체를 해석하면, 그녀는 그 문제에 대해 화가 났다.","hl":"m"},{"n":25,"text":"이 문장은 Rhonda가 그 상황에서 어떤 감정을 느꼈는지 알려 줘요. 화장지가 사라진 일에 대해 upset, 즉 화가 났다는 거죠. 이 감정이 다음에 메모를 붙이는 행동으로 이어지기 때문에 글의 흐름에서 원인 역할을 합니다.","hl":"mn"},{"n":26,"text":"먼저 felt upset을 보면 feel이 여기서는 상태를 나타내는 동사로 쓰였어요. 그래서 뒤에 부사가 아니라 형용사 upset이 와서 주어의 상태를 설명합니다. 두 번째로 about the matter에서 about은 감정이 향하는 대상을 이끄는 전치사예요. upset이나 worried 같은 감정 형용사와 잘 어울려 쓰입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">So\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 결심했어요\u003c/span>\u003cspan class=\"en\">she \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">decided \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">메모를 붙이기로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">put\u003c/span> a note\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">화장실 중 한 곳에\u003c/span>\u003cspan class=\"en\">in \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">bathrooms\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그래서 그녀는 화장실 중 한 곳에 메모를 붙여 놓기로 결심했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 화가 난 Rhonda가 문제를 해결하기 위해 실제로 \u003cb class=\"key\">행동\u003c/b>에 나선 문장이에요. decide to는 '~하기로 결심하다'로, \u003cb class=\"key\">to부정사\u003c/b>가 결심한 행동의 내용을 담죠. one of the bathrooms는 '화장실 중 한 곳'이라는 뜻으로, 뒤에서 메모가 있는 곳과 없는 곳을 \u003cb class=\"key\">비교\u003c/b>하는 장치가 돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속부사 So(결과)\u003c/span> : [So,] + [주어 + 동사] : \"그래서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : [decide] + [to + 동사원형(목적어)] : \"붙이기로 결심했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">one of + 복수명사\u003c/span> : [one of] + [the + 복수명사] : \"화장실 중 한 곳\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"So, 그래서. she decided, 그녀는 결심했어요. to put a note, 메모를 붙이기로. in one of the bathrooms, 화장실 중 한 곳에. 이 문장 전체를 해석하면, 그래서 그녀는 화장실 중 한 곳에 메모를 붙여 놓기로 결심했다.","hl":"m"},{"n":28,"text":"이 문장은 화가 난 Rhonda가 실제로 행동에 나선 장면이에요. 문제를 그냥 두지 않고 메모를 붙이기로 결심한 거죠. 여기서 one of the bathrooms라는 표현이 중요한데, 뒤에서 메모가 있는 화장실과 없는 화장실을 비교하는 장치가 되기 때문입니다.","hl":"mn"},{"n":29,"text":"먼저 문장 앞의 So는 접속부사로, 앞에서 느낀 감정이 원인이 되어 이 행동이 나왔다는 걸 보여 줘요. 두 번째로 decided to put에서 decide는 목적어로 to부정사를 취하는 동사예요. 그래서 decided putting이 아니라 decided to put이 됩니다. 세 번째로 one of the bathrooms는 one of 뒤에 복수명사가 오는 구조로, 여러 개 중 하나라는 부분의 의미를 만들어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 말했어요\u003c/span>\u003cspan class=\"en\">It said,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가져가지 마세요\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Do \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">take\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">화장지 전부를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">all \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">toilet \u003c/span>\u003cspan class=\"tgt\">paper\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">부디\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">please\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“화장지를 모두 가져가지 마세요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 론다가 화장실에 붙인 메모의 내용으로, 화장지를 전부 가져가지 말라는 \u003cb class=\"key\">정중한 \u003c/b>\u003cb class=\"key\">요청\u003c/b>을 담고 있어요. 부정 명령문인 Do not take를 써서 공유 물품을 함께 쓰자는 \u003cb class=\"key\">예의\u003c/b>를 전달하는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정 명령문\u003c/span> : Do not + [동사원형 take] : \"가져가지 마세요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">한정사 all의 어순\u003c/span> : all + the + [불가산명사] : \"화장지 전부\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">명령문의 공손 표현\u003c/span> : [명령문] + please : \"부디, 제발\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"It said, 그것은 말했어요. \"Do not take, 가져가지 마세요. all the toilet paper, 화장지 전부를. please, 부디. 이 문장 전체를 해석하면, “화장지를 모두 가져가지 마세요.","hl":"m"},{"n":31,"text":"이 문장은 론다가 화장실에 붙인 메모의 내용이에요. 화장지를 전부 가져가지 말라는 정중한 요청을 담고 있고, 공유 물품을 함께 쓰자는 예의를 전달하는 역할을 해요.","hl":"mn"},{"n":32,"text":"첫 번째로 Do not take는 부정 명령문이에요. Do not 뒤에 동사원형을 써서 하지 말라는 뜻을 만들어요. 두 번째로 all the toilet paper에서 all은 정관사 the 앞에 와서 전부를 뜻하고, toilet paper는 불가산명사라 복수형을 쓰지 않아요. 세 번째로 please는 명령문 뒤에 붙어 공손한 부탁의 느낌을 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It \u003c/span>\u003cspan class=\"tgt\">is\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공유된\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">shared \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">물품입니다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">item\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">공유 물품입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 화장지가 \u003cb class=\"key\">공유 \u003c/b>\u003cb class=\"key\">물품\u003c/b>임을 밝혀 앞의 부탁에 \u003cb class=\"key\">이유\u003c/b>를 제공해요. 모두가 함께 쓰는 물건이므로 한 사람이 독차지하면 안 된다는 맥락을 분명히 해 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">문맥을 받는 대명사 It\u003c/span> : It + is + [명사구] : \"그것은 ~입니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">2형식 문장의 주격보어와 과거분사\u003c/span> : It + is + [a shared item] : \"공유 물품입니다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"It is, 그것은. a shared, 공유된. item, 물품입니다.. 이 문장 전체를 해석하면, 공유 물품입니다.","hl":"m"},{"n":34,"text":"이 문장은 화장지가 공유 물품임을 밝혀 앞의 부탁에 이유를 제공해요. 모두가 함께 쓰는 물건이므로 한 사람이 독차지하면 안 된다는 맥락을 분명히 해 줘요.","hl":"mn"},{"n":35,"text":"첫 번째로 It is에서 It은 앞 문장의 화장지를 가리키는 지시대명사예요. 두 번째로 a shared item은 주어의 상태를 설명하는 주격보어이고, shared는 share의 과거분사로 공유된이라는 수동 의미를 가져요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">위한 것입니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">is\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모두를 위한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">everyone\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">모두를 위한 것입니다.”\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 화장지가 \u003cb class=\"key\">모두\u003c/b>를 위한 것임을 다시 말해 공유의 범위를 분명히 해요. 앞의 공유 물품이라는 설명을 강화하며, 특정 사람만 쓰는 물건이 아니라는 \u003cb class=\"key\">공유 \u003c/b>\u003cb class=\"key\">의식\u003c/b>을 전달해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">문맥을 받는 대명사 It\u003c/span> : It + is + [전치사구] : \"그것은 ~입니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 for의 대상 표시\u003c/span> : be for + [사람] : \"모두를 위한 것입니다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"It, 그것은. is for, 위한 것입니다. everyone, 모두를 위한. 이 문장 전체를 해석하면, 모두를 위한 것입니다.”","hl":"m"},{"n":37,"text":"이 문장은 화장지가 모두를 위한 것임을 다시 말해 공유의 범위를 분명히 해요. 앞의 공유 물품이라는 설명을 강화하며, 특정 사람만 쓰는 물건이 아니라는 공유 의식을 전달해요.","hl":"mn"},{"n":38,"text":"첫 번째로 It is에서 It은 앞에 나온 화장지를 가리키는 지시대명사이고, is는 주어의 상태를 설명하는 be동사예요. 두 번째로 for everyone에서 for는 대상을 나타내고, everyone은 모든 사람을 뜻하는 부정대명사로 for의 목적어예요. everyone은 문법적으로 단수로 취급해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러자\u003c/span>\u003cspan class=\"en\">Then\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~이 있었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">was\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">놀라운 변화가\u003c/span>\u003cspan class=\"en\">a \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">surprising\u003c/span> change.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러자 놀라운 변화가 일어났다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 Rhonda가 화장실에 메모를 붙였죠. 바로 그다음에 일어난 일을 알려 주는 문장으로, \u003cb class=\"key\">놀라운 \u003c/b>\u003cb class=\"key\">변화\u003c/b>가 있었다고 말하며 다음 문장에 대한 기대를 만듭니다. 이 문장 하나가 글의 \u003cb class=\"key\">전환점\u003c/b> 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">there be 구문(유도부사)\u003c/span> : There + be동사 + 주어(뒤에 오는 명사가 진주어) : \"~이 있었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재분사형 형용사\u003c/span> : surprise(동사) + -ing → 감정을 일으키는 형용사 + 명사 : \"놀라운\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"Then, 그러자. there was, ~이 있었다. a surprising change, 놀라운 변화가. 이 문장 전체를 해석하면, 그러자 놀라운 변화가 일어났다.","hl":"m"},{"n":40,"text":"앞에서 Rhonda가 화장실에 메모를 붙였죠. 바로 그다음에 일어난 일을 알려 주는 문장으로, 놀라운 변화가 있었다고 말하며 다음 문장에 대한 기대를 만듭니다. 이 문장 하나가 글의 전환점 역할을 해요.","hl":"mn"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 기뻤다\u003c/span>\u003cspan class=\"en\">She \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">glad \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보게 되어서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">see\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">화장지 한 통이 돌아왔다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">roll \u003c/span>\u003cspan class=\"tgt\">came \u003c/span>\u003cspan class=\"tgt\">back\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몇 시간 후에\u003c/span>\u003cspan class=\"en\">in a few hours\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 또 다른 한 통이\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">another \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다음 날에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">next \u003c/span>\u003cspan class=\"tgt\">day\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 화장지 한 통이 몇 시간 후에, 그리고 또 다른 화장지 한 통이 다음 날에 돌아오는 것을 보고 기뻤다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 메모를 붙인 뒤 실제로 화장지가 돌아왔다는 결과를 보여 주는 문장이에요. \u003cb class=\"key\">한 \u003c/b>\u003cb class=\"key\">통\u003c/b>은 몇 시간 만에, \u003cb class=\"key\">또 \u003c/b>\u003cb class=\"key\">다른 \u003c/b>\u003cb class=\"key\">한 \u003c/b>\u003cb class=\"key\">통\u003c/b>은 다음 날에 돌아왔다고 해서 변화가 서서히, 그러나 분명히 일어났음을 알 수 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">감정 형용사 + to부정사(원인)\u003c/span> : be + 감정 형용사(glad) + to부정사(원인) : \"보게 되어서 기뻤다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 명사절(목적어)\u003c/span> : see + that + [주어 + 동사] : \"화장지 한 통이 돌아왔다는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">반복 어구의 생략(병렬)\u003c/span> : and + another + [roll came back 생략] + 시간 표현 : \"그리고 또 다른 한 통은 다음 날에\"\u003c/div>\u003c/div>","segs":[{"n":41,"text":"She was glad, 그녀는 기뻤다. to see, 보게 되어서. that one roll came back, 화장지 한 통이 돌아왔다는 것을. in a few hours, 몇 시간 후에. and another, 그리고 또 다른 한 통이. the next day, 다음 날에. 이 문장 전체를 해석하면, 그녀는 화장지 한 통이 몇 시간 후에, 그리고 또 다른 화장지 한 통이 다음 날에 돌아오는 것을 보고 기뻤다.","hl":"m"},{"n":42,"text":"메모를 붙인 뒤 실제로 화장지가 돌아왔다는 결과를 보여 주는 문장이에요. 한 통은 몇 시간 만에, 또 다른 한 통은 다음 날에 돌아왔다고 해서 변화가 서서히, 그러나 분명히 일어났음을 알 수 있습니다.","hl":"mn"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만\u003c/span>\u003cspan class=\"en\">However,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 화장실에는\u003c/span>\u003cspan class=\"en\">in the other bathroom\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">메모가 없는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">no \u003c/span>\u003cspan class=\"tgt\">note\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">화장지가 하나도 돌아오지 않았다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">no \u003c/span>\u003cspan class=\"tgt\">toilet \u003c/span>\u003cspan class=\"tgt\">paper \u003c/span>\u003cspan class=\"tgt\">came \u003c/span>\u003cspan class=\"tgt\">back \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">청소부들이 더 가져올 때까지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">until \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">cleaners \u003c/span>\u003cspan class=\"tgt\">brought \u003c/span>\u003cspan class=\"tgt\">more\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만, 메모가 없는 다른 화장실에는 청소부들이 더 가져올 때까지 화장지가 돌아오지 않았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 메모를 붙인 화장실과 붙이지 않은 화장실을 \u003cb class=\"key\">대조\u003c/b>하는 문장이에요. 메모가 없는 곳에서는 아무도 화장지를 돌려놓지 않았다는 사실을 통해, 앞의 메모가 분명히 \u003cb class=\"key\">효과\u003c/b>가 있었음을 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 with + 명사(수식어구)\u003c/span> : 전치사 with + 명사 → '~이 있는/없는'으로 앞의 명사를 뒤에서 수식 : \"메모가 없는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">no ~ until 구문(시간 부사절)\u003c/span> : no + 주어 + 동사 + until + [주어 + 동사] : \"청소부들이 더 가져올 때까지 화장지가 돌아오지 않았다\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"However, 하지만. in the other bathroom, 다른 화장실에는. with no note, 메모가 없는. no toilet paper came back, 화장지가 하나도 돌아오지 않았다. until the cleaners brought more, 청소부들이 더 가져올 때까지. 이 문장 전체를 해석하면, 하지만, 메모가 없는 다른 화장실에는 청소부들이 더 가져올 때까지 화장지가 돌아오지 않았다.","hl":"m"},{"n":44,"text":"메모를 붙인 화장실과 붙이지 않은 화장실을 대조하는 문장이에요. 메모가 없는 곳에서는 아무도 화장지를 돌려놓지 않았다는 사실을 통해, 앞의 메모가 분명히 효과가 있었음을 보여 줍니다.","hl":"mn"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>Rhonda는 여러 사람이 함께 사는 \u003cb class=\"key\">공유 \u003c/b>\u003cb class=\"key\">생활\u003c/b> 공간에서 공용 화장지가 월요일마다 사라지는 문제를 겪었다.\u003c/li>\u003cli>일부가 \u003cb class=\"key\">공평한 \u003c/b>\u003cb class=\"key\">몫\u003c/b>보다 더 많이 가져가자 그녀는 화장실 한 곳에 \u003cb class=\"key\">메모\u003c/b>를 붙였다.\u003c/li>\u003cli>메모가 있는 화장실에서는 화장지가 다시 돌아와 \u003cb class=\"key\">놀라운 \u003c/b>\u003cb class=\"key\">변화\u003c/b>가 나타났다.\u003c/li>\u003cli>메모가 없는 화장실에서는 변화가 없어, 작은 안내가 \u003cb class=\"key\">공유 \u003c/b>\u003cb class=\"key\">물품\u003c/b> 사용을 바꿀 수 있음을 보여 준다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>A simple note asking housemates to respect shared toilet paper led to a surprising change, showing that clear reminders can encourage fair use of shared items.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">셰어 하우스에서 공용 화장지가 금방 사라지자 Rhonda는 화장실 한 곳에 \u003cb class=\"key\">메모\u003c/b>를 붙였고, 그 화장실에서는 화장지가 다시 돌아왔다. 메모가 없는 다른 화장실에서는 이런 변화가 없었다는 점이 \u003cb class=\"key\">공유 \u003c/b>\u003cb class=\"key\">물품\u003c/b>을 공평하게 쓰도록 하는 작은 안내의 힘을 보여 준다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":45,"text":"오늘 글의 핵심은 작은 메모가 공유 물품 사용을 바꾸었다는 점이에요. Rhonda는 공평한 몫을 지키도록 메모를 붙였고, 메모가 있는 화장실에서는 놀라운 변화가 나타났죠. 메모가 없는 화장실과 비교하면 그 차이가 더 분명해져요. 이처럼 대조의 흐름을 잡으며 읽으면 주제가 쉽게 보일 테니 오늘도 수고했어요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
