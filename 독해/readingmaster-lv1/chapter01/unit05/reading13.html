 공용 물품을 각자 조금씩만 아껴 쓴다면 모두가 충분히 누릴 수 있지만, &#39;나 하나쯤은 괜찮겠지&#39;라는 방관자적 심리가 작동하면 금세 자원이 바닥나게 되죠. 이때 Rhonda가 시도한 것처럼 공동체 구성원에게 메시지를 전달하는 것은 &#39;사회적 규범(Social Norms)&#39;을 환기하는 효과가 있는데, 명확한 규칙을 제시함으로써 상대방의 &#39;양심적인 행동(Prosocial Behavior)&#39;을 이끌어내는 심리적 압박으로 작용하기 때문입니다. 마치 도서관에서 조용히 하라는 안내문이 있으면 사람들이 더 주의하게 되는 것과 같은 원리로, 이러한 작은 소통이 무질서한 공동체 안에서 &#39;협력(Cooperation)&#39;을 끌어내는 중요한 열쇠가 된답니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01상황 발생</div><ul><li>공용 화장실의 휴지가 주말이 지나면 모두 사라지는 문제가 발생했다.</li><li>셰어하우스(share house) 거주 중 겪은 일</li><li>공용 물품인 휴지(toilet paper)가 무단으로 사용됨</li><li>불공평한 소비로 인해 불만(upset)을 느낌</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02문제 해결 시도</div><ul><li>론다는 문제를 해결하기 위해 공용 화장실에 정중한 당부의 글을 남겼다.</li><li>한쪽 화장실에 쪽지(note)를 부착함</li><li>휴지는 모두를 위한 공동 물품임을 강조</li><li>공유 의식(shared item)을 환기함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03결과 확인 및 대조</div><ul><li>쪽지를 붙인 화장실에서는 휴지가 돌아오는 변화가 있었지만, 그렇지 않은 곳은 그대로였다.</li><li>쪽지 효과: 몇 시간 내에 휴지(roll)가 다시 채워짐</li><li>쪽지가 없는 화장실은 변화 없음(no change)</li><li>공유지의 비극을 막는 의사소통의 중요성 강조</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">share house</td><td class=\"m\">공유 주택, 셰어하우스</td></tr><tr><td class=\"w\">fair share</td><td class=\"m\">정당한 몫, 공정한 분량</td></tr><tr><td class=\"w\">upset</td><td class=\"m\">속상한, 마음이 상한</td></tr><tr><td class=\"w\">shared item</td><td class=\"m\">공동 사용 물품, 공용 물건</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">론다는</span><span class=\"en\"><b>Rhonda</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">살고 있었다</span><span class=\"en\"><b><span class=\"grammar-hl\">was living</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">셰어 하우스에</span><span class=\"en\"><b>in a share house.</b></span></div></div><div class=\"lec-sent-ko\">Rhonda는 셰어 하우스에 살고 있었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이야기의 주인공인 론다가 공동 주거 환경이라는 특수한 상황에 처해 있음을 알려주며, 뒤이어 발생할 갈등의 배경을 설정합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was living (과거진행): be동사의 과거형(was) + 현재분사(-ing)가 결합하여 과거의 특정 시점에 진행 중이던 동작을 나타내는 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">share house</td><td class=\"m\">공유 주택, 셰어하우스</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">청소부들이 왔을 때</span><span class=\"en\"><b><span class=\"grammar-hl\">When the cleaners came</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">주말마다,</span><span class=\"en\"><b>on weekends,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 화장지를 약간 남겨 두었다</span><span class=\"en\"><b>they left some toilet paper</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">두 곳의 화장실에</span><span class=\"en\"><b>in the two bathrooms.</b></span></div></div><div class=\"lec-sent-ko\">청소부들은 주말마다 와서 두 곳의 화장실에 화장지를 약간 남겨 두었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 주거 환경에서 화장지라는 공유 자원이 정기적으로 보충되고 있음을 설명하여, 공유물의 분배라는 상황을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">When the cleaners came (관계부사(When)): 시간을 나타내는 부사절을 이끄는 접속사로, 문장에서 &#39;청소부들이 올 때&#39;라는 시간적 배경을 제공합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만,</span><span class=\"en\"><b>However,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모든 화장지가</span><span class=\"en\"><b>all the toilet paper</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다 떨어졌다</span><span class=\"en\"><b><span class=\"grammar-hl\">was gone</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">월요일쯤에는</span><span class=\"en\"><b>by Monday.</b></span></div></div><div class=\"lec-sent-ko\">그러나, 모든 화장지가 월요일쯤 다 떨어졌다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급된 자원 보충 상황에 대비되는 문제 상황을 드러내어, 공유물의 관리에 대한 갈등이 시작되었음을 알립니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was gone (수동태(의미상)): go는 자동사이나 여기서 gone은 상태를 나타내는 형용사적 용법으로 쓰였습니다. 완료된 상태를 나타내는 be+p.p. 구조와 유사하게 사용되었습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">화장지는</span><span class=\"en\"><b>The toilet paper</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모든 사람을 위한 것이었지만,</span><span class=\"en\"><b><span class=\"grammar-hl\">was for</span> everyone,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">일부는 가져갔다</span><span class=\"en\"><b>but some took</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">공평한 몫보다 더 많이</span><span class=\"en\"><b>more than their fair share.</b></span></div></div><div class=\"lec-sent-ko\">화장지는 모든 사람을 위한 것이었지만 일부는 공평한 몫보다 더 많이 가져갔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 공유 자원이 특정 인물의 이기적인 행동으로 인해 사라졌다는 문제의 원인을 구체적으로 짚어 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was for (관용표현): be for는 &#39;~를 위한 것이다/대상이다&#39;라는 의미를 나타내는 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fair share</td><td class=\"m\">정당한 몫, 공정한 분량</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀는 화가 났다</span><span class=\"en\"><b>She <span class=\"grammar-hl\">felt upset</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 문제에 대해</span><span class=\"en\"><b>about the matter.</b></span></div></div><div class=\"lec-sent-ko\">그녀는 그 문제에 대해 화가 났다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이기적인 행동으로 인해 주인공인 론다가 겪는 부정적인 감정을 표현하며, 해결책을 찾게 되는 동기를 부여합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">felt upset 2형식 구조: felt는 감각동사로 뒤에 형용사(upset)를 보어로 취하여 주어의 상태를 설명하는 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">upset</td><td class=\"m\">속상한, 마음이 상한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그래서,</span><span class=\"en\"><b>So,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀는 결심했다</span><span class=\"en\"><b>she <span class=\"grammar-hl\">decided</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">메모를 붙이기로</span><span class=\"en\"><b><span class=\"grammar-hl\">to put</span> a note</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">화장실 중 한 곳에</span><span class=\"en\"><b>in one of the bathrooms.</b></span></div></div><div class=\"lec-sent-ko\">그래서 그녀는 화장실 중 한 곳에 메모를 붙여 놓기로 결심했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 발생한 문제와 그에 따른 감정적 불편함을 해소하기 위해 론다가 구체적인 행동을 취하기로 결정했음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">decided to put (to부정사): decide(결정하다) 동사의 목적어로 사용된 명사적 용법의 to부정사(to+동사원형) 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 적혀 있었다,</span><span class=\"en\"><b>It said,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">“화장지를 모두 가져가지 마세요,</span><span class=\"en\"><b>“<span class=\"grammar-hl\">Do not take</span> all the toilet paper,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">제발.</span><span class=\"en\"><b>please.</b></span></div></div><div class=\"lec-sent-ko\">“화장지를 모두 가져가지 마세요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 론다가 문제를 해결하기 위해 시도한 구체적인 메시지 내용을 전달하며, 설득을 통해 상황을 바꾸려는 노력을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Do not take (명령문): 주어(you)가 생략되고 동사원형으로 시작하여 상대방에게 행동을 요청하거나 금지하는 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 공유 물품입니다.</span><span class=\"en\"><b>It is a <span class=\"grammar-hl\">shared</span> item.</b></span></div></div><div class=\"lec-sent-ko\">공유 물품입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 쪽지를 붙인 이후 나타난 새로운 국면을 예고하며, 독자의 관심을 다음 결과로 이끕니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">shared (과거분사(형용사)): 명사(item) 앞에서 &#39;공유된&#39;이라는 수동적 의미를 지니고 명사를 수식하는 형용사적 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">shared item</td><td class=\"m\">공동 사용 물품, 공용 물건</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 모두를 위한 것입니다.”</span><span class=\"en\"><b>It <span class=\"grammar-hl\">is for everyone</span>.”</b></span></div></div><div class=\"lec-sent-ko\">모두를 위한 것입니다.”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 메시지를 전달한 것이 타인의 행동을 긍정적으로 변화시켰다는 결과를 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is for everyone (관용표현): be for everyone은 &#39;모두를 위한 것이다&#39;라는 뜻으로 대상의 범위를 정의하는 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러자</span><span class=\"en\"><b>Then</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">놀라운 변화가 일어났다.</span><span class=\"en\"><b>there was a <span class=\"grammar-hl\">surprising</span> change.</b></span></div></div><div class=\"lec-sent-ko\">그러자 놀라운 변화가 일어났다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 쪽지를 붙인 이후 나타난 새로운 국면을 예고하며, 독자의 관심을 다음 결과로 이끕니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">surprising (현재분사(형용사)): 명사(change)를 앞에서 수식하며, &#39;놀라움을 주는&#39;이라는 능동적 의미의 상태를 나타내는 형용사적 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 11 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀는 기뻤다</span><span class=\"en\"><b>She was glad</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">보게 되어</span><span class=\"en\"><b><span class=\"grammar-hl\">to see</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">화장지 한 통이 돌아온 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">that one roll came back</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">몇 시간 후에</span><span class=\"en\"><b>in a few hours</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 또 다른 한 통이</span><span class=\"en\"><b>and another</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다음 날에</span><span class=\"en\"><b>the next day.</b></span></div></div><div class=\"lec-sent-ko\">그녀는 화장지 한 통이 몇 시간 후에, 그리고 또 다른 화장지 한 통이 다음 날에 돌아오는 것을 보고 기뻤다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 메시지를 전달한 것이 타인의 행동을 긍정적으로 변화시켰다는 결과를 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to see (to부정사): 감정의 원인을 나타내는 부사적 용법으로, &#39;보게 되어서 기쁘다&#39;는 의미를 전달하는 구조입니다.</div><div class=\"lec-gr-item\">that one roll came back (명사절(that절)): see(보다/알게 되다)라는 동사의 목적어 역할을 하는 명사절로, that 이하가 사실의 내용을 전달하는 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 12 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만,</span><span class=\"en\"><b>However,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 화장실에는</span><span class=\"en\"><b>in the other bathroom</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">메모가 없는,</span><span class=\"en\"><b><span class=\"grammar-hl\">with no note</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">화장지가 돌아오지 않았다</span><span class=\"en\"><b>no toilet paper came back</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">청소부들이 더 가져올 때까지</span><span class=\"en\"><b>until the <span class=\"grammar-hl\">cleaners brought</span> more.</b></span></div></div><div class=\"lec-sent-ko\">하지만, 메모가 없는 다른 화장실에는 청소부들이 더 가져올 때까지 화장지가 돌아오지 않았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 쪽지가 부착된 곳과 그렇지 않은 곳을 대조하여, 공동체 규칙을 상기시키는 메시지가 타인의 행동을 바꾸는 데 실제로 효과가 있었음을 확증합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">with no note (전치사구): 명사(bathroom) 뒤에서 전치사+명사 형태로 상태를 묘사하는 형용사구입니다.</div><div class=\"lec-gr-item\">cleaners brought 5형식(SVOC) 구조의 변형: 상황을 나타내는 시간절 내부에서 bring이 목적어를 취한 능동 구조입니다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>론다는 셰어하우스에서 화장지가 사라지는 문제로 스트레스를 받았다.</li><li>그녀는 공유 자원을 아껴 쓰라는 쪽지를 붙여 공동체 의식을 일깨우고자 했다.</li><li>쪽지가 붙은 화장실에는 사라졌던 화장지가 돌아오는 변화가 나타났다.</li><li>반면 쪽지가 없는 화장실에는 아무런 변화가 없었으며, 이를 통해 소통의 효과가 입증되었다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Rhonda placed a note to address the depletion of shared toilet paper, and the message successfully prompted others to return the items.</div>\n              <div class=\"lec-final-sum-ko\">론다는 공용 화장지의 고갈 문제를 해결하기 위해 메모를 남겼으며, 그 메시지는 다른 사람들이 물건을 다시 가져다 놓도록 성공적으로 유도했다.</div></div></div>"],"segs":[[{"audio":"./reading13_audio/1.mp3","hl":null}],[{"audio":"./reading13_audio/2.mp3","hl":null}],[{"audio":"./reading13_audio/3.mp3","hl":null},{"audio":"./reading13_audio/4.mp3","hl":"stage-0"},{"audio":"./reading13_audio/5.mp3","hl":"stage-1"},{"audio":"./reading13_audio/6.mp3","hl":"stage-2"}],[{"audio":"./reading13_audio/7.mp3","hl":null}],[{"audio":"./reading13_audio/8.mp3","hl":"main"},{"audio":"./reading13_audio/9.mp3","hl":"meaning"},{"audio":"./reading13_audio/10.mp3","hl":"grammar"}],[{"audio":"./reading13_audio/11.mp3","hl":"main"},{"audio":"./reading13_audio/12.mp3","hl":"meaning"},{"audio":"./reading13_audio/13.mp3","hl":"grammar"}],[{"audio":"./reading
