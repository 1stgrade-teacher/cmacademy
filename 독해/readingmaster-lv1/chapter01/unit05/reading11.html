\"lec-stage-head\">01손짓을 통한 의사소통</div><ul><li>언어 외에도 우리는 일상과 여행 등 다양한 상황에서 손짓을 사용하여 소통한다.</li><li>언어(Language)와 함께 사용되는 보조적 수단</li><li>일상생활 및 해외 여행 시 활발하게 활용</li><li>핵심 키워드: 손짓(Hand gestures), 의사소통(Communication)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02손짓의 문화적 다양성</div><ul><li>모든 손짓이 전 세계적으로 동일한 의미를 갖는 것은 아니기에 주의가 필요하다.</li><li>문화(Culture)와 국가에 따라 달라지는 의미</li><li>무분별한 사용 시 오해 발생 가능성 존재</li><li>핵심 키워드: 문화적 차이(Cultural differences), 오해(Misunderstandings)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03엄지손가락 제스처의 사례</div><ul><li>&#39;엄지 척&#39; 제스처는 널리 알려져 있지만 국가별로 해석이 극명하게 갈릴 수 있다.</li><li>긍정적인 의미: 한국, 일본 등에서 동의(Agreement)나 &#39;좋아요&#39;의 의미</li><li>부정적인 의미: 태국에서는 모욕(Insult), 호주에서는 무례함(Rudeness)으로 간주</li><li>핵심 키워드: 엄지 세우기(Thumbs up), 상징(Symbol)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04결론 및 당부</div><ul><li>문화적 배경을 이해하고 제스처를 조심스럽게 사용하는 태도가 필요하다.</li><li>불필요한 오해를 피하기 위한 주의(Carefulness)</li><li>상대 문화에 대한 존중과 이해의 중요성 강조</li><li>핵심 키워드: 주의(Careful), 문화적 감수성(Cultural sensitivity)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">communicate</td><td class=\"m\">의사소통하다, 전달하다</td></tr><tr><td class=\"w\">travel abroad</td><td class=\"m\">해외여행하다</td></tr><tr><td class=\"w\">be careful about</td><td class=\"m\">~에 대해 조심하다, ~에 신중하다</td></tr><tr><td class=\"w\">all over the world</td><td class=\"m\">전 세계적으로, 도처에</td></tr><tr><td class=\"w\">agreement</td><td class=\"m\">동의, 합의</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">insult</td><td class=\"m\">모욕, 무례한 언사</td></tr><tr><td class=\"w\">rudeness</td><td class=\"m\">무례함, 버릇없음</td></tr><tr><td class=\"w\">avoid</td><td class=\"m\">피하다, 예방하다</td></tr><tr><td class=\"w\">misunderstanding</td><td class=\"m\">오해, 착오</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 소통한다</span><span class=\"en\"><b>We <span class=\"grammar-hl\">communicate</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 사람들과</span><span class=\"en\"><b><span class=\"grammar-hl\">with</span> others</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">언어를 통해</span><span class=\"en\"><b>through language.</b></span></div></div><div class=\"lec-sent-ko\">우리는 언어를 통해 다른 사람들과 소통한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글 전체의 주제를 도입합니다. 인간이 정보를 주고받는 가장 보편적인 수단인 언어를 언급하며 논의를 시작합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">communicate with (관용표현): ~와 의사소통하다. 전치사 with를 동반하여 동작의 대상을 나타내는 자동사 표현입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">communicate</td><td class=\"m\">의사소통하다, 전달하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만 우리는 손동작을 사용한다</span><span class=\"en\"><b>But we <span class=\"grammar-hl\">use</span> hand gestures</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">의사소통을 위해</span><span class=\"en\"><b>for communication,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또한</span><span class=\"en\"><b>too.</b></span></div></div><div class=\"lec-sent-ko\">그러나 우리는 의사소통을 위해서 손동작도 사용한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 제시한 &#39;언어&#39;라는 수단 외에, 또 다른 중요한 의사소통 방식인 &#39;손짓&#39;으로 화제를 확장합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">use 5형식(SVOC) 구조의 확장: 여기서는 &#39;use A for B&#39; 패턴으로, A(hand gestures)를 B(communication)의 목적으로 활용한다는 의미입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 그것들을 자주 사용한다</span><span class=\"en\"><b>We often <span class=\"grammar-hl\">use</span> them</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">일상생활에서</span><span class=\"en\"><b>in daily life.</b></span></div></div><div class=\"lec-sent-ko\">우리는 그것들을 일상생활에서 자주 사용한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 손짓이 특별한 상황뿐만 아니라 우리의 평범한 하루 속에서도 빈번하게 쓰이고 있음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">use (일반동사): 주어 We의 동작을 나타내며, them(hand gestures)을 목적어로 취하는 3형식 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 또한 그것들을 사용할 수 있다</span><span class=\"en\"><b>We can also use them</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 해외여행을 할 때</span><span class=\"en\"><b><span class=\"grammar-hl\">when we travel abroad</span>.</b></span></div></div><div class=\"lec-sent-ko\">우리는 또한 해외여행을 할 때 그것들을 사용하기도 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 손짓이 우리가 머무는 익숙한 공간을 넘어, 언어가 통하지 않는 낯선 환경에서도 의사소통의 도구가 될 수 있음을 시사합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">when we travel abroad (관계부사(절)): 때를 나타내는 관계부사 when이 이끄는 절로, 주어 we와 동사 travel이 갖춰진 완전한 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">travel abroad</td><td class=\"m\">해외여행하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만,</span><span class=\"en\"><b>However,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모든 손동작이 ~은 아니다</span><span class=\"en\"><b>not all hand gestures</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">동일한 의미를 갖는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">have</span> the same meaning</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모든 문화에서</span><span class=\"en\"><b>in every culture!</b></span></div></div><div class=\"lec-sent-ko\">그러나, 모든 손동작이 모든 문화에서 동일한 의미를 갖는 것은 아니다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 상황인 &#39;해외여행&#39;과 연결하여, 문화마다 서로 다른 관습으로 인해 손짓이 오해를 부를 수 있다는 글의 핵심적인 문제 제기를 수행합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">have (일반동사): 주어 hand gestures가 가지는 상태를 설명하는 3형식 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러므로,</span><span class=\"en\"><b>Therefore,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 주의해야 한다</span><span class=\"en\"><b>we should be careful</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 그것들을 언제 그리고 어떻게 사용하는지에 관하여</span><span class=\"en\"><b>about <span class=\"grammar-hl\">when and how we use them</span>.</b></span></div></div><div class=\"lec-sent-ko\">그러므로 우리는 그것들을 언제 그리고 어떻게 사용할지 주의해야 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 문화적 차이라는 앞의 원인으로부터 도출되는 결론입니다. 손짓을 사용할 때는 신중함이 필요하다는 행동 지침을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">when and how we use them (간접의문문): 의문사 when과 how가 이끄는 명사절이 전치사 about의 목적어 역할을 합니다. 의문사+주어+동사 순서의 어순을 취합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">be careful about</td><td class=\"m\">~에 대해 조심하다, ~에 신중하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">엄지척은</span><span class=\"en\"><b>The <span class=\"grammar-hl\">thumbs up</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">좋은 예이다</span><span class=\"en\"><b>is a good example.</b></span></div></div><div class=\"lec-sent-ko\">엄지척이 좋은 예이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 &#39;문화에 따라 의미가 달라질 수 있는 손짓&#39;의 구체적인 사례를 소개합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">thumbs up (관용표현): 엄지손가락을 치켜세우는 행위를 지칭하는 명사구입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 제스처는</span><span class=\"en\"><b>This gesture</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매우 인기 있고 잘 알려져 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">is</span> very popular and <span class=\"grammar-hl\">well known</span>.</b></span></div></div><div class=\"lec-sent-ko\">이 제스처는 매우 인기 있고 잘 알려져 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 엄지손가락을 치켜세우는 동작이 전 세계적으로 얼마나 친숙한 상징인지를 설명하며 보편성을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is (be동사): 주어 This gesture의 상태를 설명하는 2형식 구조입니다.</div><div class=\"lec-gr-item\">well known (과거분사(형용사)): know(알다)의 과거분사 known이 쓰여 주어의 상태를 설명합니다. 이 자체는 수동태가 아니라 형용사적 보어 역할을 합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사람들은 흔히 그것을 사용한다</span><span class=\"en\"><b>People often <span class=\"grammar-hl\">use</span> it</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">전 세계에서</span><span class=\"en\"><b>all over the world.</b></span></div></div><div class=\"lec-sent-ko\">전세계 사람들이 흔히 그것을 사용한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 8번 문장에 이어, 이 손짓이 지역을 가리지 않고 널리 쓰이고 있음을 재차 확인해 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">use (일반동사): 주어 People이 it을 목적어로 활용하는 동작을 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">all over the world</td><td class=\"m\">전 세계적으로, 도처에</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 사랑받는 이모지이다,</span><span class=\"en\"><b>It <span class=\"grammar-hl\">is</span> a beloved emoji,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또한</span><span class=\"en\"><b>too.</b></span></div></div><div class=\"lec-sent-ko\">그것은 사랑받는 이모지이기도 하다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 실생활을 넘어 디지털 통신 환경에서도 이 손짓이 긍정적인 의미로 활발히 사용되고 있음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is (be동사): 주어 It의 정체를 보어인 a beloved emoji로 설명하는 2형식 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 11 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 보통 동의나 ‘좋다’를 의미한다</span><span class=\"en\"><b>It usually <span class=\"grammar-hl\">means</span> agreement or “okay”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 국가들에서</span><span class=\"en\"><b>in many countries</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한국과 일본 같은</span><span class=\"en\"><b>like Korea and Japan.</b></span></div></div><div class=\"lec-sent-ko\">일반적으로 그것은 한국, 일본과 같은 많은 국가에서 동의 또는 ‘좋다’를 의미한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 손짓이 가진 긍정적인 통념을 설명하며, 왜 사람들이 이 손짓을 쉽게 사용하는지 그 배경을 알려줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">means (일반동사): 주어 It이 나타내는 의미(agreement or okay)를 보충하는 3형식 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">agreement</td><td class=\"m\">동의, 합의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 12 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만,</span><span class=\"en\"><b>However,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 모욕일 수 있다</span><span class=\"en\"><b>it <span class=\"grammar-hl\">may be</span> an insult</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">태국에서는</span><span class=\"en\"><b>in Thailand.</b></span></div></div><div class=\"lec-sent-ko\">그러나 태국에서는 모욕일 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 11번 문장에서 언급한 긍정적 의미와 대비되는 부정적 사례를 제시하여, 문화적 상대성을 극명하게 드러냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">may be (조동사구): 가능성을 나타내는 조동사 may와 be동사가 결합하여 상태를 추측합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">insult</td><td class=\"m\">모욕, 무례한 언사</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 13 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그리고 그것은 ‘아니요’를 의미하거나 무례함을 나타낼 수 있다</span><span class=\"en\"><b>And it <span class=\"grammar-hl\">may mean</span> “no” or show rudeness</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">호주에서는</span><span class=\"en\"><b>in Australia.</b></span></div></div><div class=\"lec-sent-ko\">그리고 그것은 호주에서 ‘아니요’를 의미하거나 무례함을 보이는 것일 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 태국의 사례에 이어 또 다른 문화권에서의 부정적인 의미를 추가하며, 손짓의 해석이 지역별로 얼마나 다른지 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">may mean (조동사구): 가능성을 나타내는 조동사 may와 일반동사 mean이 결합하여 의미를 추측합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">rudeness</td><td class=\"m\">무례함, 버릇없음</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 14 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">엄지척과 같은 제스처들은</span><span class=\"en\"><b>Gestures <span class=\"grammar-hl\">such as</span> a thumbs up</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 의미들을 가진다</span><span class=\"en\"><b>have different meanings</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 문화나 국가들에서</span><span class=\"en\"><b>in many cultures or countries.</b></span></div></div><div class=\"lec-sent-ko\">엄지척과 같은 제스처는 많은 문화나 국가에서 다른 의미를 지닌다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 개별적인 예시를 마무리하며, 다시 한번 일반적인 진실을 정리하여 5번 문장에서 제기한 논지를 뒷받침합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">such as (관용표현): ~와 같은, 전치사구로 뒤의 명사(a thumbs up)를 예시로 들어 앞의 Gestures를 수식합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 15 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러니,</span><span class=\"en\"><b>So,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오해를 피하기 위해서는,</span><span class=\"en\"><b><span class=\"grammar-hl\">to avoid</span> misunderstandings,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">주의해라</span><span class=\"en\"><b>be careful</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">네가 그것들을 어떻게 사용하는지</span><span class=\"en\"><b><span class=\"grammar-hl\">how you use them</span>!</b></span></div></div><div class=\"lec-sent-ko\">그러니 오해를 피하기 위해서는 그것들을 어떻게 사용할지 주의해라!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글 전체를 관통하는 핵심 메시지입니다. 문화 간의 차이를 존중하고 소통의 오류를 줄이기 위해 우리가 가져야 할 태도를 다시 한번 당부합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to avoid (to부정사): 목적을 나타내는 부사적 용법으로, 뒤에 명사구 misunderstandings를 목적어로 취합니다.</div><div class=\"lec-gr-item\">how you use them (간접의문문): 의문사 how가 이끄는 절이 be careful의 대상을 보충하는 명사적 구조입니다. 의문사+주어+동사 어순을 따릅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">avoid</td><td class=\"m\">피하다, 예방하다</td></tr><tr><td class=\"w\">misunderstanding</td><td class=\"m\">오해, 착오</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>인간은 언어 외에도 의사소통 수단으로 손짓을 흔히 사용한다.</li><li>하지만 손짓은 문화마다 고유한 의미를 지니므로, 같은 동작이라도 해석이 다를 수 있다.</li><li>엄지손가락을 치켜세우는 동작을 예로 들면, 국가에 따라 긍정이나 부정, 심지어 모욕으로도 해석된다.</li><li>따라서 타 문화권과의 소통 과정에서 오해를 피하려면 손짓을 사용하는 방식에 주의를 기울여야 한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Hand gestures vary in meaning across different cultures, so we must be cautious when using them to prevent misunderstandings.</div>\n              <div class=\"lec-final-sum-ko\">손짓은 문화마다 의미가 다르기 때문에, 오해를 방지하기 위해 이를 사용할 때 신중해야 한다.</div></div></div>"],"segs":[[{"audio":"./reading11_audio/1.mp3","hl":null}],[{"audio":"./reading11_audio/2.mp3","hl":null}],[{"audio":"./reading11_audio/3.mp3","hl":null},{"audio":"./reading11_audio/4.mp3","hl":"stage-0"},{"audio":"./reading11_audio/5.mp3","hl":"stage-1"},{"audio":"./reading11_audio/6.mp3","hl":"stage-2"},{"audio":"./reading11_audio/7.mp3","hl":"stage-3"}],[{"audio":"./reading11_audio/8.mp3","hl":null}],[{"audio":"./reading11_audio/9.mp3","hl":"main"},{"audio":"./reading11_audio/10.mp3","hl":"meaning"},{"audio":"./reading11_audio/11.mp3","hl":"grammar"}],[{"audio":"./reading11_audio/12.mp3","hl":"main"},{"audio":"./reading11_audio/13.mp3","hl":"meaning"},{"audio":"./reading11_audio/14.mp3","hl":"grammar"}],[{"audio":"./reading11_audio/15.mp3","hl":"main"},{"audio":"./reading11_audio/16.mp3","hl":"meaning"},{"audio":"./reading11_audio/17.mp3","hl":"grammar"}],[{"audio":"./reading11_audio/18.mp3","hl":"main"},{"audio":"./reading11_audio/19.mp3","hl":"meaning"},{"audio":"./reading11_audio/20.mp3","hl":"grammar"}],[{"audio":"./reading11_audio/21.mp3","hl":"main"},{"audio":"./reading11_audio/22.mp3","hl":"meaning"},{"audio":"./reading11_audio/23.mp3","hl":"grammar"}],[{"audio":"./reading11_audio/24.mp3","hl":"main"},{"audio":"./reading11_audio/25.mp3","hl":"meaning"},{"audio":"./reading11_audio/26.mp3","hl":"grammar"}],[{"audio":"./reading11_audio/27.mp3","hl":"main"},{"audio":"./reading11_audio/28.mp3","hl":"meaning"},{"audio":"./reading11_audio/29.mp3","hl":"grammar"}],[{"audio":"./reading11_audio/30.mp3","hl":"main"},{"audio":"./reading11_audio/31.mp3","hl":"meaning"},{"audio":"./reading11_audio/32.mp3","hl":"grammar"}],[{"audio":"./reading11_audio/33.mp3","hl
