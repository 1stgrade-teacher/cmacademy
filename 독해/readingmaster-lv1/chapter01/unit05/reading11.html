<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터1 Reading 11 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터1 Reading 11","audioDir":"reading11_audio","preview":false,"count":58,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.668em\">Reading\u003cbr>11\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터1\u003c/div>\u003ch1>Same Gesture, Different Meanings\u003c/h1>\u003ch2>같은 손동작, 다른 의미\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>손동작은 일상생활과 해외여행에서 유용한 \u003cb class=\"key\">의사소통\u003c/b> 수단이지만, 모든 문화에서 같은 의미를 갖지는 않는다. 엄지척처럼 익숙한 제스처도 나라에 따라 \u003cb class=\"key\">모욕\u003c/b>이나 무례함이 될 수 있으므로, \u003cb class=\"key\">오해\u003c/b>를 피하려면 사용법에 주의해야 한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Hand gestures such as the thumbs up have different meanings in different cultures, so we should be careful when and how we use them.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 손동작, 영어로 hand gestures에 관한 짧지만 아주 알찬 지문을 함께 읽어 볼 거예요. 이 글은 우리가 언어만으로 소통하는 게 아니라는 사실에서 출발해서, 엄지척 하나가 나라마다 얼마나 다르게 통하는지를 보여 줍니다. 요지는 간단해요. 손동작은 문화마다 의미가 다르니까 사용에 주의하자는 것입니다. 자, 그럼 한 문장씩 들어가 볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">말 없이 손짓이나 표정으로 뜻을 전달하는 방식을 non-verbal communication, 즉 비언어적 의사소통이라고 부릅니다. 손동작은 태어날 때부터 정해진 신호가 아니라, 그 문화 안에서 자연스럽게 배우는 일종의 \u003cb class=\"key\">약속\u003c/b>입니다. 그래서 같은 동작도 문화권이 다르면 전혀 다른 뜻이 될 수 있습니다. 우리가 친구에게 가볍게 손을 흔드는 것과, 낯선 나라에서 같은 동작을 했을 때 다른 반응이 돌아오는 것과 같은 이치입니다. 문화마다 다른 이런 암묵적 규칙을 cultural norm이라고 하며, 외국어를 배울 때는 언어뿐 아니라 이런 \u003cb class=\"key\">규칙\u003c/b>도 함께 익혀야 합니다. 엄지척은 그 차이를 보여 주는 대표적인 \u003cb class=\"key\">사례\u003c/b>로, 한쪽에서는 칭찬이 다른 쪽에서는 모욕이 될 수 있습니다.\u003c/div>","segs":[{"n":2,"text":"본문에 들어가기 전에 배경지식을 조금 깔아 볼게요. 말 없이 손짓이나 표정으로 뜻을 전달하는 방식을 비언어적 의사소통, 영어로 non-verbal communication이라고 불러요. 손동작은 태어날 때부터 정해진 신호가 아니라, 그 문화 안에서 자연스럽게 배우는 약속 같은 것이에요. 그래서 같은 동작도 문화권이 다르면 전혀 다른 뜻이 될 수 있죠. 우리가 친구에게 가볍게 손을 흔드는 것과, 낯선 나라에서 같은 동작을 했을 때 다른 반응이 돌아오는 것과 같은 이치예요. 문화마다 다른 이런 암묵적 규칙을 cultural norm이라고 하는데, 외국어를 배울 때는 언어뿐 아니라 이런 규칙도 함께 익혀야 해요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>언어와 손동작\u003csmall>도입 · 문장 1–4\u003c/small>\u003c/h4>\u003cp>우리는 언어를 통해 다른 사람들과 소통하지만, 의사소통의 도구가 언어만은 아니라는 점을 첫 문장부터 차근차근 깔아 줍니다. 의사소통을 위해 \u003cb class=\"key\">손동작\u003c/b>도 사용하고, 일상생활에서 자주 쓰며, 해외여행을 할 때도 활용한다는 것이죠. 이 단계는 \u003cb class=\"key\">언어\u003c/b>와 손동작을 나란히 놓아 주제로 들어가는 발판입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>뒤집히는 통념\u003csmall>전환·주장 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>However로 시작하는 다섯 번째 문장에서 글이 확 뒤집힙니다. 모든 손동작이 모든 문화에서 동일한 의미를 갖는 것은 아니라는 \u003cb class=\"key\">반박\u003c/b>이 나오죠. 그러자 여섯 번째 문장에서는 언제 어떻게 사용할지 주의해야 한다는 \u003cb class=\"key\">주장\u003c/b>이 자연스럽게 따라옵니다. 여기가 이 글의 주제 구간입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>엄지척 소개\u003csmall>예시 · 문장 7–10\u003c/small>\u003c/h4>\u003cp>일곱 번째 문장에서 엄지척, 즉 \u003cb class=\"key\">thumbs \u003c/b>\u003cb class=\"key\">up\u003c/b>이 구체적인 예로 등장합니다. 이 제스처가 매우 인기 있고 잘 알려져 있으며 전 세계 사람들이 흔히 사용한다는 점을 설명합니다. 사랑받는 \u003cb class=\"key\">이모지\u003c/b>이기도 하다고 덧붙여, 우리에게 얼마나 익숙한 동작인지를 강조합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>나라별 반례\u003csmall>반례·대조 · 문장 11–13\u003c/small>\u003c/h4>\u003cp>열한 번째 문장에서 엄지척의 일반적인 의미를 먼저 제시합니다. 한국과 일본 같은 많은 국가에서는 동의나 좋다는 뜻이죠. 그런데 열두 번째 문장에서 태국에서는 \u003cb class=\"key\">모욕\u003c/b>일 수 있다고 하고, 열세 번째 문장에서는 호주에서 아니요를 의미하거나 무례함을 보이는 것일 수 있다는 \u003cb class=\"key\">반례\u003c/b>를 내세웁니다. 같은 동작이 정반대로 통하는 순간입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>주의하라는 당부\u003csmall>결론 · 문장 14–15\u003c/small>\u003c/h4>\u003cp>마지막 두 문장은 예시를 일반화하며 글을 닫습니다. 엄지척과 같은 제스처가 많은 문화나 국가에서 다른 \u003cb class=\"key\">의미\u003c/b>를 지닌다고 정리합니다. 그래서 \u003cb class=\"key\">오해\u003c/b>를 피하려면 그것들을 어떻게 사용할지 주의하라고 당부합니다. 앞에서 던진 주장을 마지막에 다시 붙잡아 주는 구조입니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 다섯 단계로 나눠서 따라가 볼게요.","hl":null},{"n":4,"text":"첫 단계는 도입이에요. 우리는 언어를 통해 다른 사람들과 소통하지만, 의사소통의 도구가 언어만은 아니라는 점을 말하고 있어요. 손동작도 의사소통에 쓰이고, 일상생활에서 자주 쓰며, 해외여행을 할 때도 활용한다는 것을 첫 번째부터 네 번째 문장까지 차분히 깔아 줍니다. 언어와 손동작을 나란히 놓아 주제로 들어가는 발판인 거죠.","hl":"f0"},{"n":5,"text":"두 번째 단계에서 글이 확 뒤집혀요. However로 시작하는 다섯 번째 문장에서 모든 손동작이 모든 문화에서 동일한 의미를 갖는 것은 아니라는 반박이 나옵니다. 그러자 여섯 번째 문장에서 언제 어떻게 사용할지 주의해야 한다는 주장이 자연스럽게 따라오죠. 여기가 이 글의 주제 문장 구간입니다.","hl":"f1"},{"n":6,"text":"세 번째 단계는 예시예요. 일곱 번째 문장에서 엄지척, the thumbs up이 등장합니다. 이 제스처가 매우 인기 있고 잘 알려져 있으며 전 세계 사람들이 흔히 사용한다는 점을 설명하고, 사랑받는 이모지이기도 하다고 덧붙여요. 우리에게 얼마나 익숙한 동작인지를 먼저 강조하는 거죠.","hl":"f2"},{"n":7,"text":"네 번째 단계는 반례예요. 열한 번째 문장에서 한국과 일본 같은 많은 국가에서는 동의나 좋다는 뜻이라고 일반적인 의미를 먼저 말합니다. 그런데 열두 번째 문장에서 태국에서는 모욕일 수 있다고 하고, 열세 번째 문장에서는 호주에서 아니요를 의미하거나 무례함을 보이는 것일 수 있다고 말해요. 같은 동작이 정반대로 통하는 순간이죠.","hl":"f3"},{"n":8,"text":"다섯 번째 단계는 결론이에요. 엄지척과 같은 제스처가 많은 문화나 국가에서 다른 의미를 지닌다고 정리하고, 그래서 오해를 피하려면 그것들을 어떻게 사용할지 주의하라고 당부합니다. 마지막 문장이 앞에서 던진 주장을 다시 한 번 단단하게 붙잡아 주는 거예요.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">비교·대조\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 5번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">다섯 번째 문장에서 not all A have the same meaning이라는 \u003cb class=\"key\">부분 \u003c/b>\u003cb class=\"key\">부정\u003c/b>으로 통념을 뒤집고, 곧바로 여섯 번째 문장에서 주의하라는 \u003cb class=\"key\">주장\u003c/b>을 내놓습니다. 이후 엄지척 하나를 놓고 한국·일본과 태국·호주를 \u003cb class=\"key\">대조\u003c/b>하며 근거를 쌓아 갑니다. 마지막에 다시 주의하라는 당부로 돌아오므로 주장과 근거가 앞뒤에서 호응하는 두괄식 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003c/div>","segs":[{"n":9,"text":"이 글의 전개 방식은 비교와 대조예요. 다섯 번째 문장에서 주제를 먼저 던지고, 그 뒤에 엄지척이라는 하나의 예시를 놓고 나라별 의미를 비교하죠. 주제가 앞에 나오고 근거가 뒤따르는 두괄식 구조라서, 앞부분에서 핵심을 잡으면 나머지는 따라오기 쉬워요. 실제로 주제 문장은 다섯 번째 문장입니다.","hl":"ty"},{"n":10,"text":"신호어를 눈여겨보세요. 두 번째 문장의 But은 언어에서 손동작으로 화제를 넓히는 신호이고, 다섯 번째 문장의 However는 통념을 뒤집는 결정적인 신호예요. 여섯 번째 문장의 Therefore는 그 반박에서 주의하라는 결론을 끌어내고, 열두 번째 문장의 However는 앞에서 말한 일반적인 의미를 정면으로 대조합니다. 마지막 문장의 So까지 따라가면 주장이 어떻게 반복되는지 보여요. 그리고 hand gestures가 them, this gesture, the thumbs up으로 계속 바뀌어 나오는 재진술도 놓치지 마세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>communicate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>소통하다, 의사소통하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>through\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~을 통해\u003c/span>\u003c/div>\u003cdiv>\u003cb>language\u003c/b>\u003cem>명사\u003c/em>\u003cspan>언어\u003c/span>\u003c/div>\u003cdiv>\u003cb>gesture\u003c/b>\u003cem>명사\u003c/em>\u003cspan>손동작, 몸짓\u003c/span>\u003c/div>\u003cdiv>\u003cb>communication\u003c/b>\u003cem>명사\u003c/em>\u003cspan>의사소통\u003c/span>\u003c/div>\u003cdiv>\u003cb>daily life\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>일상생활\u003c/span>\u003c/div>\u003cdiv>\u003cb>travel abroad\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>해외여행을 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>abroad\u003c/b>\u003cem>부사\u003c/em>\u003cspan>해외에, 해외로\u003c/span>\u003c/div>\u003cdiv>\u003cb>not all\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>모두가 ~인 것은 아니다\u003c/span>\u003c/div>\u003cdiv>\u003cb>culture\u003c/b>\u003cem>명사\u003c/em>\u003cspan>문화\u003c/span>\u003c/div>\u003cdiv>\u003cb>therefore\u003c/b>\u003cem>부사\u003c/em>\u003cspan>그러므로\u003c/span>\u003c/div>\u003cdiv>\u003cb>be careful about\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 주의하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>thumbs up\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>엄지척\u003c/span>\u003c/div>\u003cdiv>\u003cb>example\u003c/b>\u003cem>명사\u003c/em>\u003cspan>예, 사례\u003c/span>\u003c/div>\u003cdiv>\u003cb>popular\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>인기 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>well known\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>잘 알려진\u003c/span>\u003c/div>\u003cdiv>\u003cb>all over the world\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>전 세계에\u003c/span>\u003c/div>\u003cdiv>\u003cb>beloved\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>사랑받는\u003c/span>\u003c/div>\u003cdiv>\u003cb>emoji\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이모지\u003c/span>\u003c/div>\u003cdiv>\u003cb>usually\u003c/b>\u003cem>부사\u003c/em>\u003cspan>일반적으로, 보통\u003c/span>\u003c/div>\u003cdiv>\u003cb>agreement\u003c/b>\u003cem>명사\u003c/em>\u003cspan>동의\u003c/span>\u003c/div>\u003cdiv>\u003cb>insult\u003c/b>\u003cem>명사\u003c/em>\u003cspan>모욕\u003c/span>\u003c/div>\u003cdiv>\u003cb>show\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보이다, 나타내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>rudeness\u003c/b>\u003cem>명사\u003c/em>\u003cspan>무례함\u003c/span>\u003c/div>\u003cdiv>\u003cb>such as\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~와 같은\u003c/span>\u003c/div>\u003cdiv>\u003cb>meaning\u003c/b>\u003cem>명사\u003c/em>\u003cspan>의미\u003c/span>\u003c/div>\u003cdiv>\u003cb>avoid\u003c/b>\u003cem>동사\u003c/em>\u003cspan>피하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>misunderstanding\u003c/b>\u003cem>명사\u003c/em>\u003cspan>오해\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"단어도 몇 개 짚을게요. communicate는 소통하다, gesture는 손동작이나 몸짓이라는 뜻이고, communication은 의사소통이에요. insult는 모욕, rudeness는 무례함, misunderstanding은 오해라는 뜻이니 문맥과 함께 외워 두세요. avoid는 피하다, such as는 ~와 같은이라는 숙어로 자주 나옵니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">communicate\u003c/b>\u003cspan class=\"m\">소통하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">convey\u003c/span>\u003cspan class=\"s\">interact\u003c/span>\u003cspan class=\"s\">connect\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003cspan class=\"a\">isolate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">gesture\u003c/b>\u003cspan class=\"m\">손동작, 몸짓\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">sign\u003c/span>\u003cspan class=\"s\">signal\u003c/span>\u003cspan class=\"s\">motion\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">careful\u003c/b>\u003cspan class=\"m\">주의하는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">cautious\u003c/span>\u003cspan class=\"s\">attentive\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">careless\u003c/span>\u003cspan class=\"a\">reckless\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">popular\u003c/b>\u003cspan class=\"m\">인기 있는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">well-liked\u003c/span>\u003cspan class=\"s\">widespread\u003c/span>\u003cspan class=\"s\">common\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unpopular\u003c/span>\u003cspan class=\"a\">rare\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">insult\u003c/b>\u003cspan class=\"m\">모욕\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">offense\u003c/span>\u003cspan class=\"s\">disrespect\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">compliment\u003c/span>\u003cspan class=\"a\">praise\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">avoid\u003c/b>\u003cspan class=\"m\">피하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">prevent\u003c/span>\u003cspan class=\"s\">escape\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">face\u003c/span>\u003cspan class=\"a\">confront\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">different\u003c/b>\u003cspan class=\"m\">다른\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">distinct\u003c/span>\u003cspan class=\"s\">diverse\u003c/span>\u003cspan class=\"s\">dissimilar\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">same\u003c/span>\u003cspan class=\"a\">identical\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">usually\u003c/b>\u003cspan class=\"m\">일반적으로\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">generally\u003c/span>\u003cspan class=\"s\">normally\u003c/span>\u003cspan class=\"s\">typically\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">rarely\u003c/span>\u003cspan class=\"a\">seldom\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어로 어휘를 넓혀 볼게요. communicate는 convey, interact와 가깝고 ignore와는 반대예요. careful은 cautious, attentive와 통하고 careless는 반대말이죠. popular는 well-liked, widespread와 가깝고 unpopular는 반대입니다. insult는 offense, disrespect와 같고 compliment는 정반대예요. avoid는 prevent, escape와 가깝고 different는 distinct, diverse와 통한답니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 소통한다\u003c/span>\u003cspan class=\"en\">We \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">communicate \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 사람들과\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">others\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">언어를 통해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">through \u003c/span>\u003cspan class=\"tgt\">language\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 언어를 통해 다른 사람들과 소통한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글의 가장 앞에서 \u003cb class=\"key\">의사소통\u003c/b>의 대표 수단이 언어임을 밝히는 도입 문장이에요. 여기서 through는 '~을 통해서'라는 \u003cb class=\"key\">수단\u003c/b>의 의미로, 언어가 소통의 도구임을 보여 줍니다. 뒤에 나올 손동작 이야기와 대조시키기 위해 언어를 먼저 언급한 것이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">자동사 communicate + 전치사 with\u003c/span> : communicate [자동사] + with + [사람] : \"다른 사람들과 소통하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 through (수단·매개)\u003c/span> : through + [명사] (수단·매개) : \"언어를 통해\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"We communicate, 우리는 소통한다. with others, 다른 사람들과. through language, 언어를 통해. 이 문장 전체를 해석하면, 우리는 언어를 통해 다른 사람들과 소통한다.","hl":"m"},{"n":14,"text":"이 문장은 글의 첫 문장이에요. 사람들이 소통할 때 가장 먼저 떠올리는 수단이 언어라는 점을 짚어 주고 있죠. 이렇게 언어를 먼저 말해 두고, 다음 문장에서 손동작을 꺼내면서 흐름을 만들어 갑니다.","hl":"mn"},{"n":15,"text":"첫 번째로 communicate with others를 보세요. communicate는 자동사라서 목적어를 바로 못 쓰고 전치사 with를 데려와야 해요. 두 번째로 through language인데, through는 수단, 즉 매개를 나타내는 전치사예요. 언어라는 매개체를 통과해서 소통한다는 그림으로 이해하면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 15\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나\u003c/span>\u003cspan class=\"en\">But\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 손동작을 사용한다\u003c/span>\u003cspan class=\"en\">we use hand gestures\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">의사소통을 위해서도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">communication\u003c/span>, \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">too\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 우리는 의사소통을 위해서 손동작도 사용한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 '언어'와 대비되는 새 소재인 \u003cb class=\"key\">손동작\u003c/b>을 꺼내는 문장이에요. But이 앞 내용과의 \u003cb class=\"key\">대조\u003c/b>를 만들고, too가 '언어뿐 아니라 손동작도'라는 \u003cb class=\"key\">첨가\u003c/b>의 느낌을 더합니다. 이 문장이 글 전체의 주제를 여는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 for (목적)\u003c/span> : use + [목적어] + for + [명사] : \"의사소통을 위해서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">첨가의 부사 too\u003c/span> : [문장] + too (문장 끝) : \"역시, ~도\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"But, 그러나. we use hand gestures, 우리는 손동작을 사용한다. for communication, too, 의사소통을 위해서도. 이 문장 전체를 해석하면, 그러나 우리는 의사소통을 위해서 손동작도 사용한다.","hl":"m"},{"n":17,"text":"앞에서 언어를 말했으니, 이번엔 손동작을 꺼내는 거예요. But이 앞 내용과 대조를 만들고, too가 '언어뿐만 아니라 손동작도'라는 첨가의 느낌을 더해 줍니다. 사실상 이 글의 주제를 여는 핵심 문장이에요.","hl":"mn"},{"n":18,"text":"첫 번째로 for communication을 보세요. for는 목적을 나타내는 전치사라서 use hand gestures for communication은 '의사소통을 위해 손동작을 사용하다'가 됩니다. 두 번째로 문장 끝의 too는 첨가의 부사예요. 앞 문장의 언어에 손동작을 하나 더 얹는 역할을 하죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 그것들을 자주 사용한다\u003c/span>\u003cspan class=\"en\">We \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">often\u003c/span> use \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">them\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일상생활에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">daily \u003c/span>\u003cspan class=\"tgt\">life\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 그것들을 일상생활에서 자주 사용한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 hand gestures를 them으로 받아, 손동작이 \u003cb class=\"key\">일상\u003c/b>에서 흔히 쓰인다는 점을 덧붙이는 문장이에요. often이 습관적인 \u003cb class=\"key\">빈도\u003c/b>를 나타내고 in daily life가 그 장소적 범위를 좁혀 줍니다. 뒤에 나올 여행 상황으로 자연스럽게 확장되는 발판이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">빈도부사의 위치\u003c/span> : [주어] + [빈도부사] + [일반동사] : \"자주\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">인칭대명사의 목적격 (지시 대명사적 용법)\u003c/span> : [앞에 나온 복수명사] → them : \"그것들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 용법\u003c/span> : in + [추상명사] (장소·범위) : \"일상생활에서\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"We often use them, 우리는 그것들을 자주 사용한다. in daily life, 일상생활에서. 이 문장 전체를 해석하면, 우리는 그것들을 일상생활에서 자주 사용한다.","hl":"m"},{"n":20,"text":"앞 문장에서 나온 hand gestures를 them으로 짧게 받아 준 문장이에요. 손동작이 특별한 상황이 아니라 일상에서 흔히 쓰인다는 점을 강조하고 있죠. 그리고 다음 문장에서 여행이라는 새로운 상황으로 자연스럽게 넘어갑니다.","hl":"mn"},{"n":21,"text":"첫 번째로 often을 보세요. 빈도부사는 일반동사 앞에 오기 때문에 use 앞에 자리 잡았어요. 두 번째로 them은 앞에 나온 복수명사를 대신 받는 목적격 대명사예요. 세 번째로 in daily life는 문장 끝에서 장소와 범위를 넓혀 주는 부사구이고, life는 추상명사라서 관사를 쓰지 않는다는 것도 함께 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 또한 그것들을 사용할 수 있다\u003c/span>\u003cspan class=\"en\">We \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">also \u003c/span>\u003cspan class=\"tgt\">use\u003c/span> them\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 해외여행을 할 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">travel \u003c/span>\u003cspan class=\"tgt\">abroad\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 또한 해외여행을 할 때 그것들을 사용하기도 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 손동작이 일상에서만 쓰이는 게 아니라 \u003cb class=\"key\">해외여행\u003c/b> 상황에서도 의사소통 도구로 쓰인다는 점을 덧붙이는 문장이에요. 앞 문장의 '일상생활'에서 한 걸음 나아가 사용 범위를 넓혀 주는 \u003cb class=\"key\">연결\u003c/b> 역할을 하죠. also가 앞 내용에 \u003cb class=\"key\">추가\u003c/b> 정보를 얹어 준다는 것도 기억하세요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 can(가능·능력)\u003c/span> : [주어] + can + [동사원형] : ~할 수 있다 : \"또한 사용할 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 when(시간 부사절)\u003c/span> : [주어] + [동사] + when + [주어] + [동사] : ~할 때 : \"우리가 해외여행을 할 때\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"We can also use them, 우리는 또한 그것들을 사용할 수 있다. when we travel abroad, 우리가 해외여행을 할 때. 이 문장 전체를 해석하면, 우리는 또한 해외여행을 할 때 그것들을 사용하기도 한다.","hl":"m"},{"n":23,"text":"이 문장은 손동작을 일상에서만 쓰는 게 아니라 해외여행에서도 쓴다고 말하고 있어요. 앞 문장에서 일상생활을 이야기했으니, 여기서는 사용 범위를 넓혀 주는 연결 역할을 하죠. also가 붙어서 앞 내용에 정보를 추가한다는 점도 꼭 기억하세요.","hl":"mn"},{"n":24,"text":"첫 번째 포인트는 조동사 can이에요. can 뒤에는 반드시 동사원형이 와서 가능이나 능력을 나타내죠. 두 번째 포인트는 접속사 when이 이끄는 시간 부사절이에요. when 뒤에 주어와 동사가 있는 절이 와서 시간을 알려 주고, 미래의 일이라도 시간 부사절에서는 현재시제를 쓴다는 것도 함께 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 15\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나,\u003c/span>\u003cspan class=\"en\">However,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 손동작이 (~인 것은 아니다)\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">all\u003c/span> hand gestures\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">동일한 의미를 갖는 것은 아니다\u003c/span>\u003cspan class=\"en\">have \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">same \u003c/span>\u003cspan class=\"tgt\">meaning\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 문화에서!\u003c/span>\u003cspan class=\"en\">in every culture!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나, 모든 손동작이 모든 문화에서 동일한 의미를 갖는 것은 아니다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> not all이 \u003cb class=\"key\">부분 \u003c/b>\u003cb class=\"key\">부정\u003c/b>이라 '모든 ~이 그런 것은 아니다'라는 뜻이 된다는 점이 핵심이에요. 이 문장은 지문의 \u003cb class=\"key\">주제문\u003c/b>으로, 손동작의 의미가 \u003cb class=\"key\">문화\u003c/b>마다 다르다는 큰 방향을 제시하죠. 뒤에 나오는 엄지손가락 이야기는 이 주장을 뒷받침하는 \u003cb class=\"key\">예시\u003c/b>예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부분 부정(not all)\u003c/span> : not all + [복수명사] + [복수동사] : 모든 ~이 …인 것은 아니다 : \"모든 손동작이 …인 것은 아니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">the same + 명사(동일한 ~)\u003c/span> : the same + [명사] : 동일한 [명사] : \"동일한 의미\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"However, 그러나. not all hand gestures, 모든 손동작이 (~인 것은 아니다). have the same meaning, 동일한 의미를 갖는 것은 아니다. in every culture!, 모든 문화에서!. 이 문장 전체를 해석하면, 그러나, 모든 손동작이 모든 문화에서 동일한 의미를 갖는 것은 아니다!","hl":"m"},{"n":26,"text":"이 문장은 이 지문의 주제문이에요. not all이 부분 부정이라서 모든 손동작이 모든 문화에서 같은 의미를 갖는 건 아니라는 뜻이 되죠. 뒤에 나오는 엄지손가락 이야기가 이 주장을 뒷받침하는 예시라는 것도 함께 기억하세요.","hl":"mn"},{"n":27,"text":"첫 번째 포인트는 부분 부정이에요. not all은 전체를 부정하는 게 아니라 일부만 부정해서 모든 것이 그런 것은 아니다라는 뜻을 만들어요. 두 번째 포인트는 the same인데요, the same은 항상 the와 함께 쓰여서 동일하다는 뜻을 만들고 뒤에 명사가 와서 무엇이 같은지 알려 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 15\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러므로,\u003c/span>\u003cspan class=\"en\">Therefore,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 주의해야 한다\u003c/span>\u003cspan class=\"en\">we \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">should \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">careful\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">언제 그리고 어떻게 (~하는지)에 대해서\u003c/span>\u003cspan class=\"en\">about \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 그것들을 사용하는지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">use \u003c/span>\u003cspan class=\"tgt\">them\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러므로 우리는 그것들을 언제 그리고 어떻게 사용할지 주의해야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞의 내용을 정리하며 독자에게 \u003cb class=\"key\">행동 \u003c/b>\u003cb class=\"key\">지침\u003c/b>을 주는 결론 문장이에요. 손동작의 의미가 문화마다 다르니 \u003cb class=\"key\">오해\u003c/b>를 피하려면 조심하라는 뜻이죠. Therefore가 앞 문장과의 \u003cb class=\"key\">인과 \u003c/b>\u003cb class=\"key\">관계\u003c/b>를 분명히 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 should(조언·당위)\u003c/span> : [주어] + should + [동사원형] : ~해야 한다 : \"주의해야 한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">간접의문문(의문사 + 주어 + 동사)\u003c/span> : 전치사 about + [when and how] + [주어] + [동사] : ~를 언제 어떻게 …하는지 : \"우리가 그것들을 언제 그리고 어떻게 사용할지\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"Therefore, 그러므로. we should be careful, 우리는 주의해야 한다. about when and how, 언제 그리고 어떻게 (~하는지)에 대해서. we use them, 우리가 그것들을 사용하는지. 이 문장 전체를 해석하면, 그러므로 우리는 그것들을 언제 그리고 어떻게 사용할지 주의해야 한다.","hl":"m"},{"n":29,"text":"이 문장은 앞의 내용을 정리하면서 독자에게 행동 지침을 주는 결론 문장이에요. 손동작의 의미가 문화마다 다르니 오해를 피하려면 조심하라는 거죠. Therefore가 앞 문장과의 인과 관계를 분명히 보여 줍니다.","hl":"mn"},{"n":30,"text":"첫 번째 포인트는 조동사 should예요. should는 조언이나 당위를 나타내서 주의해야 한다는 충고의 느낌을 줍니다. 두 번째 포인트는 간접의문문이에요. 의문사가 절 안에서 주어 역할을 하면 의문사 다음에 주어와 동사가 오는 평서문 어순을 써요. 여기서는 when과 how 두 의문사가 and로 병렬 연결되어 있다는 점도 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">엄지척은\u003c/span>\u003cspan class=\"en\">The thumbs up\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">좋은 예이다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">good \u003c/span>\u003cspan class=\"tgt\">example\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">엄지척이 좋은 예이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 말한 여러 손짓 가운데 엄지척을 대표 사례로 끌어오는 \u003cb class=\"key\">도입\u003c/b> 역할을 하는 문장이에요. The thumbs up은 손가락을 위로 든 모양 자체를 가리키는 \u003cb class=\"key\">명사구\u003c/b>이고, a good example은 그 주어의 상태를 설명하는 \u003cb class=\"key\">주격보어\u003c/b>예요. 그래서 뒤에서 엄지척의 문화별 차이를 풀어 놓을 준비를 하는 문장이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">2형식 문장(주격보어)\u003c/span> : [주어 The thumbs up] + [동사 is] + [주격보어 a good example] : \"좋은 예이다\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"The thumbs up, 엄지척은. is, 이다. a good example, 좋은 예이다.. 이 문장 전체를 해석하면, 엄지척이 좋은 예이다.","hl":"m"},{"n":32,"text":"이 문장은 앞에서 말한 손짓들 가운데 엄지척을 대표 사례로 끌어오는 도입 역할을 해요. The thumbs up은 손가락을 위로 든 모양을 가리키는 명사구이고, a good example은 좋은 예라는 뜻이에요. 그래서 뒤에서 엄지척의 문화 차이를 설명할 준비를 하는 문장이죠.","hl":"mn"},{"n":33,"text":"첫 번째로, is는 be동사로 주어인 The thumbs up의 상태를 설명하는 동사예요. 두 번째로, a good example은 be동사 뒤에서 주어를 다시 설명해 주는 주격보어 자리입니다. 그래서 이 문장은 주어와 보어를 be동사로 이어 주는 2형식 문장이 되는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 제스처는\u003c/span>\u003cspan class=\"en\">This gesture\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이다\u003c/span>\u003cspan class=\"en\">is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매우 인기 있고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">very \u003c/span>\u003cspan class=\"tgt\">popular \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 잘 알려져 있다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">well \u003c/span>\u003cspan class=\"tgt\">known\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 제스처는 매우 인기 있고 잘 알려져 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 나온 엄지척이 얼마나 널리 퍼진 손짓인지 \u003cb class=\"key\">배경\u003c/b>을 깔아 주는 문장이에요. very popular and well known에서 두 형용사가 and로 나란히 이어지는 \u003cb class=\"key\">병렬구조\u003c/b>이고, well known은 '잘 알려져 있는'이라는 \u003cb class=\"key\">수동\u003c/b>의 느낌을 담은 형용사예요. 뒤에 이어질 '그런데 어떤 나라에서는 다르다'는 내용과 대비를 만들기 위한 준비이기도 하죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">형용사 보어의 병렬구조\u003c/span> : [very popular] and [well known] → 두 형용사를 and로 병렬 : \"매우 인기 있고 잘 알려져 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사가 형용사로 굳어진 표현\u003c/span> : [well + known(과거분사)] = '잘 알려져 있는' : \"잘 알려져 있다\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"This gesture, 이 제스처는. is, 이다. very popular, 매우 인기 있고. and well known, 그리고 잘 알려져 있다.. 이 문장 전체를 해석하면, 이 제스처는 매우 인기 있고 잘 알려져 있다.","hl":"m"},{"n":35,"text":"앞에서 나온 엄지척이 얼마나 널리 퍼진 손짓인지 배경을 깔아 주는 문장이에요. very popular and well known에서 두 형용사가 and로 나란히 이어지는 병렬구조이고, well known은 잘 알려져 있는이라는 수동의 느낌을 담은 형용사예요. 뒤에 이어질 어떤 나라에서는 다르다는 내용과 대비를 만들기 위한 준비이기도 하죠.","hl":"mn"},{"n":36,"text":"첫 번째로, very popular and well known은 be동사 뒤에서 주어의 성질을 설명하는 형용사 두 개를 and로 묶은 병렬구조예요. and 앞뒤에는 반드시 같은 성격의 형용사가 와야 자연스럽습니다. 두 번째로, well known은 know의 과거분사 known이 수동의 의미를 담은 형용사처럼 쓰인 표현이에요. 부사 well이 앞에서 정도를 더해 줘서 잘 알려져 있는이라는 상태를 만들어 주는 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들은\u003c/span>\u003cspan class=\"en\">People\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">흔히 그것을 사용한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">often \u003c/span>\u003cspan class=\"tgt\">use \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전 세계에 걸쳐.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">all \u003c/span>\u003cspan class=\"tgt\">over \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">world\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">전세계 사람들이 흔히 그것을 사용한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 엄지척이 전 세계에서 두루 쓰인다는 점을 말하며, 바로 뒤의 '그런데 태국이나 호주에서는 뜻이 다르다'로 넘어가기 위한 \u003cb class=\"key\">근거\u003c/b>를 대는 문장이에요. 빈도부사 often이 일반동사 use 앞에 놓여 '흔히'라는 \u003cb class=\"key\">빈도\u003c/b>를 나타내고, all over the world는 사용 범위를 넓혀 주는 \u003cb class=\"key\">부사구\u003c/b>예요. it은 앞 문장의 this gesture, 즉 엄지척을 받는 대명사입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">빈도부사의 위치\u003c/span> : [often(빈도부사)] + [일반동사 use] : \"흔히 그것을 사용한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 용법\u003c/span> : [all over + the world] → 장소·범위를 나타내는 부사구 : \"전 세계에 걸쳐\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"People, 사람들은. often use it, 흔히 그것을 사용한다. all over the world, 전 세계에 걸쳐.. 이 문장 전체를 해석하면, 전세계 사람들이 흔히 그것을 사용한다.","hl":"m"},{"n":38,"text":"엄지척이 전 세계에서 두루 쓰인다는 점을 말하면서, 바로 뒤에 나오는 태국이나 호주에서는 뜻이 다르다는 내용으로 넘어가기 위한 근거를 대는 문장이에요. often이 일반동사 앞에서 흔히라는 빈도를 나타내고, all over the world가 사용 범위를 넓혀 주는 부사구예요. it은 앞 문장의 this gesture, 즉 엄지척을 받는 대명사입니다.","hl":"mn"},{"n":39,"text":"첫 번째로, often은 빈도부사라서 일반동사 use 앞에 놓여 동작이 얼마나 자주 일어나는지를 표시해요. be동사나 조동사가 있으면 그 뒤로 가지만, 여기서는 일반동사라서 앞자리를 차지한 거죠. 두 번째로, all over the world는 전치사 over에 all이 붙어 온통 넘어라는 범위의 의미를 강화한 표현이에요. 이 덩어리 전체가 문장 끝에서 동작이 미치는 장소를 알려 주는 부사구 역할을 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은\u003c/span>\u003cspan class=\"en\">It\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사랑받는 이모지이다,\u003c/span>\u003cspan class=\"en\">is \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">beloved \u003c/span>\u003cspan class=\"tgt\">emoji\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또한(이기도 하다)\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">too\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 사랑받는 이모지이기도 하다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 손동작으로도 소통한다고 했으니, 이제 엄지손가락을 위로 치켜드는 동작을 구체적인 예로 꺼내는 흐름이에요. 그 동작이 대중적일 뿐 아니라 \u003cb class=\"key\">이모지\u003c/b>로도 \u003cb class=\"key\">사랑받는\u003c/b>다는 점을 덧붙여, 이 제스처가 얼마나 친숙한지 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사의 형용사적 용법(형용사화된 분사)\u003c/span> : [beloved (과거분사) + 명사 emoji] : \"사랑받는 이모지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">첨가의 부사 too(~도)\u003c/span> : [문장 끝 + too] : \"~이기도 하다\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"It, 그것은. is a beloved emoji, 사랑받는 이모지이다. too, 또한(이기도 하다). 이 문장 전체를 해석하면, 그것은 사랑받는 이모지이기도 하다.","hl":"m"},{"n":41,"text":"앞에서 우리가 손동작으로도 소통한다고 했죠. 여기서는 엄지손가락을 치켜드는 동작이 얼마나 친숙한지 보여 주려고, 그것이 사랑받는 이모지이기도 하다는 점을 덧붙이고 있어요. 즉 이 제스처가 세계적으로 대중적이라는 흐름을 만들어 주는 문장입니다.","hl":"mn"},{"n":42,"text":"첫 번째로 a beloved emoji를 보세요. beloved는 사랑받는다는 수동의 의미를 담은 과거분사가 emoji를 앞에서 꾸며 주는 형태예요. 두 번째로 문장 끝의 too는 첨가의 부사로, 앞 내용에 같은 정보를 더할 때 씁니다. 그래서 그것은 사랑받는 이모지이기도 하다라고 해석하는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 15\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은\u003c/span>\u003cspan class=\"en\">It\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일반적으로 의미한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">usually\u003c/span> means\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">동의 또는 ‘좋다’를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">agreement \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">&quot;okay&quot;\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 국가에서\u003c/span>\u003cspan class=\"en\">in many countries\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한국, 일본과 같은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">Korea \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">Japan\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">일반적으로 그것은 한국, 일본과 같은 많은 국가에서 동의 또는 ‘좋다’를 의미한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 엄지손가락을 치켜드는 동작이 실제로 어떤 뜻으로 통하는지 알려 주는 문장이에요. 한국과 일본을 포함한 \u003cb class=\"key\">많은 \u003c/b>\u003cb class=\"key\">국가\u003c/b>에서 \u003cb class=\"key\">동의\u003c/b>나 '좋다'를 뜻한다고 말합니다. 뒤에 이어질 태국·호주에서의 다른 의미와 \u003cb class=\"key\">대조\u003c/b>시키기 위한 준비 문장 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">빈도부사의 위치\u003c/span> : [일반동사 앞 + usually] : \"일반적으로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">or에 의한 병렬 구조\u003c/span> : [명사 A + or + 명사 B] : \"동의 또는 ‘좋다’\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 like(~와 같은)\u003c/span> : [like + 명사] : \"한국, 일본과 같은\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"It, 그것은. usually means, 일반적으로 의미한다. agreement or \"okay\", 동의 또는 ‘좋다’를. in many countries, 많은 국가에서. like Korea and Japan, 한국, 일본과 같은. 이 문장 전체를 해석하면, 일반적으로 그것은 한국, 일본과 같은 많은 국가에서 동의 또는 ‘좋다’를 의미한다.","hl":"m"},{"n":44,"text":"이 문장은 엄지손가락 제스처가 실제로 어떤 뜻으로 통하는지 알려 줘요. 한국과 일본을 포함한 많은 국가에서 동의나 좋다는 뜻으로 쓰인다고 설명하죠. 바로 뒤에 나올 태국이나 호주에서의 다른 의미와 대조시키려는 준비 문장입니다.","hl":"mn"},{"n":45,"text":"먼저 usually는 빈도부사라서 일반동사 means 앞에 자리 잡고 있어요. 두 번째로 agreement or okay는 동의 또는 좋다라는 두 표현을 or로 병렬로 묶은 목적어입니다. 마지막으로 like Korea and Japan에서 like는 좋아한다는 동사가 아니라, 한국과 일본 같은이라는 뜻의 전치사로 many countries를 예로 들어 주고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나,\u003c/span>\u003cspan class=\"en\">However,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 ~일 수 있다\u003c/span>\u003cspan class=\"en\">it \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">may \u003c/span>\u003cspan class=\"tgt\">be\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모욕(이다)\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">insult\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">태국에서는\u003c/span>\u003cspan class=\"en\">in Thailand.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 태국에서는 모욕일 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 엄지손가락은 대부분 동의나 '좋다'를 뜻한다고 했죠. 그런데 However로 방향을 틀어 태국에서는 오히려 \u003cb class=\"key\">모욕\u003c/b>이 될 수 있다고 말해요. 같은 손동작도 \u003cb class=\"key\">문화\u003c/b>에 따라 전혀 다르게 받아들여진다는 이 글의 핵심을 보여 주는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 may + 동사원형(추측)\u003c/span> : [may + be동사원형] : \"~일 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">2형식 문장의 주격보어\u003c/span> : [주어 it + be동사 + 주격보어 an insult] : \"모욕\"\u003c/div>\u003c/div>","segs":[{"n":46,"text":"However, 그러나. it may be, 그것은 ~일 수 있다. an insult, 모욕(이다). in Thailand, 태국에서는. 이 문장 전체를 해석하면, 그러나 태국에서는 모욕일 수 있다.","hl":"m"},{"n":47,"text":"앞에서는 엄지손가락이 대부분 동의나 좋다는 뜻이라고 했죠. 그런데 However로 방향을 확 틀어서 태국에서는 오히려 모욕이 될 수 있다고 말해요. 같은 손동작도 문화에 따라 전혀 다르게 받아들여진다는 핵심을 보여 주는 문장입니다.","hl":"mn"},{"n":48,"text":"첫 번째로 may be를 보세요. may는 추측의 조동사라서 뒤에 동사원형 be가 오고, 그래서 모욕일 수 있다처럼 단정하지 않고 가능성만 말하는 표현이 됩니다. 두 번째로 an insult는 be동사 뒤에서 주어 it이 무엇인지 설명하는 주격보어 자리예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그것은 의미할 수 있다\u003c/span>\u003cspan class=\"en\">And it \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">may \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">mean \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘아니요’를 또는 무례함을 보이는 것\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">&quot;no&quot; \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">show \u003c/span>\u003cspan class=\"tgt\">rudeness\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">호주에서\u003c/span>\u003cspan class=\"en\">in Australia.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그리고 그것은 호주에서 ‘아니요’를 의미하거나 무례함을 보이는 것일 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 태국 사례에 이어 호주 사례를 추가하며, 엄지척이 나라마다 다른 의미를 가질 수 있음을 보여 준다. may를 써서 단정하지 않고 \u003cb class=\"key\">가능성\u003c/b>으로만 표현했고, 앞 문장과 함께 ‘문화마다 의미가 다르다’는 \u003cb class=\"key\">근거\u003c/b>를 하나 더 쌓는 역할을 한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 may (추측)\u003c/span> : may + [동사원형] = ~일 수 있다 : \"의미할 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">or로 연결된 동사원형 병렬\u003c/span> : may [mean ~] or [show ~] = ~을 의미하거나 보이다 : \"‘아니요’를 의미하거나 무례함을 보이다\"\u003c/div>\u003c/div>","segs":[{"n":49,"text":"And it may mean, 그리고 그것은 의미할 수 있다. \"no\" or show rudeness, ‘아니요’를 또는 무례함을 보이는 것. in Australia, 호주에서. 이 문장 전체를 해석하면, 그리고 그것은 호주에서 ‘아니요’를 의미하거나 무례함을 보이는 것일 수 있다.","hl":"m"},{"n":50,"text":"이 문장은 태국 이야기에 이어 호주라는 또 다른 예를 드는 문장이에요. 엄지척이 호주에서는 ‘아니요’를 뜻하거나 무례함을 보일 수 있다고 하면서, 문화마다 의미가 다르다는 근거를 하나 더 쌓아 주죠. may를 쓴 이유는 단정하지 않고 가능성만 열어 두고 싶어서라는 점도 기억해 두세요.","hl":"mn"},{"n":51,"text":"첫 번째 포인트는 조동사 may예요. may는 추측을 나타내서 뒤에 동사원형 mean이 오고, ‘의미할 수 있다’처럼 가능성을 부드럽게 말해 줍니다. 두 번째 포인트는 병렬이에요. may 뒤에 동사원형이 두 개 필요해서 mean과 show가 or로 나란히 연결되고, 이렇게 같은 형태를 대칭으로 맞춰 주는 거죠. or는 ‘또는’이라는 뜻으로 두 선택지를 이어 준다고 보시면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 15\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">엄지척과 같은 제스처는\u003c/span>\u003cspan class=\"en\">Gestures \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">such \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">thumbs \u003c/span>\u003cspan class=\"tgt\">up\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 의미를 지닌다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">different \u003c/span>\u003cspan class=\"tgt\">meanings\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 문화나 국가에서\u003c/span>\u003cspan class=\"en\">in many cultures or countries.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">엄지척과 같은 제스처는 많은 문화나 국가에서 다른 의미를 지닌다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 본 태국과 호주의 예를 하나로 묶어 ‘엄지척 같은 제스처는 문화나 국가마다 의미가 다르다’고 \u003cb class=\"key\">일반화\u003c/b>한 문장이다. 그래서 다음 문장의 주의 당부로 자연스럽게 넘어가는 \u003cb class=\"key\">교량\u003c/b> 역할을 한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">such as (예시 제시)\u003c/span> : [명사] + such as + [예시] = ~와 같은 : \"엄지척과 같은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주어-동사 수 일치\u003c/span> : [복수 주어 Gestures] + [복수 동사 have] : \"다른 의미를 지닌다\"\u003c/div>\u003c/div>","segs":[{"n":52,"text":"Gestures such as a thumbs up, 엄지척과 같은 제스처는. have different meanings, 다른 의미를 지닌다. in many cultures or countries, 많은 문화나 국가에서. 이 문장 전체를 해석하면, 엄지척과 같은 제스처는 많은 문화나 국가에서 다른 의미를 지닌다.","hl":"m"},{"n":53,"text":"이 문장은 앞에서 본 태국과 호주의 예를 하나로 묶어 주는 문장이에요. 엄지척 같은 제스처가 문화나 국가마다 다른 의미를 가진다고 일반화하고 있죠. 그래서 다음 문장에서 조심하라는 당부가 자연스럽게 이어지는 교량 역할을 합니다.","hl":"mn"},{"n":54,"text":"먼저 such as를 보세요. 앞에 나온 복수 명사 Gestures의 구체적인 예로 a thumbs up을 들어 주는 표현이라 ‘엄지척과 같은’이라고 해석해요. 예시는 하나만 들어도 충분하다는 것도 기억해 두시고요. 그다음은 수 일치예요. 주어 Gestures가 복수라서 동사도 have가 되고, meanings도 복수 형태로 여러 의미를 나타냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 15 / 15\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러니, 오해를 피하기 위해서는\u003c/span>\u003cspan class=\"en\">So, \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">avoid \u003c/span>\u003cspan class=\"tgt\">misunderstandings\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">주의해라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">careful\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들을 어떻게 사용할지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">use \u003c/span>\u003cspan class=\"tgt\">them\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러니 오해를 피하기 위해서는 그것들을 어떻게 사용할지 주의해라!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글 전체를 맺는 \u003cb class=\"key\">결론\u003c/b> 문장으로, 오해를 피하려면 제스처를 어떻게 쓰는지 조심하라는 \u003cb class=\"key\">당부\u003c/b>를 전한다. 앞의 ‘문화마다 의미가 다르다’는 내용이 이 명령의 이유가 되는 흐름이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : [to + 동사원형] = ~하기 위해 : \"오해를 피하기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명령문 (동사원형)\u003c/span> : [동사원형 Be] + [형용사 careful] : \"주의해라\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">간접의문문 (의문사 + 주어 + 동사)\u003c/span> : how + [주어 you] + [동사 use] + [목적어 them] : \"그것들을 어떻게 사용하는지\"\u003c/div>\u003c/div>","segs":[{"n":55,"text":"So, to avoid misunderstandings, 그러니, 오해를 피하기 위해서는. be careful, 주의해라. how you use them!, 그것들을 어떻게 사용할지. 이 문장 전체를 해석하면, 그러니 오해를 피하기 위해서는 그것들을 어떻게 사용할지 주의해라!","hl":"m"},{"n":56,"text":"이 문장은 글 전체를 마무리하는 결론이에요. 오해를 피하고 싶다면 제스처를 어떻게 쓰는지 조심하라고 당부하고 있죠. 앞에서 문화마다 의미가 다르다고 했으니, 그만큼 사용에 주의하라는 흐름입니다.","hl":"mn"},{"n":57,"text":"먼저 to avoid misunderstandings는 목적을 나타내는 to부정사예요. ‘오해를 피하기 위해’라고 왜 조심해야 하는지를 앞에서 먼저 알려 주죠. 두 번째로 be careful은 주어 없이 동사원형으로 시작하는 명령문이라서 ‘주의해라’라는 당부가 됩니다. 마지막으로 how you use them은 간접의문문인데, 의문사 how 뒤에 주어 you가 먼저 오고 동사 use가 따라오는 어순이라는 점, 꼭 챙겨 두세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>우리는 언어뿐 아니라 \u003cb class=\"key\">손동작\u003c/b>으로도 다른 사람들과 소통한다.\u003c/li>\u003cli>그러나 모든 손동작이 모든 \u003cb class=\"key\">문화\u003c/b>에서 동일한 의미를 갖는 것은 아니다.\u003c/li>\u003cli>엄지척은 한국과 일본에서는 동의나 좋다는 뜻이지만, 태국에서는 \u003cb class=\"key\">모욕\u003c/b>, 호주에서는 무례함이 될 수 있다.\u003c/li>\u003cli>따라서 \u003cb class=\"key\">오해\u003c/b>를 피하려면 손동작을 언제 어떻게 사용할지 주의해야 한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Hand gestures such as the thumbs up have different meanings in different cultures, so we should be careful when and how we use them.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">손동작은 일상생활과 해외여행에서 유용한 \u003cb class=\"key\">의사소통\u003c/b> 수단이지만, 모든 문화에서 같은 의미를 갖지는 않는다. 엄지척처럼 익숙한 제스처도 나라에 따라 \u003cb class=\"key\">모욕\u003c/b>이나 무례함이 될 수 있으므로, \u003cb class=\"key\">오해\u003c/b>를 피하려면 사용법에 주의해야 한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":58,"text":"오늘 글은 손동작 하나가 문화마다 얼마나 다르게 통하는지를 보여 줬어요. 핵심은 언어뿐 아니라 손동작도 문화의 약속이라는 점, 그래서 엄지척 같은 익숙한 제스처도 상대가 어디서 왔는지에 따라 조심해서 써야 한다는 점입니다. 시험에서는 However 뒤의 반박과 마지막 문장의 당부를 주제로 잡으면 틀리지 않아요. 오늘도 수고했어요, 다음 시간에 또 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
