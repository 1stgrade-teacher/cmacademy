 위한 실천적 전략</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">우리가 흔히 느끼는 시간에 쫓기는 감각을 &#39;시간 기근(Time famine)&#39;이라고 하는데, 이는 마치 한정된 예산으로 많은 물건을 사야 하는 경제적 상황처럼 시간이라는 자원이 부족해 심리적 압박을 받는 상태를 의미해요. 이 개념은 현대 사회의 바쁜 일상을 연구하는 심리학과 경영학 분야에서 자주 다뤄지는데, 특히 시간 기근(Time famine)이 지속되면 단순히 마음만 급한 것을 넘어 인지 능력이 저하되거나 번아웃(Burnout)에 빠질 위험이 커진다는 연구 결과가 많답니다. 이러한 상태를 해결하기 위해 전문가들은 &#39;우선순위 설정(Prioritizing)&#39;과 &#39;시간 관리(Time management)&#39; 기술을 강조하는데, 이는 단순히 일을 빨리 처리하는 것이 아니라 나의 에너지를 가장 중요한 곳에 집중적으로 투입하는 전략을 뜻해요. 마치 복잡한 가방에서 당장 필요한 물건을 쉽게 꺼내기 위해 짐을 정리하는 것처럼, 우리도 할 일 목록(To-do list)을 작성하거나 외부의 도움을 활용함으로써 심리적 여유를 되찾는 과정이 무엇보다 중요하다고 할 수 있습니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01시간 기근의 정의</div><ul><li>시간 기근이란 해야 할 일은 많은데 시간이 부족하여 느끼는 부정적인 감정을 의미한다.</li><li>핵심 개념: 시간 기근 (time famine)</li><li>나타나는 증상: 불안함(nervous)과 짜증(annoyed)</li><li>핵심 키워드: 시간 기근(time famine)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02학업적 스트레스와의 연관성</div><ul><li>시간 기근은 학생들에게 낮은 성적보다 더 큰 스트레스를 유발할 수 있다.</li><li>시험 공부(studying for exams) 상황에서 주로 발생</li><li>낮은 성적(low score)보다 높은 스트레스 유발</li><li>핵심 키워드: 스트레스(stress)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03시간 절약을 위한 목록 작성</div><ul><li>해야 할 일 목록을 작성하는 것은 우선순위를 정하고 집중하는 데 도움을 준다.</li><li>우선순위에 따른 집중(focus) 필요</li><li>긴급한 일(urgent things) 선별 가능</li><li>핵심 키워드: 할 일 목록(to-do list)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04외부 서비스 활용</div><ul><li>시간을 절약하기 위해 외부 서비스를 활용하는 것이 효과적이다.</li><li>시간 절약 서비스(time-saving services)의 적극적 활용</li><li>외식이나 요리 대신 배달 음식(food delivery service) 이용</li><li>핵심 키워드: 시간 절약(saving time)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">time famine</td><td class=\"m\">시간 기근, 시간 부족 현상</td></tr><tr><td class=\"w\">nervous</td><td class=\"m\">불안한, 초조한</td></tr><tr><td class=\"w\">annoyed</td><td class=\"m\">짜증이 난, 성가신</td></tr><tr><td class=\"w\">experience</td><td class=\"m\">경험하다, 겪다</td></tr><tr><td class=\"w\">stressed</td><td class=\"m\">스트레스를 받는, 긴장한</td></tr><tr><td class=\"w\">overcome</td><td class=\"m\">극복하다, 이겨내다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">relaxed</td><td class=\"m\">느긋한, 편안한</td></tr><tr><td class=\"w\">to-do list</td><td class=\"m\">할 일 목록</td></tr><tr><td class=\"w\">focus on</td><td class=\"m\">~에 집중하다</td></tr><tr><td class=\"w\">urgent</td><td class=\"m\">긴급한, 다급한</td></tr><tr><td class=\"w\">for instance</td><td class=\"m\">예를 들어</td></tr><tr><td class=\"w\">eating out</td><td class=\"m\">외식하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신은 자주 느끼는가</span><span class=\"en\"><b>Do you often feel</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">시간이 충분하지 않다는 것을?</span><span class=\"en\"><b><span class=\"grammar-hl\">that there is not enough time</span>?</b></span></div></div><div class=\"lec-sent-ko\">시간이 충분하지 않다고 자주 느끼는가?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 도입부로서, 현대인이 공통적으로 겪는 &#39;시간 부족&#39;이라는 현상에 대해 독자에게 질문을 던지며 주의를 환기합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that there is not enough time (명사절(that절)): feel의 목적어 역할을 하는 절입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 느낌이다</span><span class=\"en\"><b>It is the feeling</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">해야 할 일이 너무 많다는</span><span class=\"en\"><b>of <span class=\"grammar-hl\">having too much to do</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신이 충분한 시간을 가지고 있지 않을 때</span><span class=\"en\"><b>when you do not have enough time.</b></span></div></div><div class=\"lec-sent-ko\">그것은 시간이 충분하지 않을 때 할 일이 너무 많다고 느끼는 감정이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 질문에 대한 답변으로, 우리가 느끼는 시간 부족의 실체가 어떤 상황인지를 구체적으로 정의합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">having too much to do (동명사): 전치사 of의 목적어 역할을 합니다. to do는 앞에 있는 명사 much를 수식하는 to부정사의 형용사적 용법입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 시간 기근이다.</span><span class=\"en\"><b><span class=\"grammar-hl\">It is time famine.</span></b></span></div></div><div class=\"lec-sent-ko\">그것이 바로 ‘시간 기근’이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 설명한 증상을 &#39;시간 기근&#39;이라는 명칭으로 규정하며, 이후 이어질 논의의 핵심 주제를 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It is time famine. 2형식 구조: 주어(It) + 동사(is) + 보어(time famine)의 기본 문장 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">time famine</td><td class=\"m\">시간 기근, 시간 부족 현상</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 ~하게 한다</span><span class=\"en\"><b>It <span class=\"grammar-hl\">makes you feel</span> nervous.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분을</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">긴장하게</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">그것은 여러분을 긴장하게 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 시간 기근이 인간의 심리에 미치는 부정적인 영향을 언급하며, 왜 우리가 이 문제를 해결해야 하는지에 대한 당위성을 부여합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">makes you feel 5형식 구조: make(사역동사) + 목적어(you) + 목적보어(feel/동사원형)의 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">nervous</td><td class=\"m\">불안한, 초조한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 당신을 짜증 나게 한다,</span><span class=\"en\"><b>It <span class=\"grammar-hl\">makes you annoyed</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또한</span><span class=\"en\"><b>too.</b></span></div></div><div class=\"lec-sent-ko\">짜증 나게도 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에 이어 시간 기근으로 인해 발생하는 또 다른 정서적 문제점을 추가하며 강조하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">makes you annoyed 5형식 구조: make(사역동사) + 목적어(you) + 목적보어(annoyed/과거분사)의 구조입니다. 목적어인 you가 느끼는 상태를 설명하는 보어입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">annoyed</td><td class=\"m\">짜증이 난, 성가신</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신은 이것을 경험할지도 모른다</span><span class=\"en\"><b>You may experience this</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신이 시험공부를 할 때</span><span class=\"en\"><b><span class=\"grammar-hl\">when you study for exams</span>.</b></span></div></div><div class=\"lec-sent-ko\">시험공부를 할 때 이런 경험을 할 수도 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 추상적이었던 시간 기근의 개념을 독자가 일상에서 흔히 겪는 구체적인 사례인 &#39;시험 준비&#39;에 대입하여 이해를 돕습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">when you study for exams (관계부사(접속사)): 때를 나타내는 부사절로, 문장 전체를 수식합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">experience</td><td class=\"m\">경험하다, 겪다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">한 연구는 보여준다</span><span class=\"en\"><b>One study <span class=\"grammar-hl\">shows</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">시간 기근이</span><span class=\"en\"><b><span class=\"grammar-hl\">that time famine</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">학생들을 더 스트레스받게 만들 수 있다는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">can make students feel</span> more stressed</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 낮은 점수를 받을 때보다</span><span class=\"en\"><b>than when they get a low score.</b></span></div></div><div class=\"lec-sent-ko\">한 연구에 따르면 시간 기근으로 인해 학생들은 낮은 점수를 받았을 때보다 더 많은 스트레스를 받을 수 있다고 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 시간 기근이 단순한 불편함을 넘어 낮은 성적이라는 실제적인 결과보다 더 심각한 정서적 타격을 줄 수 있다는 연구 결과를 통해 문제의 심각성을 부각합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">shows that time famine can make students feel (명사절(that절)): shows의 목적어 역할을 하는 절입니다. 내부의 make students feel은 5형식 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">time famine</td><td class=\"m\">시간 기근, 시간 부족 현상</td></tr><tr><td class=\"w\">stressed</td><td class=\"m\">스트레스를 받는, 긴장한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만 걱정하지 마라.</span><span class=\"en\"><b>But <span class=\"grammar-hl\">do not worry</span>.</b></span></div></div><div class=\"lec-sent-ko\">하지만 걱정하지 마라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 제기된 부정적인 상황을 전환하는 신호탄으로, 문제 해결의 가능성을 시사하며 독자를 안심시킵니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">do not worry (관용표현): 명령문 부정 구조로, &#39;걱정하지 마라&#39;는 의미를 가집니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">방법이 있다</span><span class=\"en\"><b>There is a way</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이것을 극복할</span><span class=\"en\"><b><span class=\"grammar-hl\">to overcome this</span>.</b></span></div></div><div class=\"lec-sent-ko\">이를 극복하는 방법이 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 구체적인 해결책을 제시하기 위한 준비 단계로, 시간 기근을 해결할 수 있다는 확신을 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to overcome this (to부정사): 앞의 명사 a way를 수식하는 형용사적 용법입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">overcome</td><td class=\"m\">극복하다, 이겨내다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신은 더 편안함을 느낄 수 있다</span><span class=\"en\"><b>You can feel more relaxed</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">시간을 절약함으로써</span><span class=\"en\"><b><span class=\"grammar-hl\">by saving time</span>.</b></span></div></div><div class=\"lec-sent-ko\">시간을 절약함으로써 더 편안해질 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 해결책의 핵심 원리를 설명합니다. 시간 기근의 원인이 시간 부족이므로, 시간을 확보하는 것이 근본적인 해결책임을 밝히는 대목입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">by saving time (동명사): 전치사 by의 목적어 역할을 하며, 방법(~함으로써)을 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">relaxed</td><td class=\"m\">느긋한, 편안한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 11 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">시간을 절약하기 위해,</span><span class=\"en\"><b><span class=\"grammar-hl\">To save time</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">할 일 목록을 만들라.</span><span class=\"en\"><b>make a to-do list.</b></span></div></div><div class=\"lec-sent-ko\">시간을 절약하려면 할 일 목록을 만들라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 구체적인 실천 방안의 첫 번째로, 우선순위를 정하는 방법을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">To save time (to부정사): 목적(~하기 위하여)을 나타내는 부사적 용법입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">to-do list</td><td class=\"m\">할 일 목록</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 12 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 당신을 돕는다</span><span class=\"en\"><b>It <span class=\"grammar-hl\">helps you</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 긴급한 일들에 집중하도록</span><span class=\"en\"><b><span class=\"grammar-hl\">to focus</span> on the more urgent things.</b></span></div></div><div class=\"lec-sent-ko\">더 긴급한 일에 집중할 수 있도록 도와준다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 제시한 할 일 목록 작성이 왜 시간을 절약해 주는지를 논리적으로 뒷받침합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">helps you to focus 5형식 구조: help + 목적어(you) + 목적보어(to focus/to부정사)의 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">focus on</td><td class=\"m\">~에 집중하다</td></tr><tr><td class=\"w\">urgent</td><td class=\"m\">긴급한, 다급한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 13 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">또한,</span><span class=\"en\"><b>Also,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">시간 절약 서비스를 이용하라.</span><span class=\"en\"><b>use <span class=\"grammar-hl\">time-saving services</span>.</b></span></div></div><div class=\"lec-sent-ko\">또한 시간 절약 서비스를 이용하라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 개인적인 노력인 할 일 목록 외에 외부의 도움을 활용하는 두 번째 해결책을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">time-saving services (현재분사): saving이 명사 services를 수식합니다. &#39;시간을 절약해 주는 서비스&#39;라는 동작/상태의 의미를 가집니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 14 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">예를 들어,</span><span class=\"en\"><b>For instance,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신은 음식 배달 서비스를 이용할 수 있다</span><span class=\"en\"><b>you can use a food delivery service</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">외식하거나 식사를 요리하는 것 대신에</span><span class=\"en\"><b>instead of <span class=\"grammar-hl\">eating out or cooking meals</span>.</b></span></div></div><div class=\"lec-sent-ko\">예를 들어, 외식이나 요리 대신 음식 배달 서비스를 이용할 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 &#39;시간 절약 서비스&#39;라는 추상적인 제안을 독자가 즉각 실행할 수 있는 가장 일상적인 사례로 풀어 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">eating out or cooking meals (동명사): 전치사 instead of의 목적어 역할을 하며, 나열된 두 개의 동작을 의미합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">for instance</td><td class=\"m\">예를 들어</td></tr><tr><td class=\"w\">eating out</td><td class=\"m\">외식하다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>현대인은 시간이 부족하여 &#39;시간 기근&#39;이라는 심리적 압박을 겪는다.</li><li>시간 기근은 낮은 성적보다 더 큰 스트레스를 유발할 수 있다.</li><li>하지만 할 일 목록 작성과 시간 절약 서비스를 활용하면 충분히 극복할 수 있다.</li><li>효율적인 시간 관리는 정서적 여유와 안정적인 일상을 만드는 핵심이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Time famine leads to increased anxiety and stress, so individuals should manage their schedules by creating to-do lists and using convenient services.</div>\n              <div class=\"lec-final-sum-ko\">시간 부족은 불안과 스트레스를 증가시키므로, 개인은 할 일 목록을 만들고 편리한 서비스를 이용함으로써 자신의 일정을 관리해야 한다.</div></div></div>"],"segs":[[{"audio":"./reading12_audio/1.mp3","hl":null}],[{"audio":"./reading12_audio/2.mp3","hl":null}],[{"audio":"./reading12_audio/3.mp3","hl":null},{"audio":
