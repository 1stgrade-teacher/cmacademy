A6nJABG7NO+id1ZNta7ba7O3rr6d1K1mt9Nnp6+tv63P//Z\" alt=\"\"></div>","<div class=\"lec-cover-title\">Learning Through Teaching: The Mutual Benefits of Peer Tutoring<small>가르침을 통한 배움: 또래 지도의 상호 이점</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">본격적인 내용에 들어가기 전, ‘가르침을 통해 더 깊이 배운다’는 개념인 학습 효과(Learning Effect)에 대해 알면 글을 이해하기 훨씬 수월해요. 특히 이 지문에서 다루는 또래 교수법(Peer Teaching)은 동료 학생이 교사가 되어 학습을 돕는 방식을 말하는데, 단순히 지식을 전달하는 것을 넘어 가르치는 사람 스스로가 내용을 구조화하고 복습하게 되어 지식의 습득률이 비약적으로 상승하는 효과가 있죠. 마치 우리가 친구에게 복잡한 게임 규칙을 설명해주다 보면 어느새 스스로 그 게임의 고수가 되어 있는 것과 비슷한 원리랍니다. 이를 심리학에서는 프로테제 효과(Protégé Effect)라고 부르기도 하는데, 누군가를 가르치겠다는 책임감을 가질 때 학습 동기와 성취도가 높아지는 현상을 의미해요. 즉, 누군가를 가르치는 행위는 남을 돕는 일을 넘어 자신의 실력을 가장 확실하게 다지는 최고의 공부법이라는 점을 기억하면서 지문을 읽어보세요!</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01프로젝트 시작</div><ul><li>과학 시간에 동료 간의 가르침을 주고받는 튜터-튜티 프로젝트를 시작했다.</li><li>과학 교사의 추천으로 튜터-튜티(tutor-tutee) 활동 시작</li><li>과학을 잘하는 주인공이 튜터(student teacher)로 자원함</li><li>핵심 키워드: 또래 교수(peer teaching)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02초기 갈등과 회의</div><ul><li>프로젝트를 진행하며 튜티를 돕는 시간이 낭비라고 느꼈다.</li><li>친구를 가르치는 것에 많은 시간이 소요됨</li><li>개인 공부 시간이 줄어드는 것에 대한 불만</li><li>핵심 키워드: 시간 낭비(waste of time)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03인식의 변화</div><ul><li>가르치는 과정을 통해 학습 내용에 대한 이해도가 깊어짐을 깨달았다.</li><li>내용을 더 명확하고 깊게 이해하게 됨</li><li>가르치면서 얻는 학습의 효과를 체감</li><li>핵심 키워드: 이해도(understand)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04성과와 깨달음</div><ul><li>결과적으로 프로젝트를 통해 성적 향상과 학습 원리를 터득했다.</li><li>기말고사에서 더 좋은 성적(better grade)을 거둠</li><li>타인을 가르치는 것이 곧 자신의 학습임을 깨달음</li><li>핵심 키워드: 가르침을 통한 학습(learning by teaching)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">tutor-tutee</td><td class=\"m\">지도교사-학생의, 과외교사-학생의</td></tr><tr><td class=\"w\">peer</td><td class=\"m\">동료, 또래</td></tr><tr><td class=\"w\">volunteer</td><td class=\"m\">자원하다, 자발적으로 지원하다</td></tr><tr><td class=\"w\">waste of time</td><td class=\"m\">시간 낭비</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">find out</td><td class=\"m\">알아내다, 밝혀내다</td></tr><tr><td class=\"w\">material</td><td class=\"m\">자료, 교재, 소재</td></tr><tr><td class=\"w\">thanks to</td><td class=\"m\">~덕분에</td></tr><tr><td class=\"w\">realize</td><td class=\"m\">깨닫다, 실현하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 시작했다</span><span class=\"en\"><b>We <span class=\"grammar-hl\">started</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">새로운 tutor-tutee 프로젝트를</span><span class=\"en\"><b>a new tutor-tutee project</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">과학 수업 시간에</span><span class=\"en\"><b>in science class</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지난달에</span><span class=\"en\"><b>last month.</b></span></div></div><div class=\"lec-sent-ko\">우리는 지난달 과학 수업 시간에 새로운 tutor-tutee 프로젝트를 시작했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 도입부로서, 주인공이 경험한 구체적인 사건의 시점과 성격을 소개하며 앞으로 펼쳐질 이야기의 배경을 설정합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">started (일반동사): 문장의 주어 We의 행위를 나타내는 서술어입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">tutor-tutee</td><td class=\"m\">지도교사-학생의, 과외교사-학생의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 ~였다</span><span class=\"en\"><b><span class=\"grammar-hl\">It was</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">일종의 또래 지도</span><span class=\"en\"><b>a kind of peer teaching.</b></span></div></div><div class=\"lec-sent-ko\">그것은 일종의 또래 지도였다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 프로젝트가 정확히 어떤 방식인지를 보충 설명하여, 독자가 이 활동의 교육적 형태를 쉽게 이해하도록 돕습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It was (be동사): 주어의 상태나 성격을 설명하는 서술어입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">peer</td><td class=\"m\">동료, 또래</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">과학 선생님은 말씀하셨다</span><span class=\"en\"><b>My science teacher said, “</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 프로젝트는 도움이 될 거예요</span><span class=\"en\"><b>“This project <span class=\"grammar-hl\">will be helpful</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">배우는 사람들에게</span><span class=\"en\"><b>for the tutees.</b></span></div></div><div class=\"lec-sent-ko\">과학 선생님은 “이 프로젝트는 배우는 사람들에게 도움이 될 거예요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 교사의 말을 인용함으로써 이 프로젝트가 학생 양쪽 모두에게 긍정적인 영향을 줄 것임을 예고하며, 글의 핵심 주제인 &#39;가르침을 통한 상호 성장&#39;을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">will be helpful to부정사(없음) 및 조동사: 조동사 will 뒤에 동사원형 be를 써서 미래의 상태를 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">또한 좋을 거예요</span><span class=\"en\"><b>It <span class=\"grammar-hl\">will also be good</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가르치는 사람들에게도</span><span class=\"en\"><b>for the tutors!”</b></span></div></div><div class=\"lec-sent-ko\">또한 가르치는 사람들에게도 좋을 거예요!”라고 말씀하셨다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 주인공이 자발적으로 프로젝트에 참여하게 된 내적인 동기를 설명하며, 왜 자신이 이 과목의 튜터가 되었는지 정당성을 부여합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">will also be good (관용표현): &#39;be good for (~에게 좋다)&#39;라는 숙어적 표현이 사용되었습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 좋아했다</span><span class=\"en\"><b>I <span class=\"grammar-hl\">liked</span> science best.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">과학을 제일</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">나는 과학을 제일 좋아했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 주인공이 자발적으로 프로젝트에 참여하게 된 내적인 동기를 설명하며, 왜 자신이 이 과목의 튜터가 되었는지 정당성을 부여합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">liked (일반동사): 주어의 선호도를 나타내는 과거형 동사입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 과학을 잘해서</span><span class=\"en\"><b>I was good at science,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그래서 자원했다</span><span class=\"en\"><b>so I <span class=\"grammar-hl\">volunteered</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">학생 교사로</span><span class=\"en\"><b>as a student teacher.</b></span></div></div><div class=\"lec-sent-ko\">나는 과학을 잘해서 학생 교사로 자원했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 자신의 능력에 대한 자신감을 바탕으로 튜터 역할을 맡게 된 과정을 보여주며, 이후 전개될 &#39;가르치는 주체&#39;로서의 위치를 확립합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">volunteered (관용표현): &#39;volunteer as (~로서 자원하다)&#39;의 구조로 쓰였습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">volunteer</td><td class=\"m\">자원하다, 자발적으로 지원하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 가르쳤다</span><span class=\"en\"><b>I <span class=\"grammar-hl\">taught</span> my friend.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">친구를</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">나는 친구를 가르쳤다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 튜터 활동의 구체적인 대상을 명시하여, 동료 학습이 이루어지는 실질적인 장면을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">taught (일반동사): &#39;teach + 사람&#39;의 구조로, 주어가 친구에게 지식을 전달하는 행위를 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 애는 ~였다</span><span class=\"en\"><b>He <span class=\"grammar-hl\">was poor at</span> science.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">과학을 잘 못하는</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">그 애는 과학을 잘 못했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 주인공(튜터)과 친구(튜티) 사이의 실력 차이를 명확히 함으로써, 지식의 전달이 필요한 상황임을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was poor at (관용표현): &#39;be poor at (~에 서투르다/못하다)&#39;라는 숙어 표현입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">처음에</span><span class=\"en\"><b>At first,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나는 생각했다</span><span class=\"en\"><b>I thought</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">너무 많은 시간을 보내고 있다는 것을</span><span class=\"en\"><b>I was <span class=\"grammar-hl\">spending</span> too much time</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">배우는 사람과</span><span class=\"en\"><b>with the tutee.</b></span></div></div><div class=\"lec-sent-ko\">처음에 나는 배우는 사람과 너무 많은 시간을 보내고 있다고 생각했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 초반의 부정적인 감정을 드러내어, 이후 주인공이 겪게 될 인식의 전환을 더욱 극적으로 만드는 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">spending 현재분사(진행형의 일부): &#39;was spending&#39;의 구조로, 과거의 특정 기간 동안 동작이 진행 중이었음을 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 또한 생각했다</span><span class=\"en\"><b>I also thought</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것이 시간 낭비라는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">it was a waste of time</span>.</b></span></div></div><div class=\"lec-sent-ko\">시간 낭비라는 생각도 들었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 튜터 활동이 자신의 학습에 도움이 되지 않을 것이라는 편견을 드러내며, 학습자가 처음 겪는 갈등 상황을 구체화합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">it was a waste of time (가주어): 진주어: 문맥상 it은 앞서 언급된 &#39;tutee와 시간을 보내는 것&#39;을 가리키는 대명사적 용법입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">waste of time</td><td class=\"m\">시간 낭비</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 11 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러나 나중에</span><span class=\"en\"><b>But later,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나는 알았다</span><span class=\"en\"><b>I <span class=\"grammar-hl\">found out</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">내가 틀렸다는 것을</span><span class=\"en\"><b>I was wrong.</b></span></div></div><div class=\"lec-sent-ko\">그러나 나중에 나는 내가 틀렸다는 것을 알았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> &#39;But&#39;을 통해 앞선 부정적인 인식에서 긍정적인 깨달음으로 넘어가는 글의 전환점을 명확히 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">found out (관용표현): &#39;find out (~을 알아내다)&#39;라는 이어동사(phrasal verb)입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 12 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">가르치는 사람으로서</span><span class=\"en\"><b>As a tutor,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나는 이해하기 시작했다</span><span class=\"en\"><b>I began <span class=\"grammar-hl\">to understand</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자료를</span><span class=\"en\"><b>the material</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 잘 그리고 더 명확하게</span><span class=\"en\"><b>better and more clearly.</b></span></div></div><div class=\"lec-sent-ko\">나는 가르치는 사람으로서 자료를 더 잘 그리고 더 명확하게 이해하기 시작했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 가르치는 과정에서 주인공이 얻게 된 실질적인 지적 성장을 설명하며, 앞서 가졌던 시간 낭비라는 생각이 잘못되었음을 입증합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to understand (to부정사): began의 목적어 역할을 하며, &#39;이해하기 시작했다&#39;라는 동작의 변화를 명사적으로 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">material</td><td class=\"m\">자료, 교재, 소재</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 13 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 또한 받았다</span><span class=\"en\"><b>I also got</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 좋은 점수를</span><span class=\"en\"><b>a better grade</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">기말시험에서</span><span class=\"en\"><b>on the final exam</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">프로젝트 덕분에</span><span class=\"en\"><b><span class=\"grammar-hl\">thanks to</span> the project.</b></span></div></div><div class=\"lec-sent-ko\">또한 프로젝트 덕분에 기말시험에서 더 좋은 점수를 받았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 활동의 효과가 성적 향상이라는 가시적인 결과로 나타났음을 보여주며, 프로젝트의 가치를 뒷받침합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">thanks to (관용표현): &#39;~덕분에&#39;라는 의미를 가진 전치사구 표현입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">thanks to</td><td class=\"m\">~덕분에</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 14 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 깨달았다</span><span class=\"en\"><b>I <span class=\"grammar-hl\">realized</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 많은 것을 배울 수 있다는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> I could learn more</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 사람들을 가르치면서</span><span class=\"en\"><b><span class=\"grammar-hl\">by teaching</span> others.</b></span></div></div><div class=\"lec-sent-ko\">나는 다른 사람들을 가르치면서 더 많은 것을 배울 수 있다는 것을 깨달았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 결론으로서, 단순히 지식을 전달하는 것이 아니라 가르치는 행위 자체가 학습자 본인에게도 깊은 이해를 가져다준다는 교훈을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">realized that (명사절(that절)): realized의 목적어 역할을 하는 절로, 동격의 that이 아니라 타동사 뒤에 오는 명사절입니다.</div><div class=\"lec-gr-item\">by teaching (동명사): &#39;by + 동명사&#39; 구조로, 수단이나 방법을 나타내는 전치사의 목적어 자리입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">realize</td><td class=\"m\">깨닫다, 실현하다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>과학 시간에 친구를 가르치는 튜터 프로젝트에 참여하게 되었다.</li><li>처음에는 시간 낭비라고 생각했지만, 가르치는 과정에서 오히려 내용을 더 깊이 이해하게 되었다.</li><li>결과적으로 성적도 오르고, 타인을 가르치는 것이 곧 자신도 배우는 길임을 깨달았다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The author initially felt that tutoring was a waste of time, but discovered that teaching others improved his own academic mastery.</div>\n              <div class=\"lec-final-sum-ko\">필자는 처음에 튜터링이 시간 낭비라고 생각했으나, 타인을 가르치는 과정에서 자신의 학문적 이해도가 향상됨을 깨달았다.</div></div></div>"],"segs":[[{"audio":"./reading09_audio/1.mp3","hl":null}],[{"audio":"./reading09_audio/2.mp3","hl":null}],[{"audio":"./reading09_audio/3.mp3","hl":null},{"audio":"./reading09_audio/4.mp3","hl":"stage-0"},{"audio":"./reading09_audio/5.mp3","hl":"stage-1"
