로를 청결하게 유지하는 현상을 뜻해요. 마치 우리가 비 오는 날 입는 방수 코팅 점퍼가 빗물을 튕겨내는 것과 비슷한 원리라고 이해하면 훨씬 쉽겠죠? 이처럼 자연을 관찰하는 것만으로도 우리는 놀라운 혁신적 아이디어를 얻을 수 있는데, 앞으로 어떤 자연의 지혜가 우리 일상을 편리하게 바꿔줄지 기대하며 글을 읽어보세요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01자연 관찰의 가치</div><ul><li>자연을 관찰하는 것은 인간의 삶을 더욱 편리하고 안락하게 만드는 발견의 원천이 된다.</li><li>자연은 발견의 원천(source of discovery)임</li><li>삶을 더 쉽고 편안하게 개선함(make life better)</li><li>핵심 키워드: 관찰(Observation)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02혁신 사례 도입</div><ul><li>집을 깨끗하게 유지해 주는 특수 페인트 사례를 통해 자연에서 얻은 기술을 소개한다.</li><li>먼지를 밀어내는 거친 표면(rough surface)의 페인트</li><li>외벽 청소 횟수를 줄여주는 실용적 효과</li><li>핵심 키워드: 특수 페인트(Special paint)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03자연의 모방 대상</div><ul><li>연꽃잎이 진흙탕 속에서도 항상 깨끗함을 유지하는 현상에서 그 원리를 발견한다.</li><li>진흙 연못(muddy ponds)에서 자라는 연꽃</li><li>연꽃잎의 깨끗한 상태 유지 원리에 대한 의문</li><li>핵심 키워드: 연꽃잎(Lotus leaves)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04과학적 원리 규명</div><ul><li>현미경을 통해 연꽃잎 표면의 미세한 구조를 확인하면 청결의 비밀을 알 수 있다.</li><li>표면의 미세한 돌기(tiny bumps) 존재</li><li>작은 못(small nails)처럼 생긴 구조가 표면을 거칠게 만듦</li><li>핵심 키워드: 현미경(Microscope)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05결론 및 제언</div><ul><li>자연의 구조가 먼지를 차단하는 원리를 이해하고, 일상에서 자연을 세심하게 관찰해야 한다.</li><li>거친 표면이 먼지가 달라붙는 것을 방지함</li><li>자연을 가까이에서 관찰하는 태도 권장</li><li>핵심 키워드: 자연 관찰(Observe nature)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">source</td><td class=\"m\">근원, 원천</td></tr><tr><td class=\"w\">make better</td><td class=\"m\">~을 개선하다, ~을 더 좋게 만들다</td></tr><tr><td class=\"w\">push away</td><td class=\"m\">~을 밀어내다, ~을 배척하다</td></tr><tr><td class=\"w\">look at</td><td class=\"m\">~을 보다, ~을 살펴보다</td></tr><tr><td class=\"w\">keep off</td><td class=\"m\">~을 가까이하지 못하게 하다, ~을 막다</td></tr><tr><td class=\"w\">observe</td><td class=\"m\">관찰하다, 지키다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">자연은</span><span class=\"en\"><b>Nature</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">원천이다</span><span class=\"en\"><b><span class=\"grammar-hl\">is</span> a source</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">발견의</span><span class=\"en\"><b>of discovery.</b></span></div></div><div class=\"lec-sent-ko\">자연은 발견의 원천이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞으로 자연을 관찰함으로써 인간의 삶을 발전시키는 사례들을 제시하겠다는 주제를 밝히고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is 2형식 구조: 주어(Nature) + 동사(is) + 보어(a source of discovery) 형태로, 주어의 상태나 정체를 설명합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">source</td><td class=\"m\">근원, 원천</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">자연을 관찰하는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">Observing nature</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인간의 삶을 만들 수 있다</span><span class=\"en\"><b>can <span class=\"grammar-hl\">make human life</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 낫게</span><span class=\"en\"><b><span class=\"grammar-hl\">better</span>.</b></span></div></div><div class=\"lec-sent-ko\">자연을 관찰하면 인간의 삶이 더 나아질 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 &#39;발견&#39;이 구체적으로 인간 삶에 어떤 기여를 하는지에 대한 방향성을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Observing nature (동명사): 문장에서 주어 역할을 하는 동사적 성질을 가진 명사구입니다.</div><div class=\"lec-gr-item\">make human life better 5형식(SVOC) 구조: make(동사) + human life(목적어) + better(목적보어/형용사) 형태로, 목적어의 상태를 보어로 보충 설명합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 의미한다</span><span class=\"en\"><b>It means</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 삶이</span><span class=\"en\"><b><span class=\"grammar-hl\">that our life</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 쉽고 더 편안해질 수 있다는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">can be easier and more comfortable</span>.</b></span></div></div><div class=\"lec-sent-ko\">그것은 우리의 삶이 더 쉽고 편안해질 수 있다는 것을 의미한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 &#39;더 나은 삶&#39;이 구체적으로 어떤 상태를 말하는지 부연 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that our life can be easier and more comfortable (명사절): that절이 mean의 목적어 역할을 하여, 주어가 의미하는 내용을 보충 설명합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">예를 들어,</span><span class=\"en\"><b>For example,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">특수 페인트는</span><span class=\"en\"><b>special paint</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분의 집을 유지할 수 있다</span><span class=\"en\"><b>can <span class=\"grammar-hl\">keep your house</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">깨끗하게</span><span class=\"en\"><b><span class=\"grammar-hl\">clean</span>.</b></span></div></div><div class=\"lec-sent-ko\">예를 들어, 특수 페인트를 사용하면 여러분의 집을 깨끗하게 유지할 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 자연의 원리를 이용한 기술이 인간의 편의를 돕는 구체적인 첫 번째 사례를 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">keep your house clean 5형식(SVOC) 구조: keep(동사) + your house(목적어) + clean(목적보어/형용사) 형태로, 목적어가 어떤 상태를 유지하게 만듦을 의미합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 페인트의 거친 표면은</span><span class=\"en\"><b>The <span class=\"grammar-hl\">rough</span> surface of the paint</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">밀어낸다</span><span class=\"en\"><b>pushes away</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">먼지를</span><span class=\"en\"><b>dust.</b></span></div></div><div class=\"lec-sent-ko\">페인트의 거친 표면이 먼지를 밀어낸다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 문장의 페인트가 어떻게 집을 깨끗하게 유지하는지 그 물리적 작동 원리를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">rough 형용사: 명사(surface)를 수식하는 역할을 합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 페인트를 사용한 후에,</span><span class=\"en\"><b>After <span class=\"grammar-hl\">using this paint</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분은 씻어낼 수 있다</span><span class=\"en\"><b>you can wash</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분의 집 외부를</span><span class=\"en\"><b>the outside of your house</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 적게 자주</span><span class=\"en\"><b>less often.</b></span></div></div><div class=\"lec-sent-ko\">이 페인트를 쓰고 난 후에는 집의 외부를 덜 청소할 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 기술 도입으로 인해 인간의 수고가 덜어지는 실질적인 결과물을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">using this paint (동명사): 전치사(After)의 목적어 역할을 합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 발견은</span><span class=\"en\"><b>This discovery</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">~에서 나왔다</span><span class=\"en\"><b>came from</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">연잎을 보는 것에서</span><span class=\"en\"><b><span class=\"grammar-hl\">looking at lotus leaves</span>.</b></span></div></div><div class=\"lec-sent-ko\">이 발견은 연잎을 관찰하는 것에서 나왔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 예로 든 페인트 기술이 어디서 영감을 얻었는지 그 근원을 밝히며 자연 관찰의 중요성을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">looking at lotus leaves (동명사): 전치사(from)의 목적어 역할을 합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사람들이 알다시피,</span><span class=\"en\"><b><span class=\"grammar-hl\">As people know</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">연꽃은</span><span class=\"en\"><b>lotus</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">산다</span><span class=\"en\"><b>lives</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">진흙투성이 연못에서</span><span class=\"en\"><b>in muddy ponds.</b></span></div></div><div class=\"lec-sent-ko\">사람들이 알다시피 연꽃은 진흙 연못에 산다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 왜 하필 연꽃을 관찰했는지에 대한 의문을 제기하며 독자의 호기심을 자극합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">As people know (접속사절): &#39;사람들이 아는 것처럼&#39;이라는 의미의 부사절입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러나,</span><span class=\"en\"><b>However,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것의 잎은</span><span class=\"en\"><b>its leaves</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">항상 보인다</span><span class=\"en\"><b><span class=\"grammar-hl\">always</span> look</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">깨끗하게</span><span class=\"en\"><b>clean.</b></span></div></div><div class=\"lec-sent-ko\">그러나 연잎은 항상 깨끗해 보인다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 진흙 속에서도 깨끗함을 유지하는 연꽃의 역설적인 상황을 제시하여 이후의 분석적 설명을 유도합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">always (빈도부사): 동사(look)의 앞에 위치하여 행동의 빈도를 설명합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">왜</span><span class=\"en\"><b>Why</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이것이</span><span class=\"en\"><b><span class=\"grammar-hl\">is this</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가능한가?</span><span class=\"en\"><b><span class=\"grammar-hl\">possible</span>?</b></span></div></div><div class=\"lec-sent-ko\">이것이 가능한 이유는 무엇일까?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자에게 직접 질문을 던져, 연꽃의 원리에 대한 구체적인 분석을 본격적으로 시작하겠다는 예고입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is this possible 의문문 어순: 의문사(Why)로 시작하며 주어(this)와 동사(is)가 도치된 의문문 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 11 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">살펴보라</span><span class=\"en\"><b><span class=\"grammar-hl\">Look at</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">연잎을</span><span class=\"en\"><b>a lotus leaf</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">현미경 아래에서</span><span class=\"en\"><b>under a microscope.</b></span></div></div><div class=\"lec-sent-ko\">현미경으로 연꽃잎을 보라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 문제의 답을 찾기 위해 관찰의 도구를 구체화하여 정밀한 분석을 제안합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Look at (명령문): 주어(You)가 생략되고 동사원형으로 시작하여 상대방에게 행동을 요구합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">look at</td><td class=\"m\">~을 보다, ~을 살펴보다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 12 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러면</span><span class=\"en\"><b>Then</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분은 알 수 있다</span><span class=\"en\"><b>you can <span class=\"grammar-hl\">know</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 답을</span><span class=\"en\"><b><span class=\"grammar-hl\">the answer</span>.</b></span></div></div><div class=\"lec-sent-ko\">그러면 답을 알 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 미시적 관찰이 현상의 비밀을 밝혀내는 핵심 열쇠라는 점을 분명히 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">know the answer (to부정사): can의 뒤에서 동사원형과 함께 쓰여 가능성을 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 13 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">있다</span><span class=\"en\"><b><span class=\"grammar-hl\">There are</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 작은 돌기들이</span><span class=\"en\"><b>many tiny bumps</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것 위에는</span><span class=\"en\"><b>on it.</b></span></div></div><div class=\"lec-sent-ko\">그것 위에는 많은 작은 돌기들이 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 현미경을 통해 확인한 연꽃 잎의 표면 상태를 구체적으로 묘사합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">There are 유도부사 구문: There가 문두에 오고 주어(many tiny bumps)와 동사(are)가 도치된 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 14 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것들은</span><span class=\"en\"><b>They</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">작은 못처럼 보인다</span><span class=\"en\"><b>look like small nails</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 만든다 그 표면을</span><span class=\"en\"><b>and <span class=\"grammar-hl\">make the surface</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">거칠게</span><span class=\"en\"><b><span class=\"grammar-hl\">rough</span>.</b></span></div></div><div class=\"lec-sent-ko\">그것들은 작은 못처럼 보이고 표면을 거칠게 만든다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 &#39;돌기&#39;가 어떤 모양이며 어떻게 표면의 질감을 형성하는지 형상화합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">make the surface rough 5형식(SVOC) 구조: make(동사) + the surface(목적어) + rough(목적보어) 형태로, 목적어를 어떤 상태로 만드는지 설명합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 15 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그래서</span><span class=\"en\"><b>So</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은</span><span class=\"en\"><b>it</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">먼지를 막을 수 있다</span><span class=\"en\"><b>can <span class=\"grammar-hl\">keep dust off</span>.</b></span></div></div><div class=\"lec-sent-ko\">따라서 먼지를 차단할 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 돌기들의 구조와 거친 표면이 연꽃 잎의 청결 유지에 어떻게 기여하는지 인과관계를 완성합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">keep dust off (관용표현): keep + 목적어 + 부사(off) 구조로, 목적어를 특정 장소로부터 떨어뜨려 유지하다라는 의미입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 16 / 16</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">항상 애쓰라</span><span class=\"en\"><b>Always <span class=\"grammar-hl\">try</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자연을 관찰하도록</span><span class=\"en\"><b><span class=\"grammar-hl\">to observe</span> nature</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">면밀히</span><span class=\"en\"><b>closely!</b></span></div></div><div class=\"lec-sent-ko\">항상 자연을 면밀히 관찰하도록 애쓰라!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 자연 속에서 기술적 영감을 얻는 가치를 재강조하며 독자에게 관찰을 실천할 것을 권유합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">try to observe (to부정사): 동사 try의 목적어 역할을 하며, 앞으로 할 행동을 설명합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">observe</td><td class=\"m\">관찰하다, 지키다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>자연은 인간의 삶을 더 편안하게 만들어 줄 발견의 보고이다.</li><li>연꽃 잎은 진흙 속에서도 미세 돌기 구조 덕분에 항상 깨끗함을 유지한다.</li><li>인간은 연꽃의 이러한 원리를 관찰하여 집을 깨끗하게 유지하는 페인트 기술을 개발했다.</li><li>기술 혁신을 위해 자연을 세심하게 관찰하는 자세가 중요하다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Nature acts as a source of discovery for new technologies, and observing its structures can lead to practical improvements in human daily life.</div>\n              <div class=\"lec-final-sum-ko\">자연은 새로운 기술을 위한 발견의 원천이며, 그 구조를 관찰함으로써 인간의 일상생활에 실질적인 개선을 이끌어낼 수 있다.</div></div></div>"],"segs":[[{"audio":"./reading10_audio/1.mp3","hl":null}],[{"audio":"./reading10_audio/2.mp3","hl":null}],[{"audio":"./reading10_audio/3.mp3","hl":null},{"audio":"./reading10_audio/4.mp3","hl":"stage-0"},{"audio":"./reading10_audio/5.mp3","hl":"stage-1"},{"audio":"./reading10_audio/6.mp3","hl":"stage-2"},{"audio":"./reading10_audio/7.mp3","hl":"stage-3"},{"audio":"./reading10_audio/8.mp3","hl":"stage-4"}],[{"audio":"./reading10_audio/9.mp3","hl":null}],[{"audio":"./reading10_audio/10.mp3","hl":"main"},{"audio":"./reading10_audio/11.mp3","hl":"meaning"},{"audio":"./reading10_audio/12.mp3","hl":"grammar"}],[{"audio":"./reading10_audio/13.mp3","hl":"main"},{"audio":"./reading10_audio/14.mp3","hl":"meaning"},{"audio":"./reading10_audio/15.mp3","hl":"grammar"}],[{"audio":"./reading10_audio/16.mp3","hl":"main"},{"audio":"./reading10_audio/17.mp3","hl":"meaning"},{"audio":"./reading10_audio/18.mp3","hl":"grammar"}],[{"audio":"./reading10_audio/19.mp3","hl":"main"},{"audio":"./reading10_audio/20.mp3","hl":"me
