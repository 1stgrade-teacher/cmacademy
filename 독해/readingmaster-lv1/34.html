<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터1 Reading 34 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터1 Reading 34","audioDir":"34_audio","preview":false,"count":51,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.668em\">Reading\u003cbr>34\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터1\u003c/div>\u003ch1>When Do Children Begin to Understand Others' Thinking?\u003c/h1>\u003ch2>아이들은 언제 다른 사람의 생각을 이해하기 시작할까?\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>네 살 아이는 엄마가 연필을 보지 못했음을 알아 엄마의 \u003cb class=\"key\">생각\u003c/b>을 다르게 추론하지만, 네 살 미만 아이는 엄마도 자신과 \u003cb class=\"key\">같은 \u003c/b>\u003cb class=\"key\">방식\u003c/b>으로 생각한다고 여긴다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Children begin to understand other people's thinking around age four, while younger children assume everyone thinks the same way as they do.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요. 오늘은 리딩마스터 지문을 함께 읽어 볼게요. 이 글은 아이들이 다른 사람의 생각을 언제 이해하기 시작하는지 다룹니다. 네 살 아이는 엄마의 생각을 다르게 추론하지만, 그보다 어린 아이는 모두가 자신과 같은 방식으로 생각한다고 여긴다는 점이 핵심이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">사람이 다른 사람의 생각과 믿음을 추론하는 능력을 \u003cb class=\"key\">마음 \u003c/b>\u003cb class=\"key\">이론\u003c/b>이라고 하며, 영어로는 Theory of Mind라고 합니다. 이 능력은 상대가 실제와 다른 믿음을 가질 수 있음을 아는지 확인하는 \u003cb class=\"key\">틀린 \u003c/b>\u003cb class=\"key\">믿음\u003c/b> 과제, 즉 false belief task로 자주 검사됩니다. 네 살 전후 아이들은 \u003cb class=\"key\">조망 \u003c/b>\u003cb class=\"key\">수용\u003c/b>, 즉 perspective-taking이 발달하면서 상대가 경험하지 못한 정보를 모른다고 가정할 수 있습니다. 그 이전에는 \u003cb class=\"key\">자아중심성\u003c/b>, 즉 egocentrism이 강해 친구가 내 우산을 당연히 알 거라고 착각하는 일상 비유처럼 상대의 정보 상태를 구분하기 어렵습니다. 이 지문의 껌 통 실험은 상대가 본 것과 내가 본 것이 다른 \u003cb class=\"key\">정보 \u003c/b>\u003cb class=\"key\">비대칭\u003c/b>, 즉 information asymmetry를 아이가 이해하는지 보여 줍니다.\u003c/div>","segs":[{"n":2,"text":"먼저 마음 이론을 영어로 Theory of Mind라고 한다는 점을 기억해 주세요. 이 능력은 상대의 틀린 믿음을 이해하는 실험으로 자주 확인됩니다. 네 살 전후 아이들은 조망 수용, 즉 perspective taking이 발달하면서 상대가 경험하지 못한 정보를 모른다고 가정할 수 있어요. 그 이전에는 자아중심성이 강해서 친구가 내 우산을 당연히 알 거라고 착각하는 일상 비유처럼 상대의 정보 상태를 구분하기 어렵죠. 이 지문의 껌 통 실험은 정보 비대칭을 아이가 이해하는지 보여 줍니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>주제 제시\u003csmall>도입 · 문장 1\u003c/small>\u003c/h4>\u003cp>아이들이 네 살이 되면 다른 사람의 \u003cb class=\"key\">생각\u003c/b>을 이해하기 시작한다는 주제를 제시한다. 이 문장이 글 전체의 방향을 잡아 주는 \u003cb class=\"key\">주제문\u003c/b> 역할을 한다. 여기서 말하는 생각은 상대가 무엇을 알고 믿는지에 대한 이해를 뜻한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>껌 통 실험\u003csmall>예시 · 문장 2–9\u003c/small>\u003c/h4>\u003cp>네 살짜리 소녀에게 껌 통 안에 무엇이 있는지 묻고, 통을 열어 \u003cb class=\"key\">연필\u003c/b>을 보여 준다. 이어서 방 밖에 있는 \u003cb class=\"key\">엄마\u003c/b>가 무엇을 생각할지 물으면 소녀는 여전히 껌이라고 답한다. 이는 소녀가 엄마가 연필을 보지 못했음을 알기 때문이다. \u003cb class=\"key\">껌 \u003c/b>\u003cb class=\"key\">통\u003c/b> 실험은 상대가 본 것과 내가 본 것이 다를 수 있음을 보여 준다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>어린아이의 반응\u003csmall>반례 · 문장 10–12\u003c/small>\u003c/h4>\u003cp>반면 \u003cb class=\"key\">네 \u003c/b>\u003cb class=\"key\">살 \u003c/b>\u003cb class=\"key\">미만\u003c/b> 아이는 같은 상황에서 연필이라고 답한다. 엄마가 안을 보지 못했다는 사실을 \u003cb class=\"key\">상상\u003c/b>하지 못하기 때문이다. 그래서 누군가가 무엇을 알려면 직접 보아야 한다는 점을 이해하지 못한다. 이 대비가 아이의 \u003cb class=\"key\">관점\u003c/b> 차이를 분명히 드러낸다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>결론\u003csmall>결론 · 문장 13\u003c/small>\u003c/h4>\u003cp>결론적으로 어린아이는 모두가 자신과 \u003cb class=\"key\">같은 \u003c/b>\u003cb class=\"key\">방식\u003c/b>으로 생각한다고 여긴다. 이는 다른 사람의 \u003cb class=\"key\">관점\u003c/b>을 따로 떼어 보는 능력이 아직 부족함을 뜻한다. 그래서 글은 이 시기의 \u003cb class=\"key\">생각\u003c/b> 발달을 시사한다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 네 단계로 나누어 살펴볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 도입이에요. 아이들이 네 살이 되면 다른 사람의 생각을 이해하기 시작한다는 주제를 꺼내죠. 이 문장이 글 전체의 방향을 잡아 주는 주제문 역할을 합니다.","hl":"f0"},{"n":5,"text":"두 번째 단계는 껌 통 실험의 예시예요. 껌 통 안에 연필을 넣고 엄마가 그것을 보지 못했다는 사실을 아이가 아는지 확인하죠. 네 살 아이는 엄마가 연필을 보지 못했으니 엄마는 껌이 들어 있다고 생각할 거라고 말합니다. 이 장면이 다른 사람의 생각을 이해하는 능력을 잘 보여 줍니다.","hl":"f1"},{"n":6,"text":"세 번째 단계는 대조와 반례입니다. 네 살 미만 아이는 같은 상황에서 연필이라고 말해요. 엄마가 안을 보지 못했다는 사실을 상상하지 못하기 때문이죠. 이 대비가 아이의 관점 차이를 분명히 드러냅니다.","hl":"f2"},{"n":7,"text":"네 번째 단계는 결론이에요. 글은 아이들이 모두 자신과 같은 방식으로 생각한다고 정리합니다. 이는 다른 사람의 관점을 따로 떼어 보는 능력이 아직 부족하다는 뜻이고, 그만큼 생각의 발달이 중요하다는 점을 보여 줍니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">비교·대조\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 아이들이 네 살부터 다른 사람의 \u003cb class=\"key\">생각\u003c/b>을 이해한다는 주제를 먼저 제시한다. 이어서 \u003cb class=\"key\">껌 \u003c/b>\u003cb class=\"key\">통\u003c/b> 실험으로 \u003cb class=\"key\">네 \u003c/b>\u003cb class=\"key\">살\u003c/b> 아이와 \u003cb class=\"key\">네 \u003c/b>\u003cb class=\"key\">살 \u003c/b>\u003cb class=\"key\">미만\u003c/b> 아이의 반응을 대조해 주제를 뒷받침한다. 마지막 문장은 모두가 자신과 \u003cb class=\"key\">같은 \u003c/b>\u003cb class=\"key\">방식\u003c/b>으로 생각한다는 결론으로 내용을 묶는다. 따라서 주제를 앞에 두고 예시와 대조로 설명하는 \u003cb class=\"key\">두괄식\u003c/b> 비교·대조 구조로 볼 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>For example (2)\u003c/b>\u003cspan>예시 도입\u003c/span>\u003cb>Still (8)\u003c/b>\u003cspan>양보·강조\u003c/span>\u003cb>because (9)\u003c/b>\u003cspan>이유 제시\u003c/span>\u003cb>But (10)\u003c/b>\u003cspan>대조 전환\u003c/span>\u003cb>So (13)\u003c/b>\u003cspan>결론 도출\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">understand other people's thinking\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">what will your mom think is inside\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">know her mother did not see the pencil inside\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">imagine their mom did not see inside\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">think everyone thinks the same way as they do\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>네 살 아이\u003c/th>\u003cth>네 살 미만 아이\u003c/th>\u003c/tr>\u003ctr>\u003ctd>엄마가 연필을 보지 못했음을 이해함\u003c/td>\u003ctd>엄마가 안을 보지 못했음을 상상하지 못함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>엄마는 껌이 들어 있다고 생각할 것이라 답함\u003c/td>\u003ctd>엄마도 연필이 들어 있다고 생각할 것이라 답함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>다른 사람의 생각을 구분함\u003c/td>\u003ctd>자신의 관점에 갇힘\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 비교와 대조의 전개 방식을 택하고 있어요. 첫 문장에서 다른 사람의 생각을 이해한다는 주제를 먼저 던지는 두괄식 구조입니다. 이어서 껌 통 실험을 통해 네 살 아이와 네 살 미만 아이의 차이를 보여 주고, 마지막에 모두가 자신과 같은 방식으로 생각한다고 정리하죠. 그래서 주제문이 앞에 있고 예시와 대조가 뒤에서 이를 받치는 모양새입니다.","hl":"ty"},{"n":9,"text":"신호어를 보면 for example이 예시를 열어 주고, but이 대조로 방향을 틀며, so가 결론을 이끌어요. 또한 엄마가 연필을 보지 못했다는 표현과 엄마는 껌이 들어 있다고 생각한다는 표현이 서로 이어지며 재진술됩니다. 이런 신호어를 잡으면 글의 구조가 한눈에 보여요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>become\u003c/b>\u003cem>동사\u003c/em>\u003cspan>~이 되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>understand\u003c/b>\u003cem>동사\u003c/em>\u003cspan>이해하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>thinking\u003c/b>\u003cem>명사\u003c/em>\u003cspan>생각, 사고\u003c/span>\u003c/div>\u003cdiv>\u003cb>for example\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>예를 들어\u003c/span>\u003c/div>\u003cdiv>\u003cb>ask\u003c/b>\u003cem>동사\u003c/em>\u003cspan>묻다\u003c/span>\u003c/div>\u003cdiv>\u003cb>inside\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>안에, 내부에\u003c/span>\u003c/div>\u003cdiv>\u003cb>package\u003c/b>\u003cem>명사\u003c/em>\u003cspan>포장, 통\u003c/span>\u003c/div>\u003cdiv>\u003cb>gum\u003c/b>\u003cem>명사\u003c/em>\u003cspan>껌\u003c/span>\u003c/div>\u003cdiv>\u003cb>say\u003c/b>\u003cem>동사\u003c/em>\u003cspan>말하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>open\u003c/b>\u003cem>동사\u003c/em>\u003cspan>열다\u003c/span>\u003c/div>\u003cdiv>\u003cb>show\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보여 주다\u003c/span>\u003c/div>\u003cdiv>\u003cb>pencil\u003c/b>\u003cem>명사\u003c/em>\u003cspan>연필\u003c/span>\u003c/div>\u003cdiv>\u003cb>think\u003c/b>\u003cem>동사\u003c/em>\u003cspan>생각하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>wait\u003c/b>\u003cem>동사\u003c/em>\u003cspan>기다리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>outside\u003c/b>\u003cem>부사\u003c/em>\u003cspan>밖에, 바깥에\u003c/span>\u003c/div>\u003cdiv>\u003cb>room\u003c/b>\u003cem>명사\u003c/em>\u003cspan>방\u003c/span>\u003c/div>\u003cdiv>\u003cb>still\u003c/b>\u003cem>부사\u003c/em>\u003cspan>여전히, 그럼에도\u003c/span>\u003c/div>\u003cdiv>\u003cb>because\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>왜냐하면\u003c/span>\u003c/div>\u003cdiv>\u003cb>under\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~미만, 아래에\u003c/span>\u003c/div>\u003cdiv>\u003cb>same\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>같은\u003c/span>\u003c/div>\u003cdiv>\u003cb>example\u003c/b>\u003cem>명사\u003c/em>\u003cspan>예시, 예\u003c/span>\u003c/div>\u003cdiv>\u003cb>imagine\u003c/b>\u003cem>동사\u003c/em>\u003cspan>상상하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>need\u003c/b>\u003cem>동사\u003c/em>\u003cspan>필요로 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>know\u003c/b>\u003cem>동사\u003c/em>\u003cspan>알다\u003c/span>\u003c/div>\u003cdiv>\u003cb>in there\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>그 안에\u003c/span>\u003c/div>\u003cdiv>\u003cb>everyone\u003c/b>\u003cem>대명사\u003c/em>\u003cspan>모든 사람\u003c/span>\u003c/div>\u003cdiv>\u003cb>same way\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>같은 방식\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"단어는 become, understand, package, inside, imagine, need를 중심으로 봐 주세요. become은 ~이 되다, understand는 이해하다, package는 포장이나 통이라는 뜻이에요. imagine은 상상하다, need는 필요로 하다는 의미로 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">understand\u003c/b>\u003cspan class=\"m\">이해하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">comprehend\u003c/span>\u003cspan class=\"s\">grasp\u003c/span>\u003cspan class=\"s\">realize\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">misunderstand\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">thinking\u003c/b>\u003cspan class=\"m\">생각\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">thought\u003c/span>\u003cspan class=\"s\">reasoning\u003c/span>\u003cspan class=\"s\">cognition\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">inside\u003c/b>\u003cspan class=\"m\">안에\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">within\u003c/span>\u003cspan class=\"s\">interior\u003c/span>\u003cspan class=\"s\">indoors\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">outside\u003c/span>\u003cspan class=\"a\">exterior\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">show\u003c/b>\u003cspan class=\"m\">보여 주다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">display\u003c/span>\u003cspan class=\"s\">reveal\u003c/span>\u003cspan class=\"s\">demonstrate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hide\u003c/span>\u003cspan class=\"a\">conceal\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">wait\u003c/b>\u003cspan class=\"m\">기다리다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">stay\u003c/span>\u003cspan class=\"s\">remain\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">leave\u003c/span>\u003cspan class=\"a\">depart\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">same\u003c/b>\u003cspan class=\"m\">같은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">identical\u003c/span>\u003cspan class=\"s\">equal\u003c/span>\u003cspan class=\"s\">alike\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">different\u003c/span>\u003cspan class=\"a\">unlike\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">imagine\u003c/b>\u003cspan class=\"m\">상상하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">picture\u003c/span>\u003cspan class=\"s\">envision\u003c/span>\u003cspan class=\"s\">suppose\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">know\u003c/b>\u003cspan class=\"m\">알다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">understand\u003c/span>\u003cspan class=\"s\">recognize\u003c/span>\u003cspan class=\"s\">realize\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">misunderstand\u003c/span>\u003cspan class=\"a\">doubt\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 함께 정리할게요. understand는 comprehend, grasp와 가깝고 misunderstand와 반대됩니다. inside는 within, interior와 비슷하고 outside와 반대죠. show는 display, reveal과 가깝고 hide와 반대이며, same은 identical, alike와 비슷하고 different와 반대입니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아이들은 4세가 되면,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">children \u003c/span>\u003cspan class=\"tgt\">become \u003c/span>\u003cspan class=\"tgt\">four \u003c/span>\u003cspan class=\"tgt\">years \u003c/span>\u003cspan class=\"tgt\">old\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 시작한다\u003c/span>\u003cspan class=\"en\">they start\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이해하기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">understand\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 사람의 생각을.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">other \u003c/span>\u003cspan class=\"tgt\">people's \u003c/span>\u003cspan class=\"tgt\">thinking\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">아이들은 4세가 되면 다른 사람의 생각을 이해하기 시작한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글 전체의 \u003cb class=\"key\">주제문\u003c/b>으로, 아이들이 네 살 무렵부터 \u003cb class=\"key\">다른 \u003c/b>\u003cb class=\"key\">사람의 \u003c/b>\u003cb class=\"key\">생각\u003c/b>을 이해하기 시작한다는 점을 제시해요. 뒤에 이어질 \u003cb class=\"key\">실험 \u003c/b>\u003cb class=\"key\">상황\u003c/b>을 자연스럽게 예고하는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 when의 시간 부사절\u003c/span> : When + [주어 children] + [동사 become] ..., [주절] : \"아이들이 네 살이 될 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : start + [to understand (to부정사구/목적어)] : \"이해하기를\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">소유격에 의한 명사 수식\u003c/span> : [other people's] + [thinking (명사)] : \"다른 사람의 생각\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"When children become four years old, 아이들은 4세가 되면. they start, 그들은 시작한다. to understand, 이해하기를. other people's thinking, 다른 사람의 생각을.. 이 문장 전체를 해석하면, 아이들은 4세가 되면 다른 사람의 생각을 이해하기 시작한다.","hl":"m"},{"n":13,"text":"이 문장은 글 전체의 주제문이에요. 아이들이 네 살 무렵부터 다른 사람의 생각을 이해하기 시작한다는 점을 먼저 제시하고, 뒤에 이어질 실험 상황을 자연스럽게 예고하죠.","hl":"mn"},{"n":14,"text":"어법 포인트를 짚어 볼게요. 첫 번째, when은 뒤에 시간을 나타내는 절을 이끌어 주절이 일어나는 시점을 알려 줘요. 두 번째, start는 뒤에 to understand를 목적어로 받아 '이해하기 시작하다'라는 뜻을 만들어요. 세 번째, other people 뒤에 소유격 s를 붙여 다른 사람들의 생각이라는 의미로 thinking을 꾸며 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들어,\u003c/span>\u003cspan class=\"en\">For example,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 물을 수 있다\u003c/span>\u003cspan class=\"en\">you \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">ask\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">네 살짜리 소녀에게,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">four-year-old \u003c/span>\u003cspan class=\"tgt\">girl\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“무엇이 안에 있니\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">What \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">inside \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">껌 통?”\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">package \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">gum?\u003c/span>&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">예를 들어, 네 살짜리 소녀에게 “껌 통 안에 무엇이 들어있니?”라고 물을 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 네 살짜리 소녀에게 껌 통 안을 묻는 \u003cb class=\"key\">구체적 \u003c/b>\u003cb class=\"key\">예시\u003c/b>를 제시해요. 아이가 다른 사람의 \u003cb class=\"key\">생각\u003c/b>을 어떻게 추론하는지 보여 주기 위한 \u003cb class=\"key\">실험\u003c/b>의 시작 장면입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 can의 가능\u003c/span> : can + [동사원형 ask] : \"물을 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">복합형용사 four-year-old\u003c/span> : [four-year-old] + [명사 girl] : \"네 살짜리 소녀\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">의문사 what이 이끄는 직접의문문\u003c/span> : [What] + [be동사 is] + [주어 inside the package of gum]? : \"껌 통 안에 무엇이 있니?\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"For example, 예를 들어. you can ask, 당신은 물을 수 있다. a four-year-old girl, 네 살짜리 소녀에게. \"What is inside, “무엇이 안에 있니. the package of gum?\", 껌 통?”. 이 문장 전체를 해석하면, 예를 들어, 네 살짜리 소녀에게 “껌 통 안에 무엇이 들어있니?”라고 물을 수 있다.","hl":"m"},{"n":16,"text":"이 문장은 네 살짜리 소녀에게 껌 통 안을 묻는 구체적 예시를 보여 줘요. 아이가 다른 사람의 생각을 어떻게 추론하는지 확인하기 위한 실험의 시작 장면인 거죠.","hl":"mn"},{"n":17,"text":"어법 포인트를 짚어 볼게요. 첫 번째, can은 동사원형 ask 앞에서 '할 수 있다'라는 가능의 의미를 더해요. 두 번째, four-year-old처럼 숫자와 단위를 연결할 때는 하이픈을 쓰고 year를 단수로 써서 하나의 형용사처럼 명사를 꾸며요. 세 번째, what은 문장 앞에서 무엇이라는 의문사 역할을 하며 be동사 is와 함께 직접 질문을 만들어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 아이는 말할 것이다,\u003c/span>\u003cspan class=\"en\">She \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">say\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“껌.”\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">&quot;Gum.&quot;\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 아이는 “껌”이라고 말할 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 소녀가 질문에 대해 “껌”이라고 단순히 \u003cb class=\"key\">대답\u003c/b>하는 장면이에요. 통 안을 직접 보지 않은 \u003cb class=\"key\">상대\u003c/b>의 생각을 고려하는지 살펴보는 \u003cb class=\"key\">실험\u003c/b>의 첫 반응으로 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 will의 미래·예측\u003c/span> : will + [동사원형 say] : \"말할 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">직접화법\u003c/span> : say + [쉼표] + [인용 내용] : \"“껌.”\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"She will say, 그 아이는 말할 것이다. \"Gum.\", “껌.”. 이 문장 전체를 해석하면, 그 아이는 “껌”이라고 말할 것이다.","hl":"m"},{"n":19,"text":"이 문장은 소녀가 질문에 대해 껌이라고 단순히 대답하는 장면이에요. 통 안을 직접 보지 않은 상대의 생각을 고려하는지 살펴보는 실험의 첫 반응으로 이어지죠.","hl":"mn"},{"n":20,"text":"어법 포인트를 짚어 볼게요. 첫 번째, will은 동사원형 say 앞에서 앞으로 일어날 일이나 예측을 나타내요. 두 번째, say 뒤에 쉼표를 두고 인용문을 그대로 붙여 소녀가 말한 내용을 직접 보여 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 연다\u003c/span>\u003cspan class=\"en\">You \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">open \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 껌 통을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">package \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그녀에게 보여 준다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">show \u003c/span>\u003cspan class=\"tgt\">her\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">안에 무엇이 있는지를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">what's \u003c/span>\u003cspan class=\"tgt\">inside\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">당신은 껌 통을 열어 그녀에게 안에 무엇이 있는지를 보여 준다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 껌 통을 열어 그 안을 보여 주는 실험 장면을 설명해요. \u003cb class=\"key\">show\u003c/b>는 ‘그녀에게 무엇을 보여 주다’라는 구조를 만들고, \u003cb class=\"key\">what's \u003c/b>\u003cb class=\"key\">inside\u003c/b>는 ‘안에 무엇이 있는지’라는 명사절로 show의 직접목적어 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사 and 동사 병렬 구조\u003c/span> : open + [목적어 the package] and show + [간접목적어 her] : \"껌 통을 열고 그녀에게 보여 준다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">의문사 what이 이끄는 명사절(간접의문문)\u003c/span> : show + [what + 동사] : \"안에 무엇이 있는지\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"You open, 당신은 연다. the package, 그 껌 통을. and show her, 그리고 그녀에게 보여 준다. what's inside, 안에 무엇이 있는지를. 이 문장 전체를 해석하면, 당신은 껌 통을 열어 그녀에게 안에 무엇이 있는지를 보여 준다.","hl":"m"},{"n":22,"text":"이 문장은 껌 통을 열어서 안을 보여 주는 실험 장면을 설명해요. 여기서 show는 그녀에게 무엇을 보여 주다는 구조를 만들고, what's inside는 안에 무엇이 있는지라는 명사절로 show의 직접목적어 역할을 해요.","hl":"mn"},{"n":23,"text":"첫 번째로 open the package and show her에는 open과 show가 and로 연결된 병렬 구조가 보여요. 그래서 껌 통을 열고 그녀에게 보여 준다처럼 두 행동을 대등하게 이어 줘요. 두 번째로 what's inside는 what is의 축약이고, 의문사절 전체가 show의 직접목적어로 쓰여요. 이때는 의문문 어순이 아니라 명사절 어순으로 무엇이 안에 있는지를 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">연필이 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">is\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">pencil\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">안에\u003c/span>\u003cspan class=\"en\">inside.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 안에는 연필이 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 껌 통 안에 실제로 연필이 들어 있음을 알려 줘요. \u003cb class=\"key\">There \u003c/b>\u003cb class=\"key\">is\u003c/b>는 ‘~이 있다’라는 뜻으로, 뒤에 오는 \u003cb class=\"key\">a \u003c/b>\u003cb class=\"key\">pencil\u003c/b>이 존재의 대상임을 나타내요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">유도부사 there + be동사\u003c/span> : There + is + [주어] + [장소부사] : \"~이 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주어\u003c/span> : There is + [주어 a pencil] : \"연필이\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"There is a pencil, 연필이 있다. inside, 안에. 이 문장 전체를 해석하면, 그 안에는 연필이 있다.","hl":"m"},{"n":25,"text":"이 문장은 껌 통 안에 실제로 연필이 들어 있음을 알려 줘요. There is는 ~이 있다라는 뜻으로, 뒤에 오는 a pencil이 존재의 대상임을 나타내요.","hl":"mn"},{"n":26,"text":"첫 번째로 There is는 유도부사 there가 앞에 와서 무엇이 존재한다는 의미를 만드는 구조예요. 실제 주어는 be동사 뒤에 있는 a pencil이에요. 두 번째로 이 문장에서 주어는 be동사 뒤에 놓이기 때문에 연필이 있다로 해석해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그런 다음\u003c/span>\u003cspan class=\"en\">Then,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 그녀에게 묻는다,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">ask \u003c/span>\u003cspan class=\"tgt\">her\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“무엇이\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">What \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">너희 엄마는 생각하실 것 같아\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">mom \u003c/span>\u003cspan class=\"tgt\">think \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">안에 있다고?”\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">inside?\u003c/span>&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그런 다음 당신은 그녀에게 “너희 엄마는 안에 무엇이 있다고 생각하실 것 같아?”라고 물어본다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 껌 통을 열어 본 뒤 엄마가 안에 무엇이 있다고 생각할지 묻는 장면이에요. \u003cb class=\"key\">ask\u003c/b>는 ‘그녀에게 묻다’라는 구조로 쓰였고, \u003cb class=\"key\">What \u003c/b>\u003cb class=\"key\">will \u003c/b>\u003cb class=\"key\">your \u003c/b>\u003cb class=\"key\">mom \u003c/b>\u003cb class=\"key\">think \u003c/b>\u003cb class=\"key\">is \u003c/b>\u003cb class=\"key\">inside?\u003c/b>는 엄마의 생각을 직접 인용한 의문문이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">4형식 동사 ask + 간접목적어\u003c/span> : ask + [간접목적어 her] + [직접목적어: 의문사절] : \"당신은 그녀에게 묻는다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">의문사가 포함된 직접의문문\u003c/span> : What + will + [주어 your mom] + [동사원형 think] + [is inside]? : \"너희 엄마는 안에 무엇이 있다고 생각하실 것 같아?\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Then, 그런 다음. you ask her, 당신은 그녀에게 묻는다. \"What, “무엇이. will your mom think, 너희 엄마는 생각하실 것 같아. is inside?\", 안에 있다고?”. 이 문장 전체를 해석하면, 그런 다음 당신은 그녀에게 “너희 엄마는 안에 무엇이 있다고 생각하실 것 같아?”라고 물어본다.","hl":"m"},{"n":28,"text":"이 문장은 껌 통을 열어 본 뒤 엄마가 안에 무엇이 있다고 생각할지 묻는 장면이에요. ask는 그녀에게 묻다는 뜻으로 간접목적어와 직접목적어를 갖는 구조로 쓰였고, What will your mom think is inside?는 엄마의 생각을 직접 인용한 의문문이에요.","hl":"mn"},{"n":29,"text":"첫 번째로 you ask her에서 ask는 사람에게 묻다는 뜻으로 간접목적어 her를 취하고, 뒤에 오는 직접화법의 의문사절이 직접목적어 역할을 해요. 두 번째로 What will your mom think is inside?에서는 의문사 What이 is inside의 주어 역할을 하면서 문장 앞으로 이동했어요. 그래서 think 뒤에 간접의문문 성격의 절이 이어지는 구조예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀의 엄마는\u003c/span>\u003cspan class=\"en\">Her mom\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">방 밖에서 기다리고 있어서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">waiting\u003c/span> outside the room,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서 그녀는 볼 수 없다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">so \u003c/span>\u003cspan class=\"tgt\">she \u003c/span>\u003cspan class=\"tgt\">cannot \u003c/span>\u003cspan class=\"tgt\">see\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">안에 무엇이 들어 있는지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">what's \u003c/span>\u003cspan class=\"tgt\">inside\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀의 엄마는 방 밖에서 기다리고 있어서 안에 무엇이 들어 있는지 볼 수 없다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 엄마가 방 밖에 있어서 방 안을 직접 보지 못하는 상황을 제시한다. 이 정보는 아이가 엄마의 \u003cb class=\"key\">시점\u003c/b>을 고려하는지 판단하게 하는 실험의 \u003cb class=\"key\">전제\u003c/b>가 된다. 여기서 she는 \u003cb class=\"key\">엄마\u003c/b>를 가리키며, 아이가 엄마의 모름을 이해하는지가 핵심이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재진행형(be동사 + 현재분사)\u003c/span> : 주어 + be동사 + 현재분사 : \"기다리고 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 so(결과)\u003c/span> : 원인 절 + so + 결과 절 : \"그래서 그녀는 볼 수 없다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">의문사 what이 이끄는 명사절(간접의문문)\u003c/span> : see + what + 주어 + 동사 : \"안에 무엇이 들어 있는지\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Her mom, 그녀의 엄마는. is waiting outside the room, 방 밖에서 기다리고 있어서. so she cannot see, 그래서 그녀는 볼 수 없다. what's inside, 안에 무엇이 들어 있는지. 이 문장 전체를 해석하면, 그녀의 엄마는 방 밖에서 기다리고 있어서 안에 무엇이 들어 있는지 볼 수 없다.","hl":"m"},{"n":31,"text":"이 문장은 엄마가 방 밖에 있어서 방 안을 직접 보지 못한다는 실험의 전제를 보여 줘요. 여기서 she는 엄마를 가리키고, 아이가 엄마의 시점을 고려하는지 판단하는 중요한 정보가 됩니다.","hl":"mn"},{"n":32,"text":"먼저 is waiting은 be동사에 현재분사가 붙은 현재진행형이에요. 엄마가 지금 기다리는 중이라는 뜻이죠. 두 번째로 so she cannot see에서 so는 앞의 원인 때문에 뒤의 결과가 생긴다는 뜻을 이어 줘요. 세 번째로 what's inside는 see의 목적어로 쓰인 명사절이고, 간접의문문 어순을 따릅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여전히\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Still,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 아이는 말할 것이다,\u003c/span>\u003cspan class=\"en\">the girl \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">say\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“껌”이라고\u003c/span>\u003cspan class=\"en\">&quot;Gum.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여전히 그 아이는 “껌”이라고 말할 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 엄마가 방 안을 보지 못했는데도 아이는 여전히 엄마가 껌이라고 말할 것이라고 예상한다. 이 \u003cb class=\"key\">아이의 \u003c/b>\u003cb class=\"key\">대답\u003c/b>은 엄마의 \u003cb class=\"key\">정보 \u003c/b>\u003cb class=\"key\">상태\u003c/b>를 아이가 고려한다는 것을 보여 주는 \u003cb class=\"key\">관찰\u003c/b>이다. Still은 이런 반대 흐름을 강조한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속부사 Still(양보)\u003c/span> : Still + 주어 + 동사 : \"그럼에도 불구하고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 will(예측)\u003c/span> : 주어 + will + 동사원형 : \"말할 것이다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"Still, 여전히. the girl will say, 그 아이는 말할 것이다. \"Gum.\", “껌”이라고. 이 문장 전체를 해석하면, 여전히 그 아이는 “껌”이라고 말할 것이다.","hl":"m"},{"n":34,"text":"앞에서 엄마가 방 안을 보지 못했는데도 아이는 여전히 엄마가 껌이라고 말할 거라고 예상해요. 이 아이의 대답은 엄마의 정보 상태를 아이가 고려한다는 것을 보여 주는 관찰이에요.","hl":"mn"},{"n":35,"text":"먼저 Still은 앞 내용과 반대되는 흐름을 이어 주는 접속부사예요. 두 번째로 will say는 조동사 will이 들어간 표현으로, 아이가 그렇게 말할 것이라는 예측을 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 왜냐하면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">because\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀가 알고 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">she \u003c/span>\u003cspan class=\"tgt\">knows\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀의 엄마가 보지 못했다는 것을\u003c/span>\u003cspan class=\"en\">her mother \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">did \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">see\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">안에 있는 연필을\u003c/span>\u003cspan class=\"en\">the pencil inside.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 아이는 엄마가 안에 들어있는 연필을 보지 못했다는 것을 알기 때문이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아이가 엄마의 \u003cb class=\"key\">정보 \u003c/b>\u003cb class=\"key\">상태\u003c/b>를 이해하기 때문에 껌이라고 답한다는 점을 설명한다. 엄마가 연필을 보지 못했다는 사실을 아이가 \u003cb class=\"key\">추론\u003c/b>한다는 뜻이다. 앞 문장의 대답에 대한 이유를 제시하며 네 살 아이의 \u003cb class=\"key\">마음 \u003c/b>\u003cb class=\"key\">이론\u003c/b>을 보여 준다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">It is because 강조 구문(이유)\u003c/span> : It is because + 이유 절 : \"그것은 ~ 때문이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주어-동사 수 일치(현재시제)\u003c/span> : 주어 + 동사 : \"그녀는 알고 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">과거시제 부정문\u003c/span> : 주어 + did not + 동사원형 : \"보지 않았다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"It is because, 그것은 왜냐하면. she knows, 그녀가 알고 있다. her mother did not see, 그녀의 엄마가 보지 못했다는 것을. the pencil inside, 안에 있는 연필을. 이 문장 전체를 해석하면, 그 아이는 엄마가 안에 들어있는 연필을 보지 못했다는 것을 알기 때문이다.","hl":"m"},{"n":37,"text":"이 문장은 아이가 엄마의 정보 상태를 이해하기 때문에 껌이라고 답한다는 것을 설명해요. 엄마가 연필을 보지 못했다는 사실을 아이가 추론한다는 뜻이죠. 앞 문장의 대답에 대한 이유를 제시하면서 네 살 아이의 마음 이론을 보여 줍니다.","hl":"mn"},{"n":38,"text":"먼저 It is because는 앞 문장의 이유를 강조해서 제시하는 구문이에요. 두 번째로 she knows에서는 주어 she가 단수라 동사 know 뒤에 s가 붙는 수 일치가 일어나요. 세 번째로 did not see는 과거에 보지 않았다는 부정을 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나\u003c/span>\u003cspan class=\"en\">But\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">4세 미만의 어린이들은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">children \u003c/span>\u003cspan class=\"tgt\">under \u003c/span>\u003cspan class=\"tgt\">four\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">말할 것이다,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">say\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">&quot;연필&quot;이라고\u003c/span>\u003cspan class=\"en\">&quot;Pencil&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">같은 예시에서.\u003c/span>\u003cspan class=\"en\">in the same example.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 4세 미만의 어린이의 경우 같은 예시에서 “연필”이라고 말할 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 4세 아이가 엄마의 시점을 고려해 “Gum”이라고 답한 것과 정반대되는 결과를 보여 주는 문장이에요. But으로 시작해 4세 이상과 4세 미만을 \u003cb class=\"key\">대조\u003c/b>시키고, 다음 문장에서 그 까닭을 설명할 \u003cb class=\"key\">근거\u003c/b>를 마련합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 수식(후치수식)\u003c/span> : [명사 children] + [전치사구 under four] : \"4세 미만의 어린이들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 will (추측·예상)\u003c/span> : [주어] + will + [동사원형] : \"말할 것이다\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"But, 그러나. children under four, 4세 미만의 어린이들은. will say, 말할 것이다. \"Pencil\", \"연필\"이라고. in the same example, 같은 예시에서.. 이 문장 전체를 해석하면, 그러나 4세 미만의 어린이의 경우 같은 예시에서 “연필”이라고 말할 것이다.","hl":"m"},{"n":40,"text":"앞에서는 네 살 아이가 엄마 입장을 생각해서 Gum이라고 답했죠. 그런데 네 살이 안 된 아이들은 똑같은 실험에서 Pencil이라고 답한다는 거예요. 두 결과를 나란히 놓고 대조하는 문장입니다.","hl":"mn"},{"n":41,"text":"첫 번째, children under four에서 under four는 children 뒤에서 꾸며 주는 후치수식이에요. 명사 다음에 전치사구가 붙으면 뒤에서 앞의 명사를 설명한다고 기억해 두세요. 두 번째, will say는 예상의 will이고 조동사 뒤에는 동사원형 say가 온다는 점도 같이 챙겨 주세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은\u003c/span>\u003cspan class=\"en\">They\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상상할 수 없다\u003c/span>\u003cspan class=\"en\">cannot \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">imagine \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 엄마가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">mom \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">안을 보지 못했다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">did \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">see \u003c/span>\u003cspan class=\"tgt\">inside\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 그들의 엄마가 안을 보지 못했다는 사실을 상상할 수 없다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 4세 미만 아이들이 왜 “연필”이라고 답하는지 그 \u003cb class=\"key\">원인\u003c/b>을 밝혀 주는 문장이에요. 아이가 엄마의 \u003cb class=\"key\">시점\u003c/b>을 머릿속에 떠올리지 못한다는 뜻으로, 바로 다음 문장의 결론으로 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that의 생략(목적어절)\u003c/span> : imagine + [(that) + 주어 + 동사 ~] : \"그들의 엄마가 안을 보지 못했다는 것을 상상하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거시제 부정문\u003c/span> : did + not + [동사원형] : \"보지 못했다\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"They, 그들은. cannot imagine, 상상할 수 없다. their mom, 그들의 엄마가. did not see inside, 안을 보지 못했다는 것을. 이 문장 전체를 해석하면, 그들은 그들의 엄마가 안을 보지 못했다는 사실을 상상할 수 없다.","hl":"m"},{"n":43,"text":"네 살이 안 된 아이들은 엄마가 그 자리를 보지 못했다는 사실 자체를 머릿속에 그리지 못해요. 그래서 엄마도 자기가 아는 것과 똑같이 안다고 착각하는 거죠. 이 문장이 그 이유를 딱 짚어 줍니다.","hl":"mn"},{"n":44,"text":"첫 번째, imagine 뒤에는 접속사 that이 생략된 목적어절이 통째로 와요. 그래서 their mom이라는 주어가 바로 튀어나오는 것처럼 보인다는 점을 꼭 짚어 주세요. 두 번째, did not see는 과거의 부정이라 did가 시제를 맡고 본동사는 동사원형 see를 쓴다는 원리도 함께 정리해 둡시다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 모른다\u003c/span>\u003cspan class=\"en\">They do not \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">know \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">누군가가 안을 볼 필요가 있다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">someone \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">needs \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">see \u003c/span>\u003cspan class=\"tgt\">inside\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">알기 위해서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">know\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무엇이 거기 있는지를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">there\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 누군가가 무엇이 거기 있는지를 알기 위해 내부를 볼 필요가 있다는 것을 모른다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 4세 미만 아이들의 한계를 원리 차원에서 정리한 문장이에요. 무엇인가를 알려면 직접 보는 \u003cb class=\"key\">경험\u003c/b>이 필요하다는 사실을 아이들이 이해하지 못한다는 뜻이죠. 그래서 마지막 문장의 “모두가 나와 똑같이 생각한다”는 결론으로 자연스럽게 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that의 생략(목적어절)\u003c/span> : know + [(that) + 주어 + 동사 ~] : \"누군가가 안을 볼 필요가 있다는 것을 알다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : need + [to see (to부정사구/목적어)] : \"보는 것을 필요로 하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : [문장], to + [동사원형] (~하기 위해) : \"알기 위해서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">간접의문문\u003c/span> : [의문사 what] + [주어 + 동사] : \"무엇이 거기 있는지\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"They do not know, 그들은 모른다. someone needs to see inside, 누군가가 안을 볼 필요가 있다는 것을. to know, 알기 위해서. what is in there, 무엇이 거기 있는지를. 이 문장 전체를 해석하면, 그들은 누군가가 무엇이 거기 있는지를 알기 위해 내부를 볼 필요가 있다는 것을 모른다.","hl":"m"},{"n":46,"text":"이 문장은 네 살이 안 된 아이들의 한계를 원리로 정리한 문장이에요. 뭔가를 알려면 직접 봐야 한다는 사실을 아이들은 이해하지 못한다는 거죠. 그래서 결국 모두가 자기처럼 생각한다고 여기게 된다는 흐름으로 마무리됩니다.","hl":"mn"},{"n":47,"text":"첫 번째, know 뒤에 접속사 that이 생략된 목적어절이 와서 someone이 바로 이어지는 구조예요. 두 번째, needs to see는 need가 타동사로 쓰여 to부정사를 목적어로 받은 형태입니다. 세 번째, to know는 '알기 위해서'라는 목적을 나타내는 부사적 용법이에요. 네 번째, what is in there는 의문사 뒤에 주어와 동사가 그대로 오는 간접의문문이고, 이 절 전체가 know의 목적어 역할을 한다는 점까지 정리해 둡시다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서 그들은 생각한다\u003c/span>\u003cspan class=\"en\">So, \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">think\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모두가 이해한다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">everyone \u003c/span>\u003cspan class=\"tgt\">thinks\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">같은 방식으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">same \u003c/span>\u003cspan class=\"tgt\">way\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 그렇게 하는 것과 같이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">do\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그래서 그들은 모두가 그들과 같은 방식으로 이해한다고 생각한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 네 살 미만 아이들이 다른 사람의 관점을 이해하지 못해, 자신이 아는 것을 다른 사람도 똑같이 \u003cb class=\"key\">생각\u003c/b>한다고 여긴다는 내용입니다. 앞 문장에서 엄마가 연필을 보지 못했음을 모른다고 했으므로, 여기서는 타인의 관점을 헤아리는 \u003cb class=\"key\">조망 \u003c/b>\u003cb class=\"key\">수용\u003c/b>의 실패를 정리합니다. 'the same way as they do'는 그들이 그렇게 하는 것과 \u003cb class=\"key\">같은 \u003c/b>\u003cb class=\"key\">방식\u003c/b>으로라는 뜻입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that의 생략 (목적어절)\u003c/span> : think + [(that) + 주어 + 동사] : \"그들은 생각한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">everyone의 단수 취급\u003c/span> : everyone + [단수동사] : \"모두가 생각한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">the same + 명사 비교 표현\u003c/span> : the same [명사] + as + [주어 + 동사] : \"같은 방식\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">대동사 do\u003c/span> : as + [주어] + do/does/did : \"그들이 그렇게 하는 것과 같이\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"So, they think, 그래서 그들은 생각한다. everyone thinks, 모두가 이해한다고. the same way, 같은 방식으로. as they do, 그들이 그렇게 하는 것과 같이. 이 문장 전체를 해석하면, 그래서 그들은 모두가 그들과 같은 방식으로 이해한다고 생각한다.","hl":"m"},{"n":49,"text":"이 문장은 네 살 미만 아이들이 다른 사람의 관점을 이해하지 못해서 자신이 아는 것을 다른 사람도 똑같이 생각한다고 여긴다는 내용이에요. 앞에서 엄마가 연필을 보지 못했다는 사실을 모른다고 했죠. 그래서 여기서는 타인의 관점을 헤아리는 조망 수용의 실패를 정리하는 것이고, the same way as they do는 그들이 그렇게 하는 것과 같은 방식으로라는 뜻이에요.","hl":"mn"},{"n":50,"text":"첫 번째로 they think에서 think 뒤에는 everyone thinks라는 완전한 절이 목적어로 이어지고, 이때 접속사 that은 생략되는 거예요. 두 번째로 everyone thinks에서 everyone은 의미상 여럿이지만 문법적으로는 단수로 보아 동사를 단수형으로 맞춰요. 세 번째로 the same way는 뒤의 as 이하와 비교해서 같은 방식이라는 뜻을 만들어요. 네 번째로 as they do에서 do는 앞의 think를 반복하지 않으려고 쓴 대동사예요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>네 살이 되면 아이는 다른 사람의 \u003cb class=\"key\">생각\u003c/b>을 이해하기 시작한다.\u003c/li>\u003cli>껌 통 실험에서 네 살 아이는 엄마가 \u003cb class=\"key\">연필\u003c/b>을 보지 못했음을 알고 엄마의 생각을 다르게 추론한다.\u003c/li>\u003cli>네 살 미만 아이는 엄마도 자신과 \u003cb class=\"key\">같은 \u003c/b>\u003cb class=\"key\">방식\u003c/b>으로 생각한다고 여겨 연필이라고 답한다.\u003c/li>\u003cli>결국 이 글은 상대의 관점을 구분하는 \u003cb class=\"key\">조망 \u003c/b>\u003cb class=\"key\">수용\u003c/b> 능력을 보여 준다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Children begin to understand other people's thinking around age four, while younger children assume everyone thinks the same way as they do.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">네 살 아이는 엄마가 연필을 보지 못했음을 알아 엄마의 \u003cb class=\"key\">생각\u003c/b>을 다르게 추론하지만, 네 살 미만 아이는 엄마도 자신과 \u003cb class=\"key\">같은 \u003c/b>\u003cb class=\"key\">방식\u003c/b>으로 생각한다고 여긴다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":51,"text":"오늘 글의 핵심을 다시 정리해 볼게요. 네 살 아이는 다른 사람의 생각을 이해하기 시작하고, 껌 통 실험에서 엄마가 연필을 보지 못했음을 압니다. 반면 네 살 미만 아이는 엄마도 자신과 같은 방식으로 연필을 안다고 착각하죠. 결국 중요한 것은 조망 수용 능력이라는 점, 꼭 기억하며 마무리할게요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
