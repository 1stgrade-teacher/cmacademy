<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터1 Reading 09 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터1 Reading 09","audioDir":"09_audio","preview":false,"count":55,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.668em\">Reading\u003cbr>09\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터1\u003c/div>\u003ch1>Teaching Others Helps Me Learn More\u003c/h1>\u003ch2>남을 가르치면 내가 더 배운다\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>과학 수업의 \u003cb class=\"key\">또래 \u003c/b>\u003cb class=\"key\">지도\u003c/b> 프로젝트에서 학생은 친구를 가르치며 처음에는 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">낭비\u003c/b>라고 생각했지만, 가르치는 과정이 자료 이해와 성적 향상에 도움이 되어 결국 \u003cb class=\"key\">배움\u003c/b>을 더 많이 얻었다는 것을 깨달았다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Teaching others can help us understand the material better and learn more ourselves.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 과학 수업에서 있었던 tutor tutee project 이야기를 함께 읽어 볼게요. 이 글은 학생이 친구를 가르치면서 처음에는 시간 낭비라고 생각했지만, 결국 또래 지도가 자신의 배움에 도움이 되었다는 내용이에요. 요지는 가르치는 일이 다른 사람을 도울 뿐 아니라 나의 배움도 키운다는 것이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">또래 지도, 즉 \u003cb class=\"key\">peer \u003c/b>\u003cb class=\"key\">teaching\u003c/b>은 비슷한 나이의 친구가 서로 가르치고 배우는 활동입니다. 가르치는 사람은 tutor, 배우는 사람은 tutee라고 부릅니다. 누군가에게 설명하려면 내용을 다시 꺼내 정리해야 하므로 \u003cb class=\"key\">retrieval \u003c/b>\u003cb class=\"key\">practice\u003c/b>, 즉 인출 연습 효과가 생깁니다. 친구에게 수학 문제를 설명하다가 내가 몰랐던 부분을 발견하는 일상 경험과 비슷합니다. 또한 자신이 무엇을 알고 모르는지 점검하는 \u003cb class=\"key\">metacognition\u003c/b>을 높여 줍니다. 그래서 가르치는 경험은 배우는 사람뿐 아니라 가르치는 사람에게도 \u003cb class=\"key\">학습 \u003c/b>\u003cb class=\"key\">성장\u003c/b>을 가져올 수 있습니다.\u003c/div>","segs":[{"n":2,"text":"먼저 peer teaching, 즉 또래 지도라는 개념을 알아 볼게요. 또래 지도는 비슷한 나이의 친구가 서로 가르치고 배우는 활동이에요. 가르치는 사람은 tutor, 배우는 사람은 tutee라고 불러요. 설명하려면 내용을 다시 정리해야 하므로 retrieval practice, 즉 인출 연습 효과가 생겨요. 이 과정은 metacognition, 즉 자신이 무엇을 알고 모르는지 점검하는 능력을 높여 줘요. 그래서 가르치는 경험은 배우는 사람과 가르치는 사람 모두의 학습 성장에 도움이 될 수 있어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>프로젝트 도입\u003csmall>도입 · 문장 1–4\u003c/small>\u003c/h4>\u003cp>지난달 과학 수업에서 \u003cb class=\"key\">tutor-tutee \u003c/b>\u003cb class=\"key\">project\u003c/b>가 시작되었고, 그것은 일종의 \u003cb class=\"key\">peer \u003c/b>\u003cb class=\"key\">teaching\u003c/b>이었다. 과학 선생님은 이 프로젝트가 배우는 사람들에게 \u003cb class=\"key\">도움\u003c/b>이 될 뿐 아니라 가르치는 사람들에게도 좋을 것이라고 말씀하셨다. 이 말은 프로젝트의 목적과 기대 효과를 제시하는 도입이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>학생 교사 지원\u003csmall>예시 · 문장 5–8\u003c/small>\u003c/h4>\u003cp>나는 과학을 제일 좋아했고 과학을 잘해서 \u003cb class=\"key\">학생 \u003c/b>\u003cb class=\"key\">교사\u003c/b>로 \u003cb class=\"key\">자원\u003c/b>했다. 나는 과학을 잘 못하는 친구를 가르쳤다. 이 부분은 내가 실제로 또래 지도를 수행한 예시이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>처음의 의심\u003csmall>통념 · 문장 9–10\u003c/small>\u003c/h4>\u003cp>처음에 나는 배우는 사람과 너무 많은 시간을 보내고 있다고 생각했다. 또한 그것이 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">낭비\u003c/b>라는 \u003cb class=\"key\">의심\u003c/b>도 들었다. 이는 가르치는 일을 부정적으로 바라보는 통념에 해당한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>생각의 전환\u003csmall>전환 · 문장 11–12\u003c/small>\u003c/h4>\u003cp>그러나 나중에 나는 내가 틀렸다는 것을 알았다. 가르치는 사람으로서 나는 \u003cb class=\"key\">자료 \u003c/b>\u003cb class=\"key\">이해\u003c/b>가 더 깊어지고 내용이 더 명확해지는 \u003cb class=\"key\">전환\u003c/b>을 경험했다. 여기서 글의 분위기와 생각이 긍정적으로 바뀐다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>성장과 결론\u003csmall>결론 · 문장 13–14\u003c/small>\u003c/h4>\u003cp>프로젝트 덕분에 나는 기말시험에서 \u003cb class=\"key\">성적 \u003c/b>\u003cb class=\"key\">향상\u003c/b>을 이루었다. 그리고 다른 사람을 가르치면서 더 많은 \u003cb class=\"key\">배움\u003c/b>을 얻을 수 있다는 것을 깨달았다. 이는 글 전체의 결론이자 주제이다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 다섯 단계로 나누어 살펴볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 프로젝트 도입이에요. 지난달 과학 수업에서 tutor tutee project가 시작되었고, 이것은 일종의 peer teaching, 즉 또래 지도였어요. 선생님은 이 프로젝트가 배우는 사람들에게 도움이 될 뿐 아니라 가르치는 사람들에게도 좋을 것이라고 말씀하셨어요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 학생이 직접 가르치는 사람으로 나선 부분이에요. 나는 과학을 제일 좋아하고 과학을 잘해서 학생 교사로 자원했어요. 그리고 과학을 잘 못하는 친구를 가르쳤어요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 처음의 부정적인 생각이에요. 처음에 나는 배우는 사람과 너무 많은 시간을 보내고 있다고 생각했어요. 그래서 이것이 시간 낭비라는 의심도 들었어요.","hl":"f2"},{"n":7,"text":"네 번째 단계는 생각의 전환이에요. 그러나 나중에 나는 내가 틀렸다는 것을 알았어요. 가르치는 사람으로서 나는 자료 이해가 더 깊어지고 내용이 더 명확해지는 경험을 했어요.","hl":"f3"},{"n":8,"text":"다섯 번째 단계는 결과와 결론이에요. 프로젝트 덕분에 나는 기말시험에서 성적 향상을 이루었어요. 그리고 가르치는 일이 자신의 배움을 키운다는 것을 깨달았어요.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">통념-반박\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 14번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 처음의 부정적 생각을 뒤에서 바로잡는 \u003cb class=\"key\">통념과 \u003c/b>\u003cb class=\"key\">반박\u003c/b>의 전개 방식입니다. 시간 낭비라는 생각을 먼저 제시한 뒤 But과 later를 통해 그것이 틀렸음을 보여 주죠. 주제는 마지막 문장에서 드러나므로 \u003cb class=\"key\">미괄식\u003c/b> 구조이며, 핵심 \u003cb class=\"key\">주제문\u003c/b>은 열네 번째 문장입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>At first (9)\u003c/b>\u003cspan>처음 생각 제시\u003c/span>\u003cb>also (10)\u003c/b>\u003cspan>부정적 생각 추가\u003c/span>\u003cb>But (11)\u003c/b>\u003cspan>생각의 전환\u003c/span>\u003cb>later (11)\u003c/b>\u003cspan>시간적 전환\u003c/span>\u003cb>thanks to (13)\u003c/b>\u003cspan>긍정적 결과의 원인\u003c/span>\u003cb>realized (14)\u003c/b>\u003cspan>깨달음·결론\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">tutor-tutee project\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">peer teaching\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">student teacher\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">tutor\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">teaching others\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>처음 생각\u003c/th>\u003cth>나중 깨달음\u003c/th>\u003c/tr>\u003ctr>\u003ctd>시간을 너무 많이 쓰고 시간 낭비라고 봄\u003c/td>\u003ctd>자료를 더 잘 이해하고 성적이 오름\u003c/td>\u003c/tr>\u003ctr>\u003ctd>부정적 의심\u003c/td>\u003ctd>긍정적 성장\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글은 통념과 반박의 구조예요. 처음에는 시간 낭비라는 통념을 제시하고, 나중에 그것이 틀렸다고 반박하면서 주제를 드러내죠. 그래서 글의 주제문은 마지막 문장에 나오는 미괄식 구조예요. 결론을 끝까지 읽어야 주제가 보이는 글입니다.","hl":"ty"},{"n":10,"text":"신호어를 보면 At first는 처음 생각을, But과 later는 생각의 전환을 알려 줘요. realize는 깨달음을, thanks to는 성적이 오른 이유를 연결하죠. 또 tutor tutee project가 peer teaching, student teacher, teaching others로 이어지는 재진술도 눈여겨보세요. 시간 낭비라는 처음 생각과 배움이라는 나중 깨달음이 대조를 이루면서 주제를 분명하게 해 줍니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>start\u003c/b>\u003cem>동사\u003c/em>\u003cspan>시작하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>tutor-tutee project\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>또래 교사-학습자 프로젝트\u003c/span>\u003c/div>\u003cdiv>\u003cb>science\u003c/b>\u003cem>명사\u003c/em>\u003cspan>과학\u003c/span>\u003c/div>\u003cdiv>\u003cb>class\u003c/b>\u003cem>명사\u003c/em>\u003cspan>수업\u003c/span>\u003c/div>\u003cdiv>\u003cb>last month\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>지난달\u003c/span>\u003c/div>\u003cdiv>\u003cb>peer teaching\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>또래 지도\u003c/span>\u003c/div>\u003cdiv>\u003cb>helpful\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>도움이 되는\u003c/span>\u003c/div>\u003cdiv>\u003cb>tutee\u003c/b>\u003cem>명사\u003c/em>\u003cspan>배우는 사람\u003c/span>\u003c/div>\u003cdiv>\u003cb>tutor\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가르치는 사람\u003c/span>\u003c/div>\u003cdiv>\u003cb>volunteer\u003c/b>\u003cem>동사\u003c/em>\u003cspan>자원하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>student teacher\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>학생 교사\u003c/span>\u003c/div>\u003cdiv>\u003cb>teach\u003c/b>\u003cem>동사\u003c/em>\u003cspan>가르치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>be poor at\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 잘 못하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>at first\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>처음에\u003c/span>\u003c/div>\u003cdiv>\u003cb>spend time with\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~와 시간을 보내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>waste of time\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>시간 낭비\u003c/span>\u003c/div>\u003cdiv>\u003cb>later\u003c/b>\u003cem>부사\u003c/em>\u003cspan>나중에\u003c/span>\u003c/div>\u003cdiv>\u003cb>find out\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>알아내다, 알게 되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>wrong\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>틀린\u003c/span>\u003c/div>\u003cdiv>\u003cb>as\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~로서\u003c/span>\u003c/div>\u003cdiv>\u003cb>understand\u003c/b>\u003cem>동사\u003c/em>\u003cspan>이해하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>material\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자료, 교재\u003c/span>\u003c/div>\u003cdiv>\u003cb>better\u003c/b>\u003cem>부사\u003c/em>\u003cspan>더 잘\u003c/span>\u003c/div>\u003cdiv>\u003cb>clearly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>명확하게\u003c/span>\u003c/div>\u003cdiv>\u003cb>grade\u003c/b>\u003cem>명사\u003c/em>\u003cspan>성적, 점수\u003c/span>\u003c/div>\u003cdiv>\u003cb>final exam\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>기말시험\u003c/span>\u003c/div>\u003cdiv>\u003cb>thanks to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~ 덕분에\u003c/span>\u003c/div>\u003cdiv>\u003cb>realize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>깨닫다\u003c/span>\u003c/div>\u003cdiv>\u003cb>learn\u003c/b>\u003cem>동사\u003c/em>\u003cspan>배우다\u003c/span>\u003c/div>\u003cdiv>\u003cb>by\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~함으로써\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"핵심 단어로는 be poor at, 즉 잘 못하다는 표현과 waste of time, 즉 시간 낭비를 꼭 기억해요. volunteer는 자원하다, realize는 깨닫다, thanks to는 덕분에라는 뜻이에요. as a tutor는 가르치는 사람으로서라는 뜻으로 해석하면 자연스러워요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">helpful\u003c/b>\u003cspan class=\"m\">도움이 되는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">beneficial\u003c/span>\u003cspan class=\"s\">useful\u003c/span>\u003cspan class=\"s\">advantageous\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">harmful\u003c/span>\u003cspan class=\"a\">useless\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">volunteer\u003c/b>\u003cspan class=\"m\">자원하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">offer\u003c/span>\u003cspan class=\"s\">sign up\u003c/span>\u003cspan class=\"s\">step forward\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">refuse\u003c/span>\u003cspan class=\"a\">decline\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">be poor at\u003c/b>\u003cspan class=\"m\">~을 잘 못하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">be weak in\u003c/span>\u003cspan class=\"s\">be bad at\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">be good at\u003c/span>\u003cspan class=\"a\">be skilled at\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">waste of time\u003c/b>\u003cspan class=\"m\">시간 낭비\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">misuse of time\u003c/span>\u003cspan class=\"s\">useless use of time\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">productive use of time\u003c/span>\u003cspan class=\"a\">valuable time\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">understand\u003c/b>\u003cspan class=\"m\">이해하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">comprehend\u003c/span>\u003cspan class=\"s\">grasp\u003c/span>\u003cspan class=\"s\">follow\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">misunderstand\u003c/span>\u003cspan class=\"a\">confuse\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">clearly\u003c/b>\u003cspan class=\"m\">명확하게\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">distinctly\u003c/span>\u003cspan class=\"s\">plainly\u003c/span>\u003cspan class=\"s\">obviously\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">vaguely\u003c/span>\u003cspan class=\"a\">unclearly\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">realize\u003c/b>\u003cspan class=\"m\">깨닫다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">recognize\u003c/span>\u003cspan class=\"s\">become aware\u003c/span>\u003cspan class=\"s\">understand\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003cspan class=\"a\">overlook\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어도 함께 정리해 볼게요. helpful은 beneficial, useful과 가깝고 harmful, useless와 반대예요. volunteer는 offer, sign up과 비슷하고 refuse, decline과 반대죠. understand는 comprehend, grasp와 가깝고 misunderstand, confuse와 반대예요. realize는 recognize, become aware와 비슷하고 ignore, overlook와 반대라는 점도 기억해요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 시작했다\u003c/span>\u003cspan class=\"en\">We \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">started \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새로운 tutor-tutee 프로젝트를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">new \u003c/span>\u003cspan class=\"tgt\">tutor-tutee \u003c/span>\u003cspan class=\"tgt\">project\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">과학 수업 시간에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">science \u003c/span>\u003cspan class=\"tgt\">class \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지난달.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">last \u003c/span>\u003cspan class=\"tgt\">month\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 지난달 과학 수업 시간에 새로운 tutor-tutee 프로젝트를 시작했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글의 출발점이 되는 문장으로, 과학 시간에 \u003cb class=\"key\">tutor-tutee \u003c/b>\u003cb class=\"key\">프로젝트\u003c/b>를 시작했다는 사실을 먼저 제시합니다. 여기서 tutor는 가르치는 사람, tutee는 배우는 사람을 뜻하며, 뒤에 이어질 \u003cb class=\"key\">또래 \u003c/b>\u003cb class=\"key\">지도\u003c/b> 상황을 자연스럽게 예고합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">3형식 문장(타동사+목적어)\u003c/span> : 주어 + [타동사 start] + [목적어 a new tutor-tutee project] : \"새로운 tutor-tutee 프로젝트를 시작했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소·시간 부사구의 어순\u003c/span> : [장소 전치사구 in science class] + [시간 부사구 last month] : \"과학 수업 시간에 지난달에\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"We started, 우리는 시작했다. a new tutor-tutee project, 새로운 tutor-tutee 프로젝트를. in science class, 과학 수업 시간에. last month, 지난달.. 이 문장 전체를 해석하면, 우리는 지난달 과학 수업 시간에 새로운 tutor-tutee 프로젝트를 시작했다.","hl":"m"},{"n":14,"text":"이 문장은 글의 시작을 알리는 문장이에요. 과학 시간에 tutor-tutee 프로젝트를 시작했다는 사실을 먼저 던져 주죠. 여기서 tutor는 가르치는 사람, tutee는 배우는 사람이라는 또래 지도 상황이 뒤에서 이어진다는 걸 잡아 주시면 됩니다.","hl":"mn"},{"n":15,"text":"어법 포인트 첫 번째, started는 타동사라서 뒤에 목적어가 꼭 필요해요. 두 번째, in science class last month처럼 장소를 먼저, 시간을 나중에 놓는 게 영어의 부사구 순서예요. 시험에서는 이 어순을 뒤집어서 틀린 문장을 만들곤 하니까 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 ~이었다\u003c/span>\u003cspan class=\"en\">It was\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일종의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">kind \u003c/span>\u003cspan class=\"tgt\">of\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또래 지도였다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">peer \u003c/span>\u003cspan class=\"tgt\">teaching\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 일종의 또래 지도였다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 말한 프로젝트가 무엇인지 개념을 정리해 주는 문장입니다. It은 \u003cb class=\"key\">프로젝트\u003c/b>를 가리키고, \u003cb class=\"key\">또래 \u003c/b>\u003cb class=\"key\">지도\u003c/b>라는 말로 독자가 이해하기 쉽게 풀어 줍니다. 어려운 제도를 한 줄의 \u003cb class=\"key\">부연 \u003c/b>\u003cb class=\"key\">설명\u003c/b>으로 정리한 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관용 표현 a kind of + 단수명사\u003c/span> : a kind of + [단수명사] : \"일종의 ~\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">복합명사(명사+동명사)\u003c/span> : [명사 peer] + [동명사 teaching] : \"또래 지도\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"It was, 그것은 ~이었다. a kind of, 일종의. peer teaching, 또래 지도였다.. 이 문장 전체를 해석하면, 그것은 일종의 또래 지도였다.","hl":"m"},{"n":17,"text":"두 번째 문장은 앞에서 말한 프로젝트가 무엇인지 설명해 주는 문장이에요. It은 프로젝트를 가리키고, 또래 지도라는 말로 개념을 딱 정리해 주죠. 어려운 용어를 독자 눈높이에서 풀어 주는 부연 설명이라고 보시면 됩니다.","hl":"mn"},{"n":18,"text":"어법 포인트 첫 번째, a kind of는 '일종의'라는 관용 표현이고 뒤에는 보통 단수명사가 와요. 두 번째, peer teaching은 동명사 teaching이 명사처럼 쓰인 복합명사예요. 앞의 peer가 뒤의 teaching을 수식하는 구조라는 점도 같이 기억해 주세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나의 과학 선생님은 말했다,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">My \u003c/span>\u003cspan class=\"tgt\">science \u003c/span>\u003cspan class=\"tgt\">teacher \u003c/span>\u003cspan class=\"tgt\">said,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“이 프로젝트는\u003c/span>\u003cspan class=\"en\">&quot;This project\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">도움이 될 거예요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">helpful \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">배우는 사람들에게.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">tutees\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">과학 선생님은 “이 프로젝트는 배우는 사람들에게 도움이 될 거예요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 선생님의 말을 그대로 옮긴 인용문으로, 프로젝트의 첫 번째 효용을 밝히는 부분입니다. 먼저 \u003cb class=\"key\">배우는 \u003c/b>\u003cb class=\"key\">사람\u003c/b>에게 도움이 된다고 말하고, 이어지는 문장에서 \u003cb class=\"key\">가르치는 \u003c/b>\u003cb class=\"key\">사람\u003c/b>에게도 좋다고 덧붙입니다. 즉 \u003cb class=\"key\">프로젝트의 \u003c/b>\u003cb class=\"key\">의의\u003c/b>를 제시하는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">직접화법\u003c/span> : say + , + &quot;인용문&quot; : \"과학 선생님은 말했다,\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 will + be동사 / 전치사 for\u003c/span> : will + [동사원형 be] + [형용사 helpful] + for + [대상] : \"배우는 사람들에게 도움이 될 것이다\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"My science teacher said, 나의 과학 선생님은 말했다. \"This project, “이 프로젝트는. will be helpful, 도움이 될 거예요. for the tutees, 배우는 사람들에게.. 이 문장 전체를 해석하면, 과학 선생님은 “이 프로젝트는 배우는 사람들에게 도움이 될 거예요.","hl":"m"},{"n":20,"text":"세 번째 문장은 선생님의 말을 직접 인용한 부분이에요. 프로젝트가 배우는 사람들에게 도움이 된다는 점을 먼저 말하고, 바로 다음 문장에서 가르치는 사람에게도 좋다고 덧붙이죠. 그래서 이 인용문은 프로젝트의 의의를 밝혀 주는 역할을 합니다.","hl":"mn"},{"n":21,"text":"어법 포인트 첫 번째, 따옴표 안에 말을 그대로 넣은 직접화법이라 인용문 안의 시제가 will로 그대로 살아 있어요. 두 번째, will 뒤에는 동사원형 be가 와서 will be helpful이 된 거예요. 세 번째, be helpful for는 '~에게 도움이 되다'라는 관용 표현이고 for 뒤에는 도움을 받는 대상이 옵니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은\u003c/span>\u003cspan class=\"en\">It\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또한 좋을 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">also \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">good \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가르치는 사람들에게도!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">tutors\u003c/span>!&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">또한 가르치는 사람들에게도 좋을 거예요!”라고 말씀하셨다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 선생님이 하신 말씀 중 두 번째 이유로, 이 프로젝트가 \u003cb class=\"key\">가르치는 \u003c/b>\u003cb class=\"key\">사람\u003c/b>에게도 이득이 된다는 내용이에요. \u003cb class=\"key\">also\u003c/b>가 앞의 'tutees에게 좋다'는 말에 하나를 더 얹어 주고 있죠. \u003cb class=\"key\">be \u003c/b>\u003cb class=\"key\">good \u003c/b>\u003cb class=\"key\">for\u003c/b>는 '~에게 좋다'라는 뜻으로, for 뒤에 좋아지는 대상이 온다는 점을 기억하세요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 will + 동사원형(be)\u003c/span> : [주어] + will + [동사원형] : \"또한 좋을 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 for (~에게 좋은)\u003c/span> : be good [for + 대상] : \"가르치는 사람들에게 좋은\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"It, 그것은. will also be good, 또한 좋을 것이다. for the tutors!, 가르치는 사람들에게도!. 이 문장 전체를 해석하면, 또한 가르치는 사람들에게도 좋을 거예요!”라고 말씀하셨다.","hl":"m"},{"n":23,"text":"이 문장은 선생님이 하신 말씀의 두 번째 이유예요. 튜터, 그러니까 가르치는 사람에게도 이 프로젝트가 이득이 된다는 뜻이죠. also가 붙어서 앞의 내용에 하나를 더 추가하고 있고, be good for는 ~에게 좋다는 뜻으로 기억해 두면 좋아요.","hl":"mn"},{"n":24,"text":"어법은 두 가지만 짚을게요. 첫 번째, will 뒤에는 반드시 동사원형이 와요. 그래서 be동사 원형인 be가 그대로 쓰였고, 미래나 추측의 느낌을 더해 줍니다. 두 번째, good for는 ~에게 이롭다는 뜻이라서 for 뒤에 이득을 보는 대상이 와요. to가 아니라 for라는 점, 시험에 자주 나오니까 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는\u003c/span>\u003cspan class=\"en\">I\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">과학을 좋아했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">liked \u003c/span>\u003cspan class=\"tgt\">science \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가장.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">best\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 과학을 제일 좋아했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 왜 학생 교사로 나섰는지 그 배경을 까는 문장이에요. 여러 과목 가운데 과학을 가장 좋아했다는 뜻이죠. 이 '좋아함'이 바로 다음 문장의 \u003cb class=\"key\">자원\u003c/b>으로 자연스럽게 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">최상급 부사 best (like + 목적어 + best)\u003c/span> : like + [목적어] + [best] : \"과학을 가장 좋아했다\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"I, 나는. liked science, 과학을 좋아했다. best, 가장.. 이 문장 전체를 해석하면, 나는 과학을 제일 좋아했다.","hl":"m"},{"n":26,"text":"이 문장은 왜 자원했는지 그 배경을 설명해 줘요. 여러 과목 중에서 과학을 가장 좋아했다는 뜻이죠. 이 좋아함이 바로 다음 문장의 자원으로 이어지니까 흐름을 함께 봐 두세요.","hl":"mn"},{"n":27,"text":"여기서 짚을 어법은 최상급 부사 best예요. like science best라고 하면 과학을 가장 좋아한다는 뜻이 되고, 목적어 뒤에 best만 붙이면 되니까 the best를 쓰지 않는다는 점을 기억하세요. 또 글 전체가 과거 이야기라서 like가 liked로 바뀐 것도 함께 봐 두면 좋아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 과학을 잘했다,\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">good \u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">science\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서 나는 자원했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">so \u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">volunteered\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">학생 교사로.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">student \u003c/span>\u003cspan class=\"tgt\">teacher\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 과학을 잘해서 학생 교사로 자원했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 '과학을 가장 좋아함'에 '과학을 잘함'이라는 \u003cb class=\"key\">이유\u003c/b>까지 더해져서 \u003cb class=\"key\">자원\u003c/b>하게 된 배경을 보여 주는 문장이에요. 이 선택이 뒤에 나오는 '가르치며 더 배웠다'는 깨달음의 출발점이 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be good at + 명사 (~을 잘하다)\u003c/span> : be good [at + 명사] : \"과학을 잘했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 so (인과관계)\u003c/span> : [원인], so + [결과] : \"그래서 나는 자원했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 as (~로서)\u003c/span> : volunteer [as + 신분·역할] : \"학생 교사로서\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"I was good at science, 나는 과학을 잘했다. so I volunteered, 그래서 나는 자원했다. as a student teacher, 학생 교사로.. 이 문장 전체를 해석하면, 나는 과학을 잘해서 학생 교사로 자원했다.","hl":"m"},{"n":29,"text":"앞 문장에서 과학을 가장 좋아한다고 했죠. 여기에 과학을 잘한다는 이유까지 더해져서 자원하게 된 배경을 보여 주는 문장이에요. 이 선택이 뒤에 나오는 깨달음의 출발점이 된다는 흐름도 함께 기억해 두세요.","hl":"mn"},{"n":30,"text":"어법은 세 가지예요. 첫 번째, be good at은 특정 분야를 잘한다는 뜻이라서 at 뒤에 그 분야가 옵니다. 두 번째, so는 앞의 내용이 원인, 뒤의 내용이 결과가 되게 이어 주는 접속사예요. 세 번째, as는 자격이나 역할을 나타내서 volunteer as라고 하면 학생 교사로서 자원하다는 뜻이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는\u003c/span>\u003cspan class=\"en\">I\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가르쳤다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">taught \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내 친구를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">my \u003c/span>\u003cspan class=\"tgt\">friend\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 친구를 가르쳤다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 내가 친구를 가르쳤다는 사실을 알려 주는 문장이에요. 앞에서 \u003cb class=\"key\">student \u003c/b>\u003cb class=\"key\">teacher\u003c/b>로 자원한 내가 실제로 \u003cb class=\"key\">가르치는 \u003c/b>\u003cb class=\"key\">역할\u003c/b>을 시작했다는 흐름을 이어 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">3형식 문장(타동사 + 목적어)\u003c/span> : [주어 I] + taught [타동사] + [my friend (목적어)] : \"내 친구를 가르쳤다\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"I, 나는. taught, 가르쳤다. my friend, 내 친구를. 이 문장 전체를 해석하면, 나는 친구를 가르쳤다.","hl":"m"},{"n":32,"text":"이 문장은 내가 친구를 가르쳤다는 사실을 알려 줘요. 앞에서 student teacher로 자원한 내가 실제로 가르치는 역할을 시작했다는 흐름을 이어 주는 문장이에요.","hl":"mn"},{"n":33,"text":"먼저 동사 taught를 봐요. teach는 가르치다라는 뜻의 타동사라서 뒤에 목적어가 꼭 필요해요. 그래서 taught 다음에 my friend가 목적어로 온 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 애는\u003c/span>\u003cspan class=\"en\">He\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">잘 못했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">poor \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">과학을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">science\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 애는 과학을 잘 못했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 가르침을 받는 친구의 \u003cb class=\"key\">과학 \u003c/b>\u003cb class=\"key\">실력\u003c/b>이 좋지 않았다는 것을 보여 줘요. 그래서 내가 그 친구를 가르치게 된 \u003cb class=\"key\">배경\u003c/b>이 되는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">2형식 문장(be동사 + 주격보어)\u003c/span> : [주어 He] + was [be동사] + [poor (주격보어)] + at + [science] : \"과학을 잘 못했다, 과학에 약했다\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"He, 그 애는. was poor, 잘 못했다. at science, 과학을. 이 문장 전체를 해석하면, 그 애는 과학을 잘 못했다.","hl":"m"},{"n":35,"text":"이 문장은 가르침을 받는 친구의 과학 실력이 좋지 않았다는 걸 보여 줘요. 그래서 내가 그 친구를 가르치게 된 배경이 되는 문장이에요.","hl":"mn"},{"n":36,"text":"be동사 was 뒤에 형용사 poor가 와서 주어 He의 상태를 설명하고 있어요. 이렇게 be동사 뒤에서 주어를 설명하는 형용사를 주격보어라고 해요. 그리고 poor at은 ~에 약하다는 뜻의 관용표현이니까 통째로 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">처음에\u003c/span>\u003cspan class=\"en\">At first,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 생각했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">thought\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내가 보내고 있다고\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">spending\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">너무 많은 시간을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">too \u003c/span>\u003cspan class=\"tgt\">much \u003c/span>\u003cspan class=\"tgt\">time\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">배우는 사람과\u003c/span>\u003cspan class=\"en\">with the tutee.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">처음에 나는 배우는 사람과 너무 많은 시간을 보내고 있다고 생각했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 프로젝트 초반에 내가 가졌던 \u003cb class=\"key\">부정적인 \u003c/b>\u003cb class=\"key\">생각\u003c/b>을 보여 주는 문장이에요. 뒤에 나오는 But later, I found out I was wrong과 \u003cb class=\"key\">대조\u003c/b>를 이루면서 내 생각이 바뀌는 흐름의 출발점이 돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that의 생략(목적어절)\u003c/span> : [주어 I] + thought + [(that) + 주어 + 동사 ~ (목적어절)] : \"나는 ~라고 생각했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거진행형(was + -ing)\u003c/span> : [주어] + was + [동사-ing] : \"보내고 있었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">불가산명사의 수량 표현(much)\u003c/span> : too much + [불가산명사] : \"너무 많은 시간\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"At first, 처음에. I thought, 나는 생각했다. I was spending, 내가 보내고 있다고. too much time, 너무 많은 시간을. with the tutee, 배우는 사람과. 이 문장 전체를 해석하면, 처음에 나는 배우는 사람과 너무 많은 시간을 보내고 있다고 생각했다.","hl":"m"},{"n":38,"text":"이 문장은 프로젝트 초반에 내가 가졌던 부정적인 생각을 보여 줘요. 뒤에 나오는 But later, I found out I was wrong과 대조를 이루는 부분이라서 앞뒤 흐름을 함께 잡는 게 중요해요.","hl":"mn"},{"n":39,"text":"먼저 I thought 뒤에는 접속사 that이 생략된 목적어절이 이어지고 있어요. 생각의 내용이 통째로 목적어가 되는 구조라서 that이 생략되는 경우가 많아요. 다음으로 was spending은 과거진행형이에요. 과거의 어느 시점에 그 동작이 진행 중이었다는 걸 보여 주죠. 마지막으로 too much time에서 time은 셀 수 없는 불가산명사라서 many가 아니라 much를 써요. too much는 너무 많다는 뜻이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 또한 생각했다\u003c/span>\u003cspan class=\"en\">I also \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">thought \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 ~라고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시간 낭비라고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">waste \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">time\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">시간 낭비라는 생각도 들었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 시간을 너무 많이 쓰고 있다고 느낀 화자가 그 시간을 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">낭비\u003c/b>라고 본 장면이에요. also는 앞의 부정적 느낌에 \u003cb class=\"key\">부정적 \u003c/b>\u003cb class=\"key\">생각\u003c/b>을 하나 더 보태는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">think + 목적어절(that 생략)\u003c/span> : think + [(that) + 주어 + 동사 ~] (목적어절) : \"그것이 시간 낭비라고 생각했다\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"I also thought, 나는 또한 생각했다. it was, 그것이 ~라고. a waste of time, 시간 낭비라고. 이 문장 전체를 해석하면, 시간 낭비라는 생각도 들었다.","hl":"m"},{"n":41,"text":"이 문장은 시간을 너무 많이 쓰고 있다고 느낀 화자가 그 시간을 시간 낭비라고 본 장면이에요. also는 앞의 부정적 생각에 부정적 생각을 하나 더 보태는 역할을 하죠.","hl":"mn"},{"n":42,"text":"여기서는 thought 뒤에 that이 생략된 목적어절이 와요. 그래서 thought it was a waste of time 전체가 생각한 내용을 이루는 목적어절이 되는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 나중에,\u003c/span>\u003cspan class=\"en\">But later,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 알게 되었다\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">found \u003c/span>\u003cspan class=\"tgt\">out \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내가 틀렸다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">wrong\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 나중에 나는 내가 틀렸다는 것을 알았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞의 부정적 생각을 \u003cb class=\"key\">반전\u003c/b>시키는 문장으로, 나중에 화자가 자신의 판단이 \u003cb class=\"key\">틀렸다\u003c/b>는 것을 깨달았음을 보여 줘요. found out은 단순히 알았다보다 알아내다, 깨닫다의 느낌을 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">find out + 목적어절(that 생략)\u003c/span> : find out + [(that) + 주어 + 동사 ~] (목적어절) : \"내가 틀렸다는 것을 알았다\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"But later, 그러나 나중에. I found out, 나는 알게 되었다. I was wrong, 내가 틀렸다는 것을. 이 문장 전체를 해석하면, 그러나 나중에 나는 내가 틀렸다는 것을 알았다.","hl":"m"},{"n":44,"text":"이 문장은 앞의 부정적 생각을 반전시키는 역할을 해요. 나중에 화자가 자신의 판단이 틀렸다는 것을 깨달았다는 뜻이죠. found out은 알아내다, 깨닫다의 느낌을 줘요.","hl":"mn"},{"n":45,"text":"found out 뒤에는 that이 생략된 목적어절이 와요. 그래서 I was wrong 전체가 알아낸 내용을 담는 목적어절이 되는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가르치는 사람으로서,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">As \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">tutor\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 시작했다\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">began \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이해하기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">understand\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 자료를\u003c/span>\u003cspan class=\"en\">the material\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 잘 그리고 더 명확하게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">better \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">clearly\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 가르치는 사람으로서 자료를 더 잘 그리고 더 명확하게 이해하기 시작했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 가르치는 경험이 화자에게 \u003cb class=\"key\">긍정적 \u003c/b>\u003cb class=\"key\">변화\u003c/b>를 가져왔음을 보여 줘요. as a tutor는 자격을, began to understand는 \u003cb class=\"key\">이해\u003c/b>가 시작되었음을 나타내고, better and more clearly는 그 정도가 깊어졌음을 강조해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 as의 역할 표현\u003c/span> : as + [명사] (자격/역할) : \"가르치는 사람으로서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : begin + [to understand (to부정사구/목적어)] : \"이해하기 시작했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">비교급의 병렬\u003c/span> : better(well의 비교급) + and + more clearly(clearly의 비교급) : \"더 잘 그리고 더 명확하게\"\u003c/div>\u003c/div>","segs":[{"n":46,"text":"As a tutor, 가르치는 사람으로서. I began, 나는 시작했다. to understand, 이해하기를. the material, 그 자료를. better and more clearly, 더 잘 그리고 더 명확하게. 이 문장 전체를 해석하면, 나는 가르치는 사람으로서 자료를 더 잘 그리고 더 명확하게 이해하기 시작했다.","hl":"m"},{"n":47,"text":"이 문장은 가르치는 경험이 화자에게 긍정적 변화를 가져왔음을 보여 줘요. as a tutor는 가르치는 사람의 자격을, began to understand는 이해가 시작되었음을 나타내죠. better and more clearly는 그 이해의 정도가 더 깊어졌음을 강조해요.","hl":"mn"},{"n":48,"text":"첫 번째로, As a tutor에서 as는 어떤 자격으로 행동하는지를 나타내요. 두 번째로, began to understand는 begin 뒤에 to부정사가 목적어로 와서 이해하기 시작했다는 뜻을 만들어요. 세 번째로, better and more clearly는 well과 clearly의 비교급이 and로 연결된 표현이에요. 이렇게 가르치는 경험이 긍정적 변화와 깊은 이해로 이어졌다는 점이 이 문장의 핵심이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 또한 받았다\u003c/span>\u003cspan class=\"en\">I also got\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 좋은 점수를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">better \u003c/span>\u003cspan class=\"tgt\">grade\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-c 그래서 더 좋은 점수라는 비교의 뜻이 생기죠. 두 번째로 on the final exam에서 시험이나 평가를 나타낼 때는 전치사 on을 써요. 세 번째로 thanks to the project에서 thanks to는 원인이나 이유를 나타내는 관용 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 깨달았다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">realized \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내가 더 많은 것을 배울 수 있다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> I \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">could \u003c/span>\u003cspan class=\"tgt\">learn\u003c/span> more\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 사람들을 가르침으로써\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">teaching \u003c/span>\u003cspan class=\"tgt\">others\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 다른 사람들을 가르치면서 더 많은 것을 배울 수 있다는 것을 깨달았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글의 \u003cb class=\"key\">결론\u003c/b>이자 주제 문장이에요. \u003cb class=\"key\">가르치는 \u003c/b>\u003cb class=\"key\">사람\u003c/b>이 다른 사람을 가르치면서 오히려 \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">많은 \u003c/b>\u003cb class=\"key\">것을 \u003c/b>\u003cb class=\"key\">배울 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">있다\u003c/b>는 깨달음을 담고 있죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 목적어절\u003c/span> : realize + that + 주어 + 동사 : \"나는 ~라는 것을 깨달았다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 could + 동사원형\u003c/span> : could + [동사원형 learn] : \"배울 수 있었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 by + 동명사(수단·방법)\u003c/span> : by + [동명사 teaching] + 목적어 : \"다른 사람들을 가르침으로써\"\u003c/div>\u003c/div>","segs":[{"n":52,"text":"I realized, 나는 깨달았다. that I could learn more, 내가 더 많은 것을 배울 수 있다는 것을. by teaching others, 다른 사람들을 가르침으로써. 이 문장 전체를 해석하면, 나는 다른 사람들을 가르치면서 더 많은 것을 배울 수 있다는 것을 깨달았다.","hl":"m"},{"n":53,"text":"이 문장은 글의 결론이자 주제 문장이에요. 가르치는 사람이 다른 사람을 가르치면서 오히려 더 많은 것을 배울 수 있다는 깨달음을 담고 있죠.","hl":"mn"},{"n":54,"text":"첫 번째로 I realized that에서 realized 뒤의 that절은 깨달은 내용을 나타내는 목적어절이에요. 두 번째로 could learn에서 could는 과거 시점의 가능을 나타내고 뒤에는 동사원형이 와요. 세 번째로 by teaching others에서 by 뒤에는 동명사 teaching이 와서 수단을 나타내죠.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>과학 수업에서 \u003cb class=\"key\">또래 \u003c/b>\u003cb class=\"key\">지도\u003c/b> 프로젝트가 시작되었고, 선생님은 그것이 배우는 사람과 가르치는 사람 모두에게 \u003cb class=\"key\">도움\u003c/b>이 될 것이라고 말했다.\u003c/li>\u003cli>과학을 잘하던 학생은 \u003cb class=\"key\">학생 \u003c/b>\u003cb class=\"key\">교사\u003c/b>로 \u003cb class=\"key\">자원\u003c/b>해 과학을 잘 못하는 친구를 가르쳤다.\u003c/li>\u003cli>처음에는 시간을 너무 많이 쓰는 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">낭비\u003c/b>라고 생각했지만, 그것은 \u003cb class=\"key\">오판\u003c/b>이었다.\u003c/li>\u003cli>가르치면서 \u003cb class=\"key\">자료 \u003c/b>\u003cb class=\"key\">이해\u003c/b>가 깊어졌고, 가르치는 일이 자신의 \u003cb class=\"key\">배움\u003c/b>을 키운다는 것을 깨달았다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Teaching others can help us understand the material better and learn more ourselves.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">과학 수업의 \u003cb class=\"key\">또래 \u003c/b>\u003cb class=\"key\">지도\u003c/b> 프로젝트에서 학생은 친구를 가르치며 처음에는 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">낭비\u003c/b>라고 생각했지만, 가르치는 과정이 자료 이해와 성적 향상에 도움이 되어 결국 \u003cb class=\"key\">배움\u003c/b>을 더 많이 얻었다는 것을 깨달았다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":55,"text":"정리해 볼게요. 이 글은 과학 수업의 또래 지도 프로젝트가 모두에게 도움이 된다는 선생님의 말로 시작해요. 학생은 과학을 잘해서 학생 교사로 자원했고, 과학을 잘 못하는 친구를 가르쳤어요. 처음에는 시간 낭비라는 오판을 했지만, 가르치면서 자료 이해가 깊어졌고 기말시험 성적도 올랐어요. 결국 가르치는 일이 자신의 배움을 키운다는 점을 기억하면 좋겠어요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
