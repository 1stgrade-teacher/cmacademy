<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터1 Reading 28 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터1 Reading 28","audioDir":"28_audio","preview":false,"count":42,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.668em\">Reading\u003cbr>28\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터1\u003c/div>\u003ch1>Using Food to Calm Children: Effective in the Short Term, Harmful in the Long Term\u003c/h1>\u003ch2>음식으로 아이 달래기: 단기적으로는 효과적, 장기적으로는 해로울 수 있음\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>아이들이 화가 났을 때 음식을 주는 것은 쉽고 빠른 진정 방법이며 \u003cb class=\"key\">단기적\u003c/b>으로는 효과적이다. 그러나 \u003cb class=\"key\">장기적\u003c/b>으로 아이는 부정적인 감정을 보이면 간식을 받는다고 생각하게 되어, 기분이 나쁘거나 지루할 때도 음식을 원하게 되므로 \u003cb class=\"key\">해로울\u003c/b> 수 있다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Giving children food to calm them down is effective in the short term, but in the longer term it can be harmful because they may learn to depend on snacks whenever they feel bad.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 아이들이 화가 났을 때 음식을 주는 것이 왜 단기적으로는 효과적이지만 장기적으로는 해로울 수 있는지 설명하는 글이에요. 내용을 한 줄로 정리하면, 음식으로 아이를 달래는 것은 단기적으로는 효과적이지만 장기적으로는 해로울 수 있다는 것이죠. 그러니까 오늘의 요지는 음식 달래기의 단기적 효과와 장기적 위험을 함께 보는 거예요. 그럼 지문을 한 문장씩 따라가면서 자세히 살펴볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">사람이 화나거나 속상할 때 그 감정을 스스로 가라앉히는 능력을 \u003cb class=\"key\">정서 \u003c/b>\u003cb class=\"key\">조절\u003c/b>(emotion regulation)이라고 합니다. 아이들은 이 능력이 아직 자라는 중이라서 어른의 도움을 자주 받는데, 이때 어떤 행동이 좋은 결과를 낳으면 그 행동이 반복되는 현상을 \u003cb class=\"key\">강화\u003c/b>(reinforcement)라고 부릅니다. 예를 들어 울 때마다 사탕을 받은 아이는 속상할 때마다 사탕을 먼저 떠올리게 되고, 이것이 반복되면 감정을 다루는 방식 자체가 \u003cb class=\"key\">조건화\u003c/b>(conditioning)되어 버립니다. 이는 머리가 아플 때마다 습관처럼 진통제부터 찾는 것과 비슷합니다. 약이 그 순간의 통증을 없애 주기는 하지만 진짜 원인을 다루지 않으면 약에 의존하게 되는 것과 같은 원리입니다. 그래서 아이의 부정적인 감정은 음식이 아니라 대화나 놀이 같은 다른 \u003cb class=\"key\">대처 \u003c/b>\u003cb class=\"key\">방식\u003c/b>(coping strategy)으로 풀어 주는 것이 장기적으로 안전합니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식부터 짚어 볼게요. 화나거나 속상한 감정을 스스로 가라앉히는 능력을 정서 조절이라고 하고, 영어로는 emotion regulation이라고 해요. 아이들은 이 능력이 아직 자라는 중이라서 어른이 도와주는 경우가 많아요. 이때 어떤 행동이 좋은 결과를 낳으면 그 행동이 반복되는데, 이것을 강화라고 하고 reinforcement라고 부릅니다. 예를 들어 울 때마다 사탕을 받은 아이는 속상할 때마다 사탕을 먼저 떠올리게 되고, 이게 반복되면 감정을 다루는 방식이 조건화되어 버려요. 이건 머리가 아플 때마다 습관처럼 진통제부터 찾는 것과 비슷해요. 약이 그 순간의 통증을 없애 주긴 하지만 진짜 원인을 다루지 않으면 약에 의존하게 되는 것과 같은 원리예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>질문과 답\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>글은 아이들이 화가 났을 때 진정시키는 좋은 방법이 무엇인지 \u003cb class=\"key\">질문\u003c/b>으로 시작합니다. 그리고 쉽고 빠른 하나의 방법으로 아이들에게 \u003cb class=\"key\">음식\u003c/b>을 주는 것을 답으로 제시합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>효과의 원리\u003csmall>근거 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>음식을 주면 아이의 \u003cb class=\"key\">초점\u003c/b>이 화난 것에서 다른 곳으로 돌아갑니다. 아이는 다른 일을 하기 위해 손과 입을 사용하게 되고, 그래서 화난 일을 \u003cb class=\"key\">잊을\u003c/b> 수 있습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>단기적 효과\u003csmall>예시 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>사탕이나 초콜릿 같은 \u003cb class=\"key\">간식\u003c/b>을 주면 아이들은 더 행복해집니다. 그래서 \u003cb class=\"key\">단기적\u003c/b>으로 이렇게 음식을 이용하는 것은 효과적이라고 인정합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>장기적 폐해\u003csmall>전환·결론 · 문장 8–10\u003c/small>\u003c/h4>\u003cp>하지만 \u003cb class=\"key\">장기적\u003c/b>으로 이것은 해로울 수 있습니다. 아이들은 부정적인 \u003cb class=\"key\">감정\u003c/b>을 보이면 간식을 받을 것이라고 생각하게 되고, 그러면 기분이 나쁘거나 지루할 때도 기분이 나아지게 하려고 음식을 원하게 됩니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 네 단계로 나눠서 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 질문과 답이에요. 글은 아이들이 화가 났을 때 진정시키는 좋은 방법이 무엇인지 질문으로 시작해요. 그리고 쉽고 빠른 방법 하나를 답으로 내놓는데, 그것이 바로 음식을 주는 것이에요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 효과의 원리예요. 음식을 주면 아이의 초점이 화난 것에서 다른 곳으로 옮겨 가요. 아이는 손과 입을 다른 일에 쓰게 되고, 그래서 화난 일을 잊게 되는 거죠.","hl":"f1"},{"n":6,"text":"세 번째 단계는 단기적 효과예요. 사탕이나 초콜릿 같은 간식을 주면 아이들은 더 행복해져요. 그래서 단기적으로 이렇게 음식을 이용하는 것이 효과적이라고 인정하는 거예요.","hl":"f2"},{"n":7,"text":"네 번째 단계는 장기적 폐해예요. 하지만 장기적으로 이것은 해로울 수 있어요. 아이들은 부정적인 감정을 보이면 간식을 받을 것이라고 생각하게 되고, 그러면 기분이 나쁘거나 화나거나 심지어 지루할 때도 기분이 나아지게 하려고 음식을 원하게 돼요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">질문-답변 + 비교·대조\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 8번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장의 \u003cb class=\"key\">질문\u003c/b>과 두 번째 문장의 답은 주제를 꺼내는 도입일 뿐, 필자의 진짜 주장은 아닙니다. 일곱 번째 문장에서 단기적 효과를 인정한 뒤 여덟 번째 문장에서 But으로 \u003cb class=\"key\">전환\u003c/b>하며 장기적 해로움을 말합니다. 그래서 \u003cb class=\"key\">주제문\u003c/b>이 뒤에 오는 미괄식이며, 단기와 장기라는 두 기준을 비교·대조하는 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>When children are upset (1)\u003c/b>\u003cspan>상황·질문 도입\u003c/span>\u003cb>So (5)\u003c/b>\u003cspan>결과\u003c/span>\u003cb>In the short term (7)\u003c/b>\u003cspan>단기 기준 제시\u003c/span>\u003cb>But (8)\u003c/b>\u003cspan>전환·반박\u003c/span>\u003cb>in the longer term (8)\u003c/b>\u003cspan>장기 기준 제시(대조)\u003c/span>\u003cb>Then (10)\u003c/b>\u003cspan>이어지는 결과\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">give them some food\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">snacks, such as candy or chocolate\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">get a snack\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">want some food\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>단기적 사용\u003c/th>\u003cth>장기적 사용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>아이가 즉시 진정되고 더 행복해짐\u003c/td>\u003ctd>부정적 감정마다 간식을 기대하게 됨\u003c/td>\u003c/tr>\u003ctr>\u003ctd>음식이 효과적인 달래기 수단\u003c/td>\u003ctd>음식에 의존하는 감정 조절 습관\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 질문과 답으로 시작해서 단기와 장기를 비교하고 대조하는 방식이에요. 구조를 보면 주제문이 뒤에 나오는 미괄식이죠. 일곱 번째 문장에서 단기적 효과를 인정한 다음, 여덟 번째 문장에서 But으로 방향을 틀어 장기적으로는 해로울 수 있다고 말해요. 그래서 진짜 주장은 여덟 번째 문장이고, 이 문장이 주제문이 되는 거예요.","hl":"ty"},{"n":9,"text":"신호어를 꼭 챙겨 보세요. 일곱 번째 문장의 In the short term은 단기라는 기준을 세우고, 여덟 번째 문장의 in the longer term은 장기라는 기준과 대조를 이루죠. 여덟 번째 문장 맨 앞의 But은 앞의 인정을 뒤집는 전환이에요. 다섯 번째 문장의 So는 결과를, 열 번째 문장의 Then은 이어지는 결과를 알려 주는 신호이고요. 같은 개념이 food, snacks, a snack처럼 계속 바뀌어 나오는 것도 눈여겨보세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>upset\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>속상한, 화가 난\u003c/span>\u003c/div>\u003cdiv>\u003cb>calm down\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>진정시키다, 진정하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>easy\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>쉬운\u003c/span>\u003c/div>\u003cdiv>\u003cb>quick\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>빠른\u003c/span>\u003c/div>\u003cdiv>\u003cb>focus\u003c/b>\u003cem>명사\u003c/em>\u003cspan>초점, 주의\u003c/span>\u003c/div>\u003cdiv>\u003cb>change\u003c/b>\u003cem>동사\u003c/em>\u003cspan>바꾸다, 돌리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>something else\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>다른 것, 다른 일\u003c/span>\u003c/div>\u003cdiv>\u003cb>use\u003c/b>\u003cem>동사\u003c/em>\u003cspan>사용하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>mouth\u003c/b>\u003cem>명사\u003c/em>\u003cspan>입\u003c/span>\u003c/div>\u003cdiv>\u003cb>forget\u003c/b>\u003cem>동사\u003c/em>\u003cspan>잊다\u003c/span>\u003c/div>\u003cdiv>\u003cb>be angry about\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 대해 화가 나 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>snack\u003c/b>\u003cem>명사\u003c/em>\u003cspan>간식\u003c/span>\u003c/div>\u003cdiv>\u003cb>such as\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~와 같은\u003c/span>\u003c/div>\u003cdiv>\u003cb>candy\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사탕\u003c/span>\u003c/div>\u003cdiv>\u003cb>chocolate\u003c/b>\u003cem>명사\u003c/em>\u003cspan>초콜릿\u003c/span>\u003c/div>\u003cdiv>\u003cb>happier\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>더 행복한\u003c/span>\u003c/div>\u003cdiv>\u003cb>in the short term\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>단기적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>in this way\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>이렇게, 이런 방식으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>effective\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>효과적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>in the longer term\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>장기적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>harmful\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>해로운\u003c/span>\u003c/div>\u003cdiv>\u003cb>might\u003c/b>\u003cem>동사\u003c/em>\u003cspan>~할지도 모르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>get\u003c/b>\u003cem>동사\u003c/em>\u003cspan>받다, 얻다\u003c/span>\u003c/div>\u003cdiv>\u003cb>show\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보이다, 드러내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>negative\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>부정적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>emotion\u003c/b>\u003cem>명사\u003c/em>\u003cspan>감정\u003c/span>\u003c/div>\u003cdiv>\u003cb>bored\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>지루한, 지루함을 느끼는\u003c/span>\u003c/div>\u003cdiv>\u003cb>feel better\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>기분이 나아지다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"단어도 몇 개만 짚을게요. calm down은 진정시키다, effective는 효과적인, harmful은 해로운이라는 뜻이에요. in the longer term은 장기적으로, negative emotions는 부정적인 감정으로 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">upset\u003c/b>\u003cspan class=\"m\">속상한, 화가 난\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">angry\u003c/span>\u003cspan class=\"s\">distressed\u003c/span>\u003cspan class=\"s\">troubled\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">calm\u003c/span>\u003cspan class=\"a\">pleased\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">calm down\u003c/b>\u003cspan class=\"m\">진정시키다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">soothe\u003c/span>\u003cspan class=\"s\">pacify\u003c/span>\u003cspan class=\"s\">settle\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">agitate\u003c/span>\u003cspan class=\"a\">upset\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">effective\u003c/b>\u003cspan class=\"m\">효과적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">successful\u003c/span>\u003cspan class=\"s\">useful\u003c/span>\u003cspan class=\"s\">efficient\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ineffective\u003c/span>\u003cspan class=\"a\">useless\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">harmful\u003c/b>\u003cspan class=\"m\">해로운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">damaging\u003c/span>\u003cspan class=\"s\">detrimental\u003c/span>\u003cspan class=\"s\">dangerous\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">harmless\u003c/span>\u003cspan class=\"a\">beneficial\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">negative\u003c/b>\u003cspan class=\"m\">부정적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">unfavorable\u003c/span>\u003cspan class=\"s\">pessimistic\u003c/span>\u003cspan class=\"s\">bad\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">positive\u003c/span>\u003cspan class=\"a\">optimistic\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">forget\u003c/b>\u003cspan class=\"m\">잊다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">overlook\u003c/span>\u003cspan class=\"s\">ignore\u003c/span>\u003cspan class=\"s\">dismiss\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">remember\u003c/span>\u003cspan class=\"a\">recall\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">quick\u003c/b>\u003cspan class=\"m\">빠른\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">fast\u003c/span>\u003cspan class=\"s\">rapid\u003c/span>\u003cspan class=\"s\">swift\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">slow\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 함께 정리해 볼게요. upset은 angry나 distressed와 가깝고 반대말은 calm이에요. calm down은 soothe나 pacify로 바꿔 쓸 수 있고 반대말은 agitate죠. effective의 동의어는 successful이나 useful이고 반의어는 ineffective예요. harmful은 damaging이나 detrimental과 같고 반대말은 harmless나 beneficial이고요. negative는 unfavorable의 뜻이고 반대말은 positive랍니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아이들이 화가 났을 때,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">children \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">upset\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무엇이 좋은 방법일까?\u003c/span>\u003cspan class=\"en\">what is a good way\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들을 진정시키는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">calm \u003c/span>\u003cspan class=\"tgt\">them \u003c/span>\u003cspan class=\"tgt\">down\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">아이들이 화가 났을 때, 그들을 진정시키는 좋은 방법은 무엇일까?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아이들이 화가 났을 때의 상황을 먼저 제시하고, 그들을 진정시키는 좋은 방법이 무엇인지 질문하는 도입 문장이에요. 이 질문은 뒤에서 음식을 주는 구체적인 방법으로 답이 이어지게 하는 역할을 합니다. 여기서 \u003cb class=\"key\">화를 \u003c/b>\u003cb class=\"key\">진정시키는 \u003c/b>\u003cb class=\"key\">방법\u003c/b>은 아이의 부정적 감정을 가라앉히는 방법이라는 뜻이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간 부사절을 이끄는 접속사 when\u003c/span> : When + [주어 children] + [동사 are upset], [주절] : \"아이들이 화가 났을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : [명사 way] + [to + 동사원형 (수식)] : \"그들을 진정시키는\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"When children are upset, 아이들이 화가 났을 때. what is a good way, 무엇이 좋은 방법일까?. to calm them down?, 그들을 진정시키는. 이 문장 전체를 해석하면, 아이들이 화가 났을 때, 그들을 진정시키는 좋은 방법은 무엇일까?","hl":"m"},{"n":13,"text":"이 문장은 아이들이 화가 났을 때 그들을 진정시키는 좋은 방법이 무엇인지 질문하며 글을 시작해요. 화를 진정시키는 방법을 찾는 질문이 뒤에서 음식을 주는 답으로 이어지는 발판이 됩니다.","hl":"mn"},{"n":14,"text":"첫 번째로 When children are upset에서 when은 시간 부사절을 이끌어 아이들이 화가 난 상황을 먼저 알려 줘요. 두 번째로 to calm them down에서 to부정사는 앞의 명사 way를 뒤에서 꾸며 주는 형용사적 용법이에요. 그래서 a good way to calm them down은 그들을 진정시키는 좋은 방법으로 해석해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">쉽고 빠른 하나의 방법은\u003c/span>\u003cspan class=\"en\">One easy and quick way\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들에게 음식을 주는 것\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">give \u003c/span>\u003cspan class=\"tgt\">them \u003c/span>\u003cspan class=\"tgt\">some \u003c/span>\u003cspan class=\"tgt\">food\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">쉽고 빠른 하나의 방법은 그들에게 음식을 주는 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞의 질문에 대해 쉽고 빠른 해결책이 음식을 주는 것이라고 답하는 문장이에요. 아이들을 달래는 \u003cb class=\"key\">쉽고 \u003c/b>\u003cb class=\"key\">빠른 \u003c/b>\u003cb class=\"key\">방법\u003c/b>으로 \u003cb class=\"key\">음식을 \u003c/b>\u003cb class=\"key\">주는 \u003c/b>\u003cb class=\"key\">것\u003c/b>을 제시하며, 글의 중심 소재를 음식으로 좁혀 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사 + to부정사의 명사적 용법(주격 보어)\u003c/span> : [주어 One easy and quick way] + [be동사 is] + [to부정사구 to give them some food (주격 보어)] : \"그들에게 음식을 주는 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">4형식 동사 give\u003c/span> : [give] + [간접목적어 them] + [직접목적어 some food] : \"그들에게 음식을 주다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"One easy and quick way, 쉽고 빠른 하나의 방법은. is, ~이다. to give them some food, 그들에게 음식을 주는 것. 이 문장 전체를 해석하면, 쉽고 빠른 하나의 방법은 그들에게 음식을 주는 것이다.","hl":"m"},{"n":16,"text":"이 문장은 앞의 질문에 대한 답을 줘요. 아이를 달래는 쉽고 빠른 방법은 음식을 주는 것이라고 말하면서 글의 중심을 음식으로 좁혀 주는 거죠.","hl":"mn"},{"n":17,"text":"먼저 is to give them some food에서 to give 이하는 be동사 뒤에서 주어의 내용을 설명하는 명사적 용법이에요. 이때 to부정사구는 주격 보어로 쓰여서 One easy and quick way is to give them some food는 쉽고 빠른 한 가지 방법은 그들에게 음식을 주는 것이다로 해석해요. 그리고 give them some food는 4형식으로 간접목적어 them과 직접목적어 some food를 함께 취하는 구조예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은 그들이 바꾸도록 돕는다\u003c/span>\u003cspan class=\"en\">This \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">helps \u003c/span>\u003cspan class=\"tgt\">them \u003c/span>\u003cspan class=\"tgt\">change\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 초점을\u003c/span>\u003cspan class=\"en\">their focus\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">화난 것에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">being \u003c/span>\u003cspan class=\"tgt\">upset\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 곳으로\u003c/span>\u003cspan class=\"en\">to \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">something \u003c/span>\u003cspan class=\"tgt\">else\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것은 그들의 초점을 화난 것에서 다른 곳으로 돌리는 데 도움이 된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 음식을 주는 방식이 왜 아이를 진정시키는지 그 원리를 설명하는 문장이에요. 아이가 화난 감정에만 머물지 않고 \u003cb class=\"key\">초점\u003c/b>을 \u003cb class=\"key\">다른 \u003c/b>\u003cb class=\"key\">곳\u003c/b>으로 돌리게 한다는 뜻이죠. 그래서 이 문장은 앞에서 제시한 방법의 효과를 뒷받침합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">help + 목적어 + 동사원형\u003c/span> : help + [목적어 them] + [동사원형 change] : \"그들이 바꾸도록 돕는다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 from + 동명사\u003c/span> : from + [동명사 being] + [형용사 upset] : \"화가 난 상태로부터\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">부정대명사 + else\u003c/span> : [something] + [else] : \"다른 무언가\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"This helps them change, 이것은 그들이 바꾸도록 돕는다. their focus, 그들의 초점을. from being upset, 화난 것에서. to something else, 다른 곳으로. 이 문장 전체를 해석하면, 이것은 그들의 초점을 화난 것에서 다른 곳으로 돌리는 데 도움이 된다.","hl":"m"},{"n":19,"text":"이 문장은 음식을 주는 것이 왜 아이를 진정시키는지 원리를 설명해요. 아이가 화난 감정에만 머물지 않고 초점을 다른 곳으로 돌리게 한다는 뜻이죠. 그래서 앞에서 말한 방법의 효과를 뒷받침해 줍니다.","hl":"mn"},{"n":20,"text":"먼저 helps them change에서 help는 목적어 them 뒤에 동사원형 change를 목적격 보어로 데려와 그들이 바꾸도록 돕는다는 뜻을 만들어요. 다음으로 from being upset에서 전치사 from 뒤에는 동명사 being이 와서 화가 난 상태로부터라는 의미를 나타내요. 마지막으로 something else에서 something은 부정대명사라서 다른이라는 뜻의 else가 뒤에서 꾸며 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 사용할 것이다\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">use\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 손과 입을\u003c/span>\u003cspan class=\"en\">their hands and mouth\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 일을 하기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">something \u003c/span>\u003cspan class=\"tgt\">else\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 다른 일을 하기 위해 손과 입을 사용할 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아이들이 속상할 때 \u003cb class=\"key\">손과 \u003c/b>\u003cb class=\"key\">입\u003c/b>을 움직여 다른 활동으로 주의를 돌린다는 뜻이에요. 앞 문장의 '초점을 바꾼다'를 구체적인 행동으로 보여 주는 \u003cb class=\"key\">예시\u003c/b> 문장이죠. 여기서 \u003cb class=\"key\">something \u003c/b>\u003cb class=\"key\">else\u003c/b>는 속상한 일이 아니라 먹는 행동 같은 다른 대상을 가리켜요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 will + 동사원형\u003c/span> : [주어] + will + [동사원형] : \"사용할 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : [동사 use] + [to + 동사원형] (to부정사구/목적) : \"다른 일을 하기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">부정대명사 something + else\u003c/span> : [something] + [else] : \"다른 무엇, 다른 일\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"They will use, 그들은 사용할 것이다. their hands and mouth, 그들의 손과 입을. to do something else, 다른 일을 하기 위해. 이 문장 전체를 해석하면, 그들은 다른 일을 하기 위해 손과 입을 사용할 것이다.","hl":"m"},{"n":22,"text":"이 문장은 아이들이 속상할 때 손과 입을 써서 다른 활동으로 주의를 돌린다는 걸 보여 줘요. 바로 앞에서 초점을 바꾼다고 했죠? 그걸 구체적인 행동으로 풀어 준 예시예요. something else는 속상한 일이 아니라 먹는 행동 같은 다른 대상을 가리킨다고 잡으면 됩니다.","hl":"mn"},{"n":23,"text":"먼저 will use를 보세요. 조동사 will 뒤에는 동사원형이 와야 하니까 use인 거예요. 두 번째로 to do something else, 목적을 나타내는 to부정사예요. 손과 입을 사용한다, 무엇을 위해? 다른 일을 하기 위해, 이렇게 이어 붙이면 됩니다. 세 번째로 something else, 부정대명사 something은 꾸미는 말이 뒤에 붙어서 else가 뒤에 오는 형태예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서\u003c/span>\u003cspan class=\"en\">So,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 잊을 수 있다\u003c/span>\u003cspan class=\"en\">they \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">forget\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">것들을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">things \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 화나 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">angry \u003c/span>\u003cspan class=\"tgt\">about\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그래서 그들은 화난 일을 잊을 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 결과를 \u003cb class=\"key\">So\u003c/b>로 이어 받아, 주의를 다른 데로 돌리면 화난 대상 자체를 \u003cb class=\"key\">잊게\u003c/b> 된다는 뜻이에요. 간식이 아이를 진정시키는 \u003cb class=\"key\">결과\u003c/b>를 설명하는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 can + 동사원형\u003c/span> : [주어] + can + [동사원형] : \"잊을 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 생략\u003c/span> : [선행사 the things] + [(which/that) + 주어 + 동사 + 전치사] : \"그들이 화나 있는 것들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">be angry about + 명사\u003c/span> : be angry [[about]] + [대상] : \"~에 대해 화나다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"So, 그래서. they can forget, 그들은 잊을 수 있다. the things, 것들을. they are angry about, 그들이 화나 있는. 이 문장 전체를 해석하면, 그래서 그들은 화난 일을 잊을 수 있다.","hl":"m"},{"n":25,"text":"이 문장은 앞 문장의 결과를 So로 이어 받은 문장이에요. 주의를 다른 데로 돌리면 화난 대상 자체를 잊게 된다는 뜻이죠. 간식이 아이를 진정시키는 결과를 설명하고 있습니다.","hl":"mn"},{"n":26,"text":"먼저 can forget, 조동사 can 뒤에는 동사원형이 와서 forget이에요. 가능의 의미로 '잊을 수 있다'가 되죠. 두 번째로 the things they are angry about, 여기에는 목적격 관계대명사가 생략되어 있어요. the things와 they 사이에 which나 that이 숨어 있고, about의 목적어 자리라서 목적격으로 생략된 거예요. 세 번째로 are angry about, 화남의 대상은 about으로 받는다는 것도 같이 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들에게 간식을 준다면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">If \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">give \u003c/span>\u003cspan class=\"tgt\">them \u003c/span>\u003cspan class=\"tgt\">snacks\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사탕이나 초콜릿과 같은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">such \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">candy \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">chocolate\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아이들은 더 행복할 것이다\u003c/span>\u003cspan class=\"en\">children \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">feel \u003c/span>\u003cspan class=\"tgt\">happier\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들에게 사탕이나 초콜릿과 같은 간식을 준다면, 아이들은 더 행복할 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 간식이라는 \u003cb class=\"key\">보상\u003c/b>이 아이 기분을 즉각 좋아지게 만든다는 내용이에요. 뒤에 나오는 '단기적으로는 효과적이다'라는 \u003cb class=\"key\">긍정\u003c/b> 평가의 근거가 되는 문장이죠. such as는 candy나 chocolate처럼 \u003cb class=\"key\">예시\u003c/b>를 드는 표현입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조건 부사절의 현재시제\u003c/span> : If + [주어] + [현재동사], [주어] + will + [동사원형] : \"그들에게 간식을 준다면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">such as (예시 제시)\u003c/span> : [앞 명사 snacks] + such as + [예시] : \"사탕이나 초콜릿과 같은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">감각동사 feel + 비교급 형용사(2형식)\u003c/span> : feel + [형용사(주격보어)] : \"더 행복하게 느낄 것이다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"If you give them snacks, 그들에게 간식을 준다면. such as candy or chocolate, 사탕이나 초콜릿과 같은. children will feel happier, 아이들은 더 행복할 것이다. 이 문장 전체를 해석하면, 그들에게 사탕이나 초콜릿과 같은 간식을 준다면, 아이들은 더 행복할 것이다.","hl":"m"},{"n":28,"text":"이 문장은 간식이라는 보상이 아이 기분을 바로 좋아지게 만든다는 내용이에요. 그래서 다음에 나오는 단기적으로 효과적이라는 긍정 평가의 근거가 되죠. such as는 candy나 chocolate처럼 예시를 드는 표현이고요.","hl":"mn"},{"n":29,"text":"먼저 If you give them snacks, 조건을 나타내는 if절에서는 미래라도 현재시제를 써요. 그래서 will give가 아니라 give인 거죠. 두 번째로 such as candy or chocolate, 앞에 나온 snacks의 구체적인 예시를 들 때 쓰는 표현이에요. 세 번째로 will feel happier, feel은 감각동사라서 뒤에 부사가 아니라 형용사가 와요. 그래서 happily가 아니라 happy, 여기서는 비교급 happier가 온 겁니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단기적으로는,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">In \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">short \u003c/span>\u003cspan class=\"tgt\">term\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이렇게 음식을 이용하는 것이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">using \u003c/span>\u003cspan class=\"tgt\">food \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">way\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">효과적이다.\u003c/span>\u003cspan class=\"en\">is effective.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">단기적으로는, 이렇게 음식을 이용하는 것이 효과적이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 아이를 달래는 방법으로 음식을 주는 상황을 설명했죠. 이 문장은 그 방법이 \u003cb class=\"key\">단기적\u003c/b>으로는 \u003cb class=\"key\">효과적\u003c/b>이라고 인정하는 부분이에요. 'In the short term'은 '짧은 기간 안에서는'이라는 뜻이고, \u003cb class=\"key\">동명사\u003c/b>구 using food in this way가 문장의 주어로 쓰였어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구 관용표현\u003c/span> : in the short term = 단기적으로는 / in the long term = 장기적으로는 : \"단기적으로는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사구 주어\u003c/span> : [Using food in this way (동명사구/주어)] + is + effective. : \"이렇게 음식을 이용하는 것이\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"In the short term, 단기적으로는. using food in this way, 이렇게 음식을 이용하는 것이. is effective, 효과적이다.. 이 문장 전체를 해석하면, 단기적으로는, 이렇게 음식을 이용하는 것이 효과적이다.","hl":"m"},{"n":31,"text":"앞에서 음식으로 아이를 달래는 방법을 설명했죠. 이 문장은 그 방법이 단기적으로는 효과적이라고 인정해 주는 부분이에요. 짧은 기간 안에서는 실제로 도움이 된다는 뜻이에요.","hl":"mn"},{"n":32,"text":"첫 번째로, using food in this way에서 주어를 찾아보세요. 동명사 using이 이끄는 구가 통째로 주어 역할을 하고 있어요. 그래서 동사는 단수로 받아서 is effective가 되는 거죠. 두 번째로, In the short term은 단기적으로는이라는 뜻으로 굳어진 관용표현이니까 통째로 외워 두세요. 뒤에 나오는 in the longer term과 짝을 이루는 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만\u003c/span>\u003cspan class=\"en\">But,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">장기적으로는,\u003c/span>\u003cspan class=\"en\">in the longer term,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은 해로울 수 있다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">this\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">harmful\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 장기적으로 이것은 해로울 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> But으로 앞 문장과 반대 방향으로 흐름을 틀어 주는 문장이에요. 앞에서 인정한 단기적 효과와 달리, \u003cb class=\"key\">장기적\u003c/b>으로 보면 이 방법은 \u003cb class=\"key\">해로울 \u003c/b>\u003cb class=\"key\">수\u003c/b> 있다고 경고합니다. 여기서 this는 음식을 이용해 아이를 달래는 그 방식 전체를 가리켜요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지시대명사 this(앞 내용 지칭)\u003c/span> : this = 앞 문장의 내용 전체(음식을 이용해 아이를 달래는 방법) : \"이것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 can + be + 형용사(가능성)\u003c/span> : [can + 동사원형] = ~할 수 있다 / be harmful = 해롭다 : \"해로울 수 있다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"But, 하지만. in the longer term, 장기적으로는. this can be harmful, 이것은 해로울 수 있다.. 이 문장 전체를 해석하면, 하지만 장기적으로 이것은 해로울 수 있다.","hl":"m"},{"n":34,"text":"앞에서는 단기적으로 효과적이라고 했죠. 그런데 But이 나오면서 방향이 바뀝니다. 오래 보고 보면 이 방법은 오히려 아이에게 해로울 수 있다고 경고하는 문장이에요.","hl":"mn"},{"n":35,"text":"첫 번째로, this를 짚어 볼게요. 여기서 this는 앞 문장 전체, 그러니까 음식을 이용해서 아이를 달래는 그 방법을 통째로 가리키는 지시대명사예요. 두 번째로, can be harmful은 조동사 can 뒤에 동사원형 be가 온 구조로, 해로울 수 있다는 가능성을 나타냅니다. 조동사 뒤에는 언제나 동사원형이 온다는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아이들은 생각할지도 모른다\u003c/span>\u003cspan class=\"en\">The children \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">might \u003c/span>\u003cspan class=\"tgt\">think\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 간식을 받을 것이라고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">get \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">snack\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 그들이 어떤 부정적인 감정을 보이면.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">if \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">show \u003c/span>\u003cspan class=\"tgt\">any \u003c/span>\u003cspan class=\"tgt\">negative \u003c/span>\u003cspan class=\"tgt\">emotions\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">아이들은 자신들이 어떤 부정적인 감정을 보이면 간식을 받을 것이라고 생각할지도 모른다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 음식을 이용한 달래기가 왜 장기적으로 해로운지 그 이유를 구체적으로 풀어 주는 문장이에요. 아이들이 '부정적인 감정을 보이면 간식이 나온다'는 \u003cb class=\"key\">학습\u003c/b>을 하게 된다는 뜻이죠. might는 '~할지도 모른다'는 \u003cb class=\"key\">추측\u003c/b>이고, if절은 조건을 나타내는 \u003cb class=\"key\">부사절\u003c/b>이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 might(추측)\u003c/span> : [might + 동사원형] = ~할지도 모른다 : \"생각할지도 모른다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 명사절(목적어)\u003c/span> : think + [that + 주어 + 동사 ~ (명사절/목적어)] : \"그들이 간식을 받을 것이라고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">if 조건 부사절 + any\u003c/span> : [if + 주어 + 동사 ~ (조건 부사절)], 주어 + 동사 ~ : \"만약 그들이 어떤 부정적인 감정을 보이면\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"The children might think, 아이들은 생각할지도 모른다. that they will get a snack, 그들이 간식을 받을 것이라고. if they show any negative emotions, 만약 그들이 어떤 부정적인 감정을 보이면.. 이 문장 전체를 해석하면, 아이들은 자신들이 어떤 부정적인 감정을 보이면 간식을 받을 것이라고 생각할지도 모른다.","hl":"m"},{"n":37,"text":"앞에서 말한 장기적인 해로움이 왜 생기는지, 그 이유를 아주 구체적으로 알려 주는 문장이에요. 아이들이 부정적인 감정을 보이면 간식이 나온다는 걸 배우게 된다는 뜻이죠. 결국 감정을 스스로 다스리는 대신 음식에 기대는 습관이 생긴다는 이야기예요.","hl":"mn"},{"n":38,"text":"첫 번째로, might think에서 might는 추측을 나타내는 조동사예요. 그래서 아이들은 생각할지도 모른다라고 부드럽게 해석합니다. 두 번째로, that they will get a snack은 think의 목적어로 쓰인 명사절이에요. 생각의 내용을 that절로 채워 준 것이죠. 세 번째로, if they show any negative emotions는 조건을 나타내는 부사절이고, 이 안에서 any는 어떤이라는 뜻으로 자연스럽게 쓰입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러면\u003c/span>\u003cspan class=\"en\">Then,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 기분이 나쁘거나, 화나거나, 심지어 지루할 때도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">feel \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">bad, \u003c/span>\u003cspan class=\"tgt\">upset, \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">even \u003c/span>\u003cspan class=\"tgt\">bored\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 음식을 원하게 될 것이다\u003c/span>\u003cspan class=\"en\">they will want some food\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 기분이 더 좋아지게 하기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">themselves \u003c/span>\u003cspan class=\"tgt\">feel \u003c/span>\u003cspan class=\"tgt\">better\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러면 그들은 기분이 나쁘거나, 화나거나, 심지어 지루할 때도 자신의 기분이 더 좋아지게 하기 위해 음식을 원하게 될 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 말한 부정적 감정에 대한 조건 형성이 한 단계 확장되는 문장이에요. 아이들은 이제 화나고 속상할 때뿐 아니라 \u003cb class=\"key\">지루함\u003c/b> 같은 가벼운 상태에서도 \u003cb class=\"key\">음식\u003c/b>을 기분 전환의 수단으로 찾게 된다는 뜻이죠. 결국 음식이 \u003cb class=\"key\">감정 \u003c/b>\u003cb class=\"key\">조절 \u003c/b>\u003cb class=\"key\">도구\u003c/b>로 굳어지는 장기적 폐해를 경고하는 흐름의 마무리입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 when의 시간 부사절 + 미래 대용 현재\u003c/span> : [when + 주어 + 현재동사], 주어 + will + 동사 : \"그들이 기분이 나쁘거나, 화나거나, 심지어 지루할 때도\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">형용사 병렬구조 (or로 연결)\u003c/span> : [형용사 A], [형용사 B], or even [형용사 C] : \"나쁘거나, 화나거나, 심지어 지루한\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : 주어 + want + 목적어 + [to make + 목적어 + 동사원형 (to부정사구/목적)] : \"자신의 기분이 더 좋아지게 하기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">사역동사 make 5형식 (목적격보어로 동사원형)\u003c/span> : make + 목적어 + [동사원형] (사역동사) : \"자신의 기분이 더 좋아지게 하다\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"Then, 그러면. when they feel bad, upset, or even bored, 그들이 기분이 나쁘거나, 화나거나, 심지어 지루할 때도. they will want some food, 그들은 음식을 원하게 될 것이다. to make themselves feel better, 자신의 기분이 더 좋아지게 하기 위해. 이 문장 전체를 해석하면, 그러면 그들은 기분이 나쁘거나, 화나거나, 심지어 지루할 때도 자신의 기분이 더 좋아지게 하기 위해 음식을 원하게 될 것이다.","hl":"m"},{"n":40,"text":"이 문장은 앞에서 나온 이야기를 한 단계 넓혀 주는 문장이에요. 아이들이 화나고 속상할 때뿐 아니라 심지어 지루함을 느낄 때도 음식을 찾게 된다는 거죠. 결국 음식이 감정 조절 도구로 굳어져서, 길게 보면 해롭다는 흐름의 마무리라고 보시면 됩니다.","hl":"mn"},{"n":41,"text":"먼저, when이 이끄는 부사절은 미래 일이라도 현재형으로 쓴다는 점을 기억하세요. 그래서 주절은 will want인데 부사절은 feel이 되는 겁니다. 두 번째, bad, upset, or even bored는 형용사를 or로 병렬 연결한 구조예요. even이 들어가서 지루함까지 포함된다는 걸 강조하고 있죠. 세 번째, to make themselves feel better에서 to부정사는 목적을 나타냅니다. 음식을 원하는 목적이 기분이 좋아지게 하는 것이라는 뜻이에요. 네 번째, make는 사역동사라서 목적격보어로 동사원형 feel을 씁니다. 그리고 목적어가 주어와 같으니까 재귀대명사 themselves를 쓴 거예요. 여기서 to feel로 쓰면 틀린다는 점, 꼭 챙겨 두세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>아이들이 화가 났을 때 음식을 주는 것은 쉽고 빠른 \u003cb class=\"key\">진정\u003c/b> 방법입니다.\u003c/li>\u003cli>음식은 아이의 초점을 화난 것에서 다른 곳으로 돌려 화난 일을 \u003cb class=\"key\">잊게\u003c/b> 합니다.\u003c/li>\u003cli>사탕이나 초콜릿 같은 간식은 아이를 더 행복하게 하므로 \u003cb class=\"key\">단기적\u003c/b>으로는 효과적입니다.\u003c/li>\u003cli>하지만 \u003cb class=\"key\">장기적\u003c/b>으로 아이는 부정적인 감정을 보이면 간식을 받는다고 생각해 음식에 의존하게 됩니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Giving children food to calm them down is effective in the short term, but in the longer term it can be harmful because they may learn to depend on snacks whenever they feel bad.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">아이들이 화가 났을 때 음식을 주는 것은 쉽고 빠른 진정 방법이며 \u003cb class=\"key\">단기적\u003c/b>으로는 효과적이다. 그러나 \u003cb class=\"key\">장기적\u003c/b>으로 아이는 부정적인 감정을 보이면 간식을 받는다고 생각하게 되어, 기분이 나쁘거나 지루할 때도 음식을 원하게 되므로 \u003cb class=\"key\">해로울\u003c/b> 수 있다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":42,"text":"오늘 지문은 음식으로 아이를 달래는 방법을 단기와 장기로 나눠서 판단한 글이었어요. 단기적으로는 효과적이지만 장기적으로는 감정을 음식으로 해결하는 습관이 생길 수 있다는 점이 핵심이에요. 시험에서는 But 뒤에 오는 주제문과 단기와 장기 기준을 구분하는 신호어를 꼭 확인하세요. 오늘도 수고 많았어요, 다음 시간에 또 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
