<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터1 Reading 15 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터1 Reading 15","audioDir":"15_audio","preview":false,"count":51,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.668em\">Reading\u003cbr>15\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터1\u003c/div>\u003ch1>Name Our New Study Cafe!\u003c/h1>\u003ch2>우리 새 스터디 카페 이름을 지어 주세요\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>우리 학교에 내년에 문을 여는 \u003cb class=\"key\">스터디 \u003c/b>\u003cb class=\"key\">카페\u003c/b>의 이름을 공모하는 안내문으로, 학생 누구나 \u003cb class=\"key\">10월 \u003c/b>\u003cb class=\"key\">1일\u003c/b>부터 11월 30일까지 QR 코드로 이름과 의미를 제출할 수 있고 수상자에게는 태블릿 PC 등의 \u003cb class=\"key\">선물\u003c/b>이 주어진다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Our school is holding a naming contest for its new study cafe, and any student can submit a name with its meaning by November 30.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 볼 지문은 우리 학교 스터디 카페의 이름을 짓는 이름 짓기 대회 안내문이에요. 짧아 보이지만 참가 대상과 기간, 방법, 상품까지 꼼꼼하게 챙겨야 할 정보가 가득한 글이죠. 이 글의 요지는 우리 학교 학생 누구나 새로 생기는 스터디 카페의 이름을 제출할 수 있다는 것이에요. 그럼 힘차게 시작해 볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">스터디 카페(study cafe)는 카페처럼 편안한 분위기에서 공부할 수 있도록 만든 공간이에요. 도서관처럼 조용하기만 한 곳보다, 음료를 마시며 \u003cb class=\"key\">집중\u003c/b>할 수 있어 최근 학교나 동네에 자주 생기고 있죠. 이렇게 새 공간이나 제품의 이름을 정하는 과정을 \u003cb class=\"key\">네이밍(naming)\u003c/b>이라고 해요. 이름은 그 공간의 성격과 \u003cb class=\"key\">정체성\u003c/b>을 한마디로 보여 주는 얼굴과 같아서, 짧고 기억하기 쉬우면서 의미가 분명해야 해요. 그래서 많은 기업이 새 제품을 낼 때 \u003cb class=\"key\">공모전(contest)\u003c/b>을 열어 다양한 아이디어를 모은답니다. 마치 반 단톡방에서 체육대회 구호를 함께 정할 때 모두의 의견을 모으는 것과 비슷해요.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식부터 짚어 볼게요. 스터디 카페, 영어로 study cafe는 카페처럼 편안한 분위기에서 공부할 수 있도록 만든 공간이에요. 도서관처럼 조용하기만 한 곳보다, 음료를 마시며 집중할 수 있어서 요즘 학교나 동네에 자주 생기고 있죠. 이렇게 새로운 공간이나 제품의 이름을 정하는 과정을 네이밍, 영어로 naming이라고 해요. 이름은 그 공간의 정체성을 한마디로 보여 주는 얼굴과 같아서, 짧고 기억하기 쉬우면서 의미가 분명해야 해요. 그래서 기업들도 새 제품을 낼 때 공모전, contest를 열어 다양한 아이디어를 모은답니다. 여러분 반에서 체육대회 구호를 함께 정할 때 모두의 의견을 모으는 것과 비슷하다고 생각하면 아주 쉬워요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>대회 소개\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>글은 \u003cb class=\"key\">이름 \u003c/b>\u003cb class=\"key\">짓기 \u003c/b>\u003cb class=\"key\">대회\u003c/b>를 알리는 문구로 시작해요. 읽는 사람에게 자신의 열정과 창의성을 보여 달라고 요청하죠. 그리고 이 대회에서 뽑는 이름이 다름 아닌 우리 학교 \u003cb class=\"key\">스터디 \u003c/b>\u003cb class=\"key\">카페\u003c/b>의 이름이라는 점이 세 번째 문장에서 밝혀져요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>공간 소개\u003csmall>근거 · 문장 4–7\u003c/small>\u003c/h4>\u003cp>이어서 새 공간이 \u003cb class=\"key\">내년\u003c/b>에 문을 연다는 개장 시점이 나와요. 이 공간은 \u003cb class=\"key\">학생들만\u003c/b> 사용할 수 있고, 학생들은 혼자 또는 그룹으로 공부할 수 있어요. 때때로 여기서 놀 수도 있다는 점까지 알려 주며 공간의 쓰임을 설명하죠.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>참가 대상과 혜택\u003csmall>전환 · 문장 8–10\u003c/small>\u003c/h4>\u003cp>그다음 참가 조건이 제시돼요. 우리 학교 학생이라면 \u003cb class=\"key\">누구나\u003c/b> 이 대회에 참가할 수 있다고 하면서 많은 참여를 바라죠. 그리고 수상자들에게는 멋진 \u003cb class=\"key\">선물\u003c/b>을 주겠다는 혜택까지 알려 주어 참여를 부추겨요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>제출 기간과 상품\u003csmall>결론 · 문장 11–13\u003c/small>\u003c/h4>\u003cp>마지막으로 구체적인 안내가 이어져요. 이름은 \u003cb class=\"key\">10월 \u003c/b>\u003cb class=\"key\">1일\u003c/b>부터 11월 30일까지 제출할 수 있다는 기간이 나오고, \u003cb class=\"key\">QR \u003c/b>\u003cb class=\"key\">코드\u003c/b>로 이름과 의미를 함께 게시하는 방법이 제시돼요. 이어서 상품과 수상자 \u003cb class=\"key\">발표\u003c/b> 일정까지 정리되며 글이 마무리돼요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 네 단계로 나누어 천천히 따라가 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 대회 소개예요. 글은 이름 짓기 대회를 알리는 문구로 시작하면서, 읽는 사람에게 자신의 열정과 창의성을 보여 달라고 요청하죠. 그리고 이 대회에서 뽑는 이름이 바로 우리 학교 스터디 카페의 이름이라는 점을 세 번째 문장에서 밝혀요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 공간 소개예요. 이 새로운 공간이 내년에 문을 연다는 개장 시점이 먼저 나오고, 학생들만 이 공간을 사용할 수 있다는 조건이 이어져요. 학생들은 혼자 또는 그룹으로 공부할 수 있고, 때때로 여기서 놀 수도 있다는 점까지 알려 주며 공간의 쓰임을 설명해요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 참가 대상과 혜택이에요. 우리 학교 학생이라면 누구나 이 대회에 참가할 수 있다고 하면서 많은 참여를 바라죠. 그리고 수상자들에게는 멋진 선물을 주겠다는 혜택까지 알려 주어서 학생들의 참여를 부추겨요.","hl":"f2"},{"n":7,"text":"네 번째 단계는 제출 기간과 상품 안내예요. 이름은 시월 일일부터 십일월 삼십일까지 제출할 수 있다는 기간이 나오고, QR 코드로 이름과 의미를 함께 게시하는 방법이 제시돼요. 이어서 일등부터 삼등까지 상품과 수상자 발표 일정까지 정리되면서 글이 마무리된답니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">분류(항목별 안내)\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 첫 문장에서 \u003cb class=\"key\">이름 \u003c/b>\u003cb class=\"key\">짓기 \u003c/b>\u003cb class=\"key\">대회\u003c/b>라는 핵심 소재를 먼저 던지고, 뒤에서 대상·기간·방법·상품을 \u003cb class=\"key\">항목별\u003c/b>로 나누어 설명해요. 각 항목이 서로 다른 정보를 담고 있어 분류의 방식으로 짜였죠. 제목과 도입부에서 대회의 목적이 먼저 제시되므로 \u003cb class=\"key\">두괄식\u003c/b>이라고 볼 수 있어요. 덕분에 필요한 정보만 골라 빠르게 찾아 읽기에 알맞은 안내문 구조예요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Show (1)\u003c/b>\u003cspan>요청·도입\u003c/span>\u003cb>Only (5)\u003c/b>\u003cspan>범위 제한\u003c/span>\u003cb>Any (8)\u003c/b>\u003cspan>대상 확대\u003c/span>\u003cb>How (12)\u003c/b>\u003cspan>방법 제시\u003c/span>\u003cb>Prize (13)\u003c/b>\u003cspan>결과·보상 안내\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">the study cafe\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">this new space\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">this space\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">here\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 항목별 분류예요. 대상, 기간, 방법, 상품처럼 서로 다른 정보를 항목별로 나누어 차례로 안내하고 있죠. 그리고 제목과 첫 문장에서 대회의 목적을 먼저 밝히고 있으니 두괄식 구조라고 볼 수 있어요. 덕분에 필요한 정보만 골라서 빠르게 찾아 읽기에 아주 알맞은 글이에요.","hl":"ty"},{"n":9,"text":"신호어도 눈에 띄어요. 다섯 번째 문장의 only는 사용 범위를 학생으로 좁혀 주고, 여덟 번째 문장의 any는 참가 대상을 우리 학교 학생 전체로 넓혀 주죠. 열두 번째 문장의 How는 방법을, 열세 번째 문장의 Prize는 결과와 보상을 알려 주는 신호예요. 이렇게 정보를 나누는 신호어를 표시하면서 읽으면 내용이 훨씬 또렷하게 정리돼요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>naming\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이름 짓기, 작명\u003c/span>\u003c/div>\u003cdiv>\u003cb>contest\u003c/b>\u003cem>명사\u003c/em>\u003cspan>대회, 경연\u003c/span>\u003c/div>\u003cdiv>\u003cb>passion\u003c/b>\u003cem>명사\u003c/em>\u003cspan>열정\u003c/span>\u003c/div>\u003cdiv>\u003cb>creativity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>창의성\u003c/span>\u003c/div>\u003cdiv>\u003cb>create\u003c/b>\u003cem>동사\u003c/em>\u003cspan>만들다, 창조하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>study cafe\u003c/b>\u003cem>명사\u003c/em>\u003cspan>스터디 카페(공부 카페)\u003c/span>\u003c/div>\u003cdiv>\u003cb>space\u003c/b>\u003cem>명사\u003c/em>\u003cspan>공간\u003c/span>\u003c/div>\u003cdiv>\u003cb>alone\u003c/b>\u003cem>부사\u003c/em>\u003cspan>혼자서\u003c/span>\u003c/div>\u003cdiv>\u003cb>in groups\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>그룹으로, 무리 지어\u003c/span>\u003c/div>\u003cdiv>\u003cb>take part in\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 참가하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>participate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>참여하다, 참가하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>hope\u003c/b>\u003cem>동사\u003c/em>\u003cspan>바라다, 희망하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>gift\u003c/b>\u003cem>명사\u003c/em>\u003cspan>선물\u003c/span>\u003c/div>\u003cdiv>\u003cb>winner\u003c/b>\u003cem>명사\u003c/em>\u003cspan>수상자, 우승자\u003c/span>\u003c/div>\u003cdiv>\u003cb>submit\u003c/b>\u003cem>동사\u003c/em>\u003cspan>제출하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>meaning\u003c/b>\u003cem>명사\u003c/em>\u003cspan>의미, 뜻\u003c/span>\u003c/div>\u003cdiv>\u003cb>post\u003c/b>\u003cem>동사\u003c/em>\u003cspan>게시하다, 올리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>through\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~을 통해\u003c/span>\u003c/div>\u003cdiv>\u003cb>prize\u003c/b>\u003cem>명사\u003c/em>\u003cspan>상, 상품\u003c/span>\u003c/div>\u003cdiv>\u003cb>first place\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>일등, 1위\u003c/span>\u003c/div>\u003cdiv>\u003cb>announcement\u003c/b>\u003cem>명사\u003c/em>\u003cspan>발표, 공고\u003c/span>\u003c/div>\u003cdiv>\u003cb>tablet\u003c/b>\u003cem>명사\u003c/em>\u003cspan>태블릿 PC\u003c/span>\u003c/div>\u003cdiv>\u003cb>earphones\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이어폰\u003c/span>\u003c/div>\u003cdiv>\u003cb>movie ticket\u003c/b>\u003cem>명사\u003c/em>\u003cspan>영화 티켓(관람권)\u003c/span>\u003c/div>\u003cdiv>\u003cb>open\u003c/b>\u003cem>동사\u003c/em>\u003cspan>문을 열다, 개장하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>only\u003c/b>\u003cem>부사\u003c/em>\u003cspan>오직, 단지\u003c/span>\u003c/div>\u003cdiv>\u003cb>sometimes\u003c/b>\u003cem>부사\u003c/em>\u003cspan>때때로, 가끔\u003c/span>\u003c/div>\u003cdiv>\u003cb>any\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>어떤 ~라도, 어느 누구의\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"단어도 몇 개만 짚어 볼게요. passion은 열정, creativity는 창의성이라는 뜻이에요. participate는 참여하다, submit은 제출하다라는 뜻이고, announcement는 발표나 공고를 말해요. 이름을 올린다는 뜻의 post도 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">contest\u003c/b>\u003cspan class=\"m\">대회, 경연\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">competition\u003c/span>\u003cspan class=\"s\">match\u003c/span>\u003cspan class=\"s\">tournament\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">passion\u003c/b>\u003cspan class=\"m\">열정\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">enthusiasm\u003c/span>\u003cspan class=\"s\">zeal\u003c/span>\u003cspan cb class=\"w\">announcement\u003c/b>\u003cspan class=\"m\">발표, 공고\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">declaration\u003c/span>\u003cspan class=\"s\">notice\u003c/span>\u003cspan class=\"s\">release\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">concealment\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"핵심 어휘는 동의어와 반의어로 묶어서 기억하면 좋아요. contest는 competition이나 match로 바꿔 쓸 수 있고, passion은 enthusiasm이나 zeal과 가까워요. creativity는 imagination이나 originality로 바꿔 말할 수 있죠. participate는 take part in이나 join으로 표현할 수 있고, 반대로 withdraw는 참여하지 않고 물러난다는 뜻이에요. submit은 hand in이나 turn in으로 쓸 수 있고, winner는 champion이나 victor와 같은 말이에요. 반대말인 loser도 함께 기억해 두면 좋겠죠.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이름 짓기 대회\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Naming \u003c/span>\u003cspan class=\"tgt\">Contest\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분의 열정을 보여 주세요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">Show\u003c/span> your \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">passion \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 창의성을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">creativity\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이름 짓기 대회 여러분의 열정과 창의성을 보여 주세요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 대회의 제목과 참여를 독려하는 \u003cb class=\"key\">명령문\u003c/b>이 이어지는 문장이에요. \u003cb class=\"key\">이름 \u003c/b>\u003cb class=\"key\">짓기 \u003c/b>\u003cb class=\"key\">대회\u003c/b>에서 학생들에게 \u003cb class=\"key\">열정과 \u003c/b>\u003cb class=\"key\">창의성\u003c/b>을 보여 달라고 요청하며, 글의 화제를 제시하고 참여를 유도해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사 + 명사 복합명사\u003c/span> : [동명사 Naming] + [명사 Contest] : \"이름 짓기 대회\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명령문\u003c/span> : [동사원형 Show] + [목적어 your passion and creativity] : \"보여 주세요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">명사구의 병렬\u003c/span> : [passion] + and + [creativity] : \"열정과 창의성\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Naming Contest, 이름 짓기 대회. Show your passion, 여러분의 열정을 보여 주세요. and creativity, 그리고 창의성을. 이 문장 전체를 해석하면, 이름 짓기 대회 여러분의 열정과 창의성을 보여 주세요.","hl":"m"},{"n":13,"text":"이 문장은 대회의 제목과 참여를 독려하는 명령문이 이어져요. 이름 짓기 대회에서 학생들에게 열정과 창의성을 보여 달라고 요청하면서 글의 화제를 제시하고 참여를 유도하죠.","hl":"mn"},{"n":14,"text":"첫째, Naming Contest에서 Naming은 이름을 짓는다는 뜻의 동명사로 쓰였고 Contest와 결합해 복합명사 이름 짓기 대회를 만들어요. 둘째, Show로 시작하는 부분은 동사원형으로 상대에게 행동을 요구하는 명령문이에요. 목적어 your passion and creativity를 통해 무엇을 보여 달라는지 밝히죠. 셋째, passion and creativity에서는 and가 passion과 creativity를 대등하게 연결하는 병렬 구조를 만들어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만들어 주세요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Please \u003c/span>\u003cspan class=\"tgt\">create\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">최고의 이름을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">best \u003c/span>\u003cspan class=\"tgt\">name\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">최고의 이름을 만들어 주세요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 공손하게 부탁하는 \u003cb class=\"key\">명령문\u003c/b>으로, 대회 참가자들에게 \u003cb class=\"key\">최고의 \u003c/b>\u003cb class=\"key\">이름\u003c/b>을 만들어 달라고 요청해요. 앞의 대회 안내를 이어 받아 구체적인 과제를 제시하는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">Please를 이용한 공손한 명령문\u003c/span> : [Please] + [동사원형 create] + [목적어] : \"만들어 주세요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">최상급 형용사 + 명사\u003c/span> : [the + 최상급 best] + [명사 name] : \"최고의 이름\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Please create, 만들어 주세요. the best name, 최고의 이름을. 이 문장 전체를 해석하면, 최고의 이름을 만들어 주세요.","hl":"m"},{"n":16,"text":"이 문장은 공손하게 부탁하는 명령문으로 대회 참가자들에게 최고의 이름을 만들어 달라고 요청해요. 앞의 대회 안내를 이어 받아 구체적인 과제를 제시하는 역할을 하죠.","hl":"mn"},{"n":17,"text":"첫째, Please create는 Please가 공손한 명령의 분위기를 만들어 주고 뒤에 동사원형 create가 오는 구조예요. 둘째, the best name에서는 the와 최상급 best가 함께 쓰여 여러 이름 중 가장 좋은 이름이라는 뜻을 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 이름은\u003c/span>\u003cspan class=\"en\">The name\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~을 위한 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">for\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">스터디 카페\u003c/span>\u003cspan class=\"en\">the study cafe\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 학교의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">school\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리 학교 스터디 카페 이름입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이름 "en\">\u003cspan class=\"tgt\">or \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그룹으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">groups\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">학생들은 혼자 또는 그룹으로 공부할 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 공간에서 가능한 공부 방식을 두 가지로 제시하는 문장이에요. \u003cb class=\"key\">alone\u003c/b>과 \u003cb class=\"key\">in \u003c/b>\u003cb class=\"key\">groups\u003c/b>를 or로 묶어 혼자든 함께든 자유롭게 쓸 수 있다는 점을 알려 주죠. 앞의 '학생만 사용 가능'이라는 규정에 \u003cb class=\"key\">이용 \u003c/b>\u003cb class=\"key\">방식\u003c/b>을 덧붙여 공간의 쓰임을 구체화합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 can + 동사원형\u003c/span> : [[주어]] + can + [동사원형] : \"공부할 수 있습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">or를 이용한 병렬 구조\u003c/span> : [부사 alone] + or + [전치사구 in groups] : \"혼자 또는 그룹으로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 in + 복수명사(양태)\u003c/span> : in + [복수명사] : \"그룹으로, 모둠으로\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Students can study, 학생들은 공부할 수 있습니다. alone, 혼자. or, 또는. in groups, 그룹으로. 이 문장 전체를 해석하면, 학생들은 혼자 또는 그룹으로 공부할 수 있습니다.","hl":"m"},{"n":28,"text":"이 문장은 이 공간에서 공부하는 두 가지 방식을 보여 줘요. alone, 혼자서 공부할 수도 있고 in groups, 그룹으로 함께 공부할 수도 있다는 거죠. 앞에서 학생만 쓸 수 있다고 한 규정에 이용 방식을 덧붙여서 공간의 쓰임을 더 구체적으로 알려 주는 문장이에요.","hl":"mn"},{"n":29,"text":"첫 번째, can study에서 can은 조동사라서 뒤에 동사원형 study가 오고, 여기서는 공부해도 된다는 허가의 의미예요. 두 번째, alone or in groups에서 or는 두 가지 선택지를 이어 주는 등위접속사이고, 부사와 전치사구가 같은 방식이라는 자리에서 병렬로 묶여요. 세 번째, in groups의 in은 그룹이라는 양태로 쓰였고, groups가 복수라서 여러 명이 함께하는 모둠 활동을 나타냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 13\u003c/div>\u003cdiv data-hl= c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">through \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">QR \u003c/span>\u003cspan class=\"tgt\">code\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">방법: QR 코드로 이름과 의미를 함께 게시하세요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 공모전에 참여하는 \u003cb class=\"key\">방법\u003c/b>을 안내하는 문장이에요. 이름과 그 의미를 \u003cb class=\"key\">QR \u003c/b>\u003cb class=\"key\">코드\u003c/b>로 게시하라고 해서, 참가자가 실제로 해야 할 행동을 구체적으로 알려 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문\u003c/span> : [동사원형] + 목적어 : \"게시하세요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 with의 동반 용법\u003c/span> : with + [명사구] : \"그 의미와 함께\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 through의 수단 용법\u003c/span> : through + [수단/경로] : \"QR 코드를 통해\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"How, 방법:. Post, 게시하세요. a name, 이름을. with its meaning, 그 의미와 함께. through a QR code, QR 코드를 통해. 이 문장 전체를 해석하면, 방법: QR 코드로 이름과 의미를 함께 게시하세요.","hl":"m"},{"n":46,"text":"이 문장은 공모전에 참여하는 방법을 안내해요. 이름과 그 의미를 QR 코드로 게시하라고 해서 참가자가 실제로 해야 할 행동을 구체적으로 알려 줘요.","hl":"mn"},{"n":47,"text":"첫 번째 어법 포인트는 명령문이에요. 주어 You를 생략하고 동사원형으로 시작해 명령을 나타내요. 두 번째는 전치사 with가 동반의 의미로 쓰인 점이고, 세 번째는 전치사 through가 수단을 나타낸다는 점이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상품:\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Prize:\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1등 (1명)\u003c/span>\u003cspan class=\"en\">1st Place (1 person)\u003c/span>\u003c/ (1 person), 1등 (1명). – tablet, – 태블릿 PC. 2nd Place (2 people) – earphones, 2등 (2명) – 이어폰. 3rd Place (3 people) – movie ticket, 3등 (3명) – 영화 티켓. Announcement of Winners, 수상자 발표:. December 7, 12월 7일. 이 문장 전체를 해석하면, 상품: 1등 (1명) - 태블릿 PC 2등 (2명) - 이어폰 3등 (3명) - 영화 티켓 수상자 발표: 12월 7일","hl":"m"},{"n":49,"text":"이 문장은 이름 공모전의 상품과 수상자 발표 일정을 안내하는 부분이에요. 독자에게 구체적인 보상을 제시해 공모전 참여를 독려하고, 결과를 언제 확인할 수 있는지까지 분명히 알려 줍니다.","hl":"mn"},{"n":50,"text":"어법 포인트를 짚어 볼게요. 첫 번째로 Prize 뒤의 콜론은 뒤에 상품 목록이 이어진다는 표지예요. 항목명과 내용을 한눈에 구분하게 해 주죠. 두 번째로 Announcement of Winners에서 of는 앞의 명사 announcement와 뒤의 대상 Winners를 연결해 수상자 발표라는 관계를 만들어요. 세 번째로 December seventh 같은 날짜는 월 뒤에 일을 붙여 간결하게 표기한다는 점도 기억해 두세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>우리 학교는 내년에 문을 여는 \u003cb class=\"key\">스터디 \u003c/b>\u003cb class=\"key\">카페\u003c/b>의 이름을 짓는 대회를 연다.\u003c/li>\u003cli>이 공간은 \u003cb class=\"key\">학생들만\u003c/b> 사용할 수 있고, 학생들은 혼자 또는 그룹으로 공부하거나 때때로 여기서 놀 수도 있다.\u003c/li>\u003cli>우리 학교 학생이라면 \u003cb class=\"key\">누구나\u003c/b> 이 대회에 참가할 수 있고, 수상자에게는 태블릿 PC 같은 멋진 선물이 주어진다.\u003c/li>\u003cli>이름은 \u003cb class=\"key\">10월 \u003c/b>\u003cb class=\"key\">1일\u003c/b>부터 11월 30일까지 QR 코드로 이름과 의미를 함께 게시해 제출하고, 수상자는 12월 7일에 발표된다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Our school is holding a naming contest for its new study cafe, and any student can submit a name with its meaning by November 30.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">우리 학교에 내년에 문을 여는 \u003cb class=\"key\">스터디 \u003c/b>\u003cb class=\"key\">카페\u003c/b>의 이름을 공모하는 안내문으로, 학생 누구나 \u003cb class=\"key\">10월 \u003c/b>\u003cb class=\"key\">1일\u003c/b>부터 11월 30일까지 QR 코드로 이름과 의미를 제출할 수 있고 수상자에게는 태블릿 PC 등의 \u003cb class=\"key\">선물\u003c/b>이 주어진다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":51,"text":"오늘 배운 내용을 정리해 볼게요. 이 글은 우리 학교 스터디 카페의 이름을 공모하는 안내문이었고, 학생 누구나 참여할 수 있다는 점이 핵심이에요. 제출 기간과 방법, 상품과 발표일까지 항목별로 정리해 두면 정보를 찾는 문제도 쉽게 풀 수 있어요. 오늘도 수고했어요, 다음 시간에 또 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
