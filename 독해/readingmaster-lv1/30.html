<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터1 Reading 30 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터1 Reading 30","audioDir":"30_audio","preview":false,"count":43,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.668em\">Reading\u003cbr>30\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터1\u003c/div>\u003ch1>Caffeine Helps You Wake Up, but It Cannot Replace Sleep\u003c/h1>\u003ch2>카페인은 잠을 깨워 주지만, 수면을 대신할 수는 없다\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>카페인은 하루 종일 깨어 있게 하고 반응을 빠르게 하며 두통 완화에도 효과적이지만, \u003cb class=\"key\">숙면\u003c/b>을 대신할 수는 없다. 수면 부족은 카페인으로 \u003cb class=\"key\">완전히 \u003c/b>\u003cb class=\"key\">보충\u003c/b>되지 않으므로, 일을 더 잘하기 위해서는 커피보다 \u003cb class=\"key\">수면\u003c/b>이 더 필요하다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Caffeine helps you stay awake and alert, but it cannot take the place of a good night's sleep.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"여러분, 안녕하세요. 오늘은 리딩마스터 원, 레슨 서른에 나오는 카페인과 수면에 관한 지문을 함께 읽어 볼 거예요. 이 글은 카페인이 정말 우리를 깨워 주는지, 그리고 그것이 잠을 대신할 수 있는지 따져 보는 글이죠. 요약하면 카페인은 각성과 두통 완화에는 도움이 되지만 숙면을 대신할 수는 없다는 것, 그래서 일을 잘하려면 커피보다 수면이 더 필요하다는 것이 오늘의 요지입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">카페인의 각성 효과는 뇌 속 \u003cb class=\"key\">아데노신\u003c/b>(adenosine)이라는 수면 유도 물질이 수용체에 붙는 것을 막기 때문에 생긴다. 그래서 카페인을 마시면 졸음을 부르는 신호가 차단되어 \u003cb class=\"key\">각성\u003c/b> 상태가 유지된다. 그러나 카페인은 잠을 새로 만들어 주는 것이 아니라 졸음을 가려 주는 것뿐이라, 쌓여 있는 \u003cb class=\"key\">수면 \u003c/b>\u003cb class=\"key\">부족\u003c/b>(sleep debt)이 사라지는 것은 아니다. 실제로 잠이 부족하면 주의 집중력(attention)과 판단력이 떨어져 실수가 늘어난다. 이것은 배터리가 거의 다 된 휴대폰에 충전기를 꽂지 않고 화면 밝기만 낮추는 것과 비슷하다. 즉 카페인은 \u003cb class=\"key\">임시방편\u003c/b>이고, 진짜 회복은 잠에서 온다.\u003c/div>","segs":[{"n":2,"text":"카페인은 뇌에서 아데노신이라는 수면 유도 물질이 수용체에 붙는 것을 막아요. 그래서 졸음을 부르는 신호가 차단되고 각성 상태가 유지되는 거죠. 하지만 카페인은 잠을 만들어 주는 게 아니라 졸음을 가리는 것뿐이라서, 쌓인 수면 부족이 사라지지는 않습니다. 잠이 부족하면 집중력과 판단력이 떨어져서 실수가 늘어나게 되죠. 배터리가 거의 다 된 휴대폰에 충전기를 꽂지 않고 화면만 어둡게 하는 것과 비슷해요. 그래서 카페인은 임시방편이고, 진짜 회복은 잠에서 온다고 정리할 수 있습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>도입 질문\u003csmall>도입 · 문장 1\u003c/small>\u003c/h4>\u003cp>글은 커피 한 잔이 여러분을 깨우는 데 도움이 될 수 있다고 생각하는가라는 \u003cb class=\"key\">질문\u003c/b>으로 시작한다. 독자 모두가 겪어 본 경험을 건드리면서 카페인이라는 \u003cb class=\"key\">화제\u003c/b>로 자연스럽게 들어간다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>카페인의 효능\u003csmall>통념 · 문장 2–4\u003c/small>\u003c/h4>\u003cp>대부분의 연구는 카페인이 하루 종일 \u003cb class=\"key\">각성\u003c/b>을 유지하도록 돕는다고 말한다. 적은 양의 카페인도 \u003cb class=\"key\">반응 \u003c/b>\u003cb class=\"key\">속도\u003c/b>를 빠르게 하고, 약과 함께 쓰면 \u003cb class=\"key\">두통 \u003c/b>\u003cb class=\"key\">완화\u003c/b>에도 효과적이다. 앞부분은 이렇게 카페인의 좋은 점을 나열하며 카페인은 좋은 것이라는 \u003cb class=\"key\">통념\u003c/b>을 쌓아 올린다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>그러나 숙면은 못 된다\u003csmall>전환 · 문장 5\u003c/small>\u003c/h4>\u003cp>However로 시작하는 문장에서 글의 방향이 \u003cb class=\"key\">전환\u003c/b>된다. 카페인의 효능이 아무리 커도 \u003cb class=\"key\">숙면\u003c/b>을 대신할 수는 없다는 것이 이 글의 \u003cb class=\"key\">주제문\u003c/b>이다. 앞에서 늘어놓은 칭찬은 이 주장을 도드라지게 하는 \u003cb class=\"key\">디딤돌\u003c/b> 역할을 한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>실험 근거\u003csmall>근거 · 문장 6–9\u003c/small>\u003c/h4>\u003cp>걱정이 많으면 숙면이 어렵다는 \u003cb class=\"key\">전제\u003c/b> 위에서, 한 연구는 카페인이 잠을 거의 자지 못한 사람들의 \u003cb class=\"key\">실수 \u003c/b>\u003cb class=\"key\">가능성\u003c/b>을 높인다고 보여 준다. 또한 카페인을 섭취한 뒤에도 충분히 잔 그룹보다 시험 \u003cb class=\"key\">점수\u003c/b>가 높지 않았다. 그래서 카페인은 수면 부족을 \u003cb class=\"key\">완전히 \u003c/b>\u003cb class=\"key\">보충\u003c/b>할 수 없다는 결론에 이른다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>결론\u003csmall>결론 · 문장 10\u003c/small>\u003c/h4>\u003cp>마지막 문장은 일을 더 잘하기 위해서는 커피보다 \u003cb class=\"key\">수면\u003c/b>이 더 필요하다고 정리한다. 카페인의 효용을 부정하지 않으면서 \u003cb class=\"key\">우선순위\u003c/b>를 수면에 둔다는 점이 핵심이다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 다섯 단계로 쭉 따라가 볼게요.","hl":null},{"n":4,"text":"글은 질문 하나로 문을 엽니다. 커피 한 잔이 여러분을 깨우는 데 도움이 될 수 있다고 생각하는가, 하고 말이죠. 이 질문은 우리 모두가 공감할 수 있는 경험이라서 독자를 자연스럽게 글 안으로 끌어들이고, 카페인이라는 화제로 우리를 데려갑니다.","hl":"f0"},{"n":5,"text":"이어서 카페인의 좋은 점이 나옵니다. 대부분의 연구는 카페인이 하루 종일 각성을 유지하도록 돕는다고 하고, 아주 적은 양의 카페인도 반응 속도를 더 빠르게 만든다고 해요. 또 약과 함께 사용하면 두통 완화에도 효과적이라고 합니다. 이 부분은 카페인은 좋은 것이라는 통념을 만들어 주는 대목이에요.","hl":"f1"},{"n":6,"text":"그런데 다섯 번째 문장에서 however가 나오면서 글이 전환됩니다. 카페인의 효능이 아무리 좋아도 숙면을 대신할 수는 없다는 것이 이 글의 주제문이에요. 앞에서 칭찬을 잔뜩 늘어놓은 이유는 바로 이 주장을 더 도드라지게 하려는 디딤돌이었던 거죠.","hl":"f2"},{"n":7,"text":"그럼 왜 그런지 근거를 봐야겠죠. 걱정이 많으면 숙면을 하기가 어렵다는 전제에서 출발해서, 한 연구는 카페인이 잠을 거의 자지 못한 사람들의 실수 가능성을 높인다는 것을 보여 줍니다. 또 카페인을 섭취한 뒤에도 충분히 잔 그룹보다 시험에서 높은 점수를 받지 못했어요. 그래서 카페인은 수면 부족을 완전히 보충할 수 없다는 결론에 이릅니다.","hl":"f3"},{"n":8,"text":"마지막 문장은 일을 더 잘하기 위해서는 커피보다 수면이 더 필요하다고 정리합니다. 카페인을 나쁘다고 몰아가는 게 아니라, 우선순위를 수면에 두라는 거예요. 여기서 글의 메시지가 깔끔하게 마무리됩니다.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">통념-반박\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 5번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 카페인의 효능을 나열하는 \u003cb class=\"key\">통념\u003c/b>으로 시작하지만, 다섯 번째 문장에서 However로 \u003cb class=\"key\">반박\u003c/b>하며 주제를 꺼낸다. 이어지는 6~9번 문장의 \u003cb class=\"key\">실험 \u003c/b>\u003cb class=\"key\">근거\u003c/b>가 그 주장을 뒷받침하고, 마지막 문장이 결론으로 마무리한다. 주제문이 글의 \u003cb class=\"key\">가운데\u003c/b>에 놓여 있으므로 중괄식으로 볼 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>However (5)\u003c/b>\u003cspan>전환·반박\u003c/span>\u003cb>even (3)\u003c/b>\u003cspan>강조\u003c/span>\u003cb>Also (8)\u003c/b>\u003cspan>근거 추가\u003c/span>\u003cb>Therefore (9)\u003c/b>\u003cspan>결론 도출\u003c/span>\u003cb>more than (10)\u003c/b>\u003cspan>비교·강조\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">cannot take the place of a good night's sleep\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">cannot fully make up for not having enough sleep\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">you need sleep more than coffee\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>카페인(Caffeine)\u003c/th>\u003cth>수면(Sleep)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>일시적으로 각성 상태를 유지시킴\u003c/td>\u003ctd>부족한 잠을 근본적으로 회복시킴\u003c/td>\u003c/tr>\u003ctr>\u003ctd>수면 부족 시 실수 가능성을 높임\u003c/td>\u003ctd>실수를 줄이고 시험 점수를 높여 줌\u003c/td>\u003c/tr>\u003ctr>\u003ctd>숙면을 대신할 수 없음\u003c/td>\u003ctd>일을 더 잘하게 하는 진짜 해결책\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글의 전개 방식은 통념과 반박입니다. 카페인의 효능을 나열하면서 통념을 쌓아 올린 다음, however로 반박하며 주제를 꺼내죠. 주제문이 글의 가운데에 놓여 있으니까 중괄식 구조로 보면 됩니다. 앞의 통념과 뒤의 실험 근거가 주제문 하나를 사이에 두고 짝을 이루는 모양이에요.","hl":"ty"},{"n":10,"text":"신호어를 잘 보세요. 다섯 번째 문장의 however는 앞의 통념을 뒤집는 전환 신호입니다. 여덟 번째 문장의 also는 근거를 하나 더 붙인다는 표시이고, 아홉 번째 문장의 therefore는 앞의 근거들을 묶어 결론을 끌어내는 신호예요. 그리고 마지막 문장은 숙면을 대신할 수 없다는 주제를 커피보다 수면이 필요하다는 말로 다시 진술하고 있습니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>wake up\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>깨어나다, 잠을 깨다\u003c/span>\u003c/div>\u003cdiv>\u003cb>most\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>대부분의\u003c/span>\u003c/div>\u003cdiv>\u003cb>study\u003c/b>\u003cem>명사\u003c/em>\u003cspan>연구\u003c/span>\u003c/div>\u003cdiv>\u003cb>caffeine\u003c/b>\u003cem>명사\u003c/em>\u003cspan>카페인\u003c/span>\u003c/div>\u003cdiv>\u003cb>stay awake\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>깨어 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>all day long\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>하루 종일\u003c/span>\u003c/div>\u003cdiv>\u003cb>even\u003c/b>\u003cem>부사\u003c/em>\u003cspan>심지어\u003c/span>\u003c/div>\u003cdiv>\u003cb>react\u003c/b>\u003cem>동사\u003c/em>\u003cspan>반응하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>fast\u003c/b>\u003cem>부사\u003c/em>\u003cspan>빠르게\u003c/span>\u003c/div>\u003cdiv>\u003cb>effective\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>효과적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>relieve\u003c/b>\u003cem>동사\u003c/em>\u003cspan>완화하다, 덜어 주다\u003c/span>\u003c/div>\u003cdiv>\u003cb>headache\u003c/b>\u003cem>명사\u003c/em>\u003cspan>두통\u003c/span>\u003c/div>\u003cdiv>\u003cb>together with\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~와 함께\u003c/span>\u003c/div>\u003cdiv>\u003cb>medicine\u003c/b>\u003cem>명사\u003c/em>\u003cspan>약, 의약품\u003c/span>\u003c/div>\u003cdiv>\u003cb>however\u003c/b>\u003cem>부사\u003c/em>\u003cspan>그러나\u003c/span>\u003c/div>\u003cdiv>\u003cb>take the place of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 대신하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>sleep\u003c/b>\u003cem>명사\u003c/em>\u003cspan>수면, 잠\u003c/span>\u003c/div>\u003cdiv>\u003cb>worry\u003c/b>\u003cem>동사\u003c/em>\u003cspan>걱정하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>increase\u003c/b>\u003cem>동사\u003c/em>\u003cspan>증가시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>chance\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가능성, 확률\u003c/span>\u003c/div>\u003cdiv>\u003cb>make a mistake\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>실수하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>score\u003c/b>\u003cem>명사\u003c/em>\u003cspan>점수\u003c/span>\u003c/div>\u003cdiv>\u003cb>test\u003c/b>\u003cem>명사\u003c/em>\u003cspan>시험, 검사\u003c/span>\u003c/div>\u003cdiv>\u003cb>group\u003c/b>\u003cem>명사\u003c/em>\u003cspan>집단, 그룹\u003c/span>\u003c/div>\u003cdiv>\u003cb>enough\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>충분한\u003c/span>\u003c/div>\u003cdiv>\u003cb>therefore\u003c/b>\u003cem>부사\u003c/em>\u003cspan>따라서\u003c/span>\u003c/div>\u003cdiv>\u003cb>fully\u003c/b>\u003cem>부사\u003c/em>\u003cspan>완전히\u003c/span>\u003c/div>\u003cdiv>\u003cb>make up for\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 보충하다, 만회하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>do one's work\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>일을 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>more than\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~보다 더\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"단어도 몇 개 짚고 갈게요. take the place of는 대신하다, make up for는 보충하다, relieve는 완화하다는 뜻입니다. effective는 효과적인, increase는 증가시키다는 의미이니 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">relieve\u003c/b>\u003cspan class=\"m\">완화하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">ease\u003c/span>\u003cspan class=\"s\">lessen\u003c/span>\u003cspan class=\"s\">alleviate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">worsen\u003c/span>\u003cspan class=\"a\">aggravate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">effective\u003c/b>\u003cspan class=\"m\">효과적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">useful\u003c/span>\u003cspan class=\"s\">efficient\u003c/span>\u003cspan class=\"s\">potent\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ineffective\u003c/span>\u003cspan class=\"a\">useless\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">increase\u003c/b>\u003cspan class=\"m\">증가시키다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">raise\u003c/span>\u003cspan class=\"s\">grow\u003c/span>\u003cspan class=\"s\">expand\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">decrease\u003c/span>\u003cspan class=\"a\">reduce\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">enough\u003c/b>\u003cspan class=\"m\">충분한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">sufficient\u003c/span>\u003cspan class=\"s\">adequate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">insufficient\u003c/span>\u003cspan class=\"a\">lacking\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">fully\u003c/b>\u003cspan class=\"m\">완전히\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">completely\u003c/span>\u003cspan class=\"s\">entirely\u003c/span>\u003cspan class=\"s\">totally\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">partially\u003c/span>\u003cspan class=\"a\">partly\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">however\u003c/b>\u003cspan class=\"m\">그러나\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">nevertheless\u003c/span>\u003cspan class=\"s\">nonetheless\u003c/span>\u003cspan class=\"s\">yet\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">therefore\u003c/span>\u003cspan class=\"a\">thus\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">mistake\u003c/b>\u003cspan class=\"m\">실수\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">error\u003c/span>\u003cspan class=\"s\">fault\u003c/span>\u003cspan class=\"s\">blunder\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">correction\u003c/span>\u003cspan class=\"a\">accuracy\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어도 정리해 볼게요. relieve는 ease나 alleviate로 바꿔 쓸 수 있고 반대말은 worsen입니다. increase의 동의어는 raise와 grow, 반의어는 decrease와 reduce예요. enough는 sufficient로 바꿀 수 있고 반대는 insufficient이며, fully는 completely나 entirely로 바꿀 수 있고 반대는 partially입니다. however는 nevertheless나 yet으로 바꿔 쓸 수 있다는 점도 함께 기억해 주세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은 생각하는가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Do \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">think\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">커피 한 잔이\u003c/span>\u003cspan class=\"en\">a cup of coffee\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분을 깨우는 데 도움이 될 수 있다고?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">help \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">wake \u003c/span>\u003cspan class=\"tgt\">up\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">커피 한 잔이 여러분을 깨우는 데 도움이 될 수 있다고 생각하는가?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 \u003cb class=\"key\">커피\u003c/b>가 잠을 깨는 데 도움을 줄 수 있는지 독자에게 묻는 \u003cb class=\"key\">도입 \u003c/b>\u003cb class=\"key\">질문\u003c/b>이에요. 일상적인 경험을 질문으로 던져 카페인의 효능이라는 \u003cb class=\"key\">주제\u003c/b>로 자연스럽게 이끌어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">think의 목적절을 묻는 의문문\u003c/span> : Do you think + [that이 생략된 목적절]? : \"…라고 생각하는가?\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 can + help + 목적어 + 원형부정사\u003c/span> : can + [help] + [목적어] + [(to) wake up] : \"여러분을 깨우는 데 도움이 될 수 있다\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"Do you think, 여러분은 생각하는가. a cup of coffee, 커피 한 잔이. can help you wake up?, 여러분을 깨우는 데 도움이 될 수 있다고?. 이 문장 전체를 해석하면, 커피 한 잔이 여러분을 깨우는 데 도움이 될 수 있다고 생각하는가?","hl":"m"},{"n":14,"text":"이 문장은 커피가 잠을 깨는 데 도움을 줄 수 있는지 묻는 도입 질문이에요. 일상적인 경험을 질문으로 던져 카페인의 효능이라는 주제로 자연스럽게 이끌죠.","hl":"mn"},{"n":15,"text":"첫 번째 어법 포인트는 Do you think인데, think 뒤에 that이 생략된 목적절이 와서 무엇을 생각하느냐를 묻는 의문문을 만들어요. 두 번째 어법 포인트는 can help you wake up인데, help는 목적격 보어로 원형부정사나 to부정사를 취하고, 앞의 can은 동사원형 help와 결합해 가능성을 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대부분의 연구에서는\u003c/span>\u003cspan class=\"en\">Most studies\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">that 이하를 보여 준다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">show \u003c/span>\u003cspan class=\"tgt\">that\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">카페인이 여러분을 깨어 있도록 돕는다고\u003c/span>\u003cspan class=\"en\">caffeine \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">helps \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">stay \u003c/span>\u003cspan class=\"tgt\">awake\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하루 종일\u003c/span>\u003cspan class=\"en\">all day long.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">대부분의 연구에서는 카페인이 여러분을 하루 종일 깨어 있도록 돕는다고 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 \u003cb class=\"key\">카페인\u003c/b>의 대표 효과로 \u003cb class=\"key\">하루 \u003c/b>\u003cb class=\"key\">종일 \u003c/b>\u003cb class=\"key\">깨어 \u003c/b>\u003cb class=\"key\">있기\u003c/b>를 제시하며 글의 첫 번째 근거를 만들어요. Most studies라고 해서 모든 연구가 아니라 \u003cb class=\"key\">대부분의 \u003c/b>\u003cb class=\"key\">연구\u003c/b>라는 범위를 밝혀 주장을 완화해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">타동사 show + that절(목적어)\u003c/span> : show + [that + 절] : \"that 이하를 보여 준다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">help + 목적어 + 원형부정사\u003c/span> : help + [목적어] + [동사원형(stay)] : \"여러분이 깨어 있도록 돕다\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"Most studies, 대부분의 연구에서는. show that, that 이하를 보여 준다. caffeine helps you stay awake, 카페인이 여러분을 깨어 있도록 돕는다고. all day long, 하루 종일. 이 문장 전체를 해석하면, 대부분의 연구에서는 카페인이 여러분을 하루 종일 깨어 있도록 돕는다고 한다.","hl":"m"},{"n":17,"text":"이 문장은 카페인의 대표 효과로 하루 종일 깨어 있기를 제시하며 글의 첫 번째 근거를 만들어요. Most studies라고 해서 모든 연구가 아니라 대부분의 연구라는 범위를 밝혀 주장을 완화하죠.","hl":"mn"},{"n":18,"text":"첫 번째 어법 포인트는 show that인데, show는 타동사라서 뒤에 that절이 와서 목적어 역할을 해요. 두 번째 어법 포인트는 helps you stay awake인데, help는 목적격 보어로 원형부정사를 취해 목적어가 깨어 있도록 돕는다는 뜻을 표현해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 심지어 단지\u003c/span>\u003cspan class=\"en\">And \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">even \u003c/span>\u003cspan class=\"tgt\">just\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">60mg의 카페인도\u003c/span>\u003cspan class=\"en\">60mg of caffeine\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분이 더 빠르게 반응하도록 만들 수 있다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">react \u003c/span>\u003cspan class=\"tgt\">faster\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그리고 심지어 60mg의 카페인도 여러분이 더 빠르게 반응하도록 만든다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 아주 적은 양의 카페인도 \u003cb class=\"key\">반응 \u003c/b>\u003cb class=\"key\">속도\u003c/b>를 높일 수 있음을 말해요. even과 just을 함께 써서 \u003cb class=\"key\">최소량\u003c/b>에서도 효과가 있다는 점을 \u003cb class=\"key\">강조\u003c/b>하며 앞 문장의 주장을 뒷받침해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">강조 부사 even과 just\u003c/span> : [even] + [just] + 수량 표현 : \"심지어 단지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 can + 사역동사 make + 목적어 + 원형부정사\u003c/span> : can + [make] + [목적어] + [동사원형(react)] : \"여러분이 더 빠르게 반응하도록 만들 수 있다\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"And even just, 그리고 심지어 단지. 60mg of caffeine, 60mg의 카페인도. can make you react faster, 여러분이 더 빠르게 반응하도록 만들 수 있다.. 이 문장 전체를 해석하면, 그리고 심지어 60mg의 카페인도 여러분이 더 빠르게 반응하도록 만든다.","hl":"m"},{"n":20,"text":"이 문장은 아주 적은 양의 카페인도 반응 속도를 높일 수 있음을 말해요. even과 just을 함께 써서 최소량에서도 효과가 있다는 점을 강조하며 앞 문장의 주장을 뒷받침하죠.","hl":"mn"},{"n":21,"text":"첫 번째 어법 포인트는 even just인데, even은 강조를 더하고 just는 단지라는 뜻으로 최소량도 효과가 있음을 부각해요. 두 번째 어법 포인트는 can make you react faster인데, make는 사역동사라 목적격 보어로 원형부정사 react를 취해요. 앞의 can은 동사원형 make와 결합해 가능성을 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">카페인은\u003c/span>\u003cspan class=\"en\">Caffeine\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또한 효과적이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">also \u003c/span>\u003cspan class=\"tgt\">effective\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">두통을 완화하는 데\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">relieving\u003c/span> headaches\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 사용될 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">used\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">약과 함께\u003c/span>\u003cspan class=\"en\">together with medicine.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">카페인은 약과 함께 사용되면 두통을 완화하는 데에도 효과적이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 카페인이 약과 함께 쓰일 때 두통 완화에 도움이 된다는 \u003cb class=\"key\">긍정적 \u003c/b>\u003cb class=\"key\">효과\u003c/b>를 덧붙이는 문장이에요. 앞의 각성 효과에 이어 카페인의 장점을 하나 더 제시하며, 특히 \u003cb class=\"key\">약과 \u003c/b>\u003cb class=\"key\">함께\u003c/b> 사용될 때라는 조건을 붙여 설명하죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사 + 형용사(주격보어)\u003c/span> : [주어] + is + [형용사 effective] : \"또한 효과적이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 for + 동명사\u003c/span> : for + [relieving (동명사)] : \"완화하는 데\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">시간 부사절 + 수동태\u003c/span> : when + [it] + [is + p.p.] : \"그것이 사용될 때\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"Caffeine, 카페인은. is also effective, 또한 효과적이다. for relieving headaches, 두통을 완화하는 데. when it is used, 그것이 사용될 때. together with medicine, 약과 함께. 이 문장 전체를 해석하면, 카페인은 약과 함께 사용되면 두통을 완화하는 데에도 효과적이다.","hl":"m"},{"n":23,"text":"이 문장은 카페인의 긍정적 효과를 하나 더 말하고 있어요. 특히 약과 함께 사용될 때 두통 완화에 도움이 된다는 점을 기억하세요.","hl":"mn"},{"n":24,"text":"첫 번째로 is also effective에서 effective는 주어 Caffeine의 상태를 설명하는 주격보어예요. 두 번째로 for relieving에서 for 뒤에는 동명사 relieving이 와서 완화하는 데라는 뜻을 만들어요. 세 번째로 when it is used는 수동태 is used가 들어간 시간 부사절이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나\u003c/span>\u003cspan class=\"en\">However,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">카페인은\u003c/span>\u003cspan class=\"en\">caffeine\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대신할 수 없다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">cannot\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">take \u003c/span>\u0 이 문장 전체를 해석하면, 따라서 카페인을 이용하는 것은 충분한 수면을 취하지 못한 것을 완전히 보충할 수는 없다.","hl":"m"},{"n":38,"text":"이 문장은 글 전체를 결론으로 묶어 줘요. 카페인은 잠을 대신하는 대체재가 아니라는 점을 분명히 하죠. 그래서 잠이 커피보다 중요하다는 마지막 주장으로 자연스럽게 이어집니다.","hl":"mn"},{"n":39,"text":"어법 첫 번째, 문장 맨 앞의 using caffeine은 동명사구로 주어예요. 동명사구가 주어로 오면 단수 취급한다는 것도 함께 기억하세요. 두 번째, make up for는 보충하다라는 구동사예요. 부사 fully는 구동사 전체를 꾸미도록 조동사와 본동사 사이에 들어갔어요. 세 번째, 동명사를 부정할 때는 동명사 앞에 not을 붙여요. 여기서는 전치사 for의 목적어 자리라서 동명사구 형태로 온 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분의 일을 더 잘 하기 위해서,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">To \u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">work \u003c/span>\u003cspan class=\"tgt\">better\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은 수면이 필요하다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">need \u003c/span>\u003cspan class=\"tgt\">sleep\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">커피보다 더 많이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">coffee\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">일을 더 잘하기 위해서, 여러분은 커피보다는 더 많은 수면이 필요하다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글의 \u003cb class=\"key\">결론\u003c/b>으로, 일을 더 잘하기 위해서는 커피보다 충분한 \u003cb class=\"key\">수면\u003c/b>이 더 중요하다는 점을 강조합니다. 앞에서 카페인이 유용하지만 잠을 완전히 대신할 수 없다고 했으니, 결국 필요한 것은 \u003cb class=\"key\">커피\u003c/b>가 아니라 잠이라는 뜻이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : To + [동사원형] + [목적어] (to부정사구/부사구) + 주절 : \"여러분의 일을 더 잘 하기 위해서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">타동사 need + 명사 목적어\u003c/span> : need [타동사] + [목적어(명사)] : \"여러분은 수면이 필요하다(수면을 필요로 한다)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">비교급 비교(more than)\u003c/span> : [비교급] + than + [비교 대상] : \"커피보다 더 많이\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"To do your work better, 여러분의 일을 더 잘 하기 위해서. you need sleep, 여러분은 수면이 필요하다. more than coffee, 커피보다 더 많이. 이 문장 전체를 해석하면, 일을 더 잘하기 위해서, 여러분은 커피보다는 더 많은 수면이 필요하다.","hl":"m"},{"n":41,"text":"이 문장은 글 전체를 마무리하는 결론 문장이에요. 카페인이 여러모로 도움이 되지만 잠을 완전히 대신할 수는 없다는 흐름을 거쳐서, 결국 일을 더 잘하고 싶다면 커피보다 수면이 더 필요하다고 정리하고 있죠. 시험에서는 글의 주제나 요지를 고르는 문제의 마지막 근거 문장으로 자주 등장합니다.","hl":"mn"},{"n":42,"text":"첫 번째로, 문장 앞의 to do your work better는 목적을 나타내는 to부정사의 부사적 용법이에요. '여러분의 일을 더 잘 하기 위해서'라고 해석하면 되죠. 두 번째로, you need sleep에서 need는 타동사로 뒤에 명사 sleep을 목적어로 받아요. 그래서 '여러분은 수면을 필요로 한다'는 구조가 됩니다. 세 번째로, more than coffee는 비교급 비교 표현으로 커피보다 더 많이, 즉 수면이 커피보다 더 필요하다고 대조하는 부분이에요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>카페인은 하루 종일 \u003cb class=\"key\">각성\u003c/b>을 유지시키고 반응을 빠르게 하며 두통 완화에도 효과적이다.\u003c/li>\u003cli>그러나 카페인은 \u003cb class=\"key\">숙면\u003c/b>을 대신할 수 없다는 것이 이 글의 주제다.\u003c/li>\u003cli>수면 부족 상태에서는 카페인이 \u003cb class=\"key\">실수 \u003c/b>\u003cb class=\"key\">가능성\u003c/b>을 높이고 시험 점수도 높여 주지 못한다.\u003c/li>\u003cli>따라서 카페인은 수면 부족을 \u003cb class=\"key\">완전히 \u003c/b>\u003cb class=\"key\">보충\u003c/b>하지 못하므로, 일을 잘하려면 커피보다 \u003cb class=\"key\">수면\u003c/b>이 필요하다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Caffeine helps you stay awake and alert, but it cannot take the place of a good night's sleep.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">카페인은 하루 종일 깨어 있게 하고 반응을 빠르게 하며 두통 완화에도 효과적이지만, \u003cb class=\"key\">숙면\u003c/b>을 대신할 수는 없다. 수면 부족은 카페인으로 \u003cb class=\"key\">완전히 \u003c/b>\u003cb class=\"key\">보충\u003c/b>되지 않으므로, 일을 더 잘하기 위해서는 커피보다 \u003cb class=\"key\">수면\u003c/b>이 더 필요하다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":43,"text":"오늘 글의 핵심은 아주 간단합니다. 카페인은 우리를 깨워 주고 두통도 완화해 주지만, 숙면을 대신할 수는 없다는 거예요. 그러니 시험이나 수행을 앞두고 밤을 새우는 대신, 충분한 수면을 먼저 챙기길 바랍니다. 오늘 수업은 여기까지고요, 다음 시간에 또 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
