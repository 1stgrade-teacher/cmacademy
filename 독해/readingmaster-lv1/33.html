<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터1 Reading 33 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터1 Reading 33","audioDir":"33_audio","preview":false,"count":48,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.668em\">Reading\u003cbr>33\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터1\u003c/div>\u003ch1>Short-Form Media: Quick Information, Shorter Attention\u003c/h1>\u003ch2>쇼트폼 미디어: 빠른 정보와 짧아진 집중력\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>쇼트폼 미디어는 쉽고 빠르게 정보를 제공하지만, 사람들이 \u003cb class=\"key\">롱폼 \u003c/b>\u003cb class=\"key\">미디어\u003c/b>를 외면하고 \u003cb class=\"key\">집중 \u003c/b>\u003cb class=\"key\">시간\u003c/b>이 줄어드는 문제를 낳는다. 짧은 영상은 빠른 정보라는 장점과 집중력 저하라는 단점을 모두 가진다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Short-form media provides quick information but shortens people's attention span, causing difficulties in focusing.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 쇼트폼 미디어에 관한 글을 함께 읽어 볼 거예요. 이 글은 쇼트폼 미디어가 쉽고 빠른 정보를 제공하지만 사람들이 롱폼 미디어를 외면하고 집중 시간이 줄어드는 문제를 다뤄요. 한 문장으로 요약하면, 쇼트폼 미디어는 빠른 정보를 주지만 사람들의 집중 시간을 짧게 만든다는 거예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">\u003cb class=\"key\">쇼트폼 \u003c/b>\u003cb class=\"key\">미디어\u003c/b>(short-form media)는 10분 미만이나 1,000단어 미만처럼 짧은 길이로 정보를 전달하는 콘텐츠를 말해요. 유튜브 쇼츠, 틱톡, 인스타그램 릴스가 대표적이며, 스마트폰 사용이 일상화되면서 빠르게 확산되었죠. 사람들은 짧은 영상에서 \u003cb class=\"key\">쉽고 \u003c/b>\u003cb class=\"key\">빠른 \u003c/b>\u003cb class=\"key\">정보\u003c/b>를 얻기 때문에 자연스럽게 익숙해지지만, 그만큼 책이나 영화 같은 \u003cb class=\"key\">롱폼 \u003c/b>\u003cb class=\"key\">미디어\u003c/b>(long-form media)를 외면하게 될 수 있어요. 특히 짧은 자극에 반복 노출되면 \u003cb class=\"key\">집중 \u003c/b>\u003cb class=\"key\">시간\u003c/b>(attention span)이 줄어들 수 있는데, 마이크로소프트 연구는 십 대의 집중 시간이 10초 이상에서 8초로 줄었다고 보여 줍니다. 이는 영화 한 편을 보기보다 1분 영상 여러 개를 연달아 보는 습관과 비슷해요. 학교 수업에서도 \u003cb class=\"key\">집중력 \u003c/b>\u003cb class=\"key\">저하\u003c/b>가 나타날 수 있어, 짧은 영상의 편리함과 부작용을 함께 생각해야 합니다.\u003c/div>","segs":[{"n":2,"text":"쇼트폼 미디어는 십 분 미만이나 천 단어 미만처럼 짧은 길이로 정보를 전달하는 콘텐츠예요. 유튜브 쇼츠, 틱톡, 인스타그램 릴스가 대표적이고, 스마트폰 사용이 일상화되면서 빠르게 퍼졌죠. 사람들은 쉽고 빠른 정보를 얻기 위해 이런 영상에 익숙해지지만, 그만큼 책이나 영화 같은 롱폼 미디어를 외면하게 될 수 있어요. 특히 짧은 자극에 반복해서 노출되면 집중 시간이 줄어들 수 있는데, 마이크로소프트 연구에서는 십 대의 집중 시간이 십 초 이상에서 팔 초로 줄었다고 보여 줬어요. 이건 영화 한 편을 보기보다 일 분짜리 영상 여러 개를 연달아 보는 습관과 비슷해요. 학교 수업에서도 집중력 저하가 나타날 수 있어서, 짧은 영상의 편리함과 부작용을 함께 생각해야 합니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>사례 제시\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>글은 유튜브 쇼츠, 틱톡, 인스타그램 릴스처럼 학생들이 익숙한 짧은 영상 사례를 먼저 제시한다. 이 세 가지를 묶어 \u003cb class=\"key\">쇼트폼 \u003c/b>\u003cb class=\"key\">미디어\u003c/b>라고 부르며, 독자가 바로 개념을 떠올리게 한다. 즉 구체적인 예시로 글의 주제에 자연스럽게 들어가는 \u003cb class=\"key\">도입\u003c/b> 단계이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>정의와 확산\u003csmall>개념 정의 · 문장 4–6\u003c/small>\u003c/h4>\u003cp>쇼트폼 미디어는 10분 미만 또는 1,000단어 미만의 \u003cb class=\"key\">콘텐츠\u003c/b>로 정의된다. 사람들은 \u003cb class=\"key\">쉽고 \u003c/b>\u003cb class=\"key\">빠른 \u003c/b>\u003cb class=\"key\">정보\u003c/b>를 얻을 수 있어 짧은 영상에 익숙해지고, 그 결과 책과 영화 같은 \u003cb class=\"key\">롱폼 \u003c/b>\u003cb class=\"key\">미디어\u003c/b>를 외면하게 된다. 이 단계에서 글은 개념의 뜻과 확산 원인을 함께 설명한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>집중력 문제\u003csmall>근거 · 문장 7–10\u003c/small>\u003c/h4>\u003cp>사람들은 짧은 영상에 익숙해지면서 \u003cb class=\"key\">집중력\u003c/b>을 빨리 잃고 전체 내용을 보려 하지 않는다. 마이크로소프트 연구는 십 대의 집중 시간이 10초 이상에서 8초로 줄었다는 \u003cb class=\"key\">근거\u003c/b>를 제시한다. 8초가 금붕어보다도 짧다는 점을 들어 이를 \u003cb class=\"key\">심각한 \u003c/b>\u003cb class=\"key\">문제\u003c/b>로 강조한다. 이처럼 원인과 연구 결과가 이어진다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>학교와 결론\u003csmall>결론 · 문장 11–12\u003c/small>\u003c/h4>\u003cp>학교에서도 학생들이 수업에 집중하는 데 어려움을 겪는다는 사례가 이어진다. 마지막으로 짧은 영상은 빠른 정보를 제공하지만 학생들의 집중 시간을 감소시킨다는 \u003cb class=\"key\">양면성\u003c/b>을 정리한다. 즉 장점과 단점을 함께 제시하며 글을 맺는 \u003cb class=\"key\">결론\u003c/b> 단계이다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 네 단계로 나누어 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 사례 제시예요. 유튜브 쇼츠, 틱톡, 인스타그램 릴스를 보며 글은 쇼트폼 미디어라는 개념으로 들어가요. 구체적인 예시로 주제를 자연스럽게 여는 도입 단계라고 볼 수 있죠.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 쇼트폼 미디어를 십 분 미만 또는 천 단어 미만의 콘텐츠로 정의해요. 사람들은 쉽고 빠른 정보를 얻을 수 있어 짧은 영상에 익숙해지고, 그 결과 책과 영화 같은 롱폼 미디어를 외면하게 되죠. 개념의 뜻과 확산 원인을 함께 짚는 부분이에요.","hl":"f1"},{"n":6,"text":"세 번째 단계에서는 사람들이 짧은 영상에 익숙해지면서 집중력을 빨리 잃고 전체 내용을 보려 하지 않는다고 해요. 마이크로소프트 연구가 십 대의 집중 시간이 십 초 이상에서 팔 초로 줄었다는 근거를 제시하죠. 팔 초가 금붕어보다도 짧다며 이것을 심각한 문제로 강조해요. 원인과 연구 결과가 자연스럽게 이어지는 부분입니다.","hl":"f2"},{"n":7,"text":"네 번째 단계에서는 학교에서 학생들이 수업에 집중하는 데 어려움을 겪는다는 사례가 나와요. 마지막으로 짧은 영상이 빠른 정보를 제공하지만 학생들의 집중 시간을 감소시킨다는 양면성을 정리하죠. 장점과 단점을 함께 제시하며 글을 맺는 결론 단계예요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">인과\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 12번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 짧은 영상의 예시와 정의로 시작해, 쇼트폼 미디어의 확산이 롱폼 미디어 외면과 집중력 저하로 이어지는 \u003cb class=\"key\">인과 \u003c/b>\u003cb class=\"key\">관계\u003c/b>를 설명한다. 이어 마이크로소프트 연구와 학교 수업 사례로 결과를 뒷받침한다. 글의 \u003cb class=\"key\">주제문\u003c/b>은 마지막 문장에서 장점과 단점을 함께 정리하며 나타나므로 \u003cb class=\"key\">미괄식\u003c/b>으로 볼 수 있다. 따라서 핵심은 짧은 영상의 편리함과 집중력 저하라는 양면성이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>because (5)\u003c/b>\u003cspan>이유 제시\u003c/span>\u003cb>With the rise of (6)\u003c/b>\u003cspan>원인·배경 제시\u003c/span>\u003cb>shows that (8)\u003c/b>\u003cspan>연구 결과 제시\u003c/span>\u003cb>In just a few years (9)\u003c/b>\u003cspan>시간적 변화 강조\u003c/span>\u003cb>because (10)\u003c/b>\u003cspan>이유 제시\u003c/span>\u003cb>also (11)\u003c/b>\u003cspan>내용 추가\u003c/span>\u003cb>but also (12)\u003c/b>\u003cspan>대조와 양면성 강조\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">YouTube Shorts, TikToks, or Instagram reels\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">short-form media\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">these short videos\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">short videos\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>좋은 점\u003c/th>\u003cth>나쁜 점\u003c/th>\u003c/tr>\u003ctr>\u003ctd>빠른 정보 제공\u003c/td>\u003ctd>집중 시간 감소\u003c/td>\u003c/tr>\u003ctr>\u003ctd>쉽고 빠른 정보 습득\u003c/td>\u003ctd>10초 이상에서 8초로 감소\u003c/td>\u003c/tr>\u003ctr>\u003ctd>10분 미만 콘텐츠\u003c/td>\u003ctd>금붕어보다 짧은 집중력\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 인과 관계를 따라가는 구조예요. 짧은 영상의 예시와 정의에서 출발해 쇼트폼 미디어의 확산이 롱폼 미디어 외면과 집중력 저하로 이어지는 흐름을 설명하죠. 마이크로소프트 연구와 학교 수업 사례로 그 결과를 뒷받침해요. 글의 주제문은 마지막 문장에서 장점과 단점을 함께 정리하며 나타나므로 미괄식이라고 볼 수 있어요.","hl":"ty"},{"n":9,"text":"신호어를 보면, 다섯 번째 문장의 because는 이유를, 여섯 번째 문장의 With the rise of는 원인과 배경을 알려 줘요. 여덟 번째 문장의 shows that은 연구 결과를 제시하고, 마지막 문장의 but also는 장점과 단점의 대조를 분명히 해요. 또한 these short videos나 short videos처럼 쇼트폼 미디어를 바꿔 말하는 재진술에 주목하면 흐름이 잘 보여요. 좋은 점과 나쁜 점을 함께 놓는 대조 구도도 기억해 두세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>reel\u003c/b>\u003cem>명사\u003c/em>\u003cspan>릴스(짧은 영상)\u003c/span>\u003c/div>\u003cdiv>\u003cb>watch\u003c/b>\u003cem>동사\u003c/em>\u003cspan>시청하다, 보다\u003c/span>\u003c/div>\u003cdiv>\u003cb>kind\u003c/b>\u003cem>명사\u003c/em>\u003cspan>종류\u003c/span>\u003c/div>\u003cdiv>\u003cb>short-form media\u003c/b>\u003cem>명사\u003c/em>\u003cspan>쇼트폼 미디어(짧은 형식의 미디어)\u003c/span>\u003c/div>\u003cdiv>\u003cb>content\u003c/b>\u003cem>명사\u003c/em>\u003cspan>콘텐츠, 내용\u003c/span>\u003c/div>\u003cdiv>\u003cb>under\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~미만의, ~보다 적은\u003c/span>\u003c/div>\u003cdiv>\u003cb>become familiar with\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 익숙해지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>information\u003c/b>\u003cem>명사\u003c/em>\u003cspan>정보\u003c/span>\u003c/div>\u003cdiv>\u003cb>easily\u003c/b>\u003cem>부사\u003c/em>\u003cspan>쉽게\u003c/span>\u003c/div>\u003cdiv>\u003cb>quickly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>빠르게\u003c/span>\u003c/div>\u003cdiv>\u003cb>rise\u003c/b>\u003cem>명사\u003c/em>\u003cspan>등장, 증가\u003c/span>\u003c/div>\u003cdiv>\u003cb>turn away from\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 외면하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>long-form media\u003c/b>\u003cem>명사\u003c/em>\u003cspan>롱폼 미디어(긴 형식의 미디어)\u003c/span>\u003c/div>\u003cdiv>\u003cb>lose focus\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>집중력을 잃다\u003c/span>\u003c/div>\u003cdiv>\u003cb>full\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>전체의, 완전한\u003c/span>\u003c/div>\u003cdiv>\u003cb>study\u003c/b>\u003cem>명사\u003c/em>\u003cspan>연구\u003c/span>\u003c/div>\u003cdiv>\u003cb>show\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보여 주다\u003c/span>\u003c/div>\u003cdiv>\u003cb>decrease\u003c/b>\u003cem>동사\u003c/em>\u003cspan>감소시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>attention\u003c/b>\u003cem>명사\u003c/em>\u003cspan>집중, 주의\u003c/span>\u003c/div>\u003cdiv>\u003cb>attention time\u003c/b>\u003cem>명사\u003c/em>\u003cspan>집중 시간\u003c/span>\u003c/div>\u003cdiv>\u003cb>teenager\u003c/b>\u003cem>명사\u003c/em>\u003cspan>십 대\u003c/span>\u003c/div>\u003cdiv>\u003cb>in just a few years\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>단 몇 년 만에\u003c/span>\u003c/div>\u003cdiv>\u003cb>over\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~ 이상, ~보다 많은\u003c/span>\u003c/div>\u003cdiv>\u003cb>serious\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>심각한\u003c/span>\u003c/div>\u003cdiv>\u003cb>problem\u003c/b>\u003cem>명사\u003c/em>\u003cspan>문제\u003c/span>\u003c/div>\u003cdiv>\u003cb>shorter\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>더 짧은\u003c/span>\u003c/div>\u003cdiv>\u003cb>have difficulty -ing\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~하는 데 어려움을 겪다\u003c/span>\u003c/div>\u003cdiv>\u003cb>focus on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 집중하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>provide\u003c/b>\u003cem>동사\u003c/em>\u003cspan>제공하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>quick\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>빠른\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어로는 content, turn away from, decrease, attention을 꼭 챙겨 주세요. content는 콘텐츠나 내용, turn away from은 외면하다, decrease는 감소시키다, attention은 집중이나 주의라는 뜻이에요. 특히 attention time은 집중 시간으로 기억해 두면 좋아요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">decrease\u003c/b>\u003cspan class=\"m\">감소시키다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">reduce\u003c/span>\u003cspan class=\"s\">lessen\u003c/span>\u003cspan class=\"s\">diminish\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">increase\u003c/span>\u003cspan class=\"a\">raise\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">attention\u003c/b>\u003cspan class=\"m\">집중, 주의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">focus\u003c/span>\u003cspan class=\"s\">concentration\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">distraction\u003c/span>\u003cspan class=\"a\">inattention\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">rise\u003c/b>\u003cspan class=\"m\">등장, 증가\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">increase\u003c/span>\u003cspan class=\"s\">growth\u003c/span>\u003cspan class=\"s\">emergence\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">decline\u003c/span>\u003cspan class=\"a\">fall\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">quickly\u003c/b>\u003cspan class=\"m\">빠르게\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">rapidly\u003c/span>\u003cspan class=\"s\">swiftly\u003c/span>\u003cspan class=\"s\">fast\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">slowly\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">serious\u003c/b>\u003cspan class=\"m\">심각한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">severe\u003c/span>\u003cspan class=\"s\">grave\u003c/span>\u003cspan class=\"s\">critical\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">trivial\u003c/span>\u003cspan class=\"a\">minor\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">familiar\u003c/b>\u003cspan class=\"m\">익숙한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">accustomed\u003c/span>\u003cspan class=\"s\">acquainted\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unfamiliar\u003c/span>\u003cspan class=\"a\">strange\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">full\u003c/b>\u003cspan class=\"m\">전체의, 완전한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">complete\u003c/span>\u003cspan class=\"s\">entire\u003c/span>\u003cspan class=\"s\">whole\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">partial\u003c/span>\u003cspan class=\"a\">incomplete\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">provide\u003c/b>\u003cspan class=\"m\">제공하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">supply\u003c/span>\u003cspan class=\"s\">offer\u003c/span>\u003cspan class=\"s\">give\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">withhold\u003c/span>\u003cspan class=\"a\">remove\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 함께 정리해 볼게요. decrease는 reduce, lessen, diminish와 가깝고, 반대말은 increase나 raise예요. attention은 focus, concentration과 비슷하고, 반대말로 distraction이나 inattention이 있어요. rise는 increase, growth, emergence와 연결되고, 반대말은 decline이나 fall이에요. quickly는 rapidly, swiftly, fast로 바꿔 쓸 수 있고, 반대말은 slowly입니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유튜브 쇼츠,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">YouTube \u003c/span>\u003cspan class=\"tgt\">Shorts, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">틱톡,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">TikToks, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또는 인스타그램 릴스.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">Instagram \u003c/span>\u003cspan class=\"tgt\">reels\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">유튜브 쇼츠, 틱톡, 인스타그램 릴스.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 서술어 없이 앱 이름 세 개만 나열한 \u003cb class=\"key\">도입부\u003c/b>예요. 앞으로 다룰 ‘쇼트폼 미디어’의 구체적인 \u003cb class=\"key\">예시\u003c/b>를 먼저 던져 독자의 관심을 끄는 역할을 하죠. ‘이것들은 ~이다’라는 말이 생략된 \u003cb class=\"key\">명사 \u003c/b>\u003cb class=\"key\">나열\u003c/b>로 보면 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">병렬 구조(명사 세 개의 나열)와 선택의 등위접속사 or\u003c/span> : [명사 A], [명사 B], or [명사 C] : \"유튜브 쇼츠, 틱톡, 또는 인스타그램 릴스\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"YouTube Shorts, 유튜브 쇼츠. TikToks, 틱톡. or Instagram reels, 또는 인스타그램 릴스.. 이 문장 전체를 해석하면, 유튜브 쇼츠, 틱톡, 인스타그램 릴스.","hl":"m"},{"n":13,"text":"이 문장은 서술어가 없는 도입부예요. 앱 이름 세 개를 나열해서 앞으로 다룰 쇼트폼 미디어의 구체적인 예시를 먼저 보여 주는 거죠. 그래서 문장만 보면 어색하지만 바로 다음 문장이 이것들이 무엇인지 설명해 줍니다.","hl":"mn"},{"n":14,"text":"첫 번째로, 유튜브 쇼츠, 틱톡, 인스타그램 릴스는 같은 자격의 명사를 쉼표로 이어 나열하고 마지막에 or를 넣어 선택의 관계를 만든 병렬 구조예요. 여기서 이 명사들은 뒤에 오는 동사 are의 주어 자리를 채우는 주어 역할을 하고 있답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은 봤을지도 모른다\u003c/span>\u003cspan class=\"en\">You \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">might \u003c/span>\u003cspan class=\"tgt\">watch\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이런 종류의 영상들을.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">these \u003c/span>\u003cspan class=\"tgt\">kinds \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">videos\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여러분은 이런 종류의 영상을 봤을 지도 모른다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> might가 ‘~일지도 모른다’는 \u003cb class=\"key\">약한 \u003c/b>\u003cb class=\"key\">추측\u003c/b>을 만들어요. 독자에게 말을 거는 \u003cb class=\"key\">you\u003c/b>를 써서 친근하게 공감을 유도하는 문장이죠. these kinds of videos는 앞에서 나열한 쇼츠·틱톡·릴스를 하나로 \u003cb class=\"key\">묶어\u003c/b> 받는 표현입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 might(약한 추측)\u003c/span> : [주어] + might + [동사원형] : \"~을 봤을지도 모른다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지시형용사 these + 복수명사(kinds of)\u003c/span> : these + kinds of + [복수명사] : \"이런 종류의 영상들\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"You might watch, 여러분은 봤을지도 모른다. these kinds of videos, 이런 종류의 영상들을.. 이 문장 전체를 해석하면, 여러분은 이런 종류의 영상을 봤을 지도 모른다.","hl":"m"},{"n":16,"text":"여기서 might는 확신이 낮은 약한 추측을 나타내요. 독자에게 말을 거는 you를 써서 친근하게 공감을 유도하는 문장이고, these kinds of videos는 앞에서 나열한 쇼츠와 틱톡과 릴스를 하나로 묶어 받는 표현이에요.","hl":"mn"},{"n":17,"text":"첫 번째로, might는 조동사라서 뒤에 동사원형 watch가 와요. 확신이 낮은 약한 추측이라서 봤을지도 모른다 정도로 부드럽게 말하는 거죠. 두 번째로, these는 지시형용사로 복수명사 kinds를 꾸미고, kinds of 뒤에는 복수명사 videos가 와서 이런 종류의 영상들이라는 묶음 표현을 만듭니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들은 모두 ~이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">They \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">all\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘쇼트폼 미디어’\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">short-form \u003c/span>\u003cspan class=\"tgt\">media\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것들은 모두 ‘쇼트폼 미디어’이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> They는 앞 문장의 영상들, 곧 쇼츠·틱톡·릴스를 받는 \u003cb class=\"key\">대명사\u003c/b>예요. all은 ‘모두’라는 뜻으로 주어 전체를 \u003cb class=\"key\">강조\u003c/b>하죠. 이 문장은 글 전체의 \u003cb class=\"key\">주제어\u003c/b>인 short-form media를 처음 이름 붙여 주는 핵심 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사 뒤에 오는 부사 all(주어 전체 강조)\u003c/span> : [주어] + be동사 + all + [주격보어] : \"그것들은 모두 ~이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">복합 형용사 short-form에 의한 명사 수식\u003c/span> : [복합 형용사 short-form] + [명사 media] : \"쇼트폼 미디어(짧은 형식의 매체)\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"They are all, 그것들은 모두 ~이다. \"short-form media.\", ‘쇼트폼 미디어’. 이 문장 전체를 해석하면, 그것들은 모두 ‘쇼트폼 미디어’이다.","hl":"m"},{"n":19,"text":"They는 바로 앞에서 나온 쇼츠와 틱톡과 릴스를 받는 대명사예요. all은 모두라는 뜻으로 주어 전체를 강조하고 있죠. 이 문장은 글 전체의 주제어인 short-form media를 처음 이름 붙여 주는 아주 중요한 문장입니다.","hl":"mn"},{"n":20,"text":"첫 번째로, all이 부사로 쓰이면 be동사 뒤에 와서 주어 전체를 모두라고 강조해요. 일반동사일 때는 동사 앞에 오지만 be동사일 때는 뒤에 온다는 위치 규칙을 꼭 기억하세요. 두 번째로, short-form은 하이픈으로 묶인 복합 형용사로 뒤의 명사 media를 꾸며 줍니다. 그리고 media는 매체라는 뜻의 불가산 명사라서 복수형 s를 붙이지 않고 단수로 취급해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">쇼트폼 미디어는\u003c/span>\u003cspan class=\"en\">Short-form media\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">콘텐츠를 가진다\u003c/span>\u003cspan class=\"en\">has content\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">10분 미만인\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">which \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">under \u003c/span>\u003cspan class=\"tgt\">10 \u003c/span>\u003cspan class=\"tgt\">minutes \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또는 1,000단어 미만인\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">under \u003c/span>\u003cspan class=\"tgt\">1,000 \u003c/span>\u003cspan class=\"tgt\">words\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">쇼트폼 미디어는 10분 미만 또는 1,000단어 미만의 콘텐츠를 가진다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 쇼트폼 미디어를 수치로 정의해 주는 문장이에요. 내용이 \u003cb class=\"key\">10분\u003c/b> 또는 \u003cb class=\"key\">1,000단어\u003c/b>를 넘지 않는다는 기준을 제시해서, 앞서 본 영상들이 왜 '짧은' 미디어인지 근거를 대 주죠. 관계대명사 which가 앞의 \u003cb class=\"key\">content\u003c/b>를 그대로 받아 설명을 이어 붙이는 구조입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 which\u003c/span> : [선행사 content] + [which(주격) + 동사 is + 보어] : \"10분 미만 또는 1,000단어 미만인\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 under (수치의 미만)\u003c/span> : under + [숫자 + 단위] : \"10분 미만\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Short-form media, 쇼트폼 미디어는. has content, 콘텐츠를 가진다. which is under 10 minutes, 10분 미만인. or under 1,000 words, 또는 1,000단어 미만인. 이 문장 전체를 해석하면, 쇼트폼 미디어는 10분 미만 또는 1,000단어 미만의 콘텐츠를 가진다.","hl":"m"},{"n":22,"text":"이 문장은 쇼트폼 미디어가 무엇인지 숫자로 딱 정해 주는 정의 문장이에요. 십 분과 천 단어라는 기준을 내세워서 앞에 나온 영상들이 왜 짧은 미디어인지 근거를 대 주고 있죠. 바로 이 기준 덕분에 다음 문장부터 사람들이 왜 짧은 영상에 끌리는지가 자연스럽게 이어집니다.","hl":"mn"},{"n":23,"text":"첫 번째로 which is under ten minutes, 여기서 which는 주격 관계대명사예요. 앞에 있는 선행사 content를 받아서 관계절 안에서 주어 역할을 하고 있죠. 그래서 which 뒤에 동사 is가 바로 나오는 겁니다. 두 번째로 전치사 under는 수치 앞에서 미만이라는 뜻으로 쓰여요. 십 분 미만, 천 단어 미만, 이렇게 해석하면 되고 반대말은 over라는 것도 같이 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들은 익숙해진다\u003c/span>\u003cspan class=\"en\">People \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">become \u003c/span>\u003cspan class=\"tgt\">familiar \u003c/span>\u003cspan class=\"tgt\">with\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 짧은 영상에\u003c/span>\u003cspan class=\"en\">these short videos\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 정보를 얻을 수 있기 때문에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">because \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">get \u003c/span>\u003cspan class=\"tgt\">information \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">쉽고 빠르게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">easily \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">quickly\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사람들은 쉽고 빠르게 정보를 얻을 수 있기 때문에 이 짧은 영상에 익숙해진다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\"> -form media \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">decreased \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">십 대들의 집중 시간을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">attention \u003c/span>\u003cspan class=\"tgt\">time\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">teenagers\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Microsoft의 연구에 따르면 쇼트폼 미디어가 십 대들의 집중 시간을 감소시켰다고 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Microsoft의 연구가 short-form media와 \u003cb class=\"key\">집중 \u003c/b>\u003cb class=\"key\">시간\u003c/b> 감소의 관계를 보여 주는 \u003cb class=\"key\">근거\u003c/b> 자료라는 뜻이에요. 연구 결과를 shows that으로 제시해 글의 주장을 뒷받침해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 명사절(목적어)\u003c/span> : show + [that + S + V ...] : \"~라는 것을 보여 준다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">타동사 decrease의 3형식\u003c/span> : decrease + [목적어] : \"집중 시간을 감소시켰다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 of의 대상 관계\u003c/span> : N + of + [대상] : \"십 대들의\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"A study by Microsoft, Microsoft의 연구는. shows, 보여 준다. that short-form media decreased, 쇼트폼 미디어가 감소시켰다는 것을. the attention time of teenagers, 십 대들의 집중 시간을. 이 문장 전체를 해석하면, Microsoft의 연구에 따르면 쇼트폼 미디어가 십 대들의 집중 시간을 감소시켰다고 한다.","hl":"m"},{"n":34,"text":"이 문장은 Microsoft의 연구가 short-form media와 집중 시간 감소의 관계를 보여 주는 근거라는 뜻이에요. 그래서 글의 주장을 객관적인 연구 결과로 뒷받침해 주죠.","hl":"mn"},{"n":35,"text":"첫 번째로 shows 뒤의 that절은 목적어로 쓰인 명사절이에요. 두 번째로 decrease는 목적어를 갖는 타동사라서 the attention time이 목적어로 이어져요. 세 번째로 of teenagers는 집중 시간의 대상을 밝혀 주는 전치사구예요.","hl":"gr"}]}, s=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 from의 출발점\u003c/span> : from + [출발 상태/수치] : \"10초 이상에서\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"In just a few years, 단 몇 년 만에. it became, 그것은 되었다. 8 seconds, 8초가. from over 10 seconds, 10초 이상에서. 이 문장 전체를 해석하면, 단 몇 년 만에, 그것은 10초 이상에서 8초가 되었다.","hl":"m"},{"n":37,"text":"이 문장은 감소 폭을 수치로 보여 주면서 단 몇 년 만에 열 초 이상에서 여덟 초로 줄었다는 점을 강조해요. 이 수치는 다음 문장에서 금붕어와 비교하는 근거가 되죠.","hl":"mn"},{"n":38,"text":"첫 번째로 in just a few years는 시간 범위를 나타내는 전치사구예요. 두 번째로 become은 주어의 상태 변화를 보여 주고 뒤에 주격보어가 와요. 여기서 eight seconds가 보어 역할을 하죠. 세 번째로 from over ten seconds는 변화의 출발점을 나타내고, over는 이상이라는 뜻이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은 ~이다\u003c/span>\u003cspan class=\"en\">This is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">심각한 문제이다\u003c/span>\u003cspan class=\"en\">a serious problem,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜냐하면 8초는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">because\u003c/span> 8 seconds\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 짧다\u003c/span>\u003cspan class=\"en\">is \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">shorter \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">금붕어의 그것보다도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">goldfish\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">8초는 금붕어의 그것보다도 더 짧기 때문에 이는 심각한 문제이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 말한 집중 시간 감소가 왜 심각한지 \u003cb class=\"key\">이유\u003c/b>를 밝히는 문장이에요. 8초라는 숫자를 \u003cb class=\"key\">금붕어\u003c/b>와 비교해서 사람의 집중력이 얼마나 짧아졌는지를 강하게 보여 주죠. 여기서 \u003cb class=\"key\">that\u003c/b>은 앞에 나온 attention time을 반복하지 않으려고 대신 받은 말이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이유를 나타내는 접속사 because\u003c/span> : [주절] + because + [이유를 밝히는 절] : \"왜냐하면 ~이기 때문에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">비교급 + than과 지시대명사 that\u003c/span> : [[비교급]] + than + that of + [명사] : \"금붕어의 그것보다 더 짧은\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"This is, 이것은 ~이다. a serious problem, 심각한 문제이다. because 8 seconds, 왜냐하면 8초는. is shorter, 더 짧다. than that of a goldfish, 금붕어의 그것보다도. 이 문장 전체를 해석하면, 8초는 금붕어의 그것보다도 더 짧기 때문에 이는 심각한 문제이다.","hl":"m"},{"n":40,"text":"이 문장은 앞에서 말한 집중 시간 감소가 왜 심각한 문제인지 이유를 밝히고 있어요. 팔 초라는 짧은 시간을 금붕어와 비교해서 사람의 집중력이 얼마나 짧아졌는지를 강하게 보여 주죠. 여기서 that은 앞에 나온 attention time을 그대로 반복하지 않으려고 대신 쓴 말이에요.","hl":"mn"},{"n":41,"text":"첫 번째, because는 앞의 심각한 문제에 대한 이유를 뒤에서 설명해 주는 접속사예요. 두 번째, shorter than은 비교급 표현이고, 여기서 that은 앞에 나온 attention time을 대신 받는 지시대명사예요. 그래서 금붕어의 그것, 즉 금붕어의 집중 시간과 비교하는 문장이 되는 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">학교에서\u003c/span>\u003cspan class=\"en\">In school,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">학생들은 또한\u003c/span>\u003cspan class=\"en\">students also\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어려움을 겪는다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">difficulty\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 수업에 집중하는 데\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">focusing \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">classes\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">학교에서 학생들은 또한 그들의 수업에 집중하는 데 어려움을 겪는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 말한 집중 시간 감소가 실제 학교 생활로 이어진다는 것을 보여 주는 문장이에요. 짧은 영상에 익숙해진 학생들이 수업에서도 \u003cb class=\"key\">집중\u003c/b>하지 못한다는 흐름을 만들어 주죠. \u003cb class=\"key\">have \u003c/b>\u003cb class=\"key\">difficulty\u003c/b> 뒤에 \u003cb class=\"key\">동명사\u003c/b> focusing이 와서 '집중하는 데 어려움을 겪다'라는 뜻이 된답니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">have difficulty + 동명사(~ing) 구문\u003c/span> : have [[difficulty]] + [동명사] : \"~하는 데 어려움을 겪다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사 focusing과 전치사 on\u003c/span> : [동명사] + on + [목적어] : \"그들의 수업에 집중하는 것\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"In school, 학교에서. students also, 학생들은 또한. have difficulty, 어려움을 겪는다. focusing on their classes, 그들의 수업에 집중하는 데. 이 문장 전체를 해석하면, 학교에서 학생들은 또한 그들의 수업에 집중하는 데 어려움을 겪는다.","hl":"m"},{"n":43,"text":"이 문장은 짧은 영상에 익숙해진 학생들이 학교에서도 집중을 잘 못한다는 걸 보여 줘요. 앞 문장의 집중 시간 감소가 실제 학교 생활로 이어진다는 흐름을 만들어 주는 문장이죠. have difficulty 뒤에 동명사 focusing이 와서 집중하는 데 어려움을 겪는다는 뜻이 된답니다.","hl":"mn"},{"n":44,"text":"첫 번째, have difficulty 다음에는 동명사가 와서 하는 데 어려움을 겪다라는 표현을 만들어요. 두 번째, focus는 on과 짝을 이루는 동사라서 전치사 on 뒤에 their classes가 목적어로 와요. 동명사 focusing 전체가 difficulty의 내용을 채워 주는 구조라는 점도 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">짧은 영상은\u003c/span>\u003cspan class=\"en\">Short videos\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">좋은 점과 나쁜 점을 모두 가지고 있다\u003c/span>\u003cspan class=\"en\">have \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">both \u003c/span>\u003cspan class=\"tgt\">good \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">bad \u003c/span>\u003cspan class=\"tgt\">points\u003c/span>:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들은 빠른 정보를 제공한다\u003c/span>\u003cspan class=\"en\">They provide quick information\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 또한 감소시킨다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">but \u003c/span>\u003cspan class=\"tgt\">also \u003c/span>\u003cspan class=\"tgt\">decrease\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">학생들의 집중 시간을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">students' \u003c/span>\u003cspan class=\"tgt\">attention \u003c/span>\u003cspan class=\"tgt\">time\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">짧은 영상에는 좋은 점과 나쁜 점이 모두 있다: 그것들은 빠른 정보를 제공하지만, 또한 학생들의 집중 시간도 감소시킨다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글 전체를 정리하는 결론 문장이에요. 짧은 영상이 빠른 정보를 준다는 좋은 점과 집중 시간을 줄인다는 나쁜 점을 함께 제시하며 \u003cb class=\"key\">균형\u003c/b> 있게 마무리하죠. 콜론 뒤에는 앞의 good and bad points를 구체적으로 풀어 주는 내용이 이어져요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">상관접속사 both A and B\u003c/span> : both + [A] + and + [B] : \"좋은 점과 나쁜 점 모두\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">but also를 통한 대조의 병렬\u003c/span> : [provide ~] + but also + [decrease ~] : \"그러나 또한 ~을 감소시킨다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">복수명사의 소유격\u003c/span> : [복수명사]' + [명사] : \"학생들의 집중 시간\"\u003c/div 른 정보 때문에 여기에 익숙해져요. 그러면서 책과 영화 같은 롱폼 미디어를 외면하고 집중력을 잃으며, 학교에서도 집중 시간이 줄어드는 문제가 나타나죠. 짧은 영상은 빠른 정보를 주지만 집중 시간을 감소시키는 양면성을 가진다는 점을 기억해 주시고, 오늘 강의는 여기서 마무리할게요, 감사합니다.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
