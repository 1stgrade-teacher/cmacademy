<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터1 Reading 06 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터1 Reading 06","audioDir":"06_audio","preview":false,"count":51,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.668em\">Reading\u003cbr>06\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터1\u003c/div>\u003ch1>Failure Makes Success: Even Champions Lose\u003c/h1>\u003ch2>실패는 성공을 만든다: 챔피언도 진다\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>전혀 \u003cb class=\"key\">실패\u003c/b>한 적 없는 사람은 없으며, \u003cb class=\"key\">Roger \u003c/b>\u003cb class=\"key\">Federer\u003c/b>조차 많은 토너먼트에서 졌다. 그러나 우리는 그를 \u003cb class=\"key\">챔피언\u003c/b>으로 여기며, \u003cb class=\"key\">실패\u003c/b>를 두려워하지 말고 받아들이고 나아가야 한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Failure is a natural part of success, so we should accept it and move on rather than fear it.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 오늘은 실패와 성공에 관한 짧은 글을 함께 읽어 볼게요. 이 글은 전혀 실패한 적 없는 사람이 있는지 질문하면서 시작해요. Roger Federer처럼 위대한 선수도 많은 패배를 겪지만 챔피언으로 기억된다는 내용을 통해, 실패가 성공을 만든다는 요지를 전합니다. 우리도 실패를 두려워하지 말고 받아들이는 태도를 배워 보면 좋겠어요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">테니스의 \u003cb class=\"key\">Grand \u003c/b>\u003cb class=\"key\">Slam\u003c/b>은 세계 최고 권위의 대회 네 개를 묶어 부르는 말로, 우승은 매우 어렵고 선수들은 수많은 대회에서 패배를 경험해요. Roger Federer처럼 위대한 선수도 모든 경기에서 이길 수는 없으며, 승리 기록만으로 선수의 가치가 결정되지는 않아요. 스포츠에서 \u003cb class=\"key\">패배\u003c/b>는 실력의 부족만이 아니라 더 나은 전략을 배우는 과정이 될 수 있어요. 이것은 공부에도 비슷해서, 모의고사에서 틀린 문제를 분석하는 과정이 실제 시험에서의 \u003cb class=\"key\">성공\u003c/b>으로 이어지죠. 중요한 것은 실패 자체가 아니라 실패를 어떻게 해석하고 다음 행동으로 연결하느냐예요. 실패를 성공의 재료로 보는 태도가 성장의 출발점이 됩니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 조금 볼게요. 테니스에서 Grand Slam은 세계 최고 권위의 큰 대회들을 묶어 부르는 말이에요. Roger Federer 같은 위대한 선수도 모든 경기에서 이길 수는 없고, 수많은 패배를 경험해요. 스포츠에서 패배는 단순한 실패가 아니라 더 나은 전략을 배우는 과정이 될 수 있죠. 공부도 비슷해서 모의고사에서 틀린 문제를 분석하는 과정이 실제 시험에서의 성공으로 이어져요. 그러니 실패를 성공의 재료로 보는 태도가 중요합니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>실패 없는 사람은 없다\u003csmall>도입·문제 제기 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>글은 전혀 \u003cb class=\"key\">실패\u003c/b>한 적 없는 사람을 아는지, 스포츠 역사상 우승 기록만 있는 사람을 떠올릴 수 있는지 묻습니다. 독자는 자연스럽게 그런 사람은 거의 없다고 느끼게 됩니다. 이 질문은 \u003cb class=\"key\">완벽\u003c/b>한 승리만 있는 사람은 현실에 없다는 점을 환기하며, 뒤에 나올 논의의 출발점을 만듭니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>Federer의 기록\u003csmall>예시·근거 · 문장 4–7\u003c/small>\u003c/h4>\u003cp>Roger Federer는 스무 개의 그랜드 슬램 타이틀을 가진 세계 최고의 테니스 선수로 제시됩니다. 그러나 그는 예순 개가 넘는 그랜드 슬램 \u003cb class=\"key\">토너먼트\u003c/b>에 참가했고, 그중 많은 대회에서 \u003cb class=\"key\">패배\u003c/b>했습니다. 그는 이긴 대회보다 진 대회가 더 많았지만, 이는 그가 위대한 선수라는 사실을 부정하지 않습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>실패는 성공을 만든다\u003csmall>전환·주장 · 문장 8–9\u003c/small>\u003c/h4>\u003cp>많은 패배에도 우리는 Federer를 \u003cb class=\"key\">실패자\u003c/b>가 아니라 \u003cb class=\"key\">챔피언\u003c/b>으로 생각합니다. 여기서 글은 '실패는 \u003cb class=\"key\">성공\u003c/b>을 만든다'는 핵심 주장으로 전환합니다. 즉, 패배는 성공의 반대말이 아니라 성공을 구성하는 과정이라는 의미입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>실패를 받아들이고 나아가기\u003csmall>결론·조언 · 문장 10–13\u003c/small>\u003c/h4>\u003cp>그래서 글은 \u003cb class=\"key\">실패\u003c/b>를 두려워하지 말라고 조언합니다. 경기에서 지거나 시험을 통과하지 못하는 것은 괜찮으며, 누구도 \u003cb class=\"key\">완벽\u003c/b>하지 않다는 점을 상기시킵니다. 마지막으로 자신의 \u003cb class=\"key\">실패\u003c/b>를 받아들이고 그것으로부터 나아가라고 권합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 따라가며 살펴볼게요.","hl":null},{"n":4,"text":"첫 단계에서 글은 전혀 실패한 적 없는 사람이 있는지, 스포츠 역사상 우승 기록만 있는 사람이 있는지 묻어요. 독자는 그런 사람이 거의 없다고 자연스럽게 느끼게 되죠. 이 질문은 완벽한 승리만 있는 사람은 현실에 없다는 점을 환기해요.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 Roger Federer가 예로 나와요. 그는 스무 개의 그랜드 슬램 타이틀을 가진 세계 최고의 선수지만, 예순 개가 넘는 토너먼트에 참가해 그중 많은 경기에서 패배했어요. 이긴 대회보다 진 대회가 더 많다는 점이 중요하죠.","hl":"f1"},{"n":6,"text":"세 번째 단계에서 글은 우리가 그를 실패자가 아니라 챔피언으로 생각한다고 말해요. 그리고 실패는 성공을 만든다는 핵심 주장으로 넘어가죠. 여기서 중요한 것은 패배가 성공의 반대가 아니라 성공을 이루는 과정이라는 점이에요.","hl":"f2"},{"n":7,"text":"마지막 단계에서 글은 실패에 대한 두려움을 버리라고 조언해요. 경기에서 지거나 시험을 통과하지 못해도 괜찮고, 누구도 완벽하지 않다고 말하죠. 그리고 자신의 실패를 받아들이고 그것으로부터 나아가라고 권합니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">질문-답변\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 9번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 1~3번의 질문으로 시작해 독자의 관심을 끌고, Federer의 사례를 \u003cb class=\"key\">근거\u003c/b>로 제시합니다. 그런 뒤 9번 문장에서 'Failure makes success'라는 \u003cb class=\"key\">주제문\u003c/b>을 중간에 제시하고, 10~13번에서 실패를 받아들이라는 \u003cb class=\"key\">조언\u003c/b>으로 마무리합니다. 따라서 중심 생각이 글의 가운데에 놓인 중괄식 구조로 볼 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>for example (4)\u003c/b>\u003cspan>예시 제시\u003c/span>\u003cb>But (5)\u003c/b>\u003cspan>예상 반박·전환\u003c/span>\u003cb>In other words (6)\u003c/b>\u003cspan>재진술\u003c/span>\u003cb>Still (8)\u003c/b>\u003cspan>양보 후 전환\u003c/span>\u003cb>So (10)\u003c/b>\u003cspan>결론·조언\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">no failure at all\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">only wins\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">lost in more than two-thirds of the tournaments\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">not as a failure\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Failure makes success\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>실패를 부정적으로 보는 시각\u003c/th>\u003cth>실패를 성장의 과정으로 보는 시각\u003c/th>\u003c/tr>\u003ctr>\u003ctd>챔피언은 실패하지 않아야 한다고 봄\u003c/td>\u003ctd>Federer도 많은 대회에서 패배해도 챔피언임\u003c/td>\u003c/tr>\u003ctr>\u003ctd>실패는 피해야 할 결과\u003c/td>\u003ctd>실패는 성공을 만드는 과정\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 질문으로 시작해 예시를 보여 주고, 그 예시를 근거로 삼아 중심 생각을 말하는 질문과 예시의 전개 방식이에요. Federer의 사례는 독자가 고개를 끄덕이게 하는 근거로 쓰였죠. 그리고 Failure makes success라는 주제문이 글의 가운데에 나오고, 뒤에서 조언으로 마무리돼요. 그래서 중심 생각이 중간에 놓인 중괄식 구조라고 볼 수 있습니다.","hl":"ty"},{"n":9,"text":"신호어를 보면 흐름이 더 분명해져요. for example은 Federer 사례를 예시로 제시하고, But은 예상과 다른 사실로 전환하게 해 줘요. In other words는 앞의 내용을 다시 말해 주며, Still은 많은 패배에도 챔피언이라는 점을 강조하죠. 마지막으로 So는 실패를 두려워하지 말라는 결론과 조언으로 이끌어 줍니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>failure\u003c/b>\u003cem>명사\u003c/em>\u003cspan>실패\u003c/span>\u003c/div>\u003cdiv>\u003cb>at all\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>전혀\u003c/span>\u003c/div>\u003cdiv>\u003cb>think of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 떠올리다, 생각하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>sports history\u003c/b>\u003cem>명사\u003c/em>\u003cspan>스포츠 역사\u003c/span>\u003c/div>\u003cdiv>\u003cb>record\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기록\u003c/span>\u003c/div>\u003cdiv>\u003cb>win\u003c/b>\u003cem>명사\u003c/em>\u003cspan>승리\u003c/span>\u003c/div>\u003cdiv>\u003cb>probably\u003c/b>\u003cem>부사\u003c/em>\u003cspan>아마\u003c/span>\u003c/div>\u003cdiv>\u003cb>for example\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>예를 들어\u003c/span>\u003c/div>\u003cdiv>\u003cb>greatest\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>최고의\u003c/span>\u003c/div>\u003cdiv>\u003cb>tennis player\u003c/b>\u003cem>명사\u003c/em>\u003cspan>테니스 선수\u003c/span>\u003c/div>\u003cdiv>\u003cb>title\u003c/b>\u003cem>명사\u003c/em>\u003cspan>우승 타이틀\u003c/span>\u003c/div>\u003cdiv>\u003cb>actually\u003c/b>\u003cem>부사\u003c/em>\u003cspan>실제로\u003c/span>\u003c/div>\u003cdiv>\u003cb>play in\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에서 경기를 하다, 참가하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>more than\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~보다 많은, ~이상\u003c/span>\u003c/div>\u003cdiv>\u003cb>tournament\u003c/b>\u003cem>명사\u003c/em>\u003cspan>토너먼트, 대회\u003c/span>\u003c/div>\u003cdiv>\u003cb>in other words\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>다시 말해서\u003c/span>\u003c/div>\u003cdiv>\u003cb>lose\u003c/b>\u003cem>동사\u003c/em>\u003cspan>지다, 패하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>two-thirds\u003c/b>\u003cem>명사\u003c/em>\u003cspan>3분의 2\u003c/span>\u003c/div>\u003cdiv>\u003cb>many more\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>훨씬 더 많은\u003c/span>\u003c/div>\u003cdiv>\u003cb>still\u003c/b>\u003cem>부사\u003c/em>\u003cspan>그럼에도 불구하고, 여전히\u003c/span>\u003c/div>\u003cdiv>\u003cb>champion\u003c/b>\u003cem>명사\u003c/em>\u003cspan>챔피언, 우승자\u003c/span>\u003c/div>\u003cdiv>\u003cb>success\u003c/b>\u003cem>명사\u003c/em>\u003cspan>성공\u003c/span>\u003c/div>\u003cdiv>\u003cb>make\u003c/b>\u003cem>동사\u003c/em>\u003cspan>만들다\u003c/span>\u003c/div>\u003cdiv>\u003cb>be afraid of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 두려워하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>lose a game\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>경기에서 지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>pass a test\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>시험을 통과하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>perfect\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>완벽한\u003c/span>\u003c/div>\u003cdiv>\u003cb>accept\u003c/b>\u003cem>동사\u003c/em>\u003cspan>받아들이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>move on from\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로부터 나아가다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어도 짚어 볼게요. failure는 실패, champion은 챔피언, tournament는 토너먼트라는 뜻이에요. be afraid of는 두려워하다, accept는 받아들이다, move on from은 나아가다라는 뜻으로 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">failure\u003c/b>\u003cspan class=\"m\">실패\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">defeat\ p-chunk\">\u003cspan class=\"ko\">그는 패했습니다\u003c/span>\u003cspan class=\"en\">he lost\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">3분의 2가 넘는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">two-thirds \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">토너먼트에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">tournaments\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">다시 말해서, 그는 토너먼트의 2/3이상에서 패했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> '60개 이상 출전'을 숫자로 다시 풀어, 그가 \u003cb class=\"key\">대다수\u003c/b> 대회에서 졌음을 분명히 하는 문장이에요. In other words는 앞 문장을 쉽게 \u003cb class=\"key\">바꿔 \u003c/b>\u003cb class=\"key\">말하는\u003c/b> 연결어구입니다. 최고의 선수도 \u003cb class=\"key\">패배\u003c/b>가 훨씬 많다는 사실을 드러내며 글의 주제로 이끄는 결정적 근거죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">환언의 연결어구\u003c/span> : In other words, + [문장] = 다시 말해서 ~ : \"다시 말해서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 in + 부분을 나타내는 of 구\u003c/span> : lose + in + [비율] + of + the + [복수명사] = ~의 ~ 비율에서 지다 : \"그 토너먼트의 3분의 2 이상에서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">분수 표현 + 비교급 more than\u003c/span> : more than + [분수 two-thirds] = ~ 이상 : \"3분의 2가 넘는\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"In other words, 다시 말해서. he lost, 그는 패했습니다. in more than two-thirds, 3분의 2가 넘는. of the tournaments, 토너먼트에서. 이 문장 전체를 해석하면, 다시 말해서, 그는 토너먼트의 2/3이상에서 패했습니다.","hl":"m"},{"n":28,"text":"앞 문장에서 말한 많은 출전을 숫자로 다시 풀어 주는 문장이에요. In other words로 앞 내용을 쉽게 바꿔 말하면서, 그가 대다수 대회에서 졌다는 걸 분명히 하죠. 최고의 선수도 패배가 훨씬 많다는 사실이 이 글의 주제로 이어지는 결정적 근거가 됩니다.","hl":"mn"},{"n":29,"text":"첫 번째로 In other words는 앞 문장을 바꿔 말해 주는 연결어구이고, 뒤에는 앞 내용을 요약한 문장이 이어진다고 보시면 돼요. 두 번째로 two-thirds는 분수 표현이고, 앞에 more than이 붙어서 비율을 나타내는 말이 됩니다. 세 번째로 in more than two-thirds of the tournaments에서 전치사 in은 그 대회들 안에서, of the tournaments는 전체 토너먼트 중 일부를 가리키는 구조예요. 여기서 the는 앞에서 이미 언급한 토너먼트를 다시 가리키는 정관사라는 점도 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 졌습니다\u003c/span>\u003cspan class=\"en\">He lost\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">훨씬 더 많은 토너먼트를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">many \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">tournaments \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그가 이긴 것보다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">won\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 이긴 것보다 더욱 많은 토너먼트에서 졌습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 페더러가 60개 이상의 그랜드슬램 대회에 나왔다고 한 뒤, 그가 이긴 횟수보다 진 횟수가 훨씬 많다는 사실을 구체화합니다. 'many more A than B'는 'B보다 훨씬 더 많은 A'라는 \u003cb class=\"key\">비교 \u003c/b>\u003cb class=\"key\">표현\u003c/b>으로, 승리보다 패배가 압도적으로 많았음을 보여 줍니다. 이는 실패가 많은 사람도 최고가 될 수 있다는 글의 주장을 뒷받침하는 \u003cb class=\"key\">근거\u003c/b>가 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">비교급 강조 many more ~ than\u003c/span> : [many more + 복수명사] + than + [비교 대상 절] : \"그가 이긴 것보다 훨씬 더 많은 토너먼트\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"He lost, 그는 졌습니다. many more tournaments, 훨씬 더 많은 토너먼트를. than he won, 그가 이긴 것보다.. 이 문장 전체를 해석하면, 그는 이긴 것보다 더욱 많은 토너먼트에서 졌습니다.","hl":"m"},{"n":31,"text":"이 문장은 페더러가 이긴 횟수보다 진 횟수가 훨씬 많다는 걸 보여 줘요. many more A than B는 B보다 훨씬 더 많은 A라는 비교 표현이에요. 그래서 이 문장은 실패가 많은 사람도 최고가 될 수 있다는 주장을 받쳐 주는 근거가 됩니다.","hl":"mn"},{"n":32,"text":"첫 번째로 many가 비교급 more를 강조해서 '훨씬 더 많은'이라는 뜻을 만들어요. 두 번째로 than 뒤에는 he won 다음에 원래 tournaments가 있었지만 반복을 피해서 생략된 비교 절이 와요. 그래서 '그가 이긴 것보다 훨씬 더 많은 토너먼트'로 해석합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여전히,\u003c/span>\u003cspan class=\"en\">Still,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 그를 생각합니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">think \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">him \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">챔피언으로,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">champion\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">실패자가 아니라.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">failure\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여전히, 우리는 그를 실패자가 아니라 챔피언으로 생각합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 승패의 숫자만 보면 실패가 많아 보이지만, 사람들은 그를 여전히 챔피언으로 기억한다는 \u003cb class=\"key\">전환\u003c/b>의 문장입니다. 'think of A as B'는 'A를 B로 여기다'라는 뜻으로, 그를 '실패자'가 아니라 '챔피언'으로 평가한다는 점을 분명히 합니다. 여기서 \u003cb class=\"key\">실패\u003c/b>는 정체성이 아니라 성공으로 가는 과정이라는 다음 문장의 주제로 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">think of A as B 관용 표현\u003c/span> : think of + [목적어] + as + [명사(목적격 보어)] : \"우리는 그를 챔피언으로 생각합니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">as 전치사구의 부정과 병렬\u003c/span> : [as + 명사] + not + as + [명사] : \"실패자로서가 아니라\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"Still, 여전히. we think of him, 우리는 그를 생각합니다. as a champion, 챔피언으로. not as a failure, 실패자가 아니라.. 이 문장 전체를 해석하면, 여전히, 우리는 그를 실패자가 아니라 챔피언으로 생각합니다.","hl":"m"},{"n":34,"text":"이 문장은 승패 숫자만 보면 실패가 많아 보이지만 사람들은 그를 여전히 챔피언으로 기억한다는 전환의 문장이에요. think of A as B는 A를 B로 여기다는 뜻으로, 그를 실패자가 아니라 챔피언으로 평가한다는 점을 분명히 해요. 여기서 실패는 정체성이 아니라 성공으로 가는 과정이라는 다음 내용으로 이어집니다.","hl":"mn"},{"n":35,"text":"첫 번째로 we think of him as a champion은 think of A as B, 즉 A를 B로 여기다는 관용 표현이에요. 여기서 as a champion은 him의 자격을 보충하는 목적격 보어 역할을 해요. 두 번째로 not as a failure는 앞의 as a champion과 나란히 연결된 병렬 구조라서 '실패자가 아니라 챔피언'이라는 대조가 또렷해집니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">실패는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Failure\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">성공을 만듭니다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">makes \u003c/span>\u003cspan class=\"tgt\">success\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">실패는 성공을 만듭니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 실패가 오히려 성공을 만들어 내는 \u003cb class=\"key\">원동력\u003c/b>이라는 글의 핵심 주제문입니다. 앞에서 페더러의 많은 패배를 예로 든 이유가 바로 이 말을 뒷받침하기 위해서임을 알 수 있습니다. 'Failure makes success'는 '실패는 성공을 만든다'라는 \u003cb class=\"key\">명제\u003c/b>로, 이후 두려워하지 말라는 조언의 근거가 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">추상명사의 무관사 용법\u003c/span> : [추상명사] + 단수동사 : \"실패는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">3형식 타동사 make\u003c/span> : [주어] + makes + [목적어] : \"성공을 만든다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Failure, 실패는. makes success, 성공을 만듭니다.. 이 문장 전체를 해석하면, 실패는 성공을 만듭니다.","hl":"m"},{"n":37,"text":"이 문장은 실패가 오히려 성공을 만들어 내는 원동력이라는 글의 핵심 주제문이에요. 앞에서 페더러의 많은 패배를 예로 든 이유도 바로 이 말을 뒷받침하기 위해서죠. Failure makes success는 실패는 성공을 만든다는 명제로, 이후 실패를 두려워하지 말라는 조언의 근거가 됩니다.","hl":"mn"},{"n":38,"text":"첫 번째로 Failure는 실패라는 추상 개념이라 관사 없이 단수로 쓰였어요. 두 번째로 makes success에서 make는 만들다, 낳다는 뜻의 타동사로 success를 목적어로 취하는 삼형식 문장을 만듭니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러니\u003c/span>\u003cspan class=\"en\">So\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">두려워하지 마세요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">afraid \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">실패를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of\u003c/span> failure.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러니 실패를 두려워하지 마세요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 실패가 성공을 만든다고 했으니, 이 문장은 그 결론으로 \u003cb class=\"key\">실패\u003c/b>를 무서워할 이유가 없다고 말하고 있어요. 글 전체의 \u003cb class=\"key\">주장\u003c/b>이 담긴 문장이라, 지문의 중심 생각을 묻는 문제에서 핵심이 돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정명령문(be동사의 부정)\u003c/span> : Don't + [be동사] + [형용사] (명령문의 부정) : \"두려워하지 마세요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 of를 취하는 형용사 숙어\u003c/span> : be afraid + [of + 명사] : \"~을 두려워하다\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"So, 그러니. don't be afraid, 두려워하지 마세요. of failure, 실패를. 이 문장 전체를 해석하면, 그러니 실패를 두려워하지 마세요.","hl":"m"},{"n":40,"text":"앞에서 실패가 성공을 만든다고 이야기했죠. 그래서 이 문장은 그 결론으로 실패를 무서워할 이유가 없다고 말하고 있어요. 이 문장이 바로 글 전체의 주장이에요.","hl":"mn"},{"n":41,"text":"첫 번째로 don't be afraid를 보세요. 명령문에서 be동사를 부정할 때는 don't be 형태를 써서 부정명령문을 만든다고 기억해 두세요. 두 번째로 be afraid of는 '~을 두려워하다'라는 숙어예요. afraid 뒤에 전치사 of가 붙어서 두려움의 대상을 받는다는 점을 같이 외워 두면 좋아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">경기에서 지는 것\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Losing \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">game \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또는 시험을 통과하지 못하는 것\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">passing \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">test\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">은 괜찮습니다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">okay\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">경기에서 지거나 시험을 통과하지 못하는 것은 괜찮습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 실패를 두려워하지 말라고 했는데, 여기서는 그 실패를 아주 구체적인 예로 보여 줘요. \u003cb class=\"key\">경기\u003c/b>에서 지는 일과 \u003cb class=\"key\">시험\u003c/b>에서 떨어지는 일 모두 괜찮다고 말하며, 독자의 일상으로 주제를 끌어내리는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사구 주어\u003c/span> : [동명사구 주어] + [단수 동사] : \"경기에서 지거나 시험을 통과하지 못하는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사의 부정\u003c/span> : not + [동명사(-ing)] : \"통과하지 못하는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">주어+be동사+형용사(2형식)\u003c/span> : [주어] + be + [형용사] : \"괜찮습니다\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"Losing a game, 경기에서 지는 것. or not passing a test, 또는 시험을 통과하지 못하는 것. is okay, 은 괜찮습니다.. 이 문장 전체를 해석하면, 경기에서 지거나 시험을 통과하지 못하는 것은 괜찮습니다.","hl":"m"},{"n":43,"text":"앞에서 실패를 두려워하지 말라고 했으니, 여기서는 그 실패를 구체적으로 보여 줘요. 경기에서 지는 일도, 시험을 통과하지 못하는 일도 괜찮다고 말하면서 주제를 우리 일상으로 끌어내리고 있습니다.","hl":"mn"},{"n":44,"text":"첫 번째로 Losing a game or not passing a test를 보세요. 동사 앞에서 '~하는 것'이라는 주어 역할을 하니까 동명사를 쓴 거예요. 두 개를 or로 묶어도 하나의 개념이라서 동사는 단수인 is를 씁니다. 두 번째로 not passing을 보세요. 동명사를 부정할 때는 동명사 앞에 not을 놓는답니다. 세 번째로 is okay는 주어에 be동사와 형용사가 붙은 2형식 문장이에요. be okay로 '괜찮다'라는 뜻을 만든다고 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 누구도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">No \u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">완벽하지는 않습니다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">is\u003c/span> perfect.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 누구도 완벽하지는 않습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 실패해도 괜찮다고 한 이유를 제시하는 문장이에요. \u003cb class=\"key\">완벽한 \u003c/b>\u003cb class=\"key\">사람\u003c/b>은 아무도 없으니 실패는 당연한 일이라고 납득시켜 주죠. 짧지만 \u003cb class=\"key\">근거\u003c/b> 역할을 하는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정대명사 주어의 수 일치\u003c/span> : No one + [단수 동사] : \"그 누구도 …하지는 않습니다\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"No one, 그 누구도. is perfect, 완벽하지는 않습니다.. 이 문장 전체를 해석하면, 그 누구도 완벽하지는 않습니다.","hl":"m"},{"n":46,"text":"앞에서 실패해도 괜찮다고 했는데, 그 이유를 여기서 딱 한 문장으로 제시하고 있어요. 완벽한 사람은 아무도 없으니까 실패하는 건 당연하다는 뜻이죠. 짧지만 앞 문장을 뒷받침하는 근거 역할을 합니다.","hl":"mn"},{"n":47,"text":"여기서는 No one is를 눈여겨보세요. no one은 부정대명사라서 뜻은 '아무도'지만 항상 단수로 취급해요. 그래서 be동사를 복수인 are가 아니라 단수인 is로 쓴답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">받아들이려고 노력하세요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Try \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">accept\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분의 실패를\u003c/span>\u003cspan class=\"en\">your failure\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 나아가세요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">move \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것으로부터\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여러분의 실패를 받아들이고 그것으로부터 나아가려고 노력하세요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글의 마지막 문장으로, 실패는 누구에게나 있는 것이니 두려워하지 말고 \u003cb class=\"key\">받아들인\u003c/b> 뒤 앞으로 \u003cb class=\"key\">나아가라\u003c/b>는 결론적 당부예요. 앞에서 실패가 성공을 만든다고 했으니, 그 결론으로서의 \u003cb class=\"key\">실천적 \u003c/b>\u003cb class=\"key\">조언\u003c/b>이라고 볼 수 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(try의 목적어)\u003c/span> : try + [to accept (to부정사구/목적어)] : \"받아들이려고 노력하세요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 병렬 구조\u003c/span> : to accept + [and (to) move on] : \"그리고 나아가세요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">구동사 + 전치사구\u003c/span> : move on + from + [대명사 it] : \"그것으로부터 나아가다\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"Try to accept, 받아들이려고 노력하세요. your failure, 여러분의 실패를. and move on, 그리고 나아가세요. from it, 그것으로부터. 이 문장 전체를 해석하면, 여러분의 실패를 받아들이고 그것으로부터 나아가려고 노력하세요.","hl":"m"},{"n":49,"text":"이 문장은 글의 마지막 결론이에요. 실패는 누구에게나 있는 것이니 두려워하지 말고 받아들인 다음 앞으로 나아가라고 당부하고 있죠. 앞에서 실패가 성공을 만든다고 했으니, 그 내용을 실천으로 옮기라는 실천적 조언인 셈이에요.","hl":"mn"},{"n":50,"text":"첫 번째, Try to accept에서 to부정사가 try의 목적어 자리에 들어가 목적어 역할을 하고 있어요. 그래서 '받아들이려고 노력하세요'라는 명령문이 되는 거죠. 두 번째, and move on은 앞의 to accept와 병렬을 이루는 구조예요. and 뒤에서 to가 생략된 채 두 동작이 함께 try의 목적어로 묶여 있다는 점을 기억하세요. 세 번째, move on from it에서 move on은 계속 나아가다라는 구동사이고, from it은 그것으로부터라는 전치사구로 출발점을 나타내요. 여기서 it은 앞에 나온 실패를 가리키는 대명사랍니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>전혀 \u003cb class=\"key\">실패\u003c/b>한 적 없는 사람이나 우승만 기록한 사람은 현실에 거의 없습니다.\u003c/li>\u003cli>\u003cb class=\"key\">Roger \u003c/b>\u003cb class=\"key\">Federer\u003c/b>도 수많은 그랜드 슬램 토너먼트에서 패배했지만 \u003cb class=\"key\">챔피언\u003c/b>으로 남았습니다.\u003c/li>\u003cli>이는 \u003cb class=\"key\">실패\u003c/b>가 \u003cb class=\"key\">성공\u003c/b>을 만드는 과정임을 보여 줍니다.\u003c/li>\u003cli>그러므로 경기나 시험에서의 실패를 받아들이고 \u003cb class=\"key\">두려움\u003c/b> 없이 앞으로 나아가야 합니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Failure is a natural part of success, so we should accept it and move on rather than fear it.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">전혀 \u003cb class=\"key\">실패\u003c/b>한 적 없는 사람은 없으며, \u003cb class=\"key\">Roger \u003c/b>\u003cb class=\"key\">Federer\u003c/b>조차 많은 토너먼트에서 졌다. 그러나 우리는 그를 \u003cb class=\"key\">챔피언\u003c/b>으로 여기며, \u003cb class=\"key\">실패\u003c/b>를 두려워하지 말고 받아들이고 나아가야 한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":51,"text":"오늘 글의 핵심은 실패가 성공을 만든다는 것이었죠. 위대한 챔피언도 수많은 패배를 겪지만, 그 패배를 성장의 과정으로 받아들입니다. 여러분도 시험이나 경기에서의 실패를 두려워하지 말고, 그 경험을 다음 도약의 발판으로 삼아 보세요. 오늘 수업도 여기까지입니다, 수고했어요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
