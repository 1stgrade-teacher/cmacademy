<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터1 Reading 18 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터1 Reading 18","audioDir":"18_audio","preview":false,"count":52,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.668em\">Reading\u003cbr>18\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터1\u003c/div>\u003ch1>Sharks: Special Features for Survival\u003c/h1>\u003ch2>상어: 생존을 위한 특별한 특징\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>상어는 얕은 물에서 깊은 바다까지 넓은 \u003cb class=\"key\">서식지\u003c/b>를 가지며, 종에 따라 \u003cb class=\"key\">수명\u003c/b>이 다르다. 또한 날카로운 \u003cb class=\"key\">이빨\u003c/b>, 뛰어난 \u003cb class=\"key\">시력\u003c/b>, 위아래 색이 다른 \u003cb class=\"key\">피부\u003c/b>를 이용해 먹이를 잡고 위협을 피한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Sharks have several physical features and senses that help them survive and hunt in the sea.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 상어의 여러 가지 특징을 담은 지문을 함께 읽어 볼 거예요. 이 글은 상어의 서식지와 수명, 이빨과 식성, 시력, 피부색을 차례로 소개해요. 핵심은 상어의 여러 특징이 먹이를 잡고 위협을 피하는 데 도움이 된다는 점이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">상어는 뼈가 단단한 경골어류(bony fish)가 아니라 연골로 이루어진 \u003cb class=\"key\">연골 \u003c/b>\u003cb class=\"key\">어류\u003c/b>(cartilaginous fish)로 분류된다. 이들은 바다의 다양한 환경에 적응해 얕은 물에서 깊은 바다까지 넓은 \u003cb class=\"key\">서식 \u003c/b>\u003cb class=\"key\">범위\u003c/b>를 가진다. 지문에 나오는 위쪽은 어둡고 아래쪽은 밝은 피부색은 \u003cb class=\"key\">보호색\u003c/b>(countershading)의 한 종류로, 위에서 보는 포식자와 아래에서 보는 먹이 모두에게 몸을 덜 눈에 띄게 한다. 이것은 마치 군대의 위장복이 주변 배경과 비슷해지는 것과 같은 원리다. 또한 날카로운 \u003cb class=\"key\">이빨\u003c/b>과 뛰어난 \u003cb class=\"key\">시력\u003c/b>은 상어가 먹이를 포착하고 사냥하는 데 유리하게 작용한다.\u003c/div>","segs":[{"n":2,"text":"상어는 뼈가 단단한 물고기라기보다 연골로 이루어진 연골 어류예요. 그래서 영어로 cartilaginous fish라고 부르죠. 상어는 바다의 다양한 환경에 적응해 얕은 물에서 깊은 바다까지 넓은 서식 범위를 가져요. 또 몸의 위쪽은 어둡고 아래쪽은 밝은데, 이런 보호색을 countershading이라고 해요. 이것은 위에서 보는 포식자와 아래에서 보는 먹이 모두에게 상어의 모습을 덜 띄게 해 주고, 날카로운 이빨과 뛰어난 시력은 먹이를 잡는 데 도움을 줘요. 마치 군대의 위장복처럼 주변 배경에 자연스럽게 섞이는 원리와도 같아요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>바다 전역의 서식지\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>상어는 바다의 모든 \u003cb class=\"key\">지역\u003c/b>에 산다. 얕은 물에서 깊은 바다까지 그들을 볼 수 있다는 말은 상어의 \u003cb class=\"key\">서식 \u003c/b>\u003cb class=\"key\">범위\u003c/b>가 매우 넓다는 뜻이다. 이 문장은 상어가 다양한 해양 환경에 적응한 동물임을 보여 준다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>종에 따른 수명\u003csmall>특징 · 문장 3\u003c/small>\u003c/h4>\u003cp>대부분의 상어는 20에서 30년을 산다. 하지만 일부 \u003cb class=\"key\">종\u003c/b>은 훨씬 더 오래 살 수 있다. 이런 \u003cb class=\"key\">수명 \u003c/b>\u003cb class=\"key\">차이\u003c/b>는 같은 상어라도 종류마다 생존 기간이 다르다는 점을 보여 준다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>이빨과 먹이 섭취\u003csmall>예시 · 문장 4–8\u003c/small>\u003c/h4>\u003cp>상어는 크고 날카로운 \u003cb class=\"key\">이빨\u003c/b>을 가지고 있다. 인간은 치아로 음식을 물고 씹지만, 상어는 이빨로 먹이를 잡아 한 번에 \u003cb class=\"key\">삼킨다\u003c/b>. 뱀상어가 거북이를 먹고 청상아리가 오징어를 좋아한다는 \u003cb class=\"key\">예시\u003c/b>가 이어진다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>뛰어난 시력\u003csmall>특징 · 문장 9–10\u003c/small>\u003c/h4>\u003cp>대부분의 상어는 \u003cb class=\"key\">시력\u003c/b>이 좋다. 그들은 환상적인 \u003cb class=\"key\">야간 \u003c/b>\u003cb class=\"key\">시력\u003c/b>을 가지고 있고 색상도 구별할 수 있다. 이는 어두운 바다에서 먹이를 찾는 데 유리하다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>보호색과 생존 전략\u003csmall>정리 · 문장 11–13\u003c/small>\u003c/h4>\u003cp>상어 몸은 위쪽이 어두운 \u003cb class=\"key\">피부\u003c/b>색이고 아래쪽이 밝은 피부색이다. 이러한 \u003cb class=\"key\">보호색\u003c/b>은 상어가 위협으로부터 숨는 데 도움을 준다. 또한 먹이 \u003cb class=\"key\">사냥\u003c/b>을 더 쉽게 만들어 준다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 지문을 순서대로 나누어, 상어의 서식지부터 보호색까지 차례대로 살펴볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 상어의 서식지예요. 상어는 바다의 모든 지역에 살고, 얕은 물에서 깊은 바다까지 볼 수 있어요. 그래서 상어의 서식 범위가 아주 넓다는 것을 알 수 있죠.","hl":"f0"},{"n":5,"text":"두 번째 단계는 수명이에요. 대부분의 상어는 이십 년에서 삼십 년 정도 살지만, 일부 종은 훨씬 더 오래 살 수 있어요. 이 수명 차이는 상어마다 종류가 다르기 때문에 생겨요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 이빨과 먹이 섭취예요. 상어는 크고 날카로운 이빨로 먹이를 잡고 한 번에 삼킨다고 해요. 인간이 음식을 물고 씹는 것과 대조되죠. 뱀상어가 거북이를 먹고 청상아리가 오징어를 좋아한다는 예시도 함께 기억해 두세요.","hl":"f2"},{"n":7,"text":"네 번째 단계는 시력이에요. 대부분의 상어는 시력이 좋고, 환상적인 야간 시력을 가지고 있답니다. 어두운 바다에서도 색을 구별할 수 있어 먹이를 찾는 데 유리해요.","hl":"f3"},{"n":8,"text":"마지막 단계는 보호색이에요. 상어의 피부는 위쪽이 어둡고 아래쪽이 밝아요. 이런 보호색은 위협으로부터 몸을 숨기게 하고, 먹이 사냥을 더 쉽게 만들어 줘요.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">분류\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 상어의 \u003cb class=\"key\">서식지\u003c/b>, 수명, 이빨과 식성, 시력, 보호색을 항목별로 나누어 설명하는 \u003cb class=\"key\">분류\u003c/b> 구조다. 첫 문장에서 상어가 바다의 모든 지역에 산다고 제시하며 글의 대상을 열어 주므로 \u003cb class=\"key\">두괄식\u003c/b>으로 볼 수 있다. 이후 각 문장은 구체적인 특징과 예시를 덧붙이며 상어의 생존 방식을 보여 준다. 따라서 전체를 관통하는 하나의 주장보다 여러 특징을 나열하는 설명문에 가깝다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>but (3)\u003c/b>\u003cspan>수명 차이 제시\u003c/span>\u003cb>While (5)\u003c/b>\u003cspan>인간과 상어의 대조\u003c/span>\u003cb>as well as (6)\u003c/b>\u003cspan>정보 추가\u003c/span>\u003cb>For example (7)\u003c/b>\u003cspan>예시 제시\u003c/span>\u003cb>And (8)\u003c/b>\u003cspan>예시 추가\u003c/span>\u003cb>too (10)\u003c/b>\u003cspan>정보 추가\u003c/span>\u003cb>too (13)\u003c/b>\u003cspan>정보 추가\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">live in all areas of the seas\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">shallow water to the deep sea\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">use their teeth to grab food and swallow it all at once\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">eat animals like fish or seals as well as other prey\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">like to eat turtles / love squids\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">have good eyesight\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">fantastic night vision and can see colors\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">dark skin on top and light skin on the bottom\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">hide from threats\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">make hunting prey easier\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>인간\u003c/th>\u003cth>상어\u003c/th>\u003c/tr>\u003ctr>\u003ctd>이빨로 음식을 물고 씹음\u003c/td>\u003ctd>이빨로 먹이를 잡아 한 번에 삼킴\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글은 상어의 서식지, 수명, 이빨, 시력, 보호색 같은 특징을 여러 갈래로 나누어 설명하는 분류 구조예요. 첫 문장에서 상어가 바다의 모든 지역에 산다고 말하며 글의 대상을 먼저 제시하죠. 그래서 전체 흐름을 두괄식으로 볼 수 있어요. 물론 뒤로 갈수록 수명, 이빨, 시력, 보호색 같은 세부 특징이 이어집니다.","hl":"ty"},{"n":10,"text":"신호어를 보면 but이 수명의 차이를 알려 주고, While은 인간과 상어의 이빨 사용법을 대조해요. For example은 뱀상어와 청상아리의 먹이 예시를 끌어오고, too는 앞 내용에 정보를 더한다는 표시예요. 또 dark skin on top and light skin on the bottom처럼 위와 아래의 색을 반복해 설명하며 보호색 개념으로 이어 가지요. 이런 신호어와 재진술을 따라가면 글의 구조가 더 선명해집니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>live\u003c/b>\u003cem>동사\u003c/em>\u003cspan>살다\u003c/span>\u003c/div>\u003cdiv>\u003cb>shallow\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>얕은\u003c/span>\u003c/div>\u003cdiv>\u003cb>deep\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>깊은\u003c/span>\u003c/div>\u003cdiv>\u003cb>most\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>대부분의\u003c/span>\u003c/div>\u003cdiv>\u003cb>species\u003c/b>\u003cem>명사\u003c/em>\u003cspan>종\u003c/span>\u003c/div>\u003cdiv>\u003cb>far\u003c/b>\u003cem>부사\u003c/em>\u003cspan>훨씬\u003c/span>\u003c/div>\u003cdiv>\u003cb>sharp\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>날카로운\u003c/span>\u003c/div>\u003cdiv>\u003cb>tooth\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이빨\u003c/span>\u003c/div>\u003cdiv>\u003cb>while\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>~하는 반면에\u003c/span>\u003c/div>\u003cdiv>\u003cb>bite\u003c/b>\u003cem>동사\u003c/em>\u003cspan>물다\u003c/span>\u003c/div>\u003cdiv>\u003cb>chew\u003c/b>\u003cem>동사\u003c/em>\u003cspan>씹다\u003c/span>\u003c/div>\u003cdiv>\u003cb>grab\u003c/b>\u003cem>동사\u003c/em>\u003cspan>잡다\u003c/span>\u003c/div>\u003cdiv>\u003cb>swallow\u003c/b>\u003cem>동사\u003c/em>\u003cspan>삼키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>all at once\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>한 번에\u003c/span>\u003c/div>\u003cdiv>\u003cb>as well as\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~뿐만 아니라\u003c/span>\u003c/div>\u003cdiv>\u003cb>prey\u003c/b>\u003cem>명사\u003c/em>\u003cspan>먹이\u003c/span>\u003c/div>\u003cdiv>\u003cb>for example\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>예를 들어\u003c/span>\u003c/div>\u003cdiv>\u003cb>turtle\u003c/b>\u003cem>명사\u003c/em>\u003cspan>거북\u003c/span>\u003c/div>\u003cdiv>\u003cb>squid\u003c/b>\u003cem>명사\u003c/em>\u003cspan>오징어\u003c/span>\u003c/div>\u003cdiv>\u003cb>eyesight\u003c/b>\u003cem>명사\u003c/em>\u003cspan>시력\u003c/span>\u003c/div>\u003cdiv>\u003cb>fantastic\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>환상적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>night vision\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>야간 시력\u003c/span>\u003c/div>\u003cdiv>\u003cb>color\u003c/b>\u003cem>명사\u003c/em>\u003cspan>색, 색상\u003c/span>\u003c/div>\u003cdiv>\u003cb>skin\u003c/b>\u003cem>명사\u003c/em>\u003cspan>피부\u003c/span>\u003c/div>\u003cdiv>\u003cb>on top\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>위쪽에\u003c/span>\u003c/div>\u003cdiv>\u003cb>on the bottom\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>아래쪽에\u003c/span>\u003c/div>\u003cdiv>\u003cb>hide\u003c/b>\u003cem>동사\u003c/em>\u003cspan>숨다\u003c/span>\u003c/div>\u003cdiv>\u003cb>threat\u003c/b>\u003cem>명사\u003c/em>\u003cspan>위협\u003c/span>\u003c/div>\u003cdiv>\u003cb>hunting\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사냥\u003c/span>\u003c/div>\u003cdiv>\u003cb>easy\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>쉬운\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"중요 단어로는 shallow, deep, prey, swallow, threat를 꼭 기억해 두세요. shallow는 얕은, deep은 깊은이라는 뜻이고, prey는 먹이가 되는 동물을 말해요. swallow는 삼키다, threat는 위협이라는 뜻으로, 상어의 생존 방식과 연결됩니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">deep\u003c/b>\u003cspan class=\"m\">깊은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">profound\u003c/span>\u003cspan class=\"s\">bottomless\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">shallow\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">sharp\u003c/b>\u003cspan class=\"m\">날카로운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">pointed\u003c/span>\u003cspan class=\"s\">keen\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">dull\u003c/span>\u003cspan class=\"a\">blunt\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">grab\u003c/b>\u003cspan class=\"m\">잡다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">seize\u003c/span>\u003cspan class=\"s\">grasp\u003c/span>\u003cspan class=\"s\">snatch\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">release\u003c/span>\u003cspan class=\"a\">drop\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">swallow\u003c/b>\u003cspan class=\"m\">삼키다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">gulp\u003c/span>\u003cspan class=\"s\">ingest\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">spit\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">hide\u003c/b>\u003cspan class=\"m\">숨다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">conceal\u003c/span>\u003cspan class=\"s\">cover\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">reveal\u003c/span>\u003cspan class=\"a\">expose\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">threat\u003c/b>\u003cspan class=\"m\">위협\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">danger\u003c/span>\u003cspan class=\"s\">menace\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">safety\u003c/span>\u003cspan class=\"a\">protection\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">easy\u003c/b>\u003cspan class=\"m\">쉬운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">simple\u003c/span>\u003cspan class=\"s\">effortless\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">difficult\u003c/span>\u003cspan class=\"a\">hard\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"먼저 deep은 profound나 bottomless로 바꿔 말할 수 있고, 반대말은 shallow예요. sharp는 pointed나 keen으로 표현할 수 있으며 반대는 dull이나 blunt예요. grab은 seize, grasp, snatch처럼 바꿀 수 있고, swallow는 gulp나 ingest, 반대는 spit이에요. hide는 conceal이나 cover로 바꿀 수 있고 반대는 reveal이나 expose이며, threat는 danger나 menace, 반대는 safety나 protection이에요. 마지막으로 easy는 simple이나 effortless로 바꿀 수 있고 반대는 difficult나 hard입니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상어는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Sharks \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">산다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">live\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바다의 모든 지역에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">all \u003c/span>\u003cspan class=\"tgt\">areas \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">seas\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">상어는 바다의 모든 지역에 산다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 상어가 사는 곳이 \u003cb class=\"key\">바다 \u003c/b>\u003cb class=\"key\">전체\u003c/b>임을 먼저 알려 주는 문장이에요. 이 지문은 상어의 서식지, 수명, 이빨, 먹이, 시력, 몸 색깔 순으로 특징을 소개하므로, 이 문장은 자연스럽게 \u003cb class=\"key\">도입\u003c/b> 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주어-동사 수 일치(현재시제)\u003c/span> : [복수 주어 Sharks] + [동사원형 live] : \"상어는 산다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 명사 수식(형용사구)\u003c/span> : [all areas] + [of the seas (전치사구/형용사구)] : \"바다의 모든 지역에\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"Sharks, 상어는. live, 산다. in all areas of the seas, 바다의 모든 지역에. 이 문장 전체를 해석하면, 상어는 바다의 모든 지역에 산다.","hl":"m"},{"n":14,"text":"이 문장은 상어가 사는 곳이 바다 전체라는 점을 먼저 알려 줘요. 글 전체가 상어의 특징을 차례로 소개하는 흐름이라, 이 문장은 자연스럽게 도입 역할을 합니다.","hl":"mn"},{"n":15,"text":"어법은 두 가지예요. 첫째, 주어 Sharks가 복수라서 동사 live가 원형 그대로 왔어요. 주어와 동사의 수를 맞추는 수 일치를 꼭 기억하세요. 둘째, in all areas of the seas에서 of the seas라는 전치사구가 앞의 명사 areas를 뒤에서 꾸며 주는 형용사구 역할을 해요. 장소를 나타내는 전치사 in이 붙어서 모든 지역 안이라는 장소 의미를 완성해 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는\u003c/span>\u003cspan class=\"en\">We\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">볼 수 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">see\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">them\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">얕은 물에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">shallow \u003c/span>\u003cspan class=\"tgt\">water \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">깊은 바다까지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">deep \u003c/span>\u003cspan class=\"tgt\">sea\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">얕은 물에서 깊은 바다까지 그들을 볼 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 말한 서식 범위를 \u003cb class=\"key\">얕은 \u003c/b>\u003cb class=\"key\">물\u003c/b>과 \u003cb class=\"key\">깊은 \u003c/b>\u003cb class=\"key\">바다\u003c/b>로 구체화해 보여 주는 문장이에요. 상어가 사는 곳이 얼마나 넓은지를 독자에게 각인시켜 주죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 can(가능·능력)\u003c/span> : [can] + [동사원형 see] : \"볼 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">대명사의 문맥 지칭(목적격)\u003c/span> : [them] → 앞 문장의 [sharks] : \"그들을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사구로 표현한 범위\u003c/span> : [in shallow water] + [to the deep sea] : \"얕은 물에서 깊은 바다까지\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"We, 우리는. can see, 볼 수 있다. them, 그들을. in shallow water, 얕은 물에서. to the deep sea, 깊은 바다까지. 이 문장 전체를 해석하면, 얕은 물에서 깊은 바다까지 그들을 볼 수 있다.","hl":"m"},{"n":17,"text":"앞 문장에서 상어가 사는 곳을 말했으니, 여기서는 그 범위를 얕은 물과 깊은 바다로 구체적으로 보여 줘요. 독자에게 상어의 서식 범위가 아주 넓다는 인상을 남기는 문장입니다.","hl":"mn"},{"n":18,"text":"세 가지를 짚을게요. 첫째, can see에서 조동사 can 뒤에는 반드시 동사원형이 와요. 여기서는 볼 수 있다는 가능의 뜻입니다. 둘째, them은 앞 문장에 나온 sharks를 가리키는 목적격 대명사예요. 셋째, in shallow water to the deep sea는 원래 from A to B인데 from이 빠진 범위 표현이에요. 얕은 물에서 깊은 바다까지라는 장소의 범위를 전치사구 두 개로 이어 붙인 겁니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대부분의 상어는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Most \u003c/span>\u003cspan class=\"tgt\">sharks\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">20에서 30년을 산다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">live \u003c/span>\u003cspan class=\"tgt\">20 \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">30 \u003c/span>\u003cspan class=\"tgt\">years\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 일부 종은\u003c/span>\u003cspan class=\"en\">but some species\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">훨씬 더 오래 살 수 있다\u003c/span>\u003cspan class=\"en\">can live \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">far \u003c/span>\u003cspan class=\"tgt\">longer\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">대부분의 상어는 20에서 30년을 살지만 일부 종은 훨씬 더 오래 살 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 상어의 수명을 \u003cb class=\"key\">일반적인 \u003c/b>\u003cb class=\"key\">경우\u003c/b>와 \u003cb class=\"key\">예외\u003c/b>로 나누어 제시하는 문장이에요. but으로 두 경우를 대비시켜, 일부 종의 수명이 훨씬 길다는 정보를 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">most + 복수명사 주어\u003c/span> : [Most] + [복수명사 sharks] + [복수동사] : \"대부분의 상어는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">자동사의 기간 표현\u003c/span> : [live (자동사)] + [기간 표현 20 to 30 years] : \"20에서 30년을 산다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">비교급 강조 부사 far\u003c/span> : [far] + [비교급 longer] : \"훨씬 더 오래\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"Most sharks, 대부분의 상어는. live 20 to 30 years, 20에서 30년을 산다. but some species, 그러나 일부 종은. can live far longer, 훨씬 더 오래 살 수 있다. 이 문장 전체를 해석하면, 대부분의 상어는 20에서 30년을 살지만 일부 종은 훨씬 더 오래 살 수 있다.","hl":"m"},{"n":20,"text":"상어의 수명을 이야기하면서 대부분은 이십 년에서 삼십 년 정도지만 예외가 있다는 점을 짚어요. but으로 일반적인 경우와 특별한 경우를 대비시켜 수명 정보를 더 흥미롭게 만들어 줍니다.","hl":"mn"},{"n":21,"text":"첫째, Most sharks에서 Most는 복수명사 앞에서 대부분의라는 한정 의미를 만들어요. 그래서 뒤 동사도 복수로 받습니다. 둘째, live twenty to thirty years에서 live는 자동사라서 뒤의 기간 표현이 목적어가 아니라 동작의 기간을 알려 주는 부사구처럼 쓰였어요. 셋째, far longer에서 far는 비교급 앞에서 훨씬이라는 강조를 더해 줍니다. much나 even, a lot도 같은 비교급 강조 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상어는\u003c/span>\u003cspan class=\"en\">Sharks\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가지고 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">크고 날카로운 이빨을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">big, \u003c/span>\u003cspan class=\"tgt\">sharp \u003c/span>\u003cspan class=\"tgt\">teeth\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">상어는 크고 날카로운 이빨을 가지고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 상어의 \u003cb class=\"key\">이빨\u003c/b>이 얼마나 크고 날카로운지 한눈에 보여 주는 문장이에요. 바로 뒤에서 이빨의 쓰임을 인간과 비교해 설명하기 때문에, 이 문장은 그 \u003cb class=\"key\">비교\u003c/b>를 위한 준비 단계 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">타동사 have + 목적어\u003c/span> : [주어] + have + [목적어] → '~은 …을 가지고 있다' : \"크고 날카로운 이빨을 가지고 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">형용사의 병렬\u003c/span> : [형용사1], [형용사2] + [명사] → 하나의 명사를 함께 수식 : \"크고 날카로운\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"Sharks, 상어는. have, 가지고 있다. big, sharp teeth, 크고 날카로운 이빨을. 이 문장 전체를 해석하면, 상어는 크고 날카로운 이빨을 가지고 있다.","hl":"m"},{"n":23,"text":"상어의 이빨이 얼마나 크고 날카로운지 보여 주는 문장이에요. 바로 다음 문장에서 이 이빨을 인간의 이빨과 비교하니까, 여기서는 비교를 위한 준비를 하고 있다고 생각하면 됩니다.","hl":"mn"},{"n":24,"text":"먼저 big과 sharp가 쉼표로 나란히 이어지는 병렬 구조를 봐요. 두 형용사가 함께 teeth를 꾸며 주니까 크고 날카로운 이빨이라고 해석하면 되죠. 그리고 have는 뒤에 명사를 목적어로 바로 받는 타동사라서 이빨을 가지고 있다는 뜻으로 쓰였어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인간은 이빨을 사용하는 반면에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">While \u003c/span>\u003cspan class=\"tgt\">humans \u003c/span>\u003cspan class=\"tgt\">use \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">teeth\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">음식을 물고 씹기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">bite \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">chew \u003c/span>\u003cspan class=\"tgt\">food\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상어는 이빨을 사용한다\u003c/span>\u003cspan class=\"en\">sharks use their teeth\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">먹이를 잡기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">grab \u003c/span>\u003cspan class=\"tgt\">food \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 한 번에 삼킨다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">swallow \u003c/span>\u003cspan class=\"tgt\">it\u003c/span> all at once.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">인간은 치아를 사용하여 음식을 물고 씹는 반면에, 상어는 이빨을 사용하여 먹이를 잡고 한 번에 삼킨다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 인간과 상어가 이빨을 쓰는 \u003cb class=\"key\">방식\u003c/b>을 대조해서 보여 주는 문장이에요. 인간은 씹기 위해, 상어는 잡아서 통째로 삼키기 위해 이빨을 쓴다는 \u003cb class=\"key\">차이\u003c/b>가 글의 핵심입니다. 앞 문장에서 언급한 날카로운 이빨이 어떤 \u003cb class=\"key\">역할\u003c/b>을 하는지 구체적으로 밝혀 주는 부분이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 while (대조)\u003c/span> : While + [주어 + 동사], [주절] → '~하는 반면에' : \"인간은 이빨을 사용하는 반면에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : [주어 + 동사] + to + [동사원형] → '~하기 위해' : \"음식을 물고 씹기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 병렬\u003c/span> : to + [동사원형 A] + and + [동사원형 B] → 'A하고 B하다' : \"먹이를 잡고 그것을 삼키기 위해\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"While humans use their teeth, 인간은 이빨을 사용하는 반면에. to bite and chew food, 음식을 물고 씹기 위해. sharks use their teeth, 상어는 이빨을 사용한다. to grab food, 먹이를 잡기 위해. and swallow it all at once, 그리고 한 번에 삼킨다. 이 문장 전체를 해석하면, 인간은 치아를 사용하여 음식을 물고 씹는 반면에, 상어는 이빨을 사용하여 먹이를 잡고 한 번에 삼킨다.","hl":"m"},{"n":26,"text":"인간과 상어가 이빨을 쓰는 방식이 어떻게 다른지 대조해서 보여 주는 문장이에요. 인간은 씹기 위해서, 상어는 잡아서 통째로 삼키기 위해서 이빨을 쓴다는 차이가 이 글의 핵심이에요. 앞에서 말한 날카로운 이빨의 역할이 바로 여기서 구체적으로 드러납니다.","hl":"mn"},{"n":27,"text":"먼저 While은 두 상황을 대조하는 접속사예요. 인간과 상어의 이빨 사용법이 다르다는 걸 한눈에 보여 주죠. 두 번째로 to bite and chew는 목적을 나타내는 to부정사예요. 그리고 to grab food and swallow it에서는 to grab과 swallow가 and로 병렬로 이어져서 잡는 동작과 삼키는 동작을 함께 묶어 줍니다. 마지막으로 all at once는 한 번에라는 뜻으로, 씹지 않고 통째로 삼킨다는 점을 강조해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 동물을 먹는다\u003c/span>\u003cspan class=\"en\">They eat animals\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">물고기나 물개 같은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">fish \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">seals\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 먹이뿐만 아니라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">well \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">other \u003c/span>\u003cspan class=\"tgt\">prey\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 다른 먹이뿐만 아니라 물고기나 물개와 같은 동물을 먹는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 상어의 \u003cb class=\"key\">먹이\u003c/b>가 무엇인지 구체적으로 알려 주는 문장이에요. 물고기나 물개 같은 동물에 다른 먹잇감까지 더한다는 점을 \u003cb class=\"key\">as \u003c/b>\u003cb class=\"key\">well \u003c/b>\u003cb class=\"key\">as\u003c/b>로 묶어 폭넓은 식성을 보여 줍니다. 바로 뒤에 호랑이상어와 청상어의 예가 이어지므로, 이 문장은 \u003cb class=\"key\">예시\u003c/b>를 이끄는 도입 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 like (~와 같은)\u003c/span> : [명사] + like + [예시 명사] → '~와 같은' : \"물고기나 물개와 같은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">상관접속표현 as well as\u003c/span> : A as well as B → 'B뿐만 아니라 A도' : \"다른 먹이뿐만 아니라\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"They eat animals, 그들은 동물을 먹는다. like fish or seals, 물고기나 물개 같은. as well as other prey, 다른 먹이뿐만 아니라. 이 문장 전체를 해석하면, 그들은 다른 먹이뿐만 아니라 물고기나 물개와 같은 동물을 먹는다.","hl":"m"},{"n":29,"text":"상어가 무엇을 먹는지 구체적으로 알려 주는 문장이에요. 물고기나 물개 같은 동물에 다른 먹잇감까지 더한다는 걸 as well as로 묶어서 보여 주죠. 바로 뒤에 호랑이상어와 청상어의 예가 나오니까 이 문장은 예시를 끌어오는 도입 역할을 합니다.","hl":"mn"},{"n":30,"text":"먼저 like는 여기서 좋아하다라는 동사가 아니라 예를 드는 전치사예요. animals 뒤에 붙어서 어떤 동물인지 예시를 보여 주죠. 두 번째로 as well as는 앞의 내용을 추가하는 상관접속 표현이에요. 그래서 animals like fish or seals as well as other prey는 다른 먹이뿐만 아니라 물고기나 물개 같은 동물도 먹는다는 뜻이 됩니다. 해석할 때 순서를 바꿔서 읽는 게 포인트예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들어,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">For \u003c/span>\u003cspan class=\"tgt\">example,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">뱀상어는\u003c/span>\u003cspan class=\"en\">tiger sharks\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">먹는 것을 좋아한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">eat\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거북이를\u003c/span>\u003cspan class=\"en\">turtles.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">예를 들어, 뱀상어는 거북이를 먹는 것을 좋아한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 상어의 먹이를 일반적으로 설명한 뒤, \u003cb class=\"key\">구체적 \u003c/b>\u003cb class=\"key\">예시\u003c/b>를 들어 주는 문장이에요. 뱀상어가 \u003cb class=\"key\">거북이\u003c/b>를 즐겨 먹는다는 사실로 상어의 먹이가 다양하다는 점을 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">예시를 드는 연결어(관용표현)\u003c/span> : [For example,] + [문장] (앞 내용을 구체적인 예로 제시) : \"예를 들어\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : like [타동사] + [to eat (to부정사구/목적어)] : \"먹는 것을 좋아한다\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"For example, 예를 들어. tiger sharks, 뱀상어는. like to eat, 먹는 것을 좋아한다. turtles, 거북이를. 이 문장 전체를 해석하면, 예를 들어, 뱀상어는 거북이를 먹는 것을 좋아한다.","hl":"m"},{"n":32,"text":"앞에서 상어가 물고기나 물개 같은 동물을 먹는다고 했죠. 이 문장은 그 내용을 구체적 예시로 보여 주는 역할을 해요. 뱀상어는 거북이를 즐겨 먹는다는 사실, 시험에도 자주 나오니까 꼭 기억해 두세요.","hl":"mn"},{"n":33,"text":"첫 번째 포인트는 For example이에요. 앞 문장의 내용을 구체적 예시로 받아 주는 연결어죠. 두 번째는 like to eat인데요, like 뒤에 동사원형이 아니라 to eat이 와서 먹는 것이라는 목적어 역할을 합니다. 여기서 to부정사가 목적어로 쓰였다는 점을 꼭 짚어 주세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">And\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">청상아리는\u003c/span>\u003cspan class=\"en\">blue sharks\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오징어를 좋아한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">love \u003c/span>\u003cspan class=\"tgt\">squids\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그리고 청상아리는 오징어를 좋아한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에 이어 두 번째 \u003cb class=\"key\">예시\u003c/b>를 더하는 문장이에요. 뱀상어가 거북이를 먹는다면 청상아리는 \u003cb class=\"key\">오징어\u003c/b>를 좋아한다는 뜻이죠. 상어마다 \u003cb class=\"key\">좋아하는 \u003c/b>\u003cb class=\"key\">먹이\u003c/b>가 다르다는 것을 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">문장 앞 And의 첨가 연결 기능\u003c/span> : [And] + [문장] (앞 내용에 같은 종류의 정보를 하나 더 추가) : \"그리고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">3형식 문형(주어+동사+목적어)\u003c/span> : [주어 blue sharks] + [동사 love] + [목적어 squids] : \"오징어를 좋아한다\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"And, 그리고. blue sharks, 청상아리는. love squids, 오징어를 좋아한다. 이 문장 전체를 해석하면, 그리고 청상아리는 오징어를 좋아한다.","hl":"m"},{"n":35,"text":"앞 문장에 이어 두 번째 예시를 더하는 문장이에요. 뱀상어가 거북이를 먹는다면 청상아리는 오징어를 좋아한다는 거죠. 상어마다 좋아하는 먹이가 다르다는 걸 보여 주는 대목입니다.","hl":"mn"},{"n":36,"text":"첫 번째는 문장 앞에 온 And예요. 앞 내용에 같은 종류의 정보를 하나 더 추가하는 연결어 역할을 하죠. 두 번째는 love squids인데요, 주어 blue sharks 다음에 동사 love가 오고 그 뒤에 목적어 squids가 오는 삼 형식 문형입니다. squid의 복수형이 squids로 쓰였다는 점도 함께 기억해 주세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대부분의 상어는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Most \u003c/span>\u003cspan class=\"tgt\">sharks\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가진다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">좋은 시력을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">good \u003c/span>\u003cspan class=\"tgt\">eyesight\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">대부분의 상어는 시력이 좋다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 먹이 이야기에서 \u003cb class=\"key\">시력\u003c/b>이라는 새로운 화제로 넘어가는 문장이에요. 대부분의 상어가 \u003cb class=\"key\">눈이 \u003c/b>\u003cb class=\"key\">좋다\u003c/b>는 점을 먼저 제시하고, 다음 문장에서 밤눈과 색 구별 능력으로 이어집니다. eyesight는 '시력'이라는 뜻의 \u003cb class=\"key\">명사\u003c/b>예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">한정사 most + 복수 보통명사\u003c/span> : most + [복수명사] (관사 없이 '대부분의 ~') : \"대부분의 상어는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">3형식 문형(주어+동사+목적어)\u003c/span> : [주어] + [동사 have] + [목적어 good eyesight] : \"시력이 좋다\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"Most sharks, 대부분의 상어는. have, 가진다. good eyesight, 좋은 시력을. 이 문장 전체를 해석하면, 대부분의 상어는 시력이 좋다.","hl":"m"},{"n":38,"text":"여기서부터는 먹이 이야기에서 시력 이야기로 화제가 바뀌어요. 대부분의 상어가 눈이 좋다는 점을 먼저 던져 놓고, 다음 문장에서 밤눈이 좋고 색도 구별한다고 자세히 설명하죠. eyesight가 시력이라는 명사라는 것도 꼭 챙겨 두세요.","hl":"mn"},{"n":39,"text":"첫 번째는 Most sharks예요. most가 한정사로 쓰여서 뒤에 복수 명사가 관사 없이 오면 대부분의라는 뜻이 됩니다. 두 번째는 have good eyesight인데요, have가 목적어를 데려오는 삼 형식 동사로 쓰여서 시력이 좋다라는 관용 표현을 만듭니다. 한국어로는 '시력을 가지다'보다 '시력이 좋다'로 옮기는 게 자연스러워요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 가지고 있다\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">환상적인 야간 시력을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">fantastic \u003c/span>\u003cspan class=\"tgt\">night \u003c/span>\u003cspan class=\"tgt\">vision \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 색상도 구별할 수 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">see \u003c/span>\u003cspan class=\"tgt\">colors\u003c/span>, too.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 환상적인 야간 시력을 가지고 있고 색상도 구별할 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 상어의 눈이 얼마나 뛰어난지 보여 주는 문장이에요. 앞 문장의 \u003cb class=\"key\">좋은 \u003c/b>\u003cb class=\"key\">시력\u003c/b>을 \u003cb class=\"key\">야간 \u003c/b>\u003cb class=\"key\">시력\u003c/b>과 \u003cb class=\"key\">색 \u003c/b>\u003cb class=\"key\">구별\u003c/b>이라는 두 가지 구체적인 예로 풀어 주고 있죠. 즉 상어의 시력이 어둠 속에서도, 색을 보는 데서도 뛰어나다는 점을 강조하는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사구의 병렬 구조 (and)\u003c/span> : [have + 목적어] + and + [can see + 목적어] : \"환상적인 야간 시력을 가지고 있고 색상도 볼 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 can (능력)\u003c/span> : [조동사 can] + [동사원형 see] : \"볼 수 있다, 구별할 수 있다\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"They have, 그들은 가지고 있다. fantastic night vision, 환상적인 야간 시력을. and can see colors, too, 그리고 색상도 구별할 수 있다. 이 문장 전체를 해석하면, 그들은 환상적인 야간 시력을 가지고 있고 색상도 구별할 수 있다.","hl":"m"},{"n":41,"text":"이 문장은 상어의 눈이 얼마나 좋은지 알려 주죠. 밤에도 잘 보는 야간 시력, 거기에 색 구별 능력까지 있다고 말하고 있어요. 앞 문장에서 말한 좋은 시력을 구체적으로 풀어 주는 역할을 한답니다.","hl":"mn"},{"n":42,"text":"첫 번째로 have fantastic night vision and can see colors를 보면 두 동사구가 and로 병렬 연결되어 있어요. 두 번째로 can see의 can은 능력을 나타내는 조동사라서 뒤에 동사원형 see가 온다는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상어의 몸은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">The \u003c/span>\u003cspan class=\"tgt\">bodies \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">sharks\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">위쪽에는 어두운 피부를 가지고 있다\u003c/span>\u003cspan class=\"en\">have \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">dark \u003c/span>\u003cspan class=\"tgt\">skin \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">top \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 아래쪽에는 밝은 피부색을 띤다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">light \u003c/span>\u003cspan class=\"tgt\">skin \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">bottom\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">상어는 몸의 윗부분은 어두운 피부색이고 아랫부분은 밝은 피부색을 띤다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 상어 몸의 위아래 색이 다르다는 사실을 설명하는 문장이에요. 위는 어둡고 아래는 밝은 \u003cb class=\"key\">보호색\u003c/b> 구조를 보여 주죠. 이어지는 문장에서 이 색깔이 왜 유리한지 이유를 제시하므로, 이 문장은 그 근거가 되는 \u003cb class=\"key\">배경 \u003c/b>\u003cb class=\"key\">설명\u003c/b> 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 of를 이용한 소유 표현\u003c/span> : [The bodies] + of + [sharks] : \"상어의 몸\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">대조를 이루는 병렬 구조\u003c/span> : [dark skin on top] + and + [light skin on the bottom] : \"위쪽은 어두운 피부, 아래쪽은 밝은 피부\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"The bodies of sharks, 상어의 몸은. have dark skin on top, 위쪽에는 어두운 피부를 가지고 있다. and light skin on the bottom, 그리고 아래쪽에는 밝은 피부색을 띤다. 이 문장 전체를 해석하면, 상어는 몸의 윗부분은 어두운 피부색이고 아랫부분은 밝은 피부색을 띤다.","hl":"m"},{"n":44,"text":"이 문장은 상어 몸의 위아래 색이 서로 다르다는 걸 알려 줘요. 위는 어둡고 아래는 밝은 보호색 구조를 보여 주는 거죠. 바로 다음 문장에서 이 색깔이 왜 유리한지 이유가 나오니까, 여기는 그 배경 설명이라고 생각하시면 됩니다.","hl":"mn"},{"n":45,"text":"먼저 The bodies of sharks에서 of는 소유를 나타내서 상어의 몸이라는 뜻을 만들어요. 두 번째로 dark skin on top and light skin on the bottom은 어두운색과 밝은색, 위와 아래가 대조를 이루면서 병렬로 연결된 구조예요. 이런 대조 표현은 해석할 때 꼭 짝을 지어 표시해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 상어가 ~하도록 돕는다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">helps \u003c/span>\u003cspan class=\"tgt\">sharks \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">위협으로부터 숨는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">hide \u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">threats\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 상어가 위협으로부터 숨도록 돕는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 설명한 위아래 몸 색깔이 주는 첫 번째 이점을 말하는 문장이에요. 바로 \u003cb class=\"key\">위협\u003c/b>으로부터 몸을 숨기게 해 준다는 것이죠. 이어지는 문장에서 사냥에도 도움이 된다는 두 번째 이점이 나오므로, 이 문장은 \u003cb class=\"key\">보호색\u003c/b>의 효과를 두 갈래로 정리하는 흐름의 출발점이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지시대명사 it\u003c/span> : [It] + 동사 + 목적어 (앞 문장 내용을 받음) : \"그것은 (앞 문장의 몸 색깔)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">준사역동사 help + 목적어 + to부정사\u003c/span> : [help] + [목적어(sharks)] + [to부정사(hide)] : \"상어가 위협으로부터 숨도록 돕는다\"\u003c/div>\u003c/div>","segs":[{"n":46,"text":"It helps sharks, 그것은 상어가 ~하도록 돕는다. to hide from threats, 위협으로부터 숨는 것을. 이 문장 전체를 해석하면, 그것은 상어가 위협으로부터 숨도록 돕는다.","hl":"m"},{"n":47,"text":"이 문장은 앞에서 말한 몸 색깔이 왜 유리한지 알려 줘요. 위협으로부터 몸을 숨기는 데 도움이 된다는 거죠. 그리고 바로 다음 문장에서 사냥에도 도움이 된다는 두 번째 이점이 이어진답니다.","hl":"mn"},{"n":48,"text":"먼저 It은 앞 문장 내용 전체, 그러니까 위는 어둡고 아래는 밝은 피부색을 받는 지시대명사예요. 두 번째로 helps sharks to hide는 help 뒤에 목적어와 to부정사가 오는 준사역동사 구조죠. help는 to를 빼고 동사원형만 써도 된다는 점도 함께 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은\u003c/span>\u003cspan class=\"en\">It\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~하게 만들 수 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">먹이 사냥을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">hunting \u003c/span>\u003cspan class=\"tgt\">prey \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 쉽게, 또한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">easier\u003c/span>, too.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 또한 먹이 사냥을 더 쉽게 만들어 준다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> It은 앞 문장의 몸 색깔을 가리킵니다. 상어 몸의 위아래 색이 \u003cb class=\"key\">위협\u003c/b>을 피하는 데 도움을 줄 뿐 아니라 \u003cb class=\"key\">먹이 \u003c/b>\u003cb class=\"key\">사냥\u003c/b>을 \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">쉽게\u003c/b> 해 준다는 점을 말합니다. 앞 문장의 위장 효과가 사냥에도 이어진다는 흐름을 이어 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 can + 동사원형\u003c/span> : can + [동사원형 make] : \"~하게 만들 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">사역동사 make (목적어 + 형용사 목적격 보어)\u003c/span> : make + [목적어 hunting prey] + [형용사 easier] : \"먹이 사냥을 더 쉽게 만들다\"\u003c/div>\u003c/div>","segs":[{"n":49,"text":"It, 그것은. can make, ~하게 만들 수 있다. hunting prey, 먹이 사냥을. easier, too, 더 쉽게, 또한. 이 문장 전체를 해석하면, 그것은 또한 먹이 사냥을 더 쉽게 만들어 준다.","hl":"m"},{"n":50,"text":"이 문장에서 It은 앞 문장의 몸 색깔을 가리켜요. 그 색이 위협을 피하는 데 도움을 주고, 먹이 사냥을 더 쉽게 해 준다는 뜻이에요. 앞에서 말한 위장 효과가 사냥에도 이어진다는 흐름을 보여 줍니다.","hl":"mn"},{"n":51,"text":"첫 번째로 can은 가능이나 능력을 나타내고 뒤에 동사원형 make가 와요. 두 번째로 make는 사역동사로 목적어 뒤에 형용사 easier를 목적격 보어로 두어 먹이 사냥을 더 쉽게 만든다는 뜻을 만들어요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>상어는 바다의 모든 \u003cb class=\"key\">지역\u003c/b>, 즉 얕은 물에서 깊은 바다까지 서식한다.\u003c/li>\u003cli>대부분의 상어는 이십 년에서 삼십 년을 살지만 일부 \u003cb class=\"key\">종\u003c/b>은 훨씬 오래 살 수 있다.\u003c/li>\u003cli>상어는 크고 날카로운 \u003cb class=\"key\">이빨\u003c/b>로 먹이를 잡아 한 번에 삼키며, 물고기·물개·거북·오징어 등을 먹는다.\u003c/li>\u003cli>상어는 뛰어난 \u003cb class=\"key\">시력\u003c/b>과 \u003cb class=\"key\">야간 \u003c/b>\u003cb class=\"key\">시력\u003c/b>을 갖고, 위아래 피부색이 다른 \u003cb class=\"key\">보호색\u003c/b>으로 위협을 피하고 사냥을 쉽게 한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Sharks have several physical features and senses that help them survive and hunt in the sea.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">상어는 얕은 물에서 깊은 바다까지 넓은 \u003cb class=\"key\">서식지\u003c/b>를 가지며, 종에 따라 \u003cb class=\"key\">수명\u003c/b>이 다르다. 또한 날카로운 \u003cb class=\"key\">이빨\u003c/b>, 뛰어난 \u003cb class=\"key\">시력\u003c/b>, 위아래 색이 다른 \u003cb class=\"key\">피부\u003c/b>를 이용해 먹이를 잡고 위협을 피한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":52,"text":"오늘 글은 상어의 서식지, 수명, 이빨과 식성, 시력, 보호색을 차례로 소개했어요. 이 특징들은 모두 상어가 먹이를 잡고 위협을 피하며 살아가는 데 도움을 줍니다. 특히 이빨과 보호색은 상어의 사냥과 방어를 돕는 핵심 적응 특징이에요. 그럼 오늘 수업은 여기까지입니다.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
