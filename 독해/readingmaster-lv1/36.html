<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터1 Reading 36 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터1 Reading 36","audioDir":"36_audio","preview":false,"count":40,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.668em\">Reading\u003cbr>36\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터1\u003c/div>\u003ch1>Body Language Is More Than a Dictionary\u003c/h1>\u003ch2>몸짓 언어는 사전이 아니다\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>몸짓 언어를 \u003cb class=\"key\">사전\u003c/b>이나 규칙처럼 암기해 해석하면 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">이해\u003c/b>의 많은 측면과 더 큰 그림을 놓치게 된다. 몸짓 언어는 \u003cb class=\"key\">자연스러운 \u003c/b>\u003cb class=\"key\">소통\u003c/b> 속에서 상황과 맥락을 함께 읽어야 하는 복잡한 이해 방식이다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Body language should be understood and used naturally in context, not memorized as a fixed set of signals like a dictionary.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 오늘은 body language, 즉 몸짓 언어에 관한 지문을 함께 읽어 볼게요. 이 글은 몸짓 언어를 dictionary처럼 외우면 안 되고, 자연스러운 소통 속에서 이해해야 한다고 말해요. 핵심은 사전식 접근이 사회적 이해의 많은 측면과 더 큰 그림을 놓친다는 점이에요. 그럼 지문을 따라가며 차근차근 정리해 봅시다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">몸짓 언어(body language)는 말과 함께 표정, 손짓, 자세 등으로 감정과 의도를 전달하는 \u003cb class=\"key\">비언어적 \u003c/b>\u003cb class=\"key\">소통\u003c/b>(nonverbal communication) 수단이에요. 같은 팔짱이나 미소도 상황, 관계, 문화에 따라 전혀 다른 의미를 가질 수 있죠. 그래서 몸짓을 하나의 \u003cb class=\"key\">신호\u003c/b>와 규칙으로만 외우면 상대의 진짜 의도나 전체 맥락을 놓치기 쉬워요. 이는 요리법을 외워서 모든 손님의 입맛을 맞추려는 것과 비슷해요. 실제 소통에서는 \u003cb class=\"key\">맥락\u003c/b>을 읽고 표정과 말투, 상황을 함께 고려하는 유연함이 필요합니다.\u003c/div>","segs":[{"n":2,"text":"몸짓 언어는 말과 함께 표정과 손짓, 자세로 감정과 의도를 전달하는 비언어적 소통 수단이에요. 같은 팔짱이나 미소도 상황과 관계, 문화에 따라 전혀 다른 의미를 가질 수 있죠. 그래서 몸짓을 하나의 신호나 규칙으로만 외우면 상대의 진짜 의도와 전체 맥락을 놓치기 쉬워요. 이건 요리법만 외워서 모든 손님의 입맛을 맞추려는 것과 비슷해요. 실제 소통에서는 맥락을 읽고 표정과 말투, 상황을 함께 고려하는 유연함이 필요합니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>몸짓 언어의 사용\u003csmall>도입 · 문장 1\u003c/small>\u003c/h4>\u003cp>우리는 누군가와 이야기할 때 말만 쓰지 않고 \u003cb class=\"key\">몸짓 \u003c/b>\u003cb class=\"key\">언어\u003c/b>도 함께 사용한다. 이는 감정과 의도를 보완하는 자연스러운 소통 방식이라는 점을 글의 출발점으로 삼는다. 독자는 이제 몸짓 언어를 어떻게 이해해야 하는지 궁금해하게 된다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>사전식 통념\u003csmall>통념 · 문장 2–3\u003c/small>\u003c/h4>\u003cp>몇몇 사람들은 몸짓 언어를 \u003cb class=\"key\">사전\u003c/b>처럼 생각한다. 즉 몸짓 언어를 정해진 \u003cb class=\"key\">규칙\u003c/b>의 한 세트처럼 사용하며, 특정 동작에 특정 의미가 고정되어 있다고 본다. 이런 통념은 몸짓 언어를 단순한 암기 대상으로 만들어 버린다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>한계와 반박\u003csmall>반박 · 문장 4–6\u003c/small>\u003c/h4>\u003cp>이러한 사전적 \u003cb class=\"key\">접근\u003c/b>으로는 사회적 이해의 많은 측면을 찾을 수 없다. 팔짱을 낀 사람을 화났다고 단정하거나 미소 짓는 사람을 행복하다고만 보는 식이다. 더욱이 정해진 \u003cb class=\"key\">신호\u003c/b>만 암기해 소통하면 상황 전체를 보여 주는 \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">큰 \u003c/b>\u003cb class=\"key\">그림\u003c/b>을 놓치게 된다. 그래서 글은 사전식 이해가 충분하지 않다고 반박한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>복잡성과 비유\u003csmall>비유 · 문장 7–8\u003c/small>\u003c/h4>\u003cp>몸짓 언어는 그렇게 단순하지 않고 \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">복잡한\u003c/b> 이해를 요구한다. 글은 몸짓 언어 사전을 읽고 몸짓 언어를 쓰는 일을 프랑스어 사전을 읽고 \u003cb class=\"key\">프랑스어\u003c/b>를 말하는 일에 비유한다. 이 비유는 규칙 암기와 실제 소통 사이의 큰 간극을 선명하게 보여 준다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>자연스러운 사용\u003csmall>결론 · 문장 9\u003c/small>\u003c/h4>\u003cp>결국 몸짓 언어는 \u003cb class=\"key\">자연스럽게\u003c/b> 사용해야 한다. 그렇게 하지 않으면 우리의 몸짓 언어는 로봇 같고 \u003cb class=\"key\">혼란스러운\u003c/b> 인상을 줄 수 있다. 이는 몸짓 언어가 고정된 사전이 아니라 상황 속에서 살아 움직이는 소통임을 강조하는 결론이다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 도입, 통념, 반박, 비유, 결론의 다섯 단계로 나누어 살펴볼게요.","hl":null},{"n":4,"text":"먼저 글은 우리가 이야기할 때 몸짓 언어를 함께 사용한다는 사실에서 출발해요. 몸짓 언어는 말을 보완하며 감정과 의도를 전하는 자연스러운 소통 방식이라는 점을 짚어 주죠. 이 도입을 통해 독자는 몸짓 언어를 어떻게 이해해야 하는지 생각하게 됩니다.","hl":"f0"},{"n":5,"text":"다음으로 몇몇 사람들은 몸짓 언어를 사전처럼 생각한다는 통념이 나와요. 다시 말해 몸짓 언어를 정해진 규칙의 한 세트처럼 여기며, 특정 동작에 특정 의미가 고정되어 있다고 보는 거죠. 이런 통념은 몸짓 언어를 단순한 암기 대상으로 만들어 버립니다.","hl":"f1"},{"n":6,"text":"그런데 사전적 접근으로는 사회적 이해의 많은 측면을 찾을 수 없다고 반박해요. 팔짱을 낀 사람을 화났다고 단정하거나 미소 짓는 사람을 행복하다고만 보는 식이죠. 더욱이 정해진 신호만 암기해 소통하면 더 큰 그림을 놓치게 됩니다. 그래서 사전식 이해만으로는 충분하지 않다는 거예요.","hl":"f2"},{"n":7,"text":"이어서 몸짓 언어는 그렇게 단순하지 않고 더 복잡한 이해를 요구한다고 말해요. 글은 몸짓 언어 사전을 읽고 몸짓 언어를 쓰는 일을 프랑스어 사전을 읽고 프랑스어를 말하는 일에 비유합니다. 이 비유는 규칙을 아는 것과 실제로 유창하게 소통하는 것 사이의 큰 간극을 보여 주죠.","hl":"f3"},{"n":8,"text":"마지막으로 결론에서는 몸짓 언어를 자연스럽게 사용해야 한다고 강조해요. 그렇게 하지 않으면 우리의 몸짓 언어가 로봇 같고 혼란스러운 인상을 줄 수 있기 때문이죠. 결국 몸짓 언어는 고정된 사전이 아니라 상황 속에서 살아 움직이는 소통이라는 점을 기억해야 합니다.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">통념-반박\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 9번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 2~3번에서 몸짓 언어를 사전과 규칙처럼 보는 통념을 제시하고, 4~6번에서 그 한계를 반박한다. 7~8번에서 더 복잡한 이해와 프랑스어 사전 비유로 주장을 강화한 뒤, 9번에서 자연스럽게 사용하지 않으면 로봇 같고 혼란스럽다는 결론을 제시한다. 따라서 핵심 주장이 글 끝에서 마무리되는 \u003cb class=\"key\">미괄식\u003c/b> 구조이며, 중심 내용은 \u003cb class=\"key\">자연스러운 \u003c/b>\u003cb class=\"key\">사용\u003c/b>의 필요성이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>like (2)\u003c/b>\u003cspan>통념 제시·비유\u003c/span>\u003cb>But (6)\u003c/b>\u003cspan>반박·전환\u003c/span>\u003cb>more complicated than that (7)\u003c/b>\u003cspan>주장 강화\u003c/span>\u003cb>is like (8)\u003c/b>\u003cspan>비유\u003c/span>\u003cb>if (9)\u003c/b>\u003cspan>조건·결론\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">a dictionary\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a set of rules\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">certain signals\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the bigger picture\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">naturally\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>사전식 접근\u003c/th>\u003cth>자연스러운 사용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>몸짓을 규칙·신호로 암기\u003c/td>\u003ctd>상황과 맥락 속에서 이해\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사회적 이해의 많은 측면을 놓침\u003c/td>\u003ctd>더 큰 그림을 보고 유연하게 소통\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글의 전개 방식은 통념을 먼저 보여 주고 이를 반박하는 통념 반박 구조예요. 도입 뒤에 사전식 접근이라는 통념이 나오고, 그 한계를 지적한 다음, 프랑스어 사전 비유로 주장을 강화해요. 핵심 주장이 글의 끝에서 마무리되므로 미괄식 구조로 볼 수 있습니다. 그래서 중심 내용은 몸짓 언어의 자연스러운 사용 필요성으로 정리할 수 있어요.","hl":"ty"},{"n":10,"text":"신호어를 보면 두 번째 문장의 like가 몸짓 언어를 사전에 비유하며 통념을 엽니다. 여섯 번째 문장의 But은 그런 사전식 이해를 정면으로 뒤집는 전환이에요. 일곱 번째 문장의 more complicated than that은 문제가 그렇게 단순하지 않음을 강조하고, 여덟 번째 문장의 is like는 프랑스어 사전 비유로 주장을 선명하게 합니다. 마지막의 if는 자연스럽게 사용하지 않을 때 생기는 결과를 조건으로 제시하죠.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>talk\u003c/b>\u003cem>동사\u003c/em>\u003cspan>이야기하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>body language\u003c/b>\u003cem>명사\u003c/em>\u003cspan>몸짓 언어\u003c/span>\u003c/div>\u003cdiv>\u003cb>use\u003c/b>\u003cem>동사\u003c/em>\u003cspan>사용하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>think\u003c/b>\u003cem>동사\u003c/em>\u003cspan>생각하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>like\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~처럼\u003c/span>\u003c/div>\u003cdiv>\u003cb>dictionary\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사전\u003c/span>\u003c/div>\u003cdiv>\u003cb>set\u003c/b>\u003cem>명사\u003c/em>\u003cspan>한 세트, 집합\u003c/span>\u003c/div>\u003cdiv>\u003cb>rule\u003c/b>\u003cem>명사\u003c/em>\u003cspan>규칙\u003c/span>\u003c/div>\u003cdiv>\u003cb>approach\u003c/b>\u003cem>명사\u003c/em>\u003cspan>접근법\u003c/span>\u003c/div>\u003cdiv>\u003cb>social\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>사회적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>understanding\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이해\u003c/span>\u003c/div>\u003cdiv>\u003cb>with one's arms crossed\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>팔짱을 낀 채로\u003c/span>\u003c/div>\u003cdiv>\u003cb>angry\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>화난\u003c/span>\u003c/div>\u003cdiv>\u003cb>smile\u003c/b>\u003cem>동사\u003c/em>\u003cspan>미소 짓다\u003c/span>\u003c/div>\u003cdiv>\u003cb>happy\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>행복한\u003c/span>\u003c/div>\u003cdiv>\u003cb>communicate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>소통하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>memorize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>암기하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>certain\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>특정한\u003c/span>\u003c/div>\u003cdiv>\u003cb>signal\u003c/b>\u003cem>명사\u003c/em>\u003cspan>신호\u003c/span>\u003c/div>\u003cdiv>\u003cb>the bigger picture\u003c/b>\u003cem>명사\u003c/em>\u003cspan>더 큰 그림, 전체 맥락\u003c/span>\u003c/div>\u003cdiv>\u003cb>complicated\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>복잡한\u003c/span>\u003c/div>\u003cdiv>\u003cb>try\u003c/b>\u003cem>동사\u003c/em>\u003cspan>시도하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>read\u003c/b>\u003cem>동사\u003c/em>\u003cspan>읽다\u003c/span>\u003c/div>\u003cdiv>\u003cb>speak\u003c/b>\u003cem>동사\u003c/em>\u003cspan>말하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>French\u003c/b>\u003cem>명사\u003c/em>\u003cspan>프랑스어\u003c/span>\u003c/div>\u003cdiv>\u003cb>be thought of as\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 여겨지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>robotic\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>로봇 같은\u003c/span>\u003c/div>\u003cdiv>\u003cb>confusing\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>혼란스러운\u003c/span>\u003c/div>\u003cdiv>\u003cb>naturally\u003c/b>\u003cem>부사\u003c/em>\u003cspan>자연스럽게\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"핵심 단어로는 approach가 접근법, memorize가 암기하다, signal이 신호라는 뜻이에요. complicated는 복잡한, naturally는 자연스럽게, confusing은 혼란스러운이라는 의미로 꼭 기억해 두세요. 특히 the bigger picture는 더 큰 그림, 즉 전체 맥락을 뜻하는 표현입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">approach\u003c/b>\u003cspan class=\"m\">접근법\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">method\u003c/span>\u003cspan class=\"s\">way\u003c/span>\u003cspan class=\"s\">strategy\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">communicate\u003c/b>\u003cspan class=\"m\">소통하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">convey\u003c/span>\u003cspan class=\"s\">interact\u003c/span>\u003cspan class=\"s\">correspond\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003cspan class=\"a\">withhold\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">memorize\u003c/b>\u003cspan class=\"m\">암기하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">learn by heart\u003c/span>\u003cspan class=\"s\">retain\u003c/span>\u003cspan class=\"s\">commit to memory\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">forget\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">signal\u003c/b>\u003cspan class=\"m\">신호\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">sign\u003c/span>\u003cspan class=\"s\">cue\u003c/span>\u003cspan class=\"s\">indication\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">complicated\u003c/b>\u003cspan class=\"m\">복잡한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">complex\u003c/span>\u003cspan class=\"s\">intricate\u003c/span>\u003cspan class=\"s\">involved\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">simple\u003c/span>\u003cspan class=\"a\">easy\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">naturally\u003c/b>\u003cspan class=\"m\">자연스럽게\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">instinctively\u003c/span>\u003cspan class=\"s\">spontaneously\u003c/span>\u003cspan class=\"s\">effortlessly\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">artificially\u003c/span>\u003cspan class=\"a\">unnaturally\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">confusing\u003c/b>\u003cspan class=\"m\">혼란스러운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">puzzling\u003c/span>\u003cspan class=\"s\">bewildering\u003c/span>\u003cspan class=\"s\">unclear\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">clear\u003c/span>\u003cspan class=\"a\">straightforward\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">understanding\u003c/b>\u003cspan class=\"m\">이해\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">comprehension\u003c/span>\u003cspan class=\"s\">grasp\u003c/span>\u003cspan class=\"s\">insight\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">misunderstanding\u003c/span>\u003cspan class=\"a\">confusion\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어도 함께 정리해 볼게요. approach는 method나 way로 바꿔 쓸 수 있고, communicate는 convey나 interact와 가까워요. memorize는 learn by heart, complicated는 complex, naturally는 instinctively로 연결해 기억하면 좋아요. 반대로 complicated의 반의어는 simple이고, naturally의 반의어는 artificially나 unnaturally입니다. confusing은 puzzling의 뜻이고, 그 반대는 clear라고 정리할 수 있습니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 사람들에게 이야기를 할 때,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">talk \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">people\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 또한 사용한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">also \u003c/span>\u003cspan class=\"tgt\">use\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 몸짓 언어를\u003c/span>\u003cspan class=\"en\">our body language.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리가 사람들에게 이야기를 할 때, 우리는 몸짓 언어도 사용한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 대화할 때 우리가 \u003cb class=\"key\">말\u003c/b>만 쓰는 게 아니라 \u003cb class=\"key\">몸짓 \u003c/b>\u003cb class=\"key\">언어\u003c/b>도 함께 쓴다는 사실을 먼저 알려 주는 도입 문장이에요. 글 전체가 몸짓 언어 이야기로 들어가기 위한 \u003cb class=\"key\">배경\u003c/b>을 깔아 주는 역할을 하죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 when의 시간 부사절\u003c/span> : [[When]] + [주어 + 동사] , [주어 + 동사] : \"우리가 사람들에게 이야기를 할 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부사 also의 위치(일반동사 앞)\u003c/span> : [주어] + [[also]] + [일반동사] : \"우리는 또한 사용한다\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"When we talk to people, 우리가 사람들에게 이야기를 할 때. we also use, 우리는 또한 사용한다. our body language, 우리의 몸짓 언어를. 이 문장 전체를 해석하면, 우리가 사람들에게 이야기를 할 때, 우리는 몸짓 언어도 사용한다.","hl":"m"},{"n":14,"text":"이 문장은 대화할 때 우리가 말만 쓰는 게 아니라 몸짓 언어도 함께 쓴다는 걸 알려 주는 도입 문장이에요. 글 전체가 몸짓 언어 이야기로 들어가기 위한 배경을 깔아 주는 거죠.","hl":"mn"},{"n":15,"text":"어법 포인트는 두 가지예요. 첫 번째, when은 할 때라는 시간을 나타내는 접속사라서 뒤에 주어와 동사가 다 들어 있는 절이 와요. 두 번째, also는 또한이라는 뜻으로 일반동사 앞에 놓여서 동사 전체를 꾸며 준다는 점을 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몇몇 사람들은 생각한다\u003c/span>\u003cspan class=\"en\">Some people \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">think \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몸짓 언어가 ~라고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">body \u003c/span>\u003cspan class=\"tgt\">language \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사전처럼\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">dictionary\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">몇몇 사람들은 몸짓 언어를 사전처럼 생각한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 몸짓 언어를 정해진 뜻을 찾아보는 \u003cb class=\"key\">사전\u003c/b>처럼 여기는 사람들이 있다는 뜻이에요. 이 \u003cb class=\"key\">비유\u003c/b>가 뒤에 나오는 글 전체 논리의 출발점이 됩니다. 사전처럼 본다는 건 신호마다 정답이 있다고 믿는 태도예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">목적어절을 이끄는 접속사 that의 생략\u003c/span> : think + [[(that) + 주어 + 동사]] : \"몸짓 언어가 사전처럼 ~라고 생각한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 like(~처럼, ~같이)\u003c/span> : [[like]] + [명사] : \"사전처럼\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"Some people think, 몇몇 사람들은 생각한다. body language is, 몸짓 언어가 ~라고. like a dictionary, 사전처럼. 이 문장 전체를 해석하면, 몇몇 사람들은 몸짓 언어를 사전처럼 생각한다.","hl":"m"},{"n":17,"text":"몸짓 언어를 마치 사전처럼, 정해진 뜻을 찾아 읽는 대상으로 보는 사람들이 있다는 거예요. 여기서 나온 사전이라는 비유가 글 전체의 핵심 열쇠가 됩니다.","hl":"mn"},{"n":18,"text":"먼저 think 뒤에 that이 생략된 목적어절이 이어져서 라고 생각한다는 뜻을 만듭니다. 그리고 like는 동사가 아니라 처럼이라는 뜻의 전치사라서 뒤에 명사 a dictionary가 옵니다. 사전처럼이라고 해석하는 이유가 바로 이 전치사 like 때문이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 몸짓 언어를 사용한다\u003c/span>\u003cspan class=\"en\">They use body language\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 세트의 규칙처럼\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">set \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">rules\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 몸짓 언어를 한 세트의 규칙처럼 사용한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 몸짓 언어를 \u003cb class=\"key\">사전\u003c/b>에서 찾은 \u003cb class=\"key\">규칙\u003c/b>처럼 딱딱하게 적용한다는 뜻이에요. 앞 문장의 비유를 이어받아, 신호를 외워서 해석하는 \u003cb class=\"key\">태도\u003c/b>를 보여 줍니다. 여기서 '규칙'은 상황과 맥락을 무시한 정답 목록을 말해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 like + 명사구\u003c/span> : [[like]] + [명사구] : \"한 세트의 규칙처럼\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수량 표현 a set of + 복수명사\u003c/span> : [[a set of]] + [복수 명사] : \"한 세트의 규칙들\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"They use body language, 그들은 몸짓 언어를 사용한다. like a set of rules, 한 세트의 규칙처럼. 이 문장 전체를 해석하면, 그들은 몸짓 언어를 한 세트의 규칙처럼 사용한다.","hl":"m"},{"n":20,"text":"앞 문장의 사전 비유를 이어받아, 사람들이 몸짓 언어를 정해진 규칙처럼 다룬다는 뜻이에요. 상황은 보지 않고 신호만 외워서 적용하는 태도를 보여 주는 문장입니다.","hl":"mn"},{"n":21,"text":"like는 처럼이라는 전치사이고 뒤에 a set of rules라는 명사구가 와요. 그리고 a set of는 한 세트의라는 수량 표현이라서 뒤에 복수 명사 rules가 온다는 점을 꼭 기억해 주세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 사전적인 접근으로는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">With \u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">dictionary \u003c/span>\u003cspan class=\"tgt\">approach\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 찾을 수 없다\u003c/span>\u003cspan class=\"en\">they \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">cannot \u003c/span>\u003cspan class=\"tgt\">find\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 측면을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">many \u003c/span>\u003cspan class=\"tgt\">sides \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사회적 이해의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">social \u003c/span>\u003cspan class=\"tgt\">understanding\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이러한 사전적인 접근으로는 사회적 이해의 많은 측면을 찾을 수 없다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사전처럼 신호를 외워 대응하는 방식으로는 사회적 상황을 온전히 이해할 수 없다는 뜻이에요. 앞 문장의 \u003cb class=\"key\">사전 \u003c/b>\u003cb class=\"key\">비유\u003c/b>를 그대로 이어 받아, 그런 \u003cb class=\"key\">접근법\u003c/b>이 가진 한계를 지적하며 글의 문제 제기를 시작하는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 with의 수단 표현\u003c/span> : With + [명사구] + , + 주어 + 동사 (수단·방법의 부사구) : \"이러한 사전적인 접근으로는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부정 조동사 cannot\u003c/span> : [cannot + 동사원형] = ~할 수 없다 : \"찾을 수 없다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 of의 형용사적 수식\u003c/span> : [명사 A] + of + [명사 B] = B의 A : \"사회적 이해의 많은 측면\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"With this dictionary approach, 이러한 사전적인 접근으로는. they cannot find, 그들은 찾을 수 없다. the many sides, 많은 측면을. of social understanding, 사회적 이해의. 이 문장 전체를 해석하면, 이러한 사전적인 접근으로는 사회적 이해의 많은 측면을 찾을 수 없다.","hl":"m"},{"n":23,"text":"이 문장은 사전처럼 신호를 외워서 대응하는 방식의 한계를 말하고 있어요. 사전식 접근으로는 사회적 이해의 많은 측면을 찾을 수 없다는 뜻이죠. 앞에서 말한 사전 비유를 그대로 이어 받아서 문제를 제기하는 부분입니다.","hl":"mn"},{"n":24,"text":"첫 번째, 맨 앞의 With는 수단을 나타내는 전치사예요. 이러한 사전적인 접근으로는이라는 뜻으로 문장 전체를 이끄는 부사구 역할을 하죠. 두 번째, cannot은 강한 부정으로 찾을 수 없다라는 불가능의 의미를 전달해요. 세 번째, the many sides of social understanding에서 of 뒤의 social understanding이 앞의 sides를 수식하면서 무엇의 측면인지 밝혀 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 누군가를 볼 수도 있다\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">might \u003c/span>\u003cspan class=\"tgt\">see\u003c/span> someone\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">팔짱을 낀 채로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">arms \u003c/span>\u003cspan class=\"tgt\">crossed\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 화가 났다고 생각할 수도 있다\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">think \u003c/span>\u003cspan class=\"tgt\">they're \u003c/span>\u003cspan class=\"tgt\">angry\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또는 미소 짓고 있는 누군가를 보고\u003c/span>\u003cspan class=\"en\">or \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">see \u003c/span>\u003cspan class=\"tgt\">someone \u003c/span>\u003cspan class=\"tgt\">smiling\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">행복하다고 생각할 수도 있다\u003c/span>\u003cspan class=\"en\">and think they're happy.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 팔짱을 낀 사람을 보고 화가 났다고 생각하거나, 미소 짓고 있는 사람을 보고 행복하다고 생각할 수도 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사전식 접근이 실제로 어떻게 작동하는지 \u003cb class=\"key\">구체적 \u003c/b>\u003cb class=\"key\">예시\u003c/b>를 든 문장이에요. 팔짱이나 미소 같은 \u003cb class=\"key\">겉모습\u003c/b>만으로 감정을 단정하는 방식은 상황과 맥락을 놓칠 수 있다는 점을 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 might (추측)\u003c/span> : [might + 동사원형] = ~일 수도 있다, ~할 수도 있다 : \"볼 수도 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">with 분사구문 (부대상황)\u003c/span> : with + [목적어] + [과거분사] (목적어와 분사는 수동 관계) : \"팔짱을 낀 채로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">접속사 that의 생략\u003c/span> : think + (that) + [주어 + 동사] : \"화가 났다고 생각하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">지각동사 + 목적어 + 현재분사\u003c/span> : see + [목적어] + [현재분사] (목적어가 ~하고 있는 것을 보다) : \"미소 짓고 있는 누군가를 보다\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"They might see someone, 그들은 누군가를 볼 수도 있다. with their arms crossed, 팔짱을 낀 채로. and think they're angry, 그리고 화가 났다고 생각할 수도 있다. or see someone smiling, 또는 미소 짓고 있는 누군가를 보고. and think they're happy, 행복하다고 생각할 수도 있다. 이 문장 전체를 해석하면, 그들은 팔짱을 낀 사람을 보고 화가 났다고 생각하거나, 미소 짓고 있는 사람을 보고 행복하다고 생각할 수도 있다.","hl":"m"},{"n":26,"text":"사전식 접근이 실제로 어떻게 작동하는지 구체적 예시를 든 문장이에요. 팔짱을 끼면 화난 것, 웃으면 행복한 것이라고 바로 단정한다는 거죠. 겉모습만으로 감정을 판단하는 방식의 위험을 보여 줍니다.","hl":"mn"},{"n":27,"text":"첫 번째, might see에서 might는 추측을 나타내는 조동사라서 뒤에 동사원형이 옵니다. 두 번째, with their arms crossed는 with 뒤에 목적어와 과거분사가 오는 부대상황 표현이에요. 팔이 교차되는 수동 관계라서 과거분사 crossed를 쓴다는 점을 기억하세요. 세 번째, think they're angry는 think 뒤에 접속사 that이 생략된 명사절이 이어진 형태입니다. 네 번째, see someone smiling은 지각동사 see 뒤에 목적어와 현재분사가 온 구조로, 누군가 웃고 있는 진행 상황을 나타냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 사람들이 소통할 때\u003c/span>\u003cspan class=\"en\">But \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">communicate\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단순히 어떤 신호들을 암기하는 것만으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">just \u003c/span>\u003cspan class=\"tgt\">memorizing \u003c/span>\u003cspan class=\"tgt\">certain \u003c/span>\u003cspan class=\"tgt\">signals\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 보지 못한다\u003c/span>\u003cspan class=\"en\">they \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">cannot \u003c/span>\u003cspan class=\"tgt\">see \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 큰 그림을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">bigger \u003c/span>\u003cspan class=\"tgt\">picture\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 사람들이 단순히 어떤 신호들을 암기하는 것만으로 소통한다면 그들은 더 큰 그림을 보지 못할 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 신호를 \u003cb class=\"key\">암기\u003c/b>해서 소통하면 전체 맥락을 놓친다는 \u003cb class=\"key\">한계\u003c/b>를 강조하는 문장이에요. 앞의 예시를 일반적인 이야기로 정리하면서, 뒤에 나오는 프랑스어 사전 비유로 자연스럽게 이어지는 \u003cb class=\"key\">중심 \u003c/b>\u003cb class=\"key\">문장\u003c/b> 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 when의 시간 부사절\u003c/span> : when + [주어 + 동사] , [주어 + 동사] : \"사람들이 소통할 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 by + 동명사 (수단·방법)\u003c/span> : by + [동명사(~ing)] = ~함으로써 : \"단순히 어떤 신호들을 암기하는 것만으로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">관용 표현 see the bigger picture\u003c/span> : [cannot + 동사원형 + the bigger picture] = 전체 맥락을 보지 못하다 : \"더 큰 그림을 보지 못한다\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"But when people communicate, 그러나 사람들이 소통할 때. by just memorizing certain signals, 단순히 어떤 신호들을 암기하는 것만으로. they cannot see, 그들은 보지 못한다. the bigger picture, 더 큰 그림을. 이 문장 전체를 해석하면, 그러나 사람들이 단순히 어떤 신호들을 암기하는 것만으로 소통한다면 그들은 더 큰 그림을 보지 못할 것이다.","hl":"m"},{"n":29,"text":"신호를 암기해서 소통하면 전체 맥락을 놓친다는 한계를 강조하는 문장이에요. 앞에서 든 예시를 일반적인 이야기로 정리하면서, 뒤에 나오는 프랑스어 사전 비유로 이어지는 중심 문장 역할을 합니다.","hl":"mn"},{"n":30,"text":"첫 번째, when people communicate는 시간을 나타내는 부사절이고, 부사절 안에서는 미래의 의미라도 현재시제를 씁니다. 두 번째, by just memorizing certain signals에서 by 뒤에 동명사가 와서 수단을 나타내요. just가 붙어서 단순히 암기하는 것만으로라는 한정의 느낌을 줍니다. 세 번째, cannot see the bigger picture는 전체 맥락을 보지 못한다는 뜻의 관용 표현입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 ~이다\u003c/span>\u003cspan class=\"en\">It's\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 복잡하다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">complicated \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것보다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">that\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 그것보다 더 복잡하기 때문이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 몸짓 언어를 신호만 외워 이해하는 사전식 태도를 지적한 뒤, 그것은 그것보다 더 복잡하다고 말하며 \u003cb class=\"key\">사고의 \u003c/b>\u003cb class=\"key\">전환\u003c/b>을 이끄는 문장이다. \u003cb class=\"key\">that\u003c/b>은 바로 앞에 나온 '사전식 접근'을 가리키고, \u003cb class=\"key\">비교급\u003c/b>을 써서 단순화된 이해를 바로잡아 준다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">비교급 + than (비교 대상)\u003c/span> : [more + 형용사] + than + [비교 대상] : \"그것보다 더 복잡한\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"It's, 그것은 ~이다. more complicated, 더 복잡하다. than that, 그것보다. 이 문장 전체를 해석하면, 그것은 그것보다 더 복잡하기 때문이다.","hl":"m"},{"n":32,"text":"앞에서 몸짓 언어를 신호만 외워서 이해하는 사전식 접근을 이야기했죠. 그래서 이 문장은 그것보다 더 복잡하다고 말하면서 사고의 전환을 만들어 줍니다. 여기서 that은 바로 앞에 나온 사전식 이해를 가리킨다고 보면 됩니다.","hl":"mn"},{"n":33,"text":"이 문장의 핵심은 비교급이에요. more complicated가 비교급이고, than that이 비교 대상이죠. 그래서 그것보다 더 복잡하다는 뜻이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몸짓 언어를 사용하려고 하는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Trying \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">use \u003c/span>\u003cspan class=\"tgt\">body \u003c/span>\u003cspan class=\"tgt\">language\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몸짓 언어 사전을 읽음으로써\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">reading \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">body \u003c/span>\u003cspan class=\"tgt\">language \u003c/span>\u003cspan class=\"tgt\">dictionary\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~와 같다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">프랑스어를 말하려고 하는 것\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">trying \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">speak \u003c/span>\u003cspan class=\"tgt\">French\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">프랑스어 사전을 읽음으로써\u003c/span>\u003cspan class=\"en\">by reading a French dictionary.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">몸짓 언어 사전을 읽어서 몸짓 언어를 사용하려고 하는 것은 프랑스어 사전을 읽어서 프랑스어를 말하려고 하는 것과 같다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> '사전을 읽는 것'과 '실제로 말하는 것'이 다르다는 점을 \u003cb class=\"key\">비유\u003c/b>로 보여 주는 문장이다. 사전식 암기로 몸짓 언어를 쓰려는 태도가 프랑스어 사전만 읽고 프랑스어를 말하려는 것만큼 무리라는 것을 \u003cb class=\"key\">병렬 \u003c/b>\u003cb class=\"key\">구조\u003c/b>로 나란히 놓아 강조한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사구 주어\u003c/span> : [동명사(V-ing)구] + [단수 동사] : \"몸짓 언어를 사용하려고 하는 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 by + 동명사(수단·방법)\u003c/span> : by + [동명사(V-ing)] : \"몸짓 언어 사전을 읽음으로써\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">be like + 동명사구(비유)\u003c/span> : [주어] + is like + [동명사구] : \"프랑스어를 말하려고 하는 것과 같다\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"Trying to use body language, 몸짓 언어를 사용하려고 하는 것은. by reading a body language dictionary, 몸짓 언어 사전을 읽음으로써. is like, ~와 같다. trying to speak French, 프랑스어를 말하려고 하는 것. by reading a French dictionary, 프랑스어 사전을 읽음으로써. 이 문장 전체를 해석하면, 몸짓 언어 사전을 읽어서 몸짓 언어를 사용하려고 하는 것은 프랑스어 사전을 읽어서 프랑스어를 말하려고 하는 것과 같다.","hl":"m"},{"n":35,"text":"사전을 읽는 것과 실제로 말하는 것이 다르다는 점을 비유로 보여 주는 문장이에요. 몸짓 언어 사전만 달달 외워서 몸짓 언어를 쓰려는 태도가, 프랑스어 사전만 읽고 프랑스어를 말하려는 것과 똑같이 무리라는 걸 강조하고 있죠. 앞뒤 구조를 똑같이 맞춰 놓아서 두 상황이 나란히 비교됩니다.","hl":"mn"},{"n":36,"text":"첫 번째로 주어 자리에 동명사구 Trying to use body language가 왔어요. 동명사구가 주어면 단수로 취급하기 때문에 뒤에 is like가 오는 거죠. 두 번째로 by reading처럼 by 뒤에는 동명사가 와서 수단·방법을 나타냅니다. 세 번째로 be like 뒤에도 동명사구가 와서 비유를 완성해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 몸짓 언어는\u003c/span>\u003cspan class=\"en\">Our body language\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">생각될 수 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">might \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">thought \u003c/span>\u003cspan class=\"tgt\">of\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">로봇 같고 혼란스러운 것으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">robotic \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">confusing\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 그것을 자연스럽게 사용하지 않으면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">if \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003cspan class=\"tgt\">use \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">naturally\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리가 몸짓 언어를 자연스럽게 사용하지 않으면 우리의 몸짓 언어는 로봇 같고 혼란스럽다고 생각될 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 몸짓 언어를 부자연스럽게 쓰면 오히려 \u003cb class=\"key\">역효과\u003c/b>가 난다는 점을 \u003cb class=\"key\">수동태\u003c/b>로 조심스럽게 표현한 문장이다. think of A as B가 수동태가 되어 'A는 B라고 생각될 수 있다'가 되었고, if 절이 그 조건을 제시한다. 글의 결론부에서 자연스러운 사용을 강조하는 역할을 한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 + 수동태\u003c/span> : [조동사 might] + [be + 과거분사] : \"생각될 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">think of A as B의 수동태 / as + 형용사\u003c/span> : [A] + be thought of + as + [B] : \"로봇 같고 혼란스러운 것으로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">조건의 부사절 if\u003c/span> : if + [주어 + 동사] + [주절] : \"우리가 그것을 자연스럽게 사용하지 않으면\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"Our body language, 우리의 몸짓 언어는. might be thought of, 생각될 수 있다. as robotic and confusing, 로봇 같고 혼란스러운 것으로. if we don't use it naturally, 우리가 그것을 자연스럽게 사용하지 않으면. 이 문장 전체를 해석하면, 우리가 몸짓 언어를 자연스럽게 사용하지 않으면 우리의 몸짓 언어는 로봇 같고 혼란스럽다고 생각될 수 있다.","hl":"m"},{"n":38,"text":"몸짓 언어를 부자연스럽게 쓰면 오히려 역효과가 날 수 있다는 점을 조심스럽게 말하는 문장이에요. 그래서 might를 써서 단정하지 않고 생각될 수 있다고 표현했죠. 글의 끝에서 자연스러운 사용이 중요하다는 결론을 강조하는 역할을 합니다.","hl":"mn"},{"n":39,"text":"먼저 might be thought of는 조동사 might 뒤에 be와 과거분사가 온 수동태예요. 두 번째로 think of A as B가 수동태가 되면서 as robotic and confusing이 남은 형태이고, robotic과 confusing은 병렬로 연결됩니다. 세 번째로 if we don't use it naturally는 조건을 나타내는 부사절이고, it은 앞에 나온 body language를 받아요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>우리는 말할 때 \u003cb class=\"key\">몸짓 \u003c/b>\u003cb class=\"key\">언어\u003c/b>를 함께 사용한다.\u003c/li>\u003cli>몸짓 언어를 \u003cb class=\"key\">사전\u003c/b>처럼 규칙으로만 대하면 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">이해\u003c/b>의 많은 측면을 놓친다.\u003c/li>\u003cli>정해진 신호를 \u003cb class=\"key\">암기\u003c/b>하는 소통은 \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">큰 \u003c/b>\u003cb class=\"key\">그림\u003c/b>을 보지 못하게 한다.\u003c/li>\u003cli>몸짓 언어는 \u003cb class=\"key\">자연스럽게\u003c/b> 사용해야 하며, 그렇지 않으면 \u003cb class=\"key\">로봇 \u003c/b>\u003cb class=\"key\">같고 \u003c/b>\u003cb class=\"key\">혼란스러운\u003c/b> 인상을 줄 수 있다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Body language should be understood and used naturally in context, not memorized as a fixed set of signals like a dictionary.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">몸짓 언어를 \u003cb class=\"key\">사전\u003c/b>이나 규칙처럼 암기해 해석하면 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">이해\u003c/b>의 많은 측면과 더 큰 그림을 놓치게 된다. 몸짓 언어는 \u003cb class=\"key\">자연스러운 \u003c/b>\u003cb class=\"key\">소통\u003c/b> 속에서 상황과 맥락을 함께 읽어야 하는 복잡한 이해 방식이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":40,"text":"오늘 글의 핵심은 몸짓 언어를 사전처럼 외우는 것이 아니라 자연스럽게 사용하며 맥락을 읽어야 한다는 거예요. 사전식 접근은 사회적 이해의 많은 측면과 더 큰 그림을 놓치게 하죠. 프랑스어 사전 비유를 떠올리면 규칙 암기와 실제 소통의 차이가 분명해질 거예요. 그럼 오늘 수업은 여기까지입니다, 다음 시간에 또 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
