<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터1 Reading 35 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터1 Reading 35","audioDir":"reading35_audio","preview":false,"count":49,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.668em\">Reading\u003cbr>35\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터1\u003c/div>\u003ch1>Why We Think Everything Goes Wrong: Murphy's Law and Selective Memory\u003c/h1>\u003ch2>우리는 왜 모든 것이 잘못된다고 생각할까: 머피의 법칙과 선택적 기억\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>학교에 늦은 날 적색 신호만 만나면 우리는 \u003cb class=\"key\">머피의 \u003c/b>\u003cb class=\"key\">법칙\u003c/b>을 떠올리지만, 과학자들은 우리가 그렇게 부정적으로 생각할 필요가 없다고 말한다. 우리가 실패와 안 좋은 일을 더 많이 기억하는 이유는 \u003cb class=\"key\">선택적 \u003c/b>\u003cb class=\"key\">기억\u003c/b> 때문이며, 강렬한 기억만 뇌에 남아 적색 신호를 더 많이 만났다고 착각하게 된다는 것이다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The real reason we think negatively is selective memory: because only strong memories remain in our brain, we remember failures and bad things far more than positive ones.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분, 오늘 함께 읽을 지문은 리딩마스터 원의 서른다섯 번째 지문이에요. 학교에 늦었는데 만나는 신호등이 전부 빨간불이라면 어떤 기분이 들까요? 이 지문은 바로 그런 순간 우리가 떠올리는 머피의 법칙과, 그것이 왜 착각인지 설명하고 있어요. 핵심은 우리의 부정적인 생각이 선택적 기억에서 비롯된다는 점이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">우리는 흔히 &quot;잘못될 수 있는 모든 것은 잘못될 것이다&quot;라는 말을 하며, 이것을 머피의 법칙(Murphy's Law)이라고 부릅니다. 그런데 심리학에서는 이런 부정적인 느낌이 실제 사건의 빈도보다 \u003cb class=\"key\">선택적 \u003c/b>\u003cb class=\"key\">기억\u003c/b>(selective memory)에서 비롯된다고 설명합니다. 우리의 뇌는 감정적으로 강하게 자극된 사건, 특히 두려움이나 실망을 준 사건을 더 오래 보관하는 습관이 있기 때문입니다. 이때 감정을 담당하는 편도체(amygdala)가 강한 감정을 겪은 기억을 더 또렷하게 붙잡아 두는 역할을 합니다. 시험 전날 밤에 외운 것보다 시험에서 틀린 문제 하나가 몇 달씩 남는 것도 같은 원리이고, 칭찬 열 번보다 지적 한 번이 오래 기억나는 것도 같은 이유입니다. 그래서 과학자들은 우리가 \u003cb class=\"key\">적색 \u003c/b>\u003cb class=\"key\">신호\u003c/b>를 유난히 많이 만난 것처럼 느끼는 것은 사건 자체가 아니라 기억의 방식 때문이라고 말합니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 조금만 얘기해 볼게요. 우리는 흔히 잘못될 수 있는 모든 것은 잘못될 것이라고 말하면서, 그것을 Murphy's Law라고 부르죠. 그런데 심리학에서는 이런 느낌이 실제 사건의 빈도보다 selective memory, 즉 선택적 기억에서 비롯된다고 설명해요. 우리 뇌는 감정적으로 강하게 자극된 사건, 특히 두려움이나 실망을 준 사건을 더 오래 보관하는 습관이 있거든요. 이때 감정을 담당하는 amygdala가 강한 감정을 겪은 기억을 더 또렷하게 붙잡아 두는 역할을 해요. 시험 전날 밤에 외운 것보다 시험에서 틀린 문제 하나가 몇 달씩 남는 것도, 칭찬 열 번보다 지적 한 번이 오래 기억나는 것도 같은 원리예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>늦은 등교와 적색 신호\u003csmall>도입 · 문장 1–4\u003c/small>\u003c/h4>\u003cp>학교에 늦었다고 상상해 보라는 장면으로 글을 열어요. 그런데 만나는 모든 신호등이 \u003cb class=\"key\">적색 \u003c/b>\u003cb class=\"key\">신호\u003c/b>라면, 우리는 잘못될 수 있는 모든 것은 잘못될 것이라고 생각하게 되죠. 이렇게 하나의 통념으로서 \u003cb class=\"key\">머피의 \u003c/b>\u003cb class=\"key\">법칙\u003c/b>을 먼저 소개하는 도입부입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>부정은 필요 없다\u003csmall>전환 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>그런데 However와 함께 글의 분위기가 바뀝니다. 몇몇 과학자들은 우리가 그렇게 \u003cb class=\"key\">부정적으로\u003c/b> 생각할 필요가 없다고 말해요. 그들이 제시하는 이유는 바로 \u003cb class=\"key\">선택적 \u003c/b>\u003cb class=\"key\">기억\u003c/b>이며, 이것이 이 글의 주제가 됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>남는 것은 강렬한 기억\u003csmall>근거 · 문장 7–8\u003c/small>\u003c/h4>\u003cp>과학자들의 설명은 뇌의 작동 방식으로 이어집니다. 우리의 뇌는 우리가 한 모든 것을 기억하지는 못하고, 오직 \u003cb class=\"key\">강렬한 \u003c/b>\u003cb class=\"key\">기억\u003c/b>들만이 뇌에 남는다고 해요. 그래서 긍정적인 것들보다 \u003cb class=\"key\">실패\u003c/b>나 안 좋은 일을 훨씬 많이 기억하게 된다는 근거를 제시합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>녹색과 적색의 차이\u003csmall>예시 · 문장 9–11\u003c/small>\u003c/h4>\u003cp>이제 이해를 돕는 예시가 등장합니다. 녹색 신호일 때 길을 쉽게 건너는 것에는 뇌가 \u003cb class=\"key\">초점\u003c/b>을 맞추지 않지만, 적색 신호에서는 멈춰서 몇 분 동안 기다려야 하죠. 이 \u003cb class=\"key\">작은 \u003c/b>\u003cb class=\"key\">차이\u003c/b>가 적색 신호를 더 많이 만났다고 생각하게 만든다는 것을 보여 줍니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>반복되면 실패만 보인다\u003csmall>결론 · 문장 12\u003c/small>\u003c/h4>\u003cp>마지막 문장은 결론입니다. 이런 생각이 자주 \u003cb class=\"key\">반복\u003c/b>되면 우리는 대부분 안 좋은 것들만 기억하게 되고, 결국 \u003cb class=\"key\">항상 \u003c/b>\u003cb class=\"key\">실패\u003c/b>한다고 생각하게 된다고 정리해요. 선택적 기억이 부정적인 결론을 굳힌다는 뜻입니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 단계별로 따라가 볼게요.","hl":null},{"n":4,"text":"첫 단계는 도입이에요. 학교에 늦었다고 상상해 보라는 장면으로 글이 시작되죠. 그런데 만나는 모든 신호등이 적색 신호라면, 우리는 잘못될 수 있는 모든 것은 잘못될 것이라고 생각하게 돼요. 이렇게 통념으로서의 머피의 법칙을 먼저 소개합니다.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 분위기가 바뀌어요. However가 나오면서 몇몇 과학자들은 우리가 그렇게 부정적으로 생각할 필요가 없다고 말하죠. 그들이 제시하는 이유는 바로 선택적 기억이고, 이것이 이 글의 주제가 돼요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 그 근거예요. 우리의 뇌는 우리가 한 모든 것을 기억하지는 못하고, 오직 강렬한 기억들만이 뇌에 남는다고 해요. 그래서 우리는 긍정적인 것들보다 실패나 안 좋은 일을 훨씬 많이 기억하게 되죠.","hl":"f2"},{"n":7,"text":"네 번째 단계는 예시예요. 녹색 신호일 때 길을 쉽게 건너는 것에는 뇌가 초점을 맞추지 않지만, 적색 신호에서는 멈춰서 몇 분 동안 기다려야 하죠. 이 작은 차이가 녹색 신호보다 적색 신호를 더 많이 만났다고 생각하게 만든다는 거예요.","hl":"f3"},{"n":8,"text":"마지막 단계는 결론이에요. 이런 생각이 자주 반복되면 우리는 대부분 안 좋은 것들만 기억하게 되고, 결국 항상 실패한다고 생각하게 된다고 정리합니다. 선택적 기억이 부정적인 결론을 굳힌다는 뜻이에요.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">통념-반박\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 6번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 먼저 머피의 법칙이라는 \u003cb class=\"key\">통념\u003c/b>을 예시 상황과 함께 보여 줍니다. 이어서 However를 신호로 과학자들의 반박이 나오고, \u003cb class=\"key\">선택적 \u003c/b>\u003cb class=\"key\">기억\u003c/b>이라는 개념이 주제로 제시되죠. 이후 뇌의 특성이라는 \u003cb class=\"key\">근거\u003c/b>와 신호등 예시가 뒤따르고, 마지막 문장에서 결론을 정리합니다. 이렇게 앞부분에서 주장을 먼저 던지고 뒤에서 근거와 예시로 받쳐 주므로 \u003cb class=\"key\">두괄식\u003c/b> 전개로 볼 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>But (2)\u003c/b>\u003cspan>상황 전환\u003c/span>\u003cb>However (5)\u003c/b>\u003cspan>통념 반박\u003c/span>\u003cb>so (8)\u003c/b>\u003cspan>인과 관계\u003c/span>\u003cb>For example (9)\u003c/b>\u003cspan>예시 제시\u003c/span>\u003cb>If (12)\u003c/b>\u003cspan>조건 제시와 결론 도출\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">the way we think\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">selective memory\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">strong memories remain in the brain\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">remember a failure or bad things much more than positive things\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">meet more red lights than green lights\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">always fail\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>녹색 신호\u003c/th>\u003cth>적색 신호\u003c/th>\u003c/tr>\u003ctr>\u003ctd>쉽게 건너가서 초점을 맞추지 않음\u003c/td>\u003ctd>멈추고 몇 분을 기다려야 함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>기억에 잘 남지 않아 적게 만난 것처럼 느낌\u003c/td>\u003ctd>강하게 남아 더 많이 만난 것처럼 느낌\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글은 통념을 먼저 제시하고 과학자들의 말로 반박하는 통념과 반박의 구조예요. 도입에서 머피의 법칙이라는 통념을 보여 준 뒤, However가 나오는 문장에서 과학자들의 주장이 등장하죠. 주제문은 선택적 기억을 언급한 문장인데, 앞부분에서 주장을 먼저 던지고 뒤에서 근거와 예시로 받쳐 주는 두괄식 흐름으로 읽으면 아주 편해요.","hl":"ty"},{"n":10,"text":"먼저 But과 However라는 신호어를 짚어 볼게요. However는 앞에서 말한 통념을 뒤집는 가장 중요한 신호이고, For example은 근거를 예시로 바꿔 주는 신호예요. 또한 so는 원인과 결과를 이어 주고, If는 조건이 반복될 때 어떤 결론에 도달하는지 보여 줍니다. 그리고 remember, memories, strong memories처럼 기억을 가리키는 표현들이 선택적 기억이라는 개념을 계속 바꿔 말하며 반복되고 있다는 점도 눈여겨보세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>imagine\u003c/b>\u003cem>동사\u003c/em>\u003cspan>상상하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>be late for\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 늦다\u003c/span>\u003c/div>\u003cdiv>\u003cb>traffic light\u003c/b>\u003cem>명사\u003c/em>\u003cspan>신호등\u003c/span>\u003c/div>\u003cdiv>\u003cb>meet\u003c/b>\u003cem>동사\u003c/em>\u003cspan>만나다, 마주치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>go wrong\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>잘못되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>be called\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~라고 불리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>law\u003c/b>\u003cem>명사\u003c/em>\u003cspan>법칙\u003c/span>\u003c/div>\u003cdiv>\u003cb>however\u003c/b>\u003cem>부사\u003c/em>\u003cspan>그러나\u003c/span>\u003c/div>\u003cdiv>\u003cb>scientist\u003c/b>\u003cem>명사\u003c/em>\u003cspan>과학자\u003c/span>\u003c/div>\u003cdiv>\u003cb>negatively\u003c/b>\u003cem>부사\u003c/em>\u003cspan>부정적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>reason\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이유\u003c/span>\u003c/div>\u003cdiv>\u003cb>the way we think\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>우리가 생각하는 방식\u003c/span>\u003c/div>\u003cdiv>\u003cb>selective\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>선택적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>memory\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기억\u003c/span>\u003c/div>\u003cdiv>\u003cb>remember\u003c/b>\u003cem>동사\u003c/em>\u003cspan>기억하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>strong\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>강렬한\u003c/span>\u003c/div>\u003cdiv>\u003cb>remain\u003c/b>\u003cem>동사\u003c/em>\u003cspan>남아 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>failure\u003c/b>\u003cem>명사\u003c/em>\u003cspan>실패\u003c/span>\u003c/div>\u003cdiv>\u003cb>much more than\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~보다 훨씬 더\u003c/span>\u003c/div>\u003cdiv>\u003cb>positive\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>긍정적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>for example\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>예를 들어\u003c/span>\u003c/div>\u003cdiv>\u003cb>focus on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 초점을 맞추다\u003c/span>\u003c/div>\u003cdiv>\u003cb>cross the street\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>길을 건너다\u003c/span>\u003c/div>\u003cdiv>\u003cb>green light\u003c/b>\u003cem>명사\u003c/em>\u003cspan>녹색 신호\u003c/span>\u003c/div>\u003cdiv>\u003cb>stop\u003c/b>\u003cem>동사\u003c/em>\u003cspan>멈추다\u003c/span>\u003c/div>\u003cdiv>\u003cb>wait for\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 기다리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>difference\u003c/b>\u003cem>명사\u003c/em>\u003cspan>차이\u003c/span>\u003c/div>\u003cdiv>\u003cb>more A than B\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>B보다 A를 더 많이\u003c/span>\u003c/div>\u003cdiv>\u003cb>repeat\u003c/b>\u003cem>동사\u003c/em>\u003cspan>반복하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>finally\u003c/b>\u003cem>부사\u003c/em>\u003cspan>결론적으로, 마침내\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"핵심 단어 몇 개만 짚어 볼게요. selective는 선택적인, remain은 남아 있다, failure는 실패라는 뜻이에요. go wrong은 잘못되다, focus on은 초점을 맞추다라는 숙어이니 꼭 챙겨 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">negatively\u003c/b>\u003cspan class=\"m\">부정적으로\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">pessimistically\u003c/span>\u003cspan class=\"s\">unfavorably\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">positively\u003c/span>\u003cspan class=\"a\">optimistically\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">remain\u003c/b>\u003cspan class=\"m\">남아 있다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">stay\u003c/span>\u003cspan class=\"s\">persist\u003c/span>\u003cspan class=\"s\">last\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">disappear\u003c/span>\u003cspan class=\"a\">vanish\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">failure\u003c/b>\u003cspan class=\"m\">실패\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">defeat\u003c/span>\u003cspan class=\"s\">loss\u003c/span>\u003cspan class=\"s\">flop\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">success\u003c/span>\u003cspan class=\"a\">achievement\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">positive\u003c/b>\u003cspan class=\"m\">긍정적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">optimistic\u003c/span>\u003cspan class=\"s\">favorable\u003c/span>\u003cspan class=\"s\">bright\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">negative\u003c/span>\u003cspan class=\"a\">pessimistic\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">difference\u003c/b>\u003cspan class=\"m\">차이\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">distinction\u003c/span>\u003cspan class=\"s\">gap\u003c/span>\u003cspan class=\"s\">contrast\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">similarity\u003c/span>\u003cspan class=\"a\">sameness\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">repeat\u003c/b>\u003cspan class=\"m\">반복하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">reiterate\u003c/span>\u003cspan class=\"s\">redo\u003c/span>\u003cspan class=\"s\">recur\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">selective\u003c/b>\u003cspan class=\"m\">선택적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">discretionary\u003c/span>\u003cspan class=\"s\">restricted\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">indiscriminate\u003c/span>\u003cspan class=\"a\">random\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어도 정리해 볼게요. negatively는 부정적으로라는 뜻이고, positively와 optimistically가 반대말이에요. remain은 stay, persist와 비슷하고 disappear와는 반대이고, failure는 success의 반대말이죠. positive는 optimistic, negative는 pessimistic과 함께 묶어서 외워 두면 좋아요. difference는 distinction, gap과 비슷하고 similarity와는 반대이고, selective는 discretionary와 비슷하지만 indiscriminate와는 반대라는 점도 기억해 주세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상상해 보라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Imagine\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 학교에 늦었다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">late \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">school\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">학교에 늦었다고 상상해 보라.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 독자를 구체적인 상황 속으로 끌어들이는 \u003cb class=\"key\">도입\u003c/b> 문장입니다. 명령문 \u003cb class=\"key\">Imagine\u003c/b>으로 시작해 독자가 자기 경험을 떠올리게 만듭니다. 뒤에 오는 신호등 이야기의 \u003cb class=\"key\">배경\u003c/b>을 만들어 주는 역할이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문(동사원형으로 시작하는 문장)\u003c/span> : [동사원형 Imagine] + [목적어절 that ...] : \"상상해 보라\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 명사절(목적어)\u003c/span> : Imagine + [that + 주어 + 동사 ~ (명사절/목적어)] : \"당신이 학교에 늦었다고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">관용표현(be late for + 명사)\u003c/span> : be late for + [행사·장소 명사] : \"~에 늦다\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"Imagine, 상상해 보라. that you are late for school, 당신이 학교에 늦었다고. 이 문장 전체를 해석하면, 학교에 늦었다고 상상해 보라.","hl":"m"},{"n":14,"text":"독자를 이야기 속으로 끌어들이는 도입 문장이에요. 여러분이 학교에 늦었다고 머릿속으로 그려 보라는 뜻이죠. 이 상황 설정이 뒤에 나오는 신호등 이야기의 배경이 됩니다.","hl":"mn"},{"n":15,"text":"첫 번째, 주어 없이 동사원형 Imagine으로 시작했으니 명령문이에요. 두 번째, that절은 imagine의 목적어 역할을 하는 명사절입니다. 세 번째, be late for는 '~에 늦다'라는 관용표현이라서 for를 꼭 붙여 써야 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">But\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분이 만나는 모든 신호등이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">all \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">traffic \u003c/span>\u003cspan class=\"tgt\">lights \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분이 만나는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">meet\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">적색이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">red\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 여러분이 만나는 모든 신호등이 적색이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 상황에 \u003cb class=\"key\">역접\u003c/b>의 But을 붙여, 늦었는데 신호등까지 모두 빨간불인 \u003cb class=\"key\">최악의 \u003c/b>\u003cb class=\"key\">상황\u003c/b>을 제시합니다. 목적격 관계대명사가 생략된 \u003cb class=\"key\">you \u003c/b>\u003cb class=\"key\">meet\u003c/b>이 앞의 신호등을 꾸며, '여러분이 마주치는 모든 신호등'이라는 뜻을 만듭니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">등위접속사(역접)\u003c/span> : [문장] + But + [문장] : \"그러나\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 생략\u003c/span> : [선행사 all the traffic lights] + [(which/that) + 주어 you + 동사 meet] : \"여러분이 만나는 모든 신호등\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">주어와 동사의 수 일치 / 주격 보어\u003c/span> : [주어 all the traffic lights(복수)] + [동사 are] + [보어 red] : \"적색이다\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"But, 그러나. all the traffic lights, 여러분이 만나는 모든 신호등이. you meet, 여러분이 만나는. are red, 적색이다. 이 문장 전체를 해석하면, 그러나 여러분이 만나는 모든 신호등이 적색이다.","hl":"m"},{"n":17,"text":"앞에서 늦었다고 했는데 신호등까지 전부 빨간불이면 정말 속이 터지죠. 역접의 But으로 최악의 상황을 강조하고 있어요. '여러분이 만나는 모든 신호등'이라는 표현으로 답답함을 극대화합니다.","hl":"mn"},{"n":18,"text":"첫 번째, But은 앞뒤 문장을 대등하게 잇는 등위접속사로 역접의 흐름을 만듭니다. 두 번째, all the traffic lights you meet에서 meet의 목적어가 비어 있으니 목적격 관계대명사가 생략된 거예요. 세 번째, 주어가 복수라서 be동사는 are, 그리고 red는 주격 보어로 쓰였습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 생각할지도 모른다\u003c/span>\u003cspan class=\"en\">You \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">may \u003c/span>\u003cspan class=\"tgt\">think\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“잘못될 수 있는 모든 것은\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">Anything \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">잘못될 수 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">go \u003c/span>\u003cspan class=\"tgt\">wrong\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">잘못될 것이다”라고\u003c/span>\u003cspan class=\"en\">will go wrong.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">당신은 “잘못될 수 있는 모든 것은 잘못될 것이다”라고 생각할지도 모른다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞의 답답한 상황에서 사람들이 흔히 품는 \u003cb class=\"key\">부정적 \u003c/b>\u003cb class=\"key\">생각\u003c/b>을 인용문으로 제시합니다. 주격 관계대명사 that절이 Anything을 꾸며 '잘못될 가능성이 있는 것은 무엇이든'이라는 \u003cb class=\"key\">한정\u003c/b>의 의미를 만듭니다. 이 문장은 뒤에 나올 \u003cb class=\"key\">머피의 \u003c/b>\u003cb class=\"key\">법칙\u003c/b>을 예고하는 역할도 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 may(추측)\u003c/span> : [주어 You] + [조동사 may] + [동사원형 think] : \"생각할지도 모른다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : [선행사 Anything] + [주격 관계대명사 that] + [동사 can go] : \"잘못될 수 있는 모든 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">조동사 can + 동사원형 / 관용표현(go wrong)\u003c/span> : [조동사 can] + [동사원형 go] + [보어 wrong] : \"잘못될 수 있는\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"You may think, 당신은 생각할지도 모른다. \"Anything, “잘못될 수 있는 모든 것은. that can go wrong, 잘못될 수 있는. will go wrong.\", 잘못될 것이다”라고. 이 문장 전체를 해석하면, 당신은 “잘못될 수 있는 모든 것은 잘못될 것이다”라고 생각할지도 모른다.","hl":"m"},{"n":20,"text":"빨간불이 계속 이어지면 누구라도 부정적인 생각이 들죠. 그래서 '잘못될 수 있는 일은 결국 잘못된다'는 말을 인용하고 있어요. 이 말이 바로 다음에 나올 머피의 법칙을 예고합니다.","hl":"mn"},{"n":21,"text":"첫 번째, may는 추측의 조동사라서 뒤에 동사원형 think가 왔습니다. 두 번째, Anything that can go wrong에서 that은 선행사 Anything을 받는 주격 관계대명사예요. 세 번째, can go wrong은 가능성의 조동사 can 뒤에 동사원형 go가 오고 wrong이 보어로 붙은 숙어 표현입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이런 생각은\u003c/span>\u003cspan class=\"en\">This idea\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">불린다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">called\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">머피의 법칙이라고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">Murphy's \u003c/span>\u003cspan class=\"tgt\">Law\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이런 생각을 머피의 법칙이라고 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 나온 &quot;잘못될 수 있는 일은 반드시 잘못된다&quot;는 생각에 \u003cb class=\"key\">이름\u003c/b>을 붙여 주는 문장이에요. 이렇게 핵심 개념에 이름을 붙이면 글 전체에서 그 \u003cb class=\"key\">용어\u003c/b>를 계속 편하게 다시 쓸 수 있어요. is called는 '불리다'라는 \u003cb class=\"key\">수동태\u003c/b>로, 용어의 정의를 자연스럽게 이어 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태 (be동사 + 과거분사)\u003c/span> : [주어] + be동사 + [과거분사] (+ by 행위자) : \"불린다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">고유명사의 소유격 's\u003c/span> : [사람 이름] + 's + [명사] : \"머피의 법칙\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"This idea, 이런 생각은. is called, 불린다. Murphy's Law, 머피의 법칙이라고. 이 문장 전체를 해석하면, 이런 생각을 머피의 법칙이라고 한다.","hl":"m"},{"n":23,"text":"이 문장은 앞에서 나온 부정적인 생각에 이름을 붙여 주는 역할을 해요. 그 이름이 바로 머피의 법칙이죠. 이렇게 이름을 붙여 두면 다음 내용에서 그 용어를 계속 편하게 다시 쓸 수 있어요.","hl":"mn"},{"n":24,"text":"첫 번째, is called는 수동태예요. 주어인 this idea가 부르는 사람이 아니라 불리는 대상이기 때문에 be동사와 과거분사가 결합한 be+p.p. 형태가 된 거죠. 두 번째, Murphy's Law에서 's는 소유격으로 '머피의'라는 뜻을 만들어요. 그래서 이런 생각은 머피의 법칙이라고 불린다고 해석하면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">However\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몇몇 과학자들은 말한다\u003c/span>\u003cspan class=\"en\">some scientists say\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 ~할 필요는 없다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그렇게 부정적으로 생각할\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">think \u003c/span>\u003cspan class=\"tgt\">so \u003c/span>\u003cspan class=\"tgt\">negatively\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 몇몇 과학자들은 우리가 그렇게 부정적으로 생각할 필요가 없다고 말한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 부정적 생각을 However로 받아 \u003cb class=\"key\">화제 \u003c/b>\u003cb class=\"key\">전환\u003c/b>을 하며, 과학자들의 반대 견해를 내놓는 문장이에요. say 뒤의 that절이 '무엇을 말하는지'를 \u003cb class=\"key\">목적어\u003c/b>로 채워 주고, don't have to로 '그럴 \u003cb class=\"key\">필요\u003c/b>는 없다'고 부드럽게 반박합니다. 즉 이 문장은 글의 분위기를 부정에서 긍정 쪽으로 \u003cb class=\"key\">전환\u003c/b>시키는 신호예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속부사 However (전환어)\u003c/span> : However, + [완전한 절] : \"그러나\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 명사절 (타동사 say의 목적어)\u003c/span> : say + [that + 주어 + 동사 ~ (완전한 절)] : \"우리가 그렇게 부정적으로 생각할 필요가 없다고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">조동사 have to의 부정 (불필요)\u003c/span> : don't have to + [동사원형] : \"생각할 필요가 없다\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"However, 그러나. some scientists say, 몇몇 과학자들은 말한다. that we don't have to, 우리가 ~할 필요는 없다고. think so negatively, 그렇게 부정적으로 생각할. 이 문장 전체를 해석하면, 그러나 몇몇 과학자들은 우리가 그렇게 부정적으로 생각할 필요가 없다고 말한다.","hl":"m"},{"n":26,"text":"이 문장은 앞에서 나온 부정적인 생각을 However로 한 번 끊고, 과학자들의 다른 주장을 꺼내는 역할을 해요. 우리가 그렇게 부정적으로 생각할 필요는 없다고 말하는 거죠. 글의 분위기를 바꿔 주는 아주 중요한 전환점이에요.","hl":"mn"},{"n":27,"text":"첫 번째, However는 문장 맨 앞에서 쉼표와 함께 쓰는 접속부사로 앞 내용에서 다른 방향으로 전환한다는 신호예요. 두 번째, say 뒤에 that절이 와서 무엇을 말하는지 목적어 역할을 하고 있어요. 절 안을 보면 주어 we와 동사 don't have to think가 다 있으니 접속사 that이 맞습니다. 세 번째, don't have to는 '~할 필요가 없다'는 불필요의 뜻이에요. '~하면 안 된다'는 must not과 꼭 구별해서 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 말한다\u003c/span>\u003cspan class=\"en\">They say\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 이유는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">reason \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 생각하는 방식에 대한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">way \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">think \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">선택적 기억이라고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">selective \u003c/span>\u003cspan class=\"tgt\">memory\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 우리가 생각하는 방식의 이유를 선택적 기억이라고 말한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 과학자들이 내놓는 원인을 \u003cb class=\"key\">선택적 \u003c/b>\u003cb class=\"key\">기억\u003c/b>이라는 용어로 정리한 문장이에요. the reason for the way we think가 길게 \u003cb class=\"key\">주어\u003c/b> 역할을 하므로 동사 is를 찾아 '이유는 ~이다'로 묶는 것이 핵심입니다. 여기서 the way we think는 '우리가 생각하는 방식'이라는 \u003cb class=\"key\">관계부사\u003c/b> 생략 표현이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 명사절 (타동사 say의 목적어)\u003c/span> : say + [that + 주어 + 동사 ~ (완전한 절)] : \"우리가 생각하는 방식의 이유는 선택적 기억이라고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">the way 뒤 관계부사 in which의 생략\u003c/span> : the way + [주어 + 동사] (= the way in which + 주어 + 동사) : \"우리가 생각하는 방식\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"They say, 그들은 말한다. that the reason, 그 이유는. for the way we think, 우리가 생각하는 방식에 대한. is selective memory, 선택적 기억이라고. 이 문장 전체를 해석하면, 그들은 우리가 생각하는 방식의 이유를 선택적 기억이라고 말한다.","hl":"m"},{"n":29,"text":"이 문장은 과학자들이 말하는 원인을 선택적 기억이라는 용어로 딱 정리해 주는 문장이에요. 우리가 생각하는 방식에 대한 이유가 선택적 기억이라는 거죠. 그래서 이 문장이 뒷부분 전체의 주제를 미리 알려 주는 열쇠가 됩니다.","hl":"mn"},{"n":30,"text":"첫 번째, say 뒤에 that절이 와서 말하는 내용을 목적어로 채우고 있어요. 절 안의 주어가 the reason for the way we think, 동사가 is라서 절이 완전하니 접속사 that이 맞습니다. 두 번째, the way we think는 원래 the way in which we think에서 관계부사 in which가 생략된 형태예요. the way 뒤에는 주어와 동사가 바로 이어진다고 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 뇌는\u003c/span>\u003cspan class=\"en\">Our brains\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기억하지 못한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">cannot \u003c/span>\u003cspan class=\"tgt\">remember \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">all \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">things \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">did\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리의 뇌는 우리가 한 모든 것을 기억하지는 못한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 우리 뇌의 \u003cb class=\"key\">기억 \u003c/b>\u003cb class=\"key\">용량\u003c/b>에는 한계가 있다는 뜻이에요. 앞에서 나온 \u003cb class=\"key\">선택적 \u003c/b>\u003cb class=\"key\">기억\u003c/b>이 왜 생기는지 그 출발점을 알려 주는 문장이죠. 'all the things we did'는 '우리가 한 모든 일'이라는 뜻으로, 뇌가 모든 경험을 저장하지는 않는다는 점을 강조해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부분부정 (not + all)\u003c/span> : cannot + [all + 명사] = '모두 ~인 것은 아니다' : \"모든 것을 기억하지는 못한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사의 생략\u003c/span> : the things + [(which/that) + 주어 + 동사] (목적격 관계대명사 생략) : \"우리가 한 것들\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"Our brains, 우리의 뇌는. cannot remember, 기억하지 못한다. all the things, 모든 것을. we did, 우리가 한. 이 문장 전체를 해석하면, 우리의 뇌는 우리가 한 모든 것을 기억하지는 못한다.","hl":"m"},{"n":32,"text":"이 문장은 우리 뇌의 기억이 완벽하지 않다는 걸 말해 줘요. 앞에서 나온 선택적 기억이 왜 생기는지 그 출발점을 설명하는 거죠. 모든 경험을 다 저장하지 못하니까 강한 것만 남는다는 흐름으로 이어져요.","hl":"mn"},{"n":33,"text":"첫 번째로 all the things we did에서 목적격 관계대명사가 생략된 걸 봐요. the things와 we did 사이에 원래 which나 that이 있어야 하는데 목적격일 때는 생략이 가능하죠. 두 번째로 cannot remember all the things는 부분부정이에요. 부정어와 all이 만나면 모두 기억하지는 못한다는 뜻이 되니까, 아무것도 기억 못 한다고 해석하면 안 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오직 강렬한 기억들만이\u003c/span>\u003cspan class=\"en\">Only strong memories\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">뇌에 남아서\u003c/span>\u003cspan class=\"en\">remain in the brain,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan cla \">red \u003c/span>\u003cspan class=\"tgt\">light\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 멈춰야 한다\u003c/span>\u003cspan class=\"en\">we \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">should \u003c/span>\u003cspan class=\"tgt\">stop\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 몇 분 동안 기다려야 한다\u003c/span>\u003cspan class=\"en\">and wait \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">few \u003c/span>\u003cspan class=\"tgt\">minutes\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 적색 신호에서 우리는 멈춰서 몇 분 동안 기다려야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 녹색 신호일 때와 달리 \u003cb class=\"key\">적색 \u003c/b>\u003cb class=\"key\">신호\u003c/b>에서는 우리가 반드시 \u003cb class=\"key\">멈춰서 \u003c/b>\u003cb class=\"key\">기다려야\u003c/b> 한다는 점을 말해요. 바로 이 \u003cb class=\"key\">기다림\u003c/b>이 신호에 대한 기억 차이를 만들어 준다는 거죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구(장소)\u003c/span> : at + 명사구 : \"적색 신호에서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 should의 당위\u003c/span> : 주어 + should + 동사원형 : \"멈춰야 한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 for + 기간\u003c/span> : for + 기간 표현 : \"몇 분 동안\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"But, 그러나. at a red light, 적색 신호에서는. we should stop, 우리는 멈춰야 한다. and wait for a few minutes, 그리고 몇 분 동안 기다려야 한다. 이 문장 전체를 해석하면, 그러나 적색 신호에서 우리는 멈춰서 몇 분 동안 기다려야 한다.","hl":"m"},{"n":41,"text":"이 문장은 녹색 신호일 때와 달리 적색 신호에서는 우리가 반드시 멈춰서 기다려야 한다는 점을 말해요. 바로 이 기다림이 신호에 대한 기억 차이를 만들어 준다는 거죠.","hl":"mn"},{"n":42,"text":"첫 번째로 at은 적색 신호라는 장소적 상황을 이끄는 전치사예요. 두 번째로 should는 당위의 의미로 쓰여서 멈춰야 한다는 의무를 나타내고, 뒤에는 동사원형이 와요. 세 번째로 for는 몇 분이라는 기간을 나타내는 전치사로 쓰였어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이런 작은 차이가\u003c/span>\u003cspan class=\"en\">This small difference\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리로 하여금 생각하게 만든다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">makes \u003c/span>\u003cspan class=\"tgt\">us \u003c/span>\u003cspan class=\"tgt\">think\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 더 많은 적색 신호를 만난다고\u003c/span>\u003cspan class=\"en\">we meet \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">red \u003c/span>\u003cspan class=\"tgt\">lights \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">녹색 신호보다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">green \u003c/span>\u003cspan class=\"tgt\">lights\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이런 작은 차이가 녹색 신호보다 적색 신호를 더 많이 만났다고 생각하게 만든다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞에서 말한 \u003cb class=\"key\">작은 \u003c/b>\u003cb class=\"key\">차이\u003c/b>가 우리를 \u003cb class=\"key\">착각\u003c/b>하게 만든다고 설명해요. 즉 녹색 신호보다 \u003cb class=\"key\">적색 \u003c/b>\u003cb class=\"key\">신호\u003c/b>를 더 많이 만났다고 느끼게 한다는 거예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">사역동사 make의 5형식\u003c/span> : make + 목적어 + 동사원형 : \"우리로 하여금 생각하게 만들다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">비교급 more ~ than\u003c/span> : more + 명사 + than + 비교 대상 : \"녹색 신호보다 더 많은 적색 신호\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"This small difference, 이런 작은 차이가. makes us think, 우리로 하여금 생각하게 만든다. we meet more red lights, 우리가 더 많은 적색 신호를 만난다고. than green lights, 녹색 신호보다. 이 문장 전체를 해석하면, 이런 작은 차이가 녹색 신호보다 적색 신호를 더 많이 만났다고 생각하게 만든다.","hl":"m"},{"n":44,"text":"이 문장은 앞에서 말한 작은 차이가 우리를 착각하게 만든다고 설명해요. 즉 녹색 신호보다 적색 신호를 더 많이 만났다고 느끼게 한다는 거죠.","hl":"mn"},{"n":45,"text":"첫 번째로 make는 사역동사로 쓰여서 목적어 뒤에 동사원형 think가 오는 구조를 만들어요. 두 번째로 more는 비교급을 만들고 than 뒤의 비교 대상과 비교한다는 점을 기억해 주세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 이런 생각이 자주 반복되면,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">If \u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">thinking \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">repeated \u003c/span>\u003cspan class=\"tgt\">often\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 대부분 안 좋은 것들을 기억하고\u003c/span>\u003cspan class=\"en\">we mostly remember the bad things\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 결론적으로 생각한다\u003c/span>\u003cspan class=\"en\">and finally \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">think \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 항상 실패한다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">always \u003c/span>\u003cspan class=\"tgt\">fail\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">만약 이런 생각들이 자주 반복되면, 우리는 대부분 안 좋은 것들만 기억해서 결론적으로 항상 실패한다고 생각한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞의 \u003cb class=\"key\">착각\u003c/b>이 자주 반복될 때 생기는 최종 \u003cb class=\"key\">결과\u003c/b>를 보여 줘요. 우리가 \u003cb class=\"key\">안 \u003c/b>\u003cb class=\"key\">좋은 \u003c/b>\u003cb class=\"key\">것\u003c/b>만 기억해 결국 항상 실패한다고 생각하게 된다는 뜻이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조건의 if절 + 수동태\u003c/span> : If + 주어 + be + 과거분사 + often : \"만약 이런 생각이 자주 반복되면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 that의 명사절 목적어\u003c/span> : think + that + 주어 + 동사 : \"우리가 항상 실패한다고 생각한다\"\u003c/div>\u003c/div>","segs":[{"n":46,"text":"If this thinking is repeated often, 만약 이런 생각이 자주 반복되면. we mostly remember the bad things, 우리는 대부분 안 좋은 것들을 기억하고. and finally think, 그리고 결론적으로 생각한다. that we always fail, 우리가 항상 실패한다고. 이 문장 전체를 해석하면, 만약 이런 생각들이 자주 반복되면, 우리는 대부분 안 좋은 것들만 기억해서 결론적으로 항상 실패한다고 생각한다.","hl":"m"},{"n":47,"text":"이 문장은 앞의 착각이 자주 반복될 때 생기는 최종 결과를 보여 줘요. 우리가 안 좋은 것만 기억해 결국 항상 실패한다고 생각하게 된다는 뜻이에요.","hl":"mn"},{"n":48,"text":"첫 번째로 if는 조건을 나타내고, is repeated는 반복된다는 수동태예요. 두 번째로 think 뒤의 that절은 우리가 항상 실패한다는 내용을 목적어로 받아 주는 역할을 해요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>학교에 늦은 날 적색 신호만 만나면 우리는 \u003cb class=\"key\">머피의 \u003c/b>\u003cb class=\"key\">법칙\u003c/b>을 떠올린다.\u003c/li>\u003cli>그러나 몇몇 과학자들은 우리가 그렇게 \u003cb class=\"key\">부정적으로\u003c/b> 생각할 필요가 없다고 말한다.\u003c/li>\u003cli>우리가 생각하는 방식의 이유는 \u003cb class=\"key\">선택적 \u003c/b>\u003cb class=\"key\">기억\u003c/b>으로, 뇌에는 강렬한 기억들만 남기 때문이다.\u003c/li>\u003cli>녹색 신호는 기억에 잘 남지 않고 적색 신호는 멈춰야 해서 강하게 남기에, 우리는 적색 신호를 더 많이 만났다고 착각하고 결국 \u003cb class=\"key\">항상 \u003c/b>\u003cb class=\"key\">실패\u003c/b>한다고 생각한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The real reason we think negatively is selective memory: because only strong memories remain in our brain, we remember failures and bad things far more than positive ones.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">학교에 늦은 날 적색 신호만 만나면 우리는 \u003cb class=\"key\">머피의 \u003c/b>\u003cb class=\"key\">법칙\u003c/b>을 떠올리지만, 과학자들은 우리가 그렇게 부정적으로 생각할 필요가 없다고 말한다. 우리가 실패와 안 좋은 일을 더 많이 기억하는 이유는 \u003cb class=\"key\">선택적 \u003c/b>\u003cb class=\"key\">기억\u003c/b> 때문이며, 강렬한 기억만 뇌에 남아 적색 신호를 더 많이 만났다고 착각하게 된다는 것이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":49,"text":"오늘 읽은 글의 핵심은 결국 선택적 기억이에요. 뇌에 강하게 남는 것은 안 좋은 일이다 보니, 우리는 적색 신호를 더 많이 만났다고 착각하게 되죠. 다음에 빨간불이 유난히 많다고 느껴질 때는, 그것이 기억이 만들어 낸 착각일 수 있다는 점을 떠올려 보세요. 오늘도 수고 많았습니다.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
