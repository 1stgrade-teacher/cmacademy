<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터1 Reading 31 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터1 Reading 31","audioDir":"reading31_audio","preview":false,"count":42,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.668em\">Reading\u003cbr>31\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터1\u003c/div>\u003ch1>From Trash to Trend: The Power of Upcycling\u003c/h1>\u003ch2>쓰레기에서 트렌드로: 업사이클링의 힘\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>요약: 쓰레기는 보통 지구를 해친다고 생각되지만, 패션 분야에서는 \u003cb class=\"key\">창의적 \u003c/b>\u003cb class=\"key\">사고\u003c/b>를 통해 새롭고 멋진 제품으로 다시 태어날 수 있다. 독일 회사 Freitag의 사례처럼 \u003cb class=\"key\">업사이클링\u003c/b>은 쓰레기를 활용해 독특하고 \u003cb class=\"key\">친환경적\u003c/b>인 패션을 만드는 새로운 흐름이다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Main idea: Trash can be transformed into unique, eco-friendly fashion products through creative thinking, a trend called upcycling.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 오늘은 쓰레기가 새롭고 멋진 패션 제품으로 다시 태어나는 지문을 함께 읽어 볼게요. 이 글은 업사이클링이라는 새로운 패션 흐름을 소개하고 있어요. 핵심은 쓰레기가 창의적 사고를 만나면 환경에도 좋은 제품이 될 수 있다는 점이에요. 그럼 질문에서 시작해 사례와 결론까지 차근차근 따라가 보겠습니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">\u003cb class=\"key\">업사이클링\u003c/b>(upcycling)은 버려지는 물건이나 쓰레기에 새로운 가치를 더해 다른 제품으로 다시 만드는 일을 말해요. 비슷한 개념으로 리사이클링(recycling)은 재활용, 리유즈(reuse)는 재사용을 뜻하지만, 업사이클링은 원래보다 더 나은 가치나 디자인을 주는 데 초점을 둡니다. 예를 들어 낡은 청바지를 가방으로 만드는 것은 단순한 재활용을 넘어 새로운 디자인과 쓸모를 더하는 일이에요. 일상에서도 다 쓴 페트병을 화분으로 바꾸면 쓰레기가 아니라 새 제품이 되죠. 패션 브랜드들은 이런 \u003cb class=\"key\">친환경\u003c/b> 방식으로 자원을 아끼고 개성을 살린 제품을 만들곤 합니다.\u003c/div>","segs":[{"n":2,"text":"업사이클링은 버려지는 물건이나 쓰레기에 새로운 가치를 더해 다른 제품으로 다시 만드는 일을 말해요. 비슷한 개념으로 리사이클링, 즉 recycling은 재활용, 리유즈, 즉 reuse는 재사용을 뜻하지만, 업사이클링은 원래보다 더 나은 가치나 디자인을 주는 데 초점을 둡니다. 예를 들어 낡은 청바지를 가방으로 만드는 것은 단순한 재활용을 넘어 새로운 디자인과 쓸모를 더하는 일이에요. 일상에서도 다 쓴 페트병을 화분으로 바꾸면 쓰레기가 아니라 새 제품이 되죠. 패션 브랜드들은 이런 친환경 방식으로 자원을 아끼고 개성을 살린 제품을 만들곤 합니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>질문과 통념\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>쓰레기를 버린 뒤 어디로 가는지 질문하고, 사람들이 그것이 지구를 해칠 것이라고 생각할 수 있다는 \u003cb class=\"key\">통념\u003c/b>을 제시합니다. 이 부분은 독자의 관심을 끌고 뒤에서 뒤집을 생각의 출발점을 만듭니다. 즉, 쓰레기에 대한 부정적인 인식을 먼저 깔아 둡니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>전환과 정의\u003csmall>전환 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>그러나 패션 분야에서는 쓰레기가 \u003cb class=\"key\">창의적 \u003c/b>\u003cb class=\"key\">사고\u003c/b> 덕분에 새롭고 멋진 제품이 될 수 있다고 주장합니다. 이어서 이런 새로운 종류의 패션을 \u003cb class=\"key\">업사이클링\u003c/b>이라고 정의합니다. 통념을 긍정적인 가능성으로 전환하는 핵심 단계입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>대표 사례\u003csmall>예시 · 문장 5–7\u003c/small>\u003c/h4>\u003cp>독일 회사 Freitag이 많은 \u003cb class=\"key\">방수천\u003c/b>과 \u003cb class=\"key\">안전벨트\u003c/b>로 가방을 만든다는 사례를 제시합니다. 그들은 가방을 만들기 위해 많은 천과 벨트가 필요하고, 자연스럽게 아주 많은 쓰레기가 사용됩니다. 구체적인 제품 사례를 통해 업사이클링이 실제로 어떻게 실현되는지 보여 줍니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>결과와 평가\u003csmall>결론 · 문장 8–10\u003c/small>\u003c/h4>\u003cp>Freitag의 가방은 튼튼하고 방수가 되며 \u003cb class=\"key\">친환경적\u003c/b>이어서 곧 유명해졌고, 각각 다른 천으로 만들어져 모든 가방이 다르다고 설명합니다. 마지막으로 이런 \u003cb class=\"key\">패션 \u003c/b>\u003cb class=\"key\">트렌드\u003c/b>가 독특할 뿐만 아니라 \u003cb class=\"key\">환경\u003c/b>에도 좋다고 평가합니다. 사례의 결과와 글 전체의 결론을 함께 정리하는 단계입니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 차례대로 살펴볼게요.","hl":null},{"n":4,"text":"첫 단계는 질문과 통념이에요. 쓰레기를 버린 뒤 어디로 가는지 묻고, 독자는 그것이 지구를 해칠 것이라고 생각할 수 있다고 말하죠. 여기서는 쓰레기에 대한 부정적인 통념을 먼저 잡아 주는 것이 중요해요.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 전환이 일어납니다. 그러나 패션 분야에서는 쓰레기가 창의적 사고 덕분에 새롭고 멋진 제품이 될 수 있다고 해요. 이 새로운 패션을 업사이클링이라고 부른다는 점도 꼭 기억해 주세요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 대표 사례입니다. 독일 회사 Freitag은 많은 방수천과 안전벨트로 가방을 만들고, 그 과정에서 아주 많은 쓰레기가 사용된다고 설명해요. 구체적인 사례를 통해 업사이클링이 실제 제품으로 어떻게 이어지는지 보여 주는 부분이에요.","hl":"f2"},{"n":7,"text":"네 번째 단계는 결과와 평가입니다. Freitag의 가방은 튼튼하고 방수가 되며 친환경적이라서 곧 유명해졌고, 각각 다른 천으로 만들어져 모든 가방이 다르다고 해요. 마지막으로 이런 패션 트렌드가 독특할 뿐만 아니라 환경에도 좋다고 정리합니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">통념-반박\u003c/span>\u003cspan class=\"lp-pill\">양괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 3번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 두 문장은 질문과 통념을 제시하고, 세 번째 문장에서 But으로 \u003cb class=\"key\">전환\u003c/b>하며 쓰레기가 창의적 사고로 새 제품이 된다는 \u003cb class=\"key\">주제\u003c/b>를 밝힙니다. 이어 Freitag 사례가 \u003cb class=\"key\">근거\u003c/b>로 제시되고, 마지막 문장이 업사이클링의 가치를 다시 정리합니다. 주제문이 앞쪽에 있고 결론문이 뒤에 있어 \u003cb class=\"key\">양괄식\u003c/b>으로 볼 수 있습니다. 통념을 먼저 보여 준 뒤 반박하는 흐름이라 통념-반박 구조로 판단합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>But (3)\u003c/b>\u003cspan>통념을 반박하고 주제를 전환\u003c/span>\u003cb>thanks to (3)\u003c/b>\u003cspan>원인 제시\u003c/span>\u003cb>because (8)\u003c/b>\u003cspan>이유 제시\u003c/span>\u003cb>Also (9)\u003c/b>\u003cspan>내용 추가\u003c/span>\u003cb>not only ... but also (10)\u003c/b>\u003cspan>강조와 추가\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">throw it away\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">trash\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">new, fancy products\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">upcycling\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">bags from cloth and safety belts\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">eco-friendly\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">good for the environment\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>쓰레기에 대한 통념\u003c/th>\u003cth>업사이클링의 관점\u003c/th>\u003c/tr>\u003ctr>\u003ctd>지구를 해칠 것이라고 생각함\u003c/td>\u003ctd>새롭고 멋진 제품이 될 수 있음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>버리면 끝나는 존재\u003c/td>\u003ctd>창의적 사고로 가치를 더하는 재료\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 통념을 제시한 뒤 But으로 반박하며 주제를 밝히는 통념과 반박의 구조예요. 첫 두 문장에서 쓰레기에 대한 부정적인 통념을 보여 주고, 세 번째 문장에서 패션 분야의 긍정적인 전환을 주장하죠. 그리고 Freitag 사례를 근거로 제시한 뒤 마지막 문장에서 업사이클링의 가치를 다시 정리합니다. 주제문이 앞쪽에 있고 결론문이 뒤에 있어서 양괄식으로 볼 수 있어요.","hl":"ty"},{"n":9,"text":"신호어를 보면 흐름이 더 선명해져요. 두 번째 문장의 may think는 통념을, 세 번째 문장의 But은 그 통념을 뒤집는 전환을 알려 줍니다. thanks to는 창의적 사고가 원인임을 보여 주고, 여덟 번째 문장의 because는 가방이 유명해진 이유를 제시해요. 마지막의 not only but also는 독특함과 환경에 좋은 점을 함께 강조합니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>throw away\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>버리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>trash\u003c/b>\u003cem>명사\u003c/em>\u003cspan>쓰레기\u003c/span>\u003c/div>\u003cdiv>\u003cb>harm\u003c/b>\u003cem>동사\u003c/em>\u003cspan>해치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>earth\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지구\u003c/span>\u003c/div>\u003cdiv>\u003cb>fashion field\u003c/b>\u003cem>명사\u003c/em>\u003cspan>패션 분야\u003c/span>\u003c/div>\u003cdiv>\u003cb>fancy\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>멋진, 고급스러운\u003c/span>\u003c/div>\u003cdiv>\u003cb>product\u003c/b>\u003cem>명사\u003c/em>\u003cspan>제품\u003c/span>\u003c/div>\u003cdiv>\u003cb>thanks to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~ 덕분에\u003c/span>\u003c/div>\u003cdiv>\u003cb>creative\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>창의적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>upcycling\u003c/b>\u003cem>명사\u003c/em>\u003cspan>업사이클링, 새활용\u003c/span>\u003c/div>\u003cdiv>\u003cb>German\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>독일의\u003c/span>\u003c/div>\u003cdiv>\u003cb>company\u003c/b>\u003cem>명사\u003c/em>\u003cspan>회사\u003c/span>\u003c/div>\u003cdiv>\u003cb>make A from B\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>A를 B로 만들다\u003c/span>\u003c/div>\u003cdiv>\u003cb>piece\u003c/b>\u003cem>명사\u003c/em>\u003cspan>조각, 한 장\u003c/span>\u003c/div>\u003cdiv>\u003cb>waterproof\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>방수가 되는\u003c/span>\u003c/div>\u003cdiv>\u003cb>cloth\u003c/b>\u003cem>명사\u003c/em>\u003cspan>천, 직물\u003c/span>\u003c/div>\u003cdiv>\u003cb>safety belt\u003c/b>\u003cem>명사\u003c/em>\u003cspan>안전벨트\u003c/span>\u003c/div>\u003cdiv>\u003cb>tons of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>아주 많은\u003c/span>\u003c/div>\u003cdiv>\u003cb>be used\u003c/b>\u003cem>동사\u003c/em>\u003cspan>사용되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>famous\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>유명한\u003c/span>\u003c/div>\u003cdiv>\u003cb>strong\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>튼튼한, 강한\u003c/span>\u003c/div>\u003cdiv>\u003cb>eco-friendly\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>친환경적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>each\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>각각의\u003c/span>\u003c/div>\u003cdiv>\u003cb>be made from\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 만들어지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>trend\u003c/b>\u003cem>명사\u003c/em>\u003cspan>경향, 트렌드\u003c/span>\u003c/div>\u003cdiv>\u003cb>not only A but also B\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>A뿐만 아니라 B도\u003c/span>\u003c/div>\u003cdiv>\u003cb>unique\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>독특한\u003c/span>\u003c/div>\u003cdiv>\u003cb>environment\u003c/b>\u003cem>명사\u003c/em>\u003cspan>환경\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어도 몇 개 짚어 볼게요. trash는 쓰레기, throw away는 버리다, harm은 해치다는 뜻이에요. waterproof는 방수가 되는, eco-friendly는 친환경적인, unique는 독특한이라는 의미로 꼭 알아 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">harm\u003c/b>\u003cspan class=\"m\">해치다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspa span class=\"s\">unusual\u003c/span>\u003cspan class=\"s\">singular\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">common\u003c/span>\u003cspan class=\"a\">ordinary\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">different\u003c/b>\u003cspan class=\"m\">다른\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">distinct\u003c/span>\u003cspan class=\"s\">varied\u003c/span>\u003cspan class=\"s\">diverse\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">same\u003c/span>\u003cspan class=\"a\">identical\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 함께 정리해 볼게요. harm은 damage나 hurt로 바꿔 쓸 수 있고 반대말은 protect나 benefit이에요. creative는 imaginative, innovative와 가깝고 반대말은 uncreative예요. famous는 well-known, renowned로 바꿀 수 있으며 반대말은 unknown입니다. unique는 distinctive, unusual와 비슷하고 반대말은 common이나 ordinary로 기억해 주세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">쓰레기는 어디로 갈까\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Where \u003c/span>\u003cspan class=\"tgt\">does \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">trash \u003c/span>\u003cspan class=\"tgt\">go\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분이 그것을 버린 후에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">after \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">throw \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">away\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">쓰레기는 여러분이 버린 후에 어디로 갈까?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 버린 쓰레기가 어디로 가는지 독자에게 \u003cb class=\"key\">질문\u003c/b>을 던지며 글을 여는 도입 문장이에요. 당연하게 여기던 일에 물음을 던져 \u003cb class=\"key\">관심\u003c/b>을 끌어내는 장치죠. 이 물음이 뒤에 나오는 패션 이야기로 자연스럽게 이어지는 발판이 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문사가 이끄는 의문문(do/does를 쓰는 의문문)\u003c/span> : [의문사 Where] + [조동사 does] + [주어 the trash] + [동사원형 go] : \"쓰레기는 어디로 갈까\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 after가 이끄는 시간 부사절\u003c/span> : [접속사 after] + [주어 you] + [동사 throw] + [목적어 it] + [부사 away] : \"여러분이 그것을 버린 후에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">구동사(이어동사)에서 대명사 목적어의 위치\u003c/span> : [동사 throw] + [목적어 it] + [부사 away] : \"그것을 버리다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Where does the trash go, 쓰레기는 어디로 갈까. after you throw it away?, 여러분이 그것을 버린 후에. 이 문장 전체를 해석하면, 쓰레기는 여러분이 버린 후에 어디로 갈까?","hl":"m"},{"n":13,"text":"이 문장은 버린 쓰레기가 어디로 가는지 질문을 던지면서 글을 시작해요. 우리가 당연하게 여기던 일에 물음을 던져서 관심을 끌어내는 거죠. 그리고 이 물음이 뒤에 나오는 패션 이야기로 자연스럽게 이어지는 발판이 됩니다.","hl":"mn"},{"n":14,"text":"먼저 Where does the trash go를 보면, 주어 the trash가 단수라서 조동사 does를 쓴 거예요. 조동사가 나오면 본동사는 동사원형 go가 된다는 것, 꼭 기억하세요. 두 번째로 throw it away, 여기서 away가 붙은 구동사는 목적어가 대명사일 때 동사와 부사 사이에 목적어를 넣어요. 그래서 throw away it이 아니라 throw it away인 거죠. 세 번째로 after you throw it away에서 after는 접속사로 부사절을 이끌고, 부사절 안에서는 미래의 일도 현재시제로 쓴다는 점도 함께 챙겨 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은 생각할지도 모른다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">You \u003c/span>\u003cspan class=\"tgt\">may \u003c/span>\u003cspan class=\"tgt\">think\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 해칠 것이라고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">harm \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지구를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">earth\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여러분은 그것이 지구를 해칠 것이라고 생각할지도 모른다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 쓰레기는 지구를 해치는 나쁜 것이라는 \u003cb class=\"key\">일반적 \u003c/b>\u003cb class=\"key\">인식\u003c/b>을 대신 말해 주는 문장이에요. 뒤에서 이 생각을 But으로 뒤집기 위해 일부러 깔아 두는 \u003cb class=\"key\">장치\u003c/b>라고 보면 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">추측의 조동사 may + 동사원형\u003c/span> : [주어 You] + [조동사 may] + [동사원형 think] : \"여러분은 생각할지도 모른다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">목적어로 쓰인 명사절(접속사 that 생략)\u003c/span> : [동사 think] + [(that) + 주어 it + 동사 will harm + 목적어 the earth] : \"그것이 지구를 해칠 것이라고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">목적어를 바로 취하는 타동사\u003c/span> : [타동사 harm] + [목적어 the earth] : \"지구를 해치다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"You may think, 여러분은 생각할지도 모른다. it will harm, 그것이 해칠 것이라고. the earth, 지구를. 이 문장 전체를 해석하면, 여러분은 그것이 지구를 해칠 것이라고 생각할지도 모른다.","hl":"m"},{"n":16,"text":"우리가 흔히 하는 생각을 대신 말해 주는 문장이에요. 쓰레기는 지구를 해치는 나쁜 것이라는 일반적인 인식이죠. 뒤에서 이 생각을 뒤집기 위해서 일부러 깔아 두는 장치라고 보면 됩니다.","hl":"mn"},{"n":17,"text":"먼저 You may think에서 may는 추측의 조동사예요. 그래서 생각할지도 모른다는 뜻이 되고, 조동사 뒤에는 동사원형 think가 옵니다. 두 번째로 it will harm the earth는 think의 목적어로 쓰인 명사절인데, 접속사 that이 생략된 형태예요. 동사 think 뒤에 주어 it과 동사 will harm이 그대로 이어진다고 이해하면 됩니다. 세 번째로 harm은 목적어를 바로 받는 타동사라서 harm the earth처럼 전치사 없이 the earth를 씁니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나\u003c/span>\u003cspan class=\"en\">But,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">패션 분야에서는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">fashion \u003c/span>\u003cspan class=\"tgt\">field\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">쓰레기가 ~이 될 수 있다\u003c/span>\u003cspan class=\"en\">trash \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">become\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새롭고 멋진 제품이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">new, \u003c/span>\u003cspan class=\"tgt\">fancy \u003c/span>\u003cspan class=\"tgt\">products\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">창의적인 사고 덕분에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">thanks \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">creative \u003c/span>\u003cspan class=\"tgt\">thinking\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 패션 분야에서는 쓰레기가 창의적인 사고 덕분에 새롭고 멋진 제품이 될 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 예상을 But으로 뒤집으면서 글의 \u003cb class=\"key\">주제\u003c/b>를 여는 핵심 문장이에요. 쓰레기가 \u003cb class=\"key\">창의적 \u003c/b>\u003cb class=\"key\">사고\u003c/b>를 만나 가치 있는 제품으로 다시 태어난다는 \u003cb class=\"key\">업사이클링\u003c/b>의 개념을 소개하는 역할을 하죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 용법(범위 한정)\u003c/span> : [전치사 in] + [명사구 the fashion field] : \"패션 분야에서는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">가능성의 조동사 can + 동사원형\u003c/span> : [조동사 can] + [동사원형 become] : \"~이 될 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">형용사의 병렬(쉼표로 연결된 형용사구)\u003c/span> : [형용사 new] + [,] + [형용사 fancy] + [명사 products] : \"새롭고 멋진 제품\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">관용표현 thanks to(~덕분에)\u003c/span> : [thanks to] + [명사구 creative thinking] : \"창의적인 사고 덕분에\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"But, 그러나. in the fashion field, 패션 분야에서는. trash can become, 쓰레기가 ~이 될 수 있다. new, fancy products, 새롭고 멋진 제품이. thanks to creative thinking, 창의적인 사고 덕분에. 이 문장 전체를 해석하면, 그러나 패션 분야에서는 쓰레기가 창의적인 사고 덕분에 새롭고 멋진 제품이 될 수 있다.","hl":"m"},{"n":19,"text":"앞에서 말한 나쁜 이미지를 But으로 한 번 뒤집는 문장이에요. 쓰레기가 창의적인 사고를 만나면 새롭고 멋진 제품이 될 수 있다는 거죠. 이 문장이 글 전체의 주제를 여는 역할을 합니다.","hl":"mn"},{"n":20,"text":"먼저 in the fashion field는 전치사구로, 어느 분야에서인지 범위를 한정해 주는 부사구예요. 두 번째로 can become에서 can은 가능성의 조동사이고 뒤에는 동사원형 become이 와요. 세 번째로 new, fancy products는 형용사 new와 fancy가 쉼표로 나란히 놓인 병렬 구조로, 둘 다 products를 꾸며 줍니다. 네 번째로 thanks to는 덕분에라는 관용표현으로, 뒤에 명사구 creative thinking이 옵니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 ~이다\u003c/span>\u003cspan class=\"en\">It is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새로운 종류의 패션\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">new \u003c/span>\u003cspan class=\"tgt\">kind \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">fashion\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘업사이클링’이라고 불리는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">called \u003c/span>\u003cspan class=\"tgt\">'upcycling'\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 ‘업사이클링’이라고 불리는 새로운 종류의 패션이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 쓰레기가 창의적 사고 덕분에 새롭고 멋진 제품이 된다고 했죠. 그렇게 만들어진 새로운 \u003cb class=\"key\">패션\u003c/b>의 이름이 \u003cb class=\"key\">업사이클링\u003c/b>이라고 밝히는 문장이에요. 단순 재활용을 넘어 새로운 가치를 더한다는 뜻이 담긴 \u003cb class=\"key\">신조어\u003c/b>라고 이해하면 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">kind of + 단수명사 / 명사구의 주격보어\u003c/span> : a kind of + [단수명사] → It is + [명사구] : \"새로운 종류의 패션\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사구의 형용사적 수식(후치 수식)\u003c/span> : [명사구] + [called + 명사 (과거분사구)] : \"‘업사이클링’이라고 불리는\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"It is, 그것은 ~이다. a new kind of fashion, 새로운 종류의 패션. called 'upcycling', ‘업사이클링’이라고 불리는. 이 문장 전체를 해석하면, 그것은 ‘업사이클링’이라고 불리는 새로운 종류의 패션이다.","hl":"m"},{"n":22,"text":"앞 문장에서 쓰레기가 멋진 제품이 된다고 했죠. 그 새로운 패션의 이름이 바로 업사이클링이에요. 재활용을 넘어 새로운 가치를 더한다는 뜻이 담긴 신조어라고 정리해 두면 됩니다.","hl":"mn"},{"n":23,"text":"첫 번째로, called upcycling은 앞에 있는 a new kind of fashion을 뒤에서 꾸며 주는 과거분사구예요. 과거분사 called는 불리다라는 수동의 의미라서 업사이클링이라고 불리는, 로 해석합니다. 두 번째로, a new kind of fashion에서 kind of 뒤에는 단수명사 fashion이 온다는 점도 챙겨 두세요. 이 명사구 전체가 be동사 뒤에서 주격보어 자리를 채우고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">독일의 회사 ‘Freitag’은\u003c/span>\u003cspan class=\"en\">The German company 'Freitag'\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 조각의 ~로 가방을 만든다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">makes \u003c/span>\u003cspan class=\"tgt\">bags \u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">many \u003c/span>\u003cspan class=\"tgt\">pieces \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">방수천과 안전벨트로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">waterproof \u003c/span>\u003cspan class=\"tgt\">cloth \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">safety \u003c/span>\u003cspan class=\"tgt\">belts\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">독일의 회사 ‘Freitag’은 많은 방수천과 안전벨트로 가방을 만든다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 업사이클링이 실제 기업의 사업이 된 사례를 보여 주는 문장이에요. 버려질 \u003cb class=\"key\">방수천\u003c/b> 조각과 \u003cb class=\"key\">안전벨트\u003c/b>를 원료로 삼아 가방을 만든다는 뜻입니다. 앞 문장의 추상적인 설명을 구체적인 \u003cb class=\"key\">사례\u003c/b>로 받쳐 주는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">3형식과 전치사 from(원료)\u003c/span> : make + [목적어 bags] + from + [원료] : \"많은 방수천과 안전벨트로 가방을 만든다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수량 표현 + of + 불가산명사\u003c/span> : many pieces of + [불가산명사] : \"많은 조각의 방수천\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"The German company 'Freitag', 독일의 회사 ‘Freitag’은. makes bags from many pieces of, 많은 조각의 ~로 가방을 만든다. waterproof cloth and safety belts, 방수천과 안전벨트로. 이 문장 전체를 해석하면, 독일의 회사 ‘Freitag’은 많은 방수천과 안전벨트로 가방을 만든다.","hl":"m"},{"n":25,"text":"업사이클링의 실제 사례가 나오는 문장이에요. 독일 회사 프라이탁이 방수천 조각과 안전벨트로 가방을 만든다는 거죠. 버려질 재료가 가방의 원료가 된다는 점이 핵심입니다.","hl":"mn"},{"n":26,"text":"첫 번째로, makes bags from many pieces of waterproof cloth and safety belts에서 make A from B는 B라는 원료로 A를 만든다는 뜻이에요. 원료가 완전히 다른 물건으로 변할 때는 from을 쓴다고 기억하세요. 두 번째로, many pieces of waterproof cloth를 보면 cloth는 셀 수 없는 불가산명사라서 단위명사 piece를 복수로 만들어 개수를 셉니다. 그래서 many cloths가 아니라 many pieces of cloth가 되는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들에게는 필요하다\u003c/span>\u003cspan class=\"en\">They need\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 천 조각과 벨트가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">many \u003c/span>\u003cspan class=\"tgt\">pieces \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">cloth \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">belts\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 가방을 만들기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">bags\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들의 가방을 만들기 위해서는 많은 천과 벨트가 필요하다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 가방을 만든다고 했으니, 그 과정에 \u003cb class=\"key\">재료\u003c/b>가 많이 든다는 것을 이어 주는 문장이에요. 자연히 엄청난 양의 쓰레기가 재활용된다는 다음 문장으로 흐름을 연결합니다. 즉 업사이클링이 \u003cb class=\"key\">환경\u003c/b>에 이롭다는 결론을 위한 디딤돌입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">등위접속사 and의 병렬 구조\u003c/span> : [many pieces of cloth] and [belts] : \"많은 천 조각과 벨트\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : [주어 + 동사 + 목적어] + to + [동사원형] (목적의 to부정사구) : \"그들의 가방을 만들기 위해\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"They need, 그들에게는 필요하다. many pieces of cloth and belts, 많은 천 조각과 벨트가. to make their bags, 그들의 가방을 만들기 위해. 이 문장 전체를 해석하면, 그들의 가방을 만들기 위해서는 많은 천과 벨트가 필요하다.","hl":"m"},{"n":28,"text":"앞에서 가방을 만든다고 했으니, 그 과정에 재료가 많이 필요하다는 것을 이어 주는 문장이에요. 결국 엄청난 양의 쓰레기가 쓰인다는 다음 내용으로 자연스럽게 넘어가는 디딤돌 역할을 합니다.","hl":"mn"},{"n":29,"text":"첫 번째로, to make their bags는 가방을 만들기 위해라는 목적을 나타내는 to부정사예요. 가방을 만드는 것이 아니라 목적으로 해석해야 자연스럽습니다. 두 번째로, many pieces of cloth and belts에서는 and가 명사구 두 개를 대등하게 연결하고 있어요. cloth는 pieces of의 수량 표현을 받고 belts는 many의 의미를 함께 받는 병렬 구조라는 점을 짚어 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자연스럽게,\u003c/span>\u003cspan class=\"en\">Naturally,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아주 많은 쓰레기가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">tons \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">trash\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사용된다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">used\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">자연스럽게 아주 많은 쓰레기가 사용된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 가방을 만들려면 많은 천과 벨트가 필요하다고 했으니, 그 재료가 바로 쓰레기에서 온다는 결과를 Naturally로 자연스럽게 이어 주는 문장이에요. Naturally는 '당연히, 자연스럽게'라는 \u003cb class=\"key\">연결어\u003c/b>이고, tons of는 무게가 아니라 '아주 많은'이라는 \u003cb class=\"key\">양 \u003c/b>\u003cb class=\"key\">표현\u003c/b>이라서 뒤에 셀 수 없는 trash가 와도 자연스러워요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수량 표현 tons of + 불가산명사\u003c/span> : [[tons of]] + [불가산명사 trash] : \"아주 많은 쓰레기\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태(be동사 + 과거분사)\u003c/span> : [주어 trash] + [[be동사 is]] + [과거분사 used] : \"사용된다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Naturally, 자연스럽게. tons of trash, 아주 많은 쓰레기가. is used, 사용된다.. 이 문장 전체를 해석하면, 자연스럽게 아주 많은 쓰레기가 사용된다.","hl":"m"},{"n":31,"text":"이 문장은 앞에서 가방을 만들려면 많은 천과 벨트가 필요하다고 했으니 그 재료가 결국 쓰레기에서 온다는 흐름을 이어 줍니다. Naturally는 당연히, 자연스럽게라는 연결어로 앞 내용의 결과임을 알려 주고, tons of는 아주 많이라는 양 표현이라서 쓰레기처럼 셀 수 없는 명사와도 잘 어울려요.","hl":"mn"},{"n":32,"text":"첫 번째 어법 포인트는 tons of trash예요. tons of는 톤이라는 무게에서 나왔지만 여기서는 아주 많이라는 뜻의 수량 표현으로 쓰였고, trash는 셀 수 없는 명사라서 복수형으로 쓰지 않아요. 두 번째는 is used인데요, 주어인 trash가 사용되는 대상이기 때문에 수동태를 쓴 거예요. 누가 사용하는지는 중요하지 않아서 행위자는 생략한 겁니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 가방은\u003c/span>\u003cspan class=\"en\">Their bags\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">곧 유명해졌다\u003c/span>\u003cspan class=\"en\">soon \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">became \u003c/span>\u003cspan class=\"tgt\">famous\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜냐하면 그것들은 튼튼하고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">because \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">strong, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">방수가 되며 친환경적이기 때문이다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">waterproof, \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">eco-friendly\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들의 가방은 튼튼하고 방수가 되며 친환경적이기 때문에 곧 유명해졌다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 회사가 엄청난 양의 쓰레기를 재료로 쓴다고 했는데, 그 결과 만든 가방이 곧 유명해졌다는 것을 말하는 문장이에요. because 이하에서 튼튼함, 방수, 친환경이라는 세 가지 \u003cb class=\"key\">이유\u003c/b>를 제시하며, 이 세 가지가 업사이클링 가방의 \u003cb class=\"key\">경쟁력\u003c/b>이라는 점을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">2형식 동사 become + 형용사(주격보어)\u003c/span> : [주어 Their bags] + [[became]] + [형용사 famous] : \"유명해졌다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이유의 접속사 because + 형용사 병렬\u003c/span> : [[because]] + [주어 they] + [동사 are] + [형용사 A, B, and C] : \"그것들이 튼튼하고 방수가 되며 친환경적이기 때문에\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"Their bags, 그들의 가방은. soon became famous, 곧 유명해졌다. because they are strong, 왜냐하면 그것들은 튼튼하고. waterproof, and eco-friendly, 방수가 되며 친환경적이기 때문이다.. 이 문장 전체를 해석하면, 그들의 가방은 튼튼하고 방수가 되며 친환경적이기 때문에 곧 유명해졌다.","hl":"m"},{"n":34,"text":"앞에서 회사가 엄청난 양의 쓰레기를 재료로 쓴다고 했죠. 그래서 만든 가방이 곧 유명해졌다는 결과를 말하는 문장이에요. because 이하에서 튼튼함, 방수, 친환경이라는 세 가지 이유를 제시하면서, 이 세 가지가 업사이클링 가방의 경쟁력이라는 점을 강조하고 있습니다.","hl":"mn"},{"n":35,"text":"첫 번째는 became famous예요. become은 이 되다라는 뜻의 2형식 동사라서 뒤에 형용사가 와서 주어의 상태 변화를 설명하는 주격보어 역할을 합니다. 두 번째는 because인데요, 이유를 이끄는 종속접속사이고 뒤에 strong, waterproof, eco-friendly 세 형용사가 and로 병렬 연결되어 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또한,\u003c/span>\u003cspan class=\"en\">Also,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세상의 모든 그들의 가방은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">all \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">bags \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">world\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다르다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">different\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜냐하면 각각의 가방은 ~로 만들어지기 때문에\u003c/span>\u003cspan class=\"en\">because \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">each \u003c/span>\u003cspan class=\"tgt\">bag \u003c/span>\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">made \u003c/span>\u003cspan class=\"tgt\">from\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 다른 종류의 천으로\u003c/span>\u003cspan class=\"en\">many different types of cloth.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">또한, 각각의 가방이 많은 다른 종류의 천으로 만들어지기 때문에 세상의 모든 그들의 가방은 다르다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 각각의 가방이 서로 다른 천으로 만들어지기 때문에 세상 어디에 있는 그들의 가방도 모두 다르다는 것을 말하는 문장이에요. Also로 앞 내용에 \u003cb class=\"key\">추가\u003c/b> 정보를 얹고, because로 그 이유를 천이라는 \u003cb class=\"key\">원료\u003c/b>의 다양성에서 찾고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 수식\u003c/span> : [all their bags] + [[in the world]] : \"세상의 모든 그들의 가방\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be동사 + 형용사(상태 표현)\u003c/span> : [주어 all their bags] + [[are different]] : \"다르다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">each + 단수명사(단수 취급)\u003c/span> : [[each]] + [단수명사 bag] + [단수동사 is] : \"각각의 가방은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">수동태 + be made from(원료)\u003c/span> : [each bag] + [[is made from]] + [원료 many different types of cloth] : \"많은 다른 종류의 천으로 만들어진다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Also, 또한. all their bags in the world, 세상의 모든 그들의 가방은. are different, 다르다. because each bag is made from, 왜냐하면 각각의 가방은 ~로 만들어지기 때문에. many different types of cloth, 많은 다른 종류의 천으로. 이 문장 전체를 해석하면, 또한, 각각의 가방이 많은 다른 종류의 천으로 만들어지기 때문에 세상의 모든 그들의 가방은 다르다.","hl":"m"},{"n":37,"text":"각각의 가방이 서로 다른 천으로 만들어지기 때문에 세상 어디에 있는 그들의 가방도 모두 다르다는 뜻이에요. Also로 앞 내용에 추가 정보를 얹고, because로 그 이유를 원료의 다양성에서 찾고 있습니다.","hl":"mn"},{"n":38,"text":"첫 번째는 in the world예요. 앞에 있는 bags를 뒤에서 꾸며 주는 전치사구로, 세상에 있는 그들의 모든 가방이라는 뜻을 만들어 줍니다. 두 번째는 are different인데요, be동사와 형용사가 만나 다르다는 상태를 나타내는 표현이에요. 세 번째는 is made from으로, 각각의 가방이 만들어지는 대상이니까 수동태를 썼고 from은 원료를 나타냅니다. be made of는 형태가 보이는 재료, be made from은 가공되어 원형이 남지 않는 재료에 쓴다는 차이도 기억해 두세요. 네 번째는 each bag is인데요, each는 뒤에 오는 명사를 단수로 취급해서 동사도 단수형 is를 씁니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">패션 분야의 이러한 경향은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">This \u003c/span>\u003cspan class=\"tgt\">trend \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">fashion \u003c/span>\u003cspan class=\"tgt\">field\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">독특할 뿐만 아니라\u003c/span>\u003cspan class=\"en\">is \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">only \u003c/span>\u003cspan class=\"tgt\">unique, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또한 좋다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">but \u003c/span>\u003cspan class=\"tgt\">also \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">good \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">환경에도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">environment\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">패션 분야의 이러한 경향은 독특할 뿐만 아니라 환경에도 좋다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글의 \u003cb class=\"key\">결론\u003c/b> 부분으로, 패션 분야의 이러한 경향이 \u003cb class=\"key\">독특\u003c/b>하면서도 \u003cb class=\"key\">환경\u003c/b>에 이롭다는 점을 정리한다. 앞에서 소개한 \u003cb class=\"key\">업사이클링\u003c/b>이 단순한 유행을 넘어 \u003cb class=\"key\">친환경적\u003c/b>이라는 점을 강조하는 마무리 문장이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주어를 꾸미는 전치사구\u003c/span> : [주어 This trend] + [전치사구 in the fashion field] + [동사 is] : \"패션 분야의 이러한 경향은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">상관접속사 not only A but also B\u003c/span> : not only + [A(unique)] + but also + [B(good)] : \"독특할 뿐만 아니라 좋은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">형용사 good + 전치사 for\u003c/span> : [be] + [good] + [for] + [목적어(the environment)] : \"환경에 좋은\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"This trend in the fashion field, 패션 분야의 이러한 경향은. is not only unique, 독특할 뿐만 아니라. but also good, 또한 좋다. for the environment, 환경에도. 이 문장 전체를 해석하면, 패션 분야의 이러한 경향은 독특할 뿐만 아니라 환경에도 좋다.","hl":"m"},{"n":40,"text":"이 문장은 글의 결론 부분이에요. 패션 분야의 이러한 경향이 독특하면서도 환경에 이롭다는 점을 정리하고 있죠. 앞에서 소개한 업사이클링이 단순한 유행을 넘어 친환경적이라는 점을 강조하는 마무리 문장이에요.","hl":"mn"},{"n":41,"text":"첫 번째로, This trend in the fashion field를 보면 주어 This trend 뒤에 전치사구 in the fashion field가 붙어 어떤 분야의 경향인지 수식해요. 전치사구는 주어를 뒤에서 꾸며 주는 역할을 한다는 점을 기억하세요. 두 번째로, not only unique, but also good에서 not only A but also B는 A뿐만 아니라 B도라는 뜻이고, unique와 good을 병렬로 연결해요. 상관접속사는 짝을 이루어 앞뒤 표현의 문법 형태를 맞춰 준다는 점도 꼭 기억해 두세요. 세 번째로, good for the environment에서 good for는 환경에 좋은이라는 뜻이고, for는 전치사로 뒤에 the environment가 목적어로 와요. be good for는 시험에 자주 나오는 관용표현이니까 통째로 익혀 두면 좋아요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>쓰레기는 보통 \u003cb class=\"key\">지구\u003c/b>를 해친다고 생각되지만, 패션 분야에서는 \u003cb class=\"key\">창의적 \u003c/b>\u003cb class=\"key\">사고\u003c/b>를 통해 새롭고 멋진 제품이 될 수 있다.\u003c/li>\u003cli>이러한 새로운 종류의 패션을 \u003cb class=\"key\">업사이클링\u003c/b>이라고 하며, 독일 회사 Freitag은 방수천과 안전벨트로 가방을 만든다.\u003c/li>\u003cli>Freitag의 가방은 많은 천과 벨트를 필요로 해 아주 많은 쓰레기가 사용되며, 튼튼하고 방수되며 \u003cb class=\"key\">친환경적\u003c/b>이라 유명해졌다.\u003c/li>\u003cli>각 가방이 다양한 천으로 만들어져 모두 다르고, 이 \u003cb class=\"key\">패션 \u003c/b>\u003cb class=\"key\">트렌드\u003c/b>는 독특할 뿐만 아니라 \u003cb class=\"key\">환경\u003c/b>에도 좋다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Main idea: Trash can be transformed into unique, eco-friendly fashion products through creative thinking, a trend called upcycling.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: 쓰레기는 보통 지구를 해친다고 생각되지만, 패션 분야에서는 \u003cb class=\"key\">창의적 \u003c/b>\u003cb class=\"key\">사고\u003c/b>를 통해 새롭고 멋진 제품으로 다시 태어날 수 있다. 독일 회사 Freitag의 사례처럼 \u003cb class=\"key\">업사이클링\u003c/b>은 쓰레기를 활용해 독특하고 \u003cb class=\"key\">친환경적\u003c/b>인 패션을 만드는 새로운 흐름이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":42,"text":"오늘 글의 핵심은 쓰레기가 창의적 사고를 통해 업사이클링 제품으로 다시 태어날 수 있다는 점이에요. Freitag 사례는 그 아이디어가 실제 패션에서 어떻게 실현되는지 보여 주죠. 마지막 문장처럼 이런 흐름은 독특하면서도 환경에 좋다는 평가로 마무리됩니다. 오늘 내용 잘 정리해 두고 다음 글에서도 화이팅하세요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
