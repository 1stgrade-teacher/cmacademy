<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터1 Reading 07 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터1 Reading 07","audioDir":"07_audio","preview":false,"count":51,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.668em\">Reading\u003cbr>07\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터1\u003c/div>\u003ch1>A Favor from Fun&amp;Joy Zoo: Please Do Not Throw Waste\u003c/h1>\u003ch2>Fun&amp;Joy 동물원의 부탁: 쓰레기를 버리지 말아 주세요\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>Fun&amp;Joy 동물원의 관광 안내원 Danna Smith가 현장 학습을 앞둔 강 선생님께 학생들이 동물원에 \u003cb class=\"key\">쓰레기\u003c/b>를 버리지 않도록 미리 지도해 달라고 부탁한다. 동물들이 \u003cb class=\"key\">쓰레기\u003c/b>를 음식으로 착각해 삼키면 매우 아플 수 있기 때문이다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>A zoo tour guide asks a teacher to tell his students not to throw waste in the zoo, because trash can harm the animals that mistake it for food.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 Fun&Joy 동물원의 관광 안내원 Danna Smith가 강 선생님께 보낸 편지예요. 현장 학습을 오는 학생들에게 동물원에 쓰레기를 버리지 말라고 알려 달라는 부탁의 글이죠. 핵심은 아주 간단해요. 동물들이 쓰레기를 음식으로 착각해 삼키면 매우 아플 수 있으니, 쓰레기는 꼭 쓰레기통에 버리자는 겁니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">동물들은 새로운 물건을 만나면 입으로 시험하는 \u003cb class=\"key\">본능\u003c/b>(instinct)을 가지고 있습니다. 어린아이가 처음 보는 장난감을 입에 넣어 확인하는 것과 같은 방식이죠. 그런데 비닐봉지나 플라스틱 같은 쓰레기는 소화가 되지 않아 장을 막는 \u003cb class=\"key\">장폐색\u003c/b>(intestinal blockage)을 일으킬 수 있습니다. 실제로 야생 동물 보호 단체들은 plastic pollution, 즉 플라스틱 오염이 동물의 건강을 해친다고 경고합니다. 그래서 동물원은 trash cans를 곳곳에 배치하고 방문객의 \u003cb class=\"key\">협조\u003c/b>(cooperation)를 구합니다. 관람객의 작은 습관 하나가 동물의 생존을 좌우할 수 있다는 뜻입니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 하나 짚고 갈게요. 동물들은 새로운 물건을 만나면 입으로 시험하는 본능이 있어요. 처음 보는 장난감을 입에 넣어 확인하는 어린아이와 비슷하죠. 그런데 비닐봉지나 플라스틱 같은 쓰레기는 소화가 되지 않아서 장을 막는 장폐색을 일으킬 수 있어요. 그래서 동물원은 trash cans를 곳곳에 두고 방문객의 협조를 구한답니다. 플라스틱 오염이 동물의 건강을 해친다는 건 이미 널리 알려진 사실이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>인사와 소개\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>관광 안내원 Danna Smith가 강 선생님께 보내는 편지로 글은 시작됩니다. 자신을 Fun&amp;Joy 동물원의 \u003cb class=\"key\">관광 \u003c/b>\u003cb class=\"key\">안내원\u003c/b>이라고 소개하고, 현장 학습으로 동물원을 찾아 준 것에 \u003cb class=\"key\">감사\u003c/b>를 전합니다. 그리고 이곳에서 멋진 하루를 보내시기 바란다고 \u003cb class=\"key\">환영\u003c/b>의 인사를 덧붙입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>부탁의 제시\u003csmall>주장 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>이어서 안내원은 선생님께 부탁드리고 싶은 게 있다며 \u003cb class=\"key\">요청\u003c/b>을 꺼냅니다. 방문하시기 전에 학생들에게 동물원에 \u003cb class=\"key\">쓰레기\u003c/b>를 버리지 않도록 지도해 달라는 것입니다. 글의 \u003cb class=\"key\">주제문\u003c/b>이 바로 이 문장에 담겨 있습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>이유와 근거\u003csmall>근거 · 문장 6–10\u003c/small>\u003c/h4>\u003cp>왜 그런 부탁을 하는지 \u003cb class=\"key\">근거\u003c/b>가 이어집니다. 쓰레기통이 동물원 곳곳에 마련되어 있지만 비닐봉지와 쓰레기는 동물에게 \u003cb class=\"key\">해로울\u003c/b> 수 있다고 말합니다. 어린아이들처럼 동물들은 입으로 사물을 시험하는 것을 좋아해서, 쓰레기를 음식으로 \u003cb class=\"key\">착각\u003c/b>하고 삼켜 병이 들 수 있다는 설명입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>정리와 협조 요청\u003csmall>결론 · 문장 11–13\u003c/small>\u003c/h4>\u003cp>그래서 사랑스러운 동물들의 \u003cb class=\"key\">건강\u003c/b>을 위해 학생들이 동물원에 쓰레기를 버리면 안 된다고 다시 강조합니다. 협조해 주셔서 감사하다는 말로 부탁을 \u003cb class=\"key\">마무리\u003c/b>하고, Danna Smith가 진심을 담아 드림이라고 서명합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 글의 흐름을 네 단계로 나눠서 따라가 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 인사와 소개예요. 안내원이 자신을 관광 안내원이라고 소개하고, 현장 학습으로 동물원을 찾아 준 것에 감사한다고 말하죠. 그리고 이곳에서 멋진 하루를 보내시기 바란다고 환영의 인사를 덧붙입니다.","hl":"f0"},{"n":5,"text":"두 번째 단계에서 드디어 부탁이 나와요. 선생님께 부탁드리고 싶은 게 있다면서, 방문하시기 전에 학생들에게 동물원에 쓰레기를 버리지 않도록 지도해 달라고 요청합니다. 바로 이 문장이 주제문이에요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 이유와 근거예요. 쓰레기통이 곳곳에 마련되어 있지만 비닐봉지와 쓰레기는 동물에게 해로울 수 있다고 말해요. 어린아이들처럼 동물들이 입으로 사물을 시험하는 것을 좋아하기 때문에, 쓰레기를 음식으로 착각하고 삼켜서 병이 들 수 있다는 설명이 이어집니다.","hl":"f2"},{"n":7,"text":"네 번째 단계는 정리와 협조 요청이에요. 사랑스러운 동물들의 건강을 위해 학생들이 동물원에 쓰레기를 버리면 안 된다고 다시 강조하죠. 협조해 주셔서 감사하다는 말로 마무리하고, Danna Smith가 진심을 담아 서명합니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 5번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 4번 문장에서 부탁이 있음을 예고하고 5번 문장에서 \u003cb class=\"key\">주제문\u003c/b>을 먼저 제시한 뒤, 6번부터 10번까지 이유와 예시를 붙이는 \u003cb class=\"key\">주장-근거\u003c/b> 구조입니다. 11번 문장에서 같은 주장을 다시 반복하므로 핵심이 앞에 놓인 \u003cb class=\"key\">두괄식\u003c/b>이라고 볼 수 있습니다. 편지 형식이라 인사와 서명이 앞뒤를 감싸지만, 내용의 중심은 부탁과 그 근거입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>I would like to ask you a favor (4)\u003c/b>\u003cspan>요청 예고\u003c/span>\u003cb>please advise (5)\u003c/b>\u003cspan>주장·요청 제시\u003c/span>\u003cb>can be very harmful (7)\u003c/b>\u003cspan>근거 제시\u003c/span>\u003cb>So, for the health of (11)\u003c/b>\u003cspan>결론·요약 신호\u003c/span>\u003cb>I thank you for your cooperation (12)\u003c/b>\u003cspan>마무리 인사\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">throw waste\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">trash\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">plastic bags and other trash\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">this trash\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">waste\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 주장과 근거예요. 다섯 번째 문장에서 부탁을 먼저 던지고 그다음에 이유를 붙이니까 두괄식이라고 부릅니다. 편지 형식이라 인사가 앞에 있고 서명이 뒤에 있지만, 내용의 중심은 어디까지나 부탁과 그 근거라는 점을 기억하세요.","hl":"ty"},{"n":9,"text":"신호어를 눈여겨보세요. 네 번째 문장의 I would like to ask you a favor는 부탁이 나온다고 미리 알려 주는 표현이죠. 다섯 번째 문장의 please advise가 실제 요청이고, 일곱 번째 문장의 can be very harmful이 근거를 열어 줍니다. 열한 번째 문장의 So, for the health of는 결론을 여는 신호이고, 재진술로는 waste와 trash가 같은 대상을 가리키고 있어요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>tour guide\u003c/b>\u003cem>명사\u003c/em>\u003cspan>관광 안내원\u003c/span>\u003c/div>\u003cdiv>\u003cb>visit\u003c/b>\u003cem>동사\u003c/em>\u003cspan>방문하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>thank you for\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~해 주셔서 감사합니다\u003c/span>\u003c/div>\u003cdiv>\u003cb>field trip\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>현장 학습\u003c/span>\u003c/div>\u003cdiv>\u003cb>wonderful\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>멋진, 훌륭한\u003c/span>\u003c/div>\u003cdiv>\u003cb>ask a favor\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>부탁하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>advise\u003c/b>\u003cem>동사\u003c/em>\u003cspan>조언하다, 지도하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>throw\u003c/b>\u003cem>동사\u003c/em>\u003cspan>버리다, 던지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>waste\u003c/b>\u003cem>명사\u003c/em>\u003cspan>쓰레기, 폐기물\u003c/span>\u003c/div>\u003cdiv>\u003cb>trash can\u003c/b>\u003cem>명사\u003c/em>\u003cspan>쓰레기통\u003c/span>\u003c/div>\u003cdiv>\u003cb>in place\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>제자리에, 설치되어\u003c/span>\u003c/div>\u003cdiv>\u003cb>all around\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>곳곳에, 사방에\u003c/span>\u003c/div>\u003cdiv>\u003cb>plastic bag\u003c/b>\u003cem>명사\u003c/em>\u003cspan>비닐봉지\u003c/span>\u003c/div>\u003cdiv>\u003cb>harmful\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>해로운\u003c/span>\u003c/div>\u003cdiv>\u003cb>be harmful to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 해롭다\u003c/span>\u003c/div>\u003cdiv>\u003cb>test\u003c/b>\u003cem>동사\u003c/em>\u003cspan>시험하다, 확인하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>mouth\u003c/b>\u003cem>명사\u003c/em>\u003cspan>입\u003c/span>\u003c/div>\u003cdiv>\u003cb>mistake A for B\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>A를 B로 착각하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>swallow\u003c/b>\u003cem>동사\u003c/em>\u003cspan>삼키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>sick\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>아픈, 병든\u003c/span>\u003c/div>\u003cdiv>\u003cb>health\u003c/b>\u003cem>명사\u003c/em>\u003cspan>건강\u003c/span>\u003c/div>\u003cdiv>\u003cb>lovely\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>사랑스러운\u003c/span>\u003c/div>\u003cdiv>\u003cb>cooperation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>협조, 협력\u003c/span>\u003c/div>\u003cdiv>\u003cb>sincerely\u003c/b>\u003cem>부사\u003c/em>\u003cspan>진심으로\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"단어도 몇 개 짚어 볼게요. advise는 조언하다, 지도하다는 뜻이고, be harmful to는 무엇에 해롭다는 표현이에요. mistake A for B는 A를 B로 착각하다, swallow는 삼키다로 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">waste\u003c/b>\u003cspan class=\"m\">쓰레기\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">trash\u003c/span>\u003cspan class=\"s\">garbage\u003c/span>\u003cspan class=\"s\">rubbish\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">harmful\u003c/b>\u003cspan class=\"m\">해로운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">damaging\u003c/span>\u003cspan class=\"s\">dangerous\u003c/span>\u003cspan class=\"s\">injurious\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">harmless\u003c/span>\u003cspan class=\"a\">beneficial\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">advise\u003c/b>\u003cspan class=\"m\">조언하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">recommend\u003c/span>\u003cspan class=\"s\">counsel\u003c/span>\u003cspan class=\"s\">suggest\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">swallow\u003c/b>\u003cspan class=\"m\">삼키다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">gulp\u003c/span>\u003cspan class=\"s\">ingest\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">spit\u003c/span>\u003cspan class=\"a\">vomit\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">throw\u003c/b>\u003cspan class=\"m\">버리다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">discard\u003c/span>\u003cspan class=\"s\">dump\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">keep\u003c/span>\u003cspan class=\"a\">collect\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">cooperation\u003c/b>\u003cspan class=\"m\">협조\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">assistance\u003c/span>\u003cspan class=\"s\">collaboration\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">refusal\u003c/span>\u003cspan class=\"a\">obstruction\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">health\u003c/b>\u003cspan class=\"m\">건강\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">well-being\u003c/span>\u003cspan class=\"s\">fitness\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">illness\u003c/span>\u003cspan class=\"a\">sickness\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 정리해 볼게요. waste는 trash, garbage와 같은 말이고, harmful은 damaging이나 dangerous로 바꿔 쓸 수 있어요. 반대로 harmless나 beneficial은 반대 의미가 됩니다. advise는 recommend, counsel과 가깝고, swallow의 반대말은 spit이에요. cooperation은 assistance, collaboration으로 바꿀 수 있다는 점도 함께 기억해 주세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">강 선생님께,\u003c/span>\u003cspan class=\"en\">Dear Mr. Kang,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 관광 안내원입니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">am \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">tour \u003c/span>\u003cspan class=\"tgt\">guide\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Fun&amp;Joy 동물원의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">Fun&amp;Joy \u003c/span>\u003cspan class=\"tgt\">Zoo\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">강 선생님께 저는 Fun&amp;Joy 동물원의 관광 안내원입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 편지의 첫 부분으로, 발신자 Danna Smith가 수신자 강 선생님에게 자신이 Fun&amp;Joy 동물원의 관광 안내원임을 밝히는 \u003cb class=\"key\">자기소개\u003c/b>예요. Dear Mr. Kang은 수신자를 공손히 부르는 \u003cb class=\"key\">호격\u003c/b> 표현으로, 편지의 친절하고 공식적인 분위기를 만들어 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사 + 주격보어\u003c/span> : [I] + [am] + [a tour guide (주격보어)] : \"저는 관광 안내원입니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 수식\u003c/span> : [a tour guide] + [at Fun&amp;Joy Zoo (전치사구)] : \"Fun&amp;Joy 동물원의\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Dear Mr. Kang, 강 선생님께. I am a tour guide, 저는 관광 안내원입니다. at Fun&Joy Zoo, Fun&Joy 동물원의. 이 문장 전체를 해석하면, 강 선생님께 저는 Fun&Joy 동물원의 관광 안내원입니다.","hl":"m"},{"n":13,"text":"첫 번째 문장은 편지의 시작이에요. Dear Mr. Kang이라는 호격으로 강 선생님을 공손히 부르고, 자신이 Fun and Joy 동물원의 관광 안내원이라는 자기소개를 하고 있죠. 그래서 편지가 친절하면서도 공식적인 분위기로 시작해요.","hl":"mn"},{"n":14,"text":"첫 번째로 I am a tour guide에서 am 뒤의 a tour guide가 주격보어로 와서 주어 I의 신분을 설명해요. be동사는 주어와 주격보어를 이어 주는 역할을 하죠. 두 번째로 at Fun and Joy Zoo는 전치사구로, 앞의 a tour guide를 뒤에서 꾸며 어느 동물원의 안내원인지 알려 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">감사합니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Thank \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 동물원을 방문해 주셔서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">visiting\u003c/span> our zoo\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신의 현장 학습으로!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">field \u003c/span>\u003cspan class=\"tgt\">trip\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">현장 학습으로 저희 동물원을 방문해 주셔서 감사합니다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 현장 학습으로 동물원을 방문해 준 데 대해 감사를 전하는 \u003cb class=\"key\">감사 \u003c/b>\u003cb class=\"key\">표현\u003c/b>이에요. 상대의 방문을 긍정적으로 인정하며 편지의 \u003cb class=\"key\">친근한 \u003c/b>\u003cb class=\"key\">분위기\u003c/b>를 만듭니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">Thank you for + 동명사\u003c/span> : Thank you [for] + [visiting (동명사)] : \"방문해 주셔서 감사합니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 for + 명사구\u003c/span> : [for] + [your field trip (명사구)] : \"당신의 현장 학습으로\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Thank you, 감사합니다. for visiting our zoo, 우리 동물원을 방문해 주셔서. for your field trip!, 당신의 현장 학습으로!. 이 문장 전체를 해석하면, 현장 학습으로 저희 동물원을 방문해 주셔서 감사합니다!","hl":"m"},{"n":16,"text":"두 번째 문장은 현장 학습으로 동물원을 찾아온 것에 대한 감사 표현이에요. Thank you for visiting our zoo라고 해서 방문 자체에 고마움을 전하고, for your field trip으로 그 방문이 현장 학습 때문이었음을 밝히죠. 이렇게 상대의 방문을 인정해 주니 편지의 친근한 분위기를 만들어 줘요.","hl":"mn"},{"n":17,"text":"여기서 핵심은 Thank you for 다음에 동명사 visiting이 온다는 점이에요. for는 전치사라서 뒤에 동사원형이 아니라 동명사가 와서 방문한 행위를 목적어로 받아 주죠. 이 표현 전체가 상대가 해 준 일에 대한 감사를 나타내는 관용 표현이에요. 그리고 for your field trip은 전치사 for 뒤에 명사구가 와서 방문의 목적이나 배경을 알려 주는 부사구 역할을 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 바랍니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">hope\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 보내시기를\u003c/span>\u003cspan class=\"en\">you \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">have\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">멋진 하루를\u003c/span>\u003cspan class=\"en\">a wonderful day\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이곳에서\u003c/span>\u003cspan class=\"en\">here.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이곳에서 멋진 하루를 보내시기 바랍니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 방문객이 이곳 동물원에서 멋진 하루를 보내기를 바라는 \u003cb class=\"key\">기원\u003c/b>의 문장이에요. 앞의 감사 인사에 이어 따뜻한 \u003cb class=\"key\">환영의 \u003c/b>\u003cb class=\"key\">마음\u003c/b>을 전하며 편지를 부드럽게 마무리하는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that의 생략 (목적어절)\u003c/span> : [I hope] + [(that) + you will have ...] : \"당신이 ~하시기를 바랍니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 will + 동사원형\u003c/span> : [will] + [have (동사원형)] : \"보내실 것입니다/보내시기를\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"I hope, 저는 바랍니다. you will have, 당신이 보내시기를. a wonderful day, 멋진 하루를. here, 이곳에서. 이 문장 전체를 해석하면, 이곳에서 멋진 하루를 보내시기 바랍니다.","hl":"m"},{"n":19,"text":"세 번째 문장은 방문객이 이곳 동물원에서 멋진 하루를 보내기를 바라는 기원의 문장이에요. 앞에서 고마움을 전한 뒤 따뜻한 환영의 마음을 보태며 편지를 부드럽게 이어 주죠.","hl":"mn"},{"n":20,"text":"먼저 I hope에서 hope 뒤에 that이 생략된 목적어절이 이어져요. 그래서 I hope 다음에 바로 you will have가 나오는 것처럼 보이죠. 또 will have에서는 조동사 will 뒤에 동사원형 have가 와서 앞으로의 미래를 나타내요. 마지막으로 a wonderful day와 here가 함께 이곳에서 멋진 하루를 보내기를 바란다는 내용을 완성해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는\u003c/span>\u003cspan class=\"en\">I\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하고 싶습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신에게 한 가지 부탁을 드리기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">ask \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">favor\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">선생님께 부탁드리고 싶은 게 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 편지의 목적을 부드럽게 밝히는 문장입니다. would like to를 써서 '부탁하고 싶다'를 \u003cb class=\"key\">공손한\u003c/b> 태도로 표현하고, ask you a favor로 선생님께 \u003cb class=\"key\">부탁\u003c/b>이 있음을 정중히 꺼냅니다. 곧이어 나올 구체적인 요청의 \u003cb class=\"key\">도입\u003c/b> 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">would like + to부정사\u003c/span> : would like + [to ask (to부정사구/목적어)] : \"부탁하고 싶습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">ask + 사람 + 사물\u003c/span> : ask + [간접목적어 you] + [직접목적어 a favor] : \"당신에게 한 가지 부탁을 하다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"I, 나는. would like, 하고 싶습니다. to ask you a favor, 당신에게 한 가지 부탁을 드리기를. 이 문장 전체를 해석하면, 선생님께 부탁드리고 싶은 게 있습니다.","hl":"m"},{"n":22,"text":"이 문장은 편지의 목적을 부드럽게 밝히는 문장이에요. would like to를 써서 '부탁하고 싶다'를 공손한 태도로 표현하고, ask you a favor로 선생님께 부탁이 있음을 정중히 꺼냅니다. 곧이어 나올 구체적인 요청의 도입 역할을 하는 거죠.","hl":"mn"},{"n":23,"text":"첫째, would like to는 want보다 공손한 표현이고, 뒤에 to부정사를 목적어로 둡니다. 둘째, ask you a favor는 ask가 간접목적어 you와 직접목적어 a favor를 취하는 구조예요. 그래서 '당신에게 한 가지 부탁을 하다'라고 해석합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">방문하시기 전에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Before \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">visit\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">학생들에게 지도해 주십시오\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">please\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">advise \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">students \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">쓰레기를 버리지 않도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">throw\u003c/span> waste\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">동물원에\u003c/span>\u003cspan class=\"en\">in the zoo.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">방문하시기 전에 학생들에게 동물원에 쓰레기를 버리지 않도록 지도해 주십시오.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 편지의 핵심 부탁을 구체적으로 전달합니다. 방문 전에 학생들이 동물원에 쓰레기를 버리지 않도록 미리 \u003cb class=\"key\">지도\u003c/b>해 달라고 요청하며, please와 advise를 사용해 \u003cb class=\"key\">정중한\u003c/b> 요청의 태도를 보입니다. 다음 문장의 쓰레기통 안내로 자연스럽게 이어지는 \u003cb class=\"key\">사전 \u003c/b>\u003cb class=\"key\">안내\u003c/b> 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 용법(시간)\u003c/span> : Before + [명사구 your visit] : \"당신의 방문 전에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명령문을 정중하게 만드는 please\u003c/span> : Please + [동사원형 advise] : \"~해 주십시오\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">advise + 목적어 + to부정사(부정형)\u003c/span> : advise + [목적어 your students] + [not to throw (to부정사 부정형)] : \"학생들에게 버리지 않도록 지도하다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Before your visit, 방문하시기 전에. please advise your students, 학생들에게 지도해 주십시오. not to throw waste, 쓰레기를 버리지 않도록. in the zoo, 동물원에. 이 문장 전체를 해석하면, 방문하시기 전에 학생들에게 동물원에 쓰레기를 버리지 않도록 지도해 주십시오.","hl":"m"},{"n":25,"text":"이 문장은 편지의 핵심 부탁을 구체적으로 전달해요. 방문 전에 학생들이 동물원에 쓰레기를 버리지 않도록 미리 지도해 달라고 요청하면서, please와 advise로 정중한 태도를 보입니다. 그리고 다음 문장에서 쓰레기통 위치를 알려 주는 사전 안내 역할을 하죠.","hl":"mn"},{"n":26,"text":"첫째, Before your visit에서 before는 전치사로 뒤에 명사구 your visit을 받아 시간을 나타냅니다. 둘째, please는 명령문을 정중한 요청으로 바꿔 주는 표현이에요. 셋째, advise your students not to throw는 advise 다음에 목적어 your students가 오고 그 뒤에 목적격보어로 not to throw가 이어지는 구조입니다. 이때 부정은 to 앞에 not을 두어 쓰는 점을 기억해 주세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">쓰레기통들은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Trash \u003c/span>\u003cspan class=\"tgt\">cans \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제자리에 있습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">are\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan 3cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Plastic \u003c/span>\u003cspan class=\"tgt\">bags \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">other \u003c/span>\u003cspan class=\"tgt\">trash\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~일 수 있습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매우 해로운\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">very \u003c/span>\u003cspan class=\"tgt\">harmful \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 동물들에게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">animals\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">비닐봉지와 기타 쓰레기들은 우리 동물들에게 매우 해로울 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 비닐봉지와 쓰레기가 동물에게 해로울 수 있음을 경고하는 문장이에요. 뒤 문장에서 왜 해로운지 입으로 시험하다가 삼킬 수 있다는 이유를 제시하므로, 전체 글의 \u003cb class=\"key\">문제 \u003c/b>\u003cb class=\"key\">상황\u003c/b>을 여는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">복수 주어\u003c/span> : [명사] + and + [명사] : \"비닐봉지와 기타 쓰레기들은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 can + be + 형용사 + to\u003c/span> : 주어 + can be + [형용사] + to + [대상] : \"우리 동물들에게 매우 해로울 수 있습니다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Plastic bags and other trash, 비닐봉지와 기타 쓰레기들은. can be, ~일 수 있습니다. very harmful, 매우 해로운. to our animals, 우리 동물들에게. 이 문장 전체를 해석하면, 비닐봉지와 기타 쓰레기들은 우리 동물들에게 매우 해로울 수 있습니다.","hl":"m"},{"n":31,"text":"이 문장은 비닐봉지와 쓰레기가 동물에게 해로울 수 있다고 경고해요. 뒤에서 그 이유를 입으로 시험하는 습성으로 설명하니까, 여기서는 전체 글의 문제 상황을 먼저 열어 주는 거예요.","hl":"mn"},{"n":32,"text":"첫 번째로 Plastic bags and other trash는 and로 연결된 복수 주어예요. 두 번째로 can be very harmful to는 can이 가능성을 나타내고 be harmful to가 우리 동물들에게 해롭다는 서술 형용사 표현을 만들며, to는 피해를 입는 대상을 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어린아이들처럼,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Like \u003c/span>\u003cspan class=\"tgt\">small \u003c/span>\u003cspan class=\"tgt\">children\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">동물들은 아주 좋아합니다\u003c/span>\u003cspan class=\"en\">animals love\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사물을 시험하는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">test \u003c/span>\u003cspan class=\"tgt\">things\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">입으로\u003c/span>\u003cspan class=\"en\">with their mouths.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어린아이들처럼 동물들은 입으로 사물을 시험하는 것을 아주 좋아합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 동물이 어린아이와 비슷하게 입으로 사물을 탐색한다는 \u003cb class=\"key\">비유\u003c/b>를 통해, 쓰레기를 입에 넣을 수 있는 이유를 쉽게 설명해요. Like small children은 동물의 행동을 \u003cb class=\"key\">어린아이\u003c/b>에 빗대어 독자가 이해하도록 도와줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 like(비교)\u003c/span> : Like + [명사], 주어 + 동사 : \"어린아이들처럼\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : love + [to부정사구] : \"사물을 시험하는 것을\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"Like small children, 어린아이들처럼. animals love, 동물들은 아주 좋아합니다. to test things, 사물을 시험하는 것을. with their mouths, 입으로. 이 문장 전체를 해석하면, 어린아이들처럼 동물들은 입으로 사물을 시험하는 것을 아주 좋아합니다.","hl":"m"},{"n":34,"text":"동물이 입으로 사물을 살피는 모습을 어린아이에 빗댄 비유예요. Like small children 덕분에 독자는 동물의 행동을 어린아이와 연결해 쉽게 이해할 수 있어요.","hl":"mn"},{"n":35,"text":"첫 번째로 Like small children에서 like는 '좋아하다'가 아니라 '~처럼'이라는 전치사로 비교를 나타내요. 두 번째로 love to test things에서 to test는 love의 목적어로 쓰인 to부정사라서 '사물을 시험하는 것을 좋아하다'로 해석해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">동물들은 착각할 수도 있습니다\u003c/span>\u003cspan class=\"en\">They may \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">mistake \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 쓰레기를 음식으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">trash \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">food\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그것을 삼킬 수도 있습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">swallow \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">동물들은 이 쓰레기를 음식으로 착각하여 삼킬 수도 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 동물이 쓰레기를 음식으로 \u003cb class=\"key\">착각\u003c/b>해 삼키면 몸에 문제가 생길 수 있다는 구체적 위험을 말해요. 앞 문장의 '입으로 시험한다'는 설명이 실제 \u003cb class=\"key\">사고\u003c/b>로 이어질 수 있음을 보여 주는 핵심 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">mistake A for B(관용 표현)\u003c/span> : mistake + [A] + for + [B] : \"이 쓰레기를 음식으로 착각하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동사구 병렬\u003c/span> : may + [동사원형] ... and + [동사원형] : \"그리고 그것을 삼킬 수도 있습니다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"They may mistake, 동물들은 착각할 수도 있습니다. this trash for food, 이 쓰레기를 음식으로. and swallow it, 그리고 그것을 삼킬 수도 있습니다. 이 문장 전체를 해석하면, 동물들은 이 쓰레기를 음식으로 착각하여 삼킬 수도 있습니다.","hl":"m"},{"n":37,"text":"동물이 쓰레기를 음식으로 착각해 삼키는 구체적인 위험을 보여 줘요. 앞에서 말한 입으로 시험하는 습성이 실제 사고로 이어질 수 있다는 점을 강조하는 핵심 문장이에요.","hl":"mn"},{"n":38,"text":"첫 번째로 mistake this trash for food는 A를 B로 착각한다는 관용 표현이고, for가 '~로'라는 전환의 의미를 담아요. 두 번째로 mistake와 swallow는 and로 병렬 연결되어 같은 조동사 may의 지배를 받고, 그래서 둘 다 동사원형으로 쓰여요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이\u003c/span>\u003cspan class=\"en\">It\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~하게 만들 수 있습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">them \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매우 아프게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">very \u003c/span>\u003cspan class=\"tgt\">sick\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것이 그들을 매우 아프게 할 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 동물들이 쓰레기를 먹이로 착각해 삼킬 수 있다고 했죠. 여기서 \u003cb class=\"key\">It\u003c/b>은 그렇게 쓰레기를 삼키는 상황 전체를 가리키고, 그 일이 동물들을 \u003cb class=\"key\">아프게\u003c/b> 만들 수 있다는 뜻입니다. \u003cb class=\"key\">make\u003c/b>를 이용한 5형식 구문으로 원인과 결과를 간결하게 연결한 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 can + 동사원형\u003c/span> : [조동사 can] + [동사원형 make] : \"~하게 만들 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">5형식 (make + 목적어 + 목적격 보어)\u003c/span> : make + [목적어 them] + [목적격 보어 very sick] : \"그들을 매우 아프게 만들다\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"It, 그것이. can make, ~하게 만들 수 있습니다. them, 그들을. very sick, 매우 아프게. 이 문장 전체를 해석하면, 그것이 그들을 매우 아프게 할 수 있습니다.","hl":"m"},{"n":40,"text":"앞에서 동물들이 쓰레기를 먹이로 착각해서 삼킬 수 있다고 했죠. 여기서 It은 바로 그 상황, 그러니까 쓰레기를 삼키는 일을 가리켜요. 그런 일이 동물들을 아프게 만들 수 있다는 뜻입니다.","hl":"mn"},{"n":41,"text":"첫 번째로 can make를 보세요. 조동사 can 뒤에는 항상 동사원형이 오기 때문에 makes가 아니라 make를 씁니다. 두 번째로 make them very sick은 make가 목적어와 목적격 보어를 데리고 가는 구조예요. them이 목적어, very sick이 목적격 보어로서 그들을 매우 아프게 만든다는 의미를 완성하죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러므로\u003c/span>\u003cspan class=\"en\">So,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">건강을 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">health \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 사랑스러운 동물들의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">lovely \u003c/span>\u003cspan class=\"tgt\">animals\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">학생들은 쓰레기를 버리면 안 됩니다\u003c/span>\u003cspan class=\"en\">students \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">should \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">throw\u003c/span> waste\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">동물원에\u003c/span>\u003cspan class=\"en\">in the zoo.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러므로 우리의 사랑스러운 동물들의 건강을 위해 학생들이 동물원에 쓰레기를 버리면 안 됩니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 쓰레기가 동물들을 아프게 할 수 있다는 이유를 댔으니, 여기서는 \u003cb class=\"key\">So\u003c/b>로 결론을 이끌어 냅니다. 사랑스러운 동물들의 건강을 위해 학생들이 동물원에 쓰레기를 버리지 말아야 한다는 당부이며, 이 편지의 요청을 한 문장으로 정리한 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">문장\u003c/b>이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 for(목적) + 전치사 of(소유)\u003c/span> : for + [명사 the health] + of + [명사 our lovely animals] : \"우리의 사랑스러운 동물들의 건강을 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 should + not (금지)\u003c/span> : [조동사 should] + not + [동사원형 throw] : \"버리면 안 된다\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"So, 그러므로. for the health, 건강을 위해. of our lovely animals, 우리의 사랑스러운 동물들의. students should not throw waste, 학생들은 쓰레기를 버리면 안 됩니다. in the zoo, 동물원에. 이 문장 전체를 해석하면, 그러므로 우리의 사랑스러운 동물들의 건강을 위해 학생들이 동물원에 쓰레기를 버리면 안 됩니다.","hl":"m"},{"n":43,"text":"앞에서 쓰레기가 동물들을 아프게 할 수 있다고 했으니, 여기서는 So로 결론을 이끌어요. 사랑스러운 동물들의 건강을 위해서 학생들이 동물원에 쓰레기를 버리지 말아야 한다는 당부입니다. 이 문장이 편지의 요청을 한 문장으로 정리한 핵심 문장이에요.","hl":"mn"},{"n":44,"text":"첫 번째, for the health of our lovely animals에서 for는 목적을 나타내고 of는 소유를 나타내는 전치사예요. 누구의 무엇을 위해서인지 두 전치사구가 겹쳐서 표현하고 있죠. 두 번째, should not throw에서 should는 당위를 나타내는 조동사이고 not이 붙으면 금지의 의미가 됩니다. 조동사 뒤이기 때문에 throw는 동사원형으로 씁니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 당신에게 감사합니다\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">thank \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신의 협조에 대해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">cooperation\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">협조해 주셔서 감사합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 부탁을 전달한 뒤 편지를 맺는 인사말이에요. thank you for로 감사의 \u003cb class=\"key\">이유\u003c/b>를 붙여, 학생들을 잘 지도해 주실 것에 대한 감사를 정중하게 표현합니다. 요청과 당부로 이어진 글을 부드럽게 마무리하는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">thank + 목적어 + for + 명사 (감사의 이유)\u003c/span> : thank + [목적어 you] + for + [명사 your cooperation] : \"당신의 협조에 대해 감사하다\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"I thank you, 나는 당신에게 감사합니다. for your cooperation, 당신의 협조에 대해. 이 문장 전체를 해석하면, 협조해 주셔서 감사합니다.","hl":"m"},{"n":46,"text":"부탁을 전달한 뒤 편지를 맺는 인사말이에요. thank you for로 감사의 이유를 붙여, 학생들을 잘 지도해 주실 것에 대한 감사를 표현합니다.","hl":"mn"},{"n":47,"text":"thank는 목적어를 데리고 가는 타동사예요. 그래서 thank you처럼 감사하는 대상을 먼저 두고, for your cooperation으로 감사의 이유를 전치사 for 뒤에 붙입니다. 이렇게 thank somebody for something 형태를 통째로 익혀 두면 좋아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">진심을 담아\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Sincerely,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Danna Smith\u003c/span>\u003cspan class=\"en\">Danna Smith\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Danna Smith 드림\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 편지를 마무리하며 보내는 사람의 이름을 밝히는 부분이에요. Sincerely는 편지 끝에서 \u003cb class=\"key\">정중한 \u003c/b>\u003cb class=\"key\">인사\u003c/b>를 전하는 \u003cb class=\"key\">맺음말\u003c/b>이고, 뒤의 Danna Smith는 이 편지를 쓴 \u003cb class=\"key\">보낸 \u003c/b>\u003cb class=\"key\">사람\u003c/b>의 이름이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">편지의 맺음말 표현\u003c/span> : Sincerely, + [보낸 사람의 서명] : \"진심을 담아\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"Sincerely, 진심을 담아. Danna Smith, Danna Smith. 이 문장 전체를 해석하면, Danna Smith 드림","hl":"m"},{"n":49,"text":"이 문장은 편지의 끝에서 정중한 인사를 전하는 맺음말이에요. 뒤에 오는 Danna Smith는 이 편지를 보낸 사람의 이름을 밝히는 서명이죠. 그래서 한국어 편지의 드림처럼 자연스럽게 마무리하는 역할을 해요.","hl":"mn"},{"n":50,"text":"어법 포인트는 편지의 맺음말 표현이에요. Sincerely, 뒤에는 보낸 사람의 서명이 이어지는 구조로 쓰여요. 여기서는 Danna Smith가 보낸 사람의 이름을 나타내는 서명이에요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>Fun&amp;Joy 동물원의 \u003cb class=\"key\">관광 \u003c/b>\u003cb class=\"key\">안내원\u003c/b> Danna Smith가 현장 학습을 앞둔 강 선생님께 편지를 보낸다.\u003c/li>\u003cli>그녀는 학생들이 동물원에 \u003cb class=\"key\">쓰레기\u003c/b>를 버리지 않도록 방문 전에 지도해 달라고 부탁한다.\u003c/li>\u003cli>비닐봉지와 쓰레기는 동물에게 \u003cb class=\"key\">해로울\u003c/b> 수 있고, 동물이 이를 음식으로 착각해 삼키면 병이 들 수 있다.\u003c/li>\u003cli>쓰레기통이 곳곳에 마련되어 있으니 동물들의 \u003cb class=\"key\">건강\u003c/b>을 위해 협조해 달라는 것이 글의 결론이다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>A zoo tour guide asks a teacher to tell his students not to throw waste in the zoo, because trash can harm the animals that mistake it for food.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">Fun&amp;Joy 동물원의 관광 안내원 Danna Smith가 현장 학습을 앞둔 강 선생님께 학생들이 동물원에 \u003cb class=\"key\">쓰레기\u003c/b>를 버리지 않도록 미리 지도해 달라고 부탁한다. 동물들이 \u003cb class=\"key\">쓰레기\u003c/b>를 음식으로 착각해 삼키면 매우 아플 수 있기 때문이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":51,"text":"오늘 글의 핵심은 결국 하나예요. 동물들이 쓰레기를 음식으로 착각하면 건강을 다칠 수 있으니, 쓰레기는 꼭 쓰레기통에 버리자는 것. 그리고 편지에서 부탁이 먼저 나오고 근거가 뒤따르는 두괄식 구조도 꼭 챙겨 두세요. 그럼 오늘 수업은 여기까지예요. 수고했어요, 여러분.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
