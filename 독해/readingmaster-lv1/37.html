<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터1 Reading 37 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터1 Reading 37","audioDir":"37_audio","preview":false,"count":87,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.668em\">Reading\u003cbr>37\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터1\u003c/div>\u003ch1>What Is Your Learning Style?\u003c/h1>\u003ch2>당신의 학습 스타일은 무엇인가요?\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>무언가를 배우는 데 중요한 요소는 여러 가지지만, \u003cb class=\"key\">학습 \u003c/b>\u003cb class=\"key\">스타일\u003c/b>은 자신이 가장 잘 배우는 방법을 알려 준다. 새로운 보드게임을 배울 때의 \u003cb class=\"key\">행동\u003c/b>으로 학습 스타일을 파악할 수 있으며, \u003cb class=\"key\">시각적 \u003c/b>\u003cb class=\"key\">학습\u003c/b>·소리 중심 학습·몸을 쓰는 학습 중 자신의 유형을 \u003cb class=\"key\">이해\u003c/b>하고 활용하면 더 \u003cb class=\"key\">효율적\u003c/b>으로 배울 수 있다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Knowing your own learning style helps you learn more effectively and use the best way for you.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 학습 스타일에 관한 글을 함께 읽어 볼게요. 이 글은 무언가를 배울 때 중요한 것이 무엇인지 묻고, 학습 스타일이 가장 잘 배우는 방법을 알려 준다고 말해요. 글의 핵심은 자신의 학습 스타일을 이해하고 활용하면 더 효율적으로 배울 수 있다는 것이고, 시각적 학습을 비롯한 세 가지 유형을 소개합니다. 이제 차근차근 흐름을 따라가 볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">사람마다 정보를 받아들이고 기억하는 방식이 조금씩 달라요. 교육심리학에서는 이를 \u003cb class=\"key\">학습 \u003c/b>\u003cb class=\"key\">스타일\u003c/b>(learning style)이라고 부르며, 대표적으로 \u003cb class=\"key\">VARK \u003c/b>\u003cb class=\"key\">모델\u003c/b>(VARK model)이 널리 알려져 있어요. VARK 모델은 \u003cb class=\"key\">시각적 \u003c/b>\u003cb class=\"key\">학습\u003c/b>(visual learning), \u003cb class=\"key\">청각적 \u003c/b>\u003cb class=\"key\">학습\u003c/b>(auditory learning), 읽기·쓰기 학습, \u003cb class=\"key\">운동 \u003c/b>\u003cb class=\"key\">감각적 \u003c/b>\u003cb class=\"key\">학습\u003c/b>(kinesthetic learning)으로 학습자를 나누어요. 예를 들어 요리법을 배울 때 어떤 사람은 사진과 도표를 보고, 어떤 사람은 설명을 듣고, 또 어떤 사람은 직접 해 보면서 익혀요. 이처럼 자신에게 맞는 통로를 알면 같은 시간을 공부해도 \u003cb class=\"key\">효율적\u003c/b>(effective)으로 배울 수 있어요. 물론 한 사람이 한 유형만 쓰는 것은 아니고 상황에 따라 여러 방식을 함께 사용할 수 있어요.\u003c/div>","segs":[{"n":2,"text":"사람마다 정보를 받아들이고 기억하는 방식이 조금씩 달라요. 교육심리학에서는 이것을 학습 스타일이라고 부르고, 대표적으로 VARK 모델을 많이 이야기해요. VARK 모델은 시각적 학습, 청각적 학습, 읽기와 쓰기 학습, 운동 감각적 학습으로 학습자를 나누어요. 예를 들어 요리법을 배울 때 어떤 사람은 사진과 도표를 보고, 어떤 사람은 설명을 듣고, 또 어떤 사람은 직접 해 보면서 익혀요. 이렇게 자신에게 맞는 방식을 알면 같은 시간을 공부해도 더 효율적으로 배울 수 있어요. 물론 한 사람이 한 유형만 쓰는 것은 아니고 상황에 따라 여러 방식을 함께 사용할 수 있어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>배움의 출발점\u003csmall>도입·전환 · 문장 1–6\u003c/small>\u003c/h4>\u003cp>무언가를 배우는 데 중요한 것이 높은 IQ인지, 좋은 선생님인지, 충분한 공부 시간인지 \u003cb class=\"key\">질문\u003c/b>을 던진다. 이 요소들은 모두 관련이 있지만, 글은 학습 스타일이 가장 잘 배우는 방법에 대한 \u003cb class=\"key\">정답\u003c/b>을 준다고 말한다. 즉 \u003cb class=\"key\">학습 \u003c/b>\u003cb class=\"key\">스타일\u003c/b>이 배움의 방향을 잡아 준다는 점을 강조하며 본론으로 넘어간다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>스스로 알아보기\u003csmall>질문·예시 · 문장 7–12\u003c/small>\u003c/h4>\u003cp>자신의 학습 스타일을 찾기 위한 \u003cb class=\"key\">간단한 \u003c/b>\u003cb class=\"key\">질문\u003c/b>으로 새로운 보드게임을 배우는 상황을 제시한다. 설명서를 읽고 메모하기, 다른 사람의 설명을 듣고 질문하기, 남이 하는 것을 보고 직접 해 보기라는 세 가지 \u003cb class=\"key\">행동\u003c/b>을 보여 준다. 이런 행동이 자신의 \u003cb class=\"key\">학습 \u003c/b>\u003cb class=\"key\">스타일\u003c/b>을 드러낸다는 점을 알려 준다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>세 가지 유형\u003csmall>분류·근거 · 문장 13–22\u003c/small>\u003c/h4>\u003cp>학습 스타일에는 세 가지 유형이 있다고 말한 뒤 각 유형의 특징을 차례로 설명한다. \u003cb class=\"key\">시각적 \u003c/b>\u003cb class=\"key\">학습\u003c/b>은 읽고 필기하며 도표나 그림을 활용하고, \u003cb class=\"key\">소리\u003c/b>에 집중하는 유형은 듣고 말하며 글을 소리 내어 읽는다. 마지막으로 \u003cb class=\"key\">몸\u003c/b>을 사용하는 유형은 움직이거나 \u003cb class=\"key\">역할극\u003c/b>을 통해 배운다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>이해와 활용\u003csmall>결론·주장 · 문장 23–25\u003c/small>\u003c/h4>\u003cp>모든 학생이 자신만의 학습 스타일로 배운다는 점을 정리한다. 자신의 학습 스타일을 아는 것이 더 \u003cb class=\"key\">효율적\u003c/b>으로 배우는 데 도움이 된다고 말한다. 그래서 어떻게 배우는지 이해하고 그것을 가능한 한 많이 \u003cb class=\"key\">활용\u003c/b>하라고 주장한다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 배움의 출발점에서 시작해 자신의 학습 스타일을 알아보는 질문, 세 가지 유형의 분류, 그리고 이해와 활용이라는 결론으로 이어져요.","hl":null},{"n":4,"text":"먼저 첫 부분에서는 무언가를 배우는 데 중요한 것이 높은 IQ인지, 좋은 선생님인지, 충분한 공부 시간인지 질문을 던져요. 그 요소들은 모두 관련이 있지만, 글은 학습 스타일이 가장 잘 배우는 방법에 대한 정답을 준다고 말하죠. 즉 학습 스타일이 배움의 방향을 잡아 준다는 점을 강조하면서 본론으로 넘어갑니다.","hl":"f0"},{"n":5,"text":"다음으로 자신의 학습 스타일을 찾기 위한 간단한 질문으로 새로운 보드게임을 배우는 상황을 제시해요. 설명서를 읽고 메모하기, 다른 사람의 설명을 듣고 질문하기, 남이 하는 것을 보고 직접 해 보기라는 세 가지 행동을 보여 주죠. 이런 행동이 바로 자신의 학습 스타일을 드러낸다는 점을 기억하면 좋아요.","hl":"f1"},{"n":6,"text":"그다음에는 학습 스타일에는 세 가지 유형이 있다고 말한 뒤 각 유형의 특징을 차례로 설명해요. 시각적 학습은 읽고 필기하며 도표나 그림을 활용하고, 소리에 집중하는 유형은 듣고 말하며 글을 소리 내어 읽어요. 마지막으로 몸을 사용하는 유형은 움직이거나 역할극을 통해 배운다고 설명합니다.","hl":"f2"},{"n":7,"text":"마지막 부분에서는 모든 학생이 자신만의 학습 스타일로 배운다는 점을 정리해요. 자신의 학습 스타일을 아는 것이 더 효율적으로 배우는 데 도움이 된다고 말하죠. 그래서 어떻게 배우는지 이해하고 그것을 가능한 한 많이 활용하라고 주장합니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">분류\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 6번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 학습에 중요한 요소들을 \u003cb class=\"key\">질문\u003c/b>으로 던진 뒤, 학습 스타일이 가장 잘 배우는 방법을 알려 준다는 \u003cb class=\"key\">주제문\u003c/b>을 앞부분에 제시한다. 이어 세 가지 유형을 차례로 나누어 설명하는 \u003cb class=\"key\">분류\u003c/b> 구조를 취한다. 마지막에는 자신의 학습 스타일을 이해하고 활용하자는 결론으로 마무리하므로, 중심 내용이 앞에 놓인 \u003cb class=\"key\">두괄식\u003c/b> 구성으로 볼 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>But (6)\u003c/b>\u003cspan>전환·주제 제시\u003c/span>\u003cb>First (9)\u003c/b>\u003cspan>첫 번째 방법 제시\u003c/span>\u003cb>Second (10)\u003c/b>\u003cspan>두 번째 방법 제시\u003c/span>\u003cb>Third (11)\u003c/b>\u003cspan>세 번째 방법 제시\u003c/span>\u003cb>There are three types (13)\u003c/b>\u003cspan>분류 기준 제시\u003c/span>\u003cb>The first type (14)\u003c/b>\u003cspan>첫 번째 유형 제시\u003c/span>\u003cb>The second type (17)\u003c/b>\u003cspan>두 번째 유형 제시\u003c/span>\u003cb>The last type (20)\u003c/b>\u003cspan>마지막 유형 제시\u003c/span>\u003cb>So (25)\u003c/b>\u003cspan>결론·당부\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">learning style\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">how you can learn best\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">your own learning style\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">your own actions can show your learning style\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">learn more effectively\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 분류예요. 앞부분에서 학습에 중요한 요소들을 질문으로 던진 뒤, 학습 스타일이 가장 잘 배우는 방법을 알려 준다는 주제문을 비교적 이른 곳에 제시하죠. 그다음 세 가지 유형을 차례로 나누어 설명하고 마지막에 결론을 붙이기 때문에 전체 구조는 두괄식으로 볼 수 있어요.","hl":"ty"},{"n":9,"text":"신호어를 보면 여섯 번째 문장의 But이 앞의 질문들을 전환하며 주제를 제시해요. 이어서 First, Second, Third가 세 가지 행동을 순서대로 배열하고, There are three types와 The first type, The second type, The last type이 유형 분류를 분명히 표시하죠. 같은 개념이 learning style, how you can learn best, learn more effectively처럼 반복되며 재진술되는 점도 눈여겨보세요. 마지막의 So는 결론과 당부로 글을 묶어 줍니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>important\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>중요한\u003c/span>\u003c/div>\u003cdiv>\u003cb>learning\u003c/b>\u003cem>명사\u003c/em>\u003cspan>학습, 배움\u003c/span>\u003c/div>\u003cdiv>\u003cb>enough\u003c/b>\u003cem>형용사\u003c/em>\u003cs unhelpful, harmful과 반대예요. focus on은 concentrate on, center on, pay attention to와 비슷하고 ignore, neglect와 반대이며, effectively는 efficiently, successfully, productively와 가깝고 ineffectively, poorly와 반대예요, 그리고 understand는 comprehend, grasp, realize와 가깝고 misunderstand, confuse와 반대라는 점도 기억해 주세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 25\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무엇인가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">What \u003c/span>\u003cspan class=\"tgt\">is\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">중요한 것\u003c/span>\u003cspan class=\"en\">an important thing\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무언가를 배우는 데 있어서?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">learning \u003c/span>\u003cspan class=\"tgt\">something\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">무언가를 배우는 데 있어 중요한 것은 무엇인가?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 '무언가를 배울 때 중요한 것'이 무엇인지 묻는 \u003cb class=\"key\">도입 \u003c/b>\u003cb class=\"key\">질문\u003c/b>이에요. 뒤에서 높은 IQ, 좋은 선생님, 충분한 공부 시간 같은 답을 나열하며 \u003cb class=\"key\">학습 \u003c/b>\u003cb class=\"key\">스타일\u003c/b> 이야기로 이끌어 가는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문사가 이끄는 의문문\u003c/span> : What + be동사 + 주어? : \"무엇인가\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 in + 동명사\u003c/span> : in + [동명사 learning + 목적어 something] : \"무언가를 배우는 데 있어서\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"What is, 무엇인가. an important thing, 중요한 것. in learning something?, 무언가를 배우는 데 있어서?. 이 문장 전체를 해석하면, 무언가를 배우는 데 있어 중요한 것은 무엇인가?","hl":"m"},{"n":13,"text":"이 문장은 무언가를 배울 때 중요한 것이 무엇인지 묻는 도입 질문이에요. 뒤에서 높은 IQ, 좋은 선생님, 충분한 공부 시간 같은 답을 나열하면서 학습 스타일 이야기로 이끌어 가는 역할을 해요.","hl":"mn"},{"n":14,"text":"첫 번째로 What is는 의문사 What이 앞에 오고 be동사 is가 주어 앞에 놓인 의문문이에요. 무엇이 중요한지 주어를 묻는 형태죠. 두 번째로 in learning something에서 전치사 in 뒤에 동명사 learning이 와서 무언가를 배우는 데 있어서라는 전치사구를 만들어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 25\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">높은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">High \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">IQ?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">IQ\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">높은 IQ?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 높은 IQ를 중요한 \u003cb class=\"key\">학습 \u003c/b>\u003cb class=\"key\">요소\u003c/b> 후보로 제시하는 짧은 질문이에요. 바로 뒤의 '좋은 선생님', '충분한 공부 시간'과 함께 여러 \u003cb class=\"key\">후보\u003c/b>를 나열하는 흐름을 만들어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사가 생략된 명사구 의문문\u003c/span> : [형용사 High] + [명사 IQ] (+ 생략된 be동사) : \"높은 IQ?\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"High, 높은. IQ?, IQ?. 이 문장 전체를 해석하면, 높은 IQ?","hl":"m"},{"n":16,"text":"높은 IQ를 중요한 학습 요소 후보로 제시하는 짧은 질문이에요. 바로 뒤의 좋은 선생님, 충분한 공부 시간과 함께 여러 후보를 나열하는 흐름을 만들어요.","hl":"mn"},{"n":17,"text":"High IQ?는 동사 없이 명사구만 남긴 생략 표현이에요. 앞의 질문에 대한 답 후보를 되묻는 구어체 질문으로 볼 수 있죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 25\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">좋은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">A \u003c/span>\u003cspan class=\"tgt\">good \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">선생님?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">teacher\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">좋은 선생님?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 좋은 선생님도 중요한 \u003cb class=\"key\">후보\u003c/b>인지 묻는 표현이에요. 앞의 높은 IQ와 함께 학습에 영향을 주는 여러 \u003cb class=\"key\">학습 \u003c/b>\u003cb class=\"key\">요소\u003c/b>를 나열하며 독자의 생각을 넓혀 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">형용사의 명사 수식\u003c/span> : [한정사 A] + [형용사 good] + [명사 teacher] : \"좋은 선생님?\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"A good, 좋은. teacher?, 선생님?. 이 문장 전체를 해석하면, 좋은 선생님?","hl":"m"},{"n":19,"text":"좋은 선생님도 중요한 후보인지 묻는 표현이에요. 앞의 높은 IQ와 함께 학습에 영향을 주는 여러 학습 요소를 나열하며 독자의 생각을 넓혀 줘요.","hl":"mn"},{"n":20,"text":"A good teacher?에서 형용사 good이 명사 teacher 앞에서 명사를 꾸며 줘요. 그래서 좋은 선생님이라는 명사구가 되고, 동사가 생략된 짧은 질문 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 25\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">충분한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Enough \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공부 시간?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">study \u003c/span>\u003cspan class=\"tgt\">time?\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">충분한 공부 시간?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 학습에 중요한 것들을 나열하다가 마지막 항목만 다시 툭 던지는 \u003cb class=\"key\">짧은 \u003c/b>\u003cb class=\"key\">의문문\u003c/b>이에요. 실제로 대답을 요구하는 질문이라기보다 앞의 항목들과 \u003cb class=\"key\">병렬\u003c/b>을 이루며 '이것도 중요하지 않을까?' 하고 되짚는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">생략 구문(주어·동사 생략)\u003c/span> : [주어+동사 생략] + [핵심 어구만 남긴 의문문] : \"충분한 공부 시간?\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">복합명사(명사 + 명사)\u003c/span> : [명사 study] + [명사 time] → 하나의 명사구 : \"공부 시간\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Enough, 충분한. study time?, 공부 시간?. 이 문장 전체를 해석하면, 충분한 공부 시간?","hl":"m"},{"n":22,"text":"이 문장은 실제로 대답을 요구하는 질문이 아니라 앞에 나온 항목들을 이어 주는 짧은 의문문이에요. 아이큐, 좋은 선생님, 충분한 공부 시간이 병렬로 나열되는 흐름의 마지막 고리라고 보면 됩니다.","hl":"mn"},{"n":23,"text":"여기서는 주어와 동사가 통째로 생략됐어요. 앞 문맥만 봐도 뜻이 분명하기 때문에 핵심 어구만 남긴 생략 구문인 거죠. 그리고 study time은 명사 두 개가 붙어 앞의 명사가 뒤의 명사를 수식하는 복합명사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 25\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들은\u003c/span>\u003cspan class=\"en\">They\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모두 ~이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">all \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">관련이 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">related\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것들 모두 관련이 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> '그것들'은 앞에 나온 High IQ, 좋은 선생님, 충분한 공부 시간을 가리켜요. 세 가지가 따로가 아니라 \u003cb class=\"key\">모두 \u003c/b>\u003cb class=\"key\">관련\u003c/b>이 있다는 것을 인정하면서, 다음 문장에서 '그러나'로 \u003cb class=\"key\">학습 \u003c/b>\u003cb class=\"key\">스타일\u003c/b>이라는 새 화제를 꺼내기 위한 디딤돌 역할을 하는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태(be동사 + 과거분사)\u003c/span> : [be동사 are] + [부사 all] + [과거분사 related] : \"모두 관련이 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부사 all의 위치\u003c/span> : [be동사] + [all] + [과거분사] : \"모두 ~이다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"They, 그것들은. are all, 모두 ~이다. related, 관련이 있는. 이 문장 전체를 해석하면, 그것들 모두 관련이 있다.","hl":"m"},{"n":25,"text":"They는 앞에 나온 High IQ, 좋은 선생님, 충분한 공부 시간을 가리켜요. 세 가지가 모두 관련이 있다는 걸 인정하면서, 다음 문장에서 학습 스타일이라는 새 화제를 꺼내기 위한 디딤돌 역할을 합니다.","hl":"mn"},{"n":26,"text":"are related는 be동사에 과거분사가 붙은 수동태로, 그것들이 서로 이어져 있는 상태를 나타내요. 그리고 all은 be동사 뒤에 놓여서 모두가 관련이 있다는 강조의 뜻을 만들어 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 25\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나\u003c/span>\u003cspan class=\"en\">But\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">학습 스타일은\u003c/span>\u003cspan class=\"en\">a learning style\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분에게 정답을 제공한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">gives \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">answer\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분이 가장 잘 배울 수 있는 방법에 대한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">learn \u003c/span>\u003cspan class=\"tgt\">best\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 학습 스타일은 여러분이 가장 잘 배울 수 있는 방법에 대한 정답을 제공한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞의 요소들이 다 중요하지만, '어떻게 하면 가장 잘 an class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">간단한 질문이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">simple \u003c/span>\u003cspan class=\"tgt\">question\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여러분 자신의 학습 스타일을 파악하기 위한 간단한 질문이 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 학습에 중요한 것이 무엇인지 여러 가지를 나열한 뒤, 이제 그것들을 아우르는 \u003cb class=\"key\">학습 \u003c/b>\u003cb class=\"key\">스타일\u003c/b>이라는 개념으로 화제를 좁히는 문장입니다. 스타일을 알기 위해 복잡한 검사가 필요 없다는 뜻에서 \u003cb class=\"key\">간단한 \u003c/b>\u003cb class=\"key\">질문\u003c/b> 하나를 제안하며 다음 문장의 예시를 예고합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : To find + [목적어] (to부정사구 / 문장 전체를 수식하는 부사구) : \"여러분 자신의 학습 스타일을 파악하기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">유도부사 there 구문\u003c/span> : There + be동사 + [주어] (주어가 뒤에 오는 유도 구문) : \"간단한 질문이 있다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"To find your own learning style, 여러분 자신의 학습 스타일을 파악하기 위해. there is, 있습니다. a simple question, 간단한 질문이. 이 문장 전체를 해석하면, 여러분 자신의 학습 스타일을 파악하기 위한 간단한 질문이 있다.","hl":"m"},{"n":31,"text":"앞에서 학습에 중요한 요소들을 쭉 나열했죠. 이제 그 모든 걸 아우르는 게 학습 스타일이라는 걸 말하면서, 스타일을 아는 방법은 의외로 간단하다고 화제를 돌리는 문장이에요. 그래서 간단한 질문 하나를 던지겠다고 예고하는 겁니다.","hl":"mn"},{"n":32,"text":"첫 번째 포인트는 to부정사의 부사적 용법이에요. To find는 목적을 나타내서 여러분 자신의 학습 스타일을 파악하기 위해라고 해석합니다. 두 번째 포인트는 유도부사 there 구문이에요. there is a simple question은 간단한 질문이 있다라는 뜻이고, 진짜 주어는 뒤에 있는 a simple question이라는 것도 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 25\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 여러분이 배우고 싶다면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">If \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">want \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">learn\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새로운 보드게임을 하는 법을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">play \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">new \u003c/span>\u003cspan class=\"tgt\">board \u003c/span>\u003cspan class=\"tgt\">game\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떻게 하겠는가?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">do\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">새로운 보드게임을 하는 법을 배우고 싶다면, 어떻게 하겠는가?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 독자에게 상황을 던져 스스로를 돌아보게 만드는 \u003cb class=\"key\">질문\u003c/b> 문장입니다. 보드게임이라는 익숙한 소재로 '배우는 상황'을 구체화해, 뒤에 나올 세 가지 행동 예시의 \u003cb class=\"key\">도입\u003c/b> 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조건을 나타내는 if 부사절\u003c/span> : If + [주어] + [동사] , [주절] (조건의 부사절) : \"만약 여러분이 배우고 싶다면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">의문사 + to부정사 (간접의문문의 축약)\u003c/span> : learn + how to + [동사원형] (의문사구가 타동사의 목적어) : \"새로운 보드게임을 하는 법을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">의문사가 이끄는 의문문\u003c/span> : [의문사] + [조동사] + [주어] + [동사원형]? : \"여러분은 어떻게 하겠는가?\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"If you want to learn, 만약 여러분이 배우고 싶다면. how to play a new board game, 새로운 보드게임을 하는 법을. what will you do?, 어떻게 하겠는가?. 이 문장 전체를 해석하면, 새로운 보드게임을 하는 법을 배우고 싶다면, 어떻게 하겠는가?","hl":"m"},{"n":34,"text":"독자한테 상황을 하나 던지는 질문 문장이에요. 보드게임이라는 익숙한 예시를 들어서 배우는 상황을 구체적으로 그려 보게 만들죠. 이 질문이 바로 뒤에 나오는 세 가지 행동 예시를 이끄는 도입 역할을 합니다.","hl":"mn"},{"n":35,"text":"첫 번째는 if 조건 부사절이에요. 만약 여러분이 배우고 싶다면이라는 조건을 붙여 주고, 부사절에서는 미래라도 will을 쓰지 않고 현재시제를 쓴다는 점을 기억하세요. 두 번째는 의문사에 to부정사가 붙은 의문사구예요. how to play a new board game은 새로운 보드게임을 하는 법이라는 명사구가 되어서 learn의 목적어 자리에 들어갑니다. 세 번째는 의문사가 이끄는 의문문이에요. what이 앞으로 나가고 조동사 will이 주어 앞으로 도치된 구조죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 25\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">첫째로\u003c/span>\u003cspan class=\"en\">First,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은 설명서를 잘 읽을 수 있다\u003c/span>\u003cspan class=\"en\">you \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">read \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">manual \u003c/span>\u003cspan class=\"tgt\">carefully \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 메모를 할 수 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">take \u003c/span>\u003cspan class=\"tgt\">notes\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">첫째, 설명서를 잘 읽고 메모할 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞의 질문에 대한 첫 번째 답으로, 눈으로 읽고 기록하는 \u003cb class=\"key\">행동 \u003c/b>\u003cb class=\"key\">예시\u003c/b>를 제시합니다. 이 예시는 뒤에 나올 시각형 학습 스타일의 특징과 자연스럽게 이어지도록 배치된 \u003cb class=\"key\">도입 \u003c/b>\u003cb class=\"key\">사례\u003c/b>입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 can (가능·선택)\u003c/span> : [주어] + can + [동사원형] (~할 수 있다) : \"읽을 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동사원형 병렬 구조\u003c/span> : can + [동사원형 A] + and + [동사원형 B] : \"설명서를 잘 읽고 메모하다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"First, 첫째로. you can read the manual carefully, 여러분은 설명서를 잘 읽을 수 있다. and take notes, 그리고 메모를 할 수 있다. 이 문장 전체를 해석하면, 첫째, 설명서를 잘 읽고 메모할 수 있다.","hl":"m"},{"n":37,"text":"앞에서 던진 질문에 대한 첫 번째 답이에요. 눈으로 읽고 기록으로 남기는 행동 예시를 보여 주죠. 이 사례는 뒤에 나오는 시각형 학습 스타일을 미리 보여 주는 도입 사례로 봐도 좋습니다.","hl":"mn"},{"n":38,"text":"첫 번째 포인트는 조동사 can이에요. 어떤 방법을 선택할 수 있다는 가능을 부드럽게 말해 주고, 조동사 뒤에는 반드시 동사원형이 온다는 규칙을 기억하세요. 두 번째 포인트는 병렬 구조예요. can 하나 뒤에 read와 take가 and로 나란히 연결되어 있으니, 형태를 똑같이 동사원형으로 맞춰 준 겁니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 25\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">둘째,\u003c/span>\u003cspan class=\"en\">Second,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은 들을 수 있다\u003c/span>\u003cspan class=\"en\">you \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">listen \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 사람의 설명을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">others' \u003c/span>\u003cspan class=\"tgt\">explanations \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 질문할 수 있다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">ask \u003c/span>\u003cspan class=\"tgt\">questions\u003c/span>.\u003c/spa ">others \u003c/span>\u003cspan class=\"tgt\">play \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 직접 해 볼 수 있다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">try \u003c/span>\u003cspan class=\"tgt\">it\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">yourself\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">셋째, 다른 사람들이 놀이하는 것을 보고 직접 해 볼 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에 이어지는 \u003cb class=\"key\">셋째 \u003c/b>\u003cb class=\"key\">예시\u003c/b>예요. 남이 하는 모습을 눈으로 보고 몸으로 따라 해 보는 행동이 \u003cb class=\"key\">보고 \u003c/b>\u003cb class=\"key\">움직이는\u003c/b> 학습 스타일을 드러낸다는 뜻이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지각동사 + 목적어 + 원형부정사\u003c/span> : watch + [목적어] + [동사원형] : \"다른 사람들이 놀이하는 것을 보다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">병렬 구조(and)\u003c/span> : can + [동사원형 A] + and + [동사원형 B] : \"보고 해 보다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">재귀대명사(강조 용법)\u003c/span> : [동사구] + [재귀대명사] : \"직접, 스스로\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"Third, 셋째. you can watch, 여러분은 지켜볼 수 있다. others play, 다른 사람들이 놀이하는 것을. and try it yourself, 그리고 직접 해 볼 수 있다.. 이 문장 전체를 해석하면, 셋째, 다른 사람들이 놀이하는 것을 보고 직접 해 볼 수 있다.","hl":"m"},{"n":43,"text":"이 문장은 앞에 이어지는 셋째 예시예요. 다른 사람이 노는 모습을 눈으로 지켜보고 자기가 직접 해 보는 행동 속에 보고 움직이는 학습 스타일이 담겨 있다는 뜻이죠.","hl":"mn"},{"n":44,"text":"첫 번째, watch는 지각동사라서 목적어 뒤에 동사원형 play가 와요. 두 번째, yourself는 재귀대명사로 여기서는 직접이라는 뜻을 강조해요. 세 번째, watch와 try가 and로 병렬 연결되어 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 25\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분만의 행동은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Your \u003c/span>\u003cspan class=\"tgt\">own \u003c/span>\u003cspan class=\"tgt\">actions\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보여 줄 수 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">show\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분의 학습 스타일을\u003c/span>\u003cspan class=\"en\">your learning style.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여러분만의 행동은 여러분의 학습 스타일을 보여 줄 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 든 세 가지 예시를 하나로 묶어 주는 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">문장\u003c/b>이에요. 여러분이 게임을 배울 때 무엇을 먼저 하는지가 곧 여러분의 \u003cb class=\"key\">학습 \u003c/b>\u003cb class=\"key\">스타일\u003c/b>을 알려 준다는 뜻이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">소유격 + own (강조)\u003c/span> : [소유격] + own + [명사] : \"여러분만의 행동\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 can + 동사원형\u003c/span> : [주어] + can + [동사원형] : \"보여 줄 수 있다\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"Your own actions, 여러분만의 행동은. can show, 보여 줄 수 있다. your learning style, 여러분의 학습 스타일을. 이 문장 전체를 해석하면, 여러분만의 행동은 여러분의 학습 스타일을 보여 줄 수 있다.","hl":"m"},{"n":46,"text":"이 문장은 앞에서 든 예시들을 하나로 묶어 주는 핵심 문장이에요. 게임을 배울 때 무엇을 먼저 하는지가 바로 여러분의 학습 스타일을 알려 준다는 뜻이죠.","hl":"mn"},{"n":47,"text":"첫 번째, own은 소유격 뒤에 붙어 여러분만의라는 뜻을 강조해요. 두 번째, 조동사 can은 가능의 의미를 더하고 뒤에 동사원형 show가 와요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 25\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세 가지 유형이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">three \u003c/span>\u003cspan class=\"tgt\">types \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">학습 스타일의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">learning \u003c/span>\u003cspan class=\"tgt\">styles\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">학습 스타일에는 세 가지 유형이 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 학습 스타일을 찾는 간단한 질문까지 던진 뒤, 본론으로 들어가 \u003cb class=\"key\">주제\u003c/b>를 못 박는 문장이에요. 뒤에서 시각적·청각적·신체적 유형을 차례로 설명하니, 이 문장은 글의 \u003cb class=\"key\">전체 \u003c/b>\u003cb class=\"key\">구조\u003c/b>를 여는 신호탄이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">There are 구문(존재 표현)\u003c/span> : There are + [복수명사] (~이 있다) : \"학습 스타일에는 세 가지 유형이 있다\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"There are, 있다. three types, 세 가지 유형이. of learning styles, 학습 스타일의. 이 문장 전체를 해석하면, 학습 스타일에는 세 가지 유형이 있다.","hl":"m"},{"n":49,"text":"앞에서 학습 스타일을 찾는 간단한 질문까지 이야기했죠. 이제 본론으로 들어와서 학습 스타일에는 세 가지 유형이 있다고 주제를 딱 제시하는 문장이에요. 뒤에 나올 시각적, 청각적, 신체적 유형 설명의 전체 구조를 여는 신호탄이라고 보면 됩니다.","hl":"mn"},{"n":50,"text":"첫 번째 포인트는 There are 구문이에요. 무엇이 존재한다는 걸 소개할 때 There are 뒤에 진짜 주어를 놓는다고 배웠죠. 여기서는 진짜 주어인 three types가 복수라서 동사 수를 are로 맞춘 거예요. 두 번째 포인트는 of learning styles인데요, of가 앞의 three types를 뒤에서 설명해 주니까 '학습 스타일의 세 가지 유형'이라고 자연스럽게 해석하면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 25\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">첫 번째 유형은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">The \u003c/span>\u003cspan class=\"tgt\">first \u003c/span>\u003cspan class=\"tgt\">type\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시각적 학습\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">visual \u003c/span>\u003cspan class=\"tgt\">learning\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">첫 번째 유형은 시각적 학습이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 세 가지 유형이 있다고 했으니, 그중 맨 앞의 유형에 이름표를 붙이는 문장이에요. '첫 번째 유형은 시각적 학습'이라고 \u003cb class=\"key\">정의\u003c/b>해 주면서, 다음 문장에서 그 특징을 풀어 낼 \u003cb class=\"key\">발판\u003c/b>을 마련해 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">정관사 the + 서수\u003c/span> : [the + 서수 + 명사] (첫 번째 ~) : \"첫 번째 유형은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">2형식 문장(주어 + be동사 + 주격보어)\u003c/span> : [The first type] + [is] + [visual learning (주격보어)] : \"시각적 학습이다\"\u003c/div>\u003c/div>","segs":[{"n":51,"text":"The first type, 첫 번째 유형은. is, 이다. visual learning, 시각적 학습. 이 문장 전체를 해석하면, 첫 번째 유형은 시각적 학습이다.","hl":"m"},{"n":52,"text":"앞 문장에서 세 가지 유형이 있다고 했으니, 이제 그중 첫 번째를 소개하는 문장이에요. 첫 번째 유형은 바로 시각적 학습이라고 이름을 붙여 주는 역할을 하죠.","hl":"mn"},{"n":53,"text":"먼저 The first type인데요, 이미 세 가지 유형을 언급했으니 어떤 유형인지 한정해서 정관사 the를 붙였어요. 그리고 서수 first가 순서를 표시해 주고요. 다음으로 is visual learning은 주어의 정체를 설명하는 2형식 구조예요. 주어가 단수니까 be동사는 is를 쓰고, 보어 자리에 명사 visual learning이 온 겁니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 15 / 25\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">People \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시각적 학습 스타일을 가진\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">visual \u003c/span>\u003cspan class=\"tgt\">learning \u003c/span>\u003cspan class=\"tgt\">style\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">학습한다\u003c/span>\u003cspan class=\"en\">learn\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">읽고 필기함으로써\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">reading \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">taking \u003c/span>\u003cspan class=\"tgt\">notes\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">시각적 학습 스타일을 가진 사람들은 읽고 필기하면서 학습한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 시각적 유형에 속한 사람들이 실제로 어떻게 공부하는지 구체적으로 보여 주는 문장이에요. 읽고 필기하는 방식이 그들에게 가장 잘 맞는 \u003cb class=\"key\">학습법\u003c/b>이라는 점을 밝혀, 앞 문장의 정의를 \u003cb class=\"key\">예시\u003c/b>로 풀어 주는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 with의 형용사구 수식\u003c/span> : [명사] + with + [명사구] (~을 가진 명사) : \"시각적 학습 스타일을 가진 사람들은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 by + 동명사(수단·방법)와 병렬\u003c/span> : by + [동명사] (~함으로써) : \"읽고 필기함으로써\"\u003c/div>\u003c/div>","segs":[{"n":54,"text":"People, 사람들은. with a visual learning style, 시각적 학습 스타일을 가진. learn, 학습한다. by reading and taking notes, 읽고 필기함으로써. 이 문장 전체를 해석하면, 시각적 학습 스타일을 가진 사람들은 읽고 필기하면서 학습한다.","hl":"m"},{"n":55,"text":"시각적 학습 유형을 가진 사람들이 구체적으로 어떻게 공부하는지 알려 주는 문장이에요. 읽고 필기하는 방식이 그들에게 가장 잘 맞는다는 걸 보여 주죠.","hl":"mn"},{"n":56,"text":"먼저 People with a visual learning style을 보세요. 전치사 with가 만든 구가 앞의 People을 뒤에서 꾸며 주는 형용사구 역할을 해요. 그래서 '시각적 학습 스타일을 가진 사람들'이라고 한정해서 해석합니다. 다음으로 by reading and taking notes인데요, 수단이나 방법을 말할 때 전치사 by 뒤에 동명사를 쓴다고 배웠죠. reading과 taking이 and로 병렬 연결되어서 두 행동이 같은 방식으로 나열된 구조예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 16 / 25\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들에게는\u003c/span>\u003cspan class=\"en\">For them,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">도표나 그림을 그리는 것이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">drawing \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">diagram \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">pictures\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">도움이 된다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">helpful \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">학습에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">learning\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들에게는 도표나 그림을 그리는 것이 학습에 도움이 된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 시각 학습 유형에게 어떤 방법이 효과적인지 알려 주는 문장이다. '도표나 그림을 그리는 것'이라는 \u003cb class=\"key\">동명사구\u003c/b>가 주어가 되어 '~하는 것은'의 의미를 만들고, 그것이 학습에 유용하다는 내용을 전한다. 앞 문장의 시각 학습자 설명을 구체적인 \u003cb class=\"key\">학습 \u003c/b>\u003cb class=\"key\">방법\u003c/b>으로 이어 주는 역할을 한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사구 주어\u003c/span> : [동명사 drawing + 목적어 a diagram or pictures] + [단수 동사 is] : \"도표나 그림을 그리는 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be helpful for + 동명사\u003c/span> : be helpful for + [동명사 learning] : \"학습에 도움이 된다\"\u003c/div>\u003c/div>","segs":[{"n":57,"text":"For them, 그들에게는. drawing a diagram or pictures, 도표나 그림을 그리는 것이. is helpful, 도움이 된다. for learning, 학습에. 이 문장 전체를 해석하면, 그들에게는 도표나 그림을 그리는 것이 학습에 도움이 된다.","hl":"m"},{"n":58,"text":"이 문장은 시각 학습 유형에게 어떤 방법이 효과적인지 알려 주는 문장이에요. 도표나 그림을 그리는 행동이 학습에 도움이 된다는 내용으로, 앞 문장의 시각 학습자 설명을 구체적인 학습 방법으로 이어 줍니다. 동명사구가 주어가 되어 '~하는 것은'이라는 뜻을 만든다는 점도 함께 봐 두세요.","hl":"mn"},{"n":59,"text":"첫 번째로 drawing a diagram or pictures를 보세요. 동사 draw에 ing를 붙여 명사처럼 만든 동명사구인데, 여기서는 문장의 주어 역할을 해요. 동명사구가 주어일 때는 단수로 취급해서 is를 쓴다는 점, 꼭 기억하세요. 두 번째로 is helpful for learning에서 for는 전치사라서 뒤에 동사원형이 아니라 동명사 learning이 왔어요. 전치사의 목적어 자리에는 명사 역할을 하는 형태만 온다는 원리예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 17 / 25\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">두 번째 종류의 사람은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">The \u003c/span>\u003cspan class=\"tgt\">second \u003c/span>\u003cspan class=\"tgt\">type \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">people\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~에 집중한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">focuses \u003c/span>\u003cspan class=\"tgt\">on\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">소리에\u003c/span>\u003cspan class=\"en\">sounds.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">두 번째 종류의 사람은 소리에 집중한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 세 가지 학습 유형 중 두 번째 유형을 소개하는 문장이다. 두 번째 \u003cb class=\"key\">유형\u003c/b>은 소리, 즉 청각에 집중하는 사람들이라는 점을 밝혀 다음 문장의 설명을 준비한다. 앞의 시각 학습과 대비되는 \u003cb class=\"key\">청각 \u003c/b>\u003cb class=\"key\">학습\u003c/b>의 시작점이 되는 문장이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">of + 명사 수식과 주어의 핵심\u003c/span> : The second [type(핵심 명사)] + of + [people(수식어)] : \"두 번째 종류의 사람들은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주어-동사 수일치와 전치사 on\u003c/span> : [단수 주어 type] + [단수 동사 focuses] + on + [명사 sounds] : \"~에 집중한다\"\u003c/div>\u003c/div>","segs":[{"n":60,"text":"The second type of people, 두 번째 종류의 사람은. focuses on, ~에 집중한다. sounds, 소리에. 이 문장 전체를 해석하면, 두 번째 종류의 사람은 소리에 집중한다.","hl":"m"},{"n":61,"text":"이 문장은 세 가지 학습 유형 가운데 두 번째 유형을 소개하는 역할을 해요. 두 번째 유형은 소리에 집중하는 사람들이라는 점을 밝혀서 다음 문장의 설명을 준비하죠. 앞에서 나온 시각 학습과 대비되는 청각 학습의 출발점이 되는 문장이에요.","hl":"mn"},{"n":62,"text":"먼저 주어를 정확히 찾아야 해요. The second type of people에서 진짜 주어는 of 앞에 있는 핵심 명사 type이에요. 뒤에 있는 people은 수식 역할만 하니까 동사의 수를 결정하지 않아요. 그래서 수일치상 동사는 단수형 focuses로 쓴 거예요. 그리고 focuses on에서 on은 전치사라서 뒤에 명사 sounds가 목적어로 와요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 18 / 25\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 배운다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">They \u003c/span>\u003cspan class=\"tgt\">learn \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">듣고 말하는 것을 통해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">through\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">hearing \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">saying\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무언가를\u003c/span>\u003cspan class=\"en\">something.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 무언가를 듣고 말하는 것을 통해 배운다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 두 번째 유형이 실제로 어떻게 배우는지 구체화하는 문장이다. 듣기와 말하기, 즉 소리를 듣고 내면서 배운다는 \u003cb class=\"key\">학습 \u003c/b>\u003cb class=\"key\">방식\u003c/b>을 보여 준다. 그래서 다음 문장의 '소리 내어 읽기'라는 \u003cb class=\"key\">예시\u003c/b>로 자연스럽게 이어진다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 through(수단·방법)\u003c/span> : [주어 They] + learn + through + [동명사구(수단)] : \"그들은 ~을 통해 배운다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사의 목적어로 쓰인 동명사의 병렬\u003c/span> : through + [동명사 hearing] + and + [동명사 saying] + 목적어 : \"듣고 말하는 것\"\u003c/div>\u003c/div>","segs":[{"n":63,"text":"They learn, 그들은 배운다. through hearing and saying, 듣고 말하는 것을 통해. something, 무언가를. 이 문장 전체를 해석하면, 그들은 무언가를 듣고 말하는 것을 통해 배운다.","hl":"m"},{"n":64,"text":"이 문장은 두 번째 유형, 즉 소리에 집중하는 사람들의 학습 방식을 구체적으로 설명해요. 그들은 귀에서 소리를 듣고 입으로 말하는 과정에서 배운다는 뜻이죠. 그래서 다음 문장에서 소리 내어 읽기가 좋은 예시로 이어지는 거예요.","hl":"mn"},{"n":65,"text":"먼저 They learn through에서 through는 수단이나 방법을 나타내는 전치사예요. 그래서 무엇을 통해 배우는지가 뒤에 동명사로 이어져요. 두 번째로 hearing and saying을 보면 hear와 say가 동명사로 바뀌어 전치사의 목적어 자리에 나란히 놓였어요. and로 이어진 두 동사는 반드시 같은 형태로 병렬을 맞춰야 한다는 것, 시험에 자주 나오니까 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 19 / 25\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">따라서\u003c/span>\u003cspan class=\"en\">So,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">글을 큰 소리로 읽는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">reading \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">text \u003c/span>\u003cspan class=\"tgt\">aloud\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~이 될 수 있다\u003c/span>\u003cspan class=\"en\">can be\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">좋은 방법\u003c/span>\u003cspan class=\"en\">a good way\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들에게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">them \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무언가를 학습하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">learn \u003c/span>\u003cspan class=\"tgt\">something\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">따라서 글을 큰 소리로 읽는 것이 그들이 무언가를 학습하는 좋은 방법이 될 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 말한 두 번째 유형, 즉 소리에 집중하는 \u003cb class=\"key\">청각형\u003c/b> 학습자에게 맞는 \u003cb class=\"key\">학습법\u003c/b>을 제시하는 문장이에요. 'a good way'를 for them to learn something이 뒤에서 꾸며 주면서 '그들이 무언가를 학습하는 좋은 방법'이라는 뜻이 완성돼요. 소리 내어 읽기가 왜 효과적인지 알려 주는 대목이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사구 주어\u003c/span> : [동명사구 Reading ~] + [단수 동사 can be] : \"글을 큰 소리로 읽는 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법(명사 수식) + 의미상 주어\u003c/span> : [a good way] + for + [목적격] + to + [동사원형] : \"그들이 무언가를 학습하는(좋은 방법)\"\u003c/div>\u003c/div>","segs":[{"n":66,"text":"So, 따라서. reading the text aloud, 글을 큰 소리로 읽는 것은. can be, ~이 될 수 있다. a good way, 좋은 방법. for them, 그들에게. to learn something, 무언가를 학습하는. 이 문장 전체를 해석하면, 따라서 글을 큰 소리로 읽는 것이 그들이 무언가를 학습하는 좋은 방법이 될 수 있다.","hl":"m"},{"n":67,"text":"이 문장은 소리에 집중하는 청각형 학습자에게 맞는 학습법을 알려 주는 대목이에요. 글을 소리 내어 읽는 행동이 그들에게는 아주 좋은 학습 방법이 될 수 있다는 뜻이죠. 앞 문장에서 말한 hearing and saying과 자연스럽게 이어지는 내용이에요.","hl":"mn"},{"n":68,"text":"첫 번째로, reading the text aloud처럼 동사원형에 ing를 붙인 덩어리가 문장의 주어로 나와요. 이렇게 동명사구가 주어가 되면 하나의 덩어리로 보기 때문에 뒤에 오는 동사는 단수로 받아서 can be가 되는 거예요. 두 번째로, a good way를 for them to learn something이 뒤에서 꾸며 주고 있어요. way 같은 명사를 to부정사가 뒤에서 꾸미는 형용사적 용법이고, for them은 누가 배우는지를 알려 주는 의미상 주어예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 20 / 25\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마지막 유형의 사람은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">The \u003c/span>\u003cspan class=\"tgt\">last \u003c/span>\u003cspan class=\"tgt\">type \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">person \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사용한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">uses\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 몸을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">body\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">마지막 유형의 사람은 몸을 사용한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 세 가지 학습 유형 가운데 마지막인 \u003cb class=\"key\">신체형\u003c/b> 학습자를 소개하는 문장이에요. 앞의 first, second와 짝을 이루는 'the last type of person'은 '마지막 유형의 사람'이라는 뜻이죠. 이 문장 뒤에 몸을 움직이는 구체적인 방법이 이어져요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주어-동사 수 일치\u003c/span> : [The last type of person] + [단수 동사 uses] : \"마지막 유형의 사람은 사용한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">단수 person을 받는 their\u003c/span> : [단수 명사 person] + [소유격 their] : \"그들의 몸을\"\u003c/div>\u003c/div>","segs":[{"n":69,"text":"The last type of person, 마지막 유형의 사람은. uses, 사용한다. their body, 그들의 몸을. 이 문장 전체를 해석하면, 마지막 유형의 사람은 몸을 사용한다.","hl":"m"},{"n":70,"text":"이 문장은 세 가지 학습 유형 가운데 마지막 유형을 소개하는 문장이에요. 앞에서 first, second로 이어졌으니 the last는 마지막이라는 뜻으로 자연스럽게 연결되죠. 이 사람들은 몸을 써서 배우는 신체형 학습자예요.","hl":"mn"},{"n":71,"text":"첫 번째로, 주어를 잘 보세요. The last type of person에서 of person이 붙어 있어도 진짜 주어는 type이에요. 그래서 동사는 복수가 아니라 단수로 받아서 uses가 되는 거예요. 두 번째로, their body라고 쓴 것을 눈여겨보세요. 성별을 모르는 단수 사람을 받을 때는 their를 쓰기 때문에 단수인 person인데도 their가 오는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 21 / 25\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 배운다\u003c/span>\u003cspan class=\"en\">They learn\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">움직임으로써\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">moving \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 몸을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">body\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 몸을 움직여서 배운다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 말한 신체형 학습자들이 실제로 어떻게 배우는지 알려 주는 문장이에요. 몸을 움직이는 행동이 그들에게는 학습의 \u003cb class=\"key\">수단\u003c/b>이라는 뜻이죠. 그래서 다음 문장에서 role-play 같은 활동을 예로 드는 거예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 by + 동명사(수단·방법)\u003c/span> : by + [동사원형-ing] = ~함으로써 : \"몸을 움직임으로써\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사의 목적어\u003c/span> : [동명사 moving] + [목적어 their body] : \"그들의 몸을 움직이는 것\"\u003c/div>\u003c/div>","segs":[{"n":72,"text":"They learn, 그들은 배운다. by moving, 움직임으로써. their body, 그들의 몸을. 이 문장 전체를 해석하면, 그들은 몸을 움직여서 배운다.","hl":"m"},{"n":73,"text":"이 문장은 신체형 학습자들이 실제로 어떻게 배우는지 알려 줘요. 몸을 움직이는 행동이 그들에게는 학습의 수단이라는 뜻이죠. 그래서 다음 문장에서 role-play 같은 활동을 예로 드는 거예요.","hl":"mn"},{"n":74,"text":"첫 번째로, by 뒤에 moving이 온 것을 보세요. 전치사 뒤는 명사 자리라서 동사는 동명사 형태로 바뀌어요. by에 동명사를 붙이면 무엇을 함으로써라는 수단과 방법을 나타내는 표현이 되는 거죠. 두 번째로, moving은 타동사라서 뒤에 목적어가 필요해요. 그래서 their body가 와서 몸을 움직이는 것이라는 뜻이 완성되는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 22 / 25\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은\u003c/span>\u003cspan class=\"en\">They\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">역할극을 사용할 수 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">use\u003c/span> role-plays\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무언가를 배우기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">learn \u003c/span>\u003cspan class=\"tgt\">something\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 무언가를 배우기 위해 역할극을 사용할 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 말한 신체를 사용하는 학습자 유형이 실제로 무엇을 하는지 예를 드는 문장이에요. \u003cb class=\"key\">역할극\u003c/b>처럼 몸을 움직이는 활동이 이 유형에게는 가장 자연스러운 학습 방법이라는 뜻이죠. to learn은 '배우기 위해'라는 \u003cb class=\"key\">목적\u003c/b>을 나타내요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 can + 동사원형\u003c/span> : 주어 + [[can]] + [동사원형 use] (능력·가능) : \"사용할 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : use [목적어] + [[to learn (to부정사구/목적)]] : \"무언가를 배우기 위해\"\u003c/div>\u003c/div>","segs":[{"n":75,"text":"They, 그들은. can use role-plays, 역할극을 사용할 수 있다. to learn something, 무언가를 배우기 위해. 이 문장 전체를 해석하면, 그들은 무언가를 배우기 위해 역할극을 사용할 수 있다.","hl":"m"},{"n":76,"text":"여기서는 몸을 쓰는 학습자에게 맞는 방법을 알려 주고 있어요. 역할극처럼 몸을 움직이는 활동이 그들에게는 가장 자연스러운 학습 방법이라는 뜻이죠. to learn은 배우기 위한 목적을 나타내는 표현이에요.","hl":"mn"},{"n":77,"text":"먼저 조동사 can 뒤에는 항상 동사원형이 와요. 그래서 uses가 아니라 use가 그대로 쓰인 거죠. 여기서 can은 할 수 있다는 가능의 뜻을 더해 줍니다. 그리고 to learn은 역할극을 사용하는 목적을 나타내는 to부정사예요. 그래서 무언가를 배우기 위해라고 해석하면 자연스럽습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 23 / 25\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 학생은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Every \u003c/span>\u003cspan class=\"tgt\">student \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신만의 학습 스타일을 사용한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">uses\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">own \u003c/span>\u003cspan class=\"tgt\">learning \u003c/span>\u003cspan class=\"tgt\">style\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">배우기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">learn\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">모든 학생은 배우기 위한 자신만의 학습 스타일을 사용한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 모든 학생이 저마다 다른 방식을 써서 배운다는 것을 정리하는 문장이에요. Every student처럼 \u003cb class=\"key\">단수\u003c/b>로 받았지만 뒤에서는 their로 받아 '각자'의 느낌을 살렸죠. 여기서 to learn은 '배우기 위해'라는 \u003cb class=\"key\">목적\u003c/b>이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">every + 단수명사 + 단수동사\u003c/span> : [[Every]] + [단수명사 student] + [단수동사 uses] : \"모든 학생은 사용한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">소유격 + own (강조)\u003c/span> : [[their own]] + [명사] : \"그들 자신의 학습 스타일\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : use [목적어] + [[to learn]] : \"배우기 위해\"\u003c/div>\u003c/div>","segs":[{"n":78,"text":"Every student, 모든 학생은. uses their own learning style, 자신만의 학습 스타일을 사용한다. to learn, 배우기 위해. 이 문장 전체를 해석하면, 모든 학생은 배우기 위한 자신만의 학습 스타일을 사용한다.","hl":"m"},{"n":79,"text":"모든 학생이 저마다 다른 방식을 써서 배운다는 점을 정리한 문장이에요. Every student는 단수로 받았지만 뒤에서 their로 받아 각자의 느낌을 살렸죠. 여기서 to learn은 배우기 위한 목적을 나타내요.","hl":"mn"},{"n":80,"text":"먼저 every는 하나하나를 단수로 보는 말이라 뒤에 오는 동사도 단수형을 써요. 그래서 use가 아니라 uses가 된 거죠. 그리고 own은 소유격 뒤에서 강조 역할을 해서 남이 아닌 바로 자기만의라는 느낌을 더해 줍니다. 마지막으로 to learn은 학습 스타일을 사용하는 목적을 나타내는 to부정사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 24 / 25\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 학습 스타일을 아는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Knowing \u003c/span>\u003cspan class=\"tgt\">one's \u003c/span>\u003cspan class=\"tgt\">own \u003c/span>\u003cspan class=\"tgt\">learning \u003c/span>\u003cspan class=\"tgt\">style\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">학생이 배우도록 돕는다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">helps \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">student \u003c/span>\u003cspan class=\"tgt\">learn\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 효율적으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">effectively\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">자신의 학습 스타일을 아는 것은 학생이 더 효율적으로 배우는 데 도움이 된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 지문의 결론으로, 자기 학습 스타일을 아는 것이 왜 중요한지 말해 주는 문장이에요. 동명사 \u003cb class=\"key\">주어\u003c/b> Knowing이 문장 앞에 나와 '아는 것'이라는 행동을 주제로 세웠죠. help 뒤에는 \u003cb class=\"key\">동사원형\u003c/b> learn이 와서 '더 효율적으로 배우도록 돕는다'는 뜻을 만듭니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사구 주어(단수 취급)\u003c/span> : [[Knowing]] + [목적어] + [동사 helps] : \"자신의 학습 스타일을 아는 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">help + 목적어 + 동사원형(원형부정사)\u003c/span> : [[help]] + [목적어] + [동사원형 learn] : \"학생이 배우도록 돕는다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">비교급 부사\u003c/span> : [[more]] + [부사 effectively] : \"더 효율적으로\"\u003c/div>\u003c/div>","segs":[{"n":81,"text":"Knowing one's own learning style, 자신의 학습 스타일을 아는 것은. helps the student learn, 학생이 배우도록 돕는다. more effectively, 더 효율적으로. 이 문장 전체를 해석하면, 자신의 학습 스타일을 아는 것은 학생이 더 효율적으로 배우는 데 도움이 된다.","hl":"m"},{"n":82,"text":"지문의 결론에 해당하는 문장이에요. 자기 학습 스타일을 아는 것이 왜 중요한지 알려 주고 있죠. 결국 아는 것만으로 끝나지 말고 그 방식을 활용해야 더 효율적으로 배울 수 있다는 흐름으로 이어집니다.","hl":"mn"},{"n":83,"text":"먼저 Knowing은 아는 것이라는 행동을 주어로 쓰기 위한 동명사예요. 동명사 주어는 단수로 보기 때문에 동사에 -s가 붙어 helps가 됩니다. 그리고 help 뒤에 목적어가 오면 동사원형이 오는 구조가 자주 쓰여요. 그래서 to learn이 아니라 learn인 거죠. 마지막으로 more effectively는 정도를 비교하는 비교급 부사이고, effectively는 형용사 effective에 -ly가 붙은 형태입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 25 / 25\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">따라서\u003c/span>\u003cspan class=\"en\">So,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분이 어떻게 배우는지를 이해해서\u003c/span>\u003cspan class=\"en\">understand \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">learn\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그것을 활용하라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">use \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가능한 한 많이!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">much \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">possible\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">따라서 여러분이 어떻게 배우는지를 이해해서 그것을 가능한 한 많이 활용하라!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글 전체의 결론으로, 자신의 \u003cb class=\"key\">학습 \u003c/b>\u003cb class=\"key\">스타일\u003c/b>을 먼저 이해하고 그것을 학습에 최대한 활용하라고 촉구합니다. 여기서 how you learn은 ‘여러분이 어떻게 배우는지’라는 뜻의 \u003cb class=\"key\">간접의문문\u003c/b>으로, 결국 학습 스타일을 가리킵니다. as much as possible은 ‘\u003cb class=\"key\">가능한 \u003c/b>\u003cb class=\"key\">한 \u003c/b>\u003cb class=\"key\">많이\u003c/b>’라는 관용 표현으로, 배운 방식을 실제 학습에 적극 적용하라는 의도입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">간접의문문(의문사절의 목적어)\u003c/span> : understand + [how + 주어 + 동사] : \"여러분이 어떻게 배우는지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 and와 명령문의 병렬\u003c/span> : [동사원형 understand] + and + [동사원형 use] : \"그리고 그것을 활용하라\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">as ~ as possible 관용구\u003c/span> : as + [부사 much] + as possible : \"가능한 한 많이\"\u003c/div>\u003c/div>","segs":[{"n":84,"text":"So, 따라서. understand how you learn, 여러분이 어떻게 배우는지를 이해해서. and use it, 그리고 그것을 활용하라. as much as possible!, 가능한 한 많이!. 이 문장 전체를 해석하면, 따라서 여러분이 어떻게 배우는지를 이해해서 그것을 가능한 한 많이 활용하라!","hl":"m"},{"n":85,"text":"이 문장은 글 전체의 결론이에요. 자신의 학습 스타일을 이해하고 그것을 학습에 최대한 활용하라고 말하고 있죠. how you learn은 간접의문문으로 ‘여러분이 어떻게 배우는지’라는 뜻이고, as much as possible은 ‘가능한 한 많이’라는 관용 표현이에요.","hl":"mn"},{"n":86,"text":"첫 번째로 how you learn은 understand의 목적어로 쓰인 간접의문문이에요. 의문사 뒤에 주어와 동사가 바로 오므로 do를 넣지 않는 형태죠. 두 번째로 and use it에서 등위접속사 and가 understand와 use를 대등하게 연결하고, 명령문이라 두 동사 모두 동사원형으로 쓰였어요. 세 번째로 as much as possible은 as와 as 사이에 much를 넣은 관용구이고, use를 꾸미는 부사구로 쓰였습니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>무언가를 배우는 데 중요한 요소는 여러 가지지만, \u003cb class=\"key\">학습 \u003c/b>\u003cb class=\"key\">스타일\u003c/b>은 자신이 가장 잘 배우는 방법을 알려 준다.\u003c/li>\u003cli>새로운 보드게임을 배우는 상황에서 설명서 읽기, 설명 듣기, 직접 해 보기 중 자신의 \u003cb class=\"key\">행동\u003c/b>이 학습 스타일을 보여 준다.\u003c/li>\u003cli>학습 스타일은 \u003cb class=\"key\">시각적 \u003c/b>\u003cb class=\"key\">학습\u003c/b>, 소리 중심 학습, 몸을 사용하는 학습으로 나뉘며 각 유형에 맞는 학습 방법이 다르다.\u003c/li>\u003cli>자신의 학습 스타일을 \u003cb class=\"key\">이해\u003c/b>하고 활용하면 더 \u003cb class=\"key\">효율적\u003c/b>으로 배울 수 있다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Knowing your own learning style helps you learn more effectively and use the best way for you.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">무언가를 배우는 데 중요한 요소는 여러 가지지만, \u003cb class=\"key\">학습 \u003c/b>\u003cb class=\"key\">스타일\u003c/b>은 자신이 가장 잘 배우는 방법을 알려 준다. 새로운 보드게임을 배울 때의 \u003cb class=\"key\">행동\u003c/b>으로 학습 스타일을 파악할 수 있으며, \u003cb class=\"key\">시각적 \u003c/b>\u003cb class=\"key\">학습\u003c/b>·소리 중심 학습·몸을 쓰는 학습 중 자신의 유형을 \u003cb class=\"key\">이해\u003c/b>하고 활용하면 더 \u003cb class=\"key\">효율적\u003c/b>으로 배울 수 있다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":87,"text":"정리해 볼게요. 이 글은 학습 스타일이 가장 잘 배우는 방법을 알려 주며, 자신의 행동으로 그 유형을 파악할 수 있다고 말해요. 시각적 학습, 소리 중심 학습, 몸을 쓰는 학습 중 자신에게 맞는 방식을 이해하고 활용하면 더 효율적으로 배울 수 있습니다. 오늘 배운 내용을 꼭 자기 공부에 적용해 보길 바랄게요, 수고했어요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
