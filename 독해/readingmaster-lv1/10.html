<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터1 Reading 10 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터1 Reading 10","audioDir":"10_audio","preview":false,"count":61,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.668em\">Reading\u003cbr>10\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터1\u003c/div>\u003ch1>Nature: A Source of Discovery\u003c/h1>\u003ch2>자연: 발견의 원천\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>자연은 \u003cb class=\"key\">발견\u003c/b>의 원천이며, 자연을 \u003cb class=\"key\">관찰\u003c/b>하면 인간의 삶이 더 쉽고 편안해질 수 있다. 연잎의 \u003cb class=\"key\">작은 \u003c/b>\u003cb class=\"key\">돌기\u003c/b>가 먼지를 차단하는 원리를 본뜬 특수 \u003cb class=\"key\">페인트\u003c/b>처럼, 자연을 면밀히 관찰하는 것이 새로운 발견으로 이어진다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Observing nature closely can lead to discoveries that make human life easier and more comfortable.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 리딩마스터 원에 실린 Nature is a source of discovery라는 글이에요. 이 글은 자연이 발견의 원천이며, 자연을 관찰하면 우리 삶이 더 쉽고 편안해질 수 있다고 말하고 있죠. 그리고 연잎의 표면에서 힌트를 얻은 특수 페인트 이야기로 그 주장을 뒷받침합니다. 요지는 결국 자연을 면밀히 관찰하는 것이 새로운 발견으로 이어진다는 거예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">연잎은 진흙 연못에서 자라는데도 물방울과 먼지가 잘 달라붙지 않아 늘 깨끗해 보입니다. 과학자들이 현미경으로 들여다보며 그 비밀을 밝혀냈고, 이를 \u003cb class=\"key\">연잎 \u003c/b>\u003cb class=\"key\">효과\u003c/b>(lotus effect)라고 부릅니다. 연잎 표면에는 아주 작은 돌기들이 촘촘히 솟아 있어 표면이 거칠고, 그 위에서 물방울이 둥글게 굴러가며 먼지를 함께 씻어 냅니다. 이렇게 자연의 구조를 본떠 새로운 기술을 만드는 분야를 \u003cb class=\"key\">생체 \u003c/b>\u003cb class=\"key\">모방\u003c/b>(biomimicry)이라고 하며, 스스로 깨끗해지는 \u003cb class=\"key\">자기 \u003c/b>\u003cb class=\"key\">세정\u003c/b>(self-cleaning) 기능이 대표적인 예입니다. 상어 피부의 미세한 비늘을 본뜬 수영복이나 도꼬마리 열매에서 힌트를 얻은 벨크로(velcro)도 같은 원리의 산물입니다. 우리 주변의 코팅 프라이팬이나 물방울이 잘 맺히는 우산 천도 이런 아이디어에서 출발했으니, 자연은 생활 속 발명품의 선생님인 셈입니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 하나 짚고 갈게요. 연잎은 진흙 연못에서 자라는데도 늘 깨끗해 보이죠. 과학자들이 현미경으로 들여다보니 잎 표면에 아주 작은 돌기들이 촘촘히 솟아 있었고, 물방울이 그 위에서 둥글게 굴러가며 먼지를 함께 씻어 냈다고 해요. 이걸 lotus effect, 우리말로 연잎 효과라고 부릅니다. 이렇게 자연의 구조를 본떠 기술을 만드는 분야를 biomimicry, 생체 모방이라고 하고요, 스스로 깨끗해지는 self-cleaning 기능이 대표적인 예예요. 상어 피부를 본뜬 수영복이나 도꼬마리 열매에서 나온 벨크로도 같은 아이디어이고, 여러분 집의 코팅 프라이팬이나 우산 천도 비슷한 원리에서 출발했답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>자연은 발견의 원천\u003csmall>도입·주장 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>글은 자연이 \u003cb class=\"key\">발견\u003c/b>의 원천이라고 단언하며 시작합니다. 자연을 \u003cb class=\"key\">관찰\u003c/b>하면 인간의 삶이 더 나아질 수 있다는 것이 첫 번째 근거로 제시됩니다. 그리고 그것은 우리의 삶이 더 쉽고 \u003cb class=\"key\">편안\u003c/b>해질 수 있다는 뜻이라고 풀어 주며 주장을 분명히 합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>특수 페인트의 예\u003csmall>예시 · 문장 4–7\u003c/small>\u003c/h4>\u003cp>이어서 \u003cb class=\"key\">특수 \u003c/b>\u003cb class=\"key\">페인트\u003c/b>라는 구체적인 예가 나옵니다. 페인트의 \u003cb class=\"key\">거친 \u003c/b>\u003cb class=\"key\">표면\u003c/b>이 먼지를 밀어내기 때문에 집의 외부를 덜 청소할 수 있다는 것이죠. 그리고 이 발견은 \u003cb class=\"key\">연잎\u003c/b>을 관찰하는 것에서 나왔다고 밝히며 예시를 자연과 다시 연결합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>왜 깨끗할까?\u003csmall>질문-답변 · 문장 8–12\u003c/small>\u003c/h4>\u003cp>사람들이 알다시피 \u003cb class=\"key\">연꽃\u003c/b>은 진흙 연못에 살지만 그 잎은 항상 깨끗해 보입니다. 글은 이것이 가능한 이유가 무엇인지 \u003cb class=\"key\">질문\u003c/b>을 던집니다. 그리고 현미경으로 연꽃잎을 보면 \u003cb class=\"key\">답\u003c/b>을 알 수 있다고 안내하며 원리 설명으로 넘어갑니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>돌기가 만드는 원리\u003csmall>근거 · 문장 13–15\u003c/small>\u003c/h4>\u003cp>현미경으로 보면 잎 위에는 많은 \u003cb class=\"key\">작은 \u003c/b>\u003cb class=\"key\">돌기\u003c/b>들이 있습니다. 그것들은 작은 못처럼 보이고 표면을 \u003cb class=\"key\">거칠게\u003c/b> 만듭니다. 그래서 먼지를 \u003cb class=\"key\">차단\u003c/b>할 수 있다는 원리가 여기서 완성됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>자연을 관찰하라\u003csmall>결론·당부 · 문장 16\u003c/small>\u003c/h4>\u003cp>마지막으로 항상 자연을 \u003cb class=\"key\">면밀히 \u003c/b>\u003cb class=\"key\">관찰\u003c/b>하라고 촉구합니다. 앞에서 살펴본 연잎의 예시를 일반적인 \u003cb class=\"key\">교훈\u003c/b>으로 확장한 마무리입니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 다섯 단계로 나눠서 천천히 따라가 볼게요.","hl":null},{"n":4,"text":"글은 자연이 발견의 원천이라고 단언하며 시작해요. 자연을 관찰하면 인간의 삶이 더 나아질 수 있다는 것, 그리고 그것은 우리 삶이 더 쉽고 편안해질 수 있다는 뜻이라고 풀어 주죠. 도입부에서 주장을 아주 분명하게 밝히고 있습니다.","hl":"f0"},{"n":5,"text":"이어서 특수 페인트라는 구체적인 예가 나와요. 페인트의 거친 표면이 먼지를 밀어내기 때문에 집의 외부를 덜 청소할 수 있다는 거죠. 그리고 이 발견은 연잎을 관찰하는 것에서 나왔다고 밝히면서 예시를 자연과 다시 연결합니다.","hl":"f1"},{"n":6,"text":"사람들이 알다시피 연꽃은 진흙 연못에 살아요. 그런데 그 잎은 항상 깨끗해 보이죠. 그래서 글은 이것이 어떻게 가능한지 질문을 던지고, 현미경으로 연꽃잎을 보면 답을 알 수 있다고 안내합니다.","hl":"f2"},{"n":7,"text":"현미경으로 보면 잎 위에 작은 돌기들이 아주 많아요. 그것들은 작은 못처럼 보이고 표면을 거칠게 만들죠. 그래서 먼지를 차단할 수 있다는 원리가 여기서 드러납니다.","hl":"f3"},{"n":8,"text":"마지막 문장에서 항상 자연을 면밀히 관찰하라고 촉구해요. 앞에서 살펴본 연잎의 예시를 일반적인 교훈으로 끌어올린 마무리인 거죠.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거(예시)\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 2번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 첫 문장에서 자연이 발견의 원천이라는 \u003cb class=\"key\">주장\u003c/b>을 던지고, 곧바로 삶이 나아진다는 \u003cb class=\"key\">요지\u003c/b>를 제시합니다. 이어서 특수 페인트라는 구체적인 \u003cb class=\"key\">예시\u003c/b>를 내세우고, 연잎의 돌기라는 \u003cb class=\"key\">원리\u003c/b>로 그 근거를 채웁니다. 마지막 문장에서 자연을 면밀히 관찰하자는 \u003cb class=\"key\">당부\u003c/b>로 다시 주장으로 돌아오기 때문에 \u003cb class=\"key\">두괄식\u003c/b>이며, 주장과 예시가 결합한 전개 방식입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>For example (4)\u003c/b>\u003cspan>예시 제시\u003c/span>\u003cb>However (9)\u003c/b>\u003cspan>전환·반례\u003c/span>\u003cb>Then (12)\u003c/b>\u003cspan>결과·안내\u003c/span>\u003cb>So (15)\u003c/b>\u003cspan>결과·결론\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">make human life better\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">our life can be easier and more comfortable\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">pushes away dust\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">keep dust off\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">look at a lotus leaf\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">observe nature closely\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"이 글은 주장과 근거, 그리고 예시가 결합한 구조예요. 첫 문장에서 자연이 발견의 원천이라는 주장을 던지고 곧바로 요지를 제시하니까 두괄식입니다. 그다음 특수 페인트라는 예시와 연잎의 돌기라는 원리로 근거를 채우고, 마지막에 당부로 마무리하죠. 그래서 주장과 예시가 함께 가는 글이라고 정리할 수 있어요.","hl":"ty"},{"n":10,"text":"신호어를 눈여겨보세요. 네 번째 문장의 For example은 구체적인 예시가 시작된다는 신호예요. 아홉 번째 문장의 However는 진흙 연못에 사는데도 깨끗하다는 반전을 만들어 주고요. 열다섯 번째 문장의 So는 원리에서 결과로 넘어가는 연결어입니다. 그리고 마지막 문장은 앞의 관찰이라는 개념을 면밀히 관찰하자로 다시 받아 주죠. 이 신호어들을 따라가면 글의 뼈대가 그대로 보일 거예요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>nature\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자연\u003c/span>\u003c/div>\u003cdiv>\u003cb>source\u003c/b>\u003cem>명사\u003c/em>\u003cspan>원천, 근원\u003c/span>\u003c/div>\u003cdiv>\u003cb>discovery\u003c/b>\u003cem>명사\u003c/em>\u003cspan>발견\u003c/span>\u003c/div>\u003cdiv>\u003cb>observe\u003c/b>\u003cem>동사\u003c/em>\u003cspan>관찰하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>human\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>인간의\u003c/span>\u003c/div>\u003cdiv>\u003cb>comfortable\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>편안한\u003c/span>\u003c/div>\u003cdiv>\u003cb>for example\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>예를 들어\u003c/span>\u003c/div>\u003cdiv>\u003cb>special\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>특수한, 특별한\u003c/span>\u003c/div>\u003cdiv>\u003cb>paint\u003c/b>\u003cem>명사\u003c/em>\u003cspan>페인트, 도료\u003c/span>\u003c/div>\u003cdiv>\u003cb>keep\u003c/b>\u003cem>동사\u003c/em>\u003cspan>유지하다, ~한 상태로 두다\u003c/span>\u003c/div>\u003cdiv>\u003cb>clean\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>깨끗한\u003c/span>\u003c/div>\u003cdiv>\u003cb>rough\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>거친, 울퉁불퉁한\u003c/span>\u003c/div>\u003cdiv>\u003cb>surface\u003c/b>\u003cem>명사\u003c/em>\u003cspan>표면\u003c/span>\u003c/div>\u003cdiv>\u003cb>push away\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>밀어내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>dust\u003c/b>\u003cem>명사\u003c/em>\u003cspan>먼지\u003c/span>\u003c/div>\u003cdiv>\u003cb>outside\u003c/b>\u003cem>명사\u003c/em>\u003cspan>외부, 바깥쪽\u003c/span>\u003c/div>\u003cdiv>\u003cb>less often\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>더 적게, 덜 자주\u003c/span>\u003c/div>\u003cdiv>\u003cb>come from\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에서 나오다, 유래하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>leaf\u003c/b>\u003cem>명사\u003c/em>\u003cspan>잎, 나뭇잎\u003c/span>\u003c/div>\u003cdiv>\u003cb>lotus\u003c/b>\u003cem>명사\u003c/em>\u003cspan>연꽃, 연\u003c/span>\u003c/div>\u003cdiv>\u003cb>muddy\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>진흙투성이의\u003c/span>\u003c/div>\u003cdiv>\u003cb>pond\u003c/b>\u003cem>명사\u003c/em>\u003cspan>연못\u003c/span>\u003c/div>\u003cdiv>\u003cb>however\u003c/b>\u003cem>부사\u003c/em>\u003cspan>그러나, 하지만\u003c/span>\u003c/div>\u003cdiv>\u003cb>possible\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>가능한\u003c/span>\u003c/div>\u003cdiv>\u003cb>microscope\u003c/b>\u003cem>명사\u003c/em>\u003cspan>현미경\u003c/span>\u003c/div>\u003cdiv>\u003cb>answer\u003c/b>\u003cem>명사\u003c/em>\u003cspan>답, 해답\u003c/span>\u003c/div>\u003cdiv>\u003cb>tiny\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>아주 작은\u003c/span>\u003c/div>\u003cdiv>\u003cb>bump\u003c/b>\u003cem>명사\u003c/em>\u003cspan>돌기, 볼록한 부분\u003c/span>\u003c/div>\u003cdiv>\u003cb>nail\u003c/b>\u003cem>명사\u003c/em>\u003cspan>못\u003c/span>\u003c/div>\u003cdiv>\u003cb>closely\u003c/b>\u003cem>부사\u003c/em>\u003cspan>면밀히, 자세히\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"핵심 단어 몇 개만 짚어 볼게요. source는 원천, observe는 관찰하다라는 뜻이고요. rough는 거칠다, surface는 표면이라는 의미예요. push away는 밀어내다, keep dust off는 먼지를 차단하다로 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">observe\u003c/b>\u003cspan class=\"m\">관찰하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">watch\u003c/span>\u003cspan class=\"s\">examine\u003c/span>\u003cspan class=\"s\">study\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003cspan class=\"a\">overlook\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">rough\u003c/b>\u003cspan class=\"m\">거친\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">uneven\u003c/span>\u003cspan class=\"s\">coarse\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">smooth\u003c/span>\u003cspan class=\"a\">even\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">tiny\u003c/b>\u003cspan class=\"m\">아주 작은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">small\u003c/span>\u003cspan class=\"s\">minute\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">huge\u003c/span>\u003cspan class=\"a\">enormous\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">comfortable\u003c/b>\u003cspan class=\"m\">편안한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">easy\u003c/span>\u003cspan class=\"s\">pleasant\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">uncomfortable\u003c/span>\u003cspan class=\"a\">harsh\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">discovery\u003c/b>\u003cspan class=\"m\">발견\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">finding\u003c/span>\u003cspan class=\"s\">invention\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">clean\u003c/b>\u003cspan class=\"m\">깨끗한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">spotless\u003c/span>\u003cspan class=\"s\">neat\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">dirty\u003c/span>\u003cspan class=\"a\">muddy\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">keep\u003c/b>\u003cspan class=\"m\">유지하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">maintain\u003c/span>\u003cspan class=\"s\">preserve\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">remove\u003c/span>\u003cspan class=\"a\">lose\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어도 함께 정리해 볼게요. observe는 watch나 examine으로 바꿔 쓸 수 있고 반대말은 ignore예요. rough는 uneven이나 coarse와 가깝고 반대는 smooth죠. tiny는 small이나 minute, 반대는 huge나 enormous입니다. comfortable은 easy나 pleasant, 반대는 uncomfortable이고요. clean은 spotless, 반대는 dirty나 muddy예요. 마지막으로 keep은 maintain이나 preserve로 바꿔 쓸 수 있습니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 16\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자연은 ~이다\u003c/span>\u003cspan class=\"en\">Nature is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하나의 원천\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">source \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">발견의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">discovery\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">자연은 발견의 원천이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글 전체의 \u003cb class=\"key\">주제문\u003c/b>으로, ‘자연은 발견의 원천’이라는 핵심 개념을 먼저 던져 놓는 문장이에요. 뒤에 이어지는 로터스 잎과 페인트 이야기는 모두 이 주장을 뒷받침하는 \u003cb class=\"key\">예시\u003c/b>가 됩니다. source는 ‘근원, 원천’이라는 뜻으로, 발견이 자연에서 비롯된다는 방향성을 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 보어(be동사 + 명사구)\u003c/span> : 주어(S) + be동사 + [명사구(주격 보어)] : \"발견의 원천(이다)\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"Nature is, 자연은 ~이다. a source, 하나의 원천. of discovery, 발견의. 이 문장 전체를 해석하면, 자연은 발견의 원천이다.","hl":"m"},{"n":14,"text":"이 문장은 글 전체의 주제문이에요. 자연은 발견의 원천이라고 딱 주제를 던져 주는 거죠. 뒤에 나오는 연잎 이야기와 페인트 이야기는 모두 이 주장을 뒷받침하는 예시라는 점을 꼭 기억하세요.","hl":"mn"},{"n":15,"text":"첫 번째로, a source of discovery는 be동사 뒤에 온 명사구로 주격 보어 역할을 해요. 주어 Nature가 무엇인지 설명해 주는 자리죠. be동사는 앞뒤를 등호로 이어 준다고 생각하면 쉬워요. of discovery는 발견의 라는 뜻으로 원천의 대상을 붙여 주는 표현이고, 그래서 자연은 발견의 원천이다로 해석하면 자연스럽습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 16\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자연을 관찰하는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Observing \u003c/span>\u003cspan class=\"tgt\">nature\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만들 수 있다\u003c/span>\u003cspan class=\"en\">can \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인간의 삶을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">human \u003c/span>\u003cspan class=\"tgt\">life \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 나아지게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">better\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">자연을 관찰하면 인간의 삶이 더 나아질 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 1번 문장의 주장을 한 단계 구체화하는 \u003cb class=\"key\">근거 \u003c/b>\u003cb class=\"key\">문장\u003c/b>이에요. ‘관찰’이라는 행동이 인간의 삶을 \u003cb class=\"key\">긍정적으로 \u003c/b>\u003cb class=\"key\">변화\u003c/b>시킨다는 흐름을 만들어 줍니다. better는 good의 비교급으로, 앞 문장의 source 개념과 연결되어 관찰의 효용을 강조해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사 주어\u003c/span> : [동명사(구)] + [단수 동사] : \"자연을 관찰하는 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">5형식(make + 목적어 + 목적격 보어)\u003c/span> : make + [목적어] + [목적격 보어(형용사)] : \"인간의 삶을 더 나아지게 만들다\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"Observing nature, 자연을 관찰하는 것은. can make, 만들 수 있다. human life, 인간의 삶을. better, 더 나아지게. 이 문장 전체를 해석하면, 자연을 관찰하면 인간의 삶이 더 나아질 수 있다.","hl":"m"},{"n":17,"text":"이 문장은 첫 번째 문장의 주장을 한 단계 구체화하는 근거 문장이에요. 자연을 관찰하는 행동이 인간의 삶을 긍정적으로 변화시킨다는 흐름을 만들어 주죠. better가 good의 비교급이라는 점도 같이 기억해 두세요.","hl":"mn"},{"n":18,"text":"먼저 주어 자리에 Observing nature가 왔어요. 이건 동명사 주어로, 자연을 관찰하는 것이라는 뜻이죠. 동명사 주어는 단수 취급한다는 점이 시험 포인트예요. 다음으로 make human life better를 보면, make가 목적어 human life를 데리고 형용사 better를 목적격 보어로 쓰는 구조예요. 목적어를 ~하게 만들다로 해석하고, 이 자리에는 부사가 아니라 형용사가 온다는 것도 꼭 챙기세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 의미한다\u003c/span>\u003cspan class=\"en\">It means\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 삶이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">life \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 쉬워질 수 있다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">easier \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 더 편안해질 수 있다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">comfortable\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 우리의 삶이 더 쉽고 편안해질 수 있다는 것을 의미한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 2번 문장의 내용을 ‘더 쉽고 편안해진다’로 풀어 주는 \u003cb class=\"key\">부연 \u003c/b>\u003cb class=\"key\">설명\u003c/b> 문장이에요. 여기서 It은 앞 문장 전체, 즉 자연 관찰이 삶을 낫게 한다는 내용을 받는 \u003cb class=\"key\">대명사\u003c/b>입니다. easy와 comfortable이 병렬로 묶여 혜택을 두 방향에서 강조해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 명사절(목적어)\u003c/span> : [타동사 mean] + [that + 주어 + 동사 ~ (명사절/목적어)] : \"우리의 삶이 더 쉽고 편안해질 수 있다는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">비교급 형용사의 병렬\u003c/span> : [비교급 형용사] + and + [비교급 형용사] : \"더 쉽고 더 편안한\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"It means, 그것은 의미한다. that our life, 우리의 삶이. can be easier, 더 쉬워질 수 있다는 것을. and more comfortable, 그리고 더 편안해질 수 있다는 것을. 이 문장 전체를 해석하면, 그것은 우리의 삶이 더 쉽고 편안해질 수 있다는 것을 의미한다.","hl":"m"},{"n":20,"text":"이 문장은 두 번째 문장의 내용을 더 쉽고 편안해진다는 말로 풀어 주는 부연 설명이에요. 여기서 It은 앞 문장 전체, 그러니까 자연 관찰이 삶을 낫게 한다는 내용을 받는 대명사입니다. 대명사가 앞 문장 전체를 받는다는 점을 꼭 짚어 두세요.","hl":"mn"},{"n":21,"text":"먼저 It means 뒤에 that절이 왔죠. 여기서 that은 ~라는 것으로 해석되는 접속사이고, 절 전체가 mean의 목적어 역할을 해요. that절 안에서 our life가 주어, can be가 동사인 완전한 문장 구조인지도 확인해야 합니다. 다음으로 easier and more comfortable은 비교급 형용사 두 개가 and로 연결된 병렬 구조예요. 둘 다 be동사 뒤에서 주어의 상태를 설명하는 주격 보어 자리를 함께 쓰니까, 더 쉽고 더 편안한처럼 같은 자격으로 묶어 읽으면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들어,\u003c/span>\u003cspan class=\"en\">For example,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">특수 페인트는\u003c/span>\u003cspan class=\"en\">special paint\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분의 집을 유지할 수 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">keep \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">house \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">깨끗하게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">clean\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">예를 들어, 특수 페인트를 사용하면 여러분의 집을 깨끗하게 유지할 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 말한 '자연 관찰이 삶을 더 편하게 만든다'는 주장을 \u003cb class=\"key\">예시\u003c/b>로 뒷받침하는 문장이에요. 특수 페인트라는 구체적인 사례를 들어 내용의 \u003cb class=\"key\">실용성\u003c/b>을 보여 주죠. keep + 목적어 + 형용사 구조로 '집을 깨끗한 상태로 계속 유지한다'는 \u003cb class=\"key\">상태 \u003c/b>\u003cb class=\"key\">유지\u003c/b>의 의미를 담고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 can(가능·능력)\u003c/span> : [조동사 can] + [동사원형 keep] : \"유지할 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">5형식 동사 keep(목적격보어로 형용사)\u003c/span> : keep + [목적어 your house] + [형용사 clean(목적격보어)] : \"여러분의 집을 깨끗하게 유지하다\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"For example, 예를 들어. special paint, 특수 페인트는. can keep your house, 여러분의 집을 유지할 수 있다. clean, 깨끗하게. 이 문장 전체를 해석하면, 예를 들어, 특수 페인트를 사용하면 여러분의 집을 깨끗하게 유지할 수 있다.","hl":"m"},{"n":23,"text":"이 문장은 앞에서 말한 주장을 예시로 보여 주는 역할을 해요. 특수 페인트라는 구체적인 사례를 들어서 자연 관찰이 우리 삶을 편하게 만든다는 걸 증명하고 있죠. 여기서 핵심은 집을 깨끗한 상태로 계속 유지한다는 상태 유지의 의미예요.","hl":"mn"},{"n":24,"text":"첫 번째 어법 포인트는 조동사 can이에요. can 뒤에는 반드시 동사원형이 온다는 점을 꼭 기억하세요. 두 번째는 keep을 활용한 다섯 번째 형식 구조예요. keep your house clean처럼 목적어 뒤에 형용사 목적격보어가 와서 깨끗한 상태를 유지한다는 의미를 만들어요. 이때 clean 자리에 부사가 아니라 형용사가 온다는 것도 꼭 챙겨 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 16\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거친 표면이\u003c/span>\u003cspan class=\"en\">The rough surface\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">페인트의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">paint\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">밀어낸다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">pushes \u003c/span>\u003cspan class=\"tgt\">away\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">먼지를\u003c/span>\u003cspan class=\"en\">dust.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">페인트의 거친 표면이 먼지를 밀어낸다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 '특수 페인트'가 왜 집을 깨끗하게 유지하는지 그 \u003cb class=\"key\">원리\u003c/b>를 설명하는 문장이에요. 표면이 거칠어서 먼지가 달라붙지 못하고 밀려나간다는 거죠. 그래서 다음 문장에서 청소를 덜 해도 된다는 \u003cb class=\"key\">결과\u003c/b>로 자연스럽게 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 수식\u003c/span> : [명사 surface] + [전치사구 of the paint] : \"페인트의 (거친 표면)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">구동사(동사 + 부사)\u003c/span> : [동사 push] + [부사 away] = 구동사 push away : \"밀어내다\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"The rough surface, 거친 표면이. of the paint, 페인트의. pushes away, 밀어낸다. dust, 먼지를. 이 문장 전체를 해석하면, 페인트의 거친 표면이 먼지를 밀어낸다.","hl":"m"},{"n":26,"text":"이 문장은 앞 문장에서 나온 특수 페인트가 왜 집을 깨끗하게 유지하는지 그 원리를 설명하고 있어요. 표면이 거칠어서 먼지가 밀려나간다는 거죠. 그래서 다음 문장에서 청소를 덜 해도 된다는 결과로 자연스럽게 이어지는 흐름이에요.","hl":"mn"},{"n":27,"text":"첫 번째는 전치사구 of the paint가 앞에 있는 명사 surface를 뒤에서 꾸며 주는 구조예요. 페인트의 표면이라고 해석하면 자연스럽죠. 두 번째는 push away라는 구동사예요. 동사와 부사가 붙어서 밀어내다는 새로운 뜻을 만들어요. 목적어가 대명사일 때는 pushes it away처럼 동사와 부사 사이에 들어간다는 점도 같이 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 페인트를 쓰고 난 후에는,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">After \u003c/span>\u003cspan class=\"tgt\">using\u003c/span> this paint,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은 청소할 수 있다\u003c/span>\u003cspan class=\"en\">you can wash\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분 집의 외부를\u003c/span>\u003cspan class=\"en\">the outside of your house\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">덜 자주\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">less \u003c/span>\u003cspan class=\"tgt\">often\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 페인트를 쓰고 난 후에는 집의 외부를 덜 청소할 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 특수 페인트 덕분에 생기는 \u003cb class=\"key\">실생활 \u003c/b>\u003cb class=\"key\">이점\u003c/b>을 정리한 문장이에요. 집 바깥을 청소하는 \u003cb class=\"key\">횟수\u003c/b>가 줄어든다는 결과를 보여 주죠. 앞 문장의 원리 설명이 구체적인 편리함으로 이어지면서, 자연 관찰이 삶을 편하게 만든다는 처음 주장까지 완성됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 after + 동명사(using)\u003c/span> : [전치사 after] + [동명사 using] + [목적어 this paint] : \"이 페인트를 쓴 후에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\"> span>\u003cspan class=\"gn\">전치사구의 부사적 수식\u003c/span> : [명사 leaf] + [전치사구 under a microscope] : \"현미경 아래에서 (→ 현미경으로)\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"Look at, 보라. a lotus leaf, 연꽃잎을. under a microscope, 현미경으로.. 이 문장 전체를 해석하면, 현미경으로 연꽃잎을 보라.","hl":"m"},{"n":44,"text":"답을 알려면 말로만 듣지 말고 직접 관찰하라는 뜻이에요. 명령문으로 딱 잘라 말해서 독자의 행동을 이끌어 내죠. under a microscope는 현미경으로라고 옮기면 우리말이 자연스러워요.","hl":"mn"},{"n":45,"text":"첫 번째 어법 포인트는 명령문이에요. 주어 You를 생략하고 동사원형으로 시작하면 명령문이 되죠. 그래서 Look이 그대로 동사원형으로 쓰인 거예요. 두 번째로 under a microscope는 앞의 명사 leaf를 꾸미는 게 아니라 어떻게 보는지를 알려 주는 부사구예요. 그래서 현미경으로라고 해석하는 겁니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Then\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">너는 알 수 있다\u003c/span>\u003cspan class=\"en\">you \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">know\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 답을.\u003c/span>\u003cspan class=\"en\">the answer.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러면 답을 알 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞의 명령대로 현미경으로 보면 결과가 따라온다는 \u003cb class=\"key\">결과\u003c/b>를 제시해요. Then은 '\u003cb class=\"key\">그러면\u003c/b>'이라는 뜻으로 앞뒤 문장을 이어 주고, can은 '~할 수 있다'는 \u003cb class=\"key\">가능\u003c/b>을 나타내요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속부사 Then\u003c/span> : [문장 앞] + Then(그러면) + [주어 + 동사] : \"그러면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 can + 동사원형\u003c/span> : [조동사 can] + [동사원형 know] : \"알 수 있다\"\u003c
