<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터1 Reading 38 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터1 Reading 38","audioDir":"reading38_audio","preview":false,"count":55,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.668em\">Reading\u003cbr>38\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터1\u003c/div>\u003ch1>White Hat Hackers: Good Hackers Who Protect Us\u003c/h1>\u003ch2>화이트 햇 해커: 우리를 지키는 선한 해커\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>해킹은 무조건 나쁜 것이 아니라, \u003cb class=\"key\">목적\u003c/b>과 \u003cb class=\"key\">법\u003c/b> 준수 여부에 따라 선한 해커와 악한 해커로 나뉜다. 화이트 햇 해커는 자신들의 기술로 \u003cb class=\"key\">보안\u003c/b> 문제를 찾아 해결하며, Marc Maiffret처럼 우리의 \u003cb class=\"key\">개인 \u003c/b>\u003cb class=\"key\">정보\u003c/b>를 보호하는 데 중요한 역할을 한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>White hat hackers use their hacking skills legally to find and fix security problems, playing an important role in protecting our personal information.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 볼 지문은 리딩마스터 원의 Reading 서른여덟 번째 지문이에요. 제목은 White Hat Hackers, 우리를 지키는 선한 해커에 관한 글이죠. 해킹이라고 하면 다 나쁜 것만 떠오르는데, 이 글은 그 통념을 정면으로 뒤집습니다. 핵심은 간단해요. 같은 기술이라도 목적과 법을 지키느냐에 따라 선한 해커가 될 수도 있다는 거예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">해킹(hacking)은 컴퓨터 시스템의 허점을 파고드는 기술이라서 흔히 나쁜 행동으로만 여겨지기 쉽다. 그런데 같은 기술도 왜 쓰느냐에 따라 전혀 다른 결과를 만든다. 남의 정보를 빼내면 범죄가 되지만, 허술한 곳을 미리 찾아 알려 주면 오히려 큰 도움이 된다. 우리 집 현관 잠금장치가 헐거운지 몰래 살펴보고 열쇠 주인에게 알려 주는 사람을 생각해 보면 이해가 쉽다. 이렇게 선한 목적으로 활동하는 사람을 \u003cb class=\"key\">화이트 \u003c/b>\u003cb class=\"key\">햇 \u003c/b>\u003cb class=\"key\">해커\u003c/b>(white hat hacker)라 부르고, 반대로 \u003cb class=\"key\">개인 \u003c/b>\u003cb class=\"key\">정보\u003c/b>나 돈을 노리는 쪽을 블랙 햇 해커(black hat hacker)라 부른다. 소프트웨어의 \u003cb class=\"key\">약점\u003c/b>(weak point, 취약점)을 먼저 발견해 고치는 일은 오늘날 \u003cb class=\"key\">보안\u003c/b>(security) 산업의 핵심이 되었다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식부터 짚고 갈게요. 해킹은 컴퓨터 시스템의 허술한 곳을 파고드는 기술이라서 흔히 나쁜 행동으로만 여겨지죠. 그런데 같은 기술도 왜 쓰느냐에 따라 결과가 완전히 달라져요. 남의 정보를 빼내면 범죄지만, 허술한 곳을 미리 찾아 알려 주면 오히려 큰 도움이 됩니다. 우리 집 현관 잠금장치가 헐거운지 살펴보고 주인에게 알려 주는 사람을 떠올려 보세요. 이렇게 선한 목적으로 활동하는 사람을 화이트 햇 해커라고 부르고, 개인 정보나 돈을 노리는 쪽을 블랙 햇 해커라고 불러요. 소프트웨어의 약점을 먼저 발견해서 고치는 일이 오늘날 보안 산업의 핵심이라는 점도 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>질문과 답\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>글은 \u003cb class=\"key\">해킹\u003c/b>이 항상 나쁜 것인지 묻는 질문으로 시작한다. 그리고 곧바로 선한 해커, 즉 \u003cb class=\"key\">화이트 \u003c/b>\u003cb class=\"key\">햇 \u003c/b>\u003cb class=\"key\">해커\u003c/b>가 있다고 답한다. 질문을 던지고 바로 답을 붙여 \u003cb class=\"key\">통념\u003c/b>을 흔드는 도입부다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>화이트 햇의 조건\u003csmall>정의 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>화이트 햇 해커는 자신들의 해킹 기술로 \u003cb class=\"key\">보안\u003c/b>과 관련된 문제를 찾는다. 이들은 \u003cb class=\"key\">블랙 \u003c/b>\u003cb class=\"key\">햇 \u003c/b>\u003cb class=\"key\">해커\u003c/b>와 다르며, 해킹할 때 \u003cb class=\"key\">법\u003c/b>을 준수한다. 즉 기술이 아니라 목적과 규칙이 이 둘을 구분한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>이름의 유래\u003csmall>근거 · 문장 6–8\u003c/small>\u003c/h4>\u003cp>‘화이트 햇’이라는 이름은 미국의 \u003cb class=\"key\">거친 \u003c/b>\u003cb class=\"key\">서부\u003c/b> 시대를 다룬 오래된 영화에서 왔다. 그 영화에서 \u003cb class=\"key\">영웅\u003c/b>은 흰 모자를 쓰고 나쁜 사람은 검은 모자를 썼다. 이 상징이 오늘날의 \u003cb class=\"key\">선한 \u003c/b>\u003cb class=\"key\">해커\u003c/b>에게 그대로 이어졌다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>인물 예시\u003csmall>예시 · 문장 9–13\u003c/small>\u003c/h4>\u003cp>\u003cb class=\"key\">Marc \u003c/b>\u003cb class=\"key\">Maiffret\u003c/b>은 유명한 화이트 햇 해커 중 한 명이다. 그는 Microsoft 소프트웨어의 큰 \u003cb class=\"key\">약점\u003c/b>을 발견했는데, 그대로 두면 블랙 햇 해커가 침입해 데이터를 훔칠 수 있었다. 그러나 그는 Microsoft가 문제를 \u003cb class=\"key\">해결\u003c/b>하도록 돕고 소프트웨어를 보호하는 새 프로그램을 만들었다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>의미와 결론\u003csmall>결론 · 문장 14\u003c/small>\u003c/h4>\u003cp>우리는 인터넷을 많이 사용하기 때문에 이런 \u003cb class=\"key\">화이트 \u003c/b>\u003cb class=\"key\">햇 \u003c/b>\u003cb class=\"key\">해커\u003c/b>의 역할이 커졌다. 이들은 우리의 \u003cb class=\"key\">개인 \u003c/b>\u003cb class=\"key\">정보\u003c/b>를 보호하는 데 중요한 역할을 한다. 결국 해킹 기술도 \u003cb class=\"key\">목적\u003c/b>에 따라 얼마든지 선해질 수 있음을 보여 준다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 질문에서 결론까지 다섯 단계로 따라가 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 질문과 답이에요. 글은 해킹이 항상 나쁜 것인지 묻는 질문으로 시작해요. 그리고 곧바로 선한 해커, 즉 화이트 햇 해커가 있다고 답하죠. 질문을 던지고 바로 답을 붙여서 우리가 가진 통념을 흔드는 아주 영리한 도입부예요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 화이트 햇의 조건이에요. 화이트 햇 해커는 자신들의 해킹 기술로 보안과 관련된 문제를 찾습니다. 이들은 블랙 햇 해커와 다르고, 해킹할 때 법을 준수한다는 점이 결정적이에요. 결국 기술이 아니라 목적과 규칙이 이 둘을 구분한다는 거죠.","hl":"f1"},{"n":6,"text":"세 번째 단계는 이름의 유래예요. 화이트 햇이라는 이름은 미국의 거친 서부 시대를 다룬 오래된 영화에서 왔어요. 그 영화에서 영웅은 흰 모자를 쓰고 나쁜 사람은 검은 모자를 썼죠. 이 상징이 오늘날의 선한 해커에게 그대로 이어졌다는 설명이 참 재미있습니다.","hl":"f2"},{"n":7,"text":"네 번째 단계는 인물 예시예요. Marc Maiffret은 유명한 화이트 햇 해커 중 한 명이에요. 그는 Microsoft 소프트웨어의 큰 약점을 발견했는데, 그대로 두면 블랙 햇 해커가 침입해서 데이터를 훔칠 수 있었어요. 그러나 그는 Microsoft가 문제를 해결하도록 돕고 소프트웨어를 보호하는 새 프로그램을 만들었습니다.","hl":"f3"},{"n":8,"text":"다섯 번째 단계는 의미와 결론이에요. 우리는 인터넷을 많이 사용하기 때문에 이런 화이트 햇 해커의 역할이 훨씬 커졌어요. 이들은 우리의 개인 정보를 보호하는 데 중요한 역할을 합니다. 결국 해킹 기술도 목적에 따라 얼마든지 선해질 수 있다는 점을 확인시켜 주는 결론이에요.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">질문-답변 및 비교·대조, 예시\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 2번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 던진 질문에 두 번째 문장이 곧바로 답하면서 \u003cb class=\"key\">주제\u003c/b>를 앞세운다. 이어 화이트 햇과 \u003cb class=\"key\">블랙 \u003c/b>\u003cb class=\"key\">햇 \u003c/b>\u003cb class=\"key\">해커\u003c/b>를 목적과 \u003cb class=\"key\">법\u003c/b> 준수라는 기준으로 대조해 개념을 선명하게 만든다. 중반에는 이름의 유래라는 \u003cb class=\"key\">비유\u003c/b>적 근거를, 후반에는 Marc Maiffret이라는 구체적 \u003cb class=\"key\">예시\u003c/b>를 붙여 신뢰를 더한다. 마지막 문장은 앞의 내용을 아우르며 \u003cb class=\"key\">개인 \u003c/b>\u003cb class=\"key\">정보\u003c/b> 보호라는 의의로 글을 닫는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Is hacking always bad? (1)\u003c/b>\u003cspan>질문 제기\u003c/span>\u003cb>different from (4)\u003c/b>\u003cspan>대조\u003c/span>\u003cb>So (8)\u003c/b>\u003cspan>정리·결과\u003c/span>\u003cb>But (12)\u003c/b>\u003cspan>전환·반전\u003c/span>\u003cb>Since (14)\u003c/b>\u003cspan>이유·결론\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">good hackers\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">white hat hackers\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Heroes in those movies\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">today's good hackers\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">famous white hat hackers\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a white hat hacker like Maiffret\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>화이트 햇 해커\u003c/th>\u003cth>블랙 햇 해커\u003c/th>\u003c/tr>\u003ctr>\u003ctd>보안 문제를 찾아 알려 줌\u003c/td>\u003ctd>소프트웨어에 침입해 데이터를 훔침\u003c/td>\u003c/tr>\u003ctr>\u003ctd>해킹할 때 법을 준수함\u003c/td>\u003ctd>법을 어기고 개인 정보를 노림\u003c/td>\u003c/tr>\u003ctr>\u003ctd>영웅, 흰 모자로 상징됨\u003c/td>\u003ctd>악당, 검은 모자로 상징됨\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글은 질문과 답변으로 시작해서 두 대상을 비교하고 대조한 뒤, 구체적인 예시를 붙이는 전개 방식이에요. 첫 문장에서 던진 질문에 두 번째 문장이 바로 답을 하면서 주제를 앞세우는 두괄식 구조죠. 그래서 주제문은 두 번째 문장으로 잡으면 됩니다. 마지막 문장은 앞의 내용을 아우르는 결론 역할을 해요.","hl":"ty"},{"n":10,"text":"신호어를 눈여겨보세요. 첫 번째 문장의 의문문이 질문을 던지고, 네 번째 문장의 different from이 두 집단을 갈라놓는 대조 신호예요. 여덟 번째 문장의 So는 앞의 비유를 정리하는 표지이고, 열두 번째 문장의 But은 흐름을 반전시키는 아주 중요한 신호입니다. 마지막 문장의 Since는 이유를 붙여 결론을 단단하게 만들어 주죠.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>hacking\u003c/b>\u003cem>명사\u003c/em>\u003cspan>해킹\u003c/span>\u003c/div>\u003cdiv>\u003cb>security\u003c/b>\u003cem>명사\u003c/em>\u003cspan>보안\u003c/span>\u003c/div>\u003cdiv>\u003cb>find\u003c/b>\u003cem>동사\u003c/em>\u003cspan>찾다, 발견하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>problem\u003c/b>\u003cem>명사\u003c/em>\u003cspan>문제\u003c/span>\u003c/div>\u003cdiv>\u003cb>be different from\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~와 다르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>follow the law\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>법을 준수하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>law\u003c/b>\u003cem>명사\u003c/em>\u003cspan>법\u003c/span>\u003c/div>\u003cdiv>\u003cb>old\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>오래된\u003c/span>\u003c/div>\u003cdiv>\u003cb>hero\u003c/b>\u003cem>명사\u003c/em>\u003cspan>영웅\u003c/span>\u003c/div>\u003cdiv>\u003cb>wear\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(모자를) 쓰다, 착용하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>bad guy\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>나쁜 사람, 악당\u003c/span>\u003c/div>\u003cdiv>\u003cb>today\u003c/b>\u003cem>부사\u003c/em>\u003cspan>오늘날\u003c/span>\u003c/div>\u003cdiv>\u003cb>famous\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>유명한\u003c/span>\u003c/div>\u003cdiv>\u003cb>weak point\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>약점, 취약점\u003c/span>\u003c/div>\u003cdiv>\u003cb>software\u003c/b>\u003cem>명사\u003c/em>\u003cspan>소프트웨어\u003c/span>\u003c/div>\u003cdiv>\u003cb>get into\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>침입하다, 들어가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>steal\u003c/b>\u003cem>동사\u003c/em>\u003cspan>훔치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>data\u003c/b>\u003cem>명사\u003c/em>\u003cspan>데이터, 정보\u003c/span>\u003c/div>\u003cdiv>\u003cb>solve\u003c/b>\u003cem>동사\u003c/em>\u003cspan>해결하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>help\u003c/b>\u003cem>동사\u003c/em>\u003cspan>돕다\u003c/span>\u003c/div>\u003cdiv>\u003cb>program\u003c/b>\u003cem>명사\u003c/em>\u003cspan>프로그램\u003c/span>\u003c/div>\u003cdiv>\u003cb>protect\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보호하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>make\u003c/b>\u003cem>동사\u003c/em>\u003cspan>만들다\u003c/span>\u003c/div>\u003cdiv>\u003cb>since\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>~이기 때문에\u003c/span>\u003c/div>\u003cdiv>\u003cb>use\u003c/b>\u003cem>동사\u003c/em>\u003cspan>사용하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>a lot\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>많이\u003c/span>\u003c/div>\u003cdiv>\u003cb>the Internet\u003c/b>\u003cem>명사\u003c/em>\u003cspan>인터넷\u003c/span>\u003c/div>\u003cdiv>\u003cb>play an important role in\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에서 중요한 역할을 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>personal information\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>개인 정보\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"핵심 단어 몇 개만 짚어 볼게요. weak point는 약점, 취약점이라는 뜻이고, get into는 침입하다라는 의미로 나왔어요. solve는 해결하다, protect는 보호하다라는 뜻이고, play an important role in은 중요한 역할을 하다라는 숙어입니다. personal information은 개인 정보라는 표현이니 꼭 통째로 외워 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">protect\u003c/b>\u003cspan class=\"m\">보호하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">defend\u003c/span>\u003cspan class=\"s\">guard\u003c/span>\u003cspan class=\"s\">shield\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">attack\u003c/span>\u003cspan class=\"a\">harm\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">famous\u003c/b>\u003cspan class=\"m\">유명한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">well-known\u003c/span>\u003cspan class=\"s\">renowned\u003c/span>\u003cspan class=\"s\">noted\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unknown\u003c/span>\u003cspan class=\"a\">obscure\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">solve\u003c/b>\u003cspan class=\"m\">해결하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">resolve\u003c/span>\u003cspan class=\"s\">settle\u003c/span>\u003cspan class=\"s\">fix\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">steal\u003c/b>\u003cspan class=\"m\">훔치다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">take\u003c/span>\u003cspan class=\"s\">rob\u003c/span>\u003cspan class=\"s\">snatch\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">give\u003c/span>\u003cspan class=\"a\">return\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">problem\u003c/b>\u003cspan class=\"m\">문제\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">issue\u003c/span>\u003cspan class=\"s\">trouble\u003c/span>\u003cspan class=\"s\">difficulty\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">solution\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">weak\u003c/b>\u003cspan class=\"m\">약한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">fragile\u003c/span>\u003cspan class=\"s\">vulnerable\u003c/span>\u003cspan class=\"s\">feeble\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">strong\u003c/span>\u003cspan class=\"a\">solid\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">important\u003c/b>\u003cspan class=\"m\">중요한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">significant\u003c/span>\u003cspan class=\"s\">crucial\u003c/span>\u003cspan class=\"s\">essential\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">trivial\u003c/span>\u003cspan class=\"a\">minor\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어로 정리해 볼게요. protect는 defend, guard와 뜻이 가깝고 attack, harm이 반대말이에요. famous는 well-known, renowned와 바꿔 쓸 수 있고 반대말은 unknown입니다. solve는 resolve, fix로 바꿀 수 있고, steal은 take, rob과 가까우며 give, return이 반대말이죠. problem의 반대말은 solution, weak의 반대말은 strong이라는 점도 함께 기억해 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">해킹은 ~인가?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Is \u003c/span>\u003cspan class=\"tgt\">hacking\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">항상 나쁜\u003c/span>\u003cspan class=\"en\">always bad?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">해킹은 항상 나쁠까?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글의 첫 문장에서 \u003cb class=\"key\">질문\u003c/b>을 던져 독자의 관심을 끄는 도입 역할을 해요. hacking을 부정적으로만 보는 \u003cb class=\"key\">고정관념\u003c/b>에 의문을 제기하며, 뒤에서 다룰 '선한 해커' 이야기의 \u003cb class=\"key\">배경\u003c/b>을 만들어 주는 거죠. always라는 부사가 '예외 없이 전부'라는 뜻이라, 바로 다음 문장에서 예외를 보여 줄 준비를 하는 겁니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사 의문문(도치)\u003c/span> : Is + [주어] + [보어]? → 평서문 Hacking is ~ 에서 주어와 be동사가 [[도치]] : \"해킹은 ~인가?\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"Is hacking, 해킹은 ~인가?. always bad?, 항상 나쁜. 이 문장 전체를 해석하면, 해킹은 항상 나쁠까?","hl":"m"},{"n":14,"text":"이 문장은 글의 첫 시작에서 질문을 던져서 독자의 관심을 확 끄는 역할을 해요. 해킹 하면 나쁜 것만 떠올리는 고정관념에 의문을 던지는 거죠. always가 들어 있으니까 예외 없이 전부 나쁘냐고 묻는 거고, 바로 다음 문장에서 그 예외를 보여 주게 됩니다.","hl":"mn"},{"n":15,"text":"여기서 어법 포인트는 be동사 의문문의 도치예요. 평서문 Hacking is always bad에서 be동사 Is가 주어 앞으로 나오면서 도치가 일어난 겁니다. 그래서 Is hacking always bad라는 어순이 되는 거예요. 의문문에서는 be동사나 조동사가 주어 앞으로 온다는 것, 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~이 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">are\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">선한 해커들이,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">good \u003c/span>\u003cspan class=\"tgt\">hackers, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">화이트 햇 해커들인\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">white \u003c/span>\u003cspan class=\"tgt\">hat \u003c/span>\u003cspan class=\"tgt\">hackers\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">선한 해커, 즉 화이트 햇 해커도 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 질문에 대한 \u003cb class=\"key\">답\u003c/b>을 주는 문장이에요. '해킹은 항상 나쁘다'는 생각에 반례를 제시하며 \u003cb class=\"key\">긍정적\u003c/b>인 해커의 존재를 알리는 거죠. 뒤에 콤마로 이어 붙인 white hat hackers는 good hackers를 그대로 다시 말해 주는 \u003cb class=\"key\">동격\u003c/b> 표현입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">There is/are 구문(유도부사)\u003c/span> : There + be동사 + [주어] : '~이 있다'라는 [[존재]] 표현 : \"~이 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동격(콤마 동격)\u003c/span> : [명사구], [명사구] : 뒤 명사구가 앞 명사구를 [[부연 설명]] : \"선한 해커, 즉 화이트 햇 해커\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"There are, ~이 있다. good hackers, 선한 해커들이. white hat hackers, 화이트 햇 해커들인. 이 문장 전체를 해석하면, 선한 해커, 즉 화이트 햇 해커도 있다.","hl":"m"},{"n":17,"text":"이 문장은 앞에서 던진 질문에 대한 답을 주는 문장이에요. 해킹이 항상 나쁘지만은 않다는 걸 긍정적인 해커의 존재로 보여 주는 거죠. 뒤에 붙은 white hat hackers는 good hackers를 다시 풀어 말해 주는 동격 표현이라, 두 표현이 같은 사람들을 가리킨다고 보시면 됩니다.","hl":"mn"},{"n":18,"text":"첫 번째 포인트는 There are 구문이에요. 여기서 There는 '거기'라는 뜻이 아니라 주어의 존재를 이끌어 주는 유도부사이고, 주어 good hackers가 복수라서 be동사가 are로 수 일치 된 겁니다. 두 번째 포인트는 콤마 동격이에요. 콤마 뒤 white hat hackers가 앞의 good hackers를 부연 설명해 주는 구조죠. 그래서 '즉'이라는 말로 자연스럽게 이어서 해석하면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 사용한다\u003c/span>\u003cspan class=\"en\">They use\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신들의 해킹 기술을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">their\u003c/span> hacking skills\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">찾기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">find\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몇몇 문제들을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">some \u003c/span>\u003cspan class=\"tgt\">problems \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보안과 관련된\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">security\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 자신들의 해킹 기술을 사용하여 보안과 관련된 문제를 찾는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 화이트 햇 해커의 \u003cb class=\"key\">구체적 \u003c/b>\u003cb class=\"key\">활동\u003c/b>을 설명하는 문장이에요. 기술을 나쁜 데 쓰는 게 아니라 문제를 \u003cb class=\"key\">발견\u003c/b>하는 데 쓴다는 점을 보여 주죠. to find는 '찾기 위해'라는 \u003cb class=\"key\">목적\u003c/b>을 나타내고, with security는 어떤 문제인지 범위를 좁혀 주는 표현입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">소유격 대명사\u003c/span> : their + gs":[{"n":25,"text":"They, 그들은. follow the law, 법을 준수한다. when they hack, 해킹할 때. 이 문장 전체를 해석하면, 그들은 해킹할 때 법을 준수한다.","hl":"m"},{"n":26,"text":"이 문장은 화이트 햇 해커가 해킹을 해도 법을 지킨다는 점을 말해요. 앞에서 말한 블랙 햇 해커와의 차이를 행동 기준으로 구체화하는 거죠.","hl":"mn"},{"n":27,"text":"when they hack은 시간 부사절이에요. when이 때를 나타내면서 뒤에 주어 they와 동사 hack이 와서 해킹하는 시점을 보여 주죠. 주절의 follow the law와 연결되어 법을 지키는 상황을 설명해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘하얀 모자’ 해커라는 이름은\u003c/span>\u003cspan class=\"en\">The name &quot;white hat&quot; hacker\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">비롯된다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">from\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오래된 미국 영화들에서\u003c/span>\u003cspan class=\"en\">old American movies\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 나라의 ‘거친 서부’ 시대에 관한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">about \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">country's \u003c/span>\u003cspan class=\"tgt\">&quot;Wild \u003c/span>\u003cspan class=\"tgt\">West&quot; \u003c/span>\u003cspan class=\"tgt\">days\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">‘하얀 모자’ 해커의 이름은 미국 “거친 서부” 시대에 대한 오래된 미국 영화에서 따왔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 ‘화이트 햇’이라는 \u003cb class=\"key\">별칭\u003c/b>이 어디서 왔는지 알려 주는 \u003cb class=\"key\">유래\u003c/b> 설명이에요. 옛 미국 영화에서 좋은 사람은 흰 모자, 나쁜 사람은 검은 모자를 썼다는 배경을 깔아 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be from 구문(유래·출처)\u003c/span> : 주어 + be from + 출처 : \"~에서 비롯되다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 about의 형용사적 수식\u003c/span> : 명사 + about + 명사구 : \"그 나라의 ‘거친 서부’ 시대에 관한\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"The name \"white hat\" hacker, ‘하얀 모자’ 해커라는 이름은. is from, 비롯된다. old American movies, 오래된 미국 영화들에서. about the country's \"Wild West\" days, 그 나라의 ‘거친 서부’ 시대에 관한. 이 문장 전체를 해석하면, ‘하얀 모자’ 해커의 이름은 미국 “거친 서부” 시대에 대한 오래된 미국 영화에서 따왔다.","hl":"m"},{"n":29,"text":"이 문장은 화이트 햇이라는 별칭이 어디서 왔는지 알려 주는 유래 설명이에요. 옛 미국 영화에서 좋은 사람은 흰 모자, 나쁜 사람은 검은 모자를 썼다는 배경을 깔아 주죠.","hl":"mn"},{"n":30,"text":"is from은 이름이나 사물이 어디에서 왔는지, 즉 출처를 나타내는 표현이에요. 여기서는 화이트 햇이라는 이름의 유래를 말하죠. about은 앞의 old American movies를 뒤에서 꾸며 주는 전치사로, 영화의 소재가 무엇인지 설명해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 영화들 속 영웅들은\u003c/span>\u003cspan class=\"en\">Heroes \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">those \u003c/span>\u003cspan class=\"tgt\">movies\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">흰 모자를 썼다,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">wore\u003c/span> white hats,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 나쁜 사람들은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">and\u003c/span> the bad guys\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">검은 모자를 썼다.\u003c/span>\u003cspan class=\"en\">wore black hats.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이런 영화에서 영웅들은 흰 모자를 쓰고 나쁜 사람들은 검은 모자를 썼다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 white hat과 black hat이라는 표현이 \u003cb class=\"key\">옛 \u003c/b>\u003cb class=\"key\">영화\u003c/b>에서 나왔음을 보여 줍니다. 영웅에게는 \u003cb class=\"key\">흰 \u003c/b>\u003cb class=\"key\">모자\u003c/b>, 악당에게는 \u003cb class=\"key\">검은 \u003c/b>\u003cb class=\"key\">모자\u003c/b>를 씌워 선과 악을 쉽게 구분한 거죠. 이 대비가 오늘날 해커를 나누는 상징으로 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 수식\u003c/span> : Heroes + [in those movies] : \"그 영화들 속의 영웅들은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거시제\u003c/span> : wear의 과거형 [wore] + 목적어 : \"썼다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">등위접속사\u003c/span> : [Heroes ... wore ...] and [the bad guys ... wore ...] : \"그리고\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"Heroes in those movies, 그 영화들 속 영웅들은. wore white hats, 흰 모자를 썼다. and the bad guys, 그리고 나쁜 사람들은. wore black hats, 검은 모자를 썼다.. 이 문장 전체를 해석하면, 이런 영화에서 영웅들은 흰 모자를 쓰고 나쁜 사람들은 검은 모자를 썼다.","hl":"m"},{"n":32,"text":"이 문장은 white hat과 black hat이라는 표현이 옛 영화에서 나왔다는 걸 알려 줘요. 영화에서 영웅에게는 흰 모자를, 악당에게는 검은 모자를 씌워 선과 악을 쉽게 구분했던 거죠. 이 대비가 오늘날 해커를 나누는 상징으로 이어진다는 점을 기억해 두세요.","hl":"mn"},{"n":33,"text":"첫 번째로 in those movies는 Heroes를 뒤에서 꾸며 주는 전치사구예요. 두 번째로 wore는 과거형이라서 옛 영화 속 이야기를 나타내요. 세 번째로 and는 두 절을 대등하게 이어 주는 등위접속사이고, 영웅과 악당의 모자 색을 대조해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서, 오늘날의 선한 해커들은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">So,\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">today's \u003c/span>\u003cspan class=\"tgt\">good \u003c/span>\u003cspan class=\"tgt\">hackers\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘하얀 모자’ 해커가 되었다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">became \u003c/span>\u003cspan class=\"tgt\">'white \u003c/span>\u003cspan class=\"tgt\">hat' \u003c/span>\u003cspan class=\"tgt\">hackers\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그래서 오늘날의 선한 해커는 ‘하얀 모자’ 해커가 되었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 설명한 흰 모자와 검은 모자의 상징이 오늘날 해커 분류로 이어지는 \u003cb class=\"key\">결과\u003c/b>를 정리합니다. 선한 해커가 \u003cb class=\"key\">화이트 \u003c/b>\u003cb class=\"key\">햇\u003c/b>이라는 이름으로 불리게 된 흐름을 보여 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속부사\u003c/span> : [So,] + 완전한 문장 : \"그래서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">소유격\u003c/span> : [today's] + [good hackers] : \"오늘날의 선한 해커들은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">상태 변화 동사(주격 보어)\u003c/span> : became + [주격 보어] : \"‘하얀 모자’ 해커가 되었다\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"So, today's good hackers, 그래서, 오늘날의 선한 해커들은. became 'white hat' hackers, ‘하얀 모자’ 해커가 되었다.. 이 문장 전체를 해석하면, 그래서 오늘날의 선한 해커는 ‘하얀 모자’ 해커가 되었다.","hl":"m"},{"n":35,"text":"앞에서 설명한 흰 모자와 검은 모자의 상징이 오늘날 해커 분류로 이어지는 결과를 정리하는 문장이에요. 선한 해커가 화이트 햇이라는 이름으로 불리게 된 흐름을 보여 주죠.","hl":"mn"},{"n":36,"text":"첫 번째로 So는 앞 문장의 내용을 결과로 이어 주는 접속부사예요. 두 번째로 today's는 오늘날의라는 소유격 표현이고, 세 번째로 became은 상태 변화를 나타내는 동사로 뒤의 명사구가 주격 보어 역할을 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Marc Maiffret은\u003c/span>\u003cspan class=\"en\">Marc Maiffret\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~중 한 명이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">of\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유명한 화이트 햇 해커들.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">famous \u003c/span>\u003cspan class=\"tgt\">white \u003c/span>\u003cspan class=\"tgt\">hat \u003c/span>\u003cspan class=\"tgt\">hackers\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Marc Maiffret은 유명한 화이트 햇 해커 중 한 명이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 화이트 햇 해커의 \u003cb class=\"key\">구체적 \u003c/b>\u003cb class=\"key\">예\u003c/b>로 Marc Maiffret을 제시합니다. 그가 유명한 \u003cb class=\"key\">화이트 \u003c/b>\u003cb class=\"key\">햇\u003c/b> 해커 중 한 명임을 밝혀, 뒤에 이어질 그의 보안 문제 해결 사례를 소개하는 \u003cb class=\"key\">발판\u003c/b>이 되어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">one of 표현\u003c/span> : 주어 + is one of + [the + 형용사 + 복수명사] : \"~중 한 명이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">형용사 + 복수명사\u003c/span> : the + [famous] + [white hat hackers] : \"유명한 화이트 햇 해커들\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"Marc Maiffret, Marc Maiffret은. is one of, ~중 한 명이다. the famous white hat hackers, 유명한 화이트 햇 해커들.. 이 문장 전체를 해석하면, Marc Maiffret은 유명한 화이트 햇 해커 중 한 명이다.","hl":"m"},{"n":38,"text":"이 문장은 화이트 햇 해커의 구체적 예로 Marc Maiffret을 제시해요. 그가 유명한 화이트 햇 해커 중 한 명임을 밝혀서, 뒤에 이어질 그의 보안 문제 해결 사례를 소개하는 발판이 되어 줍니다.","hl":"mn"},{"n":39,"text":"첫 번째로 is one of는 뒤에 복수명사가 와서 여럿 중 하나라는 뜻을 만들어요. 주어인 Marc Maiffret이 단수라서 동사는 is로 쓰였죠. 두 번째로 the famous white hat hackers에서는 famous가 뒤의 명사를 꾸미고, hackers가 복수명사로 one of의 뒤를 받쳐 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는\u003c/span>\u003cspan class=\"en\">He\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">발견했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">found \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">큰 약점을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">big \u003c/span>\u003cspan class=\"tgt\">weak \u003c/span>\u003cspan class=\"tgt\">point\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Microsoft 소프트웨어에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">Microsoft \u003c/span>\u003cspan class=\"tgt\">software\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 Microsoft 소프트웨어의 큰 약점을 발견했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 화이트 햇 해커 Marc Maiffret이 실제로 무엇을 했는지 구체적으로 보여 주는 대목이에요. 여기서 \u003cb class=\"key\">weak \u003c/b>\u003cb class=\"key\">point\u003c/b>는 단순한 '약점'이 아니라 소프트웨어의 \u003cb class=\"key\">보안\u003c/b>이 뚫릴 수 있는 구멍을 뜻해요. 그래서 다음 문장에서 블랙 햇 해커들이 이 구멍을 노렸다는 이야기로 자연스럽게 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">3형식 타동사구(목적어 포함)\u003c/span> : [주어 He] + [타동사 found] + [목적어 a big weak point] : \"큰 약점을 발견했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 수식\u003c/span> : [명사 weak point] + [전치사 in + 명사(Microsoft software)] : \"Microsoft 소프트웨어에서(의)\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"He, 그는. found, 발견했다. a big weak point, 큰 약점을. in Microsoft software, Microsoft 소프트웨어에서. 이 문장 전체를 해석하면, 그는 Microsoft 소프트웨어의 큰 약점을 발견했다.","hl":"m"},{"n":41,"text":"이 문장은 화이트 햇 해커 Marc Maiffret이 실제로 무엇을 했는지 보여 주는 대목이에요. 여기서 weak point는 그냥 약점이 아니라 소프트웨어의 보안이 뚫릴 수 있는 구멍을 말하죠. 그래서 다음 문장에서 블랙 햇 해커들이 이 구멍을 노렸다는 이야기로 자연스럽게 이어집니다.","hl":"mn"},{"n":42,"text":"먼저 found는 발견하다라는 타동사라서 뒤에 목적어가 꼭 필요해요. 그래서 a big weak point가 목적어 자리에 온 거죠. 그리고 in Microsoft software는 전치사구인데, 앞에 있는 명사 weak point를 뒤에서 꾸며 주는 형용사적 역할을 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 문제 때문에,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Because \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">problem\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">블랙 햇 해커들이\u003c/span>\u003cspan class=\"en\">black hat hackers\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 소프트웨어에 침입할 수도 있었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">could \u003c/span>\u003cspan class=\"tgt\">get \u003c/span>\u003cspan class=\"tgt\">into \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">software\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그 데이터를 훔칠 수도 있었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">steal \u003c/span>\u003cspan class=\"tgt\">its \u003c/span>\u003cspan class=\"tgt\">data\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 문제 때문에 블랙 햇 해커가 그 소프트웨어에 침입하여 데이터를 훔칠 수도 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 발견된 약점이 실제로 어떤 위험을 만들 수 있었는지 설명하는 문장이에요. 그 문제 때문에 블랙 햇 해커들이 침입해서 데이터를 훔칠 수도 있었다는 뜻이죠. 여기서 \u003cb class=\"key\">could\u003c/b>는 단순한 과거가 아니라 '~할 수도 있었다'라는 \u003cb class=\"key\">가능성\u003c/b>의 추측을 담고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구(because of + 명사)\u003c/span> : Because of + [명사구] , [주어] + [동사] : \"이 문제 때문에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 could + 동사원형\u003c/span> : [조동사 could] + [동사원형 get] + [전치사구 into the software] : \"그 소프트웨어에 침입할 수도 있었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동사원형 병렬(and)\u003c/span> : [get into ~] + and + [steal ~] : \"그리고 그 데이터를 훔치다\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"Because of this problem, 이 문제 때문에. black hat hackers, 블랙 햇 해커들이. could get into the software, 그 소프트웨어에 침입할 수도 있었다. and steal its data, 그리고 그 데이터를 훔칠 수도 있었다. 이 문장 전체를 해석하면, 이 문제 때문에 블랙 햇 해커가 그 소프트웨어에 침입하여 데이터를 훔칠 수도 있었다.","hl":"m"},{"n":44,"text":"앞 문장에서 발견된 약점이 실제로 어떤 위험을 만들 수 있었는지 설명하는 문장이에요. 그 문제 때문에 블랙 햇 해커들이 침입해서 데이터를 훔칠 수도 있었다는 뜻이죠. 여기서 could는 단순한 과거가 아니라 가능성, 즉 ~할 수도 있었다는 추측을 담고 있습니다.","hl":"mn"},{"n":45,"text":"먼저 Because of this problem을 보면, because는 접속사라서 뒤에 절이 오지만 because of는 전치사라서 뒤에 명사구가 와요. 그래서 this problem이 그대로 온 거죠. 두 번째로 could는 조동사라서 뒤에 동사원형 get이 왔고, 여기서는 과거에 대한 추측으로 ~할 수도 있었다는 뜻이에요. 마지막으로 and가 동사원형 get과 steal을 병렬로 연결해서 could가 두 동작에 모두 걸린다는 점도 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">But\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 Microsoft가 돕도록 했다\u003c/span>\u003cspan class=\"en\">he \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">helped \u003c/span>\u003cspan class=\"tgt\">Microsoft \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 문제를 해결하도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">solve \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">problem\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 그는 Microsoft가 그 문제를 해결하도록 도왔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 위험을 발견한 사람이 이번에는 피해 기업을 돕는 쪽에 서 있다는 것을 보여 주는 문장이에요. \u003cb class=\"key\">But\u003c/b>이 앞 문장의 부정적 상황을 반전시켜서 화이트 햇 해커의 선한 행동을 부각하죠. 그리고 개인 정보를 지킨다는 마지막 결론으로 가는 연결 고리 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">역접 접속사\u003c/span> : But + [주어] + [동사] : \"그러나\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">help + 목적어 + 동사원형(5형식)\u003c/span> : help + [목적어 Microsoft] + [(to) 동사원형 solve] : \"Microsoft가 그 문제를 해결하도록 도왔다\"\u003c/div>\u003c/div>","segs":[{"n":46,"text":"But, 그러나. he helped Microsoft, 그는 Microsoft가 돕도록 했다. solve the problem, 그 문제를 해결하도록. 이 문장 전체를 해석하면, 그러나 그는 Microsoft가 그 문제를 해결하도록 도왔다.","hl":"m"},{"n":47,"text":"위험을 발견한 사람이 이번에는 피해 기업을 돕는 쪽에 서 있다는 것을 보여 주는 문장이에요. But이 앞 문장의 부정적 상황을 반전시켜서 화이트 햇 해커의 선한 행동을 부각하죠. 그리고 개인 정보를 지킨다는 마지막 결론으로 가는 연결 고리 역할을 합니다.","hl":"mn"},{"n":48,"text":"여기서 helped는 help가 5형식으로 쓰인 경우예요. help는 목적어 다음에 동사원형이나 to부정사를 목적격 보어로 받는데, 여기서는 to가 생략된 원형 solve가 왔죠. 그리고 문장 앞의 But은 앞 내용과 반대되는 역접을 나타내서, 위험을 발견한 사람이 오히려 문제를 해결하는 쪽에 섰다는 흐름을 만들어 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 만들었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">He \u003c/span>\u003cspan class=\"tgt\">made \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새로운 프로그램을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">new \u003c/span>\u003cspan class=\"tgt\">program\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보호할 수 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">protect \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 소프트웨어를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">software\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 소프트웨어를 보호할 수 있는 새로운 프로그램을 만들었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 마이크로소프트의 문제를 해결했다고 했는데, 이 문장은 그가 실제로 무엇을 했는지 구체적으로 보여 줘요. 소프트웨어를 \u003cb class=\"key\">보호\u003c/b>하는 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">프로그램\u003c/b>을 직접 만들었다는 점이 핵심입니다. to protect는 앞의 명사를 꾸미는 \u003cb class=\"key\">형용사적\u003c/b> 용법으로 읽으면 학생용 해석과 자연스럽게 맞아요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">3형식 타동사 make의 목적어\u003c/span> : make + [목적어 a new program] (3형식) : \"그는 새로운 프로그램을 만들었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법(명사 수식)\u003c/span> : [명사 a new program] + [to protect the software (to부정사구, 앞 명사 수식)] : \"그 소프트웨어를 보호할 수 있는\"\u003c/div>\u003c/div>","segs":[{"n":49,"text":"He made, 그는 만들었다. a new program, 새로운 프로그램을. to protect, 보호할 수 있는. the software, 그 소프트웨어를. 이 문장 전체를 해석하면, 그는 소프트웨어를 보호할 수 있는 새로운 프로그램을 만들었다.","hl":"m"},{"n":50,"text":"앞 문장에서 마이크로소프트의 문제를 함께 해결했다고 했죠. 이 문장은 그가 실제로 무엇을 했는지 구체적으로 보여 줍니다. 소프트웨어를 보호하는 새로운 프로그램을 직접 만들었다는 점이 핵심이에요. 그리고 to protect는 앞에 있는 명사를 꾸며 주는 형용사적 용법으로 읽으면 해석이 자연스럽습니다.","hl":"mn"},{"n":51,"text":"첫 번째로, made a new program에서 make는 목적어를 하나만 가지는 삼 형식 동사예요. 그래서 뒤에 오는 to protect는 목적어가 아니라 설명을 덧붙이는 역할을 합니다. 두 번째로, to protect the software는 앞에 있는 a new program을 뒤에서 꾸며 주는 형용사적 용법이에요. 어떤 프로그램인지 소프트웨어를 보호할 수 있는 프로그램이라고 알려 주는 거죠. 목적으로 해석해도 크게 어긋나지는 않지만, 학교 해석처럼 형용사적으로 읽는 것이 가장 자연스럽습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 인터넷을 많이 사용하기 때문에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Since \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">use \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">Internet \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">lot\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Maiffret과 같은 화이트 햇 해커는\u003c/span>\u003cspan class=\"en\">a white hat hacker \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">Maiffret\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">중요한 역할을 한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">plays \u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">important \u003c/span>\u003cspan class=\"tgt\">role \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 개인 정보를 보호하는 데\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">protecting\u003c/span> our personal information.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 인터넷을 많이 사용하기 때문에 Maiffret과 같은 화이트 햇 해커는 우리의 개인 정 보를 보호하는 데 중요한 역할을 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글 전체를 마무리하는 \u003cb class=\"key\">결론\u003c/b> 문장이에요. 우리가 인터넷을 많이 쓰는 상황을 먼저 제시하고, 그래서 화이트 햇 해커가 왜 중요한지를 말해 줍니다. 결국 화이트 햇 해커는 우리의 \u003cb class=\"key\">개인 \u003c/b>\u003cb class=\"key\">정보\u003c/b>를 지키는 \u003cb class=\"key\">중요한 \u003c/b>\u003cb class=\"key\">역할\u003c/b>을 한다는 점이 이 글의 핵심 메시지예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 since(이유·원인)\u003c/span> : Since + [주어 we] + [동사 use] ~ , [주절] : \"우리는 인터넷을 많이 사용하기 때문에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 like(~와 같은)\u003c/span> : [명사 a white hat hacker] + [like + 명사 Maiffret] : \"Maiffret과 같은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">play a role in + 동명사\u003c/span> : play an important role in + [동명사 protecting (전치사 in의 목적어)] : \"~하는 데 중요한 역할을 하다\"\u003c/div>\u003c/div>","segs":[{"n":52,"text":"Since we use the Internet a lot, 우리는 인터넷을 많이 사용하기 때문에. a white hat hacker like Maiffret, Maiffret과 같은 화이트 햇 해커는. plays an important role, 중요한 역할을 한다. in protecting our personal information, 우리의 개인 정보를 보호하는 데. 이 문장 전체를 해석하면, 우리는 인터넷을 많이 사용하기 때문에 Maiffret과 같은 화이트 햇 해커는 우리의 개인 정 보를 보호하는 데 중요한 역할을 한다.","hl":"m"},{"n":53,"text":"이 문장은 글 전체를 마무리하는 결론 문장이에요. 우리가 인터넷을 많이 쓰는 상황을 먼저 보여 주고, 그래서 화이트 햇 해커가 왜 중요한지를 말해 줍니다. 결국 화이트 햇 해커는 우리의 개인 정보를 지키는 중요한 역할을 한다는 점이 이 글의 핵심 메시지예요.","hl":"mn"},{"n":54,"text":"첫 번째로, Since는 이유를 이끄는 접속사예요. 우리말로 하면 왜냐하면 우리가 인터넷을 많이 쓰기 때문에라고 해석하죠. 두 번째로, like Maiffret에서 like는 좋아하다라는 동사가 아니라 전치사로 쓰여서 Maiffret과 같은이라는 뜻을 만들어요. 세 번째로, plays an important role in 뒤에는 전치사 in이 있으니까 동사원형이 아니라 동명사 protecting이 와야 합니다. 그리고 주어의 핵심이 단수 명사 hacker라서 동사에 s가 붙은 plays가 쓰였다는 점도 꼭 챙겨 두세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>해킹은 무조건 나쁜 것이 아니며 \u003cb class=\"key\">선한 \u003c/b>\u003cb class=\"key\">해커\u003c/b>인 화이트 햇 해커가 존재한다.\u003c/li>\u003cli>화이트 햇 해커는 \u003cb class=\"key\">보안\u003c/b> 문제를 찾아 알리고, \u003cb class=\"key\">법\u003c/b>을 지키며 블랙 햇 해커와 구별된다.\u003c/li>\u003cli>‘화이트 햇’이라는 이름은 흰 모자를 쓴 영화 속 \u003cb class=\"key\">영웅\u003c/b>에서 비롯된 상징이다.\u003c/li>\u003cli>Marc Maiffret은 Microsoft의 \u003cb class=\"key\">약점\u003c/b>을 알리고 해결을 도와 \u003cb class=\"key\">개인 \u003c/b>\u003cb class=\"key\">정보\u003c/b>를 지키는 데 이바지했다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>White hat hackers use their hacking skills legally to find and fix security problems, playing an important role in protecting our personal information.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">해킹은 무조건 나쁜 것이 아니라, \u003cb class=\"key\">목적\u003c/b>과 \u003cb class=\"key\">법\u003c/b> 준수 여부에 따라 선한 해커와 악한 해커로 나뉜다. 화이트 햇 해커는 자신들의 기술로 \u003cb class=\"key\">보안\u003c/b> 문제를 찾아 해결하며, Marc Maiffret처럼 우리의 \u003cb class=\"key\">개인 \u003c/b>\u003cb class=\"key\">정보\u003c/b>를 보호하는 데 중요한 역할을 한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":55,"text":"오늘 글의 핵심은 아주 명확해요. 해킹이라는 기술 자체가 나쁜 것이 아니라, 무엇을 위해 쓰고 법을 지키느냐가 선과 악을 가른다는 점이었죠. 화이트 햇 해커는 보안 문제를 찾아 알리고 해결을 도우며 우리의 개인 정보를 지켜 줍니다. 여러분도 오늘 배운 대조 구조와 예시 구조를 다른 지문에서도 꼭 찾아보세요. 그럼 다음 시간에 또 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
