<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터1 Reading 40 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터1 Reading 40","audioDir":"reading40_audio","preview":false,"count":61,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.668em\">Reading\u003cbr>40\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터1\u003c/div>\u003ch1>The Prince Who Ate the Whole Bunch Alone\u003c/h1>\u003ch2>포도를 혼자 다 먹은 왕자\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>가난한 남자가 왕자에게 \u003cb class=\"key\">포도 \u003c/b>\u003cb class=\"key\">한 \u003c/b>\u003cb class=\"key\">송이\u003c/b>를 선물했고, 왕자는 평소와 달리 포도를 혼자 다 먹어 친구들이 놀랐다. 그러나 왕자는 포도가 너무 시어서 함께 나누면 남자의 감정을 상하게 할까 봐 \u003cb class=\"key\">배려\u003c/b>해서 \u003cb class=\"key\">혼자 \u003c/b>\u003cb class=\"key\">다 \u003c/b>\u003cb class=\"key\">먹었다\u003c/b>고 설명했다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The prince ate the whole bunch of grapes by himself not out of selfishness but to protect the poor man's feelings.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 가난한 남자가 왕자에게 포도 한 송이를 선물하는 이야기를 함께 읽어 볼게요. 왕자는 평소와 달리 포도를 혼자 다 먹었다는 점 때문에 친구들을 놀라게 합니다. 하지만 끝까지 읽으면 그 행동이 이기심이 아니라 가난한 남자의 감정을 상하게 하지 않으려는 배려였다는 사실이 드러나요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">사람은 선물(gift)을 주고받을 때 물건의 값보다 마음과 \u003cb class=\"key\">체면\u003c/b>을 중요하게 생각해요. 그래서 받는 사람이 선물을 어떻게 대하느냐에 따라 주는 사람의 감정이 크게 달라질 수 있죠. 이 글에서 왕자는 겉으로 드러난 행동만 보면 혼자 다 먹은 것처럼 보여요. 하지만 그 행동 뒤에는 가난한 남자를 \u003cb class=\"key\">배려\u003c/b>하려는 숨은 의도가 있어요. 우리 일상에서도 친구가 정성껏 준 음식이 조금 맛이 없을 때 그대로 말하기보다 맛있게 먹어 주는 배려를 하곤 해요. 이런 글은 겉으로 드러난 행동과 \u003cb class=\"key\">숨은 \u003c/b>\u003cb class=\"key\">의도\u003c/b>를 구분해서 읽어야 오해하지 않을 수 있어요.\u003c/div>","segs":[{"n":2,"text":"사람은 선물을 주고받을 때 물건의 값보다 마음과 체면을 중요하게 생각해요. 그래서 받는 사람이 선물을 어떻게 대하느냐에 따라 주는 사람의 감정이 크게 달라질 수 있죠. 이 글에서 왕자는 겉으로 드러난 행동만 보면 혼자 다 먹은 것처럼 보여요. 하지만 그 행동 뒤에는 가난한 남자를 배려하려는 숨은 의도가 있어요. 우리 일상에서도 친구가 정성껏 준 음식이 조금 맛이 없을 때 그대로 말하기보다 맛있게 먹어 주는 배려를 하곤 해요. 이런 글은 겉으로 드러난 행동과 숨은 의도를 구분해서 읽어야 오해하지 않을 수 있어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>선물 준비\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>어느 날 가난한 남자가 왕자에게 \u003cb class=\"key\">포도 \u003c/b>\u003cb class=\"key\">한 \u003c/b>\u003cb class=\"key\">송이\u003c/b>를 선물로 준다. 그는 너무 가난해서 다른 것을 살 수 없었지만, 작은 선물이라도 전할 수 있어 \u003cb class=\"key\">매우 \u003c/b>\u003cb class=\"key\">신났다\u003c/b>.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>정중한 선물\u003csmall>전개 · 문장 3–6\u003c/small>\u003c/h4>\u003cp>남자는 포도를 왕자 가까이에 놓고 작은 선물을 받아 달라고 말한다. 그는 작은 선물을 줄 수 있어 \u003cb class=\"key\">행복해\u003c/b> 하고, 왕자는 정중하게 \u003cb class=\"key\">감사를 \u003c/b>\u003cb class=\"key\">표한다\u003c/b>.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>혼자 먹는 왕자\u003csmall>전환 · 문장 7–11\u003c/small>\u003c/h4>\u003cp>남자가 바라보는 앞에서 왕자는 포도를 하나, 또 하나 먹고 \u003cb class=\"key\">천천히\u003c/b> 한 송이를 혼자 다 먹는다. 주변 누구에게도 주지 않았지만, 가난한 남자는 오히려 \u003cb class=\"key\">매우 \u003c/b>\u003cb class=\"key\">기뻐하며\u003c/b> 떠난다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>친구들의 놀람\u003csmall>통념 · 문장 12–14\u003c/small>\u003c/h4>\u003cp>왕자의 가까운 친구들은 그 모습에 \u003cb class=\"key\">매우 \u003c/b>\u003cb class=\"key\">놀란다\u003c/b>. 보통 왕자는 가진 모든 것을 나누고, 받은 것은 무엇이든 함께 먹던 사람이었기 때문이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>이번에는 달랐다\u003csmall>반전 · 문장 15–16\u003c/small>\u003c/h4>\u003cp>그러나 \u003cb class=\"key\">이번에는 \u003c/b>\u003cb class=\"key\">달랐다\u003c/b>. 왕자는 친구들에게 포도를 나누지 않고 혼자서 한 송이를 다 먹었고, 이어지는 설명에서 포도가 너무 시어서 가난한 남자의 \u003cb class=\"key\">감정을 \u003c/b>\u003cb class=\"key\">상하게\u003c/b> 하지 않으려는 \u003cb class=\"key\">배려\u003c/b>였음이 드러난다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 이야기의 흐름을 다섯 단계로 나누어 볼게요.","hl":null},{"n":4,"text":"먼저 어느 날 가난한 남자가 왕자에게 포도 한 송이를 선물로 줍니다. 그는 너무 가난해서 다른 것을 살 수 없었지만, 작은 선물이라도 전할 수 있어서 매우 신났어요.","hl":"f0"},{"n":5,"text":"남자는 포도를 왕자 가까이에 놓고 작은 선물을 받아 달라고 말해요. 그는 왕자에게 작은 선물을 줄 수 있어서 행복해 하고, 본문에서는 왕자가 정중하게 감사를 표한다고 표현합니다.","hl":"f1"},{"n":6,"text":"남자가 바라보는 앞에서 왕자는 포도를 하나 먹고 또 하나를 먹어요. 그리고 천천히 한 송이를 혼자 다 먹고 주변 누구에게도 나누어 주지 않죠. 그런데도 가난한 남자는 매우 기뻐하며 떠납니다.","hl":"f2"},{"n":7,"text":"왕자의 가까운 친구들은 이 모습에 매우 놀란다. 보통 왕자는 자신이 가진 모든 것을 다른 사람들과 나누고, 받은 것은 무엇이든 함께 먹던 사람이었기 때문이에요.","hl":"f3"},{"n":8,"text":"본문에 이번에는 달랐다라는 표현이 나와요. 왕자는 친구들에게 포도를 나누지 않고 혼자서 한 송이를 다 먹었죠. 이어서 포도가 너무 시어서 함께 나누면 가난한 남자의 감정을 상하게 할까 봐 배려해서 혼자 먹었다는 설명이 나옵니다.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">통념-반박\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 16번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 평소 왕자가 무엇이든 나누는 사람이라는 \u003cb class=\"key\">통념\u003c/b>을 13~14번에서 제시한다. 이어 15~16번에서 '이번에는 달랐다'며 반대 행동을 보여 주고, 마지막에 그 이유가 \u003cb class=\"key\">배려\u003c/b>였음을 밝힌다. 따라서 겉으로 보이는 행동에 대한 독자의 예상을 뒤집는 통념-반박 구조로 읽을 수 있다. 핵심 내용이 뒤쪽에 나오므로 \u003cb class=\"key\">미괄식\u003c/b>이라고 판단한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>One day (1)\u003c/b>\u003cspan>시간 도입\u003c/span>\u003cb>Then (8)\u003c/b>\u003cspan>사건 진행\u003c/span>\u003cb>Slowly (9)\u003c/b>\u003cspan>과정 강조\u003c/span>\u003cb>Usually (13)\u003c/b>\u003cspan>통념 제시\u003c/span>\u003cb>This time (15)\u003c/b>\u003cspan>대조 전환\u003c/span>\u003cb>different (15)\u003c/b>\u003cspan>대조 강조\u003c/span>\u003cb>all by himself (16)\u003c/b>\u003cspan>행동 강조\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">a bunch of grapes\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the grapes\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">one grape\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">another one\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the whole bunch of grapes\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">any grapes\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">everything he had\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">whatever he was given\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the bunch of grapes\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>평소 왕자\u003c/th>\u003cth>이번 왕자\u003c/th>\u003c/tr>\u003ctr>\u003ctd>가진 모든 것을 나눔\u003c/td>\u003ctd>포도를 혼자 다 먹음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>친구들과 함께 먹음\u003c/td>\u003ctd>주변 누구에게도 주지 않음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>나눔이 자연스러운 습관\u003c/td>\u003ctd>겉보기엔 이기적\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글은 통념과 반박의 구조로 읽으면 쉬워요. 평소 왕자는 무엇이든 나누는 사람이라는 통념을 먼저 보여 주고, 이번에는 달랐다는 말로 독자의 예상을 흔들죠. 마지막에 그 이유가 배려였다는 사실이 밝혀지면서 통념에 대한 반박이 완성됩니다. 그리고 핵심 내용이 뒤쪽에 나오기 때문에 미괄식 구조라고 할 수 있어요.","hl":"ty"},{"n":10,"text":"신호어를 보면 흐름이 잘 보여요. One day는 이야기의 시작을 알려 주고, Then과 Slowly는 사건이 진행되는 과정을 보여 줍니다. Usually는 평소의 통념을, This time과 different는 이번 상황과의 대조를 만들어요. 마지막의 all by himself는 왕자가 혼자 행동했다는 점을 강조하면서 반전을 준비합니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>one day\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>어느 날\u003c/span>\u003c/div>\u003cdiv>\u003cb>poor\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>가난한\u003c/span>\u003c/div>\u003cdiv>\u003cb>a bunch of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>한 송이의\u003c/span>\u003c/div>\u003cdiv>\u003cb>grapes\u003c/b>\u003cem>명사\u003c/em>\u003cspan>포도\u003c/span>\u003c/div>\u003cdiv>\u003cb>prince\u003c/b>\u003cem>명사\ >surprised\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>놀란\u003c/span>\u003c/div>\u003cdiv>\u003cb>usually\u003c/b>\u003cem>부사\u003c/em>\u003cspan>보통\u003c/span>\u003c/div>\u003cdiv>\u003cb>share\u003c/b>\u003cem>동사\u003c/em>\u003cspan>나누다\u003c/span>\u003c/div>\u003cdiv>\u003cb>different\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>다른\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"핵심 단어 몇 개를 짚어 볼게요. a bunch of는 한 송이라는 뜻이고, politely는 정중하게라는 뜻이에요. by himself는 혼자서라는 의미로, 왕자가 포도를 함께 나누지 않고 혼자 먹었다는 장면에서 중요하게 쓰입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">share\u003c/b>\u003cspan class=\"m\">나누다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">divide\u003c/span>\u003cspan class=\"s\">distribute\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">withhold\u003c/span>\u003cspan class=\"a\">keep\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">poor\u003c/b>\u003cspan class=\"m\">가난한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">needy\u003c/span>\u003cspan class=\"s\">impoverished\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">rich\u003c/span>\u003cspan class=\"a\">wealthy\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">politely\u003c/b>\u003cspan class=\"m\">정중하게\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">courteously\u003c/span>\u003cspan class=\"s\">respectfully\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">rudely\u003c/span>\u003cspan class=\"a\">impolitely\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">pleased\u003c/b>\u003cspan class=\"m\">기뻐하는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">glad\u003c/span>\u003cspan class=\"s\">satisfied\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">displeased\u003c/span>\u003cspan class=\"a\">unhappy\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">surprised\u003c/b>\u003cspan class=\"m\">놀란\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">astonished\u003c/span>\u003cspan class=\"s\">amazed\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unsurprised\u003c/span>\u003cspan class=\"a\">indifferent\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">whole\u003c/b>\u003cspan class=\"m\">전체의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">entire\u003c/span>\u003cspan class=\"s\">complete\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">partial\u003c/span>\u003cspan class=\"a\">incomplete\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">different\u003c/b>\u003cspan class=\"m\">다른\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">distinct\u003c/span>\u003cspan class=\"s\">unlike\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">same\u003c/span>\u003cspan class=\"a\">similar\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"시험에 자주 나오는 어휘는 동의어와 반의어로 정리해 둘게요. share는 divide나 distribute로 바꿔 쓸 수 있고, 반대말은 withhold나 keep이에요. poor는 needy나 impoverished와 가깝고, 반대말은 rich나 wealthy입니다. politely는 courteously나 respectfully로, pleased는 glad나 satisfied로, surprised는 astonished나 amazed로 바꿀 수 있죠. whole은 entire나 complete로, different는 distinct나 unlike로 바꿀 수 있고 different의 반대말은 same이나 similar라는 점도 기억해 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어느 날\u003c/span>\u003cspan class=\"en\">One day\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가난한 한 남자가\u003c/span>\u003cspan class=\"en\">a poor man\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">포도 한 송이를 주었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">gave \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">bunch \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">grapes \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왕자에게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">prince\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">선물로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">gift\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어느 날 가난한 한 남자가 왕자에게 포도 한 송이를 선물로 주었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이야기의 \u003cb class=\"key\">도입\u003c/b>을 여는 장면으로, 가난한 남자가 포도 한 송이를 왕자에게 \u003cb class=\"key\">선물\u003c/b>로 바쳤다는 내용이에요. 값비싼 물건이 아니지만 그가 할 수 있는 최선을 담은 선물이라는 점이 중요하죠. 뒤에 이어질 왕자의 예상 밖 행동과 대비되는 출발점 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">give + 직접목적어 + to + 간접목적어(3형식 전환)\u003c/span> : give [사물(직접목적어)] + to [사람(간접목적어)] = 3형식 : \"왕자에게 포도 한 송이를 주었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 as (~로서, ~로)\u003c/span> : as + [명사] = ~로서 : \"선물로서\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"One day, 어느 날. a poor man, 가난한 한 남자가. gave a bunch of grapes, 포도 한 송이를 주었다. to a prince, 왕자에게. as a gift, 선물로. 이 문장 전체를 해석하면, 어느 날 가난한 한 남자가 왕자에게 포도 한 송이를 선물로 주었다.","hl":"m"},{"n":14,"text":"이 문장은 이야기의 도입이에요. 가난한 남자가 포도 한 송이를 왕자에게 선물로 바치는 장면이죠. 값비싼 물건이 아니라서 오히려 마음이 담긴 선물이라는 점을 기억해 두세요.","hl":"mn"},{"n":15,"text":"먼저 gave a bunch of grapes to a prince를 볼게요. give는 사람에게 사물을 주는 동사인데, 여기서는 간접목적어를 전치사 to와 함께 뒤로 보낸 3형식이에요. 그래서 동사 바로 뒤에는 직접목적어인 a bunch of grapes가 와요. 두 번째로 as a gift에서 as는 자격을 나타내는 전치사 as로, 선물로서라고 해석해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 16\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 매우 신났다\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">very \u003c/span>\u003cspan class=\"tgt\">excited \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그에게 선물을 가져올 수 있어서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">bring\u003c/span> a gift for him\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜냐하면 그는 너무 가난했기 때문에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">because \u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">too \u003c/span>\u003cspan class=\"tgt\">poor \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 것을 살 수는 없을 만큼\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">buy\u003c/span> anything else.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 너무 가난해서 다른 것을 살 수는 없었기 때문에 그에게 선물을 가져올 수 있어서 매우 신났다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 남자가 어떤 마음으로 선물을 준비했는지 설명하는 문장이에요. 너무 가난해서 다른 것을 살 수 없었지만, 그래서 오히려 이 작은 선물을 가져올 수 있어 \u003cb class=\"key\">기뻐했다\u003c/b>는 \u003cb class=\"key\">인과 \u003c/b>\u003cb class=\"key\">관계\u003c/b>를 담고 있죠. 이 감정이 뒤에서 왕자가 포도를 다 먹어 버리는 장면과 연결됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">감정 형용사 + to부정사(원인)\u003c/span> : be [감정 형용사] + to + [동사원형] = ~해서 …하다 : \"가져올 수 있어서 매우 신났다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이유를 나타내는 접속사 because\u003c/span> : because + [주어 + 동사] = 왜냐하면 ~ 때문에 : \"그는 너무 가난했기 때문에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">too ~ to부정사(부정 의미)\u003c/span> : too + [형용사] + to + [동사원형] = 너무 ~해서 …할 수 없다 : \"너무 가난해서 살 수 없었다\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"He was very excited, 그는 매우 신났다. to bring a gift for him, 그에게 선물을 가져올 수 있어서. because he was too poor, 왜냐하면 그는 너무 가난했기 때문에. to buy anything else, 다른 것을 살 수는 없을 만큼. 이 문장 전체를 해석하면, 그는 너무 가난해서 다른 것을 살 수는 없었기 때문에 그에게 선물을 가져올 수 있어서 매우 신났다.","hl":"m"},{"n":17,"text":"이 문장은 남자가 어떤 마음으로 선물을 준비했는지 알려 줘요. 너무 가난해서 다른 것을 살 수 없었지만, 오히려 이 작은 선물을 가져올 수 있어서 기뻐했다는 인과 관계를 담고 있죠. 이 감정을 잘 기억해야 뒤의 장면이 이해됩니다.","hl":"mn"},{"n":18,"text":"먼저 was very excited to bring을 볼게요. excited 같은 감정 형용사 뒤의 to부정사는 감정의 원인을 나타내요. 두 번째로 too poor to buy는 too가 너무라는 뜻이라 뒤의 to부정사가 부정의 의미가 돼요. 그래서 살 수 없었다로 해석하죠. 세 번째로 because는 이유를 이끄는 접속사로, 앞의 감정이 왜 생겼는지 설명해 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 포도를 놓았다\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">put \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">grapes \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왕자 가까이에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">near \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">prince\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 말했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">said\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">&quot;오.\u003c/span>\u003cspan class=\"en\">&quot;Oh.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 포도를 왕자 가까이에 놓고 말했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 왕자에게 다가가 포도를 내려놓고 말을 꺼내는 장면이에요. put으로 포도를 놓는 \u003cb class=\"key\">위치\u003c/b>를 잡고 said로 \u003cb class=\"key\">대화\u003c/b>를 시작해서, 바로 다음 문장의 인용문으로 자연스럽게 이어지죠. 남자가 얼마나 조심스럽고 정중하게 선물을 건네는지 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">put + 목적어 + 장소 부사구\u003c/span> : put + [목적어] + [장소/전치사구] = 목적어를 ~에 놓다 : \"포도를 왕자 가까이에 놓았다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">정관사 the (이미 언급된 대상)\u003c/span> : the + [명사] : \"그 포도(앞서 나온 포도)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">등위접속사 and (동사 병렬)\u003c/span> : [동사 A] + and + [동사 B] = A하고 B하다 : \"그리고 말했다\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"He put the grapes, 그는 포도를 놓았다. near the prince, 왕자 가까이에. and said, 그리고 말했다. \"Oh, \"오.. 이 문장 전체를 해석하면, 그는 포도를 왕자 가까이에 놓고 말했다.","hl":"m"},{"n":20,"text":"왕자에게 다가가 포도를 내려놓고 말을 꺼내는 장면이에요. put으로 위치를 잡고 said로 대화를 시작해서 다음 문장의 인용문으로 자연스럽게 이어집니다. 남자가 얼마나 정중하게 선물을 건네는지 느껴지죠.","hl":"mn"},{"n":21,"text":"첫 번째로 put the grapes near the prince를 볼게요. put은 목적어만으로 뜻이 완성되지 않아서 장소를 나타내는 말이 꼭 따라와요. near the prince가 그 역할을 하는 필수 부사구예요. 두 번째로 and said에서 and는 put과 said를 병렬로 묶어 주고, 시제도 과거로 똑같이 맞춰 줍니다. 세 번째로 the grapes에는 정관사 the가 붙어서 이미 나온 대상, 즉 기지의 의미를 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왕자님,\u003c/span>\u003cspan class=\"en\">Prince,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">부디 받아 주세요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">please \u003c/span>\u003cspan class=\"tgt\">take\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 작은 선물을\u003c/span>\u003cspan class=\"en\">this small gift\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제게서\u003c/span>\u003cspan class=\"en\">from me.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">왕자님, 제가 드리는 이 작은 선물을 부디 받아 주세요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 가난한 남자가 왕자에게 포도를 건네며 직접 하는 말을 옮긴 \u003cb class=\"key\">직접 \u003c/b>\u003cb class=\"key\">인용\u003c/b>입니다. please take는 '부디 받아 주세요'라는 \u003cb class=\"key\">공손한 \u003c/b>\u003cb class=\"key\">부탁\u003c/b>으로, 남자의 겸손하고 예의 바른 태도를 보여 줍니다. 이 작은 선물이라는 표현에는 가난하지만 정성을 다해 준비했다는 마음이 담겨 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">공손한 명령문(please + 동사원형)\u003c/span> : please + [동사원형] : \"부디 받아 주세요\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"Prince, 왕자님. please take, 부디 받아 주세요. this small gift, 이 작은 선물을. from me.\", 제게서. 이 문장 전체를 해석하면, 왕자님, 제가 드리는 이 작은 선물을 부디 받아 주세요.","hl":"m"},{"n":23,"text":"이 문장은 가난한 남자가 왕자에게 직접 하는 말을 그대로 옮긴 직접 인용이에요. please take는 부디 받아 주세요라는 공손한 부탁이고, 작은 선물이라고 겸손하게 표현한 점이 중요해요.","hl":"mn"},{"n":24,"text":"여기서 첫 번째 어법은 please take예요. please 뒤에 동사원형 take를 써서 공손한 명령문을 만들죠. 그래서 부디 받아 주세요라는 뜻이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 16\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 매우 행복했다\u003c/span>\u003cspan class=\"en\">He was so happy\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜냐하면 그는 왕자에게 그의 작은 선물을 줄 수 있었기 때문이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">because\u003c/span> he could \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">give \u003c/span>\u003cspan class=\"tgt\">him \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">small \u003c/span>\u003cspan class=\"tgt\">gift\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 왕자에게 작은 선물을 줄 수 있어서 매우 행복했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 남자가 왕자에게 작은 선물을 줄 수 있어서 행복한 \u003cb class=\"key\">이유\u003c/b>를 밝히는 문장입니다. 가난 때문에 큰 선물은 못 했지만 자기 \u003cb class=\"key\">작은 \u003c/b>\u003cb class=\"key\">선물\u003c/b>을 건넬 수 있다는 사실 자체를 기뻐한다는 뜻이에요. 선물의 크기보다 주는 사람의 진심이 중요하다는 흐름을 만들어 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이유의 접속사 because\u003c/span> : because + [주어 + 동사] : \"왜냐하면 ~이기 때문에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">4형식 수여동사 give\u003c/span> : give + [간접목적어] + [직접목적어] : \"그에게 그의 작은 선물을 주다\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"He was so happy, 그는 매우 행복했다. because he could give him his small gift, 왜냐하면 그는 왕자에게 그의 작은 선물을 줄 수 있었기 때문이다. 이 문장 전체를 해석하면, 그는 왕자에게 작은 선물을 줄 수 있어서 매우 행복했다.","hl":"m"},{"n":26,"text":"이 문장은 남자가 왕자에게 작은 선물을 줄 수 있어서 행복한 이유를 밝히고 있어요. 큰 선물은 못 했지만 자기 작은 선물을 건넬 수 있다는 사실 자체가 기쁨이었다는 뜻이죠. 선물의 크기보다 진심이 중요하다는 흐름을 만들어 줍니다.","hl":"mn"},{"n":27,"text":"여기서 첫 번째 어법은 because예요. because는 뒤에 완전한 절을 이끌어서 앞의 happy에 대한 이유를 설명하죠. 두 번째는 give him his small gift인데, give는 사람에게 물건을 주는 수여동사예요. 그래서 간접목적어 him과 직접목적어 his small gift를 함께 데리고 옵니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왕자는\u003c/span>\u003cspan class=\"en\">The prince\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그에게 감사를 표했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">thanked \u003c/span>\u003cspan class=\"tgt\">him\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정중하게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">politely\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">왕자는 정중하게 그에게 감사를 표했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 왕자가 남자의 선물에 \u003cb class=\"key\">정중하게\u003c/b> \u003cb class=\"key\">감사를 \u003c/b>\u003cb class=\"key\">표했다\u003c/b>는 장면입니다. 왕자의 예의 바른 태도를 보여 주면서, 뒤에 포도를 혼자 다 먹는 행동과 대비되는 분위기를 준비합니다. thanked him politely는 '그에게 정중하게 감사했다'라는 뜻이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">3형식 타동사 thank\u003c/span> : thank + [목적어] : \"그에게 감사를 표했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부사 politely의 동사 수식\u003c/span> : [동사] + [부사] : \"정중하게\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"The prince, 왕자는. thanked him, 그에게 감사를 표했다. politely, 정중하게. 이 문장 전체를 해석하면, 왕자는 정중하게 그에게 감사를 표했다.","hl":"m"},{"n":29,"text":"이 문장은 왕자가 남자의 선물에 정중하게 감사를 표했다는 장면이에요. 왕자의 예의 바른 태도를 보여 주면서 뒤에 포도를 혼자 다 먹는 행동과 대비되는 분위기를 준비하죠. thanked him politely는 그에게 정중하게 감사했다라는 뜻입니다.","hl":"mn"},{"n":30,"text":"여기서 첫 번째 어법은 thanked him이에요. thank는 뒤에 목적어 him을 취하는 타동사죠. 두 번째는 politely인데, politely는 부사로 동사 thanked를 수식해서 정중하게라는 의미를 더해 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">남자가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">As\u003c/span> the man\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그를 바라보자,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">looked \u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">him\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왕자는\u003c/span>\u003cspan class=\"en\">the prince\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">포도 한 개를 먹었다.\u003c/span>\u003cspan class=\"en\">ate one grape.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">남자가 그를 바라보자, 왕자는 포도 한 개를 먹었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 가난한 남자가 선물을 건넨 뒤 왕자의 반응을 지켜보는 장면을 이어 줍니다. \u003cb class=\"key\">As\u003c/b>는 ‘~하자’라는 계기 접속사로, 남자가 바라보는 순간 왕자가 포도를 먹기 시작했음을 보여 줍니다. 왕자가 \u003cb class=\"key\">one \u003c/b>\u003cb class=\"key\">grape\u003c/b>만 먹은 것처럼 보이는 장면은 이후 혼자 다 먹는 상황과 대비를 만듭니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 as의 시간·계기 용법\u003c/span> : As + [주어] + [동사], [주절] : \"~하자\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">자동사 look + 전치사 at\u003c/span> : look [자동사] + at + [목적어] : \"그를 바라보았다\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"As the man, 남자가. looked at him, 그를 바라보자. the prince, 왕자는. ate one grape, 포도 한 개를 먹었다.. 이 문장 전체를 해석하면, 남자가 그를 바라보자, 왕자는 포도 한 개를 먹었다.","hl":"m"},{"n":32,"text":"이 문장은 남자가 선물을 준 뒤 왕자의 반응을 지켜보는 장면을 이어 줘요. As는 여기서 ‘~하자’라는 계기 접속사로 쓰였고, 남자가 바라보는 순간 왕자가 포도를 먹기 시작했음을 보여 줍니다. 왕자가 one grape, 즉 포도 한 개를 먹은 듯 보이는 이 장면이 뒤에서 혼자 다 먹는 상황과 대비를 만들어요.","hl":"mn"},{"n":33,"text":"첫 번째 어법 포인트는 접속사 as예요. As는 두 일이 거의 동시에 일어날 때 시간이나 계기를 나타내는 접속사로, 여기서는 ‘~하자’로 해석해요. 두 번째는 look at이에요. look은 ‘보다’라는 뜻의 자동사라서 대상 앞에 전치사 at을 붙여 look at him처럼 써야 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러고 나서 그는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Then\u003c/span> he\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">먹었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">ate\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또 하나를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">another \u003c/span>\u003cspan class=\"tgt\">one\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러고 나서 그는 또 하나를 먹었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 왕자가 포도를 하나 먹은 데 이어 또 하나를 먹는 행동을 이어 줍니다. \u003cb class=\"key\">Then\u003c/b>과 \u003cb class=\"key\">another \u003c/b>\u003cb class=\"key\">one\u003c/b>이 반복을 나타내며, 왕자가 포도를 계속 먹고 있음을 보여 줍니다. 이 장면은 곧 한 송이를 다 먹는 상황으로 자연스럽게 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">문장 연결 부사(시간 순서)\u003c/span> : Then + [주어] + [동사] : \"그러고 나서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">eat의 과거형(불규칙 동사)\u003c/span> : eat - ate - eaten : \"먹었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">부정대명사 another와 대명사 one\u003c/span> : another + [단수명사/one] : \"또 하나\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"Then he, 그러고 나서 그는. ate, 먹었다. another one, 또 하나를. 이 문장 전체를 해석하면, 그러고 나서 그는 또 하나를 먹었다.","hl":"m"},{"n":35,"text":"이 문장은 왕자가 포도를 하나 먹은 데 이어 또 하나를 먹는 행동을 이어 줘요. Then과 another one이 반복을 나타내면서 왕자가 포도를 계속 먹고 있음을 보여 줍니다. 이 장면은 곧 한 송이를 다 먹는 상황으로 자연스럽게 이어져요.","hl":"mn"},{"n":36,"text":"첫 번째 어법 포인트는 Then이에요. Then은 앞 문장에 이어 시간적 순서를 보여 주는 부사예요. 두 번째는 ate인데, eat의 과거형으로 이야기 속 과거 사건을 나타냅니다. 세 번째는 another one이에요. another는 ‘또 다른 하나’라는 뜻으로 셀 수 있는 단수 명사 앞에 쓰고, 여기서 one은 앞에 나온 grape를 대신하는 대명사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 16\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">천천히\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Slowly\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왕자는\u003c/span>\u003cspan class=\"en\">the prince\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">포도 한 송이를 다 먹었다\u003c/span>\u003cspan class=\"en\">finished \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">whole \u003c/span>\u003cspan class=\"tgt\">bunch \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">grapes\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">혼자서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">himself\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">천천히 왕자는 혼자서 포도 한 송이를 다 먹었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 왕자가 포도를 천천히 혼자서 다 먹는 장면을 마무리하며, 앞에서 하나씩 먹던 행동이 결국 한 송이 전체를 먹는 결과로 이어졌음을 보여 줍니다. \u003cb class=\"key\">by \u003c/b>\u003cb class=\"key\">himself\u003c/b>는 친구들이 놀랄 만큼 왕자가 다른 사람과 나누지 않았다는 점을 강조합니다. \u003cb class=\"key\">Slowly\u003c/b>는 왕자가 서두르지 않고 계속 먹었음을 드러냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사를 꾸미는 부사\u003c/span> : Slowly + [주어] + [동사] : \"천천히\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">whole의 형용사 용법\u003c/span> : the whole + [단수명사] : \"포도 한 송이 전체\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">재귀대명사 관용표현 by oneself\u003c/span> : by + [재귀대명사] : \"혼자서\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"Slowly, 천천히. the prince, 왕자는. finished the whole bunch of grapes, 포도 한 송이를 다 먹었다. by himself, 혼자서. 이 문장 전체를 해석하면, 천천히 왕자는 혼자서 포도 한 송이를 다 먹었다.","hl":"m"},{"n":38,"text":"이 문장은 왕자가 포도를 천천히 혼자서 다 먹는 장면을 마무리해요. by himself는 친구들이 놀랄 만큼 왕자가 다른 사람과 나누지 않았다는 점을 강조합니다. Slowly는 왕자가 서두르지 않고 계속 먹었음을 드러내요.","hl":"mn"},{"n":39,"text":"첫 번째 어법 포인트는 Slowly예요. Slowly는 동사 finished를 꾸미는 부사로, 먹는 과정이 점진적이었음을 나타냅니다. 두 번째는 the whole bunch of grapes인데, whole은 전체의라는 뜻으로 the 뒤 단수 명사 앞에서 포도 한 송이 전체를 뜻해요. 세 번째는 by himself예요. by oneself는 혼자서라는 뜻이고, 주어 the prince와 수 일치하는 재귀대명사 himself를 썼어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 주지 않았다\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">did \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">give\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 포도도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">any \u003c/span>\u003cspan class=\"tgt\">grapes\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 주변에 있는 누구에게도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">anyone \u003c/span>\u003cspan class=\"tgt\">near \u003c/span>\u003cspan class=\"tgt\">him\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 자신의 주변 누구에게도 포도를 주지 않았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 왕자가 주변 사람 누구에게도 포도를 주지 않았다는 사실을 말해요. 바로 앞의 혼자서 다 먹었다를 다시 확인시켜 주는 \u003cb class=\"key\">반복\u003c/b> 표현이죠. 겉으로는 \u003cb class=\"key\">나눔\u003c/b>이 없는 장면이라서 뒤에 나오는 친구들의 놀라움을 자연스럽게 준비합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">일반동사 과거 부정문\u003c/span> : did not + [동사원형] : \"주지 않았다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부정문에서의 any\u003c/span> : not + [any + 복수명사] : \"어떤 포도도\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">수여동사의 to구문과 전치사구 수식\u003c/span> : give + [사물] + to + [사람] / [대명사] + near + [목적격] : \"그의 주변에 있는 누구에게도\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"He did not give, 그는 주지 않았다. any grapes, 어떤 포도도. to anyone near him, 그의 주변에 있는 누구에게도. 이 문장 전체를 해석하면, 그는 자신의 주변 누구에게도 포도를 주지 않았다.","hl":"m"},{"n":41,"text":"이 문장은 왕자가 주변 사람 누구에게도 포도를 주지 않았다는 사실을 말해요. 바로 앞의 혼자서 다 먹었다를 다시 확인시켜 주는 반복 표현이죠. 겉으로는 나눔이 없는 장면이라서 뒤에 나오는 친구들의 놀라움을 자연스럽게 준비합니다.","hl":"mn"},{"n":42,"text":"첫 번째로 did not give에서 did not은 과거 부정을 만드는 표현이고 뒤에는 동사원형이 와요. 두 번째로 any grapes에서 any는 부정문에서 어떤 포도도라는 뜻을 만들어 줘요. 세 번째로 to anyone near him에서 to anyone은 간접목적어를 to로 나타낸 것이고, near him은 anyone을 꾸미는 전치사구예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가난한 남자는\u003c/span>\u003cspan class=\"en\">The poor man\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매우 기뻐했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">very \u003c/span>\u003cspan class=\"tgt\">pleased\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 떠났다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">left\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">가난한 남자는 매우 기뻐하며 떠났다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 가난한 남자는 왕자가 포도를 다 먹어도 매우 기뻐하며 떠났어요. 자신의 작은 선물을 왕자가 받아 주었다는 사실 자체에 \u003cb class=\"key\">만족\u003c/b>했기 때문이죠. 이 장면은 왕자의 행동이 남자에게 \u003cb class=\"key\">좋은 \u003c/b>\u003cb class=\"key\">인상\u003c/b>을 주었음을 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">감정을 나타내는 과거분사\u003c/span> : be + [감정 과거분사] : \"매우 기뻤다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 and의 병렬\u003c/span> : [동사구] + and + [동사구] : \"그리고 떠났다\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"The poor man, 가난한 남자는. was very pleased, 매우 기뻐했다. and left, 그리고 떠났다. 이 문장 전체를 해석하면, 가난한 남자는 매우 기뻐하며 떠났다.","hl":"m"},{"n":44,"text":"가난한 남자는 왕자가 포도를 다 먹어도 매우 기뻐하며 떠났어요. 자신의 작은 선물을 왕자가 받아 주었다는 사실 자체에 만족했기 때문이죠. 이 장면은 왕자의 행동이 남자에게 좋은 인상을 주었음을 보여 줍니다.","hl":"mn"},{"n":45,"text":"첫 번째로 was very pleased에서 pleased는 감정을 나타내는 과거분사이고 be동사와 함께 형용사처럼 쓰였어요. 두 번째로 and left에서 and는 was very pleased와 left를 병렬로 연결해 주고, left는 leave의 과거형이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가까운 친구들은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">The \u003c/span>\u003cspan class=\"tgt\">close \u003c/span>\u003cspan class=\"tgt\">friends \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왕자의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">prince\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매우 놀랐다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">very \u003c/span>\u003cspan class=\"tgt\">surprised\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">왕자의 가까운 친구들은 매우 놀랐다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 왕자의 가까운 친구들이 놀란 이유는 왕자가 평소와 달리 포도를 나누지 않았기 때문이에요. 이 문장은 왕자의 \u003cb class=\"key\">평소\u003c/b> 행동과 이번 행동의 \u003cb class=\"key\">대조\u003c/b>를 드러내는 전환점이죠. 다음 문장에서 그 이유가 궁금해지도록 만듭니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 수식과 주어 수일치\u003c/span> : [명사] + of + [명사] + [동사] : \"왕자의 가까운 친구들은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">감정을 나타내는 과거분사\u003c/span> : be + [감정 과거분사] : \"매우 놀랐다\"\u003c/div>\u003c/div>","segs":[{"n":46,"text":"The close friends, 가까운 친구들은. of the prince, 왕자의. were very surprised, 매우 놀랐다. 이 문장 전체를 해석하면, 왕자의 가까운 친구들은 매우 놀랐다.","hl":"m"},{"n":47,"text":"왕자의 가까운 친구들이 놀란 이유는 왕자가 평소와 달리 포도를 나누지 않았기 때문이에요. 이 문장은 왕자의 평소 행동과 이번 행동의 대조를 드러내는 전환점이죠. 다음 문장에서 그 이유가 궁금해지도록 만듭니다.","hl":"mn"},{"n":48,"text":"첫 번째로 The close friends of the prince에서 of the prince는 friends를 꾸며 주고, 진짜 주어는 friends라서 수일치에 주의해야 해요. 두 번째로 were very surprised에서 surprised는 감정을 나타내는 과거분사이고, 주어가 복수라서 were가 쓰였어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 16\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보통\u003c/span>\u003cspan class=\"en\">Usually,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왕자는\u003c/span>\u003cspan class=\"en\">the prince\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나누었다\u003c/span>\u003cspan class=\"en\">shared\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그가 가진 모든 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">everything \u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">had\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 사람들과\u003c/span>\u003cspan class=\"en\">with others.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">보통 왕자는 자신이 가진 모든 것을 다른 사람들과 나누었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 왕자가 평소에는 자신이 가진 것을 다른 사람들과 \u003cb class=\"key\">나누는\u003c/b> 사람이었다는 점을 보여 줘요. 이는 뒤에서 왕자가 포도를 혼자 먹은 행동과 \u003cb class=\"key\">대조\u003c/b>를 이루기 위한 배경 정보예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사의 생략\u003c/span> : [선행사 everything] + [(that) he had] : \"그가 가진 모든 것\"\u003c/div>\u003c/div>","segs":[{"n":49,"text":"Usually, 보통. the prince, 왕자는. shared, 나누었다. everything he had, 그가 가진 모든 것을. with others, 다른 사람들과. 이 문장 전체를 해석하면, 보통 왕자는 자신이 가진 모든 것을 다른 사람들과 나누었다.","hl":"m"},{"n":50,"text":"이 문장은 왕자가 평소에 가진 것을 다른 사람들과 나누는 사람이었다는 배경을 깔아 줘요. 그래서 뒤에 나오는 이번에는 달랐다는 말이 더 강한 대조로 느껴지게 해요.","hl":"mn"},{"n":51,"text":"어법 포인트는 everything he had에서 목적격 관계대명사가 생략된 부분이에요. everything이 선행사이고 he had의 목적어 자리에 원래 목적격 관계대명사가 있었는데 생략된 구조죠. 그래서 그가 가진 모든 것이라고 해석해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 16\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 나누곤 했다\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">share\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들에게\u003c/span>\u003cspan class=\"en\">with them\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그가 받은 것은 무엇이든\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">whatever \u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">given\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그들은 먹곤 했다\u003c/span>\u003cspan class=\"en\">and they \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">eat\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 함께\u003c/span>\u003cspan class=\"en\">it together.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 자신이 받은 것은 무엇이든 다른 사람들에게 나눠 주었고, 그들은 그것을 함께 먹었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 왕자가 평소에 받은 것을 다른 사람들과 \u003cb class=\"key\">함께\u003c/b> 나누고 먹었다는 구체적인 \u003cb class=\"key\">습관\u003c/b>을 설명해요. whatever를 통해 무엇이든 예외 없이 나누었다는 점을 강조하며, 이번 행동과의 \u003cb class=\"key\">대조\u003c/b>를 더 분명하게 만들어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">would의 과거 습관\u003c/span> : [주어] + would + [동사원형] : \"나누곤 했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">복합관계대명사 whatever의 명사절\u003c/span> : share with + [whatever + 주어 + 동사] : \"그가 받은 것은 무엇이든\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">would의 과거 습관\u003c/span> : [주어] + would + [동사원형] : \"먹곤 했다\"\u003c/div>\u003c/div>","segs":[{"n":52,"text":"He would share, 그는 나누곤 했다. with them, 그들에게. whatever he was given, 그가 받은 것은 무엇이든. and they would eat, 그리고 그들은 먹곤 했다. it together, 그것을 함께. 이 문장 전체를 해석하면, 그는 자신이 받은 것은 무엇이든 다른 사람들에게 나눠 주었고, 그들은 그것을 함께 먹었다.","hl":"m"},{"n":53,"text":"이 문장은 왕자가 평소에 자기 것이든 받은 것이든 다른 사람들과 함께 나누는 습관이 있었다는 걸 보여 줘요. whatever가 들어가서 무엇이든 예외 없이 나누었다는 느낌을 주고, 뒤에 나오는 이번에는 달랐다와 대조를 이뤄요.","hl":"mn"},{"n":54,"text":"어법 포인트를 첫 번째로 보면 would share에서 would는 과거의 습관을 나타내요. 그래서 동사원형 share가 왔고 나누곤 했다로 해석해요. 두 번째로 whatever he was given에서 whatever는 선행사를 포함한 복합관계대명사로 명사절을 이끌고 share의 목적어 역할을 해요. 이 안의 was given은 수동태로 받았다는 뜻이에요. 세 번째로 would eat은 would share와 병렬 구조로 과거의 반복 습관을 나타내서 동사원형 eat이 쓰였어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 15 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이번에는\u003c/span>\u003cspan class=\"en\">This time,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">it\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">달랐다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">different\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이번에는 달랐다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞에서 말한 왕자의 평소 행동과 이번 행동이 \u003cb class=\"key\">대조\u003c/b>된다는 점을 알려 줘요. 짧은 문장으로 \u003cb class=\"key\">전환\u003c/b>을 만들고, 바로 뒤에서 왕자가 포도를 혼자 먹은 이유를 궁금하게 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지시대명사 it\u003c/span> : [it] + was + [형용사] : \"그것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be동사 + 주격보어 구조\u003c/span> : [주어] + was + [형용사(주격보어)] : \"달랐다\"\u003c/div>\u003c/div>","segs":[{"n":55,"text":"This time, 이번에는. it, 그것은. was different, 달랐다. 이 문장 전체를 해석하면, 이번에는 달랐다.","hl":"m"},{"n":56,"text":"이 문장은 앞에서 말한 왕자의 평소 행동과 이번 행동이 대조된다는 걸 알려 줘요. 짧게 이번에는 달랐다라고 말하면서 바로 뒤에서 왜 달랐는지 궁금하게 만드는 전환 역할을 해요.","hl":"mn"},{"n":57,"text":"어법 포인트를 첫 번째로 보면 it은 앞의 상황 전체를 가리키는 지시대명사예요. 두 번째로 was different는 be동사 was 뒤에 형용사 different가 와서 주어의 상태를 설명하는 주격보어 구조예요. different가 주격보어로 쓰여서 달랐다라고 해석해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 16 / 16\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">He \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">먹었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">ate\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">포도 한 송이를\u003c/span>\u003cspan class=\"en\">the bunch of grapes\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">혼자서 다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">all \u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">himself\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 혼자 포도 한 송이를 다 먹었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 왕자가 포도 한 송이를 \u003cb class=\"key\">혼자서\u003c/b> 다 먹었다는 사실을 말해요. 평소와 달리 나누지 않은 행동이라 친구들이 놀란 이유가 되고, 뒤에서 왕자의 진짜 \u003cb class=\"key\">의도\u003c/b>를 밝히는 계기가 돼요. 겉으로는 \u003cb class=\"key\">이기적\u003c/b>으로 보이지만 실제로는 가난한 남자를 배려한 행동이라는 점이 이 이야기의 반전이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">일반동사 과거시제\u003c/span> : [주어] + [과거형 동사] + [목적어] : \"그는 먹었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">재귀대명사 강조 관용 표현\u003c/span> : all by + [재귀대명사] = 혼자서, 스스로 : \"혼자서 다\"\u003c/div>\u003c/div>","segs":[{"n":58,"text":"He, 그는. ate, 먹었다. the bunch of grapes, 포도 한 송이를. all by himself, 혼자서 다. 이 문장 전체를 해석하면, 그는 혼자 포도 한 송이를 다 먹었다.","hl":"m"},{"n":59,"text":"이 문장은 왕자가 포도 한 송이를 혼자서 다 먹었다는 사실을 말해요. 평소와 달리 나누지 않은 행동이라 친구들이 놀란 이유가 되고, 뒤에서 왕자의 진짜 의도를 밝히는 계기가 돼요. 겉으로는 이기적으로 보이지만 실제로는 가난한 남자를 배려한 행동이라는 점이 이 이야기의 반전이에요.","hl":"mn"},{"n":60,"text":"첫 번째 어법 포인트는 일반동사 과거시제예요. He ate에서 He는 주어이고 eat이 ate로 바뀌어 과거시제를 나타내요. 뒤에 목적어 the bunch of grapes가 이어져서 무엇을 먹었는지 말해 주죠. 두 번째는 all by himself라는 관용 표현이에요. 이 표현은 다른 사람의 도움 없이 스스로 했다는 뜻을 강조해요. 주어가 He이니까 재귀대명사 himself를 쓴다는 점도 기억해 두세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>가난한 남자가 왕자에게 \u003cb class=\"key\">포도 \u003c/b>\u003cb class=\"key\">한 \u003c/b>\u003cb class=\"key\">송이\u003c/b>를 선물로 주었다.\u003c/li>\u003cli>왕자는 평소와 달리 포도를 주변 사람에게 나누지 않고 \u003cb class=\"key\">혼자 \u003c/b>\u003cb class=\"key\">다 \u003c/b>\u003cb class=\"key\">먹었다\u003c/b>.\u003c/li>\u003cli>친구들은 왕자가 늘 모든 것을 \u003cb class=\"key\">나누던\u003c/b> 사람이었기 때문에 놀랐다.\u003c/li>\u003cli>왕자는 포도가 너무 시어서 함께 나누면 남자의 \u003cb class=\"key\">감정을 \u003c/b>\u003cb class=\"key\">상하게\u003c/b> 할까 봐 배려해서 혼자 먹었다고 설명했다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The prince ate the whole bunch of grapes by himself not out of selfishness but to protect the poor man's feelings.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">가난한 남자가 왕자에게 \u003cb class=\"key\">포도 \u003c/b>\u003cb class=\"key\">한 \u003c/b>\u003cb class=\"key\">송이\u003c/b>를 선물했고, 왕자는 평소와 달리 포도를 혼자 다 먹어 친구들이 놀랐다. 그러나 왕자는 포도가 너무 시어서 함께 나누면 남자의 감정을 상하게 할까 봐 \u003cb class=\"key\">배려\u003c/b>해서 \u003cb class=\"key\">혼자 \u003c/b>\u003cb class=\"key\">다 \u003c/b>\u003cb class=\"key\">먹었다\u003c/b>고 설명했다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":61,"text":"정리해 볼게요. 가난한 남자가 포도 한 송이를 선물했고, 왕자는 평소에 무엇이든 나누던 사람이었지만 이번에는 포도를 혼자 다 먹었다는 점이 핵심이에요. 그 이유는 포도가 너무 시어서 함께 나누면 남자의 감정을 상하게 할까 봐 배려했기 때문입니다. 겉으로 드러난 행동만 보지 말고 숨은 의도를 함께 읽는 것이 중요하다는 점을 기억하고, 다음 지문에서 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
