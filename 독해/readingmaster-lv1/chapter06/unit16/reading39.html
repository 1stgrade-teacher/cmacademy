<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터1 Reading 39 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터1 Reading 39","audioDir":"reading39_audio","preview":false,"count":69,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.668em\">Reading\u003cbr>39\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터1\u003c/div>\u003ch1>The Huge Elephant and the Tiny Ant\u003c/h1>\u003ch2>거대한 코끼리와 작은 개미\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>거대한 코끼리가 작은 개미 가족을 \u003cb class=\"key\">무시\u003c/b>하고 괴롭히자, 개미가 코끼리 몸속으로 들어가 물어 \u003cb class=\"key\">교훈\u003c/b>을 준다. 결국 코끼리는 사과하고 더 이상 다른 작은 동물들을 \u003cb class=\"key\">해치지\u003c/b> 않는다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Even a tiny ant can teach a huge elephant a lesson, showing that true strength lies in not hurting others.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 울창한 숲에 사는 거대한 코끼리와 작은 개미 가족 이야기를 함께 읽어 볼게요. 코끼리는 작은 동물들을 무시하고 힘을 과시하지만, 개미는 지혜로 코끼리에게 교훈을 주고 결국 코끼리는 사과하며 더 이상 다른 동물들을 해치지 않게 됩니다. 이 글의 요지는 작은 존재도 큰 교훈을 줄 수 있고, 진짜 강함은 남을 해치지 않는 데 있다는 것이죠.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">이 이야기는 동물을 사람처럼 말하고 행동하게 만든 \u003cb class=\"key\">우화\u003c/b>로, 큰 힘을 가진 자와 작은 존재의 갈등을 통해 교훈을 전합니다. 동물에게 인간의 성격을 부여하는 이런 방식을 \u003cb class=\"key\">의인화\u003c/b>라고 하며, 영어로는 anthropomorphism이라고 합니다. 코끼리는 몸집과 힘을, 개미는 지혜와 끈기를 나타내는 \u003cb class=\"key\">상징\u003c/b>으로 읽을 수 있습니다. 일상에서도 힘이 센 사람이 약한 사람을 함부로 대하면 주변의 신뢰를 잃기 쉽죠. 그래서 이 글은 힘의 크기와 \u003cb class=\"key\">진짜 \u003c/b>\u003cb class=\"key\">강함\u003c/b>이 다르다는 점을 생각하게 합니다. 결국 상대의 \u003cb class=\"key\">입장\u003c/b>을 헤아리고 해치지 않는 태도가 성숙한 힘임을 보여 줍니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 짚어 볼게요. 이 이야기는 동물을 사람처럼 생각하고 말하게 하는 우화예요. 이런 방식을 의인화라고 하고, 영어로는 anthropomorphism이라고 합니다. 코끼리는 몸집과 힘을, 개미는 지혜와 끈기를 보여 주는 상징으로 읽을 수 있어요. 우리 일상에서도 힘이 센 사람이 약한 사람을 함부로 대하면 주변의 신뢰를 잃기 쉽죠. 그래서 이 글은 힘의 크기와 진짜 강함이 다르다는 점을 생각하게 합니다. 마지막에는 상대의 입장을 헤아리는 태도가 얼마나 중요한지도 보여 주고요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>숲속의 이웃\u003csmall>도입 · 문장 1–4\u003c/small>\u003c/h4>\u003cp>울창한 숲에 거대한 \u003cb class=\"key\">코끼리\u003c/b>와 작은 \u003cb class=\"key\">개미\u003c/b> 가족이 함께 살았어요. 코끼리는 작은 동물들을 \u003cb class=\"key\">무시\u003c/b>하며 자신의 힘을 자랑하고 과시하려 했지요. 반면 개미 가족은 먹이를 구하느라 늘 바빴습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>물 뿌리기 사건\u003csmall>갈등 · 문장 5–10\u003c/small>\u003c/h4>\u003cp>어느 날 개미 가족이 일하러 갈 때 코끼리가 많은 \u003cb class=\"key\">물\u003c/b>을 뿌려 괴롭혔어요. 개미가 남을 이렇게 다치게 하면 안 된다고 말하자 코끼리는 조용히 하지 않으면 \u003cb class=\"key\">죽이겠다\u003c/b>고 협박했습니다. 불쌍한 개미는 겁이 났지만 코끼리에게 \u003cb class=\"key\">교훈\u003c/b>을 주기로 결심했어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>개미의 반격\u003csmall>전환 · 문장 11–15\u003c/small>\u003c/h4>\u003cp>개미는 코끼리 몸속으로 기어들어가 \u003cb class=\"key\">물기\u003c/b> 시작했고, 곧 코끼리는 움직일 수 없게 되었어요. 코끼리는 개미를 쫓아내려 했지만 개미는 계속 물었고, 거대한 코끼리도 작은 개미 앞에서는 아무것도 할 수 없었습니다. 결국 코끼리는 \u003cb class=\"key\">고통\u003c/b>에 소리 지르며 울기 시작했어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>사과와 변화\u003csmall>결론 · 문장 16–19\u003c/small>\u003c/h4>\u003cp>코끼리는 마침내 개미에게 \u003cb class=\"key\">사과\u003c/b>했고, 개미는 네가 우리를 다치게 했을 때 우리 기분이 이랬다며 상대의 \u003cb class=\"key\">입장\u003c/b>을 깨닫게 했어요. 개미가 물기를 멈추고 나오자 코끼리는 더 이상 다른 작은 동물들을 \u003cb class=\"key\">해치지\u003c/b> 않았습니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 이야기가 어떤 순서로 흘러가는지 단계별로 살펴볼게요.","hl":null},{"n":4,"text":"처음에는 울창한 숲에 거대한 코끼리와 작은 개미 가족이 함께 살아요. 코끼리는 작은 동물들을 무시하면서 자신의 힘을 자랑하고 과시하려 하죠. 반면 개미 가족은 먹이를 구하느라 늘 바빠요.","hl":"f0"},{"n":5,"text":"어느 날 개미 가족이 일하러 갈 때 코끼리가 많은 물을 뿌려 괴롭혀요. 개미가 남을 다치게 하면 안 된다고 말하자 코끼리는 조용히 하지 않으면 죽이겠다고 협박하죠. 불쌍한 개미는 겁이 났지만 코끼리에게 교훈을 주기로 결심해요.","hl":"f1"},{"n":6,"text":"개미는 코끼리 몸속으로 기어들어가 물기 시작하고, 곧 코끼리는 움직일 수 없게 돼요. 코끼리는 개미를 쫓아내려 하지만 개미는 계속 물고, 거대한 코끼리도 작은 개미 앞에서는 아무것도 못 하죠. 결국 코끼리는 고통에 소리 지르며 울기 시작해요.","hl":"f2"},{"n":7,"text":"코끼리는 마침내 개미에게 사과하고, 개미는 네가 우리를 다치게 했을 때 우리 기분이 이랬다고 말해요. 그 말은 상대의 입장을 깨닫게 하죠. 개미가 물기를 멈추고 나오자 코끼리는 더 이상 다른 작은 동물들을 해치지 않아요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 17번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 코끼리가 개미 가족을 물로 괴롭히는 \u003cb class=\"key\">문제\u003c/b>에서 시작해, 개미가 몸속으로 들어가 무는 \u003cb class=\"key\">해결\u003c/b> 과정을 시간순으로 보여 줍니다. 사건이 일어난 순서대로 서술되지만, 핵심 교훈은 마지막 개미의 말인 This is how we feel when you hurt us에서 드러납니다. 그래서 주제를 끝에서 밝히는 \u003cb class=\"key\">미괄식\u003c/b> 구조로 볼 수 있습니다. 큰 코끼리와 작은 개미의 \u003cb class=\"key\">대조\u003c/b>도 교훈을 선명하게 만듭니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>On the other hand (4)\u003c/b>\u003cspan>대조\u003c/span>\u003cb>One day (5)\u003c/b>\u003cspan>시간적 계기\u003c/span>\u003cb>but (10)\u003c/b>\u003cspan>반전\u003c/span>\u003cb>Soon (12)\u003c/b>\u003cspan>결과 전환\u003c/span>\u003cb>Finally (16)\u003c/b>\u003cspan>결말\u003c/span>\u003cb>From that day on (19)\u003c/b>\u003cspan>결과·교훈\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">looked down on\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">sprayed a lot of water\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">hurt others\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">teach him a lesson\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">started biting him\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">shouted in pain\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">apologized\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">didn't hurt other small animals anymore\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>거대한 코끼리\u003c/th>\u003cth>작은 개미\u003c/th>\u003c/tr>\u003ctr>\u003ctd>큰 몸집과 힘을 자랑하며 약자를 무시함\u003c/td>\u003ctd>작은 몸집이지만 먹이를 찾아 성실히 삶\u003c/td>\u003c/tr>\u003ctr>\u003ctd>물을 뿌려 개미 가족을 괴롭힘\u003c/td>\u003ctd>겁이 났지만 교훈을 주기로 결심함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>결국 고통에 울며 사과하고 변화함\u003c/td>\u003ctd>몸속에서 물어 상대의 입장을 깨닫게 함\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 코끼리가 개미 가족을 괴롭히는 문제에서 시작해서 개미의 반격으로 해결되는 문제 해결 구조예요. 사건은 시간 순서대로 진행되지만, 핵심 교훈은 마지막 개미의 말인 This is how we feel when you hurt us에서 드러나죠. 그래서 주제를 끝에서 밝히는 미괄식 구조로 볼 수 있어요. 큰 코끼리와 작은 개미의 대조도 교훈을 더 선명하게 만들어 줍니다.","hl":"ty"},{"n":9,"text":"신호어를 보면 On the other hand가 코끼리와 개미의 대조를 알려 주고, but은 예상과 다른 반전을 만들어요. One day는 사건이 시작되는 시간적 계기를, Soon은 개미의 공격이 곧 결과로 이어짐을 보여 주죠. Finally는 결말의 사과 장면으로 넘어가게 하고, From that day on은 그 뒤 코끼리의 변화와 교훈을 정리해 줍니다. 이런 신호어를 따라가면 이야기의 흐름이 훨씬 또렷해져요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>thick\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>울창한, 빽빽한\u003c/span>\u003c/div>\u003cdiv>\u003cb>forest\u003c/b>\u003cem>명사\u003c/em>\u003cspan>숲\u003c/span>\u003c/div>\u003cdiv>\u003cb>huge\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>거대한\u003c/span>\u003c/div>\u003cdiv>\u003cb>tiny\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>작은\u003c/span>\u003c/div>\u003cdiv>\u003cb>ant\u003c/b>\u003cem>명사\u003c/em>\u003cspan>개미\u003c/span>\u003c/div>\u003cdiv>\u003cb>look down on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>무시하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>be proud of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>자랑스러워하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>strength\u003c/b>\u003cem>명사\u003c/em>\u003cspan>힘\u003c/span>\u003c/div>\u003cdiv>\u003cb>show off\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>과시하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>on the other hand\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>반면에\u003c/span>\u003c/div>\u003cdiv>\u003cb>busy\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>바쁜\u003c/span>\u003c/div>\u003cdiv>\u003cb>spray\u003c/b>\u003cem>동사\u003c/em>\u003cspan>뿌리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>hurt\u003c/b>\u003cem>동사\u003c/em>\u003cspan>다치게 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>keep quiet\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>조용히 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>kill\u003c/b>\u003cem>동사\u003c/em>\u003cspan>죽이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>poor\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>불쌍한\u003c/span>\u003c/div>\u003cdiv>\u003cb>scared\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>겁먹은\u003c/span>\u003c/div>\u003cdiv>\u003cb>decide\u003c/b>\u003cem>동사\u003c/em>\u003cspan>결심하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>teach a lesson\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>교훈을 주다\u003c/span>\u003c/div>\u003cdiv>\u003cb>slowly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>천천히\u003c/span>\u003c/div>\u003cdiv>\u003cb>crawl\u003c/b>\u003cem>동사\u003c/em>\u003cspan>기어가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>bite\u003c/b>\u003cem>동사\u003c/em>\u003cspan>물다\u003c/span>\u003c/div>\u003cdiv>\u003cb>soon\u003c/b>\u003cem>부사\u003c/em>\u003cspan>곧\u003c/span>\u003c/div>\u003cdiv>\u003cb>try to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~하려고 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>get out\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>나오다, 꺼내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>continue\u003c/b>\u003cem>동사\u003c/em>\u003cspan>계속하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>in pain\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>고통으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>finally\u003c/b>\u003cem>부사\u003c/em>\u003cspan>결국, 마침내\u003c/span>\u003c/div>\u003cdiv>\u003cb>apologize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>사과하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>from that day on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>그날부터\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"중요한 표현도 짚고 갈게요. look down on은 무시하다, show off는 과시하다, teach a lesson은 교훈을 주다, apologize는 사과하다는 뜻이에요. 특히 hurt는 다치게 하다, in pain은 고통으로라는 뜻으로 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">huge\u003c/b>\u003cspan class=\"m\">거대한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">enormous\u003c/span>\u003cspan class=\"s\">gigantic\u003c/span>\u003cspan class=\"s\">massive\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">tiny\u003c/span>\u003cspan class=\"a\">small\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">tiny\u003c/b>\u003cspan class=\"m\">작은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">small\u003c/span>\u003cspan class=\"s\">little\u003c/span>\u003cspan class=\"s\">minute\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">huge\u003c/span>\u003cspan class=\"a\">enormous\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">look down on\u003c/b>\u003cspan class=\"m\">무시하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">despise\u003c/span>\u003cspan class=\"s\">disdain\u003c/span>\u003cspan class=\"s\">belittle\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">respect\u003c/span>\u003cspan class=\"a\">admire\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">be proud of\u003c/b>\u003cspan class=\"m\">자랑스러워하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">take pride in\u003c/span>\u003cspan class=\"s\">boast about\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">be ashamed of\u003c/span>\u003cspan class=\"a\">be humble about\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">busy\u003c/b>\u003cspan class=\"m\">바쁜\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">occupied\u003c/span>\u003cspan class=\"s\">engaged\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">idle\u003c/span>\u003cspan class=\"a\">free\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">scared\u003c/b>\u003cspan class=\"m\">겁먹은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">afraid\u003c/span>\u003cspan class=\"s\">frightened\u003c/span>\u003cspan class=\"s\">terrified\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">brave\u003c/span>\u003cspan class=\"a\">fearless\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">decide\u003c/b>\u003cspan class=\"m\">결심하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">determine\u003c/span>\u003cspan class=\"s\">resolve\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hesitate\u003c/span>\u003cspan class=\"a\">waver\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">hurt\u003c/b>\u003cspan class=\"m\">다치게 하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">harm\u003c/span>\u003cspan class=\"s\">injure\u003c/span>\u003cspan class=\"s\">wound\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">help\u003c/span>\u003cspan class=\"a\">heal\u003c/span>\u003cspan class=\"a\">protect\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 함께 정리해 볼게요. huge는 enormous나 gigantic과 뜻이 비슷하고, 반대말은 tiny예요. look down on은 despise나 belittle로 바꿔 쓸 수 있고, 반대말은 respect나 admire예요. be proud of는 take pride in이나 boast about으로 표현할 수 있고, busy는 occupied나 engaged와 가깝죠. scared는 afraid나 frightened, decide는 determine이나 resolve로 바꿀 수 있고, hurt의 반대말은 help나 heal로 기억해 주세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">울창하고 푸른 숲에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">In \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">thick, \u003c/span>\u003cspan class=\"tgt\">green \u003c/span>\u003cspan class=\"tgt\">forest,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">살고 있었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">lived \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거대한 코끼리와\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">huge \u003c/span>\u003cspan class=\"tgt\">elephant \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">작은 개미 가족이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">tiny \u003c/span>\u003cspan class=\"tgt\">family \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">ants\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">울창하고 푸른 숲에 거대한 코끼리와 작은 개미 가족이 살고 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 이야기의 \u003cb class=\"key\">배경\u003c/b>을 제시하고, 거대한 코끼리와 아주 작은 개미 가족이라는 \u003cb class=\"key\">대조\u003c/b>되는 등장인물을 소개합니다. 크기의 차이가 이후 갈등의 \u003cb class=\"key\">복선\u003c/b>이 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 문두 제시(장소 배경)\u003c/span> : [전치사구] + [동사 + 주어] : \"울창하고 푸른 숲에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">유도부사 there + 자동사 + 주어\u003c/span> : There + [lived (자동사)] + [주어] : \"거대한 코끼리와 작은 개미 가족이 살고 있었다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"In a thick, green forest, 울창하고 푸른 숲에. there lived, 살고 있었다. a huge elephant and, 거대한 코끼리와. a tiny family of ants, 작은 개미 가족이. 이 문장 전체를 해석하면, 울창하고 푸른 숲에 거대한 코끼리와 작은 개미 가족이 살고 있었다.","hl":"m"},{"n":13,"text":"이 문장은 이야기의 배경을 열어 주고, 거대한 코끼리와 아주 작은 개미 가족을 소개해요. 두 등장인물의 크기 대조가 앞으로 생길 갈등의 복선이 된다는 점을 기억해 주세요.","hl":"mn"},{"n":14,"text":"첫 번째로 In a thick, green forest에서 장소를 나타내는 전치사구가 문장 앞에 와서 이야기의 배경을 먼저 제시해요. 이렇게 전치사구가 앞에 오면 뒤에서 주어가 동사 뒤에 놓이는 구조가 자연스럽죠. 두 번째로 there lived는 유도부사 there가 자동사 lived와 함께 쓰여 거대한 코끼리와 작은 개미 가족이 존재한다는 뜻을 만들어요. 여기서 there는 거기에라는 뜻이 아니라 주어의 존재를 이끄는 유도부사라는 점을 꼭 기억해 주세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">코끼리는\u003c/span>\u003cspan class=\"en\">The elephant\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무시했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">looked \u003c/span>\u003cspan class=\"tgt\">down \u003c/span>\u003cspan class=\"tgt\">on\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 작은 동물들을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">all \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">small \u003c/span>\u003cspan class=\"tgt\">animals\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">코끼리는 모든 작은 동물들을 무시했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 코끼리가 작은 동물들을 \u003cb class=\"key\">무시\u003c/b>하는 \u003cb class=\"key\">오만한\u003c/b> 태도를 보여 줍니다. 이 태도가 이후 개미 가족과의 갈등을 불러일으키는 \u003cb class=\"key\">원인\u003c/b>이 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">구동사 look down on의 관용적 의미\u003c/span> : look down on + [목적어] : \"~을 무시하다, 얕보다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">한정사 all + the + 복수명사\u003c/span> : all the + [복수명사] : \"모든 작은 동물들을\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"The elephant, 코끼리는. looked down on, 무시했다. all the small animals, 모든 작은 동물들을. 이 문장 전체를 해석하면, 코끼리는 모든 작은 동물들을 무시했다.","hl":"m"},{"n":16,"text":"이 문장은 코끼리가 작은 동물들을 무시하는 오만한 태도를 보여 줘요. 이런 태도가 이후 개미 가족과의 갈등을 불러일으키는 원인이 된다는 흐름을 기억해 주세요.","hl":"mn"},{"n":17,"text":"첫 번째로 looked down on은 look down on 형태의 구동사로, 문자 그대로 아래를 본다는 뜻이 아니라 목적어를 얕보고 무시한다는 관용 의미예요. 두 번째로 all the small animals에서는 all이 the 앞에 와서 그 모든 작은 동물들을 뜻하는 한정 표현을 만들어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 19\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 자신의 힘을 자랑스러워해서\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">proud \u003c/span>\u003cspan class=\"tgt\">of\u003c/span> his strength\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그것을 과시하고 싶어 했다\u003c/span>\u003cspan class=\"en\">and wanted \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">show \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">off\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 자신의 힘을 자랑스러워해서 과시하고 싶어 했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 코끼리가 자신의 \u003cb class=\"key\">힘\u003c/b>을 자랑스러워하며 \u003cb class=\"key\">과시\u003c/b>하려는 욕망을 드러냅니다. 이런 태도가 다른 동물을 \u003cb class=\"key\">무시\u003c/b>하는 행동으로 이어져 갈등의 원인을 만듭니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be proud of + 목적어\u003c/span> : be proud of + [목적어] : \"~을 자랑스러워하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : want + [to show (to부정사구)] : \"과시하기를\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">구동사 show off의 대명사 목적어 어순\u003c/span> : show + [it (대명사)] + off : \"그것을 과시하다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"He was proud of his strength, 그는 자신의 힘을 자랑스러워해서. and wanted to show it off, 그리고 그것을 과시하고 싶어 했다. 이 문장 전체를 해석하면, 그는 자신의 힘을 자랑스러워해서 과시하고 싶어 했다.","hl":"m"},{"n":19,"text":"이 문장은 코끼리가 자신의 힘을 자랑스러워하며 과시하려는 욕망을 드러내요. 이런 태도가 다른 동물을 무시하는 행동으로 이어져 갈등의 원인이 된다는 점을 기억해 주세요.","hl":"mn"},{"n":20,"text":"첫 번째로 was proud of는 전치사 of와 결합해 자랑스러워하는 대상을 목적어로 받는 표현이에요. 두 번째로 to show는 want의 목적어 자리에 온 to부정사구로 과시하고 싶다는 바람을 나타내요. 세 번째로 show it off는 구동사 show off에서 목적어가 대명사일 때 동사와 부사 사이에 놓이는 어순을 보여 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">반면에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">On \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">other \u003c/span>\u003cspan class=\"tgt\">hand\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">개미 가족은\u003c/span>\u003cspan class=\"en\">the ant family\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">항상 바빴다\u003c/span>\u003cspan class=\"en\">was always \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">busy \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">먹이를 구하느라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">finding \u003c/span>\u003cspan class=\"tgt\">food\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">반면에 개미 가족은 항상 먹이를 구하느라 바빴다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 코끼리가 힘을 과시하려는 태도를 말한 뒤, \u003cb class=\"key\">반면\u003c/b>이라는 표현으로 개미 가족의 \u003cb class=\"key\">대조\u003c/b>적인 생활을 보여 줍니다. 개미 가족은 힘을 뽐내기보다 \u003cb class=\"key\">먹이를 \u003c/b>\u003cb class=\"key\">구하는 \u003c/b>\u003cb class=\"key\">일\u003c/b>에 늘 바빴다는 점이 이야기의 배경이 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속부사구(전환)\u003c/span> : On the other hand, + [문장] : \"반면에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be busy -ing (동명사)\u003c/span> : be busy + [finding (동명사)] : \"먹이를 구하느라 바쁘다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"On the other hand, 반면에. the ant family, 개미 가족은. was always busy, 항상 바빴다. finding food, 먹이를 구하느라. 이 문장 전체를 해석하면, 반면에 개미 가족은 항상 먹이를 구하느라 바빴다.","hl":"m"},{"n":22,"text":"앞에서 코끼리가 힘을 과시하려는 모습이 나왔죠. 여기서는 반면이라는 표현으로 개미 가족의 대조적인 생활을 보여 줘요. 개미 가족은 먹이를 구하는 일에 늘 바빴다는 배경을 기억하면 됩니다.","hl":"mn"},{"n":23,"text":"첫 번째로 On the other hand는 앞 내용과 대조되는 내용을 이어 주는 접속부사구예요. 두 번째로 busy finding food에서 busy는 형용사이고 뒤에는 동명사 finding이 와서 먹이를 구하느라 바쁘다는 뜻을 만듭니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어느 날,\u003c/span>\u003cspan class=\"en\">One day,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">개미 가족이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">ant \u003c/span>\u003cspan class=\"tgt\">family \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일하러 갈 때,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">going \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">work\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">코끼리가\u003c/span>\u003cspan class=\"en\">the elephant\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 물을 뿌렸다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">sprayed \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">lot \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">water \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들에게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">them\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어느 날, 개미 가족이 일하러 갈 때 코끼리가 그들에게 많은 물을 뿌렸다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 개미 가족이 \u003cb class=\"key\">일하러 \u003c/b>\u003cb class=\"key\">가는\u003c/b> 상황에서 코끼리가 많은 물을 뿌리는 \u003cb class=\"key\">사건\u003c/b>이 일어납니다. 앞에서 코끼리가 작은 동물을 무시하던 태도가 실제 \u003cb class=\"key\">괴롭힘\u003c/b>으로 이어지는 장면이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간 부사절 (when + 과거진행)\u003c/span> : when + [주어] + was/were + [동사-ing], [주절] : \"개미 가족이 일하러 가고 있었을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">spray A on B (3형식)\u003c/span> : spray + [목적어 A] + on + [B] : \"그들에게 많은 물을 뿌렸다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"One day, 어느 날. when the ant family, 개미 가족이. was going to work, 일하러 갈 때. the elephant, 코끼리가. sprayed a lot of water, 많은 물을 뿌렸다. on them, 그들에게. 이 문장 전체를 해석하면, 어느 날, 개미 가족이 일하러 갈 때 코끼리가 그들에게 많은 물을 뿌렸다.","hl":"m"},{"n":25,"text":"개미 가족이 일하러 가는 상황에서 코끼리가 많은 물을 뿌리는 사건이 일어나요. 앞에서 코끼리가 작은 동물을 무시하던 태도가 실제 괴롭힘으로 이어지는 장면입니다.","hl":"mn"},{"n":26,"text":"첫 번째로 when the ant family was going to work는 when이 이끄는 시간 부사절이고, was going to work는 과거진행이라 일하러 가는 중이었던 때를 보여 줘요. 두 번째로 sprayed a lot of water on them은 spray A on B 구조로, A에 해당하는 a lot of water가 목적어이고 B에 해당하는 them이 뿌려진 대상이라는 뜻입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아야!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">&quot;Ouch!\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“아야!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 개미가 코끼리에게 물을 맞고 \u003cb class=\"key\">통증\u003c/b>을 느끼며 내는 \u003cb class=\"key\">감탄사\u003c/b>입니다. 짧지만 코끼리의 괴롭힘에 대한 개미의 즉각적인 \u003cb class=\"key\">반응\u003c/b>을 보여 주어 다음 대화로 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">감탄사\u003c/span> : [감탄사]! : \"아야!\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"\"Ouch!, 아야!. 이 문장 전체를 해석하면, “아야!","hl":"m"},{"n":28,"text":"개미가 코끼리에게 물을 맞고 통증을 느끼며 내는 감탄사예요. 짧지만 코끼리의 괴롭힘에 대한 개미의 즉각적인 반응을 보여 주고 다음 대화로 이어집니다.","hl":"mn"},{"n":29,"text":"Ouch는 갑자기 아픔을 느낄 때 내는 감탄사예요. 문장 성분에 영향을 주지 않고 놀람이나 통증을 바로 표현합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">너는 ~해서는 안 된다\u003c/span>\u003cspan class=\"en\">You \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">should \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">남을 다치게 하다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">hurt\u003c/span> others\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이렇게\u003c/span>\u003cspan class=\"en\">like this!&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">개미들 중 한 마리가 소리쳤다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">cried \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">ants\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">&quot;남을 이렇게 다치게 하면 안 돼!&quot; 개미들 중 한 마리가 소리쳤다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 코끼리가 물을 뿌린 일에 대해 개미 한 마리가 정면으로 \u003cb class=\"key\">항의\u003c/b>하는 장면이에요. 작은 개미가 거대한 코끼리에게 당당하게 말을 건네는 것이 이후 \u003cb class=\"key\">교훈\u003c/b>을 주는 사건의 출발점이 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 should의 부정(당위)\u003c/span> : [주어] + should not + [동사원형] : \"~해서는 안 된다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">인용문 뒤 주어·동사의 도치\u003c/span> : &quot;인용문&quot; + [동사] + [주어] : \"개미들 중 한 마리가 소리쳤다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">one of + 복수명사(부분 표현)\u003c/span> : one of + the[소유격] + [복수명사] : \"그 개미들 중 한 마리\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"You should not, 너는 ~해서는 안 된다. hurt others, 남을 다치게 하다. like this!\", 이렇게. cried one of the ants, 개미들 중 한 마리가 소리쳤다. 이 문장 전체를 해석하면, \"남을 이렇게 다치게 하면 안 돼!\" 개미들 중 한 마리가 소리쳤다.","hl":"m"},{"n":31,"text":"코끼리가 물을 뿌렸는데도 사과하지 않자 개미 한 마리가 정면으로 항의하는 장면이에요. 작은 개미가 거대한 코끼리에게 당당하게 말을 거는 이 장면이 뒤에 나오는 교훈의 출발점이 됩니다.","hl":"mn"},{"n":32,"text":"먼저 should not hurt에서 should는 당위를 나타내는 조동사예요. 그래서 '해서는 안 된다'라는 금지의 뜻이 되고, 조동사 뒤에는 반드시 동사원형이 와서 hurt가 그대로 쓰였어요. 두 번째로 one of the ants는 그 개미들 중 한 마리라는 부분 표현이에요. one of 뒤에는 항상 복수명사가 오고, 주어로 쓰이면 one에 맞춰 단수로 취급한다는 것도 기억해 두세요. 세 번째로 cried one of the ants처럼 인용문 뒤에서는 동사가 주어보다 먼저 나오는 도치가 일어나요. 인용문이 앞에 오면 어순이 이렇게 바뀐다는 점, 꼭 챙겨 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">코끼리가 말했다 “오 어리석은 개미야!\u003c/span>\u003cspan class=\"en\">The elephant \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">said, \u003c/span>\u003cspan class=\"tgt\">&quot;Oh\u003c/span>, \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">stupid \u003c/span>\u003cspan class=\"tgt\">ant\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">코끼리가 말했다. &quot;오, 어리석은 개미야!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 코끼리가 개미를 얕잡아 보며 욕하는 장면이에요. 앞에서 물을 뿌리고도 사과하지 않던 \u003cb class=\"key\">오만\u003c/b>한 태도가 그대로 이어지고 있죠. 여기서 드러나는 \u003cb class=\"key\">무시\u003c/b>가 뒤에 개미가 교훈을 주기로 결심하는 이유가 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">직접화법(직접 인용)\u003c/span> : [주어] + said, + &quot;[인용문]&quot; : \"말했다, '오'\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">호격(사람을 부르는 말)\u003c/span> : [형용사] + [명사] + ! : \"어리석은 개미야!\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"The elephant said, 코끼리가 말했다. \"Oh, “오. stupid ant!\", 어리석은 개미야!. 이 문장 전체를 해석하면, 코끼리가 말했다. \"오, 어리석은 개미야!","hl":"m"},{"n":34,"text":"코끼리가 개미를 얕잡아 보며 욕하는 장면이에요. 앞에서 물을 뿌리고도 사과하지 않던 오만한 태도가 그대로 이어지고 있죠. 이 무시하는 태도가 뒤에 개미가 교훈을 주기로 결심하는 계기가 됩니다.","hl":"mn"},{"n":35,"text":"먼저 said 뒤에 콤마를 찍고 따옴표로 말을 그대로 옮겼으니 직접화법이에요. 이걸 간접화법으로 바꾸면 시제와 대명사가 함께 바뀐다는 점도 기억해 두세요. 그리고 stupid ant는 상대를 부르는 호격 표현인데, 형용사 stupid가 명사 ant를 앞에서 꾸며 주면서 경멸의 감정을 담고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 19\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">조용히 해라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Keep \u003c/span>\u003cspan class=\"tgt\">quiet\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그렇지 않으면 내가 너를 죽일 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">kill \u003c/span>\u003cspan class=\"tgt\">you\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">&quot;조용히 하지 않으면 죽여 버릴거야.&quot;\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 코끼리가 개미를 협박하는 장면이에요. 앞 문장의 \u003cb class=\"key\">무시\u003c/b>가 \u003cb class=\"key\">위협\u003c/b>으로 심해지면서, 불쌍한 개미가 겁을 먹지만 교훈을 주기로 결심하는 결정적 계기가 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문(동사원형으로 시작)\u003c/span> : [동사원형] + ~ : \"조용히 해라\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 or의 용법(그렇지 않으면)\u003c/span> : [명령문], or + [주어] + [동사] : \"그렇지 않으면 나는 너를 죽일 것이다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Keep quiet, 조용히 해라. or I will kill you.\", 그렇지 않으면 내가 너를 죽일 것이다. 이 문장 전체를 해석하면, \"조용히 하지 않으면 죽여 버릴거야.\"","hl":"m"},{"n":37,"text":"코끼리가 개미를 협박하는 장면이에요. 앞에서 보인 무시가 이제는 위협으로 심해지죠. 겁을 먹은 개미가 그래도 교훈을 주기로 결심하는 결정적인 계기가 되는 부분입니다.","hl":"mn"},{"n":38,"text":"먼저 Keep quiet은 주어 You가 생략된 명령문이에요. 동사원형으로 시작한다는 것, 그리고 keep은 원래 목적어와 형용사를 함께 쓰는 동사라서 yourself가 생략된 형태라는 것도 알아 두세요. 두 번째로 or는 여기서 그렇지 않으면이라는 뜻의 접속사로 쓰였어요. 명령문 뒤에 or를 붙이면 위협이나 경고를 나타내는 표현이 된다는 점, 꼭 챙겨 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 19\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 불쌍한 개미는\u003c/span>\u003cspan class=\"en\">The poor ant\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">겁이 났다,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">scared\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나\u003c/span>\u003cspan class=\"en\">but\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 결심했다\u003c/span>\u003cspan class=\"en\">he decided\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그에게 교훈을 주기로.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">teach \u003c/span>\u003cspan class=\"tgt\">him \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">lesson\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">불쌍한 개미는 겁이 났지만 그에게 교훈을 주기로 결심했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 겁을 먹으면서도 개미가 코끼리에게 \u003cb class=\"key\">교훈\u003c/b>을 주기로 마음먹은 문장이에요. 앞에서 코끼리가 물을 뿌리고 죽이겠다고 협박한 흐름을 받아, 작은 개미가 \u003cb class=\"key\">반격\u003c/b>을 준비하는 전환점이 되는 대목이죠. teach him a lesson은 '혼쭐을 내주다, 교훈을 주다'라는 \u003cb class=\"key\">관용표현\u003c/b>이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">감정을 나타내는 수동태 표현\u003c/span> : [주어] + be동사 + [scared (과거분사)] : \"겁이 났다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : decide + [to부정사구 (목적어)] : \"그에게 교훈을 주기로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">4형식 동사와 관용 표현\u003c/span> : teach + [사람] + [것] (teach him a lesson) : \"그에게 교훈을 주다\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"The poor ant, 그 불쌍한 개미는. was scared, 겁이 났다. but, 그러나. he decided, 그는 결심했다. to teach him a lesson, 그에게 교훈을 주기로.. 이 문장 전체를 해석하면, 불쌍한 개미는 겁이 났지만 그에게 교훈을 주기로 결심했다.","hl":"m"},{"n":40,"text":"겁이 났지만 개미는 코끼리에게 교훈을 주기로 마음먹어요. 앞에서 코끼리가 물을 뿌리고 죽이겠다고 협박했으니, 바로 여기가 작은 개미가 반격을 준비하는 전환점이 되는 거죠.","hl":"mn"},{"n":41,"text":"첫 번째로 was scared는 겁을 당하는 입장이라 수동태로 만들어진 표현이고, 여기서는 겁이 난 상태를 나타내는 형용사처럼 굳어졌어요. 두 번째로 to teach him a lesson은 decide 뒤에 온 to부정사라서 가르치기로 결심했다는 명사적 용법이고요. 세 번째로 teach him a lesson은 사람에게 것을 가르치는 4형식 구조에서 나온 관용표현으로 혼쭐을 내주다라는 뜻이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 개미는\u003c/span>\u003cspan class=\"en\">The ant\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">천천히 기어들어 갔다\u003c/span>\u003cspan class=\"en\">slowly \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">crawled \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">코끼리의 몸 속으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">into \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">elephant's \u003c/span>\u003cspan class=\"tgt\">body\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 시작했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">started \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그를 무는 것을.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">biting \u003c/span>\u003cspan class=\"tgt\">him\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">개미는 천천히 코끼리의 몸으로 기어들어 가서 코끼리를 물기 시작했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 개미가 코끼리 몸 속으로 들어가 \u003cb class=\"key\">물기\u003c/b> 시작한 장면이에요. 몸집의 차이를 무기로 바꾼 \u003cb class=\"key\">반격\u003c/b>의 시작이고, 앞 문장에서 세운 '교훈을 주기로 한 결심'이 실제 행동으로 드러난 부분이죠. crawled와 started가 and로 이어져 사건이 \u003cb class=\"key\">연속\u003c/b>해서 일어났음을 보여줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 into (이동·방향)\u003c/span> : crawl + [into + 장소 (전치사구)] : \"코끼리의 몸 속으로 기어들어 갔다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 and에 의한 동사 병렬\u003c/span> : [동사 crawled] + and + [동사 started] : \"그리고 시작했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동명사를 목적어로 취하는 동사\u003c/span> : start + [biting (동명사/목적어)] : \"그를 물기 시작했다\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"The ant, 그 개미는. slowly crawled, 천천히 기어들어 갔다. into the elephant's body, 코끼리의 몸 속으로. and started, 그리고 시작했다. biting him, 그를 무는 것을.. 이 문장 전체를 해석하면, 개미는 천천히 코끼리의 몸으로 기어들어 가서 코끼리를 물기 시작했다.","hl":"m"},{"n":43,"text":"개미가 코끼리 몸 속으로 들어가 물기 시작한 장면이에요. 몸집의 차이를 무기로 바꾼 반격의 시작이고, 앞 문장에서 세운 결심이 실제 행동으로 드러난 부분이죠.","hl":"mn"},{"n":44,"text":"첫 번째로 into는 밖에서 안으로 들어가는 방향을 나타내는 전치사라서 코끼리의 몸 속으로라는 전치사구를 만들어요. 두 번째로 and는 crawled와 started를 나란히 연결하는 등위접속사라서 두 동작이 병렬로 이어지죠. 세 번째로 started biting him에서 start는 동명사를 목적어로 데려와서 물기 시작했다는 뜻을 만든답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">곧,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Soon\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 코끼리는\u003c/span>\u003cspan class=\"en\">the elephant\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">움직일 수 없었다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">couldn't \u003c/span>\u003cspan class=\"tgt\">move\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">곧, 코끼리는 움직일 수 없었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 개미의 공격 결과 코끼리가 \u003cb class=\"key\">통제\u003c/b>를 잃었다는 것을 한 문장으로 압축한 부분이에요. 거대한 코끼리가 작은 개미 앞에서 \u003cb class=\"key\">무력\u003c/b>해진 대비가 이 이야기의 핵심이고, 이어지는 사과와 결말로 넘어가는 \u003cb class=\"key\">인과\u003c/b>의 고리죠. couldn't는 '할 수 없었다'라는 과거의 \u003cb class=\"key\">능력\u003c/b> 부정이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간 부사(문장 부사)\u003c/span> : [Soon (시간부사)] + , + [주어 + 동사] : \"곧\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 could의 부정형(과거의 능력)\u003c/span> : [주어] + couldn't + [동사원형] : \"움직일 수 없었다\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"Soon, 곧. the elephant, 그 코끼리는. couldn't move, 움직일 수 없었다.. 이 문장 전체를 해석하면, 곧, 코끼리는 움직일 수 없었다.","hl":"m"},{"n":46,"text":"개미의 공격으로 코끼리가 통제를 잃었다는 걸 한 문장으로 압축했어요. 거대한 코끼리가 작은 개미 앞에서 무력해진 대비가 이 이야기의 핵심이고, 이어지는 사과와 결말로 가는 인과의 고리예요.","hl":"mn"},{"n":47,"text":"첫 번째로 Soon은 곧이라는 시간 부사로 앞 사건이 바로 이어진다는 걸 알려줘요. 두 번째로 couldn't move는 조동사 could의 부정형이라서 움직일 수 없었다는 과거의 능력을 말하고, 조동사 뒤에는 동사원형 move가 온답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">코끼리는 시도했다\u003c/span>\u003cspan class=\"en\">The elephant \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">tried \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">개미를 쫓아내려고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">get \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">ant \u003c/span>\u003cspan class=\"tgt\">out\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 그는(개미는) 계속했다\u003c/span>\u003cspan class=\"en\">but he \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">continued \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그를 무는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">biting\u003c/span> him.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">코끼리는 개미를 쫓아내려 했지만 개미는 계속해서 물었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 코끼리가 아무리 커도 몸속에 들어온 개미를 밖으로 내보내지 못하는 장면이에요. 앞부분에서는 코끼리가 개미를 괴롭히는 쪽이었지만, 여기서는 \u003cb class=\"key\">입장이 \u003c/b>\u003cb class=\"key\">뒤바뀌어\u003c/b> 코끼리가 당하는 쪽이 됩니다. tried는 '애썼지만 잘 되지 않았다'는 \u003cb class=\"key\">실패\u003c/b>의 뉘앙스를, continued는 개미가 \u003cb class=\"key\">멈추지 \u003c/b>\u003cb class=\"key\">않고\u003c/b> 계속 물었다는 뜻을 담고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : tried [타동사] + to get [to부정사구/목적어] : \"얻으려고 시도했다, 쫓아내려고 했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">get + 목적어 + 형용사(목적격 보어)\u003c/span> : get [동사] + the ant [목적어] + out [목적격 보어] : \"개미를 밖으로 내보내다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동명사를 목적어로 취하는 동사(continue)\u003c/span> : continued [동사] + biting [동명사/목적어] : \"무는 것을 계속했다\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"The elephant tried, 코끼리는 시도했다. to get the ant out, 개미를 쫓아내려고. but he continued, 그러나 그는(개미는) 계속했다. biting him, 그를 무는 것을. 이 문장 전체를 해석하면, 코끼리는 개미를 쫓아내려 했지만 개미는 계속해서 물었다.","hl":"m"},{"n":49,"text":"이 문장에서 중요한 건 주인공이 바뀐다는 점이에요. 앞까지는 코끼리가 개미를 괴롭히는 쪽이었는데, 여기서는 입장이 뒤바뀌어 코끼리가 당하는 쪽이 되죠. tried에는 애썼지만 실패했다는 뉘앙스가 담겨 있고, continued는 개미가 멈추지 않고 계속 물었다는 뜻을 전해 줍니다.","hl":"mn"},{"n":50,"text":"먼저 tried to get에서 to get은 tried의 목적어로 쓰인 to부정사예요. 두 번째로 get the ant out은 get이 목적어 the ant를 취하고 out이 목적격 보어로 붙은 구조죠. 마지막으로 continued biting은 continue가 동명사를 목적어로 데려가는 동사라서 biting이 온 겁니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 19\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">코끼리는 큰 동물이었다\u003c/span>\u003cspan class=\"en\">The elephant \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">big \u003c/span>\u003cspan class=\"tgt\">animal\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 그는 아무것도 할 수 없었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">but\u003c/span> he \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">couldn't \u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">anything\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">작은 개미에 대항해서\u003c/span>\u003cspan class=\"en\">against the tiny ant.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">코끼리는 큰 동물이었지만 작은 개미에 대항해서 아무것도 할 수 없었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 몸집이 큰 코끼리가 작은 개미 하나 앞에서 힘을 전혀 쓰지 못한다는 장면이에요. 크기와 실제 힘은 다를 수 있다는 \u003cb class=\"key\">아이러니\u003c/b>를 보여 주는 문장이죠. 이 이야기의 \u003cb class=\"key\">주제\u003c/b>가 가장 잘 드러난 부분이라 \u003cb class=\"key\">교훈\u003c/b>과 함께 기억해 두세요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">2형식 문장(주어 + be동사 + 주격보어)\u003c/span> : The elephant [주어] + was [be동사] + a big animal [주격보어] : \"코끼리는 큰 동물이었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 but(역접)\u003c/span> : [문장] + but + [문장] : \"그러나\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">부정문에서의 any 계열 대명사(anything)\u003c/span> : could not + do + anything : \"아무것도 할 수 없었다\"\u003c/div>\u003c/div>","segs":[{"n":51,"text":"The elephant was a big animal, 코끼리는 큰 동물이었다. but he couldn't do anything, 그러나 그는 아무것도 할 수 없었다. against the tiny ant, 작은 개미에 대항해서. 이 문장 전체를 해석하면, 코끼리는 큰 동물이었지만 작은 개미에 대항해서 아무것도 할 수 없었다.","hl":"m"},{"n":52,"text":"이 문장은 이야기의 핵심을 보여 줍니다. 몸집이 큰 코끼리지만 작은 개미 하나 앞에서는 힘을 쓰지 못한다는 아이러니가 담겨 있죠. 겉으로 보이는 크기와 실제 힘은 다를 수 있다는 교훈으로도 이어지는 문장입니다.","hl":"mn"},{"n":53,"text":"첫 번째로 was a big animal은 be동사 뒤에 주격보어가 온 구조, 그러니까 주어의 상태를 설명하는 형태예요. 두 번째로 but은 앞뒤 내용이 반대일 때 쓰는 등위접속사죠. 세 번째로 couldn't do anything에서는 부정어와 함께 쓰이니까 some이 아니라 anything을 써서 전체 부정을 만듭니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 15 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 소리쳤다\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">shouted \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고통으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">pain\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 울기 시작했다\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">started \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">cry\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 고통으로 소리를 지르며 울기 시작했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 개미에게 계속 물린 코끼리가 결국 고통을 견디지 못하고 우는 장면이에요. 힘을 자랑하던 코끼리가 \u003cb class=\"key\">완전히 \u003c/b>\u003cb class=\"key\">무너진\u003c/b> 순간으로, 다음 문장의 사과로 자연스럽게 이어집니다. in pain은 '아파서, 고통으로'라는 \u003cb class=\"key\">상태\u003c/b>를 나타내는 표현이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 역할(in + 추상명사)\u003c/span> : shouted [동사] + in pain [전치사구/부사 역할] : \"고통으로 소리쳤다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사를 목적어로 취하는 동사(start)\u003c/span> : started [동사] + to cry [to부정사/목적어] : \"울기 시작했다\"\u003c/div>\u003c/div>","segs":[{"n":54,"text":"He shouted, 그는 소리쳤다. in pain, 고통으로. and started to cry, 그리고 울기 시작했다. 이 문장 전체를 해석하면, 그는 고통으로 소리를 지르며 울기 시작했다.","hl":"m"},{"n":55,"text":"힘을 자랑하던 코끼리가 개미에게 계속 물려 결국 우는 장면이에요. 완전히 무너진 순간이고, 그래서 다음에 사과가 나오게 되죠. in pain은 아파서, 고통으로라는 상태를 담은 표현입니다.","hl":"mn"},{"n":56,"text":"첫 번째로 shouted in pain에서 in pain은 '고통으로'라는 상태를 나타내는 부사구로 동사 shouted를 꾸며 줍니다. 두 번째로 started to cry에서는 start가 to부정사를 목적어로 데려가서 to cry가 목적어 자리에 온 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 16 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">결국\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Finally\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 사과했다\u003c/span>\u003cspan class=\"en\">he \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">apologized \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">개미에게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">ant\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">결국 그는 개미에게 사과했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 코끼리가 고통을 견디다 못해 마침내 자신의 잘못을 인정하는 장면으로, 이야기가 갈등에서 화해로 넘어가는 \u003cb class=\"key\">전환점\u003c/b>이에요. 'apologize to + 사람'은 '~에게 사과하다'라는 뜻으로, 자신이 \u003cb class=\"key\">상처\u003c/b>를 준 상대에게 미안함을 표현하는 흐름을 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">문장 부사 Finally\u003c/span> : Finally, + [주어 + 동사] : \"결국, 마침내\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">자동사 + 전치사(to)\u003c/span> : apologize [자동사] + to + [사람] : \"개미에게 사과했다\"\u003c/div>\u003c/div>","segs":[{"n":57,"text":"Finally, 결국. he apologized, 그는 사과했다. to the ant, 개미에게. 이 문장 전체를 해석하면, 결국 그는 개미에게 사과했다.","hl":"m"},{"n":58,"text":"코끼리가 고통을 견디다 못해 마침내 자신의 잘못을 인정하는 장면이에요. 여기서 Finally는 마침내, 결국이라는 뜻으로 길게 이어지던 갈등이 끝나는 지점을 알려 줍니다.","hl":"mn"},{"n":59,"text":"첫 번째로 apologize는 목적어를 바로 받지 못하는 자동사예요. 그래서 전치사 to를 꼭 거쳐서 사람을 받는다는 점을 기억하세요. 두 번째로 문장 맨 앞에 온 Finally는 결말을 표시하는 부사라서 결국이라고 해석하면 자연스러워요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 17 / 19\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">개미가 말했다\u003c/span>\u003cspan class=\"en\">The ant said,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“이것이 우리가 느끼는 방식이야\u003c/span>\u003cspan class=\"en\">&quot;This is \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">feel\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">네가 우리를 다치게 할 때!”\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">hurt \u003c/span>\u003cspan class=\"tgt\">us\u003c/span>!&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">개미는 “네가 우리를 다치게 했을 때 우리 기분이 이랬어!”라고 말했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 개미가 코끼리에게 자신들이 당한 고통을 그대로 돌려주며, 상대의 아픔을 일깨워 주는 핵심 대사예요. 'This is how'는 '이것이 바로 ~한 방식이다'라는 뜻으로, 앞의 행동과 뒤의 감정을 자연스럽게 연결해 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문사 how가 이끄는 명사절(간접의문문)\u003c/span> : This is + how + [주어 + 동사] : \"우리가 느끼는 방식\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 when의 시간 부사절\u003c/span> : when + [주어 + 동사] : \"네가 우리를 다치게 할 때\"\u003c/div>\u003c/div>","segs":[{"n":60,"text":"The ant said, 개미가 말했다. \"This is how we feel, “이것이 우리가 느끼는 방식이야. when you hurt us!\", 네가 우리를 다치게 할 때!”. 이 문장 전체를 해석하면, 개미는 “네가 우리를 다치게 했을 때 우리 기분이 이랬어!”라고 말했다.","hl":"m"},{"n":61,"text":"개미가 코끼리에게 자기가 당한 고통을 그대로 돌려주면서, 상대의 아픔을 깨닫게 해 주는 장면이에요. This is how는 이것이 바로 이러이러한 방식이다라는 뜻으로, 코끼리가 한 행동과 개미의 기분을 나란히 놓아 주는 표현입니다.","hl":"mn"},{"n":62,"text":"첫 번째로 how we feel에서 how는 어떻게라는 의문사로 완전한 절을 이끌어 명사절을 만듭니다. 그래서 우리가 느끼는 방식이라고 해석해요. 두 번째로 when you hurt us에서 when은 ~할 때라는 시간을 나타내는 접속사예요. 그러니까 네가 우리를 다치게 하는 그 순간의 기분이라고 이해하면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 18 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">개미가\u003c/span>\u003cspan class=\"en\">The ant\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무는 것을 멈추고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">stopped \u003c/span>\u003cspan class=\"tgt\">biting \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 나왔다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">came \u003c/span>\u003cspan class=\"tgt\">out \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">코끼리의 몸에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">elephant's \u003c/span>\u003cspan class=\"tgt\">body\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">개미가 무는 것을 멈추고 코끼리의 몸에서 나왔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 개미가 복수를 끝내고 코끼리 몸 밖으로 빠져나오는 장면으로, 사건이 마무리되는 대목이에요. 'stop biting'과 'come out'이 and로 이어져 두 동작이 차례로 일어났음을 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">stop + 동명사(목적어)\u003c/span> : stop + [동명사] : \"무는 것을 멈췄다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 and의 병렬\u003c/span> : [동사 과거형] and [동사 과거형] : \"멈추고 나왔다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">구동사 come out of\u003c/span> : come out of + [장소] : \"코끼리의 몸에서 나왔다\"\u003c/div>\u003c/div>","segs":[{"n":63,"text":"The ant, 개미가. stopped biting, 무는 것을 멈추고. and came out, 그리고 나왔다. of the elephant's body, 코끼리의 몸에서. 이 문장 전체를 해석하면, 개미가 무는 것을 멈추고 코끼리의 몸에서 나왔다.","hl":"m"},{"n":64,"text":"개미가 복수를 끝내고 코끼리 몸 밖으로 빠져나오는 장면이에요. 앞에서 시작된 무는 행동과 밖으로 나오는 행동이 and로 이어지면서 사건이 마무리되는 흐름을 보여 줍니다.","hl":"mn"},{"n":65,"text":"첫 번째로 stopped biting에서 stop 뒤에 동명사가 오면 하던 행동을 멈춘다는 뜻이에요. to부정사가 오면 멈춰서 무엇을 하려는 목적을 나타내니 구별해야 합니다. 두 번째로 and가 stopped와 came이라는 두 개의 과거형 동사를 대등하게 이어 주니까 두 동작이 연속해서 일어났다는 걸 알 수 있어요. 세 번째로 came out of는 밖으로 나오다라는 구동사이고, of가 출발점을 나타냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 19 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그날부터\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">From \u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">day \u003c/span>\u003cspan class=\"tgt\">on\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 해치지 않았다\u003c/span>\u003cspan class=\"en\">he \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">didn't \u003c/span>\u003cspan class=\"tgt\">hurt\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 작은 동물들을\u003c/span>\u003cspan class=\"en\">other small animals\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 이상\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">anymore\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그날부터 그는 더 이상 다른 작은 동물들을 해치지 않았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이야기의 \u003cb class=\"key\">결말\u003c/b>을 맺는 문장으로, 코끼리가 개미에게 교훈을 받은 뒤 실제로 \u003cb class=\"key\">변화\u003c/b>했음을 보여 줍니다. From that day on은 ‘그날부터 쭉’이라는 뜻으로, 그 변화가 그 후로도 \u003cb class=\"key\">계속\u003c/b>된다는 점을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 용법(시간)\u003c/span> : [from + that day + on] → 문장 전체를 수식하는 시간 부사구 : \"그날부터 (쭉)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거시제 부정문(didn't + 동사원형)\u003c/span> : 주어 + [didn't] + [동사원형] ~ : \"해치지 않았다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">부정어와 호응하는 부사\u003c/span> : [not] + 동사 ~ + anymore = 더 이상 ~하지 않다 : \"더 이상\"\u003c/div>\u003c/div>","segs":[{"n":66,"text":"From that day on, 그날부터. he didn't hurt, 그는 해치지 않았다. other small animals, 다른 작은 동물들을. anymore, 더 이상. 이 문장 전체를 해석하면, 그날부터 그는 더 이상 다른 작은 동물들을 해치지 않았다.","hl":"m"},{"n":67,"text":"이 문장은 이야기의 결말을 맺는 문장이에요. 코끼리가 개미에게 교훈을 얻은 뒤에 실제로 변화했다는 걸 보여 주죠. From that day on은 그날부터 쭉이라는 뜻이라서, 그 변화가 그 뒤로도 계속된다는 점을 강조해 줍니다.","hl":"mn"},{"n":68,"text":"첫 번째, From that day on은 전치사 from에 that day와 on이 붙어서 만들어진 시간 부사구예요. 그래서 주어나 목적어가 아니라 동사 hurt를 꾸며 주는 역할을 하죠. 두 번째, didn't hurt는 과거시제 부정문이에요. 조동사 didn't 뒤에는 반드시 동사원형이 와서 hurt에 -ed를 또 붙이지 않는다는 점을 꼭 기억하세요. 세 번째, anymore는 부정어 not과 짝을 이루어서 더 이상 않다는 부정의 의미를 완성해 주는 부사예요. 그래서 이 문장처럼 didn't와 함께 쓰인 형태를 통째로 익혀 두면 좋아요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>거대한 코끼리는 작은 개미 가족을 \u003cb class=\"key\">무시\u003c/b>하고 물을 뿌려 괴롭혔습니다.\u003c/li>\u003cli>개미는 겁이 났지만 코끼리에게 \u003cb class=\"key\">교훈\u003c/b>을 주기로 결심하고 몸속으로 들어가 물었습니다.\u003c/li>\u003cli>코끼리는 작은 개미 앞에서 아무것도 못 하고 \u003cb class=\"key\">고통\u003c/b>에 울며 사과했습니다.\u003c/li>\u003cli>개미는 상대의 \u003cb class=\"key\">입장\u003c/b>을 깨닫게 했고, 코끼리는 다시는 작은 동물들을 \u003cb class=\"key\">해치지\u003c/b> 않았습니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Even a tiny ant can teach a huge elephant a lesson, showing that true strength lies in not hurting others.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">거대한 코끼리가 작은 개미 가족을 \u003cb class=\"key\">무시\u003c/b>하고 괴롭히자, 개미가 코끼리 몸속으로 들어가 물어 \u003cb class=\"key\">교훈\u003c/b>을 준다. 결국 코끼리는 사과하고 더 이상 다른 작은 동물들을 \u003cb class=\"key\">해치지\u003c/b> 않는다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":69,"text":"정리해 볼게요. 이 이야기는 거대한 코끼리가 작은 개미 가족을 무시하고 괴롭혔지만, 개미가 교훈을 주면서 코끼리가 사과하고 변화하는 과정을 보여 줍니다. 개미의 말을 통해 상대의 입장을 헤아리는 태도가 얼마나 중요한지 알 수 있어요. 결국 진짜 강함은 다른 작은 동물들을 해치지 않는 데서 나온다는 점을 기억하면 좋겠습니다. 오늘도 수고 많았어요, 다음 시간에 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
