<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터1 Reading 20 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터1 Reading 20","audioDir":"20_audio","preview":false,"count":66,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.668em\">Reading\u003cbr>20\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터1\u003c/div>\u003ch1>A New Season, A New Me\u003c/h1>\u003ch2>새로운 계절, 새로운 나\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>새로운 계절이 다가오고 \u003cb class=\"key\">모든 \u003c/b>\u003cb class=\"key\">것이 \u003c/b>\u003cb class=\"key\">새롭게\u003c/b> 느껴지자, 화자는 방을 청소하고 새 이불을 깔고 싶은 \u003cb class=\"key\">강한 \u003c/b>\u003cb class=\"key\">욕구\u003c/b>를 느낀다. 전에는 청소를 싫어했지만 이제는 콧노래를 부르며 춤추고 청소를 \u003cb class=\"key\">즐긴다\u003c/b>.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>As a new season arrives, the narrator feels renewed and changes from someone who disliked cleaning into someone who enjoys it.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 새로운 계절이 오면서 한 사람의 마음과 행동이 어떻게 달라지는지 보여 주는 지문을 함께 읽어 볼 거예요. 이 글은 봄기운을 느끼며 모든 것이 새롭게 느껴지자 청소를 하고 싶은 강한 욕구를 느끼는 화자의 이야기를 담고 있어요. 결국 화자는 전에는 싫어하던 청소를 이제 즐긴다는 점이 이 글의 요지랍니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">계절의 변화는 단순히 날씨만 바꾸는 것이 아니라 우리의 마음가짐에도 큰 영향을 줍니다. 봄은 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">시작\u003c/b>과 \u003cb class=\"key\">재충전\u003c/b>을 상징하는 대표적인 계절이죠. 햇빛과 기온의 변화는 사람의 기분과 \u003cb class=\"key\">동기 \u003c/b>\u003cb class=\"key\">부여\u003c/b>(motivation)에 영향을 주어, 평소 미뤄 두었던 일을 시작하게 만들기도 합니다. 이런 환경 변화가 행동 변화의 계기가 되는 현상을 \u003cb class=\"key\">신호 \u003c/b>\u003cb class=\"key\">효과\u003c/b>(cue effect)라고 부르기도 해요. 방학이 끝날 때 책상을 정리하고 새 학기를 준비하는 모습을 떠올리면 이해하기 쉬울 것입니다. 이 지문의 화자도 계절 변화라는 외부 자극을 통해 청소에 대한 \u003cb class=\"key\">태도\u003c/b>를 바꾸고 있습니다.\u003c/div>","segs":[{"n":2,"text":"계절의 변화는 단순히 날씨만 바꾸는 것이 아니라 우리의 마음가짐에도 큰 영향을 줘요. 봄은 새로운 시작과 재충전을 상징하는 대표적인 계절이죠. 햇빛과 기온의 변화는 사람의 기분과 동기 부여에 영향을 주어, 평소 미뤄 두었던 일을 시작하게 만들기도 해요. 이런 환경 변화가 행동 변화의 계기가 되는 현상을 신호 효과라고 부르기도 합니다. 방학이 끝날 때 책상을 정리하고 새 학기를 준비하는 모습을 떠올리면 이해하기 쉬워요. 이 지문의 화자도 계절 변화라는 외부 자극을 통해 청소에 대한 태도를 바꾸고 있답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>새 계절의 도래\u003csmall>도입 · 문장 1–4\u003c/small>\u003c/h4>\u003cp>\u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">계절\u003c/b>이 다가오고 \u003cb class=\"key\">살을 \u003c/b>\u003cb class=\"key\">에는 \u003c/b>\u003cb class=\"key\">바람\u003c/b>과 차가운 공기가 사라집니다. 모든 눈이 녹아 가는 모습을 통해 겨울이 끝나고 있음을 보여 줍니다. 이 장면은 글 전체에 새로운 변화가 시작될 것임을 암시합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>새로움과 미소\u003csmall>전환 · 문장 5–10\u003c/small>\u003c/h4>\u003cp>새들이 행복하게 노래하고, 그 노래가 화자로 하여금 \u003cb class=\"key\">창문을 \u003c/b>\u003cb class=\"key\">열게\u003c/b> 만듭니다. 신선한 공기 속에서 모든 것이 새롭게 느껴지고 보이며, 창밖의 \u003cb class=\"key\">꽃봉오리\u003c/b>가 피려고 합니다. 이러한 장면은 화자를 \u003cb class=\"key\">계속 \u003c/b>\u003cb class=\"key\">미소 \u003c/b>\u003cb class=\"key\">짓게\u003c/b> 만듭니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>청소하고 싶은 마음\u003csmall>전환 · 문장 11–14\u003c/small>\u003c/h4>\u003cp>갑자기 방을 청소하고 새 이불을 깔고 싶은 \u003cb class=\"key\">강한 \u003c/b>\u003cb class=\"key\">욕구\u003c/b>가 생깁니다. 화자의 입에서는 \u003cb class=\"key\">콧노래\u003c/b>가 나오고, 놀랍게도 청소를 하면서 흥얼거리고 춤추는 자신을 발견합니다. 하지만 화자는 전에는 \u003cb class=\"key\">청소를 \u003c/b>\u003cb class=\"key\">싫어\u003c/b>했다고 고백합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>즐거운 청소\u003csmall>결론 · 문장 15–18\u003c/small>\u003c/h4>\u003cp>이제 화자는 더 이상 \u003cb class=\"key\">Grouchy\u003c/b>가 아니라고 말합니다. Grouchy는 항상 불평하지만 지금의 나는 그렇지 않다는 것입니다. 화자는 청소를 \u003cb class=\"key\">즐긴다\u003c/b>고 말하며 글을 마무리합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 지문이 어떤 순서로 흘러가는지 단계별로 살펴볼게요.","hl":null},{"n":4,"text":"첫 단계는 새로운 계절이 다가오는 장면이에요. 사방에 더 이상 살을 에는 바람이 없고 차가운 공기도 사라졌죠. 모든 눈이 녹아 가는 모습을 통해 겨울이 끝나고 있음을 보여 줍니다.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 새들이 행복하게 노래하고, 그 노래가 화자로 하여금 창문을 열게 만듭니다. 화자는 신선한 공기를 마시며 모든 것이 새롭게 느껴지고 보인다고 말해요. 창밖의 꽃봉오리가 피려는 모습은 화자를 계속 미소 짓게 만들죠.","hl":"f1"},{"n":6,"text":"세 번째 단계에서 분위기가 한 번 더 바뀝니다. 갑자기 방을 청소하고 새 이불을 깔고 싶은 강한 욕구가 생기고, 입에서는 콧노래가 나오죠. 놀랍게도 화자는 청소를 하면서 흥얼거리고 춤을 추는데, 전에는 청소를 싫어했다고 고백합니다.","hl":"f2"},{"n":7,"text":"마지막 단계에서 화자는 더 이상 Grouchy가 아니라고 말합니다. Grouchy는 항상 불평하지만 지금의 나는 그렇지 않다는 거죠. 이렇게 화자는 청소를 즐긴다라고 말하며 글을 마무리합니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">비교·대조\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 18번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 \u003cb class=\"key\">과거\u003c/b>의 나와 \u003cb class=\"key\">현재\u003c/b>의 나를 비교·대조하는 방식으로 전개됩니다. 전에는 청소를 싫어하고 불평하던 모습을 보여 주고, 지금은 청소를 즐기는 모습을 보여 주죠. 이러한 대조가 글의 후반부에 분명히 드러나므로 \u003cb class=\"key\">미괄식\u003c/b> 구조로 볼 수 있습니다. 마지막 문장이 글 전체의 \u003cb class=\"key\">주제\u003c/b>를 완성한다는 점도 미괄식의 특징입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Suddenly (11)\u003c/b>\u003cspan>전환\u003c/span>\u003cb>before (14)\u003c/b>\u003cspan>과거 대조\u003c/span>\u003cb>But now? (15)\u003c/b>\u003cspan>현재로 전환\u003c/span>\u003cb>no longer (16)\u003c/b>\u003cspan>부정을 통한 변화\u003c/span>\u003cb>but not me now (17)\u003c/b>\u003cspan>대조 강조\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">new season\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">fresh air\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">everything feels and seems new\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">flower buds are about to bloom\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a strong wish\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">humming and dancing\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">no longer Grouchy\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">enjoying cleaning\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Before\u003c/th>\u003cth>Now\u003c/th>\u003c/tr>\u003ctr>\u003ctd>청소를 싫어함\u003c/td>\u003ctd>청소를 즐김\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Grouchy처럼 불평함\u003c/td>\u003ctd>더 이상 Grouchy가 아님\u003c/td>\u003c/tr>\u003ctr>\u003ctd>콧노래와 춤 없음\u003c/td>\u003ctd>청소하며 콧노래와 춤\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 과거의 나와 현재의 나를 비교하고 대조하는 방식으로 전개됩니다. 전에는 청소를 싫어하고 불평하던 모습을 보여 주고, 지금은 청소를 즐기는 모습을 보여 주죠. 이런 대조가 글의 후반부에 분명히 드러나기 때문에 미괄식 구조로 볼 수 있어요. 마지막 문장이 글 전체의 주제를 완성한다는 점도 미괄식의 특징이랍니다.","hl":"ty"},{"n":9,"text":"신호어를 보면 과거와 현재의 전환이 아주 선명합니다. 전에는 청소를 좋아하지 않았다는 문장 뒤에 But now?라는 질문이 나오고, 이어서 no longer와 but not me now가 등장하죠. 이런 표현들은 독자에게 대조의 기준이 바뀐다는 신호를 줍니다. 그래서 before와 now를 중심으로 화자의 태도 변화를 따라가며 읽으면 좋아요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>season\u003c/b>\u003cem>명사\u003c/em>\u003cspan>계절\u003c/span>\u003c/div>\u003cdiv>\u003cb>biting\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>살을 에는 듯한, 매서운\u003c/span>\u003c/div>\u003cdiv>\u003cb>all around\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>사방에\u003c/span>\u003c/div>\u003cdiv>\u003cb>chilly\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>쌀쌀한, 차가운\u003c/span>\u003c/div>\u003cdiv>\u003cb>melt away\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>녹아 없어지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>happily\u003c/b>\u003cem>부사\u003c/em>\u003cspan>행복하게\u003c/span>\u003c/div>\u003cdiv>\u003cb>make\u003c/b>\u003cem>동사\u003c/em>\u003cspan>~하게 만들다\u003c/span>\u003c/div>\u003cdiv>\u003cb>fresh air\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>신선한 공기\u003c/span>\u003c/div>\u003cdiv>\u003cb>feel\u003c/b>\u003cem>동사\u003c/em>\u003cspan>느껴지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>seem\u003c/b>\u003cem>동사\u003c/em>\u003cspan>~처럼 보이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>flower bud\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>꽃봉오리\u003c/span>\u003c/div>\u003cdiv>\u003cb>be about to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>막 ~하려고 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>bloom\u003c/b>\u003cem>동사\u003c/em>\u003cspan>꽃이 피다\u003c/span>\u003c/div>\u003cdiv>\u003cb>keep\u003c/b>\u003cem>동사\u003c/em>\u003cspan>계속 ~하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>suddenly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>갑자기\u003c/span>\u003c/div>\u003cdiv>\u003cb>strong wish\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>강한 욕구\u003c/span>\u003c/div>\u003cdiv>\u003cb>own\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>자신의\u003c/span>\u003c/div>\u003cdiv>\u003cb>blanket\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이불, 담요\u003c/span>\u003c/div>\u003cdiv>\u003cb>humming\u003c/b>\u003cem>명사\u003c/em>\u003cspan>콧노래, 흥얼거림\u003c/span>\u003c/div>\u003cdiv>\u003cb>come out of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에서 나오다\u003c/span>\u003c/div>\u003cdiv>\u003cb>surprisingly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>놀랍게도\u003c/span>\u003c/div>\u003cdiv>\u003cb>while\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>~하는 동안\u003c/span>\u003c/div>\u003cdiv>\u003cb>no longer\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>더 이상 ~ 아니다\u003c/span>\u003c/div>\u003cdiv>\u003cb>complain\u003c/b>\u003cem>동사\u003c/em>\u003cspan>불평하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>enjoy\u003c/b>\u003cem>동사\u003c/em>\u003cspan>즐기다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"중요한 단어도 몇 개 짚어 볼게요. biting은 살을 에는 듯한, chilly는 쌀쌀한, melt away는 녹아 없어지다라는 뜻이에요. flower bud는 꽃봉오리, be about to는 막 하려고 하다, enjoy는 즐기다로 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">chilly\u0 an class=\"s\">whine\u003c/span>\u003cspan class=\"s\">moan\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">praise\u003c/span>\u003cspan class=\"a\">approve\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">enjoy\u003c/b>\u003cspan class=\"m\">즐기다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">like\u003c/span>\u003cspan class=\"s\">relish\u003c/span>\u003cspan class=\"s\">appreciate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">dislike\u003c/span>\u003cspan class=\"a\">hate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">strong\u003c/b>\u003cspan class=\"m\">강한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">powerful\u003c/span>\u003cspan class=\"s\">intense\u003c/span>\u003cspan class=\"s\">forceful\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">weak\u003c/span>\u003cspan class=\"a\">mild\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 함께 정리해 볼게요. chilly는 cold나 cool과 가깝고, 반대말은 warm이나 hot이에요. melt는 thaw나 dissolve와 비슷하고, 반대는 freeze입니다. bloom은 blossom이나 flower와 연결되고, 반대말은 wither나 fade죠. complain은 grumble이나 whine과 비슷하며, 반대말은 praise이고, enjoy의 반대말은 dislike나 hate입니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 18\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새로운 계절이\u003c/span>\u003cspan class=\"en\">A new season\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다가오고 있다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">coming\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">새로운 계절이 다가오고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글 전체의 분위기를 여는 \u003cb class=\"key\">도입 \u003c/b>\u003cb class=\"key\">문장\u003c/b>이에요. 새로운 계절이 다가온다는 표현으로 따뜻해지는 \u003cb class=\"key\">계절의 \u003c/b>\u003cb class=\"key\">변화\u003c/b>를 암시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재진행형\u003c/span> : 주어 + be동사 + 동사원형-ing : \"다가오고 있다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"A new season, 새로운 계절이. is coming, 다가오고 있다.. 이 문장 전체를 해석하면, 새로운 계절이 다가오고 있다.","hl":"m"},{"n":13,"text":"이 문장은 글 전체의 분위기를 여는 도입 문장이에요. 새로운 계절이 다가온다는 말로 따뜻해지는 계절의 변화를 암시하죠.","hl":"mn"},{"n":14,"text":"여기서 is coming은 현재진행형이에요. 지금 다가오는 진행 상황을 나타내려고 be동사 is와 동사원형에 ing를 붙인 형태죠. 그래서 현재진행형으로 자연스럽게 다가오는 느낌을 살립니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 18\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 이상 ~은 없다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">are\u003c/span> no more\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">살을 에는 듯한 바람은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">biting\u003c/span> winds\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사방에\u003c/span>\u003cspan class=\"en\">all around.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사방에 더 이상 살을 에는 듯한 바람은 없 다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 차가운 겨울의 흔적이 사라지고 있음을 보여 줘요. \u003cb class=\"key\">There \u003c/b>\u003cb class=\"key\">are \u003c/b>\u003cb class=\"key\">no \u003c/b>\u003cb class=\"key\">more\u003c/b>는 '더 이상 없다'라는 뜻으로, \u003cb class=\"key\">biting \u003c/b>\u003cb class=\"key\">winds\u003c/b>가 사라진 변화를 강조하죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">There is/are 구문(유도부사)\u003c/span> : There + be동사 + 주어 : \"~이 있다\"\u No more, 더 이상. chilly air, 차가운 공기도 없다.. 이 문장 전체를 해석하면, 더 이상 차가운 공기도 없다.","hl":"m"},{"n":19,"text":"이 문장은 앞 문장과 함께 겨울의 차가움이 끝났음을 짧게 강조해요. 동사가 생략된 No more chilly air 표현으로 차가운 공기가 더 이상 없다는 뜻을 전합니다.","hl":"mn"},{"n":20,"text":"여기서 No more는 앞 문장의 There are가 생략된 생략 구조로 이해하면 쉬워요. no more가 명사 air를 부정해서 차가운 공기가 없음을 나타내죠. 그리고 chilly는 air의 성질을 꾸미는 형용사로, 차가운 공기의 이미지를 선명하게 해 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 18\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 눈이\u003c/span>\u003cspan class=\"en\">All the snow\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">녹고 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">melting\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">완전히\u003c/span>\u003cspan class=\"en\">away.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">모든 눈이 녹고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 겨울이 가고 봄이 온다는 것을 \u003cb class=\"key\">눈\u003c/b>이 녹는 모습으로 보여 주는 문장이에요. 지금 이 순간 눈이 \u003cb class=\"key\">녹는 \u003c/b>\u003cb class=\"key\">중\u003c/b>이라는 뜻이고, away가 붙어 완전히 사라질 때까지 녹아내린다는 느낌을 더해 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재진행형(be + -ing)\u003c/span> : 주어 + [[be동사]] + [[동사원형-ing]] : \"녹고 있다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"All the snow, 모든 눈이. is melting, 녹고 있다. away, 완전히. 이 문장 전체를 해석하면, 모든 눈이 녹고 있다.","hl":"m"},{"n":22,"text":"이 문장은 겨울이 가고 봄이 온다는 걸 모든 눈이 녹는 모습으로 보여 주는 거예요. 지금 이 순간 눈이 녹고 있다는 뜻이고, away가 붙어서 완전히 사라질 때까지 녹는다는 느낌을 줘요. 그래서 눈이 녹는 중이라는 해석이 딱 맞아요.","hl":"mn"},{"n":23,"text":"여기서 눈여겨볼 건 현재진행형이에요. be동사 is에 동사원형 melt에 ing를 붙인 현재분사 melting이 합쳐진 형태죠. 지금 진행 중인 동작을 나타낼 때는 be동사 다음에 동사원형에 ing를 붙인 현재분사를 쓴다는 것, 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 18\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새들이\u003c/span>\u003cspan class=\"en\">Birds\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">노래하고 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">singing\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">행복하게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">happily\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">새들이 행복하게 노래하고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 눈이 녹는 봄 풍경을 보여 줬으니, 이번엔 새들이 \u003cb class=\"key\">행복하게\u003c/b> 노래하는 모습으로 봄 분위기를 더해 주는 문장이에요. \u003cb class=\"key\">현재진행형\u003c/b>이라 지금 이 순간 새들이 노래하고 있다는 생생함이 살아 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재진행형(복수 주어)\u003c/span> : 복수 주어 + are + 동사원형-ing : \"노래하고 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부사(동작을 꾸미는 부사)\u003c/span> : 동사 + [[부사]] (문장 끝) : \"행복하게\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Birds, 새들이. are singing, 노래하고 있다. happily, 행복하게. 이 문장 전체를 해석하면, 새들이 행복하게 노래하고 있다.","hl":"m"},{"n":25,"text":"앞 문장에서 눈이 녹는 봄 풍경을 보여 줬죠. 이번엔 새들이 행복하게 노래하는 모습으로 봄 분위기를 더해 주는 문장이에요. 현재진행형이라 지금 이 순간 새들이 노래하고 있다는 생생한 느낌이 살아 있어요.","hl":"mn"},{"n":26,"text":"첫 번째로 주어 Birds가 복수라서 be동사는 are를 쓴 점을 봐야 해요. 노래하는 중이라는 진행의 의미를 살리려고 are singing 형태를 쓴 거죠. 두 번째로 happily는 부사예요. 노래하는 동작을 꾸며 주려고 형용사 happy가 아니라 부사 happily를 문장 끝에 둔 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 18\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 노래는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Their \u003c/span>\u003cspan class=\"tgt\">singing\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나를 ~하게 만든다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">makes \u003c/span>\u003cspan class=\"tgt\">me \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">창문을 열게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">open\u003c/span> the window.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들의 노래는 나로 하여금 창문을 열게 만든다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 새들의 노래가 나를 움직이게 하는 장면이에요. 노래가 좋으니까 내가 스스로 창문을 열게 된다는 뜻이죠. 여기서 make는 \u003cb class=\"key\">사역동사\u003c/b>로 '~하게 만들다'라는 의미이고, 뒤에 \u003cb class=\"key\">동사원형\u003c/b> open이 와서 '창문을 열게 만들다'가 된 거예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사 주어\u003c/span> : [[동명사]] + 단수 동사 : \"그들이 노래하는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">사역동사 make의 5형식(목적격 보어로 동사원형)\u003c/span> : [[사역동사]] make + 목적어 + [[목적격 보어]](동사원형) : \"나를 창문 열게 만든다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Their singing, 그들의 노래는. makes me, 나를 ~하게 만든다. open the window, 창문을 열게. 이 문장 전체를 해석하면, 그들의 노래는 나로 하여금 창문을 열게 만든다.","hl":"m"},{"n":28,"text":"새들의 노래가 나를 움직이게 하는 장면이에요. 노래가 좋으니까 내가 스스로 창문을 열게 된다는 뜻이죠. 여기서 make는 사역동사로 '~하게 만들다'라는 의미이고, 뒤에 동사원형 open이 와서 창문을 열게 만들다가 된 거예요.","hl":"mn"},{"n":29,"text":"먼저 makes me open을 보세요. make는 목적어 다음에 동사원형을 보어로 데려오는 사역동사예요. 그래서 목적격 보어 자리에 to open이 아니라 동사원형 open이 그대로 온 거죠. 그리고 맨 앞의 Their singing은 동명사 주어예요. 동명사가 주어로 쓰이면 단수 취급해서 makes처럼 동사에 s가 붙는다는 것도 같이 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 18\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 연다\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">open \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 창문을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">window \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 마신다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">get\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">신선한 공기를 조금\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">some \u003c/span>\u003cspan class=\"tgt\">fresh \u003c/span>\u003cspan class=\"tgt\">air\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 창문을 열고 신선한 공기를 마신다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 창문을 열어 신선한 공기를 들이마시는 장면으로, 새 계절의 변화가 몸으로 느껴지기 시작하는 흐름을 여는 문장이에요. open과 get이 and로 연결된 \u003cb class=\"key\">병렬\u003c/b> 구조라서 주어 I를 함께 공유하고, 여기서 get은 공기를 \u003cb class=\"key\">마시다\u003c/b>라는 뜻으로 쓰였어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">등위접속사 and에 의한 동사 병렬\u003c/span> : I + [open the window] + and + [get some fresh air] : \"창문을 열고 신선한 공기를 마시다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">some + 불가산명사\u003c/span> : some + [불가산명사 air] : \"신선한 공기 조금\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"I open, 나는 연다. the window, 그 창문을. and get, 그리고 마신다. some fresh air, 신선한 공기를 조금. 이 문장 전체를 해석하면, 나는 창문을 열고 신선한 공기를 마신다.","hl":"m"},{"n":31,"text":"이 문장은 창문을 열어 신선한 공기를 들이마시는 장면을 그려요. open과 get이 and로 연결된 병렬 구조라서 주어 I를 함께 공유하고, get은 여기서 공기를 마시다라는 뜻으로 쓰였어요. 새 계절이 와서 몸과 마음이 새로워지는 흐름을 여는 역할을 합니다.","hl":"mn"},{"n":32,"text":"첫 번째 어법은 open과 get을 and로 묶은 동사 병렬이에요. 주어 I가 두 동사에 모두 걸리기 때문에 나는 창문을 열고 공기를 마신다처럼 해석해요. 두 번째 어법은 some fresh air에서 some이 불가산명사 air와 함께 쓰인 표현이에요. 그래서 공기를 몇 개라고 세지 않고 약간의 신선한 공기라고 해석합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 18\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 것이\u003c/span>\u003cspan class=\"en\">Everything\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">느껴지고 보인다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">feels \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">seems\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새롭게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">new\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">모든 것이 새롭게 느껴지고 새롭게 보인다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 모든 것이 새롭게 느껴지고 새롭게 보인다는 뜻으로, 앞에서 마신 신선한 공기와 새 계절의 분위기가 온몸으로 확장되는 문장이에요. feel과 seem은 모두 주어 Everything을 받는 \u003cb class=\"key\">감각동사\u003c/b>와 \u003cb class=\"key\">인식동사\u003c/b>이고, new는 주어의 상태를 설명하는 \u003cb class=\"key\">주격보어\u003c/b>예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">감각동사와 인식동사의 병렬\u003c/span> : [주어] + [감각동사] + and + [인식동사] : \"느껴지고 보인다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">형용사 주격보어\u003c/span> : [감각동사·인식동사] + [형용사] : \"새롭게\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"Everything, 모든 것이. feels and seems, 느껴지고 보인다. new, 새롭게. 이 문장 전체를 해석하면, 모든 것이 새롭게 느껴지고 새롭게 보인다.","hl":"m"},{"n":34,"text":"이 문장은 모든 것이 새롭게 느껴지고 새롭게 보인다는 뜻이에요. feel과 seem은 둘 다 주어 Everything을 받는 감각동사와 인식동사이고, new가 주격보어로 그 상태를 설명해요. 앞에서 마신 신선한 공기 때문에 새 계절의 변화가 온몸으로 확장되는 느낌을 줍니다.","hl":"mn"},{"n":35,"text":"첫 번째 어법은 feel과 seem을 and로 묶은 병렬이에요. 주어 Everything이 두 동사에 함께 걸리고, 뒤의 new가 주격보어로 쓰여요. 두 번째 어법은 new가 형용사 주격보어라는 점이에요. feel과 seem 뒤에서 주어의 상태를 설명할 때는 부사가 아니라 형용사를 씁니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 18\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">꽃봉오리들이\u003c/span>\u003cspan class=\"en\">Flower buds\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">막 피려고 한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">about \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">bloom\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">창밖에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">outside \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">window\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">창밖에 꽃봉오리가 피려고 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 창밖의 꽃봉오리가 곧 필 상태라는 뜻으로, 새 계절의 변화가 눈앞에 구체적으로 나타나는 장면을 보여 줘요. \u003cb class=\"key\">be \u003c/b>\u003cb class=\"key\">about \u003c/b>\u003cb class=\"key\">to\u003c/b>는 '막 하려고 하다'라는 \u003cb class=\"key\">예정\u003c/b> 표현이고, bloom은 꽃이 '피다'라는 뜻이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be about to + 동사원형\u003c/span> : [be동사] + about to + [동사원형] : \"곧 피하려고 한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 용법\u003c/span> : [전치사구] + [문장 전체 수식] : \"창밖에서\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Flower buds, 꽃봉오리들이. are about to bloom, 막 피려고 한다. outside the window, 창밖에서. 이 문장 전체를 해석하면, 창밖에 꽃봉오리가 피려고 한다.","hl":"m"},{"n":37,"text":"이 문장은 창밖의 꽃봉오리가 곧 피려고 한다는 뜻이에요. be about to는 막 하려고 하다라는 예정 표현이고, bloom은 꽃이 피다라는 뜻이에요. 새 계절의 변화가 눈앞에 구체적으로 보이는 장면을 만들어 줍니다.","hl":"mn"},{"n":38,"text":"여기서 첫 번째 어법은 are about to bloom이에요. be about to는 가까운 미래의 예정을 나타내는 관용 표현이고, to 뒤에는 동사원형 bloom이 와요. 두 번째 어법은 outside the window라는 전치사구가 장소를 나타내며 꽃봉오리가 피는 위치를 설명한다는 점입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 18\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은\u003c/span>\u003cspan class=\"en\">It\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나를 하게 만든다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">makes \u003c/span>\u003cspan class=\"tgt\">me \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">계속 미소 짓게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">keep \u003c/span>\u003cspan class=\"tgt\">smiling\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 나를 계속 미소 짓게 만든다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 말한 새 계절의 변화와 곧 피어날 꽃봉오리가 나를 \u003cb class=\"key\">계속\u003c/b> 미소 짓게 한다는 뜻이에요. 여기서 It은 특정 사물 하나보다 지금의 \u003cb class=\"key\">분위기\u003c/b>와 장면 전체를 가리켜요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">사역동사 make의 목적격 보어 구조\u003c/span> : make + [목적어] + [동사원형(목적격 보어)] : \"나를 계속 미소 짓게 만든다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">keep + 동명사\u003c/span> : keep + [동명사] : \"계속 미소 짓다\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"It, 그것은. makes me, 나를 하게 만든다. keep smiling, 계속 미소 짓게. 이 문장 전체를 해석하면, 그것은 나를 계속 미소 짓게 만든다.","hl":"m"},{"n":40,"text":"이 문장은 앞에서 말한 새 계절의 변화와 곧 피어날 꽃봉오리가 나를 계속 미소 짓게 한다는 뜻이에요. 여기서 It은 특정 사물 하나보다 지금의 분위기와 장면 전체를 가리킨다고 보면 됩니다.","hl":"mn"},{"n":41,"text":"첫 번째로 makes me keep에서 make는 사역동사예요. 목적어 me 뒤에 동사원형 keep을 써서 나를 계속 미소 짓게 만든다는 의미를 만듭니다. 두 번째로 keep smiling에서 keep은 뒤에 동명사 smiling을 취해 계속 미소 짓다라는 뜻을 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 18\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">갑자기 나는 느낀다\u003c/span>\u003cspan class=\"en\">Suddenly, I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">feel \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내 방을 청소하고 싶은 강한 욕구를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">strong \u003c/span>\u003cspan class=\"tgt\">wish\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">clean \u003c/span>\u003cspan class=\"tgt\">my \u003c/span>\u003cspan class=\"tgt\">own \u003c/span>\u003cspan class=\"tgt\">room \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 침대에 새 이불을 깔고 싶다는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">put \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">new \u003c/span>\u003cspan class=\"tgt\">blanket \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">bed\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">갑자기 내 방을 청소하고 침대에 새 이불을 깔고 싶은 강한 욕구를 느낀다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 새 계절의 기분이 갑자기 방을 정리하고 싶은 \u003cb class=\"key\">강한 \u003c/b>\u003cb class=\"key\">욕구\u003c/b>를 불러일으킨다는 장면이에요. a strong wish to는 하고 싶은 강한 \u003cb class=\"key\">욕구\u003c/b>로, to부정사가 그 욕구의 내용을 설명해요. 이어지는 청소와 콧노래는 기분이 \u003cb class=\"key\">행동\u003c/b>으로 이어지는 흐름을 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">타동사 feel + 목적어\u003c/span> : feel + [목적어] : \"강한 욕구를 느낀다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법(명사 수식)\u003c/span> : [명사 wish] + [to부정사구] : \"내 방을 청소하고 침대에 새 이불을 깔고 싶은\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"Suddenly, I feel, 갑자기 나는 느낀다. a strong wish to clean my own room, 내 방을 청소하고 싶은 강한 욕구를. and put a new blanket on the bed!, 그리고 침대에 새 이불을 깔고 싶다는. 이 문장 전체를 해석하면, 갑자기 내 방을 청소하고 침대에 새 이불을 깔고 싶은 강한 욕구를 느낀다!","hl":"m"},{"n":43,"text":"이 문장은 새 계절의 기분이 갑자기 방을 정리하고 싶은 강한 욕구를 불러일으킨다는 장면이에요. a strong wish to는 어떤 일을 하고 싶은 강한 욕구라는 뜻으로, to부정사가 그 욕구의 내용을 설명합니다. 이어지는 청소와 콧노래는 기분이 행동으로 이어지는 흐름을 보여 줘요.","hl":"mn"},{"n":44,"text":"첫 번째로 feel a strong wish에서 feel은 목적어를 바로 취하는 타동사예요. 그래서 a strong wish가 목적어로 와서 강한 욕구를 느낀다는 뜻이 됩니다. 두 번째로 to clean my own room and put a new blanket on the bed에서 to부정사구는 앞의 wish를 꾸며 주는 형용사적 용법이에요. 이 to부정사구가 어떤 욕구인지 설명하고, clean과 put은 and로 이어진 병렬 구조라는 점도 기억해 주세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 18\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">콧노래가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">A \u003c/span>\u003cspan class=\"tgt\">humming\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나온다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">comes \u003c/span>\u003cspan class=\"tgt\">out \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내 입에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of\u003c/span> my mouth.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">내 입에서 콧노래가 나온다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 청소를 시작하자 저절로 콧노래가 나올 만큼 기분이 좋아졌다는 뜻이에요. 콧노래가 입 밖으로 \u003cb class=\"key\">자연스럽게\u003c/b> 나온다는 표현으로, 즐거움이 몸으로 드러나는 장면을 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사 주어\u003c/span> : [동명사] + [동사] : \"콧노래가\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">구동사 come out of\u003c/span> : come out of + [장소] : \"에서 나오다\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"A humming, 콧노래가. comes out, 나온다. of my mouth, 내 입에서. 이 문장 전체를 해석하면, 내 입에서 콧노래가 나온다.","hl":"m"},{"n":46,"text":"이 문장은 청소를 시작하자 저절로 콧노래가 나올 만큼 기분이 좋아졌다는 뜻이에요. 콧노래가 입 밖으로 자연스럽게 나온다는 표현으로, 즐거움이 몸으로 드러나는 장면을 보여 줘요.","hl":"mn"},{"n":47,"text":"첫 번째로 A humming에서 humming은 동사 hum에 ing를 붙인 동명사로, 여기서는 콧노래라는 명사처럼 주어 역할을 해요. 앞에 A가 붙어 하나의 콧노래라는 느낌을 더합니다. 두 번째로 comes out of는 밖으로 나오다는 뜻의 구동사예요. of my mouth와 결합해 내 입에서 나오다로 해석해 주세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 18\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">놀랍게도,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Surprisingly\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 내 모습을 본다\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">see \u003c/span>\u003cspan class=\"tgt\">myself \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">흥얼거리고 춤추는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">humming \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">dancing\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">청소를 하면서!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">while \u003c/span>\u003cspan class=\"tgt\">cleaning\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">놀랍게도 청소를 하면서 흥얼거리고 춤추는 내 모습을 본다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 청소를 싫어하던 화자가 청소를 하면서 흥얼거리고 춤까지 추는 자신을 스스로 발견하는 장면이에요. 문두의 \u003cb class=\"key\">놀랍게도\u003c/b>라는 부사가 이 변화가 얼마나 뜻밖인지 강조하고, 이 문장이 글 전체에서 화자의 \u003cb class=\"key\">태도\u003c/b>가 달라졌음을 보여 주는 핵심 증거가 됩니다. while cleaning은 청소를 하는 \u003cb class=\"key\">동안\u003c/b>이라는 시간 의미를 담고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">문장 부사(양태 부사)\u003c/span> : Surprisingly + [문장 전체] : \"놀랍게도\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지각동사 see + 목적어 + 현재분사(목적격보어)\u003c/span> : see + [목적어 myself] + [humming and dancing (현재분사/목적격보어)] : \"내가 흥얼거리고 춤추는 것을 보다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">while + 분사구문(주어·be동사 생략)\u003c/span> : while + [cleaning (현재분사)] = while I am cleaning : \"청소를 하면서\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"Surprisingly, 놀랍게도. I see myself, 나는 내 모습을 본다. humming and dancing, 흥얼거리고 춤추는. while cleaning!, 청소를 하면서!. 이 문장 전체를 해석하면, 놀랍게도 청소를 하면서 흥얼거리고 춤추는 내 모습을 본다!","hl":"m"},{"n":49,"text":"이 문장은 청소를 싫어하던 사람이 청소를 하면서 흥얼거리고 춤까지 추는 자기 모습을 발견하는 장면이에요. 놀랍게도라는 말이 왜 붙었는지 느껴지죠. 앞에서 새 계절이 왔다는 이야기가 나왔고, 그 기분 좋은 변화가 결국 방 청소로 이어졌다는 흐름을 보여 줍니다.","hl":"mn"},{"n":50,"text":"첫 번째 어법 포인트는 지각동사 see의 목적격보어예요. see myself humming and dancing에서 myself가 목적어이고 humming and dancing이 목적격보어인데, 지각동사 뒤에서 동작이 진행 중이면 현재분사를 씁니다. 두 번째는 while cleaning인데, while 뒤에서 주어와 be동사가 생략된 분사구문이라서 청소를 하는 동안이라는 시간의 의미를 나타내요. 세 번째로 문장 맨 앞의 Surprisingly는 문장 전체를 꾸미는 부사로, 놀랍게도라는 화자의 태도를 보여 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 18\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 좋아하지 않았다\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">didn't \u003c/span>\u003cspan class=\"tgt\">like\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">청소하는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">clean\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전에는!\u003c/span>\u003cspan class=\"en\">before!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 전에는 청소하는 것을 좋아하지 않았다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> before가 \u003cb class=\"key\">전에는\u003c/b>이라는 뜻으로 지금과 과거를 뚜렷하게 대비시켜요. didn't like to clean은 청소를 좋아하지 않았다는 \u003cb class=\"key\">과거의 \u003c/b>\u003cb class=\"key\">상태\u003c/b>를 말하고, 바로 뒤의 'But now?'와 짝을 이루면서 화자의 \u003cb class=\"key\">변화\u003c/b>를 더 크게 부각합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">일반동사 과거시제 부정문(did not + 동사원형)\u003c/span> : [주어] + didn't + [동사원형 like] : \"좋아하지 않았다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : like + [to clean (to부정사구/목적어)] : \"청소하는 것을\"\u003c/div>\u003c/div>","segs":[{"n":51,"text":"I didn't like, 나는 좋아하지 않았다. to clean, 청소하는 것을. before!, 전에는!. 이 문장 전체를 해석하면, 나는 전에는 청소하는 것을 좋아하지 않았다!","hl":"m"},{"n":52,"text":"이 문장은 before를 써서 과거의 상태를 딱 잘라 말해요. 전에는 청소를 좋아하지 않았다는 뜻이죠. 그리고 바로 다음 짧은 문장과 짝을 이루면서 지금과 얼마나 달라졌는지, 그 변화를 강조하는 장치가 됩니다.","hl":"mn"},{"n":53,"text":"첫 번째는 과거 부정문이에요. I didn't like에서 일반동사 like를 부정할 때 조동사 did에 not을 붙이고, 본동사는 동사원형으로 돌아갑니다. 두 번째는 to부정사의 명사적 용법이에요. like to clean은 청소하는 것을 좋아하다, 즉 to clean이 like의 목적어로 쓰여서 ~하는 것을이라는 뜻을 만듭니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 15 / 18\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">But\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지금은?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">now?\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 지금은?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아주 짧은 의문문 형태로 \u003cb class=\"key\">반전\u003c/b>을 예고하는 문장이에요. 앞에서 '전에는 청소를 싫어했다'고 말했으니, 이 질문은 \u003cb class=\"key\">지금은\u003c/b> 다르다는 점을 독자가 스스로 떠올리게 만듭니다. 바로 뒤 문장에서 화자가 청소를 즐기고 있다는 \u003cb class=\"key\">답\u003c/b>이 이어지죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">문두 접속사 But(역접)\u003c/span> : But + [앞 내용과 반대되는 내용] : \"그러나, 그런데\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">생략 구문(대화체 의문문)\u003c/span> : now + [do I like to clean? 생략] : \"지금은?\"\u003c/div>\u003c/div>","segs":[{"n":54,"text":"But, 그러나. now?, 지금은?. 이 문장 전체를 해석하면, 그러나 지금은?","hl":"m"},{"n":55,"text":"이 짧은 문장은 반전을 예고해요. 전에는 청소를 싫어했다는 말 바로 뒤에 지금은 어떠냐고 물으면서 독자에게 변화를 기대하게 만들죠. 그리고 바로 다음 문장에서 그 답이 나옵니다.","hl":"mn"},{"n":56,"text":"문장 맨 앞의 But은 앞 내용과 반대되는 흐름을 알리는 역접 접속사예요. 그리고 now 뒤에는 지금은 청소를 좋아하느냐는 의문문이 통째로 생략되어 있다고 보면 됩니다. 회화체에서 자주 쓰는 짧은 반전 표현이죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 16 / 18\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 ~이다\u003c/span>\u003cspan class=\"en\">I am\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 이상 ~이 아니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">no \u003c/span>\u003cspan class=\"tgt\">longer\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Grouchy(투덜이)\u003c/span>\u003cspan class=\"en\">Grouchy\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만화 ‘개구쟁이 스머프’에 나오는!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">The \u003c/span>\u003cspan class=\"tgt\">Smurfs\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 더 이상 만화 ‘개구쟁이 스머프’의 Grouchy(투덜이)가 아니다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 청소를 즐기게 된 화자가 자신이 얼마나 달라졌는지 재미있게 선언하는 문장이에요. \u003cb class=\"key\">Grouchy\u003c/b>는 만화 속에서 늘 불평만 하는 캐릭터인데, 화자는 이제 그런 사람이 아니라고 말하죠. \u003cb class=\"key\">no \u003c/b>\u003cb class=\"key\">longer\u003c/b>가 ‘더 이상 ~아니다’라는 뜻으로 \u003cb class=\"key\">변화\u003c/b>가 이미 끝났음을 딱 짚어 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정 부사구 no longer (더 이상 ~아니다)\u003c/span> : [no longer + 동사/보어] = not ~ any longer : \"더 이상 ~아니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 수식\u003c/span> : [명사 Grouchy] + [from + 명사(출처)] : \"만화 ‘개구쟁이 스머프’에 나오는\"\u003c/div>\u003c/div>","segs":[{"n":57,"text":"I am, 나는 ~이다. no longer, 더 이상 ~이 아니다. Grouchy, Grouchy(투덜이). from The Smurfs!, 만화 ‘개구쟁이 스머프’에 나오는!. 이 문장 전체를 해석하면, 나는 더 이상 만화 ‘개구쟁이 스머프’의 Grouchy(투덜이)가 아니다!","hl":"m"},{"n":58,"text":"앞에서 청소를 즐기게 된 화자가 자신이 얼마나 달라졌는지 재미있게 보여 주는 문장이에요. Grouchy는 스머프에 나오는, 뭐든 불평만 하는 캐릭터인데 화자는 이제 그런 사람이 아니라고 선언하죠. no longer가 ‘더 이상 ~아니다’라는 뜻으로 변화가 이미 끝났다는 걸 딱 짚어 줘요.","hl":"mn"},{"n":59,"text":"첫 번째, no longer는 뒤에 오는 보어를 통째로 부정하는 부정어예요. not any longer와 같은 뜻이고, 상태가 완전히 바뀌었다는 걸 강조하죠. 두 번째, from The Smurfs는 전치사구로 앞의 명사 Grouchy를 뒤에서 꾸며 주는 형용사 역할을 해요. 어느 작품에서 온 캐릭터인지 밝혀서 대상을 특정해 주는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 17 / 18\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분도 알다시피,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">You \u003c/span>\u003cspan class=\"tgt\">see,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Grouchy는 항상 불평하지만,\u003c/span>\u003cspan class=\"en\">Grouchy always complains,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지금 나는 아니다!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">but \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">me \u003c/span>\u003cspan class=\"tgt\">now\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여러분도 알다시피, Grouchy는 항상 불평하지만, 지금 나는 아니다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Grouchy라는 캐릭터의 성격을 빌려 화자의 과거와 현재를 \u003cb class=\"key\">대조\u003c/b>하는 문장이에요. Grouchy는 늘 불평하는데 지금의 나는 그렇지 않다는 점을 통해 \u003cb class=\"key\">변화\u003c/b>를 또렷하게 강조하죠. \u003cb class=\"key\">You \u003c/b>\u003cb class=\"key\">see\u003c/b>로 시작해서 독자에게 친근하게 말을 거는 느낌도 살렸어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">삽입구 You see (주의 환기)\u003c/span> : [You see,] + 문장 : \"여러분도 알다시피,\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동사 생략을 활용한 대조 구문\u003c/span> : [긍정문] + but + not + [대조되는 명사] : \"그러나 지금은 내가 아니다\"\u003c/div>\u003c/div>","segs":[{"n":60,"text":"You see, 여러분도 알다시피. Grouchy always complains, Grouchy는 항상 불평하지만. but not me now!, 지금 나는 아니다!. 이 문장 전체를 해석하면, 여러분도 알다시피, Grouchy는 항상 불평하지만, 지금 나는 아니다!","hl":"m"},{"n":61,"text":"Grouchy라는 캐릭터의 성격을 빌려서 화자의 과거와 현재를 대조하는 문장이에요. Grouchy는 늘 불평하는데 지금의 나는 그렇지 않다는 점을 통해 변화를 또렷하게 강조하죠. You see로 시작해서 독자에게 친근하게 말을 거는 느낌도 살렸어요.","hl":"mn"},{"n":62,"text":"첫 번째, You see는 ‘알다시피’라는 뜻으로 문장 앞에 붙어 상대의 주의를 끄는 삽입구예요. 문장 성분 분석에서 빼도 되는 덩어리죠. 두 번째, but not me now는 반복되는 동사를 생략한 대조 표현이에요. 원래는 but I do not complain now인데 대조되는 정보만 남겨서 짧게 만든 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 18 / 18\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 즐기고 있다\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">am \u003c/span>\u003cspan class=\"tgt\">enjoying\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">청소하는 것을.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">cleaning\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 청소를 즐기고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 청소가 더 이상 귀찮은 일이 아니라 \u003cb class=\"key\">즐거움\u003c/b>이 되었다는 것을 보여 주는 마무리 문장이에요. 현재진행형을 써서 지금 이 순간에도 \u003cb class=\"key\">즐기고 \u003c/b>\u003cb class=\"key\">있다\u003c/b>는 생생함을 전달하죠. 앞에서 말한 화자의 변화가 실제 \u003cb class=\"key\">행동\u003c/b>으로 이어졌음을 정리해 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재진행형 (be + -ing)\u003c/span> : [주어] + am/is/are + [동사-ing] : \"즐기고 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사 (enjoy의 목적어)\u003c/span> : enjoy + [동사-ing (동명사/목적어)] : \"청소하는 것(을)\"\u003c/div>\u003c/div>","segs":[{"n":63,"text":"I am enjoying, 나는 즐기고 있다. cleaning, 청소하는 것을.. 이 문장 전체를 해석하면, 나는 청소를 즐기고 있다.","hl":"m"},{"n":64,"text":"청소가 더 이상 귀찮은 일이 아니라 즐거움이 되었다는 걸 보여 주는 마무리 문장이에요. 현재진행형을 써서 지금 이 순간에도 즐기고 있다는 생생함을 전달하죠. 앞에서 말한 화자의 변화가 실제 행동으로 이어졌음을 정리해 줍니다.","hl":"mn"},{"n":65,"text":"첫 번째, am enjoying은 현재진행형이에요. be동사에 동사-ing를 붙여서 지금 하고 있는 동작을 나타내죠. 두 번째, cleaning은 동명사로 enjoy의 목적어예요. enjoy는 동명사만 목적어로 받는 동사라서 to clean이 아니라 cleaning이 와야 해요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>새로운 계절이 오고 살을 에는 바람과 차가운 공기가 사라지면서 \u003cb class=\"key\">모든 \u003c/b>\u003cb class=\"key\">것이 \u003c/b>\u003cb class=\"key\">새롭게\u003c/b> 느껴진다.\u003c/li>\u003cli>새들의 노래와 신선한 공기, 창밖의 \u003cb class=\"key\">꽃봉오리\u003c/b>는 화자를 계속 미소 짓게 만든다.\u003c/li>\u003cli>갑자기 방을 청소하고 새 이불을 깔고 싶은 \u003cb class=\"key\">강한 \u003c/b>\u003cb class=\"key\">욕구\u003c/b>가 생기고, 화자는 콧노래를 부르며 춤춘다.\u003c/li>\u003cli>전에는 청소를 싫어했지만 이제는 불평만 하던 Grouchy가 아니라 청소를 \u003cb class=\"key\">즐기는\u003c/b> 사람이 되었다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>As a new season arrives, the narrator feels renewed and changes from someone who disliked cleaning into someone who enjoys it.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">새로운 계절이 다가오고 \u003cb class=\"key\">모든 \u003c/b>\u003cb class=\"key\">것이 \u003c/b>\u003cb class=\"key\">새롭게\u003c/b> 느껴지자, 화자는 방을 청소하고 새 이불을 깔고 싶은 \u003cb class=\"key\">강한 \u003c/b>\u003cb class=\"key\">욕구\u003c/b>를 느낀다. 전에는 청소를 싫어했지만 이제는 콧노래를 부르며 춤추고 청소를 \u003cb class=\"key\">즐긴다\u003c/b>.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":66,"text":"정리해 볼게요. 계절의 변화는 화자의 마음을 새롭게 하고, 그 변화는 청소를 즐기는 행동으로까지 이어집니다. 과거와 현재의 대조, 그리고 마지막에 제시되는 주제를 함께 기억하면 이 글을 오래 이해할 수 있을 거예요. 오늘도 끝까지 잘 따라와 주셔서 고맙습니다.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
