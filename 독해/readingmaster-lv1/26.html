<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터1 Reading 26 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터1 Reading 26","audioDir":"26_audio","preview":false,"count":51,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.668em\">Reading\u003cbr>26\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터1\u003c/div>\u003ch1>Alpacas: Cute but Careful\u003c/h1>\u003ch2>알파카: 귀엽지만 조심해야 할 동물\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>알파카는 귀엽지만 화가 나거나 위험을 느끼면 침을 뱉는 \u003cb class=\"key\">나쁜 \u003c/b>\u003cb class=\"key\">습관\u003c/b>이 있다. 그러나 안전하다고 느낄 때는 \u003cb class=\"key\">평화로운 \u003c/b>\u003cb class=\"key\">동물\u003c/b>이므로 만나면 친절하게 대해야 한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Alpacas may spit at you when they feel angry or want to protect themselves from danger, but they are peaceful animals when they feel safe, so you should be kind to them.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 알파카를 소재로 한 글이에요. 귀여운 외모와 달리 침을 뱉는 습관이 있다는 사실, 그리고 그 이유를 세 가지로 설명하는 흥미로운 글이죠. 요약하면 알파카는 나쁜 습관 때문에 조심해야 하지만 안전할 때는 평화로운 동물이라는 내용이에요. 요지는 알파카가 화가 나거나 위험을 느낄 때 침을 뱉을 수 있으니 조심하고, 만나면 친절하게 대하라는 거예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">알파카는 낙타과에 속하는 \u003cb class=\"key\">포유류\u003c/b>로, 남아메리카 안데스 산맥 고지대가 원산지예요. 추운 환경에 적응해 \u003cb class=\"key\">부드러운 \u003c/b>\u003cb class=\"key\">털\u003c/b>을 가지게 되었고, 그 털이 좋아서 사람들이 오래전부터 길러 왔죠. 알파카는 라마와 자주 비교되는데, 라마가 짐을 나르는 데 쓰이는 반면 알파카는 털을 얻기 위해 길러져요. 이렇게 사람과 오래 함께 살아온 동물이지만, 스트레스를 받으면 침을 뱉거나 발로 차는 \u003cb class=\"key\">방어 \u003c/b>\u003cb class=\"key\">행동\u003c/b>을 보여요. 친한 친구 사이에도 선을 넘으면 한마디 쏘아붙이는 것처럼, 알파카의 침은 일종의 \u003cb class=\"key\">경고 \u003c/b>\u003cb class=\"key\">신호\u003c/b>인 셈이에요. 그래서 가까이 다가갈 때는 상대의 \u003cb class=\"key\">기분\u003c/b>을 먼저 살피는 태도가 필요해요.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 조금 알고 가면 글이 훨씬 잘 읽혀요. 알파카는 낙타과에 속하는 포유류로, 남아메리카 안데스 산맥 고지대가 원산지예요. 추운 환경에 적응해서 부드러운 털을 가지게 되었고, 그 털이 좋아서 사람들이 오래전부터 길러 왔어요. 라마와 자주 비교되는데, 라마는 짐을 나르는 데 쓰이고 알파카는 주로 털을 얻기 위해 길러진다는 차이가 있어요. 그런데 스트레스를 받거나 불편하면 침을 뱉거나 발로 차는 방어 행동을 보여요. 친한 친구 사이에도 선을 넘으면 한마디 쏘아붙이게 되는 것처럼, 알파카의 침은 일종의 경고 신호인 셈이에요. 그래서 가까이 다가갈 때는 상대의 기분을 먼저 살피는 태도가 필요하답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>알파카 소개\u003csmall>도입 · 문장 1–4\u003c/small>\u003c/h4>\u003cp>글은 알파카에 대한 가벼운 질문으로 시작해요. 알파카는 칠레나 페루 같은 \u003cb class=\"key\">남아메리카\u003c/b> 나라들에 살고, 매우 부드러운 털을 가지고 있다고 소개하죠. 또한 귀여운 얼굴과 큰 몸으로 \u003cb class=\"key\">유명\u003c/b>하다는 점까지 더하며 독자의 흥미를 끌어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>조심하라는 경고\u003csmall>전환 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>그런데 여기서 분위기가 한 번 바뀌어요. 하지만 이 동물을 만날 때는 항상 \u003cb class=\"key\">조심\u003c/b>해야 한다고 전환하면서 경고를 던지죠. 알파카는 \u003cb class=\"key\">나쁜 \u003c/b>\u003cb class=\"key\">습관\u003c/b>을 가지고 있어서 여러분에게 침을 뱉을 수도 있다고 말해요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>침을 뱉는 세 가지 이유\u003csmall>근거 · 문장 7–10\u003c/small>\u003c/h4>\u003cp>그다음 왜 침을 뱉는지 \u003cb class=\"key\">질문\u003c/b>을 던지고 이유를 세 가지로 나눠 설명해요. 첫째는 화가 났거나 기분이 좋지 않다는 \u003cb class=\"key\">감정\u003c/b>을 보여 주고 싶기 때문이고, 둘째는 위험으로부터 자신을 \u003cb class=\"key\">보호\u003c/b>하고 싶기 때문이에요. 게다가 침에는 최근에 먹은 음식이 포함되어 있어서 \u003cb class=\"key\">고약한 \u003c/b>\u003cb class=\"key\">냄새\u003c/b>가 난다는 점도 덧붙여요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>안심과 당부\u003csmall>결론 · 문장 11–13\u003c/small>\u003c/h4>\u003cp>마지막에는 그렇게 \u003cb class=\"key\">걱정\u003c/b>할 필요는 없다고 안심시켜 줘요. 알파카는 안전하다고 느낄 때는 \u003cb class=\"key\">평화로운 \u003c/b>\u003cb class=\"key\">동물\u003c/b>이기 때문이죠. 그래서 알파카를 보면 \u003cb class=\"key\">친절\u003c/b>하게 대하라고 당부하면서 글을 맺어요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 지문을 네 단계로 나눠서 흐름을 짚어 볼게요.","hl":null},{"n":4,"text":"글은 알파카에 대한 가벼운 질문으로 시작해요. 알파카는 칠레나 페루 같은 남아메리카 나라들에 살고, 매우 부드러운 털을 가지고 있다고 소개하죠. 그리고 귀여운 얼굴과 큰 몸으로 유명하다는 점까지 더해서 독자의 흥미를 끌어요.","hl":"f0"},{"n":5,"text":"그런데 여기서 분위기가 한 번 바뀌어요. 하지만 이 동물을 만날 때는 항상 조심해야 한다고 전환하면서 경고를 던지죠. 알파카는 나쁜 습관을 가지고 있어서 여러분에게 침을 뱉을 수도 있다고 말해요.","hl":"f1"},{"n":6,"text":"그다음 왜 침을 뱉는지 질문을 던지고 이유를 세 가지로 나눠 설명해요. 첫째는 화가 났거나 기분이 좋지 않다는 감정을 보여 주고 싶기 때문이고, 둘째는 위험으로부터 자신을 보호하고 싶기 때문이에요. 게다가 침에는 최근에 먹은 음식이 포함되어 있어서 고약한 냄새가 난다는 점도 덧붙여요.","hl":"f2"},{"n":7,"text":"마지막에는 그렇게 걱정할 필요는 없다고 안심시켜 줘요. 알파카는 안전하다고 느낄 때는 평화로운 동물이기 때문이죠. 그래서 알파카를 보면 친절하게 대하라고 당부하면서 글을 맺어요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">질문-답변\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 6번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 알파카 소개로 시작하지만 다섯 번째와 여섯 번째 문장에서 조심하라고 \u003cb class=\"key\">전환\u003c/b>하며 \u003cb class=\"key\">주제문\u003c/b>을 던져요. 이어서 왜 침을 뱉는지 묻고 세 가지 이유를 차례로 제시하는 \u003cb class=\"key\">질문-답변\u003c/b> 방식으로 근거를 쌓아요. 주제문이 글 중간에 놓이고 마지막 문장에서 당부로 맺기 때문에 \u003cb class=\"key\">중괄식\u003c/b> 구조로 볼 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>But (5)\u003c/b>\u003cspan>전환\u003c/span>\u003cb>Why (7)\u003c/b>\u003cspan>질문 제시\u003c/span>\u003cb>First (8)\u003c/b>\u003cspan>첫째 근거\u003c/span>\u003cb>Second (9)\u003c/b>\u003cspan>둘째 근거\u003c/span>\u003cb>In addition (10)\u003c/b>\u003cspan>추가 근거\u003c/span>\u003cb>However (11)\u003c/b>\u003cspan>방향 전환(안심)\u003c/span>\u003cb>So (13)\u003c/b>\u003cspan>결론·당부\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">have bad habits\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">may spit at you\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">feel angry or upset\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">protect themselves from danger\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">their spit has a very bad smell\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">peaceful animals when they feel safe\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 질문-답변이에요. 왜 침을 뱉는지 묻고 그 이유를 차례로 제시하니까요. 그리고 조심하라는 주제문이 글 중간에 놓여 있고 마지막에 당부가 오는 중괄식 구조로 볼 수 있어요. 주제문 뒤에 근거를 쌓아 올리는 주장과 근거의 흐름이라는 점도 기억해 두세요.","hl":"ty"},{"n":9,"text":"신호어를 따라가면 구조가 저절로 보여요. 다섯 번째 문장의 but은 앞의 귀여운 소개를 뒤집는 전환이고, why라는 질문 뒤에 first와 second, in addition이 근거를 차례로 붙여 줘요. however는 걱정하지 말라는 쪽으로 방향을 다시 돌리고, 마지막 so가 당부로 결론을 맺죠. 이렇게 전환과 추가, 결론의 신호어만 표시해도 글의 지도가 그려진답니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>alpaca\u003c/b>\u003cem>명사\u003c/em>\u003cspan>알파카\u003c/span>\u003c/div>\u003cdiv>\u003cb>live in\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 살다\u003c/span>\u003c/div>\u003cdiv>\u003cb>South American\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>남아메리카의\u003c/span>\u003c/div>\u003cdiv>\u003cb>country\u003c/b>\u003cem>명사\u003c/em>\u003cspan>나라, 국가\u003c/span>\u003c/div>\u003cdiv>\u003cb>soft\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>부드러운\u003c/span>\u003c/div>\u003cdiv>\u003cb>hair\u003c/b>\u003cem>명사\u003c/em>\u003cspan>털, 머리카락\u003c/span>\u003c/div>\u003cdiv>\u003cb>be famous for\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 유명하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>cute\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>귀여운\u003c/span>\u003c/div>\u003cdiv>\u003cb>face\u003c/b>\u003cem>명사\u003c/em>\u003cspan>얼굴\u003c/span>\u003c/div>\u003cdiv>\u003cb>body\u003c/b>\u003cem>명사\u003c/em>\u003cspan>몸, 신체\u003c/span>\u003c/div>\u003cdiv>\u003cb>meet\u003c/b>\u003cem>동사\u003c/em>\u003cspan>만나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>always\u003c/b>\u003cem>부사\u003c/em>\u003cspan>항상, 늘\u003c/span>\u003c/div>\u003cdiv>\u003cb>careful\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>조심하는, 주의하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>habit\u003c/b>\u003cem>명사\u003c/em>\u003cspan>습관, 버릇\u003c/span>\u003c/div>\u003cdiv>\u003cb>spit\u003c/b>\u003cem>동사\u003c/em>\u003cspan>침을 뱉다\u003c/span>\u003c/div>\u003cdiv>\u003cb>angry\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>화가 난\u003c/span>\u003c/div>\u003cdiv>\u003cb>upset\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>기분이 좋지 않은, 속상한\u003c/span>\u003c/div>\u003cdiv>\u003cb>show\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보여 주다, 나타내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>protect\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보호하다, 지키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>danger\u003c/b>\u003cem>명사\u003c/em>\u003cspan>위험\u003c/span>\u003c/div>\u003cdiv>\u003cb>in addition\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>게다가, 더욱이\u003c/span>\u003c/div>\u003cdiv>\u003cb>smell\u003c/b>\u003cem>명사\u003c/em>\u003cspan>냄새\u003c/span>\u003c/div>\u003cdiv>\u003cb>include\u003c/b>\u003cem>동사\u003c/em>\u003cspan>포함하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>recently\u003c/b>\u003cem>부사\u003c/em>\u003cspan>최근에\u003c/span>\u003c/div>\u003cdiv>\u003cb>eat\u003c/b>\u003cem>동사\u003c/em>\u003cspan>먹다\u003c/span>\u003c/div>\u003cdiv>\u003cb>however\u003c/b>\u003cem>부사\u003c/em>\u003cspan>그러나, 하지만\u003c/span>\u003c/div>\u003cdiv>\u003cb>worry about\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 대해 걱정하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>peaceful\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>평화로운, 온순한\u003c/span>\u003c/div>\u003cdiv>\u003cb>safe\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>안전한\u003c/span>\u003c/div>\u003cdiv>\u003cb>kind\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>친절한\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"단어는 나온 순서대로 익혀 두세요. be careful은 조심하다, habit은 습관, spit은 침을 뱉다는 뜻이고요. upset은 기분이 좋지 않은, peaceful은 평화로운, in addition은 게다가라는 뜻으로 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">careful\u003c/b>\u003cspan class=\"m\">조심하는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">cautious\u003c/span>\u003cspan class=\"s\">watchful\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">careless\u003c/span>\u003cspan class=\"a\">reckless\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">angry\u003c/b>\u003cspan class=\"m\">화가 난\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">mad\u003c/span>\u003cspan class=\"s\">furious\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">calm\u003c/span>\u003cspan class=\"a\">pleased\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">upset\u003c/b>\u003cspan class=\"m\">기분이 좋지 않은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">distressed\u003c/span>\u003cspan class=\"s\">troubled\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">calm\u003c/span>\u003cspan class=\"a\">relaxed\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">protect\u003c/b>\u003cspan class=\"m\">보호하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">guard\u003c/span>\u003cspan class=\"s\">defend\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">attack\u003c/span>\u003cspan class=\"a\">harm\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">danger\u003c/b>\u003cspan class=\"m\">위험\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">risk\u003c/span>\u003cspan class=\"s\">threat\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">safety\u003c/span>\u003cspan class=\"a\">security\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">peaceful\u003c/b>\u003cspan class=\"m\">평화로운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">calm\u003c/span>\u003cspan class=\"s\">quiet\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">violent\u003c/span>\u003cspan class=\"a\">aggressive\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">safe\u003c/b>\u003cspan class=\"m\">안전한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">secure\u003c/span>\u003cspan class=\"s\">protected\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">dangerous\u003c/span>\u003cspan class=\"a\">risky\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 함께 정리해 볼게요. careful은 cautious, watchful과 가깝고 반대말은 careless예요. protect는 guard, defend와 비슷하고 반대말은 attack이나 harm이에요. danger는 risk, threat와 같은 뜻이고 반대말은 safety, security죠. peaceful은 calm, quiet와 통하고 반대말은 violent, aggressive랍니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은 ~하나요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Do \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">좋아하나요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">알파카를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">alpacas\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여러분은 알파카를 좋아하는가?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글을 시작하면서 독자에게 말을 거는 \u003cb class=\"key\">도입 \u003c/b>\u003cb class=\"key\">질문\u003c/b>이에요. 곧바로 주제인 알파카에 관심을 끌어 다음 문장의 설명을 자연스럽게 이끄는 역할을 하죠. 대답을 요구하는 진짜 질문이 아니라, \u003cb class=\"key\">친근한 \u003c/b>\u003cb class=\"key\">어투\u003c/b>로 글의 문을 여는 장치라고 보면 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">일반동사 의문문(Do 조동사 도치)\u003c/span> : [Do/Does/Did] + [주어] + [동사원형]? : \"여러분은 ~을 좋아하나요?\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">타동사 + 목적어\u003c/span> : like [타동사] + alpacas [목적어] : \"알파카를 좋아하다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Do you, 여러분은 ~하나요. like, 좋아하나요. alpacas?, 알파카를. 이 문장 전체를 해석하면, 여러분은 알파카를 좋아하는가?","hl":"m"},{"n":13,"text":"이 문장은 글을 여는 도입 질문이에요. 독자에게 말을 걸어서 주제인 알파카에 관심을 갖게 만드는 장치죠. 진짜 대답을 듣기 위해서라기보다 친근한 어투로 글을 시작하는 거예요.","hl":"mn"},{"n":14,"text":"첫 번째, 일반동사 의문문이에요. do를 맨 앞에 세우고 동사는 동사원형으로 쓴다는 점을 기억하세요. 두 번째, like는 뒤에 목적어가 필요한 타동사라서 alpacas가 목적어로 따라온 구조예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">알파카는\u003c/span>\u003cspan class=\"en\">Alpacas\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~에 살다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">live \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">남아메리카 나라들에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">South \u003c/span>\u003cspan class=\"tgt\">American \u003c/span>\u003cspan class=\"tgt\">countries\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">칠레나 페루와 같은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">Chile \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">Peru\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">알파카는 칠레나 페루와 같은 남아메리카 나라들에 산다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 주제인 알파카가 어디서 사는지 \u003cb class=\"key\">서식지\u003c/b>를 알려 주는 문장이에요. 'South American countries'라는 큰 범주를 먼저 말하고, 'like Chile or Peru'로 구체적인 예를 덧붙여 이해를 돕죠. 여기서 like는 동사가 아니라 \u003cb class=\"key\">예시\u003c/b>를 드는 전치사라는 점이 핵심이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구(장소)에 의한 동사 수식\u003c/span> : live [자동사] + in [전치사] + [장소 명사] : \"남아메리카 나라들에 살다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">형용사에 의한 명사 수식\u003c/span> : [형용사 South American] + [명사 countries] : \"남아메리카의 나라들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 like(~와 같은, 예시)\u003c/span> : [명사] + like + [예시 명사] : \"칠레나 페루와 같은\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Alpacas, 알파카는. live in, ~에 살다. South American countries, 남아메리카 나라들에. like Chile or Peru, 칠레나 페루와 같은. 이 문장 전체를 해석하면, 알파카는 칠레나 페루와 같은 남아메리카 나라들에 산다.","hl":"m"},{"n":16,"text":"이 문장은 알파카의 서식지를 알려 주는 역할을 해요. 넓은 범주인 남아메리카 나라들을 먼저 말하고, 칠레나 페루라는 구체적인 예를 덧붙여서 이해를 돕고 있죠.","hl":"mn"},{"n":17,"text":"첫 번째, live는 자동사라서 전치사 in이 이끄는 전치사구가 장소를 알려 줍니다. 두 번째, like는 여기서 동사가 아니라 예시를 드는 전치사예요. 그래서 칠레나 페루와 같은 이라고 해석해야 합니다. 세 번째, South American이라는 형용사가 뒤의 명사 countries를 앞에서 꾸며 주고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은\u003c/span>\u003cspan class=\"en\">They\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가지고 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매우 부드러운 털을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">very \u003c/span>\u003cspan class=\"tgt\">soft \u003c/span>\u003cspan class=\"tgt\">hair\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 매우 부드러운 털을 가지고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에 이어 알파카의 \u003cb class=\"key\">외모 \u003c/b>\u003cb class=\"key\">특징\u003c/b>을 소개하는 문장이에요. 대명사 They는 바로 앞의 Alpacas를 가리키죠. very soft hair처럼 형용사가 명사 앞에서 꾸며 주는 구조를 통해 '부드러운 털'이라는 \u003cb class=\"key\">대표 \u003c/b>\u003cb class=\"key\">특징\u003c/b>을 한 번에 전달합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">타동사 have + 목적어(소유)\u003c/span> : have [타동사] + [목적어] : \"매우 부드러운 털을 가지고 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">형용사구에 의한 명사 수식(부사 + 형용사 + 명사)\u003c/span> : [very 부사] + [soft 형용사] + [hair 명사] : \"매우 부드러운 털\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"They, 그들은. have, 가지고 있다. very soft hair, 매우 부드러운 털을. 이 문장 전체를 해석하면, 그들은 매우 부드러운 털을 가지고 있다.","hl":"m"},{"n":19,"text":"이 문장은 알파카의 외모 특징을 소개하는 문장이에요. they가 바로 앞에 나온 alpacas를 가리킨다는 점을 놓치지 마세요. 부드러운 털이라는 대표 특징을 한 번에 보여 주고 있죠.","hl":"mn"},{"n":20,"text":"첫 번째, have는 목적어가 필요한 타동사라서 hair가 목적어로 와서 소유 표현을 만들고 있어요. 두 번째, very가 형용사 soft를 꾸미고 그 soft가 다시 명사 hair를 앞에서 꾸며 주는 어순이라는 점을 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고\u003c/span>\u003cspan class=\"en\">And\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 유명하다\u003c/span>\u003cspan class=\"en\">they \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">famous \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 귀여운 얼굴로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">for\u003c/span> their \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">cute \u003c/span>\u003cspan class=\"tgt\">faces \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 큰 몸으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">big \u003c/span>\u003cspan class=\"tgt\">bodies\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그리고 알파카는 귀여운 얼굴과 큰 몸으로 유명하다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 알파카의 외모 특징을 소개하며, \u003cb class=\"key\">귀여운 \u003c/b>\u003cb class=\"key\">얼굴\u003c/b>과 \u003cb class=\"key\">큰 \u003c/b>\u003cb class=\"key\">몸\u003c/b>이 사람들에게 인상을 주는 이유임을 말한다. be famous for는 '~으로 유명하다'라는 뜻으로, 뒤에 \u003cb class=\"key\">유명해진 \u003c/b>\u003cb class=\"key\">이유\u003c/b>가 온다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be famous for 구문\u003c/span> : [주어] + be famous for + [명사(구)] : \"~으로 유명하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">병렬 구조(and)\u003c/span> : [명사구] + and + [명사구] : \"귀여운 얼굴과 큰 몸\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"And, 그리고. they are famous, 그들은 유명하다. for their cute faces, 그들의 귀여운 얼굴로. and big bodies, 그리고 큰 몸으로. 이 문장 전체를 해석하면, 그리고 알파카는 귀여운 얼굴과 큰 몸으로 유명하다.","hl":"m"},{"n":22,"text":"이 문장은 알파카의 외모 특징을 소개하는 문장이에요. 귀여운 얼굴과 큰 몸이 사람들에게 인상을 주는 이유라는 흐름이죠. be famous for는 유명해진 이유를 뒤에 붙이는 표현이라고 기억해 두세요.","hl":"mn"},{"n":23,"text":"첫 번째로 are famous for는 be famous for 구문이에요. famous 뒤에 for를 붙여서 유명해진 대상이나 이유를 연결하죠. 두 번째로 cute faces and big bodies는 and가 두 명사구를 대등하게 연결한 병렬 구조예요. 그래서 귀여운 얼굴과 큰 몸을 나란히 묶어 이해하면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만\u003c/span>\u003cspan class=\"en\">But\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 이 동물들을 만날 때,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">meet \u003c/span>\u003cspan class=\"tgt\">these \u003c/span>\u003cspan class=\"tgt\">animals\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 항상 조심해야 한다!\u003c/span>\u003cspan class=\"en\">you \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">should \u003c/span>\u003cspan class=\"tgt\">always \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">careful\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 이 동물을 만날 때 여러분은 항상 조심해야 한다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞에서 알파카의 귀여운 겉모습을 말한 뒤 \u003cb class=\"key\">주의\u003c/b>를 요구하며 흐름을 전환한다. when절은 \u003cb class=\"key\">만날 \u003c/b>\u003cb class=\"key\">때\u003c/b>라는 상황을 제시하고, should는 \u003cb class=\"key\">조심해야 \u003c/b>\u003cb class=\"key\">한다\u003c/b>는 당위를 나타낸다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 when의 시간 부사절\u003c/span> : when + [주어] + [동사] : \"당신이 이 동물들을 만날 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 should의 당위\u003c/span> : [주어] + should + [동사원형] : \"항상 조심해야 한다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"But, 하지만. when you meet these animals, 당신이 이 동물들을 만날 때. you should always be careful!, 당신은 항상 조심해야 한다!. 이 문장 전체를 해석하면, 하지만 이 동물을 만날 때 여러분은 항상 조심해야 한다!","hl":"m"},{"n":25,"text":"이 문장은 알파카의 귀여운 겉모습을 말한 뒤에 주의를 요구하면서 흐름을 바꿔요. when절이 만날 때라는 상황을 제시하고, should가 조심해야 한다는 당위를 나타내죠. 그래서 앞의 소개와 뒤의 주의를 연결하는 신호로 봐야 합니다.","hl":"mn"},{"n":26,"text":"첫 번째로 when you meet these animals에서 when은 시간을 나타내는 접속사예요. when 뒤에는 주어와 동사가 있는 완전한 절이 와서 만날 때라는 상황을 만들어 주죠. 두 번째로 should always be careful에서 should는 당위와 충고를 나타내는 조동사예요. should 뒤에는 동사원형이 와서 항상 조심해야 한다는 뜻을 만듭니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u \"gn\">감각동사 feel의 형용사 보어와 병렬\u003c/span> : feel + [[angry]] or [[upset]] : \"화가 났거나 기분이 좋지 않은\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"First, 첫째. they want, 그들은 원한다. to show, 보여 주기를. that they feel, 그들이 느낀다는 것을. angry or upset, 화가 났거나 기분이 좋지 않다고. 이 문장 전체를 해석하면, 첫째, 그들은 화가 났거나 기분이 좋지 않다는 것을 보여 주고 싶어 한다.","hl":"m"},{"n":34,"text":"이 문장은 침을 뱉는 첫 번째 이유를 제시해요. 알파카가 자신의 감정이 화남이나 속상함이라는 것을 보여 주려 한다는 뜻이죠.","hl":"mn"},{"n":35,"text":"첫 번째 어법 포인트는 to show가 want의 목적어로 쓰인 to부정사라는 점이에요. want 뒤에 to show가 와서 보여 주기를 원한다는 뜻을 만들어요. 두 번째는 that they feel이 show의 목적어로 쓰인 that절이라는 점이에요. show 뒤에 that절이 와서 그들이 느낀다는 것을 보여 준다는 뜻이 되죠. 세 번째는 feel 뒤에 angry와 upset이라는 형용사가 주격보어로 오고, or로 두 형용사가 병렬을 이룬다는 점이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">둘째,\u003c/span>\u003cspan class=\"en\">Second,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 원한다\u003c/span>\u003cspan class=\"en\">they want\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보호하기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">protect\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들 자신을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">themselves\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">위험으로부터\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">danger\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">둘째, 그들은 위험으로부터 그들 자신을 보호하기를 원한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 침을 뱉는 두 번째 \u003cb class=\"key\">이유\u003c/b>를 제시하는 문장이에요. 03cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">because \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">includes \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 음식을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">food \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 최근에 먹은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">recently \u003c/span>\u003cspan class=\"tgt\">ate\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">게다가 그들의 침에는 그들이 최근에 먹은 음식이 포함되어 있기 때문에 매우 고약한 냄새가 난다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 알파카가 침을 뱉는 \u003cb class=\"key\">세 \u003c/b>\u003cb class=\"key\">번째 \u003c/b>\u003cb class=\"key\">이유\u003c/b>를 설명하는 문장이에요. 침에 최근 먹은 음식이 섞여 있어 \u003cb class=\"key\">고약한 \u003c/b>\u003cb class=\"key\">냄새\u003c/b>가 난다는 부연 설명으로, 앞의 '침을 뱉는다'는 내용을 더 구체화합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">3인칭 단수 현재형 have→has\u003c/span> : [3인칭 단수 주어 their spit] + has(have의 3인칭 단수형) + [목적어 a very bad smell] : \"매우 고약한 냄새가 난다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이유의 접속사 because\u003c/span> : [주절] + because + [이유를 나타내는 절] : \"왜냐하면 그것이 그 음식을 포함하기 때문에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사의 생략\u003c/span> : [선행사 the food] + [(which/that) + 주어 they + 동사 recently ate] : \"그들이 최근에 먹은 음식\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"In addition, 게다가. their spit, 그들의 침에는. has a very bad smell, 매우 고약한 냄새가 난다. because it includes, 왜냐하면 그것이 포함하고 있기 때문에. the food, 그 음식을. they recently ate, 그들이 최근에 먹은. 이 문장 전체를 해석하면, 게다가 그들의 침에는 그들이 최근에 먹은 음식이 포함되어 있기 때문에 매우 고약한 냄새가 난다.","hl":"m"},{"n":40,"text":"이 문장은 알파카가 침을 뱉는 세 번째 이유를 알려 줘요. 침에 최근에 먹은 음식이 섞여 있어서 고약한 냄새가 난다고 설명하죠. 앞에서 침을 뱉는다고 했으니 그 이유를 더 자세히 보충하는 역할이에요.","hl":"mn"},{"n":41,"text":"어법 포인트는 세 가지예요. 첫 번째, their spit이 삼인칭 단수라서 has를 써요. 두 번째, because는 이유를 이끄는 접속사로 because it includes the food라고 이유 절을 만듭니다. 세 번째, the food they recently ate에서는 목적격 관계대명사 which나 that이 생략되어 그들이 최근에 먹은 음식이라는 뜻이 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나\u003c/span>\u003cspan class=\"en\">However,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 걱정할 필요가 없어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">worry\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것에 대해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">about \u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">much\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 그렇게 걱정할 필요는 없다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 알파카의 침이 고약하다고 경고한 내용을 \u003cb class=\"key\">전환\u003c/b>하는 문장이에요. '그렇게까지 \u003cb class=\"key\">걱정할 \u003c/b>\u003cb class=\"key\">필요는 \u003c/b>\u003cb class=\"key\">없다\u003c/b>'고 말하며 독자의 긴장을 풀어 주고, 뒤에 나올 알파카의 \u003cb class=\"key\">평화로운 \u003c/b>\u003cb class=\"key\">성격\u003c/b>을 자연스럽게 이어 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">don't have to + 동사원형(필요·의무의 부정)\u003c/span> : [주어] + don't/doesn't have to + [동사원형] : \"걱정할 필요가 없다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 about의 목적어와 정도 부사 much\u003c/span> : [worry] + about + [that] + [much] : \"그것에 대해 그렇게 많이\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"However, 그러나. you don't have to worry, 당신은 걱정할 필요가 없어요. about that, 그것에 대해. much, 많이. 이 문장 전체를 해석하면, 그러나 그렇게 걱정할 필요는 없다.","hl":"m"},{"n":43,"text":"이 문장은 앞에서 알파카의 침이 고약하다고 경고한 내용을 전환하는 역할을 해요. 그렇게까지 걱정할 필요는 없다고 말하면서 독자의 긴장을 풀어 주죠. 뒤에 나올 알파카의 평화로운 성격을 자연스럽게 이어 주는 문장이에요.","hl":"mn"},{"n":44,"text":"첫 번째, don't have to worry는 필요나 의무의 부정으로 걱정할 필요가 없다는 뜻이에요. have to 뒤에는 동사원형 worry가 와요. 두 번째, worry about that은 그것에 대해 걱정하다라는 표현이고, that은 앞에서 말한 침 냄새와 관련된 상황을 가리켜요. much는 그렇게 많이라는 정도를 나타냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">알파카는 보통\u003c/span>\u003cspan class=\"en\">Alpacas \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">usually \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">평화로운 동물이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">peaceful \u003c/span>\u003cspan class=\"tgt\">animals\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 안전하다고 느낄 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">feel \u003c/span>\u003cspan class=\"tgt\">safe\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">알파카는 안전하다고 느낄 때는 평화로운 동물이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 알파카가 \u003cb class=\"key\">안전하다고 \u003c/b>\u003cb class=\"key\">느낄 \u003c/b>\u003cb class=\"key\">때\u003c/b>는 평화롭다는 \u003cb class=\"key\">결론\u003c/b>을 제시하는 문장이에요. 앞의 걱정을 누그러뜨리면서 마지막 \u003cb class=\"key\">당부\u003c/b>로 이어지는 핵심 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사 + 부사 + 주격 보어\u003c/span> : [주어 Alpacas] + [be동사 are] + [부사 usually] + [형용사 peaceful + 명사 animals(주격 보어)] : \"보통 평화로운 동물이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">시간을 나타내는 접속사 when\u003c/span> : [주절] + when + [시간의 절] : \"그들이 안전하다고 느낄 때\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"Alpacas are usually, 알파카는 보통. peaceful animals, 평화로운 동물이다. when they feel safe, 그들이 안전하다고 느낄 때. 이 문장 전체를 해석하면, 알파카는 안전하다고 느낄 때는 평화로운 동물이다.","hl":"m"},{"n":46,"text":"이 문장은 알파카가 안전하다고 느낄 때는 평화롭다는 결론을 제시해요. 앞에서 걱정할 필요가 없다고 한 내용을 뒷받침하면서 마지막 당부로 자연스럽게 이어 주죠. 그래서 글의 핵심을 담은 중요한 문장이에요.","hl":"mn"},{"n":47,"text":"첫 번째, are usually peaceful animals에서 be동사 are 뒤에 주격 보어 peaceful animals가 와서 알파카의 성질을 설명해요. 부사 usually는 be동사 뒤에서 보통이라는 빈도를 나타내죠. 두 번째, when they feel safe에서 when은 할 때라는 시간의 접속사이고, they는 앞의 Alpacas를 받아요. feel은 형용사 safe를 보어로 취해서 안전하다고 느끼다는 뜻을 만들어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서\u003c/span>\u003cspan class=\"en\">So,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">알파카를 보면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">see \u003c/span>\u003cspan class=\"tgt\">some \u003c/span>\u003cspan class=\"tgt\">alpacas\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들에게 친절하게 대해야 한다\u003c/span>\u003cspan class=\"en\">you \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">need \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">kind \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">them\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그래서 알파카를 보면 친절하게 대해야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 알파카의 습성과 이유를 설명한 뒤, 독자에게 실천할 태도를 알려 주는 \u003cb class=\"key\">결론\u003c/b>이에요. when은 '~할 때, ~하면'의 \u003cb class=\"key\">조건\u003c/b>을 나타내고, need to는 '~해야 한다'는 \u003cb class=\"key\">의무\u003c/b>를 표현해요. 결국 알파카를 만나면 함부로 대하지 말고 \u003cb class=\"key\">친절\u003c/b>하게 대하라는 조언이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 when의 부사절\u003c/span> : when + [주어 + 동사] ... : \"알파카를 보면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(need의 목적어)\u003c/span> : need + to + [동사원형] : \"~해야 한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">be + 형용사 + to + 대상\u003c/span> : be kind to + [사람] : \"그들에게 친절한\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"So, 그래서. when you see some alpacas, 알파카를 보면. you need to be kind to them, 그들에게 친절하게 대해야 한다. 이 문장 전체를 해석하면, 그래서 알파카를 보면 친절하게 대해야 한다.","hl":"m"},{"n":49,"text":"이 문장은 알파카의 습성과 이유를 설명한 뒤, 독자에게 실천할 태도를 알려 주는 결론이에요. when은 알파카를 보는 조건을 나타내고, need to는 꼭 해야 하는 의무를 표현해요. 결국 알파카를 만나면 함부로 대하지 말고 친절하게 대하라는 조언이죠.","hl":"mn"},{"n":50,"text":"어법 포인트는 세 가지예요. 첫 번째, when you see some alpacas에서 when은 조건을 이끄는 부사절 접속사예요. 두 번째, need to be에서 need 뒤에 to부정사가 와서 의무를 나타내요. 세 번째, kind to them에서 kind 뒤의 전치사 to는 친절함을 받는 대상을 연결해 줘요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>알파카는 칠레나 페루 같은 \u003cb class=\"key\">남아메리카\u003c/b> 나라들에 살며, 부드러운 털과 귀여운 얼굴로 \u003cb class=\"key\">유명\u003c/b>하다.\u003c/li>\u003cli>알파카는 \u003cb class=\"key\">나쁜 \u003c/b>\u003cb class=\"key\">습관\u003c/b>을 가지고 있어서 화가 나거나 기분이 좋지 않을 때 사람에게 침을 뱉을 수 있다.\u003c/li>\u003cli>침을 뱉는 이유는 \u003cb class=\"key\">감정\u003c/b>을 보여 주려는 것과 위험으로부터 자신을 \u003cb class=\"key\">보호\u003c/b>하려는 것이며, 침에는 \u003cb class=\"key\">고약한 \u003c/b>\u003cb class=\"key\">냄새\u003c/b>가 난다.\u003c/li>\u003cli>그러나 알파카는 안전하다고 느낄 때 \u003cb class=\"key\">평화로운 \u003c/b>\u003cb class=\"key\">동물\u003c/b>이므로 만나면 \u003cb class=\"key\">친절\u003c/b>하게 대해야 한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Alpacas may spit at you when they feel angry or want to protect themselves from danger, but they are peaceful animals when they feel safe, so you should be kind to them.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">알파카는 귀엽지만 화가 나거나 위험을 느끼면 침을 뱉는 \u003cb class=\"key\">나쁜 \u003c/b>\u003cb class=\"key\">습관\u003c/b>이 있다. 그러나 안전하다고 느낄 때는 \u003cb class=\"key\">평화로운 \u003c/b>\u003cb class=\"key\">동물\u003c/b>이므로 만나면 친절하게 대해야 한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":51,"text":"오늘 글의 핵심을 다시 정리해 볼게요. 알파카는 화가 나거나 위험을 느낄 때 침을 뱉지만, 그건 자신의 감정과 위험을 알리는 신호예요. 안전하다고 느끼면 평화로운 동물이니 만나면 친절하게 대하면 된답니다. 오늘도 끝까지 들어 주셔서 고맙고, 다음 시간에 또 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
