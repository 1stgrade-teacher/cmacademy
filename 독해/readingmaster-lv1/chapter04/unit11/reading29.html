<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터1 Reading 29 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터1 Reading 29","audioDir":"reading29_audio","preview":false,"count":54,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.668em\">Reading\u003cbr>29\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터1\u003c/div>\u003ch1>Why Department Stores Hide Windows and Clocks\u003c/h1>\u003ch2>백화점은 왜 창문과 시계를 숨길까?\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>백화점은 \u003cb class=\"key\">창문\u003c/b>과 \u003cb class=\"key\">시계\u003c/b>가 고객에게 시간을 생각하게 해 쇼핑을 방해하므로 일부러 설치하지 않고, 넓은 \u003cb class=\"key\">벽\u003c/b>을 장식과 광고에 활용하는 비밀스러운 \u003cb class=\"key\">마케팅 \u003c/b>\u003cb class=\"key\">기술\u003c/b>을 쓴다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Department stores intentionally omit windows and clocks to keep customers from thinking about time and to use their walls for advertisements, helping them focus on shopping.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 백화점에 창문이나 시계가 없는 이유를 다룬 지문을 함께 읽어 볼게요. 이 글은 그 이유를 비밀 마케팅 기술과 벽면 활용의 관점에서 설명하고 있어요. 핵심은 백화점이 고객이 시간을 잊고 쇼핑에 집중하도록 환경을 의도적으로 꾸민다는 점이에요. 그럼 지문을 한 단계씩 자세히 살펴보겠습니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">백화점은 단순히 물건을 파는 공간이 아니라 고객의 \u003cb class=\"key\">소비 \u003c/b>\u003cb class=\"key\">행동\u003c/b>을 설계하는 마케팅 공간이에요. 매장 환경은 \u003cb class=\"key\">시각적 \u003c/b>\u003cb class=\"key\">단서\u003c/b>를 통해 고객이 무엇을 생각하고 얼마나 오래 머무는지에 영향을 줍니다. 이처럼 환경이 행동을 바꾸는 원리를 environmental psychology, 즉 \u003cb class=\"key\">환경 \u003c/b>\u003cb class=\"key\">심리학\u003c/b>에서 자주 다루죠. 예를 들어 시험장에 큰 시계가 있으면 남은 시간이 계속 의식되는 것과 비슷합니다. 그래서 백화점은 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">단서\u003c/b>를 줄이고 \u003cb class=\"key\">벽면\u003c/b>을 광고와 장식에 쓰려는 전략을 세울 수 있어요.\u003c/div>","segs":[{"n":2,"text":"백화점은 단순히 물건을 파는 곳이 아니라 고객의 소비 행동을 설계하는 마케팅 공간이에요. 매장 환경은 시각적 단서를 통해 고객이 무엇을 생각하고 얼마나 오래 머무는지에 영향을 줘요. 이런 원리는 environmental psychology, 즉 환경 심리학에서 자주 다뤄지는 개념이죠. 시험장에 큰 시계가 있으면 남은 시간이 계속 의식되는 것과 비슷한 원리예요. 그래서 백화점은 시간 단서를 줄이고 벽면을 광고와 장식에 활용하는 전략을 세울 수 있습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>질문과 의문\u003csmall>도입 · 문장 1–4\u003c/small>\u003c/h4>\u003cp>글은 백화점에서 \u003cb class=\"key\">창문\u003c/b>이나 \u003cb class=\"key\">시계\u003c/b>를 볼 수 있는지 묻고, 사람들이 이것에 대해 생각조차 하지 않을 수 있다고 말해요. 실제로 대부분의 백화점에는 창문이나 시계가 없다는 사실을 제시하죠. 이어서 왜 그런지 \u003cb class=\"key\">이유\u003c/b>를 질문하며 글의 방향을 잡습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>비밀 마케팅 기술\u003csmall>주장 · 문장 5–8\u003c/small>\u003c/h4>\u003cp>백화점에 창문과 시계가 없는 것은 \u003cb class=\"key\">비밀스러운 \u003c/b>\u003cb class=\"key\">마케팅 \u003c/b>\u003cb class=\"key\">기술\u003c/b>이에요. 창문과 시계는 고객이 \u003cb class=\"key\">시간\u003c/b>을 생각하게 만들기 때문이죠. 그래서 백화점은 사람들이 시간을 생각하지 않고 쇼핑을 즐기도록, 쇼핑에 \u003cb class=\"key\">집중\u003c/b>하게 하는 방식을 사용해요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>벽 활용의 어려움\u003csmall>추가 근거 · 문장 9–12\u003c/small>\u003c/h4>\u003cp>또한 백화점은 \u003cb class=\"key\">벽\u003c/b>을 장식하거나 벽에 \u003cb class=\"key\">광고\u003c/b>들을 걸어요. 그런데 공간이 넓기 때문에 벽을 꾸미는 일은 쉽지 않죠. 벽에 시계나 창문이 있으면 넓은 벽을 \u003cb class=\"key\">사용하기\u003c/b> 어렵기 때문에, 이것 역시 백화점의 비밀이 됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>관찰 제안\u003csmall>결론 · 문장 13–14\u003c/small>\u003c/h4>\u003cp>마지막으로 다음번에 백화점을 방문하면 주변을 잘 \u003cb class=\"key\">둘러보라\u003c/b>고 제안해요. 그리고 백화점 벽에 창문, 시계, 또는 \u003cb class=\"key\">광고\u003c/b>가 있는지 직접 확인해 보라고 묻습니다. 독자가 글의 내용을 \u003cb class=\"key\">실생활\u003c/b>에서 관찰하도록 이끄는 결론이에요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 도입, 주장, 추가 근거, 결론 순서로 짚어 볼게요.","hl":null},{"n":4,"text":"글은 먼저 백화점에서 창문이나 시계를 볼 수 있는지 독자에게 물어요. 그리고 사람들이 이것에 대해 생각조차 하지 않을 수 있다고 말하면서 실제로 대부분의 백화점에는 창문이나 시계가 없다는 사실을 제시하죠. 이어서 왜 그런지 이유를 질문하면서 글의 방향을 잡습니다.","hl":"f0"},{"n":5,"text":"여기서 핵심 주장이 나와요. 백화점에 창문과 시계가 없는 것은 비밀스러운 마케팅 기술이라는 거죠. 창문과 시계는 고객이 시간을 생각하게 만들기 때문에, 백화점은 사람들이 시간을 생각하지 않고 쇼핑을 즐기도록 쇼핑에 집중하게 하는 방식을 사용해요.","hl":"f1"},{"n":6,"text":"두 번째 근거는 벽의 활용이에요. 백화점은 벽을 장식하거나 벽에 광고들을 겁니다. 그런데 공간이 넓기 때문에 벽을 꾸미는 일은 쉽지 않죠. 벽에 시계나 창문이 있으면 넓은 벽을 사용하기 어렵기 때문에 이것 역시 백화점의 비밀이 됩니다.","hl":"f2"},{"n":7,"text":"마지막으로 글은 다음번에 백화점을 방문하면 주변을 잘 둘러보라고 제안해요. 그리고 백화점 벽에 창문, 시계, 또는 광고가 있는지 직접 확인해 보라고 묻죠. 독자가 글의 내용을 실생활에서 관찰하도록 이끄는 결론입니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">질문-답변\u003c/span>\u003cspan class=\"lp-pill\">양괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 5번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 첫 부분에서 백화점에 창문이나 시계가 없는 이유를 \u003cb class=\"key\">질문\u003c/b>으로 던지고, 다섯 번째 문장에서 그것이 \u003cb class=\"key\">비밀 \u003c/b>\u003cb class=\"key\">마케팅 \u003c/b>\u003cb class=\"key\">기술\u003c/b>이라고 답해요. 이후 6~8번 문장과 9~11번 문장에서 시간과 벽 활용이라는 두 가지 \u003cb class=\"key\">근거\u003c/b>를 제시하죠. 열두 번째 문장에서 다시 이것이 백화점의 비밀이라고 \u003cb class=\"key\">강조\u003c/b>하므로, 핵심 주장이 앞과 뒤에서 되풀이되는 양괄식으로 볼 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Actually (3)\u003c/b>\u003cspan>사실 제시\u003c/span>\u003cb>Why is this? (4)\u003c/b>\u003cspan>질문 제기\u003c/span>\u003cb>So (8)\u003c/b>\u003cspan>목적·결과\u003c/span>\u003cb>Also (9)\u003c/b>\u003cspan>추가 근거\u003c/span>\u003cb>If (11)\u003c/b>\u003cspan>조건 제시\u003c/span>\u003cb>This is (12)\u003c/b>\u003cspan>요약·강조\u003c/span>\u003cb>So (13)\u003c/b>\u003cspan>결론·제안\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">no windows or clocks in most department stores\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a secret marketing skill\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">without thinking about the time\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">focus on shopping\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">decorate or hang advertisements on their walls\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">use the walls\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 질문과 답변의 방식으로 전개되는 설명문이에요. 첫 부분에서 던진 질문에 다섯 번째 문장에서 비밀 마케팅 기술이라고 답하고, 그 뒤에 두 가지 근거를 붙이죠. 열두 번째 문장에서 다시 이것이 백화점의 비밀이라고 강조하기 때문에 핵심 주장이 앞과 뒤에서 되풀이되는 양괄식 구조로 볼 수 있습니다.","hl":"ty"},{"n":9,"text":"신호어를 보면 글의 뼈대가 더 선명해져요. Actually는 실제 사실을 제시하며 생각과 다른 점을 드러내고, Why is this는 질문을 던져 답을 기대하게 만듭니다. So는 목적과 결과를, Also는 추가 근거를 연결하고, If는 조건을 제시해 벽 활용이 어려운 이유를 보강하죠. 마지막의 So는 결론과 제안으로 독자를 이끕니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>department store\u003c/b>\u003cem>명사\u003c/em>\u003cspan>백화점\u003c/span>\u003c/div>\u003cdiv>\u003cb>window\u003c/b>\u003cem>명사\u003c/em>\u003cspan>창문\u003c/span>\u003c/div>\u003cdiv>\u003cb>clock\u003c/b>\u003cem>명사\u003c/em>\u003cspan>시계\u003c/span>\u003c/div>\u003cdiv>\u003cb>even\u003c/b>\u003cem>부사\u003c/em>\u003cspan>심지어, 조차\u003c/span>\u003c/div>\u003cdiv>\u003cb>think about\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 대해 생각하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>actually\u003c/b>\u003cem>부사\u003c/em>\u003cspan>실제로\u003c/span>\u003c/div>\u003cdiv>\u003cb>most\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>대부분의\u003c/span>\u003c/div>\u003cdiv>\u003cb>secret\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>비밀의\u003c/span>\u003c/div>\u003cdiv>\u003cb>marketing\u003c/b>\u003cem>명사\u003c/em>\u003cspan>마케팅\u003c/span>\u003c/div>\u003cdiv>\u003cb>skill\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기술\u003c/span>\u003c/div>\u003cdiv>\u003cb>make\u003c/b>\u003cem>동사\u003c/em>\u003cspan>만들다; (~하게) 만 \">1\u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">are\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">no \u003c/span>\u003cspan class=\"tgt\">windows \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">clocks\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대부분의 백화점에는\u003c/span>\u003cspan class=\"en\">in \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">most \u003c/span>\u003cspan class=\"tgt\">department \u003c/span>\u003cspan class=\"tgt\">stores\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">실제로 대부분의 백화점에는 창문이나 시계가 없다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞의 질문에 대한 놀라운 답을 제시하는 문장이에요. 대부분의 백화점에 창문도 시계도 없다는 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">사실\u003c/b>을 분명히 밝히죠. 이로써 독자는 '왜 없을까?'라는 새로운 \u003cb class=\"key\">궁금증\u003c/b>을 갖게 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">유도부사 there + be동사 구문\u003c/span> : [There + are] + [복수명사] : \"~이 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부정어 no + or (A도 B도 없다)\u003c/span> : [no A] + [or B] : \"창문도 시계도 없다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">most + 복수명사(대부분의)\u003c/span> : [most] + [복수명사] : \"대부분의 백화점\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Actually, 실제로. there are no windows or clocks, 창문이나 시계가 없다. in most department stores, 대부분의 백화점에는. 이 문장 전체를 해석하면, 실제로 대부분의 백화점에는 창문이나 시계가 없다.","hl":"m"},{"n":19,"text":"이 문장은 앞의 질문에 대한 놀라운 답을 제시해요. 대부분의 백화점에 창문도 시계도 없다는 핵심 사실을 분명하게 말하죠. 그래서 독자는 왜 없을까라는 새로운 궁금증을 갖게 됩니다.","hl":"mn"},{"n":20,"text":"먼저 there are를 볼게요. there는 '거기에'라는 뜻이 아니라 '~이 있다'라는 유도부사예요. 뒤에 복수명사가 오니까 be동사는 are를 씁니다. 다음으로 no windows or clocks에서 no는 부정어라서 or와 함께 'A도 B도 없다'라는 뜻이 돼요. 복수명사 windows와 clocks 앞에 no를 붙인 거죠. 마지막으로 most department stores에서 most는 관사 없이 복수명사 앞에 오면 '대부분의'라는 뜻이에요. 최상급과 헷갈리지 않게 조심하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Why \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이럴까?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">this\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">왜 이럴까?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 백화점에는 창문도 시계도 없다고 말한 뒤, 그 까닭을 묻는 \u003cb class=\"key\">질문\u003c/b>입니다. 독자가 품을 법한 궁금증을 대신 던져서 다음 문장의 \u003cb class=\"key\">답\u003c/b>을 자연스럽게 끌어내는 역할을 합니다. 아주 짧은 문장이지만 글의 흐름을 이유 설명으로 넘기는 \u003cb class=\"key\">전환점\u003c/b>이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문사가 이끄는 의문문의 도치(be동사 + 주어)\u003c/span> : Why + [be동사 is] + [주어 this]? (평서 어순: This is why.) : \"왜 이럴까?\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Why, 왜. is this?, 이럴까?. 이 문장 전체를 해석하면, 왜 이럴까?","hl":"m"},{"n":22,"text":"앞에서 백화점에 창문이나 시계가 없다고 했죠. 그러면 당연히 궁금하잖아요. 그래서 던지는 질문이에요. 왜 그럴까, 하고 물으면서 다음 문장의 답을 끌어내는 역할을 한답니다.","hl":"mn"},{"n":23,"text":"여기서 볼 것은 의문사 why 다음에 be동사 is가 나오고 주어 this가 뒤에 오는 도치 어순이에요. 원래는 This is why처럼 주어가 먼저 오는데, 질문이 되니까 why is this 순서로 자리가 바뀐 거예요. 도치 어순이라고 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 ~이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It\u003c/span> is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">비밀스러운\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">secret \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마케팅 기술\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">marketing \u003c/span>\u003cspan class=\"tgt\">skill\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것은 백화점의 비밀스러운 마케팅 기술이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 질문에 대한 \u003cb class=\"key\">답\u003c/b>을 바로 제시하는 문장입니다. It은 앞에서 말한 상황 전체, 즉 창문과 시계가 없는 이유를 가리키고, 그것이 곧 \u003cb class=\"key\">마케팅 \u003c/b>\u003cb class=\"key\">기술\u003c/b>이라고 규정합니다. 이 문장을 중심으로 뒤에서 이유 두 가지가 \u003cb class=\"key\">구체화\u003c/b>된다고 보면 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지시대명사 it(앞 문장 내용을 받는 용법)\u003c/span> : [It (앞 문장 Why is this?의 내용 = 창문과 시계가 없는 까닭)] + is + [보어] : \"그것은 ~이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">형용사 + 복합명사의 명사 수식\u003c/span> : [a secret (형용사)] + [marketing skill (명사 + 명사)] : \"비밀스러운 마케팅 기술\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"It is, 그것은 ~이다. a secret, 비밀스러운. marketing skill, 마케팅 기술. 이 문장 전체를 해석하면, 이것은 백화점의 비밀스러운 마케팅 기술이다.","hl":"m"},{"n":25,"text":"앞 문장의 질문에 대한 답이에요. It은 앞에서 말한 상황 전체, 그러니까 창문과 시계가 없는 이유를 가리켜요. 그 이유가 바로 비밀스러운 마케팅 기술이라는 거죠.","hl":"mn"},{"n":26,"text":"첫 번째로 It은 앞 문장 내용을 통째로 받는 지시대명사예요. 두 번째로 a secret marketing skill을 보면 secret이 형용사로 뒤를 꾸미고, marketing이 명사로 skill을 꾸미는 복합명사 구조예요. 영어는 꾸미는 말이 앞에서부터 차례로 온다는 것, 꼭 받아 적어 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003 =\"lp-sno\">문장 7 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">백화점은\u003c/span>\u003cspan class=\"en\">The department store\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">원한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">wants \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들이 쇼핑을 즐기기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">enjoy \u003c/span>\u003cspan class=\"tgt\">shopping\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">생각하지 않고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">without \u003c/span>\u003cspan class=\"tgt\">thinking\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시간에 대해\u003c/span>\u003cspan class=\"en\">about the time.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">백화점은 사람들이 시간을 생각하지 않고 쇼핑을 즐기기를 원한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 백화점이 왜 \u003cb class=\"key\">시계\u003c/b>와 \u003cb class=\"key\">창문\u003c/b>을 두지 않는지 그 첫 번째 이유를 알려 줘요. 손님이 \u003cb class=\"key\">시간\u003c/b>을 의식하지 않고 쇼핑 자체를 즐기게 만들려는 거죠. 앞의 질문에 대한 핵심 답으로, 백화점의 숨은 마케팅 목적을 분명히 밝힙니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">목적격보어로 쓰인 to부정사 (want + 목적어 + to부정사)\u003c/span> : want [목적어] + [to부정사(목적격보어)] : \"사람들이 쇼핑을 즐기기를 원한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 without + 동명사\u003c/span> : without + [동명사] : \"생각하지 않고\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"The department store, 백화점은. wants, 원한다. people to enjoy shopping, 사람들이 쇼핑을 즐기기를. without thinking, 생각하지 않고. about the time, 시간에 대해. 이 문장 전체를 해석하면, 백화점은 사람들이 시간을 생각하지 않고 쇼핑을 즐기기를 원한다.","hl":"m"},{"n":31,"text":"이 문장은 백화점이 왜 시계와 창문을 두지 않는지 그 첫 번째 이유를 알려 줘요. 손님이 시간을 의식하지 않고 쇼핑 자체를 즐기게 만들려는 거죠. 그래서 백화점의 숨은 마케팅 전략이 손님의 몰입을 위한 장치라는 점을 기억하면 좋아요.","hl":"mn"},{"n":32,"text":"여기서 want는 목적어 뒤에 to부정사를 목적격보어로 데려와요. 그래서 wants people to enjoy shopping은 사람들이 쇼핑을 즐기기를 원한다는 뜻이 되죠. 또 without은 전치사라서 뒤에 동명사 thinking이 와요. 전치사 뒤에는 동명사가 온다는 원칙을 꼭 기억해 주세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서\u003c/span>\u003cspan class=\"en\">So,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 이 방법을 사용한다\u003c/span>\u003cspan class=\"en\">they use this way\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들이 ~하게 만들기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">make\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">쇼핑에 집중하도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">focus\u003c/span> on shopping.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그래서 그들은 이 방법으로 사람들이 쇼핑에 집중하도록 만든다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞 문장의 목적을 실행하는 \u003cb class=\"key\">수단\u003c/b>을 설명해요. 백화점은 창문과 시계를 없애는 \u003cb class=\"key\">방법\u003c/b>으로 손님의 주의를 \u003cb class=\"key\">쇼핑\u003c/b>에 붙잡아 두려는 거죠. 그래서 앞의 원인과 결과를 자연스럽게 이어 주는 연결 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : [to + 동사원형] = ~하기 위해 : \"만들기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">사역동사 make의 목적어 + 동사원형 목적격보어\u003c/span> : make + [목적어 people] + [동사원형 focus] : \"사람들이 집중하게 만들다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"So, 그래서. they use this way, 그들은 이 방법을 사용한다. to make people, 사람들이 ~하게 만들기 위해. focus on shopping, 쇼핑에 집중하도록. 이 문장 전체를 해석하면, 그래서 그들은 이 방법으로 사람들이 쇼핑에 집중하도록 만든다.","hl":"m"},{"n":34,"text":"이 문장은 백화점이 창문과 시계를 없애는 방법을 왜 쓰는지 알려 줘요. 바로 손님의 주의를 쇼핑으로 끌어오기 위한 수단인 거죠. 그래서 이 문장은 앞의 목적과 뒤의 구체적인 전략을 자연스럽게 연결해 줍니다.","hl":"mn"},{"n":35,"text":"여기서 to make는 '~하기 위해'라는 목적을 나타내는 부사적 용법의 to부정사예요. 또 make는 사역동사라서 people focus처럼 목적어 뒤에 동사원형이 와요. 그래서 make people focus on shopping은 사람들이 쇼핑에 집중하게 만든다는 뜻이 되죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또한\u003c/span>\u003cspan class=\"en\">Also,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">백화점은\u003c/span>\u003cspan class=\"en\">department stores\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">장식하거나 건다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">decorate \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">hang\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">광고들을\u003c/span>\u003cspan class=\"en\">advertisements\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 벽에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">walls\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">또한 백화점은 벽을 장식하거나 벽에 광고들을 건다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 백화점의 두 번째 전략을 추가하는 문장이에요. 백화점이 \u003cb class=\"key\">벽\u003c/b>을 \u003cb class=\"key\">광고\u003c/b>나 장식으로 채워 활용한다는 점을 말하죠. 이는 앞에서 말한 시간을 잊게 하는 전략과 함께, 넓은 벽을 \u003cb class=\"key\">마케팅\u003c/b> 공간으로 쓰는 이유를 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">등위접속사 or에 의한 동사 병렬\u003c/span> : [동사 A] or [동사 B] : \"장식하거나 건다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소를 나타내는 전치사구\u003c/span> : hang [목적어] + on [장소] : \"그들의 벽에\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Also, 또한. department stores, 백화점은. decorate or hang, 장식하거나 건다. advertisements, 광고들을. on their walls, 그들의 벽에. 이 문장 전체를 해석하면, 또한 백화점은 벽을 장식하거나 벽에 광고들을 건다.","hl":"m"},{"n":37,"text":"이 문장은 백화점의 또 다른 숨은 전략을 보여 줘요. 백화점은 넓은 벽을 그냥 두지 않고 광고나 장식으로 채우는 거죠. 그래서 벽을 마케팅 공간으로 활용한다는 흐름을 잡으면 됩니다.","hl":"mn"},{"n":38,"text":"여기서 decorate와 hang은 등위접속사 or로 연결된 동사 병렬 구조예요. 주어 department stores가 두 동작을 함께 한다는 뜻이죠. 그리고 hang은 타동사라서 목적어 뒤에 on their walls 같은 장소의 전치사구를 데려옵니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">벽을 꾸미는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Decorating \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">walls\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어렵다\u003c/span>\u003cspan class=\"en\">is hard\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜냐하면 그것은 넓은 공간이기 때문이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">because \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">big \u003c/span>\u003cspan class=\"tgt\">space\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">공간이 넓기 때문에 벽을 꾸미는 것은 어렵 다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 벽을 꾸미는 일이 어려운 까닭을 '공간이 넓다'는 점에서 풀어 주는 문장이에요. 백화점이 벽에 광고를 걸거나 장식하는 전략을 쓰는 \u003cb class=\"key\">이유\u003c/b>를 미리 깔아 주는 역할을 합니다. 여기서 it은 벽, 즉 꾸며야 할 넓은 공간을 가리켜요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사구의 주어\u003c/span> : [동명사(구)] + [단수동사] : \"벽을 꾸미는 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이유를 나타내는 접속사 because의 부사절\u003c/span> : [주절] + because + [주어 + 동사 ~] : \"왜냐하면 그것은 넓은 공간이기 때문이다\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"Decorating the walls, 벽을 꾸미는 것은. is hard, 어렵다. because it is a big space, 왜냐하면 그것은 넓은 공간이기 때문이다. 이 문장 전체를 해석하면, 공간이 넓기 때문에 벽을 꾸미는 것은 어렵 다.","hl":"m"},{"n":40,"text":"이 문장은 벽을 꾸미는 일이 왜 어려운지 그 이유를 대고 있어요. 핵심은 공간이 넓다는 점이죠. 여기서 it은 넓은 벽, 즉 꾸며야 할 공간을 가리킨다는 것도 꼭 기억해 두세요.","hl":"mn"},{"n":41,"text":"먼저 Decorating the walls를 보세요. 동사 decorate가 주어 자리에 오면서 동명사가 된 형태예요. 동명사구는 단수로 취급하기 때문에 뒤에 is가 온다는 점, 꼭 챙겨 두세요. 두 번째로 because it is a big space는 이유를 붙여 주는 부사절이에요. because 뒤에는 주어와 동사가 다 들어 있는 완전한 절이 온다는 것도 함께 정리해 두면 좋아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 몇몇 시계나 창문이 있다면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">If \u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">some \u003c/span>\u003cspan class=\"tgt\">clocks \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">windows \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\"> 를 하나로 묶어 가리키는 지시대명사예요. 그래서 단수로 취급해서 is가 온다는 점을 기억하세요. 두 번째로 the secret of department stores에서 of는 앞의 the secret과 뒤의 department stores를 이어 주면서 소유 관계를 만드는 전치사예요. 해석할 때는 뒤에서 앞으로 올라오면 훨씬 자연스러워요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러니,\u003c/span>\u003cspan class=\"en\">So,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다음번에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">next \u003c/span>\u003cspan class=\"tgt\">time \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 방문할\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">visit\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">백화점을\u003c/span>\u003cspan class=\"en\">a department store,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">주의 깊게 둘러보세요.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">look \u003c/span>\u003cspan class=\"tgt\">around \u003c/span>\u003cspan class=\"tgt\">carefully\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러니 다음번에 백화점을 방문하면, 주변을 잘 둘러보라.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글의 결론으로, 독자에게 다음에 백화점에 갈 때 \u003cb class=\"key\">주변을 \u003c/b>\u003cb class=\"key\">잘 \u003c/b>\u003cb class=\"key\">살펴보라\u003c/b>고 권하는 조언입니다. 앞에서 설명한 \u003cb class=\"key\">비밀 \u003c/b>\u003cb class=\"key\">마케팅\u003c/b>이 실제로 보이는지 확인해 보라는 의도가 담겨 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간 부사절을 이끄는 the next time\u003c/span> : the next time + [주어] + [동사] ~ : \"당신이 방문할 다음번에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명령문(동사원형 + 부사)\u003c/span> : [동사원형] + [목적어/부사] ~ : \"주의 깊게 둘러보세요\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"So, 그러니. the next time, 다음번에. you visit, 당신이 방문할. a department store, 백화점을. look around carefully, 주의 깊게 둘러보세요.. 이 문장 전체를 해석하면, 그러니 다음번에 백화점을 방문하면, 주변을 잘 둘러보라.","hl":"m"},{"n":49,"text":"이 문장은 글의 결론이에요. 다음에 백화점에 가면 주변을 잘 살펴보라고 권하면서, 앞에서 말한 비밀 마케팅이 실제로 보이는지 확인해 보라는 뜻이죠.","hl":"mn"},{"n":50,"text":"먼저 the next time you visit은 시간 부사절로, 당신이 방문할 다음번에라는 시점을 만들어 줘요. 두 번째로 look around carefully는 주어가 생략된 명령문이라서 동사원형 look으로 시작하고, carefully가 방법을 나타냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 백화점은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Does \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">store \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가지고 있는가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">have\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">창문, 시계, 또는 광고를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">windows, \u003c/span>\u003cspan class=\"tgt\">clocks, \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">advertisements\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 벽에?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">its \u003c/span>\u003cspan class=\"tgt\">walls\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">백화점 벽에 창문, 시계, 또는 광고가 있는가?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글의 마지막 \u003cb class=\"key\">의문문\u003c/b>으로, 독자에게 백화점 벽에 창문이나 시계, 광고가 있는지 직접 확인해 보라고 \u003cb class=\"key\">질문\u003c/b>하는 문장입니다. 앞에서 설명한 백화점의 비밀을 독자가 스스로 관찰하도록 이끌며 글을 마무리해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">일반동사 의문문의 도치(do/does)\u003c/span> : Does + [주어] + [동사원형] ~? : \"그 백화점은 ~을 가지고 있는가?\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">병렬 구조(A, B, or C)\u003c/span> : [명사 A], [명사 B], or [명사 C] : \"창문, 시계, 또는 광고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사구의 수식과 소유격 its\u003c/span> : [전치사] + [소유격] + [명사] : \"그 벽에\"\u003c/div>\u003c/div>","segs":[{"n":51,"text":"Does the store, 그 백화점은. have, 가지고 있는가. windows, clocks, or advertisements, 창문, 시계, 또는 광고를. on its walls?, 그 벽에?. 이 문장 전체를 해석하면, 백화점 벽에 창문, 시계, 또는 광고가 있는가?","hl":"m"},{"n":52,"text":"이 문장은 글의 마지막 의문문이에요. 백화점 벽에 창문이나 시계, 광고가 있는지 직접 확인해 보라고 질문하면서, 앞에서 설명한 백화점의 비밀을 독자가 스스로 관찰하도록 이끌어요.","hl":"mn"},{"n":53,"text":"먼저 Does the store have는 일반동사 의문문이라서 조동사 Does를 앞에 두고 본동사를 동사원형 have로 쓴 형태예요. 두 번째로 windows, clocks, or advertisements는 세 명사가 or로 이어진 병렬 구조입니다. 세 번째로 on its walls는 위치를 나타내는 전치사구이고, its는 앞의 the store를 받는 소유격이에요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>백화점에는 대부분 \u003cb class=\"key\">창문\u003c/b>과 \u003cb class=\"key\">시계\u003c/b>가 없으며, 사람들은 그 사실을 쉽게 떠올리지 못한다.\u003c/li>\u003cli>그 이유는 창문과 시계가 고객에게 \u003cb class=\"key\">시간\u003c/b>을 생각하게 만들어 쇼핑에 방해가 되기 때문이다.\u003c/li>\u003cli>백화점은 고객이 시간을 잊고 \u003cb class=\"key\">쇼핑\u003c/b>에 집중하도록 하고, 넓은 \u003cb class=\"key\">벽\u003c/b>을 장식과 광고에 활용하려는 \u003cb class=\"key\">마케팅 \u003c/b>\u003cb class=\"key\">기술\u003c/b>을 쓴다.\u003c/li>\u003cli>다음에 백화점을 방문하면 벽에 창문, 시계, 또는 \u003cb class=\"key\">광고\u003c/b>가 있는지 \u003cb class=\"key\">둘러보\u003c/b>며 이 비밀을 확인해 볼 수 있다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Department stores intentionally omit windows and clocks to keep customers from thinking about time and to use their walls for advertisements, helping them focus on shopping.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">백화점은 \u003cb class=\"key\">창문\u003c/b>과 \u003cb class=\"key\">시계\u003c/b>가 고객에게 시간을 생각하게 해 쇼핑을 방해하므로 일부러 설치하지 않고, 넓은 \u003cb class=\"key\">벽\u003c/b>을 장식과 광고에 활용하는 비밀스러운 \u003cb class=\"key\">마케팅 \u003c/b>\u003cb class=\"key\">기술\u003c/b>을 쓴다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":54,"text":"정리해 볼게요. 백화점은 창문과 시계를 없애 고객이 시간을 잊고 쇼핑에 집중하도록 만들고, 넓은 벽은 장식과 광고에 활용합니다. 이런 환경 설계가 바로 백화점의 비밀 마케팅 기술이에요. 다음에 백화점에 가면 벽과 시계의 유무를 한번 잘 둘러보면서 이 글의 내용을 떠올려 보세요. 오늘도 수고했고, 다음 강의에서 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
