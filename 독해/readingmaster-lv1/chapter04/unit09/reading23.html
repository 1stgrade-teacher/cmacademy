<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터1 Reading 23 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터1 Reading 23","audioDir":"reading23_audio","preview":false,"count":55,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.668em\">Reading\u003cbr>23\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터1\u003c/div>\u003ch1>Reading: The Best Way to Reduce Stress\u003c/h1>\u003ch2>독서: 스트레스를 줄이는 가장 좋은 방법\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>요약: 독서는 음악 듣기나 산책 같은 다른 활동보다 \u003cb class=\"key\">스트레스\u003c/b>를 훨씬 더 효과적으로 줄여 주며, 혈압과 심장 박동 수를 낮춰 \u003cb class=\"key\">이완\u003c/b>까지 돕는다. 게다가 장소의 제약이 없고 비용도 적게 들기 때문에, \u003cb class=\"key\">휴대폰\u003c/b> 대신 책장을 펼쳐 보라고 권한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Reading is a highly effective way to reduce stress and relax, so it is worth opening the pages of a book instead of a cell phone.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 독서의 이점에 관한 지문을 함께 읽어 볼 거예요. 이 글은 독서가 스트레스를 얼마나 효과적으로 줄여 주는지, 그리고 우리 몸에 어떤 좋은 변화를 주는지 알려 주고 있어요. 요지는 독서가 다른 어떤 활동보다 스트레스를 잘 낮춰 주는 훌륭한 방법이라는 것, 그러니 휴대폰 대신 책을 펼쳐 보자는 거예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">스트레스(stress)는 몸과 마음이 압박을 받을 때 나타나는 반응이에요. 이때 몸은 \u003cb class=\"key\">심장 \u003c/b>\u003cb class=\"key\">박동 \u003c/b>\u003cb class=\"key\">수\u003c/b>(heart rate)를 높이고 \u003cb class=\"key\">혈압\u003c/b>(blood pressure)을 올리면서 긴장 상태에 대비하죠. 그런데 조용히 책을 읽으면 몸의 각성 수준이 낮아지면서 이런 반응이 천천히 가라앉아요. 심리학에서는 이렇게 몸이 편안해지는 상태를 \u003cb class=\"key\">이완 \u003c/b>\u003cb class=\"key\">반응\u003c/b>(relaxation response)이라고 불러요. 마치 과열된 휴대폰을 잠시 꺼 두면 다시 차갑게 식는 것과 비슷하죠. 그래서 짧은 독서라도 하루의 \u003cb class=\"key\">스트레스\u003c/b>를 정리하는 데 충분한 도움을 줄 수 있어요.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 조금 쌓아 볼게요. 스트레스는 몸과 마음이 압박을 받을 때 나타나는 반응이에요. 이때 몸은 심장 박동 수를 높이고 혈압을 올리면서 긴장 상태에 대비하죠. 그런데 조용히 책을 읽으면 몸의 각성 수준이 낮아지면서 이런 반응이 천천히 가라앉아요. 심리학에서는 이렇게 몸이 편안해지는 상태를 이완 반응이라고 불러요. 과열된 휴대폰을 잠시 꺼 두면 다시 차갑게 식는 것과 비슷하죠. 그래서 짧은 독서라도 하루의 스트레스를 정리하는 데 충분한 도움을 줄 수 있어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>이점 제시\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>글은 독서에 \u003cb class=\"key\">이점\u003c/b>이 많다는 일반적인 진술로 시작해요. 그중에서도 흥미롭게도 하나의 이점이 \u003cb class=\"key\">스트레스\u003c/b>를 줄여 준다는 점이라고 화제를 좁혀요. 이렇게 첫 문장에서 큰 주제를 던지고 두 번째 문장에서 방향을 구체화하는 방식이 \u003cb class=\"key\">도입\u003c/b>부에서 독자의 시선을 붙잡아요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>연구 근거\u003csmall>근거 · 문장 3–6\u003c/small>\u003c/h4>\u003cp>몇몇 연구들은 독서가 \u003cb class=\"key\">스트레스 \u003c/b>\u003cb class=\"key\">수준\u003c/b>을 68퍼센트까지 낮추는 좋은 방법이라는 것을 알아냈어요. 그리고 그 효과를 음악 듣기, 차 마시기, 산책하기, 비디오 게임하기와 차례로 \u003cb class=\"key\">비교\u003c/b>하며 숫자로 증명해요. 비교 대상이 뒤로 갈수록 효과가 작아진다는 점이 \u003cb class=\"key\">독서\u003c/b>의 우수성을 분명하게 보여 줘요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>신체 효과\u003csmall>근거 · 문장 7–10\u003c/small>\u003c/h4>\u003cp>또 다른 연구는 단 30분의 독서만으로도 \u003cb class=\"key\">혈압\u003c/b>을 낮출 수 있음을 보여 주었어요. 이어서 독서가 \u003cb class=\"key\">심장 \u003c/b>\u003cb class=\"key\">박동 \u003c/b>\u003cb class=\"key\">수\u003c/b>를 낮출 수 있다고 말해요. 그러면 걱정이나 \u003cb class=\"key\">긴장\u003c/b>이 사라질 수 있고 마침내 마음이 편안해진다고 정리해요. 신체 변화에서 심리 변화로 넘어가는 자연스러운 \u003cb class=\"key\">인과\u003c/b> 흐름이에요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>실용적 장점\u003csmall>예시 · 문장 11–12\u003c/small>\u003c/h4>\u003cp>게다가 독서는 집에서, 공원에서, 도서관에서, 어디에서나 즐길 수 있다는 \u003cb class=\"key\">장소\u003c/b>의 자유를 강조해요. 그리고 책은 그렇게 \u003cb class=\"key\">비싸지 \u003c/b>\u003cb class=\"key\">않다\u003c/b>는 점을 덧붙여 비용 부담도 적다고 말해요. 앞의 실험적 근거에 일상적인 \u003cb class=\"key\">편리함\u003c/b>을 더해 설득력을 높이는 부분이에요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>결론과 주장\u003csmall>주장 · 문장 13–14\u003c/small>\u003c/h4>\u003cp>그래서 글은 휴대폰에서 \u003cb class=\"key\">멀어지자\u003c/b>고 제안해요. 그리고 대신에 책장을 펼쳐 보는 게 어떻겠냐고 \u003cb class=\"key\">질문\u003c/b> 형태로 권하며 끝을 맺어요. 근거를 차곡차곡 쌓아 올린 뒤 마지막에 행동을 촉구하는 \u003cb class=\"key\">주장\u003c/b>으로 마무리하는 구조예요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 다섯 단계로 나누어 살펴볼게요.","hl":null},{"n":4,"text":"먼저 글은 독서에 이점이 많다는 이야기로 문을 열어요. 그런데 흥미롭게도 그 이점 중 하나가 바로 스트레스를 줄여 준다는 점이라고 말하죠. 이렇게 첫 문장에서 큰 주제를 던지고 두 번째 문장에서 방향을 좁혀 주면, 우리가 무엇에 집중하며 읽어야 하는지가 아주 분명해져요.","hl":"f0"},{"n":5,"text":"그다음은 연구 결과가 나와요. 몇몇 연구들은 독서가 스트레스 수준을 예순여덟 퍼센트까지 낮추는 좋은 방법이라는 것을 알아냈대요. 그리고 음악 듣기, 차 마시기, 산책하기, 비디오 게임하기와 차례로 비교하면서 숫자로 증명해 주죠. 비교 대상이 뒤로 갈수록 효과가 작아진다는 점이 독서의 우수성을 아주 선명하게 보여 줘요.","hl":"f1"},{"n":6,"text":"이제 시선이 몸으로 옮겨 가요. 또 다른 연구는 단 삼십 분의 독서만으로도 혈압을 낮출 수 있음을 보여 주었어요. 이어서 독서가 심장 박동 수를 낮출 수 있다고 말하고, 그러면 걱정이나 긴장이 사라질 수 있고 마침내 마음이 편안해진다고 정리하죠. 몸의 변화에서 마음의 변화로 넘어가는 아주 자연스러운 인과 흐름이에요.","hl":"f2"},{"n":7,"text":"다음은 실용적인 장점이에요. 게다가 독서는 집에서, 공원에서, 도서관에서, 어디에서나 즐길 수 있다는 장소의 자유를 강조해요. 그리고 책은 그렇게 비싸지 않다는 점도 덧붙이죠. 앞에서 쌓은 연구 결과에 편리함까지 더해 주니, 독서를 하지 않을 이유가 없어 보이죠.","hl":"f3"},{"n":8,"text":"마지막은 결론이에요. 그래서 휴대폰에서 멀어지자고 제안하고, 대신에 책장을 펼쳐 보는 게 어떻겠냐고 질문 형태로 권하며 글을 닫아요. 근거를 차곡차곡 쌓아 올린 다음 마지막에 행동을 촉구하는 주장으로 마무리하는 아주 깔끔한 구조예요.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 첫 문장에서 독서의 이점, 특히 스트레스 감소라는 \u003cb class=\"key\">주제\u003c/b>를 먼저 제시하고 뒤에서 연구 결과로 이를 뒷받침하는 \u003cb class=\"key\">두괄식\u003c/b> 전개를 보여요. 전개 방식은 \u003cb class=\"key\">주장-근거\u003c/b>로, 주장을 먼저 던진 뒤 수치와 연구 사례로 근거를 쌓아요. 신체적 효과와 실용적 장점까지 근거를 확장한 다음, 마지막에 \u003cb class=\"key\">행동 \u003c/b>\u003cb class=\"key\">촉구\u003c/b>로 글을 닫아요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Interestingly (2)\u003c/b>\u003cspan>화제 전환·주제 제시\u003c/span>\u003cb>Some studies found (3)\u003c/b>\u003cspan>연구 근거 제시\u003c/span>\u003cb>Another study showed (7)\u003c/b>\u003cspan>추가 근거 제시\u003c/span>\u003cb>Then (9)\u003c/b>\u003cspan>결과·인과\u003c/span>\u003cb>Finally (10)\u003c/b>\u003cspan>결과 마무리\u003c/span>\u003cb>Besides (11)\u003c/b>\u003cspan>내용 추가\u003c/span>\u003cb>Also (12)\u003c/b>\u003cspan>내용 추가\u003c/span>\u003cb>So (13)\u003c/b>\u003cspan>결론·주장\u003c/span>\u003cb>Why not (14)\u003c/b>\u003cspan>권유·행동 촉구\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">benefits\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">reduce stress\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">lower stress levels\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">more effective\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">lower blood pressure\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">slow down heart rate\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">relaxed\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>독서\u003c/th>\u003cth>다른 활동들\u003c/th>\u003c/tr>\u003ctr>\u003ctd>스트레스 68퍼센트 감소\u003c/td>\u003ctd>음악 61, 차 54, 산책 42, 게임 21퍼센트\u003c/td>\u003c/tr>\u003ctr>\u003ctd>30분으로 혈압과 심장 박동 수 낮춤\u003c/td>\u003ctd>제시되지 않음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>어디서나 가능하고 비용 부담 적음\u003c/td>\u003ctd>장소와 비용의 제약 있음\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글은 첫 문장에서 독서의 이점, 특히 스트레스 감소라는 주제를 먼저 던지고 뒤에서 연구 결과로 이를 뒷받침하는 두괄식 구조예요. 전개 방식을 보면 주장을 먼저 제시하고 근거를 쌓아 가는 주장과 근거의 방식이고요. 그래서 첫 문장만 제대로 잡아도 글의 절반은 이해한 셈이에요.","hl":"ty"},{"n":10,"text":"신호어를 하나씩 짚어 볼게요. Interestingly가 나오면 화제를 좁히면서 주제를 제시한다는 신호이고, Some studies found와 Another study showed는 연구 근거를 붙인다는 표시예요. Then과 Finally는 결과가 이어진다는 흐름을, Besides와 Also는 내용을 하나 더 추가한다는 신호죠. 그리고 마지막의 So와 Why not은 결론과 행동 촉구를 알려 주는 결정적인 신호예요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>benefit\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이점, 혜택\u003c/span>\u003c/div>\u003cdiv>\u003cb>interestingly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>흥미롭게도\u003c/span>\u003c/div>\u003cdiv>\u003cb>reduce\u003c/b>\u003cem>동사\u003c/em>\u003cspan>줄이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>stress\u003c/b>\u003cem>명사\u003c/em>\u003cspan>스트레스, 긴장\u003c/span>\u003c/div>\u003cdiv>\u003cb>study\u003c/b>\u003cem>명사\u003c/em>\u003cspan>연구\u003c/span>\u003c/div>\u003cdiv>\u003cb>found\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(find의 과거) 알아냈다, 발견했다\u003c/span>\u003c/div>\u003cdiv>\u003cb>great\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>좋은, 훌륭한\u003c/span>\u003c/div>\u003cdiv>\u003cb>way\u003c/b>\u003cem>명사\u003c/em>\u003cspan>방법\u003c/span>\u003c/div>\u003cdiv>\u003cb>level\u003c/b>\u003cem>명사\u003c/em>\u003cspan>수준\u003c/span>\u003c/div>\u003cdiv>\u003cb>lower\u003c/b>\u003cem>동사\u003c/em>\u003cspan>낮추다\u003c/span>\u003c/div>\u003cdiv>\u003cb>effective\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>효과적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>listen\u003c/b>\u003cem>동사\u003c/em>\u003cspan>듣다\u003c/span>\u003c/div>\u003cdiv>\u003cb>go for a walk\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>산책하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>far\u003c/b>\u003cem>부사\u003c/em>\u003cspan>훨씬\u003c/span>\u003c/div>\u003cdiv>\u003cb>video game\u003c/b>\u003cem>명사\u003c/em>\u003cspan>비디오 게임\u003c/span>\u003c/div>\u003cdiv>\u003cb>show\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보여 주다\u003c/span>\u003c/div>\u003cdiv>\u003cb>blood pressure\u003c/b>\u003cem>명사\u003c/em>\u003cspan>혈압\u003c/span>\u003c/div>\u003cdiv>\u003cb>slow down\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>늦추다, 낮추다\u003c/span>\u003c/div>\u003cdiv>\u003cb>heart rate\u003c/b>\u003cem>명사\u003c/em>\u003cspan>심장 박동 수\u003c/span>\u003c/div>\u003cdiv>\u003cb>worry\u003c/b>\u003cem>명사\u003c/em>\u003cspan>걱정\u003c/span>\u003c/div>\u003cdiv>\u003cb>tension\u003c/b>\u003cem>명사\u003c/em>\u003cspan>긴장\u003c/span>\u003c/div>\u003cdiv>\u003cb>go away\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>사라지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>finally\u003c/b>\u003cem>부사\u003c/em>\u003cspan>마침내\u003c/span>\u003c/div>\u003cdiv>\u003cb>relaxed\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>마음이 편안한\u003c/span>\u003c/div>\u003cdiv>\u003cb>besides\u003c/b>\u003cem>부사\u003c/em>\u003cspan>게다가\u003c/span>\u003c/div>\u003cdiv>\u003cb>anywhere\u003c/b>\u003cem>부사\u003c/em>\u003cspan>어디에서나\u003c/span>\u003c/div>\u003cdiv>\u003cb>cost\u003c/b>\u003cem>동사\u003c/em>\u003cspan>비용이 들다\u003c/span>\u003c/div>\u003cdiv>\u003cb>step away from\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에서 멀어지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>instead\u003c/b>\u003cem>부사\u003c/em>\u003cspan>대신에\u003c/span>\u003c/div>\u003cdiv>\u003cb>open\u003c/b>\u003cem>동사\u003c/em>\u003cspan>펼치다, 열다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"단어도 몇 개 짚어 볼게요. lower는 낮추다, slow down은 속도를 늦추다는 뜻이고, effective는 효과적인이라는 형용사예요. step away from은 어디에서 멀어지다라는 숙어이니 꼭 통째로 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">benefit\u003c/b>\u003cspan class=\"m\">이점\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">advantage\u003c/span>\u003cspan class=\"s\">merit\u003c/span>\u003cspan class=\"s\">profit\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">drawback\u003c/span>\u003cspan class=\"a\">disadvantage\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">reduce\u003c/b>\u003cspan class=\"m\">줄이다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">decrease\u003c/span>\u003cspan class=\"s\">lower\u003c/span>\u003cspan class=\"s\">cut\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">increase\u003c/span>\u003cspan class=\"a\">raise\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">effective\u003c/b>\u003cspan class=\"m\">효과적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">useful\u003c/span>\u003cspan class=\"s\">powerful\u003c/span>\u003cspan class=\"s\">successful\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ineffective\u003c/span>\u003cspan class=\"a\">useless\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">lower\u003c/b>\u003cspan class=\"m\">낮추다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">decrease\u003c/span>\u003cspan class=\"s\">reduce\u003c/span>\u003cspan class=\"s\">drop\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">raise\u003c/span>\u003cspan class=\"a\">increase\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">tension\u003c/b>\u003cspan class=\"m\">긴장\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">stress\u003c/span>\u003cspan class=\"s\">anxiety\u003c/span>\u003cspan class=\"s\">strain\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">relaxation\u003c/span>\u003cspan class=\"a\">calm\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">relaxed\u003c/b>\u003cspan class=\"m\">편안한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">calm\u003c/span>\u003cspan class=\"s\">comfortable\u003c/span>\u003cspan class=\"s\">peaceful\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">tense\u003c/span>\u003cspan class=\"a\">nervous\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">go away\u003c/b>\u003cspan class=\"m\">사라지다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">disappear\u003c/span>\u003cspan class=\"s\">vanish\u003c/span>\u003cspan class=\"s\">fade\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">appear\u003c/span>\u003cspan class=\"a\">remain\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"이제 비슷한 말과 반대말로 어휘를 넓혀 볼게요. reduce는 decrease, lower와 같은 뜻이고 반대말은 increase, raise예요. benefit은 advantage, merit와 비슷하고 반대는 drawback, disadvantage죠. tension은 stress, anxiety와 통하고 반대는 relaxation, calm이에요. relaxed의 반대는 tense나 nervous이고, go away는 disappear, vanish와 같고 반대는 appear, remain이에요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">독서하는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Reading \u003c/span>\u003cspan class=\"tgt\">books\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가지고 있다\u003c/span>\u003cspan class=\"en\">has\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 이점을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">many \u003c/span>\u003cspan class=\"tgt\">benefits\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">독서에는 많은 이점이 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 독서의 여러 이점 중 \u003cb class=\"key\">스트레스 \u003c/b>\u003cb class=\"key\">감소\u003c/b>를 소개할 것을 예고하는 도입 문장이에요. \u003cb class=\"key\">동명사\u003c/b> Reading books가 주어이고 has는 '가지다'라는 뜻의 \u003cb class=\"key\">타동사\u003c/b>라서 뒤에 many benefits가 목적어로 와요. 글 전체의 주제를 여는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사구 주어\u003c/span> : [[동명사]] (+목적어) + 단수 [[동사]] : \"독서하는 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수량형용사 many + 복수명사\u003c/span> : many + [[가산 복수명사]] : \"많은 이점들을\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"Reading books, 독서하는 것은. has, 가지고 있다. many benefits, 많은 이점을. 이 문장 전체를 해석하면, 독서에는 많은 이점이 있다.","hl":"m"},{"n":14,"text":"이 문장은 글 전체의 방향을 잡아 주는 문장이에요. 독서에 많은 이점이 있다고 말해 놓고, 바로 다음에 그중 하나로 스트레스 감소를 꺼내죠. Reading books는 동명사 주어이고 has는 타동사라서 뒤에 목적어가 온다는 점도 같이 기억해 두세요.","hl":"mn"},{"n":15,"text":"먼저 Reading books를 보세요. 책을 읽는 것이라는 동명사구가 통째로 주어가 된 형태예요. 동명사구 주어는 하나의 행위로 보기 때문에 뒤에 단수 동사를 써야 하고, 그래서 has가 온 거죠. 그리고 many benefits에서는 benefit이 가산명사라서 many를 쓰고 복수형 benefits로 받은 점까지 정리해 두면 좋아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">흥미롭게도,\u003c/span>\u003cspan class=\"en\">Interestingly,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그중 하나는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">them\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">스트레스를 줄이는 것\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">reduce \u003c/span>\u003cspan class=\"tgt\">stress\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">흥미롭게도 그중 하나는 스트레스를 줄여 준다는 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 이점이 많다고 했으니, 그중 하나를 콕 집어 주는 문장이에요. one of them이라는 \u003cb class=\"key\">부분 \u003c/b>\u003cb class=\"key\">표현\u003c/b>으로 여러 개 가운데 하나를 가리키고, is 뒤의 to부정사가 \u003cb class=\"key\">주격 \u003c/b>\u003cb class=\"key\">보어\u003c/b> 자리를 채워요. '줄여 준다는 것이다'로 해석되는 이유가 바로 \u003cb class=\"key\">to부정사\u003c/b>의 \u003cb class=\"key\">명사적 \u003c/b>\u003cb class=\"key\">용법\u003c/b> 때문이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">one of + 복수대명사(부분 표현)\u003c/span> : one of + [[복수명사]]/[[복수대명사]] : \"그중 하나는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(주격 보어)\u003c/span> : [[주어]] + be동사 + [[to부정사]] (~하는 것이다) : \"스트레스를 줄이는 것이다\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"Interestingly, 흥미롭게도. one of them, 그중 하나는. is, 이다. to reduce stress, 스트레스를 줄이는 것. 이 문장 전체를 해석하면, 흥미롭게도 그중 하나는 스트레스를 줄여 준다는 것이다.","hl":"m"},{"n":17,"text":"앞에서 이점이 많다고 했으니, 이 문장은 그중 하나를 콕 집어 주는 역할을 해요. one of them으로 여러 개 가운데 하나를 가리키고, is 뒤에 to부정사가 와서 주격 보어 자리를 채우고 있죠. 그래서 '스트레스를 줄이는 것이다'라고 해석이 되는 거예요.","hl":"mn"},{"n":18,"text":"첫 번째로 one of them을 볼게요. 이건 여러 개 중에 하나를 집는 부분 표현이에요. of 뒤에는 복수명사나 복수대명사가 와야 하고, 동사는 one에 끌려서 단수로 맞춰 준다는 것도 같이 기억해 주세요. 두 번째로 is to reduce stress는 be동사 뒤에 to부정사가 온 형태인데, 이때 to부정사가 주격 보어 자리에서 명사적 용법으로 쓰여서 '줄이는 것이다'라고 해석돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몇몇 연구들은\u003c/span>\u003cspan class=\"en\">Some studies\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">알아냈다\u003c/span>\u003cspan class=\"en\">found\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">독서가 좋은 방법이라는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">reading \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">great \u003c/span>\u003cspan class=\"tgt\">way \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">스트레스 수준을 줄이는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">reduce \u003c/span>\u003cspan class=\"tgt\">stress \u003c/span>\u003cspan class=\"tgt\">levels\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들을 68퍼센트 낮추면서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">lowering \u003c/span>\u003cspan class=\"tgt\">them \u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">68%\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">몇몇 연구들은 독서가 스트레스 수준을 68퍼센트까지 줄이는 좋은 방법이라는 것을 알아냈다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 독서가 스트레스를 낮춘다는 주장을 연구 결과로 뒷받침하는 문장이에요. found 뒤에 that절이 통째로 \u003cb class=\"key\">목적어\u003c/b>로 와서 '~라는 것을 알아냈다'가 되고, 뒤에 붙은 lowering은 \u003cb class=\"key\">분사구문\u003c/b>으로 \u003cb class=\"key\">결과\u003c/b>의 의미를 더해요. 구체적인 수치가 들어 있어 서술형으로 출제되기 좋은 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that의 목적어절\u003c/span> : find + [[that절]](목적어) : \"독서가 좋은 방법이라는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법(명사 수식)\u003c/span> : [[명사]] + to부정사 (~하는/~할 명사) : \"스트레스 수준을 줄이는 좋은 방법\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">분사구문(결과)\u003c/span> : [[주절]] + , + -ing (~하면서, 그 결과 ~) : \"그것들을 68퍼센트 낮추면서\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"Some studies, 몇몇 연구들은. found, 알아냈다. that reading is a great way, 독서가 좋은 방법이라는 것을. to reduce stress levels, 스트레스 수준을 줄이는. lowering them by 68%, 그것들을 68퍼센트 낮추면서. 이 문장 전체를 해석하면, 몇몇 연구들은 독서가 스트레스 수준을 68퍼센트까지 줄이는 좋은 방법이라는 것을 알아냈다.","hl":"m"},{"n":20,"text":"이 문장은 독서가 스트레스를 낮춘다는 걸 연구 결과로 뒷받침해 줘요. found 뒤에 that절이 통째로 목적어로 와서 '~라는 것을 알아냈다'가 되고, 뒤에 붙은 lowering은 분사구문으로 결과의 의미를 더합니다. 숫자가 들어 있어서 서술형에 쓰기 좋은 문장이니 구조를 꼭 익혀 두세요.","hl":"mn"},{"n":21,"text":"첫 번째로 found 뒤의 that을 보세요. that이 이끄는 절이 통째로 목적어가 되는 구조라서 '~라는 것을 알아냈다'로 해석해요. that은 접속사이고, 절 안에 reading과 is가 들어 있다는 것도 확인해 주세요. 두 번째로 a great way to reduce stress levels에서 to부정사는 way를 뒤에서 꾸며 주는 형용사적 용법이에요. 명사를 뒤에서 수식한다는 느낌으로 '~하는 방법'이라고 붙여 읽으면 돼요. 마지막으로 lowering them by 68%는 분사구문인데, 앞 내용에 이어서 결과의 의미를 더해 줘요. them이 앞에 나온 stress levels를 가리킨다는 점도 꼭 챙기세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 ~이다\u003c/span>\u003cspan class=\"en\">It is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 효과적이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">effective\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">음악을 듣는 것보다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">listening \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">music\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">(61퍼센트).\u003c/span>\u003cspan class=\"en\">(61%).\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 음악을 듣는 것(61퍼센트)보다 더 효과적이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 독서가 스트레스를 줄이는 데 음악 듣기보다 더 효과적임을 \u003cb class=\"key\">비교\u003c/b>를 통해 보여 줍니다. 뒤에 붙은 수치는 음악 듣기의 효과 정도를 제시해 독서의 \u003cb class=\"key\">스트레스 \u003c/b>\u003cb class=\"key\">감소\u003c/b> 효과를 더 분명하게 뒷받침합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">비교급(more + 형용사)\u003c/span> : [more + 형용사] + than ... : \"더 효과적인\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">비교 대상의 동명사구\u003c/span> : [than + 동명사구] : \"음악을 듣는 것보다\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"It is, 그것은 ~이다. more effective, 더 효과적이다. than listening to music, 음악을 듣는 것보다. (61%), (61퍼센트).. 이 문장 전체를 해석하면, 그것은 음악을 듣는 것(61퍼센트)보다 더 효과적이다.","hl":"m"},{"n":23,"text":"이 문장은 독서가 스트레스를 줄이는 데 음악 듣기보다 더 효과적이라는 점을 비교해서 보여 줘요. 뒤에 붙은 수치는 음악 듣기의 효과 정도를 나타내서 독서의 스트레스 감소 효과를 더 분명하게 뒷받침해 줍니다.","hl":"mn"},{"n":24,"text":"첫 번째로, more effective는 형용사 effective에 more를 붙인 비교급이에요. 그래서 더 효과적이라는 뜻이 되고, 뒤의 than과 짝을 이뤄 비교 표현을 만들어요. 두 번째로, than listening to music에서 listening은 전치사 than 뒤에 온 동명사로 음악을 듣는 행위 자체를 가리켜요. 이렇게 비교 대상은 동명사구로 받아 준다는 점을 기억해 주세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은\u003c/span>\u003cspan class=\"en\">It is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또한\u003c/span>\u003cspan class=\"en\">also\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 효과적이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">effective\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">차를 마시는 것(54퍼센트)이나\u003c/span>\u003cspan class=\"en\">than \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">drinking \u003c/span>\u003cspan class=\"tgt\">tea \u003c/span>\u003cspan class=\"tgt\">(54%) \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">산책하는 것(42퍼센트)보다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">going \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">walk \u003c/span>\u003cspan class=\"tgt\">(42%)\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 또한 차를 마시는 것(54퍼센트)이나 산책하는 것(42퍼센트)보다 더 효과적이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 독서가 차를 마시거나 산책하는 것보다도 더 효과적임을 \u003cb class=\"key\">비교\u003c/b>와 \u003cb class=\"key\">병렬\u003c/b>로 보여 줍니다. 각 활동 옆의 수치는 독서의 스트레스 감소 효과와 비교되는 \u003cb class=\"key\">기준\u003c/b>을 제시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">비교급(more + 형용사)\u003c/span> : [more + 형용사 + than ...] : \"더 효과적인\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사구의 병렬\u003c/span> : [동명사구 A + or + 동명사구 B] : \"차를 마시는 것(54퍼센트)이나 산책하는 것(42퍼센트)\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"It is, 그것은. also, 또한. more effective, 더 효과적이다. than drinking tea (54%) or, 차를 마시는 것(54퍼센트)이나. going for a walk (42%), 산책하는 것(42퍼센트)보다. 이 문장 전체를 해석하면, 그것은 또한 차를 마시는 것(54퍼센트)이나 산책하는 것(42퍼센트)보다 더 효과적이다.","hl":"m"},{"n":26,"text":"이 문장은 독서가 차를 마시는 것보다도, 산책하는 것보다도 더 효과적이라는 점을 비교해서 보여 줘요. 차를 마시는 것과 산책하는 것을 or로 병렬로 묶어 두 가지 기준을 한 번에 제시하고, 각각의 수치로 독서의 스트레스 감소 효과를 더 분명하게 보여 줍니다.","hl":"mn"},{"n":27,"text":"첫 번째로, more effective는 형용사 effective에 more를 붙인 비교급이에요. 뒤에 than이 나오면 비교의 기준을 받는다는 표시죠. 두 번째로, drinking tea와 going for a walk는 동명사구인데 or로 병렬되어 있어요. 그래서 차를 마시는 행위와 산책하는 행위를 같은 자격으로 비교 대상에 나란히 세운 표현입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고\u003c/span>\u003cspan class=\"en\">And\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 ~이다\u003c/span>\u003cspan class=\"en\">it is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">훨씬 더 효과적이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">far \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">effective\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">비디오 게임을 하는 것(21퍼센트)보다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">playing \u003c/span>\u003cspan class=\"tgt\">video \u003c/span>\u003cspan class=\"tgt\">games \u003c/span>\u003cspan class=\"tgt\">(21%)\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그리고 그것은 비디오 게임을 하는 것(21퍼센트)보다 훨씬 더 효과적이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 독서가 비디오 게임을 하는 것보다 \u003cb class=\"key\">훨씬\u003c/b> 더 효과적임을 강조하며 앞의 비교를 \u003cb class=\"key\">심화\u003c/b>합니다. 수치는 비디오 게임의 효과가 상대적으로 낮음을 보여 주어 독서의 \u003cb class=\"key\">우수성\u003c/b>을 부각합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">비교급 강조(far)\u003c/span> : [far + 비교급 + than ...] : \"훨씬 더 효과적인\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">비교 대상의 동명사구\u003c/span> : [than + 동명사구] : \"비디오 게임을 하는 것(21퍼센트)보다\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"And, 그리고. it is, 그것은 ~이다. far more effective, 훨씬 더 효과적이다. than playing video games (21%), 비디오 게임을 하는 것(21퍼센트)보다. 이 문장 전체를 해석하면, 그리고 그것은 비디오 게임을 하는 것(21퍼센트)보다 훨씬 더 효과적이다.","hl":"m"},{"n":29,"text":"이 문장은 독서가 비디오 게임을 하는 것보다 훨씬 더 효과적이라는 점을 강조하면서 앞의 비교를 더 심화해 줘요. 뒤에 붙은 수치는 비디오 게임의 효과가 상대적으로 낮다는 것을 보여 주어 독서의 우수성을 한층 부각합니다.","hl":"mn"},{"n":30,"text":"첫 번째로, far more effective에서 far는 비교급 more effective를 강조하는 부사예요. 그래서 훨씬 더 효과적이라는 뜻을 만들어 줍니다. 두 번째로, than playing video games에서 playing은 전치사 than 뒤에 온 동명사로 비디오 게임을 하는 행위 자체를 비교 대상으로 세워요. 비교 대상이 동명사구로 표현된다는 점을 기억해 주세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또 다른 연구는 보여 주었다\u003c/span>\u003cspan class=\"en\">Another study \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">showed \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단지 30분의 독서만으로도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">just \u003c/span>\u003cspan class=\"tgt\">30 \u003c/span>\u003cspan class=\"tgt\">minutes \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">reading\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">혈압을 낮출 수 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">lower\u003c/span> blood pressure.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">또 다른 연구는 30분의 독서만으로도 혈압을 낮출 수 있음을 보여 주었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 독서의 효과를 스트레스 감소에서 \u003cb class=\"key\">신체 \u003c/b>\u003cb class=\"key\">건강\u003c/b>으로 넓혀 주는 문장이에요. \u003cb class=\"key\">또 \u003c/b>\u003cb class=\"key\">다른 \u003c/b>\u003cb class=\"key\">연구\u003c/b>가 단지 30분의 독서만으로도 \u003cb class=\"key\">혈압\u003c/b>을 낮출 수 있다고 말하므로, 독서가 짧은 시간에도 실제 건강에 도움이 된다는 근거가 돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">that절(명사절)을 목적어로 취하는 타동사\u003c/span> : show + [that + 주어 + 동사 ~] (that절/목적어) : \"~라는 것을 보여 주었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 of + 동명사\u003c/span> : [전치사 of] + [동명사 reading] : \"단지 30분의 독서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">조동사 can + 동사원형\u003c/span> : [조동사 can] + [동사원형 lower] : \"낮출 수 있다\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"Another study showed, 또 다른 연구는 보여 주었다. that just 30 minutes of reading, 단지 30분의 독서만으로도. can lower blood pressure, 혈압을 낮출 수 있다. 이 문장 전체를 해석하면, 또 다른 연구는 30분의 독서만으로도 혈압을 낮출 수 있음을 보여 주었다.","hl":"m"},{"n":32,"text":"이 문장은 독서의 효과를 스트레스 감소에서 신체 건강으로 넓혀 주는 문장이에요. 또 다른 연구가 단지 삼십 분의 독서만으로도 혈압을 낮출 수 있다고 말하니까, 독서가 짧은 시간에도 실제 건강에 도움이 된다는 근거가 되는 거죠.","hl":"mn"},{"n":33,"text":"첫 번째로, showed 뒤에는 that절이 와서 연구 결과라는 목적어 역할을 해요. 두 번째로, of 뒤에 reading이라는 동명사가 와서 독서라는 행위를 나타내고, 전체가 전치사구로 쓰였어요. 세 번째로, can은 조동사라서 뒤에 동사원형 lower가 오고, 여기서는 혈압을 낮출 수 있다는 가능성을 표현해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그것은\u003c/span>\u003cspan class=\"en\">And \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">it\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">낮출 수 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">slow \u003c/span>\u003cspan class=\"tgt\">down\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">심장 박동 수를\u003c/span>\u003cspan class=\"en\">heart rate.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그리고 그것은 심장 박동 수를 낮출 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 혈압 감소에 이어 \u003cb class=\"key\">심장 \u003c/b>\u003cb class=\"key\">박동 \u003c/b>\u003cb class=\"key\">수\u003c/b>까지 낮추는 효과를 덧붙여요. 'it'은 독서를 가리키고, 심장 박동 수를 낮춘다는 표현으로 독서의 \u003cb class=\"key\">이완 \u003c/b>\u003cb class=\"key\">효과\u003c/b>를 강조해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">대명사 it의 지시\u003c/span> : [it] + [단수 동사 can] : \"그것은(독서는)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 can + 구동사 slow down\u003c/span> : [조동사 can] + [구동사 slow down] : \"낮출 수 있다\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"And it, 그리고 그것은. can slow down, 낮출 수 있다. heart rate, 심장 박동 수를. 이 문장 전체를 해석하면, 그리고 그것은 심장 박동 수를 낮출 수 있다.","hl":"m"},{"n":35,"text":"앞 문장의 혈압 감소에 이어서 심장 박동 수까지 낮추는 효과를 덧붙이는 문장이에요. it은 독서를 가리키고, 심장 박동 수를 낮춘다는 표현으로 독서의 이완 효과를 강조하는 거죠.","hl":"mn"},{"n":36,"text":"첫 번째로, it은 앞 문장의 독서를 가리키는 대명사예요. 두 번째로, slow down은 '낮추다'라는 구동사이고, can 뒤에서 동사원형 역할을 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러면\u003c/span>\u003cspan class=\"en\">Then\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">걱정이나 긴장이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">worries \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">tensions\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사라질 수 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">may \u003c/span>\u003cspan class=\"tgt\">go \u003c/span>\u003cspan class=\"tgt\">away\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러면 걱정이나 긴장이 사라질 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞의 신체적 이완이 정서적 변화로 이어진다는 흐름을 보여 줘요. \u003cb class=\"key\">걱정\u003c/b>이나 \u003cb class=\"key\">긴장\u003c/b>이 \u003cb class=\"key\">사라질 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">있다\u003c/b>고 말하며 독서의 심리적 안정 효과를 마무리해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">or로 연결된 병렬 구조\u003c/span> : [복수명사 A] + or + [복수명사 B] : \"걱정이나 긴장\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 may + 동사원형 / 구동사 go away\u003c/span> : [조동사 may] + [동사원형 go away] : \"사라질 수 있다\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"Then, 그러면. worries or tensions, 걱정이나 긴장이. may go away, 사라질 수 있다. 이 문장 전체를 해석하면, 그러면 걱정이나 긴장이 사라질 수 있다.","hl":"m"},{"n":38,"text":"앞의 신체적 이완이 정서적 변화로 이어진다는 흐름을 보여 주는 문장이에요. 걱정이나 긴장이 사라질 수 있다고 말하면서 독서의 심리적 안정 효과를 마무리하는 거죠.","hl":"mn"},{"n":39,"text":"첫 번째로, worries와 tensions가 or로 연결된 병렬 구조라서 함께 주어 역할을 해요. 두 번째로, may는 가능성을 나타내는 조동사라서 뒤에 동사원형이 오고, go away는 '사라지다'라는 구동사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마침내,\u003c/span>\u003cspan class=\"en\">Finally,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은\u003c/span>\u003cspan class=\"en\">you\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마음이 편안해진다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">become \u003c/span>\u003cspan class=\"tgt\">relaxed\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">마침내 여러분은 마음이 편안해진다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 말한 혈압과 심박수의 변화가 쌓여 마침내 몸과 마음이 \u003cb class=\"key\">이완\u003c/b>된다는 뜻이에요. 스트레스 감소라는 큰 흐름을 \u003cb class=\"key\">마무리\u003c/b>하는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">2형식 동사 become + 형용사(주격보어)\u003c/span> : become + [형용사(주격보어)] : \"편안해진다\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"Finally, 마침내. you, 여러분은. become relaxed, 마음이 편안해진다. 이 문장 전체를 해석하면, 마침내 여러분은 마음이 편안해진다.","hl":"m"},{"n":41,"text":"이 문장은 앞에서 말한 혈압과 심박수의 변화가 쌓여 마침내 몸과 마음이 이완된다는 뜻이에요. 스트레스 감소라는 큰 흐름을 마무리하는 문장으로 봐 주세요.","hl":"mn"},{"n":42,"text":"첫 번째로 become은 주어의 상태 변화를 나타내는 2형식 동사라서 뒤에 주격보어가 필요해요. relaxed는 과거분사가 형용사처럼 쓰여서 주어 you의 상태를 설명합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">게다가,\u003c/span>\u003cspan class=\"en\">Besides,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은 독서를 즐길 수 있다\u003c/span>\u003cspan class=\"en\">you \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">enjoy\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">reading\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어디에서나 ―\u003c/span>\u003cspan class=\"en\">anywhere ―\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">집에서,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">home, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공원에서,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">park, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 도서관에서.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">library\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">게다가 여러분은 집에서, 공원에서, 도서관에서, 어디에서나 독서를 즐길 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 독서가 장소의 제약을 받지 않는 \u003cb class=\"key\">접근성\u003c/b> 높은 활동임을 말해요. 집, 공원, 도서관이라는 구체적 예를 들어 독서의 \u003cb class=\"key\">장점\u003c/b>을 넓혀 주는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 can + 동사원형\u003c/span> : can + [동사원형] : \"즐길 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사(목적어)\u003c/span> : enjoy + [동명사] : \"독서를\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사구의 병렬 구조\u003c/span> : [at + 장소], [at + 장소], and [at + 장소] : \"집에서, 공원에서, 그리고 도서관에서\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"Besides, 게다가. you can enjoy reading, 여러분은 독서를 즐길 수 있다. anywhere ―, 어디에서나 ―. at home, 집에서. at the park, 공원에서. and at the library, 그리고 도서관에서.. 이 문장 전체를 해석하면, 게다가 여러분은 집에서, 공원에서, 도서관에서, 어디에서나 독서를 즐길 수 있다.","hl":"m"},{"n":44,"text":"이 문장은 독서가 장소의 제약을 받지 않는 접근성 높은 활동임을 말해요. 집, 공원, 도서관이라는 구체적인 예를 들어 독서의 장점을 넓혀 주는 문장입니다.","hl":"mn"},{"n":45,"text":"첫 번째로 can은 가능이나 능력을 나타내고 뒤에는 동사원형이 와요. 두 번째로 enjoy는 목적어로 동명사를 취하니까 reading으로 써야 해요. 세 번째로 at home, at the park, and at the library는 같은 형태의 전치사구를 and로 연결한 병렬 구조예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또한,\u003c/span>\u003cspan class=\"en\">Also,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">책은\u003c/span>\u003cspan class=\"en\">books\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">비용이 들지 않는다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">cost\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그렇게 많이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">much\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">또한, 책은 그렇게 비싸지 않다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 독서가 스트레스를 줄이는 것뿐 아니라 \u003cb class=\"key\">경제적\u003c/b> 부담도 크지 않다는 점을 강조해요. 앞 문장의 장소 \u003cb class=\"key\">제약\u003c/b> 없음과 함께 독서의 실용적인 장점을 보태는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">일반동사 현재시제 부정문\u003c/span> : do/does + not + [동사원형] : \"비용이 들지 않는다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지시부사 that + much(정도)\u003c/span> : that + [much/형용사·부사] : \"그렇게 많이\"\u003c/div>\u003c/div>","segs":[{"n":46,"text":"Also, 또한. books, 책은. do not cost, 비용이 들지 않는다. that much, 그렇게 많이. 이 문장 전체를 해석하면, 또한, 책은 그렇게 비싸지 않다.","hl":"m"},{"n":47,"text":"이 문장은 독서가 스트레스를 줄이는 것뿐 아니라 경제적 부담도 크지 않다는 점을 강조해요. 앞 문장의 장소 제약 없음과 함께 독서의 실용적인 장점을 보태는 문장입니다.","hl":"mn"},{"n":48,"text":"첫 번째로 일반동사 cost의 부정문이라서 do not 뒤에 동사원형 cost가 와요. 두 번째로 that은 여기서 '그렇게'라는 뜻의 부사이고 much와 함께 비용의 정도를 수식해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러니\u003c/span>\u003cspan class=\"en\">So\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 ~하자\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">let's \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">휴대폰에서 멀어지다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">step \u003c/span>\u003cspan class=\"tgt\">away\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">cell \u003c/span>\u003cspan class=\"tgt\">phones\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러니 휴대폰에서 멀어지도록 하자.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글의 마지막에서 독자에게 \u003cb class=\"key\">휴대폰\u003c/b>에서 벗어나라고 권하는 문장이에요. 앞에서 읽기의 여러 장점을 말했으니, 이제 실천으로 옮기자는 \u003cb class=\"key\">제안\u003c/b>으로 글을 맺고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">제안 표현 let's + 동사원형\u003c/span> : Let's + [동사원형] ~ : \"~하자\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 from + 명사\u003c/span> : [동사] + from + [명사] : \"휴대폰으로부터\"\u003c/div>\u003c/div>","segs":[{"n":49,"text":"So, 그러니. let's, 우리 ~하자. step away from cell phones, 휴대폰에서 멀어지다. 이 문장 전체를 해석하면, 그러니 휴대폰에서 멀어지도록 하자.","hl":"m"},{"n":50,"text":"이 문장은 글의 마지막에서 독자에게 휴대폰에서 벗어나라고 권하는 말이에요. 앞에서 읽기의 장점을 충분히 말했으니 이제 실천하자는 제안으로 글을 맺는 거죠.","hl":"mn"},{"n":51,"text":"첫 번째로, let's step away에서 let's는 let us의 줄임말이고 제안을 나타내요. 그래서 뒤에는 동사원형인 step away가 오는 거죠. from cell phones는 휴대폰에서 멀어지는 방향을 보여 주는 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜 ~하지 않을까\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Why \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">책장을 펼쳐 보는 게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">open\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">pages \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">book\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대신에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">instead\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">대신에 책장을 펼쳐 보는 게 어떨까?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 휴대폰을 내려놓고 \u003cb class=\"key\">독서\u003c/b>를 시작하라고 권하는 마무리 문장이에요. Why not open은 강한 명령이 아니라 부드러운 \u003cb class=\"key\">권유\u003c/b>를 나타내요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">권유의 Why not + 동사원형\u003c/span> : Why not + [동사원형] ~? : \"~하는 게 어떨까?\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">of 전치사구의 수식\u003c/span> : [the pages] + of + [a book] : \"책의 페이지들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">부사 instead\u003c/span> : [문장] + instead : \"대신에\"\u003c/div>\u003c/div>","segs":[{"n":52,"text":"Why not, 왜 ~하지 않을까. open the pages of a book, 책장을 펼쳐 보는 게. instead?, 대신에. 이 문장 전체를 해석하면, 대신에 책장을 펼쳐 보는 게 어떨까?","hl":"m"},{"n":53,"text":"이 문장은 휴대폰 대신 독서를 시작하라고 부드럽게 권하는 마무리예요. Why not open은 강한 명령이 아니라 권유를 나타내죠.","hl":"mn"},{"n":54,"text":"첫 번째로, Why not open에서 Why not 뒤에는 동사원형 open이 와서 권유의 뜻을 만들어요. 두 번째로, the pages of a book에서 of a book은 앞의 the pages를 뒤에서 꾸며 주며 책장이라는 의미를 완성해요. 마지막으로 instead는 앞에서 말한 휴대폰 대신 독서를 하자는 흐름을 이어 줘요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>독서에는 \u003cb class=\"key\">스트레스\u003c/b>를 줄여 주는 것을 비롯한 많은 이점이 있다.\u003c/li>\u003cli>연구에 따르면 독서는 스트레스 수준을 68퍼센트 낮추어 음악 듣기나 산책, 비디오 게임보다 \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">효과적\u003c/b>이다.\u003c/li>\u003cli>단 30분의 독서만으로도 \u003cb class=\"key\">혈압\u003c/b>과 \u003cb class=\"key\">심장 \u003c/b>\u003cb class=\"key\">박동 \u003c/b>\u003cb class=\"key\">수\u003c/b>가 낮아져 걱정과 긴장이 사라지고 마음이 편안해진다.\u003c/li>\u003cli>독서는 장소의 제약이 없고 비용도 적게 들기 때문에, 휴대폰 대신 \u003cb class=\"key\">책\u003c/b>을 펼치는 것이 좋다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Reading is a highly effective way to reduce stress and relax, so it is worth opening the pages of a book instead of a cell phone.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: 독서는 음악 듣기나 산책 같은 다른 활동보다 \u003cb class=\"key\">스트레스\u003c/b>를 훨씬 더 효과적으로 줄여 주며, 혈압과 심장 박동 수를 낮춰 \u003cb class=\"key\">이완\u003c/b>까지 돕는다. 게다가 장소의 제약이 없고 비용도 적게 들기 때문에, \u003cb class=\"key\">휴대폰\u003c/b> 대신 책장을 펼쳐 보라고 권한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":55,"text":"오늘 글은 독서가 스트레스를 예순여덟 퍼센트나 줄여 주고, 혈압과 심장 박동 수까지 낮춰 준다는 내용이었어요. 게다가 어디서나 즐길 수 있고 값도 비싸지 않으니, 독서만 한 스트레스 해소법이 없죠. 오늘 배운 주장과 근거의 구조를 기억하면서, 잠들기 전에 책 한 장이라도 펼쳐 보면 어떨까요? 그럼 오늘 수업은 여기까지예요, 수고했어요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
