<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터1 Reading 24 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터1 Reading 24","audioDir":"reading24_audio","preview":false,"count":63,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.668em\">Reading\u003cbr>24\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터1\u003c/div>\u003ch1>A Cheaper Cure for a Bedtime Fear\u003c/h1>\u003ch2>침대 공포의 더 싼 해결책\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>한 여성이 침대 위아래에 누군가 있다는 \u003cb class=\"key\">두려움\u003c/b> 때문에 의사를 찾았지만, 비싼 치료 대신 동생의 \u003cb class=\"key\">침대 \u003c/b>\u003cb class=\"key\">다리 \u003c/b>\u003cb class=\"key\">자르기\u003c/b>라는 값싼 해결책으로 문제가 사라졌다는 이야기이다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>A woman solves her bedtime fear with her brother's cheap and simple solution rather than the doctor's expensive treatment.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 침대 위아래에 누군가 있다는 여성의 두려움과, 그 문제를 해결한 뜻밖의 방법을 다룬 짧은 이야기를 함께 읽어 볼게요. 이 글은 비싼 의사의 치료보다 동생의 침대 다리 자르기라는 단순하고 값싼 해결책이 더 효과적이었다는 내용을 담고 있어요. 요지는 값비싼 제안보다 문제의 핵심을 건드리는 간단한 해결책이 더 나을 수 있다는 거죠.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">사람은 실제 위험이 없는데도 특정 상황에서 강한 두려움을 느낄 수 있는데, 이를 \u003cb class=\"key\">공포증\u003c/b> 또는 phobia라고 합니다. 침대 밑에 누군가 있다는 생각이 반복되면 \u003cb class=\"key\">불안\u003c/b>이 커지고 잠들기 어려워질 수 있죠. 전문적인 치료는 인지행동치료처럼 체계적일 수 있지만 시간과 비용이 많이 들 수 있습니다. 그래서 사람들은 \u003cb class=\"key\">비용 \u003c/b>\u003cb class=\"key\">효율성\u003c/b>을 고려해 더 간단한 해결책을 찾기도 합니다. 이는 비싼 헬스장 회원권을 끊기보다 가까운 공원을 매일 걷는 것이 더 현실적이고 꾸준한 경우와 비슷합니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 짚어 볼게요. 침대 밑에 누군가 있다는 생각처럼 실제 위험은 없는데도 두려움이 커지는 상태를 우리는 공포증, 영어로 phobia라고 불러요. 이런 두려움은 불안, 즉 anxiety와 연결되어 잠들기 전 생각이 반복되기 쉽죠. 전문가의 치료는 인지행동치료처럼 체계적일 수 있지만 비용과 시간이 들 수 있어요. 그래서 사람들은 때때로 비용 효율성, 즉 cost effectiveness를 고려해 더 간단한 해결책을 찾기도 합니다. 비싼 헬스장 회원권을 끊기보다 매일 가까운 공원을 걷는 게 더 꾸준하고 현실적인 경우와 비슷하죠.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>침대 밑의 공포\u003csmall>도입·문제 제시 · 문장 1–6\u003c/small>\u003c/h4>\u003cp>한 여성이 의사를 찾아가 침대 주변에서 느끼는 \u003cb class=\"key\">두려움\u003c/b>을 털어놓는다. 침대에 들어가면 밑에 누군가 있는 것 같고, 침대 밑을 보면 위에 누군가 있는 것 같다고 말한다. 위와 아래를 번갈아 확인하는 상황이 반복되어 그녀는 \u003cb class=\"key\">미칠 \u003c/b>\u003cb class=\"key\">것 \u003c/b>\u003cb class=\"key\">같다\u003c/b>고 호소한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>의사의 비싼 제안\u003csmall>제안 · 문장 7–9\u003c/small>\u003c/h4>\u003cp>의사는 세 달 동안 일주일에 한 번 방문하면 문제를 도와주겠다고 \u003cb class=\"key\">제안\u003c/b>한다. 그러나 방문할 때마다 \u003cb class=\"key\">오십 \u003c/b>\u003cb class=\"key\">달러\u003c/b>가 든다고 비용을 밝힌다. 이는 여성의 문제를 전문적으로 다루지만 부담이 큰 \u003cb class=\"key\">비싼 \u003c/b>\u003cb class=\"key\">치료\u003c/b>임을 보여 준다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>거리에서의 재회\u003csmall>전환 · 문장 10–12\u003c/small>\u003c/h4>\u003cp>며칠 후 두 사람은 거리에서 만나고, 의사는 여성이 다시 찾아오지 않은 이유를 묻는다. 여성은 다행히 \u003cb class=\"key\">문제가 \u003c/b>\u003cb class=\"key\">사라졌다\u003c/b>고 말하며 동생이 단돈 십 달러로 도와주었다고 설명한다. 이 대화에서 의사의 예상과 다른 \u003cb class=\"key\">해결 \u003c/b>\u003cb class=\"key\">경로\u003c/b>가 드러난다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>동생의 값싼 해결\u003csmall>반전·결론 · 문장 13–17\u003c/small>\u003c/h4>\u003cp>여성은 동생이 침대 다리를 자르라고 했다고 말한다. 이 \u003cb class=\"key\">단순한 \u003c/b>\u003cb class=\"key\">방법\u003c/b>은 침대 위아래를 확인할 이유 자체를 없애 문제를 해결한다. 마지막에 그 방법이 의사의 제안보다 훨씬 \u003cb class=\"key\">저렴했다\u003c/b>는 비교가 나오며 반전이 완성된다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 이야기의 흐름을 네 단계로 나누어 살펴볼게요.","hl":null},{"n":4,"text":"첫 번째 단계에서는 여성이 의사를 찾아가 침대 주변에서 느끼는 두려움을 털어놓죠. 침대에 들어가면 밑에 누군가 있는 것 같고, 침대 밑을 보면 이번에는 위에 누군가 있는 것 같다고 말해요. 위와 아래를 번갈아 확인하다 보니 그녀는 미칠 것 같다고 합니다.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 의사가 비싼 치료를 제안해요. 세 달 동안 일주일에 한 번 오면 도와주겠다고 말하죠. 대신 방문할 때마다 오십 달러가 든다고 비용을 분명히 밝힙니다.","hl":"f1"},{"n":6,"text":"세 번째 단계에서는 며칠 뒤 두 사람이 거리에서 만나요. 의사는 여성이 다시 오지 않은 이유를 묻고, 여성은 다행히 문제가 사라졌다며 동생이 단돈 십 달러로 도와주었다고 말하죠. 이 대화에서 의사의 예상과 다른 해결 경로가 드러납니다.","hl":"f2"},{"n":7,"text":"마지막 단계에서는 동생의 방법이 공개돼요. 여성은 동생이 침대 다리를 자르라고 했다고 말합니다. 이 단순한 방법은 침대 위아래를 확인할 이유 자체를 없애 문제를 해결하죠. 마지막에 그 방법이 의사의 제안보다 훨씬 저렴했다는 비교가 나오며 이야기가 반전됩니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 17번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 여성의 문제 제시, 의사의 비싼 제안, 동생의 값싼 해결이라는 흐름을 따라가는 \u003cb class=\"key\">문제와 \u003c/b>\u003cb class=\"key\">해결\u003c/b> 구조이다. 앞부분에서 문제와 전문적 해결책을 보여 주고, 뒤에서 예상 밖의 해결책을 제시하므로 \u003cb class=\"key\">미괄식\u003c/b>으로 볼 수 있다. 마지막 문장에서 두 해결책의 비용을 비교하며 \u003cb class=\"key\">주제\u003c/b>를 드러낸다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>When (3)\u003c/b>\u003cspan>상황 제시\u003c/span>\u003cb>then (4)\u003c/b>\u003cspan>연속 동작\u003c/span>\u003cb>A few days later (10)\u003c/b>\u003cspan>시간 전환\u003c/span>\u003cb>Luckily (12)\u003c/b>\u003cspan>반전 예고\u003c/span>\u003cb>It was so simple (15)\u003c/b>\u003cspan>해결책 강조\u003c/span>\u003cb>much cheaper than (17)\u003c/b>\u003cspan>비교·주제 강조\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">I have a problem\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">help you with your problem\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">my problem disappeared\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">helped me with the problem\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>의사의 제안\u003c/th>\u003cth>동생의 해결책\u003c/th>\u003c/tr>\u003ctr>\u003ctd>세 달 동안 주 1회 방문\u003c/td>\u003ctd>단 한 번의 조언\u003c/td>\u003c/tr>\u003ctr>\u003ctd>방문당 오십 달러\u003c/td>\u003ctd>십 달러\u003c/td>\u003c/tr>\u003ctr>\u003ctd>전문적 치료\u003c/td>\u003ctd>침대 다리 자르기\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 문제와 해결의 전개 방식을 따르면서 결말에 핵심을 드러내는 미괄식 구조예요. 앞부분에서는 여성의 문제와 의사의 비싼 제안이 제시되고, 뒤에서 동생의 값싼 해결책이 나오죠. 마지막 문장에서 그 방법이 의사의 제안보다 훨씬 저렴했다는 비교가 나오면서 주제가 분명해집니다.","hl":"ty"},{"n":9,"text":"신호어를 보면 When과 then이 반복되는 두려움의 장면을 이어 주고, A few days later가 시간을 전환하죠. Luckily는 문제가 사라졌다는 반전을 예고하고, 마지막의 much cheaper than은 두 해결책을 비용으로 비교합니다. 또한 problem과 the problem처럼 같은 개념을 반복해 여성의 고민이 계속 중심에 있음을 보여 줘요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>go to see\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>만나러 가다, 진료를 받으러 가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>doctor\u003c/b>\u003cem>명사\u003c/em>\u003cspan>의사\u003c/span>\u003c/div>\u003cdiv>\u003cb>problem\u003c/b>\u003cem>명사\u003c/em>\u003cspan>문제\u003c/span>\u003c/div>\u003cdiv>\u003cb>get into bed\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>침대에 들어가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>think\u003c/b>\u003cem>동사\u003c/em>\u003cspan>생각하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>under\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>밑에\u003c/span>\u003c/div>\u003cdiv>\u003cb>on top of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>위에\u003c/span>\u003c/div>\u003cdiv>\u003cb>crazy\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>미친\u003c/span>\u003c/div>\u003cdiv>\u003cb>for three months\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>세 달 동안\u003c/span>\u003c/div>\u003cdiv>\u003cb>once a week\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>일주일에 한 번\u003c/span>\u003c/div>\u003cdiv>\u003cb>help with\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 돕다\u003c/span>\u003c/div>\u003cdiv>\u003cb>cost\u003c/b>\u003cem>동사\u003c/em>\u003cspan>비용이 들다\u003c/span>\u003c/div>\u003cdiv>\u003cb>fifty dollars\u003c/b>\u003cem>명사\u003c/em>\u003cspan>오십 달러\u003c/span>\u003c/div>\u003cdiv>\u003cb>visit\u003c/b>\u003cem>명사\u003c/em>\u003cspan>방문\u003c/span>\u003c/div>\u003cdiv>\u003cb>a few days later\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>며칠 후\u003c/span>\u003c/div>\u003cdiv>\u003cb>meet\u003c/b>\u003cem>동사\u003c/em>\u003cspan>만나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>street\u003c/b>\u003cem>명사\u003c/em>\u003cspan>거리\u003c/span>\u003c/div>\u003cdiv>\u003cb>again\u003c/b>\u003cem>부사\u003c/em>\u003cspan>다시\u003c/span>\u003c/div>\u003cdiv>\u003cb>luckily\u003c/b>\u003cem>부사\u003c/em>\u003cspan>다행히\u003c/span>\u003c/div>\u003cdiv>\u003cb>disappear\u003c/b>\u003cem>동사\u003c/em>\u003cspan>사라지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>brother\u003c/b>\u003cem>명사\u003c/em>\u003cspan>형제, 남자 형제\u003c/span>\u003c/div>\u003cdiv>\u003cb>just\u003c/b>\u003cem>부사\u003c/em>\u003cspan>단지, 겨우\u003c/span>\u003c/div>\u003cdiv>\u003cb>shocked\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>충격을 받은\u003c/span>\u003c/div>\u003cdiv>\u003cb>simple\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>간단한\u003c/span>\u003c/div>\u003cdiv>\u003cb>cut\u003c/b>\u003cem>동사\u003c/em>\u003cspan>자르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>leg\u003c/b>\u003cem>명사\u003c/em>\u003cspan>다리\u003c/span>\u003c/div>\u003cdiv>\u003cb>much\u003c/b>\u003cem>부사\u003c/em>\u003cspan>훨씬\u003c/span>\u003c/div>\u003cdiv>\u003cb>cheaper\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>더 싼\u003c/span>\u003c/div>\u003cdiv>\u003cb>suggestion\u003c/b>\u003cem>명사\u003c/em>\u003cspan>제안\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"단어는 go to see, disappear, shocked, simple, suggestion을 특히 눈여겨보세요. go to see는 진료를 받으러 가다, disappear는 사라지다, shocked는 충격을 받은이라는 뜻이에요. simple과 suggestion도 마지막 반전의 의미를 잡는 데 꼭 필요합니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">problem\u003c/b>\u003cspan class=\"m\">문제\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan c an>\u003cspan class=\"a\">complex\u003c/span>\u003cspan class=\"a\">complicated\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">cheaper\u003c/b>\u003cspan class=\"m\">더 싼\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">less expensive\u003c/span>\u003cspan class=\"s\">inexpensive\u003c/span>\u003cspan class=\"s\">economical\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">more expensive\u003c/span>\u003cspan class=\"a\">costly\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"이제 핵심 어휘의 동의어와 반의어를 정리해 볼게요. problem은 issue나 trouble로 바꿀 수 있고 반대말은 solution이나 answer예요. crazy는 insane이나 mad와 가깝고 반대말은 sane이나 rational이죠. help는 assist나 aid로 표현할 수 있고 반대말은 hinder나 obstruct입니다. disappear는 vanish나 fade이고 반대말은 appear나 emerge이며, shocked는 surprised나 astonished, 반대말은 calm이나 indifferent예요. simple은 easy나 straightforward, 반대말은 complex나 complicated이고, cheaper는 inexpensive나 economical, 반대말은 more expensive나 costly입니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 여자가\u003c/span>\u003cspan class=\"en\">A woman\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">갔다\u003c/span>\u003cspan class=\"en\">went\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">의사를 보러\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">see \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">doctor\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">한 여자가 진료를 받으러 갔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 이야기의 \u003cb class=\"key\">주인공\u003c/b>인 한 여성이 \u003cb class=\"key\">의사\u003c/b>를 찾아갔다는 사실을 제시하며 사건의 시작을 알려 줍니다. 'see a doctor'는 단순히 의사를 '보다'가 아니라 \u003cb class=\"key\">진료를 \u003c/b>\u003cb class=\"key\">받다\u003c/b>라는 관용 표현으로 이해해야 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : went + [to see a doctor (to부정사구/목적)] : \"의사를 보러\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"A woman, 한 여자가. went, 갔다. to see a doctor, 의사를 보러. 이 문장 전체를 해석하면, 한 여자가 진료를 받으러 갔다.","hl":"m"},{"n":13,"text":"이 문장은 이야기의 주인공인 한 여성이 의사를 찾아갔다는 사실을 제시하면서 사건의 시작을 알려 줘요. see a doctor는 단순히 의사를 보다가 아니라 진료를 받다라는 관용 표현으로 이해해야 해요.","hl":"mn"},{"n":14,"text":"to see a doctor에서 to부정사는 갔다의 목적을 나타내요. 그래서 의사를 보러라는 목적 의미를 만든다고 이해하면 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 말했다,\u003c/span>\u003cspan class=\"en\">She said,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“저는 문제가 있어요.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">&quot;I \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">problem.\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 “저는 문제가 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 여성이 의사에게 자신의 \u003cb class=\"key\">문제\u003c/b>를 처음 말하는 장면입니다. 짧은 대사로 독자의 궁금증을 자아내며, 이어지는 \u003cb class=\"key\">증상\u003c/b> 설명을 자연스럽게 예고합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">직접화법\u003c/span> : said + [&quot;I have a problem. (직접 인용)] : \"“저는 문제가 있어요.\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"She said, 그녀는 말했다. \"I have a problem, “저는 문제가 있어요.. 이 문장 전체를 해석하면, 그녀는 “저는 문제가 있어요.","hl":"m"},{"n":16,"text":"이 문장은 여성이 의사에게 자신의 문제를 처음 말하는 장면이에요. 짧은 대사로 독자의 궁금증을 자아내면서 이어지는 증상 설명을 자연스럽게 예고해 줍니다.","hl":"mn"},{"n":17,"text":"따옴표 안에 말한 내용을 그대로 옮긴 직접화법이에요. 인용문 안에서는 말한 사람의 시점에 따라 I를 써요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 17\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내가 침대에 들어갈 때,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">get \u003c/span>\u003cspan class=\"tgt\">into \u003c/span>\u003cspan class=\"tgt\">bed\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 생각한다\u003c/span>\u003cspan class=\"en\">I think\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">누군가가 있다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">somebody \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 밑에.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">under \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">제가 침대에 들어갈 때, 그 밑에 누군가가 있다고 생각돼요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 여성의 \u003cb class=\"key\">문제\u003c/b>가 구체적으로 무엇인지 보여 줍니다. 침대에 들어갈 때마다 \u003cb class=\"key\">침대 \u003c/b>\u003cb class=\"key\">밑\u003c/b>에 누군가 있다고 느낀다는 대목으로, 뒤에 이어지는 위와 아래를 반복하는 두려움의 출발점이 됩니다. 'get into bed'는 '침대에 \u003cb class=\"key\">들어가다\u003c/b>', 즉 잠자리에 들다라는 뜻입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 when의 시간 부사절\u003c/span> : When + [주어 + 동사] , [주절] = ~할 때 ... : \"내가 침대에 들어갈 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 that의 목적어절과 there is 구문\u003c/span> : think + [that + there is + 명사 + 장소] = ...라고 생각하다 : \"그 밑에 누군가가 있다고\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"When I get into bed, 내가 침대에 들어갈 때. I think, 나는 생각한다. that there is somebody, 누군가가 있다고. under it, 그 밑에.. 이 문장 전체를 해석하면, 제가 침대에 들어갈 때, 그 밑에 누군가가 있다고 생각돼요.","hl":"m"},{"n":19,"text":"이 문장은 여성의 문제가 구체적으로 무엇인지 보여 줍니다. 침대에 들어갈 때마다 침대 밑에 누군가 있다고 느낀다는 대목으로 뒤에 이어지는 위와 아래를 반복하는 두려움의 출발점이 돼요. get into bed는 침대에 들어가다 즉 잠자리에 들다라는 뜻입니다.","hl":"mn"},{"n":20,"text":"첫 번째로 when은 할 때라는 시간을 나타내는 접속사로 절을 이끌어요. 이 절은 주절의 상황이 일어나는 때를 알려 줍니다. 두 번째로 think 뒤의 that절은 생각의 내용을 담는 목적어 역할을 해요. 그 안에는 있다를 나타내는 there is 구문이 쓰였어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 침대 밑을 본다,\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">look\u003c/span> under the bed,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러면 나는 생각한다\u003c/span>\u003cspan class=\"en\">then I \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">think\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 위에 누군가가 있다고.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">somebody\u003c/span> on top of it.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">침대 밑을 보면 그 위에 누군가가 있는 것 같아요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 여자는 침대 밑을 확인한 뒤에도 곧바로 침대 위쪽에 누군가 있다고 느끼는 \u003cb class=\"key\">착각\u003c/b>을 반복하고 있어요. 이 장면은 그녀의 \u003cb class=\"key\">강박\u003c/b>이 한쪽을 확인해도 끝나지 않는다는 점을 보여 주죠. 어려운 표현 on top of it은 '그것(침대) 위에'라는 뜻이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재시제(반복되는 습관)\u003c/span> : [주어] + [동사 현재형] + ... : \"본다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 that의 생략\u003c/span> : think + (that) + [주어] + [동사] : \"…라고 생각한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">there is 구문(존재)\u003c/span> : There + is + [주어] + [장소] : \"누군가가 있다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"I look under the bed, 나는 침대 밑을 본다. then I think, 그러면 나는 생각한다. there is somebody on top of it, 그 위에 누군가가 있다고.. 이 문장 전체를 해석하면, 침대 밑을 보면 그 위에 누군가가 있는 것 같아요.","hl":"m"},{"n":22,"text":"이 문장은 침대 밑을 확인한 뒤에도 다시 침대 위에 누군가 있다고 느끼는 착각을 보여 줘요. 그래서 확인해도 끝나지 않는 강박이 드러나죠. on top of it은 그것 위에, 즉 침대 위쪽이라는 뜻이에요.","hl":"mn"},{"n":23,"text":"먼저 I look under the bed에서 look은 현재시제라서 이런 확인 행동이 반복된다는 걸 나타내요. 여기서 반복이라는 점을 기억하세요. 두 번째로 think 뒤에는 접속사 that이 생략되어 there is somebody가 바로 이어져요. 생략을 꼭 짚어 주세요. 마지막으로 there is somebody는 누군가가 있다는 존재를 나타내는 there is 구문이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">위,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Top, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아래,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">under, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">위,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">top, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아래.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">under\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">위, 아래, 위, 아래.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Top, under, top, under는 위와 아래를 빠르게 오가는 \u003cb class=\"key\">반복\u003c/b>을 소리로 보여 주는 표현이에요. 완전한 문장이 아니라 단어만 나열했지만, 그래서 오히려 그녀가 \u003cb class=\"key\">위아래\u003c/b>를 계속 확인하는 집착이 더 생생하게 느껴져요. 다음 문장에서 미칠 것 같다고 말하는 이유를 만들어 주는 부분이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">병렬 구조(반복 열거)\u003c/span> : [Top], [under], [top], [under] : \"위, 아래, 위, 아래\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Top, 위. under, 아래. top, 위. under, 아래.. 이 문장 전체를 해석하면, 위, 아래, 위, 아래.","hl":"m"},{"n":25,"text":"이 부분은 완전한 문장이 아니라 위와 아래를 계속 오가는 반복을 보여 줘요. 그래서 위아래를 확인하는 집착이 리듬처럼 느껴지고, 여자가 점점 불안해지는 분위기가 살아나요. 다음 문장에서 미칠 것 같다고 말하는 이유를 만들어 주죠.","hl":"mn"},{"n":26,"text":"여기서는 Top, under, top, under를 같은 모양으로 이어 붙인 병렬 구조로 봐요. 같은 두 단어를 교차해서 되풀이하니까 리듬이 생기고, 그 리듬이 여자의 불안을 크게 느끼게 하죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 생각해요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">think\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미칠 것 같다고요!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">I'm \u003c/span>\u003cspan class=\"tgt\">going \u003c/span>\u003cspan class=\"tgt\">crazy\u003c/span>!&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">미칠 것 같아요!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> I think I'm going crazy는 '내가 미쳐 가고 있다고 생각해요', 즉 '미칠 것 같아요'라는 뜻이에요. 앞의 위, 아래 확인이 끝없이 반복되면서 여자가 느끼는 \u003cb class=\"key\">공포\u003c/b>와 \u003cb class=\"key\">한계\u003c/b>를 보여 주죠. 그래서 의사를 찾아가겠다는 다음 행동의 이유가 되어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that의 생략\u003c/span> : I think + (that) + [주어] + [동사] : \"나는 …라고 생각해요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">진행형과 관용 표현(go crazy)\u003c/span> : be + going + [형용사 crazy] : \"미쳐 가고 있다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"I think, 나는 생각해요. I'm going crazy!, 미칠 것 같다고요!. 이 문장 전체를 해석하면, 미칠 것 같아요!","hl":"m"},{"n":28,"text":"I think I'm going crazy는 내가 미쳐 가고 있다고 생각한다, 즉 미칠 것 같다는 뜻이에요. 앞에서 위와 아래를 끝없이 확인하면서 여자가 느끼는 공포와 한계를 보여 주죠. 그래서 의사를 찾아가겠다는 다음 행동의 이유가 되어요.","hl":"mn"},{"n":29,"text":"I think 뒤에는 접속사 that이 생략되어 I'm going crazy가 바로 이어져요. 생략을 꼭 기억하세요. 그리고 I'm going crazy에서 go crazy는 미치다라는 관용 표현이고, 진행형이라 미쳐 가는 상태를 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">의사가 말했다,\u003c/span>\u003cspan class=\"en\">The doctor said,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">&quot;제게 오세요\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Come \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">me\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">3개월 동안.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">three \u003c/span>\u003cspan class=\"tgt\">months\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">의사가 말했다. “3개월 동안 제게 오세요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 의사가 치료 계획의 \u003cb class=\"key\">기간\u003c/b>을 제시하는 문장이에요. 환자의 걱정을 해결해 주기 위해 앞으로 3개월간 자신을 찾아오라는 \u003cb class=\"key\">제안\u003c/b>을 하고 있죠. 바로 뒤에 오는 방문 \u003cb class=\"key\">횟수\u003c/b>와 \u003cb class=\"key\">비용\u003c/b> 조건으로 이어지는 출발점 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문(동사원형으로 시작하는 지시문)\u003c/span> : [동사원형 Come] + [전치사구 to me] : \"제게 오세요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 for + 기간(계속의 기간)\u003c/span> : [for] + [기간을 나타내는 명사구 three months] : \"3개월 동안\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"The doctor said, 의사가 말했다. \"Come to me, \"제게 오세요. for three months, 3개월 동안.. 이 문장 전체를 해석하면, 의사가 말했다. “3개월 동안 제게 오세요.","hl":"m"},{"n":31,"text":"의사가 환자에게 앞으로 3개월 동안 자신을 찾아오라고 제안하는 장면이에요. 여기서 3개월이라는 기간이 중요한 조건이 되죠. 뒤에 나오는 일주일에 한 번, 그리고 50달러라는 조건으로 자연스럽게 이어집니다.","hl":"mn"},{"n":32,"text":"첫 번째로 Come to me는 주어 없이 동사원형으로 시작하는 명령문이에요. 의사가 환자에게 직접 지시하는 상황이니까 주어를 생략한 거죠. 두 번째로 for three months에서 for는 기간을 나타내는 전치사예요. 3개월이라는 기간 동안 계속 오라는 뜻으로 읽으면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 17\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일주일에 한 번 여기로 오세요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Come \u003c/span>\u003cspan class=\"tgt\">here \u003c/span>\u003cspan class=\"tgt\">once \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">week \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러면 제가 당신을 도울게요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">help \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신의 문제를 (해결하는 데)\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">problem\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">일주일에 한 번 여기로 오시면 문제 해결을 도와드리겠습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 의사가 구체적인 \u003cb class=\"key\">방문 \u003c/b>\u003cb class=\"key\">주기\u003c/b>와 자신이 해 줄 도움을 알려 주는 문장이에요. 명령문 뒤에 and로 이어지는 절을 붙여 '~하면 ~할게요'라는 \u003cb class=\"key\">조건\u003c/b>과 \u003cb class=\"key\">결과\u003c/b>의 관계를 만들었죠. 앞 문장의 기간 조건을 더 구체화하며, 뒤에 나오는 \u003cb class=\"key\">비용\u003c/b> 안내로 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문 + and + 결과절(조건과 결과)\u003c/span> : [명령문 Come here once a week] + and + [주어 I + will + 동사 help] : \"일주일에 한 번 여기로 오시면 제가 당신을 도울게요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 with를 동반하는 타동사 help\u003c/span> : help [목적어 you] + [with + 문제를 나타내는 명사구] : \"당신의 문제를 (해결하는 데) 도와주다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"Come here once a week, 일주일에 한 번 여기로 오세요. and I will help you, 그러면 제가 당신을 도울게요. with your problem, 당신의 문제를 (해결하는 데). 이 문장 전체를 해석하면, 일주일에 한 번 여기로 오시면 문제 해결을 도와드리겠습니다.","hl":"m"},{"n":34,"text":"의사가 일주일에 한 번 오라는 방문 주기와, 오면 자신이 문제 해결을 도와주겠다는 약속을 함께 말하고 있어요. 앞 문장에서 말한 3개월이라는 기간을 더 구체적으로 채워 주는 문장입니다. 그리고 이 도움에는 돈이 든다는 이야기가 다음 문장에 나오죠.","hl":"mn"},{"n":35,"text":"첫 번째로 Come here once a week and I will help you에서 명령문 뒤에 and가 붙으면 조건과 결과의 의미가 생겨요. 일주일에 한 번 오면 도와주겠다는 뜻이 되는 거죠. 두 번째로 help you with your problem에서 help는 목적어 뒤에 with를 붙여 도움의 대상 문제를 나타냅니다. 그래서 당신의 문제를 해결하는 데 도와주다는 해석이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 비용이 듭니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It \u003c/span>\u003cspan class=\"tgt\">costs \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">50달러\u003c/span>\u003cspan class=\"en\">\u00 an class=\"tgt\">few \u003c/span>\u003cspan class=\"tgt\">days \u003c/span>\u003cspan class=\"tgt\">later\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 만났다\u003c/span>\u003cspan class=\"en\">they met\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거리에서.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">street\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">며칠 후, 그들은 거리에서 만났다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 의사가 권한 치료를 받으러 오지 않은 여자와 의사가 \u003cb class=\"key\">거리에서\u003c/b> 우연히 다시 만난 장면이에요. 'A few days later'는 시간의 흐름을 나타내며, 다음 대화로 이어지는 \u003cb class=\"key\">전환\u003c/b> 역할을 해요. 여자가 병원에 다시 오지 않았다는 사실이 뒤에서 의사의 질문으로 이어져요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간 부사구\u003c/span> : [[A few days later]] = '며칠 후에'라는 시간 부사구 : \"며칠 후에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구(장소)\u003c/span> : [[on]] + [the street] = '거리에서' : \"거리에서\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"A few days later, 며칠 후에. they met, 그들은 만났다. on the street, 거리에서.. 이 문장 전체를 해석하면, 며칠 후, 그들은 거리에서 만났다.","hl":"m"},{"n":40,"text":"의사와 여자가 병원이 아니라 거리에서 다시 만난 장면이에요. 여자가 치료를 받으러 오지 않은 뒤라서 이 만남이 뒤의 대화로 자연스럽게 이어져요.","hl":"mn"},{"n":41,"text":"첫 번째로 A few days later는 '며칠 후에'라는 시간 부사구예요. A few days는 시간의 길이를 나타내는 명사구이고 later가 붙어서 시점을 알려 줘요. 두 번째로 on the street에서 on은 장소를 나타내는 전치사라서 '거리에서'라는 장소의 의미를 만들어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">&quot;왜 당신은 오지 않았나요\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Why \u003c/span>\u003cspan class=\"tgt\">didn't \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">come\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다시 저를 만나러&quot;?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">visit\u003c/span> me again?&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">의사가 물었다.\u003c/span>\u003cspan class=\"en\">the doctor asked.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“왜 다시는 저를 찾아오지 않으셨습니까?” 의사가 물었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 의사가 여자에게 약속한 치료를 다시 받으러 오지 않은 이유를 묻는 장면이에요. 'come to visit me'는 '저를 찾아오다'라는 뜻으로, 의사의 궁금증과 약간의 \u003cb class=\"key\">의아함\u003c/b>이 드러나요. 이 \u003cb class=\"key\">질문\u003c/b>이 여자의 해결책을 꺼내게 하는 계기가 돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정 의문문의 도치\u003c/span> : [[의문사]] + [[조동사 didn't]] + [주어 you] + [동사 come]? : \"왜 당신은 오지 않았나요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : [come] + [[to visit]] + [목적어] = '만나러 오다' : \"만나러\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"\"Why didn't you come, \"왜 당신은 오지 않았나요. to visit me again?\", 다시 저를 만나러\"?. the doctor asked, 의사가 물었다.. 이 문장 전체를 해석하면, “왜 다시는 저를 찾아오지 않으셨습니까?” 의사가 물었다.","hl":"m"},{"n":43,"text":"의사가 여자에게 왜 다시 병원에 찾아오지 않았는지 묻는 장면이에요. 여자가 약속을 지키지 않은 데 대한 의사의 궁금증이 드러나요.","hl":"mn"},{"n":44,"text":"첫 번째로 Why didn't you come에서는 부정 의문문이라서 조동사 didn't가 주어 you 앞으로 나오는 도치가 일어나요. 두 번째로 to visit은 come의 목적을 나타내는 to부정사로 '만나러'라는 목적의 의미를 만들어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 여자가 말했다,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">The \u003c/span>\u003cspan class=\"tgt\">woman \u003c/span>\u003cspan class=\"tgt\">said\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">&quot;다행히,\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">Luckily\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제 문제가\u003c/span>\u003cspan class=\"en\">my problem\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사라졌다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">disappeared\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 여자가 말했다. “다행히, 제 문제가 사라졌어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 여자가 의사에게 자신의 \u003cb class=\"key\">문제\u003c/b>가 이제 없어졌다고 말하는 장면이에요. 'Luckily'는 '다행히'라는 뜻으로 문제 해결에 대한 안도감을 나타내요. 이 말이 뒤에서 동생이 싸게 해결해 준 방법을 꺼내는 흐름으로 이어져요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">직접화법을 이끄는 전달문\u003c/span> : [The woman] + [[said]] + [&quot;, ...&quot;] : \"그 여자가 말했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">문장 부사\u003c/span> : [[Luckily]], + [주어 + 동사] : \"다행히\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">자동사\u003c/span> : [my problem] + [[disappeared]] : \"사라졌다\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"The woman said, 그 여자가 말했다. \"Luckily, \"다행히. my problem, 제 문제가. disappeared, 사라졌다.. 이 문장 전체를 해석하면, 그 여자가 말했다. “다행히, 제 문제가 사라졌어요.","hl":"m"},{"n":46,"text":"여자가 의사에게 자기 문제가 이제 없어졌다고 말하는 장면이에요. '다행히'라는 말로 문제 해결에 대한 안도감이 드러나고, 뒤에서 동생의 저렴한 해결법이 나오는 발판이 돼요.","hl":"mn"},{"n":47,"text":"첫 번째로 The woman said 뒤에 쉼표와 따옴표가 나오면 직접화법이에요. 두 번째로 Luckily는 문장 전체에 대한 화자의 태도를 나타내는 부사예요. 세 번째로 disappeared는 목적어 없이 쓰인 자동사로 '사라지다'라는 뜻이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 17\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제 동생이\u003c/span>\u003cspan class=\"en\">My brother\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저를 도와주었어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">helped \u003c/span>\u003cspan class=\"tgt\">me \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 문제를 (해결하는 데)\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">problem\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단돈 10달러로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">just \u003c/span>\u003cspan class=\"tgt\">ten \u003c/span>\u003cspan class=\"tgt\">dollars\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">제 동생이 단돈 10달러로 문제 해결을 도와주었어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 의사에게 다시 가지 않은 이유를 밝히는 문장이에요. 삼 개월 치료 대신 동생이 \u003cb class=\"key\">단돈 \u003c/b>\u003cb class=\"key\">10달러\u003c/b>로 문제를 끝냈다는 말이라, 앞에서 의사가 제시한 비싼 치료 계획이 \u003cb class=\"key\">무색해지는\u003c/b> 흐름을 만듭니다. 값비싼 값과 싼 값의 \u003cb class=\"key\">대비\u003c/b>가 이 이야기의 웃음 포인트예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">help + 목적어 + with 전치사구(help의 관용 표현)\u003c/span> : help [목적어] with [명사] → '~가 …하는 것을 돕다' : \"저를 그 문제 (해결하는 데) 도와주었어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 for의 용법(대가·교환)\u003c/span> : for + [금액] → '~의 대가로, ~로' : \"단돈 10달러로\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"My brother, 제 동생이. helped me, 저를 도와주었어요. with the problem, 그 문제를 (해결하는 데). for just ten dollars, 단돈 10달러로. 이 문장 전체를 해석하면, 제 동생이 단돈 10달러로 문제 해결을 도와주었어요.","hl":"m"},{"n":49,"text":"여자가 의사에게 건넨 말이에요. 비싼 치료를 받으러 다시 오지 않은 이유를 설명하는 장면이죠. 동생이 십 달러라는 훨씬 싼값에 문제를 해결해 줬다는 뜻이라서, 의사가 제안한 삼 개월 치료가 우스워지는 흐름으로 이어집니다.","hl":"mn"},{"n":50,"text":"첫 번째 어법 포인트는 help의 쓰임이에요. help는 목적어를 먼저 받고, 도움의 내용은 전치사 with로 붙여서 help me with the problem처럼 씁니다. 두 번째는 전치사 for인데, 금액 앞에서 for는 '그 값의 대가로'라는 뜻이 되고, 앞에 just가 붙으면 '단돈'이라는 강조가 살아납니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">의사는\u003c/span>\u003cspan class=\"en\">The doctor\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">충격을 받았다,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">shocked\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“그가 무엇을 했죠\u003c/span>\u003cspan class=\"en\">&quot;What \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">did \u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">do\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신에게 해 줬나요?”\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">you\u003c/span>?&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">의사는 충격을 받았다. “그가 당신에게 무엇을 해 줬죠?”\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 의사가 놀라서 되묻는 장면이에요. 삼 개월이나 걸릴 줄 알았던 문제를 동생이 \u003cb class=\"key\">단돈 \u003c/b>\u003cb class=\"key\">10달러\u003c/b>로 끝냈다는 말에 충격을 받은 거죠. 그래서 '도대체 그가 당신에게 무엇을 \u003cb class=\"key\">해 \u003c/b>\u003cb class=\"key\">준\u003c/b> 거냐'고 방법을 캐묻는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">감정을 나타내는 수동태\u003c/span> : be동사 + 과거분사(shocked) → '~한 상태가 되다, 충격을 받다' : \"충격을 받았다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">의문문의 도치(조동사 do의 도치)\u003c/span> : 의문사 + [조동사 did] + [주어 he] + [동사원형 do] : \"그가 했나요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 for + 사람(혜택의 대상)\u003c/span> : do + [목적어] + for + [사람] → '~에게 …해 주다' : \"당신에게 (해 주려고)\"\u003c/div>\u003c/div>","segs":[{"n":51,"text":"The doctor, 의사는. was shocked, 충격을 받았다. \"What did he do, “그가 무엇을 했죠. for you?\", 당신에게 해 줬나요?”. 이 문장 전체를 해석하면, 의사는 충격을 받았다. “그가 당신에게 무엇을 해 줬죠?”","hl":"m"},{"n":52,"text":"의사가 충격을 받은 이유가 드러나는 장면이에요. 삼 개월 치료가 필요하다던 문제를 동생이 십 달러로 끝냈다는 말을 듣고 놀란 거죠. 그래서 도대체 그 동생이 당신에게 무엇을 해 준 거냐고 방법을 캐묻는 겁니다.","hl":"mn"},{"n":53,"text":"먼저 was shocked는 감정을 나타내는 수동태예요. shock이 '충격을 주다'라는 타동사라서, 충격을 받는 쪽은 be동사에 과거분사를 붙여 표현합니다. 다음으로 did he do를 보세요. 일반동사 의문문이라서 조동사 did가 주어 he 앞으로 도치되고, 본동사는 원형 do로 돌아갑니다. 마지막으로 for you는 '당신을 위해서, 당신에게'라는 혜택의 대상을 나타내는 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 15 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 여자가 말했다,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">The \u003c/span>\u003cspan class=\"tgt\">woman \u003c/span>\u003cspan class=\"tgt\">said\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“그것은 정말 간단했어요.\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">It \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">so \u003c/span>\u003cspan class=\"tgt\">simple\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여자가 말했다. “정말 간단해요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 해결책이 얼마나 허무할 만큼 단순했는지 강조하는 대사예요. 앞에서 말한 동생의 방법 전체를 It으로 받아 '그것은 정말 \u003cb class=\"key\">간단\u003c/b>했어요'라고 운을 띄우고, 다음 문장에서 침대 다리를 자르라는 말을 꺼내죠. 의사의 비싼 제안과 \u003cb class=\"key\">대비\u003c/b>되는 지점이라 글의 반전이 완성됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">say와 tell의 구별(3형식 동사)\u003c/span> : say + [말한 내용] / tell + [사람] + [말한 내용] : \"그 여자가 말했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">대명사 It의 지시 용법과 과거시제\u003c/span> : It(앞 문장 내용을 지칭) + was + [형용사] : \"그것은 정말 간단했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">강조의 부사 so + 형용사\u003c/span> : so + [형용사] → '정말, 너무 ~한' : \"정말 간단한\"\u003c/div>\u003c/div>","segs":[{"n":54,"text":"The woman said, 그 여자가 말했다. \"It was so simple, “그것은 정말 간단했어요.. 이 문장 전체를 해석하면, 여자가 말했다. “정말 간단해요.","hl":"m"},{"n":55,"text":"여자가 해결책이 얼마나 허무할 정도로 간단했는지 강조하는 대사예요. 앞에서 말한 동생의 방법을 It으로 받아 '그것은 정말 간단했어요'라고 운을 띄우고, 이어서 침대 다리를 자르라는 말을 꺼내죠. 의사의 비싼 제안과 정면으로 대비되는 지점입니다.","hl":"mn"},{"n":56,"text":"첫 번째는 say와 tell의 차이예요. say는 뒤에 말의 내용이 바로 오고, 사람을 쓰려면 전치사 to를 붙입니다. 그래서 The woman said 뒤에 곧바로 인용문이 이어지는 거죠. 두 번째는 It인데, 날씨나 시간의 it이 아니라 앞에서 동생이 해 준 일 전체를 가리키는 지시대명사예요. 이미 끝난 일이라서 과거시제 was로 받았습니다. 세 번째로 so simple의 so는 형용사를 강하게 꾸며 '정말, 너무'라는 강조를 만들어 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 16 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 내게 말했어요\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">told \u003c/span>\u003cspan class=\"tgt\">me \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자르라고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">cut\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">침대의 다리를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">legs \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">bed\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 제게 침대 다리를 자르라고 말했어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 동생이 여자에게 아주 단순한 방법을 알려줬다는 뜻이에요. 비싼 치료 대신 \u003cb class=\"key\">간단한 \u003c/b>\u003cb class=\"key\">해결책\u003c/b>을 썼다는 점이 이 이야기의 반전이죠. 'cut the legs of the bed'는 침대 다리를 잘라 높이를 낮추라는 \u003cb class=\"key\">물리적 \u003c/b>\u003cb class=\"key\">해결\u003c/b>을 가리켜요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">5형식 목적격보어 to부정사(tell+A+to부정사)\u003c/span> : tell [목적어] + [to부정사(목적격보어)] → '~에게 …하라고 말하다' : \"내게 자르라고 말했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 of의 소유 관계 표현\u003c/span> : the legs [of + 명사] → '~의 다리' : \"침대의 다리들\"\u003c/div>\u003c/div>","segs":[{"n":57,"text":"He told me, 그는 내게 말했어요. to cut, 자르라고. the legs of the bed, 침대의 다리를. 이 문장 전체를 해석하면, 그는 제게 침대 다리를 자르라고 말했어요.","hl":"m"},{"n":58,"text":"동생이 여자에게 침대 다리를 자르라고 알려줬다는 문장이에요. 비싼 치료 대신 아주 간단한 해결책을 썼다는 게 이 이야기의 반전이죠.","hl":"mn"},{"n":59,"text":"첫 번째, told me to cut에서 tell은 목적어 뒤에 to부정사를 목적격보어로 쓰는 5형식 동사예요. 그래서 '내게 자르라고 말했다'가 되죠. 두 번째, the legs of the bed에서 of는 '~의'라는 뜻으로 앞 명사의 소유 관계를 전치사구로 설명해요. 침대의 다리, 이렇게 해석하면 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 17 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 ~이었어요\u003c/span>\u003cspan class=\"en\">It was\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">훨씬 더 저렴했어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">much \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">cheaper \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신의 제안보다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">suggestion\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">선생님의 제안보다 훨씬 더 저렴했지요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 동생의 방법이 의사가 내놓은 치료법보다 훨씬 더 저렴했다는 점을 강조하는 문장이에요. 'your suggestion'은 의사가 제안한 \u003cb class=\"key\">3개월 \u003c/b>\u003cb class=\"key\">치료\u003c/b>를 가리키고, 여자가 \u003cb class=\"key\">비용 \u003c/b>\u003cb class=\"key\">비교\u003c/b>로 의사를 살짝 비꼬는 장면이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">비교급 강조 부사 much\u003c/span> : much + [비교급] → '훨씬 더 ~한' : \"훨씬 더 저렴한\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">than을 이용한 비교 구문\u003c/span> : [비교급] + than + [비교 대상] → '~보다 더 …한' : \"당신의 제안보다 더 저렴한\"\u003c/div>\u003c/div>","segs":[{"n":60,"text":"It was, 그것은 ~이었어요. much cheaper, 훨씬 더 저렴했어요. than your suggestion, 당신의 제안보다. 이 문장 전체를 해석하면, 선생님의 제안보다 훨씬 더 저렴했지요.","hl":"m"},{"n":61,"text":"동생의 방법이 의사의 치료법보다 훨씬 더 저렴했다는 걸 강조하는 문장이에요. your suggestion은 의사가 제안한 3개월 치료를 가리키고, 여자가 비용 비교로 의사를 살짝 비꼬는 거죠.","hl":"mn"},{"n":62,"text":"첫 번째, much cheaper에서 much는 비교급을 강조하는 부사예요. 그래서 '훨씬 더 저렴한'이 되죠. 두 번째, cheaper than your suggestion에서 than은 비교 대상 앞에 쓰여 '당신의 제안보다'라는 비교 구문을 만들어요. 이때 비교 대상은 의사의 제안이에요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>한 여성은 침대 밑과 위에 누군가 있다고 느끼는 \u003cb class=\"key\">두려움\u003c/b> 때문에 의사를 찾아갔다.\u003c/li>\u003cli>의사는 세 달 동안 일주일에 한 번 방문하는 \u003cb class=\"key\">비싼 \u003c/b>\u003cb class=\"key\">치료\u003c/b>를 제안했다.\u003c/li>\u003cli>며칠 후 여성은 문제가 사라졌다며 동생이 단돈 십 달러로 도와주었다고 말했다.\u003c/li>\u003cli>동생의 방법은 침대 다리를 자르는 \u003cb class=\"key\">단순한 \u003c/b>\u003cb class=\"key\">해결책\u003c/b>이었고 의사의 제안보다 훨씬 저렴했다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>A woman solves her bedtime fear with her brother's cheap and simple solution rather than the doctor's expensive treatment.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">한 여성이 침대 위아래에 누군가 있다는 \u003cb class=\"key\">두려움\u003c/b> 때문에 의사를 찾았지만, 비싼 치료 대신 동생의 \u003cb class=\"key\">침대 \u003c/b>\u003cb class=\"key\">다리 \u003c/b>\u003cb class=\"key\">자르기\u003c/b>라는 값싼 해결책으로 문제가 사라졌다는 이야기이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":63,"text":"정리해 볼게요. 이 이야기는 비싼 치료보다 문제를 단순하게 바꾸는 해결책이 더 효과적일 수 있음을 보여 줍니다. 핵심은 문제를 어떻게 바라보고 어디를 건드리느냐예요. 오늘 수업도 여기까지입니다. 다음 시간에 또 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
