<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터1 Reading 25 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터1 Reading 25","audioDir":"reading25_audio","preview":false,"count":48,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.668em\">Reading\u003cbr>25\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터1\u003c/div>\u003ch1>Why Balls Come in All Shapes, Sizes, and Materials\u003c/h1>\u003ch2>공이 제각각 크기와 재료를 갖는 이유\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>구기 종목에는 사용되는 공의 크기·무게·단단함·탄성 같은 \u003cb class=\"key\">특성\u003c/b>에 관한 규칙이 있다. 공은 \u003cb class=\"key\">적정\u003c/b>한 단단함과 탄성을 가져야 하며, 강철이나 점토처럼 극단적인 재료는 너무 단단하거나 전혀 튀지 않아 규칙에 맞지 않는다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Ball sports set rules about the physical characteristics of balls, such as size, weight, stiffness, and bounce, because a ball must be neither too stiff nor too soft and neither too bouncy nor completely dead.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 스포츠에서 사용하는 공에 관한 글이에요. 우리가 공을 가지고 대부분의 주요 스포츠 활동을 한다는 아주 익숙한 사실에서 시작하죠. 이 글은 공의 크기와 무게, 단단함과 탄성에 어떤 규칙이 숨어 있는지를 차분하게 설명하고 있어요. 요지는 공이 너무 단단하지도 너무 무르지도 않은 적정한 상태여야 한다는 것이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">공은 스포츠에서 단순한 도구가 아니라 경기의 공정성을 만들어 주는 장비(equipment)이다. 종목마다 공의 크기(size), 무게(weight), 단단함(stiffness), 탄성(bounce)을 규정하는 이유는 결국 \u003cb class=\"key\">공정성\u003c/b>과 안전 때문이다. 예를 들어 야구공과 배구공은 크기와 무게가 다르고, 테니스공은 일정한 높이에서 떨어뜨렸을 때 되튀는 높이까지 규정된다. 재료 공학에서 \u003cb class=\"key\">탄성\u003c/b>은 눌렸다가 원래대로 돌아오는 성질을, 단단함은 변형에 저항하는 성질을 뜻한다. 푹신한 방석과 딱딱한 나무 의자 중 무엇이 편한지는 상황에 따라 다르듯, 공도 종목에 맞는 \u003cb class=\"key\">적정값\u003c/b>이 따로 있다. 그래서 규칙은 '좋은 공'을 하나하나 정의하기보다 '너무 단단한 공, 너무 무른 공'을 걸러 내는 방식으로 작동한다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경을 조금만 알고 가면 훨씬 편하게 읽혀요. 공은 스포츠에서 단순한 도구가 아니라 경기의 공정성을 만들어 주는 장비예요. 종목마다 공의 크기와 무게, 단단함, 탄성을 규정하는 이유도 결국 공정성과 안전 때문이죠. 예를 들어 테니스공은 일정한 높이에서 떨어뜨렸을 때 되튀는 높이까지 규정된다는 이야기가 있어요. 재료 쪽에서 탄성은 눌렸다가 원래대로 돌아오는 성질이고, 단단함은 변형에 저항하는 성질이에요. 푹신한 방석과 딱딱한 나무 의자 중 무엇이 편한지는 상황에 따라 다르죠. 공도 똑같아서 종목에 맞는 적정값이 따로 있다는 점을 기억하고 들어 주세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>공과 스포츠\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>우리는 공을 가지고 대부분의 주요 스포츠 활동을 한다는 사실로 글을 연다. 그래서 공은 스포츠에서 매우 \u003cb class=\"key\">중요\u003c/b>하다는 점을 먼저 못 박는다. 아직 구체적인 규칙은 제시되지 않고, \u003cb class=\"key\">구기 \u003c/b>\u003cb class=\"key\">종목\u003c/b>에서 공이 차지하는 위치만 깔린다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>공에 대한 규칙\u003csmall>주장 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>구기 종목에는 사용되는 공에 대한 몇 가지 \u003cb class=\"key\">규칙\u003c/b>이 있다고 주제를 꺼낸다. 그 규칙은 크기나 무게와 같은 공의 \u003cb class=\"key\">특성\u003c/b>에 관한 것이라고 범위를 좁힌다. 여기에 공은 일정한 \u003cb class=\"key\">단단함\u003c/b>이 있어야 한다는 조건이 더해진다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>크기·무게·단단함\u003csmall>근거·예시 · 문장 6–9\u003c/small>\u003c/h4>\u003cp>공은 크기가 정확해야 하고 적절한 \u003cb class=\"key\">무게\u003c/b>를 가져야 한다는 두 가지 조건이 먼저 나온다. 이어서 강철로 만들어지면 너무 \u003cb class=\"key\">단단\u003c/b>하고, 발포 고무로 만들어지면 너무 \u003cb class=\"key\">부드럽다\u003c/b>는 예가 제시된다. 즉 규칙은 극단적인 재료를 걸러 내며 \u003cb class=\"key\">적정 \u003c/b>\u003cb class=\"key\">범위\u003c/b>가 어디인지 알려 준다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>탄성의 적정선\u003csmall>전환·결론 · 문장 10–12\u003c/small>\u003c/h4>\u003cp>단단함과 함께 공은 적절한 양의 \u003cb class=\"key\">탄성\u003c/b>이 필요하다는 기준이 하나 더 추가된다. 고무로만 만들어진 공은 대부분의 스포츠에서 너무 잘 \u003cb class=\"key\">튀\u003c/b>고, 점토로만 만들어진 공은 전혀 튀지 않는다는 반례가 이어진다. 결국 공은 어느 한쪽으로 치우치지 않는 \u003cb class=\"key\">적정값\u003c/b>을 가져야 한다는 결론에 닿는다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 이제 글의 흐름을 네 단계로 나누어서 따라가 볼게요.","hl":null},{"n":4,"text":"첫 단계는 도입이에요. 우리는 공을 가지고 대부분의 주요 스포츠 활동을 한다고 시작하죠. 그래서 공은 스포츠에서 매우 중요하다는 점을 먼저 못 박아요. 아직 구체적인 규칙은 나오지 않고, 구기 종목에서 공이 차지하는 위치만 깔아 주는 단계예요.","hl":"f0"},{"n":5,"text":"두 번째 단계에서 주제가 나와요. 구기 종목에는 사용되는 공에 대한 몇 가지 규칙이 있다고 말하죠. 그 규칙은 크기나 무게와 같은 공의 특성에 관한 것이라고 범위를 좁혀 줘요. 여기에 공은 일정한 단단함이 있어야 한다는 조건이 하나 더 붙습니다.","hl":"f1"},{"n":6,"text":"세 번째 단계는 근거와 예시예요. 공은 크기가 정확해야 하고 적절한 무게를 가져야 한다는 두 조건이 먼저 나와요. 이어서 강철로 만들어지면 너무 단단하고, 발포 고무로 만들어지면 너무 부드럽다는 예가 제시되죠. 결국 규칙은 극단적인 재료를 걸러 내면서 적정 범위가 어디인지 알려 주는 셈이에요.","hl":"f2"},{"n":7,"text":"마지막 단계는 전환이자 결론이에요. 단단함과 함께 공은 적절한 양의 탄성이 필요하다는 기준이 추가됩니다. 고무로만 만들어진 공은 대부분의 스포츠에서 너무 잘 튀고, 점토로만 만들어진 공은 전혀 튀지 않는다는 반례가 이어져요. 그래서 공은 어느 한쪽으로 치우치지 않는 적정값을 가져야 한다는 결론에 닿습니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">비교·대조\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 3번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 처음 두 문장에서 공의 중요성을 깔고, 세 번째 문장에서 구기 종목에는 공에 대한 \u003cb class=\"key\">규칙\u003c/b>이 있다고 주제를 앞세운다. 이어지는 문장들은 그 규칙이 크기·무게·단단함·탄성이라는 \u003cb class=\"key\">특성\u003c/b>에 관한 것임을 차례로 풀어 낸다. 강철과 발포 고무, 고무와 점토라는 \u003cb class=\"key\">대조\u003c/b> 예시가 뒤따르지만 이는 주제를 뒷받침하는 근거일 뿐이다. 따라서 결론이 뒤에 몰리는 미괄식이 아니라 주제가 앞에 놓인 \u003cb class=\"key\">두괄식\u003c/b>으로 읽는 것이 맞다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>So (2)\u003c/b>\u003cspan>앞 문장에서 결론 도출\u003c/span>\u003cb>such as (4)\u003c/b>\u003cspan>구체적 예시 제시\u003c/span>\u003cb>Also (7)\u003c/b>\u003cspan>조건 추가\u003c/span>\u003cb>However (8)\u003c/b>\u003cspan>대조 전환\u003c/span>\u003cb>Similarly (10)\u003c/b>\u003cspan>유사 기준 추가\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">rules about the balls used\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">rules about the characteristics of the balls\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a certain stiffness\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the correct size\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the proper weight\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a proper amount of bounce\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>강철·고무로 만든 공\u003c/th>\u003cth>발포 고무·점토로 만든 공\u003c/th>\u003c/tr>\u003ctr>\u003ctd>재료가 매우 단단함 (steel, solid rubber)\u003c/td>\u003ctd>재료가 매우 무르거나 푸석함 (foam rubber, clay)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>너무 단단하거나 너무 잘 튐\u003c/td>\u003ctd>너무 부드럽거나 전혀 튀지 않음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>규칙이 요구하는 적정 범위를 벗어남\u003c/td>\u003ctd>규칙이 요구하는 적정 범위를 벗어남\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 전개 방식으로 보면 비교와 대조를 활용한 설명 글이에요. 구조는 주제가 앞에 놓이는 두괄식이고요. 첫 두 문장에서 공의 중요성을 깔고, 세 번째 문장에서 공에 대한 규칙이 있다고 주제를 앞세우죠. 뒤에 나오는 강철과 발포 고무, 고무와 점토 이야기는 모두 그 주제를 뒷받침하는 근거라는 점이 핵심이에요.","hl":"ty"},{"n":9,"text":"신호어를 짚어 볼게요. 두 번째 문장의 So는 앞 문장에서 결론을 끌어내는 표시이고, 네 번째 문장의 such as는 구체적인 예시를 붙여 줍니다. 일곱 번째 문장의 Also는 조건을 하나 더 추가한다는 신호예요. 여덟 번째 문장의 However는 흐름을 비틀어 대조로 넘어간다는 표시이고, 열 번째 문장의 Similarly는 앞의 단단함 이야기와 같은 방식으로 탄성 이야기를 이어 간다는 신호입니다. 이렇게 재진술과 대조가 번갈아 나오니, 규칙이 가리키는 특성이 무엇인지 계속 확인하며 읽어야 해요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>play\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(스포츠를) 하다, 치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>major\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>주요한, 중대한\u003c/span>\u003c/div>\u003cdiv>\u003cb>activity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>활동\u003c/span>\u003c/div>\u003cdiv>\u003cb>important\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>중요한\u003c/span>\u003c/div>\u003cdiv>\u003cb>rule\u003c/b>\u003cem>명사\u003c/em>\u003cspan>규칙, 규정\u003c/span>\u003c/div>\u003cdiv>\u003cb>use\u003c/b>\u003cem>동사\u003c/em>\u003cspan>사용하다 (be used: 사용되다)\u003c/span>\u003c/div>\u003cdiv>\u003cb>characteristic\u003c/b>\u003cem>명사\u003c/em>\u003cspan>특성, 특징\u003c/span>\u003c/div>\u003cdiv>\u003cb>such as\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~와 같은\u003c/span>\u003c/div>\u003cdiv>\u003cb>size\u003c/b>\u003cem>명사\u003c/em>\u003cspan>크기\u003c/span>\u003c/div>\u003cdiv>\u003cb>weight\u003c/b>\u003cem>명사\u003c/em>\u003cspan>무게\u003c/span>\u003c/div>\u003cdiv>\u003cb>certain\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>일정한, 특정한\u003c/span>\u003c/div>\u003cdiv>\u003cb>stiffness\u003c/b>\u003cem>명사\u003c/em>\u003cspan>단단함, 뻣뻣함\u003c/span>\u003c/div>\u003cdiv>\u003cb>too\u003c/b>\u003cem>부사\u003c/em>\u003cspan>너무, 지나치게\u003c/span>\u003c/div>\u003cdiv>\u003cb>correct\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>정확한, 올바른\u003c/span>\u003c/div>\u003cdiv>\u003cb>proper\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>적절한, 알맞은\u003c/span>\u003c/div>\u003cdiv>\u003cb>however\u003c/b>\u003cem>부사\u003c/em>\u003cspan>그러나, 하지만\u003c/span>\u003c/div>\u003cdiv>\u003cb>be made of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 만들어지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>steel\u003c/b>\u003cem>명사\u003c/em>\u003cspan>강철\u003c/span>\u003c/div>\u003cdiv>\u003cb>stiff\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>단단한, 뻣뻣한\u003c/span>\u003c/div>\u003cdiv>\u003cb>foam rubber\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>발포 고무, 스펀지 고무\u003c/span>\u003c/div>\u003cdiv>\u003cb>rubber\u003c/b>\u003cem>명사\u003c/em>\u003cspan>고무\u003c/span>\u003c/div>\u003cdiv>\u003cb>soft\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>부드러운, 무른\u003c/span>\u003c/div>\u003cdiv>\u003cb>similarly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>마찬가지로, 비슷하게\u003c/span>\u003c/div>\u003cdiv>\u003cb>along with\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~와 함께, ~에 더하여\u003c/span>\u003c/div>\u003cdiv>\u003cb>amount\u003c/b>\u003cem>명사\u003c/em>\u003cspan>양, 정도\u003c/span>\u003c/div>\u003cdiv>\u003cb>bounce\u003c/b>\u003cem>명사·동사\u003c/em>\u003cspan>튐, 탄성 / 튀다\u003c/span>\u003c/div>\u003cdiv>\u003cb>solid\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>고체의, 속이 꽉 찬\u003c/span>\u003c/div>\u003cdiv>\u003cb>bouncy\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>잘 튀는, 탄력 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>clay\u003c/b>\u003cem>명사\u003c/em>\u003cspan>점토, 찰흙\u003c/span>\u003c/div>\u003cdiv>\u003cb>at all\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>(부정문에서) 전혀\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"단어 몇 개만 짚을게요. stiffness는 단단함, bounce는 튐 또는 탄성이라는 뜻이고, proper는 적절한이라는 의미로 글 전체를 관통하는 열쇠말이에요. be made of는 재료를 말할 때 쓰는 표현으로 be made of steel처럼 씁니다. along with는 무엇에 더하여라는 뜻이라, 기준이 하나 더 추가된다는 흐름을 놓치지 않게 해 줘요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">important\u003c/b>\u003cspan class=\"m\">중요한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">significant\u003c/span>\u003cspan class=\"s\">essential\u003c/span>\u003cspan class=\"s\">crucial\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">trivial\u003c/span>\u003cspan class=\"a\">unimportant\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">characteristic\u003c/b>\u003cspan class=\"m\">특성\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">feature\u003c/span>\u003cspan class=\"s\">trait\u003c/span>\u003cspan class=\"s\">quality\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">stiff\u003c/b>\u003cspan class=\"m\">단단한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">rigid\u003c/span>\u003cspan class=\"s\">hard\u003c/span>\u003cspan class=\"s\">firm\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">soft\u003c/span>\u003cspan class=\"a\">flexible\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">proper\u003c/b>\u003cspan class=\"m\">적절한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">appropriate\u003c/span>\u003cspan class=\"s\">suitable\u003c/span>\u003cspan class=\"s\">right\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">improper\u003c/span>\u003cspan class=\"a\">wrong\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">certain\u003c/b>\u003cspan class=\"m\">일정한, 특정한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">specific\u003c/span>\u003cspan class=\"s\">particular\u003c/span>\u003cspan class=\"s\">fixed\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">uncertain\u003c/span>\u003cspan class=\"a\">vague\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">similarly\u003c/b>\u003cspan class=\"m\">마찬가지로\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">likewise\u003c/span>\u003cspan class=\"s\">in the same way\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">differently\u003c/span>\u003cspan class=\"a\">on the contrary\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">bounce\u003c/b>\u003cspan class=\"m\">튀다, 탄성\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">rebound\u003c/span>\u003cspan class=\"s\">spring back\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 함께 정리해 볼게요. important는 significant, essential과 가깝고 반대말은 trivial이에요. stiff는 rigid, firm과 비슷하고 soft, flexible과 반대되지요. proper는 appropriate, suitable과 통하고 improper와는 반대 관계예요. certain은 specific, particular로 바꿔 쓸 수 있고, similarly는 likewise와 같은 뜻이에요. 마지막으로 bounce는 rebound, spring back으로 바꿔 말할 수 있다는 점도 기억해 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 한다\u003c/span>\u003cspan class=\"en\">We play\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대부분의 주요 스포츠 활동을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">most \u003c/span>\u003cspan class=\"tgt\">major \u003c/span>\u003cspan class=\"tgt\">sports \u003c/span>\u003cspan class=\"tgt\">activiti t":"They are rules, 그것들은 규칙이다. about the characteristics, 특성에 관한. of the balls, 공들의. such as size or weight, 크기나 무게와 같은. 이 문장 전체를 해석하면, 규칙은 크기나 무게와 같은 공의 특성에 관한 것이다.","hl":"m"},{"n":22,"text":"이 문장은 공 스포츠의 규칙이 공의 특성에 관한 것임을 밝히고 있어요. 그 예로 크기와 무게를 제시하죠. 그래서 뒤에서 단단함 같은 다른 특성으로 이야기가 이어질 수 있는 흐름을 열어 줍니다.","hl":"mn"},{"n":23,"text":"첫 번째, about the characteristics에서 about은 '~에 관한'이라는 전치사로, rules를 꾸미는 전치사구를 이끌어요. 두 번째, of the balls에서 of는 앞의 characteristics와 balls의 관계를 이어 주며 공의 특성이라는 소유나 대상 관계를 만들어요. 세 번째, such as size or weight는 such as를 이용해 앞의 공의 특성에 대한 예시로 크기와 무게를 드는 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공들은\u003c/span>\u003cspan class=\"en\">The balls\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가져야 한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">must \u003c/span>\u003cspan class=\"tgt\">have\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일정한 단단함을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">certain \u003c/span>\u003cspan class=\"tgt\">stiffness\u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">too\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">공은 또한 일정한 단단함이 있어야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 공의 특성 중 \u003cb class=\"key\">단단함\u003c/b>을 추가로 제시해요. 공은 너무 무르거나 너무 단단하면 안 되므로 \u003cb class=\"key\">일정한\u003c/b> 정도의 단단함이 필요하다는 뜻이죠. 뒤에서 \u003cb class=\"key\">강철\u003c/b> 같은 재료의 예로 이어지는 기준이 돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 must + 동사원형\u003c/span> : must + [동사원형] : \"가져야 한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관사 a + 형용사 + 명사\u003c/span> : a + [형용사] + [명사] : \"일정한 단단함\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">부사 too의 추가 의미\u003c/span> : [문장] + , too : \"또한\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"The balls, 공들은. must have, 가져야 한다. a certain stiffness, 일정한 단단함을. too, 또한. 이 문장 전체를 해석하면, 공은 또한 일정한 단단함이 있어야 한다.","hl":"m"},{"n":25,"text":"이 문장은 공의 특성 중 단단함을 추가로 제시해요. 공은 너무 무르거나 너무 단단하면 안 되니까 일정한 정도의 단단함이 필요하다는 뜻이죠. 뒤에서 강철 같은 재료의 예로 이어지는 기준이 됩니다.","hl":"mn"},{"n":26,"text":"첫 번째, must have에서 must는 의무나 필요를 나타내는 조동사라서 뒤에 동사원형 have가 와요. 두 번째, a certain stiffness는 관사 a 뒤에 형용사 certain과 명사 stiffness가 온 명사구로, 여기서 certain은 특정한이 아니라 일정한이라는 뜻이에요. 세 번째, too는 앞의 내용에 더해 또한이라는 추가 의미를 더해서 단단함도 필요하다는 흐름을 만들어 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">A \u003c/span>\u003cspan class=\"tgt\">ball\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가져야 한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">must \u003c/span>\u003cspan class=\"tgt\">have\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정확한 크기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">correct \u003c/span>\u003cspan class=\"tgt\">size\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">공은 크기가 정확해야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 공이 갖추어야 할 기본 조건으로 \u003cb class=\"key\">정확한 \u003c/b>\u003cb class=\"key\">크기\u003c/b>를 제시해요. 앞에서 말한 \u003cb class=\"key\">단단함\u003c/b>이나 뒤에 나올 \u003cb class=\"key\">탄력\u003c/b>처럼 공의 성질이 적절해야 한다는 흐름을 이어 주죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정관사 a의 총칭 용법\u003c/span> : A + [단수 가산명사] : \"공은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 must + 동사원형\u003c/span> : must + [동사원형] : \"가져야 한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">정관사 the + 형용사 + 명사\u003c/span> : the + [형용사] + [명사] : \"정확한 크기\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"A ball, 공은. must have, 가져야 한다. the correct size, 정확한 크기를. 이 문장 전체를 해석하면, 공은 크기가 정확해야 한다.","hl":"m"},{"n":28,"text":"이 문장은 공이 갖추어야 할 기본 조건으로 정확한 크기를 제시해요. 앞에서 말한 단단함이나 뒤에 나올 탄력처럼 공의 성질이 적절해야 한다는 흐름을 이어 주죠.","hl":"mn"},{"n":29,"text":"첫 번째, A ball에서 A는 특정한 하나가 아니라 모든 공을 대표하는 총칭 용법이라서 공은처럼 일반적으로 해석해요. 두 번째, must have에서 must는 의무를 나타내고 뒤에는 동사원형 have가 와요. 세 번째, the correct size는 정관사 the 뒤에 형용사 correct가 명사 size를 꾸민 명사구로, 정확한 크기라는 뜻이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또한,\u003c/span>\u003cspan class=\"en\">Also,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 가져야 한다\u003c/span>\u003cspan class=\"en\">it \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">must \u003c/span>\u003cspan class=\"tgt\">have\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">적절한 무게를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">proper \u003c/span>\u003cspan class=\"tgt\">weight\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">또한, 적절한 무게를 가져야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 공의 크기를 말했으니, 이번에는 무게도 알맞아야 한다는 조건을 더하는 문장입니다. must가 '반드시 ~해야 한다'는 \u003cb class=\"key\">필요\u003c/b>를 나타내서, 공은 \u003cb class=\"key\">적절한 \u003c/b>\u003cb class=\"key\">무게\u003c/b>를 갖춰야 한다는 뜻이 됩니다. 크기와 무게라는 두 가지 조건을 나란히 제시하는 흐름이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 must + 동사원형\u003c/span> : [[조동사 must]] + [동사원형 have] (주어가 3인칭 단수여도 동사원형) : \"가져야 한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">형용사의 명사 수식(proper)\u003c/span> : [the] + [[형용사 proper]] + [명사 weight] : \"적절한 무게\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Also, 또한. it must have, 그것은 가져야 한다. the proper weight, 적절한 무게를. 이 문장 전체를 해석하면, 또한, 적절한 무게를 가져야 한다.","hl":"m"},{"n":31,"text":"앞에서 크기를 말했으니, 이번에는 무게도 알맞아야 한다는 점을 더하는 문장이에요. must가 반드시 해야 한다는 필요를 나타내서, 공은 적절한 무게를 갖춰야 한다는 뜻이 됩니다.","hl":"mn"},{"n":32,"text":"첫 번째, must는 조동사라서 주어가 it이어도 뒤에 동사원형 have가 와요. has라고 쓰면 안 됩니다. 두 번째, proper는 적절한이라는 뜻의 형용사로, 명사 weight 앞에서 그 무게가 어떤 무게인지 꾸며 주는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나,\u003c/span>\u003cspan class=\"en\">However,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 그것이 강철로 만들어진다면,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">if\u003c/span> it \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">made \u003c/span>\u003cspan class=\"tgt\">of\u003c/span> steel,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 너무 단단할 것이다.\u003c/span>\u003cspan class=\"en\">it will be \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">too \u003c/span>\u003cspan class=\"tgt\">stiff\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 강철로 만들어지면 너무 단단할 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 공은 일정한 단단함이 있어야 한다고 했는데, However로 방향을 틀어 지나치면 안 된다는 점을 짚습니다. \u003cb class=\"key\">강철\u003c/b>로 만든 공은 \u003cb class=\"key\">너무 \u003c/b>\u003cb class=\"key\">단단한\u003c/b> 재료라 실제 경기용으로는 알맞지 않다는 예시예요. '적당함'이 핵심이라는 글의 흐름을 만들어 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조건을 나타내는 접속사 if\u003c/span> : [[if]] + [주어 + 동사] , [주어 + 동사] : \"만약 ~라면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태(be made of)\u003c/span> : [be동사] + [[과거분사]] made + of + 재료 : \"~로 만들어지다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">too + 형용사(정도의 과잉)\u003c/span> : [[too]] + [형용사 stiff] : \"너무 단단한\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"However, 그러나. if it is made of steel, 만약 그것이 강철로 만들어진다면. it will be too stiff, 그것은 너무 단단할 것이다.. 이 문장 전체를 해석하면, 그러나 강철로 만들어지면 너무 단단할 것이다.","hl":"m"},{"n":34,"text":"앞에서는 공에 일정한 단단함이 필요하다고 했죠. 그런데 이 문장은 However로 방향을 틀어서, 지나치면 안 된다는 걸 강철이라는 예로 보여 줍니다. 강철로 만든 공은 너무 단단해서 실제 경기에서는 쓸 수 없다는 뜻이에요.","hl":"mn"},{"n":35,"text":"첫 번째, if는 조건을 나타내는 접속사예요. 조건절에서는 미래의 일도 현재시제로 쓰기 때문에 is made라고 합니다. 두 번째, 주어 it이 스스로 만드는 게 아니라 만들어지는 대상이니까 수동태를 쓰고, be동사 뒤에는 과거분사 made가 와요. 세 번째, too는 형용사 stiff 앞에서 부정적인 정도가 지나침을 나타냅니다. 그래서 너무 단단해서 적당하지 않다는 부정적인 느낌이 생기는 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또는,\u003c/span>\u003cspan class=\"en\">Or,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 그것이 발포 고무로 만들어진다면,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">if\u003c/span> it \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">made \u003c/span>\u003cspan class=\"tgt\">from\u003c/span> foam rubber,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 너무 부드러울 것이다.\u003c/span>\u003cspan class=\"en\">it will be \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">too \u003c/span>\u003cspan class=\"tgt\">soft\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">또는, 발포 고무로 만들어지면 너무 부드러울 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞의 강철 예시에 이어, 이번에는 발포 고무라는 정반대 재료를 드는 문장입니다. \u003cb class=\"key\">발포 \u003c/b>\u003cb class=\"key\">고무\u003c/b>로 만든 공은 \u003cb class=\"key\">너무 \u003c/b>\u003cb class=\"key\">부드러운\u003c/b> 성질 때문에 역시 알맞지 않다는 뜻이에요. stiff와 soft가 \u003cb class=\"key\">대조\u003c/b>를 이루면서 '적절함'의 중요성을 강조하는 흐름을 완성합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조건의 접속사 if + 등위접속사 Or\u003c/span> : [[Or]] , [[if]] + [주어 + 동사] , [주어 + 동사] : \"또는 만약 ~라면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태(be made from)\u003c/span> : [be동사] + [[과거분사]] made + from + [[원료]] : \"~로부터 만들어지다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">too + 형용사(정도의 과잉)\u003c/span> : [[too]] + [형용사 soft] : \"너무 부드러운\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Or, 또는. if it is made from foam rubber, 만약 그것이 발포 고무로 만들어진다면. it will be too soft, 그것은 너무 부드러울 것이다.. 이 문장 전체를 해석하면, 또는, 발포 고무로 만들어지면 너무 부드러울 것이다.","hl":"m"},{"n":37,"text":"앞의 강철 예시에 이어서 이번에는 발포 고무라는 정반대 재료를 듭니다. 발포 고무로 만든 공은 너무 부드러워서 마찬가지로 알맞지 않다는 거예요. 이렇게 두 예시가 대조를 이루면서 적절함의 중요성을 강조합니다.","hl":"mn"},{"n":38,"text":"첫 번째, if는 조건의 부사절을 이끌고, Or로 시작해서 앞 문장과 병렬을 이루는 또 다른 경우를 보여 줘요. 두 번째, be made from은 원료가 가공되어 성질이 바뀔 때 쓰는 수동태 표현입니다. 그래서 강철은 be made of, 발포 고무는 be made from으로 구분해요. 세 번째, too는 부정적인 정도가 지나침을 나타내고, soft는 앞 문장의 stiff와 대조를 이룹니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마찬가지로,\u003c/span>\u003cspan class=\"en\">Similarly,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단단함과 함께,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">along \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">stiffness\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공은 필요로 한다\u003c/span>\u003cspan class=\"en\">a ball needs\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">적절한 양의 탄력을.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">proper \u003c/span>\u003cspan class=\"tgt\">amount \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">bounce\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">마찬가지로, 단단함과 함께 공은 적절하게 튕겨야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 공의 \u003cb class=\"key\">단단함\u003c/b>을 조건으로 제시했으니, 이 문장은 그에 \u003cb class=\"key\">추가\u003c/b>되는 또 하나의 조건인 \u003cb class=\"key\">탄력\u003c/b>을 꺼내는 역할을 해요. along with stiffness가 '단단함과 함께'라는 뜻으로 앞 내용에 조건을 하나 더 이어 붙여 주고요. 결국 공은 적절한 정도로 튀어야 한다는 핵심 주장을 담고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구 along with (~와 함께)\u003c/span> : along with + [명사] → '[[~와 함께]]' : \"단단함과 함께\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">amount of + 불가산명사\u003c/span> : a proper amount of + [불가산명사] → '[[적절한 양]]의 ~' : \"적절한 양의 탄력\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"Similarly, 마찬가지로. along with stiffness, 단단함과 함께. a ball needs, 공은 필요로 한다. a proper amount of bounce, 적절한 양의 탄력을.. 이 문장 전체를 해석하면, 마찬가지로, 단단함과 함께 공은 적절하게 튕겨야 한다.","hl":"m"},{"n":40,"text":"앞에서 단단함 이야기를 했으니, 이제 그다음 조건으로 탄력을 꺼내는 문장이에요. along with stiffness라고 해서 단단함과 함께라는 뜻으로, 앞 내용에 조건을 하나 더 얹는 거죠. 결국 공은 적절한 정도의 탄력을 갖춰야 한다는 겁니다.","hl":"mn"},{"n":41,"text":"먼저 along with stiffness를 보세요. along with는 뒤에 명사를 그대로 데리고 오는 전치사구라서 stiffness가 자연스럽게 이어집니다. 두 번째로 a proper amount of bounce에서 amount of는 셀 수 없는 명사 앞에 붙어서 양을 나타내는 표현이에요. 여기에 proper가 들어가서 그냥 탄력이 아니라 적절한 정도의 탄력이라는 점을 꼭 챙겨 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고무로만 만들어진 공은\u003c/span>\u003cspan class=\"en\">A solid rubber ball\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">be\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">너무 잘 튀는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">too \u003c/span>\u003cspan class=\"tgt\">bouncy \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대부분의 스포츠에서.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">most \u003c/span>\u003cspan class=\"tgt\">sports\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">고무로만 만들어진 공은 대부분의 스포츠에서 너무 잘 튈 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 적절한 탄력이 왜 필요한지 \u003cb class=\"key\">구체적인 \u003c/b>\u003cb class=\"key\">예\u003c/b>로 보여 주는 문장이에요. 고무로만 만든 공은 \u003cb class=\"key\">너무 \u003c/b>\u003cb class=\"key\">잘 \u003c/b>\u003cb class=\"key\">튀어서\u003c/b> 대부분의 스포츠에는 맞지 않는다는 뜻이죠. would를 써서 단정이 아니라 \u003cb class=\"key\">가정적 \u003c/b>\u003cb class=\"key\">추측\u003c/b>의 어조로 말하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 would (가정적 추측)\u003c/span> : [주어] + would + [동사원형] → '[[~일 것이다]]' : \"(너무 잘 튀는) 것일 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">too + 형용사 + for + 대상\u003c/span> : too + [형용사] + for + [대상] → '[[대상에게는 너무]] ~하다' : \"대부분의 스포츠에는 너무 잘 튀는\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"A solid rubber ball, 고무로만 만들어진 공은. would be, 일 것이다. too bouncy, 너무 잘 튀는. for most sports, 대부분의 스포츠에서.. 이 문장 전체를 해석하면, 고무로만 만들어진 공은 대부분의 스포츠에서 너무 잘 튈 수 있다.","hl":"m"},{"n":43,"text":"여기서는 적절한 탄력이 왜 필요한지 구체적인 예로 보여 줍니다. 고무로만 만든 공은 너무 잘 튀어서 대부분의 스포츠에는 맞지 않는다는 거죠. would를 써서 실제로 그렇다고 단정하기보다, 그럴 것이라고 가정해서 말하는 겁니다.","hl":"mn"},{"n":44,"text":"먼저 would be를 보세요. would는 뒤에 동사원형이 오면서 그럴 것이라는 가정적 추측을 나타냅니다. 두 번째로 too bouncy for most sports에서 too가 형용사 앞에 붙으면 정도가 지나치다는 뜻이 되고, for는 그 기준이 되는 대상을 붙여 줘요. 그래서 대부분의 스포츠 기준으로는 지나치게 잘 튄다는 의미가 완성됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고\u003c/span>\u003cspan class=\"en\">And\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">점토로만 만들어진 공은\u003c/span>\u003cspan class=\"en\">a solid clay ball\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">튀지 않을 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">bounce\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전혀.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">all\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그리고 점토로만 만들어진 공은 전혀 튀지 않을 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장과 짝을 이루는 \u003cb class=\"key\">반대 \u003c/b>\u003cb class=\"key\">극단\u003c/b>의 예를 드는 문장이에요. 점토로만 만든 공은 \u003cb class=\"key\">전혀 \u003c/b>\u003cb class=\"key\">튀지 \u003c/b>\u003cb class=\"key\">않아\u003c/b> 이 역시 스포츠에 적절하지 않다는 것이죠. 너무 잘 튀는 공과 전혀 안 튀는 공을 나란히 놓아 \u003cb class=\"key\">적절한 \u003c/b>\u003cb class=\"key\">탄력\u003c/b>의 필요성을 뒷받침합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 would의 부정\u003c/span> : [주어] + would not + [동사원형] → '[[~하지 않을 것이다]]' : \"튀지 않을 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부정 강조의 at all\u003c/span> : not + [동사] + at all → '[[전혀]] ~하지 않다' : \"전혀\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"And, 그리고. a solid clay ball, 점토로만 만들어진 공은. would not bounce, 튀지 않을 것이다. at all, 전혀.. 이 문장 전체를 해석하면, 그리고 점토로만 만들어진 공은 전혀 튀지 않을 것이다.","hl":"m"},{"n":46,"text":"앞 문장과 짝을 이루는 반대쪽 예입니다. 이번에는 점토로만 만든 공을 예로 드는데, 이 공은 전혀 튀지 않는다는 거죠. 너무 잘 튀는 공도 안 되고 전혀 안 튀는 공도 안 된다는 두 예를 통해서, 적절한 탄력이 필요하다는 점을 분명히 해 줍니다.","hl":"mn"},{"n":47,"text":"먼저 would not bounce를 보세요. would 뒤에 not이 붙어서 가정한 상황을 부정하는 형태가 되고, 그 뒤에는 여전히 동사원형 bounce가 옵니다. 두 번째로 at all은 부정문 끝에 붙어서 전혀라는 뜻으로 부정을 강하게 밀어 주는 표현이에요. not과 at all이 한 세트로 움직인다는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>우리는 공을 가지고 대부분의 주요 스포츠 활동을 하므로 공은 스포츠에서 매우 \u003cb class=\"key\">중요\u003c/b>하다.\u003c/li>\u003cli>구기 종목에는 사용되는 공의 크기나 무게, 단단함 같은 \u003cb class=\"key\">특성\u003c/b>에 관한 규칙이 있다.\u003c/li>\u003cli>공은 정확한 크기와 적절한 무게를 가져야 하고, 강철처럼 너무 단단하거나 발포 고무처럼 너무 부드러우면 \u003cb class=\"key\">부적합\u003c/b>하다.\u003c/li>\u003cli>단단함과 함께 공은 적절한 양의 \u003cb class=\"key\">탄성\u003c/b>이 필요해서, 너무 잘 튀는 고무 공과 전혀 튀지 않는 점토 공 모두 규칙에 맞지 않는다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Ball sports set rules about the physical characteristics of balls, such as size, weight, stiffness, and bounce, because a ball must be neither too stiff nor too soft and neither too bouncy nor completely dead.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">구기 종목에는 사용되는 공의 크기·무게·단단함·탄성 같은 \u003cb class=\"key\">특성\u003c/b>에 관한 규칙이 있다. 공은 \u003cb class=\"key\">적정\u003c/b>한 단단함과 탄성을 가져야 하며, 강철이나 점토처럼 극단적인 재료는 너무 단단하거나 전혀 튀지 않아 규칙에 맞지 않는다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":48,"text":"오늘 글은 결국 하나로 모여요. 공은 스포츠에서 매우 중요하고, 그래서 크기와 무게, 단단함과 탄성에 관한 규칙이 필요하다는 것, 그리고 그 규칙이 요구하는 것은 언제나 적정값이라는 점이에요. 강철도 점토도, 발포 고무도 고무로만 된 공도 극단은 안 된다는 대조가 이 결론을 단단히 받쳐 주고 있죠. 오늘 배운 비교와 대조의 흐름을 다른 지문에서도 꼭 활용해 보세요. 수고 많았습니다, 다음 시간에 또 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
