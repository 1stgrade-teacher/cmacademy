TIO2MZOOcjI74Gc+uMZYZxjigOGJC8NtOCTg54OQQMj6fmCMZbhSSTgD0yvXOMHgdDgc4wenWnAAK2ACTxuzuONvTBGCAMMR0IJyQDmjR9dtXqu97u3mvzG1G2kdeXpqvs3Tave2mya1dutv//Z\" alt=\"\"></div>","<div class=\"lec-cover-title\">Earth Hour: A Global Symbol of Unity for Our Planet<small>지구 시간: 우리 행성을 위한 단결의 세계적 상징</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">&#39;어스 아워(Earth Hour)&#39;를 이해하기 위해서는 먼저 세계자연기금(WWF)이 주도하는 기후 위기 대응 캠페인의 맥락을 알아두시면 좋아요. 이 행사는 매년 3월 마지막 주 토요일에 전 세계 사람들이 한 시간 동안 전등을 끄는 상징적인 활동을 통해, 환경 보호에 대한 집단적 행동(Collective Action)의 힘을 보여주는 글로벌 환경 운동입니다. 마치 개미들이 힘을 합쳐 커다란 먹이를 옮기듯, 개인의 작은 실천이 모여 환경 변화를 이끌어내는 거대한 에너지가 될 수 있다는 점이 이 행사의 핵심이죠. 단순히 전기를 아끼는 것을 넘어, 우리가 사는 지구의 소중함을 다시금 되새기며 지속 가능한 미래(Sustainable Future)를 위해 전 세계가 함께 연대한다는 점에서 큰 의의가 있답니다. 여러분의 작은 참여가 어떻게 지구를 위한 긍정적인 신호탄이 될 수 있는지 기대하며 이번 내용을 읽어보세요!</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01어스 아워의 시작</div><ul><li>지구를 위해 전등을 끄는 상징적인 행사인 어스 아워의 유래와 기본 정보를 소개한다.</li><li>시작 연도: 2007년</li><li>행사 일시: 3월 25일 토요일, 오후 8시 30분부터 9시 30분까지</li><li>핵심 키워드: 어스 아워(Earth Hour), 소등(lights off)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02행사의 상징적 의미</div><ul><li>단순히 한 시간 동안 불을 끄는 행위를 넘어, 우리가 함께하고 있다는 더 큰 가치를 전달한다.</li><li>행사의 본질: 단순한 소등 그 이상의 의미</li><li>정신적 가치: 단결(unity)과 희망(hope)의 상징</li><li>핵심 키워드: 상징(symbol), 연대(unity)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03집단적 행동의 촉구</div><ul><li>미래와 지구를 위해 모두가 함께 참여하여 강력한 변화를 만들어낼 것을 독려한다.</li><li>집단 행동의 힘(power of collective action) 강조</li><li>참여 대상: 가족, 친구, 이웃 모두</li><li>핵심 키워드: 공동 행동(collective action), 참여(join)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">switch off</td><td class=\"m\">(전기 등을) 끄다, 단절하다</td></tr><tr><td class=\"w\">get together</td><td class=\"m\">모이다, 함께하다</td></tr><tr><td class=\"w\">across the globe</td><td class=\"m\">전 세계에 걸쳐, 세계적으로</td></tr><tr><td class=\"w\">symbolic</td><td class=\"m\">상징적인, 기호의</td></tr><tr><td class=\"w\">unity</td><td class=\"m\">단결, 통일, 일치</td></tr><tr><td class=\"w\">collective</td><td class=\"m\">집단의, 공동의, 총괄적인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">지구촌 전등 끄기 (Earth Hour)</span><span class=\"en\"><b><span class=\"grammar-hl\">Earth Hour</span></b></span></div></div><div class=\"lec-sent-ko\">Earth Hour</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 지구를 보호하는 거창한 활동이 아니라, 평범한 개인이 일상에서 실천하는 사소한 노력이 환경 문제를 해결하는 출발점이 된다는 메시지입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Earth Hour (고유명사): 단체나 캠페인의 명칭으로 쓰인 고유명사 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여러분의 작은 행동이</span><span class=\"en\"><b><span class=\"grammar-hl\">Your small actions</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">구할 수 있습니다</span><span class=\"en\"><b>can save</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리 지구를</span><span class=\"en\"><b>our Earth!</b></span></div></div><div class=\"lec-sent-ko\">여러분의 작은 행동이 우리 지구를 구할 수 있습니다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 지구를 보호하는 거창한 활동이 아니라, 평범한 개인이 일상에서 실천하는 사소한 노력이 환경 문제를 해결하는 출발점이 된다는 메시지입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Your small actions (주어): 문장의 주체로, 대명사 Your와 형용사 small이 명사 actions를 수식하는 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 ‘불이 꺼지는’ 순간은</span><span class=\"en\"><b><span class=\"grammar-hl\">The “lights off” moment</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">시작되었다</span><span class=\"en\"><b>began</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">2007년에</span><span class=\"en\"><b>in 2007.</b></span></div></div><div class=\"lec-sent-ko\">‘불이 꺼지는’ 순간은 2007년에 시작되었습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 일반적인 권유를 구체적인 캠페인의 역사로 연결하며, ‘어스 아워’가 일회성 이벤트가 아니라 오랜 기간 지속된 활동임을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">The “lights off” moment 명사 수식: “lights off”라는 구가 moment라는 명사를 수식하여 특정 시점을 의미하는 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">불을 끄고</span><span class=\"en\"><b><span class=\"grammar-hl\">Switch off</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한 시간을 투자하라</span><span class=\"en\"><b>and give an hour</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지구를 위해</span><span class=\"en\"><b>for Earth!</b></span></div></div><div class=\"lec-sent-ko\">불을 끄고 지구를 위해 한 시간만 투자하세요!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자에게 캠페인의 핵심 행동인 ‘전등 소등’을 직접적으로 요구하며 실천을 촉구하는 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Switch off (동사구): 명령문으로 쓰인 구동사(동사+부사) 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">switch off</td><td class=\"m\">(전기 등을) 끄다, 단절하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">3월 25일 토요일</span><span class=\"en\"><b><span class=\"grammar-hl\">Saturday, March 25</span></b></span></div></div><div class=\"lec-sent-ko\">3월 25일 토요일</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 제안한 행동을 실제로 언제 수행해야 하는지 구체적인 날짜를 명시하여 실천의 가시성을 높입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Saturday, March 25 (동격): 요일과 날짜를 나란히 배치하여 구체화하는 동격 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">불을 끄세요</span><span class=\"en\"><b><span class=\"grammar-hl\">Turn lights off</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오후 8시 30분부터</span><span class=\"en\"><b>from 8:30 p.m.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오후 9시 30분까지</span><span class=\"en\"><b>to 9:30 p.m.</b></span></div></div><div class=\"lec-sent-ko\">오후 8시 30분부터 오후 9시 30분까지 불을 끄세요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 날짜에 이어 구체적인 시간대를 제시하여 독자가 즉각적으로 캠페인에 참여할 수 있도록 상세한 가이드를 제공합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Turn lights off (명령문): 동사 Turn으로 시작하여 상대방에게 행동을 요구하는 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">단지 60분이냐고?</span><span class=\"en\"><b><span class=\"grammar-hl\">Just 60 minutes?</span></b></span></div></div><div class=\"lec-sent-ko\">단지 60분이요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 짧은 시간 동안 불을 끄는 행위가 과연 효과가 있을지 의문을 가질 독자를 위해, 그 시간이 결코 길지 않음을 강조하며 참여의 문턱을 낮춥니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Just 60 minutes? (부사구): Just가 60 minutes라는 명사구를 수식하여 범위를 한정하는 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">네, 단지 한 시간뿐이다.</span><span class=\"en\"><b>Yes, <span class=\"grammar-hl\">just one hour</span>.</b></span></div></div><div class=\"lec-sent-ko\">네, 한 시간만요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 물리적으로 불을 끄는 행위 자체에 그치지 않고, 그 이면에 담긴 더 깊은 가치가 있음을 시사하며 독자의 관심을 환기합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">just one hour (부사구): just가 수량 표현인 one hour를 수식하여 강조하는 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">매년,</span><span class=\"en\"><b>Every year,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 함께 모인다</span><span class=\"en\"><b>we get together</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">전 세계에서</span><span class=\"en\"><b>across the globe</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Earth Hour를 기념하기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to celebrate Earth Hour</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 하나의 상징적인 행동을 취한다:</span><span class=\"en\"><b>and <span class=\"grammar-hl\">take one symbolic action</span>:</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">불을 끄는 것이다</span><span class=\"en\"><b><span class=\"grammar-hl\">switch off</span> the lights</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">단지 한 시간 동안</span><span class=\"en\"><b>just for an hour.</b></span></div></div><div class=\"lec-sent-ko\">매년 우리는 Earth Hour를 기념하기 위해 전 세계에서 함께 모여서 한 가지 상징적인 행동을 취합니다: 한 시간 동안만 불을 끄는 것입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 개별적인 참여를 넘어 전 지구적 연대라는 캠페인의 규모와 성격을 드러내며, 소등 행위가 가진 대외적인 의미를 정의합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to celebrate Earth Hour (to부정사): 부사적 용법(목적)으로 쓰여, &#39;어스 아워를 기념하기 위해서&#39;라는 행동의 의도를 나타냅니다.</div><div class=\"lec-gr-item\">take one symbolic action (동격): 콜론(:)을 사용하여 앞의 action에 대해 &#39;불을 끄는 것&#39;이라는 구체적인 내용을 보충 설명하는 구조입니다.</div><div class=\"lec-gr-item\">switch off (to부정사): 앞의 action을 구체화하는 내용으로, 원래는 (to) switch off처럼 생략된 to부정사 구조로 볼 수 있습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">switch off</td><td class=\"m\">(전기 등을) 끄다, 단절하다</td></tr><tr><td class=\"w\">get together</td><td class=\"m\">모이다, 함께하다</td></tr><tr><td class=\"w\">across the globe</td><td class=\"m\">전 세계에 걸쳐, 세계적으로</td></tr><tr><td class=\"w\">symbolic</td><td class=\"m\">상징적인, 기호의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러나 그것은 이다</span><span class=\"en\"><b>But it is</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">훨씬 그 이상의 것</span><span class=\"en\"><b>so much <span class=\"grammar-hl\">more</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것보다</span><span class=\"en\"><b><span class=\"grammar-hl\">than that</span>.</b></span></div></div><div class=\"lec-sent-ko\">그러나 그것은 훨씬 그 이상입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 물리적으로 불을 끄는 행위 자체에 그치지 않고, 그 이면에 담긴 더 깊은 가치가 있음을 시사하며 독자의 관심을 환기합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">more than that (관용표현): 비교급 구조를 활용하여 &#39;그 이상&#39;이라는 의미를 전달하는 비교 표현입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 11 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 상징이다</span><span class=\"en\"><b><span class=\"grammar-hl\">It is a symbol</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">화합의</span><span class=\"en\"><b><span class=\"grammar-hl\">of unity.</span></b></span></div></div><div class=\"lec-sent-ko\">그것은 화합의 상징입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장을 받아 소등 행위가 전 세계인들이 지구를 위해 마음을 모으고 있다는 연결감을 상징한다는 점을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It is a symbol of unity. (2형식): &#39;주어(It) + be동사 + 보어(a symbol of unity)&#39; 구조로 주어의 상태나 정체를 설명합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">unity</td><td class=\"m\">단결, 통일, 일치</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 12 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 상징이다</span><span class=\"en\"><b><span class=\"grammar-hl\">It is a symbol</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">희망의</span><span class=\"en\"><b><span class=\"grammar-hl\">of hope.</span></b></span></div></div><div class=\"lec-sent-ko\">희망의 상징입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에 이어, 환경 문제라는 위기 상황 속에서도 우리가 함께 노력하면 더 나은 미래를 만들 수 있다는 긍정적인 메시지를 전달합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It is a symbol of hope. (2형식): &#39;주어(It) + be동사 + 보어(a symbol of hope)&#39; 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 13 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">보여 주자</span><span class=\"en\"><b><span class=\"grammar-hl\">Let’s show</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">집단 행동의 힘을</span><span class=\"en\"><b>the power of collective action</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 미래와 지구를 위한</span><span class=\"en\"><b>for our future and planet!</b></span></div></div><div class=\"lec-sent-ko\">우리의 미래와 지구를 위한 집단행동의 힘을 보여 줍시다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 캠페인의 본질인 ‘공동의 실천’이 실질적인 변화를 이끌어낼 수 있음을 강조하며 독자의 참여 의지를 북돋웁니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Let’s show (사역동사): Let&#39;s(Let us)를 사용하여 &#39;~하자&#39;라는 제안을 나타내며, show(동사원형)가 목적보어 역할을 합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">collective</td><td class=\"m\">집단의, 공동의, 총괄적인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 14 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리가 함께라면,</span><span class=\"en\"><b><span class=\"grammar-hl\">If we are together</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 더 많은 것을 할 수 있다</span><span class=\"en\"><b>we can do more!</b></span></div></div><div class=\"lec-sent-ko\">우리가 함께라면 더 많은 것을 할 수 있습니다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 개인이 아닌 ‘우리’가 모였을 때 얻게 되는 시너지를 강조하며 집단적 행동의 필요성을 다시 한번 역설합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">If we are together (조건절): 접속사 If를 사용하여 조건을 설정하는 부사절 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 15 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 행사에 참여하라</span><span class=\"en\"><b><span class=\"grammar-hl\">Join this event</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분의 가족, 친구, 그리고 이웃들과 함께</span><span class=\"en\"><b>with your family, friends, and neighbors.</b></span></div></div><div class=\"lec-sent-ko\">가족, 친구, 이웃과 함께 이 행사에 참여하세요!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 마지막으로 캠페인 참여 대상을 주변 사람으로 확장함으로써, 독자가 자신의 삶의 현장에서 실천을 이어가도록 유도하는 결론입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Join this event (명령문): 동사 Join으로 시작하는 3형식 구조로, this event가 목적어입니다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>‘어스 아워’는 2007년부터 시작된 전 세계적인 소등 캠페인이다.</li><li>단순히 한 시간 동안 불을 끄는 것을 넘어 지구를 위한 화합과 희망을 상징한다.</li><li>개개인의 작은 실천이 모여 공동의 힘을 발휘하면 지구의 미래를 바꿀 수 있다.</li><li>가족, 이웃과 함께 이 의미 있는 행사에 참여하여 변화를 만들자고 독려한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Earth Hour serves as a global symbol of unity to protect the planet, and it encourages collective participation to create a sustainable future.</div>\n              <div class=\"lec-final-sum-ko\">&#39;지구 시간&#39;은 행성을 보호하기 위한 세계적인 단결의 상징으로 작용하며, 지속 가능한 미래를 만들기 위해 공동의 참여를 독려한다.</div></div></div>"],"segs":[[{"audio":"./reading14_audio/1.mp3","hl":null}],[{"audio":"./reading14_audio/2.mp3","hl":null}],[{"audio":"./reading14_audio/3.mp3","hl":nu
