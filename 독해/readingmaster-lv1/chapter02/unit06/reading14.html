<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터1 Reading 14 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터1 Reading 14","audioDir":"reading14_audio","preview":false,"count":49,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.668em\">Reading\u003cbr>14\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터1\u003c/div>\u003ch1>Earth Hour: A Small Action, a Symbol of Hope\u003c/h1>\u003ch2>Earth Hour: 작은 행동, 희망의 상징\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>Earth Hour는 매년 전 세계 사람들이 한 시간 동안 불을 끄며 \u003cb class=\"key\">화합\u003c/b>과 \u003cb class=\"key\">희망\u003c/b>을 상징하는 행사이다. 단 한 시간의 작은 실천이 모여 우리의 미래와 지구를 위한 \u003cb class=\"key\">집단행동\u003c/b>의 힘을 보여 준다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Earth Hour is a symbolic one-hour lights-off event that shows the power of collective action for our future and planet.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 Earth Hour를 소개하는 글을 함께 읽어 볼게요. 이 글은 작은 행동이 지구를 구할 수 있다는 메시지와 함께, 매년 전 세계가 한 시간 동안 불을 끄는 상징적인 행사를 안내하고 있어요. 핵심은 Earth Hour가 단순한 소등을 넘어 화합과 희망의 상징이며, 집단행동의 힘을 보여 준다는 점이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">Earth Hour는 기후변화(climate change)에 대한 관심을 높이기 위해 시작된 세계적인 환경 캠페인이에요. 이천칠 년 호주 시드니에서 처음 시작되었고, 지금은 전 세계 많은 도시가 참여하는 \u003cb class=\"key\">상징적 \u003c/b>\u003cb class=\"key\">행동\u003c/b>이 되었죠. 한 시간 동안 불을 끄는 일은 전기를 아끼는 직접적인 효과도 있지만, 더 큰 목적은 \u003cb class=\"key\">기후변화\u003c/b>와 \u003cb class=\"key\">에너지 \u003c/b>\u003cb class=\"key\">절약\u003c/b>의 중요성을 알리는 데 있어요. 마치 학교 전체가 같은 시간에 교실 불을 끄며 ‘우리는 함께 실천하고 있다’는 메시지를 보내는 것과 비슷하죠. 이처럼 작은 행동이 모여 \u003cb class=\"key\">집단행동\u003c/b>의 힘을 보여 준다는 점이 Earth Hour의 핵심이에요.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 짚어 볼게요. Earth Hour는 기후변화, climate change에 대한 관심을 높이기 위해 시작된 세계적인 환경 캠페인이에요. 이천칠 년 호주 시드니에서 처음 시작되었고, 지금은 전 세계 많은 도시가 참여하는 상징적 행동이 되었죠. 한 시간 동안 불을 끄는 일은 에너지 절약, energy saving의 직접적인 효과도 있지만, 더 큰 목적은 기후변화의 심각성을 알리는 데 있어요. 마치 학교 전체가 같은 시간에 교실 불을 끄며 우리는 함께 실천하고 있다는 메시지를 보내는 것과 비슷하죠. 이처럼 작은 행동이 모여 집단행동의 힘을 보여 준다는 점이 Earth Hour의 핵심이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>행사 소개\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>1번 문장은 Earth Hour의 슬로건으로, \u003cb class=\"key\">작은 \u003c/b>\u003cb class=\"key\">행동\u003c/b>이 지구를 구할 수 있다고 말한다. 2번 문장은 ‘불이 꺼지는’ 순간이 2007년에 시작되었음을 알려 주고, 3번 문장은 불을 끄고 지구를 위해 \u003cb class=\"key\">한 \u003c/b>\u003cb class=\"key\">시간\u003c/b>을 내어 달라는 직접적인 요청을 한다. 즉 도입부에서 행사의 이름과 취지, 기본 행동을 제시한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>일시와 질문\u003csmall>행사 안내 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>4번 문장은 3월 25일 토요일 오후 8시 30분부터 9시 30분까지 불을 끄라고 안내하면서, ‘단지 60분이요?’라는 \u003cb class=\"key\">질문\u003c/b>을 던진다. 5번 문장은 ‘네, 한 시간만요.’라고 답하며 행동의 시간이 짧음을 강조한다. 이 짧은 시간은 뒤에서 \u003cb class=\"key\">상징성\u003c/b>을 부각하는 발판이 된다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>의미 전환\u003csmall>전환 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>6번 문장은 매년 전 세계가 모여 한 가지 \u003cb class=\"key\">상징적 \u003c/b>\u003cb class=\"key\">행동\u003c/b>으로 한 시간 동안 불을 끈다고 설명한다. 7번 문장은 ‘그러나 그것은 훨씬 그 이상’이라고 말하며 단순한 소등을 넘어선 \u003cb class=\"key\">의미\u003c/b>로 시선을 돌린다. 여기서 글의 초점이 행사 안내에서 가치 설명으로 전환된다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>상징과 힘\u003csmall>주장 · 문장 8–11\u003c/small>\u003c/h4>\u003cp>8번과 9번 문장은 Earth Hour가 \u003cb class=\"key\">화합\u003c/b>과 \u003cb class=\"key\">희망\u003c/b>의 상징임을 밝힌다. 10번 문장은 미래와 지구를 위한 \u003cb class=\"key\">집단행동\u003c/b>의 힘을 보여 주자고 촉구하고, 11번 문장은 함께라면 더 많은 것을 할 수 있다는 조건의 힘을 강조한다. 즉 소등의 의미가 개인의 행동에서 공동의 실천으로 확장된다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>참여 촉구\u003csmall>결론 · 문장 12\u003c/small>\u003c/h4>\u003cp>12번 문장은 가족, 친구, 이웃과 함께 이 \u003cb class=\"key\">행사\u003c/b>에 참여하라고 권한다. 앞에서 제시한 상징과 집단행동의 가치를 실제 \u003cb class=\"key\">참여\u003c/b>로 이어 달라는 마무리이다. 짧은 소등이 공동체적 실천으로 완성된다는 점을 강조한다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 행사 소개에서 질문과 답, 의미 전환, 상징 설명, 참여 촉구로 이어지는 글의 흐름을 단계별로 살펴볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 행사 소개예요. 첫 번째 문장은 Earth Hour의 슬로건으로, 작은 행동이 지구를 구할 수 있다고 말하죠. 두 번째 문장은 불이 꺼지는 순간이 이천칠 년에 시작되었다는 배경을 알려 주고, 세 번째 문장은 불을 끄고 지구를 위해 한 시간을 내어 달라고 요청해요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 일시와 질문을 제시하는 행사 안내예요. 네 번째 문장은 삼월 이십오일 토요일, 오후 여덟 시 삼십 분부터 아홉 시 삼십 분까지 불을 끄라고 안내하면서 단지 육십 분이냐는 질문을 던져요. 다섯 번째 문장은 네, 한 시간만이라고 답하면서 행동의 시간이 짧다는 점을 강조하죠. 이 짧은 시간은 뒤에서 상징성을 부각하는 발판이 돼요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 의미 전환이에요. 여섯 번째 문장은 매년 전 세계가 모여 한 가지 상징적 행동으로 한 시간 동안 불을 끈다고 설명해요. 일곱 번째 문장은 그러나 그것은 훨씬 그 이상이라며 단순한 소등을 넘어선 의미로 시선을 돌리죠. 여기서 글의 초점이 행사 안내에서 가치 설명으로 바뀌어요.","hl":"f2"},{"n":7,"text":"네 번째 단계는 상징과 힘을 설명하는 부분이에요. 여덟 번째와 아홉 번째 문장은 Earth Hour가 화합과 희망의 상징임을 밝혀요. 열 번째 문장은 미래와 지구를 위한 집단행동의 힘을 보여 주자고 촉구하고, 열한 번째 문장은 함께라면 더 많은 것을 할 수 있다는 조건의 힘을 강조하죠. 즉 소등의 의미가 개인의 행동에서 공동의 실천으로 확장돼요.","hl":"f3"},{"n":8,"text":"다섯 번째 단계는 참여 촉구예요. 열두 번째 문장은 가족, 친구, 이웃과 함께 이 행사에 참여하라고 권해요. 앞에서 제시한 상징과 집단행동의 가치를 실제 참여로 이어 달라는 마무리죠. 짧은 소등이 공동체적 실천으로 완성된다는 점을 강조해요.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">질문-답변\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 10번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">도입부에서 행사 일시를 안내하고 ‘단지 60분이요?’라는 \u003cb class=\"key\">질문\u003c/b>과 답으로 흥미를 끈 뒤, 7번 문장의 ‘But’으로 전환한다. 이어 8~10번 문장에서 화합과 희망의 \u003cb class=\"key\">상징\u003c/b>, 집단행동의 힘을 밝히므로 핵심 주장은 뒤쪽에 나온다. 따라서 주제문은 10번 문장으로 볼 수 있고, 글의 구조는 \u003cb class=\"key\">미괄식\u003c/b>이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>from (4)\u003c/b>\u003cspan>시간 범위 제시\u003c/span>\u003cb>Every year (6)\u003c/b>\u003cspan>반복·일반화\u003c/span>\u003cb>But (7)\u003c/b>\u003cspan>전환\u003c/span>\u003cb>Let's (10)\u003c/b>\u003cspan>주장·촉구\u003c/span>\u003cb>If (11)\u003c/b>\u003cspan>조건 제시\u003c/span>\u003cb>Join (12)\u003c/b>\u003cspan>행동 촉구\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">small actions\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">one symbolic action\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">symbol of unity\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">symbol of hope\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">collective action\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">together\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>단 한 시간의 소등\u003c/th>\u003cth>그 이상의 상징적 의미\u003c/th>\u003c/tr>\u003ctr>\u003ctd>행사 안내: 날짜와 시간\u003c/td>\u003ctd>행사 의미: 상징과 공동 실천\u003c/td>\u003c/tr>\u003ctr>\u003ctd>표면적 행동: 불 끄기\u003c/td>\u003ctd>본질적 메시지: 미래와 지구를 위한 집단행동\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글은 질문과 답을 활용한 전개 방식이에요. 도입부에서 행사 일시를 안내하고 단지 육십 분이냐는 질문과 답으로 흥미를 끈 뒤, But으로 전환하죠. 이어 화합과 희망의 상징과 집단행동의 힘을 밝히므로 핵심 주장은 뒤쪽에 나와요. 그래서 주제문은 열 번째 문장으로 볼 수 있고, 전체 구조는 미괄식이에요.","hl":"ty"},{"n":10,"text":"신호어를 보면 여섯 번째 문장의 Every year는 반복과 일반화를, 일곱 번째 문장의 But은 전환을 알려 줘요. 열 번째 문장의 Let's와 열두 번째 문장의 Join은 주장과 행동 촉구를 강화하죠. 또한 one symbolic action, symbol of unity, symbol of hope, collective action처럼 표현을 바꿔 가며 같은 메시지를 재진술해요. 단순한 소등과 그 이상의 의미라는 대조를 잡으면 글의 중심이 선명해져요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>Earth Hour\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지구의 시간(환경 캠페인)\u003c/span>\u003c/div>\u003cdiv>\u003cb>small action\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>작은 행동\u003c/span>\u003c/div>\u003cdiv>\u003cb>save\u003c/b>\u003cem>동사\u003c/em>\u003cspan>구하다, 지키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>lights off\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>불이 꺼진 상태\u003c/span>\u003c/div>\u003cdiv>\u003cb>moment\u003c/b>\u003cem>명사\u003c/em>\u003cspan>순간\u003c/span>\u003c/div>\u003cdiv>\u003cb>begin\u003c/b>\u003cem>동사\u003c/em>\u003cspan>시작되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>switch off\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>(불·전원을) 끄다\u003c/span>\u003c/div>\u003cdiv>\u003cb>give\u003c/b>\u003cem>동사\u003c/em>\u003cspan>주다, (시간을) 내어 주다\u003c/span>\u003c/div>\u003cdiv>\u003cb>turn off\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>끄다\u003c/span>\u003c/div>\u003cdiv>\u003cb>from A to B\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>A부터 B까지\u003c/span>\u003c/div>\u003cdiv>\u003cb>just\u003c/b>\u003cem>부사\u003c/em>\u003cspan>단지, 그저\u003c/span>\u003c/div>\u003cdiv>\u003cb>get together\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>모이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>across the globe\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>전 세계에 걸쳐\u003c/span>\u003c/div>\u003cdiv>\u003cb>celebrate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>기념하다, 축하하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>symbolic\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>상징적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>action\u003c/b>\u003cem>명사\u003c/em>\u003cspan>행동\u003c/span>\u003c/div>\u003cdiv>\u003cb>more than\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~ 이상, ~보다 더\u003c/span>\u003c/div>\u003cdiv>\u003cb>symbol\u003c/b>\u003cem>명사\u003c/em>\u003cspan>상징\u003c/span>\u003c/div>\u003cdiv>\u003cb>unity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>화합, 단결\u003c/span>\u003c/div>\u003cdiv>\u003cb>hope\u003c/b>\u003cem>명사\u003c/em>\u003cspan>희망\u003c/span>\u003c/div>\u003cdiv>\u003cb>show\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보여 주다\u003c/span>\u003c/div>\u003cdiv>\u003cb>power\u003c/b>\u003cem>명사\u003c/em>\u003cspan>힘\u003c/span>\u003c/div>\u003cdiv>\u003cb>collective\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>집단적인, 공동의\u003c/span>\u003c/div>\u003cdiv>\u003cb>future\u003c/b>\u003cem>명사\u003c/em>\u003cspan>미래\u003c/span>\u003c/div>\u003cdiv>\u003cb>planet\u003c/b>\u003cem>명사\u003c/em>\u003cspan>행성, 지구\u003c/span>\u003c/div>\u003cdiv>\u003cb>together\u003c/b>\u003cem>부사\u003c/em>\u003cspan>함께\u003c/span>\u003c/div>\u003cdiv>\u003cb>join\u003c/b>\u003cem>동사\u003c/em>\u003cspan>참여하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>event\u003c/b>\u003cem>명사\u003c/em>\u003cspan>행사\u003c/span>\u003c/div>\u003cdiv>\u003cb>neighbor\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이웃\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"핵심 단어로는 switch off, turn off, celebrate, symbolic, collective을 꼭 챙겨 주세요. switch off와 turn off는 둘 다 불이나 전원을 끄다는 뜻이고, celebrate는 기념하다, symbolic은 상징적인, collective는 공동의라는 의미예요. join은 행사에 참여하다는 뜻으로 마지막 참여 촉구와 연결됩니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">save\u003c/b>\u003cspan class=\"m\">구하다, 지키다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">protect\u003c/span>\u003cspan class=\"s\">preserve\u003c/span>\u003cspan class=\"s\">rescue\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">harm\u003c/span>\u003cspan class=\"a\">destroy\u003c/span>\u003cspan class=\"a\">waste\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">switch off\u003c/b>\u003cspan class=\"m\">(불·전원을) 끄다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">turn off\u003c/span>\u003cspan class=\"s\">shut off\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">turn on\u003c/span>\u003cspan class=\"a\">switch on\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">celebrate\u003c/b>\u003cspan class=\"m\">기념하다, 축하하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">commemorate\u003c/span>\u003cspan class=\"s\">honor\u003c/span>\u003cspan class=\"s\">observe\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003cspan class=\"a\">neglect\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">symbol\u003c/b>\u003cspan class=\"m\">상징\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">sign\u003c/span>\u003cspan class=\"s\">emblem\u003c/span>\u003cspan class=\"s\">representation\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">unity\u003c/b>\u003cspan class=\"m\">화합, 단결\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">harmony\u003c/span>\u003cspan class=\"s\">solidarity\u003c/span>\u003cspan class=\"s\">oneness\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">division\u003c/span>\u003cspan class=\"a\">separation\u003c/span>\u003cspan class=\"a\">discord\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">collective\u003c/b>\u003cspan class=\"m\">집단적인, 공동의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">shared\u003c/span>\u003cspan class=\"s\">joint\u003c/span>\u003cspan class=\"s\">common\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">individual\u003c/span>\u003cspan class=\"a\">personal\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">join\u003c/b>\u003cspan class=\"m\">참여하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">participate in\u003c/span>\u003cspan class=\"s\">take part in\u003c/span>\u003cspan class=\"s\">engage in\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">leave\u003c/span>\u003cspan class=\"a\">withdraw\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어도 함께 정리해 볼게요. save는 protect, preserve와 가깝고 harm, destroy와 반대돼요. switch off는 turn off, shut off와 비슷하고 turn on과 반대되죠. unity는 harmony, solidarity와 가깝고 division, discord와 반대되며, collective는 shared, joint와 가깝고 individual과 반대돼요. join은 participate in, take part in과 비슷하고 leave, withdraw와 반대됩니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지구의 시간(Earth Hour)\u003c/span>\u003cspan class=\"en\">Earth Hour\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분의 작은 행동들은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Your \u003c/span>\u003cspan class=\"tgt\">small \u003c/span>\u003cspan class=\"tgt\">actions\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">구할 수 있습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">save\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 지구를!\u003c/span>\u003cspan class=\"en\">our Earth!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여러분의 작은 행동이 우리 지구를 구할 수 있습니다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 거대한 일이 아니라 \u003cb class=\"key\">작은 \u003c/b>\u003cb class=\"key\">행동\u003c/b>에서 지구를 구하는 일이 시작된다는 점을 압축한 표어예요. 제목 Earth Hour 바로 아래에 붙어 글 전체의 \u003cb class=\"key\">주제\u003c/b>를 미리 던져 주는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">한정사 + 형용사 + 복수 명사의 주어\u003c/span> : [한정사 Your] + [형용사 small] + [복수 명사 actions] : \"여러분의 작은 행동들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 can + 동사원형\u003c/span> : [주어] + [조동사 can] + [동사원형 save] : \"구할 수 있다\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"Earth Hour, 지구의 시간(Earth Hour). Your small actions, 여러분의 작은 행동들은. can save, 구할 수 있습니다. our Earth!, 우리 지구를!. 이 문장 전체를 해석하면, 여러분의 작은 행동이 우리 지구를 구할 수 있습니다!","hl":"m"},{"n":14,"text":"이 문장은 제목과 부제가 나란히 붙어 있는 형태예요. 여러분의 작은 행동이 우리 지구를 구할 수 있다는 뜻으로, 글 전체의 주제를 아주 짧게 압축해서 보여 주고 있죠. 그래서 표어처럼 힘 있게 읽어 주시면 좋아요.","hl":"mn"},{"n":15,"text":"첫 번째로 Your small actions를 보면, 한정사 Your 뒤에 형용사 small이 오고 복수 명사 actions가 와서 '여러분의 작은 행동들'이라는 주어를 만들어요. 두 번째로 can save를 보면, 조동사 can 뒤에는 반드시 동사원형이 와서 '구할 수 있다'는 뜻이 되죠. 조동사가 있으면 동사에 s를 붙이지 않는다는 점도 같이 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘불이 꺼지는’ 순간은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">The \u003c/span>\u003cspan class=\"tgt\">&quot;lights \u003c/span>\u003cspan class=\"tgt\">off \u003c/span>\u003cspan class=\"tgt\">&quot; \u003c/span>\u003cspan class=\"tgt\">moment\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시작되었습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">began \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">2007년에.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">2007\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">‘불이 꺼지는’ 순간은 2007년에 시작되었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 행사가 처음 출발한 \u003cb class=\"key\">시점\u003c/b>을 제시하는 문장이에요. 따옴표 안의 lights off가 캠페인의 정체성을 한마디로 보여 주고, 2007년이라는 \u003cb class=\"key\">연도\u003c/b>가 행사의 역사를 뒷받침해 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">따옴표 표현의 명사 앞 수식\u003c/span> : [The] + [&quot;lights off &quot;] + [moment(핵 명사)] : \"‘불이 꺼지는’ 순간\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">자동사의 과거형 + 시간의 전치사구\u003c/span> : [주어 The moment] + [자동사 began] + [in + 연도] : \"2007년에 시작되었다\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"The \"lights off \" moment, ‘불이 꺼지는’ 순간은. began, 시작되었습니다. in 2007, 2007년에.. 이 문장 전체를 해석하면, ‘불이 꺼지는’ 순간은 2007년에 시작되었습니다.","hl":"m"},{"n":17,"text":"이 문장은 이 행사가 언제 시작되었는지 알려 주는 문장이에요. 따옴표 안의 lights off라는 말이 이 캠페인의 정체성을 한마디로 보여 주고, 2007년이라는 연도가 행사의 역사를 뒷받침해 주죠. 그래서 시점을 알려 주는 문장이라고 정리해 두면 좋아요.","hl":"mn"},{"n":18,"text":"첫 번째로 The lights off moment를 보면, 따옴표로 묶인 lights off가 형용사처럼 명사 앞에서 moment를 꾸며 주는 명사 앞 수식 구조예요. 두 번째로 began in 2007을 보면, begin은 여기서 '시작되다'라는 뜻의 자동사로 목적어 없이 쓰였고, 과거 시점이라 began이라는 과거형이 왔어요. 연도 앞에는 전치사 in을 붙인다는 것도 함께 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">불을 끄고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Switch \u003c/span>\u003cspan class=\"tgt\">off\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 주세요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">give\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 시간을\u003c/span>\u003cspan class=\"en\">an hour\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지구를 위해!\u003c/span>\u003cspan class=\"en\">for Earth!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">불을 끄고 지구를 위해 한 시간만 투자하세요!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 독자에게 실제 \u003cb class=\"key\">행동\u003c/b>을 요구하는 명령문이에요. 한 시간이라는 짧은 시간을 내세워 부담을 낮추고, 지구를 위한 일이라는 \u003cb class=\"key\">가치\u003c/b>를 붙여 참여를 이끌어 냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문(동사원형으로 시작)\u003c/span> : [동사원형 Switch] + [부사 off] : \"불을 끄세요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 and에 의한 병렬\u003c/span> : [명령문 Switch off] + and + [명령문 give] : \"그리고 주세요\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"Switch off, 불을 끄고. and give, 그리고 주세요. an hour, 한 시간을. for Earth!, 지구를 위해!. 이 문장 전체를 해석하면, 불을 끄고 지구를 위해 한 시간만 투자하세요!","hl":"m"},{"n":20,"text":"이 문장은 독자에게 실제로 무엇을 하라고 말하는 명령문이에요. 한 시간이라는 짧은 시간을 제시해서 부담을 낮추고, 지구를 위한 일이라는 가치를 붙여서 참여를 이끌어 내죠. 그래서 행동을 요구하는 문장이라고 정리하면 됩니다.","hl":"mn"},{"n":21,"text":"첫 번째로 Switch off를 보면, 명령문은 주어 You를 생략하고 동사원형으로 시작해요. switch off는 전원을 끄다라는 구동사라서 off가 동사 뒤에 붙어 있죠. 두 번째로 and give를 보면, 두 개의 명령을 and로 이어 병렬 구조를 만들었어요. 그래서 뒤의 give도 앞과 똑같이 동사원형으로 씁니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">3월 25일 토요일\u003c/span>\u003cspan class=\"en\">Saturday, March 25\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">불을 끄세요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Turn \u003c/span>\u003cspan class=\"tgt\">lights \u003c/span>\u003cspan class=\"tgt\">off\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오후 8시 30분부터 오후 9시 30분까지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">8:30 \u003c/span>\u003cspan class=\"tgt\">p.m. \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">9:30 \u003c/span>\u003cspan class=\"tgt\">p.m.\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단지 60분이요?\u003c/span>\u003cspan class=\"en\">Just 60 minutes?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">3월 25일 토요일 오후 8시 30분부터 오후 9시 30분까지 불을 끄세요. 단지 60분이요?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 행사의 날짜와 시간, 그리고 실제로 해야 할 행동을 안내하는 문장입니다. \u003cb class=\"key\">명령문\u003c/b>으로 불을 끄라고 직접 요청하고, 이어서 \u003cb class=\"key\">의문문\u003c/b>으로 단지 60분이냐고 되물어 시간이 아주 짧다는 인상을 남깁니다. 그래서 다음 문장의 대답이 자연스럽게 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문(imperative)\u003c/span> : [동사원형] + 목적어 + 부사 → '~하세요' : \"불을 끄세요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">from A to B (시간의 시작과 끝)\u003c/span> : from [시작 시점] to [끝나는 시점] : \"오후 8시 30분부터 오후 9시 30분까지\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"Saturday, March 25, 3월 25일 토요일. Turn lights off, 불을 끄세요. from 8:30 p.m. to 9:30 p.m, 오후 8시 30분부터 오후 9시 30분까지. Just 60 minutes?, 단지 60분이요?. 이 문장 전체를 해석하면, 3월 25일 토요일 오후 8시 30분부터 오후 9시 30분까지 불을 끄세요. 단지 60분이요?","hl":"m"},{"n":23,"text":"이 문장은 행사의 날짜와 시간, 그리고 실제로 해야 할 행동을 안내하고 있어요. 명령문으로 불을 끄라고 직접 요청하고, 이어서 의문문으로 단지 육십 분이냐고 되물으면서 시간이 아주 짧다는 인상을 남기죠. 그래서 바로 다음 문장의 대답이 자연스럽게 이어집니다.","hl":"mn"},{"n":24,"text":"첫 번째, Turn lights off를 보세요. 주어 없이 동사원형으로 시작하는 명령문이에요. 상대에게 불을 끄라고 직접 요청하는 형태죠. 두 번째, from eight thirty p.m. to nine thirty p.m.는 from A to B, 즉 시간의 범위를 시작점과 끝점으로 보여 주는 전치사구예요. 그래서 '몇 시부터 몇 시까지'라는 해석이 딱 떨어집니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">네,\u003c/span>\u003cspan class=\"en\">Yes,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 시간만요.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">just \u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">hour\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">네, 한 시간만요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞의 질문에 Yes로 답하면서 'just one hour'로 \u003cb class=\"key\">한 \u003c/b>\u003cb class=\"key\">시간\u003c/b>만 하면 된다는 점을 다시 확인시켜 줍니다. 'just'가 \u003cb class=\"key\">부담\u003c/b>을 확 낮춰 주어, 누구나 쉽게 동참할 수 있다는 분위기를 만듭니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">한정 부사 just\u003c/span> : just + [명사구] → '단지 ~만' : \"한 시간만요\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"Yes, 네. just one hour, 한 시간만요.. 이 문장 전체를 해석하면, 네, 한 시간만요.","hl":"m"},{"n":26,"text":"앞에서 단지 육십 분이냐고 물었죠. 여기서 Yes로 받아 주면서 just one hour, 즉 한 시간만 하면 된다는 걸 다시 확인시켜 줍니다. just 덕분에 부담이 확 낮아지고, 누구나 쉽게 동참할 수 있다는 분위기가 만들어져요.","hl":"mn"},{"n":27,"text":"여기서 just는 한정의 부사예요. 뒤에 오는 one hour의 범위를 좁혀서 단지 한 시간, 그 이상은 아니라는 뜻을 만들어 주죠. 그래서 Yes, just one hour는 '네, 한 시간만요'라고 가볍게 답하는 표현이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매년\u003c/span>\u003cspan class=\"en\">Every year,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 전 세계에서 함께 모여서\u003c/span>\u003cspan class=\"en\">we get together across the globe\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Earth Hour를 기념하기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">celebrate \u003c/span>\u003cspan class=\"tgt\">Earth \u003c/span>\u003cspan class=\"tgt\">Hour \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 가지 상징적인 행동을 취합니다:\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">take \u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">symbolic \u003c/span>\u003cspan class=\"tgt\">action\u003c/span>:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 시간 동안만 불을 끄는 것입니다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">switch \u003c/span>\u003cspan class=\"tgt\">off \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">lights \u003c/span>\u003cspan class=\"tgt\">just \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">hour\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">매년 우리는 Earth Hour를 기념하기 위해 전 세계에서 함께 모여서 한 가지 상징적인 행동을 취합니다: 한 시간 동안만 불을 끄는 것입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 행사의 목적과 핵심 행동을 한 번에 제시하는 \u003cb class=\"key\">주제문\u003c/b>입니다. \u003cb class=\"key\">to부정사\u003c/b>로 목적을 밝히고, 콜론 뒤에 구체적 행동을 붙여 'one symbolic action'이 무엇인지 풀어 줍니다. 'symbolic'에서 보이듯 이 행동의 가치는 절약이 아니라 \u003cb class=\"key\">상징성\u003c/b>에 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)과 병렬\u003c/span> : we get together [to celebrate ... and (to) take ...] : \"Earth Hour를 기념하고 한 가지 상징적인 행동을 취하기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">콜론(:) 뒤의 동격 설명(원형동사구)\u003c/span> : one symbolic action: [switch off ...] : \"한 시간 동안만 불을 끄는 것\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"Every year, 매년. we get together across the globe, 우리는 전 세계에서 함께 모여서. to celebrate Earth Hour, Earth Hour를 기념하기 위해. and take one symbolic action, 한 가지 상징적인 행동을 취합니다:. switch off the lights just for an hour, 한 시간 동안만 불을 끄는 것입니다.. 이 문장 전체를 해석하면, 매년 우리는 Earth Hour를 기념하기 위해 전 세계에서 함께 모여서 한 가지 상징적인 행동을 취합니다: 한 시간 동안만 불을 끄는 것입니다.","hl":"m"},{"n":29,"text":"이 문장은 이 글의 주제문이에요. 매년 전 세계가 모여서 무엇을, 왜 하는지를 한 번에 보여 주죠. to부정사로 목적을 밝히고, 콜론 뒤에서 그 한 가지 상징적인 행동이 무엇인지 구체적으로 설명합니다. 중요한 건 symbolic이라는 단어예요. 불을 끄는 행동의 가치는 절약이 아니라 상징성에 있다는 점을 꼭 짚어 주세요.","hl":"mn"},{"n":30,"text":"첫 번째, to celebrate와 take를 보세요. 모여서 하는 목적을 to부정사로 밝힌 구조예요. 그리고 celebrate와 take는 and로 병렬되어 하나의 to를 함께 나눠 쓰죠. 두 번째, 콜론 뒤에 switch off the lights가 원형동사구로 와서 앞의 one symbolic action과 동격으로 이어집니다. 어려운 내용을 콜론으로 바로 풀어 주는 아주 시험에 잘 나오는 구조예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나\u003c/span>\u003cspan class=\"en\">But\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 훨씬 더 많은 것입니다\u003c/span>\u003cspan class=\"en\">it is \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">so \u003c/span>\u003cspan class=\"tgt\">much \u003c/span>\u003cspan class=\"tgt\">more\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것보다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">that\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 그것은 훨씬 그 이상입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 '한 시간 동안 불을 끄는 것'을 말한 뒤, 그것만이 전부가 아니라고 흐름을 \u003cb class=\"key\">전환\u003c/b>하는 문장이에요. 한 시간 소등은 단순한 행동이 아니라 \u003cb class=\"key\">그 \u003c/b>\u003cb class=\"key\">이상의 \u003c/b>\u003cb class=\"key\">의미\u003c/b>를 담고 있다는 점을 강조하죠. that은 바로 앞의 '한 시간 소등'을 가리키는 말이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">비교급 강조(much)\u003c/span> : [much/even/far/still + 비교급] : \"훨씬 더 많은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지시대명사 that\u003c/span> : [than] + [that(앞 내용을 받는 지시대명사)] : \"그것보다\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"But, 그러나. it is so much more, 그것은 훨씬 더 많은 것입니다. than that, 그것보다. 이 문장 전체를 해석하면, 그러나 그것은 훨씬 그 이상입니다.","hl":"m"},{"n":32,"text":"앞에서 한 시간 동안 불을 끄는 이야기를 했죠. 그런데 이 문장은 거기서 끝이 아니라는 걸 알려 줘요. 한 시간 소등은 그 자체로 끝나는 행동이 아니라 그 이상의 의미를 담고 있다는 전환의 문장이에요.","hl":"mn"},{"n":33,"text":"먼저 so much more를 보세요. more는 비교급이고, 앞에 붙은 much가 그 비교급을 강조해서 훨씬이라는 뜻을 만들어 줘요. 두 번째로 than that의 that은 앞 문장의 내용 전체를 받는 지시대명사예요. 그래서 그것, 즉 한 시간 동안 불을 끄는 행동보다 훨씬 더 많은 것이라는 뜻이 되죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 ~입니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하나의 상징\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">symbol\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">화합의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">unity\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 화합의 상징입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 여기서 It은 Earth Hour의 한 시간 소등을 가리켜요. 그 행동이 단순한 절전이 아니라 사람들이 하나 되는 \u003cb class=\"key\">화합\u003c/b>을 보여 주는 \u003cb class=\"key\">상징\u003c/b>이라는 뜻이죠. 짧은 문장으로 주제를 또렷하게 못 박아 주는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">2형식 문장(주어 + be동사 + 주격 보어)\u003c/span> : [It(주어)] + [is(동사)] + [a symbol(주격 보어)] : \"그것은 상징입니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 of의 의미(~의)\u003c/span> : [a symbol] + of + [unity] : \"화합의\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"It is, 그것은 ~입니다. a symbol, 하나의 상징. of unity, 화합의. 이 문장 전체를 해석하면, 그것은 화합의 상징입니다.","hl":"m"},{"n":35,"text":"여기서 It은 Earth Hour의 한 시간 소등을 가리켜요. 그 행동이 단순한 절전이 아니라 사람들이 하나 된다는 것을 보여 주는 상징이라는 뜻이죠.","hl":"mn"},{"n":36,"text":"첫 번째, It is a symbol은 주어와 보어를 be동사로 이어 주는 이 형식 문장이에요. be동사는 연결 동사라서 It과 a symbol을 같은 것이라고 연결해 주죠. 두 번째, of unity의 of는 앞의 symbol에 어떤 내용인지 붙여 주는 전치사예요. of 뒤에는 unity 같은 추상명사가 와서 화합이라는 개념을 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 ~입니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하나의 상징\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">symbol \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">희망의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">hope\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">희망의 상징입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 화합의 상징이라고 했죠. 이번에는 희망의 상징이라고 말하면서 두 문장이 \u003cb class=\"key\">병렬\u003c/b>을 이루어요. 짧은 구조를 \u003cb class=\"key\">반복\u003c/b>하는 것만으로 Earth Hour의 의미가 또렷하게 \u003cb class=\"key\">강조\u003c/b>됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">병렬 구조(문장 틀의 반복)\u003c/span> : It is a symbol of [unity]. / It is a symbol of [hope]. : \"그것은 화합의 상징입니다. / 그것은 희망의 상징입니다.\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"It is, 그것은 ~입니다. a symbol, 하나의 상징. of hope, 희망의. 이 문장 전체를 해석하면, 희망의 상징입니다.","hl":"m"},{"n":38,"text":"앞 문장에서 화합의 상징이라고 했죠. 이번에는 희망의 상징이라고 말하면서 두 문장이 나란히 이어져요. 짧게 반복되는 이 구조가 Earth Hour의 의미를 또렷하게 남겨 줍니다.","hl":"mn"},{"n":39,"text":"앞 문장과 똑같은 구조가 그대로 반복되는 병렬 구조예요. 같은 틀을 두 번 쓰면 리듬이 생기고 주제가 강조되죠. 그래서 화합과 희망, 두 단어만 바뀌면서 의미가 확장돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보여 줍시다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Let's \u003c/span>\u003cspan class=\"tgt\">show\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">집단행동의 힘을\u003c/span>\u003cspan class=\"en\">the power of collective action\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 미래와 지구를 위한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">future \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">planet\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리의 미래와 지구를 위한 집단행동의 힘을 보여 줍시다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 우리의 미래와 지구를 위해 모두가 함께 행동하는 것이 중요하다는 점을 강조하며, 독자에게 집단행동의 힘을 보여 주자고 촉구합니다. 앞에서 Earth Hour가 단순한 소등을 넘어선 상징이라고 했으니, 여기서는 그 상징이 \u003cb class=\"key\">집단행동\u003c/b>의 힘으로 이어진다는 흐름을 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">Let's를 이용한 청유문(제안 표현)\u003c/span> : Let's + [동사원형] + [목적어] : \"보여 줍시다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 for의 목적·대상 표현\u003c/span> : for + [명사구] : \"우리의 미래와 지구를 위한\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"Let's show, 보여 줍시다. the power of collective action, 집단행동의 힘을. for our future and planet!, 우리의 미래와 지구를 위한. 이 문장 전체를 해석하면, 우리의 미래와 지구를 위한 집단행동의 힘을 보여 줍시다!","hl":"m"},{"n":41,"text":"이 문장은 우리의 미래와 지구를 위해 함께 행동하는 것이 중요하다는 점을 강조하면서 집단행동의 힘을 보여 주자고 촉구하는 문장이에요. 앞에서 Earth Hour가 단순한 소등을 넘어선 상징이라고 했으니, 그 상징이 결국 집단행동의 힘으로 이어진다는 흐름을 잡으면 됩니다.","hl":"mn"},{"n":42,"text":"먼저 Let's show에서 Let's는 Let us의 줄임말로 청유를 나타내요. 그래서 뒤에는 반드시 동사원형 show가 오는 거죠. 두 번째로 for our future and planet에서 for는 목적이나 대상을 나타내는 전치사예요. 그래서 뒤에 our future and planet이라는 명사구가 오는 겁니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 함께라면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">If \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">together\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 많은 것을 할 수 있습니다\u003c/span>\u003cspan class=\"en\">we \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">do\u003c/span> more!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리가 함께라면 더 많은 것을 할 수 있습니다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 우리가 함께할 때 더 많은 것을 할 수 있다는 점을 강조하며, 앞의 집단행동 촉구를 뒷받침합니다. 조건문과 can을 사용해 함께하는 것이 더 큰 변화를 만드는 \u003cb class=\"key\">조건\u003c/b>이라는 \u003cb class=\"key\">희망\u003c/b>의 메시지를 전합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조건의 접속사 if\u003c/span> : If + [주어] + [동사(현재)], [주어] + [조동사] + [동사원형] : \"우리가 함께라면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 can + 동사원형\u003c/span> : [주어] + can + [동사원형] : \"할 수 있습니다\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"If we are together, 우리가 함께라면. we can do more!, 더 많은 것을 할 수 있습니다. 이 문장 전체를 해석하면, 우리가 함께라면 더 많은 것을 할 수 있습니다!","hl":"m"},{"n":44,"text":"이 문장은 우리가 함께할 때 더 많은 것을 할 수 있다는 뜻이에요. 앞에서 집단행동을 촉구했으니, 함께하는 것이 더 큰 변화를 만드는 조건이라는 희망의 메시지를 전하는 거죠.","hl":"mn"},{"n":45,"text":"먼저 If we are together에서 if는 조건을 나타내는 접속사예요. 미래의 일이라도 조건절에는 현재시제 are를 쓰는 점을 기억해야 해요. 두 번째로 we can do more에서 can은 능력이나 가능성을 나타내고 뒤에는 동사원형 do가 오는 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 행사에 참여하세요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Join\u003c/span> this event\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가족, 친구, 이웃과 함께\u003c/span>\u003cspan class=\"en\">with your \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">family, \u003c/span>\u003cspan class=\"tgt\">friends, \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">neighbors\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">가족, 친구, 이웃과 함께 이 행사에 참여하세요!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 Earth Hour에 가족, 친구, 이웃과 함께 참여하라는 직접적인 \u003cb class=\"key\">촉구\u003c/b>입니다. 혼자가 아니라 주변 사람들과 함께 행사에 동참할 때 집단행동의 의미가 더 커진다는 글의 결론 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문(동사원형으로 시작하는 표현)\u003c/span> : [동사원형] + [목적어] : \"참여하세요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명사 병렬 구조(A, B, and C)\u003c/span> : [명사 A], [명사 B], and [명사 C] : \"가족, 친구, 이웃\"\u003c/div>\u003c/div>","segs":[{"n":46,"text":"Join this event, 이 행사에 참여하세요. with your family, friends, and neighbors, 가족, 친구, 이웃과 함께. 이 문장 전체를 해석하면, 가족, 친구, 이웃과 함께 이 행사에 참여하세요!","hl":"m"},{"n":47,"text":"이 문장은 Earth Hour에 가족, 친구, 이웃과 함께 참여하라는 직접적인 촉구예요. 혼자가 아니라 주변 사람들과 함께 행사에 동참할 때 집단행동의 의미가 더 커진다는 글의 결론 역할을 합니다.","hl":"mn"},{"n":48,"text":"먼저 Join this event에서 Join은 명령문이라서 주어 You를 생략하고 동사원형으로 시작해요. 그래서 상대에게 행동을 촉구하는 표현이 되는 거죠. 두 번째로 family, friends, and neighbors는 쉼표와 and로 병렬 연결되어 with 뒤의 목적어를 이뤄요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>Earth Hour는 매년 전 세계 사람들이 한 시간 동안 불을 끄는 \u003cb class=\"key\">상징적 \u003c/b>\u003cb class=\"key\">행동\u003c/b>이다.\u003c/li>\u003cli>이 행사는 단순한 소등을 넘어 \u003cb class=\"key\">화합\u003c/b>과 \u003cb class=\"key\">희망\u003c/b>의 상징이다.\u003c/li>\u003cli>작은 실천이 모여 미래와 지구를 위한 \u003cb class=\"key\">집단행동\u003c/b>의 힘을 보여 준다.\u003c/li>\u003cli>가족, 친구, 이웃과 함께 \u003cb class=\"key\">참여\u003c/b>할 때 그 의미는 더 커진다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Earth Hour is a symbolic one-hour lights-off event that shows the power of collective action for our future and planet.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">Earth Hour는 매년 전 세계 사람들이 한 시간 동안 불을 끄며 \u003cb class=\"key\">화합\u003c/b>과 \u003cb class=\"key\">희망\u003c/b>을 상징하는 행사이다. 단 한 시간의 작은 실천이 모여 우리의 미래와 지구를 위한 \u003cb class=\"key\">집단행동\u003c/b>의 힘을 보여 준다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":49,"text":"정리해 볼게요. Earth Hour는 한 시간 동안 불을 끄는 작은 실천이지만, 그 안에는 화합과 희망, 그리고 집단행동의 힘이 담겨 있어요. 단순한 소등을 넘어 미래와 지구를 위한 참여로 이어지는 글이라는 점을 기억해 주세요. 오늘도 작은 행동의 힘을 믿고 함께해 주세요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
