oyPUHOR/j+WOfyNB4BPoD+maAP/2Q==\" alt=\"\"></div>","<div class=\"lec-cover-title\">Naming Contest: Create a Name for Our New Study Space<small>명칭 공모전: 우리의 새로운 학습 공간을 위한 이름 짓기</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">여러분, 학교나 기업에서 어떤 공간이나 제품의 이름을 짓는 ‘네이밍 공모전(Naming Contest)’은 단순히 이름을 정하는 것을 넘어, 해당 공간의 브랜딩(Branding)을 시작하는 아주 중요한 첫걸음이에요. 브랜딩이란 이름이나 로고를 통해 사람들에게 특정한 이미지나 가치를 각인시키는 과정을 의미하는데요, 마치 우리가 친구의 별명을 지어줄 때 그 친구의 특징을 담아 부르기 좋게 만드는 것과 비슷한 원리랍니다. 이번처럼 스터디 카페의 이름을 공모할 때는 단순히 멋진 단어를 찾는 것에 그치지 않고, 그 공간이 가진 학습과 휴식이라는 정체성(Identity)을 잘 담아내는 것이 핵심이에요. 따라서 좋은 이름을 제안하려면 이 공간에서 친구들이 무엇을 할지, 어떤 기분을 느끼고 싶은지를 곰곰이 생각해보는 사용자 경험(User Experience, UX) 관점에서의 고민이 필수적이랍니다. 여러분의 창의적인 아이디어가 담긴 이름이 이 공간의 얼굴이 될 수 있으니, 의미를 담아 정성껏 참여해 보세요!</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01공모전 개요</div><ul><li>본교에 신설될 스터디 카페의 이름을 정하기 위한 공모전이 개최됩니다.</li><li>새로운 학습 공간(study cafe) 내년 개장</li><li>학생 전용 공간으로 개인 또는 그룹 학습 및 휴식 가능</li><li>핵심 키워드: 이름 공모전(Naming Contest)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02참여 방법</div><ul><li>관심 있는 학생이라면 누구나 기간 내에 온라인으로 참여할 수 있습니다.</li><li>참가 자격: 본교 재학생 전체(Any student)</li><li>접수 기간: 10월 1일부터 11월 30일까지</li><li>제출 방식: QR 코드를 통해 이름과 의미(meaning) 제출</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03시상 계획</div><ul><li>우수한 이름을 선정하여 학생들에게 푸짐한 상품을 증정합니다.</li><li>1등: 태블릿(tablet) 1명</li><li>2등: 이어폰(earphones) 2명</li><li>3등: 영화 관람권(movie ticket) 3명</li><li>결과 발표: 12월 7일</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">passion</td><td class=\"m\">열정, 정열</td></tr><tr><td class=\"w\">creativity</td><td class=\"m\">창의성, 창조력</td></tr><tr><td class=\"w\">take part in</td><td class=\"m\">~에 참가하다, ~에 참여하다</td></tr><tr><td class=\"w\">participate</td><td class=\"m\">참가하다, 참여하다</td></tr><tr><td class=\"w\">submit</td><td class=\"m\">제출하다, 복종하다</td></tr><tr><td class=\"w\">announcement</td><td class=\"m\">발표, 공고</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이름 짓기 대회</span><span class=\"en\"><b><span class=\"grammar-hl\">Naming Contest</span></b></span></div></div><div class=\"lec-sent-ko\">이름 짓기 대회</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 글의 목적이 새로운 공간의 이름을 공모하는 것임을 알리며 대회 전체의 주제를 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Naming Contest (동명사): Naming이 Contest를 수식하며 &#39;이름 짓기(활동/용도)&#39;라는 명사적 개념을 나타내는 동명사로 쓰였다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">보여 주세요</span><span class=\"en\"><b><span class=\"grammar-hl\">Show</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분의 열정과 창의성을</span><span class=\"en\"><b><span class=\"grammar-hl\">your passion and creativity</span>.</b></span></div></div><div class=\"lec-sent-ko\">여러분의 열정과 창의성을 보여 주세요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 참가자들에게 적극적이고 독창적인 아이디어를 내도록 격려하며 대회의 성격을 밝히고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Show your passion and creativity (5형식(명령문)): 동사(Show) + 목적어(your passion and creativity)로 구성된 기본 3형식 구조의 명령문이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">passion</td><td class=\"m\">열정, 정열</td></tr><tr><td class=\"w\">creativity</td><td class=\"m\">창의성, 창조력</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">만들어 주세요</span><span class=\"en\"><b>Please <span class=\"grammar-hl\">create</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">최고의 이름을</span><span class=\"en\"><b>the best name.</b></span></div></div><div class=\"lec-sent-ko\">최고의 이름을 만들어 주세요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 당부에 이어, 공모전의 핵심 과제가 무엇인지 구체적으로 명시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">create (동사원형): 명령문에서는 주어 You가 생략되고 동사원형으로 문장을 시작한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 이름은 ~을 위한 것입니다</span><span class=\"en\"><b>The name <span class=\"grammar-hl\">is</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리 학교의 스터디 카페를</span><span class=\"en\"><b><span class=\"grammar-hl\">for the study cafe of our school</span>.</b></span></div></div><div class=\"lec-sent-ko\">우리 학교 스터디 카페 이름입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이름이 적용될 대상이 학교 내에 새로 생길 학습 공간임을 알려줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is for the study cafe of our school (5형식(구조)): 전치사 for를 사용하여 목적지나 용도를 나타내며, 명사구 &#39;the study cafe&#39;를 보충 설명한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 새로운 공간은</span><span class=\"en\"><b>This new space</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">문을 열 것입니다</span><span class=\"en\"><b><span class=\"grammar-hl\">will open</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">내년에</span><span class=\"en\"><b>next year.</b></span></div></div><div class=\"lec-sent-ko\">이 새로운 공간은 내년에 문을 열 것입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 대상 공간의 운영 시점을 알려주어, 현재 이 공간이 준비 단계에 있음을 암시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">will open (조동사): 미래 시제를 나타내는 will 뒤에 동사원형 open을 사용하여 미래의 동작을 표현한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">학생들만이</span><span class=\"en\"><b>Only students</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사용할 수 있습니다</span><span class=\"en\"><b><span class=\"grammar-hl\">can use</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 공간을</span><span class=\"en\"><b>this space.</b></span></div></div><div class=\"lec-sent-ko\">학생들만 이 공간을 사용할 수 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 공간의 이용 대상을 학교 재학생으로 한정하여 공모전 참여 자격과 연결되는 정보의 경계를 긋습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">can use (조동사): 능력이나 가능성을 나타내는 can 뒤에 동사원형 use를 사용하여 공간의 활용 가능성을 설명한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">학생들은</span><span class=\"en\"><b>Students</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">공부할 수 있습니다</span><span class=\"en\"><b><span class=\"grammar-hl\">can study</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">혼자서 또는 그룹으로</span><span class=\"en\"><b>alone or in groups.</b></span></div></div><div class=\"lec-sent-ko\">학생들은 혼자 또는 그룹으로 공부할 수 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 공간의 용도를 설명하여 학생들이 어떤 목적으로 이 장소를 이용하게 될지 구체적인 그림을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">can study (조동사): 주어 Students의 행위 가능성을 나타내기 위해 조동사 can과 동사원형 study를 결합하였다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">때때로</span><span class=\"en\"><b>Sometimes</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">학생들은</span><span class=\"en\"><b>students</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">놀 수 있습니다</span><span class=\"en\"><b><span class=\"grammar-hl\">can play</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여기서</span><span class=\"en\"><b>here.</b></span></div></div><div class=\"lec-sent-ko\">때때로 학생들은 여기서 놀 수 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 학습 전용 공간이지만 휴식과 여가 기능도 포함하고 있음을 덧붙여 공간의 활용도를 넓게 정의합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">can play (조동사): 주어 students의 여가 활동 가능성을 서술하기 위해 조동사 can과 동사원형 play를 사용하였다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리 학교의 어떤 학생이라도</span><span class=\"en\"><b><span class=\"grammar-hl\">Any student in our school</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">참가할 수 있습니다</span><span class=\"en\"><b><span class=\"grammar-hl\">can take part in</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 대회에</span><span class=\"en\"><b>this contest.</b></span></div></div><div class=\"lec-sent-ko\">우리 학교 학생이라면 누구나 이 대회에 참가할 수 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 정의한 이용 대상자들이 곧 공모전의 참가 대상자임을 확인하며 지원의 폭이 넓음을 알립니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Any student in our school can take part in (관용표현): &#39;take part in(~에 참여하다)&#39;은 하나의 타동사구처럼 기능하며, 주어는 Any student로 설정되어 있다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">take part in</td><td class=\"m\">~에 참가하다, ~에 참여하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 바랍니다</span><span class=\"en\"><b>We hope</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분 중 많은 이들이</span><span class=\"en\"><b><span class=\"grammar-hl\">many of you</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">참여하기를</span><span class=\"en\"><b>will participate.</b></span></div></div><div class=\"lec-sent-ko\">많은 참여 바랍니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 대회 주최 측의 기대감을 드러내며 독자들의 행동을 유도합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">many of you (관용표현): &#39;수량형용사 + of + 대명사&#39; 구조로, 전체 집단 중 일부를 나타내는 대명사적 표현이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">participate</td><td class=\"m\">참가하다, 참여하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 11 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는</span><span class=\"en\"><b>We</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">줄 것입니다</span><span class=\"en\"><b><span class=\"grammar-hl\">will give</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">멋진 선물을</span><span class=\"en\"><b>great gifts</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수상자들에게</span><span class=\"en\"><b>to the winners.</b></span></div></div><div class=\"lec-sent-ko\">수상자들에게는 멋진 선물을 드립니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 참여를 촉진하기 위해 보상 제도를 언급하며 동기를 부여합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">will give (5형식(SVOO)): 주어(We) + 동사(give) + 간접목적어(great gifts) + 직접목적어(to the winners) 구조에서, 수여동사 give의 4형식 패턴을 3형식으로 전환(give O1 to O2)한 형태이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 12 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신은</span><span class=\"en\"><b>You</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">제출할 수 있습니다</span><span class=\"en\"><b>can <span class=\"grammar-hl\">submit</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이름을</span><span class=\"en\"><b>names</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">10월 1일부터 11월 30일까지</span><span class=\"en\"><b>from October 1 to November 30.</b></span></div></div><div class=\"lec-sent-ko\">10월 1일부터 11월 30일까지 이름을 제출할 수 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 구체적인 공모 기간을 제공하여 실질적인 참여 절차를 안내합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">submit (조동사): 조동사 can 뒤에 목적어(names)를 취하는 타동사 submit을 사용하여 제출의 가능성을 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">submit</td><td class=\"m\">제출하다, 복종하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 13 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">방법:</span><span class=\"en\"><b>How:</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">게시하세요 이름을</span><span class=\"en\"><b><span class=\"grammar-hl\">Post a name</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것의 의미와 함께</span><span class=\"en\"><b><span class=\"grammar-hl\">with its meaning</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">QR 코드를 통해</span><span class=\"en\"><b>through a QR code.</b></span></div></div><div class=\"lec-sent-ko\">방법: QR 코드로 이름과 의미를 함께 게시하세요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 구체적인 제출 방식을 설명하여 독자가 실제로 참여할 수 있도록 돕습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Post a name with its meaning (5형식(명령문)): 동사(Post) + 목적어(a name) + 전치사구(with its meaning)로 이어지는 명령문 구조이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 14 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">상품:</span><span class=\"en\"><b>Prize:</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">1등 (1명) – 태블릿</span><span class=\"en\"><b><span class=\"grammar-hl\">1st Place</span> (1 person) – tablet</b></span></div></div><div class=\"lec-sent-ko\">상품: 1등 (1명) - 태블릿 PC</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 약속한 멋진 선물에 대한 상세 목록을 공개하여 참여 가치를 구체화합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">1st Place (명사구): 서수를 나타내는 형용사가 명사를 수식하여 순위를 명확히 지칭하는 구조이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 15 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">2등 (2명) – 이어폰</span><span class=\"en\"><b><span class=\"grammar-hl\">2nd Place</span> (2 people) – earphones</b></span></div></div><div class=\"lec-sent-ko\">2등 (2명) - 이어폰</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 대회의 마무리 시점을 알려주어 전체적인 일정의 흐름을 정리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">2nd Place (명사구): 순위를 나타내는 서수형용사와 명사가 결합하여 대상을 구체화한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 16 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">3등 (3명) – 영화 티켓</span><span class=\"en\"><b><span class=\"grammar-hl\">3rd Place</span> (3 people) – movie ticket</b></span></div></div><div class=\"lec-sent-ko\">3등 (3명) - 영화 티켓</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">3rd Place (명사구): 3등을 의미하는 순위 명사구로, 전체 목록에서의 지위를 나타낸다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 17 / 17</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">수상자 발표:</span><span class=\"en\"><b><span class=\"grammar-hl\">Announcement of Winners</span>:</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">12월 7일</span><span class=\"en\"><b>December 7</b></span></div></div><div class=\"lec-sent-ko\">수상자 발표: 12월 7일</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 대회의 마무리 시점을 알려주어 전체적인 일정의 흐름을 정리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Announcement of Winners (명사구): &#39;명사 + 전치사 + 명사&#39; 구조를 통해 공지의 내용을 구체화하고 있다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">announcement</td><td class=\"m\">발표, 공고</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>학교 내 새로운 스터디 카페의 개관을 앞두고 학생들을 대상으로 이름 공모전을 개최한다.</li><li>참여 자격은 재학생 전체이며, 학생들은 학습과 휴식을 겸할 공간의 명칭을 창의적으로 제안한다.</li><li>10월부터 11월 말까지 QR 코드를 통해 접수하며, 수상자에게는 태블릿, 이어폰 등의 상품이 제공된다.</li><li>수상자는 12월 7일에 최종 발표된다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The school is inviting students to suggest names for a new study space through a QR code, and winners will receive various prizes.</div>\n              <div class=\"lec-final-sum-ko\">학교는 QR 코드를 통해 학생들에게 새로운 학습 공간의 이름을 제안하도록 권장하며, 수상자에게는 다양한 상품을 제공한다.</div></div></div>"],"segs":[[{"audio":"./reading15_audio/1.mp3","hl":null}],[{"audio":"./reading15_audio/2.mp3","hl":null}],[{"audio":"./reading15_audio/3.mp3","hl":null},{"audio":"./reading15_audio/4.mp3","hl":"stage-0"},{"audio":"./reading15_audio/5.mp3","hl":"stage-1"},{"audio":"./reading15_audio/6.mp3","hl":"stage-2"}],[{"audio":"./reading15_audio/7.mp3","hl":null}],[{"audio":"./reading15_audio/8.mp3","hl":"main"},{"audio":"./reading15_audio/9.mp3","hl":"meaning"},{"audio":"./reading15_audio/10.mp3","hl":"grammar"}],[{"audio":"./reading15_audio/11.mp3","hl":"main"},{"audio":"./reading15_audio/12.mp3","hl":"meaning"},{"audio":"./reading15_audio/13.mp3","hl":"grammar"}],[{"audio":"./reading15_audio/14.mp3","hl":"main"},{"audio":"./reading15_audio/15.mp3","hl":"meaning"},{"audio":"./reading15_audio/16.mp3","hl":"grammar"}],[{"audio":"./reading15_audio/17.mp3","hl":"main"},{"audio":"./reading15_audio/18.mp3","hl":"meaning"},{"audio":"./reading15_audio/19.mp3","hl":"grammar"}],[{"audio":"./reading15_audio/20.mp3","hl":"main"},{"audio":"./reading15_audio/21.mp3","hl":"meaning"},{"audio":"./reading15_audio/22.mp3","hl":"grammar"}],[{"audio":"./reading15_audio/23.mp3","hl":
