ic8/wCf8eq9OD9fz/Xpjv8Ah6NDAjgg+uCOvvjP8/X1oLKoySCMdmHqR1zjP+cHpSs27W17ef8AXkHr1vp/X4+vTYd1I45xx+Xp6kfjzx1pP/r5+v8An/PobgQG4wxPAIHGRn14HXHbFJuXOMjrwQevTsQPw55z7Yos722v30X4j+T8/LoIxwvHU9D6fhx6/p7GmFgd3XocZPQ8ex64H0x1PdcB/uspBJIwyliSAcY9icZ6EY5z0TYeeFYYJwcHjBzjOARjrkehyBmtoqKSvdNe87rRq687JJ23s35XaStfbV2sns3f77fof//Z\" alt=\"\"></div>","<div class=\"lec-cover-title\">A Comparative Analysis of National Health Care Expenditures<small>국가별 의료 지출에 대한 비교 분석</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">본격적으로 글을 읽기 전에, 먼저 국내총생산 대비 보건지출(Health Expenditure as a share of GDP)이라는 개념을 이해하면 좋습니다. 이는 한 나라가 벌어들인 총소득 중에서 의료 서비스나 보건 시스템 유지에 얼마나 많은 비용을 투자하고 있는지를 나타내는 척도로, 쉽게 말해 &#39;나라 살림 중 건강을 지키는 데 쓰는 돈의 비중&#39;이라고 볼 수 있어요. 보통 선진국일수록 국민의 건강 증진을 위해 이 비중을 높이는 경향이 있는데, 이는 마치 가계부에서 식비나 교육비처럼 필수적인 지출을 관리하는 것과 비슷합니다. 미국(US)처럼 세계적으로 의료비가 높기로 유명한 나라와 튀르키예(Türkiye)처럼 상대적으로 적은 비용을 지출하는 나라를 비교해보면, 각 나라가 어떤 방식으로 의료 시스템을 운영하고 국민의 건강을 보호하는지 그 정책적 차이를 추측해 볼 수 있답니다. 이러한 배경을 알고 그래프를 보시면, 수치 속에 담긴 각국의 보건 정책 방향성을 훨씬 깊이 있게 파악하실 수 있을 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01그래프의 목적과 질문</div><ul><li>2018년 국내총생산(GDP) 대비 의료비 지출 비중을 나타낸 그래프를 분석한다.</li><li>그래프의 주요 지표: 의료비 지출 비중(percentage of GDP spent on health care)</li><li>국가 간 의료비 지출 차이 비교(compare)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02국가별 지출 현황 비교</div><ul><li>미국과 스위스 등 주요 국가들의 의료비 지출 수준을 확인한다.</li><li>가장 높은 비중을 차지한 미국(the US)</li><li>12.2%를 기록한 스위스(Switzerland)는 미국보다 낮은 수치임</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03기타 국가들의 상대적 지출</div><ul><li>프랑스, 벨기에, 튀르키예 등 나머지 국가들의 비중을 살펴본다.</li><li>벨기에보다 높은 비중을 지출한 프랑스(France)</li><li>5% 미만의 가장 적은 비중을 보인 튀르키예(Türkiye)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04동일 비중 국가 확인</div><ul><li>영국과 그리스의 의료비 지출 규모가 동일함을 파악한다.</li><li>동일한 비중을 지출한 영국(the UK)과 그리스(Greece)</li><li>두 국가 모두 5%를 초과하는 지출을 기록함</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">percentage</td><td class=\"m\">비율, 백분율</td></tr><tr><td class=\"w\">health care</td><td class=\"m\">의료 서비스, 건강 관리</td></tr><tr><td class=\"w\">look and compare</td><td class=\"m\">살펴보고 비교하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">위 그래프는</span><span class=\"en\"><b>The graph above</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">보여 주며</span><span class=\"en\"><b>shows</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">GDP 대비 비율을</span><span class=\"en\"><b>the percentage of GDP</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">의료비에 지출된</span><span class=\"en\"><b><span class=\"grammar-hl\">spent</span> on health care</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">2018년</span><span class=\"en\"><b>in 2018.</b></span></div></div><div class=\"lec-sent-ko\">위 그래프는 2018년 GDP 대비 의료비 지출 비율을 보여 줍니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 글의 도입부로서, 앞으로 전개될 데이터 분석의 기초 자료가 그래프임을 밝히며 독자에게 관찰 대상을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">spent (과거분사(형용사)): spend는 타동사인데 목적어가 없어서 과거분사가 뒤의 명사(GDP)를 수식한다. (= &#39;GDP에 지출된&#39;) 구조: [GDP (which was) spent on health care].</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">percentage</td><td class=\"m\">비율, 백분율</td></tr><tr><td class=\"w\">health care</td><td class=\"m\">의료 서비스, 건강 관리</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어느 국가가</span><span class=\"en\"><b>Which country</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가장 많이 지출했는가</span><span class=\"en\"><b>spent the most</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">표시된 국가들 중에서</span><span class=\"en\"><b>among the countries <span class=\"grammar-hl\">shown</span>?</b></span></div></div><div class=\"lec-sent-ko\">표시된 국가 중 가장 많이 지출한 국가는 어디인가요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 그래프를 단순히 바라보는 것을 넘어, 수치상의 최댓값을 찾도록 유도하며 독자의 분석적인 참여를 끌어내고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">shown (과거분사(형용사)): show는 타동사인데 목적어가 없어서 과거분사가 앞의 명사(countries)를 수식한다. (= &#39;보여진/제시된&#39;) 구조: [countries (that are) shown].</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어느 국가가</span><span class=\"en\"><b>Which country</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가장 적게 지출했는가</span><span class=\"en\"><b>spent the least</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">표시된 국가들 중에서</span><span class=\"en\"><b>among the countries <span class=\"grammar-hl\">shown</span>?</b></span></div></div><div class=\"lec-sent-ko\">표시된 국가 중 가장 적게 지출한 국가는 어디인가요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 질문과 대칭을 이루며, 데이터에서 최소값을 추출하여 범위를 파악하도록 돕는 질문입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">shown (과거분사(형용사)): show는 타동사인데 목적어가 없어서 과거분사가 앞의 명사(countries)를 수식한다. (= &#39;보여진/제시된&#39;) 구조: [countries (that are) shown].</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">큰 차이가 있는가</span><span class=\"en\"><b><span class=\"grammar-hl\">Is there</span> a big difference</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 국가들 사이에</span><span class=\"en\"><b>between the countries?</b></span></div></div><div class=\"lec-sent-ko\">국가간에 큰 차이가 있나요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 개별 수치를 파악한 이후, 국가별 지출 규모의 격차라는 종합적인 비교 분석 단계로 사고를 확장하게 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Is there (도치): 유도부사 there가 문두에 올 때 &#39;there + be동사 + 주어&#39;의 순서로 도치가 발생한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">살펴보고</span><span class=\"en\"><b><span class=\"grammar-hl\">Let’s look</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">비교해 보자</span><span class=\"en\"><b><span class=\"grammar-hl\">and compare</span>.</b></span></div></div><div class=\"lec-sent-ko\">보고 비교해 봅시다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자에게 구체적인 데이터 분석을 시작하겠다는 신호를 보내며, 이어지는 문장들에 대한 주의를 집중시킵니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Let’s look and compare (관용표현): Let us의 줄임말로, &#39;우리 ~하자&#39;라는 제안을 나타내는 명령문 형태의 관용구다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">look and compare</td><td class=\"m\">살펴보고 비교하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">미국은</span><span class=\"en\"><b>The US</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지출했습니다</span><span class=\"en\"><b>spent</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">GDP 대비 가장 높은 비율을</span><span class=\"en\"><b>the highest percentage of GDP</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">의료비에</span><span class=\"en\"><b>on health care</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">표시된 국가들 중에서</span><span class=\"en\"><b>among the countries <span class=\"grammar-hl\">shown</span>.</b></span></div></div><div class=\"lec-sent-ko\">미국은 표시된 국가들 중에서 의료비에 GDP 대비 가장 높은 비율을 지출했습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 2번 질문에 대한 직접적인 답변으로, 그래프에서 가장 높은 수치를 기록한 대상을 명시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">shown (과거분사(형용사)): show는 타동사인데 목적어가 없어서 과거분사가 앞의 명사(countries)를 수식한다. (= &#39;보여진/제시된&#39;) 구조: [countries (that are) shown].</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">percentage</td><td class=\"m\">비율, 백분율</td></tr><tr><td class=\"w\">health care</td><td class=\"m\">의료 서비스, 건강 관리</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">스위스는</span><span class=\"en\"><b>Switzerland</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자국 GDP의 12.2퍼센트를 지출했다</span><span class=\"en\"><b><span class=\"grammar-hl\">spent</span> 12.2 percent of its GDP</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">의료비에</span><span class=\"en\"><b>on health care.</b></span></div></div><div class=\"lec-sent-ko\">스위스는 GDP의 12.2퍼센트를 의료비에 지출했습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 구체적인 수치를 언급함으로써 미국과 비교할 수 있는 기준점을 제공하고, 독자가 데이터의 실체를 파악하게 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">spent 5형식(SVOC) 구조: 본 문장은 3형식 구조이나, spend는 보통 &#39;spend + 시간/돈 + on + 목적어(명사/V-ing)&#39; 구조로 쓰이는 타동사다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">health care</td><td class=\"m\">의료 서비스, 건강 관리</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은</span><span class=\"en\"><b><span class=\"grammar-hl\">That’s</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 적다</span><span class=\"en\"><b>less than</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">미국보다</span><span class=\"en\"><b>the US.</b></span></div></div><div class=\"lec-sent-ko\">그것은 미국보다 적습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급된 스위스의 수치와 미국의 수치를 상대적으로 비교하여, 미국이 지출 면에서 압도적 위치에 있음을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">That’s (관용표현): That is의 줄임말로, 앞 문장의 내용을 가리키는 지시 대명사 주어와 be동사로 이루어져 있다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">프랑스는</span><span class=\"en\"><b>France</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">의료비에 자국 GDP의 더 높은 비율을 지출했다</span><span class=\"en\"><b><span class=\"grammar-hl\">spent</span> a higher percentage of its GDP on health care</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">벨기에보다</span><span class=\"en\"><b>than Belgium.</b></span></div></div><div class=\"lec-sent-ko\">프랑스는 벨기에보다 의료비에 GDP 대비 더 높은 비율을 지출했습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 다른 국가들 사이의 순위를 구체적으로 서술하여 독자가 국가별 지출 규모를 개별적으로 비교할 수 있게 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">spent 5형식(SVOC) 구조: 본 문장은 3형식 구조이나, spend는 보통 &#39;spend + 시간/돈 + on + 목적어(명사/V-ing)&#39; 구조로 쓰이는 타동사다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">percentage</td><td class=\"m\">비율, 백분율</td></tr><tr><td class=\"w\">health care</td><td class=\"m\">의료 서비스, 건강 관리</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">튀르키예는</span><span class=\"en\"><b>Türkiye</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지출했다</span><span class=\"en\"><b><span class=\"grammar-hl\">spent</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자국 GDP의 5퍼센트 미만을</span><span class=\"en\"><b>less than 5 percent of its GDP</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">의료비에</span><span class=\"en\"><b>on health care.</b></span></div></div><div class=\"lec-sent-ko\">튀르키예는 GDP의 5퍼센트 미만을 의료비에 지출했습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 그래프의 하위권에 위치한 국가의 데이터를 제시하여 전체적인 분포의 범위를 확인시켜 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">spent 5형식(SVOC) 구조: 본 문장은 3형식 구조이나, spend는 보통 &#39;spend + 시간/돈 + on + 목적어(명사/V-ing)&#39; 구조로 쓰이는 타동사다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">health care</td><td class=\"m\">의료 서비스, 건강 관리</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 11 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">영국과 그리스는</span><span class=\"en\"><b>The UK and Greece</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지출했다</span><span class=\"en\"><b><span class=\"grammar-hl\">spent</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자국 GDP의 같은 비율을</span><span class=\"en\"><b>the same percentage of their GDP</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">의료비에</span><span class=\"en\"><b>on health care.</b></span></div></div><div class=\"lec-sent-ko\">영국과 그리스는 GDP의 같은 비율을 의료비에 지출했습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 상위권이나 하위권 외에도 수치가 일치하는 국가 사례를 들어 데이터의 다양한 특징을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">spent 5형식(SVOC) 구조: 본 문장은 3형식 구조이나, spend는 보통 &#39;spend + 시간/돈 + on + 목적어(명사/V-ing)&#39; 구조로 쓰이는 타동사다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">percentage</td><td class=\"m\">비율, 백분율</td></tr><tr><td class=\"w\">health care</td><td class=\"m\">의료 서비스, 건강 관리</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 12 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은 또한 각각</span><span class=\"en\"><b>They also each</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지출했다</span><span class=\"en\"><b><span class=\"grammar-hl\">spent</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자국 GDP의 5퍼센트 이상을</span><span class=\"en\"><b>more than 5 percent of their GDP</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">의료비에</span><span class=\"en\"><b>on health care.</b></span></div></div><div class=\"lec-sent-ko\">그들은 또한 각각 GDP의 5퍼센트 이상을 의료비에 지출했습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 11번 문장에서 언급한 영국과 그리스의 지출액을 다시 10번의 튀르키예와 대비함으로써, 특정 수치를 기준으로 국가들의 위치를 분류하여 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">spent 5형식(SVOC) 구조: 본 문장은 3형식 구조이나, spend는 보통 &#39;spend + 시간/돈 + on + 목적어(명사/V-ing)&#39; 구조로 쓰이는 타동사다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">health care</td><td class=\"m\">의료 서비스, 건강 관리</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>2018년 국가별 GDP 대비 의료비 지출 현황을 그래프로 제시한다.</li><li>미국이 가장 높은 비율을 차지하며 국가별로 상당한 지출 격차가 있음을 보여준다.</li><li>스위스, 프랑스, 벨기에, 튀르키예 등 주요 국가의 개별 수치를 비교한다.</li><li>영국과 그리스처럼 지출 비율이 동일한 사례를 통해 상세 데이터를 분석한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The US recorded the highest health care expenditure relative to its GDP, while Türkiye spent the lowest proportion among the countries analyzed.</div>\n              <div class=\"lec-final-sum-ko\">미국은 GDP 대비 의료비 지출이 가장 높았으며, 분석된 국가 중 튀르키예가 가장 낮은 비율을 지출했다.</div></div></div>"],"segs":[[{"audio":"./reading16_audio/1.mp3","hl":null}],[{"audio":"./reading16_audio/2.mp3","hl":null}],[{"audio":"./reading16_audio/3.mp3","hl":null},{"audio":"./reading16_audio/4.mp3","hl":"stage-0"},{"audio":"./reading16_audio/5.mp3","hl":"stage-1"},{"audio":"./reading16_audio/6.mp3","hl":"stage-2"},{"audio":"./reading16_audio/7.mp3","hl":"stage-3"}],[{"audio":"./reading16_audio/8.mp3","hl":null}],[{"audio":"./reading16_audio/9.mp3","hl":"main"},{"audio":"./reading16_audio/10.mp3","hl":"meaning"},{"audio":"./reading16_audio/11.mp3","hl":"grammar"}],[{"audio":"./reading16_audio/12.mp3","hl":"main"},{"audio":"./reading16_audio/13.mp3","hl":"meaning"},{"audio":"./reading16_audio/14.mp3","hl":"grammar"}],[{"audio":"./reading16_audio/15.mp3","hl":"main"},{"audio":"./reading16_aud
