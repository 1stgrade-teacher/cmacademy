<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리딩마스터1 Reading 32 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"리딩마스터1 Reading 32","audioDir":"32_audio","preview":false,"count":42,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.668em\">Reading\u003cbr>32\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩마스터1\u003c/div>\u003ch1>John Cage's 4'33: Music of Silence and Everyday Sound\u003c/h1>\u003ch2>존 케이지의 4분 33초: 침묵과 일상 소리의 음악\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>John Cage의 4분 33초는 연주자가 소리를 통제하지 않는 \u003cb class=\"key\">침묵\u003c/b>의 곡으로, 극장의 \u003cb class=\"key\">실생활 \u003c/b>\u003cb class=\"key\">소음\u003c/b>과 사람들이 가진 느낌과 생각까지 음악으로 보여 준 작품이다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>John Cage's 4'33 shows that all sounds and feelings we experience, not only the artist's performance, can be music.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 John Cage의 Four Thirty Three라는 아주 특별한 작품을 함께 읽어 볼게요. 이 작품은 연주자가 피아노를 치지 않고 침묵을 들려주는 것처럼 보이지만, 실제로는 극장의 실생활 소음과 사람들의 느낌까지 음악으로 받아들이게 해요. 핵심 요지는 우리가 느끼는 모든 것이 음악이 될 수 있다는 것이고, 글은 구체적인 공연 장면에서 출발해 그 의미를 마지막에 밝혀 줍니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">1950년대에는 작곡가가 모든 소리를 정하는 전통적 음악관과, 우연과 주변 소리를 작품에 끌어들이려는 \u003cb class=\"key\">개념 \u003c/b>\u003cb class=\"key\">예술\u003c/b>(conceptual art)이 함께 논의되었다. John Cage는 침묵도 완전한 무음이 아니라 그 순간의 \u003cb class=\"key\">주변 \u003c/b>\u003cb class=\"key\">소리\u003c/b>(ambient sound)로 채워진다고 보았다. 즉 연주자가 연주를 멈추면 관객은 극장의 기침 소리, 빗소리, 공기 소리까지 듣게 된다는 것이다. 이것은 마치 우리가 이어폰을 끄면 갑자기 방 안의 선풍기 소리와 시계 소리가 들리는 것과 비슷하다. 그래서 4분 33초는 소리를 만들지 않는 대신, \u003cb class=\"key\">듣는 \u003c/b>\u003cb class=\"key\">행위\u003c/b> 자체를 음악으로 바꾼 실험이었다.\u003c/div>","segs":[{"n":2,"text":"배경을 조금 더 알아 볼게요. 당시에는 작곡가가 모든 소리를 정하는 전통적 음악관과, 우연과 주변 소리를 작품에 끌어들이려는 개념 예술, 즉 conceptual art가 함께 논의되었어요. John Cage는 침묵도 완전한 무음이 아니라 그 순간의 주변 소리, 즉 ambient sound로 채워진다고 보았죠. 그래서 연주자가 연주를 멈추면 관객은 극장의 기침 소리나 빗소리, 공기 소리까지 듣게 된다는 거예요. 이건 마치 우리가 이어폰을 끄면 갑자기 방 안의 선풍기 소리와 시계 소리가 들리는 것과 비슷해요. 그래서 Four Thirty Three는 소리를 만들지 않는 대신 듣는 행위 자체를 음악으로 바꾼 실험이었어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>공연 장면\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>1952년 8월 어느 늦은 저녁, 한 남자가 극장에서 피아노 덮개를 세 번 열었다가 닫았다. 그는 피아노 위의 타이머를 눌렀다. 그리고 \u003cb class=\"key\">건반\u003c/b>을 하나도 누르지 않은 채 4분 33초를 보냈다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>작품 정체\u003csmall>전환 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>이상하게 보이는 이 장면은 사실 John Cage의 4분 33초라는 \u003cb class=\"key\">작품\u003c/b>이다. 이 곡은 소리가 아니라 \u003cb class=\"key\">침묵\u003c/b>만으로 유명해졌다는 점이 낯설지만 중요한 단서다. 그래서 독자는 이 공연이 단순한 사건이 아니라 의도된 음악임을 알게 된다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>의도와 실행\u003csmall>주장·근거 · 문장 6–8\u003c/small>\u003c/h4>\u003cp>Cage는 사람들이 연주자 없이도 음악을 느낄 수 있다고 보아 음악에서 \u003cb class=\"key\">연주자\u003c/b>를 제거했다. 그 결과 연주자와 작곡가는 공연 중 음악에 \u003cb class=\"key\">영향\u003c/b>을 줄 수 없었고, Cage 자신도 극장의 소리를 \u003cb class=\"key\">통제\u003c/b>할 방법이 없었다. 이는 작품의 핵심이 연주자의 기술이 아니라 소리를 듣는 경험에 있음을 보여 준다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>남은 소리와 의미\u003csmall>결론 · 문장 9–10\u003c/small>\u003c/h4>\u003cp>연주자가 통제하지 않아도 극장에는 여전히 \u003cb class=\"key\">실생활 \u003c/b>\u003cb class=\"key\">소음\u003c/b>이 있었고, 사람들은 \u003cb class=\"key\">느낌과 \u003c/b>\u003cb class=\"key\">생각\u003c/b>을 가질 수 있었다. Cage는 우리가 느끼는 모든 것이 \u003cb class=\"key\">음악\u003c/b>이 될 수 있음을 보여 주고 싶었다. 그래서 이 작품은 침묵이 아니라 듣는 사람의 경험을 음악으로 만든다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 네 단계로 나누어 살펴볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 공연 장면이에요. 천구백오십이년 팔월 어느 늦은 저녁, 한 남자가 극장에서 피아노 덮개를 세 번 열었다가 닫아요. 그는 피아노 위의 타이머를 누르고, 건반을 하나도 누르지 않은 채 사 분 삼십삼 초를 보내죠. 이 구체적인 장면이 작품의 시작을 보여 줍니다.","hl":"f0"},{"n":5,"text":"두 번째 단계는 작품의 정체를 밝히는 전환이에요. 이상하게 보이는 이 장면은 사실 John Cage의 Four Thirty Three라는 작품이죠. 이 곡은 소리가 아니라 침묵만으로 유명해졌다는 점이 낯설지만 중요한 단서예요. 그래서 독자는 이 공연이 단순한 사건이 아니라 의도된 음악임을 알게 됩니다.","hl":"f1"},{"n":6,"text":"세 번째 단계는 Cage의 의도와 실행이에요. Cage는 사람들이 연주자 없이도 음악을 느낄 수 있다고 보아 음악에서 연주자를 제거했어요. 그 결과 연주자와 작곡가는 공연 중 음악에 영향을 줄 수 없었고, Cage 자신도 극장의 소리를 통제할 방법이 없었죠. 이는 작품의 핵심이 연주자의 기술이 아니라 소리를 듣는 경험에 있음을 보여 줍니다.","hl":"f2"},{"n":7,"text":"네 번째 단계는 남은 소리와 의미예요. 연주자가 통제하지 않아도 극장에는 여전히 실생활 소음이 있었고, 사람들은 느낌과 생각을 가질 수 있었어요. Cage는 우리가 느끼는 모든 것이 음악이 될 수 있음을 보여 주고 싶었죠. 그래서 이 작품은 침묵이 아니라 듣는 사람의 경험을 음악으로 만듭니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">예시-설명\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 10번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 첫 문장부터 구체적인 공연 장면을 제시하고, 4~5번에서 그것이 침묵만의 작품임을 밝힌 뒤, 6~8번에서 Cage의 의도와 실행을 설명한다. 마지막 10번에서 '우리가 느끼는 모든 것이 음악이 될 수 있다'는 \u003cb class=\"key\">주제\u003c/b>를 제시하므로 핵심 주장이 뒤에 오는 \u003cb class=\"key\">미괄식\u003c/b>이다. 구체적 \u003cb class=\"key\">예시\u003c/b>에서 출발해 작품의 의미로 일반화하는 전개다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>but (4)\u003c/b>\u003cspan>전환\u003c/span>\u003cb>so (6)\u003c/b>\u003cspan>인과·주장\u003c/span>\u003cb>During (7)\u003c/b>\u003cspan>시간 범위\u003c/span>\u003cb>Even (8)\u003c/b>\u003cspan>강조\u003c/span>\u003cb>still (9)\u003c/b>\u003cspan>양보·전환\u003c/span>\u003cb>wanted to show (10)\u003c/b>\u003cspan>결론\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">only silence\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">real-life noise\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">some feelings and thoughts\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">all the things we feel\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">music\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>연주자·작곡가의 통제\u003c/th>\u003cth>연주자 없는 소리와 느낌\u003c/th>\u003c/tr>\u003ctr>\u003ctd>연주자가 소리를 만든다\u003c/td>\u003ctd>관객과 극장의 소리가 남는다\u003c/td>\u003c/tr>\u003ctr>\u003ctd>작곡가가 음악에 영향을 준다\u003c/td>\u003ctd>사람들의 느낌과 생각이 음악이 된다\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 주장과 근거를 함께 보여 주는 예시 설명 구조예요. 먼저 구체적인 공연 장면이라는 예시를 제시하고, 그다음 Cage의 의도와 실행을 근거로 풀어내죠. 핵심 주제는 마지막 문장에서 제시되기 때문에 미괄식 구조라고 볼 수 있어요. 그래서 처음부터 결론을 찾기보다 마지막 문장에서 예시가 어떤 주제로 일반화되는지 확인하는 게 중요합니다.","hl":"ty"},{"n":9,"text":"네 번째 문장의 but은 이상해 보이는 장면을 작품으로 전환하는 신호예요. 여섯 번째 문장의 so는 Cage의 생각과 행동을 인과로 연결하고, 일곱 번째 문장의 During은 공연 중이라는 시간 범위를 잡아 줍니다. 여덟 번째 문장의 Even은 Cage 자신도 통제할 수 없었다는 점을 강조하고, 아홉 번째 문장의 still은 통제하지 않아도 소리와 느낌이 남아 있음을 보여 줘요. 마지막 문장의 wanted to show는 글의 결론이 주제로 모이는 신호입니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>open\u003c/b>\u003cem>동사\u003c/em>\u003cspan>열다\u003c/span>\u003c/div>\u003cdiv>\u003cb>close\u003c/b>\u003cem>동사\u003c/em>\u003cspan>닫다\u003c/span>\u003c/div>\u003cdiv>\u003cb>cover\u003c/b>\u003cem>명사\u003c/em>\u003cspan>덮개\u003c/span>\u003c/div>\u003cdiv>\u003cb>theater\u003c/b>\u003cem>명사\u003c/em>\u003cspan>극장\u003c/span>\u003c/div>\u003cdiv>\u003cb>press\u003c/b>\u003cem>동사\u003c/em>\u003cspan>누르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>timer\u003c/b>\u003cem>명사\u003c/em>\u003cspan>타이머\u003c/span>\u003c/div>\u003cdiv>\u003cb>key\u003c/b>\u003cem>명사\u003c/em>\u003cspan>건반\u003c/span>\u003c/div>\u003cdiv>\u003cb>strange\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>이상한\u003c/span>\u003c/div>\u003cdiv>\u003cb>famous\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>유명한\u003c/span>\u003c/div>\u003cdiv>\u003cb>piece\u003c/b>\u003cem>명사\u003c/em>\u003cspan>곡, 작품\u003c/span>\u003c/div>\u003cdiv>\u003cb>silence\u003c/b>\u003cem>명사\u003c/em>\u003cspan>침묵\u003c/span>\u003c/div>\u003cdiv>\u003cb>feel\u003c/b>\u003cem>동사\u003c/em>\u003cspan>느끼다\u003c/span>\u003c/div>\u003cdiv>\u003cb>artist\u003c/b>\u003cem>명사\u003c/em>\u003cspan>연주자, 예술가\u003c/span>\u003c/div>\u003cdiv>\u003cb>remove\u003c/b>\u003cem>동사\u003c/em>\u003cspan>제거하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>performance\u003c/b>\u003cem>명사\u003c/em>\u003cspan>공연\u003c/span>\u003c/div>\u003cdiv>\u003cb>composer\u003c/b>\u003cem>명사\u003c/em>\u003cspan>작곡가\u003c/span>\u003c/div>\u003cdiv>\u003cb>make an impact on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 영향을 주다\u003c/span>\u003c/div>\u003cdiv>\u003cb>even\u003c/b>\u003cem>부사\u003c/em>\u003cspan>심지어\u003c/span>\u003c/div>\u003cdiv>\u003cb>himself\u003c/b>\u003cem>대명사\u003c/em>\u003cspan>그 자신\u003c/span>\u003c/div>\u003cdiv>\u003cb>have no way to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~할 방법이 없다\u003c/span>\u003c/div>\u003cdiv>\u003cb>control\u003c/b>\u003cem>동사\u003c/em>\u003cspan>통제하다, 제어하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>sound\u003c/b>\u003cem>명사\u003c/em>\u003cspan>소리\u003c/span>\u003c/div>\u003cdiv>\u003cb>still\u003c/b>\u003cem>부사\u003c/em>\u003cspan>여전히\u003c/span>\u003c/div>\u003cdiv>\u003cb>real-life\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>실생활의\u003c/span>\u003c/div>\u003cdiv>\u003cb>noise\u003c/b>\u003cem>명사\u003c/em>\u003cspan>소음\u003c/span>\u003c/div>\u003cdiv>\u003cb>feeling\u003c/b>\u003cem>명사\u003c/em>\u003cspan>느낌\u003c/span>\u003c/div>\u003cdiv>\u003cb>thought\u003c/b>\u003cem>명사\u003c/em>\u003cspan>생각\u003c/span>\u003c/div>\u003cdiv>\u003cb>show\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보여 주다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어를 몇 개 짚어 볼게요. remove는 제거하다, make an impact on은 영향을 주다, have no way to는 할 방법이 없다는 뜻이에요. control은 통제하다, real life는 실생활의, show는 보여 주다로 정리해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">silence\u003c/b>\u003cspan class=\"m\">침묵\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">quiet\u003c/span>\u003cspan class=\"s\">stillness\u003c/span>\u003cspan class=\"s\">hush\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">noise\u003c/span>\u003cspan class=\"a\">sound\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">strange\u003c/b>\u003cspan class=\"m\">이상한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">odd\u003c/span>\u003cspan class=\"s\">unusual\u003c/span>\u003cspan class=\"s\">bizarre\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">normal\u003c/span>\u003cspan class=\"a\">ordinary\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">famous\u003c/b>\u003cspan class=\"m\">유명한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">well-known\u003c/span>\u003cspan class=\"s\">renowned\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unknown\u003c/span>\u003cspan class=\"a\">obscure\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">remove\u003c/b>\u003cspan class=\"m\">제거하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">take away\u003c/span>\u003cspan class=\"s\">eliminate\u003c/span>\u003cspan class=\"s\">exclude\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">add\u003c/span>\u003cspan class=\"a\">include\u003c/span>\u003cspan class=\"a\">keep\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">control\u003c/b>\u003cspan class=\"m\">통제하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">manage\u003c/span>\u003cspan class=\"s\">regulate\u003c/span>\u003cspan class=\"s\">direct\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">release\u003c/span>\u003cspan class=\"a\">free\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">noise\u003c/b>\u003cspan class=\"m\">소음\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">din\u003c/span>\u003cspan class=\"s\">racket\u003c/span>\u003cspan class=\"s\">clatter\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">silence\u003c/span>\u003cspan class=\"a\">quiet\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">show\u003c/b>\u003cspan class=\"m\">보여 주다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">display\u003c/span>\u003cspan class=\"s\">reveal\u003c/span>\u003cspan class=\"s\">demonstrate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hide\u003c/span>\u003cspan class=\"a\">conceal\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"시험에 자주 나오는 어휘도 동의어와 반의어로 묶어 볼게요. silence는 quiet, stillness와 가깝고 noise와 반대돼요. strange는 odd, unusual와 비슷하고 normal과 반대되며, famous는 well known, renowned의 반대말로 unknown을 기억하면 좋아요. remove는 take away, eliminate와 연결되고 add나 include의 반대말이에요. control은 manage, regulate와 비슷하고 release와 반대되며, show는 reveal, demonstrate와 가깝고 hide와 반대됩니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어느 늦은 저녁\u003c/span>\u003cspan class=\"en\">One late evening\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1952년 8월에,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">August \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">1952\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 남자가 열었다가 닫았다\u003c/span>\u003cspan class=\"en\">a man \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">opened \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">closed\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">피아노 덮개를 세 번\u003c/span>\u003cspan class=\"en\">the piano cover three times\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">극장에서.\u003c/span>\u003cspan class=\"en\">in a theater.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">1952년 8월 어느 늦은 저녁, 한 남자가 극장에서 피아노 덮개를 세 번 열었다가 닫았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 1952년 8월 어느 늦은 저녁 극장에서 한 남자가 피아노 덮개를 세 번 여닫는 장면으로 글을 시작합니다. 이 장면은 곧 이어질 \u003cb class=\"key\">침묵의 \u003c/b>\u003cb class=\"key\">공연\u003c/b>을 구체적인 시간과 장소, 동작으로 제시해 독자의 \u003cb class=\"key\">호기심\u003c/b>을 끄는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 용법(시간)\u003c/span> : [in + 시간 명사구] : \"1952년 8월에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 and의 병렬 구조\u003c/span> : [동사 과거형] + and + [동사 과거형] : \"열었다가 닫았다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"One late evening, 어느 늦은 저녁. in August of 1952, 1952년 8월에. a man opened and closed, 한 남자가 열었다가 닫았다. the piano cover three times, 피아노 덮개를 세 번. in a theater, 극장에서.. 이 문장 전체를 해석하면, 1952년 8월 어느 늦은 저녁, 한 남자가 극장에서 피아노 덮개를 세 번 열었다가 닫았다.","hl":"m"},{"n":13,"text":"이 문장은 극장에서 피아노 덮개를 세 번 여닫는 장면으로 글을 시작해요. 곧 이어질 침묵의 공연을 구체적인 시간과 장소, 동작으로 보여 주면서 독자의 호기심을 끄는 역할을 하죠.","hl":"mn"},{"n":14,"text":"첫 번째로 opened and closed를 보면 과거형 동사 두 개가 and로 연결되어 있죠. 이렇게 두 동작을 대등하게 잇는 구조를 병렬이라고 해요. 두 번째로 in August of nineteen fifty two는 문장에 시간 정보를 더해 주는 전치사구예요. 그래서 천구백오십이 년 팔월에라는 시간의 뜻으로 해석합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 눌렀다\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">pressed\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">피아노 위에 있는 타이머를\u003c/span>\u003cspan class=\"en\">the timer \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">piano\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 피아노 위에 있는 타이머를 눌렀다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 남자가 피아노 위의 타이머를 누르는 장면은 공연의 시작을 알리는 \u003cb class=\"key\">신호\u003c/b>입니다. 곧 이어질 \u003cb class=\"key\">침묵\u003c/b>의 시간을 재기 위한 준비 동작이며, 다음 문장의 건반을 누르지 않았다는 내용으로 자연스럽게 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">단순 과거시제\u003c/span> : [주어] + [동사 과거형] : \"눌렀다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 용법\u003c/span> : [명사] + [전치사구] : \"피아노 위에 있는\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"He pressed, 그는 눌렀다. the timer on the piano, 피아노 위에 있는 타이머를. 이 문장 전체를 해석하면, 그는 피아노 위에 있는 타이머를 눌렀다.","hl":"m"},{"n":16,"text":"이 장면은 공연의 시작을 알리는 신호예요. 곧 이어질 침묵의 시간을 재기 위한 준비 동작이고, 다음 문장의 건반을 누르지 않았다는 내용으로 자연스럽게 이어지죠.","hl":"mn"},{"n":17,"text":"첫 번째로 pressed는 이미 일어난 과거의 동작을 나타내는 단순 과거형이에요. 두 번째로 on the piano는 앞의 명사 the timer를 뒤에서 꾸며 주는 전치사구예요. 그래서 피아노 위에 있는 타이머라는 의미를 만들어 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그는 누르지 않았다\u003c/span>\u003cspan class=\"en\">And he \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">did \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">press\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 건반도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">any \u003c/span>\u003cspan class=\"tgt\">keys\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">4분 동안\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">four \u003c/span>\u003cspan class=\"tgt\">minutes \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 33초\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">thirty-three \u003c/span>\u003cspan class=\"tgt\">seconds\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그리고 그는 4분 33초 동안 어떤 건반도 누르지 않았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 4분 33초 동안 건반을 전혀 누르지 않았다는 사실이 이 글의 핵심 \u003cb class=\"key\">반전\u003c/b>입니다. 소리를 내지 않는 행위 자체가 \u003cb class=\"key\">음악\u003c/b>이 될 수 있음을 보여 주기 위한 준비이며, 다음 문장에서 John Cage의 작품 설명으로 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">일반동사 과거시제의 부정문\u003c/span> : [주어] + did not + [동사원형] : \"누르지 않았다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부정문에서의 any\u003c/span> : [not] + any + [복수명사] : \"어떤 건반도\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 for의 기간 표현\u003c/span> : for + [기간] : \"4분 33초 동안\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"And he did not press, 그리고 그는 누르지 않았다. any keys, 어떤 건반도. for four minutes, 4분 동안. and thirty-three seconds, 그리고 33초. 이 문장 전체를 해석하면, 그리고 그는 4분 33초 동안 어떤 건반도 누르지 않았다.","hl":"m"},{"n":19,"text":"사 분 삼십삼 초 동안 건반을 전혀 누르지 않았다는 사실이 이 글의 핵심 반전이에요. 소리를 내지 않는 행위 자체가 음악이 될 수 있음을 보여 주기 위한 준비이고, 다음 문장에서 John Cage의 작품 설명으로 이어지죠.","hl":"mn"},{"n":20,"text":"첫 번째로 did not press는 과거의 부정을 만드는 형태예요. 조동사 did가 과거를 담당하고 본동사는 원형 press로 돌아갑니다. 두 번째로 any keys에서 any는 부정문 안에서 어떤 건반도라는 부정의 뜻을 살려 줘요. 세 번째로 for four minutes and thirty three seconds는 동작이 계속된 기간을 나타내는 전치사구입니다.","hl":"gr"}]},{"html":"\u003cdiv c  33초라는 작품. 이 문장 전체를 해석하면, 이상하게 보이겠지만 이것은 John Cage의 4분 33초라는 작품이었다.","hl":"m"},{"n":22,"text":"앞에서 남자가 건반을 하나도 누르지 않고 시간을 보낸 행동, 이상하게 느껴질 수 있죠. 하지만 그건 장난이 아니라 진짜 작품이었어요. 그게 바로 John Cage의 4분 33초예요.","hl":"mn"},{"n":23,"text":"첫 번째, It seems strange에서 it은 가주어예요. 진짜 내용인 that절은 뒤로 빠져 있고 빈자리를 it이 채운 거죠. 두 번째, but은 등위접속사로 앞뒤 절을 반대 흐름으로 이어 줍니다. was 뒤의 John Cage's 4'33\"은 주어 it의 정체를 밝히는 주격보어라는 점도 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 유명한 곡이었다\u003c/span>\u003cspan class=\"en\">It was \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">famous \u003c/span>\u003cspan class=\"tgt\">piece \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">music\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오직 침묵만이 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">only \u003c/span>\u003cspan class=\"tgt\">silence\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">침묵만이 흐르는 유명한 곡이었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 4'33&quot;이 어떤 곡인지 한마디로 규정하는 문장으로, 소리가 전혀 없는 \u003cb class=\"key\">침묵\u003c/b> 자체가 음악이 될 수 있다는 이 글의 핵심 발상을 압축해요. 앞 문장의 '작품'이라는 정보를 '유명한 곡'으로 구체화하며, \u003cb class=\"key\">only\u003c/b>가 붙어 침묵 외에는 아무것도 없다는 점을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 of를 이용한 명사구 수식\u003c/span> : [a famous piece (명사)] + [of music (전치사구/형용사적 수식)] : \"유명한 곡\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 with + 명사 (동반·상태)\u003c/span> : [with (전치사)] + [only silence (명사구)] : \"오직 침묵만이 있는\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"It was a famous piece of music, 그것은 유명한 곡이었다. with only silence, 오직 침묵만이 있는. 이 문장 전체를 해석하면, 침묵만이 흐르는 유명한 곡이었다.","hl":"m"},{"n":25,"text":"이 문장은 4분 33초가 어떤 곡인지 한 방에 규정해 줘요. 소리가 없는 침묵만으로 이루어진 유명한 곡이라는 거죠. 침묵 자체가 음악이 될 수 있다는 이 글의 핵심 발상을 압축한 문장이에요.","hl":"mn"},{"n":26,"text":"첫 번째, a piece of music에서 piece는 양을 나타내는 명사라서 of와 함께 묶여 '한 곡'이라는 명사구를 만들어요. 두 번째, with only silence에서 with는 '~이 있는'이라는 상태를 나타내고, only가 silence를 강조해서 오직 침묵뿐이라는 뜻을 만들어 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Cage는 생각했다\u003c/span>\u003cspan class=\"en\">Cage \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">thought \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들이 음악을 느낄 수 있다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">could \u003c/span>\u003cspan class=\"tgt\">feel \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">music\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">연주자 없이도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">without \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">artist\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서 그는 연주자를 제거했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">so \u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">removed \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">artist\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">음악에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\" 도'라는 부정 조건의 부사구예요. 세 번째, so는 앞의 생각이 뒤의 행동으로 이어지는 인과 관계를 표시합니다. 네 번째, from the music은 remove A from B 구문에서 없애는 출발점을 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공연하는 동안,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">During \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">performance\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">연주자와 작곡가는\u003c/span>\u003cspan class=\"en\">the artist and composer\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">영향을 줄 수 없었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">could \u003c/span>\u003cspan class=\"tgt\">not\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">impact \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">음악에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">on\u003c/span> the music.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">공연하는 동안, 연주자와 작곡가는 음악에 영향을 줄 수 없었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 4분 33초 공연에서 연주자와 작곡가가 음악에 직접 개입하지 못했음을 말합니다. 즉 \u003cb class=\"key\">작가의 \u003c/b>\u003cb class=\"key\">개입\u003c/b> 없이도 소리 자체가 음악이 될 수 있는 구조를 보여 주는 대목입니다. make an impact on은 ~에 \u003cb class=\"key\">영향\u003c/b>을 주다라는 뜻입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 용법\u003c/span> : During + [명사] : \"~하는 동안\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 could의 부정\u003c/span> : [주어] + could not + [동사원형] : \"~할 수 없었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">관용표현(make an impact on)\u003c/span> : make an impact on + [목적어] : \"~에 영향을 주다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"During the performance, 공연하는 동안. the artist and composer, 연주자와 작곡가는. could not make an impact, 영향을 줄 수 없었다. on the music, 음악에. 이 문장 전체를 해석하면, 공연하는 동안, 연주자와 작곡가는 음악에 영향을 줄 수 없었다.","hl":"m"},{"n":31,"text":"이 문장은 공연 중에 연주자와 작곡가가 음악에 직접 개입하지 못했다는 뜻이에요. 다시 말해 작가의 개입 없이도 소리 자체가 음악이 될 수 있는 구조를 보여 주는 거죠. make an impact on은 영향을 주다라는 뜻으로 기억해 두세요.","hl":"mn"},{"n":32,"text":"어법 포인트는 세 가지예요. 첫 번째, During the performance에서 During은 동안을 뜻하는 전치사이고 뒤에 명사가 와서 전체가 부사구 역할을 해요. 두 번째, could not make에서 could는 조동사라서 뒤에 동사원형 make가 오고, not이 붙어 과거의 불가능을 나타냅니다. 세 번째, make an impact on은 impact가 영향을 뜻하는 명사로 쓰인 관용표현이에요. 그래서 영향을 주다로 통째로 외워 두면 좋아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">심지어 Cage 본인조차도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Even \u003c/span>\u003cspan class=\"tgt\">Cage \u003c/span>\u003cspan class=\"tgt\">himself\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">방법이 없었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">no \u003c/span>\u003cspan class=\"tgt\">way \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">소리를 제어할\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">control\u003c/span> the sounds\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">극장의\u003c/span>\u003cspan class=\"en\">in the theater.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">심지어 Cage 본인조차도 극장의 소리를 제어할 방법이 없었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 무대에서 소리를 완전히 통제하려 한 것이 아니라, \u003cb class=\"key\">통제 \u003c/b>\u003cb class=\"key\">불가능\u003c/b>한 소리까지 음악으로 받아들였다는 점을 강조합니다. Even Cage himself는 Cage 본인조차도라는 뜻으로 \u003cb class=\"key\">강조\u003c/b>를 더합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">강조 부사 even과 재귀대명사\u003c/span> : Even + [명사] + himself : \"심지어 ~ 본인조차도\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : have no way + to + [동사원형] : \"~할 방법이 없다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"Even Cage himself, 심지어 Cage 본인조차도. had no way, 방법이 없었다. to control the sounds, 소리를 제어할. in the theater, 극장의. 이 문장 전체를 해석하면, 심지어 Cage 본인조차도 극장의 소리를 제어할 방법이 없었다.","hl":"m"},{"n":34,"text":"이 문장은 Cage가 무대의 소리를 완전히 통제하려 했던 게 아니라, 통제 불가능한 소리까지 음악으로 받아들였다는 점을 보여 줘요. Even Cage himself는 Cage 본인조차도라는 뜻으로 강조를 더합니다. 그래서 작곡가조차 소리를 다스릴 수 없다는 의미를 꼭 기억하세요.","hl":"mn"},{"n":35,"text":"어법 포인트는 두 가지예요. 첫 번째, Even Cage himself에서 Even은 심지어라는 강조 부사이고, himself는 Cage를 다시 가리키는 재귀대명사로 본인조차도라는 뜻을 더해요. 두 번째, had no way to control에서 to control은 way를 뒤에서 꾸며 주는 형용사적 용법이에요. have no way to는 방법이 없다라는 관용 표현으로 통째로 익혀 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">있었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">was\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여전히 실생활 소음이\u003c/span>\u003cspan class=\"en\">still real-life noise\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 사람들은 또한 가질 수 있었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">also \u003c/span>\u003cspan class=\"tgt\">had\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">느낌과 생각을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">some \u003c/span>\u003cspan class=\"tgt\">feelings \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">thoughts\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여전히 실생활 소음이 있었고 사람들은 느낌과 생각도 가질 수 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 무음의 공연 중에도 \u003cb class=\"key\">실생활 \u003c/b>\u003cb class=\"key\">소음\u003c/b>이 남아 있었고, 사람들이 \u003cb class=\"key\">느낌과 \u003c/b>\u003cb class=\"key\">생각\u003c/b>을 가질 수 있었음을 말합니다. 즉 침묵 자체가 아니라 그 순간의 모든 소리와 반응이 \u003cb class=\"key\">음악\u003c/b>이 된다는 Cage의 생각을 뒷받침합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">There be 구문\u003c/span> : There + be동사 + [주어] : \"~이 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 and의 절 연결\u003c/span> : [절] + and + [절] : \"그리고 ~\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">명사 병렬\u003c/span> : [명사 A] + and + [명사 B] : \"느낌과 생각\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"There was, 있었다. still real-life noise, 여전히 실생활 소음이. and people also had, 그리고 사람들은 또한 가질 수 있었다. some feelings and thoughts, 느낌과 생각을. 이 문장 전체를 해석하면, 여전히 실생활 소음이 있었고 사람들은 느낌과 생각도 가질 수 있었다.","hl":"m"},{"n":37,"text":"이 문장은 무음의 공연 중에도 실생활 소음이 남아 있었고, 사람들이 느낌과 생각을 가질 수 있었음을 말해요. 그래서 침묵 자체가 아니라 그 순간의 모든 소리와 반응이 음악이 된다는 Cage의 생각을 뒷받침하는 거죠. real-life noise와 feelings and thoughts를 꼭 함께 기억해 주세요.","hl":"mn"},{"n":38,"text":"어법 포인트는 세 가지예요. 첫 번째, There was는 무엇이 있었다라는 유도부사 구문이고, 뒤에 주어 real-life noise가 와요. 두 번째, and people also had에서 and가 앞의 절과 뒤의 절을 대등하게 연결하고, also는 또한이라는 첨가의 부사예요. 세 번째, some feelings and thoughts에서 feelings와 thoughts가 and로 병렬되어 느낌과 생각이라는 복합적 의미를 만들어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 원했다\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">wanted \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보여 주기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">show\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~라는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 느끼는 모든 것이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">all \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">things\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">feel\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">음악이 될 수 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">music\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 우리가 느끼는 모든 것이 음악이 될 수 있다는 것을 보여 주고 싶었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 존 케이지가 전하고자 한 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">메시지\u003c/b>를 정리한 문장이에요. 예술가가 만드는 소리뿐 아니라 우리가 일상에서 느끼는 \u003cb class=\"key\">감정과 \u003c/b>\u003cb class=\"key\">생각\u003c/b>까지 모두 음악이 될 수 있다는 뜻으로, 글 전체의 \u003cb class=\"key\">주제문\u003c/b> 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : want + [to show (to부정사구/목적어)] : \"보여 주기를 원했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 명사절\u003c/span> : show + [that + 주어 + 동사 ... (명사절/목적어)] : \"모든 것들이 ...라는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 생략\u003c/span> : all the things [(which/that) we feel] : \"우리가 느끼는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">조동사 can + be동사 + 보어\u003c/span> : [주어] + can be + [명사(주격 보어)] : \"음악이 될 수 있다\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"He wanted, 그는 원했다. to show, 보여 주기를. that, ~라는 것을. all the things we feel, 우리가 느끼는 모든 것이. can be music, 음악이 될 수 있다. 이 문장 전체를 해석하면, 그는 우리가 느끼는 모든 것이 음악이 될 수 있다는 것을 보여 주고 싶었다.","hl":"m"},{"n":40,"text":"이 문장은 존 케이지가 전하고자 한 핵심 메시지를 정리한 문장이에요. 예술가가 만드는 소리뿐 아니라 우리가 일상에서 느끼는 감정과 생각까지 모두 음악이 될 수 있다는 뜻으로, 글 전체의 주제문 역할을 해요.","hl":"mn"},{"n":41,"text":"첫 번째, wanted to show에서 want는 목적어로 to부정사를 취하는 동사예요. 그래서 '그는 보여 주기를 원했다'로 해석해요. 두 번째, that all the things에서 show 뒤에 that절이 목적어로 이어져 명사절을 만들고, all the things가 그 절의 주어예요. 세 번째, we feel은 things 뒤에서 목적격 관계대명사가 생략된 형태로 '우리가 느끼는'이라는 뜻이에요. 네 번째, can be music에서 can은 가능성을 나타내고 music은 주어를 설명하는 보어예요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>John Cage의 4분 33초는 피아노를 치지 않고 \u003cb class=\"key\">침묵\u003c/b>을 들려주는 공연처럼 시작된다.\u003c/li>\u003cli>그는 사람들이 \u003cb class=\"key\">연주자\u003c/b> 없이도 음악을 느낄 수 있다고 보아 음악에서 연주자를 제거했다.\u003c/li>\u003cli>공연 중 연주자와 작곡가는 소리에 \u003cb class=\"key\">영향\u003c/b>을 줄 수 없었고, 극장에는 여전히 실생활 소음이 남았다.\u003c/li>\u003cli>결국 이 작품은 우리가 느끼는 모든 것이 \u003cb class=\"key\">음악\u003c/b>이 될 수 있음을 보여 준다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>John Cage's 4'33 shows that all sounds and feelings we experience, not only the artist's performance, can be music.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">John Cage의 4분 33초는 연주자가 소리를 통제하지 않는 \u003cb class=\"key\">침묵\u003c/b>의 곡으로, 극장의 \u003cb class=\"key\">실생활 \u003c/b>\u003cb class=\"key\">소음\u003c/b>과 사람들이 가진 느낌과 생각까지 음악으로 보여 준 작품이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":42,"text":"오늘 글은 John Cage가 침묵을 통해 우리의 듣는 경험을 어떻게 바꾸었는지 보여 줬어요. 그는 연주자를 제거해 연주자와 작곡가가 소리에 영향을 주지 못하게 했고, 그 덕분에 실생활 소음과 사람들의 느낌이 남았죠. 결국 우리가 느끼는 모든 것이 음악이 될 수 있다는 것이 이 글의 핵심이에요. 여러분도 일상의 소리를 음악처럼 들어 보는 경험을 해 보길 바랄게요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
