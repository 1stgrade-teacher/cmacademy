서 s를 붙여요\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"k-ez\" data-hl=\"ge\">주어가 한 사람이나 한 가지일 때, 동사 뒤에 s를 붙여요. 예를 들어 'make'는 'makes'가 돼요. \u003cb class=\"key\">s\u003c/b>를 붙이면 '그/그녀/그것이 ~해요'라는 뜻이 돼요.\u003c/div>\u003c/div>","segs":[{"n":113,"text":"두 번째 문법은 동사 뒤에 s를 붙이는 규칙이에요. 주어가 한 사람이나 한 가지일 때, 동사 뒤에 s를 붙여 '그것이 ~해요'라는 뜻을 만들어요. 대표 문장 'Wintergreen produces toxic acid.'를 덩어리로 보면 'Wintergreen'은 주어, 'produces'는 '만들어요', 'toxic acid'는 '독성 산을'이라는 뜻이에요. 'produce'가 'produces'로 바뀐 것처럼, 주어가 하나일 때는 동사 끝을 잘 살펴보세요.","hl":"gb"},{"n":114,"text":"주어가 한 사람이나 한 가지일 때, 동사 뒤에 s를 붙여요. 예를 들어 'make'는 'makes'가 돼요. s를 붙이면 '그/그녀/그것이 ~해요'라는 뜻이 돼요.","hl":"ge"}]},{"html":"\u003cspan class=\"lp-tag\">확인해요\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-gt\">\u003cspan>✏️\u003c/span>동사에 s를 붙여요\u003c/div>\u003cdiv class=\"k-ex\" data-hl=\"gx\">\u003cdiv>\u003cspan class=\"e\">🍎\u003c/span>\u003cb>She likes apples.\u003c/b>\u003csmall>그녀는 사과를 좋아해요.\u003c/small>\u003c/div>\u003cdiv>\u003cspan class=\"e\">🐶\u003c/span>\u003cb>The dog runs fast.\u003c/b>\u003csmall>그 개는 빨리 달려요.\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"k-ck\" data-hl=\"gc\">\u003cdiv class=\"q\">Wintergreen \u003cspan class=\"k-ans\" data-rv=\"gc\">produces\u003c/span> toxic acid.\u003c/div>\u003csmall>Wintergreen은 독성 산을 만들어요.\u003c/small>\u003cdiv class=\"o\">\u003cspan>produce\u003c/span>\u003cspan class=\"k-right\" data-rv=\"gc\">produces\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":115,"text":"예문을 더 볼까요?","hl":"gx"},{"n":116,"text":"She likes apples.","hl":"gx","v":"n","pause":600},{"n":117,"text":"그녀는 사과를 좋아해요.","hl":"gx"},{"n":118,"text":"The dog runs fast.","hl":"gx","v":"n","pause":600},{"n":119,"text":"그 개는 빨리 달려요.","hl":"gx"},{"n":120,"text":"문제를 풀어 볼까요? Wintergreen 빈칸 toxic acid. 빈칸에 들어갈 말은 produce, 아니면 produces 중에서 무엇일까요?","hl":"gc"},{"n":121,"text":"정답은 produces! Wintergreen produces toxic acid.","hl":"gc","rv":"gc"}]},{"html":"\u003cspan class=\"lp-tag\">내용 확인 문제\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-qq\" data-hl=\"q0\">\u003ci>1\u003c/i>\u003cdiv>\u003cdiv class=\"q\">식물과 동물은 자신의 독으로 자신을 보호해요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q0\">O\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q1\">\u003ci>2\u003c/i>\u003cdiv>\u003cdiv class=\"q\">모든 독은 사람에게 나쁘기만 해요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q1\">X\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q2\">\u003ci>3\u003c/i>\u003cdiv>\u003cdiv class=\"q\">Wintergreen의 독성 산은 무엇을 치료하는 데 도움이 되나요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 열과 통증\u003c/span>\u003cspan>② 암\u003c/span>\u003cspan>③ 감기\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q2\">열과 통증\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q3\">\u003ci>4\u003c/i>\u003cdiv>\u003cdiv class=\"q\">Australian funnel-web spider의 독은 어떤 병을 치료할 수 있을까요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 암 같은 심각한 병\u003c/span>\u003cspan>② 열과 통증\u003c/span>\u003cspan>③ 감기\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q3\">암 같은 심각한 병\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":122,"text":"이제 문제를 풀어 볼까요? 지문에서 답을 찾은 뒤, 왜 그 답인지 문장을 다시 확인해 보세요.","hl":null},{"n":123,"text":"첫 번째 문제. 식물과 동물은 자신의 독으로 자신을 보호해요. 맞으면 O, 틀리면 X예요.","hl":"q0"},{"n":124,"text":"정답은 O, 맞아요.","hl":"q0","rv":"q0"},{"n":125,"text":"두 번째 문제. 모든 독은 사람에게 나쁘기만 해요. 맞으면 O, 틀리면 X예요.","hl":"q1"},{"n":126,"text":"정답은 X, 틀려요.","hl":"q1","rv":"q1"},{"n":127,"text":"세 번째 문제. Wintergreen의 독성 산은 무엇을 치료하는 데 도움이 되나요? 첫 번째, 열과 통증. 두 번째, 암. 세 번째, 감기","hl":"q2"},{"n":128,"text":"정답은 열과 통증예요.","hl":"q2","rv":"q2"},{"n":129,"text":"네 번째 문제. Australian funnel-web spider의 독은 어떤 병을 치료할 수 있을까요? 첫 번째, 암 같은 심각한 병. 두 번째, 열과 통증. 세 번째, 감기","hl":"q3"},{"n":130,"text":"정답은 암 같은 심각한 병예요.","hl":"q3","rv":"q3"}]},{"html":"\u003cspan class=\"lp-tag\">이야기 요약하기\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-bank\">\u003cspan>cures\u003c/span>\u003cspan>medicines\u003c/span>\u003cspan>poisons\u003c/span>\u003c/div>\u003cdiv class=\"k-sum\" data-hl=\"sm\">Plants and animals make \u003cspan class=\"k-ans\" data-rv=\"sm\">poisons\u003c/span> to protect themselves. Some poisons are dangerous, but scientists use them to make \u003cspan class=\"k-ans\" data-rv=\"sm\">medicines\u003c/span>. They study poisons from wintergreen, cone snails, and spiders to find new \u003cspan class=\"k-ans\" data-rv=\"sm\">cures\u003c/span>.\u003c/div>\u003cdiv class=\"k-sk\">식물과 동물은 자신을 보호하려고 독을 만들어요. 어떤 독은 위험하지만, 과학자들은 그 독을 이용해 약을 만들어요. 그들은 겨울그린, 콘 스네일, 거미의 독을 연구해서 새로운 치료법을 찾아요.\u003c/div>\u003c/div>","segs":[{"n":131,"text":"마지막으로 오늘 이야기를 쉬운 영어로 정리해 볼게요. 식물과 동물의 독이 어떻게 사람에게 도움이 되는 약이나 치료법이 되는지 생각하며 읽어 보세요.","hl":null},{"n":132,"text":"Plants and animals make poisons to protect themselves. Some poisons are dangerous, but scientists use them to make medicines. They study poisons from wintergreen, cone snails, and spiders to find new cures.","hl":"sm","rv":"sm","v":"n"},{"n":133,"text":"식물과 동물은 자신을 보호하려고 독을 만들어요. 어떤 독은 위험하지만, 과학자들은 그 독을 이용해 약을 만들어요. 그들은 겨울그린, 콘 스네일, 거미의 독을 연구해서 새로운 치료법을 찾아요.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>The Power of Poison 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":134,"text":"오늘은 독이 위험하기만 한 것이 아니라, 과학자들의 연구로 좋은 약이 될 수 있다는 것을 배웠어요. 여러분도 주변의 자연에 관심을 가지고 관찰해 보세요. 정말 잘했어요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
