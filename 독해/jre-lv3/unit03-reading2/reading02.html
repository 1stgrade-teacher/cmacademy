tage-head\">03정식 놀이공원으로의 도약</div><ul><li>1885년 전기 도입과 시설 확충을 통해 현대적인 놀이공원의 면모를 갖추었습니다.</li><li>전기(electricity)를 활용한 시설 운영</li><li>서커스 및 움직이는 놀이기구(moving rides) 도입</li><li>핵심 키워드: 전기(electricity), 놀이기구(rides)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04현재의 바켄</div><ul><li>바켄은 오늘날까지도 운영되며 유서 깊은 놀이기구들로 즐거움을 제공합니다.</li><li>관람차(Ferris wheel)와 오래된 롤러코스터 운영</li><li>수 세기를 이어온 역사적인 놀이공원의 명성</li><li>핵심 키워드: 롤러코스터(roller coaster), 전통(tradition)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">amusement park</td><td class=\"m\">놀이공원, 유원지</td></tr><tr><td class=\"w\">bring joy to</td><td class=\"m\">~에게 기쁨을 주다, ~을 즐겁게 하다</td></tr><tr><td class=\"w\">in fact</td><td class=\"m\">사실은, 실제로</td></tr><tr><td class=\"w\">at that time</td><td class=\"m\">그 당시에</td></tr><tr><td class=\"w\">soon after</td><td class=\"m\">얼마 지나지 않아, 곧</td></tr><tr><td class=\"w\">hope for</td><td class=\"m\">~을 바라다, ~을 기대하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fame</td><td class=\"m\">명성, 유명세</td></tr><tr><td class=\"w\">proper</td><td class=\"m\">적절한, 제대로 된</td></tr><tr><td class=\"w\">until much later</td><td class=\"m\">훨씬 나중까지(계속 ~하지 않았다)</td></tr><tr><td class=\"w\">power</td><td class=\"m\">전력을 공급하다, 작동시키다</td></tr><tr><td class=\"w\">attract</td><td class=\"m\">끌어들이다, 유인하다</td></tr><tr><td class=\"w\">these days</td><td class=\"m\">오늘날, 요즘</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">놀이공원은</span><span class=\"en\"><b>Amusement parks</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그곳의 손님들에게 즐거움을 가져다주었다</span><span class=\"en\"><b><span class=\"grammar-hl\">have brought</span> joy to their guests</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수년 동안</span><span class=\"en\"><b>for many years.</b></span></div></div><div class=\"lec-sent-ko\">놀이공원은 수년 동안 그곳의 손님들에게 즐거움을 가져다주었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글 전체의 주제를 도입하는 문장으로, 놀이공원이 가진 오락적 가치가 아주 오랜 기간 지속되어 왔음을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">have brought (현재완료): have + p.p. 형태를 사용하여 과거의 특정 시점부터 현재까지의 지속적인 동작이나 상태를 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">amusement park</td><td class=\"m\">놀이공원, 유원지</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사실,</span><span class=\"en\"><b>In fact,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">바로 그 첫 번째 놀이공원은,</span><span class=\"en\"><b><span class=\"grammar-hl\">the very first</span> amusement park,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">바켄이라 불리는,</span><span class=\"en\"><b><span class=\"grammar-hl\">called Bakken</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">코펜하겐, 덴마크에 세워졌다</span><span class=\"en\"><b><span class=\"grammar-hl\">was founded</span> in Copenhagen, Denmark</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">1583년에</span><span class=\"en\"><b>in 1583!</b></span></div></div><div class=\"lec-sent-ko\">사실, 바켄이라고 불리는 최초의 놀이공원은 1583년 덴마크 코펜하겐에 세워졌다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 놀이공원의 오랜 역사를 뒷받침하기 위해 구체적인 사례인 &#39;바켄&#39;의 기원을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the very first (강조구문): very는 명사 앞에서 &#39;바로 그&#39;라는 의미로 특정 명사를 강조하는 역할을 합니다.</div><div class=\"lec-gr-item\">called Bakken (과거분사(형용사)): called가 Bakken이라는 이름을 수식하며 &#39;Bakken이라 불리는&#39;이라는 의미를 갖습니다. 명사(park) + 과거분사(called) 구조로 &#39;N that is/was called&#39;의 축약 관계절로 볼 수 있습니다.</div><div class=\"lec-gr-item\">was founded (수동태): be동사(was)+p.p.(founded) 구조. found는 타동사인데 목적어가 없어서 수동구조 was founded 형태로 씁니다. 기본구조: V + O (누군가 A를 설립하다).</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">amusement park</td><td class=\"m\">놀이공원, 유원지</td></tr><tr><td class=\"w\">in fact</td><td class=\"m\">사실은, 실제로</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 당시에,</span><span class=\"en\"><b><span class=\"grammar-hl\">At that time,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한 여성이 샘을 발견했다</span><span class=\"en\"><b><span class=\"grammar-hl\">a woman discovered</span> a spring</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">도시 근처의 숲속에 있는</span><span class=\"en\"><b>in a forest near the city.</b></span></div></div><div class=\"lec-sent-ko\">그 당시, 한 여성이 도시 근처의 숲에서 샘을 발견했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 본격적인 놀이공원의 탄생 배경을 설명하기 위해, 왜 사람들이 그 장소에 모이게 되었는지 사건의 시발점을 알려줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">At that time, a woman discovered 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">at that time</td><td class=\"m\">그 당시에</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">코펜하겐의 물은 깨끗하지 않았다,</span><span class=\"en\"><b>Copenhagen’s water wasn’t clean,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그래서 많은 사람들이 그 샘을 방문하기 시작했다</span><span class=\"en\"><b>so many people started <span class=\"grammar-hl\">visiting</span> the spring</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">물을 얻기 위해</span><span class=\"en\"><b>for water.</b></span></div></div><div class=\"lec-sent-ko\">코펜하겐의 물은 깨끗하지 않았기 때문에, 많은 사람들이 물을 얻기 위해 그 샘을 방문하기 시작했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 샘물 발견이 어떻게 사람들을 끌어모으는 계기가 되었는지 그 인과관계를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">visiting (동명사): start의 목적어 역할을 하며 &#39;방문하는 것&#39;이라는 행위적 명사 개념을 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">얼마 지나지 않아,</span><span class=\"en\"><b>Soon after,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 인기 있는 장소가 되었다</span><span class=\"en\"><b>it became a popular place</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">연예인들과 판매원들에게</span><span class=\"en\"><b>for entertainers and salesmen</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 많은 사업 기회를 바라고 있던</span><span class=\"en\"><b><span class=\"grammar-hl\">who were hoping</span> for more business.</b></span></div></div><div class=\"lec-sent-ko\">얼마 지나지 않아, 그곳은 추가적인 사업 기회를 원하고 있었던 연예인들과 판매원들에게 인기 있는 장소가 되었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 사람들이 모이는 곳에는 경제 활동이 뒤따른다는 원리에 따라, 샘터가 상업적 공간으로 변모해가는 과정을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">who were hoping (관계대명사): who가 선행사(entertainers and salesmen)를 수식하는 주격 관계대명사 절입니다. 절 내부에서 who가 주어 역할을 합니다.</div><div class=\"lec-gr-item\">were hoping (과거진행): be동사(were) + -ing(hoping)를 사용하여 과거의 특정 시점에 진행 중이던 동작을 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">soon after</td><td class=\"m\">얼마 지나지 않아, 곧</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 지역의 명성은 빠르게 커졌다,</span><span class=\"en\"><b><span class=\"grammar-hl\">The area’s fame grew quickly,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 그것은 제대로 된 놀이공원이 되지 않았다</span><span class=\"en\"><b><span class=\"grammar-hl\">but</span> it didn’t become a proper amusement park</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">훨씬 나중까지는</span><span class=\"en\"><b>until much later.</b></span></div></div><div class=\"lec-sent-ko\">그 지역의 명성은 빠르게 높아졌지만, 그곳은 훨씬 후에야 제대로 된 놀이공원이 되었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 사람들에게 유명해진 것과 놀이공원이라는 기능을 갖추는 것 사이에는 시간적 간극이 있음을 나타내어 내용의 전환을 꾀합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">The area’s fame grew quickly, but 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">amusement park</td><td class=\"m\">놀이공원, 유원지</td></tr><tr><td class=\"w\">fame</td><td class=\"m\">명성, 유명세</td></tr><tr><td class=\"w\">proper</td><td class=\"m\">적절한, 제대로 된</td></tr><tr><td class=\"w\">until much later</td><td class=\"m\">훨씬 나중까지(계속 ~하지 않았다)</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">1885년에,</span><span class=\"en\"><b>In 1885,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">건물들과 천막들이 세워졌고,</span><span class=\"en\"><b>buildings and tents <span class=\"grammar-hl\">were built</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 공원은 전력을 공급받았다</span><span class=\"en\"><b>and the park <span class=\"grammar-hl\">was powered</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">전기에 의해</span><span class=\"en\"><b>by electricity.</b></span></div></div><div class=\"lec-sent-ko\">1885년에 건물들과 천막들이 지어졌고, 공원은 전기로 작동되었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 예고했던 &#39;제대로 된 놀이공원&#39;으로 변화하기 위한 물리적 기반 시설이 갖춰졌음을 구체적으로 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">were built (수동태): be동사(were)+p.p.(built) 구조. build는 타동사인데 목적어가 없어서 수동구조 were built 형태로 씁니다. 기본구조: V + O (누군가 A를 짓다).</div><div class=\"lec-gr-item\">was powered (수동태): be동사(was)+p.p.(powered) 구조. power는 타동사인데 목적어가 없어서 수동구조 was powered 형태로 씁니다. 기본구조: V + O (전기가 A를 가동하다).</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">power</td><td class=\"m\">전력을 공급하다, 작동시키다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것은 서커스단과 움직이는 놀이기구들을 끌어들였다</span><span class=\"en\"><b>This attracted circuses and moving rides</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 장소로</span><span class=\"en\"><b>to the place</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그것을 제대로 된 놀이공원으로 만들었다</span><span class=\"en\"><b>and <span class=\"grammar-hl\">made it a proper amusement park</span>.</b></span></div></div><div class=\"lec-sent-ko\">이것은 서커스들과 움직이는 놀이기구들을 그곳으로 끌어들였고, 그곳을 제대로 된 놀이공원으로 만들었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 인프라 개선이라는 결과가 어떻게 현대적 의미의 놀이공원이라는 최종 완성형으로 이어졌는지 인과관계를 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">made it a proper amusement park (5형식(SVOC)): make + O + C 구조로, 목적어(it)를 보어(a proper amusement park) 상태로 만들다라는 의미입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">amusement park</td><td class=\"m\">놀이공원, 유원지</td></tr><tr><td class=\"w\">proper</td><td class=\"m\">적절한, 제대로 된</td></tr><tr><td class=\"w\">attract</td><td class=\"m\">끌어들이다, 유인하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">요즘,</span><span class=\"en\"><b>These days,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">바켄은 여전히 운영 중이다,</span><span class=\"en\"><b>Bakken is still open,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 손님들은 놀이기구들을 즐길 수 있다</span><span class=\"en\"><b>and guests can enjoy rides</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">대관람차와 82년 된 롤러코스터와 같은</span><span class=\"en\"><b>such as the Ferris wheel and an <span class=\"grammar-hl\">82-year-old</span> roller coaster!</b></span></div></div><div class=\"lec-sent-ko\">요즘, 바켄은 여전히 운영 중이고, 손님들은 대관람차와 82년 된 롤러코스터와 같은 놀이기구를 즐길 수 있다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 결론으로서, 1583년에 시작된 바켄이 지금까지도 과거의 유산과 현대의 오락을 동시에 제공하며 건재함을 알립니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">82-year-old (관용표현): 하이픈(-)으로 연결된 형용사구로 명사(roller coaster)를 앞에서 수식합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">these days</td><td class=\"m\">오늘날, 요즘</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>놀이공원은 오랜 역사를 지녔으며, 그 시초는 1583년 덴마크의 바켄이다.</li><li>바켄은 처음에는 단순히 깨끗한 물을 얻으려는 사람들로 인해 유명해졌다.</li><li>이후 상업적 활동이 더해지고, 1885년 전기가 도입되는 등 인프라가 갖춰지며 정식 놀이공원이 되었다.</li><li>현재 바켄은 역사와 즐길 거리가 공존하는 공간으로 운영되고 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Bakken originated from a clean spring discovered in 1583, and it eventually developed into a modern amusement park with rides after adding facilities.</div>\n              <div class=\"lec-final-sum-ko\">바켄은 1583년 발견된 깨끗한 샘물에서 기원했으며, 시설 확충을 통해 점차 놀이기구를 갖춘 현대적인 놀이공원으로 발전했다.</div></div></div>"],"segs":[[{"audio":"./reading02_audio/1.mp3","hl":null}],[{"audio":"./reading02_audio/2.mp3","hl":null}],[{"audio":"./reading02_audio/3.mp3","hl":null},{"audio":"./reading02_audio/4.mp3","hl":"stage-0"},{"audio":"./reading02_audio/5.mp3","hl":"stage-1"},{"audio":"./reading02_audio/6.mp3","hl":"stage-2"},{"audio":"./reading02_audio/7.mp3","hl":"stage-3"}],[{"audio":"./reading02_audio/8.mp3","hl":null}],[{"audio":"./reading02_audio/9.mp3","hl":"main"},{"audio":"./reading02_audio/10.mp3","hl":"meaning"},{"audio":"./reading02_audio/11.mp3","hl":"grammar"}],[{"audio":"./reading02_audio/12.mp3","hl":"main"},{"audio":"./reading02_audio/13.mp3","hl":"meaning"},{"audio":"./reading02_audio/14.mp3","hl":"grammar"}],[{"audio":"./reading02_audio/15.mp3","hl":"main"},{"audio":"./reading02_audio/16.mp3","hl":"meaning"},{"audio":"./reading02_audio/17.mp3","hl":"grammar"}],[{"audio":"./reading02_audio/18.mp3","hl":"main"},{"audio":"./reading02_audio/19.mp3","hl":"meaning"},{"audio":"./reading02_audio/20.mp3","hl":"grammar"}],[{"audio":"./reading02_audio/21.mp3","hl":"main"},{"audio":"./reading02_audio/22.mp3","hl":"meaning"},{"audio":"./reading02_audio/23.mp3","hl":"grammar"}],[{"audio":"./reading02_audio/24.mp3","hl":"main"},{"audio":"./reading02_audio/25.mp3","hl":"meaning"},{"audio":"./reading02_audio/26.mp3","hl":"grammar"}],
