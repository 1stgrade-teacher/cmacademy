<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>쥬니어리딩엑스퍼트3 Unit3_Reading02 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"쥬니어리딩엑스퍼트3 Unit3_Reading02","audioDir":"reading02_audio","preview":false,"count":39,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.400em\">Unit3_Reading02\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">쥬니어리딩엑스퍼트3\u003c/div>\u003ch1>From a Spring to an Amusement Park: The Story of Bakken\u003c/h1>\u003ch2>샘에서 놀이공원으로: 바켄의 이야기\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>놀이공원은 오랫동안 사람들에게 즐거움을 주어 왔는데, \u003cb class=\"key\">최초의 \u003c/b>\u003cb class=\"key\">놀이공원\u003c/b>인 바켄은 1583년 덴마크 코펜하겐의 한 \u003cb class=\"key\">샘\u003c/b>에서 시작되었다. 깨끗한 물을 찾아 사람들이 모이면서 명성이 높아졌고, 1885년 전기가 들어오고 \u003cb class=\"key\">놀이기구\u003c/b>가 모여들면서 제대로 된 놀이공원이 되었으며 오늘날에도 여전히 운영되고 있다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Bakken, the world's first amusement park, grew from a simple spring into a proper amusement park over several centuries.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 놀이공원의 역사를 담은 지문을 함께 읽어 볼 거예요. 이 글은 세계 최초의 놀이공원인 Bakken이 어떻게 시작해서 오늘에 이르렀는지를 시간 순서로 들려줍니다. 요지는 Bakken이 처음에는 그냥 샘터였는데, 사람들이 모이고 전기가 들어오면서 제대로 된 놀이공원으로 발전했다는 거예요. 자, 그럼 문장 하나하나 따라가 볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">놀이공원(amusement park)은 놀이기구(ride)와 공연 같은 \u003cb class=\"key\">오락 \u003c/b>\u003cb class=\"key\">시설\u003c/b>을 갖춘 장소로, 오늘날에는 대관람차(Ferris wheel)나 롤러코스터(roller coaster)처럼 속도와 스릴을 즐기는 공간으로 자리 잡았다. 그런데 이런 공원의 출발은 대개 '사람들이 모이는 이유'라는 아주 단순한 조건에서 비롯된다. 동네 맛집에 줄이 길어지면 자연스럽게 주변 상권이 같이 붐비는 것처럼, 볼거리나 필요한 것이 있는 곳에는 사람이 모이고 그 주변에 다시 상인과 공연가가 모여든다. 16세기 유럽은 도시의 위생(hygiene)이 좋지 않아 \u003cb class=\"key\">깨끗한 \u003c/b>\u003cb class=\"key\">물\u003c/b>이 귀한 자원이었다. 특히 전기(electricity)가 보급되기 전에는 야간 운영이나 기계식 놀이기구를 움직일 방법이 없었기에, \u003cb class=\"key\">전력\u003c/b> 공급은 공원이 '제대로 된' 시설로 바뀌는 결정적 계기가 되었다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식부터 짚고 갈게요. 놀이공원은 놀이기구와 공연 같은 오락 시설을 갖춘 장소이고, 오늘날에는 대관람차나 롤러코스터처럼 스릴을 즐기는 공간이 되었죠. 그런데 이런 공원의 출발은 사람들이 모이는 이유라는 아주 단순한 조건에서 비롯됩니다. 동네 맛집에 줄이 길어지면 주변 상권이 같이 붐비는 것처럼, 볼거리가 있는 곳에는 사람이 모이고 그 주변에 다시 상인과 공연가가 모여들어요. 십육 세기 유럽은 도시 위생이 좋지 않아 깨끗한 물이 귀한 자원이었고, 전기가 보급되기 전에는 기계식 놀이기구를 움직일 방법이 없었어요. 그래서 전력 공급은 공원이 제대로 된 시설로 바뀌는 결정적 계기가 되었습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>놀이공원의 등장\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>글은 놀이공원이 오랫동안 손님들에게 \u003cb class=\"key\">즐거움\u003c/b>을 주었다는 일반적인 설명으로 시작한다. 이어서 사실 관계를 강조하며 \u003cb class=\"key\">최초의 \u003c/b>\u003cb class=\"key\">놀이공원\u003c/b>이 1583년 덴마크 코펜하겐에 세워졌다고 밝힌다. 즉 도입부에서 다룰 대상과 그 \u003cb class=\"key\">정체\u003c/b>를 먼저 제시하는 것이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>샘터에서 사람들이 모이다\u003csmall>기원 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>당시 한 여성이 도시 근처 숲에서 \u003cb class=\"key\">샘\u003c/b>을 발견했고, 코펜하겐의 물이 깨끗하지 않아 많은 사람들이 물을 얻으러 그곳을 찾기 시작했다. 사람이 모이자 \u003cb class=\"key\">연예인\u003c/b>들과 판매원들도 사업 기회를 노리고 모여들었다. 결국 그 샘터는 자연스럽게 인기 있는 \u003cb class=\"key\">장소\u003c/b>로 바뀌었다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>전기와 놀이기구의 등장\u003csmall>전환 · 문장 6–8\u003c/small>\u003c/h4>\u003cp>그 지역의 \u003cb class=\"key\">명성\u003c/b>은 빠르게 높아졌지만 곧바로 놀이공원이 된 것은 아니었다. 1885년에 건물과 천막이 지어지고 공원에 \u003cb class=\"key\">전기\u003c/b>가 공급되면서 상황이 달라졌다. 전력은 서커스와 움직이는 \u003cb class=\"key\">놀이기구\u003c/b>를 끌어들였고, 그때서야 제대로 된 놀이공원이 완성되었다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>오늘날의 바켄\u003csmall>결론 · 문장 9\u003c/small>\u003c/h4>\u003cp>마지막으로 바켄이 요즘에도 \u003cb class=\"key\">운영\u003c/b>되고 있음이 제시된다. 손님들은 대관람차와 82년 된 \u003cb class=\"key\">롤러코스터\u003c/b> 같은 놀이기구를 즐길 수 있다. 오랜 시간이 흘러도 여전히 \u003cb class=\"key\">놀이공원\u003c/b>으로 기능한다는 점이 글의 마무리다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 네 단계로 나눠서 살펴볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 도입이에요. 글은 놀이공원이 오랫동안 손님들에게 즐거움을 주었다는 일반적인 이야기로 시작해요. 그리고 사실을 강조하면서 최초의 놀이공원인 Bakken이 천오백팔십삼 년에 덴마크 코펜하겐에 세워졌다고 알려 주죠. 이렇게 도입부에서 다룰 대상과 그 정체를 먼저 제시합니다.","hl":"f0"},{"n":5,"text":"두 번째 단계는 Bakken의 기원이에요. 그 당시 한 여성이 도시 근처 숲에서 샘을 발견했고, 코펜하겐의 물이 깨끗하지 않아서 많은 사람들이 물을 얻으러 그곳을 찾기 시작했어요. 사람이 모이니까 연예인들과 판매원들도 더 많은 사업 기회를 기대하고 모여들었죠. 결국 그 샘터는 자연스럽게 인기 있는 장소가 됩니다.","hl":"f1"},{"n":6,"text":"세 번째 단계는 전기와 놀이기구의 등장이에요. 그 지역의 명성은 빠르게 높아졌지만, 한참 뒤까지는 제대로 된 놀이공원이 아니었어요. 천팔백팔십오 년에 건물과 천막이 지어지고 공원이 전기로 작동되면서 상황이 달라집니다. 전력이 들어오자 서커스와 움직이는 놀이기구가 그곳으로 모여들었고, 그때서야 제대로 된 놀이공원이 완성됐어요.","hl":"f2"},{"n":7,"text":"마지막 단계는 오늘날의 모습이에요. 요즘도 Bakken은 여전히 운영 중이고, 손님들은 대관람차와 팔십이 년 된 롤러코스터 같은 놀이기구를 즐길 수 있어요. 오랜 세월이 지나도 그곳이 여전히 놀이공원으로 기능한다는 점이 이 글의 마무리예요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 2번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 첫 부분에서 \u003cb class=\"key\">최초의 \u003c/b>\u003cb class=\"key\">놀이공원\u003c/b>을 먼저 제시한 뒤, 1583년에서 1885년, 그리고 현재로 이어지는 \u003cb class=\"key\">시간\u003c/b> 순서로 내용을 전개한다. 각 사건이 앞 사건의 결과를 이어받아 다음 사건으로 넘어가므로 \u003cb class=\"key\">인과\u003c/b> 관계가 시간의 흐름과 겹쳐 나타난다. 처음에 다룰 대상을 밝히고 마지막에 현재 모습으로 마무리하므로 \u003cb class=\"key\">두괄식\u003c/b> 구조로 볼 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>At that time (3)\u003c/b>\u003cspan>시간 전환\u003c/span>\u003cb>Soon after (5)\u003c/b>\u003cspan>시간·결과\u003c/span>\u003cb>until much later (6)\u003c/b>\u003cspan>부정을 통한 전환\u003c/span>\u003cb>In 1885 (7)\u003c/b>\u003cspan>구체적 시점 제시\u003c/span>\u003cb>These days (9)\u003c/b>\u003cspan>현재로 시점 전환\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">the very first amusement park, called Bakken\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a popular place\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a proper amusement park\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Bakken is still open\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 시간순이에요. 최초의 놀이공원을 먼저 소개하고, 그 뒤 시대가 흐르면서 어떤 일이 있었는지를 차례로 보여 주죠. 앞의 사건이 다음 사건의 원인이 되는 인과 관계가 시간의 흐름과 함께 나타나요. 처음에 다룰 대상을 밝히고 마지막에 현재 모습으로 마무리하니까 두괄식 구조로 읽으면 됩니다.","hl":"ty"},{"n":9,"text":"신호어를 눈여겨보세요. At that time은 시간을 옮겨 주고, Soon after는 앞의 일에 이어 바로 다음 일이 일어났음을 알려 줘요. until much later는 부정을 통한 전환을, In 1885는 구체적인 시점을, These days는 현재로 시점을 바꿔 줍니다. 그리고 the very first amusement park, called Bakken 뒤에 나오는 a popular place, a proper amusement park처럼 같은 대상을 다른 말로 다시 표현하는 재진술도 놓치지 마세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>amusement park\u003c/b>\u003cem>명사\u003c/em>\u003cspan>놀이공원\u003c/span>\u003c/div>\u003cdiv>\u003cb>joy\u003c/b>\u003cem>명사\u003c/em>\u003cspan>즐거움, 기쁨\u003c/span>\u003c/div>\u003cdiv>\u003cb>in fact\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>사실은, 실제로\u003c/span>\u003c/div>\u003cdiv>\u003cb>found\u003c/b>\u003cem>동사\u003c/em>\u003cspan>설립하다, 세우다\u003c/span>\u003c/div>\u003cdiv>\u003cb>discover\u003c/b>\u003cem>동사\u003c/em>\u003cspan>발견하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>spring\u003c/b>\u003cem>명사\u003c/em>\u003cspan>샘, 용수철\u003c/span>\u003c/div>\u003cdiv>\u003cb>forest\u003c/b>\u003cem>명사\u003c/em>\u003cspan>숲\u003c/span>\u003c/div>\u003cdiv>\u003cb>near\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~근처에\u003c/span>\u003c/div>\u003cdiv>\u003cb>clean\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>깨끗한\u003c/span>\u003c/div>\u003cdiv>\u003cb>visit\u003c/b>\u003cem>동사\u003c/em>\u003cspan>방문하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>soon after\u003c/b>\u003cem>숙어 >In fact,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">최초의 놀이공원은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">very \u003c/span>\u003cspan class=\"tgt\">first\u003c/span> amusement park,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바켄이라고 불리는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">called \u003c/span>\u003cspan class=\"tgt\">Bakken\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세워졌다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">founded\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">덴마크 코펜하겐에\u003c/span>\u003cspan class=\"en\">in Copenhagen, Denmark\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1583년에!\u003c/span>\u003cspan class=\"en\">in 1583!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사실, 바켄이라고 불리는 최초의 놀이공원은 1583년 덴마크 코펜하겐에 세워졌다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 일반적인 설명에 \u003cb class=\"key\">구체적 \u003c/b>\u003cb class=\"key\">사실\u003c/b>을 더하는 문장이에요. very를 붙여 \u003cb class=\"key\">최초\u003c/b>라는 점을 강조하고, called Bakken으로 공원의 이름을 덧붙여 \u003cb class=\"key\">부연\u003c/b>합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">very의 최상급 강조\u003c/span> : the + [[very]] + [서수·최상급] : \"바로 최초의\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사구의 형용사적 수식\u003c/span> : [명사 the very first amusement park] + [[called]] + [이름] : \"바켄이라고 불리는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">수동태(과거)\u003c/span> : 주어 + [[was]] + [[과거분사 founded]] : \"세워졌다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"In fact, 사실. the very first amusement park, 최초의 놀이공원은. called Bakken, 바켄이라고 불리는. was founded, 세워졌다. in Copenhagen, Denmark, 덴마크 코펜하겐에. in 1583!, 1583년에!. 이 문장 전체를 해석하면, 사실, 바켄이라고 불리는 최초의 놀이공원은 1583년 덴마크 코펜하겐에 세워졌다!","hl":"m"},{"n":16,"text":"이 문장은 사실 관계를 콕 짚어 주는 문장이에요. 최초의 놀이공원이 바로 바켄이고, 그 공원이 덴마크 코펜하겐에서 아주 오래전에 세워졌다는 걸 알려 주죠. called Bakken은 공원의 이름을 덧붙여 주는 표현이에요.","hl":"mn"},{"n":17,"text":"어법 첫 번째, called Bakken은 과거분사로 앞의 명사를 뒤에서 꾸며 주는 형태예요. 동사 call이 수동의 의미를 가지면서 '불리는'으로 해석되죠. 두 번째, was founded는 수동태예요. 놀이공원은 누군가에 의해 세워지는 대상이니까 수동으로 쓴 거예요. 세 번째, the very first에서 very는 서수 앞에서 '바로 그'라는 강조를 더해 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 당시,\u003c/span>\u003cspan class=\"en\">At that time,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 여성이\u003c/span>\u003cspan class=\"en\">a woman\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">샘을 발견했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">discovered\u003c/span> a spring\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">숲에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">forest \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">도시 근처의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">near \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">city\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 당시, 한 여성이 도시 근처의 숲에서 샘을 발견했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 바켄이 놀이공원이 되기 전의 \u003cb class=\"key\">배경\u003c/b>을 설명하는 문장이에요. \u003cb class=\"key\">샘\u003c/b>을 발견한 사건이 뒤에 나올 사람들의 방문으로 이어지는 \u003cb class=\"key\">출발점\u003c/b>이 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">단순과거 시제\u003c/span> : 주어 + [[동사원형 + -ed]] : \"발견했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 수식\u003c/span> : [명사 a forest] + [[near the city]] : \"도시 근처의 숲에서\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"At that time, 그 당시. a woman, 한 여성이. discovered a spring, 샘을 발견했다. in a forest, 숲에서. near the city, 도시 근처의. 이 문장 전체를 해석하면, 그 당시, 한 여성이 도시 근처의 숲에서 샘을 발견했다.","hl":"m"},{"n":19,"text":"이 문장은 놀이공원이 생기기 전의 배경을 알려 줘요. 한 여성이 도시 근처 숲에서 샘을 발견했고, 바로 그 사건이 사람들이 몰려오는 출발점이 되죠.","hl":"mn"},{"n":20,"text":"어법 첫 번째, discovered는 과거 시제예요. 그 당시에 일어난 일이라 단순과거로 썼죠. 두 번째, in a forest near the city에서 near the city는 앞에 있는 a forest를 꾸며 주는 말이에요. 그래서 '도시 근처의 숲'이라는 뜻이 되고, 맨 앞의 in은 발견한 장소를 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">코펜하겐의 물은\u003c/span>\u003cspan class=\"en\">Copenhagen's water\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">깨끗하지 않았기 때문에,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">wasn't \u003c/span>\u003cspan class=\"tgt\">clean\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서 많은 사람들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">so\u003c/span> many people\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">방문하기 시작했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">started \u003c/span>\u003cspan class=\"tgt\">visiting\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 샘을\u003c/span>\u003cspan class=\"en\">the spring\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">물을 얻기 위해.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">water\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">코펜하겐의 물은 깨끗하지 않았기 때문에, 많은 사람들이 물을 얻기 위해 그 샘을 방문하기 시작했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 코펜하겐 사람들이 왜 숲속 샘을 찾게 되었는지 \u003cb class=\"key\">이유\u003c/b>를 알려 줘요. 물이 깨끗하지 않다는 \u003cb class=\"key\">문제\u003c/b>가 사람들의 발길을 샘으로 옮겨 놓은 거죠. 그래서 이 샘은 자연스럽게 많은 사람이 모이는 \u003cb class=\"key\">장소\u003c/b>가 되고, 다음 문장에서 연예인과 판매원까지 몰려드는 흐름으로 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사의 부정문(상태 묘사)\u003c/span> : [주어] + was not + [형용사(주격보어)] : \"깨끗하지 않았다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 so(결과)\u003c/span> : [원인 문장] + so + [결과 문장] : \"그래서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동명사를 목적어로 취하는 동사(start)\u003c/span> : start + [동명사(-ing)] : \"방문하기 시작했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">전치사 for의 목적·용도\u003c/span> : for + [명사(얻으려는 대상)] : \"물을 얻기 위해\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Copenhagen's water, 코펜하겐의 물은. wasn't clean, 깨끗하지 않았기 때문에. so many people, 그래서 많은 사람들이. started visiting, 방문하기 시작했다. the spring, 그 샘을. for water, 물을 얻기 위해.. 이 문장 전체를 해석하면, 코펜하겐의 물은 깨끗하지 않았기 때문에, 많은 사람들이 물을 얻기 위해 그 샘을 방문하기 시작했다.","hl":"m"},{"n":22,"text":"이 문장은 사람들이 그 샘을 찾게 된 이유를 알려 줘요. 코펜하겐의 물이 깨끗하지 않아서 사람들이 물을 얻으러 숲속 샘으로 몰렸다는 거죠. 그래서 이 샘은 자연스럽게 사람들이 모이는 장소가 됩니다.","hl":"mn"},{"n":23,"text":"먼저 wasn't clean은 be동사 뒤에 not을 붙여 상태를 부정하는 형태예요. clean이 주어 water의 상태를 설명하는 주격보어로 온 구조죠. 두 번째로 so는 앞의 원인에 이어 결과를 말해 주는 등위접속사예요. 세 번째로 started visiting은 start 뒤에 동명사가 온 형태로, 방문하기 시작했다는 동작의 시작을 보여 줍니다. 마지막으로 for water의 for는 목적을 나타내는 전치사라서 물을 얻기 위해라고 해석해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">얼마 지나지 않아,\u003c/span>\u003cspan class=\"en\">Soon after,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그곳은 ~가 되었다\u003c/span>\u003cspan class=\"en\">it \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">became \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인기 있는 장소가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">popular \u003c/span>\u003cspan class=\"tgt\">place\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">연예인들과 판매원들에게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">entertainers \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">salesmen\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">원하고 있었던\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">hoping \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">추가적인 사업 기회를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">business\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">얼마 지나지 않아, 그곳은 추가적인 사업 기회를 원하고 있었던 연예인들과 판매원들에게 인기 있는 장소가 되었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 샘이 단순한 물터를 넘어 사람들이 몰리는 \u003cb class=\"key\">인기 \u003c/b>\u003cb class=\"key\">장소\u003c/b>로 바뀌었음을 보여 주는 문장이에요. 연예인과 판매원은 더 많은 \u003cb class=\"key\">사업 \u003c/b>\u003cb class=\"key\">기회\u003c/b>를 바라고 모여든 사람들이죠. 이렇게 사람이 모이면서 지역의 명성이 커지는 다음 문장으로 자연스럽게 연결됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">2형식 동사 become + 주격보어(명사)\u003c/span> : become + [명사(주격보어)] : \"인기 있는 장소가 되었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 for(~에게 인기 있는)\u003c/span> : a place for + [사람들] : \"연예인들과 판매원들에게 (인기 있는 장소)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 + 과거진행형\u003c/span> : [선행사] + who + [동사] : \"더 많은 사업을 원하고 있었던\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Soon after, 얼마 지나지 않아. it became, 그곳은 ~가 되었다. a popular place, 인기 있는 장소가. for entertainers and salesmen, 연예인들과 판매원들에게. who were hoping, 원하고 있었던. for more business, 추가적인 사업 기회를. 이 문장 전체를 해석하면, 얼마 지나지 않아, 그곳은 추가적인 사업 기회를 원하고 있었던 연예인들과 판매원들에게 인기 있는 장소가 되었다.","hl":"m"},{"n":25,"text":"이 문장은 그 샘이 물을 얻는 곳을 넘어 사람들이 몰리는 인기 장소로 바뀌었음을 보여 줘요. 연예인과 판매원은 더 많은 사업 기회를 노리고 그곳에 모여든 사람들이죠. 이렇게 사람이 모이면서 지역의 명성이 커지는 다음 문장으로 이어집니다.","hl":"mn"},{"n":26,"text":"먼저 became a popular place에서 become은 뒤에 명사가 와서 주어의 상태 변화를 설명하는 동사예요. a popular place가 주어 it의 보어 역할을 하죠. 두 번째로 for entertainers and salesmen은 어떤 사람들에게 인기 있는 장소인지를 붙여 주는 표현이에요. 세 번째로 who는 앞의 entertainers and salesmen을 받는 주격 관계대명사이고, were hoping은 과거진행형이라 그때 계속 바라고 있던 상황을 생생하게 보여 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 지역의 명성은\u003c/span>\u003cspan class=\"en\">The area's fame\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">빠르게 높아졌지만,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">grew \u003c/span>\u003cspan class=\"tgt\">quickly\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 그곳은 ~가 되지 않았다\u003c/span>\u003cspan class=\"en\">but it \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">didn't \u003c/span>\u003cspan class=\"tgt\">become\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제대로 된 놀이공원이\u003c/span>\u003cspan class=\"en\">a proper amusement park\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">훨씬 후에야\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">until \u003c/span>\u003cspan class=\"tgt\">much \u003c/span>\u003cspan class=\"tgt\">later\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 지역의 명성은 빠르게 높아졌지만, 그곳은 훨씬 후에야 제대로 된 놀이공원이 되었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 명성은 빨리 커졌지만 진짜 놀이공원이 된 것은 \u003cb class=\"key\">훨씬 \u003c/b>\u003cb class=\"key\">뒤\u003c/b>였다는 점을 강조해요. 앞 문장의 '사람들이 모여들었다'와 대비되어 명성과 시설 사이의 \u003cb class=\"key\">시간의 \u003c/b>\u003cb class=\"key\">간극\u003c/b>을 드러내죠. 그래서 1885년에 시설과 전기가 들어와 제대로 된 놀이공원이 되었다는 다음 내용의 \u003cb class=\"key\">배경\u003c/b>이 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">자동사 grow + 부사(정도)\u003c/span> : grow + [부사(정도)] : \"빠르게 커졌다, 높아졌다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">일반동사의 부정문(did not)\u003c/span> : did not + [동사원형] : \"~가 되지 않았다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">not ~ until 구문\u003c/span> : not + [동사] + until + [시점] : \"훨씬 후에야 비로소\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"The area's fame, 그 지역의 명성은. grew quickly, 빠르게 높아졌지만. but it didn't become, 그러나 그곳은 ~가 되지 않았다. a proper amusement park, 제대로 된 놀이공원이. until much later, 훨씬 후에야. 이 문장 전체를 해석하면, 그 지역의 명성은 빠르게 높아졌지만, 그곳은 훨씬 후에야 제대로 된 놀이공원이 되었다.","hl":"m"},{"n":28,"text":"이 문장은 명성은 빨리 커졌지만 진짜 놀이공원이 된 것은 한참 뒤였다는 점을 강조해요. 앞에서 사람들이 모여들었다는 내용과 대비되면서 시간의 간극을 보여 주죠. 그래서 시설과 전기가 들어와 제대로 된 놀이공원이 되었다는 다음 내용으로 넘어가는 다리 역할을 합니다.","hl":"mn"},{"n":29,"text":"먼저 grew quickly에서 grow는 자라다, 커지다는 뜻의 자동사로 쓰여 뒤의 부사 quickly가 정도를 꾸며 줘요. 두 번째로 didn't become은 일반동사 become의 과거 부정형이라서 did not 뒤에 동사원형 become이 온 형태예요. 세 번째로 until much later는 앞의 not과 짝을 이루는 표현이에요. not과 until이 만나면 훨씬 후에야 비로소 그렇게 되었다는 뜻이 되고, 우리말로는 긍정의 의미로 해석해요. 그래서 이 문장은 서술형에서 not until 구문을 활용한 문장 전환으로 출제될 수 있으니 꼭 익혀 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1885년에\u003c/span>\u003cspan class=\"en\">In 1885,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">건물들과 천막들이\u003c/span>\u003cspan class=\"en\">buildings and tents\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지어졌고,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">built\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그 공원은\u003c/span>\u003cspan class=\"en\">and the park\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">작동되었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">powered \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전기로.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">electricity\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">1885년에 건물들과 천막들이 지어졌고, 공원은 전기로 작동되었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 1885년에 바켄에 \u003cb class=\"key\">건물\u003c/b>과 \u003cb class=\"key\">천막\u003c/b>이 세워지고 \u003cb class=\"key\">전기\u003c/b>가 들어왔다는 뜻이에요. 'were built'와 'was powered'는 둘 다 \u003cb class=\"key\">수동태\u003c/b>로, 누가 했는지보다 '무엇이 어떻게 되었는지'에 초점을 둡니다. 그래서 이 문장은 바켄이 시설과 전력을 갖추기 시작한 변화의 출발점을 알려 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태(과거)\u003c/span> : [주어 buildings and tents] + [be동사 were] + [과거분사 built] : \"지어졌다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태 + by 행위자\u003c/span> : [주어 the park] + [be동사 was] + [과거분사 powered] + [by + 명사(electricity)] : \"전기로 작동되었다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"In 1885, 1885년에. buildings and tents, 건물들과 천막들이. were built, 지어졌고. and the park, 그리고 그 공원은. was powered, 작동되었다. by electricity, 전기로.. 이 문장 전체를 해석하면, 1885년에 건물들과 천막들이 지어졌고, 공원은 전기로 작동되었다.","hl":"m"},{"n":31,"text":"이 문장은 바켄에 건물과 천막이 세워지고 전기가 들어온 때를 알려 줘요. were built와 was powered는 둘 다 수동태라서 누가 했는지보다 무엇이 어떻게 되었는지에 초점이 있답니다. 시설과 전력이 갖춰지면서 바켄이 놀이공원의 모습을 갖추기 시작한 거예요.","hl":"mn"},{"n":32,"text":"먼저 were built를 보세요. 주어인 buildings and tents는 짓는 사람이 아니라 지어지는 대상이라서 수동태를 써야 하고, be동사가 were이니까 과거 시점의 일이라는 걸 알 수 있어요. 두 번째로 was powered by electricity를 보면, 공원이 전기를 공급받는 쪽이라 수동태이고, 전기를 실제로 작동시킨 힘은 by electricity로 붙여 준 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은\u003c/span>\u003cspan class=\"en\">This\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">서커스들과 움직이는 놀이기구들을 끌어들였고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">attracted \u003c/span>\u003cspan class=\"tgt\">circuses \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">moving \u003c/span>\u003cspan class=\"tgt\">rides \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그곳으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">place \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그곳을 만들었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">made \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제대로 된 놀이공원으로.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">proper \u003c/span>\u003cspan class=\"tgt\">amusement \u003c/span>\u003cspan class=\"tgt\">park\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것은 서커스들과 움직이는 놀이기구들을 그곳으로 끌어들였고, 그곳을 제대로 된 놀이공원으로 만들었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 변화, 즉 전기와 시설 덕분에 서커스와 \u003cb class=\"key\">놀이기구\u003c/b>가 그곳으로 \u003cb class=\"key\">유입\u003c/b>되었다는 뜻이에요. 'This'는 바로 앞 문장 전체를 가리키는 \u003cb class=\"key\">지시대명사\u003c/b>입니다. 그래서 이 문장은 바켄이 \u003cb class=\"key\">제대로 \u003c/b>\u003cb class=\"key\">된 \u003c/b>\u003cb class=\"key\">놀이공원\u003c/b>으로 완성되는 결정적 계기를 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">3형식 타동사 attract\u003c/span> : [주어 This] + [동사 attracted] + [목적어 circuses and moving rides] : \"서커스들과 움직이는 놀이기구들을 끌어들였다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동사구 병렬\u003c/span> : [주어 This] + [동사 attracted ~] + [and] + [동사 made ~] : \"끌어들였고 … 만들었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">현재분사 형용사\u003c/span> : [현재분사 moving] + [명사 rides] : \"움직이는 놀이기구들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">5형식 목적격보어\u003c/span> : [동사 make] + [목적어 it] + [목적격보어 a proper amusement park] : \"그곳을 제대로 된 놀이공원으로 만들었다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"This, 이것은. attracted circuses and moving rides, 서커스들과 움직이는 놀이기구들을 끌어들였고. to the place, 그곳으로. and made it, 그리고 그곳을 만들었다. a proper amusement park, 제대로 된 놀이공원으로.. 이 문장 전체를 해석하면, 이것은 서커스들과 움직이는 놀이기구들을 그곳으로 끌어들였고, 그곳을 제대로 된 놀이공원으로 만들었다.","hl":"m"},{"n":34,"text":"여기서 This는 바로 앞 문장 전체, 그러니까 전기가 들어오고 시설이 생긴 일을 가리켜요. 그 덕분에 서커스와 놀이기구가 그곳으로 모여들었고, 바켄이 제대로 된 놀이공원이 된 결정적인 계기가 된 거예요.","hl":"mn"},{"n":35,"text":"첫 번째로 attracted를 보세요. attract는 끌어들이다라는 뜻의 타동사라서 뒤에 끌어들인 대상이 목적어로 와요. 두 번째로 moving rides인데, 놀이기구가 스스로 움직이는 게 아니라 움직임이 있는 놀이기구라는 뜻이라서 현재분사 moving이 명사를 꾸며 주는 거예요. 세 번째로 made it a proper amusement park는 make가 목적어를 어떤 상태로 만들다라는 오형식 동사라서 목적격보어가 뒤에 붙은 형태예요. 네 번째로 attracted와 made가 and로 나란히 연결된 동사구 병렬이라는 점도 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">요즘,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">These \u003c/span>\u003cspan class=\"tgt\">days\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바켄은 여전히 운영 중이고,\u003c/span>\u003cspan class=\"en\">Bakken is still open,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 손님들은 놀이기구를 즐길 수 있다\u003c/span>\u003cspan class=\"en\">and guests can enjoy rides\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대관람차와 같은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">such \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">Ferris \u003c/span>\u003cspan class=\"tgt\">wheel\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 82년 된 롤러코스터와 같은 놀이기구를!\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">82-year-old \u003c/span>\u003cspan class=\"tgt\">roller \u003c/span>\u003cspan class=\"tgt\">coaster\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">요즘, 바켄은 여전히 운영 중이고, 손님들은 대관람차와 82년 된 롤러코스터와 같은 놀이기구를 즐길 수 있다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 현재도 바켄이 \u003cb class=\"key\">운영 \u003c/b>\u003cb class=\"key\">중\u003c/b>이며, 손님들이 \u003cb class=\"key\">대관람차\u003c/b>와 오래된 \u003cb class=\"key\">롤러코스터\u003c/b> 같은 놀이기구를 즐긴다는 뜻이에요. 'These days'는 현재시제와 함께 쓰여 '요즘'이라는 \u003cb class=\"key\">현재\u003c/b> 상황을 나타냅니다. 1583년에 시작된 공원이 지금까지 이어진다는 점을 강조하며 글을 맺는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간 부사구\u003c/span> : [These days] + [주어 + 동사(현재시제)] : \"요즘에는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">예시 제시 such as\u003c/span> : [명사 rides] + [such as + 예시] : \"대관람차와 같은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">복합형용사(하이픈)\u003c/span> : [숫자-단위-형용사] + [명사] : \"82년 된 롤러코스터\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"These days, 요즘. Bakken is still open, 바켄은 여전히 운영 중이고. and guests can enjoy rides, 그리고 손님들은 놀이기구를 즐길 수 있다. such as the Ferris wheel, 대관람차와 같은. and an 82-year-old roller coaster!, 그리고 82년 된 롤러코스터와 같은 놀이기구를!. 이 문장 전체를 해석하면, 요즘, 바켄은 여전히 운영 중이고, 손님들은 대관람차와 82년 된 롤러코스터와 같은 놀이기구를 즐길 수 있다!","hl":"m"},{"n":37,"text":"이 문장은 1583년에 시작된 바켄이 지금도 여전히 문을 열고 있다는 걸 알려 줘요. 요즘에도 손님들이 대관람차와 아주 오래된 롤러코스터 같은 놀이기구를 즐길 수 있다고 하니, 긴 역사가 그대로 이어지고 있다는 느낌이 들죠.","hl":"mn"},{"n":38,"text":"먼저 These days는 요즘이라는 뜻의 시간 부사구로, 현재시제 is나 can과 함께 쓰여 지금의 상태를 말해 줘요. 두 번째로 such as the Ferris wheel에서 such as는 앞에 나온 rides의 예시를 하나 들어 보이는 표현이에요. 세 번째로 an eighty-two-year-old roller coaster를 보면, 숫자와 단위와 명사를 하이픈으로 묶어 하나의 형용사로 만들었기 때문에 year는 반드시 단수로 써야 해요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>놀이공원은 오랫동안 사람들에게 \u003cb class=\"key\">즐거움\u003c/b>을 주었고, 최초의 놀이공원인 바켄은 1583년 덴마크 코펜하겐에 세워졌다.\u003c/li>\u003cli>코펜하겐의 물이 깨끗하지 않아 사람들이 \u003cb class=\"key\">샘\u003c/b>을 찾으면서 그곳은 연예인과 판매원에게 인기 있는 \u003cb class=\"key\">장소\u003c/b>가 되었다.\u003c/li>\u003cli>1885년 건물과 천막이 지어지고 \u003cb class=\"key\">전기\u003c/b>가 공급되면서 서커스와 움직이는 놀이기구가 그곳으로 모여들었다.\u003c/li>\u003cli>그 결과 바켄은 제대로 된 \u003cb class=\"key\">놀이공원\u003c/b>이 되었고, 오늘날에도 대관람차와 롤러코스터를 즐길 수 있는 곳으로 남아 있다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Bakken, the world's first amusement park, grew from a simple spring into a proper amusement park over several centuries.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">놀이공원은 오랫동안 사람들에게 즐거움을 주어 왔는데, \u003cb class=\"key\">최초의 \u003c/b>\u003cb class=\"key\">놀이공원\u003c/b>인 바켄은 1583년 덴마크 코펜하겐의 한 \u003cb class=\"key\">샘\u003c/b>에서 시작되었다. 깨끗한 물을 찾아 사람들이 모이면서 명성이 높아졌고, 1885년 전기가 들어오고 \u003cb class=\"key\">놀이기구\u003c/b>가 모여들면서 제대로 된 놀이공원이 되었으며 오늘날에도 여전히 운영되고 있다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":39,"text":"오늘은 Bakken의 역사를 통해 최초의 놀이공원이 어떻게 만들어졌는지 살펴봤어요. 샘터에 사람이 모이고, 장사와 공연이 늘고, 전기가 들어오면서 제대로 된 놀이공원이 되었다는 흐름만 기억해도 이 글은 완전히 정리된 거예요. 시간 신호어와 인과 표현을 함께 챙겨 두면 다른 지문에서도 똑같이 활용할 수 있습니다. 오늘도 수고 많았어요, 다음에 또 만나요!","hl":null}]}]});</script></body></html>
