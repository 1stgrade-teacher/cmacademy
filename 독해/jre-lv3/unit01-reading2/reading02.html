-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01도입</div><ul><li>환경 보호에 관심은 있지만 실천 방법을 모르는 사람들을 위한 세계의 캠페인을 소개한다.</li><li>환경 보호(saving the environment)의 구체적인 행동 제안</li><li>전 세계에서 진행되는 흥미로운 운동(movements) 주목</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02플라스틱 프리 줄라이</div><ul><li>호주에서 시작된 이 운동은 일상 속 일회용품 사용을 줄이는 것을 목표로 한다.</li><li>커피 컵이나 금속 빨대(metal straws) 등 일상 용품 재사용</li><li>한 달간의 실천을 통해 건강한 습관(healthy habits) 형성</li><li>핵심 키워드: 플라스틱 프리 줄라이(Plastic Free July)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03디스코 수프 데이</div><ul><li>독일에서 시작된 이 행사는 버려지는 음식물 쓰레기를 줄이기 위해 마련되었다.</li><li>마트나 농장에서 남은 식재료(unused food) 수거</li><li>자원봉사자들이 모여 맛있는 요리를 만들어 나눔</li><li>핵심 키워드: 디스코 수프 데이(Disco Soup Day)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04캠페인의 핵심 가치</div><ul><li>단순한 절약 활동을 넘어 즐거운 축제처럼 환경 보호를 실천하는 것이 중요하다.</li><li>쓰레기 줄이기를 의무가 아닌 축제(celebrate)로 승화</li><li>즐거움과 환경 보호(saving the earth)를 동시에 달성하는 가치</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">worry about</td><td class=\"m\">~에 대해 걱정하다, ~을 염려하다</td></tr><tr><td class=\"w\">throw away</td><td class=\"m\">버리다, 폐기하다</td></tr><tr><td class=\"w\">build</td><td class=\"m\">형성하다, 구축하다</td></tr><tr><td class=\"w\">unused</td><td class=\"m\">사용되지 않은, 쓰지 않는</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">gather</td><td class=\"m\">모으다, 수집하다</td></tr><tr><td class=\"w\">not just A but also B</td><td class=\"m\">단지 A뿐만 아니라 B도</td></tr><tr><td class=\"w\">there is nothing better than</td><td class=\"m\">~보다 더 좋은 것은 없다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신은 환경에 대해 걱정하는가</span><span class=\"en\"><b><span class=\"grammar-hl\">Are you worried</span> about the environment</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 모르겠는가</span><span class=\"en\"><b>but don’t know</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떻게 그것을 보호해야 할지</span><span class=\"en\"><b><span class=\"grammar-hl\">how to save</span> it?</b></span></div></div><div class=\"lec-sent-ko\">당신은 환경이 걱정되지만 어떻게 그것을 보호해야 할지 모르겠는가?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 도입부로서, 독자에게 환경 문제에 대한 실천 방법을 제시하겠다는 문제 제기이자 관심을 유도하는 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Are you worried (수동태): be동사(are)+p.p.(worried) 구조. worry는 타동사인데 목적어가 없어서 수동구조 are worried 형태로 쓴다. 기본구조: worry A (A를 걱정시키다) / be worried about A (A에 대해 걱정하다)</div><div class=\"lec-gr-item\">how to save (to부정사): 의문사+to부정사 구조로, 명사적 역할을 하여 know의 목적어로 쓰임</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">고려해 보아라 몇몇 흥미진진한 운동들을</span><span class=\"en\"><b>Consider some <span class=\"grammar-hl\">exciting movements</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">전 세계에서 온</span><span class=\"en\"><b>from around the world.</b></span></div></div><div class=\"lec-sent-ko\">전 세계에서 온 몇 가지 흥미진진한 운동들을 고려해 보아라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 제기한 의문에 대한 해결책으로, 구체적인 사례를 소개할 것임을 알리는 전환의 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">exciting movements (현재분사): exciting이 movements를 수식(= 흥미로운/신나는 움직임). 능동적 성질의 명사 수식</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">‘플라스틱 없는 7월’은</span><span class=\"en\"><b>Plastic Free July</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">처음 시작되었다</span><span class=\"en\"><b><span class=\"grammar-hl\">was first started</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">호주에서</span><span class=\"en\"><b>in Australia.</b></span></div></div><div class=\"lec-sent-ko\">‘플라스틱 없는 7월’은 호주에서 처음 시작되었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 첫 번째 사례인 &#39;Plastic Free July&#39;를 소개하며, 이 운동이 어디서 시작되었는지 배경 정보를 전달합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was first started (수동태): be동사(was)+p.p.(started) 구조. start는 타동사인데 목적어가 없어서 수동구조 was started 형태로 쓴다. 기본구조: start O (O를 시작하다)</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 행사 동안</span><span class=\"en\"><b>During this event,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들은 사용하고 버린다 더 적은 플라스틱을</span><span class=\"en\"><b>people use and throw away less plastic</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">일상 용품을 재사용함으로써</span><span class=\"en\"><b>by <span class=\"grammar-hl\">reusing</span> daily items</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">커피 컵과 금속 빨대와 같은</span><span class=\"en\"><b>like coffee cups and metal straws.</b></span></div></div><div class=\"lec-sent-ko\">이 행사 동안, 사람들은 커피 컵과 금속 빨대와 같은 일상 용품을 재사용함으로써 플라스틱을 덜 사용하고 덜 버린다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 운동이 구체적으로 어떤 방식을 통해 이루어지는지 방법을 설명하는 세부 내용입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">reusing (동명사): 전치사 by 뒤에서 명사적 역할을 하는 동명사 형태</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">throw away</td><td class=\"m\">버리다, 폐기하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이렇게 함으로써</span><span class=\"en\"><b><span class=\"grammar-hl\">By doing this</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한 달 동안</span><span class=\"en\"><b>for one month,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 건강한 습관을 형성할 수 있다</span><span class=\"en\"><b>they can <span class=\"grammar-hl\">build healthy habits</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그들의 거리, 바다, 그리고 지역 사회를 깨끗하게 유지할 수 있다</span><span class=\"en\"><b>and <span class=\"grammar-hl\">keep their streets, oceans, and communities clean</span>.</b></span></div></div><div class=\"lec-sent-ko\">한 달 동안 이렇게 함으로써, 그들은 건강한 습관들을 형성하고 그들의 거리, 바다, 그리고 지역 사회를 깨끗하게 유지할 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 행동(재사용)이 가져오는 긍정적인 결과와 교육적 효과를 설명하며 이 운동의 가치를 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">By doing this (동명사): 전치사 By 뒤에서 명사적 역할을 하는 동명사 형태</div><div class=\"lec-gr-item\">build healthy habits (to부정사): 조동사 can 뒤에 연결된 동사원형 build</div><div class=\"lec-gr-item\">keep their streets, oceans, and communities clean 5형식(SVOC) 구조: keep(동사) + their streets... (목적어) + clean(형용사 목적보어). 목적어의 상태를 유지한다는 의미</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">build</td><td class=\"m\">형성하다, 구축하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">‘디스코 수프의 날’은</span><span class=\"en\"><b>Disco Soup Day</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">독일에서 온 행사이다</span><span class=\"en\"><b>is an event from Germany</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">음식물 쓰레기를 줄이기 위한</span><span class=\"en\"><b>for <span class=\"grammar-hl\">reducing</span> food waste.</b></span></div></div><div class=\"lec-sent-ko\">‘디스코 수프의 날’은 음식물 쓰레기를 줄이기 위한 독일의 행사이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 두 번째 사례인 &#39;Disco Soup Day&#39;를 새롭게 도입하여 소재를 전환합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">reducing (동명사): 전치사 for 뒤에서 명사적 역할을 하는 동명사 형태</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">슈퍼마켓, 식당, 그리고 농장은</span><span class=\"en\"><b>Supermarkets, restaurants, and farms</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">종종 가지고 있다 많은 사용되지 않은 식재료를</span><span class=\"en\"><b>often have a lot of <span class=\"grammar-hl\">unused food</span>.</b></span></div></div><div class=\"lec-sent-ko\">슈퍼마켓, 식당, 그리고 농장에는 종종 사용되지 않은 식재료가 많이 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 행사가 왜 필요한지 그 배경이 되는 환경적 문제를 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">unused food (과거분사): unused가 food를 수식(= 사용되지 않은 음식). N+p.p. 수동적 의미의 명사 수식</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">unused</td><td class=\"m\">사용되지 않은, 쓰지 않는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그래서 그날</span><span class=\"en\"><b>So on that day,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자원봉사자들은 식재료를 모으고</span><span class=\"en\"><b>volunteers gather the food</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것을 사용한다</span><span class=\"en\"><b>and use it</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">맛있는 음식을 만들기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to cook</span> delicious meals.</b></span></div></div><div class=\"lec-sent-ko\">그래서 그날, 자원봉사자들은 그 식재료를 모아서 맛있는 음식을 만들기 위해 그것을 사용한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 문제 상황을 해결하기 위해 자원봉사자들이 구체적으로 어떤 실천을 하는지 과정을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to cook (to부정사): 목적을 나타내는 부사적 용법으로 쓰임</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">gather</td><td class=\"m\">모으다, 수집하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이러한 캠페인들은 사람들에게 그저 말하는 것이 아니다</span><span class=\"en\"><b>These campaigns don’t just tell people</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">쓰레기를 줄이라고</span><span class=\"en\"><b><span class=\"grammar-hl\">to reduce</span> waste—</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 사람들이 그것을 기념하도록 한다</span><span class=\"en\"><b>they <span class=\"grammar-hl\">have people celebrate</span> it!</b></span></div></div><div class=\"lec-sent-ko\">이러한 캠페인들은 사람들에게 그저 쓰레기를 줄이라고 말하는 것이 아니라, 사람들이 그것을 기념하도록 한다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 소개한 두 사례를 관통하는 핵심 정신을 언급하며, 이 운동들이 단순한 의무를 넘어 즐거움이 동반된 활동임을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to reduce (to부정사): tell + O + toV(5형식) 구조에서 목적보어로 쓰임</div><div class=\"lec-gr-item\">have people celebrate 5형식(SVOC) 구조: have(사역동사) + people(목적어) + celebrate(동사원형 목적보어). 목적어가 ~하게 시키다/만들다</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">더 좋은 것은 없다</span><span class=\"en\"><b>There’s <span class=\"grammar-hl\">nothing better</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">즐거움을 누리는 것보다</span><span class=\"en\"><b><span class=\"grammar-hl\">than</span> <span class=\"grammar-hl\">having fun</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지구를 보호하는 동안</span><span class=\"en\"><b><span class=\"grammar-hl\">while saving</span> the earth.</b></span></div></div><div class=\"lec-sent-ko\">지구를 보호하면서 즐기는 것만큼 좋은 것은 없다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 환경 보호 활동이 즐거울 수 있다는 것을 강조하며 글 전체의 교훈적인 결론을 맺습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">nothing better than (관용표현): &#39;nothing + 비교급 + than&#39; 구조로 &#39;가장 ~한 것은 없다&#39;는 최상급 의미의 강조</div><div class=\"lec-gr-item\">having fun (동명사): 비교 대상인 전치사 than 뒤에서 명사적 역할을 하는 동명사 형태</div><div class=\"lec-gr-item\">while saving (현재분사): 분사구문(접속사+주어+동사 축약). while + they + are saving으로 원래 절을 이해함</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>환경을 보호하고 싶지만 방법을 모르는 사람들에게 구체적인 실천 사례를 제시한다.</li><li>Plastic Free July는 일상용품 재사용을 통해 플라스틱 쓰레기를 줄이는 습관을 만든다.</li><li>Disco Soup Day는 버려지는 음식을 활용해 맛있는 식사를 하며 음식물 쓰레기 문제를 해결한다.</li><li>이 캠페인들은 의무적인 절약이 아닌 즐거운 축제의 방식으로 환경 보호를 독려한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Global movements promote waste reduction through daily reuse and food repurposing, and they encourage environmental protection by turning these activities into enjoyable community events.</div>\n              <div class=\"lec-final-sum-ko\">전 세계적인 운동들은 일상적인 재사용과 음식 재활용을 통해 폐기물 감소를 촉진하며, 이러한 활동을 즐거운 공동체 행사로 만들어 환경 보호를 장려한다.</div></div></div>"],"segs":[[{"audio":"./reading02_audio/1.mp3","hl":null}],[{"audio":"./reading02_audio/2.mp3","hl":null}],[{"audio":"./reading02_audio/3.mp3","hl":null},{"audio":"./reading02_audio/4.mp3","hl":"stage-0"},{"audio":"./reading02_audio/5.mp3","hl":"stage-1"},{"audio":"./reading02_audio/6.mp3","hl":"stage-2"},{"audio":"./reading02_audio/7.mp3","hl":"stage-3"}],[{"audio":"./reading02_audio/8.mp3","hl":null}],[{"audio":"./reading02_audio/9.mp3","hl":"main"},{"audio":"./reading02_audio/10.mp3","hl":"meaning"},{"audio":"./reading02_audio/11.mp3","hl":"grammar"}],[{"audio":"./reading02_audio/12.mp3","hl":"main"},{"audio":"./reading02_audio/13.mp3","hl":"meaning"},{"audio":"./reading02_audio/14.mp3","hl":"grammar"}],[{"audio":"./reading02_audio/15.mp3","hl":"main"},{"audio":"./reading02_audio/16.mp3","hl":"meaning"},{"audio":"./reading02_audio/17.mp3","hl":"grammar"}],[{"audio":"./reading02_audio/18.mp3","hl":"main"},{"audio":"./reading02_audio/19.mp3","hl":"meaning"},{"audio":"./reading02_audio/20.mp3","hl":"grammar"}],[{"audio":"./reading02_audio/21.mp3","hl":"main"},{"audio":"./reading02_audio/22.mp3","hl":"meaning"},{"audio":"./reading02_audio/23.mp3","hl":"grammar"}],[{"audio":"./reading02_audio/24.mp3","hl":"main"},{"audio":"./reading02_audio/25.mp3","hl":"meaning"},{"audio":"./reading02_audio/26.mp3","hl":"grammar"}],[{"audio":"./reading02_audio/27.mp3","hl":"main"},{"audio":"./reading02_audio/28.mp3","hl":"meaning"},{"audio":"./reading02_audio/29.mp3","hl":"grammar"}],[{"audio":"./reading02_audio/30.mp3","hl":"main"},{"audio":"./reading02_audio/31.mp3","hl":"meaning"},{"audi
