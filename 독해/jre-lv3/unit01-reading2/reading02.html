<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>쥬니어리딩엑스퍼트3 Unit1_Reading02 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"쥬니어리딩엑스퍼트3 Unit1_Reading02","audioDir":"reading02_audio","preview":false,"count":42,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.400em\">Unit1_Reading02\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">쥬니어리딩엑스퍼트3\u003c/div>\u003ch1>Fun Movements to Save the Earth\u003c/h1>\u003ch2>지구를 구하는 즐거운 운동들\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>환경이 걱정되지만 보호 방법을 모르는 독자에게 세계의 흥미진진한 운동들을 소개한다. \u003cb class=\"key\">플라스틱 \u003c/b>\u003cb class=\"key\">없는 \u003c/b>\u003cb class=\"key\">7월\u003c/b>과 \u003cb class=\"key\">디스코 \u003c/b>\u003cb class=\"key\">수프의 \u003c/b>\u003cb class=\"key\">날\u003c/b>은 쓰레기를 줄이는 일을 사람들이 즐겁게 \u003cb class=\"key\">기념\u003c/b>하도록 만든 캠페인이다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Environmental campaigns don't just tell people to reduce waste—they have people celebrate it while saving the earth.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 세계 여러 나라의 재미있는 환경 운동에 관한 글이에요. 환경이 걱정되지만 어떻게 보호해야 할지 모르겠다고 물으며 시작하는 글이죠. 이 글의 요지는 이런 캠페인들이 사람들에게 쓰레기를 줄이라고만 말하지 않고, 즐기면서 기념하게 만든다는 거예요. 그럼 지문을 한 문장씩 살펴볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">환경 문제(environmental issues)는 이제 한 나라만의 과제가 아니라 전 지구적인 숙제다. 특히 플라스틱은 분해되는 데 수백 년이 걸려 바다와 토양을 오염시키고, 음식물 쓰레기(food waste)는 매립지에서 온실가스를 만들어 낸다. 그래서 최근에는 무서운 경고나 규제보다 \u003cb class=\"key\">재사용\u003c/b>(reuse)이나 나눔 같은 즐거운 참여형 \u003cb class=\"key\">캠페인\u003c/b>(campaign)이 주목받는다. 이는 힘든 다이어트를 억지로 하는 것보다 친구와 즐겁게 운동하는 편이 오래 지속되는 것과 같은 이치다. Plastic Free July와 Disco Soup Day도 이런 방식으로 개인의 작은 실천을 모아 지역 사회(community)를 바꾼 사례다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 조금 이야기해 볼게요. 환경 문제, 영어로 environmental issues는 이제 한 나라만의 과제가 아니죠. 플라스틱은 분해되는 데 수백 년이 걸려서 바다와 토양을 오염시키고, 음식물 쓰레기, 즉 food waste는 매립지에서 온실가스를 만들어요. 그래서 요즘은 무서운 경고나 규제보다 재사용, 영어로 reuse 같은 즐거운 참여형 캠페인이 주목받고 있어요. 힘든 다이어트를 억지로 하는 것보다 친구와 즐겁게 운동하는 편이 오래가는 것과 같은 이치죠. Plastic Free July와 Disco Soup Day도 바로 이런 방식으로 작은 실천을 모아 지역 사회를 바꾼 사례랍니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>문제 제기\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>글은 환경이 걱정되지만 어떻게 보호해야 할지 모르겠느냐는 \u003cb class=\"key\">질문\u003c/b>으로 시작한다. 이어서 전 세계에서 온 흥미진진한 \u003cb class=\"key\">운동\u003c/b>들을 고려해 보라고 제안하며, 독자가 느끼는 막막함을 해결책과 연결한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>사례 하나\u003csmall>예시 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>호주에서 처음 시작된 \u003cb class=\"key\">플라스틱 \u003c/b>\u003cb class=\"key\">없는 \u003c/b>\u003cb class=\"key\">7월\u003c/b>은 커피 컵과 금속 빨대 같은 일상 용품을 \u003cb class=\"key\">재사용\u003c/b>해 플라스틱을 덜 사용하고 덜 버리는 행사이다. 한 달 동안 이렇게 실천하면 \u003cb class=\"key\">건강한 \u003c/b>\u003cb class=\"key\">습관\u003c/b>이 형성되고 거리와 바다, 지역 사회가 깨끗하게 유지된다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>사례 둘\u003csmall>예시 · 문장 6–8\u003c/small>\u003c/h4>\u003cp>독일의 \u003cb class=\"key\">디스코 \u003c/b>\u003cb class=\"key\">수프의 \u003c/b>\u003cb class=\"key\">날\u003c/b>은 음식물 쓰레기를 줄이기 위한 행사이다. 슈퍼마켓과 식당, 농장에는 사용되지 않은 식재료가 많이 남아 있고, 그래서 그날 자원봉사자들이 그 식재료를 모아 맛있는 음식을 만든다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>결론 도출\u003csmall>주장 · 문장 9–10\u003c/small>\u003c/h4>\u003cp>이 캠페인들은 사람들에게 그저 쓰레기를 줄이라고 말하는 것이 아니라, 사람들이 그것을 \u003cb class=\"key\">기념\u003c/b>하도록 한다. 지구를 보호하면서 \u003cb class=\"key\">즐기는 \u003c/b>\u003cb class=\"key\">것\u003c/b>만큼 좋은 것은 없다는 강조로 글을 맺는다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 질문에서 시작해서 두 가지 사례를 지나 마지막에 주장으로 마무리되는 흐름이에요.","hl":null},{"n":4,"text":"첫 번째 단계는 문제를 던지는 부분이에요. 환경이 걱정되지만 어떻게 보호해야 할지 모르겠느냐고 독자에게 질문을 던지죠. 그리고 전 세계에서 온 흥미진진한 운동들을 고려해 보라고 제안해요. 막막함을 해결책으로 자연스럽게 연결하는 단계예요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 첫 번째 사례인 Plastic Free July예요. 호주에서 처음 시작된 이 행사는 커피 컵이나 금속 빨대 같은 일상 용품을 재사용해서 플라스틱을 덜 쓰고 덜 버리게 해요. 한 달 동안 이렇게 하면 건강한 습관이 형성되고 거리와 바다, 지역 사회가 깨끗하게 유지된다는 거죠.","hl":"f1"},{"n":6,"text":"세 번째 단계는 두 번째 사례인 Disco Soup Day예요. 독일에서 음식물 쓰레기를 줄이기 위해 시작된 행사인데, 슈퍼마켓과 식당, 농장에는 사용되지 않은 식재료가 많이 남아 있어요. 그래서 그날 자원봉사자들이 그 식재료를 모아 맛있는 음식을 만들어요.","hl":"f2"},{"n":7,"text":"네 번째 단계는 결론이에요. 이런 캠페인들은 사람들에게 그저 쓰레기를 줄이라고 말하는 것이 아니라, 사람들이 그것을 기념하게 만든다는 거죠. 지구를 보호하면서 즐기는 것만큼 좋은 것은 없다고 강조하며 글을 맺어요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">질문-답변\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 9번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 첫 문장에서 독자에게 \u003cb class=\"key\">질문\u003c/b>을 던지고 마지막 부분에서 답을 제시하는 \u003cb class=\"key\">질문-답변\u003c/b> 구조이다. 중간에는 서로 다른 두 나라의 실제 사례를 \u003cb class=\"key\">예시\u003c/b>로 배치해 주장을 뒷받침한다. 핵심이 되는 주장이 맨 끝 문장에 나오므로 \u003cb class=\"key\">미괄식\u003c/b> 전개로 판단할 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Are you worried about (1)\u003c/b>\u003cspan>문제 제기\u003c/span>\u003cb>Consider (2)\u003c/b>\u003cspan>해결책 제안\u003c/span>\u003cb>like (4)\u003c/b>\u003cspan>예시 제시\u003c/span>\u003cb>So (8)\u003c/b>\u003cspan>결과·인과\u003c/span>\u003cb>don't just (9)\u003c/b>\u003cspan>대조·강조\u003c/span>\u003cb>nothing better than (10)\u003c/b>\u003cspan>최상급 강조·결론\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">save it\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">use and throw away less plastic\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">reducing food waste\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">reduce waste\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">saving the earth\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"전개 방식을 보면 질문과 답변의 구조예요. 앞에서 던진 질문에 곧바로 답하지 않고, 두 가지 사례를 차곡차곡 쌓은 뒤 마지막에 답을 주죠. 그래서 핵심 주장이 글 끝에 나오는 미괄식이라고 정리할 수 있어요.","hl":"ty"},{"n":9,"text":"신호어도 눈여겨보세요. 첫 번째 문장의 Are you worried about은 문제를 던지는 신호이고, 두 번째 문장의 Consider는 해결책을 제안하는 신호예요. 네 번째 문장의 like는 예시를 끌어오는 표현이고, 여덟 번째 문장의 So는 앞의 상황에 대한 결과를 이어 줘요. 마지막 부분의 don't just과 그 뒤에 이어지는 they는 대조와 강조를 만들면서 핵심 주장으로 넘어가는 신호랍니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>worried\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>걱정하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>environment\u003c/b>\u003cem>명사\u003c/em>\u003cspan>환경\u003c/span>\u003c/div>\u003cdiv>\u003cb>consider\u003c/b>\u003cem>동사\u003c/em>\u003cspan>고려하다, 생각해 보다\u003c/span>\u003c/div>\u003cdiv>\u003cb>exciting\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>흥미진진한\u003c/span>\u003c/div>\u003cdiv>\u003cb>movement\u003c/b>\u003cem>명사\u003c/em>\u003cspan>운동, 움직임\u003c/span>\u003c/div>\u003cdiv>\u003cb>around the world\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>전 세계에서\u003c/span>\u003c/div>\u003cdiv>\u003cb>plastic\u003c/b>\u003cem>명사\u003c/em>\u003cspan>플라스틱\u003c/span>\u003c/div>\u003cdiv>\u003cb>event\u003c/b>\u003cem>명사\u003c/em>\u003cspan>행사\u003c/span>\u003c/div>\u003cdiv>\u003cb>throw away\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>버리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>reuse\u003c/b>\u003cem>동사\u003c/em>\u003cspan>재사용하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>daily\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>일상적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>item\u003c/b>\u003cem>명사\u003c/em>\u003cspan>물품, 품목\u003c/span>\u003c/div>\u003cdiv>\u003cb>metal\u003c/b>\u003cem>명사\u003c/em>\u003cspan>금속\u003c/span>\u003c/div>\u003cdiv>\u003cb>straw\u003c/b>\u003cem>명사\u003c/em>\u003cspan>빨대\u003c/span>\u003c/div>\u003cdiv>\u003cb>build\u003c/b>\u003cem>동사\u003c/em>\u003cspan>쌓다, 형성하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>habit\u003c/b>\u003cem>명사\u003c/em>\u003cspan>습관\u003c/span>\u003c/div>\u003cdiv>\u003cb>keep\u003c/b>\u003cem>동사\u003c/em>\u003cspan>유지하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>ocean\u003c/b>\u003cem>명사\u003c/em>\u003cspan>바다\u003c/span>\u003c/div>\u003cdiv>\u003cb>community\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지역 사회\u003c/span>\u003c/div>\u003cdiv>\u003cb>reduce\u003c/b>\u003cem>동사\u003c/em>\u003cspan>줄이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>waste\u003c/b>\u003cem>명사\u003c/em>\u003cspan>쓰레기, 낭비\u003c/span>\u003c/div>\u003cdiv>\u003cb>supermarket\u003c/b>\u003cem>명사\u003c/em>\u003cspan>슈퍼마켓\u003c/span>\u003c/div>\u003cdiv>\u003cb>unused\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>사용되지 않은\u003c/span>\u003c/div>\u003cdiv>\u003cb>volunteer\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자원봉사자\u003c/span>\u003c/div>\u003cdiv>\u003cb>gather\u003c/b>\u003cem>동사\u003c/em>\u003cspan>모으다\u003c/span>\u003c/div>\u003cdiv>\u003cb>delicious\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>맛있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>meal\u003c/b>\u003cem>명사\u003c/em>\u003cspan>식사, 음식\u003c/span>\u003c/div>\u003cdiv>\u003cb>campaign\u003c/b>\u003cem>명사\u003c/em>\u003cspan>캠페인\u003c/span>\u003c/div>\u003cdiv>\u003cb>celebrate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>기념하다, 즐기다\u003c/span>\u003c/div>\u003cdiv>\u003cb>save\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보호하다, 구하다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어도 짚고 갈게요. worried는 걱정하는, consider는 고려하다라는 뜻이고, movement는 운동이라는 의미예요. reuse는 다시 사용하다, reduce는 줄이다, celebrate는 기념하다로 정리해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">worried\u003c/b>\u003cspan class=\"m\">걱정하는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">concerned\u003c/span>\u003cspan class=\"s\">anxious\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">calm\u003c/span>\u003cspan class=\"a\">relaxed\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">exciting\u003c/b>\u003cspan class=\"m\">흥미진진한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">thrilling\u003c/span>\u003cspan class=\"s\">stimulating\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">boring\u003c/span>\u003cspan class=\"a\">dull\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">reduce\u003c/b>\u003cspan class=\"m\">줄이다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">decrease\u003c/span>\u003cspan class=\"s\">lessen\u003c/span>\u003cspan class=\"s\">cut down\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">increase\u003c/span>\u003cspan class=\"a\">expand\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">reuse\u003c/b>\u003cspan class=\"m\">재사용하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">recycle\u003c/span>\u003cspan class=\"s\">repurpose\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">discard\u003c/span>\u003cspan class=\"a\">throw away\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">gather\u003c/b>\u003cspan class=\"m\">모으다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">collect\u003c/span>\u003cspan class=\"s\">assemble\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">scatter\u003c/span>\u003cspan class=\"a\">distribute\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">delicious\u003c/b>\u003cspan class=\"m\">맛있는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">tasty\u003c/span>\u003cspan class=\"s\">yummy\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">tasteless\u003c/span>\u003cspan class=\"a\">awful\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">clean\u003c/b>\u003cspan class=\"m\">깨끗한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">tidy\u003c/span>\u003cspan class=\"s\">pure\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">dirty\u003c/span>\u003cspan class=\"a\">polluted\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">save\u003c/b>\u003cspan class=\"m\">보호하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">protect\u003c/span>\u003cspan class=\"s\">preserve\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">destroy\u003c/span>\u003cspan class=\"a\">harm\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 함께 정리해 볼게요. worried의 동의어는 concerned와 anxious이고 반의어는 relaxed예요. reduce는 decrease, lessen과 가깝고 반대말은 increase죠. reuse의 동의어는 recycle, repurpose이고 반대말은 discard예요. gather는 collect, assemble과 비슷하고 반대말은 scatter랍니다. save는 protect, preserve와 같은 뜻으로 쓰였어요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 걱정되나요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Are \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">worried \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">환경에 대해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">about\u003c/span> the environment\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 모르나요\u003c/span>\u003cspan class=\"en\">but don't know\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 어떻게 보호해야 할지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">save \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">당신은 환경이 걱정되지만 어떻게 그것을 보호해야 할지 모르겠는가?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글의 \u003cb class=\"key\">도입부\u003c/b>에서 독자에게 직접 \u003cb class=\"key\">질문\u003c/b>을 던져 관심을 끄는 문장이에요. 환경이 걱정되지만 방법을 모르는 \u003cb class=\"key\">문제 \u003c/b>\u003cb class=\"key\">상황\u003c/b>을 짚어 주고, 뒤에서 그 해결책을 제시할 준비를 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사 의문문(도치)\u003c/span> : [Are] + [주어 you] + [보어 worried]? : \"당신은 걱정되나요?\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">감정 형용사 + 전치사 about\u003c/span> : [be worried about + 명사] : \"~에 대해 걱정하는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">의문사 + to부정사(명사구)\u003c/span> : know + [how to save it (의문사+to부정사 = 목적어)] : \"그것을 어떻게 보호해야 할지\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Are you worried, 당신은 걱정되나요. about the environment, 환경에 대해. but don't know, 하지만 모르나요. how to save it?, 그것을 어떻게 보호해야 할지. 이 문장 전체를 해석하면, 당신은 환경이 걱정되지만 어떻게 그것을 보호해야 할지 모르겠는가?","hl":"m"},{"n":13,"text":"이 문장은 글의 도입부에서 독자에게 질문을 던져 관심을 끄는 역할을 해요. 환경이 걱정되지만 방법을 모르는 문제 상황을 콕 짚어 주죠. 그래서 다음 문장에서 해결책을 궁금하게 만드는 거예요.","hl":"mn"},{"n":14,"text":"어법 포인트 첫 번째, Are you worried에서는 be동사가 주어 앞으로 나가는 도치가 일어나 의문문을 만듭니다. 두 번째, worried는 감정 형용사라서 원인을 나타내는 전치사 about과 짝을 이뤄 관용 표현처럼 굳어졌어요. 세 번째, how to save it은 어떻게 그것을 보호해야 할지라는 뜻의 명사구로, 동사 know의 목적어 자리에 들어갑니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고려해 보아라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Consider\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몇 가지 흥미진진한 운동들을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">some \u003c/span>\u003cspan class=\"tgt\">exciting \u003c/span>\u003cspan class=\"tgt\">movements\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전 세계에서 온\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">around \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">world\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">전 세계에서 온 몇 가지 흥미진진한 운동들을 고려해 보아라.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글 전체의 \u003cb class=\"key\">주제\u003c/b>를 여는 \u003cb class=\"key\">명령문\u003c/b>이에요. 환경을 지키는 방법으로 전 세계의 흥미로운 \u003cb class=\"key\">운동\u003c/b>들을 살펴보자고 독자를 안내하죠. 뒤에 이어지는 두 가지 사례가 바로 이 문장이 예고한 내용입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문(동사원형으로 시작)\u003c/span> : [동사원형 Consider] + [목적어 some exciting movements] : \"고려해 보아라\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재분사 형용사의 명사 수식\u003c/span> : [some] + [exciting(현재분사 형용사)] + [movements(명사)] : \"몇 가지 흥미진진한 운동들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 + 전치사구(이중 전치사)\u003c/span> : [from] + [around the world(전치사구)] : \"전 세계에서(온)\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Consider, 고려해 보아라. some exciting movements, 몇 가지 흥미진진한 운동들을. from around the world, 전 세계에서 온. 이 문장 전체를 해석하면, 전 세계에서 온 몇 가지 흥미진진한 운동들을 고려해 보아라.","hl":"m"},{"n":16,"text":"이 문장은 글 전체의 주제를 여는 명령문이에요. 환경을 지키는 방법으로 전 세계의 흥미로운 운동들을 살펴보자고 독자를 안내하죠. 바로 뒤에 두 가지 구체적인 사례가 나오니까 이 문장이 예고편 역할을 하는 셈이에요.","hl":"mn"},{"n":17,"text":"어법 포인트 첫 번째, Consider로 문장이 시작하죠. 주어 없이 동사원형으로 시작하면 명령문이 됩니다. 두 번째, exciting은 흥미를 유발하는 쪽이라 현재분사로 movements를 앞에서 수식해요. 세 번째, from around the world는 전치사 from 뒤에 전치사구가 또 온 형태로, 전 세계로부터라는 뜻을 만듭니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">'플라스틱 없는 7월'은\u003c/span>\u003cspan class=\"en\">Plastic Free July\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">처음 시작되었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">first \u003c/span>\u003cspan class=\"tgt\">started\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">호주에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">Australia\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">'플라스틱 없는 7월'은 호주에서 처음 시작되었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 첫 번째 사례를 소개하는 문장이에요. Plastic Free July가 \u003cb class=\"key\">호주\u003c/b>에서 시작된 \u003cb class=\"key\">행사\u003c/b>임을 밝히며, 뒤에 이어질 구체적인 \u003cb class=\"key\">실천 \u003c/b>\u003cb class=\"key\">방법\u003c/b>의 배경을 깔아 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태(과거) + 부사 위치\u003c/span> : [주어 Plastic Free July] + [was + p.p. started] + [부사 first] : \"처음 시작되었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소 전치사구\u003c/span> : [in] + [장소 명사 Australia] : \"호주에서\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Plastic Free July, '플라스틱 없는 7월'은. was first started, 처음 시작되었다. in Australia, 호주에서. 이 문장 전체를 해석하면, '플라스틱 없는 7월'은 호주에서 처음 시작되었다.","hl":"m"},{"n":19,"text":"이 문장은 글에서 첫 번째 사례를 소개하는 역할을 해요. Plastic Free July가 호주에서 시작된 행사임을 밝혀 주죠. 이렇게 배경을 깔아 두면 뒤에 나오는 구체적인 실천 방법이 더 자연스럽게 이해됩니다.","hl":"mn"},{"n":20,"text":"어법 포인트 첫 번째, was first started는 수동태예요. 행사가 스스로 시작한 게 아니라 사람들에 의해 시작되었으니 능동태 start 대신 수동태로 쓴 겁니다. 두 번째, first는 be동사 뒤에 놓여 처음으로라는 의미를 더해 주는 부사예요. 세 번째, in Australia는 전치사 in이 넓은 장소 앞에 쓰여 호주에서라는 뜻을 나타냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 행사 동안,\u003c/span>\u003cspan class=\"en\">During this event,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들은 플라스틱을 덜 사용하고 덜 버린다\u003c/span>\u003cspan class=\"en\">people \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">use \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">throw \u003c/span>\u003cspan class=\"tgt\">away\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">less \u003c/span>\u003cspan class=\"tgt\">plastic\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일상 용품을 재사용함으로써\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">reusing \u003c/span>\u003cspan class=\"tgt\">daily \u003c/span>\u003cspan class=\"tgt\">items\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">커피 컵과 금속 빨대와 같은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">coffee \u003c/span>\u003cspan class=\"tgt\">cups \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">metal \u003c/span>\u003cspan class=\"tgt\">straws\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 행사 동안, 사람들은 커피 컵과 금속 빨대와 같은 일상 용품을 재사용함으로써 플라스틱을 덜 사용하고 덜 버린다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 Plastic Free July 행사에서 사람들이 실제로 무엇을 하는지 알려 주는 문장이에요. 핵심은 less plastic, 즉 플라스틱을 덜 쓰고 덜 버린다는 \u003cb class=\"key\">결과\u003c/b>이고, 그 방법이 바로 by reusing, 일상 용품을 \u003cb class=\"key\">재사용\u003c/b>하는 거예요. 커피 컵과 금속 빨대 같은 구체적인 예시를 들어 바로 와닿게 해 주죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">등위접속사 and에 의한 동사 병렬\u003c/span> : [동사 use] + and + [동사 throw away] + [목적어 less plastic] : \"사용하고 버린다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">비교급 less + 불가산명사\u003c/span> : less + [불가산명사 plastic] : \"플라스틱을 덜\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 by + 동명사(수단·방법)\u003c/span> : by + [동명사 reusing] + [목적어 daily items] : \"일상 용품을 재사용함으로써\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">전치사 like(예시)\u003c/span> : [명사 daily items] + like + [예시 명사구] : \"커피 컵과 금속 빨대와 같은\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"During this event, 이 행사 동안. people use and throw away less plastic, 사람들은 플라스틱을 덜 사용하고 덜 버린다. by reusing daily items, 일상 용품을 재사용함으로써. like coffee cups and metal straws, 커피 컵과 금속 빨대와 같은. 이 문장 전체를 해석하면, 이 행사 동안, 사람들은 커피 컵과 금속 빨대와 같은 일상 용품을 재사용함으로써 플라스틱을 덜 사용하고 덜 버린다.","hl":"m"},{"n":22,"text":"이 문장은 Plastic Free July에서 사람들이 실제로 실천하는 행동을 보여 줘요. 플라스틱을 덜 쓰고 덜 버린다는 결과를 먼저 말하고, 그 방법으로 일상 용품을 재사용하는 걸 제시하죠. 커피 컵이나 금속 빨대 같은 익숙한 예시를 들어서 바로 와닿게 해 줘요.","hl":"mn"},{"n":23,"text":"첫 번째로, use and throw away는 and로 동사 두 개를 나란히 놓은 병렬 구조예요. 두 번째로, less plastic은 plastic이 불가산명사라서 less를 쓰는 거예요. 세 번째로, by reusing daily items에서 by 뒤에는 동명사가 와서 수단을 나타내요. 네 번째로, like는 '좋아하다'가 아니라 '~와 같은'이라는 전치사로, 예시를 들어 주는 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 달 동안 이렇게 함으로써,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">By \u003c/span>\u003cspan class=\"tgt\">doing \u003c/span>\u003cspan class=\"tgt\">this\u003c/span> for one month,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 건강한 습관들을 형성하고\u003c/span>\u003cspan class=\"en\">they can build healthy habits\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 거리, 바다, 그리고 지역 사회를 깨끗하게 유지할 수 있다\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">keep \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">streets, \u003c/span>\u003cspan class=\"tgt\">oceans, \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">communities \u003c/span>\u003cspan class=\"tgt\">clean\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">한 달 동안 이렇게 함으로써, 그들은 건강한 습관들을 형성하고 그들의 거리, 바다, 그리고 지역 사회를 깨끗하게 유지할 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 한 달 동안의 실천이 남기는 \u003cb class=\"key\">효과\u003c/b>를 두 가지로 정리해요. 하나는 건강한 \u003cb class=\"key\">습관\u003c/b>을 만드는 것이고, 다른 하나는 거리와 바다, 지역 사회를 깨끗하게 \u003cb class=\"key\">유지\u003c/b>하는 것이죠. 그래서 작은 실천이 나와 공동체 모두에 도움이 된다는 흐름을 만들어 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 by + 동명사(수단)\u003c/span> : by + [동명사 doing] + [목적어 this] : \"이렇게 함으로써\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">keep + 목적어 + 목적격보어(형용사)\u003c/span> : keep + [목적어 their streets, oceans, and communities] + [목적격보어 clean] : \"그들의 거리, 바다, 그리고 지역 사회를 깨끗하게 유지하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">콤마와 and에 의한 명사 병렬\u003c/span> : [명사 A], [명사 B], and [명사 C] : \"그들의 거리, 바다, 그리고 지역 사회\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"By doing this for one month, 한 달 동안 이렇게 함으로써. they can build healthy habits, 그들은 건강한 습관들을 형성하고. and keep their streets, oceans, and communities clean, 그들의 거리, 바다, 그리고 지역 사회를 깨끗하게 유지할 수 있다. 이 문장 전체를 해석하면, 한 달 동안 이렇게 함으로써, 그들은 건강한 습관들을 형성하고 그들의 거리, 바다, 그리고 지역 사회를 깨끗하게 유지할 수 있다.","hl":"m"},{"n":25,"text":"이 문장은 한 달 동안의 실천이 남기는 효과를 두 가지로 정리해요. 하나는 건강한 습관을 만드는 것이고, 다른 하나는 거리와 바다, 지역 사회를 깨끗하게 유지하는 것이죠. 작은 실천이 나와 공동체 모두에 도움이 된다는 흐름을 보여 줘요.","hl":"mn"},{"n":26,"text":"첫 번째로, By doing this에서 by 뒤에 동명사가 와서 수단을 나타내요. 두 번째로, keep their streets, oceans, and communities clean은 목적어 뒤에 형용사 clean이 목적격보어로 오는 구조예요. 세 번째로, streets, oceans, and communities는 콤마와 and로 이어지는 병렬 나열 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">'디스코 수프의 날'은 독일의 행사이다\u003c/span>\u003cspan class=\"en\">Disco Soup Day is an event from Germany\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">음식물 쓰레기를 줄이기 위한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">reducing \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">food \u003c/span>\u003cspan class=\"tgt\">waste\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">'디스코 수프의 날'은 음식물 쓰레기를 줄이기 위한 독일의 행사이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 Disco Soup Day가 어떤 행사인지 소개하는 문장이에요. 독일에서 시작된 행사라는 \u003cb class=\"key\">출처\u003c/b>와, 음식물 쓰레기를 줄이기 위한 \u003cb class=\"key\">목적\u003c/b>을 함께 밝히고 있죠. 뒤에 이어질 '남는 음식으로 요리한다'는 설명의 \u003cb class=\"key\">배경\u003c/b>이 되어 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 for + 동명사(목적)\u003c/span> : for + [동명사 reducing] + [목적어 food waste] : \"음식물 쓰레기를 줄이기 위한\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명사 + 명사 복합명사\u003c/span> : [명사 food] + [명사 waste] : \"음식물 쓰레기\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Disco Soup Day is an event from Germany, '디스코 수프의 날'은 독일의 행사이다. for reducing food waste, 음식물 쓰레기를 줄이기 위한. 이 문장 전체를 해석하면, '디스코 수프의 날'은 음식물 쓰레기를 줄이기 위한 독일의 행사이다.","hl":"m"},{"n":28,"text":"이 문장은 Disco Soup Day가 어떤 행사인지 소개해요. 독일에서 시작된 행사라는 출처와, 음식물 쓰레기를 줄이기 위한 목적을 함께 밝히고 있죠. 뒤에 이어질 남는 음식으로 요리한다는 설명의 배경이 되어 주는 문장이에요.","hl":"mn"},{"n":29,"text":"첫 번째로, for reducing food waste에서 for 뒤에 동명사가 와서 '~하기 위한'이라는 목적을 나타내요. 두 번째로, food waste는 food가 waste를 꾸미는 복합명사로, 앞의 명사가 뒤의 명사를 수식하는 구조예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">슈퍼마켓, 식당, 그리고 농장에는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Supermarkets, \u003c/span>\u003cspan class=\"tgt\">restaurants, \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">farms\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">종종 가지고 있다\u003c/span>\u003cspan class=\"en\">often have\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사용되지 않은 식재료가 많이\u003c/span>\u003cspan class=\"en\">a lot of \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">unused\u003c/span> food.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">슈퍼마켓, 식당, 그리고 농장에는 종종 사용되지 않은 식재료가 많이 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 뒤에 나올 \u003cb class=\"key\">Disco \u003c/b>\u003cb class=\"key\">Soup \u003c/b>\u003cb class=\"key\">Day\u003c/b> 이야기의 배경을 깔아 주는 문장이에요. 슈퍼마켓, 식당, 농장에는 팔리지 않아 남은 \u003cb class=\"key\">식재료\u003c/b>가 생각보다 많다는 사실을 알려 주죠. 여기서 \u003cb class=\"key\">unused\u003c/b>는 '사용되지 않은', 즉 버려질 처지의 음식을 뜻해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사 병렬구조(쉼표 + and)\u003c/span> : A, B, and C : \"슈퍼마켓, 식당, 그리고 농장\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사의 형용사적 용법\u003c/span> : [동사 + -ed(과거분사)] + 명사 : \"사용되지 않은\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Supermarkets, restaurants, and farms, 슈퍼마켓, 식당, 그리고 농장에는. often have, 종종 가지고 있다. a lot of unused food, 사용되지 않은 식재료가 많이. 이 문장 전체를 해석하면, 슈퍼마켓, 식당, 그리고 농장에는 종종 사용되지 않은 식재료가 많이 있다.","hl":"m"},{"n":31,"text":"이 문장은 뒤에 나올 Disco Soup Day 이야기의 배경을 깔아 주는 역할을 해요. 슈퍼마켓이나 식당, 농장에는 팔리지 않아서 남은 식재료가 생각보다 많다는 걸 알려 주죠. 여기서 unused는 사용되지 않은, 그러니까 버려질 처지의 음식을 뜻한답니다.","hl":"mn"},{"n":32,"text":"먼저 첫 번째 포인트는 명사 병렬구조예요. Supermarkets, restaurants, and farms처럼 쉼표와 and로 명사를 나란히 이어 주면 세 가지를 한 묶음으로 보여 줄 수 있죠. 두 번째는 과거분사 unused예요. 동사 use에 수동의 의미를 더한 과거분사가 food 앞에서 명사 수식을 하면서 사용되지 않은이라는 뜻을 만들어 줍니다. 그래서 often have a lot of unused food는 종종 사용되지 않은 식재료를 많이 가지고 있다로 읽으면 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서 그날,\u003c/span>\u003cspan class=\"en\">So on that day,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자원봉사자들은 그 식재료를 모아서\u003c/span>\u003cspan class=\"en\">volunteers \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">gather \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">food \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 사용한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">use \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">맛있는 음식을 만들기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">cook \u003c/span>\u003cspan class=\"tgt\">delicious \u003c/span>\u003cspan class=\"tgt\">meals\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그래서 그날, 자원봉사자들은 그 식재료를 모아서 맛있는 음식을 만들기 위해 그것을 사용한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 남는 식재료가 많다는 문제를 꺼냈으니, 이 문장은 그 문제를 실제 행동으로 풀어 내는 장면이에요. 자원봉사자들이 그 식재료를 \u003cb class=\"key\">모아서\u003c/b> 맛있는 음식으로 \u003cb class=\"key\">요리\u003c/b>한다는 것이 핵심이죠. 버려질 뻔한 음식이 한 끼 식사로 다시 쓰이는 \u003cb class=\"key\">재활용\u003c/b>의 흐름을 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사 병렬구조\u003c/span> : [동사구 A] + and + [동사구 B] : \"그 식재료를 모아서 그것을 사용한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : use it + [to + 동사원형 (to부정사구/부사구)] : \"맛있는 음식을 만들기 위해\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"So on that day, 그래서 그날. volunteers gather the food, 자원봉사자들은 그 식재료를 모아서. and use it, 그것을 사용한다. to cook delicious meals, 맛있는 음식을 만들기 위해. 이 문장 전체를 해석하면, 그래서 그날, 자원봉사자들은 그 식재료를 모아서 맛있는 음식을 만들기 위해 그것을 사용한다.","hl":"m"},{"n":34,"text":"앞에서 남는 식재료가 많다는 문제를 꺼냈으니, 이 문장은 그 문제를 실제 행동으로 풀어 내는 장면이에요. 자원봉사자들이 그 식재료를 모아서 맛있는 음식으로 요리한다는 게 핵심이죠. 버려질 뻔한 음식이 한 끼 식사로 다시 쓰이는 재활용의 흐름을 보여 줍니다.","hl":"mn"},{"n":35,"text":"첫 번째는 동사 병렬구조예요. gather the food와 use it이 and로 이어지면서 자원봉사자들이 하는 두 가지 행동을 같은 무게로 연결해 주죠. 주어를 한 번만 쓰고 동사를 나란히 놓으면 문장이 훨씬 자연스러워집니다. 두 번째는 to부정사의 부사적 용법이에요. use it to cook delicious meals에서 to cook은 왜 사용하는지, 즉 목적을 알려 주는 역할을 하니까 맛있는 음식을 만들기 위해서라고 해석하면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 캠페인들은\u003c/span>\u003cspan class=\"en\">These campaigns\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들에게 그저 쓰레기를 줄이라고 말하는 것이 아니라, 그들은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003cspan class=\"tgt\">just \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">tell \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">reduce \u003c/span>\u003cspan class=\"tgt\">waste\u003c/span>—they\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들이 그것을 기념하도록 한다!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">celebrate \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이러한 캠페인들은 사람들에게 그저 쓰레기를 줄이라고 말하는 것이 아니라, 사람들이 그것을 기념하도록 한다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 두 행사를 하나로 묶어 주는 \u003cb class=\"key\">결론\u003c/b> 문장이에요. 이 캠페인들은 쓰레기를 줄이라고 \u003cb class=\"key\">훈계\u003c/b>하는 데 그치지 않고, 줄이는 일을 즐기고 \u003cb class=\"key\">축하\u003c/b>하게 만든다는 점을 강조하죠. 그래서 마지막 문장의 '즐기면서 지구를 구한다'는 메시지로 자연스럽게 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">상관표현 not just A (but B)\u003c/span> : don't just + [동사] ... + [뒤에서 대조되는 내용] : \"사람들에게 그저 쓰레기를 줄이라고만 말하는 것이 아니라\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">5형식 tell + 목적어 + to부정사\u003c/span> : tell + [목적어] + [to + 동사원형 (목적격보어)] : \"사람들에게 쓰레기를 줄이라고 말하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">사역동사 have + 목적어 + 동사원형\u003c/span> : have + [목적어] + [동사원형(목적격보어)] : \"사람들이 그것을 기념하도록 하다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"These campaigns, 이러한 캠페인들은. don't just tell people to reduce waste—they, 사람들에게 그저 쓰레기를 줄이라고 말하는 것이 아니라, 그들은. have people celebrate it!, 사람들이 그것을 기념하도록 한다!. 이 문장 전체를 해석하면, 이러한 캠페인들은 사람들에게 그저 쓰레기를 줄이라고 말하는 것이 아니라, 사람들이 그것을 기념하도록 한다!","hl":"m"},{"n":37,"text":"이 문장은 두 행사를 하나로 묶어 주는 결론 문장이에요. 이 캠페인들은 쓰레기를 줄이라고 훈계하는 데 그치지 않고, 줄이는 일을 즐기고 축하하게 만든다는 점을 강조하죠. 그래서 마지막 문장의 즐기면서 지구를 구한다는 메시지로 자연스럽게 이어집니다.","hl":"mn"},{"n":38,"text":"첫 번째는 상관표현이에요. don't just tell은 그저 말하는 것에 한계를 긋는 표현이고, 뒤에 나오는 have people celebrate와 짝을 이루면서 앞과 뒤를 대조시켜 줍니다. 두 번째는 tell people to reduce waste인데요, tell은 목적어 뒤에 to부정사가 목적격보어로 오는 동사예요. 그래서 사람들에게 쓰레기를 줄이라고 말하다가 되죠. 세 번째는 사역동사 have예요. have people celebrate it처럼 목적어 뒤에 동사원형이 오면 사람들이 그것을 기념하도록 한다는 뜻이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아무것도 없다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There's \u003c/span>\u003cspan class=\"tgt\">nothing \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~보다 더 좋은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">better \u003c/span>\u003cspan class=\"tgt\">than\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">즐기는 것\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">having \u003c/span>\u003cspan class=\"tgt\">fun\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지구를 보호하면서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">while \u003c/span>\u003cspan class=\"tgt\">saving \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">earth\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">지구를 보호하면서 즐기는 것만큼 좋은 것은 없다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글 전체를 마무리하는 문장으로, 앞에서 소개한 두 캠페인이 '즐기면서 실천하는 환경 운동'이었음을 다시 한 번 정리해요. 결국 환경 보호와 재미를 함께하는 것보다 좋은 일은 없다는 필자의 생각을 \u003cb class=\"key\">강조\u003c/b>하며 글을 닫는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정어 + 비교급 (최상급 표현)\u003c/span> : There is nothing + [비교급] + than + [A] = [A]만큼 ~한 것은 없다 : \"~보다 더 좋은 것은 없다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사 (전치사 than의 목적어)\u003c/span> : 전치사 than + [동명사(구)] : \"즐기는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">while + 분사구 (시간 부사절의 축약)\u003c/span> : while + [주어+be동사 생략] + [현재분사] = ~하면서 : \"지구를 보호하면서\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"There's nothing, 아무것도 없다. better than, ~보다 더 좋은. having fun, 즐기는 것. while saving the earth, 지구를 보호하면서. 이 문장 전체를 해석하면, 지구를 보호하면서 즐기는 것만큼 좋은 것은 없다.","hl":"m"},{"n":40,"text":"이 문장은 글 전체를 마무리하는 문장이에요. 앞에서 소개한 두 캠페인이 결국 즐기면서 실천하는 환경 운동이었다는 점을 다시 한 번 강조하고 있죠. 환경을 지키는 일과 재미를 함께하는 것만큼 좋은 일은 없다는 필자의 생각이 담겨 있어요.","hl":"mn"},{"n":41,"text":"첫 번째, There's nothing better than은 부정어 nothing과 비교급 better가 만나 최상급의 의미를 만드는 표현이에요. 두 번째, than 뒤에 온 having fun은 전치사 than의 목적어로 쓰인 동명사예요. 세 번째, while saving the earth는 while 뒤에서 주어와 be동사가 생략되고 현재분사만 남아 시간의 의미를 나타내는 분사구문 축약 형태랍니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>글은 환경이 걱정되지만 보호 방법을 모르겠다는 \u003cb class=\"key\">질문\u003c/b>을 던지고, 전 세계의 흥미진진한 운동들을 고려해 보라고 제안한다.\u003c/li>\u003cli>호주의 \u003cb class=\"key\">플라스틱 \u003c/b>\u003cb class=\"key\">없는 \u003c/b>\u003cb class=\"key\">7월\u003c/b>은 일상 용품을 재사용해 플라스틱을 덜 쓰고 덜 버리며 건강한 습관과 깨끗한 지역 사회를 만든다.\u003c/li>\u003cli>독일의 \u003cb class=\"key\">디스코 \u003c/b>\u003cb class=\"key\">수프의 \u003c/b>\u003cb class=\"key\">날\u003c/b>은 슈퍼마켓과 식당, 농장에 남은 사용되지 않은 식재료를 자원봉사자들이 모아 맛있는 음식으로 만드는 행사이다.\u003c/li>\u003cli>이 캠페인들은 쓰레기를 줄이라고만 말하지 않고 사람들이 그것을 \u003cb class=\"key\">기념\u003c/b>하게 하며, 지구를 보호하면서 즐기는 것만큼 좋은 것은 없다고 말한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Environmental campaigns don't just tell people to reduce waste—they have people celebrate it while saving the earth.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">환경이 걱정되지만 보호 방법을 모르는 독자에게 세계의 흥미진진한 운동들을 소개한다. \u003cb class=\"key\">플라스틱 \u003c/b>\u003cb class=\"key\">없는 \u003c/b>\u003cb class=\"key\">7월\u003c/b>과 \u003cb class=\"key\">디스코 \u003c/b>\u003cb class=\"key\">수프의 \u003c/b>\u003cb class=\"key\">날\u003c/b>은 쓰레기를 줄이는 일을 사람들이 즐겁게 \u003cb class=\"key\">기념\u003c/b>하도록 만든 캠페인이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":42,"text":"오늘 글의 핵심을 다시 정리해 볼게요. 환경이 걱정된다면 세계의 흥미진진한 운동들을 고려해 보세요. Plastic Free July는 재사용으로 플라스틱을 줄여 건강한 습관을 만들고, Disco Soup Day는 남은 식재료로 맛있는 음식을 만들어 음식물 쓰레기를 줄여요. 결국 이런 캠페인은 쓰레기를 줄이는 일을 즐겁게 기념하는 일로 바꿔 준답니다. 오늘도 수고 많았어요, 다음 시간에 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
