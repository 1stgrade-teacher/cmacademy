<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>쥬니어리딩엑스퍼트3 Unit1_Reading01 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"쥬니어리딩엑스퍼트3 Unit1_Reading01","audioDir":"reading01_audio","preview":false,"count":55,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.400em\">Unit1_Reading01\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">쥬니어리딩엑스퍼트3\u003c/div>\u003ch1>Plogging: Picking Up Trash While You Run\u003c/h1>\u003ch2>플로깅: 달리면서 쓰레기를 줍다\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>요약: 인도 총리가 해변에서 쓰레기를 줍는 모습이 화제가 되며 알려진 \u003cb class=\"key\">플로깅\u003c/b>은 조깅을 하거나 빨리 걷는 동안 쓰레기를 줍는 행위로, 2016년 스웨덴의 \u003cb class=\"key\">에릭 \u003c/b>\u003cb class=\"key\">알스트롬\u003c/b>에서 시작되어 이제는 세계적인 \u003cb class=\"key\">운동\u003c/b>으로 퍼졌다. 누구나 쉽게 나가서 쓰레기를 주울 수 있다는 점이 이 운동이 \u003cb class=\"key\">증가\u003c/b>하는 이유이다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Plogging, the act of picking up trash while jogging or walking fast, began in Sweden and has grown into a global movement that anyone can easily join.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 인도 총리가 해변에서 쓰레기를 줍는 모습이 화제가 되면서 알려진 플로깅, plogging에 관한 글이에요. 이 글은 플로깅이 무엇인지 정의하고, 그것이 어디서 시작되어 어떻게 세계적인 운동으로 퍼졌는지를 차례로 보여 줍니다. 요약하면 플로깅은 조깅을 하거나 빨리 걷는 동안 쓰레기를 줍는 행위이고, 스웨덴에서 시작되어 지금은 전 세계로 퍼진 운동이라는 거죠. 요지는 누구나 쉽게 실천할 수 있는 플로깅을 우리도 한번 해 보자는 것입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">플로깅이라는 말은 영어 단어 jogging과 스웨덴어 어구 plocka upp가 합쳐진 \u003cb class=\"key\">합성어\u003c/b>예요. 스웨덴은 자연과 가까운 생활 문화와 재활용, 환경 보호 의식이 강한 나라로 알려져 있고, 이런 분위기 속에서 2016년 Erik Ahlström이 출근길에 쓰레기를 주운 것이 \u003cb class=\"key\">시작점\u003c/b>이 되었어요. 이후 소셜 미디어의 해시태그가 확산 통로 역할을 하면서 하나의 \u003cb class=\"key\">환경 \u003c/b>\u003cb class=\"key\">운동\u003c/b>(environmental movement)으로 자리 잡았죠. 비슷한 예로 걷기와 줍기를 결합한 우리말 신조어 '줍깅'이나 조깅 대신 산행과 결합한 변형도 생겨났어요. 일상 비유를 들면, 등굣길에 이어폰을 끼고 걷다가 눈에 밟히는 빈 캔을 주워 쓰레기통에 넣는 행동에 운동을 얹은 셈이에요. 이처럼 플로깅은 거창한 준비 없이 \u003cb class=\"key\">일상\u003c/b>에서 바로 실천할 수 있다는 점이 큰 특징이에요.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식부터 짚어 볼게요. 플로깅이라는 말은 영어 단어 jogging과 스웨덴어 어구 plocka upp가 합쳐진 합성어예요. 스웨덴은 자연과 가까운 생활 문화와 재활용, 환경 보호 의식이 강한 나라로 알려져 있고, 이런 분위기 속에서 Erik Ahlström이 출근길에 쓰레기를 주운 것이 시작점이 되었어요. 이후 소셜 미디어의 해시태그가 확산 통로 역할을 하면서 하나의 환경 운동으로 자리 잡았죠. 등굣길에 이어폰을 끼고 걷다가 눈에 밟히는 빈 캔을 주워 쓰레기통에 넣는 행동에 운동을 얹었다고 생각하면 이해하기 쉬워요. 이처럼 플로깅은 거창한 준비 없이 일상에서 바로 실천할 수 있다는 점이 큰 특징이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>총리의 플로깅\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>어느 날 아침 인도 \u003cb class=\"key\">총리\u003c/b>가 해변 산책을 하는 동안 쓰레기를 줍는 것이 목격되었다는 사례를 제시한다. 그는 나중에 소셜 미디어에 '해변에서 플로깅'이라는 말과 함께 그것이 \u003cb class=\"key\">30분 \u003c/b>\u003cb class=\"key\">넘게\u003c/b> 지속되었다고 올렸다. 독자의 호기심을 자극하는 \u003cb class=\"key\">구체적 \u003c/b>\u003cb class=\"key\">사례\u003c/b>로 글을 시작하는 단계이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>개념 정의\u003csmall>전환 · 문장 4–6\u003c/small>\u003c/h4>\u003cp>'플로깅이 무엇일까'라는 짧은 \u003cb class=\"key\">질문\u003c/b>을 던진다. 플로깅은 영어 단어 jogging과 '줍다'를 뜻하는 스웨덴어 어구 plocka upp으로 이루어진 \u003cb class=\"key\">합성어\u003c/b>임을 밝힌다. 결국 조깅을 하거나 빨리 걷는 동안 쓰레기를 줍는 \u003cb class=\"key\">행위\u003c/b>가 플로깅이라는 정의를 내리는 단계이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>기원과 확산\u003csmall>근거 · 문장 7–10\u003c/small>\u003c/h4>\u003cp>플로깅은 2016년 스웨덴에서 \u003cb class=\"key\">에릭 \u003c/b>\u003cb class=\"key\">알스트롬\u003c/b>이 출근길에 길거리에서 쓰레기를 발견했을 때 시작되었다. 그가 쓰레기를 주운 것이 \u003cb class=\"key\">습관\u003c/b>이 되었고, 시간이 지나면서 매일 달리기를 하면서도 그것을 했다. 점점 더 많은 사람들이 그의 행동을 보게 되면서 이 운동은 스웨덴 \u003cb class=\"key\">전역\u003c/b>으로 퍼졌다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>세계적 확산\u003csmall>예시 · 문장 11–13\u003c/small>\u003c/h4>\u003cp>이제 플로깅은 사람들이 온라인과 오프라인에서 이야기하는 \u003cb class=\"key\">세계적인 \u003c/b>\u003cb class=\"key\">운동\u003c/b>이 되었다. 소셜 미디어에서 '#plogging'을 검색하면 동네를 청소하는 사진 수천 장을 볼 수 있다. 누구나 쉽게 나가서 쓰레기를 주울 수 있기 때문에 이 운동이 \u003cb class=\"key\">증가\u003c/b>하는 이유도 분명하다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>실천 제안\u003csmall>결론 · 문장 14\u003c/small>\u003c/h4>\u003cp>글은 독자에게 왜 직접 한 번 시도해 보지 않겠냐는 \u003cb class=\"key\">제안\u003c/b>으로 끝난다. 앞에서 설명한 정의와 확산, 그리고 쉬운 실천 가능성이 이 제안을 뒷받침한다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 다섯 단계로 나누어 살펴볼게요.","hl":null},{"n":4,"text":"첫 단계는 도입이에요. 어느 날 아침 인도 총리가 해변 산책을 하는 동안 쓰레기를 줍는 것이 목격되었다는 사례로 시작하죠. 그는 나중에 소셜 미디어에 Plogging at the beach라는 글과 함께 삼십 분 넘게 이어졌다고 올렸어요. 이 구체적 사례가 독자의 호기심을 확 끌어올립니다.","hl":"f0"},{"n":5,"text":"두 번째 단계는 개념 정의예요. But what is plogging? 이라는 짧은 질문을 던지고 바로 답을 주죠. 플로깅은 영어 단어 jogging과 pick up을 뜻하는 스웨덴어 어구 plocka upp으로 이루어진 합성어예요. 결국 조깅을 하거나 빨리 걷는 동안 쓰레기를 줍는 행위가 플로깅이라는 겁니다.","hl":"f1"},{"n":6,"text":"세 번째 단계는 기원과 확산이에요. 플로깅은 이천십육 년 스웨덴에서 Erik Ahlström이 출근길에 길거리에서 쓰레기를 발견했을 때 시작됐어요. 그가 쓰레기를 주운 것이 습관이 되었고, 시간이 지나면서 매일 달리기를 하면서도 그것을 했죠. 점점 더 많은 사람들이 그의 행동을 보게 되면서 이 운동은 스웨덴 전역으로 퍼졌습니다.","hl":"f2"},{"n":7,"text":"네 번째 단계는 세계적 확산이에요. 이제 플로깅은 사람들이 온라인과 오프라인에서 이야기하는 세계적인 운동이 되었죠. 소셜 미디어에서 plogging 해시태그를 검색하면 동네를 청소하는 사진 수천 장을 볼 수 있어요. 누구나 쉽게 나가서 쓰레기를 주울 수 있기 때문에 이 운동이 증가하는 이유도 분명합니다.","hl":"f3"},{"n":8,"text":"다섯 번째 단계는 실천 제안이에요. 글은 So why don't you give it a try yourself? 라는 말로 독자에게 직접 한번 시도해 보라고 권하며 끝납니다. 앞에서 설명한 정의와 확산, 그리고 누구나 쉽게 할 수 있다는 점이 이 제안을 든든하게 뒷받침해 줍니다.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">질문-답변(정의 후 시간순 확산)\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 6번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">도입에서 인도 총리의 사례를 보여 주며 흥미를 끈 뒤 '플로깅이 무엇일까'라는 \u003cb class=\"key\">질문\u003c/b>을 던진다. 그 답으로 6번 문장에서 \u003cb class=\"key\">정의\u003c/b>를 제시하고, 이어서 기원과 확산이라는 \u003cb class=\"key\">근거\u003c/b>를 시간 순서대로 쌓아 올린다. 마지막에는 독자에게 실천을 권하는 \u003cb class=\"key\">제안\u003c/b>으로 끝나므로, 중심 내용이 글 가운데 놓인 \u003cb class=\"key\">중괄식\u003c/b> 구조로 판단할 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>But what is &quot;plogging&quot;? (4)\u003c/b>\u003cspan>전환·질문 제기\u003c/span>\u003cb>is made up of (5)\u003c/b>\u003cspan>정의 제시\u003c/span>\u003cb>began in Sweden in 2016 (7)\u003c/b>\u003cspan>기원 제시\u003c/span>\u003cb>Over time (9)\u003c/b>\u003cspan>시간 경과\u003c/span>\u003cb>As more and more people (10)\u003c/b>\u003cspan>확산의 원인\u003c/span>\u003cb>Now (11)\u003c/b>\u003cspan>현재로 시점 전환\u003c/span>\u003cb>So why don't you give it a try (14)\u003c/b>\u003cspan>제안·마무리\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">plogging\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the act of picking up trash while jogging or walking fast\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">it\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">this\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Ahlström's actions\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the movement\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a global movement\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the movement is growing\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"이 글의 전개 방식은 질문과 답변에 시간 순서가 섞인 구조예요. 먼저 사례로 흥미를 끌고 질문을 던진 다음, 정의를 가운데에 놓고 기원과 확산을 차례로 붙여 나가죠. 그래서 중심 내용이 글 가운데에 오는 중괄식 구조로 보는 것이 자연스럽습니다.","hl":"ty"},{"n":10,"text":"But what is plogging? 이라는 문장이 전환점이자 질문 제기 신호예요. 그리고 is made up of는 정의를, began은 기원을 알려 주는 신호죠. Over time과 As more and more people은 시간의 흐름과 확산의 원인을, Now는 현재로 시점을 바꿔 주고, 마지막의 So why don't you는 제안의 신호입니다. 같은 개념이 plogging, the act of picking up trash, the movement처럼 계속 바꿔 불리고 있다는 점도 꼭 챙겨 두세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>Prime Minister\u003c/b>\u003cem>명사\u003c/em>\u003cspan>총리\u003c/span>\u003c/div>\u003cdiv>\u003cb>pick up\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>(쓰레기 등을) 줍다\u003c/span>\u003c/div>\u003cdiv>\u003cb>trash\u003c/b>\u003cem>명사\u003c/em>\u003cspan>쓰레기\u003c/span>\u003c/div>\u003cdiv>\u003cb>by the beach\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>해변에서, 해변가에서\u003c/span>\u003c/div>\u003cdiv>\u003cb>post\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(소셜 미디어에) 글을 올리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>social media\u003c/b>\u003cem>명사\u003c/em>\u003cspan>소셜 미디어\u003c/span>\u003c/div>\u003cdiv>\u003cb>last\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(시간이) 지속되다, 계속되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>be made up of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 이루어져 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>phrase\u003c/b>\u003cem>명사\u003c/em>\u003cspan>어구, 구\u003c/span>\u003c/div>\u003cdiv>\u003cb>mean\u003c/b>\u003cem>동사\u003c/em>\u003cspan>뜻하다, 의미하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>act\u003c/b>\u003cem>명사\u003c/em>\u003cspan>행위, 행동\u003c/span>\u003c/div>\u003cdiv>\u003cb>jog\u003c/b>\u003cem>동사\u003c/em>\u003cspan>조깅하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>walk fast\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>빨리 걷다\u003c/span>\u003c/div>\u003cdiv>\u003cb>begin\u003c/b>\u003cem>동사\u003c/em>\u003cspan>시작되다, 시작하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>notice\u003c/b>\u003cem>동사\u003c/em>\u003cspan>알아차리다, 발견하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>on one's way to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 가는 길에\u003c/span>\u003c/div>\u003cdiv>\u003cb>habit\u003c/b>\u003cem>명사\u003c/em>\u003cspan>습관, 버릇\u003c/span>\u003c/div>\u003cdiv>\u003cb>over time\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>시간이 지나면서\u003c/span>\u003c/div>\u003cdiv>\u003cb>daily\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>매일의, 일상의\u003c/span>\u003c/div>\u003cdiv>\u003cb>run\u003c/b>\u003cem>명사\u003c/em>\u003cspan>달리기\u003c/span>\u003c/div>\u003cdiv>\u003cb>movement\u003c/b>\u003cem>명사\u003c/em>\u003cspan>(사회적) 운동\u003c/span>\u003c/div>\u003cdiv>\u003cb>spread\u003c/b>\u003cem>동사\u003c/em>\u003cspan>퍼지다, 확산되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>across\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~전역에, ~을 가로질러\u003c/span>\u003c/div>\u003cdiv>\u003cb>global\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>세계적인, 전 지구적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>online and offline\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>온라인과 오프라인에서\u003c/span>\u003c/div>\u003cdiv>\u003cb>search\u003c/b>\u003cem>명사\u003c/em>\u003cspan>검색\u003c/span>\u003c/div>\u003cdiv>\u003cb>neighborhood\u003c/b>\u003cem>명사\u003c/em>\u003cspan>동네, 이웃, 지역\u003c/span>\u003c/div>\u003cdiv>\u003cb>clean up\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>청소하다, 정리하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>grow\u003c/b>\u003cem>동사\u003c/em>\u003cspan>성장하다, 증가하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>give it a try\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>한번 시도해 보다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"단어는 몇 개만 짚고 갈게요. pick up은 줍다, be made up of는 로 이루어져 있다, notice는 알아차리다, spread는 퍼지다라는 뜻이에요. give it a try는 한번 시도해 보다라는 숙어이니 통째로 외워 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">trash\u003c/b>\u003cspan class=\"m\">쓰레기\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">garbage\u003c/span>\u003cspan class=\"s\">rubbish\u003c/span>\u003cspan class=\"s\">waste\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">notice\u003c/b>\u003cspan class=\"m\">알아차리다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">observe\u003c/span>\u003cspan class=\"s\">spot\u003c/span>\u003cspan class=\"s\">detect\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003cspan class=\"a\">overlook\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">spread\u003c/b>\u003cspan class=\"m\">퍼지다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">expand\u003c/span>\u003cspan class=\"s\">circulate\u003c/span>\u003cspan class=\"s\">extend\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">shrink\u003c/span>\u003cspan class=\"a\">contract\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">global\u003c/b>\u003cspan class=\"m\">세계적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">worldwide\u003c/span>\u003cspan class=\"s\">international\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">local\u003c/span>\u003cspan class=\"a\">regional\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">habit\u003c/b>\u003cspan class=\"m\">습관\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">custom\u003c/span>\u003cspan class=\"s\">routine\u003c/span>\u003cspan class=\"s\">practice\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">last\u003c/b>\u003cspan class=\"m\">지속되다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">continue\u003c/span>\u003cspan class=\"s\">endure\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">stop\u003c/span>\u003cspan class=\"a\">end\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">easy\u003c/b>\u003cspan class=\"m\">쉬운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">simple\u003c/span>\u003cspan class=\"s\">effortless\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">difficult\u003c/span>\u003cspan class=\"a\">hard\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어도 정리해 볼게요. notice는 observe, spot과 비슷하고 ignore, overlook과 반대예요. spread는 expand, circulate와 가깝고 shrink와는 반대되죠. global은 worldwide, international과 같은 말이고 local과는 대조됩니다. last는 continue와 비슷하고 stop과 반대이며, easy는 simple과 같고 difficult와 반대라는 점도 기억해 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어느 날 아침,\u003c/span>\u003cspan class=\"en\">One morning,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인도 총리가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">Prime \u003c/span>\u003cspan class=\"tgt\">Minister \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">India\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">목격되었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">seen \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">쓰레기를 줍는 것이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">picking \u003c/span>\u003cspan class=\"tgt\">up \u003c/span>\u003cspan class=\"tgt\">trash\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">해변을 산책하는 동안에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">during \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">walk \u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">beach\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어느 날 아침, 인도 총리가 해변을 산책하는 동안 쓰레기를 줍는 것이 목격되었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 인도 총리가 해변 산책 중 쓰레기를 줍는 모습이 사람들의 눈에 띄었다는 사실을 전하는 도입 문장이에요. 누가 했는지보다 '목격되었다'는 점을 앞세워, 뒤에 이어질 \u003cb class=\"key\">플로깅\u003c/b> 이야기를 자연스럽게 꺼내는 역할을 합니다. 해석할 때 '총리가 주웠다'가 아니라 '총리가 줍는 것이 목격되었다'로 \u003cb class=\"key\">수동태\u003c/b> 느낌을 살려야 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 수식(명사 뒤 수식)\u003c/span> : [The Prime Minister] + [of India (전치사구/앞 명사 수식)] : \"인도의 총리\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지각동사의 수동태(be seen + 현재분사)\u003c/span> : [목적어] + be seen + [현재분사(-ing)] : \"쓰레기를 줍는 것이 목격되었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 during + 명사구(시간 부사어)\u003c/span> : during + [명사구] / by + [장소] : \"해변을 산책하는 동안에\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"One morning, 어느 날 아침. the Prime Minister of India, 인도 총리가. was seen, 목격되었다. picking up trash, 쓰레기를 줍는 것이. during a walk by the beach, 해변을 산책하는 동안에. 이 문장 전체를 해석하면, 어느 날 아침, 인도 총리가 해변을 산책하는 동안 쓰레기를 줍는 것이 목격되었다.","hl":"m"},{"n":14,"text":"이 문장은 인도 총리가 해변을 걷다가 쓰레기를 줍는 모습이 사람들에게 보였다는 소식으로 시작해요. '총리가 주웠다'가 아니라 '줍는 것이 목격되었다'라고 표현한 점이 중요하죠. 이 장면 하나가 뒤에 나올 플로깅이라는 단어를 꺼내는 씨앗이 되는 거예요.","hl":"mn"},{"n":15,"text":"첫 번째로, was seen picking up trash를 보세요. 능동태에서 목적격보어였던 현재분사가 수동태에서도 그대로 남아서, be seen -ing 즉 '~하는 것이 목격되다'라는 형태가 됩니다. 여기서 핵심은 목격된 동작이 진행 중이라는 점을 현재분사가 살려 준다는 거예요. 두 번째로, the Prime Minister of India에서 of India는 앞의 명사 the Prime Minister를 뒤에서 꾸며 주는 전치사구예요. 영어는 꾸미는 말이 명사 뒤에 온다는 규칙, 꼭 기억해 두세요. 세 번째로, during a walk by the beach에서 during은 기간을 나타내고 by는 장소를 나타내서 산책의 때와 장소를 함께 알려 주고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나중에, 그는 그것에 대해 올렸다 소셜 미디어에 라는 말과 함께 '해변에서 플로깅, 그것은 30분 넘게 지속되었습니다.'\u003c/span>\u003cspan class=\"en\">Later, he \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">posted \u003c/span>\u003cspan class=\"tgt\">about \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">social \u003c/span>\u003cspan class=\"tgt\">media\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">words\u003c/span> &quot;Plogging at the beach.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나중에, 그는 '해변에서 플로깅, 그것은 30분 넘게 지속되었습니다.&quot;라는 말과 함께 그것에 대해 소셜 미디어에 올렸다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 총리가 직접 그 경험을 소셜 미디어에 올리면서 플로깅이라는 단어가 세상에 알려지기 시작한 장면이에요. it은 앞 문장의 '쓰레기를 주운 일' 전체를 가리키고, 인용문 안의 It은 '플로깅'을 가리키는 \u003cb class=\"key\">대명사\u003c/b>라서 두 it을 구분해 읽어야 합니다. '~라는 말과 함께'로 with the words를 살려 해석하는 것이 포인트입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">자동사적 post + 전치사 about / on\u003c/span> : post + about + [대상] + on + [매체] : \"그것에 대해 소셜 미디어에 올렸다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동격 관계로 내용을 제시하는 with\u003c/span> : with the words + [인용 내용] : \"'~라는 말과 함께'\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">전치사 for + 기간 / over의 정도 표현\u003c/span> : [last] + for + [기간] : \"30분 넘게\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"Later, 나중에. he posted about it, 그는 그것에 대해 올렸다. on social media, 소셜 미디어에. with the words, 라는 말과 함께. \"Plogging at the beach. It lasted for over 30 minutes.\", '해변에서 플로깅, 그것은 30분 넘게 지속되었습니다.'. 이 문장 전체를 해석하면, 나중에, 그는 '해변에서 플로깅, 그것은 30분 넘게 지속되었습니다.\"라는 말과 함께 그것에 대해 소셜 미디어에 올렸다.","hl":"m"},{"n":17,"text":"총리가 자신이 한 일을 소셜 미디어에 직접 올린 장면이에요. 여기서 it은 앞 문장의 사건 전체를 가리키고, 인용문 안의 It은 플로깅을 가리키니까 두 개를 잘 구분해서 읽어야 해요. 이 게시물 덕분에 플로깅이라는 말이 퍼지기 시작한 거죠.","hl":"mn"},{"n":18,"text":"첫 번째로, posted about it on social media를 보세요. 무엇에 관한 글인지는 about으로, 어디에 올렸는지는 on으로 구분하는 게 자연스러운 영어의 방식이에요. 그리고 it은 앞 문장의 사건 전체를 받는 대명사라는 점도 챙겨 두세요. 두 번째로, with the words는 뒤에 오는 인용문이 words의 내용을 그대로 알려 주는 동격 관계예요. 그래서 '라는 말과 함께'로 해석하면 딱 맞습니다. 세 번째로, for over 30 minutes에서 last는 기간을 나타내는 for와 짝을 이루고, over는 '넘게'라는 정도를 더해 주는 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그런데 무엇일까요 '플로깅'은?\u003c/span>\u003cspan class=\"en\">It lasted for over 30 minutes.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그런데 '플로깅'이 무엇일까?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 플로깅이라는 낯선 단어를 꺼내 놓고, 독자에게 질문을 던져 주의를 끄는 문장이에요. 이런 짧은 \u003cb class=\"key\">의문문\u003c/b>은 정의를 내리기 전에 글의 화제를 분명히 하는 장치로 쓰입니다. 바로 뒤 문장에서 플로깅의 어원과 뜻이 나오니, 이 질문이 다음 내용의 \u003cb class=\"key\">예고\u003c/b> 역할을 한다고 보면 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">의문사가 주격보어인 의문문\u003c/span> : What + be동사 + [주어]? (What = 주격보어) : \"'~은 무엇인가?'\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">접속부사 But(화제 전환)\u003c/span> : But + [완전한 문장] (문장 전체를 이끄는 접속부사) : \"그런데\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"But, 그런데. what is, 무엇일까요. \"plogging\"?, '플로깅'은?. 이 문장 전체를 해석하면, 그런데 '플로깅'이 무엇일까?","hl":"m"},{"n":20,"text":"앞에서 플로깅이라는 낯선 단어를 던져 놓고, 여기서 독자에게 물음을 던지는 거예요. 이런 짧은 의문문은 다음에 나올 정의를 자연스럽게 예고하는 역할을 하죠. 그래서 이 문장 다음에는 반드시 플로깅의 뜻을 설명하는 내용이 이어진답니다.","hl":"mn"},{"n":21,"text":"첫 번째로, what is를 보세요. 여기서 what은 주어가 아니라 주격보어 자리예요. 원래는 Plogging is what인데, 의문사가 앞으로 나가면서 be동사와 자리를 바꾼 형태라는 걸 이해하면 됩니다. 두 번째로, 문장 앞의 But은 앞의 내용을 정리하고 화제를 바꾸는 역할을 해요. 등위접속사가 아니라 뒤에 완전한 문장이 이어지는 접속부사라는 점도 함께 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그런데\u003c/span>\u003cspan class=\"en\">But\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무엇인가요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">what\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">&quot;플로깅&quot;은?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">&quot;plogging&quot;\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">'플로깅'은 영어 단어 'jogging'과 '줍다'를 뜻하는 스웨덴어 어구 'plocka upp'으로 이루어져 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 '그런데 플로깅이란 무엇일까?'라고 물으며 플로깅의 정의를 꺼내는 \u003cb class=\"key\">질문\u003c/b>이에요. 제시된 학생용 해석 4번은 실제로는 바로 다음 문장의 정의를 옮긴 것이므로, 이 질문 문장의 해석과 \u003cb class=\"key\">혼동\u003c/b>하지 않도록 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문사 what이 이끄는 직접의문문\u003c/span> : [의문사] + be동사 + 주어? : \"무엇\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be동사 의문문의 도치\u003c/span> : be동사 + 주어? : \"&quot;플로깅&quot;은 ~인가요\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"But, 그런데. what is, 무엇인가요. \"plogging\"?, \"플로깅\"은?. 이 문장 전체를 해석하면, '플로깅'은 영어 단어 'jogging'과 '줍다'를 뜻하는 스웨덴어 어구 'plocka upp'으로 이루어져 있다.","hl":"m"},{"n":23,"text":"이 문장은 플로깅의 정의를 꺼내기 위해 던지는 질문이에요. 제시된 학생용 해석 네 번째는 실제로는 바로 다음 문장의 정의를 옮긴 것이니, 이 질문 문장의 해석과 혼동하지 않도록 해요.","hl":"mn"},{"n":24,"text":"첫 번째 어법 포인트는 직접의문문이에요. 무엇인지 묻기 위해 의문사 what이 문장 앞에 나왔죠. 두 번째는 도치예요. 의문문이라 be동사 is가 주어 plogging 앞으로 나와 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">&quot;플로깅&quot;은\u003c/span>\u003cspan class=\"en\">&quot;Plogging&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~로 이루어져 있어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">made \u003c/span>\u003cspan class=\"tgt\">up \u003c/span>\u003cspan class=\"tgt\">of\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">영어 단어 &quot;jogging&quot;과\u003c/span>\u003cspan class=\"en\">the English word &quot;jogging&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">스웨덴어 어구 plocka upp,\u003c/span>\u003cspan class=\"en\">and the Swedish phrase plocka upp,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">&quot;줍다&quot;를 뜻하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">meaning \u003c/span>\u003cspan class=\"tgt\">&quot;pick \u003c/span>\u003cspan class=\"tgt\">up.&quot;\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 조깅을 하거나 빨리 걷는 동안 쓰레기를 줍는 행위이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 '플로깅'이라는 말이 'jogging'과 스웨덴어 'plocka upp'에서 왔다는 \u003cb class=\"key\">어원\u003c/b>을 설명해요. 제시된 학생용 해석 5번은 다음 문장의 정의를 옮긴 것이므로, 이 문장은 어원 설명으로 이해해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태 be made up of\u003c/span> : [주어] + be made up of + [구성 요소] : \"~로 이루어져 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재분사 meaning의 분사구문\u003c/span> : [명사구] + meaning + [의미] : \"&quot;줍다&quot;를 뜻하는\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"\"Plogging\", \"플로깅\"은. is made up of, ~로 이루어져 있어요. the English word \"jogging\", 영어 단어 \"jogging\"과. and the Swedish phrase plocka upp, 스웨덴어 어구 plocka upp. meaning \"pick up.\", \"줍다\"를 뜻하는. 이 문장 전체를 해석하면, 그것은 조깅을 하거나 빨리 걷는 동안 쓰레기를 줍는 행위이다.","hl":"m"},{"n":26,"text":"이 문장은 플로깅이라는 말의 어원을 설명해요. 제시된 학생용 해석 다섯 번째는 다음 문장의 정의를 옮긴 것이니, 이 문장은 어원 설명으로 이해해요.","hl":"mn"},{"n":27,"text":"첫 번째 어법 포인트는 수동태예요. be made up of는 주어가 여러 요소로 구성됨을 나타내죠. 두 번째는 현재분사 meaning이에요. 앞의 Swedish phrase plocka upp를 부연 설명하면서 줍다라는 뜻을 더해 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 ~이다\u003c/span>\u003cspan class=\"en\">It is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">행위\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">act \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">쓰레기를 줍는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">picking \u003c/span>\u003cspan class=\"tgt\">up \u003c/span>\u003cspan class=\"tgt\">trash\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">조깅하거나\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">while \u003c/span>\u003cspan class=\"tgt\">jogging \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">빨리 걷는 동안\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">walking\u003c/span> fast.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">(그래서 쓰레기봉투는 스웨덴 사람들에게 꼭 필요한 물건이다.)\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 플로깅의 \u003cb class=\"key\">정의\u003c/b>를 '조깅하거나 빨리 걷는 동안 쓰레기를 줍는 행위'로 내려요. 제시된 학생용 해석 6번은 지문에 없는 \u003cb class=\"key\">추론\u003c/b>이므로, 실제 문장의 뜻과 구분해서 봐요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동격의 of + 동명사구\u003c/span> : the act of + [동명사구] : \"쓰레기를 줍는 행위\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">while + 동명사 / 병렬구조\u003c/span> : while + [동명사 A] or [동명사 B] : \"조깅하거나 걷는 동안\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"It is, 그것은 ~이다. the act, 행위. of picking up trash, 쓰레기를 줍는. while jogging or, 조깅하거나. walking fast, 빨리 걷는 동안. 이 문장 전체를 해석하면, (그래서 쓰레기봉투는 스웨덴 사람들에게 꼭 필요한 물건이다.)","hl":"m"},{"n":29,"text":"이 문장은 플로깅의 정의를 내려요. 제시된 학생용 해석 여섯 번째는 지문에 없는 추론이니, 실제 문장의 뜻과 구분해서 봐요.","hl":"mn"},{"n":30,"text":"첫 번째 어법 포인트는 동격의 of예요. the act를 of 이하의 동명사구가 구체적으로 설명해요. 두 번째는 while 뒤의 동명사와 병렬구조예요. while 뒤에서 주어와 be동사가 생략되고 jogging과 walking이 or로 병렬을 이뤄요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 시작되었다\u003c/span>\u003cspan class=\"en\">It \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">began\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">스웨덴에서\u003c/span>\u003cspan class=\"en\">in Sweden\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">2016년에\u003c/span>\u003cspan class=\"en\">in 2016,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">에릭 알스트롬이 쓰레기를 발견했을 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">when\u003c/span> Erik Ahlström noticed trash\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">길거리에서\u003c/span>\u003cspan class=\"en\">on the streets\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">출근길에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">way \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">work\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 2016년 스웨덴에서 에릭 알스트롬이 출근길에 길거리에서 쓰레기를 발견했을 때 시작되었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 플로깅이 언제, 어디서, 어떤 계기로 시작되었는지 알려 주는 문장이에요. 에릭 알스트롬이 출근길에 쓰레기를 본 일이 \u003cb class=\"key\">시작점\u003c/b>이 되었고, 그 경험이 \u003cb class=\"key\">계기\u003c/b>가 되어 운동으로 퍼졌다는 흐름을 준비해요. 'when'은 앞의 2016년을 구체적으로 설명하는 \u003cb class=\"key\">관계부사\u003c/b>로 이해하면 쉬워요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">자동사 begin(과거형 began)\u003c/span> : 주어 + [begin] + 전치사구 : \"시작되었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관계부사 when(계속적 용법)\u003c/span> : 선행사 [2016] + , when + [완전한 절] : \"그때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">관용표현 on one's way to\u003c/span> : on + [소유격] + way + to + [명사] : \"출근길에\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"It began, 그것은 시작되었다. in Sweden, 스웨덴에서. in 2016, 2016년에. when Erik Ahlström noticed trash, 에릭 알스트롬이 쓰레기를 발견했을 때. on the streets, 길거리에서. on his way to work, 출근길에. 이 문장 전체를 해석하면, 그것은 2016년 스웨덴에서 에릭 알스트롬이 출근길에 길거리에서 쓰레기를 발견했을 때 시작되었다.","hl":"m"},{"n":32,"text":"이 문장은 플로깅이 언제, 어디서, 어떤 계기로 시작되었는지를 알려 줘요. 에릭 알스트롬이 출근길에 쓰레기를 본 일이 시작점이 되었고, 그 경험이 계기가 되어 플로깅이 퍼졌다고 기억하면 좋아요. 여기서 when은 앞의 이천십육 년을 구체적으로 설명하는 관계부사로 봐 주세요.","hl":"mn"},{"n":33,"text":"첫 번째로 began은 여기서 '시작되다'라는 자동사로 쓰였어요. 뒤에 in Sweden과 in twenty sixteen이 와서 각각 장소와 시간을 더해 주죠. 두 번째로 when은 앞의 이천십육 년을 받아 '그때'라는 뜻으로 절을 이어 주는 관계부사이고, when 뒤에는 주어와 동사가 다 있는 완전한 절이 와요. 세 번째로 on his way to work는 '출근길에'라는 관용표현이에요. to 뒤에 work처럼 명사가 와서 어떤 곳으로 가는 길을 나타낸다고 정리해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는\u003c/span>\u003cspan class=\"en\">He\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">주웠다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">picked \u003c/span>\u003cspan class=\"tgt\">up \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 쓰레기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">trash\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 이것은 되었다\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">this\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">became \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">습관이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">habit\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 쓰레기를 주웠고, 이것은 습관이 되었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 에릭이 쓰레기를 줍는 행동을 실제로 했고, 그 행동이 한 번으로 끝나지 않고 반복되어 \u003cb class=\"key\">습관\u003c/b>이 되었음을 보여 줘요. 앞 문장의 발견이 행동으로 이어지고, 그 행동이 다시 \u003cb class=\"key\">반복\u003c/b>으로 이어지는 흐름을 잡으면 좋아요. this는 바로 앞의 '쓰레기를 줍는 일'을 가리키는 \u003cb class=\"key\">지시대명사\u003c/b>예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">구동사 pick up\u003c/span> : pick up + [목적어] : \"쓰레기를 주웠다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지시대명사 this\u003c/span> : [this] + 동사 : \"이것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">become + 명사 보어(상태 변화)\u003c/span> : become + [명사(주격보어)] : \"습관이 되었다\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"He, 그는. picked up, 주웠다. the trash, 그 쓰레기를. and this became, 그리고 이것은 되었다. a habit, 습관이. 이 문장 전체를 해석하면, 그는 쓰레기를 주웠고, 이것은 습관이 되었다.","hl":"m"},{"n":35,"text":"이 문장은 에릭이 쓰레기를 줍는 행동을 실제로 했고, 그 행동이 반복되어 습관이 되었음을 보여 줘요. 앞 문장의 발견이 행동으로 이어지고, 그 행동이 다시 반복으로 이어지는 흐름을 잡으면 좋아요. this는 바로 앞의 쓰레기를 줍는 일을 가리키는 지시대명사예요.","hl":"mn"},{"n":36,"text":"첫 번째로 picked up은 '줍다'라는 뜻의 구동사예요. 목적어가 the trash처럼 길 때는 pick up the trash처럼 up 뒤에 목적어를 둘 수 있어요. 두 번째로 this는 앞 문장의 내용인 쓰레기를 줍는 행동을 받는 지시대명사로 쓰였어요. 세 번째로 became은 주어의 상태 변화를 나타내는 동사라서 뒤에 a habit이라는 명사 보어가 와요. 그래서 '습관이 되다'라는 상태 변화로 이해하면 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시간이 지나면서,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Over \u003c/span>\u003cspan class=\"tgt\">time\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 심지어 그것을 했다\u003c/span>\u003cspan class=\"en\">he \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">even\u003c/span> did \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">it\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매일 달리기를 하면서!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">daily \u003c/span>\u003cspan class=\"tgt\">runs\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">시간이 지나면서, 그는 심지어 매일 달리기를 하면서 그것을 했다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 처음에는 출근길에 우연히 시작한 쓰레기 줍기가 시간이 지나면서 \u003cb class=\"key\">일상\u003c/b>으로 확장되었음을 보여 줘요. '심지어'라는 even이 들어가서 매일 달리기를 할 때도 쓰레기를 주웠다는 \u003cb class=\"key\">강조\u003c/b>가 생겨요. it은 앞에서 나온 '쓰레기를 줍는 일'을 가리키는 \u003cb class=\"key\">대명사\u003c/b>예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관용표현 over time\u003c/span> : Over time, + [주어 + 동사] : \"시간이 지나면서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">강조 부사 even\u003c/span> : [even] + 동사구 : \"심지어\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">지시대명사 it\u003c/span> : 동사 + [it] : \"그것(쓰레기를 줍는 일)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">전치사 on + 명사(동작의 상황)\u003c/span> : on + [his daily runs] : \"매일 달리기를 하면서\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"Over time, 시간이 지나면서. he even did it, 그는 심지어 그것을 했다. on his daily runs!, 매일 달리기를 하면서!. 이 문장 전체를 해석하면, 시간이 지나면서, 그는 심지어 매일 달리기를 하면서 그것을 했다!","hl":"m"},{"n":38,"text":"처음에는 출근길에 우연히 시작한 쓰레기 줍기가 시간이 지나면서 일상으로 확장되었음을 보여 줘요. even이 들어가서 매일 달리기를 할 때도 쓰레기를 주웠다는 강조가 생겨요. it은 앞에서 나온 쓰레기를 줍는 일을 가리키는 대명사예요.","hl":"mn"},{"n":39,"text":"첫 번째로 over time은 '시간이 지나면서, 점차'라는 뜻의 관용표현이에요. 문장 앞에서 변화의 흐름을 이끌어 주죠. 두 번째로 even은 '심지어'라는 뜻으로, 매일 달리기를 하면서까지 쓰레기를 주웠다는 놀라운 행동을 강조해요. 세 번째로 it은 앞에서 나온 쓰레기를 줍는 일을 가리키는 지시대명사예요. 네 번째로 on his daily runs에서 on은 '하는 중에, 하면서'라는 상황을 나타내는 전치사이고, daily는 run을 꾸며 주는 형용사로 '매일 하는'이라는 뜻이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">점점 더 많은 사람들이 알스트롬의 행동을 보게 되면서,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">As \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">saw \u003c/span>\u003cspan class=\"tgt\">Ahlström's \u003c/span>\u003cspan class=\"tgt\">actions,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 운동은 퍼졌다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">movement \u003c/span>\u003cspan class=\"tgt\">spread\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">스웨덴 전역으로\u003c/span>\u003cspan class=\"en\">across Sweden.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">점점 더 많은 사람들이 알스트롬의 행동을 보게 되면서, 이 운동은 스웨덴 전역으로 퍼졌다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 알스트롬의 행동을 본 사람이 늘어난 것이 \u003cb class=\"key\">운동\u003c/b>이 퍼진 \u003cb class=\"key\">배경\u003c/b>임을 말하는 문장이에요. 'more and more'는 점점 더 많아지는 \u003cb class=\"key\">변화\u003c/b>를 보여 주고, 'across Sweden'은 퍼진 \u003cb class=\"key\">범위\u003c/b>가 스웨덴 전체임을 나타냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 as (이유·배경)\u003c/span> : As + [주어] + [동사] , [주절] : \"점점 더 많은 사람들이 … 보게 되면서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">비교급 반복 (more and more)\u003c/span> : [비교급] and [비교급] = 점점 더 ~한 : \"점점 더 많은 사람들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">자동사 spread의 과거형\u003c/span> : [주어] + [자동사 spread (과거형)] : \"그 운동은 퍼졌다\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"As more and more people saw Ahlström's actions, 점점 더 많은 사람들이 알스트롬의 행동을 보게 되면서. the movement spread, 이 운동은 퍼졌다. across Sweden, 스웨덴 전역으로. 이 문장 전체를 해석하면, 점점 더 많은 사람들이 알스트롬의 행동을 보게 되면서, 이 운동은 스웨덴 전역으로 퍼졌다.","hl":"m"},{"n":41,"text":"이 문장은 알스트롬의 행동을 본 사람이 늘어난 것이 운동이 퍼진 배경이라고 말하고 있어요. more and more는 점점 더 많아지는 변화를 보여 주고, across Sweden은 퍼진 범위가 스웨덴 전체라는 걸 알려 줍니다. 한 사람의 습관이 사회 전체로 번지는 그림을 그리면서 읽으면 이해가 쉬워요.","hl":"mn"},{"n":42,"text":"먼저 As는 이유를 나타내는 접속사예요. 많은 사람들이 행동을 보게 된 것이 운동이 퍼진 배경이라는 걸 알려 주죠. 두 번째로 more and more처럼 비교급을 and로 이어 붙이면 점점 더 변해 가는 변화를 나타내요. many의 비교급이 more라서 점점 더 많은 사람들이라는 뜻이 되는 거예요. 세 번째로 spread는 3단 변화가 spread, spread, spread로 모두 같아요. 그래서 과거인데도 모양이 원형과 똑같다는 점을 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이제,\u003c/span>\u003cspan class=\"en\">Now,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">플로깅은 세계적인 운동인데,\u003c/span>\u003cspan class=\"en\">plogging is a global movement,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들이 그것에 대해 이야기하기 때문에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">talk \u003c/span>\u003cspan class=\"tgt\">about \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">온라인과 오프라인에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">online \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">offline\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이제, 플로깅은 세계적인 운동인데, 사람들이 온라인과 오프라인에서 그것에 대해 이야기하기 때문이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 플로깅이 이제 \u003cb class=\"key\">세계적\u003c/b>인 \u003cb class=\"key\">운동\u003c/b>이 되었다는 결론을 제시하면서, 그 \u003cb class=\"key\">이유\u003c/b>로 온라인과 오프라인에서의 \u003cb class=\"key\">입소문\u003c/b>을 들고 있어요. 앞 문장의 스웨덴 전역 확산을 세계 규모로 정리해 주는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 as (이유)\u003c/span> : [주절] , as + [주어] + [동사] : \"사람들이 온라인과 오프라인에서 그것에 대해 이야기하기 때문에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">대명사 it의 지칭\u003c/span> : [동사] + about + [대명사 it] : \"그것에 대해 이야기하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">병렬 구조 (A and B)\u003c/span> : [명사/부사] and [명사/부사] : \"온라인과 오프라인에서\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"Now, 이제. plogging is a global movement, 플로깅은 세계적인 운동인데. as people talk about it, 사람들이 그것에 대해 이야기하기 때문에. online and offline, 온라인과 오프라인에서. 이 문장 전체를 해석하면, 이제, 플로깅은 세계적인 운동인데, 사람들이 온라인과 오프라인에서 그것에 대해 이야기하기 때문이다.","hl":"m"},{"n":44,"text":"이 문장은 플로깅이 이제 세계적인 운동이 되었다는 결론을 제시해요. 그 이유로 사람들이 온라인과 오프라인에서 입소문을 내고 있다는 점을 들고 있죠. 앞 문장에서 보여 준 스웨덴 전역의 확산을 세계 규모로 정리해 주는 문장입니다.","hl":"mn"},{"n":45,"text":"먼저 as는 이유를 나타내는 접속사예요. 플로깅이 세계적인 운동이라는 말에 그 원인을 덧붙여 주고 있죠. 두 번째로 it은 앞에 나온 plogging, 즉 플로깅을 가리키는 대명사예요. 같은 말을 반복하지 않으려고 이렇게 받은 거예요. 세 번째로 online and offline은 and가 대등한 두 말을 이어 붙인 병렬 구조입니다. 온라인과 오프라인, 양쪽 모두에서라는 뜻이 자연스럽게 살아나요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">빠른 검색은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">A \u003c/span>\u003cspan class=\"tgt\">quick \u003c/span>\u003cspan class=\"tgt\">search \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘#plogging’에 대한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">for\u003c/span> &quot;#plogging&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">소셜 미디어에서\u003c/span>\u003cspan class=\"en\">on social media\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신에게 줄 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">give \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수천 장의 사진을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">thousands \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">pictures\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들이 그들의 동네를 청소하는\u003c/span>\u003cspan class=\"en\">of \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">cleaning \u003c/span>\u003cspan class=\"tgt\">up \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">neighborhoods\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">소셜 미디어에서 '#plogging'을 빠르게 검색하면 사람들이 그들의 동네를 청소하는 사진 수천 장을 볼 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 검색만 해도 사진이 수천 장 나올 만큼 플로깅이 \u003cb class=\"key\">대중화\u003c/b>되었다는 것을 보여 주는 문장이에요. 'A quick search'는 \u003cb class=\"key\">손쉬움\u003c/b>을, 'thousands of pictures'는 \u003cb class=\"key\">규모\u003c/b>를 강조합니다. 앞에서 말한 세계적인 운동이라는 주장을 구체적인 장면으로 뒷받침해 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 for를 동반하는 명사 search\u003c/span> : a search for + [찾는 대상] : \"~에 대한 검색\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">4형식 수여동사 give\u003c/span> : give + [간접목적어 you] + [직접목적어 thousands of pictures] : \"당신에게 수천 장의 사진을 줄 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동명사의 의미상 주어\u003c/span> : of + [의미상 주어 people] + [동명사 cleaning up] : \"사람들이 그들의 동네를 청소하는\"\u003c/div>\u003c/div>","segs":[{"n":46,"text":"A quick search, 빠른 검색은. for \"#plogging\", ‘#plogging’에 대한. on social media, 소셜 미디어에서. will give you, 당신에게 줄 것이다. thousands of pictures, 수천 장의 사진을. of people cleaning up their neighborhoods, 사람들이 그들의 동네를 청소하는. 이 문장 전체를 해석하면, 소셜 미디어에서 '#plogging'을 빠르게 검색하면 사람들이 그들의 동네를 청소하는 사진 수천 장을 볼 수 있다.","hl":"m"},{"n":47,"text":"이 문장은 검색만 해도 사진이 수천 장 나올 만큼 플로깅이 대중화되었다는 걸 보여 줘요. A quick search는 손쉬움을, thousands of pictures는 규모를 강조하는 표현이죠. 그래서 앞에서 말한 세계적인 운동이라는 주장을 구체적인 장면으로 뒷받침해 줍니다.","hl":"mn"},{"n":48,"text":"먼저 search는 무엇을 찾는다는 뜻일 때 전치사 for와 짝을 이뤄요. 그래서 무엇에 대한 검색은 a search for something이 됩니다. 두 번째로 give는 간접목적어와 직접목적어를 함께 데리고 오는 수여동사예요. 사람에게 물건을 준다는 순서, 즉 you 다음에 thousands of pictures가 오는 구조죠. 세 번째로 cleaning up 앞에 있는 people은 의미상 주어예요. 동명사가 나타내는 동작의 주체를 밝혀 주는 역할을 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">쉽게 알 수 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It's \u003c/span>\u003cspan class=\"tgt\">easy \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">see\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 운동이 왜 증가하고 있는지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">why \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">movement \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">growing\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">누구나 쉽게 나가서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">anyone \u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">easily \u003c/span>\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">go \u003c/span>\u003cspan class=\"tgt\">out \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">쓰레기를 좀 주울 수 있기 때문에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">pick \u003c/span>\u003cspan class=\"tgt\">up \u003c/span>\u003cspan class=\"tgt\">some \u003c/span>\u003cspan class=\"tgt\">trash\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">왜 이 운동이 증가하고 있는지 쉽게 알 수 있는데, 누구나 쉽게 나가서 쓰레기를 주울 수 있기 때문이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 플로깅 운동이 왜 \u003cb class=\"key\">확산\u003c/b>되는지 그 까닭을 짚어 줍니다. 핵심 이유는 \u003cb class=\"key\">누구나\u003c/b> 쉽게 밖으로 나가 쓰레기를 주울 수 있다는 \u003cb class=\"key\">접근성\u003c/b>이에요. 'It's easy to see'는 '~라는 것을 쉽게 알 수 있다'는 뜻으로, 뒤에 오는 이유가 아주 \u003cb class=\"key\">당연\u003c/b>하다는 어조를 만들어 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가주어 it / 진주어 to부정사\u003c/span> : It is + [형용사] + [to see ~ (to부정사구/진주어)] : \"왜 그런지 아는 것은 쉽다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">간접의문문(의문사 + 주어 + 동사)\u003c/span> : see + [why + 주어 + 동사] (의문사절 = 목적어) : \"왜 그 운동이 증가하고 있는지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">as 접속사(이유)\u003c/span> : [주절] + as + [주어 + 동사] (~때문에) : \"누구나 쉽게 나가서 쓰레기를 주울 수 있기 때문에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">동사 병렬 구조\u003c/span> : [go out] and [pick up] (동사원형 and 동사원형) : \"나가서 줍다\"\u003c/div>\u003c/div>","segs":[{"n":49,"text":"It's easy to see, 쉽게 알 수 있다. why the movement is growing, 그 운동이 왜 증가하고 있는지. as anyone can easily go out, 누구나 쉽게 나가서. and pick up some trash, 쓰레기를 좀 주울 수 있기 때문에. 이 문장 전체를 해석하면, 왜 이 운동이 증가하고 있는지 쉽게 알 수 있는데, 누구나 쉽게 나가서 쓰레기를 주울 수 있기 때문이다.","hl":"m"},{"n":50,"text":"이 문장은 플로깅이 왜 퍼지는지 그 이유를 짚어 주는 문장이에요. 누구나 쉽게 나가서 쓰레기를 주울 수 있다는 접근성이 핵심 이유라는 거죠. 그래서 쉽게 알 수 있다는 표현으로 이유가 아주 당연하다는 느낌을 줍니다.","hl":"mn"},{"n":51,"text":"첫 번째로 It's easy to see에서 It은 가주어이고, 진짜 주어인 진주어는 뒤에 있는 to see예요. 두 번째로 why the movement is growing은 see의 목적어로 쓰인 간접의문문이라서 why is the movement가 아니라 평서문 어순으로 씁니다. 세 번째로 as는 이유를 나타내는 접속사예요. 누구나 할 수 있다는 보편성이 운동이 커지는 근거가 된다는 흐름이죠. 네 번째로 go out and pick up은 can 뒤에서 동사원형 두 개가 and로 병렬 연결된 구조예요. 나가다와 줍다, 두 동작이 같은 주어 anyone에 이어집니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러니\u003c/span>\u003cspan class=\"en\">So\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜 ~하지 않으세요? (= ~하는 게 어때요?)\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">why \u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003cspan class=\"tgt\">you\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 한 번 시도해 보다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">give \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">try\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분 직접\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">yourself\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러니 여러분도 직접 한 번 시도해 보는 게 어떨까\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글 전체를 맺으면서 \u003cb class=\"key\">독자\u003c/b>에게 직접 해 보라고 \u003cb class=\"key\">제안\u003c/b>하는 문장이에요. 'Why don't you ~?'는 부담 없이 권할 때 쓰는 \u003cb class=\"key\">권유\u003c/b> 표현이고, yourself가 붙어서 '남이 아닌 바로 여러분'이라는 \u003cb class=\"key\">강조\u003c/b>를 더해 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">제안 표현 Why don't you ~?\u003c/span> : Why don't you + [동사원형]? (~하는 게 어때요?) : \"왜 ~하지 않으세요? (= ~하는 게 어때요?)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관용 표현 give + 목적어 + a try\u003c/span> : give + [목적어] + a try (한 번 시도해 보다) : \"그것을 한 번 시도해 보다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">재귀대명사(강조 용법)\u003c/span> : [명령문] + yourself (직접/스스로) : \"여러분 직접\"\u003c/div>\u003c/div>","segs":[{"n":52,"text":"So, 그러니. why don't you, 왜 ~하지 않으세요? (= ~하는 게 어때요?). give it a try, 그것을 한 번 시도해 보다. yourself?, 여러분 직접. 이 문장 전체를 해석하면, 그러니 여러분도 직접 한 번 시도해 보는 게 어떨까","hl":"m"},{"n":53,"text":"이 문장은 글 전체를 마무리하면서 독자에게 직접 해 보자고 제안해요. Why don't you는 부담 없이 권하는 표현이고, yourself가 붙어서 다른 사람이 아니라 바로 여러분이라는 강조를 더해 줍니다.","hl":"mn"},{"n":54,"text":"첫 번째로 why don't you는 직역이 아니라 제안과 권유를 나타내는 표현이에요. 두 번째로 give it a try는 동사 give에 목적어 it과 명사 a try를 붙인 덩어리 표현으로 한 번 시도해 보다라는 뜻이죠. 세 번째로 yourself는 재귀대명사의 강조 용법으로, 없어도 문장이 되지만 바로 여러분이라는 강조를 더해 줍니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>인도 \u003cb class=\"key\">총리\u003c/b>가 해변 산책 중 쓰레기를 줍고 그것을 소셜 미디어에 올리면서 플로깅이 화제가 되었다.\u003c/li>\u003cli>플로깅은 영어 단어 jogging과 '줍다'를 뜻하는 스웨덴어 어구 plocka upp으로 이루어진 말로, 조깅을 하거나 빨리 걷는 동안 \u003cb class=\"key\">쓰레기를 \u003c/b>\u003cb class=\"key\">줍는 \u003c/b>\u003cb class=\"key\">행위\u003c/b>를 뜻한다.\u003c/li>\u003cli>이 운동은 2016년 스웨덴에서 \u003cb class=\"key\">에릭 \u003c/b>\u003cb class=\"key\">알스트롬\u003c/b>이 출근길에 쓰레기를 주우면서 시작되어 스웨덴 전역으로 퍼졌다.\u003c/li>\u003cli>소셜 미디어를 통해 \u003cb class=\"key\">세계적인 \u003c/b>\u003cb class=\"key\">운동\u003c/b>이 된 플로깅은 누구나 쉽게 실천할 수 있어 계속 증가하고 있다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Plogging, the act of picking up trash while jogging or walking fast, began in Sweden and has grown into a global movement that anyone can easily join.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: 인도 총리가 해변에서 쓰레기를 줍는 모습이 화제가 되며 알려진 \u003cb class=\"key\">플로깅\u003c/b>은 조깅을 하거나 빨리 걷는 동안 쓰레기를 줍는 행위로, 2016년 스웨덴의 \u003cb class=\"key\">에릭 \u003c/b>\u003cb class=\"key\">알스트롬\u003c/b>에서 시작되어 이제는 세계적인 \u003cb class=\"key\">운동\u003c/b>으로 퍼졌다. 누구나 쉽게 나가서 쓰레기를 주울 수 있다는 점이 이 운동이 \u003cb class=\"key\">증가\u003c/b>하는 이유이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":55,"text":"정리해 볼게요. 플로깅은 조깅을 하거나 빨리 걷는 동안 쓰레기를 줍는 행위이고, 스웨덴에서 시작되어 지금은 세계적인 운동으로 퍼졌습니다. 누구나 쉽게 실천할 수 있다는 점이 이 운동의 가장 큰 힘이에요. 오늘 배운 내용 꼭 복습하시고, 여러분도 가까운 길에서 한번 give it a try 해 보세요. 수고했습니다.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
