3전 세계로의 확산</div><ul><li>온라인 소셜 미디어를 통해 전 세계적인 운동으로 발전했습니다.</li><li>사람들의 관심을 받으며 스웨덴 전역으로 확대</li><li>SNS상의 해시태그(#plogging)를 통한 인증 문화</li><li>핵심 키워드: 글로벌 운동(global movement)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04누구나 참여 가능한 환경 운동</div><ul><li>간편하게 시작할 수 있다는 점이 플로깅의 큰 장점입니다.</li><li>특별한 도구 없이 누구나 즉시 동참 가능</li><li>이웃과 동네를 청소하며 환경 보호에 기여</li><li>핵심 키워드: 참여(participation)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">pick up</td><td class=\"m\">줍다, (습관 등을) 익히다</td></tr><tr><td class=\"w\">be made up of</td><td class=\"m\">~으로 구성되다, ~으로 이루어지다</td></tr><tr><td class=\"w\">over time</td><td class=\"m\">시간이 지나면서, 차츰</td></tr><tr><td class=\"w\">spread</td><td class=\"m\">퍼지다, 확산되다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">global</td><td class=\"m\">세계적인, 전 세계의</td></tr><tr><td class=\"w\">clean up</td><td class=\"m\">~을 청소하다, ~을 정리하다</td></tr><tr><td class=\"w\">give it a try</td><td class=\"m\">한번 시도해 보다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어느 날 아침,</span><span class=\"en\"><b>One morning,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인도 총리는</span><span class=\"en\"><b>the Prime Minister of India</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">목격되었다</span><span class=\"en\"><b><span class=\"grammar-hl\">was seen</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">쓰레기를 줍는 것이</span><span class=\"en\"><b><span class=\"grammar-hl\">picking up</span> trash</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">해변을 따라 걷는 동안에</span><span class=\"en\"><b>during a walk by the beach.</b></span></div></div><div class=\"lec-sent-ko\">어느 날 아침, 인도 총리가 해변을 산책하는 동안 쓰레기를 줍는 것이 목격되었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 도입부로서, 유명 인사의 행동을 제시하여 독자의 호기심을 유발하고 뒤이어 나올 &#39;플로깅&#39;이라는 개념을 자연스럽게 소개하는 사례 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was seen picking up (수동태): be동사(was)+p.p.(seen) 구조. see는 지각동사로 see+O+V-ing(5형식) 구조인데 목적어가 주어로 올라가 수동구조 was seen이 되고, 보어인 현재분사(picking up)는 그대로 남는다. see는 타동사인데 목적어가 없어서 수동구조 was seen 형태로 쓴다. 기본구조: see + O + V-ing(목적어와 목적보어 관계)</div><div class=\"lec-gr-item\">picking up (현재분사): picking up이 수동태 문장에서 목적보어(지각동사의 목적보어) 역할을 수행함</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나중에,</span><span class=\"en\"><b>Later,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는 그것에 대해 게시했다</span><span class=\"en\"><b>he posted about it</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">소셜 미디어에</span><span class=\"en\"><b>on social media</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">“해변에서 플로깅.</span><span class=\"en\"><b>with the words “Plogging at the beach.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 30분 넘게 지속되었습니다.”라는 말과 함께</span><span class=\"en\"><b><span class=\"grammar-hl\">It lasted for</span> over 30 minutes.”</b></span></div></div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 목격담에 이어 총리 스스로가 자신의 행동을 알리는 장면을 보여주며, &#39;플로깅&#39;이라는 새로운 용어를 대중에게 노출합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It lasted for (관용표현): last for는 &#39;얼마 동안 지속되다&#39;라는 뜻의 숙어</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그런데</span><span class=\"en\"><b>But</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">무엇인가</span><span class=\"en\"><b><span class=\"grammar-hl\">what</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">“플로깅”은?</span><span class=\"en\"><b><span class=\"grammar-hl\">is “plogging”?</span></b></span></div></div><div class=\"lec-sent-ko\">그런데 ‘플로깅’이 무엇일까?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 등장한 용어의 의미가 궁금할 독자에게 질문을 던져, 다음 문장에서 나올 정의를 효과적으로 전달하려는 전환의 역할을 합니다. 4. “Plogging” is made up of the English word “jogging” and the Swedish phrase plocka upp, meaning “pick up.” &#39;플로깅&#39;이라는 단어의 어원적 배경을 설명하여, 이 운동이 가진 합성어적 의미를 독자가 직관적으로 이해하도록 돕습니다. 5. It is the act of picking up trash while jogging or walking fast. 플로깅의 실질적인 정의를 내려, 운동과 청소를 결합한 구체적인 활동 방식을 명확히 설명합니다. 6. It began in Sweden in 2016, when Erik Ahlström noticed trash on the streets on his way to work. 플로깅의 역사적 기원을 다루며, 평범한 일상의 발견이 어떻게 사회적 운동으로 발전했는지 이야기의 배경을 제공합니다. 7. He picked up the trash, and this became a habit. 개인의 우연한 행동이 반복됨으로써 단순한 일회성 사건이 아닌 습관으로 정착되었음을 강조하며 변화의 과정을 보여줍니다. 8. Over time, he even did it on his daily runs! 앞선 습관이 운동과 완전히 결합하는 단계를 보여주며, 플로깅의 실천 방식이 더욱 일상적인 루틴으로 자리 잡았음을 나타냅니다. 9. As more and more people saw Ahlström’s actions, the movement spread across Sweden. 개인의 실천이 주변 사람들에게 영향을 주어 사회적 규모의 움직임으로 확대되는 인과관계를 설명합니다. 10. Now, plogging is a global movement, as people talk about it online and offline. 오늘날의 시점으로 넘어와, 이 운동이 국경을 넘어 전 세계적인 현상이 되었음을 보여주며 주제를 확장합니다. 11. A quick search for “#plogging” on social media will give you thousands of pictures of people cleaning up their neighborhoods. 디지털 매체를 통한 플로깅의 실질적인 증거를 제시하여, 독자가 이 운동의 규모를 체감하게 만드는 예시의 역할을 합니다. 12. It’s easy to see why the movement is growing, as anyone can easily go out and pick up some trash. 플로깅이 전 세계적으로 확산하는 원인을 &#39;높은 접근성&#39;과 &#39;누구나 실천 가능한 쉬운 방법&#39;으로 정리하여 논리를 보강합니다. 13. So why don’t you give it a try yourself? 글의 마지막으로서 독자에게 직접적인 참여를 권유하며 실천을 유도하는 결론을 맺습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">what is “plogging”? (간접의문문): 의문사(what)+V(is)+S(plogging) 형태의 의문문 구조</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“플로깅”은</span><span class=\"en\"><b>“Plogging”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">구성된다</span><span class=\"en\"><b><span class=\"grammar-hl\">is made up of</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">영어 단어 “조깅”과</span><span class=\"en\"><b>the English word “jogging”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">스웨덴어 어구인 plocka upp으로,</span><span class=\"en\"><b>and the Swedish phrase plocka upp,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">“줍다”를 의미하는</span><span class=\"en\"><b><span class=\"grammar-hl\">meaning “pick up.”</span></b></span></div></div><div class=\"lec-sent-ko\">‘플로깅’은 영어 단어 ‘jogging’과 ‘줍다’를 뜻하는 스웨덴어 어구 ‘plocka upp’으로 이루어져 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> &#39;플로깅&#39;이라는 단어의 어원적 배경을 설명하여, 이 운동이 가진 합성어적 의미를 독자가 직관적으로 이해하도록 돕습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is made up of (수동태): be동사(is)+p.p.(made) 구조. make up은 타동사구로 make up A(A를 구성하다) 구조인데 목적어가 주어로 올라가 수동구조 is made up of 형태로 쓴다. 기본구조: make up + O(목적어)</div><div class=\"lec-gr-item\">meaning “pick up.” (현재분사): 분사구문으로, 원래 절로 변환하면 &#39;which means “pick up.”&#39;처럼 앞의 구절을 부연 설명하는 기능</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">pick up</td><td class=\"m\">줍다, (습관 등을) 익히다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은</span><span class=\"en\"><b>It</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">행위이다</span><span class=\"en\"><b>is <span class=\"grammar-hl\">the act</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">쓰레기를 줍는</span><span class=\"en\"><b><span class=\"grammar-hl\">of picking up</span> trash</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">조깅하거나 빨리 걷는 동안에</span><span class=\"en\"><b>while jogging or walking fast.</b></span></div></div><div class=\"lec-sent-ko\">그것은 조깅을 하거나 빨리 걷는 동안 쓰레기를 줍는 행위이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 플로깅의 실질적인 정의를 내려, 운동과 청소를 결합한 구체적인 활동 방식을 명확히 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the act of picking up (동명사): 전치사 of의 목적어 자리에 위치한 명사적 역할의 -ing</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은</span><span class=\"en\"><b>It</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">2016년 스웨덴에서 시작되었다,</span><span class=\"en\"><b>began in Sweden in 2016,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">에릭 알스트롬이 길거리의 쓰레기를 발견했을 때</span><span class=\"en\"><b><span class=\"grammar-hl\">when Erik Ahlström noticed</span> trash on the streets</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">직장으로 가는 길에</span><span class=\"en\"><b>on his way to work.</b></span></div></div><div class=\"lec-sent-ko\">그것은 2016년 스웨덴에서 에릭 알스트롬이 출근길에 길거리에서 쓰레기를 발견했을 때 시작되었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 플로깅의 역사적 기원을 다루며, 평범한 일상의 발견이 어떻게 사회적 운동으로 발전했는지 이야기의 배경을 제공합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">when Erik Ahlström noticed (관계부사): when은 시간의 선행사를 수식하며 뒤에 완전한 절(Erik Ahlström noticed trash...)이 이어짐</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는</span><span class=\"en\"><b>He</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 쓰레기를 주웠고,</span><span class=\"en\"><b><span class=\"grammar-hl\">picked up</span> the trash,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이것은</span><span class=\"en\"><b>and this</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">습관이 되었다.</span><span class=\"en\"><b>became a habit.</b></span></div></div><div class=\"lec-sent-ko\">그는 쓰레기를 주웠고, 이것은 습관이 되었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 개인의 우연한 행동이 반복됨으로써 단순한 일회성 사건이 아닌 습관으로 정착되었음을 강조하며 변화의 과정을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">picked up (관용표현): pick up은 &#39;줍다&#39;라는 뜻의 이어동사(구동사)</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">시간이 흐르면서,</span><span class=\"en\"><b>Over time,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는 심지어 그것을 했다</span><span class=\"en\"><b>he even <span class=\"grammar-hl\">did it</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매일의 달리기 동안에!</span><span class=\"en\"><b>on his daily runs!</b></span></div></div><div class=\"lec-sent-ko\">시간이 지나면서, 그는 심지어 매일 달리기를 하면서 그것을 했다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 습관이 운동과 완전히 결합하는 단계를 보여주며, 플로깅의 실천 방식이 더욱 일상적인 루틴으로 자리 잡았음을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">did it (대동사): 앞에 나온 &#39;picked up the trash&#39;라는 일반동사구의 반복을 피하기 위해 사용됨. 앞의 동사가 일반동사이면 did(과거형)를 쓴다</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">over time</td><td class=\"m\">시간이 지나면서, 차츰</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">점점 더 많은 사람들이</span><span class=\"en\"><b><span class=\"grammar-hl\">As more and more people</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">알스트롬의 행동을 보게 되면서,</span><span class=\"en\"><b><span class=\"grammar-hl\">saw</span> Ahlström’s actions,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 운동은</span><span class=\"en\"><b>the movement</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">스웨덴 전역으로 퍼졌다.</span><span class=\"en\"><b>spread across Sweden.</b></span></div></div><div class=\"lec-sent-ko\">점점 더 많은 사람들이 알스트롬의 행동을 보게 되면서, 이 운동은 스웨덴 전역으로 퍼졌다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 개인의 실천이 주변 사람들에게 영향을 주어 사회적 규모의 움직임으로 확대되는 인과관계를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">As more and more people saw (현재분사): more and more(점점 더 많은)가 people을 수식함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">spread</td><td class=\"m\">퍼지다, 확산되다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이제,</span><span class=\"en\"><b>Now,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">플로깅은</span><span class=\"en\"><b>plogging</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">세계적인 운동이다,</span><span class=\"en\"><b>is a global movement,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들이 그것에 대해 이야기함에 따라</span><span class=\"en\"><b>as <span class=\"grammar-hl\">people talk about it</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">온라인과 오프라인에서</span><span class=\"en\"><b>online and offline.</b></span></div></div><div class=\"lec-sent-ko\">이제, 플로깅은 세계적인 운동인데, 사람들이 온라인과 오프라인에서 그것에 대해 이야기하기 때문이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 오늘날의 시점으로 넘어와, 이 운동이 국경을 넘어 전 세계적인 현상이 되었음을 보여주며 주제를 확장합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">people talk about it (관용표현): talk about은 &#39;~에 대해 이야기하다&#39;라는 뜻의 숙어</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">global</td><td class=\"m\">세계적인, 전 세계의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 11 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“#plogging”에 대한 빠른 검색은</span><span class=\"en\"><b>A quick search for “#plogging”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">소셜 미디어에서의</span><span class=\"en\"><b>on social media</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신에게 줄 것이다</span><span class=\"en\"><b>will <span class=\"grammar-hl\">give you</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수천 장의 사진을</span><span class=\"en\"><b><span class=\"grammar-hl\">thousands of pictures</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 동네를 청소하는 사람들의</span><span class=\"en\"><b>of <span class=\"grammar-hl\">people cleaning up their neighborhoods</span>.</b></span></div></div><div class=\"lec-sent-ko\">소셜 미디어에서 ‘#plogging’을 빠르게 검색하면 사람들이 그들의 동네를 청소하는 사진 수천 장을 볼 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 디지털 매체를 통한 플로깅의 실질적인 증거를 제시하여, 독자가 이 운동의 규모를 체감하게 만드는 예시의 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">give you thousands of pictures (5형식): give + IO(you) + DO(thousands of pictures)의 4형식 구조로, you에게 pictures를 제공한다는 의미</div><div class=\"lec-gr-item\">people cleaning up their neighborhoods (현재분사): cleaning up이 people을 수식하며, 사람들이 거리의 쓰레기를 치우고 있는 동작을 나타냄. 명사(people) + 현재분사(-ing) ≈ &#39;...하는 people&#39;</div></div>\n        ","<div class=\"lec-sent-no\">문장 12 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">쉽다</span><span class=\"en\"><b><span class=\"grammar-hl\">It’s easy</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">알기에</span><span class=\"en\"><b><span class=\"grammar-hl\">to see</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">왜 그 운동이 커지고 있는지를,</span><span class=\"en\"><b>why <span class=\"grammar-hl\">the movement is growing</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">누구나 쉽게 나갈 수 있으므로</span><span class=\"en\"><b>as anyone can easily go out</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 약간의 쓰레기를 주울 수 있으므로</span><span class=\"en\"><b>and pick up some trash.</b></span></div></div><div class=\"lec-sent-ko\">왜 이 운동이 증가하고 있는지 쉽게 알 수 있는데, 누구나 쉽게 나가서 쓰레기를 주울 수 있기 때문이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 플로깅이 전 세계적으로 확산하는 원인을 &#39;높은 접근성&#39;과 &#39;누구나 실천 가능한 쉬운 방법&#39;으로 정리하여 논리를 보강합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It’s easy to see (가주어): 진주어: It은 가주어, to see...가 진주어로 쓰인 구조</div><div class=\"lec-gr-item\">the movement is growing (현재진행): be동사(is)+-ing(growing) 형태의 현재진행 시제</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">pick up</td><td class=\"m\">줍다, (습관 등을) 익히다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 13 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러니</span><span class=\"en\"><b>So</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">왜</span><span class=\"en\"><b>why</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">시도해 보지 않는가</span><span class=\"en\"><b>don’t you <span class=\"grammar-hl\">give it a try</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분 스스로?</span><span class=\"en\"><b>yourself?</b></span></div></div><div class=\"lec-sent-ko\">그러니 여러분도 직접 한 번 시도해 보는 게 어떨까?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 마지막으로서 독자에게 직접적인 참여를 권유하며 실천을 유도하는 결론을 맺습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">give it a try (관용표현): give it a try는 &#39;~을 시도해보다&#39;라는 뜻의 숙어</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">give it a try</td><td class=\"m\">한번 시도해 보다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>인도 총리의 사례를 통해 플로깅이라는 새로운 환경 보호 활동을 소개한다.</li><li>플로깅은 조깅과 쓰레기 줍기를 결합한 스웨덴에서 시작된 운동이다.</li><li>한 개인의 작은 습관에서 출발한 이 활동은 SNS를 통해 전 세계적인 환경 운동으로 확산되었다.</li><li>누구나 쉽게 참여할 수 있다는 장점 덕분에 일상 속 실천으로 자리 잡고 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Plogging combines jogging with picking up trash to protect the environment, and it has grown into a global movement through social media.</div>\n              <div class=\"lec-final-sum-ko\">플로깅은 환경을 보호하기 위해 조깅과 쓰레기 줍기
