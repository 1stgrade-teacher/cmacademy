<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>쥬니어리딩엑스퍼트3 Unit4_Reading02 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}

.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"쥬니어리딩엑스퍼트3 Unit4_Reading02","audioDir":"reading02_audio","preview":false,"count":52,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.400em\">Unit4_Reading02\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">쥬니어리딩엑스퍼트3\u003c/div>\u003ch1>Tools Used by Soccer Referees\u003c/h1>\u003ch2>축구 심판들이 사용하는 도구들\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>축구 심판은 경기 중 \u003cb class=\"key\">호루라기\u003c/b>, 시계, 반칙 카드, 동전, 깃발 등 여러 도구를 사용한다. 각 도구는 반칙과 득점 신호, 시간 관리, 경고와 퇴장, 진영 결정, 경기장 밖 표시처럼 서로 다른 \u003cb class=\"key\">용도\u003c/b>를 담당한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Soccer referees use various tools such as whistles, watches, foul cards, coins, and flags to control the game and manage its time and rules.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 축구 심판들이 경기 중에 사용하는 도구들에 관한 글이에요. 호루라기, 시계, 반칙 카드, 동전, 깃발, 이렇게 다섯 가지 도구가 각각 무슨 역할을 하는지 차례로 정리하고 있죠. 요약하면 심판은 여러 도구로 반칙과 득점을 알리고 경기의 시간과 규칙을 관리한다는 거예요. 요지는 심판이 도구를 통해 경기를 통제한다는 것입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">축구 경기는 경기 전체를 총괄하는 주심(main referee)과 사이드라인을 담당하는 보조 심판(assistant referee)이 함께 운영한다. 심판은 규칙을 적용하고 경기 시간을 관리하며, 선수가 다치거나 규칙을 어겼을 때 경기를 멈추게 한다. 관중의 함성으로 가득한 경기장에서는 목소리만으로 신호를 전달하기 어렵기 때문에 호루라기(whistle) 같은 \u003cb class=\"key\">도구\u003c/b>가 필요하다. 옐로카드와 레드카드는 월드컵을 계기로 널리 쓰이게 된 경고·퇴장 표시 수단이고, 동전 던지기(coin toss)는 공을 먼저 차는 팀과 진영을 공정하게 정하는 장치이며, 보조 심판의 깃발(flag)은 공이 경기장 밖으로 나갔는지를 알려 주는 신호판이다. 마치 요리사가 타이머와 알람으로 요리 시간을 관리하듯, 심판도 여러 도구를 통해 경기의 \u003cb class=\"key\">시간\u003c/b>과 \u003cb class=\"key\">규칙\u003c/b>을 관리한다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식부터 짚어 볼게요. 축구 경기에는 경기 전체를 총괄하는 주심과 사이드라인을 담당하는 보조 심판이 함께 나옵니다. 심판은 규칙을 적용하고 경기 시간을 관리하면서, 선수가 다치거나 규칙을 어기면 경기를 멈추게 하죠. 관중의 함성이 가득한 경기장에서는 목소리만으로 신호를 줄 수 없기 때문에 호루라기 같은 도구가 꼭 필요해요. 옐로카드와 레드카드는 월드컵을 계기로 널리 쓰이게 되었고, 동전 던지기는 공을 먼저 차는 팀과 진영을 공정하게 정하는 장치입니다. 요리사가 타이머와 알람으로 요리 시간을 관리하듯, 심판도 여러 도구를 통해 경기의 시간과 규칙을 관리한다고 생각하면 이해가 쉬워요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>호루라기\u003csmall>도입 · 문장 1–4\u003c/small>\u003c/h4>\u003cp>글은 경기 중 심판들이 사용하는 \u003cb class=\"key\">도구\u003c/b>들을 소개하며 시작한다. 먼저 호루라기인데, 심판은 호루라기의 \u003cb class=\"key\">큰 \u003c/b>\u003cb class=\"key\">소리\u003c/b>를 이용하여 경기를 통제한다. 짧은 소리는 단순한 반칙, 더 길고 큰 소리는 심각한 반칙을 의미하고, 길고 큰 소리는 \u003cb class=\"key\">득점\u003c/b>이 있을 때도 사용된다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>두 개의 시계\u003csmall>예시 · 문장 5–7\u003c/small>\u003c/h4>\u003cp>두 번째 도구는 시계이다. 시계는 경기의 \u003cb class=\"key\">시간\u003c/b>을 재기 위해 사용된다. 대부분의 심판은 두 개의 시계를 사용하는데, 하나는 얼마나 많은 시간이 \u003cb class=\"key\">지났는지\u003c/b>를 재고 다른 하나는 부상에 소비된 시간을 잰다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>반칙 카드\u003csmall>예시 · 문장 8–9\u003c/small>\u003c/h4>\u003cp>다음은 반칙 카드이다. 옐로카드는 규칙을 어기는 선수들에게 \u003cb class=\"key\">경고\u003c/b>하기 위해 사용된다. 레드카드는 선수들에게 그들이 경기에서 \u003cb class=\"key\">퇴장\u003c/b>되었음을 알려 주는 데 사용된다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>동전 던지기\u003csmall>예시 · 문장 10–11\u003c/small>\u003c/h4>\u003cp>동전은 경기 시작 때 쓰이는 도구이다. 심판들은 경기 시작 때 \u003cb class=\"key\">동전을 \u003c/b>\u003cb class=\"key\">던져\u003c/b> 누가 공을 갖고 시작할지, 각 팀이 어느 쪽 골문을 지킬지를 \u003cb class=\"key\">결정\u003c/b>한다. 하나의 동작으로 시작 순서와 진영이 함께 정해지는 셈이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>보조 심판의 깃발\u003csmall>예시 · 문장 12–14\u003c/small>\u003c/h4>\u003cp>마지막 도구는 보조 심판들이 가지고 다니는 \u003cb class=\"key\">깃발\u003c/b>이다. 그들은 공이 경기장 밖으로 나갔거나 반칙이 있었음을 나타내기 위해 깃발을 \u003cb class=\"key\">공중으로\u003c/b> 들어 올린다. 이렇게 각 도구는 서로 다른 신호를 담당한다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 따라가 볼게요. 이 글은 심판이 사용하는 다섯 가지 도구를 차례로 소개합니다.","hl":null},{"n":4,"text":"첫 번째로 나오는 도구는 호루라기예요. 심판은 호루라기의 큰 소리를 이용해서 경기를 통제하죠. 짧은 소리는 단순한 반칙이 있었다는 표시이고, 더 길고 큰 소리는 심각한 반칙을 뜻해요. 그리고 길고 큰 소리는 득점이 나왔을 때도 사용됩니다.","hl":"f0"},{"n":5,"text":"두 번째는 시계예요. 시계는 경기의 시간을 재기 위해 사용되는데, 대부분의 심판은 두 개의 시계를 찹니다. 하나는 얼마나 많은 시간이 지났는지를 재고, 다른 하나는 부상에 소비된 시간을 재는 거예요.","hl":"f1"},{"n":6,"text":"세 번째는 반칙 카드입니다. 옐로카드는 규칙을 어기는 선수들에게 경고하기 위해 사용돼요. 레드카드는 그 선수가 경기에서 퇴장되었다는 사실을 알려 주는 신호입니다.","hl":"f2"},{"n":7,"text":"네 번째는 동전이에요. 심판들은 경기 시작 때 동전을 던져서 누가 공을 갖고 시작할지, 그리고 각 팀이 어느 쪽 골문을 지킬지를 결정합니다.","hl":"f3"},{"n":8,"text":"마지막은 깃발이에요. 보조 심판들은 깃발을 가지고 다니면서 공이 경기장 밖으로 나갔거나 반칙이 있었음을 나타내기 위해 그것을 공중으로 들어 올립니다. 이렇게 각 도구는 서로 다른 신호를 담당하고 있어요.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">분류\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 첫 문장에서 심판이 사용하는 도구들을 먼저 제시하고, 이어서 호루라기·시계·반칙 카드·동전·깃발을 차례로 설명하는 \u003cb class=\"key\">분류\u003c/b> 구조이다. 중심 내용이 글의 앞부분에 나오고 항목별 세부 설명이 뒤에 붙으므로 \u003cb class=\"key\">두괄식\u003c/b>이라고 볼 수 있다. 각 항목은 도구의 이름과 그 도구가 쓰이는 \u003cb class=\"key\">용도\u003c/b>를 짝지어 제시하는 방식으로 전개된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Here are (1)\u003c/b>\u003cspan>도구 목록 제시(도입)\u003c/span>\u003cb>also (4)\u003c/b>\u003cspan>내용 추가\u003c/span>\u003cb>Most (6)\u003c/b>\u003cspan>일반적 경향 제시\u003c/span>\u003cb>the other (7)\u003c/b>\u003cspan>앞 항목과의 대조·병렬\u003c/span>\u003cb>This (11)\u003c/b>\u003cspan>앞 문장 내용 지시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">tools used by soccer referees during a game\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">whistles\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">watches\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">foul cards\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">coins\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">flags\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"이 글의 전개 방식은 분류예요. 첫 문장에서 심판이 사용하는 도구들을 먼저 제시하고, 그다음 호루라기, 시계, 반칙 카드, 동전, 깃발을 차례로 설명하죠. 중심 내용이 앞부분에 나오고 세부 설명이 뒤따르는 두괄식 구조입니다. 그래서 첫 문장만 읽어도 이 글이 무엇을 말하는지 바로 알 수 있어요.","hl":"ty"},{"n":10,"text":"신호어도 눈여겨보세요. 첫 문장의 Here are라는 표현은 도구 목록을 제시하는 신호이고, 네 번째 문장의 also는 앞 내용에 정보를 더한다는 표시예요. 여섯 번째 문장의 Most는 일반적인 경향을 말해 주고, 일곱 번째 문장의 the other는 앞에서 말한 하나와 짝을 이루는 다른 하나를 가리키죠. 또 This decides처럼 앞 문장의 내용을 받아 이어 가는 지시어도 흐름을 잡는 데 도움이 됩니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>tool\u003c/b>\u003cem>명사\u003c/em>\u003cspan>도구\u003c/span>\u003c/div>\u003cdiv>\u003cb>referee\u003c/b>\u003cem>명사\u003c/em>\u003cspan>심판\u003c/span>\u003c/div>\u003cdiv>\u003cb>during\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~동안에\u003c/span>\u003c/div>\u003cdiv>\u003cb>whistle\u003c/b>\u003cem>명사\u003c/em>\u003cspan>호루라기\u003c/span>\u003c/div>\u003cdiv>\u003cb>loud\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>(소리가) 큰\u003c/span>\u003c/div>\u003cdiv>\u003cb>control\u003c/b>\u003cem>동사\u003c/em>\u003cspan>통제하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>be used to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~하는 데 사용되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>simple\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>단순한\u003c/span>\u003c/div>\u003cdiv>\u003cb>foul\u003c/b>\u003cem>명사\u003c/em>\u003cspan>반칙\u003c/span>\u003c/div>\u003cdiv>\u003cb>serious\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>심각한\u003c/span>\u003c/div>\u003cdiv>\u003cb>mean\u003c/b>\u003cem>동사\u003c/em>\u003cspan>의미하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>score\u003c/b>\u003cem>동사\u003c/em>\u003cspan>득점하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>keep the time\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>시간을 재다\u003c/span>\u003c/div>\u003cdiv>\u003cb>most\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>대부분의\u003c/span>\u003c/div>\u003cdiv>\u003cb>keep track of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 계속 파악하다, 재다\u003c/span>\u003c/div>\u003cdiv>\u003cb>pass\u003c/b>\u003cem>동사\u003c/em>\u003cspan>지나가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>the other\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>다른 하나\u003c/span>\u003c/div>\u003cdiv>\u003cb>spend\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(시간을) 쓰다\u003c/span>\u003c/div>\u003cdiv>\u003cb>injury\u003c/b>\u003cem>명사\u003c/em>\u003cspan>부상\u003c/span>\u003c/div>\u003cdiv>\u003cb>warn\u003c/b>\u003cem>동사\u003c/em>\u003cspan>경고하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>break the rules\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>규칙을 어기다\u003c/span>\u003c/div>\u003cdiv>\u003cb>throw out\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>퇴장시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>flip\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(동전을) 던지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>at the start of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~의 시작에\u003c/span>\u003c/div>\u003cdiv>\u003cb>decide\u003c/b>\u003cem>동사\u003c/em>\u003cspan>결정하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>defend\u003c/b>\u003cem>동사\u003c/em>\u003cspan>지키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>assistant referee\u003c/b>\u003cem>명사\u003c/em>\u003cspan>보조 심판\u003c/span>\u003c/div>\u003cdiv>\u003cb>carry\u003c/b>\u003cem>동사\u003c/em>\u003cspan>가지고 다니다\u003c/span>\u003c/div>\u003cdiv>\u003cb>raise\u003c/b>\u003cem>동사\u003c/em>\u003cspan>들어 올리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>off the field\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>경기장 밖으로\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"단어도 몇 개만 짚어 볼게요. keep track of는 시간이 얼마나 지났는지 계속 파악한다는 뜻이고, throw out은 선수를 경기에서 퇴장시킨다는 의미예요. flip a coin은 동전을 던져 앞뒤를 정하는 동작을 말합니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">control\u003c/b>\u003cspan class=\"m\">통제하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">manage\u003c/span>\u003cspan class=\"s\">regulate\u003c/span>\u003cspan class=\"s\">govern\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">neglect\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">serious\u003c/b>\u003cspan class=\"m\">심각한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">severe\u003c/span>\u003cspan class=\"s\">grave\u003c/span>\u003cspan class=\"s\">critical\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">trivial\u003c/span>\u003cspan class=\"a\">minor\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">simple\u003c/b>\u003cspan class=\"m\">단순한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">plain\u003c/span>\u003cspan class=\"s\">basic\u003c/span>\u003cspan class=\"s\">easy\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">complex\u003c/span>\u003cspan class=\"a\">complicated\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">warn\u003c/b>\u003cspan class=\"m\">경고하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">alert\u003c/span>\u003cspan class=\"s\">caution\u003c/span>\u003cspan class=\"s\">notify\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">reassure\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">decide\u003c/b>\u003cspan class=\"m\">결정하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">determine\u003c/span>\u003cspan class=\"s\">settle\u003c/span>\u003cspan class=\"s\">resolve\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hesitate\u003c/span>\u003cspan class=\"a\">waver\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">raise\u003c/b>\u003cspan class=\"m\">들어 올리다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">lift\u003c/span>\u003cspan class=\"s\">elevate\u003c/span>\u003cspan class=\"s\">hoist\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">lower\u003c/span>\u003cspan class=\"a\">drop\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">break the rules\u003c/b>\u003cspan class=\"m\">규칙을 어기다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">violate the rules\u003c/span>\u003cspan class=\"s\">go against the rules\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">follow the rules\u003c/span>\u003cspan class=\"a\">obey the rules\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">loud\u003c/b>\u003cspan class=\"m\">(소리가) 큰\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">noisy\u003c/span>\u003cspan class=\"s\">deafening\u003c/span>\u003cspan class=\"s\">booming\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">quiet\u003c/span>\u003cspan class=\"a\">soft\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어도 함께 정리해요. control은 manage나 regulate로 바꿔 쓸 수 있고, serious는 severe나 grave와 가까워요. simple은 basic이나 plain의 동의어이고 그 반대말은 complex나 complicated입니다. warn은 alert나 caution으로 바꿀 수 있으며, raise는 lift나 elevate의 동의어이고 반대말은 lower나 drop이에요. break the rules는 violate the rules라고도 하고 그 반대는 follow the rules입니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다음은 몇 가지 도구들이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Here \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">some \u003c/span>\u003cspan class=\"tgt\">tools\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">축구 심판들에 의해 사용되는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">used \u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">soccer \u003c/span>\u003cspan class=\"tgt\">referees\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">경기 중에\u003c/span>\u003cspan class=\"en\">during a game:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">호루라기\u003c/span>\u003cspan class=\"en\">Whistles\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">심판들은 큰 소리를 이용한다\u003c/span>\u003cspan class=\"en\">Referees use the loud sound\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">호루라기의\u003c/span>\u003cspan class=\"en\">of a whistle\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">경기를 통제하기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">control \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">game\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">다음은 축구 심판들에 의해 경기 중에 사용되는 몇 가지 도구들이다. 호루라기. 심판들은 호루라기의 큰 소리를 이용하여 경기를 통제한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글의 도입으로, 경기 중 축구 심판이 사용하는 도구들을 소개하고 첫 도구인 \u003cb class=\"key\">호루라기\u003c/b>를 제시한다. 콜론 뒤의 \u003cb class=\"key\">Whistles\u003c/b>는 소제목이고, 이어지는 문장이 그 도구의 쓰임을 설명한다. used by ~는 ~에 의해 사용되는이라는 \u003cb class=\"key\">과거분사\u003c/b> 수식이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">Here are 구문(유도부사 도치)\u003c/span> : Here + be동사 + 주어 : \"여기에 몇 가지 도구들이 있다/다음은 몇 가지 도구들이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사구의 형용사적 수식\u003c/span> : 명사 + [used by ~ (과거분사구)] : \"축구 심판들에 의해 사용되는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : [to control + 목적어] (to부정사구/목적) : \"경기를 통제하기 위해\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"Here are some tools, 다음은 몇 가지 도구들이다. used by soccer referees, 축구 심판들에 의해 사용되는. during a game, 경기 중에. Whistles, 호루라기. Referees use the loud sound, 심판들은 큰 소리를 이용한다. of a whistle, 호루라기의. to control the game, 경기를 통제하기 위해. 이 문장 전체를 해석하면, 다음은 축구 심판들에 의해 경기 중에 사용되는 몇 가지 도구들이다. 호루라기. 심판들은 호루라기의 큰 소리를 이용하여 경기를 통제한다.","hl":"m"},{"n":14,"text":"이 문장은 글의 도입이에요. 경기 중 축구 심판들이 사용하는 도구들을 소개하고, 첫 번째 도구로 호루라기를 내세우죠. 콜론 뒤의 Whistles는 소제목이고, 이어지는 내용이 호루라기의 쓰임을 설명해요.","hl":"mn"},{"n":15,"text":"첫 번째로 Here are some tools는 Here가 앞에 나와 주어와 be동사가 도치된 표현이에요. 여기에 몇 가지 도구들이 있다는 뜻이죠. 두 번째로 used by soccer referees에서 used는 과거분사로, 앞의 tools를 뒤에서 꾸며요. tools가 사용되는 대상이므로 수동 관계를 나타내는 과거분사를 쓴 거예요. 세 번째로 to control the game은 경기를 통제하기 위해라는 목적을 나타내는 to부정사구예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">짧은 호루라기 소리는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">A \u003c/span>\u003cspan class=\"tgt\">short \u003c/span>\u003cspan class=\"tgt\">whistle \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사용된다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">used\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나타내기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">show\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단순한 반칙이 있었다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">simple \u003c/span>\u003cspan class=\"tgt\">foul\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">짧은 호루라기 소리는 단순한 반칙이 있었음을 나타내는 데 사용된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 짧은 호루라기 소리의 \u003cb class=\"key\">신호\u003c/b>가 단순한 반칙을 알린다는 뜻을 전달한다. 앞 문장에서 호루라기의 쓰임을 소개한 뒤, 소리의 길이에 따라 \u003cb class=\"key\">반칙\u003c/b>의 심각도를 구분하는 흐름을 만든다. to show는 나타내기 위해라는 \u003cb class=\"key\">목적\u003c/b>을 나타낸다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태(be동사 + 과거분사)\u003c/span> : [주어] + be동사 + [과거분사] (+ by 행위자) : \"짧은 호루라기 소리는 사용된다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : [to show + 목적어] (to부정사구/목적) : \"나타내기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">There is/are 구문(유도부사)\u003c/span> : There + be동사 + [주어] : \"단순한 반칙이 있었다\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"A short whistle, 짧은 호루라기 소리는. is used, 사용된다. to show, 나타내기 위해. there was a simple foul, 단순한 반칙이 있었다는 것을. 이 문장 전체를 해석하면, 짧은 호루라기 소리는 단순한 반칙이 있었음을 나타내는 데 사용된다.","hl":"m"},{"n":17,"text":"이 문장은 짧은 호루라기 소리의 신호가 단순한 반칙을 알린다는 뜻이에요. 호루라기 소리의 길이에 따라 반칙의 심각도를 구분하는 흐름을 만들어 주죠. to show는 나타내기 위해라는 목적을 나타내요.","hl":"mn"},{"n":18,"text":"첫 번째로 A short whistle is used는 주어가 사용되는 대상이어서 be동사와 과거분사로 만든 수동태예요. 두 번째로 to show는 나타내기 위해라는 목적을 나타내는 to부정사구이고요. 세 번째로 there was a simple foul은 유도부사 there를 써서 단순한 반칙이 있었다는 존재를 표현한 There is 구문이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 길고 큰 호루라기 소리는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">A \u003c/span>\u003cspan class=\"tgt\">longer, \u003c/span>\u003cspan class=\"tgt\">louder \u003c/span>\u003cspan class=\"tgt\">whistle\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">의미한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">means \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">심각한 반칙이 있었음을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">serious \u003c/span>\u003cspan class=\"tgt\">foul\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">더 길고 큰 호루라기 소리는 심각한 반칙이 있었음을 의미한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 호루라기 소리가 길고 클수록 더 \u003cb class=\"key\">심각한 \u003c/b>\u003cb class=\"key\">반칙\u003c/b>을 알린다는 내용을 담고 있다. 앞 문장의 짧은 소리와 대조하며 소리의 길이와 크기에 따라 \u003cb class=\"key\">신호\u003c/b>가 달라짐을 보여 준다. means 뒤에는 that이 생략된 \u003cb class=\"key\">명사절\u003c/b>이 목적어로 이어진다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">비교급 형용사의 병렬\u003c/span> : longer, louder + 명사 : \"더 길고 더 큰 호루라기 소리\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">목적어로 쓰인 명사절(that 생략)\u003c/span> : means + [there was ... (명사절/목적어)] : \"심각한 반칙이 있었다는 것을 의미한다\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"A longer, louder whistle, 더 길고 큰 호루라기 소리는. means, 의미한다. there was a serious foul, 심각한 반칙이 있었음을. 이 문장 전체를 해석하면, 더 길고 큰 호루라기 소리는 심각한 반칙이 있었음을 의미한다.","hl":"m"},{"n":20,"text":"이 문장은 호루라기 소리가 길고 클수록 더 심각한 반칙을 알린다는 내용이에요. 앞 문장의 짧은 소리와 대조하면서 소리의 길이와 크기에 따라 신호가 달라진다는 걸 보여 주죠. means 뒤에는 that이 생략된 명사절이 목적어로 이어져요.","hl":"mn"},{"n":21,"text":"첫 번째로 A longer, louder whistle에서 longer와 louder는 각각 비교급 형태로, 앞에 나온 short whistle과 대조되는 소리의 정도를 보여 줘요. 두 번째로 means there was a serious foul은 means의 목적어로 절이 온 구조예요. 접속사 that이 생략되어 there was가 바로 이어지고, 그 안에는 유도부사 there를 쓰는 There is 구문이 들어 있죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">길고 큰 호루라기 소리는\u003c/span>\u003cspan class=\"en\">Long, loud whistles\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또한 사용된다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">also \u003c/span>\u003cspan class=\"tgt\">used\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">득점이 있을 때\u003c/span>\u003cspan class=\"en\">when a goal \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">scored\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">길고 큰 호루라기 소리는 득점이 있을 때도 사용된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 길고 큰 호루라기 소리가 심각한 반칙뿐 아니라 \u003cb class=\"key\">득점\u003c/b> 상황에서도 쓰인다는 점을 알려 줍니다. 앞 문장에서 심각한 반칙을 알리는 용도를 말했으므로, \u003cb class=\"key\">also\u003c/b>가 또 하나의 용도를 추가하는 흐름입니다. 핵심은 long, loud whistles와 a goal is scored가 \u003cb class=\"key\">수동태\u003c/b>로 연결된다는 점입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태(현재시제)\u003c/span> : [주어] + are + p.p. : \"또한 사용된다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태(현재시제)\u003c/span> : [주어] + is + p.p. : \"득점이 있다, 골이 들어간다\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"Long, loud whistles, 길고 큰 호루라기 소리는. are also used, 또한 사용된다. when a goal is scored, 득점이 있을 때. 이 문장 전체를 해석하면, 길고 큰 호루라기 소리는 득점이 있을 때도 사용된다.","hl":"m"},{"n":23,"text":"이 문장은 길고 큰 호루라기 소리가 심각한 반칙뿐 아니라 득점 상황에서도 쓰인다는 점을 알려 줘요. 앞 문장에서 심각한 반칙을 알리는 용도를 말했으니, also가 또 하나의 용도를 추가하는 흐름이에요. 핵심은 long, loud whistles와 a goal is scored가 수동태로 연결된다는 점이에요.","hl":"mn"},{"n":24,"text":"첫 번째, are also used는 수동태예요. 주어 Long, loud whistles가 사용하는 주체가 아니라 사용되는 대상이기 때문에 are used를 써요. 두 번째, is scored도 수동태예요. when절 안에서 a goal이 득점되는 대상이므로 is scored로 표현해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시계\u003c/span>\u003cspan class=\"en\">Watches\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시계는 사용된다\u003c/span>\u003cspan class=\"en\">A watch \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">used\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">경기의 시간을 재기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">keep\u003c/span> the time of a game.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">시계는 경기의 시간을 재기 위해 사용된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 축구 심판이 사용하는 또 다른 도구로 \u003cb class=\"key\">시계\u003c/b>를 소개하고, 시계의 기능이 경기 \u003cb class=\"key\">시간\u003c/b>을 재는 것임을 말합니다. A watch is used to keep은 시계는 하기 위해 사용된다라는 \u003cb class=\"key\">수동태\u003c/b> 표현으로 도구의 용도를 자연스럽게 제시합니다. 뒤 문장에서 두 개의 시계를 사용하는 이유를 설명할 수 있게 흐름을 열어 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태(현재시제)\u003c/span> : [주어] + is + p.p. : \"사용된다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : [주어] + be used + to + [동사원형] : \"시간을 재기 위해\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"Watches, 시계. A watch is used, 시계는 사용된다. to keep the time of a game, 경기의 시간을 재기 위해. 이 문장 전체를 해석하면, 시계는 경기의 시간을 재기 위해 사용된다.","hl":"m"},{"n":26,"text":"이 문장은 축구 심판이 사용하는 또 다른 도구로 시계를 소개하고, 시계의 기능이 경기 시간을 재는 것임을 말해요. A watch is used to keep은 시계는 하기 위해 사용된다라는 수동태 표현으로 도구의 용도를 자연스럽게 제시해요. 뒤 문장에서 두 개의 시계를 사용하는 이유를 설명할 수 있게 흐름을 열어 줘요.","hl":"mn"},{"n":27,"text":"첫 번째, is used는 수동태예요. A watch가 사용하는 주체가 아니라 사용되는 대상이기 때문에 is used를 써요. 두 번째, to keep은 목적의 to부정사예요. 시계가 사용되는 목적을 나타내므로 to keep을 써요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대부분의 심판들은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Most \u003c/span>\u003cspan class=\"tgt\">referees\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">두 개의 시계를 사용한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">use\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">two \u003c/span>\u003cspan class=\"tgt\">watches\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">대부분의 심판들은 두 개의 시계를 사용한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 대부분의 심판이 \u003cb class=\"key\">두 \u003c/b>\u003cb class=\"key\">개\u003c/b>의 시계를 사용한다는 사실을 말하며, 바로 뒤에서 각 시계의 역할을 나누어 설명하는 \u003cb class=\"key\">연결\u003c/b> 역할을 합니다. Most는 \u003cb class=\"key\">대부분\u003c/b>의라는 뜻으로 모든 심판이 아닌 다수임을 강조해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">most + 복수명사\u003c/span> : Most + [복수명사] : \"대부분의 심판들은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재시제(일반적 사실)\u003c/span> : [주어] + 동사원형 : \"사용한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">복수 명사\u003c/span> : [숫자] + [복수명사] : \"두 개의 시계\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"Most referees, 대부분의 심판들은. use two watches, 두 개의 시계를 사용한다. 이 문장 전체를 해석하면, 대부분의 심판들은 두 개의 시계를 사용한다.","hl":"m"},{"n":29,"text":"이 문장은 대부분의 심판이 두 개의 시계를 사용한다는 사실을 말하며, 바로 뒤에서 각 시계의 역할을 나누어 설명하는 연결 역할을 해요. Most는 대부분의라는 뜻으로 모든 심판이 아닌 다수임을 강조해요.","hl":"mn"},{"n":30,"text":"첫 번째, Most referees에서 most는 관사 없이 복수명사 앞에서 대부분의라는 한정사로 쓰여요. 두 번째, use는 대부분의 심판이 두 시계를 사용한다는 일반적 사실을 나타내는 현재시제예요. 세 번째, two watches에서 two 뒤의 셀 수 있는 명사 watch는 복수형 watches로 써요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하나는 ~을 재고\u003c/span>\u003cspan class=\"en\">One keeps track of\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">얼마나 많은 시간이 지났는지를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">much \u003c/span>\u003cspan class=\"tgt\">time \u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">passed\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 다른 하나는 ~을 잰다\u003c/span>\u003cspan class=\"en\">and the other keeps track of\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">부상에 소비된 시간을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">time \u003c/span>\u003cspan class=\"tgt\">spent \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">injuries\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하나는 얼마나 많은 시간이 지났는지를 재고 다른 하나는 부상에 소비된 시간을 잰다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 심판이 시계를 두 개 쓰는 이유를 알려 주는 문장이에요. how much time has passed는 '얼마나 많은 시간이 지났는지'라는 \u003cb class=\"key\">간접의문문\u003c/b>으로 keep track of의 목적어 역할을 하고, 경기 시간과 부상 시간을 각각 따로 잰다는 \u003cb class=\"key\">대조\u003c/b> 구조로 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">간접의문문(의문사절이 전치사의 목적어)\u003c/span> : keep track of + [how much time has passed (의문사절/목적어)] : \"얼마나 많은 시간이 지났는지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사의 형용사적 용법(후치수식)\u003c/span> : [명사 time] + [spent for injuries (과거분사구)] : \"부상에 소비된 시간\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"One keeps track of, 하나는 ~을 재고. how much time has passed, 얼마나 많은 시간이 지났는지를. and the other keeps track of, 그리고 다른 하나는 ~을 잰다. time spent for injuries, 부상에 소비된 시간을. 이 문장 전체를 해석하면, 하나는 얼마나 많은 시간이 지났는지를 재고 다른 하나는 부상에 소비된 시간을 잰다.","hl":"m"},{"n":32,"text":"이 문장은 심판이 시계를 두 개 쓰는 이유를 알려 줘요. 경기 시간과 부상으로 소비된 시간을 각각 따로 재기 위해서라는 대조의 흐름이죠. how much time has passed는 간접의문문이라서 '얼마나 많은 시간이 지났는지'로 자연스럽게 해석해 주세요.","hl":"mn"},{"n":33,"text":"첫 번째로, how much time has passed는 간접의문문이에요. 의문사가 있지만 주어와 동사 순서는 평서문 그대로이고, 전치사 of의 목적어 자리에 들어가 있죠. 두 번째로, time spent for injuries에서 time과 spend는 수동 관계라서 과거분사 spent가 명사 뒤에서 후치수식해요. 그래서 '부상에 소비된 시간'으로 해석합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">반칙 카드\u003c/span>\u003cspan class=\"en\">Foul Cards\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">옐로카드는 사용된다\u003c/span>\u003cspan class=\"en\">Yellow cards \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">used \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">선수들에게 경고하기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">warn\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">players \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">규칙을 어기는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">break \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">rules\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">옐로카드는 규칙을 어기는 선수들에게 경고하기 위해 사용된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 옐로카드가 누구에게 쓰이는지를 알려 주는 문장이에요. \u003cb class=\"key\">수동태\u003c/b>로 카드가 '사용되는' 대상임을 먼저 밝히고, \u003cb class=\"key\">관계사절\u003c/b>로 규칙을 어기는 선수라는 대상을 콕 집어 좁혀 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태 + to부정사의 부사적 용법(목적)\u003c/span> : [주어 Yellow cards] + be used + [to warn (to부정사구/목적)] : \"경고하기 위해 사용된다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 who\u003c/span> : [선행사 players] + [who break the rules (주격 관계사절)] : \"규칙을 어기는 선수들\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"Foul Cards, 반칙 카드. Yellow cards are used, 옐로카드는 사용된다. to warn players, 선수들에게 경고하기 위해. who break the rules, 규칙을 어기는. 이 문장 전체를 해석하면, 옐로카드는 규칙을 어기는 선수들에게 경고하기 위해 사용된다.","hl":"m"},{"n":35,"text":"이 문장은 옐로카드가 어떤 역할을 하는지 알려 줘요. 수동태로 카드가 사용되는 대상임을 먼저 밝히고, 관계사절로 규칙을 어기는 선수라는 대상을 콕 집어 주죠. 그래서 '규칙을 어기는 선수들에게 경고하기 위해 사용된다'로 정리됩니다.","hl":"mn"},{"n":36,"text":"첫 번째로, 주어 Yellow cards는 스스로 경고하는 게 아니라 사용되는 대상이라서 수동태 are used를 써요. 뒤에 오는 to warn은 목적을 나타내는 to부정사고요. 두 번째로, players who break the rules에서 who는 주격 관계대명사예요. 앞에 있는 players가 선행사가 되고, who가 관계사절의 주어 역할을 하죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">레드카드는 사용된다\u003c/span>\u003cspan class=\"en\">Red cards \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">used \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">선수들에게 알려 주기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">tell\u003c/span> players\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 퇴장당했음을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">they've \u003c/span>\u003cspan class=\"tgt\">been \u003c/span>\u003cspan class=\"tgt\">thrown \u003c/span>\u003cspan class=\"tgt\">out \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">경기에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">game\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">레드카드는 선수들에게 그들이 경기에서 퇴장되었음을 알려 주는 데 사용된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 레드카드의 의미를 알려 주는 문장이에요. \u003cb class=\"key\">수동태\u003c/b>로 카드가 사용되는 대상임을 밝히고, that절 안의 \u003cb class=\"key\">현재완료 \u003c/b>\u003cb class=\"key\">수동태\u003c/b>로 퇴장이 이미 끝난 결과 상태임을 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태 + to부정사의 부사적 용법(목적)\u003c/span> : [주어 Red cards] + be used + [to tell (to부정사구/목적)] : \"알려 주기 위해 사용된다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 that의 명사절(목적어) + 현재완료 수동태\u003c/span> : tell + [목적어 players] + [that절 (명사절/목적어)] : \"그들이 경기에서 퇴장당했음을\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"Red cards are used, 레드카드는 사용된다. to tell players, 선수들에게 알려 주기 위해. that they've been thrown out, 그들이 퇴장당했음을. of the game, 경기에서. 이 문장 전체를 해석하면, 레드카드는 선수들에게 그들이 경기에서 퇴장되었음을 알려 주는 데 사용된다.","hl":"m"},{"n":38,"text":"이 문장은 레드카드가 어떤 의미인지 알려 줘요. 카드가 사용되는 대상임을 수동태로 밝히고, 그 내용으로 선수가 이미 경기에서 퇴장당했다는 결과 상태를 전달하죠. 그래서 '경기에서 퇴장되었음을 알려 주는 데 사용된다'로 해석합니다.","hl":"mn"},{"n":39,"text":"첫 번째로, are used는 카드가 사용되는 대상이라는 수동태예요. to tell은 알려 주기 위해라는 목적의 to부정사고요. 두 번째로, tell은 목적어 다음에 that절이 오는 구조라서 that절이 명사절 목적어 역할을 해요. 그 안의 have been thrown out은 현재완료 수동태로, 이미 퇴장당한 결과 상태를 보여 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">동전\u003c/span>\u003cspan class=\"en\">Coins\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">심판들은 동전을 던진다\u003c/span>\u003cspan class=\"en\">Referees \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">flip \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">coin\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">경기 시작 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">start \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">game\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">심판들은 경기 시작 때 동전을 던진다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 소제목 Coins 아래에서 동전이 언제 쓰이는지 소개하는 문장입니다. \u003cb class=\"key\">경기 \u003c/b>\u003cb class=\"key\">시작\u003c/b>에 심판이 동전을 던진다는 사실을 제시하고, 바로 다음 문장에서 그 동전 던지기가 무엇을 정하는지 이어집니다. flip은 동전을 손으로 튕겨 공중에 올려 앞뒷면을 가리는 동작을 말합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">완전타동사(타동사 + 목적어)\u003c/span> : flip [타동사] + a coin [목적어] : \"동전을 던진다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 용법(때)\u003c/span> : at the start of + [명사] : \"경기 시작 때\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"Coins, 동전. Referees flip a coin, 심판들은 동전을 던진다. at the start of the game, 경기 시작 때. 이 문장 전체를 해석하면, 심판들은 경기 시작 때 동전을 던진다.","hl":"m"},{"n":41,"text":"이 문장은 동전이라는 도구가 언제 쓰이는지 알려 줘요. 심판이 경기 시작 때 동전을 던진다고 했죠. 다음 문장에서 그 동전 던지기가 무엇을 정하는지 이어집니다.","hl":"mn"},{"n":42,"text":"먼저 flip a coin을 보세요. flip은 타동사라서 목적어 a coin이 전치사 없이 바로 와요. 목적어를 그냥 데리고 오는 동사라고 기억하면 됩니다. 그다음 at the start of the game은 '경기 시작에'라는 시간을 나타내는 전치사구예요. 문장 끝에서 언제인지를 알려 주는 부사구 역할을 한답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은 결정한다\u003c/span>\u003cspan class=\"en\">This decides\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">누가 공을 갖고 시작할지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">starts \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">ball\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 어느 골문을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">which \u003c/span>\u003cspan class=\"tgt\">goal \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">각 팀이 지킬 것인지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">each \u003c/span>\u003cspan class=\"tgt\">team \u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">defend\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것은 누가 공을 갖고 시작할지와 각 팀이 어느 쪽 골문을 지킬 것인지를 결정한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 \u003cb class=\"key\">동전 \u003c/b>\u003cb class=\"key\">던지기\u003c/b> 결과가 무엇을 정하는지 설명하는 문장입니다. 두 개의 \u003cb class=\"key\">간접의문문\u003c/b>이 and로 연결되어, 결정되는 내용 두 가지를 나란히 제시합니다. 의문사가 이끄는 절이 동사 decide의 목적어로 쓰인 구조입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">간접의문문(의문사가 주어인 경우)\u003c/span> : decide + [who + 동사 + ...] : \"누가 공을 갖고 시작할지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 and에 의한 명사절 병렬\u003c/span> : [who절] + and + [which절] : \"그리고 어느 골문을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">간접의문문(의문사 + 주어 + 동사 어순)\u003c/span> : decide + [which + 명사 + 주어 + 동사] : \"각 팀이 어느 골문을 지킬지\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"This decides, 이것은 결정한다. who starts with the ball, 누가 공을 갖고 시작할지. and which goal, 그리고 어느 골문을. each team will defend, 각 팀이 지킬 것인지. 이 문장 전체를 해석하면, 이것은 누가 공을 갖고 시작할지와 각 팀이 어느 쪽 골문을 지킬 것인지를 결정한다.","hl":"m"},{"n":44,"text":"앞에서 동전을 던진다고 했죠. 이 문장은 그 동전 던지기가 무엇을 정하는지 알려 줘요. 하나는 누가 공을 갖고 시작하는지이고, 다른 하나는 각 팀이 어느 골문을 지키는지예요.","hl":"mn"},{"n":45,"text":"첫 번째로 who starts with the ball을 보세요. who가 간접의문문 안에서 주어 역할을 해요. 의문사가 주어일 때는 who 다음에 바로 동사 starts가 오고 do나 does는 쓰지 않아요. 두 번째로 which goal each team will defend는 의문사 which가 goal을 꾸미는 의문형용사로 쓰인 경우예요. 간접의문문은 평서문 어순을 따르기 때문에 주어 each team 다음에 동사 will defend가 온다는 점이 핵심이에요. 세 번째로 and가 decide의 목적어인 두 명사절을 나란히 연결하고 있다는 것도 챙겨 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">깃발\u003c/span>\u003cspan class=\"en\">Flags\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보조 심판들은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Assistant \u003c/span>\u003cspan class=\"tgt\">referees \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">깃발을 가지고 다닌다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">carry \u003c/span>\u003cspan class=\"tgt\">flags\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">보조 심판들은 깃발을 가지고 다닌다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 소제목 Flags 아래에서 깃발을 사용하는 주체가 누구인지 밝히는 문장입니다. 주어는 Assistant referees, 즉 \u003cb class=\"key\">보조 \u003c/b>\u003cb class=\"key\">심판\u003c/b>이고 carry는 '가지고 다니다'라는 뜻입니다. 다음 문장에서 그들이 깃발을 어떻게 사용하는지 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주어-동사 수 일치(복수 주어 + 동사원형)\u003c/span> : [복수 주어 Assistant referees] + [동사원형 carry] + [목적어 flags] : \"보조 심판들은 깃발을 가지고 다닌다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">완전타동사(carry + 목적어)\u003c/span> : carry [타동사] + flags [목적어] : \"깃발을 가지고 다닌다\"\u003c/div>\u003c/div>","segs":[{"n":46,"text":"Flags, 깃발. Assistant referees, 보조 심판들은. carry flags, 깃발을 가지고 다닌다. 이 문장 전체를 해석하면, 보조 심판들은 깃발을 가지고 다닌다.","hl":"m"},{"n":47,"text":"이 문장은 소제목 Flags에 이어서 깃발을 누가 사용하는지 알려 줘요. 주인공은 보조 심판이죠. 다음 문장에서는 그들이 깃발을 어떻게 사용하는지 나옵니다.","hl":"mn"},{"n":48,"text":"첫 번째로 주어 Assistant referees가 복수라는 점을 보세요. 그래서 동사가 carries가 아니라 동사원형 carry로 쓰였어요. 주어와 동사의 수를 맞춰 주는 것이 수 일치랍니다. 두 번째로 carry는 타동사라서 뒤에 목적어 flags가 바로 와요. '깃발을 가지고 다니다'라는 뜻으로 익혀 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 그것들을 들어 올린다\u003c/span>\u003cspan class=\"en\">They raise them\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공중으로\u003c/span>\u003cspan class=\"en\">in the air\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나타내기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">show\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공이 경기장 밖으로 나갔다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">ball \u003c/span>\u003cspan class=\"tgt\">went \u003c/span>\u003cspan class=\"tgt\">off \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">field\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또는 반칙이 있었다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">foul\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 공이 경기장 밖으로 나갔거나 반칙이 있었음을 나타내기 위해 그것들을 공중으로 들어 올린다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 보조 심판이 깃발을 들어 올리는 이유를 설명해요. 깃발을 드는 행동은 \u003cb class=\"key\">공이 \u003c/b>\u003cb class=\"key\">경기장 \u003c/b>\u003cb class=\"key\">밖으로 \u003c/b>\u003cb class=\"key\">나갔음\u003c/b>이나 \u003cb class=\"key\">반칙\u003c/b>을 알리는 \u003cb class=\"key\">신호\u003c/b>이며, 경기 상황을 분명하게 전달하려는 의도가 담겨 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : raise [목적어] + to show (to부정사구/목적) : \"나타내기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 명사절(show의 목적어)\u003c/span> : show + that + [주어 + 동사] : \"공이 경기장 밖으로 나갔다는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">that절의 병렬과 there be 구문\u003c/span> : that + [절] + or + that + there was + [명사] : \"또는 반칙이 있었다는 것을\"\u003c/div>\u003c/div>","segs":[{"n":49,"text":"They raise them, 그들은 그것들을 들어 올린다. in the air, 공중으로. to show, 나타내기 위해. that the ball went off the field, 공이 경기장 밖으로 나갔다는 것을. or that there was a foul, 또는 반칙이 있었다는 것을. 이 문장 전체를 해석하면, 그들은 공이 경기장 밖으로 나갔거나 반칙이 있었음을 나타내기 위해 그것들을 공중으로 들어 올린다.","hl":"m"},{"n":50,"text":"이 문장은 보조 심판이 왜 깃발을 공중으로 들어 올리는지 설명해요. 깃발을 드는 행동은 공이 경기장 밖으로 나갔음이나 반칙이 있었음을 알려 주는 신호예요. 그래서 선수와 관중이 경기 상황을 바로 알아차릴 수 있게 도와주죠.","hl":"mn"},{"n":51,"text":"첫 번째로 to show는 깃발을 들어 올리는 목적을 나타내는 to부정사의 부사적 용법이에요. 두 번째로 that the ball went off the field에서 that은 show의 목적어 역할을 하는 명사절을 이끌고, 그 안에는 주어와 동사가 있는 완전한 절이 들어 있어요. 세 번째로 or that there was a foul에서는 or로 두 번째 that절을 연결해 목적어를 병렬하고, there was는 there be 구문으로 '~이 있었다'를 뜻해요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>축구 심판은 경기 중 \u003cb class=\"key\">호루라기\u003c/b>, 시계, 반칙 카드, 동전, 깃발과 같은 도구를 사용한다.\u003c/li>\u003cli>호루라기 소리의 길이와 세기에 따라 단순한 반칙, 심각한 반칙, \u003cb class=\"key\">득점\u003c/b>을 구분해 알린다.\u003c/li>\u003cli>심판은 두 개의 시계로 경기 시간과 부상에 소비된 시간을 각각 \u003cb class=\"key\">측정\u003c/b>한다.\u003c/li>\u003cli>옐로카드는 \u003cb class=\"key\">경고\u003c/b>, 레드카드는 퇴장을 뜻하며, 동전은 시작 팀과 진영을, 깃발은 경기장 밖으로 나간 공이나 반칙을 알린다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Soccer referees use various tools such as whistles, watches, foul cards, coins, and flags to control the game and manage its time and rules.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">축구 심판은 경기 중 \u003cb class=\"key\">호루라기\u003c/b>, 시계, 반칙 카드, 동전, 깃발 등 여러 도구를 사용한다. 각 도구는 반칙과 득점 신호, 시간 관리, 경고와 퇴장, 진영 결정, 경기장 밖 표시처럼 서로 다른 \u003cb class=\"key\">용도\u003c/b>를 담당한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":52,"text":"오늘 글은 심판의 다섯 가지 도구가 각각 어떤 역할을 하는지 정리한 분류형 지문이었어요. 도구 이름과 용도를 짝지어 기억하면 내용이 오래 남습니다. 여러분도 공책에 표를 하나 그려서 호루라기, 시계, 카드, 동전, 깃발을 직접 정리해 보세요. 오늘 수업 잘 따라와 주어서 고마워요.","hl":null}]}]});</script></body></html>
