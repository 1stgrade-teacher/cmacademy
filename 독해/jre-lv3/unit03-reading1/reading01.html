<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>쥬니어리딩엑스퍼트3 Unit3_Reading01 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"쥬니어리딩엑스퍼트3 Unit3_Reading01","audioDir":"reading01_audio","preview":false,"count":60,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.400em\">Unit3_Reading01\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">쥬니어리딩엑스퍼트3\u003c/div>\u003ch1>The First Ferris Wheel: A Giant Ride That Inspired the World\u003c/h1>\u003ch2>최초의 대관람차: 세상에 영감을 준 거대한 놀이 기구\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>이 글은 크고 수직으로 세워진 바퀴의 가장자리에 \u003cb class=\"key\">객차\u003c/b>가 달려 돌아가며 승객에게 전망을 제공하는 대관람차의 원리를 소개해요. 이어 1893년 세계 박람회를 위해 발명된 최초의 대관람차가 \u003cb class=\"key\">거대한 \u003c/b>\u003cb class=\"key\">크기\u003c/b>로 큰 성공을 거두었지만 \u003cb class=\"key\">운영비\u003c/b> 문제로 1906년까지만 사용되었고, 이후 \u003cb class=\"key\">재활용\u003c/b>되면서도 많은 사람에게 \u003cb class=\"key\">영감\u003c/b>을 주었다는 내용을 담고 있어요.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The first Ferris wheel, built for the 1893 World's Fair, was an impressive success because of its huge size, and although it was expensive to operate and was eventually recycled, it inspired many similar rides around the world.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 오늘은 대관람차의 역사에 관한 지문을 함께 읽어 볼게요. 이 글은 크고 수직으로 세워진 바퀴에 객차가 달린 대관람차의 원리를 설명하고, 천팔백구십삼 년 세계 박람회를 위해 발명된 최초의 대관람차가 거대한 크기로 큰 성공을 거두었다는 내용을 담고 있어요. 하지만 운영비 문제로 오래 쓰이지 못하고 재활용되었으며, 그럼에도 많은 사람에게 영감을 주었다는 점이 핵심이에요. 오늘의 요지는 최초의 대관람차가 놀라운 규모와 성공을 보였고, 사라진 뒤에도 세계의 비슷한 놀이기구에 영향을 주었다는 것이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">세계 박람회(World's Fair)는 각 나라가 산업과 문화의 발전상을 보여 주는 큰 국제 행사예요. 1889년 파리 만국 박람회에서 세워진 에펠탑(Eiffel Tower)은 거대한 철골 구조(steel framework)의 상징이 되었고, 시카고 세계 박람회를 준비하던 사람들은 그에 못지않은 볼거리를 원했어요. 페리스는 엔지니어(engineer)로서 거대한 바퀴를 안전하게 돌리는 아이디어를 고민했고, 그 결과가 최초의 대관람차였죠. 이는 거대한 자전거 바퀴에 의자를 매달아 천천히 돌리는 것과 비슷한 원리예요. 오늘날 금속을 재활용(recycle)해 새 구조물을 만드는 일처럼, 당시에도 관람차의 금속은 전함 건조에 다시 쓰였어요.\u003c/div>","segs":[{"n":2,"text":"세계 박람회는 각 나라가 산업과 문화의 발전상을 보여 주는 큰 국제 행사예요. 천팔백팔십구 년 파리 만국 박람회에서 세워진 Eiffel Tower, 즉 에펠탑은 거대한 철골 구조의 상징이 되었고, 시카고에서 열린 World's Fair, 즉 세계 박람회를 준비하던 사람들은 그에 못지않은 볼거리를 원했어요. 페리스는 엔지니어로서 거대한 바퀴를 안전하게 돌리는 아이디어를 고민했고, 그 결과가 최초의 대관람차였죠. 이는 거대한 자전거 바퀴에 의자를 매달아 천천히 돌리는 것과 비슷한 원리예요. 오늘날 금속을 재활용해 새 구조물을 만드는 일처럼, 당시에도 관람차의 금속은 전함 건조에 다시 쓰였어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>대관람차의 정의와 원리\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>글은 오늘날 대관람차가 놀이공원의 인기 있는 놀이 기구라고 소개한 뒤, 크고 수직으로 세워진 바퀴의 가장자리에 \u003cb class=\"key\">객차\u003c/b>가 달려 있다고 설명해요. 바퀴가 \u003cb class=\"key\">회전\u003c/b>하면서 승객들은 공원의 멋진 \u003cb class=\"key\">전망\u003c/b>을 볼 수 있다는 원리까지 제시하죠.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>최초의 대관람차와 성공\u003csmall>배경 · 문장 4–8\u003c/small>\u003c/h4>\u003cp>최초의 대관람차는 1893년 \u003cb class=\"key\">George \u003c/b>\u003cb class=\"key\">W. \u003c/b>\u003cb class=\"key\">G. \u003c/b>\u003cb class=\"key\">Ferris\u003c/b>에 의해 발명되었어요. 그는 \u003cb class=\"key\">엔지니어\u003c/b>로서 시카고의 \u003cb class=\"key\">세계 \u003c/b>\u003cb class=\"key\">박람회\u003c/b>를 위해 놀라운 것을 만들고자 했고, 자신의 발명품이 \u003cb class=\"key\">에펠탑\u003c/b>만큼 유명해지길 바랐죠. 그 결과 박람회에서 큰 \u003cb class=\"key\">성공\u003c/b>을 거두었다고 정리할 수 있어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>독특한 크기와 수용력\u003csmall>근거 · 문장 9–12\u003c/small>\u003c/h4>\u003cp>대관람차는 특히 \u003cb class=\"key\">크기\u003c/b> 때문에 인상적이었어요. 현대의 관람차는 보통 \u003cb class=\"key\">객차\u003c/b> 20개에 소수만 탑승하지만, 최초의 관람차는 36개의 큰 객차와 각 60개의 \u003cb class=\"key\">좌석\u003c/b>을 갖추었죠. 그래서 한 번에 2,160명이 탈 수 있었다는 점이 \u003cb class=\"key\">승객 \u003c/b>\u003cb class=\"key\">수용력\u003c/b>의 차이를 보여 줘요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>운영 문제와 재활용, 영향\u003csmall>결론 · 문장 13–16\u003c/small>\u003c/h4>\u003cp>그러나 \u003cb class=\"key\">운영비\u003c/b>가 너무 비쌌기 때문에 최초의 관람차는 1906년까지만 사용되었어요. 이후 금속은 \u003cb class=\"key\">재활용\u003c/b>되어 제1차 세계 대전 때 \u003cb class=\"key\">USS \u003c/b>\u003cb class=\"key\">Illinois\u003c/b> 전함을 짓는 데 쓰였죠. 비록 원래의 관람차는 \u003cb class=\"key\">사라졌지만\u003c/b>, 그것은 많은 사람에게 \u003cb class=\"key\">영감\u003c/b>을 주었고 오늘날 비슷한 놀이기구로 이어지고 있어요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 네 단계로 나누어 볼게요.","hl":null},{"n":4,"text":"먼저 글은 오늘날 대관람차가 놀이공원에서 인기 있는 놀이 기구라고 소개해요. 크고 수직으로 세워진 바퀴의 가장자리에 객차가 달려 있고, 바퀴가 회전하면서 승객들이 공원의 멋진 전망을 볼 수 있다고 설명하죠. 이 부분은 대관람차의 기본 구조와 원리를 잡아 주는 도입이에요.","hl":"f0"},{"n":5,"text":"다음으로 최초의 대관람차가 천팔백구십삼 년에 George W. G. Ferris에 의해 발명되었다는 역사가 나와요. 그는 엔지니어였고, 일리노이 주 시카고에서 열린 World's Fair, 즉 세계 박람회를 위해 놀라운 것을 만들고 싶어 했어요. 자신의 발명품이 Eiffel Tower, 즉 에펠탑만큼 유명해지길 바랐는데, 실제로 박람회에서 큰 성공을 거두었죠.","hl":"f1"},{"n":6,"text":"세 번째 단계에서는 대관람차의 크기가 특히 인상적이었다는 점을 강조해요. 현대의 관람차는 보통 객차가 이십 개이고 각 객차에 소수만 탑승하지만, 최초의 관람차는 큰 객차가 삼십육 개나 있었고 각 객차에는 좌석이 육십 개씩 있었어요. 그래서 승객 수용력이 이천백육십 명에 이르러 한 번에 아주 많은 사람이 탈 수 있었다는 사실이 규모의 차이를 보여 줍니다.","hl":"f2"},{"n":7,"text":"마지막 단계는 운영 문제와 그 이후의 영향이에요. 운영비가 너무 비쌌기 때문에 최초의 관람차는 천구백육 년까지만 사용되었고, 이후 금속은 재활용되어 제일차 세계 대전 때 USS Illinois 전함을 짓는 데 쓰였어요. 원래의 관람차는 사라졌지만 많은 사람에게 영감을 주었고, 지금도 세계 곳곳의 비슷한 놀이기구에서 그 정신을 찾아볼 수 있다고 정리할 수 있어요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 15번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 대관람차의 일반적 정의에서 시작해 최초의 발명, 성공, 크기, 운영 문제, 재활용으로 이어지는 \u003cb class=\"key\">시간순\u003c/b> 흐름을 보여 줘요. 중간에 현대와 최초의 \u003cb class=\"key\">객차\u003c/b> 규모를 \u003cb class=\"key\">대조\u003c/b>해 최초의 관람차가 얼마나 인상적이었는지 강조하죠. 마지막 부분에서 원래의 관람차가 없어졌어도 많은 사람에게 \u003cb class=\"key\">영감\u003c/b>을 주었다고 정리하므로 핵심 주제가 끝에 오는 \u003cb class=\"key\">미괄식\u003c/b> 구조로 볼 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>These days (1)\u003c/b>\u003cspan>도입·시대 배경\u003c/span>\u003cb>As (3)\u003c/b>\u003cspan>동시 상황·원리\u003c/span>\u003cb>But (11)\u003c/b>\u003cspan>대조\u003c/span>\u003cb>So (12)\u003c/b>\u003cspan>결과\u003c/span>\u003cb>however (13)\u003c/b>\u003cspan>전환·대조\u003c/span>\u003cb>later (14)\u003c/b>\u003cspan>시간 경과\u003c/span>\u003cb>Although (15)\u003c/b>\u003cspan>양보·결론\u003c/span>\u003cb>now (16)\u003c/b>\u003cspan>현재·마무리\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Ferris wheels\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">large, upright wheels\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the very first Ferris wheel\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the original wheel\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">similar rides\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>최초의 대관람차\u003c/th>\u003cth>현대의 대관람차\u003c/th>\u003c/tr>\u003ctr>\u003ctd>객차 36개, 각 60석\u003c/td>\u003ctd>객차 20개, 소수 탑승\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한 번에 2,160명 탑승 가능\u003c/td>\u003ctd>수용 인원이 적음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>규모는 인상적이나 운영비 부담\u003c/td>\u003ctd>운영 효율적이고 일상적\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 대관람차의 정의에서 출발해 최초의 발명, 성공, 크기, 운영 문제, 재활용과 영향으로 이어지는 시간순 구조예요. 중간에는 현대의 관람차와 최초의 관람차를 객차 규모와 승객 수용력에서 대조해 최초의 것이 얼마나 인상적이었는지 보여 주죠. 핵심 주제는 끝부분에서 원래의 관람차가 사라졌어도 많은 사람에게 영감을 주었다는 문장으로 정리되기 때문에 미괄식이라고 볼 수 있어요.","hl":"ty"},{"n":9,"text":"신호어를 보면 첫 문장의 These days는 시대 배경을 열어 주고, As는 바퀴가 돌 때의 원리를 자연스럽게 연결해요. But과 however는 앞의 성공과 규모에 이어 운영이 어려웠다는 반전을 만들고, So는 넓은 객차와 많은 좌석이 큰 승객 수용력으로 이어진 결과를 보여 줘요. later는 금속이 재활용된 시간의 흐름을, Although는 원래의 관람차가 없다는 사실과 많은 사람에게 영감을 주었다는 결론을 양보로 연결하죠. 또한 the very first Ferris wheel과 the original wheel처럼 같은 대상을 바꿔 말하는 재진술도 눈여겨보세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>These days\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>오늘날, 요즘\u003c/span>\u003c/div>\u003cdiv>\u003cb>Ferris wheel\u003c/b>\u003cem>명사\u003c/em>\u003cspan>대관람차\u003c/span>\u003c/div>\u003cdiv>\u003cb>popular\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>인기 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>amusement park\u003c/b>\u003cem>명사\u003c/em>\u003cspan>놀이공원\u003c/span>\u003c/div>\u003cdiv>\u003cb>upright\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>수직으로 세워진\u003c/span>\u003c/div>\u003cdiv>\u003cb>passenger car\u003c/b>\u003cem>명사\u003c/em>\u003cspan>객차, 승객용 칸\u003c/span>\u003c/div>\u003cdiv>\u003cb>edge\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가장자리\u003c/span>\u003c/div>\u003cdiv>\u003cb>rotate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>회전하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>view\u003c/b>\u003cem>명사\u003c/em>\u003cspan>전망, 경치\u003c/span>\u003c/div>\u003cdiv>\u003cb>invent\u003c/b>\u003cem>동사\u003c/em>\u003cspan>발명하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>engineer\u003c/b>\u003cem>명사\u003c/em>\u003cspan>엔지니어, 기술자\u003c/span>\u003c/div>\u003cdiv>\u003cb>World's Fair\u003c/b>\u003cem>명사\u003c/em>\u003cspan>세계 박람회\u003c/span>\u003c/div>\u003cdiv>\u003cb>invention\u003c/b>\u003cem>명사\u003c/em>\u003cspan>발명품, 발명\u003c/span>\u003c/div>\u003cdiv>\u003cb>famous\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>유명한\u003c/span>\u003c/div>\u003cdiv>\u003cb>huge\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>거대한\u003c/span>\u003c/div>\u003cdiv>\u003cb>success\u003c/b>\u003cem>명사\u003c/em>\u003cspan>성공\u003c/span>\u003c/div>\u003cdiv>\u003cb>especially\u003c/b>\u003cem>부사\u003c/em>\u003cspan>특히\u003c/span>\u003c/div>\u003cdiv>\u003cb>impressive\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>인상적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>size\u003c/b>\u003cem>명사\u003c/em>\u003cspan>크기\u003c/span an class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">discourage\u003c/span>\u003cspan class=\"a\">deter\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 함께 정리해 볼게요. popular는 well-liked나 favored와 비슷하고, 반대말은 unpopular나 disliked예요. famous는 well-known, renowned와 가깝고 unknown이나 obscure와 반대되며, huge는 enormous, massive와 비슷하지만 tiny나 small과 반대돼요. expensive는 costly, pricey와 같고 cheap, inexpensive와 반대이며, modern은 contemporary, current와 가깝고 ancient, old-fashioned과 반대예요. original은 first, initial, earliest와 비슷하고 latest나 later와 반대이며, inspire는 motivate, encourage와 비슷하고 discourage, deter와 반대라는 점까지 기억해 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">요즘,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">These \u003c/span>\u003cspan class=\"tgt\">days,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대관람차는 ~이다\u003c/span>\u003cspan class=\"en\">Ferris wheels \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인기 있는 놀이 기구\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">popular \u003c/span>\u003cspan class=\"tgt\">rides\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">놀이공원에서\u003c/span>\u003cspan class=\"en\">at amusement parks.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">오늘날 대관람차는 놀이공원에서 인기 있는 놀이 기구이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글의 첫 문장으로, 대관람차가 오늘날 놀이공원을 대표하는 \u003cb class=\"key\">놀이 \u003c/b>\u003cb class=\"key\">기구\u003c/b>임을 먼저 제시하는 \u003cb class=\"key\">도입\u003c/b> 역할을 해요. 지금의 모습을 보여 준 뒤, 뒤에서 그 시작과 역사로 이야기를 이어 갈 준비를 하는 문장이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간 부사구(현재시제와 함께 쓰는 표현)\u003c/span> : [These days] + [현재시제 문장] : \"요즘\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">2형식 문장(주어 + be동사 + 주격보어)\u003c/span> : [주어 Ferris wheels] + [동사 are] + [보어 popular rides] : \"인기 있는 놀이 기구이다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"These days, 요즘. Ferris wheels are, 대관람차는 ~이다. popular rides, 인기 있는 놀이 기구. at amusement parks, 놀이공원에서. 이 문장 전체를 해석하면, 오늘날 대관람차는 놀이공원에서 인기 있는 놀이 기구이다.","hl":"m"},{"n":13,"text":"이 문장은 글의 첫 문장으로, 대관람차가 요즘 놀이공원에서 얼마나 인기 있는지를 먼저 알려 주는 도입 문장이에요. 오늘날의 모습을 보여 주고 나서, 뒤에서 이 wheel이 어떻게 시작됐는지 이야기할 준비를 하는 거죠.","hl":"mn"},{"n":14,"text":"첫 번째로 These days는 요즘처럼 현재의 반복되는 상황을 말할 때 쓰고, 문장은 현재시제로 받아요. 두 번째로 are popular rides는 be동사 뒤에 명사가 와서 주어가 무엇인지 설명하는 2형식 구조예요. 주어 Ferris wheels가 복수니까 동사도 are로 맞춰 준 것도 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 16\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들은 ~이다\u003c/span>\u003cspan class=\"en\">They are\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">크고 수직으로 세워진 바퀴이며,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">large, \u003c/span>\u003cspan class=\"tgt\">upright \u003c/span>\u003cspan class=\"tgt\">wheels\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그것들은 가지고 있다\u003c/span>\u003cspan class=\"en\">and they have\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">객차를\u003c/span>\u003cspan class=\"en\">passenger cars\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가장자리 주변으로\u003c/span>\u003cspan class=\"en\">around the edge\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들이 타도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">ride \u003c/span>\u003cspan class=\"tgt\">in\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것들은 크고 수직으로 세워진 바퀴이며, 그것들은 가장자리 주변으로 사람들이 타는 객차를 가지고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 대관람차의 생김새와 구조를 설명하는 문장이에요. 큰 바퀴의 \u003cb class=\"key\">가장자리\u003c/b>를 따라 사람이 타는 칸이 달려 있다는 점을 알려 주죠. 앞 문장의 대관람차를 they로 받아 \u003cb class=\"key\">구조\u003c/b>를 구체화하는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">형용사 병렬 구조(콤마로 연결)\u003c/span> : [형용사1 large], [형용사2 upright] + [명사 wheels] : \"크고 수직으로 세워진 바퀴\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 의미상 주어(for + 목적격)\u003c/span> : for + [목적격 people] + [to ride in] : \"사람들이 (그 안에) 타도록\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"They are, 그것들은 ~이다. large, upright wheels, 크고 수직으로 세워진 바퀴이며. and they have, 그리고 그것들은 가지고 있다. passenger cars, 객차를. around the edge, 가장자리 주변으로. for people to ride in, 사람들이 타도록. 이 문장 전체를 해석하면, 그것들은 크고 수직으로 세워진 바퀴이며, 그것들은 가장자리 주변으로 사람들이 타는 객차를 가지고 있다.","hl":"m"},{"n":16,"text":"이 문장은 대관람차가 생김새가 어떤지 설명해요. 큰 바퀴의 가장자리를 따라 사람이 타는 칸이 달려 있다는 구조를 알려 주는 거죠. 앞 문장에서 나온 대관람차를 they로 받아서 설명을 이어 가고 있어요.","hl":"mn"},{"n":17,"text":"첫 번째로 large, upright wheels에서 두 형용사가 콤마로 나열되어 하나의 명사 wheels를 꾸미는 병렬 구조예요. 두 번째로 for people to ride in은 to ride의 주체가 they가 아니라 people이라는 걸 for + 목적격으로 밝혀 준 표현이에요. 이때 in의 목적어는 앞에 나온 passenger cars가 된다는 점도 챙겨 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바퀴가 돌면서,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">As \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">wheel \u003c/span>\u003cspan class=\"tgt\">rotates\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">승객들은 얻는다\u003c/span>\u003cspan class=\"en\">passengers \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">get \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">멋진 전망을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">great \u003c/span>\u003cspan class=\"tgt\">view \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공원의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">park\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">바퀴가 돌면서, 승객들은 공원의 멋진 전망을 본다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 대관람차를 타면 어떤 경험을 하는지 알려 주는 문장이에요. 바퀴가 돌아가면서 공원 전체를 내려다볼 수 있다는 \u003cb class=\"key\">장점\u003c/b>을 보여 주죠. 앞에서 설명한 구조에 이어, 타는 사람의 \u003cb class=\"key\">경험\u003c/b>으로 화제를 옮기는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 as (시간: ~할 때, ~하면서)\u003c/span> : [As + 주어 + 동사], [주어 + 동사] : \"바퀴가 돌면서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">3형식 동사 get(얻다) + 목적어\u003c/span> : get + [목적어 a great view] + [of the park (수식어)] : \"공원의 멋진 전망을 얻다, 즉 보다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"As the wheel rotates, 바퀴가 돌면서. passengers get, 승객들은 얻는다. a great view, 멋진 전망을. of the park, 공원의. 이 문장 전체를 해석하면, 바퀴가 돌면서, 승객들은 공원의 멋진 전망을 본다.","hl":"m"},{"n":19,"text":"이 문장은 대관람차를 타면 어떤 경험을 하는지 말해 줘요. 바퀴가 천천히 돌아가면서 승객들이 공원 전체를 내려다볼 수 있다는 장점을 보여 주는 거죠. 구조 설명 다음에 타는 사람의 경험으로 자연스럽게 넘어가는 문장이에요.","hl":"mn"},{"n":20,"text":"첫 번째로 As the wheel rotates에서 as는 두 일이 동시에 일어날 때 쓰는 시간의 접속사예요. 그래서 뒤 문장도 똑같이 현재시제로 맞춰 줍니다. 두 번째로 get a great view of the park에서 get은 전망을 얻는다, 즉 누린다는 뜻의 3형식 동사이고, of the park는 어떤 전망인지 알려주는 수식어예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 16\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바로 최초의 대관람차는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">The \u003c/span>\u003cspan class=\"tgt\">very \u003c/span>\u003cspan class=\"tgt\">first\u003c/span> Ferris wheel\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">발명되었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">invented\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1893년에\u003c/span>\u003cspan class=\"en\">in 1893\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">조지 W.G.에 의해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">George \u003c/span>\u003cspan class=\"tgt\">W.G.\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">최초의 대관람차는 1893년에 조지 W.G.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 대관람차의 \u003cb class=\"key\">기원\u003c/b>과 \u003cb class=\"key\">발명 \u003c/b>\u003cb class=\"key\">연도\u003c/b>, 발명한 사람을 제시하는 문장이에요. 앞 문장에서 대관람차가 인기 있는 놀이기구라고 소개한 뒤, 이제 그 시작점으로 화제를 옮기는 \u003cb class=\"key\">도입\u003c/b> 역할을 해요. 'very first'는 '바로 최초의'라는 뜻으로 \u003cb class=\"key\">강조\u003c/b>를 더하는 표현이라는 점도 기억해 두세요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">강조어 very\u003c/span> : [[the very]] + 서수·최상급 + 명사 : \"바로 최초의\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태(be동사 + 과거분사)\u003c/span> : 주어 + [[was]] + [[invented]] (be동사 + 과거분사) : \"발명되었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">수동태의 행위자 by\u003c/span> : be동사 + 과거분사 + [[by]] + 행위자 : \"조지 W.G.에 의해\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"The very first Ferris wheel, 바로 최초의 대관람차는. was invented, 발명되었다. in 1893, 1893년에. by George W.G, 조지 W.G.에 의해. 이 문장 전체를 해석하면, 최초의 대관람차는 1893년에 조지 W.G.","hl":"m"},{"n":22,"text":"이 문장은 대관람차의 시작을 알려 주는 문장이에요. 언제, 누구에 의해 만들어졌는지를 한 번에 제시하고 있죠. very first가 붙어서 '정말 최초의'라는 점을 강조한다는 것도 같이 기억해 두세요.","hl":"mn"},{"n":23,"text":"먼저 was invented를 보세요. 대관람차는 스스로 발명하는 게 아니라 사람에 의해 발명되는 대상이죠. 그래서 be동사에 과거분사를 붙인 수동태를 씁니다. 두 번째로 by George W.G.에서 by는 행위자를 이끄는 전치사예요. '누구에 의해'라고 해석하면 됩니다. 세 번째로 the very first에서 very는 '바로 그'라는 뜻으로 서수를 강조해요. 그래서 최초라는 의미가 더 힘 있게 살아납니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">페리스에 의해 발명되었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Ferris.\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">페리스에 의해 발명되었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 끊긴 발명가의 이름이 여기서 \u003cb class=\"key\">마무리\u003c/b>되는 부분이에요. 문장 부호 때문에 따로 떨어져 보이지만, 실제로는 앞 문장의 \u003cb class=\"key\">by\u003c/b>와 붙어서 '조지 W.G. 페리스에 의해'라는 하나의 의미 단위를 이뤄요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태 행위자(by + 인명)의 완성\u003c/span> : by + [[행위자(인명)]] → '…에 의해' : \"페리스\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Ferris, 페리스에 의해 발명되었다. 이 문장 전체를 해석하면, 페리스에 의해 발명되었다.","hl":"m"},{"n":25,"text":"이 부분은 따로 떨어진 문장처럼 보이지만, 앞 문장의 by와 이어져서 발명가의 이름을 완성해 줘요. 그래서 해석할 때는 앞 문장과 붙여서 읽어야 자연스럽습니다.","hl":"mn"},{"n":26,"text":"여기서 꼭 짚을 점은 앞의 네 번째 문장이 by George W.G.까지만 끊겼다는 거예요. 여기서 Ferris가 붙으면서 행위자인 사람 이름이 완성됩니다. by 뒤에는 이렇게 사람 이름이 통째로 와야 한다는 점을 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 16\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">페리스는 엔지니어였고,\u003c/span>\u003cspan class=\"en\">Ferris \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">engineer\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그는 짓기를 원했어요\u003c/span>\u003cspan class=\"en\">and he \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">wanted \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">build\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 놀라운 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">something \u003c/span>\u003cspan class=\"tgt\">amazing\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세계 박람회를 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">World's \u003c/span>\u003cspan class=\"tgt\">Fair\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일리노이 주의 시카고에서\u003c/span>\u003cspan class=\"en\">in Chicago, Illinois.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">페리스는 엔지니어였고, 그는 일리노이 주의 시카고에서 열린 세계 박람회를 위한 어떤 놀라운 것을 만들어 내기를 원했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 페리스의 \u003cb class=\"key\">직업\u003c/b>과 그가 가진 \u003cb class=\"key\">목표\u003c/b>를 함께 보여 주는 문장이에요. 엔지니어라는 신분이 놀라운 구조물을 만들 수 있는 \u003cb class=\"key\">배경\u003c/b>이 된다는 점을 알려 주죠. 또 '세계 박람회를 위해'라는 목적이 뒤에 이어지는 성공 이야기의 \u003cb class=\"key\">원인\u003c/b>이 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격보어와 관사 an\u003c/span> : 주어 + be동사 + [[a/an]] + 직업 명사 : \"엔지니어였다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : want + [[to + 동사원형]] (to부정사구/목적어) : \"짓기를 원했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">-thing 대명사를 뒤에서 수식하는 형용사\u003c/span> : [[something]] + [[형용사]] : \"어떤 놀라운 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">목적을 나타내는 전치사 for\u003c/span> : [[for]] + 명사(목적 대상) : \"세계 박람회를 위해\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Ferris was an engineer, 페리스는 엔지니어였고. and he wanted to build, 그리고 그는 짓기를 원했어요. something amazing, 어떤 놀라운 것을. for the World's Fair, 세계 박람회를 위해. in Chicago, Illinois, 일리노이 주의 시카고에서. 이 문장 전체를 해석하면, 페리스는 엔지니어였고, 그는 일리노이 주의 시카고에서 열린 세계 박람회를 위한 어떤 놀라운 것을 만들어 내기를 원했다.","hl":"m"},{"n":28,"text":"이 문장은 페리스가 어떤 사람이었고 무엇을 이루고 싶어 했는지를 함께 보여 줘요. 엔지니어라는 직업이 놀라운 것을 만들 수 있는 배경이 되고, 세계 박람회를 위해 만들고 싶었다는 목표가 뒤에 나오는 성공 이야기의 원인이 됩니다.","hl":"mn"},{"n":29,"text":"먼저 was an engineer를 보세요. be동사 뒤에 직업을 나타내는 명사가 오면 주격보어가 되고, 셀 수 있는 직업 명사 앞에는 a나 an을 붙여요. 두 번째로 wanted to build에서 to build는 wanted의 목적어로 쓰인 to부정사예요. 그래서 '짓기를 원했다'라고 해석합니다. 세 번째로 something amazing을 보면 thing으로 끝나는 대명사는 형용사가 뒤에서 꾸며 줘요. 그래서 amazing이 something 뒤에 온 거예요. 마지막으로 for the World's Fair에서 for는 '위해'라는 목적을 나타내는 전치사입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 16\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 바랐다\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">hoped \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 발명품이 ~이 되기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">invention \u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~만큼 유명하게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">famous \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">에펠탑만큼\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">Eiffel \u003c/span>\u003cspan class=\"tgt\">Tower\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 자신의 발명품이 에펠탑만큼 유명해지기를 바랐다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 페리스가 자신의 \u003cb class=\"key\">발명품\u003c/b>이 에펠탑만큼 \u003cb class=\"key\">유명\u003c/b>해지기를 바랐다는 뜻이에요. 앞에서 박람회를 위해 놀라운 것을 만들고 싶어 했다는 내용을 이어 받아, 그가 목표로 삼은 \u003cb class=\"key\">기준\u003c/b>이 에펠탑이었음을 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that의 생략 (목적어 명사절) + 시제 일치\u003c/span> : hope + [(that) + 주어 + would + 동사 ~] : \"그의 발명품이 ~해지기를 바랐다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">원급 비교 as ~ as\u003c/span> : as + [형용사/부사] + as + [비교 대상] : \"에펠탑만큼 유명한\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"He hoped, 그는 바랐다. his invention would be, 자신의 발명품이 ~이 되기를. as famous as, ~만큼 유명하게. the Eiffel Tower, 에펠탑만큼. 이 문장 전체를 해석하면, 그는 자신의 발명품이 에펠탑만큼 유명해지기를 바랐다.","hl":"m"},{"n":31,"text":"이 문장은 페리스가 자기 발명품이 에펠탑만큼 유명해지기를 바랐다는 뜻이에요. 앞에서 박람회를 위해 놀라운 것을 만들고 싶었다는 내용을 이어 받아, 그가 생각한 기준이 에펠탑이었다는 걸 보여 주죠. 그래서 뒤에 나오는 성공 이야기를 자연스럽게 예고하는 역할도 한답니다.","hl":"mn"},{"n":32,"text":"첫 번째로, hoped 뒤에 나오는 his invention would be부터는 접속사 that이 생략된 목적어 명사절이에요. 주절이 과거 시제니까 시제 일치로 would를 쓴 점도 꼭 기억해 두세요. 두 번째로, as famous as the Eiffel Tower는 원급 비교 표현이에요. 앞의 as와 뒤의 as 사이에 형용사 famous가 들어가서 에펠탑만큼 유명한이라는 뜻을 만들어 준답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 다행스럽게도,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">And \u003c/span>\u003cspan class=\"tgt\">luckily\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 큰 성공이었다\u003c/span>\u003cspan class=\"en\">it \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">huge \u003c/span>\u003cspan class=\"tgt\">success\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">박람회에서\u003c/span>\u003cspan class=\"en\">at the fair.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그리고 다행스럽게도, 그것은 박람회에서 큰 성공을 거두었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 바란 일이 실제로 이루어졌음을 알려 주는 문장이에요. \u003cb class=\"key\">luckily\u003c/b>는 결과가 \u003cb class=\"key\">긍정적\u003c/b>이었음을 강조하는 신호이고, it은 바로 앞의 his invention, 즉 \u003cb class=\"key\">관람차\u003c/b>를 가리킵니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">등위접속사 And + 문장부사 luckily\u003c/span> : [And] + [luckily], + 주어 + 동사 ~ : \"그리고 다행스럽게도\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">2형식 동사 + 주격 보어\u003c/span> : 주어 + [be동사] + [명사(주격 보어)] : \"큰 성공이었다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"And luckily, 그리고 다행스럽게도. it was a huge success, 그것은 큰 성공이었다. at the fair, 박람회에서. 이 문장 전체를 해석하면, 그리고 다행스럽게도, 그것은 박람회에서 큰 성공을 거두었다.","hl":"m"},{"n":34,"text":"앞에서 바란 일이 실제로 이루어졌다는 걸 알려 주는 문장이에요. luckily가 들어 있어서 결과가 긍정적이었다는 느낌을 강조하죠. 여기서 it은 바로 앞에 나온 his invention, 즉 관람차를 가리키는 대명사예요.","hl":"mn"},{"n":35,"text":"첫 번째로, 맨 앞의 And는 등위접속사로 앞 문장과 이 문장을 연결해 주고, luckily는 문장 전체를 수식하는 부사예요. 두 번째로, was a huge success는 be동사가 주격 보어를 데려오는 2형식 구조예요. a huge success가 주어 it의 정체를 설명해 주는 자리라는 점을 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대관람차는\u003c/span>\u003cspan class=\"en\">The Ferris wheel\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">특히 인상적이었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">especially \u003c/span>\u003cspan class=\"tgt\">impressive\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것의 크기 때문에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">because \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">its \u003c/span>\u003cspan class=\"tgt\">size\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">대관람차는 그것의 크기 때문에 특히 인상적이었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 관람차가 인상적이었던 까닭이 바로 \u003cb class=\"key\">크기\u003c/b>였음을 밝히는 문장이에요. 뒤에 이어지는 승객 수와 좌석 수에 대한 \u003cb class=\"key\">근거\u003c/b>를 미리 제시하는 역할을 하죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">2형식 동사 + 부사 + 형용사(주격 보어)\u003c/span> : 주어 + [be동사] + [부사 + 형용사(주격 보어)] : \"특히 인상적이었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구 because of + 명사\u003c/span> : because of + [명사(구)] : \"그것의 크기 때문에\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"The Ferris wheel, 대관람차는. was especially impressive, 특히 인상적이었다. because of its size, 그것의 크기 때문에. 이 문장 전체를 해석하면, 대관람차는 그것의 크기 때문에 특히 인상적이었다.","hl":"m"},{"n":37,"text":"관람차가 인상적이었던 까닭이 바로 크기였다는 걸 밝히는 문장이에요. 뒤에 20개니 36개니 하는 차량 수 이야기가 나오는데, 그 이야기의 근거를 미리 깔아 주는 셈이죠. 그래서 이 문장은 다음 내용을 이끄는 연결 고리 역할을 해요.","hl":"mn"},{"n":38,"text":"첫 번째로, was especially impressive에서 impressive는 주어인 The Ferris wheel을 설명하는 주격 보어예요. 그 앞의 especially는 형용사를 꾸미는 부사라는 점도 챙겨 두세요. 두 번째로, because of its size는 because of 뒤에 명사구가 오는 전치사구 형태예요. because 뒤에 절이 오는 경우와 구분해서 기억하면 훨씬 좋아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">현대의 대관람차는\u003c/span>\u003cspan class=\"en\">Modern Ferris wheels\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보통 20개의 객차가 있고,\u003c/span>\u003cspan class=\"en\">usually have 20 passenger cars,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 각 객차는\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">each \u003c/span>\u003cspan class=\"tgt\">one\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오직 소수의 사람들만 수용할 수 있다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">only \u003c/span>\u003cspan class=\"tgt\">hold\u003c/span> a few people.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">현대의 대관람차는 보통 20개의 객차가 있고, 각 객차는 오직 소수의 사람들만 수용할 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 현대 관람차의 일반적인 특징을 숫자로 제시하며 뒤에 나올 최초 관람차와의 \u003cb class=\"key\">비교 \u003c/b>\u003cb class=\"key\">기준\u003c/b>을 세우는 문장이에요. 객차 수는 많지만 각 객차의 수용 인원은 적다는 점이 핵심이죠. 이 기준 덕분에 다음 문장에서 최초 관람차의 \u003cb class=\"key\">규모\u003c/b>가 더 크게 부각돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">each의 단수 취급\u003c/span> : each (one) + [단수 동사] : \"각각의 객차는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 can + 부사 only의 위치\u003c/span> : [조동사 can] + [부사 only] + [동사원형 hold] : \"오직 ~만 수용할 수 있다\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"Modern Ferris wheels, 현대의 대관람차는. usually have 20 passenger cars, 보통 20개의 객차가 있고. and each one, 그리고 각 객차는. can only hold a few people, 오직 소수의 사람들만 수용할 수 있다.. 이 문장 전체를 해석하면, 현대의 대관람차는 보통 20개의 객차가 있고, 각 객차는 오직 소수의 사람들만 수용할 수 있다.","hl":"m"},{"n":40,"text":"이 문장은 현대 관람차의 일반적인 모습을 숫자로 보여 주고 있어요. 객차는 스무 개나 되지만 각 객차는 몇 명만 탈 수 있다는 게 핵심이죠. 바로 다음에 나올 최초 관람차와 비교하기 위한 비교 기준을 미리 깔아 두는 문장이고, 덕분에 뒤에서 최초 관람차의 규모가 얼마나 대단했는지가 더 크게 드러나요.","hl":"mn"},{"n":41,"text":"첫 번째 어법 포인트는 each one이에요. each는 하나하나를 따로 보는 말이라서 단수로 취급하고, 그래서 뒤에 단수 동사인 can이 와요. 두 번째는 조동사 can이에요. can only hold처럼 조동사 뒤에는 동사원형이 오고, 그 사이에 only가 들어가서 오직 이것만이라는 한정의 뜻을 만들어 주죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 16\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 최초의 관람차는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">But\u003c/span> the original wheel\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">36개의 커다란 객차들이 있었고,\u003c/span>\u003cspan class=\"en\">had 36 \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">large \u003c/span>\u003cspan class=\"tgt\">passenger \u003c/span>\u003cspan class=\"tgt\">cars\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">각 객차에는\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">each \u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">60개의 좌석들이 있었다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">had\u003c/span> 60 seats.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 최초의 관람차는 36개의 커다란 객차들이 있었고, 각 객차에는 60개의 좌석들이 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 현대 관람차와 최초 관람차를 숫자로 정면 \u003cb class=\"key\">비교\u003c/b>하는 문장이에요. 객차 수도 훨씬 많고 각 객차의 좌석 수도 압도적이라는 걸 보여 주죠. 그래서 최초 관람차의 \u003cb class=\"key\">규모\u003c/b>가 얼마나 컸는지를 독자에게 강하게 각인시켜요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">역접의 등위접속사 but\u003c/span> : [문장] + but + [문장] : \"그러나\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">형용사의 명사 전치 수식\u003c/span> : [형용사 large] + [명사 passenger cars] : \"커다란 객차들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">each의 단수 취급\u003c/span> : each (one) + [단수 동사 had] : \"각 객차에는 ~이 있었다\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"But the original wheel, 그러나 최초의 관람차는. had 36 large passenger cars, 36개의 커다란 객차들이 있었고. and each one, 각 객차에는. had 60 seats, 60개의 좌석들이 있었다.. 이 문장 전체를 해석하면, 그러나 최초의 관람차는 36개의 커다란 객차들이 있었고, 각 객차에는 60개의 좌석들이 있었다.","hl":"m"},{"n":43,"text":"이 문장은 현대 관람차와 최초 관람차를 숫자로 정면 비교하고 있어요. 객차 수도 훨씬 많고 각 객차의 좌석 수도 압도적이라는 걸 보여 주죠. 그래서 최초 관람차의 규모가 얼마나 컸는지가 자연스럽게 느껴지게 해요.","hl":"mn"},{"n":44,"text":"첫 번째는 but이에요. 앞 문장과 반대되는 내용을 이어 주는 등위접속사라서 현대와 최초를 대조하는 신호가 되죠. 두 번째는 형용사 어순이에요. large passenger cars처럼 형용사는 명사 앞에서 꾸며 주는 게 영어의 기본 어순이에요. 세 번째는 each one had인데, each one은 하나하나를 세는 단수 주어라서 뒤에 단수 동사 had가 와요. 앞에 나온 서른여섯 개의 복수 객차와 동사 형태가 다르다는 점을 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서 2,160명의 사람들이\u003c/span>\u003cspan class=\"en\">So 2,160 people\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 탈 수 있었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">could \u003c/span>\u003cspan class=\"tgt\">ride\u003c/span> it\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 번에!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">once\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그래서 2,160명의 사람들이 한 번에 그것을 탈 수 있었다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 제시한 숫자들이 실제로 얼마나 대단한지를 \u003cb class=\"key\">결과\u003c/b>로 보여 주는 문장이에요. 객차 36개에 좌석 60개씩이니 한 번에 수천 명이 탈 수 있었다는 뜻이죠. 최초 관람차의 \u003cb class=\"key\">규모\u003c/b>가 정말 압도적이었다는 점을 강조해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 could(과거의 능력)\u003c/span> : [주어] + could + [동사원형] : \"탈 수 있었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관용표현 at once\u003c/span> : at once = 동시에, 한 번에 : \"한 번에\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"So 2,160 people, 그래서 2,160명의 사람들이. could ride it, 그것을 탈 수 있었다. at once!, 한 번에!. 이 문장 전체를 해석하면, 그래서 2,160명의 사람들이 한 번에 그것을 탈 수 있었다!","hl":"m"},{"n":46,"text":"이 문장은 앞에서 말한 숫자들이 실제로 얼마나 대단한지를 결과로 보여 줘요. 객차가 서른여섯 개이고 좌석이 예순 개씩이니, 한 번에 수천 명이 탈 수 있었다는 뜻이죠. 최초 관람차의 규모가 정말 압도적이었다는 걸 강조하는 문장이에요.","hl":"mn"},{"n":47,"text":"첫 번째는 조동사 could예요. can의 과거형이라서 과거 시점에서 탈 수 있었다는 능력을 나타내고, 조동사 뒤에는 언제나 동사원형 ride가 와요. 두 번째는 at once라는 관용표현이에요. 즉시라는 뜻도 있지만 여기서는 동시에, 한 번에라는 뜻으로 쓰였죠. 그래서 이천백육십 명이 동시에 탔다, 이렇게 이해하시면 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 문제는\u003c/span>\u003cspan class=\"en\">The problem, however,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 운영하기에 너무 비쌌다는 것이었고,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">very \u003c/span>\u003cspan class=\"tgt\">expensive \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">operate\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서 그것은 사용되었다\u003c/span>\u003cspan class=\"en\">so it \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">only \u003c/span>\u003cspan class=\"tgt\">used\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1906년까지만\u003c/span>\u003cspan class=\"en\">until 1906.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 문제는 그것이 운영하기에 너무 비쌌다는 것이었고, 그래서 그것은 1906년까지만 사용되었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 관람차의 규모가 얼마나 인상적이었는지 자랑했는데, 이 문장에서 \u003cb class=\"key\">however\u003c/b>를 써서 방향을 반대로 틉니다. 문제는 돈이었다는 것, 즉 \u003cb class=\"key\">운영비\u003c/b>가 너무 많이 들었다는 점을 꺼내며 이야기가 전환돼요. 그래서 최초의 관람차는 오래가지 못하고 1906년까지만 쓰였다는 \u003cb class=\"key\">수동태\u003c/b> 표현으로 최후를 담담히 전합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">that이 이끄는 명사절(주격 보어)\u003c/span> : The problem + be동사 + [that + 완전한 절] : \"그것이 운영하기에 너무 비쌌다는 것이었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">가주어 it / 진주어 to부정사\u003c/span> : It + be동사 + 형용사 + [to + 동사원형 (진주어)] : \"운영하는 것은 너무 비쌌다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">수동태(be동사 + 과거분사)\u003c/span> : 주어 + be동사 + [과거분사] (+ by 행위자) : \"오직 사용되었다\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"The problem, however, 그러나 문제는. was that it was very expensive to operate, 그것이 운영하기에 너무 비쌌다는 것이었고. so it was only used, 그래서 그것은 사용되었다. until 1906, 1906년까지만. 이 문장 전체를 해석하면, 그러나 문제는 그것이 운영하기에 너무 비쌌다는 것이었고, 그래서 그것은 1906년까지만 사용되었다.","hl":"m"},{"n":49,"text":"앞에서는 규모가 얼마나 인상적이었는지 자랑했는데, 이 문장에서 however로 방향을 확 틀어요. 문제는 운영비가 너무 많이 들었다는 것이었고, 그래서 1906년까지만 쓰였다는 겁니다. 이렇게 장점 다음에 단점을 붙여 주면 이야기가 훨씬 균형 있게 들려요.","hl":"mn"},{"n":50,"text":"첫 번째 어법은 that이 이끄는 명사절이에요. The problem was that, 여기서 that절 전체가 주어를 설명하는 주격 보어 자리에 들어간 겁니다. 두 번째는 가주어 it과 진주어 to operate인데, 운영한다는 내용이 길어서 it으로 자리를 잡아 두고 진짜 주어는 뒤로 보낸 거예요. 세 번째는 수동태 was used예요. 관람차가 스스로 사용하는 게 아니라 사람들에 의해 사용된 대상이라서 수동태를 쓰고, be동사 뒤에 과거분사 used가 온 겁니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">관람차의 금속은\u003c/span>\u003cspan class=\"en\">The metal from the wheel\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나중에 재활용되었고,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">later \u003c/span>\u003cspan class=\"tgt\">recycled\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그것은 사용되었다\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">used\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">USS 일리노이 전함을 짓는 데\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">build \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">USS \u003c/span>\u003cspan class=\"tgt\">Illinois \u003c/span>\u003cspan class=\"tgt\">battleship\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제1차 세계 대전 때\u003c/span>\u003cspan class=\"en\">in World War I.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">관람차의 금속은 나중에 재활용되었고, 그것은 제1차 세계 대전 때 USS 일리노이 전함을 짓는 데 사용되었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사라진 관람차의 운명을 알려 주는 문장이에요. 철거된 \u003cb class=\"key\">금속\u003c/b>이 버려지지 않고 \u003cb class=\"key\">재활용\u003c/b>되어, 제1차 세계 대전 때 전함을 만드는 재료로 다시 쓰였다는 사실을 전합니다. 두 개의 \u003cb class=\"key\">수동태\u003c/b>를 나란히 써서 '재활용되었다, 사용되었다'라는 과정을 차분히 이어 붙이고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태(be동사 + 과거분사)\u003c/span> : 주어 + be동사 + [과거분사] (+ by 행위자) : \"나중에 재활용되었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태(be동사 + 과거분사)와 대명사 it\u003c/span> : it + be동사 + [과거분사] + to부정사 : \"그것은 사용되었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : [수동태 문장] + to + 동사원형 (~하기 위해, ~하는 데) : \"USS 일리노이 전함을 짓는 데\"\u003c/div>\u003c/div>","segs":[{"n":51,"text":"The metal from the wheel, 관람차의 금속은. was later recycled, 나중에 재활용되었고. and it was used, 그리고 그것은 사용되었다. to build the USS Illinois battleship, USS 일리노이 전함을 짓는 데. in World War I, 제1차 세계 대전 때. 이 문장 전체를 해석하면, 관람차의 금속은 나중에 재활용되었고, 그것은 제1차 세계 대전 때 USS 일리노이 전함을 짓는 데 사용되었다.","hl":"m"},{"n":52,"text":"사라진 관람차가 어떻게 되었는지 알려 주는 문장이에요. 철거된 금속이 그냥 버려진 게 아니라 재활용되어서, 전쟁 중에 전함을 만드는 재료로 다시 태어났다는 거죠. 앞 문장에서 사용이 끝났다고 했으니, 그다음에 그 재료의 두 번째 삶을 보여 주는 흐름입니다.","hl":"mn"},{"n":53,"text":"첫 번째로 was later recycled는 수동태예요. 금속은 재활용하는 쪽이 아니라 재활용되는 대상이니까 be동사 뒤에 과거분사가 온 거죠. 두 번째로 it was used도 수동태인데, 여기서 it은 앞에 나온 the metal을 그대로 받는 대명사예요. 세 번째로 to build는 목적을 나타내는 부사적 용법이에요. 전함을 짓기 위해, 다시 말해 짓는 데 사용되었다는 목적을 붙여 주는 겁니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 15 / 16\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">비록 최초의 대관람차는 없어졌지만,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Although \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">original \u003c/span>\u003cspan class=\"tgt\">Ferris \u003c/span>\u003cspan class=\"tgt\">wheel \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">gone\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 많은 사람들에게 영감을 주었다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">inspired \u003c/span>\u003cspan class=\"tgt\">many \u003c/span>\u003cspan class=\"tgt\">people\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">비록 최초의 대관람차는 없어졌지만, 그것은 많은 사람들에게 영감을 주었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 지문의 결론 역할을 해요. 최초의 관람차는 실제로 \u003cb class=\"key\">존재\u003c/b>하지 않지만, 그 사실이 가치를 떨어뜨리지는 않는다는 뜻을 담고 있죠. \u003cb class=\"key\">Although\u003c/b>로 '없어졌다'는 아쉬움을 먼저 인정한 뒤, '많은 사람들에게 \u003cb class=\"key\">영감\u003c/b>을 주었다'는 긍정적인 결과로 글을 마무리합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">양보의 접속사 Although\u003c/span> : Although + 주어 + 동사, 주어 + 동사 : \"비록 최초의 대관람차는 없어졌지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be동사 + 형용사(gone) 상태 표현\u003c/span> : 주어 + be동사 + [형용사] : \"없어졌다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">인칭대명사 it의 지칭\u003c/span> : it(앞의 명사구를 받음) + 동사 + 목적어 : \"그것은 많은 사람들에게 영감을 주었다\"\u003c/div>\u003c/div>","segs":[{"n":54,"text":"Although the original Ferris wheel is gone, 비록 최초의 대관람차는 없어졌지만. it inspired many people, 그것은 많은 사람들에게 영감을 주었다.. 이 문장 전체를 해석하면, 비록 최초의 대관람차는 없어졌지만, 그것은 많은 사람들에게 영감을 주었다.","hl":"m"},{"n":55,"text":"이 문장이 이 글의 결론이에요. 최초의 관람차는 지금 실제로 남아 있지 않지만, 그렇다고 그 가치가 사라진 건 아니라는 거죠. 오히려 많은 사람에게 영감을 주었다는 긍정적인 결과로 글을 멋지게 닫고 있습니다.","hl":"mn"},{"n":56,"text":"첫 번째로 Although는 양보 접속사예요. 뒤에 오는 절과 반대되는 내용을 먼저 인정하면서 묶어 주기 때문에, 뒤에는 반드시 주어와 동사가 있는 절이 와야 합니다. 두 번째로 is gone은 be동사 뒤에 형용사가 온 상태 표현이에요. 그래서 없어지는 동작이 아니라 지금 없어진 상태를 말하죠. 세 번째로 it은 바로 앞의 the original Ferris wheel을 그대로 받는 인칭대명사예요. 같은 말을 반복하지 않으려고 쓴 지칭이니까 해석할 때는 최초의 관람차로 풀어 주세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 16 / 16\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 현재,\u003c/span>\u003cspan class=\"en\">And now,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은 찾아볼 수 있다\u003c/span>\u003cspan class=\"en\">you \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">find\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">비슷한 놀이기구를\u003c/span>\u003cspan class=\"en\">similar rides\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">축제, 박람회, 그리고 놀이공원에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">carnivals, \u003c/span>\u003cspan class=\"tgt\">fairs, \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">amusement \u003c/span>\u003cspan class=\"tgt\">parks\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전 세계의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">around \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">world\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그리고 현재, 여러분은 전 세계의 축제, 박람회, 그리고 놀이공원에서 비슷한 놀이기구를 찾아볼 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 마지막 문장으로, 원래 관람차는 사라졌지만 그 영향으로 \u003cb class=\"key\">비슷한 \u003c/b>\u003cb class=\"key\">놀이기구\u003c/b>가 \u003cb class=\"key\">전 \u003c/b>\u003cb class=\"key\">세계\u003c/b> 여러 장소에 퍼져 있음을 보여 줘요. 앞 문장의 \u003cb class=\"key\">영감을 \u003c/b>\u003cb class=\"key\">준\u003c/b> 내용을 현재의 모습으로 마무리하며 글 전체를 정리하는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 can의 가능 표현\u003c/span> : 주어 + can + [동사원형] : \"찾아볼 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 병렬 구조\u003c/span> : at + [명사 A], [명사 B], and [명사 C] : \"축제, 박람회, 그리고 놀이공원에서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사구의 수식 역할\u003c/span> : around + the world : \"전 세계의, 전 세계에 있는\"\u003c/div>\u003c/div>","segs":[{"n":57,"text":"And now, 그리고 현재. you can find, 여러분은 찾아볼 수 있다. similar rides, 비슷한 놀이기구를. at carnivals, fairs, and amusement parks, 축제, 박람회, 그리고 놀이공원에서. around the world, 전 세계의. 이 문장 전체를 해석하면, 그리고 현재, 여러분은 전 세계의 축제, 박람회, 그리고 놀이공원에서 비슷한 놀이기구를 찾아볼 수 있다.","hl":"m"},{"n":58,"text":"이 문장은 원래 관람차가 사라진 뒤에도 그 영향으로 비슷한 놀이기구가 전 세계 여러 곳에 퍼져 있음을 보여 줘요. 앞에서 말한 영감을 준 내용을 현재의 모습으로 마무리하면서 글 전체를 정리하는 역할을 합니다.","hl":"mn"},{"n":59,"text":"첫 번째로 can find에서 can은 가능을 나타내는 조동사이고 뒤에는 동사원형 find가 와요. 두 번째로 at carnivals, fairs, and amusement parks에서 at이 세 장소를 공통으로 이끄는 병렬 구조예요. 세 번째로 around the world는 전치사구로 앞의 장소들을 꾸며 전 세계의라는 의미를 더해 줍니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>대관람차는 크고 수직으로 세워진 바퀴의 가장자리에 \u003cb class=\"key\">객차\u003c/b>가 달려 있고, 바퀴가 회전하며 승객에게 멋진 \u003cb class=\"key\">전망\u003c/b>을 제공하는 놀이 기구예요.\u003c/li>\u003cli>최초의 대관람차는 1893년 \u003cb class=\"key\">George \u003c/b>\u003cb class=\"key\">W. \u003c/b>\u003cb class=\"key\">G. \u003c/b>\u003cb class=\"key\">Ferris\u003c/b>가 시카고 \u003cb class=\"key\">세계 \u003c/b>\u003cb class=\"key\">박람회\u003c/b>를 위해 만들었고, \u003cb class=\"key\">에펠탑\u003c/b>만큼 유명해지기를 바랄 만큼 큰 \u003cb class=\"key\">성공\u003c/b>을 거두었어요.\u003c/li>\u003cli>최초의 관람차는 36개의 큰 \u003cb class=\"key\">객차\u003c/b>와 60개의 \u003cb class=\"key\">좌석\u003c/b>을 갖추어 \u003cb class=\"key\">승객 \u003c/b>\u003cb class=\"key\">수용력\u003c/b>이 2,160명에 이르렀지만, \u003cb class=\"key\">운영비\u003c/b>가 많이 들어 1906년까지만 사용되었어요.\u003c/li>\u003cli>그 금속은 \u003cb class=\"key\">재활용\u003c/b>되어 USS 일리노이 전함에 쓰였고, 원래의 관람차는 \u003cb class=\"key\">사라졌지만\u003c/b> 많은 사람에게 \u003cb class=\"key\">영감\u003c/b>을 주어 오늘날 \u003cb class=\"key\">비슷한 \u003c/b>\u003cb class=\"key\">놀이기구\u003c/b>로 이어졌어요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The first Ferris wheel, built for the 1893 World's Fair, was an impressive success because of its huge size, and although it was expensive to operate and was eventually recycled, it inspired many similar rides around the world.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">이 글은 크고 수직으로 세워진 바퀴의 가장자리에 \u003cb class=\"key\">객차\u003c/b>가 달려 돌아가며 승객에게 전망을 제공하는 대관람차의 원리를 소개해요. 이어 1893년 세계 박람회를 위해 발명된 최초의 대관람차가 \u003cb class=\"key\">거대한 \u003c/b>\u003cb class=\"key\">크기\u003c/b>로 큰 성공을 거두었지만 \u003cb class=\"key\">운영비\u003c/b> 문제로 1906년까지만 사용되었고, 이후 \u003cb class=\"key\">재활용\u003c/b>되면서도 많은 사람에게 \u003cb class=\"key\">영감\u003c/b>을 주었다는 내용을 담고 있어요.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":60,"text":"오늘 내용을 정리해 볼게요. 대관람차는 크고 수직으로 세워진 바퀴의 가장자리에 객차가 달려 있고, 바퀴가 회전하며 승객에게 멋진 전망을 제공하는 놀이 기구예요. 최초의 관람차는 George W. G. Ferris가 시카고 세계 박람회를 위해 만들었고 에펠탑만큼 유명해지기를 바랄 만큼 큰 성공을 거두었으며, 큰 객차와 좌석 덕분에 승객 수용력이 이천백육십 명에 이르렀지만 운영비가 많이 들어 천구백육 년까지만 사용되었어요. 그 금속은 재활용되어 USS Illinois 전함에 쓰였고, 원래의 관람차는 사라졌지만 많은 사람에게 영감을 주어 오늘날 비슷한 놀이기구로 이어졌다는 점을 기억해 주세요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
