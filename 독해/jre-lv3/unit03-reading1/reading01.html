An+X+e/17Ufh/n/61NLqMZYc5x7464+nf+lG5cdRz7jn88f8A1xSv/wAP67feAuQOOnOB/L39DjPpS/pTQVODkc5xyMnHXHrwOR2xzjFNVlzgkZPTpg89vXBPXn1zTvf5aASUf5/z9P8APek3D1Hc9fTr+WaQMCAc/e6Y784yPb3+nrQA6imh1PcckgcjnHp68c8dKXcMjkc9ORz+vP4CgV/P8vKy+f8AXQDzx6/X+n+PNL/KmgjJ+YY7cg5wOfpj279e1G4E4yDx/Pt75o/r7g6/f+m3l3HUU3cpJ5HHuO3X8u/p3x3XI4yevTJ6n8Dg/r7UDv8Ap+Owvr/n+n4fTGaKbleBlcsTgZGTj09SO+Onfpmgso7jqB1HfHv05/nQA6k6Z/P/AD/n9AKaGBzkjgnv6dfy/QYz6kLd8ggE9+vpjnnuD15HQYJC0+/9fMB/+T+X/wCr8KP8/WkyDzkY57+n48Y75/Gk3L6jkdcj8O/v6Ef1Yf1/XYXrkenUEZ69D/n9KWmhgRwRjp1Hbr0z0/ljn0CygdR6dR9PWgB1FM3qB1HBIGCD04PftnnPTjPOKduGQMjnp7/Q9KA+YuP0o/z/AJ/+tgUZ/X+tNLLwMjnGORz6Eev4d8etAf1+Q6mtnacdRz6f5/ofcUvHcgjqPwHP+e38kbADN3Cn34Az070X0v03A//Z\" alt=\"\"></div>","<div class=\"lec-cover-title\">The Remarkable History of the Original Ferris Wheel<small>최초 대관람차의 놀라운 역사</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">오늘날 놀이공원의 상징인 대관람차(Ferris wheel)를 제대로 이해하려면, 당시 기술적 도전이었던 1893년 시카고 만국박람회(World’s Fair)의 역사적 맥락을 알 필요가 있어요. 당시 조지 페리스(George W.G. Ferris)는 프랑스의 에펠탑(Eiffel Tower)에 대항하기 위해 강철 구조물 기술을 활용해 이 거대한 회전 기계를 설계했는데, 이는 단순히 놀이기구를 넘어 당대 최첨단 공학의 집약체였답니다. 마치 요즘 우리가 초고층 빌딩을 보며 경외심을 느끼는 것과 비슷하다고 볼 수 있죠. 또한, 이 거대한 시설은 운영 비용 문제로 1906년에 철거되었지만, 그 철재가 제1차 세계대전 당시 전함(battleship)으로 재활용된 일화는 자원 순환과 근대 산업사를 관통하는 매우 흥미로운 사례예요. 이처럼 대관람차는 단순한 유희 시설을 넘어, 인류의 도전 정신과 시대적 기술력이 결합된 상징물로 기억되고 있답니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01대관람차의 정의와 기능</div><ul><li>오늘날 놀이공원에서 흔히 볼 수 있는 대관람차의 구조와 특징을 설명합니다.</li><li>거대한 수직 바퀴(upright wheel) 형태의 놀이기구</li><li>회전하며 공원 전체를 조망(great view)하는 기능</li><li>핵심 키워드: 대관람차(Ferris wheel)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02발명 배경과 목적</div><ul><li>1893년 시카고 만국박람회를 위해 조지 페리스가 발명한 배경을 다룹니다.</li><li>엔지니어 조지 페리스(George W.G. Ferris)의 발명</li><li>에펠탑(Eiffel Tower)에 버금가는 명성을 목표로 제작</li><li>핵심 키워드: 세계 박람회(World’s Fair)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03초기 모델의 압도적 규모</div><ul><li>초기 페리스 휠은 현대의 관람차보다 훨씬 거대한 수용력을 갖췄습니다.</li><li>36개의 대형 탑승 칸(passenger cars) 보유</li><li>한 번에 2,160명을 동시에 수용 가능한 규모</li><li>핵심 키워드: 탑승 인원(capacity)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04운영 중단과 자원의 재활용</div><ul><li>높은 운영 비용으로 인해 짧은 기간만 사용된 후의 운명을 설명합니다.</li><li>막대한 운영비(expensive to operate) 문제로 1906년 폐쇄</li><li>해체된 금속 부품은 전함 건조에 재활용(recycled)됨</li><li>핵심 키워드: 유에스에스 일리노이(USS Illinois)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05현대적 유산과 영향</div><ul><li>원형은 사라졌지만 오늘날 전 세계적인 놀이기구로 자리 잡았습니다.</li><li>많은 사람들에게 영감(inspired)을 준 혁신적인 발명품</li><li>오늘날 전 세계 축제와 놀이공원의 필수 놀이기구로 정착</li><li>핵심 키워드: 현대적 유산(legacy)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">upright</td><td class=\"m\">똑바로 선, 수직의</td></tr><tr><td class=\"w\">rotate</td><td class=\"m\">회전하다, 순환하다</td></tr><tr><td class=\"w\">invent</td><td class=\"m\">발명하다, 고안하다</td></tr><tr><td class=\"w\">engineer</td><td class=\"m\">기술자, 엔지니어</td></tr><tr><td class=\"w\">invention</td><td class=\"m\">발명품, 발명</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">success</td><td class=\"m\">성공, 성과</td></tr><tr><td class=\"w\">impressive</td><td class=\"m\">인상적인, 감명 깊은</td></tr><tr><td class=\"w\">operate</td><td class=\"m\">작동하다, 운영하다</td></tr><tr><td class=\"w\">recycle</td><td class=\"m\">재활용하다, 재생하다</td></tr><tr><td class=\"w\">inspire</td><td class=\"m\">영감을 주다, 고무하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">요즈음</span><span class=\"en\"><b>These days,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">대관람차는</span><span class=\"en\"><b>Ferris wheels</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인기 있는 놀이 기구이다</span><span class=\"en\"><b><span class=\"grammar-hl\">are</span> popular rides</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">놀이공원에서</span><span class=\"en\"><b>at amusement parks.</b></span></div></div><div class=\"lec-sent-ko\">오늘날 대관람차는 놀이공원에서 인기 있는 놀이 기구이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 관람차라는 대상이 현대 사회에서 대중적인 오락 시설로 자리 잡고 있음을 소개하며 글을 시작합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are 2형식 구조: 주어(Ferris wheels) + be동사(are) + 보어(popular rides)로 주어의 상태를 설명합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것들은</span><span class=\"en\"><b>They</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">크고 수직으로 세워진 바퀴이다</span><span class=\"en\"><b>are large, <span class=\"grammar-hl\">upright</span> wheels,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그것들은 객차를 가지고 있다</span><span class=\"en\"><b>and they have passenger cars</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가장자리 주변에</span><span class=\"en\"><b>around the edge</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들이 탈 수 있는</span><span class=\"en\"><b><span class=\"grammar-hl\">for people to ride in</span>.</b></span></div></div><div class=\"lec-sent-ko\">그것들은 크고 수직으로 세워진 바퀴이며, 그것들은 가장자리 주변으로 사람들이 타는 객차를 가지고 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 관람차의 외형적 특징과 구조를 구체적으로 묘사하여 독자의 이해를 돕습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">upright 형용사: 명사(wheels)를 수식하는 형용사로 &#39;수직의&#39;라는 의미로 구조적 역할을 합니다.</div><div class=\"lec-gr-item\">for people to ride in (to부정사): 사람(people)이 탈(to ride in) 공간이라는 의미로, 앞의 명사(passenger cars)를 수식하는 형용사적 용법입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">upright</td><td class=\"m\">똑바로 선, 수직의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">바퀴가 회전하면서</span><span class=\"en\"><b><span class=\"grammar-hl\">As the wheel rotates</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">승객들은</span><span class=\"en\"><b>passengers</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">멋진 전망을 얻는다</span><span class=\"en\"><b>get a great view</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">공원의</span><span class=\"en\"><b>of the park.</b></span></div></div><div class=\"lec-sent-ko\">바퀴가 돌면서, 승객들은 공원의 멋진 전망을 본다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 관람차의 작동 방식과 그것을 탔을 때 사람들이 얻게 되는 경험을 연결하여 관람차의 매력을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">As the wheel rotates (부사절): 접속사 As가 이끄는 절로, 주절의 사건이 일어나는 시점(때)을 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">rotate</td><td class=\"m\">회전하다, 순환하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">바로 그 최초의 대관람차는</span><span class=\"en\"><b>The very first Ferris wheel</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">발명되었다</span><span class=\"en\"><b><span class=\"grammar-hl\">was invented</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">1893년에</span><span class=\"en\"><b>in 1893</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">조지 W.G. 페리스에 의해</span><span class=\"en\"><b>by George W.G. Ferris.</b></span></div></div><div class=\"lec-sent-ko\">최초의 대관람차는 1893년에 조지 W.G. 페리스에 의해 발명되었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 관람차의 현재 모습에서 시선을 돌려, 이것이 언제 누구에 의해 시작되었는지 기원을 밝히는 대목입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was invented (수동태): be동사(was)+p.p.(invented) 구조입니다. invent는 타동사인데 목적어가 없어서 수동구조 was invented 형태로 씁니다. 기본구조: S + invent + O(목적어).</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">invent</td><td class=\"m\">발명하다, 고안하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">페리스는</span><span class=\"en\"><b>Ferris</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">엔지니어였다</span><span class=\"en\"><b>was an engineer,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그는 만들기를 원했다</span><span class=\"en\"><b>and he wanted <span class=\"grammar-hl\">to build</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">놀라운 무언가를</span><span class=\"en\"><b><span class=\"grammar-hl\">something amazing</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">세계 박람회를 위한</span><span class=\"en\"><b>for the World’s Fair</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">시카고, 일리노이에서 열린</span><span class=\"en\"><b>in Chicago, Illinois.</b></span></div></div><div class=\"lec-sent-ko\">페리스는 엔지니어였고, 그는 일리노이 주의 시카고에서 열린 세계 박람회를 위한 어떤 놀라운 것을 만들어 내기를 원했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 발명가인 페리스가 왜 이 거대한 구조물을 기획했는지, 그 창의적인 동기를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to build something amazing (to부정사): 동사(wanted)의 목적어 역할을 하는 명사적 용법입니다. something은 형용사 amazing의 수식을 받습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">engineer</td><td class=\"m\">기술자, 엔지니어</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 바랐다</span><span class=\"en\"><b>He hoped</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신의 발명품이</span><span class=\"en\"><b><span class=\"grammar-hl\">his invention</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">되기를</span><span class=\"en\"><b><span class=\"grammar-hl\">would be</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">유명해지기를</span><span class=\"en\"><b>as famous</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">에펠탑만큼</span><span class=\"en\"><b>as the Eiffel Tower.</b></span></div></div><div class=\"lec-sent-ko\">그는 자신의 발명품이 에펠탑만큼 유명해지기를 바랐다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 당시 가장 상징적인 건축물이었던 에펠탑과 자신의 발명품을 나란히 놓음으로써, 페리스가 가졌던 거대한 야망을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">his invention would be (명사절): hope의 목적어 역할을 하는 that절(접속사 that 생략)입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">invent</td><td class=\"m\">발명하다, 고안하다</td></tr><tr><td class=\"w\">invention</td><td class=\"m\">발명품, 발명</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그리고 운 좋게도</span><span class=\"en\"><b>And luckily,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은</span><span class=\"en\"><b><span class=\"grammar-hl\">it</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">큰 성공이었다</span><span class=\"en\"><b><span class=\"grammar-hl\">was a huge success</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 박람회에서</span><span class=\"en\"><b>at the fair.</b></span></div></div><div class=\"lec-sent-ko\">그리고 다행스럽게도, 그것은 박람회에서 큰 성공을 거두었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 문장에서 표현한 페리스의 희망이 현실에서 실제로 어떻게 나타났는지 결과로써 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">it was a huge success 2형식 구조: 대명사 it이 주어, be동사가 서술어, a huge success가 주격 보어 역할을 합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">success</td><td class=\"m\">성공, 성과</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">대관람차는</span><span class=\"en\"><b>The Ferris wheel</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">특히 인상적이었다</span><span class=\"en\"><b><span class=\"grammar-hl\">was</span> especially impressive</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것의 크기 때문에</span><span class=\"en\"><b>because of its size.</b></span></div></div><div class=\"lec-sent-ko\">대관람차는 그것의 크기 때문에 특히 인상적이었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 왜 이 발명품이 당시 사람들을 사로잡았는지, 그 성공 요인 중 하나인 압도적인 크기를 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was 2형식 구조: be동사를 사용하여 주어(The Ferris wheel)의 상태를 설명합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">impressive</td><td class=\"m\">인상적인, 감명 깊은</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">현대의 대관람차는</span><span class=\"en\"><b>Modern Ferris wheels</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">보통 20개의 객차를 가진다</span><span class=\"en\"><b>usually have 20 <span class=\"grammar-hl\">passenger</span> cars,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 각각은</span><span class=\"en\"><b>and each one</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">단지 수용할 수 있다</span><span class=\"en\"><b>can only hold</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">소수의 사람들만을</span><span class=\"en\"><b>a few people.</b></span></div></div><div class=\"lec-sent-ko\">현대의 대관람차는 보통 20개의 객차가 있고, 각 객차는 오직 소수의 사람들만 수용할 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 과거와 현대의 관람차를 비교하기 위해 현대적 기준을 먼저 제시하여 대비의 기초를 마련합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">passenger 명사 수식: 명사(cars) 앞에 위치하여 용도를 나타내는 명사적 수식어구입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만 최초의 바퀴는</span><span class=\"en\"><b>But the original wheel</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">36개의 커다란 객차를 가지고 있었다</span><span class=\"en\"><b><span class=\"grammar-hl\">had</span> 36 large passenger cars,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 각각은</span><span class=\"en\"><b>and each one</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">60개의 좌석을 가지고 있었다</span><span class=\"en\"><b><span class=\"grammar-hl\">had</span> 60 seats.</b></span></div></div><div class=\"lec-sent-ko\">그러나 최초의 관람차는 36개의 커다란 객차들이 있었고, 각 객차에는 60개의 좌석들이 있었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 현대 관람차와의 비교를 통해, 1893년 당시의 관람차가 얼마나 거대한 규모였는지를 구체적인 수치로 증명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">had 3형식 구조: 주어(each one) + 타동사(had) + 목적어(60 seats)를 취하는 문장 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 11 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그래서 2,160명의 사람들이</span><span class=\"en\"><b>So 2,160 people</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것을 탈 수 있었다</span><span class=\"en\"><b><span class=\"grammar-hl\">could ride</span> it</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한 번에</span><span class=\"en\"><b>at once!</b></span></div></div><div class=\"lec-sent-ko\">그래서 2,160명의 사람들이 한 번에 그것을 탈 수 있었다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 수치를 합산하여, 당시 관람차의 엄청난 수용 능력을 감탄을 섞어 표현합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">could ride 조동사 구문: 조동사(could) 뒤에 동사원형(ride)을 사용하여 가능의 의미를 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 12 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">문제는</span><span class=\"en\"><b>The problem,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만</span><span class=\"en\"><b>however,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">~였다는 것이다</span><span class=\"en\"><b>was</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것이 매우 비쌌다는 것</span><span class=\"en\"><b><span class=\"grammar-hl\">that it was very expensive</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">운영하기에</span><span class=\"en\"><b><span class=\"grammar-hl\">to operate</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그래서 그것은 단지 사용되었다</span><span class=\"en\"><b>so it <span class=\"grammar-hl\">was only used</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">1906년까지만</span><span class=\"en\"><b>until 1906.</b></span></div></div><div class=\"lec-sent-ko\">그러나 문제는 그것이 운영하기에 너무 비쌌다는 것이었고, 그래서 그것은 1906년까지만 사용되었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 화려한 성공 뒤에 숨겨진 현실적인 경제적 한계를 지적하며 최초의 관람차가 사라지게 된 이유를 밝힙니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that it was very expensive to operate (보어절): be동사 뒤에 위치하여 주어(The problem)를 보충 설명하는 명사절(that절)입니다.</div><div class=\"lec-gr-item\">was only used (수동태): be동사(was)+p.p.(used) 구조입니다. use는 타동사인데 목적어가 없어서 수동구조 was used 형태로 씁니다. 기본구조: S + use + O(목적어).</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">operate</td><td class=\"m\">작동하다, 운영하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 13 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">금속은</span><span class=\"en\"><b>The metal</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 바퀴로부터 나온</span><span class=\"en\"><b>from the wheel</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나중에 재활용되었다</span><span class=\"en\"><b>was later <span class=\"grammar-hl\">recycled</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그것은</span><span class=\"en\"><b>and it</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사용되었다</span><span class=\"en\"><b><span class=\"grammar-hl\">was used</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">USS 일리노이 전함을 짓는 데</span><span class=\"en\"><b><span class=\"grammar-hl\">to build</span> the USS Illinois battleship</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">제1차 세계 대전에서</span><span class=\"en\"><b>in World War I.</b></span></div></div><div class=\"lec-sent-ko\">관람차의 금속은 나중에 재활용되었고, 그것은 제1차 세계 대전 때 USS 일리노이 전함을 짓는 데 사용되었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 폐기된 구조물이 버려지는 데 그치지 않고 새로운 용도로 활용되었다는 역사적 사실을 덧붙입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">recycled (수동태): be동사(was)+p.p.(recycled) 구조입니다. recycle은 타동사인데 목적어가 없어서 수동구조 was recycled 형태로 씁니다. 기본구조: S + recycle + O(목적어).</div><div class=\"lec-gr-item\">was used to build (수동태): be동사(was)+p.p.(used) 구조입니다. use는 타동사인데 목적어가 없어서 수동구조 was used 형태로 씁니다. 기본구조: S + use + O(목적어) + toV. to build는 목적을 나타내는 to부정사 부사적 용법입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">recycle</td><td class=\"m\">재활용하다, 재생하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 14 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">비록 최초의 대관람차는</span><span class=\"en\"><b><span class=\"grammar-hl\">Although the original Ferris wheel</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사라졌지만</span><span class=\"en\"><b><span class=\"grammar-hl\">is gone</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은</span><span class=\"en\"><b>it</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">영감을 주었다</span><span class=\"en\"><b>inspired</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 사람들에게</span><span class=\"en\"><b>many people.</b></span></div></div><div class=\"lec-sent-ko\">비록 최초의 대관람차는 없어졌지만, 그것은 많은 사람들에게 영감을 주었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 물리적인 형태는 소멸했어도 정신적인 유산은 남았음을 언급하며 글을 마무리할 준비를 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Although the original Ferris wheel is gone 양보 부사절: 접속사 Although가 이끄는 절로, 주절과 대조되는 상황을 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">inspire</td><td class=\"m\">영감을 주다, 고무하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 15 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그리고 이제</span><span class=\"en\"><b>And now,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분은</span><span class=\"en\"><b>you</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">찾을 수 있다</span><span class=\"en\"><b>can find</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">비슷한 놀이기구를</span><span class=\"en\"><b><span class=\"grammar-hl\">similar rides</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">축제, 박람회, 그리고 놀이공원에서</span><span class=\"en\"><b>at carnivals, fairs, and amusement parks</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">전 세계의</span><span class=\"en\"><b><span class=\"grammar-hl\">around the world</span>.</b></span></div></div><div class=\"lec-sent-ko\">그리고 현재, 여러분은 전 세계의 축제, 박람회, 그리고 놀이공원에서 비슷한 놀이기구를 찾아볼 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 과거의 발명품이 현대에 이르러 어떻게 대중화되고 정착되었는지 결론을 내립니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">similar rides 형용사 수식: 형용사(similar)가 명사(rides)를 직접 수식하는 구조입니다.</div><div class=\"lec-gr-item\">around the world (관용표현): 전치사구로 &#39;전 세계에 걸쳐&#39;라는 의미의 부사적 표현입니다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>관람차는 오늘날 놀이공원에서 흔히 볼 수 있는 인기 놀이기구이다.</li><li>1893년 엔지니어 조지 페리스가 에펠탑에 버금가는 건축물을 꿈꾸며 처음 발명했다.</li><li>당시의 관람차는 현대 것보다 훨씬 거대했으나, 막대한 운영 비용 문제로 1906년에 철거되었다.</li><li>철거된 관람차의 금속은 전함 재료로 쓰였고, 이후 관람차는 오늘날 전 세계 놀이공원의 필수 시설로 자리 잡았다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The original Ferris wheel was an engineering marvel at the 1893 World&#39;s Fair, but it was dismantled after years of operation to provide materials for a battleship.</div>\n              <div class=\"lec-final-sum-ko\">최초의 대관람차는 1893년 세계 박람회에서 공학적 경이로움을 보여주었으나, 운영 후 해체되어 전함 건조를 위한 자재로 재활용되었다.</div></div></div>"],"segs":[[{"audio":"./reading01_audio/1.mp3","hl":null}],[{"audio":"./reading01_audio/2.mp3","hl":null}],[{"audio":"./reading01_audio/3.mp3","hl":null},{"audio":"./reading01_audio/4.mp3","hl":"stage-0"},{"audio":"./reading01_audio/5.mp3","hl":"stage-1"},{"audio":"./reading01_audio/6.mp3","hl":"stage-2"},{"audio":"./reading01_audio/7.mp3","hl":"stage-3"},{"audio":"./reading01_audio/8.mp3","hl":"stage-4"}],[{"audio":"./reading01_audio/9.mp3","hl":null}],[{"audio":"./reading01_audio/10.mp3","hl":"main"},{"audio":"./reading01_audio/11.mp3","hl":"meaning"},{"audio":"./reading01_audio/12.mp3","hl":"grammar"}],[{"audio":"./reading01_audio/13.mp3","hl":"main"},{"audio":"./reading01_audio/14.mp3","hl":"meaning"},{"audio":"./reading01_audio/15.mp3","hl":"grammar"}],[{"audio":"./reading01_audio/16.mp3","hl":"main"},{"audio":"./reading01_audio/17.mp3","hl":"meaning"},{"audio":"./reading01_audio/18.mp3","hl":"grammar"}],[{"audio":"./reading01_audio/19.mp3","hl":"main"},{"audio":"./reading01_audio/20.mp3","hl":"meaning"},{"audio":"./reading01_audio/21.mp3","hl":"grammar"}],[{"audio":"./reading01_audio/22.mp3","hl":"main"},{"audio":"./reading01_audio/23.mp3","hl":"meaning"},{"audio":"./reading01_audio/24.mp3","hl":"grammar"}],[{"audio":"./reading01_audio/25.mp3","hl":"main"},{"
