ec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01번아웃 증후군의 개념</div><ul><li>과도한 업무로 인해 신체적, 정신적 에너지가 고갈되는 상태를 의미한다.</li><li>증상: 극심한 피로감과 의욕 상실 (exhaustion)</li><li>정의: 번아웃 증후군 (burnout syndrome)</li><li>핵심 키워드: 번아웃(burnout), 우울감(depressed)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02번아웃 위험군</div><ul><li>모든 직종이 스트레스를 유발하지만, 특정 업무 환경에서 번아웃이 더 빈번하게 발생한다.</li><li>대인 업무 종사자: 교사, 간호사, 경찰관 (teachers, nurses, police officers)</li><li>불규칙한 근무 시간 (irregular hours)</li><li>업무 성격에 따른 스트레스 차이 (job-related stress)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03예방 및 해결책</div><ul><li>건강한 직장 환경 조성과 주변의 관심이 번아웃 극복의 핵심이다.</li><li>존중과 신뢰가 기반이 된 업무 환경 (work environments)</li><li>관리자의 조기 증상 인지 및 지원 (identify signs)</li><li>소통과 지지 체계의 중요성 (communication, support group)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">stay up</td><td class=\"m\">자지 않고 깨어 있다, 밤을 새우다</td></tr><tr><td class=\"w\">barely</td><td class=\"m\">간신히, 겨우, 거의 ~않다</td></tr><tr><td class=\"w\">depressed</td><td class=\"m\">우울한, 의기소침한</td></tr><tr><td class=\"w\">burnout</td><td class=\"m\">극도의 피로, 소진</td></tr><tr><td class=\"w\">stress out</td><td class=\"m\">~에게 스트레스를 주다, ~을 지치게 하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">in addition</td><td class=\"m\">게다가, 더하여</td></tr><tr><td class=\"w\">at risk</td><td class=\"m\">위험에 처한</td></tr><tr><td class=\"w\">identify</td><td class=\"m\">확인하다, 발견하다, 찾다</td></tr><tr><td class=\"w\">overcome</td><td class=\"m\">극복하다, 이겨내다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">지난주 동안</span><span class=\"en\"><b>For the past week,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">마크는 매일 밤늦게까지 깨어 있었다</span><span class=\"en\"><b>Mark has been staying up late every night</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">큰 회사 발표를 준비하면서</span><span class=\"en\"><b><span class=\"grammar-hl\">working on a big company presentation</span>.</b></span></div></div><div class=\"lec-sent-ko\">지난주 동안, 마크는 중요한 회사 발표를 준비하며 매일 밤늦도록 깨어 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 마크가 겪고 있는 피로의 직접적인 원인을 제시하며, 이어질 번아웃 증후군에 대한 구체적인 상황을 설정합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">working on a big company presentation (현재분사): working이 주어 Mark의 동작 상태를 보충 설명하는 분사구문으로 쓰임. &#39;~하며/일하며&#39;라는 의미로 동작을 나타냄.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 너무 피곤하다</span><span class=\"en\"><b>He is <span class=\"grammar-hl\">so tired</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 결과 눈을 거의 뜨고 있지 못할 정도로</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> he can barely keep his eyes open.</b></span></div></div><div class=\"lec-sent-ko\">그는 너무 피곤해서 눈을 거의 뜨고 있지 못한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급된 과도한 업무의 결과로 마크가 신체적 한계에 다다랐음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">so tired that (관용표현): so ~ that 구문으로, &#39;너무 ~해서 ~하다&#39;라는 결과를 나타내는 부사절을 이끄는 구조.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">barely</td><td class=\"m\">간신히, 겨우, 거의 ~않다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 예전에는 이 일을 좋아했었다</span><span class=\"en\"><b>He <span class=\"grammar-hl\">used to like</span> this job,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 최근에는</span><span class=\"en\"><b>but lately</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아무것도 없다</span><span class=\"en\"><b>there is <span class=\"grammar-hl\">nothing</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그가 그것에 대해 즐기는 것이</span><span class=\"en\"><b><span class=\"grammar-hl\">he enjoys</span> about it.</b></span></div></div><div class=\"lec-sent-ko\">그는 이 일을 좋아했었지만, 최근에는 이 일에 대해 즐기는 것이 아무것도 없다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 직무에 대한 애정 상실을 통해 마크의 심리적 변화를 드러내며 상태가 악화되었음을 알립니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">used to like (관용표현): used to + 동사원형 구조로, &#39;과거에는 ~하곤 했다(현재는 그렇지 않다)&#39;는 과거의 습관이나 상태를 나타냄.</div><div class=\"lec-gr-item\">nothing he enjoys (관계대명사): nothing과 he 사이에는 목적격 관계대명사(that 또는 which)가 생략되어 있으며, 뒤에 enjoys의 목적어가 빠진 불완전한 절이 nothing을 수식함.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 우울함을 느끼기 시작하고 있다.</span><span class=\"en\"><b>He’s <span class=\"grammar-hl\">starting to feel</span> depressed.</b></span></div></div><div class=\"lec-sent-ko\">그는 우울해지기 시작하고 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 업무로 인한 부정적 감정이 개인의 정신적 영역까지 침범하고 있음을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">starting to feel (to부정사): feel을 목적어로 취하는 start의 목적어 역할을 하는 명사적 용법임.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">depressed</td><td class=\"m\">우울한, 의기소침한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것은 한 예이다</span><span class=\"en\"><b><span class=\"grammar-hl\">This is</span> an example</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">&#39;번아웃 증후군&#39;의</span><span class=\"en\"><b>of “burnout syndrome.”</b></span></div></div><div class=\"lec-sent-ko\">이것은 ‘번아웃 증후군’의 한 예이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 마크의 구체적인 상황을 &#39;번아웃 증후군&#39;이라는 의학적, 사회적 개념으로 연결하여 정의합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">This is (관용표현): 주어(This)의 상태를 설명하는 기본 SVC(2형식) 구조임.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">burnout</td><td class=\"m\">극도의 피로, 소진</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">많은 사람들이 이것을 경험한다</span><span class=\"en\"><b>Many people experience this</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 너무 열심히 일할 때</span><span class=\"en\"><b><span class=\"grammar-hl\">when they work</span> too hard</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매우 오랫동안</span><span class=\"en\"><b>for a very long time.</b></span></div></div><div class=\"lec-sent-ko\">많은 사람들이 매우 오랫동안 너무 열심히 일할 때 이것을 경험한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 번아웃 증후군이 개인적인 문제에 국한되지 않고, 현대 사회에서 흔히 나타나는 보편적 현상임을 지적합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">when they work (관계부사): when이 시간을 나타내는 부사절을 이끌며, 특정 시점을 설명하는 구조임.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">1970년대 중반 이후로</span><span class=\"en\"><b>Since the mid-1970s,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">과학자들은 번아웃에 대해 연구해 오고 있다</span><span class=\"en\"><b>scientists have been studying about burnout</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 노동자들을 돕기 위해서</span><span class=\"en\"><b><span class=\"grammar-hl\">so that they can help</span> workers</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 스트레스를 관리하도록</span><span class=\"en\"><b>manage their stress.</b></span></div></div><div class=\"lec-sent-ko\">1970년대 중반 이후로, 과학자들은 일하는 사람들이 그들의 스트레스를 관리하도록 돕기 위해 번아웃(극도의 피로감)에 대해 연구해 오고 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 번아웃을 해결하려는 학문적 노력을 소개하며, 이후 문장에서 제시될 해결책의 근거를 마련합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">so that they can help (관용표현): so that + S + V 구조로, &#39;~하기 위해서&#39;라는 목적을 나타내는 부사절임.</div><div class=\"lec-gr-item\">help workers manage 5형식(SVOC) 구조: help는 준사역동사로, 목적어(workers) 뒤에 목적격보어로 동사원형(manage)이 쓰임.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">burnout</td><td class=\"m\">극도의 피로, 소진</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어떤 직업이든 스트레스를 유발할 수 있다</span><span class=\"en\"><b>Any job can cause stress,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 특정한 직업들이 있는가</span><span class=\"en\"><b>but are there <span class=\"grammar-hl\">certain jobs</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들을 정말로 지치게 만드는</span><span class=\"en\"><b><span class=\"grammar-hl\">that really stress people out</span>?</b></span></div></div><div class=\"lec-sent-ko\">어느 직업이든지 스트레스를 유발할 수 있지만, 정말 사람들에게 스트레스를 주는 특정한 직업들이 있을까?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 모든 직업군에 스트레스가 존재함을 인정하면서도, 특히 더 취약한 직종이 있는지 질문을 던져 독자의 주의를 환기합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">certain jobs that really stress people out (관계대명사): that절 내부에서 that이 주어 역할을 하며, 앞의 선행사(certain jobs)를 수식하는 주격 관계대명사임.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그렇다!</span><span class=\"en\"><b><span class=\"grammar-hl\">Yes!</span></b></span></div></div><div class=\"lec-sent-ko\">그렇다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 질문에 명확한 답변을 제시하며 특정 직업군에서의 높은 스트레스 수치를 확인해 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Yes! (관용표현): 앞 문장의 질문에 동의함을 나타내는 부사적 응답 표현.</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">다른 사람들과 밀접하게 일하는 사람들은</span><span class=\"en\"><b><span class=\"grammar-hl\">People who work closely</span> with other people,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">교사, 간호사, 그리고 경찰관과 같은</span><span class=\"en\"><b>such as teachers, nurses, and police officers,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">종종 보고한다</span><span class=\"en\"><b>often report</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">번아웃된 기분을 느끼는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">feeling burned out</span>.</b></span></div></div><div class=\"lec-sent-ko\">교사, 간호사, 그리고 경찰관과 같이 다른 사람들과 밀접하게 일하는 사람들은 자주 에너지를 다 써버린 것 같은 기분을 느낀다고 말한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 대인 관계가 많은 직종을 예로 들어 스트레스의 강도가 높은 직무의 특징을 구체적으로 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">People who work closely (관계대명사): who가 주어 역할을 하며 앞의 명사(People)를 수식하는 주격 관계대명사절임.</div><div class=\"lec-gr-item\">feeling burned out (현재분사): report의 목적어로 쓰인 동명사(feeling)와, 상태를 설명하는 과거분사(burned out)의 결합임. burned out은 &#39;타버린(소진된)&#39; 상태를 묘사하는 형용사적 과거분사임.</div></div>\n        ","<div class=\"lec-sent-no\">문장 11 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">게다가</span><span class=\"en\"><b>In addition,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">직업을 가진 사람들은</span><span class=\"en\"><b>people with <span class=\"grammar-hl\">jobs</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들에게 불규칙한 시간에 일할 것을 요구하는</span><span class=\"en\"><b><span class=\"grammar-hl\">that require them to work</span> irregular hours</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또한 위험에 처해 있다.</span><span class=\"en\"><b>are also at risk.</b></span></div></div><div class=\"lec-sent-ko\">게다가, 불규칙한 시간에 일해야 하는 직업을 가진 사람들 역시 위험하다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 대인 관계라는 원인 외에 &#39;근무 시간의 불규칙성&#39;이라는 추가적인 위험 요인을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">jobs that require them to work (관계대명사): that은 주격 관계대명사로 선행사(jobs)를 수식함. require는 5형식 동사로 목적어(them) + 목적격보어(to work/to부정사) 구조를 취함.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">in addition</td><td class=\"m\">게다가, 더하여</td></tr><tr><td class=\"w\">at risk</td><td class=\"m\">위험에 처한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 12 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것이 이유이다</span><span class=\"en\"><b><span class=\"grammar-hl\">That’s why</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">근무 환경이 중요한</span><span class=\"en\"><b>work environments are important.</b></span></div></div><div class=\"lec-sent-ko\">그래서 근무 환경이 중요하다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급된 직무상의 스트레스 요인들을 완화하기 위해 기업과 조직 차원의 변화가 필요하다는 결론으로 나아갑니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">That’s why (관계부사): why가 선행사(the reason)가 생략된 채로 결과(이유)를 나타내는 절을 이끄는 구조.</div></div>\n        ","<div class=\"lec-sent-no\">문장 13 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">직원들이 존중받고, 동기 부여가 되고, 신뢰받는다고 느낄 때</span><span class=\"en\"><b><span class=\"grammar-hl\">When employees feel respected, motivated, and trusted</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 자신의 일을 더 즐긴다.</span><span class=\"en\"><b>they enjoy their work more.</b></span></div></div><div class=\"lec-sent-ko\">직원들이 존중받고, 동기 부여가 되고, 신뢰를 받는다고 느낄 때, 그들은 자신의 일을 더 즐긴다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 긍정적인 업무 환경이 가져오는 구체적인 심리적 효과를 설명하며 해결책의 방향성을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">When employees feel respected, motivated, and trusted (과거분사): 각각의 분사(respected, motivated, trusted)가 주어의 상태를 설명하는 보어로 쓰임. &#39;존중받고, 동기부여되고, 신뢰받는&#39;이라는 의미를 갖는 과거분사 형용사들임.</div></div>\n        ","<div class=\"lec-sent-no\">문장 14 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">또한</span><span class=\"en\"><b>Also,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">상사들은</span><span class=\"en\"><b><span class=\"grammar-hl\">bosses</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">번아웃의 징후를 알아챌 수 있는</span><span class=\"en\"><b><span class=\"grammar-hl\">who can identify</span> the signs of burnout</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 잘 도울 수 있을 것이다</span><span class=\"en\"><b>will be better able to <span class=\"grammar-hl\">help</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것을 겪는 사람들을</span><span class=\"en\"><b><span class=\"grammar-hl\">those who have it</span>.</b></span></div></div><div class=\"lec-sent-ko\">또한, 번아웃의 징후를 발견할 수 있는 상사는 그것을 가진 사람들을 더 잘 도와줄 수 있을 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 구성원들의 상태를 살피는 관리자의 역할을 강조하여 실질적인 문제 해결 방법을 제안합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">bosses who can identify (관계대명사): who가 주격 관계대명사로서 선행사(bosses)를 수식하는 절을 이끎.</div><div class=\"lec-gr-item\">help those who have it (관계대명사): who가 those를 수식하며, 뒤에 목적어 it이 있는 완전한 관계대명사절 구조임.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">burnout</td><td class=\"m\">극도의 피로, 소진</td></tr><tr><td class=\"w\">identify</td><td class=\"m\">확인하다, 발견하다, 찾다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 15 / 15</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">번아웃은 심각한 상태이다</span><span class=\"en\"><b>Burnout is a serious condition,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 그것은 극복될 수 있다</span><span class=\"en\"><b>but <span class=\"grammar-hl\">it can be overcome</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">좋은 의사소통을 통해</span><span class=\"en\"><b>through good communication</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 강력한 지지 집단을 통해</span><span class=\"en\"><b>and a strong support group.</b></span></div></div><div class=\"lec-sent-ko\">번아웃은 심각한 문제이지만, 그것은 좋은 의사소통과 강력한 지지집단을 통해 극복될 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글 전체의 내용을 요약하며 번아웃은 예방과 극복이 가능한 문제임을 강조하며 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">it can be overcome (수동태): be동사(be)+과거분사(overcome) 구조. overcome은 타동사인데 목적어가 없어서 수동구조 be overcome 형태로 씀. 기본구조: overcome O (O를 극복하다).</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">burnout</td><td class=\"m\">극도의 피로, 소진</td></tr><tr><td class=\"w\">overcome</td><td class=\"m\">극복하다, 이겨내다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>과도한 업무와 피로가 누적되면 마크처럼 &#39;번아웃 증후군&#39;을 겪을 수 있다.</li><li>번아웃은 장기간의 과로가 원인이며, 특정 직무나 불규칙한 근무 환경에서 더 쉽게 발생한다.</li><li>이를 해결하기 위해서는 직원을 존중하는 업무 환경과 관리자의 세심한 관찰이 필요하다.</li><li>결국 원활한 소통과 주변의 강력한 지원이 있다면 번아웃은 충분히 극복할 수 있는 질환이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Burnout often affects those in high-stress or irregular professions, yet it can be overcome by fostering a supportive environment and prioritizing open communication.</div>\n              <div class=\"lec-final-sum-ko\">번아웃은 종종 스트레스가 높거나 불규칙한 직종 종사자에게 나타나지만, 지지적인 환경을 조성하고 열린 소통을 우선시함으로써 극복될 수 있다.</div></div></div>"],"segs":[[{"audio":"./reading01_audio/1.mp3","hl":null}],[{"audio":"./reading01_audio/2.mp3","hl":nul
