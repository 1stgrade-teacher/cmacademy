<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>쥬니어리딩엑스퍼트3 Unit2_Reading01 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"쥬니어리딩엑스퍼트3 Unit2_Reading01","audioDir":"reading01_audio","preview":false,"count":57,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.400em\">Unit2_Reading01\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">쥬니어리딩엑스퍼트3\u003c/div>\u003ch1>Burnout Syndrome: Why It Happens and How to Overcome It\u003c/h1>\u003ch2>번아웃 증후군, 왜 생기고 어떻게 극복할까\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>요약: 마크의 사례처럼 오랫동안 과도하게 일하면 \u003cb class=\"key\">번아웃 \u003c/b>\u003cb class=\"key\">증후군\u003c/b>이 찾아온다. 사람들과 밀접하게 일하거나 불규칙한 시간에 일하는 직업이 특히 위험하지만, 존중과 신뢰가 있는 \u003cb class=\"key\">근무 \u003c/b>\u003cb class=\"key\">환경\u003c/b>과 좋은 의사소통, 강력한 지지집단을 통해 극복할 수 있다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Burnout syndrome results from working too hard for too long and is especially common in people-oriented or irregular-hour jobs, but it can be overcome through a supportive work environment and good communication.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 번아웃 증후군에 관한 글이에요. 마크라는 직장인이 극도로 지쳐 우울해지는 장면에서 시작해서, 번아웃이 무엇이고 어떤 직업이 특히 위험한지, 그리고 어떻게 극복할 수 있는지까지 차례로 보여 줍니다. 요지는 오랫동안 과도하게 일하면 번아웃이 찾아오지만, 좋은 근무 환경과 의사소통, 지지집단을 통해 충분히 극복할 수 있다는 거예요. 그럼 문장 하나하나 짚어 볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">번아웃(burnout)은 오랫동안 과도한 업무에 시달리면서 생기는 \u003cb class=\"key\">극도의 \u003c/b>\u003cb class=\"key\">피로감\u003c/b>이에요. 세계보건기구(WHO)는 이를 직업과 관련된 현상으로 다루며, 단순한 피곤함과는 다르다고 설명하죠. 증상은 무기력, 냉소, 일에 대한 흥미 상실로 나타나고, 몸의 신호를 무시하면 우울감으로 이어질 수 있어요. 자동차 엔진에 비유하면, 계속 과속으로 달리다 연료가 바닥나 엔진이 꺼져 버린 상태인 거죠. 그래서 전문가들은 \u003cb class=\"key\">휴식\u003c/b>과 대화, 주변의 지지가 회복에 중요하다고 말해요. 교사나 간호사, 경찰관처럼 감정 노동(emotional labor)이 큰 직업은 특히 위험하다고 알려져 있어요.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식부터 짚고 갈게요. 번아웃은 오랫동안 과도한 업무에 시달리면서 생기는 극도의 피로감을 말해요. 세계보건기구는 이것을 직업과 관련된 현상으로 다루면서 단순한 피곤함과는 다르다고 설명하죠. 무기력, 냉소, 일에 대한 흥미 상실 같은 증상이 나타나고, 몸의 신호를 무시하면 우울감으로 이어질 수 있어요. 자동차 엔진에 비유하면 계속 과속으로 달리다 연료가 바닥나 엔진이 꺼져 버린 상태인 거죠. 그래서 전문가들은 휴식과 대화, 주변의 지지가 회복에 중요하다고 말합니다. 교사나 간호사, 경찰관처럼 감정 노동이 큰 직업은 특히 위험하다고 알려져 있어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>마크의 사례\u003csmall>도입 · 문장 1–4\u003c/small>\u003c/h4>\u003cp>글은 마크라는 인물의 일상으로 시작한다. 그는 지난주 동안 중요한 회사 \u003cb class=\"key\">발표\u003c/b>를 준비하며 매일 밤늦도록 일했고, 너무 피곤해서 눈을 거의 뜨고 있지 못한다. 예전에는 이 일을 좋아했지만 최근에는 즐기는 것이 아무것도 없어 \u003cb class=\"key\">우울\u003c/b>해지기 시작한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>개념 정의\u003csmall>정의 · 문장 5–7\u003c/small>\u003c/h4>\u003cp>이것이 바로 \u003cb class=\"key\">번아웃 \u003c/b>\u003cb class=\"key\">증후군\u003c/b>의 한 예이다. 많은 사람들이 매우 오랫동안 너무 열심히 일할 때 이것을 경험한다. 1970년대 중반 이후로 과학자들은 일하는 사람들이 스트레스를 \u003cb class=\"key\">관리\u003c/b>하도록 돕기 위해 번아웃을 연구해 오고 있다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>위험한 직업\u003csmall>질문-답변 · 문장 8–11\u003c/small>\u003c/h4>\u003cp>어느 직업이든 \u003cb class=\"key\">스트레스\u003c/b>를 유발할 수 있지만, 정말 사람들에게 스트레스를 주는 특정한 직업들이 있는지 묻고 곧바로 '그렇다'고 답한다. 교사, 간호사, 경찰관처럼 다른 사람들과 \u003cb class=\"key\">밀접하게\u003c/b> 일하는 사람들이 자주 번아웃을 느낀다고 말한다. 게다가 \u003cb class=\"key\">불규칙한\u003c/b> 시간에 일해야 하는 직업을 가진 사람들 역시 위험하다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>환경과 해결\u003csmall>해결 · 문장 12–15\u003c/small>\u003c/h4>\u003cp>그래서 \u003cb class=\"key\">근무 \u003c/b>\u003cb class=\"key\">환경\u003c/b>이 중요하다고 말한다. 직원들이 존중받고 동기 부여가 되고 신뢰를 받는다고 느낄 때 일을 더 즐기게 되고, 번아웃의 \u003cb class=\"key\">징후\u003c/b>를 발견할 수 있는 상사는 그것을 가진 사람들을 더 잘 도울 수 있다. 마지막으로 번아웃은 심각한 문제지만 좋은 \u003cb class=\"key\">의사소통\u003c/b>과 강력한 지지집단을 통해 극복될 수 있다고 정리한다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 마크의 사례에서 시작해 개념, 위험 요소, 해결책으로 이어지는 흐름을 따라가 볼게요.","hl":null},{"n":4,"text":"먼저 첫 번째 단계는 마크의 사례예요. 마크는 지난주 동안 중요한 회사 발표를 준비하느라 매일 밤늦도록 깨어 있었고, 너무 피곤해서 눈을 거의 뜨고 있지 못했죠. 예전에는 이 일을 좋아했지만 최근에는 즐기는 것이 아무것도 없어서 우울해지기 시작합니다. 아주 익숙한 장면이라 독자 입장에서 자연스럽게 몰입하게 됩니다.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 개념을 정의해요. 다섯 번째 문장에서 이 상황이 바로 번아웃 증후군의 한 예라고 밝히죠. 많은 사람이 매우 오랫동안 너무 열심히 일할 때 이것을 경험한다는 설명이 이어집니다. 그리고 천구백칠십 년대 중반 이후로 과학자들이 일하는 사람들의 스트레스를 관리하도록 돕기 위해 번아웃을 연구해 왔다고 덧붙입니다.","hl":"f1"},{"n":6,"text":"세 번째 단계는 위험한 직업에 대한 질문과 답이에요. 어느 직업이든 스트레스를 유발할 수 있지만, 정말 사람들에게 스트레스를 주는 특정한 직업들이 있는지 물어보고 바로 그렇다고 답합니다. 교사, 간호사, 경찰관처럼 다른 사람들과 밀접하게 일하는 사람들이 자주 번아웃을 느낀다고 말하죠. 게다가 불규칙한 시간에 일해야 하는 직업을 가진 사람들도 위험하다고 설명합니다.","hl":"f2"},{"n":7,"text":"마지막 단계는 해결이에요. 그래서 근무 환경이 중요하다고 강조합니다. 직원들이 존중받고 동기 부여가 되고 신뢰를 받는다고 느낄 때 일을 더 즐기게 되고, 번아웃의 징후를 발견할 수 있는 상사는 그것을 가진 사람들을 더 잘 도울 수 있다고 하죠. 그리고 번아웃은 심각한 문제지만 좋은 의사소통과 강력한 지지집단을 통해 극복될 수 있다고 정리합니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">예시 - 정의 - 질문·답변 - 문제·해결\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 15번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 마크의 구체적인 사례에서 출발해 '번아웃 증후군'이라는 개념을 정의하고, 어떤 직업이 위험한지 설명한 뒤, 근무 환경과 소통이라는 해결책으로 끝을 맺는다. 이렇게 \u003cb class=\"key\">예시\u003c/b>로 흥미를 끌고 \u003cb class=\"key\">문제\u003c/b>를 들여다본 뒤 해결로 나아가는 흐름이 이 글의 전개 방식이다. 주제를 처음에 밝히지 않고 마지막 문장에서 정리하므로 \u003cb class=\"key\">미괄식\u003c/b> 구성이라고 볼 수 있다. 그래서 읽을 때는 사례가 어떤 개념을 설명하기 위해 쓰였는지 표시해 두는 것이 좋다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>For the past week (1)\u003c/b>\u003cspan>시간 배경 제시\u003c/span>\u003cb>but lately (3)\u003c/b>\u003cspan>과거와 현재의 대조\u003c/span>\u003cb>This is an example of (5)\u003c/b>\u003cspan>예시에서 개념 정의로 전환\u003c/span>\u003cb>so that (7)\u003c/b>\u003cspan>목적 제시\u003c/span>\u003cb>In addition (11)\u003c/b>\u003cspan>정보 추가\u003c/span>\u003cb>That's why (12)\u003c/b>\u003cspan>원인에서 해결로 전환\u003c/span>\u003cb>Also (14)\u003c/b>\u003cspan>정보 추가\u003c/span>\u003cb>but (15)\u003c/b>\u003cspan>대조를 통한 결론\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">so tired\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">depressed\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">burnout syndrome\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">burned out\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">burnout\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">serious condition\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 예시에서 출발해 개념을 정의하고, 위험 요소를 설명한 뒤 해결책으로 마무리하는 구조예요. 그래서 전개 방식은 예시와 정의, 그리고 문제와 해결이 이어지는 형태라고 말할 수 있죠. 주제를 처음에 딱 밝히지 않고 마지막 문장에서 정리하기 때문에 미괄식 구성이에요. 열다섯 번째 문장이 이 글의 주제문 역할을 한다는 점을 꼭 기억해 두세요.","hl":"ty"},{"n":9,"text":"신호어부터 짚어 볼게요. 첫 번째 문장의 For the past week는 시간 배경을 열어 주고, 세 번째 문장의 but lately는 과거와 현재를 대조시키죠. 열한 번째 문장의 In addition은 위험 요소를 하나 더 추가하라는 신호이고, 열두 번째 문장의 That's why는 원인에서 해결로 방향을 틀어 줍니다. 재진술도 눈여겨보세요. burnout syndrome이 burned out으로, 다시 burnout과 serious condition으로 이어지면서 같은 개념이 계속 반복됩니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>stay up late\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>늦게까지 깨어 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>presentation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>발표\u003c/span>\u003c/div>\u003cdiv>\u003cb>barely\u003c/b>\u003cem>부사\u003c/em>\u003cspan>간신히, 거의 ~하지 못하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>keep one's eyes open\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>눈을 뜨고 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>used to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~하곤 했다\u003c/span>\u003c/div>\u003cdiv>\u003cb>lately\u003c/b>\u003cem>부사\u003c/em>\u003cspan>최근에\u003c/span>\u003c/div>\u003cdiv>\u003cb>depressed\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>우울한\u003c/span>\u003c/div>\u003cdiv>\u003cb>example\u003c/b>\u003cem>명사\u003c/em>\u003cspan>예, 사례\u003c/span>\u003c/div>\u003cdiv>\u003cb>burnout syndrome\u003c/b>\u003cem>명사\u003c/em>\u003cspan>번아웃 증후군\u003c/span>\u003c/div>\u003cdiv>\u003cb>experience\u003c/b>\u003cem>동사\u003c/em>\u003cspan>경험하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>manage\u003c/b>\u003cem>동사\u003c/em>\u003cspan>관리하다, 다루다\u003c/span>\u003c/div>\u003cdiv>\u003cb>stress\u003c/b>\u003cem>명사\u003c/em>\u003cspan>스트레스\u003c/span>\u003c/div>\u003cdiv>\u003cb>certain\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>특정한\u003c/span>\u003c/div>\u003cdiv>\u003cb>stress out\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>스트레스를 주다\u003c/span>\u003c/div>\u003cdiv>\u003cb>closely\u003c/b>\u003cem>부사\u003c/em>\u003cspan>밀접하게\u003c/span>\u003c/div>\u003cdiv>\u003cb>such as\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~와 같은\u003c/span>\u003c/div>\u003cdiv>\u003cb>report\u003c/b>\u003cem>동사\u003c/em>\u003cspan>말하다, 보고하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>burned out\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>에너지를 다 써 버린\u003c/span>\u003c/div>\u003cdiv>\u003cb>in addition\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>게다가\u003c/span>\u003c/div>\u003cdiv>\u003cb>require\u003c/b>\u003cem>동사\u003c/em>\u003cspan>요구하다, 필요로 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>irregular\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>불규칙한\u003c/span>\u003c/div>\u003cdiv>\u003cb>at risk\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>위험에 처한\u003c/span>\u003c/div>\u003cdiv>\u003cb>environment\u003c/b>\u003cem>명사\u003c/em>\u003cspan>환경\u003c/span>\u003c/div>\u003cdiv>\u003cb>employee\u003c/b>\u003cem>명사\u003c/em>\u003cspan>직원\u003c/span>\u003c/div>\u003cdiv>\u003cb>respected\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>존중받는\u003c/span>\u003c/div>\u003cdiv>\u003cb>motivated\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>동기 부여가 된\u003c/span>\u003c/div>\u003cdiv>\u003cb>trusted\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>신뢰받는\u003c/span>\u003c/div>\u003cdiv>\u003cb>identify\u003c/b>\u003cem>동사\u003c/em>\u003cspan>알아보다, 확인하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>overcome\u003c/b>\u003cem>동사\u003c/em>\u003cspan>극복하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>support group\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지지 집단\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"단어도 몇 개만 짚고 갈게요. stay up late는 늦게까지 깨어 있다는 뜻이고, barely는 간신히, 거의 그렇지 못하다는 의미죠. at risk는 위험에 처한, overcome은 극복하다로 꼭 외워 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">tired\u003c/b>\u003cspan class=\"m\">피곤한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">exhausted\u003c/span>\u003cspan class=\"s\">weary\u003c/span>\u003cspan class=\"s\">fatigued\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">energetic\u003c/span>\u003cspan class=\"a\">refreshed\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">depressed\u003c/b>\u003cspan class=\"m\">우울한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">sad\u003c/span>\u003cspan class=\"s\">down\u003c/span>\u003cspan class=\"s\">gloomy\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">cheerful\u003c/span>\u003cspan class=\"a\">happy\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">manage\u003c/b>\u003cspan class=\"m\">관리하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">handle\u003c/span>\u003cspan class=\"s\">control\u003c/span>\u003cspan class=\"s\">cope with\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">neglect\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">require\u003c/b>\u003cspan class=\"m\">요구하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">need\u003c/span>\u003cspan class=\"s\">demand\u003c/span>\u003cspan class=\"s\">call for\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">overcome\u003c/b>\u003cspan class=\"m\">극복하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">conquer\u003c/span>\u003cspan class=\"s\">get over\u003c/span>\u003cspan class=\"s\">surmount\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">surrender\u003c/span>\u003cspan class=\"a\">give in\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">serious\u003c/b>\u003cspan class=\"m\">심각한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">severe\u003c/span>\u003cspan class=\"s\">grave\u003c/span>\u003cspan class=\"s\">critical\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">trivial\u003c/span>\u003cspan class=\"a\">minor\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">certain\u003c/b>\u003cspan class=\"m\">특정한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">particular\u003c/span>\u003cspan class=\"s\">specific\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">general\u003c/span>\u003cspan class=\"a\">vague\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">irregular\u003c/b>\u003cspan class=\"m\">불규칙한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">inconsistent\u003c/span>\u003cspan class=\"s\">uneven\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">regular\u003c/span>\u003cspan class=\"a\">steady\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 정리해 볼게요. tired는 exhausted, weary와 가깝고 반대말은 energetic이에요. depressed는 sad, down과 바꿔 쓸 수 있고 반대말은 cheerful이죠. manage는 handle, cope with로, require는 need, demand로 바꿔 말할 수 있습니다. overcome은 conquer, get over와 같은 뜻이고 반대말은 surrender예요. serious는 severe, grave, certain은 particular, specific, irregular는 inconsistent와 묶어서 기억해 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지난주 동안,\u003c/span>\u003cspan class=\"en\">For the past week,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마크는 늦도록 깨어 있다\u003c/span>\u003cspan class=\"en\">Mark \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">been \u003c/span>\u003cspan class=\"tgt\">staying \u003c/span>\u003cspan class=\"tgt\">up \u003c/span>\u003cspan class=\"tgt\">late\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매일 밤\u003c/span>\u003cspan class=\"en\">every night\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">중요한 회사 발표를 준비하며\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">working \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">big \u003c/span>\u003cspan class=\"tgt\">company \u003c/span>\u003cspan class=\"tgt\">presentation\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">지난주 동안, 마크는 중요한 회사 발표를 준비하며 매일 밤늦도록 깨어 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글의 도입부에서 마크의 상태를 보여 주는 \u003cb class=\"key\">장면 \u003c/b>\u003cb class=\"key\">제시\u003c/b> 문장이에요. for the past week가 과거부터 지금까지 이어지는 \u003cb class=\"key\">기간\u003c/b>을 알려 주고, has been staying이 그 기간 동안 \u003cb class=\"key\">계속된 \u003c/b>\u003cb class=\"key\">동작\u003c/b>을 나타내서 '일주일 내내 밤늦도록 발표 준비를 했다'는 뜻이 됩니다. 그래서 다음 문장의 피곤함으로 자연스럽게 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재완료 진행\u003c/span> : [주어] + have/has + been + [동사-ing] : \"늦도록 계속 깨어 있어 왔다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재분사구(동시 동작)\u003c/span> : [주절] + [동사-ing ~ : ~하면서] : \"중요한 회사 발표를 준비하면서\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"For the past week, 지난주 동안. Mark has been staying up late, 마크는 늦도록 깨어 있다. every night, 매일 밤. working on a big company presentation, 중요한 회사 발표를 준비하며. 이 문장 전체를 해석하면, 지난주 동안, 마크는 중요한 회사 발표를 준비하며 매일 밤늦도록 깨어 있다.","hl":"m"},{"n":13,"text":"이 문장은 마크의 상태를 보여 주는 장면 제시 문장이에요. for the past week가 과거부터 지금까지 이어지는 기간을 알려 주고, has been staying이 그 기간 동안 계속된 동작을 나타내죠. 한마디로 마크가 일주일 내내 발표 준비 때문에 밤을 새웠다는 뜻이에요.","hl":"mn"},{"n":14,"text":"첫 번째로 has been staying up late는 현재완료 진행이에요. have나 has에 been을 붙이고 동사에 ing를 붙이면 과거부터 지금까지 계속되는 동작이 돼요. 두 번째로 working on은 현재분사구로, 마크가 깨어 있으면서 동시에 무엇을 했는지 덧붙여 설명해 줘요. 그래서 '~하면서'로 해석하면 자연스러워요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 너무 피곤해서\u003c/span>\u003cspan class=\"en\">He is \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">so \u003c/span>\u003cspan class=\"tgt\">tired \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">눈을 거의 뜨고 있지 못한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> he can \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">barely\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">keep \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">eyes \u003c/span>\u003cspan class=\"tgt\">open\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 너무 피곤해서 눈을 거의 뜨고 있지 못한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 결과로 마크가 얼마나 \u003cb class=\"key\">피곤\u003c/b>한지 보여 주는 문장이에요. so와 that 사이의 tired가 \u003cb class=\"key\">정도\u003c/b>를, that 뒤가 \u003cb class=\"key\">결과\u003c/b>를 담고 있어서 '눈을 뜨고 있기 힘들 정도로 지쳐 있다'는 뜻이 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">so ~ that 구문(정도·결과)\u003c/span> : so + [형용사/부사] + that + [주어 + 동사] : \"너무 피곤해서 ~하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">준부정어 barely\u003c/span> : [조동사] + barely + [동사원형] : \"거의 ~않다, 간신히\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">5형식 keep + 목적어 + 형용사\u003c/span> : keep + [목적어] + [형용사(목적격 보어)] : \"그의 눈을 뜬 상태로 유지하다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"He is so tired, 그는 너무 피곤해서. that he can barely keep his eyes open, 눈을 거의 뜨고 있지 못한다. 이 문장 전체를 해석하면, 그는 너무 피곤해서 눈을 거의 뜨고 있지 못한다.","hl":"m"},{"n":16,"text":"이 문장은 앞 문장에서 밤을 새운 결과로 마크가 얼마나 피곤한지 보여 줘요. so와 that 사이의 tired가 정도를, that 뒤가 결과를 담고 있죠. barely가 '거의 ~않다'는 부정의 느낌을 더해서 아주 지쳐 있다는 걸 알려 줍니다.","hl":"mn"},{"n":17,"text":"첫 번째로 so tired that은 so와 that 사이에 형용사가 오는 so ~ that 구문이에요. 앞에는 정도, 뒤에는 결과가 온다고 기억하세요. 두 번째로 barely는 준부정어라서 뒤에 오는 동사를 부정해요. 그래서 can barely keep은 '간신히 유지할 수 있다', 다시 말해 '거의 못 하다'로 해석해요. 세 번째로 keep his eyes open은 목적어 다음에 형용사가 오는 구조예요. 목적어 his eyes를 open이라는 상태로 유지한다는 뜻이죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 15\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 이 일을 좋아했었지만,\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">used \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">like\u003c/span> this job,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 최근에는\u003c/span>\u003cspan class=\"en\">but lately\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아무것도 없다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">nothing\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그가 이 일에 대해 즐기는 것이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">enjoys \u003c/span>\u003cspan class=\"tgt\">about \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 이 일을 좋아했었지만, 최근에는 이 일에 대해 즐기는 것이 아무것도 없다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 마크의 \u003cb class=\"key\">과거\u003c/b>와 \u003cb class=\"key\">현재\u003c/b>를 \u003cb class=\"key\">대조\u003c/b>해서 보여 주는 문장이에요. used to로 예전에는 좋아했음을, lately로 지금은 즐거움이 없다는 것을 나란히 놓았죠. 이 변화가 이어지는 우울감과 burnout syndrome으로 연결되는 흐름을 만들어 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">used to + 동사원형(과거의 상태·습관)\u003c/span> : used to + [동사원형] : \"(지금은 아니고) 예전에 좋아했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">there is 구문(유도부사)\u003c/span> : There + be동사 + [주어] + [수식어] : \"아무것도 없다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 생략\u003c/span> : [선행사 nothing] + [(that) + 주어 + 동사] : \"그가 그것에 대해 즐기는 (것이)\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"He used to like this job, 그는 이 일을 좋아했었지만. but lately, 하지만 최근에는. there is nothing, 아무것도 없다. he enjoys about it, 그가 이 일에 대해 즐기는 것이. 이 문장 전체를 해석하면, 그는 이 일을 좋아했었지만, 최근에는 이 일에 대해 즐기는 것이 아무것도 없다.","hl":"m"},{"n":19,"text":"이 문장은 마크의 과거와 현재를 대조해서 보여 줘요. used to는 지금은 아닌 예전 상태를, lately는 최근의 변화를 알려 주죠. 좋아하던 일에서 아무 즐거움도 못 느낀다는 이 대비가 우울감으로 이어지는 흐름을 만들어 줍니다.","hl":"mn"},{"n":20,"text":"첫 번째로 used to like는 used to 다음에 동사원형이 오는 표현이에요. '예전에는 ~했지만 지금은 아니다'라는 과거의 상태나 습관을 나타내죠. 두 번째로 there is nothing은 유도부사 there를 쓰는 구문이에요. 뒤에 오는 nothing이 주어 역할을 하면서 존재를 말해 주죠. 세 번째로 nothing he enjoys about it에서 he enjoys 앞에 목적격 관계대명사가 생략되어 있어요. 선행사가 nothing 같은 부정어일 때는 that만 쓸 수 있고, 목적격이면 생략도 가능하다는 점을 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 시작하고 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">He's \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">starting \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">느끼기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">feel\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우울하게\u003c/span>\u003cspan class=\"en\">depressed.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 우울해지기 시작하고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장들에서 마크가 매일 밤 늦게까지 일하며 지쳐 있다는 상황이 이어졌죠. 이 문장은 그 결과로 그의 감정이 어떻게 변하는지를 보여 주는데, \u003cb class=\"key\">start\u003c/b> 뒤에 \u003cb class=\"key\">to부정사\u003c/b>가 와서 '~하기 시작하다'라는 변화의 출발점을 나타냅니다. \u003cb class=\"key\">감정 \u003c/b>\u003cb class=\"key\">변화\u003c/b>가 막 시작되는 단계임을 알려 주는 도입부 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재진행형(be동사 + -ing)\u003c/span> : He is + [starting (현재분사)] : \"그는 시작하고 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : start + [to feel (to부정사 = 목적어)] : \"느끼기 시작하다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"He's starting, 그는 시작하고 있다. to feel, 느끼기를. depressed, 우울하게. 이 문장 전체를 해석하면, 그는 우울해지기 시작하고 있다.","hl":"m"},{"n":22,"text":"앞에서 마크가 매일 밤 늦게까지 일한다고 했죠. 그래서 지금 그의 감정이 어떻게 바뀌는지를 이 문장이 보여 줍니다. start to feel은 감정의 변화가 막 시작되는 단계라는 뜻이에요.","hl":"mn"},{"n":23,"text":"첫 번째로 He's는 He is의 축약형으로 현재진행형을 만듭니다. 지금 진행 중인 변화를 나타내는 형태예요. 두 번째로 start 뒤에 to feel이 목적어로 와서 느끼기 시작하다라는 뜻을 만들어요. start는 뒤에 to부정사나 동명사를 목적어로 데려오는 동사라는 점을 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은 ~이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">This\u003c/span> is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 예이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">example \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">번아웃 증후군의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of\u003c/span> &quot;burnout syndrome.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것은 '번아웃 증후군'의 한 예이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장까지가 마크가 겪는 상태를 설명했고, 이 문장이 그 상태에 \u003cb class=\"key\">이름\u003c/b>을 붙여 줍니다. 바로 \u003cb class=\"key\">번아웃 \u003c/b>\u003cb class=\"key\">증후군\u003c/b>이라는 주제어가 처음 등장하는 자리라서 글 전체의 \u003cb class=\"key\">주제\u003c/b>를 잡아 주는 핵심 문장이에요. This가 앞 내용 전체를 하나로 묶어 받는 \u003cb class=\"key\">지시대명사\u003c/b>라는 점도 함께 기억해 두세요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지시대명사\u003c/span> : This + [동사] (앞 내용 전체를 받음) : \"이것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 of의 관계 용법\u003c/span> : an example [of + 명사] : \"~의 한 예\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"This is, 이것은 ~이다. an example, 한 예이다. of \"burnout syndrome.\", 번아웃 증후군의. 이 문장 전체를 해석하면, 이것은 '번아웃 증후군'의 한 예이다.","hl":"m"},{"n":25,"text":"앞 문장까지가 마크가 겪는 상태를 설명했고, 이 문장이 그 상태에 이름을 붙여 줍니다. 바로 burnout syndrome, 즉 번아웃 증후군이에요. 글의 주제어가 처음 등장하는 자리라서 아주 중요합니다.","hl":"mn"},{"n":26,"text":"첫 번째로 This는 지시대명사로, 앞 문장의 내용 전체를 하나로 받아요. 두 번째로 an example of는 ~의 한 예라는 전치사구를 만듭니다. of 뒤에 burnout syndrome이 와서 무엇의 예인지 대상을 붙여 주죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 15\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 사람들이\u003c/span>\u003cspan class=\"en\">Many people\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것을 경험한다\u003c/span>\u003cspan class=\"en\">experience this\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 너무 열심히 일할 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">work \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">too \u003c/span>\u003cspan class=\"tgt\">hard\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매우 오랫동안\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">very \u003c/span>\u003cspan class=\"tgt\">long \u003c/span>\u003cspan class=\"tgt\">time\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">많은 사람들이 매우 오랫동안 너무 열심히 일할 때 이것을 경험한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> this는 바로 앞에 나온 \u003cb class=\"key\">번아웃 \u003c/b>\u003cb class=\"key\">증후군\u003c/b>을 가리켜요. 즉 번아웃은 특별한 사람만 겪는 것이 아니라, 오래 과로한 사람이면 누구나 겪는다는 뜻입니다. when절이 \u003cb class=\"key\">조건\u003c/b>을 붙여서 어떤 상황에서 그런 일이 생기는지 원인을 분명히 밝혀 주고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 when의 시간 부사절\u003c/span> : [when + 주어 + 동사], 주절 : \"그들이 너무 열심히 일할 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">too + 부사의 강조\u003c/span> : too + [hard (부사)] : \"너무 열심히\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 for + 기간\u003c/span> : for + [a very long time (기간)] : \"매우 오랫동안\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Many people, 많은 사람들이. experience this, 이것을 경험한다. when they work too hard, 그들이 너무 열심히 일할 때. for a very long time, 매우 오랫동안. 이 문장 전체를 해석하면, 많은 사람들이 매우 오랫동안 너무 열심히 일할 때 이것을 경험한다.","hl":"m"},{"n":28,"text":"this는 앞에 나온 번아웃 증후군을 가리켜요. 즉 번아웃은 특별한 사람만 겪는 게 아니라 오래 과로한 사람이면 누구나 겪는다는 뜻입니다. when절이 조건을 붙여서 어떤 상황에서 그런 일이 생기는지 분명히 밝혀 주고 있어요.","hl":"mn"},{"n":29,"text":"첫 번째로 when은 접속사로 뒤에 주어와 동사가 있는 부사절을 이끌어요. 그래서 ~할 때라는 시간 조건을 붙여 줍니다. 두 번째로 too hard의 too는 ~도 또한이 아니라 너무라는 강조의 뜻이에요. 세 번째로 for a very long time에서 for는 기간을 나타내는 전치사로 얼마 동안인지를 보여 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 15\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1970년대 중반 이후로,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Since \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">mid-1970s\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">과학자들은 번아웃에 대해 연구해 오고 있다\u003c/span>\u003cspan class=\"en\">scientists \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">been \u003c/span>\u003cspan class=\"tgt\">studying\u003c/span> about burnout\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 일하는 사람들을 도울 수 있도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">so \u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">help \u003c/span>\u003cspan class=\"tgt\">workers \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 스트레스를 관리하도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">manage\u003c/span> their stress.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">1970년대 중반 이후로, 과학자들은 일하는 사람들이 그들의 스트레스를 관리하도록 돕기 위해 번아웃(극도의 피로감)에 대해 연구해 오고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 과학자들이 번아웃을 연구해 온 \u003cb class=\"key\">목적\u003c/b>을 밝히는 문장이에요. 'since + 과거 시점'과 \u003cb class=\"key\">현재완료진행\u003c/b>이 짝을 이뤄 1970년대 중반부터 지금까지 연구가 \u003cb class=\"key\">계속\u003c/b> 이어져 왔음을 보여 줍니다. 뒤의 so that은 그 연구의 목적, 즉 일하는 사람들의 스트레스 관리를 돕기 위해서라는 뜻을 전해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 since + 특정 시점\u003c/span> : since + [과거의 특정 시점] (→ [[현재완료]]·현재완료진행과 호응) : \"1970년대 중반 이후로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재완료진행 (have/has been + -ing)\u003c/span> : have/has + been + [동사원형-ing] : \"연구해 오고 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">so that 목적 부사절\u003c/span> : so that + [주어 + can/may + 동사원형] (~하기 위해, ~할 수 있도록) : \"그들이 일하는 사람들을 도울 수 있도록\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">help + 목적어 + 원형부정사\u003c/span> : help + [목적어] + [(to) 동사원형] : \"일하는 사람들이 관리하도록 돕다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Since the mid-1970s, 1970년대 중반 이후로. scientists have been studying about burnout, 과학자들은 번아웃에 대해 연구해 오고 있다. so that they can help workers, 그들이 일하는 사람들을 도울 수 있도록. manage their stress, 그들의 스트레스를 관리하도록. 이 문장 전체를 해석하면, 1970년대 중반 이후로, 과학자들은 일하는 사람들이 그들의 스트레스를 관리하도록 돕기 위해 번아웃(극도의 피로감)에 대해 연구해 오고 있다.","hl":"m"},{"n":31,"text":"이 문장은 과학자들이 번아웃을 왜 연구해 왔는지 말하고 있어요. 천구백칠십 년대 중반부터 지금까지 연구가 계속 이어져 왔다는 점이 핵심이죠. 그 목적은 일하는 사람들이 스트레스를 관리하도록 돕는 거예요.","hl":"mn"},{"n":32,"text":"첫 번째로, Since the mid-1970s에서 since는 과거의 특정 시점을 기준점으로 잡아 주는 전치사예요. 두 번째로, have been studying은 현재완료진행이라서 연구가 지금까지 계속되고 있다는 계속의 의미를 살려 줍니다. 세 번째로, so that은 목적을 나타내는 접속사로 뒤에 can이 와서 할 수 있도록이라는 목적을 분명히 해 줘요. 네 번째로, help workers manage는 목적어 뒤에 동사원형이 오는 구조로, 일하는 사람들이 관리하도록 돕다라고 해석합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어느 직업이든지 스트레스를 유발할 수 있지만,\u003c/span>\u003cspan class=\"en\">Any job can cause stress,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정말 사람들에게 스트레스를 주는 특정한 직업들이 있을까?\u003c/span>\u003cspan class=\"en\">but \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">certain \u003c/span>\u003cspan class=\"tgt\">jobs\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정말 사람들에게 스트레스를 주는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">really \u003c/span>\u003cspan class=\"tgt\">stress \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">out\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어느 직업이든지 스트레스를 유발할 수 있지만, 정말 사람들에게 스트레스를 주는 특정한 직업들이 있을까?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 어느 직업이든 스트레스는 있지만, 유독 심한 직업이 있는지 \u003cb class=\"key\">질문\u003c/b>을 던지며 글의 화제를 직업별 스트레스로 좁히는 문장이에요. certain jobs를 \u003cb class=\"key\">주격 \u003c/b>\u003cb class=\"key\">관계대명사\u003c/b> that이 '정말 사람들에게 스트레스를 주는'으로 꾸며 주고, stress out은 '스트레스를 몹시 주다'라는 \u003cb class=\"key\">구동사\u003c/b>입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">there be 구문의 의문문 (주어-동사 도치)\u003c/span> : Are there + [복수명사]? (There are + 복수명사 의문형) : \"특정한 직업들이 있을까?\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : [선행사 certain jobs] + that + [동사] (~하는) : \"정말 사람들에게 스트레스를 주는\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"Any job can cause stress, 어느 직업이든지 스트레스를 유발할 수 있지만. but are there certain jobs, 정말 사람들에게 스트레스를 주는 특정한 직업들이 있을까?. that really stress people out?, 정말 사람들에게 스트레스를 주는. 이 문장 전체를 해석하면, 어느 직업이든지 스트레스를 유발할 수 있지만, 정말 사람들에게 스트레스를 주는 특정한 직업들이 있을까?","hl":"m"},{"n":34,"text":"이 문장은 번아웃 이야기를 하다가 특정 직업이 더 스트레스를 준다는 화제로 넘어가는 연결 문장이에요. 스스로 질문을 던지고 다음 문장에서 바로 Yes라고 답하면서 독자의 관심을 끌죠.","hl":"mn"},{"n":35,"text":"첫 번째로, are there certain jobs는 there be 구문을 의문문으로 만든 형태라서 be동사가 문장 앞으로 나가는 도치가 일어나요. 두 번째로, that really stress people out에서 that은 앞의 certain jobs를 받는 주격 관계대명사이고, 동사 stress는 선행사가 복수라서 그 모양을 그대로 씁니다. 세 번째로, stress people out은 스트레스를 몹시 주다라는 뜻의 구동사로, 여기서는 jobs가 주어 역할을 하고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그렇다!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Yes\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그렇다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 'Yes!'는 앞 질문에 대한 \u003cb class=\"key\">긍정의 \u003c/b>\u003cb class=\"key\">대답\u003c/b>이에요. 원래는 'Yes, there are.'인데 반복되는 부분을 \u003cb class=\"key\">생략\u003c/b>해 짧게 남긴 형태죠. 다음 문장에서 어떤 직업들이 위험한지 구체적인 예시가 이어질 것임을 알려 주는 신호예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">대답에서의 반복 어구 생략\u003c/span> : Yes, + [주어 + be동사] → 반복 부분 생략 후 Yes만 남김 : \"그렇다!\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Yes!, 그렇다!. 이 문장 전체를 해석하면, 그렇다!","hl":"m"},{"n":37,"text":"앞의 질문에 대한 긍정의 대답이에요. 한 단어짜리 짧은 문장이지만, 어떤 직업들이 위험한지 다음 문장에서 구체적으로 설명해 주는 신호탄이 되어 줍니다.","hl":"mn"},{"n":38,"text":"여기서 Yes는 원래 Yes, there are.에서 반복되는 부분을 생략한 형태예요. 앞의 의문문 Ar eport feeling burned out은 '에너지를 다 써버린 기분을 느낀다고 말한다'로 풀어 읽으면 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 who\u003c/span> : [선행사 People] + [who + 동사 ~ (주격 관계대명사절)] : \"다른 사람들과 밀접하게 일하는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">such as를 이용한 예시 나열\u003c/span> : such as + [명사 나열] : \"교사, 간호사, 그리고 경찰관과 같이\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동명사 목적어\u003c/span> : report + [feeling (동명사/목적어)] : \"에너지를 다 써버린 것 같은 기분을 느낀다고 말한다\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"People who work closely with other people, 다른 사람들과 밀접하게 일하는 사람들은. such as teachers, nurses, and police officers, 교사, 간호사, 그리고 경찰관과 같이. often report, 자주 말한다. feeling burned out, 에너지를 다 써버린 것 같은 기분을 느낀다고. 이 문장 전체를 해석하면, 교사, 간호사, 그리고 경찰관과 같이 다른 사람들과 밀접하게 일하는 사람들은 자주 에너지를 다 써버린 것 같은 기분을 느낀다고 말한다.","hl":"m"},{"n":40,"text":"이 문장은 번아웃이 어떤 직업에서 특히 잘 생기는지 예시로 보여 주는 문장이에요. 다른 사람들과 밀접하게 일하는 교사, 간호사, 경찰관을 예시로 들면서 독자에게 구체적인 근거를 주고 있죠. report feeling burned out은 에너지를 다 써버린 기분을 느낀다고 말한다, 이렇게 받아들이면 됩니다.","hl":"mn"},{"n":41,"text":"첫 번째로, who work closely with other people에서 who는 주격 관계대명사예요. 앞에 있는 People을 꾸미면서 그 안에서 주어 역할을 하니까 뒤에 동사 work가 바로 오는 거죠. 두 번째로, such as teachers, nurses, and police officers는 예시를 붙여 주는 표현이에요. 콤마로 묶인 삽입구라서 통째로 빼도 문장이 성립한다는 점도 기억해 두세요. 세 번째로, report feeling burned out에서 report는 타동사라서 목적어가 필요한데, 여기서는 동명사 feeling이 목적어로 온 형태예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">게다가,\u003c/span>\u003cspan class=\"en\">In addition,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">직업을 가진 사람들은\u003c/span>\u003cspan class=\"en\">people with jobs\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">불규칙한 시간에 일해야 하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">require \u003c/span>\u003cspan class=\"tgt\">them \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">work \u003c/span>\u003cspan class=\"tgt\">irregular \u003c/span>\u003cspan class=\"tgt\">hours\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">역시 위험하다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">also \u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">risk\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">게다가, 불규칙한 시간에 일해야 하는 직업을 가진 사람들 역시 위험하다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 사람을 상대하는 직업을 예시로 들었다면, 이 문장은 근무 시간이라는 또 다른 \u003cb class=\"key\">위험\u003c/b> 요인을 \u003cb class=\"key\">추가\u003c/b>합니다. people with jobs that ~ 구조로 '그런 일을 하는 사람들'이라는 대상을 한정하고, are also at risk의 also로 앞의 위험군과 같은 범주임을 표시합니다. require A to do는 'A가 ~하도록 요구하다'라는 \u003cb class=\"key\">5형식\u003c/b> 표현입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : [선행사 jobs] + [that + 동사 (주격 관계대명사절)] : \"불규칙한 시간에 일해야 하는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">5형식 동사 require (목적격보어 to부정사)\u003c/span> : require + [목적어 them] + [to work (목적격보어/to부정사)] : \"그들이 일하도록 요구하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">관용표현 be at risk\u003c/span> : be + [at risk (전치사구/보어)] : \"역시 위험에 처해 있다\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"In addition, 게다가. people with jobs, 직업을 가진 사람들은. that require them to work irregular hours, 불규칙한 시간에 일해야 하는. are also at risk, 역시 위험하다.. 이 문장 전체를 해석하면, 게다가, 불규칙한 시간에 일해야 하는 직업을 가진 사람들 역시 위험하다.","hl":"m"},{"n":43,"text":"앞 문장이 사람을 상대하는 직업을 예시로 들었다면, 이 문장은 근무 시간이라는 또 다른 위험 요인을 추가하는 문장이에요. 불규칙한 시간에 일해야 하는 직업을 가진 사람들도 위험하다고 연결하고 있죠. 그래서 앞의 내용과 같은 범주의 위험이라는 점을 also로 다시 한번 짚어 주고 있습니다.","hl":"mn"},{"n":44,"text":"첫 번째로, that require them to work irregular hours에서 that은 jobs를 꾸미는 주격 관계대명사예요. 절 안에서 주어 역할을 하니까 바로 뒤에 동사 require가 오는 구조죠. 두 번째로, require는 목적어 뒤에 to부정사를 보어로 쓰는 5형식 동사예요. 그래서 them to work가 한 덩어리로 '그들이 일하도록 요구하다'라는 의미를 만듭니다. 세 번째로, are also at risk에서 at risk는 '위험에 처한'이라는 관용표현이고 also가 붙어서 '역시 위험하다'라는 추가의 의미까지 담고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 15\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">That's \u003c/span>\u003cspan class=\"tgt\">why\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">근무 환경이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">work \u003c/span>\u003cspan class=\"tgt\">environments\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">중요하다.\u003c/span>\u003cspan class=\"en\">are important.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그래서 근무 환경이 중요하다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> That's why는 앞에서 말한 내용 전체를 받아 '그래서'로 이어 주는 \u003cb class=\"key\">연결\u003c/b> 표현입니다. 앞 문장들에서 위험 직업과 위험 요인을 나열한 뒤, 결론적으로 \u003cb class=\"key\">근무 \u003c/b>\u003cb class=\"key\">환경\u003c/b>이 중요하다는 점을 강조하며 글의 방향을 \u003cb class=\"key\">전환\u003c/b>시키는 역할을 합니다. 짧지만 이 단락의 중심 결론을 담은 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">That's why 구문 (이유를 나타내는 보어절)\u003c/span> : That is why + [주어 + 동사] (why절이 주격보어) : \"그래서, 그런 이유로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명사+명사 복합명사\u003c/span> : [명사 work] + [명사 environments] (앞 명사가 뒤 명사를 수식) : \"근무 환경\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"That's why, 그래서. work environments, 근무 환경이. are important, 중요하다.. 이 문장 전체를 해석하면, 그래서 근무 환경이 중요하다.","hl":"m"},{"n":46,"text":"That's why는 앞에서 말한 내용 전체를 받아서 그래서, 라고 이어 주는 연결 표현이에요. 위험한 직업과 위험 요인을 쭉 나열한 다음에 결국 근무 환경이 중요하다는 결론을 던지는 문장이죠. 짧은 문장이지만 단락의 방향을 전환하면서 중심 결론을 잡아 주는 아주 중요한 역할을 합니다.","hl":"mn"},{"n":47,"text":"첫 번째로, That's why는 그것이 바로 ~한 이유이다, 라는 구조에서 why절이 보어 자리에 온 형태예요. 앞 문장 전체를 받아서 인과관계로 이어 주는 장치라고 이해하면 됩니다. 두 번째로, work environments는 앞의 명사 work가 뒤의 명사 environments를 수식하는 복합명사예요. 중심어가 뒤에 있으니까 복수형 s는 environments에만 붙는다는 점도 함께 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 15\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">직원들이 존중받는다고 느낄 때,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">employees \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">feel \u003c/span>\u003cspan class=\"tgt\">respected, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">동기 부여가 되고 신뢰를 받는다고,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">motivated, \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">trusted\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 자신의 일을 더 즐긴다.\u003c/span>\u003cspan class=\"en\">they enjoy \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">work \u003c/span>\u003cspan class=\"tgt\">more\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">직원들이 존중받고, 동기 부여가 되고, 신뢰를 받는다고 느낄 때, 그들은 자신의 일을 더 즐긴다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 &quot;work environments are important&quot;를 구체적으로 풀어 주는 문장으로, 좋은 근무 환경이 갖춰야 할 세 가지 조건을 제시합니다. 직원이 \u003cb class=\"key\">존중\u003c/b>과 \u003cb class=\"key\">동기 \u003c/b>\u003cb class=\"key\">부여\u003c/b>, \u003cb class=\"key\">신뢰\u003c/b>를 느끼면 일 자체를 더 즐기게 된다는 뜻입니다. 즉 환경이 바뀌면 태도도 바뀐다는 흐름을 만들어 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 when의 시간 부사절\u003c/span> : [When + 주어 + 동사 ~], [주어 + 동사 ~] : \"직원들이 존중받는다고 느낄 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지각동사 feel + 과거분사(2형식)와 병렬\u003c/span> : feel + [respected / motivated / trusted (과거분사)] + and 병렬 : \"존중받고, 동기 부여가 되고, 신뢰를 받는다고 느끼다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">비교급 부사 more\u003c/span> : [동사] + [목적어] + more (비교급 부사) : \"자신의 일을 더 즐긴다\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"When employees feel respected, 직원들이 존중받는다고 느낄 때. motivated, and trusted, 동기 부여가 되고 신뢰를 받는다고. they enjoy their work more, 그들은 자신의 일을 더 즐긴다.. 이 문장 전체를 해석하면, 직원들이 존중받고, 동기 부여가 되고, 신뢰를 받는다고 느낄 때, 그들은 자신의 일을 더 즐긴다.","hl":"m"},{"n":49,"text":"이 문장은 좋은 근무 환경이 어떤 조건을 갖춰야 하는지를 알려 줍니다. 직원들이 존중받고 동기 부여가 되고 신뢰를 받는다고 느낄 때 자신의 일을 더 즐긴다는 뜻이죠. 바로 앞의 work environments are important라는 말을 구체적으로 풀어 준 문장이에요.","hl":"mn"},{"n":50,"text":"첫 번째로 When employees feel respected에서 when은 시간을 나타내는 접속사로 시간 부사절을 이끌어요. 두 번째로 feel respected, motivated, and trusted는 지각동사 feel 뒤에 과거분사가 온 구조인데, respected, motivated, trusted 세 개가 병렬로 나열되어 있죠. 세 번째로 their work more에서 more는 비교급 부사로 쓰여서 일을 더 즐긴다는 의미를 만들어 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또한,\u003c/span>\u003cspan class=\"en\">Also,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">번아웃의 징후를 발견할 수 있는 상사는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">bosses \u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">identify \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">signs \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">burnout\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 잘 도와줄 수 있을 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">better \u003c/span>\u003cspan class=\"tgt\">able \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">help\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 가진 사람들을.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">those \u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">또한, 번아웃의 징후를 발견할 수 있는 상사는 그것을 가진 사람들을 더 잘 도와줄 수 있을 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 근무 환경 이야기를 이어받아 관리자의 역할을 덧붙이는 문장입니다. 상사가 번아웃의 \u003cb class=\"key\">징후\u003c/b>를 미리 알아채면, 번아웃을 겪는 직원을 더 잘 \u003cb class=\"key\">도움\u003c/b> 수 있다는 뜻입니다. 여기서 it은 바로 앞의 \u003cb class=\"key\">burnout\u003c/b>을 가리킵니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 who\u003c/span> : [선행사 bosses] + who + [동사 can identify ~] : \"번아웃의 징후를 발견할 수 있는 상사는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be able to + 비교급\u003c/span> : will + be + better + able + to help : \"더 잘 도와줄 수 있을 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">지시대명사 those + 주격 관계대명사 who\u003c/span> : those(지시대명사) + who + [동사 have] : \"그것을 가진 사람들을\"\u003c/div>\u003c/div>","segs":[{"n":51,"text":"Also, 또한. bosses who can identify the signs of burnout, 번아웃의 징후를 발견할 수 있는 상사는. will be better able to help, 더 잘 도와줄 수 있을 것이다. those who have it, 그것을 가진 사람들을.. 이 문장 전체를 해석하면, 또한, 번아웃의 징후를 발견할 수 있는 상사는 그것을 가진 사람들을 더 잘 도와줄 수 있을 것이다.","hl":"m"},{"n":52,"text":"앞 문장에 이어 관리자의 역할을 말하는 문장이에요. 상사가 번아웃의 징후를 미리 알아채면 번아웃을 겪는 직원을 더 잘 도울 수 있다는 뜻이죠. 여기서 it은 burnout을 가리킵니다.","hl":"mn"},{"n":53,"text":"첫 번째로 bosses who can identify the signs of burnout에서 who는 사람 선행사 bosses를 받는 주격 관계대명사예요. 두 번째로 will be better able to help는 조동사 will 뒤에 be able to가 와서 할 수 있을 것이다라는 의미를 만들고, better가 비교급으로 더 잘이라는 뜻을 더해 줍니다. 세 번째로 those who have it에서 those는 사람들을 가리키는 지시대명사이고, who는 those를 받는 주격 관계대명사이며, it은 burnout을 가리켜요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 15 / 15\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">번아웃은 심각한 문제이다,\u003c/span>\u003cspan class=\"en\">Burnout is a serious condition,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 그것은 극복될 수 있다,\u003c/span>\u003cspan class=\"en\">but \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">overcome\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">좋은 의사소통을 통해,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">through \u003c/span>\u003cspan class=\"tgt\">good \u003c/span>\u003cspan class=\"tgt\">communication \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 강력한 지지집단을 통해.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">strong \u003c/span>\u003cspan class=\"tgt\">support \u003c/span>\u003cspan class=\"tgt\">group\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">번아웃은 심각한 문제이지만, 그것은 좋은 의사소통과 강력한 지지집단을 통해 극복될 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글 전체를 마무리하는 결론 문장입니다. 번아웃이 심각한 문제이긴 하지만 좋은 \u003cb class=\"key\">의사소통\u003c/b>과 강력한 \u003cb class=\"key\">지지집단\u003c/b>을 통해 충분히 극복할 수 있다는 희망적인 메시지를 전합니다. 앞에서 설명한 원인과 해결 방법을 모두 아우르는 \u003cb class=\"key\">요약\u003c/b> 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 + 수동태\u003c/span> : 조동사 can + be + 과거분사(overcome) : \"그것은 극복될 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수단의 전치사 through + 명사구 병렬\u003c/span> : through + [명사구 A] + and + [명사구 B] : \"좋은 의사소통과 강력한 지지집단을 통해\"\u003c/div>\u003c/div>","segs":[{"n":54,"text":"Burnout is a serious condition, 번아웃은 심각한 문제이다. but it can be overcome, 그러나 그것은 극복될 수 있다. through good communication, 좋은 의사소통을 통해. and a strong support group, 그리고 강력한 지지집단을 통해.. 이 문장 전체를 해석하면, 번아웃은 심각한 문제이지만, 그것은 좋은 의사소통과 강력한 지지집단을 통해 극복될 수 있다.","hl":"m"},{"n":55,"text":"이 문장은 글 전체를 마무리하는 결론이에요. 번아웃이 심각한 문제이긴 하지만 좋은 의사소통과 강력한 지지집단을 통해 충분히 극복할 수 있다는 희망적인 메시지를 전하죠. 앞에서 설명한 원인과 해결 방법을 모두 아우르는 요약 문장입니다.","hl":"mn"},{"n":56,"text":"첫 번째로 it can be overcome은 조동사 can 뒤에 be와 과거분사가 온 수동태로, 번아웃이 극복된다는 수동의 의미를 나타내요. 두 번째로 through good communication and a strong support group에서 through는 수단을 나타내는 전치사이고, good communication과 a strong support group이 and로 병렬 연결되어 있습니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>마크는 회사 발표를 준비하느라 매일 밤늦도록 깨어 있다가 극도로 피곤해지고 \u003cb class=\"key\">우울\u003c/b>해진다.\u003c/li>\u003cli>이러한 상태는 오랫동안 너무 열심히 일할 때 나타나는 \u003cb class=\"key\">번아웃 \u003c/b>\u003cb class=\"key\">증후군\u003c/b>의 한 예이다.\u003c/li>\u003cli>다른 사람들과 \u003cb class=\"key\">밀접하게\u003c/b> 일하는 직업이나 불규칙한 시간에 일하는 직업이 특히 위험하다.\u003c/li>\u003cli>존중과 신뢰가 있는 \u003cb class=\"key\">근무 \u003c/b>\u003cb class=\"key\">환경\u003c/b>과 좋은 의사소통, 강력한 지지집단이 번아웃 극복을 돕는다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Burnout syndrome results from working too hard for too long and is especially common in people-oriented or irregular-hour jobs, but it can be overcome through a supportive work environment and good communication.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: 마크의 사례처럼 오랫동안 과도하게 일하면 \u003cb class=\"key\">번아웃 \u003c/b>\u003cb class=\"key\">증후군\u003c/b>이 찾아온다. 사람들과 밀접하게 일하거나 불규칙한 시간에 일하는 직업이 특히 위험하지만, 존중과 신뢰가 있는 \u003cb class=\"key\">근무 \u003c/b>\u003cb class=\"key\">환경\u003c/b>과 좋은 의사소통, 강력한 지지집단을 통해 극복할 수 있다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":57,"text":"정리해 볼게요. 번아웃은 게으름이 아니라 오랫동안 과도하게 일한 사람에게 찾아오는 실제적인 상태예요. 사람을 많이 상대하는 직업이나 불규칙한 시간에 일하는 직업이라면 더 조심해야 하고요. 존중과 신뢰가 있는 근무 환경, 좋은 의사소통, 그리고 강력한 지지집단이 회복의 열쇠입니다. 오늘도 끝까지 따라와 줘서 고마워요, 다음 시간에 또 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
