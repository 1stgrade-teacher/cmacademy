<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>쥬니어리딩엑스퍼트3 Unit4_Reading01 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"쥬니어리딩엑스퍼트3 Unit4_Reading01","audioDir":"reading01_audio","preview":false,"count":78,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.400em\">Unit4_Reading01\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">쥬니어리딩엑스퍼트3\u003c/div>\u003ch1>The Job of a Professional Soccer Referee\u003c/h1>\u003ch2>프로 축구 심판의 직업\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>잉글랜드 프리미어리그 프로축구 \u003cb class=\"key\">심판\u003c/b> 마이클 빌은 \u003cb class=\"key\">경기 \u003c/b>\u003cb class=\"key\">통제\u003c/b>와 규칙 준수 확인이 주요 임무라고 말한다. 그는 축구를 가까이서 볼 수 있는 \u003cb class=\"key\">장점\u003c/b>과 스트레스 같은 \u003cb class=\"key\">단점\u003c/b>을 소개하고, 규칙 이해·체력·\u003cb class=\"key\">신속한 \u003c/b>\u003cb class=\"key\">판단\u003c/b>과 많은 \u003cb class=\"key\">훈련\u003c/b>·\u003cb class=\"key\">경험\u003c/b>이 필요하다고 설명한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>A professional soccer referee explains the duties, pros and cons, required skills, and career path of his job.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 잉글랜드 프리미어리그의 프로축구 심판인 마이클 빌의 이야기를 함께 읽어 볼 거예요. 이 글은 심판의 주요 임무와 장점과 단점, 필요한 기술, 그리고 심판이 되는 과정을 질문과 답변으로 들려줍니다. 핵심은 심판이 경기 통제와 규칙 준수 확인을 맡으며, 축구를 사랑하지만 스트레스도 감수해야 하는 전문 직업이라는 점이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">축구 경기에서 \u003cb class=\"key\">심판\u003c/b>(referee)은 선수들이 \u003cb class=\"key\">규칙\u003c/b>(rules)을 지키는지 확인하고, 반칙이 있으면 \u003cb class=\"key\">벌칙\u003c/b>(penalty)을 선언하는 사람이에요. 심판의 \u003cb class=\"key\">결정\u003c/b>(decision)은 경기 흐름과 \u003cb class=\"key\">결과\u003c/b>(result)에 큰 영향을 주기 때문에 판정의 공정성과 정확성이 중요하죠. 축구 심판은 경기 전체를 따라 뛰어야 해서 \u003cb class=\"key\">체력\u003c/b>(fitness)이 필요하고, 갑작스러운 상황에서도 \u003cb class=\"key\">신속한 \u003c/b>\u003cb class=\"key\">판단\u003c/b>(quick decision-making)을 내려야 해요. 프로 심판이 되려면 체계적인 \u003cb class=\"key\">훈련\u003c/b>(training)과 오랜 \u003cb class=\"key\">경험\u003c/b>(experience)이 필요하고, 국가 리그 수준에서는 십 년 이상의 경력이 요구되기도 합니다. 일상에서도 운동 경기의 심판은 규칙을 집행하는 재판관과 비슷해서, 모두가 납득할 수 있는 일관된 판단이 중요하답니다.\u003c/div>","segs":[{"n":2,"text":"먼저 축구에서 심판이 어떤 존재인지 생각해 볼게요. 심판은 선수들이 규칙을 지키는지 확인하고, 반칙이 있으면 벌칙을 선언하는 사람이에요. 심판의 결정은 경기 흐름과 결과에 큰 영향을 주기 때문에 공정하고 정확한 판단이 중요하죠. 또 경기 전체를 따라 뛰어야 해서 체력이 필요하고, 갑작스러운 상황에서도 신속한 판단을 내려야 해요. 프로 심판이 되려면 체계적인 훈련과 오랜 경험이 필요하고, 국가 리그 수준에서는 십 년 이상의 경력이 요구되기도 합니다. 운동 경기의 심판은 규칙을 집행하는 재판관과 비슷해서, 모두가 납득할 수 있는 일관된 판단이 중요하답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>심판의 임무\u003csmall>도입·설명 · 문장 1–6\u003c/small>\u003c/h4>\u003cp>마이클 빌은 잉글랜드 프리미어리그의 프로축구 \u003cb class=\"key\">심판\u003c/b>이다. 심판의 주요 임무는 \u003cb class=\"key\">경기 \u003c/b>\u003cb class=\"key\">통제\u003c/b>와 규칙 준수 확인이며, 선수들이 규칙을 어기면 \u003cb class=\"key\">벌칙\u003c/b>을 준다. 때로는 심판의 결정이 경기 결과를 바꾸기도 한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>장점과 단점\u003csmall>비교·전환 · 문장 7–13\u003c/small>\u003c/h4>\u003cp>가장 큰 \u003cb class=\"key\">장점\u003c/b>은 축구 경기를 가까이서 볼 수 있다는 점이다. 물론 스트레스 같은 \u003cb class=\"key\">단점\u003c/b>도 있는데, 선수·감독·팬이 판정에 동의하지 않으면 소리를 지르거나 공격하기도 한다. 그래도 그는 \u003cb class=\"key\">좋은 \u003c/b>\u003cb class=\"key\">점\u003c/b>이 나쁜 점보다 많다고 생각한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>필수 역량\u003csmall>근거·설명 · 문장 14–18\u003c/small>\u003c/h4>\u003cp>심판은 경기의 규칙을 이해해야 하며, 예전 선수 출신 심판이 많은 이유도 여기에 있다. 또한 경기 내내 뛰어야 하므로 \u003cb class=\"key\">체력\u003c/b>이 필요하다. 마지막으로 예기치 않은 사건에 대해 \u003cb class=\"key\">신속한 \u003c/b>\u003cb class=\"key\">판단\u003c/b>을 내릴 수 있어야 한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>되는 길\u003csmall>절차·결론 · 문장 19–22\u003c/small>\u003c/h4>\u003cp>프로 심판이 되려면 학교에서 많은 \u003cb class=\"key\">훈련\u003c/b>을 받아야 한다. 축구에서는 전국 리그에서 일자리를 얻기까지 십 년 이상의 \u003cb class=\"key\">경험\u003c/b>이 필요하다. 이처럼 심판은 규칙 이해와 체력, 판단력, 그리고 오랜 준비가 필요한 직업이다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 네 단계로 나누어 살펴볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 심판의 임무예요. 마이클 빌은 프로축구 심판으로서 자신의 일을 소개하고, 주요 임무가 경기 통제라고 말합니다. 선수들이 규칙을 어기면 벌칙을 주고, 때로는 자신의 결정이 경기 결과를 바꾼다고 설명하죠.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 장점과 단점을 비교해요. 가장 큰 장점은 축구 경기를 가까이서 볼 수 있다는 점이고, 스트레스 같은 단점도 있다고 말하죠. 선수, 감독, 팬이 판정에 동의하지 않으면 소리를 지르거나 공격할 수 있지만, 그는 좋은 점이 나쁜 점보다 많다고 생각합니다.","hl":"f1"},{"n":6,"text":"세 번째 단계는 심판에게 필요한 기술이에요. 경기의 규칙을 이해해야 하고, 경기 내내 뛰어야 하므로 체력이 필요하다고 합니다. 또 예기치 않은 사건에는 신속한 판단을 내릴 수 있어야 한다고 강조하죠.","hl":"f2"},{"n":7,"text":"네 번째 단계는 심판이 되는 과정이에요. 프로 심판이 되려면 학교에서 많은 훈련을 받아야 하고, 축구에서는 전국 리그에서 일자리를 얻기까지 십 년 이상의 경험이 필요합니다. 그래서 심판은 규칙 이해와 체력, 판단력, 그리고 오랜 준비가 필요한 직업이라고 정리할 수 있어요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">질문과 답변\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 3번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 심판에게 네 가지를 묻고 답하는 \u003cb class=\"key\">질문과 \u003c/b>\u003cb class=\"key\">답변\u003c/b> 형식이다. 각 답변은 주요 임무, 가장 큰 장점, 이해해야 할 규칙, 프로가 되는 방법처럼 \u003cb class=\"key\">핵심\u003c/b>을 앞부분에서 먼저 제시하는 \u003cb class=\"key\">두괄식\u003c/b> 전개를 보인다. 그래서 질문별 답의 첫 문장을 중심으로 읽으면 전체 내용을 빠르게 파악할 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Q: (2)\u003c/b>\u003cspan>질문 제시\u003c/span>\u003cb>A: (3)\u003c/b>\u003cspan>답변 시작\u003c/span>\u003cb>The main job (3)\u003c/b>\u003cspan>핵심 임무 제시\u003c/span>\u003cb>That's why (16)\u003c/b>\u003cspan>이유 설명\u003c/span>\u003cb>Also (17)\u003c/b>\u003cspan>추가 근거\u003c/span>\u003cb>finally (18)\u003c/b>\u003cspan>마지막 항목\u003c/span>\u003cb>But (13)\u003c/b>\u003cspan>관점 전환·결론\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">have to do\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">have to make sure\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">have to give\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">have to understand\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">need to have\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">need to be fit\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">have to be able to make decisions\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">must go to school\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">training is necessary\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">need more than ten years of experience\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>좋은 점\u003c/th>\u003cth>나쁜 점\u003c/th>\u003c/tr>\u003ctr>\u003ctd>축구 경기를 가까이서 볼 수 있음\u003c/td>\u003ctd>스트레스가 많음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>축구를 정말 좋아해서 재미있음\u003c/td>\u003ctd>선수·감독·팬의 비난과 공격\u003c/td>\u003c/tr>\u003ctr>\u003ctd>좋은 점이 더 많다고 생각함\u003c/td>\u003ctd>나쁜 점도 분명히 존재함\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 심판에게 묻고 답하는 질문과 답변 형식으로 되어 있어요. 각 답변에서는 주요 임무, 가장 큰 장점, 필요한 규칙, 프로가 되는 방법처럼 핵심을 앞부분에서 먼저 제시합니다. 그래서 전체 글은 각 답변의 첫 문장을 중심으로 읽는 두괄식 전개를 보인다고 볼 수 있죠. 질문이 바뀔 때마다 새로운 정보가 시작된다는 점도 기억해 두세요.","hl":"ty"},{"n":9,"text":"신호어를 보면 질문을 나타내는 Q와 답변을 나타내는 A가 반복되어 글의 뼈대를 만들어 줍니다. The main job 같은 표현은 답변의 핵심을 바로 알려 주고, But은 좋은 점에서 나쁜 점으로 관점을 전환해 줘요. Also와 finally는 필요한 기술을 하나씩 추가하고 마무리하는 표지 역할을 합니다. 또 control the game과 make sure the players follow the rules처럼 같은 개념을 다른 말로 다시 풀어 주는 재진술도 눈여겨보세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>professional\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>전문적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>referee\u003c/b>\u003cem>명사\u003c/em>\u003cspan>심판\u003c/span>\u003c/div>\u003cdiv>\u003cb>main\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>주요한\u003c/span>\u003c/div>\u003cdiv>\u003cb>control\u003c/b>\u003cem>동사\u003c/em>\u003cspan>통제하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>make sure\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>확실히 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>follow\u003c/b>\u003cem>동사\u003c/em>\u003cspan>따르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>rule\u003c/b>\u003cem>명사\u003c/em>\u003cspan>규칙\u003c/span>\u003c/div>\u003cdiv>\u003cb>break\u003c/b>\u003cem>동사\u003c/em>\u003cspan>어기다\u003c/span>\u003c/div>\u003cdiv>\u003cb>penalty\u003c/b>\u003cem>명사\u003c/em>\u003cspan>벌칙\u003c/span>\u003c/div>\u003cdiv>\u003cb>decision\u003c/b>\u003cem>명사\u003c/em>\u003cspan>결정\u003c/span>\u003c/div>\u003cdiv>\u003cb>result\u003c/b>\u003cem>명사\u003c/em>\u003cspan>결과\u003c/span>\u003c/div>\u003cdiv>\u003cb>closely\u003c/b>\u003cem>부사\u003c/em>\u003cspan>가까이서\u003c/span>\u003c/div>\u003cdiv>\u003cb>stress\u003c/b>\u003cem>명사\u003c/em>\u003cspan>스트레스\u003c/span>\u003c/div>\u003cdiv>\u003cb>coach\u003c/b>\u003cem>명사\u003c/em>\u003cspan>감독\u003c/span>\u003c/div>\u003cdiv>\u003cb>fan\u003c/b>\u003cem>명사\u003c/em>\u003cspan>팬\u003c/span>\u003c/div>\u003cdiv>\u003cb>yell at\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>...에게 소리 지르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>attack\u003c/b>\u003cem>동사\u003c/em>\u003cspan>공격하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>agree with\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>...에 동의하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>skill\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기술\u003c/span>\u003c/div>\u003cdiv>\u003cb>understand\u003c/b>\u003cem>동사\u003c/em>\u003cspan>이해하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>used to be\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>예전에 ...였다\u003c/span>\u003c/div>\u003cdiv>\u003cb>fit\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>건강한\u003c/span>\u003c/div>\u003cdiv>\u wiftly\u003c/span>\u003cspan class=\"s\">fast\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">slowly\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"시험에 자주 나오는 어휘를 동의어와 반의어로 묶어 볼게요. professional은 expert, qualified와 비슷하고 amateur와 반대이며, main은 primary, chief와 같은 뜻이고 minor와 대조됩니다. control은 manage, regulate와 가깝고 release와 반대되며, follow는 obey, comply with와 비슷하고 break와 반대돼요. decision은 choice, judgment로 바꿔 쓸 수 있고 necessary는 essential, required와 가깝지만 unnecessary와 반대입니다. agree with는 consent to, concur with와 같은 뜻이고 disagree with와 반대되며, quickly는 rapidly, swiftly와 비슷하고 slowly와 반대예요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 22\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마이클 빌은,\u003c/span>\u003cspan class=\"en\">Michael Beal,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">프로축구 심판인\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">professional \u003c/span>\u003cspan class=\"tgt\">soccer \u003c/span>\u003cspan class=\"tgt\">referee \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">잉글랜드 프리미어리그의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">England's \u003c/span>\u003cspan class=\"tgt\">Premier \u003c/span>\u003cspan class=\"tgt\">League\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리에게 말한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">tells\u003c/span> us\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 직업에 대해\u003c/span>\u003cspan class=\"en\">about his job.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">잉글랜드 프리미어리그의 프로축구 심판인 마이클 빌이 우리에게 그의 직업에 대해 말한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 잉글랜드 프리미어리그의 \u003cb class=\"key\">프로 \u003c/b>\u003cb class=\"key\">심판\u003c/b> 마이클 빌이 자신의 직업을 소개하며 글을 여는 도입 문장입니다. 콤마 사이의 \u003cb class=\"key\">동격\u003c/b> 표현이 그가 누구인지 알려 주고, 마지막의 tells us about his job이 글 전체의 \u003cb class=\"key\">화제\u003c/b>를 제시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동격(콤마 동격)\u003c/span> : [명사] , [명사구] , → 앞 명사를 부연 설명 : \"잉글랜드 프리미어리그의 프로축구 심판인\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주어-동사 수 일치(3인칭 단수 현재)\u003c/span> : [3인칭 단수 주어] + [동사 + s] : \"말한다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Michael Beal, 마이클 빌은. a professional soccer referee, 프로축구 심판인. in England's Premier League, 잉글랜드 프리미어리그의. tells us, 우리에게 말한다. about his job, 그의 직업에 대해. 이 문장 전체를 해석하면, 잉글랜드 프리미어리그의 프로축구 심판인 마이클 빌이 우리에게 그의 직업에 대해 말한다.","hl":"m"},{"n":13,"text":"이 문장은 글의 도입부예요. 잉글랜드 프리미어리그의 프로 심판인 마이클 빌이 자기 직업을 소개하면서 이야기를 시작하죠. 콤마 사이에 나오는 동격 표현이 그가 누구인지 알려 주고, tells us about his job이라는 부분이 글 전체의 화제를 던져 줍니다.","hl":"mn"},{"n":14,"text":"첫 번째로 콤마 동격을 보세요. Michael Beal 뒤에 콤마로 끊어진 a professional soccer referee in England's Premier League가 와서 앞의 사람이 어떤 사람인지 부연 설명해 줍니다. be동사로 바꾸면 Michael Beal is a professional soccer referee가 되는 동격 관계예요. 두 번째로 동사 tells를 보면 진짜 주어는 동격구를 뺀 Michael Beal 하나라서 단수로 보고 -s를 붙인 거예요. 동격이 중간에 끼어들어도 수 일치는 원래 주어를 기준으로 한다는 점, 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 22\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">질문:\u003c/span>\u003cspan class=\"en\">Q:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">심판은 무엇을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">What \u003c/span>\u003cspan class=\"tgt\">does \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">referee \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">해야 합니까\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">do\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">경기 중에\u003c/span>\u003cspan class=\"en\">during a game?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Q: 심판은 경기 중에 무엇을 해야 합니까?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 인터뷰의 첫 번째 \u003cb class=\"key\">질문\u003c/b>으로, 심판의 역할에 대한 답변을 이끌어 내는 문장입니다. 의문사 What이 have to do의 \u003cb class=\"key\">목적어\u003c/b> 역할을 하고, 조동사 does가 주어 앞으로 나온 \u003cb class=\"key\">도치\u003c/b> 의문문이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문사가 있는 의문문의 도치\u003c/span> : [의문사] + [do/does/did] + [주어] + [동사원형] : \"심판은 무엇을 해야 합니까\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 상당 표현 have to\u003c/span> : [have to] + [동사원형] : \"해야 한다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Q, 질문:. What does a referee, 심판은 무엇을. have to do, 해야 합니까. during a game?, 경기 중에. 이 문장 전체를 해석하면, Q: 심판은 경기 중에 무엇을 해야 합니까?","hl":"m"},{"n":16,"text":"인터뷰의 첫 번째 질문이에요. 심판이 경기 중에 어떤 일을 해야 하는지 물으면서 바로 다음 답변을 끌어내는 역할을 하죠.","hl":"mn"},{"n":17,"text":"첫 번째로 의문사가 있는 의문문의 도치를 보세요. 의문사 What이 원래 목적어 자리에서 앞으로 나오고, 조동사 does가 주어 a referee 앞에 놓였어요. 이렇게 조동사가 주어 앞으로 나오는 것을 도치라고 하고, 조동사가 나오면 본동사는 반드시 원형이 된다는 것도 함께 기억해 주세요. 두 번째로 have to do에서 have to는 의무를 나타내는 조동사 상당 표현이라서 뒤에 동사원형 do가 온답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 22\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">답:\u003c/span>\u003cspan class=\"en\">A:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">심판의 주요 임무는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">The \u003c/span>\u003cspan class=\"tgt\">main \u003c/span>\u003cspan class=\"tgt\">job \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">referee\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~이다\u003c/span>\u003cspan class=\"en\">is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">경기를 통제하는 것\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">control \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">game\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">A: 심판의 주요 임무는 경기를 통제하는 것입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 심판의 역할을 한 문장으로 \u003cb class=\"key\">정의\u003c/b>하는 핵심 문장입니다. 주어 The main job of a referee 뒤에 to부정사가 \u003cb class=\"key\">주격 \u003c/b>\u003cb class=\"key\">보어\u003c/b>로 와서 '~하는 것이다'라는 뜻을 만들어 냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 of를 이용한 명사구(주어)\u003c/span> : [the main job] + [of + 명사] : \"심판의 주요 임무\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(주격 보어)\u003c/span> : [be동사] + [to부정사] → 주어의 내용 설명 : \"경기를 통제하는 것\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"A, 답:. The main job of a referee, 심판의 주요 임무는. is, ~이다. to control the game, 경기를 통제하는 것. 이 문장 전체를 해석하면, A: 심판의 주요 임무는 경기를 통제하는 것입니다.","hl":"m"},{"n":19,"text":"이 문장은 심판의 역할을 한 문장으로 정의하는 핵심 문장이에요. 주어인 The main job of a referee 뒤에 to부정사가 주격 보어로 와서 임무가 무엇인지 딱 정해 주죠.","hl":"mn"},{"n":20,"text":"첫 번째로 주어 부분을 보세요. The main job of a referee에서 of는 소유 관계를 나타내서 심판의 주요 임무라고 해석하고, 이 명사구 전체가 문장의 주어가 됩니다. 두 번째로 be동사 is 뒤에 온 to control the game을 보세요. 이 to부정사는 주어의 내용을 풀어 설명하는 주격 보어예요. 그래서 심판의 주요 임무는 경기를 통제하는 것이라는 등식이 성립한답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 22\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 확실히 해야 합니다\u003c/span>\u003cspan class=\"en\">You \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">sure \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">선수들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">players \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">규칙들을 따르도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">follow \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">rules\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">당신은 선수들이 규칙들을 따르도록 확실히 해야 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 심판의 주요 임무인 \u003cb class=\"key\">경기 \u003c/b>\u003cb class=\"key\">통제\u003c/b>가 구체적으로 무엇인지 밝히는 문장이에요. make sure는 '반드시 ~하도록 \u003cb class=\"key\">확인\u003c/b>하다'라는 뜻으로, 심판에게 규칙 준수를 확실히 할 의무가 있음을 보여 주죠. the players follow the rules 앞에는 \u003cb class=\"key\">명사절\u003c/b>을 이끄는 that이 숨어 있는 구조예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 have to (의무)\u003c/span> : [주어] + have to + [동사원형] : \"~해야 한다 / 확실히 해야 한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 that의 생략 (명사절 목적어)\u003c/span> : make sure + [(that) + 주어 + 동사] : \"선수들이 규칙을 따르도록 확실히 하다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"You have to make sure, 당신은 확실히 해야 합니다. the players, 선수들이. follow the rules, 규칙들을 따르도록. 이 문장 전체를 해석하면, 당신은 선수들이 규칙들을 따르도록 확실히 해야 합니다.","hl":"m"},{"n":22,"text":"이 문장은 심판의 주요 임무인 경기 통제가 구체적으로 무엇인지 밝혀 주고 있어요. make sure는 반드시 확인하다, 확실히 하다라는 뜻으로 심판에게 규칙 준수를 확인할 의무가 있다는 걸 보여 주죠. the players follow the rules 앞에는 명사절을 이끄는 that이 숨어 있다고 이해하시면 됩니다.","hl":"mn"},{"n":23,"text":"첫 번째로, have to는 의무를 나타내는 조동사 표현이고 뒤에는 언제나 동사원형이 와요. 그래서 make sure가 동사원형 자리에 그대로 온 거예요. 두 번째로, make sure 뒤에는 주어와 동사가 있는 명사절이 목적어로 오는데, 이때 접속사 that은 보통 생략돼요. 그래서 the players follow가 바로 이어지는 것처럼 보이는 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 22\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 그들이 규칙을 어기면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">If \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">break \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">rules\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 주어야 합니다\u003c/span>\u003cspan class=\"en\">you \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">give\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">벌칙을\u003c/span>\u003cspan class=\"en\">a penalty.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들이 규칙을 어기면 벌칙을 줘야 하고요,\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 규칙 준수를 뒤집어, 규칙을 어겼을 때 따라오는 \u003cb class=\"key\">결과\u003c/b>를 제시하는 문장이에요. if절로 \u003cb class=\"key\">조건\u003c/b>을 먼저 세우고, 주절에서 give a penalty라는 심판의 \u003cb class=\"key\">의무\u003c/b>를 말하고 있죠. 규칙 위반과 판정이 곧바로 이어지는 흐름을 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조건을 나타내는 부사절 접속사 if\u003c/span> : If + [주어] + [동사(현재형)], [주어] + [조동사] : \"만약 그들이 규칙을 어기면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 have to (의무)\u003c/span> : have to + [동사원형] : \"주어야 한다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"If they break the rules, 만약 그들이 규칙을 어기면. you have to give, 당신은 주어야 합니다. a penalty, 벌칙을. 이 문장 전체를 해석하면, 그들이 규칙을 어기면 벌칙을 줘야 하고요,","hl":"m"},{"n":25,"text":"앞 문장에서 규칙을 따르라고 했으니, 이번엔 규칙을 어겼을 때의 결과를 말하고 있어요. if절로 조건을 먼저 세우고 주절에서 give a penalty, 즉 벌칙을 준다는 의무를 말하죠. 규칙 위반과 판정이 바로 이어지는 흐름이라고 보시면 돼요.","hl":"mn"},{"n":26,"text":"첫 번째로, if는 조건을 나타내는 부사절 접속사예요. 미래의 일이라도 if절 안에서는 현재형을 쓰는 게 원칙입니다. 두 번째로, have to 뒤에는 동사원형이 와서 의무를 나타내요. 그래서 give가 그대로 온 것이고, give a penalty처럼 목적어까지 함께 챙겨 주면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 22\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">때때로\u003c/span>\u003cspan class=\"en\">Sometimes\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신의 결정이\u003c/span>\u003cspan class=\"en\">your decisions\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">결과를 바꿉니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">change\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">results \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">경기의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">game\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">때때로 당신의 결정이 경기 결과를 바꾸기도 하지요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 심판의 판정이 단순한 규칙 집행을 넘어 \u003cb class=\"key\">경기 \u003c/b>\u003cb class=\"key\">결과\u003c/b>까지 좌우한다는 점을 강조하는 문장이에요. 문두의 Sometimes가 '항상은 아니지만 \u003cb class=\"key\">때때로\u003c/b>'라는 빈도를 더해 주죠. 그래서 뒤에 이어지는 심판의 \u003cb class=\"key\">책임\u003c/b>과 스트레스 이야기의 근거가 되어 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">3형식 완전타동사\u003c/span> : [주어] + [타동사] + [목적어] : \"~을 바꾸다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 of의 한정 용법(명사 수식)\u003c/span> : [명사] + of + [명사] : \"경기의 결과\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Sometimes, 때때로. your decisions, 당신의 결정이. change the results, 결과를 바꿉니다. of the game, 경기의. 이 문장 전체를 해석하면, 때때로 당신의 결정이 경기 결과를 바꾸기도 하지요.","hl":"m"},{"n":28,"text":"이 문장은 심판의 판정이 단순히 규칙을 집행하는 데서 끝나지 않고 경기 결과까지 좌우한다는 걸 강조해요. 문두에 있는 Sometimes가 항상은 아니지만 때때로라는 빈도를 더해 주죠. 그래서 심판이라는 일에 책임이 크다는 뒤의 흐름으로 자연스럽게 이어집니다.","hl":"mn"},{"n":29,"text":"첫 번째로, change는 목적어를 필요로 하는 완전타동사예요. 그래서 뒤에 the results라는 목적어가 반드시 와야 하고, 목적어 없이 쓰이면 변하다라는 자동사가 됩니다. 두 번째로, of는 앞 명사의 대상을 뒤에서 한정해 주는 전치사예요. the results of the game 전체가 change의 목적어 역할을 하고 있다는 것도 같이 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 22\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Q: 무엇입니까\u003c/span>\u003cspan class=\"en\">Q: \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">What \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">좋은 것들은 (장점은)\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">good \u003c/span>\u003cspan class=\"tgt\">things\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신의 직업에 관한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">about \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">job\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Q: 당신 직업의 장점은 무엇입니까?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 인터뷰 형식의 질문으로, 면접관이 심판에게 직업의 \u003cb class=\"key\">장점\u003c/b>을 묻는 부분이에요. 앞의 Q는 \u003cb class=\"key\">질문\u003c/b>을 뜻하는 표시이며, good things를 '좋은 점, 장점'으로 잡으면 뒤에 나오는 답변의 흐름이 자연스럽게 연결됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문사가 이끄는 의문문(be동사 도치)\u003c/span> : [의문사 What] + [be동사 are] + [주어 the good things] : \"좋은 것들은 무엇입니까\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 수식\u003c/span> : [the good things] + [about your job (전치사구)] : \"당신의 직업에 관한\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Q: What are, Q: 무엇입니까. the good things, 좋은 것들은 (장점은). about your job?, 당신의 직업에 관한. 이 문장 전체를 해석하면, Q: 당신 직업의 장점은 무엇입니까?","hl":"m"},{"n":31,"text":"맨 앞에 Q가 붙어 있으니 질문이라는 걸 바로 알 수 있죠. 면접관이 심판에게 직업의 장점을 묻고 있는 장면이에요. good things를 그냥 '좋은 것들'로만 두지 말고 장점으로 잡아 주면 다음 답변이 훨씬 잘 들려요.","hl":"mn"},{"n":32,"text":"첫 번째, 의문사 What이 앞으로 나오면서 be동사 are가 주어 앞으로 도치됐어요. 두 번째, about your job은 전치사구가 the good things를 뒤에서 꾸며 주는 형용사구예요. 한국어처럼 '직업에 관한 좋은 점'이라고 앞에서 꾸미지 않고 영어는 뒤에서 붙여 준다는 점을 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 22\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">있습니까\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Are \u003c/span>\u003cspan class=\"tgt\">there\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 나쁜 점들이라도 (혹 단점도)\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">any \u003c/span>\u003cspan class=\"tgt\">bad \u003c/span>\u003cspan class=\"tgt\">things\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">혹 단점도 있습니까?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 질문에 이어 혹시 \u003cb class=\"key\">단점\u003c/b>도 있는지 덧붙여 묻는 질문이에요. any를 '어떤 ~라도'로 살려 주면 '혹 단점도 있습니까'라는 부드러운 뉘앙스가 그대로 나옵니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">There is/are 구문의 의문문\u003c/span> : [Are] + [there] + [주어 any bad things?] : \"~이 있습니까?\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">의문문에서의 any\u003c/span> : [any] + [가산 복수명사 bad things] : \"어떤 나쁜 점이라도\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"Are there, 있습니까. any bad things?, 어떤 나쁜 점들이라도 (혹 단점도). 이 문장 전체를 해석하면, 혹 단점도 있습니까?","hl":"m"},{"n":34,"text":"앞 질문에 이어서 혹시 단점도 있는지 살짝 덧붙여 묻는 문장이에요. any를 '어떤 ~라도'로 살려 주면 '혹 단점도 있습니까'라는 부드러운 느낌이 자연스럽게 살아납니다. 여기서 말하는 건 직업의 단점이죠.","hl":"mn"},{"n":35,"text":"첫 번째, there be 구문의 의문문이라서 be동사 Are가 there 앞으로 나왔어요. 두 번째, 의문문에서는 some 대신 any를 써서 '어떤 나쁜 점이라도'라는 뜻을 만들어요. 이 둘만 잡으면 이 문장은 끝이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 22\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">A: 가장 좋은 것은 ~입니다\u003c/span>\u003cspan class=\"en\">A: \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">The \u003c/span>\u003cspan class=\"tgt\">best \u003c/span>\u003cspan class=\"tgt\">thing\u003c/span> is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내가 볼 수 있다는 것\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">watch \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">축구 경기를 가까이서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">soccer \u003c/span>\u003cspan class=\"tgt\">games \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">closely\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">A: 가장 큰 장점은 축구 경기를 가까이서 볼 수 있다는 것이지요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 심판이 답변을 시작하며 직업의 가장 큰 \u003cb class=\"key\">장점\u003c/b>을 꼽는 문장이에요. '축구 경기를 가까이서 볼 수 있다'는 점을 최고로 들고 있으며, is 뒤에 that이 생략된 절이 와서 '~라는 것'으로 해석됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">최상급 형용사\u003c/span> : [the] + [최상급 best] + [명사 thing] : \"가장 좋은 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 that의 생략(보어절)\u003c/span> : [The best thing] + [is] + [(that) I can watch ~ closely] : \"내가 축구 경기를 가까이서 볼 수 있다는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">부사(동사 수식)\u003c/span> : [watch] + [soccer games] + [closely(부사)] : \"가까이서, 면밀히\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"A: The best thing is, A: 가장 좋은 것은 ~입니다. I can watch, 내가 볼 수 있다는 것. soccer games closely, 축구 경기를 가까이서. 이 문장 전체를 해석하면, A: 가장 큰 장점은 축구 경기를 가까이서 볼 수 있다는 것이지요.","hl":"m"},{"n":37,"text":"드디어 심판의 답변이 시작되는 문장이에요. 가장 큰 장점으로 축구 경기를 가까이서 볼 수 있다는 점을 꼽고 있죠. is 뒤에 that이 생략된 절이 통째로 와서 '~라는 것'으로 해석된다는 게 핵심이에요.","hl":"mn"},{"n":38,"text":"첫 번째, 최상급 best 앞에 the를 붙여 '가장 좋은 것'이라는 뜻을 만들었어요. 두 번째, is 뒤에 완전한 절이 이어지는데 접속사 that이 생략된 명사절 보어예요. 회화체에서는 that을 자주 생략하니 절이 통째로 보어 자리에 왔다고 생각하면 됩니다. 세 번째, closely는 동사 watch를 꾸미는 부사로 '가까이서'라는 뜻을 더해 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 22\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제게는 이것이 재미있습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">This\u003c/span> is fun \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">me\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜냐하면 저는 축구를 정말로 좋아하기 때문에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">because \u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">really \u003c/span>\u003cspan class=\"tgt\">love \u003c/span>\u003cspan class=\"tgt\">soccer\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">저는 축구를 정말로 좋아하기 때문에 제게는 이것이 재미있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 축구 경기를 가까이서 볼 수 있다는 \u003cb class=\"key\">장점\u003c/b>을 말했고, 이 문장은 그 \u003cb class=\"key\">이유\u003c/b>를 밝히는 부분이에요. fun이라는 \u003cb class=\"key\">감정\u003c/b>의 대상이 나라는 점을 for me로 분명히 해 주죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지시대명사 this\u003c/span> : This(앞 문장 내용 지칭) + is + [형용사] : \"이것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 for + 목적격(판단의 대상)\u003c/span> : be + 형용사 + for + [사람] : \"제게는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">이유를 나타내는 접속사 because\u003c/span> : [주절] + because + [이유 절] : \"왜냐하면 저는 축구를 정말로 좋아하기 때문에\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"This is fun for me, 제게는 이것이 재미있습니다. because I really love soccer, 왜냐하면 저는 축구를 정말로 좋아하기 때문에. 이 문장 전체를 해석하면, 저는 축구를 정말로 좋아하기 때문에 제게는 이것이 재미있습니다.","hl":"m"},{"n":40,"text":"앞 문장에서 축구 경기를 가까이서 볼 수 있다는 장점을 말했죠. 이 문장은 그 이유를 밝히는 부분이에요. 재미있다는 감정이 나에게 해당된다는 걸 for me로 짚어 주고 있어요.","hl":"mn"},{"n":41,"text":"첫 번째로 This는 앞 문장의 내용 전체를 받는 지시대명사예요. 두 번째로 for me에서 for는 fun이라는 감정이 누구에게 성립하는지를 밝혀 주는 역할을 하죠. 세 번째로 because는 앞의 결과에 대한 이유를 뒤에서 덧붙이는 접속사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 22\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">물론,\u003c/span>\u003cspan class=\"en\">Of course,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나쁜 점들도 있지요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">bad \u003c/span>\u003cspan class=\"tgt\">things\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">too\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">스트레스 같은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">such \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">stress\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">물론 스트레스 같은 나쁜 점들도 있지요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 장점을 충분히 말했으니 이제 \u003cb class=\"key\">단점\u003c/b>을 꺼내는 부분이에요. stress라는 \u003cb class=\"key\">구체적인 \u003c/b>\u003cb class=\"key\">예\u003c/b>를 들어 담담하게 인정하는 흐름이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">유도부사 there + be동사(존재 구문)\u003c/span> : There + be + [주어] (+ 상황 표현) : \"나쁜 점들이 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">첨가의 부사 too\u003c/span> : [긍정문] + too : \"역시, 또한\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">예시를 나타내는 such as\u003c/span> : such as + [예시 명사] : \"스트레스 같은\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"Of course, 물론. there are bad things too, 나쁜 점들도 있지요. such as stress, 스트레스 같은. 이 문장 전체를 해석하면, 물론 스트레스 같은 나쁜 점들도 있지요.","hl":"m"},{"n":43,"text":"앞에서 장점을 충분히 말했으니 이제 단점을 꺼내는 부분이에요. stress라는 구체적인 예를 들어 담담하게 인정하는 흐름이죠.","hl":"mn"},{"n":44,"text":"첫 번째로 there are bad things는 주어를 뒤로 보내고 there를 앞세우는 존재 구문이에요. 두 번째로 such as stress에서 such as는 bad things의 구체적인 예시를 하나 들어 주는 표현이죠. 세 번째로 too는 앞에서 장점을 말했으니 단점도 있다는 첨가의 뜻을 더해 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 22\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">선수들, 감독들 그리고 팬들이\u003c/span>\u003cspan class=\"en\">Players, coaches, and fans\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신에게 소리를 지르고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">yell \u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">심지어는 당신을 공격합니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">even \u003c/span>\u003cspan class=\"tgt\">attack \u003c/span>\u003cspan class=\"tgt\">you\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신의 결정에 동의하지 않을 경우\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">if \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">agree \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">decision\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">선수들, 감독들 그리고 팬들이 당신의 결정에 동의하지 않을 경우 당신에게 소리를 지르고 심지어는 당신을 공격합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 심판이라는 직업의 \u003cb class=\"key\">단점\u003c/b>을 구체적으로 보여 주는 문장이에요. 사람들의 반응이 결정에 동의하지 않을 때라는 \u003cb class=\"key\">조건\u003c/b> 아래 일어난다는 점을 if로 묶어 설명하죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사구의 병렬(and)\u003c/span> : [yell at + 목적어] and [attack + 목적어] : \"당신에게 소리 지르고 공격한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">강조의 부사 even\u003c/span> : even + [동사] : \"심지어 당신을 공격한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">조건의 접속사 if\u003c/span> : if + [조건 절], [주절] : \"그들이 당신의 결정에 동의하지 않으면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">전치사 with를 쓰는 agree\u003c/span> : agree with + [사람/의견·결정] : \"당신의 결정에 동의하다\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"Players, coaches, and fans, 선수들, 감독들 그리고 팬들이. yell at you, 당신에게 소리를 지르고. and even attack you, 심지어는 당신을 공격합니다. if they don't agree with your decision, 당신의 결정에 동의하지 않을 경우. 이 문장 전체를 해석하면, 선수들, 감독들 그리고 팬들이 당신의 결정에 동의하지 않을 경우 당신에게 소리를 지르고 심지어는 당신을 공격합니다.","hl":"m"},{"n":46,"text":"심판이라는 직업의 단점을 구체적으로 보여 주는 문장이에요. 사람들의 반응이 결정에 동의하지 않을 때라는 조건 아래 일어난다는 점을 if로 묶어 설명하고 있죠.","hl":"mn"},{"n":47,"text":"첫 번째로 yell at you and even attack you에서는 같은 주어가 하는 두 동작을 and로 병렬로 연결했어요. 두 번째로 even은 앞의 행동보다 정도가 심한 것을 강조하는 부사죠. 세 번째로 if they don't agree with your decision은 주절의 행동이 일어나는 조건을 제시하는 조건 부사절이에요. 네 번째로 agree with는 의견이나 결정에 동의할 때 쓰는 전치사 with의 짝이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 22\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만\u003c/span>\u003cspan class=\"en\">But\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 생각합니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">think\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">있습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">are\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 많은 좋은 점들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">good \u003c/span>\u003cspan class=\"tgt\">things \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 직업에 관한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">about \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">job \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나쁜 점들보다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">bad \u003c/span>\u003cspan class=\"tgt\">things\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 저는 이 직업에는 나쁜 점들보다는 좋은 점들이 더 많이 있다고 생각합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 스트레스 같은 단점을 언급한 뒤, 전체적으로는 좋은 점이 더 많다고 긍정적으로 정리하는 문장입니다. \u003cb class=\"key\">more \u003c/b>\u003cb class=\"key\">A \u003c/b>\u003cb class=\"key\">than \u003c/b>\u003cb class=\"key\">B\u003c/b>는 'B보다 더 많은 A'라는 비교 표현이고, 여기서는 \u003cb class=\"key\">좋은 \u003c/b>\u003cb class=\"key\">점\u003c/b>이 \u003cb class=\"key\">나쁜 \u003c/b>\u003cb class=\"key\">점\u003c/b>보다 많다는 뜻입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that의 생략\u003c/span> : I think + [(that) + 주어 + 동사 ...] : \"저는 ~라고 생각합니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">there is/are 구문(유도부사)\u003c/span> : There + be동사 + 주어 ... : \"~이 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">비교급 more A than B\u003c/span> : more + [명사] + than + [비교 대상] : \"나쁜 점들보다 더 많은 좋은 점들\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"But, 하지만. I think, 저는 생각합니다. there are, 있습니다. more good things, 더 많은 좋은 점들이. about the job, 이 직업에 관한. than bad things, 나쁜 점들보다. 이 문장 전체를 해석하면, 하지만 저는 이 직업에는 나쁜 점들보다는 좋은 점들이 더 많이 있다고 생각합니다.","hl":"m"},{"n":49,"text":"이 문장은 앞에서 스트레스 같은 단점을 이야기한 뒤, 결국 이 직업에는 좋은 점이 더 많다고 정리하는 문장이에요. more A than B는 B보다 더 많은 A라는 비교 표현이고, 여기서는 좋은 점이 나쁜 점보다 많다는 뜻이죠.","hl":"mn"},{"n":50,"text":"첫 번째, I think 뒤에는 원래 that절이 오지만 that이 흔히 생략되어 바로 주어와 동사가 이어져요. 두 번째, there are는 유도부사 there를 앞세워 '~이 있다'를 말하는 구문이고, 뒤 주어에 맞춰 be동사를 써요. 세 번째, more good things about the job than bad things는 many의 비교급 more를 써서 than 뒤의 bad things와 비교하는 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 22\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Q:\u003c/span>\u003cspan class=\"en\">Q:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 기술을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">What \u003c/span>\u003cspan class=\"tgt\">skills\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">심판이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">does \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">referee\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">갖고 있어야 합니까?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">need \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">have\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Q: 심판은 어떤 기술을 갖고 있어야 합니까?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 심판이라는 직업에 필요한 기술이 무엇인지 묻는 인터뷰 질문입니다. \u003cb class=\"key\">What \u003c/b>\u003cb class=\"key\">skills\u003c/b>는 '어떤 기술들'이라는 뜻으로, 뒤에 \u003cb class=\"key\">need \u003c/b>\u003cb class=\"key\">to \u003c/b>\u003cb class=\"key\">have\u003c/b>가 와서 '갖고 있어야 하는지'를 묻습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문형용사 What\u003c/span> : What + [명사] + 조동사 + 주어 + 동사? : \"어떤 기술을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">의문문의 조동사 do\u003c/span> : 의문사 + do/does + [주어] + [동사원형]? : \"심판이 ~합니까?\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">need + to부정사\u003c/span> : need + [to + 동사원형] : \"갖고 있어야 하다\"\u003c/div>\u003c/div>","segs":[{"n":51,"text":"Q, Q:. What skills, 어떤 기술을. does a referee, 심판이. need to have?, 갖고 있어야 합니까?. 이 문장 전체를 해석하면, Q: 심판은 어떤 기술을 갖고 있어야 합니까?","hl":"m"},{"n":52,"text":"이 문장은 심판에게 필요한 기술이 무엇인지 묻는 인터뷰 질문이에요. What skills는 어떤 기술들이라는 뜻이고, need to have는 갖고 있어야 한다는 뜻으로 이어져요.","hl":"mn"},{"n":53,"text":"첫 번째, What skills에서 What은 뒤의 명사를 꾸미는 의문형용사로 쓰였어요. 두 번째, 주어 a referee가 삼인칭 단수라서 does를 쓰고 본동사 need는 원형으로 둡니다. 세 번째, need to have는 need 뒤에 to부정사가 와서 갖고 있어야 한다는 뜻을 만드는 구조예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 15 / 22\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">A:\u003c/span>\u003cspan class=\"en\">A:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 이해해야 합니다\u003c/span>\u003cspan class=\"en\">You \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">understand\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">규칙들을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">rules \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">경기의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">game\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">A: 경기의 규칙들을 이해하고 있어야 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 심판이 되기 위해 반드시 갖추어야 할 기본 조건으로 경기의 \u003cb class=\"key\">규칙\u003c/b>을 \u003cb class=\"key\">이해\u003c/b>해야 한다고 답하는 문장입니다. have to가 '~해야 한다'는 의무를 나타냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">have to + 동사원형(의무)\u003c/span> : have to + [동사원형] : \"이해해야 합니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 수식\u003c/span> : [명사] + of + [명사] : \"경기의 규칙\"\u003c/div>\u003c/div>","segs":[{"n":54,"text":"A, A:. You have to understand, 당신은 이해해야 합니다. the rules, 규칙들을. of the game, 경기의. 이 문장 전체를 해석하면, A: 경기의 규칙들을 이해하고 있어야 합니다.","hl":"m"},{"n":55,"text":"이 문장은 심판이 되기 위해 반드시 갖추어야 할 기본 조건을 말해요. 경기의 규칙을 이해해야 한다는 뜻이고, have to는 해야 한다는 의무를 나타냅니다.","hl":"mn"},{"n":56,"text":"첫 번째, have to는 해야 한다는 의무를 나타내고 뒤에는 동사원형 understand가 와요. 두 번째, of the game은 앞의 the rules를 뒤에서 꾸며 경기의 규칙이라는 의미를 만들어 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 16 / 22\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그렇기 때문에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">That's \u003c/span>\u003cspan class=\"tgt\">why\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 심판들이 있습니다\u003c/span>\u003cspan class=\"en\">there are many referees\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예전에 선수였던\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">used \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">players\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그렇기 때문에 예전에 선수였던 심판들이 많습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 '경기 규칙을 이해해야 한다'고 했으니, 그 결과로 \u003cb class=\"key\">선수 \u003c/b>\u003cb class=\"key\">출신\u003c/b> 심판이 많다는 것을 이어 주는 문장이에요. That's why는 앞 문장의 \u003cb class=\"key\">이유\u003c/b>를 받아 \u003cb class=\"key\">결과\u003c/b>를 말할 때 씁니다. used to는 '예전에는 ~였다'는 뜻이라 지금은 선수가 아니라는 점도 함께 알 수 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">That's why + 절 (이유→결과 연결 표현)\u003c/span> : That's why + [주어 + 동사] (앞 내용의 결과) : \"그렇기 때문에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 who + used to\u003c/span> : [선행사 many referees] + who + [동사] (주격 관계대명사절) : \"예전에 선수였던\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">used to + 동사원형 (과거의 상태·습관)\u003c/span> : used to + [동사원형 be] : \"예전에 ~였다\"\u003c/div>\u003c/div>","segs":[{"n":57,"text":"That's why, 그렇기 때문에. there are many referees, 많은 심판들이 있습니다. who used to be players, 예전에 선수였던. 이 문장 전체를 해석하면, 그렇기 때문에 예전에 선수였던 심판들이 많습니다.","hl":"m"},{"n":58,"text":"앞에서 규칙을 이해해야 한다고 했죠. 그래서 그 결과로 예전에 선수였던 심판이 많다는 거예요. 선수 출신은 규칙을 몸으로 익혔기 때문에 심판 일에 강하다는 흐름으로 읽으면 됩니다.","hl":"mn"},{"n":59,"text":"첫 번째로 That's why는 앞 문장의 이유를 받아서 결과를 말해 주는 표현이에요. 두 번째로 who는 many referees를 꾸며 주는 주격 관계대명사이고, 세 번째로 used to be는 지금은 아니지만 과거의 상태를 나타내요. 그래서 '예전에 선수였던'으로 해석합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 17 / 22\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또한,\u003c/span>\u003cspan class=\"en\">Also,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 건강해야 합니다\u003c/span>\u003cspan class=\"en\">you \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">need \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">fit\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜냐하면 당신은 뛰어다니기 때문에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">because \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">run \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전체 경기 내내\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">throughout \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">whole \u003c/span>\u003cspan class=\"tgt\">game\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">또한 전체 경기 내내 뛰어다니기 때문에 건강해야 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 심판이 갖춰야 할 두 번째 조건으로 \u003cb class=\"key\">체력\u003c/b>을 말하고 있어요. 이유는 경기 \u003cb class=\"key\">전체\u003c/b> 동안 계속 뛰어야 하기 때문이에요. '건강하다'는 뜻의 be fit은 신체 능력을 강조하는 표현이라는 점을 기억해 두세요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">need + to부정사 (타동사의 목적어)\u003c/span> : need + [to be fit (to부정사구/목적어)] : \"건강해야 한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이유의 접속사 because (부사절)\u003c/span> : because + [주어 + 동사 ~] (이유의 부사절) : \"왜냐하면 전체 경기 내내 뛰어다니기 때문에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 throughout (~내내)\u003c/span> : throughout + [명사구 the whole game] : \"전체 경기 내내\"\u003c/div>\u003c/div>","segs":[{"n":60,"text":"Also, 또한. you need to be fit, 당신은 건강해야 합니다. because you run, 왜냐하면 당신은 뛰어다니기 때문에. throughout the whole game, 전체 경기 내내. 이 문장 전체를 해석하면, 또한 전체 경기 내내 뛰어다니기 때문에 건강해야 합니다.","hl":"m"},{"n":61,"text":"심판에게 필요한 두 번째 조건이 체력이라는 문장이에요. 경기 전체를 계속 뛰어야 하니까 건강해야 한다는 거죠. be fit을 '건강하다'로 익혀 두면 좋아요.","hl":"mn"},{"n":62,"text":"첫 번째로 need 뒤에 나오는 to be fit은 need의 목적어로 쓰인 to부정사예요. 두 번째로 because는 이유를 나타내는 접속사로 이유의 부사절을 이끌고, 세 번째로 throughout는 '~내내'라는 뜻의 전치사예요. 그래서 전체 경기 내내 뛴다는 뜻이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 18 / 22\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 마지막으로,\u003c/span>\u003cspan class=\"en\">And finally,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 할 수 있어야 합니다\u003c/span>\u003cspan class=\"en\">you \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">able \u003c/span>\u003cspan class=\"tgt\">to\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">결정을 신속하게 내리는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">decisions\u003c/span> quickly\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예기치 않은 사건들에 대해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">about \u003c/span>\u003cspan class=\"tgt\">unexpected \u003c/span>\u003cspan class=\"tgt\">events\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그리고 마지막으로 예기치 않은 사건들에 대해 신속하게 결정을 내릴 수 있어야 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 심판에게 필요한 마지막 조건은 \u003cb class=\"key\">순발력\u003c/b> 있는 판단이에요. 경기 중 \u003cb class=\"key\">예기치 \u003c/b>\u003cb class=\"key\">않은\u003c/b> 일이 생기면 즉시 결정을 내려야 한다는 뜻이에요. have to와 be able to가 함께 쓰여 의무와 \u003cb class=\"key\">능력\u003c/b>을 동시에 나타내고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 have to + be able to (의무+능력)\u003c/span> : have to + [be able to + 동사원형] : \"~할 수 있어야 한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">make + 명사 (관용 표현)\u003c/span> : make + [decisions (목적어)] : \"결정을 내리다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 about + 명사구 (대상 표시)\u003c/span> : about + [unexpected events] : \"예기치 않은 사건들에 대해\"\u003c/div>\u003c/div>","segs":[{"n":63,"text":"And finally, 그리고 마지막으로. you have to be able to, 당신은 할 수 있어야 합니다. make decisions quickly, 결정을 신속하게 내리는 것을. about unexpected events, 예기치 않은 사건들에 대해. 이 문장 전체를 해석하면, 그리고 마지막으로 예기치 않은 사건들에 대해 신속하게 결정을 내릴 수 있어야 합니다.","hl":"m"},{"n":64,"text":"심판에게 필요한 마지막 조건은 빠른 판단이에요. 경기 중에 예상하지 못한 일이 생기면 바로 결정을 내려야 한다는 뜻이죠. have to와 be able to가 같이 나와서 의무와 능력을 동시에 말하고 있어요.","hl":"mn"},{"n":65,"text":"첫 번째로 have to는 의무를, be able to는 능력을 나타내서 '할 수 있어야 한다'가 됩니다. 두 번째로 make decisions는 결정을 내린다는 관용 표현이에요. 세 번째로 about unexpected events는 어떤 결정인지 대상을 밝혀 주는 전치사구이고, unexpected는 예상되지 않은이라는 형용사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 19 / 22\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">질문:\u003c/span>\u003cspan class=\"en\">Q:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떻게 누군가가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">How \u003c/span>\u003cspan class=\"tgt\">does \u003c/span>\u003cspan class=\"tgt\">someone\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">심판이 됩니까?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">become \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">referee\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Q: 어떻게 심판이 됩니까?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 심판이 되는 \u003cb class=\"key\">방법\u003c/b>을 묻는 질문이에요. 이어지는 답변에서 구체적인 \u003cb class=\"key\">절차\u003c/b>가 제시될 것임을 알려 주는 역할을 하며, 글의 주제인 \u003cb class=\"key\">심판\u003c/b>의 자격 조건으로 자연스럽게 이어 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문사 How가 이끄는 의문문\u003c/span> : How + [조동사 does] + [주어 someone] : \"어떻게 누군가가\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">2형식 동사 become + 명사 보어\u003c/span> : become + [명사(보어)] : \"심판이 되다\"\u003c/div>\u003c/div>","segs":[{"n":66,"text":"Q, 질문:. How does someone, 어떻게 누군가가. become a referee?, 심판이 됩니까?. 이 문장 전체를 해석하면, Q: 어떻게 심판이 됩니까?","hl":"m"},{"n":67,"text":"이 문장은 심판이 되는 방법을 묻는 질문이에요. 앞으로 학교나 훈련 같은 구체적인 절차가 나올 것이라는 걸 알려 주고, 심판이라는 직업의 자격 조건을 소개하는 흐름을 열어 줍니다.","hl":"mn"},{"n":68,"text":"어법에서는 첫 번째로 How가 방법을 묻는 의문사로 쓰였고, does가 주어 앞에 나와 의문문을 만드는 조동사라는 점을 기억하세요. 두 번째로 become은 2형식 동사라서 뒤에 명사 보어가 와서 심판이 된다는 뜻을 완성한다는 점도 함께 봐 주세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 20 / 22\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대답:\u003c/span>\u003cspan class=\"en\">A:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">음,\u003c/span>\u003cspan class=\"en\">Well,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">프로 심판이 되기 위해서는,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">professional \u003c/span>\u003cspan class=\"tgt\">referee\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 학교에 다녀야 합니다.\u003c/span>\u003cspan class=\"en\">you \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">must \u003c/span>\u003cspan class=\"tgt\">go\u003c/span> to school.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">A: 음, 프로 심판이 되기 위해서는 학교에 다녀야 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 프로 심판이 되려면 먼저 \u003cb class=\"key\">학교\u003c/b>에 다녀야 한다는 첫 번째 조건을 제시해요. to부정사구로 \u003cb class=\"key\">목적\u003c/b>을 밝히고 must로 \u003cb class=\"key\">의무\u003c/b>를 강조하여, 뒤에 이어질 훈련과 경험 이야기의 출발점을 만들어 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : to + [동사원형] ..., [주절] : \"프로 심판이 되기 위해서는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 must + 동사원형(의무)\u003c/span> : must + [동사원형] : \"가야 합니다\"\u003c/div>\u003c/div>","segs":[{"n":69,"text":"A, 대답:. Well, 음. to be a professional referee, 프로 심판이 되기 위해서는. you must go to school, 당신은 학교에 다녀야 합니다.. 이 문장 전체를 해석하면, A: 음, 프로 심판이 되기 위해서는 학교에 다녀야 합니다.","hl":"m"},{"n":70,"text":"이 문장은 프로 심판이 되기 위해 학교에 다녀야 한다는 첫 조건을 알려 줘요. 목적을 나타내는 to부정사구와 의무를 나타내는 must를 함께 써서, 뒤에 나올 훈련과 경험 이야기의 출발점을 만들어 줍니다.","hl":"mn"},{"n":71,"text":"어법에서 첫 번째로 to be a professional referee는 '프로 심판이 되기 위해서는'이라는 목적을 나타내는 to부정사구예요. 뒤에 오는 주절의 내용이 그 목적을 이루기 위한 행동이라는 점을 기억하세요. 두 번째로 must go는 조동사 must 뒤에 동사원형 go가 온 형태로, 학교에 가야 한다는 의무를 나타냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 21 / 22\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 훈련이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">A \u003c/span>\u003cspan class=\"tgt\">lot \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">training\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">필요합니다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">necessary\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">많은 훈련이 필요하죠.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 학교 교육에 더해 많은 \u003cb class=\"key\">훈련\u003c/b>이 필요하다는 점을 덧붙여요. 심판이 되기 위해서는 단순한 지식보다 반복적인 \u003cb class=\"key\">훈련\u003c/b>이 \u003cb class=\"key\">필수\u003c/b>라는 흐름을 만들어 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">A lot of + 불가산명사\u003c/span> : A lot of + [불가산명사] : \"많은 훈련\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주어-동사 수일치(단수 취급)\u003c/span> : [불가산명사 주어] + is + [형용사 보어] : \"필요하다\"\u003c/div>\u003c/div>","segs":[{"n":72,"text":"A lot of training, 많은 훈련이. is necessary, 필요합니다.. 이 문장 전체를 해석하면, 많은 훈련이 필요하죠.","hl":"m"},{"n":73,"text":"이 문장은 학교 교육에 더해 많은 훈련이 필요하다는 점을 덧붙여요. 심판이 되기 위해서는 반복적인 훈련이 필수라는 흐름을 만들어 주며, 앞의 학교 이야기와 함께 자격 조건을 구체화합니다.","hl":"mn"},{"n":74,"text":"어법에서 첫 번째로 training은 셀 수 없는 불가산명사라서 '많은'이라는 뜻으로 A lot of를 쓴다는 점을 기억하세요. 두 번째로 A lot of training을 단수로 취급해서 동사 is가 오고, necessary가 형용사 보어로 쓰인다는 점도 함께 봐 주세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 22 / 22\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 축구의 경우,\u003c/span>\u003cspan class=\"en\">And in soccer,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 필요합니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">need \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">10년 이상의\u003c/span>\u003cspan class=\"en\"
