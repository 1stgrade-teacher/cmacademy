<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>쥬니어리딩엑스퍼트3 Unit5_Reading02 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"쥬니어리딩엑스퍼트3 Unit5_Reading02","audioDir":"reading02_audio","preview":false,"count":37,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.400em\">Unit5_Reading02\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">쥬니어리딩엑스퍼트3\u003c/div>\u003ch1>Cows That Burp Methane: A New Diet to Save the Earth\u003c/h1>\u003ch2>메탄가스를 트림하는 소, 지구를 살릴 새로운 먹이\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>소는 온종일 목초를 먹으며 하루 약 150리터의 \u003cb class=\"key\">메탄가스\u003c/b>를 트림으로 내보내 지구 온난화를 심화시킨다. 그래서 과학자들은 \u003cb class=\"key\">클로버\u003c/b>와 녹색 잎처럼 소의 트림을 줄여 줄 새로운 먹이를 연구하고 있다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Scientists are looking for a new diet for cows, such as clover and green leaves, to reduce the methane gas they burp out and slow down global warming.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘 함께 읽을 지문은 쥬니어리딩엑스퍼트에 나오는 소에 관한 글이에요. 소가 트림을 하면 어떤 일이 생기는지, 그리고 과학자들이 그 문제를 어떻게 해결하려는지 담고 있죠. 소는 하루에 약 백오십 리터의 메탄가스를 트림으로 내보내 지구 온난화를 심화시키기 때문에, 클로버 같은 새로운 먹이로 트림을 줄이려 한다는 것이 이 글의 요지예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">트림은 위에 쌓인 \u003cb class=\"key\">가스\u003c/b>를 밖으로 내보내는 아주 자연스러운 현상이에요. 소는 되새김질을 하며 온종일 \u003cb class=\"key\">목초\u003c/b>를 먹기 때문에 위 속에서 발효가 활발히 일어나고, 그 과정에서 methane gas가 다량 만들어져요. 메탄은 이산화탄소보다 훨씬 강력한 \u003cb class=\"key\">온실가스\u003c/b>(greenhouse gas)라서 지구 온난화(global warming)를 빠르게 진행시키는 주범으로 꼽혀요. 그래서 소의 트림은 단순한 생리 현상이 아니라 환경 문제로 다뤄져요. 자동차 배기가스가 대기 오염의 원인이 되는 것과 비슷하다고 생각하면 이해하기 쉬워요. 과학자들은 사료(feed)를 바꾸면 위 속 발효 과정(fermentation)이 달라져 메탄 배출이 줄어든다는 점에 주목해요.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 짚어 볼게요. 트림은 위에 쌓인 가스를 밖으로 내보내는 아주 자연스러운 현상이죠. 소는 되새김질을 하면서 온종일 목초를 먹는데, 위 속에서 발효가 활발하게 일어나면서 methane gas가 많이 만들어져요. 메탄은 이산화탄소보다 훨씬 강력한 온실가스, greenhouse gas라서 지구 온난화를 빠르게 진행시키는 주범으로 꼽혀요. 자동차 배기가스가 대기 오염의 원인이 되는 것처럼, 소의 트림도 환경에 부담을 주는 거예요. 그래서 과학자들은 사료를 바꾸면 위 속 fermentation 과정이 달라져 메탄 배출이 줄어든다는 점에 주목하고 있어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>소도 트림을 한다\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>트림을 하는 것은 \u003cb class=\"key\">인간\u003c/b>뿐만이 아니에요. 소들도 온종일 \u003cb class=\"key\">목초\u003c/b>를 먹기 때문에 자주 트림을 하죠. 즉 소의 트림은 특별한 이상이 아니라 먹이와 관련된 자연스러운 \u003cb class=\"key\">생리 \u003c/b>\u003cb class=\"key\">현상\u003c/b>이라는 점을 먼저 깔아 주는 단계예요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>메탄가스라는 문제\u003csmall>문제 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>실제로 불과 한 마리의 소가 하루에 약 150리터의 \u003cb class=\"key\">메탄가스\u003c/b>를 트림으로 내뱉어요. 이것이 문제가 되는 이유는 메탄가스가 \u003cb class=\"key\">지구 \u003c/b>\u003cb class=\"key\">온난화\u003c/b>를 증가시키기 때문이에요. 앞의 흥미로운 사실이 환경 \u003cb class=\"key\">문제\u003c/b>로 이어지는 지점이죠.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>자동차 한 대와 맞먹는 양\u003csmall>근거 · 문장 5\u003c/small>\u003c/h4>\u003cp>한 무리의 소가 가정의 \u003cb class=\"key\">자동차\u003c/b> 한 대만큼 많은 메탄가스를 만들어 낸다는 사실은 상당히 놀라워요. 이 \u003cb class=\"key\">비교\u003c/b>는 소의 트림을 가볍게 볼 일이 아니라는 것을 실감하게 해 줘요. 독자는 여기서 문제의 \u003cb class=\"key\">심각성\u003c/b>을 체감하게 됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>새로운 먹이 연구\u003csmall>해결 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>그래서 과학자들은 소들의 트림을 줄여 줄 새로운 \u003cb class=\"key\">먹이\u003c/b>에 대해 연구하고 있어요. 그리고 \u003cb class=\"key\">클로버\u003c/b>와 그 밖의 녹색 잎이 목초보다 소가 트림을 덜 하게 한다는 것을 발견했죠. 문제를 풀 \u003cb class=\"key\">실마리\u003c/b>를 찾은 셈이에요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>소들도 좋아하는 해결책\u003csmall>결론 · 문장 8\u003c/small>\u003c/h4>\u003cp>다행히 소들도 그것들을 먹는 것을 \u003cb class=\"key\">좋아한다\u003c/b>고 해요. 해결책이 환경에도 좋고 소에게도 좋다는 \u003cb class=\"key\">긍정적\u003c/b> 마무리예요. 글은 이렇게 반가운 \u003cb class=\"key\">기대\u003c/b>를 남기며 끝을 맺습니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 이제 글의 흐름을 단계별로 따라가 볼게요.","hl":null},{"n":4,"text":"첫 단계는 도입이에요. 첫 번째 문장에서 트림을 하는 것은 인간뿐만이 아니라고 말하면서 소를 꺼내죠. 그리고 두 번째 문장에서 소는 온종일 목초를 먹기 때문에 자주 트림을 한다고 설명해요. 소의 트림이 먹이와 관련된 자연스러운 생리 현상이라는 점을 먼저 깔아 주는 거예요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 문제 제기예요. 세 번째 문장을 보면 불과 한 마리의 소가 하루에 약 백오십 리터의 메탄가스를 트림으로 내뱉는다고 해요. 네 번째 문장에서는 그 이유를 밝히는데, 메탄가스가 지구 온난화를 증가시키기 때문이죠. 흥미로운 사실이 환경 문제로 이어지는 지점이에요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 근거와 강조예요. 다섯 번째 문장에서 한 무리의 소가 가정의 자동차 한 대만큼 많은 메탄가스를 만들어 낸다는 것을 알면 놀랄 거라고 하죠. 이 비교 덕분에 소의 트림을 가볍게 볼 일이 아니라는 심각성이 확 살아나요.","hl":"f2"},{"n":7,"text":"네 번째 단계는 해결이에요. 여섯 번째 문장에서 그래서 과학자들이 소들의 트림을 줄여 줄 새로운 먹이를 연구하고 있다고 말해요. 이어서 일곱 번째 문장에서는 클로버와 그 밖의 녹색 잎이 목초보다 소가 트림을 덜 하게 한다는 것을 발견했다고 하죠. 문제를 풀 실마리를 찾은 거예요.","hl":"f3"},{"n":8,"text":"마지막 단계는 결론이에요. 여덟 번째 문장에서 다행히 소들도 그것들을 먹는 것을 좋아한다고 해요. 해결책이 환경에도 좋고 소에게도 좋다는 긍정적인 마무리죠. 덕분에 글은 밝은 기대를 남기면서 끝나요.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 6번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 소의 \u003cb class=\"key\">트림\u003c/b>이라는 흥미로운 사실로 시작해, 메탄가스가 지구 온난화를 증가시킨다는 \u003cb class=\"key\">문제\u003c/b>를 제시해요. 이어서 여섯 번째 문장에서 새로운 먹이를 연구한다는 \u003cb class=\"key\">해결책\u003c/b>을 내놓고, 일곱 번째와 여덟 번째 문장에서 클로버라는 구체적인 근거와 반가운 결과로 뒷받침해요. 그래서 이 글은 \u003cb class=\"key\">문제와 \u003c/b>\u003cb class=\"key\">해결\u003c/b>의 전개 방식이고, 중심 내용이 뒤쪽에 놓인 \u003cb class=\"key\">미괄식\u003c/b> 구조예요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>In fact (3)\u003c/b>\u003cspan>구체적 사실로 강조\u003c/span>\u003cb>because (4)\u003c/b>\u003cspan>원인 제시\u003c/span>\u003cb>It may surprise you to know that (5)\u003c/b>\u003cspan>흥미 유발·강조\u003c/span>\u003cb>So (6)\u003c/b>\u003cspan>결과·해결로 전환\u003c/span>\u003cb>They found that (7)\u003c/b>\u003cspan>근거 제시\u003c/span>\u003cb>Luckily (8)\u003c/b>\u003cspan>긍정적 마무리\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">burp\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">burp out\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">produce\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">methane gas\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">new diet\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">clover and other green leaves\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">those\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"이 글의 전개 방식은 문제와 해결이에요. 소의 트림이 메탄가스를 만들고 그것이 지구 온난화를 심화시킨다는 문제를 먼저 던진 뒤, 새로운 먹이를 연구한다는 해결책으로 넘어가죠. 중심 내용이 뒤쪽에 놓여 있으니 미괄식 구조라고 볼 수 있어요. 주제문은 새로운 먹이 연구를 밝히는 여섯 번째 문장입니다.","hl":"ty"},{"n":10,"text":"신호어도 꼭 챙겨 보세요. 세 번째 문장의 In fact는 구체적인 사실로 강조해 주는 신호이고, 네 번째 문장의 because는 원인을 알려 주죠. 다섯 번째 문장의 It may surprise you to know that은 흥미를 끌고, 여섯 번째 문장의 So는 결과와 해결로 넘어가는 전환을 표시해요. 일곱 번째 문장의 They found that은 근거를 제시하고, 마지막 문장의 Luckily는 긍정적인 마무리를 예고합니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>not only A but also B\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>A뿐만 아니라 B도\u003c/span>\u003c/div>\u003cdiv>\u003cb>human\u003c/b>\u003cem>명사\u003c/em>\u003cspan>인간, 사람\u003c/span>\u003c/div>\u003cdiv>\u003cb>burp\u003c/b>\u003cem>동사\u003c/em>\u003cspan>트림하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>often\u003c/b>\u003cem>부사\u003c/em>\u003cspan>자주, 흔히\u003c/span>\u003c/div>\u003cdiv>\u003cb>grass\u003c/b>\u003cem>명사\u003c/em>\u003cspan>풀, 목초\u003c/span>\u003c/div>\u003cdiv>\u003cb>all day\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>온종일, 하루 종일\u003c/span>\u003c/div>\u003cdiv>\u003cb>in fact\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>실제로, 사실은\u003c/span>\u003c/div>\u003cdiv>\u003cb>just\u003c/b>\u003cem>부사\u003c/em>\u003cspan>불과, 단지\u003c/span>\u003c/div>\u003cdiv>\u003cb>around\u003c/b>\u003cem>부사\u003c/em>\u003cspan>약, 대략\u003c/span>\u003c/div>\u003cdiv>\u003cb>liter\u003c/b>\u003cem>명사\u003c/em>\u003cspan>리터(단위)\u003c/span>\u003c/div>\u003cdiv>\u003cb>methane\u003c/b>\u003cem>명사\u003c/em>\u003cspan>메탄\u003c/span>\u003c/div>\u003cdiv>\u003cb>per\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~당, ~마다\u003c/span>\u003c/div>\u003cdiv>\u003cb>problem\u003c/b>\u003cem>명사\u003c/em>\u003cspan>문제\u003c/span>\u003c/div>\u003cdiv>\u003cb>increase\u003c/b>\u003cem>동사\u003c/em>\u003cspan>증가시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>global warming\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지구 온난화\u003c/span>\u003c/div>\u003cdiv>\u003cb>surprise\u003c/b>\u003cem>동사\u003c/em>\u003cspan>놀라게 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>a group of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>한 무리의, 한 집단의\u003c/span>\u003c/div>\u003cdiv>\u003cb>produce\u003c/b>\u003cem>동사\u003c/em>\u003cspan>만들어 내다, 생산하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>as much as\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~만큼 많은\u003c/span>\u003c/div>\u003cdiv>\u003cb>family car\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가정용 자동차\u003c/span>\u003c/div>\u003cdiv>\u003cb>scientist\u003c/b>\u003cem>명사\u003c/em>\u003cspan>과학자\u003c/span>\u003c/div>\u003cdiv>\u003cb>work on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 대해 연구하다, 작업하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>diet\u003c/b>\u003cem>명사\u003c/em>\u003cspan>(동물의) 먹이, 식단\u003c/span>\u003c/div>\u003cdiv>\u003cb>reduce\u003c/b>\u003cem>동사\u003c/em>\u003cspan>줄이다, 감소시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>find\u003c/b>\u003cem>동사\u003c/em>\u003cspan>발견하다, 알게 되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>clover\u003c/b>\u003cem>명사\u003c/em>\u003cspan>클로버(토끼풀)\u003c/span>\u003c/div>\u003cdiv>\u003cb>cause\u003c/b>\u003cem>동사\u003c/em>\u003cspan>일으키다, 야기하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>less than\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~보다 덜한, ~미만의\u003c/span>\u003c/div>\u003cdiv>\u003cb>luckily\u003c/b>\u003cem>부사\u003c/em>\u003cspan>다행히\u003c/span>\u003c/div>\u003cdiv>\u003cb>love\u003c/b>\u003cem>동사\u003c/em>\u003cspan>매우 좋아하다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"핵심 단어도 몇 개 짚을게요. burp는 트림하다라는 동사이고, methane은 메탄, diet는 여기서 식단이 아니라 소가 먹는 먹이라는 뜻이에요. reduce는 줄이다, cause는 일으키다라는 뜻이니 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">burp\u003c/b>\u003cspan class=\"m\">트림하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">belch\u003c/span>\u003cspan class=\"s\">eruct\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">often\u003c/b>\u003cspan class=\"m\">자주\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">frequently\u003c/span>\u003cspan class=\"s\">regularly\u003c/span>\u003cspan class=\"s\">commonly\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">rarely\u003c/span>\u003cspan class=\"a\">seldom\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">increase\u003c/b>\u003cspan class=\"m\">증가시키다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">raise\u003c/span>\u003cspan class=\"s\">grow\u003c/span>\u003cspan class=\"s\">boost\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">decrease\u003c/span>\u003cspan class=\"a\">reduce\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">reduce\u003c/b>\u003cspan class=\"m\">줄이다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">decrease\u003c/span>\u003cspan class=\"s\">lessen\u003c/span>\u003cspan class=\"s\">cut\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">increase\u003c/span>\u003cspan class=\"a\">raise\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">produce\u003c/b>\u003cspan class=\"m\">만들어 내다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">make\u003c/span>\u003cspan class=\"s\">create\u003c/span>\u003cspan class=\"s\">generate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">destroy\u003c/span>\u003cspan class=\"a\">consume\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">cause\u003c/b>\u003cspan class=\"m\">일으키다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">lead to\u003c/span>\u003cspan class=\"s\">trigger\u003c/span>\u003cspan class=\"s\">bring about\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">prevent\u003c/span>\u003cspan class=\"a\">stop\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">love\u003c/b>\u003cspan class=\"m\">매우 좋아하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">like\u003c/span>\u003cspan class=\"s\">enjoy\u003c/span>\u003cspan class=\"s\">adore\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hate\u003c/span>\u003cspan class=\"a\">dislike\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어도 함께 정리해 볼게요. burp의 동의어는 belch이고, often은 frequently, increase는 raise나 grow로 바꿔 쓸 수 있어요. 반대로 increase의 반의어는 decrease나 reduce죠. produce는 make나 generate, cause는 lead to나 trigger로 바꿀 수 있고, luckily는 fortunately와 같은 뜻이에요. love의 반의어는 hate라는 것까지 같이 외워 두면 어휘 문제에서 훨씬 유리해요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 ~이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It's \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인간뿐만 아니라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">only \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">humans \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">트림을 하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">burp\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">트림을 하는 것은 인간뿐만이 아니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 트림을 하는 주체가 인간만이 아니라는 점을 강조하며 글을 여는 문장이에요. \u003cb class=\"key\">It \u003c/b>\u003cb class=\"key\">~ \u003c/b>\u003cb class=\"key\">that \u003c/b>\u003cb class=\"key\">강조구문\u003c/b>으로 humans를 강조해 '인간뿐만 아니라 동물도 트림을 한다'는 \u003cb class=\"key\">화제\u003c/b>를 던지죠. 뒤에 나올 소의 트림 이야기를 자연스럽게 예고하는 \u003cb class=\"key\">도입\u003c/b> 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">It ~ that 강조구문\u003c/span> : It is + [강조할 말: not only humans] + that + [나머지: burp] : \"트림을 하는 것은 인간뿐만이 아니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주어-동사 수 일치(복수 주어)\u003c/span> : [복수 주어 humans] + [동사 burp(원형)] : \"트림을 하는 인간들\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"It's, 그것은 ~이다. not only humans, 인간뿐만 아니라. that burp, 트림을 하는. 이 문장 전체를 해석하면, 트림을 하는 것은 인간뿐만이 아니다.","hl":"m"},{"n":14,"text":"이 문장은 트림을 하는 것이 인간만이 아니라는 걸 강조하면서 글을 열고 있어요. It과 that 사이에 humans를 넣어서 강조구문으로 만든 거죠. 그래서 인간뿐만 아니라 동물도 트림을 한다는 화제를 먼저 던지고, 뒤에 나올 소 이야기를 자연스럽게 예고하는 도입 역할을 한답니다.","hl":"mn"},{"n":15,"text":"첫 번째로 It's not only humans that burp를 보면, It과 that 사이에 강조하고 싶은 말 humans를 끼워 넣은 강조구문이에요. 두 번째로 that 뒤에 오는 동사 burp는 강조된 humans가 복수라서 복수형으로 수 일치한 형태라는 점도 꼭 챙겨 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">소들은\u003c/span>\u003cspan class=\"en\">Cows\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자주 트림을 한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">burp \u003c/span>\u003cspan class=\"tgt\">often\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들이 목초를 먹기 때문에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">because \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">eat \u003c/span>\u003cspan class=\"tgt\">grass \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">온종일\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">all \u003c/span>\u003cspan class=\"tgt\">day\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">소들도 온종일 목초를 먹기 때문에 자주 트림을 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 동물도 트림을 한다고 했으니, 그 \u003cb class=\"key\">예시\u003c/b>로 소를 꺼내는 문장이에요. 소가 트림을 자주 하는 \u003cb class=\"key\">이유\u003c/b>를 '온종일 풀을 먹기 때문'이라고 분명히 밝혀 독자를 납득시키죠. 다음 문장의 구체적인 \u003cb class=\"key\">수치\u003c/b>로 자연스럽게 이어지는 디딤돌 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">빈도부사의 위치\u003c/span> : [일반동사 burp] + [빈도부사 often] : \"자주 트림을 한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이유를 나타내는 접속사 because\u003c/span> : [주절] + because + [주어 + 동사 ~] : \"그것들이 온종일 목초를 먹기 때문에\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"Cows, 소들은. burp often, 자주 트림을 한다. because they eat grass, 그것들이 목초를 먹기 때문에. all day, 온종일. 이 문장 전체를 해석하면, 소들도 온종일 목초를 먹기 때문에 자주 트림을 한다.","hl":"m"},{"n":17,"text":"앞에서 동물도 트림을 한다고 했으니, 여기서는 그 예시로 소를 꺼내는 거예요. 소가 자주 트림을 하는 이유가 온종일 풀을 먹기 때문이라고 딱 짚어 주죠. 그래서 다음 문장에 나오는 구체적인 수치로 자연스럽게 넘어갈 수 있는 디딤돌이 된답니다.","hl":"mn"},{"n":18,"text":"첫 번째로 burp often을 보면 often 같은 빈도부사는 일반동사 뒤에 놓인다는 규칙을 보여 줘요. 두 번째로 because they eat grass all day에서 because는 이유를 이끄는 종속접속사라서 뒤에 주어와 동사가 다 갖춰진 절이 왔다는 점을 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">실제로,\u003c/span>\u003cspan class=\"en\">In fact,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">불과 한 마리의 소가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">just \u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">cow\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내뱉는다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">burps \u003c/span>\u003cspan class=\"tgt\">out\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">약 150리터를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">around \u003c/span>\u003cspan class=\"tgt\">150 \u003c/span>\u003cspan class=\"tgt\">liters \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">메탄가스의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">methane \u003c/span>\u003cspan class=\"tgt\">gas\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하루에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">per \u003c/span>\u003cspan class=\"tgt\">day\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">실제로, 불과 한 마리의 소가 하루에 약 150리터의 메탄가스를 트림을 통해 내뱉는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 말한 '소가 트림을 자주 한다'를 구체적인 \u003cb class=\"key\">수치\u003c/b>로 뒷받침하는 문장이에요. '단 한 마리'라는 just와 '150리터'라는 큰 숫자를 붙여 규모가 얼마나 큰지 독자에게 각인시키죠. 이 수치 덕분에 다음 문장의 \u003cb class=\"key\">지구온난화\u003c/b> 문제 제기가 설득력을 얻어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">just의 강조 용법\u003c/span> : [just + 수량 표현(one cow)] : \"불과 한 마리의 소\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">구동사(동사 + 부사)\u003c/span> : [동사 burp] + [부사 out] : \"트림을 통해 내뱉는다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">수량 표현 + of + 명사\u003c/span> : [수량/단위] + of + [명사] : \"약 150리터의 메탄가스\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">전치사 per\u003c/span> : [per + 단위 명사] : \"하루에\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"In fact, 실제로. just one cow, 불과 한 마리의 소가. burps out, 내뱉는다. around 150 liters, 약 150리터를. of methane gas, 메탄가스의. per day, 하루에. 이 문장 전체를 해석하면, 실제로, 불과 한 마리의 소가 하루에 약 150리터의 메탄가스를 트림을 통해 내뱉는다.","hl":"m"},{"n":20,"text":"이 문장은 소가 트림을 자주 한다는 말을 구체적인 수치로 뒷받침해요. 불과 한 마리의 소가 하루에 약 150리터나 내뱉는다는 걸 보여 주는 거죠. 이렇게 큰 숫자를 먼저 제시해 두면 다음에 나오는 지구온난화 문제 제기가 훨씬 설득력 있게 다가온답니다.","hl":"mn"},{"n":21,"text":"첫 번째로 just one cow에서 just는 단지, 불과라는 뜻으로 수량 앞에서 강조 역할을 해요. 두 번째로 burps out은 동사 burp에 부사 out이 붙어서 안에서 밖으로 내뱉는다는 뜻을 더한 구동사예요. 세 번째로 around 150 liters of methane gas를 보면 methane gas는 불가산명사라서 liters라는 단위를 빌려 양을 나타냈고, around가 약이라는 뜻으로 수치를 완화해 주고 있어요. 마지막으로 per day는 하루에, 하루당이라는 뜻의 전치사 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은 ~이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">This\u003c/span> is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">문제가\u003c/span>\u003cspan class=\"en\">a problem\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜냐하면 메탄가스가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">because \u003c/span>\u003cspan class=\"tgt\">methane \u003c/span>\u003cspan class=\"tgt\">gas \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지구 온난화를 증가시키기 때문이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">increases \u003c/span>\u003cspan class=\"tgt\">global \u003c/span>\u003cspan class=\"tgt\">warming\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것은 문제가 되는데, 메탄가스가 지구 온난화를 증가시키기 때문이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 소 한 마리가 하루에 엄청난 양의 \u003cb class=\"key\">메탄가스\u003c/b>를 내뿜는다고 했죠. 이 문장은 그것이 왜 문제인지 \u003cb class=\"key\">이유\u003c/b>를 밝혀 주는 역할을 해요. 핵심은 메탄가스가 \u003cb class=\"key\">지구 \u003c/b>\u003cb class=\"key\">온난화\u003c/b>를 증가시킨다는 점이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지시대명사 This(앞 내용 지칭)\u003c/span> : [[지시대명사]] This + be동사 + 명사(주어 역할) : \"이것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이유를 나타내는 접속사 because(부사절)\u003c/span> : 주절 + [[because]] + 주어 + 동사(이유 부사절) : \"왜냐하면 메탄가스가 지구 온난화를 증가시키기 때문이다\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"This is, 이것은 ~이다. a problem, 문제가. because methane gas, 왜냐하면 메탄가스가. increases global warming, 지구 온난화를 증가시키기 때문이다. 이 문장 전체를 해석하면, 이것은 문제가 되는데, 메탄가스가 지구 온난화를 증가시키기 때문이다.","hl":"m"},{"n":23,"text":"앞 문장에서 소 한 마리가 하루에 엄청난 양의 메탄가스를 내뿜는다고 했죠. 그래서 이 문장은 그것이 왜 문제인지 이유를 밝혀 주는 역할을 해요. 핵심은 바로 메탄가스가 지구 온난화를 증가시킨다는 점이에요.","hl":"mn"},{"n":24,"text":"첫 번째, This는 앞 문장 내용 전체를 받는 지시대명사예요. 그래서 '이것은'이라고 해석하지만 실제로는 소가 메탄가스를 많이 내뿜는 상황을 가리키죠. 두 번째, because는 뒤에 주어와 동사를 갖춘 절을 데려와 이유를 설명하는 부사절을 만드는 접속사예요. 절 안의 동사 increases는 주어 methane gas가 단수라서 s가 붙은 현재형이라는 것도 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 당신을 놀라게 할지도 모른다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It \u003c/span>\u003cspan class=\"tgt\">may \u003c/span>\u003cspan class=\"tgt\">surprise \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">know\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 무리의 소가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">group \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">cows \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만큼 많은 메탄가스를 만들어 낸다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">produces \u003c/span>\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">much \u003c/span>\u003cspan class=\"tgt\">methane \u003c/span>\u003cspan class=\"tgt\">gas \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가정의 자동차 한 대만큼\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">family \u003c/span>\u003cspan class=\"tgt\">car\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">한 무리의 소가 가정의 자동차 한 대만큼 많은 메탄가스를 만들어 낸다는 것을 안다면 당신은 놀랄 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 한 무리의 소가 만들어 내는 \u003cb class=\"key\">메탄가스\u003c/b>의 양이 가정용 자동차 한 대가 내뿜는 양과 맞먹는다는 뜻이에요. It은 뒤에 있는 to know 이하를 받는 \u003cb class=\"key\">가주어\u003c/b>이고, 진짜 주어는 뒤로 간 to부정사구죠. as much as로 양이 똑같다는 \u003cb class=\"key\">동등비교\u003c/b>를 만들어 규모를 강조하고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가주어 It / 진주어 to부정사\u003c/span> : It(가주어) + 동사 + 목적어 + [[to부정사구]](진주어) : \"아는 것은 당신을 놀라게 할지도 모른다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 명사절(know의 목적어)\u003c/span> : know + [[that]] + 주어 + 동사 ~ : \"한 무리의 소가 ~라는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">주어와 동사의 수 일치(a group of)\u003c/span> : a group of + 복수명사 + [[단수동사]] : \"한 무리의 소가 만들어 낸다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">원급을 이용한 동등비교 as ~ as\u003c/span> : as much + 불가산명사 + [[as]] + 비교 대상 : \"가정의 자동차 한 대만큼 많은 메탄가스\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"It may surprise you, 그것은 당신을 놀라게 할지도 모른다. to know, 아는 것은. that a group of cows, 한 무리의 소가. produces as much methane gas, 만큼 많은 메탄가스를 만들어 낸다는 것을. as a family car, 가정의 자동차 한 대만큼. 이 문장 전체를 해석하면, 한 무리의 소가 가정의 자동차 한 대만큼 많은 메탄가스를 만들어 낸다는 것을 안다면 당신은 놀랄 것이다.","hl":"m"},{"n":26,"text":"한 무리의 소가 만들어 내는 메탄가스의 양이 가정용 자동차 한 대가 내뿜는 양과 맞먹는다는 뜻이에요. It은 뒤에 있는 to know 이하를 받는 가주어이고, 진짜 주어는 뒤로 간 to부정사구죠. as much as로 양이 똑같다는 동등비교를 만들어 규모를 강조하고 있어요.","hl":"mn"},{"n":27,"text":"첫 번째, It은 가주어예요. 진짜 주어인 to know 이하가 너무 길어서 It을 앞에 세우고 뒤로 보낸 거죠. 두 번째, know 뒤의 that절은 무엇을 아는지 그 내용을 채우는 목적어 역할을 해요. 세 번째, a group of cows처럼 묶음을 나타내는 주어는 단수로 보고 동사에 s를 붙인다는 점을 기억하세요. 네 번째, as much A as B는 동등비교 표현이고 methane gas는 셀 수 없는 명사라서 much를 쓴다는 것도 꼭 챙겨 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서 과학자들은\u003c/span>\u003cspan class=\"en\">So scientists\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">연구하고 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">working \u003c/span>\u003cspan class=\"tgt\">on\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">소들을 위한 새로운 먹이에 대해\u003c/span>\u003cspan class=\"en\">a new diet for cows\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 트림을 줄여 줄\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">reduce \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">burps\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그래서 과학자들은 소들의 트림을 줄여 줄 그들을 위한 새로운 먹이에 대해 연구하고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 소의 트림이 지구 온난화를 키우는 문제라고 했으니, 그 해결책을 찾는 흐름으로 이어지는 문장이에요. 뒤의 \u003cb class=\"key\">관계대명사\u003c/b> that은 소가 아니라 '새로운 먹이'를 꾸며 준다는 점이 핵심이에요. 즉 트림을 줄여 줄 주인공은 \u003cb class=\"key\">먹이\u003c/b>라는 뜻이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재진행형 be + -ing\u003c/span> : [[be동사]] + 동사-ing(현재진행) : \"연구하고 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : 선행사 + [[주격 관계대명사]] that + 동사 : \"그들의 트림을 줄여 줄\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"So scientists, 그래서 과학자들은. are working on, 연구하고 있다. a new diet for cows, 소들을 위한 새로운 먹이에 대해. that will reduce their burps, 그들의 트림을 줄여 줄. 이 문장 전체를 해석하면, 그래서 과학자들은 소들의 트림을 줄여 줄 그들을 위한 새로운 먹이에 대해 연구하고 있다.","hl":"m"},{"n":29,"text":"앞에서 소의 트림이 지구 온난화를 키우는 문제라고 했으니, 이 문장은 그 해결책을 찾는 흐름으로 이어져요. 뒤에 나오는 관계대명사 that은 소가 아니라 새로운 먹이를 꾸며 준다는 점이 핵심이에요. 즉 트림을 줄여 줄 주인공은 먹이라는 뜻이죠.","hl":"mn"},{"n":30,"text":"첫 번째, are working on은 지금 진행 중인 일을 나타내는 현재진행형이고 work on은 연구하다라는 덩어리 표현이에요. 두 번째, that은 앞에 있는 a new diet를 받아서 뒤에서 꾸며 주는 주격 관계대명사예요. 그래서 트림을 줄여 주는 대상이 소가 아니라 먹이라는 해석이 나오는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 발견했다\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">found \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">…라는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">클로버와 그 밖의 녹색 잎이\u003c/span>\u003cspan class=\"en\">clover and other green leaves\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">소가 …하게 한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">cause \u003c/span>\u003cspan class=\"tgt\">cows \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">트림을 덜 하도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">burp \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">less \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">목초가 그런 것보다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">grass \u003c/span>\u003cspan class=\"tgt\">does\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 클로버와 그 밖의 녹색 잎이 목초보다 소가 트림을 덜 하게 한다는 것을 발견했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 과학자들이 소의 트림을 줄이는 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">먹이\u003c/b>를 찾아낸 결과를 제시하는 문장이에요. 앞 문장에서 연구 중이라고 했으니, 여기서는 클로버와 녹색 잎이 목초보다 트림을 줄인다는 \u003cb class=\"key\">연구 \u003c/b>\u003cb class=\"key\">결과\u003c/b>를 알려 줘요. less than grass does는 목초가 트림하게 하는 것보다 덜하다는 \u003cb class=\"key\">비교\u003c/b> 표현이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that\u003c/span> : find + [that + 주어 + 동사 ~] : \"…라는 것을 발견했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">5형식 동사 cause + 목적어 + to부정사\u003c/span> : cause + [목적어] + [to부정사(목적격 보어)] : \"소가 트림을 덜 하게 한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">비교급 less than과 대동사 does\u003c/span> : [less + 형용사/부사] + than + [비교 대상] + does : \"목초가 트림하는 것보다 덜\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"They found, 그들은 발견했다. that, …라는 것을. clover and other green leaves, 클로버와 그 밖의 녹색 잎이. cause cows, 소가 …하게 한다. to burp less, 트림을 덜 하도록. than grass does, 목초가 그런 것보다.. 이 문장 전체를 해석하면, 그들은 클로버와 그 밖의 녹색 잎이 목초보다 소가 트림을 덜 하게 한다는 것을 발견했다.","hl":"m"},{"n":32,"text":"이 문장은 과학자들이 소의 트림을 줄이는 새로운 먹이를 찾아낸 결과를 보여 줘요. 앞에서 새로운 먹이를 연구 중이라고 했으니, 여기서는 클로버와 녹색 잎이 목초보다 트림을 줄인다는 연구 결과를 알려 주는 거예요. less than grass does는 목초가 트림하게 하는 것보다 덜하다는 비교 표현으로 이해하면 됩니다.","hl":"mn"},{"n":33,"text":"첫 번째로 found 뒤의 that은 명사절을 이끌어 목적어 역할을 한다는 점을 기억하세요. 그래서 found의 목적어 안에 완전한 절이 들어간 구조예요. 두 번째로 cause는 목적어 cows 뒤에 to부정사 to burp를 목적격 보어로 취해요. 이 to부정사는 목적어의 행동을 설명하는 역할을 합니다. 세 번째로 less는 더 적게라는 비교급 표현이고, than 뒤의 does는 앞의 burps를 대신하는 대동사예요. 그래서 목초가 트림하는 것보다 덜이라는 비교가 완성됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다행히\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Luckily,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">소들은\u003c/span>\u003cspan class=\"en\">cows\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">먹는 것을 좋아한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">love \u003c/span>\u003cspan class=\"tgt\">eating\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">those\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또한!\u003c/span>\u003cspan class=\"en\">too!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">다행히 소들도 그것들을 먹는 것을 좋아한다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 찾은 새 먹이가 실제로 소들이 좋아하는 먹이라는 점을 덧붙여, 해결책이 현실적임을 보여 주는 문장이에요. those는 앞에 나온 clover and other green leaves를 가리키고, too는 '소들도'라는 \u003cb class=\"key\">추가\u003c/b>의 의미를 담아 연구 결과에 대한 \u003cb class=\"key\">기대\u003c/b>를 전해 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">문장 부사(문장 전체 수식)\u003c/span> : Luckily, + [주어 + 동사 ~] : \"다행히\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사 목적어\u003c/span> : love + [동명사(eating) = 목적어] : \"먹는 것을 좋아한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">지시대명사 those\u003c/span> : [those = 앞에 나온 복수명사] : \"그것들\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"Luckily, 다행히. cows, 소들은. love eating, 먹는 것을 좋아한다. those, 그것들을. too!, 또한!. 이 문장 전체를 해석하면, 다행히 소들도 그것들을 먹는 것을 좋아한다!","hl":"m"},{"n":35,"text":"이 문장은 앞에서 찾은 새 먹이가 실제로 소들이 좋아하는 먹이라는 점을 덧붙여, 해결책이 현실적임을 보여 줘요. those는 앞에 나온 clover and other green leaves를 가리키고, too는 소들도라는 추가의 의미를 담아 연구 결과에 대한 기대를 전해 줘요.","hl":"mn"},{"n":36,"text":"첫 번째로 Luckily는 문장 전체의 상황에 대한 화자의 태도를 나타내는 문장 부사예요. 뒤에 쉼표를 두고 문장 전체를 수식합니다. 두 번째로 love 뒤에는 동명사 eating이 와서 목적어 역할을 해요. love는 enjoy처럼 동명사를 목적어로 자주 취합니다. 세 번째로 those는 앞에 나온 clover and other green leaves를 가리키는 지시대명사예요. 같은 복수명사를 반복하지 않으려고 쓴 표현입니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>트림을 하는 것은 인간뿐만이 아니라 소도 마찬가지이며, 소는 온종일 목초를 먹기 때문에 \u003cb class=\"key\">트림\u003c/b>을 자주 한다.\u003c/li>\u003cli>한 마리의 소가 하루에 약 150리터의 \u003cb class=\"key\">메탄가스\u003c/b>를 내보내고, 메탄가스는 \u003cb class=\"key\">지구 \u003c/b>\u003cb class=\"key\">온난화\u003c/b>를 증가시키기 때문에 이것은 문제가 된다.\u003c/li>\u003cli>한 무리의 소는 가정의 자동차 한 대만큼 많은 메탄가스를 만들어 내어, 소의 트림이 가진 \u003cb class=\"key\">심각성\u003c/b>을 보여 준다.\u003c/li>\u003cli>과학자들은 \u003cb class=\"key\">클로버\u003c/b>와 녹색 잎처럼 소의 트림을 줄여 주는 새로운 먹이를 연구하고 있고, 소들도 그것을 좋아한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Scientists are looking for a new diet for cows, such as clover and green leaves, to reduce the methane gas they burp out and slow down global warming.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">소는 온종일 목초를 먹으며 하루 약 150리터의 \u003cb class=\"key\">메탄가스\u003c/b>를 트림으로 내보내 지구 온난화를 심화시킨다. 그래서 과학자들은 \u003cb class=\"key\">클로버\u003c/b>와 녹색 잎처럼 소의 트림을 줄여 줄 새로운 먹이를 연구하고 있다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":37,"text":"오늘 글의 핵심을 다시 정리해 볼게요. 소는 먹이를 소화하는 과정에서 메탄가스를 트림으로 내보내 지구 온난화를 심화시켜요. 그래서 과학자들은 클로버와 녹색 잎처럼 트림을 줄여 주는 새로운 먹이를 연구하고 있고, 소들도 그 먹이를 좋아한다는 반가운 소식으로 글이 끝나죠. 문제와 해결의 흐름과 신호어까지 꼭 복습해 보시고요, 오늘도 수고 많았습니다!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
