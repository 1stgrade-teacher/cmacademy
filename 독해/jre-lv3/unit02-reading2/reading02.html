요하다.</li><li>작업의 중요도에 따른 순서 정하기</li><li>시간 관리(time management)의 효율성 증대</li><li>핵심 키워드: 우선순위(priority)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03휴식 시간 확보</div><ul><li>자신을 위한 시간을 가져 스트레스를 줄이고 생산성을 높여야 한다.</li><li>휴식, 운동, 친구와의 만남 등 개인적 활동</li><li>스트레스 수준 감소 및 학습 생산성(productivity) 향상</li><li>핵심 키워드: 휴식(relaxation)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04죄책감 극복과 결론</div><ul><li>휴식에 대한 죄책감을 버리고 번아웃 방지를 위해 반드시 시간을 확보해야 한다.</li><li>휴식 중 느낄 수 있는 죄책감(guilt)의 부정적 인식</li><li>번아웃 방지를 위한 필수적 과정</li><li>핵심 키워드: 예방(prevention)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">burnout syndrome</td><td class=\"m\">번아웃 증후군, 소진 증후군</td></tr><tr><td class=\"w\">prevent</td><td class=\"m\">예방하다, 방지하다, 막다</td></tr><tr><td class=\"w\">in the order of</td><td class=\"m\">~의 순서대로</td></tr><tr><td class=\"w\">importance</td><td class=\"m\">중요성, 중요함</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">manage</td><td class=\"m\">관리하다, 다루다, 해내다</td></tr><tr><td class=\"w\">productive</td><td class=\"m\">생산적인, 효과적인</td></tr><tr><td class=\"w\">guilty</td><td class=\"m\">죄책감이 드는, 유죄의</td></tr><tr><td class=\"w\">burn out</td><td class=\"m\">소진되다, 에너지가 고갈되다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">공부에 대한 스트레스 때문에,</span><span class=\"en\"><b>Because of the stress of <span class=\"grammar-hl\">studying</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어린 학생들조차도</span><span class=\"en\"><b>even young students</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">경험할 수 있다</span><span class=\"en\"><b>can experience</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">번아웃 증후군을</span><span class=\"en\"><b>burnout syndrome.</b></span></div></div><div class=\"lec-sent-ko\">학업 스트레스 때문에, 어린 학생들조차 번아웃 증후군을 경험할 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 도입부로서, 학업이라는 환경이 학생들의 정신 건강에 부정적인 영향을 줄 수 있음을 언급하며 번아웃 예방의 필요성을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">studying (동명사): 전치사 of의 목적어 역할을 하며 &#39;공부하기&#39;라는 행위를 나타내는 명사적 개념이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">burnout syndrome</td><td class=\"m\">번아웃 증후군, 소진 증후군</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만,</span><span class=\"en\"><b>However,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">방법들이 있다</span><span class=\"en\"><b>there are ways</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것을 예방할 수 있는</span><span class=\"en\"><b><span class=\"grammar-hl\">to prevent</span> it.</b></span></div></div><div class=\"lec-sent-ko\">하지만, 그것을 예방할 수 있는 방법들이 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 제기한 번아웃 문제에 대해 해결책을 제시할 것임을 알리며 글의 논리적 전환을 꾀합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to prevent (to부정사): 명사 ways를 뒤에서 수식하는 형용사적 용법으로, &#39;~하는 방법&#39;으로 해석한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">prevent</td><td class=\"m\">예방하다, 방지하다, 막다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">첫째로,</span><span class=\"en\"><b>First,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">중요하다</span><span class=\"en\"><b><span class=\"grammar-hl\">it’s important</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">일들을 하는 것이</span><span class=\"en\"><b><span class=\"grammar-hl\">to do</span> tasks</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">중요도의 순서로</span><span class=\"en\"><b>in the order of their importance.</b></span></div></div><div class=\"lec-sent-ko\">첫째로, 중요도의 순서로 일들을 하는 것이 중요하다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 구체적인 해결책을 나열하는 첫 번째 단계로, 효율적인 시간 관리가 스트레스 완화의 핵심임을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">it’s important to do (가주어): 진주어: it은 형식상의 주어(가주어)이며, 진주어인 to부정사 구문(to do tasks...)이 뒤로 배치된 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">in the order of</td><td class=\"m\">~의 순서대로</td></tr><tr><td class=\"w\">importance</td><td class=\"m\">중요성, 중요함</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것은</span><span class=\"en\"><b>This</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신을 도울 것이다</span><span class=\"en\"><b>will <span class=\"grammar-hl\">help you</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신의 시간을 잘 관리하도록</span><span class=\"en\"><b><span class=\"grammar-hl\">manage</span> your time well.</b></span></div></div><div class=\"lec-sent-ko\">이것은 당신이 당신의 시간을 잘 관리하도록 도울 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 제시한 우선순위 기반의 업무 처리가 어떤 결과를 가져오는지 그 인과관계를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">help you manage 5형식(SVOC) 구조: help(동사) + you(목적어) + manage(목적보어) 구조이며, help는 목적보어로 동사원형이나 to부정사를 취하는 특수 동사이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">manage</td><td class=\"m\">관리하다, 다루다, 해내다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">또한 중요하다</span><span class=\"en\"><b><span class=\"grammar-hl\">It’s also important</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">시간을 좀 갖는 것이</span><span class=\"en\"><b><span class=\"grammar-hl\">to take</span> some time</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신 자신을 위한</span><span class=\"en\"><b>for yourself.</b></span></div></div><div class=\"lec-sent-ko\">당신 자신을 위한 시간을 갖는 것 또한 중요하다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 첫 번째 해결책인 업무 효율화에 이어, 정신적 회복을 위한 두 번째 해결책을 추가하며 글의 내용을 확장합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It’s also important to take (가주어): 진주어: It은 가주어이고, to부정사(to take some time...)가 문장의 실제 주어 역할을 하는 진주어이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 시간 동안,</span><span class=\"en\"><b>During this time,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신은 휴식을 취하거나 운동을 할 수 있고,</span><span class=\"en\"><b>you can <span class=\"grammar-hl\">relax, exercise,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">심지어 친구를 만날 수도 있다.</span><span class=\"en\"><b><span class=\"grammar-hl\">or even meet</span> friends.</b></span></div></div><div class=\"lec-sent-ko\">이 시간 동안, 당신은 휴식을 취하거나 운동을 하거나, 심지어 친구를 만날 수도 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 &#39;자신을 위한 시간&#39;을 구체적으로 어떻게 활용할 수 있는지 다양한 사례를 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">relax, exercise, or even meet (관용표현): 나열된 동작들(relax, exercise, meet)이 or라는 접속사로 병렬 연결되어 &#39;휴식, 운동, 친구 만나기&#39;라는 활동의 선택지를 제시한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것은</span><span class=\"en\"><b>This</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신의 스트레스 수준을 줄여줄 것이고</span><span class=\"en\"><b>will reduce your stress levels</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신을 도울 것이다</span><span class=\"en\"><b>and <span class=\"grammar-hl\">help you</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 생산적이 되도록</span><span class=\"en\"><b><span class=\"grammar-hl\">to be</span> more productive</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신이 다시 공부를 시작할 때</span><span class=\"en\"><b>when you start studying again.</b></span></div></div><div class=\"lec-sent-ko\">이것은 당신의 스트레스 정도를 줄이고 당신이 다시 공부를 시작할 때 더 생산적이 되도록 도울 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 휴식이 단순히 노는 것이 아니라, 학업 효율성을 높이기 위한 전략적인 재충전 과정임을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">help you to be 5형식(SVOC) 구조: help(동사) + you(목적어) + to be more productive(목적보어)이며, 5형식 구조에서 목적어가 어떠한 상태(보어)가 되도록 돕는다는 의미를 가진다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">productive</td><td class=\"m\">생산적인, 효과적인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">처음에,</span><span class=\"en\"><b>At first,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신은 죄책감을 느낄지도 모른다</span><span class=\"en\"><b>you might feel guilty</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">공부하지 않는 것에 대해</span><span class=\"en\"><b>about <span class=\"grammar-hl\">not studying</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 시간 동안</span><span class=\"en\"><b>during this time.</b></span></div></div><div class=\"lec-sent-ko\">처음에, 당신은 이 시간 동안 공부를 하지 않는 것에 대해 죄책감을 느낄지도 모른다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 휴식을 취할 때 많은 학생이 겪는 심리적인 갈등을 언급하며, 휴식의 정당성을 부여하기 위한 준비를 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">not studying (동명사): 전치사 about의 목적어 역할을 하며, 부정어 not이 동명사 앞에 위치하여 &#39;공부하지 않는 것&#39;이라는 명사적 의미를 형성한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">guilty</td><td class=\"m\">죄책감이 드는, 유죄의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만,</span><span class=\"en\"><b>However,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 자유 시간이 없다면,</span><span class=\"en\"><b>without this free time,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신은 쉽게 번아웃될 수 있다.</span><span class=\"en\"><b>you could easily <span class=\"grammar-hl\">burn out</span>.</b></span></div></div><div class=\"lec-sent-ko\">하지만 이러한 자유 시간이 없으면, 당신은 쉽게 에너지를 다 써버릴 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 죄책감을 반박하며, 휴식이 번아웃을 피하기 위해 반드시 필요한 선택임을 다시 한번 역설합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">burn out (관용표현): &#39;번아웃되다, 진이 빠지다&#39;라는 의미의 자동사구 이디엄이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">burn out</td><td class=\"m\">소진되다, 에너지가 고갈되다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>학업 스트레스로 어린 학생들도 번아웃을 겪을 수 있다.</li><li>번아웃을 예방하려면 과제의 우선순위를 정해 시간을 효율적으로 관리해야 한다.</li><li>휴식을 통해 스스로를 재충전하는 과정이 반드시 병행되어야 한다.</li><li>휴식에 대한 죄책감을 버리고 번아웃을 막는 전략적 방편으로 활용해야 한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Students should prioritize tasks to manage their time efficiently, and they must incorporate regular rest periods to reduce stress and prevent burnout.</div>\n              <div class=\"lec-final-sum-ko\">학생들은 시간을 효율적으로 관리하기 위해 과업의 우선순위를 정해야 하며, 스트레스를 줄이고 번아웃을 방지하기 위해 규칙적인 휴식 시간을 가져야 한다.</div></div></div>"],"segs":[[{"audio":"./reading02_audio/1.mp3","hl":null}],[{"audio":"./reading02_audio/2.mp3","hl":null}],[{"audio":"./reading02_audio/3.mp3","hl":null},{"audio":"./reading02_audio/4.mp3","hl":"stage-0"},{"audio":"./reading02_audio/5.mp3","hl":"stage-1"},{"audio":"./reading02_audio/6.mp3","hl":"stage-2"},{"audio":"./reading02_audio/7.mp3","hl":"stage-3"}],[{"audio":"./reading02_audio/8.mp3","hl":null}],[{"audio":"./reading02_audio/9.mp3","hl":"main"},{"audio":"./reading02_audio/10.mp3","hl":"meaning"},{"audio":"./reading02_audio/11.mp3","hl":"grammar"}],[{"audio":"./reading02_audio/12.mp3","hl":"main"},{"audio":"./reading02_audio/13.mp3","hl":"meaning"},{"audio":"./reading02_audio/14.mp3","hl":"grammar"}],[{"audio":"./reading02_audio/15.mp3","hl":"main"},{"audio":"./reading02_audio/16.mp3","hl":"meaning"},{"audio":"./reading02_audio/17.mp3","hl":"grammar"}],[{"audio":"./reading02_audio/18.mp3","hl":"main"},{"audio":"./reading02_audio/19.mp3","hl"
