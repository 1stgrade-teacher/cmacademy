<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>쥬니어리딩엑스퍼트3 Unit2_Reading02 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"쥬니어리딩엑스퍼트3 Unit2_Reading02","audioDir":"reading02_audio","preview":false,"count":39,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.400em\">Unit2_Reading02\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">쥬니어리딩엑스퍼트3\u003c/div>\u003ch1>Prevent Burnout: Prioritize and Recharge\u003c/h1>\u003ch2>번아웃 예방: 우선순위와 재충전\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>학업 스트레스로 인한 \u003cb class=\"key\">번아웃 \u003c/b>\u003cb class=\"key\">증후군\u003c/b>을 예방하려면 \u003cb class=\"key\">중요도\u003c/b> 순서로 일을 처리하고 자신을 위한 \u003cb class=\"key\">자유 \u003c/b>\u003cb class=\"key\">시간\u003c/b>을 가져 스트레스를 줄여야 한다. 이 시간에 \u003cb class=\"key\">죄책감\u003c/b>을 느낄 수 있지만, 그것이 없으면 오히려 쉽게 \u003cb class=\"key\">번아웃\u003c/b>될 수 있다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>To prevent burnout, students should prioritize tasks and make time for themselves to reduce stress and stay productive.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 쥬니어리딩엑스퍼트 삼 단원의 Reading 두 번째 지문을 함께 읽어 볼게요. 이 글은 학업 스트레스로 생길 수 있는 burnout syndrome을 어떻게 예방할지 알려 주는 문제 해결 글입니다. 핵심은 중요한 일부터 처리하고 자신을 위한 시간을 가져 스트레스를 줄이라는 것이죠. 지금부터 글의 흐름을 차근차근 짚어 볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">\u003cb class=\"key\">번아웃 \u003c/b>\u003cb class=\"key\">증후군\u003c/b>(burnout syndrome)은 만성적인 \u003cb class=\"key\">스트레스\u003c/b>가 쌓여 의욕이 떨어지고 쉽게 지치는 상태를 말한다. 공부를 오래 지속하려면 스트레스를 줄이고 집중력을 회복하는 시간이 필요하다. 이때 중요한 것이 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">관리\u003c/b>와 \u003cb class=\"key\">자유 \u003c/b>\u003cb class=\"key\">시간\u003c/b>이다. 스마트폰 배터리도 계속 쓰기만 하면 방전되듯, 우리의 집중력도 쉬어 주지 않으면 금방 바닥난다. 그래서 휴식은 공부를 게을리하는 시간이 아니라 더 \u003cb class=\"key\">생산적\u003c/b>으로 공부하기 위한 필수 장치라는 점을 기억해야 한다.\u003c/div>","segs":[{"n":2,"text":"먼저 burnout syndrome이 무엇인지 짚어 볼게요. 이것은 만성적인 스트레스가 쌓여서 의욕이 떨어지고 쉽게 지치는 상태를 말합니다. 공부를 오래 지속하려면 스트레스를 관리하는 능력이 정말 중요하죠. 스마트폰 배터리도 계속 쓰기만 하면 방전되듯이, 우리의 집중력도 쉬어 주지 않으면 금방 바닥이 납니다. 그래서 자신을 위한 자유 시간은 사치가 아니라 효율을 지키는 필수 장치예요. 이 배경을 알고 읽으면 글의 해결책이 훨씬 자연스럽게 느껴질 거예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>문제 제기\u003csmall>도입·문제 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>학업 스트레스 때문에 어린 학생도 \u003cb class=\"key\">번아웃 \u003c/b>\u003cb class=\"key\">증후군\u003c/b>을 겪을 수 있다고 문제를 제기한다. 하지만 예방법이 있다고 말하며 글의 방향을 \u003cb class=\"key\">해결책\u003c/b>으로 전환한다. 즉 첫 문장은 원인과 문제, 두 번째 문장은 해결 가능성을 예고하는 \u003cb class=\"key\">주제문\u003c/b> 역할을 한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>해결책 하나\u003csmall>해결·근거 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>첫 번째 방법은 일을 \u003cb class=\"key\">중요도\u003c/b> 순서로 처리하는 것이다. 이는 시간을 잘 \u003cb class=\"key\">관리\u003c/b>하도록 도와준다. 중요한 일부터 하면 해야 할 일의 우선순위가 분명해진다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>해결책 둘\u003csmall>해결·예시 · 문장 5–7\u003c/small>\u003c/h4>\u003cp>두 번째 방법은 자신을 위한 \u003cb class=\"key\">자유 \u003c/b>\u003cb class=\"key\">시간\u003c/b>을 갖는 것이다. 그 시간에 휴식, 운동, 친구 만남을 할 수 있다. 이는 \u003cb class=\"key\">스트레스\u003c/b>를 줄이고 다시 공부할 때 더 \u003cb class=\"key\">생산적\u003c/b>이 되게 한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>우려와 결론\u003csmall>반론·결론 · 문장 8–9\u003c/small>\u003c/h4>\u003cp>처음에는 공부하지 않는 시간에 \u003cb class=\"key\">죄책감\u003c/b>을 느낄 수 있다. 하지만 이런 자유 시간이 없으면 쉽게 \u003cb class=\"key\">번아웃\u003c/b>될 수 있다고 경고한다. 결국 휴식은 게으름이 아니라 지속적인 공부를 위한 \u003cb class=\"key\">필수 \u003c/b>\u003cb class=\"key\">조건\u003c/b>이다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 문제 제기, 첫 번째 해결책, 두 번째 해결책, 그리고 마지막 경고 순서로 살펴볼게요.","hl":null},{"n":4,"text":"먼저 첫 번째 문장에서 학업 스트레스 때문에 어린 학생도 burnout syndrome을 겪을 수 있다는 문제를 꺼내요. 그런데 두 번째 문장에서 however를 쓰면서 예방할 수 있는 방법이 있다고 말하며 분위기를 바꾸죠. 그래서 이 부분은 문제를 제시하고 해결책이 있음을 알리는 도입이에요. 글의 주제문이 두 번째 문장에 있다는 점도 기억해 두세요.","hl":"f0"},{"n":5,"text":"세 번째 문장에서는 first를 쓰면서 첫 번째 해결책을 제시해요. 바로 일을 중요도 순서로 처리하라는 것이죠. 그러면 네 번째 문장처럼 시간을 잘 관리하는 데 도움이 됩니다. 중요한 일부터 하면 우선순위가 분명해져서 공부가 훨씬 수월해져요.","hl":"f1"},{"n":6,"text":"다섯 번째 문장에서는 also로 두 번째 해결책을 더해요. 자신을 위한 자유 시간을 가지라는 거죠. 그 시간에는 휴식을 취하거나 운동을 하거나 친구를 만날 수 있어요. 일곱 번째 문장에서 이 시간이 스트레스를 줄이고 다시 공부할 때 더 생산적이 되게 한다고 설명합니다.","hl":"f2"},{"n":7,"text":"여덟 번째 문장에서는 처음에 공부하지 않는 시간에 죄책감을 느낄 수 있다고 인정해요. 하지만 아홉 번째 문장에서 however를 써서 자유 시간이 없으면 쉽게 burn out될 수 있다고 경고하죠. 결국 휴식은 게으름이 아니라 지속적인 공부를 위한 필수 조건이라는 결론이에요. 이 마지막 반전이 글의 핵심 메시지를 강하게 만들어 줍니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 2번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 학업 스트레스와 \u003cb class=\"key\">번아웃 \u003c/b>\u003cb class=\"key\">증후군\u003c/b>이라는 문제를 제시하고, 두 번째 문장에서 예방법이 있다고 \u003cb class=\"key\">주제\u003c/b>를 먼저 밝힌다. 이어 First와 also로 두 가지 \u003cb class=\"key\">해결책\u003c/b>을 제시하므로 문제-해결 구조이다. 해결책을 글 앞부분에서 먼저 알려 주고 세부 방법을 뒤에 풀어 놓아 \u003cb class=\"key\">두괄식\u003c/b>으로 볼 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Because of (1)\u003c/b>\u003cspan>문제의 원인 제시\u003c/span>\u003cb>However (2)\u003c/b>\u003cspan>문제에서 해결 방향으로 전환\u003c/span>\u003cb>First (3)\u003c/b>\u003cspan>첫 번째 해결책 제시\u003c/span>\u003cb>also (5)\u003c/b>\u003cspan>두 번째 해결책 추가\u003c/span>\u003cb>At first (8)\u003c/b>\u003cspan>예상되는 우려 제시\u003c/span>\u003cb>However (9)\u003c/b>\u003cspan>우려를 반박하고 결론 강조\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">burnout syndrome\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">stress\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">prevent it\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">do tasks in the order of their importance\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">manage your time well\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">take some time for yourself\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">relax, exercise, or even meet friends\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">reduce your stress levels\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">be more productive\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">feel guilty\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">burn out\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 문제 해결 구조예요. 첫 번째 문장에서 burnout syndrome이라는 문제를 던지고 두 번째 문장에서 예방법이 있다는 해결의 실마리를 먼저 보여 주죠. 이어서 first와 also로 두 가지 해결책을 차례로 제시합니다. 해결책을 앞에서 먼저 알려 주고 세부 내용을 뒤에 붙였으므로 두괄식이라고 볼 수 있어요.","hl":"ty"},{"n":9,"text":"신호어를 보면 however가 두 번 나와요. 두 번째 문장의 however는 문제에서 해결 방향으로 전환하고, 아홉 번째 문장의 however는 죄책감이라는 우려를 반박하며 결론을 강조하죠. first와 also는 두 해결책을 나란히 묶어 주는 표지이고, at first는 처음에 느낄 수 있는 죄책감을 자연스럽게 꺼내는 역할을 합니다. 이런 신호어를 따라가면 글의 뼈대가 한눈에 보여요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>Because of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~ 때문에\u003c/span>\u003c/div>\u003cdiv>\u003cb>stress\u003c/b>\u003cem>명사\u003c/em>\u003cspan>스트레스, 압박\u003c/span>\u003c/div>\u003cdiv>\u003cb>experience\u003c/b>\u003cem>동사\u003c/em>\u003cspan>경험하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>burnout syndrome\u003c/b>\u003cem>명사\u003c/em>\u003cspan>번아웃 증후군\u003c/span>\u003c/div>\u003cdiv>\u003cb>However\u003c/b>\u003cem>부사\u003c/em>\u003cspan>그러나\u003c/span>\u003c/div>\u003cdiv>\u003cb>way\u003c/b>\u003cem>명사\u003c/em>\u003cspan>방법\u003c/span>\u003c/div>\u003cdiv>\u003cb>prevent\u003c/b>\u003cem>동사\u003c/em>\u003cspan>예방하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>First\u003c/b>\u003cem>부사\u003c/em>\u003cspan>첫째로\u003c/span>\u003c/div>\u003cdiv>\u003cb>important\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>중요한\u003c/span>\u003c/div>\u003cdiv>\u003cb>task\u003c/b>\u003cem>명사\u003c/em>\u003cspan>일, 과업\u003c/span>\u003c/div>\u003cdiv>\u003cb>in the order of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~의 순서로\u003c/span>\u003c/div>\u003cdiv>\u003cb>importance\u003c/b>\u003cem>명사\u003c/em>\u003cspan>중요성\u003c/span>\u003c/div>\u003cdiv>\u003cb>manage\u003c/b>\u003cem>동사\u003c/em>\u003cspan>관리하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>also\u003c/b>\u003cem>부사\u003c/em>\u003cspan>또한\u003c/span>\u003c/div>\u003cdiv>\u003cb>take some time for yourself\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>자신을 위한 시간을 갖다\u003c/span>\u003c/div>\u003cdiv>\u003cb>during\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~ 동안\u003c/span>\u003c/div>\u003cdiv>\u003cb>relax\u003c/b>\u003cem>동사\u003c/em>\u003cspan>휴식하다, 긴장을 풀다\u003c/span>\u003c/div>\u003cdiv>\u003cb>exercise\u003c/b>\u003cem>동사\u003c/em>\u003cspan>운동하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>meet\u003c/b>\u003cem>동사\u003c/em>\u003cspan>만나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>reduce\u003c/b>\u003cem>동사\u003c/em>\u003cspan>줄이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>stress level\u003c/b>\u003cem>명사\u003c/em>\u003cspan>스트레스 수준\u003c/span>\u003c/div>\u003cdiv>\u003cb>productive\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>생산적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>at first\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>처음에\u003c/span>\u003c/div>\u003cdiv>\u003cb>feel guilty\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>죄책감을 느끼다\u003c/span>\u003c/div>\u003cdiv>\u003cb>without\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~ 없이\u003c/span>\u003c/div>\u003cdiv>\u003cb>free time\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자유 시간\u003c/span>\u003c/div>\u003cdiv>\u003cb>easily\u003c/b>\u003cem>부사\u003c/em>\u003cspan>쉽게\u003c/span>\u003c/div>\u003cdiv>\u003cb>burn out\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>지치다, 에너지를 다 써버리다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어도 몇 개 짚어 볼게요. prevent는 예방하다, manage는 관리하다, productive는 생산적인이라는 뜻이에요. reduce는 줄이다, guilty는 죄책감이 드는이라는 뜻으로 기억해 두면 좋습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">prevent\u003c/b>\u003cspan class=\"m\">예방하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">stop\u003c/span>\u003cspan class=\"s\">avoid\u003c/span>\u003cspan class=\"s\">hinder\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">cause\u003c/span>\u003cspan class=\"a\">allow\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">important\u003c/b>\u003cspan class=\"m\">중요한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">significant\u003c/span>\u003cspan class=\"s\">essential\u003c/span>\u003cspan class=\"s\">crucial\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unimportant\u003c/span>\u003cspan class=\"a\">trivial\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">manage\u003c/b>\u003cspan class=\"m\">관리하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">handle\u003c/span>\u003cspan class=\"s\">control\u003c/span>\u003cspan class=\"s\">organize\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">neglect\u003c/span>\u003cspan class=\"a\">mismanage\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">reduce\u003c/b>\u003cspan class=\"m\">줄이다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">decrease\u003c/span>\u003cspan class=\"s\">lessen\u003c/span>\u003cspan class=\"s\">lower\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">increase\u003c/span>\u003cspan class=\"a\">raise\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">productive\u003c/b>\u003cspan class=\"m\">생산적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">efficient\u003c/span>\u003cspan class=\"s\">fruitful\u003c/span>\u003cspan class=\"s\">effective\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unproductive\u003c/span>\u003cspan class=\"a\">useless\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">guilty\u003c/b>\u003cspan class=\"m\">죄책감이 드는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">ashamed\u003c/span>\u003cspan class=\"s\">regretful\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">innocent\u003c/span>\u003cspan class=\"a\">shameless\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">burn out\u003c/b>\u003cspan class=\"m\">지치다, 소진되다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">exhaust\u003c/span>\u003cspan class=\"s\">wear out\u003c/span>\u003cspan class=\"s\">tire out\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">recover\u003c/span>\u003cspan class=\"a\">refresh\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"시험에 잘 나오는 어휘는 동의어와 반의어로 묶어 볼게요. prevent는 stop이나 avoid로 바꿔 쓸 수 있고 반대말은 cause입니다. important는 significant나 essential과 가깝고 반대말은 unimportant예요. reduce는 decrease나 lessen으로 바꿀 수 있고 반대말은 increase입니다. productive는 efficient나 fruitful와 비슷하고 반대말은 unproductive이고요. 마지막으로 burn out은 exhaust나 wear out과 가깝고 반대 방향은 recover로 정리해 둡시다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">학업 스트레스 때문에,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Because \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">stress \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">studying\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어린 학생들조차\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">even \u003c/span>\u003cspan class=\"tgt\">young \u003c/span>\u003cspan class=\"tgt\">students\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">경험할 수 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">experience\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">번아웃 증후군을\u003c/span>\u003cspan class=\"en\">burnout syndrome.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">학업 스트레스 때문에, 어린 학생들조차 번아웃 증후군을 경험할 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 원인인 \u003cb class=\"key\">학업 \u003c/b>\u003cb class=\"key\">스트레스\u003c/b>를 Because of로 먼저 제시하고, 그 결과로 \u003cb class=\"key\">번아웃 \u003c/b>\u003cb class=\"key\">증후군\u003c/b>이 올 수 있다고 말하는 문장이에요. even을 써서 '어린 학생들조차'라고 \u003cb class=\"key\">강조\u003c/b>한 것이 핵심으로, 나이와 상관없이 누구나 겪을 수 있다는 뜻이죠. 글 전체에서 문제 상황을 여는 첫 문장 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구(이유) because of + 명사구\u003c/span> : [[Because of]] + [명사구] → '~ 때문에' : \"학업 스트레스 때문에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">강조 부사 even\u003c/span> : [[even]] + [명사] → '~조차, ~까지도' : \"어린 학생들조차\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">조동사 can + 동사원형\u003c/span> : [[조동사 can]] + [동사원형 experience] : \"경험할 수 있다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Because of the stress of studying, 학업 스트레스 때문에. even young students, 어린 학생들조차. can experience, 경험할 수 있다. burnout syndrome, 번아웃 증후군을. 이 문장 전체를 해석하면, 학업 스트레스 때문에, 어린 학생들조차 번아웃 증후군을 경험할 수 있다.","hl":"m"},{"n":13,"text":"이 문장은 학업 스트레스라는 원인을 먼저 제시하고, 그 결과로 번아웃 증후군이 올 수 있다고 말하고 있어요. even을 쓴 이유가 중요해요. 어린 학생들조차라는 강조를 넣어서 나이와 상관없이 누구나 겪을 수 있다는 걸 보여 주는 거죠.","hl":"mn"},{"n":14,"text":"첫 번째로 because of는 뒤에 명사구를 데리고 와서 이유를 만들어요. 그래서 the stress of studying이라는 명사구가 오는 거죠. 두 번째로 even은 강조하고 싶은 말 바로 앞에 붙어요. 여기서는 young students 앞에 붙어서 어린 학생들조차라는 강조를 만든 거예요. 세 번째로 조동사 can 뒤에는 반드시 동사원형이 와요. 그래서 experience라고 쓴 겁니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만,\u003c/span>\u003cspan class=\"en\">However,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">방법들이 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">ways\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 예방할\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">prevent \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만, 그것을 예방할 수 있는 방법들이 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 부정적 상황을 However로 돌려세우며 \u003cb class=\"key\">해결책\u003c/b>이 있음을 알리는 문장이에요. ways to prevent it이 '그것을 예방할 방법들'로 이어지면서 글의 \u003cb class=\"key\">전환점\u003c/b>을 만들어 주죠. 뒤에 이어질 구체적인 방법들의 예고 역할도 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">There is/are 구문(유도부사)\u003c/span> : [[There]] + [be동사] + [주어] → '~이 있다' : \"방법들이 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : [[명사 ways]] + [to + 동사원형] → '~할 방법' : \"그것을 예방할\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"However, 하지만. there are ways, 방법들이 있다. to prevent it, 그것을 예방할. 이 문장 전체를 해석하면, 하지만, 그것을 예방할 수 있는 방법들이 있다.","hl":"m"},{"n":16,"text":"앞에서 번아웃은 누구나 겪을 수 있다고 했죠. 그런데 이 문장에서 However로 방향을 틀어서 해결책이 있다고 말해요. ways to prevent it이 예방할 방법들이라는 뜻으로 글의 전환점을 만들어 주는 거예요.","hl":"mn"},{"n":17,"text":"첫 번째로 there are ways는 유도부사 구문이에요. 무엇이 있다를 소개할 때 주어를 be동사 뒤로 보내는 형태죠. 두 번째로 to prevent it에서 to부정사가 앞의 ways를 꾸며 줘요. 그래서 예방할 방법들이라고 해석하는 겁니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">첫째로,\u003c/span>\u003cspan class=\"en\">First,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">중요하다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">it's \u003c/span>\u003cspan class=\"tgt\">important \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일들을 하는 것이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">tasks\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 중요도의 순서로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">order \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">importance\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">첫째로, 중요도의 순서로 일들을 하는 것이 중요하다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 해결책의 첫 번째로 \u003cb class=\"key\">우선순위\u003c/b>를 제시하는 문장이에요. 가주어 it으로 '무엇이 중요한지'를 미뤄 두고 뒤에서 to do tasks로 \u003cb class=\"key\">진주어\u003c/b>를 밝히는 구조죠. 중요한 일부터 처리하라는 실천적 조언이 담겨 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가주어 it / 진주어 to부정사\u003c/span> : [[가주어 it]] + [be동사 + 형용사] + [[진주어 to부정사]] : \"일들을 하는 것이 중요하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구(순서·기준)\u003c/span> : [[in the order of]] + [명사] → '~의 순서로' : \"그 중요도의 순서로\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"First, 첫째로. it's important, 중요하다. to do tasks, 일들을 하는 것이. in the order of their importance, 그 중요도의 순서로. 이 문장 전체를 해석하면, 첫째로, 중요도의 순서로 일들을 하는 것이 중요하다.","hl":"m"},{"n":19,"text":"첫 번째 해결책은 우선순위예요. 무엇이 중요한지를 it으로 미뤄 두고 뒤에서 to do tasks로 진주어를 밝히고 있어요. 그래서 일들을 중요도 순서로 하라는 조언이 되는 거죠.","hl":"mn"},{"n":20,"text":"첫 번째로 it's important to do tasks는 가주어 it 구문이에요. 진짜 주어는 뒤에 있는 to do tasks인데 너무 길어서 가주어 it을 앞세운 거죠. 두 번째로 in the order of their importance는 전치사구로 순서를 나타내요. order가 순서라는 뜻이라서 그 중요성의 순서대로라는 의미가 되는 겁니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은\u003c/span>\u003cspan class=\"en\">This\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신을 도울 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">help \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신의 시간을 관리하도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">manage\u003c/span> your time\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">잘\u003c/span>\u003cspan class=\"en\">well.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것은 당신이 당신의 시간을 잘 관리하도록 도울 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 말한 '중요한 일부터 하기'가 결국 시간 관리를 잘하게 만든다는 결과를 알려 주는 문장이에요. \u003cb class=\"key\">help\u003c/b> 뒤에 동사원형이 와서 '~하도록 돕다'라는 \u003cb class=\"key\">목적격보어\u003c/b> 구조를 이룬다는 점이 핵심입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 will (미래·예측)\u003c/span> : 주어 + [will] + [동사원형] : \"~할 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">help + 목적어 + 원형부정사(목적격보어)\u003c/span> : help + [목적어] + [동사원형(목적격보어)] : \"당신이 …하도록 돕다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"This, 이것은. will help you, 당신을 도울 것이다. manage your time, 당신의 시간을 관리하도록. well, 잘. 이 문장 전체를 해석하면, 이것은 당신이 당신의 시간을 잘 관리하도록 도울 것이다.","hl":"m"},{"n":22,"text":"이 문장은 앞에서 말한 중요한 일부터 하기라는 행동이 시간 관리에 도움이 된다는 결과를 정리해 주는 역할이에요. help you manage를 하나로 묶어서 목적격보어 구조로 이해하면 훨씬 쉬워요.","hl":"mn"},{"n":23,"text":"첫 번째, will은 조동사라서 뒤에 반드시 동사원형이 와요. 두 번째, help는 목적어 다음에 동사원형을 데려오는 동사예요. 그래서 목적어 you 뒤에 to 없이 manage가 그대로 오고, 이 manage가 목적격보어로 쓰인 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 또한 중요하다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It's \u003c/span>\u003cspan class=\"tgt\">also \u003c/span>\u003cspan class=\"tgt\">important \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시간을 좀 갖는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">take\u003c/span> some time\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신 자신을 위한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">yourself\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">당신 자신을 위한 시간을 갖는 것 또한 중요하다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 두 번째 해결 방법으로 '자신을 위한 시간'을 제안하는 문장이에요. 앞의 It은 해석하지 않는 \u003cb class=\"key\">가주어\u003c/b>이고, 진짜 주어는 뒤의 to take some time for yourself입니다. for yourself는 '당신 자신을 위한'이라는 뜻으로 시간을 누구를 위해 쓰는지 밝혀 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가주어 It / 진주어 to부정사\u003c/span> : It is + [형용사] + [to부정사구(진주어)] : \"…하는 것은 …하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">재귀대명사 yourself\u003c/span> : 전치사 for + [재귀대명사] : \"당신 자신을 위한\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"It's also important, 그것은 또한 중요하다. to take some time, 시간을 좀 갖는 것은. for yourself, 당신 자신을 위한. 이 문장 전체를 해석하면, 당신 자신을 위한 시간을 갖는 것 또한 중요하다.","hl":"m"},{"n":25,"text":"이 문장은 스트레스를 줄이는 두 번째 방법으로 자신을 위한 시간을 제안하고 있어요. 가주어 It을 그대로 '그것은'으로 해석하면 어색하니까, 뒤의 to부정사구를 주어로 올려서 읽는 습관을 들여야 해요.","hl":"mn"},{"n":26,"text":"첫 번째, 문장 앞의 It은 가주어예요. 진짜 주어인 to take some time for yourself가 진주어로 뒤에 있죠. 두 번째, for yourself에서 yourself는 재귀대명사예요. 주어 you와 같은 대상을 다시 가리키면서 당신 자신을 강조해 주는 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 시간 동안\u003c/span>\u003cspan class=\"en\">During this time,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 휴식을 취할 수 있다\u003c/span>\u003cspan class=\"en\">you \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">relax, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">운동을 하거나\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">exercise, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">심지어 친구를 만날 수도 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">even \u003c/span>\u003cspan class=\"tgt\">meet\u003c/span> friends.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 시간 동안, 당신은 휴식을 취하거나 운동을 하거나, 심지어 친구를 만날 수도 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 말한 '자신을 위한 시간'에 실제로 무엇을 할 수 있는지 구체적인 예를 나열하는 문장이에요. relax, exercise, meet가 같은 자격으로 나란히 놓여 \u003cb class=\"key\">병렬구조\u003c/b>를 이룹니다. even은 '심지어'라는 뜻으로 친구를 만나는 것까지 괜찮다는 \u003cb class=\"key\">강조\u003c/b>를 더해 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 can (가능)\u003c/span> : 주어 + [can] + [동사원형] : \"~할 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">병렬구조 (동사원형 나열)\u003c/span> : [동사원형 A], [동사원형 B], or [동사원형 C] : \"A하거나 B하거나 C하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">강조 부사 even\u003c/span> : even + [동사/명사] : \"심지어 ~하다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"During this time, 이 시간 동안. you can relax, 당신은 휴식을 취할 수 있다. exercise, 운동을 하거나. or even meet friends, 심지어 친구를 만날 수도 있다. 이 문장 전체를 해석하면, 이 시간 동안, 당신은 휴식을 취하거나 운동을 하거나, 심지어 친구를 만날 수도 있다.","hl":"m"},{"n":28,"text":"이 문장은 자신을 위한 시간에 무엇을 할 수 있는지 구체적인 예를 보여 주면서 앞의 주장을 뒷받침해요. 휴식, 운동, 친구 만나기처럼 서로 다른 활동을 나열해서 이 시간이 자유롭게 쓰는 시간이라는 걸 알려 주는 거죠.","hl":"mn"},{"n":29,"text":"첫 번째, can은 조동사라서 뒤에 동사원형이 와요. 두 번째, can 하나에 relax와 exercise와 meet가 모두 걸리기 때문에 모양을 똑같이 맞춘 병렬구조가 만들어졌어요. 세 번째, even은 뒤의 표현을 강조해서 심지어 친구를 만나는 것까지 괜찮다는 느낌을 더해 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은\u003c/span>\u003cspan class=\"en\">This\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신의 스트레스 정도를 줄이고\u003c/span>\u003cspan class=\"en\">will \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">reduce \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">stress \u003c/span>\u003cspan class=\"tgt\">levels \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 더 생산적이 되도록 도울 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">help \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">productive\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 다시 공부를 시작할 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">start \u003c/span>\u003cspan class=\"tgt\">studying \u003c/span>\u003cspan class=\"tgt\">again\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것은 당신의 스트레스 정도를 줄이고 당신이 다시 공부를 시작할 때 더 생산적이 되도록 도울 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 자유 시간을 가지면 얻는 좋은 결과를 알려 주는 문장이에요. \u003cb class=\"key\">스트레스\u003c/b> 정도가 낮아지고, 다시 공부할 때 더 \u003cb class=\"key\">생산적\u003c/b>이 된다는 뜻이죠. 앞에서 말한 '자신을 위한 시간'이 결국 공부 효율까지 높여 준다는 흐름을 이어 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사구의 병렬 구조\u003c/span> : will + [reduce ~] and [help ~] : \"줄이고 … 돕다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">help + 목적어 + to부정사\u003c/span> : help + [목적어 you] + [to be (to부정사/목적격보어)] : \"당신이 더 생산적이 되도록 돕다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">시간의 부사절 접속사 when\u003c/span> : when + [주어] + [동사] ~ : 시간 부사절 : \"당신이 다시 공부를 시작할 때\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"This, 이것은. will reduce your stress levels, 당신의 스트레스 정도를 줄이고. and help you to be more productive, 당신이 더 생산적이 되도록 도울 것이다. when you start studying again, 당신이 다시 공부를 시작할 때. 이 문장 전체를 해석하면, 이것은 당신의 스트레스 정도를 줄이고 당신이 다시 공부를 시작할 때 더 생산적이 되도록 도울 것이다.","hl":"m"},{"n":31,"text":"이 문장은 자신을 위한 시간을 가지면 어떤 좋은 일이 생기는지 알려 주는 문장이에요. 스트레스 정도가 줄고, 다시 공부를 시작할 때 더 생산적이 된다는 거죠. 그래서 앞에서 말한 자유 시간이 결국 공부 효율까지 높여 준다는 흐름으로 이어집니다.","hl":"mn"},{"n":32,"text":"첫 번째는 help 뒤에 to부정사가 오는 구조예요. help는 목적어 뒤에 to부정사를 데려와 목적격보어를 만들 수 있고, to be가 생산적이라는 형용사와 이어져요. 두 번째는 and로 연결된 병렬인데, will 뒤에 reduce와 help가 병렬로 놓여서 둘 다 will의 지배를 받아요. 세 번째는 when이 이끄는 시간 부사절이고, start 뒤에는 studying이라는 동명사가 와서 공부를 시작하다라는 뜻이 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">처음에,\u003c/span>\u003cspan class=\"en\">At first,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 죄책감을 느낄지도 모른다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">might \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">feel \u003c/span>\u003cspan class=\"tgt\">guilty \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공부를 하지 않는 것에 대해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">about \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">studying\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 시간 동안\u003c/span>\u003cspan class=\"en\">during this time.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">처음에, 당신은 이 시간 동안 공부를 하지 않는 것에 대해 죄책감을 느낄지도 모른다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 쉬는 시간을 가지면 처음에는 마음이 불편할 수 있다는 점을 인정해 주는 문장이에요. '공부를 안 하고 있다'는 생각에 \u003cb class=\"key\">죄책감\u003c/b>이 들 수 있다는 거죠. 독자의 마음을 미리 짚어 줌으로써 바로 다음 문장의 반전, 즉 쉬는 시간이 꼭 필요하다는 주장을 자연스럽게 받아들이게 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 might (추측)\u003c/span> : might + [동사원형 feel] : \"~할지도 모른다, 죄책감을 느낄지도 모른다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">감정 형용사 + 전치사 관용표현\u003c/span> : feel guilty about + [명사/동명사] : \"~에 대해 죄책감을 느끼다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사의 목적어로 쓰인 동명사(부정형)\u003c/span> : 전치사 about + [not + 동명사 studying] : \"공부하지 않는 것에 대해\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"At first, 처음에. you might feel guilty, 당신은 죄책감을 느낄지도 모른다. about not studying, 공부를 하지 않는 것에 대해. during this time, 이 시간 동안. 이 문장 전체를 해석하면, 처음에, 당신은 이 시간 동안 공부를 하지 않는 것에 대해 죄책감을 느낄지도 모른다.","hl":"m"},{"n":34,"text":"이 문장은 쉬는 시간을 가지면 처음엔 마음이 편하지 않을 수 있다는 걸 인정해 주는 문장이에요. 공부를 안 하고 있다는 생각에 죄책감이 들 수 있다는 거죠. 이렇게 독자의 마음을 먼저 짚어 주면, 다음에 나오는 쉬는 시간이 꼭 필요하다는 주장이 훨씬 자연스럽게 다가옵니다.","hl":"mn"},{"n":35,"text":"첫 번째는 might인데, 이건 일지도 모른다라는 추측을 나타내는 조동사라서 뒤에 동사원형 feel이 와요. 두 번째는 전치사 about 뒤에 동명사가 온 구조예요. about 뒤에는 동명사 studying이 목적어로 오고, 부정은 동명사 앞에 not을 붙여서 공부하지 않는 것이라는 부정의 뜻을 만들어요. 세 번째는 guilty라는 감정 형용사가 about과 묶여서 죄책감을 느끼다라는 관용표현이 되는 부분입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만,\u003c/span>\u003cspan class=\"en\">However,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 자유 시간이 없으면,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">without \u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">free \u003c/span>\u003cspan class=\"tgt\">time\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 쉽게 에너지를 다 써버릴 수 있다.\u003c/span>\u003cspan class=\"en\">you \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">could \u003c/span>\u003cspan class=\"tgt\">easily \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">burn \u003c/span>\u003cspan class=\"tgt\">out\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 이러한 자유 시간이 없으면, 당신은 쉽게 에너지를 다 써버릴 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 걱정하는 독자에게 '쉬는 시간이 오히려 필수'라고 못 박는 마무리 문장이에요. 자유 시간이 없으면 \u003cb class=\"key\">탈진\u003c/b>한다는 경고로 글의 주장을 힘있게 끝맺습니다. burn out은 불이 다 타 버리듯 \u003cb class=\"key\">에너지\u003c/b>가 바닥나는 상태를 비유한 표현이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 without + 명사구 (조건의 의미)\u003c/span> : without + [명사구 this free time] : \"이러한 자유 시간이 없으면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 could (가정적 가능성)\u003c/span> : could + [부사 easily] + [동사원형 burn out] : \"쉽게 에너지를 다 써버릴 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">구동사 burn out\u003c/span> : burn out = [에너지를 다 써버리다 / 탈진하다] : \"에너지를 다 써버리다, 탈진하다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"However, 하지만. without this free time, 이러한 자유 시간이 없으면. you could easily burn out, 당신은 쉽게 에너지를 다 써버릴 수 있다.. 이 문장 전체를 해석하면, 하지만 이러한 자유 시간이 없으면, 당신은 쉽게 에너지를 다 써버릴 수 있다.","hl":"m"},{"n":37,"text":"이 문장은 쉬는 시간이 걱정되는 독자에게 오히려 그 시간이 꼭 필요하다고 못 박는 마무리예요. 자유 시간이 없으면 탈진한다는 경고로 글의 주장을 힘있게 끝맺습니다. burn out은 불이 다 타 버리듯 에너지가 바닥나는 상태를 비유한 표현이에요.","hl":"mn"},{"n":38,"text":"첫 번째는 without인데, 겉으로는 없이라는 전치사지만 문장 앞에서 조건의 뜻으로 해석돼요. 두 번째는 could로, 여기서는 가능성을 낮춰 말하는 가정의 조동사이고 뒤에 부사 easily를 지나 동사원형이 와요. 세 번째는 burn out이라는 구동사로, 에너지를 다 써버리다, 탈진하다라는 뜻입니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>학업 \u003cb class=\"key\">스트레스\u003c/b> 때문에 어린 학생도 \u003cb class=\"key\">번아웃 \u003c/b>\u003cb class=\"key\">증후군\u003c/b>을 경험할 수 있지만 예방할 수 있다.\u003c/li>\u003cli>중요한 일을 \u003cb class=\"key\">중요도\u003c/b> 순서로 처리하면 시간을 잘 \u003cb class=\"key\">관리\u003c/b>할 수 있다.\u003c/li>\u003cli>자신을 위한 \u003cb class=\"key\">자유 \u003c/b>\u003cb class=\"key\">시간\u003c/b>을 가지면 \u003cb class=\"key\">스트레스\u003c/b>가 줄고 다시 공부할 때 더 \u003cb class=\"key\">생산적\u003c/b>이 된다.\u003c/li>\u003cli>그 시간에 \u003cb class=\"key\">죄책감\u003c/b>을 느낄 수 있지만, 자유 시간이 없으면 쉽게 \u003cb class=\"key\">번아웃\u003c/b>될 수 있다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>To prevent burnout, students should prioritize tasks and make time for themselves to reduce stress and stay productive.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">학업 스트레스로 인한 \u003cb class=\"key\">번아웃 \u003c/b>\u003cb class=\"key\">증후군\u003c/b>을 예방하려면 \u003cb class=\"key\">중요도\u003c/b> 순서로 일을 처리하고 자신을 위한 \u003cb class=\"key\">자유 \u003c/b>\u003cb class=\"key\">시간\u003c/b>을 가져 스트레스를 줄여야 한다. 이 시간에 \u003cb class=\"key\">죄책감\u003c/b>을 느낄 수 있지만, 그것이 없으면 오히려 쉽게 \u003cb class=\"key\">번아웃\u003c/b>될 수 있다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":39,"text":"오늘 글은 burnout syndrome을 예방하려면 중요도 순서로 일을 처리하고 자신을 위한 자유 시간을 가져야 한다는 내용이었어요. 처음에는 죄책감이 들 수 있지만, 그 시간이 오히려 스트레스를 줄이고 공부 효율을 높여 준다는 점이 핵심이죠. 문제 해결 구조와 however, first, also 같은 신호어를 함께 기억해 주세요. 오늘도 수고했고 다음 시간에 또 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
