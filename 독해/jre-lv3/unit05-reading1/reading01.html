<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>쥬니어리딩엑스퍼트3 Unit5_Reading01 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"쥬니어리딩엑스퍼트3 Unit5_Reading01","audioDir":"reading01_audio","preview":false,"count":85,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.400em\">Unit5_Reading01\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">쥬니어리딩엑스퍼트3\u003c/div>\u003ch1>Why Do We Burp, and How Can We Burp Less?\u003c/h1>\u003ch2>우리는 왜 트림을 하고, 어떻게 트림을 줄일 수 있을까?\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>트림은 위에서 빠져나오는 공기의 소리로 매우 정상적인 현상이지만, \u003cb class=\"key\">공기를 \u003c/b>\u003cb class=\"key\">많이 \u003c/b>\u003cb class=\"key\">삼키면\u003c/b> 너무 잦은 트림이 \u003cb class=\"key\">당황스러울\u003c/b> 수 있다. 그래서 입에 음식을 가득 채운 채 말하지 않기, \u003cb class=\"key\">천천히\u003c/b> 먹기, \u003cb class=\"key\">탄산음료\u003c/b> 줄이기 같은 방법으로 트림을 덜 자주 할 수 있다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Burping is a perfectly normal reaction of your body, but you can burp less often by swallowing less air, for example by not talking with your mouth full, eating slowly, and stopping drinking soda.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 트림에 관한 아주 흥미로운 이야기예요. 맛있게 밥을 먹고 나서 크게 트림을 해 본 경험, 다들 한 번쯤 있으시죠? 이 글은 트림이 왜 생기고 왜 멈추기 어려운지, 그리고 트림을 덜 하는 방법까지 친절하게 알려 줍니다. 핵심은 트림이 지극히 정상적인 몸의 반응이지만 공기를 많이 삼키면 더 자주 나온다는 점이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">트림(burp)은 위(stomach)에 들어간 공기가 식도(esophagus)를 타고 목구멍(throat) 밖으로 빠져나오면서 나는 소리입니다. 위와 식도 사이에는 lower esophageal sphincter라는 고리 모양의 근육이 있어서 위의 내용물이 위쪽으로 올라오지 못하게 막아 줍니다. 그런데 이 \u003cb class=\"key\">괄약근\u003c/b>이 잠깐 열리면서 공기가 확 빠져나갈 때 성대(vocal cords)가 떨려 우리가 아는 그 소리가 나는 것이죠. 우리는 말하거나 먹거나 탄산음료를 마실 때 공기를 함께 삼키는데, 이것을 \u003cb class=\"key\">공기삼킴\u003c/b>(aerophagia)이라고 부릅니다. 예를 들어 빨대로 음료를 세게 빨아 마시면 음료보다 공기를 더 많이 삼키게 되는 것과 같은 원리입니다. 그래서 지문에 나오는 세 가지 방법은 모두 \u003cb class=\"key\">위로 \u003c/b>\u003cb class=\"key\">들어가는 \u003c/b>\u003cb class=\"key\">공기\u003c/b>의 양을 줄이는 방법이라고 이해하면 됩니다.\u003c/div>","segs":[{"n":2,"text":"본문에 들어가기 전에 배경지식을 조금 살펴볼게요. 트림은 위에 들어간 공기가 식도를 타고 목구멍 밖으로 빠져나오면서 나는 소리예요. 위와 식도 사이에는 lower esophageal sphincter라는 고리 모양의 근육이 있어서 위의 내용물이 위쪽으로 올라오지 못하게 막아 주죠. 그런데 이 괄약근이 잠깐 열리면서 공기가 확 빠져나갈 때 성대가 떨려서 우리가 아는 그 소리가 나는 거예요. 우리는 말하거나 먹거나 탄산음료를 마실 때 공기를 함께 삼키는데, 이걸 공기삼킴, 영어로 aerophagia라고 불러요. 빨대로 음료를 세게 빨아 마시면 음료보다 공기를 더 많이 먹게 되는 것과 같은 원리예요. 그래서 본문에 나오는 세 가지 방법은 모두 위로 들어가는 공기의 양을 줄이는 방법이라고 이해하시면 됩니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>트림 경험 묻기\u003csmall>도입 · 문장 1–5\u003c/small>\u003c/h4>\u003cp>글은 독자에게 맛있는 식사 후 \u003cb class=\"key\">큰 \u003c/b>\u003cb class=\"key\">트림\u003c/b>을 해 본 적이 있는지 묻고, 부모님이 '트림하지 마, \u003cb class=\"key\">실례\u003c/b>야'라고 혼냈을 상황을 떠올리게 한다. 이어서 트림을 멈추는 것이 \u003cb class=\"key\">가능\u003c/b>한지, 트림이 정확히 무엇인지 연달아 질문하며 호기심을 자극한다. 이렇게 질문을 던져 독자를 글 속으로 끌어들이는 도입 단계이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>트림의 정체\u003csmall>정의 · 문장 6–10\u003c/small>\u003c/h4>\u003cp>트림은 위에서 \u003cb class=\"key\">빠져나오는 \u003c/b>\u003cb class=\"key\">공기\u003c/b>의 소리라고 정의한다. 공기가 입 밖으로 나가려면 목구멍 뒤쪽의 \u003cb class=\"key\">얇은 \u003c/b>\u003cb class=\"key\">근육\u003c/b>을 지나야 하는데, 위의 공기가 이 근육을 급하게 통과할 때 그 소리가 난다. 그래서 트림은 \u003cb class=\"key\">멈출 \u003c/b>\u003cb class=\"key\">방법\u003c/b>이 거의 없는 자연스러운 반응이라고 설명한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>공기는 어떻게 들어오나\u003csmall>근거 · 문장 11–15\u003c/small>\u003c/h4>\u003cp>그렇다면 공기는 어떻게 위 속으로 들어갈까? 사람은 \u003cb class=\"key\">모르는 \u003c/b>\u003cb class=\"key\">사이에\u003c/b> 매시간 1리터의 공기를 \u003cb class=\"key\">삼키고\u003c/b>, 먹고 마실 때는 훨씬 더 많이 삼킨다. 그래서 트림은 \u003cb class=\"key\">매우 \u003c/b>\u003cb class=\"key\">정상적\u003c/b>이며, 어떤 나라에서는 요리사에게 \u003cb class=\"key\">감사\u003c/b>를 표하는 예의이기도 하다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>문제 제기와 해결 예고\u003csmall>전환 · 문장 16–18\u003c/small>\u003c/h4>\u003cp>하지만 \u003cb class=\"key\">너무 \u003c/b>\u003cb class=\"key\">잦은 \u003c/b>\u003cb class=\"key\">트림\u003c/b>은 당황스러울 수 있다고 문제를 꺼낸다. 이어서 걱정하지 말라고 안심시키며, 트림을 \u003cb class=\"key\">덜 \u003c/b>\u003cb class=\"key\">자주\u003c/b> 하는 방법을 소개하겠다고 예고한다. 여기서 글이 '트림이란 무엇인가'라는 설명에서 '어떻게 줄일까'라는 \u003cb class=\"key\">해결\u003c/b>로 방향을 튼다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>세 가지 방법\u003csmall>해결 · 문장 19–24\u003c/small>\u003c/h4>\u003cp>첫째, \u003cb class=\"key\">입에 \u003c/b>\u003cb class=\"key\">음식을 \u003c/b>\u003cb class=\"key\">가득 \u003c/b>\u003cb class=\"key\">채운 \u003c/b>\u003cb class=\"key\">채\u003c/b> 말하지 않는 것이다. 말하면서 먹으면 공기를 더 많이 삼키게 된다. 둘째, \u003cb class=\"key\">천천히\u003c/b> 먹는 것으로, 빨리 먹으면 공기가 위로 더 많이 밀려 들어간다. 셋째, \u003cb class=\"key\">탄산음료\u003c/b>를 끊는 것으로, 캔 하나에 1,800만 개가 넘는 공기 방울이 들어 있어 몇 시간 동안 트림이 이어질 수 있기 때문이다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 처음부터 끝까지 따라가 볼게요.","hl":null},{"n":4,"text":"글은 먼저 독자에게 질문을 던져요. 맛있는 식사를 하고 나서 큰 트림을 해 본 적 있느냐고요. 그리고 부모님이 혼내시면서 트림하지 마, 실례야, 하고 말씀하셨을 거라고 이야기하죠. 그러고 나서 트림을 멈추는 게 가능한지, 트림이 정확히 무엇인지 계속 질문을 이어 갑니다. 이렇게 질문으로 시작해서 독자의 호기심을 잡아끄는 도입 부분이에요.","hl":"f0"},{"n":5,"text":"다음은 트림의 정체를 밝히는 부분이에요. 트림은 위에서 빠져나오는 공기의 소리라고 정의하죠. 공기가 입 밖으로 나가려면 목구멍 뒤쪽에 있는 얇은 근육을 지나야 하는데, 위의 공기가 이 근육을 급하게 통과할 때 그 소리가 난다고 설명해요. 그래서 트림은 멈출 방법이 거의 없다는 결론까지 자연스럽게 이어집니다.","hl":"f1"},{"n":6,"text":"그다음에는 공기가 어떻게 위로 들어가는지를 다뤄요. 사람은 모르는 사이에 매시간 일 리터의 공기를 삼키고, 먹고 마실 때는 훨씬 더 많이 삼킨다고 하죠. 그래서 트림은 매우 정상적인 현상이고, 어떤 나라에서는 요리사에게 감사를 표하는 예의이기도 하다고 덧붙입니다.","hl":"f2"},{"n":7,"text":"그런데 여기서 글이 한 번 방향을 틀어요. 너무 잦은 트림은 당황스러울 수 있다고 문제를 꺼내는 거죠. 그러면서 걱정하지 말라고 안심시키고, 트림을 덜 자주 하는 방법을 소개하겠다고 예고합니다. 설명에서 해결로 넘어가는 아주 중요한 전환점이에요.","hl":"f3"},{"n":8,"text":"마지막으로 세 가지 방법이 나옵니다. 첫째는 입에 음식을 가득 채운 채 말하지 않는 것이고, 둘째는 천천히 먹는 것이에요. 셋째는 탄산음료를 마시지 않는 것인데, 캔 하나에 천팔백만 개가 넘는 공기 방울이 들어 있어서 몇 시간 동안 트림이 이어질 수 있기 때문이에요.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">질문-답변(문제-해결)\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 18번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 '트림이란 무엇이고 왜 멈출 수 없을까'라는 \u003cb class=\"key\">질문\u003c/b>에서 출발해 '어떻게 하면 덜 트림할 수 있을까'라는 \u003cb class=\"key\">해결\u003c/b>로 나아가는 질문-답변 구조이다. 앞부분은 트림의 정의와 원리를 설명하고, 뒷부분에서 세 가지 실천법을 제시하므로 글의 중심 내용이 후반부에 나오는 \u003cb class=\"key\">미괄식\u003c/b> 전개이다. 주제문은 'Here are some ways to burp less often.'인 열여덟 번째 문장으로, 뒤에 오는 세 가지 방법 전체를 묶어 주는 \u003cb class=\"key\">총정리\u003c/b> 문장이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>But (4)\u003c/b>\u003cspan>앞 내용을 뒤집는 전환\u003c/span>\u003cb>Well (6)\u003c/b>\u003cspan>답변 시작, 정의 제시\u003c/span>\u003cb>So (11)\u003c/b>\u003cspan>앞 내용을 받아 다음 질문으로 연결\u003c/span>\u003cb>In fact (15)\u003c/b>\u003cspan>앞 내용을 강하게 부연·강조\u003c/span>\u003cb>However (16)\u003c/b>\u003cspan>반대 상황 제시, 문제 제기\u003c/span>\u003cb>First (19)\u003c/b>\u003cspan>첫 번째 방법 나열\u003c/span>\u003cb>Since (24)\u003c/b>\u003cspan>이유·근거 제시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">let out a big burp\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a burp is the sound of air escaping from your stomach\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">air from your stomach rushes past this muscle\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">how does air get into your stomach\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">swallow a liter of air\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">too much burping\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">ways to burp less often\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"이 글의 전개 방식은 질문과 답변이에요. 트림이 무엇인지, 왜 멈출 수 없는지, 공기가 어떻게 들어가는지를 차례로 물어 보고 답을 주죠. 그러다가 뒤쪽에서 트림을 줄이는 방법을 제시하면서 자연스럽게 문제와 해결의 구조로 넘어갑니다. 주제문인 Here are some ways to burp less often.이 글 후반부에 나오기 때문에 미괄식 구조라고 정리할 수 있어요.","hl":"ty"},{"n":10,"text":"신호어를 짚어 볼게요. But이 나오면 앞의 내용을 뒤집는 전환이 일어나고, So가 나오면 앞의 질문이나 내용을 받아 결론을 내린다는 표시예요. In fact는 앞의 말을 더 강하게 뒷받침하고, However는 새로운 문제를 꺼내는 신호죠. First, Second, Third가 나오면 그 뒤에 구체적인 방법이 나열된다고 예상하시면 됩니다. 그리고 let out a big burp와 the sound of air escaping from your stomach처럼 같은 대상을 다르게 표현하는 재진술도 꼭 눈여겨보세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>delicious\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>맛있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>let out\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>(소리·공기를) 내보내다, 내뱉다\u003c/span>\u003c/div>\u003cdiv>\u003cb>burp\u003c/b>\u003cem>명사\u003c/em>\u003cspan>트림(동사: 트림하다)\u003c/span>\u003c/div>\u003cdiv>\u003cb>probably\u003c/b>\u003cem>부사\u003c/em>\u003cspan>아마도\u003c/span>\u003c/div>\u003cdiv>\u003cb>scold\u003c/b>\u003cem>동사\u003c/em>\u003cspan>꾸짖다, 혼내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>rude\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>무례한, 실례인\u003c/span>\u003c/div>\u003cdiv>\u003cb>possible\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>가능한\u003c/span>\u003c/div>\u003cdiv>\u003cb>exactly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>정확히\u003c/span>\u003c/div>\u003cdiv>\u003cb>anyway\u003c/b>\u003cem>부사\u003c/em>\u003cspan>어쨌거나, 그런데\u003c/span>\u003c/div>\u003cdiv>\u003cb>escape\u003c/b>\u003cem>동사\u003c/em>\u003cspan>빠져나오다, 탈출하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>stomach\u003c/b>\u003cem>명사\u003c/em>\u003cspan>위, 배\u003c/span>\u003c/div>\u003cdiv>\u003cb>pass\u003c/b>\u003cem>동사\u003c/em>\u003cspan>통과하다, 지나가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>thin\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>얇은\u003c/span>\u003c/div>\u003cdiv>\u003cb>muscle\u003c/b>\u003cem>명사\u003c/em>\u003cspan>근육\u003c/span>\u003c/div>\u003cdiv>\u003cb>at the back of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~의 뒤쪽에\u003c/span>\u003c/div>\u003cdiv>\u003cb>throat\u003c/b>\u003cem>명사\u003c/em>\u003cspan>목구멍, 목\u003c/span>\u003c/div>\u003cdiv>\u003cb>rush\u003c/b>\u003cem>동사\u003c/em>\u003cspan>급하게 움직이다, 돌진하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>swallow\u003c/b>\u003cem>동사\u003c/em>\u003cspan>삼키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>liter\u003c/b>\u003cem>명사\u003c/em>\u003cspan>리터\u003c/span>\u003c/div>\u003cdiv>\u003cb>normal\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>정상적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>in fact\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>사실은, 실제로\u003c/span>\u003c/div>\u003cdiv>\u003cb>polite\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>예의 바른, 공손한\u003c/span>\u003c/div>\u003cdiv>\u003cb>appreciation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>감사, 고마움\u003c/span>\u003c/div>\u003cdiv>\u003cb>embarrassing\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>당황스러운, 창피한\u003c/span>\u003c/div>\u003cdiv>\u003cb>slowly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>천천히\u003c/span>\u003c/div>\u003cdiv>\u003cb>push\u003c/b>\u003cem>동사\u003c/em>\u003cspan>밀어 넣다, 밀다\u003c/span>\u003c/div>\u003cdiv>\u003cb>soda\u003c/b>\u003cem>명사\u003c/em>\u003cspan>탄산음료\u003c/span>\u003c/div>\u003cdiv>\u003cb>bubble\u003c/b>\u003cem>명사\u003c/em>\u003cspan>(공기) 방울, 거품\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"단어도 몇 개 짚고 갈게요. escape는 빠져나오다, rush는 급하게 움직이다, swallow는 삼키다라는 뜻이에요. scold는 꾸짖다, embarrassing은 당황스러운이라는 뜻이니 반드시 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">burp\u003c/b>\u003cspan class=\"m\">트림(하다)\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">belch\u003c/span>\u003cspan class=\"s\">hiccup\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">scold\u003c/b>\u003cspan class=\"m\">꾸짖다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">reprimand\u003c/span>\u003cspan class=\"s\">tell off\u003c/span>\u003cspan class=\"s\">blame\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">praise\u003c/span>\u003cspan class=\"a\">compliment\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">escape\u003c/b>\u003cspan class=\"m\">빠져나오다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">get out\u003c/span>\u003cspan class=\"s\">leak out\u003c/span>\u003cspan class=\"s\">break free\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">enter\u003c/span>\u003cspan class=\"a\">stay in\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">rude\u003c/b>\u003cspan class=\"m\">무례한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">impolite\u003c/span>\u003cspan class=\"s\">disrespectful\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">polite\u003c/span>\u003cspan class=\"a\">courteous\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">normal\u003c/b>\u003cspan class=\"m\">정상적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">usual\u003c/span>\u003cspan class=\"s\">ordinary\u003c/span>\u003cspan class=\"s\">common\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">abnormal\u003c/span>\u003cspan class=\"a\">unusual\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">swallow\u003c/b>\u003cspan class=\"m\">삼키다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">gulp\u003c/span>\u003cspan class=\"s\">take in\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">spit out\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어도 정리해 볼게요. scold는 reprimand나 tell off로 바꿔 쓸 수 있고 반대말은 praise예요. rude는 impolite나 disrespectful과 비슷하고 반대말은 polite죠. escape는 get out이나 leak out으로 바꿀 수 있고, normal은 usual이나 ordinary와 같은 뜻이라 반대말은 abnormal이에요. swallow는 gulp로 바꿔 쓸 수 있고 반대말은 spit out입니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 24\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 ~을 먹어 본 적이 있는가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Have \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">ever \u003c/span>\u003cspan class=\"tgt\">eaten\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">맛있는 식사를\u003c/span>\u003cspan class=\"en\">a delicious meal\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 나서 내보낸\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">then \u003c/span>\u003cspan class=\"tgt\">let \u003c/span>\u003cspan class=\"tgt\">out\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">큰 트림을?\u003c/span>\u003cspan class=\"en\">a big burp?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">당신은 맛있는 식사를 하고 나서 큰 트림을 해본 적이 있는가?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 독자에게 경험을 물으며 글을 여는 도입 문장이다. 누구나 겪어 봤을 '식사 후 트림'이라는 소재로 \u003cb class=\"key\">공감대\u003c/b>를 만들고, 뒤에 이어질 \u003cb class=\"key\">트림\u003c/b>에 대한 설명으로 자연스럽게 넘어가게 하는 역할을 한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재완료(경험) 의문문\u003c/span> : Have + 주어 + ever + p.p. ~? : \"(지금까지) ~해 본 적이 있는가\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사 병렬(have의 공통 적용)\u003c/span> : [have + p.p. A] + and + [(have) + p.p. B] : \"그리고 나서 (큰 트림을) 내보낸\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"Have you ever eaten, 당신은 ~을 먹어 본 적이 있는가. a delicious meal, 맛있는 식사를. and then let out, 그리고 나서 내보낸. a big burp?, 큰 트림을?. 이 문장 전체를 해석하면, 당신은 맛있는 식사를 하고 나서 큰 트림을 해본 적이 있는가?","hl":"m"},{"n":14,"text":"이 문장은 독자에게 경험을 물으면서 글을 시작해요. 누구나 겪어 봤을 식사 후 트림 이야기를 꺼내 자연스럽게 공감대를 만드는 거죠. 그래서 다음 문장에서 부모님께 혼났던 기억으로 매끄럽게 이어집니다.","hl":"mn"},{"n":15,"text":"먼저 현재완료부터 볼게요. Have you ever eaten은 지금까지 맛있는 식사를 먹어 본 적이 있는지 묻는 경험의 현재완료예요. 두 번째는 and then let out인데, 앞의 have가 뒤에도 그대로 걸려서 과거분사가 병렬된 구조예요. let은 원형과 과거형, 과거분사가 모두 let이라서 원형처럼 보이지만 여기서는 과거분사라는 점을 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 24\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신의 부모님은\u003c/span>\u003cspan class=\"en\">Your parents\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아마도 당신을 혼냈을 것이다\u003c/span>\u003cspan class=\"en\">probably \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">scolded \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 말씀하셨을 것이다,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">said\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">&quot;트림하지 말아라!\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">Don't \u003c/span>\u003cspan class=\"tgt\">burp\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">당신의 부모님은 아마도 당신을 혼내며 &quot;트림하지 말아라!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 질문에 이어, 독자가 실제로 겪었을 어린 시절 \u003cb class=\"key\">훈육\u003c/b> 장면을 떠올리게 한다. 부모님이 트림을 \u003cb class=\"key\">실례\u003c/b>라고 가르쳤다는 내용으로, 트림이 예의에 어긋난다고 여기는 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">통념\u003c/b>을 보여 준다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">등위접속사 and에 의한 동사 병렬\u003c/span> : [과거동사 A + 목적어] + and + [과거동사 B] : \"당신을 혼내고 (그리고) 말했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부정 명령문의 직접인용\u003c/span> : Don't + [동사원형] ~ : \"트림하지 마라\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"Your parents, 당신의 부모님은. probably scolded you, 아마도 당신을 혼냈을 것이다. and said, 그리고 말씀하셨을 것이다. \"Don't burp!, \"트림하지 말아라!. 이 문장 전체를 해석하면, 당신의 부모님은 아마도 당신을 혼내며 \"트림하지 말아라!","hl":"m"},{"n":17,"text":"이 문장은 부모님이 혼내는 장면을 그려서 독자의 경험을 떠올리게 해요. 트림하면 혼난다는 훈육 기억을 꺼내면서, 트림이 예의에 어긋난다는 사회적 통념을 자연스럽게 깔아 주는 거죠.","hl":"mn"},{"n":18,"text":"여기서는 and로 scolded와 said 두 과거동사가 나란히 이어진 동사 병렬을 먼저 보세요. 그리고 Don't burp는 부정 명령문으로, 누군가의 말을 그대로 옮긴 직접인용이에요. 명령문을 인용할 때는 don't 뒤에 동사원형이 온다는 점도 함께 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 24\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 ~이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It's\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무례한(실례인).\u003c/span>\u003cspan class=\"en\">rude.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 실례야.&quot;라고 말씀하셨을 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 인용한 부모님의 말을 이어받아, 트림을 \u003cb class=\"key\">금지\u003c/b>하는 이유를 제시한다. 트림이 \u003cb class=\"key\">무례\u003c/b>하다는 인식을 분명히 하면서, 뒤에서 '그래도 멈출 수 없다'는 \u003cb class=\"key\">반전\u003c/b>을 준비하는 문장이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">앞 내용을 받는 지시대명사 It / 2형식\u003c/span> : It(주어) + is(동사) + rude(주격보어) : \"그것은 실례이다\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"It's, 그것은 ~이다. rude, 무례한(실례인).. 이 문장 전체를 해석하면, 그것은 실례야.\"라고 말씀하셨을 것이다.","hl":"m"},{"n":20,"text":"이 문장은 부모님 말씀의 뒷부분이에요. 트림하지 말라는 이유가 바로 실례, 즉 무례하기 때문이라는 걸 분명히 해 주죠. 이렇게 트림은 예의가 아니라는 인식을 깔아 두고, 뒤에서 트림을 멈출 수 없다는 반전으로 이어집니다.","hl":"mn"},{"n":21,"text":"It은 앞에 나온 트림하는 행동을 그대로 받는 지시대명사예요. 그래서 '그것은 무례하다'라는 뜻이 되죠. is 뒤에 형용사 rude가 와서 주어와 보어가 같아지는 이 형식 구조도 같이 익혀 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 24\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 그것이 가능할까\u003c/span>\u003cspan class=\"en\">But is \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">it\u003c/span> possible\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">트림을 멈추는 것이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">stop \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">burp\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 트림을 멈추는 것이 가능할까?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 부모님의 꾸중 뒤에 트림을 멈출 수 있는지 \u003cb class=\"key\">가능성\u003c/b>을 묻는 문장이에요. 앞의 훈계를 반박하듯 질문을 던져 \u003cb class=\"key\">문제 \u003c/b>\u003cb class=\"key\">제기\u003c/b>를 하며, 이어질 트림의 정의로 자연스럽게 연결합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가주어 it\u003c/span> : It + be동사 + 형용사 + [to부정사(진주어)] : \"트림을 멈추는 것은 가능할까?\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(진주어)\u003c/span> : [to + 동사원형] + 목적어 : \"트림을 멈추는 것\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"But is it possible, 그러나 그것이 가능할까. to stop a burp?, 트림을 멈추는 것이. 이 문장 전체를 해석하면, 그러나 트림을 멈추는 것이 가능할까?","hl":"m"},{"n":23,"text":"부모님의 꾸중 뒤에 트림을 멈출 수 있는지 가능성을 묻는 문장이에요. 앞의 훈계를 반박하듯 질문을 던져 문제 제기를 하며, 이어질 트림의 정의로 자연스럽게 연결합니다.","hl":"mn"},{"n":24,"text":"첫 번째로 it은 가주어예요. 진짜 주어인 to부정사 to stop a burp를 뒤로 보내 문장 균형을 맞춘답니다. 두 번째로 to stop a burp는 is possible의 진짜 주어 역할을 하는 to부정사구예요. 앞의 it이 이를 대신하는 가주어라는 점도 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 24\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고\u003c/span>\u003cspan class=\"en\">And\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정확히 무엇이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">exactly \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">트림인가,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">burp\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어쨌거나?\u003c/span>\u003cspan class=\"en\">anyway?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그리고 어쨌거나 트림은 정확히 무엇일까?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 트림이라는 말의 뜻을 \u003cb class=\"key\">정의\u003c/b>하기 전에 독자에게 \u003cb class=\"key\">질문\u003c/b>을 던지는 문장이에요. exactly와 anyway를 넣어 '도대체 트림이 뭐지?'라는 궁금증을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문사 의문문의 어순\u003c/span> : 의문사 + [be동사] + 주어? : \"트림은 정확히 무엇인가?\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"And, 그리고. what exactly, 정확히 무엇이. is a burp, 트림인가. anyway?, 어쨌거나?. 이 문장 전체를 해석하면, 그리고 어쨌거나 트림은 정확히 무엇일까?","hl":"m"},{"n":26,"text":"트림이라는 말의 뜻을 정의하기 전에 독자에게 질문을 던지는 문장이에요. exactly와 anyway를 넣어 도대체 트림이 뭐지라는 궁금증을 강조합니다.","hl":"mn"},{"n":27,"text":"첫 번째로 what은 의문사예요. 두 번째로 is는 be동사이고, 의문사 what 뒤에 be동사 is가 주어 a burp보다 먼저 나오는 의문문 어순을 보여 줍니다. exactly는 is를 꾸미는 부사로 정확히 무엇인지 묻는 느낌을 더해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 24\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">음,\u003c/span>\u003cspan class=\"en\">Well,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">트림은 ~이다\u003c/span>\u003cspan class=\"en\">a burp \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공기의 소리\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">sound\u003c/span> of air\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신의 위에서 빠져나오는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">escaping \u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">stomach\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">음, 트림은 당신의 위에서 빠져나오는 공기의 소리이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 트림의 \u003cb class=\"key\">정의\u003c/b>를 내리는 핵심 문장이에요. 위에서 공기가 빠져나오며 나는 \u003cb class=\"key\">소리\u003c/b>라는 뜻을 분사구로 자세히 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사와 주격보어\u003c/span> : 주어 + [be동사] + [주격보어] : \"그 소리이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재분사(명사 수식)\u003c/span> : 명사 + [동사원형-ing + 전치사구] : \"당신의 위에서 빠져나오는\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"Well, 음. a burp is, 트림은 ~이다. the sound of air, 공기의 소리. escaping from your stomach, 당신의 위에서 빠져나오는. 이 문장 전체를 해석하면, 음, 트림은 당신의 위에서 빠져나오는 공기의 소리이다.","hl":"m"},{"n":29,"text":"트림의 정의를 내리는 핵심 문장이에요. 위에서 공기가 빠져나오며 나는 소리라는 뜻을 분사구로 자세히 설명합니다.","hl":"mn"},{"n":30,"text":"첫 번째로 a burp가 주어, the sound가 주격보어로 이어지는 이 형식 문장이에요. 두 번째로 escaping은 앞의 명사 air가 빠져나오는 주체라서 air를 꾸미는 현재분사예요. 그래서 능동의 의미를 살려 당신의 위에서 빠져나오는 공기라고 해석합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 24\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신의 입에서 빠져나오기 위해서,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">To \u003c/span>\u003cspan class=\"tgt\">leave \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">mouth\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 통과해야 한다\u003c/span>\u003cspan class=\"en\">it \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">must \u003c/span>\u003cspan class=\"tgt\">pass\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">얇은 근육을\u003c/span>\u003cspan class=\"en\">a thin muscle\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신의 목구멍 뒤에 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">back \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">throat\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">당신의 입에서 빠져나오기 위해서, 그것은 목구멍 뒤에 있는 얇은 근육을 통과해야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 트림으로 공기가 입 밖으로 나가려면 반드시 \u003cb class=\"key\">목구멍\u003c/b> 뒤쪽의 얇은 근육을 지나야 한다는 몸속 원리를 설명해요. 앞 문장에서 트림을 공기의 소리라고 정의한 뒤, 그 공기가 지나는 \u003cb class=\"key\">경로\u003c/b>를 구체적으로 알려 주는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : [To + 동사원형 + 목적어], [주어] + [동사] → '~하기 위해서' : \"당신의 입에서 빠져나오기 위해서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 must(의무·필요)\u003c/span> : [주어] + must + [동사원형] : \"통과해야 한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 수식\u003c/span> : [명사 a thin muscle] + at the back of your throat : \"당신의 목구멍 뒤에 있는\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"To leave your mouth, 당신의 입에서 빠져나오기 위해서. it must pass, 그것은 통과해야 한다. a thin muscle, 얇은 근육을. at the back of your throat, 당신의 목구멍 뒤에 있는. 이 문장 전체를 해석하면, 당신의 입에서 빠져나오기 위해서, 그것은 목구멍 뒤에 있는 얇은 근육을 통과해야 한다.","hl":"m"},{"n":32,"text":"이 문장은 트림으로 공기가 입 밖으로 나오려면 반드시 거쳐야 하는 통로를 설명하고 있어요. 바로 목구멍 뒤쪽에 있는 얇은 근육이죠. 앞에서 트림이 공기의 소리라고 했으니, 이제 그 공기가 지나는 경로를 알려 주는 대목입니다.","hl":"mn"},{"n":33,"text":"첫 번째, 문장 맨 앞의 To leave your mouth는 목적을 나타내는 to부정사예요. ~하기 위해서라고 해석하는 부사적 용법이죠. 두 번째, must pass에서 must는 ~해야 한다는 의무와 필요를 나타내는 조동사라서 뒤에 동사원형 pass가 옵니다. 세 번째, at the back of your throat는 전치사구로 앞의 a thin muscle을 뒤에서 꾸며 주는 역할을 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 24\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신의 위에서 나오는 공기가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">air \u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">stomach \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 근육을 급하게 지나갈 때...\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">rushes \u003c/span>\u003cspan class=\"tgt\">past \u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">muscle\u003c/span>...\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어어...\u003c/span>\u003cspan class=\"en\">uh-oh...\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">당신의 위에서 빠져나오는 공기가 이 근육을 급하게 지나갈 때... 어어...\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 위에서 올라온 공기가 그 근육을 세차게 \u003cb class=\"key\">통과\u003c/b>하는 순간을 생생하게 그린 문장이에요. 그래서 uh-oh라는 감탄으로 트림이 터지기 직전의 \u003cb class=\"key\">상황\u003c/b>을 재미있게 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간 접속사 when + 현재시제\u003c/span> : [When] + [주어] + [동사(현재)], [주어] + [동사] : \"당신의 위에서 나오는 공기가 이 근육을 급하게 지나갈 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주어-동사 수 일치\u003c/span> : [주어 air] + [동사 rushes] : \"당신의 위에서 나오는 공기가 급하게 지나가다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">자동사 + 전치사(past)\u003c/span> : [rush] + [past] + [목적어] : \"이 근육을 급하게 지나가다\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"When air from your stomach, 당신의 위에서 나오는 공기가. rushes past this muscle, 이 근육을 급하게 지나갈 때.... uh-oh, 어어.... 이 문장 전체를 해석하면, 당신의 위에서 빠져나오는 공기가 이 근육을 급하게 지나갈 때... 어어...","hl":"m"},{"n":35,"text":"공기가 목으로 올라와 근육을 세차게 통과하는 순간을 그린 문장이에요. 그래서 uh-oh라는 감탄으로 트림이 터지기 직전의 상황을 재미있게 보여 줍니다. 앞 문장의 설명이 실제 장면으로 살아나는 부분이죠.","hl":"mn"},{"n":36,"text":"첫 번째, When은 ~할 때라는 시간을 나타내는 접속사이고 뒤에 주어 air와 동사 rushes가 옵니다. 두 번째, 주어 air는 단수 취급이라 동사에 s를 붙여 rushes로 일치시켰어요. 세 번째, past는 ~을 지나서라는 전치사로 rush의 방향을 보충해 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 24\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그윽!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">BURP!\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그윽!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 설명한 상황이 실제로 터진 순간을 \u003cb class=\"key\">의성어\u003c/b> 하나로 표현한 문장이에요. 짧은 감탄으로 트림 소리를 그대로 들려주어 글에 \u003cb class=\"key\">생동감\u003c/b>을 더합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">감탄사(의성어)에 의한 소리 흉내\u003c/span> : [[의성어]] 단독 + 느낌표(!) : \"그윽! (트림 소리)\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"BURP!, 그윽!. 이 문장 전체를 해석하면, 그윽!","hl":"m"},{"n":38,"text":"앞에서 설명한 상황이 실제로 터진 순간을 의성어 하나로 표현했어요. 짧은 감탄 하나로 트림 소리를 그대로 들려주니 글에 생동감이 확 살아납니다.","hl":"mn"},{"n":39,"text":"여기서는 어법보다 소리를 흉내 내는 감탄사로 보면 됩니다. 대문자로 크게 쓰고 느낌표를 붙여서 트림 소리가 터지는 느낌을 강조했어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 24\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There's \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정말로 방법이 없는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">really \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">no \u003c/span>\u003cspan class=\"tgt\">way \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 멈출\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">stop \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것을 멈출 방법은 정말로 없다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 트림을 멈추고 싶어도 의지로는 어쩔 수 없다는 결론을 단호하게 말하는 문장이에요. 앞에서 트림이 목의 근육을 지나며 나는 소리라고 설명한 뒤, \u003cb class=\"key\">멈출 \u003c/b>\u003cb class=\"key\">방법\u003c/b>이 없다고 못 박아서 다음 문단의 새로운 질문으로 넘어가게 해 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">There is 구문(유도부사)\u003c/span> : There + be동사 + 주어 (~이 있다) : \"정말로 방법이 없다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : 명사(way) + to부정사 (…할 명사) : \"그것을 멈출 방법\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"There's, 있다. really no way, 정말로 방법이 없는. to stop it!, 그것을 멈출. 이 문장 전체를 해석하면, 그것을 멈출 방법은 정말로 없다!","hl":"m"},{"n":41,"text":"트림을 멈추고 싶어도 의지로는 어쩔 수 없다는 걸 단호하게 말하는 문장이에요. 앞에서 트림이 목의 근육을 지나며 나는 소리라고 설명했으니, 여기서 멈출 방법이 없다고 못 박아 주는 거죠. 그래야 다음에 나오는 새로운 질문으로 자연스럽게 넘어갈 수 있어요.","hl":"mn"},{"n":42,"text":"먼저 There's really no way에서 there는 유도부사예요. '~이 있다'라는 뜻으로 문장을 여는 장치이고, 진짜 주어인 진주어는 뒤에 오는 no way, 즉 '어떤 방법'이에요. 그리고 no way to stop it에서 to부정사 to stop이 앞의 명사 way를 뒤에서 꾸며 주죠. 이걸 형용사적 용법이라고 해요. 참고로 여기서 to stop은 '멈추기 위해서'가 아니라 '멈출 방법'으로 해석해야 자연스러워요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 24\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그렇다면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">So\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떻게 공기가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">does \u003c/span>\u003cspan class=\"tgt\">air \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신의 위 속으로 들어가는가?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">get\u003c/span> into your stomach?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그렇다면 어떻게 공기가 당신의 위 속으로 들어가는 걸까?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> '멈출 수 없다'는 앞 문장을 받아서, 화제를 원인 쪽으로 돌리는 전환 질문이에요. 트림의 정체를 알았으니 이번엔 공기가 몸속으로 들어오는 경로를 묻는 거죠. 이 질문이 뒤에 나오는 '공기를 삼킨다'는 설명의 \u003cb class=\"key\">도입\u003c/b> 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속부사 So(화제 전환)\u003c/span> : So + 의문문 (~그렇다면) : \"그렇다면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">의문사 의문문의 어순(조동사 도치)\u003c/span> : 의문사 + 조동사(does) + 주어 + 동사원형? : \"어떻게 공기가 … 들어가는가?\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"So, 그렇다면. how does air, 어떻게 공기가. get into your stomach?, 당신의 위 속으로 들어가는가?. 이 문장 전체를 해석하면, 그렇다면 어떻게 공기가 당신의 위 속으로 들어가는 걸까?","hl":"m"},{"n":44,"text":"트림을 멈출 수 없다면 원인을 알아야겠죠. 그래서 공기가 위로 들어오는 경로를 묻는 문장이에요. 앞 문장의 '멈출 수 없다'를 받아서 화제를 원인 탐구로 돌리는 전환 질문이라고 보면 돼요.","hl":"mn"},{"n":45,"text":"먼저 문장 앞의 so는 앞 내용을 이어받아 '그렇다면'이라고 화제를 전환하는 접속부사예요. 그리고 how does air get에서 의문문이기 때문에 조동사 does가 주어 air 앞으로 나오는 도치가 일어났어요. 조동사가 앞에 나오면 본동사는 동사원형 get을 쓴다는 점도 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 24\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자,\u003c/span>\u003cspan class=\"en\">Well,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 모르는 사이에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">without \u003c/span>\u003cspan class=\"tgt\">knowing \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 보통 삼킨다\u003c/span>\u003cspan class=\"en\">you usually swallow\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1리터의 공기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">liter \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">air\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매시간\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">every \u003c/span>\u003cspan class=\"tgt\">hour\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">자, 모르는 사이에 당신은 보통 매시간 1리터의 공기를 삼킨다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 공기가 위로 들어오는 경로에 대한 답으로, 우리가 \u003cb class=\"key\">무의식\u003c/b>적으로 공기를 삼키고 있음을 알려 주는 문장이에요. '매시간 1리터'라는 구체적 \u003cb class=\"key\">수치\u003c/b>로 놀라움을 주면서, 뒤에 나올 '트림은 정상'이라는 결론의 근거가 돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 + 동명사(동명사구)\u003c/span> : 전치사(without) + 동명사(~ing) (~하지 않고) : \"그것을 모르는 사이에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수량 표현(단위명사 + of)\u003c/span> : 수량 단위 + of + 명사 : \"1리터의 공기\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">every + 단수명사\u003c/span> : every + 단수 가산명사 (매 ~마다) : \"매시간\"\u003c/div>\u003c/div>","segs":[{"n":46,"text":"Well, 자. without knowing it, 그것을 모르는 사이에. you usually swallow, 당신은 보통 삼킨다. a liter of air, 1리터의 공기를. every hour, 매시간. 이 문장 전체를 해석하면, 자, 모르는 사이에 당신은 보통 매시간 1리터의 공기를 삼킨다.","hl":"m"},{"n":47,"text":"공기가 위로 들어오는 경로에 대한 답이에요. 우리가 무의식적으로, 그러니까 모르는 사이에 공기를 삼키고 있다는 사실을 알려 주죠. 매시간 1리터라는 구체적인 수치를 보여 주면서 놀라움을 주고, 뒤에 나올 '트림은 정상이다'라는 결론의 근거가 돼요.","hl":"mn"},{"n":48,"text":"먼저 without knowing it을 보세요. 전치사 without 뒤에는 동사원형이 아니라 동명사 knowing이 왔어요. 전치사 뒤에서는 동사를 동명사로 바꿔 써야 하거든요. 그리고 이 덩어리 전체가 '모르는 사이에'라는 부사구 역할을 해요. 다음으로 a liter of air처럼 리터 같은 단위 명사는 of와 함께 쓰여서 '얼마의 ~'라는 수량 표현을 만들어요. 마지막으로 every hour는 every 뒤에 단수 명사가 와서 매시간이라는 빈도를 나타내는 표현이에요. 그리고 usually는 보통, 대개라는 뜻으로 습관적인 빈도를 알려 주는 부사라는 것도 챙겨 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 24\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 삼킨다\u003c/span>\u003cspan class=\"en\">You swallow\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">훨씬 더 많이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">even \u003c/span>\u003cspan class=\"tgt\">more\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">음식을 먹고 마실 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">eat \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">drink\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">음식을 먹고 마실 때는 훨씬 더 많이 삼킨다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 공기가 위로 들어간다고 했으므로, 이 문장은 먹고 마실 때 \u003cb class=\"key\">공기\u003c/b>를 더 많이 \u003cb class=\"key\">삼킨다\u003c/b>는 점을 덧붙여 트림이 생기는 이유를 구체화해요. 'even more'는 보통 때보다 \u003cb class=\"key\">훨씬 \u003c/b>\u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">많이\u003c/b>라는 비교 강조 표현이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">비교급 강조 부사 even\u003c/span> : even + [비교급(more)] (훨씬 더 ~) : \"훨씬 더 많이\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 when의 시간 부사절\u003c/span> : when + [주어] + [동사] (…할 때) : \"음식을 먹고 마실 때\"\u003c/div>\u003c/div>","segs":[{"n":49,"text":"You swallow, 당신은 삼킨다. even more, 훨씬 더 많이. when you eat and drink, 음식을 먹고 마실 때. 이 문장 전체를 해석하면, 음식을 먹고 마실 때는 훨씬 더 많이 삼킨다.","hl":"m"},{"n":50,"text":"이 문장은 앞에서 공기가 위로 들어간다고 했으니, 먹고 마실 때 공기를 더 많이 삼킨다는 점을 알려 줘요. 보통 때보다 먹고 마실 때 훨씬 더 많이 삼킨다는 뜻이죠. 그래서 트림이 생기는 이유를 자연스럽게 이해할 수 있어요.","hl":"mn"},{"n":51,"text":"첫 번째로, even more에서 even은 비교급을 강조하는 부사예요. 그래서 훨씬 더라는 강조를 더해 주죠. 두 번째로, when you eat and drink에서 when은 시간을 나타내는 접속사이고, eat과 drink는 and로 병렬 연결되어 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 24\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">따라서\u003c/span>\u003cspan class=\"en\">So,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">트림은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">burping\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매우 정상적이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">perfectly \u003c/span>\u003cspan class=\"tgt\">normal\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">따라서 트림은 매우 정상적이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> So는 앞 내용의 결론을 이끄는 \u003cb class=\"key\">접속부사\u003c/b>이고, burping은 \u003cb class=\"key\">동명사\u003c/b> 주어로 '트림하는 것'을 뜻해요. 결국 트림은 이상한 것이 아니라 \u003cb class=\"key\">정상적\u003c/b>인 생리 현상이라는 글의 중심 생각을 제시하는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사 주어\u003c/span> : [동명사] + [단수 동사] (…하는 것은) : \"트림하는 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">2형식 문장(주어 + be동사 + 주격보어)\u003c/span> : [주어] + is + [형용사(주격보어)] : \"매우 정상적이다\"\u003c/div>\u003c/div>","segs":[{"n":52,"text":"So, 따라서. burping, 트림은. is perfectly normal, 매우 정상적이다. 이 문장 전체를 해석하면, 따라서 트림은 매우 정상적이다.","hl":"m"},{"n":53,"text":"이 문장은 앞 내용을 정리하면서 트림이 전혀 이상한 일이 아니라는 결론을 내려요. So는 앞 내용을 이어 주는 접속부사이고, burping은 동명사 주어로 트림하는 것을 뜻해요. 결국 트림은 정상적이라는 중심 생각을 보여 줘요.","hl":"mn"},{"n":54,"text":"첫 번째로, burping은 동명사 주어예요. 동명사가 주어로 오면 단수로 보고 is를 써요. 두 번째로, is perfectly normal은 이 형식 문장이고, normal은 주어의 상태를 설명하는 주격보어 형용사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 15 / 24\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사실\u003c/span>\u003cspan class=\"en\">In fact,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몇몇 나라에서는\u003c/span>\u003cspan class=\"en\">in some countries,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">음식을 먹은 후에 트림하는 것이 예의이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">polite \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">burp\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">after \u003c/span>\u003cspan class=\"tgt\">eating\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">요리사에게 감사의 뜻을 표하기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">show \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">appreciation\u003c/span> to the cook!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사실 몇몇 나라에서는 요리사에게 감사의 뜻을 표하기 위해 음식을 먹은 후에 트림하는 것이 예의이다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> In fact는 앞의 주장을 뒷받침하는 \u003cb class=\"key\">예시\u003c/b>를 끌어내고, it은 \u003cb class=\"key\">가주어\u003c/b>이며 to burp after eating이 진주어예요. 문화에 따라 트림이 \u003cb class=\"key\">예의\u003c/b>일 수 있음을 보여 주어 '트림은 나쁘지 않다'는 흐름을 강화해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가주어 it과 진주어 to부정사\u003c/span> : It is + [형용사] + to + [동사원형] (…하는 것은 ~하다) : \"트림하는 것은 예의이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 after + 동명사\u003c/span> : after + [동명사] (~한 후에) : \"먹은 후에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : to + [동사원형] (…하기 위해) : \"감사의 뜻을 표하기 위해\"\u003c/div>\u003c/div>","segs":[{"n":55,"text":"In fact, 사실. in some countries, 몇몇 나라에서는. it is polite to burp after eating, 음식을 먹은 후에 트림하는 것이 예의이다. to show your appreciation to the cook!, 요리사에게 감사의 뜻을 표하기 위해. 이 문장 전체를 해석하면, 사실 몇몇 나라에서는 요리사에게 감사의 뜻을 표하기 위해 음식을 먹은 후에 트림하는 것이 예의이다!","hl":"m"},{"n":56,"text":"이 문장은 앞에서 트림이 정상적이라고 한 주장을 뒷받침하는 예시를 보여 줘요. it은 가주어이고, 진짜 주어는 뒤에 오는 to burp after eating이에요. 어떤 문화에서는 트림이 요리사에 대한 예의일 수 있다는 점을 강조합니다.","hl":"mn"},{"n":57,"text":"첫 번째로, it is polite to burp에서 it은 가주어이고 to burp 이하가 진주어예요. 두 번째로, after eating은 전치사 after 뒤에 동명사 eating이 온 표현으로 먹은 후라는 때를 나타내요. 세 번째로, to show your appreciation은 목적을 나타내는 to부정사이고, show your appreciation은 감사의 뜻을 표하다라는 숙어예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 16 / 24\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나,\u003c/span>\u003cspan class=\"en\">However,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">너무 잦은 트림은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">too \u003c/span>\u003cspan class=\"tgt\">much \u003c/span>\u003cspan class=\"tgt\">burping\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~일 수 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당황스러운\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">embarrassing\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 너무 잦은 트림은 당황스러울 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 트림이 자연스럽고 심지어 예의인 나라도 있다고 했지만, \u003cb class=\"key\">However\u003c/b>로 방향을 틀어 문제점을 꺼내는 문장입니다. 트림 자체는 정상이어도 \u003cb class=\"key\">너무 \u003c/b>\u003cb class=\"key\">잦은 \u003c/b>\u003cb class=\"key\">트림\u003c/b>은 당황스러움을 만든다는 뜻으로, 뒤에 이어질 '줄이는 방법'의 필요성을 만들어 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사 주어\u003c/span> : [[동명사 burping]] + 단수 취급 동사(can be) : \"너무 잦은 트림은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 can + be동사원형 + 형용사(2형식)\u003c/span> : 주어 + [[can]] + be + [[주격보어(형용사)]] : \"당황스러울 수 있다\"\u003c/div>\u003c/div>","segs":[{"n":58,"text":"However, 그러나. too much burping, 너무 잦은 트림은. can be, ~일 수 있다. embarrassing, 당황스러운. 이 문장 전체를 해석하면, 그러나 너무 잦은 트림은 당황스러울 수 있다.","hl":"m"},{"n":59,"text":"앞에서 트림은 정상이고 예의인 나라도 있다고 했죠. 그런데 이 문장에서 However로 방향을 틀어요. 트림이 자연스러운 건 맞지만 너무 잦으면 당황스러울 수 있다는 문제를 꺼내는 문장입니다.","hl":"mn"},{"n":60,"text":"첫 번째, too much burping에서 burping은 동명사 주어예요. 그래서 하나의 행위로 보고 단수로 취급해서 뒤에 can be가 옵니다. 두 번째, can be embarrassing은 조동사 can 뒤에 be동사원형이 오고 그 뒤에 주격보어 형용사가 온 구조로, 당황스러운 상태일 수 있다는 가능성을 말해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 17 / 24\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나\u003c/span>\u003cspan class=\"en\">But\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">걱정하지 마라!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003cspan class=\"tgt\">worry\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 걱정하지 말아라!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 '너무 잦은 트림은 당황스럽다'고 걱정을 만들었죠. 바로 그래서 \u003cb class=\"key\">But\u003c/b>으로 받아 \u003cb class=\"key\">걱정하지 \u003c/b>\u003cb class=\"key\">말라\u003c/b>고 안심시키는 문장입니다. 이어서 트림을 줄이는 방법을 알려주겠다는 신호 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정 명령문\u003c/span> : [[Don't]] + [[동사원형]] : \"걱정하지 마라\"\u003c/div>\u003c/div>","segs":[{"n":61,"text":"But, 그러나. don't worry!, 걱정하지 마라!. 이 문장 전체를 해석하면, 하지만 걱정하지 말아라!","hl":"m"},{"n":62,"text":"앞에서 너무 잦은 트림은 당황스럽다고 걱정을 만들어 놓았죠. 그래서 But으로 받아서 걱정하지 말라고 안심시켜 주는 거예요. 곧바로 해결 방법을 알려주겠다는 다짐이기도 합니다.","hl":"mn"},{"n":63,"text":"don't worry는 부정 명령문이에요. 명령문은 동사원형으로 시작하는데, 그 앞에 don't를 붙이면 '~하지 마라'라는 뜻이 됩니다. 그래서 여기서는 상대를 안심시키는 짧은 명령 표현으로 쓰였어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 18 / 24\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여기 있습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Here \u003c/span>\u003cspan class=\"tgt\">are\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몇 가지 방법들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">some \u003c/span>\u003cspan class=\"tgt\">ways \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">트림을 하기 위한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">burp\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">덜 자주\u003c/span>\u003cspan class=\"en\">less often.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">트림을 덜 자주 하는 몇 가지 방법이 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞으로 나올 해결책 세 가지를 미리 예고하는 \u003cb class=\"key\">안내 \u003c/b>\u003cb class=\"key\">문장\u003c/b>입니다. Here are로 시작해 목록을 제시하고, 바로 뒤에 First, Second, Third가 이어지죠. 글의 흐름에서 '방법 제시' 부분의 \u003cb class=\"key\">주제문\u003c/b> 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">도치 구문(Here + 동사 + 주어)\u003c/span> : [[Here]] + 동사 + [[주어]] : \"여기 ~이 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : [[명사(ways)]] + to + [[동사원형]] : \"트림하기 위한 방법들\"\u003c/div>\u003c/div>","segs":[{"n":64,"text":"Here are, 여기 있습니다. some ways, 몇 가지 방법들이. to burp, 트림을 하기 위한. less often, 덜 자주. 이 문장 전체를 해석하면, 트림을 덜 자주 하는 몇 가지 방법이 있다.","hl":"m"},{"n":65,"text":"이 문장은 앞으로 나올 세 가지 해결책을 미리 알려주는 안내 문장이에요. Here are로 시작해서 목록을 펼치겠다고 신호를 주는 거죠. 바로 뒤에 First, Second, Third가 이어지니까 이 문장을 주제문으로 잡으면 됩니다.","hl":"mn"},{"n":66,"text":"첫 번째, Here are는 주어와 동사의 순서가 뒤집힌 도치 구문이에요. 진짜 주어는 are 뒤에 있는 some ways이고, 해석은 '몇 가지 방법이 여기 있다' 순서로 해요. 두 번째, to burp는 to부정사의 형용사적 용법으로 앞의 명사 ways를 꾸며 줍니다. 그래서 '트림하기 위한 방법'이라고 해석하는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 19 / 24\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">첫째,\u003c/span>\u003cspan class=\"en\">First,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">말하지 말아라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003cspan class=\"tgt\">talk\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">입에 음식물을 가득 채운 채로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">mouth \u003c/span>\u003cspan class=\"tgt\">full\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">첫째, 입에 음식물을 가득 채운 채로 말하지 말아라.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 트림을 덜 하기 위한 첫 번째 방법을 제시하는 문장입니다. 입안에 음식이 가득한 상태에서 말을 하면 공기를 더 많이 들이마시게 되므로, 그것을 피하라는 \u003cb class=\"key\">조언\u003c/b>인 것이죠. \u003cb class=\"key\">입에 \u003c/b>\u003cb class=\"key\">음식\u003c/b>을 물고 말하는 습관이 트림의 원인이 된다는 흐름을 이어 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정 명령문\u003c/span> : [[Do not]]/Don't + [동사원형] ~ : \"말하지 말아라\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">with + 목적어 + 형용사(부대상황)\u003c/span> : with + [목적어] + [형용사(목적격 보어)] : \"입에 음식물을 가득 채운 채로\"\u003c/div>\u003c/div>","segs":[{"n":67,"text":"First, 첫째. don't talk, 말하지 말아라. with your mouth full, 입에 음식물을 가득 채운 채로. 이 문장 전체를 해석하면, 첫째, 입에 음식물을 가득 채운 채로 말하지 말아라.","hl":"m"},{"n":68,"text":"이 문장은 트림을 덜 하는 첫 번째 방법을 제시해요. 입에 음식을 가득 넣은 채로 말하면 공기를 더 많이 삼키게 되니까, 그걸 피하라는 조언이죠.","hl":"mn"},{"n":69,"text":"먼저 don't talk는 부정 명령문이에요. Do not이나 Don't 뒤에는 반드시 동사원형이 온다는 점을 기억하세요. 그리고 with your mouth full은 with 뒤에 목적어 your mouth와 형용사 full이 붙어서 입에 음식물을 가득 채운 채로라는 동시 상황을 나타내는 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 20 / 24\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">말하는 동시에 먹는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Talking \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">eating \u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">same \u003c/span>\u003cspan class=\"tgt\">time\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하게 한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">makes \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 더 많은 공기를 삼키게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">swallow\u003c/span> more air.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">말하는 동시에 먹는 것은 당신이 더 많은 공기를 삼키게 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 제시한 첫 번째 방법이 왜 필요한지 \u003cb class=\"key\">이유\u003c/b>를 밝히는 문장입니다. 말하면서 동시에 먹으면 공기를 더 많이 \u003cb class=\"key\">삼키기\u003c/b> 때문에 트림이 늘어난다는 원리를 설명하죠. 즉 앞 문장의 조언과 원인·결과로 단단히 연결되어 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사구 주어\u003c/span> : [동명사 003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 계속 트림하게 할 수 있어요\u003c/span>\u003cspan class=\"en\">may \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">keep \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">burping\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몇 시간 동안\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">hours\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">탄산음료 캔 하나에는 1,800만 개 이상의 공기 방울이 들어 있기 때문에, 캔 하나를 마시는 것은 당신이 몇 시간 동안 트림을 하게 할 수 있다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 탄산음료가 트림을 오래 부르는 이유를 알려 주는 문장이에요. 캔 하나에 공기 방울이 1,800만 개 이상 들어 있어서, 그것을 마시면 몇 시간 동안 계속 \u003cb class=\"key\">트림\u003c/b>을 하게 될 수 있어요. 앞 문장의 '탄산음료를 끊어라'에 확실한 \u003cb class=\"key\">근거\u003c/b>를 붙여 주는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 since (이유)\u003c/span> : Since + [주어 + 동사 ~], [주절] : \"탄산음료 캔 하나에는 … 공기 방울이 들어 있기 때문에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사구의 주어\u003c/span> : [동명사(구) = 주어] + [조동사 + 동사원형] : \"그것을 마시는 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">keep + 목적어 + 현재분사(목적격 보어)\u003c/span> : keep + [목적어 you] + [현재분사 burping(목적격 보어)] : \"당신이 계속 트림하게 하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">전치사 for (기간)\u003c/span> : for + [기간을 나타내는 명사] : \"몇 시간 동안\"\u003c/div>\u003c/div>","segs":[{"n":82,"text":"Since one can of soda, 탄산음료 캔 하나에는. has over 18 million air bubbles, 1,800만 개 이상의 공기 방울을 가지고 있기 때문에. in it, 그 안에. drinking it, 그것을 마시는 것은. may keep you burping, 당신이 계속 트림하게 할 수 있어요. for hours!, 몇 시간 동안. 이 문장 전체를 해석하면, 탄산음료 캔 하나에는 1,800만 개 이상의 공기 방울이 들어 있기 때문에, 캔 하나를 마시는 것은 당신이 몇 시간 동안 트림을 하게 할 수 있다!","hl":"m"},{"n":83,"text":"이 문장은 탄산음료를 마시면 왜 트림이 계속되는지 그 이유를 숫자로 보여 주고 있어요. 캔 하나에 공기 방울이 천팔백만 개가 넘게 들어 있어서, 그걸 마시면 위에 공기가 잔뜩 쌓여 몇 시간 동안 계속 트림을 하게 되는 거예요. 그래서 앞에서 탄산음료를 끊으라고 한 말에 확실한 근거를 붙여 주는 문장이에요.","hl":"mn"},{"n":84,"text":"먼저 첫 번째로 Since one can of soda has over eighteen million air bubbles in it에서 since는 이유를 나타내는 접속사예요. 뒤에 주어와 동사가 갖춰진 절이 통째로 와서 왜냐하면이라는 이유를 만들어 주죠. 두 번째로 drinking it은 동명사구가 주어로 나온 형태이고, 동명사구는 하나의 명사 덩어리라서 단수 취급을 해요. 세 번째로 keep you burping은 keep이 목적어 you 뒤에 현재분사 burping을 목적격 보어로 데리는 구조예요. you가 계속 트림하는 능동 관계이기 때문에 ing 형태가 온 거예요. 네 번째로 for hours는 for가 기간을 나타내서 몇 시간 동안이라는 뜻을 더해 줘요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>트림은 위에서 \u003cb class=\"key\">빠져나오는 \u003c/b>\u003cb class=\"key\">공기\u003c/b>가 목구멍 뒤쪽의 얇은 근육을 급하게 지나며 나는 소리로, \u003cb class=\"key\">멈추기 \u003c/b>\u003cb class=\"key\">어렵다\u003c/b>.\u003c/li>\u003cli>사람은 모르는 사이에 매시간 \u003cb class=\"key\">1리터의 \u003c/b>\u003cb class=\"key\">공기\u003c/b>를 삼키고 먹고 마실 때는 더 많이 삼키므로 트림은 \u003cb class=\"key\">정상적\u003c/b>인 현상이다.\u003c/li>\u003cli>몇몇 나라에서는 요리사에게 \u003cb class=\"key\">감사\u003c/b>를 표하는 예의이지만, \u003cb class=\"key\">너무 \u003c/b>\u003cb class=\"key\">잦은 \u003c/b>\u003cb class=\"key\">트림\u003c/b>은 당황스러울 수 있다.\u003c/li>\u003cli>입에 음식을 가득 채운 채 말하지 않고 \u003cb class=\"key\">천천히\u003c/b> 먹으며 \u003cb class=\"key\">탄산음료\u003c/b>를 줄이면 트림을 덜 자주 할 수 있다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Burping is a perfectly normal reaction of your body, but you can burp less often by swallowing less air, for example by not talking with your mouth full, eating slowly, and stopping drinking soda.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">트림은 위에서 빠져나오는 공기의 소리로 매우 정상적인 현상이지만, \u003cb class=\"key\">공기를 \u003c/b>\u003cb class=\"key\">많이 \u003c/b>\u003cb class=\"key\">삼키면\u003c/b> 너무 잦은 트림이 \u003cb class=\"key\">당황스러울\u003c/b> 수 있다. 그래서 입에 음식을 가득 채운 채 말하지 않기, \u003cb class=\"key\">천천히\u003c/b> 먹기, \u003cb class=\"key\">탄산음료\u003c/b> 줄이기 같은 방법으로 트림을 덜 자주 할 수 있다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":85,"text":"오늘 글은 트림이라는 아주 익숙한 현상을 질문으로 풀어낸 글이었어요. 트림은 위에서 나오는 공기의 소리라서 멈추기 어렵고, 공기를 많이 삼킬수록 자주 나온다는 것, 기억나시죠? 입을 다물고 천천히 먹고 탄산음료를 줄이면 트림도 줄어든다는 점까지 꼭 챙겨 가세요. 오늘도 수고 많았습니다.","hl":null}]}]});</script></body></html>
