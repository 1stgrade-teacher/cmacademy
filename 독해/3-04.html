3,"text":"두 번째 문제. 번개가 비행기 안쪽으로 들어와서 사람들에게 위험해요. 맞으면 O, 틀리면 X예요.","hl":"q1"},{"n":114,"text":"정답은 X, 틀려요.","hl":"q1","rv":"q1"},{"n":115,"text":"세 번째 문제. 번개는 비행기의 어느 부분으로 들어가나요? 첫 번째, 꼬리. 두 번째, 앞부분(코). 세 번째, 날개","hl":"q2"},{"n":116,"text":"정답은 앞부분(코)예요.","hl":"q2","rv":"q2"},{"n":117,"text":"네 번째 문제. 알루미늄은 무엇을 보호해 주나요? 첫 번째, 엔진과 연료 탱크. 두 번째, 바퀴와 창문. 세 번째, 조종사","hl":"q3"},{"n":118,"text":"정답은 엔진과 연료 탱크예요.","hl":"q3","rv":"q3"}]},{"html":"\u003cspan class=\"lp-tag\">이야기 요약하기\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-bank\">\u003cspan>hits\u003c/span>\u003cspan>inside\u003c/span>\u003cspan>protects\u003c/span>\u003cspan>tail\u003c/span>\u003c/div>\u003cdiv class=\"k-sum\" data-hl=\"sm\">Lightning \u003cspan class=\"k-ans\" data-rv=\"sm\">hits\u003c/span> airplanes every year, but nothing happens \u003cspan class=\"k-ans\" data-rv=\"sm\">inside\u003c/span> the plane. Lightning goes in the nose and out the \u003cspan class=\"k-ans\" data-rv=\"sm\">tail\u003c/span>. Aluminum sends it into the air and \u003cspan class=\"k-ans\" data-rv=\"sm\">protects\u003c/span> the engine and fuel tank.\u003c/div>\u003cdiv class=\"k-sk\">번개는 매년 비행기에 내리치지만, 비행기 안에서는 아무 일도 일어나지 않아요. 번개는 앞부분으로 들어와 꼬리로 빠져나가요. 알루미늄은 번개를 공중으로 보내고 엔진과 연료 탱크를 보호해 줘요.\u003c/div>\u003c/div>","segs":[{"n":119,"text":"마지막으로 오늘 이야기를 짧게 정리해 볼게요. 번개가 내리쳐도 비행기 안은 안전하다는 것, 알루미늄이 우리를 지켜 준다는 것을 꼭 기억해요.","hl":null},{"n":120,"text":"Lightning hits airplanes every year, but nothing happens inside the plane. Lightning goes in the nose and out the tail. Aluminum sends it into the air and protects the engine and fuel tank.","hl":"sm","rv":"sm","v":"n"},{"n":121,"text":"번개는 매년 비행기에 내리치지만, 비행기 안에서는 아무 일도 일어나지 않아요. 번개는 앞부분으로 들어와 꼬리로 빠져나가요. 알루미늄은 번개를 공중으로 보내고 엔진과 연료 탱크를 보호해 줘요.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>Airplanes and Lightning 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":122,"text":"오늘 여러
