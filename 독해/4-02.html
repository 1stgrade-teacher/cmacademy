"k-ans\" data-rv=\"q2\">부유한 사람들\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q3\">\u003ci>4\u003c/i>\u003cdiv>\u003cdiv class=\"q\">설탕 가격이 내려간 후 사람들은 무엇을 만들었나요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 디저트 요리책\u003c/span>\u003cspan>② 과일 주스\u003c/span>\u003cspan>③ 설탕 공장\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q3\">디저트 요리책\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":98,"text":"이제 문제를 풀어 볼까요? 지문을 다시 보면서 답을 찾아보세요.","hl":null},{"n":99,"text":"첫 번째 문제. 오늘날의 디저트와 옛날의 디저트는 같았습니다. 맞으면 O, 틀리면 X예요.","hl":"q0"},{"n":100,"text":"정답은 X, 틀려요.","hl":"q0","rv":"q0"},{"n":101,"text":"두 번째 문제. 중세 시대에 커스터드가 최초의 디저트였습니다. 맞으면 O, 틀리면 X예요.","hl":"q1"},{"n":102,"text":"정답은 O, 맞아요.","hl":"q1","rv":"q1"},{"n":103,"text":"세 번째 문제. 설탕이 비쌀 때 달콤한 음식을 먹을 수 있었던 사람은 누구인가요? 첫 번째, 부유한 사람들. 두 번째, 모든 사람들. 세 번째, 아이들","hl":"q2"},{"n":104,"text":"정답은 부유한 사람들예요.","hl":"q2","rv":"q2"},{"n":105,"text":"네 번째 문제. 설탕 가격이 내려간 후 사람들은 무엇을 만들었나요? 첫 번째, 디저트 요리책. 두 번째, 과일 주스. 세 번째, 설탕 공장","hl":"q3"},{"n":106,"text":"정답은 디저트 요리책예요.","hl":"q3","rv":"q3"}]},{"html":"\u003cspan class=\"lp-tag\">이야기 요약하기\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-bank\">\u003cspan>desserts\u003c/span>\u003cspan>expensive\u003c/span>\u003cspan>fruit\u003c/span>\u003cspan>price\u003c/span>\u003c/div>\u003cdiv class=\"k-sum\" data-hl=\"sm\">Long ago, dessert was \u003cspan class=\"k-ans\" data-rv=\"sm\">fruit\u003c/span> and nuts with honey. Later, sugar was very \u003cspan class=\"k-ans\" data-rv=\"sm\">expensive\u003c/span>, so only rich people could eat sweet food. Then the \u003cspan class=\"k-ans\" data-rv=\"sm\">price\u003c/span> of sugar went down, and more people could enjoy \u003cspan class=\"k-ans\" data-rv=\"sm\">desserts\u003c/span>.\u003c/div>\u003cdiv class=\"k-sk\">옛날 디저트는 과일과 견과류, 꿀이었어요. 나중에 설탕은 아주 비싸서 부유한 사람들만 달콤한 음식을 먹을 수 있었어요. 그런데 설탕 가격이 내려가면서 더 많은 사람들이 디저트를 즐길 수 있게 되었어요.\u003c/div>\u003c/div>","segs":[{"n":107,"text":"마지막으로 이야기를 짧게 정리해 볼게요. 옛날 디저트는 과일과 꿀에서 시작했고, 설탕이 비쌀 때는 부유한 사람들만 달콤한 음식을 먹을 수 있었지만, 나중에는 더 많은 사람들이 디저트를 즐길 수 있게 되었어요.","hl":null},{"n":108,"text":"Long ago, dessert was fruit and nuts with honey. Later, sugar was very expensive, so only rich people could eat sweet food. Then the price of sugar went down, and more people could enjoy desserts.","hl":"sm","rv":"sm","v":"n"},{"n":109,"text":"옛날 디저트는 과일과 견과류, 꿀이었어요. 나중에 설탕은 아주 비싸서 부유한 사람들만 달콤한 음식을 먹을 수 있었어요. 그런데 설탕 가격이 내려가면서 더 많은 사람들이 디저트를 즐길 수 있게 되었어요.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>Sweet Food 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":110,"text":"여러분, 오늘 달콤한 음식의 역사를 아주 잘 읽었어요! 이제 여러분도 친구에게 옛날 디저트 이야기를 들려줄 수 있겠죠? 정말 멋졌어요, 다음 시간에 또 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
