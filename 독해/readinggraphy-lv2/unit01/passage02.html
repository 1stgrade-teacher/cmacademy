tage-3\"><div class=\"lec-stage-head\">04축제의 의미</div><ul><li>괴물 역할은 신체적 고통을 동반함에도 불구하고 마을에서 매우 명예롭게 여겨진다.</li><li>신체적 대가: 결국 온몸에 멍(bruises)이 생김</li><li>사회적 위상: 마을 사람들은 괴물 역할을 큰 영광(big honor)으로 간주함</li><li>열기: 역할을 맡기 위한 대기자가 2,000명 이상임</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">take place</td><td class=\"m\">일어나다, 개최되다</td></tr><tr><td class=\"w\">chase</td><td class=\"m\">뒤쫓다, 추적하다</td></tr><tr><td class=\"w\">decorate</td><td class=\"m\">장식하다, 꾸미다</td></tr><tr><td class=\"w\">underneath</td><td class=\"m\">~의 아래에, 밑에</td></tr><tr><td class=\"w\">avoid</td><td class=\"m\">피하다, 방지하다</td></tr><tr><td class=\"w\">be based on</td><td class=\"m\">~에 근거하다, ~을 바탕으로 하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">act as</td><td class=\"m\">~의 역할을 하다, ~로서 행동하다</td></tr><tr><td class=\"w\">chase away</td><td class=\"m\">쫓아버리다, 내쫓다</td></tr><tr><td class=\"w\">in the end</td><td class=\"m\">결국, 마침내</td></tr><tr><td class=\"w\">honor</td><td class=\"m\">명예, 영광</td></tr><tr><td class=\"w\">waiting list</td><td class=\"m\">대기자 명단</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">매년 1월 19일과 20일에,</span><span class=\"en\"><b>Every year on January 19th and 20th,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Jarramplas 축제는</span><span class=\"en\"><b>the Jarramplas Festival</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">열린다</span><span class=\"en\"><b><span class=\"grammar-hl\">takes place</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">스페인 Piornal에서</span><span class=\"en\"><b>in Piornal, Spain.</b></span></div></div><div class=\"lec-sent-ko\">매년 1월 19일과 20일에, 스페인의 Piornal에서는 Jarramplas 축제가 열린다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 글의 주제인 자람플라스 축제가 언제 어디서 시작되는지 배경 정보를 제공하며 전체 내용을 도입하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">takes place (관용표현): occur/happen의 의미를 가진 숙어로, 특정 장소에서 행사가 열림을 나타냄</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 축제 기간 동안,</span><span class=\"en\"><b>During this festival,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">마을의 모든 사람들은</span><span class=\"en\"><b>everyone in town</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">쫓아다니며 순무를 던진다</span><span class=\"en\"><b><span class=\"grammar-hl\">chases and throws</span> turnips</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">두 몬스터에게</span><span class=\"en\"><b>at two monsters.</b></span></div></div><div class=\"lec-sent-ko\">이 축제 기간 동안, 마을의 모든 사람들은 몬스터 두 마리를 쫓아다니며 순무를 던진다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급된 축제의 구체적인 활동 방식을 보여주며, 독자의 호기심을 유발하는 중심 행위를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">chases and throws (병렬구조): 주어 everyone에 연결된 일반동사들의 나열로, 현재 시제로 반복적인 축제 상황을 설명</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">chase</td><td class=\"m\">뒤쫓다, 추적하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그래서,</span><span class=\"en\"><b>So,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">누구인가</span><span class=\"en\"><b><span class=\"grammar-hl\">who</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 몬스터들은?</span><span class=\"en\"><b><span class=\"grammar-hl\">are the monsters?</span></b></span></div></div><div class=\"lec-sent-ko\">그럼, 그 몬스터들은 누구일까?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자가 가질 법한 의문을 대신 제기함으로써 내용의 흐름을 &#39;괴물의 정체&#39;라는 다음 단계로 자연스럽게 전환합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">who are the monsters? 간접의문문의 원형인 의문문: 의문사 who를 문두에 쓰고 be동사를 주어 앞으로 도치한 기본 의문문 구조</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">마을의 두 사람이</span><span class=\"en\"><b>Two people from the village</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">역할을 한다</span><span class=\"en\"><b><span class=\"grammar-hl\">act as</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">몬스터로서의</span><span class=\"en\"><b>the monsters.</b></span></div></div><div class=\"lec-sent-ko\">마을의 두 사람이 몬스터 역할을 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 질문에 대해 괴물이 실재하는 존재가 아니라 마을 주민임을 밝혀 실체를 구체화합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">act as (관용표현): &#39;~의 역할을 하다/행세하다&#39;라는 의미의 구동사</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">act as</td><td class=\"m\">~의 역할을 하다, ~로서 행동하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은</span><span class=\"en\"><b>They</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">의상을 입는다</span><span class=\"en\"><b>wear costumes</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 화려한 천 조각들로 장식된</span><span class=\"en\"><b><span class=\"grammar-hl\">decorated with</span> lots of colorful pieces of cloth.</b></span></div></div><div class=\"lec-sent-ko\">그들은 많은 수의 화려한 천 조각들로 장식된 의상을 입는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 괴물 역할의 외양을 묘사함으로써, 축제의 시각적인 특징을 상세히 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">decorated with (과거분사(형용사)): decorated가 앞의 명사 costumes를 수식(= &#39;장식된 의상&#39;). costumes that are decorated with... 구조에서 관계대명사와 be동사가 생략된 축약된 형태</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">decorate</td><td class=\"m\">장식하다, 꾸미다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 의상 밑에,</span><span class=\"en\"><b>Underneath these costumes,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은</span><span class=\"en\"><b>they</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">특별한 보호 장치를 착용한다</span><span class=\"en\"><b>wear special protection</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다치는 것을 피하기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to avoid</span> <span class=\"grammar-hl\">getting hurt</span>.</b></span></div></div><div class=\"lec-sent-ko\">이 의상 안에, 그들은 다치지 않기 위해 특별한 보호 장치를 착용한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 2번 문장에서 언급한 &#39;순무를 던지는 행위&#39;가 위험할 수 있음을 인식하고, 안전을 위한 조치가 마련되어 있음을 알려줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to avoid (to부정사): 부사적 용법(목적)으로 &#39;~하기 위해서&#39;라는 의미를 나타냄</div><div class=\"lec-gr-item\">getting hurt (동명사): 전치사 &#39;to&#39;의 목적어 역할을 하며, hurt(다치다)라는 상태를 수동의 의미로 표현</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">underneath</td><td class=\"m\">~의 아래에, 밑에</td></tr><tr><td class=\"w\">avoid</td><td class=\"m\">피하다, 방지하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 축제는</span><span class=\"en\"><b>The festival</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">바탕을 둔다</span><span class=\"en\"><b><span class=\"grammar-hl\">is based on</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">현지의 이야기에</span><span class=\"en\"><b>a local story.</b></span></div></div><div class=\"lec-sent-ko\">그 축제는 현지의 이야기에 바탕을 두고 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 축제가 단순히 즐기는 행사가 아니라, 특정 유래를 가진 전통임을 언급하여 행위의 명분을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is based on (수동태): be동사(is)+p.p.(based) 구조. base는 타동사인데 목적어가 없어서 수동구조 is based on 형태로 쓴다. 기본구조: base A on B (A를 B에 근거를 두다)</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">몬스터들은</span><span class=\"en\"><b>The monsters</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">역할을 한다</span><span class=\"en\"><b>act as</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">el Jarrampla라는 이름의 도둑으로서의</span><span class=\"en\"><b>the thief <span class=\"grammar-hl\">named el Jarrampla</span>.</b></span></div></div><div class=\"lec-sent-ko\">몬스터들은 el Jarrampla라는 이름의 도둑 역할을 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 4번 문장에서 소개한 괴물의 구체적인 배역을 설명하며 전설 속 등장인물과 연결합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">named el Jarrampla (과거분사(형용사)): named가 앞의 명사 thief를 수식(= &#39;el Jarrampla라고 불리는 도둑&#39;). thief who is named el Jarrampla에서 주격관계대명사와 be동사가 생략된 축약 관계절</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">act as</td><td class=\"m\">~의 역할을 하다, ~로서 행동하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 이야기에서,</span><span class=\"en\"><b>In the story,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 도둑은</span><span class=\"en\"><b>the thief</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">동물을 훔쳤다</span><span class=\"en\"><b><span class=\"grammar-hl\">stole</span> animals</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">농부들로부터</span><span class=\"en\"><b>from the farmers.</b></span></div></div><div class=\"lec-sent-ko\">그 이야기에서, 도둑은 농부들에게서 동물을 훔쳤다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 전설의 내용을 상세히 풀어서 왜 마을 사람들이 그를 쫓아냈는지 인과관계를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">stole (일반동사): 과거 시제를 사용하여 이야기 속의 사건을 서술</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그를 쫓아내기 위해,</span><span class=\"en\"><b><span class=\"grammar-hl\">To chase him away</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">농부들은</span><span class=\"en\"><b>the farmers</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">순무를 던졌다</span><span class=\"en\"><b>threw turnips</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그에게</span><span class=\"en\"><b>at him.</b></span></div></div><div class=
