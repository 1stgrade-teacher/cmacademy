class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02오해와 공격</div><ul><li>조깅하던 사람이 실수로 수달을 밟자, 수달들은 스티브를 위협 요소로 오해한다.</li><li>조깅하던 사람의 실수로 발생한 사고</li><li>수달들이 놀라고 화가 남(angry and scared)</li><li>스티브를 공격자로 간주하여 다리를 물기 시작함</li><li>핵심 키워드: 오해(misunderstanding)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03필사의 탈출</div><ul><li>공격을 피하기 위해 스티브는 나무 위로 올라가야만 했다.</li><li>수달들의 공격을 막아낼 수 없었음</li><li>나무에 올라가 피신(climbed a tree)</li><li>수달들이 물속으로 돌아갈 때까지 대기</li><li>핵심 키워드: 피신(escape)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04교훈</div><ul><li>스티브는 귀여워 보이는 야생 동물이라도 언제나 주의해야 함을 깨닫는다.</li><li>야생 동물을 대할 때의 경각심</li><li>외형의 귀여움에 현혹되지 말 것</li><li>이번 경험을 통해 얻은 교훈(lesson)</li><li>핵심 키워드: 야생 동물(wild animals)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">look at</td><td class=\"m\">~을 보다, ~을 자세히 살피다</td></tr><tr><td class=\"w\">accidentally</td><td class=\"m\">우연히, 실수로</td></tr><tr><td class=\"w\">danger</td><td class=\"m\">위험, 위협</td></tr><tr><td class=\"w\">at last</td><td class=\"m\">마침내, 드디어</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">get away from</td><td class=\"m\">~에서 도망치다, ~에서 벗어나다</td></tr><tr><td class=\"w\">calm down</td><td class=\"m\">진정하다, 가라앉다</td></tr><tr><td class=\"w\">learn a lesson</td><td class=\"m\">교훈을 얻다, 경험을 통해 배우다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">싱가포르의 한 공원에서,</span><span class=\"en\"><b>In a park in Singapore,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Steve라는 이름의 한 남성은</span><span class=\"en\"><b>a man <span class=\"grammar-hl\">named</span> Steve</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아침 산책을 하러 갔다.</span><span class=\"en\"><b>went for a morning walk.</b></span></div></div><div class=\"lec-sent-ko\">싱가포르에 있는 한 공원에서, Steve라는 이름의 한 남성은 아침 산책을 하러 갔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 글의 주인공인 스티브가 평범한 일상을 보내던 중 사건이 시작되는 장소와 배경을 소개합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">named (과거분사(형용사)): named가 Steve를 수식(= &#39;Steve라는 이름의&#39;)하며, N + p.p. 구조로 &#39;p.p.된 N&#39;의 의미를 나타냄</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">아직 어둡고 조용했다.</span><span class=\"en\"><b>It was <span class=\"grammar-hl\">still</span> dark and quiet.</b></span></div></div><div class=\"lec-sent-ko\">아직 어둡고 조용했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 산책 상황을 보충하여, 사람들의 통행이 적고 다소 긴장감이 조성될 수 있는 시간대임을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">still (관용표현): 부사로 쓰여 &#39;여전히&#39;라는 의미로 상태의 지속을 나타냄</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그가 걷고 있는 동안,</span><span class=\"en\"><b><span class=\"grammar-hl\">While he was walking</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는 약 스무 마리의 털이 있는 동물들을 보았다</span><span class=\"en\"><b>he saw about 20 furry animals</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">물 근처에서</span><span class=\"en\"><b>near the water.</b></span></div></div><div class=\"lec-sent-ko\">그가 걷고 있는 동안, 그는 물 근처에서 약 스무 마리의 털로 덮인 동물들을 보았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 스티브가 예상치 못한 동물을 발견하며 다음 사건으로 이어지는 연결 고리 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">While he was walking (분사구문(축약)): While he was walking은 &#39;접속사 + S + be + V-ing&#39; 구조의 부사절이며, 시간의 흐름(…하는 동안에)을 나타냄</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것들은 수달이었다!</span><span class=\"en\"><b><span class=\"grammar-hl\">They were otters</span>!</b></span></div></div><div class=\"lec-sent-ko\">그것들은 수달이었다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 발견한 동물이 무엇인지 구체적으로 밝히며, 독자의 주의를 집중시킵니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">They were otters 2형식 구조: S(They) + V(were) + C(otters)의 형태로, 주어의 상태나 정체를 설명함</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 잠시 멈췄고</span><span class=\"en\"><b>He stopped for a moment</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가까이 다가갔다</span><span class=\"en\"><b>and got close</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 귀여운 동물들을 보기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to look at</span> the cute animals.</b></span></div></div><div class=\"lec-sent-ko\">그는 그 귀여운 동물들을 보기 위해 잠시 멈추고 가까이 다가갔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 스티브가 호기심에 이끌려 무방비하게 야생 동물에게 접근하는 행동을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to look at to부정사(부사적 용법): 목적을 나타내며 &#39;~하기 위해서&#39;라는 의미로 쓰임</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">look at</td><td class=\"m\">~을 보다, ~을 자세히 살피다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">갑자기,</span><span class=\"en\"><b>Suddenly,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">조깅하는 사람 하나가 달려 지나갔고,</span><span class=\"en\"><b>a jogger <span class=\"grammar-hl\">ran by</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는 실수로 수달 한 마리를 밟았다.</span><span class=\"en\"><b>and he accidentally stepped on an otter.</b></span></div></div><div class=\"lec-sent-ko\">갑자기, 조깅하는 사람 하나가 달리며 지나갔는데, 그는 수달 한 마리를 실수로 밟았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 평화로웠던 상황이 외부 요인에 의해 급격히 긴박한 상태로 전환되는 결정적 사건입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">ran by (관용표현): &#39;옆을 지나쳐 달려가다&#39;라는 의미의 구동사</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">accidentally</td><td class=\"m\">우연히, 실수로</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">다른 수달들은</span><span class=\"en\"><b>The other otters</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">화가 났고 겁을 먹었다.</span><span class=\"en\"><b>got <span class=\"grammar-hl\">angry and scared</span>.</b></span></div></div><div class=\"lec-sent-ko\">다른 수달들은 화가 났고 겁을 먹었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 사고로 인해 수달들이 공격적인 태도로 돌변하게 된 원인을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">angry and scared 2형식 구조: S(The other otters) + V(got) + C(angry and scared)로, get은 여기서 &#39;~한 상태가 되다&#39;라는 변화의 의미로 쓰임</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">수달들은 Steve 역시 위험한 존재라고 생각했고,</span><span class=\"en\"><b>The otters thought Steve was a danger too,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그래서 그들은 그를 향해 달려들었다</span><span class=\"en\"><b>so they ran toward him</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그의 발목과 다리를 물기 시작했다.</span><span class=\"en\"><b>and started <span class=\"grammar-hl\">biting</span> his ankles and legs.</b></span></div></div><div class=\"lec-sent-ko\">수달들은 Steve 역시 위험한 사람이라고 생각해서, 그를 향해 달려들었고 그의 발목과 다리를 물기 시작했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 스티브가 아무런 잘못을 하지 않았음에도 오해를 받아 수달들의 공격 대상이 되었음을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">biting (현재분사): started의 목적어로 쓰인 동명사와 달리, 진행 중인 동작을 강조하거나 주어의 상태를 서술하는 현재분사적 성격을 띰</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">danger</td><td class=\"m\">위험, 위협</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Steve는 그것들을 막으려 노력했지만,</span><span class=\"en\"><b>Steve <span class=\"grammar-hl\">tried to stop</span> them,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는 할 수 없었다.</span><span class=\"en\"><b>but he <span class=\"grammar-hl\">couldn’t</span>.</b></span></div></div><div class=\"lec-sent-ko\">Steve는 그것들을 막으려고 노력했지만, 그럴 수 없었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 상황을 통제하기 어려운 절박한 처지에 놓인 주인공의 모습을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">tried to stop (to부정사): 동사 try의 목적어로 쓰인 명사적 용법으로 &#39;~하려고 노력하다&#39;라는 의미를 가짐</div><div class=\"lec-gr-item\">couldn’t 대동사(do/does/did의 조동사 형태): 앞의 동사구(stop them)를 대신하여 반복을 피함. 앞의 동사가 일반동사이면 do[does, did]를 쓴다</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">마침내,</span><span class=\"en\"><b>At last,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Steve는 나무에 올라갔다</span><span class=\"en\"><b>Steve climbed a tree</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">화가 난 수달들로부터 도망치기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to get away</span> from the angry otters.</b></span></div></div><div class=\"lec-sent-ko\">마침내, Steve는 화가 난 수달들로부터 도망치기 위해 나무에 올라갔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 공격을 피하기 위한 최후의 수단으로 나무를 선택한 상황입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to get away to부정사(부사적 용법): 목적을 나타내며 &#39;도망치기 위해서&#39;라는 의미로 쓰임</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">at last</td><td class=\"m\">마침내, 드디어</td></tr><tr><td class=\"w\">get away from</td><td class=\"m\">~에서 도망치다, ~에서 벗어나다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 11 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 그곳에 머물렀다</span><span class=\"en\"><b>He stayed there</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수달들이 진정하고</span><span class=\"en\"><b><span class=\"grammar-hl\">until the otters calmed down</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">물로 돌아가기 전까지</span><span class=\"en\"><b><span class=\"grammar-hl\">and went back</span> to the water.</b></span></div></div><div class=\"lec-sent-ko\">그는 수달들이 진정하고 물로 돌아가기 전까지 그곳에 머물렀다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 위험 상황이 해소되는 과정을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">until the otters calmed down and went back (관계부사(접속사)): until은 시간의 관계를 나타내는 접속사로, 주어+동사가 갖춰진 절을 이끎</div></div>\n        ","<div class=\"lec-sent-no\">문장 12 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Steve는 그날 교훈을 얻었다:</span><span class=\"en\"><b>Steve learned <span class=\"grammar-hl\">a lesson that</span> day:</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">항상 조심하라 야생 동물 주변에서는,</span><span class=\"en\"><b>always be careful around wild animals,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">비록 그것들이 귀여워 보일지라도</span><span class=\"en\"><b><span class=\"grammar-hl\">even if they look cute</span>.</b></span></div></div><div class=\"lec-sent-ko\">Steve는 그날 교훈을 얻었다: 야생 동물이 귀여워 보일지라도 야생 동물 주변에서는 항상 조심해라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 글 전체를 관통하는 주제로, 경험을 통해 깨달은 주의사항을 독자에게 전달합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">a lesson that 동격의 that: 명사(lesson) + that + S + V 구조로, 뒤의 that절이 앞 명사(lesson)의 구체적인 내용을 설명하고 있음</div><div class=\"lec-gr-item\">even if they look cute (관계부사(접속사)): even if는 양보를 나타내는 접속사로, 뒤에 주어+동사가 이끄는 절이 옴</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>싱가포르 공원에서 산책하던 스티브가 우연히 수달 무리를 만난다.</li><li>조깅하는 사람이 수달을 밟는 사고가 발생하며 수달들이 매우 흥분한다.</li><li>오해를 산 스티브는 수달들의 공격을 받아 나무 위로 피신한다.</li><li>야생 동물은 귀여워 보여도 예기치 못한 위험이 있으므로 항상 주의해야 한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">An encounter with seemingly cute otters turned into a dangerous situation, and it serves as a reminder to be cautious around wild animals.</div>\n              <div class=\"lec-final-sum-ko\">귀여워 보이는 수달과의 조우가 위험한 상황으로 변했으며, 이는 야생 동물 주변에서 항상 주의해야 함을 상기시켜 준다.</div></div></div>"],"segs":[[{"audio":"./passage01_audio/1.mp3","hl":null}],[{"audio":"./passage01_audio/2.mp3","hl":null}],[{"audio":"./passage01_audio/3.mp3","hl":null},{"audio":"./passage01_audio/4.mp3","hl":"stage-0"},{"audio":"./passage01_audio/5.mp3","hl":"stage-1"},{"audio":"./passage01_audio/6.mp3","hl":"stage-2"},{"audio":"./passage01_audio/7.mp3","hl":"stage-3"}],[{"audio":"./passage01_audio/8.mp3","hl":null}],[{"audio":"./passage01_audio/9.mp3","hl":"main"},{"audio":"./passage01_audio/10.mp3","hl":"meaning"},{"audio":"./passage01_audio/11.mp3","hl":"grammar"}],[{"audio":"./passage01_audio/12.mp3","hl":"main"},{"audio":"./passage01_audio/13.mp3","hl":"meaning"},{"audio":"./passage01_audio/14.mp3","hl":"grammar"}],[{"audio":"./passage01_audio/15.mp3","hl":"main"},{"audio":"./passage01_audio/16.mp3","hl":"meaning"},{"audio":"./passage01_audio/17.mp3","hl":"grammar"}],[{"audio":"./passage01_audio/18.mp3","hl":"main"},{"audio":"./passage01_audio/19.mp3","hl":"meaning"},{"audio":"./passage01_audio/20.mp3","hl":"grammar"}],[{"audio":"./passage01_audio/21.mp3","hl":"main"},{"audio":"./passage01_audio/22.mp3","hl":"meaning"},{"audio":"./passage01_audio/23.mp3","hl":"grammar"}],[{"audio":"./passage01_audio/24.mp3","hl":"main"},{"audio":"./passage01_audio/25.mp3","hl":"meaning"},{"audio":"./passage01_audio/26.mp3","hl":"grammar"}],[{"audio":"./passage01_audio/27.mp3","hl":"main"},{"audio":"./passage01_audio/28.mp3","hl":"meaning"},{"audio":"./passage01_audio/29.mp3","hl":"grammar"}],[{"audio":"./passage01_audio/30.mp3","hl":"main"},{"aud
