</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}

    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}

lecturePlayer(document.getElementById("app"),{"brand":"청명학원 영어과","title":"리딩그라피2 리딩그라피레벨2 1번","audioDir":"audio","preview":false,"count":48,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.400em\">리딩그라피레벨2\u003cbr>1번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩그라피2\u003c/div>\u003ch1>A Sudden Lesson: Safety Around Wild Otters\u003c/h1>\u003ch2>갑작스러운 교훈: 야생 수달 주변에서의 안전\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>싱가포르의 한 공원에서 Steve는 \u003cb class=\"key\">귀여운 \u003c/b>\u003cb class=\"key\">수달\u003c/b>들을 구경하려다 조깅객의 실수로 흥분한 수달들에게 \u003cb class=\"key\">공격\u003c/b>을 받았으며, 이를 통해 야생 동물의 외모와 상관없이 항상 \u003cb class=\"key\">조심\u003c/b>해야 한다는 교훈을 얻었습니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>You should always exercise caution around wild animals regardless of their appearance.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분, 오늘은 싱가포르의 한 공원에서 일어난 아주 특별하고도 아찔한 사건을 함께 살펴볼 거예요. Steve라는 남성이 귀여운 수달을 구경하다가 겪게 된 이 일화를 통해, 우리가 야생 동물을 대할 때 어떤 마음가짐을 가져야 하는지 배워 보겠습니다. 지문의 요지는 야생 동물이 아무리 귀엽게 생겼어도 그 주변에서는 항상 조심해야 한다는 내용입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">싱가포르 공원에는 매끄러운털수달인 \u003cb class=\"key\">Smooth-coated \u003c/b>\u003cb class=\"key\">Otters\u003c/b>가 자주 출몰하여 사람들의 관심을 끌곤 합니다. 하지만 수달은 귀여운 외모와 달리 자기 영역을 보호하려는 \u003cb class=\"key\">Territoriality\u003c/b>가 매우 강한 포식자입니다. 야생 동물은 위협을 느끼면 본능적으로 \u003cb class=\"key\">Fight-or-flight \u003c/b>\u003cb class=\"key\">response\u003c/b>라 불리는 투쟁-도피 반응을 보이며 공격적으로 변할 수 있습니다. 길들여진 \u003cb class=\"key\">Domestic \u003c/b>\u003cb class=\"key\">animals\u003c/b>와 달리 야생 동물은 돌발 행동을 할 가능성이 높으므로 일정한 거리를 유지해야 합니다. 마치 순한 \u003cb class=\"key\">집고양이\u003c/b>가 갑작스러운 소음에 놀라 할퀴는 것과 유사하게 야생 동물도 예기치 못한 자극에 민감하게 반응합니다. 도심 속에서 인간과 동물이 공존하며 발생하는 \u003cb class=\"key\">Wildlife \u003c/b>\u003cb class=\"key\">conflict\u003c/b> 사례를 통해 생태적 거리두기의 중요성을 알 수 있습니다.\u003c/div>","segs":[{"n":2,"text":"배경지식을 조금 설명해 드릴게요. 싱가포르 공원에는 Smooth-coated Otters라는 매끄러운 털을 가진 수달들이 살고 있는데, 사람들에게 인기가 아주 많아요. 하지만 이들은 영역 의식이 강한 Territoriality를 가진 동물이라서 위협을 느끼면 본능적으로 공격성을 드러낼 수 있습니다. 우리 주변의 Domestic animals, 즉 반려동물과는 완전히 다르죠. 야생 동물은 예기치 못한 상황에서 Fight-or-flight response라는 생존 본능이 발동할 수 있다는 점을 꼭 기억해야 합니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>공원의 아침과 수달 발견\u003csmall>도입 · 문장 1–5\u003c/small>\u003c/h4>\u003cp>이른 아침 싱가포르의 공원에서 Steve가 \u003cb class=\"key\">어둡고 \u003c/b>\u003cb class=\"key\">조용한\u003c/b> 분위기 속에 산책을 하다가 물가에서 \u003cb class=\"key\">수달 \u003c/b>\u003cb class=\"key\">무리\u003c/b>를 발견하고 가까이 다가갑니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>예기치 못한 사고의 발생\u003csmall>전환 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>조깅하던 사람이 실수로 \u003cb class=\"key\">수달을 \u003c/b>\u003cb class=\"key\">밟는\u003c/b> 사건이 발생하면서 평화롭던 수달들이 순식간에 \u003cb class=\"key\">화가 \u003c/b>\u003cb class=\"key\">나고\u003c/b> 겁에 질리게 됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>수달의 공격과 대피\u003csmall>위기 · 문장 8–11\u003c/small>\u003c/h4>\u003cp>Steve를 위험으로 오해한 수달들이 그를 \u003cb class=\"key\">공격하고 \u003c/b>\u003cb class=\"key\">물기\u003c/b> 시작하자 Steve는 필사적으로 \u003cb class=\"key\">나무 \u003c/b>\u003cb class=\"key\">위\u003c/b>로 도망쳐 상황이 진정되기를 기다립니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>경험을 통한 교훈\u003csmall>결론 · 문장 12\u003c/small>\u003c/h4>\u003cp>이 사건을 통해 외모와 상관없이 \u003cb class=\"key\">야생 \u003c/b>\u003cb class=\"key\">동물\u003c/b> 주변에서는 항상 \u003cb class=\"key\">주의\u003c/b>해야 한다는 중요한 교훈을 깨닫게 됩니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 이제 지문의 흐름을 네 단계로 나누어 차근차근 따라가 볼까요?","hl":null},{"n":4,"text":"첫 번째 단계인 첫 번째와 두 번째 문장에서는 아직 어둡고 조용한 싱가포르 공원의 아침 풍경을 보여주며 Steve의 산책이 시작됩니다.","hl":"f0"},{"n":5,"text":"두 번째 단계인 세 번째부터 다섯 번째 문장까지는 Steve가 물가에서 귀여운 수달 무리를 발견하고 호기심에 가까이 다가가는 흥미로운 장면이에요.","hl":"f1"},{"n":6,"text":"세 번째 단계인 여섯 번째부터 아홉 번째 문장에서는 상황이 반전됩니다. 조깅하던 사람이 실수로 수달을 밟으면서 수달들이 Steve를 공격하기 시작하는 위기 상황이 펼쳐지죠.","hl":"f2"},{"n":7,"text":"마지막 네 번째 단계인 열 번째부터 열두 번째 문장에서는 Steve가 나무로 피해 목숨을 구하고, 야생 동물을 대할 때의 주의사항이라는 교훈을 얻으며 마무리됩니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">인과 및 시간순\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 12번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 Steve가 겪은 사건을 \u003cb class=\"key\">시간의 \u003c/b>\u003cb class=\"key\">흐름\u003c/b>에 따라 순차적으로 구성한 서술 방식을 따르고 있습니다. 전반부의 평화로운 분위기가 중반부의 사고로 급변하는 \u003cb class=\"key\">인과 \u003c/b>\u003cb class=\"key\">관계\u003c/b>가 뚜렷하게 나타납니다. 마지막 문장에서 사건을 통해 얻은 \u003cb class=\"key\">일반적인 \u003c/b>\u003cb class=\"key\">교훈\u003c/b>을 명시하며 글을 마무리하는 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>While (3)\u003c/b>\u003cspan>시간적 배경 설정\u003c/span>\u003cb>Suddenly (6)\u003c/b>\u003cspan>사건의 급격한 전환\u003c/span>\u003cb>so (8)\u003c/b>\u003cspan>원인에 따른 결과 연결\u003c/span>\u003cb>At last (10)\u003c/b>\u003cspan>사건의 마무리 단계\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Steve\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a man\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">he\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">him\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">20 furry animals\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">otters\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">cute animals\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">wild animals\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>수달의 겉모습\u003c/th>\u003cth>수달의 실제 반응\u003c/th>\u003c/tr>\u003ctr>\u003ctd>furry, cute (귀여운 외모)\u003c/td>\u003ctd>angry, biting (화난 공격성)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>조용한 관찰 대상\u003c/td>\u003ctd>위험한 위협 요소\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 사건이 일어난 순서대로 서술하는 시간순 구성과 원인과 결과가 뚜렷한 인과 구조를 가지고 있어요. 특히 마지막 문장에서 전체 이야기를 관통하는 교훈을 던져주는 전형적인 미괄식 구조의 글입니다. 독자는 Steve의 생생한 경험담을 통해 필자가 말하고자 하는 주제를 자연스럽게 이해하게 되죠.","hl":"ty"},{"n":9,"text":"글의 흐름을 바꾸는 신호어들을 잘 봐야 해요. 여섯 번째 문장의 Suddenly는 평화롭던 분위기를 순식간에 반전시키는 역할을 합니다. 그리고 여덟 번째 문장의 연결어 so는 수달들이 Steve를 위험하다고 느낀 원인이 공격이라는 결과로 이어지는 것을 보여주죠. 마지막 열 번째 문장의 At last는 긴박했던 대치 상황이 드디어 해결 단계에 접어들었음을 알려줍니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>park\u003c/b>\u003cem>명사\u003c/em>\u003cspan>공원\u003c/span>\u003c/div>\u003cdiv>\u003cb>went for a walk\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>산책하러 갔다\u003c/span>\u003c/div>\u003cdiv>\u003cb>still\u003c/b>\u003cem>부사\u003c/em>\u003cspan>여전히\u003c/span>\u003c/div>\u003cdiv>\u003cb>quiet\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>조용한\u003c/span>\u003c/div>\u003cdiv>\u003cb>furry\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>털로 덮인\u003c/span>\u003c/div>\u003cdiv>\u003cb>otter\u003c/b>\u003cem>명사\u003c/em>\u003cspan>수달\u003c/span>\u003c/div>\u003cdiv>\u003cb>for a moment\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>잠시 동안\u003c/span>\u003c/div>\u003cdiv>\u003cb>get close\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>가까이 다가가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>look at\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 보다\u003c/span>\u003c/div>\u003cdiv>\u003cb>suddenly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>갑자기\u003c/span>\u003c/div>\u003cdiv>\u003cb>jogger\u003c/b>\u003cem>명사\u003c/em>\u003cspan>조깅하는 사람\u003c/span>\u003c/div>\u003cdiv>\u003cb>ran by\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>달리며 지나갔다\u003c/span>\u003c/div>\u003cdiv>\u003cb>accidentally\u003c/b>\u003cem>부사\u003c/em>\u003cspan>실수로\u003c/span>\u003c/div>\u003cdiv>\u003cb>step on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 밟다\u003c/span>\u003c/div>\u003cdiv>\u003cb>angry\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>화가 난\u003c/span>\u003c/div>\u003cdiv>\u003cb>scared\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>겁을 먹은\u003c/span>\u003c/div>\u003cdiv>\u003cb>danger\u003c/b>\u003cem>명사\u003c/em>\u003cspan>위험\u003c/span>\u003c/div>\u003cdiv>\u003cb>toward\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~을 향해\u003c/span>\u003c/div>\u003cdiv>\u003cb>start\u003c/b>\u003cem>동사\u003c/em>\u003cspan>시작하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>bite\u003c/b>\u003cem>동사\u003c/em>\u003cspan>물다\u003c/span>\u003c/div>\u003cdiv>\u003cb>ankle\u003c/b>\u003cem>명사\u003c/em>\u003cspan>발목\u003c/span>\u003c/div>\u003cdiv>\u003cb>try to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~하려고 노력하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>at last\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>마침내\u003c/span>\u003c/div>\u003cdiv>\u003cb>climb\u003c/b>\u003cem>동사\u003c/em>\u003cspan>기어오르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>get away from\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로부터 도망치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>stay\u003c/b>\u003cem>동사\u003c/em>\u003cspan>머무르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>until\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>~할 때까지\u003c/span>\u003c/div>\u003cdiv>\u003cb>calm down\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>진정하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>go back\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>돌아가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>lesson\u003c/b>\u003cem>명사\u003c/em>\u003cspan>교훈\u003c/span>\u003c/div>\u003cdiv>\u003cb>wild\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>야생의\u003c/span>\u003c/div>\u003cdiv>\u003cb>even if\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>~일지라도\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"중요한 단어를 몇 개 짚어볼게요. furry는 털로 덮였다는 뜻이고, accidentally는 의도치 않게 실수로라는 뜻입니다. wild animals는 야생 동물을 의미하는데, 지문 마지막에서 이들이 cute, 즉 귀여워 보일지라도 조심해야 한다고 강조할 때 쓰였습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">furry\u003c/b>\u003cspan class=\"m\">털로 덮인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">fuzzy\u003c/span>\u003cspan class=\"s\">hairy\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">bald\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">suddenly\u003c/b>\u003cspan class=\"m\">갑자기\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">abruptly\u003c/span>\u003cspan class=\"s\">unexpectedly\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">accidentally\u003c/b>\u003cspan class=\"m\">실수로\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">unintentionally\u003c/span>\u003cspan class=\"s\">by mistake\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">deliberately\u003c/span>\u003cspan class=\"a\">on purpose\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">danger\u003c/b>\u003cspan class=\"m\">위험\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">hazard\u003c/span>\u003cspan class=\"s\">risk\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">safety\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">calm down\u003c/b>\u003cspan class=\"m\">진정하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">settle down\u003c/span>\u003cspan class=\"s\">relax\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">agitate\u003c/span>\u003cspan class=\"a\">excite\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">wild\u003c/b>\u003cspan class=\"m\">야생의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">feral\u003c/span>\u003cspan class=\"s\">untamed\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">domestic\u003c/span>\u003cspan class=\"a\">tame\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"핵심 어휘의 관계도 정리해 봐요. furry는 fuzzy나 hairy와 뜻이 통하고, 털이 없는 bald와는 반대예요. 위험을 뜻하는 danger는 hazard 혹은 risk로 바꿀 수 있고 반대말은 safety입니다. 야생의라는 wild는 feral이나 untamed와 비슷하며, 길들여진이라는 domestic이나 tame이 반의어입니다. 진정하다는 calm down은 settle down과 유의어이고, 자극하다는 agitate나 excite와 대조를 이룹니다. 마지막으로 실수로라는 뜻의 accidentally는 by mistake와 같고, 고의로라는 뜻의 deliberately와는 반대입니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">싱가포르에 있는 한 공원에서,\u003c/span>\u003cspan class=\"en\">01 In a park in Singapore,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Steve라는 이름의 한 남성은\u003c/span>\u003cspan class=\"en\">a man \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">named \u003c/span>\u003cspan class=\"tgt\">Steve\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아침 산책을 하러 갔다.\u003c/span>\u003cspan class=\"en\">went for a morning walk.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">싱가포르에 있는 한 공원에서, Steve라는 이름의 한 남성은 아침 산책을 하러 갔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이야기의 배경이 되는 \u003cb class=\"key\">장소\u003c/b>와 주인공인 \u003cb class=\"key\">Steve\u003c/b>를 소개하며 평화로운 아침 상황을 묘사합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사의 후치 수식\u003c/span> : [명사] + [p.p. (과거분사구)] : \"Steve라고 이름 붙여진\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"In a park in Singapore, 싱가포르에 있는 한 공원에서. a man named Steve, Steve라는 이름의 한 남성은. went for a morning walk, 아침 산책을 하러 갔다.. 이 문장 전체를 해석하면, 싱가포르에 있는 한 공원에서, Steve라는 이름의 한 남성은 아침 산책을 하러 갔다.","hl":"m"},{"n":13,"text":"이 문장은 싱가포르의 한 공원이라는 장소와 스티브라는 주인공을 등장시키며 이야기의 시작을 알리고 있어요. 평온한 아침 산책이라는 배경을 설정하고 있죠.","hl":"mn"},{"n":14,"text":"첫 번째 문법 포인트는 명사 a man을 뒤에서 꾸며주는 named Steve예요. 스티브라고 이름이 지어진 남성이라는 의미로 수동의 느낌을 주는 과거분사를 사용한 것이 핵심입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 ~했다 (상태였다)\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It\u003c/span> was\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아직 어둡고 조용했다.\u003c/span>\u003cspan class=\"en\">still dark and quiet.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">아직 어둡고 조용했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이른 아침의 \u003cb class=\"key\">시간적 \u003c/b>\u003cb class=\"key\">배경\u003c/b>을 구체적으로 설명하며, 앞으로 일어날 사건의 \u003cb class=\"key\">분위기\u003c/b>를 형성합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">비인칭 주어 It\u003c/span> : It [비인칭 주어] + be동사 + [명도/시간/날씨 등] : \"해석하지 않음\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"It was, 그것은 ~했다 (상태였다). still dark and quiet, 아직 어둡고 조용했다.. 이 문장 전체를 해석하면, 아직 어둡고 조용했다.","hl":"m"},{"n":16,"text":"공원의 분위기를 묘사하는 문장이에요. 아직 해가 완전히 뜨지 않아 어둡고 고요한 이른 아침의 느낌을 주고 있습니다.","hl":"mn"},{"n":17,"text":"문장의 주어인 It은 그것이라고 해석하지 않는 비인칭 주어예요. 시간이나 날씨 혹은 밝기를 나타낼 때 주어 자리를 채워주는 역할을 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그가 걷고 있는 동안,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">While\u003c/span> he \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">walking\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 보았다\u003c/span>\u003cspan class=\"en\">he saw\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">약 스무 마리의 털로 덮인 동물들을\u003c/span>\u003cspan class=\"en\">about 20 furry animals\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">물 근처에서.\u003c/span>\u003cspan class=\"en\">near the water.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그가 걷고 있는 동안, 그는 물 근처에서 약 스무 마리의 털로 덮인 동물들을 보았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 산책 중에 예상치 못한 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">발견\u003c/b>을 하는 장면으로, 긴장감을 유발하고 다음 문장에 나올 동물의 \u003cb class=\"key\">정체\u003c/b>를 궁금하게 만듭니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 While\u003c/span> : While [접속사] + S + V : \"~하는 동안\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거진행형\u003c/span> : was/were [be동사 과거] + v-ing [현재분사] : \"걷고 있는 중이었다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"While he was walking, 그가 걷고 있는 동안. he saw, 그는 보았다. about 20 furry animals, 약 스무 마리의 털로 덮인 동물들을. near the water, 물 근처에서.. 이 문장 전체를 해석하면, 그가 걷고 있는 동안, 그는 물 근처에서 약 스무 마리의 털로 덮인 동물들을 보았다.","hl":"m"},{"n":19,"text":"스티브가 산책을 하다가 물가에서 무언가를 발견한 중요한 순간이에요. 털이 복슬복슬한 동물 스무 마리가 갑자기 등장하며 독자의 호기심을 자극하죠.","hl":"mn"},{"n":20,"text":"첫 번째로 While은 두 문장을 연결하며 어떠한 동작이 진행되는 기간을 나타내요. 두 번째로 was walking은 과거의 한 시점에 걷고 있었다는 사실을 강조하는 과거진행형 시제입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들은 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">They \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수달이었다!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">otters\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것들은 수달이었다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Steve가 멀리서 본 동물의 \u003cb class=\"key\">정체\u003c/b>를 밝히는 문장입니다. 앞에 나온 스무 마리의 동물들을 \u003cb class=\"key\">대명사\u003c/b> They로 받았습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주어와 보어의 수 일치\u003c/span> : They [복수 주어] + were [복수 동사] + otters [복수 보어] : \"그것들은 수달들이었다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"They, 그것들은. were otters!, 수달이었다!. 이 문장 전체를 해석하면, 그것들은 수달이었다!","hl":"m"},{"n":22,"text":"Steve가 발견한 동물의 정체가 무엇인지 밝혀주는 문장이에요. 앞에서 말한 스무 마리의 동물들을 They라는 대명사로 표현했습니다.","hl":"mn"},{"n":23,"text":"주어인 They가 복수이기 때문에 be동사의 과거형인 were를 썼고, 보어인 otter에도 복수형 어미 s를 붙여서 수 일치를 시켜준 문장입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 멈췄고 \u003c/span>\u003cspan class=\"en\">He stopped\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">잠시 \u003c/span>\u003cspan class=\"en\">for a moment\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가까이 다가갔다 \u003c/span>\u003cspan class=\"en\">and got close\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보기 위해 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">look \u003c/span>\u003cspan class=\"tgt\">at\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 귀여운 동물들을.\u003c/span>\u003cspan class=\"en\">the cute animals.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 그 귀여운 동물들을 보기 위해 잠시 멈추고 가까이 다가갔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 동물을 보고 \u003cb class=\"key\">호기심\u003c/b>을 느낀 Steve의 행동을 묘사합니다. 이후의 반전과 대비되는 \u003cb class=\"key\">평화로운\u003c/b> 분위기를 형성합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : to + look [동사원형] : \"보기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">과거 동사의 병렬 구조\u003c/span> : stopped [과거동사 1] + and + got [과거동사 2] : \"멈췄고 그리고 다가갔다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"He stopped, 그는 멈췄고. for a moment, 잠시. and got close, 가까이 다가갔다. to look at, 보기 위해. the cute animals, 그 귀여운 동물들을.. 이 문장 전체를 해석하면, 그는 그 귀여운 동물들을 보기 위해 잠시 멈추고 가까이 다가갔다.","hl":"m"},{"n":25,"text":"귀여운 수달을 보고 호기심이 생긴 Steve가 가까이 다가가는 장면이에요. 나중에 벌어질 무서운 사건과 대비되는 아주 평화로운 분위기를 보여줍니다.","hl":"mn"},{"n":26,"text":"첫 번째로 동사인 stopped와 got이 and로 연결된 병렬 구조라는 점에 주목하세요. 두 번째로 뒤에 나오는 to look at은 목적을 나타내는 부사적 용법의 to부정사입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">갑자기, \u003c/span>\u003cspan class=\"en\">Suddenly,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">조깅하는 사람 하나가 달리며 지나갔는데, \u003c/span>\u003cspan class=\"en\">a jogger \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">ran \u003c/span>\u003cspan class=\"tgt\">by\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 실수로 \u003c/span>\u003cspan class=\"en\">and he accidentally\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">밟았다 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">stepped \u003c/span>\u003cspan class=\"tgt\">on\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수달 한 마리를.\u003c/span>\u003cspan class=\"en\">an otter.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">갑자기, 조깅하는 사람 하나가 달리며 지나갔는데, 그는 수달 한 마리를 실수로 밟았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글의 분위기가 바뀌는 \u003cb class=\"key\">사건의 \u003c/b>\u003cb class=\"key\">발단\u003c/b>입니다. 조깅하는 사람의 \u003cb class=\"key\">실수\u003c/b>로 인해 평화롭던 상황이 급박하게 변합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">구동사(phrasal verb)\u003c/span> : ran [동사] + by [부사] : \"달리며 지나갔다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">구동사(동사+전치사)\u003c/span> : stepped [동사] + on [전치사] : \"밟았다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Suddenly, 갑자기. a jogger ran by, 조깅하는 사람 하나가 달리며 지나갔는데. and he accidentally, 그는 실수로. stepped on, 밟았다. an otter, 수달 한 마리를.. 이 문장 전체를 해석하면, 갑자기, 조깅하는 사람 하나가 달리며 지나갔는데, 그는 수달 한 마리를 실수로 밟았다.","hl":"m"},{"n":28,"text":"조용했던 공원에서 사건이 시작되는 발단이 되는 문장이에요. 조깅하던 사람의 사소한 실수가 어떤 큰 결과를 가져올지 암시하고 있습니다.","hl":"mn"},{"n":29,"text":"첫 번째로 ran by는 곁을 달려 지나갔다는 의미의 구동사입니다. 두 번째로 stepped on은 무엇을 밟았다는 뜻인데, 여기서 전치사 on이 빠지면 안 된다는 점에 주의하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 수달들은\u003c/span>\u003cspan class=\"en\">The other otters\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">화가 났고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">got \u003c/span>\u003cspan class=\"tgt\">angry \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">겁을 먹었다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">scared\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">다른 수달들은 화가 났고 겁을 먹었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 조깅하던 사람이 수달을 밟은 돌발 사건 이후 수달들의 \u003cb class=\"key\">감정적 \u003c/b>\u003cb class=\"key\">반응\u003c/b>을 묘사합니다. 수달들이 평온한 상태에서 공격성을 띠는 \u003cb class=\"key\">상태 \u003c/b>\u003cb class=\"key\">변화\u003c/b>의 계기를 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">2형식 동사 get + 형용사 보어\u003c/span> : get [연결동사] + [angry and scared (형용사/보어)] : \"화가 나고 겁먹게 되었다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"The other otters, 다른 수달들은. got angry, 화가 났고. and scared, 겁을 먹었다.. 이 문장 전체를 해석하면, 다른 수달들은 화가 났고 겁을 먹었다.","hl":"m"},{"n":31,"text":"조거가 실수로 수달을 밟은 뒤에 남겨진 다른 수달들의 감정이 어땠는지 설명하는 부분이에요. 갑작스러운 사고 때문에 수달들이 아주 흥분하고 예민해진 상황을 보여주죠.","hl":"mn"},{"n":32,"text":"여기서 중요한 포인트는 동사 get입니다. get은 얻다라는 뜻이 아니라 뒤에 형용사를 데려와서 어떠한 상태가 되다라는 의미로 쓰였어요. 그래서 화가 나고 겁을 먹은 상태로 변했다는 상태 변화를 나타내고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수달들은 생각했다\u003c/span>\u003cspan class=\"en\">The otters \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">thought \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Steve 역시 위험한 사람이라고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">Steve \u003c/span>\u003cspan class=\"tgt\">was\u003c/span> a danger too,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서 그들은 그를 향해 달려들었고\u003c/span>\u003cspan class=\"en\">so they ran toward him\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">물기 시작했다\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">started \u003c/span>\u003cspan class=\"tgt\">biting\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 발목과 다리를.\u003c/span>\u003cspan class=\"en\">his ankles and legs.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">수달들은 Steve 역시 위험한 사람이라고 생각해서, 그를 향해 달려들었고 그의 발목과 다리를 물기 시작했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 수달들이 위협 대상을 \u003cb class=\"key\">오해\u003c/b>하여 Steve를 공격하게 된 구체적인 \u003cb class=\"key\">행동 \u003c/b>\u003cb class=\"key\">변화\u003c/b>를 나타냅니다. 귀여웠던 수달들이 순식간에 \u003cb class=\"key\">위험한 \u003c/b>\u003cb class=\"key\">동물\u003c/b>로 돌변하는 긴박한 장면입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that의 생략\u003c/span> : thought [타동사] + [(that) + Steve was a danger (명사절/목적어)] : \"Steve가 ~라고 생각했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사를 목적어로 취하는 동사\u003c/span> : started [타동사] + [biting (동명사/목적어)] : \"물기 시작했다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"The otters thought, 수달들은 생각했다. Steve was a danger too, Steve 역시 위험한 사람이라고. so they ran toward him, 그래서 그들은 그를 향해 달려들었고. and started biting, 물기 시작했다. his ankles and legs, 그의 발목과 다리를.. 이 문장 전체를 해석하면, 수달들은 Steve 역시 위험한 사람이라고 생각해서, 그를 향해 달려들었고 그의 발목과 다리를 물기 시작했다.","hl":"m"},{"n":34,"text":"수달들이 Steve를 자신들을 괴롭힌 조거와 같은 편이라고 오해해서 공격하는 장면이에요. 귀엽게만 보이던 동물이 순식간에 공격자로 바뀌는 급박한 흐름을 느껴보세요.","hl":"mn"},{"n":35,"text":"첫 번째 포인트로 thought 뒤에는 접속사 that이 생략되어 있어요. 수달들이 생각한 구체적인 내용 전체가 문장의 목적어 역할을 하는 것이죠. 두 번째로 start라는 동사는 뒤에 biting처럼 ing가 붙은 동명사도 올 수 있고 to bite처럼 to부정사도 올 수 있다는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Steve는 노력했다\u003c/span>\u003cspan class=\"en\">Steve \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">tried \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들을 막으려고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">stop\u003c/span> them,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 그럴 수 없었다.\u003c/span>\u003cspan class=\"en\">but he \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">couldn't\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Steve는 그것들을 막으려고 노력했지만, 그럴 수 없었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Steve의 \u003cb class=\"key\">방어 \u003c/b>\u003cb class=\"key\">시도\u003c/b>가 실패했음을 보여주며 긴장감을 높입니다. 이 실패는 결국 Steve가 \u003cb class=\"key\">나무 \u003c/b>\u003cb class=\"key\">위로 \u003c/b>\u003cb class=\"key\">피신\u003c/b>하게 되는 직접적인 \u003cb class=\"key\">원인\u003c/b>이 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">try + to부정사\u003c/span> : tried [타동사] + [to stop (to부정사/목적어)] : \"막으려고 노력했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">대동사(대부정사)의 생략\u003c/span> : couldn't [조동사] + [(stop them) (동사구 생략)] : \"그럴 수 없었다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Steve tried, Steve는 노력했다. to stop them, 그것들을 막으려고. but he couldn't, 하지만 그럴 수 없었다.. 이 문장 전체를 해석하면, Steve는 그것들을 막으려고 노력했지만, 그럴 수 없었다.","hl":"m"},{"n":37,"text":"수달들의 공격을 필사적으로 막아보려 했지만 소용이 없었다는 상황을 짧고 강하게 전달하고 있어요. 이 시도가 실패했기 때문에 Steve는 결국 나무 위로 도망치는 선택을 하게 됩니다.","hl":"mn"},{"n":38,"text":"첫 번째로 try 뒤에 오는 to stop에 주목하세요. try에 to부정사가 붙으면 무언가를 하려고 정말 열심히 노력하고 애쓰는 느낌을 줍니다. 두 번째로 문장 끝에 couldn't 다음에는 stop them이라는 말이 반복되어서 생략되었어요. 영어는 반복을 싫어하기 때문에 이렇게 조동사만 남기고 줄여 쓰는 경우가 아주 많답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마침내, \u003c/span>\u003cspan class=\"en\">At last,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Steve는 올라갔다 \u003c/span>\u003cspan class=\"en\">Steve climbed\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나무에 \u003c/span>\u003cspan class=\"en\">a tree\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">도망치기 위해 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">get \u003c/span>\u003cspan class=\"tgt\">away\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">화가 난 수달들로부터\u003c/span>\u003cspan class=\"en\">from the angry otters.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">마침내, Steve는 화가 난 수달들로부터 도망치기 위해 나무에 올라갔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 수달의 공격을 피하기 위해 Steve가 선택한 \u003cb class=\"key\">최종적인 \u003c/b>\u003cb class=\"key\">대처\u003c/b>를 설명하며, 긴박한 상황의 \u003cb class=\"key\">절정\u003c/b>을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : climbed [동사] + to get away [to부정사구] : \"도망치기 위해\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"At last, 마침내. Steve climbed, Steve는 올라갔다. a tree, 나무에. to get away, 도망치기 위해. from the angry otters, 화가 난 수달들로부터. 이 문장 전체를 해석하면, 마침내, Steve는 화가 난 수달들로부터 도망치기 위해 나무에 올라갔다.","hl":"m"},{"n":40,"text":"수달들의 갑작스러운 공격 때문에 Steve가 나무 위로 피신하는 장면이에요. 이 글의 갈등 상황이 해결되기 직전의 가장 긴박한 최종적인 대처를 보여주는 부분이죠.","hl":"mn"},{"n":41,"text":"여기서 to get away는 Steve가 왜 나무에 올라갔는지 그 목적을 설명해 주는 to부정사의 부사적 용법으로 쓰였어요. 시험에서는 이 자리에 동사원형만 쓰지 않도록 주의해야 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 그곳에 머물렀다 \u003c/span>\u003cspan class=\"en\">He stayed there\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~할 때까지 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">until\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수달들이 진정하고 \u003c/span>\u003cspan class=\"en\">the otters \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">calmed \u003c/span>\u003cspan class=\"tgt\">down \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">돌아갈 때까지 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">went \u003c/span>\u003cspan class=\"tgt\">back\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">물로\u003c/span>\u003cspan class=\"en\">to the water.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 수달들이 진정하고 물로 돌아가기 전까지 그곳에 머물렀다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 공격이 멈추고 상황이 종료되는 \u003cb class=\"key\">해소\u003c/b> 과정을 나타내며, 주어의 \u003cb class=\"key\">인내\u003c/b>가 필요했음을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간의 접속사\u003c/span> : stayed [주절 동사] + until [접속사] + S + V : \"~할 때까지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동사의 병렬 구조\u003c/span> : calmed down [과거동사 1] + and + went back [과거동사 2] : \"진정하고 돌아갔다\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"He stayed there, 그는 그곳에 머물렀다. until, ~할 때까지. the otters calmed down, 수달들이 진정하고. and went back, 돌아갈 때까지. to the water, 물로. 이 문장 전체를 해석하면, 그는 수달들이 진정하고 물로 돌아가기 전까지 그곳에 머물렀다.","hl":"m"},{"n":43,"text":"상황이 완전히 안전해질 때까지 나무 위에서 기다렸다는 뜻이에요. 수달들이 진정하고 원래 있던 물가로 돌아가면서 사건이 마무리되는 해소 단계를 나타냅니다.","hl":"mn"},{"n":44,"text":"첫 번째로 접속사 until은 어떤 시점까지 동작이 계속됨을 알려줍니다. 두 번째로 and 뒤에 나오는 went back은 앞에 있는 calmed down과 짝을 이루는 병렬 구조예요. 주어인 수달들이 한 두 가지 행동을 모두 과거 시제로 표현해야 한다는 점이 중요합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Steve는 그날 교훈을 얻었다: \u003c/span>\u003cspan class=\"en\">Steve learned a lesson that day:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">항상 조심해라 \u003c/span>\u003cspan class=\"en\">always be careful\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">야생 동물 주변에서는, \u003c/span>\u003cspan class=\"en\">around wild animals,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~일지라도 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">even \u003c/span>\u003cspan class=\"tgt\">if\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 귀여워 보일지라도\u003c/span>\u003cspan class=\"en\">they \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">look \u003c/span>\u003cspan class=\"tgt\">cute\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Steve는 그날 교훈을 얻었다: 야생 동물이 귀여워 보일지라도 야생 동물 주변에서는 항상 조심해라.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 전체 이야기의 \u003cb class=\"key\">결론\u003c/b>이자 독자에게 전달하려는 \u003cb class=\"key\">교훈\u003c/b>으로, 겉모습에 속지 말라는 경고를 담고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">양보의 접속사\u003c/span> : even if + S + V : \"~일지라도\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">2형식 감각동사\u003c/span> : look [감각동사] + cute [형용사 보어] : \"귀여워 보이다\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"Steve learned a lesson that day, Steve는 그날 교훈을 얻었다:. always be careful, 항상 조심해라. around wild animals, 야생 동물 주변에서는. even if, ~일지라도. they look cute, 그들이 귀여워 보일지라도. 이 문장 전체를 해석하면, Steve는 그날 교훈을 얻었다: 야생 동물이 귀여워 보일지라도 야생 동물 주변에서는 항상 조심해라.","hl":"m"},{"n":46,"text":"이 지문의 핵심 결론이에요. 겉보기에 귀엽다고 해서 야생 동물을 함부로 대하면 안 된다는 중요한 교훈을 직접적으로 전달하고 있습니다.","hl":"mn"},{"n":47,"text":"첫 번째로 look cute 부분을 봐주세요. look 같은 감각동사 뒤에는 반드시 형용사 보어를 써야 해서 cute라는 형용사가 왔습니다. 두 번째로 even if는 설령 귀엽더라도 라는 양보의 의미를 더해주는 접속사로 쓰였습니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>싱가포르의 이른 아침, Steve는 물가에서 \u003cb class=\"key\">귀여운 \u003c/b>\u003cb class=\"key\">수달\u003c/b> 무리를 발견하고 관찰하기 위해 가까이 다가갔습니다.\u003c/li>\u003cli>조깅하던 사람이 실수로 \u003cb class=\"key\">수달을 \u003c/b>\u003cb class=\"key\">밟자\u003c/b>, 흥분한 수달들이 근처에 있던 Steve를 \u003cb class=\"key\">위험 \u003c/b>\u003cb class=\"key\">인물\u003c/b>로 오해하고 공격했습니다.\u003c/li>\u003cli>Steve는 수달의 공격을 피해 \u003cb class=\"key\">나무 \u003c/b>\u003cb class=\"key\">위\u003c/b>로 대피했으며, 수달들이 진정되어 물로 돌아간 후에야 내려올 수 있었습니다.\u003c/li>\u003cli>이 사건을 통해 야생 동물은 \u003cb class=\"key\">겉모습\u003c/b>과 관계없이 항상 \u003cb class=\"key\">주의를 \u003c/b>\u003cb class=\"key\">기울여야\u003c/b> 한다는 중요한 교훈을 배웠습니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>You should always exercise caution around wild animals regardless of their appearance.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">싱가포르의 한 공원에서 Steve는 \u003cb class=\"key\">귀여운 \u003c/b>\u003cb class=\"key\">수달\u003c/b>들을 구경하려다 조깅객의 실수로 흥분한 수달들에게 \u003cb class=\"key\">공격\u003c/b>을 받았으며, 이를 통해 야생 동물의 외모와 상관없이 항상 \u003cb class=\"key\">조심\u003c/b>해야 한다는 교훈을 얻었습니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":48,"text":"오늘 수업 어떠셨나요? 귀여운 수달도 예기치 못한 상황에서는 무서운 공격자가 될 수 있다는 사실이 놀랍지 않나요? 지문의 마지막 문장인 always be careful around wild animals, even if they look cute라는 구절을 꼭 가슴에 새기시길 바랍니다. 오늘 배운 문법과 어휘들 복습 잊지 마세요. 수고하셨습니다!","hl":null}]}]});</script></body></html>
