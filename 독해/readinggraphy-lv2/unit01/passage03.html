 없게 된 친구를 위해 자카리아스가 특별한 악기를 개발했습니다.</li><li>창시자: 음악가이자 컴퓨터 과학자인 자카리아스(Zacharias)</li><li>개발 계기: 오토바이 사고로 팔을 움직이지 못하는 친구를 도움</li><li>핵심 키워드: 아이하프(EyeHarp)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02작동 원리</div><ul><li>화면상의 색깔을 눈으로 응시하면 프로그램이 이를 인식하여 소리를 생성합니다.</li><li>시각 정보 활용: 화면 속 다채로운 원과 음계(music scales) 표시</li><li>작동 방식: 특정 색상을 응시(look)하면 눈의 움직임을 추적</li><li>결과: 올바른 음(right sound)을 자동으로 재생</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03학습 과정과 의의</div><ul><li>EyeHarp 역시 숙련을 위한 노력이 필요하지만, 모두에게 음악의 즐거움을 선사합니다.</li><li>학습 필수: 연주 실력을 갖추기 위한 시간(time)과 연습(practice)</li><li>포용성: 신체 거동이 불편한 사람들에게도 음악의 기쁨을 제공</li><li>핵심 키워드: 음악의 즐거움(joy of music)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">thanks to</td><td class=\"m\">~덕분에, ~의 결과로서</td></tr><tr><td class=\"w\">possible</td><td class=\"m\">가능한, 실현 가능한</td></tr><tr><td class=\"w\">musician</td><td class=\"m\">음악가, 연주자</td></tr><tr><td class=\"w\">accident</td><td class=\"m\">사고, 우연</td></tr><tr><td class=\"w\">injury</td><td class=\"m\">부상, 상처</td></tr><tr><td class=\"w\">decide to</td><td class=\"m\">~하기로 결정하다, ~하기로 마음먹다</td></tr><tr><td class=\"w\">create</td><td class=\"m\">창조하다, 만들어 내다</td></tr><tr><td class=\"w\">work</td><td class=\"m\">작동하다, 효과가 있다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">specific</td><td class=\"m\">구체적인, 특정한</td></tr><tr><td class=\"w\">follow</td><td class=\"m\">따르다, 뒤를 잇다</td></tr><tr><td class=\"w\">just like</td><td class=\"m\">~와 똑같이, ~와 마찬가지로</td></tr><tr><td class=\"w\">take time</td><td class=\"m\">시간이 걸리다</td></tr><tr><td class=\"w\">amazing</td><td class=\"m\">놀라운, 굉장한</td></tr><tr><td class=\"w\">bring</td><td class=\"m\">가져오다, 초래하다</td></tr><tr><td class=\"w\">it does not matter</td><td class=\"m\">중요하지 않다, 상관없다</td></tr><tr><td class=\"w\">even if</td><td class=\"m\">비록 ~일지라도, 설령 ~라 하더라도</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여러분이 가장 좋아하는 음악을 연주하는 것을 상상해 보세요.</span><span class=\"en\"><b><span class=\"grammar-hl\">Imagine playing</span> your favorite music</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분의 눈동자만 움직여서</span><span class=\"en\"><b>just by moving your eyes.</b></span></div></div><div class=\"lec-sent-ko\">여러분의 눈동자만 움직여서 여러분이 가장 좋아하는 음악을 연주하는 것을 상상해 보세요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자의 흥미를 유발하며 글의 핵심 주제인 &#39;신체 제약 없이 음악을 연주하는 새로운 방식&#39;을 소개하는 도입부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Imagine playing (동명사): imagine은 목적어로 동명사를 취하는 동사이며, 여기서 playing은 &#39;연주하는 것&#39;이라는 명사적 역할을 수행함</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">소프트웨어 프로그램인 EyeHarp 덕분에</span><span class=\"en\"><b><span class=\"grammar-hl\">Thanks to</span> the software program, EyeHarp,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이것이 이제 가능합니다</span><span class=\"en\"><b>this is now possible.</b></span></div></div><div class=\"lec-sent-ko\">EyeHarp라는 소프트웨어 프로그램 덕분에 이제 이것이 가능해요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 제시한 상상을 실현해 줄 구체적인 도구로서 EyeHarp를 처음 언급하며 주제를 구체화합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Thanks to (관용표현): &#39;~덕분에&#39;라는 의미의 전치사구로, 뒤에 명사구가 이어짐</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">thanks to</td><td clas iv class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">EyeHarp는 꼭 다른 악기들과 같습니다</span><span class=\"en\"><b>EyeHarp is <span class=\"grammar-hl\">just like</span> other instruments.</b></span></div></div><div class=\"lec-sent-ko\">EyeHarp는 꼭 다른 악기들과 같아요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 기술을 단순한 소프트웨어가 아니라 실제 음악을 표현하는 &#39;악기&#39;의 범주로 규정합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">just like (관용표현): &#39;~와 꼭 같은&#39;이라는 의미의 전치사구로, 뒤의 명사(instruments)를 수식함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">just like</td><td class=\"m\">~와 똑같이, ~와 마찬가지로</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 11 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">시간과 연습이 필요합니다</span><span class=\"en\"><b><span class=\"grammar-hl\">It takes time and practice</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">음악을 잘 연주하기 위해서는</span><span class=\"en\"><b><span class=\"grammar-hl\">to play music well</span>.</b></span></div></div><div class=\"lec-sent-ko\">음악을 잘 연주하기 위해서는 시간과 연습이 필요해요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 기존 악기를 다루는 과정과 동일하게, 숙달을 위해서는 사용자의 노력이 동반되어야 함을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It takes time and practice to play music well (가주어): 진주어: &#39;It(가주어) + takes + 시간 + to부정사(진주어)&#39; 구조로, to play music well이 문장의 실제 주어 역할을 함</div></div>\n        ","<div class=\"lec-sent-no\">문장 12 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만</span><span class=\"en\"><b>However,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 놀라운 소프트웨어는</span><span class=\"en\"><b>this <span class=\"grammar-hl\">amazing software</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">음악의 즐거움을 가져다줄 수 있습니다</span><span class=\"en\"><b>can bring the joy of music</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모든 사람들에게</span><span class=\"en\"><b>to everyone.</b></span></div></div><div class=\"lec-sent-ko\">하지만, 이 놀라운 소프트웨어는 모든 사람들에게 음악의 즐거움을 가져다줄 수 있어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 기술적 접근성을 넘어, 누구나 음악을 즐길 수 있게 하는 이 프로그램의 보편적 가치를 역설합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">amazing software (현재분사): amazing이 software를 앞에서 수식하여 &#39;놀라움을 주는(상태)&#39; 소프트웨어라는 의미를 형성함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">amazing</td><td class=\"m\">놀라운, 굉장한</td></tr><tr><td class=\"w\">bring</td><td class=\"m\">가져오다, 초래하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 13 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 문제가 되지 않습니다</span><span class=\"en\"><b>It doesn’t matter</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">비록 그들이 몸을 잘 움직이지 못하더라도</span><span class=\"en\"><b><span class=\"grammar-hl\">even if they can’t move</span> their bodies well.</b></span></div></div><div class=\"lec-sent-ko\">그들이 몸을 잘 움직이지 못하더라도 문제가 되지 않아요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 장애 여부와 관계없이 누구나 음악이라는 예술에 참여할 수 있다는 포용적 메시지를 전달하며 글을 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">even if they can’t move (부사절): &#39;비록 ~일지라도&#39;라는 의미의 양보를 나타내는 접속사절로, 주절에 조건을 덧붙임</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">even if</td><td class=\"m\">비록 ~일지라도, 설령 ~라 하더라도</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>눈의 움직임만으로 음악을 연주하는 소프트웨어 &#39;EyeHarp&#39;가 개발되었다.</li><li>개발자 Zacharias는 사고로 팔을 쓰지 못하는 친구를 위해 이 프로그램을 만들었다.</li><li>화면의 색상을 응시하면 시선을 인식해 소리를 내는 직관적인 원리로 작동한다.</li><li>일반 악기와 같이 연습은 필요하지만, 신체 제약이 있는 사람도 음악을 즐길 수 있게 해준다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Zacharias developed EyeHarp to help his injured friend make music, and this software now enables people with physical limitations to play instruments through eye movements.</div>\n              <div class=\"lec-final-sum-ko\">Zacharias는 부상당한 친구가 음악을 만들 수 있도록 EyeHarp을 개발했으며, 이 소프트웨어는 현재 신체적 제약이 있는 사람들이 눈의 움직임을 통해 악기를 연주할 수 있게 한다.</div></div></div>"],"segs":[[{"audio":"./passage03_audio/1.mp3","hl":null}],[{"audio":"./passage03_audio/2.mp3","hl":null}],[{"audio":"./passage03_audio/3.mp3","hl":null},{"audio":"./passage03_audio/4.mp3","hl":"stage-0"},{"audio":"./passage03_audio/5.mp3","hl":"stage-1"},{"audio":"./passage03_audio/6.mp3","hl":"stage-2"}],[{"audio":"./passage03_audio/7.mp3","hl":null}],[{"audio":"./passage03_audio/8.mp3","hl":"main"},{"audio":"./passage03_audio/9.mp3","hl":"meaning"},{"audio":"./passage03_audio/10.mp3","hl":"grammar"}],[{"audio":"./passage03_audio/11.mp3","hl":"main"},{"audio":"./passage03_audio/12.mp3","hl":"meaning"},{"audio":"./passage03_audio/13.mp3","hl":"grammar"}],[{"audio":"./passage03_audio/14.mp3","hl":"main"},{"audio":"./passage03_audio/15.mp3","hl":"meaning"},{"audio":"./passage03_audio/16.mp3","hl":"grammar"}],[{"audio":"./passage03_audio/17.mp3","hl":"main"},{"audio":"./passage03_audio/18.mp3","hl":"meaning"},{"audio":"./passage03_audio/19.mp3","hl":"gra
