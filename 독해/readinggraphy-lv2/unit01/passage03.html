</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}

    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}

lecturePlayer(document.getElementById("app"),{"brand":"청명학원 영어과","title":"리딩그라피2 리딩그라피레벨2 3번","audioDir":"audio","preview":false,"count":48,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.400em\">리딩그라피레벨2\u003cbr>3번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩그라피2\u003c/div>\u003ch1>EyeHarp: Playing Music with the Gaze\u003c/h1>\u003ch2>EyeHarp: 눈으로 연주하는 선율\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>사고로 팔을 움직일 수 없게 된 친구를 위해 Zacharias가 개발한 \u003cb class=\"key\">EyeHarp\u003c/b>는 \u003cb class=\"key\">눈의 \u003c/b>\u003cb class=\"key\">움직임\u003c/b>만으로 음악을 연주하게 돕는 혁신적인 소프트웨어입니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>EyeHarp is an innovative assistive software that enables people with physical disabilities to experience the joy of music through eye movements.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분, 오늘은 눈동자의 움직임만으로 음악을 연주하는 아주 감동적인 기술 이야기를 준비했어요. 지문 속 EyeHarp라는 소프트웨어는 신체적 어려움을 극복하게 해주는 멋진 도구죠. 사고로 꿈을 잃을 뻔한 친구를 돕기 위한 한 과학자의 따뜻한 발명이 글 전체의 핵심 요약이에요. 오늘 수업을 통해 기술이 어떻게 우리 삶에 음악의 즐거움을 되찾아 주는지 함께 살펴봅시다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">이 지문의 핵심 소재인 \u003cb class=\"key\">보조 \u003c/b>\u003cb class=\"key\">공학(Assistive \u003c/b>\u003cb class=\"key\">Technology)\u003c/b>은 장애가 있는 사람들의 일상 활동이나 예술 활동을 돕는 기술을 의미합니다. 그중에서도 \u003cb class=\"key\">시선 \u003c/b>\u003cb class=\"key\">추적(Eye-tracking)\u003c/b> 기술은 카메라가 눈동자의 위치를 파악하여 마우스 클릭이나 악기 연주를 대신하게 합니다. 이는 마치 손을 쓰지 못하는 사람이 \u003cb class=\"key\">눈빛\u003c/b>만으로 지휘를 하는 것과 같은 원리입니다. \u003cb class=\"key\">Zacharias\u003c/b>의 발명은 기술이 인간의 한계를 극복하고 \u003cb class=\"key\">정서적 \u003c/b>\u003cb class=\"key\">치유\u003c/b>를 돕는 도구가 될 수 있음을 보여줍니다. 이러한 기술 덕분에 사고로 꿈을 포기했던 이들이 다시금 \u003cb class=\"key\">예술적 \u003c/b>\u003cb class=\"key\">자아\u003c/b>를 표현할 수 있게 되었습니다.\u003c/div>","segs":[{"n":2,"text":"여러분, 보조 공학이라는 말을 들어본 적 있나요? 장애가 있는 분들이 일상생활을 더 편하게 하도록 돕는 기술을 뜻해요. 그중에서도 시선 추적 기술은 눈동자의 위치를 카메라로 읽어내서 컴퓨터를 조작하게 해주죠. 마치 손을 쓰지 못할 때 누군가 내 눈이 머무는 곳을 대신 눌러주는 투명 마우스 같은 존재라고 생각하면 이해하기 쉬워요. 오늘 주인공인 자카리아스는 이 기술을 활용해 예술이라는 희망을 선물했습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>눈으로 하는 연주\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>\u003cb class=\"key\">눈동자의 \u003c/b>\u003cb class=\"key\">움직임\u003c/b>만으로 음악을 연주하는 상상을 현실로 만들어주는 \u003cb class=\"key\">EyeHarp\u003c/b>를 소개하며 글을 시작합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>개발 배경\u003csmall>원인 및 동기 · 문장 3–6\u003c/small>\u003c/h4>\u003cp>음악가이자 과학자인 Zacharias가 \u003cb class=\"key\">오토바이 \u003c/b>\u003cb class=\"key\">사고\u003c/b>로 팔을 못 쓰게 된 친구를 돕기 위해 프로그램을 만들게 된 \u003cb class=\"key\">계기\u003c/b>를 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>작동 원리\u003csmall>설명 · 문장 7–8\u003c/small>\u003c/h4>\u003cp>컴퓨터 화면의 \u003cb class=\"key\">색상과 \u003c/b>\u003cb class=\"key\">음계\u003c/b>를 시선으로 따라가면 프로그램이 그에 맞는 소리를 내는 구체적인 \u003cb class=\"key\">구동 \u003c/b>\u003cb class=\"key\">방식\u003c/b>을 보여줍니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>노력과 가치\u003csmall>결론 · 문장 9–12\u003c/small>\u003c/h4>\u003cp>숙달을 위한 \u003cb class=\"key\">연습\u003c/b>은 필요하지만, 신체적 제약에 상관없이 모든 사람에게 \u003cb class=\"key\">음악의 \u003c/b>\u003cb class=\"key\">즐거움\u003c/b>을 준다는 점을 강조합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 눈으로 연주하는 새로운 방법의 소개부터 시작해서 개발의 감동적인 배경, 그리고 그 작동 원리와 가치 순서로 이어져요.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서는 눈동자만 움직여서 연주를 한다는 매혹적인 제안을 던지며 EyeHarp라는 이름을 처음으로 꺼냅니다.","hl":"f0"},{"n":5,"text":"세 번째 문장부터 여섯 번째 문장까지는 이 기적 같은 소프트웨어가 왜 만들어졌는지 설명해요. 오토바이 사고로 팔을 움직이지 못하게 된 친구를 위해 자카리아스가 결심을 굳히는 장면이죠.","hl":"f1"},{"n":6,"text":"일곱 번째와 여덟 번째 문장은 실제 작동 방식을 구체적으로 보여줍니다. 화면 속 다채로운 원과 음계를 눈으로 쳐다보면 프로그램이 시선을 추적해 소리를 들려준다는 원리예요.","hl":"f2"},{"n":7,"text":"아홉 번째부터 마지막 열두 번째 문장에서는 다른 악기처럼 연습이 필요하다는 사실을 짚어주며, 동시에 모든 사람이 신체 조건에 상관없이 음악을 즐길 수 있다는 큰 가치를 전달합니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 11번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">사고로 인한 \u003cb class=\"key\">신체적 \u003c/b>\u003cb class=\"key\">제약\u003c/b>이라는 문제 상황에 대해 EyeHarp라는 \u003cb class=\"key\">기술적 \u003c/b>\u003cb class=\"key\">해결책\u003c/b>을 제시합니다. 후반부에서 이 소프트웨어가 주는 \u003cb class=\"key\">보편적 \u003c/b>\u003cb class=\"key\">가치\u003c/b>를 강조하며 글을 마무리하는 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Thanks to (2)\u003c/b>\u003cspan>결과를 이끄는 전치사구\u003c/span>\u003cb>So (6)\u003c/b>\u003cspan>인과관계 연결어\u003c/span>\u003cb>However (11)\u003c/b>\u003cspan>강조를 위한 역접\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">playing your favorite music\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">EyeHarp\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">software program\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">how EyeHarp works\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">instruments\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">amazing software\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 지문은 사고라는 문제 상황에 대해 EyeHarp라는 해결책을 제시하는 문제 해결 구조를 가지고 있어요. 특히 글의 마지막 부분에서 이 소프트웨어가 주는 놀라운 가치를 강조하며 마무리하는 미괄식 패턴을 보여줍니다.","hl":"ty"},{"n":9,"text":"문장 중간에 보면 Thanks to 라는 표현으로 이 모든 것이 가능해진 원인을 짚어주고, 여섯 번째 문장의 So 를 통해 친구를 돕고자 결심한 결과를 명확히 해줍니다. 마지막에 However 를 사용한 것은 단순히 악기라는 사실을 넘어 이 소프트웨어가 주는 진짜 감동을 강조하기 위한 장치죠.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>imagine\u003c/b>\u003cem>동사\u003c/em>\u003cspan>상상하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>favorite\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>가장 좋아하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>move\u003c/b>\u003cem>동사\u003c/em>\u003cspan>움직이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>thanks to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~ 덕분에\u003c/span>\u003c/div>\u003cdiv>\u003cb>software\u003c/b>\u003cem>명사\u003c/em>\u003cspan>소프트웨어\u003c/span>\u003c/div>\u003cdiv>\u003cb>possible\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>가능한\u003c/span>\u003c/div>\u003cdiv>\u003cb>musician\u003c/b>\u003cem>명사\u003c/em>\u003cspan>음악가\u003c/span>\u003c/div>\u003cdiv>\u003cb>computer scientist\u003c/b>\u003cem>명사\u003c/em>\u003cspan>컴퓨터 과학자\u003c/span>\u003c/div>\u003cdiv>\u003cb>motorcycle accident\u003c/b>\u003cem>명사\u003c/em>\u003cspan>오토바이 사고\u003c/span>\u003c/div>\u003cdiv>\u003cb>be able to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~할 수 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>because of\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~ 때문에\u003c/span>\u003c/div>\u003cdiv>\u003cb>injury\u003c/b>\u003cem>명사\u003c/em>\u003cspan>부상\u003c/span>\u003c/div>\u003cdiv>\u003cb>decide\u003c/b>\u003cem>동사\u003c/em>\u003cspan>결심하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>create\u003c/b>\u003cem>동사\u003c/em>\u003cspan>만들다, 창조하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>how it works\u003c/b>\u003cem>명사구\u003c/em>\u003cspan>작동 방식\u003c/span>\u003c/div>\u003cdiv>\u003cb>colorful\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>다채로운\u003c/span>\u003c/div>\u003cdiv>\u003cb>scale\u003c/b>\u003cem>명사\u003c/em>\u003cspan>음계\u003c/span>\u003c/div>\u003cdiv>\u003cb>specific\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>특정한\u003c/span>\u003c/div>\u003cdiv>\u003cb>follow\u003c/b>\u003cem>동사\u003c/em>\u003cspan>따라가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>instrument\u003c/b>\u003cem>명사\u003c/em>\u003cspan>악기\u003c/span>\u003c/div>\u003cdiv>\u003cb>take time\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>시간이 걸리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>practice\u003c/b>\u003cem>명사\u003c/em>\u003cspan>연습\u003c/span>\u003c/div>\u003cdiv>\u003cb>amazing\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>놀라운\u003c/span>\u003c/div>\u003cdiv>\u003cb>joy\u003c/b>\u003cem>명사\u003c/em>\u003cspan>즐거움\u003c/span>\u003c/div>\u003cdiv>\u003cb>matter\u003c/b>\u003cem>동사\u003c/em>\u003cspan>문제가 되다, 중요하다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"중요한 단어들을 살펴볼까요? Thanks to 는 전치사처럼 쓰여 뒤에 명사가 오고 무엇 덕분에 라는 뜻입니다. 그리고 How it works 는 그것이 작동하는 방식이라는 뜻으로 지문의 핵심 과정을 설명할 때 쓰였죠.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">possible\u003c/b>\u003cspan class=\"m\">가능한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">feasible\u003c/span>\u003cspan class=\"s\">achievable\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">impossible\u003c/span>\u003cspan class=\"a\">impractical\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">injury\u003c/b>\u003cspan class=\"m\">부상\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">wound\u003c/span>\u003cspan class=\"s\">harm\u003c/span>\u003cspan class=\"s\">damage\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">decide\u003c/b>\u003cspan class=\"m\">결심하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">determine\u003c/span>\u003cspan class=\"s\">resolve\u003c/span>\u003cspan class=\"s\">settle\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hesitate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">specific\u003c/b>\u003cspan class=\"m\">특정한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">particular\u003c/span>\u003cspan class=\"s\">certain\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">general\u003c/span>\u003cspan class=\"a\">vague\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">amazing\u003c/b>\u003cspan class=\"m\">놀라운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">wonderful\u003c/span>\u003cspan class=\"s\">incredible\u003c/span>\u003cspan class=\"s\">astonishing\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ordinary\u003c/span>\u003cspan class=\"a\">common\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 챙겨보세요. Possible 은 가능한이라는 뜻으로 feasible 이나 achievable 로 바꿔 쓸 수 있지만 반대말인 impossible 도 꼭 기억해야 해요. Amazing 은 놀라운이라는 뜻인데 ordinary 라는 평범한 이라는 뜻의 반의어와 함께 공부하면 기억에 더 잘 남을 거예요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상상해 보세요\u003c/span>\u003cspan class=\"en\">03 \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Imagine \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분이 가장 좋아하는 음악을 연주하는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">playing\u003c/span> your favorite music\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단지 여러분의 눈동자만 움직여서.\u003c/span>\u003cspan class=\"en\">just \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">moving\u003c/span> your eyes.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여러분의 눈동자만 움직여서 여러분이 가장 좋아하는 음악을 연주하는 것을 상상해 보세요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 독자의 호기심을 자극하며 글의 \u003cb class=\"key\">주제\u003c/b>인 눈동자를 이용한 음악 연주를 소개합니다. 눈동자 움직임만으로 연주가 가능하다는 흥미로운 \u003cb class=\"key\">가정\u003c/b>을 제시하며 시작합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사를 목적어로 취하는 동사\u003c/span> : Imagine + [V-ing (목적어)] : \"연주하는 것을 상상하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 by + 동명사\u003c/span> : by + [V-ing] : \"움직임으로써\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Imagine, 상상해 보세요. playing your favorite music, 여러분이 가장 좋아하는 음악을 연주하는 것을. just by moving your eyes, 단지 여러분의 눈동자만 움직여서.. 이 문장 전체를 해석하면, 여러분의 눈동자만 움직여서 여러분이 가장 좋아하는 음악을 연주하는 것을 상상해 보세요.","hl":"m"},{"n":13,"text":"이 문장은 도입부에서 눈동자 연주라는 주제를 던지며 독자의 흥미를 끕니다. 손이 아닌 눈동자로 연주한다는 파격적인 가정을 통해 글의 방향을 보여주고 있죠.","hl":"mn"},{"n":14,"text":"첫 번째 포인트로 Imagine은 뒤에 동명사를 목적어로 쓰는 동사라 playing 형태가 왔어요. 두 번째로 전치사 by 뒤에 동명사가 오면 구체적인 수단을 의미하니 눈을 움직이는 방법으로 연주한다는 뜻이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">EyeHarp라는 소프트웨어 프로그램 덕분에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Thanks \u003c/span>\u003cspan class=\"tgt\">to\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">software \u003c/span>\u003cspan class=\"tgt\">program, \u003c/span>\u003cspan class=\"tgt\">EyeHarp\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이제 이것이 가능해요.\u003c/span>\u003cspan class=\"en\">this is now possible.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">EyeHarp라는 소프트웨어 프로그램 덕분에 이제 이것이 가능해요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 상상을 현실로 만들어준 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">도구\u003c/b>인 EyeHarp를 소개합니다. 기술의 발전이 불가능했던 상황을 \u003cb class=\"key\">가능\u003c/b>하게 만들었음을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이유의 전치사구\u003c/span> : Thanks to + [명사(구)] : \"~ 덕분에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동격의 콤마\u003c/span> : [명사구1], [명사구2] : \"소프트웨어 프로그램인 EyeHarp\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Thanks to the software program, EyeHarp, EyeHarp라는 소프트웨어 프로그램 덕분에. this is now possible, 이제 이것이 가능해요.. 이 문장 전체를 해석하면, EyeHarp라는 소프트웨어 프로그램 덕분에 이제 이것이 가능해요.","hl":"m"},{"n":16,"text":"앞에서 상상했던 일이 현실이 된 이유를 설명합니다. 핵심 도구인 EyeHarp 덕분에 불가능이 가능으로 바뀌었음을 강조하고 있어요.","hl":"mn"},{"n":17,"text":"첫 번째로 Thanks to는 긍정적인 원인을 말할 때 쓰는 전치사구입니다. 두 번째로 콤마 앞뒤의 명사구는 서로 같은 것을 가리키는 동격 관계라서 프로그램의 이름이 무엇인지 보충해 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Zacharias는 ~예요\u003c/span>\u003cspan class=\"en\">Zacharias is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">음악가이자 컴퓨터 과학자.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">musician \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">computer \u003c/span>\u003cspan class=\"tgt\">scientist\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Zacharias는 음악가이자 컴퓨터 과학자예요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> EyeHarp를 만든 \u003cb class=\"key\">인물\u003c/b>인 Zacharias를 소개합니다. 두 분야의 \u003cb class=\"key\">전문성\u003c/b>이 합쳐져 이 혁신적인 프로그램이 탄생했음을 암시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">병렬 구조의 보어\u003c/span> : [명사1] and [명사2] : \"음악가이자 컴퓨터 과학자\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Zacharias is, Zacharias는 ~예요. a musician and computer scientist, 음악가이자 컴퓨터 과학자.. 이 문장 전체를 해석하면, Zacharias는 음악가이자 컴퓨터 과학자예요.","hl":"m"},{"n":19,"text":"프로그램을 만든 인물의 정보를 제공하는 문장입니다. 음악과 컴퓨터 과학이라는 두 가지 전문성이 결합되어 이런 발명품이 나왔다는 배경을 보여주죠.","hl":"mn"},{"n":20,"text":"여기서는 and라는 접속사가 두 명사를 나란히 연결하고 있어요. 이 덩어리 전체가 주어인 Zacharias가 누구인지 설명하는 보어 역할을 하고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">2010년에,\u003c/span>\u003cspan class=\"en\">In 2010,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 음악가 친구가\u003c/span>\u003cspan class=\"en\">his musician friend\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">심각한 오토바이 사고를 당했어요.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">had\u003c/span> a bad motorcycle accident.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">2010년에, 그의 음악가 친구가 심각한 오토바이 사고를 당했어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> EyeHarp이라는 소프트웨어가 만들어지게 된 결정적인 \u003cb class=\"key\">과거의 \u003c/b>\u003cb class=\"key\">계기\u003c/b>를 설명하며, 글의 흐름이 본격적인 \u003cb class=\"key\">사건 \u003c/b>\u003cb class=\"key\">전개\u003c/b>로 전환됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거 시제(동사의 변화)\u003c/span> : have [동사 원형] -&gt; had [과거형] : \"당했다/가졌다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"In 2010, 2010년에. his musician friend, 그의 음악가 친구가. had a bad motorcycle accident, 심각한 오토바이 사고를 당했어요.. 이 문장 전체를 해석하면, 2010년에, 그의 음악가 친구가 심각한 오토바이 사고를 당했어요.","hl":"m"},{"n":22,"text":"이 문장은 EyeHarp이 왜 만들어졌는지 그 배경을 설명하고 있어요. 2010년이라는 구체적인 과거 시점에 일어난 사건을 보여주며 이야기의 발단이 되는 부분이죠.","hl":"mn"},{"n":23,"text":"첫 번째 문법 포인트는 과거 시제입니다. 문장 앞에 In 2010처럼 명확한 과거를 나타내는 표현이 나오면 동사를 과거형으로 써야 해요. 그래서 have가 아니라 had를 썼다는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003csp u003cb class=\"key\">활동의 \u003c/b>\u003cb class=\"key\">방해\u003c/b>가 되지 않는다는 결론입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가주어 It과 양보의 부사절\u003c/span> : It [가주어] + doesn't matter [동사구] + even if clause [진주어 역할을 하는 부사절] : \"설령 ~하더라도 중요하지 않다\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"It doesn't matter, 문제가 되지 않아요. even if, 비록 ~일지라도. they can't move, 그들이 움직이지 못하더라도. their bodies well, 그들의 몸을 잘.. 이 문장 전체를 해석하면, 그들이 몸을 잘 움직이지 못하더라도 문제가 되지 않아요.","hl":"m"},{"n":46,"text":"마지막 문장은 이 장치의 핵심 목적을 다시 확인해 줍니다. 몸을 움직이기 힘든 사람들도 시선만 있으면 연주할 수 있기 때문에, 물리적 장벽은 더 이상 음악 활동의 방해가 되지 않는다는 결론을 내리고 있어요.","hl":"mn"},{"n":47,"text":"여기서 It doesn't matter의 It은 가주어라고 불러요. 그리고 뒤에 나오는 even if는 설령 무엇일지라도라는 뜻을 가진 양보의 접속사예요. 그래서 몸을 잘 못 움직이는 상황일지라도 전혀 상관없다는 의미를 완벽하게 만들어줍니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>\u003cb class=\"key\">EyeHarp\u003c/b>는 눈의 움직임을 감지하여 음악을 연주하게 해주는 혁신적인 소프트웨어입니다.\u003c/li>\u003cli>과학자 Zacharias는 사고로 팔을 쓰지 못하게 된 친구를 돕기 위해 이 도구를 \u003cb class=\"key\">개발\u003c/b>했습니다.\u003c/li>\u003cli>화면상의 \u003cb class=\"key\">음계와 \u003c/b>\u003cb class=\"key\">색상\u003c/b>을 시선으로 쫓는 방식으로 작동하며, 일반 악기처럼 연습이 필요합니다.\u003c/li>\u003cli>신체적 제약이 있는 사람들을 포함한 모두에게 \u003cb class=\"key\">음악의 \u003c/b>\u003cb class=\"key\">즐거움\u003c/b>을 선사하는 놀라운 가치를 지닙니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>EyeHarp is an innovative assistive software that enables people with physical disabilities to experience the joy of music through eye movements.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">사고로 팔을 움직일 수 없게 된 친구를 위해 Zacharias가 개발한 \u003cb class=\"key\">EyeHarp\u003c/b>는 \u003cb class=\"key\">눈의 \u003c/b>\u003cb class=\"key\">움직임\u003c/b>만으로 음악을 연주하게 돕는 혁신적인 소프트웨어입니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":48,"text":"오늘 우리는 기술과 사랑이 만나 탄생한 EyeHarp에 대해 배웠습니다. 신체적 한계가 있더라도 음악의 즐거움은 누구에게나 열려 있다는 메시지가 참 따뜻하죠? 복습할 때 이 기술의 작동 원리와 자카리아스의 동기를 다시 한번 생각해보세요. 다음 시간에 더 흥미로운 지문으로 만나요, 수고하셨습니다!","hl":null}]}]});</script></body></html>
