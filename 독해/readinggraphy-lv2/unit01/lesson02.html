</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}

    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}

lecturePlayer(document.getElementById("app"),{"brand":"청명학원 영어과","title":"리딩그라피2 리딩그라피레벨2 2번","audioDir":"audio","preview":false,"count":51,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.400em\">리딩그라피레벨2\u003cbr>2번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩그라피2\u003c/div>\u003ch1>The Jarramplas Festival: A Tale of Turnips and Honor\u003c/h1>\u003ch2>하람플라스 축제: 순무와 영광의 이야기\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>스페인 Piornal의 \u003cb class=\"key\">하람플라스 \u003c/b>\u003cb class=\"key\">축제\u003c/b>는 과거 동물을 훔친 \u003cb class=\"key\">도둑\u003c/b>을 쫓아내던 전설에서 유래하여, 오늘날 마을 사람들이 \u003cb class=\"key\">순무\u003c/b>를 던지며 전통을 이어가는 독특한 행사입니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The Jarramplas Festival is a unique Spanish tradition where villagers throw turnips at volunteer monsters to commemorate a local legend about driving away a thief.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 스페인의 아주 이색적이고 활기찬 전통 축제에 대해 배워볼 거예요. 바로 Jarramplas Festival이라는 축제인데요, 마을 사람들이 괴물에게 순무를 던지는 독특한 풍습을 담고 있습니다. 이 글의 요지는 이 축제가 단순히 괴롭히는 것이 아니라, 마을의 역사와 전설을 기리는 영광스러운 전통이라는 점이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">스페인 Piornal에서 열리는 \u003cb class=\"key\">Jarramplas \u003c/b>\u003cb class=\"key\">축제\u003c/b>는 매년 1월 19일과 20일에 열리는 독특한 민속 행사입니다. 이 축제는 마을의 평화를 어지럽혔던 \u003cb class=\"key\">도둑(thief)\u003c/b>에 대한 고대 전설을 바탕으로 하며, 우리나라의 \u003cb class=\"key\">액막이 \u003c/b>\u003cb class=\"key\">풍습\u003c/b>과 유사한 성격을 가집니다. 주인공인 Jarrampla는 동물을 훔치던 도둑을 상징하며, 마을 사람들은 그에게 \u003cb class=\"key\">순무(turnip)\u003c/b>를 던지는 행위를 통해 과거의 승리를 재현합니다. 비록 격렬한 몸싸움과 투척이 오가지만, 이는 단순한 폭력이 아니라 공동체의 \u003cb class=\"key\">역사적 \u003c/b>\u003cb class=\"key\">자부심\u003c/b>을 확인하는 축제의 장입니다.\u003c/div>","segs":[{"n":2,"text":"축제의 배경을 먼저 알아볼까요? 스페인의 Piornal이라는 곳에서 열리는 Jarramplas Festival은 일종의 액막이 행사와 비슷합니다. 옛날에 마을 농부들의 동물을 훔쳐가던 아주 얄미운 도둑이 있었는데, 그를 응징하던 기억을 축제로 만든 것이죠. 여기서 순무, 즉 turnip은 그 도둑을 쫓아내기 위한 도구였답니다. 오늘날에는 이 도둑이 monsters로 상징화되어 나타나는 것이죠.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>축제의 도입\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>스페인 Piornal에서 매년 열리는 \u003cb class=\"key\">Jarramplas \u003c/b>\u003cb class=\"key\">축제\u003c/b>를 소개하며, 마을 사람들이 \u003cb class=\"key\">몬스터\u003c/b>에게 순무를 던지는 이색적인 풍경을 묘사합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>몬스터의 정체와 준비\u003csmall>상세 설명 · 문장 3–6\u003c/small>\u003c/h4>\u003cp>\u003cb class=\"key\">몬스터\u003c/b>의 정체는 마을 주민이며, 화려한 의상과 몸을 보호하기 위한 \u003cb class=\"key\">특별한 \u003c/b>\u003cb class=\"key\">보호 \u003c/b>\u003cb class=\"key\">장치\u003c/b>를 착용한다는 점을 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>축제의 유래\u003csmall>근거 및 배경 · 문장 7–10\u003c/small>\u003c/h4>\u003cp>축제의 근간이 되는 \u003cb class=\"key\">현지 \u003c/b>\u003cb class=\"key\">이야기\u003c/b>를 들려주며, 농부들이 동물을 훔친 \u003cb class=\"key\">도둑\u003c/b>을 쫓아내기 위해 순무를 던졌던 과거를 언급합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>현대의 의미와 인기\u003csmall>결론 · 문장 11–13\u003c/small>\u003c/h4>\u003cp>몬스터 역할을 수행하는 것이 \u003cb class=\"key\">큰 \u003c/b>\u003cb class=\"key\">영광\u003c/b>으로 여겨져, 수많은 \u003cb class=\"key\">대기자 \u003c/b>\u003cb class=\"key\">명단\u003c/b>이 있을 정도로 축제가 사랑받고 있음을 강조합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 이제 지문의 내용을 단계별로 함께 살펴볼까요?","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서는 축제의 시기와 장소, 그리고 가장 중요한 활동인 순무 던지기를 소개하고 있어요. 매년 일월 십구 일과 이십 일에 마을 사람들이 몬스터를 쫓으며 turnip을 던진다고 설명하죠.","hl":"f0"},{"n":5,"text":"세 번째부터 여섯 번째 문장에서는 그 몬스터의 정체를 밝힙니다. 사실 몬스터는 마을 주민 두 명이 역할을 맡는 것이고, 화려한 옷 아래에 다치지 않으려고 protection, 즉 보호 장치를 철저히 입는다는 사실을 알려주네요.","hl":"f1"},{"n":6,"text":"일곱 번째부터 열 번째 문장은 이 축제의 진짜 이유인 전설을 들려줍니다. 도둑이었던 el Jarrampla가 농부들의 동물을 훔치자, 농부들이 그를 chase away, 즉 쫓아내기 위해 순무를 던졌다는 배경을 설명하고 있어요.","hl":"f2"},{"n":7,"text":"마지막 열한 번째부터 열세 번째 문장에서는 이 축제의 현재 위상을 보여줍니다. 몬스터 역할을 하면 멍이 들 수도 있지만, 사람들은 이를 big honor, 즉 큰 영광으로 생각해서 대기자 명단에 이천 명이나 이름을 올리고 있답니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">질문-답변 및 인과\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 12번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글의 중반부에서 \u003cb class=\"key\">질문(Who \u003c/b>\u003cb class=\"key\">are \u003c/b>\u003cb class=\"key\">the \u003c/b>\u003cb class=\"key\">monsters?)\u003c/b>을 통해 독자의 호기심을 유발하고, 축제의 \u003cb class=\"key\">유래(Origin)\u003c/b>를 설명한 뒤, 마지막에 이 축제가 갖는 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">가치와 \u003c/b>\u003cb class=\"key\">영광\u003c/b>을 결론으로 제시하고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>So, who are the monsters? (3)\u003c/b>\u003cspan>독자의 주의를 환기하는 질문\u003c/span>\u003cb>based on (7)\u003c/b>\u003cspan>유래 및 근거 제시\u003c/span>\u003cb>But (12)\u003c/b>\u003cspan>역설적 의미 강조 (부상에도 불구하고 영광임)\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">monsters\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Two people from the village\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">el Jarrampla\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the thief\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>과거의 도둑 (el Jarrampla)\u003c/th>\u003cth>현재의 몬스터 (Village act)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>실제로 동물을 훔친 범죄자\u003c/td>\u003ctd>마을을 대표해 역할을 수행하는 자원봉사자\u003c/td>\u003c/tr>\u003ctr>\u003ctd>처벌을 위해 순무를 맞음\u003c/td>\u003ctd>전통을 기리고 영광을 얻기 위해 순무를 맞음\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 질문을 던지고 그에 대한 답을 해나가는 질문 답변 구조와, 과거의 사건이 현재의 축제로 이어진다는 인과 관계를 보여주고 있습니다. 특히 글의 뒷부분에 핵심 가치를 담고 있는 중괄식 구조를 취하고 있어요.","hl":"ty"},{"n":9,"text":"세 번째 문장의 So, who are the monsters? 라는 질문이 독자의 시선을 확 끌어당기죠? 그리고 일곱 번째 문장의 be based on을 통해 이 축제의 역사적 근거를 제시합니다. 마지막에 But이라는 연결어로 부상이라는 부정적 측면보다 영광이라는 긍정적 가치를 더 강조하고 있네요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>every year\u003c/b>\u003cem>부사구\u003c/em>\u003cspan>매년\u003c/span>\u003c/div>\u003cdiv>\u003cb>take place\u003c/b>\u003cem>동사구\u003c/em>\u003cspan>열리다, 개최되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>festival\u003c/b>\u003cem>명사\u003c/em>\u003cspan>축제\u003c/span>\u003c/div>\u003cdiv>\u003cb>chase\u003c/b>\u003cem>동사\u003c/em>\u003cspan>쫓다, 추격하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>throw\u003c/b>\u003cem>동사\u003c/em>\u003cspan>던지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>turnip\u003c/b>\u003cem>명사\u003c/em>\u003cspan>순무\u003c/span>\u003c/div>\u003cdiv>\u003cb>monster\u003c/b>\u003cem>명사\u003c/em>\u003cspan>몬스터, 괴물\u003c/span>\u003c/div>\u003cdiv>\u003cb>act as\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~의 역할을 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>village\u003c/b>\u003cem>명사\u003c/em>\u003cspan>마을\u003c/span>\u003c/div>\u003cdiv>\u003cb>costume\u003c/b>\u003cem>명사\u003c/em>\u003cspan>의상\u003c/span>\u003c/div>\u003cdiv>\u003cb>decorate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>장식하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>piece of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~의 조각\u003c/span>\u003c/div>\u003cdiv>\u003cb>cloth\u003c/b>\u003cem>명사\u003c/em>\u003cspan>천, 직물\u003c/span>\u003c/div>\u003cdiv>\u003cb>underneath\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~의 아래에, 안에\u003c/span>\u003c/div>\u003cdiv>\u003cb>protection\u003c/b>\u003cem>명사\u003c/em>\u003cspan>보호 장치, 보호\u003c/span>\u003c/div>\u003cdiv>\u003cb>avoid\u003c/b>\u003cem>동사\u003c/em>\u003cspan>피하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>get hurt\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>다치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>be based on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 근거하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>local\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>현지의, 지역의\u003c/span>\u003c/div>\u003cdiv>\u003cb>thief\u003c/b>\u003cem>명사\u003c/em>\u003cspan>도둑\u003c/span>\u003c/div>\u003cdiv>\u003cb>steal\u003c/b>\u003cem>동사\u003c/em>\u003cspan>훔치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>chase away\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>쫓아내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>bruise\u003c/b>\u003cem>명사\u003c/em>\u003cspan>멍\u003c/span>\u003c/div>\u003cdiv>\u003cb>in the end\u003c/b>\u003cem>부사구\u003c/em>\u003cspan>결국\u003c/span>\u003c/div>\u003cdiv>\u003cb>honor\u003c/b>\u003cem>명사\u003c/em>\u003cspan>영광, 명예\u003c/span>\u003c/div>\u003cdiv>\u003cb>waiting list\u003c/b>\u003cem>명사\u003c/em>\u003cspan>대기자 명단\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"중요한 단어들을 살펴볼까요? take place는 축제가 열리다라는 뜻이고, turnip은 이 축제의 핵심 소품인 순무를 말해요. 그리고 act as는 어떤 역할을 하다라는 뜻으로 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">take place\u003c/b>\u003cspan class=\"m\">개최되다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">happen\u003c/span>\u003cspan class=\"s\">occur\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">chase\u003c/b>\u003cspan class=\"m\">쫓다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">pursue\u003c/span>\u003cspan class=\"s\">follow\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">flee\u003c/span>\u003cspan class=\"a\">escape\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">avoid\u003c/b>\u003cspan class=\"m\">피하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">evade\u003c/span>\u003cspan class=\"s\">shun\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">face\u003c/span>\u003cspan class=\"a\">confront\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">thief\u003c/b>\u003cspan class=\"m\">도둑\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">robber\u003c/span>\u003cspan class=\"s\">burglar\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">honor\u003c/b>\u003cspan class=\"m\">영광\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">glory\u003c/span>\u003cspan class=\"s\">pride\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">shame\u003c/span>\u003cspan class=\"a\">disgrace\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"비슷한 말과 반대말도 정리해 볼게요. 개최되다라는 뜻의 take place는 happen이나 occur로 바꿔 쓸 수 있습니다. chase는 쫓아가는 거니까 pursue와 비슷하고, 반대로 도망가는 건 flee라고 하죠. 마지막으로 honor는 영광이나 자부심을 뜻하는 glory, pride와 비슷하지만, 수치심을 뜻하는 shame과는 반대되는 개념이에요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매년\u003c/span>\u003cspan class=\"en\">02 Every year\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1월 19일과 20일에,\u003c/span>\u003cspan class=\"en\">on January 19th and 20th,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Jarramplas 축제가\u003c/span>\u003cspan class=\"en\">the Jarramplas Festival\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">열린다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">takes \u003c/span>\u003cspan class=\"tgt\">place\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">스페인의 Piornal에서.\u003c/span>\u003cspan class=\"en\">in Piornal, Spain.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">매년 1월 19일과 20일에, 스페인의 Piornal에서는 Jarramplas 축제가 열린다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 축제가 언제 어디서 열리는지 \u003cb class=\"key\">구체적인 \u003c/b>\u003cb class=\"key\">정보\u003c/b>를 전달하며 글을 시작하는 도입부입니다. 스페인의 특정 지역에서 매년 열리는 \u003cb class=\"key\">연례 \u003c/b>\u003cb class=\"key\">행사\u003c/b>임을 알리고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">자동사구(개최되다)\u003c/span> : the Jarramplas Festival [주어] + takes place [동사구] : \"열린다, 개최된다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Every year, 매년. on January 19th and 20th, 1월 19일과 20일에. the Jarramplas Festival, Jarramplas 축제가. takes place, 열린다. in Piornal, Spain, 스페인의 Piornal에서.. 이 문장 전체를 해석하면, 매년 1월 19일과 20일에, 스페인의 Piornal에서는 Jarramplas 축제가 열린다.","hl":"m"},{"n":13,"text":"이 글은 스페인의 아주 특별한 축제를 소개하는 글이에요. 첫 번째 문장에서는 축제의 이름과 구체적인 날짜, 그리고 장소라는 구체적인 정보를 주면서 글을 시작하고 있죠.","hl":"mn"},{"n":14,"text":"여기서 중요한 표현은 takes place예요. 행사가 개최되다라는 뜻인데, 우리말로는 열린다고 해석하니까 수동태로 써야 할 것 같지만 능동태 형태로 쓴다는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 축제 기간 동안,\u003c/span>\u003cspan class=\"en\">During this festival,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마을의 모든 사람들은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">everyone\u003c/span> in town\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">쫓아다니며 던진다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">chases \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">throws\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">순무를\u003c/span>\u003cspan class=\"en\">*turnips\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몬스터 두 마리를 (향해).\u003c/span>\u003cspan class=\"en\">at two monsters.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 축제 기간 동안, 마을의 모든 사람들은 몬스터 두 마리를 쫓아다니며 순무를 던진다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 축제의 독특한 \u003cb class=\"key\">활동 \u003c/b>\u003cb class=\"key\">내용\u003c/b>을 묘사하고 있습니다. 마을 사람들이 모두 참여하여 특정 대상을 \u003cb class=\"key\">공격하는 \u003c/b>\u003cb class=\"key\">형식\u003c/b>의 축제임을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정대명사의 수 일치\u003c/span> : everyone [단수 주어] + chases... and throws [단수 동사] : \"모든 사람\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동사의 병렬 구조\u003c/span> : everyone [주어] + chases [동사1] + and + throws [동사2] : \"쫓아다니며 던진다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"During this festival, 이 축제 기간 동안. everyone in town, 마을의 모든 사람들은. chases and throws, 쫓아다니며 던진다. *turnips, 순무를. at two monsters, 몬스터 두 마리를 (향해).. 이 문장 전체를 해석하면, 이 축제 기간 동안, 마을의 모든 사람들은 몬스터 두 마리를 쫓아다니며 순무를 던진다.","hl":"m"},{"n":16,"text":"축제의 활기찬 장면이 그려지나요? 마을 사람들 전체가 참여해서 두 마리의 몬스터에게 순무를 던지는 것이 이 축제의 핵심 참여 방식이에요.","hl":"mn"},{"n":17,"text":"문법을 보면 주어가 everyone이죠? 뜻은 모든 사람이지만 문법적으로는 단수 취급을 해요. 그래서 첫 번째 동사 chase와 두 번째 동사 throw에 모두 에스(s)가 붙어서 병렬 구조를 이루고 있답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그럼,\u003c/span>\u003cspan class=\"en\">So,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">누구일까\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 몬스터들은?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">monsters?\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그럼, 그 몬스터들은 누구일까?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 언급된 '몬스터'에 대한 \u003cb class=\"key\">의문\u003c/b>을 제기합니다. 독자의 \u003cb class=\"key\">관심\u003c/b>을 끌며 자연스럽게 몬스터의 정체에 대한 다음 설명으로 넘어갑니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문문의 어순\u003c/span> : Who [의문사] + are [be동사] + the monsters [주어]? : \"그 몬스터들은 누구일까?\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"So, 그럼. who are, 누구일까. the monsters?, 그 몬스터들은?. 이 문장 전체를 해석하면, 그럼, 그 몬스터들은 누구일까?","hl":"m"},{"n":19,"text":"사람들이 순무를 던지는 대상인 몬스터가 도대체 누구인지 궁금증을 유발하는 단계예요. 이 질문을 통해 글의 다음 내용으로 시선을 집중시키고 있죠.","hl":"mn"},{"n":20,"text":"이 문장은 아주 간단한 의문문이에요. 주어인 the monsters가 복수형이니까 be동사는 are를 썼고, 의문문이라서 동사가 주어 앞으로 나갔다는 것만 확인하면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">두 사람이\u003c/span>\u003cspan class=\"en\">Two people\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마을의\u003c/span>\u003cspan class=\"en\">from the village\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">역할을 한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">act \u003c/span>\u003cspan class=\"tgt\">as\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몬스터\u003c/span>\u003cspan class=\"en\">the monsters.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">마을의 두 사람이 몬스터 역할을 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 마을 주민들이 직접 \u003cb class=\"key\">축제의 \u003c/b>\u003cb class=\"key\">주역\u003c/b>인 몬스터를 연기한다는 점을 설명하며 축제의 시작을 알립니다. \u003cb class=\"key\">el \u003c/b>\u003cb class=\"key\">Jarrampla\u003c/b>라는 캐릭터를 실제 사람이 수행함을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이어동사(구동사)의 의미\u003c/span> : act [자동사] + as [전치사] + 명사 : \"~의 역할을 하다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Two people, 두 사람이. from the village, 마을의. act as, 역할을 한다. the monsters, 몬스터. 이 문장 전체를 해석하면, 마을의 두 사람이 몬스터 역할을 한다.","hl":"m"},{"n":22,"text":"이 문장은 축제에서 가장 중요한 괴물 역할을 사실 마을 주민 두 명이 맡는다는 정보를 제공하고 있어요. 축제가 단순히 구경하는 것이 아니라 주민들의 참여로 이루어짐을 보여주죠.","hl":"mn"},{"n":23,"text":"여기서 act as는 하나의 덩어리로 기억하면 좋아요. 전치사 as 뒤에 오는 monsters라는 신분이나 역할을 수행한다는 뜻으로 쓰였답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 의상을 입는다\u003c/span>\u003cspan class=\"en\">They wear costumes\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">장식된\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">decorated \u003c/span>\u003cspan class=\"tgt\">with\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 수의 화려한 조각들로\u003c/span>\u003cspan class=\"en\">lots of colorful pieces\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">천\u003c/span>\u003cspan class=\"en\">of cloth.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 많은 수의 화려한 천 조각들로 장식된 의상을 입는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 몬스터 분장의 특징을 묘사하는 문장으로, 화려한 \u003cb class=\"key\">시각적 \u003c/b>\u003cb class=\"key\">요소\u003c/b>를 강조합니다. 명사를 뒤에서 꾸며주는 \u003cb class=\"key\">분사구문\u003c/b>의 후치 수식을 이해해야 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사의 후치 수식\u003c/span> : 명사(costumes) + 과거분사(decorated) + 전치사구 : \"~로 장식된\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"They wear costumes, 그들은 의상을 입는다. decorated with, 장식된. lots of colorful pieces, 많은 수의 화려한 조각들로. of cloth, 천. 이 문장 전체를 해석하면, 그들은 많은 수의 화려한 천 조각들로 장식된 의상을 입는다.","hl":"m"},{"n":25,"text":"몬스터가 어떤 모습인지 구체적으로 설명하는 문장이에요. 형형색색의 천 조각들로 뒤덮인 화려한 의상을 입는다는 것이 핵심이죠.","hl":"mn"},{"n":26,"text":"가장 중요한 부분은 costumes 뒤에 나오는 decorated with예요. 의상 입장에서는 장식되는 것이니까 과거분사를 써서 뒤에서 앞의 명사를 꾸며주는 구조를 꼭 익혀두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 의상 안에,\u003c/span>\u003cspan class=\"en\">Underneath these costumes,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 특별한 보호 장치를 착용한다\u003c/span>\u003cspan class=\"en\">they wear special protection\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">피하기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">avoid\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다치지 않는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">getting \u003c/span>\u003cspan class=\"tgt\">hurt\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 의상 안에, 그들은 다치지 않기 위해 특별한 보호 장치를 착용한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사람들이 무를 던지는 축제의 특성상 \u003cb class=\"key\">부상 \u003c/b>\u003cb class=\"key\">방지\u003c/b>가 필요함을 설명합니다. 화려한 겉모습과 대비되는 실용적인 \u003cb class=\"key\">보호 \u003c/b>\u003cb class=\"key\">장비\u003c/b>를 언급하며 긴장감을 조성합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : to + 동사원형(avoid) : \"피하기 위해서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동사 avoid의 목적어 (동명사)\u003c/span> : avoid + 동명사(~ing) : \"다치는 것을 피하다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Underneath these costumes, 이 의상 안에. they wear special protection, 그들은 특별한 보호 장치를 착용한다. to avoid, 피하기 위해. getting hurt, 다치지 않는 것을. 이 문장 전체를 해석하면, 이 의상 안에, 그들은 다치지 않기 위해 특별한 보호 장치를 착용한다.","hl":"m"},{"n":28,"text":"사람들이 무를 세게 던지기 때문에 몬스터 역할을 하는 사람들은 옷 속에 보호구를 입어야 한다는 내용이에요. 즐거운 축제지만 안전도 중요하다는 걸 보여주죠.","hl":"mn"},{"n":29,"text":"여기서는 두 가지 포인트를 볼게요. 첫 번째로 to avoid는 '~하기 위해서'라는 목적을 나타내는 부사적 용법이고요. 두 번째로 avoid 뒤에는 항상 ing 형태의 동명사가 목적어로 온다는 점을 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 축제는\u003c/span>\u003cspan class=\"en\">The festival\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바탕을 두고 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">based \u003c/span>\u003cspan class=\"tgt\">on\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">현지의 이야기에\u003c/span>\u003cspan class=\"en\">a local story.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 축제는 현지의 이야기에 바탕을 두고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Jarramplas 축제가 생겨나게 된 \u003cb class=\"key\">기원\u003c/b>이나 유래를 설명하는 문장입니다. 이 축제가 단순한 놀이가 아니라 지역의 \u003cb class=\"key\">전설\u003c/b>에서 시작되었음을 알려줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태 관용 표현\u003c/span> : be [be동사] + based on [과거분사+전치사] : \"~에 바탕을 두고 있다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"The festival, 그 축제는. is based on, 바탕을 두고 있다. a local story, 현지의 이야기에. 이 문장 전체를 해석하면, 그 축제는 현지의 이야기에 바탕을 두고 있다.","hl":"m"},{"n":31,"text":"이 문장은 Jarramplas 축제가 단순히 즐기기 위한 것이 아니라, 그 지역에 전해 내려오는 특별한 유래가 있다는 것을 설명해 주고 있어요. 축제의 기원을 밝히는 중요한 문장입니다.","hl":"mn"},{"n":32,"text":"첫 번째 어법 포인트는 is based on입니다. 축제가 스스로 바탕을 만드는 게 아니라 이야기에 의해 만들어진 것이기 때문에 수동태를 사용했고요, 전치사 on과 함께 쓰여서 무엇을 근거로 하는지 나타냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몬스터들은\u003c/span>\u003cspan class=\"en\">The monsters\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">도둑 역할을 한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">act \u003c/span>\u003cspan class=\"tgt\">as\u003c/span> the thief\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">el Jarrampla라는 이름의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">named\u003c/span> el Jarrampla.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">몬스터들은 el Jarrampla라는 이름의 도둑 역할을 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 축제에 등장하는 몬스터가 전설 속의 어떤 \u003cb class=\"key\">인물\u003c/b>을 상징하는지 정의합니다. 몬스터는 실제 괴물이 아니라 전설 속의 \u003cb class=\"key\">도둑\u003c/b>을 연기하는 것임을 밝힙니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사구\u003c/span> : act [동사] + as [전치사] : \"~의 역할을 하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사의 후치수식\u003c/span> : thief [명사] + named [과거분사] : \"~라고 불리는\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"The monsters, 몬스터들은. act as the thief, 도둑 역할을 한다. named el Jarrampla, el Jarrampla라는 이름의. 이 문장 전체를 해석하면, 몬스터들은 el Jarrampla라는 이름의 도둑 역할을 한다.","hl":"m"},{"n":34,"text":"축제에서 사람들이 괴롭히는 그 몬스터들이 사실은 전설 속의 도둑인 el Jarrampla를 연기하고 있다는 내용이에요. 몬스터의 정체를 알려주는 부분이죠.","hl":"mn"},{"n":35,"text":"첫 번째로 act as는 ~의 역할을 하다는 뜻으로 쓰였어요. 두 번째로 중요한 포인트는 named인데요. 앞에 있는 thief를 뒤에서 꾸며주는 과거분사로, ~라고 이름 붙여진 또는 ~라는 이름의라고 해석하면 자연스럽습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 이야기에서,\u003c/span>\u003cspan class=\"en\">In the story,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">도둑은 동물을 훔쳤다\u003c/span>\u003cspan class=\"en\">the thief stole animals\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">농부들에게서\u003c/span>\u003cspan class=\"en\">from the farmers.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 이야기에서, 도둑은 농부들에게서 동물을 훔쳤다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 도둑이 저지른 구체적인 \u003cb class=\"key\">잘못\u003c/b>을 설명하여, 왜 사람들이 그에게 순무를 던지게 되었는지 \u003cb class=\"key\">인과관계\u003c/b>를 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">동사 문형\u003c/span> : steal [동사] + A [목적어] + from B [전치사구] : \"B에게서 A를 훔치다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"In the story, 그 이야기에서. the thief stole animals, 도둑은 동물을 훔쳤다. from the farmers, 농부들에게서. 이 문장 전체를 해석하면, 그 이야기에서, 도둑은 농부들에게서 동물을 훔쳤다.","hl":"m"},{"n":37,"text":"이 문장은 도둑이 지은 죄가 무엇인지 말해줍니다. 농부들의 소중한 동물을 훔쳤기 때문에 나중에 마을 사람들이 화가 나서 순무를 던지는 상황이 벌어지는 것이죠.","hl":"mn"},{"n":38,"text":"여기서는 steal의 과거형인 stole이 쓰였습니다. 그리고 stole animals from the farmers 구성을 잘 보세요. steal A from B라고 하면 B에게서 A를 훔치다라는 뜻이 되어, 농부들로부터 동물을 훔쳤다는 의미를 완성합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그를 쫓아내기 위해,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">To \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">chase \u003c/span>\u003cspan class=\"tgt\">him \u003c/span>\u003cspan class=\"tgt\">away\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">농부들은 순무를 던졌다\u003c/span>\u003cspan class=\"en\">the farmers threw turnips\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그에게.\u003c/span>\u003cspan class=\"en\">at him.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그를 쫓아내기 위해, 농부들은 그에게 순무를 던졌다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 축제에서 왜 순무를 던지는지 그 \u003cb class=\"key\">역사적 \u003c/b>\u003cb class=\"key\">배경\u003c/b>을 설명하는 문장입니다. 농부들이 도둑을 마을에서 \u003cb class=\"key\">추방\u003c/b>하기 위해 취했던 행동을 묘사합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법 (목적)\u003c/span> : To + [동사원형] (~하기 위하여) : \"쫓아내기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어동사의 어순 (대명사 목적어)\u003c/span> : [타동사] + [대명사 목적어] + [부사] : \"그를 쫓아내다\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"To chase him away, 그를 쫓아내기 위해. the farmers threw turnips, 농부들은 순무를 던졌다. at him, 그에게.. 이 문장 전체를 해석하면, 그를 쫓아내기 위해, 농부들은 그에게 순무를 던졌다.","hl":"m"},{"n":40,"text":"이 문장은 축제에서 왜 사람들이 순무를 던지게 되었는지 그 유래를 설명합니다. 도둑을 마을에서 내쫓는 방법으로 순무를 선택했다는 것이 포인트예요.","hl":"mn"},{"n":41,"text":"첫 번째로 To chase는 문장 맨 앞에서 목적을 나타내는 부사적 용법으로 쓰였어요. 두 번째로 chase him away처럼 동사와 부사 사이에 대명사 목적어가 위치해야 한다는 점을 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">두 몬스터는 가질지도 모른다 약간의 멍을 결국.\u003c/span>\u003cspan class=\"en\">The two monsters \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">might \u003c/span>\u003cspan class=\"tgt\">have\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">few\u003c/span> **bruises in the end.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">두 몬스터는 결국 멍이 좀 들지도 모른다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 축제의 실제적인 \u003cb class=\"key\">부작용\u003c/b>이나 위험성을 언급하며 현장의 \u003cb class=\"key\">생동감\u003c/b>을 전달합니다. 'might'를 통해 부상이 필수는 아니지만 발생 가능하다는 점을 시사합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사의 추측\u003c/span> : might + [동사원형] : \"가질지도 모른다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수량 형용사 (가산 명사 수식)\u003c/span> : a few + [복수 가산 명사] : \"약간의, 몇몇의\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"The two monsters, 두 몬스터는. might have, 가질지도 모른다. a few bruises, 약간의 멍을. in the end, 결국.. 이 문장 전체를 해석하면, 두 몬스터는 결국 멍이 좀 들지도 모른다.","hl":"m"},{"n":43,"text":"축제가 꽤 격렬하기 때문에 주인공들이 부상을 입을 수도 있다는 점을 보여줍니다. 하지만 이것은 축제의 열기를 보여주는 장치이기도 하죠.","hl":"mn"},{"n":44,"text":"첫 번째로 might는 확신이 아닌 약한 추측을 나타내는 조동사예요. 두 번째로 a few는 bruises라는 셀 수 있는 복수 명사와 결합하여 약간의 멍이 있다는 뜻을 만듭니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 Piornal 사람들은 생각한다\u003c/span>\u003cspan class=\"en\">But people in Piornal \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">think\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">el Jarrampla 역할을 하는 것이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">playing\u003c/span> el Jarrampla\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">큰 영광이라고.\u003c/span>\u003cspan class=\"en\">is a big honor.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 Piornal 사람들은 el Jarrampla 역할을 하는 것이 큰 영광이라고 생각한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 부상 위험에도 불구하고, 이 역할이 마을 내에서 가지는 높은 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">가치\u003c/b>를 강조합니다. 고통보다 \u003cb class=\"key\">명예\u003c/b>를 중시하는 마을 사람들의 태도가 잘 드러납니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that의 생략\u003c/span> : think + [(that) + 주어 + 동사] : \"생각한다 (~라고)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사 주어\u003c/span> : [동사원형+ing] + 단수 동사(is) : \"역할을 하는 것\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"But people in Piornal think, 하지만 Piornal 사람들은 생각한다. playing el Jarrampla, el Jarrampla 역할을 하는 것이. is a big honor, 큰 영광이라고.. 이 문장 전체를 해석하면, 하지만 Piornal 사람들은 el Jarrampla 역할을 하는 것이 큰 영광이라고 생각한다.","hl":"m"},{"n":46,"text":"앞 문장에서 언급된 부상이라는 단점에도 불구하고, 이 역할을 맡는 것을 대단한 명예로 여긴다는 점이 중요합니다. 마을 사람들의 자부심을 느낄 수 있는 문장이죠.","hl":"mn"},{"n":47,"text":"첫 번째로 think 뒤에는 목적어 절을 이끄는 접속사 that이 생략되어 있어요. 두 번째로 playing은 명사 자리에 쓰인 동명사 주어로, 역할을 하는 것이라고 해석합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서, \u003c/span>\u003cspan class=\"en\">So,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">2,000명이 넘는 사람들이 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">over \u003c/span>\u003cspan class=\"tgt\">2,000 \u003c/span>\u003cspan class=\"tgt\">people\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대기자 명단에 이름을 올려놓았다!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">waiting \u003c/span>\u003cspan class=\"tgt\">list\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그래서, 2,000명이 넘는 사람들이 대기자 명단에 이름을 올려놓았다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 괴물 역할을 맡는 것이 다소 위험할지라도 마을 사람들에게 얼마나 큰 \u003cb class=\"key\">영예\u003c/b>인지를 강조하며 글을 마무리합니다. 2,000명이라는 구체적인 수치를 통해 축제 참여에 대한 주민들의 엄청난 \u003cb class=\"key\">열기\u003c/b>를 증명하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수량 부사(over)\u003c/span> : over [부사] + [수량 표현 (2,000 people)] : \"2,000명이 넘는 사람들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 on의 용법\u003c/span> : be [동사] + on [전치사] + a waiting list [명사/장소] : \"대기자 명단에 있다\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"So, 그래서. over 2,000 people, 2,000명이 넘는 사람들이. are on a waiting list!, 대기자 명단에 이름을 올려놓았다!. 이 문장 전체를 해석하면, 그래서, 2,000명이 넘는 사람들이 대기자 명단에 이름을 올려놓았다!","hl":"m"},{"n":49,"text":"앞선 문장에서 괴물 역할을 하는 것이 큰 영예라고 했죠. 그 결론으로 얼마나 많은 사람이 신청했는지 보여주는 문장이에요. 2,000명이나 되는 사람들이 줄을 서서 기다릴 정도로 이 축제의 인기가 대단하다는 걸 알 수 있습니다.","hl":"mn"},{"n":50,"text":"첫 번째로 over를 주목해 보세요. 숫자 2,000 앞에 쓰여서 그 숫자를 넘어서는 범위를 표현하고 있어요. 두 번째로 on a waiting list라는 표현에서 전치사 on은 명단 같은 곳에 이름이 소속되어 있는 상태를 나타냅니다. 그래서 대기 명단에 이름을 올려놓았다는 의미가 자연스럽게 연결되는 것이죠.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>스페인 Piornal에서는 매년 1월 19일과 20일에 \u003cb class=\"key\">Jarramplas \u003c/b>\u003cb class=\"key\">축제\u003c/b>가 개최됩니다.\u003c/li>\u003cli>이 축제는 농부들의 동물을 훔친 \u003cb class=\"key\">도둑(thief)\u003c/b>을 마을 사람들이 순무를 던져 쫓아낸 전설에서 유래했습니다.\u003c/li>\u003cli>마을 주민들이 직접 \u003cb class=\"key\">몬스터\u003c/b> 분장을 하고 순무를 맞지만, 이는 매우 \u003cb class=\"key\">영광스러운 \u003c/b>\u003cb class=\"key\">일\u003c/b>로 여겨집니다.\u003c/li>\u003cli>수천 명의 \u003cb class=\"key\">대기자 \u003c/b>\u003cb class=\"key\">명단\u003c/b>이 있을 정도로 현지인들에게는 자부심이 담긴 중요한 전통 행사입니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The Jarramplas Festival is a unique Spanish tradition where villagers throw turnips at volunteer monsters to commemorate a local legend about driving away a thief.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">스페인 Piornal의 \u003cb class=\"key\">하람플라스 \u003c/b>\u003cb class=\"key\">축제\u003c/b>는 과거 동물을 훔친 \u003cb class=\"key\">도둑\u003c/b>을 쫓아내던 전설에서 유래하여, 오늘날 마을 사람들이 \u003cb class=\"key\">순무\u003c/b>를 던지며 전통을 이어가는 독특한 행사입니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":51,"text":"오늘 우리는 스페인의 전통 축제를 통해 문화적 자부심이 어떻게 계승되는지 배워봤습니다. 멍이 들어도 영광으로 생각하는 마을 사람들의 마음이 느껴지나요? 오늘 배운 표현들 특히 유래와 관련된 표현들을 복습하면서 수업 마칠게요. 수고하셨습니다!","hl":null}]}]});</script></body></html>
