Plants<small>식물은 스트레스를 받으면 비명을 지를까? 식물의 비밀스러운 소리</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">식물이 내는 소리를 이해하기 위해서는 먼저 캐비테이션(Cavitation)이라는 물리적 현상을 알면 좋습니다. 이는 식물 내부의 물관에서 물기둥이 끊어지며 기포가 발생하고 팽창할 때 일어나는 현상인데, 마치 얼음이 녹거나 팝콘이 터질 때 나는 소리와 유사한 진동을 만들어냅니다. 과학계에서는 이를 식물의 스트레스 반응(Stress response)으로 해석하며, 가뭄이나 줄기 손상 같은 극한 상황에서 식물이 자신의 생존을 지키기 위해 겪는 일종의 &#39;비명&#39;과도 같은 물리적 신호로 봅니다. 우리가 아픈 부위를 문지르듯, 식물 또한 내부 구조의 변화를 통해 환경 변화에 능동적으로 반응하고 있는 셈이지요. 즉, 식물이 소리를 내는 것은 의도적인 의사소통이라기보다는 물리적인 생존 투쟁의 과정에서 발생하는 자연스러운 결과물이라고 이해하시면 이번 지문을 훨씬 재미있게 읽으실 수 있을 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01식물의 소리 생성</div><ul><li>식물은 평소에 인간이 들을 수 없는 아주 작은 소리를 냅니다.</li><li>식물이 내는 소리의 특징: 팝콘이 튀는 듯한 소리 (popping sound)</li><li>빈도: 평상시 한 시간에 한 번 정도 발생</li><li>핵심 키워드: 식물의 소리(Plant sounds)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02스트레스 반응 관찰</div><ul><li>연구 결과, 식물은 스트레스 상황에서 소리 생성 빈도가 급격히 증가합니다.</li><li>실험 도구: 특수 마이크로폰(special microphones) 사용</li><li>조건: 줄기가 잘리는 등의 스트레스(stress) 상황 발생</li><li>변화: 한 시간에 30~50회로 소리 급증</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03소리의 의미 해석</div><ul><li>이 소리는 의사소통 수단이 아닌, 스트레스에 대한 식물 고유의 반응입니다.</li><li>의사소통(communicate) 수단은 아님을 명시</li><li>식물만의 독특한 스트레스 대응 방식(reaction)</li><li>핵심 키워드: 스트레스 반응(Stress reaction)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04결론 및 제언</div><ul><li>우리는 들을 수 없지만, 식물이 보내는 신호를 인지하고 관리해야 합니다.</li><li>식물 관리의 중요성: 적절한 수분(water) 공급 필요</li><li>보이지 않는 식물의 외침을 간과하지 말 것</li><li>핵심 키워드: 도움 요청(Shouting for help)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">actually</td><td class=\"m\">사실은, 정말로</td></tr><tr><td class=\"w\">discover</td><td class=\"m\">발견하다, 알아내다</td></tr><tr><td class=\"w\">react</td><td class=\"m\">반응하다, 대처하다</td></tr><tr><td class=\"w\">communicate</td><td class=\"m\">의사소통하다, 정보를 주고받다</td></tr><tr><td class=\"w\">take care of</td><td class=\"m\">~을 돌보다, ~을 관리하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">몇몇 식물들은</span><span class=\"en\"><b>Some plants</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">놀라운 비밀을 가지고 있다</span><span class=\"en\"><b>have a <span class=\"grammar-hl\">surprising</span> secret.</b></span></div></div><div class=\"lec-sent-ko\">몇몇 식물들은 놀라운 비밀을 가지고 있어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 도입부로서, 식물이 우리가 알고 있는 것과는 다른 독특한 능력을 갖추고 있음을 예고하며 독자의 관심을 유도합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">surprising (현재분사): surprising이 뒤의 명사 secret을 수식하는 형용사적 기능. secret이 ~하는(놀라게 하는) 상태임을 나타내며, &#39;놀라운 비밀&#39;로 해석됨</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것들은</span><span class=\"en\"><b>They</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">실제로 소리를 낼 수 있다</span><span class=\"en\"><b>can actually make sounds</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">톡 터지는 팝콘 같은</span><span class=\"en\"><b>like <span class=\"grammar-hl\">popping</span> popcorn!</b></span></div></div><div class=\"lec-sent-ko\">그것들은 사실 톡 하고 터지는 팝콘과 같은 소리를 낼 수 있어요!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 &#39;놀라운 비밀&#39;이 무엇인지 구체적으로 밝히며, 독자가 식물의 소리를 직관적으로 이해할 수 있도록 비유를 사용했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">popping (현재분사): popping이 뒤의 명사 popcorn을 수식. 팝콘이 &#39;터지는 중인&#39; 상태를 나타내는 형용사적 기능</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">actually</td><td class=\"m\">사실은, 정말로</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만 이 소리들은</span><span class=\"en\"><b>But these sounds</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매우 조용하다,</span><span class=\"en\"><b><span class=\"grammar-hl\">are</span> very quiet,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그래서 우리는 보통 그것들을 들을 수 없다</span><span class=\"en\"><b>so we can’t usually hear them.</b></span></div></div><div class=\"lec-sent-ko\">그러나 이 소리는 매우 조용해서, 우리는 보통 그것들을 들을 수 없어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 식물이 소리를 낸다는 앞선 사실이 왜 그동안 알려지지 않았는지 그 이유를 설명하여, 인간의 감각적 한계를 지적합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are (be동사): 주어 these sounds의 상태를 서술하는 2형식 동사</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 식물들은</span><span class=\"en\"><b>The plants</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">보통 만든다</span><span class=\"en\"><b>normally make</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하나의 작은 터지는 소리를</span><span class=\"en\"><b>one tiny <span class=\"grammar-hl\">popping</span> sound</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매시간</span><span class=\"en\"><b>each hour.</b></span></div></div><div class=\"lec-sent-ko\">그 식물들은 보통 한 시간에 한 번씩 아주 작은 톡 하고 터지는 소리를 내요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 식물의 평소 상태를 설명하여, 이어질 &#39;스트레스 상황&#39;에서의 변화를 강조하기 위한 비교 기준점을 제공합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">popping (현재분사): popping이 뒤의 명사 sound를 수식. 소리가 &#39;터지는&#39; 성격임을 나타내는 형용사적 기능</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만,</span><span class=\"en\"><b>However,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">과학자들은</span><span class=\"en\"><b>scientists</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">흥미로운 무언가를 발견했다</span><span class=\"en\"><b>discovered something <span class=\"grammar-hl\">interesting</span>.</b></span></div></div><div class=\"lec-sent-ko\">하지만, 과학자들은 흥미로운 점을 발견했어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞의 일반적인 상황에서 벗어난 예외적인 현상을 소개하며 글의 논조를 반전시킵니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">interesting (현재분사): interesting이 앞의 대명사 something을 뒤에서 수식. something이 흥미를 유발하는 상태를 나타냄</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">discover</td><td class=\"m\">발견하다, 알아내다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은</span><span class=\"en\"><b>They</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">토마토 식물을 연구했다</span><span class=\"en\"><b>studied tomato plants</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">특별한 마이크를 가진</span><span class=\"en\"><b>with special microphones</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가장 작은 소리까지 들을 수 있는</span><span class=\"en\"><b><span class=\"grammar-hl\">that can hear the quietest sounds</span>.</b></span></div></div><div class=\"lec-sent-ko\">그들은 가장 작은 소리도 들을 수 있는 특별한 마이크로 토마토 식물을 연구했어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 과학자들이 식물의 소리를 포착할 수 있었던 구체적인 방법을 설명하여 정보의 신뢰도를 높입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that can hear the quietest sounds (관계대명사): that은 주격 관계대명사로 선행사 special microphones를 수식하며, 관계대명사절 내부에서 주어 역할을 함</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 식물들이 스트레스를 받았을 때</span><span class=\"en\"><b><span class=\"grammar-hl\">When the plants were stressed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">— 줄기가 잘렸을 때와 같이 —</span><span class=\"en\"><b>— such as when their stems <span class=\"grammar-hl\">were cut</span> —</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들은 30에서 50번의 터지는 소리를 냈다</span><span class=\"en\"><b>they made 30 to 50 popping sounds</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한 시간에</span><span class=\"en\"><b>in an hour!</b></span></div></div><div class=\"lec-sent-ko\">그 식물들은 스트레스를 받았을 때 ─ 예를 들면 줄기가 잘렸을 때 ─ 한 시간에 30에서 50번의 톡 하고 터지는 소리를 냈어요!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 평소 한 시간에 한 번 소리 낸다는 사실과 대비시켜, 스트레스 환경이 식물의 반응을 비약적으로 끌어올렸음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">When the plants were stressed (분사구문(절)): when + they(the plants) + be + p.p. 구조의 부사적 기능. 문맥상 시간(~할 때)을 나타냄</div><div class=\"lec-gr-item\">were stressed (수동태): be동사(were)+p.p.(stressed) 구조. stress는 타동사(스트레스를 주다)인데 목적어가 없어서 수동구조 be+p.p. 형태로 쓴다. 기본구조: stress + O(목적어)</div><div class=\"lec-gr-item\">were cut (수동태): be동사(were)+p.p.(cut) 구조. cut은 타동사(자르다)인데 목적어가 없어서 수동구조 be+p.p. 형태로 쓴다. 기본구조: cut + O(목적어)</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것은 보여준다</span><span class=\"en\"><b>This shows</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">식물들이 스트레스에 반응한다는 것을,</span><span class=\"en\"><b><span class=\"grammar-hl\">that plants react to stress</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 하는 것과 꼭 같이</span><span class=\"en\"><b>just like we <span class=\"grammar-hl\">do</span>.</b></span></div></div><div class=\"lec-sent-ko\">이는 식물들이 꼭 우리처럼 스트레스에 반응한다는 것을 보여줘요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞의 실험 결과를 바탕으로 식물과 인간의 공통점을 도출하며, 생명체가 외부 자극에 반응한다는 보편적 원리를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that plants react to stress 명사절(접속사 that): shows의 목적어 역할을 하는 명사절로 완전한 문장을 이끎</div><div class=\"lec-gr-item\">do (대동사): 앞의 일반동사구 react to stress를 대신하여 반복을 피함. 앞의 동사가 일반동사이면 do를 쓴다</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">react</td><td class=\"m\">반응하다, 대처하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만 이 반응은</span><span class=\"en\"><b>But this reaction</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">의미하지 않는다</span><span class=\"en\"><b>doesn’t mean</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">식물들이 서로 의사소통한다는 것을</span><span class=\"en\"><b>that plants communicate with each other</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">소리를 냄으로써</span><span class=\"en\"><b>by <span class=\"grammar-hl\">making sounds</span>.</b></span></div></div><div class=\"lec-sent-ko\">하지만 이 반응이 식물들이 꼭 소리를 내서 서로 의사소통을 한다는 의미는 아니에요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 식물의 소리 반응을 오해할 가능성을 차단하고, 소리가 의도적인 대화 수단이 아니라 생리적 반응임을 명확히 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">making sounds (동명사): 전치사 by의 목적어로 쓰인 명사적 기능</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">react</td><td class=\"m\">반응하다, 대처하다</td></tr><tr><td class=\"w\">communicate</td><td class=\"m\">의사소통하다, 정보를 주고받다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">소리를 내는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">Making sounds</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">단지 그들의 독특한 방식이다</span><span class=\"en\"><b>is just their unique way</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">스트레스에 반응하는</span><span class=\"en\"><b>of <span class=\"grammar-hl\">reacting</span> to stress.</b></span></div></div><div class=\"lec-sent-ko\">소리를 내는 것은 단지 스트레스에 반응하는 그들만의 독특한 방법이에요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 식물의 소리에 대한 정의를 다시 한번 강조하며, 인간의 언어적 의사소통과는 본질적으로 다름을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Making sounds (동명사): 문장의 주어 역할을 하는 명사적 기능</div><div class=\"lec-gr-item\">reacting (동명사): 전치사 of의 목적어로 쓰인 명사적 기능</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">react</td><td class=\"m\">반응하다, 대처하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 11 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러니,</span><span class=\"en\"><b>So,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">만약 당신이 식물을 돌보고 있다면,</span><span class=\"en\"><b>if you’re <span class=\"grammar-hl\">taking care of</span> plants,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">잊지 마라</span><span class=\"en\"><b>don’t forget</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들에게 물 주는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">to give</span> them water.</b></span></div></div><div class=\"lec-sent-ko\">따라서 만약 여러분이 식물을 돌보고 있다면, 물을 주는 것을 잊지 마세요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞의 내용을 근거로 독자가 일상에서 실천해야 할 구체적인 행동 지침을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">taking care of (현재진행): be동사(are)+-ing(taking) 형태. ~하는 중이다라는 능동적 진행 상태를 나타냄</div><div class=\"lec-gr-item\">to give (to부정사): forget의 목적어로 쓰인 명사적 기능(~하는 것을 잊다)</div></div>\n        ","<div class=\"lec-sent-no\">문장 12 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">비록 당신이 아무것도 들을 수 없지만,</span><span class=\"en\"><b>Even though you can’t hear anything,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들은 외치고 있을지도 모른다</span><span class=\"en\"><b>they might be <span class=\"grammar-hl\">shouting</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">도움을 구하며</span><span class=\"en\"><b>for help!</b></span></div></div><div class=\"lec-sent-ko\">비록 여러분은 아무것도 들을 수 없긴 하지만, 그것들은 도와달라고 외치고 있을지도 몰라요!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 식물이 소리를 통해 도움을 갈구하고 있다는 비유적 표현으로 글을 마무리하며, 식물에 대한 세심한 관심과 공감을 독려합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">shouting (현재진행): be동사(might be)+-ing(shouting) 형태. 소리를 지르는 중일지도 모른다는 추측성 진행 상태를 나타냄</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>식물은 평상시에 아주 작은 소리를 내지만 인간은 듣기 어렵다.</li><li>과학적 연구 결과, 식물은 스트레스를 받을 때 소리 내는 횟수가 급격히 증가한다.</li><li>이는 식물의 소리가 의사소통이 아니라 스트레스에 대한 물리적 반응임을 의미한다.</li><li>식물의 반응을 이해하고 식물을 돌보는 과정에서 더 세심한 관심이 필요하다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Plants emit popping sounds when they experience stress, and these sounds act as an involuntary reaction rather than intentional communication.</div>\n              <div class=\"lec-final-sum-ko\">식물은 스트레스를 받을 때 &#39;팝&#39; 소리를 내며, 이러한 소리는 의도적인 의사소통이 아닌 본능적인 반응으로 작용한다.</div></div></div>"],"segs":[[{"audio":"./passage18_audio/1.mp3","hl":null}],[{"audio":"./passage18_audio/2.mp3","hl":null}],[{"audio":"./passage18_audio/3.mp3","hl":null},{"audio":"./passage18_audio/4.mp3","hl":"stage-0"},{"audio":"./passage18_audio/5.mp3","hl":"stage-1"},{"audio":"./passage18_audio/6.mp3","hl":"stage-2"},{"audio":"./passage18_audio/7.mp3","hl":"stage-3"}],[{"audio":"./passage18_audio/8.mp3","hl":null}],[{"audio":"./passage18_audio/9.mp3","hl":"main"},{"audio":"./passage18_audio/10.mp3","hl":"meaning"},{"audio":"./passage18_audio/11.mp3","hl":"grammar"}],[{"audio":"./passage18_audio/12.mp3","hl":"main"},{"audio":"./passage18_audio/13.mp3","hl":"meaning"},{"audio":"./passage18_audio/14.mp3","hl":"grammar"}],[{"audio":"./passage18_audio/15.mp3","hl":"main"},{"audio":"./passage18_audio/16.mp3","hl":"meaning"},{"audio":"./passage18_audio/17.mp3","hl":"grammar"}],[{"audio":"./passage18_audio/18.mp3","hl":"main"},{"audio":"./passage18_audio/19.mp3","hl":"meaning"},{"audio":"./passage18_audio/20.mp3","hl":"grammar"}],[{"audio":"./passage18_a
