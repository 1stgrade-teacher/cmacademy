</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}

lecturePlayer(document.getElementById("app"),{"brand":"청명학원 영어과","title":"리딩그라피2 리딩그라피레벨2 18번","audioDir":"audio","preview":false,"count":49,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.400em\">리딩그라피레벨2\u003cbr>18번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩그라피2\u003c/div>\u003ch1>The Hidden Voices of Stressed Plants\u003c/h1>\u003ch2>스트레스받는 식물들의 숨겨진 목소리\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>\u003cb class=\"key\">식물\u003c/b>은 평소에도 미세한 소리를 내지만, \u003cb class=\"key\">스트레스\u003c/b>를 받으면 팝콘 터지는 듯한 소리를 훨씬 더 많이 내며 자신만의 방식으로 반응합니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Plants emit unique popping sounds as a reaction to stress, although it is not a form of intentional communication.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘 우리는 식물의 아주 신기하고 놀라운 비밀에 대해 함께 공부해 볼 거예요. 우리가 평소에 말없이 조용하다고만 생각했던 식물들이 사실은 소리를 내고 있다는 사실, 알고 있었나요? 이번 지문을 통해 식물이 언제, 왜 소리를 내는지, 그리고 그게 어떤 의미인지 핵심을 짚어보도록 하겠습니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">최근 과학계에서는 식물이 소리를 낸다는 \u003cb class=\"key\">생물 \u003c/b>\u003cb class=\"key\">음향학\u003c/b>(Bio-acoustics) 연구가 활발합니다. 식물의 물관 내에서 기포가 터지는 \u003cb class=\"key\">공동 \u003c/b>\u003cb class=\"key\">현상\u003c/b>(Cavitation)이 이런 소리의 원인으로 추측되는데, 이는 우리가 \u003cb class=\"key\">빨대\u003c/b>로 컵 바닥의 음료를 끝까지 빨아들일 때 나는 소리와 비슷합니다. 사람의 귀로는 들을 수 없는 초음파 영역의 소리이기 때문에 특수한 마이크가 필요합니다. 이 연구는 식물도 환경 변화에 \u003cb class=\"key\">생리적 \u003c/b>\u003cb class=\"key\">반응\u003c/b>을 한다는 사실을 보여주며 스마트 농업 등에 활용될 수 있습니다.\u003c/div>","segs":[{"n":2,"text":"본격적으로 시작하기 전에 배경지식을 조금 알아볼까요? 식물이 소리를 내는 현상을 연구하는 분야를 생물 음향학이라고 해요. 식물은 물관을 통해 물을 끌어올리는데, 이때 물속에 작은 기포가 생겼다가 터지면서 소리가 발생한다고 과학자들은 보고 있어요. 마치 우리가 빨대로 빈 컵 바닥을 세게 빨 때 나는 꾸르륵 소리와 비슷하죠. 하지만 이 소리는 초음파 영역이라 우리 귀에는 들리지 않아서 특수한 마이크가 필요하답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>식물의 놀라운 비밀\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>식물이 \u003cb class=\"key\">팝콘\u003c/b> 터지는 것과 유사한 소리를 낼 수 있다는 놀라운 \u003cb class=\"key\">비밀\u003c/b>을 소개하며 독자의 호기심을 유발합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>관찰의 어려움과 평상시 상태\u003csmall>전환 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>소리가 너무 작아 평소에는 듣기 힘들며, 보통은 한 시간에 \u003cb class=\"key\">한 \u003c/b>\u003cb class=\"key\">번\u003c/b> 정도만 소리를 낸다는 \u003cb class=\"key\">평상시\u003c/b>의 특징을 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>스트레스 상황에서의 변화\u003csmall>실험 및 결과 · 문장 6–8\u003c/small>\u003c/h4>\u003cp>특수 마이크를 이용한 실험 결과, \u003cb class=\"key\">줄기\u003c/b>가 잘리는 등 \u003cb class=\"key\">스트레스\u003c/b>를 받으면 소리의 횟수가 급격히 증가함을 보여줍니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>소리의 진정한 의미\u003csmall>해석 · 문장 9–10\u003c/small>\u003c/h4>\u003cp>이 소리가 의도적인 \u003cb class=\"key\">의사소통\u003c/b> 수단은 아니며, 스트레스에 대한 식물만의 \u003cb class=\"key\">독특한 \u003c/b>\u003cb class=\"key\">반응\u003c/b> 방식임을 명확히 합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>식물 관리에 대한 조언\u003csmall>결론 · 문장 11–12\u003c/small>\u003c/h4>\u003cp>식물이 소리 없이 \u003cb class=\"key\">도움\u003c/b>을 요청하고 있을 수 있으니, 세심하게 \u003cb class=\"key\">물 \u003c/b>\u003cb class=\"key\">주기\u003c/b>를 잊지 말라고 당부하며 마무리합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 식물의 비밀스러운 소리 소개에서 시작해 과학적 실험과 그 의미 해석으로 이어집니다.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서는 식물이 팝콘 터지는 듯한 소리를 낸다는 놀라운 비밀을 먼저 던져줍니다. 독자들의 시선을 확 사로잡는 도입부라고 할 수 있죠.","hl":"f0"},{"n":5,"text":"세 번째부터 다섯 번째 문장까지는 왜 우리가 그 소리를 못 들었는지 설명해요. 평소에는 한 시간에 딱 한 번 정도 아주 작게 소리를 내기 때문인데, 여기서 과학자들이 흥미로운 점을 발견하며 분위기가 반전됩니다.","hl":"f1"},{"n":6,"text":"여섯 번째부터 여덟 번째 문장은 구체적인 실험 내용이에요. 토마토 식물의 줄기를 자르는 스트레스를 주었더니 소리가 무려 서른 번에서 쉰 번으로 늘어났죠. 이를 통해 식물도 우리처럼 스트레스에 반응한다는 점을 보여줍니다.","hl":"f2"},{"n":7,"text":"아홉 번째와 열 번째 문장에서는 오해를 바로잡아 줍니다. 이 소리가 식물끼리 대화를 나누는 의사소통은 아니라는 거예요. 그저 스트레스 상황에서 나타나는 식물만의 독특한 반응일 뿐이라는 점을 강조합니다.","hl":"f3"},{"n":8,"text":"마지막 열한 번째와 열두 번째 문장에서는 결론을 냅니다. 우리가 듣지 못할 뿐 식물은 물이 필요할 때 도움을 요청하며 외치고 있을지 모르니, 잘 돌봐주어야 한다고 따뜻하게 마무리하네요.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">인과\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 8번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">식물이 스트레스를 받을 때 소리를 더 많이 낸다는 \u003cb class=\"key\">실험 \u003c/b>\u003cb class=\"key\">결과\u003c/b>를 바탕으로, 식물도 사람처럼 스트레스에 \u003cb class=\"key\">반응\u003c/b>한다는 결론을 이끌어냅니다. 전반부에는 현상을 설명하고 후반부에는 그 \u003cb class=\"key\">의미\u003c/b>를 해석하는 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>But (3)\u003c/b>\u003cspan>대조 및 전환\u003c/span>\u003cb>However (5)\u003c/b>\u003cspan>내용 반전\u003c/span>\u003cb>When (7)\u003c/b>\u003cspan>조건 제시\u003c/span>\u003cb>So (11)\u003c/b>\u003cspan>결론 도출\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">surprising secret\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">popping sounds\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">quietest sounds\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">unique way of reacting\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>평상시 식물 (Normal)\u003c/th>\u003cth>스트레스 상태 식물 (Stressed)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>시간당 1번의 작은 소리\u003c/td>\u003ctd>시간당 30~50번의 소리\u003c/td>\u003c/tr>\u003ctr>\u003ctd>안정적인 상태\u003c/td>\u003ctd>줄기가 잘리는 등 위기 상태\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글은 원인과 결과를 보여주는 인과 구조를 가지고 있어요. 식물이 스트레스를 받으면 소리 횟수가 늘어난다는 실험 결과를 중간에 배치하고, 그 의미를 뒤에서 풀이해주는 중괄식 구조입니다. 단순한 관찰에서 시작해 과학적 결론으로 나아가는 방식이라 논리적이죠.","hl":"ty"},{"n":10,"text":"글의 흐름을 바꿔주는 신호어들에 주목해 보세요. 세 번째 문장의 But과 다섯 번째 문장의 However는 평상시 상태와 실험을 통한 새로운 발견을 연결해 줍니다. 일곱 번째 문장의 When은 특정 조건, 즉 스트레스 상황을 제시하고 있고, 마지막 부분의 So는 앞에서 배운 사실을 바탕으로 우리가 해야 할 행동을 이끌어냅니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>surprising\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>놀라운\u003c/span>\u003c/div>\u003cdiv>\u003cb>secret\u003c/b>\u003cem>명사\u003c/em>\u003cspan>비밀\u003c/span>\u003c/div>\u003cdiv>\u003cb>actually\u003c/b>\u003cem>부사\u003c/em>\u003cspan>사실은\u003c/span>\u003c/div>\u003cdiv>\u003cb>popping\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>톡 하고 터지는\u003c/span>\u003c/div>\u003cdiv>\u003cb>popcorn\u003c/b>\u003cem>명사\u003c/em>\u003cspan>팝콘\u003c/span>\u003c/div>\u003cdiv>\u003cb>quiet\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>조용한\u003c/span>\u003c/div>\u003cdiv>\u003cb>usually\u003c/b>\u003cem>부사\u003c/em>\u003cspan>보통\u003c/span>\u003c/div>\u003cdiv>\u003cb>normally\u003c/b>\u003cem>부사\u003c/em>\u003cspan>정상적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>tiny\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>아주 작은\u003c/span>\u003c/div>\u003cdiv>\u003cb>discover\u003c/b>\u003cem>동사\u003c/em>\u003cspan>발견하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>interesting\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>흥미로운\u003c/span>\u003c/div>\u003cdiv>\u003cb>study\u003c/b>\u003cem>동사\u003c/em>\u003cspan>연구하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>special\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>특별한\u003c/span>\u003c/div>\u003cdiv>\u003cb>microphone\u003c/b>\u003cem>명사\u003c/em>\u003cspan>마이크\u003c/span>\u003c/div>\u003cdiv>\u003cb>stressed\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>스트레스를 받은\u003c/span>\u003c/div>\u003cdiv>\u003cb>stem\u003c/b>\u003cem>명사\u003c/em>\u003cspan>줄기\u003c/span>\u003c/div>\u003cdiv>\u003cb>react\u003c/b>\u003cem>동사\u003c/em>\u003cspan>반응하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>reaction\u003c/b>\u003cem>명사\u003c/em>\u003cspan>반응\u003c/span>\u003c/div>\u003cdiv>\u003cb>mean\u003c/b>\u003cem>동사\u003c/em>\u003cspan>의미하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>communicate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>의사소통하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>unique\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>독특한\u003c/span>\u003c/div>\u003cdiv>\u003cb>take care of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>돌보다\u003c/span>\u003c/div>\u003cdiv>\u003cb>forget\u003c/b>\u003cem>동사\u003c/em>\u003cspan>잊다\u003c/span>\u003c/div>\u003cdiv>\u003cb>shout\u003c/b>\u003cem>동사\u003c/em>\u003cspan>외치다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"지문에서 중요한 단어들을 살펴볼까요? popping sounds는 톡 하고 터지는 소리를 말하고, stressed는 식물이 외부 자극으로 인해 힘들어진 상태를 뜻합니다. 그리고 unique way라는 표현은 이 소리가 식물만이 가진 아주 특별한 반응 방식이라는 걸 강조할 때 썼으니 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">secret\u003c/b>\u003cspan class=\"m\">비밀\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">mystery\u003c/span>\u003cspan class=\"s\">confidentiality\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">openness\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">quiet\u003c/b>\u003cspan class=\"m\">조용한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">silent\u003c/span>\u003cspan class=\"s\">still\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">noisy\u003c/span>\u003cspan class=\"a\">loud\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">tiny\u003c/b>\u003cspan class=\"m\">아주 작은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">small\u003c/span>\u003cspan class=\"s\">minute\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">huge\u003c/span>\u003cspan class=\"a\">giant\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">react\u003c/b>\u003cspan class=\"m\">반응하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">respond\u003c/span>\u003cspan class=\"s\">answer\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">unique\u003c/b>\u003cspan class=\"m\">독특한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">special\u003c/span>\u003cspan class=\"s\">distinctive\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">common\u003c/span>\u003cspan class=\"a\">ordinary\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어도 정리해 봅시다. secret의 동의어로는 mystery가 있고, 반의어는 openness가 있어요. quiet는 silent와 비슷하지만 loud와는 반대되는 개념이죠. unique는 아주 특별하다는 뜻의 special과 바꿔 쓸 수 있지만, 흔하다는 뜻인 common과는 반대말이 됩니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몇몇 식물들은\u003c/span>\u003cspan class=\"en\">18 Some plants\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가지고 있어요\u003c/span>\u003cspan class=\"en\">have\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">놀라운 비밀을.\u003c/span>\u003cspan class=\"en\">a \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">surprising\u003c/span> secret.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">몇몇 식물들은 놀라운 비밀을 가지고 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 식물들이 우리가 알지 못하는 \u003cb class=\"key\">특별한 \u003c/b>\u003cb class=\"key\">특성\u003c/b>을 가지고 있다는 점을 언급하며 독자의 \u003cb class=\"key\">호기심\u003c/b>을 자극하는 도입부 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재분사의 형용사적 용법\u003c/span> : [현재분사(v-ing)] + [명사] : \"놀라운\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"Some plants, 몇몇 식물들은. have, 가지고 있어요. a surprising secret, 놀라운 비밀을.. 이 문장 전체를 해석하면, 몇몇 식물들은 놀라운 비밀을 가지고 있어요.","hl":"m"},{"n":14,"text":"여러분, 식물에게 우리가 모르는 놀라운 비밀이 있다고 하네요. 글의 시작 부분에서 독자의 호기심을 확 끌어당기는 역할을 하고 있어요.","hl":"mn"},{"n":15,"text":"여기서 surprising은 놀라움을 주는이라는 뜻의 현재분사로 쓰였어요. 뒤에 오는 명사인 secret을 꾸며주며 어떤 비밀인지 설명해 주는 형용사 역할을 하고 있답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들은 할 수 있어요\u003c/span>\u003cspan class=\"en\">They can\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사실 소리를 낼\u003c/span>\u003cspan class=\"en\">actually make sounds\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">톡 하고 터지는 팝콘과 같은!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">like\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">popping\u003c/span> popcorn!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것들은 사실 톡 하고 터지는 팝콘과 같은 소리를 낼 수 있어요!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 첫 번째 문장에서 말한 비밀이 구체적으로 \u003cb class=\"key\">소리 \u003c/b>\u003cb class=\"key\">내기\u003c/b>라는 것을 밝히며, 친숙한 \u003cb class=\"key\">팝콘\u003c/b>에 비유하여 설명하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 like\u003c/span> : like + [명사(구)] : \"~와 같은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재분사의 수식\u003c/span> : [v-ing] + [명사] : \"톡 하고 터지는\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"They can, 그것들은 할 수 있어요. actually make sounds, 사실 소리를 낼. like popping popcorn!, 톡 하고 터지는 팝콘과 같은!. 이 문장 전체를 해석하면, 그것들은 사실 톡 하고 터지는 팝콘과 같은 소리를 낼 수 있어요!","hl":"m"},{"n":17,"text":"앞 문장에서 말한 비밀이 바로 소리를 낸다는 것이었네요. 우리가 흔히 먹는 팝콘이 터지는 소리에 비유해서 아주 생생하게 전달하고 있죠.","hl":"mn"},{"n":18,"text":"첫 번째로 like는 좋아하다라는 동사가 아니라 전치사로 쓰였어요 est는 최상급 표현으로, 아주 미세한 소리까지 잡아내는 장비의 성능을 아주 잘 표현해주고 있죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 식물들이\u003c/span>\u003cspan class=\"en\">When the plants\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">스트레스를 받았을 때 ─\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">stressed\u003c/span> —\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들면 ~했을 때처럼\u003c/span>\u003cspan class=\"en\">such as when\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">줄기가 잘렸을 때 ─\u003c/span>\u003cspan class=\"en\">their stems \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">cut\u003c/span> —\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">30에서 50번의 톡 하고 터지는 소리를 냈어요\u003c/span>\u003cspan class=\"en\">they made 30 to 50 popping sounds\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 시간에!\u003c/span>\u003cspan class=\"en\">in an hour!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 식물들은 스트레스를 받았을 때 ─ 예를 들면 줄기가 잘렸을 때 ─ 한 시간에 30에서 50번의 톡 하고 터지는 소리를 냈어요!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 식물이 스트레스를 받는 상황에서 발생하는 변화를 \u003cb class=\"key\">구체적인 \u003c/b>\u003cb class=\"key\">수치\u003c/b>를 통해 설명합니다. 평소보다 훨씬 많은 소리를 낸다는 점이 실험의 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">결과\u003c/b>입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태 (be+과거분사)\u003c/span> : plants [주어] + were [be동사] + stressed [과거분사] : \"스트레스를 받았다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태 (be+과거분사)\u003c/span> : their stems [주어] + were [be동사] + cut [과거분사] : \"잘렸다\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"When the plants, 그 식물들이. were stressed —, 스트레스를 받았을 때 ─. such as when, 예를 들면 ~했을 때처럼. their stems were cut —, 줄기가 잘렸을 때 ─. they made 30 to 50 popping sounds, 30에서 50번의 톡 하고 터지는 소리를 냈어요. in an hour!, 한 시간에!. 이 문장 전체를 해석하면, 그 식물들은 스트레스를 받았을 때 ─ 예를 들면 줄기가 잘렸을 때 ─ 한 시간에 30에서 50번의 톡 하고 터지는 소리를 냈어요!","hl":"m"},{"n":32,"text":"식물이 스트레스를 받으면 평소보다 훨씬 많은 소리를 낸다는 구체적인 증거를 제시하는 문장이에요. 줄기가 잘리는 것 같은 위기 상황에서 소리의 횟수가 늘어난다는 점이 핵심이죠.","hl":"mn"},{"n":33,"text":"첫 번째로 were stressed와 were cut은 주어가 동작을 당하는 상태를 나타내는 수동태예요. 식물이 스트레스를 스스로 주는 게 아니라 외부 자극에 의해 받는 것이고 줄기도 누군가에 의해 잘리는 것이기 때문이죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이는 보여줘요\u003c/span>\u003cspan class=\"en\">This shows\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">식물들이 스트레스에 반응한다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that\u003c/span> plants react to stress,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">꼭 우리처럼요.\u003c/span>\u003cspan class=\"en\">just like we \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">do\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이는 식물들이 꼭 우리처럼 스트레스에 반응한다는 것을 보여줘요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 식물의 소리 발생 현상이 인간의 스트레스 반응과 유사한 \u003cb class=\"key\">생존 \u003c/b>\u003cb class=\"key\">반응\u003c/b>임을 시사합니다. 식물과 인간의 \u003cb class=\"key\">공통점\u003c/b>을 찾아내어 이해를 돕고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 (명사절)\u003c/span> : shows [타동사] + that [접속사] + S + V [목적어절] : \"~라는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">대동사\u003c/span> : just like we [주어] + do [대동사] : \"반응하는 것\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"This shows, 이는 보여줘요. that plants react to stress, 식물들이 스트레스에 반응한다는 것을. just like we do, 꼭 우리처럼요.. 이 문장 전체를 해석하면, 이는 식물들이 꼭 우리처럼 스트레스에 반응한다는 것을 보여줘요.","hl":"m"},{"n":35,"text":"과학적 실험 결과를 통해 식물과 인간의 공통점을 도출하고 있어요. 우리처럼 식물도 외부 환경에 민감하게 반응하는 살아있는 생명체라는 점을 강조하죠.","hl":"mn"},{"n":36,"text":"첫 번째로 that은 shows라는 동사의 목적어 역할을 하는 명사절을 이끄는 접속사예요. 두 번째로 문장 맨 끝의 do는 앞에 나온 react를 대신해서 쓰는 대동사예요. 우리말로도 우리가 하는 것처럼 이라고 짧게 말하는 것과 같답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 이 반응이\u003c/span>\u003cspan class=\"en\">But this reaction\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">의미하지는 않아요\u003c/span>\u003cspan class=\"en\">doesn't mean\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">식물들이 의사소통한다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that\u003c/span> plants communicate\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">서로\u003c/span>\u003cspan class=\"en\">with each other\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">소리를 내서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">making\u003c/span> sounds.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 이 반응이 식물들이 꼭 소리를 내서 서로 의사소통을 한다는 의미는 아니에요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 식물의 소리 발생이 사회적인 \u003cb class=\"key\">의사소통\u003c/b> 수단은 아니라는 사실을 명확히 합니다. 단순한 생리적 \u003cb class=\"key\">반응\u003c/b>과 의도적인 소통을 구분하려는 의도가 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 (명사절)\u003c/span> : mean [타동사] + that [접속사] + S + V [목적어절] : \"~라는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 + 동명사 (수단)\u003c/span> : by [전치사] + making [동명사] : \"소리를 냄으로써\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"But this reaction, 하지만 이 반응이. doesn't mean, 의미하지는 않아요. that plants communicate, 식물들이 의사소통한다는 것을. with each other, 서로. by making sounds, 소리를 내서. 이 문장 전체를 해석하면, 하지만 이 반응이 식물들이 꼭 소리를 내서 서로 의사소통을 한다는 의미는 아니에요.","hl":"m"},{"n":38,"text":"소리를 낸다고 해서 그것이 식물들 사이의 대화라고 오해해서는 안 된다는 주의를 주고 있어요. 단지 스트레스에 대한 신체적인 반응일 뿐이라는 점을 명확히 하고 있죠.","hl":"mn"},{"n":39,"text":"첫 번째로 doesn't mean 뒤에 나오는 that은 뒤에 완벽한 문장이 오는 명사절 접속사예요. 두 번째로 by making은 수단을 나타내는 전치사 by와 동명사 making이 합쳐진 구조예요. 소리를 내는 방법을 통해서라는 의미를 전달하죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">소리를 내는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Making \u003c/span>\u003cspan class=\"tgt\">sounds\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단지 ~입니다\u003c/span>\u003cspan class=\"en\">is just\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들만의 독특한 방법\u003c/span>\u003cspan class=\"en\">their unique way\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">스트레스에 반응하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">reacting\u003c/span> to stress.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">소리를 내는 것은 단지 스트레스에 반응하는 그들만의 독특한 방법이에요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 식물이 소리를 내는 것이 소통을 위한 의도적인 행동이 아니라, 단지 스트레스에 대한 \u003cb class=\"key\">생리적 \u003c/b>\u003cb class=\"key\">반응\u003c/b>임을 설명합니다. 식물마다 가진 \u003cb class=\"key\">고유한 \u003c/b>\u003cb class=\"key\">방식\u003c/b>으로 어려움을 표현한다는 점이 핵심입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사 주어\u003c/span> : Making [동명사] + sounds [목적어] : \"소리를 내는 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사의 목적어(동명사)\u003c/span> : way [명사] + of [전치사] + reacting [동명사] : \"반응하는 (방법)\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"Making sounds, 소리를 내는 것은. is just, 단지 ~입니다. their unique way, 그들만의 독특한 방법. of reacting to stress, 스트레스에 반응하는. 이 문장 전체를 해석하면, 소리를 내는 것은 단지 스트레스에 반응하는 그들만의 독특한 방법이에요.","hl":"m"},{"n":41,"text":"식물이 소리를 내는 현상을 소통으로 오해하지 말라는 내용이에요. 소리는 그저 스트레스를 받았을 때 나타나는 식물만의 생리적 반응이자 고유한 방식이라는 점을 강조하고 있습니다.","hl":"mn"},{"n":42,"text":"첫 번째로 Making sounds 부분은 동명사가 주어로 쓰인 형태예요. 주어 자리에 동명사가 오면 단수 취급을 하기 때문에 동사로 is를 쓴다는 점이 중요합니다. 두 번째로 of reacting은 전치사 of 뒤에 동명사가 온 구조로, 앞의 명사인 way를 꾸며주는 역할을 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">따라서 만약 여러분이 ~라면\u003c/span>\u003cspan class=\"en\">So, if you're\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">식물을 돌보고 있는 중\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">taking \u003c/span>\u003cspan class=\"tgt\">care \u003c/span>\u003cspan class=\"tgt\">of\u003c/span> plants,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">잊지 마세요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003cspan class=\"tgt\">forget \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> thing,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들은 ~일지도 모른다\u003c/span>\u003cspan class=\"en\">they \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">might \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">도와달라고 외치고 있는 중\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">shouting\u003c/span> for help!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">비록 여러분은 아무것도 들을 수 없긴 하지만, 그것들은 도와달라고 외치고 있을지도 몰라요!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 인간의 귀에 들리지 않는 소리를 \u003cb class=\"key\">외침\u003c/b>으로 표현하여 식물의 절박한 상태를 \u003cb class=\"key\">의인화\u003c/b>했습니다. 보이지 않는 \u003cb class=\"key\">신호\u003c/b>에 귀를 기울여야 한다는 경각심을 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">양보의 접속사\u003c/span> : Even though [접속사] + S + V : \"비록 ~일지라도\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 + 진행형\u003c/span> : might [조동사] + be [동사원형] + shouting [현재분사] : \"외치고 있을지도 모른다\"\u003c/div>\u003c/div>","segs":[{"n":46,"text":"Even though, 비록 ~일지라도. you can't hear anything, 여러분이 아무것도 들을 수 없다. they might be, 그것들은 ~일지도 모른다. shouting for help!, 도와달라고 외치고 있는 중. 이 문장 전체를 해석하면, 비록 여러분은 아무것도 들을 수 없긴 하지만, 그것들은 도와달라고 외치고 있을지도 몰라요!","hl":"m"},{"n":47,"text":"마지막 문장은 아주 감동적이고 인상적인 마무리네요. 소리가 우리 귀에는 들리지 않지만, 식물들은 나 지금 너무 힘들다며 도와달라고 외치고 있는 신호일 수 있다는 것을 의인화해서 보여줍니다.","hl":"mn"},{"n":48,"text":"첫 번째로 Even though는 비록 무엇일지라도라는 뜻의 접속사로 뒤에 주어와 동사가 오는 문장을 이끌어요. 두 번째로 might be shouting은 아마도 그러고 있는 중일 거라는 추측과 진행의 의미가 합쳐진 표현입니다. 조동사 might 뒤에는 반드시 동사원형인 be를 써야 한다는 점도 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>식물은 평소에 들리지 않는 아주 작은 \u003cb class=\"key\">팝콘\u003c/b> 터지는 소리를 냅니다.\u003c/li>\u003cli>과학자들은 특수 마이크를 통해 식물이 \u003cb class=\"key\">스트레스\u003c/b>를 받으면 소리를 훨씬 더 많이 낸다는 것을 발견했습니다.\u003c/li>\u003cli>이러한 소리는 식물이 서로 소통하는 수단이 아니라 스트레스에 대한 \u003cb class=\"key\">독특한 \u003c/b>\u003cb class=\"key\">반응\u003c/b>입니다.\u003c/li>\u003cli>식물을 돌볼 때 물을 주는 등 \u003cb class=\"key\">세심한 \u003c/b>\u003cb class=\"key\">주의\u003c/b>를 기울이는 것이 필요합니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Plants emit unique popping sounds as a reaction to stress, although it is not a form of intentional communication.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">\u003cb class=\"key\">식물\u003c/b>은 평소에도 미세한 소리를 내지만, \u003cb class=\"key\">스트레스\u003c/b>를 받으면 팝콘 터지는 듯한 소리를 훨씬 더 많이 내며 자신만의 방식으로 반응합니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":49,"text":"자, 오늘 수업 어땠나요? 식물이 소리를 내서 스트레스를 표현한다는 사실이 정말 놀랍지 않나요? 앞으로 여러분 곁에 있는 화초를 볼 때, 겉으로는 조용해도 속으로는 열심히 반응하고 있다는 걸 꼭 기억해 주세요. 오늘 배운 문장들과 핵심 단어들 다시 한번 복습하면서 마무리하겠습니다. 수고하셨어요!","hl":null}]}]});</script></body></html>
