통 스포츠 윤리(Sports Ethics)라고 부르는 개념과 연결해 볼 수 있어요. 우리가 흔히 아는 옐로카드와 레드카드가 규칙 위반에 대한 페널티(Penalty)를 상징한다면, 이번 지문에 등장하는 화이트카드(White Card)는 반대로 스포츠 정신(Sportsmanship)을 고취하기 위해 고안된 보상 체계라고 이해하면 쉬워요. 마치 학교에서 잘못을 지적하는 벌점 대신 칭찬하는 상점을 주는 것과 같은 원리인데, 이는 경쟁 위주의 경기에서 선수들이 상호 존중(Mutual Respect)을 실천하도록 동기를 부여하는 역할을 합니다. 다만, 국제축구연맹(FIFA)과 같은 공식 기구는 경기 운영의 통일성(Consistency)을 위해 새로운 규칙 도입에 매우 신중한 입장을 취하고 있는데, 이러한 맥락을 알고 글을 읽으면 화이트카드 도입이 스포츠계에서 왜 논쟁적인 이슈가 되는지 더 깊이 파악할 수 있을 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01기존 카드의 역할과 새로운 화이트카드의 등장</div><ul><li>축구에서 규칙 위반을 제재하던 기존 카드와 달리, 긍정적인 행동을 격려하기 위한 새로운 카드가 도입되었습니다.</li><li>기존의 레드카드와 옐로카드(red/yellow cards)는 규칙 위반 시 사용됨</li><li>새로운 화이트카드(white card)는 스포츠맨십 고취가 목적임</li><li>핵심 키워드: 화이트카드(white card)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02화이트카드의 첫 사용 사례</div><ul><li>포르투갈의 축구 경기 중 의료진의 헌신적인 대응을 계기로 화이트카드가 처음 등장했습니다.</li><li>심판 카타리나 캄포스(Catarina Campos)가 최초로 사용</li><li>벤피카와 스포르팅 리스본 경기 중 발생</li><li>관중의 응급 상황에 신속히 대처한 의료진에게 수여</li><li>핵심 키워드: 의료진(medical staff)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03현황 및 향후 과제</div><ul><li>화이트카드는 현재 포르투갈 축구계에서만 제한적으로 활용되고 있습니다.</li><li>FIFA는 아직 화이트카드 사용을 공식 승인(approval)하지 않음</li><li>현재 포르투갈 내에서만 적용되는 국지적 정책</li><li>전 세계적 도입에 대한 논의와 의견 나눔이 필요함</li><li>핵심 키워드: 국제축구연맹(FIFA)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">follow</td><td class=\"m\">따르다, 뒤따르다</td></tr><tr><td class=\"w\">be introduced to</td><td class=\"m\">~에 도입되다, ~에 소개되다</td></tr><tr><td class=\"w\">take care of</td><td class=\"m\">~을 돌보다, ~을 처리하다</td></tr><tr><td class=\"w\">respond to</td><td class=\"m\">~에 대응하다, ~에 반응하다</td></tr><tr><td class=\"w\">approve</td><td class=\"m\">승인하다, 찬성하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">축구 경기에서,</span><span class=\"en\"><b>In soccer games,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">심판들은 레드카드와 옐로카드를 사용한다</span><span class=\"en\"><b>referees use red and yellow cards</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">선수들이 규칙을 따르지 않을 때</span><span class=\"en\"><b><span class=\"grammar-hl\">when players don’t follow the rules</span>.</b></span></div></div><div class=\"lec-sent-ko\">축구 경기에서 심판들은 선수들이 규칙을 따르지 않을 때 레드카드와 옐로카드를 사용해요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 기존 축구 경기에서 반칙 행위를 통제하기 위해 사용되던 전통적인 징계 수단을 언급하며 글을 시작합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">when players don’t follow the rules (현재분사(분사구문)): when + they(players) + don&#39;t follow the rules 형태로, 시간(때)을 나타내는 부사절의 축약 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">follow</td><td class=\"m\">따르다, 뒤따르다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만 이제,</span><span class=\"en\"><b>But now,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">새로운 화이트카드가 있다!</span><span class=\"en\"><b><span class=\"grammar-hl\">there’s</span> a new white card!</b></span></div></div><div class=\"lec-sent-ko\">그러나 이제, 새로운 화이트카드가 있어요!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급된 처벌 위주의 카드 시스템과 대비되는 새로운 도입 사례를 제시하며 화제를 전환합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">there’s (관용표현): there is 구문으로, 뒤에 나오는 a new white card를 주어로 취하는 유도부사 문장 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 카드는 선수, 코치, 또는 의료진을 위한 것이다</span><span class=\"en\"><b>This card is for players, coaches, or medical staff</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">좋은 태도를 보이는</span><span class=\"en\"><b><span class=\"grammar-hl\">who show good behavior</span>.</b></span></div></div><div class=\"lec-sent-ko\">이 카드는 좋은 태도를 보이는 선수, 코치, 또는 의료진에게 주는 것이에요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 화이트카드가 만들어진 목적을 설명하며, 징계가 아닌 칭찬을 위한 도구임을 명확히 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">who show good behavior (관계대명사): 주격 관계대명사 who가 앞의 선행사(players, coaches, or medical staff)를 수식하며, 절 내부에서 주어 역할을 합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">포르투갈에서,</span><span class=\"en\"><b>In Portugal,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Catarina Campos라는 이름의 심판이</span><span class=\"en\"><b>a referee <span class=\"grammar-hl\">named Catarina Campos</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">화이트카드를 처음으로 사용하기 시작했다.</span><span class=\"en\"><b>started <span class=\"grammar-hl\">to use</span> the white card first.</b></span></div></div><div class=\"lec-sent-ko\">포르투갈의 Catarina Campos라는 심판이 처음으로 화이트카드를 사용하기 시작했어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 새로운 제도가 실제로 어떤 인물에 의해 시작되었는지 구체적인 사례를 들어 신뢰성을 높입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">named Catarina Campos (과거분사(형용사)): named가 앞의 명사 referee를 수식하는 구조로, &#39;Catarina Campos라고 이름 붙여진 심판&#39;이라는 의미의 명사 수식어구입니다.</div><div class=\"lec-gr-item\">to use (to부정사): 동사 start의 목적어 역할을 하는 명사적 용법의 to부정사 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 도입되었다</span><span class=\"en\"><b>It <span class=\"grammar-hl\">was introduced</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">경기 중에</span><span class=\"en\"><b>during a game</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">두 팀 간의, Benfica와 Sporting Lisbon인</span><span class=\"en\"><b>between the two teams, Benfica and Sporting Lisbon.</b></span></div></div><div class=\"lec-sent-ko\">그것은 Benfica와 Sporting Lisbon 두 팀 간의 경기 중에 도입되었어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 화이트카드가 처음으로 활용된 구체적인 시간과 장소를 밝히며 앞 문장의 내용을 보충합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was introduced (수동태): be동사(was)+p.p.(introduced) 구조입니다. introduce는 타동사인데 목적어가 없어서 수동구조 was introduced 형태로 씁니다. 기본구조: V + O (주어는 O를 도입하다).</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">관중 중 한 사람이 아프게 되었을 때,</span><span class=\"en\"><b><span class=\"grammar-hl\">When a person in the crowd got sick</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">양 팀의 의료진이</span><span class=\"en\"><b>medical staff from both teams</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">재빠르게 도움을 주러 갔다.</span><span class=\"en\"><b>quickly went to help.</b></span></div></div><div class=\"lec-sent-ko\">관중 중에 한 사람이 아프게 되자, 두 팀의 의료진들이 재빠르게 도움을 주러 갔어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 화이트카드가 발급된 구체적인 상황을 묘사하며, 왜 이 카드가 수여되었는지에 대한 배경을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">When a person in the crowd got sick (관계부사): when이 이끄는 절이 부사절로 쓰여, 사람이 아팠던 특정한 시간적 상황을 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">심판은 그들의 빠른 대응에 감동받았다</span><span class=\"en\"><b>The referee <span class=\"grammar-hl\">was moved</span> by their quick response</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그래서 그녀는 그들에게 화이트카드를 주었다!</span><span class=\"en\"><b>so she gave them a white card!</b></span></div></div><div class=\"lec-sent-ko\">심판은 그들의 빠른 대응에 감동받아 그들에게 화이트카드를 주었어요!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 상황에 대한 심판의 긍정적인 판단과 실제 행동을 연결하여 화이트카드의 실질적인 작동 방식을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was moved (수동태): be동사(was)+p.p.(moved) 구조입니다. move는 타동사인데 목적어가 없어서 수동구조 was moved 형태로 씁니다. 기본구조: move + O (주어는 O를 감동시키다).</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만,</span><span class=\"en\"><b>But,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">FIFA는 화이트카드의 사용을 승인하지 않았다</span><span class=\"en\"><b>FIFA <span class=\"grammar-hl\">hasn’t approved</span> the use of the white card</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아직</span><span class=\"en\"><b>yet.</b></span></div></div><div class=\"lec-sent-ko\">하지만, FIFA는 아직 화이트카드의 사용을 승인하지 않았어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 화이트카드가 전 세계적으로 통용되는 공식 규칙은 아니라는 한계를 지적하며 현재의 상황을 객관적으로 서술합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">hasn’t approved (현재완료): 조동사 have/has + p.p. 형태를 사용하여 과거부터 현재까지의 상태를 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">approve</td><td class=\"m\">승인하다, 찬성하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">오직 포르투갈만이</span><span class=\"en\"><b>Only Portugal</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">축구에서 화이트카드를 사용하고 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">is using</span> white cards in soccer</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">현재</span><span class=\"en\"><b>right now.</b></span></div></div><div class=\"lec-sent-ko\">포르투갈만이 현재 축구에서 화이트카드를 사용하고 있어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 승인 미비를 근거로, 이 제도가 지엽적인 차원에서만 시행되고 있음을 재확인합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is using (현재진행): be동사(is) + 현재분사(-ing) 형태를 사용하여 현재 벌어지고 있는 동작을 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신은 생각하는가</span><span class=\"en\"><b><span class=\"grammar-hl\">Do you think</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것이 좋은 생각이라고,</span><span class=\"en\"><b><span class=\"grammar-hl\">it’s a good idea</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 다른 나라들도 화이트카드를 사용해야 할까?</span><span class=\"en\"><b>and should other countries use white cards too?</b></span></div></div><div class=\"lec-sent-ko\">여러분은 그것이 좋은 생각이라고 생각하시나요, 그리고 다른 나라들도 화이트카드를 사용해야 할까요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자에게 화이트카드의 가치와 향후 확대 가능성에 대해 질문을 던지며 글을 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">it’s a good idea (가주어): 진주어: it이 가주어로 쓰였고, 문맥상 뒤에 생략된 명사절 내용이 진주어 역할을 합니다.</div><div class=\"lec-gr-item\">Do you think (간접의문문): &#39;Do you think (that) it is a good idea&#39; 구조에서 명사절을 이끄는 접속사 that이 생략된 형태입니다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>축구계에는 반칙을 처벌하는 레드·옐로카드와 달리, 선행을 칭찬하는 화이트카드가 등장했다.</li><li>포르투갈의 한 경기에서 의료진의 신속한 응급조치에 대한 보상으로 처음 사용되었다.</li><li>아직 FIFA의 공식 승인을 받지는 않아 포르투갈 내에서만 제한적으로 활용되고 있다.</li><li>이러한 새로운 카드 제도가 앞으로 범용성을 가질 수 있을지에 대해 질문을 던진다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The white card was introduced in Portugal to reward positive behavior by players and staff, but it has yet to be officially approved by FIFA for global use.</div>\n              <div class=\"lec-final-sum-ko\">포르투갈에서 선수와 스태프의 긍정적인 행동을 보상하기 위해 화이트카드가 도입되었으나, 국제적인 사용을 위한 FIFA의 공식 승인은 아직 이루어지지 않았다.</div></div></div>"],"segs":[[{"audio":"./passage16_audio/1.mp3","hl":null}],[{"audio":"./passage16_audio/2.mp3","hl":null}],[{"audio":"./passage16_audio/3.mp3","hl":null},{"audio":"./passage16_audio/4.mp3","hl":"stage-0"},{"audio":"./passage16_audio/5.mp3","hl":"stage-1"},{"audio":"./passage16_audio/6.mp3","hl":"stage-2"}],[{"audio":"./passage16_audio/7.mp3","hl":null}],[{"audio":"./passage16_audio/8.mp3","hl":"main"},{"audio":"./passage16_audio/9.mp3","hl":"meaning"},{"audio":"./passage16_audio/10.mp3","hl":"grammar"}],[{"audio":"./passage16_audio/11.mp3","hl":"main"},{"audio":"./passage16_audio/12.mp3","hl":"meaning"},{"audio":"./passage16
