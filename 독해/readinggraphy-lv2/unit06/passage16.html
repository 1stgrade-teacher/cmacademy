</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}

    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}

  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}

lecturePlayer(document.getElementById("app"),{"brand":"청명학원 영어과","title":"리딩그라피2 리딩그라피레벨2 16번","audioDir":"audio","preview":false,"count":42,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.400em\">리딩그라피레벨2\u003cbr>16번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩그라피2\u003c/div>\u003ch1>The New White Card in Soccer: Recognizing Fair Play\u003c/h1>\u003ch2>축구의 새로운 화이트카드: 페어플레이 인정하기\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>축구에서 규칙 위반을 처벌하는 기존 카드와 달리, \u003cb class=\"key\">좋은 \u003c/b>\u003cb class=\"key\">태도\u003c/b>를 보인 이들을 칭찬하기 위해 도입된 \u003cb class=\"key\">화이트카드\u003c/b>의 유래와 현황을 다루고 있습니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Portugal has introduced the white card to reward sportsmanship in soccer, although it is not yet globally standardized by FIFA.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분! 오늘은 축구장에서 볼 수 있는 아주 특별하고 따뜻한 소식을 준비했습니다. 축구 하면 보통 반칙을 했을 때 나오는 빨간색이나 노란색 카드를 떠올리죠? 하지만 오늘은 선행과 좋은 태도를 칭찬하는 화이트카드에 대해 함께 읽어보겠습니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">축구 경기에서 심판은 보통 반칙에 대해 \u003cb class=\"key\">경고\u003c/b>(Yellow Card)나 \u003cb class=\"key\">퇴장\u003c/b>(Red Card) 조치를 취합니다. 하지만 최근에는 징계가 아닌 칭찬을 목적으로 하는 \u003cb class=\"key\">화이트카드\u003c/b> 제도가 등장하여 주목받고 있습니다. 이는 승패를 떠나 타인을 배려하거나 정정당당하게 경기에 임하는 \u003cb class=\"key\">스포츠맨십\u003c/b>(Sportsmanship)을 고취하기 위해 고안되었습니다. 마치 우리가 일상에서 잘못을 지적받는 대신 \u003cb class=\"key\">칭찬 \u003c/b>\u003cb class=\"key\">스티커\u003c/b>를 받는 것과 비슷한 원리라고 볼 수 있습니다. 현재 이 제도는 포르투갈 축구 연맹이 시범적으로 도입하여 운영 중이며, 전 세계로 확산될지에 대한 논의가 활발합니다.\u003c/div>","segs":[{"n":2,"text":"축구 경기에서 심판은 공정한 진행을 위해 카드 제도를 사용합니다. 옐로카드는 경고, 레드카드는 퇴장을 의미하는 처벌의 수단이죠. 그런데 최근에는 스포츠맨십이라는 긍정적인 가치를 장려하기 위해 화이트카드가 등장했습니다. 쉽게 말해 우리가 학교에서 착한 일을 하면 받는 상점 카드와 비슷하다고 생각하면 됩니다. 현재 포르투갈에서 시범적으로 운영되며 큰 관심을 받고 있습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>새로운 카드의 등장\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>기존의 레드카드 및 옐로카드와 대조되는 새로운 \u003cb class=\"key\">화이트카드\u003c/b>의 등장을 소개합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>화이트카드의 목적\u003csmall>주제 · 문장 3\u003c/small>\u003c/h4>\u003cp>이 카드가 선수나 코칭스태프의 \u003cb class=\"key\">좋은 \u003c/b>\u003cb class=\"key\">행동\u003c/b>을 격려하기 위한 것임을 정의합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>실제 도입 사례\u003csmall>예시 · 문장 4–7\u003c/small>\u003c/h4>\u003cp>포르투갈 경기 중 \u003cb class=\"key\">응급 \u003c/b>\u003cb class=\"key\">환자\u003c/b>를 도운 의료진에게 수여된 구체적인 사례를 나열합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>현재의 한계와 질문\u003csmall>결론 · 문장 8–10\u003c/small>\u003c/h4>\u003cp>\u003cb class=\"key\">FIFA\u003c/b>의 공식 승인 여부와 전 세계 확산 가능성에 대한 \u003cb class=\"key\">의견\u003c/b>을 묻습니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 화이트카드의 개념부터 시작해 실제 사용 사례와 현재의 상황까지 순서대로 설명하고 있습니다.","hl":null},{"n":4,"text":"제일 첫 번째와 두 번째 문장에서는 우리에게 익숙한 레드카드와 옐로카드를 언급하며, 새롭게 등장한 화이트카드를 대조적으로 소개합니다.","hl":"f0"},{"n":5,"text":"세 번째 문장에서는 이 화이트카드의 구체적인 용도를 설명하는데요, 좋은 태도를 보여준 선수나 코치, 의료진에게 주는 보상임을 정의하고 있습니다.","hl":"f1"},{"n":6,"text":"네 번째부터 일곱 번째 문장까지는 실제 사례가 나옵니다. 포르투갈의 카타리나 캄포스 심판이 아픈 관중을 도와준 의료진에게 감동하여 이 카드를 수여한 훈훈한 일화를 들려줍니다.","hl":"f2"},{"n":7,"text":"마지막 여덟 번째부터 열 번째 문장에서는 국제축구연맹인 FIFA가 아직 이 제도를 공식 승인하지 않았다는 점을 짚으며, 앞으로의 가능성에 대해 질문을 던집니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">비교·대조 및 예시\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 3번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글의 초반부에 기존 카드와 대조되는 \u003cb class=\"key\">화이트카드\u003c/b>의 정의와 목적을 명확히 제시합니다. 이후 포르투갈 리그에서 발생한 \u003cb class=\"key\">실제 \u003c/b>\u003cb class=\"key\">일화\u003c/b>를 상세히 설명하여 이해를 돕습니다. 마지막으로 \u003cb class=\"key\">국제적인 \u003c/b>\u003cb class=\"key\">현황\u003c/b>을 덧붙여 주제를 확장하는 구조를 취하고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>But now (2)\u003c/b>\u003cspan>전환\u003c/span>\u003cb>This card is for (3)\u003c/b>\u003cspan>정의\u003c/span>\u003cb>In Portugal (4)\u003c/b>\u003cspan>예시 시작\u003c/span>\u003cb>But (8)\u003c/b>\u003cspan>반전/한계\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">red and yellow cards\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">new white card\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">This card\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">it\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the white card\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Red and Yellow Cards\u003c/th>\u003cth>White Card\u003c/th>\u003c/tr>\u003ctr>\u003ctd>규칙 위반 시 사용(Punishment)\u003c/td>\u003ctd>좋은 행동 시 사용(Reward)\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 처벌을 위한 카드와 보상을 위한 카드를 비교하며 시작하는 대조의 구조를 가지고 있습니다. 주제가 앞부분에 명확히 드러나는 두괄식 구성으로, 독자들이 화이트카드의 목적을 빨리 파악하도록 돕습니다.","hl":"ty"},{"n":9,"text":"문장 중간에 But now라는 표현을 써서 기존의 상식에서 새로운 정보로 시선을 돌리게 합니다. 또한 This card is for라는 구문을 통해 화이트카드가 무엇을 위한 것인지 명확히 정의하고 있습니다. 마지막 부분의 But은 FIFA의 승인이라는 현실적인 한계를 보여주는 중요한 신호어입니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>soccer\u003c/b>\u003cem>명사\u003c/em>\u003cspan>축구\u003c/span>\u003c/div>\u003cdiv>\u003cb>referee\u003c/b>\u003cem>명사\u003c/em>\u003cspan>심판\u003c/span>\u003c/div>\u003cdiv>\u003cb>follow the rules\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>규칙을 따르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>coach\u003c/b>\u003cem>명사\u003c/em>\u003cspan>코치\u003c/span>\u003c/div>\u003cdiv>\u003cb>medical staff\u003c/b>\u003cem>명사\u003c/em>\u003cspan>의료진\u003c/span>\u003c/div>\u003cdiv>\u003cb>behavior\u003c/b>\u003cem>명사\u003c/em>\u003cspan>행동, 태도\u003c/span>\u003c/div>\u003cdiv>\u003cb>introduce\u003c/b>\u003cem>동사\u003c/em>\u003cspan>도입하다, 소개하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>between\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~ 사이에\u003c/span>\u003c/div>\u003cdiv>\u003cb>crowd\u003c/b>\u003cem>명사\u003c/em>\u003cspan>군중, 관중\u003c/span>\u003c/div>\u003cdiv>\u003cb>quickly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>빨리, 재빠르게\u003c/span>\u003c/div>\u003cdiv>\u003cb>moved\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>감동받은\u003c/span>\u003c/div>\u003cdiv>\u003cb>response\u003c/b>\u003cem>명사\u003c/em>\u003cspan>응답, 대응\u003c/span>\u003c/div>\u003cdiv>\u003cb>approve\u003c/b>\u003cem>동사\u003c/em>\u003cspan>승인하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>yet\u003c/b>\u003cem>부사\u003c/em>\u003cspan>아직\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"중요한 단어로 심판을 뜻하는 referee와 규칙을 준수하다라는 뜻의 follow the rules를 꼭 기억하세요. 또한 의료진을 뜻하는 medical staff와 감동받은 상태를 나타내는 moved라는 표현도 이 글의 핵심 키워드입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">follow\u003c/b>\u003cspan class=\"m\">따르다, 준수하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">obey\u003c/span>\u003cspan class=\"s\">comply with\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">disobey\u003c/span>\u003cspan class=\"a\">violate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">behavior\u003c/b>\u003cspan class=\"m\">행동, 태도\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">conduct\u003c/span>\u003cspan class=\"s\">manner\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">quickly\u003c/b>\u003cspan class=\"m\">빨리\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">rapidly\u003c/span>\u003cspan class=\"s\">promptly\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">slowly\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">moved\u003c/b>\u003cspan class=\"m\">감동받은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">touched\u003c/span>\u003cspan class=\"s\">impressed\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">approve\u003c/b>\u003cspan class=\"m\">승인하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">allow\u003c/span>\u003cspan class=\"s\">permit\u003c/span>\u003cspan class=\"s\">authorize\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">reject\u003c/span>\u003cspan class=\"a\">disapprove\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어를 살펴볼까요? follow는 규칙을 지키는 것이니까 obey로 바꿔 쓸 수 있고, 감동받은 상태인 moved는 touched와 같은 의미입니다. 반대로 approve는 승인하다라는 뜻인데, 거절하다라는 의미의 reject나 disapprove와 함께 알아두면 좋습니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">축구 경기에서,\u003c/span>\u003cspan class=\"en\">16 In soccer games, *\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">심판들은 사용해요\u003c/span>\u003cspan class=\"en\">referees use\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">레드카드와 옐로카드를\u003c/span>\u003cspan class=\"en\">red and yellow cards\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">선수들이 ~할 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">when\u003c/span> players\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">규칙을 따르지 않을 (때).\u003c/span>\u003cspan class=\"en\">don't follow the rules.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">축구 경기에서 심판들은 선수들이 규칙을 따르지 않을 때 레드카드와 옐로카드를 사용해요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 축구 경기에서 반칙을 범한 선수에게 주는 \u003cb class=\"key\">경고와 \u003c/b>\u003cb class=\"key\">퇴장\u003c/b> 시스템을 설명하며 글을 시작합니다. 독자에게 익숙한 기존의 \u003cb class=\"key\">레드카드와 \u003c/b>\u003cb class=\"key\">옐로카드\u003c/b>를 언급하여 소재를 도입하는 단계입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간의 접속사\u003c/span> : when + 주어 + 동사 : \"~할 때\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"In soccer games, 축구 경기에서. referees use, 심판들은 사용해요. red and yellow cards, 레드카드와 옐로카드를. when players, 선수들이 ~할 때. don't follow the rules, 규칙을 따르지 않을 (때).. 이 문장 전체를 해석하면, 축구 경기에서 심판들은 선수들이 규칙을 따르지 않을 때 레드카드와 옐로카드를 사용해요.","hl":"m"},{"n":13,"text":"여러분, 축구 하면 떠오르는 레드카드와 옐로카드가 왜 쓰이는지 설명하며 글을 시작하고 있어요. 선수들이 규칙을 지키지 않는 상황, 즉 반칙을 했을 때 주어지는 경고와 퇴장 시스템을 짚어주며 독자의 관심을 끌고 있네요.","hl":"mn"},{"n":14,"text":"문법 포인트를 볼까요? 첫 번째로 접속사 when이 쓰였는데요. 선수들이 규칙을 따르지 않는다는 문장 앞에 붙어서 두 개의 절을 연결하며 그러한 시간적 상황을 나타내는 역할을 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 이제,\u003c/span>\u003cspan class=\"en\">But now,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~이 있어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">there's\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새로운 화이트카드가!\u003c/span>\u003cspan class=\"en\">a new white card!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 이제, 새로운 화이트카드가 있어요!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 기존의 벌칙용 카드와는 대조되는 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">소재\u003c/b>인 화이트카드를 소개합니다. 역접의 접속사 \u003cb class=\"key\">But\u003c/b>을 사용해 독자의 호기심을 유발하며 화제를 전환합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">there is/are 구문\u003c/span> : there [유도부사] + is [동사] + a new white card [주어] : \"~이 있다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"But now, 그러나 이제. there's, ~이 있어요. a new white card!, 새로운 화이트카드가!. 이 문장 전체를 해석하면, 그러나 이제, 새로운 화이트카드가 있어요!","hl":"m"},{"n":16,"text":"앞서 말한 벌칙 카드들과는 정반대되는 아주 흥미로운 소재인 화이트카드를 처음으로 등장시키고 있어요. 하지만이라는 뜻의 But을 써서 분위기를 반전시키며 새로운 소재를 소개하고 있네요.","hl":"mn"},{"n":17,"text":"문법을 보면 there is 구문이 쓰였는데요. 줄여서 there's라고 썼죠. 이 뒤에는 문장의 진짜 주어인 a new white card가 오는데 새로운 정보를 소개할 때 쓰며 주어가 단수이기 때문에 is를 쓴 것이 핵심이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 카드는 ~을 위한 것이에요\u003c/span>\u003cspan class=\"en\">This card is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">선수, 코치, 또는 의료진을 (위한)\u003c/span>\u003cspan class=\"en\">for players, coaches, or medical staff\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보여주는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">who\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">show\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">좋은 태도를.\u003c/span>\u003cspan class=\"en\">good behavior.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 카드는 좋은 태도를 보이는 선수, 코치, 또는 의료진에게 주는 것이에요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 화이트카드의 구체적인 \u003cb class=\"key\">수여 \u003c/b>\u003cb class=\"key\">대상\u003c/b>과 목적을 정의합니다. 벌칙이 아닌 \u003cb class=\"key\">긍정적 \u003c/b>\u003cb class=\"key\">행동\u003c/b>에 대해 보상하는 카드라는 점을 명확히 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : 선행사(사람) + who [주격 관계대명사] + show [동사] : \"~하는 (사람들)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동사의 수 일치\u003c/span> : who [관계대명사] + show [복수동사] : \"보여주다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"This card is, 이 카드는 ~을 위한 것이에요. for players, coaches, or medical staff, 선수, 코치, 또는 의료진을 (위한). who show, 보여주는. good behavior, 좋은 태도를.. 이 문장 전체를 해석하면, 이 카드는 좋은 태도를 보이는 선수, 코치, 또는 의료진에게 주는 것이에요.","hl":"m"},{"n":19,"text":"화이트카드가 단순히 선수뿐만 아니라 코치나 의료진에게도 주어질 수 있다는 수여 대상을 알려주네요. 반칙이 아니라 긍정적 행동을 칭찬하기 위해 만든 카드라는 점이 아주 인상적입니다.","hl":"mn"},{"n":20,"text":"문법 포인트 두 가지를 짚어볼게요. 첫 번째로 who는 앞에 나온 사람들을 꾸며주는 주격 관계대명사로 뒤에 불완전한 절을 이끌어요. 두 번째로 show라는 동사는 선행사가 복수이기 때문에 선행사의 수에 맞춰서 s를 붙이지 않은 복수 동사 형태를 써야 한다는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">포르투갈에서,\u003c/span>\u003cspan class=\"en\">In Portugal,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Catarina Campos라는 이름의 한 심판이\u003c/span>\u003cspan class=\"en\">a referee \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">named \u003c/span>\u003cspan class=\"tgt\">Catarina \u003c/span>\u003cspan class=\"tgt\">Campos\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사용하기 시작했어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">started \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">use\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">화이트카드를 처음으로요.\u003c/span>\u003cspan class=\"en\">the white card first.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">포르투갈의 Catarina Campos라는 심판이 처음으로 화이트카드를 사용하기 시작했어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 화이트카드가 처음으로 \u003cb class=\"key\">공식 \u003c/b>\u003cb class=\"key\">경기\u003c/b>에서 사용된 구체적인 \u003cb class=\"key\">사례\u003c/b>를 소개하는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사의 후치 수식\u003c/span> : 명사 + [named (과거분사) + 보어] : \"Catarina Campos라는 이름의\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : start [동사] + [to use (to부정사구/목적어)] : \"사용하기 시작했다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"In Portugal, 포르투갈에서. a referee named Catarina Campos, Catarina Campos라는 이름의 한 심판이. started to use, 사용하기 시작했어요. the white card first, 화이트카드를 처음으로요.. 이 문장 전체를 해석하면, 포르투갈의 Catarina Campos라는 심판이 처음으로 화이트카드를 사용하기 시작했어요.","hl":"m"},{"n":22,"text":"이 문장은 화이트카드가 실제 축구 경기에서 처음 쓰인 구체적인 사례를 보여주는 문장이에요. 포르투갈의 카타리나 캄포스 심판이 이 역사적인 공식 경기에서 처음으로 카드를 꺼내 든 것이죠.","hl":"mn"},{"n":23,"text":"첫 번째 포인트는 명사 뒤에 온 과거분사 named예요. 이 부분이 심판의 이름을 보충 설명하고 있죠. 두 번째 포인트는 started to use로, 무엇을 시작했는지 나타내는 목적어 자리에 to부정사를 썼답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 도입되었어요\u003c/span>\u003cspan class=\"en\">It \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">introduced\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">경기 중에\u003c/span>\u003cspan class=\"en\">during a game\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">두 팀 간의\u003c/span>\u003cspan class=\"en\">between the two teams\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Benfica와 Sporting Lisbon인.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">Benfica \u00 s=\"tgt\">crowd \u003c/span>\u003cspan class=\"tgt\">got \u003c/span>\u003cspan class=\"tgt\">sick\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">두 팀의 의료진들이\u003c/span>\u003cspan class=\"en\">medical staff from both teams\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">재빠르게 갔어요\u003c/span>\u003cspan class=\"en\">quickly went\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">도움 주러.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">help\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">관중 중에 한 사람이 아프게 되자, 두 팀의 의료진들이 재빠르게 도움을 주러 갔어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 화이트카드가 제시된 \u003cb class=\"key\">직접적인 \u003c/b>\u003cb class=\"key\">계기\u003c/b>를 묘사하며, 스포츠맨십이 발휘된 \u003cb class=\"key\">미담 \u003c/b>\u003cb class=\"key\">사례\u003c/b>를 전달합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간의 부사절\u003c/span> : When [접속사] + 주어 + 동사 : \"관중 중에 한 사람이 아프게 되었을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : 동사 + [to + 동사원형] : \"도움을 주기 위해서\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"When a person, 한 사람이. in the crowd got sick, 관중 중에 아프게 되자. medical staff from both teams, 두 팀의 의료진들이. quickly went, 재빠르게 갔어요. to help, 도움 주러.. 이 문장 전체를 해석하면, 관중 중에 한 사람이 아프게 되자, 두 팀의 의료진들이 재빠르게 도움을 주러 갔어요.","hl":"m"},{"n":28,"text":"화이트카드가 왜 나오게 되었는지 그 결정적인 사건을 설명하는 장면이에요. 경쟁 관계인 양 팀의 의료진이 아픈 관중을 돕기 위해 한마음으로 움직인 감동적인 상황을 묘사하고 있습니다.","hl":"mn"},{"n":29,"text":"첫 번째로 When으로 시작하는 문장은 특정한 사건이 벌어진 시간적 상황을 나타내는 부사절이에요. 두 번째로 문장 끝에 있는 to help는 의료진이 그곳에 간 목적이 무엇인지 설명해 주는 부사적 용법으로 쓰였습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">심판은 감동받았어요\u003c/span>\u003cspan class=\"en\">The referee \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">moved\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 빠른 대응에\u003c/span>\u003cspan class=\"en\">by their quick response\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서 그녀는 그들에게 주었어요\u003c/span>\u003cspan class=\"en\">so she \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">gave \u003c/span>\u003cspan class=\"tgt\">them \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">화이트카드를요!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">white \u003c/span>\u003cspan class=\"tgt\">card\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">심판은 그들의 빠른 대응에 감동받아 그들에게 화이트카드를 주었어요!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 의료진의 선행에 감동한 심판이 보상으로 \u003cb class=\"key\">화이트카드\u003c/b>를 꺼낸 상황입니다. 이 카드는 훌륭한 행동에 대한 \u003cb class=\"key\">칭찬과 \u003c/b>\u003cb class=\"key\">격려\u003c/b>의 상징으로 사용되었습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태 (감정 유발)\u003c/span> : be [동사] + [moved (과거분사)] : \"감동받았다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">4형식 수여동사 구문\u003c/span> : give [동사] + [them (간접목적어)] + [a white card (직접목적어)] : \"그들에게 화이트카드를 주었다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"The referee was moved, 심판은 감동받았어요. by their quick response, 그들의 빠른 대응에. so she gave them, 그래서 그녀는 그들에게 주었어요. a white card!, 화이트카드를요!. 이 문장 전체를 해석하면, 심판은 그들의 빠른 대응에 감동받아 그들에게 화이트카드를 주었어요!","hl":"m"},{"n":31,"text":"의료진이 아픈 관중을 돕기 위해 빠르게 움직인 모습에 심판이 큰 감동을 했다는 내용이에요. 여기서 화이트카드는 훌륭한 행동을 한 사람에게 주는 칭찬의 의미를 담고 있죠.","hl":"mn"},{"n":32,"text":"첫 번째로 was moved는 심판이 감동을 받은 상태를 나타내는 수동태 표현이에요. 두 번째로 gave them a white card는 누구에게 무엇을 주었다는 의미의 사형식 문장 구조랍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만, 피파는 승인하지 않았어요 화이트카드의 사용을 아직\u003c/span>\u003cspan class=\"en\">But, **FIFA \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">hasn't \u003c/span>\u003cspan class=\"tgt\">approved\u003c/span> the use of the white card yet.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만, FIFA는 아직 화이트카드의 사용을 승인하지 않았어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 포르투갈의 사례와 달리 전 세계 축구를 관장하는 기관에서는 아직 이 카드를 \u003cb class=\"key\">공식적인\u003c/b> 규칙으로 \u003cb class=\"key\">승인\u003c/b>하지 않았음을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재완료 시제의 부정\u003c/span> : has [조동사] + [not] + [approved (과거분사)] : \"승인하지 않았다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"But, FIFA, 하지만, 피파는. hasn't approved, 승인하지 않았어요. the use of the white card yet, 화이트카드의 사용을 아직. 이 문장 전체를 해석하면, 하지만, FIFA는 아직 화이트카드의 사용을 승인하지 않았어요.","hl":"m"},{"n":34,"text":"화이트카드가 좋은 취지로 도입되었지만 전 세계 축구를 관장하는 피파에서 아직 공식 허가를 내준 건 아니라는 뜻이에요. 제도 정착에는 시간이 더 필요하다는 한계점을 보여주네요.","hl":"mn"},{"n":35,"text":"첫 번째로 hasn't approved는 과거부터 지금까지 승인이 이루어지지 않았음을 강조하는 현재완료 시제의 부정형이에요. 문장 끝에 나오는 yet과 함께 쓰여서 아직 하지 않았다는 의미를 더해주고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오직 포르투갈만이\u003c/span>\u003cspan class=\"en\">Only Portugal\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">화이트카드를 사용하고 있어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">using\u003c/span> white cards\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">현재 축구에서요.\u003c/span>\u003cspan class=\"en\">in soccer right now.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">포르투갈만이 현재 축구에서 화이트카드를 사용하고 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 화이트카드가 전 세계적인 공통 규칙이 아니라 현재는 \u003cb class=\"key\">포르투갈\u003c/b>이라는 특정 국가 내에서만 \u003cb class=\"key\">제한적으로\u003c/b> 시행되고 있다는 사실을 명시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재진행형\u003c/span> : be [동사] + [using (현재분사)] : \"사용하고 있는 중이다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Only Portugal, 오직 포르투갈만이. is using white cards, 화이트카드를 사용하고 있어요. in soccer right now, 현재 축구에서요.. 이 문장 전체를 해석하면, 포르투갈만이 현재 축구에서 화이트카드를 사용하고 있어요.","hl":"m"},{"n":37,"text":"국제 축구 연맹의 승인이 없기 때문에 이 제도는 현재 포르투갈 한 국가에서만 시범적으로 운영되고 있다는 사실을 알려주는 문장입니다.","hl":"mn"},{"n":38,"text":"첫 번째로 is using은 지금 이 순간에도 사용이 계속되고 있음을 나타내는 현재진행형 시제예요. 주어인 Only Portugal에 맞춰서 비동사 is를 썼다는 점에 주의하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은 생각하시나요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Do \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">think \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 좋은 생각이라고,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">it's\u003c/span> a good idea,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 다른 나라들도 해야 할까요\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">should \u003c/span>\u003cspan class=\"tgt\">other \u003c/span>\u003cspan class=\"tgt\">countries \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">화이트카드를 또한 사용하는 것을?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">use\u003c/span> white cards too?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여러분은 그것이 좋은 생각이라고 생각하시나요, 그리고 다른 나라들도 화이트카드를 사용해야 할까요?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글을 마무리하며 독자에게 \u003cb class=\"key\">화이트카드\u003c/b> 도입에 대한 의견을 묻고 있습니다. 도입의 긍정적인 면을 고려하여 \u003cb class=\"key\">비판적 \u003c/b>\u003cb class=\"key\">사고\u003c/b>를 유도하는 질문입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that의 생략\u003c/span> : think [타동사] + [(that) + it's (S+V/목적어)] : \"그것이 ~라고 생각하니\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 의문문\u003c/span> : Should [조동사] + other countries [주어] + use [동사원형] ~? : \"다른 나라들도 사용해야 할까\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"Do you think, 여러분은 생각하시나요. it's a good idea, 그것이 좋은 생각이라고. and should other countries, 그리고 다른 나라들도 해야 할까요. use white cards too?, 화이트카드를 또한 사용하는 것을?. 이 문장 전체를 해석하면, 여러분은 그것이 좋은 생각이라고 생각하시나요, 그리고 다른 나라들도 화이트카드를 사용해야 할까요?","hl":"m"},{"n":40,"text":"이 문장은 글의 마지막에서 독자의 의견을 직접 묻고 있어요. 포르투갈에서 시작된 화이트카드 제도를 다른 나라들도 도입하면 좋을지 여러분이 스스로 비판적 사고를 해보도록 유도하는 역할을 합니다.","hl":"mn"},{"n":41,"text":"첫 번째 포인트는 think 뒤에 접속사 that이 생략된 명사절 구조예요. think와 it 사이에 문장을 연결해 주는 장치가 숨어 있다고 보면 되죠. 두 번째는 조동사 should를 활용한 의문문입니다. 주어인 other countries 앞에 조동사를 써서 의무의 의미를 담아 물어보고 있어요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>축구 경기에서 잘못을 처벌하는 기존 카드와 달리 칭찬을 위한 \u003cb class=\"key\">화이트카드\u003c/b>가 도입되었습니다.\u003c/li>\u003cli>이 카드는 페어플레이를 보여준 선수, 코치, \u003cb class=\"key\">의료진\u003c/b>에게 수여될 수 있습니다.\u003c/li>\u003cli>포르투갈의 카타리나 캄포스 심판이 \u003cb class=\"key\">응급 \u003c/b>\u003cb class=\"key\">상황\u003c/b>에 대처한 의료진에게 처음으로 사용했습니다.\u003c/li>\u003cli>현재 \u003cb class=\"key\">FIFA\u003c/b>의 공식 승인은 받지 못한 상태이며 포르투갈에서만 사용되고 있습니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Portugal has introduced the white card to reward sportsmanship in soccer, although it is not yet globally standardized by FIFA.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">축구에서 규칙 위반을 처벌하는 기존 카드와 달리, \u003cb class=\"key\">좋은 \u003c/b>\u003cb class=\"key\">태도\u003c/b>를 보인 이들을 칭찬하기 위해 도입된 \u003cb class=\"key\">화이트카드\u003c/b>의 유래와 현황을 다루고 있습니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":42,"text":"오늘은 축구의 새로운 문화인 화이트카드에 대해 알아보았습니다. 스포츠가 단순히 이기고 지는 것을 넘어 서로를 돕는 가치를 소중히 여기는 모습이 인상 깊었죠? 여러분도 오늘 배운 핵심 표현들을 복습하면서 페어플레이의 의미를 다시 한번 생각해보세요. 수고하셨습니다!","hl":null}]}]});</script></body></html>
