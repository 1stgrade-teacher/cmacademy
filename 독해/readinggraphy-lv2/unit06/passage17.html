</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}

    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}

  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}

lecturePlayer(document.getElementById("app"),{"brand":"청명학원 영어과","title":"리딩그라피2 리딩그라피레벨2 17번","audioDir":"audio","preview":false,"count":51,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.400em\">리딩그라피레벨2\u003cbr>17번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩그라피2\u003c/div>\u003ch1>The Ancient Chinese Version of Latte Art: Chabaixi\u003c/h1>\u003ch2>라테 아트의 고대 중국판: Chabaixi(차바이시)\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>현대의 \u003cb class=\"key\">라테 \u003c/b>\u003cb class=\"key\">아트\u003c/b>와 유사한 방식으로 차 거품 위에 그림을 그리는 고대 중국의 예술인 \u003cb class=\"key\">Chabaixi\u003c/b>의 제조 과정과 특징을 소개합니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Chabaixi is an ancient Chinese tea art that creates temporary designs using water and tea powder, similar to modern latte art.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분! 여러분은 카페에서 커피 위에 예쁜 그림이 그려진 것을 본 적이 있나요? 오늘은 우리에게 익숙한 Latte Art와 아주 닮은 고대 중국의 신비로운 차 예술을 소개하려고 합니다. 바로 Chabaixi에 대한 이야기인데요, 수천 년 전 조상들은 어떻게 차 위에 예술을 펼쳤는지 함께 알아봅시다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">고대 중국 송나라 시대에는 찻잎 가루에 뜨거운 물을 붓고 휘저어 미세한 거품을 내는 \u003cb class=\"key\">점다법(点茶法)\u003c/b>이 유행했습니다. 이 하얀 \u003cb class=\"key\">거품\u003c/b> 위에 물을 떨어뜨려 그림을 그리는 정교한 기술이 바로 \u003cb class=\"key\">Chabaixi\u003c/b>입니다. 마치 우리가 카페에서 카푸치노의 하얀 우유 거품 위에 초코 시럽으로 그림을 그리듯, 과거의 예술가들은 차를 통해 자신들의 \u003cb class=\"key\">예술성(Artistry)\u003c/b>을 뽐냈습니다. 이 기술은 한동안 잊혔다가 최근 중국의 무형문화유산으로 복원되어 다시금 큰 관심을 받고 있습니다.\u003c/div>","segs":[{"n":2,"text":"이 글을 이해하려면 고대 중국의 차 문화를 조금 알아야 해요. 송나라 시대에는 찻잎을 아주 고운 가루로 만들어 뜨거운 물에 섞은 뒤, 대나무 도구로 빠르게 저어 하얀 거품을 내는 점다법이라는 방식이 유행했습니다. 오늘날 우리가 카푸치노 거품을 즐기듯, 그들도 차 거품을 아주 중요하게 생각했죠. 이 하얀 거품 위에 그림을 그리는 Chabaixi는 조상들의 높은 예술성을 보여주는 아주 특별한 기술이었습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>라테 아트의 정의\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>독자에게 친숙한 소재인 \u003cb class=\"key\">라테 \u003c/b>\u003cb class=\"key\">아트(latte \u003c/b>\u003cb class=\"key\">art)\u003c/b>를 언급하며, 이것이 우유를 사용해 커피를 꾸미는 \u003cb class=\"key\">창의적인 \u003c/b>\u003cb class=\"key\">방법\u003c/b>임을 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>과거의 유사 사례\u003csmall>전환 · 문장 4\u003c/small>\u003c/h4>\u003cp>수천 년 전 중국에서도 라테 아트와 \u003cb class=\"key\">유사한 \u003c/b>\u003cb class=\"key\">예술\u003c/b>이 존재했음을 알리며 독자의 \u003cb class=\"key\">호기심\u003c/b>을 유발합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>Chabaixi의 소개와 과정\u003csmall>예시 및 설명 · 문장 5–9\u003c/small>\u003c/h4>\u003cp>고대 중국의 차 예술인 \u003cb class=\"key\">Chabaixi\u003c/b>의 의미를 풀이하고, 찻잎 가루를 물과 섞어 \u003cb class=\"key\">거품\u003c/b>을 낸 뒤 숟가락으로 그림을 그리는 \u003cb class=\"key\">제조 \u003c/b>\u003cb class=\"key\">과정\u003c/b>을 상세히 묘사합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>비교 및 특징\u003csmall>결론 · 문장 10–13\u003c/small>\u003c/h4>\u003cp>우유를 쓰는 현대의 아트와 달리 \u003cb class=\"key\">맑은 \u003c/b>\u003cb class=\"key\">물\u003c/b>을 사용하는 Chabaixi의 차이점을 설명하고, 20분이라는 \u003cb class=\"key\">짧은 \u003c/b>\u003cb class=\"key\">유지 \u003c/b>\u003cb class=\"key\">시간\u003c/b>의 미학을 강조하며 마무리합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 현대의 문화에서 시작해 고대의 비슷한 문화를 대조하며 설명하는 방식으로 흐릅니다.","hl":null},{"n":4,"text":"첫 번째 단계에서는 우리가 잘 아는 Latte Art를 도입부로 삼아 독자의 흥미를 끕니다. 이것이 우유를 활용해 커피를 꾸미는 창의적인 방법이라는 점을 먼저 짚어주죠.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 분위기를 전환하며 흥미롭게도 수천 년 전 중국에 이와 유사한 예술이 있었다는 사실을 밝힙니다. 현대와 과거를 잇는 중요한 문장이에요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 본격적인 설명으로, Chabaixi의 정의와 만드는 법을 상세히 알려줍니다. 찻잎을 가루로 만들고 물과 섞어 거품을 낸 뒤 숟가락으로 그림을 그리는 구체적인 과정을 묘사하고 있어요.","hl":"f2"},{"n":7,"text":"마지막 단계에서는 현대의 아트와 다른 점을 비교하며 마무리합니다. 우유 대신 맑은 물을 사용한다는 차이점과, 비록 금방 사라지지만 그 짧은 순간을 즐기는 묘미를 설명하고 있습니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">비교·대조\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 4번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">현대의 \u003cb class=\"key\">라테 \u003c/b>\u003cb class=\"key\">아트\u003c/b>를 먼저 제시하여 흥미를 끈 뒤, 이와 유사한 성격의 고대 예술인 \u003cb class=\"key\">Chabaixi\u003c/b>를 본격적으로 소개하는 구조입니다. 두 예술의 \u003cb class=\"key\">공통점과 \u003c/b>\u003cb class=\"key\">차이점\u003c/b>을 중심으로 내용이 전개됩니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Interestingly (4)\u003c/b>\u003cspan>분위기 전환 및 강조\u003c/span>\u003cb>Then (8)\u003c/b>\u003cspan>순서 나열\u003c/span>\u003cb>After that (9)\u003c/b>\u003cspan>순서 나열\u003c/span>\u003cb>different from (10)\u003c/b>\u003cspan>대조\u003c/span>\u003cb>Instead of (11)\u003c/b>\u003cspan>대조\u003c/span>\u003cb>Although (13)\u003c/b>\u003cspan>양보\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">coffee with a picture on top\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">latte art\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">something similar\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">ancient Chinese tea art\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Chabaixi\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a hundred tricks with tea\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Modern Latte Art\u003c/th>\u003cth>Ancient Chabaixi\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Uses milk\u003c/td>\u003ctd>Uses clear water\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Coffee base\u003c/td>\u003ctd>Tea powder base\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Modern creativity\u003c/td>\u003ctd>Ancient tradition\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 지문은 현대와 과거의 두 대상을 나란히 놓고 비교하는 비교 대조의 전개 방식을 취하고 있습니다. 주제문이 글의 중간 부분인 네 번째 문장에 나타나는 중괄식 구조로, 친숙한 소재에서 생소한 소재로 자연스럽게 시선을 옮겨가죠.","hl":"ty"},{"n":9,"text":"문맥을 이어주는 신호어들을 잘 보세요. 네 번째 문장의 Interestingly는 독자의 시선을 집중시키는 역할을 하고, 열 번째 문장의 different from이나 열한 번째 문장의 Instead of는 Latte Art와의 차별점을 보여주는 핵심 장치들입니다. Although를 사용해 그림이 짧게 유지된다는 한계를 반전시키며 예술적 가치를 강조한 점도 인상적입니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>top\u003c/b>\u003cem>명사\u003c/em>\u003cspan>윗부분\u003c/span>\u003c/div>\u003cdiv>\u003cb>be known as\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 알려져 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>latte art\u003c/b>\u003cem>명사\u003c/em>\u003cspan>라테 아트\u003c/span>\u003c/div>\u003cdiv>\u003cb>creative\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>창의적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>decorate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>장식하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>interestingly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>흥미롭게도\u003c/span>\u003c/div>\u003cdiv>\u003cb>similar\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>비슷한\u003c/span>\u003c/div>\u003cdiv>\u003cb>thousands of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>수천 명의, 수천 개의\u003c/span>\u003c/div>\u003cdiv>\u003cb>ancient\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>고대의\u003c/span>\u003c/div>\u003cdiv>\u003cb>trick\u003c/b>\u003cem>명사\u003c/em>\u003cspan>묘기, 비결\u003c/span>\u003c/div>\u003cdiv>\u003cb>powder\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가루\u003c/span>\u003c/div>\u003cdiv>\u003cb>mix\u003c/b>\u003cem>동사\u003c/em>\u003cspan>섞다\u003c/span>\u003c/div>\u003cdiv>\u003cb>until\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>~할 때까지\u003c/span>\u003c/div>\u003cdiv>\u003cb>foamy\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>거품이 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>special\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>특별한\u003c/span>\u003c/div>\u003cdiv>\u003cb>spoon\u003c/b>\u003cem>명사\u003c/em>\u003cspan>숟가락\u003c/span>\u003c/div>\u003cdiv>\u003cb>bamboo\u003c/b>\u003cem>명사\u003c/em>\u003cspan>대나무\u003c/span>\u003c/div>\u003cdiv>\u003cb>different from\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~와 다른\u003c/span>\u003c/div>\u003cdiv>\u003cb>clear water\u003c/b>\u003cem>명사\u003c/em>\u003cspan>맑은 물\u003c/span>\u003c/div>\u003cdiv>\u003cb>instead of\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~ 대신에\u003c/span>\u003c/div>\u003cdiv>\u003cb>design\u003c/b>\u003cem>명사\u003c/em>\u003cspan>무늬, 디자인\u003c/span>\u003c/div>\u003cdiv>\u003cb>touch\u003c/b>\u003cem>동사\u003c/em>\u003cspan>닿다, 만지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>disappear\u003c/b>\u003cem>동사\u003c/em>\u003cspan>사라지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>enough\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>충분한\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"여기서 중요한 단어들을 살펴볼까요? ancient는 고대의라는 뜻으로 현대의와 반대되는 개념이고, disappear는 사라지다라는 뜻으로 그림의 일시적인 성격을 나타낼 때 쓰였습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">decorate\u003c/b>\u003cspan class=\"m\">장식하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">adorn\u003c/span>\u003cspan class=\"s\">ornament\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">ancient\u003c/b>\u003cspan class=\"m\">고대의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">antique\u003c/span>\u003cspan class=\"s\">archaic\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">modern\u003c/span>\u003cspan class=\"a\">current\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">similar\u003c/b>\u003cspan class=\"m\">비슷한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">alike\u003c/span>\u003cspan class=\"s\">resembling\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">different\u003c/span>\u003cspan class=\"a\">distinct\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">disappear\u003c/b>\u003cspan class=\"m\">사라지다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">vanish\u003c/span>\u003cspan class=\"s\">fade\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">appear\u003c/span>\u003cspan class=\"a\">emerge\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">enough\u003c/b>\u003cspan class=\"m\">충분한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">sufficient\u003c/span>\u003cspan class=\"s\">adequate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">insufficient\u003c/span>\u003cspan class=\"a\">scant\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 챙겨봅시다. decorate는 adorn이나 ornament로 바꿔 쓸 수 있고, ancient의 반대말은 modern입니다. 사라지다라는 뜻의 disappear는 vanish와 뜻이 같지만 나타나다는 뜻의 appear와는 반대말이라는 점을 꼭 기억하세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">본 적 있나요\u003c/span>\u003cspan class=\"en\">17 \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Have \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">seen\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">커피를\u003c/span>\u003cspan class=\"en\">coffee\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그림이 그려진\u003c/span>\u003cspan class=\"en\">with a picture\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">위에?\u003c/span>\u003cspan class=\"en\">on top?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여러분은 위에 그림이 그려진 커피를 본 적이 있나요?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 독자에게 친숙한 \u003cb class=\"key\">경험\u003c/b>을 물어보며 '라테 아트'라는 주제를 흥미롭게 \u003cb class=\"key\">도입\u003c/b>하는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재완료의 경험 용법\u003c/span> : Have + [주어] + [과거분사 (p.p.)]? : \"본 적이 있나요\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Have you seen, 본 적 있나요. coffee, 커피를. with a picture, 그림이 그려진. on top?, 위에?. 이 문장 전체를 해석하면, 여러분은 위에 그림이 그려진 커피를 본 적이 있나요?","hl":"m"},{"n":13,"text":"여러분, 커피 위에 예쁜 그림이 있는 걸 본 적이 있는지 물어보고 있어요. 우리가 잘 아는 소재로 이야기를 시작하며 호기심을 자극하는 도입부예요.","hl":"mn"},{"n":14,"text":"첫 번째로 Have you seen 부분을 볼게요. Have와 과거분사 seen이 결합한 현재완료 시제인데, 여기서는 과거부터 지금까지의 경험을 묻는 용법으로 쓰였어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은\u003c/span>\u003cspan class=\"en\">It\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~로 알려져 있어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">known \u003c/span>\u003cspan class=\"tgt\">as\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘라테 아트’로\u003c/span>\u003cspan class=\"en\">&quot;latte art.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 ‘라테 아트’로 알려져 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 언급한 '그림 그려진 커피'를 구체적인 \u003cb class=\"key\">용어\u003c/b>인 '라테 아트'로 정의하여 \u003cb class=\"key\">이해\u003c/b>를 돕습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태 (be known as)\u003c/span> : be + known + as + [명사/자격] : \"~로 알려져 있다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"It, 그것은. is known as, ~로 알려져 있어요. \"latte art.\", ‘라테 아트’로. 이 문장 전체를 해석하면, 그것은 ‘라테 아트’로 알려져 있어요.","hl":"m"},{"n":16,"text":"앞에서 말한 그림 그려진 커피가 무엇인지 정확한 이름을 알려주고 있어요. 바로 라테 아트라는 용어를 정의하는 문장이지요.","hl":"mn"},{"n":17,"text":"첫 번째로 is k hl":"m"},{"n":22,"text":"요즘 유행하는 라떼 아트와 비슷한 예술이 아주 오래전 중국에도 있었다는 놀라운 사실을 소개하며 독자의 호기심을 자극하고 있어요. 현대와 과거를 연결하는 역할을 하는 문장이죠.","hl":"mn"},{"n":23,"text":"첫 번째 포인트는 was happening입니다. 과거 진행형을 사용해서 그 당시에 일이 진행 중이었음을 생생하게 묘사하고 있어요. 두 번째로 thousands of는 뒤에 에스(s)를 붙여서 수천 명이나 수천 년처럼 막연하고 큰 숫자를 나타낼 때 쓰는 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고대 중국의 차 예술은 \u003c/span>\u003cspan class=\"en\">The ancient Chinese tea art\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">불렸어요 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">called\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Chabaixi라고.\u003c/span>\u003cspan class=\"en\">Chabaixi.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">고대 중국의 차 예술은 Chabaixi라고 불렸어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글의 구체적인 소재인 \u003cb class=\"key\">Chabaixi\u003c/b>의 이름을 소개하며 \u003cb class=\"key\">정의\u003c/b>를 시작하는 단계입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : be동사(was) + 과거분사(called) : \"~라고 불렸다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"The ancient Chinese tea art, 고대 중국의 차 예술은. was called, 불렸어요. Chabaixi, Chabaixi라고.. 이 문장 전체를 해석하면, 고대 중국의 차 예술은 Chabaixi라고 불렸어요.","hl":"m"},{"n":25,"text":"이제 본격적으로 중국의 차 예술인 Chabaixi라는 구체적인 이름을 제시하며 글의 주제를 좁혀가고 있습니다. 이 예술이 무엇인지 정의하는 첫걸음이죠.","hl":"mn"},{"n":26,"text":"여기서 핵심은 was called라는 수동태 표현이에요. 예술이라는 주어는 스스로 이름을 부를 수 없기 때문에 비동사와 과거분사를 결합한 수동태를 써서 불리는 상태임을 나타내야 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 \u003c/span>\u003cspan class=\"en\">It\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">의미해요 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">means\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘백 가지 묘기’를 \u003c/span>\u003cspan class=\"en\">&quot;a hundred tricks\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">차를 이용한’이라는.\u003c/span>\u003cspan class=\"en\">with tea.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 ‘차를 이용한 백 가지 묘기’라는 뜻이에요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 생소한 명칭인 Chabaixi의 \u003cb class=\"key\">의미와 \u003c/b>\u003cb class=\"key\">어원\u003c/b>을 풀이하여 독자의 \u003cb class=\"key\">이해\u003c/b>를 돕고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재 시제\u003c/span> : 주어(3인칭 단수) + 동사-s : \"의미한다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"It, 그것은. means, 의미해요. \"a hundred tricks, ‘백 가지 묘기’를. with tea.\", 차를 이용한’이라는.. 이 문장 전체를 해석하면, 그것은 ‘차를 이용한 백 가지 묘기’라는 뜻이에요.","hl":"m"},{"n":28,"text":"생소한 단어인 Chabaixi가 정확히 무슨 뜻인지 풀어서 설명해 주는 문장이에요. 차를 활용해서 백 가지나 되는 다양한 기술을 부릴 수 있다는 점을 강조하고 있죠.","hl":"mn"},{"n":29,"text":"첫 번째로 주어 It은 바로 앞 문장에 나온 Chabaixi를 가리키는 대명사예요. 두 번째로 동사 means는 현재 시제인데, 단어의 뜻과 같은 일반적인 사실을 말할 때는 항상 현재형을 써야 한다는 점을 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Chabaixi를 만들기 위해, \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">To \u003c/span>\u003cspan class=\"tgt\">make\u003c/span> Chabaixi,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예술가들은 먼저 \u003c/span>\u003cspan class=\"en\">artists first\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">찻잎을 만들었어요 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">turned \u003c/span>\u003cspan class=\"tgt\">tea \u003c/span>\u003cspan class=\"tgt\">leaves \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가루로.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">into \u003c/span>\u003cspan class=\"tgt\">powder\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Chabaixi를 만들기 위해, 예술가들은 먼저 찻잎을 가루로 만들었어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 차바이시라는 전통 차 예술의 첫 번째 \u003cb class=\"key\">제작 \u003c/b>\u003cb class=\"key\">단계\u003c/b>를 설명합니다. 잎 형태의 차를 미세한 \u003cb class=\"key\">가루 \u003c/b>\u003cb class=\"key\">형태\u003c/b>로 변환하는 과정을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : to + [동사원형 (make)] : \"만들기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동사 구문 (turn A into B)\u003c/span> : turn + [목적어 (A)] + into + [결과 (B)] : \"찻잎을 가루로 만들었다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"To make Chabaixi, Chabaixi를 만들기 위해. artists first, 예술가들은 먼저. turned tea leaves, 찻잎을 만들었어요. into powder, 가루로.. 이 문장 전체를 해석하면, Chabaixi를 만들기 위해, 예술가들은 먼저 찻잎을 가루로 만들었어요.","hl":"m"},{"n":31,"text":"이 문장은 차바이시라는 고대 예술을 어떻게 시작하는지 알려줘요. 찻잎을 그냥 우려내는 게 아니라 가루로 만드는 것이 첫 번째 단계라는 점에 주목하세요.","hl":"mn"},{"n":32,"text":"첫 번째 문법 포인트는 To make입니다. 문장 앞에서 목적을 나타내는 부사적 용법으로 쓰였죠. 두 번째는 turn A into B 구문인데요. 전치사 into를 사용해서 찻잎이 가루라는 새로운 형태로 변했다는 것을 표현하고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그다음에, 그들은 섞었어요 \u003c/span>\u003cspan class=\"en\">Then, they \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">mixed \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">물과 가루를 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">water \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">powder\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거품이 생길 때까지.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">until\u003c/span> it became *foamy.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그다음에, 그들은 거품이 생길 때까지 물과 가루를 섞었어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 가루가 된 차에 물을 섞어 \u003cb class=\"key\">거품\u003c/b>을 내는 다음 단계를 묘사합니다. 그림을 그리기 위한 \u003cb class=\"key\">바탕\u003c/b>을 만드는 과정입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사 구문 (mix A with B)\u003c/span> : mix + [대상 (A)] + with + [함께 섞는 것 (B)] : \"물과 가루를 섞었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">시간의 접속사\u003c/span> : until + [주어 + 동사] : \"~할 때까지\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"Then, they mixed, 그다음에, 그들은 섞었어요. water with the powder, 물과 가루를. until it became *foamy, 거품이 생길 때까지.. 이 문장 전체를 해석하면, 그다음에, 그들은 거품이 생길 때까지 물과 가루를 섞었어요.","hl":"m"},{"n":34,"text":"가루를 만든 뒤에는 물을 붓고 저어서 거품을 내는 과정이 이어져요. 이 거품이 있어야 나중에 그림을 그릴 수 있답니다.","hl":"mn"},{"n":35,"text":"첫 번째 포인트는 mix A with B입니다. 전치사 with를 사용해서 물과 가루를 함께 섞는다는 의미를 만들었죠. 두 번째 포인트는 접속사 until입니다. 단순히 섞는 게 아니라 거품이 일어나는 상태가 될 때까지 계속 섞었다는 시간의 한계를 정해줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 후, 그들은 사용했어요 \u003c/span>\u003cspan class=\"en\">After that, they \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">used \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">특별한 숟가락을 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">special \u003c/span>\u003cspan class=\"tgt\">spoon \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그림을 그리기 위해, \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">draw\u003c/span> pictures,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대나무나 산과 같은.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">like\u003c/span> bamboo and mountains.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 후, 그들은 대나무나 산과 같은 그림을 그리기 위해 특별한 숟가락을 사용했어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 예술가들이 사용하는 \u003cb class=\"key\">도구\u003c/b>와 즐겨 그렸던 \u003cb class=\"key\">소재\u003c/b>를 설명합니다. 차의 거품 위에 세밀한 그림을 그리는 \u003cb class=\"key\">최종 \u003c/b>\u003cb class=\"key\">단계\u003c/b>입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사 구문 (use A to do B)\u003c/span> : use + [목적어 (A)] + to + [동사원형 (B)] : \"그림을 그리기 위해 숟가락을 사용했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 (예시)\u003c/span> : like + [명사(구)] : \"~와 같은\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"After that, they used, 그 후, 그들은 사용했어요. a special spoon, 특별한 숟가락을. to draw pictures, 그림을 그리기 위해. like bamboo and mountains, 대나무나 산과 같은.. 이 문장 전체를 해석하면, 그 후, 그들은 대나무나 산과 같은 그림을 그리기 위해 특별한 숟가락을 사용했어요.","hl":"m"},{"n":37,"text":"마지막 단계에서는 도구를 활용해 거품 위에 그림을 그려요. 중국 예술답게 대나무나 산처럼 자연을 소재로 한 그림 ","hl":"mn"},{"n":41,"text":"첫 번째로 be different from 표현을 볼게요. 무엇과 다르다고 할 때 전치사 from을 쓴다는 점을 기억하세요. 두 번째로 a little은 뒤에 오는 형용사 different를 꾸며주며 약간이라는 의미를 더해줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 사용해요\u003c/span>\u003cspan class=\"en\">It uses\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">맑은 물을\u003c/span>\u003cspan class=\"en\">clear water\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우유 대신\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">instead \u003c/span>\u003cspan class=\"tgt\">of\u003c/span> milk\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">디자인을 만들기 위해.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">make\u003c/span> the designs.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 디자인을 만들기 위해 우유 대신 맑은 물을 사용해요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Chabaixi의 가장 큰 특징인 \u003cb class=\"key\">재료의 \u003c/b>\u003cb class=\"key\">차이\u003c/b>를 구체적으로 설명하며, \u003cb class=\"key\">대조\u003c/b>의 기법을 활용하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구(대체)\u003c/span> : instead of [전치사구] + milk [명사] : \"우유 대신에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : to [to부정사] + make [동사원형] : \"만들기 위해\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"It uses, 그것은 사용해요. clear water, 맑은 물을. instead of milk, 우유 대신. to make the designs, 디자인을 만들기 위해.. 이 문장 전체를 해석하면, 그것은 디자인을 만들기 위해 우유 대신 맑은 물을 사용해요.","hl":"m"},{"n":43,"text":"라테 아트는
