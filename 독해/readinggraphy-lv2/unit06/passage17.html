드는 과정</li><li>가루와 물을 섞어 거품(foamy) 형성</li><li>특별한 숟가락을 사용해 대나무와 산을 묘사</li><li>핵심 키워드: 가루(powder), 거품(foamy)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03현대와의 차이 및 특징</div><ul><li>우유를 사용하는 라떼 아트와 달리 차백희는 물을 사용하여 일시적인 아름다움을 만든다.</li><li>우유 대신 맑은 물(clear water) 사용</li><li>물이 차와 만나면서 흰색으로 변하는 원리</li><li>20분 후 사라지는 일시성(disappear)과 예술적 가치</li><li>핵심 키워드: 맑은 물(clear water), 일시성(disappear)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">known as</td><td class=\"m\">~로 알려진, ~라고 불리는</td></tr><tr><td class=\"w\">creative</td><td class=\"m\">창의적인, 독창적인</td></tr><tr><td class=\"w\">decorate</td><td class=\"m\">장식하다, 꾸미다</td></tr><tr><td class=\"w\">something similar</td><td class=\"m\">비슷한 무언가</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">turn into</td><td class=\"m\">~로 변하다, ~이 되다</td></tr><tr><td class=\"w\">be different from</td><td class=\"m\">~와 다르다</td></tr><tr><td class=\"w\">instead of</td><td class=\"m\">~대신에</td></tr><tr><td class=\"w\">disappear</td><td class=\"m\">사라지다, 보이지 않게 되다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">본 적 있나요</span><span class=\"en\"><b><span class=\"grammar-hl\">Have you seen</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">위에 그림이 있는 커피를?</span><span class=\"en\"><b>coffee with a picture on top?</b></span></div></div><div class=\"lec-sent-ko\">여러분은 위에 그림이 그려진 커피를 본 적이 있나요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 현대 카페에서 흔히 볼 수 있는 라떼 아트를 언급하며 독자의 경험을 환기하여 자연스럽게 주제인 &#39;음료 예술&#39;로 관심을 유도합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Have you seen (현재완료): 조동사 have + 과거분사(seen)를 사용하여 과거의 동작이 현재까지 영향을 미치거나 경험을 나타내는 시제 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은</span><span class=\"en\"><b>It <span class=\"grammar-hl\">is known as</span> “latte art.”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">알려져 있어요</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">‘라테 아트’로</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">그것은 ‘라테 아트’로 알려져 있어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 구체적인 대상을 명확하게 정의하여 이어질 글의 소재를 확정 짓는 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is known as (수동태): be동사(is)+p.p.(known) 구조입니다. know는 타동사인데 목적어가 없어서 수동구조 is known 형태로 씁니다. 기본구조: know A as B(A를 B라고 알다/여기다)의 패턴에서 목적어 A가 주어로 올라간 형태입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">known as</td><td class=\"m\">~로 알려진, ~라고 불리는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 창의적인 방법이에요</span><span class=\"en\"><b>It’s a creative <span class=\"grammar-hl\">way</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">커피를 장식하는</span><span class=\"en\"><b><span class=\"grammar-hl\">to decorate</span> coffee</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우유를 사용하여</span><span class=\"en\"><b><span class=\"grammar-hl\">using</span> milk.</b></span></div></div><div class=\"lec-sent-ko\">그것은 우유를 사용해 커피를 장식하는 창의적인 방법이에요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 라떼 아트가 단순히 음료를 만드는 과정이 아니라 시각적인 즐거움을 주기 위한 예술적 행위임을 설명하며 글의 성격을 밝힙니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">way to decorate (to부정사): to+decorate(동사원형) 형태가 앞의 명사 way를 뒤에서 수식하는 형용사적 용법입니다.</div><div class=\"lec-gr-item\">using (현재분사): using이 동반하는 milk와 함께 부사적 기능(분사구문)으로 쓰여, 원래 절로 변환하면 &#39;while they use milk&#39;의 의미를 가집니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">creative</td><td class=\"m\">창의적인, 독창적인</td></tr><tr><td class=\"w\">decorate</td><td class=\"m\">장식하다, 꾸미다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">흥미롭게도,</span><span class=\"en\"><b>Interestingly,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">비슷한 어떤 일이 일어나고 있었어요</span><span class=\"en\"><b>something similar <span class=\"grammar-hl\">was happening</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수천 년 전에</span><span class=\"en\"><b>thousands of years ago</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">중국에서!</span><span class=\"en\"><b>in China!</b></span></div></div><div class=\"lec-sent-ko\">흥미롭게도, 수천 년 전 중국에서도 비슷한 일이 일어나고 있었어요!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 현대의 라떼 아트와 과거의 유사한 예술 방식을 연결하는 다리 역할을 합니다. 독자의 호기심을 자극하여 시공간을 넘나드는 비교를 예고합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was happening (과거진행): be동사의 과거형(was) + 현재분사(happening)를 사용하여 과거의 특정 시점에 진행 중이었던 동작을 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">something similar</td><td class=\"m\">비슷한 무언가</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">고대 중국의 차 예술은</span><span class=\"en\"><b>The ancient Chinese tea art</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">불렸어요</span><span class=\"en\"><b><span class=\"grammar-hl\">was called</span> Chabaixi.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Chabaixi라고</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">고대 중국의 차 예술은 Chabaixi라고 불렸어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 &#39;비슷한 일&#39;의 구체적인 명칭을 소개하며 본론으로 본격적으로 진입합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was called (수동태): be동사(was)+p.p.(called) 구조입니다. call은 타동사인데 목적어가 없어서 수동구조 was called 형태로 씁니다. 기본구조: call A B(A를 B라고 부르다)의 5형식 구조에서 목적어 A가 주어로 올라가고 보어 B가 남은 형태입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 의미해요</span><span class=\"en\"><b>It means</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">‘차를 이용한 백 가지 묘기’를</span><span class=\"en\"><b>“<span class=\"grammar-hl\">a hundred tricks with tea</span>.”</b></span></div></div><div class=\"lec-sent-ko\">그것은 ‘차를 이용한 백 가지 묘기’라는 뜻이에요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 차백희라는 단어의 어원적 의미를 풀이하여, 이 예술이 단순한 그림 그리기를 넘어선 기교가 섞인 활동임을 암시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">a hundred tricks with tea (관용표현): ‘a hundred tricks with tea’는 ‘차를 이용한 백 가지 묘기’라는 의미의 고유명사적 표현입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">차백희를 만들기 위해,</span><span class=\"en\"><b><span class=\"grammar-hl\">To make Chabaixi</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">예술가들은 먼저 찻잎을 바꿨어요</span><span class=\"en\"><b>artists first <span class=\"grammar-hl\">turned tea leaves</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가루로</span><span class=\"en\"><b><span class=\"grammar-hl\">into powder</span>.</b></span></div></div><div class=\"lec-sent-ko\">Chabaixi를 만들기 위해, 예술가들은 먼저 찻잎을 가루로 만들었어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 차백희의 구체적인 제작 과정을 순차적으로 설명하기 시작하는 첫 번째 단계입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">To make Chabaixi (to부정사): 문장 맨 앞에서 목적(~하기 위해서)을 나타내는 부사적 용법으로 쓰였습니다.</div><div class=\"lec-gr-item\">turned tea leaves into powder (관용표현): &#39;turn A into B&#39;는 &#39;A를 B로 바꾸다&#39;라는 의미를 가진 숙어 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그다음,</span><span class=\"en\"><b>Then,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 물과 가루를 섞었어요</span><span class=\"en\"><b>they <span class=\"grammar-hl\">mixed water with the powder</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것이 거품이 생길 때까지</span><span class=\"en\"><b>until it became foamy.</b></span></div></div><div class=\"lec-sent-ko\">그다음에, 그들은 거품이 생길 때까지 물과 가루를 섞었어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 현대 라떼 아트에서 우유 거품을 내는 것과 유사한 과정임을 보여주며, 고대와 현대 예술 사이의 기술적 공통점을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">mixed water with the powder (관용표현): &#39;mix A with B&#39;는 &#39;A를 B와 섞다&#39;라는 의미의 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 후,</span><span class=\"en\"><b>After that,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 특별한 숟가락을 사용했어요</span><span class=\"en\"><b>they used a special spoon</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그림을 그리기 위해,</span><span class=\"en\"><b><span class=\"grammar-hl\">to draw pictures</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">대나무나 산과 같은</span><span class=\"en\"><b>like bamboo and mountains.</b></span></div></div><div class=\"lec-sent-ko\">그 후, 그들은 대나무나 산과 같은 그림을 그리기 위해 특별한 숟가락을 사용했어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 도구를 사용해 구체적인 형상을 만드는 완성 단계를 서술하여 차백희가 정교한 예술 작업이었음을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to draw pictures (to부정사): 목적(~하기 위해서)을 나타내는 부사적 용법으로 쓰였습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">차백희는 약간 달라요</span><span class=\"en\"><b>Chabaixi is a little <span class=\"grammar-hl\">different</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">현대의 라테 아트와는</span><span class=\"en\"><b><span class=\"grammar-hl\">from</span> modern latte art.</b></span></div></div><div class=\"lec-sent-ko\">Chabaixi는 현대의 라테 아트와는 약간 달라요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 공통점을 강조하던 흐름에서 차이점을 지적하며 글의 내용을 한층 더 깊이 있는 대조로 전환합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">different from (관용표현): &#39;be different from&#39;은 &#39;~와 다르다&#39;라는 의미를 나타내는 필수 숙어 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 11 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 맑은 물을 사용해요</span><span class=\"en\"><b>It uses clear water</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우유 대신에</span><span class=\"en\"><b><span class=\"grammar-hl\">instead of milk</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">디자인을 만들기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to make the designs</span>.</b></span></div></div><div class=\"lec-sent-ko\">그것은 디자인을 만들기 위해 우유 대신 맑은 물을 사용해요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 현대 라떼 아트와 차백희의 결정적인 차이점을 기술적 관점에서 구체적으로 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">instead of milk (관용표현): &#39;instead of&#39;는 &#39;~대신에&#39;라는 의미를 가진 전치사구입니다.</div><div class=\"lec-gr-item\">to make the designs (to부정사): 목적(~하기 위해서)을 나타내는 부사적 용법으로 쓰였습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">instead of</td><td class=\"m\">~대신에</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 12 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">물이 차에 닿으면,</span><span class=\"en\"><b><span class=\"grammar-hl\">When the water touches the tea</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 흰색으로 변해요</span><span class=\"en\"><b>it turns white.</b></span></div></div><div class=\"lec-sent-ko\">물이 차에 닿으면, 그것은 흰색으로 변해요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 물과 차가 만나는 화학적 반응이 곧 예술적 재료로 활용되었음을 알려주며 시각적 효과의 원리를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">When the water touches the tea (관계부사(접속사)): when은 문장을 이끄는 접속사로, 시간을 나타내는 부사절을 유도합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 13 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">비록 그 그림은 사라지지만</span><span class=\"en\"><b><span class=\"grammar-hl\">Although the picture disappears</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">불과 20분 만에,</span><span class=\"en\"><b>in just 20 minutes,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 충분한 시간이에요</span><span class=\"en\"><b>that’s enough <span class=\"grammar-hl\">time</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아름다운 디자인을 즐기기에</span><span class=\"en\"><b><span class=\"grammar-hl\">to enjoy</span> the beautiful designs!</b></span></div></div><div class=\"lec-sent-ko\">비록 그 그림은 20분 만에 사라지지만, 그것은 아름다운 디자인을 즐기기에 충분한 시간이에요!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 지속 시간이라는 한계를 언급하되, 그것이 예술적 가치를 훼손하는 것이 아니라 그 짧은 순간의 아름다움을 즐기는 것이 차백희의 본질임을 강조하며 글을 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Although the picture disappears (분사구문(의미상)): although가 이끄는 부사절은 양보(~임에도 불구하고)의 의미를 나타내는 접속사절입니다.</div><div class=\"lec-gr-item\">time to enjoy (to부정사): to+enjoy(동사원형) 형태가 앞의 명사 time을 뒤에서 수식하는 형용사적 용법입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">disappear</td><td class=\"m\">사라지다, 보이지 않게 되다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>현대의 라떼 아트처럼 수천 년 전 중국에도 차를 이용한 &#39;차백희&#39;라는 예술이 있었다.</li><li>차백희는 차 가루와 물을 섞어 거품을 낸 뒤 도구로 그림을 그리는 정교한 과정이었다.</li><li>현대 라떼 아트가 우유를 사용하는 것과 달리, 차백희는 물과 차가 만나 생기는 흰색을 활용했다.</li><li>그림은 금방 사라지지만, 그 짧은 찰나의 예술성을 즐기는 것이 차백희의 매력이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Ancient Chinese artists created fleeting tea designs by drawing with water on foamy powdered tea, which serves as a historical precursor to modern latte art.</div>\n              <div class=\"lec-final-sum-ko\">고대 중국 예술가들은 거품 낸 가루차 위에 물로 그림을 그려 찰나의 차 디자인을 만들었으며, 이는 현대 라떼 아트의 역사적 선례가 된다.</div></div></div>"],"segs":[[{"audio":"./passage17_audio/1.mp3","hl":null}],[{"audio":"./passage17_audio/2.mp3","hl":null}],[{"audio":"./passage17_audio/3.mp3","hl":null},{"audio":"./passage17_audio/4.mp3","hl":"stage-0"},{"audio":"./passage17_audio/5.mp3","hl":"stage-1"},{"audio":"./passage17_audio/6.mp3","hl":"stage-2"}],[{"audio":"./passage17_audio/7.mp3","hl":null}],[{"audio":"./passage17_audio/8.mp3","hl":"main"},{"audio":"./passage17_audio/9.mp3","hl":"meaning"},{"audio":"./passage17_audio/10.mp3","hl":"grammar"}],[{"audio":"./passage17_audio/11.mp3","hl":"main"},{"audio":"./passage17_audio/12.mp3","hl":"meaning"},{"audio":"./passage17_audio/13.mp3","hl":"grammar"}],[{"audio":"./passage17_audio/14.mp3","hl":"main"},{"audio":"./passage17_audio/15.mp3","hl":"meaning"},{"audio":"./passage17_audio/16.mp3","hl":"grammar"}],[{"audio":"./passage17_audio/17.mp3","hl":"main"},{"audio":"./passage17_audio/18.mp3","hl":"meaning"},{"audio":"./passage17_audio/19.mp3","hl":"grammar"}],[{"audio":"./passage17_audio/20.mp3","hl":"main"},{"audio":"./passage17_audio/21.mp3","hl":"meaning"},{"audio":"./passage17_audio/22.mp3","hl":"grammar"}],[{"audio":"./passage17_audio/23.mp3","hl":"main"},{"audio":"./passage17_audio/24.mp3","hl":"meaning"},{"audio":"./passage17_audio/25.mp3","hl":"grammar"}],[{"audio":"./passage17_audio/26.mp3","hl":"main"},{"audio":"./passage17_audio/27.mp3","hl":"meaning"},{"audio":"./passage17_audio/28.mp3","hl":"grammar"}],[{"audio":"./passage17_audio/29.mp3","hl":"main"},{"audio":"./passage17_audio/30.mp3","hl":"meaning"},{"audio":"./passage17_audio/31.m
