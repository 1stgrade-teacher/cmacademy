</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}

    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}

lecturePlayer(document.getElementById("app"),{"brand":"청명학원 영어과","title":"리딩그라피2 리딩그라피레벨2 13번","audioDir":"audio","preview":false,"count":51,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.400em\">리딩그라피레벨2\u003cbr>13번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩그라피2\u003c/div>\u003ch1>From Endangered to Thriving: The Recovery of Puffins\u003c/h1>\u003ch2>멸종 위기에서 번영으로: 퍼핀의 회복기\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>기후 변화로 인해 \u003cb class=\"key\">멸종 \u003c/b>\u003cb class=\"key\">위기\u003c/b>에 처했던 퍼핀이 인간의 \u003cb class=\"key\">보호 \u003c/b>\u003cb class=\"key\">노력\u003c/b>과 관광객 감소의 영향으로 개체 수가 회복되어 명단에서 제외되었습니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Human conservation efforts and environmental changes have successfully led to the recovery of puffin populations.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 북대서양의 귀염둥이, 퍼핀이라는 새의 감동적인 회복 이야기를 함께 공부할 거예요. 기후 변화 때문에 큰 어려움을 겪었던 퍼핀이 어떻게 다시 우리 곁으로 많이 돌아올 수 있었는지 그 과정에 집중해 봅시다. 오늘 수업을 통해 멸종 위기라는 심각한 문제가 인간의 보호 노력과 환경 변화로 어떻게 해결될 수 있는지 배울 수 있을 거예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">퍼핀은 '바다의 광대'라는 별명을 가진 \u003cb class=\"key\">북대서양(North \u003c/b>\u003cb class=\"key\">Atlantic)\u003c/b>의 철새로, 주로 해안가 절벽에 서식합니다. \u003cb class=\"key\">기후 \u003c/b>\u003cb class=\"key\">변화(Climate \u003c/b>\u003cb class=\"key\">Change)\u003c/b>로 수온이 상승하면 이들의 주식인 물고기가 이동해버려 퍼핀은 심각한 \u003cb class=\"key\">생존(Survival)\u003c/b> 위협을 받게 됩니다. 이는 마치 우리 집 냉장고의 온도가 올라가 음식이 모두 상해버려 먹을 것이 없어지는 \u003cb class=\"key\">비상 \u003c/b>\u003cb class=\"key\">상황\u003c/b>과 비슷합니다. 이를 극복하기 위해 생태학자들은 인공 유인물을 설치하는 등의 \u003cb class=\"key\">생태 \u003c/b>\u003cb class=\"key\">복원(Ecological \u003c/b>\u003cb class=\"key\">Restoration)\u003c/b> 기법을 사용합니다. 최근에는 \u003cb class=\"key\">코로나19(COVID-19)\u003c/b>로 인한 인간 활동의 제한이 야생동물의 번식에 예상치 못한 도움을 준 사례가 보고되고 있습니다.\u003c/div>","segs":[{"n":2,"text":"본격적으로 지문을 읽기 전에 퍼핀에 대해 조금 알아볼까요? 퍼핀은 북대서양이라는 차가운 바다 근처에 살면서 물고기를 잡아먹고 사는 새예요. 그런데 기후 변화로 바닷물이 따뜻해지면 퍼핀이 먹어야 할 물고기들이 시원한 곳을 찾아 다른 데로 떠나버려요. 이건 마치 우리 집 냉장고가 고장 나서 안에 있는 맛있는 음식들이 다 상해버려 배를 곯게 되는 비상 상황과 비슷하답니다. 그래서 생태 복원 전문가들은 이 새들을 돕기 위해 여러 가지 과학적이고 창의적인 방법을 사용하곤 하죠.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>퍼핀의 소개\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>북대서양에 사는 귀엽고 친근한 새인 \u003cb class=\"key\">퍼핀(Puffins)\u003c/b>이 미국과 영국의 많은 사람에게 \u003cb class=\"key\">사랑받는 \u003c/b>\u003cb class=\"key\">존재\u003c/b>임을 소개합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>위기에 처한 퍼핀\u003csmall>문제 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>지구와 바다의 \u003cb class=\"key\">온도 \u003c/b>\u003cb class=\"key\">상승\u003c/b>으로 인해 퍼핀이 한때 \u003cb class=\"key\">멸종 \u003c/b>\u003cb class=\"key\">위기(Endangered)\u003c/b>에 처하게 된 상황을 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>구조를 위한 노력\u003csmall>해결 · 문장 6–9\u003c/small>\u003c/h4>\u003cp>Steve Kress가 자연 서식지를 조성하고 \u003cb class=\"key\">가짜 \u003c/b>\u003cb class=\"key\">퍼핀(Fake \u003c/b>\u003cb class=\"key\">puffins)\u003c/b>을 이용해 진짜 퍼핀들이 머물도록 유도한 \u003cb class=\"key\">복원 \u003c/b>\u003cb class=\"key\">노력\u003c/b>을 다룹니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>성공적인 결과\u003csmall>결론 · 문장 10–13\u003c/small>\u003c/h4>\u003cp>노력과 관광객 감소의 영향으로 개체 수가 늘어나 결국 \u003cb class=\"key\">멸종 \u003c/b>\u003cb class=\"key\">위기종 \u003c/b>\u003cb class=\"key\">목록(Endangered \u003c/b>\u003cb class=\"key\">species \u003c/b>\u003cb class=\"key\">list)\u003c/b>에서 \u003cb class=\"key\">제외\u003c/b>되었음을 알립니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 퍼핀의 특징에서 시작해 위기 상황을 거쳐 해결과 성공적인 결과로 이어지는 흐름을 가지고 있어요.","hl":null},{"n":4,"text":"첫 번째 문장부터 세 번째 문장까지는 퍼핀의 특징을 소개해요. 퍼핀은 북대서양 바다 근처에 사는 아주 귀여운 새인데, 성격이 호의적이어서 사람을 무서워하지 않죠. 그래서 영국과 미국의 많은 사람이 이 새를 아주 사랑한다고 설명하며 글을 시작하고 있네요.","hl":"f0"},{"n":5,"text":"네 번째 문장과 다섯 번째 문장에서는 하지만이라는 반전과 함께 문제가 등장해요. 지구가 점점 따뜻해지는 기후 변화 때문에 이 귀여운 퍼핀들이 한때 멸종 위기종이 되었고 아주 위험한 상황에 빠졌다는 소식입니다.","hl":"f1"},{"n":6,"text":"여섯 번째 문장부터 아홉 번째 문장까지는 이 문제를 해결하려는 노력이 나옵니다. 미국 메인주 출신의 Steve Kress라는 분이 자연에 더 나은 보금자리를 만들고, 심지어 가짜 퍼핀을 설치해서 진짜 퍼핀들이 안심하고 머물 수 있게 유인했대요. 이런 정성 어린 복원 노력이 퍼핀들을 그 지역에 계속 살 수 있게 도운 거죠.","hl":"f2"},{"n":7,"text":"마지막 열 번째 문장부터 열세 번째 문장까지는 기분 좋은 결말이에요. 퍼핀의 개체 수가 전보다 늘어났고, 특히 코로나 대유행 기간에 관광객이 줄어들면서 퍼핀들이 새끼를 더 많이 낳을 수 있었죠. 결국 이천이십 년 십이월에 멸종 위기종 목록에서 공식적으로 제외되는 성과를 거두었습니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결 (Problem-Solution)\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 13번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">퍼핀이 처한 \u003cb class=\"key\">멸종 \u003c/b>\u003cb class=\"key\">위기\u003c/b>라는 문제를 먼저 제시하고, 이를 해결하기 위한 \u003cb class=\"key\">인간의 \u003c/b>\u003cb class=\"key\">노력\u003c/b>과 외부적 요인을 서술한 뒤 최종적으로 \u003cb class=\"key\">명단 \u003c/b>\u003cb class=\"key\">제외\u003c/b>라는 결과를 도출합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>But (4)\u003c/b>\u003cspan>인기 있는 새라는 긍정적 분위기에서 위기 상황으로 전환\u003c/span>\u003cb>As a result (13)\u003c/b>\u003cspan>모든 노력과 상황의 최종 결과를 요약하며 결론 도출\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Puffins\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">endangered species\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">in danger\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">more puffins than before\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">removed from the endangered species list\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 문제점과 해결책을 순서대로 보여주는 문제 해결 구조입니다. 처음에는 멸종 위기라는 심각한 문제를 제시하고, 중간에 해결을 위한 노력을 설명한 뒤, 마지막에 그 결과가 어떻게 나타났는지 보여주는 미괄식 구성을 취하고 있어요.","hl":"ty"},{"n":9,"text":"글의 흐름을 바꿔주는 신호어를 잘 보세요. 네 번째 문장의 But은 앞서 말한 긍정적인 인기와 반대되는 위기 상황을 보여줍니다. 그리고 마지막 열세 번째 문장의 As a result는 그동안의 모든 노력과 우연한 상황이 합쳐져서 나온 최종 결과를 요약해 주는 아주 중요한 신호어랍니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>puffin\u003c/b>\u003cem>명사\u003c/em>\u003cspan>퍼핀(바닷새의 일종)\u003c/span>\u003c/div>\u003cdiv>\u003cb>cute\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>귀여운\u003c/span>\u003c/div>\u003cdiv>\u003cb>near\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~ 근처에\u003c/span>\u003c/div>\u003cdiv>\u003cb>ocean\u003c/b>\u003cem>명사\u003c/em>\u003cspan>바다, 대양\u003c/span>\u003c/div>\u003cdiv>\u003cb>North Atlantic\u003c/b>\u003cem>명사\u003c/em>\u003cspan>북대서양\u003c/span>\u003c/div>\u003cdiv>\u003cb>friendly\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>호의적인, 친절한\u003c/span>\u003c/div>\u003cdiv>\u003cb>be afraid of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 두려워하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>endangered species\u003c/b>\u003cem>명사\u003c/em>\u003cspan>멸종 위기종\u003c/span>\u003c/div>\u003cdiv>\u003cb>once\u003c/b>\u003cem>부사\u003c/em>\u003cspan>한때\u003c/span>\u003c/div>\u003cdiv>\u003cb>get warmer\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>점점 더 따뜻해지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>in danger\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>위험에 처한\u003c/span>\u003c/div>\u003cdiv>\u003cb>nature\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자연\u003c/span>\u003c/div>\u003cdiv>\u003cb>fake\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>가짜의\u003c/span>\u003c/div>\u003cdiv>\u003cb>real\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>진짜의\u003c/span>\u003c/div>\u003cdiv>\u003cb>might\u003c/b>\u003cem>조동사\u003c/em>\u003cspan>~일지도 모른다\u003c/span>\u003c/div>\u003cdiv>\u003cb>see A as B\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>A를 B로 간주하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>effort\u003c/b>\u003cem>명사\u003c/em>\u003cspan>노력\u003c/span>\u003c/div>\u003cdiv>\u003cb>stay\u003c/b>\u003cem>동사\u003c/em>\u003cspan>머무르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>area\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지역\u003c/span>\u003c/div>\u003cdiv>\u003cb>pandemic\u003c/b>\u003cem>명사\u003c/em>\u003cspan>대유행\u003c/span>\u003c/div>\u003cdiv>\u003cb>tourist\u003c/b>\u003cem>명사\u003c/em>\u003cspan>관광객\u003c/span>\u003c/div>\u003cdiv>\u003cb>fewer\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>더 적은\u003c/span>\u003c/div>\u003cdiv>\u003cb>as a result\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>그 결과\u003c/span>\u003c/div>\u003cdiv>\u003cb>remove\u003c/b>\u003cem>동사\u003c/em>\u003cspan>제거하다, 제외하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>list\u003c/b>\u003cem>명사\u003c/em>\u003cspan>목록\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"중요한 단어를 짚어볼까요? endangered species라는 표현은 멸종 위기종이라는 뜻으로 환경 지문에서 정말 자주 나와요. 그리고 get warmer는 따뜻해지다라는 뜻인데 여기서는 지구 온난화를 의미하죠. remove라는 단어는 목록에서 제거하거나 제외할 때 쓰인다는 점도 꼭 기억하세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">endangered\u003c/b>\u003cspan class=\"m\">멸종 위기에 처한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">threatened\u003c/span>\u003cspan class=\"s\">at risk\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">safe\u003c/span>\u003cspan class=\"a\">secure\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">friendly\u003c/b>\u003cspan class=\"m\">호의적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">amicable\u003c/span>\u003cspan class=\"s\">sociable\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hostile\u003c/span>\u003cspan class=\"a\">unfriendly\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">fake\u003c/b>\u003cspan c tic.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">퍼핀은 북대서양의 바다 근처에 사는 귀여운 새이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글의 주인공인 \u003cb class=\"key\">퍼핀\u003c/b>을 소개하며 북대서양 바다 근처라는 그들의 주요 \u003cb class=\"key\">서식지\u003c/b>를 설명하는 도입부입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재분사의 후치수식\u003c/span> : birds [명사] + living [현재분사(구)] : \"살고 있는\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"13 Puffins are, 13마리의 퍼핀은 ~이다. cute birds, 귀여운 새들. living near the ocean, 바다 근처에 사는. in the North Atlantic, 북대서양의. 이 문장 전체를 해석하면, 퍼핀은 북대서양의 바다 근처에 사는 귀여운 새이다.","hl":"m"},{"n":13,"text":"이 문장은 이 글의 소재인 퍼핀이 어떤 새인지 알려주는 도입부예요. 북대서양 바다 근처에 살고 아주 귀엽게 생겼다는 특징을 먼저 잡아주고 있죠.","hl":"mn"},{"n":14,"text":"여기서 중요한 포인트는 living입니다. 명사인 birds를 뒤에서 꾸며주는 현재분사로 쓰였어요. 새들이 바다 근처에 직접 살고 있는 것이기 때문에 능동의 의미를 가진 현재분사 형태를 썼다는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">퍼핀은 ~이다\u003c/span>\u003cspan class=\"en\">Puffins are\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매우 호의적인\u003c/span>\u003cspan class=\"en\">very friendly,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서 그들은 무서워하지 않는다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">so\u003c/span> they aren't afraid of\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들을\u003c/span>\u003cspan class=\"en\">people.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">퍼핀은 매우 호의적이어서 사람들을 무서워하지 않는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 퍼핀의 온순한 \u003cb class=\"key\">성격\u003c/b>을 설명하며, 사람에 대해 \u003cb class=\"key\">경계심\u003c/b>이 없다는 특징을 서술합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">등위접속사 (인과관계)\u003c/span> : A [원인], so B [결과] : \"그래서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">형용사구 관용표현\u003c/span> : be [동사] + afraid of [전치사구] : \"~을 무서워하다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Puffins are, 퍼핀은 ~이다. very friendly, 매우 호의적인. so they aren't afraid of, 그래서 그들은 무서워하지 않는다. people, 사람들을. 이 문장 전체를 해석하면, 퍼핀은 매우 호의적이어서 사람들을 무서워하지 않는다.","hl":"m"},{"n":16,"text":"퍼핀이 아주 친근한 성격을 가졌다는 걸 말해주는 문장이에요. 성격이 좋다 보니 사람을 피하지 않고 겁내지도 않는다는 점을 설명하고 있죠.","hl":"mn"},{"n":17,"text":"첫 번째로 접속사 so를 주목하세요. 퍼핀이 친절하다는 원인과 사람을 안 무서워한다는 결과를 자연스럽게 이어줍니다. 두 번째로 be afraid of는 하나의 덩어리로 외워야 할 표현이에요. 여기서는 부정문이라서 aren't afraid of라고 쓰였죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 사람들은\u003c/span>\u003cspan class=\"en\">Many people\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">영국과 미국의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">U.K. \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">U.S.\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들을 아주 좋아한다\u003c/span>\u003cspan class=\"en\">love them.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">영국과 미국의 많은 사람들은 그들을 아주 좋아한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 퍼핀이 영국과 미국 등 서구권 국가에서 누리고 있는 높은 \u003cb class=\"key\">인기\u003c/b>와 \u003cb class=\"key\">대중성\u003c/b>을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 수식\u003c/span> : Many people [명사] + in [전치사] + ~ : \"영국과 미국의\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Many people, 많은 사람들은. in the U.K. and the U.S, 영국과 미국의. love them, 그들을 아주 좋아한다. 이 문장 전체를 해석하면, 영국과 미국의 많은 사람들은 그들을 아주 좋아한다.","hl":"m"},{"n":19,"text":"영국과 미국 사람들이 퍼핀을 얼마나 아끼고 좋아하는지 보여주는 문장이에요. 앞 문장의 친근한 성격 때문에 더 사랑받는다는 흐름으로 이해하면 좋아요.","hl":"mn"},{"n":20,"text":"주어인 Many people 뒤에 전치사구인 in the U.K. and the U.S.가 붙어 있어요. 이 부분이 앞에 있는 사람들을 꾸며주면서 어느 나라 사람들인지 구체적으로 설명해 주는 역할을 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만\u003c/span>\u003cspan class=\"en\">But\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">퍼핀은\u003c/span>\u003cspan class=\"en\">puffins\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한때 ~이었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">once\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">멸종 위기종\u003c/span>\u003cspan class=\"en\">an \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">endangered \u003c/span>\u003cspan class=\"tgt\">species\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 퍼핀은 한때 멸종 위기종이었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞선 문장들에서 설명한 퍼핀의 인기와 귀여운 모습과는 상반되는 과거의 \u003cb class=\"key\">위기\u003c/b> 상황을 소개하며 독자의 \u003cb class=\"key\">주의\u003c/b>를 환기하는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사 과거형\u003c/span> : 주어(복수) + were + 부사(once) : \"한때 ~이었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사의 형용사적 용법\u003c/span> : 과거분사(endangered) + 명사(species) : \"멸종 위기에 처한 종\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"But, 하지만.  puffins, 퍼핀은.  were once, 한때 ~이었다.  an endangered species, 멸종 위기종. 이 문장 전체를 해석하면, 하지만 퍼핀은 한때 멸종 위기종이었다.","hl":"m"},{"n":22,"text":"앞서 퍼핀이 얼마나 귀엽고 사람들에게 사랑받는지 말했죠? 하지만 이번 문장에서는 역접의 접속사 But을 사용해서 과거에는 퍼핀이 멸종될 뻔했다는 위기 상황을 보여주며 글의 흐름을 전환하고 있어요.","hl":"mn"},{"n":23,"text":"첫 번째로 were once 부분을 보면 주어인 puffins가 복수형이라 be동사의 과거형인 were를 썼어요. 두 번째로 endangered species에서 endangered는 과거분사로 쓰여서 멸종 위기에 처한이라는 의미로 뒤의 명사를 꾸며주고 있답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지구와 바다가\u003c/span>\u003cspan class=\"en\">The Earth and the ocean\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">점점 더 따뜻해지면서,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">getting \u003c/span>\u003cspan class=\"tgt\">warmer\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 이것이\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">this\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">퍼핀을 ~하게 했다\u003c/span>\u003cspan class=\"en\">put puffins\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">위험에 빠뜨리게\u003c/span>\u003cspan class=\"en\">in danger.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">지구와 바다가 점점 더 따뜻해지면서, 이것이 퍼핀을 위험에 빠뜨리게 되었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 퍼핀이 멸종 위기에 처했던 구체적인 \u003cb class=\"key\">원인\u003c/b>으로 지구 온난화를 제시하며, 환경 변화가 생물에게 미치는 \u003cb class=\"key\">영향\u003c/b>을 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재진행형 (get + 비교급)\u003c/span> : be동사 + get-ing + 비교급(warmer) : \"점점 더 따뜻해지고 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지시 대명사\u003c/span> : 대명사(this) : \"이것 (앞 문장의 내용)\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"The Earth and the ocean, 지구와 바다가.  are getting warmer, 점점 더 따뜻해지면서.  and this, 그리고 이것이.  put puffins, 퍼핀을 ~하게 했다.  in danger, 위험에 빠뜨리게. 이 문장 전체를 해석하면, 지구와 바다가 점점 더 따뜻해지면서, 이것이 퍼핀을 위험에 빠뜨리게 되었다.","hl":"m"},{"n":25,"text":"퍼핀이 왜 위기에 처했는지 이유를 설명하는 문장이에요. 지구가 더워지면서 그 결과로 퍼핀이 살기 힘든 환경이 되었다는 인과관계를 보여주고 있죠.","hl":"mn"},{"n":26,"text":"첫 번째 포인트인 are getting warmer는 현재진행형과 비교급이 만나서 점점 더 따뜻해지고 있다는 변화의 과정을 강조해요. 두 번째로 this는 앞 문장 내용인 지구가 따뜻해지는 사실을 가리키는 지시 대명사라는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Steve Kress라는 남자는\u003c/span>\u003cspan class=\"en\">A man \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">named \u003c/span>\u003cspan class=\"tgt\">Steve \u003c/span>\u003cspan class=\"tgt\">Kress\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미국 메인주 출신의\u003c/span>\u003cspan class=\"en\">from Maine, the U.S.,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">원했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">wanted \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">퍼핀들을 돕고 싶었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">help\u003c/span> puffins.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">미국 메인주 출신의 Steve Kress라는 남자는 퍼핀들을 돕고 싶었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 위기에 처한 퍼핀을 구하기 위해 등장한 구체적인 \u003cb class=\"key\">인물\u003c/b>을 소개하며, 이야기의 중심이 \u003cb class=\"key\">해결 \u003c/b>\u003cb class=\"key\">노력\u003c/b>으로 전환됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사구의 후치 수식\u003c/span> : 명사(A man) + [p.p. (named) + 보어] : \"Steve Kress라고 이름 붙여진\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : want(타동사) + to-v(목적어) : \"돕는 것을 원했다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"A man named Steve Kress, Steve Kress라는 남자는.  from Maine, the U.S, 미국 메인주 출신의.  wanted, 원했다.  to help puffins, 퍼핀들을 돕고 싶었다. 이 문장 전체를 해석하면, 미국 메인주 출신의 Steve Kress라는 남자는 퍼핀들을 돕고 싶었다.","hl":"m"},{"n":28,"text":"이제 이 이야기의 주인공 격인 인물이 등장해요. 퍼핀들이 처한 위험을 보고 그냥 지나치지 않고 도움을 주려고 결심한 Steve Kress의 등장을 알리고 있네요.","hl":"mn"},{"n":29,"text":"첫 번째로 named Steve Kress 부분은 과거분사가 앞에 있는 명사 A man을 꾸며주는 구조예요. Steve Kress라고 불리는 남자라고 해석하면 자연스럽죠. 두 번째로 wanted 다음에 나온 to help는 want라는 동사의 목적어 역할을 하는 명사적 용법의 to부정사입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 만들어주었다\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">made\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 더 나은 보금자리를\u003c/span>\u003cspan class=\"en\">a better home\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 그들을 위한\u003c/span>\u003cspan class=\"en\">for them\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 자연에.\u003c/span>\u003cspan class=\"en\">in nature.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 자연에 그들을 위한 더 나은 보금자리를 만들어주었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 스티브 씨가 퍼핀들을 위해 직접 \u003cb class=\"key\">서식지\u003c/b>를 개선했다는 구체적인 행동을 보여줍니다. 단순히 구경만 한 것이 아니라 살기 좋은 \u003cb class=\"key\">환경 \u003c/b>\u003cb class=\"key\">조성\u003c/b>을 위해 노력했다는 내용이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수여의 의미를 가진 타동사\u003c/span> : make [동사] + a better home [목적어] + for them [전치사구] : \"만들어주었다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"He made, 그는 만들어주었다.  a better home,  더 나은 보금자리를.  for them,  그들을 위한.  in nature,  자연에.. 이 문장 전체를 해석하면, 그는 자연에 그들을 위한 더 나은 보금자리를 만들어주었다.","hl":"m"},{"n":31,"text":"스티브 씨가 퍼핀을 돕기 위해 실질적으로 어떤 일을 했는지 보여주는 대목이에요. 자연 속에서 퍼핀들이 더 편안하게 살 수 있도록 서식지를 꾸며준 것이죠.","hl":"mn"},{"n":32,"text":"동사 made 다음에 무엇을 만들었는지 목적어인 a better home이 먼저 나왔어요. 그 뒤에 누구를 위한 것인지를 나타낼 때 전치사 for를 사용해서 for them이라고 표현했답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 또한 사용했다\u003c/span>\u003cspan class=\"en\">He also used\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 가짜 퍼핀들을\u003c/span>\u003cspan class=\"en\">fake puffins\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 왜냐하면 그는 생각했기 때문이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">because\u003c/span> he thought\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 진짜 퍼핀들이\u003c/span>\u003cspan class=\"en\">the real puffins\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 그것들을 볼지도 모른다고\u003c/span>\u003cspan class=\"en\">might \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">see \u003c/span>\u003cspan class=\"tgt\">them \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 친구로.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">friends\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 가짜 퍼핀도 사용했는데, 진짜 퍼핀들이 그것들을 친구로 볼지도 모른다고 생각했기 때문이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 동료가 있는 곳을 안전하다고 믿는 퍼핀의 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">특성\u003c/b>을 이용한 전략입니다. \u003cb class=\"key\">유인용 \u003c/b>\u003cb class=\"key\">모형\u003c/b>을 통해 진짜 퍼핀들이 안심하고 모여들게 유도한 것이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이유의 접속사\u003c/span> : 주절 + because [접속사] + 주어 + 동사 : \"때문이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">see A as B\u003c/span> : see [동사] + A [목적어] + as [전치사] + B [명사] : \"그것들을 친구로 보다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"He also used, 그는 또한 사용했다.  fake puffins,  가짜 퍼핀들을.  because he thought,  왜냐하면 그는 생각했기 때문이다.  the real puffins,  진짜 퍼핀들이.  might see them,  그것들을 볼지도 모른다고.  as friends,  친구로.. 이 문장 전체를 해석하면, 그는 가짜 퍼핀도 사용했는데, 진짜 퍼핀들이 그것들을 친구로 볼지도 모른다고 생각했기 때문이다.","hl":"m"},{"n":34,"text":"집만 지어준 게 아니라 가짜 모형까지 활용했다는 게 흥미롭죠. 퍼핀들이 자기 친구들이 모여 있는 곳을 보고 안심해서 찾아오게 하려는 똑똑한 방법이었어요.","hl":"mn"},{"n":35,"text":"첫 번째로 접속사 because는 뒤에 주어와 동사가 오는 완벽한 문장을 이끌어 이유를 말해줍니다. 두 번째로 see A as B라는 아주 중요한 표현이 쓰였는데, 에이를 비로 여기다라는 뜻으로 여기서는 가짜 모형을 친구로 본다는 의미예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이런 노력은\u003c/span>\u003cspan class=\"en\">This effort\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 도울 수 있었다\u003c/span>\u003cspan class=\"en\">could \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">help \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 퍼핀들이 머무르도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">puffins \u003c/span>\u003cspan class=\"tgt\">stay\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 그 지역에.\u003c/span>\u003cspan class=\"en\">in the area.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이런 노력이 퍼핀들이 그 지역에 머무르도록 도울 수 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 스티브의 행동이 가져온 \u003cb class=\"key\">긍정적 \u003c/b>\u003cb class=\"key\">변화\u003c/b>를 나타냅니다. 정성을 들인 노력이 결국 퍼핀들이 다시 그곳에 \u003cb class=\"key\">정착\u003c/b>하는 성공적인 결과를 낳았음을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">준사역동사 help의 목적격 보어\u003c/span> : help [동사] + puffins [목적어] + stay [원형부정사] : \"퍼핀들이 머무르도록 돕다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"This effort, 이런 노력은.  could help,  도울 수 있었다.  puffins stay,  퍼핀들이 머무르도록.  in the area,  그 지역에.. 이 문장 전체를 해석하면, 이런 노력이 퍼핀들이 그 지역에 머무르도록 도울 수 있었다.","hl":"m"},{"n":37,"text":"스티브 씨가 보여준 정성스러운 노력이 결국 퍼핀들을 돌아오게 했어요. 그들이 다른 곳으로 떠나지 않고 그 지역에 계속 살 수 있게 만들어 준 소중한 계기가 된 거죠.","hl":"mn"},{"n":38,"text":"동사 help의 쓰임새를 잘 보세요. 목적어인 puffins 다음에 그들이 하는 행동을 stay라는 동사원형으로 표현했어요. 이 자리는 to stay라고 써도 문법적으로 완벽하게 맞습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이제,\u003c/span>\u003cspan class=\"en\">Now,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 많은 수의 퍼핀들이 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">are\u003c/span> more puffins\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전보다.\u003c/span>\u003cspan class=\"en\">than before.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이제, 전보다 더 많은 수의 퍼핀들이 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 스티브 크레스의 노력 덕분에 개체 수가 회복된 \u003cb class=\"key\">긍정적인 \u003c/b>\u003cb class=\"key\">결과\u003c/b>를 제시합니다. 과거 멸종 위기였던 상태와 대조되는 \u003cb class=\"key\">현재의 \u003c/b>\u003cb class=\"key\">상황\u003c/b>을 강조하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">There be동사 구문 (존재)\u003c/span> : There + are [be동사] + more puffins [복수 주어] : \"~가 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">비교급 비교\u003c/span> : more [비교급] + than [~보다] : \"전보다 더 많은\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"Now, 이제. there are more puffins, 더 많은 수의 퍼핀들이 있다. than before, 전보다.. 이 문장 전체를 해석하면, 이제, 전보다 더 많은 수의 퍼핀들이 있다.","hl":"m"},{"n":40,"text":"앞선 문장들에서 언급된 보호 노력의 결실을 보여주는 문장이에요. Now를 사용해 과거의 위기를 극복하고 나타난 긍정적인 결과를 강조하고 있죠.","hl":"mn"},{"n":41,"text":"첫 번째로 there are 구문입니다. 유도부사 there가 문장 앞에 오면 주어는 be동사 뒤에 위치하는데요. 주어인 puffins가 복수형이기 때문에 복수 동사 are를 쓴 점이 중요합니다. 두 번째로 more와 than을 연결해 보세요. 전보다 더 많아졌다는 비교급 표현으로 변화를 명확히 설명하고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">코로나19 대유행 동안 영국에서는, 관광객의 수가 줄었다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">During\u003c/span> the COVID-19 *pandemic in the U.K., there were \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">fewer\u003c/span> tourists.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">코로나19 대유행 동안 영국에서는 관광객의 수가 줄었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 퍼핀의 개체 수가 늘어날 수 있었던 또 다른 \u003cb class=\"key\">외부적 \u003c/b>\u003cb class=\"key\">요인\u003c/b>을 설명합니다. \u003cb class=\"key\">인간 \u003c/b>\u003cb class=\"key\">활동\u003c/b>의 감소가 자연 생태계에 미친 영향을 보여주는 대목입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 during\u003c/span> : During [전치사] + the COVID-19 pandemic [특정 기간 명사] : \"~ 동안\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수량 형용사의 비교급\u003c/span> : fewer [비교급] + tourists [복수 명사] : \"더 적은 (수가 줄어든)\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"During the COVID-19 pandemic, 코로나19 대유행 동안. in the U.K, 영국에서는. there were fewer tourists, 관광객의 수가 줄었다.. 이 문장 전체를 해석하면, 코로나19 대유행 동안 영국에서는 관광객의 수가 줄었다.","hl":"m"},{"n":43,"text":"팬데믹이라는 예기치 못한 상황이 퍼핀에게는 도움이 되었다는 배경을 설명해요. 사람들의 방문이 줄어들면서 자연스럽게 환경이 변화했음을 보여줍니다.","hl":"mn"},{"n":44,"text":"첫 번째로 During을 주목하세요. 뒤에 팬데믹이라는 명사구가 나오기 때문에 접속사 while이 아닌 전치사 During을 써야 합니다. 두 번째로 fewer입니다. 셀 수 있는 명사인 관광객의 수가 더 적어졌다는 의미를 나타내기 위해 few의 비교급 형태를 사용한 것이 핵심입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">So\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">퍼핀들은 가질 수 있었다\u003c/span>\u003cspan class=\"en\">the puffins \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">could \u003c/span>\u003cspan class=\"tgt\">have\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 많은 새끼를.\u003c/span>\u003cspan class=\"en\">more babies.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그래서 퍼핀들은 더 많은 새끼를 낳을 수 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 관광객 감소라는 원인에 따른 \u003cb class=\"key\">직접적인 \u003c/b>\u003cb class=\"key\">결과\u003c/b>를 서술합니다. 방해받지 않는 환경 덕분에 \u003cb class=\"key\">번식\u003c/b>이 활발해졌음을 의미합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">인과관계의 접속사\u003c/span> : So [원인에 따른 결과를 이끄는 연결어] : \"그래서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 과거형\u003c/span> : could [조동사 과거] + have [동사원형] : \"가질 수 있었다 (낳을 수 있었다)\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"So, 그래서. the puffins could have, 퍼핀들은 가질 수 있었다. more babies, 더 많은 새끼를.. 이 문장 전체를 해석하면, 그래서 퍼핀들은 더 많은 새끼를 낳을 수 있었다.","hl":"m"},{"n":46,"text":"사람들이 오지 않으니 퍼핀들이 방해받지 않고 번식에 집중할 수 있었던 상황을 설명해요. 결국 이 문장은 전체 지문에서 개체 수 회복의 결정적인 이유를 보여주는 핵심적인 문장입니다.","hl":"mn"},{"n":47,"text":"첫 번째로 So라는 접속사는 아주 중요해요. 앞 문장의 관광객 감소가 원인이 되어 결과적으로 번식이 늘어났다는 인과관계를 완성해 줍니다. 두 번째로 could have를 보세요. 조동사 can의 과거형인 could를 써서 과거 당시에 가능했던 상황을 자연스럽게 표현하고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 결과, 미국 어류 및 야생동물관리국은 그들을 제외했다 멸종 위기종 목록에서 2020년 12월에.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">As \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">result\u003c/span>, the **US Fish and Wildlife Service \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">removed \u003c/span>\u003cspan class=\"tgt\">them \u003c/span>\u003cspan class=\"tgt\">from\u003c/span> the endangered species list in December 2020.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 결과, 미국 어류 및 야생동물관리국은 2020년 12월에 퍼핀을 멸종 위기종 목록에서 제외했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 퍼핀을 보호하기 위한 노력과 환경적 변화가 합쳐져 나타난 \u003cb class=\"key\">최종 \u003c/b>\u003cb class=\"key\">결과\u003c/b>를 설명합니다. 퍼핀이 더 이상 \u003cb class=\"key\">멸종 \u003c/b>\u003cb class=\"key\">위기\u003c/b> 상태가 아님을 공식적으로 선언하며 글을 마무리합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">연결어구(인과관계)\u003c/span> : As a result, [주어] + [동사] : \"그 결과\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동사 구문(A를 B에서 제거하다)\u003c/span> : remove + [목적어(A)] + from + [대상(B)] : \"그들을 ~에서 제외했다\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"As a result, 그 결과. the US Fish and Wildlife Service, 미국 어류 및 야생동물관리국은. removed them, 그들을 제외했다. from the endangered species list, 멸종 위기종 목록에서. in December 2020, 2020년 12월에.. 이 문장 전체를 해석하면, 그 결과, 미국 어류 및 야생동물관리국은 2020년 12월에 퍼핀을 멸종 위기종 목록에서 제외했다.","hl":"m"},{"n":49,"text":"이 문장은 글 전체의 결론에 해당해요. 사람들의 노력과 환경 변화 덕분에 퍼핀의 수가 늘어났고, 마침내 성공적인 보존 결과로 멸종 위기에서 벗어났음을 보여주는 희망적인 마무리입니다.","hl":"mn"},{"n":50,"text":"첫 번째 포인트로 As a result를 보세요. 앞 문장에서 퍼핀이 늘어났다는 원인이 나왔으니 그에 따른 결과를 보여주는 연결어구예요. 두 번째로 remove A from B 구조가 쓰였는데요. 대명사 them이 가리키는 퍼핀들을 멸종 위기종 목록이라는 B로부터 제외했다는 뜻을 정확히 해석해야 합니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>퍼핀은 북대서양의 바다 근처에 서식하며 사람을 무서워하지 않는 \u003cb class=\"key\">귀여운 \u003c/b>\u003cb class=\"key\">새\u003c/b>입니다.\u003c/li>\u003cli>\u003cb class=\"key\">지구 \u003c/b>\u003cb class=\"key\">온난화\u003c/b>로 인해 해수 온도가 상승하면서 퍼핀은 한때 \u003cb class=\"key\">멸종 \u003c/b>\u003cb class=\"key\">위기\u003c/b>에 직면했습니다.\u003c/li>\u003cli>Steve Kress는 서식지 조성과 \u003cb class=\"key\">가짜 \u003c/b>\u003cb class=\"key\">퍼핀\u003c/b> 유인책을 통해 이들의 \u003cb class=\"key\">번식과 \u003c/b>\u003cb class=\"key\">정착\u003c/b>을 도왔습니다.\u003c/li>\u003cli>팬데믹으로 인한 \u003cb class=\"key\">관광객 \u003c/b>\u003cb class=\"key\">감소\u003c/b>와 복구 노력 덕분에 2020년 \u003cb class=\"key\">멸종 \u003c/b>\u003cb class=\"key\">위기종\u003c/b>에서 공식 제외되었습니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Human conservation efforts and environmental changes have successfully led to the recovery of puffin populations.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">기후 변화로 인해 \u003cb class=\"key\">멸종 \u003c/b>\u003cb class=\"key\">위기\u003c/b>에 처했던 퍼핀이 인간의 \u003cb class=\"key\">보호 \u003c/b>\u003cb class=\"key\">노력\u003c/b>과 관광객 감소의 영향으로 개체 수가 회복되어 명단에서 제외되었습니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":51,"text":"오늘 우리는 인간의 끈기 있는 노력과 환경적인 요인이 결합해 한 생명체를 멸종 위기에서 구해낸 멋진 사례를 공부했습니다. 퍼핀이 멸종 위기종 목록에서 제외되었다는 소식은 정말 다행이죠? 오늘 배운 문제 해결 구조의 글 읽기 방식을 다른 지문에도 꼭 적용해 보세요. 고생 많으셨습니다!","hl":null}]}]});</script></body></html>
