친구로 인식하도록 가짜 모형(fake puffins) 활용</li><li>핵심 키워드: 보호 노력(effort), 모형(fake)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03개체 수 증가와 위기 탈출</div><ul><li>퍼핀의 개체 수는 증가하였고, 결국 공식적인 멸종 위기 리스트에서 제외되었다.</li><li>코로나19 기간 관광객 감소가 번식에 긍정적 영향</li><li>미국 어류 및 야생동물 관리국(US Fish and Wildlife Service)의 결정</li><li>핵심 키워드: 팬데믹(pandemic), 회복(removed from the endangered species list)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">endangered</td><td class=\"m\">멸종 위기에 처한, 위험에 빠진</td></tr><tr><td class=\"w\">species</td><td class=\"m\">종, 종류</td></tr><tr><td class=\"w\">in danger</td><td class=\"m\">위험에 처한</td></tr><tr><td class=\"w\">nature</td><td class=\"m\">자연, 본성</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fake</td><td class=\"m\">가짜의, 모조의</td></tr><tr><td class=\"w\">effort</td><td class=\"m\">노력, 수고</td></tr><tr><td class=\"w\">as a result</td><td class=\"m\">결과적으로, 그 결과</td></tr><tr><td class=\"w\">remove</td><td class=\"m\">제거하다, 삭제하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">퍼핀은 귀여운 새이다</span><span class=\"en\"><b>Puffins are cute birds</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">바다 근처에 사는</span><span class=\"en\"><b><span class=\"grammar-hl\">living</span> near the ocean</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">북대서양의</span><span class=\"en\"><b>in the North Atlantic.</b></span></div></div><div class=\"lec-sent-ko\">퍼핀은 북대서양의 바다 근처에 사는 귀여운 새이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 퍼핀이라는 동물이 생태계의 어떤 위치에서 어떤 모습으로 존재하는지 독자에게 소개하며 글을 시작합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">living (현재분사): living이 앞의 명사 birds를 수식하는 구조. &#39;birds that are living&#39;의 의미로, 명사의 동작이나 상태를 나타냄.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">퍼핀은 매우 호의적이다,</span><span class=\"en\"><b>Puffins are very friendly,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그래서 그들은 두려워하지 않는다</span><span class=\"en\"><b>so they <span class=\"grammar-hl\">aren’t</span> afraid</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들을</span><span class=\"en\"><b>of people.</b></span></div></div><div class=\"lec-sent-ko\">퍼핀은 매우 호의적이어서 사람들을 무서워하지 않는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 퍼핀의 성격적 특성을 설명하며, 왜 사람들이 퍼핀에게 친숙함을 느끼는지 그 근거를 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">aren’t (관용표현): are not의 축약형으로 부정문을 형성함.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">많은 사람들은</span><span class=\"en\"><b>Many people</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">영국과 미국의</span><span class=\"en\"><b><span class=\"grammar-hl\">in the U.K. and the U.S.</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들을 사랑한다</span><span class=\"en\"><b>love them.</b></span></div></div><div class=\"lec-sent-ko\">영국과 미국의 많은 사람들은 그들을 아주 좋아한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 퍼핀의 친화적인 성격이 인간과 맺는 관계에 어떤 긍정적인 영향을 주었는지 구체적인 사례를 들어 서술합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">in the U.K. and the U.S. (관용표현): 국가명 앞에 정관사 the를 붙여 사용하는 정해진 관용구.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만 퍼핀은 한때였다</span><span class=\"en\"><b>But puffins <span class=\"grammar-hl\">were</span> once</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">멸종 위기종</span><span class=\"en\"><b>an endangered species.</b></span></div></div><div class=\"lec-sent-ko\">하지만 퍼핀은 한때 멸종 위기종이었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 서술된 퍼핀에 대한 긍정적인 평가와 대비하여, 이 동물이 처했던 심각한 생존 위기 상황을 역접으로 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">were 5형식 구조(일부): were를 사용한 2형식 구조로, puffins의 과거 상태를 설명함.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">endangered</td><td class=\"m\">멸종 위기에 처한, 위험에 빠진</td></tr><tr><td class=\"w\">species</td><td class=\"m\">종, 종류</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">지구와 바다는</span><span class=\"en\"><b>The Earth and the ocean</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 따뜻해지고 있다,</span><span class=\"en\"><b><span class=\"grammar-hl\">are getting</span> warmer,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 이것은</span><span class=\"en\"><b>and this</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">퍼핀을 두었다</span><span class=\"en\"><b>put puffins</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">위험 속에</span><span class=\"en\"><b>in danger.</b></span></div></div><div class=\"lec-sent-ko\">지구와 바다가 점점 더 따뜻해지면서, 이것이 퍼핀을 위험에 빠뜨리게 되었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 멸종 위기 상황에 대한 구체적인 원인으로 환경 변화를 지목하여 논리적 인과관계를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are getting (현재진행): be동사(are)+-ing(getting) 구조로, 점진적인 변화를 나타냄.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">in danger</td><td class=\"m\">위험에 처한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">스티브 크레스라는 이름의 한 남자는</span><span class=\"en\"><b>A man <span class=\"grammar-hl\">named</span> Steve Kress</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">미국 메인주 출신의,</span><span class=\"en\"><b>from Maine, the U.S.,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">돕기를 원했다</span><span class=\"en\"><b>wanted to help</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">퍼핀들을</span><span class=\"en\"><b>puffins.</b></span></div></div><div class=\"lec-sent-ko\">미국 메인주 출신의 Steve Kress라는 남자는 퍼핀들을 돕고 싶었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 환경 변화로 인한 퍼핀의 위기를 해결하기 위해 행동에 나선 구체적인 인물을 등장시켜 이야기의 전환점을 마련합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">named (과거분사): 명사 a man을 뒤에서 수식. &#39;a man who is named&#39;의 축약 형태로, 명사와 수동 관계(이름 지어진)임.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 더 나은 보금자리를 만들었다</span><span class=\"en\"><b>He <span class=\"grammar-hl\">made</span> a better home</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들을 위한</span><span class=\"en\"><b>for them</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자연 속에</span><span class=\"en\"><b>in nature.</b></span></div></div><div class=\"lec-sent-ko\">그는 자연에 그들을 위한 더 나은 보금자리를 만들어주었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 위기 해결을 위한 첫 번째 구체적인 노력으로 서식지 개선이라는 실천 방안을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">made (5형식(SVOC)): make+O+OC 구조의 응용으로, &#39;a better home&#39;을 &#39;for them(그들을 위해)&#39;이라는 전치사구와 함께 구성함.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">nature</td><td class=\"m\">자연, 본성</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 또한 가짜 퍼핀을 사용했다</span><span class=\"en\"><b>He also used fake puffins</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는 생각했기 때문에</span><span class=\"en\"><b>because he thought</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">진짜 퍼핀들이</span><span class=\"en\"><b>the real puffins</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들을 볼지도 모른다고</span><span class=\"en\"><b><span class=\"grammar-hl\">might see them</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">친구들로서</span><span class=\"en\"><b><span class=\"grammar-hl\">as friends</span>.</b></span></div></div><div class=\"lec-sent-ko\">그는 가짜 퍼핀도 사용했는데, 진짜 퍼핀들이 그것들을 친구로 볼지도 모른다고 생각했기 때문이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 서식지 복원과 함께 동물의 습성을 이용한 심리적 유인 전략을 사용했다는 점을 부연 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">might see them as friends (5형식(SVOC)): see A as B 구조로, A(them)를 B(friends)로 인식한다는 의미의 동사구.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fake</td><td class=\"m\">가짜의, 모조의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이러한 노력은</span><span class=\"en\"><b>This effort</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">도울 수 있었다</span><span class=\"en\"><b>could <span class=\"grammar-hl\">help</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">퍼핀들이 머무르도록</span><span class=\"en\"><b><span class=\"grammar-hl\">puffins stay</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 지역에</span><span class=\"en\"><b>in the area.</b></span></div></div><div class=\"lec-sent-ko\">이런 노력이 퍼핀들이 그 지역에 머무르도록 도울 수 있었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 스티브 크레스의 구체적인 활동이 퍼핀의 생존과 정착에 어떤 효과를 가져왔는지 결과론적으로 정리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">help puffins stay (5형식(SVOC)): help+O+OC(동사원형) 구조. 목적어(puffins)가 목적보어(stay)하는 것을 돕다는 의미.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">effort</td><td class=\"m\">노력, 수고</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이제,</span><span class=\"en\"><b>Now,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 많은 퍼핀들이 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">there are</span> more puffins</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이전보다</span><span class=\"en\"><b>than before.</b></span></div></div><div class=\"lec-sent-ko\">이제, 전보다 더 많은 수의 퍼핀들이 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급된 노력의 결과로 개체 수가 실질적으로 회복되었음을 알리는 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">there are (도치): 유도부사 there로 시작하여 주어(more puffins)와 동사(are)의 위치가 바뀐 구조.</div></div>\n        ","<div class=\"lec-sent-no\">문장 11 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">코로나19 대유행 동안</span><span class=\"en\"><b>During the COVID-19 pandemic</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">영국에서,</span><span class=\"en\"><b>in the U.K.,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 적은 관광객들이 있었다</span><span class=\"en\"><b><span class=\"grammar-hl\">there were</span> fewer tourists.</b></span></div></div><div class=\"lec-sent-ko\">코로나19 대유행 동안 영국에서는 관광객의 수가 줄었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 개체 수 회복의 또 다른 부차적인 환경적 요인으로 인간 활동의 감소를 예시로 듭니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">there were (도치): 유도부사 there를 사용하여 존재를 나타내며, 주어(fewer tourists)와 동사(were)가 도치된 구조.</div></div>\n        ","<div class=\"lec-sent-no\">문장 12 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그래서</span><span class=\"en\"><b>So</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">퍼핀들은</span><span class=\"en\"><b>the puffins</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가질 수 있었다</span><span class=\"en\"><b><span class=\"grammar-hl\">could have</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 많은 새끼들을</span><span class=\"en\"><b>more babies.</b></span></div></div><div class=\"lec-sent-ko\">그래서 퍼핀들은 더 많은 새끼를 낳을 수 있었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 관광객 감소라는 외부 요인이 퍼핀의 번식 활동에 어떻게 직접적인 도움을 주었는지 인과관계를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">could have (관용표현): 조동사 could를 사용하여 과거의 가능성이나 능력을 나타냄.</div></div>\n        ","<div class=\"lec-sent-no\">문장 13 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 결과로서,</span><span class=\"en\"><b>As a result,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">미국 어류 및 야생동물관리국은</span><span class=\"en\"><b>the US Fish and Wildlife Service</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들을 제거했다</span><span class=\"en\"><b><span class=\"grammar-hl\">removed them</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">멸종 위기종 목록으로부터</span><span class=\"en\"><b><span class=\"grammar-hl\">from</span> the endangered species list</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">2020년 12월에</span><span class=\"en\"><b>in December 2020.</b></span></div></div><div class=\"lec-sent-ko\">그 결과, 미국 어류 및 야생동물관리국은 2020년 12월에 퍼핀을 멸종 위기종 목록에서 제외했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 일련의 노력과 환경 변화가 합쳐져 얻게 된 공식적인 성공 사례를 결론으로 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">removed them from (관용표현): remove A from B 구조로, A를 B로부터 제거하다는 의미.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">endangered</td><td class=\"m\">멸종 위기에 처한, 위험에 빠진</td></tr><tr><td class=\"w\">species</td><td class=\"m\">종, 종류</td></tr><tr><td class=\"w\">as a result</td><td class=\"m\">결과적으로, 그 결과</td></tr><tr><td class=\"w\">remove</td><td class=\"m\">제거하다, 삭제하다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>북대서양의 친근한 새인 퍼핀이 환경 변화로 멸종 위기에 처했다.</li><li>스티브 크레스는 서식지 개선과 가짜 퍼핀 이용 전략으로 퍼핀을 도왔다.</li><li>이후 관광객 감소 등의 요인이 겹쳐 퍼핀의 개체 수가 늘어났다.</li><li>그 결과 퍼핀은 멸종 위기 종 목록에서 제외되며 성공적으로 복원되었다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Conservationists implemented creative strategies to protect puffins, and decreased human activity allowed their population to grow sufficiently for them to be delisted from endangered status.</div>\n              <div class=\"lec-final-sum-ko\">환경 보호 활동가들이 퍼핀을 보호하기 위한 창의적인 전략을 실행했고, 인간의 활동이 감소함에 따라 퍼핀 개체수가 멸종 위기 목록에서 제외될 만큼 충분히 증가했다.</div></div></div>"],"segs":[[{"audio":"./passage13_audio/1.mp3","hl":null}],[{"audio":"./passage13_audio/2.mp3","hl":null}],[{"audio":"./passage13_audio/3.mp3","hl":null},{"audio":"./passage13_audio/4.mp3","hl":"stage-0"},{"audio":"./passage13_audio/5.mp3","hl":"stage-1"},{"audio":"./passage13_audio/6.mp3","hl":"stage-2"}],[{"audio":"./passage13_audio/7.mp3","hl":null}],[{"audio":"./passage13_audio/8.mp3","hl":"main"},{"audio":"./passage13_audio/9.mp3","hl":"meaning"},{"audio":"./passage13_audio/10.mp3","hl":"grammar"}],[{"audio":"./passage13_audio/11.mp3","hl":"main"},{"audio":"./passage13_audio/12.mp3","hl":"meaning"},{"audio":"./passage13_audio/13.mp3","hl":"grammar"}],[{"audio":"./passage13_audio/14.mp3","hl":"main"},{"audio":"./passage13_audio/15.mp3","hl":"meaning"},{"audio":"./passage13_audio/16.mp3","hl":"grammar"}],[{"audio":"./passage13_audio/17.mp3","hl":"main"},{"audio":"./passage13_audio/18.mp3","hl":"meaning"},{"audio":"./passage13_audio/19.mp3","hl":"grammar"}],[{"audio":"./passage13_audio/20.mp3","hl":"main"},{"audio":"./passage13_audio/21.mp3","hl":"meaning"},{"audio":"./passage13_audio/22.mp3","hl":"grammar"}],[{"audio":"./passage13_audio/23.mp3","hl":"main"},{"audio":"./passage13_audio/24.mp3","hl":"meaning"},{"audio":"./passage13_audio/25.mp3","hl":"grammar"}],[{"audio":"./passage13_audio/26.mp3","hl":"main"},{"audio":"./passage13_audio/27.mp3","hl":"meaning"},{"audio":"./passage13_audio/2
