</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}

    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}

lecturePlayer(document.getElementById("app"),{"brand":"청명학원 영어과","title":"리딩그라피2 리딩그라피레벨2 15번","audioDir":"audio","preview":false,"count":46,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.400em\">리딩그라피레벨2\u003cbr>15번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩그라피2\u003c/div>\u003ch1>Panjat Pinang: A Slippery Climb for Indonesian Independence\u003c/h1>\u003ch2>판잣 피낭: 인도네시아 독립을 위한 미끄러운 등반\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>인도네시아의 \u003cb class=\"key\">독립기념일\u003c/b>에 행해지는 \u003cb class=\"key\">Panjat \u003c/b>\u003cb class=\"key\">Pinang\u003c/b>이라는 게임은 기름칠한 기둥을 함께 오르며 \u003cb class=\"key\">팀워크\u003c/b>와 협동의 중요성을 일깨운다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Panjat Pinang is a traditional Indonesian game that celebrates independence and fosters teamwork through a challenging climb.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 인도네시아의 아주 특별한 전통 축제 게임을 다룬 지문을 함께 공부해 보겠습니다. 이번 시간에는 Panjat Pinang이라는 게임의 유래와 그 속에 담긴 협동의 가치를 살펴볼 거예요. 이 글의 요지는 판잣 피낭이 독립을 기념하며 팀워크를 기르는 중요한 행사라는 점입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">인도네시아는 과거 300년 넘게 \u003cb class=\"key\">네덜란드의 \u003c/b>\u003cb class=\"key\">식민지\u003c/b> 지배를 받다가 1945년 8월 17일에 마침내 독립했습니다. 매년 \u003cb class=\"key\">독립기념일(Independence \u003c/b>\u003cb class=\"key\">Day)\u003c/b>이 되면 이를 축하하기 위해 '판잣 피낭'이라는 아주 특별한 행사를 엽니다. 이 게임은 과거 식민 시절 네덜란드인들이 잔치를 벌이며 높은 곳에 상품을 매달아 놓았던 것에서 유래되었습니다. 높고 \u003cb class=\"key\">미끄러운 \u003c/b>\u003cb class=\"key\">기둥(greased \u003c/b>\u003cb class=\"key\">pole)\u003c/b>을 기어 올라가야 하기에 혼자서는 절대 불가능하며, 마치 \u003cb class=\"key\">백지장도 \u003c/b>\u003cb class=\"key\">맞들면 \u003c/b>\u003cb class=\"key\">낫다\u003c/b>는 말처럼 동료들과 몸을 쌓아 올려야 합니다. 이 과정은 국민들이 힘을 합쳐 독립을 쟁취했던 \u003cb class=\"key\">협동(cooperation)\u003c/b>의 정신을 상징적으로 보여줍니다.\u003c/div>","segs":[{"n":2,"text":"인도네시아는 300년이 넘는 긴 시간 동안 네덜란드의 식민 지배를 받았습니다. 그러다 1945년 8월 17일에 드디어 자유를 되찾았죠. 이 독립기념일을 축하하기 위해 열리는 판잣 피낭은 아주 미끄러운 기둥을 기어 올라가는 게임이에요. 혼자서는 절대 올라갈 수 없는 미끄러운 기둥을 보며 인도네시아 사람들은 백지장도 맞들면 낫다는 협동의 정신을 되새깁니다. 과거의 아픔을 이겨내고 온 국민이 하나가 되었던 독립의 순간을 기념하는 상징적인 행사라고 할 수 있습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>게임 소개와 유래\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>인도네시아의 독특한 게임인 \u003cb class=\"key\">Panjat \u003c/b>\u003cb class=\"key\">Pinang\u003c/b>을 소개하며, 이것이 8월 17일 \u003cb class=\"key\">네덜란드\u003c/b>로부터의 독립을 기념하기 위해 시작되었음을 밝힙니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>게임의 방식과 난관\u003csmall>방법 및 문제 제시 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>기름칠한 기둥을 올라가 상품을 얻는 방식인데, 기둥이 너무 \u003cb class=\"key\">미끄럽고 \u003c/b>\u003cb class=\"key\">높아서\u003c/b> 혼자서는 올라갈 수 없다는 \u003cb class=\"key\">한계\u003c/b>를 언급합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>해결책: 협동\u003csmall>해결 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>가족과 친구들이 팀을 이루어 \u003cb class=\"key\">서로를 \u003c/b>\u003cb class=\"key\">돕는\u003c/b> 과정이 필수적이며, 함께 \u003cb class=\"key\">협력\u003c/b>해야 함을 강조합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>보상과 현장 분위기\u003csmall>상세 설명 · 문장 7–9\u003c/small>\u003c/h4>\u003cp>기둥 꼭대기의 다양한 \u003cb class=\"key\">상품들\u003c/b>과 이를 응원하는 사람들의 \u003cb class=\"key\">활기찬 \u003c/b>\u003cb class=\"key\">분위기\u003c/b>를 묘사하여 현장감을 전달합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>게임의 교훈과 의의\u003csmall>결론 · 문장 10–11\u003c/small>\u003c/h4>\u003cp>이 게임이 \u003cb class=\"key\">팀워크와 \u003c/b>\u003cb class=\"key\">협동\u003c/b>의 중요성을 가르쳐주며, 모두가 즐겁게 \u003cb class=\"key\">독립기념일\u003c/b>을 보내는 방법임을 정리하며 마무리합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 이제 글의 흐름을 따라가며 판잣 피낭이 어떤 게임인지 자세히 알아볼까요?","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장은 도입부예요. 인도네시아의 독특한 게임인 Panjat Pinang을 소개하면서, 이 게임이 네덜란드로부터 독립한 것을 기념하기 위해 매년 8월 17일에 열린다는 배경을 설명하고 있습니다.","hl":"f0"},{"n":5,"text":"세 번째와 네 번째 문장에서는 게임의 방식과 난관을 보여줍니다. 기름칠한 기둥을 올라가야 하는데, 기둥이 너무 미끄럽고 높아서 혼자서는 절대 불가능하다는 문제를 제시하고 있죠.","hl":"f1"},{"n":6,"text":"다섯 번째와 여섯 번째 문장은 해결책입니다. 혼자 할 수 없으니 친구와 가족이 팀을 이루어 서로 올라가는 것을 도와주며 협력해야 한다는 점을 강조하고 있습니다.","hl":"f2"},{"n":7,"text":"일곱 번째부터 아홉 번째 문장에서는 현장의 활기찬 모습을 묘사합니다. 기둥 끝에 매달린 자전거와 같은 다양한 상품들과 응원하는 사람들의 모습을 통해 축제 분위기를 생생하게 전달합니다.","hl":"f3"},{"n":8,"text":"마지막 열 번째와 열한 번째 문장은 결론입니다. 이 게임이 팀워크와 협동의 중요성을 가르쳐 주는 재미있는 방법이라고 정리하며 글을 마무리하고 있어요.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결 (Problem-Solution)\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 10번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 Panjat Pinang이라는 게임의 방식과 어려움을 설명한 뒤, 이를 해결하기 위한 \u003cb class=\"key\">협력\u003c/b>의 과정을 보여줍니다. 마지막 부분에서 이 게임이 주는 \u003cb class=\"key\">교훈\u003c/b>인 팀워크의 중요성을 명시하고 있어 주제가 뒤에 나타나는 \u003cb class=\"key\">미괄식\u003c/b> 구조를 가집니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>However (4)\u003c/b>\u003cspan>역접 (혼자 오르기 어렵다는 문제 제기)\u003c/span>\u003cb>so (4)\u003c/b>\u003cspan>인과 (혼자서는 불가능하다는 결론)\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">unique game\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Panjat Pinang\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">This game\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the game\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">It\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Climbing alone\u003c/th>\u003cth>Working together\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Not possible due to slippery poles\u003c/td>\u003ctd>Can reach prizes through teamwork\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글은 전형적인 문제와 해결 구조를 가지고 있습니다. 미끄러운 기둥이라는 문제 상황을 팀워크라는 해결책으로 극복하는 과정을 보여주죠. 또한 주제문이 마지막에 위치하여 교훈을 강조하는 미괄식 구조를 취하고 있습니다.","hl":"ty"},{"n":10,"text":"네 번째 문장의 However와 so를 주목해 보세요. 이 신호어들은 기둥이 미끄럽다는 사실이 왜 문제가 되는지, 그리고 그 결과로 왜 협동이 필요한지를 자연스럽게 연결해 줍니다. 또한 unique game에서 Panjat Pinang으로 이어지는 명칭의 반복이 글의 응집성을 높여줍니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>unique\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>독특한\u003c/span>\u003c/div>\u003cdiv>\u003cb>known as\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 알려진\u003c/span>\u003c/div>\u003cdiv>\u003cb>take place\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>열리다, 개최되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>celebrate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>기념하다, 축하하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>independence\u003c/b>\u003cem>명사\u003c/em>\u003cspan>독립\u003c/span>\u003c/div>\u003cdiv>\u003cb>Netherlands\u003c/b>\u003cem>명사\u003c/em>\u003cspan>네덜란드\u003c/span>\u003c/div>\u003cdiv>\u003cb>climb up\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>올라가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>greased\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>기름칠한\u003c/span>\u003c/div>\u003cdiv>\u003cb>pole\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기둥\u003c/span>\u003c/div>\u003cdiv>\u003cb>reach\u003c/b>\u003cem>동사\u003c/em>\u003cspan>~에 닿다, 얻다\u003c/span>\u003c/div>\u003cdiv>\u003cb>prize\u003c/b>\u003cem>명사\u003c/em>\u003cspan>상품, 상\u003c/span>\u003c/div>\u003cdiv>\u003cb>slippery\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>미끄러운\u003c/span>\u003c/div>\u003cdiv>\u003cb>alone\u003c/b>\u003cem>부사\u003c/em>\u003cspan>혼자\u003c/span>\u003c/div>\u003cdiv>\u003cb>work together\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>협력하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>form\u003c/b>\u003cem>동사\u003c/em>\u003cspan>형성하다, 이루다\u003c/span>\u003c/div>\u003cdiv>\u003cb>each other\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>서로\u003c/span>\u003c/div>\u003cdiv>\u003cb>bicycle\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자전거\u003c/span>\u003c/div>\u003cdiv>\u003cb>electronics\u003c/b>\u003cem>명사\u003c/em>\u003cspan>전자제품\u003c/span>\u003c/div>\u003cdiv>\u003cb>sugar\u003c/b>\u003cem>명사\u003c/em>\u003cspan>설탕\u003c/span>\u003c/div>\u003cdiv>\u003cb>cheer for\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~를 응원하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>exciting\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>신나는\u003c/span>\u003c/div>\u003cdiv>\u003cb>importance\u003c/b>\u003cem>명사\u003c/em>\u003cspan>중요성\u003c/span>\u003c/div>\u003cdiv>\u003cb>teamwork\u003c/b>\u003cem>명사\u003c/em>\u003cspan>팀워크\u003c/span>\u003c/div>\u003cdiv>\u003cb>cooperation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>협동\u003c/span>\u003c/div>\u003cdiv>\u003cb>good time\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>즐거운 시간\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"중요한 단어를 몇 개 살펴볼까요? independence는 독립이라는 뜻이고, greased는 기름칠을 했다는 의미입니다. 그리고 cooperation은 협동이라는 뜻으로 이 글의 핵심 키워드이니 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">unique\u003c/b>\u003cspan class=\"m\">독특한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">special\u003c/span>\u003cspan class=\"s\">distinctive\u003c/span>\u003cspan class=\"s\">peculiar\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">common\u003c/span>\u003cspan class=\"a\">ordinary\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">celebrate\u003c/b>\u003cspan class=\"m\">기념하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">commemorate\u003c/span>\u003cspan class=\"s\">observe\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">reach\u003c/b>\u003cspan class=\"m\">닿다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">arrive at\u003c/span>\u003cspan class=\"s\">attain\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">miss\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">slippery\u003c/b>\u003cspan class=\"m\">미끄러운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">greasy\u003c/span>\u003cspan class=\"s\">slick\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">rough\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">cooperation\u003c/b>\u003cspan class=\"m\">협동\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">collaboration\u003c/span>\u003cspan class=\"s\">teamwork\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">competition\u003c/span>\u003cspan class=\"a\">conflict\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어도 정리해 봅시다. unique는 special이나 distinctive로 바꿔 쓸 수 있고, 반대말은 common입니다. 또한 cooperation은 collaboration이나 teamwork와 같은 맥락에서 이해하면 시험 대비에 큰 도움이 될 거예요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인도네시아에는,\u003c/span>\u003cspan class=\"en\">15 In Indonesia,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">독특한 게임이 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">is\u003c/span> a unique game\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Panjat Pinang이라고 알려진.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">known \u003c/span>\u003cspan class=\"tgt\">as\u003c/span> Panjat Pinang.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">인도네시아에는 Panjat Pinang이라고 알려진 독특한 게임이 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 글의 소재인 \u003cb class=\"key\">인도네시아 \u003c/b>\u003cb class=\"key\">게임\u003c/b>을 소개하는 도입부입니다. \u003cb class=\"key\">과거분사\u003c/b>를 사용하여 게임의 이름을 구체적으로 설명하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">there is/are 유도부사 구문\u003c/span> : there [유도부사] + is [동사] + a unique game [주어] : \"독특한 게임이 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사의 후치 수식\u003c/span> : unique game [명사] + known as [과거분사구] : \"Panjat Pinang이라고 알려진\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"In Indonesia, 인도네시아에는. there is a unique game, 독특한 게임이 있다. known as Panjat Pinang, Panjat Pinang이라고 알려진.. 이 문장 전체를 해석하면, 인도네시아에는 Panjat Pinang이라고 알려진 독특한 게임이 있다.","hl":"m"},{"n":14,"text":"여러분 인도네시아의 특별한 전통 게임을 소개하는 첫 번째 문장이에요. Panjat Pinang이라는 이름의 게임이 무엇인지 독자들에게 알려주며 글을 시작하고 있죠.","hl":"mn"},{"n":15,"text":"첫 번째로 there is 구문은 독특한 게임이 있다는 뜻으로 주어와 동사의 위치가 바뀐 도치 문장이에요. 두 번째로 known as 부분은 앞에 있는 명사를 뒤에서 꾸며주는 과거분사구로 수동의 의미를 담고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 게임은 열린다\u003c/span>\u003cspan class=\"en\">This game \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">takes \u003c/span>\u003cspan class=\"tgt\">place\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매년 8월 17일에,\u003c/span>\u003cspan class=\"en\">every August 17th,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그것은 시작되었다\u003c/span>\u003cspan class=\"en\">and it \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">started\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인도네시아의 독립을 기념하기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">celebrate\u003c/span> Indonesia's independence\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">네덜란드로부터의.\u003c/span>\u003cspan class=\"en\">from the Netherlands.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 게임은 매년 8월 17일에 열리며, 네덜란드로부터의 인도네시아 독립을 기념하기 위해 시작되었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 게임이 열리는 구체적인 \u003cb class=\"key\">날짜\u003c/b>와 \u003cb class=\"key\">개최 \u003c/b>\u003cb class=\"key\">목적\u003c/b>을 설명합니다. 인도네시아의 \u003cb class=\"key\">역사적 \u003c/b>\u003cb class=\"key\">사건\u003c/b>인 네덜란드로부터의 독립을 배경으로 함을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">자동사구 (개최되다)\u003c/span> : This game [주어] + takes place [현재형 동사] : \"열린다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : it [주어] + was [be동사] + started [과거분사] : \"시작되었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : started [동사] + to celebrate [to부정사구] : \"기념하기 위해\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"This game takes place, 이 게임은 열린다. every August 17th, 매년 8월 17일에. and it was started, 그리고 그것은 시작되었다. to celebrate Indonesia's independence, 인도네시아의 독립을 기념하기 위해. from the Netherlands, 네덜란드로부터의.. 이 문장 전체를 해석하면, 이 게임은 매년 8월 17일에 열리며, 네덜란드로부터의 인도네시아 독립을 기념하기 위해 시작되었다.","hl":"m"},{"n":17,"text":"이 문장은 게임이 언제 열리는지 그리고 왜 시작되었는지 그 유래를 설명하고 있어요. 인도네시아 사람들에게 아주 의미 깊은 독립기념일과 관련된 게임이라는 걸 알 수 있죠.","hl":"mn"},{"n":18,"text":"첫 번째로 takes place는 개최되다라는 뜻의 자동사로 수동태로 쓰지 않는다는 점이 중요해요. 두 번째로 was started는 게임이 시작된 수동의 상태를 보여주는 수동태 표현이고요. 마지막 세 번째로 to celebrate는 목적을 나타내는 표현으로 기념하기 위해라고 해석하면 자연스러워요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 게임에서,\u003c/span>\u003cspan class=\"en\">In the game,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들은 올라간다\u003c/span>\u003cspan class=\"en\">people climb up\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기름칠한 기둥을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">*greased \u003c/span>\u003cspan class=\"tgt\">poles\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상품을 얻기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">reach\u003c/span> the prizes\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">꼭대기에 있는!\u003c/span>\u003cspan class=\"en\">at the top!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 게임에서, 사람들은 꼭대기에 있는 상품을 얻기 위해 기름칠한 기둥을 올라간다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 게임의 구체적인 \u003cb class=\"key\">진행 \u003c/b>\u003cb class=\"key\">방식\u003c/b>을 묘사하고 있습니다. \u003cb class=\"key\">목적\u003c/b>을 달성하기 위해 어려운 조건인 기름칠한 기둥을 넘어야 함을 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사의 형용사 역할\u003c/span> : greased [과거분사] + poles [명사] : \"기름칠한 기둥들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : climb up [동사구] + to reach [to부정사구] : \"도달하기 위해 (얻기 위해)\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"In the game, 그 게임에서. people climb up, 사람들은 올라간다. *greased poles, 기름칠한 기둥을. to reach the prizes, 상품을 얻기 위해. at the top!, 꼭대기에 있는!. 이 문장 전체를 해석하면, 그 게임에서, 사람들은 꼭대기에 있는 상품을 얻기 위해 기름칠한 기둥을 올라간다!","hl":"m"},{"n":20,"text":"이제 게임이 실제로 어떻게 진행되는지 아주 역동적으로 보여주는 세 번째 문장이에요. 미끄러운 기둥을 올라가서 꼭대기에 있는 보상을 차지하는 것이 이 게임의 핵심이죠.","hl":"mn"},{"n":21,"text":"첫 번째 포인트인 greased poles에서 과거분사 greased는 기름칠이 된 기둥이라는 수동의 의미로 명사를 꾸며주고 있어요. 두 번째로 to reach는 앞 문장과 마찬가지로 꼭대기에 도달하기 위해라는 목적을 나타내는 용법으로 쓰였습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나,\u003c/span>\u003cspan class=\"en\">However,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 기둥들은\u003c/span>\u003cspan class=\"en\">the poles are\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매우 미끄럽고 높아서,\u003c/span>\u003cspan class=\"en\">really slippery and tall,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가능하지 않다\u003c/span>\u003cspan class=\"en\">so \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">it's \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">possible \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들을 혼자 올라가는 것은.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">climb\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">them\u003c/span> alone.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나, 그 기둥들은 매우 미끄럽고 높아서, 그것들을 혼자 올라가는 것은 가능하지 않다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 게임의 난이도가 높다는 것을 설명하며, 왜 다음 문장에서 \u003cb class=\"key\">협력\u003c/b>이 필요한지를 보여주는 \u003cb class=\"key\">인과관계\u003c/b>의 문장입니다. \u003cb class=\"key\">가주어 \u003c/b>\u003cb class=\"key\">it\u003c/b>과 \u003cb class=\"key\">진주어 \u003c/b>\u003cb class=\"key\">to \u003c/b>\u003cb class=\"key\">climb\u003c/b> 구조가 쓰였습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가주어·진주어 구문\u003c/span> : it (가주어) + be동사 + 형용사 + to-v (진주어) : \"올라가는 것은 가능하지 않다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">대명사의 수 일치\u003c/span> : them (복수 대명사) = the poles : \"그것들을\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"However, 그러나. the poles are, 그 기둥들은. really slippery and tall, 매우 미끄럽고 높아서. so it's not possible, 가능하지 않다. to climb them alone, 그것들을 혼자 올라가는 것은.. 이 문장 전체를 해석하면, 그러나, 그 기둥들은 매우 미끄럽고 높아서, 그것들을 혼자 올라가는 것은 가능하지 않다.","hl":"m"},{"n":23,"text":"기둥이 너무 미끄럽고 높아서 혼자서는 절대 올라갈 수 없다는 상황을 설명하고 있어요. 여기서 it은 가주어로 쓰여서 다음 문장의 협력이 왜 필요한지 이유를 만들어주는 역할을 합니다.","hl":"mn"},{"n":24,"text":"첫 번째로 it's not possible의 it은 해석하지 않는 가주어이고 뒤에 있는 to climb이 진짜 주어인 가주어 진주어 구문이에요. 두 번째로 them은 앞에 나온 복수 명사인 the poles를 대신 받는 대명사니까 꼭 복수형인 them을 써야 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">친구들과 가족들은\u003c/span>\u003cspan class=\"en\">Friends and family\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">함께 협력해야 한다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">need \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">work\u003c/span> together.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">친구들과 가족들은 함께 협력해야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞의 어려움을 극복하기 위한 \u003cb class=\"key\">해결책\u003c/b>을 제시하며, 이 글의 핵심 주제인 \u003cb class=\"key\">협력\u003c/b>을 직접적으로 언급합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">need의 목적어(to부정사)\u003c/span> : need + to-v : \"협력해야 한다\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"Friends and family, 친구들과 가족들은. need to work together, 함께 협력해야 한다.. 이 문장 전체를 해석하면, 친구들과 가족들은 함께 협력해야 한다.","hl":"m"},{"n":26,"text":"앞 문장에서 혼자서는 안 된다고 했으니 이제 해결책이 나와야겠죠. 가족과 친구가 반드시 함께 노력하고 협력해야 한다는 주제를 던지고 있어요.","hl":"mn"},{"n":27,"text":"첫 번째로 need to work 부분을 보면 동사 need는 뒤에 목적어로 to부정사만 써요. 그래서 to work 형태가 왔고 함께 일할 필요가 있다는 의미를 완성합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 팀을 이루어\u003c/span>\u003cspan class=\"en\">They form teams\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">서로 올라가는 것을 돕는다.\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">help \u003c/span>\u003cspan class=\"tgt\">each \u003c/span>\u003cspan class=\"tgt\">other \u003c/span>\u003cspan class=\"tgt\">climb\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 팀을 이루어 서로 올라가는 것을 돕는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 협력의 \u003cb class=\"key\">구체적인 \u003c/b>\u003cb class=\"key\">방식\u003c/b>을 설명합니다. 혼자가 아닌 팀을 이루고 서로 \u003cb class=\"key\">돕는 \u003c/b>\u003cb class=\"key\">과정\u003c/b>을 묘사합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">준사역동사 help의 목적격 보어\u003c/span> : help + 목적어 + 목적격 보어(원형부정사/to-v) : \"서로 올라가는 것을 돕는다\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"They form teams, 그들은 팀을 이루어. and help each other climb, 서로 올라가는 것을 돕는다.. 이 문장 전체를 해석하면, 그들은 팀을 이루어 서로 올라가는 것을 돕는다.","hl":"m"},{"n":29,"text":"협력하는 모습을 더 자세히 보여주는 문장이에요. 팀을 만들고 서로 밀고 끌어주며 올라가는 구체적인 도움의 과정을 나타냅니다.","hl":"mn"},{"n":30,"text":"첫 번째로 help each other climb 문장을 보면 help라는 동사 뒤에 목적어 each other가 오고 그 뒤에 보어로 동사원형 climb이 왔어요. help는 준사역동사라서 climb 대신 to climb을 써도 문법적으로 맞습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기둥의 꼭대기에는,\u003c/span>\u003cspan class=\"en\">At the top of the poles,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상품들이 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">prizes\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자전거, 전자제품과 같은,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">like\u003c/span> bicycles, electronics,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 설탕 봉지와 같은.\u003c/span>\u003cspan class=\"en\">and bags of sugar.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">기둥의 꼭대기에는 자전거, 전자제품, 그리고 설탕 봉지와 같은 상품들이 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사람들이 기둥을 오르는 이유인 구체적인 \u003cb class=\"key\">보상\u003c/b>을 나열하고 있습니다. 축제의 \u003cb class=\"key\">풍성함\u003c/b>과 참가가치가 있는 게임이라는 점을 강조하는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">유도부사 구문 (there + be동사 + 주어)\u003c/span> : There [유도부사] + are [be동사] + prizes [복수 주어] : \"상품들이 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 like\u003c/span> : prizes [명사] + like [전치사] + A, B, and C [명사 나열] : \"~와 같은\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"At the top of the poles, 기둥의 꼭대기에는. there are prizes, 상품들이 있다. like bicycles, electronics, 자전거, 전자제품과 같은. and bags of sugar, 그리고 설탕 봉지와 같은.. 이 문장 전체를 해석하면, 기둥의 꼭대기에는 자전거, 전자제품, 그리고 설탕 봉지와 같은 상품들이 있다.","hl":"m"},{"n":32,"text":"이 문장은 게임에서 얻을 수 있는 구체적인 보상들을 설명하고 있어요. 기둥 꼭대기에 매달린 매력적인 상품들을 나열하면서 축제의 풍성한 분위기를 전달하는 역할을 하죠.","hl":"mn"},{"n":33,"text":"첫 번째로 there are 구문을 봐 주세요. there가 문두에 오면 주어는 be동사 뒤로 가는데 여기서는 prizes가 복수 명사라 are를 썼습니다. 두 번째로 like는 예시를 들 때 쓰는 전치사로 쓰였어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여성들과 아이들은\u003c/span>\u003cspan class=\"en\">Women and children\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">응원한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">cheer \u003c/span>\u003cspan class=\"tgt\">for\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 친구들과 가족들을.\u003c/span>\u003cspan class=\"en\">their friends and family.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여성들과 아이들은 그들의 친구들과 가족들을 응원한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 경기에 직접 참여하지 않는 사람들도 \u003cb class=\"key\">공동체\u003c/b>의 일원으로서 함께 즐기는 모습을 보여줍니다. 모두가 참여하는 \u003cb class=\"key\">축제 \u003c/b>\u003cb class=\"key\">분위기\u003c/b>를 묘사합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사구 (자동사+전치사)\u003c/span> : cheer [자동사] + for [전치사] + 대상 : \"~를 응원하다\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"Women and children, 여성들과 아이들은. cheer for, 응원한다. their friends and family, 그들의 친구들과 가족들을.. 이 문장 전체를 해석하면, 여성들과 아이들은 그들의 친구들과 가족들을 응원한다.","hl":"m"},{"n":35,"text":"경기에 참여한 사람들뿐만 아니라 지켜보는 가족과 이웃들까지 모두가 하나 되어 즐기는 공동체적인 축제 분위기를 보여주는 문장입니다.","hl":"mn"},{"n":36,"text":"첫 번째로 cheer for라는 동사구를 기억하세요. 뒤에 응원의 대상을 쓰고 싶을 때 전치사 for와 함께 쓴다는 점이 핵심입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">신나는 일이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It's \u003c/span>\u003cspan class=\"tgt\">exciting \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지켜보는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">see\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">누가 획득할지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">get\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상품을 먼저.\u003c/span>\u003cspan class=\"en\">the prizes first.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">누가 상품을 먼저 획득할지 지켜보는 것은 신나는 일이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 지켜보는 관중의 시각에서 느끼는 \u003cb class=\"key\">흥분감\u003c/b>과 경쟁의 \u003cb class=\"key\">긴장감\u003c/b>을 서술합니다. 가주어 구문을 통해 독자의 \u003cb class=\"key\">몰입감\u003c/b>을 높입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가주어-진주어 구문\u003c/span> : It [가주어] + is [be동사] + exciting [보어] + to see [진주어] : \"지켜보는 것은 신나는 일이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">간접의문문 (의문사절)\u003c/span> : who [의문사/주어] + will get [동사] : \"누가 획득할지\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"It's exciting, 신나는 일이다. to see, 지켜보는 것은. who will get, 누가 획득할지. the prizes first, 상품을 먼저.. 이 문장 전체를 해석하면, 누가 상품을 먼저 획득할지 지켜보는 것은 신나는 일이다.","hl":"m"},{"n":38,"text":"경기를 관람하는 사람들의 시각에서 느끼는 흥분과 긴장감을 전하고 있어요. 누가 과연 1등을 할지 궁금해하는 현장감을 잘 보여줍니다.","hl":"mn"},{"n":39,"text":"첫 번째로 가주어 It과 진주어 to see 구문을 보세요. 주어가 길어서 가주어를 쓰고 진짜 주어인 to부정사를 뒤로 보낸 구조예요. 두 번째로 exciting은 상황이 흥분감을 주는 것이라 현재분사를 썼습니다. 세 번째로 who will get은 see의 목적어 역할을 하는 간접의문문입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Panjat Pinang은\u003c/span>\u003cspan class=\"en\">Panjat Pinang\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들에게 가르친다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">teaches \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">팀워크와 협동의 중요성을.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">importance\u003c/span> of teamwork and cooperation.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Panjat Pinang은 사람들에게 팀워크와 협동의 중요성을 가르친다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Panjat Pinang이라는 전통 놀이가 우리에게 주는 핵심적인 \u003cb class=\"key\">교훈\u003c/b>을 설명하는 문장입니다. 혼자서는 불가능한 목표를 \u003cb class=\"key\">협동\u003c/b>을 통해 이뤄내는 과정의 가치를 강조하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">4형식 수여동사\u003c/span> : teach [동사] + people [간접목적어] + the importance [직접목적어] : \"사람들에게 중요성을 가르치다\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"Panjat Pinang, Panjat Pinang은. teaches people, 사람들에게 가르친다. the importance of teamwork and cooperation, 팀워크와 협동의 중요성을.. 이 문장 전체를 해석하면, Panjat Pinang은 사람들에게 팀워크와 협동의 중요성을 가르친다.","hl":"m"},{"n":41,"text":"이 문장은 이 놀이가 주는 교육적인 교훈을 설명하고 있어요. 기둥을 오르는 과정이 단순한 재미를 넘어 협동이라는 가치를 깨닫게 해준다는 뜻이죠.","hl":"mn"},{"n":42,"text":"문장에서 동사인 teaches는 뒤에 목적어를 두 개 나란히 가지는 수여동사예요. 그래서 사람들을 나타내는 people이 첫 번째 목적어로 오고 그 뒤에 중요성이라는 의미의 명사구가 두 번째 목적어로 온답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 재미있는 방법이다\u003c/span>\u003cspan class=\"en\">It's a fun way\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인도네시아의 독립일을 기념하고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">celebrate \u003c/span>\u003cspan class=\"tgt\">Indonesia's \u003c/span>\u003cspan class=\"tgt\">Independence \u003c/span>\u003cspan class=\"tgt\">Day \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">좋은 시간을 보내는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">have\u003c/span> a good time\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">친구와 가족과 함께.\u003c/span>\u003cspan class=\"en\">with friends and family.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 인도네시아의 독립일을 기념하고 친구와 가족과 함께 좋은 시간을 보내는 재미있는 방법이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글의 전체적인 \u003cb class=\"key\">결론\u003c/b>을 맺는 부분으로, 축제가 국민들 사이의 \u003cb class=\"key\">유대감\u003c/b>을 높여주는 역할을 합니다. 단순한 놀이를 넘어 국가의 기념일을 함께 즐기는 \u003cb class=\"key\">공동체\u003c/b>의 방식을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : way [명사] + to celebrate [to부정사구] : \"기념하는 방법\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동사원형의 병렬 구조\u003c/span> : to [celebrate (v1) ... and have (v2)] : \"기념하고 보내는\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"It's a fun way, 그것은 재미있는 방법이다. to celebrate Indonesia's Independence Day, 인도네시아의 독립일을 기념하고. and have a good time, 좋은 시간을 보내는. with friends and family, 친구와 가족과 함께.. 이 문장 전체를 해석하면, 그것은 인도네시아의 독립일을 기념하고 친구와 가족과 함께 좋은 시간을 보내는 재미있는 방법이다.","hl":"m"},{"n":44,"text":"이 글의 결론을 짓는 부분인데요. 축제가 국민들 사이의 유대감을 높여주고 공동체가 함께 즐거움을 나누는 방식임을 정리해주고 있습니다.","hl":"mn"},{"n":45,"text":"첫 번째로 살펴볼 어법은 명사 way를 뒤에서 꾸며주는 to celebrate예요. 형용사적 용법으로 쓰여서 기념하는 방법이라고 해석하죠. 두 번째는 celebrate와 have가 and로 연결된 병렬 구조예요. to 다음에 걸리는 동사들이 대등하게 연결되어 있다는 점에 주의하세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>\u003cb class=\"key\">Panjat \u003c/b>\u003cb class=\"key\">Pinang\u003c/b>은 인도네시아의 \u003cb class=\"key\">독립기념일\u003c/b>을 기념하는 독특한 전통 게임이다.\u003c/li>\u003cli>참가자들은 꼭대기의 상품을 얻기 위해 \u003cb class=\"key\">기름칠한 \u003c/b>\u003cb class=\"key\">기둥\u003c/b>을 올라가야 하지만, 너무 미끄러워 \u003cb class=\"key\">혼자\u003c/b>서는 불가능하다.\u003c/li>\u003cli>이 난관을 극복하기 위해 가족과 친구들이 팀을 이루어 \u003cb class=\"key\">서로를 \u003c/b>\u003cb class=\"key\">돕고\u003c/b> 협력한다.\u003c/li>\u003cli>이 게임은 즐거움을 주는 동시에 \u003cb class=\"key\">팀워크와 \u003c/b>\u003cb class=\"key\">협동\u003c/b>의 소중함을 가르쳐주는 교육적 의미가 있다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Panjat Pinang is a traditional Indonesian game that celebrates independence and fosters teamwork through a challenging climb.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">인도네시아의 \u003cb class=\"key\">독립기념일\u003c/b>에 행해지는 \u003cb class=\"key\">Panjat \u003c/b>\u003cb class=\"key\">Pinang\u003c/b>이라는 게임은 기름칠한 기둥을 함께 오르며 \u003cb class=\"key\">팀워크\u003c/b>와 협동의 중요성을 일깨운다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":46,"text":"오늘 우리는 인도네시아의 판잣 피낭을 통해 협동의 중요성을 배워보았습니다. 혼자서는 할 수 없는 일도 함께라면 해낼 수 있다는 가르침을 주는 지문이었죠. 오늘 배운 어휘들과 문장 구조를 다시 한번 복습해 보시기 바랍니다. 수고 많으셨습니다!","hl":null}]}]});</script></body></html>
