상태: 미끄러운(greased) 상태</li><li>도전 방법: 혼자가 아닌 팀 단위로 등반</li><li>상품: 자전거, 전자제품, 설탕 등(prizes)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03공동체의 축제 현장</div><ul><li>팀원들의 협력과 관중들의 응원이 어우러져 활기찬 축제 분위기가 형성된다.</li><li>협동의 필요성: 친구와 가족의 도움(work together)</li><li>주변의 반응: 여성과 아이들의 열띤 응원(cheer)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04게임의 가치와 교훈</div><ul><li>이 게임은 단순한 놀이를 넘어 협동의 중요성을 일깨워준다.</li><li>교육적 의미: 팀워크와 협력(teamwork and cooperation)의 중요성</li><li>축제의 의의: 독립 기념일을 즐겁게 기념함</li><li>핵심 키워드: 협동(cooperation)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">unique</td><td class=\"m\">독특한, 유일무이한</td></tr><tr><td class=\"w\">take place</td><td class=\"m\">일어나다, 개최되다</td></tr><tr><td class=\"w\">independence</td><td class=\"m\">독립, 자립</td></tr><tr><td class=\"w\">grease</td><td class=\"m\">기름을 바르다, 매끄럽게 하다</td></tr><tr><td class=\"w\">slippery</td><td class=\"m\">미끄러운, 미끄러지기 쉬운</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">work together</td><td class=\"m\">협력하다, 함께 일하다</td></tr><tr><td class=\"w\">cheer</td><td class=\"m\">환호하다, 응원하다</td></tr><tr><td class=\"w\">teamwork</td><td class=\"m\">팀워크, 협동</td></tr><tr><td class=\"w\">cooperation</td><td class=\"m\">협력, 협동</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">인도네시아에는</span><span class=\"en\"><b>In Indonesia,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">독특한 게임이 있다</span><span class=\"en\"><b>there is a unique game</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">판잣 피낭이라고 알려진</span><span class=\"en\"><b><span class=\"grammar-hl\">known as</span> Panjat Pinang.</b></span></div></div><div class=\"lec-sent-ko\">인도네시아에는 Panjat Pinang이라고 알려진 독특한 게임이 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 도입부로서, 인도네시아의 문화적 전통인 특정 놀이를 소개하며 전체 글의 주제를 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">known as (과거분사): known이 앞의 명사 a unique game을 수식하며, &#39;알려진(game)&#39;의 의미를 가짐. N + p.p. 구조로 &#39;N that is p.p.&#39;의 축약 형태임.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">unique</td><td class=\"m\">독특한, 유일무이한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 게임은</span><span class=\"en\"><b>This game</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">열린다</span><span class=\"en\"><b>takes place</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매년 8월 17일에</span><span class=\"en\"><b>every August 17th,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그것은 시작되었다</span><span class=\"en\"><b>and it <span class=\"grammar-hl\">was started</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인도네시아의 독립을 기념하기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to celebrate</span> Indonesia’s independence</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">네덜란드로부터의</span><span class=\"en\"><b>from the Netherlands.</b></span></div></div><div class=\"lec-sent-ko\">이 게임은 매년 8월 17일에 열리며, 네덜란드로부터의 인도네시아 독립을 기념하기 위해 시작되었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 놀이가 언제, 왜 시작되었는지 배경을 설명하며 이 놀이의 역사적 의미를 덧붙입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was started (수동태): be동사(was)+p.p.(started) 구조. start는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조(be동사+p.p.) was started 형태로 쓴다. 기본구조: V + O (주어가 목적어를 시작하다).</div><div class=\"lec-gr-item\">to celebrate (to부정사): 부사적 용법(목적)으로 쓰여 &#39;~하기 위해서&#39;라는 의미로 동사 was started의 목적을 설명함.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">independence</td><td class=\"m\">독립, 자립</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 게임에서</span><span class=\"en\"><b>In the game,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들은 올라간다</span><span class=\"en\"><b>people climb up</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">기름칠한 기둥을</span><span class=\"en\"><b><span class=\"grammar-hl\">greased</span> poles</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">상품들에 도달하기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to reach</span> the prizes</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">꼭대기에 있는</span><span class=\"en\"><b>at the top!</b></span></div></div><div class=\"lec-sent-ko\">그 게임에서, 사람들은 꼭대기에 있는 상품을 얻기 위해 기름칠한 기둥을 올라간다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 놀이의 구체적인 진행 방식을 묘사하여, 뒤이어 나올 협동의 필요성에 대한 물리적 근거를 제공합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">greased (과거분사): greased가 명사 poles를 수식하며, &#39;기름이 칠해진(poles)&#39;의 의미를 가짐. p.p. + N 구조로 &#39;N that is/was p.p.&#39;의 축약 형태임.</div><div class=\"lec-gr-item\">to reach (to부정사): 부사적 용법(목적)으로 쓰여 &#39;~하기 위해서&#39;라는 의미로 climb의 목적을 설명함.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">grease</td><td class=\"m\">기름을 바르다, 매끄럽게 하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만</span><span class=\"en\"><b>However,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 기둥들은</span><span class=\"en\"><b>the poles</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">정말 미끄럽고 높다</span><span class=\"en\"><b>are really slippery and tall,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그래서 가능하지 않다</span><span class=\"en\"><b>so <span class=\"grammar-hl\">it’s not possible</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들을 혼자 올라가는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">to climb</span> them alone.</b></span></div></div><div class=\"lec-sent-ko\">그러나, 그 기둥들은 매우 미끄럽고 높아서, 그것들을 혼자 올라가는 것은 가능하지 않다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> not possible to climb them alone은 기둥의 높이와 미끄러움이라는 물리적 장애물 때문에 개인의 능력만으로는 목표 달성이 어렵다는 상황을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">it’s not possible to climb (가주어): 진주어: it은 가주어로 쓰였으며, to부정사구(to climb them alone)가 진주어로서 문장의 실제 주어 역할을 함.</div><div class=\"lec-gr-item\">to climb (to부정사): 진주어로 쓰여 문장의 주어 자리에 위치함.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">slippery</td><td class=\"m\">미끄러운, 미끄러지기 쉬운</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">친구들과 가족들은</span><span class=\"en\"><b>Friends and family</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">함께 협력할 필요가 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">need to work</span> together.</b></span></div></div><div class=\"lec-sent-ko\">친구들과 가족들은 함께 협력해야 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 제시한 &#39;혼자서는 할 수 없다&#39;는 문제 상황을 해결하기 위한 필수적인 방안으로 &#39;협동&#39;을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">need to work (to부정사): 동사 need의 목적어로 쓰인 명사적 용법임.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">work together</td><td class=\"m\">협력하다, 함께 일하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은 팀을 구성한다</span><span class=\"en\"><b>They form teams</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 서로 올라가는 것을 돕는다</span><span class=\"en\"><b>and <span class=\"grammar-hl\">help each other climb</span>.</b></span></div></div><div class=\"lec-sent-ko\">그들은 팀을 이루어 서로 올라가는 것을 돕는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 &#39;힘을 합친다&#39;는 추상적인 개념을 &#39;팀 구성&#39;과 &#39;서로 돕기&#39;라는 구체적인 행동으로 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">help each other climb 5형식(SVOC) 구조: help(동사) + each other(목적어) + climb(목적보어). help는 준사역동사로 목적보어 자리에 원형부정사(climb)를 취함.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">기둥의 꼭대기에는</span><span class=\"en\"><b>At the top of the poles,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">상품들이 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">there are prizes</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자전거, 전자제품,</span><span class=\"en\"><b>like bicycles, electronics,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 설탕 봉지와 같은</span><span class=\"en\"><b>and bags of sugar.</b></span></div></div><div class=\"lec-sent-ko\">기둥의 꼭대기에는 자전거, 전자제품, 그리고 설탕 봉지와 같은 상품들이 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 사람들이 왜 고생하며 기둥을 오르는지에 대한 목적을 명시하여 놀이의 동기를 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">there are prizes (도치): 유도부사 there가 문두에 오면서 주어(prizes)와 동사(are)의 위치가 바뀐 도치 구문임.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여성들과 아이들은</span><span class=\"en\"><b>Women and children</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 친구들과 가족들을 응원한다</span><span class=\"en\"><b><span class=\"grammar-hl\">cheer for</span> their friends and family.</b></span></div></div><div class=\"lec-sent-ko\">여성들과 아이들은 그들의 친구들과 가족들을 응원한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 참가자들뿐만 아니라 주변 사람들도 응원에 참여함으로써, 놀이가 공동체 전체가 즐기는 축제의 장임을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">cheer for (관용표현): &#39;응원하다&#39;라는 뜻의 숙어로 하나의 동사구처럼 기능함.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">cheer</td><td class=\"m\">환호하다, 응원하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 신나는 일이다</span><span class=\"en\"><b><span class=\"grammar-hl\">It’s exciting</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">보는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">to see</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">누가 상품을 먼저 획득할지를</span><span class=\"en\"><b><span class=\"grammar-hl\">who will get the prizes first</span>.</b></span></div></div><div class=\"lec-sent-ko\">누가 상품을 먼저 획득할지 지켜보는 것은 신나는 일이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 참가자들의 고군분투가 관람객에게 즐거움을 주는 놀이 요소임을 설명하며 축제 분위기를 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It’s exciting (가주어): 진주어: It은 가주어, 뒤의 to부정사구(to see ~)가 진주어인 구조.</div><div class=\"lec-gr-item\">to see (to부정사): 진주어로 쓰인 명사적 용법임.</div><div class=\"lec-gr-item\">who will get the prizes first (간접의문문): 의문사(who) + 주어(who/의문사겸 주어) + 동사(will get)의 어순으로, see의 목적어 역할을 함.</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">판잣 피낭은</span><span class=\"en\"><b>Panjat Pinang</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들에게 가르친다</span><span class=\"en\"><b><span class=\"grammar-hl\">teaches people</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">중요성을</span><span class=\"en\"><b><span class=\"grammar-hl\">the importance</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">팀워크와 협동의</span><span class=\"en\"><b>of teamwork and cooperation.</b></span></div></div><div class=\"lec-sent-ko\">Panjat Pinang은 사람들에게 팀워크와 협동의 중요성을 가르친다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 놀이의 교육적 의미를 정리하며, 단순한 오락을 넘어 공동체의 가치를 확인하는 문화적 도구임을 시사합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">teaches people the importance 5형식(SVOC) 구조의 변형: 4형식(SVOO) 구조로, teach(가르치다)가 사람(IO)에게 중요성(DO)을 가르친다는 의미를 담고 있음.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">teamwork</td><td class=\"m\">팀워크, 협동</td></tr><tr><td class=\"w\">cooperation</td><td class=\"m\">협력, 협동</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 11 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 재미있는 방법이다</span><span class=\"en\"><b><span class=\"grammar-hl\">It’s a fun way</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인도네시아 독립기념일을 기념하고</span><span class=\"en\"><b><span class=\"grammar-hl\">to celebrate</span> Indonesia’s Independence Day</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">좋은 시간을 보내는</span><span class=\"en\"><b>and have a good time</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">친구와 가족과 함께</span><span class=\"en\"><b>with friends and family.</b></span></div></div><div class=\"lec-sent-ko\">그것은 인도네시아의 독립일을 기념하고 친구와 가족과 함께 좋은 시간을 보내는 재미있는 방법이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 결론으로서, 이 게임이 가진 사회적 기능과 즐거움을 통합하며 글을 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It’s a fun way (가주어): 진주어: It은 가주어, 뒤의 to부정사구(to celebrate ~ and have ~)가 진주어인 구조.</div><div class=\"lec-gr-item\">to celebrate (to부정사): 형용사적 용법으로 앞의 명사 way를 수식함.</div><div class=\"lec-gr-item\">to have (to부정사): to celebrate와 병렬 구조를 이루며, 동일하게 명사 way를 수식함.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">independence</td><td class=\"m\">독립, 자립</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>인도네시아 독립기념일에는 &#39;판잣 피낭&#39;이라는 독특한 기둥 오르기 놀이가 열린다.</li><li>기름칠 된 기둥은 혼자 오르기 불가능하여 팀을 이뤄 서로 도와야만 한다.</li><li>온 가족과 친구들이 응원하는 가운데 진행되는 이 게임은 축제 분위기를 조성한다.</li><li>이 놀이는 협동의 중요성을 일깨우고 공동체의 유대를 강화하는 의미가 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">People climb greased poles together to win prizes during Independence Day, and they learn the value of teamwork through this challenging experience.</div>\n              <div class=\"lec-final-sum-ko\">사람들은 독립기념일에 상품을 얻기 위해 기름칠한 기둥을 함께 오르며, 이 도전적인 경험을 통해 팀워크의 가치를 배운다.</div></div></div>"],"segs":[[{"audio":"./passage15_audio/1.mp3","hl":null}],[{"audio":"./passage15_audio/2.mp3","hl":null}],[{"audio":"./passage15_audio/3.mp3","hl":null},{"audio":"./passage15_audio/4.mp3","hl":"stage-0"},{"audio":"./passage15_audio/5.mp3","hl":"stage-1"},{"audio":"./passage15_audio/6.mp3","hl":"stage-2"},{"audio":"./passage15_audio/7.mp3","hl":"stage-3"}],[{"audio":"./passage15_audio/8.mp3","hl":null}],[{"audio":"./passage15_audio/9.mp3","hl":"main"},{"audio":"./passage15_audio/10.mp3","hl":"meaning"},{"audio":"./passage15_audio/11.mp3","hl":"grammar"}],[{"audio":"./passage15_audio/12.mp3","hl":"main"},{"audio":"./passage15_audio/13.mp3","hl":"meaning"},{"audio":"./passage15_audio/14.mp3","hl":"grammar"}],[{"audio":"./passage15_audio/15.mp3","hl":"main"},{"audio":"./passage15_audio/16.mp3","hl":"meaning"},{"audio":"./passage15_audio/17.mp3","hl":"grammar"}],[{"audio":"./passage15_audio/18.mp3","hl":"main"},{"audio":"./passage15_audio/19.mp3","hl":"meaning"},{"audio":"./passage15_audio/20.mp3","hl":"grammar"}],[{"audio":"./passage15_audio/21.mp3","hl":"main"},{"audio":"./passage15_audio/22.mp3","hl":"meaning"},{"audio":"./passage15_audio/23.mp3","hl":"grammar"}],[{"audio":"./passage15_audio/24.mp3","hl":"main"},{"audio":"./passage15_audio/25.mp3","hl":"meaning"},{"audio":"./passage15_audio/26.mp3","hl":"grammar"}],[{"audio":"./passage15_audio/27.mp3","hl":"main"},{"audio":"./passage15_audio/28.mp3","hl":"meaning"},{"audio":"./passage15_audio/29.mp3","hl":"grammar"}],[{"audio":"./passage15_audio/30.mp3","hl":"main"},{"audio":"./passage15_audio/31.mp3","hl":"meaning"},{"audio":"./passage15_audio/32.mp3","hl":"grammar"}],[{"audio":"./passage15_audio/33.mp3","hl":"main"},{"audio":"./passage
