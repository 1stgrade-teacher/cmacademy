</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}

lecturePlayer(document.getElementById("app"),{"brand":"청명학원 영어과","title":"리딩그라피2 리딩그라피레벨2 14번","audioDir":"audio","preview":false,"count":48,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.400em\">리딩그라피레벨2\u003cbr>14번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩그라피2\u003c/div>\u003ch1>Defending Our Planet: NASA's Successful Asteroid Experiment\u003c/h1>\u003ch2>우리 행성 지키기: NASA의 성공적인 소행성 실험\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>NASA는 \u003cb class=\"key\">DART\u003c/b> 실험을 통해 소행성 \u003cb class=\"key\">Dimorphos\u003c/b>의 궤도를 성공적으로 변경했으며, 이는 미래의 \u003cb class=\"key\">소행성 \u003c/b>\u003cb class=\"key\">충돌\u003c/b>에 대비하기 위한 중요한 성과입니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>NASA successfully demonstrated a method to protect Earth by changing an asteroid's orbit through the DART experiment.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 우주를 배경으로 한 공상 과학 영화 같은 현실 이야기를 다뤄볼 거예요. 이번 지문은 NASA가 지구를 지키기 위해 수행했던 놀라운 실험에 대한 내용입니다. NASA가 소행성의 궤도를 성공적으로 바꾸어 미래의 충돌에 대비하고 있다는 것이 글의 핵심이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">지구를 향해 다가오는 소행성을 막는 기술을 \u003cb class=\"key\">행성 \u003c/b>\u003cb class=\"key\">방위\u003c/b>(Planetary Defense)라고 합니다. 영화 '아마겟돈'처럼 소행성은 인류에게 큰 위협이 될 수 있는데, NASA는 이를 막기 위해 \u003cb class=\"key\">DART\u003c/b>(Double Asteroid Redirection Test)라는 실험을 진행했습니다. 이 실험의 핵심은 우주선을 소행성에 직접 충돌시켜 물리적인 힘으로 그 \u003cb class=\"key\">궤도\u003c/b>(orbit)를 미세하게 수정하는 것입니다. 마치 빠르게 굴러오는 축구공에 작은 \u003cb class=\"key\">탁구공\u003c/b>을 던져서 축구공의 방향을 살짝 트는 것과 비슷한 원리입니다. 이를 통해 실제 위기 상황에서 지구가 입을 피해를 미리 \u003cb class=\"key\">차단\u003c/b>할 수 있는 능력을 확인한 것입니다.\u003c/div>","segs":[{"n":2,"text":"혹시 영화에서 거대한 운석이 지구로 떨어지는 장면을 본 적 있나요? 실제로 이런 일이 일어나면 인류에게 큰 위협이 될 수 있어요. 그래서 과학자들은 행성 방위, 영어로는 Planetary Defense라는 연구를 합니다. 소행성에 우주선을 부딪혀서 그 방향을 틀어버리는 원리인데, 마치 당구 경기에서 내 공으로 상대 공을 쳐서 옆으로 밀어내는 것과 비슷하답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>도입과 호기심 유발\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>영화 속 단골 소재인 \u003cb class=\"key\">소행성 \u003c/b>\u003cb class=\"key\">충돌\u003c/b>이 현실에서도 일어날 수 있는지에 대해 \u003cb class=\"key\">질문\u003c/b>을 던지며 독자의 주의를 집중시킵니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>NASA의 실험 소개\u003csmall>예시 · 문장 4–7\u003c/small>\u003c/h4>\u003cp>2022년에 진행된 \u003cb class=\"key\">DART\u003c/b>라는 실제 실험 사례를 소개하며, 카메라가 달린 \u003cb class=\"key\">우주선\u003c/b>을 소행성에 보낸 과정을 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>실험의 성공적인 결과\u003csmall>결과 · 문장 8–9\u003c/small>\u003c/h4>\u003cp>우주선이 소행성 \u003cb class=\"key\">Dimorphos\u003c/b>에 충돌하여 성공적으로 \u003cb class=\"key\">궤도\u003c/b>를 바꾸었음을 강조하며 실험의 성과를 보여줍니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>과학자들의 견해와 대비\u003csmall>결론 · 문장 10–12\u003c/small>\u003c/h4>\u003cp>현재 충돌 가능성은 \u003cb class=\"key\">낮지만\u003c/b>, 미래의 만약의 상황에 대비해 지속적으로 \u003cb class=\"key\">연구\u003c/b>하고 준비하려는 과학자들의 자세를 언급합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 영화 같은 상상에서 시작해 실제 실험의 과정과 결과, 그리고 앞으로의 다짐까지 순서대로 보여주고 있어요.","hl":null},{"n":4,"text":"첫 번째 단계인 첫 번째 문장부터 세 번째 문장까지는 영화에서 흔히 보던 소행성 이야기가 과연 현실에서도 가능할지 질문을 던지며 시작합니다. 호기심을 확 자극하죠?","hl":"f0"},{"n":5,"text":"두 번째 단계인 네 번째 문장부터 일곱 번째 문장까지는 실제 NASA가 진행한 DART라는 실험을 구체적으로 소개합니다. 카메라를 실은 우주선을 보내서 십 개월 동안 소행성을 따라가게 한 과정을 설명하고 있어요.","hl":"f1"},{"n":6,"text":"세 번째 단계인 여덟 번째 문장과 아홉 번째 문장에서는 이 실험의 하이라이트인 충돌과 성공 소식을 전합니다. 우주선이 디모포스라는 소행성에 부딪혀서 성공적으로 궤도를 바꿨다는 아주 중요한 대목이에요.","hl":"f2"},{"n":7,"text":"마지막 단계인 열 번째 문장부터 열두 번째 문장에서는 과학자들의 결론을 말합니다. 지금 당장 위험은 낮지만, 혹시 모를 미래를 위해 계속 연구하고 대비하겠다는 의지를 보여주며 마무리됩니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">질문-답변 및 문제-해결\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 9번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">초반에 영화 속 이야기가 현실이 될 수 있는지 \u003cb class=\"key\">의문\u003c/b>을 제기한 후, NASA의 실험을 통해 해결 방안을 보여주는 구조입니다. 아홉 번째 문장에서 NASA가 \u003cb class=\"key\">소행성의 \u003c/b>\u003cb class=\"key\">궤도\u003c/b>를 성공적으로 바꾸었다는 핵심적인 \u003cb class=\"key\">실험 \u003c/b>\u003cb class=\"key\">결과\u003c/b>가 제시됩니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>But (3)\u003c/b>\u003cspan>영화와 현실의 차이 혹은 연결을 묻는 전환점\u003c/span>\u003cb>So (6)\u003c/b>\u003cspan>목표 달성을 위한 구체적인 행동 착수\u003c/span>\u003cb>However (11)\u003c/b>\u003cspan>현재의 안전함과 미래의 대비를 대조\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Asteroids\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">DART\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">spaceship\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Dimorphos\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">orbit\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Movies\u003c/th>\u003cth>Real life\u003c/th>\u003c/tr>\u003ctr>\u003ctd>흔한 이야기(common story)\u003c/td>\u003ctd>실제 일어날 수 있고 NASA가 실험함(experiment)\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 질문으로 시작해서 실험이라는 해결책을 제시하는 질문과 답변, 그리고 문제 해결 구조를 가지고 있어요. 전체적으로는 실험의 결과가 중간 이후에 확실히 드러나는 중괄식 구조라고 볼 수 있습니다.","hl":"ty"},{"n":9,"text":"세 번째 문장의 But은 영화적 상상력에서 현실의 과학으로 화제를 돌리는 신호예요. 여섯 번째 문장의 So는 목적을 위해 우주선을 만든 행동의 원인을 보여주고, 열한 번째 문장의 However는 현재 안전하지만 그래도 방심하지 않겠다는 대조의 의미를 담고 있습니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>asteroid\u003c/b>\u003cem>명사\u003c/em>\u003cspan>소행성\u003c/span>\u003c/div>\u003cdiv>\u003cb>hit\u003c/b>\u003cem>동사\u003c/em>\u003cspan>충돌하다, 치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>common\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>흔한\u003c/span>\u003c/div>\u003cdiv>\u003cb>at least\u003c/b>\u003cem>부사\u003c/em>\u003cspan>적어도\u003c/span>\u003c/div>\u003cdiv>\u003cb>once\u003c/b>\u003cem>부사\u003c/em>\u003cspan>한 번\u003c/span>\u003c/div>\u003cdiv>\u003cb>actually\u003c/b>\u003cem>부사\u003c/em>\u003cspan>실제로\u003c/span>\u003c/div>\u003cdiv>\u003cb>real life\u003c/b>\u003cem>명사\u003c/em>\u003cspan>현실, 실제 삶\u003c/span>\u003c/div>\u003cdiv>\u003cb>experiment\u003c/b>\u003cem>명사\u003c/em>\u003cspan>실험\u003c/span>\u003c/div>\u003cdiv>\u003cb>call\u003c/b>\u003cem>동사\u003c/em>\u003cspan>~라고 부르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>path\u003c/b>\u003cem>명사\u003c/em>\u003cspan>경로, 길\u003c/span>\u003c/div>\u003cdiv>\u003cb>spaceship\u003c/b>\u003cem>명사\u003c/em>\u003cspan>우주선\u003c/span>\u003c/div>\u003cdiv>\u003cb>into space\u003c/b>\u003cem>부사\u003c/em>\u003cspan>우주로\u003c/span>\u003c/div>\u003cdiv>\u003cb>follow\u003c/b>\u003cem>동사\u003c/em>\u003cspan>~을 따라가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>opportunity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기회\u003c/span>\u003c/div>\u003cdiv>\u003cb>crash\u003c/b>\u003cem>동사\u003c/em>\u003cspan>충돌하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>successfully\u003c/b>\u003cem>부사\u003c/em>\u003cspan>성공적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>orbit\u003c/b>\u003cem>명사\u003c/em>\u003cspan>궤도\u003c/span>\u003c/div>\u003cdiv>\u003cb>scientist\u003c/b>\u003cem>명사\u003c/em>\u003cspan>과학자\u003c/span>\u003c/div>\u003cdiv>\u003cb>right now\u003c/b>\u003cem>부사\u003c/em>\u003cspan>지금 당장\u003c/span>\u003c/div>\u003cdiv>\u003cb>chance\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가능성, 기회\u003c/span>\u003c/div>\u003cdiv>\u003cb>low\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>낮은\u003c/span>\u003c/div>\u003cdiv>\u003cb>study\u003c/b>\u003cem>동사\u003c/em>\u003cspan>연구하다, 공부하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>ready\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>준비가 된\u003c/span>\u003c/div>\u003cdiv>\u003cb>likely to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~할 것 같은\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"중요한 단어를 살펴볼까요? asteroid는 소행성을 뜻하고, orbit은 행성이 도는 길인 궤도를 의미합니다. experiment는 실험이라는 뜻인데, 여기서는 DART 실험을 가리키는 아주 핵심적인 단어죠.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">hit\u003c/b>\u003cspan class=\"m\">충돌하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">collide\u003c/span>\u003cspan class=\"s\">strike\u003c/span>\u003cspan class=\"s\">impact\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">avoid\u003c/span>\u003cspan class=\"a\">miss\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">path\u003c/b>\u003cspan class=\"m\">경로\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">route\u003c/span>\u003cspan class=\"s\">course\u003c/span>\u003cspan class=\"s\">way\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">successfully\u003c/b>\u003cspan class=\"m\">성공적으로\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">effectively\u003c/span>\u003cspan class=\"s\">triumphantly\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unsuccessfully\u003c/span>\u003cspan class=\"a\">failingly\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">chance\u003c/b>\u003cspan class=\"m\">가능성\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">probability\u003c/span>\u003cspan class=\"s\">likelihood\u003c/span>\u003cspan class=\"s\">possibility\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">impossibility\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">common\u003c/b>\u003cspan class=\"m\">흔한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">usual\u003c/span>\u003cspan class=\"s\">ordinary\u003c/span>\u003cspan class=\"s\">frequent\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">rare\u003c/span>\u003cspan class=\"a\">unusual\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어도 정리해 볼게요. 충돌하다는 뜻의 hit은 collide나 strike로 바꿔 쓸 수 있습니다. 궤도나 길을 뜻하는 path는 route나 course와 비슷하고요, 가능성을 뜻하는 chance는 probability나 likelihood라는 단어로도 자주 쓰이니 꼭 기억하세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">소행성이\u003c/span>\u003cspan class=\"en\">14 Asteroids\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지구에 충돌하는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">hitting \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">Earth\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">흔한 이야기이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is\u003c/span> a common story\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">영화에서\u003c/span>\u003cspan class=\"en\">in movies.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">지구에 충돌하는 소행성은 영화에서 흔한 이야기이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 대중에게 익숙한 \u003cb class=\"key\">영화 \u003c/b>\u003cb class=\"key\">소재\u003c/b>를 활용하여 \u003cb class=\"key\">소행성 \u003c/b>\u003cb class=\"key\">충돌\u003c/b>이라는 지문의 핵심 주제를 흥미롭게 도입하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재분사구의 명사 수식\u003c/span> : 명사(Asteroids) + [현재분사(v-ing) + 목적어/부사구] : \"지구에 충돌하는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주어와 동사의 수 일치\u003c/span> : 복수 명사 + 현재분사구(단수 취급될 수 있는 사건/상황) + [단수 동사(is)] : \"~이다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Asteroids, 소행성이. hitting the Earth, 지구에 충돌하는 것은. is a common story, 흔한 이야기이다. in movies, 영화에서. 이 문장 전체를 해석하면, 지구에 충돌하는 소행성은 영화에서 흔한 이야기이다.","hl":"m"},{"n":13,"text":"여러분, 영화 아마겟돈처럼 소행성이 지구로 떨어지는 장면은 우리에게 참 익숙한 영화 소재죠. 이 문장은 우리가 잘 아는 영화 이야기를 통해 소행성 충돌이라는 주제를 소개하고 있어요.","hl":"mn"},{"n":14,"text":"문법을 보면 hitting the Earth 부분이 앞에 있는 Asteroids를 꾸며주고 있어요. 이렇게 명사를 뒤에서 수식하는 현재분사구를 잘 체크해야 해요. 그리고 소행성들이라는 복수형이 보이지만, 지구에 충돌한다는 하나의 상황을 나타내기 때문에 동사는 are가 아닌 단수 동사 is를 썼다는 점에 주의하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 사람들이\u003c/span>\u003cspan class=\"en\">Many people\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것에 대해 생각해 본다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">think \u003c/span>\u003cspan class=\"tgt\">about\u003c/span> this\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">적어도 한 번은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">least \u003c/span>\u003cspan class=\"tgt\">once\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">많은 사람들이 이것에 대해 적어도 한 번은 생각해 본다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 내용을 \u003cb class=\"key\">this\u003c/b>로 받아, 소행성 충돌에 대한 공포나 호기심이 사람들의 \u003cb class=\"key\">보편적 \u003c/b>\u003cb class=\"key\">관심사\u003c/b>임을 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">자동사+전치사 (구동사)\u003c/span> : think [자동사] + about [전치사] + 명사(this) : \"~에 대해 생각하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">빈도 부사구\u003c/span> : at least [부사구: 적어도] + once [부사: 한 번] : \"적어도 한 번은\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Many people, 많은 사람들이. think about this, 이것에 대해 생각해 본다. at least once, 적어도 한 번은. 이 문장 전체를 해석하면, 많은 사람들이 이것에 대해 적어도 한 번은 생각해 본다.","hl":"m"},{"n":16,"text":"소행성 충돌이 정말 일어날까 하는 생각, 다들 한 번쯤은 해보지 않았나요? 이 문장은 독자들의 공감을 이끌어내는 역할을 합니다.","hl":"mn"},{"n":17,"text":"첫 번째로 think about은 한 세트로 기억하세요. 무엇에 대해 생각하다라고 할 때 think 뒤에 전치사 about을 꼭 써야 해요. 두 번째로 at least once는 적어도 한 번이라는 횟수를 강조하는 부사 덩어리입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만\u003c/span>\u003cspan class=\"en\">But\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 일은 단지 일어나는 것일까\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">does \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">only \u003c/span>\u003cspan class=\"tgt\">happen\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">영화에서만\u003c/span>\u003cspan class=\"en\">in movies,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아니면\u003c/span>\u003cspan class=\"en\">or\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">실제로 일어날 수 있는 일일까\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">actually \u003c/span>\u003cspan class=\"tgt\">happen\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">현실에서\u003c/span>\u003cspan class=\"en\">in real life?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 그 일은 영화에서만 일어나는 것일까, 아니면 현실에서 실제로 일어날 수 있는 일일까?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 영화 속 허구와 \u003cb class=\"key\">현실적 \u003c/b>\u003cb class=\"key\">가능성\u003c/b>을 대조하며, 이어질 내용이 \u003cb class=\"key\">과학적 \u003c/b>\u003cb class=\"key\">사실\u003c/b>에 기반한 실험임을 암시하는 \u003cb class=\"key\">전환점\u003c/b> 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">일반동사 의문문\u003c/span> : Does(조동사) + it(주어) + happen(동사원형) : \"그것이 일어나는가?\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 의문문\u003c/span> : Can(조동사) + it(주어) + happen(동사원형) : \"그것이 일어날 수 있는가?\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"But, 하지만. does it only happen, 그 일은 단지 일어나는 것일까. in movies, 영화에서만. or, 아니면. can it actually happen, 실제로 일어날 수 있는 일일까. in real life?, 현실에서. 이 문장 전체를 해석하면, 하지만 그 일은 영화에서만 일어나는 것일까, 아니면 현실에서 실제로 일어날 수 있는 일일까?","hl":"m"},{"n":19,"text":"이제 분위기가 반전되죠? 영화 속 이야기가 과연 현실에서도 가능할지 질문을 던지면서 독자의 궁금증을 자극하고 있어요.","hl":"mn"},{"n":20,"text":"이 문장은 두 개의 의문문이 연결되어 있어요. 첫 번째는 does를 사용해서 일어나는지를 묻고 있고, 두 번째는 can을 써서 일어날 수 있는지 가능성을 묻고 있죠. happen은 대표적인 자동사라서 수동태로 쓰지 않는다는 점도 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">2022년에,\u003c/span>\u003cspan class=\"en\">In 2022,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">NASA는 했습니다\u003c/span>\u003cspan class=\"en\">NASA did\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">실험 하나를\u003c/span>\u003cspan class=\"en\">an experiment\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">DART라고 불리는.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">called \u003c/span>\u003cspan class=\"tgt\">DART\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">2022년에, NASA는 DART라고 불리는 실험을 했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 본격적으로 NASA가 수행한 특정한 \u003cb class=\"key\">실험\u003c/b>을 소개하며 글의 주제가 \u003cb class=\"key\">실제 \u003c/b>\u003cb class=\"key\">사례\u003c/b>로 구체화됩니다. 실험의 고유 \u003cb class=\"key\">이름\u003c/b>인 DART를 언급하며 독자의 주의를 끕니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사의 후치 수식\u003c/span> : 명사(experiment) + [과거분사(called) + 보어(DART)] : \"DART라고 불리는\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"In 2022, 2022년에. NASA did, NASA는 했습니다. an experiment, 실험 하나를. called DART, DART라고 불리는.. 이 문장 전체를 해석하면, 2022년에, NASA는 DART라고 불리는 실험을 했다.","hl":"m"},{"n":22,"text":"네 번째 문장에서는 이 이야기가 허구가 아닌 실제 있었던 일을 바탕으로 한다는 것을 보여줍니다. 구체적인 시기와 실험의 이름인 DART를 언급하며 실제 사례를 소개하고 있죠.","hl":"mn"},{"n":23,"text":"첫 번째로 살펴볼 어법은 called DART입니다. 과거분사인 called가 앞에 있는 명사인 experiment를 뒤에서 꾸며주고 있어요. DART라고 불리는 실험이라고 해석하면 아주 정확합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">NASA는 알아보고 싶었다\u003c/span>\u003cspan class=\"en\">NASA wanted \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">see\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">소행성에 충돌하는 것이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">if \u003c/span>\u003cspan class=\"tgt\">hitting \u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">asteroid\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 궤도를 바꿀 수 있는지.\u003c/span>\u003cspan class=\"en\">could change its path.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">NASA는 소행성에 충돌해 그 궤도를 바꿀 수 있는지 알아보고 싶었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 수행한 실험의 핵심적인 \u003cb class=\"key\">목적\u003c/b>을 설명하는 문장입니다. \u003cb class=\"key\">인위적인 \u003c/b>\u003cb class=\"key\">충돌\u003c/b>을 통해 소행성의 \u003cb class=\"key\">경로\u003c/b>를 조절할 수 있는지 확인하려는 의도가 담겨 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : wanted [타동사] + [to see (to부정사구/목적어)] : \"알아보는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명사절 접속사 if\u003c/span> : see [타동사] + [if + 주어(hitting...) + 동사(could change)...] : \"소행성에 충돌하는 것이 ~인지\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"NASA wanted to see, NASA는 알아보고 싶었다. if hitting an asteroid, 소행성에 충돌하는 것이. could change its path, 그 궤도를 바꿀 수 있는지.. 이 문장 전체를 해석하면, NASA는 소행성에 충돌해 그 궤도를 바꿀 수 있는지 알아보고 싶었다.","hl":"m"},{"n":25,"text":"다섯 번째 문장은 DART 실험을 왜 했는지 그 목적을 알려줍니다. 소행성에 일부러 부딪쳐서 그 움직이는 경로를 바꿀 수 있는지 테스트해보고 싶었던 것이죠.","hl":"mn"},{"n":26,"text":"여기서 첫 번째 어법 포인트는 to see입니다. 동사 wanted의 목적어 역할을 하는 to부정사의 명사적 용법이에요. 두 번째는 if인데요, 여기서는 만약이 아니라 ~인지 아닌지라는 뜻의 접속사로 쓰였습니다. if절 안의 주어인 hitting은 동명사로 충돌하는 것이라고 해석하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서 그들은 우주선을 만들었다\u003c/span>\u003cspan class=\"en\">So they built a spaceship\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">카메라가 달린\u003c/span>\u003cspan class=\"en\">with a camera\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그것을 우주로 보냈다.\u003c/span>\u003cspan class=\"en\">and sent it into space.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그래서 그들은 카메라가 달린 우주선을 만들어 우주로 보냈다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 실험을 실행에 옮기는 첫 단계인 \u003cb class=\"key\">우주선\u003c/b> 제작과 \u003cb class=\"key\">발사\u003c/b> 과정을 보여줍니다. 목적을 달성하기 위해 장비를 준비하고 임무를 시작하는 단계입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">동사의 병렬 구조\u003c/span> : 주어(they) + 동사1(built) + ... + 접속사(and) + 동사2(sent) : \"만들었고 ... 보냈다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"So they built a spaceship, 그래서 그들은 우주선을 만들었다. with a camera, 카메라가 달린. and sent it into space, 그리고 그것을 우주로 보냈다.. 이 문장 전체를 해석하면, 그래서 그들은 카메라가 달린 우주선을 만들어 우주로 보냈다.","hl":"m"},{"n":28,"text":"여섯 번째 문장에서는 실험을 위해 실제로 행동한 내용을 설명합니다. 우주선을 만들어서 관찰을 위한 카메라를 달고 실제 우주로 쏘아 올린 과정이죠.","hl":"mn"},{"n":29,"text":"이 문장에서는 동사 두 개가 and로 묶인 병렬 구조를 확인해야 합니다. 과거형 동사인 built와 sent가 나란히 쓰여서 우주선을 만들고 보냈다는 두 가지 동작을 차례대로 설명하고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 우주선은\u003c/span>\u003cspan class=\"en\">The spaceship\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 소행성을 따라다녔다\u003c/span>\u003cspan class=\"en\">followed an asteroid\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Dimorphos라는 이름의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">named \u003c/span>\u003cspan class=\"tgt\">Dimorphos\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">10개월 동안\u003c/span>\u003cspan class=\"en\">for 10 months.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 우주선은 Dimorphos라는 이름의 소행성을 10개월 동안 따라다녔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> DART 탐사선이 목표물인 Dimorphos에 접근하여 장기간 \u003cb class=\"key\">추적\u003c/b> 및 관찰을 수행했음을 나타냅니다. 충돌 전 충분한 \u003cb class=\"key\">데이터 \u003c/b>\u003cb class=\"key\">수집\u003c/b> 과정을 거쳤음을 보여주는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사의 후치 수식\u003c/span> : noun (asteroid) + [past participle (named) + complement] : \"Dimorphos라고 이름 붙여진\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"The spaceship, 그 우주선은. followed an asteroid, 한 소행성을 따라다녔다. named Dimorphos, Dimorphos라는 이름의. for 10 months, 10개월 동안. 이 문장 전체를 해석하면, 그 우주선은 Dimorphos라는 이름의 소행성을 10개월 동안 따라다녔다.","hl":"m"},{"n":31,"text":"우주선이 Dimorphos라는 소행성을 십 개월이라는 긴 시간 동안 끈기 있게 추적했다는 내용이에요. 본격적인 충돌 실험을 하기 전의 준비 단계를 설명하고 있죠.","hl":"mn"},{"n":32,"text":"여기서 핵심은 named Dimorphos 부분이에요. 과거분사가 앞에 있는 명사 asteroid를 뒤에서 꾸며주고 있어요. 소행성 입장에서는 이름이 지어진 수동의 관계니까 과거분사 형태를 썼다는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우주선이\u003c/span>\u003cspan class=\"en\">When the spaceship\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기회를 얻었을 때,\u003c/span>\u003cspan class=\"en\">had the opportunity,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Dimorphos와 충돌했고,\u003c/span>\u003cspan class=\"en\">it crashed into Dimorphos\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매우 빠르게\u003c/span>\u003cspan class=\"en\">very fast\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 소행성의 경로를 바꿨다.\u003c/span>\u003cspan class=\"en\">and changed its path.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우주선이 기회를 얻었을 때, Dimorphos와 매우 빠르게 충돌했고, 그 소행성의 경로를 바꿨다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 실험의 핵심 과정인 \u003cb class=\"key\">충돌\u003c/b>과 그로 인한 \u003cb class=\"key\">결과\u003c/b>를 시간 순서대로 묘사합니다. 우주선이 소행성의 물리적 \u003cb class=\"key\">이동 \u003c/b>\u003cb class=\"key\">경로\u003c/b>를 바꾸는 데 성공했음을 시사합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">동사의 병렬 구조\u003c/span> : subject (it) + [verb 1 (crashed)] + and + [verb 2 (changed)] : \"충돌했고 그리고 바꾸었다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"When the spaceship, 우주선이. had the opportunity, 기회를 얻었을 때. it crashed into Dimorphos, Dimorphos와 충돌했고. very fast, 매우 빠르게. and changed its path, 그 소행성의 경로를 바꿨다.. 이 문장 전체를 해석하면, 우주선이 기회를 얻었을 때, Dimorphos와 매우 빠르게 충돌했고, 그 소행성의 경로를 바꿨다.","hl":"m"},{"n":34,"text":"우주선이 마침내 기회를 포착해서 아주 빠른 속도로 소행성에 부딪혔고, 결국 그 방향을 틀어버렸다는 긴박한 상황을 묘사하고 있어요.","hl":"mn"},{"n":35,"text":"첫 번째로 접속사 and를 잘 보세요. crashed와 changed라는 두 과거 동사를 나란히 연결하는 병렬 구조예요. 두 번째로 it은 앞에 나온 the spaceship을 가리키는 대명사로 쓰였어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">NASA는 성공적으로 바꾸었다 한 소행성의 궤도를!\u003c/span>\u003cspan class=\"en\">NASA \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">successfully \u003c/span>\u003cspan class=\"tgt\">changed\u003c/span> the **orbit of an asteroid!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">NASA는 성공적으로 한 소행성의 궤도를 바꾸었다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 실험의 궁극적인 성취인 \u003cb class=\"key\">인위적 \u003c/b>\u003cb class=\"key\">궤도 \u003c/b>\u003cb class=\"key\">변경\u003c/b> 성공을 선언합니다. 인류가 소행성 충돌로부터 지구를 지킬 \u003cb class=\"key\">기술적 \u003c/b>\u003cb class=\"key\">증명\u003c/b>을 해냈다는 뜻입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부사의 동사 수식\u003c/span> : [adverb (successfully)] + [verb (changed)] : \"성공적으로 바꾸었다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"NASA successfully changed, NASA는 성공적으로 바꾸었다. the orbit of an asteroid!, 한 소행성의 궤도를!. 이 문장 전체를 해석하면, NASA는 성공적으로 한 소행성의 궤도를 바꾸었다!","hl":"m"},{"n":37,"text":"결과적으로 NASA가 소행성의 궤도를 바꾸는 데 완전히 성공했다는 최종적인 결과를 선언하며 마무리하는 문장이에요.","hl":"mn"},{"n":38,"text":"successfully라는 부사가 뒤에 나오는 동사 changed를 아주 강력하게 꾸며주고 있어요. 단순히 바꾼 게 아니라 성공적으로 해냈다는 점을 강조하는 부사의 동사 수식 구조를 눈여겨보세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">과학자들은 말한다\u003c/span>\u003cspan class=\"en\">Scientists \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">say \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지금 당장은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> right now,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">소행성이 지구에 충돌할 가능성이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">chance \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">asteroid \u003c/span>\u003cspan class=\"tgt\">hitting\u003c/span> the Earth\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매우 낮다고.\u003c/span>\u003cspan class=\"en\">is very low.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">과학자들은 소행성이 지구에 충돌할 가능성이 지금 당장은 매우 낮다고 말한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞선 NASA의 실험 성공 소식에 이어, 현재 실제 소행성 충돌 위험은 \u003cb class=\"key\">매우 \u003c/b>\u003cb class=\"key\">낮은 \u003c/b>\u003cb class=\"key\">수준\u003c/b>임을 밝혀 독자의 막연한 공포감을 \u003cb class=\"key\">해소\u003c/b>해 주는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that\u003c/span> : say [타동사] + that [명사절 접속사] + S + V : \"~라고 말한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사의 의미상 주어\u003c/span> : of [전치사] + an asteroid [의미상 주어] + hitting [동명사] : \"소행성이 충돌할 가능성\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"Scientists say, 과학자들은 말한다. that right now, 지금 당장은. the chance of an asteroid hitting the Earth, 소행성이 지구에 충돌할 가능성이. is very low, 매우 낮다고.. 이 문장 전체를 해석하면, 과학자들은 소행성이 지구에 충돌할 가능성이 지금 당장은 매우 낮다고 말한다.","hl":"m"},{"n":40,"text":"NASA가 소행성 궤도 변경에 성공했다는 내용 뒤에, 실제 충돌 위험은 매우 낮은 수준이라며 독자들을 안심시켜 주는 부분이에요.","hl":"mn"},{"n":41,"text":"첫 번째로 say 뒤에 나오는 that은 명사절을 이끄는 접속사예요. 뒤에 주어와 동사가 있는 완전한 문장이 따라오죠. 두 번째로 of라는 전치사 뒤에 hitting이라는 동명사가 왔는데 그 앞에 an asteroid를 써서 소행성이 충돌한다는 의미상 주어 관계를 보여주고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">However\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 여전히 연구하고 있다\u003c/span>\u003cspan class=\"en\">they \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">still \u003c/span>\u003cspan class=\"tgt\">studying\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">소행성을.\u003c/span>\u003cspan class=\"en\">asteroids.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만, 그들은 여전히 소행성을 연구하고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 충돌 확률이 낮음에도 불구하고 만일의 사태에 대비하여 \u003cb class=\"key\">지속적인 \u003c/b>\u003cb class=\"key\">연구\u003c/b>가 이루어지고 있다는 \u003cb class=\"key\">내용의 \u003c/b>\u003cb class=\"key\">전환\u003c/b>을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">역접의 연결부사\u003c/span> : However [연결부사], S + V : \"하지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재진행형\u003c/span> : be [현재형] + still [부사] + -ing [현재분사] : \"여전히 연구하고 있다\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"However, 하지만. they are still studying, 그들은 여전히 연구하고 있다. asteroids, 소행성을.. 이 문장 전체를 해석하면, 하지만, 그들은 여전히 소행성을 연구하고 있다.","hl":"m"},{"n":43,"text":"위험이 낮다고 해서 방심하지 않고 과학자들이 계속해서 연구를 이어가고 있다는 반전의 내용을 담고 있죠.","hl":"mn"},{"n":44,"text":"첫 번째로 However는 앞 문장과 반대되는 이야기를 시작할 때 쓰는 연결어예요. 문장의 흐름을 바꾸는 중요한 역할을 하죠. 두 번째로 are still studying은 현재진행형 시제로 지금도 연구가 계속 진행 중이라는 점을 강조하고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 원한다\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">want \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">소행성에 대비하기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">ready\u003c/span> for asteroids,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아무 일도 일어나지 않을 것 같아도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">even \u003c/span>\u003cspan class=\"tgt\">if\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 소행성에 대비하기를 원하는 것이다!\u003c/span>\u003cspan class=\"en\">nothing is likely to happen!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">아무 일도 일어나지 않을 것 같아도 그들은 소행성에 대비하기를 원하는 것이다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 발생 가능성이 희박하더라도 최선의 \u003cb class=\"key\">대응 \u003c/b>\u003cb class=\"key\">태세\u003c/b>를 갖추려는 과학자들의 \u003cb class=\"key\">책임 \u003c/b>\u003cb class=\"key\">의식\u003c/b>을 강조하며 글을 맺습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법\u003c/span> : want [타동사] + to be [to부정사/목적어] : \"준비되기를 원한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">양보의 접속사\u003c/span> : even if [접속사] + S + V : \"비록 ~일지라도\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">형용사적 관용 표현\u003c/span> : be likely to + [동사원형] : \"~할 것 같다\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"They want, 그들은 원한다. to be ready for asteroids, 소행성에 대비하기를. even if, 아무 일도 일어나지 않을 것 같아도. nothing is likely to happen!, 그들은 소행성에 대비하기를 원하는 것이다!. 이 문장 전체를 해석하면, 아무 일도 일어나지 않을 것 같아도 그들은 소행성에 대비하기를 원하는 것이다!","hl":"m"},{"n":46,"text":"아무 사고가 없을 것 같아도 미리 철저한 대비를 하겠다는 과학자들의 책임감을 보여줘요. 완벽한 준비 태세를 갖추겠다는 의지의 표현이죠.","hl":"mn"},{"n":47,"text":"첫 번째로 want 뒤에는 to부정사가 목적어로 와서 미래의 계획을 나타내요. 두 번째로 even if는 설령 어떤 일이 생기지 않더라도라는 양보의 뜻을 나타내는 접속사예요. 세 번째로 be likely to는 무엇을 할 것 같다는 가능성을 말할 때 자주 쓰는 표현이니까 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>영화에서 자주 보이는 \u003cb class=\"key\">소행성 \u003c/b>\u003cb class=\"key\">충돌\u003c/b>이 현실에서 일어날 수 있는지에 대한 의문을 제기함\u003c/li>\u003cli>NASA는 2022년에 소행성 궤도를 바꾸기 위한 \u003cb class=\"key\">DART \u003c/b>\u003cb class=\"key\">실험\u003c/b>을 진행하여 우주선을 발사함\u003c/li>\u003cli>우주선이 소행성 \u003cb class=\"key\">Dimorphos\u003c/b>에 충돌하여 궤도를 성공적으로 변경하는 데 \u003cb class=\"key\">성공함\u003c/b>\u003c/li>\u003cli>현재 충돌 위험은 낮지만, 미래의 위협에 대비해 과학자들은 지속적인 \u003cb class=\"key\">연구와 \u003c/b>\u003cb class=\"key\">준비\u003c/b>를 이어가고 있음\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>NASA successfully demonstrated a method to protect Earth by changing an asteroid's orbit through the DART experiment.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">NASA는 \u003cb class=\"key\">DART\u003c/b> 실험을 통해 소행성 \u003cb class=\"key\">Dimorphos\u003c/b>의 궤도를 성공적으로 변경했으며, 이는 미래의 \u003cb class=\"key\">소행성 \u003c/b>\u003cb class=\"key\">충돌\u003c/b>에 대비하기 위한 중요한 성과입니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":48,"text":"자, 오늘은 NASA의 멋진 도전과 성공에 대해 배워봤습니다. 지문에 나온 Dimorphos나 orbit 같은 단어들을 잘 정리해 두세요. 비록 지금은 안전하더라도 미리 준비하는 과학자들의 태도가 인상 깊은 글이었습니다. 다음 시간에 더 재미있는 지문으로 만나요!","hl":null}]}]});</script></body></html>
