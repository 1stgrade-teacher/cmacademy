PbP6DHGKkmz2/pX5dV5vQCfbsPywMe/br3zx3pcYIAwTwc8kA54z045B/Smh1APzAE8dRjH+f6Y70hcAZJBPAHI5Ix+Z9evXpRZPZ6O2tm+3Tomtut90i02lpv+bfLvfsml99mtxxByW55xn0B/wPBHYZ4924zk9uQfc/X19uv5cOLADGRwR3Hv3/H6ZJI4HDSQM8jgdiP/AK//AOvtQK7tZLXTr093/Nel7aXbHdRjtnP48YJ6/kP1pr5KHB6KcDP5n8T2PtnilyP7wwff09fp1/Ghvlzg54OOOowSfXHHXJ+nQmqi7Wdk0+6eqdr+q6266rS6JSb6O22/p6vTTp002P/Z\" alt=\"\"></div>","<div class=\"lec-cover-title\">NASA’s DART Experiment: Successfully Redirecting Asteroids to Protect Earth<small>NASA의 DART 실험: 지구를 보호하기 위한 소행성 궤도 수정의 성공</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">지문을 읽기 전, 먼저 행성 방어(Planetary Defense)라는 개념을 알면 내용이 훨씬 쉽게 이해되실 거예요. 이는 지구로 다가오는 소행성이나 혜성과 같은 근지구 천체(Near-Earth Object, NEO)로부터 인류의 안전을 지키기 위한 모든 노력을 의미하는데요, 마치 영화 속 이야기가 아니라 실제로 일어날 수 있는 위협에 대비해 전 세계 과학자들이 모여 궤도(Orbit)를 수정하는 방법을 연구하고 있답니다. 이번 지문에 등장하는 다트(DART) 임무는 운동 충격체(Kinetic Impactor) 방식, 즉 아주 빠른 속도로 우주선을 소행성에 충돌시켜 경로를 살짝 비트는 전략을 실제로 증명해 낸 역사적인 사건이에요. 마치 당구공을 쳐서 경로를 바꾸는 것처럼, 아주 작은 궤도 변화만으로도 지구를 향하던 소행성을 빗나가게 할 수 있다는 사실이 과학적으로 입증된 셈이죠. 이처럼 우주적 재난을 예방하려는 최첨단 과학 기술의 원리를 이해하고 지문을 읽어보시면, NASA의 실험이 인류에게 얼마나 중요한 의미인지 더 깊이 공감하실 수 있을 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01도입</div><ul><li>지구와 소행성의 충돌 가능성에 대한 대중의 궁금증을 언급한다.</li><li>영화 속 단골 소재인 소행성 충돌</li><li>실제 현실에서의 발생 가능성에 대한 의문</li><li>핵심 키워드: 소행성(asteroid), 충돌(hitting)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02DART 실험의 수행</div><ul><li>NASA는 소행성의 궤도를 인위적으로 변경할 수 있는지 확인하는 실험을 진행했다.</li><li>2022년 NASA의 DART 실험(experiment) 실시</li><li>우주선(spaceship)을 소행성 디모르포스(Dimorphos)로 발사</li><li>소행성의 경로를 변경하려는 목적</li><li>핵심 키워드: 우주선(spaceship), 경로(path)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03실험의 성공</div><ul><li>우주선이 소행성과 충돌하여 궤도를 성공적으로 변화시켰다.</li><li>10개월간의 추적 후 고속으로 충돌</li><li>소행성의 궤도(orbit) 변경 확인</li><li>NASA의 기술적 성과 증명</li><li>핵심 키워드: 궤도(orbit), 충돌(crashed)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04향후 전망 및 결론</div><ul><li>현재 소행성 충돌 확률은 낮으나 지속적인 연구를 이어가고 있다.</li><li>지구 충돌 가능성은 매우 낮음(low)</li><li>만약의 사태를 대비한 지속적인 연구(studying)</li><li>잠재적 위험에 대한 철저한 준비</li><li>핵심 키워드: 과학자(scientists), 확률(chance)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">at least</td><td class=\"m\">적어도, 최소한</td></tr><tr><td class=\"w\">in real life</td><td class=\"m\">현실에서, 실생활에서</td></tr><tr><td class=\"w\">experiment</td><td class=\"m\">실험, 시도</td></tr><tr><td class=\"w\">change</td><td class=\"m\">바꾸다, 변화시키다</td></tr><tr><td class=\"w\">path</td><td class=\"m\">경로, 진로</td></tr><tr><td class=\"w\">follow</td><td class=\"m\">따라가다, 뒤를 잇다</td></tr><tr><td class=\"w\">opportunity</td><td class=\"m\">기회, 계기</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">crash into</td><td class=\"m\">~에 충돌하다, ~와 부딪치다</td></tr><tr><td class=\"w\">successfully</td><td class=\"m\">성공적으로, 무사히</td></tr><tr><td class=\"w\">orbit</td><td class=\"m\">궤도, 영향권</td></tr><tr><td class=\"w\">right now</td><td class=\"m\">당장, 현재</td></tr><tr><td class=\"w\">chance</td><td class=\"m\">가능성, 확률</td></tr><tr><td class=\"w\">low</td><td class=\"m\">낮은, 적은</td></tr><tr><td class=\"w\">be likely to</td><td class=\"m\">~할 가능성이 있다, ~하기 쉽다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">지구에 충돌하는 소행성은</span><span class=\"en\"><b><span class=\"grammar-hl\">Asteroids hitting the Earth</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">흔한 이야기이다</span><span class=\"en\"><b>is a common story</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">영화에서</span><span class=\"en\"><b>in movies.</b></span></div></div><div class=\"lec-sent-ko\">지구에 충돌하는 소행성은 영화에서 흔한 이야기이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 소행성 충돌이라는 소재를 대중적인 영화적 상상력으로 연결하며 글의 화두를 던지는 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Asteroids hitting the Earth (동명사): -ing가 주어 역할을 하는 동명사구로, &#39;소행성이 지구와 충돌하는 것&#39;이라는 명사적 개념의 주어부이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">많은 사람들은</span><span class=\"en\"><b>Many people</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이것에 대해 생각한다</span><span class=\"en\"><b><span class=\"grammar-hl\">think about</span> this</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">적어도 한 번은</span><span class=\"en\"><b>at least once.</b></span></div></div><div class=\"lec-sent-ko\">많은 사람들이 이것에 대해 적어도 한 번은 생각해 본다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급된 영화 속 이야기가 우리에게 친숙한 상상임을 강조하며, 독자의 공감을 유도하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">think about (관용표현): &#39;~에 대해 생각하다&#39;라는 의미의 숙어적 표현이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">at least</td><td class=\"m\">적어도, 최소한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만 그것은 오직 일어나는가</span><span class=\"en\"><b>But <span class=\"grammar-hl\">does it only happen</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">영화에서,</span><span class=\"en\"><b>in movies,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아니면 그것이 실제로 일어날 수 있는가</span><span class=\"en\"><b>or can it actually happen</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">현실에서?</span><span class=\"en\"><b>in real life?</b></span></div></div><div class=\"lec-sent-ko\">하지만 그 일은 영화에서만 일어나는 것일까, 아니면 현실에서 실제로 일어날 수 있는 일일까?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 영화적 상상과 현실의 가능성을 대비시키며 글의 핵심 논점으로 넘어가는 전환 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">does it only happen (의문문): 조동사 do를 문장 맨 앞에 배치하여 의문문을 구성한 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">in real life</td><td class=\"m\">현실에서, 실생활에서</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">2022년에,</span><span class=\"en\"><b>In 2022,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">NASA는 실험을 했다</span><span class=\"en\"><b>NASA did an experiment</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">DART라고 불리는</span><span class=\"en\"><b><span class=\"grammar-hl\">called DART</span>.</b></span></div></div><div class=\"lec-sent-ko\">2022년에, NASA는 DART라고 불리는 실험을 했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 질문에 대한 구체적인 답변을 제시하기 위해, 현실에서 실제로 수행된 과학적 사례를 소개하는 도입부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">called DART (과거분사(형용사)): called가 앞의 명사 an experiment를 수식한다. &#39;DART라고 불리는 실험&#39;이라는 의미로, (an experiment) that is called DART와 같이 관계절이 축약된 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">experiment</td><td class=\"m\">실험, 시도</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">NASA는 알아보고 싶었다</span><span class=\"en\"><b>NASA wanted <span class=\"grammar-hl\">to see</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">소행성을 치는 것이</span><span class=\"en\"><b>if <span class=\"grammar-hl\">hitting an asteroid</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 경로를 바꿀 수 있는지를</span><span class=\"en\"><b>could change its path.</b></span></div></div><div class=\"lec-sent-ko\">NASA는 소행성에 충돌해 그 궤도를 바꿀 수 있는지 알아보고 싶었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 실험의 목적을 구체적으로 밝히며, 소행성 충돌이라는 위험을 막으려는 인간의 노력을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to see (to부정사): 동사 want의 목적어 역할을 하는 명사적 용법의 to부정사이다.</div><div class=\"lec-gr-item\">hitting an asteroid (동명사): if절 내부에서 주어 역할을 하는 동명사구로, &#39;소행성을 때리는 것&#39;이라는 행위적 개념이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">change</td><td class=\"m\">바꾸다, 변화시키다</td></tr><tr><td class=\"w\">path</td><td class=\"m\">경로, 진로</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그래서 그들은 우주선을 만들었다</span><span class=\"en\"><b>So they <span class=\"grammar-hl\">built</span> a spaceship</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">카메라를 가진</span><span class=\"en\"><b>with a camera</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그것을 보냈다</span><span class=\"en\"><b>and sent it</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우주로</span><span class=\"en\"><b>into space.</b></span></div></div><div class=\"lec-sent-ko\">그래서 그들은 카메라가 달린 우주선을 만들어 우주로 보냈다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 실험을 위해 필요한 기술적 수단을 마련하고 실행에 옮기는 과정을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">built 5형식(SVOC) 구조와 관련된 타동사로, 문맥상 무엇을 만들었는지 목적어를 취하는 기본 구조(build + O)를 가진다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 우주선은 소행성을 따라갔다</span><span class=\"en\"><b>The spaceship followed an asteroid</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Dimorphos라는 이름의</span><span class=\"en\"><b><span class=\"grammar-hl\">named Dimorphos</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">10개월 동안</span><span class=\"en\"><b>for 10 months.</b></span></div></div><div class=\"lec-sent-ko\">그 우주선은 Dimorphos라는 이름의 소행성을 10개월 동안 따라다녔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 실험이 갑작스러운 우연이 아니라 오랜 기간 치밀하게 준비된 추적 과정임을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">named Dimorphos (과거분사(형용사)): named가 앞의 명사 an asteroid를 수식한다. &#39;Dimorphos라고 명명된 소행성&#39;이라는 의미로, (an asteroid) that is named Dimorphos와 같이 관계절이 축약된 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">follow</td><td class=\"m\">따라가다, 뒤를 잇다</td></tr><tr><td class=\"w\">low</td><td class=\"m\">낮은, 적은</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우주선이 기회를 가졌을 때,</span><span class=\"en\"><b><span class=\"grammar-hl\">When the spaceship had the opportunity</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 Dimorphos와 충돌했다</span><span class=\"en\"><b>it crashed into Dimorphos</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매우 빠르게</span><span class=\"en\"><b>very fast</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그 경로를 바꿨다</span><span class=\"en\"><b>and changed its path.</b></span></div></div><div class=\"lec-sent-ko\">우주선이 기회를 얻었을 때, Dimorphos와 매우 빠르게 충돌했고, 그 소행성의 경로를 바꿨다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> crashed into는 단순히 부딪히는 것을 넘어 우주선이 지닌 운동 에너지를 소행성에 전달해 이동 방향을 틀어버리는 극적인 순간을 묘사합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">When the spaceship had the opportunity (분사구문(대조군)): 원문은 절(When + S + V)의 형태이며, 문장 전체의 시간을 나타내는 부사절이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">change</td><td class=\"m\">바꾸다, 변화시키다</td></tr><tr><td class=\"w\">path</td><td class=\"m\">경로, 진로</td></tr><tr><td class=\"w\">opportunity</td><td class=\"m\">기회, 계기</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">NASA는 성공적으로 바꿨다</span><span class=\"en\"><b>NASA successfully changed</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한 소행성의 궤도를!</span><span class=\"en\"><b>the <span class=\"grammar-hl\">orbit of an asteroid</span>!</b></span></div></div><div class=\"lec-sent-ko\">NASA는 성공적으로 한 소행성의 궤도를 바꾸었다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 실험의 결과를 최종적으로 확인하며, 인류가 기술적으로 소행성을 통제할 수 있는 가능성을 입증했음을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">orbit of an asteroid (관용표현): &#39;소행성의 궤도&#39;라는 의미의 명사구이며, orbit 뒤에 전치사 of를 사용하는 관용적 결합이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">change</td><td class=\"m\">바꾸다, 변화시키다</td></tr><tr><td class=\"w\">successfully</td><td class=\"m\">성공적으로, 무사히</td></tr><tr><td class=\"w\">orbit</td><td class=\"m\">궤도, 영향권</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">과학자들은 말한다</span><span class=\"en\"><b>Scientists say</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지금 당장은,</span><span class=\"en\"><b><span class=\"grammar-hl\">that right now,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지구가 소행성과 충돌할 가능성이</span><span class=\"en\"><b><span class=\"grammar-hl\">the chance of an asteroid hitting the Earth</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매우 낮다고</span><span class=\"en\"><b><span class=\"grammar-hl\">is very low</span>.</b></span></div></div><div class=\"lec-sent-ko\">과학자들은 소행성이 지구에 충돌할 가능성이 지금 당장은 매우 낮다고 말한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 실험 성공으로 독자가 느낄 수 있는 불안감을 해소하며 과학적인 현 상황을 객관적으로 진단합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that right now, the chance of an asteroid hitting the Earth is very low 동격의 that: the chance라는 명사 뒤에서 that절이 그 가능성의 구체적인 내용(&#39;소행성이 지구를 충돌할 가능성&#39;)을 설명해 주는 동격 구조이다.</div><div class=\"lec-gr-item\">hitting the Earth (현재분사(형용사)): an asteroid를 수식하며, 소행성이 지구를 충돌하는 &#39;동작&#39;을 나타내는 현재분사구이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">right now</td><td class=\"m\">당장, 현재</td></tr><tr><td class=\"w\">chance</td><td class=\"m\">가능성, 확률</td></tr><tr><td class=\"w\">low</td><td class=\"m\">낮은, 적은</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 11 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만,</span><span class=\"en\"><b>However,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 여전히 연구하고 있다</span><span class=\"en\"><b>they <span class=\"grammar-hl\">are still studying</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">소행성을</span><span class=\"en\"><b>asteroids.</b></span></div></div><div class=\"lec-sent-ko\">하지만, 그들은 여전히 소행성을 연구하고 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 가능성이 낮음에도 연구를 멈추지 않는 이유를 설명하기 위해 전환을 꾀합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are still studying (현재진행): be동사(are) + -ing(studying) 형태로, 소행성을 연구하는 동작이 현재 지속되고 있음을 나타낸다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 12 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은</span><span class=\"en\"><b>They</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">소행성에 대비하기를 원하는데</span><span class=\"en\"><b>want <span class=\"grammar-hl\">to be ready for</span> asteroids,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아무 일도 일어나지 않을 것 같아도.</span><span class=\"en\"><b><span class=\"grammar-hl\">even if nothing is likely to happen</span>!</b></span></div></div><div class=\"lec-sent-ko\">아무 일도 일어나지 않을 것 같아도 그들은 소행성에 대비하기를 원하는 것이다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> be ready for는 만일의 사태에 대비해 기술적 안전장치를 마련해두는 과학계의 책임감 있는 태도를 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to be ready for (to부정사): 형용사 ready를 수식하는 부사적 용법의 to부정사이다.</div><div class=\"lec-gr-item\">even if nothing is likely to happen (관용표현): be likely to V(~할 것 같다)라는 구문이 사용된 형태이다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>소행성 충돌은 영화 속 단골 소재지만, 현실에서도 실현 가능한 위협이다.</li><li>NASA는 DART 실험을 통해 우주선 충돌로 소행성 궤도를 바꾸는 데 성공했다.</li><li>현재 지구 충돌 확률은 낮지만, 과학자들은 만약의 사태를 위해 연구를 지속하고 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">NASA successfully altered the orbit of an asteroid through the DART experiment, and they continue to conduct research to ensure preparedness for potential future impacts.</div>\n              <div class=\"lec-final-sum-ko\">NASA는 DART 실험을 통해 소행성의 궤도를 성공적으로 변경했으며, 향후 발생할 수 있는 충돌에 대비하기 위해 지속적인 연구를 수행하고 있다.</div></div></div>"],"segs":[[{"audio":"./passage14_audio/1.mp3","hl":null}],[{"audio":"./passage14_audio/2.mp3","hl":null}],[{"audio":"./passage14_audio/3.mp3","hl":null},{"audio":"./passage14_audio/4.mp3","hl":"stage-0"},{"audio":"./passage14_audio/5.mp3","hl":"stage-1"},{"audio":"./passage14_audio/6.mp3","hl":"stage-2"},{"audio":"./passage14_audio/7.mp3","hl":"stage-3"}],[{"audio":"./passage14_audio/8.mp3","hl":null}],[{"audio":"./passage14_audio/9.mp3","hl":"main"},{"audio":"./passage14_audio/10.mp3","hl":"meaning"},{"audio":"./passage14_audio/11.mp3","hl":"grammar"}],[{"audio":"./passage14_audio/12.mp3","hl":"main"},{"audio":"./passage14_audio/13.mp3","hl":"meaning"},{"audio":"./passage14_audio/14.mp3","hl":"grammar"}],[{"audio":"./passage14_audio/15.mp3","hl":"main"},{"audio":"./passage14_audio/16.mp3","hl":"meaning"},{"audio":"./passage14_audio/17.mp3","hl":"grammar"}],[{"audio":"./passage14_audio/18.mp3","hl":"main"},{"audio":"./passage14_audio/19.mp3","hl":"meaning"},{"audio":"./passage14_audio/20.mp3","hl":"grammar"}],[{"audio":"./passage14_audio/21.mp3","hl":"main"},{"audio":"./passage14_audio/22.mp3","hl":"meaning"},{"audio":"./passage14_audio/23.mp3","hl":"grammar"}],[{
