</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}

    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}

  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}

}
lecturePlayer(document.getElementById("app"),{"brand":"청명학원 영어과","title":"리딩그라피2 리딩그라피레벨2 9번","audioDir":"audio","preview":false,"count":51,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.400em\">리딩그라피레벨2\u003cbr>9번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩그라피2\u003c/div>\u003ch1>The Genetic Blueprint of Rhythm and Dance\u003c/h1>\u003ch2>리듬과 춤의 유전적 설계도\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>우리의 \u003cb class=\"key\">춤 \u003c/b>\u003cb class=\"key\">솜씨\u003c/b>와 \u003cb class=\"key\">리듬 \u003c/b>\u003cb class=\"key\">감각\u003c/b>은 수백 개의 \u003cb class=\"key\">유전자\u003c/b>에 의해 결정되며, 이는 단순한 취미를 넘어 \u003cb class=\"key\">일상적인 \u003c/b>\u003cb class=\"key\">활동\u003c/b>과도 깊이 연관되어 있습니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Our ability to sense rhythm and dance is fundamentally rooted in our genetic makeup, influencing both musicality and daily life activities.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분! 오늘은 우리가 왜 춤을 추고 리듬을 타는지, 그 비밀을 밝혀주는 아주 흥미로운 지문을 함께 공부해보겠습니다. 이 글은 우리의 춤 실력이 단순한 노력이 아니라 유전자에 새겨진 결과라는 점을 설명하고 있어요. 요약하자면 우리의 리듬 감각은 유전적 유산이며 일상 활동 전반에 영향을 미친다는 내용입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">우리가 음악에 맞춰 몸을 흔드는 행위는 단순한 즐거움을 넘어 생물학적인 근거를 가지고 있습니다. 과학적으로 리듬을 타는 능력은 우리 몸의 \u003cb class=\"key\">유전적 \u003c/b>\u003cb class=\"key\">설계도\u003c/b>에 기록된 일종의 본능입니다. 이는 컴퓨터의 \u003cb class=\"key\">기본 \u003c/b>\u003cb class=\"key\">소프트웨어\u003c/b> (Default Software)처럼 우리가 태어날 때부터 장착하고 나오는 기능과 비슷합니다. 최근 연구에 따르면 수백 개의 \u003cb class=\"key\">유전자\u003c/b> (Genes)가 협력하여 우리의 리듬 인지 능력을 형성합니다. 이러한 \u003cb class=\"key\">유전적 \u003c/b>\u003cb class=\"key\">특성\u003c/b> (Genetic Traits)은 단순히 춤을 잘 추는 것뿐만 아니라, 걷거나 숨을 쉬는 것과 같은 기본적인 신체 리듬에도 영향을 미칩니다. 결국 우리가 박자를 타는 것은 우리 몸속 \u003cb class=\"key\">DNA\u003c/b>가 연주하는 생명의 음악이라고 할 수 있습니다.\u003c/div>","segs":[{"n":2,"text":"우리가 음악에 맞춰 몸을 흔드는 행위는 단순한 즐거움을 넘어 생물학적인 근거를 가지고 있습니다. 과학적으로 리듬을 타는 능력은 우리 몸의 유전적 설계도에 기록된 일종의 본능이죠. 이는 컴퓨터에 처음부터 설치된 기본 소프트웨어처럼 우리가 태어날 때부터 가지고 나오는 기능과 비슷합니다. 최근 연구에 따르면 수백 개의 유전자가 협력하여 우리의 리듬 인지 능력을 형성한다고 해요. 이러한 유전적 특성은 춤뿐만 아니라 걷거나 숨을 쉬는 것과 같은 기본적인 신체 리듬에도 영향을 미친답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>춤 실력의 개인차\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>음악에 맞춰 춤추는 즐거움을 언급하며, 왜 사람마다 \u003cb class=\"key\">춤 \u003c/b>\u003cb class=\"key\">실력\u003c/b>에 차이가 있는지에 대한 \u003cb class=\"key\">의문\u003c/b>을 던집니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>유전적 원인 발견\u003csmall>근거 · 문장 3–6\u003c/small>\u003c/h4>\u003cp>과학자들이 발견한 \u003cb class=\"key\">특별한 \u003c/b>\u003cb class=\"key\">유전자\u003c/b>가 우리가 리듬을 타는 데 도움을 주며, 춤 실력이 사실 \u003cb class=\"key\">유전자\u003c/b>에서 온다는 것을 밝힙니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>리듬 유전자의 역할\u003csmall>부연 · 문장 7–9\u003c/small>\u003c/h4>\u003cp>우리 몸에 리듬을 유지해 주는 \u003cb class=\"key\">수백 \u003c/b>\u003cb class=\"key\">개의 \u003c/b>\u003cb class=\"key\">유전자\u003c/b>가 존재하며, 이것이 우리의 \u003cb class=\"key\">리듬 \u003c/b>\u003cb class=\"key\">감각\u003c/b>과 음악성을 형성함을 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>일상으로의 확장 및 결론\u003csmall>결론 · 문장 10–13\u003c/small>\u003c/h4>\u003cp>리듬 감각은 춤뿐만 아니라 \u003cb class=\"key\">일상 \u003c/b>\u003cb class=\"key\">활동\u003c/b>과도 연결되어 있으며, 유전자가 우리 \u003cb class=\"key\">삶의 \u003c/b>\u003cb class=\"key\">리듬\u003c/b>을 만든다는 점을 강조합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 질문으로 시작해서 유전자라는 원인을 밝히고 그 영향이 일상으로 퍼지는 과정을 순차적으로 보여줍니다.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서는 음악과 춤에 대한 흥미를 유발하며 시작해요. 사람마다 춤 실력이 다른 이유가 무엇인지 질문을 던져 여러분의 호기심을 자극하고 있습니다.","hl":"f0"},{"n":5,"text":"세 번째부터 여섯 번째 문장까지는 그 해답을 제시하는데요. 과학자들이 발견한 특별한 유전자가 우리의 춤과 박수치기에 영향을 미친다는 사실을 통해 리듬감의 생물학적 근거를 명확히 설명하고 있죠.","hl":"f1"},{"n":6,"text":"일곱 번째부터 아홉 번째 문장에서는 내용을 더 구체화합니다. 수백 개의 유전자가 리듬 유지를 도우며, 우리가 무심코 발을 구르는 행동조차 타고난 리듬 감각의 표현임을 강조해요.","hl":"f2"},{"n":7,"text":"마지막 열 번째부터 열세 번째 문장에서는 리듬의 범위를 일상으로 확장합니다. 리듬은 춤뿐만 아니라 숨 쉬기와 같은 활동과도 연결되어 있으며, 유전자가 우리 삶 전체를 구성하는 핵심 요소임을 강조하며 마무리됩니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">질문-답변\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 6번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 춤을 잘 추는 이유에 대한 \u003cb class=\"key\">질문\u003c/b>을 던지고, 그 해답으로 \u003cb class=\"key\">유전자\u003c/b>라는 과학적 근거를 제시합니다. 핵심 내용이 초반부에 등장하는 \u003cb class=\"key\">두괄식 \u003c/b>\u003cb class=\"key\">구성\u003c/b>을 취하며, 이후 리듬의 영향력을 일상으로 확장하여 주제를 강화합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>However (10)\u003c/b>\u003cspan>내용의 범위를 춤에서 일상 활동으로 확장하는 전환점\u003c/span>\u003cb>In fact (7)\u003c/b>\u003cspan>앞서 언급한 유전자의 존재를 구체적인 수치로 강조\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">dancing skills actually come from our genes\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">hundreds of genes that help us keep rhythm\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">natural sense of rhythm\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">rhythm in your life\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 질문에 답을 하는 방식으로 시작해서 원인과 결과를 설명하는 인과 구조를 취하고 있어요. 핵심 내용이 앞부분에 등장하는 두괄식 구성으로, 유전자가 우리 춤 실력의 근원임을 명확히 밝힙니다. 뒤로 갈수록 그 영향력이 일상까지 확대된다는 논리적 흐름을 보여주죠.","hl":"ty"},{"n":9,"text":"열 번째 문장의 However는 글의 흐름을 춤에서 일상으로 확장하는 중요한 신호어예요. 이 지문에서는 유전자가 리듬 감각을 만든다는 내용이 여러 번 재진술되면서 주제를 강조하고 있습니다. 특히 리듬이 춤뿐만 아니라 걷기와 숨 쉬기 같은 활동으로 이어진다는 연결 고리를 잘 파악해야 합니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>dance to music\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>음악에 맞춰 춤을 추다\u003c/span>\u003c/div>\u003cdiv>\u003cb>moving to a beat\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>리듬에 맞춰 움직이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>naturally\u003c/b>\u003cem>부사\u003c/em>\u003cspan>타고나기를, 자연스럽게\u003c/span>\u003c/div>\u003cdiv>\u003cb>scientist\u003c/b>\u003cem>명사\u003c/em>\u003cspan>과학자\u003c/span>\u003c/div>\u003cdiv>\u003cb>found\u003c/b>\u003cem>동사\u003c/em>\u003cspan>찾아냈다\u003c/span>\u003c/div>\u003cdiv>\u003cb>reason\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이유\u003c/span>\u003c/div>\u003cdiv>\u003cb>recently\u003c/b>\u003cem>부사\u003c/em>\u003cspan>최근에\u003c/span>\u003c/div>\u003cdiv>\u003cb>discovered\u003c/b>\u003cem>동사\u003c/em>\u003cspan>발견했다\u003c/span>\u003c/div>\u003cdiv>\u003cb>special\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>특별한\u003c/span>\u003c/div>\u003cdiv>\u003cb>genes\u003c/b>\u003cem>명사\u003c/em>\u003cspan>유전자\u003c/span>\u003c/div>\u003cdiv>\u003cb>clap along with\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 맞춰 박수를 치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>actually\u003c/b>\u003cem>부사\u003c/em>\u003cspan>사실은, 실제로\u003c/span>\u003c/div>\u003cdiv>\u003cb>come from\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에서 기인하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>in fact\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>사실\u003c/span>\u003c/div>\u003cdiv>\u003cb>hundreds of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>수백 개의\u003c/span>\u003c/div>\u003cdiv>\u003cb>keep rhythm\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>리듬을 유지하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>tap foot\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>발을 가볍게 두드리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>show\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보여주다\u003c/span>\u003c/div>\u003cdiv>\u003cb>natural sense of rhythm\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자연스러운 리듬 감각\u003c/span>\u003c/div>\u003cdiv>\u003cb>musical\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>음악적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>however\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>그러나\u003c/span>\u003c/div>\u003cdiv>\u003cb>important\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>중요한\u003c/span>\u003c/div>\u003cdiv>\u003cb>linked to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~와 연관된\u003c/span>\u003c/div>\u003cdiv>\u003cb>everyday activity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>일상적인 활동\u003c/span>\u003c/div>\u003cdiv>\u003cb>walking\u003c/b>\u003cem>명사\u003c/em>\u003cspan>걷기\u003c/span>\u003c/div>\u003cdiv>\u003cb>breathing\u003c/b>\u003cem>명사\u003c/em>\u003cspan>숨 쉬기\u003c/span>\u003c/div>\u003cdiv>\u003cb>even\u003c/b>\u003cem>부사\u003c/em>\u003cspan>심지어, ~조차\u003c/span>\u003c/div>\u003cdiv>\u003cb>think of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 대해 생각하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>rhythm in your life\u003c/b>\u003cem>명사\u003c/em>\u003cspan>삶에서의 리듬\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"이 지문에서 가장 중요한 단어는 유전자를 뜻하는 gene입니다. 또한 박자에 맞춰 움직일 때 쓰는 beat나 rhythm 같은 리듬 관련 어휘들이 반복해서 등장하고 있으니 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">discover\u003c/b>\u003cspan class=\"m\">발견하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">find\u003c/span>\u003cspan class=\"s\">identify\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">lose\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">special\u003c/b>\u003cspan class=\"m\">특별한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">specific\u003c/span>\u003cspan class=\"s\">particular\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">common\u003c/span>\u003cspan class=\"a\">ordinary\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">actually\u003c/b>\u003cspan class=\"m\">사실은\u003c/span>\u003cdiv class= 03c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사람마다 춤 실력에 \u003cb class=\"key\">차이\u003c/b>가 있음을 언급하며, 이것이 \u003cb class=\"key\">천성적\u003c/b>인 것임을 암시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">비교급\u003c/span> : better [well의 비교급] + than [접속사/전치사] : \"~보다 더 잘\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Some people, 어떤 사람들은.  naturally dance better,  타고나기를 춤을 더 잘 춰요.  than others,  다른 사람들보다.. 이 문장 전체를 해석하면, 어떤 사람들은 타고나기를 다른 사람들보다 춤을 더 잘 춰요.","hl":"m"},{"n":16,"text":"모든 사람이 춤을 똑같이 잘 추는 건 아니죠? 이 문장은 어떤 사람들이 다른 사람보다 춤을 더 잘 추는 경향이 있다는 사실을 말해주고 있어요.","hl":"mn"},{"n":17,"text":"문법 포인트는 비교급인 better than입니다. 잘한다는 의미인 well의 비교급인 better를 써서 다른 사람들보다 더 잘 춘다는 의미를 강조하고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">과학자로 이루어진 한 팀이\u003c/span>\u003cspan class=\"en\">A team of scientists\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 이유를 찾아냈어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">found\u003c/span> a reason\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 이것에 대한.\u003c/span>\u003cspan class=\"en\">for this.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">과학자로 이루어진 한 팀이 이것에 대한 이유를 찾아냈어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 언급한 현상의 \u003cb class=\"key\">원인\u003c/b>에 대한 \u003cb class=\"key\">과학적 \u003c/b>\u003cb class=\"key\">근거\u003c/b>가 있음을 밝히며 논리적 근거를 제시할 준비를 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사의 과거형\u003c/span> : found [find의 과거형] : \"찾아냈다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"A team of scientists, 과학자로 이루어진 한 팀이.  found a reason,  이유를 찾아냈어요.  for this,  이것에 대한.. 이 문장 전체를 해석하면, 과학자로 이루어진 한 팀이 이것에 대한 이유를 찾아냈어요.","hl":"m"},{"n":19,"text":"춤 실력의 차이가 왜 생기는지 궁금하시죠? 과학자들이 그 비밀을 풀어줄 단서를 발견했다는 내용으로 다음 내용을 기대하게 만드네요.","hl":"mn"},{"n":20,"text":"여기서 found는 찾다라는 뜻의 find의 과거형이에요. 과학자들이 이미 연구를 끝내고 결과를 발견한 상태이기 때문에 과거 시제를 사용했다는 점을 체크해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은\u003c/span>\u003cspan class=\"en\">They\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">최근에\u003c/span>\u003cspan class=\"en\">recently\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">발견했어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">discovered\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">특별한\u003c/span>\u003cspan class=\"en\">special *\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유전자들을.\u003c/span>\u003cspan class=\"en\">genes.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 최근에 특별한 유전자들을 발견했어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글의 흐름에서 춤 실력의 차이가 발생하는 \u003cb class=\"key\">과학적 \u003c/b>\u003cb class=\"key\">근거\u003c/b>를 처음으로 제시하며, \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">소재\u003c/b>인 유전자를 도입합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사의 과거형\u003c/span> : discover + -ed : \"발견했다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"They, 그들은. recently, 최근에. discovered, 발견했어요. special, 특별한. genes, 유전자들을.. 이 문장 전체를 해석하면, 그들은 최근에 특별한 유전자들을 발견했어요.","hl":"m"},{"n":22,"text":"과학자들이 연구를 통해 사람마다 춤 실력이 다른 이유를 찾아냈다는 내용이에요. 여기서 특별한 유전자는 이 글 전체를 이끌어가는 가장 중요한 핵심 소재가 됩니다.","hl":"mn"},{"n":23,"text":"문법을 보면 discovered라는 단어가 쓰였죠. 과거에 과학자들이 발견했다는 사실을 나타내기 위해 동사 끝에 ed를 붙여 과거형으로 표현했어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 유전자들은\u003c/span>\u003cspan class=\"en\">These genes\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 ~하는 것을 도와줘요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">help \u003c/span>\u003cspan class=\"tgt\">us \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">춤을 추거나 박수를 치는 데\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">dance \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">clap\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">음악에 맞춰.\u003c/span>\u003cspan class=\"en\">along with music.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 유전자들은 우리가 음악에 맞춰 춤을 추거나 박수를 치는 데 도움을 줘요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 언급한 유전자가 우리 몸에서 수행하는 \u003cb class=\"key\">구체적 \u003c/b>\u003cb class=\"key\">기능\u003c/b>을 설명하며, 음악에 대한 \u003cb class=\"key\">신체적 \u003c/b>\u003cb class=\"key\">반응\u003c/b>을 유전자와 연결합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">준사역동사 help의 목적격 보어\u003c/span> : help + 목적어(us) + 목적격 보어(dance and clap) : \"우리가 춤추고 박수치는 것을 돕다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">병렬 구조\u003c/span> : dance [A] + and + clap [B] : \"춤추거나 박수치다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"These genes, 이 유전자들은. help us, 우리가 ~하는 것을 도와줘요. dance and clap, 춤을 추거나 박수를 치는 데. along with music, 음악에 맞춰.. 이 문장 전체를 해석하면, 이 유전자들은 우리가 음악에 맞춰 춤을 추거나 박수를 치는 데 도움을 줘요.","hl":"m"},{"n":25,"text":"방금 발견했다고 말한 그 유전자들이 구체적으로 어떤 일을 하는지 설명하는 문장이에요. 우리가 음악을 들을 때 박자를 맞추는 행동이 바로 이 유전자의 작용이라는 거죠.","hl":"mn"},{"n":26,"text":"첫 번째 포인트는 help us dance and clap 부분입니다. help는 준사역동사라고 불러요. 그래서 목적어인 us 뒤에 dance와 clap 같은 동사원형을 나란히 쓸 수 있죠. 두 번째 포인트는 dance와 clap이 and로 묶인 병렬 구조라는 점이에요. 같은 형태를 유지해야 한다는 걸 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이는 의미해요\u003c/span>\u003cspan class=\"en\">This \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">means \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 춤추는 솜씨가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">dancing \u003c/span>\u003cspan class=\"tgt\">skills\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사실은 ~에서 기인한다는 것을\u003c/span>\u003cspan class=\"en\">actually \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">come \u003c/span>\u003cspan class=\"tgt\">from\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 유전자에서!\u003c/span>\u003cspan class=\"en\">our genes!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이는 우리의 춤추는 솜씨가 사실은 우리의 유전자에서 기인한다는 것을 의미해요!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞선 사실들을 토대로 내리는 \u003cb class=\"key\">중간 \u003c/b>\u003cb class=\"key\">결론\u003c/b>으로, 춤 실력이 \u003cb class=\"key\">선천적 \u003c/b>\u003cb class=\"key\">요인\u003c/b>인 유전자에 달려 있음을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that의 생략\u003c/span> : mean + (that) + 주어(our dancing skills) + 동사 : \"~라는 것을 의미하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">기원을 나타내는 표현\u003c/span> : A + come from + B : \"~에서 기인하다, ~로부터 나오다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"This means, 이는 의미해요. our dancing skills, 우리의 춤추는 솜씨가. actually come from, 사실은 ~에서 기인한다는 것을. our genes!, 우리의 유전자에서!. 이 문장 전체를 해석하면, 이는 우리의 춤추는 솜씨가 사실은 우리의 유전자에서 기인한다는 것을 의미해요!","hl":"m"},{"n":28,"text":"앞에서 설명한 유전자의 역할 덕분에 내릴 수 있는 최종 결론이에요. 우리가 춤을 얼마나 잘 추는지는 결국 타고난 유전자에 이미 적혀 있다는 사실을 다시 한 번 확인해 주는 거죠.","hl":"mn"},{"n":29,"text":"첫 번째로 means 다음에 접속사 that이 숨어 있다는 걸 알아야 해요. that부터 문장 끝까지가 하나의 커다란 덩어리가 되어 means의 목적어 역할을 하고 있어요. 두 번째로 come from은 어디에서 유래하거나 시작되었을 때 쓰는 표현이에요. 우리의 춤 실력이 유전자라는 근원에서 시작되었다는 의미를 전달합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사실,\u003c/span>\u003cspan class=\"en\">In fact,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수백 개의 유전자가 있어요\u003c/span>\u003cspan class=\"en\">there are \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">hundreds \u003c/span>\u003cspan class=\"tgt\">of\u003c/span> genes\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리에게 리듬을 유지하도록 도와주는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">help \u003c/span>\u003cspan class=\"tgt\">us \u003c/span>\u003cspan class=\"tgt\">keep \u003c/span>\u003cspan class=\"tgt\">rhythm\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사실, 우리에게는 리듬을 유지하도록 도와주는 수백 개의 유전자가 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 춤과 유전자의 상관관계를 뒷받침하기 위해 \u003cb class=\"key\">수백 \u003c/b>\u003cb class=\"key\">개\u003c/b>의 유전자가 인간의 \u003cb class=\"key\">리듬감\u003c/b>에 구체적으로 관여하고 있다는 사실을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수량을 나타내는 표현\u003c/span> : hundreds of + [복수 명사] : \"수백 개의\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사절\u003c/span> : [선행사(genes)] + that [주격 관계대명사] + [동사(help)] : \"리듬을 유지하도록 도와주는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">준사역동사 help의 목적격 보어\u003c/span> : help [동사] + us [목적어] + keep [목적격 보어(동사원형/to부정사)] : \"우리가 유지하도록 돕다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"In fact, 사실. there are hundreds of genes, 수백 개의 유전자가 있어요. that help us keep rhythm, 우리에게 리듬을 유지하도록 도와주는. 이 문장 전체를 해석하면, 사실, 우리에게는 리듬을 유지하도록 도와주는 수백 개의 유전자가 있어요.","hl":"m"},{"n":31,"text":"우리 몸에는 리듬을 타는 능력을 결정하는 유전자가 수백 개나 있다는 과학적 근거를 제시하는 문장이에요. 인간의 리듬감이 유전적인 특징이라는 점을 구체적인 숫자로 강조하고 있죠.","hl":"mn"},{"n":32,"text":"첫 번째로 hundreds of는 수백 개의라는 뜻으로 뒤에 복수 명사가 옵니다. 두 번째로 that help us keep rhythm은 주격 관계대명사절로 앞의 유전자들을 꾸며주고 있어요. 세 번째로 help 동사는 목적격 보어 자리에 동사원형인 keep을 쓴다는 점을 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 발을 가볍게 두드릴 때,\u003c/span>\u003cspan class=\"en\">When we \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">tap \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">foot, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">박수를 치거나,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">clap \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">hands, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">음악에 맞춰 춤을 출 때,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">dance \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">music\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 보여줄 수 있어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">it\u003c/span> can show\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 자연스러운 리듬 감각을\u003c/span>\u003cspan class=\"en\">our natural sense of rhythm.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리가 발을 가볍게 두드리거나, 박수를 치거나, 음악에 맞춰 춤을 출 때, 그것은 우리의 자연스러운 리듬 감각을 보여줄 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 우리가 무의식적으로 하는 일상적인 \u003cb class=\"key\">행동\u003c/b>들이 사실은 내재된 \u003cb class=\"key\">유전적 \u003c/b>\u003cb class=\"key\">리듬감\u003c/b>의 발현임을 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사의 병렬 구조\u003c/span> : tap [동사1] ... , clap [동사2] ... , or dance [동사3] : \"발을 두드리고, 박수를 치고, 또는 춤을 추다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">대명사의 지칭\u003c/span> : it = 앞선 When절의 행동들 : \"그것은\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"When we tap our foot, 우리가 발을 가볍게 두드릴 때. clap our hands, 박수를 치거나. or dance to music, 음악에 맞춰 춤을 출 때. it can show, 그것은 보여줄 수 있어요. our natural sense of rhythm, 우리의 자연스러운 리듬 감각을. 이 문장 전체를 해석하면, 우리가 발을 가볍게 두드리거나, 박수를 치거나, 음악에 맞춰 춤을 출 때, 그것은 우리의 자연스러운 리듬 감각을 보여줄 수 있어요.","hl":"m"},{"n":34,"text":"발을 까닥거리거나 손뼉을 치는 아주 흔한 행동들이 사실은 우리 몸속의 타고난 리듬감이 겉으로 드러나는 모습이라고 말하고 있어요.","hl":"mn"},{"n":35,"text":"첫 번째로 tap, clap, dance는 접속사 or를 중심으로 나란히 연결된 병렬 구조예요. 주어 we에 걸리는 세 개의 동사원형이 쓰인 걸 확인하세요. 두 번째로 대명사 it은 앞에서 말한 이런 행동들 전체를 가리킵니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 리듬감이\u003c/span>\u003cspan class=\"en\">This sense of rhythm\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리를 음악적으로 만들어줘요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">makes \u003c/span>\u003cspan class=\"tgt\">us \u003c/span>\u003cspan class=\"tgt\">musical\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 리듬감이 우리를 음악적으로 만들어줘요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 언급한 리듬 감각이 결국 인간을 \u003cb class=\"key\">음악적 \u003c/b>\u003cb class=\"key\">존재\u003c/b>로 정의하는 핵심 요소라는 \u003cb class=\"key\">결론\u003c/b>을 전달합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">5형식 문장(사역/상태의 동사)\u003c/span> : makes [동사] + us [목적어] + musical [목적격 보어(형용사)] : \"우리를 음악적으로 만들다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"This sense of rhythm, 이 리듬감이. makes us musical, 우리를 음악적으로 만들어줘요. 이 문장 전체를 해석하면, 이 리듬감이 우리를 음악적으로 만들어줘요.","hl":"m"},{"n":37,"text":"타고난 리듬 감각 덕분에 우리가 음악을 즐기고 표현할 수 있는 음악적인 존재가 된다는 뜻이에요.","hl":"mn"},{"n":38,"text":"이 문장은 5형식 문장으로 쓰였어요. 동사 makes 다음에 목적어 us가 나오고 그 뒤에 목적어의 상태를 설명하는 musical이라는 형용사가 왔죠. 이 자리에 부사를 쓰면 틀리니까 꼭 형용사 형태를 확인해 주세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나,\u003c/span>\u003cspan class=\"en\">However,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 리듬 감각은\u003c/span>\u003cspan class=\"en\">our sense of rhythm\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오직 중요한 것만이 아니에요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">isn't \u003c/span>\u003cspan class=\"tgt\">only\u003c/span> important\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">춤추는 데에만요.\u003c/span>\u003cspan class=\"en\">for dancing.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나, 우리의 리듬 감각은 오직 춤추는 데에만 중요한 것이 아니에요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 언급한 춤과의 관계를 넘어 \u003cb class=\"key\">리듬 \u003c/b>\u003cb class=\"key\">감각\u003c/b>의 역할을 더 넓은 영역으로 \u003cb class=\"key\">확장\u003c/b>하고 있습니다. 단순히 유전자가 춤 실력만 결정하는 것이 아니라는 점을 강조하며 화제를 전환합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">not only를 활용한 부분 부정\u003c/span> : be동사 + not + only + 형용사 : \"오직 ~하기만 한 것은 아니다\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"However, 그러나. our sense of rhythm, 우리의 리듬 감각은. isn't only important, 오직 중요한 것만이 아니에요. for dancing, 춤추는 데에만요.. 이 문장 전체를 해석하면, 그러나, 우리의 리듬 감각은 오직 춤추는 데에만 중요한 것이 아니에요.","hl":"m"},{"n":40,"text":"지금까지는 춤과 유전자의 관계를 말했지만, 이제부터는 리듬 감각의 더 넓은 역할을 설명하려고 해요. 춤 이외의 다른 부분에서도 중요하다는 흐름의 전환을 보여줍니다.","hl":"mn"},{"n":41,"text":"첫 번째로 isn't only를 볼게요. only가 들어간 부정문은 오직 그것뿐만이 아니라는 의미를 전달해요. 춤이라는 하나의 분야에만 국한되지 않는다는 점을 강조할 때 씁니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 또한 연관되어 있어요\u003c/span>\u003cspan class=\"en\">It's also linked\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일상적인 활동과요\u003c/span>\u003cspan class=\"en\">to everyday activities\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">— 걷기와 숨 쉬기 같은 것 말이죠.\u003c/span>\u003cspan class=\"en\">— like \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">walking \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">breathing\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 걷기와 숨 쉬기 같은 일상적인 활동과도 연관되어 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 리듬이 \u003cb class=\"key\">일상생활\u003c/b>의 기본인 걷기와 호흡에 어떻게 \u003cb class=\"key\">연결\u003c/b>되어 있는지 구체적인 사례를 제시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사의 병렬 구조\u003c/span> : walking (동명사1) + and + breathing (동명사2) : \"걷기와 숨 쉬기\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">수동태 (be + 과거분사)\u003c/span> : be + linked (과거분사) + to : \"~와 연관되어 있다\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"It's also linked, 그것은 또한 연관되어 있어요. to everyday activities, 일상적인 활동과요. — like walking and breathing, — 걷기와 숨 쉬기 같은 것 말이죠.. 이 문장 전체를 해석하면, 그것은 걷기와 숨 쉬기 같은 일상적인 활동과도 연관되어 있어요.","hl":"m"},{"n":43,"text":"리듬이 춤뿐만 아니라 우리가 매일 하는 아주 기본적인 행동들에도 깊이 관여하고 있다는 사실을 알려줍니다.","hl":"mn"},{"n":44,"text":"첫 번째로 be linked to는 무엇과 연관되어 있다는 뜻의 수동태 표현이에요. 리듬 감각과 일상 활동의 연결 고리를 설명하죠. 두 번째로 walking and breathing은 전치사 like 뒤에 온 동명사 병렬 구조예요. 걷기와 숨 쉬기라는 두 가지 행위를 나란히 연결하고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러니, 여러분이 춤을 추고 있을 때나,\u003c/span>\u003cspan class=\"en\">So, when you're dancing,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또는 심지어 걷고 있을 때도,\u003c/span>\u003cspan class=\"en\">or even walking,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">생각해 보세요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">think \u003c/span>\u003cspan class=\"tgt\">of\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분의 유전자에 대해서요.\u003c/span>\u003cspan class=\"en\">your genes.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러니, 여러분이 춤을 추고 있을 때나 걷고 있을 때도, 유전자에 대해 생각해 보세요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 일상의 모든 움직임 뒤에 숨겨진 \u003cb class=\"key\">유전자\u003c/b>의 존재를 다시 한번 \u003cb class=\"key\">상기\u003c/b>시키며 글을 마무리합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문\u003c/span> : 동사원형 (think) + of ~ : \"~에 대해 생각하라\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"So, when you're dancing, 그러니, 여러분이 춤을 추고 있을 때나. or even walking, 또는 심지어 걷고 있을 때도. think of, 생각해 보세요. your genes, 여러분의 유전자에 대해서요.. 이 문장 전체를 해석하면, 그러니, 여러분이 춤을 추고 있을 때나 걷고 있을 때도, 유전자에 대해 생각해 보세요.","hl":"m"},{"n":46,"text":"우리의 모든 리드미컬한 움직임이 결국 유전자에서 비롯된 것임을 잊지 말라는 결론을 내리고 있어요.","hl":"mn"},{"n":47,"text":"첫 번째로 or even walking은 앞에 나오는 dancing과 연결되어 when절 안에서 병렬을 이루고 있어요. 두 번째로 think of는 주어 없이 동사 원형으로 시작하는 명령문이에요. 독자에게 유전자의 역할을 떠올려 보라고 권유하는 문장입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들은 도움을 줍니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">They\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">help \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">리듬을 만드는 데\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">make\u003c/span> the rhythm\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분의 삶에서!\u003c/span>\u003cspan class=\"en\">in your life!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것들은 여러분의 삶에서 리듬을 만드는 데 도움을 주고 있어요!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 지문의 결론으로, \u003cb class=\"key\">유전자\u003c/b>가 단순한 춤 실력을 넘어 걷기나 호흡 같은 우리 삶의 전반적인 \u003cb class=\"key\">생체 \u003c/b>\u003cb class=\"key\">리듬\u003c/b>을 형성하는 데 기여한다는 의미입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">인칭대명사의 지칭\u003c/span> : They [대명사/주어] = Genes : \"그것들은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">준사역동사 help의 목적어\u003c/span> : help [동사] + make [동사원형/목적어] : \"만드는 데 도움을 주다\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"They help, 그것들은 도움을 줍니다. make the rhythm, 리듬을 만드는 데. in your life!, 여러분의 삶에서!. 이 문장 전체를 해석하면, 그것들은 여러분의 삶에서 리듬을 만드는 데 도움을 주고 있어요!","hl":"m"},{"n":49,"text":"이 문장은 글을 마무리하는 결론입니다. 우리 몸속의 유전자가 춤출 때뿐만 아니라 일상의 모든 순간에 생체 리듬을 만들어내는 중요한 역할을 하고 있다는 사실을 전달하고 있어요.","hl":"mn"},{"n":50,"text":"첫 번째로 주어인 They를 주목하세요. 이 대명사는 앞 문장에서 말한 유전자들인 genes를 가리키고 있습니다. 두 번째 포인트는 help make입니다. help라는 동사는 뒤에 동사원형인 make를 바로 써서 무엇을 하는 데 도움을 주는지 표현할 수 있는 준사역동사라는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>어떤 사람들이 춤을 더 잘 추는 과학적인 이유는 최근 발견된 특별한 \u003cb class=\"key\">유전자\u003c/b> 덕분입니다.\u003c/li>\u003cli>수백 개의 유전자가 우리가 음악에 맞춰 \u003cb class=\"key\">리듬을 \u003c/b>\u003cb class=\"key\">유지\u003c/b>하고 박수를 치는 것을 돕습니다.\u003c/li>\u003cli>이러한 \u003cb class=\"key\">리듬 \u003c/b>\u003cb class=\"key\">감각\u003c/b>은 우리를 음악적으로 만들어 줄 뿐만 아니라 자연스러운 신체 반응을 이끌어냅니다.\u003c/li>\u003cli>리듬은 춤뿐만 아니라 걷기와 숨 쉬기 같은 \u003cb class=\"key\">일상적인 \u003c/b>\u003cb class=\"key\">활동\u003c/b>과도 깊이 연관되어 있습니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Our ability to sense rhythm and dance is fundamentally rooted in our genetic makeup, influencing both musicality and daily life activities.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">우리의 \u003cb class=\"key\">춤 \u003c/b>\u003cb class=\"key\">솜씨\u003c/b>와 \u003cb class=\"key\">리듬 \u003c/b>\u003cb class=\"key\">감각\u003c/b>은 수백 개의 \u003cb class=\"key\">유전자\u003c/b>에 의해 결정되며, 이는 단순한 취미를 넘어 \u003cb class=\"key\">일상적인 \u003c/b>\u003cb class=\"key\">활동\u003c/b>과도 깊이 연관되어 있습니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":51,"text":"오늘 우리는 춤과 리듬이 우리 유전자에 새겨진 본능이라는 것을 배웠습니다. 춤뿐만 아니라 걷기와 숨 쉬기 같은 일상도 리듬의 연속이라는 점이 참 인상적이죠. 배운 내용을 바탕으로 여러분의 삶 속의 리듬을 다시 한번 느껴보시길 바랍니다. 수고하셨습니다!","hl":null}]}]});</script></body></html>
