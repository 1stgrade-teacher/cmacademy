+uf/wBeP8n/AOtS+nPHPuR7duvbtn05oCjgDvnj07+p45/ngUCb3tv59/dtZW0Wq87/AIBOfb2/Entxxnt+FGc8k57Dn8P8+p9eaT9Ovt9aP5dv8/hQJOW1l221vpa6v1u9FrfZMXPGPyP+e3X8aB7DJ7f5H5/gB60g6gHp17/5+uOnH1pc4/8A1eufz/H+lAry/TZXV+XzXfT8fIzzmk5/xH+R27dKXH9f0/zz6Dmj0zwD0/8A1ZoJ996au9la/wDh9O6+V+7AYzg/zx/Pj86BzkDGRz7/AIfhnj0A470mBnGeO34YxxycHtjGPfsoBwSAxwDnjoMZOOOcjn2wT24Lrq+333S7ea7b3KipbWdut9rO33We3n21t//Z\" alt=\"\"></div>","<div class=\"lec-cover-title\">Why Are the Noses of Ancient Egyptian Statues Missing?<small>고대 이집트 조각상들의 코는 왜 사라졌는가?</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">고대 이집트인들에게 조각상은 단순히 예술품이 아니라 죽은 이의 영혼이 깃드는 생명의 그릇(Vessel of the soul)과도 같았답니다. 이들은 조각상의 코를 숨을 쉬는 통로이자 생명력이 흐르는 핵심으로 여겼기에, 코를 부수는 행위를 곧 영혼의 숨통을 끊어버리는 상징적인 살해(Symbolic killing)로 간주했지요. 마치 우리가 무서운 영화 속에서 악령을 물리치기 위해 봉인을 해제하는 장면을 떠올리면 이해하기 쉬울 거예요. 이처럼 고대 이집트의 종교적 관념인 내세관(Afterlife belief)과 조각상을 바라보는 독특한 시각을 미리 알아두면, 왜 그 많은 석상들이 유독 코만 훼손되었는지 그 역사적 미스터리를 훨씬 깊이 있게 이해할 수 있습니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01현상 관찰</div><ul><li>박물관에서 볼 수 있는 고대 이집트 조각상들은 코가 훼손된 경우가 많다.</li><li>조각상 코가 부서진 것에 대한 의문 제기</li><li>부식(corrosion)만으로는 실내 조각상의 손상을 설명하기 어려움</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02문화적 신념</div><ul><li>이집트인들은 조각상에 죽은 자의 영혼이 깃든다고 믿었다.</li><li>죽은 자의 영혼(soul)이 조각상으로 이동한다고 생각함</li><li>코(nose)를 생명의 근원으로 간주함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03의도적 파손의 이유</div><ul><li>영혼을 제거하거나 무력화하기 위해 의도적으로 코를 훼손했다.</li><li>조각상에서 영혼을 쫓아내기 위해 조각상을 파괴함</li><li>영혼의 숨통을 끊기 위해 코를 집중적으로 공격함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04실제 사례 적용</div><ul><li>무덤 도굴꾼들은 영혼의 저주를 막기 위해 이 방법을 사용했다.</li><li>파라오의 무덤(pharaoh’s tombs)에서 보물을 훔칠 때 행해짐</li><li>영혼을 영원히 파괴하기 위해 코를 부러뜨림</li><li>핵심 키워드: 파라오의 무덤(pharaoh’s tombs), 영혼(soul)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">missing</td><td class=\"m\">없어진, 분실된</td></tr><tr><td class=\"w\">corrosion</td><td class=\"m\">부식, 침식</td></tr><tr><td class=\"w\">explain</td><td class=\"m\">설명하다, 해명하다</td></tr><tr><td class=\"w\">mystery</td><td class=\"m\">수수께끼, 미스터리</td></tr><tr><td class=\"w\">soul</td><td class=\"m\">영혼, 정신</td></tr><tr><td class=\"w\">move into</td><td class=\"m\">~로 옮겨가다, ~로 이동하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">remove</td><td class=\"m\">제거하다, 없애다</td></tr><tr><td class=\"w\">destroy</td><td class=\"m\">파괴하다, 무너뜨리다</td></tr><tr><td class=\"w\">source</td><td class=\"m\">원천, 근원</td></tr><tr><td class=\"w\">steal</td><td class=\"m\">훔치다, 도둑질하다</td></tr><tr><td class=\"w\">tomb</td><td class=\"m\">무덤, 묘</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">본 적이 있나요</span><span class=\"en\"><b><span class=\"grammar-hl\">Have you ever seen</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">조각상들을</span><span class=\"en\"><b>statues</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">고대 이집트의</span><span class=\"en\"><b>from ancient Egypt</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">박물관에서</span><span class=\"en\"><b>in museums?</b></span></div></div><div class=\"lec-sent-ko\">여러분은 박물관에서 고대 이집트의 조각상들을 본 적이 있나요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자의 경험을 환기하며 이집트 조각상에 대한 호기심을 유발하고, 이어질 이야기의 소재를 제시하는 도입부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Have you ever seen (현재완료): have + p.p. 형태를 사용하여 과거부터 현재까지의 경험을 나타내는 의문문 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">흥미롭게도,</span><span class=\"en\"><b>Interestingly,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들 중 많은 것들이</span><span class=\"en\"><b>many of them</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">코가 없다</span><span class=\"en\"><b><span class=\"grammar-hl\">are missing</span> their noses.</b></span></div></div><div class=\"lec-sent-ko\">흥미롭게도, 그것들 중 많은 조각상들이 코가 없어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 조각상들이 가진 특이한 공통점을 제시하며, 왜 코만 사라졌는지에 대한 의문을 불러일으킵니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are missing (현재진행): be동사(are) + 현재분사(missing) 구조입니다. 여기서 missing은 형용사적 성격이 강하지만, 상태의 지속을 나타내는 현재진행형으로 분석합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">missing</td><td class=\"m\">없어진, 분실된</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어떤 사람들은 생각했다</span><span class=\"en\"><b>Some people <span class=\"grammar-hl\">thought</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">부러진 코들이</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> the <span class=\"grammar-hl\">broken noses</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">단지 침식 작용 때문이었다고</span><span class=\"en\"><b>were just because of corrosion.</b></span></div></div><div class=\"lec-sent-ko\">몇몇 사람들은 그 부러진 코가 단지 침식 작용 때문이라고 생각했어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 코가 없는 현상에 대한 일반적인 가설을 소개하며, 이 문장을 통해 다음 문장에서 반박할 논리적 근거를 마 meone wanted to remove</span> the soul,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 그 조각상을 파괴할 필요가 있었다</span><span class=\"en\"><b>they needed <span class=\"grammar-hl\">to destroy</span> the statue.</b></span></div></div><div class=\"lec-sent-ko\">만약 누군가 영혼을 제거하기를 원했다면, 그들은 조각상을 파괴해야만 했어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 영혼과 조각상의 연결 고리를 설명하여, 왜 조각상을 훼손하는 행위가 일어나는지에 대한 이유를 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">If someone wanted to remove (조건절): if를 사용한 부사절이며, want는 to부정사(to remove)를 목적어로 취하는 동사입니다.</div><div class=\"lec-gr-item\">to remove (to부정사(명사적)): want의 목적어 역할을 합니다.</div><div class=\"lec-gr-item\">to destroy (to부정사(부사적)): 목적을 나타내며 &#39;파괴하기 위해서&#39;로 해석됩니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">soul</td><td class=\"m\">영혼, 정신</td></tr><tr><td class=\"w\">remove</td><td class=\"m\">제거하다, 없애다</td></tr><tr><td class=\"w\">destroy</td><td class=\"m\">파괴하다, 무너뜨리다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그렇다면,</span><span class=\"en\"><b>Then,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">왜 그들은 코만 부러뜨렸을까?</span><span class=\"en\"><b>why <span class=\"grammar-hl\">did they only break</span> the nose?</b></span></div></div><div class=\"lec-sent-ko\">그렇다면, 그들은 왜 코만 부러뜨렸을까요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자가 가질 의문을 대신 질문하며, 코를 훼손하는 행위가 단순히 부수는 것을 넘어 상징적인 의식임을 암시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">did they only break 의문문 도치: 일반동사 의문문에서 주어 앞에 조동사 did를 배치하여 의문문 형식을 취합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 11 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이집트인들은 믿었다</span><span class=\"en\"><b>Egyptians <span class=\"grammar-hl\">believed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">코가</span><span class=\"en\"><b><span class=\"grammar-hl\">the nose</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">생명의 원천이라고</span><span class=\"en\"><b><span class=\"grammar-hl\">was</span> the source of life.</b></span></div></div><div class=\"lec-sent-ko\">이집트인들은 코가 생명의 원천이라고 믿었어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 코 훼손이 영혼을 완전히 소멸시키기 위한 치밀한 조치였음을 밝히는 결정적인 이유입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">believed the nose was 명사절 접속사 that 생략: believed 뒤에 that이 생략된 구조로, 뒤의 절이 목적어 역할을 합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">source</td><td class=\"m\">원천, 근원</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 12 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그래서,</span><span class=\"en\"><b>So,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들이 보물을 훔치기를 원했을 때</span><span class=\"en\"><b><span class=\"grammar-hl\">when people wanted to steal</span> treasure</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">파라오의 무덤으로부터,</span><span class=\"en\"><b>from pharaoh’s tombs,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 항상 한 가지 일을 했다</span><span class=\"en\"><b>they always <span class=\"grammar-hl\">did one thing</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">제일 먼저</span><span class=\"en\"><b>first.</b></span></div></div><div class=\"lec-sent-ko\">그래서, 사람들이 파라오의 무덤에서 보물들을 훔치기를 원했을 때, 그들은 항상 제일 먼저 한 가지를 했어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 설명들을 종합하여, 도굴꾼들이 왜 그런 행동을 했는지 결론을 도출하기 위한 과정입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">when people wanted to steal (부사절): when을 사용한 시간의 부사절이며, want는 to부정사(to steal)를 목적어로 취하는 구조입니다.</div><div class=\"lec-gr-item\">did one thing (대동사(did)): 앞서 언급된 행위들을 지칭하거나 일반동사를 대신하는 구조가 아니라, 여기서는 &#39;one thing을 하다&#39;라는 일반적인 타동사구로 쓰였습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">steal</td><td class=\"m\">훔치다, 도둑질하다</td></tr><tr><td class=\"w\">tomb</td><td class=\"m\">무덤, 묘</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 13 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은 조각상의 코를 부러뜨렸다</span><span class=\"en\"><b>They <span class=\"grammar-hl\">broke the statue’s nose</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">영혼을 파괴하기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to destroy</span> the soul</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">영원히</span><span class=\"en\"><b>forever!</b></span></div></div><div class=\"lec-sent-ko\">그들은 영혼을 영원히 파괴하기 위해 조각상의 코를 부러뜨렸어요!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 조각상의 코를 훼손하는 행위가 도굴꾼들이 자신들의 안전을 확보하고 영혼의 복수를 막기 위한 의도적인 의식이었음을 최종적으로 밝히고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">broke the statue’s nose 3형식 구조: 주어(they) + 타동사(broke) + 목적어(statue&#39;s nose) 구조입니다.</div><div class=\"lec-gr-item\">to destroy (to부정사(부사적)): &#39;파괴하기 위해서&#39;라는 목적을 나타내는 부사적 용법입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">soul</td><td class=\"m\">영혼, 정신</td></tr><tr><td class=\"w\">destroy</td><td class=\"m\">파괴하다, 무너뜨리다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>고대 이집트 조각상의 코가 유독 많이 훼손된 점에 대해 부식이라는 가설이 있지만, 이는 완벽한 설명이 되지 못한다.</li><li>이집트인들은 조각상에 죽은 자의 영혼이 깃든다고 믿었고, 코가 생명의 통로라고 생각했다.</li><li>따라서 도굴꾼들은 무덤의 보물을 훔칠 때, 영혼의 위협을 제거하고 영혼을 소멸시키기 위해 조각상의 코를 가장 먼저 부러뜨렸다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Ancient statues often have broken noses because Egyptians believed the nose was the source of life, and destroying it served to eliminate the soul residing within the figure.</div>\n              <div class=\"lec-final-sum-ko\">고대 이집트인들은 코를 생명의 근원으로 여겼기 때문에, 조각상 안의 영혼을 없애기 위해 조각상의 코를 파괴했다.</div></div></div>"],"segs":[[{"audio":"./passage07_audio/1.mp3","hl":null}],[{"audio":"./passage07_audio/2.mp3","hl":null}],[{"audio":"./passage07_audio/3.mp3","hl":null},{"audio":"./passage07_audio/4.mp3","hl":"stage-0"},{"audio":"./passage07_audio/5.mp3","hl":"stage-1"},{"audio":"./passage07_audio/6.mp3","hl":"stage-2"},{"audio":"./passage07_audio/7.mp3","hl":"stage-3"}],[{"audio":"./passage07_audio/8.mp3","hl":null}],[{"audio":"./passage07_audio/9.mp3","hl":"main"},{"audio":"./passage07_audio/10.mp3","hl":"meaning"},{"audio":"./passage07_audio/11.mp3","hl":"grammar"}],[{"audio":"./passage07_audio/12.mp3","hl":"main"},{"audio":"./passage07_audio/13.mp3","hl":"meaning"},{"audio":"./passage07_audio/14.mp3","hl":"grammar"}],[{"audio":"./passage07_audio/15.mp3","hl":"main"},{"audio":"./passage07_audio/16.mp3","hl":"meaning"},{"audio":"./passage07_audio/17.mp3","hl":"grammar"}],[{"audio":"./passage07_audio/18.mp3","hl":"main"},{"audio":"./passage07_audio/19.mp3","hl":"meaning"},{"audio":"./passage07_audio/20.mp3","hl":"grammar"}]
