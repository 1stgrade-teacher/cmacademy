><li>지루할 것이라 예상한 사우스다코타 여행에서 소피아는 휴대폰에만 몰두한다.</li><li>여행지에 대한 부정적인 선입견(boring states)</li><li>여행 중 휴대폰만 보는 소피아(on her phone)</li><li>친구의 즐거운 여행 사진을 부러워함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02오빠의 조언</div><ul><li>오빠 토니는 여행을 모험으로 바꿀 수 있다는 긍정적인 태도를 제시한다.</li><li>여행에 대한 오빠의 긍정적인 시각(exciting adventure)</li><li>어떤 일이든 일어날 수 있다는 가능성 제시</li><li>휴대폰 세상에서 현실의 여행으로 관심을 돌리도록 유도</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03예상치 못한 사건</div><ul><li>자동차 타이어가 펑크 나는 돌발 상황이 발생하며 여행의 흐름이 바뀐다.</li><li>갑작스러운 타이어 펑크(flat tire) 발생</li><li>아빠의 안전 지시와 차 안에서의 대기</li><li>일상적인 여행이 예기치 못한 상황으로 전환됨</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04뜻밖의 경험</div><ul><li>길을 지나가는 들소 떼를 목격하며 여행은 기대하지 않았던 모험이 된다.</li><li>예상치 못한 들소 떼(bison)의 등장</li><li>놀라움 속에서 사진을 찍는 소피아</li><li>여행이 진짜 모험으로 변했음을 확인(real adventure)</li><li>핵심 키워드: 들소(bison), 모험(adventure)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">boring</td><td class=\"m\">지루한, 재미없는</td></tr><tr><td class=\"w\">on the way</td><td class=\"m\">가는 도중에, 도중에</td></tr><tr><td class=\"w\">adventure</td><td class=\"m\">모험, 신기한 경험</td></tr><tr><td class=\"w\">anything can happen</td><td class=\"m\">무슨 일이든 일어날 수 있다</td></tr><tr><td class=\"w\">get a flat tire</td><td class=\"m\">타이어 펑크가 나다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">stay safe</td><td class=\"m\">안전을 유지하다, 안전하게 머무르다</td></tr><tr><td class=\"w\">fix</td><td class=\"m\">수리하다, 고치다</td></tr><tr><td class=\"w\">pass by</td><td class=\"m\">지나가다</td></tr><tr><td class=\"w\">expect</td><td class=\"m\">예상하다, 기대하다</td></tr><tr><td class=\"w\">turn into</td><td class=\"m\">~로 변하다, ~이 되다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Sophia의 가족은</span><span class=\"en\"><b>Sophia’s family</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여행을 가는 중이었다</span><span class=\"en\"><b><span class=\"grammar-hl\">was on a trip</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사우스다코타로.</span><span class=\"en\"><b>to South Dakota.</b></span></div></div><div class=\"lec-sent-ko\">Sophia의 가족은 사우스다코타로 여행을 가는 중이었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 도입부로서 소피아 가족이 여행 중이라는 상황을 제시하며, 이후 벌어질 사건의 배경이 되는 공간을 설정합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was on a trip (관용표현): be on a trip는 ‘여행 중이다’라는 의미의 숙어 구조이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Sophia는 생각했다</span><span class=\"en\"><b>Sophia thought</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 여행이</span><span class=\"en\"><b>this trip</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지루하겠다고</span><span class=\"en\"><b><span class=\"grammar-hl\">would be</span> boring</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들이 ~라고 해서</span><span class=\"en\"><b>because <span class=\"grammar-hl\">people say</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사우스다코타가</span><span class=\"en\"><b><span class=\"grammar-hl\">South Dakota</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가장 지루한 주(州) 중 하나라고</span><span class=\"en\"><b><span class=\"grammar-hl\">is</span> <span class=\"grammar-hl\">one of the most boring states</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">미국에서.</span><span class=\"en\"><b>in America.</b></span></div></div><div class=\"lec-sent-ko\">Sophia는 사람들이 사우스다코타가 미국에서 가장 지루한 주(州) 중 하나라고 해서 이 여행이 지루하 "en\"><b>to Florida.</b></span></div></div><div class=\"lec-sent-ko\">그녀는 그에게 자신의 친구인 Ally의 플로리다로의 흥미로운 여행 사진들을 보여주었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 소피아가 스마트폰에 빠져 있었던 이유를 구체적으로 밝힙니다. 다른 사람의 화려한 일상을 부러워하며 현재 자신의 여행을 무가치하게 여기고 있음을 암시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">exciting trip (현재분사): 현재분사 exciting이 뒤의 명사 trip을 수식하여 ‘흥미진진한 여행’이라는 상태를 나타낸다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Tony는 말했다</span><span class=\"en\"><b>Tony said, “</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">야,</span><span class=\"en\"><b>“Hey,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리 여행도</span><span class=\"en\"><b>our trip</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">될 수 있어</span><span class=\"en\"><b><span class=\"grammar-hl\">can be</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">신나는 모험이</span><span class=\"en\"><b><span class=\"grammar-hl\">an exciting adventure</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또한.</span><span class=\"en\"><b>too.</b></span></div></div><div class=\"lec-sent-ko\">Tony는 “야, 우리 여행도 신나는 모험이 될 수 있어.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 소피아의 부정적 인식을 바꾸려는 토니의 능동적인 가치관을 드러냅니다. 예상치 못한 상황이 곧 닥칠 것임을 알리는 복선 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">can be an exciting adventure (현재분사): 현재분사 exciting이 뒤의 명사 adventure를 수식하여 ‘흥미진진한 모험’이라는 상태를 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">adventure</td><td class=\"m\">모험, 신기한 경험</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">무슨 일이든</span><span class=\"en\"><b><span class=\"grammar-hl\">Anything</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">일어날 수 있어!</span><span class=\"en\"><b><span class=\"grammar-hl\">can happen</span>!”</b></span></div></div><div class=\"lec-sent-ko\">무슨 일이든 일어날 수 있어!”라고 말했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 토니의 말이 끝나기 무섭게 돌발 상황이 발생합니다. 여행이 단순히 지루할 것이라는 소피아의 예상을 깨고 사건이 본격적으로 전개됨을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Anything can happen (기본문장구조): 주어(Anything) + 동사(can happen)로 이루어진 자동사 중심의 문장 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">anything can happen</td><td class=\"m\">무슨 일이든 일어날 수 있다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">바로 그때,</span><span class=\"en\"><b>Just then,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 차는</span><span class=\"en\"><b>their car</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">타이어에 펑크가 났다.</span><span class=\"en\"><b><span class=\"grammar-hl\">got a flat tire</span>.</b></span></div></div><div class=\"lec-sent-ko\">바로 그때, 그들의 차는 타이어에 펑크가 났다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 토니의 말이 끝나기 무섭게 돌발 상황이 발생합니다. 여행이 단순히 지루할 것이라는 소피아의 예상을 깨고 사건이 본격적으로 전개됨을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">got a flat tire (관용표현): ‘타이어가 펑크 나다’라는 의미로 쓰이는 숙어이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들의 아빠는 차를 세우고</span><span class=\"en\"><b>Their dad stopped the car</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이야기했다</span><span class=\"en\"><b>and said, “</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">안전히 있으렴</span><span class=\"en\"><b>“Stay safe</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">차 안에</span><span class=\"en\"><b>in the car</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">내가 타이어를 고치는 동안.</span><span class=\"en\"><b><span class=\"grammar-hl\">while I fix the tire</span>.”</b></span></div></div><div class=\"lec-sent-ko\">그들의 아빠는 차를 세우고 “내가 타이어를 고치는 동안 차 안에 안전히 있으렴.”이라고 이야기했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 타이어 펑크라는 문제 상황을 해결하기 위해 아빠가 주도적으로 대처하는 모습입니다. 가족들이 차 안에 머물러야 하는 객관적인 상황을 설정합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">while I fix the tire 분사구문(대조적 구조): while은 접속사로, 주어(I) + 동사(fix)가 갖추어진 부사절 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">stay safe</td><td class=\"m\">안전을 유지하다, 안전하게 머무르다</td></tr><tr><td class=\"w\">fix</td><td class=\"m\">수리하다, 고치다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은 기다리는 동안,</span><span class=\"en\"><b><span class=\"grammar-hl\">As they waited</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 보았다</span><span class=\"en\"><b>they saw</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">큰 무리의 들소들이</span><span class=\"en\"><b>a large group of *bison</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지나가는 것을.</span><span class=\"en\"><b>passing by.</b></span></div></div><div class=\"lec-sent-ko\">그들은 기다리는 동안, 큰 무리의 들소들이 지나가는 것을 보았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 차에 멈춰 서 있는 동안 예기치 않은 볼거리를 마주하게 됩니다. 지루할 것이라던 예상과는 달리, 뜻밖의 즐거움이 찾아오는 장면입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">As they waited (분사구문): 접속사 As가 이끄는 절로, 주어(they) + 동사(waited) 구조이다.</div><div class=\"lec-gr-item\">a large group of bison passing by (현재분사): a large group of bison을 수식하며, ‘지나가고 있는 바이슨 무리’라는 동작을 나타낸다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 11 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Sophia는 놀라서</span><span class=\"en\"><b>Sophia <span class=\"grammar-hl\">was surprised</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">말했다</span><span class=\"en\"><b>and said,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">와!</span><span class=\"en\"><b>“Wow!</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나는 예상하지 못했어</span><span class=\"en\"><b>I didn’t expect</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저런 걸 보게 될 거라고.</span><span class=\"en\"><b><span class=\"grammar-hl\">to see that</span>!”</b></span></div></div><div class=\"lec-sent-ko\">(Sophia는 놀라서 말했다, “와! 나는 저런 걸 보게 될 거라고 예상하지 못했어!”)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 소피아의 감정 변화를 나타냅니다. 고정관념에 사로잡혔던 그녀가 실제 현실의 흥미로운 경험을 직접 받아들이기 시작하는 지점입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was surprised (수동태): be동사(was)+p.p.(surprised) 구조이다. surprise는 타동사인데 목적어가 없어서 수동구조(was surprised) 형태로 쓰며, 기본구조는 V(surprise) + O(목적어)이다.</div><div class=\"lec-gr-item\">to see that (to부정사): expect의 목적어로 쓰인 명사적 용법의 to부정사 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">expect</td><td class=\"m\">예상하다, 기대하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 12 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀는 재빨리 휴대전화를 들었다</span><span class=\"en\"><b>She quickly lifted her phone</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사진을 찍기 위해.</span><span class=\"en\"><b><span class=\"grammar-hl\">to take pictures</span>.</b></span></div></div><div class=\"lec-sent-ko\">그녀는 사진을 찍기 위해 재빨리 휴대전화를 들었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 3번 문장에서 타인의 여행을 훔쳐보던 스마트폰 사용 행위가, 이제는 자신의 직접적인 경험을 기록하는 능동적인 행위로 변화했음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to take pictures (to부정사): 목적을 나타내는 부사적 용법의 to부정사 구조이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 13 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Tony는 미소를 지으며</span><span class=\"en\"><b>Tony smiled</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">말했다</span><span class=\"en\"><b>and said,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">봐!</span><span class=\"en\"><b>“See!</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 여행이</span><span class=\"en\"><b>Our trip</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">바뀌고 있어</span><span class=\"en\"><b>is <span class=\"grammar-hl\">turning into</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이제 진정한 모험으로.</span><span class=\"en\"><b>a real adventure now!”</b></span></div></div><div class=\"lec-sent-ko\">(Tony는 미소를 지으며 말했다, “봐! 이제 우리의 여행이 진정한 모험으로 바뀌고 있어!”)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 여행의 성격이 따분한 이동에서 흥미로운 모험으로 바뀌었다는 것을 확인하며, 6번 문장에서 언급했던 토니의 주장이 현실화되었음을 결론짓습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">turning into (현재진행): be동사(is) + -ing(turning) 구조로, ‘~로 변해가는 중이다’라는 의미를 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">adventure</td><td class=\"m\">모험, 신기한 경험</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>소피아는 사우스다코타 여행이 지루할 것이라 생각하여 휴대전화만 보았다.</li><li>토니는 여행 중 어떤 일이든 벌어질 수 있다며 소피아를 설득한다.</li><li>차 타이어가 펑크 나는 돌발 상황 속에서 들소 떼를 마주하는 특별한 경험을 한다.</li><li>고정관념을 버린 소피아는 자신의 여행이 모험임을 깨닫고 능동적으로 변화한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Sophia initially expected her trip to be boring, but she experienced an exciting adventure after encountering a herd of bison during a car breakdown.</div>\n              <div class=\"lec-final-sum-ko\">소피아는 처음에 여행이 지루할 것이라 예상했지만, 자동차 고장 중 들소 떼를 마주하며 흥미진진한 모험을 경험했다.</div></div></div>"],"segs":[[{"audio":"./passage08_audio/1.mp3","hl":null}],[{"audio":"./passage08_audio/2.mp3","hl":null}],[{"audio":"./passage08_audio/3.mp3","hl":null},{"audio":"./passage08_audio/4.mp3","hl":"stage-0"},{"audio":"./passage08_audio/5.mp3","hl":"stage-1"},{"audio":"./passage08_audio/6.mp3","hl":"stage-2"},{"audio":"./passage08_audio/7.mp3","hl":"stage-3"}],[{"audio":"./passage08_audio/8.mp3","hl":null}],[{"audio":"./passage08_audio/9.mp3","hl":"main"},{"audio":"./passage08_audio/10.mp3","hl":"meaning"},{"audio":"./passage08_audio/11.mp3","hl":"grammar"}],[{"audio":"./passage08_audio/12.mp3","hl":"main"},{"audio":"./passage08_audio/13.mp3","hl":"meaning"},{"audio":"./passage08_audio/14.mp3","hl":"gram
