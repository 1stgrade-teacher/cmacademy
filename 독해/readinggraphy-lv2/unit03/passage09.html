-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01연구 배경</div><ul><li>사람마다 음악에 맞춰 춤을 추는 능력에 차이가 나는 이유를 과학자들이 탐구했다.</li><li>춤을 추거나 비트에 맞춰 움직이는 능력의 차이</li><li>과학자들이 밝혀낸 선천적 능력의 근거</li><li>핵심 키워드: 리듬감(rhythm), 유전적 요인(genetic factor)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02유전적 영향</div><ul><li>우리의 춤 실력과 리듬감은 특정 유전자에 의해 결정된다는 사실이 밝혀졌다.</li><li>음악에 맞춰 춤추고 박수를 치게 돕는 특수 유전자 발견</li><li>수백 개의 유전자가 리듬을 유지하는 데 관여함</li><li>핵심 키워드: 유전자(genes), 리듬 감각(sense of rhythm)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03리듬감의 확장</div><ul><li>리듬감은 단순히 춤을 추는 것뿐만 아니라 일상적인 신체 활동과도 밀접하게 연결되어 있다.</li><li>걷기나 호흡과 같은 일상 활동과의 연관성</li><li>신체 내부에 내재된 생체 리듬의 역할</li><li>핵심 키워드: 일상 활동(everyday activities), 신체 리듬(bodily rhythm)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">naturally</td><td class=\"m\">타고나게, 본래, 자연스럽게</td></tr><tr><td class=\"w\">discover</td><td class=\"m\">발견하다, 알아내다</td></tr><tr><td class=\"w\">clap along with</td><td class=\"m\">~에 맞춰 손뼉을 치다</td></tr><tr><td class=\"w\">keep rhythm</td><td class=\"m\">박자를 맞추다, 리듬을 타다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">tap</td><td class=\"m\">가볍게 두드리다, 톡톡 치다</td></tr><tr><td class=\"w\">sense of rhythm</td><td class=\"m\">리듬감</td></tr><tr><td class=\"w\">be linked to</td><td class=\"m\">~와 관련되다, ~와 연결되다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여러분은 즐기나요</span><span class=\"en\"><b>Do you enjoy</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">음악에 맞춰 춤추는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">dancing</span> to music</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">혹은 리듬에 맞춰 움직이는 것을?</span><span class=\"en\"><b>or <span class=\"grammar-hl\">moving</span> to a beat?</b></span></div></div><div class=\"lec-sent-ko\">여러분은 음악에 맞춰 춤을 추거나 리듬에 맞춰 움직이는 것을 즐기나요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자에게 질문을 던져 리듬감과 신체 활동에 대한 흥미를 유도하며 글의 주제를 자연스럽게 소개하는 도입부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">dancing (동명사): 전치사 to의 목적어로 쓰여 &#39;춤추는 것&#39;이라는 명사적 역할을 함</div><div class=\"lec-gr-item\">moving (동명사): 전치사 to의 목적어로 쓰여 &#39;움직이는 것&#39;이라는 명사적 역할을 함</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어떤 사람들은</span><span class=\"en\"><b>Some people</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자연스럽게 춤을 더 잘 춥니다</span><span class=\"en\"><b>naturally dance <span class=\"grammar-hl\">better</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 사람들보다.</span><span class=\"en\"><b>than others.</b></span></div></div><div class=\"lec-sent-ko\">어떤 사람들은 타고나기를 다른 사람들보다 춤을 더 잘 춰요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 1번 문장에서 언급한 활동에 대해 사람들마다 실력 차이가 존재함을 밝히며, 그 원인을 탐구할 것임을 암시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">better (관용표현): 부사 well의 비교급으로, &#39;더 잘&#39;이라는 의미를 가짐</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">naturally</td><td class=\"m\">타고나게, 본래, 자연스럽게</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">과학자 한 팀이</span><span class=\"en\"><b><span class=\"grammar-hl\">A team of scientists</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">찾아냈습니다</span><span class=\"en\"><b><span class=\"grammar-hl\">found</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이유를</span><span class=\"en\"><b><span class=\"grammar-hl\">a</span> reason</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이것에 대한.</span><span class=\"en\"><b>for this.</b></span></div></div><div class=\"lec-sent-ko\">과학자로 이루어진 한 팀이 이것에 대한 이유를 찾아냈어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 2번 문장의 실력 차이가 발생하는 근거를 제시하겠다는 신호이며, 글의 본격적인 전개를 예고합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">A team of scientists found a 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은 최근에 발견했습니다</span><span class=\"en\"><b>They recently discovered</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">특별한 유전자들을.</span><span class=\"en\"><b>special genes.</b></span></div></div><div class=\"lec-sent-ko\">그들은 최근에 특별한 유전자들을 발견했어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 3번 문장에서 언급한 &#39;이유&#39;가 무엇인지 구체적으로 밝히며, 개인의 능력이 유전적 요인에 의해 결정됨을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">They recently discovered special *genes. 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">discover</td><td class=\"m\">발견하다, 알아내다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 유전자들은</span><span class=\"en\"><b>These genes</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">돕습니다 우리가</span><span class=\"en\"><b><span class=\"grammar-hl\">help us</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">춤추고 박수 치도록</span><span class=\"en\"><b><span class=\"grammar-hl\">dance and clap</span> along</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">음악에 맞춰.</span><span class=\"en\"><b>with music.</b></span></div></div><div class=\"lec-sent-ko\">이 유전자들은 우리가 음악에 맞춰 춤을 추거나 박수를 치는 데 도움을 줘요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 4번 문장의 &#39;특별한 유전자&#39;가 우리 몸에서 구체적으로 어떤 역할을 하는지 부연 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">help us dance and clap 5형식(SVOC) 구조: help(동사) + us(목적어) + dance and clap(목적격보어, 동사원형). help는 목적격보어로 to부정사나 동사원형을 취함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">clap along with</td><td class=\"m\">~에 맞춰 손뼉을 치다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것은 의미합니다</span><span class=\"en\"><b><span class=\"grammar-hl\">This means</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 춤추는 솜씨가</span><span class=\"en\"><b><span class=\"grammar-hl\">our dancing skills</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">실제로 온다는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">actually</span> come from</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 유전자로부터!</span><span class=\"en\"><b>our genes!</b></span></div></div><div class=\"lec-sent-ko\">이는 우리의 춤추는 솜씨가 사실은 우리의 유전자에서 기인한다는 것을 의미해요!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 5번 문장의 기능을 요약하여, 춤 실력이라는 후천적 활동이 생물학적 기제에 기반하고 있음을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">This means our dancing skills actually 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사실,</span><span class=\"en\"><b>In fact,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">있습니다</span><span class=\"en\"><b>there are</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수백 개의 유전자가</span><span class=\"en\"><b>hundreds of <span class=\"grammar-hl\">genes</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 리듬을 유지하도록 돕는.</span><span class=\"en\"><b><span class=\"grammar-hl\">that help us keep rhythm</span>.</b></span></div></div><div class=\"lec-sent-ko\">사실, 우리에게는 리듬을 유지하도록 도와주는 수백 개의 유전자가 있어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 6번 문장의 결론을 뒷받침하기 위해 유전자가 단 하나가 아니라 매우 복합적인 시스템임을 알려주며 신뢰성을 높입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">genes that help us keep rhythm (관계대명사): 주격 관계대명사 that이 선행사 genes를 수식하며, 절 내부에서 that이 주어 역할을 함. 뒤에 동사 help가 이어짐</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">keep rhythm</td><td class=\"m\">박자를 맞추다, 리듬을 타다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리가 발을 구르거나, 손뼉을 치거나, 음악에 맞춰 춤을 출 때,</span><span class=\"en\"><b><span class=\"grammar-hl\">When we tap our foot, clap our hands, or dance to music</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 보여줄 수 있습니다</span><span class=\"en\"><b>it can show</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 자연스러운 리듬 감각을.</span><span class=\"en\"><b>our natural sense of rhythm.</b></span></div></div><div class=\"lec-sent-ko\">우리가 발을 가볍게 두드리거나, 박수를 치거나, 음악에 맞춰 춤을 출 때, 그것은 우리의 자연스러운 리듬 감각을 보여줄 수 있어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 유전자가 만들어내는 리듬감이 일상적인 신체 행동 속에 어떻게 반영되어 나타나는지를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">When we tap our foot, clap our hands, or dance to music 분사구문(축약형 아님): 시간의 접속사 When이 이끄는 부사절 구조</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">tap</td><td class=\"m\">가볍게 두드리다, 톡톡 치다</td></tr><tr><td class=\"w\">sense of rhythm</td><td class=\"m\">리듬감</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 리듬 감각은</span><span class=\"en\"><b>This sense of rhythm</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">만듭니다 우리를</span><span class=\"en\"><b><span class=\"grammar-hl\">makes us</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">음악적인 상태로.</span><span class=\"en\"><b><span class=\"grammar-hl\">musical</span>.</b></span></div></div><div class=\"lec-sent-ko\">이 리듬감이 우리를 음악적으로 만들어줘요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 8번 문장에서 언급한 리듬감이 단순히 움직임을 넘어, 음악성을 결정짓는 핵심 요소임을 정리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">makes us musical 5형식(SVOC) 구조: make(동사) + us(목적어) + musical(형용사, 목적격보어)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sense of rhythm</td><td class=\"m\">리듬감</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러나,</span><span class=\"en\"><b><span class=\"grammar-hl\">However,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 리듬 감각은</span><span class=\"en\"><b><span class=\"grammar-hl\">our sense of rhythm</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">중요하지 만은 않습니다</span><span class=\"en\"><b><span class=\"grammar-hl\">isn’t</span> only important</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">춤추는 데에만.</span><span class=\"en\"><b>for dancing.</b></span></div></div><div class=\"lec-sent-ko\">그러나, 우리의 리듬 감각은 오직 춤추는 데에만 중요한 것이 아니에요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 화제를 전환하여 리듬감의 영향력이 춤이라는 범위를 넘어 더 넓은 영역으로 확장됨을 알립니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">However, our sense of rhythm isn’t 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sense of rhythm</td><td class=\"m\">리듬감</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 11 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 또한 연결되어 있습니다</span><span class=\"en\"><b><span class=\"grammar-hl\">It’s also linked</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">일상적인 활동들과</span><span class=\"en\"><b><span class=\"grammar-hl\">to everyday activities</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">— 걷기나 숨 쉬기와 같은.</span><span class=\"en\"><b>— like walking and breathing.</b></span></div></div><div class=\"lec-sent-ko\">그것은 걷기와 숨 쉬기 같은 일상적인 활동과도 연관되어 있어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 10번 문장에 이어 리듬감이 인간의 생존과 직결된 기본적인 신체 활동에도 관여함을 구체적인 예시로 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It’s also linked to everyday activities 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        ","<div class=\"lec-sent-no\">문장 12 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러니,</span><span class=\"en\"><b>So,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분이 춤을 추고 있거나, 심지어 걷고 있을 때도,</span><span class=\"en\"><b><span class=\"grammar-hl\">when you’re dancing, or even walking</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">생각해 보세요</span><span class=\"en\"><b>think of</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분의 유전자에 대해.</span><span class=\"en\"><b>your genes.</b></span></div></div><div class=\"lec-sent-ko\">그러니, 여러분이 춤을 추고 있을 때나 걷고 있을 때도, 유전자에 대해 생각해 보세요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자들에게 일상 속 평범한 동작조차 유전자의 정교한 작용임을 상기시키며 글을 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">when you’re dancing, or even walking (현재진행): be동사(’re) + -ing(dancing/walking) 형태로 진행 중인 동작을 나타냄</div></div>\n        ","<div class=\"lec-sent-no\">문장 13 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것들은 만드는 것을 돕습니다</span><span class=\"en\"><b>They <span class=\"grammar-hl\">help make</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">리듬을</span><span class=\"en\"><b><span class=\"grammar-hl\">the rhythm</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분의 삶 속의!</span><span class=\"en\"><b>in your life!</b></span></div></div><div class=\"lec-sent-ko\">그것들은 여러분의 삶에서 리듬을 만드는 데 도움을 주고 있어요!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글 전체를 관통하는 핵심을 요약하며, 유전자가 인간의 생명 활동 전반을 조율한다는 의미를 전달합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">help make the rhythm 5형식(SVOC) 구조: help(동사) + make the rhythm(목적어). 여기서 make는 help의 목적어로 쓰인 동사원형임</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>사람마다 춤 실력이 다른 이유는 유전적인 영향 때문이다.</li><li>수백 개의 유전자가 우리의 리듬감을 형성하며, 이는 음악 활동뿐만 아니라 걷기나 호흡 같은 필수적인 생명 활동에도 관여한다.</li><li>우리가 일상적으로 행하는 모든 움직임 속에는 유전자가 만든 생체 리듬이 녹아 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Scientists discovered that specific genes govern our natural sense of rhythm, and this innate ability facilitates both musical expression and essential daily movements.</div>\n              <div class=\"lec-final-sum-ko\">과학자들은 특정 유전자가 우리의 타고난 리듬감을 관장함을 발견했으며, 이러한 본능적 능력은 음악적 표현과 필수적인 일상 활동을 모두 가능하게 한다.</div></div></div>"],"segs":[[{"audio":"./passage09_audio/1.mp3","hl":null}],[{"audio":"./passage09_audio/2.mp3","hl":null}],[{"audio":"./passage09_audio/3.mp3","hl":null},{"audio":"./passage09_audio/4.mp3","hl":"stage-0"},{"audio":"./passage09_audio/5.mp3","hl":"stage-1"},{"audio":"./passage09_audio/6.mp3","hl":"stage-2"}],[{"audio":"./passage09_audio/7.mp3","hl":null}],[{"audio":"./passage09_audio/8.mp3","hl":"main"},{"audio":"./passage09_audio/9.mp3","hl":"meaning"},{"audio":"./passage09_audio/10.mp3","hl":"grammar"}],[{"audio":"./passage09_audio/11.mp3","hl":"main"},{"audio":"./passage09_audio/12.mp3","hl":"meaning"},{"audio":"./passage09_audio/13.mp3","hl":"grammar"}],[{"audio":"./passage09_audio/14.mp3","hl":"main"},{"audio":"./passage09_audio/15.mp3","hl":"meaning"},{"audio":"./passa
