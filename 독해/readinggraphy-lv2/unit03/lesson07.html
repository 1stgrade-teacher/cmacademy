</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}

    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}

  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}

lecturePlayer(document.getElementById("app"),{"brand":"청명학원 영어과","title":"리딩그라피2 리딩그라피레벨2 7번","audioDir":"audio","preview":false,"count":51,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.400em\">리딩그라피레벨2\u003cbr>7번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩그라피2\u003c/div>\u003ch1>The Mystery of Missing Noses on Ancient Egyptian Statues\u003c/h1>\u003ch2>고대 이집트 조각상의 사라진 코에 얽힌 비밀\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>고대 이집트 조각상의 코가 부러진 것은 단순한 \u003cb class=\"key\">침식 \u003c/b>\u003cb class=\"key\">작용\u003c/b>이 아니라, 죽은 자의 영혼이 보복하지 못하도록 \u003cb class=\"key\">생명의 \u003c/b>\u003cb class=\"key\">근원\u003c/b>인 코를 파괴하려 했던 의도적인 행동이었습니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The broken noses of ancient Egyptian statues were not accidental but intentional acts to destroy the soul's source of life.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 박물관에서 흔히 볼 수 있는 고대 이집트 조각상들의 숨겨진 비밀에 대해 배워볼 거예요. 왜 유독 조각상의 코만 부러져 있는지 궁금해 본 적 있나요? 이번 수업을 통해 그 미스터리를 풀고, 이집트인들의 독특한 내세관에 대해서도 함께 알아보겠습니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">고대 이집트인들은 사람이 죽은 뒤에도 \u003cb class=\"key\">사후세계\u003c/b>(Afterlife)가 이어진다고 믿었습니다. 특히 죽은 사람의 영혼인 \u003cb class=\"key\">Ka\u003c/b>(카)가 육체 대신 조각상에 머물며 현실 세계와 연결된다고 생각했죠. 이는 마치 우리가 온라인 게임에서 \u003cb class=\"key\">아바타\u003c/b>(Avatar)를 통해 가상 세계와 소통하는 것과 비슷한 개념입니다. 하지만 도굴꾼들은 파라오의 무덤에서 보물을 훔칠 때, 죽은 자의 영혼이 자신들을 벌할까 봐 두려워했습니다. 그래서 그들은 영혼의 통로를 차단하기 위해 조각상을 훼손하는 \u003cb class=\"key\">주술적 \u003c/b>\u003cb class=\"key\">행위\u003c/b>를 하게 된 것입니다.\u003c/div>","segs":[{"n":2,"text":"강의에 들어가기 전에 배경지식을 쌓아볼까요? 고대 이집트인들은 사람이 죽어도 영혼은 살아남는다고 믿는 사후세계를 아주 중요하게 생각했어요. 그들은 죽은 자의 영혼인 Ka가 현실 세계의 조각상 안에 머무르며 생명을 이어간다고 믿었죠. 마치 영화에서 주인공의 정신이 다른 육체로 들어가는 것과 비슷하다고 생각하면 이해하기 쉬워요. 그런데 이런 믿음이 때로는 도굴꾼들에게 공포를 주기도 했답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>도입 및 현상 제시\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>박물관의 고대 이집트 조각상들 중 상당수가 \u003cb class=\"key\">코가 \u003c/b>\u003cb class=\"key\">없다\u003c/b>는 흥미로운 사실을 언급하며 독자의 주의를 환기합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>통념과 그에 대한 반박\u003csmall>통념 및 반박 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>코가 부러진 이유가 자연스러운 \u003cb class=\"key\">침식 \u003c/b>\u003cb class=\"key\">작용\u003c/b> 때문이라는 일반적인 통념을 제시한 뒤, 건물 안의 조각상 사례를 통해 이를 \u003cb class=\"key\">반박\u003c/b>합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>이집트의 내세관\u003csmall>근거 및 배경 · 문장 6–9\u003c/small>\u003c/h4>\u003cp>죽은 자의 영혼이 \u003cb class=\"key\">조각상\u003c/b>으로 이동한다는 이집트인들의 믿음을 설명하며, 영혼을 제거하려면 조각상을 \u003cb class=\"key\">파괴\u003c/b>해야 했다는 논리를 펼칩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>코를 파괴한 구체적 이유\u003csmall>결론 · 문장 10–13\u003c/small>\u003c/h4>\u003cp>코는 \u003cb class=\"key\">생명의 \u003c/b>\u003cb class=\"key\">원천\u003c/b>인 숨을 쉬는 곳이기에, 도굴꾼들이 영혼을 \u003cb class=\"key\">영원히 \u003c/b>\u003cb class=\"key\">파괴\u003c/b>하기 위해 의도적으로 코를 부러뜨렸음을 밝히며 마무리합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 질문으로 시작해서 우리가 흔히 하는 오해를 바로잡고, 진짜 이유를 설명하는 순서로 진행됩니다.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서는 도입부로 박물관의 이집트 조각상들이 대부분 코가 없다는 흥미로운 관찰 사실을 독자들에게 던지고 있어요.","hl":"f0"},{"n":5,"text":"세 번째 문장부터 다섯 번째 문장까지는 통념을 다루죠. 많은 이들이 이것을 세월에 따른 corrosion 즉 침식 때문이라고 생각하지만, 실내에 있는 조각상들까지 코가 없다는 점을 들어 그 주장을 멋지게 반박합니다.","hl":"f1"},{"n":6,"text":"여섯 번째에서 아홉 번째 문장은 문화적 배경을 설명해요. 이집트인들은 soul 영혼이 조각상으로 이동한다고 믿었고, 영혼을 제거하려면 조각상을 destroy 파괴해야 했다는 논리적 근거를 보여줍니다.","hl":"f2"},{"n":7,"text":"마지막으로 열 번째부터 열세 번째 문장에서는 결정적인 해답이 나옵니다. 코가 바로 source of life 생명의 원천이었기 때문에, 도굴꾼들이 보물을 훔칠 때 영혼의 복수를 막으려고 영원히 그 코를 부러뜨렸다는 결론에 도달하게 됩니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">질문-답변 및 통념-반박\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 11번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글의 앞부분에서는 자연 침식이라는 \u003cb class=\"key\">통념을 \u003c/b>\u003cb class=\"key\">반박\u003c/b>하고, 중간 부분부터 이집트의 \u003cb class=\"key\">종교적 \u003c/b>\u003cb class=\"key\">믿음\u003c/b>을 근거로 제시합니다. 열한 번째 문장에서 코가 \u003cb class=\"key\">생명의 \u003c/b>\u003cb class=\"key\">근원\u003c/b>이라는 핵심 답을 제시하며 미스터리를 풀고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Interestingly (2)\u003c/b>\u003cspan>흥미로운 현상 제시\u003c/span>\u003cb>However (4)\u003c/b>\u003cspan>통념에 대한 역접 및 반박\u003c/span>\u003cb>Then, why (10)\u003c/b>\u003cspan>핵심 질문으로의 전환\u003c/span>\u003cb>So (12)\u003c/b>\u003cspan>인과 관계의 결과 제시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">statues\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">many of them\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the broken noses\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the statue\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the statue's nose\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>자연적 요인(Corrosion)\u003c/th>\u003cth>의도적 요인(Soul Destruction)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>세월에 의한 침식 작용\u003c/td>\u003ctd>도굴꾼들에 의한 의도적 파괴\u003c/td>\u003c/tr>\u003ctr>\u003ctd>건물 밖의 조각상에 해당\u003c/td>\u003ctd>건물 안팎의 모든 조각상에 해당\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 질문에 답을 하는 질문 답변 구조와 함께, 일반적인 생각을 뒤집는 통념 반박 구조를 취하고 있어요. 전체적으로는 정답이 글의 중간 이후에 등장하는 중괄식 구조라고 볼 수 있습니다.","hl":"ty"},{"n":9,"text":"글의 흐름을 바꿔주는 신호어들을 잘 보세요. 네 번째 문장의 However는 자연 침식설을 반박하기 위해 쓰였고, 열 번째 문장의 Then, why는 핵심 주제로 깊이 들어가는 질문의 역할을 합니다. 마지막 부분의 So는 이러한 종교적 믿음 때문에 도굴꾼들이 어떤 행동을 했는지 결론을 이끌어내고 있죠.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>statue\u003c/b>\u003cem>명사\u003c/em>\u003cspan>조각상\u003c/span>\u003c/div>\u003cdiv>\u003cb>ancient\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>고대의\u003c/span>\u003c/div>\u003cdiv>\u003cb>interestingly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>흥미롭게도\u003c/span>\u003c/div>\u003cdiv>\u003cb>missing\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>없어진, 분실된\u003c/span>\u003c/div>\u003cdiv>\u003cb>corrosion\u003c/b>\u003cem>명사\u003c/em>\u003cspan>부식, 침식\u003c/span>\u003c/div>\u003cdiv>\u003cb>explain\u003c/b>\u003cem>동사\u003c/em>\u003cspan>설명하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>mystery\u003c/b>\u003cem>명사\u003c/em>\u003cspan>수수께끼, 미스터리\u003c/span>\u003c/div>\u003cdiv>\u003cb>dead\u003c/b>\u003cem>명사\u003c/em>\u003cspan>죽은 자들\u003c/span>\u003c/div>\u003cdiv>\u003cb>believe\u003c/b>\u003cem>동사\u003c/em>\u003cspan>믿다\u003c/span>\u003c/div>\u003cdiv>\u003cb>soul\u003c/b>\u003cem>명사\u003c/em>\u003cspan>영혼\u003c/span>\u003c/div>\u003cdiv>\u003cb>move into\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 옮겨 가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>death\u003c/b>\u003cem>명사\u003c/em>\u003cspan>죽음\u003c/span>\u003c/div>\u003cdiv>\u003cb>remove\u003c/b>\u003cem>동사\u003c/em>\u003cspan>제거하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>destroy\u003c/b>\u003cem>동사\u003c/em>\u003cspan>파괴하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>source\u003c/b>\u003cem>명사\u003c/em>\u003cspan>근원, 원천\u003c/span>\u003c/div>\u003cdiv>\u003cb>steal\u003c/b>\u003cem>동사\u003c/em>\u003cspan>훔치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>treasure\u003c/b>\u003cem>명사\u003c/em>\u003cspan>보물\u003c/span>\u003c/div>\u003cdiv>\u003cb>pharaoh\u003c/b>\u003cem>명사\u003c/em>\u003cspan>파라오\u003c/span>\u003c/div>\u003cdiv>\u003cb>tomb\u003c/b>\u003cem>명사\u003c/em>\u003cspan>무덤\u003c/span>\u003c/div>\u003cdiv>\u003cb>forever\u003c/b>\u003cem>부사\u003c/em>\u003cspan>영원히\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"지문에서 corrosion은 침식 작용을 뜻하고, source는 무언가의 원천이나 근원을 말해요. 특히 tomb은 파라오의 무덤을 의미한다는 것도 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">corrosion\u003c/b>\u003cspan class=\"m\">침식, 부식\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">erosion\u003c/span>\u003cspan class=\"s\">decay\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">mystery\u003c/b>\u003cspan class=\"m\">수수께끼\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">puzzle\u003c/span>\u003cspan class=\"s\">riddle\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">clarity\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">remove\u003c/b>\u003cspan class=\"m\">제거하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">eliminate\u003c/span>\u003cspan class=\"s\">get rid of\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">keep\u003c/span>\u003cspan class=\"a\">add\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">destroy\u003c/b>\u003cspan class=\"m\">파괴하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">ruin\u003c/span>\u003cspan class=\"s\">demolish\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">create\u003c/span>\u003cspan class=\"a\">build\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">source\u003c/b>\u003cspan class=\"m\">근원, 원천\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">origin\u003c/span>\u003cspan class=\"s\">root\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어도 정리해 볼까요? corrosion은 erosion이나 decay로 바꿔 쓸 수 있고, destroy는 demolsh나 ruin과 같은 뜻입니다. mystery의 반대말은 명확함을 뜻하는 clarity가 될 수 있겠네요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">본 적이 있나요\u003c/span>\u003cspan class=\"en\">07 \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Have \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">ever \u003c/span>\u003cspan class=\"tgt\">seen\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고대 이집트의 조각상들을\u003c/span>\u003cspan class=\"en\">statues from ancient Egypt\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">박물관에서?\u003c/span>\u003cspan class=\"en\">in museums?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여러분은 박물관에서 고대 이집트의 조각상들을 본 적이 있나요?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글의 시작 부분에서 독자의 \u003cb class=\"key\">경험\u003c/b>을 물어보며 화제를 제시합니다. 이집트 조각상들의 \u003cb class=\"key\">외형적 \u003c/b>\u003cb class=\"key\">특징\u003c/b>에 대해 이야기를 시작하려는 도입부입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재완료의 경험 용법\u003c/span> : Have + [주어] + ever + [과거분사(p.p.)]? : \"본 적이 있나요\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Have you ever seen, 본 적이 있나요. statues from ancient Egypt, 고대 이집트의 조각상들을. in museums?, 박물관에서?. 이 문장 전체를 해석하면, 여러분은 박물관에서 고대 이집트의 조각상들을 본 적이 있나요?","hl":"m"},{"n":13,"text":"여러분, 박물관에 갔을 때 고대 이집트 조각상을 본 적이 있는지 물어보고 있어요. 우리가 앞으로 이야기할 주제인 조각상의 특징에 대해 관심을 끌기 위한 질문으로 글을 시작하고 있죠.","hl":"mn"},{"n":14,"text":"첫 번째 포인트는 Have you ever seen 부분입니다. Have와 과거분사인 seen이 만나서 과거부터 지금까지의 경험을 묻는 현재완료 시제가 되었어요. 중간에 들어간 ever는 경험의 의미를 더 살려주는 역할을 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">흥미롭게도,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Interestingly\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들 중 많은 조각상들이\u003c/span>\u003cspan class=\"en\">many of them\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">코가 없어요.\u003c/span>\u003cspan class=\"en\">are \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">missing\u003c/span> their noses.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">흥미롭게도, 그것들 중 많은 조각상들이 코가 없어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 조각상들의 \u003cb class=\"key\">공통된 \u003c/b>\u003cb class=\"key\">결함\u003c/b>을 언급하며 독자의 궁금증을 자극합니다. many of them은 앞 문장에 나온 \u003cb class=\"key\">고대 \u003c/b>\u003cb class=\"key\">이집트 \u003c/b>\u003cb class=\"key\">조각상들\u003c/b>을 가리킵니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">문장 전체를 수식하는 부사\u003c/span> : 부사(ly) + , + [주어] + [동사] : \"흥미롭게도\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">상태를 나타내는 형용사적 현재분사\u003c/span> : be동사 + missing + [목적어] : \"없는, 없어진\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Interestingly, 흥미롭게도. many of them, 그것들 중 많은 조각상들이. are missing their noses, 코가 없어요.. 이 문장 전체를 해석하면, 흥미롭게도, 그것들 중 많은 조각상들이 코가 없어요.","hl":"m"},{"n":16,"text":"앞에서 말한 그 많은 조각상들 중 상당수가 코가 잘려 나가거나 없다는 놀라운 사실을 말해주고 있네요. 독자들이 왜 그럴까 하고 궁금해하게 만드는 문장입니다.","hl":"mn"},{"n":17,"text":"첫 번째로 문장 맨 앞에 나온 Interestingly를 봐주세요. 문장 전체를 수식하면서 흥미로운 내용이 나올 것임을 암시합니다. 두 번째로 are missing 표현은 진행형 형태지만 여기서는 코가 보이지 않는 상태를 의미하고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몇몇 사람들은 생각했어요\u003c/span>\u003cspan class=\"en\">Some people \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">thought \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 부러진 코가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> the broken noses\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단지 침식 작용 때문이라고.\u003c/span>\u003cspan class=\"en\">were just \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">because \u003c/span>\u003cspan class=\"tgt\">of\u003c/span> *corrosion.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">몇몇 사람들은 그 부러진 코가 단지 침식 작용 때문이라고 생각했어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 코가 없어진 이유에 대해 흔히 가질 수 있는 \u003cb class=\"key\">과학적 \u003c/b>\u003cb class=\"key\">가설\u003c/b>을 먼저 제시합니다. 이후에 나올 \u003cb class=\"key\">종교적/문화적 \u003c/b>\u003cb class=\"key\">이유\u003c/b>와 대조를 이루기 위한 장치입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절을 이끄는 접속사 that\u003c/span> : thought [타동사] + that [접속사] + [주어 + 동사 (절)] : \"~라고 생각했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구\u003c/span> : because of + [명사/명사구] : \"~ 때문에\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Some people thought, 몇몇 사람들은 생각했어요. that the broken noses, 그 부러진 코가. were just because of *corrosion, 단지 침식 작용 때문이라고.. 이 문장 전체를 해석하면, 몇몇 사람들은 그 부러진 코가 단지 침식 작용 때문이라고 생각했어요.","hl":"m"},{"n":19,"text":"사람들이 코가 부러진 이유를 자연스럽게 깎여 나간 것이라고 추측했다는 내용이에요. 하지만 이 문장 뒤에는 아마도 이 생각이 틀렸거나 다른 이유가 있다는 내용이 이어지겠죠.","hl":"mn"},{"n":20,"text":"첫 번째 포인트는 thought 뒤에 나온 접속사 that입니다. 이 that은 뒤에 주어와 동사를 갖춘 문장을 끌고 와서 전체가 하나의 목적어 덩어리가 되게 해 줍니다. 두 번째로 because of 뒤에는 corrosion이라는 명사가 왔는데요. 절이 아니라 명사가 올 때는 because of를 써야 한다는 점을 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">However,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이는 설명하지 못해요\u003c/span>\u003cspan class=\"en\">this \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">doesn't \u003c/span>\u003cspan class=\"tgt\">explain\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 것을.\u003c/span>\u003cspan class=\"en\">everything.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나, 이는 모든 것을 설명하지 못해요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 언급된 '부식' 가설의 \u003cb class=\"key\">한계\u003c/b>를 지적하며, 글의 흐름을 새로운 \u003cb class=\"key\">가설\u003c/b>로 전환하는 \u003cb class=\"key\">역접\u003c/b>의 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">역접의 연결부사\u003c/span> : [However(연결어)], + [주어 + 동사] : \"그러나\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">일반동사의 부정문\u003c/span> : [do/does/did] + [not] + [동사원형(explain)] : \"설명하지 못한다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"However, 그러나. this doesn't explain, 이는 설명하지 못해요. everything, 모든 것을.. 이 문장 전체를 해석하면, 그러나, 이는 모든 것을 설명하지 못해요.","hl":"m"},{"n":22,"text":"이 문장은 앞에서 말한 부식 때문이라는 설명이 충분하지 않다는 점을 꼬집고 있어요. 이제부터 진짜 이유가 무엇인지 찾아보겠다는 신호탄과 같은 문장입니다.","hl":"mn"},{"n":23,"text":"첫 번째로 문장 맨 앞의 However를 주목해 보세요. 쉼표와 함께 쓰여서 앞의 내용과 반대되는 이야기를 시작하겠다는 역접의 연결어입니다. 두 번째로 doesn't explain은 주어가 단수라서 do가 아닌 does를 사용해 부정형을 만든 모습이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">조각상들조차\u003c/span>\u003cspan class=\"en\">Even statues\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">건물 안의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">inside \u003c/span>\u003cspan class=\"tgt\">buildings\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">코가 부러져 있어요.\u003c/span>\u003cspan class=\"en\">have \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">broken\u003c/span> noses.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">건물 안의 조각상들조차 코가 부러져있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 부식이 발생하기 어려운 실내 조각상의 사례를 들어 앞서 언급된 '부식 가설'의 \u003cb class=\"key\">모순\u003c/b>을 증명하는 구체적 \u003cb class=\"key\">근거\u003c/b>입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 용법\u003c/span> : [명사(statues)] + [전치사구(inside buildings)] : \"건물 안의\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사의 명사 수식\u003c/span> : [broken(과거분사)] + [명사(noses)] : \"부러진\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Even statues, 조각상들조차. inside buildings, 건물 안의. have broken noses, 코가 부러져 있어요.. 이 문장 전체를 해석하면, 건물 안의 조각상들조차 코가 부러져있어요.","hl":"m"},{"n":25,"text":"비바람을 피할 수 있는 건물 안에 있는 조각상들까지 코가 없다는 사실을 보여주고 있어요. 자연적인 부식으로는 설명되지 않는 부분이 있다는 증거를 제시한 것이죠.","hl":"mn"},{"n":26,"text":"첫 번째로 inside buildings라는 표현을 볼게요. 전치사구가 앞에 있는 명사인 statues를 꾸며주고 있어서 건물 안에 있는 조각상들이라고 해석하면 됩니다. 두 번째로 broken은 부러뜨리다라는 뜻의 break를 과거분사로 만든 것인데, 여기서는 부러진 상태의 코라는 의미로 쓰였어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">있을지도 몰라요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">might \u003c/span>\u003cspan class=\"tgt\">be\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또 다른 원인이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">another \u003c/span>\u003cspan class=\"tgt\">reason\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 미스터리에 대해.\u003c/span>\u003cspan class=\"en\">for this mystery.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 미스터리에는 또 다른 원인이 있을지도 몰라요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 부식 이외의 \u003cb class=\"key\">의도적인\u003c/b> 다른 이유가 존재할 가능성을 제시하며, 뒤에 이어질 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">정보\u003c/b>에 대한 독자의 호기심을 유발합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사가 포함된 유도부사 구문\u003c/span> : [There] + [might(조동사)] + [be(동사원형)] + [주어(another reason)] : \"~이 있을지도 모른다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부정형용사 another\u003c/span> : [another] + [단수명사(reason)] : \"또 다른 하나의 원인\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"There might be, 있을지도 몰라요. another reason, 또 다른 원인이. for this mystery, 이 미스터리에 대해.. 이 문장 전체를 해석하면, 이 미스터리에는 또 다른 원인이 있을지도 몰라요.","hl":"m"},{"n":28,"text":"이제 필자는 단순한 부식이 아니라 우리가 몰랐던 새로운 이유가 있을 거라고 암시하고 있어요. 독자의 궁금증을 유발하며 주제를 심화시키는 부분입니다.","hl":"mn"},{"n":29,"text":"첫 번째로 There might be를 살펴보겠습니다. 무엇이 있다라고 할 때 쓰는 There be 문장에 추측을 나타내는 might가 들어갔어요. 그래서 확신이 아니라 있을지도 모른다라는 느낌을 주는 것이죠. 두 번째로 another reason은 또 다른 하나의 이유라는 뜻인데, another 뒤에는 항상 reason처럼 셀 수 있는 단수 명사가 온다는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고대 이집트에서,\u003c/span>\u003cspan class=\"en\">In ancient Egypt,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들은 조각상을 만들었어요\u003c/span>\u003cspan class=\"en\">people made statues\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">죽은 자들을 위해.\u003c/span>\u003cspan class=\"en\">for \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">dead\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">고대 이집트에서, 사람들은 죽은 자들을 위해 조각상을 만들었어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 고대 이집트인들이 조각상을 만든 \u003cb class=\"key\">종교적 \u003c/b>\u003cb class=\"key\">배경\u003c/b>을 제시하며, 조각상이 단순히 장식품이 아니라 \u003cb class=\"key\">사후 \u003c/b>\u003cb class=\"key\">세계\u003c/b>와 관련된 도구였음을 암시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">the + 형용사\u003c/span> : the [정관사] + dead [형용사] : \"죽은 자들\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"In ancient Egypt, 고대 이집트에서. people made statues, 사람들은 조각상을 만들었어요. for the dead, 죽은 자들을 위해.. 이 문장 전체를 해석하면, 고대 이집트에서, 사람들은 죽은 자들을 위해 조각상을 만들었어요.","hl":"m"},{"n":31,"text":"이 문장은 고대 이집트인들이 조각상을 왜 만들었는지 그 종교적 배경을 설명해 줘요. 조각상이 사후 세계에서 중요한 역할을 했음을 알 수 있죠.","hl":"mn"},{"n":32,"text":"중요한 어법 포인트는 the dead예요. 정관사 the 뒤에 형용사가 오면 복수 보통명사가 되어 죽은 사람들이라고 해석한답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 믿었어요\u003c/span>\u003cspan class=\"en\">They believed\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람의 영혼이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that\u003c/span> a person's soul\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">조각상 안으로 옮겨 간다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">would\u003c/span> move into a statue\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">죽음 이후에.\u003c/span>\u003cspan class=\"en\">after death.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 죽음 이후 사람의 영혼이 조각상 안으로 옮겨 간다고 믿었어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이집트인들이 가졌던 \u003cb class=\"key\">영혼의 \u003c/b>\u003cb class=\"key\">불멸성\u003c/b>에 대한 믿음을 설명하며, 조각상이 영혼의 \u003cb class=\"key\">대체물\u003c/b> 또는 안식처가 된다는 것을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절 접속사\u003c/span> : believed [동사] + that [접속사] + S + V : \"~라고 / ~라는 사실을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사의 과거형\u003c/span> : would [조동사] + move [동사원형] : \"옮겨 갈 것이라고\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"They believed, 그들은 믿었어요. that a person's soul, 사람의 영혼이. would move into a statue, 조각상 안으로 옮겨 간다고. after death, 죽음 이후에.. 이 문장 전체를 해석하면, 그들은 죽음 이후 사람의 영혼이 조각상 안으로 옮겨 간다고 믿었어요.","hl":"m"},{"n":34,"text":"이집트인들이 영혼의 불멸성을 믿었다는 내용이에요. 조각상이 영혼이 머무는 대체물 역할을 했다는 구체적인 믿음을 보여줍니다.","hl":"mn"},{"n":35,"text":"두 가지 포인트를 볼게요. 첫 번째로 that은 문장에서 목적어 역할을 하는 명사절 접속사로 쓰였어요. 두 번째로 would는 과거 시점에서 바라본 미래를 나타내기 위해 쓴 조동사입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 누군가 원했다면\u003c/span>\u003cspan class=\"en\">If someone wanted\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">영혼을 제거하기를,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">remove\u003c/span> the soul,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 해야만 했어요\u003c/span>\u003cspan class=\"en\">they needed\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">조각상을 파괴하는 것을요.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">destroy\u003c/span> the statue.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">만약 누군가 영혼을 제거하기를 원했다면, 그들은 조각상을 파괴해야만 했어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 영혼을 없애기 위해서는 그 거처인 조각상을 없애야 한다는 \u003cb class=\"key\">논리적 \u003c/b>\u003cb class=\"key\">인과관계\u003c/b>를 보여주며, 코를 부러뜨리는 행위의 \u003cb class=\"key\">근거\u003c/b>를 제공합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : wanted [타동사] + to remove [to부정사구] : \"제거하기를\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : needed [타동사] + to destroy [to부정사구] : \"파괴하는 것을\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"If someone wanted, 만약 누군가 원했다면. to remove the soul, 영혼을 제거하기를. they needed, 그들은 해야만 했어요. to destroy the statue, 조각상을 파괴하는 것을요.. 이 문장 전체를 해석하면, 만약 누군가 영혼을 제거하기를 원했다면, 그들은 조각상을 파괴해야만 했어요.","hl":"m"},{"n":37,"text":"영혼을 없애고 싶으면 조각상을 파괴해야 했다는 논리적인 인과관계를 설명하는 문장이에요. 이후에 나올 코를 부러뜨린 행위의 근거가 되죠.","hl":"mn"},{"n":38,"text":"첫 번째와 두 번째 포인트 모두 투부정사의 명사적 용법이에요. to remove는 wanted의 목적어 자리에, to destroy는 needed의 목적어 자리에 쓰여 각각 제거하는 것과 파괴하는 것을 의미합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그렇다면,\u003c/span>\u003cspan class=\"en\">Then,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 왜\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">why \u003c/span>\u003cspan class=\"tgt\">did \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단지 부러뜨렸을까요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">only \u003c/span>\u003cspan class=\"tgt\">break\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">코를?\u003c/span>\u003cspan class=\"en\">the nose?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그렇다면, 그들은 왜 코만 부러뜨렸을까요?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞선 미스터리에 대해 구체적인 질문을 던지며 \u003cb class=\"key\">원인과 \u003c/b>\u003cb class=\"key\">결과\u003c/b>를 파헤치는 전환점입니다. 조각상 전체가 아닌 \u003cb class=\"key\">특정 \u003c/b>\u003cb class=\"key\">부위\u003c/b>인 코에 집중된 이유를 강조하는 \u003cb class=\"key\">의문문\u003c/b>입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문사 why가 이끄는 일반동사 의문문\u003c/span> : why + did(조동사) + 주어 + 동사원형 : \"왜 그들이 단지 부러뜨렸을까요\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"Then, 그렇다면. why did they, 그들은 왜. only break, 단지 부러뜨렸을까요. the nose?, 코를?. 이 문장 전체를 해석하면, 그렇다면, 그들은 왜 코만 부러뜨렸을까요?","hl":"m"},{"n":40,"text":"앞에서 조각상의 코가 부러진 미스터리를 언급했죠? 이 문장은 왜 하필 다른 곳도 아닌 코만 그렇게 되었는지 원인과 결과의 실마리를 찾는 질문을 던지는 부분이에요. 특정 부위에 집중된 이유를 궁금해하게 만듭니다.","hl":"mn"},{"n":41,"text":"첫 번째로 볼 부분은 why로 시작하는 의문문이에요. 과거의 일을 묻고 있기 때문에 조동사 did를 주어 they 앞에 썼고, 그 뒤에는 반드시 break라는 동사원형을 써야 한다는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이집트인들은 믿었어요\u003c/span>\u003cspan class=\"en\">Egyptians \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">believed \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">코가 ~였다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">nose \u003c/span>\u003cspan class=\"tgt\">was\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">생명의 원천\u003c/span>\u003cspan class=\"en\">the source of life.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이집트인들은 코가 생명의 원천이라고 믿었어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 코를 파괴한 구체적인 \u003cb class=\"key\">종교적 \u003c/b>\u003cb class=\"key\">배경\u003c/b>을 설명하는 핵심 문장입니다. 고대 이집트인들에게 코가 \u003cb class=\"key\">생명력\u003c/b>의 통로라는 인식이 있었음을 나타냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that의 생략\u003c/span> : 주어 + believed + (that) + 주어 + 동사 : \"코가 ~였다고 믿었다\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"Egyptians believed, 이집트인들은 믿었어요. the nose was, 코가 ~였다고. the source of life, 생명의 원천. 이 문장 전체를 해석하면, 이집트인들은 코가 생명의 원천이라고 믿었어요.","hl":"m"},{"n":43,"text":"드디어 수수께끼가 풀리네요. 이집트인들의 종교적 배경을 설명하는 아주 중요한 문장입니다. 그들에게 코는 단순한 신체 부위가 아니라 생명력이 드나드는 통로이자 근본이었다는 사실을 알려주고 있어요.","hl":"mn"},{"n":44,"text":"여기서 첫 번째 문법 포인트는 believed와 the nose 사이에 접속사 that이 생략되어 있다는 점이에요. 믿었던 내용 전체가 목적어 역할을 하는 명사절이 됩니다. 두 번째로 주절의 동사가 과거형인 believed이므로 대절 안의 동사도 was라는 과거 시제를 써서 시제 일치를 시켜주었죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서, 사람들이 원했을 때 보물을 훔치기를 파라오의 무덤에서 그들은 항상 했어요 제일 먼저 한 가지를\u003c/span>\u003cspan class=\"en\">So, \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">wanted\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">steal\u003c/span> treasure from **pharaoh's tombs, they always did one thing first.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그래서, 사람들이 파라오의 무덤에서 보물들을 훔치기를 원했을 때, 그들은 항상 제일 먼저 한 가지를 했어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 신념이 구체적인 \u003cb class=\"key\">범죄 \u003c/b>\u003cb class=\"key\">행위\u003c/b>로 이어지는 과정을 묘사합니다. 도굴꾼들이 \u003cb class=\"key\">현실적 \u003c/b>\u003cb class=\"key\">목적\u003c/b>을 위해 종교적 금기를 활용했음을 보여주는 \u003cb class=\"key\">인과관계\u003c/b>의 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간의 부사절 접속사 when\u003c/span> : when + 주어 + 동사 : \"사람들이 원했을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : wanted(타동사) + to steal(to부정사구) : \"훔치는 것을\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"So, 그래서. when people wanted, 사람들이 원했을 때. to steal treasure, 보물을 훔치기를. from pharaoh's tombs, 파라오의 무덤에서. they always did, 그들은 항상 했어요. one thing first, 제일 먼저 한 가지를. 이 문장 전체를 해석하면, 그래서, 사람들이 파라오의 무덤에서 보물들을 훔치기를 원했을 때, 그들은 항상 제일 먼저 한 가지를 했어요.","hl":"m"},{"n":46,"text":"사람들의 믿음이 실제 행동으로 어떻게 나타났는지 보여주는 장면입니다. 도굴꾼들이라는 사람들이 자신들의 현실적 목적인 보물을 훔치기 위해서, 가장 먼저 해야만 했던 절차를 언급하며 긴장감을 조성하고 있어요.","hl":"mn"},{"n":47,"text":"첫 번째로 보실 문법은 접속사 when입니다. 사람들이 원했을 때라는 시간적 상황을 나타내는 부사절을 이끌고 있죠. 두 번째는 to steal이에요. 원하다라는 뜻의 wanted는 뒤에 무엇을 원하는지 목적어가 필요한데, 그 자리에 명사처럼 쓰인 to부정사가 온 것이랍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 부러뜨렸어요\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">broke\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">조각상의 코를\u003c/span>\u003cspan class=\"en\">the statue's nose\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">영혼을 파괴하기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">destroy\u003c/span> the soul\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">영원히!\u003c/span>\u003cspan class=\"en\">forever!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 영혼을 영원히 파괴하기 위해 조각상의 코를 부러뜨렸어요!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 도굴꾼들이 조각상의 코를 부러뜨린 명확한 \u003cb class=\"key\">이유\u003c/b>를 결론적으로 제시합니다. 고대 이집트인들에게 코는 \u003cb class=\"key\">생명의 \u003c/b>\u003cb class=\"key\">근원\u003c/b>이었기에, 코를 없애는 것이 곧 \u003cb class=\"key\">영혼\u003c/b>을 완전히 소멸시키는 방법이라고 믿었습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거 시제 (일반동사)\u003c/span> : break [현재형] → broke [과거형] : \"부러뜨렸다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법 (목적)\u003c/span> : to + 동사원형 (destroy) : \"파괴하기 위해\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"They broke, 그들은 부러뜨렸어요. the statue's nose, 조각상의 코를. to destroy the soul, 영혼을 파괴하기 위해. forever!, 영원히!. 이 문장 전체를 해석하면, 그들은 영혼을 영원히 파괴하기 위해 조각상의 코를 부러뜨렸어요!","hl":"m"},{"n":49,"text":"도굴꾼들이 무덤에서 보물을 훔치기 전에 왜 하필 조각상의 코만 공격했는지 알려주는 핵심 문장이네요. 조각상의 코를 부러뜨리는 것이 곧 영혼의 파괴를 의미한다는 고대 이집트인들의 생명의 근원에 대한 믿음을 보여주는 대목입니다.","hl":"mn"},{"n":50,"text":"첫 번째 포인트로 동사 broke를 보세요. 과거에 일어났던 구체적인 행동을 나타내기 위해 과거 시제를 썼지요. 두 번째는 to destroy입니다. 조각상의 코를 왜 부러뜨렸는지 그 목적을 설명해 주는 부분이에요. 투부정사의 부사적 용법 중에서도 목적으로 쓰여서 파괴하기 위해서라고 해석하면 됩니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>박물관의 많은 고대 이집트 조각상들은 특이하게도 \u003cb class=\"key\">코가 \u003c/b>\u003cb class=\"key\">부러진\u003c/b> 상태로 발견됩니다.\u003c/li>\u003cli>이것은 자연적인 \u003cb class=\"key\">침식 \u003c/b>\u003cb class=\"key\">작용\u003c/b> 때문이 아니라, 실내에 있는 조각상들에서도 동일하게 나타나는 현상입니다.\u003c/li>\u003cli>이집트인들은 조각상에 \u003cb class=\"key\">영혼이 \u003c/b>\u003cb class=\"key\">거주\u003c/b>한다고 믿었으며, 영혼을 없애기 위해서는 조각상을 파괴해야 한다고 생각했습니다.\u003c/li>\u003cli>특히 코는 \u003cb class=\"key\">생명의 \u003c/b>\u003cb class=\"key\">근원\u003c/b>이었기에, 도굴꾼들이 영혼을 영원히 죽이기 위해 의도적으로 코를 부러뜨린 것입니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The broken noses of ancient Egyptian statues were not accidental but intentional acts to destroy the soul's source of life.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">고대 이집트 조각상의 코가 부러진 것은 단순한 \u003cb class=\"key\">침식 \u003c/b>\u003cb class=\"key\">작용\u003c/b>이 아니라, 죽은 자의 영혼이 보복하지 못하도록 \u003cb class=\"key\">생명의 \u003c/b>\u003cb class=\"key\">근원\u003c/b>인 코를 파괴하려 했던 의도적인 행동이었습니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":51,"text":"오늘은 고대 이집트 조각상의 코가 부러진 이유가 단순한 우연이 아닌 의도적인 영혼 파괴의 흔적이었다는 사실을 배웠습니다. 이처럼 독해를 할 때는 그 나라의 문화적 배경을 알면 글의 흐름을 훨씬 더 잘 이해할 수 있어요. 오늘 배운 내용 잊지 말고 복습해 보세요. 수고하셨습니다!","hl":null}]}]});</script></body></html>
