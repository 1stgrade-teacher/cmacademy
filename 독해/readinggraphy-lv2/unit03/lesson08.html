</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}

    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}

  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}

lecturePlayer(document.getElementById("app"),{"brand":"청명학원 영어과","title":"리딩그라피2 리딩그라피레벨2 8번","audioDir":"audio","preview":false,"count":58,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.400em\">리딩그라피레벨2\u003cbr>8번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩그라피2\u003c/div>\u003ch1>From Boring Expectations to a Real Adventure\u003c/h1>\u003ch2>지루한 기대에서 진정한 모험으로\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>사우스다코타 여행이 지루할 것이라고 생각했던 Sophia가 \u003cb class=\"key\">타이어 \u003c/b>\u003cb class=\"key\">펑크\u003c/b>와 \u003cb class=\"key\">들소 \u003c/b>\u003cb class=\"key\">무리\u003c/b>를 만나는 예상치 못한 사건을 통해 여행의 진정한 \u003cb class=\"key\">모험\u003c/b>을 발견하는 이야기입니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Unexpected incidents can transform a dull journey into an exciting and unforgettable adventure.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 사우스다코타로 여행을 떠난 Sophia의 가족 이야기를 함께 읽어볼 거예요. 이번 지문은 '지루한 여행이 어떻게 진짜 모험이 되는가'에 대한 흥미로운 내용을 담고 있습니다. 예상치 못한 사건이 우리 삶에 어떤 활력을 불어넣어 주는지 함께 살펴볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">사우스다코타(South Dakota) 주는 미국의 중서부에 위치하며, \u003cb class=\"key\">러시모어 \u003c/b>\u003cb class=\"key\">산\u003c/b>과 같은 유명한 국립 기념지가 있지만 인구 밀도가 낮아 종종 \u003cb class=\"key\">지루한\u003c/b> 곳으로 오해받기도 합니다. 하지만 이곳은 광활한 \u003cb class=\"key\">대평원\u003c/b>과 야생 동물의 낙원으로 유명하며, 특히 북미 \u003cb class=\"key\">들소(Bison)\u003c/b>를 가장 가까이서 볼 수 있는 자연의 보고입니다. 마치 우리가 지루한 시골 길을 가다가 갑자기 길을 막아선 \u003cb class=\"key\">야생 \u003c/b>\u003cb class=\"key\">동물\u003c/b> 무리를 마주치는 것과 같은 생동감 넘치는 경험을 할 수 있는 곳이죠. 이 글은 이러한 지역적 특성을 배경으로 주인공의 \u003cb class=\"key\">선입견\u003c/b>이 깨지는 극적인 순간을 묘사하고 있습니다.\u003c/div>","segs":[{"n":2,"text":"사우스다코타는 미국 중서부에 있는 주인데, 자연경관이 아주 훌륭하지만 대도시처럼 북적이지 않아서 가끔 지루한 곳이라는 오해를 받기도 해요. 하지만 이곳은 야생 들소인 Bison의 서식지로 아주 유명하답니다. 마치 우리가 조용한 시골 길을 가다가 갑자기 거대한 천연기념물 동물을 만나는 것 같은 놀라운 경험을 할 수 있는 곳이죠. 오늘 주인공 Sophia도 처음에는 선입견을 가지고 여행을 시작하지만, 곧 이 지역의 진짜 매력을 발견하게 됩니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>여행의 시작과 부정적 기대\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>사우스다코타로 여행을 가면서 Sophia는 그곳이 \u003cb class=\"key\">지루할 \u003c/b>\u003cb class=\"key\">것\u003c/b>이라는 타인의 말에 근거한 \u003cb class=\"key\">부정적인 \u003c/b>\u003cb class=\"key\">기대\u003c/b>를 품고 있습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>현실 외면과 비교\u003csmall>전개 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>Sophia는 여행지 대신 휴대폰 속 친구의 \u003cb class=\"key\">플로리다 \u003c/b>\u003cb class=\"key\">여행\u003c/b> 사진에 몰두하며 현실의 여행에서 \u003cb class=\"key\">심리적 \u003c/b>\u003cb class=\"key\">거리\u003c/b>를 둡니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>오빠의 예언적 조언\u003csmall>전환 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>오빠 Tony는 이 여행도 \u003cb class=\"key\">흥미진진한 \u003c/b>\u003cb class=\"key\">모험\u003c/b>이 될 수 있으며 무엇이든 일어날 수 있다는 \u003cb class=\"key\">긍정적인 \u003c/b>\u003cb class=\"key\">가능성\u003c/b>을 제시합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>예상치 못한 사건과 놀라운 광경\u003csmall>사건 및 절정 · 문장 8–13\u003c/small>\u003c/h4>\u003cp>갑작스러운 \u003cb class=\"key\">타이어 \u003c/b>\u003cb class=\"key\">펑크\u003c/b>라는 위기 상황 속에서 오히려 거대한 \u003cb class=\"key\">들소 \u003c/b>\u003cb class=\"key\">무리\u003c/b>를 직접 목격하며 Sophia는 큰 놀라움을 느낍니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>인식의 변화와 결말\u003csmall>결론 · 문장 14–15\u003c/small>\u003c/h4>\u003cp>Sophia가 직접 사진을 찍기 시작하면서, 지루했던 여행이 \u003cb class=\"key\">진정한 \u003c/b>\u003cb class=\"key\">모험\u003c/b>으로 변했음을 인정하며 글이 \u003cb class=\"key\">마무리\u003c/b>됩니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"전체적인 글의 흐름은 주인공의 기대가 실망에서 놀라움으로 변하는 과정을 시간 순서대로 보여줍니다.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서는 여행의 시작을 알립니다. Sophia는 사우스다코타가 미국에서 가장 지루한 주 중 하나라는 말을 듣고 이번 여행이 아주 지루할 것이라고 생각하죠.","hl":"f0"},{"n":5,"text":"세 번째부터 다섯 번째 문장에서는 Sophia가 현실 여행에 집중하지 않는 모습을 보여줍니다. 그녀는 휴대폰으로 친구 Ally가 플로리다에서 즐겁게 보내는 사진만 보며 시간을 보내고 있어요.","hl":"f1"},{"n":6,"text":"여섯 번째와 일곱 번째 문장에서 오빠 Tony가 등장합니다. Tony는 우리 여행도 신나는 모험이 될 수 있고, 무슨 일이든 일어날 수 있다며 긍정적인 분위기를 환기시키죠.","hl":"f2"},{"n":7,"text":"여덟 번째부터 열세 번째 문장은 이 글의 핵심 사건입니다. 타이어에 펑크가 나서 멈춰 선 사이, 정말 우연히 들소 무리가 지나가는 것을 보게 되죠. Sophia는 너무 놀라서 재빨리 휴대폰을 들어 직접 사진을 찍기 시작합니다.","hl":"f3"},{"n":8,"text":"마지막 열네 번째와 열다섯 번째 문장에서 Tony는 미소를 지으며 말합니다. 이제 진짜 모험이 시작되었다고요. Sophia의 지루했던 마음이 흥분으로 완전히 바뀌는 순간입니다.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 15번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 여행의 시작부터 들소 무리를 만나는 시점까지 \u003cb class=\"key\">시간의 \u003c/b>\u003cb class=\"key\">흐름\u003c/b>을 따라 서술하고 있습니다. 주인공의 감정이 '지루함'에서 '놀라움'으로 변하는 \u003cb class=\"key\">심경 \u003c/b>\u003cb class=\"key\">변화\u003c/b> 구조를 보여줍니다. 마지막 문장에서 여행이 \u003cb class=\"key\">진정한 \u003c/b>\u003cb class=\"key\">모험\u003c/b>이 되었다고 선언하며 주제를 강조합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Just then (8)\u003c/b>\u003cspan>분위기를 반전시키는 갑작스러운 사건의 도입\u003c/span>\u003cb>As they waited (10)\u003c/b>\u003cspan>사건 진행 중 새로운 발견을 연결\u003c/span>\u003cb>now (15)\u003c/b>\u003cspan>현재 상태의 변화된 결과 강조\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">trip\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">boring\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">exciting trip\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">adventure\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">flat tire\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">bison passing by\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">real adventure\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Initial Expectation\u003c/th>\u003cth>Actual Experience\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Boring state, South Dakota\u003c/td>\u003ctd>Exciting adventure, anything can happen\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Looking at Ally's phone pictures\u003c/td>\u003ctd>Taking her own pictures of bison\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글은 시간의 흐름에 따라 사건이 전개되는 전형적인 서사 구조를 가지고 있습니다. 처음에는 부정적인 감정으로 시작했다가 마지막에 긍정적으로 변화하는 미괄식 구조를 취하고 있죠. 주인공의 심경이 어떻게 변하는지 추적하며 읽는 것이 포인트입니다.","hl":"ty"},{"n":10,"text":"글의 분위기를 바꿔주는 중요한 신호어들을 찾아보세요. 여덟 번째 문장의 Just then은 평화롭지만 지루했던 상황을 깨는 사건의 시작을 알립니다. 열 번째 문장의 As they waited는 지루할 수 있는 기다림의 시간이 특별한 경험으로 바뀌는 연결고리가 되죠. 마지막 문장의 now는 현재 여행의 성격이 완전히 달라졌음을 선언하고 있습니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>trip\u003c/b>\u003cem>명사\u003c/em>\u003cspan>여행\u003c/span>\u003c/div>\u003cdiv>\u003cb>boring\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>지루한\u003c/span>\u003c/div>\u003cdiv>\u003cb>state\u003c/b>\u003cem>명사\u003c/em>\u003cspan>주(州)\u003c/span>\u003c/div>\u003cdiv>\u003cb>on the way\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>가는 도중에\u003c/span>\u003c/div>\u003cdiv>\u003cb>spend time\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>시간을 보내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>interesting\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>흥미로운\u003c/span>\u003c/div>\u003cdiv>\u003cb>show\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보여주다\u003c/span>\u003c/div>\u003cdiv>\u003cb>exciting\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>신나는, 흥미진진한\u003c/span>\u003c/div>\u003cdiv>\u003cb>adventure\u003c/b>\u003cem>명사\u003c/em>\u003cspan>모험\u003c/span>\u003c/div>\u003cdiv>\u003cb>anything\u003c/b>\u003cem>대명사\u003c/em>\u003cspan>무엇이든\u003c/span>\u003c/div>\u003cdiv>\u003cb>happen\u003c/b>\u003cem>동사\u003c/em>\u003cspan>일어나다, 발생하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>just then\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>바로 그때\u003c/span>\u003c/div>\u003cdiv>\u003cb>flat tire\u003c/b>\u003cem>명사\u003c/em>\u003cspan>펑크 난 타이어\u003c/span>\u003c/div>\u003cdiv>\u003cb>fix\u003c/b>\u003cem>동사\u003c/em>\u003cspan>고치다, 수리하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>as\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>~하는 동안\u003c/span>\u003c/div>\u003cdiv>\u003cb>group\u003c/b>\u003cem>명사\u003c/em>\u003cspan>무리, 집단\u003c/span>\u003c/div>\u003cdiv>\u003cb>bison\u003c/b>\u003cem>명사\u003c/em>\u003cspan>들소\u003c/span>\u003c/div>\u003cdiv>\u003cb>pass by\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>지나가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>surprised\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>놀란\u003c/span>\u003c/div>\u003cdiv>\u003cb>expect\u003c/b>\u003cem>동사\u003c/em>\u003cspan>예상하다, 기대하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>quickly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>재빨리\u003c/span>\u003c/div>\u003cdiv>\u003cb>lift\u003c/b>\u003cem>동사\u003c/em>\u003cspan>들다, 들어 올리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>smile\u003c/b>\u003cem>동사\u003c/em>\u003cspan>미소 짓다\u003c/span>\u003c/div>\u003cdiv>\u003cb>turn into\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 바뀌다\u003c/span>\u003c/div>\u003cdiv>\u003cb>real\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>진정한, 진짜의\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"중요한 단어들을 짚어볼까요? boring은 이 글의 갈등 요소인 지루함을 뜻합니다. 하지만 이것이 adventure, 즉 모험으로 바뀌게 되죠. 들소를 뜻하는 bison과 예상하지 못했다는 표현인 didn't expect는 이 글의 반전 포인트입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">boring\u003c/b>\u003cspan class=\"m\">지루한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">dull\u003c/span>\u003cspan class=\"s\">tedious\u
