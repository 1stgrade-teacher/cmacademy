</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}

lecturePlayer(document.getElementById("app"),{"brand":"청명학원 영어과","title":"리딩그라피2 리딩그라피레벨2 12번","audioDir":"audio","preview":false,"count":51,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.400em\">리딩그라피레벨2\u003cbr>12번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩그라피2\u003c/div>\u003ch1>Empowering Representation: Lowri's Campaign for Characters with Glasses\u003c/h1>\u003ch2>표현의 힘: 안경 쓴 캐릭터를 위한 Lowri의 캠페인\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>안경 쓴 \u003cb class=\"key\">롤 \u003c/b>\u003cb class=\"key\">모델\u003c/b>의 부재를 느낀 Lowri가 디즈니와 빅테크 기업에 편지를 보내 \u003cb class=\"key\">표현의 \u003c/b>\u003cb class=\"key\">다양성\u003c/b>을 이끌어내고 캠페인을 전개한 이야기입니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Lowri's proactive efforts led to better representation for people who wear glasses in media and technology.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분! 오늘은 안경을 쓴 롤 모델을 만들기 위해 직접 행동에 나선 멋진 소녀 Lowri의 이야기를 함께 읽어볼 거예요. 이번 지문은 한 소녀의 용기 있는 행동이 어떻게 세상을 바꿨는지를 보여줍니다. 요약하자면, 안경 쓴 롤 모델의 부재를 느낀 Lowri가 적극적인 소통으로 표현의 다양성을 이끌어낸 이야기입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">미디어에서의 \u003cb class=\"key\">재현(Representation)\u003c/b>은 소수자나 특정 집단의 자존감에 큰 영향을 미칩니다. 특히 어린 시절 자신과 닮은 \u003cb class=\"key\">롤 \u003c/b>\u003cb class=\"key\">모델(Role \u003c/b>\u003cb class=\"key\">Model)\u003c/b>을 찾는 것은 정체성 형성과 자아 존중감 형성에 매우 중요하죠. '당신이 볼 수 없는 존재가 될 수는 없다(You can't be what you can't see)'라는 말처럼, 다양성은 사회적 \u003cb class=\"key\">포용성(Inclusivity)\u003c/b>을 상징합니다. 마치 모든 아이들이 자기 피부색과 같은 \u003cb class=\"key\">크레파스\u003c/b>를 갖기를 원하는 것과 같은 이치입니다. Lowri의 행동은 \u003cb class=\"key\">디지털 \u003c/b>\u003cb class=\"key\">접근성\u003c/b>과 문화적 다양성에 대한 대중의 인식을 높이는 중요한 계기가 되었습니다.\u003c/div>","segs":[{"n":2,"text":"본격적인 시작에 앞서 배경지식을 좀 알아볼까요? 미디어에서 우리와 닮은 사람을 보는 재현의 중요성은 아주 큽니다. 특히 어린 시절 자신과 닮은 롤 모델을 찾는 것은 자존감 형성에 결정적이죠. 포용성이라는 개념은 모든 사람이 소외되지 않고 사회의 일부분으로 인정받는 것을 뜻해요. 마치 모든 아이가 자신의 피부색과 똑같은 크레파스를 가질 수 있어야 하는 것과 비슷하죠. Lowri의 노력은 디지털 접근성과 문화적 다양성을 높이는 데 기여했습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>도입 및 문제의식\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>영국 출신 Lowri가 자신을 소개하며, 영화나 TV 쇼에 안경을 쓴 \u003cb class=\"key\">롤 \u003c/b>\u003cb class=\"key\">모델\u003c/b>이 더 많이 필요하다는 \u003cb class=\"key\">문제의식\u003c/b>을 드러냅니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>디즈니에 보낸 편지와 결과\u003csmall>예시 · 문장 3–7\u003c/small>\u003c/h4>\u003cp>9살 때 디즈니에 편지를 보내 안경 쓴 캐릭터를 요청했고, 그 결과 영화 '엔칸토'의 \u003cb class=\"key\">미라벨\u003c/b>이라는 캐릭터가 탄생하여 \u003cb class=\"key\">성공\u003c/b>을 거두었습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>이모티콘 캠페인 확장\u003csmall>추가 근거 · 문장 8–12\u003c/small>\u003c/h4>\u003cp>#GlassesOn 캠페인을 시작하며, 자신을 닮은 \u003cb class=\"key\">이모티콘\u003c/b>이 부족함을 깨닫고 \u003cb class=\"key\">유니코드 \u003c/b>\u003cb class=\"key\">협회\u003c/b>와 빅테크 기업에 변화를 요청했습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>공감과 지속적 노력\u003csmall>결론 · 문장 13\u003c/small>\u003c/h4>\u003cp>이제 많은 사람들이 이 변화에 \u003cb class=\"key\">동의\u003c/b>하고 있으며, 앞으로도 노력을 \u003cb class=\"key\">지속\u003c/b>하겠다는 포부를 밝힙니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 이제 글의 흐름을 단계별로 살펴볼까요?","hl":null},{"n":4,"text":"첫 번째 단계인 첫 번째와 두 번째 문장에서는 영국 출신인 Lowri의 자기소개와 함께, 안경 쓴 롤 모델이 더 많이 필요하다는 그녀의 문제의식을 보여줍니다.","hl":"f0"},{"n":5,"text":"두 번째 단계인 세 번째부터 일곱 번째 문장까지는 실제 행동의 예시예요. 디즈니에 편지를 보냈고, 그 결과 엔칸토의 미라벨이라는 캐릭터가 탄생해 큰 성공을 거둔 과정을 설명합니다.","hl":"f1"},{"n":6,"text":"세 번째 단계인 여덟 번째부터 열두 번째 문장에서는 활동을 확장합니다. 이모티콘에서도 안경 쓴 캐릭터가 부족하다는 점을 깨닫고 유니코드 협회와 빅테크 기업에 변화를 요청하는 캠페인을 시작했죠.","hl":"f2"},{"n":7,"text":"마지막 네 번째 단계인 열세 번째 문장에서는 현재 많은 사람이 그녀의 의견에 동의하고 있으며, 앞으로도 노력을 지속하겠다는 의지를 강조하며 마무리합니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결 및 시간순\u003c/span>\u003cspan class=\"lp-pill\">양괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 2번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글의 앞부분에서 안경 쓴 롤 모델이 부족하다는 \u003cb class=\"key\">문제점\u003c/b>을 제시하고, 이를 해결하기 위한 Lowri의 \u003cb class=\"key\">행동과 \u003c/b>\u003cb class=\"key\">결과\u003c/b>를 시간 순서대로 보여줍니다. 마지막에는 자신의 의지와 사회적 \u003cb class=\"key\">공감\u003c/b>을 다시 강조하며 마무리하는 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>So (3)\u003c/b>\u003cspan>원인에 따른 결과 제시\u003c/span>\u003cb>Thankfully (6)\u003c/b>\u003cspan>긍정적인 반전 및 결과\u003c/span>\u003cb>also (8)\u003c/b>\u003cspan>내용의 추가 및 확장\u003c/span>\u003cb>now (13)\u003c/b>\u003cspan>현재의 상태 강조\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Lowri\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">role models with glasses\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">letter to Disney\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">characters wearing glasses\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Mirabel\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">#GlassesOn campaign\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">emojis with glasses\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Unicode Consortium\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">big tech companies\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>기존의 미디어/기술 환경\u003c/th>\u003cth>Lowri의 노력 이후\u003c/th>\u003c/tr>\u003ctr>\u003ctd>안경 쓴 롤 모델과 이모티콘 부족\u003c/td>\u003ctd>캐릭터 미라벨 탄생 및 다양한 이모티콘 요청\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 주인공이 겪은 문제점을 어떻게 해결했는지 보여주는 문제 해결 구조와 사건이 일어난 시간 순서가 결합되어 있습니다. 처음과 끝에서 모두 자신의 주장과 의지를 드러내고 있어 전체적으로 양괄식 구조를 띠고 있어요.","hl":"ty"},{"n":9,"text":"신호어들을 살펴볼까요? 세 번째 문장의 So는 원인에 따른 결과를 보여주고, 여섯 번째 문장의 Thankfully는 긍정적인 반전의 결과를 나타냅니다. 또한 여덟 번째 문장의 also를 통해 활동 범위가 확장되고 있음을 알 수 있고, 마지막 문장의 now는 현재의 변화된 상태를 강조하고 있죠.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>England\u003c/b>\u003cem>명사\u003c/em>\u003cspan>영국\u003c/span>\u003c/div>\u003cdiv>\u003cb>wear\u003c/b>\u003cem>동사\u003c/em>\u003cspan>입다, (안경을) 쓰다\u003c/span>\u003c/div>\u003cdiv>\u003cb>glasses\u003c/b>\u003cem>명사\u003c/em>\u003cspan>안경\u003c/span>\u003c/div>\u003cdiv>\u003cb>believe\u003c/b>\u003cem>동사\u003c/em>\u003cspan>믿다\u003c/span>\u003c/div>\u003cdiv>\u003cb>role model\u003c/b>\u003cem>명사\u003c/em>\u003cspan>롤 모델\u003c/span>\u003c/div>\u003cdiv>\u003cb>movie\u003c/b>\u003cem>명사\u003c/em>\u003cspan>영화\u003c/span>\u003c/div>\u003cdiv>\u003cb>TV show\u003c/b>\u003cem>명사\u003c/em>\u003cspan>TV 쇼\u003c/span>\u003c/div>\u003cdiv>\u003cb>send\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>letter\u003c/b>\u003cem>명사\u003c/em>\u003cspan>편지\u003c/span>\u003c/div>\u003cdiv>\u003cb>ask\u003c/b>\u003cem>동사\u003c/em>\u003cspan>요청하다, 묻다\u003c/span>\u003c/div>\u003cdiv>\u003cb>character\u003c/b>\u003cem>명사\u003c/em>\u003cspan>캐릭터\u003c/span>\u003c/div>\u003cdiv>\u003cb>share\u003c/b>\u003cem>동사\u003c/em>\u003cspan>공유하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>thankfully\u003c/b>\u003cem>부사\u003c/em>\u003cspan>고맙게도, 다행히도\u003c/span>\u003c/div>\u003cdiv>\u003cb>listen\u003c/b>\u003cem>동사\u003c/em>\u003cspan>귀를 기울이다, 듣다\u003c/span>\u003c/div>\u003cdiv>\u003cb>create\u003c/b>\u003cem>동사\u003c/em>\u003cspan>만들다, 창조하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>huge\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>거대한, 큰\u003c/span>\u003c/div>\u003cdiv>\u003cb>success\u003c/b>\u003cem>명사\u003c/em>\u003cspan>성공\u003c/span>\u003c/div>\u003cdiv>\u003cb>campaign\u003c/b>\u003cem>명사\u003c/em>\u003cspan>캠페인\u003c/span>\u003c/div>\u003cdiv>\u003cb>idea\u003c/b>\u003cem>명사\u003c/em>\u003cspan>생각, 아이디어\u003c/span>\u003c/div>\u003cdiv>\u003cb>look for\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>찾다\u003c/span>\u003c/div>\u003cdiv>\u003cb>emoji\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이모티콘\u003c/span>\u003c/div>\u003cdiv>\u003cb>few\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>거의 없는\u003c/span>\u003c/div>\u003cdiv>\u003cb>Unicode Consortium\u003c/b>\u003cem>명사\u003c/em>\u003cspan>유니코드 협회\u003c/span>\u003c/div>\u003cdiv>\u003cb>big tech company\u003c/b>\u003cem>명사\u003c/em>\u003cspan>첨단 기술 대기업\u003c/span>\u003c/div>\u003cdiv>\u003cb>agree\u003c/b>\u003cem>동사\u003c/em>\u003cspan>동의하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>keep ~ing\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>계속해서 ~하다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"중요한 단어를 짚어보면, 캐릭터를 의미하는 character, 고맙게도라는 뜻의 thankfully, 그리고 캠페인을 뜻하는 campaign 같은 단어들은 꼭 기억해야 합니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">role model\u003c/b>\u003cspan class=\"m\">롤 모델\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">mentor\u003c/span>\u003cspan class=\"s\">example\u003c/span>\u003cspan class=\"s\">ideal\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">huge\u003c/b>\u003cspan class=\"m\">거대한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">enormous\u003c/span>\u003cspan class=\"s\">massive\u003c/span>\u003cspan class=\"s\">giant\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">tiny\u003c/span>\u003cspan class=\"a\">small\u003c/span>\u003cspan class=\"a\">minute\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">success\u003c/b>\u003cspan class=\"m\">성공\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">triumph\u003c/span>\u003cspan class=\"s\">achievement\u003c/span>\u003cspan class=\"s\">victory\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">failure\u003c/span>\u003cspan class=\"a\">defeat\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">campaign\u003c/b>\u003cspan class=\"m\">캠페인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">movement\u003c/span>\u003cspan class=\"s\">drive\u003c/span>\u003cspan class=\"s\">crusade\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">agree\u003c/b>\u003cspan class=\"m\">동의하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">concur\u003c/span>\u003cspan class=\"s\">consent\u003c/span>\u003cspan class=\"s\">assent\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">disagree\u003c/span>\u003cspan class=\"a\">object\u003c/span>\u003cspan class=\"a\">dissent\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"어휘를 더 넓혀볼까요? 롤 모델은 mentor나 example로 바꿔 쓸 수 있습니다. huge는 거대한이라는 뜻인데 enormous나 massive가 동의어고, 반대말로는 tiny나 small이 있죠. 성공을 뜻하는 success의 반대말은 failure라는 점도 챙겨두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제 이름은 Lowri이고\u003c/span>\u003cspan class=\"en\">12 My name is Lowri\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는\u003c/span>\u003cspan class=\"en\">and I'm\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">영국 출신이에요.\u003c/span>\u003cspan class=\"en\">from England.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">제 이름은 Lowri이고 저는 영국 출신이에요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글을 시작하며 필자의 이름과 출신지를 밝히는 \u003cb class=\"key\">자기소개\u003c/b> 단계입니다. 독자에게 자신이 누구인지 정보를 전달하며 \u003cb class=\"key\">친근감\u003c/b>을 형성하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">be from (~출신이다)\u003c/span> : be [동사] + from [전치사] + 장소 : \"~ 출신이다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"My name is Lowri, 제 이름은 Lowri이고. and I'm, 저는. from England, 영국 출신이에요.. 이 문장 전체를 해석하면, 제 이름은 Lowri이고 저는 영국 출신이에요.","hl":"m"},{"n":13,"text":"이 문장은 글을 시작하면서 필자가 누구인지 알려주는 자기소개 부분이에요. 자신의 이름과 영국에서 왔다는 사실을 말하며 독자에게 친근하게 다가가고 있죠.","hl":"mn"},{"n":14,"text":"여기서 주목할 표현은 am from이에요. be from 뒤에 장소가 나오면 어디 출신이다라는 뜻으로 출신지를 나타낼 때 아주 자주 쓰이는 기초 표현이랍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 안경을 쓰고,\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">wear \u003c/span>\u003cspan class=\"tgt\">glasses \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">믿어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">believe \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">롤 모델이 더 많이 필요하다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">need\u003c/span> more good role models\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">안경을 쓴\u003c/span>\u003cspan class=\"en\">with glasses\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">영화와 TV 쇼에\u003c/span>\u003cspan class=\"en\">in movies and TV shows.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">저는 안경을 쓰고, 영화와 TV 쇼에 안경을 쓴 롤 모델이 더 많이 필요하다고 믿어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 필자가 안경을 쓰는 사람으로서 대중 매체에 안경 쓴 캐릭터가 부족하다는 \u003cb class=\"key\">문제의식\u003c/b>을 드러냅니다. 자신과 닮은 \u003cb class=\"key\">긍정적인 \u003c/b>\u003cb class=\"key\">롤 \u003c/b>\u003cb class=\"key\">모델\u003c/b>이 필요하다는 주장이 담겨 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사의 병렬 구조\u003c/span> : I [주어] + wear [동사1] + ... + and + believe [동사2] : \"안경을 쓰고 ~라고 믿다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that의 생략\u003c/span> : believe [타동사] + (that [접속사]) + we need [절/목적어] : \"~라고 믿다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"I wear glasses, 저는 안경을 쓰고. and believe, 믿어요. we need more good role models, 롤 모델이 더 많이 필요하다고. with glasses, 안경을 쓴. in movies and TV shows, 영화와 TV 쇼에. 이 문장 전체를 해석하면, 저는 안경을 쓰고, 영화와 TV 쇼에 안경을 쓴 롤 모델이 더 많이 필요하다고 믿어요.","hl":"m"},{"n":16,"text":"필자가 안경을 쓰는 사람으로서 느끼는 불편함과 필요성을 말하고 있어요. 영화나 티비에서 자신처럼 안경을 쓴 긍정적인 대상이 필요하다는 주장을 펼치는 아주 중요한 문장이에요.","hl":"mn"},{"n":17,"text":"첫 번째 포인트는 wear와 believe가 and로 연결된 병렬 구조예요. 주어인 I 하나에 두 동사가 모두 걸리는 것이죠. 두 번째는 believe 뒤에 접속사 that이 생략되어 있다는 점이에요. 그래서 뒤에 we need라는 새로운 주어와 동사가 바로 이어질 수 있는 거랍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서,\u003c/span>\u003cspan class=\"en\">So,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 편지를 보냈어요\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">sent \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">letter \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">디즈니에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">Disney\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">9살 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">9\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그래서, 저는 9살 때 디즈니에 편지를 보냈어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 생각에만 그치지 않고 디즈니에 편지를 보내는 \u003cb class=\"key\">구체적인 \u003c/b>\u003cb class=\"key\">행동\u003c/b>을 취했음을 보여줍니다. 'So'라는 접속사를 통해 앞서 언급한 신념이 \u003cb class=\"key\">행동의 \u003c/b>\u003cb class=\"key\">원인\u003c/b>이 되었음을 알 수 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">4형식을 3형식으로 전환\u003c/span> : send [동사] + a letter [직접목적어] + to [전치사] + Disney [간접목적어] : \"디즈니에 편지를 보냈다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">시간을 나타내는 접속사 when\u003c/span> : when [접속사] + I [주어] + was [동사] + 9 [보어] : \"내가 아홉 살이었을 때\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"So, 그래서. I sent a letter, 저는 편지를 보냈어요. to Disney, 디즈니에. when I was 9, 9살 때. 이 문장 전체를 해석하면, 그래서, 저는 9살 때 디즈니에 편지를 보냈어요.","hl":"m"},{"n":19,"text":"앞 문장에서 느꼈던 생각을 실제로 행동에 옮긴 장면이에요. 어린 나이임에도 불구하고 자신의 의견을 세상에 알리기 위해 편지 쓰기라는 적극적인 방법을 선택했죠.","hl":"mn"},{"n":20,"text":"먼저 sent a letter to Disney 부분을 봐주세요. 원래 누구에게 무엇을 보내다라는 사형식 문장이었는데, 순서가 바뀌면서 전치사 to를 사용한 삼형식 문장이 되었어요. 다음으로 when은 시간을 나타내는 접속사로, 내가 아홉 살이었을 때라는 상황을 설명해 주고 있답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 그들에게 부탁했어요\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">asked \u003c/span>\u003cspan class=\"tgt\">them \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 많은 캐릭터를 만들어 달라고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">make\u003c/span> more characters\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">안경을 쓰고 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">wearing \u003c/span>\u003cspan class=\"tgt\">glasses\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">저는 그들에게 안경을 쓰고 있는 더 많은 캐릭터를 만들어 달라고 부탁했어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 로리가 디즈니 측에 보낸 편지의 구체적인 \u003cb class=\"key\">요구 \u003c/b>\u003cb class=\"key\">사항\u003c/b>을 나타냅니다. 안경을 쓴 롤모델이 필요하다는 문제의식을 바탕으로 실질적인 \u003cb class=\"key\">변화\u003c/b>를 제안하는 핵심적인 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">5형식 문장 (ask + 목적어 + to부정사)\u003c/span> : ask [동사] + them [목적어] + to make [목적격 보어] : \"그들에게 ~해달라고 부탁했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재분사의 명사 수식\u003c/span> : characters [명사] + wearing [현재분사구] : \"안경을 쓰고 있는 캐릭터들\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"I asked them, 저는 그들에게 부탁했어요. to make more characters, 더 많은 캐릭터를 만들어 달라고. wearing glasses, 안경을 쓰고 있는. 이 문장 전체를 해석하면, 저는 그들에게 안경을 쓰고 있는 더 많은 캐릭터를 만들어 달라고 부탁했어요.","hl":"m"},{"n":22,"text":"로리가 디즈니에 구체적으로 무엇을 요구했는지 보여주는 문장이에요. 안경 쓴 캐릭터가 적다는 문제에 대한 해결책을 제안하고 있죠.","hl":"mn"},{"n":23,"text":"첫 번째로 ask 동사는 목적어 뒤에 to부정사를 써서 목적격 보어로 사용해요. 두 번째로 wearing은 현재분사로 앞에 있는 명사를 수식하며 능동의 의미를 나타냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저희 엄마는 제 편지를 공유했고\u003c/span>\u003cspan class=\"en\">My mom shared my letter\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">페이스북에\u003c/span>\u003cspan class=\"en\">on Facebook\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 사람들이 그것을 좋아해 주었어요.\u003c/span>\u003cspan class=\"en\">and lots of people liked it.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">저희 엄마는 페이스북에 제 편지를 공유했고, 많은 사람들이 그것을 좋아해 주었어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 로리의 개인적인 행동이 SNS를 통해 \u003cb class=\"key\">대중적 \u003c/b>\u003cb class=\"key\">공감\u003c/b>을 얻게 되는 과정을 보여줍니다. 많은 사람의 '좋아요'가 디즈니의 \u003cb class=\"key\">움직임\u003c/b>을 끌어내는 원동력이 되었음을 암시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">과거 시제 동사의 병렬 구조\u003c/span> : shared [동사1] + and [접속사] + liked [동사2] : \"공유했고 그리고 좋아했다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"My mom shared my letter, 저희 엄마는 제 편지를 공유했고. on Facebook, 페이스북에. and lots of people liked it, 많은 사람들이 그것을 좋아해 주었어요.. 이 문장 전체를 해석하면, 저희 엄마는 페이스북에 제 편지를 공유했고, 많은 사람들이 그것을 좋아해 주었어요.","hl":"m"},{"n":25,"text":"로리의 작은 행동이 SNS를 통해 대중의 관심을 얻게 되는 과정이에요. 많은 사람의 공감이 변화의 시작이 되었음을 알 수 있어요.","hl":"mn"},{"n":26,"text":"접속사 and를 중심으로 shared와 liked가 병렬 구조를 이루고 있어요. 두 동사 모두 과거 시제로 일치시켜준 점에 주의하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고맙게도, 디즈니는 제 얘기를 듣고\u003c/span>\u003cspan class=\"en\">Thankfully, Disney \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">listened \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Mirabel이라는 캐릭터를 만들어냈어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">created\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">character, \u003c/span>\u003cspan class=\"tgt\">Mirabel\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">영화 Encanto의\u003c/span>\u003cspan class=\"en\">in the movie Encanto.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">고맙게도, 디즈니는 제 얘기를 듣고 영화 「Encanto」의 Mirabel이라는 캐릭터를 만들어냈어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 로리의 편지에 대한 디즈니의 \u003cb class=\"key\">긍정적인 \u003c/b>\u003cb class=\"key\">응답\u003c/b>과 그 결과를 나타냅니다. 한 아이의 목소리가 실제 \u003cb class=\"key\">영화 \u003c/b>\u003cb class=\"key\">제작\u003c/b>에 영향을 미친 성공적인 사례를 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사의 병렬 구조\u003c/span> : listened [동사1] + and [접속사] + created [동사2] : \"듣고 만들어냈다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동격의 콤마\u003c/span> : the character [명사] + , [동격] + Mirabel [명사] : \"Mirabel이라는 캐릭터\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Thankfully, Disney listened, 고맙게도, 디즈니는 제 얘기를 듣고. and created the character, Mirabel, Mirabel이라는 캐릭터를 만들어냈어요. in the movie Encanto, 영화 Encanto의. 이 문장 전체를 해석하면, 고맙게도, 디즈니는 제 얘기를 듣고 영화 「Encanto」의 Mirabel이라는 캐릭터를 만들어냈어요.","hl":"m"},{"n":28,"text":"로리의 노력이 디즈니의 긍정적 반응을 끌어내어 실제 결과로 이어진 순간이에요. Mirabel이라는 캐릭터 탄생의 배경을 설명하고 있죠.","hl":"mn"},{"n":29,"text":"콤마 뒤에 나온 Mirabel은 앞에 나온 character와 동일 인물을 나타내는 동격의 콤마예요. 문장의 동사인 listened와 created는 주어 Disney에 연결되는 병렬 구조입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 영화는\u003c/span>\u003cspan class=\"en\">The movie\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">였다\u003c/span>\u003cspan class=\"en\">was\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">큰 성공!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">huge \u003c/span>\u003cspan class=\"tgt\">success\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 영화는 큰 성공을 거두었어요!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 주인공이 안경을 쓴 영화 '엔칸토'가 대중에게 \u003cb class=\"key\">성공적\u003c/b>으로 받아들여졌음을 나타냅니다. Lowri의 제안이 실제 \u003cb class=\"key\">긍정적인 \u003c/b>\u003cb class=\"key\">결과\u003c/b>로 이어졌음을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사구 주격 보어\u003c/span> : be동사(was) + [a huge success (명사구/보어)] : \"큰 성공\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"The movie, 그 영화는. was, 였다. a huge success!, 큰 성공!. 이 문장 전체를 해석하면, 그 영화는 큰 성공을 거두었어요!","hl":"m"},{"n":31,"text":"앞 문장에서 디즈니가 만든 영화 엔칸토가 관객들에게 아주 큰 사랑을 받았다는 뜻이에요. Lowri의 작은 아이디어가 세상을 바꾸는 큰 결과로 이어졌다는 것을 알 수 있죠.","hl":"mn"},{"n":32,"text":"문장의 뼈대를 보면 be동사인 was 뒤에 a huge success라는 명사 덩어리가 왔어요. 이 명사구는 주어인 영화가 어떤 대상이었는지 설명해 주는 주격보어 역할을 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 또한 시작했어요\u003c/span>\u003cspan class=\"en\">I also started\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">캠페인을\u003c/span>\u003cspan class=\"en\">a campaign\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">#GlassesOn이라고 불리는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">called \u003c/span>\u003cspan class=\"tgt\">#GlassesOn\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">저는 또한 #GlassesOn이라는 캠페인을 시작했어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 안경에 대한 인식을 개선하기 위해 편지를 쓰는 것에서 나아가 더 조직적인 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">운동\u003c/b>으로 활동을 \u003cb class=\"key\">확장\u003c/b>했음을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사의 후치수식\u003c/span> : 명사(a campaign) + [called (과거분사) + 명사(보어)] : \"#GlassesOn이라고 불리는\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"I also started, 저는 또한 시작했어요. a campaign, 캠페인을. called #GlassesOn, #GlassesOn이라고 불리는. 이 문장 전체를 해석하면, 저는 또한 #GlassesOn이라는 캠페인을 시작했어요.","hl":"m"},{"n":34,"text":"Lowri가 영화 캐릭터를 만드는 것에 그치지 않고, 더 많은 사람의 참여를 이끌어내기 위해 캠페인을 시작했다는 내용이에요. 자신의 신념을 행동으로 옮기는 적극성이 느껴지죠.","hl":"mn"},{"n":35,"text":"여기서 가장 중요한 문법은 a campaign 뒤에 나온 called예요. 캠페인 입장에서는 이름이 불리는 대상이기 때문에 과거분사를 써서 뒤에서 앞으로 꾸며주고 있어요. 해석은 무엇무엇이라고 불리는 이라고 하면 자연스러워요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 아이디어는 시작되었어요\u003c/span>\u003cspan class=\"en\">The idea started\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저희 엄마가 ~할 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">when\u003c/span> my mom\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">찾고 계셨다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">looking \u003c/span>\u003cspan class=\"tgt\">for\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저를 위한 이모티콘을\u003c/span>\u003cspan class=\"en\">an emoji for me.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 아이디어는 저희 엄마가 저를 위한 이모티콘을 찾다가 시작되었어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 캠페인을 시작하게 된 구체적인 \u003cb class=\"key\">계기\u003c/b>를 설명합니다. 일상생활에서 겪은 \u003cb class=\"key\">불편함\u003c/b>이 변화의 씨앗이 되었음을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간의 접속사\u003c/span> : when + 주어(my mom) + 동사(was looking for ~) : \"엄마가 ~하고 계셨을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거진행형\u003c/span> : be동사 과거(was) + 현재분사(looking for) : \"찾고 계셨다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"The idea started, 그 아이디어는 시작되었어요. when my mom, 저희 엄마가 ~할 때. was looking for, 찾고 계셨다. an emoji for me, 저를 위한 이모티콘을. 이 문장 전체를 해석하면, 그 아이디어는 저희 엄마가 저를 위한 이모티콘을 찾다가 시작되었어요.","hl":"m"},{"n":37,"text":"새로운 캠페인에 대한 아이디어가 엄마의 평범한 일상 속 행동에서 나왔다는 것을 알려주고 있어요. 나를 닮은 이모티콘이 없다는 것을 깨달은 그 시점이 중요하죠.","hl":"mn"},{"n":38,"text":"두 가지 포인트를 짚어볼게요. 첫 번째로 접속사 when은 뒤에 주어와 동사를 데리고 와서 엄마가 무언가를 하던 때라는 시점을 나타내요. 두 번째로 was looking for는 과거진행형으로, 엄마가 당시 열심히 찾고 있던 중이었다는 상황을 생생하게 묘사해 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이모티콘은 거의 없었고\u003c/span>\u003cspan class=\"en\">There were \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">few\u003c/span> emojis\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">안경을 쓴\u003c/span>\u003cspan class=\"en\">with glasses,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들은 보이지 않았어요\u003c/span>\u003cspan class=\"en\">and they didn't \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">look \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저와 닮아\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">like\u003c/span> me.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">안경을 쓴 이모티콘은 몇 개 없었고, 그것들은 저와 닮아 보이지 않았어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 안경 쓴 이모티콘이 부족하다는 \u003cb class=\"key\">부족함\u003c/b>을 지적하며, 주인공이 직접 행동에 나서게 된 구체적인 \u003cb class=\"key\">동기\u003c/b>를 설명합니다. 여기서 \u003cb class=\"key\">few\u003c/b>는 수량이 거의 없다는 부정적인 뉘앙스를 전달합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정 형용사 (수)\u003c/span> : few + [복수 명사] : \"거의 없는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">감각동사 + 전치사 like\u003c/span> : look like + [명사(구)] : \"~처럼 보이다, ~와 닮아 보이다\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"There were few emojis, 이모티콘은 거의 없었고. with glasses, 안경을 쓴. and they didn't look, 그것들은 보이지 않았어요. like me, 저와 닮아. 이 문장 전체를 해석하면, 안경을 쓴 이모티콘은 몇 개 없었고, 그것들은 저와 닮아 보이지 않았어요.","hl":"m"},{"n":40,"text":"이 문장은 안경 쓴 사람들을 대표하는 이모티콘이 부족하다는 점을 지적해요. 주인공이 캠페인을 시작하게 된 아주 중요한 동기가 되는 부분이죠.","hl":"mn"},{"n":41,"text":"첫 번째로 few는 거의 없는이라는 부정적인 의미를 담고 있어요. 두 번째로 look like 뒤에는 명사가 와서 무엇과 닮아 보인다는 뜻으로 쓰였네요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서 저는 편지를 썼어요\u003c/span>\u003cspan class=\"en\">So, I wrote a letter\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유니코드 협회에\u003c/span>\u003cspan class=\"en\">to the *Unicode Consortium\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">요청하기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">ask \u003c/span>\u003cspan class=\"tgt\">for\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">안경을 쓰고 있는 이모티콘을 더 많이\u003c/span>\u003cspan class=\"en\">more emojis with glasses.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그래서 저는 유니코드 협회에 안경을 쓰고 있는 이모티콘을 더 많이 만들어달라고 요청하기 위해 편지를 썼어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 불편함을 느끼는 데서 그치지 않고, 변화를 만들기 위해 실제 \u003cb class=\"key\">실행\u003c/b>에 옮기는 모습입니다. \u003cb class=\"key\">to부정사\u003c/b>를 사용하여 편지를 보낸 명확한 \u003cb class=\"key\">목적\u003c/b>을 나타냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법 (목적)\u003c/span> : wrote a letter + [to ask for (to부정사구)] : \"요청하기 위해\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"So, I wrote a letter, 그래서 저는 편지를 썼어요. to the *Unicode Consortium, 유니코드 협회에. to ask for, 요청하기 위해. more emojis with glasses, 안경을 쓰고 있는 이모티콘을 더 많이. 이 문장 전체를 해석하면, 그래서 저는 유니코드 협회에 안경을 쓰고 있는 이모티콘을 더 많이 만들어달라고 요청하기 위해 편지를 썼어요.","hl":"m"},{"n":43,"text":"주인공이 문제를 해결하기 위해 직접 편지를 쓰는 실행 과정을 보여주고 있어요. 이모티콘을 만드는 곳에 직접 자신의 의견을 전달하는 적극적인 태도가 드러나죠.","hl":"mn"},{"n":44,"text":"여기서 to ask for는 무엇을 요청하기 위해서라는 뜻의 투부정사의 부사적 용법으로 쓰였어요. 편지를 쓴 구체적인 목적을 설명하고 있답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 또한 편지를 보냈어요\u003c/span>\u003cspan class=\"en\">I also sent a letter\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">첨단 기술 대기업들에\u003c/span>\u003cspan class=\"en\">to big tech companies\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">구글과 같은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">like\u003c/span> Google.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">저는 구글과 같은 첨단 기술 대기업에도 편지를 보냈어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 캠페인의 대상을 특정 협회에서 \u003cb class=\"key\">사회 \u003c/b>\u003cb class=\"key\">전반\u003c/b>의 큰 기업들로 확장하고 있습니다. \u003cb class=\"key\">also\u003c/b>라는 부사를 통해 주인공의 노력이 \u003cb class=\"key\">추가\u003c/b>되고 있음을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사\u003c/span> : big tech companies + [like (전치사)] + Google : \"~와 같은\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"I also sent a letter, 저는 또한 편지를 보냈어요. to big tech companies, 첨단 기술 대기업들에. like Google, 구글과 같은. 이 문장 전체를 해석하면, 저는 구글과 같은 첨단 기술 대기업에도 편지를 보냈어요.","hl":"m"},{"n":46,"text":"협회뿐만 아니라 영향력이 큰 대기업들에게도 목소리를 냈다는 내용이에요. 사회 전반에 걸쳐 변화를 이끌어내려는 주인공의 노력이 돋보이는 장면입니다.","hl":"mn"},{"n":47,"text":"여기서 like는 좋아하다는 동사가 아니라 무엇과 같은이라는 뜻을 가진 전치사로 쓰였어요. 구글과 같은 대기업을 예시로 들고 있죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 사람들은\u003c/span>\u003cspan class=\"en\">Many people\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제 의견에 동의하며\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">agree \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">me\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이제\u003c/span>\u003cspan class=\"en\">now,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 우리는\u003c/span>\u003cspan class=\"en\">and we'll\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">계속 노력할 거예요!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">keep \u003c/span>\u003cspan class=\"tgt\">trying\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이제 많은 사람들은 제 의견에 동의하며, 우리는 계속 노력할 거예요!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글의 마지막 문장으로, 캠페인을 통해 얻은 \u003cb class=\"key\">대중적 \u003c/b>\u003cb class=\"key\">지지\u003c/b>를 확인하고 있습니다. 앞으로도 \u003cb class=\"key\">다양성\u003c/b>을 존중받는 세상을 만들기 위해 \u003cb class=\"key\">지속적인 \u003c/b>\u003cb class=\"key\">노력\u003c/b>을 기울이겠다는 다짐을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">자동사 agree와 전치사 with\u003c/span> : agree [자동사] + with [전치사] + me [목적어] : \"제 의견에 동의하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">keep + 동명사\u003c/span> : keep [동사] + trying [동명사/목적어] : \"계속 노력하다\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"Many people, 많은 사람들은. agree with me, 제 의견에 동의하며. now, 이제. and we'll, 그리고 우리는. keep trying!, 계속 노력할 거예요!. 이 문장 전체를 해석하면, 이제 많은 사람들은 제 의견에 동의하며, 우리는 계속 노력할 거예요!","hl":"m"},{"n":49,"text":"로리가 혼자 시작했던 일이 이제는 많은 사람의 공감을 얻고 있다는 걸 보여주는 문장이에요. 더 나은 세상을 위해 멈추지 않고 계속 나아가겠다는 강한 의지가 담겨 있죠.","hl":"mn"},{"n":50,"text":"첫 번째로 agree with라는 표현은 누구의 의견에 동의하다라는 뜻으로 전치사 with와 함께 쓰인다는 점을 기억하세요. 두 번째로 keep 뒤에 동사 ing 형태인 동명사가 오면 계속해서 무엇을 한다는 지속의 의미를 전달합니다. 여기서는 keep trying이라고 해서 계속 노력하겠다는 다짐을 멋지게 표현했네요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>영국의 Lowri는 미디어에 안경을 쓴 \u003cb class=\"key\">롤 \u003c/b>\u003cb class=\"key\">모델\u003c/b>이 부족하다는 점을 인지했습니다.\u003c/li>\u003cli>그녀의 편지로 인해 디즈니 영화 '엔칸토'에 안경을 쓴 주인공 \u003cb class=\"key\">미라벨\u003c/b>이 등장했습니다.\u003c/li>\u003cli>이후 #GlassesOn 캠페인을 통해 \u003cb class=\"key\">이모티콘\u003c/b>에서의 다양성 확보를 위해 노력했습니다.\u003c/li>\u003cli>유니코드 협회와 대기업에 편지를 보내며 더 많은 \u003cb class=\"key\">표현의 \u003c/b>\u003cb class=\"key\">다양성\u003c/b>을 이끌어내고 있습니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Lowri's proactive efforts led to better representation for people who wear glasses in media and technology.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">안경 쓴 \u003cb class=\"key\">롤 \u003c/b>\u003cb class=\"key\">모델\u003c/b>의 부재를 느낀 Lowri가 디즈니와 빅테크 기업에 편지를 보내 \u003cb class=\"key\">표현의 \u003c/b>\u003cb class=\"key\">다양성\u003c/b>을 이끌어내고 캠페인을 전개한 이야기입니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":51,"text":"Lowri의 이야기는 작은 목소리가 모여 얼마나 큰 변화를 만들 수 있는지 보여주는 감동적인 사례였습니다. 여러분도 주변의 문제를 발견하면 Lowri처럼 용기 있게 자신의 의견을 표현해 보는 건 어떨까요? 오늘 수업 여기서 마치겠습니다. 수고하셨어요!","hl":null}]}]});</script></body></html>
