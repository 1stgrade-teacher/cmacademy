lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">이 글을 읽기 전, 사회적 영향력을 행사하는 시민 행동주의(Civic Activism)의 개념을 이해하면 좋습니다. 이는 개인이 사회적 문제를 인식하고 이를 해결하기 위해 기업이나 기관에 직접 의견을 전달하여 실질적인 변화를 이끌어내는 활동을 말하는데요, 마치 우리가 평소 불편함을 느꼈던 서비스에 고객의 소리를 직접 전달하여 개선을 요구하는 것과 비슷한 맥락입니다. 또한, 텍스트에 등장하는 유니코드 컨소시엄(Unicode Consortium)은 전 세계 어디서나 통용되는 문자 코드를 표준화하는 비영리 단체로, 우리가 매일 사용하는 이모지(Emoji)의 배정권을 쥐고 있는 핵심 기구입니다. 즉, 로우리의 사례는 미디어 재현(Media Representation)의 중요성을 대중에게 알리고, 거대 기술 기업들을 대상으로 목소리를 높여 포용적인 문화를 만들고자 하는 능동적인 노력의 과정이라고 볼 수 있습니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01문제 제기와 편지 발송</div><ul><li>로리는 미디어 속 안경 쓴 역할 모델의 부족함을 느끼고 디즈니에 변화를 요청했다.</li><li>영화와 TV 속 안경 쓴 역할 모델(role models) 필요성 강조</li><li>9살 때 디즈니(Disney)에 안경 쓴 캐릭터 제작 요청 편지 발송</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02캠페인의 성과</div><ul><li>로리의 목소리는 소셜 미디어를 통해 공유되었고, 결국 디즈니의 응답을 이끌어냈다.</li><li>페이스북(Facebook)을 통한 사람들의 공감과 지지</li><li>영화 엔칸토(Encanto)의 주인공 미라벨(Mirabel) 탄생</li><li>핵심 키워드: 영화 엔칸토(Encanto), 역할 모델(role models)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03새로운 캠페인 시작</div><ul><li>로리는 이모지 속 안경 쓴 캐릭터가 부족하다는 점에 착안하여 #GlassesOn 캠페인을 시작했다.</li><li>자신과 닮은 안경 쓴 이모지(emoji)의 부재 확인</li><li>#GlassesOn 캠페인 기획 및 시작</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04변화를 위한 노력 지속</div><ul><li>로리는 안경 쓴 이모지를 늘리기 위해 유니코드 컨소시엄과 IT 기업들에 적극적으로 목소리를 내고 있다.</li><li>유니코드 컨소시엄(Unicode Consortium)에 이모지 추가 요청</li><li>구글(Google) 등 대형 IT 기업들에 협조 서한 발송</li><li>지속적인 노력(keep trying)을 통한 변화 도모</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">role model</td><td class=\"m\">역할 모델, 귀감</td></tr><tr><td class=\"w\">huge</td><td class=\"m\">거대한, 엄청난</td></tr><tr><td class=\"w\">success</td><td class=\"m\">성공, 성과</td></tr><tr><td class=\"w\">campaign</td><td class=\"m\">캠페인, 운동</td></tr><tr><td class=\"w\">look for</td><td class=\"m\">~을 찾다, ~을 구하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">emoji</td><td class=\"m\">이모지, 그림 문자</td></tr><tr><td class=\"w\">tech</td><td class=\"m\">기술, 공학</td></tr><tr><td class=\"w\">agree with</td><td class=\"m\">~와 의견이 같다, ~에 동의하다</td></tr><tr><td class=\"w\">keep trying</td><td class=\"m\">계속 노력하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">제 이름은 로우리입니다</span><span class=\"en\"><b>My name <span class=\"grammar-hl\">is</span> Lowri</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 저는 영국 출신이에요.</span><span class=\"en\"><b>and I’m from England.</b></span></div></div><div class=\"lec-sent-ko\">제 이름은 Lowri이고 저는 영국 출신이에요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글쓴이가 자신을 소개하며 자신의 배경을 밝힘으로써, 앞으로 펼칠 이야기의 화자가 누구인지 독자에게 알리는 도입부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is 2형식 구조: 주어(My name) + 동사(is) + 보어(Lowri) 형태로 주어의 상태나 정체를 설명함</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">저는 안경을 써요</span><span class=\"en\"><b>I wear glasses</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 믿어요</span><span class=\"en\"><b>and <span class=\"grammar-hl\">believe</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 더 많은 좋은 안경 쓴 롤 모델들이 필요하다고</span><span class=\"en\"><b>we need more good role models <span class=\"grammar-hl\">with glasses</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">영화와 TV 프로그램 안에</span><span class=\"en\"><b>in movies and TV shows.</b></span></div></div><div class=\"lec-sent-ko\">저는 안경을 쓰고, 영화와 TV 쇼에 안경을 쓴 롤 모델이 더 많이 필요하다고 믿어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 1번 문장에서 소개한 화자가 왜 이 글을 쓰게 되었는지 그 동기와 자신의 주장을 명확하게 드러내고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">believe 3형식 구조: 주어(I) + 동사(believe) + 목적어(we need... TV shows)의 that절 형태</div><div class=\"lec-gr-item\">with glasses (관용표현): with + 명사(glasses)를 사용하여 &#39;~을 쓴(상태)&#39;이라는 신체적 특징을 묘사함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">role model</td><td class=\"m\">역할 모델, 귀감</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그래서, 저는 디즈니에 편지를 보냈어요</span><span class=\"en\"><b>So, I <span class=\"grammar-hl\">sent</span> a letter to Disney</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">제가 9살이었을 때.</span><span class=\"en\"><b><span class=\"grammar-hl\">when I was 9</span>.</b></span></div></div><div class=\"lec-sent-ko\">그래서, 저는 9살 때 디즈니에 편지를 보냈어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 생각에 그치지 않고 구체적인 행동으로 옮긴 첫 번째 사례를 제시하며 시간적 배경을 알려줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">sent 3형식 구조: 주어(I) + 동사(sent) + 목적어(a letter) + 부사구(to Disney)로 이루어짐</div><div class=\"lec-gr-item\">when I was 9 (관계부사(시간)): when은 &#39;나이가 9살인 시기&#39;를 나타내는 부사절을 이끎</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">저는 그들에게 요청했어요</span><span class=\"en\"><b>I <span class=\"grammar-hl\">asked them</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">안경을 쓴 더 많은 캐릭터들을 만들라고.</span><span class=\"en\"><b><span class=\"grammar-hl\">to make</span> more characters <span class=\"grammar-hl\">wearing glasses</span>.</b></span></div></div><div class=\"lec-sent-ko\">저는 그들에게 안경을 쓰고 있는 더 많은 캐릭터를 만들어 달라고 부탁했어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 3번 문장에서 보낸 편지의 구체적인 내용을 설명하며, 대기업을 상대로 자신의 변화를 요구했음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">asked them to make 5형식(SVOC) 구조: ask + 목적어(them) + 목적보어(to부정사: to make)의 형태로 목적어에게 ~할 것을 요청하다라는 의미</div><div class=\"lec-gr-item\">to make (to부정사): 5형식 문장에서 ask의 목적보어 역할을 하며, 목적어(them)가 해야 할 동작을 나타냄</div><div class=\"lec-gr-item\">wearing glasses (현재분사(형용사)): wearing이 명사(characters)를 뒤에서 수식하며, &#39;안경을 쓰고 있는&#39;이라는 동작 상태를 나타냄</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">저희 엄마는 제 편지를 페이스북에 공유했고</span><span class=\"en\"><b>My mom <span class=\"grammar-hl\">shared</span> my letter on Facebook</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 사람들이 그것을 좋아했어요.</span><span class=\"en\"><b>and lots of people liked it.</b></span></div></div><div class=\"lec-sent-ko\">저희 엄마는 페이스북에 제 편지를 공유했고, 많은 사람들이 그것을 좋아해 주었어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 개인의 편지라는 사적인 행동이 SNS라는 매체를 통해 어떻게 사회적 지지를 얻게 되었는지 그 확장 과정을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">shared 3형식 구조: 주어(My mom) + 동사(shared) + 목적어(my letter) + 부사구(on Facebook)</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">다행히도, 디즈니는 제 말을 들었고</span><span class=\"en\"><b>Thankfully, Disney <span class=\"grammar-hl\">listened</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 캐릭터인 미라벨을 만들어냈어요</span><span class=\"en\"><b><span class=\"grammar-hl\">and created</span> the character, Mirabel</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">영화 엔칸토 속의.</span><span class=\"en\"><b>in the movie Encanto.</b></span></div></div><div class=\"lec-sent-ko\">고맙게도, 디즈니는 제 얘기를 듣고 영화 「Encanto」의 Mirabel이라는 캐릭터를 만들어냈어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 노력과 사회적 관심이 결과적으로 어떤 실질적인 변화를 이끌어냈는지 구체적인 예시를 들어 증명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">listened and created 병렬 구조: 주어(Disney)에 이어지는 두 개의 일반동사가 and로 연결되어 동작의 순차적 발생을 나타냄</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 영화는</span><span class=\"en\"><b>The movie</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">큰 성공이었어요!</span><span class=\"en\"><b><span class=\"grammar-hl\">was</span> a huge success!</b></span></div></div><div class=\"lec-sent-ko\">그 영화는 큰 성공을 거두었어요!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 안경 쓴 캐릭터의 등장이 포함된 영화가 성공했다는 점을 강조하여, 자신의 요구가 타당했음을 다시 한번 뒷받침합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was 2형식 구조: 주어(The movie) + 동사(was) + 보어(a huge success)로 주어의 상태나 성격을 기술함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">huge</td><td class=\"m\">거대한, 엄청난</td></tr><tr><td class=\"w\">success</td><td class=\"m\">성공, 성과</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">저는 또한 캠페인을 시작했어요</span><span class=\"en\"><b>I also started a campaign</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">#GlassesOn이라고 불리는.</span><span class=\"en\"><b><span class=\"grammar-hl\">called #GlassesOn</span>.</b></span></div></div><div class=\"lec-sent-ko\">저는 또한 #GlassesOn이라는 캠페인을 시작했어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 디즈니 사례 이후에 멈추지 않고 더 넓은 영역으로 자신의 활동을 확장하려는 시도를 알립니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">called #GlassesOn (과거분사(형용사)): called가 명사(a campaign)를 뒤에서 수식하며, &#39;…라 불리는&#39;이라는 수동적 의미의 형용사구 역할</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">campaign</td><td class=\"m\">캠페인, 운동</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 아이디어는 시작되었어요</span><span class=\"en\"><b>The idea <span class=\"grammar-hl\">started</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저희 엄마가 저를 위한 이모티콘을 찾고 계셨을 때.</span><span class=\"en\"><b><span class=\"grammar-hl\">when my mom was looking for</span> an emoji for me.</b></span></div></div><div class=\"lec-sent-ko\">그 아이디어는 저희 엄마가 저를 위한 이모티콘을 찾다가 시작되었어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 캠페인을 시작하게 된 구체적인 계기를 설명하며, 일상 속 작은 불편함이 문제의식의 출발점이 되었음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">started 1형식 구조: 주어(The idea) + 동사(started)로 문장이 종결됨</div><div class=\"lec-gr-item\">when my mom was looking for (관계부사(시간)): when이 &#39;엄마가 찾고 있던 때&#39;라는 시간을 이끄는 부사절을 형성</div><div class=\"lec-gr-item\">was looking for (현재진행): be동사(was) + -ing(looking) 구조로 과거의 특정 시점에 진행 중이던 동작을 나타냄</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">emoji</td><td class=\"m\">이모지, 그림 문자</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">안경 쓴 이모티콘은 거의 없었고,</span><span class=\"en\"><b>There were few emojis <span class=\"grammar-hl\">with glasses</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들은 저와 닮아 보이지 않았어요.</span><span class=\"en\"><b>and they didn’t look like me.</b></span></div></div><div class=\"lec-sent-ko\">안경을 쓴 이모티콘은 몇 개 없었고, 그것들은 저와 닮아 보이지 않았어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 9번 문장에 이어, 왜 이모지가 부족한지 그 구체적인 이유와 자신이 느낀 결핍을 부연 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">with glasses (관용표현): with + 명사(glasses)를 사용하여 &#39;안경을 가진&#39;이라는 상태를 묘사함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">emoji</td><td class=\"m\">이모지, 그림 문자</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 11 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그래서, 저는 유니코드 협회에 편지를 썼어요</span><span class=\"en\"><b>So, I wrote a letter to the Unicode Consortium</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">안경 쓴 이모티콘을 더 많이 요청하려고.</span><span class=\"en\"><b><span class=\"grammar-hl\">to ask for</span> more emojis <span class=\"grammar-hl\">with glasses</span>.</b></span></div></div><div class=\"lec-sent-ko\">그래서 저는 유니코드 협회에 안경을 쓰고 있는 이모티콘을 더 많이 만들어달라고 요청하기 위해 편지를 썼어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이모지 문제라는 새로운 상황에 맞춰 대응하는 구체적인 행동을 제시하며, 3번 문장에서 보여준 방식과 논리적 구조를 동일하게 이어갑니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to ask for (to부정사): 문장에서 목적(~하기 위해서)을 나타내는 부사적 용법으로 쓰임</div><div class=\"lec-gr-item\">with glasses (관용표현): with + 명사(glasses)로 안경을 쓴 이모티콘이라는 속성을 수식함</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">emoji</td><td class=\"m\">이모지, 그림 문자</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 12 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">저는 또한 편지를 보냈어요</span><span class=\"en\"><b>I also sent a letter</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">거대 기술 기업들에게</span><span class=\"en\"><b>to big tech companies</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">구글 같은.</span><span class=\"en\"><b><span class=\"grammar-hl\">like Google</span>.</b></span></div></div><div class=\"lec-sent-ko\">저는 구글과 같은 첨단 기술 대기업에도 편지를 보냈어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 유니코드뿐만 아니라 실제 이모지를 사용하는 대기업들을 대상으로 직접적인 영향력을 행사하려는 노력을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">like Google (관용표현): like + 명사(Google)를 사용하여 &#39;~와 같은&#39;이라는 예시를 제시하는 전치사구</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">tech</td><td class=\"m\">기술, 공학</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 13 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">많은 사람들이 지금 제 의견에 동의해요,</span><span class=\"en\"><b>Many people agree with me now,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 우리는 계속 노력할 거예요!</span><span class=\"en\"><b>and we’ll <span class=\"grammar-hl\">keep trying</span>!</b></span></div></div><div class=\"lec-sent-ko\">이제 많은 사람들은 제 의견에 동의하며, 우리는 계속 노력할 거예요!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 자신의 개인적 문제의식이 사회적 공감을 얻었음을 확인하고, 앞으로도 변화를 위해 멈추지 않겠다는 의지를 다지며 글을 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">keep trying (관용표현): keep + -ing(동명사) 구조로 &#39;~을 계속하다&#39;라는 의미를 가짐</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">agree with</td><td class=\"m\">~와 의견이 같다, ~에 동의하다</td></tr><tr><td class=\"w\">keep trying</td><td class=\"m\">계속 노력하다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>로우리는 안경을 쓴 사람들을 위한 긍정적인 역할 모델이 부족하다고 느꼈다.</li><li>디즈니에 직접 편지를 보내 &#39;엔칸토&#39;의 미라벨이라는 캐릭터 탄생에 기여했다.</li><li>일상 속 부족한 이모지 문제를 해결하고자 유니코드와 IT 기업에 행동을 촉구했다.</li><li>개인의 작은 목소리가 사회적 공감을 얻어 실질적인 변화를 만들어내고 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Lowri successfully influenced movie character creation and tech industry standards by actively requesting better representation for people with glasses.</div>\n              <div class=\"lec-final-sum-ko\">로우리는 안경 쓴 사람들을 위한 더 나은 표현을 적극적으로 요구함으로써 영화 캐릭터 창조와 기술 업계 표준에 성공적으로 영향을 미쳤다.</div></div></div>"],"segs":[[{"audio":"./passage12_audio/1.mp3","hl":null}],[{"audio":"./passage12_audio/2.mp3","hl":null}],[{"audio":"./passage12_audio/3.mp3","hl":null},{"audio":"./passage12_audio/4.mp3","hl":"stage-0"},{"audio":"./passage12_audio/5.mp3","hl":"stage-1"},{"audio":"./passage12_audio/6.mp3","hl":"stage-2"},{"audio":"./passage12_audio/7.mp3","hl":"sta
