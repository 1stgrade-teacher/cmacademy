d635um99tbn/9k=\" alt=\"\"></div>","<div class=\"lec-cover-title\">Be My Eyes: Empowering the Blind Through AI and Human Connection<small>Be My Eyes: AI와 인간의 연결을 통한 시각 장애인 역량 강화</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">본격적으로 글을 읽기 전에 알아두면 좋을 핵심 개념인 보조 공학(Assistive Technology)은 장애인의 일상생활을 돕기 위해 개발된 도구나 소프트웨어를 의미하는데요, 마치 안경이 시력이 나쁜 사람의 눈을 대신하듯, 시각 장애인에게는 음성 안내 소프트웨어(Screen Reader)나 사물을 인식해주는 앱이 큰 역할을 합니다. 이번 글에서 소개되는 ‘Be My Eyes’는 크라우드소싱(Crowdsourcing) 방식을 활용해 전 세계의 자원봉사자들이 실시간으로 시각 정보를 제공하는 플랫폼인데, 최근에는 방대한 데이터를 학습한 인공지능(Artificial Intelligence, AI)이 이 과정을 보조하면서 더욱 정교한 묘사가 가능해졌습니다. 즉, 인간의 직관적인 공감 능력과 기계의 신속한 정보 처리 능력이 결합하여 시각 장애인의 정보 접근성을 획기적으로 높이고 있는 것이죠. 이처럼 기술이 인간의 한계를 어떻게 보완하고 삶의 질을 높여주는지 생각하며 글을 읽어보시면 훨씬 흥미로울 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01도입 및 상황</div><ul><li>시각장애인인 브라이언 피슐러가 일상에서 앱을 통해 도움을 받고 있다.</li><li>브라이언의 상태: 13세에 시력 상실 (lost sight)</li><li>앱의 도움: 일상생활 지원 (help him every day)</li><li>핵심 키워드: 시각장애인(blind), 비 마이 아이즈(Be My Eyes)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02앱의 작동 방식</div><ul><li>전 세계 수백만 명의 자원봉사자가 영상 통화를 통해 시각장애인을 돕는다.</li><li>연결 방식: 영상 통화(video calls)로 시각장애인과 연결</li><li>봉사자 규모: 600만 명 이상의 자원봉사자(volunteers)</li><li>주요 역할: 제품 라벨 읽기, 사진 묘사, 길 안내(guide)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03새로운 기능 도입</div><ul><li>인공지능 기술이 추가되면서 앱의 기능이 한층 더 발전하고 있다.</li><li>업그레이드 내용: 인공지능(AI) 기능 추가</li><li>인간과 AI의 공존: AI의 효율성과 봉사자의 중요성 병행</li><li>기대 효과: 시각장애인의 삶의 질 개선(improve their lives)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">blind</td><td class=\"m\">시각 장애가 있는, 눈먼</td></tr><tr><td class=\"w\">all over</td><td class=\"m\">도처에, 구석구석에</td></tr><tr><td class=\"w\">volunteer</td><td class=\"m\">자원봉사자, 지원자</td></tr><tr><td class=\"w\">describe</td><td class=\"m\">묘사하다, 서술하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">specific</td><td class=\"m\">특정한, 구체적인</td></tr><tr><td class=\"w\">artificial intelligence</td><td class=\"m\">인공지능</td></tr><tr><td class=\"w\">hopefully</td><td class=\"m\">바라건대, 희망을 품고</td></tr><tr><td class=\"w\">improve</td><td class=\"m\">개선하다, 향상시키다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Brian Fischler는</span><span class=\"en\"><b><span class=\"grammar-hl\">Brian Fischler</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">시각장애인이다.</span><span class=\"en\"><b><span class=\"grammar-hl\">is blind.</span></b></span></div></div><div class=\"lec-sent-ko\">Brian Fischler는 시각장애인이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 글의 주인공인 브라이언이 일상에서 마주하는 근본적인 제약을 소개하며, 이어질 내용에서 그가 기술을 통해 어떻게 도움을 받게 되는지 보여주기 위한 출발점입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Brian Fischler is blind. 2형식 구조: S(Brian Fischler) + V(is) + C(blind) 형태의 문장입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">blind</td><td class=\"m\">시각 장애가 있는, 눈먼</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 시력의 대부분을 잃었다</span><span class=\"en\"><b>He lost most of his sight</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그가 13살이었을 때.</span><span class=\"en\"><b><span class=\"grammar-hl\">when he was 13</span>.</b></span></div></div><div class=\"lec-sent-ko\">그는 13살 때 시력의 대부분을 잃었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 장애 사실을 뒷받침하며, 그가 태어날 때부터 앞을 보지 못했던 것이 아니라 성장 과정에서 시력을 상실했음을 알려주어 상황의 구체성을 더합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">when he was 13 (관계부사(시간)): when은 시간을 나타내는 관계부사로 &#39;그가 13살이었을 때&#39;라는 의미의 부사절을 이끕니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이제, 그는 오직 알 수 있다</span><span class=\"en\"><b>Now, he can only tell</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">밖이 밝은지 혹은 어두운지를.</span><span class=\"en\"><b><span class=\"grammar-hl\">if it’s light or dark outside</span>.</b></span></div></div><div class=\"lec-sent-ko\">이제, 그는 오직 밖이 밝은지 어두운지만 알 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 시력을 거의 잃은 현재 상태를 설명하며, 그가 세상을 인식하는 데 정보가 얼마나 제한적인지를 강조해 도움의 필요성을 역설합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">if it’s light or dark outside (간접의문문(명사절)): &#39;it&#39;s light or dark&#39;이 if절 내에서 &#39;빛이 있는지 아니면 어두운지&#39;라는 의문 상황을 나타내는 명사절로 사용되었습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만, “Be My Eyes”라는 앱이</span><span class=\"en\"><b>However, an app, “Be My Eyes,”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그를 돕고 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">is helping</span> him</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매일!</span><span class=\"en\"><b>every day!</b></span></div></div><div class=\"lec-sent-ko\">하지만, ‘Be My Eyes’라는 앱이 매일 그를 돕고 있다!</div></div>\n        <div class=\"lec-gramma        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">volunteer</td><td class=\"m\">자원봉사자, 지원자</td></tr><tr><td class=\"w\">describe</td><td class=\"m\">묘사하다, 서술하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은</span><span class=\"en\"><b>They</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">제품 라벨이나 우편물을 읽어 줄 수 있다</span><span class=\"en\"><b>can read product labels or mail</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그를 위해,</span><span class=\"en\"><b>for him,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사진을 묘사하거나,</span><span class=\"en\"><b>describe photos,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">심지어 그를 안내할 수도 있다</span><span class=\"en\"><b>or even <span class=\"grammar-hl\">guide him</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">특정 장소로.</span><span class=\"en\"><b><span class=\"grammar-hl\">to a specific place</span>.</b></span></div></div><div class=\"lec-sent-ko\">그들은 그를 위해 제품 라벨이나 우편물을 읽어 주거나, 사진을 묘사해 주거나, 심지어 그를 특정 장소로 안내해 줄 수도 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 자원봉사자들이 하는 일을 나열하며, 일상적인 정보 확인부터 이동 지원까지 시각 정보가 필요한 모든 영역에서 실질적인 도움을 제공하고 있음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">read... describe... guide (병렬구조): 조동사 &#39;can&#39;에 이어지는 동사원형들이 나열되어 동작을 설명합니다.</div><div class=\"lec-gr-item\">guide him to a specific place 5형식 구조: &#39;guide(V) + him(O) + to a specific place(부사구/방향)&#39;로 구성된 구문입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">describe</td><td class=\"m\">묘사하다, 서술하다</td></tr><tr><td class=\"w\">specific</td><td class=\"m\">특정한, 구체적인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이제, “Be My Eyes”는</span><span class=\"en\"><b>Now, “Be My Eyes”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">업그레이드되고 있다.</span><span class=\"en\"><b><span class=\"grammar-hl\">is getting</span> an upgrade.</b></span></div></div><div class=\"lec-sent-ko\">이제 ‘Be My Eyes’는 업그레이드되고 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 기술이 발전함에 따라 기존 서비스가 새로운 단계로 나아가고 있음을 알리는 전환점입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is getting (현재진행): be동사(is) + -ing(getting)를 사용하여 상태의 변화가 진행 중임을 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 새로운 기능을 추가하고 있다,</span><span class=\"en\"><b>It’s adding a new function,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인공 지능(AI)이라는.</span><span class=\"en\"><b>artificial intelligence (AI).</b></span></div></div><div class=\"lec-sent-ko\">그것은 새로운 기능인 인공 지능(AI)을 추가하고 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 무엇이 업그레이드되는지 핵심 내용을 밝히며, 인간 중심의 서비스에 기술적 도구가 결합하는 변화를 예고합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is adding (현재진행): be동사(is) + -ing(adding)를 사용하여 기능이 추가되고 있는 상황을 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">artificial intelligence</td><td class=\"m\">인공지능</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 11 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">AI는</span><span class=\"en\"><b>AI</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떤 일들을 할 수 있다</span><span class=\"en\"><b>can do some things</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인간보다 더 잘,</span><span class=\"en\"><b>better than humans,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 자원봉사자들은</span><span class=\"en\"><b><span class=\"grammar-hl\">but the volunteers</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여전히 중요하다.</span><span class=\"en\"><b><span class=\"grammar-hl\">are still important</span>.</b></span></div></div><div class=\"lec-sent-ko\">인공 지능은 인간보다 어떤 일들은 더 잘할 수 있지만, 자원봉사자들은 여전히 중요하다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 새로운 기술과 기존의 인간 중심 자원봉사 시스템이 상호 보완적인 관계임을 설명합니다. 기계의 효율성과 사람의 세심함이 함께할 때 가장 효과적이라는 점을 시사합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">but the volunteers are still important (등위접속사): &#39;but&#39;을 사용하여 앞의 AI 능력과 대조되는 내용을 연결합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">volunteer</td><td class=\"m\">자원봉사자, 지원자</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 12 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 업그레이드가</span><span class=\"en\"><b>This upgrade</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">부디 시각장애인들을 돕기를 바란다</span><span class=\"en\"><b>will hopefully <span class=\"grammar-hl\">help blind people</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">훨씬 더 놀라운 일들을 하도록</span><span class=\"en\"><b><span class=\"grammar-hl\">do</span> even more amazing things</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그들의 삶을 향상시키도록!</span><span class=\"en\"><b>and improve their lives!</b></span></div></div><div class=\"lec-sent-ko\">이 업그레이드가 시각장애인들이 훨씬 더 놀라운 일들을 해내고 그들의 삶을 향상시키는 데 도움을 주기를 바란다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 글의 결론으로서, 기술과 인간의 협업이 가져올 긍정적인 미래에 대한 희망적인 전망을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">help blind people do 5형식 구조: &#39;help(V) + blind people(O) + do(OC, 원형부정사)&#39; 구조입니다. 준사역동사 help는 목적보어로 동사원형이나 to부정사를 취합니다.</div><div class=\"lec-gr-item\">to부정사 (to부정사): &#39;do&#39;와 &#39;improve&#39;는 help의 목적보어로 쓰인 원형부정사들로, 명사적 역할로 &#39;더 많은 일을 하고 삶을 개선하는 것&#39;을 돕는다는 의미를 가집니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">blind</td><td class=\"m\">시각 장애가 있는, 눈먼</td></tr><tr><td class=\"w\">hopefully</td><td class=\"m\">바라건대, 희망을 품고</td></tr><tr><td class=\"w\">improve</td><td class=\"m\">개선하다, 향상시키다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>브라이언은 시력을 잃어 일상생활에 큰 제약을 겪고 있다.</li><li>&#39;Be My Eyes&#39; 앱은 전 세계 자원봉사자들을 연결해 시각장애인의 눈이 되어준다.</li><li>최근 이 앱에 인공지능(AI) 기능이 더해지며 새로운 진화를 시도하고 있다.</li><li>인간의 세심한 도움과 기술의 효율성이 결합되어 장애인의 삶의 질을 높일 것으로 기대된다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The &quot;Be My Eyes&quot; app connects visually impaired individuals with global volunteers for daily assistance, and it is now evolving by integrating artificial intelligence to further expand these capabilities.</div>\n              <div class=\"lec-final-sum-ko\">&quot;Be My Eyes&quot; 앱은 시각 장애인들을 전 세계 자원봉사자들과 연결하여 일상적인 도움을 제공하며, 현재는 이러한 기능을 더욱 확장하기 위해 인공지능을 통합하고 있다.</div></div></div>"],"segs":[[{"audio":"./passage10_audio/1.mp3","hl":null}],[{"audio":"./passage10_audio/2.mp3","hl":null}],[{"audio":"./passa
