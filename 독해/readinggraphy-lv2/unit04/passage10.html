</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}

lecturePlayer(document.getElementById("app"),{"brand":"청명학원 영어과","title":"리딩그라피2 리딩그라피레벨2 10번","audioDir":"audio","preview":false,"count":49,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.400em\">리딩그라피레벨2\u003cbr>10번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩그라피2\u003c/div>\u003ch1>Be My Eyes: A Visionary App Connecting Sighted Volunteers and AI to the Blind\u003c/h1>\u003ch2>비 마이 아이즈: 시각장애인과 자원봉사자, 인공지능을 잇는 혁신적인 앱\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>시각장애인 Brian의 사례를 통해, \u003cb class=\"key\">자원봉사자\u003c/b>와 \u003cb class=\"key\">인공 \u003c/b>\u003cb class=\"key\">지능(AI)\u003c/b>이 협업하여 시각장애인의 일상적 어려움을 해결해 주는 ‘Be My Eyes’ 앱의 역할과 발전을 설명하고 있다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The 'Be My Eyes' app enhances the lives of blind people by combining human volunteer support with advanced artificial intelligence.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 시각장애인의 눈이 되어주는 아주 따뜻하고 똑똑한 기술에 대해 함께 읽어볼 거예요. 이번 지문은 Brian이라는 실존 인물의 이야기로 시작해서, Be My Eyes라는 혁신적인 앱이 어떻게 세상을 바꾸고 있는지 다룹니다. 자원봉사자와 인공 지능이 힘을 합쳐 시각장애인의 삶을 개선한다는 내용이 핵심 요지입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">이 글은 시각장애인을 돕는 \u003cb class=\"key\">보조 \u003c/b>\u003cb class=\"key\">공학(Assistive \u003c/b>\u003cb class=\"key\">Technology)\u003c/b>의 실제 사례를 다룹니다. 과거에는 시각장애인들이 안내견이나 지팡이에 의존했다면, 이제는 스마트폰의 카메라를 이용해 타인의 눈을 빌리는 \u003cb class=\"key\">집단 \u003c/b>\u003cb class=\"key\">지성(Collective \u003c/b>\u003cb class=\"key\">Intelligence)\u003c/b> 서비스가 등장했습니다. 마치 우리가 모르는 길을 찾을 때 영상 통화로 친구에게 길을 물어보듯, \u003cb class=\"key\">실시간 \u003c/b>\u003cb class=\"key\">영상 \u003c/b>\u003cb class=\"key\">연결\u003c/b>을 통해 일상의 시각 정보를 공유하는 방식입니다. 최근에는 인공 지능의 발전으로 사물 인식 기술이 더해지며 인간과 기술이 \u003cb class=\"key\">상호 \u003c/b>\u003cb class=\"key\">보완(Complementarity)\u003c/b>하는 단계에 이르렀습니다.\u003c/div>","segs":[{"n":2,"text":"강의에 들어가기 전에 배경지식을 좀 쌓아볼까요? 우리 주변에는 신체적 제약을 극복하게 돕는 보조 공학이라는 분야가 있어요. 예전에는 점자책이나 안내견이 큰 역할을 했지만, 요즘은 스마트폰 기술이 그 자리를 채우고 있죠. 오늘 배울 앱은 집단 지성을 활용해서 전 세계 어디서든 누군가의 눈을 빌려 쓸 수 있게 해줍니다. 마치 모르는 길을 갈 때 영상 통화로 길을 물어보는 것과 비슷한 일상적인 원리를 이용하는 거예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>Brian의 상황\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>주인공 Brian이 열세 살 때 \u003cb class=\"key\">시력\u003c/b>의 대부분을 잃고 현재는 빛의 유무만 구별할 수 있는 \u003cb class=\"key\">시각장애\u003c/b> 상태임을 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>해결책 등장\u003csmall>전환 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>Brian의 일상을 돕는 \u003cb class=\"key\">Be \u003c/b>\u003cb class=\"key\">My \u003c/b>\u003cb class=\"key\">Eyes\u003c/b>라는 앱을 소개하며, 이것이 영상 통화로 \u003cb class=\"key\">시각 \u003c/b>\u003cb class=\"key\">정보\u003c/b>를 공유함을 알려줍니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>인적 자원의 힘\u003csmall>근거 · 문장 6–8\u003c/small>\u003c/h4>\u003cp>전 세계 6백만 명 이상의 \u003cb class=\"key\">자원봉사자\u003c/b>들이 제품 라벨 읽기나 길 안내 등 구체적으로 어떤 \u003cb class=\"key\">도움\u003c/b>을 주는지 나열합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>기술적 발전\u003csmall>주장 · 문장 9–11\u003c/small>\u003c/h4>\u003cp>앱에 \u003cb class=\"key\">인공 \u003c/b>\u003cb class=\"key\">지능(AI)\u003c/b> 기능이 추가되었다는 소식을 전하며, 인간과 AI의 \u003cb class=\"key\">역할 \u003c/b>\u003cb class=\"key\">분담\u003c/b>과 중요성을 강조합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>기대와 전망\u003csmall>결론 · 문장 12\u003c/small>\u003c/h4>\u003cp>이러한 기술적 업데이트가 시각장애인들의 \u003cb class=\"key\">삶의 \u003c/b>\u003cb class=\"key\">질\u003c/b>을 높이고 더 놀라운 일을 가능하게 할 것이라는 \u003cb class=\"key\">희망적 \u003c/b>\u003cb class=\"key\">메시지\u003c/b>를 전합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 한 인물의 사연에서 시작해 기술적인 해결책과 미래의 전망까지 아주 논리적인 흐름으로 전개됩니다.","hl":null},{"n":4,"text":"첫 번째 문장부터 세 번째 문장까지는 Brian의 현재 상황을 설명해요. 열세 살 때 시력을 잃고 지금은 밖이 밝은지 어두운지만 알 수 있는 힘든 상황이죠.","hl":"f0"},{"n":5,"text":"네 번째 문장과 다섯 번째 문장에서는 반전의 신호어 However가 나오면서 Be My Eyes라는 앱이 등장합니다. 영상 통화를 통해 볼 수 있는 사람들과 연결해 주는 이 앱이 Brian을 돕기 시작해요.","hl":"f1"},{"n":6,"text":"여섯 번째 문장부터 여덟 번째 문장은 앱의 규모와 구체적인 역할을 보여줍니다. 무려 육백만 명의 자원봉사자들이 제품 라벨을 읽어주거나 길을 안내하는 등 Brian이 못 보는 것들을 설명해 주죠.","hl":"f2"},{"n":7,"text":"아홉 번째 문장부터 열한 번째 문장은 최신 소식인 업그레이드 이야기를 다뤄요. 인공 지능이라는 새로운 기능이 추가되었는데, 인공 지능이 잘하는 일도 있지만 여전히 인간 자원봉사자의 역할이 중요하다는 점을 짚어줍니다.","hl":"f3"},{"n":8,"text":"마지막 열두 번째 문장에서는 이 모든 변화가 시각장애인들의 삶을 향상시키고 더 놀라운 일을 가능하게 할 거라는 희망적인 결론으로 마무리됩니다.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 4번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">초반부에서 시각장애라는 \u003cb class=\"key\">현실적인 \u003c/b>\u003cb class=\"key\">문제\u003c/b>를 제시한 뒤, 중반부에서 이를 해결하는 \u003cb class=\"key\">기술적 \u003c/b>\u003cb class=\"key\">수단\u003c/b>인 앱을 핵심적으로 소개합니다. 이후 인간의 노력과 \u003cb class=\"key\">기술의 \u003c/b>\u003cb class=\"key\">진보\u003c/b>가 어떻게 결합하는지 구체적인 양상을 보여줍니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>However (4)\u003c/b>\u003cspan>장애라는 한계에서 기술적 해결로 내용 전환\u003c/span>\u003cb>Now (9)\u003c/b>\u003cspan>현재 일어나고 있는 기술적 변화 강조\u003c/span>\u003cb>but (11)\u003c/b>\u003cspan>AI의 우수성과 자원봉사자의 가치 사이의 균형\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Brian Fischler\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">blind\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">He\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">him\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">blind people\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>자원봉사자 (Volunteers)\u003c/th>\u003cth>인공 지능 (AI)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>사람이 직접 영상을 보고 설명함\u003c/td>\u003ctd>어떤 분야에서는 사람보다 더 뛰어난 성능을 보임\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글은 문제와 해결의 구조를 가지고 있어요. 시각장애라는 현실적인 문제를 앱과 인공 지능이라는 기술적 수단으로 해결하는 과정을 보여주죠. 중심 문장이 중반부에 위치한 중괄식 구조로 볼 수 있습니다.","hl":"ty"},{"n":10,"text":"글의 흐름을 바꾸는 신호어에 주목해 보세요. 네 번째 문장의 However는 절망적인 상황을 희망으로 바꿔주고, 아홉 번째 문장의 Now는 현재 진행 중인 최신 기술 업데이트를 강조합니다. 또한 열한 번째 문장의 but은 인공 지능과 인간 사이의 상호 보완적인 관계를 잘 보여주죠.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>blind\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>시각장애가 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>sight\u003c/b>\u003cem>명사\u003c/em>\u003cspan>시력\u003c/span>\u003c/div>\u003cdiv>\u003cb>tell\u003c/b>\u003cem>동사\u003c/em>\u003cspan>구별하다, 알다\u003c/span>\u003c/div>\u003cdiv>\u003cb>light\u003c/b>\u003cem>명사\u003c/em>\u003cspan>빛\u003c/span>\u003c/div>\u003cdiv>\u003cb>dark\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>어두운\u003c/span>\u003c/div>\u003cdiv>\u003cb>connect\u003c/b>\u003cem>동사\u003c/em>\u003cspan>연결하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>through\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~을 통하여\u003c/span>\u003c/div>\u003cdiv>\u003cb>video call\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>영상 통화\u003c/span>\u003c/div>\u003cdiv>\u003cb>volunteer\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자원봉사자\u003c/span>\u003c/div>\u003cdiv>\u003cb>all over the world\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>전 세계에\u003c/span>\u003c/div>\u003cdiv>\u003cb>describe\u003c/b>\u003cem>동사\u003c/em>\u003cspan>묘사하다, 설명하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>product\u003c/b>\u003cem>명사\u003c/em>\u003cspan>제품\u003c/span>\u003c/div>\u003cdiv>\u003cb>label\u003c/b>\u003cem>명사\u003c/em>\u003cspan>라벨, 상표\u003c/span>\u003c/div>\u003cdiv>\u003cb>mail\u003c/b>\u003cem>명사\u003c/em>\u003cspan>우편물\u003c/span>\u003c/div>\u003cdiv>\u003cb>guide\u003c/b>\u003cem>동사\u003c/em>\u003cspan>안내하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>specific\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>특정한\u003c/span>\u003c/div>\u003cdiv>\u003cb>upgrade\u003c/b>\u003cem>명사\u003c/em>\u003cspan>개선, 업그레이드\u003c/span>\u003c/div>\u003cdiv>\u003cb>function\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기능\u003c/span>\u003c/div>\u003cdiv>\u003cb>artificial intelligence\u003c/b>\u003cem>명사\u003c/em>\u003cspan>인공 지능\u003c/span>\u003c/div>\u003cdiv>\u003cb>important\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>중요한\u003c/span>\u003c/div>\u003cdiv>\u003cb>hopefully\u003c/b>\u003cem>부사\u003c/em>\u003cspan>바라건대\u003c/span>\u003c/div>\u003cdiv>\u003cb>amazing\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>놀라운\u003c/span>\u003c/div>\u003cdiv>\u003cb>improve\u003c/b>\u003cem>동사\u003c/em>\u003cspan>향상시키다, 개선하다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"중요한 단어들을 살펴볼까요? tell은 말하다라는 뜻 외에도 여기서는 구별하다라는 뜻으로 쓰였어요. 그리고 artificial intelligence는 인공 지능이라는 뜻의 핵심 표현이죠. improve라는 단어는 삶의 질을 향상시키다라는 맥락에서 아주 자주 나오는 동사입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">blind\u003c/b>\u003cspan class=\"m\">시각장애가 있는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">visually impaired\u003c/span>\u003cspan class=\"s\">sightless\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">connect\u003c/b>\u003cspan class=\"m\">연결하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">link\u003c/span>\u003cspan class=\"s\">join\u003c/span>\u003cspan class=\"s\">attach\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">disconnect\u003c/span>\u003cspan class=\"a\">separate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">describe\u003c/b>\u003cspan class=\"m\">설명하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">explain\u003c/span>\u003cspan class=\"s\">portray\u003c/span>\u003cspan class=\"s\">depict\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">specific\u003c/b>\u003cspan class=\"m\">특정한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">particular\u003c/span>\u003cspan class=\"s\">certain\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">general\u003c/span>\u003cspan class=\"a\">vague\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">improve\u003c/b>\u003cspan class=\"m\">향상시키다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">enhance\u003c/span>\u003cspan class=\"s\">better\u003c/span>\u003cspan class=\"s\">advance\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">worsen\u003c/span>\u003cspan class=\"a\">damage\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어도 챙겨볼게요. blind는 시각장애가 있는이라는 뜻으로 visually impaired라고 바꿔 쓸 수 있어요. connect는 연결하다라는 뜻인데 join이나 link와 비슷하고, 반대말로는 분리하다라는 뜻의 disconnect가 있죠. improve는 향상시키다라는 뜻으로 enhance와 친구지만, 악화시키다라는 worsen과는 반대 관계랍니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Brian Fischler는\u003c/span>\u003cspan class=\"en\">10 Brian F\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is\u003c/span>chler\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시각장애인이다.\u003c/span>\u003cspan class=\"en\">is blind.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Brian Fischler는 시각장애인이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글의 도입부로 \u003cb class=\"key\">주인공\u003c/b>인 Brian을 소개하고, 그가 현재 \u003cb class=\"key\">시각장애\u003c/b>를 가지고 있다는 핵심 정보를 제공합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사 현재형\u003c/span> : 주어(단수) + is + 주격 보어 : \"~이다\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"Brian Fischler, Brian Fischler는. is blind, 시각장애인이다.. 이 문장 전체를 해석하면, Brian Fischler는 시각장애인이다.","hl":"m"},{"n":14,"text":"이 문장은 이야기의 주인공인 Brian을 소개하며 시작해요. 그가 현재 앞을 볼 수 없는 시각장애인이라는 사실을 독자에게 먼저 알려주고 있죠.","hl":"mn"},{"n":15,"text":"첫 번째 문장의 동사 is는 주어인 Brian Fischler가 한 명인 3인칭 단수이기 때문에 쓰였어요. 주인공의 현재 상태를 설명하는 역할을 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 잃었다\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">lost\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시력의 대부분을\u003c/span>\u003cspan class=\"en\">most of his sight\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그가 13살 때.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">when\u003c/span> he was 13.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 13살 때 시력의 대부분을 잃었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 주인공이 언제부터 시력을 잃었는지 \u003cb class=\"key\">과거의 \u003c/b>\u003cb class=\"key\">배경\u003c/b>을 설명하며, 시력을 잃은 \u003cb class=\"key\">정도\u003c/b>가 매우 크다는 점을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">일반동사의 과거형\u003c/span> : lose의 과거형 : \"잃었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">시간의 부사절 접속사\u003c/span> : when + 주어 + 동사 : \"~할 때\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"He lost, 그는 잃었다. most of his sight, 시력의 대부분을. when he was 13, 그가 13살 때.. 이 문장 전체를 해석하면, 그는 13살 때 시력의 대부분을 잃었다.","hl":"m"},{"n":17,"text":"Brian이 언제 시력을 잃게 되었는지 그 배경을 설명하고 있어요. 열세 살이라는 구체적인 과거 시점과 함께 시력의 대부분을 잃었다고 말하며 안타까운 상황을 보여줍니다.","hl":"mn"},{"n":18,"text":"두 번째 문장에서는 과거의 일을 말하고 있으므로 lose의 과거형인 lost를 썼어요. 그리고 접속사 when을 사용하여 열세 살이었던 그 시점을 연결해 주고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이제,\u003c/span>\u003cspan class=\"en\">Now,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 오직 알 수 있다\u003c/span>\u003cspan class=\"en\">he can only \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">tell\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">밖이 밝은지 어두운지만.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">if\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">it's\u003c/span> light or dark outside.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이제, 그는 오직 밖이 밝은지 어두운지만 알 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 과거를 지나 \u003cb class=\"key\">현재\u003c/b> 주인공의 시각 상태를 설명하며, 사물을 볼 수 없고 오직 \u003cb class=\"key\">명암\u003c/b>만 구별 가능한 어려운 상황을 묘사합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사 tell의 의미\u003c/span> : tell + 목적어(명사절) : \"알다, 구별하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명사절 접속사\u003c/span> : if + 주어 + 동사 : \"~인지 (아닌지)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">비인칭 주어 it\u003c/span> : it (주어) + is : \"(해석하지 않음)\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"Now, 이제. he can only tell, 그는 오직 알 수 있다. if it's light or dark outside, 밖이 밝은지 어두운지만.. 이 문장 전체를 해석하면, 이제, 그는 오직 밖이 밝은지 어두운지만 알 수 있다.","hl":"m"},{"n":20,"text":"이제 Brian의 현재 상태는 어떠한지 보여주는 문장이에요. 밖이 밝은지 어두운지 정도의 빛만 겨우 느낄 수 있을 만큼 시력이 제한적이라는 것을 알 수 있죠.","hl":"mn"},{"n":21,"text":"세 번째 문장에서 tell은 말하다가 아니라 구별하다라는 뜻으로 이해해야 해요. 뒤에 나오는 if는 만약에가 아니라 인지 아닌지라는 뜻으로 목적어 절을 이끕니다. 마지막으로 it은 밝고 어두운 명암을 나타낼 때 쓰는 비인칭 주어라서 따로 해석하지 않습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만, ‘Be My Eyes’라는 앱이 그를 돕고 있다 매일!\u003c/span>\u003cspan class=\"en\">However, an app, &quot;Be My Eyes,&quot; \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">helping\u003c/span> him every day!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만, ‘Be My Eyes’라는 앱이 매일 그를 돕고 있다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Brian의 힘든 상황을 반전시키는 \u003cb class=\"key\">해결책\u003c/b>으로 앱이 등장하며, 그 도움이 일시적이지 않고 \u003cb class=\"key\">지속적\u003c/b>임을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재진행형\u003c/span> : be동사 현재형(am/are/is) + [v-ing] : \"돕고 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">동격의 콤마\u003c/span> : [명사(구)] + [,] + [명사(구)] : \"‘Be My Eyes’라는 앱\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"However, 하지만. an app, 'Be My Eyes,', ‘Be My Eyes’라는 앱이. is helping him, 그를 돕고 있다. every day!, 매일!. 이 문장 전체를 해석하면, 하지만, ‘Be My Eyes’라는 앱이 매일 그를 돕고 있다!","hl":"m"},{"n":23,"text":"앞선 문장에서 Brian의 시각 장애라는 어려운 상황을 언급했죠. 하지만 이 문장에서 'Be My Eyes'라는 앱이 등장하며 Brian의 삶에 긍정적인 변화와 해결책을 주고 있음을 강조합니다.","hl":"mn"},{"n":24,"text":"첫 번째 문법 포인트는 동격의 콤마입니다. an app과 'Be My Eyes' 사이에 콤마를 찍어서 이 앱의 이름이 무엇인지 보충 설명하고 있어요. 두 번째는 is helping이라는 현재진행형 표현입니다. 앱의 도움이 지금도 계속되고 있다는 생동감을 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 앱은\u003c/span>\u003cspan class=\"en\">This app\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Brian과 연결해 준다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">connects \u003c/span>\u003cspan class=\"tgt\">Brian \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">볼 수 있는(시력이 정상인)\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">see\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">영상 통화를 통해.\u003c/span>\u003cspan class=\"en\">through video calls.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 앱은 영상 통화를 통해 Brian과 볼 수 있는(시력이 정상인) 사람들을 연결해 준다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앱이 작동하는 \u003cb class=\"key\">구체적인 \u003c/b>\u003cb class=\"key\">방식\u003c/b>을 설명하며, Brian과 시력을 가진 자원봉사자를 잇는 \u003cb class=\"key\">매개체\u003c/b> 역할을 한다는 점을 알려줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">connect A with B\u003c/span> : connect + [목적어 A] + with + [목적어 B] : \"Brian과 사람들을 연결하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : [선행사(사람)] + who + [동사] : \"볼 수 있는 사람들\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"This app, 이 앱은. connects Brian, Brian과 연결해 준다. with people, 사람들을. who can see, 볼 수 있는(시력이 정상인). through video calls, 영상 통화를 통해.. 이 문장 전체를 해석하면, 이 앱은 영상 통화를 통해 Brian과 볼 수 있는(시력이 정상인) 사람들을 연결해 준다.","hl":"m"},{"n":26,"text":"이 앱이 구체적으로 어떤 기술을 쓰는지 ss=\"lp-sno\">문장 12 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 업그레이드가\u003c/span>\u003cspan class=\"en\">This upgrade\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바라건대 도움을 주기를\u003c/span>\u003cspan class=\"en\">will hopefully \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">help \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시각장애인들이 해내도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">blind \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">do\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">훨씬 더 놀라운 일들을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">even \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">amazing\u003c/span> things\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그들의 삶을 향상시키는 데!\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">improve\u003c/span> their lives!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 업그레이드가 시각장애인들이 훨씬 더 놀라운 일들을 해내고 그들의 삶을 향상시키는 데 도움을 주기를 바란다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 기술적 진보가 시각장애인들의 \u003cb class=\"key\">삶의 \u003c/b>\u003cb class=\"key\">질\u003c/b>을 높이고 그들이 \u003cb class=\"key\">자립적\u003c/b>으로 더 많은 성취를 하길 바라는 긍정적인 전망입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">준사역동사 help의 목적격 보어\u003c/span> : help + 목적어 + 동사원형(do) : \"시각장애인들이 해내도록 돕다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">비교급 강조\u003c/span> : even + 비교급(more amazing) : \"훨씬 더 놀라운\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">병렬 구조\u003c/span> : do (A) and improve (B) : \"향상시키는 데\"\u003c/div>\u003c/div>","segs":[{"n":46,"text":"This upgrade, 이 업그레이드가. will hopefully help, 바라건대 도움을 주기를. blind people do, 시각장애인들이 해내도록. even more amazing things, 훨씬 더 놀라운 일들을. and improve their lives!, 그리고 그들의 삶을 향상시키는 데!. 이 문장 전체를 해석하면, 이 업그레이드가 시각장애인들이 훨씬 더 놀라운 일들을 해내고 그들의 삶을 향상시키는 데 도움을 주기를 바란다!","hl":"m"},{"n":47,"text":"마지막 문장답게 이 기술의 변화가 시각장애인분들에게 가져다줄 더 밝고 희망찬 미래를 기대하며 글을 마무리하고 있습니다.","hl":"mn"},{"n":48,"text":"중요한 포인트가 세 개나 있어요. 첫 번째로 help 뒤에 나온 do는 목적격 보어로 쓰인 동사원형이고, 이 자리에 to do를 써도 맞습니다. 두 번째로 more amazing이라는 비교급 앞에 even이 붙어서 훨씬 더라는 강조의 의미를 더해줬죠. 마지막 세 번째로 improve는 and 뒤에서 앞의 do와 함께 나란히 연결된 병렬 구조로 쓰였습니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>\u003cb class=\"key\">Brian \u003c/b>\u003cb class=\"key\">Fischler\u003c/b>는 어린 시절 시력을 잃어 현재 빛의 유무만 구별 가능한 시각장애인입니다.\u003c/li>\u003cli>\u003cb class=\"key\">Be \u003c/b>\u003cb class=\"key\">My \u003c/b>\u003cb class=\"key\">Eyes\u003c/b> 앱은 Brian과 전 세계 6백만 명 이상의 자원봉사자를 영상 통화로 연결해 줍니다.\u003c/li>\u003cli>이 앱에 새로운 \u003cb class=\"key\">인공 \u003c/b>\u003cb class=\"key\">지능(AI)\u003c/b> 기능이 추가되어 인간보다 더 나은 처리가 가능해졌습니다.\u003c/li>\u003cli>인간과 기술의 협력은 시각장애인의 \u003cb class=\"key\">삶의 \u003c/b>\u003cb class=\"key\">질을 \u003c/b>\u003cb class=\"key\">개선\u003c/b>하고 더 놀라운 일을 하게 돕습니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The 'Be My Eyes' app enhances the lives of blind people by combining human volunteer support with advanced artificial intelligence.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">시각장애인 Brian의 사례를 통해, \u003cb class=\"key\">자원봉사자\u003c/b>와 \u003cb class=\"key\">인공 \u003c/b>\u003cb class=\"key\">지능(AI)\u003c/b>이 협업하여 시각장애인의 일상적 어려움을 해결해 주는 ‘Be My Eyes’ 앱의 역할과 발전을 설명하고 있다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":49,"text":"오늘 배운 내용을 통해 기술이 어떻게 사람들의 삶을 더 나은 방향으로 바꾸는지 느낄 수 있었나요? 지문에 나온 구체적인 자원봉사자들의 활동 내용과 새롭게 추가된 인공 지능의 역할을 다시 한번 복습해 보세요. 여러분도 이 글의 Brian처럼 어려움을 극복하는 따뜻한 기술에 계속 관심을 가져보길 바랍니다. 수고 많았어요!","hl":null}]}]});</script></body></html>
