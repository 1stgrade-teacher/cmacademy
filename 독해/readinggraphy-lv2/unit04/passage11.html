i><li>2005년 제인이 독성 정원(Poison Garden)을 추가함</li><li>100종 이상의 독성 식물(poisonous plants)들이 자라고 있음</li><li>안전을 위해 일부 식물은 우리(cages)에 가두어 전시함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03관람객 주의사항과 운영 목적</div><ul><li>위험함에도 불구하고 많은 관람객이 방문하는 정원의 운영 이유를 설명한다.</li><li>식물을 만지거나 냄새 맡지 말라는 경고문(signs) 비치</li><li>연간 60만 명 이상의 방문객 유치</li><li>식물의 긍정적 및 부정적 효과(good and bad effect)를 교육하려는 목적</li><li>핵심 키워드: 독성 식물(poisonous plants), 교육(educate)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">famous</td><td class=\"m\">유명한, 잘 알려진</td></tr><tr><td class=\"w\">pass down</td><td class=\"m\">~을 물려주다, ~을 전해주다</td></tr><tr><td class=\"w\">over time</td><td class=\"m\">시간이 흐르면서, 점차</td></tr><tr><td class=\"w\">recreate</td><td class=\"m\">재현하다, 다시 만들다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">poisonous</td><td class=\"m\">유독한, 독이 있는</td></tr><tr><td class=\"w\">in spite of</td><td class=\"m\">~에도 불구하고</td></tr><tr><td class=\"w\">attract</td><td class=\"m\">끌어들이다, 유인하다</td></tr><tr><td class=\"w\">effect</td><td class=\"m\">영향, 결과</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">영국의 Alnwick Garden은</span><span class=\"en\"><b><span class=\"grammar-hl\">The Alnwick Garden in England</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">유명하다</span><span class=\"en\"><b><span class=\"grammar-hl\">is famous</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">전 세계적으로</span><span class=\"en\"><b>worldwide.</b></span></div></div><div class=\"lec-sent-ko\">영국의 Alnwick Garden은 전 세계적으로 유명해요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 도입부로서, 독자에게 알른윅 정원이라는 대상이 가진 일반적인 명성을 먼저 제시하며 글을 시작합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">The Alnwick Garden in England is famous (기본구조): 주어(The Alnwick Garden in England) + be동사(is) + 주격보어(famous)인 2형식 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">famous</td><td class=\"m\">유명한, 잘 알려진</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러나,</span><span class=\"en\"><b>However,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">멈추지 마라</span><span class=\"en\"><b>don’t <span class=\"grammar-hl\">stop</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">꽃들의 냄새를 맡으려고</span><span class=\"en\"><b><span class=\"grammar-hl\">to smell</span> the flowers</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그곳의 Poison Garden에 있는</span><span class=\"en\"><b>in its Poison Garden</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">— 그것들은 실제로 독이 될 수 있다</span><span class=\"en\"><b>— they can actually poison</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신에게</span><span class=\"en\"><b>you!</b></span></div></div><div class=\"lec-sent-ko\">그러나, 그곳의 Poison Garden에 있는 꽃들의 냄새를 맡기 위해 멈추지는 마세요 – 그것들은 실제로 여러분에게 독이 될 수 있어요!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 평화로운 이미지와 대비되는 &#39;독 정원&#39;의 위험성을 경고하며, 독자의 호기심을 유발하고 글의 핵심 소재인 독 정원을 소개합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">stop to smell (to부정사): stop은 목적어로 동명사(-ing)를 취하면 &#39;~하는 것을 멈추다&#39;이지만, to부정사를 목적어로 취하면 &#39;~하기 위해 하던 일을 멈추다&#39;라는 의미의 부사적 용법(목적)으로 쓰입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Northumberland의 제1대 공작은</span><span class=\"en\"><b>The 1st Duke of Northumberland</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">만들었다</span><span class=\"en\"><b><span class=\"grammar-hl\">created</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Alnwick Garden을</span><span class=\"en\"><b>the Alnwick Garden</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">1750년에</span><span class=\"en\"><b>in 1750.</b></span></div></div><div class=\"lec-sent-ko\">Northumberland의 제1대 공작은 1750년에 Alnwick Garden을 만들었어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 정원의 기원을 설명하는 문장으로, 3세기에 걸친 정원의 역사를 훑어내려가는 시간적 서술의 시작점입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">created (과거시제): 과거의 특정 시점(in 1750)에 일어난 일을 서술하기 위해 동사 create의 과거형이 사용되었습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은</span><span class=\"en\"><b>It</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">전해져 내려왔다</span><span class=\"en\"><b><span class=\"grammar-hl\">was passed down</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 가문에</span><span class=\"en\"><b>in the family</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수년 동안</span><span class=\"en\"><b>for years.</b></span></div></div><div class=\"lec-sent-ko\">그것은 오랫동안 그 가문에 전해져 내려왔어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 문장에서 정원이 처음 만들어진 이후, 가문의 자산으로서 오랫동안 유지되었음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was passed down (수동태): be동사(was)+p.p.(passed) 구조입니다. pass A down은 &#39;A를 물려주다(타동사)&#39;라는 기본구조를 가지는데, 목적어가 주어로 나가면서 수동태가 되었습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러나</span><span class=\"en\"><b>But</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">시간이 지남에 따라,</span><span class=\"en\"><b>over time,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 정원은</span><span class=\"en\"><b>the garden</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">잊혀졌다</span><span class=\"en\"><b><span class=\"grammar-hl\">was forgotten</span>.</b></span></div></div><div class=\"lec-sent-ko\">그러나 시간이 지남에 따라, 그 정원은 잊혀졌어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 가문의 관리를 받던 정원이 쇠락의 길을 걷게 된 전환점을 제시하며, 이후에 있을 재건의 필요성을 암시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was forgotten (수동태): be동사(was)+p.p.(forgotten) 구조입니다. forget은 &#39;잊다(타동사)&#39;라는 기본구조를 가지는데, 목적어가 주어로 나가면서 수동태가 되었습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">over time</td><td class=\"m\">시간이 흐르면서, 점차</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">1995년에,</span><span class=\"en\"><b>In 1995,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Jane Percy는,</span><span class=\"en\"><b>Jane Percy,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">제12대 공작 부인인,</span><span class=\"en\"><b>the 12th Duke’s wife,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">결정했다</span><span class=\"en\"><b>decided</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 정원을 되살리기로</span><span class=\"en\"><b><span class=\"grammar-hl\">to recreate</span> the garden.</b></span></div></div><div class=\"lec-sent-ko\">1995년에, 제12대 공작 부인인 Jane Percy는 그 정원을 되살리기로 결정했어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 잊혔던 정원에 다시 생명력을 불어넣는 인물을 등장시켜 이야기의 새로운 국면을 전개합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to recreate (to부정사): decide의 목적어 역할을 하는 명사적 용법입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">recreate</td><td class=\"m\">재현하다, 다시 만들다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀는</span><span class=\"en\"><b>She</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">만들었다 그것을</span><span class=\"en\"><b><span class=\"grammar-hl\">made it</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 아름답게</span><span class=\"en\"><b><span class=\"grammar-hl\">more beautiful</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이전보다</span><span class=\"en\"><b>than before.</b></span></div></div><div class=\"lec-sent-ko\">그녀는 그것을 전보다 더 아름답게 만들었어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 제인 퍼시의 노력이 단순히 복구에 그치지 않고, 정원의 가치를 향상시켰음을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">made it more beautiful (5형식(SVOC)): make(동사) + it(목적어) + more beautiful(목적격보어, 형용사) 구조로, 목적어를 보어 상태로 만들었다는 의미입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그리고</span><span class=\"en\"><b>Then</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">2005년에,</span><span class=\"en\"><b>in 2005,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Jane은</span><span class=\"en\"><b>Jane</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">추가했다</span><span class=\"en\"><b>added</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">특별한 정원을</span><span class=\"en\"><b>a special garden</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">&quot;the Poison Garden&quot;이라 불리는</span><span class=\"en\"><b><span class=\"grammar-hl\">called “the Poison Garden.”</span></b></span></div></div><div class=\"lec-sent-ko\">그리고 2005년에, Jane은 ‘Poison Garden’이라고 불리는 특별한 정원을 추가로 만들었어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 정원 재건 이후, 정원의 구색을 갖추기 위해 독특한 구역을 새롭게 설치했음을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">called “the Poison Garden.” (과거분사): 과거분사구 &#39;called ~&#39;가 앞의 명사 &#39;a special garden&#39;을 수식하는 구조입니다. &#39;a special garden that is called...&#39;의 의미를 담고 있습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은</span><span class=\"en\"><b>It</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">채워져 있다</span><span class=\"en\"><b>is filled</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">100여 종 이상의 다양한 독성 식물들로</span><span class=\"en\"><b>with over 100 different poisonous plants.</b></span></div></div><div class=\"lec-sent-ko\">그 정원은 100여 종 이상의 다양한 독성 식물로 가득 차 있어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독 정원의 구성 요소를 구체적으로 나열하며, 왜 이곳이 위험한 공간인지 뒷받침합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It’s filled with (수동태): be동사(is)+p.p.(filled) 구조입니다. fill A with B(A를 B로 채우다)가 기본구조이며, 목적어가 주어로 나가면서 수동태가 되었습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">poisonous</td><td class=\"m\">유독한, 독이 있는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 식물들 중 일부는</span><span class=\"en\"><b>Some of the plants</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">심지어 보관된다</span><span class=\"en\"><b><span class=\"grammar-hl\">are even kept</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리 안에</span><span class=\"en\"><b>in cages</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">안전을 위해</span><span class=\"en\"><b>for safety.</b></span></div></div><div class=\"lec-sent-ko\">그 식물들 중 일부는 안전을 위해 심지어 우리에 보관되어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독성이 매우 강한 식물들이 존재한다는 사실을 생생하게 전달하여, 정원의 위험 수위를 시각적으로 묘사합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are even kept (수동태): be동사(are)+p.p.(kept) 구조입니다. keep A(A를 보관하다/두다)가 기본구조이며, 목적어가 주어로 나가면서 수동태가 되었습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 11 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Poison Garden의 표지판은</span><span class=\"en\"><b>Signs in the Poison Garden</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">경고한다 방문객들에게</span><span class=\"en\"><b><span class=\"grammar-hl\">warn visitors</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">만지거나 냄새 맡지 말라고</span><span class=\"en\"><b><span class=\"grammar-hl\">not to touch</span> or smell</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아무것도</span><span class=\"en\"><b>anything.</b></span></div></div><div class=\"lec-sent-ko\">Poison Garden의 표지판은 방문객들에게 아무것도 만지거나 냄새를 맡지 말라고 경고해요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 정원의 위험성을 구체적인 안전 수칙으로 연결하여, 방문객이 주의해야 할 행동 지침을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">warn visitors not to touch (5형식(SVOC)): warn(동사) + visitors(목적어) + not to touch(목적격보어, to부정사의 부정형) 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 12 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만</span><span class=\"en\"><b>But</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 위험들에도 불구하고,</span><span class=\"en\"><b><span class=\"grammar-hl\">despite the dangers</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Alnwick Garden은</span><span class=\"en\"><b>the Alnwick Garden</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">끌어들인다</span><span class=\"en\"><b>attracts</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">600,000명이 넘는 방문객들을</span><span class=\"en\"><b>over 600,000 visitors</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매년</span><span class=\"en\"><b>every year.</b></span></div></div><div class=\"lec-sent-ko\">하지만, 그런 위험에도 불구하고, Alnwick Garden은 매년 600,000명이 넘는 방문객들을 끌어들여요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 위험하다는 사실과 많은 사람이 찾는다는 현상을 대비시켜, 정원이 가진 독특한 매력이 사람들을 불러 모으고 있음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">despite the dangers (관용표현): &#39;…에도 불구하고&#39;라는 의미의 전치사구입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">attract</td><td class=\"m\">끌어들이다, 유인하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 13 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Jane은</span><span class=\"en\"><b>Jane</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">바란다</span><span class=\"en\"><b><span class=\"grammar-hl\">hopes</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 정원이</span><span class=\"en\"><b><span class=\"grammar-hl\">the garden</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들에게 가르쳐 주기를</span><span class=\"en\"><b><span class=\"grammar-hl\">will teach</span> people</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">식물의 좋은 영향과 나쁜 영향에 대해</span><span class=\"en\"><b>about the good and bad effect of plants.</b></span></div></div><div class=\"lec-sent-ko\">Jane은 그 정원이 사람들에게 식물의 좋은 영향과 나쁜 영향에 대해 가르쳐 주기를 바라요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 정원을 단순히 관람하는 공간이 아닌, 교육적인 목적으로 조성했음을 밝히며 글을 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">hopes the garden will teach (명사절(that절)): hope의 목적어로 쓰인 절이며, 접속사 that이 생략된 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">effect</td><td class=\"m\">영향, 결과</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>영국의 알른윅 정원은 역사 깊은 명소이나, 위험한 식물들로 가득한 &#39;독 정원&#39;을 포함하고 있다.</li><li>오랜 기간 잊혔던 정원은 제인 퍼시에 의해 1995년 재건되어 더 아름다운 공간이 되었다.</li><li>2005년 추가된 독 정원에는 100여 종의 독성 식물이 있으며 엄격한 안전 수칙이 적용된다.</li><li>위험성에도 불구하고 매년 60만 명의 방문객이 찾으며, 식물의 양면성을 배우는 교육적 역할을 하고 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The Alnwick Garden was restored by Jane Percy, and she established a specialized poisonous plant section to inform the public about the dual nature of nature.</div>\n              <div class=\"lec-final-sum-ko\">알른윅 정원은 제인 퍼시에 의해 복원되었으며, 그녀는 자연의 이중성을 대중에게 알리기 위해 특화된 독성 식물 구역을 조성했다.</div></div></div>"],"segs":[[{"audio":"./passage11_audio/1.mp3","hl":null}],[{"audio":"./passage11_audio/2.mp3","hl":null}],[{"audio":"./passage11_audio/3.mp3","hl":null},{"audio":"./passage11_audio/4.mp3","hl":"stage-0"},{"audio":"./passage11_audio/5.mp3","hl":"stage-1"},{"audio":"./passage11_audio/6.mp3","hl":"stage-2"}],[{"audio":"./passage11_audio/7.mp3","hl":null}],[{"audio":"./passage11_audio/8.mp3","hl":"main"},{"audio":"./passage11_audio/9.mp3","hl":"meaning"},{"audio":"./passage11_audio/10.mp3","hl":"grammar"}],[{"audio":"./passage11_audio/11.mp3","hl":"main"},{"audio":"./passage11_audio/12.mp3","hl":"meaning"},{"audio":"./passage11_audio/13.mp3","hl":"grammar"}],[{"audio":"./passage11_audio/14.mp3","hl":"main"},{"audio":"./passage11_audio/15.mp3","hl":"meaning"},{"audio":"./passage11_audio/16.mp3","hl":"grammar"}],[{"audio":"./passage11_audio/17.mp3","hl":"main"},{"audio":"./passage11_audio/18.mp3","hl":"meaning"},{"audio":"./passage11_audio/19.mp3","hl":"grammar"}],[{"audio":"./passage11_audio/20.mp3","hl":"main"},{"audio":"./passage11_audio/21.mp3","hl":"meaning"},{"audio":"./passage11_audio/22.mp3","hl":"grammar"}],[{"audio":"./passage11_audio/23.mp3","hl":"main"},{"audio":"./passage11_audio/24.mp3","hl":"meaning"},{"audio":"./passage11_audio/25.mp3","hl":"grammar"}],[{"audio":"./passage11_audio/26.mp3","hl":"main"},{"audio":"./passage11_audio/27.mp3","hl":"meaning"},{"audio":"./passage11_audio/28.mp3","hl":"grammar"}],[{"audio":"./passage11_audio/29.mp3","hl":"main"},{"audio":"./passage11_audio/30.mp3","hl":"meaning"},{"audio":"./passage11_audio/31.mp3","hl":"grammar"}],[{"audio":"./passage11_audio/32.mp3","hl":"main"},{"audio":"./passage11_audio/33.mp3","hl":"meaning"},{"audio":"./passage11_audio/34.mp3","hl":"grammar"}],[{"audio":"./passage11_audio/35.mp3","hl":"main"},{"audio":"./p
