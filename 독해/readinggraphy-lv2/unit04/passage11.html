</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}

    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}

  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}

lecturePlayer(document.getElementById("app"),{"brand":"청명학원 영어과","title":"리딩그라피2 리딩그라피레벨2 11번","audioDir":"audio","preview":false,"count":52,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.400em\">리딩그라피레벨2\u003cbr>11번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩그라피2\u003c/div>\u003ch1>Beauty with a Bite: The Secrets of Alnwick Garden\u003c/h1>\u003ch2>치명적인 아름다움: Alnwick Garden의 비밀\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>영국 노섬벌랜드의 \u003cb class=\"key\">Alnwick \u003c/b>\u003cb class=\"key\">Garden\u003c/b>은 아름다운 역사적 정원이지만, 100종 이상의 치명적인 \u003cb class=\"key\">독성 \u003c/b>\u003cb class=\"key\">식물\u003c/b>을 전시하여 방문객들에게 식물의 위험성을 교육하는 'Poison Garden'으로 더욱 유명합니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The Alnwick Garden provides a unique educational experience by combining its historical beauty with a cautionary display of dangerous plants.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분! 오늘은 영국의 아주 특별하고도 신비로운 명소인 Alnwick Garden에 대해 알아볼 거예요. 이 정원이 왜 전 세계적으로 유명해졌는지, 그리고 그 속에 어떤 오싹한 비밀이 숨어 있는지 궁금하지 않나요? 오늘의 요지는 아름다운 이 정원이 사실 식물의 위험성에 대해 아주 중요한 교훈을 준다는 내용이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">Alnwick Garden은 영국 노섬벌랜드주에 위치한 유서 깊은 곳입니다. 유럽에는 중세 시대부터 약초나 독초를 연구하던 \u003cb class=\"key\">Physic \u003c/b>\u003cb class=\"key\">Garden\u003c/b>의 전통이 있었습니다. 하지만 Alnwick Garden의 \u003cb class=\"key\">Poison \u003c/b>\u003cb class=\"key\">Garden\u003c/b>은 치료보다는 교육과 호기심을 목적으로 현대에 재창조되었다는 점이 특징입니다. 마치 동화 속에 나오는 \u003cb class=\"key\">금지된 \u003c/b>\u003cb class=\"key\">숲\u003c/b>처럼 아름답지만 치명적인 매력을 지니고 있죠. 이 정원은 식물의 외형적인 아름다움뿐만 아니라 그들이 가진 \u003cb class=\"key\">생화학적 \u003c/b>\u003cb class=\"key\">위험성\u003c/b>(biochemical risks)을 대중에게 경고합니다.\u003c/div>","segs":[{"n":2,"text":"영국 노섬벌랜드에 있는 Alnwick Garden은 수백 년의 역사를 간직한 곳입니다. 옛날 유럽에는 약초나 독초를 전문적으로 키우며 연구하던 Physic Garden이라는 전통이 있었죠. Alnwick Garden도 그런 전통과 맞닿아 있으면서도, 방문객들에게 조심해야 할 식물들을 직접 보여주는 독특한 곳이에요. 마치 우리가 산에 가서 예쁜 버섯을 함부로 먹으면 안 된다고 배우는 것처럼, 이 정원도 자연의 무서움을 알려주는 살아있는 교과서 같은 역할을 한답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>정원 소개와 경고\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>영국의 유명한 Alnwick Garden을 소개하며, 그 안의 \u003cb class=\"key\">Poison \u003c/b>\u003cb class=\"key\">Garden\u003c/b>에서는 함부로 행동해서는 안 된다는 \u003cb class=\"key\">주의 \u003c/b>\u003cb class=\"key\">사항\u003c/b>을 전달합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>정원의 초기 역사\u003csmall>배경 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>1750년에 처음 만들어져 가문 대대로 전해졌으나 시간이 흐르며 사람들의 기억에서 \u003cb class=\"key\">잊혀진 \u003c/b>\u003cb class=\"key\">과정\u003c/b>을 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>Jane Percy의 재건\u003csmall>전환 · 문장 6–8\u003c/small>\u003c/h4>\u003cp>1995년 Jane Percy에 의해 정원이 \u003cb class=\"key\">재창조\u003c/b>되었으며, 2005년에는 이 지문의 핵심인 \u003cb class=\"key\">독약 \u003c/b>\u003cb class=\"key\">정원\u003c/b>이 추가되었습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>독약 정원의 특징\u003csmall>부연 · 문장 9–11\u003c/small>\u003c/h4>\u003cp>100여 종의 \u003cb class=\"key\">독성 \u003c/b>\u003cb class=\"key\">식물\u003c/b>이 우리에 갇혀 있거나 강력한 \u003cb class=\"key\">경고 \u003c/b>\u003cb class=\"key\">표지판\u003c/b>과 함께 전시된 독특한 풍경을 묘사합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>방문객의 인기와 목적\u003csmall>결론 · 문장 12–13\u003c/small>\u003c/h4>\u003cp>위험성에도 불구하고 수많은 \u003cb class=\"key\">방문객을 \u003c/b>\u003cb class=\"key\">유치\u003c/b>하며, 식물의 양면성을 가르치려는 \u003cb class=\"key\">교육적 \u003c/b>\u003cb class=\"key\">의도\u003c/b>를 강조합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 Alnwick Garden의 역사와 그 안에 있는 독약 정원이 만들어지기까지의 과정을 시간 순서대로 친절하게 설명해주고 있어요.","hl":null},{"n":4,"text":"첫 번째 단계인 도입부에서는 정원의 유명세를 언급하며 시작해요. 하지만 곧바로 Poison Garden에서는 절대로 꽃향기를 맡으려고 멈춰 서면 안 된다는 무시무시한 경고를 던지며 독자들의 호기심을 자극하죠.","hl":"f0"},{"n":5,"text":"두 번째 단계는 정원의 과거 역사예요. 천칠백오십년에 노섬벌랜드의 첫 번째 공작이 이 정원을 처음 만들었고 가문 대대로 전해졌지만, 안타깝게도 시간이 흐르면서 사람들의 기억 속에서 잊혀졌다는 내용을 담고 있어요.","hl":"f1"},{"n":6,"text":"세 번째 단계에서 분위기가 바뀝니다. 천구백구십오년에 열두 번째 공작부인인 Jane Percy가 정원을 다시 멋지게 꾸미기로 결심했고, 이천오년에는 마침내 이 글의 주인공인 Poison Garden을 새롭게 추가하게 되죠.","hl":"f2"},{"n":7,"text":"네 번째 단계는 독약 정원의 실제 모습을 생생하게 묘사해요. 백 가지가 넘는 독성 식물들이 자라고 있고, 너무 위험해서 우리에 갇힌 식물들도 있죠. 표지판은 방문객들에게 아무것도 만지거나 냄새 맡지 말라고 엄격하게 경고하고 있답니다.","hl":"f3"},{"n":8,"text":"마지막 다섯 번째 단계는 결론이에요. 이런 위험에도 불구하고 매년 육십만 명의 사람들이 이곳을 찾고 있으며, 식물의 좋은 점과 나쁜 점을 모두 배우는 교육적인 장소가 되고 있다는 점을 강조하며 마무리합니다.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 8번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">1750년부터 현대까지 Alnwick Garden의 \u003cb class=\"key\">역사적 \u003c/b>\u003cb class=\"key\">변천사\u003c/b>를 시간 순서대로 나열하고 있습니다. 정원이 잊혀졌다가 \u003cb class=\"key\">Jane \u003c/b>\u003cb class=\"key\">Percy\u003c/b>에 의해 다시 살아나고, 특히 독약 정원이 추가되는 과정이 중심 내용입니다. 마지막에는 이 정원이 현재 가지는 \u003cb class=\"key\">영향력과 \u003c/b>\u003cb class=\"key\">가치\u003c/b>를 언급하며 끝을 맺습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>The 1st Duke... in 1750 (3)\u003c/b>\u003cspan>시간적 기점\u003c/span>\u003cb>In 1995 (6)\u003c/b>\u003cspan>재건 시점\u003c/span>\u003cb>Then in 2005 (8)\u003c/b>\u003cspan>핵심 변화 시점\u003c/span>\u003cb>But despite the dangers (12)\u003c/b>\u003cspan>대조적 상황 연결\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">The Alnwick Garden\u003c/sp  \u003cb class=\"key\">재탄생\u003c/b>하게 되는 중요한 역사적 \u003cb class=\"key\">계기\u003c/b>를 설명하는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동격의 콤마\u003c/span> : A [명사] , B [명사구] : \"제12대 공작 부인인 Jane Percy\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : decide [타동사] + to recreate [to부정사구/목적어] : \"되살리기로 결정했다\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"In 1995, 1995년에. Jane Percy, Jane Percy는. the 12th Duke's wife, 제12대 공작 부인인. decided, 결정했어요. to recreate the garden, 그 정원을 되살리기로요.. 이 문장 전체를 해석하면, 1995년에, 제12대 공작 부인인 Jane Percy는 그 정원을 되살리기로 결정했어요.","hl":"m"},{"n":29,"text":"잊혔던 정원이 1995년에 공작 부인이라는 인물을 만나 다시 태어나게 됩니다. 정원의 새로운 역사가 시작되는 시점을 알려주고 있어요.","hl":"mn"},{"n":30,"text":"첫 번째 포인트는 주어인 Jane Percy 뒤에 쓰인 콤마입니다. 이 콤마는 뒤에 나오는 명사구와 앞의 인물이 같은 사람임을 나타내는 동격의 콤마예요. 두 번째로 decided라는 동사는 뒤에 무조건 to를 붙인 형태를 목적어로 데려와서 무엇을 하기로 결정했다는 뜻을 완성합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 만들었어요\u003c/span>\u003cspan class=\"en\">She \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">made \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">it \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 아름답게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">beautiful\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전보다\u003c/span>\u003cspan class=\"en\">than before.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 그것을 전보다 더 아름답게 만들었어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 제인 퍼시가 정원을 \u003cb class=\"key\">재건\u003c/b>하면서 이전보다 더 나은 상태로 변화시켰음을 나타냅니다. 정원의 전체적인 \u003cb class=\"key\">품격\u003c/b>을 높였다는 점을 강조하는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">5형식 문장 (목적격 보어)\u003c/span> : make [동사] + it [목적어] + more beautiful [목적격 보어/형용사] : \"그것을 더 아름답게 만들었다\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"She made, 그녀는 만들었어요. it, 그것을. more beautiful, 더 아름답게. than before, 전보다. 이 문장 전체를 해석하면, 그녀는 그것을 전보다 더 아름답게 만들었어요.","hl":"m"},{"n":32,"text":"제인 퍼시가 정원을 다시 만들면서 이전보다 훨씬 더 멋진 곳으로 변화시켰다는 내용이에요. 정원의 가치를 높였다는 의미를 담고 있죠.","hl":"mn"},{"n":33,"text":"첫 번째로 볼 부분은 5형식 문장 구조예요. 동사 make 뒤에 목적어 it이 오고, 그 뒤에 목적어의 상태를 설명해 주는 목적격 보어인 more beautiful이 왔어요. 이때 보어 자리에는 부사를 쓰지 않고 반드시 형용사를 써야 한다는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 2005년에,\u003c/span>\u003cspan class=\"en\">Then in 2005,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Jane은 추가로 만들었어요\u003c/span>\u003cspan class=\"en\">Jane added\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">특별한 정원을\u003c/span>\u003cspan class=\"en\">a special garden\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘Poison Garden’이라고 불리는\u003c/span>\u003cspan class=\"en\">called &quot;the Poison Garden.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그리고 2005년에, Jane은 ‘Poison Garden’이라고 불리는 특별한 정원을 추가로 만들었어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 알닉 정원의 가장 독특한 명소인 \u003cb class=\"key\">Poison \u003c/b>\u003cb class=\"key\">Garden\u003c/b>이 생긴 시점과 이름을 소개합니다. 이 글의 핵심 주제인 독성 정원의 \u003cb class=\"key\">시작\u003c/b>을 알려줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">과거분사의 후치 수식\u003c/span> : a special garden [명사] + called [과거분사구] : \"‘Poison Garden’이라 불리는 특별한 정원\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"Then in 2005, 그리고 2005년에. Jane added, Jane은 추가로 만들었어요. a special garden, 특별한 정원을. called \"the Poison Garden.\", ‘Poison Garden’이라고 불리는. 이 문장 전체를 해석하면, 그리고 2005년에, Jane은 ‘Poison Garden’이라고 불리는 특별한 정원을 추가로 만들었어요.","hl":"m"},{"n":35,"text":"이 정원의 가장 유명한 부분인 포이즌 가든이 언제 어떻게 생겨났는지 설명하고 있어요. 글의 핵심 소재인 독성 정원의 시작을 보여주는 문장이에요.","hl":"mn"},{"n":36,"text":"첫 번째 포인트는 과거분사의 후치 수식이에요. called \"the Poison Garden\"이라는 덩어리가 앞에 있는 명사인 a special garden을 뒤에서 꾸며주고 있죠. 정원이 스스로 부르는 게 아니라 그렇게 불리는 것이기 때문에 수동의 의미를 가진 과거분사를 쓴 거예요. 명사와 분사 사이에는 주격 관계대명사와 be동사가 생략되어 있다고 이해하면 더 쉬워요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 정원은 가득 차 있어요\u003c/span>\u003cspan class=\"en\">It's filled with\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">100여 종 이상의\u003c/span>\u003cspan class=\"en\">over 100\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다양한\u003c/span>\u003cspan class=\"en\">different\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">독성 식물로\u003c/span>\u003cspan class=\"en\">poisonous plants.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 정원은 100여 종 이상의 다양한 독성 식물로 가득 차 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Poison Garden에 있는 식물들의 \u003cb class=\"key\">규모\u003c/b>와 종류를 구체적으로 설명합니다. 수많은 위험한 식물들이 모여 있다는 점을 강조하며 \u003cb class=\"key\">위험성\u003c/b>을 암시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">수동태 관용 표현\u003c/span> : be filled with [~로 가득 차 있다] : \"~로 가득 차 있다\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"It's filled with, 그 정원은 가득 차 있어요. over 100, 100여 종 이상의. different, 다양한. poisonous plants, 독성 식물로. 이 문장 전체를 해석하면, 그 정원은 100여 종 이상의 다양한 독성 식물로 가득 차 있어요.","hl":"m"},{"n":38,"text":"포이즌 가든 안에 얼마나 많은 독초들이 있는지 그 규모를 알려주는 문장이에요. 백 가지가 넘는 위험한 식물들이 한곳에 모여 있다는 사실을 강조하고 있죠.","hl":"mn"},{"n":39,"text":"첫 번째로 익힐 표현은 be filled with예요. 무엇으로 가득 차 있다는 뜻의 수동태 관용 표현이죠. 이때 전치사 with를 쓴다는 점이 핵심이에요. 이 표현은 be full of로도 바꿔 쓸 수 있으니 함께 외워두면 시험에서 아주 유용하게 쓰일 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 식물들 중 일부는\u003c/span>\u003cspan class=\"en\">Some of the plants\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">심지어 보관되어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">even \u003c/span>\u003cspan class=\"tgt\">kept\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리에\u003c/span>\u003cspan class=\"en\">in cages\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">안전을 위해.\u003c/span>\u003cspan class=\"en\">for safety.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 식물들 중 일부는 안전을 위해 심지어 우리에 보관되어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 식물들이 인간에게 치명적일 수 있다는 점을 강조하며, 물리적 \u003cb class=\"key\">격리\u003c/b>가 필요할 정도의 \u003cb class=\"key\">위험성\u003c/b>을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태(be + 과거분사)\u003c/span> : be [동사] + [kept (past participle)] : \"보관되다\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"Some of the plants, 그 식물들 중 일부는. are even kept, 심지어 보관되어요. in cages, 우리에. for safety, 안전을 위해.. 이 문장 전체를 해석하면, 그 식물들 중 일부는 안전을 위해 심지어 우리에 보관되어요.","hl":"m"},{"n":41,"text":"식물이 우리에 갇혀 있다는 표현을 통해 이 정원이 얼마나 위험한 곳인지 생생하게 전달하고 있어요. 독자들에게 독초의 위험성에 대한 경각심을 일깨워 주는 문장입니다.","hl":"mn"},{"n":42,"text":"첫 번째 포인트는 are even kept 부분의 수동태예요. 식물은 보관되는 대상이니까 be 동사와 과거분사 형태를 썼죠. 부사인 even은 be 동사 뒤에 위치해서 심지어라는 의미를 더해주고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Poison Garden의 표지판은\u003c/span>\u003cspan class=\"en\">Signs in the Poison Garden\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">방문객들에게 경고해요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">warn \u003c/span>\u003cspan class=\"tgt\">visitors \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만지지 말라고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">touch\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아무것도 아니면 냄새를 맡지 말라고요.\u003c/span>\u003cspan class=\"en\">or smell anything.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Poison Garden의 표지판은 방문객들에게 아무것도 만지거나 냄새를 맡지 말라고 경고해요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 관람객들이 지켜야 할 구체적인 \u003cb class=\"key\">안전 \u003c/b>\u003cb class=\"key\">수칙\u003c/b>을 설명하며, 독이 든 식물에 대한 \u003cb class=\"key\">직접 \u003c/b>\u003cb class=\"key\">접촉\u003c/b>을 금지하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">5형식 문장(warn + 목적어 + to부정사)\u003c/span> : warn [동사] + [visitors (목적어)] + [not to touch (목적격 보어)] : \"방문객들에게 만지지 말라고 경고하다\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"Signs in the Poison Garden, Poison Garden의 표지판은. warn visitors, 방문객들에게 경고해요. not to touch, 만지지 말라고. or smell anything, 아무것도 아니면 냄새를 맡지 말라고요.. 이 문장 전체를 해석하면, Poison Garden의 표지판은 방문객들에게 아무것도 만지거나 냄새를 맡지 말라고 경고해요.","hl":"m"},{"n":44,"text":"이 문장은 정원의 위험을 방치하지 않고 표지판을 통해 관리하고 있음을 보여줘요. 만지거나 냄새를 맡는 평범한 행동조차 이곳에서는 금지된다는 사실이 흥미롭죠.","hl":"mn"},{"n":45,"text":"중요한 문법은 warn visitors not to touch 부분입니다. 동사 warn은 목적어 뒤에 to부정사를 써서 무엇을 하라고 경고할 때 쓰는데, 여기서는 하지 말라는 부정의 의미라서 to 앞에 not을 붙인 점에 꼭 주의하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만, 그런 위험에도 불구하고,\u003c/span>\u003cspan class=\"en\">But \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">despite \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">dangers\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Alnwick Garden은 끌어들여요\u003c/span>\u003cspan class=\"en\">the Alnwick Garden \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">attracts\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">600,000명이 넘는 방문객들을\u003c/span>\u003cspan class=\"en\">over 600,000 visitors\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매년.\u003c/span>\u003cspan class=\"en\">every year.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만, 그런 위험에도 불구하고, Alnwick Garden은 매년 600,000명이 넘는 방문객들을 끌어들여요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 위험함에도 불구하고 많은 사람들이 방문한다는 \u003cb class=\"key\">역설적\u003c/b>인 인기를 보여주며, 정원의 \u003cb class=\"key\">대중적 \u003c/b>\u003cb class=\"key\">매력\u003c/b>을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 despite\u003c/span> : despite [전치사] + [the dangers (명사구)] : \"위험에도 불구하고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주어-동사 수 일치\u003c/span> : [the Alnwick Garden (단수 주어)] + [attracts (단수 동사)] : \"끌어들이다\"\u003c/div>\u003c/div>","segs":[{"n":46,"text":"But despite the dangers, 하지만, 그런 위험에도 불구하고. the Alnwick Garden attracts, Alnwick Garden은 끌어들여요. over 600,000 visitors, 600,000명이 넘는 방문객들을. every year, 매년.. 이 문장 전체를 해석하면, 하지만, 그런 위험에도 불구하고, Alnwick Garden은 매년 600,000명이 넘는 방문객들을 끌어들여요.","hl":"m"},{"n":47,"text":"위험하면 사람들이 피할 것 같지만, 오히려 그 특별한 위험이 매년 수많은 방문객을 불러모으는 매력 포인트가 되었다는 반전의 내용입니다.","hl":"mn"},{"n":48,"text":"첫 번째로 despite the dangers를 보면, despite는 전치사라서 뒤에 명사인 dangers가 왔어요. 비록 ~일지라도라는 뜻이지만 접속사인 although와는 쓰임이 다르니 구분해야 해요. 두 번째로 attracts는 주어가 단수라서 동사에 에스를 붙여 수 일치를 시켜준 것입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Jane은 바랍니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Jane \u003c/span>\u003cspan class=\"tgt\">hopes \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 정원이 사람들에게 가르쳐 주기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">garden\u003c/span> will \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">teach \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">식물의 좋은 영향과 나쁜 영향에 대해서요.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">about\u003c/span> the good and bad effect of plants.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Jane은 그 정원이 사람들에게 식물의 좋은 영향과 나쁜 영향에 대해 가르쳐 주기를 바라요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 독이 있는 식물원을 만든 Jane의 \u003cb class=\"key\">교육적 \u003c/b>\u003cb class=\"key\">목적\u003c/b>을 보여주는 결론 문장입니다. 식물의 긍정적인 면과 부정적인 면을 모두 알리고자 하는 글의 \u003cb class=\"key\">주제\u003c/b>를 함축하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절 접속사 [[that]]의 생략\u003c/span> : hope [동사] + [(that) the garden ~ (명사절/목적어)] : \"Jane은 ~를 바란다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">4형식의 변형 구조 (teach A about B)\u003c/span> : teach [동사] + people [목적어] + about [전치사] : \"사람들에게 ~에 대해 가르치다\"\u003c/div>\u003c/div>","segs":[{"n":49,"text":"Jane hopes, Jane은 바랍니다. the garden will teach people, 그 정원이 사람들에게 가르쳐 주기를. about the good and bad effect of plants, 식물의 좋은 영향과 나쁜 영향에 대해서요.. 이 문장 전체를 해석하면, Jane은 그 정원이 사람들에게 식물의 좋은 영향과 나쁜 영향에 대해 가르쳐 주기를 바라요.","hl":"m"},{"n":50,"text":"이 문장은 제인이 독이 있는 식물원을 만든 진짜 이유를 설명하고 있어요. 단순히 사람들을 놀라게 하려는 게 아니라 식물이 가진 양면성을 알리려는 교육적 목적을 담고 있습니다.","hl":"mn"},{"n":51,"text":"첫 번째 포인트는 Jane hopes 바로 뒤에 접속사 that이 생략되었다는 점이에요. 그래서 그 뒤에 바로 the garden이라는 주어와 will teach라는 동사가 다시 시작될 수 있는 거죠. 두 번째는 teach people about 표현인데 누구에게 어떤 주제에 대해 가르친다는 의미로 전치사 about과 함께 쓰였습니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>영국 노섬벌랜드에 위치한 Alnwick Garden은 아름다움과 \u003cb class=\"key\">역사적 \u003c/b>\u003cb class=\"key\">가치\u003c/b>를 지닌 세계적인 명소입니다.\u003c/li>\u003cli>1750년에 처음 조성된 이후 잊혀졌던 정원은 1995년 Jane Percy에 의해 \u003cb class=\"key\">재건\u003c/b>되며 새로운 전환점을 맞이했습니다.\u003c/li>\u003cli>2005년에 추가된 \u003cb class=\"key\">Poison \u003c/b>\u003cb class=\"key\">Garden\u003c/b>은 100종 이상의 치명적인 식물들을 안전하게 격리하여 전시하고 있습니다.\u003c/li>\u003cli>이 정원은 위험성에도 불구하고 매년 수많은 방문객에게 \u003cb class=\"key\">식물의 \u003c/b>\u003cb class=\"key\">양면성\u003c/b>에 대한 귀중한 교육을 제공합니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The Alnwick Garden provides a unique educational experience by combining its historical beauty with a cautionary display of dangerous plants.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">영국 노섬벌랜드의 \u003cb class=\"key\">Alnwick \u003c/b>\u003cb class=\"key\">Garden\u003c/b>은 아름다운 역사적 정원이지만, 100종 이상의 치명적인 \u003cb class=\"key\">독성 \u003c/b>\u003cb class=\"key\">식물\u003c/b>을 전시하여 방문객들에게 식물의 위험성을 교육하는 'Poison Garden'으로 더욱 유명합니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":52,"text":"오늘 우리는 Alnwick Garden을 통해 식물의 아름다움 뒤에 숨겨진 치명적인 매력을 살펴봤어요. 겉으로 보이는 모습뿐만 아니라 그 본질을 이해하는 것이 얼마나 중요한지 다시 한번 느낄 수 있었죠? 오늘 배운 역사적인 표현들과 단어들을 복습하는 것 잊지 마세요. 그럼 다음 시간에 만나요!","hl":null}]}]});</script></body></html>
