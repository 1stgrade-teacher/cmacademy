</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}

    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}

lecturePlayer(document.getElementById("app"),{"brand":"청명학원 영어과","title":"리딩그라피2 리딩그라피레벨2 6번","audioDir":"audio","preview":false,"count":55,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.400em\">리딩그라피레벨2\u003cbr>6번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩그라피2\u003c/div>\u003ch1>Diapers for Roads: A Creative Recycling Solution in Wales\u003c/h1>\u003ch2>도로를 위한 기저귀: 웨일스의 창의적인 재활용 해결책\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>영국 웨일스에서 막대한 양의 \u003cb class=\"key\">기저귀 \u003c/b>\u003cb class=\"key\">폐기물\u003c/b> 문제를 해결하기 위해 이를 \u003cb class=\"key\">도로 \u003c/b>\u003cb class=\"key\">건설 \u003c/b>\u003cb class=\"key\">재료\u003c/b>로 재활용하는 창의적인 시도를 하고 있다는 내용입니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Recycling diapers into road construction materials helps solve the environmental problem of non-biodegradable waste in Wales.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 환경을 지키는 아주 창의적인 아이디어에 대한 지문을 공부해 볼 거예요. 웨일스에서 기저귀로 도로를 만든다는 놀라운 이야기인데요, 요약하자면 막대한 양의 기저귀 폐기물을 도로 건설 재료로 재활용해서 환경 문제를 해결한다는 내용입니다. 오늘의 요지는 기저귀를 재활용해 도로를 만드는 기술이 환경 보호의 새로운 대안이 될 수 있다는 것이죠.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">환경 보호를 위한 \u003cb class=\"key\">순환 \u003c/b>\u003cb class=\"key\">경제\u003c/b>(Circular Economy)가 주목받고 있습니다. 기저귀는 플라스틱과 섬유로 구성되어 \u003cb class=\"key\">분해\u003c/b>(break down)되는 데 수백 년이 걸립니다. 이를 도로 포장재인 \u003cb class=\"key\">아스팔트\u003c/b>(asphalt)에 섞으면, 마치 빵 반죽에 견과류를 넣어 \u003cb class=\"key\">결합력\u003c/b>을 높이는 것과 같은 효과를 줍니다. 이 공정에는 끈적한 성질의 \u003cb class=\"key\">역청\u003c/b>(bitumen)이 접착제 역할을 하며 재활용의 새로운 가능성을 보여줍니다.\u003c/div>","segs":[{"n":2,"text":"수업 시작 전에 배경지식을 좀 알아볼까요? 요즘 환경 보호를 위해 자원을 계속 돌려쓰는 순환 경제가 정말 중요해졌어요. 우리가 흔히 쓰는 기저귀는 플라스틱과 섬유로 만들어져서 자연에서 분해되는 데 무려 오백 년이나 걸린답니다. 이걸 도로 포장재인 아스팔트에 섞으면, 마치 빵을 만들 때 견과류를 넣어서 더 단단하게 만드는 것과 비슷한 효과를 낸대요. 이때 역청이라는 끈적끈적한 물질이 기저귀 조각들을 도로에 딱 붙여주는 접착제 역할을 하게 됩니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>놀라운 도로 재료\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>사람들이 도로를 만들 때 사용하는 의외의 재료인 \u003cb class=\"key\">기저귀\u003c/b>를 소개하며 독자의 \u003cb class=\"key\">호기심\u003c/b>을 자극합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>환경적 문제\u003csmall>문제 제기 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>영국에서 버려지는 막대한 양의 기저귀와 그것이 \u003cb class=\"key\">분해\u003c/b>되는 데 걸리는 \u003cb class=\"key\">오랜 \u003c/b>\u003cb class=\"key\">시간\u003c/b>을 언급하며 환경 문제를 지적합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>창의적 해결책\u003csmall>주장/해결 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>문제 해결을 위해 웨일스에서 \u003cb class=\"key\">재활용된 \u003c/b>\u003cb class=\"key\">기저귀\u003c/b>를 도로 보수에 사용하기 시작했다는 \u003cb class=\"key\">해결책\u003c/b>을 제시합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>제조 공정\u003csmall>설명 · 문장 7–11\u003c/small>\u003c/h4>\u003cp>기저귀가 세척과 절단 과정을 거쳐 \u003cb class=\"key\">역청\u003c/b>과 섞여 아스팔트가 \u003cb class=\"key\">부서지는 \u003c/b>\u003cb class=\"key\">것\u003c/b>을 막는 구체적인 과정을 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>전망과 기대\u003csmall>결론 · 문장 12–14\u003c/small>\u003c/h4>\u003cp>현재는 영국에서만 시험 중이지만 향후 \u003cb class=\"key\">전 \u003c/b>\u003cb class=\"key\">세계\u003c/b>로 퍼져나갈 가능성이 있다는 \u003cb class=\"key\">기대감\u003c/b>을 드러냅니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 이제 지문이 어떤 순서로 이어지는지 전체적인 흐름을 살펴볼까요?","hl":null},{"n":4,"text":"처음 첫 번째와 두 번째 문장에서는 도로를 만들 때 기저귀를 사용한다는 아주 놀라운 사실을 던지며 시작합니다. 독자들의 궁금증을 확 끌어올리는 도입부예요.","hl":"f0"},{"n":5,"text":"세 번째와 네 번째 문장에서는 왜 이런 일이 필요한지 설명합니다. 영국에서만 매년 삼십억 개의 기저귀가 버려지고 이게 썩는 데 너무 오래 걸린다는 환경적 문제를 짚어주고 있죠.","hl":"f1"},{"n":6,"text":"다섯 번째와 여섯 번째 문장이 이 글의 핵심입니다. 이 문제를 해결하기 위해 재활용 기저귀를 도로 보수에 쓰기 시작했다는 창의적인 해결책을 제시하고 있어요.","hl":"f2"},{"n":7,"text":"일곱 번째부터 열한 번째 문장까지는 구체적인 제조 공정을 설명합니다. 기저귀를 자르고 씻어서 역청과 섞으면 아스팔트가 부서지지 않게 도와준다는 상세한 원리를 가르쳐주네요.","hl":"f3"},{"n":8,"text":"마지막 열두 번째부터 열네 번째 문장에서는 현재 영국의 상황과 함께 앞으로 이 아이디어가 전 세계로 퍼져나갈 것이라는 희망찬 전망으로 마무리합니다.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 5번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">기저귀 쓰레기라는 \u003cb class=\"key\">환경 \u003c/b>\u003cb class=\"key\">문제\u003c/b>를 먼저 제시한 후, 이를 도로 보수에 사용하는 \u003cb class=\"key\">창의적 \u003c/b>\u003cb class=\"key\">해결책\u003c/b>을 소개합니다. 이후 구체적인 \u003cb class=\"key\">공정 \u003c/b>\u003cb class=\"key\">과정\u003c/b>을 설명하며 글을 마무리하는 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Surprisingly (2)\u003c/b>\u003cspan>놀라운 반전 도입\u003c/span>\u003cb>To help with this problem (5)\u003c/b>\u003cspan>해결책 제시\u003c/span>\u003cb>First - Then - Finally (8)\u003c/b>\u003cspan>순서에 따른 공정 설명\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">diapers\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">recycled diapers\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">small pieces\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">these pieces\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"이 글은 전형적인 문제와 해결 구조를 가지고 있어요. 기저귀 쓰레기라는 환경 문제를 먼저 보여주고, 그 해결책으로 도로 재활용을 제안하고 있죠. 주제문이 중간인 다섯 번째 문장에 위치한 중괄식 구조라고 볼 수 있습니다.","hl":"ty"},{"n":10,"text":"글의 흐름을 알려주는 신호어들을 잘 봐야 해요. 두 번째 문장의 Surprisingly는 분위기를 반전시키고, 다섯 번째 문장의 To help with this problem은 이제부터 해결책을 말하겠다는 신호죠. 공정을 설명할 때 쓰인 First, Then, F /span>\u003c/div>\u003cdiv>\u003cb>fall apart\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>부서지다, 해체되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>test\u003c/b>\u003cem>동사\u003c/em>\u003cspan>시험하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>spread\u003c/b>\u003cem>동사\u003c/em>\u003cspan>퍼지다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"중요한 단어 몇 개만 짚어볼까요? 세 번째 문장의 throw away는 버리다는 뜻이고요, 네 번째 문장의 break down은 분해되다는 뜻으로 환경 지문에서 정말 자주 나와요. 열한 번째 문장의 keep from falling apart는 부서지지 않게 막는다는 핵심적인 표현이니 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">waste\u003c/b>\u003cspan class=\"m\">폐기물\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">refuse\u003c/span>\u003cspan class=\"s\">trash\u003c/span>\u003cspan class=\"s\">garbage\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">resource\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">fix\u003c/b>\u003cspan class=\"m\">보수하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">repair\u003c/span>\u003cspan class=\"s\">mend\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">damage\u003c/span>\u003cspan class=\"a\">break\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">creative\u003c/b>\u003cspan class=\"m\">창의적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">innovative\u003c/span>\u003cspan class=\"s\">original\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unimaginative\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">reduce\u003c/b>\u003cspan class=\"m\">줄이다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">decrease\u003c/span>\u003cspan class=\"s\">lessen\u003c/span>\u003cspan class=\"s\">diminish\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">increase\u003c/span>\u003cspan class=\"a\">expand\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">sticky\u003 aterial, 끈적거리는 물질에. called *bitumen, 역청이라고 불리는. 이 문장 전체를 해석하면, 마침내, 이 조각들은 역청이라고 불리는 끈적거리는 물질에 더해집니다.","hl":"m"},{"n":41,"text":"잘게 잘린 기저귀 조각들이 도로를 만드는 끈적한 재료인 역청과 섞이는 최종 단계를 설명하고 있어요. 기저귀가 도로의 한 부분이 되는 구체적인 방법을 보여주는 문장입니다.","hl":"mn"},{"n":42,"text":"첫 번째로 are added는 수동태 표현이에요. 주어인 조각들이 더해지는 동작을 받는 쪽이라서 be동사와 과거분사를 썼죠. 두 번째로 문장 끝에 있는 called bitumen은 앞에 나온 명사를 꾸며주는 과거분사구로 역청이라고 불리는이라는 뜻을 가집니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 마지막 단계가\u003c/span>\u003cspan class=\"en\">This last step\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아스팔트가 ~하는 것을 막아줍니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">keeps \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">**asphalt \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">부서지지 못하게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">falling \u003c/span>\u003cspan class=\"tgt\">apart\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 마지막 단계가 아스팔트가 부서지지 못하게 막아줍니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 기저귀 조각을 섞는 것이 아스팔트의 \u003cb class=\"key\">내구성\u003c/b>을 높여주는 역할을 한다고 설명합니다. 재활용의 \u003cb class=\"key\">실용적인 \u003c/b>\u003cb class=\"key\">이점\u003c/b>을 강조하는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">keep A from B(-ing) 구문\u003c/span> : keep + 목적어(A) + from + 동명사(B) : \"아스팔트가 부서지는 것을 막다\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"This last step, 이 마지막 단계가. keeps the **asphalt, 아스팔트가 ~하는 것을 막아줍니다. from falling apart, 부서지지 못하게. 이 문장 전체를 해석하면, 이 마지막 단계가 아스팔트가 부서지지 못하게 막아줍니다.","hl":"m"},{"n":44,"text":"기저귀 조각을 섞는 이 과정이 왜 중요한지 그 이유를 알려주고 있어요. 바로 도로의 재료인 아스팔트가 쉽게 망가지거나 떨어져 나가지 않게 단단히 잡아주는 역할을 한다는 뜻이죠.","hl":"mn"},{"n":45,"text":"이 문장에서 가장 중요한 포인트는 keep A from B 표현입니다. 아스팔트라는 목적어 뒤에 from falling apart를 써서 아스팔트가 부서지는 행동을 하지 못하게 막아준다는 의미를 나타냅니다. 시험에 정말 자주 나오니까 꼭 외워두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지금은,\u003c/span>\u003cspan class=\"en\">For now,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">영국만이 시험하고 있습니다\u003c/span>\u003cspan class=\"en\">only the U.K. \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">testing\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 아이디어를\u003c/span>\u003cspan class=\"en\">this idea.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">지금은, 영국만이 이 아이디어를 시험하고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 기저귀 도로 프로젝트의 \u003cb class=\"key\">현재 \u003c/b>\u003cb class=\"key\">진행 \u003c/b>\u003cb class=\"key\">상황\u003c/b>을 나타냅니다. 아직 \u003cb class=\"key\">초기 \u003c/b>\u003cb class=\"key\">단계\u003c/b>이며 영국에서만 시도되고 있음을 밝히고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재진행형\u003c/span> : be동사 (is) + 현재분사 (testing) : \"시험하고 있다\"\u003c/div>\u003c/div>","segs":[{"n":46,"text":"For now, 지금은. only the U.K. is testing, 영국만이 시험하고 있습니다. this idea, 이 아이디어를. 이 문장 전체를 해석하면, 지금은, 영국만이 이 아이디어를 시험하고 있습니다.","hl":"m"},{"n":47,"text":"이 획기적인 도로 공사 방법이 현재 어디서 진행되고 있는지 알려주는 문장이에요. 지금은 영국이라는 나라에서만 시범적으로 운영되고 있다는 사실을 전달하고 있습니다.","hl":"mn"},{"n":48,"text":"시제를 살펴보면 is testing이라는 현재진행형이 쓰였어요. 이 아이디어가 과거의 일로 끝난 게 아니라 지금 현재 실제로 시험 중이라는 생생한 느낌을 전달하고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만\u003c/span>\u003cspan class=\"en\">But\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">누가 아나요?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">knows?\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 누가 아나요?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> \u003cb class=\"key\">수사 \u003c/b>\u003cb class=\"key\">의문문\u003c/b>을 사용하여 뒤에 나올 긍정적인 추측에 힘을 실어주는 역할을 합니다. 아무도 확실히는 모르지만 \u003cb class=\"key\">가능성\u003c/b>이 충분하다는 뉘앙스를 전달합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수사 의문문\u003c/span> : Who + [동사]~? : \"누가 알겠는가? (아무도 모른다/그럴 수도 있다)\"\u003c/div>\u003c/div>","segs":[{"n":49,"text":"But, 하지만. who knows?, 누가 아나요?. 이 문장 전체를 해석하면, 하지만 누가 아나요?","hl":"m"},{"n":50,"text":"이 문장은 진짜 궁금해서 묻는 게 아니라 뒤에 나올 긍정적인 미래에 대해 가능성을 열어주는 수사 의문문이에요. 앞서 나온 기저귀 도로 아이디어가 더 널리 쓰일 수도 있다는 기대감을 줍니다.","hl":"mn"},{"n":51,"text":"여기서 who knows는 문법적으로 수사 의문문이라고 불러요. 누군가 알 거라는 뜻보다는 아무도 확신할 순 없지만 그럴 수도 있다는 점을 강조하는 표현이죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은 퍼질지도 모릅니다\u003c/span>\u003cspan class=\"en\">It \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">might \u003c/span>\u003cspan class=\"tgt\">spread\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전 세계로\u003c/span>\u003cspan class=\"en\">to the whole world\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">언젠가!\u003c/span>\u003cspan class=\"en\">one day!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">언젠가 이것은 전 세계로 퍼질지도 모릅니다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 웨일스의 사례가 전 세계적인 \u003cb class=\"key\">환경 \u003c/b>\u003cb class=\"key\">보호\u003c/b> 해결책으로 발전할 수 있다는 \u003cb class=\"key\">추측\u003c/b>을 담고 있습니다. 지문의 마지막 문장으로 주제를 \u003cb class=\"key\">확장\u003c/b>하며 마무리합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 might(추측)\u003c/span> : might + [동사원형] : \"~일지도 모른다\"\u003c/div>\u003c/div>","segs":[{"n":52,"text":"It might spread, 이것은 퍼질지도 모릅니다. to the whole world, 전 세계로. one day!, 언젠가!. 이 문장 전체를 해석하면, 언젠가 이것은 전 세계로 퍼질지도 모릅니다!","hl":"m"},{"n":53,"text":"웨일스에서 시작된 이 창의적인 재활용 방법이 전 세계 환경 문제를 해결하는 열쇠가 될 수도 있다는 희망찬 전망으로 글을 마무리하고 있어요.","hl":"mn"},{"n":54,"text":"첫 번째로 might spread 부분을 보세요. 조동사 might는 약한 추측을 나타내어 미래에 일어날지도 모르는 가능성을 조심스럽게 표현합니다. 두 번째로 마지막의 one day는 미래의 어느 날이나 언젠가를 뜻하는 부사구로 쓰였어요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>영국 웨일스에서는 버려지는 \u003cb class=\"key\">기저귀\u003c/b>가 심각한 \u003cb class=\"key\">환경 \u003c/b>\u003cb class=\"key\">폐기물\u003c/b> 문제가 되고 있습니다.\u003c/li>\u003cli>이 문제를 해결하기 위해 재활용된 기저귀를 \u003cb class=\"key\">도로 \u003c/b>\u003cb class=\"key\">보수\u003c/b>에 사용하는 창의적인 방법이 도입되었습니다.\u003c/li>\u003cli>기저귀는 잘게 잘려 \u003cb class=\"key\">역청\u003c/b>과 혼합되며, 이는 아스팔트가 \u003cb class=\"key\">부서지는 \u003c/b>\u003cb class=\"key\">것\u003c/b>을 방지하는 역할을 합니다.\u003c/li>\u003cli>현재 영국에서 시험 중인 이 기술은 미래에 \u003cb class=\"key\">전 \u003c/b>\u003cb class=\"key\">세계\u003c/b>로 확산될 가능성이 큽니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Recycling diapers into road construction materials helps solve the environmental problem of non-biodegradable waste in Wales.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">영국 웨일스에서 막대한 양의 \u003cb class=\"key\">기저귀 \u003c/b>\u003cb class=\"key\">폐기물\u003c/b> 문제를 해결하기 위해 이를 \u003cb class=\"key\">도로 \u003c/b>\u003cb class=\"key\">건설 \u003c/b>\u003cb class=\"key\">재료\u003c/b>로 재활용하는 창의적인 시도를 하고 있다는 내용입니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":55,"text":"자, 오늘 이렇게 기저귀를 재활용한 도로 건설이라는 흥미로운 주제를 다뤄봤습니다. 쓰레기를 줄이는 창의적인 생각이 세상을 어떻게 바꾸는지 잘 보여주는 지문이었죠? 오늘 배운 과정 설명의 연결어들과 핵심 표현들을 다시 한번 복습해 보세요. 수고 많으셨습니다!","hl":null}]}]});</script></body></html>
