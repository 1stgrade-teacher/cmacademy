의 대표적인 사례라고 할 수 있죠. 마치 레고 블록 사이에 튼튼한 접착제를 넣어 건물을 더 단단하게 만드는 것처럼, 버려지는 기저귀를 도로의 뼈대를 보강하는 재료로 활용하는 발상은 환경 오염을 줄이는 기발한 아이디어로 주목받고 있습니다. 오늘 읽을 지문은 이러한 친환경 공법이 어떻게 실생활에 적용되는지 다루고 있으니, 폐기물의 변신 과정에 집중하며 읽어보시면 더욱 흥미로울 거예요!</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01문제 상황</div><ul><li>영국 웨일스에서는 엄청난 양의 기저귀 쓰레기가 발생하며 환경 문제를 야기하고 있습니다.</li><li>연간 약 30억 개의 기저귀가 폐기됨</li><li>40만 톤의 쓰레기(waste) 발생 및 분해에 500년 소요</li><li>핵심 키워드: 폐기저귀(diapers), 환경 문제(environmental problem)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02해결 방안</div><ul><li>웨일스에서는 쓰레기 문제를 해결하기 위해 재활용 기저귀를 도로 포장에 사용하는 아이디어를 도입했습니다.</li><li>버려지는 기저귀의 양을 줄이는 창의적 시도(creative idea)</li><li>도로 보수 재료로 재활용 기저귀 활용</li><li>핵심 키워드: 재활용(recycled), 도로 보수(fix the roads)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03제조 공정</div><ul><li>수거된 기저귀는 일련의 복잡한 가공 과정을 거쳐 도로 건설의 원료로 변모합니다.</li><li>잘게 자르고 세척(washed)하는 초기 단계</li><li>부드러운 작은 조각으로 변환하는 여러 단계</li><li>핵심 키워드: 가공(processing), 조각(pieces)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04과학적 원리</div><ul><li>가공된 기저귀 조각은 아스팔트의 내구성을 높이는 중요한 역할을 합니다.</li><li>끈적한 물질인 역청(bitumen)에 기저귀 조각 혼합</li><li>아스팔트가 부서지는 것을 방지(prevent from falling apart)</li><li>핵심 키워드: 역청(bitumen), 아스팔트(asphalt)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05향후 전망</div><ul><li>현재는 영국에서만 시험적으로 시행 중이지만, 이 기술은 전 세계로 확산될 가능성이 있습니다.</li><li>현재 영국에서 테스트(testing) 진행 중</li><li>향후 전 세계로 기술이 확대될 수 있는 잠재력</li><li>핵심 키워드: 확산(spread), 세계적(whole world)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">throw away</td><td class=\"m\">버리다, 낭비하다</td></tr><tr><td class=\"w\">break down</td><td class=\"m\">분해되다, 고장 나다</td></tr><tr><td class=\"w\">go through</td><td class=\"m\">~을 거치다, ~을 겪다</td></tr><tr><td class=\"w\">turn into</td><td class=\"m\">~로 변하다, ~이 되다</td></tr><tr><td class=\"w\">fall apart</td><td class=\"m\">부서지다, 산산조각 나다</td></tr><tr><td class=\"w\">surprisingly</td><td class=\"m\">놀랍게도, 의외로</td></tr><tr><td class=\"w\">waste</td><td class=\"m\">쓰레기, 낭비</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fix</td><td class=\"m\">수리하다, 해결하다</td></tr><tr><td class=\"w\">creative</td><td class=\"m\">창의적인, 독창적인</td></tr><tr><td class=\"w\">reduce</td><td class=\"m\">줄이다, 감소시키다</td></tr><tr><td class=\"w\">various</td><td class=\"m\">다양한, 여러 가지의</td></tr><tr><td class=\"w\">material</td><td class=\"m\">재료, 물질</td></tr><tr><td class=\"w\">spread</td><td class=\"m\">퍼지다, 확산되다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사람들이 도로를 만들 때,</span><span class=\"en\"><b><span class=\"grammar-hl\">When people make roads</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분은 무엇을 생각하시나요</span><span class=\"en\"><b><span class=\"grammar-hl\">what do you think</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 사용할 것이라고</span><span class=\"en\"><b><span class=\"grammar-hl\">they use</span>?</b></span></div></div><div class=\"lec-sent-ko\">사람들이 도로를 만들 때, 여러분은 그들이 무엇을 사용할 것이라고 생각하시나요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 도로 건설 과정에 대한 독자의 호기심을 유발하며, 뒤이어 나올 놀라운 소재인 기저귀에 관한 이야기를 꺼내기 위한 도입부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">When people make roads (분사구문): 접속사(When) + 주어(people) + 동사(make) 형태의 부사절이며, 시간의 의미를 나타낸다.</div><div class=\"lec-gr-item\">what do you think they use (간접의문문): 의문사 what이 문장의 목적어 자리에 위치하며, &#39;think&#39;와 같은 사고 동사가 삽입된 경우 의문사가 문장 앞으로 이동하는 구조이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">놀랍게도,</span><span class=\"en\"><b>Surprisingly,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">영국 웨일스의 사람들은</span><span class=\"en\"><b><span class=\"grammar-hl\">the people of Wales in the U.K.</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">기저귀를 사용합니다!</span><span class=\"en\"><b>use diapers!</b></span></div></div><div class=\"lec-sent-ko\">놀랍게도, 영국 웨일스의 사람들은 기저귀를 사용합니다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 던진 질문에 대한 답을 제시하며, 일반적인 도로 재료와는 거리가 먼 기저귀가 사용된다는 사실을 강조하여 화제의 참신함을 드러냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the people of Wales in the U.K. (관용표현): 특정 지역이나 국가를 지칭하는 관용적 명사구이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">surprisingly</td><td class=\"m\">놀랍게도, 의외로</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">영국에서는,</span><span class=\"en\"><b>In the U.K.,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">약 30억 개의 기저귀가</span><span class=\"en\"><b>about three billion diapers</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">버려지고,</span><span class=\"en\"><b><span class=\"grammar-hl\">are thrown away</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매년</span><span class=\"en\"><b>each year,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 이것은 40만 톤의 쓰레기를 발생시킵니다.</span><span class=\"en\"><b>and this creates 400,000 tons of waste.</b></span></div></div><div class=\"lec-sent-ko\">영국에서는, 매년 약 30억 개의 기저귀가 버려지고,</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 왜 하필 기저귀를 재활용하는지 그 배경을 설명합니다. 막대한 양의 폐기물 발생이라는 환경적 문제 상황을 구체적인 수치로 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are thrown away (수동태): be동사(are)+p.p.(thrown) 구조. throw는 타동사인데 목적어가 없어서 수동구조 are thrown away 형태로 쓴다. 기본구조: throw + O(목적어) + away.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">waste</td><td class=\"m\">쓰레기, 낭비</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">기저귀들은</span><span class=\"en\"><b>Diapers</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">500년이 걸릴 수 있습니다</span><span class=\"en\"><b>can take 500 years</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">분해되는 데</span><span class=\"en\"><b>to break down.</b></span></div></div><div class=\"lec-sent-ko\">기저귀들은 분해되는 데 500년이 걸릴 수 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 폐기물 문제의 심각성을 더합니다. 썩는 데 너무 오랜 시간이 걸린다는 자연 분해의 어려움을 들어 재활용의 필요성을 뒷받침합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">To help with this problem (to부정사): 문장의 처음에 위치하여 &#39;~하기 위해서&#39;라는 목적의 부사적 용법으로 쓰였다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">break down</td><td class=\"m\">분해되다, 고장 나다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 문제를 해결하기 위해,</span><span class=\"en\"><b><span class=\"grammar-hl\">To help with this problem</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들은 재활용된 기저귀를 사용하기 시작했습니다</span><span class=\"en\"><b>people started <span class=\"grammar-hl\">using recycled diapers</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">도로를 보수하는 데</span><span class=\"en\"><b><span class=\"grammar-hl\">to fix the roads</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">웨일스의</span><span class=\"en\"><b>in Wales.</b></span></div></div><div class=\"lec-sent-ko\">이 문제를 해결하기 위해, 사람들은 웨일스의 도로를 보수하는 데 재활용된 기저귀를 사용하기 시작했습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 환경 문제를 해결하기 위한 구체적인 대응책을 제시하며, 기저귀가 도로에 쓰이게 된 동기를 명확히 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">To help with this problem (to부정사): &#39;~하기 위해&#39;라는 목적으로 사용된 부사적 용법이다.</div><div class=\"lec-gr-item\">using recycled diapers (동명사): start의 목적어 역할을 하며, &#39;기저귀를 재활용하는 것&#39;이라는 행위를 나타낸다.</div><div class=\"lec-gr-item\">recycled diapers (과거분사(형용사)): recycled가 diapers를 수식(= &#39;재활용된 기저귀&#39;). p.p. + N 구조로, N이 p.p.된 상태를 설명한다.</div><div class=\"lec-gr-item\">to fix the roads (to부정사): &#39;~하기 위해&#39;라는 목적으로 사용된 부사적 용법이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fix</td><td class=\"m\">수리하다, 해결하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 창의적인 생각은</span><span class=\"en\"><b>This <span class=\"grammar-hl\">creative idea</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">줄여주고 있습니다</span><span class=\"en\"><b>is reducing</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">기저귀의 수를</span><span class=\"en\"><b>the number of <span class=\"grammar-hl\">diapers</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">버려지는</span><span class=\"en\"><b><span class=\"grammar-hl\">thrown away</span>.</b></span></div></div><div class=\"lec-sent-ko\">이 창의적인 생각은 버려지는 기저귀의 수를 줄여주고 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 기저귀를 도로 포장에 활용하는 행위가 실제 폐기물 감소라는 실질적인 성과를 내고 있음을 알려줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">creative idea (현재분사(형용사)): creative가 idea를 수식(= &#39;창의적인 생각&#39;). -ing 형태의 형용사적 기능으로 동작이나 성질을 나타낸다.</div><div class=\"lec-gr-item\">diapers thrown away (과거분사(형용사)): thrown away가 diapers를 후치수식(= &#39;버려진 기저귀&#39;). N + p.p. 구조로, N이 p.p.된 상태를 설명한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">creative</td><td class=\"m\">창의적인, 독창적인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만</span><span class=\"en\"><b>But</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">기저귀들이 어떻게</span><span class=\"en\"><b>how do diapers</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">도로의 일부가 될까요?</span><span class=\"en\"><b><span class=\"grammar-hl\">become part of</span> a road?</b></span></div></div><div class=\"lec-sent-ko\">하지만 기저귀들이 어떻게 도로의 일부가 될까요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자가 가질 법한 제조 공정에 대한 궁금증을 대신 질문하며, 내용을 도로 건설의 구체적인 과정으로 전환합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">become part of (관용표현): &#39;~의 일부가 되다&#39;라는 의미를 가진 숙어적 표현이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">먼저,</span><span class=\"en\"><b>First,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">기저귀들은</span><span class=\"en\"><b>the diapers</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">작은 조각들로 잘려지고</span><span class=\"en\"><b><span class=\"grammar-hl\">are cut</span> into small pieces</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">세척됩니다.</span><span class=\"en\"><b>and washed.</b></span></div></div><div class=\"lec-sent-ko\">먼저, 기저귀들은 작은 조각들로 잘려지고 세척됩니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 도로 재료로 탈바꿈하기 위한 첫 번째 단계인 가공 과정을 단계별 설명의 시작으로 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are cut (수동태): be동사(are)+p.p.(cut) 구조. cut은 타동사인데 목적어가 없어서 수동구조 are cut 형태로 쓴다. 기본구조: cut + O(목적어).</div><div class=\"lec-gr-item\">are washed (수동태): be동사(are)+p.p.(washed) 구조. wash는 타동사인데 목적어가 없어서 수동구조 are washed 형태로 쓴다. 기본구조: wash + O(목적어).</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그다음,</span><span class=\"en\"><b>Then,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들은 여러 단계를 거칩니다</span><span class=\"en\"><b>they go through various steps</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">작고, 부드러운 조각이 될 때까지</span><span class=\"en\"><b>until they <span class=\"grammar-hl\">turn into</span> small, soft pieces.</b></span></div></div><div class=\"lec-sent-ko\">그다음, 그것들은 작고, 부드러운 조각이 될 때까지 여러 단계를 거칩니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 세척 이후 이어지는 추가적인 처리 과정을 언급하며, 다음 단계인 혼합 공정을 준비합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">turn into (관용표현): &#39;~로 변하다&#39;라는 의미를 가진 숙어적 표현이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">go through</td><td class=\"m\">~을 거치다, ~을 겪다</td></tr><tr><td class=\"w\">turn into</td><td class=\"m\">~로 변하다, ~이 되다</td></tr><tr><td class=\"w\">various</td><td class=\"m\">다양한, 여러 가지의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">마침내,</span><span class=\"en\"><b>Finally,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 조각들은</span><span class=\"en\"><b>these pieces</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">끈적거리는 물질에 더해집니다</span><span class=\"en\"><b><span class=\"grammar-hl\">are added</span> to a sticky material</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">역청이라고 불리는</span><span class=\"en\"><b>called *bitumen.</b></span></div></div><div class=\"lec-sent-ko\">마침내, 이 조각들은 역청이라고 불리는 끈적거리는 물질에 더해집니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 재료를 도로 포장재와 결합하는 최종적인 결합 공정을 설명하여 기저귀가 도로의 구성 성분이 되는 과정을 완성합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are added (수동태): be동사(are)+p.p.(added) 구조. add는 타동사인데 목적어가 없어서 수동구조 are added 형태로 쓴다. 기본구조: add + O(목적어) + to B.</div><div class=\"lec-gr-item\">called bitumen (과거분사(형용사)): called가 material을 후치수식(= &#39;역청이라 불리는&#39;). N + p.p. 구조로, N이 p.p.된 상태를 설명한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">material</td><td class=\"m\">재료, 물질</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 11 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 마지막 단계가</span><span class=\"en\"><b>This last step</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아스팔트를 막아줍니다</span><span class=\"en\"><b>keeps the **asphalt</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">부서지지 못하게</span><span class=\"en\"><b>from <span class=\"grammar-hl\">falling apart</span>.</b></span></div></div><div class=\"lec-sent-ko\">이 마지막 단계가 아스팔트가 부서지지 못하게 막아줍니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 기저귀 조각을 섞는 행위가 도로의 내구성을 높이는 구체적인 기능을 수행함을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">keeps the asphalt from falling apart (5형식(SVOC)): keep + O(the asphalt) + from falling apart(보어 구조)로, 목적어가 상태를 유지하거나 특정 동작을 하지 못하게 막는 구조이다.</div><div class=\"lec-gr-item\">falling apart (동명사): 전치사 from의 목적어 역할을 하며 &#39;떨어져 나가는 것&#39;이라는 행위를 나타낸다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 12 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">지금은,</span><span class=\"en\"><b>For now,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">영국만이</span><span class=\"en\"><b>only the U.K.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 아이디어를 시험하고 있습니다.</span><span class=\"en\"><b><span class=\"grammar-hl\">is testing</span> this idea.</b></span></div></div><div class=\"lec-sent-ko\">지금은, 영국만이 이 아이디어를 시험하고 있습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 현재 이 기술이 적용되는 범위가 특정 지역에 국한되어 있다는 사실을 알리며 글의 범위를 좁힙니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is testing (현재진행): be동사(is)+-ing(testing) 구조로, 현재 진행 중인 동작을 나타낸다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 13 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만</span><span class=\"en\"><b>But</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">누가 아나요?</span><span class=\"en\"><b>who knows?</b></span></div></div><div class=\"lec-sent-ko\">하지만 누가 아나요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 기술의 미래 확장 가능성을 제시하며, 환경을 위한 이 창의적인 시도가 긍정적인 변화를 가져올 것이라는 희망 섞인 전망으로 글을 맺습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">might spread 조동사 표현: 가능성을 나타내는 조동사 might와 동사원형 spread가 결합된 형태이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 14 / 14</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것은</span><span class=\"en\"><b><span class=\"grammar-hl\">It</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">전 세계로 퍼질지도 모릅니다</span><span class=\"en\"><b><span class=\"grammar-hl\">might spread to the whole</span> world</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">언젠가</span><span class=\"en\"><b>one day!</b></span></div></div><div class=\"lec-sent-ko\">언젠가 이것은 전 세계로 퍼질지도 모릅니다!</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It might spread to the whole 기본문장 구조/핵심 표현을 1개 이상 확인하세요.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">spread</td><td class=\"m\">퍼지다, 확산되다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>영국 웨일스에서는 매년 발생하는 엄청난 양의 기저귀 쓰레기를 줄이기 위해 이를 도로 포장 재료로 사용한다.</li><li>기저귀를 잘게 자르고 세척한 뒤 역청과 섞으면 아스팔트의 내구성을 높이는 역할을 한다.</li><li>현재는 영국에서만 시행 중이지만, 앞으로 전 세계적인 환경 해결책으로 확산될 가능성이 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Wales is tackling the environmental crisis of discarded diapers by processing them into addi
