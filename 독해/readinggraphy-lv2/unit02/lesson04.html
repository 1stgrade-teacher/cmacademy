</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}

    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}

lecturePlayer(document.getElementById("app"),{"brand":"청명학원 영어과","title":"리딩그라피2 리딩그라피레벨2 4번","audioDir":"audio","preview":false,"count":48,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.400em\">리딩그라피레벨2\u003cbr>4번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩그라피2\u003c/div>\u003ch1>The Birth of the Waffle Shoe: Bill Bowerman’s Innovation\u003c/h1>\u003ch2>와플 신발의 탄생: Bill Bowerman의 혁신\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>코치 Bill Bowerman이 아내의 \u003cb class=\"key\">와플 \u003c/b>\u003cb class=\"key\">팬\u003c/b> 무늬에서 영감을 얻어 달리기 선수들을 위한 혁신적인 \u003cb class=\"key\">와플 \u003c/b>\u003cb class=\"key\">신발\u003c/b>을 발명한 과정을 다루고 있습니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Creative inspiration can lead to practical inventions that revolutionize sports equipment.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 세계적인 스포츠 브랜드의 탄생 비화가 담긴 흥미로운 이야기를 함께 읽어볼 거예요. 이번 지문은 Bill Bowerman이라는 코치가 아내의 와플 팬을 보고 혁신적인 와플 신발을 발명하게 된 과정을 담고 있습니다. 창의적인 영감이 어떻게 위대한 발명으로 이어지는지 그 요지를 파악하며 들어보세요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">Bill Bowerman은 세계적인 스포츠 브랜드 \u003cb class=\"key\">나이키(Nike)\u003c/b>의 공동 창업자 중 한 명입니다. 그는 달리기 선수의 성능을 향상시키기 위해 끊임없이 \u003cb class=\"key\">신발 \u003c/b>\u003cb class=\"key\">밑창(Outsole)\u003c/b>을 연구했던 집요한 코치였습니다. 당시 육상 트랙은 주로 흙이나 모래였는데, 선수들이 미끄러지지 않도록 \u003cb class=\"key\">접지력(Traction)\u003c/b>을 높이는 것이 큰 과제였죠. 마치 미끄러운 바닥에서 안 미끄러지는 운동화를 고르는 \u003cb class=\"key\">일상적인 \u003c/b>\u003cb class=\"key\">고민\u003c/b>이 혁신의 시작이 된 셈입니다. 이러한 \u003cb class=\"key\">아이디어의 \u003c/b>\u003cb class=\"key\">전환\u003c/b>이 오늘날의 스포츠웨어 산업을 뒤바꾼 중요한 계기가 되었습니다.\u003c/div>","segs":[{"n":2,"text":"Bill Bowerman은 사실 나이키의 공동 창업자이기도 합니다. 당시 육상 코치였던 그는 선수들이 미끄러운 트랙에서 더 잘 달릴 수 있도록 접지력을 높이는 신발 밑창을 만드는 데 집착했죠. 여러분도 미끄러운 바닥에서 안 미끄러지는 운동화를 고르려고 고민해 본 적이 있을 텐데, 그런 일상적인 고민이 바로 이 혁신의 시작이었습니다. 신발 밑창을 뜻하는 outsole에 대한 그의 연구는 스포츠 역사에 큰 획을 그었답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>도입\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>더 나은 신발을 만들고 싶어 했던 코치 Bill Bowerman의 \u003cb class=\"key\">열정\u003c/b>과 신발을 \u003cb class=\"key\">분해(take \u003c/b>\u003cb class=\"key\">apart)\u003c/b>해서 개선하려던 습관을 소개합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>실험\u003csmall>근거 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>친구 Phil Knight를 대상으로 한 \u003cb class=\"key\">성능 \u003c/b>\u003cb class=\"key\">테스트\u003c/b>를 통해 더 빨리 달리게 돕는 신발의 \u003cb class=\"key\">효율성\u003c/b>을 판단합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>영감\u003csmall>전환 · 문장 6–9\u003c/small>\u003c/h4>\u003cp>아내의 \u003cb class=\"key\">와플 \u003c/b>\u003cb class=\"key\">팬\u003c/b> 패턴에서 독창적인 영감을 얻어 와플 모양의 \u003cb class=\"key\">신발 \u003c/b>\u003cb class=\"key\">밑창\u003c/b>을 제작하기로 결심합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>성공\u003csmall>결론 · 문장 10–12\u003c/small>\u003c/h4>\u003cp>시행착오 끝에 \u003cb class=\"key\">성공\u003c/b>하여 선수들의 속도를 높였으며, 이 디자인이 \u003cb class=\"key\">오늘날\u003c/b>까지 사용됨을 보여줍니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 코치의 열정적인 연구부터 우연한 발견, 그리고 마침내 거둔 성공까지 시간의 흐름에 따라 전개됩니다.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서는 더 좋은 신발을 만들고 싶어 했던 Bill Bowerman 코치를 소개해요. 그는 항상 신발을 개선하기 위해 take apart, 즉 분해하는 습관이 있을 정도로 열정적이었죠.","hl":"f0"},{"n":5,"text":"세 번째부터 다섯 번째 문장에서는 그의 친구인 Phil Knight가 등장합니다. 달리기가 빠르지 않았던 친구를 대상으로 신발 성능 테스트를 진행하며, 그를 더 빨리 달리게 돕는 것이 좋은 신발의 기준이 되었어요.","hl":"f1"},{"n":6,"text":"여섯 번째부터 아홉 번째 문장에서 결정적인 전환점이 생깁니다. 어느 날 아침을 먹다가 아내의 waffle iron, 즉 와플 팬 무늬를 보고 영감을 얻어 와플 모양의 신발 밑창을 만들기로 결심한 것이죠.","hl":"f2"},{"n":7,"text":"마지막 열 번째부터 열두 번째 문장에서는 성공의 결실을 보여줍니다. 처음에는 잘 안됐지만 계속 노력한 끝에 성공했고, 이 디자인이 오늘날까지도 널리 쓰이게 되었다는 결론으로 마무리됩니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">인과 및 시간순\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 11번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">Bill Bowerman이 신발을 개발하게 된 배경부터 \u003cb class=\"key\">와플 \u003c/b>\u003cb class=\"key\">팬\u003c/b>에서 얻은 영감, 그리고 결과적으로 \u003cb class=\"key\">성공\u003c/b>하여 현대까지 이어지는 과정을 \u003cb class=\"key\">시간의 \u003c/b>\u003cb class=\"key\">흐름\u003c/b>에 따라 설명합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>So (2)\u003c/b>\u003cspan>원인에 따른 결과 연결\u003c/span>\u003cb>One day (6)\u003c/b>\u003cspan>이야기의 결정적인 전환점\u003c/span>\u003cb>At first (10)\u003c/b>\u003cspan>초기 상황과 이후 변화 대조\u003c/span>\u003cb>finally (10)\u003c/b>\u003cspan>오랜 노력의 결실\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">better shoes\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">his new shoe ideas\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">shoe bottom that looked like a waffle\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">The new waffle shoes\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">this design\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 지문은 Bill Bowerman이 아이디어를 얻고 신발을 완성하기까지의 과정을 보여주는 전형적인 인과 관계와 시간순 구성입니다. 글의 마지막 부분에서 이 발명이 가져온 결과와 현재의 영향력을 강조하는 미괄식 구조를 취하고 있어요.","hl":"ty"},{"n":9,"text":"두 번째 문장의 So는 그가 가진 열정 때문에 신발을 분해하게 되었다는 인과 관계를 보여줍니다. 여섯 번째 문장의 One day는 평범한 일상에서 아이디어를 얻게 된 전환점을 나타내며, 열 번째 문장의 finally는 수많은 시도 끝에 얻은 값진 결말을 강조하는 핵심 신호어예요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb> u003cb>work well\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>잘 작동하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>keep trying\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>계속 노력하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>finally\u003c/b>\u003cem>부사\u003c/em>\u003cspan>마침내\u003c/span>\u003c/div>\u003cdiv>\u003cb>succeed\u003c/b>\u003cem>동사\u003c/em>\u003cspan>성공하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>design\u003c/b>\u003cem>명사\u003c/em>\u003cspan>디자인, 설계\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"여기서 take apart는 기계나 물건을 분해한다는 뜻으로 쓰였고, notice는 무언가를 유심히 보다가 발견한다는 뉘앙스를 가집니다. shoe bottom은 우리가 흔히 말하는 신발 밑창을 가리키는 표현이니 잘 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">improve\u003c/b>\u003cspan class=\"m\">개선하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">enhance\u003c/span>\u003cspan class=\"s\">better\u003c/span>\u003cspan class=\"s\">refine\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">worsen\u003c/span>\u003cspan class=\"a\">deteriorate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">notice\u003c/b>\u003cspan class=\"m\">발견하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">observe\u003c/span>\u003cspan class=\"s\">spot\u003c/span>\u003cspan class=\"s\">perceive\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003cspan class=\"a\">overlook\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">succeed\u003c/b>\u003cspan class=\"m\">성공하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">triumph\u003c/span>\u003cspan class=\"s\">flourish\u003c/span>\u003cspan class=\"s\">prosper\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">fail\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">special\u003c/b>\u003cspan class=\"m\">특별한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">unique\u003c/span>\u003cspan class span class=\"tgt\">considered\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">좋은 신발로.\u003c/span>\u003cspan class=\"en\">good ones.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그래서 어떤 신발이라도 그를 더 빨리 달리게 도울 수 있다면, 그것은 좋은 신발로 여겨졌다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 신발의 \u003cb class=\"key\">성능 \u003c/b>\u003cb class=\"key\">평가 \u003c/b>\u003cb class=\"key\">기준\u003c/b>을 설명하는 문장입니다. 평범한 러너인 Phil의 기록이 단축되면 그 신발은 \u003cb class=\"key\">성공작\u003c/b>으로 간주되었습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">5형식 준사역동사 구문\u003c/span> : help [동사] + him [목적어] + run [목적격보어/동사원형] : \"그가 달리는 것을 돕다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : be [과거형] + considered [과거분사] : \"여겨졌다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"So, 그래서. if any shoes, 만약 어떤 신발이라도. could help him run faster, 그를 더 빨리 달리게 도울 수 있다면. they were considered, 그것들은 여겨졌다. good ones, 좋은 신발로.. 이 문장 전체를 해석하면, 그래서 어떤 신발이라도 그를 더 빨리 달리게 도울 수 있다면, 그것은 좋은 신발로 여겨졌다.","hl":"m"},{"n":25,"text":"Phil이 평범한 러너였기에 그가 빨라지면 신발 성능이 확실히 입증된다는 논리예요. 신발의 성공 여부를 결정하는 명확한 기준을 말하고 있죠.","hl":"mn"},{"n":26,"text":"첫 번째 포인트는 help him run 부분입니다. help 뒤에 목적어 him과 동사원형 run이 오는 준사역동사 구조예요. 두 번째는 were considered라는 수동태입니다. 신발은 스스로 생각할 수 없고 사람들에 의해 평가받는 대상이기 때문입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어느 날,\u003c/span>\u003cspan class=\"en\">One day,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Bill이 아침을 먹는 중에,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">while \u003c/span>\u003cspan class=\"tgt\">Bill \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">having\u003c/span> breakfast,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 발견했다\u003c/span>\u003cspan class=\"en\">he noticed\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아내의 와플 팬을.\u003c/span>\u003cspan class=\"en\">his wife's waffle iron.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어느 날, Bill이 아침을 먹는 중에 그는 아내의 와플 팬을 발견했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 혁신적인 아이디어가 탄생하는 \u003cb class=\"key\">우연한 \u003c/b>\u003cb class=\"key\">순간\u003c/b>을 묘사합니다. 평범한 식사 시간에 마주한 \u003cb class=\"key\">와플 \u003c/b>\u003cb class=\"key\">팬\u003c/b>의 무늬가 신발 밑창의 단서가 되었습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거진행형\u003c/span> : while [접속사] + be [과거형] + V-ing [현재분사] : \"먹고 있는 동안에\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"One day, 어느 날. while Bill was having breakfast, Bill이 아침을 먹는 중에. he noticed, 그는 발견했다. his wife's waffle iron, 아내의 와플 팬을.. 이 문장 전체를 해석하면, 어느 날, Bill이 아침을 먹는 중에 그는 아내의 와플 팬을 발견했다.","hl":"m"},{"n":28,"text":"아주 일상적인 순간에 위대한 아이디어가 떠오르는 장면이에요. 와플 팬의 독특한 무늬에서 영감을 얻은 결정적인 계기를 설명하는 아주 중요한 문장입니다.","hl":"mn"},{"n":29,"text":"문법적으로는 접속사 while 뒤에 과거진행형인 was having이 쓰인 것에 주목하세요. 아침을 먹는 동작이 진행 중인 상태에서 새로운 발견을 했다는 것을 생동감 있게 보여줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 팬은\u003c/span>\u003cspan class=\"en\">The iron\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가지고 있었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">had\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">특별한 무늬를.\u003c/span>\u003cspan class=\"en\">a special pattern.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 팬은 특별한 무늬를 가지고 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 빌이 와플 팬에서 발견한 외형적 \u003cb class=\"key\">특징\u003c/b>을 설명합니다. 이 독특한 \u003cb class=\"key\">무늬\u003c/b>가 나중에 혁신적인 신발 디자인의 영감이 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거시제 동사\u003c/span> : 주어 + [had (have의 과거형)] + 목적어 : \"가지고 있었다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"The iron, 그 팬은. had, 가지고 있었다. a special pattern, 특별한 무늬를.. 이 문장 전체를 해석하면, 그 팬은 특별한 무늬를 가지고 있었다.","hl":"m"},{"n":31,"text":"빌이 아내의 와플 팬에서 아주 독특한 무늬를 발견하는 장면이에요. 이 무늬가 나중에 유명한 신발 디자인의 핵심적인 특징이 된답니다.","hl":"mn"},{"n":32,"text":"여기서는 동사 have의 과거형인 had가 쓰였어요. 이야기 전체가 과거의 일을 회상하는 내용이라서 과거형 동사를 사용한 점에 주의하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은\u003c/span>\u003cspan class=\"en\">It\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그에게 주었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">gave \u003c/span>\u003cspan class=\"tgt\">him \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">좋은 아이디어를!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">great \u003c/span>\u003cspan class=\"tgt\">idea\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 그에게 좋은 아이디어를 주었다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 와플 팬의 무늬가 빌에게 새로운 \u003cb class=\"key\">영감\u003c/b>을 주는 장면입니다. 글의 흐름상 문제 해결의 \u003cb class=\"key\">실마리\u003c/b>를 찾는 중요한 지점입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">4형식 수여동사 구문\u003c/span> : gave [동사] + him [간접목적어] + a great idea [직접목적어] : \"그에게 좋은 아이디어를 주었다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"It, 그것은. gave him, 그에게 주었다. a great idea!, 좋은 아이디어를!. 이 문장 전체를 해석하면, 그것은 그에게 좋은 아이디어를 주었다!","hl":"m"},{"n":34,"text":"와플 팬을 보고 빌의 머릿속에 번뜩이는 영감이 떠올랐어요. 이 문장은 이야기의 전개에서 문제 해결의 실마리를 찾는 아주 중요한 전환점이에요.","hl":"mn"},{"n":35,"text":"이 문장은 동사 gave 뒤에 목적어가 두 개 나오는 사형식 구조예요. 그에게라는 간접 목적어와 좋은 아이디어를이라는 직접 목적어가 차례대로 나온 것을 확인하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 결심했다\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">decided \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">신발 밑창을 만들기로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">make\u003c/span> a shoe bottom\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~처럼 생긴\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">looked \u003c/span>\u003cspan class=\"tgt\">like\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">와플.\u003c/span>\u003cspan class=\"en\">a waffle.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 와플처럼 생긴 신발 밑창을 만들기로 결심했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 관찰한 것을 실제 제품에 적용하려는 빌의 \u003cb class=\"key\">결심\u003c/b>을 나타냅니다. 신발의 \u003cb class=\"key\">접지력\u003c/b>을 높이기 위해 와플 모양을 선택했음을 구체화합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : decide [타동사] + [to make (to부정사구)] : \"만들기로 결심했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : a shoe bottom [선행사] + [that (주격 관계대명사)] + looked like [동사] : \"~처럼 생긴 신발 밑창\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"He decided, 그는 결심했다. to make a shoe bottom, 신발 밑창을 만들기로. that looked like, ~처럼 생긴. a waffle, 와플.. 이 문장 전체를 해석하면, 그는 와플처럼 생긴 신발 밑창을 만들기로 결심했다.","hl":"m"},{"n":37,"text":"빌은 이제 자신이 본 와플 무늬를 신발 밑창에 직접 적용해 보기로 마음을 먹어요. 신발의 성능을 높이기 위해 구체적인 계획을 세우는 결심의 단계라고 볼 수 있죠.","hl":"mn"},{"n":38,"text":"두 가지 포인트를 짚어볼게요. 첫 번째로 decided는 뒤에 to make처럼 to부정사를 목적어로 데려오는 동사예요. 두 번째로 that looked like 부분은 앞에 있는 신발 밑창을 꾸며주는 주격 관계대명사 절입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">처음에는,\u003c/span>\u003cspan class=\"en\">At first,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 잘되지 않았지만,\u003c/span>\u003cspan class=\"en\">it didn't work well,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 계속 노력했고\u003c/span>\u003cspan class=\"en\">but he \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">kept \u003c/span>\u003cspan class=\"tgt\">trying\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마침내 성공했다.\u003c/span>\u003cspan class=\"en\">and finally succeeded.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">처음에는 잘되지 않았지만, 그는 계속 노력했고 마침내 성공했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 신발 밑창 제작의 \u003cb class=\"key\">초기 \u003c/b>\u003cb class=\"key\">실패\u003c/b>에도 굴하지 않고 끈기 있게 도전하여 \u003cb class=\"key\">성공\u003c/b>을 거두었다는 내용입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">keep + 동명사 (동작의 지속)\u003c/span> : keep [타동사] + [trying (동명사/목적어)] : \"계속 노력했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">과거동사의 병렬 구조\u003c/span> : [과거동사 1 (kept)] + and + [과거동사 2 (succeeded)] : \"노력했고 성공했다\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"At first, 처음에는. it didn't work well, 그것은 잘되지 않았지만. but he kept trying, 그는 계속 노력했고. and finally succeeded, 마침내 성공했다.. 이 문장 전체를 해석하면, 처음에는 잘되지 않았지만, 그는 계속 노력했고 마침내 성공했다.","hl":"m"},{"n":40,"text":"와플 모양 신발 밑창을 처음 만들었을 때는 생각처럼 잘 풀리지 않았어요. 하지만 빌은 포기하지 않고 끈기 있게 시도해서 결국 발명에 성공했다는 흐름입니다.","hl":"mn"},{"n":41,"text":"두 가지 포인트를 볼게요. 첫 번째로 kept trying은 keep 뒤에 동명사가 와서 계속 노력했다는 지속의 의미를 전달합니다. 두 번째로 kept와 succeeded는 접속사 and로 연결된 병렬 구조로, 둘 다 과거 시제로 맞춰주어야 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새로운 와플 신발은\u003c/span>\u003cspan class=\"en\">The new waffle shoes\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">달리기 선수들을 만들었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">made \u003c/span>\u003cspan class=\"tgt\">runners \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">훨씬 더 빠르게.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">much \u003c/span>\u003cspan class=\"tgt\">faster\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">새로운 와플 신발은 달리기 선수들을 훨씬 더 빠르게 만들었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 발명된 신발이 선수들의 \u003cb class=\"key\">기량 \u003c/b>\u003cb class=\"key\">향상\u003c/b>에 실질적인 도움을 주었음을 강조하며 발명의 \u003cb class=\"key\">효용성\u003c/b>을 입증합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">5형식 문장 (사역의 의미)\u003c/span> : made [동사] + runners [목적어] + much faster [목적격 보어/형용사 비교급] : \"선수들을 훨씬 더 빠르게 만들었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">비교급 강조 부사\u003c/span> : much [부사] + faster [비교급] : \"훨씬 더 빠른\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"The new waffle shoes, 새로운 와플 신발은. made runners, 달리기 선수들을 만들었다. much faster, 훨씬 더 빠르게.. 이 문장 전체를 해석하면, 새로운 와플 신발은 달리기 선수들을 훨씬 더 빠르게 만들었다.","hl":"m"},{"n":43,"text":"빌이 만든 새로운 신발이 실제로 달리기 성능을 크게 높여주었다는 결과예요. 신발의 독특한 무늬가 선수들에게 큰 도움이 된 거죠.","hl":"mn"},{"n":44,"text":"첫 번째로 make는 목적어 뒤에 형용사를 보어로 써서 선수들의 상태가 어떻게 변했는지 설명하는 오형식 문장을 만듭니다. 두 번째로 faster라는 비교급 앞에 쓰인 much는 훨씬이라는 뜻으로 더 빠른 정도를 강조하는 역할을 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오늘날에도,\u003c/span>\u003cspan class=\"en\">Even today,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 신발들이\u003c/span>\u003cspan class=\"en\">many \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">shoes \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 디자인을 사용한다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">use\u003c/span> this design.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">오늘날에도, 많은 신발들이 이 디자인을 사용한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 과거의 발명이 단발성으로 끝나지 않고 \u003cb class=\"key\">현재\u003c/b>까지 이어져 현대 신발 디자인의 \u003cb class=\"key\">표준\u003c/b>이 되었음을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주어와 동사의 수 일치\u003c/span> : many shoes [복수 주어] + use [복수 동사] : \"신발들이 사용한다\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"Even today, 오늘날에도. many shoes, 많은 신발들이. use this design, 이 디자인을 사용한다.. 이 문장 전체를 해석하면, 오늘날에도, 많은 신발들이 이 디자인을 사용한다.","hl":"m"},{"n":46,"text":"빌의 와플 디자인이 단지 과거의 유물이 아니라는 뜻이에요. 지금까지도 수많은 운동화에 이 방식이 쓰이고 있을 만큼 영향력이 크다는 거죠.","hl":"mn"},{"n":47,"text":"간단하지만 중요한 수 일치를 확인해 보세요. 주어가 many shoes로 복수이기 때문에 동사 use에 s를 붙이지 않고 그대로 썼습니다. 현재 시제를 사용해 지금도 반복되는 사실임을 나타내고 있네요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>미국의 대학교 코치 Bill Bowerman은 더 나은 \u003cb class=\"key\">달리기 \u003c/b>\u003cb class=\"key\">신발\u003c/b>을 만들기 위해 항상 노력했습니다.\u003c/li>\u003cli>그는 아내의 \u003cb class=\"key\">와플 \u003c/b>\u003cb class=\"key\">팬\u003c/b> 무늬에서 영감을 받아 새로운 신발 밑창 디자인을 고안했습니다.\u003c/li>\u003cli>여러 번의 실패 끝에 \u003cb class=\"key\">와플 \u003c/b>\u003cb class=\"key\">신발\u003c/b> 제작에 성공하여 선수들의 속도를 높여주었습니다.\u003c/li>\u003cli>이 혁신적인 디자인은 \u003cb class=\"key\">오늘날\u003c/b>까지도 수많은 신발에 널리 사용되고 있습니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Creative inspiration can lead to practical inventions that revolutionize sports equipment.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">코치 Bill Bowerman이 아내의 \u003cb class=\"key\">와플 \u003c/b>\u003cb class=\"key\">팬\u003c/b> 무늬에서 영감을 얻어 달리기 선수들을 위한 혁신적인 \u003cb class=\"key\">와플 \u003c/b>\u003cb class=\"key\">신발\u003c/b>을 발명한 과정을 다루고 있습니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":48,"text":"와플 팬이라는 일상적인 사물이 훌륭한 신발 디자인으로 바뀐 과정이 정말 흥미롭지 않나요? 포기하지 않고 계속 노력했던 Bill의 태도가 오늘날의 편한 운동화를 만든 밑거름이 되었습니다. 오늘 배운 와플 신발의 탄생 이야기를 잘 정리해 보시기 바랍니다. 수고하셨어요!","hl":null}]}]});</script></body></html>
