</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}

    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}

lecturePlayer(document.getElementById("app"),{"brand":"청명학원 영어과","title":"리딩그라피2 리딩그라피레벨2 5번","audioDir":"audio","preview":false,"count":48,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.400em\">리딩그라피레벨2\u003cbr>5번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">리딩그라피2\u003c/div>\u003ch1>What is Greenwashing and How to Avoid It\u003c/h1>\u003ch2>그린워싱이란 무엇이며 어떻게 피할 수 있는가\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>기업들이 제품 판매를 늘리기 위해 실제보다 친환경적인 것처럼 꾸미는 \u003cb class=\"key\">그린워싱\u003c/b>의 개념을 소개하고, 소비자가 정보를 꼼꼼히 \u003cb class=\"key\">조사\u003c/b>하여 속지 않아야 함을 강조합니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Consumers need to be smart and research products to avoid being deceived by greenwashing and to choose truly eco-friendly items.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"여러분 안녕하세요. 오늘은 리딩그라피 레벨 이의 다섯 번째 지문을 함께 공부해보겠습니다. 이 글은 기업의 눈속임인 greenwashing에 대해 다루고 있는데요. 진정으로 환경을 생각하는 현명한 소비자가 되기 위해 우리가 무엇을 알아야 하는지 그 요지를 파악하는 것이 핵심입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">그린워싱(Greenwashing)은 '초록색(Green)'과 '세탁(Whitewashing)'의 합성어로, 기업이 실제로는 환경에 해로운 활동을 하면서도 마치 친환경 경영을 하는 것처럼 \u003cb class=\"key\">이미지 \u003c/b>\u003cb class=\"key\">세탁\u003c/b>을 하는 것을 말합니다. 예를 들어, 오염 물질을 배출하는 공장이 나무를 심는 광고만 내세우는 것이 대표적인 \u003cb class=\"key\">위장 \u003c/b>\u003cb class=\"key\">환경주의\u003c/b>입니다. 이는 마치 겉면만 건강해 보이는 포장지로 감싼 불량 식품과 같은 \u003cb class=\"key\">마케팅 \u003c/b>\u003cb class=\"key\">전략\u003c/b>이라 할 수 있습니다. 고등학생 수준에서는 이러한 현상이 지속 가능한 소비(Sustainable Consumption)를 방해한다는 점을 인식하고, 기업의 광고 문구를 비판적으로 수용하는 태도가 필요합니다.\u003c/div>","segs":[{"n":2,"text":"greenwashing이라는 용어는 초록색과 세탁의 합성어로 기업들이 마치 친환경적인 것처럼 이미지 세탁을 하는 것을 뜻해요. 겉으로는 환경을 보호하는 척하지만 실제로는 제품 판매에만 열을 올리는 위장 환경주의라고 볼 수 있죠. 마치 건강에 좋지 않은 과자를 유기농 포장지에 담아 파는 것과 같은 마케팅 전략입니다. 우리는 이러한 속임수에 넘어가지 않기 위해 지속 가능한 소비를 지향하는 태도를 가져야 합니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>그린워싱의 정의\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>\u003cb class=\"key\">그린워싱\u003c/b>이라는 용어를 소개하고, 기업들이 제품을 더 팔기 위해 친환경적인 척하는 \u003cb class=\"key\">기만적 \u003c/b>\u003cb class=\"key\">목적\u003c/b>을 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>산업별 그린워싱 사례\u003csmall>예시 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>자동차 회사와 패션 회사를 예로 들어, 말로는 환경에 좋다고 하지만 실제로는 그렇지 않을 수 있는 \u003cb class=\"key\">구체적 \u003c/b>\u003cb class=\"key\">사례\u003c/b>를 제시합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>그린워싱 구별법\u003csmall>해결책 · 문장 6–10\u003c/small>\u003c/h4>\u003cp>그린워싱을 구별하기 위해 라벨과 제품 설명을 꼼꼼히 읽고, \u003cb class=\"key\">온라인 \u003c/b>\u003cb class=\"key\">조사\u003c/b>를 활용하는 실질적인 방법을 제안합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>현명한 소비자 되기\u003csmall>결론 · 문장 11–12\u003c/small>\u003c/h4>\u003cp>환경에 실제로 도움이 되는 제품을 선택할 줄 아는 \u003cb class=\"key\">현명한 \u003c/b>\u003cb class=\"key\">쇼핑객\u003c/b>이 되어야 한다는 글의 핵심 주장을 강조합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 greenwashing의 개념 설명부터 시작해서 구체적인 사례와 해결책을 순서대로 제시하고 있어요.","hl":null},{"n":4,"text":"첫 번째 단계인 도입부에서는 greenwashing의 정의를 다룹니다. 첫 번째부터 세 번째 문장까지를 보면 기업들이 더 많은 제품을 팔기 위해 eco-friendly한 척할 때 사용하는 단어라고 설명하며 이들의 기만적인 목적을 명시하고 있죠.","hl":"f0"},{"n":5,"text":"두 번째 단계는 자동차와 패션 회사의 예시를 보여줍니다. 네 번째와 다섯 번째 문장에서 오염을 적게 시킨다거나 지구에 좋다고 말하지만 그것이 사실이 아닐 수도 있다는 구체적인 사례를 통해 경각심을 일깨워줍니다.","hl":"f1"},{"n":6,"text":"세 번째 단계는 우리가 어떻게 대처해야 할지 해결책을 제시해요. 여섯 번째부터 열 번째 문장에서는 라벨을 확인하고 제품 설명을 읽거나 온라인 조사를 통해 회사의 진실성을 파악하는 구체적인 확인 방법들을 알려줍니다.","hl":"f2"},{"n":7,"text":"마지막 단계는 결론으로 열한 번째와 열두 번째 문장에서 우리가 환경을 위해 실제로 유익한 것을 선택할 줄 아는 현명한 쇼핑객이 되어야 한다는 비판적 태도를 강조하며 마무리됩니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 11번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">기업의 \u003cb class=\"key\">기만적 \u003c/b>\u003cb class=\"key\">행위\u003c/b>인 그린워싱을 문제로 제기한 후, 이를 해결하기 위해 소비자가 취해야 할 \u003cb class=\"key\">확인 \u003c/b>\u003cb class=\"key\">방법\u003c/b>들을 제시합니다. 마지막에 소비자의 \u003cb class=\"key\">비판적 \u003c/b>\u003cb class=\"key\">태도\u003c/b>를 강조하며 글을 맺는 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>For example (4)\u003c/b>\u003cspan>예시 제시\u003c/span>\u003cb>Similarly (5)\u003c/b>\u003cspan>유사 사례 추가\u003c/span>\u003cb>But (7)\u003c/b>\u003cspan>해결책 제시로의 전환\u003c/span>\u003cb>also (10)\u003c/b>\u003cspan>추가적 방법 나열\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">the word 'greenwashing'\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">pretend to be eco-friendly\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">don't pollute much\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">good for the Earth\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">really helping the environment\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">actually good for the environment\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Greenwashing\u003c/th>\u003cth>Actually Eco-friendly\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Pretending for sales\u003c/td>\u003ctd>Really helping the environment\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 greenwashing이라는 문제점을 제기하고 이를 해결하기 위한 방법을 알려주는 문제 해결 구조로 되어 있습니다. 글의 마지막 부분에서 필자의 최종적인 주장이 드러나는 전형적인 미괄식 구성을 취하고 있죠.","hl":"ty"},{"n":9,"text":"문장 중간에 나오는 For example은 구체적인 사례를 들겠다는 신호이고 Similarly는 앞선 내용과 비슷한 사례를 하나 더 추가할 때 씁니다. 또한 일곱 번째 문장의 But은 분위기를 전환하며 우리가 알아낼 방법이 있다는 해결책의 시작을 알리는 중요한 역할을 하죠.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>greenwashing\u003c/b>\u003cem>명사\u003c/em>\u003cspan>그린워싱(위장 환경주의)\u003c/span>\u003c/div>\u003cdiv>\u003cb>sound like\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~처럼 들리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>actually\u003c/b>\u003cem>부사\u003c/em>\u003cspan>실제로\u003c/span>\u003c/div>\u003cdiv>\u003cb>pretend\u003c/b>\u003cem>동사\u003c/em>\u003cspan>~인 척하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>eco-friendly\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>친환경적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>sell\u003c/b>\u003cem>동사\u003c/em>\u003cspan>팔다\u003c/span>\u003c/div>\u003cdiv>\u003cb>product\u003c/b>\u003cem>명사\u003c/em>\u003cspan>제품\u003c/span>\u003c/div>\u003cdiv>\u003cb>for example\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>예를 들어\u003c/span>\u003c/div>\u003cdiv>\u003cb>company\u003c/b>\u003cem>명사\u003c/em>\u003cspan>회사\u003c/span>\u003c/div>\u003cdiv>\u003cb>pollute\u003c/b>\u003cem>동사\u003c/em>\u003cspan>오염시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>true\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>사실인\u003c/span>\u003c/div>\u003cdiv>\u003cb>similarly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>마찬가지로\u003c/span>\u003c/div>\u003cdiv>\u003cb>fashion\u003c/b>\u003cem>명사\u003c/em>\u003cspan>패션\u003c/span>\u003c/div>\u003cdiv>\u003cb>clothes\u003c/b>\u003cem>명사\u003c/em>\u003cspan>옷\u003c/span>\u003c/div>\u003cdiv>\u003cb>earth\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지구\u003c/span>\u003c/div>\u003cdiv>\u003cb>tell\u003c/b>\u003cem>동사\u003c/em>\u003cspan>구별하다, 말하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>environment\u003c/b>\u003cem>명사\u003c/em>\u003cspan>환경\u003c/span>\u003c/div>\u003cdiv>\u003cb>find out\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>알아내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>label\u003c/b>\u003cem>명사\u003c/em>\u003cspan>라 것은 좋은 단어처럼 들릴지도 모르지만, 실제로는 그렇지 않아요.","hl":"m"},{"n":16,"text":"이 문장은 그린워싱이라는 용어가 주는 긍정적인 느낌과 실제 의미 사이의 반전을 강조하고 있어요. 겉만 보고 속지 말라는 경고가 담겨 있죠.","hl":"mn"},{"n":17,"text":"첫 번째 포인트는 감각동사 sound예요. 뒤에 명사가 올 때는 반드시 전치사 like를 붙여야 한다는 점을 기억하세요. 두 번째로 마지막 not 뒤에는 a nice word라는 표현이 생략되어 있는데, 반복을 피하기 위해 줄여 쓴 형태랍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 이 단어를 사용해요\u003c/span>\u003cspan class=\"en\">We use this word\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기업들이 ~인 척할 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">when\u003c/span> companies \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">pretend \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">친환경적인\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be\u003c/span> eco-friendly\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 많은 제품을 팔기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">sell\u003c/span> more products.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 기업들이 더 많은 제품을 팔기 위해 친환경적인 척할 때 이 단어를 사용해요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 그린워싱의 정확한 \u003cb class=\"key\">정의\u003c/b>를 설명하는 문장으로, 기업의 이기적인 \u003cb class=\"key\">마케팅 \u003c/b>\u003cb class=\"key\">목적\u003c/b>을 드러냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간의 접속사\u003c/span> : when + [주어(companies)] + [동사(pretend)] : \"~할 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사를 목적어로 취하는 동사\u003c/span> : pretend + [to부정사(to be)] : \"친환경적인 척하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : to + [동사원형(sell)] : \"팔기 위해\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"We use this word, 우리는 이 단어를 사용해요. when companies pretend, 기업들이 ~인 척할 때. to be eco-friendly, 친환경적인. to sell more products, 더 많은 제품을 팔기 위해. 이 문장 전체를 해석하면, 우리는 기업들이 더 많은 제품을 팔기 위해 친환경적인 척할 때 이 단어를 사용해요.","hl":"m"},{"n":19,"text":"그린워싱의 정확한 정의를 내리는 문장이에요. 기업들이 물건을 더 많이 팔려고 착한 척하는 마케팅 전략을 비판적으로 설명하고 있죠.","hl":"mn"},{"n":20,"text":"첫 번째로 특정한 때를 나타내는 접속사 when이 이끄는 절을 확인하세요. 두 번째로 pretend는 뒤에 to부정사를 목적어로 써서 어떤 행동을 하는 척하는지 나타내요. 마지막으로 to sell은 목적을 나타내는 부사적 용법으로 해석하면 완벽합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들어,\u003c/span>\u003cspan class=\"en\">For example,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 자동차 회사는\u003c/span>\u003cspan class=\"en\">a car company\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">말할지도 모르지만,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">might \u003c/span>\u003cspan class=\"tgt\">say\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 차가 오염을 많이 일으키지 않는다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">cars \u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003cspan class=\"tgt\">pollute \u003c/span>\u003cspan class=\"tgt\">much\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 사실이 아닐지도 몰라요.\u003c/span>\u003cspan class=\"en\">but it may not be true.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">예를 들어, 한 자동차 회사는 그들의 차가 오염을 많이 일으키지 않는다고 말할지도 모르지만, 그것은 사실이 아닐지도 몰라요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 언급한 \u003cb class=\"key\">그린워싱\u003c/b>의 구체적인 사례를 들어 설명하는 문장입니다. 겉으로는 친환경을 주장하지만 실제로는 \u003cb class=\"key\">거짓말\u003c/b>일 수 있음을 경고합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 might\u003c/span> : might [조동사] + say [동사원형] : \"말할지도 모른다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that\u003c/span> : say [타동사] + that [접속사] + S' + V' : \"그들의 차가 오염을 많이 일으키지 않는다는 것을\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"For example, 예를 들어. a car company, 한 자동차 회사는. might say, 말할지도 모르지만. that their cars don't pollute much, 그들의 차가 오염을 많이 일으키지 않는다고. but it may not be true, 그것은 사실이 아닐지도 몰라요.. 이 문장 전체를 해석하면, 예를 들어, 한 자동차 회사는 그들의 차가 오염을 많이 일으키지 않는다고 말할지도 모르지만, 그것은 사실이 아닐지도 몰라요.","hl":"m"},{"n":22,"text":"이 문장은 그린워싱의 구체적인 사례를 들어 설명하고 있어요. 기업들이 겉으로는 친환경을 주장하지만 실제로는 거짓말일 수도 있다는 점을 경고하는 흐름이죠.","hl":"mn"},{"n":23,"text":"어법을 보면 첫 번째로 might say가 쓰였는데, 여기서 might는 약한 추측을 나타내서 기업의 말이 사실이 아닐 수도 있음을 암시해요. 두 번째로 say의 목적어 자리에 접속사 that이 이끄는 명사절이 와서 구체적으로 어떤 내용을 말하는지 연결해 주고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마찬가지로,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Similarly\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">패션 회사들이\u003c/span>\u003cspan class=\"en\">fashion companies\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">말할지도 모르지만,\u003c/span>\u003cspan class=\"en\">might say\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 옷이 지구에 좋다고\u003c/span>\u003cspan class=\"en\">their clothes are good for the Earth,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">항상 그렇지는 않아요.\u003c/span>\u003cspan class=\"en\">but they're \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">always\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">마찬가지로, 패션 회사들이 그들의 옷이 지구에 좋다고 말할지도 모르지만, 항상 그렇지는 않아요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 자동차 산업에 이어 \u003cb class=\"key\">패션 \u003c/b>\u003cb class=\"key\">산업\u003c/b>에서도 발생하는 그린워싱 사례를 추가로 소개합니다. 모든 주장이 사실이 아닐 수 있다는 \u003cb class=\"key\">비판적 \u003c/b>\u003cb class=\"key\">시각\u003c/b>을 유지해야 함을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">연결부사\u003c/span> : Similarly, [부사] + S + V : \"마찬가지로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부분 부정\u003c/span> : not [부정어] + always [빈도부사] : \"항상 ~인 것은 아니다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Similarly, 마찬가지로. fashion companies, 패션 회사들이. might say, 말할지도 모르지만. their clothes are good for the Earth, 그들의 옷이 지구에 좋다고. but they're not always, 항상 그렇지는 않아요.. 이 문장 전체를 해석하면, 마찬가지로, 패션 회사들이 그들의 옷이 지구에 좋다고 말할지도 모르지만, 항상 그렇지는 않아요.","hl":"m"},{"n":25,"text":"앞선 자동차 사례에 이어 패션 산업에서도 비슷한 일이 일어난다는 점을 보여줘요. 소비자들이 기업의 홍보 문구에 대해 비판적 시각을 가져야 한다는 메시지를 전달하죠.","hl":"mn"},{"n":26,"text":"첫 번째 포인트인 Similarly는 마찬가지로라는 뜻으로 앞 문장과 비슷한 사례를 덧붙일 때 아주 유용한 연결어예요. 두 번째로 not always는 부분 부정이라고 하는데, 무조건 나쁘다는 게 아니라 항상 좋은 것만은 아니라는 뉘앙스를 전달합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어려울 수 있어요.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It \u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">hard \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">구별하는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">tell\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 회사가\u003c/span>\u003cspan class=\"en\">if a company\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정말로 환경을 돕고 있는지\u003c/span>\u003cspan class=\"en\">is really helping the environment\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아닌지\u003c/span>\u003cspan class=\"en\">or not.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어떤 회사가 정말로 환경을 돕고 있는지 아닌지 구별하는 것은 어려울 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 소비자가 기업의 진정성을 파악하기가 \u003cb class=\"key\">어렵다\u003c/b>는 현실적인 문제를 지적합니다. \u003cb class=\"key\">그린워싱\u003c/b>의 교묘함을 강조하며 독자의 주의를 환기시킵니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가주어·진주어 구문\u003c/span> : It [가주어] + V + 형용사 + to-v [진주어] : \"구별하는 것은 어려울 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">명사절 접속사 if\u003c/span> : tell [타동사] + if [접속사] + S' + V' + or not : \"어떤 회사가 정말로 돕고 있는지 아닌지를\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"It can be hard, 어려울 수 있어요.. to tell, 구별하는 것은. if a company, 어떤 회사가. is really helping the environment, 정말로 환경을 돕고 있는지. or not, 아닌지. 이 문장 전체를 해석하면, 어떤 회사가 정말로 환경을 돕고 있는지 아닌지 구별하는 것은 어려울 수 있어요.","hl":"m"},{"n":28,"text":"소비자가 기업의 주장이 진짜인지 가짜인지 알아내기가 참 어렵다는 점을 꼬집고 있어요. 그만큼 그린워싱이 교묘하게 이루어지고 있다는 뜻이기도 하죠.","hl":"mn"},{"n":29,"text":"이 문장은 서술형 대비가 꼭 필요한 중요한 문장이에요. 첫 번째로 가주어 It과 진주어 to tell 구문이 쓰여서 주어를 길게 쓰지 않고 뒤로 뺀 구조를 이해해야 해요. 두 번째로 tell의 목적어 자리에 접속사 if가 와서 인지 아닌지라는 뜻의 명사절을 만들고 있다는 점도 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 ~이 있어요\u003c/span>\u003cspan class=\"en\">But \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">are\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">알아낼 방법들이\u003c/span>\u003cspan class=\"en\">ways \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">find \u003c/span>\u003cspan class=\"tgt\">out\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 알아낼 방법들이 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞선 문장에서 언급된 '그린워싱'을 구별하기가 어렵다는 문제에 대해 \u003cb class=\"key\">해결책\u003c/b>이 있음을 암시합니다. 소비자가 속지 않고 진짜 정보를 \u003cb class=\"key\">구별하는 \u003c/b>\u003cb class=\"key\">방법\u003c/b>이 존재한다는 것을 알려주며 글의 흐름을 바꿉니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">There is/are 구문\u003c/span> : There are + [복수 주어 (ways)] : \"~들이 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : [명사 (ways)] + [to부정사] : \"알아낼\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"But there are, 하지만 ~이 있어요. ways to find out, 알아낼 방법들이. 이 문장 전체를 해석하면, 하지만 알아낼 방법들이 있어요.","hl":"m"},{"n":31,"text":"그린워싱을 알아내기가 어렵다고 했지만, 분명히 구별하는 방법이 있다는 해결책을 제시하는 문장이에요.","hl":"mn"},{"n":32,"text":"첫 번째로 there are 구문은 뒤에 나오는 명사가 주어인데, ways가 복수라서 are를 썼고요. 두 번째로 to find out은 앞의 명사를 꾸며주는 형용사적 용법으로 쓰였습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">라벨을 보거나\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"mk\">2\u003c/span>\ ">you \u003c/span>\u003cspan class=\"tgt\">see\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제품이 ~인지 아닌지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">if \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">product \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정말로 좋은지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">really \u003c/span>\u003cspan class=\"tgt\">good\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지구에\u003c/span>\u003cspan class=\"en\">for the Earth.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것은 제품이 정말로 지구에 좋은지 확인하는 데 도움이 될 거예요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 확인 작업을 거쳤을 때 얻을 수 있는 \u003cb class=\"key\">긍정적 \u003c/b>\u003cb class=\"key\">결과\u003c/b>를 보여줍니다. 제품의 광고가 아닌 \u003cb class=\"key\">진위 \u003c/b>\u003cb class=\"key\">여부\u003c/b>를 스스로 판단할 수 있게 된다는 의미입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">준사역동사 help\u003c/span> : help + [목적어 (you)] + [목적격 보어 (동사원형 see)] : \"당신이 확인하는 것을 돕다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명사절 접속사 if\u003c/span> : see [타동사] + [if (접속사) + 주어 + 동사 (명사절)] : \"제품이 정말로 좋은지 아닌지\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"This will help you see, 이것은 당신이 확인하도록 도울 거예요. if a product, 제품이 ~인지 아닌지. is really good, 정말로 좋은지. for the Earth, 지구에. 이 문장 전체를 해석하면, 이것은 제품이 정말로 지구에 좋은지 확인하는 데 도움이 될 거예요.","hl":"m"},{"n":37,"text":"앞에서 말한 라벨 확인하기를 실천하면, 그 제품이 지구에 진짜 좋은지 가짜인지 알 수 있게 된다는 뜻이에요.","hl":"mn"},{"n":38,"text":"첫 번째로 help는 목적격 보어 자리에 see처럼 동사원형을 쓴다는 점이 중요하고요. 두 번째로 if는 여기에서 만약이 아니라 인지 아닌지라는 뜻의 명사절을 이끌고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"l cdiv class=\"lp-box\">\u003cb>Consumers need to be smart and research products to avoid being deceived by greenwashing and to choose truly eco-friendly items.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">기업들이 제품 판매를 늘리기 위해 실제보다 친환경적인 것처럼 꾸미는 \u003cb class=\"key\">그린워싱\u003c/b>의 개념을 소개하고, 소비자가 정보를 꼼꼼히 \u003cb class=\"key\">조사\u003c/b>하여 속지 않아야 함을 강조합니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":48,"text":"오늘 배운 내용을 통해 우리가 일상에서 마주하는 광고들을 조금 더 비판적으로 바라볼 수 있게 되었나요. 기업의 화려한 광고 문구에 속지 말고 진짜 환경을 위하는 길이 무엇인지 고민하는 똑똑한 소비자가 되길 바랍니다. 다음 시간에도 유익한 지문으로 만나요. 수고하셨습니다.","hl":null}]}]});</script></body></html>
