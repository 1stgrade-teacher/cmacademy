면서도 홍보나 광고를 통해 친환경적인 이미지를 덧씌우는 것을 의미해요. 예를 들어, 카페에서 종이 빨대를 사용한다고 홍보하지만 정작 매장 내 일회용 플라스틱 컵 사용량은 전혀 줄이지 않는 경우처럼, 겉모습만 그럴듯하게 포장한 전략을 가리키죠. 우리가 이런 마케팅의 함정에 빠지지 않으려면, 제품 이면에 숨겨진 실체를 꼼꼼히 살피는 이른바 가치 소비(Value-based consumption)의 태도를 갖추는 것이 무엇보다 중요합니다. 오늘 지문을 통해 정보를 비판적으로 수용하고 똑똑하게 소비하는 힘을 길러보세요!</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01그린워싱의 개념 정의</div><ul><li>그린워싱은 기업이 수익 증대를 위해 친환경적인 것처럼 위장하는 기만적인 행위를 의미합니다.</li><li>용어의 의미: 그린워싱(greenwashing)</li><li>소비자에게 친환경적으로 보이려는 기업의 의도</li><li>핵심 키워드: 위장 환경주의(greenwashing)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02산업별 사례와 기만성</div><ul><li>자동차 및 의류 업계 등 다양한 분야에서 친환경을 가장한 허위 광고가 나타납니다.</li><li>자동차 회사의 배출량 조작 사례</li><li>의류 회사의 친환경 홍보와 실질적 차이</li><li>핵심 키워드: 환경오염(pollute), 친환경(eco-friendly)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03현명한 소비자의 확인 절차</div><ul><li>기업의 주장을 무비판적으로 수용하지 않고 구체적인 정보를 직접 확인해야 합니다.</li><li>제품 라벨(labels) 및 설명서 정독하기</li><li>온라인을 통한 기업 정보 검색</li><li>핵심 키워드: 제품 설명(product descriptions)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04결론 및 당부</div><ul><li>환경을 보호하기 위해서는 소비자가 주체적이고 스마트한 선택을 해야 합니다.</li><li>진정한 친환경 제품을 선별하는 능력의 중요성</li><li>스마트한 소비자(smart shoppers)가 되기 위한 노력</li><li>핵심 키워드: 환경(environment)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">greenwashing</td><td class=\"m\">그린워싱, 위장 환경주의</td></tr><tr><td class=\"w\">pretend to</td><td class=\"m\">~인 체하다, 가장하다</td></tr><tr><td class=\"w\">eco-friendly</td><td class=\"m\">친환경적인, 환경 친화적인</td></tr><tr><td class=\"w\">pollute</td><td class=\"m\">오염시키다, 더럽히다</td></tr><tr><td class=\"w\">similarly</td><td class=\"m\">비슷하게, 마찬가지로</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">find out</td><td class=\"m\">알아내다, 발견하다</td></tr><tr><td class=\"w\">look at</td><td class=\"m\">~을 살펴보다, ~을 보다</td></tr><tr><td class=\"w\">product description</td><td class=\"m\">제품 설명(서)</td></tr><tr><td class=\"w\">research</td><td class=\"m\">조사하다, 연구하다</td></tr><tr><td class=\"w\">be smart</td><td class=\"m\">똑똑하게 행동하다, 현명하게 처신하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여러분은 알고 있나요</span><span class=\"en\"><b><span class=\"grammar-hl\">Do you know</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">‘그린워싱’이라는 단어를?</span><span class=\"en\"><b>the word “greenwashing”?</b></span></div></div><div class=\"lec-sent-ko\">여러분은 ‘greenwashing’이라는 단어를 알고 있나요?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 도입부로서, 독자가 생소할 수 있는 개념을 질문을 통해 제시하며 독자의 흥미를 유도하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Do you know (간접의문문): 문장 전체가 의문문으로 쓰였으나, do you know 뒤에 명사절인 의문사절(the word “greenwashing”을 아는지 묻는)이 목적어로 연결되는 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">greenwashing</td><td class=\"m\">그린워싱, 위장 환경주의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 들릴지도 몰라요</span><span class=\"en\"><b><span class=\"grammar-hl\">It may sound</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">좋은 단어처럼,</span><span class=\"en\"><b><span class=\"grammar-hl\">like a nice word</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 실제로는 그렇지 않아요.</span><span class=\"en\"><b>but it’s actually not.</b></span></div></div><div class=\"lec-sent-ko\">그것은 좋은 단어처럼 들릴지도 모르지만, 실제로는 그렇지 않아요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 단어에 대해 긍정적인 첫인상과는 달리 부정적인 실체가 있음을 밝히며, 그린워싱의 본질을 파헤칠 것임을 예고합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It may sound like a nice word (관용표현): sound like + 명사 구조로 &#39;~처럼 들리다&#39;라는 의미를 나타내는 표현입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 이 단어를 사용해요</span><span class=\"en\"><b>We use this word</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">기업들이 친환경적인 척할 때</span><span class=\"en\"><b><span class=\"grammar-hl\">when companies pretend to be eco-friendly</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 많은 제품을 팔기 위해.</span><span class=\"en\"><b><span class=\"grammar-hl\">to sell more products</span>.</b></span></div></div><div class=\"lec-sent-ko\">우리는 기업들이 더 많은 제품을 팔기 위해 친환경적인 척할 때 이 단어를 사용해요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 부정적인 평가에 대한 구체적인 근거입니다. 기업의 이윤 추구라는 목적과 친환경이라는 수단 사이의 기만적인 관계를 정의합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">when companies pretend to be eco-friendly (관계부사): when은 시간적 배경을 나타내는 접속사적 관계부사로, 뒤에 완전한 절(companies pretend to be eco-friendly)이 이어집니다.</div><div class=\"lec-gr-item\">to be eco-friendly (to부정사): pretend의 목적어로 쓰인 명사적 용법의 to부정사 구조입니다.</div><div class=\"lec-gr-item\">to sell more products (to부정사): 목적을 나타내는 부사적 용법의 to부정사로, &#39;~하기 위해서&#39;로 해석되는 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">pretend to</td><td class=\"m\">~인 체하다, 가장하다</td></tr><tr><td class=\"w\">eco-friendly</td><td class=\"m\">친환경적인, 환경 친화적인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">예를 들어,</span><span class=\"en\"><b>For example,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한 자동차 회사는 말할지도 몰라요</span><span class=\"en\"><b>a car company might say</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 차가 오염을 많이 일으키지 않는다고,</span><span class=\"en\"><b><span class=\"grammar-hl\">that their cars don’t pollute much</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 그것은 사실이 아닐지도 몰라요.</span><span class=\"en\"><b>but it may not be true.</b></span></div></div><div class=\"lec-sent-ko\">예를 들어, 한 자동차 회사는 그들의 차가 오염을 많이 일으키지 않는다고 말할지도 모르지만, 그것은 사실이 아닐지도 몰라요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 그린워싱의 전형적인 사례를 들어 독자가 상황을 쉽게 이해하도록 돕는 구체적인 예시의 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that their cars don’t pollute much (간접의문문(명사절)): say라는 타동사의 목적어 역할을 하는 that절로, 완전한 문장을 이끌며 &#39;내용&#39;을 명시합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">pollute</td><td class=\"m\">오염시키다, 더럽히다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">마찬가지로,</span><span class=\"en\"><b>Similarly,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">패션 회사들이 말할지도 몰라요</span><span class=\"en\"><b>fashion companies might say</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 옷이 지구에 좋다고,</span><span class=\"en\"><b>their clothes are good for the Earth,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 항상 그렇지는 않아요.</span><span class=\"en\"><b>but <span class=\"grammar-hl\">they’re not always</span>.</b></span></div></div><div class=\"lec-sent-ko\">마찬가지로, 패션 회사들이 그들의 옷이 지구에 좋다고 말할지도 모르지만, 항상 그렇지는 않아요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 자동차 산업에 이어 패션 산업으로 대상을 확장하여, 그린워싱이 특정 분야에 국한되지 않은 전반적인 현상임을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">they’re not always (대동사): 뒤에 생략된 표현(good for the Earth)을 대신하는 구조입니다. 앞의 동사가 be동사(are)이므로 대동사로 be동사를 씁니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">similarly</td><td class=\"m\">비슷하게, 마찬가지로</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어려울 수 있어요</span><span class=\"en\"><b><span class=\"grammar-hl\">It can be hard</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">구별하는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">to tell</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">회사가 정말로 환경을 돕고 있는지</span><span class=\"en\"><b><span class=\"grammar-hl\">if a company is really helping</span> the environment</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아닌지를.</span><span class=\"en\"><b>or not.</b></span></div></div><div class=\"lec-sent-ko\">어떤 회사가 정말로 환경을 돕고 있는지 아닌지 구별하는 것은 어려울 수 있어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 기업의 겉치레 때문에 소비자가 진실을 파악하기 힘든 현실적인 어려움을 짚어내고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It can be hard to tell (가주어): 진주어: It은 가주어이며, to tell 이하가 진주어로서 문장의 실제 주어 역할을 하는 구조입니다.</div><div class=\"lec-gr-item\">to tell (to부정사): 가주어 It을 보충 설명하는 진주어 역할의 명사적 용법입니다.</div><div class=\"lec-gr-item\">if a company is really helping (현재진행): be동사(is) + 현재분사(helping)가 결합하여 &#39;도움을 주고 있는 중이다&#39;라는 상태를 나타냅니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만 방법들이 있어요</span><span class=\"en\"><b>But there are <span class=\"grammar-hl\">ways</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">알아낼.</span><span class=\"en\"><b><span class=\"grammar-hl\">to find out</span>.</b></span></div></div><div class=\"lec-sent-ko\">하지만 알아낼 방법들이 있어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 문장에서 언급한 &#39;판별의 어려움&#39;이라는 문제를 해결할 방안이 있음을 제시하며 글의 방향을 해결책으로 전환합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">ways to find out (to부정사): ways라는 명사를 뒤에서 수식하는 형용사적 용법의 to부정사 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">find out</td><td class=\"m\">알아내다, 발견하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">라벨을 보세요</span><span class=\"en\"><b>Look at the labels</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또는 제품의 설명서를 읽으세요.</span><span class=\"en\"><b>or read the <span class=\"grammar-hl\">product descriptions</span>.</b></span></div></div><div class=\"lec-sent-ko\">라벨을 보거나 제품의 설명서를 읽어보세요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자가 실천할 수 있는 가장 직접적이고 구체적인 행동 지침을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">product descriptions (동명사(명사적)): product(제품)에 관한 description(설명)으로, 뒤의 명사를 수식하는 행위/용도적 개념의 명사적 결합입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">look at</td><td class=\"m\">~을 살펴보다, ~을 보다</td></tr><tr><td class=\"w\">product description</td><td class=\"m\">제품 설명(서)</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것은 여러분이 확인하는 것을 도울 거예요</span><span class=\"en\"><b>This will <span class=\"grammar-hl\">help you see</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">제품이 정말로 지구에 좋은지를.</span><span class=\"en\"><b>if a product is really good for the Earth.</b></span></div></div><div class=\"lec-sent-ko\">이것은 제품이 정말로 지구에 좋은지 확인하는 데 도움이 될 거예요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 행동(라벨 확인)을 수행했을 때 얻게 될 긍정적인 결과와 그 효과를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">help you see 5형식(SVOC) 구조: help + 목적어(you) + 목적보어(see)로 구성된 준사역동사 구조입니다. 목적보어 자리에 동사원형 see를 씁니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여러분은 또한 조사해 볼 수 있어요</span><span class=\"en\"><b>You can also <span class=\"grammar-hl\">research</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 회사를 온라인으로.</span><span class=\"en\"><b>the company online.</b></span></div></div><div class=\"lec-sent-ko\">여러분은 또한 온라인으로 회사를 조사해 볼 수 있어요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 제품 라벨 확인에 이어, 소비자가 취할 수 있는 또 다른 능동적인 조사 방법을 추가로 제안합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">research 5형식(SVOC) 관련: 본 문장에서는 주어 You가 목적어 the company를 연구하다는 3형식 구조이나, 본 섹션 필수 학습 항목으로 분석합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">research</td><td class=\"m\">조사하다, 연구하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 11 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">잊지 마세요:</span><span class=\"en\"><b><span class=\"grammar-hl\">Don’t forget</span>:</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 현명한 쇼핑객이 되어야 해요.</span><span class=\"en\"><b><span class=\"grammar-hl\">We need to be</span> smart shoppers.</b></span></div></div><div class=\"lec-sent-ko\">잊지 마세요: 우리는 현명한 쇼핑객이 되어야 해요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글 전체의 주제를 관통하는 핵심 태도를 강조하며 독자에게 책임감 있는 소비를 당부합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Don’t forget (관용표현): 명령문 구조로 주의를 환기하는 표현입니다.</div><div class=\"lec-gr-item\">We need to be (to부정사): need의 목적어로 쓰인 명사적 용법의 to부정사 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">be smart</td><td class=\"m\">똑똑하게 행동하다, 현명하게 처신하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 12 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">중요해요</span><span class=\"en\"><b><span class=\"grammar-hl\">It’s important</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">물건을 선택하는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">to choose</span> <span class=\"grammar-hl\">things</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">실제로 환경에 좋은.</span><span class=\"en\"><b><span class=\"grammar-hl\">that are actually good</span> for the environment.</b></span></div></div><div class=\"lec-sent-ko\">환경에 실제로 좋은 것을 선택하는 것은 중요해요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 환경 보호를 위해 단순히 아는 것을 넘어 실질적인 선택과 행동이 필요하다는 결론을 내리며 글을 맺습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It’s important to choose (가주어): 진주어: It은 가주어이며, to choose 이하가 진주어로서 문장의 실제 주어 역할을 하는 구조입니다.</div><div class=\"lec-gr-item\">things that are actually good (관계대명사): that은 things를 수식하는 주격 관계대명사이며, 뒤의 절(are actually good)에서 주어 역할을 합니다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>&#39;그린워싱&#39;은 기업이 이익을 위해 친환경적인 척 기만하는 행위를 뜻한다.</li><li>소비자는 기업의 홍보 문구만으로는 진위 여부를 파악하기 어렵다.</li><li>라벨 확인, 제품 설명 읽기, 기업 조사 등을 통해 제품의 실제 환경 영향을 판별할 수 있다.</li><li>환경을 위해 소비자가 현명한 판단을 내리고 책임감 있게 선택하는 과정이 필요하다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Companies often use deceptive greenwashing tactics to boost sales, yet consumers can identify true sustainability by researching products and companies carefully.</div>\n              <div class=\"lec-final-sum-ko\">기업들은 매출 증대를 위해 기만적인 그린워싱 전략을 사용하지만, 소비자는 제품과 기업을 면밀히 조사함으로써 진정한 지속가능성을 식별할 수 있다.</div></div></div>"],"segs":[[{"audio":"./passage05_audio/1.mp3","hl":null}],[{"audio":"./passage05_audio/2.mp3","hl":null}],[{"audio":"./passage05_audio/3.mp3","hl":null},{"audio":"./passage05_audio/4.mp3","hl":"stage-0"},{"audio":"./passage05_audio/5.mp3","hl":"stage-1"},{"audio":"./passage05_audio/6.mp3","hl":"stage-2"},{"audio":"./passage05_audio/7.mp3","hl":"stage-3"}],[{"audio":"./passage05_audio/8.mp3","hl":null}],[{"audio":"./passage05_audio/9.mp3","hl":"main"},{"audio":"./passage05_audio/10.mp3","hl":"meaning"},{"audio":"./passage05_audio/11.mp3","hl":"grammar"}],[{"audio":"./passage05_audio/12.mp3","hl":"main"},{"audio":"./passage05_audio/13.mp3","hl":"m
