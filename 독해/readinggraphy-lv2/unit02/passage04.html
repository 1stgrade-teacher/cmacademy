운 길에서 차를 잡아주듯, 러닝화 밑창의 돌기들은 주자가 달릴 때 에너지를 효율적으로 지면으로 전달해 추진력(Propulsion)을 극대화하는 역할을 하죠. 이 글의 주인공인 빌 바우어만은 일상 속 평범한 와플 기계에서 영감을 얻었지만, 사실 이는 공학적으로 보면 표면적을 넓혀 마찰 계수(Coefficient of friction)를 조절하려는 창의적인 시도였다고 볼 수 있습니다. 이러한 우연한 발견이 훗날 나이키(Nike)라는 거대 기업의 탄생으로 이어진 만큼, 작은 관찰이 어떻게 스포츠 공학(Sports Engineering)의 혁신을 이끌어냈는지 주목하며 읽어보세요!</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01배경과 노력</div><ul><li>대학 육상 코치였던 빌 바우어만은 더 나은 운동화를 만들기 위해 끊임없이 연구했습니다.</li><li>더 나은 러닝화를 향한 열망 (better running shoes)</li><li>기존 신발을 분해하고 개선하는 시도 (take apart)</li><li>친구 필 나이트(Phil Knight)를 통한 성능 테스트</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02영감의 발견</div><ul><li>아침 식사 중 와플 기계에서 본 독특한 패턴이 혁신적인 아이디어가 되었습니다.</li><li>아내의 와플 기계(waffle iron)를 관찰</li><li>와플 철판의 특별한 패턴(special pattern)에서 영감 획득</li><li>신발 밑창(shoe bottom)에 와플 모양을 도입하기로 결정</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03실험과 성공</div><ul><li>시행착오 끝에 개발된 와플 밑창은 러닝화의 성능을 크게 향상시켰습니다.</li><li>초기의 실패와 지속적인 노력 (kept trying)</li><li>와플 디자인을 적용한 성공적인 밑창 개발</li><li>러닝화의 속도 향상에 기여 (runners much faster)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04지속되는 유산</div><ul><li>빌 바우어만이 발명한 디자인은 오늘날까지도 신발 제조의 표준으로 자리 잡았습니다.</li><li>현대 신발 설계에 미친 지속적인 영향</li><li>현재까지 사용되는 와플 디자인 (waffle design)</li><li>발명품의 실용적 가치와 역사적 계승</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">take apart</td><td class=\"m\">분해하다, 해체하다</td></tr><tr><td class=\"w\">improve</td><td class=\"m\">개선하다, 향상시키다</td></tr><tr><td class=\"w\">test</td><td class=\"m\">시험하다, 검증하다</td></tr><tr><td class=\"w\">consider</td><td class=\"m\">여기다, 생각하다</td></tr><tr><td class=\"w\">notice</td><td class=\"m\">알아차리다, 인지하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">pattern</td><td class=\"m\">무늬, 패턴</td></tr><tr><td class=\"w\">work</td><td class=\"m\">효과가 있다, 작동하다</td></tr><tr><td class=\"w\">keep trying</td><td class=\"m\">계속 시도하다, 포기하지 않다</td></tr><tr><td class=\"w\">succeed</td><td class=\"m\">성공하다, 뒤를 잇다</td></tr><tr><td class=\"w\">design</td><td class=\"m\">설계, 디자인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">빌 바워먼은</span><span class=\"en\"><b><span class=\"grammar-hl\">Bill Bowerman</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">달리기 코치였다</span><span class=\"en\"><b><span class=\"grammar-hl\">was a running coach</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">미국의 한 대학에서</span><span class=\"en\"><b>at a college in the U.S.</b></span></div></div><div class=\"lec-sent-ko\">Bill Bowerman은 미국에 있는 한 대학교의 달리기 코치였다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 도입부로서, 주인공인 빌 바우어만이 어떤 직업을 가졌는지 소개하며 그가 신발 연구를 시작하게 된 배경을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Bill Bowerman was a running coach (현재분사): running이 coach를 수식하여 &#39;달리기 코치&#39;라는 용도를 나타냄. 명사적 개념을 강조하는 현재분사 수식 구조.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는</span><span class=\"en\"><b>He</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">항상 더 나은 신발을 만들고 싶어 했다</span><span class=\"en\"><b>always wanted <span class=\"grammar-hl\">to make better shoes</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">달리기를 위한</span><span class=\"en\"><b><span class=\"grammar-hl\">for running</span>.</b></span></div></div><div class=\"lec-sent-ko\">그는 항상 달리기에 더 좋은 신발을 만들고 싶어했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급된 코치라는 직업적 특성을 바탕으로, 그가 왜 신발 개선에 관심을 두게 되었는지 그 동기를 밝힙니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to make better shoes (to부정사): wanted의 목적어 역할을 하는 명사적 용법의 to부정사 구조.</div><div class=\"lec-gr-item\">for running (동명사): 전치사 for 뒤에 위치하여 &#39;달리기&#39;라는 활동을 나타내는 명사적 기능의 동명사 구조.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그래서 그는</span><span class=\"en\"><b>So he</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">신발을 분해하곤 했다</span><span class=\"en\"><b><span class=\"grammar-hl\">used to take apart</span> shoes</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 작은 변화를 주곤 했다</span><span class=\"en\"><b>and make small changes</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들을 개선하기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to improve them</span>.</b></span></div></div><div class=\"lec-sent-ko\">그래서 그는 신발을 개선하기 위해 그것을 분해하거나 작은 변화를 주곤 했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 목표를 이루기 위해 그가 실제로 어떤 노력을 기울였는지, 구체적인 행동 양식을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">used to take apart (관용표현): &#39;과거에는 ~하곤 했다&#39;라는 의미를 나타내는 조동사적 성격의 관용구.</div><div class=\"lec-gr-item\">to improve them (to부정사): 앞의 make small changes의 목적을 나타내는 부사적 용법(목적)의 to부정사 구조.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">take apart</td><td class=\"m\">분해하다, 해체하다</td></tr><tr><td class=\"w\">improve</td><td class=\"m\">개선하다, 향상시키다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는</span><span class=\"en\"><b>He</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">종종 자신의 새로운 신발 아이디어를 시험했다</span><span class=\"en\"><b>often <span class=\"grammar-hl\">tested his new shoe ideas</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그의 친구인 필 나이트와 함께</span><span class=\"en\"><b><span class=\"grammar-hl\">with his friend, Phil Knight</span>.</b></span></div></div><div class=\"lec-sent-ko\">그는 종종 자신의 친구인 Phil Knight와 함께 자신의 신발에 대한 새로운 아이디어를 실험했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 혼자만의 시도에 그치지 않고, 지인을 활용하여 객관적인 성능을 확인하려는 검증 과정을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">tested his new shoe ideas with his friend, Phil Knight 5형식(SVOC) 구조와 유사한 일반동사 구조: 주어(He) + 동사(tested) + 목적어(shoe ideas) + 수식어(with his friend)로 구성된 문장.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">test</td><td class=\"m\">시험하다, 검증하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">필은</span><span class=\"en\"><b>Phil</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">빠른 달리기 선수가 아니었다</span><span class=\"en\"><b><span class=\"grammar-hl\">wasn’t</span> a fast runner.</b></span></div></div><div class=\"lec-sent-ko\">Phil은 달리기가 빠르지 않았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이어지는 문장에서 왜 그를 테스트 대상으로 삼았는지 설명하기 위해, 그의 달리기 실력이 평범했음을 먼저 알려줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">wasn’t (수동태/기본구조): be동사의 부정형. 이 문장은 수동태가 아닌 2형식(S+V+C) 문장.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그래서</span><span class=\"en\"><b>So</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">만약 어떤 신발이</span><span class=\"en\"><b>if any shoes</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그가 더 빨리 달리도록 도울 수 있다면,</span><span class=\"en\"><b>could help him run faster,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들은</span><span class=\"en\"><b><span class=\"grammar-hl\">they</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">좋은 신발로 여겨졌다</span><span class=\"en\"><b><span class=\"grammar-hl\">were considered good ones</span>.</b></span></div></div><div class=\"lec-sent-ko\">그래서 어떤 신발이라도 그를 더 빨리 달리게 도울 수 있다면, 그것은 좋은 신발로 여겨졌다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 필의 느린 속도를 활용해 신발의 성능을 측정하는 빌만의 독특한 평가 기준을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">they were considered good ones (수동태): be동사(were)+p.p.(considered) 구조. consider는 타동사인데 목적어가 없어서 수동구조로 쓴다. 기본구조: consider + O + C (O를 C라고 여기다/생각하다).</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">consider</td><td class=\"m\">여기다, 생각하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어느 날,</span><span class=\"en\"><b>One day,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">빌이 아침 식사를 하는 동안,</span><span class=\"en\"><b><span class=\"grammar-hl\">while Bill was having breakfast</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는 아내의 와플 팬을 발견했다</span><span class=\"en\"><b>he noticed his wife’s waffle iron.</b></span></div></div><div class=\"lec-sent-ko\">어느 날, Bill이 아침을 먹는 중에 그는 아내의 와플 팬을 발견했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 신발의 혁신적인 디자인이 떠오르게 된 우연한 계기를 제시하며 이야기의 전환점을 마련합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">while Bill was having breakfast (분사구문): while + he(Bill) + was having breakfast와 같은 절의 축약 형태. 시간의 의미를 나타내는 접속사 + 주어 + 진행형 동사 구조.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">notice</td><td class=\"m\">알아차리다, 인지하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 팬은</span><span class=\"en\"><b>The iron</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">특별한 무늬를 가지고 있었다</span><span class=\"en\"><b><span class=\"grammar-hl\">had a special pattern</span>.</b></span></div></div><div class=\"lec-sent-ko\">그 팬은 특별한 무늬를 가지고 있었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 평범한 일상 속의 도구에서 발견한 특정 형태가 뒤이어 나올 신발 밑창의 아이디어 원천임을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">had a special pattern 5형식(SVOC) 구조와 유사한 일반동사 구조: 주어(The iron) + 동사(had) + 목적어(a special pattern)로 구성된 기본 3형식 문장.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">pattern</td><td class=\"m\">무늬, 패턴</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은</span><span class=\"en\"><b>It</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그에게 훌륭한 아이디어를 주었다!</span><span class=\"en\"><b><span class=\"grammar-hl\">gave him a great idea</span>!</b></span></div></div><div class=\"lec-sent-ko\">그것은 그에게 좋은 아이디어를 주었다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 와플 기계의 무늬를 신발에 접목하겠다는 발상의 전환이 일어났음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">gave him a great idea 5형식(SVOC) 구조와 유사한 일반동사 구조: give(수여동사) + I.O.(him) + D.O.(a great idea)의 4형식 구조.</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는</span><span class=\"en\"><b>He</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">신발 밑창을 만들기로 결심했다</span><span class=\"en\"><b>decided <span class=\"grammar-hl\">to make a shoe bottom</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">와플처럼 보이는</span><span class=\"en\"><b><span class=\"grammar-hl\">that looked like a waffle</span>.</b></span></div></div><div class=\"lec-sent-ko\">그는 와플처럼 생긴 신발 밑창을 만들기로 결심했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 구체적인 아이디어를 신발이라는 결과물에 어떻게 적용할 것인지 실천 방향을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to make a shoe bottom (to부정사): decided의 목적어 역할을 하는 명사적 용법의 to부정사 구조.</div><div class=\"lec-gr-item\">that looked like a waffle (관계대명사): that이 주격 관계대명사로 사용되어 앞의 a shoe bottom을 수식함. 관계대명사 뒤에는 동사 looked가 바로 오는 불완전한 절이 옴.</div></div>\n        ","<div class=\"lec-sent-no\">문장 11 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">처음에,</span><span class=\"en\"><b>At first,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 잘 작동하지 않았다,</span><span class=\"en\"><b>it didn’t work well,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 그는 계속 노력했고</span><span class=\"en\"><b>but he <span class=\"grammar-hl\">kept trying</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">마침내 성공했다</span><span class=\"en\"><b>and finally succeeded.</b></span></div></div><div class=\"lec-sent-ko\">처음에는 잘되지 않았지만, 그는 계속 노력했고 마침내 성공했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 새로운 도전에는 늘 시행착오가 따르지만, 포기하지 않는 태도가 결국 성공으로 이어진다는 과정을 담고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">kept trying (현재분사): keep + -ing(계속해서 ~하다) 구조에서 목적어 역할을 하는 동명사(행위)로 쓰임.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">work</td><td class=\"m\">효과가 있다, 작동하다</td></tr><tr><td class=\"w\">succeed</td><td class=\"m\">성공하다, 뒤를 잇다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 12 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">새로운 와플 신발은</span><span class=\"en\"><b>The new waffle shoes</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">달리기 선수들을 만들었다</span><span class=\"en\"><b><span class=\"grammar-hl\">made runners</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">훨씬 더 빠르게</span><span class=\"en\"><b><span class=\"grammar-hl\">much faster</span>.</b></span></div></div><div class=\"lec-sent-ko\">새로운 와플 신발은 달리기 선수들을 훨씬 더 빠르게 만들었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 그의 노력이 실제 운동 선수의 기록 향상이라는 실질적인 성과로 연결되었음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">made runners much faster 5형식(SVOC) 구조: make(사역적 의미) + O(runners) + O.C.(faster, 형용사). O가 O.C.한 상태가 되게 만들다라는 구조.</div></div>\n        ","<div class=\"lec-sent-no\">문장 13 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">오늘날에도,</span><span class=\"en\"><b>Even today,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 신발들이</span><span class=\"en\"><b>many shoes</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 디자인을 사용한다</span><span class=\"en\"><b><span class=\"grammar-hl\">use this design</span>.</b></span></div></div><div class=\"lec-sent-ko\">오늘날에도, 많은 신발들이 이 디자인을 사용한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 과거의 실험적인 시도가 현대에까지 영향을 미치고 있음을 설명하며 글을 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">use this design 5형식(SVOC) 구조와 유사한 일반동사 구조: 주어(many shoes) + 동사(use) + 목적어(this design)로 구성된 3형식 문장.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">design</td><td class=\"m\">설계, 디자인</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>미국의 육상 코치 빌 바우어만은 더 나은 달리기 신발을 만들기 위해 끊임없이 연구했다.</li><li>그는 평범한 실력을 가진 친구의 테스트를 거쳐 신발 성능을 검증했다.</li><li>아침 식사 중 와플 기계의 무늬에서 영감을 얻어 와플 모양의 신발 밑창을 개발했다.</li><li>시행착오 끝에 탄생한 이 디자인은 주자들의 기록을 향상시켰고, 오늘날까지 널리 사용되고 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Bill Bowerman utilized a waffle iron pattern to improve shoe traction, and this innovative design has significantly influenced modern running footwear.</div>\n              <div class=\"lec-final-sum-ko\">빌 바우어는 신발의 접지력을 향상하기 위해 와플 기계 패턴을 활용했으며, 이 혁신적인 디자인은 현대 러닝화에 큰 영향을 미쳤다.</div></div></div>"],"segs":[[{"audio":"./passage04_audio/1.mp3","hl":null}],[{"audio":"./passage04_audio/2.mp
