\u003c/div>\u003cdiv>\u003cspan class=\"e\">🏞️\u003c/span>\u003cb>They are running in the park.\u003c/b>\u003csmall>그들은 공원에서 달리고 있어요.\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"k-ck\" data-hl=\"gc\">\u003cdiv class=\"q\">The baby is \u003cspan class=\"k-ans\" data-rv=\"gc\">sleeping\u003c/span>.\u003c/div>\u003csmall>아기는 자고 있어요.\u003c/small>\u003cdiv class=\"o\">\u003cspan>sleep\u003c/span>\u003cspan class=\"k-right\" data-rv=\"gc\">sleeping\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":103,"text":"예문을 더 볼까요?","hl":"gx"},{"n":104,"text":"She is reading a book.","hl":"gx","v":"n","pause":600},{"n":105,"text":"그녀는 책을 읽고 있어요.","hl":"gx"},{"n":106,"text":"They are running in the park.","hl":"gx","v":"n","pause":600},{"n":107,"text":"그들은 공원에서 달리고 있어요.","hl":"gx"},{"n":108,"text":"문제를 풀어 볼까요? The baby is 빈칸. 빈칸에 들어갈 말은 sleep, 아니면 sleeping 중에서 무엇일까요?","hl":"gc"},{"n":109,"text":"정답은 sleeping! The baby is sleeping.","hl":"gc","rv":"gc"}]},{"html":"\u003cspan class=\"lp-tag\">내용 확인 문제\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-qq\" data-hl=\"q0\">\u003ci>1\u003c/i>\u003cdiv>\u003cdiv class=\"q\">마을 사람들은 천둥신이 화가 났다고 믿었어요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q0\">O\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q1\">\u003ci>2\u003c/i>\u003cdiv>\u003cdiv class=\"q\">족장의 딸은 폭포에 빠진 뒤 바로 걸어서 마을로 돌아왔어요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q1\">X\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q2\">\u003ci>3\u003c/i>\u003cdiv>\u003cdiv class=\"q\">마을 사람들이 해마다 강으로 내려보낸 사람은 누구였나요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 아름다운 여자들\u003c/span>\u003cspan>② 천둥신의 아들들\u003c/span>\u003cspan>③ 족장의 아들\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q2\">아름다운 여자들\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q3\">\u003ci>4\u003c/i>\u003cdiv>\u003cdiv class=\"q\">강에 독을 넣은 것은 무엇인가요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 거대한 뱀\u003c/span>\u003cspan>② 천둥신\u003c/span>\u003cspan>③ 폭포\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q3\">거대한 뱀\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":110,"text":"이제 문제를 풀어 볼까요? 지문을 다시 보면서 답을 찾아보세요.","hl":null},{"n":111,"text":"첫 번째 문제. 마을 사람들은 천둥신이 화가 났다고 믿었어요. 맞으면 O, 틀리면 X예요.","hl":"q0"},{"n":112,"text":"정답은 O, 맞아요.","hl":"q0","rv":"q0"},{"n":113,"text":"두 번째 문제. 족장의 딸은 폭포에 빠진 뒤 바로 걸어서 마을로 돌아왔어요. 맞으면 O, 틀리면 X예요.","hl":"q1"},{"n":114,"text":"정답은 X, 틀려요.","hl":"q1","rv":"q1"},{"n":115,"text":"세 번째 문제. 마을 사람들이 해마다 강으로 내려보낸 사람은 누구였나요? 첫 번째, 아름다운 여자들. 두 번째, 천둥신의 아들들. 세 번째, 족장의 아들","hl":"q2"},{"n":116,"text":"정답은 아름다운 여자들예요.","hl":"q2","rv":"q2"},{"n":117,"text":"네 번째 문제. 강에 독을 넣은 것은 무엇인가요? 첫 번째, 거대한 뱀. 두 번째, 천둥신. 세 번째, 폭포","hl":"q3"},{"n":118,"text":"정답은 거대한 뱀예요.","hl":"q3","rv":"q3"}]},{"html":"\u003cspan class=\"lp-tag\">이야기 요약하기\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-bank\">\u003cspan>Thunder God\u003c/span>\u003cspan>died\u003c/span>\u003cspan>snake\u003c/span>\u003cspan>warned\u003c/span>\u003c/div>\u003cdiv class=\"k-sum\" data-hl=\"sm\">Long ago, villagers near the Niagara River \u003cspan class=\"k-ans\" data-rv=\"sm\">died\u003c/span> every year, so they sent women to please the \u003cspan class=\"k-ans\" data-rv=\"sm\">Thunder God\u003c/span>. The chief's daughter learned that a giant \u003cspan class=\"k-ans\" data-rv=\"sm\">snake\u003c/span> poisoned the river and \u003cspan class=\"k-ans\" data-rv=\"sm\">warned\u003c/span> the villagers as a spirit. They killed the snake and stopped sending women down the river.\u003c/div>\u003cdiv class=\"k-sk\">오래전, 나이아가라 강 근처 마을 사람들은 해마다 죽었고, 그래서 천둥신을 기쁘게 하려고 여자들을 보냈어요. 족장의 딸은 거대한 뱀이 강에 독을 넣는다는 것을 알고 영혼이 되어 마을 사람들에게 경고했어요. 사람들은 뱀을 죽이고 다시는 여자들을 강으로 보내지 않았답니다.\u003c/div>\u003c/div>","segs":[{"n":119,"text":"마지막으로 이야기를 짧게 정리해 볼게요. 빈칸에 들어갈 낱말을 떠올리며 읽어 보세요.","hl":null},{"n":120,"text":"Long ago, villagers near the Niagara River died every year, so they sent women to please the Thunder God. The chief's daughter learned that a giant snake poisoned the river and warned the villagers as a spirit. They killed the snake and stopped sending women down the river.","hl":"sm","rv":"sm","v":"n"},{"n":121,"text":"오래전, 나이아가라 강 근처 마을 사람들은 해마다 죽었고, 그래서 천둥신을 기쁘게 하려고 여자들을 보냈어요. 족장의 딸은 거대한 뱀이 강에 독을 넣는다는 것을 알고 영혼이 되어 마을 사람들에게 경고했어요. 사람들은 뱀을 죽이고 다시는 여자들을 강으로 보내지 않았답니다.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>Niagara Falls 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":122,"text":"오늘 여러분은 나이아가라 폭포의 옛이야기를 멋지게 읽었어요. 천둥신, 족장의 딸, 거대한 뱀까지 아주 잘 기억했죠? 다음 시간에도 재미있는 이야기로 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
