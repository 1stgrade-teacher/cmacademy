 충격을 받는 까닭은 무엇인가요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 희생자들의 손톱과 머리털을 보기 때문에\u003c/span>\u003cspan>② 수용소가 너무 커서\u003c/span>\u003cspan>③ 폴란드 음식이 매워서\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q3\">희생자들의 손톱과 머리털을 보기 때문에\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":120,"text":"이제 문제를 풀어 볼까요? 지문을 다시 한 번 보면서 답을 찾아보세요.","hl":null},{"n":121,"text":"첫 번째 문제. 다크 투어리즘은 사람들이 휴식을 취하려고 가는 여행이에요. 맞으면 O, 틀리면 X예요.","hl":"q0"},{"n":122,"text":"정답은 X, 틀려요.","hl":"q0","rv":"q0"},{"n":123,"text":"두 번째 문제. 아우슈비츠는 제2차 세계대전 동안 강제 노동 수용소였어요. 맞으면 O, 틀리면 X예요.","hl":"q1"},{"n":124,"text":"정답은 O, 맞아요.","hl":"q1","rv":"q1"},{"n":125,"text":"세 번째 문제. 뉴욕이 박물관을 지은 까닭은 무엇인가요? 첫 번째, 테러 공격을 하기 위해. 두 번째, 희생자들을 기억하기 위해. 세 번째, 관광객을 웃게 하기 위해","hl":"q2"},{"n":126,"text":"정답은 희생자들을 기억하기 위해예요.","hl":"q2","rv":"q2"},{"n":127,"text":"네 번째 문제. 방문객들이 아우슈비츠에서 충격을 받는 까닭은 무엇인가요? 첫 번째, 희생자들의 손톱과 머리털을 보기 때문에. 두 번째, 수용소가 너무 커서. 세 번째, 폴란드 음식이 매워서","hl":"q3"},{"n":128,"text":"정답은 희생자들의 손톱과 머리털을 보기 때문에예요.","hl":"q3","rv":"q3"}]},{"html":"\u003cspan class=\"lp-tag\">이야기 요약하기\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-bank\">\u003cspan>death\u003c/span>\u003cspan>different reasons\u003c/span>\u003cspan>remember\u003c/span>\u003cspan>victims\u003c/span>\u003c/div>\u003cdiv class=\"k-sum\" data-hl=\"sm\">People travel for \u003cspan class=\"k-ans\" data-rv=\"sm\">different reasons\u003c/span>. Dark tourism is travel to places of \u003cspan class=\"k-ans\" data-rv=\"sm\">death\u003c/span> and pain, like Auschwitz. New York also has dark tourism, and its museums \u003cspan class=\"k-ans\" data-rv=\"sm\">remember\u003c/span> the \u003cspan class=\"k-ans\" data-rv=\"sm\">victims\u003c/span>.\u003c/div>\u003cdiv class=\"k-sk\">사람들은 다양한 이유로 여행을 해요. 다크 투어리즘은 아우슈비츠처럼 죽음과 아픔의 장소로 가는 여행이에요. 뉴욕에도 다크 투어리즘이 있고, 그곳 박물관들은 희생자들을 기억해요.\u003c/div>\u003c/div>","segs":[{"n":129,"text":"마지막으로 오늘 이야기를 세 문장으로 정리해 볼게요. 빈칸에 들어갈 낱말을 생각하면서 함께 따라 읽어 보세요.","hl":null},{"n":130,"text":"People travel for different reasons. Dark tourism is travel to places of death and pain, like Auschwitz. New York also has dark tourism, and its museums remember the victims.","hl":"sm","rv":"sm","v":"n"},{"n":131,"text":"사람들은 다양한 이유로 여행을 해요. 다크 투어리즘은 아우슈비츠처럼 죽음과 아픔의 장소로 가는 여행이에요. 뉴욕에도 다크 투어리즘이 있고, 그곳 박물관들은 희생자들을 기억해요.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>Travel to Dark Places 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":132,"text":"오늘도 아주 멋지게 공부했어요! 여행에는 여러 가지 이유가 있고, 슬픈 역사를 기억하는 여행도 있다는 것을 알게 되었지요. 다음 시간에도 신나는 이야기로 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
