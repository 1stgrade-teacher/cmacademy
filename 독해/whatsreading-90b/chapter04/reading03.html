div class=\"q\">이 가족은 마지막 날에 돌고래 유람선을 탔어요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q1\">X\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q2\">\u003ci>3\u003c/i>\u003cdiv>\u003cdiv class=\"q\">가족이 가장 먼저 방문한 곳은 어디인가요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① Two Lovers Point\u003c/span>\u003cspan>② UnderWater World\u003c/span>\u003cspan>③ the beach\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q2\">Two Lovers Point\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q3\">\u003ci>4\u003c/i>\u003cdiv>\u003cdiv class=\"q\">형과 나는 해변에서 무엇을 했나요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 수영을 했어요\u003c/span>\u003cspan>② 휴식을 취했어요\u003c/span>\u003cspan>③ 쇼핑을 했어요\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q3\">수영을 했어요\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":130,"text":"이제 문제를 풀어 볼까요? 글을 다시 보면서 답을 찾으면 훨씬 쉬워요. 하나씩 차근차근 풀어 봐요.","hl":null},{"n":131,"text":"첫 번째 문제. 이 가족은 12월 20일부터 26일까지 괌에 있었어요. 맞으면 O, 틀리면 X예요.","hl":"q0"},{"n":132,"text":"정답은 O, 맞아요.","hl":"q0","rv":"q0"},{"n":133,"text":"두 번째 문제. 이 가족은 마지막 날에 돌고래 유람선을 탔어요. 맞으면 O, 틀리면 X예요.","hl":"q1"},{"n":134,"text":"정답은 X, 틀려요.","hl":"q1","rv":"q1"},{"n":135,"text":"세 번째 문제. 가족이 가장 먼저 방문한 곳은 어디인가요? 첫 번째, Two Lovers Point. 두 번째, UnderWater World. 세 번째, the beach","hl":"q2"},{"n":136,"text":"정답은 Two Lovers Point예요.","hl":"q2","rv":"q2"},{"n":137,"text":"네 번째 문제. 형과 나는 해변에서 무엇을 했나요? 첫 번째, 수영을 했어요. 두 번째, 휴식을 취했어요. 세 번째, 쇼핑을 했어요","hl":"q3"},{"n":138,"text":"정답은 수영을 했어요예요.","hl":"q3","rv":"q3"}]},{"html":"\u003cspan class=\"lp-tag\">이야기 요약하기\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-bank\">\u003cspan>Guam\u003c/span>\u003cspan>dolphin\u003c/span>\u003cspan>sunset\u003c/span>\u003c/div>\u003cdiv class=\"k-sum\" data-hl=\"sm\">My family had a winter trip to \u003cspan class=\"k-ans\" data-rv=\"sm\">Guam\u003c/span> and visited Two Lovers Point and UnderWater World. We also went on a \u003cspan class=\"k-ans\" data-rv=\"sm\">dolphin\u003c/span> cruise and ate seafood, hamburgers and steak. The best part was swimming at the beach near our hotel and watching the \u003cspan class=\"k-ans\" data-rv=\"sm\">sunset\u003c/span>.\u003c/div>\u003cdiv class=\"k-sk\">우리 가족은 괌으로 겨울 여행을 가서 투 러버스 포인트와 언더워터 월드를 방문했어요. 우리는 또 돌고래 유람선을 타고 해산물과 햄버거, 스테이크를 먹었어요. 가장 좋았던 것은 호텔 근처 해변에서 수영하고 일몰을 본 것이었어요.\u003c/div>\u003c/div>","segs":[{"n":139,"text":"마지막으로 오늘 이야기를 세 문장으로 정리해 볼게요. 빈칸에 들어갈 낱말을 떠올리며 함께 읽어 봐요.","hl":null},{"n":140,"text":"My family had a winter trip to Guam and visited Two Lovers Point and UnderWater World. We also went on a dolphin cruise and ate seafood, hamburgers and steak. The best part was swimming at the beach near our hotel and watching the sunset.","hl":"sm","rv":"sm","v":"n"},{"n":141,"text":"우리 가족은 괌으로 겨울 여행을 가서 투 러버스 포인트와 언더워터 월드를 방문했어요. 우리는 또 돌고래 유람선을 타고 해산물과 햄버거, 스테이크를 먹었어요. 가장 좋았던 것은 호텔 근처 해변에서 수영하고 일몰을 본 것이었어요.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>Family Trip to Guam 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":142,"text":"오늘 여러분은 괌으로 떠난 가족 여행 이야기를 멋지게 읽어 냈어요. visited와 could처럼 지난 일을 말하는 말들도 잘 익혔죠? 다음에도 재미있는 여행 이야기로 만나요. 정말 수고 많았어요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
