n":113,"text":"상자 안에 뭐가 있어요?","hl":"gx"},{"n":114,"text":"문제를 풀어 볼까요? 빈칸 special about this school? 빈칸에 들어갈 말은 What's, 아니면 Where's 중에서 무엇일까요?","hl":"gc"},{"n":115,"text":"정답은 What's! What's special about this school?","hl":"gc","rv":"gc"}]},{"html":"\u003cspan class=\"lp-tag\">내용 확인 문제\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-qq\" data-hl=\"q0\">\u003ci>1\u003c/i>\u003cdiv>\u003cdiv class=\"q\">바드후 섬은 몰디브에 있어요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q0\">O\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q1\">\u003ci>2\u003c/i>\u003cdiv>\u003cdiv class=\"q\">관광객들은 별의 바다를 언제, 어디서 볼 수 있는지 정확히 알 수 있어요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q1\">X\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q2\">\u003ci>3\u003c/i>\u003cdiv>\u003cdiv class=\"q\">플랑크톤은 언제 빛을 만들어요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 스트레스를 받을 때\u003c/span>\u003cspan>② 밥을 먹을 때\u003c/span>\u003cspan>③ 잠을 잘 때\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q2\">스트레스를 받을 때\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q3\">\u003ci>4\u003c/i>\u003cdiv>\u003cdiv class=\"q\">바다가 별들로 가득 찬 것처럼 보이는 까닭은 무엇인가요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 플랑크톤이 빛을 내서\u003c/span>\u003cspan>② 별이 바다에 떨어져서\u003c/span>\u003cspan>③ 달이 아주 밝아서\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q3\">플랑크톤이 빛을 내서\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":116,"text":"이제 문제를 풀어 볼까요? 지문에서 답을 찾으면 모두 맞힐 수 있어요. 틀려도 괜찮으니 다시 한번 읽어 보며 확인해 봐요.","hl":null},{"n":117,"text":"첫 번째 문제. 바드후 섬은 몰디브에 있어요. 맞으면 O, 틀리면 X예요.","hl":"q0"},{"n":118,"text":"정답은 O, 맞아요.","hl":"q0","rv":"q0"},{"n":119,"text":"두 번째 문제. 관광객들은 별의 바다를 언제, 어디서 볼 수 있는지 정확히 알 수 있어요. 맞으면 O, 틀리면 X예요.","hl":"q1"},{"n":120,"text":"정답은 X, 틀려요.","hl":"q1","rv":"q1"},{"n":121,"text":"세 번째 문제. 플랑크톤은 언제 빛을 만들어요? 첫 번째, 스트레스를 받을 때. 두 번째, 밥을 먹을 때. 세 번째, 잠을 잘 때","hl":"q2"},{"n":122,"text":"정답은 스트레스를 받을 때예요.","hl":"q2","rv":"q2"},{"n":123,"text":"네 번째 문제. 바다가 별들로 가득 찬 것처럼 보이는 까닭은 무엇인가요? 첫 번째, 플랑크톤이 빛을 내서. 두 번째, 별이 바다에 떨어져서. 세 번째, 달이 아주 밝아서","hl":"q3"},{"n":124,"text":"정답은 플랑크톤이 빛을 내서예요.","hl":"q3","rv":"q3"}]},{"html":"\u003cspan class=\"lp-tag\">이야기 요약하기\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-bank\">\u003cspan>Sea of Stars\u003c/span>\u003cspan>conditions\u003c/span>\u003cspan>plankton\u003c/span>\u003cspan>stars\u003c/span>\u003c/div>\u003cdiv class=\"k-sum\" data-hl=\"sm\">Vaadhoo Island in Maldives has the \u003cspan class=\"k-ans\" data-rv=\"sm\">Sea of Stars\u003c/span>. Tiny \u003cspan class=\"k-ans\" data-rv=\"sm\">plankton\u003c/span> make light in the water, so the sea looks like \u003cspan class=\"k-ans\" data-rv=\"sm\">stars\u003c/span>. But they glow only in the right \u003cspan class=\"k-ans\" data-rv=\"sm\">conditions\u003c/span>.\u003c/div>\u003cdiv class=\"k-sk\">몰디브의 바드후 섬에는 별의 바다가 있어요. 작은 플랑크톤이 물속에서 빛을 내서 바다가 별처럼 보여요. 하지만 알맞은 환경에서만 빛나요.\u003c/div>\u003c/div>","segs":[{"n":125,"text":"마지막으로 오늘 이야기를 세 문장으로 정리해 볼게요. 별의 바다가 왜 생기는지, 그리고 왜 아무도 확실히 알 수 없는지 떠올리며 읽어 봐요.","hl":null},{"n":126,"text":"Vaadhoo Island in Maldives has the Sea of Stars. Tiny plankton make light in the water, so the sea looks like stars. But they glow only in the right conditions.","hl":"sm","rv":"sm","v":"n"},{"n":127,"text":"몰디브의 바드후 섬에는 별의 바다가 있어요. 작은 플랑크톤이 물속에서 빛을 내서 바다가 별처럼 보여요. 하지만 알맞은 환경에서만 빛나요.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>The Sea of Stars 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":128,"text":"오늘 여러분은 별처럼 빛나는 바다 이야기를 멋지게 읽어 냈어요! 자연은 우리가 생각하지 못한 신기한 일을 자주 보여 주지요. 다음에도 신기한 자연 이야기로 만나요, 정말 잘했어요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
