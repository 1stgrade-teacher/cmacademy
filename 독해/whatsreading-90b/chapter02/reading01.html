3cdiv class=\"pe\">🪴\u003c/div>\u003cdiv class=\"pn\">It will be a plant.\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"k-ez\" data-hl=\"ge\">앞에서 '이렇게 해요'라고 시키고, 뒤에서 '그러면 이렇게 될 거예요'라고 결과를 말해요. 가운데 and는 여기서 \u003cb class=\"key\">그러면\u003c/b>이라는 뜻으로 둘을 이어 줘요. 그래서 '씨앗을 잘 돌보세요, 그러면 식물이 될 거예요'가 돼요.\u003c/div>\u003c/div>","segs":[{"n":103,"text":"이번에는 시키는 말과 그 결과를 한 문장에 담는 방법을 배워 볼게요. Take good care of the seed는 '그 씨앗을 잘 돌보세요'라는 시키는 말이에요. 가운데 and는 여기서 '그러면'이라는 뜻으로 앞뒤를 이어 줘요. it will grow into a plant는 '그것이 자라서 식물이 될 거예요'라는 결과예요. 그러니까 '씨앗을 잘 돌보세요, 그러면 식물이 될 거예요'가 되는 거예요. 우리도 Water the plant, and it will grow처럼 '이렇게 해요, 그러면 저렇게 될 거예요' 문장을 만들어 볼 수 있어요.","hl":"gb"},{"n":104,"text":"앞에서 '이렇게 해요'라고 시키고, 뒤에서 '그러면 이렇게 될 거예요'라고 결과를 말해요. 가운데 and는 여기서 그러면이라는 뜻으로 둘을 이어 줘요. 그래서 '씨앗을 잘 돌보세요, 그러면 식물이 될 거예요'가 돼요.","hl":"ge"}]},{"html":"\u003cspan class=\"lp-tag\">확인해요\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-gt\">\u003cspan>🔗\u003c/span>'~해요, 그러면 ~할 거예요' and\u003c/div>\u003cdiv class=\"k-ex\" data-hl=\"gx\">\u003cdiv>\u003cspan class=\"e\">🚿\u003c/span>\u003cb>Water the plant, and it will grow.\u003c/b>\u003csmall>그 식물에 물을 주세요, 그러면 자랄 거예요.\u003c/small>\u003c/div>\u003cdiv>\u003cspan class=\"e\">📚\u003c/span>\u003cb>Study hard, and you will do well.\u003c/b>\u003csmall>열심히 공부하세요, 그러면 잘할 거예요.\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"k-ck\" data-hl=\"gc\">\u003cdiv class=\"q\">\u003cspan class=\"k-ans\" data-rv=\"gc\">Press\u003c/span> on the button, and the door will open.\u003c/div>\u003csmall>그 버튼을 누르세요, 그러면 문이 열릴 거예요.\u003c/small>\u003cdiv class=\"o\">\u003cspan class=\"k-right\" data-rv=\"gc\">Press\u003c/span>\u003cspan>Pressed\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":105,"text":"예문을 더 볼까요?","hl":"gx"},{"n":106,"text":"Water the plant, and it will grow.","hl":"gx","v":"n","pause":600},{"n":107,"text":"그 식물에 물을 주세요, 그러면 자랄 거예요.","hl":"gx"},{"n":108,"text":"Study hard, and you will do well.","hl":"gx","v":"n","pause":600},{"n":109,"text":"열심히 공부하세요, 그러면 잘할 거예요.","hl":"gx"},{"n":110,"text":"문제를 풀어 볼까요? 빈칸 on the button, and the door will open. 빈칸에 들어갈 말은 Press, 아니면 Pressed 중에서 무엇일까요?","hl":"gc"},{"n":111,"text":"정답은 Press! Press on the button, and the door will open.","hl":"gc","rv":"gc"}]},{"html":"\u003cspan class=\"lp-tag\">내용 확인 문제\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-qq\" data-hl=\"q0\">\u003ci>1\u003c/i>\u003cdiv>\u003cdiv class=\"q\">Sophia와 Emily는 같은 반이었어요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q0\">O\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q1\">\u003ci>2\u003c/i>\u003cdiv>\u003cdiv class=\"q\">Emily는 자신의 화분에만 흙을 더 얹었어요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q1\">X\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q2\">\u003ci>3\u003c/i>\u003cdiv>\u003cdiv class=\"q\">Emily가 Sophia의 식물 위에 흙을 얹은 까닭은 무엇인가요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 최고가 되고 싶어서\u003c/span>\u003cspan>② Sophia가 부탁해서\u003c/span>\u003cspan>③ 흙이 모자라서\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q2\">최고가 되고 싶어서\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q3\">\u003ci>4\u003c/i>\u003cdiv>\u003cdiv class=\"q\">마지막에 반에서 최고의 정원사는 누구였나요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① Emily\u003c/span>\u003cspan>② Sophia\u003c/span>\u003cspan>③ 선생님\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q3\">Emily\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":112,"text":"이제 문제를 풀어 볼까요? 지문으로 돌아가서 답이 되는 문장 번호를 꼭 확인해 보세요.","hl":null},{"n":113,"text":"첫 번째 문제. Sophia와 Emily는 같은 반이었어요. 맞으면 O, 틀리면 X예요.","hl":"q0"},{"n":114,"text":"정답은 O, 맞아요.","hl":"q0","rv":"q0"},{"n":115,"text":"두 번째 문제. Emily는 자신의 화분에만 흙을 더 얹었어요. 맞으면 O, 틀리면 X예요.","hl":"q1"},{"n":116,"text":"정답은 X, 틀려요.","hl":"q1","rv":"q1"},{"n":117,"text":"세 번째 문제. Emily가 Sophia의 식물 위에 흙을 얹은 까닭은 무엇인가요? 첫 번째, 최고가 되고 싶어서. 두 번째, Sophia가 부탁해서. 세 번째, 흙이 모자라서","hl":"q2"},{"n":118,"text":"정답은 최고가 되고 싶어서예요.","hl":"q2","rv":"q2"},{"n":119,"text":"네 번째 문제. 마지막에 반에서 최고의 정원사는 누구였나요? 첫 번째, Emily. 두 번째, Sophia. 세 번째, 선생님","hl":"q3"},{"n":120,"text":"정답은 Emily예요.","hl":"q3","rv":"q3"}]},{"html":"\u003cspan class=\"lp-tag\">이야기 요약하기\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-bank\">\u003cspan>best\u003c/span>\u003cspan>gardener\u003c/span>\u003cspan>seeds\u003c/span>\u003cspan>sick\u003c/span>\u003c/div>\u003cdiv class=\"k-sum\" data-hl=\"sm\">Sophia and Emily planted \u003cspan class=\"k-ans\" data-rv=\"sm\">seeds\u003c/span> in their own pots. Emily put soil on Sophia's plant because she wanted to be the \u003cspan class=\"k-ans\" data-rv=\"sm\">best\u003c/span>. When Sophia was \u003cspan class=\"k-ans\" data-rv=\"sm\">sick\u003c/span>, Emily took care of both plants and became the best \u003cspan class=\"k-ans\" data-rv=\"sm\">gardener\u003c/span> in class.\u003c/div>\u003cdiv class=\"k-sk\">Sophia와 Emily는 각자 화분에 씨앗을 심었어요. Emily는 최고가 되고 싶어서 Sophia의 식물 위에 흙을 얹었어요. Sophia가 아팠을 때 Emily는 두 식물을 모두 돌봤고, 반에서 최고의 정원사가 되었어요.\u003c/div>\u003c/div>","segs":[{"n":121,"text":"마지막으로 이야기를 세 문장으로 줄여 볼게요. 빈칸에 들어갈 낱말을 떠올리며 함께 읽어 보세요.","hl":null},{"n":122,"text":"Sophia and Emily planted seeds in their own pots. Emily put soil on Sophia's plant because she wanted to be the best. When Sophia was sick, Emily took care of both plants and became the best gardener in class.","hl":"sm","rv":"sm","v":"n"},{"n":123,"text":"Sophia와 Emily는 각자 화분에 씨앗을 심었어요. Emily는 최고가 되고 싶어서 Sophia의 식물 위에 흙을 얹었어요. Sophia가 아팠을 때 Emily는 두 식물을 모두 돌봤고, 반에서 최고의 정원사가 되었어요.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>A Garden in the Classroom 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":124,"text":"오늘 여러분은 두 친구의 정원 이야기를 읽고, '더 ~해요'와 '이렇게 해요, 그러면 ~할 거예요' 표현까지 배웠어요. 정말 잘했어요! 다음 시간에도 재미있는 이야기로 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
