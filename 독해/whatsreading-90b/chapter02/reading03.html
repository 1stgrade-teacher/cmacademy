c/div>\u003c/div>\u003cdiv class=\"k-ez\" data-hl=\"ge\">because는 앞말과 뒷말을 '까닭'으로 이어 줘요. '왜 슬펐어요?'라는 물음에 답할 때 because 뒤에 \u003cb class=\"key\">까닭\u003c/b>을 붙여요. 그림처럼 까닭 다음에 결과가 따라와요.\u003c/div>\u003c/div>","segs":[{"n":95,"text":"두 번째 문법은 because예요. because는 왜냐하면, 때문이라는 까닭을 알려 주는 말이에요. 나무는 왜 슬펐을까요? The tree, was very sad, because, it only rained, once a year. The tree는 그 나무는, was very sad는 아주 슬펐어요, because는 왜냐하면, it only rained는 비가 오직 한 번만 왔어요, once a year는 일 년에 한 번이라는 뜻이에요. 까닭을 말할 때 꼭 써 보세요.","hl":"gb"},{"n":96,"text":"because는 앞말과 뒷말을 '까닭'으로 이어 줘요. '왜 슬펐어요?'라는 물음에 답할 때 because 뒤에 까닭을 붙여요. 그림처럼 까닭 다음에 결과가 따라와요.","hl":"ge"}]},{"html":"\u003cspan class=\"lp-tag\">확인해요\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-gt\">\u003cspan>🔗\u003c/span>'~때문에' because\u003c/div>\u003cdiv class=\"k-ex\" data-hl=\"gx\">\u003cdiv>\u003cspan class=\"e\">🎂\u003c/span>\u003cb>I was happy because it was my birthday.\u003c/b>\u003csmall>내 생일이라서 기뻤어요.\u003c/small>\u003c/div>\u003cdiv>\u003cspan class=\"e\">😴\u003c/span>\u003cb>He was tired because he ran a lot.\u003c/b>\u003csmall>많이 뛰어서 피곤했어요.\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"k-ck\" data-hl=\"gc\">\u003cdiv class=\"q\">She was happy \u003cspan class=\"k-ans\" data-rv=\"gc\">because\u003c/span> it was sunny.\u003c/div>\u003csmall>날씨가 화창해서 그녀는 행복했어요.\u003c/small>\u003cdiv class=\"o\">\u003cspan class=\"k-right\" data-rv=\"gc\">because\u003c/span>\u003cspan>but\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":97,"text":"예문을 더 볼까요?","hl":"gx"},{"n":98,"text":"I was happy because it was my birthday.","hl":"gx","v":"n","pause":600},{"n":99,"text":"내 생일이라서 기뻤어요.","hl":"gx"},{"n":100,"text":"He was tired because he ran a lot.","hl":"gx","v":"n","pause":600},{"n":101,"text":"많이 뛰어서 피곤했어요.","hl":"gx"},{"n":102,"text":"문제를 풀어 볼까요? She was happy 빈칸 it was sunny. 빈칸에 들어갈 말은 because, 아니면 but 중에서 무엇일까요?","hl":"gc"},{"n":103,"text":"정답은 because! She was happy because it was sunny.","hl":"gc","rv":"gc"}]},{"html":"\u003cspan class=\"lp-tag\">내용 확인 문제\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-qq\" data-hl=\"q0\">\u003ci>1\u003c/i>\u003cdiv>\u003cdiv class=\"q\">바오바브나무는 처음에 물과 햇빛이 충분한 아름다운 곳에서 살았어요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q0\">O\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q1\">\u003ci>2\u003c/i>\u003cdiv>\u003cdiv class=\"q\">신은 나무를 물이 아주 많은 곳에 던져 버렸어요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q1\">X\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q2\">\u003ci>3\u003c/i>\u003cdiv>\u003cdiv class=\"q\">나무가 아주 슬펐던 까닭은 무엇인가요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 일 년에 한 번만 비가 왔기 때문\u003c/span>\u003cspan>② 햇빛이 너무 강했기 때문\u003c/span>\u003cspan>③ 신이 나무를 심어 주었기 때문\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q2\">일 년에 한 번만 비가 왔기 때문\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q3\">\u003ci>4\u003c/i>\u003cdiv>\u003cdiv class=\"q\">나무는 비가 올 때 무엇을 이용해서 물을 저장했나요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 몸에 만든 구멍들\u003c/span>\u003cspan>② 작아진 나뭇잎들\u003c/span>\u003cspan>③ 아름다운 꽃\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q3\">몸에 만든 구멍들\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":104,"text":"이제 문제를 풀어 볼까요? 지문을 다시 한 번 떠올리면서 천천히 답을 찾아보세요.","hl":null},{"n":105,"text":"첫 번째 문제. 바오바브나무는 처음에 물과 햇빛이 충분한 아름다운 곳에서 살았어요. 맞으면 O, 틀리면 X예요.","hl":"q0"},{"n":106,"text":"정답은 O, 맞아요.","hl":"q0","rv":"q0"},{"n":107,"text":"두 번째 문제. 신은 나무를 물이 아주 많은 곳에 던져 버렸어요. 맞으면 O, 틀리면 X예요.","hl":"q1"},{"n":108,"text":"정답은 X, 틀려요.","hl":"q1","rv":"q1"},{"n":109,"text":"세 번째 문제. 나무가 아주 슬펐던 까닭은 무엇인가요? 첫 번째, 일 년에 한 번만 비가 왔기 때문. 두 번째, 햇빛이 너무 강했기 때문. 세 번째, 신이 나무를 심어 주었기 때문","hl":"q2"},{"n":110,"text":"정답은 일 년에 한 번만 비가 왔기 때문예요.","hl":"q2","rv":"q2"},{"n":111,"text":"네 번째 문제. 나무는 비가 올 때 무엇을 이용해서 물을 저장했나요? 첫 번째, 몸에 만든 구멍들. 두 번째, 작아진 나뭇잎들. 세 번째, 아름다운 꽃","hl":"q3"},{"n":112,"text":"정답은 몸에 만든 구멍들예요.","hl":"q3","rv":"q3"}]},{"html":"\u003cspan class=\"lp-tag\">이야기 요약하기\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-bank\">\u003cspan>angry\u003c/span>\u003cspan>dry\u003c/span>\u003cspan>holes\u003c/span>\u003cspan>without\u003c/span>\u003c/div>\u003cdiv class=\"k-sum\" data-hl=\"sm\">A baobab tree lived an easy life and thought it could live \u003cspan class=\"k-ans\" data-rv=\"sm\">without\u003c/span> water. God was \u003cspan class=\"k-ans\" data-rv=\"sm\">angry\u003c/span> and threw it in a \u003cspan class=\"k-ans\" data-rv=\"sm\">dry\u003c/span> place. The tree made \u003cspan class=\"k-ans\" data-rv=\"sm\">holes\u003c/span> to save water and became fatter.\u003c/div>\u003cdiv class=\"k-sk\">바오바브나무는 편안한 삶을 살았고 물 없이도 살 수 있다고 생각했어요. 신은 화가 나서 나무를 건조한 곳에 던졌어요. 나무는 물을 저장하려고 구멍들을 만들었고 점점 더 뚱뚱해졌어요.\u003c/div>\u003c/div>","segs":[{"n":113,"text":"마지막으로 오늘 이야기를 세 문장으로 정리해 볼게요. 바오바브나무는 물 없이 살 수 있다고 생각했고, 신은 화가 나서 나무를 건조한 곳에 던졌어요. 그리고 나무는 구멍을 만들어 물을 저장했답니다.","hl":null},{"n":114,"text":"A baobab tree lived an easy life and thought it could live without water. God was angry and threw it in a dry place. The tree made holes to save water and became fatter.","hl":"sm","rv":"sm","v":"n"},{"n":115,"text":"바오바브나무는 편안한 삶을 살았고 물 없이도 살 수 있다고 생각했어요. 신은 화가 나서 나무를 건조한 곳에 던졌어요. 나무는 물을 저장하려고 구멍들을 만들었고 점점 더 뚱뚱해졌어요.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>God and a Baobab Tree 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":116,"text":"여러분, 오늘 정말 멋졌어요! 바오바브나무가 어려움을 이겨 낸 방법을 꼭 기억해 두세요. 다음 시간에도 재미있는 이야기로 만나요. 수고했어요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
