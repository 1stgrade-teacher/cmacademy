:89,"text":"두 번째 문법은 when으로 때를 말하는 방법이에요. Next는 다음으로, when there is sunlight는 햇빛이 있을 때라는 뜻이에요. plants는 식물은, start to make는 만들기 시작해요, food and oxygen은 양분과 산소라는 뜻이지요. when 뒤에 상황을 말하면 그때 일어나는 일을 자연스럽게 이어 줄 수 있어요.","hl":"gb"},{"n":90,"text":"when은 '~할 때'라는 뜻이에요. 'when there is sunlight'은 '햇빛이 있을 때'예요. 때를 알려 주는 when 뒤에는 그때의 상황을 말해요.","hl":"ge"}]},{"html":"\u003cspan class=\"lp-tag\">확인해요\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-gt\">\u003cspan>⏰\u003c/span>~할 때 when\u003c/div>\u003cdiv class=\"k-ex\" data-hl=\"gx\">\u003cdiv>\u003cspan class=\"e\">🌧️\u003c/span>\u003cb>When it rains, I use an umbrella.\u003c/b>\u003csmall>비가 올 때 나는 우산을 써요.\u003c/small>\u003c/div>\u003cdiv>\u003cspan class=\"e\">🔔\u003c/span>\u003cb>When the bell rings, we go out.\u003c/b>\u003csmall>종이 울릴 때 우리는 밖으로 나가요.\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"k-ck\" data-hl=\"gc\">\u003cdiv class=\"q\">\u003cspan class=\"k-ans\" data-rv=\"gc\">When\u003c/span> there is sunlight, plants make food.\u003c/div>\u003csmall>햇빛이 있을 때 식물은 양분을 만들어요.\u003c/small>\u003cdiv class=\"o\">\u003cspan class=\"k-right\" data-rv=\"gc\">When\u003c/span>\u003cspan>Where\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":91,"text":"예문을 더 볼까요?","hl":"gx"},{"n":92,"text":"When it rains, I use an umbrella.","hl":"gx","v":"n","pause":600},{"n":93,"text":"비가 올 때 나는 우산을 써요.","hl":"gx"},{"n":94,"text":"When the bell rings, we go out.","hl":"gx","v":"n","pause":600},{"n":95,"text":"종이 울릴 때 우리는 밖으로 나가요.","hl":"gx"},{"n":96,"text":"문제를 풀어 볼까요? 빈칸 there is sunlight, plants make food. 빈칸에 들어갈 말은 When, 아니면 Where 중에서 무엇일까요?","hl":"gc"},{"n":97,"text":"정답은 When! When there is sunlight, plants make food.","hl":"gc","rv":"gc"}]},{"html":"\u003cspan class=\"lp-tag\">내용 확인 문제\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-qq\" data-hl=\"q0\">\u003ci>1\u003c/i>\u003cdiv>\u003cdiv class=\"q\">식물은 햇빛에서 나오는 에너지가 필요해요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q0\">O\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q1\">\u003ci>2\u003c/i>\u003cdiv>\u003cdiv class=\"q\">식물은 뿌리 안에서 양분을 만들어요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q1\">X\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q2\">\u003ci>3\u003c/i>\u003cdiv>\u003cdiv class=\"q\">식물이 양분을 만들 때 공기 중에서 사용하는 것은 무엇인가요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 산소\u003c/span>\u003cspan>② 이산화탄소\u003c/span>\u003cspan>③ 햇빛\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q2\">이산화탄소\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q3\">\u003ci>4\u003c/i>\u003cdiv>\u003cdiv class=\"q\">광합성 과정에서 식물 밖으로 나가는 것은 무엇인가요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 양분\u003c/span>\u003cspan>② 물\u003c/span>\u003cspan>③ 산소\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q3\">산소\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":98,"text":"이제 문제를 풀어 볼까요? 글을 다시 떠올리며 O인지 X인지, 알맞은 답을 골라 보세요.","hl":null},{"n":99,"text":"첫 번째 문제. 식물은 햇빛에서 나오는 에너지가 필요해요. 맞으면 O, 틀리면 X예요.","hl":"q0"},{"n":100,"text":"정답은 O, 맞아요.","hl":"q0","rv":"q0"},{"n":101,"text":"두 번째 문제. 식물은 뿌리 안에서 양분을 만들어요. 맞으면 O, 틀리면 X예요.","hl":"q1"},{"n":102,"text":"정답은 X, 틀려요.","hl":"q1","rv":"q1"},{"n":103,"text":"세 번째 문제. 식물이 양분을 만들 때 공기 중에서 사용하는 것은 무엇인가요? 첫 번째, 산소. 두 번째, 이산화탄소. 세 번째, 햇빛","hl":"q2"},{"n":104,"text":"정답은 이산화탄소예요.","hl":"q2","rv":"q2"},{"n":105,"text":"네 번째 문제. 광합성 과정에서 식물 밖으로 나가는 것은 무엇인가요? 첫 번째, 양분. 두 번째, 물. 세 번째, 산소","hl":"q3"},{"n":106,"text":"정답은 산소예요.","hl":"q3","rv":"q3"}]},{"html":"\u003cspan class=\"lp-tag\">이야기 요약하기\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-bank\">\u003cspan>energy\u003c/span>\u003cspan>leaves\u003c/span>\u003cspan>oxygen\u003c/span>\u003cspan>photosynthesis\u003c/span>\u003c/div>\u003cdiv class=\"k-sum\" data-hl=\"sm\">Plants make their food using \u003cspan class=\"k-ans\" data-rv=\"sm\">energy\u003c/span> from sunlight, water, and carbon dioxide. This process is called \u003cspan class=\"k-ans\" data-rv=\"sm\">photosynthesis\u003c/span> and it happens inside the \u003cspan class=\"k-ans\" data-rv=\"sm\">leaves\u003c/span>. Plants take in carbon dioxide and water, make food and \u003cspan class=\"k-ans\" data-rv=\"sm\">oxygen\u003c/span>, and then oxygen leaves the plant.\u003c/div>\u003cdiv class=\"k-sk\">식물은 햇빛의 에너지와 물, 이산화탄소를 이용해 양분을 만들어요. 이 과정은 광합성이라고 불리며 잎 안에서 일어나요. 식물은 이산화탄소와 물을 받아들여 양분과 산소를 만들고, 산소는 식물 밖으로 나가요.\u003c/div>\u003c/div>","segs":[{"n":107,"text":"마지막으로 오늘의 내용을 세 문장으로 정리해 볼게요. 식물은 햇빛의 에너지와 물, 이산화탄소를 이용해 잎에서 양분을 만들고, 이 과정을 photosynthesis라고 불러요.","hl":null},{"n":108,"text":"Plants make their food using energy from sunlight, water, and carbon dioxide. This process is called photosynthesis and it happens inside the leaves. Plants take in carbon dioxide and water, make food and oxygen, and then oxygen leaves the plant.","hl":"sm","rv":"sm","v":"n"},{"n":109,"text":"식물은 햇빛의 에너지와 물, 이산화탄소를 이용해 양분을 만들어요. 이 과정은 광합성이라고 불리며 잎 안에서 일어나요. 식물은 이산화탄소와 물을 받아들여 양분과 산소를 만들고, 산소는 식물 밖으로 나가요.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>Food for Plants 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":110,"text":"여러분, 오늘 식물이 잎에서 양분을 만드는 광합성 과정을 잘 알아보았어요. carbon dioxide, oxygen, photosynthesis 같은 낱말도 기억해 보세요. 참 잘했어요. 다음 시간에 또 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
