=\"q\">작가는 생각이 떠오르면 시끄러운 곳으로 가요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q0\">X\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q1\">\u003ci>2\u003c/i>\u003cdiv>\u003cdiv class=\"q\">편집자는 작가에게 이야기의 좋은 점과 나쁜 점을 알려 줘요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q1\">O\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q2\">\u003ci>3\u003c/i>\u003cdiv>\u003cdiv class=\"q\">작가는 이야기를 쓴 뒤에 누구에게 보내나요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 선생님\u003c/span>\u003cspan>② 편집자\u003c/span>\u003cspan>③ 삽화가\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q2\">편집자\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q3\">\u003ci>4\u003c/i>\u003cdiv>\u003cdiv class=\"q\">이야기에 무엇이 필요해서 삽화가에게 보내나요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 그림\u003c/span>\u003cspan>② 제목\u003c/span>\u003cspan>③ 가격\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q3\">그림\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":114,"text":"이제 문제를 풀어 볼까요? 지문에서 답이 되는 문장을 손가락으로 짚으면서 천천히 풀어 보세요.","hl":null},{"n":115,"text":"첫 번째 문제. 작가는 생각이 떠오르면 시끄러운 곳으로 가요. 맞으면 O, 틀리면 X예요.","hl":"q0"},{"n":116,"text":"정답은 X, 틀려요.","hl":"q0","rv":"q0"},{"n":117,"text":"두 번째 문제. 편집자는 작가에게 이야기의 좋은 점과 나쁜 점을 알려 줘요. 맞으면 O, 틀리면 X예요.","hl":"q1"},{"n":118,"text":"정답은 O, 맞아요.","hl":"q1","rv":"q1"},{"n":119,"text":"세 번째 문제. 작가는 이야기를 쓴 뒤에 누구에게 보내나요? 첫 번째, 선생님. 두 번째, 편집자. 세 번째, 삽화가","hl":"q2"},{"n":120,"text":"정답은 편집자예요.","hl":"q2","rv":"q2"},{"n":121,"text":"네 번째 문제. 이야기에 무엇이 필요해서 삽화가에게 보내나요? 첫 번째, 그림. 두 번째, 제목. 세 번째, 가격","hl":"q3"},{"n":122,"text":"정답은 그림예요.","hl":"q3","rv":"q3"}]},{"html":"\u003cspan class=\"lp-tag\">이야기 요약하기\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-bank\">\u003cspan>editor\u003c/span>\u003cspan>idea\u003c/span>\u003cspan>illustrator\u003c/span>\u003cspan>pictures\u003c/span>\u003c/div>\u003cdiv class=\"k-sum\" data-hl=\"sm\">A book starts from an \u003cspan class=\"k-ans\" data-rv=\"sm\">idea\u003c/span>. The writer writes again and again and sends the story to the \u003cspan class=\"k-ans\" data-rv=\"sm\">editor\u003c/span>. They fix it together, and an \u003cspan class=\"k-ans\" data-rv=\"sm\">illustrator\u003c/span> draws \u003cspan class=\"k-ans\" data-rv=\"sm\">pictures\u003c/span> for it.\u003c/div>\u003cdiv class=\"k-sk\">책은 생각에서 시작해요. 작가는 몇 번이고 쓰고 이야기를 편집자에게 보내요. 함께 고친 뒤 삽화가가 그림을 그리면 책이 될 준비가 돼요.\u003c/div>\u003c/div>","segs":[{"n":123,"text":"오늘 이야기를 쉬운 영어 세 문장으로 정리해 볼게요. 빈칸에 들어갈 낱말을 떠올리며 함께 읽어 보세요.","hl":null},{"n":124,"text":"A book starts from an idea. The writer writes again and again and sends the story to the editor. They fix it together, and an illustrator draws pictures for it.","hl":"sm","rv":"sm","v":"n"},{"n":125,"text":"책은 생각에서 시작해요. 작가는 몇 번이고 쓰고 이야기를 편집자에게 보내요. 함께 고친 뒤 삽화가가 그림을 그리면 책이 될 준비가 돼요.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>Making a New Book 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":126,"text":"여러분, 오늘 정말 잘했어요! 생각 하나가 책이 되기까지의 과정을 멋지게 이해했어요. 다음에는 여러분도 자기만의 이야기를 써 볼 수 있겠죠? 수고했어요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
