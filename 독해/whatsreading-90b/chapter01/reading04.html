:"우리말로 하면, 그러한 감정들은 가끔 우리의 삶을 더 풍요롭게 만들어줍니다.","hl":"ko"},{"n":74,"text":"여기서 Those, 이 말이 가리키는 것은 무엇일까요?","hl":"pt"},{"n":75,"text":"바로 passion, love, fear, and jealousy, 열정, 사랑, 두려움, 그리고 질투예요.","hl":"pt","rv":"pt"},{"n":76,"text":"Those feelings은 앞 문장에 나온 passion, love, fear, and jealousy를 가리켜요. 그래서 '그러한 감정들'이라는 뜻이에요.","hl":"tp"}]},{"html":"\u003cspan class=\"lp-tag\">문단의 요점\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-mb\" data-hl=\"p0\">\u003cspan class=\"e\">📚\u003c/span>\u003cspan class=\"l\">문단 1\u003c/span>\u003cspan class=\"t\">우리는 \u003cb class=\"key\">관심사\u003c/b>에 맞는 책을 고르고, 유용한 정보를 주는 논픽션을 자주 읽어요.\u003c/span>\u003c/div>\u003cdiv class=\"k-mb\" data-hl=\"p1\">\u003cspan class=\"e\">🦸\u003c/span>\u003cspan class=\"l\">문단 2\u003c/span>\u003cspan class=\"t\">소설은 그저 지어낸 이야기가 아니라, 우리를 \u003cb class=\"key\">등장인물\u003c/b>로 만들어 다른 사람의 입장을 느끼게 해 줘요.\u003c/span>\u003c/div>\u003cdiv class=\"k-mb\" data-hl=\"p2\">\u003cspan class=\"e\">🌍\u003c/span>\u003cspan class=\"l\">문단 3\u003c/span>\u003cspan class=\"t\">소설을 읽으면 등장인물의 눈으로 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">세계\u003c/b>를 보고 우리의 생각이 자라요.\u003c/span>\u003c/div>\u003cdiv class=\"k-mb\" data-hl=\"p3\">\u003cspan class=\"e\">💗\u003c/span>\u003cspan class=\"l\">문단 4\u003c/span>\u003cspan class=\"t\">소설에는 인간의 모든 \u003cb class=\"key\">감정\u003c/b>이 담겨 있어서 우리의 삶을 더 풍요롭게 만들어 줘요.\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":77,"text":"첫 번째 문단은 우리가 관심사에 맞는 책을 고르고, 유용한 정보를 주는 논픽션을 자주 읽는다는 이야기예요. 두 번째 문단은 소설이 그저 지어낸 이야기가 아니라 우리를 책 속 등장인물로 만들어 준다고 말해요. 세 번째 문단은 등장인물의 눈으로 세계를 보며 우리의 생각이 자란다는 내용이에요. 마지막 문단은 소설 속에 인간의 모든 감정이 담겨 있어 우리 삶이 더 풍요로워진다는 이야기랍니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">문법을 그림으로\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-gt\">\u003cspan>⏰\u003c/span>~할 때 when\u003c/div>\u003cdiv data-hl=\"gb\">\u003cdiv class=\"gblk\">\u003cdiv class=\"gb r-when\">\u003cspan class=\"gt\">언제\u003c/span>\u003cspan class=\"ge\">When we read fiction\u003c/span>\u003cspan class=\"gk\">우리가 소설을 읽을 때\u003c/span>\u003c/div>\u003cdiv class=\"gb r-do\">\u003cspan class=\"gt\">~해요\u003c/span>\u003cspan class=\"ge\">we become\u003c/span>\u003cspan class=\"gk\">우리는 ~이 돼요\u003c/span>\u003c/div>\u003cdiv class=\"gb r-what\">\u003cspan class=\"gt\">무엇을\u003c/span>\u003cspan class=\"ge\">a character from the book\u003c/span>\u003cspan class=\"gk\">그 책 속의 등장인물\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cdiv data-hl=\"gp\">\u003cdiv class=\"gpic\">\u003cdiv class=\"gpt\">when: 때를 알려 줘요\u003c/div>\u003cdiv class=\"gtl\">\u003cdiv class=\"gpi\">\u003cspan class=\"tk\">소설을 읽는 그때\u003c/span>\u003cdiv class=\"pe\">📖\u003c/div>\u003cdiv class=\"pn\">When we read fiction\u003c/div>\u003c/div>\u003cdiv class=\"gpi\">\u003cspan class=\"tk\">그때 우리는 등장인물이 돼요\u003c/span>\u003cdiv class=\"pe\">🦸\u003c/div>\u003cdiv class=\"pn\">we become a character\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"k-ez\" data-hl=\"ge\">when은 '~할 때'라는 뜻이에요. 'When we read fiction'은 '우리가 소설을 읽을 때'라는 뜻이고, 그 뒤에 그때 일어나는 일을 붙여요. 그래서 \u003cb class=\"key\">when\u003c/b>이 보이면 '아, 때를 말하는구나!' 하고 생각하면 돼요.\u003c/div>\u003c/div>","segs":[{"n":78,"text":"첫 번째 문법은 when이에요. when은 '~할 때'라는 뜻으로, 어떤 일이 일어나는 때를 알려 줘요. 대표 문장을 세 덩어리로 나눠 볼게요. 첫 번째 덩어리 When we read fiction은 '우리가 소설을 읽을 때'라는 뜻이에요. 두 번째 we become은 '우리는 ~이 돼요', 세 번째 a character from the book은 '그 책 속의 등장인물'이라는 뜻이지요. 그래서 when이 보이면 '아, 때를 말하는구나!' 하고 생각하면 된답니다.","hl":"gb"},{"n":79,"text":"when은 '~할 때'라는 뜻이에요. 'When we read fiction'은 '우리가 소설을 읽을 때'라는 뜻이고, 그 뒤에 그때 일어나는 일을 붙여요. 그래서 when이 보이면 '아, 때를 말하는구나!' 하고 생각하면 돼요.","hl":"ge"}]},{"html":"\u003cspan class=\"lp-tag\">확인해요\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-gt\">\u003cspan>⏰\u003c/span>~할 때 when\u003c/div>\u003cdiv class=\"k-ex\" data-hl=\"gx\">\u003cdiv>\u003cspan class=\"e\">🍪\u003c/span>\u003cb>When I am hungry, I eat a snack.\u003c/b>\u003csmall>내가 배고플 때, 나는 간식을 먹어요.\u003c/small>\u003c/div>\u003cdiv>\u003cspan class=\"e\">🌧️\u003c/span>\u003cb>When it rains, we stay home.\u003c/b>\u003csmall>비가 올 때, 우리는 집에 있어요.\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"k-ck\" data-hl=\"gc\">\u003cdiv class=\"q\">\u003cspan class=\"k-ans\" data-rv=\"gc\">When\u003c/span> it is cold, I wear a coat.\u003c/div>\u003csmall>추울 때, 나는 코트를 입어요.\u003c/small>\u003cdiv class=\"o\">\u003cspan class=\"k-right\" data-rv=\"gc\">When\u003c/span>\u003cspan>What\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":80,"text":"예문을 더 볼까요?","hl":"gx"},{"n":81,"text":"When I am hungry, I eat a snack.","hl":"gx","v":"n","pause":600},{"n":82,"text":"내가 배고플 때, 나는 간식을 먹어요.","hl":"gx"},{"n":83,"text":"When it rains, we stay home.","hl":"gx","v":"n","pause":600},{"n":84,"text":"비가 올 때, 우리는 집에 있어요.","hl":"gx"},{"n":85,"text":"문제를 풀어 볼까요? 빈칸 it is cold, I wear a coat. 빈칸에 들어갈 말은 When, 아니면 What 중에서 무엇일까요?","hl":"gc"},{"n":86,"text":"정답은 When! When it is cold, I wear a coat.","hl":"gc","rv":"gc"}]},{"html":"\u003cspan class=\"lp-tag\">문법을 그림으로\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-gt\">\u003cspan>🤝\u003c/span>help + 누구 + 하게 해요\u003c/div>\u003cdiv data-hl=\"gb\">\u003cdiv class=\"gblk\">\u003cdiv class=\"gb r-who\">\u003cspan class=\"gt\">누가\u003c/span>\u003cspan class=\"ge\">This\u003c/span>\u003cspan class=\"gk\">이것은\u003c/span>\u003c/div>\u003cdiv class=\"gb r-do\">\u003cspan class=\"gt\">~해요\u003c/span>\u003cspan class=\"ge\">helps\u003c/span>\u003cspan class=\"gk\">도와줘요\u003c/span>\u003c/div>\u003cdiv class=\"gb r-what\">\u003cspan class=\"gt\">무엇을\u003c/span>\u003cspan class=\"ge\">us\u003c/span>\u003cspan class=\"gk\">우리를\u003c/span>\u003c/div>\u003cdiv class=\"gb r-do\">\u003cspan class=\"gt\">~해요\u003c/span>\u003cspan class=\"ge\">put ourselves\u003c/span>\u003cspan class=\"gk\">우리 자신을 두게\u003c/span>\u003c/div>\u003cdiv class=\"gb r-where\">\u003cspan class=\"gt\">어디서\u003c/span>\u003cspan class=\"ge\">in other people's shoes\u003c/span>\u003cspan class=\"gk\">다른 사람의 입장 안에\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cdiv data-hl=\"gp\">\u003cdiv class=\"gpic\">\u003cdiv class=\"gpt\">help 뒤의 동작 말\u003c/div>\u003cdiv class=\"gpr\">\u003cdiv class=\"gpi\">\u003cdiv class=\"pe\">✅\u003c/div>\u003cdiv class=\"pn\">It helps us see.\u003c/div>\u003cdiv class=\"pk\">help 뒤에 see 그대로 → 맞아요\u003c/div>\u003cspan class=\"mk o\">O\u003c/span>\u003c/div>\u003cdiv class=\"gpi\">\u003cdiv class=\"pe\">❌\u003c/div>\u003cdiv class=\"pn\">It helps us sees.\u003c/div>\u003cdiv class=\"pk\">see에 s를 붙이면 틀려요\u003c/div>\u003cspan class=\"mk x\">X\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"k-ez\" data-hl=\"ge\">help는 '돕다'라는 뜻인데, 'help + 누구 + 동작' 모양으로 쓰면 '누가 ~하도록 도와줘요'가 돼요. 이때 뒤에 오는 동작 말은 모양을 바꾸지 않고 그대로 써요. 그래서 'helps us \u003cb class=\"key\">put\u003c/b>'처럼 put, see, feel을 그대로 쓰면 된답니다.\u003c/div>\u003c/div>","segs":[{"n":87,"text":"두 번째 문법은 help예요. help는 '돕다'라는 뜻인데, help 다음에 사람, 그다음에 동작을 붙이면 '누가 ~하도록 도와줘요'가 돼요. 대표 문장을 다섯 덩어리로 나눠 볼게요. This는 '이것은', helps는 '도와줘요', us는 '우리를'이라는 뜻이에요. 그다음 put ourselves는 '우리 자신을 두게', in other people's shoes는 '다른 사람의 신발 속에, 그러니까 다른 사람 입장에'라는 뜻이지요. 이때 뒤에 오는 동작 말은 모양을 바꾸지 않고 그대로 쓴다는 것, 꼭 기억해 두세요.","hl":"gb"},{"n":88,"text":"help는 '돕다'라는 뜻인데, 'help + 누구 + 동작' 모양으로 쓰면 '누가 ~하도록 도와줘요'가 돼요. 이때 뒤에 오는 동작 말은 모양을 바꾸지 않고 그대로 써요. 그래서 'helps us put'처럼 put, see, feel을 그대로 쓰면 된답니다.","hl":"ge"}]},{"html":"\u003cspan class=\"lp-tag\">확인해요\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-gt\">\u003cspan>🤝\u003c/span>help + 누구 + 하게 해요\u003c/div>\u003cdiv class=\"k-ex\" data-hl=\"gx\">\u003cdiv>\u003cspan class=\"e\">🎵\u003c/span>\u003cb>This song helps me sleep.\u003c/b>\u003csmall>이 노래는 내가 잠들도록 도와줘요.\u003c/small>\u003c/div>\u003cdiv>\u003cspan class=\"e\">🏃\u003c/span>\u003cb>Exercise helps us feel happy.\u003c/b>\u003csmall>운동은 우리가 행복하게 느끼도록 도와줘요.\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"k-ck\" data-hl=\"gc\">\u003cdiv class=\"q\">Music helps us \u003cspan class=\"k-ans\" data-rv=\"gc\">feel\u003c/span> happy.\u003c/div>\u003csmall>음악은 우리가 행복하게 느끼도록 도와줘요.\u003c/small>\u003cdiv class=\"o\">\u003cspan class=\"k-right\" data-rv=\"gc\">feel\u003c/span>\u003cspan>feels\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":89,"text":"예문을 더 볼까요?","hl":"gx"},{"n":90,"text":"This song helps me sleep.","hl":"gx","v":"n","pause":600},{"n":91,"text":"이 노래는 내가 잠들도록 도와줘요.","hl":"gx"},{"n":92,"text":"Exercise helps us feel happy.","hl":"gx","v":"n","pause":600},{"n":93,"text":"운동은 우리가 행복하게 느끼도록 도와줘요.","hl":"gx"},{"n":94,"text":"문제를 풀어 볼까요? Music helps us 빈칸 happy. 빈칸에 들어갈 말은 feel, 아니면 feels 중에서 무엇일까요?","hl":"gc"},{"n":95,"text":"정답은 feel! Music helps us feel happy.","hl":"gc","rv":"gc"}]},{"html":"\u003cspan class=\"lp-tag\">내용 확인 문제\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-qq\" data-hl=\"q0\">\u003ci>1\u003c/i>\u003cdiv>\u003cdiv class=\"q\">글쓴이는 소설도 우리에게 도움이 된다고 말해요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q0\">O\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q1\">\u003ci>2\u003c/i>\u003cdiv>\u003cdiv class=\"q\">글쓴이는 우리가 소설책만 골라서 읽는다고 말해요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q1\">X\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q2\">\u003ci>3\u003c/i>\u003cdiv>\u003cdiv class=\"q\">소설을 읽을 때 우리가 되는 것은 무엇인가요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 책 속의 등장인물\u003c/span>\u003cspan>② 책을 쓴 작가\u003c/span>\u003cspan>③ 논픽션의 정보\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q2\">책 속의 등장인물\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q3\">\u003ci>4\u003c/i>\u003cdiv>\u003cdiv class=\"q\">소설에 담겨 있다고 말한 것은 무엇인가요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 인간의 모든 감정\u003c/span>\u003cspan>② 유용한 정보\u003c/span>\u003cspan>③ 세계 지도\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q3\">인간의 모든 감정\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":96,"text":"이제 문제를 풀어 볼까요? 지문에서 답을 찾을 때는 등장인물, 감정처럼 중요한 낱말을 먼저 눈으로 찾아보면 쉬워요.","hl":null},{"n":97,"text":"첫 번째 문제. 글쓴이는 소설도 우리에게 도움이 된다고 말해요. 맞으면 O, 틀리면 X예요.","hl":"q0"},{"n":98,"text":"정답은 O, 맞아요.","hl":"q0","rv":"q0"},{"n":99,"text":"두 번째 문제. 글쓴이는 우리가 소설책만 골라서 읽는다고 말해요. 맞으면 O, 틀리면 X예요.","hl":"q1"},{"n":100,"text":"정답은 X, 틀려요.","hl":"q1","rv":"q1"},{"n":101,"text":"세 번째 문제. 소설을 읽을 때 우리가 되는 것은 무엇인가요? 첫 번째, 책 속의 등장인물. 두 번째, 책을 쓴 작가. 세 번째, 논픽션의 정보","hl":"q2"},{"n":102,"text":"정답은 책 속의 등장인물예요.","hl":"q2","rv":"q2"},{"n":103,"text":"네 번째 문제. 소설에 담겨 있다고 말한 것은 무엇인가요? 첫 번째, 인간의 모든 감정. 두 번째, 유용한 정보. 세 번째, 세계 지도","hl":"q3"},{"n":104,"text":"정답은 인간의 모든 감정예요.","hl":"q3","rv":"q3"}]},{"html":"\u003cspan class=\"lp-tag\">이야기 요약하기\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-bank\">\u003cspan>character\u003c/span>\u003cspan>feelings\u003c/span>\u003cspan>information\u003c/span>\u003cspan>richer\u003c/span>\u003c/div>\u003cdiv class=\"k-sum\" data-hl=\"sm\">We often read nonfiction for \u003cspan class=\"k-ans\" data-rv=\"sm\">information\u003c/span>, but fiction helps us too. When we read fiction, we become a \u003cspan class=\"k-ans\" data-rv=\"sm\">character\u003c/span> and see the world through their eyes. Fiction has all human \u003cspan class=\"k-ans\" data-rv=\"sm\">feelings\u003c/span> and makes our lives \u003cspan class=\"k-ans\" data-rv=\"sm\">richer\u003c/span>.\u003c/div>\u003cdiv class=\"k-sk\">우리는 정보를 얻으려고 논픽션을 자주 읽지만, 소설도 우리에게 도움이 돼요. 소설을 읽으면 등장인물이 되어 그 눈으로 세상을 보고, 소설에는 인간의 모든 감정이 담겨 있어 우리 삶이 더 풍요로워져요.\u003c/div>\u003c/div>","segs":[{"n":105,"text":"오늘 이야기를 세 문장으로 정리해 볼게요. 논픽션은 정보를 주고, 소설은 우리를 등장인물로 만들어 새로운 세계를 보게 해 주며, 인간의 모든 감정을 느끼게 해 준답니다.","hl":null},{"n":106,"text":"We often read nonfiction for information, but fiction helps us too. When we read fiction, we become a character and see the world through their eyes. Fiction has all human feelings and makes our lives richer.","hl":"sm","rv":"sm","v":"n"},{"n":107,"text":"우리는 정보를 얻으려고 논픽션을 자주 읽지만, 소설도 우리에게 도움이 돼요. 소설을 읽으면 등장인물이 되어 그 눈으로 세상을 보고, 소설에는 인간의 모든 감정이 담겨 있어 우리 삶이 더 풍요로워져요.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>See New Worlds 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":108,"text":"여러분, 오늘 정말 멋지게 읽었어요! 소설을 읽으면 다른 사람의 입장도 느끼고 마음도 자란다는 것을 꼭 기억해요. 다음 시간에도 새로운 세계를 만나러 함께 떠나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
