c/span>\u003c/div>\u003cdiv class=\"gb r-what\">\u003cspan class=\"gt\">무엇을\u003c/span>\u003cspan class=\"ge\">the prince\u003c/span>\u003cspan class=\"gk\">왕자를\u003c/span>\u003c/div>\u003cdiv class=\"gb r-when\">\u003cspan class=\"gt\">언제\u003c/span>\u003cspan class=\"ge\">in the beginning\u003c/span>\u003cspan class=\"gk\">처음에는\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cdiv data-hl=\"gp\">\u003cdiv class=\"gpic\">\u003cdiv class=\"gpt\">meet → doesn't meet\u003c/div>\u003cdiv class=\"gpr\">\u003cdiv class=\"gpi\">\u003cdiv class=\"pe\">👸\u003c/div>\u003cdiv class=\"pn\">meet\u003c/div>\u003cdiv class=\"pk\">만나요\u003c/div>\u003c/div>\u003cspan class=\"gar\">➜\u003c/span>\u003cdiv class=\"gpi\">\u003cdiv class=\"pe\">🚫\u003c/div>\u003cdiv class=\"pn\">doesn't meet\u003c/div>\u003cdiv class=\"pk\">앞에 doesn't를 붙여요\u003c/div>\u003c/div>\u003cspan class=\"gar\">➜\u003c/span>\u003cdiv class=\"gpi\">\u003cdiv class=\"pe\">👠\u003c/div>\u003cdiv class=\"pn\">doesn't let\u003c/div>\u003cdiv class=\"pk\">let 앞에도 doesn't를 붙여요\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"k-ez\" data-hl=\"ge\">지금 그렇지 않다고 말할 때는 동사 앞에 doesn't를 붙여요. doesn't 뒤에는 meet처럼 동사를 \u003cb class=\"key\">그대로\u003c/b> 써요.\u003c/div>\u003c/div>","segs":[{"n":113,"text":"이번에는 doesn't를 볼까요? '그렇지 않아요'라고 말할 때 동사 앞에 붙이는 말이에요. Cinderella doesn't meet the prince in the beginning을 나눠 보면, Cinderella는 '신데렐라는', doesn't meet은 '만나지 않아요', the prince는 '왕자를', in the beginning은 '처음에는'이라는 뜻이에요. doesn't 뒤에는 meet처럼 동사를 그대로 써요. 그래서 신데렐라는 처음에는 왕자를 만나지 않는다고 말할 수 있답니다.","hl":"gb"},{"n":114,"text":"지금 그렇지 않다고 말할 때는 동사 앞에 doesn't를 붙여요. doesn't 뒤에는 meet처럼 동사를 그대로 써요.","hl":"ge"}]},{"html":"\u003cspan class=\"lp-tag\">확인해요\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-gt\">\u003cspan>🚫\u003c/span>~하지 않아요 doesn't\u003c/div>\u003cdiv class=\"k-ex\" data-hl=\"gx\">\u003cdiv>\u003cspan class=\"e\">🥕\u003c/span>\u003cb>She doesn't like carrots.\u003c/b>\u003csmall>그녀는 당근을 좋아하지 않아요.\u003c/small>\u003c/div>\u003cdiv>\u003cspan class=\"e\">⚽\u003c/span>\u003cb>He doesn't play soccer today.\u003c/b>\u003csmall>그는 오늘 축구를 하지 않아요.\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"k-ck\" data-hl=\"gc\">\u003cdiv class=\"q\">My brother \u003cspan class=\"k-ans\" data-rv=\"gc\">doesn't\u003c/span> eat breakfast.\u003c/div>\u003csmall>내 동생은 아침을 먹지 않아요.\u003c/small>\u003cdiv class=\"o\">\u003cspan class=\"k-right\" data-rv=\"gc\">doesn't\u003c/span>\u003cspan>don't\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":115,"text":"예문을 더 볼까요?","hl":"gx"},{"n":116,"text":"She doesn't like carrots.","hl":"gx","v":"n","pause":600},{"n":117,"text":"그녀는 당근을 좋아하지 않아요.","hl":"gx"},{"n":118,"text":"He doesn't play soccer today.","hl":"gx","v":"n","pause":600},{"n":119,"text":"그는 오늘 축구를 하지 않아요.","hl":"gx"},{"n":120,"text":"문제를 풀어 볼까요? My brother 빈칸 eat breakfast. 빈칸에 들어갈 말은 doesn't, 아니면 don't 중에서 무엇일까요?","hl":"gc"},{"n":121,"text":"정답은 doesn't! My brother doesn't eat breakfast.","hl":"gc","rv":"gc"}]},{"html":"\u003cspan class=\"lp-tag\">내용 확인 문제\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-qq\" data-hl=\"q0\">\u003ci>1\u003c/i>\u003cdiv>\u003cdiv class=\"q\">소설은 작가가 상상력으로 만든 이야기예요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q0\">O\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q1\">\u003ci>2\u003c/i>\u003cdiv>\u003cdiv class=\"q\">소설에서 주인공과 적이 싸우는 것은 줄거리예요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q1\">X\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q2\">\u003ci>3\u003c/i>\u003cdiv>\u003cdiv class=\"q\">줄거리를 가장 잘 설명한 것은 무엇일까요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 서로 연결된 사건들의 묶음\u003c/span>\u003cspan>② 주인공과 적\u003c/span>\u003cspan>③ 신데렐라의 계모\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q2\">서로 연결된 사건들의 묶음\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q3\">\u003ci>4\u003c/i>\u003cdiv>\u003cdiv class=\"q\">신데렐라 이야기에서 처음에 일어난 일은 무엇일까요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 신데렐라가 유리 구두를 잃어버려요.\u003c/span>\u003cspan>② 계모가 신데렐라에게 집안일을 모두 시켜요.\u003c/span>\u003cspan>③ 신데렐라가 왕자와 결혼해요.\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q3\">계모가 신데렐라에게 집안일을 모두 시켜요.\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":122,"text":"이제 문제를 풀어 볼까요? 글을 다시 떠올리며 하나씩 풀어 보세요.","hl":null},{"n":123,"text":"첫 번째 문제. 소설은 작가가 상상력으로 만든 이야기예요. 맞으면 O, 틀리면 X예요.","hl":"q0"},{"n":124,"text":"정답은 O, 맞아요.","hl":"q0","rv":"q0"},{"n":125,"text":"두 번째 문제. 소설에서 주인공과 적이 싸우는 것은 줄거리예요. 맞으면 O, 틀리면 X예요.","hl":"q1"},{"n":126,"text":"정답은 X, 틀려요.","hl":"q1","rv":"q1"},{"n":127,"text":"세 번째 문제. 줄거리를 가장 잘 설명한 것은 무엇일까요? 첫 번째, 서로 연결된 사건들의 묶음. 두 번째, 주인공과 적. 세 번째, 신데렐라의 계모","hl":"q2"},{"n":128,"text":"정답은 서로 연결된 사건들의 묶음예요.","hl":"q2","rv":"q2"},{"n":129,"text":"네 번째 문제. 신데렐라 이야기에서 처음에 일어난 일은 무엇일까요? 첫 번째, 신데렐라가 유리 구두를 잃어버려요.. 두 번째, 계모가 신데렐라에게 집안일을 모두 시켜요.. 세 번째, 신데렐라가 왕자와 결혼해요.","hl":"q3"},{"n":130,"text":"정답은 계모가 신데렐라에게 집안일을 모두 시켜요.예요.","hl":"q3","rv":"q3"}]},{"html":"\u003cspan class=\"lp-tag\">이야기 요약하기\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-bank\">\u003cspan>connect\u003c/span>\u003cspan>fiction\u003c/span>\u003cspan>imagination\u003c/span>\u003cspan>plot\u003c/span>\u003c/div>\u003cdiv class=\"k-sum\" data-hl=\"sm\">A writer makes a story with \u003cspan class=\"k-ans\" data-rv=\"sm\">imagination\u003c/span>, and we call it \u003cspan class=\"k-ans\" data-rv=\"sm\">fiction\u003c/span>. Fiction has characters, a problem, and a \u003cspan class=\"k-ans\" data-rv=\"sm\">plot\u003c/span>. The events in a plot \u003cspan class=\"k-ans\" data-rv=\"sm\">connect\u003c/span> with one another and lead to the end.\u003c/div>\u003cdiv class=\"k-sk\">작가는 상상력으로 이야기를 만들고, 우리는 그것을 소설이라고 불러요. 소설에는 등장인물, 문제, 줄거리가 있어요. 줄거리의 사건들은 서로 연결되어 마지막까지 이어져요.\u003c/div>\u003c/div>","segs":[{"n":131,"text":"마지막으로 오늘 읽은 글을 세 문장으로 정리해 볼게요. imagination, fiction, plot, connect, 이 네 낱말만 기억해도 충분해요.","hl":null},{"n":132,"text":"A writer makes a story with imagination, and we call it fiction. Fiction has characters, a problem, and a plot. The events in a plot connect with one another and lead to the end.","hl":"sm","rv":"sm","v":"n"},{"n":133,"text":"작가는 상상력으로 이야기를 만들고, 우리는 그것을 소설이라고 불러요. 소설에는 등장인물, 문제, 줄거리가 있어요. 줄거리의 사건들은 서로 연결되어 마지막까지 이어져요.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>What Is Fiction? 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":134,"text":"여러분, 오늘 정말 잘했어요! 소설에는 등장인물, 문제, 줄거리가 있고, 그 사건들이 서로 이어진다는 것을 알게 되었죠? 다음 시간에도 재미있는 이야기로 만나요. 수고했어요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
