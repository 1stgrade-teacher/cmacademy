3cdiv class=\"k-qq\" data-hl=\"q2\">\u003ci>3\u003c/i>\u003cdiv>\u003cdiv class=\"q\">Marley가 학교 책에서 본 잘못된 점은 무엇이었나요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 책이 너무 비쌌어요\u003c/span>\u003cspan>② 대부분의 책이 백인 남자아이와 개에 관한 것이었어요\u003c/span>\u003cspan>③ 책이 너무 적었어요\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q2\">대부분의 책이 백인 남자아이와 개에 관한 것이었어요\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q3\">\u003ci>4\u003c/i>\u003cdiv>\u003cdiv class=\"q\">Marley와 어머니는 몇 달 만에 책을 몇 권이나 찾았나요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 900권\u003c/span>\u003cspan>② 100권\u003c/span>\u003cspan>③ 9,000권 이상\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q3\">9,000권 이상\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":132,"text":"이제 문제를 풀어 볼까요? 지문을 다시 보면서 답을 찾으면 훨씬 쉬워요.","hl":null},{"n":133,"text":"첫 번째 문제. Marley는 열한 살 때 캠페인을 시작했어요. 맞으면 O, 틀리면 X예요.","hl":"q0"},{"n":134,"text":"정답은 O, 맞아요.","hl":"q0","rv":"q0"},{"n":135,"text":"두 번째 문제. Marley는 책에 대한 이야기를 어머니와 하지 않았어요. 맞으면 O, 틀리면 X예요.","hl":"q1"},{"n":136,"text":"정답은 X, 틀려요.","hl":"q1","rv":"q1"},{"n":137,"text":"세 번째 문제. Marley가 학교 책에서 본 잘못된 점은 무엇이었나요? 첫 번째, 책이 너무 비쌌어요. 두 번째, 대부분의 책이 백인 남자아이와 개에 관한 것이었어요. 세 번째, 책이 너무 적었어요","hl":"q2"},{"n":138,"text":"정답은 대부분의 책이 백인 남자아이와 개에 관한 것이었어요예요.","hl":"q2","rv":"q2"},{"n":139,"text":"네 번째 문제. Marley와 어머니는 몇 달 만에 책을 몇 권이나 찾았나요? 첫 번째, 900권. 두 번째, 100권. 세 번째, 9,000권 이상","hl":"q3"},{"n":140,"text":"정답은 9,000권 이상예요.","hl":"q3","rv":"q3"}]},{"html":"\u003cspan class=\"lp-tag\">이야기 요약하기\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-bank\">\u003cspan>9,000 books\u003c/span>\u003cspan>a campaign\u003c/span>\u003cspan>literature\u003c/span>\u003c/div>\u003cdiv class=\"k-sum\" data-hl=\"sm\">Marley started \u003cspan class=\"k-ans\" data-rv=\"sm\">a campaign\u003c/span> to find books with black girls as main characters. She and her mother found more than \u003cspan class=\"k-ans\" data-rv=\"sm\">9,000 books\u003c/span>. The campaign changed children's \u003cspan class=\"k-ans\" data-rv=\"sm\">literature\u003c/span>.\u003c/div>\u003cdiv class=\"k-sk\">Marley는 흑인 여자아이가 주인공인 책을 찾으려고 캠페인을 시작했어요. 그녀와 어머니는 구천 권이 넘는 책을 찾았고, 그 캠페인은 아동 문학을 바꾸었어요.\u003c/div>\u003c/div>","segs":[{"n":141,"text":"오늘 이야기를 세 문장으로 줄여 볼게요. Marley는 캠페인을 시작했고, 구천 권이 넘는 책을 찾았고, 그 덕분에 아동 문학이 바뀌었어요.","hl":null},{"n":142,"text":"Marley started a campaign to find books with black girls as main characters. She and her mother found more than 9,000 books. The campaign changed children's literature.","hl":"sm","rv":"sm","v":"n"},{"n":143,"text":"Marley는 흑인 여자아이가 주인공인 책을 찾으려고 캠페인을 시작했어요. 그녀와 어머니는 구천 권이 넘는 책을 찾았고, 그 캠페인은 아동 문학을 바꾸었어요.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>An Interview with Marley 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":144,"text":"여러분, 오늘 정말 열심히 공부했어요! Marley처럼 용기 있게 생각하고 행동하면 멋진 변화를 만들 수 있어요. 다음 시간에 또 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
