=\"k-ans\" data-rv=\"gc\">can\u003c/span> get heat from the sun.\u003c/div>\u003csmall>식물은 태양에서 열을 얻을 수 있어요.\u003c/small>\u003cdiv class=\"o\">\u003cspan class=\"k-right\" data-rv=\"gc\">can\u003c/span>\u003cspan>cans\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":101,"text":"예문을 더 볼까요?","hl":"gx"},{"n":102,"text":"I can swim.","hl":"gx","v":"n","pause":600},{"n":103,"text":"나는 수영할 수 있어요.","hl":"gx"},{"n":104,"text":"Birds can fly.","hl":"gx","v":"n","pause":600},{"n":105,"text":"새들은 날 수 있어요.","hl":"gx"},{"n":106,"text":"문제를 풀어 볼까요? Plants 빈칸 get heat from the sun. 빈칸에 들어갈 말은 can, 아니면 cans 중에서 무엇일까요?","hl":"gc"},{"n":107,"text":"정답은 can! Plants can get heat from the sun.","hl":"gc","rv":"gc"}]},{"html":"\u003cspan class=\"lp-tag\">내용 확인 문제\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-qq\" data-hl=\"q0\">\u003ci>1\u003c/i>\u003cdiv>\u003cdiv class=\"q\">과학에서 heat는 더운 날씨만을 뜻하나요?\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q0\">X\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q1\">\u003ci>2\u003c/i>\u003cdiv>\u003cdiv class=\"q\">열은 더 시원한 곳에서 더 뜨거운 곳으로 이동해요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q1\">X\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q2\">\u003ci>3\u003c/i>\u003cdiv>\u003cdiv class=\"q\">우리가 요리할 때 열은 무엇을 하나요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 음식을 요리해요\u003c/span>\u003cspan>② 집을 시원하게 해요\u003c/span>\u003cspan>③ 몸을 따뜻하게 해요\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q2\">음식을 요리해요\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q3\">\u003ci>4\u003c/i>\u003cdiv>\u003cdiv class=\"q\">식물은 어디에서 열에너지를 얻나요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 태양\u003c/span>\u003cspan>② 바람\u003c/span>\u003cspan>③ 물\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q3\">태양\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":108,"text":"이제 문제를 풀어 볼까요? 문장을 찾아가며 답을 확인해 보세요.","hl":null},{"n":109,"text":"첫 번째 문제. 과학에서 heat는 더운 날씨만을 뜻하나요? 맞으면
