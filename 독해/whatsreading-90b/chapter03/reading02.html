m\">Our \u003cspan class=\"k-ans\" data-rv=\"sm\">island\u003c/span> is small. At first nobody listened to our teacher, but Mr. Brian put up a \u003cspan class=\"k-ans\" data-rv=\"sm\">wind turbine\u003c/span>. Now everyone makes \u003cspan class=\"k-ans\" data-rv=\"sm\">energy\u003c/span> in many ways, so we can make a \u003cspan class=\"k-ans\" data-rv=\"sm\">huge\u003c/span> difference.\u003c/div>\u003cdiv class=\"k-sk\">우리 섬은 작아요. 처음에는 아무도 선생님 말을 듣지 않았지만, Brian 씨가 풍력 발전기를 세웠어요. 이제 모두가 여러 방법으로 에너지를 만들어서, 우리는 거대한 변화를 가져올 수 있어요.\u003c/div>\u003c/div>","segs":[{"n":127,"text":"마지막으로 오늘 이야기를 세 문장으로 정리해 볼까요? 빈칸에 들어갈 낱말을 함께 찾아보아요.","hl":null},{"n":128,"text":"Our island is small. At first nobody listened to our teacher, but Mr. Brian put up a wind turbine. Now everyone makes energy in many ways, so we can make a huge difference.","hl":"sm","rv":"sm","v":"n"},{"n":129,"text":"우리 섬은 작아요. 처음에는 아무도 선생님 말을 듣지 않았지만, Brian 씨가 풍력 발전기를 세웠어요. 이제 모두가 여러 방법으로 에너지를 만들어서, 우리는 거대한 변화를 가져올 수 있어요.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>A Small Change 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":130,"text":"여러분, 오늘 아주 멋진 이야기를 읽었어요. 작은 섬도 지혜를 모으면 거대한 변화를 만들 수 있다는 걸 꼭 기억해요. 다음 시간에 또 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
