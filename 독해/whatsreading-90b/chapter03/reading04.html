\u003c/span>\u003cspan>burned\u003c/span>\u003cspan>delicious\u003c/span>\u003cspan>oven\u003c/span>\u003c/div>\u003cdiv class=\"k-sum\" data-hl=\"sm\">Larry \u003cspan class=\"k-ans\" data-rv=\"sm\">burned\u003c/span> the toast, so Kate made muffins. She put the batter into a pan and baked it in the \u003cspan class=\"k-ans\" data-rv=\"sm\">oven\u003c/span>. The heat went \u003cspan class=\"k-ans\" data-rv=\"sm\">all around\u003c/span> the muffins, and they smelled \u003cspan class=\"k-ans\" data-rv=\"sm\">delicious\u003c/span>.\u003c/div>\u003cdiv class=\"k-sk\">Larry가 토스트를 태워서 Kate가 머핀을 만들었어요. 그녀는 반죽을 팬에 넣고 오븐에 구웠어요. 열이 머핀 사방으로 퍼졌고, 머핀은 맛있는 냄새가 났어요.\u003c/div>\u003c/div>","segs":[{"n":123,"text":"오늘 이야기를 세 문장으로 줄여 볼게요. Larry는 토스트를 태웠고, Kate는 오븐에 머핀을 구웠어요. 열이 사방으로 퍼져서 머핀은 아주 맛있는 냄새가 났답니다.","hl":null},{"n":124,"text":"Larry burned the toast, so Kate made muffins. She put the batter into a pan and baked it in the oven. The heat went all around the muffins, and they smelled delicious.","hl":"sm","rv":"sm","v":"n"},{"n":125,"text":"Larry가 토스트를 태워서 Kate가 머핀을 만들었어요. 그녀는 반죽을 팬에 넣고 오븐에 구웠어요. 열이 머핀 사방으로 퍼졌고, 머핀은 맛있는 냄새가 났어요.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>Muffins in the Oven 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":126,"text":"여러분, 오늘 아주 잘했어요! 지난 일은 동사에 -ed를 붙이고, 안으로는 into, 밖으로는 out of라는 것도 꼭 기억해요. 다음 시간에도 재미있는 이야기로 만나요, 안녕!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
