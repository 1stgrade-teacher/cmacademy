을 날리다', and는 '그리고', make electricity는 '전기를 만들다'예요. 그래서 바람 에너지는 연도 날리고 전기도 만들 수 있다는 뜻이 돼요. can이 들어가면 무엇이든 자신 있게 '할 수 있어요'라고 말할 수 있답니다.","hl":"gb"},{"n":87,"text":"can은 동사 앞에 붙어서 '~할 수 있어요'라는 뜻을 만들어요. 마치 우리 몸에 날개가 달리는 것처럼, 할 수 있는 일을 자신 있게 말할 수 있게 해 줘요.","hl":"ge"}]},{"html":"\u003cspan class=\"lp-tag\">확인해요\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-gt\">\u003cspan>💪\u003c/span>~할 수 있어요 can\u003c/div>\u003cdiv class=\"k-ex\" data-hl=\"gx\">\u003cdiv>\u003cspan class=\"e\">🏊\u003c/span>\u003cb>I can swim.\u003c/b>\u003csmall>나는 수영할 수 있어요.\u003c/small>\u003c/div>\u003cdiv>\u003cspan class=\"e\">🐟\u003c/span>\u003cb>A fish can't walk.\u003c/b>\u003csmall>물고기는 걸을 수 없어요.\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"k-ck\" data-hl=\"gc\">\u003cdiv class=\"q\">Birds \u003cspan class=\"k-ans\" data-rv=\"gc\">can\u003c/span> fly in the sky.\u003c/div>\u003csmall>새는 하늘을 날 수 있어요.\u003c/small>\u003cdiv class=\"o\">\u003cspan class=\"k-right\" data-rv=\"gc\">can\u003c/span>\u003cspan>can't\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":88,"text":"예문을 더 볼까요?","hl":"gx"},{"n":89,"text":"I can swim.","hl":"gx","v":"n","pause":600},{"n":90,"text":"나는 수영할 수 있어요.","hl":"gx"},{"n":91,"text":"A fish can't walk.","hl":"gx","v":"n","pause":600},{"n":92,"text":"물고기는 걸을 수 없어요.","hl":"gx"},{"n":93,"text":"문제를 풀어 볼까요? Birds 빈칸 fly in the sky. 빈칸에 들어갈 말은 can, 아니면 can't 중에서 무엇일까요?","hl":"gc"},{"n":94,"text":"정답은 can! Birds can fly in the sky.","hl":"gc","rv":"gc"}]},{"html":"\u003cspan class=\"lp-tag\">문법을 그림으로\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-gt\">\u003cspan>☀️\u003c/span>~때문에 because of\u003c/div>\u003cdiv data-hl=\"gb\">\u003cdiv class=\"gblk\">\u003cdiv class=\"gb r-who\">\u003cspan class=\"gt\">누가\u003c/span>\u003cspan class=\"ge\">Plants and animals\u003c/span>\u003cspan class=\"gk\">식물과 동물은\u003c/span>\u003c/div>\u003cdiv class=\"gb r-do\">\u003cspan class=\"gt\">~해요\u003c/span>\u003cspan class=\"ge\">grow\u003c/span>\u003cspan class=\  얻나요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 음식\u003c/span>\u003cspan>② 바람\u003c/span>\u003cspan>③ 불\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q3\">음식\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":104,"text":"이제 문제를 풀어 볼까요? 지문을 다시 한번 보면서 답을 찾으면 어렵지 않아요.","hl":null},{"n":105,"text":"첫 번째 문제. 우리는 눈으로 에너지를 볼 수 있다. 맞으면 O, 틀리면 X예요.","hl":"q0"},{"n":106,"text":"정답은 X, 틀려요.","hl":"q0","rv":"q0"},{"n":107,"text":"두 번째 문제. 음식은 우리 몸을 위한 연료와 같다. 맞으면 O, 틀리면 X예요.","hl":"q1"},{"n":108,"text":"정답은 O, 맞아요.","hl":"q1","rv":"q1"},{"n":109,"text":"세 번째 문제. 바람의 에너지로 할 수 있는 일 두 가지는 무엇인가요? 첫 번째, 연 날리기와 전기 만들기. 두 번째, 요리하기와 자라기. 세 번째, 수영하기와 걷기","hl":"q2"},{"n":110,"text":"정답은 연 날리기와 전기 만들기예요.","hl":"q2","rv":"q2"},{"n":111,"text":"네 번째 문제. 우리 몸은 어디에서 에너지를 얻나요? 첫 번째, 음식. 두 번째, 바람. 세 번째, 불","hl":"q3"},{"n":112,"text":"정답은 음식예요.","hl":"q3","rv":"q3"}]},{"html":"\u003cspan class=\"lp-tag\">이야기 요약하기\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-bank\">\u003cspan>food\u003c/span>\u003cspan>forms\u003c/span>\u003cspan>heat\u003c/span>\u003cspan>light\u003c/span>\u003c/div>\u003cdiv class=\"k-sum\" data-hl=\"sm\">Energy is everywhere in different \u003cspan class=\"k-ans\" data-rv=\"sm\">forms\u003c/span>. The sun gives us \u003cspan class=\"k-ans\" data-rv=\"sm\">heat\u003c/span> and \u003cspan class=\"k-ans\" data-rv=\"sm\">light\u003c/span>, and wind and fire give us energy too. Our body gets energy from \u003cspan class=\"k-ans\" data-rv=\"sm\">food\u003c/span>, like fuel.\u003c/div>\u003cdiv class=\"k-sk\">에너지는 여러 가지 형태로 어디에나 있어요. 태양은 열과 빛을 주고, 바람과 불도 에너지를 줘요. 우리 몸은 연료처럼 음식에서 에너지를 얻어요.\u003c/div>\u003c/div>","segs":[{"n":113,"text":"마지막으로 오늘 이야기를 세 문장으로 정리해 봐요. 에너지는 여러 형태로 어디에나 있고, 우리 몸은 음식에서 에너지를 얻는다는 것을 기억하면 끝!","hl":null},{"n":114,"text":"Energy is everywhere in different forms. The sun gives us heat and light, and wind and fire give us energy too. Our body gets energy from food, like fuel.","hl":"sm","rv":"sm","v":"n"},{"n":115,"text":"에너지는 여러 가지 형태로 어디에나 있어요. 태양은 열과 빛을 주고, 바람과 불도 에너지를 줘요. 우리 몸은 연료처럼 음식에서 에너지를 얻어요.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>Energy around Us 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":116,"text":"여러분, 오늘 정말 잘했어요! 눈에 보이지 않는 에너지를 햇빛, 바람, 불, 음식에서 찾아낼 수 있게 되었네요. 다음에도 우리 주변의 신기한 과학 이야기를 함께 읽어 봐요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
