<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>What's Reading 70 A Ch1 Unit 04 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"What's Reading 70 A Ch1 Unit 04","audioDir":"reading04_audio","preview":false,"count":48,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.923em\">Ch1\u003cbr>Unit\u003cbr>04\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">What's Reading 70 A\u003c/div>\u003ch1>Why Pandas Have Black Circles\u003c/h1>\u003ch2>판다는 왜 눈가가 검을까요?\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">한 줄 요약\u003c/span>\u003cspan>네 명의 \u003cb class=\"key\">아름답고 \u003c/b>\u003cb class=\"key\">친절한 \u003c/b>\u003cb class=\"key\">소녀들\u003c/b>이 배고픈 호랑이로부터 아기 판다를 구했지만, 소녀들은 호랑이에게 죽었어요. 나중에 판다 가족이 와서 오랫동안 울었고, 그 \u003cb class=\"key\">눈물\u003c/b>이 눈 주위에 \u003cb class=\"key\">검은 \u003c/b>\u003cb class=\"key\">원\u003c/b>을 만들어 영원히 남았다는 이야기예요.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Four kind girls saved a baby panda, and the panda family's tears made the black circles around pandas' eyes.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘도 만나서 정말 반가워요. 오늘은 조금 슬프지만 마음이 따뜻해지는 옛이야기를 읽어 볼 거예요. 제목은 Why Pandas Have Black Circles, 우리말로 하면 판다는 왜 눈가가 검을까요, 라는 이야기예요. 네 명의 착한 소녀와 아기 판다가 나오는 짧은 신화를 함께 읽어 봐요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">미리 알면 쉬워요\u003c/span>\u003cdiv class=\"lp-box\">판다는 대나무를 아주 좋아하는 동물이에요. 판다는 눈 주위가 동글동글 검은데, 이 이야기는 그 이유를 설명하는 \u003cb class=\"key\">신화\u003c/b>(myth)예요. 신화는 옛날사람들이 궁금한 것을 재미있는 이야기로 풀어 낸 것이지요. 눈물은 영어로 tear, 원은 circle이라고 해요. 여러분도 슬퍼서 눈이 빨개진 적 있죠? 이 이야기 속 판다도 \u003cb class=\"key\">눈물\u003c/b> 때문에 눈가가 검어졌다고 해요.\u003c/div>","segs":[{"n":2,"text":"여러분, 판다는 대나무를 아주 좋아하는 동물이죠? 그런데 판다 눈을 가까이서 본 적 있나요? 판다는 눈 주위가 동글동글 검은데, 이 이야기는 그 이유를 설명하는 신화예요. 신화는 옛날사람들이 궁금한 것을 재미있는 이야기로 풀어 낸 거예요. 눈물은 영어로 tear, 원은 circle이라고 해요. 여러분도 슬퍼서 눈이 빨개진 적 있죠? 이 이야기 속 판다도 눈물 때문에 눈가가 검어졌다고 해요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>소녀들과 아기 판다\u003csmall>시작 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>네 명의 \u003cb class=\"key\">아름답고 \u003c/b>\u003cb class=\"key\">친절한 \u003c/b>\u003cb class=\"key\">소녀들\u003c/b>이 있었어요. 어느 날 그들은 \u003cb class=\"key\">혼자 \u003c/b>\u003cb class=\"key\">있는 \u003c/b>\u003cb class=\"key\">아기 \u003c/b>\u003cb class=\"key\">판다\u003c/b>를 발견했어요. 아기 판다는 아무도 없이 외로워 보였어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>호랑이의 습격\u003csmall>문제 · 문장 4–7\u003c/small>\u003c/h4>\u003cp>배고픈 \u003cb class=\"key\">호랑이\u003c/b>가 나타나 아기 판다를 공격하려고 했어요. 소녀들은 호랑이로부터 판다를 \u003cb class=\"key\">구했어요\u003c/b>. 하지만 호랑이는 소녀들을 \u003cb class=\"key\">죽였어요\u003c/b>.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>판다 가족의 눈물\u003csmall>바뀜 · 문장 8–10\u003c/small>\u003c/h4>\u003cp>나중에 \u003cb class=\"key\">판다 \u003c/b>\u003cb class=\"key\">가족\u003c/b>이 나타났어요. 가족은 소녀들을 보고 울었어요. 그들은 \u003cb class=\"key\">오랫동안\u003c/b> 울었어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>검은 원의 탄생\u003csmall>결과 · 문장 11–12\u003c/small>\u003c/h4>\u003cp>그들의 \u003cb class=\"key\">눈물\u003c/b>이 눈 주위에 검은 \u003cb class=\"key\">원\u003c/b>을 만들었어요. 그 검은 원은 \u003cb class=\"key\">영원히\u003c/b> 남았어요. 이것이 판다 눈가가 검은 까닭이에요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 이제 사건이 일어난 순서를 따라가며 이야기를 읽어 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계에서는 네 명의 아름답고 친절한 소녀들이 나와요. 어느 날 소녀들은 숲에서 혼자 있는 아기 판다를 발견하지요. 아기 판다는 아무도 없이 아주 외로워 보였어요.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 배고픈 호랑이가 나타나요. 호랑이는 아기 판다를 공격하려고 했어요. 그때 소녀들이 나서서 판다를 구했어요. 하지만 안타깝게도 호랑이는 소녀들을 죽였어요.","hl":"f1"},{"n":6,"text":"세 번째 단계에서는 판다 가족이 나타나요. 나중에 판다 가족이 와서 소녀들을 보고 울었어요. 그들은 오랫동안 울었지요. 자기들을 도와준 소녀들을 잃은 마음이 아주 컸던 거예요.","hl":"f2"},{"n":7,"text":"마지막 단계에서는 눈물이 검은 원을 만들어요. 판다 가족의 눈물이 눈 주위에 검은 원을 만들었어요. 그 검은 원은 영원히 남았어요. 그래서 오늘날 판다 눈가가 검다고 이야기하는 거예요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">이야기 순서(처음-가운데-끝)\u003c/span>\u003cspan class=\"lp-pill\">끝\u003c/span>\u003cspan class=\"lp-pill\">주제문 12번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 일이 일어난 \u003cb class=\"key\">순서\u003c/b>대로 쓰였어요. 소녀들이 판다를 만나고, 호랑이가 나타나고, 판다 가족이 우는 차례대로 이어져요. 글의 중심 문장은 마지막 문장으로, 판다 눈가의 \u003cb class=\"key\">검은 \u003c/b>\u003cb class=\"key\">원\u003c/b>이 왜 생겼는지 알려 줘요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>One day (2)\u003c/b>\u003cspan>때를 알려 줌\u003c/span>\u003cb>But (7)\u003c/b>\u003cspan>반대 내용을 이어 줌\u003c/span>\u003cb>Later (8)\u003c/b>\u003cspan>순서를 알려 줌\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">a baby panda\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the baby panda\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the panda\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the panda family\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the family\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 일이 일어난 순서대로 쓰인 이야기 글이에요. 중심 문장은 맨 마지막 문장이고, 판다 눈가의 검은 원이 왜 생겼는지 알려 주지요. 그래서 읽을 때는 마지막 문장을 특히 눈여겨보면 좋아요.","hl":"ty"},{"n":9,"text":"글의 길잡이 말도 잘 살펴보세요. One day는 때를 알려 주고, Later는 시간이 지났다는 순서를 알려 줘요. But은 앞과 반대되는 내용이 온다고 알려 주지요. 같은 판다도 a baby panda, the baby panda, the panda family, the family처럼 이름이 조금씩 바뀌어 나와요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 단어\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>beautiful\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>아름다운\u003c/span>\u003c/div>\u003cdiv>\u003cb>kind\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>친절한\u003c/span>\u003c/div>\u003cdiv>\u003cb>find\u003c/b>\u003cem>동사\u003c/em>\u003cspan>발견하다 (과거형 found)\u003c/span>\u003c/div>\u003cdiv>\u003cb>alone\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>혼자인\u003c/span>\u003c/div>\u003cdiv>\u003cb>hungry\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>배고픈\u003c/span>\u003c/div>\u003cdiv>\u003cb>tiger\u003c/b>\u003cem>명사\u003c/em>\u003cspan>호랑이\u003c/span>\u003c/div>\u003cdiv>\u003cb>show up\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>나타나다 (과거형 showed up)\u003c/span>\u003c/div>\u003cdiv>\u003cb>try\u003c/b>\u003cem>동사\u003c/em>\u003cspan>하려고 하다 (과거형 tried)\u003c/span>\u003c/div>\u003cdiv>\u003cb>attack\u003c/b>\u003cem>동사\u003c/em>\u003cspan>공격하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>save\u003c/b>\u003cem>동사\u003c/em>\u003cspan>구하다 (과거형 saved)\u003c/span>\u003c/div>\u003cdiv>\u003cb>kill\u003c/b>\u003cem>동사\u003c/em>\u003cspan>죽이다 (과거형 killed)\u003c/span>\u003c/div>\u003cdiv>\u003cb>later\u003c/b>\u003cem>부사\u003c/em>\u003cspan>나중에\u003c/span>\u003c/div>\u003cdiv>\u003cb>family\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가족\u003c/span>\u003c/div>\u003cdiv>\u003cb>cry\u003c/b>\u003cem>동사\u003c/em>\u003cspan>울다 (과거형 cried)\u003c/span>\u003c/div>\u003cdiv>\u003cb>tear\u003c/b>\u003cem>명사\u003c/em>\u003cspan>눈물\u003c/span>\u003c/div>\u003cdiv>\u003cb>make\u003c/b>\u003cem>동사\u003c/em>\u003cspan>만들다 (과거형 made)\u003c/span>\u003c/div>\u003cdiv>\u003cb>circle\u003c/b>\u003cem>명사\u003c/em>\u003cspan>원, 동그라미\u003c/span>\u003c/div>\u003cdiv>\u003cb>around\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~주위에\u003c/span>\u003c/div>\u003cdiv>\u003cb>stay\u003c/b>\u003cem>동사\u003c/em>\u003cspan>남다 (과거형 stayed)\u003c/span>\u003c/div>\u003cdiv>\u003cb>forever\u003c/b>\u003cem>부사\u003c/em>\u003cspan>영원히\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"오늘의 단어도 소리 내어 읽어 볼게요. alone은 혼자인, hungry는 배고픈, showed up은 나타났다라는 뜻이에요. saved는 구했다, killed는 죽였다, forever는 영원히라는 뜻이지요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">kind\u003c/b>\u003cspan class=\"m\">친절한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">nice\u003c/span>\u003cspan class=\"s\">friendly\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">mean\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">alone\u003c/b>\u003cspan class=\"m\">혼자인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">by oneself\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">together\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">hungry\u003c/b>\u003cspan class=\"m\">배고픈\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">starving\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">full\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">saved\u003c/b>\u003cspan class=\"m\">구했다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">helped\u003c/span>\u003cspan class=\"s\">rescued\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">killed\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">cried\u003c/b>\u003cspan class=\"m\">울었다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">sobbed\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">laughed\u003c/span>\u003cspan class=\"a\">smiled\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">forever\u003c/b>\u003cspan class=\"m\">영원히\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">always\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">never\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"비슷한 말과 반대말도 함께 익혀 봐요. kind는 친절한이라는 뜻이고 nice나 friendly와 비슷해요. alone은 혼자인이고 together는 반대말이에요. hungry의 비슷한 말은 starving, 반대말은 full이에요. saved는 helped나 rescued와 비슷하고, cried의 반대말은 laughed예요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~이 있었습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">were\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">네 명의 아름다운\u003c/span>\u003cspan class=\"en\">four \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">beautiful \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 친절한 소녀들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">kind\u003c/span> girls.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">네 명의 아름답고 친절한 소녀들이 있었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이야기의 시작으로, \u003cb class=\"key\">아름답고 \u003c/b>\u003cb class=\"key\">친절한\u003c/b> 소녀 네 명이 \u003cb class=\"key\">있었다\u003c/b>고 알려 줘요. 앞으로 이 소녀들이 어떤 일을 겪을지 궁금하게 만들어 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">~이 있다(There is/are)\u003c/span> : There + 있다(be동사) + 무엇이 → ~이 있다 : \"~이 있었습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 꾸며 주는 말(beautiful) + and + 꾸며 주는 말(kind) : \"아름답고 친절한\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"There were, ~이 있었습니다. four beautiful, 네 명의 아름다운. and kind girls, 그리고 친절한 소녀들이. 이 문장 전체를 해석하면, 네 명의 아름답고 친절한 소녀들이 있었습니다.","hl":"m"},{"n":13,"text":"이 문장은 이야기의 시작이에요. 아름답고 친절한 소녀 네 명이 있었다고 알려 주죠. 앞으로 어떤 일이 생길지 궁금해지지요?","hl":"mn"},{"n":14,"text":"첫 번째로, 무엇이 있다는 말은 There is나 There are로 시작해요. 지난 일이라서 were를 썼어요. 두 번째로, and는 두 가지를 이어 주는 말이에요. 그래서 beautiful and kind는 아름답고 친절하다는 뜻이 된답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어느 날,\u003c/span>\u003cspan class=\"en\">One day,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 발견했어요\u003c/span>\u003cspan class=\"en\">they \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">found\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아기 판다 한 마리를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">baby \u003c/span>\u003cspan class=\"tgt\">panda\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어느 날, 그들은 아기 판다 한 마리를 발견했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 소녀들이 \u003cb class=\"key\">아기 \u003c/b>\u003cb class=\"key\">판다\u003c/b> 한 마리를 발견한 장면이에요. 이야기가 본격적으로 \u003cb class=\"key\">시작\u003c/b>되는 부분이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(they) + 했어요(found) + 무엇을(a baby panda) : \"발견했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">무엇을(목적어)\u003c/span> : 누가(they) + 발견했어요(found) + 무엇을(a baby panda) : \"아기 판다 한 마리를\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"One day, 어느 날. they found, 그들은 발견했어요. a baby panda, 아기 판다 한 마리를. 이 문장 전체를 해석하면, 어느 날, 그들은 아기 판다 한 마리를 발견했습니다.","hl":"m"},{"n":16,"text":"소녀들이 아기 판다 한 마리를 발견한 장면이에요. 이야기가 본격적으로 시작되는 부분이죠.","hl":"mn"},{"n":17,"text":"첫 번째로, found는 find의 과거형이에요. 지난 일이라서 모양이 바뀌었죠. 두 번째로, a baby panda는 무엇을 발견했는지 알려 주는 목적어예요. 그래서 아기 판다 한 마리를라고 해석한답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아기 판다는\u003c/span>\u003cspan class=\"en\">The baby panda\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">혼자였습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was\u003c/span> \u003cspan class u003cb>의미\u003c/b> 판다 가족이 \u003cb class=\"key\">오랫동안\u003c/b> 울었다는 것을 알려 주는 문장이에요. 눈물이 아주 많이 났다는 \u003cb class=\"key\">슬픔\u003c/b>을 보여 주죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거형(규칙 동사 과거형)\u003c/span> : 그들은(They) + 울었다(cried) : \"울었습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사(시간의 길이)\u003c/span> : for + 시간 덩어리(a long time) = 그 시간 동안 : \"오랫동안\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"They cried, 그들은 울었습니다. for a long time, 오랫동안. 이 문장 전체를 해석하면, 그들은 오랫동안 울었습니다.","hl":"m"},{"n":40,"text":"판다 가족이 눈물을 아주 오래 흘렸다는 뜻이에요. 슬픔이 얼마나 컸는지 짐작할 수 있죠.","hl":"mn"},{"n":41,"text":"첫 번째, cried는 지나간 일을 말하는 과거형이에요. cry에 -ed를 붙일 때는 y를 i로 바꿔서 cried라고 해요. 두 번째, for a long time은 시간을 나타내는 짝꿍 말로 오랫동안이라는 뜻이에요. 아주 자연스러운 표현이니 꼭 익혀 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 눈물은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Their\u003c/span> tears\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">검은 원을 만들었습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">made\u003c/span> black circles\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 눈 주위에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">around \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">eyes\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들의 눈물은 눈 주위에 검은 원을 만들었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 눈물 때문에 눈 주위가 검게 변했다는 걸 알려 주는 문장이에요. 이 이야기에서 가장 중요한 \u003cb class=\"key\">장면\u003c/b>이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">소유격(대명사 소유격)\u003c/span> : 그들의(Their) + 무엇(tears) : \"그들의\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거형(불규칙 과거형)\u003c/span> : 무엇이(Their tears) + 했다(made) + 무엇을(black circles) : \"만들었습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사(장소)\u003c/span> : around + 무엇(their eyes) = 무엇의 주위에 : \"그들의 눈 주위에\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"Their tears, 그들의 눈물은. made black circles, 검은 원을 만들었습니다. around their eyes, 그들의 눈 주위에. 이 문장 전체를 해석하면, 그들의 눈물은 눈 주위에 검은 원을 만들었습니다.","hl":"m"},{"n":43,"text":"눈물이 눈 주위에 검은 동그라미를 만들었다는 뜻이에요. 판다 눈에 검은 부분이 생긴 까닭을 알려 주는 문장이죠.","hl":"mn"},{"n":44,"text":"첫 번째, Their는 '그들의'라는 뜻으로 뒤에 오는 명사를 꾸며 주는 말이에요. 두 번째, made는 make의 불규칙 과거형이라서 '만들었습니다'라는 뜻이 돼요. 세 번째, around는 '주위에'라는 장소를 알려 주는 짝꿍 말이에요. 이 세 가지를 한 문장에서 다 찾았으니 정말 잘했어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 12\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">검은 원은\u003c/span>\u003cspan class=\"en\">The black circles\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 눈 주위에\u003c/span>\u003cspan class=\"en\">around their eyes\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">영원히 남았습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">stayed\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">forever\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">눈 주위의 검은 원은 영원히 남았습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이야기의 \u003cb class=\"key\">결말\u003c/b>을 보여 주는 문장이에요. 눈 주위의 검은 원이 지금까지 \u003cb class=\"key\">영원히\u003c/b> 남아 있다는 뜻이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거형(규칙 동사 과거형)\u003c/span> : 무엇이(The black circles) + 남았다(stayed) : \"남았습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부사\u003c/span> : 동사(stayed) + 더 자세히(forever) : \"영원히\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"The black circles, 검은 원은. around their eyes, 그들의 눈 주위에. stayed forever, 영원히 남았습니다. 이 문장 전체를 해석하면, 눈 주위의 검은 원은 영원히 남았습니다.","hl":"m"},{"n":46,"text":"판다 눈 주위의 검은 원이 영원히 사라지지 않았다는 뜻이에요. 이야기를 마무리하는 결말 문장이죠.","hl":"mn"},{"n":47,"text":"첫 번째, stayed는 stay에 -ed를 붙인 과거형이에요. e로 끝나는 단어는 d만 붙여서 stayed라고 해요. 두 번째, forever는 '얼마나 오래'인지 더 자세히 알려 주는 부사라서 영원히라는 뜻이 돼요. 오늘 세 문장 모두 멋지게 해냈어요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">오늘 배운 내용 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>네 명의 \u003cb class=\"key\">아름다운 \u003c/b>\u003cb class=\"key\">소녀들\u003c/b>이 혼자 있는 \u003cb class=\"key\">아기 \u003c/b>\u003cb class=\"key\">판다\u003c/b>를 구했어요.\u003c/li>\u003cli>호랑이가 나타나 판다를 공격하려 했고, 소녀들을 \u003cb class=\"key\">죽였어요\u003c/b>.\u003c/li>\u003cli>판다 가족은 소녀들을 보고 \u003cb class=\"key\">오랫동안\u003c/b> 울었어요.\u003c/li>\u003cli>그 눈물이 눈 주위에 \u003cb class=\"key\">검은 \u003c/b>\u003cb class=\"key\">원\u003c/b>을 만들었고, 그 원은 영원히 남았어요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Four kind girls saved a baby panda, and the panda family's tears made the black circles around pandas' eyes.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">네 명의 \u003cb class=\"key\">아름답고 \u003c/b>\u003cb class=\"key\">친절한 \u003c/b>\u003cb class=\"key\">소녀들\u003c/b>이 배고픈 호랑이로부터 아기 판다를 구했지만, 소녀들은 호랑이에게 죽었어요. 나중에 판다 가족이 와서 오랫동안 울었고, 그 \u003cb class=\"key\">눈물\u003c/b>이 눈 주위에 \u003cb class=\"key\">검은 \u003c/b>\u003cb class=\"key\">원\u003c/b>을 만들어 영원히 남았다는 이야기예요.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":48,"text":"오늘 우리는 소녀들과 아기 판다의 슬픈 신화를 읽었어요. 사건이 일어난 순서를 따라가며 읽는 방법도 배웠지요. 여러분은 마지막 문장까지 집중해서 아주 잘 따라왔어요. 오늘 배운 단어와 문장을 한 번 더 소리 내어 읽어 보고, 다음 시간에 또 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
