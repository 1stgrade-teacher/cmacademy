<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>What's Reading 70 A Ch1 Unit 03 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"What's Reading 70 A Ch1 Unit 03","audioDir":"reading03_audio","preview":false,"count":57,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.923em\">Ch1\u003cbr>Unit\u003cbr>03\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">What's Reading 70 A\u003c/div>\u003ch1>Pandas in the World\u003c/h1>\u003ch2>세계 속의 판다\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">한 줄 요약\u003c/span>\u003cspan>중국은 다른 나라들과 친구 사이를 유지하려고 판다를 다른 나라로 보내요. 판다는 비용도 많이 들고 특별한 보살핌이 필요하지만, 사람들이 판다를 사랑하기 때문에 대부분의 나라는 판다를 계속 데리고 있어요.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>China sends pandas to other countries to stay friends, and most countries keep them because people love pandas.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘도 함께 신나는 영어 지문을 읽어 볼까요? 오늘 읽을 글은 Pandas in the World, 세계 속의 판다 이야기예요. 판다가 중국을 떠나 세계 여러 나라로 가는 까닭을 알아보는 글이에요. 아주 재미있는 이야기가 기다리고 있으니 편하게 따라와 주세요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">미리 알면 쉬워요\u003c/span>\u003cdiv class=\"lp-box\">판다는 \u003cb class=\"key\">대나무(bamboo)\u003c/b>를 아주 좋아하는 귀여운 동물이에요. 판다는 원래 중국의 높은 \u003cb class=\"key\">산\u003c/b>에서 살아요. 그래서 다른 나라 동물원(zoo)에서 판다를 보려면 중국에서 판다를 빌려 와야 해요. 이것은 친구에게 제일 아끼는 인형을 빌려 주는 것과 비슷해요. 그런데 그 인형을 계속 빌려서 돌보려면 돈도 많이 들고 \u003cb class=\"key\">먹이\u003c/b>도 아주 많이 필요해요.\u003c/div>","segs":[{"n":2,"text":"여러분, 판다 하면 어떤 모습이 떠오르나요? 흑백으로 반반 나뉜 얼굴에 대나무를 베어 물고 있는 모습이 떠오르죠? 판다는 원래 중국의 높은 산에서 사는 동물이에요. 그래서 다른 나라에서 판다를 만나려면 중국에서 판다를 빌려 와야 해요. 이것은 친구에게 제일 아끼는 인형을 빌려 주는 것과 비슷해요. 그런데 그 인형을 계속 빌려서 돌보려면 돈도 많이 들고 먹이도 아주 많이 필요하답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>판다는 어디에서?\u003csmall>소개 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>판다는 \u003cb class=\"key\">중국\u003c/b>에서 와요. 중국에는 약 \u003cb class=\"key\">천육백 \u003c/b>\u003cb class=\"key\">마리\u003c/b>의 판다가 살고 있어요. 중국은 이 판다들을 아주 잘 \u003cb class=\"key\">돌봐요\u003c/b>.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>왜 다른 나라로 보낼까?\u003csmall>이유 · 문장 4–6\u003c/small>\u003c/h4>\u003cp>그런데 중국은 판다를 다른 나라로 \u003cb class=\"key\">보내요\u003c/b>. 왜 그럴까요? 다른 나라들과 \u003cb class=\"key\">친구 \u003c/b>\u003cb class=\"key\">사이\u003c/b>를 계속 유지하고 싶기 때문이에요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>쉽지 않은 판다 돌보기\u003csmall>문제 · 문장 7–11\u003c/small>\u003c/h4>\u003cp>하지만 판다를 보내는 것은 \u003cb class=\"key\">무료\u003c/b>가 아니에요. 매년 \u003cb class=\"key\">백만 \u003c/b>\u003cb class=\"key\">달러\u003c/b>의 비용이 들어요. 판다는 \u003cb class=\"key\">먹이\u003c/b>도 많이 먹고 특별한 \u003cb class=\"key\">보살핌\u003c/b>이 필요해서, 비싸다고 느낀 나라는 판다를 돌려보내기도 해요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>그래도 계속 키우는 이유\u003csmall>마무리 · 문장 12–15\u003c/small>\u003c/h4>\u003cp>그래도 대부분의 나라는 판다를 계속 \u003cb class=\"key\">데리고 \u003c/b>\u003cb class=\"key\">있어요\u003c/b>. 왜일까요? 사람들이 판다를 \u003cb class=\"key\">사랑\u003c/b>하고, 동물원에서 판다를 \u003cb class=\"key\">보고 \u003c/b>\u003cb class=\"key\">싶어\u003c/b> 하기 때문이에요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 판다가 어디서 왔는지부터 시작해서, 왜 다른 나라로 가는지, 그 뒤에 어떤 일이 일어나는지를 차례대로 들려줘요.","hl":null},{"n":4,"text":"먼저 판다는 중국에서 왔다고 말해요. 중국에는 약 천육백 마리의 판다가 살고 있어요. 그리고 중국은 그 판다들을 아주 잘 돌본다고 해요. 잘 돌본다는 뜻의 표현 take good care of도 함께 기억해 두세요.","hl":"f0"},{"n":5,"text":"그런데 여기서 but이 나오면서 이야기가 살짝 바뀌어요. 중국이 판다를 잘 돌보는데도 다른 나라로 보낸다는 거예요. 왜 그럴까요? 다른 나라들과 친구 사이를 계속 유지하고 싶기 때문이에요.","hl":"f1"},{"n":6,"text":"하지만 판다를 보내는 일은 무료가 아니에요. 매년 백만 달러의 비용이 들어요. 게다가 판다는 먹이도 많이 먹고 특별한 보살핌도 필요해요. 그래서 비용이 비싸다고 느낀 몇몇 나라는 판다를 돌려보내기도 해요.","hl":"f2"},{"n":7,"text":"그래도 대부분의 나라는 판다를 계속 데리고 있어요. 또 왜냐고 물어보네요. 답은 아주 따뜻해요. 사람들이 판다를 사랑하고 동물원에서 판다를 보고 싶어 하기 때문이에요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">설명하기(질문과 대답으로 까닭을 알려 주는 글)\u003c/span>\u003cspan class=\"lp-pill\">처음\u003c/span>\u003cspan class=\"lp-pill\">주제문 4번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 '왜 중국은 판다를 다른 나라로 보낼까요?'라는 \u003cb class=\"key\">질문\u003c/b>을 스스로 던지고 대답해요. 왜 보내는지, 무엇이 힘든지, 왜 계속 키우는지를 \u003cb class=\"key\">차례대로\u003c/b> 알려 줘요. 그래서 까닭을 알려 주는 \u003cb class=\"key\">설명하는 \u003c/b>\u003cb class=\"key\">글\u003c/b>이에요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>But (4)\u003c/b>\u003cspan>앞 내용과 반대되는 이야기를 꺼내요\u003c/span>\u003cb>Why? (5)\u003c/b>\u003cspan>까닭을 묻는 질문이에요\u003c/span>\u003cb>But (7)\u003c/b>\u003cspan>또 반대되는 내용을 알려 줘요\u003c/span>\u003cb>because (9)\u003c/b>\u003cspan>까닭을 알려 줘요\u003c/span>\u003cb>also (10)\u003c/b>\u003cspan>내용을 하나 더 보태요\u003c/span>\u003cb>But (12)\u003c/b>\u003cspan>앞 내용과 반대되는 결론을 꺼내요\u003c/span>\u003cb>Why? (13)\u003c/b>\u003cspan>까닭을 다시 묻는 질문이에요\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">pandas\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">them\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">they\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>판다를 돌려보내는 나라\u003c/th>\u003cth>판다를 계속 키우는 나라\u003c/th>\u003c/tr>\u003ctr>\u003ctd>비용이 비싸고 먹이와 보살핌이 힘들어요\u003c/td>\u003ctd>사람들이 판다를 사랑하고 보고 싶어 해요\u003c/td>\u003c/tr>\u003ctr>\u003ctd>some countries\u003c/td>\u003ctd>most countries\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 설명하는 글이에요. 스스로 질문을 던지고 스스로 대답하면서 까닭을 차례대로 알려 주죠. 중심 내용은 앞부분인 네 번째 문장, 중국이 판다를 다른 나라로 보낸다는 말에서 나와요.","hl":"ty"},{"n":9,"text":"글을 따라가는 길잡이 말을 찾아볼까요? but은 앞 내용과 반대되는 이야기를 꺼낼 때 나오고, why는 까닭을 묻는 질문이에요. 그리고 because는 그 까닭을 알려 주는 말이에요. 또 판다를 가리키는 말이 pandas, them, they로 계속 바뀌어 나오니, 모두 같은 판다를 부르는 말이라고 생각하면 돼요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 단어\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>come from\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에서 와요, ~출신이에요\u003c/span>\u003c/div>\u003cdiv>\u003cb>about\u003c/b>\u003cem>부사\u003c/em>\u003cspan>약, 대략\u003c/span>\u003c/div>\u003cdiv>\u003cb>take good care of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 잘 돌봐요\u003c/span>\u003c/div>\u003cdiv>\u003cb>country\u003c/b>\u003cem>명사\u003c/em>\u003cspan>나라\u003c/span>\u003c/div>\u003cdiv>\u003cb>send\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보내요\u003c/span>\u003c/div>\u003cdiv>\u003cb>other\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>다른\u003c/span>\u003c/div>\u003cdiv>\u003cb>friend\u003c/b>\u003cem>명사\u003c/em>\u003cspan>친구\u003c/span>\u003c/div>\u003cdiv>\u003cb>stay\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(상태를) 유지해요\u003c/span>\u003c/div>\u003cdiv>\u003cb>free\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>무료인\u003c/span>\u003c/div>\u003cdiv>\u003cb>cost\u003c/b>\u003cem>동사\u003c/em>\u003cspan>비용이 들어요\u003c/span>\u003c/div>\u003cdiv>\u003cb>million\u003c/b>\u003cem>명사\u003c/em>\u003cspan>백만\u003c/span>\u003c/div>\u003cdiv>\u003cb>return\u003c/b>\u003cem>동사\u003c/em>\u003cspan>돌려보내요\u003c/span>\u003c/div>\u003cdiv>\u003cb>expensive\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>비싼\u003c/span>\u003c/div>\u003cdiv>\u003cb>a lot\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>많이\u003c/span>\u003c/div>\u003cdiv>\u003cb>special\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>특별한\u003c/span>\u003c/div>\u003cdiv>\u003cb>care\u003c/b>\u003cem>명사\u003c/em>\u003cspan>보살핌, 돌봄\u003c/span>\u003c/div>\u003cdiv>\u003cb>most\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>대부분의\u003c/span>\u003c/div>\u003cdiv>\u003cb>keep\u003c/b>\u003cem>동사\u003c/em>\u003cspan>계속 데리고 있어요\u003c/span>\u003c/div>\u003cdiv>\u003cb>love\u003c/b>\u003cem>동사\u003c/em>\u003cspan>사랑해요\u003c/span>\u003c/div>\u003cdiv>\u003cb>zoo\u003c/b>\u003cem>명사\u003c/em>\u003cspan>동물원\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"오늘의 단어를 몇 개 소리 내어 읽어 볼게요. take care of는 잘 돌보다라는 뜻이고, expensive는 비싸다는 뜻이에요. return은 돌려보내다, keep은 계속 데리고 있다라는 뜻이에요. send는 보내다, free는 무료라는 뜻이니 함께 기억해요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">expensive\u003c/b>\u003cspan class=\"m\">비싼\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">costly\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">cheap\u003c/span>\u003cspan class=\"a\">free\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">return\u003c/b>\u003cspan class=\"m\">돌려보내다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">give back\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">keep\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">keep\u003c/b>\u003cspan class=\"m\">계속 데리고 있다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">have\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">return\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">love\u003c/b>\u003cspan class=\"m\">사랑하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">like very much\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">special\u003c/b>\u003cspan class=\"m\">특별한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">not usual\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">usual\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"비슷한 말과 반대말도 정리해 볼까요? expensive는 costly와 비슷하지만 cheap이나 free와는 반대예요. return은 give back과 비슷하고 keep과는 반대말이에요. love는 like very much와 비슷하고 hate와는 반대예요. special은 not usual과 비슷하고 usual과는 반대랍니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">판다들은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Pandas\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">와요, ~에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">come \u003c/span>\u003cspan class=\"tgt\">from\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">중국에서.\u003c/span>\u003cspan class=\"en\">China.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">판다는 중국 출신입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 판다가 어디서 왔는지 알려 주는 \u003cb class=\"key\">첫 \u003c/b>\u003cb class=\"key\">문장\u003c/b>이에요. 이 글의 \u003cb class=\"key\">주제\u003c/b>를 열어 주는 아주 중요한 문장이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">여러 개일 때 이름 말(복수 명사)\u003c/span> : 여러 마리(Pandas) + 동사원형(come) : \"판다들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">~에서 와요(일반동사 현재형)\u003c/span> : 누가(Pandas) + 와요(come) + ~에서(from China) : \"중국에서 와요\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Pandas, 판다들은. come from, 와요, ~에서. China, 중국에서.. 이 문장 전체를 해석하면, 판다는 중국 출신입니다.","hl":"m"},{"n":13,"text":"이 문장은 판다가 어디서 왔는지 알려 주는 첫 문장이에요. 글의 주제를 열어 주는 아주 중요한 문장이죠.","hl":"mn"},{"n":14,"text":"먼저, pandas는 판다 여러 마리를 뜻해요. 그래서 동사도 s가 없는 come을 써요. 그리고 come from은 중국 출신이라는 뜻이에요. 그래서 이 문장은 판다는 중국 출신이라는 말이 된답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">있어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">are\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">약 1,600마리의 판다가\u003c/span>\u003cspan class=\"en\">about 1,600 pandas\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">중국에.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">China\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">중국에는 약 1,600마리의 판다가 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 중국에 사는 판다가 몇 마리인지 \u003cb class=\"key\">숫자\u003c/b>로 알려 줘요. 판다가 생각보다 흔한 동물이 아니라는 것도 알 수 있죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">~이 있어요(Ther is/are)\u003c/span> : There are + 여러 개(about 1,600 pandas) + 장소(in China) : \"있어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소 짝꿍 말(전치사)\u003c/span> : in + 장소(China) = 중국에 : \"중국에\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"There are, 있어요. about 1,600 pandas, 약 1,600마리의 판다가. in China, 중국에.. 이 문장 전체를 해석하면, 중국에는 약 1,600마리의 판다가 있습니다.","hl":"m"},{"n":16,"text":"이 문장은 중국에 사는 판다가 몇 마리인지 숫자로 알려 줘요. 생각보다 판다가 많은 동물이 아니라는 것도 알 수 있답니다.","hl":"mn"},{"n":17,"text":"첫 번째, 여러 개가 있을 때는 There are를 써요. 판다가 천육백 마리나 되니까 are를 쓰는 거예요. 두 번째, in은 장소를 나타내는 짝꿍 말이에요. 그래서 in China는 중국에라는 뜻이 되죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">중국은\u003c/span>\u003cspan class=\"en\">China\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">잘 보살펴요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">takes\u003c/span> good care\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들을.\u003c/span>\u003cspan class=\"en\">of \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">them\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">중국은 그들을 잘 보살핍니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 중국이 판다를 \u003cb class=\"key\">잘 \u003c/b>\u003cb class=\"key\">보살핀다\u003c/b>는 걸 알려 주는 문장이에요. 이 글에서 중국의 \u003cb class=\"key\">좋은 \u003c/b>\u003cb class=\"key\">점\u003c/b>을 말해 주죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">한 사람·한 개일 때 동사 + s(3인칭 단수)\u003c/span> : 한 나라(China) + 보살펴요(takes) + 그들을(them) : \"보살펴요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">대신하는 말(대명사)\u003c/span> : them = 앞에 나온 pandas : \"그들을\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"China, 중국은. takes good care, 잘 보살펴요. of them, 그들을.. 이 문장 전체를 해석하면, 중국은 그들을 잘 보살핍니다.","hl":"m"},{"n":19,"text":"이 문장은 중국이 판다를 잘 보살핀다는 걸 알려 줘요. 이 글에서 중국의 좋은 점을 말해 주는 부분이랍니다.","hl":"mn"},{"n":20,"text":"먼저, China는 한 나라라서 한 개로 봐요. 그래서 동사에 s를 붙여 takes라고 해요. 그리고 them은 앞에 나온 pandas를 대신하는 말이에요. 그래서 그들을이라고 해석한답니다. 여러분, 아주 잘하고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 15\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 그 나라는\u003c/span>\u003cspan class=\"en\">But the country\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들을 보냅니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">sends\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">them\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 나라들로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">other \u003c/span>\u003cspan class=\"tgt\">countries\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 그 나라는 그들을 다른 나라들로 보냅니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 중국이 \u003cb class=\"key\">판다\u003c/b>를 \u003cb class=\"key\">다른 \u003c/b>\u003cb class=\"key\">나라\u003c/b>로 보낸다는 말이에요. 잘 돌본다고 했는데 보낸다고 하니 \u003cb class=\"key\">왜\u003c/b> 그런지 궁금해지게 만드는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">한 사람·한 개일 때 동사 + s(3인칭 단수)\u003c/span> : 그 나라(the country) + 보낸다(sends) + 그들을(them) : \"보냅니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">대신하는 말(대명사)\u003c/span> : 보낸다(sends) + 그들을(them) : \"그들을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">장소 짝꿍 말(전치사)\u003c/span> : 보낸다(sends) + 어디로(to other countries) : \"다른 나라들로\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"But the country, 하지만 그 나라는. sends them, 그들을 보냅니다. to other countries, 다른 나라들로. 이 문장 전체를 해석하면, 하지만 그 나라는 그들을 다른 나라들로 보냅니다.","hl":"m"},{"n":22,"text":"중국이 판다를 다른 나라로 보낸다는 뜻이에요. 잘 돌보면서도 보낸다니, 왜 그런지 궁금해지죠?","hl":"mn"},{"n":23,"text":"첫 번째, the country는 한 나라를 가리키니까 동사에 s를 붙여 sends라고 해요. 두 번째, them은 앞에 나온 pandas를 대신하는 대명사예요. 세 번째, to는 어디로 가는지 알려 주는 전치사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜일까요?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Why\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">왜일까요?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 왜 중국이 판다를 다른 나라로 보낼까요? \u003cb class=\"key\">궁금증\u003c/b>을 던지는 \u003cb class=\"key\">짧은 \u003c/b>\u003cb class=\"key\">질문\u003c/b>이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">왜? 하고 묻는 말(의문문)\u003c/span> : 왜(Why) + ? : \"왜일까요?\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Why?, 왜일까요?. 이 문장 전체를 해석하면, 왜일까요?","hl":"m"},{"n":25,"text":"왜 중국이 판다를 다른 나라로 보낼까요? 궁금증을 던지는 짧은 질문이에요.","hl":"mn"},{"n":26,"text":"Why는 왜 그런지 물을 때 쓰는 한 단어 질문이에요. 바로 다음 문장에서 답을 알려 줄 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">중국은 친구 사이를 유지합니다\u003c/span>\u003cspan class=\"en\">China \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">stays\u003c/span> friends\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 나라들과\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">other \u003c/span>\u003cspan class=\"tgt\">countries\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">중국은 다른 나라들과 친구 사이를 유지합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 중국이 판다를 보내는 까닭은 \u003cb class=\"key\">다른 \u003c/b>\u003cb class=\"key\">나라\u003c/b>와 \u003cb class=\"key\">친구\u003c/b>로 지내고 싶기 때문이에요. 앞의 왜?에 대한 \u003cb class=\"key\">대답\u003c/b>이 되는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">한 사람·한 개일 때 동사 + s(3인칭 단수)\u003c/span> : 중국(China) + 유지한다(stays) + 친구 사이를(friends) : \"유지합니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">~와 함께를 나타내는 말(전치사)\u003c/span> : 친구 사이(stays friends) + 누구와(with other countries) : \"다른 나라들과\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"China stays friends, 중국은 친구 사이를 유지합니다. with other countries, 다른 나라들과. 이 문장 전체를 해석하면, 중국은 다른 나라들과 친구 사이를 유지합니다.","hl":"m"},{"n":28,"text":"중국이 판다를 보내는 까닭은 다른 나라와 친구로 지내고 싶기 때문이에요. 앞의 왜라는 질문에 대한 대답이죠.","hl":"mn"},{"n":29,"text":"첫 번째, China는 한 나라라서 동사 stay에 s를 붙여 stays라고 해요. 두 번째, with는 누구와 함께인지 알려 주는 전치사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 그것은\u003c/span>\u003cspan class=\"en\">But \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">it's\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무료가 아닙니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">free\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 그것은 무료가 아닙니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 판다를 보내 주는 일이 \u003cb class=\"key\">무료\u003c/b>가 아니라는 말이에요. 앞에서 '친구 나라'라고 한 이야기와 \u003cb class=\"key\">반대\u003c/b>되는 내용을 살짝 꺼내 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">am·are·is 친구들(be동사)\u003c/span> : 그것은(it) + 이다(is) = it's : \"그것은 ~이에요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">아니라고 말하기(be동사 부정문)\u003c/span> : is + not + free → 무료가 아니다 : \"무료가 아닙니다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"But it's, 하지만 그것은. not free, 무료가 아닙니다. 이 문장 전체를 해석하면, 하지만 그것은 무료가 아닙니다.","hl":"m"},{"n":31,"text":"앞에서 중국이 판다를 다른 나라에 보내 준다고 했죠? 그런데 그건 무료가 아니래요. '하지만'으로 시작해서 앞 내용과 반대되는 이야기를 꺼내는 거예요.","hl":"mn"},{"n":32,"text":"it's는 it과 is를 줄여 쓴 말이에요. 그래서 '그것은 ~이에요'라는 뜻이 되죠. 여기에 not을 붙이면 '무료예요'가 '무료가 아니에요'로 바뀌어요. 이렇게 be동사 뒤에 not을 붙인 문장을 부정문이라고 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 비용이 듭니다\u003c/span>\u003cspan class=\"en\">It \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">costs\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">100만 달러가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">$1 \u003c/span>\u003cspan class=\"tgt\">million\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매년\u003c/span>\u003cspan class=\"en\">every year.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">매년 100만 달러의 비용이 듭니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 판다를 보내는 데 \u003cb class=\"key\">돈\u003c/b>이 아주 많이 든다는 걸 숫자로 보여 줘요. 한 해에 100만 달러면 정말 큰 \u003cb class=\"key\">금액\u003c/b>이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">한 사람·한 개일 때 동사 + s(3인칭 단수)\u003c/span> : 그것(It) + 한다(costs) + 무엇이 : \"비용이 든다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">얼마나 많은지 말하기(수량 표현)\u003c/span> : $ + 숫자 = 돈의 양 / 1 million = 100만 : \"100만 달러\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"It costs, 그것은 비용이 듭니다. $1 million, 100만 달러가. every year, 매년. 이 문장 전체를 해석하면, 매년 100만 달러의 비용이 듭니다.","hl":"m"},{"n":34,"text":"판다를 보내는 데 돈이 아주 많이 든다는 걸 숫자로 보여 주는 문장이에요. 한 해에 백만 달러면 정말 큰 금액이죠.","hl":"mn"},{"n":35,"text":"주어 It은 판다를 보내는 일을 가리켜요. 그것은 하나니까 동사 cost 뒤에 s를 붙여 costs라고 해요. 그래서 '비용이 든다'는 뜻이 되죠. 그리고 돈의 양을 말할 때는 달러 기호를 쓰고, 백만은 영어로 million이라고 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몇몇 나라들은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Some \u003c/span>\u003cspan class=\"tgt\">countries\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들을 돌려보냅니다\u003c/span>\u003cspan class=\"en\">return \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">them\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜냐하면 그것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">because \u003c/span>\u003cspan class=\"tgt\">it's \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">비싸기 때문입니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">expensive\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">몇몇 나라들은 비용이 비싸기 때문에 그들을 돌려보냅니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> \u003cb class=\"key\">비용\u003c/b>이 너무 비싸면 판다를 다시 돌려보내는 나라도 있다는 걸 알려 줘요. 그래서 \u003cb class=\"key\">모든 \u003c/b>\u003cb class=\"key\">나라\u003c/b>가 판다를 계속 키우는 건 아니라는 거죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">여러 개일 때(복수 주어)\u003c/span> : 여러 나라(Some countries) + 돌려보낸다(return) : \"몇몇 나라들은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">대신하는 말(대명사)\u003c/span> : the pandas → them(그들을) : \"그들을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 이유(because) + 그것은(it's) + 비싸다(expensive) : \"왜냐하면 그것은 비싸기 때문이에요\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Some countries, 몇몇 나라들은. return them, 그들을 돌려보냅니다. because it's, 왜냐하면 그것은. expensive, 비싸기 때문입니다. 이 문장 전체를 해석하면, 몇몇 나라들은 비용이 비싸기 때문에 그들을 돌려보냅니다.","hl":"m"},{"n":37,"text":"비용이 너무 비싸면 판다를 다시 돌려보내는 나라도 있다는 걸 알려 줘요. 그래서 모든 나라가 판다를 계속 키우는 건 아니라는 거죠.","hl":"mn"},{"n":38,"text":"먼저 them은 앞에 나온 the pandas를 짧게 다시 부르는 말이에요. 여러 마리니까 '그들을'이라는 뜻의 them을 써요. 그리고 왜 돌려보내는지 이유를 말할 때 because를 써요. '비싸기 때문이에요'라고 답하는 거죠. 마지막으로 나라가 여러 개라서 country 뒤에 s를 붙여 countries라고 하고, 주어가 여럿이면 동사 return에는 s를 붙이지 않아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 판다들은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">The \u003c/span>\u003cspan class=\"tgt\">pandas\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또한 먹어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">also\u003c/span> eat\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">lot\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">판다는 또한 많이 먹습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 판다는 먹는 양이 아주 \u003cb class=\"key\">많다\u003c/b>는 것을 알려 줘요. 값도 비싼데 \u003cb class=\"key\">먹는 \u003c/b>\u003cb class=\"key\">양\u003c/b>까지 많다고 덧붙이는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">여럿을 가리키는 말(복수 명사)\u003c/span> : 여럿(The pandas) + 여러 마리 이름(pandas) : \"그 판다들은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">더 자세히 알려 주는 말(부사)\u003c/span> : also(또한) + 동사(eat) : \"또한\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">수량 표현(많이)\u003c/span> : eat(먹어요) + a lot(많이) : \"많이\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"The pandas, 그 판다들은. also eat, 또한 먹어요. a lot, 많이. 이 문장 전체를 해석하면, 판다는 또한 많이 먹습니다.","hl":"m"},{"n":40,"text":"이 문장은 판다가 먹는 양이 아주 많다는 걸 알려 줘요. 값도 비싼데 먹는 양까지 많다고 덧붙이는 거예요.","hl":"mn"},{"n":41,"text":"첫 번째, The pandas는 판다 여러 마리를 말해요. 그래서 여럿을 가리키는 복수 명사라고 불러요. 두 번째, also는 또한이라는 뜻으로 동사 앞에 와요. 판다가 많이 먹는다는 말에 살짝 더해 주는 말이죠. 세 번째, a lot은 많이, 즉 먹는 양이 아주 많다는 뜻이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 필요해요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">They\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">need\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">특별한 보살핌이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">special \u003c/span>\u003cspan class=\"tgt\">care\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 특별한 보살핌이 필요합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 판다는 \u003cb class=\"key\">특별한 \u003c/b>\u003cb class=\"key\">보살핌\u003c/b>이 필요하다는 뜻이에요. 그래서 아무 나라나 쉽게 데리고 있기 어렵다는 걸 알려 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">대신하는 말(대명사)\u003c/span> : 대명사(They) = 앞에 나온 The pandas : \"그들은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지금 하는 일·사실 말하기(현재시제)\u003c/span> : 그들은(They) + 필요해요(need) + 무엇을(care) : \"필요해요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">꾸며 주는 말(형용사) + 이름 말(명사)\u003c/span> : 꾸며 주는 말(special) + 이름 말(care) : \"특별한 보살핌\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"They need, 그들은 필요해요. special care, 특별한 보살핌이. 이 문장 전체를 해석하면, 그들은 특별한 보살핌이 필요합니다.","hl":"m"},{"n":43,"text":"판다는 특별한 보살핌이 필요하다는 뜻이에요. 그래서 아무 나라나 쉽게 데리고 있기 어렵다는 것도 알 수 있어요.","hl":"mn"},{"n":44,"text":"첫 번째, They는 앞에 나온 The pandas를 대신하는 말이에요. 두 번째, special은 특별한이라는 뜻의 형용사예요. 영어는 형용사가 이름 말 앞에 오죠. 그래서 special care는 특별한 보살핌이 돼요. 세 번째, need는 필요해요라는 뜻이고, 주어가 they라서 동사에 s를 붙이지 않아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 대부분의 나라들은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">But\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">most \u003c/span>\u003cspan class=\"tgt\">countries\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들을 계속 데리고 있어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">keep \u003c/span>\u003cspan class=\"tgt\">them\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 대부분의 나라들은 그들을 계속 데리고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 비싸고 힘들어도 \u003cb class=\"key\">대부분의 \u003c/b>\u003cb class=\"key\">나라들\u003c/b>은 판다를 계속 데리고 있다는 뜻이에요. 앞 내용과 반대라서 But으로 이어 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 앞 내용 + but(하지만) + 뒤 내용 : \"하지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">대부분의 + 복수 명사(수량 표현)\u003c/span> : most(대부분의) + countries(나라들) : \"대부분의 나라들은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동사 + 무엇을(목적어)\u003c/span> : 한다(keep) + 그들을(them) : \"그들을 데리고 있다\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"But most countries, 하지만 대부분의 나라들은. keep them, 그들을 계속 데리고 있어요. 이 문장 전체를 해석하면, 하지만 대부분의 나라들은 그들을 계속 데리고 있습니다.","hl":"m"},{"n":46,"text":"비싸고 힘들어도 대부분의 나라들은 판다를 계속 데리고 있어요. 앞 문장과 반대되는 내용이라 But으로 이어 주는 거예요.","hl":"mn"},{"n":47,"text":"첫 번째, But은 하지만이라는 뜻으로 앞말과 반대되는 말을 이어 줘요. 두 번째, most는 대부분의라는 뜻으로 복수 명사 앞에 와요. countries는 country의 복수 모양이에요. 세 번째, keep은 계속 데리고 있다는 뜻이고, them은 앞에 나온 판다들을 가리켜요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜일까요?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Why\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">왜일까요?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 대부분의 나라는 판다를 계속 키운다고 했죠. 그 이유를 다시 물어보는 \u003cb class=\"key\">질문\u003c/b> 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이유를 묻는 말(의문문)\u003c/span> : 왜?(Why?) = 이유를 물어요 : \"왜\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"Why?, 왜일까요?. 이 문장 전체를 해석하면, 왜일까요?","hl":"m"},{"n":49,"text":"앞에서 대부분의 나라는 판다를 계속 키운다고 했죠? 그럼 여기서 궁금한 게 생겨요. 왜 그럴까요?","hl":"mn"},{"n":50,"text":"이유를 물을 때는 Why 한마디면 충분해요. 이렇게 짧게 묻는 문장을 의문문이라고 해요. Why 하고 물으면 상대가 이유를 알려 준답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 15\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들이 사랑해요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">People \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">love \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 판다들을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">pandas\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사람들이 판다를 사랑하기 때문입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사람들이 판다를 아주 좋아한다는 것을 말해요. 앞에서 물은 '왜?'에 대한 \u003cb class=\"key\">대답\u003c/b>이 되는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">여러 사람일 때는 동사 그대로(단수·복수)\u003c/span> : 여러 명(People) + 좋아해요(love) — s를 붙이지 않아요 : \"사람들이 사랑해요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">하는 일 말 + 무엇을(목적어)\u003c/span> : 누가(People) + 사랑해요(love) + 무엇을(the pandas) : \"판다들을 사랑해요\"\u003c/div>\u003c/div>","segs":[{"n":51,"text":"People love, 사람들이 사랑해요. the pandas, 그 판다들을. 이 문장 전체를 해석하면, 사람들이 판다를 사랑하기 때문입니다.","hl":"m"},{"n":52,"text":"사람들이 판다를 사랑한다는 뜻이에요. 앞에서 왜 판다를 계속 키울까 물었죠? 바로 이게 그 대답이에요.","hl":"mn"},{"n":53,"text":"먼저 People은 여러 사람을 뜻해요. 그래서 동사 love에 s를 붙이지 않아요. 그리고 love 뒤에는 무엇을 사랑하는지 목적어 the pandas가 와요. 사람들이 판다를 사랑해요, 이렇게 무엇을을 붙여 주면 문장이 완성돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 15 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 원해요\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">want \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">판다를 보는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">see\u003c/span> the pandas\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">동물원에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">zoo\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 동물원에서 판다를 보고 싶어 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사람들이 동물원에 가서 판다를 보고 싶어 한다는 뜻이에요. 그래서 나라들이 판다를 계속 키우는 거예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">하고 싶어요(want + to 동사원형)\u003c/span> : 누가(They) + 원해요(want) + 보는 것을(to see) : \"보고 싶어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소 짝꿍 말(전치사)\u003c/span> : at + 장소(the zoo) = ~에서 : \"동물원에서\"\u003c/div>\u003c/div>","segs":[{"n":54,"text":"They want, 그들은 원해요. to see the pandas, 판다를 보는 것을. at the zoo, 동물원에서. 이 문장 전체를 해석하면, 그들은 동물원에서 판다를 보고 싶어 합니다.","hl":"m"},{"n":55,"text":"사람들이 동물원에서 판다를 보고 싶어 한다는 뜻이에요. 그래서 나라들이 판다를 계속 키우는 거예요.","hl":"mn"},{"n":56,"text":"첫 번째, '보고 싶다'는 want 뒤에 to와 동사 see를 붙여서 want to see라고 해요. 두 번째, 장소 앞에 at을 붙이면 '~에서'라는 뜻이에요. 그래서 동물원에서 보고 싶다는 at the zoo가 된답니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">오늘 배운 내용 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>판다는 \u003cb class=\"key\">중국\u003c/b>에서 왔어요.\u003c/li>\u003cli>중국은 판다를 다른 나라로 보내서 \u003cb class=\"key\">친구 \u003c/b>\u003cb class=\"key\">사이\u003c/b>를 유지해요.\u003c/li>\u003cli>판다를 보내는 데는 \u003cb class=\"key\">백만 \u003c/b>\u003cb class=\"key\">달러\u003c/b>의 비용이 들고 \u003cb class=\"key\">특별한 \u003c/b>\u003cb class=\"key\">보살핌\u003c/b>이 필요해요.\u003c/li>\u003cli>그래도 사람들이 판다를 \u003cb class=\"key\">사랑\u003c/b>해서 대부분의 나라는 판다를 계속 데리고 있어요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>China sends pandas to other countries to stay friends, and most countries keep them because people love pandas.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">중국은 다른 나라들과 친구 사이를 유지하려고 판다를 다른 나라로 보내요. 판다는 비용도 많이 들고 특별한 보살핌이 필요하지만, 사람들이 판다를 사랑하기 때문에 대부분의 나라는 판다를 계속 데리고 있어요.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":57,"text":"오늘 우리는 판다가 중국에서 다른 나라로 가는 까닭을 읽었어요. 판다는 비용도 많이 들고 보살핌도 필요하지만, 사람들이 사랑하기에 많은 나라가 계속 데리고 있어요. 여러분도 오늘 배운 표현들을 소리 내어 세 번씩 읽어 보면 더 잘 기억할 거예요. 정말 잘했어요, 다음 시간에 또 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
