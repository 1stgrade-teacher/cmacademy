<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>What's Reading 70 A Ch1 Unit 01 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"What's Reading 70 A Ch1 Unit 01","audioDir":"reading01_audio","preview":false,"count":40,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.923em\">Ch1\u003cbr>Unit\u003cbr>01\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">What's Reading 70 A\u003c/div>\u003ch1>Cute Bears: Bears vs. Giant Pandas\u003c/h1>\u003ch2>귀여운 곰들: 곰과 자이언트 판다\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">한 줄 요약\u003c/span>\u003cspan>곰은 식물, 고기, 물고기를 먹고 겨울에 \u003cb class=\"key\">네 \u003c/b>\u003cb class=\"key\">달\u003c/b> 동안 자며 발가락이 다섯 개예요. 자이언트 판다도 곰이지만 \u003cb class=\"key\">대나무\u003c/b>를 먹고, 겨울에 오래 자지 않으며 발가락이 \u003cb class=\"key\">여섯 \u003c/b>\u003cb class=\"key\">개\u003c/b>예요.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Giant pandas are bears too, but they are different from other bears in food, winter sleep, and toes.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘도 만나서 정말 반가워요. 오늘은 귀여운 곰 이야기를 읽어 볼 거예요. 제목은 Cute Bears, 우리말로 하면 귀여운 곰들이에요. 곰과 자이언트 판다는 무엇이 같고 무엇이 다른지 함께 알아봐요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">미리 알면 쉬워요\u003c/span>\u003cdiv class=\"lp-box\">곰은 몸집이 크고 털이 많은 동물이에요. 겨울이 되면 먹이가 줄어서 곰은 \u003cb class=\"key\">겨울잠\u003c/b>을 자며 힘을 아껴요. 자이언트 판다는 곰 가족이지만 \u003cb class=\"key\">대나무(bamboo)\u003c/b>를 즐겨 먹는 특별한 친구예요. 사람이 사는 곳이 아닌 자연 속을 \u003cb class=\"key\">야생(wild)\u003c/b>이라고 불러요. 우리가 겨울방학에 집에서 푹 쉬는 것처럼 곰도 겨울에는 오래 잔다고 생각하면 이해하기 쉬워요. 여러분은 판다가 대나무를 얼마나 좋아하는지 알고 있나요?\u003c/div>","segs":[{"n":2,"text":"곰은 몸집이 크고 털이 많은 동물이에요. 겨울이 되면 먹이가 줄어서 곰은 겨울잠을 자며 힘을 아껴요. 자이언트 판다는 곰 가족이지만 대나무, bamboo를 즐겨 먹는 특별한 친구예요. 사람이 사는 곳이 아닌 자연 속을 야생, wild라고 불러요. 여러분은 우리가 겨울방학에 집에서 푹 쉬는 것처럼 곰도 겨울에 오래 잔다고 생각하나요?","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>곰은 무엇을 먹을까요\u003csmall>시작 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>글은 질문으로 시작해요. 곰은 \u003cb class=\"key\">식물\u003c/b>, \u003cb class=\"key\">고기\u003c/b>, 물고기를 모두 먹는 동물이에요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>겨울잠과 발가락\u003csmall>소개 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>겨울에 곰은 \u003cb class=\"key\">네 \u003c/b>\u003cb class=\"key\">달\u003c/b> 동안 잠을 자요. 그리고 발마다 \u003cb class=\"key\">다섯 \u003c/b>\u003cb class=\"key\">개\u003c/b>의 발가락이 있어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>판다도 곰이에요\u003csmall>바뀜 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>자이언트 판다도 곰이에요. 하지만 판다와 곰은 \u003cb class=\"key\">같지 \u003c/b>\u003cb class=\"key\">않아요\u003c/b>.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>판다의 다른 점\u003csmall>예시 · 문장 7–9\u003c/small>\u003c/h4>\u003cp>판다는 \u003cb class=\"key\">대나무\u003c/b>를 먹어요. 야생에서는 벌레, 꿀, 나뭇잎도 먹고, 겨울에 오래 자지 않으며 발가락이 \u003cb class=\"key\">여섯 \u003c/b>\u003cb class=\"key\">개\u003c/b>예요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 곰을 먼저 소개하고, 그다음 판다와 무엇이 다른지 차례대로 보여 줘요.","hl":null},{"n":4,"text":"먼저 글은 질문으로 시작해요. 여러분은 곰에 대해 무엇을 알고 있나요? 곰은 식물, 고기, 물고기를 모두 먹는 동물이에요. plant는 식물, meat는 고기라는 뜻이에요.","hl":"f0"},{"n":5,"text":"다음은 곰의 겨울 이야기예요. 겨울에 곰은 네 달 동안 잠을 자요. 그리고 발마다 다섯 개의 발가락이 있어요. toe가 발가락, foot이 발이라는 뜻이에요.","hl":"f1"},{"n":6,"text":"여기서 이야기가 살짝 바뀌어요. 자이언트 판다도 곰이에요. 하지만 자이언트 판다와 곰은 같지 않다고 말해요. But이 나오면 앞 내용과 반대라는 신호예요.","hl":"f2"},{"n":7,"text":"그래서 판다가 어떻게 다른지 예를 들어 보여 줘요. 자이언트 판다는 대나무, bamboo를 먹어요. 때때로 야생에서는 벌레, 꿀, 나뭇잎도 먹고요. 또 겨울에 오래 자지 않고, 발가락이 여섯 개예요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">비교하며 설명하는 글\u003c/span>\u003cspan class=\"lp-pill\">가운데\u003c/span>\u003cspan class=\"lp-pill\">주제문 6번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">처음에는 곰의 먹이와 겨울잠을 알려 줘요. 가운데에서 \u003cb class=\"key\">판다도 \u003c/b>\u003cb class=\"key\">곰\u003c/b>이라고 말한 뒤, 끝에서 판다가 곰과 다른 점을 \u003cb class=\"key\">예\u003c/b>로 보여 줘요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>too (5)\u003c/b>\u003cspan>같은 점을 더해 줌\u003c/span>\u003cb>But (6)\u003c/b>\u003cspan>반대 내용을 알려 줌\u003c/span>\u003cb>And sometimes (8)\u003c/b>\u003cspan>예를 하나 더함\u003c/span>\u003cb>Also (9)\u003c/b>\u003cspan>내용을 하나 더함\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">bears\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">giant pandas\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">giant pandas in the wild\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>곰\u003c/th>\u003cth>자이언트 판다\u003c/th>\u003c/tr>\u003ctr>\u003ctd>식물, 고기, 물고기를 먹어요\u003c/td>\u003ctd>대나무를 먹어요\u003c/td>\u003c/tr>\u003ctr>\u003ctd>겨울에 네 달 동안 자요\u003c/td>\u003ctd>겨울에 오래 자지 않아요\u003c/td>\u003c/tr>\u003ctr>\u003ctd>발가락이 다섯 개예요\u003c/td>\u003ctd>발가락이 여섯 개예요\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 두 대상을 비교하는 글이에요. 처음에는 곰을 설명하고, 가운데에서 판다도 곰이라고 말한 뒤, 끝에서 다른 점을 예로 들어요. 중심 문장은 가운데에 있는 여섯 번째 문장, But giant pandas and bears are not the same이에요.","hl":"ty"},{"n":9,"text":"길잡이 말을 보면 글이 잘 보여요. But은 반대 내용을 알려 주고, And sometimes와 Also는 내용을 하나 더 보태 줘요. 같은 대상을 부르는 말도 bears, giant pandas, giant pandas in the wild처럼 조금씩 달라져요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 단어\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>know about\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 대해 알다\u003c/span>\u003c/div>\u003cdiv>\u003cb>bear\u003c/b>\u003cem>명사\u003c/em>\u003cspan>곰\u003c/span>\u003c/div>\u003cdiv>\u003cb>plant\u003c/b>\u003cem>명사\u003c/em>\u003cspan>식물\u003c/span>\u003c/div>\u003cdiv>\u003cb>meat\u003c/b>\u003cem>명사\u003c/em>\u003cspan>고기\u003c/span>\u003c/div>\u003cdiv>\u003cb>fish\u003c/b>\u003cem>명사\u003c/em>\u003cspan>물고기\u003c/span>\u003c/div>\u003cdiv>\u003cb>winter\u003c/b>\u003cem>명사\u003c/em>\u003cspan>겨울\u003c/span>\u003c/div>\u003cdiv>\u003cb>sleep\u003c/b>\u003cem>동사\u003c/em>\u003cspan>자다\u003c/span>\u003c/div>\u003cdiv>\u003cb>month\u003c/b>\u003cem>명사\u003c/em>\u003cspan>달, 개월\u003c/span>\u003c/div>\u003cdiv>\u003cb>toe\u003c/b>\u003cem>명사\u003c/em>\u003cspan>발가락\u003c/span>\u003c/div>\u003cdiv>\u003cb>each\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>각각의, 각\u003c/span>\u003c/div>\u003cdiv>\u003cb>foot\u003c/b>\u003cem>명사\u003c/em>\u003cspan>발\u003c/span>\u003c/div>\u003cdiv>\u003cb>giant panda\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자이언트 판다(대왕판다)\u003c/span>\u003c/div>\u003cdiv>\u003cb>same\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>같은\u003c/span>\u003c/div>\u003cdiv>\u003cb>bamboo\u003c/b>\u003cem>명사\u003c/em>\u003cspan>대나무\u003c/span>\u003c/div>\u003cdiv>\u003cb>sometimes\u003c/b>\u003cem>부사\u003c/em>\u003cspan>때때로\u003c/span>\u003c/div>\u003cdiv>\u003cb>wild\u003c/b>\u003cem>명사\u003c/em>\u003cspan>야생, 자연\u003c/span>\u003c/div>\u003cdiv>\u003cb>bug\u003c/b>\u003cem>명사\u003c/em>\u003cspan>벌레\u003c/span>\u003c/div>\u003cdiv>\u003cb>honey\u003c/b>\u003cem>명사\u003c/em>\u003cspan>꿀\u003c/span>\u003c/div>\u003cdiv>\u003cb>leaves\u003c/b>\u003cem>명사\u003c/em>\u003cspan>나뭇잎들(leaf의 복수)\u003c/span>\u003c/div>\u003cdiv>\u003cb>long\u003c/b>\u003cem>부사\u003c/em>\u003cspan>오래, 길게\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"오늘의 단어를 소리 내어 읽어 볼까요? plant, 식물. meat, 고기. winter, 겨울. toe, 발가락. bamboo, 대나무. honey, 꿀이에요. 큰 소리로 따라 읽으면 훨씬 잘 기억돼요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">know\u003c/b>\u003cspan class=\"m\">알다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">understand\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">forget\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">eat\u003c/b>\u003cspan class=\"m\">먹다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">have\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">sleep\u003c/b>\u003cspan class=\"m\">자다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">rest\u003c/span>\u003cspan class=\"s\">nap\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">wake up\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">same\u003c/b>\u003cspan class=\"m\">같은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">alike\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">different\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">sometimes\u003c/b>\u003cspan class=\"m\">때때로\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">now and then\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">always\u003c/span>\u003cspan class=\"a\">never\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"비슷한 말과 반대말도 함께 익혀 봐요. know는 알다, 비슷한 말은 understand예요. same은 같다는 뜻이고 반대말은 different예요. sleep은 자다, 반대말은 wake up이에요. sometimes는 때때로, 반대말은 always예요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무엇을 여러분은 알고 있나요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">What \u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">know\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">곰에 대해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">about \u003c/span>\u003cspan class=\"tgt\">bears\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여러분은 곰에 대해 무엇을 알고 있나요?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글을 열면서 곰에 대해 \u003cb class=\"key\">아는 \u003c/b>\u003cb class=\"key\">것\u003c/b>을 물어보는 \u003cb class=\"key\">질문\u003c/b>이에요. 질문으로 시작하니 다음 내용이 궁금해져요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">질문 만드는 do(일반동사 의문문)\u003c/span> : 무엇을(What) + do + 누가(you) + 하다(know) : \"무엇을 여러분은 아나요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">about(~에 대해)(전치사)\u003c/span> : about + 무엇(bears) → 무엇에 대해 : \"곰에 대해\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"What do you know, 무엇을 여러분은 알고 있나요. about bears?, 곰에 대해. 이 문장 전체를 해석하면, 여러분은 곰에 대해 무엇을 알고 있나요?","hl":"m"},{"n":13,"text":"글을 시작하면서 여러분에게 곰에 대해 아는 것을 물어보는 문장이에요. 질문으로 시작하니 궁금증이 생기죠.","hl":"mn"},{"n":14,"text":"첫 번째, 뜻을 묻는 질문에서는 do가 주어 you 앞에 와요. 그래서 What do you know가 되죠. 두 번째, about은 뒤에 주제를 붙여 주는 말이에요. 곰에 대해처럼 오늘의 주제가 곰이라는 걸 알려 주죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 먹어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">They \u003c/span>\u003cspan class=\"tgt\">eat\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">식물, 고기,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">plants, \u003c/span>\u003cspan class=\"tgt\">meat, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 물고기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">fish\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 식물, 고기, 그리고 물고기를 먹습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 곰이 무엇을 먹는지 알려 주는 문장이에요. 곰은 \u003cb class=\"key\">식물\u003c/b>과 \u003cb class=\"key\">고기\u003c/b>와 물고기를 다 먹는 동물이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">여러 명을 가리키는 they(인칭대명사)\u003c/span> : 그들은(They) + 먹는다(eat) : \"그들은 먹어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 and(접속사)\u003c/span> : plants + , + meat + and + fish : \"식물, 고기, 그리고 물고기\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"They eat, 그들은 먹어요. plants, meat, 식물, 고기. and fish, 그리고 물고기를. 이 문장 전체를 해석하면, 그들은 식물, 고기, 그리고 물고기를 먹습니다.","hl":"m"},{"n":16,"text":"곰이 무엇을 먹는지 알려 주는 문장이에요. 식물과 고기와 물고기를 모두 먹는다니 곰은 이것저것 다 먹는 동물이네요.","hl":"mn"},{"n":17,"text":"첫 번째, they는 앞에 나온 곰들을 가리키는 말이에요. 여러 개를 가리키니까 eat에 s를 붙이지 않아요. 두 번째, and는 마지막 낱말 앞에 붙어서 여러 개를 한 번에 이어 줘요. 식물, 고기, 그리고 물고기처럼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 9\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">겨울에,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">In \u003c/span>\u003cspan class=\"tgt\">winter\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 잠을 자요\u003c/span>\u003cspan class=\"en\">they sleep\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">네 달 동안\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">four \u003c/span>\u003cspan class=\"tgt\">months\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">겨울에, 그들은 네 달 동안 잠을 잡니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 겨울에 곰이 어떻게 지내는지 알려 주는 문장이에요. 곰은 겨울에 \u003cb class=\"key\">네 \u003c/b>\u003cb class=\"key\">달\u003c/b> 동안이나 잠을 자요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간을 나타내는 in(전치사)\u003c/span> : in + 계절(winter) : \"겨울에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">기간을 나타내는 for(전치사)\u003c/span> : for + 기간(four months) : \"네 달 동안\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"In winter, 겨울에. they sleep, 그들은 잠을 자요. for four months, 네 달 동안. 이 문장 전체를 해석하면, 겨울에, 그들은 네 달 동안 잠을 잡니다.","hl":"m"},{"n":19,"text":"겨울에 곰이 어떻게 지내는지 알려 주는 문장이에요. 겨울 내내 잠을 자는 곰의 모습이 떠오르죠.","hl":"mn"},{"n":20,"text":"첫 번째, 계절 앞에는 in을 붙여서 겨울에라고 말해요. 두 번째, 얼마 동안인지 말할 때는 for를 써요. 네 달 동안은 for four months가 되죠. 아주 잘 따라왔어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 가지고 있어요\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">have\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다섯 개의 발가락을\u003c/span>\u003cspan class=\"en\">five toes\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">각 발에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">each \u003c/span>\u003cspan class=\"tgt\">foot\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 각 발에 다섯 개의 발가락을 가지고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 곰의 발을 자세히 알려 주는 문장이에요. 곰은 발 하나에 \u003cb class=\"key\">발가락\u003c/b>이 \u003cb class=\"key\">다섯 \u003c/b>\u003cb class=\"key\">개\u003c/b>씩 있다는 것을 말해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">하는 일·상태 말(동사)\u003c/span> : 그들은(They) + 가진다(have) + 무엇을(five toes) : \"그들은 가지고 있어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소 짝꿍 말(전치사)\u003c/span> : on + 장소(each foot) : \"각 발에\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"They have, 그들은 가지고 있어요. five toes, 다섯 개의 발가락을. on each foot, 각 발에. 이 문장 전체를 해석하면, 그들은 각 발에 다섯 개의 발가락을 가지고 있습니다.","hl":"m"},{"n":22,"text":"이 문장은 곰의 발을 자세히 알려 줘요. 곰은 발 하나에 발가락이 다섯 개씩 있대요. 여러분 손가락은 몇 개인지 한번 세어 볼까요?","hl":"mn"},{"n":23,"text":"먼저 have는 '가지다'라는 뜻의 동사예요. 주어가 They처럼 여럿일 때는 have를 그대로 써요. 다음으로 on each foot을 볼까요? on은 '~에'라는 전치사이고, each는 '각각의'라는 뜻이에요. 그래서 각 발 하나하나에 발가락이 다섯 개 있다는 말이 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자이언트 판다들은\u003c/span>\u003cspan class=\"en\">Giant pandas\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">곰이기도 해요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are\u003c/span> bears, \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">too\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">자이언트 판다도 곰입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 자이언트 판다도 곰이라고 \u003cb class=\"key\">알려 \u003c/b>\u003cb class=\"key\">줘요\u003c/b>. 문장 끝의 too 덕분에 '\u003cb class=\"key\">역시\u003c/b>'라는 뜻이 더해져요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">am·are·is 친구들(be동사)\u003c/span> : 주어(Giant pandas) + 이다(are) + 보어(bears) : \"곰이에요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">더 자세히 알려 주는 말(부사)\u003c/span> : 문장 끝 + too = '~도 역시' : \"역시, ~도\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Giant pandas, 자이언트 판다들은. are bears, too, 곰이기도 해요. 이 문장 전체를 해석하면, 자이언트 판다도 곰입니다.","hl":"m"},{"n":25,"text":"이 문장은 자이언트 판다도 곰이라고 알려 줘요. 문장 끝에 too가 있어서 '역시'라는 뜻이 살짝 더해져요.","hl":"mn"},{"n":26,"text":"먼저 are는 '~이다'라는 be동사예요. 주어인 Giant pandas가 여럿이라서 are를 써요. 그리고 문장 끝의 too는 '역시'라는 뜻을 더해 주는 부사예요. 그래서 '판다도 곰이에요'처럼 들려요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 9\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 자이언트 판다들은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">But\u003c/span> giant p\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and\u003c/span>as\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 곰은\u003c/span>\u003cspan class=\"en\">and bears\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">같지 않아요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">not\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">같은 것\u003c/span>\u003cspan class=\"en\">the same.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 자이언트 판다와 곰은 같지 않습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 자이언트 판다와 곰은 \u003cb class=\"key\">같지 \u003c/b>\u003cb class=\"key\">않다\u003c/b>고 알려 줘요. But으로 앞 내용과 \u003cb class=\"key\">반대\u003c/b>되는 이야기를 시작해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 앞 내용 + But + 반대 내용 : \"하지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : A(giant pandas) + and + B(bears) : \"~와, 그리고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">am·are·is 친구들(be동사) + not\u003c/span> : 주어 + are + not + 보어 : \"~이 아니다, 같지 않아요\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"But giant pandas, 하지만 자이언트 판다들은. and bears, 그리고 곰은. are not, 같지 않아요. the same, 같은 것. 이 문장 전체를 해석하면, 하지만 자이언트 판다와 곰은 같지 않습니다.","hl":"m"},{"n":28,"text":"이 문장은 자이언트 판다와 곰이 같지 않다고 알려 줘요. But으로 시작해서 앞에서 말한 내용과 반대되는 이야기를 꺼내요.","hl":"mn"},{"n":29,"text":"먼저 But은 '하지만'이라는 이어 주는 말이에요. 앞 내용과 반대되는 이야기를 시작하죠. 다음으로 and는 자이언트 판다와 곰을 나란히 이어 줘요. 마지막으로 are 뒤에 not을 붙이면 '아니다'라는 뜻이 되어서, are not the same은 '같지 않아요'가 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자이언트 판다는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Giant \u003c/span>\u003cspan class=\"tgt\">pandas\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대나무를 먹습니다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">eat \u003c/span>\u003cspan class=\"tgt\">bamboo\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">자이언트 판다는 대나무를 먹습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 자이언트 판다의 \u003cb class=\"key\">먹이\u003c/b>가 \u003cb class=\"key\">대나무\u003c/b>라는 것을 알려 주는 문장이에요. 앞에서 판다는 여러 가지를 먹는다고 했는데, 판다가 다른 점을 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">여러 마리 이름 말(복수 명사)\u003c/span> : 한 마리(panda) + s(pandas) = 여러 마리 : \"자이언트 판다들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">하는 일 + 무엇을(동사 + 목적어)\u003c/span> : 먹는다(eat) + 무엇을(bamboo) : \"대나무를 먹어요\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Giant pandas, 자이언트 판다는. eat bamboo, 대나무를 먹습니다.. 이 문장 전체를 해석하면, 자이언트 판다는 대나무를 먹습니다.","hl":"m"},{"n":31,"text":"이 문장은 자이언트 판다의 먹이를 알려 줘요. 바로 대나무를 먹는다는 뜻이에요.","hl":"mn"},{"n":32,"text":"먼저 Giant pandas를 봐요. 판다가 여러 마리라서 이름 말 끝에 s가 붙었어요. 두 번째로 eat bamboo는 먹는다는 동사 뒤에 무엇을 먹는지 목적어가 온 모양이에요. 아주 깔끔한 문장이죠? 여러분도 직접 써 볼 수 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 때때로,\u003c/span>\u003cspan class=\"en\">And sometimes,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">야생에 사는 자이언트 판다는\u003c/span>\u003cspan class=\"en\">giant pandas \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">wild\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">벌레를 먹습니다,\u003c/span>\u003cspan class=\"en\">eat \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">bugs, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">꿀, 그리고 나뭇잎도요.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">honey, \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">leaves\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그리고 때때로, 야생에 사는 자이언트 판다는 벌레, 꿀, 그리고 나뭇잎을 먹습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 야생에서는 \u003cb class=\"key\">가끔\u003c/b> \u003cb class=\"key\">벌레\u003c/b>나 꿀, 나뭇잎도 먹는다는 것을 알려 줘요. 대나무만 먹는 건 아니라는 거예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">장소 짝꿍 말(전치사)\u003c/span> : in + 장소(the wild) = ~안에, ~에서 : \"야생에서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사 and)\u003c/span> : A(bugs), B(honey), and C(leaves) = A, B, 그리고 C : \"벌레, 꿀, 그리고 나뭇잎\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"And sometimes, 그리고 때때로. giant pandas in the wild, 야생에 사는 자이언트 판다는. eat bugs, 벌레를 먹습니다. honey, and leaves, 꿀, 그리고 나뭇잎도요.. 이 문장 전체를 해석하면, 그리고 때때로, 야생에 사는 자이언트 판다는 벌레, 꿀, 그리고 나뭇잎을 먹습니다.","hl":"m"},{"n":34,"text":"야생에서 사는 자이언트 판다는 가끔 벌레나 꿀, 나뭇잎도 먹는다는 뜻이에요. 생각보다 여러 가지를 먹는단 말이죠.","hl":"mn"},{"n":35,"text":"먼저 in the wild를 봐요. in은 장소를 알려 주는 짝꿍 말이에요. 그래서 in the wild는 야생에서라는 뜻이 돼요. 그리고 bugs, honey, and leaves처럼 여러 가지를 이어 줄 때는 마지막 앞에 and를 붙인다는 것도 기억해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또한,\u003c/span>\u003cspan class=\"en\">Also,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자이언트 판다는 오래 자지 않아요\u003c/span>\u003cspan class=\"en\">giant pandas \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003cspan class=\"tgt\">sleep\u003c/span> long\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">겨울에,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">winter\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그것들은 여섯 개의 발가락을 가지고 있어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">have\u003c/span> six toes\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">각 발에\u003c/span>\u003cspan class=\"en\">on each foot.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">또한, 자이언트 판다는 겨울에 오래 자지 않고, 각 발에 여섯 개의 발가락을 가지고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 자이언트 판다는 겨울에 \u003cb class=\"key\">오래 \u003c/b>\u003cb class=\"key\">자지 \u003c/b>\u003cb class=\"key\">않고\u003c/b>, 발가락이 \u003cb class=\"key\">여섯 \u003c/b>\u003cb class=\"key\">개\u003c/b>라는 점이 달라요. \u003cb class=\"key\">also\u003c/b>로 앞 내용에 하나를 더 붙여 말해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정문(~하지 않아요)(do/does 부정문)\u003c/span> : 주어 + don't + 동사원형(sleep) = ~하지 않아요 : \"자지 않아요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">때 짝꿍 말(전치사)\u003c/span> : in + 계절(winter) = ~에 : \"겨울에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사 and)\u003c/span> : 문장 + and + 문장 = 그리고 ~ : \"그리고 그것들은 가지고 있어요\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Also, 또한. giant pandas don't sleep long, 자이언트 판다는 오래 자지 않아요. in winter, 겨울에. and they have six toes, 그리고 그것들은 여섯 개의 발가락을 가지고 있어요. on each foot, 각 발에. 이 문장 전체를 해석하면, 또한, 자이언트 판다는 겨울에 오래 자지 않고, 각 발에 여섯 개의 발가락을 가지고 있습니다.","hl":"m"},{"n":37,"text":"자이언트 판다는 겨울에 오래 자지 않고, 발마다 발가락이 여섯 개라는 뜻이에요. 앞에서 배운 판다와 무엇이 다른지 잘 찾아보세요.","hl":"mn"},{"n":38,"text":"먼저 don't sleep을 봐요. 동사 앞에 don't를 넣으면 자지 않아요라는 부정문이 돼요. 두 번째로 in winter는 계절 앞에 in을 붙여 겨울에라고 말하는 거예요. 마지막으로 and가 앞 문장과 뒤 문장을 이어 주고 있어요. 오늘 세 문장 모두 정말 잘 따라왔어요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">문제 해설\u003c/span>\u003cdiv class=\"lp-box\">\u003cspan class=\"lp-big\">내용 확인 — 곰과 자이언트 판다의 다른 점 찾기\u003c/span>\u003cspan class=\"lp-pill\">정답 자이언트 판다는 겨울에 오래 자지 않고, 각 발에 발가락이 여섯 개예요.\u003c/span>\u003cdiv style=\"margin-top:8px\">글의 마지막 문장을 다시 찾아보세요. 판다는 겨울에 \u003cb class=\"key\">오래 \u003c/b>\u003cb class=\"key\">자지 \u003c/b>\u003cb class=\"key\">않고\u003c/b>, 발가락이 \u003cb class=\"key\">여섯 \u003c/b>\u003cb class=\"key\">개\u003c/b>라고 나와요. 그래서 곰의 특징인 네 달 동안 자기, 발가락 다섯 개와 헷갈리지 않게 골라야 해요.\u003c/div>\u003cul style=\"font-size:14.5px;margin:8px 0 0;padding-left:20px\">\u003cli>네 달 동안 잠을 잔다는 말은 곰의 특징이라서 틀렸어요.\u003c/li>\u003cli>발가락이 다섯 개라는 말은 곰의 특징이라서 틀렸어요.\u003c/li>\u003cli>대나무를 먹는다는 말은 판다의 먹이일 뿐, 겨울잠과 발가락의 차이가 아니라서 틀렸어요.\u003c/li>\u003c/ul>\u003c/div>","segs":[{"n":39,"text":"이제 문제를 풀어 볼까요? 곰과 자이언트 판다가 다른 점을 찾는 문제예요. 글의 마지막 문장을 다시 보면, 판다는 겨울에 오래 자지 않고 발가락이 여섯 개라고 해요. 그래서 정답은 판다의 겨울잠과 발가락이에요. 네 달 동안 자기나 발가락 다섯 개는 곰의 특징이라서 정답이 아니에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">오늘 배운 내용 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>곰은 식물, 고기, 물고기를 먹는 \u003cb class=\"key\">잡식 \u003c/b>\u003cb class=\"key\">동물\u003c/b>이에요.\u003c/li>\u003cli>곰은 겨울에 \u003cb class=\"key\">네 \u003c/b>\u003cb class=\"key\">달\u003c/b> 동안 자고, 발가락이 다섯 개예요.\u003c/li>\u003cli>자이언트 판다도 곰이지만 \u003cb class=\"key\">대나무\u003c/b>를 먹어요.\u003c/li>\u003cli>판다는 겨울에 오래 자지 않고 발가락이 \u003cb class=\"key\">여섯 \u003c/b>\u003cb class=\"key\">개\u003c/b>라서 곰과 달라요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Giant pandas are bears too, but they are different from other bears in food, winter sleep, and toes.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">곰은 식물, 고기, 물고기를 먹고 겨울에 \u003cb class=\"key\">네 \u003c/b>\u003cb class=\"key\">달\u003c/b> 동안 자며 발가락이 다섯 개예요. 자이언트 판다도 곰이지만 \u003cb class=\"key\">대나무\u003c/b>를 먹고, 겨울에 오래 자지 않으며 발가락이 \u003cb class=\"key\">여섯 \u003c/b>\u003cb class=\"key\">개\u003c/b>예요.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":40,"text":"오늘 우리는 곰과 자이언트 판다를 비교하며 읽었어요. 곰은 고기도 먹고 겨울에 오래 자지만, 판다는 대나무를 먹고 발가락이 여섯 개였죠. 여러분 정말 잘했어요. 다음에도 재미있는 동물 이야기로 만나요, 안녕!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
