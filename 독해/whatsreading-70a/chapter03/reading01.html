<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>What's Reading 70 A Ch3 Unit 01 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"What's Reading 70 A Ch3 Unit 01","audioDir":"reading01_audio","preview":false,"count":49,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.923em\">Ch3\u003cbr>Unit\u003cbr>01\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">What's Reading 70 A\u003c/div>\u003ch1>Grandfather's Farm\u003c/h1>\u003ch2>할아버지의 농장\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">한 줄 요약\u003c/span>\u003cspan>나는 할아버지 농장에서 \u003cb class=\"key\">송아지\u003c/b>와 \u003cb class=\"key\">어미 \u003c/b>\u003cb class=\"key\">소\u003c/b>를 돌보고 우유를 받았어요. 쉽지는 않았지만 \u003cb class=\"key\">기분이 \u003c/b>\u003cb class=\"key\">정말 \u003c/b>\u003cb class=\"key\">좋았어요\u003c/b>.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The writer helped Grandfather on the farm and felt great after getting milk from the cow.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 Grandfather's Farm이라는 글을 함께 읽어요. 이 글은 할아버지 농장에서 송아지와 어미 소를 돌보고 우유를 받은 이야기예요. 마지막에는 기분이 정말 좋았으니 재미있게 시작해 볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">미리 알면 쉬워요\u003c/span>\u003cdiv class=\"lp-box\">농장(farm)에서는 소(cow)를 키워 우유를 얻어요. 아기 소의 엄마 소는 \u003cb class=\"key\">어미 \u003c/b>\u003cb class=\"key\">소\u003c/b>라고 하고, 갓 태어난 아기 소는 \u003cb class=\"key\">송아지\u003c/b>라고 해요. 송아지는 작고 약해서 어른이 돌보아 주어야 해요. 마치 동생이 태어나면 가족 모두가 함께 돌보는 것과 비슷해요. 우유를 짜려면 소가 가만히 있어야 해서 \u003cb class=\"key\">인내심\u003c/b>도 필요해요.\u003c/div>","segs":[{"n":2,"text":"여러분, 농장에서는 소를 키워 우유를 얻어요. 아기 소의 엄마 소는 어미 소라고 하고, 갓 태어난 아기 소는 송아지라고 해요. 송아지는 작고 약해서 어른이 돌보아 주어야 해요. 여러분도 동생이나 강아지를 돌본 적이 있나요? 우유를 짜려면 소가 가만히 있어야 해서 인내심도 필요해요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>농장에 간 날\u003csmall>시작 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>오늘 나는 할아버지 농장에 갔어요. 어미 소가 송아지를 낳아서 할아버지에게 \u003cb class=\"key\">도움\u003c/b>이 필요했어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>서로 돌봄\u003csmall>소개 · 문장 3–7\u003c/small>\u003c/h4>\u003cp>작고 약한 \u003cb class=\"key\">송아지\u003c/b>는 할아버지가 돌보셨어요. 나는 \u003cb class=\"key\">어미 \u003c/b>\u003cb class=\"key\">소\u003c/b>를 돌보며 \u003cb class=\"key\">먹이\u003c/b>를 주고 농장을 청소했어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>소가 움직여요\u003csmall>문제 · 문장 8–10\u003c/small>\u003c/h4>\u003cp>우유가 필요했지만 소가 \u003cb class=\"key\">계속 \u003c/b>\u003cb class=\"key\">움직였어요\u003c/b>. 그래서 나는 소를 \u003cb class=\"key\">안아 \u003c/b>\u003cb class=\"key\">주고\u003c/b> \u003cb class=\"key\">다시 \u003c/b>\u003cb class=\"key\">시도했어요\u003c/b>.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>우유를 채운 기쁨\u003csmall>해결 · 문장 11–12\u003c/small>\u003c/h4>\u003cp>마침내 \u003cb class=\"key\">양동이\u003c/b>를 \u003cb class=\"key\">우유\u003c/b>로 채웠어요. 쉽지 않았지만 \u003cb class=\"key\">기분이 \u003c/b>\u003cb class=\"key\">정말 \u003c/b>\u003cb class=\"key\">좋았어요\u003c/b>.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 이야기가 어떤 순서로 흘러가는지 살펴볼까요?","hl":null},{"n":4,"text":"첫 번째 단계는 농장에 간 날이에요. 오늘 나는 할아버지 농장에 갔어요. 어미 소가 송아지를 낳아서 할아버지에게 도움이 필요했어요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 서로 돌봄이에요. 작고 약한 송아지는 할아버지가 돌보셨어요. 나는 어미 소를 돌보며 먹이를 주고 농장을 청소했어요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 움직이는 소예요. 우유가 필요했지만 소가 계속 움직였어요. 그래서 나는 소를 안아 주고 다시 시도했어요.","hl":"f2"},{"n":7,"text":"네 번째 단계는 우유를 채운 기쁨이에요. 마침내 양동이를 우유로 채웠어요. 쉽지 않았지만 기분이 정말 좋았어요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">이야기 순서(문제-해결)\u003c/span>\u003cspan class=\"lp-pill\">끝\u003c/span>\u003cspan class=\"lp-pill\">주제문 12번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 오늘 농장에서 있었던 일을 \u003cb class=\"key\">이야기 \u003c/b>\u003cb class=\"key\">순서\u003c/b>로 들려줘요. 중간에 소가 움직여서 생긴 \u003cb class=\"key\">문제\u003c/b>를 보여 주고, 마지막에 \u003cb class=\"key\">해결\u003c/b>과 기분을 말해요. 그래서 마지막 문장이 글의 중심 문장이에요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>because (2)\u003c/b>\u003cspan>이유를 알려 줌\u003c/span>\u003cb>But (9)\u003c/b>\u003cspan>반대 내용을 알려 줌\u003c/span>\u003cb>So (10)\u003c/b>\u003cspan>결과와 다음 행동을 알려 줌\u003c/span>\u003cb>but (12)\u003c/b>\u003cspan>반대 내용을 이어 줌\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">a mother cow\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the mother cow\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the cow\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 오늘 농장에서 있었던 일을 이야기 순서로 들려줘요. 중간에 소가 움직여서 생긴 문제를 보여 주고, 마지막에 해결과 기분을 말해요. 그래서 중심 문장은 글의 끝에 있어요.","hl":"ty"},{"n":9,"text":"글의 길잡이 말도 찾아볼까요? because는 이유를 알려 주고, But은 반대 내용을, So는 결과와 다음 행동을 알려 줘요. 같은 대상을 mother cow, the mother cow, the cow처럼 다르게 부르기도 해요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 단어\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>visited\u003c/b>\u003cem>동사\u003c/em>\u003cspan>방문했다\u003c/span>\u003c/div>\u003cdiv>\u003cb>grandfather\u003c/b>\u003cem>명사\u003c/em>\u003cspan>할아버지\u003c/span>\u003c/div>\u003cdiv>\u003cb>farm\u003c/b>\u003cem>명사\u003c/em>\u003cspan>농장\u003c/span>\u003c/div>\u003cdiv>\u003cb>needed\u003c/b>\u003cem>동사\u003c/em>\u003cspan>필요했다\u003c/span>\u003c/div>\u003cdiv>\u003cb>help\u003c/b>\u003cem>명사\u003c/em>\u003cspan>도움\u003c/span>\u003c/div>\u003cdiv>\u003cb>because\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>왜냐하면 ~때문에\u003c/span>\u003c/div>\u003cdiv>\u003cb>mother cow\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>어미 소\u003c/span>\u003c/div>\u003cdiv>\u003cb>had a baby cow\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>송아지를 낳았다\u003c/span>\u003c/div>\u003cdiv>\u003cb>baby cow\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>송아지\u003c/span>\u003c/div>\u003cdiv>\u003cb>weak\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>약한\u003c/span>\u003c/div>\u003cdiv>\u003cb>took care of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>돌보았다\u003c/span>\u003c/div>\u003cdiv>\u003cb>gave food to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에게 먹이를 주었다\u003c/span>\u003c/div>\u003cdiv>\u003cb>cleaned\u003c/b>\u003cem>동사\u003c/em>\u003cspan>청소했다\u003c/span>\u003c/div>\u003cdiv>\u003cb>milk\u003c/b>\u003cem>명사\u003c/em>\u003cspan>우유\u003c/span>\u003c/div>\u003cdiv>\u003cb>kept moving\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>계속 움직였다\u003c/span>\u003c/div>\u003cdiv>\u003cb>hugged\u003c/b>\u003cem>동사\u003c/em>\u003cspan>안아 주었다\u003c/span>\u003c/div>\u003cdiv>\u003cb>tried again\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>다시 시도했다\u003c/span>\u003c/div>\u003cdiv>\u003cb>filled\u003c/b>\u003cem>동사\u003c/em>\u003cspan>채웠다\u003c/span>\u003c/div>\u003cdiv>\u003cb>bucket\u003c/b>\u003cem>명사\u003c/em>\u003cspan>양동이\u003c/span>\u003c/div>\u003cdiv>\u003cb>felt great\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>기분이 정말 좋았다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"오늘의 단어도 소리 내어 읽어 볼까요? visited는 방문했다, needed는 필요했다, weak는 약한이라는 뜻이에요. took care of는 돌보았다, kept moving은 계속 움직였다, filled는 채웠다는 뜻이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">small\u003c/b>\u003cspan class=\"m\">작은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">little\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">big\u003c/span>\u003cspan class=\"a\">large\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">weak\u003c/b>\u003cspan class=\"m\">약한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">not strong\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">strong\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">easy\u003c/b>\u003cspan class=\"m\">쉬운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">simple\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hard\u003c/span>\u003cspan class=\"a\">difficult\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">great\u003c/b>\u003cspan class=\"m\">아주 좋은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">good\u003c/span>\u003cspan class=\"s\">wonderful\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">bad\u003c/span>\u003cspan class=\"a\">terrible\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">clean\u003c/b>\u003cspan class=\"m\">깨끗한, 청소하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">tidy\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">dirty\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"비슷한 말과 반대말도 함께 익혀요. small은 little과 비슷하고 big과 반대예요. weak는 not strong과 비슷하고 strong과 반대이며, easy는 simple과 비슷하고 hard와 반대예요. great는 good과 비슷하고 bad와 반대이며, clean은 tidy와 비슷하고 dirty와 반대예요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오늘, 나는 방문했습니다\u003c/span>\u003cspan class=\"en\">Today, I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">visited\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">할아버지의 농장을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">my \u003c/span>\u003cspan class=\"tgt\">grandfather's \u003c/span>\u003cspan class=\"tgt\">farm\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">오늘, 나는 할아버지의 농장을 방문했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이야기의 시작을 알려 주는 문장이에요. \u003cb class=\"key\">오늘\u003c/b> 내가 할아버지의 \u003cb class=\"key\">농장\u003c/b>에 갔다는 것을 말해 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(I) + 했어요(visited) + 무엇을 : \"방문했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">누구의 것(소유격 's)\u003c/span> : 누구(my grandfather) + 's + 무엇(farm) : \"할아버지의 농장\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Today, I visited, 오늘, 나는 방문했습니다. my grandfather's farm, 할아버지의 농장을. 이 문장 전체를 해석하면, 오늘, 나는 할아버지의 농장을 방문했습니다.","hl":"m"},{"n":13,"text":"이 문장은 이야기의 첫걸음이에요. 오늘 내가 할아버지 농장에 갔다는 걸 알려 주죠. 여러분도 주말에 어디 갔는지 떠올리며 읽어 보세요.","hl":"mn"},{"n":14,"text":"첫 번째, visited는 이미 지나간 일을 말하는 과거형이에요. 그래서 visit에 -ed를 붙였죠. 두 번째, my grandfather's farm처럼 사람 뒤에 's를 붙이면 누구의 것이라는 뜻이 돼요. 할아버지의 농장, 이렇게 말이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 12\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">할아버지는 도움이 필요하셨어요\u003c/span>\u003cspan class=\"en\">My grandfather \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">needed\u003c/span> help\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜냐하면 어미 소가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">because\u003c/span> a mother cow\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">송아지를 낳았기 때문이에요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">had\u003c/span> a baby cow.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어미 소가 송아지를 낳았기 때문에 할아버지는 도움이 필요하셨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 할아버지가 도움을 필요로 한 \u003cb class=\"key\">까닭\u003c/b>을 알려 주는 문장이에요. 어미 소가 송아지를 낳아서 \u003cb class=\"key\">일손\u003c/b>이 모자랐다는 뜻이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(My grandfather) + 했어요(needed) + 무엇을(help) : \"필요했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이유를 이어 주는 말(접속사)\u003c/span> : 결과(도움이 필요했어요) + 왜냐하면(because) + 이유(송아지가 태어났어요) : \"왜냐하면 ~때문에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(a mother cow) + 가졌어요(had) + 무엇을(a baby cow) : \"낳았어요, 가졌어요\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"My grandfather needed help, 할아버지는 도움이 필요하셨어요. because a mother cow, 왜냐하면 어미 소가. had a baby cow, 송아지를 낳았기 때문이에요. 이 문장 전체를 해석하면, 어미 소가 송아지를 낳았기 때문에 할아버지는 도움이 필요하셨습니다.","hl":"m"},{"n":16,"text":"할아버지가 왜 도움이 필요했는지 알려 주는 문장이에요. 어미 소가 송아지를 낳아서 일손이 모자랐다는 거죠.","hl":"mn"},{"n":17,"text":"첫 번째, needed는 지난 일이라 need에 -d를 붙여 과거형으로 말했어요. 두 번째, because는 이유를 알려 주는 접속사예요. 왜냐하면 하고 뒤에 까닭을 붙이면 돼요. 세 번째, had는 have의 불규칙 과거형이라 모양이 확 달라져요. 여기서는 송아지를 낳았다는 뜻으로 쓰였답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 송아지는\u003c/span>\u003cspan class=\"en\">The baby cow\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">작았어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">small \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 약했어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">weak\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 송아지는 작고 약했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 갓 태어난 송아지가 아주 \u003cb class=\"key\">작고 \u003c/b>\u003cb class=\"key\">약하다\u003c/b>는 것을 그려 주는 문장이에요. 그래서 \u003cb class=\"key\">돌봄\u003c/b>이 필요하다는 걸 알 수 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">is의 지난 모습(be동사 과거형)\u003c/span> : 무엇이(The baby cow) + 이었어요(was) + 어떠했어요(small) : \"작았어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">낱말을 이어 주는 말(접속사)\u003c/span> : 작은(small) + 그리고(and) + 약한(weak) : \"작고 약한\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"The baby cow, 그 송아지는. was small, 작았어요. and weak, 그리고 약했어요. 이 문장 전체를 해석하면, 그 송아지는 작고 약했습니다.","hl":"m"},{"n":19,"text":"갓 태어난 송아지가 얼마나 작고 약한지 보여 주는 문장이에요. 그래서 어른 소와 사람의 손길이 필요했던 거죠.","hl":"mn"},{"n":20,"text":"첫 번째, was는 is의 지난 모습이에요. 지난 이야기라서 was를 썼죠. 두 번째, small and weak처럼 and는 두 가지 성질을 나란히 이어 줘요. 작고 그리고 약한, 이렇게 말하면 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나의 할아버지는\u003c/span>\u003cspan class=\"en\">My grandfather\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 돌보셨습니다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">took \u003c/span>\u003cspan class=\"tgt\">care \u003c/span>\u003cspan class=\"tgt\">of\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">it\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">할아버지는 그것을 돌보셨습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 할아버지가 \u003cb class=\"key\">아기 \u003c/b>\u003cb class=\"key\">소\u003c/b>를 \u003cb class=\"key\">돌보았다\u003c/b>는 뜻이에요. 앞 문장에서 아기 소가 약하다고 했으니, 할아버지가 그 소를 보살폈다는 말이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(My grandfather) + 돌보았어요(took care of) + 무엇을(it) : \"돌보셨어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">대신하는 말(대명사)\u003c/span> : 무엇을(it) + 가리켜요 : \"그것을\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"My grandfather, 나의 할아버지는. took care of it, 그것을 돌보셨습니다.. 이 문장 전체를 해석하면, 할아버지는 그것을 돌보셨습니다.","hl":"m"},{"n":22,"text":"이 문장은 할아버지가 아기 소를 돌보았다는 뜻이에요. 앞에서 아기 소가 작고 약했다고 했죠. 그래서 할아버지가 그 소를 보살피셨어요.","hl":"mn"},{"n":23,"text":"첫 번째, took은 take의 과거형이에요. took care of는 돌보다라는 덩어리 표현이에요. 두 번째, it은 대명사로 앞에 나온 아기 소를 가리켜요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 돌보았습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">took \u003c/span>\u003cspan class=\"tgt\">care \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어미 소를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of\u003c/span> the mother cow.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 어미 소를 돌보았습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 내가 \u003cb class=\"key\">어미 \u003c/b>\u003cb class=\"key\">소\u003c/b>를 \u003cb class=\"key\">돌보았다\u003c/b>는 뜻이에요. 할아버지는 아기 소를, 나는 엄마 소를 맡아 돌본 거예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">나를 가리키는 말(대명사)\u003c/span> : 누가(I) + 했어요(took care of) : \"나는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(I) + 돌보았어요(took care of) + 무엇을(the mother cow) : \"돌보았습니다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"I took care, 나는 돌보았습니다. of the mother cow, 어미 소를. 이 문장 전체를 해석하면, 나는 어미 소를 돌보았습니다.","hl":"m"},{"n":25,"text":"이 문장은 내가 어미 소를 돌보았다는 뜻이에요. 할아버지는 아기 소를 돌보고, 나는 엄마 소를 맡아 돌본 거예요.","hl":"mn"},{"n":26,"text":"첫 번째, I는 말하는 나를 가리키는 대명사예요. 두 번째, took은 take의 과거형이에요. took care of는 돌보다라는 덩어리 표현이에요. 그래서 지난 일을 말할 때 took care of를 돌보았습니다라고 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 먹이를 좀 주었습니다\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">gave\u003c/span> some food\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">소에게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">cow\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 소에게 먹이를 좀 주었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 내가 소에게 \u003cb class=\"key\">먹이\u003c/b>를 \u003cb class=\"key\">주었다\u003c/b>는 뜻이에요. 어미 소가 잘 먹을 수 있게 먹이를 좀 준 거예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(I) + 주었어요(gave) + 무엇을(some food) : \"주었습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">받는 대상을 알려 주는 말(전치사)\u003c/span> : 누구에게(to the cow) : \"소에게\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"I gave some food, 나는 먹이를 좀 주었습니다. to the cow, 소에게. 이 문장 전체를 해석하면, 나는 소에게 먹이를 좀 주었습니다.","hl":"m"},{"n":28,"text":"이 문장은 내가 소에게 먹이를 주었다는 뜻이에요. 어미 소가 잘 먹을 수 있게 먹이를 좀 준 거예요.","hl":"mn"},{"n":29,"text":"첫 번째, gave는 give의 과거형이에요. 이미 지난 일을 말할 때 써요. 두 번째, to는 전치사로 먹이를 받는 소를 알려 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 청소했어요\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">cleaned\u003c/span>\u ss=\"gn\">ing 붙은 말(동사-ing)\u003c/span> : 누가(the cow) + 계속 했다(kept) + 움직이기(moving) : \"계속 움직였어요\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"But the cow, 하지만 그 소는. kept moving, 계속 움직였어요. 이 문장 전체를 해석하면, 하지만 소는 계속 움직였습니다.","hl":"m"},{"n":37,"text":"이 문장은 소가 가만히 있지 않고 계속 움직였다는 뜻이에요. 그래서 우유를 짜기가 힘들었다는 걸 알려 주죠.","hl":"mn"},{"n":38,"text":"먼저 But은 앞 문장과 반대되는 내용을 이어 줘요. 우유가 필요했는데 소가 계속 움직였다는 걸 알려 주죠. 그리고 kept moving은 keep에 -ing를 붙여 계속 움직였다는 뜻을 만들어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서 나는 안아 주었어요\u003c/span>\u003cspan class=\"en\">So I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">hugged\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 소를\u003c/span>\u003cspan class=\"en\">the cow\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 다시 시도했어요.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">tried\u003c/span> again.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그래서 나는 소를 안아 주고 다시 시도했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 소를 \u003cb class=\"key\">안아 \u003c/b>\u003cb class=\"key\">주고\u003c/b> \u003cb class=\"key\">다시 \u003c/b>\u003cb class=\"key\">시도한\u003c/b> 장면을 보여 줘요. 어려워도 포기하지 않고 다시 해 보는 마음이 드러나요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일을 말하는 동사(과거형)\u003c/span> : 안았다(hugged) = 안아 주다(hug) + ed : \"안아 주었어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 안았다(hugged) + 그리고(and) + 시도했다(tried) : \"그리고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">지난 일을 말하는 동사(과거형)\u003c/span> : 시도했다(tried) = 시도하다(try) + ed : \"시도했어요\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"So I hugged, 그래서 나는 안아 주었어요. the cow, 그 소를. and tried again, 그리고 다시 시도했어요.. 이 문장 전체를 해석하면, 그래서 나는 소를 안아 주고 다시 시도했습니다.","hl":"m"},{"n":40,"text":"이 문장은 소를 안아 주고 다시 시도한 장면이에요. 앞에서 소가 계속 움직여서 어려웠지만, 포기하지 않고 다시 해 본 거예요.","hl":"mn"},{"n":41,"text":"첫 번째, hugged는 지난 일을 말하는 과거형이에요. 두 번째, and는 두 가지 행동을 이어 주는 접속사예요. 세 번째, tried도 과거형이에요. try는 y를 i로 바꾸고 ed를 붙여 다시 시도했다는 뜻이 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 채웠어요\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">filled\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">양동이를\u003c/span>\u003cspan class=\"en\">a bucket\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우유로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">with\u003c/span> milk.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 양동이를 우유로 채웠습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 우유를 짜서 \u003cb class=\"key\">양동이\u003c/b>를 우유로 가득 \u003cb class=\"key\">채웠어요\u003c/b>. 힘들었지만 해낸 뿌듯함이 느껴져요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일을 말하는 동사(과거형)\u003c/span> : 채웠다(filled) = 채우다(fill) + ed : \"채웠어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">짝꿍 말(전치사)\u003c/span> : 채웠다(filled) + 우유로(with milk) : \"우유로\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"I filled, 나는 채웠어요. a bucket, 양동이를. with milk, 우유로. 이 문장 전체를 해석하면, 나는 양동이를 우유로 채웠습니다.","hl":"m"},{"n":43,"text":"이 문장은 내가 양동이를 우유로 가득 채웠어요. 힘들게 우유를 짠 뒤에 양동이를 우유로 가득 채웠다는 결과를 말해요.","hl":"mn"},{"n":44,"text":"첫 번째, filled는 지난 일을 말하는 동사예요. fill 뒤에 ed를 붙여 채웠다는 뜻을 만들어요. 두 번째, with는 무엇으로 채웠는지 알려 주는 전치사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 12\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 쉽지 않았어요\u003c/span>\u003cspan class=\"en\">It \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">wasn't\u003c/span> easy,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 나는 기분이 정말 좋았어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">but\u003c/span> I \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">felt\u003c/span> great.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 쉽지 않았지만, 나는 기분이 정말 좋았습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 힘들었지만 해내서 \u003cb class=\"key\">기분이 \u003c/b>\u003cb class=\"key\">정말 \u003c/b>\u003cb class=\"key\">좋았어요\u003c/b>라는 \u003cb class=\"key\">결론\u003c/b>을 보여 줘요. 어려운 일도 해내면 뿌듯하다는 마음이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사 아니에요 말(be동사 부정문)\u003c/span> : 그것은(It) + 쉽지 않았다(wasn't easy) : \"쉽지 않았어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">반대를 이어 주는 말(접속사)\u003c/span> : 쉽지 않았다(wasn't easy) + 하지만(but) + 기분이 좋았다(felt great) : \"하지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">지난 일을 말하는 동사(과거형)\u003c/span> : 나는(I) + 기분이 좋았다(felt great) : \"기분이 좋았어요\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"It wasn't easy, 그것은 쉽지 않았어요. but I felt great, 하지만 나는 기분이 정말 좋았어요. 이 문장 전체를 해석하면, 그것은 쉽지 않았지만, 나는 기분이 정말 좋았습니다.","hl":"m"},{"n":46,"text":"이 문장은 우유를 짜는 일이 쉽지 않았지만 그래도 기분이 정말 좋았어요. 힘들어도 해낸 뿌듯함을 보여 주는 결론이에요.","hl":"mn"},{"n":47,"text":"첫 번째, wasn't는 was not을 줄인 말이에요. 두 번째, but은 앞말과 반대되는 내용을 이어 주는 접속사예요. 세 번째, felt는 feel의 과거형이에요. 그때 기분이 아주 좋았다는 뜻이죠.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">문제 해설\u003c/span>\u003cdiv class=\"lp-box\">\u003cspan class=\"lp-big\">내용 확인 — 할아버지는 무엇을 돌보았나요?\u003c/span>\u003cspan class=\"lp-pill\">정답 작고 약한 송아지\u003c/span>\u003cdiv style=\"margin-top:8px\">둘째 문장에서 어미 소가 송아지를 낳아 할아버지에게 도움이 필요했어요. 넷째 문장에서 할아버지가 \u003cb class=\"key\">송아지\u003c/b>를 돌보았다고 나와요. 다섯째 문장의 \u003cb class=\"key\">어미 \u003c/b>\u003cb class=\"key\">소\u003c/b>는 내가 돌본 것이에요.\u003c/div>\u003cul style=\"font-size:14.5px;margin:8px 0 0;padding-left:20px\">\u003cli>어미 소는 내가 돌보았으므로 할아버지가 돌본 대상이 아니에요.\u003c/li>\u003cli>농장 청소는 내가 했으므로 정답이 아니에요.\u003c/li>\u003cli>소가 움직인 것은 문제 상황이지 돌본 대상이 아니에요.\u003c/li>\u003c/ul>\u003c/div>","segs":[{"n":48,"text":"이제 문제를 풀어 볼까요? 질문은 할아버지가 무엇을 돌보았는지 찾는 거예요. 넷째 문장에서 할아버지는 작고 약한 송아지를 돌보셨고, 다섯째 문장의 어미 소는 내가 돌본 거예요. 그래서 정답은 작고 약한 송아지예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">오늘 배운 내용 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>나는 할아버지 농장에서 \u003cb class=\"key\">어미 \u003c/b>\u003cb class=\"key\">소\u003c/b>를 돌보았어요.\u003c/li>\u003cli>작고 약한 \u003cb class=\"key\">송아지\u003c/b>는 할아버지가 돌보셨어요.\u003c/li>\u003cli>소가 계속 움직였지만 \u003cb class=\"key\">안아 \u003c/b>\u003cb class=\"key\">주고\u003c/b> \u003cb class=\"key\">다시 \u003c/b>\u003cb class=\"key\">시도했어요\u003c/b>.\u003c/li>\u003cli>우유로 양동이를 채운 뒤 \u003cb class=\"key\">기분이 \u003c/b>\u003cb class=\"key\">정말 \u003c/b>\u003cb class=\"key\">좋았어요\u003c/b>.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The writer helped Grandfather on the farm and felt great after getting milk from the cow.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">나는 할아버지 농장에서 \u003cb class=\"key\">송아지\u003c/b>와 \u003cb class=\"key\">어미 \u003c/b>\u003cb class=\"key\">소\u003c/b>를 돌보고 우유를 받았어요. 쉽지는 않았지만 \u003cb class=\"key\">기분이 \u003c/b>\u003cb class=\"key\">정말 \u003c/b>\u003cb class=\"key\">좋았어요\u003c/b>.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":49,"text":"오늘 우리는 할아버지 농장에서 송아지와 어미 소를 돌보고 우유를 받은 이야기를 읽었어요. 소가 계속 움직여도 안아 주고 다시 시도한 점이 정말 멋졌어요. 여러분도 어려운 일이 있어도 포기하지 말고 다시 해 보세요. 오늘도 열심히 읽어 준 여러분, 정말 잘했어요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
