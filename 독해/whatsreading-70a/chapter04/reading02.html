<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>What's Reading 70 A Ch4 Unit 02 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"What's Reading 70 A Ch4 Unit 02","audioDir":"reading02_audio","preview":false,"count":48,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.923em\">Ch4\u003cbr>Unit\u003cbr>02\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">What's Reading 70 A\u003c/div>\u003ch1>Teotihuacán: The City of the Gods\u003c/h1>\u003ch2>테오티와칸: 신들의 도시\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">한 줄 요약\u003c/span>\u003cspan>요약: 멕시코의 아주 오래된 도시 \u003cb class=\"key\">테오티와칸\u003c/b>은 화재로 모든 것이 파괴되어 사람들이 모두 떠났어요. 수 세기 후 \u003cb class=\"key\">아즈텍 \u003c/b>\u003cb class=\"key\">족\u003c/b>이 그 도시와 피라미드를 발견하고 '신들의 도시', '\u003cb class=\"key\">태양의 \u003c/b>\u003cb class=\"key\">피라미드\u003c/b>'라는 이름을 붙였어요.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Teotihuacán is a very old city in Mexico that was destroyed by fire and later found and named by the Aztecs.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘도 만나서 반가워요. 오늘은 멕시코에 있는 아주 신비로운 도시 이야기를 읽어 볼 거예요. 제목은 Teotihuacán, 우리말로는 테오티와칸이에요. 아주 오래된 도시가 불에 타서 사라졌다가, 수 세기 뒤에 다시 발견된 이야기래요. 정말 궁금하죠? 같이 읽어 봐요!","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">미리 알면 쉬워요\u003c/span>\u003cdiv class=\"lp-box\">멕시코에는 옛날 사람들이 만든 커다란 \u003cb class=\"key\">피라미드\u003c/b>가 있어요. 피라미드는 돌을 쌓아 만든 삼각형 모양 건물이고, 영어로는 pyramid라고 해요. 우리가 운동회 때 친구들과 모래성을 쌓듯이, 옛날 사람들은 아주 오랜 시간 동안 돌을 하나하나 쌓았어요. 흙과 돌로 만든 것은 세월이 지나도 모양이 남아서, 나중에 다른 사람들이 \u003cb class=\"key\">발견\u003c/b>할 수 있답니다.\u003c/div>","segs":[{"n":2,"text":"여러분, 피라미드라고 들어 봤나요? 피라미드는 돌을 쌓아 만든 커다란 삼각형 모양 건물이고, 영어로는 pyramid라고 해요. 옛날 사람들은 운동회 때 모래성을 쌓듯이, 아주 오랜 시간 동안 돌을 하나하나 쌓아 피라미드를 만들었어요. 흙과 돌로 만든 것은 세월이 지나도 모양이 남아서, 나중에 다른 사람들이 발견할 수 있답니다. 여러분이라면 그 도시에 어떤 이름을 지어 주고 싶나요?","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>고대 도시의 탄생\u003csmall>시작 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>멕시코에는 아주 오래된 도시 \u003cb class=\"key\">테오티와칸\u003c/b>이 있어요. 오래 전에 사람들은 그 도시에 \u003cb class=\"key\">피라미드\u003c/b>들을 지었어요. Long ago는 '오래 전에'라는 뜻이에요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>화재와 빈 도시\u003csmall>문제 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>하지만 700년대에 \u003cb class=\"key\">화재\u003c/b>가 모든 것을 파괴했어요. 그래서 모든 사람이 그 도시를 \u003cb class=\"key\">떠났어요\u003c/b>. But은 앞 내용과 반대되는 이야기를 이어 줘요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>아즈텍 족의 발견\u003csmall>발견 · 문장 5–9\u003c/small>\u003c/h4>\u003cp>수 세기 후에 \u003cb class=\"key\">아즈텍 \u003c/b>\u003cb class=\"key\">족\u003c/b>이 그 도시를 발견했어요. 그들은 도시를 '테오티와칸', 즉 '\u003cb class=\"key\">신들의 \u003c/b>\u003cb class=\"key\">도시\u003c/b>'라고 불렀어요. 피라미드 하나도 발견하고 '\u003cb class=\"key\">태양의 \u003c/b>\u003cb class=\"key\">피라미드\u003c/b>'라는 이름을 붙였어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>오늘날의 피라미드\u003csmall>마무리 · 문장 10–12\u003c/small>\u003c/h4>\u003cp>오늘날 많은 \u003cb class=\"key\">관광객\u003c/b>이 그 피라미드를 방문해요. 사람들은 그 피라미드가 너무 커서 \u003cb class=\"key\">놀라워요\u003c/b>. 크기가 경기장의 약 \u003cb class=\"key\">일곱 \u003c/b>\u003cb class=\"key\">배\u003c/b>나 되기 때문이에요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 시간이 흐르는 순서대로, 도시가 생기고 사라지고 다시 발견되는 이야기를 들려줘요.","hl":null},{"n":4,"text":"먼저 첫 번째 문장을 볼게요. Teotihuacán is a very old city in Mexico. 여기서 very old는 아주 오래된이라는 뜻이에요. 그래서 테오티와칸은 멕시코에 있는 아주 오래된 도시라는 걸 알 수 있죠. 두 번째 문장에서는 오래 전에 사람들이 그 도시에 피라미드들을 지었다고 해요. Long ago는 오래 전에라는 뜻이에요.","hl":"f0"},{"n":5,"text":"그런데 세 번째 문장에서 But이 나와요. But은 하지만, 앞 내용과 반대되는 이야기를 이어 줄 때 써요. 칠백 년대에 화재가 모든 것을 파괴했대요. 그래서 네 번째 문장처럼 모든 사람이 그 도시를 떠났어요. 도시가 텅 비고 만 거죠.","hl":"f1"},{"n":6,"text":"시간이 많이 흐른 뒤, 다섯 번째 문장에서 아즈텍 족이 그 도시를 발견해요. After centuries는 수 세기 후에라는 뜻이에요. 아즈텍 족은 그 도시를 테오티와칸이라고 불렀고, 그 뜻은 신들의 도시래요. 여덟 번째 문장에서는 피라미드 하나도 발견하고 태양의 피라미드라고 이름을 붙였어요.","hl":"f2"},{"n":7,"text":"마지막으로 열 번째 문장을 보세요. Today, 오늘날에는 많은 관광객이 그 피라미드를 방문해요. 사람들은 그 피라미드가 너무 커서 놀라워요. 열두 번째 문장처럼 경기장 크기의 약 일곱 배나 된대요. 정말 어마어마하죠?","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">이야기 순서\u003c/span>\u003cspan class=\"lp-pill\">처음\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 시간이 흐르는 순서대로 이야기를 해요. 도시가 생기고, 화재로 비었다가, 나중에 다시 발견되는 차례예요. 그래서 글의 중심이 되는 문장은 \u003cb class=\"key\">처음\u003c/b>에 나오는 첫 번째 문장이에요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Long ago (2)\u003c/b>\u003cspan>옛날이라는 때를 알려 줌\u003c/span>\u003cb>But (3)\u003c/b>\u003cspan>앞 내용과 반대되는 이야기\u003c/span>\u003cb>After centuries (5)\u003c/b>\u003cspan>시간이 많이 흘렀다고 알려 줌\u003c/span>\u003cb>Today (10)\u003c/b>\u003cspan>오늘날로 때가 바뀜\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">the city\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Teotihuacán\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the city of the gods\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a pyramid\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the Pyramid of the Sun\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 시간이 흐르는 순서대로 쓰인 이야기 글이에요. 도시가 생기고, 화재로 비었다가, 다시 발견되는 차례예요. 글의 중심이 되는 문장은 처음에 나오는 첫 번째 문장이에요.","hl":"ty"},{"n":9,"text":"길잡이 말도 눈여겨보세요. Long ago는 오래 전에, After centuries는 수 세기 후에, Today는 오늘날이라는 뜻으로 시간이 바뀐다는 걸 알려 줘요. 그리고 But은 앞 내용과 반대되는 이야기를 이어 주는 말이에요. 같은 도시를 the city, Teotihuacán, the city of the gods라고 다르게 부르고, 피라미드도 the Pyramid of the Sun이라는 새 이름을 얻었어요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 단어\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>old\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>오래된\u003c/span>\u003c/div>\u003cdiv>\u003cb>city\u003c/b>\u003cem>명사\u003c/em>\u003cspan>도시\u003c/span>\u003c/div>\u003cdiv>\u003cb>long ago\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>오래 전에\u003c/span>\u003c/div>\u003cdiv>\u003cb>build (built)\u003c/b>\u003cem>동사\u003c/em>\u003cspan>짓다, 세우다\u003c/span>\u003c/div>\u003cdiv>\u003cb>pyramid\u003c/b>\u003cem>명사\u003c/em>\u003cspan>피라미드\u003c/span>\u003c/div>\u003cdiv>\u003cb>fire\u003c/b>\u003cem>명사\u003c/em>\u003cspan>불, 화재\u003c/span>\u003c/div>\u003cdiv>\u003cb>destroy\u003c/b>\u003cem>동사\u003c/em>\u003cspan>파괴하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>everything\u003c/b>\u003cem>대명사\u003c/em>\u003cspan>모든 것\u003c/span>\u003c/div>\u003cdiv>\u003cb>everyone\u003c/b>\u003cem>대명사\u003c/em>\u003cspan>모든 사람\u003c/span>\u003c/div>\u003cdiv>\u003cb>leave (left)\u003c/b>\u003cem>동사\u003c/em>\u003cspan>떠나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>century\u003c/b>\u003cem>명사\u003c/em>\u003cspan>세기, 100년\u003c/span>\u003c/div>\u003cdiv>\u003cb>find (found)\u003c/b>\u003cem>동사\u003c/em>\u003cspan>발견하다, 찾다\u003c/span>\u003c/div>\u003cdiv>\u003cb>call\u003c/b>\u003cem>동사\u003c/em>\u003cspan>부르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>mean\u003c/b>\u003cem>동사\u003c/em>\u003cspan>의미하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>god\u003c/b>\u003cem>명사\u003c/em>\u003cspan>신\u003c/span>\u003c/div>\u003cdiv>\u003cb>also\u003c/b>\u003cem>부사\u003c/em>\u003cspan>또한\u003c/span>\u003c/div>\u003cdiv>\u003cb>tourist\u003c/b>\u003cem>명사\u003c/em>\u003cspan>관광객\u003c/span>\u003c/div>\u003cdiv>\u003cb>visit\u003c/b>\u003cem>동사\u003c/em>\u003cspan>방문하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>surprised\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>놀란\u003c/span>\u003c/div>\u003cdiv>\u003cb>size\u003c/b>\u003cem>명사\u003c/em>\u003cspan>크기\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"오늘의 단어도 소리 내어 읽어 볼게요. destroy는 파괴하다, leave는 떠나다, century는 세기라는 뜻이에요. find는 발견하다, surprised는 놀란, size는 크기라는 뜻이에요. 한 번씩 따라 읽어 보세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">old\u003c/b>\u003cspan class=\"m\">오래된\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">ancient\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">new\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">destroy\u003c/b>\u003cspan class=\"m\">파괴하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">break\u003c/span>\u003cspan class=\"s\">ruin\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">build\u003c/span>\u003cspan class=\"a\">make\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">leave\u003c/b>\u003cspan class=\"m\">떠나다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">go away\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">stay\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">find\u003c/b>\u003cspan class=\"m\">발견하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">discover\u003c/span>\u003cspan class=\"s\">see\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">lose\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">big\u003c/b>\u003cspan class=\"m\">큰\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">large\u003c/span>\u003cspan class=\"s\">huge\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">small\u003c/span>\u003cspan class=\"a\">little\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"비슷한 말과 반대말도 정리해 볼게요. old는 오래된이라는 뜻이고, 비슷한 말은 ancient예요. 반대말은 new, 새것이죠. destroy는 파괴하다, 비슷한 말은 break이고 반대말은 build, 짓다예요. leave는 떠나다, 비슷한 말은 go away이고 반대말은 stay, 머물다예요. big은 큰, 비슷한 말은 large이고 반대말은 small이에요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 12\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">테오티와칸은 ~이다\u003c/span>\u003cspan class=\"en\">Teotihuacán \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매우 오래된 도시\u003c/span>\u003cspan class=\"en\">a very old city\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">멕시코에 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">Mexico\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">테오티와칸은 멕시코에 있는 매우 오래된 도시입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 테오티와칸이 어떤 도시인지 처음 소개하는 문장이에요. \u003cb class=\"key\">멕시코\u003c/b>에 있는 아주 \u003cb class=\"key\">오래된 \u003c/b>\u003cb class=\"key\">도시\u003c/b>라고 알려 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">am·are·is 친구들(be동사)\u003c/span> : 테오티와칸(Teotihuacán) + ~이다(is) + 도시(city) : \"~이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소·시간 짝꿍 말(전치사)\u003c/span> : 어디에(in) + 멕시코(Mexico) : \"멕시코에(있는)\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Teotihuacán is, 테오티와칸은 ~이다. a very old city, 매우 오래된 도시. in Mexico, 멕시코에 있는. 이 문장 전체를 해석하면, 테오티와칸은 멕시코에 있는 매우 오래된 도시입니다.","hl":"m"},{"n":13,"text":"이 문장은 테오티와칸이 어떤 도시인지 소개해요. 멕시코에 있는 아주 오래된 도시라고 알려 주는 첫 문장이에요.","hl":"mn"},{"n":14,"text":"첫 번째, 테오티와칸은 도시 한 개를 가리키니까 be동사 is를 써요. 두 번째, 장소 앞에 in을 붙이면 멕시코에 있는, 이렇게 뜻이 만들어져요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오래 전에,\u003c/span>\u003cspan class=\"en\">Long ago,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들은 피라미드들을 지었습니다\u003c/span>\u003cspan class=\"en\">people \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">built\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">pyramids\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 도시에\u003c/span>\u003cspan class=\"en\">in the city.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">오래 전에, 사람들은 그 도시에 피라미드들을 지었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 오래 전에 사람들이 그 도시에 피라미드들을 \u003cb class=\"key\">지었다\u003c/b>는 이야기예요. 도시에서 있었던 \u003cb class=\"key\">지난 \u003c/b>\u003cb class=\"key\">일\u003c/b>을 알려 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 사람들(people) + 지었다(built) + 피라미드들을(pyramids) : \"지었습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">여러 개를 가리키는 말(복수 명사)\u003c/span> : 피라미드 하나(a pyramid) + 여러 개면 + s(pyramids) : \"피라미드들\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Long ago, 오래 전에. people built pyramids, 사람들은 피라미드들을 지었습니다. in the city, 그 도시에. 이 문장 전체를 해석하면, 오래 전에, 사람들은 그 도시에 피라미드들을 지었습니다.","hl":"m"},{"n":16,"text":"이 문장은 오래 전에 사람들이 그 도시에 피라미드들을 지었다는 이야기예요. 지난 일을 알려 주는 문장이죠.","hl":"mn"},{"n":17,"text":"첫 번째, build는 짓다라는 뜻인데 지난 일이라 built로 모양이 바뀌었어요. 두 번째, 피라미드가 여러 개니까 끝에 -s를 붙여서 피라미드들이라고 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 700년대에,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">But\u003c/span> in the 700s,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">화재가\u003c/span>\u003cspan class=\"en\">a fire\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 것을 파괴했습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">destroyed\u003c/span> everything.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 700년대에, 화재가 모든 것을 파괴했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 700년대에 \u003cb class=\"key\">화재\u003c/b>가 도시의 모든 것을 망가뜨렸다는 뜻이에요. 앞의 좋은 일과 \u003cb class=\"key\">반대\u003c/b>되는 나쁜 사건을 알려 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 앞 내용 + 하지만(But) + 뒤 내용 : \"하지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 화재가(a fire) + 파괴했다(destroyed) + 모든 것을(everything) : \"파괴했습니다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"But in the 700s, 하지만 700년대에. a fire, 화재가. destroyed everything, 모든 것을 파괴했습니다. 이 문장 전체를 해석하면, 하지만 700년대에, 화재가 모든 것을 파괴했습니다.","hl":"m"},{"n":19,"text":"이 문장은 700년대에 화재가 모든 것을 파괴했다는 뜻이에요. 앞에서 피라미드를 지었다는 좋은 이야기와 반대되는 나쁜 사건을 알려 주죠.","hl":"mn"},{"n":20,"text":"첫 번째, But은 앞말과 반대되는 이야기를 이어 줄 때 써요. 두 번째, destroy에 -ed를 붙이면 지난 일이 되어서 destroyed, 파괴했다가 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 사람이 떠났습니다\u003c/span>\u003cspan class=\"en\">Everyone \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">left\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 도시를\u003c/span>\u003cspan class=\"en\">the city.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">모든 사람이 그 도시를 떠났습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 화재 뒤에 \u003cb class=\"key\">모든 \u003c/b>\u003cb class=\"key\">사람\u003c/b>이 도시를 \u003cb class=\"key\">떠났다\u003c/b>는 뜻이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(Everyone) + 떠났다(left) + 무엇을(the city) : \"떠났습니다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Everyone left, 모든 사람이 떠났습니다. the city, 그 도시를. 이 문장 전체를 해석하면, 모든 사람이 그 도시를 떠났습니다.","hl":"m"},{"n":22,"text":"이 문장은 화재 뒤에 모든 사람이 도시를 떠났다, 이렇게 이해하면 돼요. 그래서 도시에는 아무도 남지 않았어요.","hl":"mn"},{"n":23,"text":"여기서 left는 leave의 과거형이에요. 지난 일을 말할 때 동사를 이렇게 바꿔요. 그래서 떠났습니다라는 뜻이죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수 세기 후에,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">After \u003c/span>\u003cspan class=\"tgt\">centuries\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아즈텍 족이 발견했습니다\u003c/span>\u003cspan class=\"en\">the Aztecs \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">found\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 도시를\u003c/span>\u003cspan class=\"en\">the city.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">수 세기 후에, 아즈텍 족이 그 도시를 발견했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아주 오랜 시간이 지난 뒤 \u003cb class=\"key\">아즈텍 \u003c/b>\u003cb class=\"key\">족\u003c/b>이 그 도시를 \u003cb class=\"key\">발견했다\u003c/b>는 뜻이에요. 버려진 도시가 다시 사람들에게 알려진 거예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">장소·시간 짝꿍 말(전치사)\u003c/span> : After + 시간(centuries), 그 뒤에 일이 일어나요 : \"수 세기 후에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(the Aztecs) + 발견했다(found) + 무엇을(the city) : \"발견했습니다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"After centuries, 수 세기 후에. the Aztecs found, 아즈텍 족이 발견했습니다. the city, 그 도시를. 이 문장 전체를 해석하면, 수 세기 후에, 아즈텍 족이 그 도시를 발견했습니다.","hl":"m"},{"n":25,"text":"아주 오랜 시간이 지난 뒤 아즈텍 족이 그 도시를 발견했다는 뜻이에요. 버려진 도시가 다시 사람들에게 알려진 거죠.","hl":"mn"},{"n":26,"text":"먼저 After는 시간을 나타내는 전치사예요. '~후에'라는 뜻이죠. 그리고 found는 find의 과거형이에요. 그래서 지난 일인 발견했습니다로 해석해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 불렀습니다\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">called\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 도시를 테오티와칸이라고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">city\u003c/span> &quot;Teotihuacán.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 그 도시를 &quot;테오티와칸&quot;이라고 불렀습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아즈텍 족이 그 도시를 \u003cb class=\"key\">테오티와칸\u003c/b>이라고 \u003cb class=\"key\">불렀다\u003c/b>는 뜻이에요. 이 이름은 다음 문장에서 뜻이 설명돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(They) + 불렀다(called) + 무엇을(the city) : \"불렀습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">무엇을(목적어)\u003c/span> : 동사(called) + 무엇을(the city) : \"그 도시를\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"They called, 그들은 불렀습니다. the city \"Teotihuacán.\", 그 도시를 테오티와칸이라고. 이 문장 전체를 해석하면, 그들은 그 도시를 \"테오티와칸\"이라고 불렀습니다.","hl":"m"},{"n":28,"text":"아즈텍 족이 그 도시를 테오티와칸이라고 불렀다는 뜻이에요. 이 이름은 다음 문장에서 뜻이 설명돼요.","hl":"mn"},{"n":29,"text":"먼저 called는 call의 과거형이에요. 그래서 지난 일인 불렀습니다로 해석해요. 그리고 the city는 called 뒤에서 무엇을에 해당하는 목적어예요. 이름을 붙인 대상을 나타내죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 12\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\
