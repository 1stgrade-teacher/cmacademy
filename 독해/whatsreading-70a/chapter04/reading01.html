<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>What's Reading 70 A Ch4 Unit 01 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"What's Reading 70 A Ch4 Unit 01","audioDir":"reading01_audio","preview":false,"count":46,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.923em\">Ch4\u003cbr>Unit\u003cbr>01\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">What's Reading 70 A\u003c/div>\u003ch1>Māui vs. the Sun God: Making the Day Longer\u003c/h1>\u003ch2>Māui 대 태양신: 낮을 길게 만든 이야기\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">한 줄 요약\u003c/span>\u003cspan>옛날에 태양신이 너무 빨리 움직여 \u003cb class=\"key\">낮\u003c/b>이 아주 짧았어요. 그래서 반신반인 \u003cb class=\"key\">Māui\u003c/b>가 마법 뼈와 밧줄로 태양신을 잡아 낮을 길게 만들었어요.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Māui caught the Sun God with a rope trap and his magic bone, so the Sun God promised to slow down and daytime became longer.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘도 만나서 반가워요. 오늘은 Māui vs. the Sun God, 우리말로 Māui 대 태양신이라는 재미있는 옛이야기를 읽어 볼 거예요. 아주 먼 옛날, 낮이 너무 짧아서 사람들이 힘들어했대요. 특별한 친구 Māui가 이 문제를 어떻게 해결했는지 함께 살펴봐요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">미리 알면 쉬워요\u003c/span>\u003cdiv class=\"lp-box\">Māui는 하와이와 뉴질랜드 같은 태평양 섬 지방에서 옛날부터 전해 오는 \u003cb class=\"key\">영웅\u003c/b> 이야기의 주인공이에요. 그는 사람이면서 신의 힘도 가진 \u003cb class=\"key\">반신반인\u003c/b>(demi-god)이에요. 옛날 사람들은 '왜 낮과 밤이 생길까?' 하고 궁금해하며 이런 이야기를 만들었어요. 여러분도 재미있는 게임을 하다가 시간이 너무 빨리 가서 아쉬웠던 적 있죠? 그때 '시간아, 조금만 천천히 가 줘!' 하고 바라는 마음과 비슷해요. 이 이야기에서 태양신은 하늘을 빠르게 지나가는 해, 곧 낮을 뜻해요.\u003c/div>","segs":[{"n":2,"text":"Māui는 하와이와 뉴질랜드 같은 태평양 섬 지방에서 옛날부터 전해 내려오는 영웅이에요. 그는 사람이면서 동시에 신의 힘도 가진 반신반인, 영어로 demi-god이라고 해요. 옛사람들은 왜 낮과 밤이 생기는지 궁금해서 이런 이야기를 만들었답니다. 여러분은 재미있는 게임을 하다가 시간이 너무 빨리 지나가서 아쉬웠던 적 있나요? 이 이야기 속 태양신은 그렇게 빠르게 지나가 버리는 해, 곧 낮을 뜻해요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>짧은 낮 때문에 생긴 문제\u003csmall>문제 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>옛날에 태양신은 아주 \u003cb class=\"key\">빠르게\u003c/b> 움직였어요. 그래서 \u003cb class=\"key\">낮\u003c/b>이 매우 짧았고, 사람들은 먹을 것을 많이 \u003cb class=\"key\">기르지\u003c/b> 못했어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>Māui의 결심과 준비\u003csmall>해결 시작 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>반신반인 \u003cb class=\"key\">Māui\u003c/b>는 사람들을 돕고 싶었어요. 그는 \u003cb class=\"key\">마법 \u003c/b>\u003cb class=\"key\">뼈\u003c/b>와 밧줄을 가지고 태양신에게 갔어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>덫을 만들고 잡기\u003csmall>해결 · 문장 6–8\u003c/small>\u003c/h4>\u003cp>태양신은 밤에 \u003cb class=\"key\">구덩이\u003c/b>에서 잤어요. Māui는 밧줄로 구덩이 근처에 \u003cb class=\"key\">덫\u003c/b>을 만들었어요. 태양신이 밖으로 나왔을 때 덫이 그를 잡았어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>약속과 달라진 세상\u003csmall>결과 · 문장 9–11\u003c/small>\u003c/h4>\u003cp>Māui는 마법 뼈로 태양신을 \u003cb class=\"key\">때렸어요\u003c/b>. 태양신은 앞으로 \u003cb class=\"key\">속도를 \u003c/b>\u003cb class=\"key\">늦추겠다\u003c/b>고 약속했고, 그때부터 낮은 충분히 길어졌어요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 이야기가 어떤 순서로 흘러가는지 함께 살펴볼게요.","hl":null},{"n":4,"text":"먼저 첫 번째 단계예요. 아주 옛날에 태양신은 하늘을 아주 빠르게 지나갔어요. 그래서 낮이 아주 짧았고, 사람들은 먹을 것을 많이 기르지 못했어요.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 Māui가 나서요. 반신반인인 Māui는 사람들을 돕고 싶었어요. 그래서 마법 뼈와 밧줄을 챙겨서 태양신에게 갔답니다.","hl":"f1"},{"n":6,"text":"세 번째 단계는 덫을 놓는 장면이에요. 태양신은 밤에 구덩이에서 잤어요. Māui는 밧줄로 그 구덩이 근처에 덫을 만들었고, 태양신이 밖으로 나왔을 때 덫이 그를 잡았어요.","hl":"f2"},{"n":7,"text":"마지막 단계에서는 Māui가 마법 뼈로 태양신을 때렸어요. 그러자 태양신은 앞으로 속도를 늦추겠다고 약속했어요. 그때부터 낮은 충분히 길어졌답니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">이야기 순서(문제-해결)\u003c/span>\u003cspan class=\"lp-pill\">처음\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 처음에 \u003cb class=\"key\">문제\u003c/b>를 보여 줘요. 태양신이 빨라서 낮이 짧고 먹을 것이 부족했어요. 그다음 Māui가 \u003cb class=\"key\">덫\u003c/b>과 마법 뼈로 문제를 해결하고, 마지막에 낮이 길어진 \u003cb class=\"key\">결과\u003c/b>를 보여 줘요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>In the old days (1)\u003c/b>\u003cspan>옛날이라는 때를 알려 줌\u003c/span>\u003cb>When (8)\u003c/b>\u003cspan>~했을 때라는 때를 알려 줌\u003c/span>\u003cb>From then (11)\u003c/b>\u003cspan>그때부터라는 결과와 때를 알려 줌\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">A demi-god, Māui\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">He\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">his\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Māui\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 이야기 순서로 짜여 있어요. 처음에 문제가 나오고, 가운데에서 덫과 마법 뼈로 해결하고, 끝에서 결과를 보여 주는 문제와 해결 구조예요. 그리고 글의 중심 문장은 맨 처음에 나와요.","hl":"ty"},{"n":9,"text":"길잡이 말을 찾으면 이야기가 더 잘 보여요. In the old days는 옛날이라는 때를 알려 주고, When은 태양신이 밖으로 나왔을 때라는 때를 알려 줘요. From then은 그때부터 결과가 달라졌다는 것을 알려 주는 말이에요. 또 Māui는 A demi-god, Māui, He, his처럼 여러 가지 말로 불리고 있답니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 단어\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>in the old days\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>옛날에\u003c/span>\u003c/div>\u003cdiv>\u003cb>travel\u003c/b>\u003cem>동사\u003c/em>\u003cspan>이동하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>fast\u003c/b>\u003cem>부사\u003c/em>\u003cspan>빠르게\u003c/span>\u003c/div>\u003cdiv>\u003cb>daytime\u003c/b>\u003cem>명사\u003c/em>\u003cspan>낮 시간\u003c/span>\u003c/div>\u003cdiv>\u003cb>short\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>짧은\u003c/span>\u003c/div>\u003cdiv>\u003cb>grow\u003c/b>\u003cem>동사\u003c/em>\u003cspan>기르다, 재배하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>demi-god\u003c/b>\u003cem>명사\u003c/em>\u003cspan>반신반인\u003c/span>\u003c/div>\u003cdiv>\u003cb>magic\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>마법의\u003c/span>\u003c/div>\u003cdiv>\u003cb>bone\u003c/b>\u003cem>명사\u003c/em>\u003cspan>뼈\u003c/span>\u003c/div>\u003cdiv>\u003cb>rope\u003c/b>\u003cem>명사\u003c/em>\u003cspan>밧줄\u003c/span>\u003c/div>\u003cdiv>\u003cb>hole\u003c/b>\u003cem>명사\u003c/em>\u003cspan>구덩이\u003c/span>\u003c/div>\u003cdiv>\u003cb>at night\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>밤에\u003c/span>\u003c/div>\u003cdiv>\u003cb>trap\u003c/b>\u003cem>명사\u003c/em>\u003cspan>덫\u003c/span>\u003c/div>\u003cdiv>\u003cb>near\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~ 근처에\u003c/span>\u003c/div>\u003cdiv>\u003cb>outside\u003c/b>\u003cem>부사\u003c/em>\u003cspan>밖으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>catch\u003c/b>\u003cem>동사\u003c/em>\u003cspan>잡다\u003c/span>\u003c/div>\u003cdiv>\u003cb>hit\u003c/b>\u003cem>동사\u003c/em>\u003cspan>때리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>promise\u003c/b>\u003cem>동사\u003c/em>\u003cspan>약속하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>slow down\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>속도를 늦추다\u003c/span>\u003c/div>\u003cdiv>\u003cb>from then\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>그때부터\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"오늘의 단어도 소리 내어 읽어 볼게요. travel은 이동하다, daytime은 낮 시간이라는 뜻이에요. magic bone은 마법 뼈, rope는 밧줄, hole은 구덩이예요. trap은 덫, catch는 잡다, hit은 때리다라는 뜻이고요. slow down은 속도를 늦추다, from then은 그때부터라는 뜻이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">fast\u003c/b>\u003cspan class=\"m\">빠른\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">quick\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">slow\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">short\u003c/b>\u003cspan class=\"m\">짧은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">brief\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">long\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">near\u003c/b>\u003cspan class=\"m\">가까운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">close to\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">far from\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">catch\u003c/b>\u003cspan class=\"m\">잡다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">grab\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">let go\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">slow down\u003c/b>\u003cspan class=\"m\">속도를 늦추다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">go slower\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">speed up\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"비슷한 말과 반대말도 함께 익혀 봐요. fast는 quick과 비슷하고 slow와 반대예요. short는 brief와 비슷하고 long과 반대말이에요. near는 close to와 비슷하고 far from과 반대죠. catch는 grab과 비슷하고 let go와 반대예요. slow down은 go slower와 뜻이 비슷하고 speed up과 반대랍니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">옛날에,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">In \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">old \u003c/span>\u003cspan class=\"tgt\">days\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">태양신은\u003c/span>\u003cspan class=\"en\">the Sun God\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">빠르게 이동했습니다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">traveled\u003c/span> fast.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">옛날에, 태양신은 빠르게 이동했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 옛날에는 \u003cb class=\"key\">태양신\u003c/b>이 아주 \u003cb class=\"key\">빠르게\u003c/b> 움직였다는 것을 알려 줘요. 이 이야기의 \u003cb class=\"key\">배경\u003c/b>을 소개하는 첫 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간 짝꿍 말(전치사)\u003c/span> : In + 때(the old days) = 그때에 : \"옛날에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(He) + 했다(traveled) + 어떻게(fast) : \"이동했습니다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"In the old days, 옛날에. the Sun God, 태양신은. traveled fast, 빠르게 이동했습니다.. 이 문장 전체를 해석하면, 옛날에, 태양신은 빠르게 이동했습니다.","hl":"m"},{"n":13,"text":"이 문장은 이야기의 배경을 알려 줘요. 옛날에 태양신이 아주 빠르게 움직였다고 해요.","hl":"mn"},{"n":14,"text":"먼저 In the old days는 시간을 알려 주는 짝꿍 말이에요. 그래서 옛날이라는 때가 된답니다. 두 번째, traveled는 이미 지난 일을 말하는 과거형이에요. 여러분도 이 문장으로 옛날 이야기를 시작해 볼까요?","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">낮은\u003c/span>\u003cspan class=\"en\">Daytime \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매우 짧았습니다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">very \u003c/span>\u003cspan class=\"tgt\">short\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">낮이 매우 짧았습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> \u003cb class=\"key\">낮\u003c/b>이 아주 짧았다는 뜻이에요. 그래서 사람들이 먹을 것을 만들기 힘들었다는 \u003cb class=\"key\">문제\u003c/b>를 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사 지난 모습(be동사 과거형)\u003c/span> : 무엇이(Daytime) + 이었다(was) + 짧은(short) : \"짧았습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">더 자세히 꾸며 주는 말(부사)\u003c/span> : very + 형용사(short) = 매우 짧은 : \"매우 짧은\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Daytime was, 낮은. very short, 매우 짧았습니다.. 이 문장 전체를 해석하면, 낮이 매우 짧았습니다.","hl":"m"},{"n":16,"text":"이 문장은 낮이 아주 짧았다고 말해요. 그래서 사람들이 먹을 것을 만들기 어려웠다는 문제를 보여 줘요.","hl":"mn"},{"n":17,"text":"첫 번째, 지난 일을 말할 때 is는 was로 바뀌어요. 낮 하나를 말하니까 was를 써요. 두 번째, very는 형용사 앞에서 매우라고 정도를 더해 주는 말이에요. 그래서 very short는 매우 짧은이 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들은 기를 수 없었습니다\u003c/span>\u003cspan class=\"en\">People \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">couldn't\u003c/span> grow\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 식량을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">much \u003c/span>\u003cspan class=\"tgt\">food\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사람들은 많은 식량을 재배할 수 없었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사람들이 \u003cb class=\"key\">식량\u003c/b>을 많이 \u003cb class=\"key\">재배\u003c/b>하지 못했어요. 그래서 누군가 도와주면 좋겠다는 \u003cb class=\"key\">문제\u003c/b>가 생겨요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">할 수 없었다(조동사 can의 과거 부정)\u003c/span> : 누가(People) + 할 수 없었다(couldn't) + 하기를(grow) : \"기를 수 없었습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">많은(수량 표현)\u003c/span> : much + 셀 수 없는 말(food) : \"많은 식량\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"People couldn't grow, 사람들은 기를 수 없었습니다. much food, 많은 식량을. 이 문장 전체를 해석하면, 사람들은 많은 식량을 재배할 수 없었습니다.","hl":"m"},{"n":19,"text":"사람들이 식량을 많이 재배하지 못했다는 뜻이에요. 그래서 이 이야기의 문제가 시작돼요.","hl":"mn"},{"n":20,"text":"첫 번째, can은 지난 일을 말할 때 could가 되고, not을 붙이면 couldn't가 돼요. 그래서 할 수 없었다는 부정 말이에요. 두 번째, food는 하나, 둘 셀 수 없는 말이라서 many 대신 much를 써요. 여러분도 much food처럼 말해 볼 수 있죠?","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">반신반인인 Māui는\u003c/span>\u003cspan class=\"en\">A demi-god, Māui,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들을 돕고 싶었습니다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">wanted \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">help\u003c/span> people.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">반신반인인 Māui는 사람들을 돕고 싶었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Māui가 사람들을 돕고 싶어 했다는 뜻이에요. 이야기의 \u003cb class=\"key\">주인공\u003c/b>이 왜 나서는지 보여 주는 \u003cb class=\"key\">마음\u003c/b>이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">하고 싶다 말(want + to 동사원형)\u003c/span> : 누가(Māui) + 하고 싶었다(wanted to) + 돕기를(help) : \"돕고 싶었습니다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"A demi-god, Māui, 반신반인인 Māui는. wanted to help people, 사람들을 돕고 싶었습니다.. 이 문장 전체를 해석하면, 반신반인인 Māui는 사람들을 돕고 싶었습니다.","hl":"m"},{"n":22,"text":"이 문장은 반신반인 Māui가 사람들을 돕고 싶어 했다는 뜻이에요. 이야기의 주인공이 왜 나서는지 보여 주는 마음이죠. 여러분도 주인공의 마음을 생각하며 읽어 보세요.","hl":"mn"},{"n":23,"text":"여기서 중요한 표현은 wanted to help 예요. want 뒤에 to와 동사원형 help를 붙이면 하고 싶다라는 뜻이 돼요. 그래서 wanted to help는 돕고 싶었다가 됩니다. 하고 싶다 표현은 아주 자주 쓰니 꼭 익혀 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 11\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 갔습니다\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">went\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">태양신에게\u003c/span>\u003cspan class=\"en\">to the Sun God\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 마법 뼈와\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">magic \u003c/span>\u003cspan class=\"tgt\">bone \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">밧줄을 가지고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">rope\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 자신의 마법 뼈와 밧줄을 가지고 태양신에게 갔습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Māui가 마법 뼈와 밧줄을 챙겨 태양신에게 간 장면이에요. 다음 사건을 준비하는 \u003cb class=\"key\">행동\u003c/b>을 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 지난 일이면 go가 went로 바뀌어요 : \"갔습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">도구 짝꿍 말(전치사 with)\u003c/span> : with + 무엇 = 무엇을 가지고 또는 무엇과 함께 : \"자신의 마법 뼈와 밧줄을 가지고\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"He went, 그는 갔습니다. to the Sun God, 태양신에게. with his magic bone, 자신의 마법 뼈와. and rope, 밧줄을 가지고. 이 문장 전체를 해석하면, 그는 자신의 마법 뼈와 밧줄을 가지고 태양신에게 갔습니다.","hl":"m"},{"n":25,"text":"이 문장은 Māui가 마법 뼈와 밧줄을 챙겨 태양신에게 간 장면이에요. 다음 사건을 준비하는 행동을 보여 주죠. 여러분도 Māui가 무엇을 챙겼는지 생각하며 읽어 보세요.","hl":"mn"},{"n":26,"text":"먼저 went는 go의 지난 일 말이에요. go가 went로 바뀌는 불규칙 과거형이죠. 다음으로 with는 무엇을 가지고라는 뜻을 나타내요. 여기서는 마법 뼈와 밧줄이라는 도구를 가지고 갔다는 뜻이에요. 도구를 말할 때 with를 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">태양신은\u003c/span>\u003cspan class=\"en\">The Sun God\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">구덩이에서 잤습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">slept\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">hole\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">밤에\u003c/span>\u003cspan class=\"en\">at night.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">태양신은 밤에 구덩이에서 잤습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 태양신이 밤에 구덩이에서 잔다는 \u003cb class=\"key\">배경\u003c/b>을 알려 줘요. 다음에 Māui가 덫을 놓을 \u003cb class=\"key\">장소\u003c/b>를 알 수 있게 해 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 지난 일이면 sleep이 slept로 바뀌어요 : \"잤습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소 짝꿍 말(전치사 in)\u003c/span> : in + 무엇 = 무엇 안에 또는 무엇에서 : \"구덩이에서\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"The Sun God, 태양신은. slept in a hole, 구덩이에서 잤습니다. at night, 밤에. 이 문장 전체를 해석하면, 태양신은 밤에 구덩이에서 잤습니다.","hl":"m"},{"n":28,"text":"이 문장은 태양신이 밤에 구덩이에서 잔다는 배경을 알려 줘요. 그래서 다음에 Māui가 덫을 놓을 장소를 알 수 있죠. 장면을 머릿속에 그려 보세요.","hl":"mn"},{"n":29,"text":"먼저 slept는 sleep의 지난 일 말이에요. sleep이 slept로 바뀌는 불규칙 과거형이죠. 다음으로 in은 어떤 곳 안을 나타내는 전치사예요. 그래서 in a hole은 구덩이 안에서라는 뜻이 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마우이는 덫을 만들었어요\u003c/span>\u003cspan class=\"en\">Māui \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">made\u003c/span> a trap\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 구덩이 근처에\u003c/span>\u003cspan class=\"en\">near the hole\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 밧줄로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">rope\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Māui는 자신의 밧줄로 그 구덩이 근처에 덫을 만들었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 마우이가 밧줄을 이용해 태양신이 사는 구덩이 옆에 \u003cb class=\"key\">덫\u003c/b>을 놓았다는 말이에요. 태양신을 잡을 \u003cb class=\"key\">준비\u003c/b>를 하는 장면이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 마우이(Māui) + 만들었어요(made) + 덫을(a trap) : \"만들었어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">도구를 알려 주는 말(전치사)\u003c/span> : 만들었어요(made) + 그것으로(with his rope) : \"자신의 밧줄로\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Māui made a trap, 마우이는 덫을 만들었어요. near the hole, 그 구덩이 근처에. with his rope, 자신의 밧줄로. 이 문장 전체를 해석하면, Māui는 자신의 밧줄로 그 구덩이 근처에 덫을 만들었습니다.","hl":"m"},{"n":31,"text":"마우이가 자신의 밧줄로 구덩이 근처에 덫을 만들었다는 뜻이에요. 태양신을 잡을 준비를 하는 장면이죠.","hl":"mn"},{"n":32,"text":"첫째, made는 지난 일이라서 동사 make가 made로 모양이 바뀌었어요. 둘째, with his rope에서 with는 도구를 알려 주는 말이에요. 여러분도 with a pencil이라고 하면 '연필로'라는 뜻이 된답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">태양신이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When\u003c/span> the Sun God\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">밖으로 나왔을 때\u003c/span>\u003cspan class=\"en\">came outside,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 덫이 그를 잡았어요\u003c/span>\u003cspan class=\"en\">the trap \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">caught\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">him\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">태양신이 밖으로 나왔을 때, 그 덫이 그를 잡았습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 태양신이 밖으로 나오는 순간 마우이의 \u003cb class=\"key\">덫\u003c/b>에 걸렸다는 말이에요. 마우이의 \u003cb class=\"key\">계획\u003c/b>이 성공한 장면이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : ~했을 때(When) + 누가 ~해요 : \"~했을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 덫이(the trap) + 잡았어요(caught) + 그를(him) : \"잡았어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">대신하는 말(대명사)\u003c/span> : 잡았어요(caught) + 그를(him) : \"그를\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"When the Sun God, 태양신이. came outside, 밖으로 나왔을 때. the trap caught him, 그 덫이 그를 잡았어요. 이 문장 전체를 해석하면, 태양신이 밖으로 나왔을 때, 그 덫이 그를 잡았습니다.","hl":"m"},{"n":34,"text":"태양신이 밖으로 나오자마자 덫에 걸렸다는 뜻이에요. 마우이의 계획이 드디어 성공한 거죠.","hl":"mn"},{"n":35,"text":"첫째, When은 '~할 때'라고 때를 이어 주는 말이에요. 둘째, caught는 catch의 지난 일 모양인데 불규칙해서 꼭 외워야 해요. 셋째, him은 동사 뒤에서 '그를'이라는 뜻을 만들어요. 오늘 배운 세 가지, 다 기억나죠?","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마우이는 때렸어요\u003c/span>\u003cspan class=\"en\">Māui \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">hit\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">태양신을\u003c/span>\u003cspan class=\"en\">the Sun God\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 마법 뼈로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">magic \u003c/span>\u003cspan class=\"tgt\">bone\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Māui는 자신의 마법 뼈로 태양신을 때렸습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 마우이가 마법 뼈를 \u003cb class=\"key\">도구\u003c/b>로 태양신을 때렸다는 말이에요. 태양신이 느려지게 만드는 장면이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 마우이(Māui) + 때렸어요(hit) + 태양신을(the Sun God) : \"때렸어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">도구를 알려 주는 말(전치사)\u003c/span> : 때렸어요(hit) + 그것으로(with his magic bone) : \"자신의 마법 뼈로\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Māui hit, 마우이는 때렸어요. the Sun God, 태양신을. with his magic bone, 자신의 마법 뼈로. 이 문장 전체를 해석하면, Māui는 자신의 마법 뼈로 태양신을 때렸습니다.","hl":"m"},{"n":37,"text":"마우이가 자신의 마법 뼈로 태양신을 때렸다는 뜻이에요. 이제 태양신이 느리게 움직일 차례죠.","hl":"mn"},{"n":38,"text":"첫째, hit은 지난 일에도 모양이 그대로예요. 그래서 문장 전체를 보고 지난 일인지 판단해야 해요. 둘째, with his magic bone에서 with는 도구를 알려 주는 말이에요. 마법 뼈라는 도구로 때렸다는 거죠. 여러분도 with a fork처럼 '포크로'라고 말할 수 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 11\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">태양신은\u003c/span>\u003cspan class=\"en\">The Sun God\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">속도를 늦추겠다고 약속했어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">promised \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">slow \u003c/span>\u003cspan class=\"tgt\">down\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">앞으로는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">future\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">태양신은 앞으로 속도를 늦추겠다고 약속했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 태양신이 앞으로는 \u003cb class=\"key\">속도를 \u003c/b>\u003cb class=\"key\">늦추다\u003c/b>고 약속한 장면이에요. 그래서 사람들이 \u003cb class=\"key\">도움\u003c/b>을 받게 되었답니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to + 동사원형(to부정사)\u003c/span> : 누가(The Sun God) + 약속했다(promised) + ~하기로(to slow down) : \"속도를 늦추기로 약속했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">때를 나타내는 짝꿍 말(전치사)\u003c/span> : in + 때(the future) = ~에, ~에는 : \"앞으로는, 미래에\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"The Sun God, 태양신은. promised to slow down, 속도를 늦추겠다고 약속했어요. in the future, 앞으로는. 이 문장 전체를 해석하면, 태양신은 앞으로 속도를 늦추겠다고 약속했습니다.","hl":"m"},{"n":40,"text":"이 문장은 태양신이 앞으로는 속도를 늦추다라고 약속했다는 뜻이에요. 마우이의 노력 덕분에 사람들이 도움을 받게 된 거죠.","hl":"mn"},{"n":41,"text":"첫 번째, promised to slow down을 볼까요. '~하기로 약속했다'라고 말할 때는 동사 뒤에 to하고 동사원형을 붙여요. 이걸 to부정사라고 불러요. 그래서 '속도를 늦추다'라는 말이 동사 뒤에 자연스럽게 이어지는 거예요. 두 번째, in the future는 앞으로, 미래에라는 뜻이에요. 전치사 in이 시간 말 앞에 붙어서 짝꿍 말을 만들어 주는 거랍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그때부터,\u003c/span>\u003cspan class=\"en\">From then,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">낮은 되었어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">daytime \u003c/span>\u003cspan class=\"tgt\">became\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">충분히 길게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">long \u003c/span>\u003cspan class=\"tgt\">enough\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그때부터, 낮은 충분히 길어졌습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 그때부터 낮이 \u003cb class=\"key\">충분히 \u003c/b>\u003cb class=\"key\">길어졌다\u003c/b>는 뜻이에요. 마우이의 \u003cb class=\"key\">노력\u003c/b> 덕분에 세상이 달라진 결말을 보여 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 무엇이(daytime) + 되었다(became) : \"낮은 되었어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">형용사 + enough(~할 만큼 충분히)\u003c/span> : long(긴) + enough(충분히) = 충분히 긴 : \"충분히 긴\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"From then, 그때부터. daytime became, 낮은 되었어요. long enough, 충분히 길게. 이 문장 전체를 해석하면, 그때부터, 낮은 충분히 길어졌습니다.","hl":"m"},{"n":43,"text":"이 문장은 그때부터 낮이 충분히 길어졌다는 뜻이에요. 이야기의 결말을 보여 주는 문장이죠. 여러분, 마우이의 노력 덕분에 세상이 이렇게 달라졌네요.","hl":"mn"},{"n":44,"text":"첫 번째, became을 주목해요. become은 '~이 되다'라는 뜻인데, 이미 지난 일이라서 과거형 became으로 모양이 바뀌었어요. 두 번째, long enough는 형용사 long 뒤에 enough가 붙어서 충분히 긴이라는 뜻이 돼요. 꾸며 주는 말 뒤에 enough를 붙이면 '~할 만큼 충분히'라는 뜻이 된답니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">문제 해설\u003c/span>\u003cdiv class=\"lp-box\">\u003cspan class=\"lp-big\">이유 묻는 문제\u003c/span>\u003cspan class=\"lp-pill\">정답 낮이 짧아서 사람들이 먹을 것을 많이 기를 수 없었기 때문이에요.\u003c/span>\u003cdiv style=\"margin-top:8px\">Māui는 사람들을 돕고 싶었어요. \u003cb class=\"key\">왜냐하면\u003c/b> 낮이 짧아서 사람들이 먹을 것을 많이 기를 수 없었기 때문이에요. 그래서 그는 \u003cb class=\"key\">magic \u003c/b>\u003cb class=\"key\">bone\u003c/b>과 밧줄을 들고 태양신에게 갔어요.\u003c/div>\u003cul style=\"font-size:14.5px;margin:8px 0 0;padding-left:20px\">\u003cli>태양신이 Māui를 잡아가서라고 하면 틀려요. 덫에 걸린 쪽은 태양신이에요.\u003c/li>\u003cli>Māui가 마법 뼈를 잃어버려서라고 하면 틀려요. 마법 뼈는 태양신을 때리는 데 썼어요.\u003c/li>\u003c/ul>\u003c/div>","segs":[{"n":45,"text":"이제 문제를 함께 풀어 볼게요. Māui는 왜 태양신에게 갔을까요? 왜냐하면 낮이 짧아서 사람들이 먹을 것을 많이 기를 수 없었기 때문이에요. Māui는 사람들을 돕고 싶었고, 그래서 magic bone과 밧줄을 들고 태양신을 찾아간 거예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">오늘 배운 내용 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>옛날에는 태양신이 \u003cb class=\"key\">빠르게\u003c/b> 움직여서 낮이 아주 짧았어요.\u003c/li>\u003cli>반신반인 \u003cb class=\"key\">Māui\u003c/b>가 사람들을 돕기 위해 마법 뼈와 밧줄을 가지고 나섰어요.\u003c/li>\u003cli>Māui는 구덩이 근처에 \u003cb class=\"key\">덫\u003c/b>을 만들어 태양신을 잡았어요.\u003c/li>\u003cli>태양신이 \u003cb class=\"key\">속도를 \u003c/b>\u003cb class=\"key\">늦추기\u003c/b>로 약속해서 낮이 충분히 길어졌어요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Māui caught the Sun God with a rope trap and his magic bone, so the Sun God promised to slow down and daytime became longer.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">옛날에 태양신이 너무 빨리 움직여 \u003cb class=\"key\">낮\u003c/b>이 아주 짧았어요. 그래서 반신반인 \u003cb class=\"key\">Māui\u003c/b>가 마법 뼈와 밧줄로 태양신을 잡아 낮을 길게 만들었어요.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":46,"text":"오늘 우리는 Māui가 덫과 마법 뼈로 태양신을 잡아 낮을 길게 만든 이야기를 읽었어요. 옛날에 태양신이 빠르게 움직여 낮이 짧았다는 것도 기억나죠? 태양신이 속도를 늦추기로 약속해서 낮이 길어졌다는 것도 잊지 마세요. 여러분도 오늘 배운 단어와 문장을 소리 내어 읽어 보면 훨씬 잘 기억할 거예요. 오늘 정말 수고 많았어요, 다음 시간에 또 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
