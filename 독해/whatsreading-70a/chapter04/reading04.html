<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>What's Reading 70 A Ch4 Unit 04 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"What's Reading 70 A Ch4 Unit 04","audioDir":"reading04_audio","preview":false,"count":55,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.923em\">Ch4\u003cbr>Unit\u003cbr>04\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">What's Reading 70 A\u003c/div>\u003ch1>How's the Weather in Space?\u003c/h1>\u003ch2>우주 날씨는 어떨까요?\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">한 줄 요약\u003c/span>\u003cspan>지구처럼 우주에도 \u003cb class=\"key\">날씨\u003c/b>가 있지만 대부분 아주 \u003cb class=\"key\">고요\u003c/b>해요. 하지만 태양이 강한 바람을 만들면 \u003cb class=\"key\">태양 \u003c/b>\u003cb class=\"key\">폭풍\u003c/b>이 일어나 인공위성과 우주비행사에게 위험할 수 있어요.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Space has weather, and a solar storm from the Sun can be dangerous.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 우주 날씨에 관한 재미있는 글을 함께 읽어 볼 거예요. 제목은 How's the Weather?이고, 지구뿐 아니라 우주에도 날씨가 있는지 알아볼 거예요. 이 글은 우주 날씨가 대부분 고요하지만 태양 폭풍이 생기면 위험할 수 있다는 이야기예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">미리 알면 쉬워요\u003c/span>\u003cdiv class=\"lp-box\">우주에도 날씨가 있어요. 우주 날씨, 즉 \u003cb class=\"key\">space \u003c/b>\u003cb class=\"key\">weather\u003c/b>는 우주 공간의 바람이나 폭풍 같은 것을 말해요. 태양이 아주 강한 바람을 보내면 \u003cb class=\"key\">solar \u003c/b>\u003cb class=\"key\">storm\u003c/b>, 즉 태양 폭풍이 만들어져요. 이 폭풍은 \u003cb class=\"key\">인공위성\u003c/b>을 고장 내고 전기와 인터넷을 멈추게 할 수 있어요. 마치 집에서 와이파이가 갑자기 꺼져 게임이 멈추는 것처럼요.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 볼까요? 우주에도 날씨가 있고, 이것을 space weather, 즉 우주 날씨라고 불러요. 태양이 아주 강한 바람을 보내면 solar storm, 즉 태양 폭풍이 만들어져요. 이 폭풍은 인공위성을 고장 내고 전기와 인터넷을 멈추게 할 수 있어요. 여러분이 집에서 와이파이가 갑자기 꺼져 게임이 멈춘 것처럼 우주 날씨도 우리 생활에 영향을 줄 수 있답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>우주도 궁금해요\u003csmall>질문 시작 · 문장 1–4\u003c/small>\u003c/h4>\u003cp>지구에는 \u003cb class=\"key\">날씨\u003c/b>가 있지만 우주는 어떨지 궁금해하며 시작해요. 우주에 바람이 부는지, 비가 오는지 \u003cb class=\"key\">질문\u003c/b>을 던져요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>우주 날씨의 답\u003csmall>답과 안심 · 문장 5–8\u003c/small>\u003c/h4>\u003cp>우주에도 \u003cb class=\"key\">날씨\u003c/b>가 있지만 대부분 아주 \u003cb class=\"key\">고요\u003c/b>해요. 지구에는 별일이 없으니 우주 날씨를 걱정하지 말라고 \u003cb class=\"key\">안심\u003c/b>시켜요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>태양 폭풍의 등장\u003csmall>바뀜 · 문장 9–11\u003c/small>\u003c/h4>\u003cp>하지만 때때로 \u003cb class=\"key\">태양\u003c/b>이 매우 강한 바람을 만들어요. 그래서 \u003cb class=\"key\">태양 \u003c/b>\u003cb class=\"key\">폭풍\u003c/b>이 일어나고, 우주에 있는 \u003cb class=\"key\">인공위성\u003c/b>을 고장 낼 수 있어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>지구와 우주비행사\u003csmall>결과 · 문장 12–14\u003c/small>\u003c/h4>\u003cp>태양 폭풍이 오면 지구의 모든 것이 \u003cb class=\"key\">멈출\u003c/b> 수 있어요. 전기와 인터넷이 없어지고, 우주에 있는 \u003cb class=\"key\">우주비행사\u003c/b>에게도 \u003cb class=\"key\">위험\u003c/b>해요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 따라가며 우주 날씨에 대한 질문부터 태양 폭풍의 결과까지 살펴볼 거예요.","hl":null},{"n":4,"text":"글은 지구에 날씨가 있다는 말로 시작해요. 그러고 나서 우주에도 바람이 부는지, 비가 오는지 질문을 던져요. 이 질문이 우리의 궁금증을 불러일으키죠.","hl":"f0"},{"n":5,"text":"다음에는 우주에도 날씨가 있다고 답해요. 하지만 대부분의 우주 날씨는 아주 고요하다고 말해요. 그래서 우주 날씨를 걱정하지 말라고 안심시켜 주죠.","hl":"f1"},{"n":6,"text":"그런데 때때로 태양이 매우 강한 바람을 만들어요. 그러면 태양 폭풍이 일어나고, 그 폭풍이 우주에 있는 인공위성을 고장 낼 수 있어요.","hl":"f2"},{"n":7,"text":"태양 폭풍이 오면 지구의 모든 것이 멈출 수 있어요. 전기와 인터넷이 없어지고, 우주에 있는 우주비행사에게도 위험해져요. 그래서 우주 날씨를 알아 두는 것이 중요하답니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">원인-결과\u003c/span>\u003cspan class=\"lp-pill\">가운데\u003c/span>\u003cspan class=\"lp-pill\">주제문 5번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 우주 날씨가 있다는 답을 가운데에서 말해요. 그다음 태양 폭풍이 생기는 \u003cb class=\"key\">원인\u003c/b>과 인공위성과 지구에 생기는 \u003cb class=\"key\">결과\u003c/b>를 차례로 설명해요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>So (8)\u003c/b>\u003cspan>앞 내용의 결과로 안심을 말함\u003c/span>\u003cb>But (9)\u003c/b>\u003cspan>고요함과 반대되는 내용으로 바뀜\u003c/span>\u003cb>Then (12)\u003c/b>\u003cspan>그다음에 생기는 결과를 알려 줌\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">weather\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">space weather\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">solar storm\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>평소 우주 날씨\u003c/th>\u003cth>태양 폭풍 때\u003c/th>\u003c/tr>\u003ctr>\u003ctd>매우 고요해요\u003c/td>\u003ctd>강한 바람이 불어요\u003c/td>\u003c/tr>\u003ctr>\u003ctd>걱정할 일이 거의 없어요\u003c/td>\u003ctd>인공위성과 우주비행사가 위험해요\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 원인과 결과를 설명하는 글에 가까워요. 중심 문장은 다섯 번째 문장인 Yes, space has weather, too!예요. 우주 날씨가 있다는 답을 가운데에서 먼저 보여 주고, 태양 폭풍의 원인과 결과를 이어서 설명해요.","hl":"ty"},{"n":9,"text":"글의 길잡이 말도 눈여겨보세요. But은 앞에서 말한 고요함과 반대되는 위험한 내용으로 바뀔 때 나와요. Then은 그다음에 생기는 결과를 알려 주고, 같은 대상을 가리키는 weather, space weather, solar storm 같은 표현도 따라가며 읽어 보세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 단어\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>weather\u003c/b>\u003cem>명사\u003c/em>\u003cspan>날씨\u003c/span>\u003c/div>\u003cdiv>\u003cb>Earth\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지구\u003c/span>\u003c/div>\u003cdiv>\u003cb>space\u003c/b>\u003cem>명사\u003c/em>\u003cspan>우주\u003c/span>\u003c/div>\u003cdiv>\u003cb>windy\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>바람이 많이 부는\u003c/span>\u003c/div>\u003cdiv>\u003cb>rain\u003c/b>\u003cem>동사\u003c/em>\u003cspan>비가 오다\u003c/span>\u003c/div>\u003cdiv>\u003cb>calm\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>고요한, 조용한\u003c/span>\u003c/div>\u003cdiv>\u003cb>nothing much\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>별일 없는 것\u003c/span>\u003c/div>\u003cdiv>\u003cb>happen\u003c/b>\u003cem>동사\u003c/em>\u003cspan>일어나다, 생기다\u003c/span>\u003c/div>\u003cdiv>\u003cb>worry about\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 대해 걱정하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>sometimes\u003c/b>\u003cem>부사\u003c/em>\u003cspan>때때로\u003c/span>\u003c/div>\u003cdiv>\u003cb>create\u003c/b>\u003cem>동사\u003c/em>\u003cspan>만들어 내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>strong\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>강한\u003c/span>\u003c/div>\u003cdiv>\u003cb>solar storm\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>태양 폭풍\u003c/span>\u003c/div>\u003cdiv>\u003cb>break\u003c/b>\u003cem>동사\u003c/em>\u003cspan>고장 내다, 부수다\u003c/span>\u003c/div>\u003cdiv>\u003cb>satellite\u003c/b>\u003cem>명사\u003c/em>\u003cspan>인공위성\u003c/span>\u003c/div>\u003cdiv>\u003cb>everything\u003c/b>\u003cem>명사\u003c/em>\u003cspan>모든 것\u003c/span>\u003c/div>\u003cdiv>\u003cb>stop\u003c/b>\u003cem>동사\u003c/em>\u003cspan>멈추다\u003c/span>\u003c/div>\u003cdiv>\u003cb>power\u003c/b>\u003cem>명사\u003c/em>\u003cspan>전기, 힘\u003c/span>\u003c/div>\u003cdiv>\u003cb>dangerous\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>위험한\u003c/span>\u003c/div>\u003cdiv>\u003cb>astronaut\u003c/b>\u003cem>명사\u003c/em>\u003cspan>우주비행사\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"오늘의 단어도 소리 내어 읽어 볼까요? weather는 날씨, calm은 고요한, solar storm은 태양 폭풍이라는 뜻이에요. satellite는 인공위성, dangerous는 위험한, astronaut은 우주비행사라는 뜻이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">calm\u003c/b>\u003cspan class=\"m\">고요한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">quiet\u003c/span>\u003cspan class=\"s\">peaceful\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">noisy\u003c/span>\u003cspan class=\"a\">stormy\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">strong\u003c/b>\u003cspan class=\"m\">강한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">powerful\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">weak\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">break\u003c/b>\u003cspan class=\"m\">고장 내다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">damage\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">fix\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">dangerous\u003c/b>\u003cspan class=\"m\">위험한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">risky\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">safe\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">stop\u003c/b>\u003cspan class=\"m\">멈추다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">end\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">start\u003c/span>\u003cspan class=\"a\">go\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"비슷한 말과 반대말도 함께 익혀 볼까요? calm은 quiet나 peaceful와 비슷하고, noisy나 stormy와 반대예요. strong은 powerful와 비슷하고 weak와 반대예요. dangerous는 risky와 비슷하고 safe와 반대라는 것도 기억해요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 가지고 있습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">We \u003c/span>\u003cspan class=\"tgt\">have\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">날씨를\u003c/span>\u003cspan class=\"en\">weather\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지구에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">Earth\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 지구에 날씨가 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 \u003cb class=\"key\">지구\u003c/b>에는 \u003cb class=\"key\">날씨\u003c/b>가 있다고 말해요. 곧 나올 우주 이야기와 견주려고 지구를 먼저 꺼내는 시작 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">하는 일 말(동사)\u003c/span> : 누가(We) + 가진다(have) + 무엇을(weather) : \"우리는 가지고 있어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소·시간 짝꿍 말(전치사)\u003c/span> : on + 장소(Earth) = ~에 : \"지구에\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"We have, 우리는 가지고 있습니다. weather, 날씨를. on Earth, 지구에. 이 문장 전체를 해석하면, 우리는 지구에 날씨가 있습니다.","hl":"m"},{"n":13,"text":"이 문장은 지구에는 날씨가 있다고 말해요. 다음에 나올 우주 이야기와 견주려고 지구를 먼저 꺼내는 거예요.","hl":"mn"},{"n":14,"text":"먼저, have는 '가지다'라는 뜻을 가진 동사예요. 그리고 on은 뒤에 장소가 오면 '~에'라는 뜻을 만드는 전치사예요. 그래서 on Earth는 '지구에'가 되는 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떨까요\u003c/span>\u003cspan class=\"en\">How about\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우주에서는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">space\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우주에서는 어떨까요?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 지구 이야기를 하다가 \u003cb class=\"key\">우주\u003c/b>로 눈을 돌리며 '우주에서도 그럴까?' 하고 \u003cb class=\"key\">궁금\u003c/b>해 하는 문장이에요. 다음 질문들을 불러오는 다리 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">장소·시간 짝꿍 말(전치사)\u003c/span> : in + 장소(space) = ~ 안에서 : \"우주에서는\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"How about, 어떨까요. in space?, 우주에서는. 이 문장 전체를 해석하면, 우주에서는 어떨까요?","hl":"m"},{"n":16,"text":"지구 이야기를 하다가 이제 우주로 눈을 돌리는 거예요. 우주에서도 그럴지 궁금해서 묻는 문장이랍니다.","hl":"mn"},{"n":17,"text":"in은 장소를 알려 주는 전치사예요. 그래서 in space는 '우주 안에서', '우주에서는'이라는 뜻이 돼요. 뒤에 나올 질문들을 불러오는 다리 역할도 한답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 ~인가요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Is \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바람이 부는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">windy\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우주에\u003c/span>\u003cspan class=\"en\">in space?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우주에 바람이 많이 부나요?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 우주에 \u003cb class=\"key\">바람\u003c/b>이 부는지 물어보는 \u003cb class=\"key\">질문\u003c/b>이에요. 앞 문장에서 우주 이야기를 꺼낸 뒤 바로 이어지는 궁금증이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사 = am·are·is 친구들(be동사)\u003c/span> : Is + 주어(it) + ~? = 그것은 ~인가요? : \"그것은 ~인가요?\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">보충하는 말(보어)\u003c/span> : 주어(it) + is + windy(바람이 부는) : \"바람이 부는\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Is it, 그것은 ~인가요. windy, 바람이 부는. in space?, 우주에. 이 문장 전체를 해석하면, 우주에 바람이 많이 부나요?","hl":"m"},{"n":19,"text":"우주에도 바람이 부는지 물어보는 질문이에요. 우주 이야기를 꺼낸 다음 바로 나오는 궁금증이죠.","hl":"mn"},{"n":20,"text":"먼저, is가 문장 맨 앞으로 나가면 질문이 되는 의문문이에요. 그리고 windy는 바람이 부는이라는 뜻으로 상태를 보충해 주는 보어랍니다. 대답은 Yes, it is나 No, it isn't로 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">비가 오나요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Does \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">rain\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우주에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">space\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우주에 비가 오나요?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 우주에 비가 오는지 궁금해서 묻는 말이에요. 앞에서 \u003cb class=\"key\">지구\u003c/b> 날씨를 말했으니, 이제 \u003cb class=\"key\">우주 \u003c/b>\u003cb class=\"key\">날씨\u003c/b>로 궁금증을 넓혀 주는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">Do/Does로 묻는 질문(일반동사 의문문)\u003c/span> : 도와주는 말(Does) + 누가(it) + 하다(rain)? : \"비가 오나요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소를 알려 주는 짝꿍 말(전치사)\u003c/span> : in + 장소(in space) = 우주 안에 : \"우주에\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Does it rain, 비가 오나요. in space?, 우주에. 이 문장 전체를 해석하면, 우주에 비가 오나요?","hl":"m"},{"n":22,"text":"이 문장은 우주에 비가 오는지 묻고 있어요. 앞에서 지구 날씨를 말했으니, 이제 우주 날씨로 궁금증을 넓혀 주는 거죠.","hl":"mn"},{"n":23,"text":"첫째, Does로 시작하면 대답을 예나 아니오로 하는 질문이 돼요. 둘째, 여기서 rain은 비가 오다라는 뜻의 일반동사예요. 셋째, 도와주는 말이 있으니까 rain은 s를 붙이지 않고 원래 모양 그대로 쓴다는 것, 꼭 기억해요. 그리고 in은 장소 앞에 붙는 전치사라서 우주라는 장소를 콕 짚어 주는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 14\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">네, 우주는 가지고 있어요\u003c/span>\u003cspan class=\"en\">Yes, \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">space \u003c/span>\u003cspan class=\"tgt\">has\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">날씨도 역시!\u003c/span>\u003cspan class=\"en\">weather, \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">too\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">네, 우주에도 역시 날씨가 있습니다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 우주에도 날씨가 있다고 자신 있게 알려 주는 말이에요. 앞의 두 질문에 대한 \u003cb class=\"key\">대답\u003c/b>이면서, 이 글의 \u003cb class=\"key\">중심\u003c/b>을 잡아 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">한 사람·한 개일 때 have가 has로(3인칭 단수)\u003c/span> : 누가(space) + 가진다(has) + 무엇을(weather) : \"우주는 가지고 있어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">역시를 더하는 말(부사)\u003c/span> : 문장 끝 + too = 역시 : \"역시\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Yes, space has, 네, 우주는 가지고 있어요. weather, too!, 날씨도 역시!. 이 문장 전체를 해석하면, 네, 우주에도 역시 날씨가 있습니다!","hl":"m"},{"n":25,"text":"이 문장은 우주에도 날씨가 있다고 자신 있게 말해 줘요. 앞의 두 질문에 대한 대답이면서, 이 글의 중심을 잡아 주는 아주 중요한 문장이에요.","hl":"mn"},{"n":26,"text":"첫째, space는 한 개를 가리키니까 have가 has로 바뀌었어요. 이렇게 한 개일 때는 동사 모양이 달라진다는 것, 기억해 두세요. 둘째, too를 문장 끝에 붙이면 역시라는 뜻이 더해져요. 지구뿐 아니라 우주에도 있다는 추가 정보를 아주 짧게 알려 주는 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대부분의 우주 날씨는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Most\u003c/span> space weather\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아주 고요해요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">very \u003c/span>\u003cspan class=\"tgt\">calm\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">대부분의 우주 날씨는 매우 고요합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 우주 날씨가 대부분 아주 잔잔하다고 알려 줘요. 그래서 우주 날씨를 \u003cb class=\"key\">걱정\u003c/b>할 필요가 없다는 이야기로 이어지게 해 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">양을 알려 주는 말(수량 표현)\u003c/span> : Most + 이름 말(Most space weather) = 대부분의 ~ : \"대부분의\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be동사 + 꾸며 주는 말(be동사와 형용사)\u003c/span> : 무엇이(weather) + 이다(is) + 매우 고요한(very calm) : \"아주 고요해요\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Most space weather, 대부분의 우주 날씨는. is very calm, 아주 고요해요. 이 문장 전체를 해석하면, 대부분의 우주 날씨는 매우 고요합니다.","hl":"m"},{"n":28,"text":"이 문장은 우주 날씨가 대부분 아주 잔잔하다고 알려 줘요. 그래서 우주 날씨를 너무 무서워할 필요가 없다는 이야기로 자연스럽게 이어지는 거죠.","hl":"mn"},{"n":29,"text":"첫째, is는 이다라는 뜻의 be동사예요. 둘째, 뒤에 calm처럼 형용사가 오면 날씨가 어떤지 설명해 줘요. 셋째, 맨 앞의 Most는 대부분의라는 뜻으로 양을 알려 주는 수량 표현이에요. 이 세 가지만 알면 문장이 아주 쉽게 보여요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">별일은\u003c/span>\u003cspan class=\"en\">Nothing much\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일어나지 않습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">happens\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지구에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">Earth\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">지구에는 별일이 일어나지 않습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 지구에서는 별일이 일어나지 않는다고 말해요. 앞에서 우주 날씨가 \u003cb class=\"key\">잔잔\u003c/b>하다고 한 내용을 지구 쪽에서 다시 알려 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">한 사람·한 개일 때 동사 + s(3인칭 단수)\u003c/span> : 무엇이(Nothing much) + 한다(happens) : \"일어납니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소 짝꿍 말(전치사)\u003c/span> : ~에서(on) + 지구(Earth) : \"지구에서\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Nothing much, 별일은. happens, 일어나지 않습니다. on Earth, 지구에서. 이 문장 전체를 해석하면, 지구에는 별일이 일어나지 않습니다.","hl":"m"},{"n":31,"text":"이 문장은 지구에서는 별일이 일어나지 않는다고 말해요. 앞에서 우주 날씨가 아주 잔잔하다고 했죠? 그 내용을 지구 쪽에서 다시 한 번 알려 주는 거예요.","hl":"mn"},{"n":32,"text":"문법을 짚어 볼게요. 첫 번째, 주어 Nothing much는 별일이라는 한 개를 뜻해요. 그래서 동사에 -s를 붙여서 happens라고 해요. 두 번째, on은 지구 같은 장소를 알려 주는 말이에요. 그래서 on Earth는 지구에서라는 뜻이 된답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러니\u003c/span>\u003cspan class=\"en\">So\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">걱정하지 마세요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003cspan class=\"tgt\">worry\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우주 날씨에 대해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">about \u003c/span>\u003cspan class=\"tgt\">space \u003c/span>\u003cspan class=\"tgt\">weather\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러니 우주 날씨에 대해 걱정하지 마세요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 우주 날씨가 대부분 잔잔하니 \u003cb class=\"key\">걱정하지 \u003c/b>\u003cb class=\"key\">말라\u003c/b>고 안심시켜 주는 문장이에요. 이 글의 \u003cb class=\"key\">중심\u003c/b>이 되는 말이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시키는 말(명령문)\u003c/span> : 하지 마(don't) + 걱정하다(worry) : \"걱정하지 마세요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">~에 대하여(전치사)\u003c/span> : 대하여(about) + 우주 날씨(space weather) : \"우주 날씨에 대하여\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"So, 그러니. don't worry, 걱정하지 마세요. about space weather, 우주 날씨에 대해. 이 문장 전체를 해석하면, 그러니 우주 날씨에 대해 걱정하지 마세요.","hl":"m"},{"n":34,"text":"이 문장은 우주 날씨가 대부분 잔잔하니까 걱정하지 말라고 안심시켜 주는 말이에요. 이 글에서 아주 중요한 중심 문장이죠.","hl":"mn"},{"n":35,"text":"문법을 짚어 볼게요. 첫 번째, 상대에게 무엇을 하라고 시키는 말을 명령문이라고 해요. 하지 말라고 할 때는 동사 앞에 don't를 붙여요. 두 번째, about은 무엇에 대하여라는 뜻으로 걱정의 대상을 뒤에 붙여 줘요. 여기서는 우주 날씨가 그 대상이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 때때로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">But\u003c/span> sometimes\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">태양이 만들어 냅니다\u003c/span>\u003cspan class=\"en\">the Sun \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">creates\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아주 강한 바람을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">very \u003c/span>\u003cspan class=\"tgt\">strong \u003c/span>\u003cspan class=\"tgt\">wind\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 때때로 태양이 매우 강한 바람을 만들어 냅니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 걱정하지 말라고 했지만, 가끔은 태양이 \u003cb class=\"key\">강한 \u003c/b>\u003cb class=\"key\">바람\u003c/b>을 만들어 낸다고 알려 줘요. 뒤에 이어질 \u003cb class=\"key\">문제\u003c/b>를 미리 꺼내는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어 걸 보여 주죠.","hl":"mn"},{"n":44,"text":"먼저 can 뒤에는 동사원형 break가 와요. 그래서 고장 낼 수 있다는 가능성을 말하죠. 그리고 break는 여기서 고장 내다라는 뜻이에요. 다음으로 in space는 우주 안에라는 장소 느낌을 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러면 지구상의 모든 것이\u003c/span>\u003cspan class=\"en\">Then everything \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">Earth\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">멈출 것입니다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">stop\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러면 지구상의 모든 것이 멈출 것입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 인공위성이 고장 나면 지구의 모든 것이 \u003cb class=\"key\">멈출\u003c/b> 수 있다는 결과를 말해요. 앞으로 생길 일을 will로 보여 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">장소 짝꿍 말(전치사) on\u003c/span> : 지구(Earth) 위에(on) : \"지구상의\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">앞으로 할 일(미래 will)\u003c/span> : 멈출 것이다(will stop) : \"멈출 것입니다\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"Then everything on Earth, 그러면 지구상의 모든 것이. will stop, 멈출 것입니다.. 이 문장 전체를 해석하면, 그러면 지구상의 모든 것이 멈출 것입니다.","hl":"m"},{"n":46,"text":"인공위성이 고장 나면 지구의 모든 것이 멈출 수 있다는 결과를 말해요. 앞으로 생길 일을 will로 보여 주는 문장이죠.","hl":"mn"},{"n":47,"text":"먼저 on Earth는 지구 위에라는 장소 느낌을 줘요. 그래서 지구상의라는 뜻이 되죠. 다음으로 will stop은 앞으로 멈출 것이라는 미래 뜻을 말해요. will 뒤에는 동사원형 stop이 와요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">있을 것입니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">be\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전기가 없음\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">no \u003c/span>\u003cspan class=\"tgt\">power \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또는 인터넷도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">Internet\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">전기나 인터넷이 없을 것입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞으로 \u003cb class=\"key\">전기\u003c/b>와 \u003cb class=\"key\">인터넷\u003c/b>이 모두 끊길 수 있다는 뜻이에요. 태양 폭풍이 우리 생활을 멈추게 한다는 걸 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">앞으로 있을 것을 말하는 There is/are(Ther is/are)\u003c/span> : There + will be + 무엇이(no power) = 무엇이 있을 것이다 : \"있을 것입니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : no + 무엇(A) + or + 무엇(B) = A도 B도 아닌 : \"전기나 인터넷\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"There will be, 있을 것입니다. no power, 전기가 없음. or Internet, 또는 인터넷도. 이 문장 전체를 해석하면, 전기나 인터넷이 없을 것입니다.","hl":"m"},{"n":49,"text":"태양 폭풍이 오면 지구에서 전기와 인터넷이 끊길 수 있다는 뜻이에요. 우리 생활에 아주 큰일이 나겠죠?","hl":"mn"},{"n":50,"text":"첫째, There will be는 '앞으로 있을 것이다'라는 뜻이에요. 둘째, no는 '없음'을 만들어 주고, or는 여기서 '또는'이 아니라 전기도 인터넷도 둘 다 이어 주는 말이에요. 그래서 전기나 인터넷이 없을 것입니다, 라고 해석한답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">태양 폭풍은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Solar \u003c/span>\u003cspan class=\"tgt\">storms\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또한 위험합니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">also \u003c/span>\u003cspan class=\"tgt\">dangerous \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우주비행사들에게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">for\u003c/span> the astronauts\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우주에 있는\u003c/span>\u003cspan class=\"en\">in space.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">태양 폭풍은 또한 우주에 있는 우주비행사들에게도 위험합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 태양 폭풍은 우주에 있는 \u003cb class=\"key\">우주비행사\u003c/b>에게도 \u003cb class=\"key\">위험\u003c/b>하다는 뜻이에요. 지구뿐 아니라 우주에서도 조심해야 한다고 알려 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">여러 개를 말하는 명사 + s(복수)\u003c/span> : 하나(storm) + [[s]] = 여러 개(storms) : \"태양 폭풍들은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be동사 + 꾸며 주는 말(형용사) + for(~에게)\u003c/span> : 주어(Solar storms) + are(이다) + dangerous(위험한) + for(에게) : \"또한 ~에게 위험합니다\"\u003c/div>\u003c/div>","segs":[{"n":51,"text":"Solar storms, 태양 폭풍은. are also dangerous, 또한 위험합니다. for the astronauts, 우주비행사들에게. in space, 우주에 있는. 이 문장 전체를 해석하면, 태양 폭풍은 또한 우주에 있는 우주비행사들에게도 위험합니다.","hl":"m"},{"n":52,"text":"태양 폭풍은 우주에 있는 우주비행사에게도 위험하다는 뜻이에요. 지구 사람만 조심하는 게 아니죠?","hl":"mn"},{"n":53,"text":"첫째, Solar storms처럼 명사 뒤에 s를 붙이면 '여러 개'라는 뜻이 돼요. 둘째, are also dangerous for는 '또한 ~에게 위험하다'라는 뜻이에요. 셋째, in space는 '우주에 있는'이라는 뜻으로 장소를 알려 주는 말이에요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">문제 해설\u003c/span>\u003cdiv class=\"lp-box\">\u003cspan class=\"lp-big\">주제 찾기\u003c/span>\u003cspan class=\"lp-pill\">정답 우주에도 날씨가 있고, 태양 폭풍은 위험할 수 있어요.\u003c/span>\u003cdiv style=\"margin-top:8px\">정답을 찾으려면 글 전체가 무엇을 말하는지 \u003cb class=\"key\">주제\u003c/b>를 먼저 찾아요. 첫 번째와 다섯 번째 문장에서 우주에도 날씨가 있다는 것을 확인하고, 열네 번째 문장에서 \u003cb class=\"key\">태양 \u003c/b>\u003cb class=\"key\">폭풍\u003c/b>이 우주비행사에게 위험하다는 것을 확인해요.\u003c/div>\u003cul style=\"font-size:14.5px;margin:8px 0 0;padding-left:20px\">\u003cli>우주에는 날씨가 전혀 없다고 하면 다섯 번째 문장과 달라요.\u003c/li>\u003cli>태양 폭풍이 항상 안전하다고 하면 열네 번째 문장과 달라요.\u003c/li>\u003cli>지구의 날씨만 설명한다고 하면 인공위성과 우주비행사 내용을 놓쳐요.\u003c/li>\u003c/ul>\u003c/div>","segs":[{"n":54,"text":"이제 문제를 풀어 볼까요? 이 글의 주제를 고르는 문제라면, 우주에도 날씨가 있고 태양 폭풍이 위험할 수 있다는 답을 찾아야 해요. 첫 번째 문장과 다섯 번째 문장에서 우주 날씨가 있다는 것을 확인하고, 열네 번째 문장에서 우주비행사에게 위험하다는 것도 확인해요. 정답은 우주 날씨와 태양 폭풍에 관한 내용이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">오늘 배운 내용 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>우주에도 \u003cb class=\"key\">날씨\u003c/b>가 있지만 대부분 아주 \u003cb class=\"key\">고요\u003c/b>해요.\u003c/li>\u003cli>때때로 태양이 강한 바람을 만들어 \u003cb class=\"key\">태양 \u003c/b>\u003cb class=\"key\">폭풍\u003c/b>이 일어나요.\u003c/li>\u003cli>태양 폭풍은 \u003cb class=\"key\">인공위성\u003c/b>을 고장 내고 전기와 인터넷을 멈출 수 있어요.\u003c/li>\u003cli>우주비행사에게도 \u003cb class=\"key\">위험\u003c/b>하니 우주 날씨를 알아 두어요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Space has weather, and a solar storm from the Sun can be dangerous.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">지구처럼 우주에도 \u003cb class=\"key\">날씨\u003c/b>가 있지만 대부분 아주 \u003cb class=\"key\">고요\u003c/b>해요. 하지만 태양이 강한 바람을 만들면 \u003cb class=\"key\">태양 \u003c/b>\u003cb class=\"key\">폭풍\u003c/b>이 일어나 인공위성과 우주비행사에게 위험할 수 있어요.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":55,"text":"오늘 우리는 우주에도 날씨가 있다는 것을 배웠어요. 대부분은 아주 고요하지만, 태양 폭풍이 생기면 인공위성과 우주비행사에게 위험할 수 있다는 점도 기억해요. 여러분이 질문을 잘 찾아 읽고 원인과 결과를 멋지게 따라와 주었어요. 정말 잘했어요, 다음 시간에도 재미있는 영어 이야기로 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
