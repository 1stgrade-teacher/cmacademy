<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>What's Reading 70 A Ch5 Unit 02 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"What's Reading 70 A Ch5 Unit 02","audioDir":"reading02_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.923em\">Ch5\u003cbr>Unit\u003cbr>02\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">What's Reading 70 A\u003c/div>\u003ch1>Slow Sloth: The Slowest Animal in the World\u003c/h1>\u003ch2>느린 나무늘보, 세상에서 가장 느린 동물\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">한 줄 요약\u003c/span>\u003cspan>나무늘보는 세상에서 가장 느린 동물 중 하나로, 나무 위에서 나뭇잎을 먹고 하루 스무 시간을 자요. 하루에 약 서른다섯 미터만 움직이지만, 몸에 \u003cb class=\"key\">녹조류\u003c/b>가 자라 나무처럼 보여 \u003cb class=\"key\">적\u003c/b>을 피할 수 있어요.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Sloths are very slow animals, and their slowness sometimes protects them.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘도 우리 함께 신나는 영어 읽기를 시작해 볼까요? 오늘 만날 친구는 아주아주 느린 동물, 나무늘보예요. 제목은 Slow Sloth, 느린 나무늘보랍니다. 이 글은 나무늘보가 얼마나 느린지, 그리고 그 느림이 나무늘보를 어떻게 도와주는지 알려 줘요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">미리 알면 쉬워요\u003c/span>\u003cdiv class=\"lp-box\">나무늘보(sloth)는 아주 따뜻한 열대 숲에 사는 동물이에요. 나무에 거꾸로 매달려 살면서 거의 움직이지 않아요. 사람은 하루에 만 걸음쯤 걷지만, 나무늘보는 마흔다섯 걸음만 걸어요. 그래서 몸에 \u003cb class=\"key\">녹조류\u003c/b>(algae)라는 초록 이끼가 자라요. 교실 벽에 먼지가 쌓이듯, 가만히 있으면 몸에 뭔가가 자라는 거예요.\u003c/div>","segs":[{"n":2,"text":"나무늘보는 아주 따뜻한 열대 숲에 사는 동물이에요. 나무에 매달려 살면서 거의 움직이지 않죠. 여러분은 하루에 몇 걸음이나 걸어요? 우리는 학교에 가고 친구와 놀면서 아주 많이 걸어요. 그런데 나무늘보는 하루에 겨우 마흔다섯 걸음만 걷고, 몸에는 초록색 algae, 녹조류가 자란대요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>느린 동물 소개\u003csmall>시작 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>나무늘보는 세상에서 가장 \u003cb class=\"key\">느린 \u003c/b>\u003cb class=\"key\">동물\u003c/b> 중 하나예요. 나무 위에서 나뭇잎을 먹고, 하루 스무 시간을 \u003cb class=\"key\">잠\u003c/b>으로 보내요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>하루의 생활\u003csmall>예시 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>나무늘보는 일주일에 한 번 \u003cb class=\"key\">화장실\u003c/b>에 갈 때만 나무에서 내려와요. 하루에 움직이는 거리는 약 \u003cb class=\"key\">서른다섯 \u003c/b>\u003cb class=\"key\">미터\u003c/b>로, 사람의 마흔다섯 걸음 정도예요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>느림의 반전\u003csmall>바뀜 · 문장 6\u003c/small>\u003c/h4>\u003cp>그런데 때때로 이 느림이 나무늘보를 \u003cb class=\"key\">보호\u003c/b>해 줘요. 느린 것이 나쁜 점만은 아니라는 뜻이에요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>나무로 변장\u003csmall>결과 · 문장 7–8\u003c/small>\u003c/h4>\u003cp>많이 움직이지 않으니 몸에 \u003cb class=\"key\">녹조류\u003c/b>가 자라요. 그래서 나무의 일부처럼 보이고, \u003cb class=\"key\">적\u003c/b>들이 때때로 그들을 놓쳐요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 나무늘보의 느린 생활을 소개하고, 그 느림이 주는 놀라운 도움까지 보여 줘요.","hl":null},{"n":4,"text":"먼저 나무늘보가 어떤 동물인지 소개해요. 나무늘보는 세상에서 가장 느린 동물 중 하나예요. 나무 위에서 나뭇잎을 먹고, 하루 스무 시간을 잠으로 보내죠. 정말 많이 자는 친구예요.","hl":"f0"},{"n":5,"text":"다음은 나무늘보의 하루 생활이에요. 나무늘보는 일주일에 한 번 화장실에 갈 때만 나무에서 내려와요. 하루에 움직이는 거리는 약 서른다섯 미터인데, 이건 사람의 마흔다섯 걸음 정도예요. 우리가 학교에 걸어가는 거리보다도 짧답니다.","hl":"f1"},{"n":6,"text":"그런데 여기서 재미있는 반전이 있어요. 때때로 이 느림이 나무늘보를 보호해 줘요. 느린 것이 나쁜 점만은 아니라는 뜻이죠.","hl":"f2"},{"n":7,"text":"마지막으로 느림이 주는 놀라운 선물이에요. 많이 움직이지 않으니 몸에 녹조류가 자라요. 그래서 나무의 일부처럼 보이고, 적들이 때때로 그들을 놓쳐요. 느림 덕분에 살아남는 거예요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">원인-결과로 설명하는 글\u003c/span>\u003cspan class=\"lp-pill\">처음\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 번째 문장에서 나무늘보가 아주 느린 동물이라고 \u003cb class=\"key\">주제\u003c/b>를 먼저 말해요. 그다음 느린 생활 모습을 보여 주고, 마지막에는 느림 때문에 \u003cb class=\"key\">녹조류\u003c/b>가 자라 \u003cb class=\"key\">적\u003c/b>을 피한다는 결과를 알려 줘요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>when (3)\u003c/b>\u003cspan>때를 알려 줌\u003c/span>\u003cb>Sometimes (6)\u003c/b>\u003cspan>가끔 그렇다고 알려 줌\u003c/span>\u003cb>Because (7)\u003c/b>\u003cspan>이유를 알려 줌\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">The sloth\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">They\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Sloths\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">their\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">them\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 원인과 결과로 설명하는 글이에요. 첫 번째 문장에서 주제를 먼저 말하고, 마지막에는 녹조류가 자라 적을 피하는 좋은 결과를 알려 줘요.","hl":"ty"},{"n":9,"text":"글 안에는 when, Sometimes, Because처럼 길을 알려 주는 말이 있어요. when은 때를, Because는 이유를 알려 주죠. 그리고 같은 나무늘보를 The sloth, They, Sloths, them처럼 여러 가지로 불러요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 단어\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>sloth\u003c/b>\u003cem>명사\u003c/em>\u003cspan>나무늘보\u003c/span>\u003c/div>\u003cdiv>\u003cb>one of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~중 하나\u003c/span>\u003c/div>\u003cdiv>\u003cb>slow\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>느린\u003c/span>\u003c/div>\u003cdiv>\u003cb>world\u003c/b>\u003cem>명사\u003c/em>\u003cspan>세상\u003c/span>\u003c/div>\u003cdiv>\u003cb>leaves\u003c/b>\u003cem>명사\u003c/em>\u003cspan>나뭇잎(leaf의 복수)\u003c/span>\u003c/div>\u003cdiv>\u003cb>sleep\u003c/b>\u003cem>동사\u003c/em>\u003cspan>자다\u003c/span>\u003c/div>\u003cdiv>\u003cb>hour\u003c/b>\u003cem>명사\u003c/em>\u003cspan>시간\u003c/span>\u003c/div>\u003cdiv>\u003cb>come down\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>내려오다\u003c/span>\u003c/div>\u003cdiv>\u003cb>once a week\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>일주일에 한 번\u003c/span>\u003c/div>\u003cdiv>\u003cb>move\u003c/b>\u003cem>동사\u003c/em>\u003cspan>움직이다, 이동하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>meter\u003c/b>\u003cem>명사\u003c/em>\u003cspan>미터\u003c/span>\u003c/div>\u003cdiv>\u003cb>step\u003c/b>\u003cem>명사\u003c/em>\u003cspan>걸음\u003c/span>\u003c/div>\u003cdiv>\u003cb>sometimes\u003c/b>\u003cem>부사\u003c/em>\u003cspan>때때로, 가끔\u003c/span>\u003c/div>\u003cdiv>\u003cb>protect\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보호하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>because\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>왜냐하면 ~때문에\u003c/span>\u003c/div>\u003cdiv>\u003cb>algae\u003c/b>\u003cem>명사\u003c/em>\u003cspan>녹조류\u003c/span>\u003c/div>\u003cdiv>\u003cb>grow\u003c/b>\u003cem>동사\u003c/em>\u003cspan>자라다\u003c/span>\u003c/div>\u003cdiv>\u003cb>look like\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~처럼 보이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>enemy\u003c/b>\u003cem>명사\u003c/em>\u003cspan>적\u003c/span>\u003c/div>\u003cdiv>\u003cb>miss\u003c/b>\u003cem>동사\u003c/em>\u003cspan>놓치다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"오늘의 단어도 소리 내어 읽어 볼까요? sloth는 나무늘보, slow는 느린, protect는 보호하다예요. algae는 녹조류, grow는 자라다, look like는 처럼 보이다라는 뜻이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">slow\u003c/b>\u003cspan class=\"m\">느린\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">not fast\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">fast\u003c/span>\u003cspan class=\"a\">quick\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">move\u003c/b>\u003cspan class=\"m\">움직이다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">go\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">stop\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">protect\u003c/b>\u003cspan class=\"m\">보호하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">keep safe\u003c/span>\u003cspan class=\"s\">guard\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hurt\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">grow\u003c/b>\u003cspan class=\"m\">자라다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">get bigger\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">get smaller\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">enemy\u003c/b>\u003cspan class=\"m\">적\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">bad guy\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">friend\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">sometimes\u003c/b>\u003cspan class=\"m\">때때로\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">now and then\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">always\u003c/span>\u003cspan class=\"a\">never\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"비슷한 말과 반대말도 함께 정리해 볼게요. slow는 느린, 반대말은 fast 빠른이고, move는 움직이다, 반대말은 stop 멈추다예요. protect는 보호하다, 비슷한 말은 keep safe 안전하게 지켜 주다이고, grow는 자라다, 비슷한 말은 get bigger 커지다예요. enemy는 적, 반대말은 friend 친구이고, sometimes는 때때로, 반대말은 always 항상이랍니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 나무늘보는\u003c/span>\u003cspan class=\"en\">The sloth\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~중 하나입니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is\u003c/span> one of\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가장 느린 동물\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">slowest \u003c/span>\u003cspan class=\"tgt\">animals\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세상에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">world\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나무늘보는 세상에서 가장 느린 동물 중 하나입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 나무늘보가 세상에서 가장 느린 동물 중 하나라는 것을 알려 줘요. 글의 \u003cb class=\"key\">주제\u003c/b>를 처음 소개하는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">am·are·is 친구들(be동사)\u003c/span> : 주어(The sloth) + is + 보어(one of ...) : \"~입니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">최상급(최상급)\u003c/span> : the + 가장 ~한(slowest) + 복수 명사(animals) : \"가장 느린 동물들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">장소 짝꿍 말(전치사)\u003c/span> : in + 장소(the world) : \"세상에서\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"The sloth, 그 나무늘보는. is one of, ~중 하나입니다. the slowest animals, 가장 느린 동물. in the world, 세상에서. 이 문장 전체를 해석하면, 나무늘보는 세상에서 가장 느린 동물 중 하나입니다.","hl":"m"},{"n":13,"text":"이 문장은 나무늘보가 세상에서 가장 느린 동물 중 하나라고 알려 줘요. 글의 주제를 처음 소개하는 문장이죠.","hl":"mn"},{"n":14,"text":"첫째, is는 주어가 한 마리일 때 쓰는 be동사예요. 둘째, the slowest는 가장 느리다는 뜻의 최상급이에요. 셋째, in the world는 세상이라는 뜻이고 in은 장소를 나타내는 전치사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 나뭇잎을 먹고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">They \u003c/span>\u003cspan class=\"tgt\">eat\u003c/span> leaves\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 ~동안 잠을 자요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">sleep\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하루에 20시간\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">20 \u003c/span>\u003cspan class=\"tgt\">hours\u003c/span> a day\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나무에서\u003c/span>\u003cspan class=\"en\">in trees.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 나뭇잎을 먹고 나무에서 하루에 20시간 동안 잠을 잡니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 나무늘보가 나무 위에서 나뭇잎을 먹고 하루에 20시간이나 잔다는 것을 알려 줘요. \u003cb class=\"key\">먹이\u003c/b>와 \u003cb class=\"key\">잠\u003c/b>에 대한 설명이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지금 하는 일(현재 시제)\u003c/span> : They + eat : \"그들은 먹어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : eat + and + sleep : \"먹고 잠을 자요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">시간 짝꿍 말(전치사)\u003c/span> : for + 시간(20 hours) : \"20시간 동안\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"They eat leaves, 그들은 나뭇잎을 먹고. and sleep for, 그리고 ~동안 잠을 자요. 20 hours a day, 하루에 20시간. in trees, 나무에서. 이 문장 전체를 해석하면, 그들은 나뭇잎을 먹고 나무에서 하루에 20시간 동안 잠을 잡니다.","hl":"m"},{"n":16,"text":"이 문장은 나무늘보가 나무 위에서 나뭇잎을 먹고 하루에 스무 시간이나 잔다는 걸 알려 줘요. 먹이와 잠에 대한 설명이죠.","hl":"mn"},{"n":17,"text":"첫째, They eat에서 They는 여러 마리를 가리켜요. 그래서 동사 eat 뒤에 s를 붙이지 않아요. 둘째, and는 먹는 일과 자는 일, 두 가지 행동을 이어 줘요. 셋째, for는 얼마 동안인지 말할 때 쓰는 전치사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 오직 내려와요\u003c/span>\u003cspan class=\"en\">They only come down\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나무에서\u003c/span>\u003cspan class=\"en\">from the trees\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 갈 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">go\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">화장실에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">bathroom\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일주일에 한 번\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">once \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">week\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 일주일에 한 번 화장실에 갈 때만 나무에서 내려옵니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 나무늘보가 일주일에 한 번 화장실에 갈 때만 나무에서 내려온다고 알려 줘요. 나무늘보의 적은 \u003cb class=\"key\">움직임\u003c/b>을 보여 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">때를 이어 주는 말(접속사)\u003c/span> : when + 누가(they) + 해요(go) : \"그들이 갈 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소 짝꿍 말(전치사)\u003c/span> : go + to + 장소(the bathroom) : \"화장실에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">얼마나 자주인지 말하는 표현(빈도 표현)\u003c/span> : once + a + week : \"일주일에 한 번\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"They only come down, 그들은 오직 내려와요. from the trees, 나무에서. when they go, 그들이 갈 때. to the bathroom, 화장실에. once a week, 일주일에 한 번. 이 문장 전체를 해석하면, 그들은 일주일에 한 번 화장실에 갈 때만 나무에서 내려옵니다.","hl":"m"},{"n":19,"text":"이 문장은 나무늘보가 일주일에 한 번 화장실에 갈 때만 나무에서 내려온다고 알려 줘요. 나무늘보의 적은 움직임을 보여 주는 문장이죠.","hl":"mn"},{"n":20,"text":"첫째, when은 어떤 일이 일어나는 때를 이어 주는 접속사예요. 둘째, to는 가는 장소를 알려 주는 전치사예요. 셋째, once a week는 일주일에 한 번이라는 빈도 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나무늘보들은 이동합니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Sloths \u003c/span>\u003cspan class=\"tgt\">move\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">약 35미터를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">about \u003c/span>\u003cspan class=\"tgt\">35 \u003c/span>\u003cspan class=\"tgt\">meters\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하루에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">day\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나무늘보는 하루에 약 35미터를 이동합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 나무늘보가 하루에 얼마나 움직이는지 \u003cb class=\"key\">숫자\u003c/b>로 알려 주는 문장이에요. 아주 조금 움직인다는 것을 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">여럿일 때 동사 그대로(복수 주어와 동사)\u003c/span> : 나무늘보들(Sloths) + 움직인다(move) : \"나무늘보들은 이동합니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">더 자세히 알려 주는 말(부사)\u003c/span> : 약(about) + 35미터(35 meters) : \"약 35미터\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">시간을 나타내는 말(시간 표현)\u003c/span> : 하루에(a day) : \"하루에\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Sloths move, 나무늘보들은 이동합니다. about 35 meters, 약 35미터를. a day, 하루에. 이 문장 전체를 해석하면, 나무늘보는 하루에 약 35미터를 이동합니다.","hl":"m"},{"n":22,"text":"이 문장은 나무늘보가 하루에 얼마나 움직이는지 알려 줘요. 숫자로 보니 정말 느리다는 게 느껴지죠?","hl":"mn"},{"n":23,"text":"첫 번째, Sloths처럼 여럿을 말할 때는 동사에 s를 붙이지 않아요. 그래서 move라고 그대로 써요. 두 번째, about은 숫자 앞에서 약이라는 뜻을 더해 줘요. 세 번째, a day는 하루에라는 시간 뜻이에요. 아주 쉬웠죠?","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 약 ~입니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">That's\u003c/span> about\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">45걸음\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">45 \u003c/span>\u003cspan class=\"tgt\">steps\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람의 (걸음)\u003c/span>\u003cspan class=\"en\">of a human.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 사람의 약 45걸음 정도입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사람이 걷는 \u003cb class=\"key\">걸음\u003c/b> 수와 비교해서 나무늘보가 얼마나 느린지 알려 줘요. 앞 문장의 35미터를 사람 걸음으로 바꿔 준 거예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">짧아진 be동사(be동사 축약)\u003c/span> : 그것은 ~이다(That is) → That's : \"그것은 ~입니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">여럿일 때 붙는 -s(복수)\u003c/span> : 45걸음(45 steps) : \"45걸음\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"That's about, 그것은 약 ~입니다. 45 steps, 45걸음. of a human, 사람의 (걸음). 이 문장 전체를 해석하면, 그것은 사람의 약 45걸음 정도입니다.","hl":"m"},{"n":25,"text":"앞에서 말한 35미터를 사람 걸음으로 바꿔 준 문장이에요. 사람은 금방 걷는 거리를 나무늘보는 하루에 겨우 가는 거죠.","hl":"mn"},{"n":26,"text":"첫 번째, That is를 짧게 줄이면 That's가 돼요. 두 번째, step이 여럿이라서 뒤에 s를 붙여 45 steps라고 해요. 숫자가 여럿을 뜻하면 명사에 s를 꼭 붙여 주세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">때때로\u003c/span>\u003cspan class=\"en\">Sometimes\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 느림은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">slowness\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들을 보호합니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">protects \u003c/span>\u003cspan class=\"tgt\">them\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">때때로 그들의 느림은 그들을 보호합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 느림이 나무늘보를 지켜 주는 경우가 있다는 것을 말해요. 뒤에 나올 이유를 미리 알려 주는 \u003cb class=\"key\">중심\u003c/b> 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">소유를 나타내는 말(소유격)\u003c/span> : 그들의(their) + 느림(slowness) : \"그들의 느림\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">한 사람·한 개일 때 동사 + s(3인칭 단수)\u003c/span> : 그것은(slowness) + 보호한다(protects) + 그들을(them) : \"그들을 보호합니다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Sometimes, 때때로. their slowness, 그들의 느림은. protects them, 그들을 보호합니다. 이 문장 전체를 해석하면, 때때로 그들의 느림은 그들을 보호합니다.","hl":"m"},{"n":28,"text":"느림이 나무늘보를 지켜 주는 때도 있다는 문장이에요. 바로 뒤에서 그 이유를 알려 줄 거예요.","hl":"mn"},{"n":29,"text":"첫 번째, their는 그들의라는 소유격이에요. 두 번째, slowness는 한 가지를 말하니까 protect에 s를 붙여 protects라고 해요. 주어가 하나면 동사에 s, 잊지 마세요!","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜냐하면 그들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Because\u003c/span> they\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많이 움직이지 않기\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003cspan class=\"tgt\">move\u003c/span> much,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들 위에 녹조류가 자랍니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">algae \u003c/span>\u003cspan class=\"tgt\">grows\u003c/span> on them.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 많이 움직이지 않기 때문에, 그들 위에 녹조류가 자랍니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 나무늘보가 \u003cb class=\"key\">많이 \u003c/b>\u003cb class=\"key\">움직이지 \u003c/b>\u003cb class=\"key\">않아서\u003c/b> 그 몸 위에 \u003cb class=\"key\">녹조류\u003c/b>가 자란다는 걸 말해요. 앞의 느린 이유가 몸을 \u003cb class=\"key\">보호\u003c/b>하는 데 도움이 된다는 흐름을 이어 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이유를 이어 주는 말(접속사)\u003c/span> : Because + 이유, 결과 : \"왜냐하면 ... 때문에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">일반동사 부정문(do/does/did 부정문)\u003c/span> : They + don't + move : \"움직이지 않아요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">한 덩어리일 때 동사에 s(3인칭 단수)\u003c/span> : algae + grows : \"녹조류가 자라요\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Because they, 왜냐하면 그들이. don't move much, 많이 움직이지 않기. algae grows on them, 그들 위에 녹조류가 자랍니다. 이 문장 전체를 해석하면, 그들은 많이 움직이지 않기 때문에, 그들 위에 녹조류가 자랍니다.","hl":"m"},{"n":31,"text":"이 문장은 나무늘보가 많이 움직이지 않아서 그 몸 위에 녹조류가 자란다는 걸 말해요. 앞의 느린 이유가 몸을 보호하는 데 도움이 된다는 흐름을 이어 줘요.","hl":"mn"},{"n":32,"text":"첫 번째, Because는 이유를 말하고 뒤에서는 결과를 보여 줘요. 두 번째, they처럼 여러 동물일 때는 don't를 써서 움직이지 않는다고 말해요. 세 번째, algae는 여러 개를 하나로 묶어 보는 말이라 동사에 s를 붙여 grows라고 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 ...처럼 보여요\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">look\u003c/span> like\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나무의 일부\u003c/span>\u003cspan class=\"en\">part of a tree,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그들의 적들은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">enemies\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">때때로 그들을 놓칩니다\u003c/span>\u003cspan class=\"en\">sometimes miss them.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 나무의 일부처럼 보이고, 그들의 적들은 때때로 그들을 놓칩니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 나무늘보가 나무의 \u003cb class=\"key\">일부\u003c/b>처럼 보여서 적들이 \u003cb class=\"key\">놓칠\u003c/b> 수 있다는 걸 말해요. 앞에서 말한 느림과 녹조류 덕분에 \u003cb class=\"key\">보호\u003c/b>를 받는다는 흐름을 마무리해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재 사실을 말하는 동사(현재형)\u003c/span> : They + look + like + 명사 : \"보여요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">앞뒤를 이어 주는 말(접속사)\u003c/span> : 문장 + and + 문장 : \"그리고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">소유를 나타내는 말(소유격)\u003c/span> : their + 명사 : \"그들의 적들\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"They look like, 그들은 ...처럼 보여요. part of a tree, 나무의 일부. and their enemies, 그리고 그들의 적들은. sometimes miss them, 때때로 그들을 놓칩니다. 이 문장 전체를 해석하면, 그들은 나무의 일부처럼 보이고, 그들의 적들은 때때로 그들을 놓칩니다.","hl":"m"},{"n":34,"text":"이 문장은 나무늘보가 나무의 일부처럼 보여서 적들이 놓칠 수 있다는 걸 말해요. 앞에서 말한 느림과 녹조류 덕분에 보호를 받는다는 흐름을 마무리해요.","hl":"mn"},{"n":35,"text":"첫 번째, look은 보통 때의 모습을 말하는 동사예요. look like는 무엇처럼 보이다라는 짝꿍 표현이에요. 두 번째, and는 앞 내용과 뒤 내용을 이어 주는 말이에요. 세 번째, their는 그들의라는 뜻으로 뒤의 명사를 꾸며 줘요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">오늘 배운 내용 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>나무늘보는 세상에서 가장 \u003cb class=\"key\">느린 \u003c/b>\u003cb class=\"key\">동물\u003c/b> 중 하나예요.\u003c/li>\u003cli>나무 위에서 나뭇잎을 먹고 하루 스무 시간을 자며, 하루에 약 \u003cb class=\"key\">서른다섯 \u003c/b>\u003cb class=\"key\">미터\u003c/b>만 움직여요.\u003c/li>\u003cli>많이 움직이지 않아 몸에 \u003cb class=\"key\">녹조류\u003c/b>가 자라고, 나무처럼 보여요.\u003c/li>\u003cli>그래서 \u003cb class=\"key\">적\u003c/b>을 피할 수 있어요. 느림이 나무늘보를 지켜 주는 거예요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Sloths are very slow animals, and their slowness sometimes protects them.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">나무늘보는 세상에서 가장 느린 동물 중 하나로, 나무 위에서 나뭇잎을 먹고 하루 스무 시간을 자요. 하루에 약 서른다섯 미터만 움직이지만, 몸에 \u003cb class=\"key\">녹조류\u003c/b>가 자라 나무처럼 보여 \u003cb class=\"key\">적\u003c/b>을 피할 수 있어요.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":36,"text":"오늘 우리는 나무늘보가 얼마나 느린지 배웠어요. 나무늘보는 세상에서 가장 느린 동물 중 하나였죠. 몸에 녹조류가 자라 나무처럼 보여 적을 피했고, 느림이 나무늘보를 보호해 줬어요. 끝까지 잘 따라온 여러분 정말 멋지고, 다음 시간에 또 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
