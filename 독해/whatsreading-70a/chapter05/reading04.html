</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"What's Reading 70 A Ch5 Unit 04","audioDir":"reading04_audio","preview":false,"count":52,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.923em\">Ch5\u003cbr>Unit\u003cbr>04\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">What's Reading 70 A\u003c/div>\u003ch1>Slow Living Brings Happiness\u003c/h1>\u003ch2>느린 삶이 행복을 가져와요\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">한 줄 요약\u003c/span>\u003cspan>요약: 바쁜 사람들은 삶을 즐기지 못하고 중요한 것을 놓쳐요. 그래서 어떤 사람들은 \u003cb class=\"key\">슬로 \u003c/b>\u003cb class=\"key\">리빙\u003c/b>을 선택하고, 가족·친구·자연과 시간을 보내며 \u003cb class=\"key\">행복\u003c/b>을 찾아요.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Slow living, spending more time with family, friends, and nature, brings happiness to people.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘도 만나서 정말 반가워요. 오늘 우리가 읽을 글은 A Slow Life, 느린 삶에 대한 이야기예요. 바쁜 사람들이 왜 느린 삶을 선택하는지 함께 알아볼까요? 한 줄로 말하면, 느린 삶이 작은 일들을 통해 행복을 가져다준다는 이야기예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">미리 알면 쉬워요\u003c/span>\u003cdiv class=\"lp-box\">슬로 리빙(slow living)은 '느린 삶'이라는 뜻이에요. 모든 일을 느리게 하는 것이 아니라, 중요한 것을 놓치지 않으려고 \u003cb class=\"key\">시간\u003c/b>을 잘 쓰는 삶이에요. 여러분이 숙제를 아주 급하게 하면 틀린 곳을 못 보죠? 조금 천천히 하면 더 잘 보여요. 이렇게 \u003cb class=\"key\">중요한 \u003c/b>\u003cb class=\"key\">것\u003c/b>을 먼저 챙기는 것이 슬로 리빙이에요. '천천히 해'라는 말 take your time도 같은 느낌이에요.\u003c/div>","segs":[{"n":2,"text":"먼저 slow living, 슬로 리빙에 대해 알아볼게요. 슬로 리빙은 모든 일을 느리게 하는 것이 아니에요. 중요한 것을 놓치지 않으려고 시간을 잘 쓰는 삶이에요. 여러분, 숙제를 아주 급하게 하면 실수가 늘지 않나요? 조금 천천히 하면 더 잘 보이죠. 이렇게 중요한 것을 먼저 챙기는 것이 슬로 리빙이에요. take your time 처럼 '천천히 해'라고 말할 때도 같은 느낌이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>바쁜 사람들\u003csmall>문제 · 문장 1–4\u003c/small>\u003c/h4>\u003cp>오늘날 모든 사람이 바쁘고, 어떤 사람들은 항상 더 빨리 하라고 말해요. 그래서 그들은 삶을 즐기지 못하고 \u003cb class=\"key\">중요한 \u003c/b>\u003cb class=\"key\">것\u003c/b>을 놓치기도 해요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>슬로 리빙 소개\u003csmall>소개 · 문장 5–8\u003c/small>\u003c/h4>\u003cp>그래서 어떤 사람들은 \u003cb class=\"key\">슬로 \u003c/b>\u003cb class=\"key\">리빙\u003c/b>을 선택해요. 그런데 모든 일을 느리게 하는 것은 아니에요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>느린 삶의 모습\u003csmall>예시 · 문장 9–12\u003c/small>\u003c/h4>\u003cp>그들은 가족·친구와 더 많은 \u003cb class=\"key\">시간\u003c/b>을 보내고, 자연 속에서 산책을 즐겨요. 이런 일들은 \u003cb class=\"key\">작은 \u003c/b>\u003cb class=\"key\">일\u003c/b>들이에요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>행복이라는 결과\u003csmall>마무리 · 문장 13\u003c/small>\u003c/h4>\u003cp>작은 일들이지만 느린 삶은 그들에게 \u003cb class=\"key\">행복\u003c/b>을 가져다줘요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 따라가 볼게요. 바쁜 사람들 이야기에서 시작해서 느린 삶, 그리고 행복으로 이어져요.","hl":null},{"n":4,"text":"첫 번째 단계는 바쁜 사람들 이야기예요. Today, everyone is busy, 오늘날 모든 사람이 바쁘다는 뜻이죠. 어떤 사람들은 항상 Faster, faster 하면서 더 빨리 하라고 말해요. 그래서 그들은 자신의 삶을 즐기지 못하고, 중요한 것을 놓치기도 해요.","hl":"f0"},{"n":5,"text":"그래서 어떤 사람들은 슬로 리빙을 선택해요. 그런데 여기서 질문이 하나 나와요. Do they do everything slowly, 모든 것을 느리게 할까요? 대답은 No, they don't, 아니에요.","hl":"f1"},{"n":6,"text":"그럼 그들은 무엇을 할까요? 가족과 친구들과 더 많은 시간을 보내요. 또 자연 속에서 더 많은 시간을 보내고, 산책하는 것을 즐겨요. Such things are small, 이런 일들은 작다고 했죠.","hl":"f2"},{"n":7,"text":"마지막 문장을 볼게요. But slow living brings happiness to them. 작은 일들이지만 느린 삶이 그들에게 행복을 가져다줘요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결\u003c/span>\u003cspan class=\"lp-pill\">가운데\u003c/span>\u003cspan class=\"lp-pill\">주제문 5번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">처음에는 바쁜 사람들의 \u003cb class=\"key\">문제\u003c/b>를 보여 줘요. 가운데에서 슬로 리빙이라는 \u003cb class=\"key\">해결\u003c/b> 방법을 소개하고, 마지막에 느린 삶이 \u003cb class=\"key\">행복\u003c/b>을 준다고 정리해요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Today (1)\u003c/b>\u003cspan>때를 알려 줌\u003c/span>\u003cb>So (5)\u003c/b>\u003cspan>앞 내용의 결과로 이어 줌\u003c/span>\u003cb>also (10)\u003c/b>\u003cspan>내용을 더해 줌\u003c/span>\u003cb>But (13)\u003c/b>\u003cspan>반대 느낌으로 정리해 줌\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">some people\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">they\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">their\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">them\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Busy Life\u003c/th>\u003cth>Slow Living\u003c/th>\u003c/tr>\u003ctr>\u003ctd>항상 더 빨리 하라고 말해요\u003c/td>\u003ctd>모든 것을 느리게 하지는 않아요\u003c/td>\u003c/tr>\u003ctr>\u003ctd>삶을 즐기지 못해요\u003c/td>\u003ctd>가족·친구와 시간을 보내요\u003c/td>\u003c/tr>\u003ctr>\u003ctd>중요한 것을 놓쳐요\u003c/td>\u003ctd>자연에서 산책을 즐겨요\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 문제와 해결의 짜임이에요. 처음에는 바쁜 사람들의 문제를 보여 주고, 가운데에서 슬로 리빙이라는 해결 방법을 알려 주죠. 중심 문장은 다섯 번째 문장인 So, some people choose slow living이에요.","hl":"ty"},{"n":9,"text":"길잡이 말을 찾아볼까요? 첫 번째 문장의 Today는 때를 알려 주고, 다섯 번째 문장의 So는 앞 내용에 대한 결과를 이어 줘요. 열 번째 문장의 also는 또한이라고 내용을 더해 주고, 마지막 문장의 But은 반대 느낌으로 정리해 줘요. 같은 사람들을 some people, they, them 처럼 다르게 부르고 있으니 잘 따라와 보세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 단어\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>everyone\u003c/b>\u003cem>대명사\u003c/em>\u003cspan>모든 사람\u003c/span>\u003c/div>\u003cdiv>\u003cb>busy\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>바쁜\u003c/span>\u003c/div>\u003cdiv>\u003cb>faster\u003c/b>\u003cem>부사\u003c/em>\u003cspan>더 빨리\u003c/span>\u003c/div>\u003cdiv>\u003cb>enjoy\u003c/b>\u003cem>동사\u003c/em>\u003cspan>즐기다\u003c/span>\u003c/div>\u003cdiv>\u003cb>life\u003c/b>\u003cem>명사\u003c/em>\u003cspan>삶, 인생\u003c/span>\u003c/div>\u003cdiv>\u003cb>sometimes\u003c/b>\u003cem>부사\u003c/em>\u003cspan>때때로\u003c/span>\u003c/div>\u003cdiv>\u003cb>miss\u003c/b>\u003cem>동사\u003c/em>\u003cspan>놓치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>important\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>중요한\u003c/span>\u003c/div>\u003cdiv>\u003cb>choose\u003c/b>\u003cem>동사\u003c/em>\u003cspan>선택하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>slow living\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>느린 삶, 슬로 리빙\u003c/span>\u003c/div>\u003cdiv>\u003cb>everything\u003c/b>\u003cem>대명사\u003c/em>\u003cspan>모든 것\u003c/span>\u003c/div>\u003cdiv>\u003cb>slowly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>느리게\u003c/span>\u003c/div>\u003cdiv>\u003cb>spend\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(시간을) 보내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>more\u003c/b>\u003cem>부사\u003c/em>\u003cspan>더 (많이)\u003c/span>\u003c/div>\u003cdiv>\u003cb>nature\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자연\u003c/span>\u003c/div>\u003cdiv>\u003cb>take a walk\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>산책하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>such\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>그러한\u003c/span>\u003c/div>\u003cdiv>\u003cb>bring\u003c/b>\u003cem>동사\u003c/em>\u003cspan>가져다주다\u003c/span>\u003c/div>\u003cdiv>\u003cb>happiness\u003c/b>\u003cem>명사\u003c/em>\u003cspan>행복\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"오늘의 단어를 소리 내어 읽어 볼게요. busy는 바쁜, enjoy는 즐기다, choose는 선택하다라는 뜻이에요. spend는 시간을 보내다, take a walk는 산책하다, happiness는 행복이라는 뜻이고 bring은 가져다주다라는 뜻이죠.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">busy\u003c/b>\u003cspan class=\"m\">바쁜\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">active\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">free\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">enjoy\u003c/b>\u003cspan class=\"m\">즐기다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">like\u003c/span>\u003cspan class=\"s\">love\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hate\u003c/span>\u003cspan class=\"a\">dislike\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">miss\u003c/b>\u003cspan class=\"m\">놓치다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">lose\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">catch\u003c/span>\u003cspan class=\"a\">find\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">always\u003c/b>\u003cspan class=\"m\">항상\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">all the time\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">never\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">important\u003c/b>\u003cspan class=\"m\">중요한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">special\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unimportant\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">happiness\u003c/b>\u003cspan class=\"m\">행복\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">joy\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">sadness\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"비슷한 말과 반대말도 정리해 볼게요. busy는 바쁜, 반대말은 free 예요. enjoy는 like, love와 비슷하고 hate와 반대예요. miss는 놓치다, catch나 find와 반대말이에요. always는 all the time과 비슷하고 never와 반대, important는 special과 비슷하고 unimportant와 반대예요. happiness는 joy와 비슷하고 sadness와 반대랍니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오늘날, 모든 사람은\u003c/span>\u003cspan class=\"en\">Today, everyone\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바쁩니다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is\u003c/span> busy.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">오늘날, 모든 사람이 바쁩니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 오늘날 모두가 바쁘다는 \u003cb class=\"key\">배경\u003c/b>을 알려 줘요. 글의 \u003cb class=\"key\">도입\u003c/b> 부분이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">am·are·is 친구들(be동사)\u003c/span> : 모든 사람(everyone) + 이다(is) + 바쁜(busy) : \"바쁩니다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Today, everyone, 오늘날, 모든 사람은. is busy, 바쁩니다.. 이 문장 전체를 해석하면, 오늘날, 모든 사람이 바쁩니다.","hl":"m"},{"n":13,"text":"오늘날 모든 사람이 바쁘다는 배경을 알려 주는 문장이에요. 글의 도입 부분이죠.","hl":"mn"},{"n":14,"text":"여기서 everyone은 한 덩어리로 하나처럼 보여서 is를 써요. 주어가 하나일 때 be동사 is를 쓰는 걸 기억해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 사람들은\u003c/span>\u003cspan class=\"en\">Some people\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">항상 말합니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">always\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">say\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">&quot;더 빨리, 더 빨리!&quot;라고\u003c/span>\u003cspan class=\"en\">&quot;Faster, faster!&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어떤 사람들은 항상 &quot;더 빨리, 더 빨리!&quot;라고 말합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 어떤 사람들이 \u003cb class=\"key\">서두름\u003c/b>을 부추겨요. 앞 문장의 \u003cb class=\"key\">바쁜 \u003c/b>\u003cb class=\"key\">모습\u003c/b>을 더 자세히 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=  삶의 즐거움을 놓친다는 문제점을 말해 줘요.","hl":"mn"},{"n":20,"text":"enjoy 앞에 don't를 붙여 부정을 만들어요. their는 그들의라는 소유를 나타내죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가끔 그들은\u003c/span>\u003cspan class=\"en\">Sometimes \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">중요한 것들을 놓쳐요.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">miss\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">important \u003c/span>\u003cspan class=\"tgt\">things\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">때때로 그들은 중요한 것들을 놓칩니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 가끔 사람들은 \u003cb class=\"key\">중요한 \u003c/b>\u003cb class=\"key\">것\u003c/b>을 \u003cb class=\"key\">놓쳐요\u003c/b>. 너무 바쁘면 소중한 것을 잊을 수 있다는 뜻이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재 사실 말하기(일반동사 현재형)\u003c/span> : 그들은(they) + 놓쳐요(miss) + 중요한 것들(important things) : \"그들은 놓쳐요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">꾸며 주는 말(형용사)\u003c/span> : 꾸밈말(important) + 이름말(things) : \"중요한 것들\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Sometimes they, 가끔 그들은. miss important things, 중요한 것들을 놓쳐요.. 이 문장 전체를 해석하면, 때때로 그들은 중요한 것들을 놓칩니다.","hl":"m"},{"n":22,"text":"이 문장은 가끔 사람들이 중요한 것을 놓친다는 뜻이에요. 너무 바쁘면 소중한 것을 잊을 수 있다는 걸 알려 주죠.","hl":"mn"},{"n":23,"text":"첫 번째로 they miss를 볼게요. 지금도 가끔 그런다는 뜻이라 동사를 현재형으로 써요. 두 번째로 important things를 볼게요. important는 꾸며 주는 말이라서 things가 어떤 것들인지 알려 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 13\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdi 과. 이 문장 전체를 해석하면, 그들은 가족과 친구들과 더 많은 시간을 보냅니다.","hl":"m"},{"n":37,"text":"느린 생활을 하는 사람들은 가족과 친구에게 시간을 더 많이 쓴다는 걸 알려 주는 문장이에요. 아주 따뜻한 느낌이 들죠?","hl":"mn"},{"n":38,"text":"첫 번째, They는 여러 사람이라 동사 spend에 s를 붙이지 않고 현재형 그대로 써요. 두 번째, more time은 비교급 more를 써서 더 많은 시간이라는 뜻을 만들어요. 세 번째, with는 함께라는 뜻의 전치사예요. 그래서 가족과 친구들과 함께라고 해석한답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 또한\u003c/span>\u003cspan class=\"en\">They also\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 많은 시간을 보냅니다\u003c/span>\u003cspan class=\"en\">spend \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">time\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자연 속에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">nature\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 또한 자연 속에서 더 많은 시간을 보냅니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 느린 삶을 사는 사람들이 \u003cb class=\"key\">자연\u003c/b> 속에서 시간을 더 많이 보낸다는 뜻이에요. 가족과 친구에 이어 자연까지, \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">많은 \u003c/b>\u003cb class=\"key\">시간\u003c/b>을 함께 보낸다는 말이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">더 많은 양 말하기(비교급 more)\u003c/span> : 더 많은(more) + 시간(time) : \"더 많은 시간\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소 짝꿍 말(전치사)\u003c/span> : 안에·속에(in) + 자연(nature) : \"자연 속에서\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"They also, 그들은 또한. spend more time, 더 많은 시간을 보냅니다. in nature, 자연 속에서. 이 문장 전체를 해석하면, 그들은 또한 자연 속에서 더 많은 시간을 보냅니다.","hl":"m"},{"n":40,"text":"이 문장은 느린 삶을 사는 사람들이 자연 속에서 시간을 더 많이 보낸다는 뜻이에요. 가족과 친구에 이어 자연까지 시간을 나눈다는 거죠.","hl":"mn"},{"n":41,"text":"첫째, more는 더 많은이라는 뜻으로, 시간처럼 셀 수 없는 것 앞에 와요. 그래서 more time은 더 많은 시간이에요. 둘째, in은 속에, 안에라는 장소 짝꿍 말이에요. 그래서 in nature는 자연 속에서가 되죠. 아주 쉬워요, 여러분!","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 즐깁니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">They \u003c/span>\u003cspan class=\"tgt\">enjoy\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">산책하는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">taking \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">walk\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 산책하는 것을 즐깁니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 그들이 산책하는 것을 \u003cb class=\"key\">즐긴다\u003c/b>는 뜻이에요. 느린 삶을 사는 사람들의 \u003cb class=\"key\">산책\u003c/b> 모습이 담겨 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지금 하는 일 말하기(현재시제)\u003c/span> : 그들은(They) + 즐겨요(enjoy) : \"그들은 즐깁니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동사-ing를 이름 말처럼(동명사)\u003c/span> : 즐긴다(enjoy) + 하는 것(taking) : \"산책하는 것\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"They enjoy, 그들은 즐깁니다. taking a walk, 산책하는 것을. 이 문장 전체를 해석하면, 그들은 산책하는 것을 즐깁니다.","hl":"m"},{"n":43,"text":"산책을 좋아하고 즐긴다는 뜻이에요. 느린 삶을 사는 사람들의 하루가 담겨 있죠.","hl":"mn"},{"n":44,"text":"첫째, They enjoy는 그들은 즐긴다는 뜻이에요. 둘째, enjoy 뒤에 taking처럼 동사에 ing를 붙이면 하는 것이라는 이름 말이 돼요. 그래서 taking a walk는 산책하는 것이에요. 여러분도 enjoy 뒤에는 ing를 꼭 기억해요!","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러한 것들은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Such \u003c/span>\u003cspan class=\"tgt\">things\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사소합니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">small\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러한 것들은 사소합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 산책 같은 일은 \u003cb class=\"key\">작고 \u003c/b>\u003cb class=\"key\">사소한 \u003c/b>\u003cb class=\"key\">것\u003c/b>이라고 말해요. 그런데 뒤에서 \u003cb class=\"key\">행복\u003c/b>을 준다고 이어지니, 작은 일도 중요하다는 뜻이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">여러 개를 가리키는 말(복수 명사)\u003c/span> : 이런(Such) + 것들(things) : \"그러한 것들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be동사(be동사)\u003c/span> : 그것들은(They) + 이다(are) + 작은(small) : \"사소합니다\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"Such things, 그러한 것들은. are small, 사소합니다. 이 문장 전체를 해석하면, 그러한 것들은 사소합니다.","hl":"m"},{"n":46,"text":"산책처럼 작고 사소해 보이는 일들을 말해요. 그런데 이런 작은 일이 행복을 준다고 뒤에서 말하죠.","hl":"mn"},{"n":47,"text":"첫째, thing에 s를 붙이면 여러 개를 말해요. 그래서 Such things는 그러한 것들이에요. 둘째, 주어가 여러 개일 때는 is가 아니라 are를 써요. 그래서 are small은 작아요, 사소해요라는 뜻이에요. 아주 잘하고 있어요!","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 13\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 슬로 리빙은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">But\u003c/span> slow living\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">행복을 가져다줍니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">brings\u003c/span> happiness\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들에게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">them\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 슬로 리빙은 그들에게 행복을 가져다줍니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 작은 일들도 \u003cb class=\"key\">슬로 \u003c/b>\u003cb class=\"key\">리빙\u003c/b>에서는 \u003cb class=\"key\">행복\u003c/b>을 가져다준다는 뜻이에요. 글의 마지막에서 슬로 리빙의 좋은 점을 정리해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 하지만(But) + 뒤 문장 : \"하지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">한 사람·한 개일 때 동사 + s(3인칭 단수)\u003c/span> : 누가(It) + 한다(brings) + 무엇을(happiness) : \"가져다줍니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 to + 대명사(전치사와 대명사)\u003c/span> : to + 누구에게(them) : \"그들에게\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"But slow living, 하지만 슬로 리빙은. brings happiness, 행복을 가져다줍니다. to them, 그들에게. 이 문장 전체를 해석하면, 하지만 슬로 리빙은 그들에게 행복을 가져다줍니다.","hl":"m"},{"n":49,"text":"이 문장은 작은 일들도 슬로 리빙 안에서 행복을 가져다준다는 뜻이에요. 글의 마지막에서 슬로 리빙의 좋은 점을 정리하고 있죠.","hl":"mn"},{"n":50,"text":"첫 번째, 주어 slow living은 하나의 생활 방식이라 동사 bring 뒤에 s를 붙여 brings라고 해요. 두 번째, to는 에게라는 방향을 나타내고 them은 그들을 대신하는 대명사예요. 세 번째, But은 앞 내용과 반대되는 생각을 이어 주며 작은 일도 행복을 준다는 점을 강조해요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">문제 해설\u003c/span>\u003cdiv class=\"lp-box\">\u003cspan class=\"lp-big\">글의 요지 찾기\u003c/span>\u003cspan class=\"lp-pill\">정답 슬로 리빙은 작은 일들을 통해 우리에게 행복을 가져다준다.\u003c/span>\u003cdiv style=\"margin-top:8px\">마지막 문장에서 slow living brings \u003cb class=\"key\">happiness\u003c/b> to them, 느린 삶이 그들에게 \u003cb class=\"key\">행복\u003c/b>을 가져다준다고 했어요. 그래서 답은 '느린 삶이 행복을 준다'예요. 모든 것을 느리게 한다는 말은 일곱 번째, 여덟 번째 문장에서 아니라고 했으니 조심해요.\u003c/div>\u003cul style=\"font-size:14.5px;margin:8px 0 0;padding-left:20px\">\u003cli>모든 것을 느리게 한다는 말은 일곱 번째와 여덟 번째 문장에서 No, they don't라고 했어요.\u003c/li>\u003cli>바쁜 사람들이 삶을 즐긴다는 말은 세 번째 문장과 반대예요.\u003c/li>\u003cli>슬로 리빙이 큰일만 한다는 말은 열두 번째 문장 Such things are small과 맞지 않아요.\u003c/li>\u003c/ul>\u003c/div>","segs":[{"n":51,"text":"이제 문제를 풀어 볼게요. 이 글의 요지를 찾는 문제예요. 마지막 문장을 보면 slow living brings happiness to them, 느린 삶이 그들에게 행복을 가져다준다고 했죠. 그래서 답은 느린 삶이 작은 일들을 통해 행복을 가져다준다는 것이에요. 모든 것을 느리게 한다는 말은 일곱 번째와 여덟 번째 문장에서 아니라고 했으니 조심하세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">오늘 배운 내용 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>바쁜 사람들은 항상 더 빨리 하려고 해서 \u003cb class=\"key\">삶\u003c/b>을 즐기지 못해요.\u003c/li>\u003cli>그래서 어떤 사람들은 \u003cb class=\"key\">슬로 \u003c/b>\u003cb class=\"key\">리빙\u003c/b>을 선택해요.\u003c/li>\u003cli>슬로 리빙은 모든 것을 느리게 하는 것이 아니라 가족·친구·\u003cb class=\"key\">자연\u003c/b>과 시간을 보내는 거예요.\u003c/li>\u003cli>작은 일들이지만 느린 삶은 그들에게 \u003cb class=\"key\">행복\u003c/b>을 가져다줘요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Slow living, spending more time with family, friends, and nature, brings happiness to people.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: 바쁜 사람들은 삶을 즐기지 못하고 중요한 것을 놓쳐요. 그래서 어떤 사람들은 \u003cb class=\"key\">슬로 \u003c/b>\u003cb class=\"key\">리빙\u003c/b>을 선택하고, 가족·친구·자연과 시간을 보내며 \u003cb class=\"key\">행복\u003c/b>을 찾아요.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":52,"text":"오늘 우리는 느린 삶에 대한 글을 읽었어요. 바쁜 하루 속에서도 작은 일에 시간을 쓰면 행복해진다는 것을 배웠죠. 여러분도 오늘 가족과 함께 산책을 해 보는 건 어때요? 끝까지 잘 따라온 여러분, 정말 멋져요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
