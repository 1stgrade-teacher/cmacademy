<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>What's Reading 70 A Ch2 Unit 04 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"What's Reading 70 A Ch2 Unit 04","audioDir":"reading04_audio","preview":false,"count":46,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.923em\">Ch2\u003cbr>Unit\u003cbr>04\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">What's Reading 70 A\u003c/div>\u003ch1>Delicious Sauce: From Fish Sauce to Tomato Ketchup\u003c/h1>\u003ch2>맛있는 소스: 생선 소스에서 토마토 케첩으로\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">한 줄 요약\u003c/span>\u003cspan>케첩은 오늘날 \u003cb class=\"key\">토마토\u003c/b>로 만들지만, 오래 전에는 아시아에서 온 \u003cb class=\"key\">생선 \u003c/b>\u003cb class=\"key\">소스\u003c/b>였어요. 영국 사람들과 농부들의 여러 가지 시도 끝에, Henry Heinz가 \u003cb class=\"key\">식초\u003c/b>와 \u003cb class=\"key\">설탕\u003c/b>을 넣어 오래 신선하게 유지되는 토마토 케첩을 만들었습니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Ketchup has changed a lot, from fish sauce in Asia to the fresh tomato ketchup we eat today.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘도 만나서 정말 반가워요. 오늘은 맛있는 소스, 케첩에 대한 이야기를 읽어 볼 거예요. 케첩이 어떻게 지금처럼 토마토로 만든 소스가 되었는지 함께 알아보아요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">미리 알면 쉬워요\u003c/span>\u003cdiv class=\"lp-box\">케첩은 영어로 \u003cb class=\"key\">ketchup\u003c/b>이라고 해요. 옛날 사람들은 소스를 오래 두고 먹으려고 소금에 절이거나 발효시켰어요. 그래서 생선을 소금에 절인 \u003cb class=\"key\">fish \u003c/b>\u003cb class=\"key\">sauce\u003c/b>가 아시아에서 아주 인기 있었답니다. 여러분이 좋아하는 토마토 케첩은 생각보다 최근에 생긴 것이에요. 처음엔 별로 안 좋아하던 간식이 조금씩 바뀌어 지금은 제일 좋아하는 간식이 되는 것과 비슷해요.\u003c/div>","segs":[{"n":2,"text":"여러분, 케첩은 영어로 ketchup이라고 해요. 옛날 사람들은 소스를 오래 보관하려고 소금에 절이거나 발효시켰어요. 그래서 생선을 소금에 절인 fish sauce가 아시아에서 아주 인기 있었답니다. 여러분은 케첩을 어떤 음식에 찍어 먹나요? 우리가 좋아하는 토마토 케첩은 생각보다 최근에 생긴 것이래요. 처음엔 별로 안 좋아하던 간식이 조금씩 바뀌어서 지금은 제일 좋아하는 간식이 되는 것과 비슷해요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>케첩의 시작\u003csmall>시작 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>지금 케첩은 \u003cb class=\"key\">토마토\u003c/b>로 만들어져요. 그런데 오래 전에는 아시아에서 온 \u003cb class=\"key\">생선 \u003c/b>\u003cb class=\"key\">소스\u003c/b>였답니다. 같은 이름인데 무엇으로 만드는지가 완전히 달랐어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>영국 사람들의 도전\u003csmall>예시 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>영국 사람들이 아시아에서 케첩을 \u003cb class=\"key\">맛보았어요\u003c/b>. 그들도 만들고 싶어서 \u003cb class=\"key\">버섯\u003c/b>과 생선을 사용했답니다. 그래서 집집마다 조금씩 다른 케첩이 생겼어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>빨리 상하는 케첩\u003csmall>문제 · 문장 6–8\u003c/small>\u003c/h4>\u003cp>나중에 농부들이 \u003cb class=\"key\">토마토 \u003c/b>\u003cb class=\"key\">케첩\u003c/b>을 만들어 \u003cb class=\"key\">팔기 \u003c/b>\u003cb class=\"key\">시작했어요\u003c/b>. 하지만 이 케첩은 \u003cb class=\"key\">빨리 \u003c/b>\u003cb class=\"key\">상해서\u003c/b> 오래 두고 먹기 어려웠답니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>하인즈의 해결\u003csmall>해결 · 문장 9–11\u003c/small>\u003c/h4>\u003cp>Henry Heinz가 새로운 토마토 케첩을 \u003cb class=\"key\">만들어 \u003c/b>\u003cb class=\"key\">냈어요\u003c/b>. 그는 \u003cb class=\"key\">식초\u003c/b>와 \u003cb class=\"key\">설탕\u003c/b>을 넣었고, 그 덕분에 케첩이 꼬박 \u003cb class=\"key\">일 \u003c/b>\u003cb class=\"key\">년\u003c/b> 동안 신선하게 유지되었답니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 케첩이 옛날에서 오늘날까지 어떻게 바뀌었는지, 네 단계로 나누어 살펴볼게요.","hl":null},{"n":4,"text":"먼저 첫 번째 문장을 볼까요? 지금 케첩은 토마토로 만들어져요. 그런데 두 번째 문장에서 오래 전에는 아시아에서 온 생선 소스였다고 해요. 같은 이름인데 무엇으로 만드는지가 완전히 달랐던 거예요.","hl":"f0"},{"n":5,"text":"그다음 영국 사람들이 아시아에서 케첩을 맛보았어요. 그들도 그것을 만들고 싶어서 버섯과 생선을 사용했답니다. 그래서 집집마다 조금씩 다른 케첩이 생겼어요.","hl":"f1"},{"n":6,"text":"그러다가 농부들이 토마토 케첩을 만들어 팔기 시작했어요. 그런데 문제가 있었어요. 그들의 토마토 케첩은 빨리 상했거든요. 그래서 오래 두고 먹기가 어려웠답니다.","hl":"f2"},{"n":7,"text":"이때 Henry Heinz가 새로운 토마토 케첩을 만들어 냈어요. 그는 그것에 식초와 설탕을 넣었어요. 그 덕분에 그의 케첩은 꼬박 일 년 동안 신선한 채로 유지되었답니다. 정말 대단하죠?","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">이야기 순서(시간 순서)\u003c/span>\u003cspan class=\"lp-pill\">처음\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 케첩이 \u003cb class=\"key\">옛날\u003c/b>에서 \u003cb class=\"key\">오늘날\u003c/b>로 바뀌어 온 과정을 차례대로 보여 줘요. 그래서 처음 문장에서 오늘의 케첩을 소개하고, 마지막에서 \u003cb class=\"key\">해결\u003c/b> 이야기로 끝난답니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>But (2)\u003c/b>\u003cspan>반대 내용 알려 줌\u003c/span>\u003cb>Then (3)\u003c/b>\u003cspan>순서 알려 줌\u003c/span>\u003cb>So (5)\u003c/b>\u003cspan>이유 뒤의 결과 알려 줌\u003c/span>\u003cb>Later (6)\u003c/b>\u003cspan>시간이 지났음을 알려 줌\u003c/span>\u003cb>But (8)\u003c/b>\u003cspan>반대 내용 알려 줌\u003c/span>\u003cb>Then (9)\u003c/b>\u003cspan>순서 알려 줌\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">fish sauce\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">ketchup\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">tomato ketchup\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a new tomato ketchup\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">His ketchup\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>농부들의 토마토 케첩\u003c/th>\u003cth>Henry Heinz의 토마토 케첩\u003c/th>\u003c/tr>\u003ctr>\u003ctd>식초와 설탕이 없음\u003c/td>\u003ctd>식초와 설탕을 넣음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>빨리 상함\u003c/td>\u003ctd>꼬박 일 년 동안 신선함\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 케첩이 옛날에서 오늘날로 바뀌어 온 과정을 차례대로 보여 주는 이야기 순서 글이에요. 중심 문장은 글의 처음에 나오는 첫 번째 문장이고요. 그래서 처음에 오늘의 케첩을 소개하고, 마지막에는 문제를 해결한 이야기로 끝난답니다.","hl":"ty"},{"n":9,"text":"글을 읽을 때 Then이나 Later 같은 말이 나오면 시간이 흘렀다는 신호예요. But이 나오면 앞 내용과 반대되는 이야기가 나온다는 뜻이고요. 또 같은 케첩을 fish sauce, tomato ketchup, a new tomato ketchup처럼 다르게 부르니까, 무엇을 가리키는 말인지 잘 살펴보세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 단어\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>be made from\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 만들어지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>long ago\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>오래 전에\u003c/span>\u003c/div>\u003cdiv>\u003cb>fish sauce\u003c/b>\u003cem>명사\u003c/em>\u003cspan>생선 소스, 액젓\u003c/span>\u003c/div>\u003cdiv>\u003cb>taste\u003c/b>\u003cem>동사\u003c/em>\u003cspan>맛보다\u003c/span>\u003c/div>\u003cdiv>\u003cb>want to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~하고 싶다\u003c/span>\u003c/div>\u003cdiv>\u003cb>use\u003c/b>\u003cem>동사\u003c/em>\u003cspan>사용하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>mushroom\u003c/b>\u003cem>명사\u003c/em>\u003cspan>버섯\u003c/span>\u003c/div>\u003cdiv>\u003cb>later\u003c/b>\u003cem>부사\u003c/em>\u003cspan>나중에\u003c/span>\u003c/div>\u003cdiv>\u003cb>farmer\u003c/b>\u003cem>명사\u003c/em>\u003cspan>농부\u003c/span>\u003c/div>\u003cdiv>\u003cb>sell\u003c/b>\u003cem>동사\u003c/em>\u003cspan>팔다\u003c/span>\u003c/div>\u003cdiv>\u003cb>go bad\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>상하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>fast\u003c/b>\u003cem>부사\u003c/em>\u003cspan>빨리\u003c/span>\u003c/div>\u003cdiv>\u003cb>create\u003c/b>\u003cem>동사\u003c/em>\u003cspan>만들어 내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>add\u003c/b>\u003cem>동사\u003c/em>\u003cspan>넣다, 더하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>vinegar\u003c/b>\u003cem>명사\u003c/em>\u003cspan>식초\u003c/span>\u003c/div>\u003cdiv>\u003cb>sugar\u003c/b>\u003cem>명사\u003c/em>\u003cspan>설탕\u003c/span>\u003c/div>\u003cdiv>\u003cb>stay\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(상태가) 유지되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>fresh\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>신선한\u003c/span>\u003c/div>\u003cdiv>\u003cb>whole\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>꼬박, 전체의\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"오늘의 단어도 소리 내어 읽어 볼게요. be made from은 무엇으로 만들어지다는 뜻이에요. taste는 맛보다, go bad는 상하다, create는 만들어 내다라는 뜻이죠. add는 넣거나 더한다는 뜻이고, fresh는 신선하다는 뜻이에요. 여러분도 한 번씩 따라 읽어 보세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">create\u003c/b>\u003cspan class=\"m\">만들어 내다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">make\u003c/span>\u003cspan class=\"s\">invent\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">destroy\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">sell\u003c/b>\u003cspan class=\"m\">팔다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">trade\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">buy\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">fresh\u003c/b>\u003cspan class=\"m\">신선한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">new\u003c/span>\u003cspan class=\"s\">clean\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">old\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">later\u003c/b>\u003cspan class=\"m\">나중에\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">after\u003c/span>\u003cspan class=\"s\">soon\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">before\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">add\u003c/b>\u003cspan class=\"m\">넣다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">put in\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">take out\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"비슷한 말과 반대말도 함께 정리해 봐요. create는 make나 invent처럼 비슷하게 쓸 수 있어요. sell은 팔다, buy는 사다라는 뜻이라 서로 반대말이에요. fresh는 new와 비슷하고 old와는 반대예요. later는 나중에라는 뜻이라 before와 반대말이 되고요. add는 put in과 비슷하고 take out과 반대랍니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 11\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">케첩은 만들어집니다\u003c/span>\u003cspan class=\"en\">Ketchup \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">made\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">토마토로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">tomatoes\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">케첩은 토마토로 만들어집니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 케첩의 \u003cb class=\"key\">재료\u003c/b>가 무엇인지 알려 주는 문장이에요. 지금 우리가 먹는 케첩은 \u003cb class=\"key\">토마토\u003c/b>로 만든다는 뜻이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">만들어지다 표현(수동 표현)\u003c/span> : 무엇이(Ketchup) + 만들어져요(is made) + 재료로(from tomatoes) : \"만들어집니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">재료 짝꿍 말(전치사)\u003c/span> : 만들어져요(is made) + 무엇으로(from) + 토마토(tomatoes) : \"토마토로\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Ketchup is made, 케첩은 만들어집니다. from tomatoes, 토마토로. 이 문장 전체를 해석하면, 케첩은 토마토로 만들어집니다.","hl":"m"},{"n":13,"text":"이 문장은 케첩의 재료를 알려 줘요. 지금 우리가 먹는 케첩은 토마토로 만든다는 뜻이에요.","hl":"mn"},{"n":14,"text":"먼저 is made를 봐요. 이건 만들어지다라는 뜻으로 붙어 다니는 한 덩어리예요. 케첩은 우리가 직접 만드는 게 아니라 만들어진 것이죠. 그래서 is made라고 해요. 그리고 재료를 말할 때는 from을 붙여요. 그래서 from tomatoes는 토마토로가 된답니다. 아주 잘 따라왔어요!","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 오래 전에\u003c/span>\u003cspan class=\"en\">But long ago,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">케첩은 이었습니다\u003c/span>\u003cspan class=\"en\">ketchup \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">생선 소스\u003c/span>\u003cspan class=\"en\">fish sauce\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아시아에서 온\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">Asia\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 오래 전에, 케첩은 아시아에서 온 생선 소스였습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 지금과 \u003cb class=\"key\">오래 \u003c/b>\u003cb class=\"key\">전\u003c/b>의 케첩이 어떻게 달랐는지 알려 줘요. 옛날 케첩은 토마토가 아니라 \u003cb class=\"key\">생선 \u003c/b>\u003cb class=\"key\">소스\u003c/b>였어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사 과거형(be동사)\u003c/span> : 무엇이(ketchup) + 이었어요(was) + 무엇(fish sauce) : \"이었습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">어디서 왔는지 알려 주는 말(전치사)\u003c/span> : 무엇이(fish sauce) + 왔어요(from) + 어디서(Asia) : \"아시아에서 온\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"But long ago, 하지만 오래 전에. ketchup was, 케첩은 이었습니다. fish sauce, 생선 소스. from Asia, 아시아에서 온. 이 문장 전체를 해석하면, 하지만 오래 전에, 케첩은 아시아에서 온 생선 소스였습니다.","hl":"m"},{"n":16,"text":"지금은 토마토 케첩이지만 아주 먼 옛날에는 달랐어요. 그때 케첩은 아시아에서 온 생선 소스였어요.","hl":"mn"},{"n":17,"text":"먼저 was를 봐요. 지금 이야기면 is인데, 오래 전 이야기라서 was로 모양이 바뀌었어요. 이렇게 지난 일을 말할 때는 be동사의 과거형을 써요. 그리고 from은 어디서 왔는지 알려 주는 말이에요. from Asia 하면 아시아에서 온이라는 뜻이 되죠. 여러분도 옛날 케첩은 상상이 되나요?","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그때 몇몇 영국 사람들이\u003c/span>\u003cspan class=\"en\">Then \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">some \u003c/span>\u003cspan class=\"tgt\">British \u003c/span>\u003cspan class=\"tgt\">people\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">케첩을 맛보았습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">tasted\u003c/span> ketchup\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아시아에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">Asia\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그때 몇몇 영국 사람들이 아시아에서 케첩을 맛보았습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 영국 사람들이 아시아에서 케첩을 \u003cb class=\"key\">맛보았\u003c/b>다는 이야기예요. 이 일이 뒤에서 토마토 케첩이 생기는 \u003cb class=\"key\">시작\u003c/b>이 돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수량 표현(수량 표현)\u003c/span> : some(몇몇) + British people(영국 사람들) : \"몇몇 영국 사람들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거형(과거형)\u003c/span> : 누가(some British people) + 맛보았어요(tasted) + 무엇을(ketchup) : \"맛보았습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">장소 짝꿍 말(전치사)\u003c/span> : 맛보았어요(tasted) + 어디에서(in) + Asia(아시아) : \"아시아에서\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Then some British people, 그때 몇몇 영국 사람들이. tasted ketchup, 케첩을 맛보았습니다. in Asia, 아시아에서. 이 문장 전체를 해석하면, 그때 몇몇 영국 사람들이 아시아에서 케첩을 맛보았습니다.","hl":"m"},{"n":19,"text":"영국 사람들이 아시아에서 케첩을 처음 맛보았어요. 그래서 케첩에 관심을 갖게 되었죠.","hl":"mn"},{"n":20,"text":"먼저 some을 봐요. some은 몇몇이라는 뜻으로 people 앞에 붙어요. 다음으로 taste는 맛보다라는 뜻인데, 이미 지난 일이라서 뒤에 -ed를 붙여 tasted, 맛보았어요가 되었어요. 마지막으로 넓은 장소 앞에는 in을 써서 in Asia, 아시아에서라고 해요. 오늘도 아주 잘했어요!","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan cl 팔기 시작했다는데 여기서는 안 좋은 일이 생기니 반대 내용을 이어 주는 거예요. 두 번째, went는 go의 과거형이에요. went bad라고 하면 나빠졌다, 상했다는 뜻이 된답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그때 Henry Heinz가 만들었습니다\u003c/span>\u003cspan class=\"en\">Then Henry Heinz \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">created\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새로운 토마토 케첩을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">new \u003c/span>\u003cspan class=\"tgt\">tomato \u003c/span>\u003cspan class=\"tgt\">ketchup\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그때 Henry Heinz가 새로운 토마토 케첩을 만들어 냈습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Henry Heinz가 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">토마토 \u003c/b>\u003cb class=\"key\">케첩\u003c/b>을 만들어 냈다는 말이에요. 앞의 문제를 푸는 \u003cb class=\"key\">해결\u003c/b> 부분이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거형(과거형)\u003c/span> : 만들다(create) + d = created : \"만들어 냈습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">꾸며 주는 말(형용사)\u003c/span> : a + new(새로운) + 명사(ketchup) : \"새로운 토마토 케첩\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Then Henry Heinz created, 그때 Henry Heinz가 만들었습니다. a new tomato ketchup, 새로운 토마토 케첩을. 이 문장 전체를 해석하면, 그때 Henry Heinz가 새로운 토마토 케첩을 만들어 냈습니다.","hl":"m"},{"n":37,"text":"이제 주인공 Henry Heinz가 나와요. 그가 새로운 토마토 케첩을 만들어 내면서 앞에서 생긴 문제를 해결하는 부분이에요.","hl":"mn"},{"n":38,"text":"첫 번째, created는 create에 d를 붙인 과거형이에요. 이미 지난 일이라서 이렇게 말해요. 두 번째, a new tomato ketchup에서 new는 뒤에 오는 케첩을 꾸며 주는 말이에요. 형용사는 명사 바로 앞에 온다는 것, 꼭 기억해요. 여러분도 a new bike처럼 멋지게 말해 봐요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 11\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 첨가했습니다\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">added\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">식초와 설탕을\u003c/span>\u003cspan class=\"en\">vinegar and sugar\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 그것에 식초와 설탕을 첨가했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 하인즈가 자기 케첩에 \u003cb class=\"key\">식초\u003c/b>와 \u003cb class=\"key\">설탕\u003c/b>을 넣었다는 말이에요. 이 두 가지가 케첩을 오래 가게 만든 비밀이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(규칙 과거형)\u003c/span> : 누가(He) + 했어요(added) + 무엇을(vinegar and sugar) : \"첨가했습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소·시간 짝꿍 말(전치사)\u003c/span> : 무엇에(to) + 그것(it) : \"그것에\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"He added, 그는 첨가했습니다. vinegar and sugar, 식초와 설탕을. to it, 그것에. 이 문장 전체를 해석하면, 그는 그것에 식초와 설탕을 첨가했습니다.","hl":"m"},{"n":40,"text":"이 문장은 하인즈가 자기 케첩에 식초와 설탕을 넣었다는 걸 알려 줘요. 바로 이 식초와 설탕이 케첩을 오래 가게 만든 비밀이에요.","hl":"mn"},{"n":41,"text":"첫 번째, added는 add에 ed를 붙인 과거형이에요. 이미 끝난 지난 일이라서 이렇게 말해요. 두 번째, to it은 '그것에'라는 뜻이에요. to는 방향을 알려 주는 전치사랍니다. 여러분도 오늘 저녁에 케첩에 뭘 넣을지 상상해 보세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 케첩은\u003c/span>\u003cspan class=\"en\">His ketchup\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">신선한 채로 유지되었습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">stayed\u003c/span> fresh\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">꼬박 일 년 동안\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">whole \u003c/span>\u003cspan class=\"tgt\">year\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그의 케첩은 꼬박 일 년 동안 신선한 채로 유지되었습니다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 하인즈의 케첩이 꼬박 일 년 동안 \u003cb class=\"key\">신선한 \u003c/b>\u003cb class=\"key\">채로\u003c/b> 있었다는 말이에요. 식초와 설탕 덕분에 케첩이 아주 오래 갔다는 뜻이지요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(규칙 과거형)\u003c/span> : 누가(His ketchup) + 였어요(stayed) + 어떤 상태(fresh) : \"유지되었습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소·시간 짝꿍 말(전치사)\u003c/span> : 얼마 동안(for) + 꼬박 일 년(a whole year) : \"꼬박 일 년 동안\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"His ketchup, 그의 케첩은. stayed fresh, 신선한 채로 유지되었습니다. for a whole year, 꼬박 일 년 동안. 이 문장 전체를 해석하면, 그의 케첩은 꼬박 일 년 동안 신선한 채로 유지되었습니다!","hl":"m"},{"n":43,"text":"이 문장은 하인즈의 케첩이 꼬박 일 년 동안 신선한 채로 있었다는 걸 말해요. 식초와 설탕 덕분에 케첩이 아주 오래 갔다는 뜻이지요.","hl":"mn"},{"n":44,"text":"첫 번째, stayed는 stay에 ed를 붙인 과거형이에요. 케첩이 계속 그 상태로 있었다는 지난 일을 말해 줘요. 두 번째, for a whole year에서 for는 얼마 동안인지 기간을 알려 주는 전치사예요. 여러분이 좋아하는 과자도 이렇게 오래 신선하면 얼마나 좋을까요?","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">문제 해설\u003c/span>\u003cdiv class=\"lp-box\">\u003cspan class=\"lp-big\">내용 일치\u003c/span>\u003cspan class=\"lp-pill\">정답 Henry Heinz는 토마토 케첩에 식초와 설탕을 넣었습니다.\u003c/span>\u003cdiv style=\"margin-top:8px\">글의 마지막 부분을 보면 Henry Heinz가 \u003cb class=\"key\">식초\u003c/b>와 \u003cb class=\"key\">설탕\u003c/b>을 넣었다고 나와요. 그래서 그의 케첩이 꼬박 \u003cb class=\"key\">일 \u003c/b>\u003cb class=\"key\">년\u003c/b> 동안 신선하게 유지되었답니다.\u003c/div>\u003cul style=\"font-size:14.5px;margin:8px 0 0;padding-left:20px\">\u003cli>케첩은 처음부터 토마토로 만든 것이 아니에요. 오래 전에는 생선 소스였어요.\u003c/li>\u003cli>영국 사람들은 버섯과 생선으로 케첩을 만들었어요. 토마토만 쓴 것이 아니에요.\u003c/li>\u003cli>농부들의 토마토 케첩은 빨리 상했어요. 오래 가지 않았어요.\u003c/li>\u003c/ul>\u003c/div>","segs":[{"n":45,"text":"이제 문제를 함께 풀어 볼게요. 글의 내용과 같은 것을 고르는 문제예요. 마지막 부분에서 Henry Heinz가 식초와 설탕을 넣었다는 내용을 찾으면 정답이 보여요. 그래서 정답은 식초와 설탕을 넣었다는 보기예요. 나머지 보기는 옛날 케첩 이야기와 반대되니까 하나씩 확인해 보세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">오늘 배운 내용 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>케첩은 지금 \u003cb class=\"key\">토마토\u003c/b>로 만들지만, 오래 전에는 \u003cb class=\"key\">생선 \u003c/b>\u003cb class=\"key\">소스\u003c/b>였어요.\u003c/li>\u003cli>영국 사람들이 아시아에서 맛보고 \u003cb class=\"key\">버섯\u003c/b>과 생선으로 따라 만들었어요.\u003c/li>\u003cli>농부들의 토마토 케첩은 \u003cb class=\"key\">빨리 \u003c/b>\u003cb class=\"key\">상했어요\u003c/b>.\u003c/li>\u003cli>Henry Heinz가 \u003cb class=\"key\">식초\u003c/b>와 \u003cb class=\"key\">설탕\u003c/b>을 넣어 오래 신선한 케첩을 만들었어요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Ketchup has changed a lot, from fish sauce in Asia to the fresh tomato ketchup we eat today.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">케첩은 오늘날 \u003cb class=\"key\">토마토\u003c/b>로 만들지만, 오래 전에는 아시아에서 온 \u003cb class=\"key\">생선 \u003c/b>\u003cb class=\"key\">소스\u003c/b>였어요. 영국 사람들과 농부들의 여러 가지 시도 끝에, Henry Heinz가 \u003cb class=\"key\">식초\u003c/b>와 \u003cb class=\"key\">설탕\u003c/b>을 넣어 오래 신선하게 유지되는 토마토 케첩을 만들었습니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":46,"text":"오늘 우리는 케첩이 생선 소스에서 토마토 케첩으로, 그리고 오래 신선한 케첩으로 바뀐 이야기를 읽었어요. Then, But, Later 같은 길잡이 말을 찾으면서 읽으니 순서가 아주 잘 보였죠? 여러분 모두 정말 잘했어요. 다음 시간에도 재미있는 이야기로 만나요. 안녕!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
