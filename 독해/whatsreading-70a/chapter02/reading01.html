<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>What's Reading 70 A Ch2 Unit 01 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"What's Reading 70 A Ch2 Unit 01","audioDir":"reading01_audio","preview":false,"count":55,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.923em\">Ch2\u003cbr>Unit\u003cbr>01\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">What's Reading 70 A\u003c/div>\u003ch1>I Like the Sun! What Am I?\u003c/h1>\u003ch2>나는 햇빛이 좋아요! 나는 무엇일까요?\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">한 줄 요약\u003c/span>\u003cspan>햇빛과 \u003cb class=\"key\">따뜻한 \u003c/b>\u003cb class=\"key\">흙\u003c/b>, 적당한 물을 좋아하는 식물이 자기 이야기를 들려줘요. 마지막에 \u003cb class=\"key\">수수께끼\u003c/b>로 물어 보는 주인공은 바로 \u003cb class=\"key\">토마토\u003c/b>예요.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>A tomato tells us what it needs to grow and asks, &quot;What am I?&quot;\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"Hello, everyone! 오늘도 신나는 영어 시간이에요. 오늘은 햇빛을 좋아하는 작은 친구가 자기소개를 한대요. 글을 끝까지 읽으면 이 친구가 무엇인지 알 수 있답니다. 자, 함께 시작해 볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">미리 알면 쉬워요\u003c/span>\u003cdiv class=\"lp-box\">식물도 우리처럼 자라려면 햇빛과 좋은 환경이 필요해요. 영어로 \u003cb class=\"key\">햇빛\u003c/b>은 sunshine, \u003cb class=\"key\">흙\u003c/b>은 soil이라고 해요. 토마토는 \u003cb class=\"key\">씨앗\u003c/b>에서 자라서 처음에는 초록색이지만 익으면 빨간색이 돼요. 우리가 좋아하는 케첩이나 스파게티 소스에 바로 이 토마토가 들어가죠. 화분을 키워 본 친구라면 물을 너무 많이 주면 식물이 힘들어진다는 것도 알 거예요.\u003c/div>","segs":[{"n":2,"text":"우리 교실 창가에 놓인 화분을 떠올려 보세요. 식물이 잘 자라려면 햇빛과 흙과 물이 필요해요. 영어로 햇빛은 sunshine, 흙은 soil, 씨앗은 seed라고 해요. 여러분은 식물에게 가장 중요한 것이 무엇이라고 생각해요? 오늘 주인공은 따뜻한 흙과 적당한 물을 좋아한대요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>햇빛과 흙\u003csmall>시작 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>주인공은 자라기 위해 \u003cb class=\"key\">햇빛\u003c/b>이 필요하다고 말해요. 따뜻한 \u003cb class=\"key\">흙\u003c/b>을 좋아하고, 차가운 흙에서는 자라지 않는다고 해요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>물 조절\u003csmall>이유 · 문장 4–6\u003c/small>\u003c/h4>\u003cp>물이 필요하지만 \u003cb class=\"key\">너무 \u003c/b>\u003cb class=\"key\">많은 \u003c/b>\u003cb class=\"key\">물\u003c/b>은 원하지 않아요. 물이 너무 많으면 \u003cb class=\"key\">약해지기\u003c/b> 때문이에요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>농부의 도움\u003csmall>해결 · 문장 7–8\u003c/small>\u003c/h4>\u003cp>농부들이 맨 아래쪽 \u003cb class=\"key\">잎을 \u003c/b>\u003cb class=\"key\">잘라\u003c/b> 줘요. 그러면 건강하고 \u003cb class=\"key\">튼튼해질\u003c/b> 수 있어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>수수께끼\u003csmall>마무리 · 문장 9–15\u003c/small>\u003c/h4>\u003cp>씨앗에서 자라지만 \u003cb class=\"key\">달지 \u003c/b>\u003cb class=\"key\">않고\u003c/b>, 테니스공처럼 커지고, 나중에는 \u003cb class=\"key\">빨간색\u003c/b>이 돼요. 샐러드와 파스타와 소스에서 찾을 수 있다며 답을 물어요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 따라가 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 주인공이 무엇을 좋아하는지 말해 주는 부분이에요. 첫 번째 문장에서 주인공은 자라기 위해 sunshine, 즉 햇빛이 필요하다고 해요. 그리고 따뜻한 흙을 좋아하고, 차가운 흙에서는 자라지 않는다고 말하죠.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 물 이야기가 나와요. 물이 필요하지만 너무 많은 물은 싫다고 해요. 물이 너무 많으면 약해지기 때문이라니, 적당한 양이 얼마나 중요한지 알 수 있죠.","hl":"f1"},{"n":6,"text":"세 번째 단계에서는 농부들이 나와요. 농부들이 맨 아래쪽 잎을 잘라 주면 주인공이 건강하고 튼튼해진대요. 조금 아파 보여도 결국 도움이 되는 일이에요.","hl":"f2"},{"n":7,"text":"마지막 단계는 수수께끼예요. 씨앗에서 자라지만 달지 않고, 테니스공처럼 커지고, 나중에는 빨간색이 된대요. 샐러드와 파스타와 소스에서 찾을 수 있다고 하니, 여러분은 답이 떠오르죠?","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">수수께끼처럼 자신을 소개하는 설명하는 글\u003c/span>\u003cspan class=\"lp-pill\">처음과 끝\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 자신을 소개하며 답을 맞히는 \u003cb class=\"key\">수수께끼\u003c/b> 글이에요. 첫 문장에서 자라는 데 필요한 것을 말하고, 마지막 문장에서 \u003cb class=\"key\">질문\u003c/b>으로 끝나요. 그래서 처음과 끝이 짝을 이루는 \u003cb class=\"key\">설명하는 \u003c/b>\u003cb class=\"key\">글\u003c/b>이에요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>When (1)\u003c/b>\u003cspan>때를 알려 줌\u003c/span>\u003cb>But (5)\u003c/b>\u003cspan>반대 내용\u003c/span>\u003cb>Then (8)\u003c/b>\u003cspan>다음에 일어나는 일\u003c/span>\u003cb>at first (12)\u003c/b>\u003cspan>처음 상태 알려 줌\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">I\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">my\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">me\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>좋은 조건\u003c/th>\u003cth>나쁜 조건\u003c/th>\u003c/tr>\u003ctr>\u003ctd>따뜻한 흙\u003c/td>\u003ctd>차가운 흙\u003c/td>\u003c/tr>\u003ctr>\u003ctd>적당한 물\u003c/td>\u003ctd>너무 많은 물\u003c/td>\u003c/tr>\u003ctr>\u003ctd>건강하고 튼튼\u003c/td>\u003ctd>약해짐\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 수수께끼처럼 자신을 소개하는 설명하는 글이에요. 첫 번째 문장에서 무엇이 필요한지 알려 주고, 마지막 문장은 답을 묻는 질문으로 끝나요. 그래서 중심 생각은 처음과 끝에 함께 있다고 볼 수 있어요.","hl":"ty"},{"n":9,"text":"길잡이 말도 눈여겨보세요. When은 언제인지 알려 주고, But은 앞 내용과 반대되는 이야기를 해요. Then은 그다음에 일어나는 일을 이어 주고, at first는 처음 상태를 알려 줘요. 그리고 나를 가리키는 말이 I, my, me로 바뀌면서 나오니 잘 따라가 보세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 단어\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>grow\u003c/b>\u003cem>동사\u003c/em>\u003cspan>자라다\u003c/span>\u003c/div>\u003cdiv>\u003cb>sunshine\u003c/b>\u003cem>명사\u003c/em>\u003cspan>햇빛\u003c/span>\u003c/div>\u003cdiv>\u003cb>warm\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>따뜻한\u003c/span>\u003c/div>\u003cdiv>\u003cb>soil\u003c/b>\u003cem>명사\u003c/em>\u003cspan>흙\u003c/span>\u003c/div>\u003cdiv>\u003cb>cold\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>차가운\u003c/span>\u003c/div>\u003cdiv>\u003cb>water\u003c/b>\u003cem>명사\u003c/em>\u003cspan>물\u003c/span>\u003c/div>\u003cdiv>\u003cb>too much\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>너무 많은\u003c/span>\u003c/div>\u003cdiv>\u003cb>weak\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>약한\u003c/span>\u003c/div>\u003cdiv>\u003cb>farmer\u003c/b>\u003cem>명사\u003c/em>\u003cspan>농부\u003c/span>\u003c/div>\u003cdiv>\u003cb>cut off\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>잘라내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>bottom\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>맨 아래쪽의\u003c/span>\u003c/div>\u003cdiv>\u003cb>leaf\u003c/b>\u003cem>명사\u003c/em>\u003cspan>잎\u003c/span>\u003c/div>\u003cdiv>\u003cb>healthy\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>건강한\u003c/span>\u003c/div>\u003cdiv>\u003cb>strong\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>튼튼한\u003c/span>\u003c/div>\u003cdiv>\u003cb>seed\u003c/b>\u003cem>명사\u003c/em>\u003cspan>씨앗\u003c/span>\u003c/div>\u003cdiv>\u003cb>sweet\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>단\u003c/span>\u003c/div>\u003cdiv>\u003cb>tennis ball\u003c/b>\u003cem>명사\u003c/em>\u003cspan>테니스공\u003c/span>\u003c/div>\u003cdiv>\u003cb>at first\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>처음에는\u003c/span>\u003c/div>\u003cdiv>\u003cb>salad\u003c/b>\u003cem>명사\u003c/em>\u003cspan>샐러드\u003c/span>\u003c/div>\u003cdiv>\u003cb>sauce\u003c/b>\u003cem>명사\u003c/em>\u003cspan>소스\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"오늘의 단어도 소리 내어 읽어 볼게요. grow는 자라다, sunshine은 햇빛, soil은 흙이에요. cut off는 잘라내다, healthy는 건강한, seed는 씨앗이라는 뜻이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">grow\u003c/b>\u003cspan class=\"m\">자라다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">get bigger\u003c/span>\u003cspan class=\"s\">develop\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">shrink\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">warm\u003c/b>\u003cspan class=\"m\">따뜻한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">hot\u003c/span>\u003cspan class=\"s\">mild\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">cold\u003c/span>\u003cspan class=\"a\">cool\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">weak\u003c/b>\u003cspan class=\"m\">약한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">not strong\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">strong\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">healthy\u003c/b>\u003cspan class=\"m\">건강한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">well\u003c/span>\u003cspan class=\"s\">fit\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">sick\u003c/span>\u003cspan class=\"a\">ill\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">sweet\u003c/b>\u003cspan class=\"m\">단\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">sugary\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">sour\u003c/span>\u003cspan class=\"a\">bitter\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">big\u003c/b>\u003cspan class=\"m\">큰\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">large\u003c/span>\u003cspan class=\"s\">huge\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">small\u003c/span>\u003cspan class=\"a\">little\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"비슷한 말과 반대말도 함께 익혀 봐요. warm은 따뜻한이고 반대말은 cold, 차가운이에요. weak는 약한이고 반대말은 strong, 튼튼한이에요. sweet는 단이고 반대말은 sour, 신맛이에요. 이렇게 짝으로 외우면 기억에 오래 남아요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 15\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내가 자랄 때,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">grow\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 햇빛이 필요합니다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">need \u003c/span>\u003cspan class=\"tgt\">sunshine.\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">내가 자랄 때, 나는 햇빛이 필요합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 식물이 자라려면 \u003cb class=\"key\">햇빛\u003c/b>이 꼭 필요하다고 말해요. 글 처음에서 \u003cb class=\"key\">필요한 \u003c/b>\u003cb class=\"key\">것\u003c/b>을 하나씩 소개하는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">때를 알려 주는 이어 주는 말(접속사 when)\u003c/span> : when + 누가(I) + 한다(grow) → 내가 자랄 때 : \"내가 자랄 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지금 하는 일 말하기(일반동사 현재형)\u003c/span> : 누가(I) + 한다(need) + 무엇을(sunshine) : \"나는 햇빛이 필요합니다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"When I grow, 내가 자랄 때. I need sunshine, 나는 햇빛이 필요합니다.. 이 문장 전체를 해석하면, 내가 자랄 때, 나는 햇빛이 필요합니다.","hl":"m"},{"n":13,"text":"이 문장은 식물이 자라려면 햇빛이 꼭 필요하다고 말해요. 글의 처음에서 필요한 것을 하나씩 소개하는 역할을 하죠.","hl":"mn"},{"n":14,"text":"먼저 when은 때를 알려 주는 이어 주는 말이에요. 그래서 내가 자랄 때처럼 때를 먼저 콕 집어 주죠. 그리고 need는 필요하다라는 동사예요. 뒤에 sunshine이 와서 무엇이 필요한지 알려 줘요. 여러분도 I need water처럼 써 볼 수 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 좋아합니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">like\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">따뜻한 흙을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">warm \u003c/span>\u003cspan class=\"tgt\">soil\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 따뜻한 흙을 좋아합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 식물이 \u003cb class=\"key\">따뜻한 \u003c/b>\u003cb class=\"key\">흙\u003c/b>을 좋아한다고 말해요. 앞에서 햇빛을 말했고 이제 \u003cb class=\"key\">흙\u003c/b> 이야기로 넘어가요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">좋아하는 것 말하기(like + 목적어)\u003c/span> : 누가(I) + 좋아한다(like) + 무엇을(warm soil) : \"나는 좋아합니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">꾸며 주는 말(형용사)\u003c/span> : 꾸며 주는 말(warm) + 이름 말(soil) : \"따뜻한 흙\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"I like, 나는 좋아합니다. warm soil, 따뜻한 흙을. 이 문장 전체를 해석하면, 나는 따뜻한 흙을 좋아합니다.","hl":"m"},{"n":16,"text":"식물이 따뜻한 흙을 좋아한다고 말해요. 앞에서 햇빛을 말했고, 이제 흙 이야기가 나오는 거예요.","hl":"mn"},{"n":17,"text":"먼저 like 뒤에는 좋아하는 것이 와요. 여기서는 warm soil이 목적어로 와요. 그리고 warm은 형용사예요. soil을 꾸며 주면서 어떤 흙인지 알려 주죠. 여러분도 I like warm milk처럼 말할 수 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">차가운 흙에서,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">In \u003c/span>\u003cspan class=\"tgt\">cold \u003c/span>\u003cspan class=\"tgt\">soil\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 자라지 않을 것입니다.\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">won't \u003c/span>\u003cspan class=\"tgt\">grow\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">차가운 흙에서, 나는 자라지 않을 것입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 흙이 차가우면 이 식물은 \u003cb class=\"key\">자라지 \u003c/b>\u003cb class=\"key\">못한다\u003c/b>고 말해요. 앞 문장과 반대되는 \u003cb class=\"key\">차가운 \u003c/b>\u003cb class=\"key\">흙\u003c/b> 상황을 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">장소를 알려 주는 짝꿍 말(전치사 in)\u003c/span> : in + 장소(cold soil) → 차가운 흙 속에서 : \"차가운 흙에서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">앞으로 안 할 일 말하기(will not + 동사원형)\u003c/span> : 누가(I) + 안 할 것이다(won't) + 한다(grow) : \"자라지 않을 것입니다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"In cold soil, 차가운 흙에서. I won't grow, 나는 자라지 않을 것입니다.. 이 문장 전체를 해석하면, 차가운 흙에서, 나는 자라지 않을 것입니다.","hl":"m"},{"n":19,"text":"흙이 차가우면 이 식물은 자라지 못한다고 해요. 앞에서 따뜻한 흙을 좋아한다고 했으니 반대 상황을 보여 주는 거죠.","hl":"mn"},{"n":20,"text":"먼저 in은 장소를 알려 주는 짝꿍 말이에요. 여기서는 차가운 흙 속이라는 뜻이죠. 그리고 won't는 will not을 줄인 말이에요. 부정을 나타내서 자라지 않을 거예요가 되고, 뒤에는 동사원형 grow가 와요. 아주 잘 따라왔어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 필요해요\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">need\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">물이\u003c/span>\u003cspan class=\"en\">water.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 물이 필요합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 식물이 자라려면 \u003cb class=\"key\">물\u003c/b>이 꼭 필요하다고 말해요. 앞으로 나올 \u003cb class=\"key\">필요한 \u003c/b>\u003cb class=\"key\">것\u003c/b> 이야기의 첫 번째예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">하는 일·상태 말(동사)\u003c/span> : 누가(I) + 필요해요(need) + 무엇이(water) : \"필요해요\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"I need, 나는 필요해요. water, 물이. 이 문장 전체를 해석하면, 나는 물이 필요합니다.","hl":"m"},{"n":22,"text":"식물이 자라려면 물이 꼭 필요하다고 말해요. 앞으로 나올 필요한 것 이야기의 첫 번째예요.","hl":"mn"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만\u003c/span>\u003cspan class=\"en\">But\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 원하지 않아요\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003cspan class=\"tgt\">want\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">너무 많은 물을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">too \u003c/span>\u003cspan class=\"tgt\">much \u003c/span>\u003cspan class=\"tgt\">water\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 나는 너무 많은 물을 원하지 않습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 물은 필요하지만 \u003cb class=\"key\">너무 \u003c/b>\u003cb class=\"key\">많은 \u003c/b>\u003cb class=\"key\">물\u003c/b>은 안 된다고 말해요. But으로 앞 문장과 \u003cb class=\"key\">반대\u003c/b>되는 조건을 붙여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정하는 말(일반동사 부정문)\u003c/span> : 누가(I) + 하지 않아요(don't) + 원해요(want) : \"원하지 않아요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">많은 양 말(수량 표현)\u003c/span> : 너무 많은(too much) + 셀 수 없는 것(water) : \"너무 많은 물\"\u003c/div>\u003c/div>","segs":[{"n":23,"text":"But, 하지만. I don't want, 나는 원하지 않아요. too much water, 너무 많은 물을. 이 문장 전체를 해석하면, 하지만 나는 너무 많은 물을 원하지 않습니다.","hl":"m"},{"n":24,"text":"물은 필요하지만 너무 많은 물은 안 된다고 말해요. But으로 앞 문장과 반대되는 조건을 붙여 줘요.","hl":"mn"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 될 거예요\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">become \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">약하게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">weak\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 약해질 것입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 물이 너무 많으면 \u003cb class=\"key\">약해질 \u003c/b>\u003cb class=\"key\">것\u003c/b>이라고 말해요. 왜 물을 많이 주면 안 되는지 알려 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">미래 말(will + 동사원형)\u003c/span> : 누가(I) + 될 거예요(will become) + 약하게(weak) : \"될 거예요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">보충하는 말(보어)\u003c/span> : 된다(become) + 어떤 상태(weak) : \"약하게 되다\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"I will become, 나는 될 거예요. weak, 약하게. 이 문장 전체를 해석하면, 나는 약해질 것입니다.","hl":"m"},{"n":26,"text":"물이 너무 많으면 약해질 것이라고 말해요. 왜 물을 많이 주면 안 되는지 알려 주는 문장이에요.","hl":"mn"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">농부들은 잘라냅니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Farmers \u003c/span>\u003cspan class=\"tgt\">cut \u003c/span>\u003cspan class=\"tgt\">off\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나의 맨 아래쪽 잎들을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">my \u003c/span>\u003cspan class=\"tgt\">bottom \u003c/span>\u003cspan class=\"tgt\">leaves\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">농부들은 나의 맨 아래쪽 잎들을 잘라냅니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 농부들이 식물의 \u003cb class=\"key\">맨 \u003c/b>\u003cb class=\"key\">아래쪽 \u003c/b>\u003cb class=\"key\">잎\u003c/b>을 잘라 낸다는 뜻이에요. 식물을 \u003cb class=\"key\">돌보는\u003c/b> 방법을 알려 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">여러 명일 때 동사 원형(복수 주어 현재형)\u003c/span> : 농부들(Farmers) + 잘라내다(cut off) : \"농부들은 잘라냅니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">무엇을(목적어)\u003c/span> : 동사(cut off) + 무엇을(my bottom leaves) : \"나의 맨 아래쪽 잎들을\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Farmers cut off, 농부들은 잘라냅니다. my bottom leaves, 나의 맨 아래쪽 잎들을. 이 문장 전체를 해석하면, 농부들은 나의 맨 아래쪽 잎들을 잘라냅니다.","hl":"m"},{"n":28,"text":"이 문장은 농부들이 식물의 맨 아래쪽 잎을 잘라 낸다는 뜻이에요. 식물을 돌보는 방법을 알려 주죠.","hl":"mn"},{"n":29,"text":"첫 번째, Farmers는 여러 명이에요. 그래서 동사에 s를 붙이지 않고 원형을 써요. 두 번째, my bottom leaves는 무엇을 잘라내는지 알려 주는 목적어예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 15\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러면 나는 할 수 있어요\u003c/span>\u003cspan class=\"en\">Then I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">건강해지다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">be\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">healthy \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 튼튼해지다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">strong\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러면 나는 건강하고 튼튼해질 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 그렇게 하면 식물이 \u003cb class=\"key\">건강\u003c/b>하고 \u003cb class=\"key\">튼튼\u003c/b>해질 수 있다는 뜻이에요. 앞 문장의 \u003cb class=\"key\">결과\u003c/b>를 알려 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">도와주는 동사(조동사) can\u003c/span> : 누가(I) + 할 수 있다(can) + 건강해지다(be healthy) : \"건강해질 수 있어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사) and\u003c/span> : 건강한(healthy) + 그리고(and) + 튼튼한(strong) : \"건강하고 튼튼한\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Then I can, 그러면 나는 할 수 있어요. be healthy, 건강해지다. and strong, 그리고 튼튼해지다. 이 문장 전체를 해석하면, 그러면 나는 건강하고 튼튼해질 수 있습니다.","hl":"m"},{"n":31,"text":"이 문장은 식물이 건강하고 튼튼해질 수 있다는 뜻이에요. 앞 문장의 결과를 알려 주죠.","hl":"mn"},{"n":32,"text":"첫 번째, can은 할 수 있다는 뜻으로 동사 앞에 와요. 두 번째, and가 두 가지 상태를 이어 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 자랍니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">grow\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">씨앗에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">seeds\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">과일처럼\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">fruit\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 과일처럼 씨앗에서 자랍니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 식물은 \u003cb class=\"key\">과일\u003c/b>처럼 \u003cb class=\"key\">씨앗\u003c/b>에서 자란다는 뜻이에요. 식물이 어떻게 생겨나는지 알려 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">일반동사 현재형(현재 시제)\u003c/span> : 나는(I) + 자라다(grow) : \"나는 자랍니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소·시간 짝꿍 말(전치사) from\u003c/span> : from + 시작점(seeds) : \"씨앗에서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">처럼(전치사 like)\u003c/span> : like + 명사(a fruit) : \"과일처럼\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"I grow, 나는 자랍니다. from seeds, 씨앗에서. like a fruit, 과일처럼. 이 문장 전체를 해석하면, 나는 과일처럼 씨앗에서 자랍니다.","hl":"m"},{"n":34,"text":"이 문장은 식물이 과일처럼 씨앗에서 자란다는 뜻이에요. 식물이 어떻게 생겨나는지 알려 주죠.","hl":"mn"},{"n":35,"text":"첫 번째, I grow는 현재 사실을 말해요. 두 번째, from은 어디서 시작하는지 알려 줘요. 세 번째, like는 처럼이라는 뜻으로 비교할 때 써요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만\u003c/span>\u003cspan class=\"en\">But\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 ~이 아니에요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I'm \u003c/span>\u003cspan class=\"tgt\">not\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">달콤한\u003c/span>\u003cspan class=\"en\">sweet.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 나는 달지 않습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 내가 과일처럼 씨에서 자라지만 맛은 달지 않다고 말해요. 앞의 '과일처럼 자란다'와 다른 점을 짚어 \u003cb class=\"key\">토마토\u003c/b>의 맛을 알려 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정문(be동사 부정문)\u003c/span> : 나는(I) + 아니다(am not) + 달콤한(sweet) : \"나는 달콤하지 않아요\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"But, 하지만. I'm not, 나는 ~이 아니에요. sweet, 달콤한. 이 문장 전체를 해석하면, 하지만 나는 달지 않습니다.","hl":"m"},{"n":37,"text":"이 문장은 토마토가 과일처럼 자라지만 맛은 달지 않다고 알려 줘요. 앞에서 과일처럼 자란다고 했으니, 다른 점을 콕 짚어 주는 거죠.","hl":"mn"},{"n":38,"text":"여기서는 I'm not을 눈여겨봐요. be동사 뒤에 not을 붙이면 부정문이 돼요. 그래서 '나는 달콤하지 않아요'라는 뜻이 된답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 커질 수 있어요\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">be\u003c/span> big\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">테니스공처럼\u003c/span>\u003cspan class=\"en\">like a tennis ball.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 테니스공처럼 커질 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 내가 테니스공처럼 커질 수 있다고 말해요. 크기가 \u003cb class=\"key\">테니스공\u003c/b>과 비슷하다는 \u003cb class=\"key\">크기\u003c/b> 힌트를 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">할 수 있어요(조동사 can)\u003c/span> : 나는(I) + 커질 수 있어요(can be big) : \"커질 수 있어요\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"I can be big, 나는 커질 수 있어요. like a tennis ball, 테니스공처럼. 이 문장 전체를 해석하면, 나는 테니스공처럼 커질 수 있습니다.","hl":"m"},{"n":40,"text":"이 문장은 내가 테니스공처럼 커질 수 있다고 말해요. 크기가 테니스공과 비슷하다는 힌트를 주는 문장이죠.","hl":"mn"},{"n":41,"text":"can은 ~할 수 있어요라는 가능성을 나타내는 도와주는 동사예요. can 뒤에는 동사원형 be가 와요. 그래서 can be big은 커질 수 있다는 뜻이 된답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 초록색이에요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">am\u003c/span> green\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">처음에는\u003c/span>\u003cspan class=\"en\">at first.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 처음에는 초록색입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 내가 \u003cb class=\"key\">처음\u003c/b>에는 초록색이라고 말해요. 나중에 색이 달라질 수 있다는 것을 짐작하게 하는 \u003cb class=\"key\">색깔\u003c/b> 힌트예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">am·are·is 친구들(be동사)\u003c/span> : 나는(I) + ~입니다(am) + 초록색(green) : \"나는 초록색이에요\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"I am green, 나는 초록색이에요. at first, 처음에는. 이 문장 전체를 해석하면, 나는 처음에는 초록색입니다.","hl":"m"},{"n":43,"text":"이 문장은 내가 처음에는 초록색이라고 말해요. 나중에 색이 달라질 수 있다는 것을 짐작하게 하는 색깔 힌트예요.","hl":"mn"},{"n":44,"text":"I am은 be동사 표현이에요. 내 상태나 색을 말할 때 I 뒤에는 am을 써요. 그래서 '나는 초록색이에요'라는 상태를 나타낸답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 나는\u003c/span>\u003cspan class=\"en\">But I\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">빨간색이 됩니다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">become \u003c/span>\u003cspan class=\"tgt\">red\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 나는 빨간색이 됩니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 처음에 초록색이던 것이 \u003cb class=\"key\">빨간색\u003c/b>으로 \u003cb class=\"key\">변해요\u003c/b>라고 알려 줘요. 앞 문장과 달라지는 모습을 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">상태를 보충하는 말(보어)\u003c/span> : 나는(I) + 된다(become) + 빨간색(red) : \"빨간색이 됩니다\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"But I, 하지만 나는. become red, 빨간색이 됩니다.. 이 문장 전체를 해석하면, 하지만 나는 빨간색이 됩니다.","hl":"m"},{"n":46,"text":"이 문장은 처음에 초록색이던 것이 빨간색으로 변해요라고 알려 줘요. 앞 문장과 달라지는 모습을 보여 주는 거죠.","hl":"mn"},{"n":47,"text":"여기서 become은 '되다'라는 동사예요. become 뒤에 red가 와서 빨간색이라는 상태를 보충해 줘요. 이때 red를 보어라고 해요. 그래서 '빨간색이 됩니다'라는 뜻이 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은 나를 찾을 수 있습니다\u003c/span>\u003cspan class=\"en\">You \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">find\u003c/span> me\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">샐러드, 파스타에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">salad, \u003c/span>\u003cspan class=\"tgt\">pasta, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 소스에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">sauce\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여러분은 샐러드, 파스타, 그리고 소스에서 나를 찾을 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 토마토가 샐러드, 파스타, 소스 같은 \u003cb class=\"key\">음식\u003c/b>에 들어간다고 알려 줘요. 그래서 어디에서든 나를 \u003cb class=\"key\">발견\u003c/b>할 수 있다고 말해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">도와주는 동사(조동사) can\u003c/span> : 여러분은(You) + 할 수 있습니다(can) + 찾다(find) : \"찾을 수 있습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소 짝꿍 말(전치사) in\u003c/span> : in + 장소 = ~ 안에서 : \"샐러드, 파스타, 소스 안에서\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"You can find me, 여러분은 나를 찾을 수 있습니다. in salad, pasta, 샐러드, 파스타에서. and sauce, 그리고 소스에서. 이 문장 전체를 해석하면, 여러분은 샐러드, 파스타, 그리고 소스에서 나를 찾을 수 있습니다.","hl":"m"},{"n":49,"text":"이 문장은 토마토가 샐러드, 파스타, 소스 같은 음식에 들어간다고 알려 줘요. 그래서 어디에서든 나를 발견할 수 있다고 말하는 거죠.","hl":"mn"},{"n":50,"text":"먼저 can은 조동사예요. '할 수 있다'라는 뜻을 더해 주죠. 그리고 in은 전치사로 장소를 나타내요. 그래서 '샐러드, 파스타, 소스 안에서'라는 뜻이 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 15 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 무엇일까요?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">What \u003c/span>\u003cspan class=\"tgt\">am \u003c/span>\u003cspan class=\"tgt\">I?\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 무엇일까요?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 지금까지 말한 특징을 모아 '나는 무엇일까요?'라고 \u003cb class=\"key\">답\u003c/b>을 묻는 \u003cb class=\"key\">마지막 \u003c/b>\u003cb class=\"key\">질문\u003c/b>이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">무엇인지 묻는 말(의문문)\u003c/span> : What + am + I? = 나는 무엇일까요? : \"나는 무엇일까요?\"\u003c/div>\u003c/div>","segs":[{"n":51,"text":"What am I?, 나는 무엇일까요?. 이 문장 전체를 해석하면, 나는 무엇일까요?","hl":"m"},{"n":52,"text":"이 문장은 지금까지 말한 특징을 모아서 '나는 무엇일까요?'라고 답을 묻는 마지막 질문이에요.","hl":"mn"},{"n":53,"text":"여기서 am은 be동사예요. be동사 am이 주어 I 앞으로 가서 '나는 무엇일까요?'라고 물어요. 이렇게 묻는 문장을 의문문이라고 해요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">문제 해설\u003c/span>\u003cdiv class=\"lp-box\">\u003cspan class=\"lp-big\">수수께끼 풀기(무엇일까요)\u003c/span>\u003cspan class=\"lp-pill\">정답 토마토(tomato)\u003c/span>\u003cdiv style=\"margin-top:8px\">글 속 단서를 하나씩 모아 보세요. 처음에는 \u003cb class=\"key\">초록색\u003c/b>이지만 나중에 \u003cb class=\"key\">빨간색\u003c/b>이 되고, \u003cb class=\"key\">샐러드\u003c/b>와 소스에 들어가는 것은 토마토예요.\u003c/div>\u003cul style=\"font-size:14.5px;margin:8px 0 0;padding-left:20px\">\u003cli>사과는 달고 나무에서 열리지만, 이 주인공은 달지 않다고 했어요.\u003c/li>\u003cli>테니스공은 빨간색이 아니고 샐러드에 들어가지도 않아요.\u003c/li>\u003cli>당근은 처음부터 주황색이라서 '처음에는 초록색'이라는 단서와 맞지 않아요.\u003c/li>\u003c/ul>\u003c/div>","segs":[{"n":54,"text":"오늘의 문제는 이 글의 주인공이 무엇인지 맞히는 거예요. 햇빛과 따뜻한 흙과 물을 좋아하고, 처음에는 초록색이지만 나중에 빨간색이 되는 친구를 떠올려 보세요. 샐러드와 파스타와 소스에 들어가는 것으로도 유명하죠. 정답은 토마토, 영어로 tomato예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">오늘 배운 내용 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>식물이 자라려면 \u003cb class=\"key\">햇빛\u003c/b>과 따뜻한 \u003cb class=\"key\">흙\u003c/b>이 필요해요.\u003c/li>\u003cli>\u003cb class=\"key\">물\u003c/b>은 필요하지만 너무 많으면 약해져요.\u003c/li>\u003cli>아래 잎을 잘라 주면 건강하고 튼튼해져요.\u003c/li>\u003cli>이 글의 주인공은 \u003cb class=\"key\">토마토\u003c/b>예요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>A tomato tells us what it needs to grow and asks, &quot;What am I?&quot;\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">햇빛과 \u003cb class=\"key\">따뜻한 \u003c/b>\u003cb class=\"key\">흙\u003c/b>, 적당한 물을 좋아하는 식물이 자기 이야기를 들려줘요. 마지막에 \u003cb class=\"key\">수수께끼\u003c/b>로 물어 보는 주인공은 바로 \u003cb class=\"key\">토마토\u003c/b>예요.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":55,"text":"오늘 우리는 식물이 자라는 데 필요한 햇빛과 흙과 물을 영어로 배웠어요. 물은 적당한 양이 중요하다는 것도 알았고, 수수께끼의 정답이 토마토라는 것도 알아냈죠. 여러분은 단서를 하나씩 모아 답까지 멋지게 찾아냈어요. 정말 잘했어요, 다음 시간에 또 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
