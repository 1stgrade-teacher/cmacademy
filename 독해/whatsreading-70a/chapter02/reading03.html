</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"What's Reading 70 A Ch2 Unit 03","audioDir":"reading03_audio","preview":false,"count":52,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.923em\">Ch2\u003cbr>Unit\u003cbr>03\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">What's Reading 70 A\u003c/div>\u003ch1>The Red Ball Was a Tomato!\u003c/h1>\u003ch2>그 빨간 공은 토마토였어요!\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">한 줄 요약\u003c/span>\u003cspan>아기 토끼가 발견한 \u003cb class=\"key\">빨간 \u003c/b>\u003cb class=\"key\">공\u003c/b>을 엄마가 정원에 던졌고, 그 공은 자라서 \u003cb class=\"key\">토마토\u003c/b>가 되었어요. 엄마는 \u003cb class=\"key\">이유\u003c/b>가 있다며 아기 토끼가 식물과 꽃을 꺾지 못하게 막았어요.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The red ball the baby rabbit found grew into a tomato in the garden.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘도 만나서 반가워요. 오늘은 정원 속의 공이라는 아주 재미있는 이야기를 읽어 볼 거예요. 아기 토끼가 발견한 빨간 공이 마지막에 무엇으로 바뀌는지 함께 찾아봐요. 한 줄로 말하면, 빨간 공이 정원에서 자라 토마토가 되는 이야기예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">미리 알면 쉬워요\u003c/span>\u003cdiv class=\"lp-box\">토마토는 씨앗(seed)에서 자라요. 씨앗을 흙에 심으면 싹이 나고, 꽃이 피고, 그 꽃이 열매로 변해요. 우리가 학교에서 컵에 콩을 심어 싹을 키워 본 것과 같아요. 그런데 토마토가 작고 빨갛게 익으면 꼭 \u003cb class=\"key\">공\u003c/b>처럼 보여요. 그래서 이 이야기에서는 \u003cb class=\"key\">토마토\u003c/b>를 처음에 빨간 공이라고 불렀어요.\u003c/div>","segs":[{"n":2,"text":"여러분은 토마토가 어떻게 자라는지 본 적 있나요? 토마토는 씨앗에서 시작해요. 씨앗을 흙에 심으면 싹이 나고, 꽃이 피고, 그 꽃이 열매로 변해요. 여러분이 학교에서 컵에 콩을 심어 본 것과 똑같아요. 그런데 토마토가 빨갛게 익으면 꼭 공처럼 동글동글 보여요. 그래서 이 이야기에서는 토마토를 처음에 빨간 공이라고 불렀어요. 여러분은 빨간 공이 갑자기 식물이 된다면 어떨 것 같아요?","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>공을 발견하다\u003csmall>시작 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>아기 토끼가 \u003cb class=\"key\">빨간 \u003c/b>\u003cb class=\"key\">공\u003c/b>을 발견하고 집으로 가져갔어요. 하지만 엄마가 그 공을 \u003cb class=\"key\">정원\u003c/b>으로 던져 버렸어요. 엄마는 그냥 던진 게 아니라 생각이 있었어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>이유와 첫 번째 막기\u003csmall>문제 · 문장 4–7\u003c/small>\u003c/h4>\u003cp>엄마는 나에게 \u003cb class=\"key\">이유\u003c/b>가 있단다 하고 말했어요. 며칠 후 아기 토끼가 \u003cb class=\"key\">작은 \u003c/b>\u003cb class=\"key\">식물\u003c/b>을 보고 꺾고 싶어 했어요. 하지만 엄마가 그를 막았어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>꽃도 또 막다\u003csmall>바뀜 · 문장 8–10\u003c/small>\u003c/h4>\u003cp>나중에 그 식물에 \u003cb class=\"key\">꽃\u003c/b>이 피었어요. 아기 토끼는 꽃을 꺾고 싶었지만 엄마가 \u003cb class=\"key\">다시\u003c/b> 막았어요. 아기 토끼는 왜 자꾸 막는지 궁금했을 거예요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>토마토가 되다\u003csmall>해결 · 문장 11–13\u003c/small>\u003c/h4>\u003cp>나중에 꽃은 \u003cb class=\"key\">작은 \u003c/b>\u003cb class=\"key\">열매\u003c/b>로 변했어요. 그 열매는 점점 크고 빨개졌어요. 그 빨간 공의 정체는 바로 \u003cb class=\"key\">토마토\u003c/b>였어요!\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 이야기가 어떤 순서로 흘러가는지 함께 따라가 볼게요.","hl":null},{"n":4,"text":"먼저 아기 토끼가 빨간 공을 발견하고 집으로 가져가요. 그런데 엄마가 그 공을 정원으로 던져 버려요. 아기 토끼는 깜짝 놀랐겠죠?","hl":"f0"},{"n":5,"text":"그때 엄마가 나에게 이유가 있단다 하고 말해요. 며칠 후 아기 토끼가 작은 식물을 보고 꺾고 싶어 하지만 엄마가 막아요. 왜 자꾸 막는지 궁금하지요?","hl":"f1"},{"n":6,"text":"나중에 식물에 꽃이 피어요. 아기 토끼가 꽃을 꺾으려 하자 엄마가 다시 막아요. 여기서 아기 토끼는 조금 속상했을지도 몰라요.","hl":"f2"},{"n":7,"text":"그런데 나중에 꽃이 작은 열매로 변하고, 그 열매가 크고 빨개져요. 알고 보니 그 빨간 공은 바로 토마토였어요! 엄마의 이유가 바로 이것이었어요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">이야기 순서(처음-가운데-끝)\u003c/span>\u003cspan class=\"lp-pill\">끝\u003c/span>\u003cspan class=\"lp-pill\">주제문 13번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 시간이 지나면서 일이 일어난 차례대로 나열돼요. 처음에는 빨간 공이라고만 말하고, 마지막 문장에서 그 정체를 \u003cb class=\"key\">토마토\u003c/b>라고 밝혀요. 그래서 중심 내용이 \u003cb class=\"key\">끝\u003c/b>에 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>But (3)\u003c/b>\u003cspan>앞과 반대되는 일이 생겼음을 알려 줌\u003c/span>\u003cb>Later (8)\u003c/b>\u003cspan>시간이 지났음을 알려 줌\u003c/span>\u003cb>But (10)\u003c/b>\u003cspan>또 막았다는 반대 내용을 알려 줌\u003c/span>\u003cb>turned into (11)\u003c/b>\u003cspan>모습이 바뀌었음을 알려 줌\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">a red ball\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">it\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a small plant\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">flowers\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">small fruits\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a tomato\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 일이 일어난 순서대로 쓰인 이야기예요. 처음에는 빨간 공이라고만 말하고, 마지막 문장에서 그 정체를 토마토라고 밝혀요. 그래서 중심 내용은 글의 끝에 있어요.","hl":"ty"},{"n":9,"text":"길잡이 말을 눈여겨보세요. But은 앞 내용과 반대되는 일이 생겼다고 알려 주고, Later는 시간이 지났다고 알려 줘요. 그리고 같은 대상을 처음에는 빨간 공, 나중에는 토마토라고 다르게 불러요. 이런 말을 따라가면 이야기가 훨씬 잘 보여요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 단어\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>find\u003c/b>\u003cem>동사\u003c/em>\u003cspan>발견하다 (과거형 found)\u003c/span>\u003c/div>\u003cdiv>\u003cb>take\u003c/b>\u003cem>동사\u003c/em>\u003cspan>가져가다 (과거형 took)\u003c/span>\u003c/div>\u003cdiv>\u003cb>home\u003c/b>\u003cem>명사\u003c/em>\u003cspan>집, 집으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>throw\u003c/b>\u003cem>동사\u003c/em>\u003cspan>던지다 (과거형 threw)\u003c/span>\u003c/div>\u003cdiv>\u003cb>garden\u003c/b>\u003cem>명사\u003c/em>\u003cspan>정원\u003c/span>\u003c/div>\u003cdiv>\u003cb>reason\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이유\u003c/span>\u003c/div>\u003cdiv>\u003cb>few\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>몇몇의, 약간의\u003c/span>\u003c/div>\u003cdiv>\u003cb>later\u003c/b>\u003cem>부사\u003c/em>\u003cspan>나중에\u003c/span>\u003c/div>\u003cdiv>\u003cb>plant\u003c/b>\u003cem>명사\u003c/em>\u003cspan>식물\u003c/span>\u003c/div>\u003cdiv>\u003cb>pick\u003c/b>\u003cem>동사\u003c/em>\u003cspan>꺾다, 따다\u003c/span>\u003c/div>\u003cdiv>\u003cb>stop\u003c/b>\u003cem>동사\u003c/em>\u003cspan>막다, 멈추다\u003c/span>\u003c/div>\u003cdiv>\u003cb>flower\u003c/b>\u003cem>명사\u003c/em>\u003cspan>꽃\u003c/span>\u003c/div>\u003cdiv>\u003cb>again\u003c/b>\u003cem>부사\u003c/em>\u003cspan>다시\u003c/span>\u003c/div>\u003cdiv>\u003cb>turn into\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 변하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>fruit\u003c/b>\u003cem>명사\u003c/em>\u003cspan>열매\u003c/span>\u003c/div>\u003cdiv>\u003cb>become\u003c/b>\u003cem>동사\u003c/em>\u003cspan>~이 되다 (과거형 became)\u003c/span>\u003c/div>\u003cdiv>\u003cb>big\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>큰\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"오늘의 단어를 소리 내어 읽어 볼게요. found는 발견했다, threw는 던졌다, reason은 이유라는 뜻이에요. plant는 식물, pick은 꺾다, stop은 막다라는 뜻이고요. 마지막으로 turn into는 변하다라는 뜻이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">found\u003c/b>\u003cspan class=\"m\">발견했다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">saw\u003c/span>\u003cspan class=\"s\">discovered\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">lost\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">stop\u003c/b>\u003cspan class=\"m\">막다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">hold\u003c/span>\u003cspan class=\"s\">end\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">let\u003c/span>\u003cspan class=\"a\">allow\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">pick\u003c/b>\u003cspan class=\"m\">꺾다, 따다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">take\u003c/span>\u003cspan class=\"s\">get\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">plant\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">big\u003c/b>\u003cspan class=\"m\">큰\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">large\u003c/span>\u003cspan class=\"s\">huge\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">small\u003c/span>\u003cspan class=\"a\">little\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">later\u003c/b>\u003cspan class=\"m\">나중에\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">after\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">before\u003c/span>\u003cspan class=\"a\">earlier\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"비슷한 말도 함께 익혀 봐요. found는 saw나 discovered와 비슷하고, 반대말은 lost예요. stop은 hold나 end와 비슷하고 반대말은 let이에요. big은 large나 huge와 비슷하고 반대말은 small이에요. later는 after와 비슷하고 반대말은 before예요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아기 토끼가\u003c/span>\u003cspan class=\"en\">A baby rabbit\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">빨간 공 하나를 발견했습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">found\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">red \u003c/span>\u003cspan class=\"tgt\">ball\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">아기 토끼가 빨간 공 하나를 발견했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아기 토끼가 빨간 공을 발견하면서 이야기가 출발해요. \u003cb class=\"key\">이야기의 \u003c/b>\u003cb class=\"key\">시작\u003c/b>을 알려 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(A baby rabbit) + 했어요(found) + 무엇을(a red ball) : \"발견했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">하나일 때 쓰는 말(단수)\u003c/span> : a + 꾸며 주는 말(red) + 이름 말(ball) : \"빨간 공 하나\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"A baby rabbit, 아기 토끼가. found a red ball, 빨간 공 하나를 발견했습니다. 이 문장 전체를 해석하면, 아기 토끼가 빨간 공 하나를 발견했습니다.","hl":"m"},{"n":13,"text":"아기 토끼가 빨간 공을 발견하면서 이야기가 시작돼요. 바로 이야기의 시작을 알려 주는 문장이죠.","hl":"mn"},{"n":14,"text":"먼저 found를 봐요. 이미 지난 일이라 find가 과거형 found로 바뀌었어요. 이야기는 보통 지난 일을 말하니까 동사를 과거형으로 써요. 그리고 a red ball에서 a는 공이 하나라는 걸 알려 줘요. 하나일 때는 이름 말 앞에 a를 꼭 붙여요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 가져갔어요\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">took\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 집으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">it\u003c/span> home.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 그것을 집으로 가져갔습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 토끼가 그 공을 집으로 가져갔어요. 공을 \u003cb class=\"key\">대신하는 \u003c/b>\u003cb class=\"key\">말\u003c/b> it으로 짧게 다시 말했어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(He) + 가져갔어요(took) + 무엇을(it) : \"가져갔어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">대신하는 말(대명사)\u003c/span> : 공(a red ball) → it : \"그것을\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"He took, 그는 가져갔어요. it home, 그것을 집으로. 이 문장 전체를 해석하면, 그는 그것을 집으로 가져갔습니다.","hl":"m"},{"n":16,"text":"토끼가 그 공을 집으로 가져갔어요. 공을 대신하는 말 it으로 짧게 다시 말한 거예요.","hl":"mn"},{"n":17,"text":"먼저 took은 take의 과거형이에요. 모양이 확 바뀌는 불규칙 동사라서 통째로 외워 두면 좋아요. 그리고 it은 앞에 나온 빨간 공을 대신하는 말이에요. 같은 말을 또 하지 않고 it으로 짧게 받는 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 13\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 그의 엄마는\u003c/span>\u003cspan class=\"en\">But his mother\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 공을 던졌어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">threw\u003c/span> the ball\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정원 안으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">into \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">garden\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 그의 엄마는 그 공을 정원으로 던졌습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 엄마가 그 공을 정원으로 던져 버렸어요. \u003cb class=\"key\">이야기가 \u003c/b>\u003cb class=\"key\">뒤집히는\u003c/b> 장면이라 but으로 이어 줬어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(his mother) + 던졌어요(threw) + 무엇을(the ball) : \"던졌어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소 짝꿍 말(전치사)\u003c/span> : into + 장소(the garden) : \"정원 안으로\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"But his mother, 하지만 그의 엄마는. threw the ball, 그 공을 던졌어요. into the garden, 정원 안으로. 이 문장 전체를 해석하면, 하지만 그의 엄마는 그 공을 정원으로 던졌습니다.","hl":"m"},{"n":19,"text":"엄마가 그 공을 정원으로 던져 버렸어요. 이야기가 뒤집히는 장면이라 but으로 이어 줬어요.","hl":"mn"},{"n":20,"text":"먼저 threw는 throw의 과거형이에요. 이것도 모양이 바뀌는 불규칙 동사라서 통째로 외워요. 그리고 into는 밖에서 안으로 들어가는 움직임을 보여 줘요. 그래서 정원 안으로 던졌다는 뜻이 되죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 말했어요,\u003c/span>\u003cspan class=\"en\">She \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">said\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">&quot;나는 가지고 있단다\u003c/span>\u003cspan class=\"en\">&quot;I \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">have\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이유가.&quot;\u003c/span>\u003cspan class=\"en\">a reason.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 &quot;나에게 이유가 있단다.&quot;라고 말했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 엄마 토끼가 공을 버린 데에는 \u003cb class=\"key\">이유\u003c/b>가 있다고 말하는 장면이에요. 그래서 다음 이야기가 궁금해지는 \u003cb class=\"key\">궁금증\u003c/b> 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 그녀는(She) + 말했어요(said) : \"말했습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재 모습 말(현재형)\u003c/span> : 나는(I) + 가지고 있단다(have) + 이유를(a reason) : \"가지고 있단다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"She said, 그녀는 말했어요. \"I have, \"나는 가지고 있단다. a reason.\", 이유가.\". 이 문장 전체를 해석하면, 그녀는 \"나에게 이유가 있단다.\"라고 말했습니다.","hl":"m"},{"n":22,"text":"엄마 토끼가 공을 정원에 던져 놓고는 나에게는 이유가 있단다 하고 말하는 장면이에요. 그래서 다음 이야기가 궁금해지는 거죠.","hl":"mn"},{"n":23,"text":"먼저 said는 이미 지난 일이라 과거형으로 바뀐 말이에요. 두 번째로 have는 지금 마음속에 이유가 있다는 뜻이라 현재형 그대로 쓴 거예요. 아주 짧은 문장인데도 문법이 두 개나 숨어 있죠?","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">며칠이 지나서,\u003c/span>\u003cspan class=\"en\">A few days later,\u003c/span>\u003c/div>\u003cdiv class= /span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">pick\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">it\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 그것을 꺾고 싶었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아기 토끼가 그 식물을 \u003cb class=\"key\">꺾고 \u003c/b>\u003cb class=\"key\">싶어\u003c/b> 했어요. 그래서 엄마가 말리게 되는 일이 생긴다는 걸 알려 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to + 동사원형(to부정사)\u003c/span> : 그는(He) + 원했어요(wanted) + 꺾기를(to pick) : \"꺾고 싶었습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">대신하는 말(대명사)\u003c/span> : 그것(it) = 앞에 나온 small plant : \"그것을\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"He wanted, 그는 원했어요. to pick it, 그것을 꺾기를.. 이 문장 전체를 해석하면, 그는 그것을 꺾고 싶었습니다.","hl":"m"},{"n":28,"text":"아기 토끼가 그 작은 식물을 꺾고 싶어 했어요. 그래서 엄마가 나서서 말리게 되는 거예요.","hl":"mn"},{"n":29,"text":"하고 싶다는 마음은 want 뒤에 to랑 동사원형을 붙여서 말해요. 그리고 it은 앞에 나온 small plant를 짧게 대신하는 말이에요. 이 문장은 모양이 아주 깔끔해서 그대로 따라 써 보면 실력이 쑥 늘 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 그의 엄마가\u003c/span>\u003cspan class=\"en\">But his mother\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그를 막았습니다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">stopped\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">him\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 그의 엄마가 그를 막았습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아기 토끼가 하려던 일을 엄마가 \u003cb class=\"key\">막았다\u003c/b>는 뜻이에요. 앞에서 '하고 싶었지만'과 이어지도록 \u003cb class=\"key\">But\u003c/b>으로 시작해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(His mother) + 막았다(stopped) + 그를(him) : \"막았습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">대신하는 말(대명사)\u003c/span> : 막았다(stopped) + 그를(him) : \"그를\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"But his mother, 하지만 그의 엄마가. stopped him, 그를 막았습니다.. 이 문장 전체를 해석하면, 하지만 그의 엄마가 그를 막았습니다.","hl":"m"},{"n":31,"text":"아기 토끼가 하려던 일을 엄마가 막았다는 뜻이에요. '하고 싶었지만'과 이어지도록 But으로 시작하죠.","hl":"mn"},{"n":32,"text":"첫 번째, stopped는 이미 지나간 일을 말하는 과거형이에요. 그래서 동사 stop에 -ed를 붙였죠. 두 번째, him은 앞에 나온 the baby rabbit을 짧게 대신하는 대명사예요. '그를'이라고 해석하면 딱 좋아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나중에,\u003c/span>\u003cspan class=\"en\">Later,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아기 토끼는\u003c/span>\u003cspan class=\"en\">the baby rabbit\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">꽃들을 보았습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">saw\u003c/span> flowers\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 식물에서.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">plant\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나중에, 아기 토끼는 그 식물에서 꽃들을 보았습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 시간이 지나 식물에 \u003cb class=\"key\">꽃\u003c/b>이 피었고, 아기 토끼가 그것을 발견했다는 뜻이에요. 이야기가 다음 장면으로 넘어가는 \u003cb class=\"key\">시간\u003c/b>을 알려 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(The baby rabbit) + 보았다(saw) + 무엇을(flowers) : \"보았습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소·시간 짝꿍 말(전치사)\u003c/span> : 꽃들(flowers) + 붙어 있는(on) + 그 식물(the plant) : \"그 식물에서\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"Later, 나중에. the baby rabbit, 아기 토끼는. saw flowers, 꽃들을 보았습니다. on the plant, 그 식물에서.. 이 문장 전체를 해석하면, 나중에, 아기 토끼는 그 식물에서 꽃들을 보았습니다.","hl":"m"},{"n":34,"text":"시간이 지나서 식물에 꽃이 피었고, 아기 토끼가 그 꽃을 보았다는 뜻이에요.","hl":"mn"},{"n":35,"text":"첫 번째, saw는 see의 과거형이에요. 지난 일이라 saw로 모양이 바뀌었죠. 두 번째, on the plant에서 on은 무언가에 붙어 있는 느낌을 주는 전치사예요. 꽃이 식물에 달려 있으니 on을 쓴 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 원했습니다\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">wanted \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들을 꺾기를.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">pick\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">them\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 그것들을 꺾고 싶었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아기 토끼가 예쁜 \u003cb class=\"key\">꽃\u003c/b>을 보고 꺾고 싶은 \u003cb class=\"key\">마음\u003c/b>이 생겼다는 뜻이에요. 그래서 다음 문장에서 엄마가 막는 장면이 이어져요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to + 동사원형(to부정사)\u003c/span> : 누가(He) + 원했다(wanted) + 꺾기를(to pick) : \"꺾고 싶었습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">대신하는 말(대명사)\u003c/span> : 꺾다(pick) + 그것들을(them) : \"그것들을\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"He wanted, 그는 원했습니다. to pick them, 그것들을 꺾기를.. 이 문장 전체를 해석하면, 그는 그것들을 꺾고 싶었습니다.","hl":"m"},{"n":37,"text":"아기 토끼가 꽃을 꺾고 싶어 했다는 뜻이에요. 그래서 다음에 엄마가 나와서 막는 장면이 이어지죠.","hl":"mn"},{"n":38,"text":"첫 번째, wanted to pick은 '꺾고 싶었다'라는 뜻이에요. want 다음에 to와 동사원형이 오면 '하고 싶다'가 되죠. 두 번째, them은 앞에 나온 flowers를 대신하는 대명사예요. 꽃이 여러 개라서 them을 썼어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 그의 엄마가 그를 막았습니다.\u003c/span>\u003cspan class=\"en\">But \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">mother\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">stopped\u003c/span> him again.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 그의 엄마가 그를 다시 막았습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아기 토끼가 또 꽃을 꺾으려 하자 엄마가 \u003cb class=\"key\">다시 \u003c/b>\u003cb class=\"key\">막았다\u003c/b>는 말이에요. 엄마에게는 꼭 \u003cb class=\"key\">이유\u003c/b>가 있다는 걸 알려 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">누구의 것인지 알려 주는 말(소유격)\u003c/span> : his(그의) + mother(엄마) : \"그의 엄마\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(his mother) + 막았어요(stopped) + 그를(him) : \"막았습니다\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"But his mother, 하지만 그의 엄마가. stopped him, 그를 막았습니다.. 이 문장 전체를 해석하면, 하지만 그의 엄마가 그를 다시 막았습니다.","hl":"m"},{"n":40,"text":"이 문장은 아기 토끼가 또 뭔가를 하려고 할 때 엄마가 다시 막았다는 뜻이에요. 엄마에게는 꼭 이유가 있다는 걸 알려 주는 문장이죠.","hl":"mn"},{"n":41,"text":"먼저 stopped를 볼까요. stop에 -ed를 붙여서 '막았다'라는 지난 일을 말하고 있어요. 이렇게 지나간 일을 말할 때 쓰는 모양이 과거형이에요. 그리고 his는 '그의'라는 뜻으로, 누구 엄마인지 알려 주는 소유격이랍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나중에, 그 꽃들은\u003c/span>\u003cspan class=\"en\">Later, \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">flowers\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">변했습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">turned \u003c/span>\u003cspan class=\"tgt\">into\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">작은 열매들로\u003c/span>\u003cspan class=\"en\">small fruits.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나중에, 그 꽃들은 작은 열매들로 변했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 시간이 지나 꽃이 작은 \u003cb class=\"key\">열매\u003c/b>로 \u003cb class=\"key\">변했다\u003c/b>는 말이에요. 엄마가 막은 데에는 \u003cb class=\"key\">이유\u003c/b>가 있었던 거죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">여러 개 이름 말(복수)\u003c/span> : flower(꽃) + s = flowers(꽃들) : \"그 꽃들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">모습이 바뀌는 덩어리 표현(turn into)\u003c/span> : 누가(the flowers) + 변했어요(turned into) + 무엇으로(small fruits) : \"작은 열매들로 변했습니다\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"Later, the flowers, 나중에, 그 꽃들은. turned into, 변했습니다. small fruits, 작은 열매들로. 이 문장 전체를 해석하면, 나중에, 그 꽃들은 작은 열매들로 변했습니다.","hl":"m"},{"n":43,"text":"시간이 지나면서 꽃이 작은 열매로 변했다는 말이에요. 엄마가 막은 데에는 이유가 있었던 거죠.","hl":"mn"},{"n":44,"text":"먼저 the flowers를 보세요. 꽃이 여러 송이라서 -s를 붙인 복수 모양이에요. 그리고 turn into는 '변하다'라는 뜻을 가진 덩어리 표현이에요. 그래서 turned into small fruits는 작은 열매들로 변했다는 뜻이 되죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 작은 열매들은\u003c/span>\u003cspan class=\"en\">The small fruits\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">크게 되었고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">became\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">big \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 빨갛게 되었습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">red\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 작은 열매들은 크고 빨갛게 되었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 작은 열매가 자라서 크고 빨간 \u003cb class=\"key\">열매\u003c/b>가 되었다는 말이에요. 드디어 빨간 공의 정체가 밝혀질 준비가 되었죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(The small fruits) + 되었어요(became) + 크고 빨갛게(big and red) : \"되었습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : big(크고) + and(그리고) + red(빨갛게) : \"크고 빨갛게\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"The small fruits, 그 작은 열매들은. became big, 크게 되었고. and red, 그리고 빨갛게 되었습니다. 이 문장 전체를 해석하면, 그 작은 열매들은 크고 빨갛게 되었습니다.","hl":"m"},{"n":46,"text":"작은 열매가 쑥 자라서 크고 빨간 열매가 되었다는 말이에요. 이제 빨간 공의 정체가 곧 밝혀지겠죠?","hl":"mn"},{"n":47,"text":"먼저 became을 보세요. become은 '~이 되다'라는 뜻인데, 지난 일이라서 과거형 became을 썼어요. 그리고 big and red처럼 두 가지 모습을 말할 때는 and로 이어 줘요. 크고 그리고 빨갛게, 이렇게 한 번에 말하는 거예요. 여러분도 오늘 배운 문장을 소리 내어 세 번만 따라 읽어 볼까요?","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 13\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 빨간 공은\u003c/span>\u003cspan class=\"en\">The red ball\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">토마토였습니다!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was\u003c/span> a tomato!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 빨간 공은 토마토였습니다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 빨간 공이라고 생각했던 것이 사실은 \u003cb class=\"key\">토마토\u003c/b>였다는 \u003cb class=\"key\">반전\u003c/b>을 알려 주는 문장이에요. 앞에서 엄마가 공을 던진 \u003cb class=\"key\">이유\u003c/b>도 여기서 밝혀져요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사(be동사)\u003c/span> : 무엇이(The red ball) + 이었다(was) + 무엇(a tomato) : \"그 빨간 공은 토마토였습니다\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"The red ball, 그 빨간 공은. was a tomato!, 토마토였습니다!. 이 문장 전체를 해석하면, 그 빨간 공은 토마토였습니다!","hl":"m"},{"n":49,"text":"이 문장은 앞에서 빨간 공이라고 생각했던 것이 사실은 토마토였다는 반전을 보여 줘요. 그래서 엄마가 공을 정원에 던진 이유도 이제 이해가 되죠.","hl":"mn"},{"n":50,"text":"먼저, was는 지난 일을 말하는 be동사예요. 그 빨간 공이 지금 토마토인 게 아니라, 지난 이야기 속에서 토마토였기 때문에 과거를 나타내는 was를 써요. 그래서 The red ball was a tomato는 그 빨간 공은 토마토였습니다라고 해석해요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">문제 해설\u003c/span>\u003cdiv class=\"lp-box\">\u003cspan class=\"lp-big\">내용 확인하기\u003c/span>\u003cspan class=\"lp-pill\">정답 a tomato\u003c/span>\u003cdiv style=\"margin-top:8px\">엄마가 공을 \u003cb class=\"key\">정원\u003c/b>에 던진 뒤 그 자리에서 식물이 자랐어요. 꽃이 \u003cb class=\"key\">작은 \u003c/b>\u003cb class=\"key\">열매\u003c/b>로 변하고 크고 빨개졌으니 그 공은 토마토예요. 그래서 마지막 문장에서 \u003cb class=\"key\">토마토\u003c/b>라고 답이 나와요.\u003c/div>\u003cul style=\"font-size:14.5px;margin:8px 0 0;padding-left:20px\">\u003cli>엄마가 공을 버렸다는 답은 틀렸어요. 엄마는 공을 정원에 던졌을 뿐이에요.\u003c/li>\u003cli>아기 토끼가 꽃을 꺾었다는 답은 틀렸어요. 엄마가 계속 막았거든요.\u003c/li>\u003c/ul>\u003c/div>","segs":[{"n":51,"text":"이제 문제를 함께 풀어 볼게요. 질문은 빨간 공의 정체가 무엇이었냐는 거예요. 엄마가 공을 정원에 던진 뒤 그 자리에서 식물이 자랐고, 꽃이 작은 열매로 변했어요. 그 열매가 크고 빨개졌으니 정답은 바로 토마토예요. 엄마가 공을 버렸다는 보기는 틀렸어요. 엄마는 정원에 던졌을 뿐이니까요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">오늘 배운 내용 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>아기 토끼가 \u003cb class=\"key\">빨간 \u003c/b>\u003cb class=\"key\">공\u003c/b>을 발견했지만 엄마가 그 공을 \u003cb class=\"key\">정원\u003c/b>에 던졌어요.\u003c/li>\u003cli>엄마는 \u003cb class=\"key\">이유\u003c/b>가 있다며 식물과 꽃을 꺾지 못하게 막았어요.\u003c/li>\u003cli>꽃이 \u003cb class=\"key\">작은 \u003c/b>\u003cb class=\"key\">열매\u003c/b>로 변하고 그 열매가 크고 빨개졌어요.\u003c/li>\u003cli>그 빨간 공의 정체는 바로 \u003cb class=\"key\">토마토\u003c/b>였어요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The red ball the baby rabbit found grew into a tomato in the garden.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">아기 토끼가 발견한 \u003cb class=\"key\">빨간 \u003c/b>\u003cb class=\"key\">공\u003c/b>을 엄마가 정원에 던졌고, 그 공은 자라서 \u003cb class=\"key\">토마토\u003c/b>가 되었어요. 엄마는 \u003cb class=\"key\">이유\u003c/b>가 있다며 아기 토끼가 식물과 꽃을 꺾지 못하게 막았어요.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":52,"text":"오늘 우리는 빨간 공이 토마토가 되는 이야기를 읽었어요. Later와 But 같은 길잡이 말을 따라가며 읽는 방법도 배웠지요. 여러분은 마지막 반전을 잘 찾아냈어요, 정말 멋져요. 다음 시간에도 재미있는 이야기로 만나요, 안녕!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
