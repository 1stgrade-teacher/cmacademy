정답은 25명예요.","hl":"q2","rv":"q2"},{"n":119,"text":"네 번째 문제. 마을 사람들은 왜 매년 의식을 열었나요? 첫 번째, 신들을 기쁘게 하려고. 두 번째, 아이를 찾으려고. 세 번째, 화산을 끄려고","hl":"q3"},{"n":120,"text":"정답은 신들을 기쁘게 하려고예요.","hl":"q3","rv":"q3"}]},{"html":"\u003cspan class=\"lp-tag\">이야기 요약하기\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-bank\">\u003cspan>25\u003c/span>\u003cspan>ceremonies\u003c/span>\u003cspan>promise\u003c/span>\u003c/div>\u003cdiv class=\"k-sum\" data-hl=\"sm\">A princess and her husband had \u003cspan class=\"k-ans\" data-rv=\"sm\">25\u003c/span> children. But they broke their \u003cspan class=\"k-ans\" data-rv=\"sm\">promise\u003c/span> to the gods, so the volcano blew up. After that, villagers hold \u003cspan class=\"k-ans\" data-rv=\"sm\">ceremonies\u003c/span> every year to please the gods.\u003c/div>\u003cdiv class=\"k-sk\">한 공주와 그녀의 남편은 아이 스물다섯 명을 낳았어요. 하지만 신들과의 약속을 어겨서 화산이 폭발했어요. 그 후로 마을 사람들은 신들을 기쁘게 하려고 매년 의식을 열어요.\u003c/div>\u003c/div>","segs":[{"n":121,"text":"마지막으로 오늘 이야기를 세 문장으로 정리해 볼게요. 빈칸에 들어갈 낱말을 하나씩 떠올려 보세요.","hl":null},{"n":122,"text":"A princess and her husband had 25 children. But they broke their promise to the gods, so the volcano blew up. After that, villagers hold ceremonies every year to please the gods.","hl":"sm","rv":"sm","v":"n"},{"n":123,"text":"한 공주와 그녀의 남편은 아이 스물다섯 명을 낳았어요. 하지만 신들과의 약속을 어겨서 화산이 폭발했어요. 그 후로 마을 사람들은 신들을 기쁘게 하려고 매년 의식을 열어요.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>Fire: Hot Volcano 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":124,"text":"여러분, 오늘 화산 신 이야기를 아주 잘 읽었어요! 어려운 낱말과 문법도 포기하지 않고 끝까지 해냈어요. 다음 시간에도 재미있는 이야기로 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
