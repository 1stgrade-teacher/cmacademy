text":"정답은 곧 나아졌다예요.","hl":"q3","rv":"q3"}]},{"html":"\u003cspan class=\"lp-tag\">이야기 요약하기\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-bank\">\u003cspan>doctor\u003c/span>\u003cspan>felt better\u003c/span>\u003cspan>medicine\u003c/span>\u003c/div>\u003cdiv class=\"k-sum\" data-hl=\"sm\">Long ago, a \u003cspan class=\"k-ans\" data-rv=\"sm\">doctor\u003c/span> in the Han Dynasty wanted to help hungry and sick people. He boiled meat soup with \u003cspan class=\"k-ans\" data-rv=\"sm\">medicine\u003c/span> and made dumplings. Everyone ate a bowl of the soup and soon \u003cspan class=\"k-ans\" data-rv=\"sm\">felt better\u003c/span>, and he gave it out until Chinese New Year's Eve.\u003c/div>\u003cdiv class=\"k-sk\">오래전 동한 시대에 한 의사가 배고프고 아픈 사람들을 도우려고 약이 든 고깃국에 만두를 넣어 끓였어요. 모두 그 국 한 그릇을 먹고 곧 나아졌고, 그는 설 전날까지 그것을 나눠 주었어요.\u003c/div>\u003c/div>","segs":[{"n":115,"text":"마지막으로 이야기를 짧게 정리해 볼게요. 한 의사가 약이 든 고깃국에 만두를 넣어 끓였고, 사람들이 그 국을 먹고 곧 나아졌다는 이야기였어요.","hl":null},{"n":116,"text":"Long ago, a doctor in the Han Dynasty wanted to help hungry and sick people. He boiled meat soup with medicine and made dumplings. Everyone ate a bowl of the soup and soon felt better, and he gave it out until Chinese New Year's Eve.","hl":"sm","rv":"sm","v":"n"},{"n":117,"text":"오래전 동한 시대에 한 의사가 배고프고 아픈 사람들을 도우려고 약이 든 고깃국에 만두를 넣어 끓였어요. 모두 그 국 한 그릇을 먹고 곧 나아졌고, 그는 설 전날까지 그것을 나눠 주었어요.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>A Bowl of Dumpling Soup 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":118,"text":"여러분, 오늘 아주 멋졌어요! 만둣국 한 그릇에 담긴 따뜻한 마음과 역사 이야기를 잘 이해했네요. 다음에도 재미있는 이야기로 만나요. 수고했어요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
