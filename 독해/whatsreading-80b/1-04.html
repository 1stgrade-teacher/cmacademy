/span>, so the scenery is \u003cspan class=\"k-ans\" data-rv=\"sm\">beautiful\u003c/span>. Also, birds \u003cspan class=\"k-ans\" data-rv=\"sm\">sing\u003c/span> beautifully, so people feel \u003cspan class=\"k-ans\" data-rv=\"sm\">happy\u003c/span>.\u003c/div>\u003cdiv class=\"k-sk\">대답은 '맞다'입니다! 새가 많은 도시에는 나무가 많아서 풍경이 아름답습니다. 또 새들이 아름답게 지저귀어서 사람들은 행복을 느낍니다.\u003c/div>\u003c/div>","segs":[{"n":126,"text":"마지막으로 오늘 이야기를 세 문장으로 정리해 볼게요. 새가 많은 도시는 나무가 많아 풍경이 아름답고, 새의 노래 덕분에 사람들이 행복해진다는 내용이었어요.","hl":null},{"n":127,"text":"The answer is yes! Towns with many birds have many trees, so the scenery is beautiful. Also, birds sing beautifully, so people feel happy.","hl":"sm","rv":"sm","v":"n"},{"n":128,"text":"대답은 '맞다'입니다! 새가 많은 도시에는 나무가 많아서 풍경이 아름답습니다. 또 새들이 아름답게 지저귀어서 사람들은 행복을 느낍니다.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>A Happy Town 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":129,"text":"오늘 여러분은 새와 사람이 함께 행복해지는 이야기를 멋지게 읽었어요. 집 근처에서 새소리가 들리면 오늘 배운 문장을 떠올려 보세요. 정말 잘했어요, 다음 시간에 또 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
