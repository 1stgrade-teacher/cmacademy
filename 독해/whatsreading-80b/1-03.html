{"n":126,"text":"정답은 가족이 있어서예요.","hl":"q3","rv":"q3"}]},{"html":"\u003cspan class=\"lp-tag\">이야기 요약하기\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-bank\">\u003cspan>children\u003c/span>\u003cspan>family\u003c/span>\u003cspan>poor\u003c/span>\u003cspan>young couple\u003c/span>\u003c/div>\u003cdiv class=\"k-sum\" data-hl=\"sm\">A \u003cspan class=\"k-ans\" data-rv=\"sm\">young couple\u003c/span> looked for the happiest couple. A rich couple and a couple with many \u003cspan class=\"k-ans\" data-rv=\"sm\">children\u003c/span> were not happy. A \u003cspan class=\"k-ans\" data-rv=\"sm\">poor\u003c/span> family was happy because they had \u003cspan class=\"k-ans\" data-rv=\"sm\">family\u003c/span>.\u003c/div>\u003cdiv class=\"k-sk\">한 젊은 부부가 가장 행복한 부부를 찾았어요. 부자 부부와 자녀가 많은 부부는 행복하지 않았어요. 가난한 가족은 가족이 있어서 행복했어요.\u003c/div>\u003c/div>","segs":[{"n":127,"text":"마지막으로 이야기를 짧게 요약해 볼게요. 빈칸에 들어갈 낱말을 생각하며 다시 읽어 보세요.","hl":null},{"n":128,"text":"A young couple looked for the happiest couple. A rich couple and a couple with many children were not happy. A poor family was happy because they had family.","hl":"sm","rv":"sm","v":"n"},{"n":129,"text":"한 젊은 부부가 가장 행복한 부부를 찾았어요. 부자 부부와 자녀가 많은 부부는 행복하지 않았어요. 가난한 가족은 가족이 있어서 행복했어요.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>A Happy Couple 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":130,"text":"여러분, 오늘 이야기에서 진짜 행복은 돈이나 자식의 수가 아니라 가족과 함께하는 마음에 있다는 것을 배웠어요. 끝까지 잘 읽고 문제도 멋지게 풀었어요. 다음 시간에 또 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
