v>\u003c/div>","segs":[{"n":101,"text":"첫 번째 문단에서는 전기가 나가서 집이 어두워졌고, 나는 무서웠지만 형은 침착했어요. 두 번째 문단에서는 형이 연료를 태워 에너지를 얻는데 우리가 신경을 쓰지 않으면 미래에 연료가 부족할 거라고 말해요. 세 번째 문단에서는 에너지 덕분에 따뜻하게 지낸다는 걸 알고 내가 더 조심하기로 결심해요. 네 번째 문단에서는 불을 끄고 스웨터를 입는 작은 실천을 소개해요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">문법을 그림으로\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-gt\">\u003cspan>🔮\u003c/span>앞으로 ~할 거예요 will\u003c/div>\u003cdiv data-hl=\"gb\">\u003cdiv class=\"gblk\">\u003cdiv class=\"gb r-who\">\u003cspan class=\"gt\">누가\u003c/span>\u003cspan class=\"ge\">We\u003c/span>\u003cspan class=\"gk\">우리는\u003c/span>\u003c/div>\u003cdiv class=\"gb r-not\">\u003cspan class=\"gt\">아니에요\u003c/span>\u003cspan class=\"ge\">won't\u003c/span>\u003cspan class=\"gk\">앞으로 ~하지 않을 거예요\u003c/span>\u003c/div>\u003cdiv class=\"gb r-do\">\u003cspan class=\"gt\">~해요\u003c/span>\u003cspan class=\"ge\">have\u003c/span>\u003cspan class=\"gk\">가지다\u003c/span>\u003c/div>\u003cdiv class=\"gb r-what\">\u003cspan class=\"gt\">무엇을\u003c/span>\u003cspan class=\"ge\">enough fuel\u003c/span>\u003cspan class=\"gk\">충분한 연료를\u003c/span>\u003c/div>\u003cdiv class=\"gb r-when\">\u003cspan class=\"gt\">언제\u003c/span>\u003cspan class=\"ge\">in the future\u003c/span>\u003cspan class=\"gk\">미래에\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cdiv data-hl=\"gp\">\u003cdiv class=\"gpic\">\u003cdiv class=\"gpt\">will과 won't\u003c/div>\u003cdiv class=\"gpr\">\u003cdiv class=\"gpi\">\u003cdiv class=\"pe\">✅\u003c/div>\u003cdiv class=\"pn\">We will have fuel.\u003c/div>\u003cdiv class=\"pk\">연료가 있을 거예요\u003c/div>\u003cspan class=\"mk o\">O\u003c/span>\u003c/div>\u003cdiv class=\"gpi\">\u003cdiv class=\"pe\">❌\u003c/div>\u003cdiv class=\"pn\">We won't have fuel.\u003c/div>\u003cdiv class=\"pk\">연료가 없을 거예요\u003c/div>\u003cspan class=\"mk x\">X\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"k-ez\" data-hl=\"ge\">앞으로 어떻게 될지 말할 때는 동사 앞에 will을 붙여요. 'will not'은 짧게 won't가 돼요. 그래서 '우리는 미래에 연료가 충분하지 않을 거예요'는 \u003cb class=\"key\">won't \u003c/b>\u003cb class=\"key\">have\u003c/b>라고 말해요.\u003c/div>\u003c/div>","segs":[{"n":102,"text":"첫 번째 문법은 will이에요. will은 '앞으로 ~할 거예요'라는 뜻으로 동사 앞에 붙어요. 대표 문장을 덩어리로 나눠 볼까요? We는 '우리는', won't는 '앞으로 ~하지 않을 거예요', have는 '가지다', enough fuel은 '충분한 연료를', in the future는 '미래에'라는 뜻이에요. won't는 will not을 짧게 줄인 말이에요. 그래서 이 문장은 '우리는 미래에 충분한 연료를 가지지 않을 거예요'가 된답니다.","hl":"gb"},{"n":103,"text":"앞으로 어떻게 될지 말할 때는 동사 앞에 will을 붙여요. 'will not'은 짧게 won't가 돼요. 그래서 '우리는 미래에 연료가 충분하지 않을 거예요'는 won't have라고 말해요.","hl":"ge"}]},{"html":"\u003cspan class=\"lp-tag\">확인해요\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-gt\">\u003cspan>🔮\u003c/span>앞으로 ~할 거예요 will\u003c/div>\u003cdiv class=\"k-ex\" data-hl=\"gx\">\u003cdiv>\u003cspan class=\"e\">🤝\u003c/span>\u003cb>I will help you.\u003c/b>\u003csmall>내가 너를 도와줄게요.\u003c/small>\u003c/div>\u003cdiv>\u003cspan class=\"e\">☀️\u003c/span>\u003cb>It won't rain today.\u003c/b>\u003csmall>오늘은 비가 오지 않을 거예요.\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"k-ck\" data-hl=\"gc\">\u003cdiv class=\"q\">We \u003cspan class=\"k-ans\" data-rv=\"gc\">won't\u003c/span> have enough fuel.\u003c/div>\u003csmall>우리는 연료가 충분하지 않을 거예요.\u003c/small>\u003cdiv class=\"o\">\u003cspan>will\u003c/span>\u003cspan class=\"k-right\" data-rv=\"gc\">won't\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":104,"text":"예문을 더 볼까요?","hl":"gx"},{"n":105,"text":"I will help you.","hl":"gx","v":"n","pause":600},{"n":106,"text":"내가 너를 도와줄게요.","hl":"gx"},{"n":107,"text":"It won't rain today.","hl":"gx","v":"n","pause":600},{"n":108,"text":"오늘은 비가 오지 않을 거예요.","hl":"gx"},{"n":109,"text":"문제를 풀어 볼까요? We 빈칸 have enough fuel. 빈칸에 들어갈 말은 will, 아니면 won't 중에서 무엇일까요?","hl":"gc"},{"n":110,"text":"정답은 won't! We won't have enough fuel.","hl":"gc","rv":"gc"}]},{"html":"\u003cspan class=\"lp-tag\">문법을 그림으로\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-gt\">\u003cspan>⏰\u003c/span>~할 때 when\u003c/div>\u003cdiv data-hl=\"gb\">\u003cdiv class=\"gblk\">\u003cdiv class=\"gb r-who\">\u003cspan class=\"gt\">누가\u003c/span>\u003cspan class=\"ge\">I\u003c/span>\u003cspan class=\"gk\">나는\u003c/span>\u003c/div>\u003cdiv class=\"gb r-do\">\u003cspan class=\"gt\">~해요\u003c/span>\u003cspan class=\"ge\">put on\u003c/span>\u003cspan class=\"gk\">입어요\u003c/span>\u003c/div>\u003cdiv class=\"gb r-what\">\u003cspan class=\"gt\">무엇을\u003c/span>\u003cspan class=\"ge\">a sweater\u003c/span>\u003cspan class=\"gk\">스웨터를\u003c/span>\u003c/div>\u003cdiv class=\"gb r-when\">\u003cspan class=\"gt\">언제\u003c/span>\u003cspan class=\"ge\">when\u003c/span>\u003cspan class=\"gk\">~할 때\u003c/span>\u003c/div>\u003cdiv class=\"gb r-extra\">\u003cspan class=\"gt\">더하기\u003c/span>\u003cspan class=\"ge\">it's cold\u003c/span>\u003cspan class=\"gk\">추울 때\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cdiv data-hl=\"gp\">\u003cdiv class=\"gpic\">\u003cdiv class=\"gpt\">when ~할 때\u003c/div>\u003cdiv class=\"gpr\">\u003cdiv class=\"gpi\">\u003cdiv class=\"pe\">🥶\u003c/div>\u003cdiv class=\"pn\">when it's cold\u003c/div>\u003cdiv class=\"pk\">추울 때 → 스웨터\u003c/div>\u003c/div>\u003cdiv class=\"gpi\">\u003cdiv class=\"pe\">🥵\u003c/div>\u003cdiv class=\"pn\">when it's hot\u003c/div>\u003cdiv class=\"pk\">더울 때 → 반팔\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"k-ez\" data-hl=\"ge\">when은 '~할 때'라는 뜻이에요. 언제 그 일을 하는지 알려 줄 때 문장 뒤에 when을 붙여요. 그래서 '추울 때 나는 스웨터를 입어요'는 \u003cb class=\"key\">when \u003c/b>\u003cb class=\"key\">it's \u003c/b>\u003cb class=\"key\">cold\u003c/b>라고 해요.\u003c/div>\u003c/div>","segs":[{"n":111,"text":"두 번째 문법은 when이에요. when은 '~할 때'라는 뜻으로, 언제 그 일을 하는지 알려 줘요. 대표 문장을 덩어리로 나눠 볼까요? I는 '나는', put on은 '입어요', a sweater는 '스웨터를', when은 '~할 때', it's cold는 '추울 때'라는 뜻이에요. 그래서 '추울 때 나는 스웨터를 입어요'라는 문장이 되는 거예요. 여러분도 when을 써서 '내가 심심할 때'를 영어로 말해 볼까요?","hl":"gb"},{"n":112,"text":"when은 '~할 때'라는 뜻이에요. 언제 그 일을 하는지 알려 줄 때 문장 뒤에 when을 붙여요. 그래서 '추울 때 나는 스웨터를 입어요'는 when it's cold라고 해요.","hl":"ge"}]},{"html":"\u003cspan class=\"lp-tag\">확인해요\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-gt\">\u003cspan>⏰\u003c/span>~할 때 when\u003c/div>\u003cdiv class=\"k-ex\" data-hl=\"gx\">\u003cdiv>\u003cspan class=\"e\">📖\u003c/span>\u003cb>I read a book when I'm bored.\u003c/b>\u003csmall>심심할 때 나는 책을 읽어요.\u003c/small>\u003c/div>\u003cdiv>\u003cspan class=\"e\">🧼\u003c/span>\u003cb>Wash your hands when you eat.\u003c/b>\u003csmall>먹을 때 손을 씻어요.\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"k-ck\" data-hl=\"gc\">\u003cdiv class=\"q\">I turn off the light \u003cspan class=\"k-ans\" data-rv=\"gc\">when\u003c/span> I leave the room.\u003c/div>\u003csmall>방을 나갈 때 불을 꺼요.\u003c/small>\u003cdiv class=\"o\">\u003cspan class=\"k-right\" data-rv=\"gc\">when\u003c/span>\u003cspan>what\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":113,"text":"예문을 더 볼까요?","hl":"gx"},{"n":114,"text":"I read a book when I'm bored.","hl":"gx","v":"n","pause":600},{"n":115,"text":"심심할 때 나는 책을 읽어요.","hl":"gx"},{"n":116,"text":"Wash your hands when you eat.","hl":"gx","v":"n","pause":600},{"n":117,"text":"먹을 때 손을 씻어요.","hl":"gx"},{"n":118,"text":"문제를 풀어 볼까요? I turn off the light 빈칸 I leave the room. 빈칸에 들어갈 말은 when, 아니면 what 중에서 무엇일까요?","hl":"gc"},{"n":119,"text":"정답은 when! I turn off the light when I leave the room.","hl":"gc","rv":"gc"}]},{"html":"\u003cspan class=\"lp-tag\">내용 확인 문제\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-qq\" data-hl=\"q0\">\u003ci>1\u003c/i>\u003cdiv>\u003cdiv class=\"q\">전기가 나갔을 때 나는 침착했어요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q0\">X\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q1\">\u003ci>2\u003c/i>\u003cdiv>\u003cdiv class=\"q\">Bobby는 미래에 연료가 충분하지 않을 거라고 말했어요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q1\">O\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q2\">\u003ci>3\u003c/i>\u003cdiv>\u003cdiv class=\"q\">에너지 덕분에 할 수 있는 일이 아닌 것은 무엇인가요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 따뜻한 집에서 지내기\u003c/span>\u003cspan>② 컴퓨터 게임 하기\u003c/span>\u003cspan>③ 연료를 태우지 않고 사는 것\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q2\">연료를 태우지 않고 사는 것\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q3\">\u003ci>4\u003c/i>\u003cdiv>\u003cdiv class=\"q\">나는 에너지를 아끼기 위해 무엇을 하나요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 불을 켜고 스웨터를 벗어요\u003c/span>\u003cspan>② 불을 끄고 추울 때 스웨터를 입어요\u003c/span>\u003cspan>③ 컴퓨터 게임을 더 많이 해요\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q3\">불을 끄고 추울 때 스웨터를 입어요\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":120,"text":"이제 문제를 풀어 볼까요? 답을 고르기 전에 지문에서 근거가 되는 문장을 먼저 찾아보세요.","hl":null},{"n":121,"text":"첫 번째 문제. 전기가 나갔을 때 나는 침착했어요. 맞으면 O, 틀리면 X예요.","hl":"q0"},{"n":122,"text":"정답은 X, 틀려요.","hl":"q0","rv":"q0"},{"n":123,"text":"두 번째 문제. Bobby는 미래에 연료가 충분하지 않을 거라고 말했어요. 맞으면 O, 틀리면 X예요.","hl":"q1"},{"n":124,"text":"정답은 O, 맞아요.","hl":"q1","rv":"q1"},{"n":125,"text":"세 번째 문제. 에너지 덕분에 할 수 있는 일이 아닌 것은 무엇인가요? 첫 번째, 따뜻한 집에서 지내기. 두 번째, 컴퓨터 게임 하기. 세 번째, 연료를 태우지 않고 사는 것","hl":"q2"},{"n":126,"text":"정답은 연료를 태우지 않고 사는 것예요.","hl":"q2","rv":"q2"},{"n":127,"text":"네 번째 문제. 나는 에너지를 아끼기 위해 무엇을 하나요? 첫 번째, 불을 켜고 스웨터를 벗어요. 두 번째, 불을 끄고 추울 때 스웨터를 입어요. 세 번째, 컴퓨터 게임을 더 많이 해요","hl":"q3"},{"n":128,"text":"정답은 불을 끄고 추울 때 스웨터를 입어요예요.","hl":"q3","rv":"q3"}]},{"html":"\u003cspan class=\"lp-tag\">이야기 요약하기\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-bank\">\u003cspan>energy\u003c/span>\u003cspan>fuel\u003c/span>\u003cspan>power\u003c/span>\u003cspan>save\u003c/span>\u003c/div>\u003cdiv class=\"k-sum\" data-hl=\"sm\">One night, the \u003cspan class=\"k-ans\" data-rv=\"sm\">power\u003c/span> went out and I was scared. Bobby said we use too much \u003cspan class=\"k-ans\" data-rv=\"sm\">energy\u003c/span> and won't have enough \u003cspan class=\"k-ans\" data-rv=\"sm\">fuel\u003c/span> in the future. So I \u003cspan class=\"k-ans\" data-rv=\"sm\">save\u003c/span> energy by turning off lights and wearing a sweater.\u003c/div>\u003cdiv class=\"k-sk\">어느 날 밤 전기가 나가서 나는 무서웠어요. Bobby는 우리가 에너지를 너무 많이 써서 미래에는 연료가 충분하지 않을 거라고 했어요. 그래서 나는 불을 끄고 스웨터를 입으면서 에너지를 아껴요.\u003c/div>\u003c/div>","segs":[{"n":129,"text":"오늘 이야기를 두세 문장으로 줄여 볼게요. 빈칸에 들어갈 낱말을 함께 찾으면서 읽어 봐요.","hl":null},{"n":130,"text":"One night, the power went out and I was scared. Bobby said we use too much energy and won't have enough fuel in the future. So I save energy by turning off lights and wearing a sweater.","hl":"sm","rv":"sm","v":"n"},{"n":131,"text":"어느 날 밤 전기가 나가서 나는 무서웠어요. Bobby는 우리가 에너지를 너무 많이 써서 미래에는 연료가 충분하지 않을 거라고 했어요. 그래서 나는 불을 끄고 스웨터를 입으면서 에너지를 아껴요.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>Small Change 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":132,"text":"오늘 여러분은 에너지를 아끼는 작은 방법을 배웠어요. 불을 끄고 스웨터를 입는 작은 행동이 큰 변화를 만들어요. 정말 잘했어요, 다음 시간에 또 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
