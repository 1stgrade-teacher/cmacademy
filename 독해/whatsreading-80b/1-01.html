은 O, 맞아요.","hl":"q0","rv":"q0"},{"n":133,"text":"두 번째 문제. Bob은 Jake의 개를 찾아 주지 못했어요. 맞으면 O, 틀리면 X예요.","hl":"q1"},{"n":134,"text":"정답은 X, 틀려요.","hl":"q1","rv":"q1"},{"n":135,"text":"세 번째 문제. Bob이 매일 하던 일이 아닌 것은 무엇인가요? 첫 번째, 토스트 만들기. 두 번째, 집 청소하기. 세 번째, 개 산책시키기","hl":"q2"},{"n":136,"text":"정답은 개 산책시키기예요.","hl":"q2","rv":"q2"},{"n":137,"text":"네 번째 문제. Bob이 행복했던 까닭은 무엇인가요? 첫 번째, 개를 찾아서. 두 번째, 친구를 도와서. 세 번째, 청소를 끝내서","hl":"q3"},{"n":138,"text":"정답은 친구를 도와서예요.","hl":"q3","rv":"q3"}]},{"html":"\u003cspan class=\"lp-tag\">이야기 요약하기\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-bank\">\u003cspan>dog\u003c/span>\u003cspan>happy\u003c/span>\u003cspan>same\u003c/span>\u003cspan>terrible\u003c/span>\u003c/div>\u003cdiv class=\"k-sum\" data-hl=\"sm\">Bob did the \u003cspan class=\"k-ans\" data-rv=\"sm\">same\u003c/span> things every day. One morning, he helped his friend Jake find his \u003cspan class=\"k-ans\" data-rv=\"sm\">dog\u003c/span> all day. He forgot his work, but nothing \u003cspan class=\"k-ans\" data-rv=\"sm\">terrible\u003c/span> happened, so he was \u003cspan class=\"k-ans\" data-rv=\"sm\">happy\u003c/span>.\u003c/div>\u003cdiv class=\"k-sk\">Bob은 매일 똑같은 일을 했어요. 어느 날 아침, 그는 친구 Jake가 개를 찾도록 온종일 도와주었어요. 그는 하던 일을 잊었지만 끔찍한 일은 일어나지 않아서 행복했어요.\u003c/div>\u003c/div>","segs":[{"n":139,"text":"마지막으로 이야기를 세 문장으로 정리해 볼까요? 빈칸에 들어갈 낱말을 생각하며 천천히 읽어 보세요.","hl":null},{"n":140,"text":"Bob did the same things every day. One morning, he helped his friend Jake find his dog all day. He forgot his work, but nothing terrible happened, so he was happy.","hl":"sm","rv":"sm","v":"n"},{"n":141,"text":"Bob은 매일 똑같은 일을 했어요. 어느 날 아침, 그는 친구 Jake가 개를 찾도록 온종일 도와주었어요. 그는 하던 일을 잊었지만 끔찍한 일은 일어나지 않아서 행복했어요.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>A Happy Day 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":142,"text":"여러분, 오늘 Bob의 이야기를 아주 잘 읽었어요! 친구를 도와주는 따뜻한 마음이 참 멋졌죠? 다음 시간에도 신나
