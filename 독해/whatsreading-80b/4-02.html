People make \u003cspan class=\"k-ans\" data-rv=\"sm\">dumplings\u003c/span> for New Year's Day. Chop up vegetables, mix them with pork, and \u003cspan class=\"k-ans\" data-rv=\"sm\">wrap\u003c/span> the filling in a wrapper. Then \u003cspan class=\"k-ans\" data-rv=\"sm\">cook\u003c/span> the dumplings and enjoy them with your \u003cspan class=\"k-ans\" data-rv=\"sm\">family\u003c/span>!\u003c/div>\u003cdiv class=\"k-sk\">사람들은 새해 첫날을 위해 만두를 만들어요. 채소를 잘게 다져 돼지고기와 섞고, 만두소를 만두피에 싸요. 그다음 만두를 조리해서 가족과 함께 즐겨요!\u003c/div>\u003c/div>","segs":[{"n":146,"text":"마지막으로 이야기를 요약해 볼까요? 빈칸에 들어갈 낱말을 생각해 보세요.","hl":null},{"n":147,"text":"People make dumplings for New Year's Day. Chop up vegetables, mix them with pork, and wrap the filling in a wrapper. Then cook the dumplings and enjoy them with your family!","hl":"sm","rv":"sm","v":"n"},{"n":148,"text":"사람들은 새해 첫날을 위해 만두를 만들어요. 채소를 잘게 다져 돼지고기와 섞고, 만두소를 만두피에 싸요. 그다음 만두를 조리해서 가족과 함께 즐겨요!","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>Delicious Dumplings 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":149,"text":"오늘도 정말 잘했어요! 다음 시간에 또 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
