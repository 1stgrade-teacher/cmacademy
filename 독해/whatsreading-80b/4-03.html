03c/b>을 문장 맨 앞에 두면 돼요. 그래서 Can you help me later?는 '나중에 나를 도와줄 수 있니?'가 돼요.\u003c/div>\u003c/div>","segs":[{"n":122,"text":"두 번째 문법은 can이에요. can은 '~할 수 있어요'라는 뜻을 가진 아주 착한 도우미 말이에요. Can you help me later?를 다섯 덩어리로 나눠 봐요. Can은 '할 수 있어요', you는 '너는', help는 '돕다', me는 '나를', later는 '나중에'라는 뜻이에요. 물어보고 싶을 때는 Can을 문장 맨 앞으로 쏙 옮기면 된답니다. 그래서 Can you help me later?는 '나중에 나를 도와줄 수 있니?'가 돼요.","hl":"gb"},{"n":123,"text":"can은 '~할 수 있어요'라는 뜻이에요. 궁금한 것을 물어볼 때는 Can을 문장 맨 앞에 두면 돼요. 그래서 Can you help me later?는 '나중에 나를 도와줄 수 있니?'가 돼요.","hl":"ge"}]},{"html":"\u003cspan class=\"lp-tag\">확인해요\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-gt\">\u003cspan>🙋\u003c/span>~할 수 있어요? Can\u003c/div>\u003cdiv class=\"k-ex\" data-hl=\"gx\">\u003cdiv>\u003cspan class=\"e\">🏊\u003c/span>\u003cb>Can you swim?\u003c/b>\u003csmall>너는 수영할 수 있어요?\u003c/small>\u003c/div>\u003cdiv>\u003cspan class=\"e\">🚲\u003c/span>\u003cb>I can ride a bike.\u003c/b>\u003csmall>나는 자전거를 탈 수 있어요.\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"k-ck\" data-hl=\"gc\">\u003cdiv class=\"q\">\u003cspan class=\"k-ans\" data-rv=\"gc\">Can\u003c/span> you open the window?\u003c/div>\u003csmall>너는 창문을 열 수 있어요?\u003c/small>\u003cdiv class=\"o\">\u003cspan class=\"k-right\" data-rv=\"gc\">Can\u003c/span>\u003cspan>Are\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":124,"text":"예문을 더 볼까요?","hl":"gx"},{"n":125,"text":"Can you swim?","hl":"gx","v":"n","pause":600},{"n":126,"text":"너는 수영할 수 있어요?","hl":"gx"},{"n":127,"text":"I can ride a bike.","hl":"gx","v":"n","pause":600},{"n":128,"text":"나는 자전거를 탈 수 있어요.","hl":"gx"},{"n":129,"text":"문제를 풀어 볼까요? 빈칸 you open the window? 빈칸에 들어갈 말은 Can, 아니면 Are 중에서 무엇일까요?","hl":"gc"},{"n":130,"text":"정답은 Can! Can you open the window?","hl":"gc","rv":"gc"}]},{"html":"\u003cspan class=\"lp-tag\">내용 확인 문제\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-qq\" data-hl=\"q0\">\u003ci>1\u003c/i>\u003cdiv>\u003cdiv class=\"q\">할머니께서는 처음부터 아이에게 만두피를 주셨어요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q0\">X\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q1\">\u003ci>2\u003c/i>\u003cdiv>\u003cdiv class=\"q\">얼마 후에 아이의 만두가 할머니의 만두처럼 보였어요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q1\">O\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q2\">\u003ci>3\u003c/i>\u003cdiv>\u003cdiv class=\"q\">만두를 보고 아이는 어떤 마음이었어요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 기뻤어요\u003c/span>\u003cspan>② 걱정됐어요\u003c/span>\u003cspan>③ 졸렸어요\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q2\">걱정됐어요\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q3\">\u003ci>4\u003c/i>\u003cdiv>\u003cdiv class=\"q\">모두는 무엇을 맛있게 먹었어요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 만둣국\u003c/span>\u003cspan>② 피자\u003c/span>\u003cspan>③ 김밥\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q3\">만둣국\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":131,"text":"이제 문제를 풀어 볼까요? 지문을 다시 보면서 답의 근거가 되는 문장을 찾아보면 훨씬 쉬워요.","hl":null},{"n":132,"text":"첫 번째 문제. 할머니께서는 처음부터 아이에게 만두피를 주셨어요. 맞으면 O, 틀리면 X예요.","hl":"q0"},{"n":133,"text":"정답은 X, 틀려요.","hl":"q0","rv":"q0"},{"n":134,"text":"두 번째 문제. 얼마 후에 아이의 만두가 할머니의 만두처럼 보였어요. 맞으면 O, 틀리면 X예요.","hl":"q1"},{"n":135,"text":"정답은 O, 맞아요.","hl":"q1","rv":"q1"},{"n":136,"text":"세 번째 문제. 만두를 보고 아이는 어떤 마음이었어요? 첫 번째, 기뻤어요. 두 번째, 걱정됐어요. 세 번째, 졸렸어요","hl":"q2"},{"n":137,"text":"정답은 걱정됐어요예요.","hl":"q2","rv":"q2"},{"n":138,"text":"네 번째 문제. 모두는 무엇을 맛있게 먹었어요? 첫 번째, 만둣국. 두 번째, 피자. 세 번째, 김밥","hl":"q3"},{"n":139,"text":"정답은 만둣국예요.","hl":"q3","rv":"q3"}]},{"html":"\u003cspan class=\"lp-tag\">이야기 요약하기\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-bank\">\u003cspan>dumplings\u003c/span>\u003cspan>enjoyed\u003c/span>\u003cspan>funny\u003c/span>\u003cspan>trying\u003c/span>\u003c/div>\u003cdiv class=\"k-sum\" data-hl=\"sm\">Yesterday, Grandma and I made \u003cspan class=\"k-ans\" data-rv=\"sm\">dumplings\u003c/span>. At first my dumplings looked \u003cspan class=\"k-ans\" data-rv=\"sm\">funny\u003c/span>, but I kept \u003cspan class=\"k-ans\" data-rv=\"sm\">trying\u003c/span>. Grandma made dumpling soup, and everyone \u003cspan class=\"k-ans\" data-rv=\"sm\">enjoyed\u003c/span> it.\u003c/div>\u003cdiv class=\"k-sk\">어제 할머니와 나는 만두를 만들었어요. 처음에는 내 만두가 이상하게 보였지만 계속 해 보았어요. 할머니께서 만둣국을 만드셨고, 모두가 맛있게 먹었어요.\u003c/div>\u003c/div>","segs":[{"n":140,"text":"마지막으로 이야기를 세 문장으로 짧게 줄여 볼게요. 빈칸에 들어갈 낱말을 떠올리며 큰 소리로 읽어 봐요.","hl":null},{"n":141,"text":"Yesterday, Grandma and I made dumplings. At first my dumplings looked funny, but I kept trying. Grandma made dumpling soup, and everyone enjoyed it.","hl":"sm","rv":"sm","v":"n"},{"n":142,"text":"어제 할머니와 나는 만두를 만들었어요. 처음에는 내 만두가 이상하게 보였지만 계속 해 보았어요. 할머니께서 만둣국을 만드셨고, 모두가 맛있게 먹었어요.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>Funny Dumplings 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":143,"text":"여러분, 오늘 정말 잘했어요! 만두처럼 조금 이상해도 계속 해 보면 멋지게 될 수 있다는 걸 배웠어요. 오늘 배운 -ed와 Can을 잊지 말고, 가족에게 영어로 한 문장씩 말해 보세요. 다음 시간에 또 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
