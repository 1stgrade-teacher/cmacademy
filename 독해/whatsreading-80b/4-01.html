3cdiv>\u003cspan class=\"e\">🏫\u003c/span>\u003cb>She didn't go to school.\u003c/b>\u003csmall>그녀는 학교에 가지 않았어요.\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"k-ck\" data-hl=\"gc\">\u003cdiv class=\"q\">He \u003cspan class=\"k-ans\" data-rv=\"gc\">didn't\u003c/span> like the mouse.\u003c/div>\u003csmall>그는 그 쥐를 좋아하지 않았어요.\u003c/small>\u003cdiv class=\"o\">\u003cspan class=\"k-right\" data-rv=\"gc\">didn't\u003c/span>\u003cspan>wasn't\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":105,"text":"예문을 더 볼까요?","hl":"gx"},{"n":106,"text":"I didn't like carrots.","hl":"gx","v":"n","pause":600},{"n":107,"text":"나는 당근을 좋아하지 않았어요.","hl":"gx"},{"n":108,"text":"She didn't go to school.","hl":"gx","v":"n","pause":600},{"n":109,"text":"그녀는 학교에 가지 않았어요.","hl":"gx"},{"n":110,"text":"문제를 풀어 볼까요? He 빈칸 like the mouse. 빈칸에 들어갈 말은 didn't, 아니면 wasn't 중에서 무엇일까요?","hl":"gc"},{"n":111,"text":"정답은 didn't! He didn't like the mouse.","hl":"gc","rv":"gc"}]},{"html":"\u003cspan class=\"lp-tag\">내용 확인 문제\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-qq\" data-hl=\"q0\">\u003ci>1\u003c/i>\u003cdiv>\u003cdiv class=\"q\">못생긴 만두는 처음부터 친구가 있었어요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q0\">X\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q1\">\u003ci>2\u003c/i>\u003cdiv>\u003cdiv class=\"q\">못생긴 만두는 사실 만두가 아니라 찐빵이었어요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q1\">O\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q2\">\u003ci>3\u003c/i>\u003cdiv>\u003cdiv class=\"q\">부엌을 나갔을 때 사람들은 무엇을 하고 있었나요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 만두를 먹고 있었어요\u003c/span>\u003cspan>② 찐빵을 만들고 있었어요\u003c/span>\u003cspan>③ 쥐를 쫓고 있었어요\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q2\">만두를 먹고 있었어요\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q3\">\u003ci>4\u003c/i>\u003cdiv>\u003cdiv class=\"q\">다른 찐빵들이 좋아하지 않은 것은 무엇인가요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 쥐\u003c/span>\u003cspan>② 못생긴 만두\u003c/span>\u003cspan>③ 사람들\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q3\">쥐\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":112,"text":"이제 문제를 풀어 볼까요? 이야기를 다시 떠올리면서 맞으면 O, 틀리면 X를 고르고 알맞은 답도 찾아보세요.","hl":null},{"n":113,"text":"첫 번째 문제. 못생긴 만두는 처음부터 친구가 있었어요. 맞으면 O, 틀리면 X예요.","hl":"q0"},{"n":114,"text":"정답은 X, 틀려요.","hl":"q0","rv":"q0"},{"n":115,"text":"두 번째 문제. 못생긴 만두는 사실 만두가 아니라 찐빵이었어요. 맞으면 O, 틀리면 X예요.","hl":"q1"},{"n":116,"text":"정답은 O, 맞아요.","hl":"q1","rv":"q1"},{"n":117,"text":"세 번째 문제. 부엌을 나갔을 때 사람들은 무엇을 하고 있었나요? 첫 번째, 만두를 먹고 있었어요. 두 번째, 찐빵을 만들고 있었어요. 세 번째, 쥐를 쫓고 있었어요","hl":"q2"},{"n":118,"text":"정답은 만두를 먹고 있었어요예요.","hl":"q2","rv":"q2"},{"n":119,"text":"네 번째 문제. 다른 찐빵들이 좋아하지 않은 것은 무엇인가요? 첫 번째, 쥐. 두 번째, 못생긴 만두. 세 번째, 사람들","hl":"q3"},{"n":120,"text":"정답은 쥐예요.","hl":"q3","rv":"q3"}]},{"html":"\u003cspan class=\"lp-tag\">이야기 요약하기\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-bank\">\u003cspan>mouse\u003c/span>\u003cspan>stayed\u003c/span>\u003cspan>steamed bun\u003c/span>\u003cspan>ugly\u003c/span>\u003c/div>\u003cdiv class=\"k-sum\" data-hl=\"sm\">An \u003cspan class=\"k-ans\" data-rv=\"sm\">ugly\u003c/span> dumpling had no friends. A dirty mouse became his friend. He found out he was a \u003cspan class=\"k-ans\" data-rv=\"sm\">steamed bun\u003c/span>, but the other buns didn't like the \u003cspan class=\"k-ans\" data-rv=\"sm\">mouse\u003c/span>. He \u003cspan class=\"k-ans\" data-rv=\"sm\">stayed\u003c/span> friends with the mouse, and that was a good thing.\u003c/div>\u003cdiv class=\"k-sk\">못생긴 만두는 친구가 없었어요. 더러운 쥐가 그의 친구가 되었어요. 그는 자신이 찐빵이라는 것을 알게 되었지만, 다른 찐빵들은 쥐를 좋아하지 않았어요. 그는 쥐와 친구로 남았고, 그것은 좋은 일이었어요.\u003c/div>\u003c/div>","segs":[{"n":121,"text":"마지막으로 오늘 이야기를 정리해 볼게요. 빈칸에 들어갈 낱말을 생각하며 요약 문장을 따라 읽어 보세요.","hl":null},{"n":122,"text":"An ugly dumpling had no friends. A dirty mouse became his friend. He found out he was a steamed bun, but the other buns didn't like the mouse. He stayed friends with the mouse, and that was a good thing.","hl":"sm","rv":"sm","v":"n"},{"n":123,"text":"못생긴 만두는 친구가 없었어요. 더러운 쥐가 그의 친구가 되었어요. 그는 자신이 찐빵이라는 것을 알게 되었지만, 다른 찐빵들은 쥐를 좋아하지 않았어요. 그는 쥐와 친구로 남았고, 그것은 좋은 일이었어요.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>The Ugly Dumpling 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":124,"text":"여러분, 오늘 정말 멋지게 읽었어요! 못생긴 만두처럼 달라도 서로를 이해해 주는 친구가 얼마나 소중한지 기억해요. 다음 시간에 또 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
