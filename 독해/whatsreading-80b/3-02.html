t":"첫 번째 문제. Wangari는 미국에서 공부했어요. 맞으면 O, 틀리면 X예요.","hl":"q0"},{"n":134,"text":"정답은 O, 맞아요.","hl":"q0","rv":"q0"},{"n":135,"text":"두 번째 문제. Wangari의 고향에는 나무가 아주 많았어요. 맞으면 O, 틀리면 X예요.","hl":"q1"},{"n":136,"text":"정답은 X, 틀려요.","hl":"q1","rv":"q1"},{"n":137,"text":"세 번째 문제. Wangari는 누구에게 어린 나무를 하나씩 주었어요? 첫 번째, 마을 여자들. 두 번째, 학교 친구들. 세 번째, 미국 사람들","hl":"q2"},{"n":138,"text":"정답은 마을 여자들예요.","hl":"q2","rv":"q2"},{"n":139,"text":"네 번째 문제. 나무들이 자란 뒤 케냐는 어떻게 되었어요? 첫 번째, 초록 우산이 돌아왔어요. 두 번째, 사막이 더 넓어졌어요. 세 번째, 나무가 모두 사라졌어요","hl":"q3"},{"n":140,"text":"정답은 초록 우산이 돌아왔어요예요.","hl":"q3","rv":"q3"}]},{"html":"\u003cspan class=\"lp-tag\">이야기 요약하기\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-bank\">\u003cspan>came back\u003c/span>\u003cspan>green trees\u003c/span>\u003cspan>no trees\u003c/span>\u003cspan>planted\u003c/span>\u003c/div>\u003cdiv class=\"k-sum\" data-hl=\"sm\">Wangari lived under \u003cspan class=\"k-ans\" data-rv=\"sm\">green trees\u003c/span> in Kenya, but after she came home, there were \u003cspan class=\"k-ans\" data-rv=\"sm\">no trees\u003c/span>. She and the village women \u003cspan class=\"k-ans\" data-rv=\"sm\">planted\u003c/span> many small trees. Soon the trees grew tall, and the green umbrella \u003cspan class=\"k-ans\" data-rv=\"sm\">came back\u003c/span>.\u003c/div>\u003cdiv class=\"k-sk\">Wangari는 케냐에서 초록 나무들 아래에 살았지만, 고향에 돌아오니 나무가 없었어요. 그녀와 마을 여자들이 작은 나무를 많이 심었어요. 곧 나무들이 키가 커졌고, 초록 우산이 돌아왔어요.\u003c/div>\u003c/div>","segs":[{"n":141,"text":"마지막으로 이야기를 짧게 정리해 볼게요. 나무가 사라진 마을에 Wangari와 여자들이 작은 나무를 심었고, 초록 우산이 다시 돌아왔어요.","hl":null},{"n":142,"text":"Wangari lived under green trees in Kenya, but after she came home, there were no trees. She and the village women planted many small trees. Soon the trees grew tall, and the green umbrella came back.","hl":"sm","rv":"sm","v":"n"},{"n":143,"text":"Wangari는 케냐에서 초록 나무들 아래에 살았지만, 고향에 돌아오니 나무가 없었어요. 그녀와 마을 여자들이 작은 나무를 많이 심었어요. 곧 나무들이 키가 커졌고, 초록 우산이 돌아왔어요.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>Wangari's Umbrella 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":144,"text":"오늘 여러분은 Wangari의 용감한 이야기를 끝까지 잘 읽었어요. 작은 나무 하나가 마을을 바꿀 수 있다는 것을 꼭 기억해요. 다음 시간에도 재미있는 이야기로 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
