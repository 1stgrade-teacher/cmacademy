lass=\"k-ans\" data-rv=\"gc\">found\u003c/span> her keys yesterday.\u003c/div>\u003csmall>그녀는 어제 열쇠를 찾았어요.\u003c/small>\u003cdiv class=\"o\">\u003cspan class=\"k-right\" data-rv=\"gc\">found\u003c/span>\u003cspan>finded\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":89,"text":"예문을 더 볼까요?","hl":"gx"},{"n":90,"text":"We found a small cat.","hl":"gx","v":"n","pause":600},{"n":91,"text":"우리는 작은 고양이를 찾았어요.","hl":"gx"},{"n":92,"text":"They came home early.","hl":"gx","v":"n","pause":600},{"n":93,"text":"그들은 집에 일찍 왔어요.","hl":"gx"},{"n":94,"text":"문제를 풀어 볼까요? She 빈칸 her keys yesterday. 빈칸에 들어갈 말은 found, 아니면 finded 중에서 무엇일까요?","hl":"gc"},{"n":95,"text":"정답은 found! She found her keys yesterday.","hl":"gc","rv":"gc"}]},{"html":"\u003cspan class=\"lp-tag\">내용 확인 문제\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-qq\" data-hl=\"q0\">\u003ci>1\u003c/i>\u003cdiv>\u003cdiv class=\"q\">바빌로니아인들은 하늘을 처음으로 연구했어요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q0\">O\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q1\">\u003ci>2\u003c/i>\u003cdiv>\u003cdiv class=\"q\">여행자들은 달력을 보고 길을 찾았어요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q1\">X\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q2\">\u003ci>3\u003c/i>\u003cdiv>\u003cdiv class=\"q\">농부들은 하늘을 무엇으로 사용했나요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 달력\u003c/span>\u003cspan>② 신문\u003c/span>\u003cspan>③ 별자리\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q2\">달력\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q3\">\u003ci>4\u003c/i>\u003cdiv>\u003cdiv class=\"q\">오늘날 어떤 사람들은 신문에서 무엇을 찾나요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 자신의 별자리\u003c/span>\u003cspan>② 여행 지도\u003c/span>\u003cspan>③ 농사 달력\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q3\">자신의 별자리\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":96,"text":"이제 내용 확인 문제를 풀어 볼까요? 지문에서 답을 찾은 문장을 손가락으로 짚으며 차근차근 골라 보세요.","hl":null},{"n":97,"text":"첫 번째 문제. 바빌로니아인들은 하늘을 처음으로 연구했어요. 맞으면 O, 틀리면 X예요.","hl":"q0"},{"n":98,"text":"정답은 O, 맞아요.","hl":"q0","rv":"q0"},{"n":99,"text":"두 번째 문제. 여행자들은 달력을 보고 길을 찾았어요. 맞으면 O, 틀리면 X예요.","hl":"q1"},{"n":100,"text":"정답은 X, 틀려요.","hl":"q1","rv":"q1"},{"n":101,"text":"세 번째 문제. 농부들은 하늘을 무엇으로 사용했나요? 첫 번째, 달력. 두 번째, 신문. 세 번째, 별자리","hl":"q2"},{"n":102,"text":"정답은 달력예요.","hl":"q2","rv":"q2"},{"n":103,"text":"네 번째 문제. 오늘날 어떤 사람들은 신문에서 무엇을 찾나요? 첫 번째, 자신의 별자리. 두 번째, 여행 지도. 세 번째, 농사 달력","hl":"q3"},{"n":104,"text":"정답은 자신의 별자리예요.","hl":"q3","rv":"q3"}]},{"html":"\u003cspan class=\"lp-tag\">이야기 요약하기\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-bank\">\u003cspan>calendar\u003c/span>\u003cspan>newspaper\u003c/span>\u003cspan>sky\u003c/span>\u003cspan>star signs\u003c/span>\u003c/div>\u003cdiv class=\"k-sum\" data-hl=\"sm\">Long ago, people studied the \u003cspan class=\"k-ans\" data-rv=\"sm\">sky\u003c/span> and made \u003cspan class=\"k-ans\" data-rv=\"sm\">star signs\u003c/span>. Farmers and travelers used the stars as a \u003cspan class=\"k-ans\" data-rv=\"sm\">calendar\u003c/span> and for directions. Today, some people still read their star signs in the \u003cspan class=\"k-ans\" data-rv=\"sm\">newspaper\u003c/span>.\u003c/div>\u003cdiv class=\"k-sk\">오래전에 사람들은 하늘을 연구하고 별자리를 만들었어요. 농부와 여행자는 별을 달력처럼, 그리고 방향을 찾는 데 사용했어요. 오늘날에도 어떤 사람들은 신문에서 자신의 별자리를 읽어요.\u003c/div>\u003c/div>","segs":[{"n":105,"text":"마지막으로 오늘 이야기를 쉬운 영어로 정리해 볼게요. 빈칸에 들어갈 sky, star signs, calendar, newspaper를 떠올리며 함께 읽어 보세요.","hl":null},{"n":106,"text":"Long ago, people studied the sky and made star signs. Farmers and travelers used the stars as a calendar and for directions. Today, some people still read their star signs in the newspaper.","hl":"sm","rv":"sm","v":"n"},{"n":107,"text":"오래전에 사람들은 하늘을 연구하고 별자리를 만들었어요. 농부와 여행자는 별을 달력처럼, 그리고 방향을 찾는 데 사용했어요. 오늘날에도 어떤 사람들은 신문에서 자신의 별자리를 읽어요.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>The Sky Has Everything 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":108,"text":"여러분, 오늘 하늘을 연구하고 별을 길잡이로 사용한 옛사람들의 이야기를 잘 읽었어요. The Sky Has Everything처럼 하늘에는 우리가 알아 갈 것이 참 많아요. 다음 시간에도 반짝이는 호기심을 가지고 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
