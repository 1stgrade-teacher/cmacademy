iv>\u003cdiv class=\"q\">Ocean은 앞으로 무엇을 하기로 결심했나요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 낮에는 Sun을, 밤에는 Moon을 보기로 했어요\u003c/span>\u003cspan>② Sun을 하늘 밖으로 보내 버리기로 했어요\u003c/span>\u003cspan>③ Star들을 모두 없애기로 했어요\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q3\">낮에는 Sun을, 밤에는 Moon을 보기로 했어요\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":110,"text":"이제 문제를 풀어 볼까요? 답이 되는 문장을 지문에서 다시 찾아보면 훨씬 쉬워요. 하나씩 천천히 골라 보세요.","hl":null},{"n":111,"text":"첫 번째 문제. Sun과 Moon은 처음부터 서로 멀리 떨어져 있었어요. 맞으면 O, 틀리면 X예요.","hl":"q0"},{"n":112,"text":"정답은 X, 틀려요.","hl":"q0","rv":"q0"},{"n":113,"text":"두 번째 문제. Ocean은 Star들이 Sun을 공격하는 것을 막았어요. 맞으면 O, 틀리면 X예요.","hl":"q1"},{"n":114,"text":"정답은 O, 맞아요.","hl":"q1","rv":"q1"},{"n":115,"text":"세 번째 문제. Sun이 Moon을 멀리 던진 까닭은 무엇인가요? 첫 번째, Ocean이 Moon을 위해 파도를 만들어서 질투가 났기 때문에. 두 번째, Moon이 Sun을 먼저 공격했기 때문에. 세 번째, Star들이 Sun에게 화를 냈기 때문에","hl":"q2"},{"n":116,"text":"정답은 Ocean이 Moon을 위해 파도를 만들어서 질투가 났기 때문에예요.","hl":"q2","rv":"q2"},{"n":117,"text":"네 번째 문제. Ocean은 앞으로 무엇을 하기로 결심했나요? 첫 번째, 낮에는 Sun을, 밤에는 Moon을 보기로 했어요. 두 번째, Sun을 하늘 밖으로 보내 버리기로 했어요. 세 번째, Star들을 모두 없애기로 했어요","hl":"q3"},{"n":118,"text":"정답은 낮에는 Sun을, 밤에는 Moon을 보기로 했어요예요.","hl":"q3","rv":"q3"}]},{"html":"\u003cspan class=\"lp-tag\">이야기 요약하기\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-bank\">\u003cspan>angry\u003c/span>\u003cspan>jealous\u003c/span>\u003cspan>night\u003c/span>\u003cspan>stopped\u003c/span>\u003c/div>\u003cdiv class=\"k-sum\" data-hl=\"sm\">Sun, Moon, and Ocean were good friends. The Sun became \u003cspan class=\"k-ans\" data-rv=\"sm\">jealous\u003c/span> and threw the Moon far away, so the Stars were \u003cspan class=\"k-ans\" data-rv=\"sm\">angry\u003c/span>. The Ocean \u003cspan class=\"k-ans\" data-rv=\"sm\">stopped\u003c/span> them and decided to show the Sun in the day and the Moon at \u003cspan class=\"k-ans\" data-rv=\"sm\">night\u003c/span>.\u003c/div>\u003cdiv class=\"k-sk\">Sun과 Moon, Ocean은 좋은 친구였어요. Sun이 질투해서 Moon을 멀리 던지자 Star들이 화가 났어요. Ocean이 그들을 막고, 낮에는 Sun을 밤에는 Moon을 보여 주기로 했어요.\u003c/div>\u003c/div>","segs":[{"n":119,"text":"마지막으로 이야기를 세 문장으로 정리해 볼게요. 빈칸에 들어갈 낱말을 떠올리며 소리 내어 읽어 보세요.","hl":null},{"n":120,"text":"Sun, Moon, and Ocean were good friends. The Sun became jealous and threw the Moon far away, so the Stars were angry. The Ocean stopped them and decided to show the Sun in the day and the Moon at night.","hl":"sm","rv":"sm","v":"n"},{"n":121,"text":"Sun과 Moon, Ocean은 좋은 친구였어요. Sun이 질투해서 Moon을 멀리 던지자 Star들이 화가 났어요. Ocean이 그들을 막고, 낮에는 Sun을 밤에는 Moon을 보여 주기로 했어요.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>Sun, Moon, and Ocean 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":122,"text":"오늘 여러분은 Sun, Moon, and Ocean 이야기를 멋지게 읽었어요. 질투가 생기더라도 결국 사이좋게 지내는 법을 배운 것 같아요. 정말 잘했어요, 다음 시간에 또 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
