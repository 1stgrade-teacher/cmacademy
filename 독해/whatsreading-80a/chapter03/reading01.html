"rv":"q0"},{"n":99,"text":"두 번째 문제. 두 사람은 비를 맞으면서 밖에서 계속 놀았어요. 맞으면 O, 틀리면 X예요.","hl":"q1"},{"n":100,"text":"정답은 X, 틀려요.","hl":"q1","rv":"q1"},{"n":101,"text":"세 번째 문제. Anna와 Jack이 하기로 한 것은 무엇인가요? 첫 번째, 보드 게임. 두 번째, 축구. 세 번째, 책 읽기","hl":"q2"},{"n":102,"text":"정답은 보드 게임예요.","hl":"q2","rv":"q2"},{"n":103,"text":"네 번째 문제. 게임이 끝난 뒤에 하늘은 어떻게 되었나요? 첫 번째, 몇 분마다 번개로 하얗게 되었어요. 두 번째, 회색 구름이 모두 사라졌어요. 세 번째, 비가 그치고 맑아졌어요","hl":"q3"},{"n":104,"text":"정답은 몇 분마다 번개로 하얗게 되었어요예요.","hl":"q3","rv":"q3"}]},{"html":"\u003cspan class=\"lp-tag\">이야기 요약하기\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-bank\">\u003cspan>board game\u003c/span>\u003cspan>dark\u003c/span>\u003cspan>sound\u003c/span>\u003cspan>white\u003c/span>\u003c/div>\u003cdiv class=\"k-sum\" data-hl=\"sm\">One day, Anna and Jack heard a \u003cspan class=\"k-ans\" data-rv=\"sm\">sound\u003c/span> from the sky and the sky became \u003cspan class=\"k-ans\" data-rv=\"sm\">dark\u003c/span> with gray clouds. They went inside and played a \u003cspan class=\"k-ans\" data-rv=\"sm\">board game\u003c/span> together. After the game, they watched the sky become \u003cspan class=\"k-ans\" data-rv=\"sm\">white\u003c/span> with lightning.\u003c/div>\u003cdiv class=\"k-sk\">어느 날 Anna와 Jack은 하늘에서 소리를 들었고, 하늘은 회색 구름으로 어두워졌어요. 두 사람은 집 안으로 들어가 함께 보드 게임을 했어요. 게임이 끝난 뒤, 그들은 하늘이 번개로 하얗게 변하는 것을 지켜보았어요.\u003c/div>\u003c/div>","segs":[{"n":105,"text":"마지막으로 이야기를 짧게 정리해 볼게요. 빈칸에 들어갈 낱말을 생각하며 요약 문장을 소리 내어 읽어 보세요.","hl":null},{"n":106,"text":"One day, Anna and Jack heard a sound from the sky and the sky became dark with gray clouds. They went inside and played a board game together. After the game, they watched the sky become white with lightning.","hl":"sm","rv":"sm","v":"n"},{"n":107,"text":"어느 날 Anna와 Jack은 하늘에서 소리를 들었고, 하늘은 회색 구름으로 어두워졌어요. 두 사람은 집 안으로 들어가 함께 보드 게임을 했어요. 게임이 끝난 뒤, 그들은 하늘이 번개로 하얗게 변하는 것을 지켜보았어요.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>Weather Change 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":108,"text":"여러분, 오늘 정말 잘했어요! 날씨가 변하는 이야기를 읽으면서 '놀고 있었어요'와 '~해졌어요' 표현을 익혔어요. 다음에는 우리 주변에서 변하는 것들을 영어로 말해 볼까요? 수고했어요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
