3c/div>\u003cdiv class=\"gpi\">\u003cdiv class=\"pe\">👹\u003c/div>\u003cdiv class=\"pn\">a monster many heads\u003c/div>\u003cdiv class=\"pk\">with가 빠져서 어색해요\u003c/div>\u003cspan class=\"mk x\">X\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"k-ez\" data-hl=\"ge\">with는 '~와 함께'라는 뜻도 있지만, 여기서는 '~을 가진'이라는 뜻이에요. a snake with many heads는 '많은 머리를 가진 뱀'이에요. 무엇을 가지고 있는지 \u003cb class=\"key\">설명\u003c/b>할 때 with를 붙여요.\u003c/div>\u003c/div>","segs":[{"n":103,"text":"영어에서 with는 '함께'라는 뜻도 있지만 '가지를 가진'이라는 뜻으로도 자주 써요. It looked like a snake with many heads를 나눠 볼게요. It은 무엇인지, looked like는 어떻게 보였는지, a snake는 뱀처럼, with many heads는 많은 머리를 가졌다는 설명이에요. 그래서 이 문장은 '그것은 많은 머리를 가진 뱀처럼 보였다'가 돼요. 무엇을 가지고 있는지 말할 때 with를 붙여 주면 아주 간단해요.","hl":"gb"},{"n":104,"text":"with는 '~와 함께'라는 뜻도 있지만, 여기서는 '~을 가진'이라는 뜻이에요. a snake with many heads는 '많은 머리를 가진 뱀'이에요. 무엇을 가지고 있는지 설명할 때 with를 붙여요.","hl":"ge"}]},{"html":"\u003cspan class=\"lp-tag\">확인해요\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-gt\">\u003cspan>🔗\u003c/span>with로 '~을 가진' 설명해요\u003c/div>\u003cdiv class=\"k-ex\" data-hl=\"gx\">\u003cdiv>\u003cspan class=\"e\">📦\u003c/span>\u003cb>I have a box with a lid.\u003c/b>\u003csmall>나는 뚜껑이 있는 상자가 있어요.\u003c/small>\u003c/div>\u003cdiv>\u003cspan class=\"e\">🏡\u003c/span>\u003cb>She lives in a house with a big garden.\u003c/b>\u003csmall>그녀는 큰 정원이 있는 집에 살아요.\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"k-ck\" data-hl=\"gc\">\u003cdiv class=\"q\">He has a cup \u003cspan class=\"k-ans\" data-rv=\"gc\">with\u003c/span> a handle.\u003c/div>\u003csmall>그는 손잡이가 있는 컵을 가지고 있어요.\u003c/small>\u003cdiv class=\"o\">\u003cspan class=\"k-right\" data-rv=\"gc\">with\u003c/span>\u003cspan>of\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":105,"text":"예문을 더 볼까요?","hl":"gx"},{"n":106,"text":"I have a box with a lid.","hl":"gx","v":"n","pause":600},{"n":107,"text":"나는 뚜껑이 있는 상자가 있어요.","hl":"gx"},{"n":108,"text":"She lives in a house with a big garden.","hl":"gx","v":"n","pause":600},{"n":109,"text":"그녀는 큰 정원이 있는 집에 살아요.","hl":"gx"},{"n":110,"text":"문제를 풀어 볼까요? He has a cup 빈칸 a handle. 빈칸에 들어갈 말은 with, 아니면 of 중에서 무엇일까요?","hl":"gc"},{"n":111,"text":"정답은 with! He has a cup with a handle.","hl":"gc","rv":"gc"}]},{"html":"\u003cspan class=\"lp-tag\">내용 확인 문제\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-qq\" data-hl=\"q0\">\u003ci>1\u003c/i>\u003cdiv>\u003cdiv class=\"q\">헤라클레스의 임무는 모두 열두 개였어요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q0\">O\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q1\">\u003ci>2\u003c/i>\u003cdiv>\u003cdiv class=\"q\">히드라는 머리가 하나뿐인 괴물이었어요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q1\">X\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q2\">\u003ci>3\u003c/i>\u003cdiv>\u003cdiv class=\"q\">히드라의 머리 하나를 자르면 어떻게 되나요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 머리가 더 이상 자라지 않아요.\u003c/span>\u003cspan>② 대신 두 개의 머리가 자라나요.\u003c/span>\u003cspan>③ 머리가 모두 사라져요.\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q2\">대신 두 개의 머리가 자라나요.\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q3\">\u003ci>4\u003c/i>\u003cdiv>\u003cdiv class=\"q\">헤라클레스는 히드라의 독이 있는 피를 어디에 썼나요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 다른 괴물을 죽일 때 사용했어요.\u003c/span>\u003cspan>② 자기 몸을 치료할 때 사용했어요.\u003c/span>\u003cspan>③ 음식을 만들 때 사용했어요.\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q3\">다른 괴물을 죽일 때 사용했어요.\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":112,"text":"이제 문제를 풀어 볼까요? 지문을 다시 보면서 답을 찾으면 훨씬 쉬워요.","hl":null},{"n":113,"text":"첫 번째 문제. 헤라클레스의 임무는 모두 열두 개였어요. 맞으면 O, 틀리면 X예요.","hl":"q0"},{"n":114,"text":"정답은 O, 맞아요.","hl":"q0","rv":"q0"},{"n":115,"text":"두 번째 문제. 히드라는 머리가 하나뿐인 괴물이었어요. 맞으면 O, 틀리면 X예요.","hl":"q1"},{"n":116,"text":"정답은 X, 틀려요.","hl":"q1","rv":"q1"},{"n":117,"text":"세 번째 문제. 히드라의 머리 하나를 자르면 어떻게 되나요? 첫 번째, 머리가 더 이상 자라지 않아요.. 두 번째, 대신 두 개의 머리가 자라나요.. 세 번째, 머리가 모두 사라져요.","hl":"q2"},{"n":118,"text":"정답은 대신 두 개의 머리가 자라나요.예요.","hl":"q2","rv":"q2"},{"n":119,"text":"네 번째 문제. 헤라클레스는 히드라의 독이 있는 피를 어디에 썼나요? 첫 번째, 다른 괴물을 죽일 때 사용했어요.. 두 번째, 자기 몸을 치료할 때 사용했어요.. 세 번째, 음식을 만들 때 사용했어요.","hl":"q3"},{"n":120,"text":"정답은 다른 괴물을 죽일 때 사용했어요.예요.","hl":"q3","rv":"q3"}]},{"html":"\u003cspan class=\"lp-tag\">이야기 요약하기\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-bank\">\u003cspan>Hydra\u003c/span>\u003cspan>collected\u003c/span>\u003cspan>poison\u003c/span>\u003cspan>scared\u003c/span>\u003c/div>\u003cdiv class=\"k-sum\" data-hl=\"sm\">Hercules had to kill the \u003cspan class=\"k-ans\" data-rv=\"sm\">Hydra\u003c/span>, a monster with many heads. Its blood was full of strong \u003cspan class=\"k-ans\" data-rv=\"sm\">poison\u003c/span>, so everyone was \u003cspan class=\"k-ans\" data-rv=\"sm\">scared\u003c/span>. In the end, he killed it and \u003cspan class=\"k-ans\" data-rv=\"sm\">collected\u003c/span> its blood.\u003c/div>\u003cdiv class=\"k-sk\">헤라클레스는 많은 머리를 가진 괴물 히드라를 죽여야 했어요. 히드라의 피에는 강한 독이 있어서 모두가 무서워했어요. 결국 그는 히드라를 죽이고 그 피를 모았어요.\u003c/div>\u003c/div>","segs":[{"n":121,"text":"마지막으로 오늘 이야기를 세 문장으로 정리해 볼게요. 빈칸에 들어갈 낱말을 하나씩 떠올려 보세요.","hl":null},{"n":122,"text":"Hercules had to kill the Hydra, a monster with many heads. Its blood was full of strong poison, so everyone was scared. In the end, he killed it and collected its blood.","hl":"sm","rv":"sm","v":"n"},{"n":123,"text":"헤라클레스는 많은 머리를 가진 괴물 히드라를 죽여야 했어요. 히드라의 피에는 강한 독이 있어서 모두가 무서워했어요. 결국 그는 히드라를 죽이고 그 피를 모았어요.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>The Hydra 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":124,"text":"여러분, 오늘 아주 멋진 신화 이야기를 읽었어요! 어려운 낱말도 있고 과거형도 있었지만 끝까지 잘 따라왔어요. 다음 시간에도 재미있는 이야기로 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
