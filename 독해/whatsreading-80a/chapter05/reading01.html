tag\">문법을 그림으로\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-gt\">\u003cspan>💀\u003c/span>'당했어요'는 were killed\u003c/div>\u003cdiv data-hl=\"gb\">\u003cdiv class=\"gblk\">\u003cdiv class=\"gb r-who\">\u003cspan class=\"gt\">누가\u003c/span>\u003cspan class=\"ge\">Many kings\u003c/span>\u003cspan class=\"gk\">많은 왕들이\u003c/span>\u003c/div>\u003cdiv class=\"gb r-be\">\u003cspan class=\"gt\">~이에요\u003c/span>\u003cspan class=\"ge\">were also killed\u003c/span>\u003cspan class=\"gk\">또한 죽임을 당했어요\u003c/span>\u003c/div>\u003cdiv class=\"gb r-with\">\u003cspan class=\"gt\">누구와\u003c/span>\u003cspan class=\"ge\">by poisons\u003c/span>\u003cspan class=\"gk\">독에 의해\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cdiv data-hl=\"gp\">\u003cdiv class=\"gpic\">\u003cdiv class=\"gpt\">죽였어요 vs 당했어요\u003c/div>\u003cdiv class=\"gpr\">\u003cdiv class=\"gpi\">\u003cdiv class=\"pe\">🗡️\u003c/div>\u003cdiv class=\"pn\">He killed the snake.\u003c/div>\u003cdiv class=\"pk\">그가 뱀을 죽였어요 (내가 하는 일)\u003c/div>\u003c/div>\u003cdiv class=\"gpi\">\u003cdiv class=\"pe\">🐍\u003c/div>\u003cdiv class=\"pn\">He was killed by the snake.\u003c/div>\u003cdiv class=\"pk\">그가 뱀에게 죽임을 당했어요 (당하는 일)\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"k-ez\" data-hl=\"ge\">내가 당한 일을 말할 때는 be동사와 함께 killed처럼 말해요. Many kings were killed by poisons는 '많은 왕들이 독 때문에 \u003cb class=\"key\">죽임을 \u003c/b>\u003cb class=\"key\">당했어요\u003c/b>'라는 뜻이에요.\u003c/div>\u003c/div>","segs":[{"n":99,"text":"두 번째 문법은 '당했어요'를 말하는 방법이에요. 대표 문장은 Many kings were also killed by poisons예요. Many kings는 '많은 왕들이', were also killed는 '또한 죽임을 당했어요', by poisons는 '독에 의해'라는 뜻이에요. 내가 죽이는 것과 내가 당하는 것은 아주 달라요. He killed the snake는 '그가 뱀을 죽였어요', He was killed by the snake는 '그가 뱀에게 죽임을 당했어요'가 된답니다.","hl":"gb"},{"n":100,"text":"내가 당한 일을 말할 때는 be동사와 함께 killed처럼 말해요. Many kings were killed by poisons는 '많은 왕들이 독 때문에 죽임을 당했어요'라는 뜻이에요.","hl":"ge"}]},{"html":"\u003cspan class=\"lp-tag\">확인해요\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-gt\">\u003cspan>💀\u003c/span>'당했어요'는 were killed\u003c/div>\u003cdiv class=\"k-ex\" data-hl=\"gx\">\u003cdiv>\u003cspan class=\"e\">🍰\u003c/span>\u003cb>The cake was eaten by my dog.\u003c/b>\u003csmall>그 케이크는 내 강아지에게 먹혔어요.\u003c/small>\u003c/div>\u003cdiv>\u003cspan class=\"e\">🪟\u003c/span>\u003cb>The window was broken by the ball.\u003c/b>\u003csmall>그 창문은 공에 맞아 깨졌어요.\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"k-ck\" data-hl=\"gc\">\u003cdiv class=\"q\">Many kings \u003cspan class=\"k-ans\" data-rv=\"gc\">were\u003c/span> killed by poisons.\u003c/div>\u003csmall>많은 왕들이 독에 의해 죽임을 당했어요.\u003c/small>\u003cdiv class=\"o\">\u003cspan class=\"k-right\" data-rv=\"gc\">were\u003c/span>\u003cspan>was\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":101,"text":"예문을 더 볼까요?","hl":"gx"},{"n":102,"text":"The cake was eaten by my dog.","hl":"gx","v":"n","pause":600},{"n":103,"text":"그 케이크는 내 강아지에게 먹혔어요.","hl":"gx"},{"n":104,"text":"The window was broken by the ball.","hl":"gx","v":"n","pause":600},{"n":105,"text":"그 창문은 공에 맞아 깨졌어요.","hl":"gx"},{"n":106,"text":"문제를 풀어 볼까요? Many kings 빈칸 killed by poisons. 빈칸에 들어갈 말은 were, 아니면 was 중에서 무엇일까요?","hl":"gc"},{"n":107,"text":"정답은 were! Many kings were killed by poisons.","hl":"gc","rv":"gc"}]},{"html":"\u003cspan class=\"lp-tag\">내용 확인 문제\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-qq\" data-hl=\"q0\">\u003ci>1\u003c/i>\u003cdiv>\u003cdiv class=\"q\">옛날 사람들은 동물을 사냥할 때 뱀독을 사용했어요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q0\">O\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q1\">\u003ci>2\u003c/i>\u003cdiv>\u003cdiv class=\"q\">여자들은 그 가루가 위험하다는 것을 알고 있었어요.\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q1\">X\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q2\">\u003ci>3\u003c/i>\u003cdiv>\u003cdiv class=\"q\">왕들은 독을 무엇에 사용했나요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 적을 죽이는 데\u003c/span>\u003cspan>② 요리를 하는 데\u003c/span>\u003cspan>③ 옷을 만드는 데\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q2\">적을 죽이는 데\u003c/span>\u003c/div>\u003cdiv class=\"k-qq\" data-hl=\"q3\">\u003ci>4\u003c/i>\u003cdiv>\u003cdiv class=\"q\">사람들이 병을 치료하기 위해 사용한 것은 무엇인가요?\u003c/div>\u003cdiv class=\"o\">\u003cspan>① 독초\u003c/span>\u003cspan>② 뱀독\u003c/span>\u003cspan>③ 화장 가루\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"k-ans\" data-rv=\"q3\">독초\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":108,"text":"이제 문제를 풀어 볼까요? 지문을 다시 보면서 답을 찾아보아요.","hl":null},{"n":109,"text":"첫 번째 문제. 옛날 사람들은 동물을 사냥할 때 뱀독을 사용했어요. 맞으면 O, 틀리면 X예요.","hl":"q0"},{"n":110,"text":"정답은 O, 맞아요.","hl":"q0","rv":"q0"},{"n":111,"text":"두 번째 문제. 여자들은 그 가루가 위험하다는 것을 알고 있었어요. 맞으면 O, 틀리면 X예요.","hl":"q1"},{"n":112,"text":"정답은 X, 틀려요.","hl":"q1","rv":"q1"},{"n":113,"text":"세 번째 문제. 왕들은 독을 무엇에 사용했나요? 첫 번째, 적을 죽이는 데. 두 번째, 요리를 하는 데. 세 번째, 옷을 만드는 데","hl":"q2"},{"n":114,"text":"정답은 적을 죽이는 데예요.","hl":"q2","rv":"q2"},{"n":115,"text":"네 번째 문제. 사람들이 병을 치료하기 위해 사용한 것은 무엇인가요? 첫 번째, 독초. 두 번째, 뱀독. 세 번째, 화장 가루","hl":"q3"},{"n":116,"text":"정답은 독초예요.","hl":"q3","rv":"q3"}]},{"html":"\u003cspan class=\"lp-tag\">이야기 요약하기\u003c/span>\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-bank\">\u003cspan>daily life\u003c/span>\u003cspan>makeup\u003c/span>\u003cspan>poisonous plants\u003c/span>\u003cspan>poisons\u003c/span>\u003c/div>\u003cdiv class=\"k-sum\" data-hl=\"sm\">Long ago, people used nature's \u003cspan class=\"k-ans\" data-rv=\"sm\">poisons\u003c/span> to hunt and to fight enemies. Later, they used poisons in \u003cspan class=\"k-ans\" data-rv=\"sm\">daily life\u003c/span>, like \u003cspan class=\"k-ans\" data-rv=\"sm\">poisonous plants\u003c/span> for curing and powder for \u003cspan class=\"k-ans\" data-rv=\"sm\">makeup\u003c/span>. The powder was dangerous, but they didn't know that.\u003c/div>\u003cdiv class=\"k-sk\">오래전에 사람들은 사냥하고 적과 싸우는 데 자연의 독을 사용했어요. 나중에는 일상생활에서 독을 사용했지요. 병을 치료할 때는 독초를, 화장할 때는 독이 있는 가루를 썼어요. 그 가루는 위험했지만 사람들은 그것을 몰랐어요.\u003c/div>\u003c/div>","segs":[{"n":117,"text":"마지막으로 오늘 이야기를 세 문장으로 정리해 볼게요. 독은 사냥에도, 싸움에도, 그리고 화장에도 쓰였어요.","hl":null},{"n":118,"text":"Long ago, people used nature's poisons to hunt and to fight enemies. Later, they used poisons in daily life, like poisonous plants for curing and powder for makeup. The powder was dangerous, but they didn't know that.","hl":"sm","rv":"sm","v":"n"},{"n":119,"text":"오래전에 사람들은 사냥하고 적과 싸우는 데 자연의 독을 사용했어요. 나중에는 일상생활에서 독을 사용했지요. 병을 치료할 때는 독초를, 화장할 때는 독이 있는 가루를 썼어요. 그 가루는 위험했지만 사람들은 그것을 몰랐어요.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>Dangerous Poison 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":120,"text":"여러분, 오늘 정말 잘했어요! 독처럼 무서운 것도 역사 속에서 어떻게 쓰였는지 알게 되었죠? 다음 시간에 또 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
