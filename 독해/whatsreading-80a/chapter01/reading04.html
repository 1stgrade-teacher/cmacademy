ube until his death.","hl":"sm","rv":"sm","v":"n"},{"n":109,"text":"Thomas Edison은 Henry Ford의 어린 시절 영웅이었어요. Ford는 1896년에 Edison을 만났고, 두 사람은 좋은 친구가 되었어요. Ford는 Edison의 마지막 숨을 시험관에 담아 자신이 죽을 때까지 간직했어요.","hl":null}]},{"html":"\u003cdiv class=\"k-sl\">\u003cdiv class=\"k-cover\">\u003cdiv class=\"k-big\">🎉\u003c/div>\u003ch1>Great job!\u003c/h1>\u003ch2>Ford and Edison 공부 끝!\u003c/h2>\u003c/div>\u003c/div>","segs":[{"n":110,"text":"여러분, 오늘 정말 멋진 이야기를 읽었어요. 두 사람의 깊은 우정이 느껴졌나요? 다음 시간에도 재미있는 이야기로 만나요. 오늘도 수고했어요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
