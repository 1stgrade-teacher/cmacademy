</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"왓츠 리딩 100A Ch.4 Unit 03 Under the Sea","audioDir":"reading03_audio","preview":false,"count":48,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.520em\">Ch.4 Unit\u003cbr>03 Under\u003cbr>the Sea\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">왓츠 리딩 100A\u003c/div>\u003ch1>Under the Sea: How Deep Sea Fish Survive\u003c/h1>\u003ch2>바다 속: 심해어는 어떻게 살아남을까?\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">한 줄 요약\u003c/span>\u003cspan>빛이 닿지 않는 깊은 바다에도 \u003cb class=\"key\">다양한 \u003c/b>\u003cb class=\"key\">물고기\u003c/b>가 살아요. 심해어는 \u003cb class=\"key\">커다란 \u003c/b>\u003cb class=\"key\">입\u003c/b>과 \u003cb class=\"key\">빛\u003c/b> 같은 자기만의 방법으로 먹이를 잡고 살아남아요.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Deep sea fish have their own ways to survive in the dark ocean.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘도 만나서 정말 반가워요. 오늘은 왓츠 리딩의 Under the Sea라는 글을 함께 읽어 볼 거예요. 깊고 깜깜한 바닷속 물고기들이 어떻게 살아남는지 알려 주는 이야기예요. 한 줄로 말하면, 심해 물고기는 자기만의 방법으로 살아남는다는 내용이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">미리 알면 쉬워요\u003c/span>\u003cdiv class=\"lp-box\">바다에서 빛은 아주 깊이 들어가지 못해요. 그래서 깊은 바다는 깜깜하고, 그곳에서는 아무것도 보이지 않아요. 이렇게 아주 깊은 바다를 \u003cb class=\"key\">심해\u003c/b>라고 하고, 영어로는 deep sea라고 해요. 어두운 방에서 손전등을 비추면 가까운 곳만 밝아지는 것과 같아요. 그래서 심해 물고기들은 눈보다 \u003cb class=\"key\">입\u003c/b>이나 \u003cb class=\"key\">빛\u003c/b> 같은 다른 도구를 이용해 먹이를 찾아요.\u003c/div>","segs":[{"n":2,"text":"바다에서 빛은 아주 깊이 들어가지 못해요. 그래서 깊은 바다는 깜깜하고, 우리는 그곳을 심해라고 불러요. 영어로는 deep sea라고 해요. 여러분이 어두운 방에서 손전등을 비추면 가까운 곳만 밝아지는 것처럼, 바닷속도 아래로 갈수록 점점 어두워져요. 그런데 그렇게 어두운 곳에도 물고기가 살고 있을까요? 네, 정말 많이 살아요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>깜깜한 심해\u003csmall>시작 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>빛은 바다 \u003cb class=\"key\">깊이\u003c/b> 들어갈 수 없어요. 그래서 그 아래는 아무것도 보이지 않아요. 하지만 그곳에도 다양한 물고기가 살고, 심해어는 살아남는 \u003cb class=\"key\">자신만의 \u003c/b>\u003cb class=\"key\">방법\u003c/b>을 가지고 있어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>큰 입의 이유\u003csmall>이유 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>심해에서는 \u003cb class=\"key\">먹이\u003c/b>를 찾기가 아주 어려워요. 그래서 그것들 대부분은 \u003cb class=\"key\">커다란 \u003c/b>\u003cb class=\"key\">입\u003c/b>을 가지고 있어요. 그 입으로 자기보다 \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">큰 \u003c/b>\u003cb class=\"key\">물고기\u003c/b>도 실제로 삼킬 수 있어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>anglerfish의 빛\u003csmall>예시 · 문장 6–8\u003c/small>\u003c/h4>\u003cp>anglerfish는 머리에 \u003cb class=\"key\">낚싯대\u003c/b>가 있어요. 그 낚싯대 끝에는 \u003cb class=\"key\">파란 \u003c/b>\u003cb class=\"key\">빛\u003c/b>이 있어요. 다른 물고기들이 그 빛을 향해 헤엄쳐 오면 anglerfish의 \u003cb class=\"key\">입\u003c/b> 안에 도착하게 돼요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>stoplight loosejaw의 빛\u003csmall>또 다른 예시 · 문장 9–12\u003c/small>\u003c/h4>\u003cp>stoplight loosejaw도 anglerfish처럼 빛나지만 \u003cb class=\"key\">빨간 \u003c/b>\u003cb class=\"key\">빛\u003c/b>이에요. 이 빛을 먹이를 찾고 \u003cb class=\"key\">서로\u003c/b> 의사소통하는 데 사용해요. 그리고 이름이 보여주듯이 입을 \u003cb class=\"key\">활짝\u003c/b> 벌릴 수 있어요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 오늘 글의 흐름을 네 단계로 나눠서 살펴볼게요.","hl":null},{"n":4,"text":"첫 번째 단계에서는 깊은 바다가 아주 어둡다는 이야기를 해요. 빛이 깊이 들어갈 수 없어서 아무것도 볼 수 없죠. 하지만 그 아래에도 다양한 물고기가 살고 있고, 심해어는 자신만의 방법을 가지고 있어요.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 왜 입이 큰지 알려 줘요. 먹이를 찾기가 어렵기 때문에 그것들 대부분이 커다란 입을 가지고 있어요. 그 입으로 자기보다 더 큰 물고기도 실제로 삼킬 수 있대요.","hl":"f1"},{"n":6,"text":"세 번째 단계에서는 anglerfish가 나와요. 머리에 낚싯대가 있고, 그 끝에 파란 빛이 있어요. 다른 물고기들이 그 빛을 향해 헤엄쳐 오면 anglerfish의 입 안에 도착하게 돼요.","hl":"f2"},{"n":7,"text":"네 번째 단계에서는 stoplight loosejaw가 나와요. 이것도 anglerfish처럼 빛나지만 빨간 빛이에요. 이 빛으로 먹이를 찾고 서로 의사소통을 해요. 그리고 이름이 보여주듯이 입을 활짝 벌릴 수 있어요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">예시 들기\u003c/span>\u003cspan class=\"lp-pill\">처음\u003c/span>\u003cspan class=\"lp-pill\">주제문 3번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 심해 물고기가 살아남는 방법을 알려 주고, 두 물고기를 \u003cb class=\"key\">예\u003c/b>로 들어 보여 줘요. \u003cb class=\"key\">중심 \u003c/b>\u003cb class=\"key\">문장\u003c/b>이 처음에 나와서 글 전체의 주제를 알려 줘요. 그다음 anglerfish와 stoplight loosejaw를 차례대로 \u003cb class=\"key\">예시\u003c/b>로 설명해요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Because (4)\u003c/b>\u003cspan>이유를 알려 줌\u003c/span>\u003cb>When (8)\u003c/b>\u003cspan>때를 알려 줌\u003c/span>\u003cb>But (10)\u003c/b>\u003cspan>반대 내용을 이어 줌\u003c/span>\u003cb>As (12)\u003c/b>\u003cspan>이름과 내용을 연결해 줌\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Fish under the deep sea\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">most of them\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">they\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>anglerfish\u003c/th>\u003cth>stoplight loosejaw\u003c/th>\u003c/tr>\u003ctr>\u003ctd>낚싯대 끝에 파란 빛\u003c/td>\u003ctd>몸에서 빨간 빛\u003c/td>\u003c/tr>\u003ctr>\u003ctd>빛으로 다른 물고기를 입으로 부름\u003c/td>\u003ctd>빛으로 먹이를 찾고 서로 대화함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>자기보다 큰 물고기를 삼킴\u003c/td>\u003ctd>입을 활짝 벌릴 수 있음\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 심해 물고기가 살아남는 방법을 예를 들어 설명하는 글이에요. 중심 문장은 글의 처음에 나오는 세 번째 문장이에요. 심해어는 자기만의 방법이 있다고 먼저 알려 주고, 그다음에 두 물고기를 예로 보여 주죠.","hl":"ty"},{"n":9,"text":"글에는 길잡이 말이 숨어 있어요. Because는 이유를 알려 주고, When은 때를 알려 주고, But은 반대 내용을 이어 줘요. 그리고 같은 물고기를 fish under the deep sea, most of them, they처럼 다르게 부르기도 해요. 이런 말을 찾으면 글의 짜임이 보여요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 단어\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>light\u003c/b>\u003cem>명사\u003c/em>\u003cspan>빛\u003c/span>\u003c/div>\u003cdiv>\u003cb>deep\u003c/b>\u003cem>부사\u003c/em>\u003cspan>깊이, 깊게\u003c/span>\u003c/div>\u003cdiv>\u003cb>ocean\u003c/b>\u003cem>명사\u003c/em>\u003cspan>바다\u003c/span>\u003c/div>\u003cdiv>\u003cb>anything\u003c/b>\u003cem>대명사\u003c/em>\u003cspan>어떤 것도\u003c/span>\u003c/div>\u003cdiv>\u003cb>various\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>다양한\u003c/span>\u003c/div>\u003cdiv>\u003cb>survive\u003c/b>\u003cem>동사\u003c/em>\u003cspan>살아남다\u003c/span>\u003c/div>\u003cdiv>\u003cb>difficult\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>어려운\u003c/span>\u003c/div>\u003cdiv>\u003cb>most of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>대부분의\u003c/span>\u003c/div>\u003cdiv>\u003cb>large\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>커다란\u003c/span>\u003c/div>\u003cdiv>\u003cb>actually\u003c/b>\u003cem>부사\u003c/em>\u003cspan>실제로\u003c/span>\u003c/div>\u003cdiv>\u003cb>swallow\u003c/b>\u003cem>동사\u003c/em>\u003cspan>삼키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>bigger than\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~보다 더 큰\u003c/span>\u003c/div>\u003cdiv>\u003cb>fishing pole\u003c/b>\u003cem>명사\u003c/em>\u003cspan>낚싯대\u003c/span>\u003c/div>\u003cdiv>\u003cb>at the end\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>끝에\u003c/span>\u003c/div>\u003cdiv>\u003cb>swim toward\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 향해 헤엄치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>arrive\u003c/b>\u003cem>동사\u003c/em>\u003cspan>도착하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>light up\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>빛나다, 불을 밝히다\u003c/span>\u003c/div>\u003cdiv>\u003cb>communicate with\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~와 의사소통하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>each other\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>서로\u003c/span>\u003c/div>\u003cdiv>\u003cb>wide\u003c/b>\u003cem>부사\u003c/em>\u003cspan>활짝, 넓게\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"오늘의 단어를 몇 개 소리 내어 읽어 볼게요. survive는 살아남다, swallow는 삼키다, various는 다양한이라는 뜻이에요. fishing pole은 낚싯대, communicate with는 의사소통하다라는 뜻이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">deep\u003c/b>\u003cspan class=\"m\">깊은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">far down\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">shallow\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">difficult\u003c/b>\u003cspan class=\"m\">어려운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">hard\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">easy\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">large\u003c/b>\u003cspan class=\"m\">큰\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">big\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">small\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">survive\u003c/b>\u003cspan class=\"m\">살아남다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">live\u003c/span>\u003cspan class=\"s\">stay alive\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">die\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">wide\u003c/b>\u003cspan class=\"m\">넓은, 활짝\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">open\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">narrow\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"비슷한 말과 반대말도 함께 익혀 봐요. deep은 깊은이고, 비슷한 말은 far down, 반대말은 shallow예요. difficult는 어려운이고, 비슷한 말은 hard, 반대말은 easy예요. large는 큰이고, 비슷한 말은 big, 반대말은 small이에요. 그리고 survive의 반대말은 die예요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">빛은 갈 수 없어요\u003c/span>\u00 /b>이 있다는 것을 알려 줘요. 앞 문장에서 말한 낚싯대가 어떻게 생겼는지 자세히 설명해 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">한 사람·한 개일 때 동사 + s(3인칭 단수)\u003c/span> : 그것(The pole) + 가진다(has) + 무엇을(a blue light) : \"가지고 있습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소 짝꿍 말(전치사)\u003c/span> : at + the end = [[끝에]] : \"끝에\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"The pole, 그 낚싯대는. has a blue light, 파란 빛을 가지고 있어요. at the end, 끝에. 이 문장 전체를 해석하면, 그 낚싯대 끝에는 파란 빛이 있습니다.","hl":"m"},{"n":31,"text":"이 문장은 anglerfish 머리에 있는 낚싯대 끝에 파란 빛이 있다고 알려 줘요. 앞에서 말한 낚싯대가 어떤 모양인지 자세히 설명해 주는 거예요.","hl":"mn"},{"n":32,"text":"먼저 The pole은 한 개를 가리켜요. 그래서 have가 아니라 has를 써야 하죠. 그리고 at the end에서 at은 장소 짝꿍 말이에요. the end와 만나서 맨 끝에라는 뜻이 된답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 12\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 물고기들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">other \u003c/span>\u003cspan class=\"tgt\">fish \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 빛을 향해 헤엄치면,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">swim \u003c/span>\u003cspan class=\"tgt\">toward \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">light,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들은 도착해요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">arrive\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">입 안에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003 >\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">stoplight loosejaw들은\u003c/span>\u003cspan class=\"en\">Stoplight loosejaws\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또한 빛나요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">also\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">light \u003c/span>\u003cspan class=\"tgt\">up\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">anglerfish처럼\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">anglerfish\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">stoplight loosejaw 또한 anglerfish처럼 빛납니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> stoplight loosejaw도 anglerfish처럼 \u003cb class=\"key\">빛을 \u003c/b>\u003cb class=\"key\">낸다\u003c/b>는 것을 알려 줘요. 두 물고기의 \u003cb class=\"key\">비슷한 \u003c/b>\u003cb class=\"key\">점\u003c/b>을 이어서 설명하는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">더 자세히 알려 주는 말(부사)\u003c/span> : also + 동사 = [[또한]] 그렇게 한다 : \"또한\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">하는 일을 말하는 동사(동사)\u003c/span> : 누가(They) + 빛나다(light up) : \"빛나다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">~처럼 비교하는 짝꿍 말(전치사)\u003c/span> : like + 무엇 = [[~처럼]] : \"anglerfish처럼\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Stoplight loosejaws, stoplight loosejaw들은. also light up, 또한 빛나요. like anglerfish, anglerfish처럼. 이 문장 전체를 해석하면, stoplight loosejaw 또한 anglerfish처럼 빛납니다.","hl":"m"},{"n":37,"text":"이 문장은 stoplight loosejaw도 anglerfish처럼 빛을 낸다고 말해요. 두 물고기의 비슷한 점을 이어서 알려 주는 거예요.","hl":"mn"},{"n":38,"text":"먼저 light up은 빛을 내다는 뜻을 가진 동사 /span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 사용합니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">use\u003c/span> it\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">먹이를 찾기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">look \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">food\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 의사소통합니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">and\u003c/span> communicate\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">서로\u003c/span>\u003cspan class=\"en\">with each other.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">stoplight loosejaw는 먹이를 찾고 서로 의사소통을 하기 위해 그것을 사용합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 물고기들은 빨간 빛을 \u003cb class=\"key\">먹이\u003c/b>를 찾을 때와 서로 \u003cb class=\"key\">의사소통\u003c/b>할 때 써요. 빛이 살아가는 데 꼭 필요한 도구가 된다는 걸 알려 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">하는 일 말(동사)\u003c/span> : 물고기들은(The fish) + 사용합니다(use) + 그것을(it) : \"사용합니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to + 동사원형(to부정사)\u003c/span> : ~하기 위해(to + 동사원형) + 찾다(look for) + 먹이를(food) : \"먹이를 찾기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 찾다(look for) + 그리고(and) + 의사소통하다(communicate) : \"그리고\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"The fish, 그 물고기들은. use it, 그것을 사용합니다. to look for food, 먹이를 찾기 위해. and communicate, 그리고 의사소통합니다. with each other, 서로. 이 문장 전체를 해석하면, stoplight loosejaw는 먹이를 찾고 서로 의사소통을 하기 위해 그것을 사용합니다.","hl":"m"},{"n":43,"text":"이 물고기들은 빨간 빛을 아주 요긴하게 써요. 먹이를 찾을 때도 쓰고, 서로 신호를 주고받을 때도 써요.","hl":"mn"},{"n":44,"text":"첫 번째, The fish는 여러 마리라서 동사에 s를 붙이지 않고 use를 그대로 써요. 두 번째, to look for food는 먹이를 찾기 위해라는 뜻이에요. 무엇을 하는 목적을 말할 때 to와 동사원형을 붙여요. 세 번째, and는 두 가지 하는 일을 이어 주는 접속사예요. 그래서 그리고라고 해석해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들의 이름이 보여주듯이,\u003c/span>\u003cspan class=\"en\">As their name shows,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들은 벌릴 수 있습니다\u003c/span>\u003cspan class=\"en\">they \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">open\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들의 입을 활짝\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">mouths\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">wide\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것들의 이름이 보여주듯이, 그것들은 입을 활짝 벌릴 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이름에 stoplight가 들어 있듯이 이 물고기는 입을 아주 크게 벌릴 수 있어요. \u003cb class=\"key\">이름\u003c/b>과 \u003cb class=\"key\">생김새\u003c/b>가 딱 맞아떨어진다는 걸 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">도와주는 동사(조동사) can\u003c/span> : 할 수 있다(can) + 벌리다(open) : \"벌릴 수 있습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">소유격(대명사)\u003c/span> : 그것들의(their) + 입들(mouths) : \"그것들의 입을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">더 자세히 알려 주는 말(부사)\u003c/span> : 벌리다(open) + 활짝(wide) : \"활짝\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"As their name shows, 그것들의 이름이 보여주듯이. they can open, 그것들은 벌릴 수 있습니다. their mouths wide, 그것들의 입을 활짝. 이 문장 전체를 해석하면, 그것들의 이름이 보여주듯이, 그것들은 입을 활짝 벌릴 수 있습니다.","hl":"m"},{"n":46,"text":"As their name shows는 이름이 보여주듯이 라는 뜻의 덩어리 표현이에요. 이름처럼 입을 아주 크게 벌릴 수 있다는 걸 알려 주는 문장이죠.","hl":"mn"},{"n":47,"text":"첫 번째, can은 도와주는 동사라서 뒤에 동사원형 open이 와요. can이 할 수 있다는 뜻을 더해 줘요. 두 번째, their는 그것들의라는 뜻으로 뒤에 오는 명사를 꾸며 줘요. 세 번째, wide는 활짝이라는 뜻으로 open을 더 자세히 알려 주는 부사예요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">오늘 배운 내용 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>빛은 바다 \u003cb class=\"key\">깊이\u003c/b> 들어갈 수 없어서 심해는 아주 어두워요.\u003c/li>\u003cli>먹이를 찾기 어려워서 심해어는 \u003cb class=\"key\">커다란 \u003c/b>\u003cb class=\"key\">입\u003c/b>으로 자기보다 큰 물고기를 삼켜요.\u003c/li>\u003cli>anglerfish는 머리의 낚싯대 끝 \u003cb class=\"key\">파란 \u003c/b>\u003cb class=\"key\">빛\u003c/b>으로 다른 물고기를 부른 뒤 입으로 잡아요.\u003c/li>\u003cli>stoplight loosejaw는 \u003cb class=\"key\">빨간 \u003c/b>\u003cb class=\"key\">빛\u003c/b>으로 먹이를 찾고 서로 의사소통을 해요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Deep sea fish have their own ways to survive in the dark ocean.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">빛이 닿지 않는 깊은 바다에도 \u003cb class=\"key\">다양한 \u003c/b>\u003cb class=\"key\">물고기\u003c/b>가 살아요. 심해어는 \u003cb class=\"key\">커다란 \u003c/b>\u003cb class=\"key\">입\u003c/b>과 \u003cb class=\"key\">빛\u003c/b> 같은 자기만의 방법으로 먹이를 잡고 살아남아요.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":48,"text":"오늘 우리는 심해 물고기가 살아남는 방법을 배웠어요. 깜깜한 바다에서도 큰 입과 빛으로 멋지게 살아가고 있었죠. 여러분도 오늘 배운 표현을 꼭 소리 내어 읽어 보세요. 정말 잘했어요, 다음 시간에 또 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
