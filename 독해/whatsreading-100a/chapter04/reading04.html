</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"왓츠 리딩 100A Ch.4 Unit 04 A River Dolphin","audioDir":"reading04_audio","preview":false,"count":51,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.468em\">Ch.4 Unit\u003cbr>04 A River\u003cbr>Dolphin\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">왓츠 리딩 100A\u003c/div>\u003ch1>The Princess Who Became a River Dolphin\u003c/h1>\u003ch2>돌고래가 된 공주\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">한 줄 요약\u003c/span>\u003cspan>아름다운 공주가 왕의 명령을 거절해 강에 던져졌지만, 강의 여신이 그녀를 \u003cb class=\"key\">돌고래\u003c/b>로 구해 줘요. 뒤늦게 \u003cb class=\"key\">후회\u003c/b>한 왕은 강의 돌고래를 \u003cb class=\"key\">보호\u003c/b>하게 되고, 돌고래는 평화와 보호의 \u003cb class=\"key\">상징\u003c/b>이 됩니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>A river goddess saves a princess by changing her into a dolphin, and the king learns to protect dolphins.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 아름다운 공주와 강의 돌고래에 관한 재미있는 이야기를 읽어 볼 거예요. 공주가 어려움을 겪지만 강의 여신의 도움으로 돌고래가 되고, 마지막에는 왕이 돌고래를 보호하게 되는 이야기예요. 함께 천천히 읽어 볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">미리 알면 쉬워요\u003c/span>\u003cdiv class=\"lp-box\">중국에는 \u003cb class=\"key\">양쯔강(Yangtze \u003c/b>\u003cb class=\"key\">River)\u003c/b>이라는 아주 긴 강이 있어요. 이 강에는 \u003cb class=\"key\">강돌고래(river \u003c/b>\u003cb class=\"key\">dolphin)\u003c/b>처럼 물에 사는 동물이 살아요. 우리가 학교에서 친구를 보호해 주면 친구가 안심하듯, 강의 동물도 사람이 보호해 주면 안전해져요. 그래서 강을 깨끗하게 하고 동물을 함부로 잡지 않는 일이 중요해요.\u003c/div>","segs":[{"n":2,"text":"여러분, 중국에는 Yangtze River라는 아주 긴 강이 있어요. 이 강에는 river dolphin 같은 물에 사는 동물이 살아요. 우리말로는 양쯔강과 강돌고래라고 해요. 우리가 학교에서 친구를 보호해 주면 친구가 안심하듯, 강의 동물도 사람이 보호해 주면 안전해져요. 여러분은 강에 사는 동물을 어떻게 도와줄 수 있을까요?","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>공주와 왕\u003csmall>시작 · 문장 1–4\u003c/small>\u003c/h4>\u003cp>아름답고 영리한 \u003cb class=\"key\">공주\u003c/b>가 아버지인 \u003cb class=\"key\">왕\u003c/b>과 양쯔강 근처에서 살았어요. 어느 날 왕은 공주와 결혼할 남자를 정했지만, 공주는 \u003cb class=\"key\">거절\u003c/b>했어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>강에 던져짐\u003csmall>문제 · 문장 5–8\u003c/small>\u003c/h4>\u003cp>왕은 공주가 \u003cb class=\"key\">명령\u003c/b>을 따르지 않아 화가 나서 공주를 배에 태워 강에 던졌어요. 하지만 강의 \u003cb class=\"key\">여신\u003c/b>이 공주를 구하고 \u003cb class=\"key\">돌고래\u003c/b>로 바꾸어 주었어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>폭풍과 구조\u003csmall>바뀜 · 문장 9–11\u003c/small>\u003c/h4>\u003cp>돌고래가 왕 이야기를 하자 여신은 화가 나서 \u003cb class=\"key\">폭풍\u003c/b>을 만들었어요. 왕의 배가 가라앉았지만, 돌고래가 아버지인 왕을 \u003cb class=\"key\">구했어요\u003c/b>.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>후회와 보호\u003csmall>마무리 · 문장 12–13\u003c/small>\u003c/h4>\u003cp>왕은 자신의 행동을 \u003cb class=\"key\">후회\u003c/b>하고 강의 돌고래를 \u003cb class=\"key\">보호\u003c/b>하기 시작했어요. 그래서 돌고래는 평화와 보호의 \u003cb class=\"key\">상징\u003c/b>이 되었어요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 이야기가 어떤 순서로 흘러가는지 함께 살펴볼게요.","hl":null},{"n":4,"text":"먼저 아름답고 영리한 공주가 아버지인 왕과 양쯔강 근처에서 살았어요. 어느 날 왕은 공주와 결혼할 남자를 정했지만, 공주는 거절했어요.","hl":"f0"},{"n":5,"text":"그래서 왕은 공주가 명령을 따르지 않아 매우 화가 났어요. 왕은 공주를 배에 태워 강에 던졌지만, 강의 여신이 공주를 구해 돌고래로 바꾸어 주었어요.","hl":"f1"},{"n":6,"text":"돌고래가 왕 이야기를 하자 여신은 화가 나서 폭풍을 만들었어요. 왕의 배가 가라앉았지만, 돌고래가 아버지인 왕을 구했어요.","hl":"f2"},{"n":7,"text":"왕은 자신의 행동을 후회하고 강의 돌고래를 보호하기 시작했어요. 그래서 돌고래는 평화와 보호의 상징이 되었어요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">이야기 순서(처음-가운데-끝)\u003c/span>\u003cspan class=\"lp-pill\">끝\u003c/span>\u003cspan class=\"lp-pill\">주제문 13번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 공주가 돌고래가 되고 왕이 \u003cb class=\"key\">후회\u003c/b>하는 사건을 시간 순서로 들려줘요. 마지막 문장에서 돌고래가 평화와 보호의 \u003cb class=\"key\">상징\u003c/b>이 되었다고 알려 주어 글의 주제를 보여 줘요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Once (1)\u003c/b>\u003cspan>이야기 시작을 알려 줌\u003c/span>\u003cb>One day (3)\u003c/b>\u003cspan>때를 알려 줌\u003c/span>\u003cb>But (4)\u003c/b>\u003cspan>반대 내용을 알려 줌\u003c/span>\u003cb>because (5)\u003c/b>\u003cspan>이유를 알려 줌\u003c/span>\u003cb>When (9)\u003c/b>\u003cspan>때를 알려 줌\u003c/span>\u003cb>But (11)\u003c/b>\u003cspan>반대 내용을 알려 줌\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">a beautiful and smart princess\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">she\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">her\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a dolphin\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the dolphin\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 시간 순서에 따라 처음, 가운데, 끝이 있는 이야기로 되어 있어요. 글의 중심 생각은 마지막 부분에 나오는 돌고래가 평화와 보호의 상징이 되었다는 문장이에요.","hl":"ty"},{"n":9,"text":"Once나 One day 같은 말은 이야기의 때를 알려 주고, But은 앞 내용과 반대되는 일을 알려 줘요. Because는 이유를, When은 어떤 일이 일어난 때를 알려 주죠. 또 공주는 she나 her, a dolphin, the dolphin처럼 다르게 불려요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 단어\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>beautiful\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>아름다운\u003c/span>\u003c/div>\u003cdiv>\u003cb>smart\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>영리한\u003c/span>\u003c/div>\u003cdiv>\u003cb>princess\u003c/b>\u003cem>명사\u003c/em>\u003cspan>공주\u003c/span>\u003c/div>\u003cdiv>\u003cb>king\u003c/b>\u003cem>명사\u003c/em>\u003cspan>왕\u003c/span>\u003c/div>\u003cdiv>\u003cb>choose\u003c/b>\u003cem>동사\u003c/em>\u003cspan>선택하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>marry\u003c/b>\u003cem>동사\u003c/em>\u003cspan>결혼하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>say no\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>거절하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>follow\u003c/b>\u003cem>동사\u003c/em>\u003cspan>따르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>order\u003c/b>\u003cem>명사\u003c/em>\u003cspan>명령\u003c/span>\u003c/div>\u003cdiv>\u003cb>throw\u003c/b>\u003cem>동사\u003c/em>\u003cspan>던지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>goddess\u003c/b>\u003cem>명사\u003c/em>\u003cspan>여신\u003c/span>\u003c/div>\u003cdiv>\u003cb>save\u003c/b>\u003cem>동사\u003c/em>\u003cspan>구하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>feel sorry for\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>안쓰럽게 여기다\u003c/span>\u003c/div>\u003cdiv>\u003cb>change A into B\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>A를 B로 바꾸다\u003c/span>\u003c/div>\u003cdiv>\u003cb>storm\u003c/b>\u003cem>명사\u003c/em>\u003cspan>폭풍\u003c/span>\u003c/div>\u003cdiv>\u003cb>sink\u003c/b>\u003cem>동사\u003c/em>\u003cspan>가라앉다\u003c/span>\u003c/div>\u003cdiv>\u003cb>regret\u003c/b>\u003cem>동사\u003c/em>\u003cspan>후회하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>protect\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보호하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>symbol\u003c/b>\u003cem>명사\u003c/em>\u003cspan>상징\u003c/span>\u003c/div>\u003cdiv>\u003cb>peace\u003c/b>\u003cem>명사\u003c/em>\u003cspan>평화\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"오늘은 beautiful, smart, princess, goddess, storm, regret 같은 단어를 소리 내어 읽어 볼게요. beautiful은 아름다운, smart는 영리한, princess는 공주라는 뜻이에요. goddess는 여신, storm은 폭풍, regret은 후회하다라는 뜻이죠. 큰 소리로 따라 읽어 보세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">beautiful\u003c/b>\u003cspan class=\"m\">아름다운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">pretty\u003c/span>\u003cspan class=\"s\">lovely\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ugly\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">smart\u003c/b>\u003cspan class=\"m\">영리한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">clever\u003c/span>\u003cspan class=\"s\">bright\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">silly\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">save\u003c/b>\u003cspan class=\"m\">구하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">help\u003c/span>\u003cspan class=\"s\">rescue\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hurt\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">protect\u003c/b>\u003cspan class=\"m\">보호하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">guard\u003c/span>\u003cspan class=\"s\">keep safe\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hurt\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">peace\u003c/b>\u003cspan class=\"m\">평화\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">calm\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">war\u003c/span>\u003cspan class=\"a\">fight\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"비슷한 말도 함께 익혀 볼게요. beautiful은 pretty나 lovely와 비슷하고, smart는 clever나 bright와 비슷해요. save는 help나 rescue와 비슷하고, protect는 guard나 keep safe와 비슷하죠. peace는 calm과 비슷하지만 war나 fight와는 반대말이에요. 이렇게 짝을 지어 기억하면 훨씬 오래 남아요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">옛날에 살았어요\u003c/span>\u003cspan class=\"en\">Once \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">lived\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아름답고 영리한 공주가\u003c/span>\u003cspan class=\"en\">a \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">beautiful \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">smart\u003c/span> princess.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">옛날에 아름답고 영리한 공주가 살았습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이야기의 첫 문장으로, 아름답고 영리한 \u003cb class=\"key\">공주\u003c/b>를 \u003cb class=\"key\">소개\u003c/b>해요. 옛날이야기가 시작된다는 것을 알려 주는 \u003cb class=\"key\">도입\u003c/b> 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">옛날이야기 존재 표현(there + 동사)\u003c/span> : there(거기에) + lived(살았어요) + a princess(공주가) : \"공주가 살았어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : beautiful(아름다운) + and(그리고) + smart(영리한) : \"아름답고 영리한\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Once there lived, 옛날에 살았어요. a beautiful and smart princess, 아름답고 영리한 공주가. 이 문장 전체를 해석하면, 옛날에 아름답고 영리한 공주가 살았습니다.","hl":"m"},{"n":13,"text":"이 문장은 옛날이야기의 시작을 알려 줘요. 아름답고 영리한 공주를 소개하고 있죠. 옛날이야기에서는 이렇게 시작한대요.","hl":"mn"},{"n":14,"text":"첫 번째로 there lived를 살펴봐요. 거기에 공주가 살았어요라는 뜻으로, 옛날이야기에서 자주 쓰는 존재 표현이에요. 두 번째로 and를 봐요. 아름답고 영리한처럼 두 가지를 이어 줘요. 여러분도 and로 두 가지를 이어 써 보세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 아버지와 함께 살았어요\u003c/span>\u003cspan class=\"en\">She lived \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">her \u003c/span>\u003cspan class=\"tgt\">father\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왕이신\u003c/span>\u003cspan class=\"en\">the king,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">양쯔강 근처에서요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">near \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">Yangtze \u003c/span>\u003cspan class=\"tgt\">river\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 양쯔강 근처에서 아버지인 왕과 함께 살았어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 공주가 누구와 어디서 사는지 알려 주는 \u003cb class=\"key\">배경\u003c/b> 문장이에요. 아버지인 \u003cb class=\"key\">왕\u003c/b>과 양쯔강 근처에서 살았다는 걸 알 수 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">함께를 나타내는 짝꿍 말(전치사)\u003c/span> : with + 누구(her father) = ~와 함께 : \"그녀의 아버지와 함께\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소를 알려 주는 짝꿍 말(전치사)\u003c/span> : near + 장소(the Yangtze river) = ~ 근처에 : \"양쯔강 근처에\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"She lived with her father, 그녀는 아버지와 함께 살았어요. the king, 왕이신. near the Yangtze river, 양쯔강 근처에서요. 이 문장 전체를 해석하면, 그녀는 양쯔강 근처에서 아버지인 왕과 함께 살았어요.","hl":"m"},{"n":16,"text":"이 문장은 공주가 누구와 어디서 살았는지 알려 주는 배경이에요. 아버지인 왕과 양쯔강 근처에서 살았대요.","hl":"mn"},{"n":17,"text":"첫 번째로 with her father를 봐요. with는 함께라는 뜻의 짝꿍 말이에요. 그래서 아버지와 함께라는 뜻이 되죠. 두 번째로 near the Yangtze river를 봐요. near는 근처에라는 뜻이라서, 어디서 살았는지 장소를 알려 줘요. 중간에 the king을 덧붙여서 아버지가 왕이라는 것도 알려 준답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어느 날, 왕이\u003c/span>\u003cspan class=\"en\">One day, the king\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">남자를 골랐어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">chose\u003c/span> a man\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공주와 결혼할\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">marry \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">princess\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어느 날, 왕은 공주와 결혼할 남자를 선택했어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이야기를 \u003cb class=\"key\">움직이는\u003c/b> 사건이에요. 왕이 공주와 결혼할 \u003cb class=\"key\">남자\u003c/b>를 골랐어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일을 말하는 동사(과거형)\u003c/span> : the king(왕이) + chose(골랐어요) + a man(남자를) : \"골랐어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to + 동사원형(to부정사)\u003c/span> : to + marry(결혼하다) = ~할 : \"공주와 결혼할\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"One day, the king, 어느 날, 왕이. chose a man, 남자를 골랐어요. to marry the princess, 공주와 결혼할. 이 문장 전체를 해석하면, 어느 날, 왕은 공주와 결혼할 남자를 선택했어요.","hl":"m"},{"n":19,"text":"이 문장은 이야기를 움직이는 사건이에요. 왕이 공주와 결혼할 남자를 골랐다는 뜻이죠.","hl":"mn"},{"n":20,"text":"첫 번째로 chose를 봐요. choose의 지난 모양이 chose예요. 규칙대로 변하지 않는 불규칙 동사라서 그냥 외우면 돼요. 두 번째로 to marry the princess를 봐요. to부정사가 뒤에서 어떤 남자인지 꾸며 주는 거예요. 그래서 공주와 결혼할 남자라는 뜻이 되죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 공주는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">But\u003c/span> the princess\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아니라고 말했어요, 거절했지요.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">said \u003c/span>\u003cspan class=\"tgt\">no\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 공주는 거절했지요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 공주가 왕이 정해 준 결혼을 \u003cb class=\"key\">거절\u003c/b>한 장면이에요. 짧은 문장이지만 \u003cb class=\"key\">But\u003c/b> 하나로 앞 내용과 반대되는 \u003cb class=\"key\">반전\u003c/b>을 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 앞말 + But(하지만) + 뒤말 : \"하지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(the princess) + 말했다(said) + 아니라고(no) : \"거절했어요\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"But the princess, 하지만 공주는. said no, 아니라고 말했어요, 거절했지요.. 이 문장 전체를 해석하면, 하지만 공주는 거절했지요.","hl":"m"},{"n":22,"text":"이 문장은 공주가 결혼을 거절한 장면이에요. 아주 짧지만 But 하나로 앞 내용과 반대되는 반전을 보여 주죠.","hl":"mn"},{"n":23,"text":"첫 번째, But은 하지만이라는 뜻의 접속사예요. 앞에서 왕이 남자를 골랐는데 공주 마음은 달랐죠. 두 번째, said는 say의 지난 일 말이에요. 아니라고 말했다, 즉 거절했다는 뜻이 된답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왕은 매우 화가 났어요\u003c/span>\u003cspan class=\"en\">The king \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">got \u003c/span>\u003cspan class=\"tgt\">very \u003c/span>\u003cspan class=\"tgt\">angry\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜냐하면 그녀가 따르지 않았기 때문이에요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">because\u003c/span> she \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">didn't \u003c/span>\u003cspan class=\"tgt\">follow\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 명령을\u003c/span>\u003cspan class=\"en\">his order.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">왕은 그녀가 자신의 명령을 따르지 않아서 매우 화가 났어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 공주가 왕의 \u003cb class=\"key\">명령\u003c/b>을 따르지 않자 왕이 \u003cb class=\"key\">화\u003c/b>가 난 장면이에요. \u003cb class=\"key\">because\u003c/b>가 왜 화가 났는지 \u003cb class=\"key\">이유\u003c/b>를 알려 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(The king) + 되었다(got) + 매우 화난(very angry) : \"매우 화가 났어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 결과 + because(왜냐하면) + 이유 : \"왜냐하면 ~라서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">부정문(일반동사 과거 부정)\u003c/span> : 누가(she) + 하지 않았다(didn't) + 하다(follow) : \"따르지 않았어요\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"The king got very angry, 왕은 매우 화가 났어요. because she didn't follow, 왜냐하면 그녀가 따르지 않았기 때문이에요. his order, 그의 명령을. 이 문장 전체를 해석하면, 왕은 그녀가 자신의 명령을 따르지 않아서 매우 화가 났어요.","hl":"m"},{"n":25,"text":"공주가 왕의 명령을 따르지 않자 왕이 화가 난 장면이에요. because가 왜 화가 났는지 이유를 알려 주죠.","hl":"mn"},{"n":26,"text":"첫 번째, got은 get의 과거형이에요. 화가 난 상태가 되었다는 뜻이죠. 두 번째, because는 왜냐하면이라는 뜻의 접속사예요. 뒤에 이유가 와요. 세 번째, didn't 다음에는 동사 원형 follow를 그대로 써요. followed라고 하면 안 된답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 그녀를 데리고 나갔어요\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">took\u003c/span> her out\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 배에\u003c/span>\u003cspan class=\"en\">on his boat\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그녀를 던졌어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">threw\u003c/span> her\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">강 속으로\u003c/span>\u003cspan class=\"en\">into the river.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 그녀를 자신의 배에 태워서 강에 던졌어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 왕이 공주를 배에 태워 \u003cb class=\"key\">강\u003c/b>에 던진 무서운 장면이에요. \u003cb class=\"key\">and\u003c/b>로 두 가지 \u003cb class=\"key\">행동\u003c/b>을 이어서 말해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(He) + 했다(took) + 누구를(her) + 밖으로(out) : \"데리고 나갔어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 행동 하나 + and + 행동 둘 : \"그리고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(He) + 던졌다(threw) + 누구를(her) : \"던졌어요\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"He took her out, 그는 그녀를 데리고 나갔어요. on his boat, 자신의 배에. and threw her, 그리고 그녀를 던졌어요. into the river, 강 속으로. 이 문장 전체를 해석하면, 그는 그녀를 자신의 배에 태워서 강에 던졌어요.","hl":"m"},{"n":28,"text":"왕이 공주를 배에 태워 강에 던진 장면이에요. and로 두 가지 행동을 이어서 말하고 있죠.","hl":"mn"},{"n":29,"text":"첫 번째, took은 take의 과거형이에요. take, took처럼 불규칙하게 변하는 동사예요. 두 번째, and는 그리고라는 뜻으로 두 가지 행동을 이어 줘요. 세 번째, threw는 throw의 과거형이고, into the river는 강 속으로라는 뜻이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀가 떠내려가고 있을 때,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">As \u003c/span>\u003cspan class=\"tgt\">she \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">going \u003c/span>\u003cspan class=\"tgt\">down\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">강의 여신이\u003c/span>\u003cspan class=\"en\">a river goddess\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀를 구했어요.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">saved\u003c/span> her.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀가 떠내려가고 있을 때, 강의 여신이 그녀를 구했어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 위기에 빠진 공주를 강의 \u003cb class=\"key\">여신\u003c/b>이 구해 줬어요. 공주가 \u003cb class=\"key\">돌고래\u003c/b>로 다시 태어나는 이야기의 시작이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : ~할 때(As) + 그녀가 떠내려가고 있을 때(she was going down) : \"그녀가 떠내려가고 있을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지금 ~하는 중(진행형)\u003c/span> : 그녀가(she) + 가고 있는 중이었어요(was going) + 아래로(down) : \"가고 있는 중이었어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 여신이(a river goddess) + 구했어요(saved) + 그녀를(her) : \"구했어요\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"As she was going down, 그녀가 떠내려가고 있을 때. a river goddess, 강의 여신이. saved her, 그녀를 구했어요.. 이 문장 전체를 해석하면, 그녀가 떠내려가고 있을 때, 강의 여신이 그녀를 구했어요.","hl":"m"},{"n":31,"text":"위기에 빠진 공주를 강의 여신이 구해 줬어요. 공주가 돌고래로 다시 태어나는 이야기의 시작이 되는 장면이에요.","hl":"mn"},{"n":32,"text":"문법도 짚어 볼게요. 첫 번째, As she was going down에서 As는 '~할 때'라는 뜻으로 두 일을 이어 주는 접속사예요. 두 번째, was going은 be동사 was에 going을 붙여서 '가고 있는 중이었어요'를 만든 진행형이에요. 세 번째, saved는 save에 d를 붙인 과거형이에요. 그래서 '구했어요'라는 지난 일이 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여신은 안쓰럽게 여겼어요\u003c/span>\u003cspan class=\"en\">The goddess \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">felt \u003c/span>\u003cspan class=\"tgt\">sorry \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">her\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그녀를 바꿨어요\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">changed \u003c/span>\u003cspan class=\"tgt\">her \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">돌고래로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">into \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">dolphin\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여신은 그녀를 안쓰럽게 여겨서 그녀를 돌고래로 변하게 했답니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 여신이 공주를 안쓰럽게 여겨 \u003cb class=\"key\">돌고래\u003c/b>로 바꿔 줬어요. 공주가 물속에서 살게 되는 \u003cb class=\"key\">변신\u003c/b> 장면이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 여신이(The goddess) + 안타까워했어요(felt sorry) + 그녀를(for her) : \"그녀를 안쓰럽게 여겼어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소·시간 짝꿍 말(전치사)\u003c/span> : 바꿨어요(changed) + 그녀를(her) + 돌고래로(into a dolphin) : \"그녀를 돌고래로 바꿨어요\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"The goddess felt sorry, 여신은 안쓰럽게 여겼어요. for her, 그녀를. and changed her, 그리고 그녀를 바꿨어요. into a dolphin, 돌고래로. 이 문장 전체를 해석하면, 여신은 그녀를 안쓰럽게 여겨서 그녀를 돌고래로 변하게 했답니다.","hl":"m"},{"n":34,"text":"여신이 공주를 안쓰럽게 여겨서 돌고래로 바꿔 줬어요. 공주가 물속에서 살 수 있게 되는 변신 장면이에요.","hl":"mn"},{"n":35,"text":"문법도 짚어 볼게요. 첫 번째, felt는 feel의 지난 일 말이에요. 모양이 완전히 바뀌는 불규칙 동사라서 felt라고 해요. 두 번째, into는 '~로'라는 뜻이에요. change A into B는 A를 B로 바꾸다라는 한 덩어리 표현이니까 통째로 외워 두면 좋아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 돌고래가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">dolphin \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀에게 왕에 대해 말했을 때,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">told \u003c/span>\u003cspan class=\"tgt\">her \u003c/span>\u003cspan class=\"tgt\">about \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">king\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여신은 화가 났어요.\u003c/span>\u003cspan class=\"en\">the goddess \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">got \u003c/span>\u003cspan class=\"tgt\">angry\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 돌고래가 그녀에게 왕에 대해 말해주자, 여신은 화가 났어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 돌고래가 된 공주가 왕이 한 일을 \u003cb class=\"key\">여신\u003c/b>에게 알렸어요. 그래서 여신이 크게 \u003cb class=\"key\">화를 \u003c/b>\u003cb class=\"key\">냈어요\u003c/b>. 다음 사건이 시작되는 장면이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : ~하자(When) + 돌고래가 말했어요(the dolphin told) + 그녀에게 왕에 대해(her about the king) : \"돌고래가 그녀에게 왕에 대해 말했을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 여신이(the goddess) + 화가 났어요(got angry) : \"화가 났어요\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"When the dolphin, 그 돌고래가. told her about the king, 그녀에게 왕에 대해 말했을 때. the goddess got angry, 여신은 화가 났어요.. 이 문장 전체를 해석하면, 그 돌고래가 그녀에게 왕에 대해 말해주자, 여신은 화가 났어요.","hl":"m"},{"n":37,"text":"돌고래가 된 공주가 왕이 한 일을 여신에게 말했어요. 그러자 여신은 크게 화를 냈어요. 다음에 큰일이 일어날 것 같은 장면이에요.","hl":"mn"},{"n":38,"text":"문법도 짚어 볼게요. 첫 번째, When은 '~할 때'라는 뜻으로 두 문장을 이어 주는 접속사예요. 두 번째, got angry는 '화가 났어요'라는 뜻이에요. get angry가 지난 일이 되면서 got angry로 바뀐 거예요. 여러분도 오늘 배운 표현으로 짧은 문장을 직접 만들어 보세요!","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여신은 일으켰어요\u003c/span>\u003cspan class=\"en\">The goddess \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">created\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">폭풍을\u003c/span>\u003cspan class=\"en\">a storm,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 왕의 배는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and\u003c/span> the king's boat\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">폭풍 속에 가라앉았어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">sank\u003c/span> in the storm.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여신은 폭풍을 일으켰고, 왕의 배는 폭풍 속에 가라앉았어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 여신이 \u003cb class=\"key\">폭풍\u003c/b>을 일으켜서 왕의 배가 가라앉았다는 뜻이에요. 이야기가 갑자기 \u003cb class=\"key\">위기\u003c/b>로 바뀌는 장면이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 여신은(The goddess) + 일으켰다(created) + 폭풍을(a storm) : \"일으켰어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 폭풍을 만들었다(created a storm) + and + 가라앉았다(sank) : \"그리고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">모습이 바뀐 지난 일 말(과거형)\u003c/span> : 배가(the boat) + 가라앉았다(sank) : \"가라앉았어요\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"The goddess created, 여신은 일으켰어요. a storm, 폭풍을. and the king's boat, 그리고 왕의 배는. sank in the storm, 폭풍 속에 가라앉았어요. 이 문장 전체를 해석하면, 여신은 폭풍을 일으켰고, 왕의 배는 폭풍 속에 가라앉았어요.","hl":"m"},{"n":40,"text":"여신이 폭풍을 일으켜서 왕의 배가 가라앉았다는 뜻이에요. 이야기가 갑자기 위기로 바뀌는 장면이죠.","hl":"mn"},{"n":41,"text":"첫 번째, created는 지난 일을 말하는 과거형이에요. 이미 지나간 일이라 동사 뒤에 ed를 붙였죠. 두 번째, and는 앞일과 뒤일을 이어 주는 접속사예요. 여신이 폭풍을 만들었어요, and, 배가 가라앉았어요, 이렇게 두 가지를 한 번에 이어 줘요. 세 번째, sank는 sink의 불규칙 모습이에요. 규칙대로면 ed를 붙이지만 sank라고 통째로 변신했어요. 그래서 불규칙이라고 불러요. 어렵지 않죠?","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 그 돌고래는 구했어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">But\u003c/span> the dolphin \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">saved\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 아버지를\u003c/span>\u003cspan class=\"en\">her father.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 돌고래는 자신의 아버지를 구했어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 돌고래가 된 공주가 \u003cb class=\"key\">자신의 \u003c/b>\u003cb class=\"key\">아버지\u003c/b>인 왕을 구했다는 뜻이에요. 미운 마음도 있었지만 결국 \u003cb class=\"key\">가족\u003c/b>이라서 살린 거예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 앞 내용 + But + 반대되는 내용 : \"하지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 돌고래는(the dolphin) + 구했다(saved) + 아버지를(her father) : \"구했어요\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"But the dolphin saved, 하지만 그 돌고래는 구했어요. her father, 자신의 아버지를. 이 문장 전체를 해석하면, 하지만 돌고래는 자신의 아버지를 구했어요.","hl":"m"},{"n":43,"text":"돌고래가 된 공주가 자신의 아버지인 왕을 구했다는 뜻이에요. 미운 마음도 있었지만 결국 가족이니까 살린 거죠.","hl":"mn"},{"n":44,"text":"첫 번째, But은 앞 내용과 반대되는 이야기를 이어 줄 때 써요. 왕이 나쁜 짓을 했지만, But, 공주는 아버지를 구했어요, 이렇게 반대 느낌을 만들어요. 두 번째, saved는 지난 일을 말하는 과거형이에요. save에 d를 붙여서 구했어요라고 말하죠. 여러분도 누군가를 도와준 적 있나요?","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 13\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왕은 후회했어요\u003c/span>\u003cspan class=\"en\">The king \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">regretted\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 행동을\u003c/span>\u003cspan class=\"en\">his actions\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 시작했어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">started \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">돌고래를 보호하기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">protect\u003c/span> dolphins\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">강에서\u003c/span>\u003cspan class=\"en\">in the river.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">왕은 자신의 행동을 후회했고 강에 있는 돌고래를 보호하기 시작했어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 왕이 자기 행동을 \u003cb class=\"key\">후회\u003c/b>하고, 이제는 강에 사는 돌고래를 \u003cb class=\"key\">보호\u003c/b>하기 시작했다는 뜻이에요. 이야기가 따뜻하게 마무리되는 장면이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 왕은(The king) + 후회했다(regretted) + 자기 행동을(his actions) : \"후회했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 후회했다(regretted) + and + 시작했다(started) : \"그리고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to + 동사원형(to부정사)\u003c/span> : 시작했다(started) + to + 보호하다(protect) : \"보호하기 시작했어요\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"The king regretted, 왕은 후회했어요. his actions, 자신의 행동을. and started, 그리고 시작했어요. to protect dolphins, 돌고래를 보호하기를. in the river, 강에서. 이 문장 전체를 해석하면, 왕은 자신의 행동을 후회했고 강에 있는 돌고래를 보호하기 시작했어요.","hl":"m"},{"n":46,"text":"왕이 자기 행동을 후회하고, 이제는 강에 사는 돌고래를 보호하기 시작했다는 뜻이에요. 이야기가 따뜻하게 끝나는 장면이죠.","hl":"mn"},{"n":47,"text":"첫 번째, regretted는 지난 일을 말하는 과거형이에요. 두 번째, and는 두 가지 행동을 이어 주는 말이에요. 후회했어요, and, 보호하기 시작했어요, 이렇게 이어 주죠. 세 번째, started to protect는 시작했다에 to와 동사원형을 붙인 to부정사 표현이에요. 시작해서 지금도 한다는 느낌을 줘요. 오늘 배운 이 문장은 꼭 소리 내어 외워 봐요. 정말 잘하고 있어요!","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 13\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">돌고래는 되었어요\u003c/span>\u003cspan class=\"en\">Dolphins \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">became\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 상징이\u003c/span>\u003cspan class=\"en\">the symbol\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">평화와 보호의\u003c/span>\u003cspan class=\"en\">of \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">peace \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">protection\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">돌고래는 평화와 보호의 상징이 되었답니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 돌고래가 이제 \u003cb class=\"key\">평화\u003c/b>와 \u003cb class=\"key\">보호\u003c/b>를 뜻하는 상징이 되었다고 정리하는 문장이에요. 이야기의 \u003cb class=\"key\">결말\u003c/b>을 멋지게 맺어 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(Dolphins) + 되었다(became) + 무엇이(the symbol) : \"되었어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 평화(peace) + 그리고(and) + 보호(protection) : \"평화와 보호\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"Dolphins became, 돌고래는 되었어요. the symbol, 그 상징이. of peace and protection, 평화와 보호의. 이 문장 전체를 해석하면, 돌고래는 평화와 보호의 상징이 되었답니다.","hl":"m"},{"n":49,"text":"이 문장은 이야기의 결말을 정리해 줘요. 돌고래가 평화와 보호를 뜻하는 상징이 되었다고 멋지게 마무리하고 있죠.","hl":"mn"},{"n":50,"text":"첫째, became은 become의 과거형이에요. 지난 일을 말할 때 이렇게 모습이 바뀌죠. 둘째, and는 평화와 보호를 나란히 이어 주는 말이에요. 그래서 peace and protection은 평화와 보호가 된답니다. 오늘 배운 결말 문장, 아주 잘 이해했어요!","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">오늘 배운 내용 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>아름다운 \u003cb class=\"key\">공주\u003c/b>가 왕의 명령을 거절해 강에 던져졌어요.\u003c/li>\u003cli>강의 \u003cb class=\"key\">여신\u003c/b>이 공주를 구해 \u003cb class=\"key\">돌고래\u003c/b>로 바꾸어 주었어요.\u003c/li>\u003cli>돌고래가 아버지를 구하자 왕은 자신의 행동을 \u003cb class=\"key\">후회\u003c/b>했어요.\u003c/li>\u003cli>왕은 돌고래를 \u003cb class=\"key\">보호\u003c/b>했고, 돌고래는 평화와 보호의 상징이 되었어요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>A river goddess saves a princess by changing her into a dolphin, and the king learns to protect dolphins.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">아름다운 공주가 왕의 명령을 거절해 강에 던져졌지만, 강의 여신이 그녀를 \u003cb class=\"key\">돌고래\u003c/b>로 구해 줘요. 뒤늦게 \u003cb class=\"key\">후회\u003c/b>한 왕은 강의 돌고래를 \u003cb class=\"key\">보호\u003c/b>하게 되고, 돌고래는 평화와 보호의 \u003cb class=\"key\">상징\u003c/b>이 됩니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":51,"text":"오늘은 공주가 돌고래가 되어 왕을 구하고, 왕이 돌고래를 보호하게 되는 이야기를 배웠어요. 공주, 여신, 돌고래, 후회, 보호라는 핵심 낱말도 꼭 기억해 주세요. 여러분은 오늘 아주 멋지게 읽었어요. 다음 시간에도 재미있는 이야기로 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
