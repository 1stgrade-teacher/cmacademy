</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"왓츠 리딩 100A Ch.4 Unit 01 Life in the Rainforests","audioDir":"reading01_audio","preview":false,"count":45,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.400em\">Ch.4 Unit 01\u003cbr>Life in the\u003cbr>Rainforests\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">왓츠 리딩 100A\u003c/div>\u003ch1>Life in the Rainforests: Animals You Can Hardly See\u003c/h1>\u003ch2>열대우림 속 동물들의 생활: 좀처럼 보기 힘든 동물들\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">한 줄 요약\u003c/span>\u003cspan>열대우림은 많은 동물과 식물의 \u003cb class=\"key\">서식지\u003c/b>이지만, 그 동물들을 보기는 쉽지 않아요. howler monkey는 나무 꼭대기에서 큰 소리로 울고, tapir는 \u003cb class=\"key\">물속\u003c/b>에서 지내서 만나기 어려워요.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Rainforest animals are hard to see because they live in special places like the tops of trees or in water.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘 함께 읽을 글은 Life in the Rainforests, 열대우림에 사는 동물들 이야기예요. 열대우림은 많은 동물과 식물의 서식지이고, 물속에 사는 친구도 있고 나무 위에 사는 친구도 있죠. 오늘의 한 줄 요약은 이거예요. 동물들이 사는 곳이 달라서 만나기가 쉽지 않다는 것! 자, 그럼 신나게 시작해 볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">미리 알면 쉬워요\u003c/span>\u003cdiv class=\"lp-box\">\u003cb class=\"key\">열대우림\u003c/b>은 일 년 내내 덥고 비가 많이 오는 울창한 숲이에요. 이곳에는 \u003cb class=\"key\">howler \u003c/b>\u003cb class=\"key\">monkey\u003c/b>처럼 큰 소리를 내는 동물도 살아요. 동물들은 더위를 피하려고 나무 위나 물속에 숨어요. 여러분이 여름에 더울 때 \u003cb class=\"key\">그늘\u003c/b>을 찾는 것과 같아요. 그래서 낮에는 동물을 만나기가 어려워요.\u003c/div>","segs":[{"n":2,"text":"먼저 열대우림을 떠올려 볼까요? 열대우림은 일 년 내내 덥고 비가 많이 오는 울창한 숲이에요. 그곳에는 howler monkey처럼 큰 소리를 내는 동물도 살아요. 여러분은 여름에 더울 때 어디로 피하나요? 우리가 그늘을 찾는 것처럼 동물들도 더위를 피해 숨는 곳이 있답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>열대우림 소개\u003csmall>소개 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>열대우림은 많은 동물, 식물, 곤충의 \u003cb class=\"key\">서식지\u003c/b>예요. 그런데 그런 동물을 보는 일은 \u003cb class=\"key\">쉽지 \u003c/b>\u003cb class=\"key\">않다\u003c/b>고 말해요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>숨는 방법\u003csmall>문제 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>어떤 동물들은 하늘 가까이에 머물고, 다른 동물들은 물속에서 \u003cb class=\"key\">더위\u003c/b>를 피해 숨어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>howler monkey\u003csmall>예시 · 문장 5–9\u003c/small>\u003c/h4>\u003cp>howler monkey는 \u003cb class=\"key\">큰 \u003c/b>\u003cb class=\"key\">소리\u003c/b>로 유명해요. 5km 떨어진 곳에서도 들리지만 \u003cb class=\"key\">나무 \u003c/b>\u003cb class=\"key\">꼭대기\u003c/b>에 살아서 모습은 잘 안 보여요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>tapir\u003csmall>또 다른 예시 · 문장 10–11\u003c/small>\u003c/h4>\u003cp>tapir도 낮에는 찾기 힘들어요. \u003cb class=\"key\">물속\u003c/b>에서 하루의 대부분을 보내며 물풀을 먹고 \u003cb class=\"key\">적\u003c/b>을 피하고 더위를 식혀요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 열대우림 동물들이 왜 보기 힘든지, 두 동물을 예로 들어 알려 주는 글이에요.","hl":null},{"n":4,"text":"첫 번째 단계는 열대우림 소개예요. rainforests are home to many animals, plants, and insects, 즉 많은 동물과 식물, 곤충의 서식지라는 뜻이죠. 그런데 그런 동물을 보는 일은 쉽지 않다고 말해요. 두 번째 문장에서 But으로 살짝 방향을 틀어요.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 동물들이 숨는 방법이 나와요. 어떤 동물들은 하늘 가까이에 머물고, 다른 동물들은 물속에서 더위를 피해 숨어요. 아주 짧은 문장 두 개로 여러 모습을 보여 주죠.","hl":"f1"},{"n":6,"text":"세 번째 단계는 howler monkey 이야기예요. 얘네들은 큰 소리로 유명해요. 아침과 밤에 scream하고, five kilometers away에서도 그 소리가 들린대요. 그래도 나무 꼭대기에 살아서 모습은 잘 안 보여요.","hl":"f2"},{"n":7,"text":"마지막 단계는 tapir예요. tapir도 낮에는 찾기 힘들어요. 육지동물이지만 물속에서 하루의 대부분을 보내는데, 물풀을 먹고, 적을 피하고, 더운 날 더위를 식히기 위해서래요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">설명하기(예를 들어 알려 주기)\u003c/span>\u003cspan class=\"lp-pill\">처음\u003c/span>\u003cspan class=\"lp-pill\">주제문 2번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">두 번째 문장에서 '보는 것이 쉽지 않다'고 \u003cb class=\"key\">주제\u003c/b>를 먼저 말해요. 그다음 howler monkey와 tapir를 \u003cb class=\"key\">예시\u003c/b>로 들어 왜 그런지 알려 줘요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>But (2)\u003c/b>\u003cspan>앞 내용과 반대임을 알려 줌\u003c/span>\u003cb>because (9)\u003c/b>\u003cspan>이유를 알려 줌\u003c/span>\u003cb>also (10)\u003c/b>\u003cspan>비슷한 예를 더 보여 줌\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">animals, plants, and insects\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">rainforest animals\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">howler monkeys\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">tapirs\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Howler monkeys\u003c/th>\u003cth>Tapirs\u003c/th>\u003c/tr>\u003ctr>\u003ctd>나무 꼭대기에서 살아요\u003c/td>\u003ctd>물속에 머물러요\u003c/td>\u003c/tr>\u003ctr>\u003ctd>큰 소리로 울어요\u003c/td>\u003ctd>낮에는 찾기 힘들어요\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 설명하는 글, 그중에서도 예를 들어 알려 주는 글이에요. 중심 문장은 맨 처음, 두 번째 문장에 있어요. 보는 것이 쉽지 않다고 주제를 먼저 말하고, 그다음 두 동물을 예시로 보여 주죠.","hl":"ty"},{"n":9,"text":"길잡이 말을 잘 보면 글이 훨씬 쉬워져요. 두 번째 문장의 But은 앞 내용과 반대라는 신호이고, 아홉 번째 문장의 because는 이유를 알려 주는 신호예요. 열 번째 문장의 also는 비슷한 예를 하나 더 보여 주는 말이고요. 같은 동물을 rainforest animals, howler monkeys, tapirs처럼 이름을 바꿔 가며 불러요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 단어\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>rainforest\u003c/b>\u003cem>명사\u003c/em>\u003cspan>열대우림\u003c/span>\u003c/div>\u003cdiv>\u003cb>be home to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~의 서식지이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>insect\u003c/b>\u003cem>명사\u003c/em>\u003cspan>곤충\u003c/span>\u003c/div>\u003cdiv>\u003cb>howler monkey\u003c/b>\u003cem>명사\u003c/em>\u003cspan>고함원숭이\u003c/span>\u003c/div>\u003cdiv>\u003cb>tapir\u003c/b>\u003cem>명사\u003c/em>\u003cspan>맥(코가 긴 동물)\u003c/span>\u003c/div>\u003cdiv>\u003cb>stay\u003c/b>\u003cem>동사\u003c/em>\u003cspan>머무르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>close to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~가까이에\u003c/span>\u003c/div>\u003cdiv>\u003cb>sky\u003c/b>\u003cem>명사\u003c/em>\u003cspan>하늘\u003c/span>\u003c/div>\u003cdiv>\u003cb>hide\u003c/b>\u003cem>동사\u003c/em>\u003cspan>숨다\u003c/span>\u003c/div>\u003cdiv>\u003cb>heat\u003c/b>\u003cem>명사\u003c/em>\u003cspan>더위, 열기\u003c/span>\u003c/div>\u003cdiv>\u003cb>be famous for\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 유명하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>loud\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>(소리가) 큰\u003c/span>\u003c/div>\u003cdiv>\u003cb>howl\u003c/b>\u003cem>명사\u003c/em>\u003cspan>울부짖는 소리\u003c/span>\u003c/div>\u003cdiv>\u003cb>scream\u003c/b>\u003cem>동사\u003c/em>\u003cspan>소리치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>easily\u003c/b>\u003cem>부사\u003c/em>\u003cspan>쉽게\u003c/span>\u003c/div>\u003cdiv>\u003cb>top\u003c/b>\u003cem>명사\u003c/em>\u003cspan>꼭대기\u003c/span>\u003c/div>\u003cdiv>\u003cb>ground\u003c/b>\u003cem>명사\u003c/em>\u003cspan>땅, 지면\u003c/span>\u003c/div>\u003cdiv>\u003cb>enemy\u003c/b>\u003cem>명사\u003c/em>\u003cspan>적\u003c/span>\u003c/div>\u003cdiv>\u003cb>feed on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 먹고 살다\u003c/span>\u003c/div>\u003cdiv>\u003cb>cool off\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>더위를 식히다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"오늘의 단어도 소리 내어 읽어 볼까요? rainforest, 열대우림. insect, 곤충. hide, 숨다. feed on은 물고 먹고 살다, cool off는 더위를 식히다라는 뜻이에요. 한 번씩 따라 읽어 보세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">hide\u003c/b>\u003cspan class=\"m\">숨다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">cover\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">show\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">famous\u003c/b>\u003cspan class=\"m\">유명한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">well-known\u003c/span>\u003cspan class=\"s\">popular\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unknown\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">loud\u003c/b>\u003cspan class=\"m\">(소리가) 큰\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">noisy\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">quiet\u003c/span>\u003cspan class=\"a\">soft\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">hard\u003c/b>\u003cspan class=\"m\">어려운, 힘든\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">difficult\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">easy\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">close to\u003c/b>\u003cspan class=\"m\">~가까이에\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">near\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">far from\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"비슷한 말과 반대말도 정리해 볼게요. hide는 숨다, 비슷한 말은 cover, 반대말은 show예요. famous는 유명한, 비슷한 말은 well-known이고 반대말은 unknown이에요. loud는 소리가 큰, 비슷한 말은 noisy, 반대말은 quiet이에요. hard는 어려운, 비슷한 말은 difficult, 반대말은 easy이고, close to는 가까이에, 반대말은 far from이에요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">열대우림은 ~입니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Rainforests \u003c/span>\u003cspan class=\"tgt\">are\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 ~의 서식지\u003c/span>\u003cspan class=\"en\">home to \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">many \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">동물, 식물, 그리고 곤충들\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">animals, \u003c/span>\u003cspan class=\"tgt\">plants, \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">insects\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">열대우림은 많은 동물, 식물, 그리고 곤충들의 서식지입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 열대우림이 많은 생물이 사는 \u003cb class=\"key\">서식지\u003c/b>라는 것을 알려 주는 첫 문장이에요. 앞으로 나올 동물 이야기의 출발점이 되는 문장이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">여럿일 때 쓰는 be동사(be동사)\u003c/span> : 여럿(Rainforests) + 이다(are) + 무엇(서식지) : \"열대우림은 ~입니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">많은 수를 말하는 말(수량 표현)\u003c/span> : 많은(many) + 셀 수 있는 것(animals) : \"많은 동물, 식물, 곤충들\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Rainforests are, 열대우림은 ~입니다. home to many, 많은 ~의 서식지. animals, plants, and insects, 동물, 식물, 그리고 곤충들. 이 문장 전체를 해석하면, 열대우림은 많은 동물, 식물, 그리고 곤충들의 서식지입니다.","hl":"m"},{"n":13,"text":"이 문장은 글의 첫 문장이에요. 열대우림이 많은 생물의 서식지라는 것을 알려 주죠. 앞으로 나올 동물 이야기의 시작을 알리는 문장이에요.","hl":"mn"},{"n":14,"text":"먼저 주어 Rainforests는 여러 개라서 be동사 are를 써요. 다음으로 many는 셀 수 있는 것 앞에 붙어서 많은 수를 나타내요. 마지막으로 and는 동물, 식물, 곤충을 차례로 연결해 주는 말이에요. 아주 기본이 되는 문장이니 소리 내어 세 번 읽어 봐요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 11\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 보는 것은\u003c/span>\u003cspan class=\"en\">But \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">seeing\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~와 같은 열대우림 동물들을\u003c/span>\u003cspan class=\"en\">rainforest animals \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">like\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">howler monkey나 tapir\u003c/span>\u003cspan class=\"en\">howler monkeys or tapirs\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">쉽지 않아요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">easy\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 howler monkey나 tapir와 같은 열대우림 동물들을 보는 것은 쉽지 않아요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> howler monkey나 tapir 같은 열대우림 동물은 실제로 보기가 \u003cb class=\"key\">어려워요\u003c/b>라는 뜻이에요. 그래서 다음 문장에서 동물들이 어디에 있는지 알려 주죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사-ing가 이름처럼 쓰임(동명사)\u003c/span> : 보는 것(seeing) + 은(is) + 쉽지 않다(not easy) : \"보는 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">~와 같은을 뜻하는 말(전치사)\u003c/span> : 동물들(animals) + ~와 같은(like) + howler monkeys : \"~와 같은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">'~아니에요'라고 말하기(be동사 부정문)\u003c/span> : 무엇이(It) + 아니다(is not) + 쉽다(easy) : \"쉽지 않아요\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"But seeing, 하지만 보는 것은. rainforest animals like, ~와 같은 열대우림 동물들을. howler monkeys or tapirs, howler monkey나 tapir. is not easy, 쉽지 않아요. 이 문장 전체를 해석하면, 하지만 howler monkey나 tapir와 같은 열대우림 동물들을 보는 것은 쉽지 않아요.","hl":"m"},{"n":16,"text":"howler monkey나 tapir 같은 열대우림 동물은 실제로 보기가 어렵다는 뜻이에요. 그래서 다음 문장에서 동물들이 어디에 있는지 알려 줘요.","hl":"mn"},{"n":17,"text":"먼저 seeing은 '보는 것'이라는 이름처럼 쓰여요. 두 번째로 like는 '좋아하다'가 아니라 '~와 같은'이라는 뜻이에요. 마지막으로 is not easy는 be동사에 not을 붙여 '쉽지 않아요'라고 말하는 모양이에요. 여러분도 is not easy를 입으로 세 번 말해 봐요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 동물들은 좋아해요\u003c/span>\u003cspan class=\"en\">Some \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">머무는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">stay\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하늘 가까이에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">close \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">sky\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어떤 동물들은 하늘 가까이에 머무는 것을 좋아합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 어떤 동물들은 \u003cb class=\"key\">하늘 \u003c/b>\u003cb class=\"key\">가까이\u003c/b>, 그러니까 나무 위 높은 곳에 머문다는 뜻이에요. 앞 문장에서 본 동물들이 어디에 있는지 알려 주는 문장이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">좋아하는 것 말하기(like + to부정사)\u003c/span> : 누가(Some) + 좋아한다(like) + 머무는 것을(to stay) : \"머무는 것을 좋아해요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소를 알려 주는 말(전치사)\u003c/span> : 가까이(close) + ~로(to) + 하늘(the sky) : \"하늘 가까이에\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Some like, 어떤 동물들은 좋아해요. to stay, 머무는 것을. close to the sky, 하늘 가까이에. 이 문장 전체를 해석하면, 어떤 동물들은 하늘 가까이에 머무는 것을 좋아합니다.","hl":"m"},{"n":19,"text":"어떤 동물들은 하늘 가까이에 머물고 싶어 한다는 뜻이에요. 나무 위 높은 곳에서 사는 동물 이야기를 꺼내는 문장이죠.","hl":"mn"},{"n":20,"text":"먼저 like 뒤에 to stay가 와서 '머무는 것을 좋아해요'라고 말해요. like 다음에는 이렇게 to와 동사원형이 자주 와요. 그리고 close to는 '~가까이'라는 뜻으로 장소를 알려 줘요. 하늘 바로 옆, 아주 높은 나무 위를 떠올리면 이해가 잘 되죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 동물들은 숨는다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Others\u003c/span> hide\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">열로부터\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">heat\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">물속에서\u003c/span>\u003cspan class=\"en\">in water.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">다른 동물들은 물속에서 열로부터 숨기도 하지요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 다른 동물들은 열을 피해 \u003cb class=\"key\">물속에서\u003c/b> \u003cb class=\"key\">숨는다\u003c/b>는 말이에요. 하늘 가까이 사는 동물과 달리 물을 이용하는 동물을 소개해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">대신하는 말(대명사)\u003c/span> : 다른 동물들(Others) + 숨는다(hide) : \"다른 동물들은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소·시간 짝꿍 말(전치사)\u003c/span> : ~로부터(from) + 열(the heat) : \"열로부터\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Others hide, 다른 동물들은 숨는다. from the heat, 열로부터. in water, 물속에서. 이 문장 전체를 해석하면, 다른 동물들은 물속에서 열로부터 숨기도 하지요.","hl":"m"},{"n":22,"text":"이 문장은 다른 동물들이 열을 피해서 물속에서 숨는다는 뜻이에요. 하늘 가까이에 머무는 동물과 달리, 물을 이용하는 동물도 있다는 걸 알려 주죠.","hl":"mn"},{"n":23,"text":"먼저 Others는 앞에서 말한 동물들을 대신하는 대명사예요. 그래서 '다른 동물들은'이라는 뜻이 되죠. 그리고 from the heat에서 from은 '~로부터'를 나타내는 전치사예요. 열로부터 숨는다는 뜻을 만들어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">howler monkey는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Howler \u003c/span>\u003cspan class=\"tgt\">monkeys\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~로 유명합니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">famous \u003c/span>\u003cspan class=\"tgt\">for\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 큰 울부짖는 소리\u003c/span>\u003cspan class=\"en\">their loud howls.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">howler monkey는 큰 울부짖는 소리로 유명합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> howler monkey는 \u003cb class=\"key\">큰 \u003c/b>\u003cb class=\"key\">소리\u003c/b>로 \u003cb class=\"key\">유명\u003c/b>하다는 뜻이에요. 이 원숭이의 가장 큰 특징을 알려 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">여러 마리를 말하는 이름 말(복수)\u003c/span> : 한 마리(monkey) + 여러 마리(monkeys) : \"howler monkey들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">am·are·is 친구들(be동사)\u003c/span> : 주어 + 이다(are) + 유명한(famous) + ~로(for) : \"~로 유명합니다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Howler monkeys, howler monkey는. are famous for, ~로 유명합니다. their loud howls, 그들의 큰 울부짖는 소리. 이 문장 전체를 해석하면, howler monkey는 큰 울부짖는 소리로 유명합니다.","hl":"m"},{"n":25,"text":"howler monkey는 큰 소리로 유명해요. 바로 그 큰 울부짖는 소리가 이 원숭이의 가장 큰 특징이에요.","hl":"mn"},{"n":26,"text":"먼저 Howler monkeys에서 monkeys 뒤에 s가 붙어 여러 마리를 말하는 복수예요. 그래서 be동사 are를 써요. 그다음 are famous for는 '~로 유명하다'라는 짝꿍 표현이에요. are가 '~이다'를 만들고 famous for가 '~로 유명한'을 붙여 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 소리쳐요\u003c/span>\u003cspan class=\"en\">They scream\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아침에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">morning\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 밤에\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">night\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 아침과 밤에 소리쳐요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> howler monkey가 \u003cb class=\"key\">아침\u003c/b>과 \u003cb class=\"key\">밤\u003c/b>에 소리친다는 뜻이에요. 앞 문장의 큰 울부짖는 소리를 언제 내는지 알려 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간 짝꿍 말(전치사)\u003c/span> : 아침에는(in the morning) : \"아침에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">시간 짝꿍 말(전치사)\u003c/span> : 밤에는(at night) : \"밤에\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"They scream, 그들은 소리쳐요. in the morning, 아침에. and at night, 그리고 밤에. 이 문장 전체를 해석하면, 그들은 아침과 밤에 소리쳐요.","hl":"m"},{"n":28,"text":"howler monkey는 아침과 밤에 소리쳐요. 앞 문장에서 말한 큰 울부짖는 소리를 언제 내는지 알려 주는 문장이에요.","hl":"mn"},{"n":29,"text":"시간을 말할 때 쓰는 전치사가 짝이 달라요. 아침에는 in the morning, 밤에는 at night라고 해요. 그래서 in the morning과 at night는 통째로 외워 두면 아주 편해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은 들을 수 있어요\u003c/span>\u003cspan class=\"en\">You \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">hear\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 소리치는 것을\u003c/span>\u003cspan class=\"en\">them scream\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">5km 떨어진 곳에서!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">5 \u003c/span>\u003cspan class=\"tgt\">km \u003c/span>\u003cspan class=\"tgt\">away\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여러분은 5km 떨어진 곳에서도 그들이 소리치는 것을 들을 수 있어요!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 howler monkey의 \u003cb class=\"key\">울음소리\u003c/b>가 \u003cb class=\"key\">아주 \u003c/b>\u003cb class=\"key\">멀리\u003c/b>까지 들린다는 것을 알려 줘요. 소리가 얼마나 큰지 쉽게 느낄 수 있게 해 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">도와주는 동사 can(조동사)\u003c/span> : 누가(You) + 할 수 있어요(can) + 듣다(hear) : \"들을 수 있어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소·거리 짝꿍 말(전치사)\u003c/span> : ~에서(from) + 5 km away(5km 떨어진 곳) : \"5km 떨어진 곳에서\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"You can hear, 여러분은 들을 수 있어요. them scream, 그들이 소리치는 것을. from 5 km away!, 5km 떨어진 곳에서!. 이 문장 전체를 해석하면, 여러분은 5km 떨어진 곳에서도 그들이 소리치는 것을 들을 수 있어요!","hl":"m"},{"n":31,"text":"이 문장은 howler monkey의 울음소리가 아주 멀리까지 들린다는 것을 알려 줘요. 소리가 얼마나 큰지 상상해 보면 재미있어요.","hl":"mn"},{"n":32,"text":"can은 도와주는 동사예요. 뒤에 동사원형 hear가 와서 들을 수 있다는 뜻을 만들어요. from은 전치사로, 거리를 나타내요. from five km away는 오 킬로미터 떨어진 곳이라는 뜻이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 여러분은\u003c/span>\u003cspan class=\"en\">But you\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">볼 수 없어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">cannot \u003c/span>\u003cspan class=\"tgt\">see\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들을 쉽게\u003c/span>\u003cspan class=\"en\">them easily.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 여러분은 그들을 잘 볼 수 없답니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 소리는 들려도 모습은 \u003cb class=\"key\">쉽게\u003c/b> 볼 수 없다는 뜻이에요. 그래서 howler monkey를 \u003cb class=\"key\">잘 \u003c/b>\u003cb class=\"key\">볼 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">없다\u003c/b>는 것을 알려 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정하는 도와주는 동사(조동사 cannot)\u003c/span> : 누가(you) + ~할 수 없다(cannot) + 보다(see) : \"볼 수 없어요\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"But you, 하지만 여러분은. cannot see, 볼 수 없어요. them easily, 그들을 쉽게. 이 문장 전체를 해석하면, 하지만 여러분은 그들을 잘 볼 수 없답니다.","hl":"m"},{"n":34,"text":"이 문장은 소리는 들려도 모습은 쉽게 볼 수 없다는 뜻이에요. 그래서 howler monkey를 잘 볼 수 없다는 것을 알려 줘요.","hl":"mn"},{"n":35,"text":"cannot은 can에 not을 붙인 말이에요. 그래서 볼 수 없어요라는 부정의 뜻을 만들어요. can 뒤에 not을 붙이면 할 수 없다는 뜻이 된답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 11\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 살아요\u003c/span>\u003cspan class=\"en\">They live\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">꼭대기에\u003c/span>\u003cspan class=\"en\">at the top\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나무의\u003c/span>\u003cspan class=\"en\">of the trees\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜냐하면 그들은 찾을 수 있기 때문이에요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">because\u003c/span> they \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">find\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 많은 먹이를 그곳에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">food \u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">땅 위에서보다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">than\u003c/span> on the ground.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 나무 꼭대기에 사는데, 땅 위보다 그곳에서 더 많은 먹이를 찾을 수 있기 때문이에요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 howler monkey가 \u003cb class=\"key\">나무 \u003c/b>\u003cb class=\"key\">꼭대기\u003c/b>에 사는 이유를 알려 줘요. \u003cb class=\"key\">땅 \u003c/b>\u003cb class=\"key\">위\u003c/b>보다 그곳에서 \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">많은 \u003c/b>\u003cb class=\"key\">먹이\u003c/b>를 찾을 수 있기 때문이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이유를 이어 주는 말(접속사)\u003c/span> : 이유(because) + 그 이유를 말하는 문장 : \"왜냐하면 ~때문에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">도와주는 동사 can(조동사)\u003c/span> : 그들은(they) + ~할 수 있어요(can) + 찾다(find) : \"찾을 수 있어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">더 많은 ~보다(비교급)\u003c/span> : 더 많은(more) + 먹이(food) + 그곳에서(there) + ~보다(than) : \"그곳에서 땅 위보다 더 많은 먹이\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"They live, 그들은 살아요. at the top, 꼭대기에. of the trees, 나무의. because they can find, 왜냐하면 그들은 찾을 수 있기 때문이에요. more food there, 더 많은 먹이를 그곳에서. than on the ground, 땅 위에서보다. 이 문장 전체를 해석하면, 그들은 나무 꼭대기에 사는데, 땅 위보다 그곳에서 더 많은 먹이를 찾을 수 있기 때문이에요.","hl":"m"},{"n":37,"text":"이 문장은 howler monkey가 나무 꼭대기에 사는 이유를 알려 줘요. 땅 위보다 그곳에서 더 많은 먹이를 찾을 수 있기 때문이에요.","hl":"mn"},{"n":38,"text":"because는 이유를 이어 주는 말이에요. can은 도와주는 동사이고, 뒤에는 동사원형 find가 와요. more는 더 많은, than은 보다라는 뜻으로 비교급을 만들어요. 그래서 땅 위보다 그곳에서 더 많은 먹이를 찾을 수 있다는 뜻이 된답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">tapir들은 또한\u003c/span>\u003cspan class=\"en\">Tapirs \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are\u003c/span> also\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">찾기 힘들어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">hard \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">find\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">낮 동안\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">during \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">day\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">tapir 또한 낮 동안 찾기 힘듭니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> tapir도 howler monkey처럼 \u003cb class=\"key\">낮에는 \u003c/b>\u003cb class=\"key\">찾기 \u003c/b>\u003cb class=\"key\">힘들다\u003c/b>는 걸 알려 주는 문장이에요. 앞 문장에 이어 또 다른 열대우림 동물을 \u003cb class=\"key\">소개\u003c/b>하는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">am·are·is 친구들(be동사)\u003c/span> : tapir들은(Tapirs) + 이다(are) + 찾기 힘들어요(hard to find) : \"찾기 힘들어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to + 동사원형(to부정사)\u003c/span> : 힘든(hard) + 찾기(to find) → 찾기 힘든 : \"찾기 힘든\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">장소·시간 짝꿍 말(전치사)\u003c/span> : 동안(during) + 낮(the day) : \"낮 동안\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"Tapirs are also, tapir들은 또한. hard to find, 찾기 힘들어요. during the day, 낮 동안. 이 문장 전체를 해석하면, tapir 또한 낮 동안 찾기 힘듭니다.","hl":"m"},{"n":40,"text":"이 문장은 tapir도 낮에는 찾기 힘들다는 걸 알려 줘요. 앞에서 howler monkey 이야기가 나왔으니까, 또 다른 열대우림 동물을 소개하는 역할도 하고요.","hl":"mn"},{"n":41,"text":"먼저 주어 Tapirs를 보면 한 마리가 아니라 여러 마리예요. 이렇게 여러 개를 가리킬 때는 복수라고 하고, be동사 are를 써요. 그리고 hard to find는 찾기 힘들다는 뜻이에요. hard 같은 형용사 뒤에 to부정사 to find가 오면 찾기가 힘들다는 표현이 만들어져요. 마지막으로 during은 동안이라는 뜻을 가진 전치사예요. 그래서 during the day는 낮 동안이라는 뜻이 되죠. 여러분, hard to find와 during the day를 소리 내어 꼭 따라 읽어 보세요!","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 육지동물이에요,\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are\u003c/span> land animals,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 그들은 머무는 것을 좋아해요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">but\u003c/span> they \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">stay\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">물속과 물 아래에서\u003c/span>\u003cspan class=\"en\">in and under water\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하루 중 대부분을\u003c/span>\u003cspan class=\"en\">most of the day\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러 이유로, 그들은 수중 식물을 먹고 살고,\u003c/span>\u003cspan class=\"en\">for many reasons: they feed on water plants,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 적으로부터 숨으며, 더운 날 동안 더위를 식히기 때문이죠.\u003c/span>\u003cspan class=\"en\">hide from their enemies, and cool off during hot days.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 육지동물이지만, 여러 이유로 물속과 물 아래에서 하루 중 대부분을 보내는 것을 좋아해요. 그들은 수중 식물을 먹고 살고, 자신의 적으로부터 숨으며, 더운 날 동안 (더위를) 식힐 수 있기 때문이죠.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> tapir가 육지동물이면서도 물에서 많은 시간을 보내는 \u003cb class=\"key\">이유\u003c/b>를 알려 줘요. 먹이, 적, 더위 때문에 \u003cb class=\"key\">물속\u003c/b>에서 오래 \u003cb class=\"key\">머문다\u003c/b>는 걸 설명하는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">am·are·is 친구들(be동사)\u003c/span> : 그들은(They) + 이다(are) + 육지동물(land animals) : \"그들은 육지동물이에요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 육지동물이에요(They are land animals) + 하지만(but) + 물에서 지내요(they like to stay) : \"하지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">like + to와 동사원형(~하는 것을 좋아해요)\u003c/span> : 그들은(they) + 좋아해요(like) + 머무는 것을(to stay) : \"머무는 것을 좋아해요\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"They are land animals, 그들은 육지동물이에요. but they like to stay, 하지만 그들은 머무는 것을 좋아해요. in and under water, 물속과 물 아래에서. most of the day, 하루 중 대부분을. for many reasons: they feed on water plants, 여러 이유로, 그들은 수중 식물을 먹고 살고. hide from their enemies, and cool off during hot days, 자신의 적으로부터 숨으며, 더운 날 동안 더위를 식히기 때문이죠.. 이 문장 전체를 해석하면, 그들은 육지동물이지만, 여러 이유로 물속과 물 아래에서 하루 중 대부분을 보내는 것을 좋아해요. 그들은 수중 식물을 먹고 살고, 자신의 적으로부터 숨으며, 더운 날 동안 (더위를) 식힐 수 있기 때문이죠.","hl":"m"},{"n":43,"text":"이 문장은 tapir가 육지동물인데도 왜 물에서 오래 지내는지 이유를 알려 줘요. 먹이를 먹고, 적을 피하고, 더위를 식히기 위해서래요.","hl":"mn"},{"n":44,"text":"먼저 They are land animals는 그들은 육지동물이라는 뜻이에요. 주어 They가 복수라서 be동사 are를 썼어요. 그다음 but은 하지만이라는 뜻의 접속사예요. 앞 내용과 반대되는 이야기를 이어 줄 때 쓰죠. 그리고 like to stay는 머무는 것을 좋아한다는 뜻이에요. like 뒤에 to와 동사원형을 붙이면 하는 것을 좋아한다는 표현이 돼요. 그래서 tapir는 육지동물인데도 하루 중 대부분을 물속과 물 아래에서 보내는 걸 좋아한다는 거예요. 왜 그럴까요? 이유는 바로 뒤에 나와요. 물에 사는 식물을 먹이로 먹고, 적에게서 숨고, 더운 날 더위를 식히기 위해서래요. 문장이 길어도 이유를 하나씩 나눠서 생각하면 어렵지 않아요. 여러분, 아주 잘하고 있어요!","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">오늘 배운 내용 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>열대우림은 많은 동물, 식물, 곤충의 \u003cb class=\"key\">서식지\u003c/b>예요.\u003c/li>\u003cli>howler monkey는 \u003cb class=\"key\">큰 \u003c/b>\u003cb class=\"key\">소리\u003c/b>로 유명하지만 나무 꼭대기에 살아서 잘 안 보여요.\u003c/li>\u003cli>tapir는 육지동물이지만 \u003cb class=\"key\">물속\u003c/b>에서 하루의 대부분을 보내요.\u003c/li>\u003cli>동물마다 숨는 \u003cb class=\"key\">장소\u003c/b>가 달라서 보기 어렵다는 것을 배웠어요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Rainforest animals are hard to see because they live in special places like the tops of trees or in water.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">열대우림은 많은 동물과 식물의 \u003cb class=\"key\">서식지\u003c/b>이지만, 그 동물들을 보기는 쉽지 않아요. howler monkey는 나무 꼭대기에서 큰 소리로 울고, tapir는 \u003cb class=\"key\">물속\u003c/b>에서 지내서 만나기 어려워요.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":45,"text":"오늘 우리는 열대우림 동물들이 왜 보기 힘든지 배웠어요. howler monkey는 나무 꼭대기에서 큰 소리로 울고, tapir는 물속에서 지내요. 두 동물의 사는 장소가 달랐죠. 오늘도 정말 잘했어요! 다음 시간에도 신나게 영어를 읽어 봐요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
