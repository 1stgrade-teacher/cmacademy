</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"왓츠 리딩 100A Ch.4 Unit 02 Liam's Insect Report","audioDir":"reading02_audio","preview":false,"count":45,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.400em\">Ch.4 Unit\u003cbr>02 Liam's\u003cbr>Insect Report\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">왓츠 리딩 100A\u003c/div>\u003ch1>Liam's Insect Report: The Walkingstick\u003c/h1>\u003ch2>리암의 곤충 보고서: 대벌레\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">한 줄 요약\u003c/span>\u003cspan>대벌레는 풀밭이나 숲에 사는 \u003cb class=\"key\">곤충\u003c/b>으로, 날개가 없고 나무 \u003cb class=\"key\">잎\u003c/b>을 먹어요. 색깔을 바꾸거나 다리를 다시 자라게 하는 \u003cb class=\"key\">재미있는 \u003c/b>\u003cb class=\"key\">사실\u003c/b>이 많고, 나무 열매의 성장을 늦출 수도 있어요.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Walkingsticks are wingless insects that live in grass or woods, eat leaves, and have many surprising abilities.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 신기한 곤충에 대한 글을 함께 읽어 볼 거예요. 바로 대벌레, 영어로 walkingstick에 관한 글이에요. 나뭇가지처럼 생겨서 그런 이름이 붙었대요. 오늘 글을 읽으면 대벌레가 어디에 살고 무엇을 먹는지 알 수 있어요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">미리 알면 쉬워요\u003c/span>\u003cdiv class=\"lp-box\">대벌레는 나뭇가지처럼 생긴 \u003cb class=\"key\">곤충\u003c/b>이에요. 영어로는 walkingstick 또는 stick insect라고 불러요. 몸 색깔이 초록색이나 갈색이라 풀밭이나 숲에서 눈에 잘 안 띄어요. 여러분이 운동장에서 나뭇가지와 비슷한 막대를 본 적 있나요? 이렇게 주변과 비슷하게 보이는 \u003cb class=\"key\">위장\u003c/b>은 적을 피하는 데 도움이 된답니다.\u003c/div>","segs":[{"n":2,"text":"대벌레는 나뭇가지처럼 생긴 곤충이에요. 영어로는 walkingstick 또는 stick insect라고 불러요. 몸 색깔이 초록색이나 갈색이라 풀밭이나 숲에서 눈에 잘 안 띄죠. 여러분은 운동장에서 나뭇가지와 비슷한 막대를 본 적 있나요? 이렇게 주변과 비슷하게 보이는 위장은 적을 피하는 데 도움이 된답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>이름과 사는 곳\u003csmall>소개 · 문장 1–4\u003c/small>\u003c/h4>\u003cp>대벌레는 walkingstick이라고 하고, stick insect라고도 불러요. 그것들은 풀밭이나 숲에서 발견되고, 보통 초록색이나 갈색이에요. 날개가 없어서 날 수 없고, \u003cb class=\"key\">몸길이\u003c/b>는 보통 일곱에서 열 센티미터예요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>먹이와 물\u003csmall>설명 · 문장 5–7\u003c/small>\u003c/h4>\u003cp>대벌레는 \u003cb class=\"key\">더듬이\u003c/b>와 다리를 다시 자라게 할 수 있어요. 그것들은 나무의 \u003cb class=\"key\">잎\u003c/b>을 먹고, 신선한 잎에서 \u003cb class=\"key\">물\u003c/b>을 얻어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>나무에 미치는 영향\u003csmall>이유 · 문장 8\u003c/small>\u003c/h4>\u003cp>대벌레는 나무 열매의 \u003cb class=\"key\">성장\u003c/b>을 늦추기 때문에 나무에 \u003cb class=\"key\">해로운\u003c/b> 곤충이 될 수 있어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>놀라운 재미 사실\u003csmall>마무리 · 문장 9–11\u003c/small>\u003c/h4>\u003cp>대벌레는 적을 피하려고 \u003cb class=\"key\">색깔\u003c/b>을 바꾸고, 암컷은 늦가을까지 \u003cb class=\"key\">알\u003c/b>을 낳아요. 공격을 받으면 자기 다리를 잘라 버리고 도망가며, 대벌레는 \u003cb class=\"key\">삼천 \u003c/b>\u003cb class=\"key\">종\u003c/b>이 넘어요. 어떤 종은 길이가 삼십 센티미터보다 더 길 수도 있어요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 대벌레의 이름과 사는 곳부터 먹이, 나무에 미치는 영향, 재미있는 사실까지 차례로 알려 주는 글이에요.","hl":null},{"n":4,"text":"먼저 대벌레의 이름과 사는 곳을 알아볼까요? 대벌레는 walkingstick이라고 하고 stick insect라고도 불러요. 풀밭이나 숲에서 발견되고 보통 초록색이나 갈색을 띠죠. 날개가 없어서 날 수 없고 몸길이는 보통 일곱에서 열 센티미터예요.","hl":"f0"},{"n":5,"text":"다음은 먹이와 물에 대한 내용이에요. 대벌레는 더듬이와 다리를 다시 자라게 할 수 있어요. 나무의 잎을 먹고 신선한 잎에서 물을 얻는다고 해요.","hl":"f1"},{"n":6,"text":"그런데 대벌레가 나무에 좋기만 한 것은 아니에요. 나무 열매의 성장을 늦추기 때문에 나무에 해로운 곤충이 될 수 있거든요.","hl":"f2"},{"n":7,"text":"마지막은 놀라운 재미있는 사실이에요. 대벌레는 적을 피하려고 색깔을 바꾸고 암컷은 늦가을까지 알을 낳아요. 공격을 받으면 자기 다리를 잘라 버리고 도망가며 대벌레는 삼천 종이 넘어요. 어떤 종은 길이가 삼십 센티미터보다 더 길 수도 있답니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">설명하는 글\u003c/span>\u003cspan class=\"lp-pill\">처음\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 대벌레의 이름, 사는 곳, 생김새, 먹이, 재미있는 사실을 차례로 알려 주는 \u003cb class=\"key\">설명하는 \u003c/b>\u003cb class=\"key\">글\u003c/b>이에요. 첫 부분에서 대벌레를 소개하므로 \u003cb class=\"key\">중심 \u003c/b>\u003cb class=\"key\">문장\u003c/b>은 첫 번째 문장에 있다고 볼 수 있어요. 그래서 \u003cb class=\"key\">처음\u003c/b>에 중심 내용이 나오는 짜임이에요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>also called (1)\u003c/b>\u003cspan>다른 이름 알려 줌\u003c/span>\u003cb>so (3)\u003c/b>\u003cspan>이유와 결과를 이어 줌\u003c/span>\u003cb>because (8)\u003c/b>\u003cspan>이유를 알려 줌\u003c/span>\u003cb>also (7)\u003c/b>\u003cspan>내용을 더해 줌\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Walkingstick\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">stick insect\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">they\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">their eggs\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Some species\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 대벌레에 대해 이것저것 알려 주는 설명하는 글이에요. 첫 부분에서 대벌레를 소개하니까 중심 문장은 처음에 있다고 볼 수 있어요. 그래서 처음에 중심 내용이 나오는 짜임이에요.","hl":"ty"},{"n":9,"text":"글의 길잡이 말도 눈에 잘 띄어요. also called는 다른 이름을 알려 주고 so는 이유와 결과를 이어 주며 because는 이유를 알려 줘요. 같은 대벌레를 walkingstick, stick insect, they라고 다르게 부르는 것도 기억해 두세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 단어\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>insect\u003c/b>\u003cem>명사\u003c/em>\u003cspan>곤충\u003c/span>\u003c/div>\u003cdiv>\u003cb>be found\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>발견되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>grass\u003c/b>\u003cem>명사\u003c/em>\u003cspan>풀밭\u003c/span>\u003c/div>\u003cdiv>\u003cb>woods\u003c/b>\u003cem>명사\u003c/em>\u003cspan>숲\u003c/span>\u003c/div>\u003cdiv>\u003cb>usually\u003c/b>\u003cem>부사\u003c/em>\u003cspan>보통\u003c/span>\u003c/div>\u003cdiv>\u003cb>color\u003c/b>\u003cem>명사\u003c/em>\u003cspan>색깔\u003c/span>\u003c/div>\u003cdiv>\u003cb>wings\u003c/b>\u003cem>명사\u003c/em>\u003cspan>날개\u003c/span>\u003c/div>\u003cdiv>\u003cb>fly\u003c/b>\u003cem>동사\u003c/em>\u003cspan>날다\u003c/span>\u003c/div>\u003cdiv>\u003cb>regrow\u003c/b>\u003cem>동사\u003c/em>\u003cspan>다시 자라다\u003c/span>\u003c/div>\u003cdiv>\u003cb>antennae\u003c/b>\u003cem>명사\u003c/em>\u003cspan>더듬이\u003c/span>\u003c/div>\u003cdiv>\u003cb>leaves\u003c/b>\u003cem>명사\u003c/em>\u003cspan>잎\u003c/span>\u003c/div>\u003cdiv>\u003cb>fresh\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>신선한\u003c/span>\u003c/div>\u003cdiv>\u003cb>harmful\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>해로운\u003c/span>\u003c/div>\u003cdiv>\u003cb>slow down\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>늦추다\u003c/span>\u003c/div>\u003cdiv>\u003cb>growth\u003c/b>\u003cem>명사\u003c/em>\u003cspan>성장\u003c/span>\u003c/div>\u003cdiv>\u003cb>hide\u003c/b>\u003cem>동사\u003c/em>\u003cspan>숨다\u003c/span>\u003c/div>\u003cdiv>\u003cb>enemies\u003c/b>\u003cem>명사\u003c/em>\u003cspan>적\u003c/span>\u003c/div>\u003cdiv>\u003cb>females\u003c/b>\u003cem>명사\u003c/em>\u003cspan>암컷\u003c/span>\u003c/div>\u003cdiv>\u003cb>lay eggs\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>알을 낳다\u003c/span>\u003c/div>\u003cdiv>\u003cb>species\u003c/b>\u003cem>명사\u003c/em>\u003cspan>종\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"오늘의 단어도 소리 내어 읽어 볼게요. insect는 곤충, usually는 보통, harmful은 해로운이라는 뜻이에요. regrow는 다시 자라다, species는 종이라는 뜻도 꼭 기억해요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">usually\u003c/b>\u003cspan class=\"m\">보통\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">often\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">never\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">harmful\u003c/b>\u003cspan class=\"m\">해로운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">bad\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">safe\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">hide\u003c/b>\u003cspan class=\"m\">숨다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">cover\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">show\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">fresh\u003c/b>\u003cspan class=\"m\">신선한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">new\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">old\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">slow down\u003c/b>\u003cspan class=\"m\">늦추다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">delay\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">speed up\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"비슷한 말과 반대말도 함께 정리해요. usually는 often과 비슷하고 never와 반대예요. harmful은 bad와 비슷하고 safe와 반대죠. hide는 cover와 비슷하고 show와 반대, fresh는 new와 비슷하고 old와 반대예요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">곤충 이름: 대벌레,\u003c/span>\u003cspan class=\"en\">Insect Name: Walkingstick,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나뭇가지벌레라고도 불림\u003c/span>\u003cspan class=\"en\">also called stick insect\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들은 어디에 사는가?:\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Where \u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">live?\u003c/span>:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들은 발견될 수 있다\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">found\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">풀밭이나 숲에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">grass\u003c/span> or the woods.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">곤충 이름: 대벌레, 나뭇가지벌레라고도 불림 그것들은 어디에 사는가?: 그것들은 풀밭이나 숲에서 발견될 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 줄은 대벌레의 \u003cb class=\"key\">이름\u003c/b>과 사는 \u003cb class=\"key\">장소\u003c/b>를 알려 줘요. 대벌레는 \u003cb class=\"key\">풀밭\u003c/b>이나 숲에서 발견돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문문 만들기(do 의문문)\u003c/span> : 어디에(Where) + do + 누가(they) + 하다(live)? : \"그것들은 어디에 사는가?\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">도와주는 동사(조동사) can\u003c/span> : 누가(they) + ~될 수 있다(can be) + 발견되다(found) : \"발견될 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">장소·시간 짝꿍 말(전치사)\u003c/span> : 안에·에서(in) + 풀밭(grass) : \"풀밭에서\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Insect Name: Walkingstick, 곤충 이름: 대벌레. also called stick insect, 나뭇가지벌레라고도 불림. Where do they live?, 그것들은 어디에 사는가?:. They can be found, 그것들은 발견될 수 있다. in grass or the woods, 풀밭이나 숲에서. 이 문장 전체를 해석하면, 곤충 이름: 대벌레, 나뭇가지벌레라고도 불림 그것들은 어디에 사는가?: 그것들은 풀밭이나 숲에서 발견될 수 있다.","hl":"m"},{"n":13,"text":"이 줄은 대벌레의 이름과 사는 곳을 알려 줘요. 대벌레는 풀밭이나 숲에서 발견된대요. 우리 동네 공원에서도 만날 수 있을지 상상해 보세요.","hl":"mn"},{"n":14,"text":"여기서 꼭 기억할 점이 세 가지예요. 하나, Where do they live?처럼 물어볼 때는 do를 앞으로 보내요. 둘, can be found는 발견될 수 있다는 뜻이고, can이 동사를 도와주는 조동사예요. be found는 발견되다라는 덩어리 표현으로 통째로 외워요. 셋, in grass의 in은 풀밭이라는 장소를 알려 주는 짝꿍 말이고, grass는 풀밭이라는 뜻이에요. 어렵지 않죠?","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들은 어떻게 생겼나?:\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">What \u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">look \u003c/span>\u003cspan class=\"tgt\">like?\u003c/span>:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들은 보통 초록색이다\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">usually \u003c/span>\u003cspan class=\"tgt\">green\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또는 색깔이 갈색이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">brown\u003c/span> in color.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것들은 어떻게 생겼나?: 그것들은 보통 초록색이나 갈색이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 줄은 대벌레의 \u003cb class=\"key\">생김새\u003c/b>와 \u003cb class=\"key\">색깔\u003c/b>을 알려 줘요. 보통 초록색이나 갈색이라서 나뭇가지에 \u003cb class=\"key\">숨기\u003c/b> 좋아요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문문 만들기(do 의문문)\u003c/span> : 무엇(What) + do + 누가(they) + 하다(look like)? : \"그것들은 무엇처럼 보이나?\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be동사 + 꾸며 주는 말(be동사와 형용사)\u003c/span> : 누가(They) + 이다(are) + 보통(usually) + 초록색(green) : \"그것들은 보통 초록색이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 초록색(green) + 또는(or) + 갈색(brown) : \"또는 갈색\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"What do they look like?, 그것들은 어떻게 생겼나?:. They are usually green, 그것들은 보통 초록색이다. or brown in color, 또는 색깔이 갈색이다. 이 문장 전체를 해석하면, 그것들은 어떻게 생겼나?: 그것들은 보통 초록색이나 갈색이다.","hl":"m"},{"n":16,"text":"이 줄은 대벌레가 어떻게 생겼는지 알려 줘요. 보통 초록색이나 갈색이라서 나뭇가지나 풀잎에 숨기 좋대요.","hl":"mn"},{"n":17,"text":"짚어 볼 점이 있어요. What do they look like?는 생김새를 묻는 질문이고, 이때도 do가 앞에 와요. 그리고 are usually green에서 are는 이다라는 뜻의 be동사예요. usually는 보통이라는 뜻으로 색깔을 더 자세히 알려 주고요. 마지막으로 or는 초록색과 갈색, 둘 중 하나를 고르게 해 주는 이어 주는 말이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 11\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들은 날개를 가지고 있지 않다,\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">wings\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서 그것들은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">so\u003c/span> they\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">날 수 없다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">cannot \u003c/span>\u003cspan class=\"tgt\">fly\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것들은 날개가 없어서 날 수 없다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 날개가 없어서 날 수 없다는 \u003cb class=\"key\">이유\u003c/b>와 \u003cb class=\"key\">결과\u003c/b>를 알려 줘요. \u003cb class=\"key\">so\u003c/b>가 앞뒤를 이어 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정문 만들기(do 부정문)\u003c/span> : 누가(They) + 하지 않는다(don't) + 가지다(have) + 무엇을(wings) : \"날개를 가지고 있지 않다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 이유(They don't have wings) + 그래서(so) + 결과(they cannot fly) : \"그래서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">도와주는 동사(조동사) can의 부정\u003c/span> : 누가(they) + 할 수 없다(cannot) + 하다(fly) : \"날 수 없다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"They don't have wings, 그것들은 날개를 가지고 있지 않다. so they, 그래서 그것들은. cannot fly, 날 수 없다. 이 문장 전체를 해석하면, 그것들은 날개가 없어서 날 수 없다.","hl":"m"},{"n":19,"text":"이 문장은 대벌레에게 날개가 없어서 날 수 없다는 걸 알려 줘요. 날개가 없다는 이유와 날 수 없다는 결과가 so로 이어져 있어요.","hl":"mn"},{"n":20,"text":"여기서는 세 가지만 짚을게요. They don't have wings는 날개를 가지고 있지 않다는 부정문이고, don't가 동사 앞에서 뜻을 뒤집어요. 그리고 so는 그래서라는 뜻으로 이유와 결과를 이어 줘요. 마지막으로 cannot fly는 날 수 없다는 뜻이고, cannot 뒤에는 동사원형 fly가 와요. 이 문장은 통째로 외워 두면 정말 좋아요!","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들은 ~이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">They \u003c/span>\u003cspan class=\"tgt\">are\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보통\u003c/span>\u003cspan class=\"en\">usually\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">7에서 10cm만큼 길다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">7 \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">10 \u003c/span>\u003cspan class=\"tgt\">cm \u003c/span>\u003cspan class=\"tgt\">long\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것들은 보통 길이가 7~10cm이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 대벌레의 \u003cb class=\"key\">몸 \u003c/b>\u003cb class=\"key\">길이\u003c/b>를 알려 주는 문장이에요. 보통 7~10cm라고 하니 \u003cb class=\"key\">크기\u003c/b>가 어느 정도인지 그려 볼 수 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사(be동사)\u003c/span> : 그것들은(They) + 이다(are) : \"그것들은 ~이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">꾸며 주는 말(형용사)\u003c/span> : 숫자(7 to 10) + 길다(long) : \"7에서 10cm만큼 긴\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"They are, 그것들은 ~이다. usually, 보통. 7 to 10 cm long, 7에서 10cm만큼 길다. 이 문장 전체를 해석하면, 그것들은 보통 길이가 7~10cm이다.","hl":"m"},{"n":22,"text":"이 문장은 대벌레가 얼마나 큰지 알려 줘요. 보통 일곱에서 열 센티미터니까 여러분 손바닥만 한 크기예요.","hl":"mn"},{"n":23,"text":"먼저, 여러 마리를 가리키는 They 뒤에는 are를 써요. 그리고 길이를 말할 때는 숫자 뒤에 long을 붙여요. seven to ten은 일곱에서 열까지, 그러니까 범위를 말하는 거예요. 숫자를 이어 줄 때 to를 쓴다고 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들은 다시 자라게 할 수 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">They \u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">regrow\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들의 더듬이를\u003c/span>\u003cspan class=\"en\">their \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">antennae \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 다리를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">legs\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것들은 더듬이와 다리를 재생시킬 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 대벌레의 \u003cb class=\"key\">신기한 \u003c/b>\u003cb class=\"key\">능력\u003c/b>을 알려 주는 문장이에요. 잃어버린 \u003cb class=\"key\">더듬이와 \u003c/b>\u003cb class=\"key\">다리\u003c/b>를 다시 자라게 할 수 있다고 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">도와주는 동사(조동사)\u003c/span> : 그것들은(They) + 할 수 있다(can) + 다시 자라게 하다(regrow) : \"그것들은 다시 자라게 할 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 더듬이(antennae) + 그리고(and) + 다리(legs) : \"더듬이와 다리\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"They can regrow, 그것들은 다시 자라게 할 수 있다. their antennae, 그것들의 더듬이를. and legs, 그리고 다리를. 이 문장 전체를 해석하면, 그것들은 더듬이와 다리를 재생시킬 수 있다.","hl":"m"},{"n":25,"text":"대벌레는 잃어버린 더듬이와 다리를 다시 자라게 할 수 있어요. 정말 신기한 능력이죠?","hl":"mn"},{"n":26,"text":"can은 동사 앞에서 '할 수 있다'는 힘을 더해 주는 도와주는 동사예요. can 뒤에는 꼭 동사원형이 와서 regrow라고 써요. 그리고 and는 더듬이와 다리, 두 가지를 나란히 이어 주는 말이에요. 여러분도 'apples and bananas'처럼 and를 자주 쓰죠?","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들은 먹는다\u003c/span>\u003cspan class=\"en\">What do they eat?: \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">They \u003c/span>\u003cspan class=\"tgt\">eat\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 잎을\u003c/span>\u003cspan class=\"en\">the leaves\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나무의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">trees\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것들은 나무의 잎을 먹는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 대벌레가 무엇을 먹는지 알려 주는 문장이에요. \u003cb class=\"key\">나무 \u003c/b>\u003cb class=\"key\">잎\u003c/b>을 먹는다는 아주 중요한 정보를 담고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재에 하는 일(일반동사 현재형)\u003c/span> : 그것들은(They) + 먹는다(eat) : \"그것들은 먹는다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">'~의'를 나타내는 말(전치사)\u003c/span> : 잎(leaves) + ~의(of) + 나무(trees) : \"나무의\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"They eat, 그것들은 먹는다. the leaves, 그 잎을. of trees, 나무의. 이 문장 전체를 해석하면, 그것들은 나무의 잎을 먹는다.","hl":"m"},{"n":28,"text":"이 문장은 대벌레의 먹이를 알려 줘요. 바로 나무 잎이에요. 우리가 먹는 간식 대신 나무 잎을 먹는 거죠.","hl":"mn"},{"n":29,"text":"여러 마리가 하는 일을 말할 때는 동사에 s를 붙이지 않아요. 그래서 They eat이라고 해요. 그리고 of는 '의'라는 뜻으로, the leaves of trees를 나무의 잎이라고 읽어요. 오늘 배운 문장은 꼭 소리 내어 따라 써 보세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들은 또한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">They \u003c/span>\u003cspan class=\"tgt\">also \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">물을 얻는다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">get\u003c/span> water\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">신선한 잎에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">fresh \u003c/span>\u003cspan class=\"tgt\">leaves\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것들은 또한 신선한 잎에서 물을 얻는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 대벌레가 \u003cb class=\"key\">신선한 \u003c/b>\u003cb class=\"key\">잎\u003c/b>에서 \u003cb class=\"key\">물\u003c/b>을 얻는다는 것을 알려 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재 시제 일반동사(일반동사 현재형)\u003c/span> : 누가(They) + 또한(also) + 얻는다(get) : \"그것들은 또한 얻는다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">출처를 나타내는 전치사(from)\u003c/span> : from + 무엇(fresh leaves) : \"신선한 잎에서\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"They also, 그것들은 또한. get water, 물을 얻는다. from fresh leaves, 신선한 잎에서. 이 문장 전체를 해석하면, 그것들은 또한 신선한 잎에서 물을 얻는다.","hl":"m"},{"n":31,"text":"이 문장은 대벌레가 신선한 잎에서 물을 얻는다는 것을 알려 줘요. 잎에서 물을 얻는다니 신기하죠?","hl":"mn"},{"n":32,"text":"첫 번째, They also get은 늘 하는 일을 말하는 현재 시제예요. 주어 They는 여러 개라서 get을 그대로 써요. 두 번째, from fresh leaves에서 from은 출처를 말해요. fresh leaves는 신선한 잎이라는 뜻이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 11\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들은 ~일 수 있다\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">be\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나무에 해로운\u003c/span>\u003cspan class=\"en\">harmful to trees\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜냐하면 그들이 늦추기 때문에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">because \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">slow \u003c/span>\u003cspan class=\"tgt\">down \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나무 열매의 성장을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">growth\u003c/span> of their fruits.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들이 나무 열매의 성장을 늦추기 때문에, 그것들은 나무에 해로울 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 대벌레가 나무에 \u003cb class=\"key\">해로울 \u003c/b>\u003cb class=\"key\">수\u003c/b> 있다는 것과 그 \u003cb class=\"key\">이유\u003c/b>를 알려 줘요. \u003cb class=\"key\">열매의 \u003c/b>\u003cb class=\"key\">성장\u003c/b>을 늦추기 때문이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">도와주는 동사 can(조동사 can) + be동사\u003c/span> : 누가(They) + ~할 수 있다(can) + 상태이다(be) : \"~일 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이유를 이어 주는 접속사(because)\u003c/span> : because + 이유(they slow down the growth) : \"왜냐하면 그들이 성장을 늦추기 때문에\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"They can be, 그것들은 ~일 수 있다. harmful to trees, 나무에 해로운. because they slow down, 왜냐하면 그들이 늦추기 때문에. the growth of their fruits, 나무 열매의 성장을. 이 문장 전체를 해석하면, 그들이 나무 열매의 성장을 늦추기 때문에, 그것들은 나무에 해로울 수 있다.","hl":"m"},{"n":34,"text":"이 문장은 대벌레가 나무에 해로울 수 있다는 것과 그 이유를 알려 줘요. 열매의 성장을 늦추기 때문이에요.","hl":"mn"},{"n":35,"text":"첫 번째, can be에서 can은 할 수 있다는 뜻이고 be는 상태를 나타내는 be동사예요. 그래서 나무에 해로운 상태가 될 수 있다는 말이 돼요. 두 번째, because는 이유를 이어 주는 접속사예요. 뒤에 오는 they slow down the growth가 이유가 되는 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">재미있는 사실들: •\u003c/span>\u003cspan class=\"en\">Fun Facts: •\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들은 몸의 색을 바꿀 수 있다\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">change\u003c/span> their color\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 적으로부터 숨기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">hide\u003c/span> from their enemies.\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">• 암컷은\u003c/span>\u003cspan class=\"en\">• The females\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">7월부터 알을 낳는다\u003c/span>\u003cspan class=\"en\">lay eggs \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">July \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">늦가을까지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">late \u003c/span>\u003cspan class=\"tgt\">fall\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">재미있는 사실들: • 그것들은 적으로부터 숨기 위해 몸의 색을 바꿀 수 있다. • 암컷은 7월부터 늦가을까지 알을 낳는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 부분은 대벌레의 \u003cb class=\"key\">재미있는 \u003c/b>\u003cb class=\"key\">사실\u003c/b>을 알려 줘요. \u003cb class=\"key\">색을 \u003c/b>\u003cb class=\"key\">바꾸는 \u003c/b>\u003cb class=\"key\">것\u003c/b>과 \u003cb class=\"key\">알을 \u003c/b>\u003cb class=\"key\">낳는 \u003c/b>\u003cb class=\"key\">때\u003c/b>를 소개해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">도와주는 동사 can(조동사 can)\u003c/span> : 누가(They) + 할 수 있다(can) + 바꾸다(change) : \"바꿀 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to + 동사원형(to부정사)\u003c/span> : to + 하다(hide) : \"숨기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">시작과 끝을 나타내는 from A to B\u003c/span> : from + 시작(July) + to + 끝(late fall) : \"7월부터 늦가을까지\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Fun Facts: •, 재미있는 사실들: •. They can change their color, 그것들은 몸의 색을 바꿀 수 있다. to hide from their enemies, 그들의 적으로부터 숨기 위해. • The females, • 암컷은. lay eggs from July, 7월부터 알을 낳는다. to late fall, 늦가을까지. 이 문장 전체를 해석하면, 재미있는 사실들: • 그것들은 적으로부터 숨기 위해 몸의 색을 바꿀 수 있다. • 암컷은 7월부터 늦가을까지 알을 낳는다.","hl":"m"},{"n":37,"text":"이 부분은 대벌레의 재미있는 사실을 알려 줘요. 색을 바꾸는 것과 알을 낳는 때를 소개해요.","hl":"mn"},{"n":38,"text":"첫 번째, can change에서 can은 할 수 있다는 뜻이고 뒤에는 동사원형 change가 와요. 그래서 색을 바꿀 수 있다는 말이 돼요. 두 번째, to hide는 숨기 위해라는 목적을 나타내는 to부정사예요. 세 번째, from July to late fall은 시작과 끝을 말해서 July부터 늦가을까지라는 뜻이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들의 알은 식물의 씨앗처럼 보인다.\u003c/span>\u003cspan class=\"en\">Their eggs \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">look \u003c/span>\u003cspan class=\"tgt\">like\u003c/span> plant seeds.\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">• 그것들이 공격을 받으면\u003c/span>\u003cspan class=\"en\">• \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">under \u003c/span>\u003cspan class=\"tgt\">attack\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들은 자기 다리를 잘라버리고\u003c/span>\u003cspan class=\"en\">they \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">cut \u003c/span>\u003cspan class=\"tgt\">off \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">own \u003c/span>\u003cspan class=\"tgt\">legs \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">달아난다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">run \u003c/span>\u003cspan class=\"tgt\">away\u003c/span>.\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">• 3,000종이 넘게 있고\u003c/span>\u003cspan class=\"en\">• There are over 3,000 species\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대벌레의\u003c/span>\u003cspan class=\"en\">of stick insects.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것들의 알은 식물의 씨앗처럼 보인다. 그것들은 공격을 받으면 다리를 잘라버리고 달아난다. 대벌레는 3,000종이 넘는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 대벌레의 \u003cb class=\"key\">재미있는 \u003c/b>\u003cb class=\"key\">사실\u003c/b> 세 가지를 알려 주는 문장이에요. 알은 씨앗처럼 생겼고, 위험에 닥치면 \u003cb class=\"key\">다리를 \u003c/b>\u003cb class=\"key\">잘라\u003c/b> 도망가고, 대벌레는 삼천 종이 넘는다는 내용이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">~처럼 보이다(동사 look + like)\u003c/span> : 무엇이(Their eggs) + 보인다(look) + ~처럼(like) + 무엇(plant seeds) : \"~처럼 보인다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">때를 알려 주는 이어 주는 말(접속사 when)\u003c/span> : When + 누가(they) + 어떨 때(are under attack), 주어 + 동사 : \"그것들이 공격을 받을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사) and\u003c/span> : 한다(cut off) + 그리고(and) + 한다(run away) : \"다리를 잘라버리고 달아난다\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"Their eggs look like plant seeds, 그것들의 알은 식물의 씨앗처럼 보인다.. • When they are under attack, • 그것들이 공격을 받으면. they cut off their own legs, 그것들은 자기 다리를 잘라버리고. and run away, 달아난다.. • There are over 3,000 species, • 3,000종이 넘게 있고. of stick insects, 대벌레의. 이 문장 전체를 해석하면, 그것들의 알은 식물의 씨앗처럼 보인다. 그것들은 공격을 받으면 다리를 잘라버리고 달아난다. 대벌레는 3,000종이 넘는다.","hl":"m"},{"n":40,"text":"이 문장은 대벌레의 재미있는 사실 세 가지를 알려 줘요. 알은 식물의 씨앗처럼 생겼고요, 위험에 닥치면 다리를 잘라 도망간다고 해요. 그리고 대벌레는 삼천 종이 넘는다니 정말 놀랍죠?","hl":"mn"},{"n":41,"text":"이제 문법을 짚어 볼게요. 첫 번째, look like는 '~처럼 보인다'라는 뜻으로 꼭 한 덩어리로 외워 두세요. 두 번째, when은 '~할 때'라는 뜻으로 때를 알려 주는 이어 주는 말이에요. 세 번째, and는 자르다와 달아나다처럼 두 가지 일을 이어 줄 때 쓴답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 종은\u003c/span>\u003cspan class=\"en\">Some species\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~일 수 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">be\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">30cm보다 더 길다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">30 \u003c/span>\u003cspan class=\"tgt\">cm \u003c/span>\u003cspan class=\"tgt\">long\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어떤 종은 길이가 30cm가 넘을 수도 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 대벌레 중에는 아주 \u003cb class=\"key\">긴 \u003c/b>\u003cb class=\"key\">종\u003c/b>도 있다는 걸 알려 주는 문장이에요. \u003cb class=\"key\">길이\u003c/b>가 30cm가 넘을 수 있다고 해서, 대벌레가 얼마나 긴지 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">도와주는 동사(조동사) can\u003c/span> : 무엇이(Some species) + ~일 수 있다(can be) + 얼마나(30 cm long) : \"~일 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">~보다 더(비교급) more than\u003c/span> : more than + 숫자 = 그 숫자보다 더 많이 : \"30cm보다 더 긴\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"Some species, 어떤 종은. can be, ~일 수 있다. more than 30 cm long, 30cm보다 더 길다. 이 문장 전체를 해석하면, 어떤 종은 길이가 30cm가 넘을 수도 있다.","hl":"m"},{"n":43,"text":"이 문장은 대벌레 중에 아주 긴 종도 있다는 걸 알려 줘요. 어떤 종은 길이가 삼십 센티미터가 넘을 수도 있다고 해요. 우리가 아는 곤충보다 훨씬 길죠?","hl":"mn"},{"n":44,"text":"문법도 짚어 볼게요. 첫 번째, can은 동사를 도와주는 도와주는 동사예요. 여기서는 be와 만나 '~일 수 있다'라는 뜻이 됐어요. 두 번째, more than은 숫자 앞에 붙어서 '그 숫자보다 더'라는 뜻을 만들어요. 그래서 more than thirty centimeters는 '삼십 센티미터보다 더'가 되고, 숫자 앞에 오면 이상이라는 뜻도 된답니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">오늘 배운 내용 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>대벌레는 walkingstick 또는 stick insect라고 불리는 \u003cb class=\"key\">곤충\u003c/b>이에요.\u003c/li>\u003cli>그것들은 풀밭이나 숲에 살고, 날개가 없어서 \u003cb class=\"key\">날 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">없어요\u003c/b>.\u003c/li>\u003cli>나무의 잎을 먹고 신선한 잎에서 \u003cb class=\"key\">물\u003c/b>을 얻어요.\u003c/li>\u003cli>색깔을 바꾸거나 다리를 다시 자라게 하는 \u003cb class=\"key\">재미있는 \u003c/b>\u003cb class=\"key\">재주\u003c/b>가 있어요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Walkingsticks are wingless insects that live in grass or woods, eat leaves, and have many surprising abilities.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">대벌레는 풀밭이나 숲에 사는 \u003cb class=\"key\">곤충\u003c/b>으로, 날개가 없고 나무 \u003cb class=\"key\">잎\u003c/b>을 먹어요. 색깔을 바꾸거나 다리를 다시 자라게 하는 \u003cb class=\"key\">재미있는 \u003c/b>\u003cb class=\"key\">사실\u003c/b>이 많고, 나무 열매의 성장을 늦출 수도 있어요.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":45,"text":"오늘은 대벌레가 어디에 살고 무엇을 먹는지, 또 어떤 재미있는 재주가 있는지 배웠어요. 날개가 없어서 날 수 없다는 점과 색깔을 바꾸는 위장 재주를 꼭 기억해요. 여러분 모두 끝까지 잘 따라와서 정말 멋졌어요. 다음 시간에도 신기한 영어 이야기로 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
