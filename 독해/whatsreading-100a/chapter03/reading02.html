</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"왓츠 리딩 100A Ch.3 Unit 02 The Warm Arctic","audioDir":"reading02_audio","preview":false,"count":57,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.425em\">Ch.3\u003cbr>Unit 02 The\u003cbr>Warm Arctic\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">왓츠 리딩 100A\u003c/div>\u003ch1>The Warm Arctic\u003c/h1>\u003ch2>따뜻해지는 북극\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">한 줄 요약\u003c/span>\u003cspan>북극은 여름에는 해가 지지 않고 겨울에는 해가 뜨지 않는 곳이에요. 그런데 우리가 \u003cb class=\"key\">에너지\u003c/b>를 너무 많이 써서 얼음이 빨리 녹았고, 그 일로 \u003cb class=\"key\">새끼 \u003c/b>\u003cb class=\"key\">북극곰\u003c/b>들이 떠내려가게 되었어요.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The Arctic is getting warmer because we use too much energy, so the ice melts fast and polar bear cubs lose their home.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘도 만나서 반가워요. 오늘은 북극에서 일어난 조금 슬프지만 아주 중요한 이야기를 읽어 볼 거예요. 제목은 The Warm Arctic, 따뜻해지는 북극이에요. 우리가 쓰는 에너지 때문에 북극의 얼음이 빨리 녹고 있다는 이야기랍니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">미리 알면 쉬워요\u003c/span>\u003cdiv class=\"lp-box\">북극(Arctic)은 지구 맨 위쪽에 있는 아주 추운 곳이에요. 여름에는 해가 \u003cb class=\"key\">지지 \u003c/b>\u003cb class=\"key\">않고\u003c/b> 겨울에는 해가 뜨지 않는 신기한 곳이지요. 그래서 북극곰(polar bear)은 얼음 위에서 살아요. 우리가 집을 따뜻하게 하고 공장을 돌리려고 \u003cb class=\"key\">에너지\u003c/b>를 많이 쓰면, 지구를 덮은 담요가 점점 두꺼워져요. 겨울에 이불을 두 겹 덮으면 금방 더워지는 것처럼, 지구도 그렇게 더워진답니다.\u003c/div>","segs":[{"n":2,"text":"북극은 지구 맨 위쪽에 있는 아주 추운 곳이에요. 여름에는 해가 지지 않고 겨울에는 해가 뜨지 않는 신기한 곳이죠. 그곳에 사는 동물이 바로 polar bear, 북극곰이에요. 여러분, 겨울에 이불을 두 겹 덮으면 금방 더워지는 경험 해 본 적 있나요? 지구도 똑같아요. 우리가 에너지를 많이 쓰면 지구를 덮은 담요가 두꺼워져서 점점 더워진답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>변하지 않던 북극\u003csmall>시작 · 문장 1–4\u003c/small>\u003c/h4>\u003cp>북극에서는 여름에 해가 \u003cb class=\"key\">지지 \u003c/b>\u003cb class=\"key\">않고\u003c/b>, 겨울에는 해가 뜨지 않아요. 그런데 최근에 무엇인가 \u003cb class=\"key\">바뀌기 \u003c/b>\u003cb class=\"key\">시작\u003c/b>했어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>얼음 위 하얀 공\u003csmall>소개 · 문장 5–7\u003c/small>\u003c/h4>\u003cp>어느 날 나는 아빠와 함께 배를 타고 있었어요. 얼음판 위에 하얀 공 두 개가 보였는데, 아빠는 그것이 \u003cb class=\"key\">새끼 \u003c/b>\u003cb class=\"key\">북극곰\u003c/b>이라고 알려 주셨어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>어미를 잃은 새끼\u003csmall>문제 · 문장 8–11\u003c/small>\u003c/h4>\u003cp>아빠는 새끼들이 \u003cb class=\"key\">어미를 \u003c/b>\u003cb class=\"key\">잃은 \u003c/b>\u003cb class=\"key\">것\u003c/b> 같다고 하셨어요. 새끼들 아래의 얼음이 깨져서 새끼들을 떠내려 보냈고, 얼음이 \u003cb class=\"key\">너무 \u003c/b>\u003cb class=\"key\">빨리 \u003c/b>\u003cb class=\"key\">녹았\u003c/b>기 때문이에요. 그래서 나는 왜 그런지 아빠에게 물었어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>빨리 녹은 이유\u003csmall>이유 · 문장 12–15\u003c/small>\u003c/h4>\u003cp>아빠는 우리가 집을 따뜻하게 하고 공장을 돌리려고 \u003cb class=\"key\">에너지\u003c/b>를 너무 많이 써서 그렇다고 하셨어요. 화석 연료를 태우면 \u003cb class=\"key\">가스\u003c/b>가 생기고, 그 가스가 지구를 덮은 텐트처럼 \u003cb class=\"key\">열을 \u003c/b>\u003cb class=\"key\">가둬\u003c/b> 북극을 더 따뜻하게 만들어요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 오늘 글의 흐름을 함께 따라가 볼까요?","hl":null},{"n":4,"text":"먼저 북극의 규칙이 나와요. 여름에는 해가 지지 않고 겨울에는 해가 뜨지 않는다고 하죠. 그런데 최근에 무엇인가 바뀌기 시작했다고 해요. 아주 오래 변하지 않던 곳에 변화가 생겼다니 궁금하지 않나요?","hl":"f0"},{"n":5,"text":"어느 날 화자가 아빠와 함께 배를 타고 있었어요. 그때 얼음판 위에 하얀 공 두 개를 보았죠. 아빠가 저것들은 새끼 북극곰이라고 알려 줍니다. 하얀 공 두 개가 사실은 polar bear cubs였던 거예요.","hl":"f1"},{"n":6,"text":"아빠는 새끼들이 어미를 잃은 것 같다고 말해요. 새끼들 아래의 얼음이 깨져서 새끼들을 떠내려 보냈고, 얼음이 너무 빨리 녹았기 때문이래요. 그래서 화자는 왜 얼음이 그렇게 빨리 녹았는지 묻습니다.","hl":"f2"},{"n":7,"text":"아빠의 대답이 오늘 이야기의 핵심이에요. 우리가 집을 따뜻하게 하고 공장을 돌리려고 에너지를 너무 많이 썼기 때문이래요. 화석 연료를 태우면 가스가 생기고, 그 가스가 지구를 감싼 텐트처럼 열을 가둬서 북극이 매년 더 따뜻해진다고 해요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">이야기 순서\u003c/span>\u003cspan class=\"lp-pill\">끝\u003c/span>\u003cspan class=\"lp-pill\">주제문 15번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 이야기 순서로 짜였어요. 처음에는 변하지 않던 북극의 모습을 보여 주고, 가운데에서 얼음이 깨져 새끼 곰이 떠내려간 일을 들려줘요. 마지막에 아빠가 \u003cb class=\"key\">이유\u003c/b>를 설명해 주면서 \u003cb class=\"key\">중심 \u003c/b>\u003cb class=\"key\">생각\u003c/b>이 끝에 나온답니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>But recently (4)\u003c/b>\u003cspan>앞 내용과 반대되는 변화를 알려 줌\u003c/span>\u003cb>One day (5)\u003c/b>\u003cspan>이야기가 시작되는 때를 알려 줌\u003c/span>\u003cb>because (12)\u003c/b>\u003cspan>이유를 알려 줌\u003c/span>\u003cb>and (14)\u003c/b>\u003cspan>두 내용을 이어 줌\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">two white balls\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">polar bear cubs\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">they\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">them\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 이야기 순서로 짜인 글이에요. 처음에 북극의 모습을 보여 주고, 가운데에서 새끼 곰을 만난 일을 들려주고, 마지막에 그 이유를 설명해요. 중심 문장은 글의 끝, 마지막 문장에 있답니다.","hl":"ty"},{"n":9,"text":"길잡이 말을 눈여겨보세요. 네 번째 문장의 But recently는 앞 내용과 반대되는 변화를 알려 줘요. 다섯 번째 문장의 One day는 이야기가 시작되는 때를 알려 주고, 열두 번째 문장의 because는 이유를 알려 준답니다. 또 하얀 공 두 개는 polar bear cubs, 새끼 북극곰을 다르게 부른 말이에요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 단어\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>change\u003c/b>\u003cem>동사\u003c/em>\u003cspan>바뀌다\u003c/span>\u003c/div>\u003cdiv>\u003cb>Arctic\u003c/b>\u003cem>명사\u003c/em>\u003cspan>북극\u003c/span>\u003c/div>\u003cdiv>\u003cb>set\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(해가) 지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>rise\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(해가) 뜨다\u003c/span>\u003c/div>\u003cdiv>\u003cb>recently\u003c/b>\u003cem>부사\u003c/em>\u003cspan>최근에\u003c/span>\u003c/div>\u003cdiv>\u003cb>boat ride\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>배 타기\u003c/span>\u003c/div>\u003cdiv>\u003cb>sheet of ice\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>얼음판\u003c/span>\u003c/div>\u003cdiv>\u003cb>polar bear\u003c/b>\u003cem>명사\u003c/em>\u003cspan>북극곰\u003c/span>\u003c/div>\u003cdiv>\u003cb>cub\u003c/b>\u003cem>명사\u003c/em>\u003cspan>새끼\u003c/span>\u003c/div>\u003cdiv>\u003cb>lose\u003c/b>\u003cem>동사\u003c/em>\u003cspan>잃다\u003c/span>\u003c/div>\u003cdiv>\u003cb>break off\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>깨져 떨어지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>carry away\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>떠내려 보내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>melt\u003c/b>\u003cem>동사\u003c/em>\u003cspan>녹다\u003c/span>\u003c/div>\u003cdiv>\u003cb>energy\u003c/b>\u003cem>명사\u003c/em>\u003cspan>에너지\u003c/span>\u003c/div>\u003cdiv>\u003cb>heat\u003c/b>\u003cem>동사\u003c/em>\u003cspan>난방하다, 데우다\u003c/span>\u003c/div>\u003cdiv>\u003cb>factory\u003c/b>\u003cem>명사\u003c/em>\u003cspan>공장\u003c/span>\u003c/div>\u003cdiv>\u003cb>burn\u003c/b>\u003cem>동사\u003c/em>\u003cspan>태우다\u003c/span>\u003c/div>\u003cdiv>\u003cb>fossil fuel\u003c/b>\u003cem>명사\u003c/em>\u003cspan>화석 연료\u003c/span>\u003c/div>\u003cdiv>\u003cb>trap\u003c/b>\u003cem>동사\u003c/em>\u003cspan>가두다\u003c/span>\u003c/div>\u003cdiv>\u003cb>warm up\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>따뜻해지다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"오늘의 단어도 소리 내어 읽어 볼까요? change는 바뀌다라는 뜻이에요. melt는 녹다, cub은 새끼라는 뜻이죠. energy는 에너지, trap은 가두다라는 뜻이랍니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">change\u003c/b>\u003cspan class=\"m\">바뀌다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">become different\u003c/span>\u003cspan class=\"s\">turn\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">stay the same\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">melt\u003c/b>\u003cspan class=\"m\">녹다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">thaw\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">freeze\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">trap\u003c/b>\u003cspan class=\"m\">가두다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">hold\u003c/span>\u003cspan class=\"s\">catch\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">free\u003c/span>\u003cspan class=\"a\">let go\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">warm up\u003c/b>\u003cspan class=\"m\">따뜻해지다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">get warmer\u003c/span>\u003cspan class=\"s\">heat up\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">cool down\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">lose\u003c/b>\u003cspan class=\"m\">잃다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">miss\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">find\u003c/span>\u003cspan class=\"a\">keep\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">break off\u003c/b>\u003cspan class=\"m\">깨져 떨어지다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">snap off\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">join\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"비슷한 말과 반대말도 함께 기억해요. change는 become different와 비슷하고 stay the same과 반대예요. melt는 thaw와 비슷하고 freeze와 반대죠. trap은 hold와 비슷하고 free와 반대랍니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 것들은\u003c/span>\u003cspan class=\"en\">Some things\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">절대 변하지 않아요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">never \u003c/span>\u003cspan class=\"tgt\">change\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">북극에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">Arctic\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">북극에서 어떤 것들은 절대 변하지 않습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 북극에서는 절대 변하지 않는 것이 있다고 말해요. 이 글의 \u003cb class=\"key\">주제\u003c/b>를 여는 \u003cb class=\"key\">도입\u003c/b> 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">더 자세히 알려 주는 말(부사)\u003c/span> : 한다(change) + 절대(never) → 절대 하지 않는다 : \"절대 변하지 않는다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소·시간 짝꿍 말(전치사)\u003c/span> : 전치사(in) + 장소(the Arctic) → 북극 안에서 : \"북극에서\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Some things, 어떤 것들은. never change, 절대 변하지 않아요. in the Arctic, 북극에서. 이 문장 전체를 해석하면, 북극에서 어떤 것들은 절대 변하지 않습니다.","hl":"m"},{"n":13,"text":"이 문장은 북극에서 절대 변하지 않는 것이 있다는 걸 알려 줘요. 글의 주제를 여는 도입 문장이죠.","hl":"mn"},{"n":14,"text":"첫 번째, never는 동사 change를 도와주는 부사예요. 그래서 절대 변하지 않는다는 뜻이 돼요. 두 번째, in the Arctic은 장소를 알려 주는 전치사 짝꿍이에요. 북극 안에서라는 뜻이죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여름에는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">In \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">summer\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">해가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">sun \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">절대 지지 않아요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">never \u003c/span>\u003cspan class=\"tgt\">sets\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여름에는 절대 해가 지지 않아요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 여름에는 해가 \u003cb class=\"key\">지지\u003c/b> 않는다는 북극의 신기한 특징을 말해요. 앞 문장의 '변하지 않는 것'을 알려 주는 \u003cb class=\"key\">예시\u003c/b>예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">장소·시간 짝꿍 말(전치사)\u003c/span> : 전치사(In) + 시간(the summer) → 여름 안에 : \"여름에는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">한 사람·한 개일 때 동사 + s(3인칭 단수)\u003c/span> : 그것(the sun) + 한다(sets) : \"해가 (절대) 지지 않는다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"In the summer, 여름에는. the sun, 해가. never sets, 절대 지지 않아요. 이 문장 전체를 해석하면, 여름에는 절대 해가 지지 않아요.","hl":"m"},{"n":16,"text":"여름에는 해가 지지 않는다는 북극의 신기한 특징을 말해요. 바로 앞 문장에서 말한 변하지 않는 것의 예시죠.","hl":"mn"},{"n":17,"text":"첫 번째, In the summer는 시간을 알려 주는 전치사 짝꿍이에요. 여름에는이라는 뜻이 되죠. 두 번째, the sun은 딱 한 개니까 동사에 s를 붙여서 sets라고 해요. 이걸 3인칭 단수라고 불러요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">겨울에는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">In \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">winter\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">해가\u003c/span>\u003cspan class=\"en\">the sun\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">절대 뜨지 않지요\u003c/span>\u003cspan class=\"en\">never \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">rises\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">겨울에는 절대 해가 뜨지 않지요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 겨울에는 해가 \u003cb class=\"key\">뜨지\u003c/b> 않는다는 또 다른 특징을 말해요. 여름 문장과 짝을 이루는 \u003cb class=\"key\">예시\u003c/b>예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">장소·시간 짝꿍 말(전치사)\u003c/span> : 전치사(In) + 시간(the winter) → 겨울 안에 : \"겨울에는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">한 사람·한 개일 때 동사 + s(3인칭 단수)\u003c/span> : 그것(the sun) + 한다(rises) : \"(해가) 뜬다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"In the winter, 겨울에는. the sun, 해가. never rises, 절대 뜨지 않지요. 이 문장 전체를 해석하면, 겨울에는 절대 해가 뜨지 않지요.","hl":"m"},{"n":19,"text":"겨울에는 해가 뜨지 않는다는 또 다른 특징을 말해요. 여름 문장과 짝을 이루는 예시예요.","hl":"mn"},{"n":20,"text":"첫 번째, In the winter도 시간을 알려 주는 전치사 짝꿍이에요. 겨울에는이라는 뜻이죠. 두 번째, 주어 the sun이 한 개라서 동사에 s를 붙여 rises라고 해요. 바로 3인칭 단수 모양이에요. 여러분, 여름 문장과 겨울 문장을 나란히 소리 내어 읽어 보면 아주 좋아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 15\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 최근에\u003c/span>\u003cspan class=\"en\">But recently,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무엇인가 시작했다\u003c/span>\u003cspan class=\"en\">something \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">started\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바뀌기\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">change\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 최근에, 무엇인가 바뀌기 시작했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서는 절대 변하지 않는 북극 이야기를 했어요. 그런데 이제 \u003cb class=\"key\">변화\u003c/b>가 시작됐다고 알려 주는, 글의 방향이 바뀌는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 무엇이(something) + 시작했다(started) : \"시작했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to + 동사원형(to부정사)\u003c/span> : 시작했다(started) + 무엇을(to change) : \"바뀌기\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"But recently, 하지만 최근에. something started, 무엇인가 시작했다. to change, 바뀌기. 이 문장 전체를 해석하면, 하지만 최근에, 무엇인가 바뀌기 시작했습니다.","hl":"m"},{"n":22,"text":"이 문장은 앞의 이야기가 끝나고 새 이야기가 시작된다는 것을 알려 주는 변화 신호예요. 북극에도 이제 뭔가 달라지기 시작했다는 뜻이죠.","hl":"mn"},{"n":23,"text":"먼저 started를 볼까요. 이것은 start에 -ed를 붙인 과거형이에요. 이미 지난 일이라서 이렇게 말해요. 그리고 뒤에 to change가 와서 무엇을 시작했는지 알려 줘요. 이렇게 동사 뒤에 오는 to와 동사원형을 to부정사라고 불러요. 아주 자주 나오는 모양이니까 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어느 날\u003c/span>\u003cspan class=\"en\">One day,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 ~에 있었다\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">배를 타고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">boat \u003c/span>\u003cspan class=\"tgt\">ride\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아빠와 함께\u003c/span>\u003cspan class=\"en\">with Dad.\u003c/span>\u003c/div>\u003 03cspan class=\"en\">polar bear cubs.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">아빠는 말씀하셨어요. &quot;저것들은 새끼 북극곰들이야.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아빠가 얼음 위의 하얀 공 두 개를 보며 \u003cb class=\"key\">새끼 \u003c/b>\u003cb class=\"key\">북극곰\u003c/b>이라고 알려 주는 문장이에요. \u003cb class=\"key\">아빠의 \u003c/b>\u003cb class=\"key\">말\u003c/b>이 그대로 나와서 이야기가 시작되는 장면이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거형(과거형)\u003c/span> : 아빠(Dad) + 말했다(said) : \"말씀하셨어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be동사(be동사)\u003c/span> : 저것들(Those) + 이다(are) + 새끼 북극곰들(cubs) : \"저것들은 ~이에요\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Dad said, 아빠는 말했어요. \"Those are, 저것들은 ~이에요. polar bear cubs, 새끼 북극곰들이에요. 이 문장 전체를 해석하면, 아빠는 말씀하셨어요. \"저것들은 새끼 북극곰들이야.","hl":"m"},{"n":31,"text":"아빠가 얼음 위의 하얀 공 두 개를 가리키며 새끼 북극곰이라고 알려 주는 문장이에요. 이야기가 본격적으로 시작되는 장면이지요.","hl":"mn"},{"n":32,"text":"먼저 said는 과거형이에요. 이미 지난 일이라 말하다 say를 said로 바꿨어요. 다음으로 Those are는 여러 개를 가리키는 말이에요. 두 마리를 가리키니까 are를 썼답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내 생각에는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">think\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 잃어버렸어요\u003c/span>\u003cspan class=\"en\">they \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">lost\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 어미를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">their\u003c/span> mother.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">내 생각에 그들이 어미를 잃은 것 같구나.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아빠가 새끼 곰들이 \u003cb class=\"key\">어미\u003c/b>를 잃었다고 짐작하는 문장이에요. 왜 새끼들이 혼자 있는지 알려 주는 \u003cb class=\"key\">이유\u003c/b>가 되어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재형(현재형)\u003c/span> : 나는(I) + 생각해요(think) : \"내 생각에는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거형(과거형)\u003c/span> : 그들이(they) + 잃었다(lost) + 어미를(mother) : \"잃었어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">소유격(소유격)\u003c/span> : 그들의(their) + 어미(mother) : \"그들의\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"I think, 내 생각에는. they lost, 그들이 잃어버렸어요. their mother, 그들의 어미를. 이 문장 전체를 해석하면, 내 생각에 그들이 어미를 잃은 것 같구나.","hl":"m"},{"n":34,"text":"아빠가 새끼 곰들이 엄마를 잃은 것 같다고 짐작하는 문장이에요.","hl":"mn"},{"n":35,"text":"먼저 I think는 내 생각을 말하는 표현이에요. 지금 하는 생각이라 현재형 think를 써요. 다음으로 lost는 과거형이에요. 이미 잃어버린 일이라 lose가 lost로 바뀌었지요. 마지막으로 their는 소유격이에요. 누구의 어미인지 알려 줄 때 써요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 얼음이\u003c/span>\u003cspan class=\"en\">The ice\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새끼들 아래에 있던\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">under \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">cubs\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">깨져서 떨어졌어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">broke \u003c/span>\u003cspan class=\"tgt\">off\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 옮겼어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">and\u003c/span> carried\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들을 멀리\u003c/span>\u003cspan class=\"en\">them away.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">새끼들 아래에 있던 얼음이 깨져서 그들을 옮긴 거야.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 새끼들 아래의 얼음이 \u003cb class=\"key\">깨져서\u003c/b> 새끼들을 다른 곳으로 데려갔다는 뜻이에요. 얼음이 왜 위험한지 보여 주는 \u003cb class=\"key\">원인\u003c/b> 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사(전치사)\u003c/span> : 얼음(the ice) + 아래에(under) + 새끼들(the cubs) : \"새끼들 아래에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거형(과거형)\u003c/span> : 얼음이(The ice) + 깨졌다(broke off) : \"깨져서 떨어졌어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">접속사(접속사)\u003c/span> : 깨졌다(broke off) + 그리고(and) + 옮겼다(carried) : \"그리고\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"The ice, 그 얼음이. under the cubs, 새끼들 아래에 있던. broke off, 깨져서 떨어졌어요. and carried, 그리고 옮겼어요. them away, 그들을 멀리. 이 문장 전체를 해석하면, 새끼들 아래에 있던 얼음이 깨져서 그들을 옮긴 거야.","hl":"m"},{"n":37,"text":"새끼 곰들 아래에 있던 얼음이 깨져서 새끼들을 다른 곳으로 데려갔다는 뜻이에요.","hl":"mn"},{"n":38,"text":"첫째, under는 전치사예요. 새끼들 아래라는 장소를 알려 주지요. 둘째, broke off는 과거형이에요. 이미 일어난 일이라 break가 broke로 바뀌었어요. 셋째, and는 이어 주는 말이에요. 깨진 일과 옮겨진 일을 자연스럽게 이어 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 얼음이 녹았어요\u003c/span>\u003cspan class=\"en\">The ice \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">melted\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">너무 빨리.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">too \u003c/span>\u003cspan class=\"tgt\">fast\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">얼음이 너무 빨리 녹아버렸어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 얼음이 아주 빨리 녹았다는 뜻이에요. 앞에서 새끼 북극곰이 얼음과 함께 떠내려간 \u003cb class=\"key\">이유\u003c/b>를 알려 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 녹다(melt) + ed = 녹았다(melted) : \"녹아버렸어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">더 자세히 알려 주는 말(부사)\u003c/span> : 너무(too) + 빨리(fast) : \"너무 빨리\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"The ice melted, 그 얼음이 녹았어요. too fast, 너무 빨리.. 이 문장 전체를 해석하면, 얼음이 너무 빨리 녹아버렸어요.","hl":"m"},{"n":40,"text":"이 문장은 얼음이 아주 빨리 녹았다는 뜻이에요. 그래서 새끼 북극곰이 위험해진 이유를 알려 주죠.","hl":"mn"},{"n":41,"text":"첫째, melted는 melt에 ed를 붙인 과거형이에요. 둘째, too는 fast 앞에서 '너무'라고 알려 주는 부사예요. 아주 짧지만 뜻이 아주 또렷한 문장이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 물었어요,\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">asked\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">&quot;왜 얼음이\u003c/span>\u003cspan class=\"en\">&quot;Why \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">did \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">ice \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">너무 빨리 녹았나요?&quot;\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">melt\u003c/span> too fast?&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 &quot;왜 얼음이 너무 빨리 녹았나요?&quot;라고 물었어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 주인공이 아빠에게 얼음이 빨리 녹은 \u003cb class=\"key\">이유\u003c/b>를 묻는 장면이에요. 다음 문장에서 아빠의 대답이 이어져요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 묻다(ask) + ed = 물었다(asked) : \"물었어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">묻는 말(의문문)\u003c/span> : 왜(Why) + did + 누가(the ice) + 하다(melt) : \"왜 얼음이 녹았나요\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"I asked, 나는 물었어요. \"Why did the ice, \"왜 얼음이. melt too fast?\", 너무 빨리 녹았나요?\". 이 문장 전체를 해석하면, 나는 \"왜 얼음이 너무 빨리 녹았나요?\"라고 물었어요.","hl":"m"},{"n":43,"text":"이 문장은 주인공이 아빠에게 왜 얼음이 빨리 녹았는지 물어보는 장면이에요. 다음 문장에서 아빠의 대답이 나오죠.","hl":"mn"},{"n":44,"text":"첫째, 지난 일을 물어볼 때는 did를 주어 앞에 보내요. 둘째, did가 나오면 동사는 melt처럼 동사원형을 써요. 셋째, asked는 ask에 ed를 붙인 과거형이에요. 이 세 가지만 기억하면 아주 든든해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아빠가 말했어요\u003c/span>\u003cspan class=\"en\">Dad said\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 ~ 때문이에요\u003c/span>\u003cspan class=\"en\">it was \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">because\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 너무 많은 에너지를 썼어요\u003c/span>\u003cspan class=\"en\">we used \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">too \u003c/span>\u003cspan class=\"tgt\">much \u003c/span>\u003cspan class=\"tgt\">energy\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">집을 따뜻하게 하려고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">heat\u003c/span> houses\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 공장을 돌리려고.\u003c/span>\u003cspan class=\"en\">and run factories.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">아빠는 우리가 집에 난방을 하고 공장을 운영하는 데 너무 많은 에너지를 사용했기 때문이라고 말씀하셨어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아빠가 에너지를 많이 쓰면 얼음이 빨리 녹는다고 알려 주세요. 우리의 평범한 생활이 북극에 영향을 준다는 걸 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 그건 ~ 때문이에요 + because + 이유 : \"~ 때문이에요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">양을 나타내는 말(수량 표현)\u003c/span> : too much + 셀 수 없는 것(energy) : \"너무 많은 에너지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to + 동사원형(to부정사)\u003c/span> : to + 하다(heat) = ~하기 위해 : \"따뜻하게 하려고\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"Dad said, 아빠가 말했어요. it was because, 그것은 ~ 때문이에요. we used too much energy, 우리가 너무 많은 에너지를 썼어요. to heat houses, 집을 따뜻하게 하려고. and run factories, 그리고 공장을 돌리려고.. 이 문장 전체를 해석하면, 아빠는 우리가 집에 난방을 하고 공장을 운영하는 데 너무 많은 에너지를 사용했기 때문이라고 말씀하셨어요.","hl":"m"},{"n":46,"text":"이 문장은 아빠가 얼음이 빨리 녹은 이유를 설명해 주는 부분이에요. 우리가 에너지를 많이 쓰는 생활이 북극을 바꾸고 있다는 뜻이죠.","hl":"mn"},{"n":47,"text":"첫째, because는 이유를 이어 주는 접속사예요. 둘째, too much는 셀 수 없는 것 앞에 붙여 '너무 많은'이라고 해요. 셋째, to heat처럼 to에 동사를 붙이면 '~하기 위해'라는 뜻이 돼요. 오늘 배운 세 가지를 꼭 소리 내어 따라 해 봐요. 잘하고 있어요!","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 화석 연료를 태워요\u003c/span>\u003cspan class=\"en\">We \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">burn\u003c/span> fossil fuels\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">에너지를 얻기 위해서요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">get\u003c/span> energy,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 그것은 가스를 만들어요\u003c/span>\u003cspan class=\"en\">but it \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">makes\u003c/span> gas.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 에너지를 얻기 위해 화석 연료를 태우지만, 그것은 가스를 만들어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 우리가 에너지를 얻으려고 \u003cb class=\"key\">화석 \u003c/b>\u003cb class=\"key\">연료\u003c/b>를 태우면 \u003cb class=\"key\">가스\u003c/b>가 생긴다는 뜻이에요. 아빠가 얼음이 빨리 녹은 까닭을 설명하는 부분이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재형(현재시제)\u003c/span> : 누가(We) + 한다(burn) + 무엇을(fossil fuels) : \"태워요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to + 동사원형(to부정사)\u003c/span> : ~하기 위해(to get) + 무엇을(energy) : \"얻기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">한 사람·한 개일 때 동사 + s(3인칭 단수)\u003c/span> : 그것은(it) + 만든다(makes) + 무엇을(gas) : \"만들어요\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"We burn fossil fuels, 우리는 화석 연료를 태워요. to get energy, 에너지를 얻기 위해서요. but it makes gas, 하지만 그것은 가스를 만들어요. 이 문장 전체를 해석하면, 우리는 에너지를 얻기 위해 화석 연료를 태우지만, 그것은 가스를 만들어요.","hl":"m"},{"n":49,"text":"이 문장은 우리가 에너지를 얻으려고 화석 연료를 태운다고 말해요. 그런데 그때 가스가 생긴다는 것도 알려 줘요.","hl":"mn"},{"n":50,"text":"첫째, burn은 현재형이에요. We처럼 여러 사람이 주어일 때는 동사원형 burn을 그대로 써요. 둘째, to get은 to부정사로 에너지를 얻기 위해라는 목적을 나타내요. 셋째, 주어 it은 한 개라서 makes처럼 동사 뒤에 s를 붙이는 3인칭 단수 형태를 써요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 가스는 텐트를 만들어요\u003c/span>\u003cspan class=\"en\">That gas \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">forms\u003c/span> a tent\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지구 주변에,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">around\u003c/span> the earth,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 이 텐트는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">and\u003c/span> this tent\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여분의 열을 가둬요\u003c/span>\u003cspan class=\"en\">traps extra heat.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 가스는 지구 주변에 텐트를 만들고, 이 텐트는 여분의 열을 가두게 됩니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> \u003cb class=\"key\">가스\u003c/b>가 지구를 둘러싼 \u003cb class=\"key\">텐트\u003c/b>처럼 되고, 그 텐트가 \u003cb class=\"key\">열\u003c/b>을 가둔다는 말이에요. 그래서 지구가 더워지는 원리를 쉽게 알려 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">한 사람·한 개일 때 동사 + s(3인칭 단수)\u003c/span> : 그 가스는(That gas) + 만든다(forms) + 무엇을(a tent) : \"만들어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소 짝꿍 말(전치사)\u003c/span> : 주변에(around) + 무엇의(the earth) : \"지구 주변에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 앞 문장 + and + 뒤 문장 : \"그리고\"\u003c/div>\u003c/div>","segs":[{"n":51,"text":"That gas forms a tent, 그 가스는 텐트를 만들어요. around the earth, 지구 주변에. and this tent, 그리고 이 텐트는. traps extra heat, 여분의 열을 가둬요. 이 문장 전체를 해석하면, 그 가스는 지구 주변에 텐트를 만들고, 이 텐트는 여분의 열을 가두게 됩니다.","hl":"m"},{"n":52,"text":"이 문장은 가스가 지구를 둘러싼 텐트처럼 되고, 그 텐트가 열을 가둔다는 뜻이에요. 그래서 지구가 더워지는 원리를 알려 주는 거예요.","hl":"mn"},{"n":53,"text":"첫째, forms는 주어 That gas가 하나라서 동사 form 뒤에 s를 붙인 3인칭 단수 형태예요. 둘째, around는 전치사로 지구 주변이라는 장소를 알려 줘요. 셋째, and는 접속사로 앞뒤 두 사실을 이어 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 15 / 15\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 만들게 해요\u003c/span>\u003cspan class=\"en\">It \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">makes\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">북극이 따뜻해지도록\u003c/span>\u003cspan class=\"en\">the Arctic warm up\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매년 더 많이요\u003c/span>\u003cspan class=\"en\">more every year.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 북극이 매년 더 따뜻해지도록 만들어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 가스가 만든 \u003cb class=\"key\">텐트\u003c/b> 때문에 \u003cb class=\"key\">북극\u003c/b>이 해마다 더 따뜻해진다는 뜻이에요. 아빠 설명의 결론을 알려 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">한 사람·한 개일 때 동사 + s(3인칭 단수)\u003c/span> : 그것은(It) + 만든다(makes) + 무엇을(the Arctic warm up) : \"만들어요\"\u003c/div>\u003c/div>","segs":[{"n":54,"text":"It makes, 그것은 만들게 해요. the Arctic warm up, 북극이 따뜻해지도록. more every year, 매년 더 많이요. 이 문장 전체를 해석하면, 그것은 북극이 매년 더 따뜻해지도록 만들어요.","hl":"m"},{"n":55,"text":"이 문장은 가스가 만든 텐트 때문에 북극이 해마다 더 따뜻해진다는 뜻이에요. 아빠 설명의 결론을 알려 주는 문장이에요.","hl":"mn"},{"n":56,"text":"먼저, 여기서 It은 앞에 나온 가스 텐트를 가리켜요. 주어 It이 하나라서 makes처럼 동사 뒤에 s를 붙이는 3인칭 단수 형태를 써요. warm up은 따뜻해지다라는 뜻으로 함께 외워 두면 좋아요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">오늘 배운 내용 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>북극은 여름에 해가 \u003cb class=\"key\">지지 \u003c/b>\u003cb class=\"key\">않고\u003c/b> 겨울에 해가 뜨지 않는 곳이에요.\u003c/li>\u003cli>얼음판 위 하얀 공 두 개는 \u003cb class=\"key\">새끼 \u003c/b>\u003cb class=\"key\">북극곰\u003c/b>이었어요.\u003c/li>\u003cli>얼음이 깨져 새끼들이 떠내려간 까닭은 얼음이 \u003cb class=\"key\">너무 \u003c/b>\u003cb class=\"key\">빨리 \u003c/b>\u003cb class=\"key\">녹았\u003c/b>기 때문이에요.\u003c/li>\u003cli>우리가 에너지를 많이 쓰면 \u003cb class=\"key\">가스\u003c/b>가 지구의 열을 가둬 북극이 더 따뜻해져요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The Arctic is getting warmer because we use too much energy, so the ice melts fast and polar bear cubs lose their home.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">북극은 여름에는 해가 지지 않고 겨울에는 해가 뜨지 않는 곳이에요. 그런데 우리가 \u003cb class=\"key\">에너지\u003c/b>를 너무 많이 써서 얼음이 빨리 녹았고, 그 일로 \u003cb class=\"key\">새끼 \u003c/b>\u003cb class=\"key\">북극곰\u003c/b>들이 떠내려가게 되었어요.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":57,"text":"오늘 우리는 북극의 얼음이 왜 빨리 녹는지 배웠어요. 우리가 쓰는 에너지가 북극곰의 집을 위험하게 만든다는 것도 알았죠. 여러분은 오늘 정말 잘 따라왔어요! 작은 실천 하나가 북극을 지킬 수 있다는 걸 기억하며 오늘도 멋진 하루 보내요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
