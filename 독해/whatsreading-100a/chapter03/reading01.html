</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"왓츠 리딩 100A Ch.3 Unit 01 Fuels around Us","audioDir":"reading01_audio","preview":false,"count":51,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.520em\">Ch.3 Unit\u003cbr>01 Fuels\u003cbr>around Us\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">왓츠 리딩 100A\u003c/div>\u003ch1>Fuels Around Us: Coal, Oil, and Natural Gas\u003c/h1>\u003ch2>우리 주변의 연료: 석탄, 석유, 천연가스\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">한 줄 요약\u003c/span>\u003cspan>석탄, 석유, 천연가스는 모두 \u003cb class=\"key\">화석 \u003c/b>\u003cb class=\"key\">연료\u003c/b>예요. 우리는 아주 오래전부터 이 \u003cb class=\"key\">화석 \u003c/b>\u003cb class=\"key\">연료\u003c/b>를 사용해 왔고, 숫자로 보면 그 쓰임이 정말 놀라워요.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Coal, oil, and natural gas are fossil fuels, and we use them in many surprising ways.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘도 만나서 정말 반가워요. 오늘 읽을 글은 Fuels around Us, 우리 주변의 연료라는 글이에요. 석탄과 석유, 그리고 천연가스에 관한 아주 재미있는 숫자 이야기가 가득해요. 한 줄로 말하면, 화석 연료가 우리 생활에서 얼마나 많이 쓰이는지 숫자로 보여 주는 글이에요. 자, 함께 시작해 볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">미리 알면 쉬워요\u003c/span>\u003cdiv class=\"lp-box\">화석 연료(fossil fuel)는 아주 오래전에 살던 식물과 동물이 땅속에서 오랜 시간 동안 변해서 생긴 것이에요. 석탄(coal)은 검은 돌처럼 딱딱하고, 석유(oil)는 땅속에서 뽑아내는 걸쭉한 액체예요. 천연가스(natural gas)는 눈에 보이지 않는 기체라서 파이프로 보내요. 우리가 쓰는 전기와 자동차 연료가 모두 \u003cb class=\"key\">화석 \u003c/b>\u003cb class=\"key\">연료\u003c/b>에서 나온다고 생각해 보세요. 냉장고 안의 우유가 차갑게 유지되는 것도 사실은 아주 오래된 \u003cb class=\"key\">에너지\u003c/b> 덕분인 셈이에요.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 조금 알아 볼게요. 화석 연료는 아주 오래전에 살던 식물과 동물이 땅속에서 오랜 시간 동안 변해서 생긴 것이에요. 석탄은 검은 돌처럼 딱딱하고, 석유는 땅속에서 뽑아내는 걸쭉한 액체이고, 천연가스는 눈에 보이지 않는 기체예요. 여러분, 생각해 보세요. 우리가 쓰는 전기와 자동차 연료가 모두 이 화석 연료에서 나온다면 어떨까요? 냉장고 안의 우유가 차갑게 유지되는 것도 사실은 아주 오래된 에너지 덕분이에요. 신기하죠?","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>화석 연료란?\u003csmall>소개 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>석탄, 석유, 천연가스는 모두 \u003cb class=\"key\">화석 \u003c/b>\u003cb class=\"key\">연료\u003c/b>라고 불러요. 가장 오래된 것은 4억 년이 될 수도 있다고 해요. 이제 화석 연료에 관한 \u003cb class=\"key\">흥미로운 \u003c/b>\u003cb class=\"key\">숫자\u003c/b>들을 하나씩 알아본다고 말하고 있어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>석탄 이야기\u003csmall>예시 · 문장 4–7\u003c/small>\u003c/h4>\u003cp>인간은 2,000년 전부터 석탄을 사용하기 시작했어요. 세계 전기의 약 \u003cb class=\"key\">40퍼센트\u003c/b>가 석탄에서 나와요. 우리 집 냉장고 하나가 1년 동안 작동하려면 \u003cb class=\"key\">300kg\u003c/b>의 석탄이 필요하대요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>석유 이야기\u003csmall>이유 · 문장 8–10\u003c/small>\u003c/h4>\u003cp>우리는 땅속에 깊은 구멍을 만들어서 석유를 얻어요. 석유의 약 \u003cb class=\"key\">85퍼센트\u003c/b>는 엔진을 움직이는 연료가 돼요. 매년 수백만 대의 새 차를 만들기 때문에 \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">많은 \u003c/b>\u003cb class=\"key\">석유\u003c/b>가 계속 필요해요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>천연가스 이야기\u003csmall>마무리 · 문장 11–13\u003c/small>\u003c/h4>\u003cp>약 2,000년 전에 사람들은 대나무 파이프로 천연가스를 찾았어요. 지금도 파이프로 천연가스를 얻지만 아주 \u003cb class=\"key\">멀리 \u003c/b>\u003cb class=\"key\">떨어진 \u003c/b>\u003cb class=\"key\">곳\u003c/b>에서 가져와요. 바다 아래 가스 파이프는 길이가 약 \u003cb class=\"key\">1,200km\u003c/b>나 될 수 있답니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 화석 연료를 소개한 뒤에 석탄, 석유, 천연가스 순서로 하나씩 설명해요.","hl":null},{"n":4,"text":"첫 단계는 화석 연료가 무엇인지 알려 주는 부분이에요. 석탄, 석유, 천연가스는 모두 화석 연료라고 불러요. 가장 오래된 것은 사억 년이 될 수도 있다고 해요. 이제 화석 연료에 관한 흥미로운 숫자들을 하나씩 알아보자고 말하고 있답니다.","hl":"f0"},{"n":5,"text":"두 번째 단계는 석탄 이야기예요. 인간은 이천 년 전부터 석탄을 사용하기 시작했어요. 세계 전기의 약 사십 퍼센트가 석탄에서 나오고, 우리 집 냉장고 하나가 일 년 동안 작동하려면 삼백 킬로그램의 석탄이 필요하대요. 생각보다 어마어마하죠?","hl":"f1"},{"n":6,"text":"세 번째 단계는 석유 이야기예요. 우리는 땅속에 깊은 구멍을 만들어서 석유를 얻어요. 석유의 약 팔십오 퍼센트는 엔진을 움직이는 연료가 되고, 매년 수백만 대의 새 차를 만들기 때문에 더 많은 석유가 계속 필요해요.","hl":"f2"},{"n":7,"text":"네 번째 단계는 천연가스 이야기예요. 약 이천 년 전에 사람들은 대나무로 파이프를 만들어 천연가스를 찾았어요. 지금도 우리는 파이프로 천연가스를 얻지만 아주 멀리 떨어진 곳에서 가져와요. 바다 아래에 있는 가스 파이프는 길이가 약 천이백 킬로미터나 될 수 있답니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">설명하기\u003c/span>\u003cspan class=\"lp-pill\">처음\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 석탄, 석유, 천연가스가 \u003cb class=\"key\">화석 \u003c/b>\u003cb class=\"key\">연료\u003c/b>라고 중심 생각을 먼저 말해요. 그다음 석탄, 석유, 천연가스 순서로 하나씩 \u003cb class=\"key\">숫자\u003c/b>를 들어 설명해요. 그래서 처음에 중심 생각을 밝히고 예를 들어 설명하는 글이에요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Here are (3)\u003c/b>\u003cspan>앞으로 설명할 내용을 알려 줌\u003c/span>\u003cb>How much (6)\u003c/b>\u003cspan>질문을 던져 흥미를 끎\u003c/span>\u003cb>because (10)\u003c/b>\u003cspan>이유를 알려 줌\u003c/span>\u003cb>but (12)\u003c/b>\u003cspan>반대되는 내용을 이어 줌\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">fossil fuels\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the oldest ones\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">fuels\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">natural gas\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">gas\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 설명하는 글이에요. 중심 문장은 바로 첫 번째 문장인 처음에 나와요. 석탄, 석유, 천연가스가 화석 연료라는 중심 생각을 먼저 말하고, 그다음에 예를 들어 차례대로 설명하죠.","hl":"ty"},{"n":9,"text":"글의 길잡이 말도 눈여겨보세요. Here are는 앞으로 설명할 내용을 알려 주고, How much는 질문을 던져 흥미를 끌어요. because는 이유를, but은 반대되는 내용을 이어 줘요. 같은 대상을 다르게 부르는 말도 있어요. fossil fuels를 the oldest ones라고 다시 말하고, natural gas는 gas라고 줄여서 말해요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 단어\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>fossil fuel\u003c/b>\u003cem>명사\u003c/em>\u003cspan>화석 연료\u003c/span>\u003c/div>\u003cdiv>\u003cb>coal\u003c/b>\u003cem>명사\u003c/em>\u003cspan>석탄\u003c/span>\u003c/div>\u003cdiv>\u003cb>natural gas\u003c/b>\u003cem>명사\u003c/em>\u003cspan>천연가스\u003c/span>\u003c/div>\u003cdiv>\u003cb>million\u003c/b>\u003cem>명사\u003c/em>\u003cspan>백만\u003c/span>\u003c/div>\u003cdiv>\u003cb>interesting\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>흥미로운\u003c/span>\u003c/div>\u003cdiv>\u003cb>human\u003c/b>\u003cem>명사\u003c/em>\u003cspan>인간, 사람\u003c/span>\u003c/div>\u003cdiv>\u003cb>percent\u003c/b>\u003cem>명사\u003c/em>\u003cspan>퍼센트\u003c/span>\u003c/div>\u003cdiv>\u003cb>electricity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>전기\u003c/span>\u003c/div>\u003cdiv>\u003cb>refrigerator\u003c/b>\u003cem>명사\u003c/em>\u003cspan>냉장고\u003c/span>\u003c/div>\u003cdiv>\u003cb>deep\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>깊은\u003c/span>\u003c/div>\u003cdiv>\u003cb>hole\u003c/b>\u003cem>명사\u003c/em>\u003cspan>구멍\u003c/span>\u003c/div>\u003cdiv>\u003cb>earth\u003c/b>\u003cem>명사\u003c/em>\u003cspan>땅, 지구\u003c/span>\u003c/div>\u003cdiv>\u003cb>turn into\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 변하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>engine\u003c/b>\u003cem>명사\u003c/em>\u003cspan>엔진, 발동기\u003c/span>\u003c/div>\u003cdiv>\u003cb>pipe\u003c/b>\u003cem>명사\u003c/em>\u003cspan>파이프, 관\u003c/span>\u003c/div>\u003cdiv>\u003cb>bamboo\u003c/b>\u003cem>명사\u003c/em>\u003cspan>대나무\u003c/span>\u003c/div>\u003cdiv>\u003cb>far away\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>멀리 떨어진\u003c/span>\u003c/div>\u003cdiv>\u003cb>under the sea\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>바다 아래에\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"오늘의 단어를 소리 내어 읽어 볼게요. fossil fuel은 화석 연료, coal은 석탄, natural gas는 천연가스예요. electricity는 전기, refrigerator는 냉장고, pipe는 파이프라는 뜻이에요. 그리고 turn into는 무엇이 다른 것으로 변한다는 뜻이에요. 큰 소리로 세 번씩 따라 읽어 보세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">old\u003c/b>\u003cspan class=\"m\">오래된\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">ancient\u003c/span>\u003cspan class=\"s\">aged\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">new\u003c/span>\u003cspan class=\"a\">young\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">start\u003c/b>\u003cspan class=\"m\">시작하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">begin\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">finish\u003c/span>\u003cspan class=\"a\">stop\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">get\u003c/b>\u003cspan class=\"m\">얻다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">receive\u003c/span>\u003cspan class=\"s\">take\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">give\u003c/span>\u003cspan class=\"a\">lose\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">interesting\u003c/b>\u003cspan class=\"m\">흥미로운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">fun\u003c/span>\u003cspan class=\"s\">exciting\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">boring\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">far away\u003c/b>\u003cspan class=\"m\">멀리 떨어진\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">distant\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">near\u003c/span>\u003cspan class=\"a\">close\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"비슷한 말과 반대말도 정리해 볼게요. old는 오래된이라는 뜻이고, 비슷한 말로 ancient가 있어요. start는 시작하다, 비슷한 말은 begin, 반대말은 finish예요. get은 얻다, 반대말은 give나 lose예요. interesting은 흥미로운, 반대말은 boring이에요. far away는 멀리 떨어진, 반대말은 near나 close랍니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 13\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">석탄, 석유, 그리고 천연가스\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Coal, \u003c/span>\u003cspan class=\"tgt\">oil, \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">natural \u003c/span>\u003cspan class=\"tgt\">gas\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">화석 연료입니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are\u003c/span> fossil fuels.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">석탄, 석유, 그리고 천연가스는 화석 연료입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 \u003cb class=\"key\">화석 \u003c/b>\u003cb class=\"key\">연료\u003c/b>가 무엇인지 알려 주는 첫 문장이에요. \u003cb class=\"key\">석탄\u003c/b>, \u003cb class=\"key\">석유\u003c/b>, 천연가스 세 가지를 한꺼번에 소개하고 있죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : A(Coal), B(oil), and C(natural gas) : \"석탄, 석유, 그리고 천연가스\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be동사(be동사)\u003c/span> : 여러 개(Coal, oil, and natural gas) + are + 무엇입니다(fossil fuels) : \"~입니다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Coal, oil, and natural gas, 석탄, 석유, 그리고 천연가스. are fossil fuels, 화석 연료입니다. 이 문장 전체를 해석하면, 석탄, 석유, 그리고 천연가스는 화석 연료입니다.","hl":"m"},{"n":13,"text":"이 문장은 화석 연료가 무엇인지 알려 주는 첫 문장이에요. 석탄, 석유, 천연가스 이렇게 세 친구를 한꺼번에 소개하고 있죠.","hl":"mn"},{"n":14,"text":"먼저 and를 볼까요? 여러 가지를 나란히 늘어놓을 때는 마지막 앞에 and를 붙여요. Coal, oil, and natural gas처럼요. 다음은 are예요. be동사는 앞에 있는 것이 여러 개면 are를 써요. 여기는 연료가 세 가지니까 are, 아주 잘 골랐죠?","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가장 오래된 것들\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">The \u003c/span>\u003cspan class=\"tgt\">oldest \u003c/span>\u003cspan class=\"tgt\">ones\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~일 수도 있어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">be\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">4억 년이 되었을\u003c/span>\u003cspan class=\"en\">400 million years old.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">가장 오래된 것은 4억 년이 되었을 수도 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 화석 연료가 아주아주 오래되었다는 걸 알려 주는 문장이에요. \u003cb class=\"key\">4억 \u003c/b>\u003cb class=\"key\">년\u003c/b>이라는 큰 숫자로 얼마나 오래된지 보여 주죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가장 ~한(최상급)\u003c/span> : the + 가장 오래된(oldest) + 것들(ones) : \"가장 오래된 것들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">도와주는 동사(조동사)\u003c/span> : ~일 수 있어요(can be) + 4억 년(400 million years old) : \"~일 수도 있어요\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"The oldest ones, 가장 오래된 것들. can be, ~일 수도 있어요. 400 million years old, 4억 년이 되었을. 이 문장 전체를 해석하면, 가장 오래된 것은 4억 년이 되었을 수도 있어요.","hl":"m"},{"n":16,"text":"화석 연료가 아주아주 오래되었다는 걸 알려 주는 문장이에요. 4억 년이라는 큰 숫자로 얼마나 오래되었는지 보여 주고 있죠.","hl":"mn"},{"n":17,"text":"첫 번째, The oldest ones는 가장 오래된 것들이라는 뜻이에요. old를 oldest로 바꾸면 가장 오래된이 되죠. 두 번째, can은 도와주는 동사예요. can be는 ~일 수도 있어요라는 뜻으로, 꼭 그렇지는 않지만 그럴 수도 있다고 말할 때 써요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여기 있습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Here \u003c/span>\u003cspan class=\"tgt\">are\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몇 가지 다른 흥미로운 숫자들\u003c/span>\u003cspan class=\"en\">some other interesting numbers\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">화석 연료에 관한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">about \u003c/span>\u003cspan class=\"tgt\">fossil \u003c/span>\u003cspan class=\"tgt\">fuels\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여기 화석 연료에 관한 몇 개의 다른 흥미로운 숫자들이 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 숫자를 하나하나 알려 주기 전에, 이제부터 \u003cb class=\"key\">화석 \u003c/b>\u003cb class=\"key\">연료\u003c/b>에 관한 재미있는 \u003cb class=\"key\">숫자들\u003c/b>을 보여 준다고 말하는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">여기 ~이 있어요(There is/are)\u003c/span> : Here are + 여러 개(some other interesting numbers) : \"여기 ~이 있습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">~에 관한(전치사)\u003c/span> : 숫자들(numbers) + about + 화석 연료(fossil fuels) : \"화석 연료에 관한\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Here are, 여기 있습니다. some other interesting numbers, 몇 가지 다른 흥미로운 숫자들. about fossil fuels, 화석 연료에 관한. 이 문장 전체를 해석하면, 여기 화석 연료에 관한 몇 개의 다른 흥미로운 숫자들이 있습니다.","hl":"m"},{"n":19,"text":"이제부터 화석 연료에 관한 재미있는 숫자들을 알려 줄 거라고 미리 말해 주는 문장이에요. 다음 문장부터 숫자가 하나씩 나오겠죠?","hl":"mn"},{"n":20,"text":"첫 번째, Here are는 여기 있어요라고 알려 줄 때 쓰는 표현이에요. 뒤에 오는 게 여러 개라서 are를 써요. 두 번째, about은 화석 연료에 관한처럼 두 낱말을 이어 주는 짝꿍 말이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인간은 시작했어요\u003c/span>\u003cspan class=\"en\">Humans \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">started \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">석탄을 쓰기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">using \u003c/span>\u003cspan class=\"tgt\">coal\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">2,000년 전에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">2,000 \u003c/span>\u003cspan class=\"tgt\">years \u003c/span>\u003cspan class=\"tgt\">ago\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">인간은 2,000년 전에 석탄을 사용하기 시작했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 인간이 석탄을 쓰기 시작한 때가 \u003cb class=\"key\">2,000년 \u003c/b>\u003cb class=\"key\">전\u003c/b>이라는 걸 알려 줘요. 석탄 이야기에서 \u003cb class=\"key\">시간\u003c/b>을 먼저 짚어 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사-ing가 이름 말처럼 쓰임(동명사)\u003c/span> : 누가(Humans) + 시작했다(started) + 무엇을 하기를(using coal) : \"석탄을 쓰기를 시작했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 숫자 + years ago = 몇 년 전에 : \"2,000년 전에\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Humans started, 인간은 시작했어요. using coal, 석탄을 쓰기를. 2,000 years ago, 2,000년 전에. 이 문장 전체를 해석하면, 인간은 2,000년 전에 석탄을 사용하기 시작했습니다.","hl":"m"},{"n":22,"text":"이 문장은 인간이 석탄을 쓰기 시작한 때가 이천 년 전이라는 걸 알려 줘요. 석탄 이야기에서 시간을 먼저 짚어 주는 문장이죠.","hl":"mn"},{"n":23,"text":"첫 번째, started 뒤에 using이 왔어요. 이렇게 하면 시작하다 뒤에 '하기를'이 붙어요. 두 번째, ago는 '전에'라는 뜻이라서 지난 일을 말할 때 쓰고, 동사도 과거형 started를 써요. 여러분도 'two days ago'처럼 말해 볼 수 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">약 40퍼센트는\u003c/span>\u003cspan class=\"en\">About 40 percent\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세계의 전기의\u003c/span>\u003cspan class=\"en\">of the world's electricity\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">석탄에서 나옵니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">comes \u003c/span>\u003cspan class=\"tgt\">from\u003c/span> coal.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">세계 전기의 약 40퍼센트가 석탄에서 나옵니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 세계 전기의 약 \u003cb class=\"key\">40퍼센트\u003c/b>가 석탄에서 나온다는 걸 알려 줘요. 석탄이 우리 생활에 얼마나 큰지 \u003cb class=\"key\">숫자\u003c/b>로 보여 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">한 개일 때 동사 + s(3인칭 단수)\u003c/span> : 무엇이(It) + 온다(comes) + 어디서(from ~) : \"나옵니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">~에서 와요(전치사)\u003c/span> : A comes from B = A는 B에서 와요 : \"~에서 나옵니다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"About 40 percent, 약 40퍼센트는. of the world's electricity, 세계의 전기의. comes from coal, 석탄에서 나옵니다. 이 문장 전체를 해석하면, 세계 전기의 약 40퍼센트가 석탄에서 나옵니다.","hl":"m"},{"n":25,"text":"이 문장은 세계 전기의 약 사십 퍼센트가 석탄에서 나온다고 알려 줘요. 석탄이 우리 생활에서 얼마나 큰지 숫자로 보여 주는 문장이죠.","hl":"mn"},{"n":26,"text":"첫 번째, 주어가 전기 하나니까 동사에 s를 붙여서 comes라고 해요. 두 번째, from은 '에서'라는 뜻으로 어디서 왔는지 알려 줘요. 그래서 석탄에서 온다는 말이 바로 comes from coal이에요. 이 문장은 통째로 외워 두면 정말 좋아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">얼마나 많은 석탄을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">How \u003c/span>\u003cspan class=\"tgt\">much \u003c/span>\u003cspan class=\"tgt\">coal\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 사용하나요?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">use\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 석탄을 얼마나 많이 사용할까요?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 석탄을 얼마나 많이 쓰는지 \u003cb class=\"key\">질문\u003c/b>하는 문장이에요. 다음 문장부터 \u003cb class=\"key\">예시\u003c/b>로 답을 알려 줄 준비를 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">얼마나 많이(수량 표현)\u003c/span> : How much + 셀 수 없는 것(coal) = 얼마나 많은 석탄 : \"얼마나 많은 석탄\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">의문문 만들기(do/does)\u003c/span> : do + 누가(we) + 하다(use)? = 우리는 ~하나요? : \"우리는 사용하나요\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"How much coal, 얼마나 많은 석탄을. do we use?, 우리는 사용하나요?. 이 문장 전체를 해석하면, 우리는 석탄을 얼마나 많이 사용할까요?","hl":"m"},{"n":28,"text":"이 문장은 석탄을 얼마나 많이 쓰는지 질문하고 있어요. 그래서 다음 문장부터 예시로 답을 알려 줘요.","hl":"mn"},{"n":29,"text":"첫 번째, 셀 수 없는 것의 양을 물을 때는 how much를 써요. 석탄은 하나, 둘 하고 셀 수 없죠. 두 번째, 질문을 만들 때는 do를 주어 앞으로 보내요. 그래서 do we use가 돼요. 아주 잘 따라오고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분의 냉장고는\u003c/span>\u003cspan class=\"en\">Your refrigerator\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">300kg의 석탄을 필요로 합니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">needs\u003c/span> 300 kg of coal\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">작동하기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">work\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1년 동안\u003c/span>\u003cspan class=\"en\">for one year.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여러분의 냉장고는 1년 동안 작동하기 위해 300kg의 석탄을 필요로 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 냉장고를 1년 동안 쓰려면 \u003cb class=\"key\">석탄\u003c/b>이 300kg이나 필요하다는 뜻이에요. 숫자를 통해 석탄을 많이 쓴다는 것을 알려 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">한 사람·한 개일 때 동사 + s(3인칭 단수)\u003c/span> : 냉장고(Your refrigerator) + 필요로 해요(needs) + 석탄을(coal) : \"필요로 합니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to + 동사원형(to부정사)\u003c/span> : to + 한다(work) = ~하기 위해 : \"작동하기 위해\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Your refrigerator, 여러분의 냉장고는. needs 300 kg of coal, 300kg의 석탄을 필요로 합니다. to work, 작동하기 위해. for one year, 1년 동안. 이 문장 전체를 해석하면, 여러분의 냉장고는 1년 동안 작동하기 위해 300kg의 석탄을 필요로 합니다.","hl":"m"},{"n":31,"text":"이 문장은 냉장고를 일 년 동안 쓰려면 석탄이 삼백 킬로그램이나 필요하다는 뜻이에요. 숫자를 통해 석탄을 많이 쓴다는 걸 알 수 있죠.","hl":"mn"},{"n":32,"text":"먼저 Your refrigerator는 한 개이므로 현재형에서 동사에 s를 붙여 needs가 돼요. 두 번째로 to work는 to에 동사원형을 붙여 목적을 나타내는 to부정사예요. 작동하기 위해라는 뜻으로 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 석유를 얻어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">We \u003c/span>\u003cspan class=\"tgt\">get \u003c/span>\u003cspan class=\"tgt\">oil\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">깊은 구멍을 만들어서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">making\u003c/span> a deep hole\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">땅 속에\u003c/span>\u003cspan class=\"en\">into the earth.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 땅 속에 깊은 구멍을 만들어서 석유를 얻습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 우리가 땅속에 깊은 구멍을 만들어서 \u003cb class=\"key\">석유\u003c/b>를 얻는다는 뜻이에요. 석유가 땅속에서 나온다는 것을 알려 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">무엇을(목적어)\u003c/span> : 우리는(We) + 얻어요(get) + 석유를(oil) : \"우리는 석유를 얻어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동사-ing 이름 말(동명사)\u003c/span> : by + 만든다(making) = 만들어서 : \"만들어서\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"We get oil, 우리는 석유를 얻어요. by making a deep hole, 깊은 구멍을 만들어서. into the earth, 땅 속에. 이 문장 전체를 해석하면, 우리는 땅 속에 깊은 구멍을 만들어서 석유를 얻습니다.","hl":"m"},{"n":34,"text":"이 문장은 우리가 땅속에 깊은 구멍을 뚫어서 석유를 얻는다는 뜻이에요. 석유가 땅속에서 나온다는 걸 알려 주죠.","hl":"mn"},{"n":35,"text":"먼저 We get oil은 우리가 석유를 얻어요라는 뜻으로, get 뒤에 oil이 목적어로 와요. 두 번째로 by making은 by 뒤에 동명사를 써서 방법을 나타내요. 깊은 구멍을 만들어서라는 뜻이죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">약 85퍼센트가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">About \u003c/span>\u003cspan class=\"tgt\">85 \u003c/span>\u003cspan class=\"tgt\">percent \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">석유의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">oil\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바뀝니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan 1 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">약 2,000년 전에\u003c/span>\u003cspan class=\"en\">Around 2,000 years ago,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들은 파이프를 만들었어요\u003c/span>\u003cspan class=\"en\">people \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">made\u003c/span> pipes\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대나무로\u003c/span>\u003cspan class=\"en\">from bamboo\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그것들을 사용했어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">used \u003c/span>\u003cspan class=\"tgt\">them\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">천연가스를 찾는 데\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">find\u003c/span> natural gas.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">약 2,000년 전에, 사람들은 대나무로 파이프를 만들었고 천연가스를 찾는데 그것들을 사용했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사람들이 천연가스를 어떻게 찾았는지 알려 주는 문장이에요. 아주 \u003cb class=\"key\">오래전\u003c/b>에 대나무 파이프를 만들어 썼다는 것을 말해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 오늘 make(만들어요) → 지난 일 made(만들었어요) : \"만들었어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 동작 하나(made) + and + 동작 둘(used) : \"그리고 그것들을 사용했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to + 동사원형(to부정사)\u003c/span> : to + 동사원형 → ~하려고, ~하는 데 : \"찾는 데, 찾으려고\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"Around 2,000 years ago, 약 2,000년 전에. people made pipes, 사람들은 파이프를 만들었어요. from bamboo, 대나무로. and used them, 그리고 그것들을 사용했어요. to find natural gas, 천연가스를 찾는 데. 이 문장 전체를 해석하면, 약 2,000년 전에, 사람들은 대나무로 파이프를 만들었고 천연가스를 찾는데 그것들을 사용했습니다.","hl":"m"},{"n":43,"text":"이 문장은 옛날 사람들이 천연가스를 어떻게 찾았는지 알려 줘요. 대나무로 파이프를 만들어서 썼다고 하네요.","hl":"mn"},{"n":44,"text":"첫 번째로 made를 볼게요. 이건 make의 과거형이에요. 이천 년 전 일이라서 과거형을 쓴 거죠. 두 번째로 and는 made와 used, 두 동작을 이어 줘요. 세 번째로 to find는 찾으려고라는 목적을 담고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 여전히 얻어요\u003c/span>\u003cspan class=\"en\">We still get\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">천연가스를\u003c/span>\u003cspan class=\"en\">natural gas\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">파이프를 통해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">through \u003c/span>\u003cspan class=\"tgt\">pipes\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 장소에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">but\u003c/span> from places\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">멀리 떨어진\u003c/span>\u003cspan class=\"en\">far away.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 여전히 파이프를 통해 천연가스를 얻지만, 멀리 떨어진 곳에서 천연가스를 얻습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 지금도 파이프로 천연가스를 얻는다는 것을 말해요. 다만 가져오는 곳이 \u003cb class=\"key\">멀리 \u003c/b>\u003cb class=\"key\">떨어진 \u003c/b>\u003cb class=\"key\">곳\u003c/b>으로 바뀌었다는 것도 알려 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">장소·시간 짝꿍 말(전치사)\u003c/span> : through + 명사 → ~을 통해 : \"파이프를 통해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 문장 + but + 다른 내용 : \"하지만\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"We still get, 우리는 여전히 얻어요. natural gas, 천연가스를. through pipes, 파이프를 통해. but from places, 하지만 장소에서. far away, 멀리 떨어진. 이 문장 전체를 해석하면, 우리는 여전히 파이프를 통해 천연가스를 얻지만, 멀리 떨어진 곳에서 천연가스를 얻습니다.","hl":"m"},{"n":46,"text":"이 문장은 지금도 파이프로 천연가스를 얻는다고 말해요. 그런데 가져오는 곳은 아주 멀리 떨어진 곳이래요.","hl":"mn"},{"n":47,"text":"먼저 through를 볼게요. 이건 전치사라서 파이프를 통해라는 뜻을 만들어요. 그리고 but은 앞뒤 내용이 다르다고 알려 주는 접속사예요. 여전히 얻지만 멀리서 온다는 두 내용을 이어 주는 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가스 파이프 하나는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">A \u003c/span>\u003cspan class=\"tgt\">gas \u003c/span>\u003cspan class=\"tgt\">pipe\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바다 아래에 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">under \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">sea\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~일 수 있어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">be\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">약 1,200km 길이\u003c/span>\u003cspan class=\"en\">about 1,200 km long.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">바다 아래에 있는 한 가스 파이프의 길이는 약 1,200km나 될 수 있답니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 바다 밑에 있는 \u003cb class=\"key\">가스 \u003c/b>\u003cb class=\"key\">파이프\u003c/b>가 얼마나 긴지 알려 주는 문장이에요. 파이프가 아주 멀리까지 이어져서 \u003cb class=\"key\">길이\u003c/b>가 어마어마하다는 것을 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">한 개일 때 a 붙이기(단수)\u003c/span> : 한 개(A) + 이름 말(pipe) = 가스 파이프 하나 : \"가스 파이프 하나는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소를 알려 주는 짝꿍 말(전치사)\u003c/span> : 장소 짝꿍 말(under) + the + 장소(the sea) : \"바다 아래에 있는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">도와주는 동사(조동사) can\u003c/span> : 무엇이(A gas pipe) + ~일 수 있어요(can be) : \"~일 수 있어요\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"A gas pipe, 가스 파이프 하나는. under the sea, 바다 아래에 있는. can be, ~일 수 있어요. about 1,200 km long, 약 1,200km 길이. 이 문장 전체를 해석하면, 바다 아래에 있는 한 가스 파이프의 길이는 약 1,200km나 될 수 있답니다.","hl":"m"},{"n":49,"text":"이 문장은 바다 밑에 있는 가스 파이프가 얼마나 긴지 알려 줘요. 무려 약 천이백 킬로미터나 될 수 있다고 하니 정말 어마어마하죠?","hl":"mn"},{"n":50,"text":"이제 문법을 하나씩 짚어 볼게요. 첫 번째, A gas pipe에서 셀 수 있는 이름 말이 한 개일 때는 앞에 a를 붙여요. 두 번째, under the sea에서 under는 장소를 알려 주는 전치사예요. 그래서 바다 아래라는 장소를 딱 알려 주죠. 세 번째, can은 동사를 도와주는 동사라서 뒤에 be가 그대로 와요. 그래서 can be는 일 수 있어요라는 뜻이 된답니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">오늘 배운 내용 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>석탄, 석유, 천연가스는 모두 \u003cb class=\"key\">화석 \u003c/b>\u003cb class=\"key\">연료\u003c/b>예요.\u003c/li>\u003cli>세계 전기의 약 \u003cb class=\"key\">40퍼센트\u003c/b>는 석탄에서 나오고, 석유의 약 85퍼센트는 \u003cb class=\"key\">엔진 \u003c/b>\u003cb class=\"key\">연료\u003c/b>가 돼요.\u003c/li>\u003cli>우리는 \u003cb class=\"key\">파이프\u003c/b>를 통해 멀리 떨어진 곳에서 천연가스를 얻어요.\u003c/li>\u003cli>화석 연료는 우리 생활 곳곳에서 놀라운 \u003cb class=\"key\">숫자\u003c/b>로 쓰이고 있어요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Coal, oil, and natural gas are fossil fuels, and we use them in many surprising ways.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">석탄, 석유, 천연가스는 모두 \u003cb class=\"key\">화석 \u003c/b>\u003cb class=\"key\">연료\u003c/b>예요. 우리는 아주 오래전부터 이 \u003cb class=\"key\">화석 \u003c/b>\u003cb class=\"key\">연료\u003c/b>를 사용해 왔고, 숫자로 보면 그 쓰임이 정말 놀라워요.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":51,"text":"오늘 우리는 석탄, 석유, 천연가스가 화석 연료라는 것과, 그 숫자들이 얼마나 놀라운지 배웠어요. 여러분 정말 잘 따라와 줬어요! 집에 가서 오늘 배운 숫자를 가족에게 하나씩 말해 보면 더 오래 기억에 남을 거예요. 다음 시간에 또 만나요, 안녕!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
