</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"왓츠 리딩 100A Ch.3 Unit 03 Footprints in the Air","audioDir":"reading03_audio","preview":false,"count":60,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.400em\">Ch.3 Unit 03\u003cbr>Footprints\u003cbr>in the Air\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">왓츠 리딩 100A\u003c/div>\u003ch1>Our Carbon Footprints: Small Steps for the Earth\u003c/h1>\u003ch2>우리의 탄소 발자국: 지구를 위한 작은 실천\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">한 줄 요약\u003c/span>\u003cspan>지구 온난화는 \u003cb class=\"key\">우리 \u003c/b>\u003cb class=\"key\">문제\u003c/b>이고, 가장 좋은 방법은 \u003cb class=\"key\">탄소 \u003c/b>\u003cb class=\"key\">발자국\u003c/b>을 줄이는 거예요. 우리는 전기를 아끼고 컴퓨터를 끄는 작은 실천으로 탄소 발자국을 줄일 수 있어요.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Global warming is our problem, and we can lower our carbon footprints by using less energy.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 공기 속에 남는 발자국, 탄소 발자국에 관한 글을 읽어 볼 거예요. 지구 온난화가 왜 우리 문제인지, 또 우리가 무엇을 할 수 있는지 함께 알아봐요. 오늘 글은 우리의 탄소 발자국을 줄이는 방법을 알려 주는 글이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">미리 알면 쉬워요\u003c/span>\u003cdiv class=\"lp-box\">지구 온난화는 지구가 점점 더워지는 일이에요. 우리가 전기를 쓰고 차를 타면 공기 속에 \u003cb class=\"key\">탄소\u003c/b>가 조금씩 생겨요. 이렇게 우리가 만든 탄소의 양을 carbon footprint, 즉 \u003cb class=\"key\">탄소 \u003c/b>\u003cb class=\"key\">발자국\u003c/b>이라고 불러요. 석유나 석탄 같은 fossil fuel, 화석 연료를 태우면 지구를 덥게 하는 기체가 나와요. 마치 방에 들어갈 때 불을 켜 두면 전기가 계속 쓰이는 것처럼, 우리의 작은 습관도 지구에 영향을 줘요.\u003c/div>","segs":[{"n":2,"text":"여러분, 불을 끄지 않고 방을 나간 적 있나요? 우리가 전기를 쓰면 공기 속으로 탄소가 조금씩 들어가요. 이렇게 우리가 만든 탄소의 양을 carbon footprint, 탄소 발자국이라고 불러요. 화석 연료는 fossil fuel이라고 하는데, 석유나 석탄처럼 땅속에서 나와요. 이런 연료를 태우면 지구를 덥게 하는 기체가 생겨요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>우리 문제라고 생각해요\u003csmall>문제 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>글은 \u003cb class=\"key\">지구 \u003c/b>\u003cb class=\"key\">온난화\u003c/b>를 남의 문제가 아니라 우리 문제라고 말해요. 그래서 우리는 \u003cb class=\"key\">다르게 \u003c/b>\u003cb class=\"key\">생각\u003c/b>할 필요가 있어요. 우리가 무언가 할 수 있기 때문이에요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>탄소 발자국이 뭐예요?\u003csmall>소개 · 문장 4–7\u003c/small>\u003c/h4>\u003cp>가장 좋은 방법은 우리의 \u003cb class=\"key\">탄소 \u003c/b>\u003cb class=\"key\">발자국\u003c/b>을 줄이는 거예요. 우리가 \u003cb class=\"key\">에너지\u003c/b>를 사용하면 공기 속에 탄소를 내보내요. 이렇게 생긴 것을 탄소 발자국이라고 부르고, 모두가 만든다는 것도 알려 줘요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>왜 매일 생길까요?\u003csmall>이유 · 문장 8–11\u003c/small>\u003c/h4>\u003cp>예를 들어 우리는 거의 모든 것에 \u003cb class=\"key\">전기\u003c/b>를 사용해요. 전기는 \u003cb class=\"key\">화석 \u003c/b>\u003cb class=\"key\">연료\u003c/b>를 태워서 만들어지고, 탈 때 \u003cb class=\"key\">온실가스\u003c/b>가 생겨요. 그래서 우리는 매일 탄소 발자국을 만들어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>줄이는 방법\u003csmall>해결 · 문장 12–16\u003c/small>\u003c/h4>\u003cp>탄소 발자국을 줄이는 것은 \u003cb class=\"key\">쉬워요\u003c/b>. 먼저 \u003cb class=\"key\">에너지 \u003c/b>\u003cb class=\"key\">절약\u003c/b>부터 시작해요. 컴퓨터와 텔레비전을 끄고, 계단을 이용하고, 차 대신 걷거나 자전거를 타요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 지구 온난화가 우리 문제라는 생각에서 시작해, 탄소 발자국을 줄이는 방법까지 알려 줘요.","hl":null},{"n":4,"text":"먼저 글은 지구 온난화를 이야기해요. 많은 사람이 지구 온난화가 우리 문제가 아니라고 생각해요. 하지만 글쓴이는 다르게 생각해야 한다고 말해요. 왜냐하면 우리가 지구 온난화를 위해 무언가 할 수 있기 때문이에요.","hl":"f0"},{"n":5,"text":"그래서 가장 좋은 방법은 우리의 탄소 발자국을 줄이는 거예요. 우리가 에너지를 사용하면 공기 속에 탄소를 내보내요. 이때 생기는 것을 탄소 발자국이라고 불러요. 그리고 모두가 탄소 발자국을 만든다는 것도 기억해요.","hl":"f1"},{"n":6,"text":"예를 들어 우리는 거의 모든 것에 전기를 사용해요. 전기는 화석 연료를 태워서 만들어져요. 화석 연료가 탈 때 온실가스가 생겨요. 그래서 우리는 매일 탄소 발자국을 만들게 돼요.","hl":"f2"},{"n":7,"text":"탄소 발자국을 줄이는 것은 생각보다 쉬워요. 먼저 에너지 절약부터 시작해요. 컴퓨터나 텔레비전을 사용하지 않을 때는 꺼 주세요. 엘리베이터 대신 계단을 이용하고, 차 대신 걷거나 자전거를 타는 것도 좋아요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결\u003c/span>\u003cspan class=\"lp-pill\">처음\u003c/span>\u003cspan class=\"lp-pill\">주제문 4번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 지구 온난화라는 \u003cb class=\"key\">문제\u003c/b>를 먼저 보여 주고, 탄소 발자국을 줄이는 \u003cb class=\"key\">해결 \u003c/b>\u003cb class=\"key\">방법\u003c/b>을 뒤에 알려 줘요. 중심 문장은 앞부분의 The best way is to lower our carbon footprints예요. 그래서 문제와 해결이 이어지는 글이라고 볼 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>But (2)\u003c/b>\u003cspan>앞 생각과 반대되는 내용을 알려 줌\u003c/span>\u003cb>because (3)\u003c/b>\u003cspan>이유를 알려 줌\u003c/span>\u003cb>For example (8)\u003c/b>\u003cspan>예시를 소개함\u003c/span>\u003cb>When (10)\u003c/b>\u003cspan>~할 때를 알려 줌\u003c/span>\u003cb>So (11)\u003c/b>\u003cspan>결과를 알려 줌\u003c/span>\u003cb>instead of (15)\u003c/b>\u003cspan>대신에 다른 것을 하라고 알려 줌\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">carbon footprints\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">carbon footprint\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a carbon footprint\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">carbon footprints\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">your carbon footprint\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>남의 문제라고 생각함\u003c/th>\u003cth>우리 문제라고 생각함\u003c/th>\u003c/tr>\u003ctr>\u003ctd>지구 온난화를 멀리 봄\u003c/td>\u003ctd>지구 온난화를 내 일로 봄\u003c/td>\u003c/tr>\u003ctr>\u003ctd>할 수 있는 일이 없다고 느낌\u003c/td>\u003ctd>작은 실천으로 도울 수 있음\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 문제와 해결 방법을 차례로 보여 주는 글쓰기예요. 중심 문장은 앞부분에 나오는 The best way is to lower our carbon footprints예요. 문제를 먼저 알려 주고, 그다음 이유와 해결 방법을 자세히 설명해요.","hl":"ty"},{"n":9,"text":"글에는 길잡이 말이 많아요. But은 반대되는 생각을, because는 이유를 알려 주고, For example은 예시를 소개해요. So는 결과를 이어 주고, instead of는 무엇 대신에 다른 것을 하라는 뜻을 알려 줘요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 단어\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>sometimes\u003c/b>\u003cem>부사\u003c/em>\u003cspan>가끔\u003c/span>\u003c/div>\u003cdiv>\u003cb>global warming\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지구 온난화\u003c/span>\u003c/div>\u003cdiv>\u003cb>differently\u003c/b>\u003cem>부사\u003c/em>\u003cspan>다르게\u003c/span>\u003c/div>\u003cdiv>\u003cb>because\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>왜냐하면, ~때문에\u003c/span>\u003c/div>\u003cdiv>\u003cb>lower\u003c/b>\u003cem>동사\u003c/em>\u003cspan>낮추다, 줄이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>carbon footprint\u003c/b>\u003cem>명사\u003c/em>\u003cspan>탄소 발자국\u003c/span>\u003c/div>\u003cdiv>\u003cb>energy\u003c/b>\u003cem>명사\u003c/em>\u003cspan>에너지\u003c/span>\u003c/div>\u003cdiv>\u003cb>carbon\u003c/b>\u003cem>명사\u003c/em>\u003cspan>탄소\u003c/span>\u003c/div>\u003cdiv>\u003cb>air\u003c/b>\u003cem>명사\u003c/em>\u003cspan>공기\u003c/span>\u003c/div>\u003cdiv>\u003cb>electricity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>전기\u003c/span>\u003c/div>\u003cdiv>\u003cb>almost\u003c/b>\u003cem>부사\u003c/em>\u003cspan>거의\u003c/span>\u003c/div>\u003cdiv>\u003cb>burn\u003c/b>\u003cem>동사\u003c/em>\u003cspan>태우다\u003c/span>\u003c/div>\u003cdiv>\u003cb>fossil fuel\u003c/b>\u003cem>명사\u003c/em>\u003cspan>화석 연료\u003c/span>\u003c/div>\u003cdiv>\u003cb>greenhouse gas\u003c/b>\u003cem>명사\u003c/em>\u003cspan>온실가스\u003c/span>\u003c/div>\u003cdiv>\u003cb>every day\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>매일\u003c/span>\u003c/div>\u003cdiv>\u003cb>less\u003c/b>\u003cem>부사\u003c/em>\u003cspan>더 적게\u003c/span>\u003c/div>\u003cdiv>\u003cb>turn off\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>끄다\u003c/span>\u003c/div>\u003cdiv>\u003cb>instead of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~대신에\u003c/span>\u003c/div>\u003cdiv>\u003cb>elevator\u003c/b>\u003cem>명사\u003c/em>\u003cspan>엘리베이터\u003c/span>\u003c/div>\u003cdiv>\u003cb>ride\u003c/b>\u003cem>동사\u003c/em>\u003cspan>타다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"오늘의 단어를 소리 내어 읽어 볼게요. global warming은 지구 온난화, carbon footprint는 탄소 발자국이에요. fossil fuel은 화석 연료, greenhouse gas는 온실가스라는 뜻이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">problem\u003c/b>\u003cspan class=\"m\">문제\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">trouble\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">answer\u003c/span>\u003cspan class=\"a\">solution\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">lower\u003c/b>\u003cspan class=\"m\">줄이다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">reduce\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">raise\u003c/span>\u003cspan class=\"a\">increase\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">easy\u003c/b>\u003cspan class=\"m\">쉬운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">simple\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hard\u003c/span>\u003cspan class=\"a\">difficult\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">everyone\u003c/b>\u003cspan class=\"m\">모두\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">everybody\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">nobody\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">start\u003c/b>\u003cspan class=\"m\">시작하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">begin\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">finish\u003c/span>\u003cspan class=\"a\">end\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">less\u003c/b>\u003cspan class=\"m\">더 적게\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">fewer\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">more\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"problem은 trouble과 비슷하고 answer나 solution과 반대예요. lower는 reduce와 비슷하고 raise나 increase와 반대예요. easy는 simple과 비슷하고 hard나 difficult와 반대이며, less는 fewer와 비슷하고 more와 반대예요. everyone은 everybody와 비슷하고 nobody와 반대이고, start는 begin과 비슷하고 finish나 end와 반대예요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 가끔\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">We \u003c/span>\u003cspan class=\"tgt\">sometimes \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~라고 생각합니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">think\u003c/span> that\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지구 온난화가\u003c/span>\u003cspan class=\"en\">global warming\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 문제가 아니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">not\u003c/span> our problem.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 가끔 지구 온난화가 우리의 문제가 아니라고 생각합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 많은 사람이 지구 온난화를 \u003cb class=\"key\">남의 \u003c/b>\u003cb class=\"key\">문제\u003c/b>처럼 생각한다는 걸 말해요. 글의 \u003cb class=\"key\">처음 \u003c/b>\u003cb class=\"key\">생각\u003c/b>을 보여 주며, 뒤에서 생각을 바꿔야 한다고 이어 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재 사실 말하기(일반동사 현재형)\u003c/span> : 누가(We) + 가끔(sometimes) + 생각해요(think) : \"우리는 가끔 생각합니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be동사에 not 붙이기(be동사 부정문)\u003c/span> : 무엇이(global warming) + 아니다(is not) + 우리의 문제(our problem) : \"우리의 문제가 아니다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"We sometimes, 우리는 가끔. think that, ~라고 생각합니다. global warming, 지구 온난화가. is not our problem, 우리의 문제가 아니다. 이 문장 전체를 해석하면, 우리는 가끔 지구 온난화가 우리의 문제가 아니라고 생각합니다.","hl":"m"},{"n":13,"text":"이 문장은 많은 사람이 지구 온난화를 남의 문제처럼 생각한다는 걸 말해요. 글의 처음 생각을 보여 주면서, 뒤에서 생각을 바꿔 보자고 이어 줘요.","hl":"mn"},{"n":14,"text":"첫째, We sometimes think는 우리는 가끔 생각합니다라는 뜻이에요. 지금도 늘 그런 생각을 한다는 뜻이라 think를 현재형 그대로 써요. 둘째, is not은 우리의 문제가 아니라고 말할 때 쓰는 be동사 부정문이에요. is 뒤에 not을 붙이면 우리의 문제가 아니에요가 된답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 우리는 ~할 필요가 있습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">But\u003c/span> we \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">need \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다르게 생각하다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">think\u003c/span> differently.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 우리는 다르게 생각할 필요가 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞에서 나온 \u003cb class=\"key\">생각\u003c/b>을 바꾸자는 신호예요. 지구 온난화를 \u003cb class=\"key\">우리 \u003c/b>\u003cb class=\"key\">문제\u003c/b>로 보자고 말해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 앞말(생각) + 하지만(But) + 뒷말(다르게 생각) : \"하지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to + 동사원형(to부정사)\u003c/span> : 할 필요가 있어요(need) + to + 생각하다(think) : \"생각할 필요가 있습니다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"But we need to, 하지만 우리는 ~할 필요가 있습니다. think differently, 다르게 생각하다. 이 문장 전체를 해석하면, 하지만 우리는 다르게 생각할 필요가 있습니다.","hl":"m"},{"n":16,"text":"이 문장은 앞에서 나온 생각을 바꾸자는 신호예요. 지구 온난화를 우리 문제로 보자고 말해요.","hl":"mn"},{"n":17,"text":"첫째, But은 앞 문장과 반대되는 생각을 이어 주는 접속사예요. 하지만이라는 뜻으로 흐름을 바꿔 줘요. 둘째, need to think는 생각할 필요가 있어요라는 뜻이에요. need 뒤에 to와 동사원형 think를 붙여 말한답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 ~입니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It \u003c/span>\u003cspan class=\"tgt\">is\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 문제\u003c/span>\u003cspan class=\"en\">our problem\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜냐하면 우리는 할 수 있기 때문에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">because\u003c/span> we \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것에 대해 무언가를 해요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">do\u003c/span> something about it.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리가 지구 온난화에 대해 무언가를 할 수 있기 때문에, 그것은 우리의 문제입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 지구 온난화가 \u003cb class=\"key\">우리 \u003c/b>\u003cb class=\"key\">문제\u003c/b>인 까닭을 알려 줘요. 우리가 \u003cb class=\"key\">무언가를 \u003c/b>\u003cb class=\"key\">할 \u003c/b>\u003cb class=\"key\">수\u003c/b> 있기 때문이라고 말해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사 현재형(be동사)\u003c/span> : 그것은(It) + 입니다(is) + 우리의 문제(our problem) : \"그것은 우리의 문제입니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">까닭을 이어 주는 말(접속사)\u003c/span> : 우리 문제예요(It is our problem) + 왜냐하면(because) + 할 수 있어요(we can) : \"왜냐하면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">할 수 있다(조동사 can)\u003c/span> : 우리는(we) + 할 수 있어요(can) + 하다(do) : \"할 수 있습니다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"It is, 그것은 ~입니다. our problem, 우리의 문제. because we can, 왜냐하면 우리는 할 수 있기 때문에. do something about it, 그것에 대해 무언가를 해요. 이 문장 전체를 해석하면, 우리가 지구 온난화에 대해 무언가를 할 수 있기 때문에, 그것은 우리의 문제입니다.","hl":"m"},{"n":19,"text":"이 문장은 지구 온난화가 우리 문제인 까닭을 알려 줘요. 우리가 무언가를 할 수 있기 때문이라고 말해요.","hl":"mn"},{"n":20,"text":"첫째, It is는 그것은 우리의 문제입니다라는 be동사 문장이에요. 여기서 It은 지구 온난화를 가리켜요. 둘째, because는 앞말의 까닭을 뒤에서 알려 주는 접속사예요. 왜냐하면이라고 생각하면 쉬워요. 셋째, can do는 할 수 있다라는 뜻이에요. can 뒤에는 동사원형 do를 써서 해낼 수 있다고 말한답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 16\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가장 좋은 방법은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">The \u003c/span>\u003cspan class=\"tgt\">best \u003c/span>\u003cspan class=\"tgt\">way\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">줄이는 것입니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">lower\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 탄소 발자국을.\u003c/span>\u003cspan class=\"en\">our carbon footprints.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">가장 좋은 방법은 우리의 탄소 발자국을 줄이는 것입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 우리의 탄소 발자국을 줄이는 것이 \u003cb class=\"key\">가장 \u003c/b>\u003cb class=\"key\">좋은 \u003c/b>\u003cb class=\"key\">방법\u003c/b>이라고 말해요. 글 전체의 \u003cb class=\"key\">중심 \u003c/b>\u003cb class=\"key\">문장\u003c/b>이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가장 ~한(최상급)\u003c/span> : the + 가장 좋은(best) + 무엇(way) : \"가장 좋은 방법\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to + 동사원형(to부정사)\u003c/span> : 이다(is) + 줄이는 것(to lower) : \"줄이는 것입니다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"The best way, 가장 좋은 방법은. is to lower, 줄이는 것입니다. our carbon footprints, 우리의 탄소 발자국을.. 이 문장 전체를 해석하면, 가장 좋은 방법은 우리의 탄소 발자국을 줄이는 것입니다.","hl":"m"},{"n":22,"text":"이 문장은 우리의 탄소 발자국을 줄이는 것이 가장 좋은 방법이라고 말해요. 글 전체에서 아주 중요한 중심 문장이에요.","hl":"mn"},{"n":23,"text":"먼저 the best를 볼까요? 여러 가지 중에서 가장 좋은 하나를 고를 때 the와 best를 써요. 이걸 최상급이라고 해요. 두 번째로 is to lower는 '줄이는 것입니다'라는 뜻이에요. be동사 뒤에 to와 동사원형이 오면 '~하는 것'이 돼요. 이때 to와 동사원형을 to부정사라고 불러요. 참 쉽죠?","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 에너지를 사용할 때,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">use \u003c/span>\u003cspan class=\"tgt\">energy\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 탄소를 내보냅니다\u003c/span>\u003cspan class=\"en\">we put carbon\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공기 중에.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">into \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">air\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 에너지를 사용할 때 공기 중에 탄소를 내보냅니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 우리가 에너지를 쓸 때 \u003cb class=\"key\">공기 \u003c/b>\u003cb class=\"key\">중에 \u003c/b>\u003cb class=\"key\">탄소\u003c/b>가 나온다는 뜻이에요. 탄소 발자국이 왜 생기는지 \u003cb class=\"key\">까닭\u003c/b>을 알려 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이어 주는 말 when(접속사)\u003c/span> : ~할 때(When) + 누가(we) + 한다(use) + 무엇을(energy) : \"우리가 에너지를 사용할 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소 짝꿍 말(전치사)\u003c/span> : 안으로(into) + 공기 속(the air) : \"공기 중으로\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"When we use energy, 우리가 에너지를 사용할 때. we put carbon, 우리는 탄소를 내보냅니다. into the air, 공기 중에.. 이 문장 전체를 해석하면, 우리는 에너지를 사용할 때 공기 중에 탄소를 내보냅니다.","hl":"m"},{"n":25,"text":"우리가 에너지를 쓸 때 공기 속으로 탄소가 나온다는 뜻이에요. 그래서 탄소 발자국이 생기는 까닭을 잘 알려 주고 있어요.","hl":"mn"},{"n":26,"text":"먼저 When we use energy에서 when은 '~할 때'라고 때를 알려 주는 접속사예요. 두 번째로 into the air를 보면, into는 '안으로'라는 뜻으로 장소를 알려 줘요. 탄소가 공기 속으로 쏙 들어간다고 생각하면 아주 쉬워요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 불립니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It's\u003c/span> called\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">탄소 발자국이라고.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">carbon \u003c/span>\u003cspan class=\"tgt\">footprint\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것을 탄소 발자국이라고 부릅니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 공기에 나오는 탄소를 \u003cb class=\"key\">탄소 \u003c/b>\u003cb class=\"key\">발자국\u003c/b>이라고 부른다는 뜻이에요. 중요한 낱말에 \u003cb class=\"key\">이름\u003c/b>을 붙여 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">am·are·is 친구들(be동사)\u003c/span> : 그것은(It) + 이다('s) : \"그것은 ~이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">하나를 뜻하는 a(관사)\u003c/span> : 하나의(a) + 탄소 발자국(carbon footprint) : \"탄소 발자국 하나\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"It's called, 그것은 불립니다. a carbon footprint, 탄소 발자국이라고.. 이 문장 전체를 해석하면, 그것을 탄소 발자국이라고 부릅니다.","hl":"m"},{"n":28,"text":"공기 속으로 나오는 탄소를 탄소 발자국이라고 부른다는 뜻이에요. 중요한 낱말에 이름을 붙여 주는 문장이에요.","hl":"mn"},{"n":29,"text":"먼저 It's는 It is를 줄인 말이에요. be동사는 '~이다'라고 이름을 붙여 줄 때 써요. 두 번째로 a carbon footprint에서 a는 '하나의'라는 뜻이에요. 셀 수 있는 것 하나를 말할 때 앞에 a를 붙여요. 여기서는 탄소 발자국 하나를 가리키는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모두가 만듭니다\u003c/span>\u003cspan class=\"en\">Everyone \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">makes\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">탄소 발자국을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">carbon \u003c/span>\u003cspan class=\"tgt\">footprint\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">모두가 탄소 발자국을 만듭니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 \u003cb class=\"key\">모두\u003c/b>가 \u003cb class=\"key\">탄소 \u003c/b>\u003cb class=\"key\">발자국\u003c/b>을 만든다는 걸 알려 줘요. 뒤에 나올 이야기의 바탕이 되는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">한 사람·한 개일 때 동사 + s(3인칭 단수)\u003c/span> : 모두가(Everyone) + 만든다(makes) + 탄소 발자국을(a carbon footprint) : \"만듭니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">하나를 말할 때 붙이는 말(관사)\u003c/span> : 하나의(a) + 탄소 발자국(carbon footprint) : \"탄소 발자국 하나\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Everyone makes, 모두가 만듭니다. a carbon footprint, 탄소 발자국을. 이 문장 전체를 해석하면, 모두가 탄소 발자국을 만듭니다.","hl":"m"},{"n":31,"text":"이 문장은 모두가 탄소 발자국을 만든다는 걸 알려 줘요. 뒤에 나올 이야기의 바탕이 되는 문장이죠.","hl":"mn"},{"n":32,"text":"첫째, 주어 Everyone은 모두라는 뜻이지만 한 사람처럼 다뤄요. 그래서 동사 make 뒤에 s를 붙여 makes라고 해요. 둘째, 탄소 발자국 하나를 말하니까 footprint 앞에 a를 붙인답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들어,\u003c/span>\u003cspan class=\"en\">For example,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 전기를 사용합니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">use\u003c/span> electricity\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거의 모든 것에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">almost \u003c/span>\u003cspan class=\"tgt\">everything\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">예를 들어, 우리는 거의 모든 것에 전기를 사용합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 \u003cb class=\"key\">예를 \u003c/b>\u003cb class=\"key\">들어\u003c/b> 우리가 일상에서 \u003cb class=\"key\">전기\u003c/b>를 얼마나 많이 쓰는지 보여 줘요. 전기를 거의 모든 것에 쓴다는 걸 알려 주는 거죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">하는 일 말(동사) 현재형\u003c/span> : 우리는(we) + 쓴다(use) + 전기를(electricity) : \"우리는 사용해요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소·시간 짝꿍 말(전치사)\u003c/span> : 무엇에(for) + 거의 모든 것(almost everything) : \"거의 모든 것에\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"For example, 예를 들어. we use electricity, 우리는 전기를 사용합니다. for almost everything, 거의 모든 것에. 이 문장 전체를 해석하면, 예를 들어, 우리는 거의 모든 것에 전기를 사용합니다.","hl":"m"},{"n":34,"text":"이 문장은 예를 들어 우리가 전기를 얼마나 많이 쓰는지 보여 줘요. 전기를 거의 모든 것에 쓴다는 걸 알려 주는 거죠.","hl":"mn"},{"n":35,"text":"첫째, 주어 we는 나와 너를 포함한 여러 사람이에요. 그래서 동사에 아무것도 붙이지 않고 use 그대로 써요. 둘째, for는 쓰는 대상을 알려 주는 짝꿍 말이에요. 그래서 for almost everything은 거의 모든 것에라는 뜻이 된답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 전기는\u003c/span>\u003cspan class=\"en\">The electricity\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~에서 와요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">comes \u003c/span>\u003cspan class=\"tgt\">from\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">화석 연료를 태우는 것에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">burning\u003c/span> fossil fuels.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">전기는 화석 연료를 태워서 만들어집니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 \u003cb class=\"key\">전기\u003c/b>가 어디서 오는지 알려 줘요. \u003cb class=\"key\">화석 \u003c/b>\u003cb class=\"key\">연료\u003c/b>를 태워서 전기를 만든다는 뜻이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">장소·시간 짝꿍 말(전치사)\u003c/span> : 전기는(The electricity) + 와요(comes) + ~에서(from) : \"~에서 와요, ~에서 비롯돼요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동사-ing가 이름 말처럼 쓰임(동명사)\u003c/span> : burn(태우다) + ing = burning(태우는 것) : \"태우는 것\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"The electricity, 그 전기는. comes from, ~에서 와요. burning fossil fuels, 화석 연료를 태우는 것에서. 이 문장 전체를 해석하면, 전기는 화석 연료를 태워서 만들어집니다.","hl":"m"},{"n":37,"text":"이 문장은 전기가 어디서 오는지 알려 줘요. 화석 연료를 태워서 전기를 만든다는 뜻이죠.","hl":"mn"},{"n":38,"text":"첫째, come from은 어디서 오는지 알려 주는 덩어리 표현이에요. 그래서 comes from burning fossil fuels는 화석 연료를 태우는 것에서 온다는 뜻이 돼요. 둘째, burn에 ing를 붙이면 태우는 것이라는 이름 말이 된답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">화석 연료가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">fossil \u003c/span>\u003cspan class=\"tgt\">fuels \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">탈 때, 그것은 만듭니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">burn\u003c/span>, \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">makes \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">온실가스를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">greenhouse \u003c/span>\u003cspan class=\"tgt\">gases\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">화석 연료가 탈 때, 온실가스를 배출합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 우리가 왜 탄소 발자국을 만들게 되는지 그 이유를 알려 줘요. 화석 연료를 태우면 \u003cb class=\"key\">온실가스\u003c/b>가 나온다고 설명해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">때를 이어 주는 말(접속사 when)\u003c/span> : When + 무엇이(fossil fuels) + 한다(burn), → 그때 일어나는 일 : \"화석 연료가 탈 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">한 개일 때 동사 + s(3인칭 단수)\u003c/span> : 그것은(it) + 만든다(makes) + 무엇을(greenhouse gases) : \"그것은 온실가스를 만듭니다\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"When fossil fuels, 화석 연료가. burn, it makes, 탈 때, 그것은 만듭니다. greenhouse gases, 온실가스를. 이 문장 전체를 해석하면, 화석 연료가 탈 때, 온실가스를 배출합니다.","hl":"m"},{"n":40,"text":"이 문장은 우리가 왜 탄소 발자국을 만들게 되는지 그 이유를 알려 줘요. 화석 연료를 태우면 온실가스가 나오기 때문이죠.","hl":"mn"},{"n":41,"text":"먼저 when은 무엇이 할 때라는 뜻으로 두 가지 일을 이어 줘요. 그래서 When fossil fuels burn은 화석 연료가 탈 때라는 뜻이 돼요. 두 번째로 주어 it은 한 개를 가리키니까 동사에 s를 붙여 makes라고 해요. 이렇게 한 개가 주어일 때 동사에 s를 붙이는 것을 3인칭 단수라고 불러요. 어렵지 않죠?","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서 우리는 만듭니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">So,\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">make\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">탄소 발자국을\u003c/span>\u003cspan class=\"en\">carbon footprints\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매일\u003c/span>\u003cspan class=\"en\">every day.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그래서 우리는 매일 탄소 발자국을 만듭니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞에서 말한 이유 때문에 우리 모두가 매일 탄소 발자국을 만든다는 것을 \u003cb class=\"key\">정리\u003c/b>해 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사 so)\u003c/span> : 이유 + So + 결과 : \"그래서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지금도 반복해서 하는 일(현재형)\u003c/span> : 우리는(we) + 만든다(make) + 무엇을(carbon footprints) : \"우리는 만듭니다\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"So, we make, 그래서 우리는 만듭니다. carbon footprints, 탄소 발자국을. every day, 매일. 이 문장 전체를 해석하면, 그래서 우리는 매일 탄소 발자국을 만듭니다.","hl":"m"},{"n":43,"text":"이 문장은 앞에서 말한 이유 때문에 우리 모두가 매일 탄소 발자국을 만든다는 것을 정리해 줘요.","hl":"mn"},{"n":44,"text":"먼저 so는 앞 문장과 뒤 문장을 이어 주면서 그래서라는 뜻을 더해요. 앞에서 온실가스 이야기가 나왔으니 그래서 우리는 매일 탄소 발자국을 만든다는 거죠. 그리고 we make는 매일 반복하는 일이라 현재형으로 썼어요. 주어가 we라서 동사에 s를 붙이지 않는 것도 꼭 기억해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분의 탄소 발자국을 줄이는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Lowering\u003c/span> your carbon footprint\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">쉽습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">easy\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여러분의 탄소 발자국을 줄이는 것은 쉽습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 탄소 발자국을 줄이는 일이 어렵지 않다고 말해 줘요. 이 글 뒷부분의 \u003cb class=\"key\">중심\u003c/b>이 되는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사-ing가 이름 말처럼 쓰임(동명사)\u003c/span> : 줄이는 것(Lowering) + 은/는 + 쉽다(is easy) : \"줄이는 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">보충하는 말(보어)\u003c/span> : 무엇은(is) + 쉽다(easy) : \"쉽습니다\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"Lowering your carbon footprint, 여러분의 탄소 발자국을 줄이는 것은. is easy, 쉽습니다. 이 문장 전체를 해석하면, 여러분의 탄소 발자국을 줄이는 것은 쉽습니다.","hl":"m"},{"n":46,"text":"이 문장은 탄소 발자국을 줄이는 일이 어렵지 않다고 말해 줘요. 이 글 뒷부분에서 중심이 되는 문장이에요.","hl":"mn"},{"n":47,"text":"먼저 Lowering은 동사 lower에 ing를 붙여서 줄이는 것이라는 이름처럼 쓰였어요. 이렇게 동사에 ing를 붙여 이름처럼 쓰는 것을 동명사라고 해요. 그리고 is easy는 주어가 어떤지 설명해 줘요. easy는 쉬운이라는 뜻의 형용사예요. 마지막으로 여러분도 Lowering your carbon footprint is easy라고 소리 내어 말해 볼까요?","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">  class=\"en\">For example,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">컴퓨터를 끄세요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">turn \u003c/span>\u003cspan class=\"tgt\">off\u003c/span> computers\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또는 텔레비전을\u003c/span>\u003cspan class=\"en\">or televisions\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들이 ~할 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">when\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">they\u003c/span> are\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사용하지 않을 때\u003c/span>\u003cspan class=\"en\">not in use.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">예를 들어, 사용하지 않을 때는 컴퓨터나 텔레비전을 끄세요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 안 쓰는 전자제품을 끄는 것이 \u003cb class=\"key\">에너지 \u003c/b>\u003cb class=\"key\">절약\u003c/b>의 쉬운 예예요. 컴퓨터와 텔레비전을 예로 들어 \u003cb class=\"key\">구체적인 \u003c/b>\u003cb class=\"key\">방법\u003c/b>을 알려 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문(명령문)\u003c/span> : 끄세요(turn off) + 무엇을(computers) : \"끄세요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : when + 주어 + 동사 = ~할 때 : \"~할 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">대신하는 말(대명사)\u003c/span> : computers or televisions → they : \"그것들\"\u003c/div>\u003c/div>","segs":[{"n":51,"text":"For example, 예를 들어. turn off computers, 컴퓨터를 끄세요. or televisions, 또는 텔레비전을. when they are, 그것들이 ~할 때. not in use, 사용하지 않을 때. 이 문장 전체를 해석하면, 예를 들어, 사용하지 않을 때는 컴퓨터나 텔레비전을 끄세요.","hl":"m"},{"n":52,"text":"안 쓰는 전자제품을 끄는 것이 에너지 절약의 쉬운 예예요. 컴퓨터와 텔레비전을 예로 들어 구체적인 방법을 알려 주는 문장이에요.","hl":"mn"},{"n":53,"text":"첫 번째, turn off는 동사원형으로 시작하는 명령문이에요. '끄세요'라고 시키는 말이죠. 두 번째, when은 '~할 때'라고 때를 이어 주는 접속사예요. 세 번째, they는 앞에 나온 컴퓨터와 텔레비전을 대신하는 대명사예요. 그래서 같은 말을 두 번 하지 않아도 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 15 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">계단을 이용하세요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Take\u003c/span> the stairs\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~대신에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">instead \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">엘리베이터\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">elevator\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">엘리베이터 대신 계단을 이용하세요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 엘리베이터 대신 계단을 걸으면 \u003cb class=\"key\">전기\u003c/b>를 아낄 수 있어요. 작은 행동도 \u003cb class=\"key\">탄소 \u003c/b>\u003cb class=\"key\">발자국\u003c/b>을 줄이는 데 도움이 돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문(명령문)\u003c/span> : 이용하세요(Take) + 무엇을(the stairs) : \"이용하세요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소·시간 짝꿍 말(전치사)\u003c/span> : A instead of B = B 대신에 A : \"엘리베이터 대신에\"\u003c/div>\u003c/div>","segs":[{"n":54,"text":"Take the stairs, 계단을 이용하세요. instead of, ~대신에. an elevator, 엘리베이터. 이 문장 전체를 해석하면, 엘리베이터 대신 계단을 이용하세요.","hl":"m"},{"n":55,"text":"엘리베이터 대신 계단을 걸으면 전기를 아낄 수 있어요. 작은 행동도 탄소 발자국을 줄이는 데 도움이 돼요.","hl":"mn"},{"n":56,"text":"첫 번째, Take는 동사원형으로 시작하는 명령문이에요. '이용하세요'라고 말하는 거죠. 두 번째, instead of는 '~대신에'라는 뜻을 가진 전치사 덩어리예요. 그래서 instead of an elevator는 엘리베이터 대신에라는 뜻이 돼요. 계단을 걸으면 운동도 되고 전기도 아낄 수 있으니 아주 좋아요. 여러분도 한번 해 볼까요?","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 16 / 16\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아니면 무엇이 어떨까요\u003c/span>\u003cspan class=\"en\">Or \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">about \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">걷거나 자전거를 타는 것\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">walking\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">riding\u003c/span> a bike\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">차를 타는 대신에?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">instead \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">taking\u003c/span> a car?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">아니면 차를 타는 대신 걷거나 자전거를 타는 것은 어떨까요?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 차를 타지 말고 걷거나 자전거를 타 보자고 가볍게 \u003cb class=\"key\">제안\u003c/b>하는 문장이에요. 탄소 발자국을 줄이는 아주 쉬운 \u003cb class=\"key\">방법\u003c/b>을 알려 주고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">제안 표현(How about + 동명사)\u003c/span> : 어떨까요(how about) + 걷기(walking) = 걷는 건 어때요? : \"걷는 것은 어떨까요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 걷기(walking) + 또는(or) + 타기(riding) : \"걷거나 타는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">장소·시간 짝꿍 말(전치사)\u003c/span> : 대신에(instead of) + 타기(taking) = 타는 대신에 : \"차를 타는 대신에\"\u003c/div>\u003c/div>","segs":[{"n":57,"text":"Or how about, 아니면 무엇이 어떨까요. walking or riding a bike, 걷거나 자전거를 타는 것. instead of taking a car?, 차를 타는 대신에?. 이 문장 전체를 해석하면, 아니면 차를 타는 대신 걷거나 자전거를 타는 것은 어떨까요?","hl":"m"},{"n":58,"text":"이 문장은 차를 타는 대신에 걷거나 자전거를 타 보자고 살짝 제안하고 있어요. 탄소 발자국을 줄이는 아주 쉬운 방법을 알려 주는 문장이에요.","hl":"mn"},{"n":59,"text":"첫 번째로 how about walking을 볼까요. how about 뒤에 동명사를 붙이면 걷는 건 어때요 하고 부드럽게 제안하는 말이 돼요. 두 번째로 or riding은 걷거나 타는처럼 두 가지를 이어 주는 접속사예요. 마지막으로 instead of taking은 타는 대신에라고 해석하고, instead of 뒤에는 동명사가 온다는 것도 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">오늘 배운 내용 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>지구 온난화는 \u003cb class=\"key\">우리 \u003c/b>\u003cb class=\"key\">문제\u003c/b>이고, 우리가 무언가 할 수 있어요.\u003c/li>\u003cli>우리가 에너지를 쓰면 \u003cb class=\"key\">탄소 \u003c/b>\u003cb class=\"key\">발자국\u003c/b>이 생겨요.\u003c/li>\u003cli>전기는 \u003cb class=\"key\">화석 \u003c/b>\u003cb class=\"key\">연료\u003c/b>를 태워서 만들어지고, 온실가스가 나와요.\u003c/li>\u003cli>컴퓨터를 끄고 계단을 이용하면 \u003cb class=\"key\">탄소 \u003c/b>\u003cb class=\"key\">발자국\u003c/b>을 줄일 수 있어요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Global warming is our problem, and we can lower our carbon footprints by using less energy.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">지구 온난화는 \u003cb class=\"key\">우리 \u003c/b>\u003cb class=\"key\">문제\u003c/b>이고, 가장 좋은 방법은 \u003cb class=\"key\">탄소 \u003c/b>\u003cb class=\"key\">발자국\u003c/b>을 줄이는 거예요. 우리는 전기를 아끼고 컴퓨터를 끄는 작은 실천으로 탄소 발자국을 줄일 수 있어요.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":60,"text":"오늘은 지구 온난화가 우리 문제이고, 탄소 발자국을 줄일 수 있다는 것을 배웠어요. 작은 실천으로 에너지를 아끼고, 컴퓨터와 텔레비전을 끄는 습관을 기억해요. 여러분의 작은 행동이 지구를 도울 수 있어요. 오늘도 멋지게 공부했어요, 칭찬해요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
