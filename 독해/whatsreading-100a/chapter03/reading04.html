@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"왓츠 리딩 100A Ch.3 Unit 04 New Journey!","audioDir":"reading04_audio","preview":false,"count":63,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.520em\">Ch.3 Unit\u003cbr>04 New\u003cbr>Journey!\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">왓츠 리딩 100A\u003c/div>\u003ch1>From a Plastic Bottle to Something New\u003c/h1>\u003ch2>플라스틱 병에서 새로운 것으로\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">한 줄 요약\u003c/span>\u003cspan>요약: \u003cb class=\"key\">플라스틱 \u003c/b>\u003cb class=\"key\">병\u003c/b>인 ‘나’가 가게에서 팔린 뒤 공원과 \u003cb class=\"key\">재활용\u003c/b> 과정을 거쳐 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">것\u003c/b>이 될 준비를 하는 이야기예요.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>A plastic bottle goes through recycling and gets ready to become something new.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 플라스틱 병의 여행 이야기를 함께 읽어 볼 거예요. 이 글은 플라스틱 병이 가게에서 팔린 뒤 재활용 과정을 거쳐 새로운 것이 될 준비를 하는 이야기예요. 재미있게 따라와 주세요!","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">미리 알면 쉬워요\u003c/span>\u003cdiv class=\"lp-box\">여러분, 우리가 마시는 음료수 병은 대부분 \u003cb class=\"key\">플라스틱\u003c/b>으로 만들어져요. 플라스틱 병은 그냥 버리지 않고 \u003cb class=\"key\">재활용\u003c/b>하면 다른 물건으로 다시 태어날 수 있어요. 이때 병을 씻고 종류별로 나누는 일을 분리배출이라고 해요. 영어로는 recycle이라고 하고, recycling bin은 재활용 쓰레기통이에요. 여러분은 학교에서 우유 팩을 씻어 버린 적이 있나요?\u003c/div>","segs":[{"n":2,"text":"여러분, 우리가 마시는 음료수 병은 대부분 플라스틱으로 만들어져요. 플라스틱 병은 그냥 버리지 않고 재활용하면 다른 물건으로 다시 태어날 수 있어요. 이때 병을 씻고 종류별로 나누는 일을 분리배출이라고 해요. 영어로는 recycle이라고 하고, recycling bin은 재활용 쓰레기통이에요. 여러분은 학교에서 우유 팩을 씻어 버린 적이 있나요?","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>가게에서 공원으로\u003csmall>시작 · 문장 1–6\u003c/small>\u003c/h4>\u003cp>플라스틱 병인 ‘나’는 \u003cb class=\"key\">가게\u003c/b>에서 소년에게 팔려요. 소년은 나를 \u003cb class=\"key\">공원\u003c/b>으로 데려가고, 햇볕이 따뜻한 좋은 날을 보내요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>재활용통과 센터\u003csmall>바뀜 · 문장 7–10\u003c/small>\u003c/h4>\u003cp>며칠 후 나는 \u003cb class=\"key\">재활용 \u003c/b>\u003cb class=\"key\">쓰레기통\u003c/b>에 있어요. 트럭이 나를 태워 \u003cb class=\"key\">재활용 \u003c/b>\u003cb class=\"key\">센터\u003c/b>로 데려가고, 그곳에서 다른 플라스틱 병들을 만나 기뻐해요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>기계와 뜨거움\u003csmall>과정 · 문장 11–14\u003c/small>\u003c/h4>\u003cp>기계가 우리를 모두 모아 \u003cb class=\"key\">큰 \u003c/b>\u003cb class=\"key\">덩어리\u003c/b>로 만들어요. 나는 씻기고 가열되어 \u003cb class=\"key\">녹아서\u003c/b> 길고 부드러운 \u003cb class=\"key\">국수 \u003c/b>\u003cb class=\"key\">모양\u003c/b>이 돼요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>새로운 것으로\u003csmall>마무리 · 문장 15–17\u003c/small>\u003c/h4>\u003cp>나는 \u003cb class=\"key\">조각\u003c/b>들로 잘리고 더 이상 병이 아니에요. 그래도 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">것\u003c/b>이 될 준비가 되어 있어요. 이야기의 \u003cb class=\"key\">마지막\u003c/b> 부분이에요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 플라스틱 병의 여행을 차례대로 따라가 볼게요.","hl":null},{"n":4,"text":"먼저 플라스틱 병인 내 이야기는 가게에서 시작해요. 한 소년이 가게에 들어와 나를 사고, 나를 공원으로 데려가요. 공원에서 햇볕은 따뜻했고 날씨는 아주 좋았어요.","hl":"f0"},{"n":5,"text":"며칠 후 나는 재활용 쓰레기통 안에 있어요. 곧 트럭이 와서 나를 태우고 재활용 센터로 데려가요. 그곳에서 다른 플라스틱 병들을 만나서 참 기뻤어요.","hl":"f1"},{"n":6,"text":"그런데 기계가 우리를 모두 모아서 하나의 큰 덩어리로 만들어요. 나는 씻기고 가열되어 녹아서 길고 부드러운 국수 모양이 돼요. 이 과정에서 병의 모양이 많이 달라져요.","hl":"f2"},{"n":7,"text":"그다음 나는 조각으로 잘리고 더 이상 병이 아니에요. 그래도 나는 새로운 것이 될 준비가 되어 있어요. 이야기의 마지막에서 병이 새 출발을 준비한다는 걸 알 수 있어요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">이야기 순서\u003c/span>\u003cspan class=\"lp-pill\">끝\u003c/span>\u003cspan class=\"lp-pill\">주제문 17번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 플라스틱 병이 겪은 일을 \u003cb class=\"key\">시간의 \u003c/b>\u003cb class=\"key\">흐름\u003c/b>에 따라 \u003cb class=\"key\">이야기 \u003c/b>\u003cb class=\"key\">순서\u003c/b>로 보여 줘요. 마지막 문장에서 병이 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">것\u003c/b>이 될 준비를 한다는 중심 생각을 알려 줘요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Suddenly (3)\u003c/b>\u003cspan>갑작스러운 일을 알려 줌\u003c/span>\u003cb>Then (4)\u003c/b>\u003cspan>다음 순서를 알려 줌\u003c/span>\u003cb>A few days later (7)\u003c/b>\u003cspan>시간이 지났음을 알려 줌\u003c/span>\u003cb>But (8)\u003c/b>\u003cspan>앞 내용과 반대되는 일을 알려 줌\u003c/span>\u003cb>A few weeks later (12)\u003c/b>\u003cspan>시간이 지났음을 알려 줌\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">me\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">I\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">us\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a bottle\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 일이 일어난 시간의 흐름에 따라 쓰인 이야기 순서 글이에요. 중심 생각은 마지막 문장에 나와요. 병이 새로운 것이 될 준비를 한다는 내용이 중심 생각이에요.","hl":"ty"},{"n":9,"text":"글 속의 Suddenly는 갑작스러운 일을, Then은 다음 순서를 알려 줘요. A few days later와 A few weeks later는 시간이 지났다는 것을 알려 주고, But은 앞 내용과 반대되는 일을 보여 줘요. 같은 병을 me, I, us, a bottle처럼 여러 표현으로 부르기도 해요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 단어\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>journey\u003c/b>\u003cem>명사\u003c/em>\u003cspan>여행, 여정\u003c/span>\u003c/div>\u003cdiv>\u003cb>store\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가게\u003c/span>\u003c/div>\u003cdiv>\u003cb>plastic\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>플라스틱(의)\u003c/span>\u003c/div>\u003cdiv>\u003cb>container\u003c/b>\u003cem>명사\u003c/em>\u003cspan>용기\u003c/span>\u003c/div>\u003cdiv>\u003cb>suddenly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>갑자기\u003c/span>\u003c/div>\u003cdiv>\u003cb>buy\u003c/b>\u003cem>동사\u003c/em>\u003cspan>사다\u003c/span>\u003c/div>\u003cdiv>\u003cb>take\u003c/b>\u003cem>동사\u003c/em>\u003cspan>데려가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>park\u003c/b>\u003cem>명사\u003c/em>\u003cspan>공원\u003c/span>\u003c/div>\u003cdiv>\u003cb>recycling bin\u003c/b>\u003cem>명사\u003c/em>\u003cspan>재활용 쓰레기통\u003c/span>\u003c/div>\u003cdiv>\u003cb>truck\u003c/b>\u003cem>명사\u003c/em>\u003cspan>트럭\u003c/span>\u003c/div>\u003cdiv>\u003cb>pick up\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>태우다, 집어 들다\u003c/span>\u003c/div>\u003cdiv>\u003cb>machine\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기계\u003c/span>\u003c/div>\u003cdiv>\u003cb>block\u003c/b>\u003cem>명사\u003c/em>\u003cspan>덩어리\u003c/span>\u003c/div>\u003cdiv>\u003cb>melt\u003c/b>\u003cem>동사\u003c/em>\u003cspan>녹다\u003c/span>\u003c/div>\u003cdiv>\u003cb>noodles\u003c/b>\u003cem>명사\u003c/em>\u003cspan>국수 모양 가닥\u003c/span>\u003c/div>\u003cdiv>\u003cb>cut\u003c/b>\u003cem>동사\u003c/em>\u003cspan>자르다, 잘리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>piece\u003c/b>\u003cem>명사\u003c/em>\u003cspan>조각\u003c/span>\u003c/div>\u003cdiv>\u003cb>ready\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>준비된\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"오늘의 단어는 journey, store, plastic, containers, suddenly를 소리 내어 읽어 볼게요. journey는 여행, store는 가게, plastic은 플라스틱, containers는 용기들이라는 뜻이에요. picked up은 집어 들었다, block은 큰 덩어리, melted는 녹았다는 뜻이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">journey\u003c/b>\u003cspan class=\"m\">여행\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">trip\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">warm\u003c/b>\u003cspan class=\"m\">따뜻한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">hot\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">cold\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">beautiful\u003c/b>\u003cspan class=\"m\">아름다운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">pretty\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ugly\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">glad\u003c/b>\u003cspan class=\"m\">기쁜\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">happy\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">sad\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">different\u003c/b>\u003cspan class=\"m\">다른\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">other\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">same\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">soft\u003c/b>\u003cspan class=\"m\">부드러운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">smooth\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hard\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"비슷한 말과 반대말도 함께 익혀 볼게요. warm은 따뜻한, 비슷한 말은 hot이고 반대말은 cold예요. beautiful은 아름다운, glad는 기쁜, different는 다른, soft는 부드럽다는 뜻이에요. happy와 sad, same과 other처럼 쉬운 짝도 기억해 두면 좋아요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 17\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나의 여정은 시작되었어요\u003c/span>\u003cspan class=\"en\">My journey \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">started\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 가게에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">store\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나의 여정은 한 가게에서 시작되었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이야기를 하는 사람은 플라스틱 병이에요. 그 병의 여정이 가게에서 시작됐다고 알려 주며 이야기의 \u003cb class=\"key\">처음\u003c/b>을 열어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 무엇이 + 했어요(started) + 어디서 : \"시작되었어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소 짝꿍 말(전치사)\u003c/span> : in + 장소 = ~ 안에서, ~에서 : \"한 가게에서\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"My journey started, 나의 여정은 시작되었어요. in a store, 한 가게에서. 이 문장 전체를 해석하면, 나의 여정은 한 가게에서 시작되었습니다.","hl":"m"},{"n":13,"text":"이야기를 하는 사람은 바로 플라스틱 병이에요. 그 병의 여정이 가게에서 시작됐다고 말하고 있죠.","hl":"mn"},{"n":14,"text":"먼저 started는 이미 지난 일을 말하는 과거형이에요. start에 -ed를 붙이면 시작되었어요가 된답니다. 두 번째로 in a store는 한 가게에서라는 뜻으로, 어디서 일어난 일인지 알려 주는 장소 짝꿍 말이에요. 아주 짧고 깔끔한 문장이니 여러분도 나의 여정은 어디서 시작됐는지 영어로 말해 볼까요?","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많이 있었어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">were\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 플라스틱 용기들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">many \u003c/span>\u003cspan class=\"tgt\">plastic \u003c/span>\u003cspan class=\"tgt\">containers\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">온갖 모양과 크기로\u003c/span>\u003cspan class=\"en\">in all shapes and sizes.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">온갖 모양과 크기의 플라스틱 용기들이 많이 있었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 가게 안에 모양도 크기도 제각각인 플라스틱 용기들이 아주 많았다는 걸 보여 줘요. \u003cb class=\"key\">물건\u003c/b>이 가득한 가게 풍경이 그려져요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">있음을 말하는 말(There is/are)\u003c/span> : There were + 복수 명사 = ~들이 있었어요 : \"많이 있었어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">많음을 나타내는 말(수량 표현 many)\u003c/span> : many + 셀 수 있는 복수 명사(containers) : \"많은 플라스틱 용기들\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"There were, 많이 있었어요. many plastic containers, 많은 플라스틱 용기들이. in all shapes and sizes, 온갖 모양과 크기로. 이 문장 전체를 해석하면, 온갖 모양과 크기의 플라스틱 용기들이 많이 있었습니다.","hl":"m"},{"n":16,"text":"가게 안에 플라스틱 용기들이 정말 많았다는 걸 알려 주는 문장이에요. 모양도 크기도 다 달랐대요.","hl":"mn"},{"n":17,"text":"첫 번째, There were는 ~들이 있었어요라는 뜻이에요. 여러 개가 있었으니까 were를 썼죠. 두 번째, many는 셀 수 있는 것이 많을 때 쓰는 말이에요. container에 s를 붙여 용기들이라고 복수로 말했어요. 세 번째, in all shapes and sizes는 온갖 모양과 크기로라는 뜻이에요. 같은 병이 하나도 없는 가게를 머릿속에 그려 보세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">갑자기 한 소년이 들어와서\u003c/span>\u003cspan class=\"en\">Suddenly, a boy \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">came \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 나를 샀어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">bought\u003c/span> me.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">갑자기 한 소년이 들어와서 나를 샀어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 한 소년이 가게에 들어와 나를 사 갔다는 장면이에요. 병의 \u003cb class=\"key\">여정\u003c/b>이 본격적으로 움직이기 시작한 순간이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 들어왔어요(came in) + 그리고(and) + 샀어요(bought) : \"들어와서 샀어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 사다(buy) + 지난 일 = bought : \"샀어요\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Suddenly, a boy came in, 갑자기 한 소년이 들어와서. and bought me, 그리고 나를 샀어요. 이 문장 전체를 해석하면, 갑자기 한 소년이 들어와서 나를 샀어요.","hl":"m"},{"n":19,"text":"한 소년이 가게에 들어와서 이 병을 사 갔다는 장면이에요. 드디어 병의 여정이 움직이기 시작했네요.","hl":"mn"},{"n":20,"text":"첫째, came in and bought는 들어와서 샀어요라는 뜻이에요. and가 두 가지 일을 이어 주고 있죠. 둘째, bought는 buy의 과거형이에요. 이렇게 모양이 확 바뀌는 불규칙 과거형도 있으니 꼭 외워 두세요. 셋째, Suddenly는 갑자기라는 뜻으로 이야기를 신나게 만들어 줘요. 여러분도 오늘 있었던 일을 and로 이어서 영어로 말해 볼까요?","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러고 나서 그는\u003c/span>\u003cspan class=\"en\">Then he\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나를 데려갔어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">took\u003c/span> me\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공원으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">park\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 다음에 그는 나를 공원으로 데려갔지요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 소년이 나를 사 가지고 \u003cb class=\"key\">공원\u003c/b>으로 데려간 일을 말해요. 이야기의 \u003cb class=\"key\">장소\u003c/b>가 가게에서 공원으로 바뀌는 대목이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(he) + 했어요(took) + 무엇을(me) : \"데려갔어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소 짝꿍 말(전치사)\u003c/span> : 데려갔어요(took) + 어디로(to) + 공원(a park) : \"공원으로\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Then he, 그러고 나서 그는. took me, 나를 데려갔어요. to a park, 공원으로. 이 문장 전체를 해석하면, 그 다음에 그는 나를 공원으로 데려갔지요.","hl":"m"},{"n":22,"text":"이 문장은 소년이 나를 사 가지고 공원으로 데려갔다는 뜻이에요. 이야기의 장소가 가게에서 공원으로 바뀌는 아주 중요한 대목이죠.","hl":"mn"},{"n":23,"text":"첫 번째, took은 take의 과거형이에요. 지난 일이라서 모양이 took으로 변했어요. 이렇게 규칙대로 변하지 않는 동사를 불규칙 동사라고 불러요. 두 번째, to는 '공원으로'처럼 방향을 알려 주는 말이에요. to a park를 붙여서 '공원으로'라고 통째로 기억해 두면 아주 좋아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">햇볕이\u003c/span>\u003cspan class=\"en\">The sunlight\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">따뜻했어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was\u003c/span> warm.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">햇볕이 따뜻했어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 공원에 도착했을 때 \u003cb class=\"key\">햇볕\u003c/b>이 따뜻했다는 것을 말해요. 그래서 기분 좋은 \u003cb class=\"key\">분위기\u003c/b>가 느껴져요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사(be동사)\u003c/span> : 무엇이(The sunlight) + 이었다(was) + 따뜻한(warm) : \"따뜻했어요\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"The sunlight, 햇볕이. was warm, 따뜻했어요. 이 문장 전체를 해석하면, 햇볕이 따뜻했어요.","hl":"m"},{"n":25,"text":"공원에 갔을 때 햇볕이 따뜻했다는 뜻이에요. 그래서 기분이 좋은 분위기가 느껴지죠.","hl":"mn"},{"n":26,"text":"여기서 was는 is의 과거형이에요. 지난 일이라서 was로 바뀐 거예요. The sunlight was warm을 '햇볕이 따뜻했어요'라고 통째로 익혀 두면 아주 좋아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 ~였어요\u003c/span>\u003cspan class=\"en\">It \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아주 좋은 날\u003c/span>\u003cspan class=\"en\">a \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">beautiful\u003c/span> day.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">날씨가 아주 좋았지요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 그날이 아주 좋은 \u003cb class=\"key\">날\u003c/b>이었다고 말해요. 주인공의 \u003cb class=\"key\">기분\u003c/b>이 좋았다는 것도 알 수 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사(be동사)\u003c/span> : 그것은(It) + 이었다(was) + 좋은 날(a beautiful day) : \"좋은 날이었어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">꾸며 주는 말(형용사)\u003c/span> : 아름다운(beautiful) + 날(day) : \"아름다운, 아주 좋은\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"It was, 그것은 ~였어요. a beautiful day, 아주 좋은 날. 이 문장 전체를 해석하면, 날씨가 아주 좋았지요.","hl":"m"},{"n":28,"text":"그날이 아주 좋은 날이었다는 뜻이에요. 주인공의 기분이 좋았다는 것도 알 수 있죠.","hl":"mn"},{"n":29,"text":"첫 번째, was는 is의 과거형이에요. 날씨를 말할 때는 It을 자주 써요. 두 번째, beautiful은 day를 꾸며 주는 말이에요. 그래서 a beautiful day는 '아주 좋은 날'이 되는 거예요. 여러분도 오늘을 a beautiful day로 만들어 봐요!","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">며칠 후에,\u003c/span>\u003cspan class=\"en\">A few days later,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 있었어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">was\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">재활용 쓰레기통 안에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">recycling \u003c/span>\u003cspan class=\"tgt\">bin\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">며칠 후, 나는 재활용 쓰레기통에 있었어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 주인공 병이 버려져서 \u003cb class=\"key\">재활용\u003c/b> \u003cb class=\"key\">쓰레기통\u003c/b>에 들어갔다는 걸 알려 줘요. 이야기가 새로운 장소로 넘어가는 장면이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사 지난 일 말(be동사 과거형)\u003c/span> : 누가(I) + 이었다(was) + 어디에 : \"나는 있었어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소 짝꿍 말(전치사)\u003c/span> : 안에(in) + 재활용 쓰레기통(a recycling bin) : \"재활용 쓰레기통 안에\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"A few days later, 며칠 후에. I was, 나는 있었어요. in a recycling bin, 재활용 쓰레기통 안에. 이 문장 전체를 해석하면, 며칠 후, 나는 재활용 쓰레기통에 있었어요.","hl":"m"},{"n":31,"text":"이 문장은 병이 며칠 뒤에 재활용 쓰레기통에 들어갔다는 걸 말해요. 이야기가 새로운 곳으로 넘어가는 장면이에요.","hl":"mn"},{"n":32,"text":"첫 번째, I was에서 was는 지난 일을 말하는 be동사 과거형이에요. am이 was로 바뀐 거죠. 두 번째, in은 장소를 알려 주는 전치사예요. 그래서 재활용 쓰레기통 안에 있다는 뜻이 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 곧\u003c/span>\u003cspan class=\"en\">But soon\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">트럭이 왔어요\u003c/span>\u003cspan class=\"en\">a truck \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">came\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 나를 집어 들었어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">picked \u003c/span>\u003cspan class=\"tgt\">me \u003c/span>\u003cspan class=\"tgt\">up\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 곧 트럭이 와서 나를 차에 태웠어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 트럭이 와서 병을 집어 실어 갔다는 장면이에요. 병이 다시 다른 곳으로 움직이게 되는 \u003cb class=\"key\">트럭\u003c/b>이 나와요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 트럭이(a truck) + 왔다(came) : \"왔어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 그리고(and) + 집어 들었다(picked) + 나를(me) : \"그리고 나를 집어 들었어요\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"But soon, 하지만 곧. a truck came, 트럭이 왔어요. and picked me up, 그리고 나를 집어 들었어요. 이 문장 전체를 해석하면, 하지만 곧 트럭이 와서 나를 차에 태웠어요.","hl":"m"},{"n":34,"text":"이 문장은 트럭이 와서 병을 집어 갔다는 걸 말해요. 병이 다시 다른 곳으로 움직이는 장면이죠.","hl":"mn"},{"n":35,"text":"첫 번째, came은 come의 과거형이에요. 지난 일이라서 모양이 불규칙하게 바뀌었죠. 두 번째, and는 두 가지 일을 이어 주는 접속사예요. 트럭이 왔다는 일과 나를 집어 들었다는 일을 자연스럽게 연결해 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 운전해서 갔어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">drove\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">재활용 센터로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">recycling \u003c/span>\u003cspan class=\"tgt\">center\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 재활용 센터로 갔지요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 트럭이 병을 실은 채로 \u003cb class=\"key\">재활용 \u003c/b>\u003cb class=\"key\">센터\u003c/b>까지 갔다는 걸 알려 줘요. 장소가 바뀌는 흐름을 이어 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u0 지요.","hl":"m"},{"n":52,"text":"녹은 플라스틱이 길고 부드러운 국수로 변신했어요. 병이 전혀 다른 물건이 된 거죠.","hl":"mn"},{"n":53,"text":"첫 번째, melted는 이미 지난 일이라 -ed를 붙인 과거형이에요. 두 번째, become의 과거형은 became이에요. 규칙과 달라서 불규칙이라고 불러요. 꼭 외워 두세요. 세 번째, long and soft는 noodles를 꾸며 주는 말이에요. 어떤 국수인지 콕 집어 주는 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 15 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 또한 잘렸어요\u003c/span>\u003cspan class=\"en\">I was also cut\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">조각들로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">into \u003c/span>\u003cspan class=\"tgt\">pieces\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 또한 조각들로 잘라졌어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 병이 \u003cb class=\"key\">조각조각\u003c/b> 잘렸어요. 이제 원래 병 모양은 \u003cb class=\"key\">사라진\u003c/b> 거예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">장소·방향 짝꿍 말(전치사)\u003c/span> : cut + into + pieces : \"조각들로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">당하는 덩어리 표현(수동 표현)\u003c/span> : 무엇이(I) + 당했다(was cut) : \"잘라졌어요\"\u003c/div>\u003c/div>","segs":[{"n":54,"text":"I was also cut, 나는 또한 잘렸어요. into pieces, 조각들로. 이 문장 전체를 해석하면, 나는 또한 조각들로 잘라졌어요.","hl":"m"},{"n":55,"text":"병이 조각조각 잘라졌어요. 이제는 원래 병 모양이 완전히 사라진 거예요.","hl":"mn"},{"n":56,"text":"첫 번째, 내가 자른 게 아니라 잘라진 거예요. 이렇게 당하는 일은 was cut처럼 be동사 뒤에 cut을 붙여서 말해요. 두 번째, into는 어디로 들어가는지 방향을 알려 주는 말이에요. 그래서 into pieces는 조각들로라는 뜻이 되죠. 여러분, 오늘도 정말 잘했어요!","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 16 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 아니었어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">wasn't\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">병\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">bottle\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 이상\u003c/span>\u003cspan class=\"en\">any longer.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 더 이상 병이 아니었어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 병이었던 내가 이제는 병이 아니라는 것을 말해요. \u003cb class=\"key\">모양\u003c/b>이 바뀌어 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">것\u003c/b>이 되기 직전이라는 흐름을 이어 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사 부정(be동사 부정문)\u003c/span> : 누가(I) + 아니었다(wasn't) + 무엇이(a bottle) : \"나는 아니었어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be동사 뒤 명사(보어)\u003c/span> : 누가(I) + 이다(was) + 무엇이(a bottle) : \"병\"\u003c/div>\u003c/div>","segs":[{"n":57,"text":"I wasn't, 나는 아니었어요. a bottle, 병. any longer, 더 이상. 이 문장 전체를 해석하면, 나는 더 이상 병이 아니었어요.","hl":"m"},{"n":58,"text":"이 문장은 병이었던 내가 이제 병이 아니라는 걸 말해요. 모양이 바뀌었으니까요.","hl":"mn"},{"n":59,"text":"첫 번째, wasn't는 was에 not을 붙인 말이에요. was는 is의 과거형이라서 지난 일을 말할 때 써요. 그래서 I wasn't는 나는 아니었어요가 되죠. 두 번째, be동사 뒤에는 보어가 와서 무엇인지 알려 줘요. a bottle이 병이라는 보어예요. 세 번째, any longer는 not과 짝을 이뤄 더 이상이라는 뜻을 만들어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 17 / 17\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 나는 준비가 되었습니다\u003c/span>\u003cspan class=\"en\">But I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">ready \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~이 되기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">become\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새로운 것\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">something \u003c/span>\u003cspan class=\"tgt\">new\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 새로운 것이 될 준비가 되었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 병이 아니게 된 내가 이제 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">것\u003c/b>이 될 \u003cb class=\"key\">준비\u003c/b>가 되었다고 말해요. 글의 마지막에서 \u003cb class=\"key\">희망\u003c/b>을 보여 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be ready to + 동사원형(to부정사)\u003c/span> : 누가(I) + 준비되었다(was ready) + ~할(to become) : \"될 준비가 되었습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">형용사가 뒤에서 꾸며 주기(형용사 + something)\u003c/span> : 무엇(something) + 꾸며 주는 말(new) : \"새로운 것\"\u003c/div>\u003c/div>","segs":[{"n":60,"text":"But I was ready, 하지만 나는 준비가 되었습니다. to become, ~이 되기 위해. something new, 새로운 것. 이 문장 전체를 해석하면, 하지만 새로운 것이 될 준비가 되었습니다.","hl":"m"},{"n":61,"text":"병이 아니게 된 나는 이제 새로운 것이 될 준비가 되었어요. 마지막으로 희망을 보여 주는 문장이에요.","hl":"mn"},{"n":62,"text":"첫 번째, be ready to 다음에는 동사원형이 와요. '~할 준비가 되다'라는 정해진 표현이에요. 두 번째, something new처럼 something을 꾸며 주는 형용사는 뒤에 붙어요. new가 something 뒤에서 새로운 것이라고 알려 주죠. 여러분도 오늘 배운 표현으로 멋진 문장을 만들어 봐요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">오늘 배운 내용 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>플라스틱 병인 ‘나’가 \u003cb class=\"key\">가게\u003c/b>에서 팔려 \u003cb class=\"key\">공원\u003c/b>으로 간 일을 배웠어요.\u003c/li>\u003cli>병은 \u003cb class=\"key\">재활용 \u003c/b>\u003cb class=\"key\">쓰레기통\u003c/b>과 \u003cb class=\"key\">재활용 \u003c/b>\u003cb class=\"key\">센터\u003c/b>를 거쳐 \u003cb class=\"key\">큰 \u003c/b>\u003cb class=\"key\">덩어리\u003c/b>가 되었어요.\u003c/li>\u003cli>그다음 씻기고 가열되어 \u003cb class=\"key\">녹아서\u003c/b> \u003cb class=\"key\">국수 \u003c/b>\u003cb class=\"key\">모양\u003c/b>이 되고 \u003cb class=\"key\">조각\u003c/b>으로 잘렸어요.\u003c/li>\u003cli>마지막에는 더 이상 병이 아니지만 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">것\u003c/b>이 될 준비를 한다는 것을 알았어요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>A plastic bottle goes through recycling and gets ready to become something new.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: \u003cb class=\"key\">플라스틱 \u003c/b>\u003cb class=\"key\">병\u003c/b>인 ‘나’가 가게에서 팔린 뒤 공원과 \u003cb class=\"key\">재활용\u003c/b> 과정을 거쳐 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">것\u003c/b>이 될 준비를 하는 이야기예요.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":63,"text":"오늘 우리는 플라스틱 병이 가게에서 공원으로, 재활용 쓰레기통과 재활용 센터를 거쳐 큰 덩어리, 국수 모양, 조각으로 변하는 과정을 배웠어요. 마지막에는 병이 새로운 것이 될 준비를 한다는 것도 알았죠. 글을 읽을 때는 장면을 머릿속에 그려 보고 일이 일어난 순서를 따라가면 더 쉬워요. 여러분 정말 잘했어요, 다음에도 재미있는 이야기로 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
