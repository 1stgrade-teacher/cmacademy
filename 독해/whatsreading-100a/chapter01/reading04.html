@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"왓츠 리딩 100A Ch.1 Unit 04 The Colorful World","audioDir":"reading04_audio","preview":false,"count":63,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.400em\">Ch.1 Unit 04\u003cbr>The Colorful\u003cbr>World\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">왓츠 리딩 100A\u003c/div>\u003ch1>Friends Bring Back the Rainbow\u003c/h1>\u003ch2>친구들이 무지개를 되찾았어요\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">한 줄 요약\u003c/span>\u003cspan>요약: Sun과 Clouds는 무지개로 세상을 따뜻하고 다채롭게 만든 친구였어요. 어느 날 싸워서 \u003cb class=\"key\">Sun\u003c/b>이 떠나자 세상은 회색이 되었지만, 사람들이 \u003cb class=\"key\">무지개 \u003c/b>\u003cb class=\"key\">그림\u003c/b>을 전시하자 둘은 서로를 그리워하며 다시 만나 \u003cb class=\"key\">무지개\u003c/b>를 되찾았어요.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>When friends miss each other and meet again, the world becomes colorful again.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘도 만나서 반가워요. 오늘은 Sun과 Clouds가 들려주는 재미있는 이야기를 함께 읽어 볼 거예요. 두 친구가 싸웠다가 다시 만나서 세상을 알록달록하게 만드는 이야기랍니다. 한 줄로 말하면, 친구를 그리워하는 마음이 무지개를 다시 불러온 이야기예요. 그럼 시작해 볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">미리 알면 쉬워요\u003c/span>\u003cdiv class=\"lp-box\">무지개(rainbow)는 비가 그친 뒤에 하늘에 나타나요. 햇빛(sunlight)이 물방울을 만나면 일곱 가지 색이 보이기 때문이지요. 그래서 비가 오는 동안에는 무지개를 볼 수가 없어요. 친구와 싸우면 하루가 회색처럼 느껴진 적 있나요? 마음이 풀리면 세상이 다시 환해지는 것처럼, \u003cb class=\"key\">Sun\u003c/b>과 \u003cb class=\"key\">Clouds\u003c/b>도 다시 만나 세상을 밝혀 주었어요.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 하나 알려 줄게요. 무지개는 비가 그친 뒤에 하늘에 나타나요. 햇빛이 물방울을 만나면 일곱 가지 색이 보이기 때문이지요. 그래서 비가 오는 동안에는 무지개를 볼 수가 없어요. 여러분은 친구와 싸운 뒤에 마음이 회색처럼 느껴진 적 있나요? 마음이 풀리면 세상이 다시 환해지는 것처럼, 오늘 이야기에서도 Sun과 Clouds가 다시 만나 세상을 밝혀 줍니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>친구 사이\u003csmall>시작 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>\u003cb class=\"key\">Sun\u003c/b>과 \u003cb class=\"key\">Clouds\u003c/b>는 아주 친한 친구였어요. 둘이 함께 \u003cb class=\"key\">무지개\u003c/b>를 만들면 세상이 따뜻하고 다채로워졌지요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>싸움과 회색 세상\u003csmall>문제 · 문장 3–8\u003c/small>\u003c/h4>\u003cp>어느 날 두 친구가 \u003cb class=\"key\">싸움|싸웠어요\u003c/b>. Sun이 떠나자 하늘에는 Clouds 혼자만 남았어요. \u003cb class=\"key\">매일 \u003c/b>\u003cb class=\"key\">비\u003c/b>가 내려서 세상은 색을 잃고 \u003cb class=\"key\">회색\u003c/b>이 되었고, 사람들은 무지개를 볼 수 없었어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>무지개 그림\u003csmall>해결의 실마리 · 문장 9–11\u003c/small>\u003c/h4>\u003cp>사람들은 Sun을 그리워하며 \u003cb class=\"key\">무지개 \u003c/b>\u003cb class=\"key\">그림\u003c/b>을 그려서 전시했어요. 모든 집에 무지개 그림이 걸렸지요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>다시 만난 두 친구\u003csmall>해결·마무리 · 문장 12–17\u003c/small>\u003c/h4>\u003cp>Sun과 Clouds는 그 그림을 보고 서로를 그리워해 다시 만나기로 했어요. Clouds가 무지개가 그립다고 말하자 Sun도 \u003cb class=\"key\">동의\u003c/b>했지요. 그러자 비가 멈추고 천천히 \u003cb class=\"key\">무지개\u003c/b>가 나타났어요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 이야기가 어떻게 흘러가는지 네 단계로 나누어 살펴볼게요.","hl":null},{"n":4,"text":"처음에 Sun과 Clouds는 아주 친한 친구였어요. 둘이 함께 무지개를 만들면 세상이 따뜻하고 다채로워졌지요. 두 친구가 함께라서 세상이 알록달록했어요.","hl":"f0"},{"n":5,"text":"그런데 어느 날 두 친구는 싸움을 했어요. Sun이 떠나 버리자 하늘에는 Clouds만 남았고, 매일 비가 내렸어요. 그래서 세상은 색을 잃고 회색이 되었고, 사람들은 무지개를 볼 수 없었어요.","hl":"f1"},{"n":6,"text":"사람들은 Sun을 그리워했어요. 그래서 무지개 그림을 그려서 집집마다 걸어 두었지요. 모든 집에 무지개 그림이 있게 된 거예요.","hl":"f2"},{"n":7,"text":"Sun과 Clouds는 그 그림을 보고 서로를 그리워했어요. 그래서 다시 만나기로 했고, Clouds가 무지개가 그립다고 하자 Sun도 동의했어요. 그러자 비가 멈추고 해가 밝게 비추었고, 천천히 무지개가 나타났어요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결 이야기(이야기 순서)\u003c/span>\u003cspan class=\"lp-pill\">처음과 끝\u003c/span>\u003cspan class=\"lp-pill\">주제문 13번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 \u003cb class=\"key\">문제\u003c/b>가 생겼다가 풀리는 이야기예요. 가운데에서 세상이 회색이 되는 문제가 생기고, 뒤에서 둘이 다시 만나 \u003cb class=\"key\">해결\u003c/b>되지요. 그래서 처음과 끝을 함께 보면 글의 중심이 잘 보여요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>One day (3)\u003c/b>\u003cspan>새로운 일이 시작됨을 알려 줌\u003c/span>\u003cb>because of (8)\u003c/b>\u003cspan>이유를 알려 줌\u003c/span>\u003cb>so (13)\u003c/b>\u003cspan>앞의 이유 때문에 생긴 결과를 알려 줌\u003c/span>\u003cb>Then (16)\u003c/b>\u003cspan>다음 순서를 알려 줌\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">The Sun and the Clouds\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">they\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">it\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">each other\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>비 오는 회색 세상\u003c/th>\u003cth>무지개 있는 세상\u003c/th>\u003c/tr>\u003ctr>\u003ctd>색이 없고 흐려요\u003c/td>\u003ctd>일곱 색이 알록달록해요\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사람들이 집에만 있어요\u003c/td>\u003ctd>사람들이 무지개를 볼 수 있어요\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 문제가 생기고 그것이 풀리는 문제와 해결의 짜임이에요. 중심이 되는 문장은 뒤쪽에 있는 열세 번째 문장이에요. 둘이 서로를 그리워해서 만나기로 했다는 이 문장이 이야기의 방향을 바꾸지요.","hl":"ty"},{"n":9,"text":"글의 길잡이 말도 눈여겨보세요. One day는 새로운 일이 시작된다는 것을 알려 주고, so는 앞의 이유 때문에 뒤의 일이 생긴다는 것을 알려 줘요. because도 이유를 알려 줄 때 쓰는 말이지요. 그리고 the Sun을 가리켜 it이라고 부르기도 하니, 같은 대상을 다르게 부르는 말도 잘 찾아보세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 단어\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>world\u003c/b>\u003cem>명사\u003c/em>\u003cspan>세상\u003c/span>\u003c/div>\u003cdiv>\u003cb>warm\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>따뜻한\u003c/span>\u003c/div>\u003cdiv>\u003cb>colorful\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>알록달록한\u003c/span>\u003c/div>\u003cdiv>\u003cb>rainbow\u003c/b>\u003cem>명사\u003c/em>\u003cspan>무지개\u003c/span>\u003c/div>\u003cdiv>\u003cb>fight\u003c/b>\u003cem>명사\u003c/em>\u003cspan>싸움\u003c/span>\u003c/div>\u003cdiv>\u003cb>leave\u003c/b>\u003cem>동사\u003c/em>\u003cspan>떠나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>alone\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>혼자인\u003c/span>\u003c/div>\u003cdiv>\u003cb>rain\u003c/b>\u003cem>동사\u003c/em>\u003cspan>비가 내리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>lose\u003c/b>\u003cem>동사\u003c/em>\u003cspan>잃다\u003c/span>\u003c/div>\u003cdiv>\u003cb>gray\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>회색의, 흐린\u003c/span>\u003c/div>\u003cdiv>\u003cb>stay home\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>집에 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>because of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~ 때문에\u003c/span>\u003c/div>\u003cdiv>\u003cb>miss\u003c/b>\u003cem>동사\u003c/em>\u003cspan>그리워하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>bring back\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>다시 데려오다\u003c/span>\u003c/div>\u003cdiv>\u003cb>paint\u003c/b>\u003cem>동사\u003c/em>\u003cspan>그리다, 칠하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>put on display\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>전시하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>notice\u003c/b>\u003cem>동사\u003c/em>\u003cspan>알아차리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>decide\u003c/b>\u003cem>동사\u003c/em>\u003cspan>결정하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>agree\u003c/b>\u003cem>동사\u003c/em>\u003cspan>동의하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>appear\u003c/b>\u003cem>동사\u003c/em>\u003cspan>나타나다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"오늘의 단어도 소리 내어 읽어 볼게요. warm은 따뜻한, colorful는 알록달록한이라는 뜻이에요. miss는 그리워하다, appear는 나타나다는 뜻이지요. put on display는 전시하다, bring back은 다시 데려오다라는 뜻이에요. 큰 소리로 따라 읽어 보세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">warm\u003c/b>\u003cspan class=\"m\">따뜻한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">mild\u003c/span>\u003cspan class=\"s\">hot\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">cold\u003c/span>\u003cspan class=\"a\">cool\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">colorful\u003c/b>\u003cspan class=\"m\">알록달록한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">bright\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">gray\u003c/span>\u003cspan class=\"a\">dark\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">leave\u003c/b>\u003cspan class=\"m\">떠나다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">go away\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">stay\u003c/span>\u003cspan class=\"a\">come\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">alone\u003c/b>\u003cspan class=\"m\">혼자인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">by oneself\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">together\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">miss\u003c/b>\u003cspan class=\"m\">그리워하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">want to see\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">forget\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">appear\u003c/b>\u003cspan class=\"m\">나타나다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">show up\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">disappear\u003c/span>\u003cspan class=\"a\">leave\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"비슷한 말과 반대말도 함께 익혀 볼게요. warm의 반대말은 cold이고, colorful의 반대말은 gray예요. leave는 떠나다이니 반대말은 stay, 혼자인 alone의 반대말은 together예요. appear의 반대말은 disappear랍니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Sun(해)은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">The \u003c/span>\u003cspan class=\"tgt\">Sun \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 Clouds(구름들)는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">Clouds\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">친구였어요.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">were\u003c/span> friends.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Sun과 Clouds는 친구였어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 해(Sun)와 구름(Clouds)이 \u003cb class=\"key\">친구\u003c/b>였다는 걸 알려 줘요. 이야기의 두 \u003cb class=\"key\">주인공\u003c/b>을 소개하는 첫 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : A(The Sun) + and + B(the Clouds) : \"Sun과 Clouds\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be동사 지난 모습(be동사의 과거형)\u003c/span> : 누가(They) + 이었다(were) + 무엇이(friends) : \"~이었어요\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"The Sun, Sun(해)은. and the Clouds, 그리고 Clouds(구름들)는. were friends, 친구였어요.. 이 문장 전체를 해석하면, Sun과 Clouds는 친구였어요.","hl":"m"},{"n":13,"text":"이 문장은 이야기의 두 주인공인 해와 구름을 소개해요. 둘이 아주 친한 친구였다는 걸 먼저 알려 주는 거예요.","hl":"mn"},{"n":14,"text":"첫 번째, The Sun and the Clouds처럼 and로 두 주인공을 이어서 함께 주어로 쓸 수 있어요. 두 번째, were는 be동사의 지난 모습이에요. 지금이 아니라 친구였던 지난 일을 말하죠. 세 번째, 주인공이 Sun과 Clouds, 둘이라서 was가 아니라 were를 써요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 17\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 만들었어요\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">made\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세상을\u003c/span>\u003cspan class=\"en\">the world\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">따뜻하고 다채롭게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">warm \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">colorful\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무지개로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">rainbows\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 무지개로 세상을 따뜻하고 다채롭게 만들었지요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 해와 구름이 함께 \u003cb class=\"key\">무지개\u003c/b>를 만들어 세상을 따뜻하고 알록달록하게 바꿨다는 뜻이에요. 이야기의 \u003cb class=\"key\">배경\u003c/b>을 보여 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(They) + 만들었다(made) + 무엇을(the world) : \"만들었어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">꾸며 주는 말(형용사)\u003c/span> : the world + 따뜻한(warm) + and + 알록달록한(colorful) : \"따뜻하고 다채로운\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">짝꿍 말(전치사)\u003c/span> : with + 무엇(rainbows) = 무엇으로 : \"무지개로\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"They made, 그들은 만들었어요. the world, 세상을. warm and colorful, 따뜻하고 다채롭게. with rainbows, 무지개로. 이 문장 전체를 해석하면, 그들은 무지개로 세상을 따뜻하고 다채롭게 만들었지요.","hl":"m"},{"n":16,"text":"해와 구름이 힘을 합쳐 무지개를 만들었더니 세상이 따뜻하고 알록달록해졌어요. 이야기의 배경을 알려 주는 문장이에요.","hl":"mn"},{"n":17,"text":"첫 번째, made는 make의 과거형이에요. 이미 지나간 지난 일이라서 made를 써요. 두 번째, warm and colorful는 형용사 두 개를 and로 이어 줘요. 그래서 the world가 어떤지 자세히 알려 주죠. 세 번째, with rainbows는 with가 '무엇으로'라는 뜻을 만들어서 무지개로 세상을 꾸몄다는 말이 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어느 날,\u003c/span>\u003cspan class=\"en\">One day,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 싸웠고,\u003c/span>\u003cspan class=\"en\">they \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">had\u003c/span> a fight,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 Sun은 떠났어요.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and\u003c/span> the Sun \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">left\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어느 날, 그들은 싸웠고, Sun이 떠나버렸어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사이좋던 둘이 \u003cb class=\"key\">싸움\u003c/b>을 해서 해가 하늘을 떠나 버렸어요. 이야기가 \u003cb class=\"key\">문제\u003c/b> 상황으로 바뀌는 중요한 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(they) + 가졌다(had) + 무엇을(a fight) : \"가졌어요 → 싸웠어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 싸웠다(had a fight) + and + 떠났다(left) : \"그리고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(the Sun) + 떠났다(left) : \"떠났어요\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"One day, 어느 날. they had a fight, 그들은 싸웠고. and the Sun left, 그리고 Sun은 떠났어요.. 이 문장 전체를 해석하면, 어느 날, 그들은 싸웠고, Sun이 떠나버렸어요.","hl":"m"},{"n":19,"text":"사이좋던 해와 구름이 어느 날 싸움을 했어요. 그래서 해가 하늘을 떠나 버린, 이야기가 문제 상황으로 바뀌는 중요한 문장이에요.","hl":"mn"},{"n":20,"text":"첫 번째, had는 have의 과거형이에요. had a fight를 통째로 '싸우다'라는 덩어리 표현으로 기억해요. 두 번째, left는 leave의 과거형이에요. 규칙과 다르게 모양이 변하는 동사라서 꼭 외워 두세요. 세 번째, and가 앞의 일과 뒤의 일을 이어 줘서, 싸운 다음에 해가 떠났다고 말해 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 구름들은\u003c/span>\u003cspan class=\"en\">The Clouds\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">혼자였어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">were\u003c/span> alone\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하늘에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">sky\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하늘에는 Clouds 혼자뿐이었어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 해가 떠나 버린 뒤 하늘에는 구름들만 남았어요. 앞의 \u003cb class=\"key\">다툼\u003c/b> 다음에 생긴 외로운 장면이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 be동사(be동사 과거형)\u003c/span> : The Clouds(그 구름들은) + were(이었다) + alone(혼자) : \"(그때) 혼자였다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소 짝꿍 말(전치사)\u003c/span> : in + 장소 = ~안에, ~속에 : \"하늘 안에\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"The Clouds, 그 구름들은. were alone, 혼자였어요. in the sky, 하늘에. 이 문장 전체를 해석하면, 하늘에는 Clouds 혼자뿐이었어요.","hl":"m"},{"n":22,"text":"해가 떠나 버려서 구름들만 하늘에 남았어요. 외롭고 쓸쓸한 장면이에요.","hl":"mn"},{"n":23,"text":"먼저, 지난 일을 말하니까 be동사가 were로 바뀌었어요. 그리고 구름이 여러 개라서 was가 아니라 were를 써요. 마지막으로 in the sky에서 in은 전치사예요. 하늘 안에라는 뜻의 장소 짝꿍 말이죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">비가 왔어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">rained\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매일\u003c/span>\u003cspan class=\"en\">every day.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">매일 비가 내렸지요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 구름들만 있어서 매일 비가 내렸어요. 세상이 흐려지기 시작하는 \u003cb class=\"key\">신호\u003c/b>예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">날씨를 말하는 it(비인칭 주어)\u003c/span> : It(날씨) + rains / rained(비가 온다 / 왔다) : \"(날씨가) 비가 왔다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지난 일 하는 말(일반동사 과거형)\u003c/span> : rain(비가 오다) + ed = rained(비가 왔다) : \"비가 왔다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"It rained, 비가 왔어요. every day, 매일. 이 문장 전체를 해석하면, 매일 비가 내렸지요.","hl":"m"},{"n":25,"text":"구름만 있어서 비가 매일 내렸어요. 세상이 흐려지는 시작을 알려 주는 문장이에요.","hl":"mn"},{"n":26,"text":"날씨를 말할 때는 it을 써요. 비가 왔다고 할 때 It rained라고 하죠. 그리고 지난 일이라 rain에 ed를 붙여 과거형으로 만들었어요. 아주 쉬워요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세상은\u003c/span>\u003cspan class=\"en\">The world\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 색을 잃었어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">lost\u003c/span> its colors\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 회색이 되었어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">became \u003c/span>\u003cspan class=\"tgt\">gray\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">세상은 색을 잃고 흐려졌어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 비 때문에 세상이 색을 잃고 회색으로 변했어요. 밝음이 사라진 \u003cb class=\"key\">슬픔\u003c/b>을 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 하는 말(불규칙 과거형)\u003c/span> : lose(잃다) → lost(잃었다) : \"잃었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : A and B = A하고 B, A와 B : \"그리고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">상태를 보충하는 말(보어)\u003c/span> : became(되었다) + gray(회색) : \"회색이 되었다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"The world, 세상은. lost its colors, 그 색을 잃었어요. and became gray, 그리고 회색이 되었어요. 이 문장 전체를 해석하면, 세상은 색을 잃고 흐려졌어요.","hl":"m"},{"n":28,"text":"세상이 색을 다 잃고 회색으로 변했어요. 밝음이 사라져서 마음이 슬퍼지는 장면이에요.","hl":"mn"},{"n":29,"text":"먼저, lose는 잃다라는 뜻인데 지난 일이라 lost로 모양이 바뀌었어요. 이런 동사를 불규칙 동사라고 해요. 두 번째, and는 두 가지 일을 이어 주는 접속사예요. 세 번째, became 뒤에는 회색처럼 어떤 상태인지 알려 주는 말이 와요. 잘 따라 왔죠? 정말 멋져요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들은\u003c/span>\u003cspan class=\"en\">People\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">볼 수 없었어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">couldn't\u003c/span> see\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무지개를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">rainbows\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사람들은 무지개를 볼 수 없었어요.\u003c/div 요. 두 친구의 \u003cb class=\"key\">화해\u003c/b>가 시작되는 대목이지요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(They) + 그리워했어요(missed) + 누구를(each other) : \"그리워했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 그리워한 일 + so + 만나기로 한 일 : \"그래서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to + 동사원형\u003c/span> : decide + to + 동사원형 = ~하기로 결정하다 : \"만나기로 결정했어요\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"They missed, 그들은 그리워했어요. each other, 서로를. so they decided, 그래서 그들은 결정했어요. to meet, 만나기로. 이 문장 전체를 해석하면, 그들은 서로를 그리워해서 만나기로 결정했어요.","hl":"m"},{"n":49,"text":"Sun과 Clouds가 서로를 그리워해서 다시 만나기로 한 장면이에요. 두 친구의 화해가 시작되는 대목이지요.","hl":"mn"},{"n":50,"text":"첫 번째, missed는 지난 일을 말하는 과거형이에요. 지난 일이니까 동사에 d를 붙였어요. 두 번째, so는 그래서라는 뜻으로 앞뒤 문장을 이어 줘요. 세 번째, decide 뒤에 to와 동사원형을 붙이면 무엇을 하기로 결정했다는 뜻이 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 만났을 때,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">met\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Clouds는 말했어요,\u003c/span>\u003cspan class=\"en\">the Clouds \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">said\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">&quot;나는 무지개가 그리워.&quot;\u003c/span>\u003cspan class=\"en\">&quot;I \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">miss\u003c/span> rainbows.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들이 만났을 때 Clouds는 &quot;나는 무지개가 그리워.&quot;라고 말했어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 다시 만난 자리에서 Clouds가 무지개가 보고 싶다고 먼저 말하는 장면이에요. 둘 사이의 \u003cb class=\"key\">그리움\u003c/b>이 말로 드러나는 대목이지요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">때를 알려 주는 이어 주는 말(접속사 when)\u003c/span> : When + 누가 + 했을 때, ~ : \"그들이 만났을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(the Clouds) + 말했어요(said) : \"말했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">지금 느낌 말(현재형)\u003c/span> : 나는(I) + 그리워해요(miss) + 무지개를(rainbows) : \"그리워해요\"\u003c/div>\u003c/div>","segs":[{"n":51,"text":"When they met, 그들이 만났을 때. the Clouds said, Clouds는 말했어요. \"I miss rainbows.\", \"나는 무지개가 그리워.\". 이 문장 전체를 해석하면, 그들이 만났을 때 Clouds는 \"나는 무지개가 그리워.\"라고 말했어요.","hl":"m"},{"n":52,"text":"다시 만난 자리에서 Clouds가 무지개가 보고 싶다고 먼저 말하는 장면이에요. 둘 사이의 그리움이 말로 드러나는 대목이지요.","hl":"mn"},{"n":53,"text":"첫 번째, when은 언제인지 알려 주는 말이에요. 그들이 만났을 때라는 때를 앞에 붙여 줬어요. 두 번째, said는 say의 과거형인데 모양이 불규칙하게 바뀌었어요. 세 번째, 지금 느끼는 마음은 현재형으로 말해요. 그래서 I miss rainbows라고 했어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 15 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Sun은\u003c/span>\u003cspan class=\"en\">The Sun\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">동의했어요.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">agreed\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Sun도 동의했지요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Sun도 무지개가 그립다는 말에 함께 마음을 맞추는 장면이에요. 두 친구가 같은 마음이 된 것을 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(The Sun) + 동의했어요(agreed) : \"동의했어요\"\u003c/div>\u003c/div>","segs":[{"n":54,"text":"The Sun, Sun은. agreed, 동의했어요.. 이 문장 전체를 해석하면, Sun도 동의했지요.","hl":"m"},{"n":55,"text":"Sun도 무지개가 그립다는 말에 함께 마음을 맞추는 장면이에요. 두 친구가 같은 마음이 된 것을 보여 줘요.","hl":"mn"},{"n":56,"text":"첫 번째, agreed는 지난 일을 말하는 과거형이에요. agree에 d만 붙이면 '동의했어요'가 돼요. 이렇게 짧은 문장도 주어와 동사만 있으면 완벽한 문장이 된답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 16 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러자 비가 멈췄어요,\u003c/span>\u003cspan class=\"en\">Then the rain \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">stopped\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 Sun이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and\u003c/span> the Sun\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">밝게 비췄어요.\u003c/span>\u003cspan class=\"en\">shined brightly.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러자 비가 멈추고 Sun이 밝게 비췄어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 비가 멈추고 \u003cb class=\"key\">Sun\u003c/b>이 밝게 비치면서 \u003cb class=\"key\">무지개\u003c/b>가 나타날 준비가 돼요. 슬펐던 이야기가 기분 좋게 바뀌는 장면이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거형(규칙)\u003c/span> : 지난 일: 멈추다(stop) + -ed = 멈췄어요(stopped) : \"멈췄어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 앞 내용 + and + 뒤 내용 : \"그리고\"\u003c/div>\u003c/div>","segs":[{"n":57,"text":"Then the rain stopped, 그러자 비가 멈췄어요. and the Sun, 그리고 Sun이. shined brightly, 밝게 비췄어요.. 이 문장 전체를 해석하면, 그러자 비가 멈추고 Sun이 밝게 비췄어요.","hl":"m"},{"n":58,"text":"비가 멈추고 Sun이 밝게 비치면서 무지개가 나타날 준비가 돼요. 슬펐던 이야기가 기분 좋게 바뀌는 장면이에요.","hl":"mn"},{"n":59,"text":"첫 번째, stopped는 지난 일을 말하는 과거형이에요. 동사 stop 뒤에 알파벳 e와 d를 붙여서 멈췄어요라는 뜻이 되죠. 두 번째, and는 앞뒤 내용을 이어 주는 말이에요. 비가 멈춘 일과 Sun이 밝게 비친 일을 자연스럽게 연결해 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 17 / 17\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">천천히,\u003c/span>\u003cspan class=\"en\">Slowly,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무지개가 나타났답니다.\u003c/span>\u003cspan class=\"en\">a rainbow \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">appeared\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">천천히 무지개가 나타났답니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 비가 그치고 Sun이 비친 뒤, \u003cb class=\"key\">무지개\u003c/b>가 천천히 나타나요. 슬펐던 세상이 다시 색깔을 찾는 기분 좋은 \u003cb class=\"key\">결말\u003c/b>이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거형(규칙)\u003c/span> : 나타나다(appear) + -ed = 나타났어요(appeared) : \"나타났어요\"\u003c/div>\u003c/div>","segs":[{"n":60,"text":"Slowly, 천천히. a rainbow appeared, 무지개가 나타났답니다.. 이 문장 전체를 해석하면, 천천히 무지개가 나타났답니다.","hl":"m"},{"n":61,"text":"비가 그치고 Sun이 비친 뒤에 무지개가 천천히 나타나는 장면이에요. 슬펐던 세상이 다시 색깔을 찾는 기분 좋은 결말로 끝나죠.","hl":"mn"},{"n":62,"text":"appeared는 지난 일을 말하는 과거형이에요. appear 뒤에 알파벳 e와 d를 붙여서 나타났어요라는 뜻이 되죠. 짧은 문장이니까 이 과거형만 잘 기억하면 충분해요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">오늘 배운 내용 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>\u003cb class=\"key\">Sun\u003c/b>과 \u003cb class=\"key\">Clouds\u003c/b>는 무지개로 세상을 따뜻하고 다채롭게 만든 친구였어요.\u003c/li>\u003cli>둘이 싸워 Sun이 떠나자 세상은 \u003cb class=\"key\">회색\u003c/b>이 되고 매일 비가 내렸어요.\u003c/li>\u003cli>사람들은 \u003cb class=\"key\">무지개 \u003c/b>\u003cb class=\"key\">그림\u003c/b>을 그려서 집집마다 전시했어요.\u003c/li>\u003cli>그림을 본 둘은 서로를 그리워해 다시 만났고, \u003cb class=\"key\">무지개\u003c/b>가 다시 나타났어요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>When friends miss each other and meet again, the world becomes colorful again.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: Sun과 Clouds는 무지개로 세상을 따뜻하고 다채롭게 만든 친구였어요. 어느 날 싸워서 \u003cb class=\"key\">Sun\u003c/b>이 떠나자 세상은 회색이 되었지만, 사람들이 \u003cb class=\"key\">무지개 \u003c/b>\u003cb class=\"key\">그림\u003c/b>을 전시하자 둘은 서로를 그리워하며 다시 만나 \u003cb class=\"key\">무지개\u003c/b>를 되찾았어요.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":63,"text":"오늘 우리는 Sun과 Clouds가 다시 만나 무지개를 되찾은 이야기를 읽었어요. 문제가 생겨도 서로를 그리워하는 마음이 해결의 실마리가 된다는 것도 배웠지요. 여러분도 오늘 배운 단어와 문장을 소리 내어 읽으며 복습해 보세요. 정말 잘했어요, 다음 시간에 또 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
