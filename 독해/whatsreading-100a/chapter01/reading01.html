<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>왓츠 리딩 100A Ch.1 Unit 01 Crayola — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}

.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"왓츠 리딩 100A Ch.1 Unit 01 Crayola","audioDir":"reading01_audio","preview":false,"count":57,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.668em\">Ch.1\u003cbr>Unit 01\u003cbr>Crayola\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">왓츠 리딩 100A\u003c/div>\u003ch1>How Crayola Became Safe and Cheap\u003c/h1>\u003ch2>Crayola는 어떻게 안전하고 값싸졌을까요\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">한 줄 요약\u003c/span>\u003cspan>요약: Edwin은 목탄으로 만든 \u003cb class=\"key\">안전하지 \u003c/b>\u003cb class=\"key\">않고 \u003c/b>\u003cb class=\"key\">비싼 \u003c/b>\u003cb class=\"key\">크레용\u003c/b>을 바꾸고 싶어서 일급 비밀 팀을 만들었어요. 팀은 \u003cb class=\"key\">파라핀 \u003c/b>\u003cb class=\"key\">납\u003c/b>과 암석으로 안전하고 값싼 색크레용을 만들어 \u003cb class=\"key\">Crayola\u003c/b>라는 이름을 붙였고, 그 뒤로도 꽃의 색을 연구하며 더 많은 색의 크레용을 만들었답니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Edwin's team made safe and cheap color crayons, and Crayola kept making more colors.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘도 함께 영어 지문을 읽어 볼까요? 오늘은 모두가 좋아하는 크레용, Crayola가 어떻게 만들어졌는지 이야기예요. 아주 안전하고 값싼 색크레용을 만들고 싶었던 Edwin Binney의 이야기를 같이 만나 봐요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">미리 알면 쉬워요\u003c/span>\u003cdiv class=\"lp-box\">여러분, 크레용으로 색칠하는 것 좋아하나요? 그런데 옛날 크레용은 돌가루 같은 \u003cb class=\"key\">목탄\u003c/b>(charcoal)으로 만들어서 아이들이 쓰기에 안전하지 않았어요. 게다가 값도 아주 비쌌지요. 지금 우리가 쓰는 크레용은 \u003cb class=\"key\">파라핀 \u003c/b>\u003cb class=\"key\">납\u003c/b>(paraffin wax)으로 만드는데, 목탄보다 훨씬 안전하답니다. 여러분이 그때 아이였다면 어떤 크레용을 갖고 싶었을까요?\u003c/div>","segs":[{"n":2,"text":"여러분, 크레용으로 색칠하는 거 좋아하나요? 그런데 옛날 크레용은 돌가루 같은 목탄으로 만들어서 아이들이 쓰기에 안전하지 않았어요. 목탄은 영어로 charcoal이라고 해요. 그리고 값도 아주 비쌌지요. 지금 우리가 쓰는 크레용은 파라핀 납, paraffin wax로 만드는데, 목탄보다 훨씬 안전하답니다. 여러분이 만약 그때 아이였다면 어떤 크레용을 갖고 싶었을까요?","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>안전하지 않은 크레용\u003csmall>문제 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>모두가 Edwin Binney의 발명품을 무척 좋아했어요. 하지만 그의 크레용은 \u003cb class=\"key\">목탄\u003c/b>으로 만들어졌기 때문에 아이들에게 안전하지 않았어요. 또한 값도 아주 \u003cb class=\"key\">비쌌어요|값비쌌습니다\u003c/b>. 그래서 새로운 크레용이 필요했답니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>비밀 팀의 연구\u003csmall>시작 · 문장 4–6\u003c/small>\u003c/h4>\u003cp>Edwin은 안전하고 값싼 색크레용을 만들고 싶었어요. 그래서 \u003cb class=\"key\">일급 \u003c/b>\u003cb class=\"key\">비밀 \u003c/b>\u003cb class=\"key\">팀\u003c/b>을 만들었어요. 그 팀은 안전한 색크레용에 대해 \u003cb class=\"key\">연구\u003c/b>를 시작했답니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>파라핀과 암석\u003csmall>해결 · 문장 7–10\u003c/small>\u003c/h4>\u003cp>팀은 목탄보다 안전한 \u003cb class=\"key\">파라핀 \u003c/b>\u003cb class=\"key\">납\u003c/b>을 사용했어요. 색을 내기 위해서는 \u003cb class=\"key\">암석\u003c/b>을 사용했지요. 많은 실험 끝에 마침내 안전하고 값싼 색크레용을 만들어 냈고, Edwin의 아내가 그것을 \u003cb class=\"key\">Crayola\u003c/b>라고 이름 지었어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>멈추지 않은 팀\u003csmall>마무리 · 문장 11–15\u003c/small>\u003c/h4>\u003cp>Crayola는 \u003cb class=\"key\">엄청난 \u003c/b>\u003cb class=\"key\">성공\u003c/b>을 거두었어요. 여덟 가지 색으로 아이들은 다채로운 그림을 그릴 수 있었지요. 그래도 팀은 멈추지 않고 매일 꽃의 색을 연구하며 \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">많은 \u003c/b>\u003cb class=\"key\">색\u003c/b>의 크레용을 만들었답니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 이제 이야기가 어떤 순서로 흘러가는지 하나씩 살펴볼게요.","hl":null},{"n":4,"text":"먼저 모두가 Edwin Binney의 발명품을 무척 좋아했어요. 그런데 그의 크레용은 목탄으로 만들어졌기 때문에 아이들에게 안전하지 않았고, 값도 아주 비쌌어요. 그래서 안전한 크레용이 정말 필요했답니다.","hl":"f0"},{"n":5,"text":"그래서 Edwin은 안전하고 값싼 색크레용을 만들고 싶어 했어요. 그는 일급 비밀 팀을 만들었고, 그 팀은 안전한 색크레용에 대해 연구를 시작했지요.","hl":"f1"},{"n":6,"text":"팀은 목탄보다 더 안전한 파라핀 납을 사용했어요. 색을 내기 위해서는 암석을 사용했고요. 많은 실험 끝에 마침내 안전하고 값싼 색크레용을 만들어 냈어요. 그리고 Edwin의 아내가 그것을 Crayola라고 이름 지었답니다.","hl":"f2"},{"n":7,"text":"Crayola는 엄청난 성공을 거두었어요. 여덟 가지 색으로 아이들은 다채로운 그림을 그릴 수 있었지요. 그래도 팀은 결코 멈추지 않았어요. 매일 꽃의 색을 연구하면서 더 많은 색의 크레용을 만들었답니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">이야기 순서(문제-해결)\u003c/span>\u003cspan class=\"lp-pill\">가운데\u003c/span>\u003cspan class=\"lp-pill\">주제문 4번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 크레용이 안전하지 않고 비싸다는 \u003cb class=\"key\">문제\u003c/b>에서 시작해요. 그리고 팀을 만들어 그 문제를 \u003cb class=\"key\">해결\u003c/b>하는 순서로 이야기가 이어져요. 그래서 앞부분은 안 좋은 점, 뒷부분은 좋아진 점이 나온답니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>However (2)\u003c/b>\u003cspan>앞 내용과 반대되는 내용을 알려 줌\u003c/span>\u003cb>because (2)\u003c/b>\u003cspan>이유를 알려 줌\u003c/span>\u003cb>Also (3)\u003c/b>\u003cspan>내용을 하나 더 보태 줌\u003c/span>\u003cb>After (9)\u003c/b>\u003cspan>시간이 지나 다음 일이 일어났음을 알려 줌\u003c/span>\u003cb>But (13)\u003c/b>\u003cspan>앞 내용에서 이어지는 다른 흐름을 알려 줌\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Edwin Binney's inventions\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">his crayons\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">color crayons\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Crayola\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 문제와 해결의 짜임이에요. 처음에는 크레용이 안전하지 않고 비싸다는 문제가 나오고, 뒤에서 그 문제를 해결해요. 중심이 되는 문장은 가운데에 있는 네 번째 문장, Edwin이 안전하고 값싼 색크레용을 만들고 싶어 했다는 문장이에요.","hl":"ty"},{"n":9,"text":"글의 길잡이 말도 눈여겨보세요. 두 번째 문장의 However는 앞 내용과 반대되는 이야기를 알려 주고, because는 이유를 알려 줘요. Also는 내용을 하나 더 보태고, After는 시간이 지나 다음 일이 일어났음을 알려 주지요. 그리고 같은 크레용을 color crayons, Crayola처럼 다르게 부르기도 한답니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 단어\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>invention\u003c/b>\u003cem>명사\u003c/em>\u003cspan>발명품\u003c/span>\u003c/div>\u003cdiv>\u003cb>soft\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>부드러운\u003c/span>\u003c/div>\u003cdiv>\u003cb>chalk\u003c/b>\u003cem>명사\u003c/em>\u003cspan>분필\u003c/span>\u003c/div>\u003cdiv>\u003cb>wax\u003c/b>\u003cem>명사\u003c/em>\u003cspan>밀랍, 초\u003c/span>\u003c/div>\u003cdiv>\u003cb>however\u003c/b>\u003cem>부사\u003c/em>\u003cspan>그러나, 하지만\u003c/span>\u003c/div>\u003cdiv>\u003cb>safe\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>안전한\u003c/span>\u003c/div>\u003cdiv>\u003cb>charcoal\u003c/b>\u003cem>명사\u003c/em>\u003cspan>목탄\u003c/span>\u003c/div>\u003cdiv>\u003cb>expensive\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>값비싼\u003c/span>\u003c/div>\u003cdiv>\u003cb>cheap\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>값싼\u003c/span>\u003c/div>\u003cdiv>\u003cb>top-secret\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>일급 비밀의\u003c/span>\u003c/div>\u003cdiv>\u003cb>study\u003c/b>\u003cem>동사\u003c/em>\u003cspan>연구하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>paraffin wax\u003c/b>\u003cem>명사\u003c/em>\u003cspan>파라핀 납\u003c/span>\u003c/div>\u003cdiv>\u003cb>rock\u003c/b>\u003cem>명사\u003c/em>\u003cspan>암석, 돌\u003c/span>\u003c/div>\u003cdiv>\u003cb>test\u003c/b>\u003cem>명사\u003c/em>\u003cspan>실험, 시험\u003c/span>\u003c/div>\u003cdiv>\u003cb>finally\u003c/b>\u003cem>부사\u003c/em>\u003cspan>마침내, 드디어\u003c/span>\u003c/div>\u003cdiv>\u003cb>create\u003c/b>\u003cem>동사\u003c/em>\u003cspan>만들어 내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>name\u003c/b>\u003cem>동사\u003c/em>\u003cspan>이름 짓다\u003c/span>\u003c/div>\u003cdiv>\u003cb>huge\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>엄청난, 아주 큰\u003c/span>\u003c/div>\u003cdiv>\u003cb>success\u003c/b>\u003cem>명사\u003c/em>\u003cspan>성공\u003c/span>\u003c/div>\u003cdiv>\u003cb>colorful\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>다채로운, 알록달록한\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"오늘의 단어도 소리 내어 읽어 볼까요? invention은 발명품, safe는 안전한, expensive는 값비싼, cheap은 값싼이라는 뜻이에요. charcoal은 목탄, paraffin wax는 파라핀 납, rock은 암석이에요. success는 성공, colorful는 다채로운이라는 뜻이랍니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">safe\u003c/b>\u003cspan class=\"m\">안전한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">not dangerous\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">dangerous\u003c/span>\u003cspan class=\"a\">unsafe\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">cheap\u003c/b>\u003cspan class=\"m\">값싼\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">not expensive\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">expensive\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">huge\u003c/b>\u003cspan class=\"m\">엄청난\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">very big\u003c/span>\u003cspan class=\"s\">large\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">small\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">finally\u003c/b>\u003cspan class=\"m\">마침내\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">at last\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">first\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">loved\u003c/b>\u003cspan class=\"m\">무척 좋아했다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">liked\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hated\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"비슷한 말과 반대말도 정리해 봐요. safe의 반대말은 dangerous이고, 비슷한 말은 not dangerous예요. cheap의 반대말은 expensive이고요. huge는 very big, large와 비슷하고 small은 반대말이에요. finally는 at last와 비슷하지요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모두가 좋아했습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/
