.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}

.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"왓츠 리딩 100A Ch.1 Unit 02 A Box of Crayons","audioDir":"reading02_audio","preview":false,"count":57,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.468em\">Ch.1 Unit\u003cbr>02 A Box\u003cbr>of Crayons\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">왓츠 리딩 100A\u003c/div>\u003ch1>The Crayons Learn to Get Along\u003c/h1>\u003ch2>크레용들이 사이좋아진 방법\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">한 줄 요약\u003c/span>\u003cspan>요약: Mike의 크레용들은 서로 \u003cb class=\"key\">질투\u003c/b>하고 싸웠어요. Mike가 모든 색으로 한 장의 \u003cb class=\"key\">그림\u003c/b>을 그려 주자, 크레용들은 모두 \u003cb class=\"key\">행복\u003c/b>해졌어요.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Mike helps the crayons get along by drawing one picture with all of them.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘도 만나서 정말 반가워요. 오늘은 Mike와 크레용 상자에 관한 재미있는 이야기를 읽어 볼 거예요. 크레용들이 서로 싸우다가 멋진 그림을 통해 사이좋아지는 이야기랍니다. 함께 시작해 볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">미리 알면 쉬워요\u003c/span>\u003cdiv class=\"lp-box\">크레용은 영어로 \u003cb class=\"key\">crayon\u003c/b>이라고 해요. 색깔마다 잘 어울리는 곳이 달라요. 빨강은 소방차, 노랑은 태양, 파랑은 바다에 잘 어울려요. 우리 반 미술 시간을 떠올려 보세요. 한 가지 색만 쓰면 그림이 \u003cb class=\"key\">심심\u003c/b>해 보이지만, 여러 색이 모이면 멋진 그림이 돼요.\u003c/div>","segs":[{"n":2,"text":"여러분, 미술 시간에 크레용을 써 본 적 있죠? 크레용은 영어로 crayon이라고 해요. 색깔마다 잘 어울리는 곳이 달라요. 빨강은 소방차, 노랑은 태양, 파랑은 바다에 잘 어울리지요. 그런데 한 가지 색만 쓴 그림은 조금 심심해 보여요. 여러분은 어떤 색을 가장 좋아하나요?","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>사이좋지 않은 크레용들\u003csmall>문제 · 문장 1–5\u003c/small>\u003c/h4>\u003cp>Mike는 크레용 한 \u003cb class=\"key\">상자\u003c/b>를 가지고 있었어요. 그런데 크레용들은 \u003cb class=\"key\">사이좋게 \u003c/b>\u003cb class=\"key\">지내지\u003c/b> 않아서 상자 안이 늘 시끄러웠어요. Mike가 소방차와 산타클로스를 색칠할 때 늘 \u003cb class=\"key\">Red\u003c/b>만 써서, 다른 색들이 Red를 \u003cb class=\"key\">질투\u003c/b>했답니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>태양 색을 두고 싸움\u003csmall>문제가 커짐 · 문장 6–8\u003c/small>\u003c/h4>\u003cp>Yellow와 Orange는 \u003cb class=\"key\">서로\u003c/b>를 싫어했어요. 둘 다 자기가 태양의 \u003cb class=\"key\">진짜 \u003c/b>\u003cb class=\"key\">색\u003c/b>이라며 소리쳤지요. 그러던 어느 날 Mike는 크레용들이 \u003cb class=\"key\">싸우는 \u003c/b>\u003cb class=\"key\">소리\u003c/b>를 들었어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>한 장의 멋진 그림\u003csmall>해결 · 문장 9–14\u003c/small>\u003c/h4>\u003cp>Mike는 크레용을 모두 \u003cb class=\"key\">꺼내서\u003c/b> 커다란 흰 종이에 \u003cb class=\"key\">그림\u003c/b>을 그렸어요. 회색 도로와 검정 자동차, 파란 버스, 여러 색 건물을 함께 그렸지요. 마지막으로 Yellow를 가운데에 두고 Orange가 \u003cb class=\"key\">둘러싸게\u003c/b> 해서 태양을 완성했어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>모두 행복\u003csmall>마무리 · 문장 15\u003c/small>\u003c/h4>\u003cp>그림이 \u003cb class=\"key\">완성\u003c/b>되었을 때, 모든 크레용은 \u003cb class=\"key\">행복\u003c/b>했어요. 자기 색이 그림 속에서 꼭 \u003cb class=\"key\">필요\u003c/b>하다는 걸 알았기 때문이에요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 이야기가 어떤 순서로 흘러가는지 함께 살펴볼게요.","hl":null},{"n":4,"text":"먼저 Mike는 크레용 한 상자를 가지고 있었어요. 그런데 크레용들이 사이좋게 지내지 않아서 상자 안은 늘 시끄러웠지요. Mike가 소방차와 산타클로스를 색칠할 때마다 Red만 사용했어요. 그래서 다른 색들이 Red를 많이 질투했답니다.","hl":"f0"},{"n":5,"text":"또 Yellow와 Orange는 서로를 정말 싫어했어요. 둘 다 자기가 태양의 진짜 색이라면서 큰 소리로 외쳤지요. 그러던 어느 날, Mike는 크레용들이 싸우는 소리를 듣고 말았어요.","hl":"f1"},{"n":6,"text":"Mike는 크레용을 모두 꺼내서 커다란 흰 종이 위에 그림을 그리기 시작했어요. 회색 도로와 검정 자동차, 파란 버스, 그리고 여러 색 건물을 함께 그렸지요. 마지막으로 Yellow를 가운데에 두고 Orange가 그것을 둘러싸게 해서 태양을 그렸어요.","hl":"f2"},{"n":7,"text":"그림이 완성되었을 때, 모든 크레용이 행복해졌어요. 자기 색이 그림 속에서 꼭 필요하다는 것을 알았기 때문이에요. 이렇게 크레용들의 싸움은 멋지게 끝이 났답니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결 이야기\u003c/span>\u003cspan class=\"lp-pill\">끝\u003c/span>\u003cspan class=\"lp-pill\">주제문 15번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">처음에는 크레용들이 \u003cb class=\"key\">싸우는 \u003c/b>\u003cb class=\"key\">문제\u003c/b>가 나와요. 가운데에서 Mike가 \u003cb class=\"key\">그림\u003c/b>을 그려 그 문제를 풀어 주지요. 그래서 맨 마지막 문장이 이 글의 \u003cb class=\"key\">중심 \u003c/b>\u003cb class=\"key\">문장\u003c/b>이에요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Also (6)\u003c/b>\u003cspan>내용을 더해 줌\u003c/span>\u003cb>One day (8)\u003c/b>\u003cspan>때를 알려 줌\u003c/span>\u003cb>first (10)\u003c/b>\u003cspan>순서를 알려 줌\u003c/span>\u003cb>When (15)\u003c/b>\u003cspan>때를 알려 줌\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">a box of crayons\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the crayons\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the other colors\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">all the crayons\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">all the crayons\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 문제와 해결의 짜임으로 되어 있어요. 앞부분에서 크레용들이 싸우는 문제가 나오고, 뒷부분에서 Mike의 그림이 그 문제를 해결해 주지요. 그래서 이 글의 중심 문장은 맨 마지막인 열다섯 번째 문장이에요.","hl":"ty"},{"n":9,"text":"글의 길잡이 말도 눈여겨보세요. Also는 내용을 하나 더 보태 줄 때, One day는 어느 날이라는 때를 알려 줄 때 쓰여요. first는 순서를 알려 주고, When은 때를 알려 주는 말이지요. 또 크레용이라는 같은 대상을 the crayons, the other colors, all the crayons처럼 다르게 부르고 있답니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 단어\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>box\u003c/b>\u003cem>명사\u003c/em>\u003cspan>상자\u003c/span>\u003c/div>\u003cdiv>\u003cb>crayon\u003c/b>\u003cem>명사\u003c/em>\u003cspan>크레용\u003c/span>\u003c/div>\u003cdiv>\u003cb>get along\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>사이좋게 지내다\u003c /div>\u003cdiv>\u003cb class=\"w\">get along\u003c/b>\u003cspan class=\"m\">사이좋게 지내다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">be friendly\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">fight\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">hate\u003c/b>\u003cspan class=\"m\">싫어하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">dislike\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">like\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">happy\u003c/b>\u003cspan class=\"m\">행복한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">glad\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">sad\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"비슷한 말과 반대말도 함께 익혀 볼까요? loud는 시끄러운이라는 뜻이고, 비슷한 말은 noisy, 반대말은 quiet이에요. hate는 싫어하다이고, 비슷한 말은 dislike, 반대말은 like예요. happy의 비슷한 말은 glad, 반대말은 sad이고요. get along은 사이좋게 지내다이고, 반대말은 fight예요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Mike는 가지고 있었어요\u003c/span>\u003cspan class=\"en\">Mike \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">had\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 상자를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">box \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">크레용의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">crayons\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Mike는 크레용 한 상자를 가지고 있었어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Mike가 크레용 한 상자를 가지고 있었다는 뜻이에요. 이야기의 \u003cb class=\"key\">주인공\u003c/b>과 무엇이 나오는지 알려 주는 \u003cb class=\"key\">첫 \u003c/b>\u003cb class=\"key\">문장\u003c/b>이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(Mike) + 가졌다(had) + 무엇을(a box of crayons) : \"가지고 있었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">양을 세는 말(수량 표현)\u003c/span> : 한 상자(a box) + 의(of) + 크레용(crayons) : \"크레용 한 상자\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Mike had, Mike는 가지고 있었어요. a box, 한 상자를. of crayons, 크레용의. 이 문장 전체를 해석하면, Mike는 크레용 한 상자를 가지고 있었어요.","hl":"m"},{"n":13,"text":"Mike에게는 크레용이 가득한 상자가 하나 있었어요. 이야기의 주인공과 무엇이 나오는지 알려 주는 첫 문장이에요.","hl":"mn"},{"n":14,"text":"첫 번째, had는 have의 지난 일 말이에요. 지금이 아니라 예전에 가지고 있었다는 뜻이죠. 두 번째, a box of는 양을 세는 말이에요. 상자 하나에 크레용이 여러 개 들어 있다는 뜻이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 15\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 크레용들은\u003c/span>\u003cspan class=\"en\">The crayons\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사이좋게 지내지 않았어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">didn't \u003c/span>\u003cspan class=\"tgt\">get \u003c/span>\u003cspan class=\"tgt\">along\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 크레용들은 사이좋게 지내지 않았어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 크레용들이 서로 \u003cb class=\"key\">사이좋게 \u003c/b>\u003cb class=\"key\">지내지\u003c/b> 못했다는 뜻이에요. 이야기의 \u003cb class=\"key\">문제\u003c/b>가 시작되는 중요한 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정문(do/does/did)\u003c/span> : 누가(The crayons) + didn't + 하다(get along) : \"사이좋게 지내지 않았어요\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"The crayons, 그 크레용들은. didn't get along, 사이좋게 지내지 않았어요. 이 문장 전체를 해석하면, 그 크레용들은 사이좋게 지내지 않았어요.","hl":"m"},{"n":16,"text":"크레용들이 서로 사이좋게 지내지 못했어요. 이야기의 문제가 시작되는 아주 중요한 문장이에요.","hl":"mn"},{"n":17,"text":"첫 번째, didn't는 지난 일을 아니라고 말할 때 쓰는 말이에요. 두 번째, didn't 뒤에는 동사원형이 와요. 그래서 get along이라고 써요. get along은 사이좋게 지낸다는 뜻의 짝꿍 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 ~였어요\u003c/span>\u003cspan class=\"en\">It \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">항상 시끄러웠어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">always \u003c/span>\u003cspan class=\"tgt\">loud\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상자 안에서\u003c/span>\u003cspan class=\"en\">in the box.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">상자 안은 항상 시끄러웠지요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 상자 안이 늘 \u003cb class=\"key\">시끄러웠다\u003c/b>는 뜻이에요. 크레용들이 얼마나 자주 \u003cb class=\"key\">싸웠는지\u003c/b> 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사 지난 일 말(be동사 과거형)\u003c/span> : 무엇이(It) + 이었다(was) + 어떤 상태(loud) : \"~였어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">더 자세히 알려 주는 말(부사)\u003c/span> : 항상(always) + 시끄러운(loud) : \"항상 시끄러운\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"It was, 그것은 ~였어요. always loud, 항상 시끄러웠어요. in the box, 상자 안에서. 이 문장 전체를 해석하면, 상자 안은 항상 시끄러웠지요.","hl":"m"},{"n":19,"text":"상자 안이 늘 시끄러웠다는 뜻이에요. 크레용들이 얼마나 자주 싸웠는지 알려 주는 문장이에요.","hl":"mn"},{"n":20,"text":"첫 번째, was는 be동사 is의 지난 일 말이에요. 두 번째, always는 항상이라는 뜻으로 loud span class=\"ko\">어느 날,\u003c/span>\u003cspan class=\"en\">One day,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Mike는 들었어요\u003c/span>\u003cspan class=\"en\">Mike \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">heard\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">크레용들이 싸우고 있는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">crayons \u003c/span>\u003cspan class=\"tgt\">fighting\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어느 날, Mike는 크레용들이 싸우고 있는 것을 들었어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 상자 안이 시끄러워서 Mike가 크레용들의 \u003cb class=\"key\">다툼\u003c/b>을 알게 된 거예요. 이야기가 다음 장면으로 넘어가는 부분이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(Mike) + 들었어요(heard) + 무엇을(the crayons fighting) : \"들었어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">'~가 ~하는 것을' 덩어리 표현\u003c/span> : 들었어요(heard) + 크레용들이(the crayons) + 싸우는 것(fighting) : \"크레용들이 싸우고 있는 것을\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"One day, 어느 날. Mike heard, Mike는 들었어요. the crayons fighting, 크레용들이 싸우고 있는 것을. 이 문장 전체를 해석하면, 어느 날, Mike는 크레용들이 싸우고 있는 것을 들었어요.","hl":"m"},{"n":34,"text":"상자 안 크레용들이 시끄럽게 싸우고 있었어요. 그 소리를 Mike가 듣고 알게 된 거예요. 이야기가 다음 장면으로 넘어가는 부분이죠.","hl":"mn"},{"n":35,"text":"먼저 heard는 hear의 과거형이에요. 지난 어느 날 있었던 일이라 이렇게 말해요. 두 번째로 heard 뒤에 크레용들이 싸우는 중이라는 말이 통째로 붙었어요. 이렇게 누가 하는 중이라는 덩어리를 붙이면 ~가 ~하는 것을 들었어요, 라는 뜻이 된답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 꺼냈어요\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">took\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 크레용을\u003c/span>\u003cspan class=\"en\">all the crayons\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상자 밖으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">out \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">box\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 상자에서 모든 크레용을 꺼냈답니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Mike가 싸움을 멈추게 하려고 크레용을 전부 상자 밖으로 꺼낸 거예요. 다음 장면에서 그림을 그리기 시작하는 \u003cb class=\"key\">준비\u003c/b>가 되는 부분이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(He) + 꺼냈어요(took) + 무엇을(all the crayons) : \"꺼냈어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소·시간 짝꿍 말(전치사)\u003c/span> : 밖으로(out of) + 상자(the box) : \"상자 밖으로\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"He took, 그는 꺼냈어요. all the crayons, 모든 크레용을. out of the box, 상자 밖으로. 이 문장 전체를 해석하면, 그는 상자에서 모든 크레용을 꺼냈답니다.","hl":"m"},{"n":37,"text":"Mike가 크레용들의 싸움을 멈추게 하려고 크레용을 전부 상자 밖으로 꺼냈어요. 다음 장면에서 그림을 그릴 준비가 되는 거예요.","hl":"mn"},{"n":38,"text":"먼저 took은 take의 과거형이에요. 규칙대로 -ed를 붙이지 않고 took으로 모습이 바뀌는 동사라서 그대로 외워 두세요. 그리고 out of는 ~밖으로라는 전치사예요. 상자 안에서 바깥으로 나왔다는 장소를 알려 주는 거랍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">커다란 흰 종이 위에,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">On \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">big \u003c/span>\u003cspan class=\"tgt\">white \u003c/span>\u003cspan class=\"tgt\">piece \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">paper\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 먼저 그렸어요\u003c/span>\u003cspan class=\"en\">he \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">first\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">drew\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">회색 도로를.\u003c/span>\u003cspan class=\"en\">a gray road.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 커다란 흰 종이 위에 먼저 회색 도로를 그렸어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 마이크가 커다란 흰 종이에 \u003cb class=\"key\">회색 \u003c/b>\u003cb class=\"key\">도로\u003c/b>를 먼저 그렸다는 말이에요. 그림이 \u003cb class=\"key\">도로\u003c/b>에서부터 시작된다는 걸 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">장소를 알려 주는 짝꿍 말(전치사)\u003c/span> : 어디에(On) + 무엇 위에(a big white piece of paper) : \"커다란 흰 종이 위에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">더 자세히 알려 주는 말(부사)\u003c/span> : 먼저(first) + 그렸어요(drew) : \"먼저\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(he) + 했어요(drew) + 무엇을(a gray road) : \"그렸어요\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"On a big white piece of paper, 커다란 흰 종이 위에. he first drew, 그는 먼저 그렸어요. a gray road, 회색 도로를.. 이 문장 전체를 해석하면, 그는 커다란 흰 종이 위에 먼저 회색 도로를 그렸어요.","hl":"m"},{"n":40,"text":"마이크가 커다란 흰 종이 위에 먼저 회색 도로를 그렸어요. 그림의 첫 시작이 도로였다는 뜻이에요.","hl":"mn"},{"n":41,"text":"먼저 On은 장소를 알려 주는 전치사예요. 종이 위라는 곳을 알려 주죠. 그리고 drew는 draw의 과거형이에요. 지난 일이라 drew로 바뀌었어요. 마지막으로 first는 먼저라고 알려 주는 부사예요. 여러분도 그림을 그릴 때 무엇부터 그릴지 생각해 보세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 도로 위에는,\u003c/span>\u003cspan class=\"en\">On that road,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">있었어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">were\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">검정색 자동차들이\u003c/span>\u003cspan class=\"en\">black cars\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 파란색 버스들이.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and\u003c/span> blue buses.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 도로 위에는 검정색 자동차들과 파란색 버스들이 있었지요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 그 도로 위에 \u003cb class=\"key\">검정색 \u003c/b>\u003cb class=\"key\">자동차\u003c/b>와 \u003cb class=\"key\">파란색 \u003c/b>\u003cb class=\"key\">버스\u003c/b>가 있었다는 말이에요. 그림이 훨씬 \u003cb class=\"key\">생생해졌다\u003c/b>는 뜻이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">거기에 ~이 있었다(there is/are의 과거)\u003c/span> : 거기에(there) + 있었다(were) + 무엇이(black cars and blue buses) : \"있었어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 검정색 자동차들(black cars) + 그리고(and) + 파란색 버스들(blue buses) : \"그리고\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"On that road, 그 도로 위에는. there were, 있었어요. black cars, 검정색 자동차들이. and blue buses, 그리고 파란색 버스들이.. 이 문장 전체를 해석하면, 그 도로 위에는 검정색 자동차들과 파란색 버스들이 있었지요.","hl":"m"},{"n":43,"text":"그 도로 위에 검정색 자동차와 파란색 버스가 있었다는 말이에요. 도로가 생기니까 그림이 훨씬 생생해졌죠.","hl":"mn"},{"n":44,"text":"첫 번째, there were는 거기에 무엇이 있었다고 말할 때 써요. 여러 개이고 지난 일이라 were를 골랐어요. 두 번째, and는 검정색 자동차와 파란색 버스를 이어 주는 접속사예요. 이렇게 색깔을 넣으면 그림이 더 멋져 보여요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">도로를 따라,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Along \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">road\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 건물들을 그렸어요\u003c/span>\u003cspan class=\"en\">he drew buildings\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Red, Green, 그리고 Pink로.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">Red, \u003c/span>\u003cspan class=\"tgt\">Green, \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">Pink\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">도로를 따라 그는 Red, Green, 그리고 Pink로 건물들을 그렸어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 도로를 따라 건물들을 빨강, 초록, 분홍으로 그렸다는 말이에요. 여러 \u003cb class=\"key\">색깔 \u003c/b>\u003cb class=\"key\">크레용\u003c/b>이 \u003cb class=\"key\">함께\u003c/b> 쓰였다는 뜻이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">장소를 알려 주는 짝꿍 말(전치사)\u003c/span> : ~을 따라(Along) + 도로(the road) : \"도로를 따라\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">재료를 알려 주는 짝꿍 말(전치사)\u003c/span> : ~로(with) + Red, Green, and Pink : \"Red, Green, 그리고 Pink로\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"Along the road, 도로를 따라. he drew buildings, 그는 건물들을 그렸어요. with Red, Green, and Pink, Red, Green, 그리고 Pink로.. 이 문장 전체를 해석하면, 도로를 따라 그는 Red, Green, 그리고 Pink로 건물들을 그렸어요.","hl":"m"},{"n":46,"text":"도로를 따라 건물들을 빨강, 초록, 분홍으로 그렸다는 말이에요. 여러 색깔 크레용이 함께 쓰였다는 뜻이죠.","hl":"mn"},{"n":47,"text":"먼저 Along은 ~을 따라라는 전치사예요. 도로를 따라 쭉 그렸다는 느낌이 들죠. 두 번째, with는 ~로, ~을 가지고라는 전치사예요. 어떤 색깔 크레용으로 그렸는지 알려 줘요. 여러분도 좋아하는 색으로 건물을 그려 보면 어떨까요?","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마이크는 또한 추가했다\u003c/span>\u003cspan class=\"en\">Mike also \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">added\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">태양을\u003c/span>\u003cspan class=\"en\">the sun\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하늘에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">sky\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Mike는 하늘에 태양도 추가로 그렸습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 길과 자동차를 그린 뒤, 하늘에 \u003cb class=\"key\">태양\u003c/b>을 더 그린 거예요. 그림이 점점 채워지는 장면이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(Mike) + 했다(added) + 무엇을(the sun) : \"추가했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소 짝꿍 말(전치사)\u003c/span> : 무엇이(the sun) + 어디에(in the sky) : \"하늘에\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"Mike also added, 마이크는 또한 추가했다. the sun, 태양을. in the sky, 하늘에. 이 문장 전체를 해석하면, Mike는 하늘에 태양도 추가로 그렸습니다.","hl":"m"},{"n":49,"text":"앞에서 길과 자동차, 건물을 그렸죠? 이번에는 하늘에 태양을 더 그린 거예요. 마이크가 그림을 하나씩 채워 가는 장면이에요.","hl":"mn"},{"n":50,"text":"첫 번째, added는 지난 일을 말하는 과거형이에요. 두 번째, in the sky처럼 장소를 말할 때는 전치사 in을 써요. 오늘 밖을 보면 the sun in the sky라고 말해 보세요. 아주 쉬워요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">노랑은 중심이었다\u003c/span>\u003cspan class=\"en\">Yellow \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was\u003c/span> the center,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 주황은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and\u003c/span> Orange\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 둘러쌌다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">surrounded\u003c/span> it.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Yellow가 중심이었고 Orange가 그것을 둘러쌌지요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 노랑이 가운데에 있고 주황이 그 둘레를 감싸서, 두 색이 함께 \u003cb class=\"key\">태양\u003c/b>을 만들었어요. 사이좋게 힘을 모은 장면이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사(be동사)\u003c/span> : Yellow + was + the center(중심) : \"중심이었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : Yellow was ~ + and + Orange surrounded ~ : \"그리고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : Orange + surrounded + it(그것을) : \"둘러쌌다\"\u003c/div>\u003c/div>","segs":[{"n":51,"text":"Yellow was the center, 노랑은 중심이었다. and Orange, 그리고 주황은. surrounded it, 그것을 둘러쌌다. 이 문장 전체를 해석하면, Yellow가 중심이었고 Orange가 그것을 둘러쌌지요.","hl":"m"},{"n":52,"text":"노랑이 가운데에 있고 주황이 둘레를 감싸고 있어요. 두 색이 함께 태양을 만든 거예요.","hl":"mn"},{"n":53,"text":"첫 번째, 지난 일이라 be동사 was를 썼어요. 두 번째, and는 두 문장을 이어 주는 접속사예요. 세 번째, surround에 d를 붙여 과거형 surrounded를 만들었어요. 그리고 it은 앞에 나온 태양을 가리키는 대명사예요. 잘 따라 왔어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 15 / 15\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그림이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When\u003c/span> the picture\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">완성되었을 때\u003c/span>\u003cspan class=\"en\">was done,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 크레용들은\u003c/span>\u003cspan class=\"en\">all the crayons\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">행복했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">were\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">happy\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그림이 완성되었을 때, 모든 크레용들은 행복했답니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 그림이 다 완성되자 크레용 모두 \u003cb class=\"key\">행복\u003c/b>해졌어요. 싸우던 크레용들이 화해한 결말이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">때를 알려 주는 말(접속사)\u003c/span> : When + 그림이 완성되었을 때, + 모든 크레용은 행복했다 : \"~할 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be동사(be동사)\u003c/span> : all the crayons(여러 개) + were + happy(행복한) : \"~였다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">보충하는 말(보어)\u003c/span> : 주어 + were + happy : \"행복한\"\u003c/div>\u003c/div>","segs":[{"n":54,"text":"When the picture, 그림이. was done, 완성되었을 때. all the crayons, 모든 크레용들은. were happy, 행복했다. 이 문장 전체를 해석하면, 그림이 완성되었을 때, 모든 크레용들은 행복했답니다.","hl":"m"},{"n":55,"text":"드디어 그림이 완성되었어요. 그때 크레용 모두가 행복해졌어요. 싸우던 친구들이 화해한 멋진 결말이에요.","hl":"mn"},{"n":56,"text":"첫 번째, When은 '~할 때'라고 때를 알려 주는 접속사예요. 두 번째, 주어 all the crayons가 여러 개라서 be동사 were를 썼어요. 세 번째, happy는 행복한 상태를 보충해 주는 보어예요. 이 문장은 꼭 외워 두면 좋아요. 오늘도 정말 잘했어요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">오늘 배운 내용 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>크레용들은 서로 \u003cb class=\"key\">질투\u003c/b>하고 싸웠어요.\u003c/li>\u003cli>Mike는 크레용을 모두 \u003cb class=\"key\">꺼내서\u003c/b> 한 장의 그림을 그렸어요.\u003c/li>\u003cli>Yellow는 가운데, Orange는 둘레를 \u003cb class=\"key\">둘러싸서\u003c/b> 태양이 완성되었어요.\u003c/li>\u003cli>모든 색이 \u003cb class=\"key\">필요\u003c/b>하다는 걸 알고 크레용들은 행복해졌어요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Mike helps the crayons get along by drawing one picture with all of them.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: Mike의 크레용들은 서로 \u003cb class=\"key\">질투\u003c/b>하고 싸웠어요. Mike가 모든 색으로 한 장의 \u003cb class=\"key\">그림\u003c/b>을 그려 주자, 크레용들은 모두 \u003cb class=\"key\">행복\u003c/b>해졌어요.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":57,"text":"오늘 우리는 크레용들이 사이좋아지는 이야기를 읽었어요. 한 가지 색보다 모두 함께일 때 더 멋진 그림이 된다는 것, 기억나죠? 여러분도 친구와 사이좋게 지내면 훨씬 즐거워요. 오늘도 정말 잘했어요, 다음 시간에 또 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
