</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"왓츠 리딩 100A Ch.1 Unit 03 How Do You Feel","audioDir":"reading03_audio","preview":false,"count":54,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.520em\">Ch.1 Unit\u003cbr>03 How Do\u003cbr>You Feel?\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">왓츠 리딩 100A\u003c/div>\u003ch1>Colors and Emotions\u003c/h1>\u003ch2>색과 감정\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">한 줄 요약\u003c/span>\u003cspan>색과 감정 사이에는 관련성이 있어요. \u003cb class=\"key\">따뜻한 \u003c/b>\u003cb class=\"key\">색\u003c/b>과 \u003cb class=\"key\">차가운 \u003c/b>\u003cb class=\"key\">색\u003c/b>은 우리에게 서로 다른 이미지와 감정을 줍니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Colors can make us feel different emotions.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘도 만나서 정말 반가워요. 오늘은 색과 우리 기분에 관한 재미있는 글을 함께 읽어 볼 거예요. 색이 우리 마음을 어떻게 바꾸는지 같이 알아볼까요? 한 줄로 말하면, 색은 우리에게 여러 가지 감정을 준다는 이야기예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">미리 알면 쉬워요\u003c/span>\u003cdiv class=\"lp-box\">우리 주변에는 온갖 색이 있어요. 미술 시간에 쓰는 물감을 떠올려 보세요. 빨강이나 노랑처럼 눈에 확 튀는 색을 \u003cb class=\"key\">따뜻한 \u003c/b>\u003cb class=\"key\">색\u003c/b>(warm colors)이라고 해요. 파랑이나 초록처럼 차분한 색은 \u003cb class=\"key\">차가운 \u003c/b>\u003cb class=\"key\">색\u003c/b>(cool colors)이라고 하지요. 이런 색은 우리 기분, 즉 \u003cb class=\"key\">감정\u003c/b>에도 영향을 줘요.\u003c/div>","segs":[{"n":2,"text":"우리 주변에는 정말 많은 색이 있죠. 미술 시간에 쓰는 물감을 떠올려 보세요. 빨강이나 노랑처럼 눈에 확 튀는 색을 따뜻한 색, warm colors라고 해요. 파랑이나 초록처럼 차분한 색은 차가운 색, cool colors라고 하지요. 여러분은 어떤 색을 보면 기분이 좋아지나요? 그런 색이 우리 감정에도 영향을 준답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>색과 감정의 연결\u003csmall>소개 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>글은 색과 \u003cb class=\"key\">감정\u003c/b> 사이에 관련성이 있다고 말해요. 색은 우리를 행복하거나 슬프게 하고, 배고프거나 편안하게도 만들어요. \u003cb class=\"key\">make\u003c/b>는 '~하게 만들다'라는 뜻으로 feel 같은 동사 앞에 와요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>색이 다르면 감정도 달라요\u003csmall>이유 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>색의 \u003cb class=\"key\">선명함\u003c/b>, 음영, 색조가 다르면 우리는 다른 감정을 느껴요. 그래서 \u003cb class=\"key\">따뜻한 \u003c/b>\u003cb class=\"key\">색\u003c/b>과 \u003cb class=\"key\">차가운 \u003c/b>\u003cb class=\"key\">색\u003c/b>은 서로 다른 이미지와 느낌을 준다고 해요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>따뜻한 색의 두 얼굴\u003csmall>예시 · 문장 6–9\u003c/small>\u003c/h4>\u003cp>빨강, 주황, 노랑은 \u003cb class=\"key\">따뜻한 \u003c/b>\u003cb class=\"key\">색\u003c/b>이에요. 이 색들은 \u003cb class=\"key\">행복\u003c/b>과 활기를 주지만, 동시에 \u003cb class=\"key\">주의\u003c/b>를 끌 수도 있어요. 멈춤 표지판과 경고 신호를 떠올려 보세요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>차가운 색의 두 얼굴\u003csmall>예시 · 문장 10–14\u003c/small>\u003c/h4>\u003cp>초록, 파랑, 보라는 \u003cb class=\"key\">차가운 \u003c/b>\u003cb class=\"key\">색\u003c/b>이에요. 숲이나 심해를 상상하면 마음에 \u003cb class=\"key\">편안함\u003c/b>이 생기죠. 하지만 이 색들은 \u003cb class=\"key\">슬픔\u003c/b>을 나타내기도 해서, 사람들은 슬플 때 blue라고 말해요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 이제 글의 흐름을 처음부터 차례대로 따라가 볼까요?","hl":null},{"n":4,"text":"글은 먼저 색과 감정 사이에 관련성이 있다고 말해요. 색은 우리가 행복하거나 슬프게 느끼도록 만들 수 있어요. 그리고 배고프거나 편안하게도 만들 수 있다고 하죠. 여기서 make는 우리말로 '하게 만들다'라는 뜻이에요.","hl":"f0"},{"n":5,"text":"다음에는 왜 그런지 알려 줘요. 색의 선명함, 음영, 색조가 다르면 사람들은 다른 감정을 느낀대요. 그래서 따뜻한 색과 차가운 색은 우리에게 다른 이미지와 느낌을 줘요.","hl":"f1"},{"n":6,"text":"이제 예를 들어 볼까요? 빨강, 주황, 노랑은 따뜻한 색이에요. 이 색들은 우리에게 행복과 활기를 줘요. 하지만 주의를 끌 수도 있어서 멈춤 표지판이나 경고 신호에 많이 쓰인답니다.","hl":"f2"},{"n":7,"text":"마지막으로 차가운 색이에요. 초록, 파랑, 보라는 차가운 색이지요. 숲이나 깊은 바다를 상상해 보면 마음이 편안함을 느껴요. 그런데 이 색들은 슬픔을 나타내기도 해서, 사람들은 기분이 슬플 때 blue라는 단어를 쓴답니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">설명하기(색과 감정이 어떻게 이어지는지 알려 주는 글)\u003c/span>\u003cspan class=\"lp-pill\">처음\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">\u003cb class=\"key\">중심 \u003c/b>\u003cb class=\"key\">문장\u003c/b>이 맨 처음에 나오고, 그 뒤에 왜 그런지와 예를 차례로 보여 줘요. 따뜻한 색과 차가운 색을 \u003cb class=\"key\">대조\u003c/b>해서 설명하기 때문이에요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>For example (5)\u003c/b>\u003cspan>예를 들기 시작한다고 알려 줌\u003c/span>\u003cb>However (8)\u003c/b>\u003cspan>앞 내용과 반대되는 내용을 알려 줌\u003c/span>\u003cb>Think of (9)\u003c/b>\u003cspan>떠올려 보라고 예를 제시함\u003c/span>\u003cb>But (13)\u003c/b>\u003cspan>앞 내용과 다른 점을 알려 줌\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">colors\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">warm colors\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">cool colors\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Red, orange, and yellow\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Green, blue, and purple\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>따뜻한 색\u003c/th>\u003cth>차가운 색\u003c/th>\u003c/tr>\u003ctr>\u003ctd>행복과 활기를 줘요\u003c/td>\u003ctd>편안함을 줘요\u003c/td>\u003c/tr>\u003ctr>\u003ctd>주의를 끌어요\u003c/td>\u003ctd>슬픔을 나타내요\u003c/td>\u003c/tr>\u003ctr>\u003ctd>빨강, 주황, 노랑\u003c/td>\u003ctd>초록, 파랑, 보라\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 설명하는 글이에요. 어떤 것이 어떻게 이어지는지 차근차근 알려 주는 글이죠. 중심 문장은 맨 처음에 나와요. 그리고 따뜻한 색과 차가운 색을 대조하면서 설명해요.","hl":"ty"},{"n":9,"text":"글의 길잡이 말도 찾아볼까요? For example이 나오면 예를 들기 시작한다는 뜻이에요. However나 But이 나오면 앞 내용과 반대되는 이야기가 나온다는 신호이고요. 같은 대상을 다르게 부르는 표현도 있어요. colors가 warm colors와 cool colors로 나뉘고, 다시 Red, orange, and yellow나 Green, blue, and purple 같은 구체적인 색 이름으로 불린답니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 단어\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>link\u003c/b>\u003cem>명사\u003c/em>\u003cspan>관련성\u003c/span>\u003c/div>\u003cdiv>\u003cb>between\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~사이에\u003c/span>\u003c/div>\u003cdiv>\u003cb>emotion\u003c/b>\u003cem>명사\u003c/em>\u003cspan>감정\u003c/span>\u003c/div>\u003cdiv>\u003cb>make\u003c/b>\u003cem>동사\u003c/em>\u003cspan>~하게 만들다\u003c/span>\u003c/div>\u003cdiv>\u003cb>feel\u003c/b>\u003cem>동사\u003c/em>\u003cspan>느끼다\u003c/span>\u003c/div>\u003cdiv>\u003cb>hungry\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>배고픈\u003c/span>\u003c/div>\u003cdiv>\u003cb>relaxed\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>편안한\u003c/span>\u003c/div>\u003cdiv>\u003cb>brightness\u003c/b>\u003cem>명사\u003c/em>\u003cspan>선명함\u003c/span>\u003c/div>\u003cdiv>\u003cb>shade\u003c/b>\u003cem>명사\u003c/em>\u003cspan>음영\u003c/span>\u003c/div>\u003cdiv>\u003cb>tone\u003c/b>\u003cem>명사\u003c/em>\u003cspan>색조\u003c/span>\u003c/div>\u003cdiv>\u003cb>different\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>다른\u003c/span>\u003c/div>\u003cdiv>\u003cb>cause\u003c/b>\u003cem>동사\u003c/em>\u003cspan>일으키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>for example\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>예를 들어\u003c/span>\u003c/div>\u003cdiv>\u003cb>warm\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>따뜻한\u003c/span>\u003c/div>\u003cdiv>\u003cb>energy\u003c/b>\u003cem>명사\u003c/em>\u003cspan>활기\u003c/span>\u003c/div>\u003cdiv>\u003cb>grab\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(주의를) 끌다\u003c/span>\u003c/div>\u003cdiv>\u003cb>warning\u003c/b>\u003cem>명사\u003c/em>\u003cspan>경고\u003c/span>\u003c/div>\u003cdiv>\u003cb>imagine\u003c/b>\u003cem>동사\u003c/em>\u003cspan>상상하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>calming\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>진정시키는\u003c/span>\u003c/div>\u003cdiv>\u003cb>sadness\u003c/b>\u003cem>명사\u003c/em>\u003cspan>슬픔\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"오늘의 단어도 소리 내어 읽어 볼까요? link는 관련성, emotion은 감정이라는 뜻이에요. brightness는 선명함, shade는 음영, tone은 색조라고 해요. grab attention은 주의를 끌다, calming은 진정시키는이라는 뜻이에요. 크게 따라 읽어 보세요!","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">emotion\u003c/b>\u003cspan class=\"m\">감정\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">feeling\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">happy\u003c/b>\u003cspan class=\"m\">행복한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">glad\u003c/span>\u003cspan class=\"s\">joyful\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">sad\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">different\u003c/b>\u003cspan class=\"m\">다른\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">other\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">same\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">warm\u003c/b>\u003cspan class=\"m\">따뜻한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">hot\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">cool\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">sad\u003c/b>\u003cspan class=\"m\">슬픈\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">unhappy\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">happy\u003c/span>\u003cspan class=\"a\">glad\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"비슷한 말과 반대말도 정리해 봐요. emotion은 feeling과 비슷해요. happy는 glad나 joyful와 비슷하고, 반대말은 sad예요. different는 other와 비슷하고 반대말은 same이에요. warm의 반대말은 cool이고, sad의 반대말은 happy랍니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 14\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">있어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">is\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">관련성이\u003c/span>\u003cspan class=\"en\">a link\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">색들 사이에\u003c/span>\u003cspan class=\"en\">between colors\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 감정들 사이에\u003c/span>\u003cspan class=\"en\">and emotions.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">색과 감정 사이에는 관련성이 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 글의 첫 문장으로, 색과 감정이 서로 이어져 있다는 \u003cb class=\"key\">주제\u003c/b>를 알려 줘요. 앞으로 나오는 이야기는 모두 이 \u003cb class=\"key\">관련성\u003c/b>을 설명한답니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">있음을 말하는 말(There is/are)\u003c/span> : 무엇이(단수) + 있어요 → There is + 무엇 : \"~이 있어요\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"There is, 있어요. a link, 관련성이. between colors, 색들 사이에. and emotions, 그리고 감정들 사이에. 이 문장 전체를 해석하면, 색과 감정 사이에는 관련성이 있습니다.","hl":"m"},{"n":13,"text":"이 문장은 글의 첫 문장이에요. 색과 감정이 서로 이어져 있다는 주제를 알려 주죠. 그래서 앞으로 나오는 내용은 모두 이 관련성을 설명한답니다.","hl":"mn"},{"n":14,"text":"첫째, There is는 '무엇이 있어요'라고 말할 때 쓰는 표현이에요. 둘째, 뒤에 오는 것이 한 개면 is, 여러 개면 are를 써요. 셋째, between은 '사이에'라는 뜻이라서 색과 감정 사이를 이어 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 14\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">색은 할 수 있어요\u003c/span>\u003cspan class=\"en\">Colors \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리를 느끼게 만들다\u003c/span>\u003cspan class=\"en\">make us feel\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">행복하거나 슬프게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">happy \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">sad\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">색은 우리가 행복하거나 슬프게 느끼도록 만들 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 색이 우리 \u003cb class=\"key\">기분\u003c/b>을 움직일 수 있다는 것을 구체적인 예로 보여 줘요. 행복과 슬픔, 반대되는 감정을 함께 들어서 이해하기 쉬워요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">할 수 있다고 말하는 도와주는 동사(조동사 can)\u003c/span> : 누가(Colors) + 할 수 있어요(can) + 하다(make) : \"~할 수 있어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사 or)\u003c/span> : A(happy) + 또는(or) + B(sad) : \"행복하거나 슬프게\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Colors can, 색은 할 수 있어요. make us feel, 우리를 느끼게 만들다. happy or sad, 행복하거나 슬프게. 이 문장 전체를 해석하면, 색은 우리가 행복하거나 슬프게 느끼도록 만들 수 있습니다.","hl":"m"},{"n":16,"text":"색은 우리 기분을 움직일 수 있어요. 우리를 행복하거나 슬프게 만들 수 있다는 뜻이죠.","hl":"mn"},{"n":17,"text":"첫째, can은 '할 수 있어요'라고 도와주는 동사예요. 그래서 뒤에는 동사원형 make를 그대로 써요. 둘째, or는 '또는'이라고 두 가지를 이어 주는 말이에요. 그래서 happy or sad는 행복하거나 슬프다는 뜻이 된답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들은 또한 할 수 있어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">They\u003c/span> can \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">also\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리를 느끼게 만들다\u003c/span>\u003cspan class=\"en\">make us feel\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">배고프거나 편안하게\u003c/span>\u003cspan class=\"en\">hungry or relaxed.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것들은 또한 우리가 배고픔이나 편안함을 느끼도록 만들 수도 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에 \u003cb class=\"key\">also\u003c/b>를 붙여서 색이 만드는 느낌이 더 있다는 것을 알려 줘요. \u003cb class=\"key\">배고픔\u003c/b>처럼 몸의 느낌도 감정처럼 다룬다는 점이 재미있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">앞의 것을 대신하는 말(대명사)\u003c/span> : 복수 명사(Colors) → They : \"그것들은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">더 자세히 알려 주는 말(부사)\u003c/span> : 누가(They) + can + also + 하다(make) : \"또한\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"They can also, 그것들은 또한 할 수 있어요. make us feel, 우리를 느끼게 만들다. hungry or relaxed, 배고프거나 편안하게. 이 문장 전체를 해석하면, 그것들은 또한 우리가 배고픔이나 편안함을 느끼도록 만들 수도 있어요.","hl":"m"},{"n":19,"text":"이 문장은 앞 문장에 '또한'을 붙여서, 색이 우리를 배고프게도 편안하게도 만들 수 있다고 말해요.","hl":"mn"},{"n":20,"text":"첫째, They는 앞에 나온 colors를 대신하는 말이에요. 여러 개라서 They를 써요. 둘째, also는 '또한'이라는 뜻으로 앞 내용에 하나를 더 보태는 말이에요. 그래서 can과 make 사이에 쏙 들어갔답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">색의 선명함이,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When\u003c/span> a color's brightness,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">음영, 또는 색조가\u003c/span>\u003cspan class=\"en\">shade, or tone\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다를 때,\u003c/span>\u003cspan class=\"en\">is different,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이는 다른 감정을 일으키지요.\u003c/span>\u003cspan class=\"en\">this \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">causes\u003c/span> different emotions.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">색의 선명함, 음영, 색조가 다를 때, 이는 다른 감정을 일으키지요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 색의 밝기나 음영, 색조가 달라지면 우리가 느끼는 \u003cb class=\"key\">감정\u003c/b>도 달라진다는 것을 말해요. \u003cb class=\"key\">색\u003c/b>과 감정이 서로 이어져 있다는 중심 생각을 자세히 풀어 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : ~할 때(When) + 무엇이(주어) + 다르면(is different) : \"~할 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">한 사람·한 개일 때 동사 + s(3인칭 단수)\u003c/span> : 이것(this) + 일으킨다(causes) + 다른 감정을(different emotions) : \"일으키지요\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"When a color's brightness, 색의 선명함이. shade, or tone, 음영, 또는 색조가. is different, 다를 때. this causes different emotions, 이는 다른 감정을 일으키지요.. 이 문장 전체를 해석하면, 색의 선명함, 음영, 색조가 다를 때, 이는 다른 감정을 일으키지요.","hl":"m"},{"n":22,"text":"색의 밝기나 음영, 색조가 달라지면 우리가 느끼는 감정도 달라진다는 뜻이에요. 색과 감정이 서로 이어져 있다는 걸 알려 주는 문장이죠.","hl":"mn"},{"n":23,"text":"첫 번째, When은 ~할 때라고 때를 알려 주는 이어 주는 말이에요. 두 번째, this는 이것 하나를 가리키니까 동사에 s를 붙여서 causes라고 해요. s 하나가 큰 차이를 만든다는 것, 꼭 기억해요!","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들어,\u003c/span>\u003cspan class=\"en\">For example,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">따뜻한 색과 차가운 색은\u003c/span>\u003cspan class=\"en\">warm colors \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">and\u003c/span> cool colors\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리에게 주지요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">give\u003c/span> us\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 이미지와 감정을\u003c/span>\u003cspan class=\"en\">different images and feelings.\u003c/span>\u003c/d k\">1\u003c/span>\u003cspan class=\"gn\">현재형(일반동사 현재형)\u003c/span> : 그 색들은(Those colors) + 자주(often) + 준다(give) : \"자주 주지요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 행복(happiness) + 그리고(and) + 활기(energy) : \"행복과 활기\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Those colors, 그 색들은. often give feelings, 자주 감정을 주지요. of happiness and energy, 행복과 활기의. 이 문장 전체를 해석하면, 이 색들은 보통 행복과 활기의 감정을 주지요.","hl":"m"},{"n":31,"text":"이 문장은 따뜻한 색들이 보통 행복과 활기 같은 좋은 감정을 준다는 뜻이에요. 앞 문장의 warm colors를 Those colors로 다시 받아서 이어 설명하고 있죠.","hl":"mn"},{"n":32,"text":"먼저 첫 번째, 보통 그렇다는 사실을 말할 때는 동사를 현재형 그대로 써요. 그래서 give라고 했어요. 두 번째, 주어가 여러 개라서 give에 s를 붙이지 않았어요. 세 번째, 행복과 활기처럼 두 가지를 나란히 말할 때는 and로 이어 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">However,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들은 또한 ~할 수 있어요\u003c/span>\u003cspan class=\"en\">they \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">also \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">주의를 끌어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">grab\u003c/span> attention.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 그것들은 주의를 끌 수도 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 따뜻한 색이 행복과 활기를 준다고 했는데, 반대로 \u003cb class=\"key\">주의\u003c/b>를 끄는 힘도 있다는 걸 알려 주는 문장이에요. 그래서 However로 \u003cb class=\"key\">반대\u003c/b> 이야기를 시작해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 앞 내용 + 하지만(However) + 반대 내용 : \"하지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">도와주는 동사(조동사 can)\u003c/span> : 그것들은(they) + 할 수 있다(can) + 또한(also) + 끈다(grab) : \"또한 끌 수 있어요\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"However, 하지만. they can also, 그것들은 또한 ~할 수 있어요. grab attention, 주의를 끌어요. 이 문장 전체를 해석하면, 하지만 그것들은 주의를 끌 수도 있어요.","hl":"m"},{"n":34,"text":"앞에서 따뜻한 색이 행복과 활기를 준다고 했죠. 그런데 이 문장은 반대로 주의를 끄는 힘도 있다고 말해요. 그래서 However로 반대 이야기를 시작해요.","hl":"mn"},{"n":35,"text":"첫 번째, However는 하지만이라는 뜻으로 앞 내용과 반대되는 이야기를 이어 줘요. 두 번째, can은 조동사, 그러니까 동사를 도와주는 말이에요. can 뒤에는 동사원형이 와서 grab이라고 써요. 세 번째, also가 들어가서 또한이라는 뜻이 더해졌어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">생각해 보세요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Think \u003c/span>\u003cspan class=\"tgt\">of\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">멈춤 표지판을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">stop \u003c/span>\u003cspan class=\"tgt\">signs \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 경고 신호를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">warning \u003c/span>\u003cspan class=\"tgt\">signs\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">멈춤 표지판과 경고 신호[위험 신호]를 생각해보세요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 따뜻한 색이 주의를 끈다는 걸 \u003cb class=\"key\">멈춤 \u003c/b>\u003cb class=\"key\">표지판\u003c/b>과 \u003cb class=\"key\">경고 \u003c/b>\u003cb class=\"key\">신호\u003c/b> 같은 익숙한 \u003cb class=\"key\">예\u003c/b>로 보여 주는 문장이에요. 어려운 설명을 우리 주변의 예로 풀어 주는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시키는 말(명령문)\u003c/span> : 생각해라(Think) + ~을(of) : \"생각해 보세요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 멈춤 표지판(stop signs) + 그리고(and) + 경고 신호(warning signs) : \"멈춤 표지판과 경고 신호\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Think of, 생각해 보세요. stop signs, 멈춤 표지판을. and warning signs, 그리고 경고 신호를. 이 문장 전체를 해석하면, 멈춤 표지판과 경고 신호[위험 신호]를 생각해보세요.","hl":"m"},{"n":37,"text":"따뜻한 색이 주의를 끈다는 걸 멈춤 표지판과 경고 신호 같은 익숙한 예로 보여 주는 문장이에요. 우리 주변에서 바로 떠올릴 수 있는 예라서 이해가 쉬워요.","hl":"mn"},{"n":38,"text":"첫 번째, 누군가에게 무엇을 하라고 시킬 때는 동사원형으로 문장을 시작해요. 이걸 명령문이라고 해요. 두 번째, 멈춤 표지판과 경고 신호처럼 두 가지를 나란히 이을 때는 and를 써요. 세 번째, Think of는 하나로 묶어서 '떠올려 보세요'라고 기억하면 좋아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">초록색, 파랑색, 보라색은\u003c/span>\u003cspan class=\"en\">Green, blue, \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">and\u003c/span> purple\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">차가운 색입니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are\u003c/span> cool colors.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">초록색, 파랑색, 보라색은 차가운 색입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 차가운 색에는 초록색, 파랑색, 보라색이 있다고 \u003cb class=\"key\">소개\u003c/b>하는 문장이에요. 앞에서 말한 \u003cb class=\"key\">차가운 \u003c/b>\u003cb class=\"key\">색\u003c/b>의 예를 하나하나 알려 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : A(Green) + 그리고(and) + B(blue) + and + C(purple) : \"그리고, ~와\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">am·are·is 친구들(be동사)\u003c/span> : 여러 색(Green, blue, and purple) + 이다(are) + cool colors : \"~입니다\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"Green, blue, and purple, 초록색, 파랑색, 보라색은. are cool colors, 차가운 색입니다. 이 문장 전체를 해석하면, 초록색, 파랑색, 보라색은 차가운 색입니다.","hl":"m"},{"n":40,"text":"이 문장은 차가운 색이 무엇인지 알려 줘요. 초록색, 파랑색, 보라색을 차가운 색이라고 소개하는 거예요.","hl":"mn"},{"n":41,"text":"먼저 be동사를 봐요. 색이 여러 개라서 여러 개에 쓰는 are를 썼어요. 그리고 이어 주는 말 and로 초록색, 파랑색, 보라색을 차례대로 연결했답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상상해 보세요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Imagine\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">숲을\u003c/span>\u003cspan class=\"en\">a f\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">or\u003c/span>est\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또는 심해를\u003c/span>\u003cspan class=\"en\">or deep sea.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">숲이나 심해를 상상해보세요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 차가운 색을 \u003cb class=\"key\">숲\u003c/b>이나 \u003cb class=\"key\">심해\u003c/b>와 연결해 떠올려 보라고 말해요. 실제로 그런 곳을 생각하면 색의 느낌이 잘 보여요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시키는 말(명령문)\u003c/span> : 동사원형(Imagine) + 무엇을(a forest) : \"상상해 보세요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : A(a forest) + 또는(or) + B(deep sea) : \"또는\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"Imagine, 상상해 보세요. a forest, 숲을. or deep sea, 또는 심해를. 이 문장 전체를 해석하면, 숲이나 심해를 상상해보세요.","hl":"m"},{"n":43,"text":"차가운 색을 떠올릴 때 숲이나 심해를 생각해 보라고 해요. 그런 곳을 떠올리면 시원하고 차분한 느낌이 들죠.","hl":"mn"},{"n":44,"text":"첫 번째로 명령문을 봐요. 동사원형 Imagine을 맨 앞에 두면 상상해 보세요라는 뜻이 돼요. 두 번째로 이어 주는 말 or는 숲과 심해 중 하나를 골라 보라고 이어 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 색들은\u003c/span>\u003cspan class=\"en\">Those colors\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보통\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">usually\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마음을 진정시키는 거예요\u003c/span>\u003cspan class=\"en\">calming.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 색들은 보통 (마음을) 진정시킵니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 차가운 색은 보통 사람 마음을 차분하게 만들어 줘요. 그래서 \u003cb class=\"key\">차분한 \u003c/b>\u003cb class=\"key\">느낌\u003c/b>을 말할 때 이 색들을 떠올려요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">am·are·is 친구들(be동사)\u003c/span> : 그 색들은(Those colors) + 이다(are) + calming : \"~이에요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">더 자세히 알려 주는 말(부사)\u003c/span> : 보통(usually) + 형용사(calming) : \"보통\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"Those colors, 그 색들은. are usually, 보통. calming, 마음을 진정시키는 거예요. 이 문장 전체를 해석하면, 그 색들은 보통 (마음을) 진정시킵니다.","hl":"m"},{"n":46,"text":"차가운 색은 보통 사람 마음을 차분하게 만들어 줘요. 그래서 차분한 느낌을 말할 때 이 색들을 떠올리면 좋아요.","hl":"mn"},{"n":47,"text":"먼저 be동사 are는 여러 색을 가리키니까 썼어요. 두 번째로 usually는 보통이라는 뜻으로 더 자세히 알려 주는 말이에요. 그래서 그 색들은 보통 마음을 진정시킨다는 뜻이 완성돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 그것들은 ~할 수 있어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">But\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">they\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또한 슬픔을 나타내는 것도요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">also \u003c/span>\u003cspan class=\"tgt\">show\u003c/span> sadness.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 그것들은 슬픔을 나타낼 수도 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 차가운 색이 \u003cb class=\"key\">슬픔\u003c/b>을 보여 줄 수도 있다는 말이에요. 앞에서 \u003cb class=\"key\">차분하다\u003c/b>고 한 것과 반대되는 느낌도 있다는 걸 알려 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 앞 내용 + 하지만(But) + 뒤 내용 : \"하지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">대신하는 말(대명사)\u003c/span> : cool colors → they(그것들) : \"그것들은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">도와주는 동사(조동사)\u003c/span> : 주어(they) + can + 동사원형(show) : \"또한 ~을 나타낼 수 있어요\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"But they can, 하지만 그것들은 ~할 수 있어요. also show sadness, 또한 슬픔을 나타내는 것도요. 이 문장 전체를 해석하면, 하지만 그것들은 슬픔을 나타낼 수도 있어요.","hl":"m"},{"n":49,"text":"이 문장은 차가운 색이 슬픔을 나타낼 수도 있다고 말해요. 바로 앞에서 차분하다고 했는데, 그와 반대로 슬픈 느낌도 준다는 거예요.","hl":"mn"},{"n":50,"text":"먼저 But은 하지만이라는 뜻으로 앞말과 뒤말을 이어 줘요. 그리고 they는 앞에 나온 cool colors를 대신하는 말이에요. 마지막으로 can also show에서 can은 도와주는 동사, 조동사예요. 조동사 뒤에는 꼭 동사원형이 온다는 것, 꼭 기억해요!","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들은 사용해요\u003c/span>\u003cspan class=\"en\">People use\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">'blue'라는 단어를\u003c/span>\u003cspan class=\"en\">the word &quot;blue&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">말하기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">say\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 슬프다고\u003c/span>\u003cspan class=\"en\">that \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">sad\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사람들은 그들이 슬프다고 말하기 위해 'blue'라는 단어를 사용한답니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사람들이 슬픈 기분을 말할 때 'blue'라는 \u003cb class=\"key\">단어\u003c/b>를 쓴다는 뜻이에요. 그래서 blue는 '\u003cb class=\"key\">슬프다\u003c/b>'는 느낌까지 가지고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to + 동사원형(to부정사)\u003c/span> : to + 동사원형(say) = ~하기 위해 : \"말하기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">am·are·is 친구들(be동사)\u003c/span> : 그들은(they) + 이다(are) + 슬픈(sad) : \"그들이 슬프다\"\u003c/div>\u003c/div>","segs":[{"n":51,"text":"People use, 사람들은 사용해요. the word \"blue\", 'blue'라는 단어를. to say, 말하기 위해. that they are sad, 그들이 슬프다고. 이 문장 전체를 해석하면, 사람들은 그들이 슬프다고 말하기 위해 'blue'라는 단어를 사용한답니다.","hl":"m"},{"n":52,"text":"이 문장은 사람들이 슬픈 기분을 말할 때 blue라는 단어를 쓴다는 뜻이에요. 그래서 영어에서 blue는 그냥 색깔만이 아니라 슬프다는 느낌도 담고 있답니다.","hl":"mn"},{"n":53,"text":"먼저 to say를 봐요. to 다음에 동사원형 say가 와서 '말하기 위해'라는 뜻을 만들어요. 이런 모양을 to부정사라고 불러요. 그리고 that they are sad는 '그들이 슬프다고'라는 덩어리예요. 여기서 are는 주어 they와 짝이 되는 be동사예요. 오늘 배운 문장들을 꼭 소리 내어 다시 읽어 보세요!","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">오늘 배운 내용 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>색과 \u003cb class=\"key\">감정\u003c/b>은 서로 관련이 있어요.\u003c/li>\u003cli>색의 \u003cb class=\"key\">선명함\u003c/b>이 다르면 생기는 감정도 달라져요.\u003c/li>\u003cli>\u003cb class=\"key\">따뜻한 \u003c/b>\u003cb class=\"key\">색\u003c/b>은 행복과 활기를 주고, \u003cb class=\"key\">차가운 \u003c/b>\u003cb class=\"key\">색\u003c/b>은 편안함을 줘요.\u003c/li>\u003cli>하지만 따뜻한 색은 주의를 끌고, 차가운 색은 슬픔을 나타내기도 해요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Colors can make us feel different emotions.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">색과 감정 사이에는 관련성이 있어요. \u003cb class=\"key\">따뜻한 \u003c/b>\u003cb class=\"key\">색\u003c/b>과 \u003cb class=\"key\">차가운 \u003c/b>\u003cb class=\"key\">색\u003c/b>은 우리에게 서로 다른 이미지와 감정을 줍니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":54,"text":"오늘은 색과 감정에 관한 글을 읽었어요. 따뜻한 색은 행복과 활기를, 차가운 색은 편안함을 준다는 것, 꼭 기억해 두세요. 여러분 모두 끝까지 아주 잘 따라왔어요. 다음 시간에도 신나는 이야기로 만나요. 정말 잘했어요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
