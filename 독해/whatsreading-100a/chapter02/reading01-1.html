</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"왓츠 리딩 100A Ch.2 Unit 01-01 Friends on the Other Side","audioDir":"reading01-1_audio","preview":false,"count":66,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.400em\">Ch.2 Unit\u003cbr>01-01 Friends on\u003cbr>the Other Side\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">왓츠 리딩 100A\u003c/div>\u003ch1>Friends on the Other Side of the Planet\u003c/h1>\u003ch2>지구 반대쪽의 친구들\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">한 줄 요약\u003c/span>\u003cspan>요약: 지구 반대쪽에 사는 피터와 아룬이 서로 사는 곳을 소개해요. \u003cb class=\"key\">높은 \u003c/b>\u003cb class=\"key\">건물\u003c/b>이 많은 도시에 사는 피터와 \u003cb class=\"key\">강과 \u003c/b>\u003cb class=\"key\">나무\u003c/b>가 있는 마을에 사는 아룬은 둘 다 나무 오르기를 좋아해요.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Two friends on opposite sides of the planet introduce their homes and find they both like climbing trees.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘도 만나서 반가워요. 오늘은 지구 반대쪽에 사는 두 친구가 나누는 대화를 읽어 볼 거예요. 아침인 친구와 저녁인 친구가 서로 사는 곳을 소개한대요. 함께 시작해 볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">미리 알면 쉬워요\u003c/span>\u003cdiv class=\"lp-box\">지구는 둥글어서 우리가 아침일 때 \u003cb class=\"key\">반대쪽\u003c/b>은 저녁이에요. 이렇게 서로 시간이 다른 것을 \u003cb class=\"key\">시차\u003c/b>라고 해요. 지구 반대쪽은 영어로 the other side of the planet이라고 해요. 어떤 친구는 높은 빌딩이 많은 도시에 살고, 어떤 친구는 강과 나무가 있는 조그만 마을에 살아요. 우리 반 친구들도 사는 동네가 다 다르죠? 마치 게임에서 서로 다른 맵에서 노는 것과 같아요.\u003c/div>","segs":[{"n":2,"text":"지구는 둥글어서 우리가 아침일 때 반대쪽은 저녁이에요. 이렇게 시간이 다른 것을 시차라고 해요. 여러분은 지구 반대쪽에 사는 친구와 이야기해 본 적 있나요? 그곳을 영어로 the other side of the planet이라고 해요. 어떤 친구는 빌딩이 많은 도시에 살고, 어떤 친구는 강과 나무가 있는 마을에 살아요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>피터의 인사\u003csmall>시작 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>피터가 \u003cb class=\"key\">좋은 \u003c/b>\u003cb class=\"key\">아침\u003c/b>이라고 인사해요. 자기 \u003cb class=\"key\">이름\u003c/b>을 말하고 상대에게 \u003cb class=\"key\">누구\u003c/b>인지 물어봐요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>아룬의 소개\u003csmall>소개 · 문장 4–6\u003c/small>\u003c/h4>\u003cp>아룬이 \u003cb class=\"key\">안녕\u003c/b>이라고 답하고 자기 이름을 말해요. 아룬 쪽은 지금 \u003cb class=\"key\">저녁\u003c/b>이라서 막 \u003cb class=\"key\">저녁을 \u003c/b>\u003cb class=\"key\">먹었\u003c/b>다고 해요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>두 곳의 풍경\u003csmall>비교 · 문장 7–13\u003c/small>\u003c/h4>\u003cp>피터는 아룬이 \u003cb class=\"key\">지구 \u003c/b>\u003cb class=\"key\">반대쪽\u003c/b>에 있다는 걸 알고 놀라요. 피터네는 \u003cb class=\"key\">높은 \u003c/b>\u003cb class=\"key\">건물\u003c/b>이 많지만, 아룬네 \u003cb class=\"key\">마을\u003c/b>에는 건물이 많지 않아요. 대신 강이 흐르고 강을 따라 나무가 많아서 아룬은 가끔 나무에 올라가요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>같은 점과 집\u003csmall>마무리 · 문장 14–18\u003c/small>\u003c/h4>\u003cp>피터는 아룬의 이야기를 \u003cb class=\"key\">놀랍다\u003c/b>고 해요. 피터도 나무 오르기를 좋아하고 \u003cb class=\"key\">나무집\u003c/b>이 있다고 말해요. 아룬이 나무집에서 사는지 묻자, 피터는 가족과 함께 \u003cb class=\"key\">벽돌 \u003c/b>\u003cb class=\"key\">건물\u003c/b>에서 산다고 답해요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 두 친구의 대화를 네 단계로 나누어 살펴볼게요.","hl":null},{"n":4,"text":"먼저 피터가 좋은 아침이라고 인사해요. 그리고 자기 이름이 피터라고 말하고, 너는 누구니 하고 물어봐요. 첫 번째 문장부터 세 번째 문장까지는 피터의 인사와 질문이에요.","hl":"f0"},{"n":5,"text":"그다음 아룬이 안녕이라고 답하고 자기 이름을 말해요. 아룬 쪽은 지금 저녁이라서 막 저녁을 먹었다고 해요. 같은 순간인데 한쪽은 아침, 한쪽은 저녁이라니 정말 신기하죠?","hl":"f1"},{"n":6,"text":"피터는 아룬이 지구 반대쪽에 있다는 걸 알고 놀라요. 피터네 동네에는 높은 건물이 많다고 말하고, 그곳은 어떠냐고 물어요. 아룬은 자기 마을에는 건물이 많지 않지만 강이 흐르고 강을 따라 나무가 많다고 말해요. 그래서 아룬은 가끔 재미로 나무에 올라간대요.","hl":"f2"},{"n":7,"text":"피터는 아룬의 이야기를 듣고 놀랍다고 해요. 그리고 자기도 나무 오르기를 좋아하고 나무집이 있다고 자랑하지요. 아룬이 나무집에서 사는지 묻자, 피터는 아니라고 하면서 가족과 개 루디와 함께 벽돌 건물에서 산다고 답해요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">대화로 묻고 답하는 글\u003c/span>\u003cspan class=\"lp-pill\">처음\u003c/span>\u003cspan class=\"lp-pill\">주제문 7번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">피터와 아룬이 번갈아 말하며 \u003cb class=\"key\">묻고 \u003c/b>\u003cb class=\"key\">답하는\u003c/b> 대화예요. 앞에서 피터가 \u003cb class=\"key\">지구 \u003c/b>\u003cb class=\"key\">반대쪽\u003c/b>이라는 큰 이야기를 꺼내고, 뒤에서 두 사람의 사는 곳을 하나씩 소개해요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>How about there? (9)\u003c/b>\u003cspan>상대에게 물어봄\u003c/span>\u003cb>But (11)\u003c/b>\u003cspan>반대 내용\u003c/span>\u003cb>too (15)\u003c/b>\u003cspan>같은 점 더하기\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">the other side of the planet\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">there\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">my village\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>피터의 도시\u003c/th>\u003cth>아룬의 마을\u003c/th>\u003c/tr>\u003ctr>\u003ctd>높은 건물이 많아요\u003c/td>\u003ctd>건물이 많지 않아요\u003c/td>\u003c/tr>\u003ctr>\u003ctd>나무집이 있어요\u003c/td>\u003ctd>강과 나무가 있어요\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"오늘 글은 두 사람이 번갈아 말하는 대화로 된 글이에요. 피터가 먼저 지구 반대쪽이라는 큰 이야기를 꺼내고, 그다음에 서로 사는 곳을 하나씩 소개해요. 그래서 중심이 되는 말은 글 처음에 나온다고 볼 수 있어요.","hl":"ty"},{"n":9,"text":"글을 읽을 때 How about there 처럼 묻는 말이 나오면 바로 뒤에 답이 와요. 그리고 But이 나오면 앞의 내용과 반대되는 이야기가 이어져요. too는 나도 그렇다고 같은 점을 더할 때 쓰여요. 또 the other side of the planet, there, my village는 모두 아룬이 사는 곳을 가리키는 말이에요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 단어\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>good morning\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>좋은 아침\u003c/span>\u003c/div>\u003cdiv>\u003cb>name\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이름\u003c/span>\u003c/div>\u003cdiv>\u003cb>who\u003c/b>\u003cem>대명사\u003c/em>\u003cspan>누구\u003c/span>\u003c/div>\u003cdiv>\u003cb>evening\u003c/b>\u003cem>명사\u003c/em>\u003cspan>저녁\u003c/span>\u003c/div>\u003cdiv>\u003cb>just\u003c/b>\u003cem>부사\u003c/em>\u003cspan>막, 방금\u003c/span>\u003c/div>\u003cdiv>\u003cb>have dinner\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>저녁을 먹다\u003c/span>\u003c/div>\u003cdiv>\u003cb>other side\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>반대쪽\u003c/span>\u003c/div>\u003cdiv>\u003cb>planet\u003c/b>\u003cem>명사\u003c/em>\u003cspan>행성, 지구\u003c/span>\u003c/div>\u003cdiv>\u003cb>tall\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>키가 큰, 높은\u003c/span>\u003c/div>\u003cdiv>\u003cb>building\u003c/b>\u003cem>명사\u003c/em>\u003cspan>건물\u003c/span>\u003c/div>\u003cdiv>\u003cb>How about ~?\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~은 어때요?\u003c/span>\u003c/div>\u003cdiv>\u003cb>village\u003c/b>\u003cem>명사\u003c/em>\u003cspan>마을\u003c/span>\u003c/div>\u003cdiv>\u003cb>flow\u003c/b>\u003cem>동사\u003c/em>\u003cspan>흐르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>through\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~을 통해, 가로질러\u003c/span>\u003c/div>\u003cdiv>\u003cb>along\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~을 따라\u003c/span>\u003c/div>\u003cdiv>\u003cb>sometimes\u003c/b>\u003cem>부사\u003c/em>\u003cspan>가끔\u003c/span>\u003c/div>\u003cdiv>\u003cb>climb up\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>올라가다, 오르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>for fun\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>재미로\u003c/span>\u003c/div>\u003cdiv>\u003cb>amazing\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>놀라운\u003c/span>\u003c/div>\u003cdiv>\u003cb>brick\u003c/b>\u003cem>명사\u003c/em>\u003cspan>벽돌\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"오늘은 tall, building, village, flow, along을 소리 내어 읽어 볼게요. tall은 키가 큰, building은 건물, village는 마을이라는 뜻이에요. flow는 흐르다, along은 을 따라라는 뜻이고요. 여러분도 한 번씩 따라 읽어 보세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">tall\u003c/b>\u003cspan class=\"m\">키가 큰, 높은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">high\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">short\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">many\u003c/b>\u003cspan class=\"m\">많은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">a lot of\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">few\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">climb\u003c/b>\u003cspan class=\"m\">오르다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">go up\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">go down\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">amazing\u003c/b>\u003cspan class=\"m\">놀라운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">great\u003c/span>\u003cspan class=\"s\">wonderful\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">boring\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">village\u003c/b>\u003cspan class=\"m\">마을\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">town\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">city\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"비슷한 말과 반대말도 함께 정리해요. tall은 high와 비슷하고 short와 반대예요. many는 a lot of와 비슷하고 few와 반대예요. climb은 go up과 비슷하고 go down과 반대예요. village는 town과 비슷하고 city와 반대라는 점도 꼭 기억해요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 18\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">좋은 아침!\u003c/span>\u003cspan class=\"en\">Peter012: \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Good\u003c/span> morning!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">좋은 아침이야!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Peter가 대화를 시작하며 하는 \u003cb class=\"key\">아침 \u003c/b>\u003cb class=\"key\">인사\u003c/b>예요. 친구에게 먼저 말을 거는 \u003cb class=\"key\">첫인사\u003c/b> 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">꾸며 주는 말(형용사)\u003c/span> : 꾸며 주는 말(Good) + 이름 말(morning) : \"좋은\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Good morning!, 좋은 아침!. 이 문장 전체를 해석하면, 좋은 아침이야!","hl":"m"},{"n":13,"text":"Peter가 대화를 처음 시작하면서 하는 아침 인사예요. 밝게 인사하며 친구에게 말을 거는 첫인사죠.","hl":"mn"},{"n":14,"text":"여기서 Good은 morning을 꾸며 주는 형용사예요. 그래서 Good morning은 좋은 아침이라는 뜻이 되죠. 아침에 만나면 이렇게 인사하는 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 18\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내 이름은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">My\u003c/span> name\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Peter야.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is\u003c/span> Peter.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">내 이름은 Peter야.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Peter가 자신의 이름을 말하는 \u003cb class=\"key\">자기소개\u003c/b> 문장이에요. 처음 만난 친구에게 이름을 알려 주는 \u003cb class=\"key\">기본 \u003c/b>\u003cb class=\"key\">표현\u003c/b>이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">소유격(소유격)\u003c/span> : 나의(My) + 이름(name) : \"내 이름\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be동사(be동사)\u003c/span> : 누가(My name) + 이다(is) + 무엇(Peter) : \"Peter야\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"My name, 내 이름은. is Peter, Peter야.. 이 문장 전체를 해석하면, 내 이름은 Peter야.","hl":"m"},{"n":16,"text":"Peter가 자신의 이름을 말하는 자기소개 문장이에요. 처음 만난 친구에게 이름을 알려 줄 때 딱 좋은 기본 표현이죠.","hl":"mn"},{"n":17,"text":"먼저 My는 나의라는 뜻으로 name 앞에서 소유격으로 쓰여요. 다음으로 is는 be동사인데, 내 이름이 Peter라고 말할 때 꼭 필요하죠. 그래서 My name is Peter라고 하면 내 이름은 Peter야가 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 18\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">너는 누구니?\u003c/span>\u003cspan class=\"en\">Who \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are\u003c/span> you?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">너는 누구니?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Peter가 상대방에게 \u003cb class=\"key\">이름\u003c/b>을 묻는 \u003cb class=\"key\">질문\u003c/b>이에요. 처음 만나서 누구인지 궁금할 때 하는 말이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사 의문문(be동사)\u003c/span> : 누구(Who) + are(be동사) + 너(you)? : \"너는 누구니?\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Who are you?, 너는 누구니?. 이 문장 전체를 해석하면, 너는 누구니?","hl":"m"},{"n":19,"text":"Peter가 상대방에게 이름을 묻는 질문이에요. 처음 만나서 누구인지 궁금할 때 하는 말이죠.","hl":"mn"},{"n":20,"text":"상대방이 누구인지 물을 때는 Who로 시작해요. 그다음 be동사 are를 주어 you 앞에 놓으면 Who are you?가 되죠. 그래서 너는 누구니라는 뜻이 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 18\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Arun56: 안녕,\u003c/span>\u003cspan class=\"en\">Arun56: Hi,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 Arun이야.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I'm\u003c/span> Arun.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">안녕, 나는 Arun이야.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Arun이 자신의 이름을 말하며 \u003cb class=\"key\">인사\u003c/b>하는 문장이에요. 처음 만난 친구에게 \u003cb class=\"key\">내 \u003c/b>\u003cb class=\"key\">이름\u003c/b>을 소개해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사(be동사)\u003c/span> : 나는(I) + 이다(am) + Arun : \"나는 Arun이에요\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Arun56: Hi, Arun56: 안녕. I'm Arun, 나는 Arun이야.. 이 문장 전체를 해석하면, 안녕, 나는 Arun이야.","hl":"m"},{"n":22,"text":"이 문장은 Arun이 친구에게 인사하며 내 이름을 말하는 거예요. 처음 만난 친구에게 자신을 소개하는 아주 좋은 표현이죠.","hl":"mn"},{"n":23,"text":"여기서 I'm은 I am을 짧게 줄인 줄임말이에요. '나는 ~이에요'라고 말할 때 쓰는 be동사를 기억해 두세요. I'm 뒤에 이름을 붙이면 내 이름을 쉽게 소개할 수 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 18\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저녁이에요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It's\u003c/span> evening\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여기는\u003c/span>\u003cspan class=\"en\">here.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여기는 저녁이야.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Arun이 사는 곳은 지금 \u003cb class=\"key\">저녁\u003c/b>이라고 알려 주는 문장이에요. Peter와 \u003cb class=\"key\">시간\u003c/b>이 다르다는 것을 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사(be동사)\u003c/span> : 그것은(It) + 이다(is) + 저녁(evening) : \"저녁이에요\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"It's evening, 저녁이에요. here, 여기는. 이 문장 전체를 해석하면, 여기는 저녁이야.","hl":"m"},{"n":25,"text":"Arun이 지금 자기 곳은 저녁이라고 알려 주는 문장이에요. Peter와 시간이 다르다는 것도 알 수 있죠.","hl":"mn"},{"n":26,"text":"It's는 It is를 짧게 줄인 be동사 표현이에요. 시간을 말할 때 It is를 자주 써요. 그래서 It's evening here는 여기는 저녁이에요라는 뜻이 된답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 18\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 막\u003c/span>\u003cspan class=\"en\">I just\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저녁을 먹었어!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">had\u003c/span> dinner!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 막 저녁을 먹었어!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Arun이 \u003cb class=\"key\">저녁 \u003c/b>\u003cb class=\"key\">식사\u003c/b>를 막 먹었다고 말해요. 지금이 \u003cb class=\"key\">저녁 \u003c/b>\u003cb class=\"key\">시간\u003c/b>임을 더 자세히 알려 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 나는(I) + 먹었다(had) + 저녁을(dinner) : \"먹었어요\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"I just, 나는 막. had dinner!, 저녁을 먹었어!. 이 문장 전체를 해석하면, 나는 막 저녁을 먹었어!","hl":"m"},{"n":28,"text":"Arun이 저녁 식사를 막 먹었다고 말해요. 그래서 지금이 저녁 시간이라는 것도 알 수 있죠.","hl":"mn"},{"n":29,"text":"have의 과거형은 had예요. 이미 끝난 일을 말할 때 had를 써요. 그래서 I just had dinner는 나는 막 저녁을 먹었어라는 뜻이 된답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 18\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">와, 너는 있어\u003c/span>\u003cspan class=\"en\">Peter012: Wow, you \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">반대쪽에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">other \u003c/span>\u003cspan class=\"tgt\">side\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지구의\u003c/span>\u003cspan class=\"en\">of the planet.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">와, 너는 지구 반대쪽에 있구나.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Peter가 Arun이 지구 반대쪽에 있다는 걸 알고 \u003cb class=\"key\">놀라워하는\u003c/b> 문장이에요. \u003cb class=\"key\">on \u003c/b>\u003cb class=\"key\">the \u003c/b>\u003cb class=\"key\">other \u003c/b>\u003cb class=\"key\">side\u003c/b>는 '반대쪽'이라는 뜻이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">am·are·is 친구들(be동사)\u003c/span> : 너는(You) + 있어(are) + 지구 반대쪽에 : \"있구나\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소·시간 짝꿍 말(전치사)\u003c/span> : on + the other side = 반대쪽에 : \"반대쪽에\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Wow, you are, 와, 너는 있어. on the other side, 반대쪽에. of the planet, 지구의. 이 문장 전체를 해석하면, 와, 너는 지구 반대쪽에 있구나.","hl":"m"},{"n":31,"text":"Peter가 Arun이 지구 반대쪽에 있다는 걸 알고 놀라는 문장이에요. 우리말로는 와, 너는 지구 반대쪽에 있구나, 하고 이해하면 돼요.","hl":"mn"},{"n":32,"text":"먼저 are를 볼까요. are는 am, are, is 친구들인 be동사예요. '너는 ~에 있다'처럼 장소를 말할 때 써요. 그다음 on the other side는 '반대쪽에'라는 전치사 짝꿍 표현이에요. on이 장소를 콕 집어 주는 거죠. 여러분도 on을 보면 '어디 위나 어디에'를 떠올려 보세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 18\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">있어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">are\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 높은 건물들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">many \u003c/span>\u003cspan class=\"tgt\">tall \u003c/span>\u003cspan class=\"tgt\">buildings\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여기에\u003c/span>\u003cspan class=\"en\">here.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여기에는 많은 높은 건물들이 있어.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Peter가 사는 곳에는 \u003cb class=\"key\">높은 \u003c/b>\u003cb class=\"key\">건물\u003c/b>이 많다고 말해요. Arun의 마을과 비교하려고 자기 동네를 먼저 소개하는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">있어요 표현(There is/are)\u003c/span> : There are + 여러 개 = ~들이 있어요 : \"~들이 있어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">꾸며 주는 말(형용사)\u003c/span> : 많은(many) + 높은(tall) + 건물들(buildings) : \"많은 높은 건물들이\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"There are, 있어요. many tall buildings, 많은 높은 건물들이. here, 여기에. 이 문장 전체를 해석하면, 여기에는 많은 높은 건물들이 있어.","hl":"m"},{"n":34,"text":"Peter가 사는 곳에는 높은 건물이 많다고 말해요. Arun의 마을과 비교하려고 자기 동네를 먼저 소개하는 문장이에요.","hl":"mn"},{"n":35,"text":"첫 번째로 There are를 보세요. '~들이 있어요'라고 여러 개를 소개할 때 쓰는 표현이에요. 그래서 뒤에 buildings처럼 여러 개를 나타내는 말이 와요. 두 번째로 many와 tall은 buildings를 꾸며 주는 꾸며 주는 말이에요. many는 '많은', tall은 '높은'이라는 뜻이죠. 꾸밈말은 보통 이름 말 앞에 온다는 것도 함께 기억해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 18\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">How \u003c/span>\u003cspan class=\"tgt\">about\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그곳은\u003c/span>\u003cspan class=\"en\">there?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그곳은 어때?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Peter가 Arun에게 \u003cb class=\"key\">그곳\u003c/b>은 어떤지 물어보는 문장이에요. 자기 동네 이야기를 한 뒤라서 '너희 동네는 어때?'라는 뜻이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">어때? 표현(How about)\u003c/span> : How about + 장소 = ~은 어때요? : \"~은 어때?\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"How about, 어때. there?, 그곳은. 이 문장 전체를 해석하면, 그곳은 어때?","hl":"m"},{"n":37,"text":"Peter가 Arun에게 그곳은 어떤지 물어보는 문장이에요. 앞에서 자기 동네 이야기를 했으니 '너희 동네는 어때?'라는 뜻이에요.","hl":"mn"},{"n":38,"text":"How about은 상대에게 가볍게 물어볼 때 쓰는 표현이에요. '그건 어때?' 하고 질문하는 거죠. 그리고 여기서 there는 '그곳'이라는 뜻으로 쓰였어요. 친구에게 '너희 집은 어때?' 하고 물을 때도 How about your house라고 말할 수 있어요. 아주 짧지만 자주 쓰는 표현이니 꼭 익혀 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 18\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">없어요\u003c/span>\u003cspan class=\"en\">Arun56: \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">not\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 건물들이\u003c/span>\u003cspan class=\"en\">many \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">buildings\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 마을에는\u003c/span>\u003cspan class=\"en\">in my village.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리 마을에는 건물들이 많지 않아.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 피터의 동네와 달리 아룬의 마을에는 건물이 많지 않다는 걸 말해요. 두 사람이 사는 곳의 \u003cb class=\"key\">다른 \u003c/b>\u003cb class=\"key\">점\u003c/b>을 보여 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">있어요 표현(There is/are)\u003c/span> : 거기에는(There) + 있어요(are) + 무엇이 : \"많지 않아요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">여러 개 이름 말(복수)\u003c/span> : 하나(building) + 여러 개(buildings) : \"건물들\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"There are not, 없어요. many buildings, 많은 건물들이. in my village, 우리 마을에는. 이 문장 전체를 해석하면, 우리 마을에는 건물들이 많지 않아.","hl":"m"},{"n":40,"text":"건물이 아주 많은 피터의 동네와 달리 아룬의 마을에는 건물이 많지 않다는 다른 점을 말하고 있어요.","hl":"mn"},{"n":41,"text":"무엇이 있는지 말할 때 There are를 써요. 그 뒤에 not을 붙이면 없다는 뜻이 되죠. 그리고 건물이 여러 개일 때는 building 뒤에 s를 붙여 buildings라고 해요. There are not many buildings를 통째로 익혀 봐요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 18\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 강이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">But\u003c/span> a river\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 통해 흘러요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">flows\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">through \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 마을을 통해 강이 흘러.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 건물은 많지 않지만 마을 가운데로 강이 흐른다고 말해요. 앞 내용과 \u003cb class=\"key\">반대\u003c/b>되는 마을 모습을 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 앞말 + 하지만(But) + 뒷말 : \"하지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">한 사람·한 개일 때 동사 + s(3인칭 단수)\u003c/span> : 강이(a river) + 흐른다(flows) : \"흘러요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">장소 짝꿍 말(전치사)\u003c/span> : 통과해서(through) + 그것(it) : \"그것을 통해\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"But a river, 하지만 강이. flows through it, 그것을 통해 흘러요. 이 문장 전체를 해석하면, 하지만 마을을 통해 강이 흘러.","hl":"m"},{"n":43,"text":"건물은 많지 않지만 마을 가운데로 강이 흐른다고 말해요. 앞에서 말한 것과 반대되는 마을 모습을 보여 주는 거예요.","hl":"mn"},{"n":44,"text":"앞말과 반대되는 내용을 이어 줄 때 But을 써요. 여기서는 건물은 적지만 강이 있다는 걸 이어 주죠. a river는 한 개니까 동사에 s를 붙여 flows라고 해요. through는 가로질러 지나간다는 뜻이고, it은 앞에 나온 마을을 가리켜요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 18\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">있어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">are\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 나무들이\u003c/span>\u003cspan class=\"en\">many trees\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">강을 따라서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">along \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">river\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">강을 따라서 많은 나무들이 있어.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아룬의 마을에는 강을 따라 나무가 많다고 말해요. 마을이 \u003cb class=\"key\">자연\u003c/b>과 아주 가깝다는 걸 알 수 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">있어요 표현(There is/are)\u003c/span> : 거기에는(There) + 있어요(are) + 무엇이 : \"있어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소 짝꿍 말(전치사)\u003c/span> : ~을 따라(along) + 강(the river) : \"강을 따라서\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"There are, 있어요. many trees, 많은 나무들이. along the river, 강을 따라서. 이 문장 전체를 해석하면, 강을 따라서 많은 나무들이 있어.","hl":"m"},{"n":46,"text":"아룬의 마을에는 강을 따라 나무가 많다고 말해요. 마을이 자연과 아주 가깝다는 걸 알 수 있어요.","hl":"mn"},{"n":47,"text":"여러 나무가 있다고 할 때는 There are를 써요. 셀 수 있는 것이 여러 개면 are를 쓴다는 것, 꼭 기억해요. along은 따라서라는 뜻이라서 강 옆으로 쭉 이어져 있다는 걸 보여 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 18\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 가끔\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">sometimes\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">올라가요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">climb\u003c/span> up\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 나무들 위로\u003c/span>\u003cspan class=\"en\">the trees\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">재미로.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">fun\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 가끔 재미로 나무 위로 올라가거든.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Arun이 \u003cb class=\"key\">가끔\u003c/b> \u003cb class=\"key\">재미로\u003c/b> 나무에 오른다고 말해요. 앞에서 강가에 나무가 많다고 했으니, 그 이야기를 이어 가는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">자주를 나타내는 말(부사)\u003c/span> : 얼마나 자주(sometimes) + 하는 일(climb) : \"가끔\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재 하는 일 말하기(일반동사 현재형)\u003c/span> : 누가(I) + 한다(climb) + 무엇을(up the trees) : \"올라가요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">까닭을 나타내는 말(전치사)\u003c/span> : for + 재미(fun) = 재미로 : \"재미로\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"I sometimes, 나는 가끔. climb up, 올라가요. the trees, 그 나무들 위로. for fun, 재미로.. 이 문장 전체를 해석하면, 나는 가끔 재미로 나무 위로 올라가거든.","hl":"m"},{"n":49,"text":"이 문장은 Arun이 가끔 재미로 나무에 오른다는 뜻이에요. 앞에서 강가에 나무가 많다고 했으니, 그 이야기를 이어 가는 문장이에요.","hl":"mn"},{"n":50,"text":"sometimes는 얼마나 자주 하는지 알려 주고 보통 하는 일 앞에 와요. 가끔 하는 습관을 말할 때는 동사를 현재형 그대로 써요. 주어 I는 나, 즉 말하는 사람이에요. 그래서 climb 뒤에 s를 붙이지 않아요. for 뒤에 fun을 붙이면 재미로라는 뜻이 돼요. 아주 쉬운 표현이니까 소리 내어 따라 읽어 보세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 18\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그거 놀라워요!\u003c/span>\u003cspan class=\"en\">Peter012: \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">That's\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">amazing\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그거 놀랍다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Peter가 Arun의 이야기를 듣고 \u003cb class=\"key\">놀랍다\u003c/b>고 감탄해요. 대화를 \u003cb class=\"key\">밝게\u003c/b> 이어 주는 짧은 말이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사 줄임말(be동사)\u003c/span> : That + is = That's : \"그것은 ~이에요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">느낌을 나타내는 말(형용사)\u003c/span> : That's + amazing = 놀라워요 : \"놀라운\"\u003c/div>\u003c/div>","segs":[{"n":51,"text":"That's amazing!, 그거 놀라워요!. 이 문장 전체를 해석하면, 그거 놀랍다!","hl":"m"},{"n":52,"text":"Peter가 Arun의 이야기를 듣고 놀랍다고 감탄해요. 대화를 밝게 이어 주는 짧은 말이에요.","hl":"mn"},{"n":53,"text":"That's는 That is를 짧게 줄인 말이에요. be동사 뒤에 형용사를 두면 그 상태를 말할 수 있어요. amazing은 아주 신기하고 멋질 때 쓰는 말이에요. 친구가 신기한 이야기를 해 주면 이렇게 밝게 놀랍다고 말해 보세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 15 / 18\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 좋아해요\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오르는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">climbing\u003c/span> up\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나무도 또한.\u003c/span>\u003cspan class=\"en\">trees, \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">too\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나도 나무에 오르는 것을 좋아해.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Peter가 Arun처럼 \u003cb class=\"key\">나무에 \u003c/b>\u003cb class=\"key\">오르는 \u003c/b>\u003cb class=\"key\">것\u003c/b>을 \u003cb class=\"key\">좋아한다\u003c/b>고 말해요. 둘의 \u003cb class=\"key\">공통점\u003c/b>을 찾는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사-ing 이름 말(동명사)\u003c/span> : 누가(I) + 좋아해요(like) + 하는 것(climbing) : \"오르는 것을 좋아해요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">또한을 나타내는 말(부사)\u003c/span> : ..., too = 나도 또한 : \"나도\"\u003c/div>\u003c/div>","segs":[{"n":54,"text":"I like, 나는 좋아해요. climbing up, 오르는 것을. trees, too, 나무도 또한.. 이 문장 전체를 해석하면, 나도 나무에 오르는 것을 좋아해.","hl":"m"},{"n":55,"text":"이 문장은 Peter가 나무에 오르는 것을 좋아한다고 말해요. 둘의 공통점을 찾는 문장이에요.","hl":"mn"},{"n":56,"text":"like 뒤에 동사에 ing를 붙인 climbing을 쓰면 하는 것을 좋아해요라는 뜻이 돼요. 취미를 말할 때 아주 많이 써요. 문장 끝에 too를 붙이면 나도 또는 또한이라는 뜻이에요. 앞사람과 같은 것을 좋아할 때 써요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 16 / 18\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 가지고 있어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">have\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나무집을!\u003c/span>\u003cspan class=\"en\">a tree house!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 나무집이 있어!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Peter가 \u003cb class=\"key\">나무집\u003c/b>을 가지고 있다고 말해요. 앞에서 나무 타기를 좋아한다고 했으니, \u003cb class=\"key\">자신이 \u003c/b>\u003cb class=\"key\">가진 \u003c/b>\u003cb class=\"key\">것\u003c/b>을 소개하는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재를 말하는 일반동사(일반동사 현재형)\u003c/span> : 누가(I) + 가진다(have) + 무엇을(a tree house) : \"나는 가지고 있어요 + 나무집을\"\u003c/div>\u003c/div>","segs":[{"n":57,"text":"I have, 나는 가지고 있어요. a tree house!, 나무집을!. 이 문장 전체를 해석하면, 나는 나무집이 있어!","hl":"m"},{"n":58,"text":"Peter가 나무집을 가지고 있다고 말해요. 앞에서 나무 타기를 좋아한다고 했으니 자신이 가진 것을 소개하는 문장이에요.","hl":"mn"},{"n":59,"text":"지금 가지고 있는 것을 말할 때 일반동사 현재형을 써요. 주어가 I라서 have를 그대로 써요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 17 / 18\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오,\u003c/span>\u003cspan class=\"en\">Arun56: Oh,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">너는 사니\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">live\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나무집에서?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">tree \u003c/span>\u003cspan class=\"tgt\">house\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">오, 너는 나무집에서 사니?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Arun이 Peter에게 \u003cb class=\"key\">나무집\u003c/b>에서 사는지 묻는 말이에요. Peter가 나무집이 있다고 해서 \u003cb class=\"key\">정말 \u003c/b>\u003cb class=\"key\">사는지\u003c/b> 궁금해하는 거예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">do로 묻는 의문문(일반동사 의문문)\u003c/span> : Do + 너(you) + 하다(live) + 어디에서? : \"너는 사니?\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소를 나타내는 전치사(in)\u003c/span> : in + 장소(the tree house) : \"나무집 안에서, 나무집에서\"\u003c/div>\u003c/div>","segs":[{"n":60,"text":"Oh, 오. do you live, 너는 사니. in the tree house?, 나무집에서?. 이 문장 전체를 해석하면, 오, 너는 나무집에서 사니?","hl":"m"},{"n":61,"text":"Arun이 Peter에게 나무집에서 사는지 묻고 있어요. Peter가 나무집이 있다고 해서 정말 사는지 궁금한 거죠.","hl":"mn"},{"n":62,"text":"일반동사로 질문할 때는 앞에 do를 세워요. 그래서 do you live가 되어 묻는 말이 됩니다. 장소 앞에 in을 쓰면 그 장소 안에서라는 뜻이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 18 / 18\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아니, 나는 살아요\u003c/span>\u003cspan class=\"en\">Peter012: No, \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">live\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">벽돌 건물에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">brick \u003c/span>\u003cspan class=\"tgt\">building\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">부모님, 여동생과 함께\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">my \u003c/span>\u003cspan class=\"tgt\">parents, \u003c/span>\u003cspan class=\"tgt\">sister, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 내 개 Rudy와 함께.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">my \u003c/span>\u003cspan class=\"tgt\">dog \u003c/span>\u003cspan class=\"tgt\">Rudy\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">아니. 나는 부모님, 여동생, 그리고 내 개 Rudy와 함께 벽돌 건물에서 살아.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Peter가 나무집에 사는 게 아니라고 \u003cb class=\"key\">대답\u003c/b>해요. 대신 \u003cb class=\"key\">가족\u003c/b>과 \u003cb class=\"key\">개\u003c/b>와 함께 벽돌 건물에서 산다고 말해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재를 말하는 일반동사(일반동사 현재형)\u003c/span> : 누가(I) + 산다(live) + 어디에서(in a brick building) : \"나는 살아요 + 벽돌 건물에서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소를 나타내는 전치사(in)\u003c/span> : in + 장소(a brick building) : \"벽돌 건물 안에서, 벽돌 건물에서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">함께를 나타내는 전치사(with)와 이어 주는 말(and)\u003c/span> : with + 사람들 + and + 사람이나 동물 : \"부모님, 여동생, 그리고 내 개 Rudy와 함께\"\u003c/div>\u003c/div>","segs":[{"n":63,"text":"No, I live, 아니, 나는 살아요. in a brick building, 벽돌 건물에서. with my parents, sister, 부모님, 여동생과 함께. and my dog Rudy, 그리고 내 개 Rudy와 함께.. 이 문장 전체를 해석하면, 아니. 나는 부모님, 여동생, 그리고 내 개 Rudy와 함께 벽돌 건물에서 살아.","hl":"m"},{"n":64,"text":"Peter가 나무집에 사는 게 아니라고 대답해요. 대신 가족과 개와 함께 벽돌 건물에서 산다고 말해요.","hl":"mn"},{"n":65,"text":"먼저 지금 사는 곳을 말할 때 일반동사 현재형을 써요. 주어가 I라서 live를 그대로 써요. 다음으로 장소 앞에 in을 쓰면 그 장소 안에서라는 뜻이에요. 마지막으로 with는 함께라는 뜻이고, 여러 사람이나 동물을 이어 말할 때 and를 써요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">오늘 배운 내용 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>피터와 아룬은 \u003cb class=\"key\">지구 \u003c/b>\u003cb class=\"key\">반대쪽\u003c/b>에 살아서 시간이 달라요.\u003c/li>\u003cli>피터네는 \u003cb class=\"key\">높은 \u003c/b>\u003cb class=\"key\">건물\u003c/b>이 많고, 아룬네 마을에는 강과 \u003cb class=\"key\">나무\u003c/b>가 많아요.\u003c/li>\u003cli>There are는 '~이 있다'는 뜻으로 \u003cb class=\"key\">있다\u003c/b>를 말할 때 써요.\u003c/li>\u003cli>두 친구는 사는 곳은 달라도 \u003cb class=\"key\">나무 \u003c/b>\u003cb class=\"key\">오르기\u003c/b>를 좋아해요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Two friends on opposite sides of the planet introduce their homes and find they both like climbing trees.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: 지구 반대쪽에 사는 피터와 아룬이 서로 사는 곳을 소개해요. \u003cb class=\"key\">높은 \u003c/b>\u003cb class=\"key\">건물\u003c/b>이 많은 도시에 사는 피터와 \u003cb class=\"key\">강과 \u003c/b>\u003cb class=\"key\">나무\u003c/b>가 있는 마을에 사는 아룬은 둘 다 나무 오르기를 좋아해요.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":66,"text":"오늘 우리는 지구 반대쪽에 사는 두 친구의 대화를 읽었어요. 피터는 높은 건물이 많은 도시에, 아룬은 강과 나무가 있는 마을에 살았죠. 사는 곳은 달라도 나무 오르기를 좋아하는 마음은 똑같았어요. 오늘도 정말 잘했어요, 다음에 또 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
