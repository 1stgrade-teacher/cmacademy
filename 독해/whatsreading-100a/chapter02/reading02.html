@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"왓츠 리딩 100A Ch.2 Unit 02 Table Manners","audioDir":"reading02_audio","preview":false,"count":57,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.520em\">Ch.2 Unit\u003cbr>02 Table\u003cbr>Manners\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">왓츠 리딩 100A\u003c/div>\u003ch1>Interesting Table Manners Around the World\u003c/h1>\u003ch2>세계 여러 나라의 흥미로운 식사 예절\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">한 줄 요약\u003c/span>\u003cspan>세계 여러 나라에는 서로 다른 \u003cb class=\"key\">식사 \u003c/b>\u003cb class=\"key\">예절\u003c/b>이 있어요. 일본·중국·프랑스의 예를 보면 같은 행동도 나라마다 다르게 생각하며, 다른 나라를 방문하면 그 나라의 \u003cb class=\"key\">기본 \u003c/b>\u003cb class=\"key\">규칙\u003c/b>을 따르는 것이 좋아요.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Table manners are different around the world, so try to follow the basic rules when you visit other countries.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘도 만나서 정말 반가워요. 오늘은 세계 여러 나라의 식사 예절에 관한 글을 읽어 볼 거예요. 나라마다 재미있는 예절이 아주 많다는 이야기랍니다. 우리 문화와 다른 점을 찾으면서 함께 읽어 봐요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">미리 알면 쉬워요\u003c/span>\u003cdiv class=\"lp-box\">나라마다 인사법이 다른 것처럼 식사 예절(table manners)도 달라요. 어떤 나라는 조용히 먹는 것이 예절이고, 어떤 나라는 소리를 내는 것이 예절이에요. 우리가 친구 집에 갈 때 신발을 벗는 것처럼, 그 나라에는 그 나라만의 약속이 있는 거예요. 트림(burp)처럼 한 나라에서는 무례하지만 다른 나라에서는 음식이 맛있다는 신호인 행동도 있어요. 그래서 여행을 갈 때는 그 나라의 \u003cb class=\"key\">기본 \u003c/b>\u003cb class=\"key\">규칙\u003c/b>을 먼저 알아 두면 좋아요.\u003c/div>","segs":[{"n":2,"text":"여러분, 친구 집에 놀러 갔을 때 신발을 벗고 들어가죠? 그 집만의 약속이 있는 것처럼 나라마다 식사 예절, 영어로 table manners도 달라요. 어떤 나라는 조용히 먹어야 하고, 어떤 나라는 소리를 내는 것이 예절이에요. 여러분은 국수를 먹을 때 소리를 내나요? 오늘 글에서 일본 친구들은 어떻게 먹는지 함께 확인해 봐요. 그리고 burp, 즉 트림에 대한 재미있는 이야기도 나온답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>나라마다 다른 예절\u003csmall>소개 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>세계 여러 곳에는 \u003cb class=\"key\">흥미로운\u003c/b> 식사 예절이 있어요. 어떤 나라에서는 \u003cb class=\"key\">씹을 \u003c/b>\u003cb class=\"key\">때\u003c/b> 소리를 내면 안 되지만, 다른 나라에서는 괜찮아요. 같은 행동도 \u003cb class=\"key\">나라마다\u003c/b> 다르게 생각한다는 것을 알려 줘요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>일본과 중국\u003csmall>예시 · 문장 4–8\u003c/small>\u003c/h4>\u003cp>일본에서는 면을 먹을 때 \u003cb class=\"key\">소리를 \u003c/b>\u003cb class=\"key\">내야\u003c/b> 해요. 그 소리는 면을 \u003cb class=\"key\">즐기고 \u003c/b>\u003cb class=\"key\">있다는\u003c/b> 뜻이에요. 중국에서는 누군가 트림해도 \u003cb class=\"key\">놀라지\u003c/b> 마세요. 트림은 음식이 \u003cb class=\"key\">맛있었다는\u003c/b> 뜻이거든요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>젓가락과 프랑스\u003csmall>바뀜 · 문장 9–13\u003c/small>\u003c/h4>\u003cp>중국에서도 젓가락을 공중에 \u003cb class=\"key\">흔들면\u003c/b> 안 돼요. 사람들은 \u003cb class=\"key\">바쁠 \u003c/b>\u003cb class=\"key\">때\u003c/b> 식사를 빨리 끝내려고 하지만, 프랑스에서는 \u003cb class=\"key\">천천히\u003c/b> 먹어요. 프랑스 사람들은 그 경험을 즐기는 것을 좋아해요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>기본 규칙 따르기\u003csmall>마무리 · 문장 14–15\u003c/small>\u003c/h4>\u003cp>이런 예절은 여러분 \u003cb class=\"key\">문화\u003c/b>와 다를지도 몰라요. 그래도 다른 나라를 방문한다면 \u003cb class=\"key\">기본적인 \u003c/b>\u003cb class=\"key\">규칙\u003c/b>을 따르려고 노력해요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 나라마다 다른 예절을 하나씩 예를 들어 보여 주는 순서로 되어 있어요.","hl":null},{"n":4,"text":"먼저 글은 세계 여러 곳에 흥미로운 식사 예절이 있다고 시작해요. 어떤 나라에서는 씹을 때 소리를 내면 안 되지만, 다른 나라에서는 괜찮다고 해요. 같은 행동도 나라마다 다르게 생각한다는 것을 알려 주는 거예요.","hl":"f0"},{"n":5,"text":"두 번째로 일본과 중국 이야기가 나와요. 일본에서는 면을 먹을 때 소리를 내야 하고, 그 소리는 면을 즐기고 있다는 뜻이에요. 중국에서는 누군가 트림을 해도 놀라지 마세요. 트림은 음식이 맛있었다는 뜻이거든요.","hl":"f1"},{"n":6,"text":"세 번째로 중국에서도 조심할 것이 있어요. 젓가락을 공중에 흔들면 안 된다고 해요. 또 사람들은 바쁠 때 식사를 빨리 끝내지만, 프랑스에서는 천천히 먹으면서 그 경험을 즐긴다고 해요.","hl":"f2"},{"n":7,"text":"마지막으로 이런 예절이 여러분 문화와 다를 수 있다고 말해요. 그래도 다른 나라를 방문하면 기본적인 규칙을 따르려고 노력하라고 알려 줘요. 서로 다른 예절을 존중하자는 뜻이에요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">비교하며 예시 들기\u003c/span>\u003cspan class=\"lp-pill\">처음과 끝\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">처음에 세계 여러 곳에 흥미로운 식사 예절이 있다고 \u003cb class=\"key\">중심 \u003c/b>\u003cb class=\"key\">생각\u003c/b>을 말해요. 가운데에서는 일본·중국·프랑스의 예를 하나씩 들어 \u003cb class=\"key\">비교\u003c/b>해요. 끝에서는 다시 다른 나라의 규칙을 따르자고 정리해요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>In some countries (2)\u003c/b>\u003cspan>한쪽 나라의 예를 알려 줌\u003c/span>\u003cb>In other countries (3)\u003c/b>\u003cspan>반대쪽 나라의 예를 알려 줌\u003c/span>\u003cb>but (7)\u003c/b>\u003cspan>반대 내용으로 바꿔 줌\u003c/span>\u003cb>if (15)\u003c/b>\u003cspan>조건을 알려 줌\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">table manners\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">these table manners\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the basic rules\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>중국\u003c/th>\u003cth>대부분의 나라\u003c/th>\u003c/tr>\u003ctr>\u003ctd>트림해도 괜찮아요\u003c/td>\u003ctd>트림은 무례해요\u003c/td>\u003c/tr>\u003ctr>\u003ctd>음식이 맛있다는 뜻이에요\u003c/td>\u003ctd>예절에 어긋나요\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 여러 나라의 예를 들어 설명하는 비교의 글이에요. 중심 문장은 첫 번째 문장인, 세계 여러 곳에 흥미로운 식사 예절이 있다는 문장이에요. 처음에 중심 생각을 말하고 가운데에서 예를 들고 끝에서 다시 정리하는 짜임이에요.","hl":"ty"},{"n":9,"text":"글의 길잡이 말도 눈에 잘 띄어요. In some countries와 In other countries는 서로 다른 나라의 예를 짝지어 보여 주고, but은 반대 내용으로 방향을 바꿔 줘요. 같은 대상을 table manners라고 했다가 these table manners, 그리고 the basic rules라고 다르게 부르는 것도 꼭 찾아보세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 단어\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>interesting\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>흥미로운\u003c/span>\u003c/div>\u003cdiv>\u003cb>table manners\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>식사 예절\u003c/span>\u003c/div>\u003cdiv>\u003cb>different\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>다른\u003c/span>\u003c/div>\u003cdiv>\u003cb>noise\u003c/b>\u003cem>명사\u003c/em>\u003cspan>소리\u003c/span>\u003c/div>\u003cdiv>\u003cb>chew\u003c/b>\u003cem>동사\u003c/em>\u003cspan>씹다\u003c/span>\u003c/div>\u003cdiv>\u003cb>noodles\u003c/b>\u003cem>명사\u003c/em>\u003cspan>면, 국수\u003c/span>\u003c/div>\u003cdiv>\u003cb>enjoy\u003c/b>\u003cem>동사\u003c/em>\u003cspan>즐기다\u003c/span>\u003c/div>\u003cdiv>\u003cb>burp\u003c/b>\u003cem>동사\u003c/em>\u003cspan>트림하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>surprised\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>놀란\u003c/span>\u003c/div>\u003cdiv>\u003cb>rude\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>무례한\u003c/span>\u003c/div>\u003cdiv>\u003cb>delicious\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>맛있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>chopsticks\u003c/b>\u003cem>명사\u003c/em>\u003cspan>젓가락\u003c/span>\u003c/div>\u003cdiv>\u003cb>wave\u003c/b>\u003cem>동사\u003c/em>\u003cspan>흔들다\u003c/span>\u003c/div>\u003cdiv>\u003cb>in a hurry\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>바쁜, 서두르는\u003c/span>\u003c/div>\u003cdiv>\u003cb>finish\u003c/b>\u003cem>동사\u003c/em>\u003cspan>끝내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>take one's time\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>천천히 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>experience\u003c/b>\u003cem>명사\u003c/em>\u003cspan>경험\u003c/span>\u003c/div>\u003cdiv>\u003cb>culture\u003c/b>\u003cem>명사\u003c/em>\u003cspan>문화\u003c/span>\u003c/div>\u003cdiv>\u003cb>follow\u003c/b>\u003cem>동사\u003c/em>\u003cspan>따르다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"오늘의 단어도 소리 내어 읽어 볼까요? chew는 씹다, burp는 트림하다, rude는 무례한, delicious는 맛있다는 뜻이에요. chopsticks는 젓가락, wave는 흔들다, culture는 문화라는 뜻이에요. take your time은 천천히 하라는 말이랍니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">different\u003c/b>\u003cspan class=\"m\">다른\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">not the same\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">same\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">rude\u003c/b>\u003cspan class=\"m\">무례한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">not polite\u003c/span>\u003cspan class=\"s\">bad\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">polite\u003c/span>\u003cspan class=\"a\">kind\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">delicious\u003c/b>\u003cspan class=\"m\">맛있는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">tasty\u003c/span>\u003cspan class=\"s\">yummy\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">awful\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">enjoy\u003c/b>\u003cspan class=\"m\">즐기다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">like\u003c/span>\u003cspan class=\"s\">love\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">finish\u003c/b>\u003cspan class=\"m\">끝내다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">end\u003c/span>\u003cspan class=\"s\">stop\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">start\u003c/span>\u003cspan class=\"a\">begin\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"비슷한 말과 반대말도 함께 익혀 봐요. different는 다르다, 반대말은 same이에요. rude의 반대말은 polite이고, delicious는 tasty나 yummy와 비슷해요. enjoy는 like와 비슷하고, finish의 반대말은 start예요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 15\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">있습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">are\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">흥미로운 식사 예절들이\u003c/span>\u003cspan class=\"en\">interesting table manners\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 지역에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">different \u003c/span>\u003cspan class=\"tgt\">parts \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세계의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">world\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">세계의 다른 지역에 흥미로운 식사 예절들이 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글의 첫 문장으로, 세계 여러 곳에 \u003cb class=\"key\">흥미로운\u003c/b> \u003cb class=\"key\">식사 \u003c/b>\u003cb class=\"key\">예절\u003c/b>이 있다고 알려 줘요. 오늘 읽을 글 전체를 이끄는 \u003cb class=\"key\">중심 \u003c/b>\u003cb class=\"key\">문장\u003c/b>이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">~이 있다 표현(There is/are)\u003c/span> : 무엇이(interesting table manners) + 있어요(are) + 어디에(in the world) : \"흥미로운 식사 예절들이 있습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소 짝꿍 말(전치사 in)\u003c/span> : ~안에(in) + 다른(different) + 지역들(parts) + 세계의(of the world) : \"세계의 다른 지역에\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"There are, 있습니다. interesting table manners, 흥미로운 식사 예절들이. in different parts, 다른 지역에. of the world, 세계의. 이 문장 전체를 해석하면, 세계의 다른 지역에 흥미로운 식사 예절들이 있습니다.","hl":"m"},{"n":13,"text":"이 문장은 글의 첫 문장이에요. 세계 여러 곳에 흥미로운 식사 예절이 있다고 알려 주고 있죠. 오늘 읽을 글 전체를 이끄는 중심 문장이니까 꼭 기억해 두세요.","hl":"mn"},{"n":14,"text":"첫 번째, There are는 무엇이 있다고 말할 때 쓰는 표현이에요. 뒤에 오는 것이 여러 개면 are를 골라요. 두 번째, in은 장소 앞에 붙어 안에, 에라고 알려 주는 전치사예요. parts of the world는 세계의 지역들이라는 덩어리 표현으로 통째로 기억해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몇몇 나라에서는\u003c/span>\u003cspan class=\"en\">In some countries,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 하면 안 됩니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">shouldn't\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아무 소리도 내다\u003c/span>\u003cspan class=\"en\">make any noise\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">씹을 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">chew\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">몇몇 나라에서는 씹을 때 아무 소리도 내면 안 됩니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 몇몇 나라에서는 음식을 \u003cb class=\"key\">씹을\u003c/b> 때 \u003cb class=\"key\">소리를 \u003c/b>\u003cb class=\"key\">내면\u003c/b> 안 된다는 뜻이에요. 나라마다 식사 예절이 다르다는 걸 보여 주는 \u003cb class=\"key\">예시\u003c/b> 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">~하면 안 돼요 도와주는 동사(조동사 should not)\u003c/span> : 누가(you) + 하면 안 돼요(shouldn't) + 무엇을(make any noise) : \"당신은 ~하면 안 됩니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">때를 이어 주는 말(접속사 when)\u003c/span> : ~할 때(when) + 누가(you) + 한다(chew) : \"씹을 때\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"In some countries, 몇몇 나라에서는. you shouldn't, 당신은 하면 안 됩니다. make any noise, 아무 소리도 내다. when you chew, 씹을 때. 이 문장 전체를 해석하면, 몇몇 나라에서는 씹을 때 아무 소리도 내면 안 됩니다.","hl":"m"},{"n":16,"text":"이 문장은 몇몇 나라에서는 음식을 씹을 때 소리를 내면 안 된다는 뜻이에요. 나라마다 식사 예절이 다르다는 걸 보여 주는 예시죠.","hl":"mn"},{"n":17,"text":"첫 번째, shouldn't는 하면 안 돼요라고 금지를 알려 주는 도와주는 동사예요. 그래서 뒤에는 꼭 동사원형이 와요. 두 번째, when은 ~할 때라고 시간을 이어 주는 접속사예요. 뒤에 누가 무엇을 하는지가 이어서 나오죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 나라에서는\u003c/span>\u003cspan class=\"en\">In other countries,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 괜찮습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">it's \u003c/span>\u003cspan class=\"tgt\">okay\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">다른 나라에서는 괜찮습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장과 반대로, 다른 나라에서는 씹을 때 소리를 내도 \u003cb class=\"key\">괜찮다\u003c/b>는 뜻이에요. 두 나라의 예절을 \u003cb class=\"key\">비교\u003c/b>해 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">am·are·is 친구들(be동사)\u003c/span> : 그것은(it) + 이다('s) + 괜찮은(okay) : \"그것은 괜찮습니다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"In other countries, 다른 나라에서는. it's okay, 그것은 괜찮습니다. 이 문장 전체를 해석하면, 다른 나라에서는 괜찮습니다.","hl":"m"},{"n":19,"text":"앞 문장과 반대로, 다른 나라에서는 씹을 때 소리를 내도 괜찮다는 뜻이에요. 두 나라의 예절을 비교해 주는 문장이죠.","hl":"mn"},{"n":20,"text":"여기는 it's가 나와요. it은 앞에서 말한 소리를 내는 것을 대신 가리키는 말이에요. it's는 it is를 줄인 말로, 그것은 괜찮다는 상태를 말해 줘요. 그래서 이 문장은 짧지만 뜻이 아주 분명하답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일본에서는\u003c/span>\u003cspan class=\"en\">In Japan,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분이 면을 먹을 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">eat \u003c/span>\u003cspan class=\"tgt\">noodles\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은 꼭 ~해야 합니다\u003c/span>\u003cspan class=\"en\">you \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">to\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">소리를 내다\u003c/span>\u003cspan class=\"en\">make noise.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">일본에서는 면을 먹을 때 소리를 내야 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 일본에서는 면을 먹을 때 일부러 소리를 내야 한다는 걸 말해요. 나라마다 다른 \u003cb class=\"key\">식사 \u003c/b>\u003cb class=\"key\">예절\u003c/b> 중 일본의 예를 \u003cb class=\"key\">소개\u003c/b>하는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">때를 알려 주는 이어 주는 말(접속사 when)\u003c/span> : ~할 때(when) + 누가(you) + 한다(eat) + 무엇을(noodles) : \"여러분이 면을 먹을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">꼭 해야 한다는 도와주는 동사(조동사 have to)\u003c/span> : 누가(you) + 꼭 해야 한다(have to) + 하다(make) : \"꼭 ~해야 합니다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"In Japan, 일본에서는. when you eat noodles, 여러분이 면을 먹을 때. you have to, 여러분은 꼭 ~해야 합니다. make noise, 소리를 내다. 이 문장 전체를 해석하면, 일본에서는 면을 먹을 때 소리를 내야 합니다.","hl":"m"},{"n":22,"text":"일본에서는 면을 먹을 때 소리를 내는 게 좋은 예절이래요. 신기하죠? 나라마다 식사 예절이 참 다르네요.","hl":"mn"},{"n":23,"text":"먼저 when you eat noodles에서 when은 때를 알려 주는 말이에요. 그래서 어떤 상황인지 먼저 말해 주죠. 두 번째로 have to는 꼭 해야 하는 일을 말해요. 그래서 you have to make noise는 여러분은 소리를 내야 한다가 된답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 ~라는 것을 의미합니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It \u003c/span>\u003cspan class=\"tgt\">means\u003c/span> that\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분이 그것들을 즐기고 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">you're \u003c/span>\u003cspan class=\"tgt\">enjoying\u003c/span> them.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 여러분이 면을 즐기고 있다는 것을 의미합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 소리를 내는 건 면을 \u003cb class=\"key\">맛있게 \u003c/b>\u003cb class=\"key\">즐긴다\u003c/b>는 표시라는 뜻이에요. 앞 문장의 이유를 \u003cb class=\"key\">설명\u003c/b>해 주는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">한 사람·한 개일 때 동사 + s(3인칭 단수)\u003c/span> : 그것(It) + 의미한다(means) : \"그것은 의미합니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지금 ~하는 중(진행형)\u003c/span> : 누가(you) + 지금 ~하는 중이다(are enjoying) + 무엇을(them) : \"여러분이 즐기고 있다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"It means that, 그것은 ~라는 것을 의미합니다. you're enjoying them, 여러분이 그것들을 즐기고 있다. 이 문장 전체를 해석하면, 그것은 여러분이 면을 즐기고 있다는 것을 의미합니다.","hl":"m"},{"n":25,"text":"소리를 내는 건 면을 맛있게 즐기고 있다는 표시예요. 그래서 일본에서는 후루룩 소리가 오히려 칭찬이 되는 거예요.","hl":"mn"},{"n":26,"text":"It은 앞 문장에서 말한 소리 내는 일을 가리키는 대명사예요. It처럼 한 개를 가리킬 때는 동사에 s를 붙여서 means라고 해요. 그리고 you're enjoying은 지금 하는 중이라는 뜻의 진행형이에요. 여러분도 오늘 표현 다 외웠죠? 멋져요!","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분이 ~하는 것을 들을 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">hear\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">누군가 트림하는 것을\u003c/span>\u003cspan class=\"en\">someone burp\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">중국에서\u003c/span>\u003cspan class=\"en\">in China,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">놀라지 마세요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">surprised\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">중국에서 누군가 트림하는 것을 듣는다면, 놀라지 마세요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 중국에서는 누군가 트림해도 \u003cb class=\"key\">놀라지 \u003c/b>\u003cb class=\"key\">말라\u003c/b>고 알려 줘요. 트림이 \u003cb class=\"key\">실례\u003c/b>가 아닌 나라도 있다는 걸 보여 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">때를 알려 주는 이어 주는 말(접속사 when)\u003c/span> : ~할 때(when) + 누가(you) + 한다(hear) + 무엇을(someone burp) : \"여러분이 ~하는 것을 들을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">~하지 마세요(명령문의 부정)\u003c/span> : 하지 마라(don't) + 놀란 상태(be surprised) : \"놀라지 마세요\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"When you hear, 여러분이 ~하는 것을 들을 때. someone burp, 누군가 트림하는 것을. in China, 중국에서. don't be surprised, 놀라지 마세요. 이 문장 전체를 해석하면, 중국에서 누군가 트림하는 것을 듣는다면, 놀라지 마세요.","hl":"m"},{"n":28,"text":"중국에서는 누군가 트림해도 이상하게 생각하지 마세요. 트림이 실례가 아닌 나라도 있기 때문이에요.","hl":"mn"},{"n":29,"text":"먼저 when은 두 가지 일을 이어 주는 말이에요. 그리고 '~할 때'라는 때를 알려 주죠. 두 번째로 don't be surprised는 놀라지 마세요라는 명령문이에요. 하지 말라는 명령은 don't 뒤에 동사를 그대로 붙여요. 여러분도 외국에 가면 오늘 배운 표현 꼭 써 보세요!","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">트림하는 것은 무례해요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Burping\u003c/span> is rude\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대부분의 나라에서는\u003c/span>\u003cspan class=\"en\">in most countries,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 중국에서는 아니에요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">but \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">China\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">대부분의 나라에서 트림하는 것은 무례하지만 중국에서는 그렇지 않습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 트림은 대부분의 나라에서 \u003cb class=\"key\">무례\u003c/b>하지만 중국에서는 \u003cb class=\"key\">괜찮다\u003c/b>는 걸 알려 줘요. 앞 문장에서 중국에서는 트림해도 놀라지 말라는 이유를 \u003cb class=\"key\">설명\u003c/b>해 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사-ing가 이름 말처럼 쓰임(동명사)\u003c/span> : 하는 것(Burping) + 이다(is) + 무례한(rude) : \"트림하는 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 하지만(but) + 아닌(not) + 중국에서는(in China) : \"하지만 중국에서는 아니에요\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Burping is rude, 트림하는 것은 무례해요. in most countries, 대부분의 나라에서는. but not in China, 하지만 중국에서는 아니에요. 이 문장 전체를 해석하면, 대부분의 나라에서 트림하는 것은 무례하지만 중국에서는 그렇지 않습니다.","hl":"m"},{"n":31,"text":"이 문장은 트림이 대부분 나라에서는 무례하지만 중국에서는 괜찮다고 알려 줘요. 앞에서 중국에서 트림해도 놀라지 말라고 했죠? 그 이유를 설명해 주는 문장이에요.","hl":"mn"},{"n":32,"text":"첫 번째, Burping처럼 동사에 ing를 붙이면 트림하는 것이라는 이름 말이 돼요. 여기서는 트림하는 것이 주어예요. 두 번째, but은 앞과 뒤를 반대로 이어 주는 이어 주는 말이에요. 그래서 앞이 무례하다니까 뒤는 괜찮다는 뜻이 되죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">트림하는 것은 뜻해요\u003c/span>\u003cspan class=\"en\">Burping \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">means\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 음식이\u003c/span>\u003cspan class=\"en\">that the food\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">맛있었다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">delicious\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">트림하는 것은 음식이 맛있었다는 것을 의미해요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 중국에서 트림은 음식이 \u003cb class=\"key\">맛있었다\u003c/b>는 \u003cb class=\"key\">신호\u003c/b>예요. 그래서 트림을 해도 \u003cb class=\"key\">무례\u003c/b>하지 않다는 걸 알려 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">한 사람·한 개일 때 동사 + s(3인칭 단수)\u003c/span> : 트림하는 것(Burping) + 의미해요(means) : \"의미해요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">am·are·is 친구들(be동사)\u003c/span> : 그 음식이(the food) + 이었다(was) + 맛있는(delicious) : \"맛있었어요\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"Burping means, 트림하는 것은 뜻해요. that the food, 그 음식이. was delicious, 맛있었다고. 이 문장 전체를 해석하면, 트림하는 것은 음식이 맛있었다는 것을 의미해요.","hl":"m"},{"n":34,"text":"중국에서 트림은 음식이 맛있었다는 신호예요. 그래서 트림을 해도 무례하지 않다는 걸 알려 주죠.","hl":"mn"},{"n":35,"text":"첫 번째, 주어가 한 가지 일이라서 동사 means에 s가 붙었어요. 두 번째, 음식을 이미 먹은 뒤라서 지난 일이 되었죠. 그래서 is가 아니라 was를 써요. 맛있는 음식을 먹고 트림을 하면 최고의 칭찬이라는 것도 기억해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 여러분은 ~해야 해요\u003c/span>\u003cspan class=\"en\">But you \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">should \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">젓가락을 조심하는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">careful\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">chopsticks\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그곳에서는\u003c/span>\u003cspan class=\"en\">there.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 그곳에서는 젓가락을 조심해야 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 중국에서는 트림은 괜찮지만 \u003cb class=\"key\">젓가락\u003c/b> 쓰는 것은 \u003cb class=\"key\">조심\u003c/b>해야 한다고 알려 줘요. 다음 문장에서 어떤 행동이 안 되는지 \u003cb class=\"key\">이어\u003c/b>서 말해 준답니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">도와주는 동사(조동사)\u003c/span> : 여러분은(you) + ~해야 해요(should) + 조심하다(be careful) : \"조심해야 해요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소·시간 짝꿍 말(전치사)\u003c/span> : 조심하다(be careful) + 젓가락에 대해(with chopsticks) : \"젓가락을 조심해서\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"But you should be, 하지만 여러분은 ~해야 해요. careful with chopsticks, 젓가락을 조심하는 것을. there, 그곳에서는. 이 문장 전체를 해석하면, 하지만 그곳에서는 젓가락을 조심해야 합니다.","hl":"m"},{"n":37,"text":"중국에서는 트림은 괜찮지만 젓가락 쓰는 것은 조심해야 한다고 알려 줘요. 다음 문장에서 어떤 행동이 안 되는지 이어서 말해 준답니다.","hl":"mn"},{"n":38,"text":"첫 번째, should는 충고할 때 쓰는 도와주는 동사예요. should 뒤에는 꼭 동사원형이 온다는 것, 잊지 마세요. 두 번째, be careful with는 조심하다라는 묶음 표현이에요. with가 뒤에 오는 말과 짝을 지어 준답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">너는 ~하면 안 돼요\u003c/span>\u003cspan class=\"en\">You \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">shouldn't\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들을 흔들다\u003c/span>\u003cspan class=\"en\">wave them\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공중에서.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">air\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것을 공중에 흔들면 안 돼요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 중국에서는 젓가락을 공중에 흔들면 안 된다고 알려 줘요. \u003cb class=\"key\">조심해야 \u003c/b>\u003cb class=\"key\">할 \u003c/b>\u003cb class=\"key\">행동\u003c/b>을 쉽게 말해 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">도와주는 동사(조동사) should + not\u003c/span> : 누가(You) + 하면 안 돼요(shouldn't) + 흔들다(wave) : \"~하면 안 돼요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소 짝꿍 말(전치사)\u003c/span> : 짝꿍 말(in) + the + 장소(the air) = 공중에 : \"공중에\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"You shouldn't, 너는 ~하면 안 돼요. wave them, 그것들을 흔들다. in the air, 공중에서.. 이 문장 전체를 해석하면, 그것을 공중에 흔들면 안 돼요.","hl":"m"},{"n":40,"text":"이 문장은 중국에서 젓가락을 공중에 흔들면 안 된다는 말이에요. 조심해야 할 행동을 알려 주는 문장이죠.","hl":"mn"},{"n":41,"text":"첫 번째, shouldn't는 should에 not을 붙인 말이에요. 그래서 '~하면 안 돼요'라는 금지의 뜻이 돼요. 두 번째, in the air에서 in은 장소 짝꿍 말이에요. 그래서 '공중에'라는 뜻이 된답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들이 ~할 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바쁠 때,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">hurry\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 끝내려고 해요\u003c/span>\u003cspan class=\"en\">they \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">try \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">finish\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 식사를 빨리\u003c/span>\u003cspan class=\"en\">their meal quickly.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사람들은 바쁠 때 식사를 빨리 끝내려고 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사람들이 바쁘면 식사를 빨리 끝내려고 한다는 걸 말해요. 뒤에 나올 프랑스 이야기와 \u003cb class=\"key\">반대되는 \u003c/b>\u003cb class=\"key\">행동\u003c/b>을 미리 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사) when\u003c/span> : ~할 때(When) + 누가(people) + 상태다(are) + 바쁘다(in a hurry) : \"사람들이 바쁠 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to + 동사원형(to부정사)\u003c/span> : 하려고 해요(try) + to + 끝내다(finish) : \"끝내려고 하다\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"When people are, 사람들이 ~할 때. in a hurry, 바쁠 때. they try to finish, 그들은 끝내려고 해요. their meal quickly, 자신의 식사를 빨리. 이 문장 전체를 해석하면, 사람들은 바쁠 때 식사를 빨리 끝내려고 합니다.","hl":"m"},{"n":43,"text":"이 문장은 사람들이 바쁠 때 식사를 빨리 끝내려고 한다는 걸 말해요. 다음 문장에서 프랑스 이야기와 비교하려고 미리 꺼내 놓은 거예요.","hl":"mn"},{"n":44,"text":"첫 번째, when은 '~할 때'라고 때를 이어 주는 말이에요. 그래서 앞부분이 '사람들이 바쁠 때'가 돼요. 두 번째, try to finish는 '끝내려고 해요'라는 뜻이에요. try to 뒤에는 동사원형이 온다는 것, 꼭 기억해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 너는 ~하면 안 돼요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">But\u003c/span> you \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">shouldn't\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 하다\u003c/span>\u003cspan class=\"en\">do that\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">프랑스에서는.\u003c/span>\u003cspan class=\"en\">in France.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 프랑스에서는 그렇게 하면 안 됩니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장과 반대로, 프랑스에서는 빨리 먹으면 안 된다고 말해요. \u003cb class=\"key\">하지만\u003c/b>이라는 말로 앞 내용을 뒤집어 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사) but\u003c/span> : 앞 내용 + 하지만(But) + 반대 내용 : \"하지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">도와주는 동사(조동사) should + not\u003c/span> : 누가(you) + 하면 안 돼요(shouldn't) + 하다(do) : \"~하면 안 돼요\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"But you shouldn't, 하지만 너는 ~하면 안 돼요. do that, 그것을 하다. in France, 프랑스에서는.. 이 문장 전체를 해석하면, 하지만 프랑스에서는 그렇게 하면 안 됩니다.","hl":"m"},{"n":46,"text":"이 문장은 앞 문장과 반대로 프랑스에서는 빨리 먹으면 안 된다고 말해요. 하지만이라는 말이 앞 내용을 살짝 뒤집어 주는 거예요.","hl":"mn"},{"n":47,"text":"첫 번째, but은 앞 내용과 반대되는 말을 이어 줘요. 그래서 '하지만'으로 해석해요. 두 번째, shouldn't는 '~하면 안 돼요'라는 금지의 말이에요. 뒤에는 동사원형 do가 왔답니다. 여러분, 오늘 배운 표현 꼭 소리 내어 읽어 봐요!","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">프랑스 사람들은\u003c/span>\u003cspan class=\"en\">French people\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">천천히 하기를 좋아해요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">take \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">time\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 즐겨요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">enjoy \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 경험을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">experience\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">프랑스 사람들은 천천히 먹으면서 그 경험을 즐기는 것을 좋아하거든요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 프랑스 사람들은 식사를 급하게 끝내지 않고 \u003cb class=\"key\">천천히\u003c/b> 즐긴다고 알려 줘요. 앞의 '빨리 먹지 마세요'에 이유를 붙여 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">like + to + 동사원형(to부정사)\u003c/span> : 누가(They) + 좋아한다(like) + ~하는 것을(to take) : \"천천히 하는 것을 좋아해요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사) and\u003c/span> : A(like to take their time) + and + B(enjoy the experience) : \"그리고 그 경험을 즐겨요\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"French people, 프랑스 사람들은. like to take their time, 천천히 하기를 좋아해요. and enjoy, 그리고 즐겨요. the experience, 그 경험을. 이 문장 전체를 해석하면, 프랑스 사람들은 천천히 먹으면서 그 경험을 즐기는 것을 좋아하거든요.","hl":"m"},{"n":49,"text":"이 문장은 프랑스 사람들은 식사를 급하게 끝내지 않고 천천히 즐긴다고 해요. 그래서 앞에서 프랑스에서는 빨리 먹으면 안 된다고 했던 거예요.","hl":"mn"},{"n":50,"text":"첫째, like 뒤에 to와 동사원형이 오면 ~하는 것을 좋아하다라는 뜻이 돼요. 그래서 like to take their time은 천천히 하는 것을 좋아한다는 말이죠. 둘째, take their time은 서두르지 않고 천천히 하다라는 뜻의 멋진 표현이에요. 셋째, and는 두 가지를 나란히 이어 줄 때 써요. 좋아하는 것 두 가지를 한 문장에 담은 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이런 식사 예절들은\u003c/span>\u003cspan class=\"en\">These table manners\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다를지도 몰라요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">may \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">different \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분 문화의 것과\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">culture's\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이런 식사 예절들은 여러분 문화의 식사 예절과는 다를지도 모릅니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 나라마다 \u003cb class=\"key\">식사 \u003c/b>\u003cb class=\"key\">예절\u003c/b>이 우리 문화와 \u003cb class=\"key\">다를 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">있다\u003c/b>고 부드럽게 알려 주는 문장이에요. 앞에서 말한 예절들을 자기 문화와 견주어 보라고 하는 거예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">도와주는 동사(조동사) may\u003c/span> : may + 동사원형(be) → ~일지도 모른다 : \"다를지도 몰라요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">different from(~와 다른)\u003c/span> : A is different from B(A는 B와 달라요) : \"여러분 문화의 것과 달라요\"\u003c/div>\u003c/div>","segs":[{"n":51,"text":"These table manners, 이런 식사 예절들은. may be different, 다를지도 몰라요. from your culture's, 여러분 문화의 것과. 이 문장 전체를 해석하면, 이런 식사 예절들은 여러분 문화의 식사 예절과는 다를지도 모릅니다.","hl":"m"},{"n":52,"text":"이 문장은 나라마다 식사 예절이 우리 문화와 다를 수 있다고 알려 줘요. 그러니까 다른 나라 예절을 볼 때 놀라지 말라고 미리 말해 주는 거예요.","hl":"mn"},{"n":53,"text":"첫째, may는 ~일지도 모른다라는 뜻으로 가능성을 부드럽게 말해 줘요. 그래서 may be different는 다를지도 몰라요가 되는 거죠. 둘째, different from은 ~와 다르다라고 말할 때 쓰는 짝꿍 표현이에요. 마지막으로 culture's는 문화의라는 뜻이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 15 / 15\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 만약 여러분이 방문한다면\u003c/span>\u003cspan class=\"en\">But \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">if \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">visit \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 나라들을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">other \u003c/span>\u003cspan class=\"tgt\">countries\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">따르려고 노력해 보세요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">try \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">follow \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기본적인 규칙들을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">basic \u003c/span>\u003cspan class=\"tgt\">rules\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 다른 나라를 방문한다면, 기본적인 규칙들을 따르려고 노력해 보세요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 다른 나라에 가면 그 나라의 \u003cb class=\"key\">기본 \u003c/b>\u003cb class=\"key\">규칙\u003c/b>을 \u003cb class=\"key\">따르려고 \u003c/b>\u003cb class=\"key\">노력\u003c/b>하라고 알려 주는 마무리 문장이에요. 예절이 달라도 기본은 지키자는 뜻이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사) if\u003c/span> : if + 누가(you) + 한다(visit) + 무엇을(other countries) → 만약 ~한다면 : \"만약 여러분이 다른 나라를 방문한다면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명령문(동사원형으로 시작)\u003c/span> : 동사원형(try) + 나머지 → ~하세요 : \"기본적인 규칙들을 따르려고 노력해 보세요\"\u003c/div>\u003c/div>","segs":[{"n":54,"text":"But if you visit, 하지만 만약 여러분이 방문한다면. other countries, 다른 나라들을. try to follow, 따르려고 노력해 보세요. the basic rules, 기본적인 규칙들을. 이 문장 전체를 해석하면, 하지만 다른 나라를 방문한다면, 기본적인 규칙들을 따르려고 노력해 보세요.","hl":"m"},{"n":55,"text":"이 문장은 다른 나라에 가면 그 나라의 기본 규칙을 따르려고 노력하라고 알려 줘요. 예절이 우리와 달라도 기본은 지키자는 따뜻한 마무리예요.","hl":"mn"},{"n":56,"text":"첫째, if는 만약 ~라면이라는 조건을 알려 주는 이어 주는 말이에요. 둘째, 이 문장은 try로 시작하는 명령문이에요. 명령문은 동사원형으로 시작해서 ~하세요라고 말하죠. 셋째, try to 뒤에 동사원형을 붙이면 ~하려고 노력하다라는 뜻이 돼요. 여러분도 새 친구에게 인사할 때 이렇게 용기 내서 try 해 봐요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">오늘 배운 내용 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>세계 여러 곳에는 \u003cb class=\"key\">흥미로운\u003c/b> 식사 예절이 있어요.\u003c/li>\u003cli>일본에서는 면을 먹을 때 소리를 내야 하고, 중국에서는 트림이 \u003cb class=\"key\">맛있다는 \u003c/b>\u003cb class=\"key\">뜻\u003c/b>이에요.\u003c/li>\u003cli>프랑스 사람들은 식사를 빨리 끝내지 않고 \u003cb class=\"key\">천천히\u003c/b> 즐겨요.\u003c/li>\u003cli>다른 나라를 방문하면 \u003cb class=\"key\">기본적인 \u003c/b>\u003cb class=\"key\">규칙\u003c/b>을 따르려고 노력해요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Table manners are different around the world, so try to follow the basic rules when you visit other countries.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">세계 여러 나라에는 서로 다른 \u003cb class=\"key\">식사 \u003c/b>\u003cb class=\"key\">예절\u003c/b>이 있어요. 일본·중국·프랑스의 예를 보면 같은 행동도 나라마다 다르게 생각하며, 다른 나라를 방문하면 그 나라의 \u003cb class=\"key\">기본 \u003c/b>\u003cb class=\"key\">규칙\u003c/b>을 따르는 것이 좋아요.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":57,"text":"오늘 우리는 나라마다 다른 식사 예절을 배웠어요. 일본에서는 면을 먹을 때 소리를 내고, 중국에서는 트림이 맛있다는 뜻이고, 프랑스에서는 천천히 즐긴다는 것, 다 기억나죠? 우리 문화와 달라도 기본적인 규칙을 따르려는 마음이 가장 중요해요. 오늘도 정말 잘했어요. 다음 시간에 또 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
