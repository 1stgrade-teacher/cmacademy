</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"왓츠 리딩 100A Ch.2 Unit 01-02 Friends on the Other Side","audioDir":"reading01-2_audio","preview":false,"count":51,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.400em\">Ch.2 Unit\u003cbr>01-02 Friends on\u003cbr>the Other Side\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">왓츠 리딩 100A\u003c/div>\u003ch1>We Live on the Same Planet\u003c/h1>\u003ch2>우리는 같은 행성에 살아요\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">한 줄 요약\u003c/span>\u003cspan>요약: 아룬은 약 30명이 함께 사는 \u003cb class=\"key\">대가족\u003c/b>과 \u003cb class=\"key\">농장 \u003c/b>\u003cb class=\"key\">동물\u003c/b>을 소개해요. 피터는 사는 곳은 달라도 \u003cb class=\"key\">공통점\u003c/b>이 있다고 말하고, 둘은 같은 \u003cb class=\"key\">행성\u003c/b>에 산다는 걸 확인해요.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Two friends live in different places and have different families, but they have things in common and share the same planet.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘도 만나서 정말 반가워요. 오늘은 아주 먼 곳에 사는 두 친구의 대화를 읽어 볼 거예요. 한 친구는 가족이 서른 명쯤 되는 대가족이고, 다른 친구는 아주 다른 곳에 살아요. 두 친구가 무엇이 같고 무엇이 다른지 함께 찾아봐요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">미리 알면 쉬워요\u003c/span>\u003cdiv class=\"lp-box\">인도 같은 나라에는 \u003cb class=\"key\">대가족\u003c/b>(joint family)이 많아요. 할아버지, 할머니, 삼촌, 고모, 사촌까지 한집이나 가까운 집에 모여 살아요. 농장이 있는 마을에서는 소, 닭, 돼지를 길러요. 우리가 강아지나 고양이를 키우며 돌보는 것처럼, 그곳 아이들은 \u003cb class=\"key\">농장 \u003c/b>\u003cb class=\"key\">동물\u003c/b>(farm animals)을 가족처럼 함께 돌봐요. 여러분은 할머니 댁에 사촌들이 잔뜩 모이면 어떤 기분이 드나요?\u003c/div>","segs":[{"n":2,"text":"여러분, 인도처럼 먼 나라에는 대가족이 많아요. 할아버지, 할머니, 삼촌, 고모, 사촌까지 한집이나 가까운 집에 모여 살죠. 농장이 있는 마을에서는 소나 닭, 돼지를 길러요. 우리가 강아지나 고양이를 키우는 것과 비슷하게, 그곳 아이들은 농장 동물을 가족처럼 함께 돌봐요. 여러분은 할머니 댁에 사촌들이 잔뜩 모이면 어떤 기분이 드나요?","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>아룬의 대가족 소개\u003csmall>소개 · 문장 1–4\u003c/small>\u003c/h4>\u003cp>아룬은 자기 \u003cb class=\"key\">가족\u003c/b>을 소개해요. 가족이 아주 \u003cb class=\"key\">대가족\u003c/b>이라서 약 30명이나 된다고 말해요. 부모님, 형제자매, 조부모님, 삼촌, 고모, \u003cb class=\"key\">사촌\u003c/b>까지 모두 함께 산다고 해요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>피터의 놀람과 질문\u003csmall>질문 · 문장 5–7\u003c/small>\u003c/h4>\u003cp>피터는 30명이라는 말에 깜짝 놀라요. 그래서 정말 \u003cb class=\"key\">놀랍다\u003c/b>고 감탄하지요. 그리고 아룬에게 \u003cb class=\"key\">반려동물\u003c/b>이 있는지 물어봐요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>농장 동물 이야기\u003csmall>예시 · 문장 8–9\u003c/small>\u003c/h4>\u003cp>아룬은 반려동물은 없지만 \u003cb class=\"key\">농장 \u003c/b>\u003cb class=\"key\">동물\u003c/b>이 있다고 해요. 소, 닭, 돼지 같은 동물들을 \u003cb class=\"key\">가족 \u003c/b>\u003cb class=\"key\">모두\u003c/b>가 함께 \u003cb class=\"key\">돌본다\u003c/b>고 말해요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>다른 점 속 공통점\u003csmall>마무리 · 문장 10–13\u003c/small>\u003c/h4>\u003cp>피터는 사는 곳이 아주 \u003cb class=\"key\">다르다\u003c/b>는 걸 알아요. 그래도 둘에게는 \u003cb class=\"key\">공통점\u003c/b>이 있다고 말하고, 아룬도 같은 생각이에요. 마지막으로 둘은 같은 \u003cb class=\"key\">행성\u003c/b>에 산다고 정리해요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 두 친구의 대화가 어떻게 흘러가는지 단계별로 살펴볼게요.","hl":null},{"n":4,"text":"먼저 아룬이 자기 가족을 소개해요. 가족이 아주 커서 서른 명쯤 된다고 말하지요. 부모님, 형제자매, 조부모님, 삼촌, 고모, 사촌까지 다 함께 산대요. 이렇게 많은 사람이 한 가족이라는 게 정말 신기하죠?","hl":"f0"},{"n":5,"text":"다음으로 피터가 놀라서 말해요. 서른 명이라는 말에 깜짝 놀라서 정말 놀랍다고 하지요. 그러고는 아룬에게 반려동물이 있는지 물어봐요. 여러분도 친구 집에 놀러 가면 강아지가 있는지 먼저 물어보죠?","hl":"f1"},{"n":6,"text":"아룬은 반려동물은 없다고 해요. 대신 소, 닭, 돼지 같은 농장 동물이 있대요. 그리고 가족 모두가 그 동물들을 함께 돌본다고 말해요. 여럿이 함께 돌보니까 동물들도 참 행복하겠죠?","hl":"f2"},{"n":7,"text":"마지막으로 피터가 우리는 사는 곳이 아주 다르다고 말해요. 그런데도 공통점이 있다는 걸 찾아내지요. 아룬도 같은 생각이라 하고, 둘은 결국 같은 행성에 산다고 정리해요. 사는 곳은 달라도 친구가 될 수 있다는 게 참 멋지죠?","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">대화로 주고받으며 비교하는 글\u003c/span>\u003cspan class=\"lp-pill\">끝\u003c/span>\u003cspan class=\"lp-pill\">주제문 13번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 두 친구가 번갈아 말하는 \u003cb class=\"key\">대화\u003c/b> 모양이에요. 아룬의 가족 이야기와 피터의 질문이 오간 뒤, 서로 다른 점을 말해요. 마지막에 같은 행성에 산다며 \u003cb class=\"key\">주제\u003c/b>를 정리해요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>like (8)\u003c/b>\u003cspan>예시를 알려 줌\u003c/span>\u003cb>But (11)\u003c/b>\u003cspan>반대되는 내용을 이어 줌\u003c/span>\u003cb>After all (13)\u003c/b>\u003cspan>마지막에 정리해 줌\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">my family\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">about thirty people\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">my whole family\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Arun56의 가족\u003c/th>\u003cth>Peter012의 가족\u003c/th>\u003c/tr>\u003ctr>\u003ctd>약 30명인 대가족\u003c/td>\u003ctd>가족 수는 알 수 없음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>농장이 있는 곳에 삶\u003c/td>\u003ctd>아주 다른 곳에 삶\u003c/td>\u003c/tr>\u003ctr>\u003ctd>소, 닭, 돼지를 함께 돌봄\u003c/td>\u003ctd>반려동물이 있는지 물어봄\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 두 친구가 번갈아 말하는 대화 모양의 글이에요. 중심이 되는 생각은 글의 끝부분에 나와요. 그래서 마지막 문장인 열세 번째 문장을 주제문으로 봐요.","hl":"ty"},{"n":9,"text":"길잡이 말도 눈여겨보세요. 열한 번째 문장 앞에 나오는 But은 앞 내용과 반대되는 말을 이어 줘요. 마지막 문장의 After all은 그래서 결국 이렇게 정리한다는 신호예요. 그리고 my family와 my whole family처럼 같은 가족을 다르게 부르는 말도 함께 찾아보세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 단어\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>live with\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~와 함께 살다\u003c/span>\u003c/div>\u003cdiv>\u003cb>family\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가족\u003c/span>\u003c/div>\u003cdiv>\u003cb>really\u003c/b>\u003cem>부사\u003c/em>\u003cspan>정말로\u003c/span>\u003c/div>\u003cdiv>\u003cb>big\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>큰\u003c/span>\u003c/div>\u003cdiv>\u003cb>about\u003c/b>\u003cem>부사\u003c/em>\u003cspan>약, ~쯤\u003c/span>\u003c/div>\u003cdiv>\u003cb>people\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사람들\u003c/span>\u003c/div>\u003cdiv>\u003cb>parent\u003c/b>\u003cem>명사\u003c/em>\u003cspan>부모님\u003c/span>\u003c/div>\u003cdiv>\u003cb>grandparent\u003c/b>\u003cem>명사\u003c/em>\u003cspan>조부모님\u003c/span>\u003c/div>\u003cdiv>\u003cb>cousin\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사촌\u003c/span>\u003c/div>\u003cdiv>\u003cb>amazing\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>놀라운\u003c/span>\u003c/div>\u003cdiv>\u003cb>pet\u003c/b>\u003cem>명사\u003c/em>\u003cspan>반려동물\u003c/span>\u003c/div>\u003cdiv>\u003cb>farm animal\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>농장 동물\u003c/span>\u003c/div>\u003cdiv>\u003cb>whole\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>전체의, 모든\u003c/span>\u003c/div>\u003cdiv>\u003cb>take care of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 돌보다\u003c/span>\u003c/div>\u003cdiv>\u003cb>together\u003c/b>\u003cem>부사\u003c/em>\u003cspan>함께\u003c/span>\u003c/div>\u003cdiv>\u003cb>different\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>다른\u003c/span>\u003c/div>\u003cdiv>\u003cb>place\u003c/b>\u003cem>명사\u003c/em>\u003cspan>장소, 곳\u003c/span>\u003c/div>\u003cdiv>\u003cb>in common\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>공통으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>feel the same\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>같은 생각이 들다\u003c/span>\u003c/div>\u003cdiv>\u003cb>planet\u003c/b>\u003cem>명사\u003c/em>\u003cspan>행성, 지구\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"오늘의 단어도 소리 내어 읽어 볼까요? take care of는 돌보다라는 뜻이에요. My whole family takes care of them이라고 하면 우리 가족 모두가 그 동물들을 돌본다는 말이 되죠. in common은 공통으로라는 뜻이고, planet은 우리가 사는 행성이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">big\u003c/b>\u003cspan class=\"m\">큰\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">large\u003c/span>\u003cspan class=\"s\">huge\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">small\u003c/span>\u003cspan class=\"a\">little\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">amazing\u003c/b>\u003cspan class=\"m\">놀라운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">wonderful\u003c/span>\u003cspan class=\"s\">great\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">boring\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">different\u003c/b>\u003cspan class=\"m\">다른\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">not the same\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">same\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">together\u003c/b>\u003cspan class=\"m\">함께\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">with each other\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">alone\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">whole\u003c/b>\u003cspan class=\"m\">전체의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">all\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">part\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"비슷한 말과 반대말도 정리해 봐요. big은 large나 huge와 비슷하고 small과 반대예요. amazing은 wonderful과 비슷하고 boring과 반대죠. different는 same과 반대말이에요. together는 alone과 반대이고, whole은 all과 비슷해요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Arun56: 나는 살아요\u003c/span>\u003cspan class=\"en\">Arun56: I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">live\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나의 가족과 함께, 또한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">my \u003c/span>\u003cspan class=\"tgt\">family\u003c/span>, \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">too\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Arun56: 나도 가족들과 함께 살아.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아룬이 피터에게 '나도 가족과 함께 살아'라고 말하며 공통점을 찾는 부분이에요. \u003cb class=\"key\">가족\u003c/b>과 \u003cb class=\"key\">함께 \u003c/b>\u003cb class=\"key\">살아\u003c/b>를 말해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재 사실 말하기(일반동사 현재형)\u003c/span> : 누가(I) + 한다(live) + 어디에(with my family) : \"살아요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">함께하는 짝꿍 말(전치사 with)\u003c/span> : with + 사람 = ~와 함께 : \"나의 가족과 함께\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">또한을 더하는 말(부사 too)\u003c/span> : 문장 끝 + too = ~도, 또한 : \"또한, 역시\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Arun56: I live, Arun56: 나는 살아요. with my family, too, 나의 가족과 함께, 또한. 이 문장 전체를 해석하면, Arun56: 나도 가족들과 함께 살아.","hl":"m"},{"n":13,"text":"아룬이 피터에게 나도 가족과 함께 산다고 말해요. 앞에서 피터가 가족 이야기를 했기 때문에 '나도'라고 가족과 함께 살아를 이어 말하는 거예요.","hl":"mn"},{"n":14,"text":"첫 번째로, live는 지금도 계속 사는 현재 사실을 말해요. 주어 I 뒤에는 동사 live를 그대로 써요. 두 번째로, with는 함께라는 뜻을 더하는 전치사예요. 그래서 with my family는 나의 가족과 함께가 돼요. 세 번째로, too는 문장 끝에서 또한이라는 뜻을 더해요. 앞사람과 같은 점을 말할 때 써요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 가족은\u003c/span>\u003cspan class=\"en\">My family\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정말 대가족이에요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">really \u003c/span>\u003cspan class=\"tgt\">big\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리 가족은 정말 대가족이야.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 가족 수가 아주 많다는 것을 알려 주는 중심 문장이에요. '정말 \u003cb class=\"key\">대가족\u003c/b>이야'라고 가족의 크기를 강조해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">am·are·is 친구들(be동사)\u003c/span> : 주어(My family) + is + 형용사(big) : \"~이에요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부사가 형용사를 꾸며 주기(부사 + 형용사)\u003c/span> : really(정말) + big(큰) = 정말 큰 : \"정말 큰\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"My family, 우리 가족은. is really big, 정말 대가족이에요. 이 문장 전체를 해석하면, 우리 가족은 정말 대가족이야.","hl":"m"},{"n":16,"text":"가족 수가 아주 많다는 것을 알려 주는 중심 문장이에요. '정말 대가족이야'라고 가족의 크기를 강조해요.","hl":"mn"},{"n":17,"text":"첫 번째로, is는 be동사예요. 가족을 하나의 덩어리로 생각해서 is를 쓰고, 우리 가족은 어떤 상태인지 말해요. 두 번째로, really는 big을 더 세게 꾸며 줘요. 그래서 really big은 그냥 큰이 아니라 정말 큰이라는 느낌이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">약 ~이 있어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">are\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">about \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">서른 명의 사람들\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">thirty \u003c/span>\u003cspan class=\"tgt\">people\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">약 30명의 사람들이 있거든.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 가족이 약 \u003cb class=\"key\">서른 \u003c/b>\u003cb class=\"key\">명\u003c/b>이나 된다고 말해요. 그래서 앞에서 말한 '정말 큰 가족'을 숫자로 보여 주는 부분이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">있어요 표현(There is/are)\u003c/span> : There are + 여러 개 = ~들이 있어요 : \"~들이 있어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수량 표현(about + 숫자)\u003c/span> : about + 숫자 + people = 약 ~명의 사람들 : \"약 서른 명의 사람들\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"There are about, 약 ~이 있어요. thirty people, 서른 명의 사람들. 이 문장 전체를 해석하면, 약 30명의 사람들이 있거든.","hl":"m"},{"n":19,"text":"가족이 약 서른 명이나 된다고 말해요. 그래서 앞에서 말한 '정말 큰 가족'을 숫자로 보여 주는 부분이에요.","hl":"mn"},{"n":20,"text":"첫 번째로, There are는 있어요를 말하는 표현이에요. 사람들이 여러 명 있어서 are를 써요. 한 개면 is, 여러 개면 are예요. 두 번째로, about은 숫자 앞에서 약이라는 뜻을 더해요. people은 사람들이라는 복수 말이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나의 부모님,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">My \u003c/span>\u003cspan class=\"tgt\">parents\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여자형제들, 남자형제들,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">sisters, \u003c/span>\u003cspan class=\"tgt\">brothers\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">조부모님, 삼촌들,\u003c/span>\u003cspan class=\"en\">grandparents, uncles,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고모들, 그리고 사촌들...\u003c/span>\u003cspan class=\"en\">aunts, \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">cousins\u003c/span>...\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">부모님, 여자형제들, 남자형제들, 조부모님, 삼촌들, 고모들, 그리고 사촌들...\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 가족이 얼마나 많은지 \u003cb class=\"key\">가족 \u003c/b>\u003cb class=\"key\">구성원\u003c/b>을 부모님부터 사촌까지 쭉 \u003cb class=\"key\">나열\u003c/b>해서 말해요. 그래서 가족이 아주 크다는 게 느껴져요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">내 것 표시(소유격)\u003c/span> : 나의(My) + 가족 이름(parents) : \"나의 부모님\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">여러 명일 때 -s(복수)\u003c/span> : 한 명(sister) + 여러 명(sisters) : \"여자형제들, 남자형제들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : aunts + and + cousins : \"그리고 사촌들\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"My parents, 나의 부모님. sisters, brothers, 여자형제들, 남자형제들. grandparents, uncles, 조부모님, 삼촌들. aunts, and cousins, 고모들, 그리고 사촌들.... 이 문장 전체를 해석하면, 부모님, 여자형제들, 남자형제들, 조부모님, 삼촌들, 고모들, 그리고 사촌들...","hl":"m"},{"n":22,"text":"이 문장은 가족이 아주 많다는 걸 보여 줘요. 부모님부터 사촌까지 가족 이름을 쭉 늘어놓아서 얼마나 대가족인지 짐작할 수 있어요.","hl":"mn"},{"n":23,"text":"첫 번째, My는 나의라는 뜻으로 누구의 가족인지 알려 주는 소유격이에요. 두 번째, sisters나 brothers처럼 여러 명을 말할 때는 이름 뒤에 s를 붙여요. 이걸 복수라고 해요. 세 번째, 마지막 가족 앞에는 and를 넣어 그리고로 이어 줘요. 이렇게 말을 이어 주는 말을 접속사라고 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">피터:\u003c/span>\u003cspan class=\"en\">Peter012:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">서른 명?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Thirty?\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Peter012: 30명?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 친구 가족이 서른 명이라는 말을 듣고 깜짝 놀라서 다시 물어요. 짧게 \u003cb class=\"key\">되묻기\u003c/b>만 해도 놀라운 마음이 잘 보여요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">짧게 되묻기(의문문)\u003c/span> : Thirty + ? (끝을 올려 읽기) : \"서른 명?\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Peter012, 피터:. Thirty?, 서른 명?. 이 문장 전체를 해석하면, Peter012: 30명?","hl":"m"},{"n":25,"text":"친구가 가족이 서른 명이라고 하니까 피터가 깜짝 놀라서 되물어요. 아주 짧지만 놀라움이 가득한 문장이에요.","hl":"mn"},{"n":26,"text":"여기서는 Thirty? 하고 그 말만 끝을 올려 읽으면 돼요. 상대가 한 말을 그대로 다시 물을 때 이렇게 짧게 되묻는 의문문을 써요. 여러분도 놀라운 말을 들으면 이렇게 짧게 되물어 보세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그건\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">That's\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">놀라워요!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">amazing\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그거 놀랍다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 가족이 서른 명이라는 말을 듣고 \u003cb class=\"key\">놀라움\u003c/b>을 크게 표현해요. 짧지만 \u003cb class=\"key\">감탄\u003c/b>하는 마음이 잘 담긴 말이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사 줄임말(be동사)\u003c/span> : That + is = That's : \"그건 ~이에요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">느낌을 말하는 말(형용사)\u003c/span> : That's + amazing(놀라운) : \"놀라운\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"That's, 그건. amazing!, 놀라워요!. 이 문장 전체를 해석하면, 그거 놀랍다!","hl":"m"},{"n":28,"text":"가족이 서른 명이라는 말을 듣고 피터가 정말 놀랐어요. 짧지만 신기하고 부러운 마음이 잘 담긴 문장이에요.","hl":"mn"},{"n":29,"text":"첫 번째, That's는 That is를 짧게 줄인 말이에요. be동사가 이렇게 줄어들면 말할 때 훨씬 편해요. 두 번째, amazing은 놀랍다는 뜻으로 That이 어떤지 느낌을 알려 주는 형용사예요. 여러분도 신기한 것을 봤을 때 That's amazing이라고 말해 보세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">너는 가지고 있니\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Do \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">have\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 반려동물이라도\u003c/span>\u003cspan class=\"en\">any pets?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">너는 반려동물이 있니?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Peter012가 Arun56에게 \u003cb class=\"key\">반려동물\u003c/b>이 있는지 물어보는 말이에요. 대화를 이어 가려고 가볍게 던진 \u003cb class=\"key\">질문\u003c/b>이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">묻는 말 만들기(일반동사 의문문)\u003c/span> : 돕는 말(Do) + 너는(you) + 가지다(have) + 무엇을(any pets)? : \"너는 가지고 있니\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Do you have, 너는 가지고 있니. any pets?, 어떤 반려동물이라도. 이 문장 전체를 해석하면, 너는 반려동물이 있니?","hl":"m"},{"n":31,"text":"Peter가 Arun에게 반려동물이 있는지 물어보는 장면이에요. 짧지만 아주 자주 쓰는 질문 표현이죠.","hl":"mn"},{"n":32,"text":"여러분, 일반동사로 물어볼 때는 앞에 Do를 세워요. 첫 번째, 문장 맨 앞에 Do를 놓아요. 두 번째, 그다음에 너는, 즉 you를 두고 동사 have를 붙여요. 그래서 Do you have any pets?가 되고, 뜻은 너는 반려동물이 있니가 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아니, 하지만\u003c/span>\u003cspan class=\"en\">Arun56: No, \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">but\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 농장 동물들이 있어\u003c/span>\u003cspan class=\"en\">we have farm animals\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">소, 닭, 돼지 같은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">like\u003c/span> cows, chickens, and pigs.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Arun56: 아니, 하지만 소, 닭, 돼지 같은 농장 동물들이 있어.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 반려동물은 없다고 말하면서, 대신 \u003cb class=\"key\">농장 \u003c/b>\u003cb class=\"key\">동물\u003c/b>을 키운다고 알려 줘요. '없다'로 끝내지 않고 \u003cb class=\"key\">대신\u003c/b> 있는 것을 말해 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 앞 말(No) + 이어 주는 말(but) + 뒤 말(we have farm animals) : \"그렇지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">~같은(전치사)\u003c/span> : 동물(farm animals) + 같은(like) + 소, 닭, 돼지(cows, chickens, and pigs) : \"~같은\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"No, but, 아니, 하지만. we have farm animals, 우리는 농장 동물들이 있어. like cows, chickens, and pigs, 소, 닭, 돼지 같은. 이 문장 전체를 해석하면, Arun56: 아니, 하지만 소, 닭, 돼지 같은 농장 동물들이 있어.","hl":"m"},{"n":34,"text":"반려동물은 없지만 농장 동물을 키운다고 말하는 장면이에요. 없다고만 하지 않고 대신 있는 것을 알려 주죠.","hl":"mn"},{"n":35,"text":"여러분, 여기서 but은 이어 주는 말이에요. 첫 번째, 아니라고 대답한 뒤 but으로 이어서 다른 이야기를 붙여요. 두 번째, like는 여기서 좋아하다가 아니라 같은이라는 뜻이에요. 그래서 farm animals like cows는 소 같은 농장 동물이라는 뜻이 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 13\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 가족 모두가\u003c/span>\u003cspan class=\"en\">My whole family\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들을 돌보지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">takes \u003c/span>\u003cspan class=\"tgt\">care \u003c/span>\u003cspan class=\"tgt\">of\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">them\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">함께\u003c/span>\u003cspan class=\"en\">together.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리 가족 모두가 그것들을 함께 돌보지.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 농장 동물들을 가족 모두가 \u003cb class=\"key\">함께\u003c/b> 돌본다는 말이에요. 가족이 힘을 모아 \u003cb class=\"key\">돌본다\u003c/b>는 따뜻한 느낌을 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">한 사람·한 개일 때 동사 + s(3인칭 단수)\u003c/span> : 가족 모두(My whole family) + 돌봐요(takes care of) + 그것들을(them) : \"돌보지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">대신하는 말(대명사)\u003c/span> : 가리키는 것(농장 동물들) + 대신하는 말(them) : \"그것들을\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"My whole family, 우리 가족 모두가. takes care of them, 그것들을 돌보지. together, 함께. 이 문장 전체를 해석하면, 우리 가족 모두가 그것들을 함께 돌보지.","hl":"m"},{"n":37,"text":"Arun네 가족 모두가 농장 동물들을 함께 돌본다는 이야기예요. 다 같이 힘을 모은다는 따뜻한 느낌이 들죠.","hl":"mn"},{"n":38,"text":"여러분, 가족 모두처럼 여럿을 하나로 묶은 말은 한 사람처럼 다뤄요. 첫 번째, 동사 take에 s를 붙여 takes로 만들어요. 두 번째, take care of는 돌보다라는 하나의 덩어리 표현이에요. 세 번째, them은 앞에 나온 농장 동물들을 대신하는 말이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">피터012: 우리는 살아요\u003c/span>\u003cspan class=\"en\">Peter012: \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">We \u003c/span>\u003cspan class=\"tgt\">live\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아주 다른 장소들에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">really \u003c/span>\u003cspan class=\"tgt\">different \u003c/span>\u003cspan class=\"tgt\">places\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Peter012: 우리는 아주 다른 장소에 살고 있네.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 피터는 두 사람이 사는 곳이 아주 \u003cb class=\"key\">다르다\u003c/b>고 말해요. 아룬의 큰 가족과 농장 이야기와 비교하며 \u003cb class=\"key\">다른 \u003c/b>\u003cb class=\"key\">장소\u003c/b>에 산다는 점을 짚는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재 사실 말하기(현재 시제)\u003c/span> : 누가(We) + 살아요(live) : \"우리는 살아요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소를 알려 주는 짝꿍 말(전치사)\u003c/span> : in + 장소(places) : \"아주 다른 장소들에\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"Peter012: We live, 피터012: 우리는 살아요. in really different places, 아주 다른 장소들에. 이 문장 전체를 해석하면, Peter012: 우리는 아주 다른 장소에 살고 있네.","hl":"m"},{"n":40,"text":"피터는 두 사람이 사는 곳이 아주 다르다, 이렇게 말해요. 아룬의 큰 가족과 농장 이야기와 비교하며 다른 장소에 산다는 점을 짚는 거예요.","hl":"mn"},{"n":41,"text":"첫 번째, We live는 지금도 사는 곳을 말하니까 현재 시제를 써요. 주어 We에는 동사에 s를 붙이지 않아요. 두 번째, in really different places에서 장소 앞에 전치사 in을 써서 '~에'라는 뜻을 만들어요. really는 different를 더 세게 꾸며 주는 말이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 우리는 가지고 있어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">But\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">have\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몇 가지 것들을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">some \u003c/span>\u003cspan class=\"tgt\">things\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공통으로\u003c/span>\u003cspan class=\"en\">in common.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 우리는 몇 가지 공통점을 갖고 있구나.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사는 곳은 달라도 둘에게는 \u003cb class=\"key\">공통점\u003c/b>이 있다고 말해요. \u003cb class=\"key\">하지만\u003c/b>으로 앞 내용과 반대되는 생각을 이어 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 앞 문장 + but + 반대 문장 : \"하지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재 사실 말하기(현재 시제)\u003c/span> : 누가(we) + 가지고 있다(have) : \"우리는 가지고 있어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">셀 수 있는 것에 쓰는 수량 표현(some + 복수 명사)\u003c/span> : some + 복수 명사(things) : \"몇 가지 것들\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"But we have, 하지만 우리는 가지고 있어요. some things, 몇 가지 것들을. in common, 공통으로. 이 문장 전체를 해석하면, 하지만 우리는 몇 가지 공통점을 갖고 있구나.","hl":"m"},{"n":43,"text":"사는 곳은 달라도 둘에게는 공통점이 있다고 말해요. 하지만, 앞 내용과 반대되는 생각을 이어 주는 문장이에요.","hl":"mn"},{"n":44,"text":"첫 번째, but은 앞에서 말한 내용과 반대되는 생각을 이어 줄 때 써요. 여기서는 사는 곳은 다르지만이라는 뜻을 만들어요. 두 번째, we have는 지금 둘에게 있는 공통점을 말하니까 현재 시제로 써요. 세 번째, some things에서 some은 셀 수 있는 것 앞에 붙어 몇 가지라는 뜻을 만들고, things는 여러 개라서 복수 모양이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아룬56: 나는 느껴요\u003c/span>\u003cspan class=\"en\">Arun56: \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">feel\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">같은 생각이야!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">same\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Arun56: 나도 같은 생각이야!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아룬도 피터의 말에 \u003cb class=\"key\">동의\u003c/b>해요. 둘에게 공통점이 있다는 말에 나도 같은 생각이야라고 \u003cb class=\"key\">화답\u003c/b>하는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재 마음 말하기(현재 시제)\u003c/span> : 누가(I) + 느낀다(feel) : \"나는 느껴요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">같은 것을 가리키는 표현(the same)\u003c/span> : the same = 같은 것 : \"같은 생각, 같은 것\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"Arun56: I feel, 아룬56: 나는 느껴요. the same!, 같은 생각이야!. 이 문장 전체를 해석하면, Arun56: 나도 같은 생각이야!","hl":"m"},{"n":46,"text":"아룬도 피터의 말에 동의해요. 둘에게 공통점이 있다는 말에 나도 같은 생각이야라고 화답하는 문장이에요.","hl":"mn"},{"n":47,"text":"첫 번째, I feel은 지금 드는 생각과 마음을 말하니까 현재 시제로 써요. 주어 I에는 동사에 s를 붙이지 않아요. 두 번째, the same은 앞에서 나온 말과 똑같다는 뜻을 짧게 말할 때 써요. 그래서 나도 같은 생각이야라는 공감 표현이 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 13\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어쨌든,\u003c/span>\u003cspan class=\"en\">After all,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 살아요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">live\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">같은 행성에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">same \u003c/span>\u003cspan class=\"tgt\">planet\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어쨌든, 우리는 같은 행성에 사니까.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 서로 다른 곳에 살아도 \u003cb class=\"key\">같은 \u003c/b>\u003cb class=\"key\">행성\u003c/b>에 살고 있다는 걸 알려 줘요. 그래서 우리에게는 \u003cb class=\"key\">공통점\u003c/b>이 있다는 걸 마무리로 강조해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지금 사실 말하기(현재 시제)\u003c/span> : 누가(We) + 살아요(live) + 같은 행성에 : \"우리는 살아요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소 짝꿍 말(전치사)\u003c/span> : 살아요(live) + on + 장소(같은 행성) : \"같은 행성에\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"After all, 어쨌든. we live, 우리는 살아요. on the same planet, 같은 행성에. 이 문장 전체를 해석하면, 어쨌든, 우리는 같은 행성에 사니까.","hl":"m"},{"n":49,"text":"이 문장은 서로 다른 곳에 살아도 결국 같은 행성에 살고 있다는 걸 말해요. 그래서 우리에게는 공통점이 있다는 걸 마무리로 강조하는 문장이에요.","hl":"mn"},{"n":50,"text":"먼저 we live는 지금도 늘 그런 사실을 말하는 현재 시제예요. 주어 we는 여러 명이라서 live에 s를 붙이지 않아요. 두 번째로 on the same planet에서 on은 장소를 나타내는 전치사예요. 같은 행성 위에 있다는 장소를 딱 잡아 주죠.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">오늘 배운 내용 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>아룬은 약 30명이 함께 사는 \u003cb class=\"key\">대가족\u003c/b>을 소개해요.\u003c/li>\u003cli>아룬의 가족은 소, 닭, 돼지 같은 \u003cb class=\"key\">농장 \u003c/b>\u003cb class=\"key\">동물\u003c/b>을 함께 \u003cb class=\"key\">돌봐요\u003c/b>.\u003c/li>\u003cli>피터는 사는 곳이 \u003cb class=\"key\">다르다\u003c/b>는 걸 알지만 \u003cb class=\"key\">공통점\u003c/b>을 찾아요.\u003c/li>\u003cli>둘은 결국 같은 \u003cb class=\"key\">행성\u003c/b>에 산다고 말해요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Two friends live in different places and have different families, but they have things in common and share the same planet.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: 아룬은 약 30명이 함께 사는 \u003cb class=\"key\">대가족\u003c/b>과 \u003cb class=\"key\">농장 \u003c/b>\u003cb class=\"key\">동물\u003c/b>을 소개해요. 피터는 사는 곳은 달라도 \u003cb class=\"key\">공통점\u003c/b>이 있다고 말하고, 둘은 같은 \u003cb class=\"key\">행성\u003c/b>에 산다는 걸 확인해요.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":51,"text":"오늘 우리는 두 친구의 대화를 읽었어요. 가족 수와 사는 곳은 달라도 공통점을 찾고 같은 행성에 산다는 걸 알았죠. 여러분도 오늘 배운 take care of와 in common을 꼭 기억해요. 정말 잘했어요, 다음 시간에 또 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
