lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"왓츠 리딩 100A Ch.2 Unit 04 Jim Crow Laws","audioDir":"reading04_audio","preview":false,"count":54,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.520em\">Ch.2 Unit\u003cbr>04 Jim\u003cbr>Crow Laws\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">왓츠 리딩 100A\u003c/div>\u003ch1>Jim Crow Laws: Unfair Laws in America\u003c/h1>\u003ch2>Jim Crow 법: 미국의 불공평한 법\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">한 줄 요약\u003c/span>\u003cspan>이 글은 1960년대 이전 미국에 있던 \u003cb class=\"key\">Jim \u003c/b>\u003cb class=\"key\">Crow \u003c/b>\u003cb class=\"key\">laws\u003c/b>가 유색 인종에게 불공평했던 법이라고 설명해요. 식당, 역, 학교에서 \u003cb class=\"key\">분리\u003c/b>가 있었고, 많은 아프리카계 미국인이 \u003cb class=\"key\">투표\u003c/b>를 못 했지만 1960년대에 그 법은 \u003cb class=\"key\">불법\u003c/b>이 되었어요.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Jim Crow laws were unfair laws that separated people of color from white people, but they became illegal in the 1960s.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘도 즐겁게 영어 지문을 읽어 볼까요? 오늘은 미국의 Jim Crow laws에 관한 글을 읽을 거예요. 이 글은 유색 인종에게 불공평했던 법과 그 법이 없어진 이야기를 담고 있어요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">미리 알면 쉬워요\u003c/span>\u003cdiv class=\"lp-box\">\u003cb class=\"key\">Jim \u003c/b>\u003cb class=\"key\">Crow\u003c/b>는 노래에 나오는 아프리카계 미국인 인물 이름이에요. 그 이름을 딴 \u003cb class=\"key\">Jim \u003c/b>\u003cb class=\"key\">Crow \u003c/b>\u003cb class=\"key\">laws\u003c/b>는 유색 인종을 \u003cb class=\"key\">백인\u003c/b>과 떨어뜨려 놓은 불공평한 법이었어요. 우리 학교에서 친구마다 \u003cb class=\"key\">화장실\u003c/b>을 따로 써야 한다면 기분이 어떨까요? 이렇게 사람을 다르게 대하는 것을 \u003cb class=\"key\">차별\u003c/b>이라고 해요. 관련 영어 단어 unfair와 illegal을 함께 기억해 두세요.\u003c/div>","segs":[{"n":2,"text":"Jim Crow는 노래에 나오는 아프리카계 미국인 인물 이름이에요. 그 이름을 딴 Jim Crow laws는 유색 인종을 백인과 떨어뜨려 놓은 불공평한 법이었어요. 여러분, 만약 우리 학교에서 친구마다 화장실을 따로 써야 한다면 기분이 어떨까요? 이렇게 사람을 다르게 대하는 것을 차별이라고 해요. unfair는 불공평한, illegal은 불법인이라는 뜻도 함께 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>법의 시작\u003csmall>소개 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>1960년대 이전, 미국에는 \u003cb class=\"key\">Jim \u003c/b>\u003cb class=\"key\">Crow \u003c/b>\u003cb class=\"key\">laws\u003c/b>가 있었어요. Jim Crow는 노래 속 \u003cb class=\"key\">아프리카계 \u003c/b>\u003cb class=\"key\">미국인\u003c/b> 인물 이름이었고, 이 법은 유색 인종에게 \u003cb class=\"key\">불공평\u003c/b>했어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>나뉜 생활\u003csmall>예시 · 문장 4–10\u003c/small>\u003c/h4>\u003cp>법은 유색 인종을 \u003cb class=\"key\">백인\u003c/b>과 떨어뜨려 놓았어요. 식당, 역, 학교 같은 곳에서 \u003cb class=\"key\">분리\u003c/b>된 시설을 써야 했어요. 예를 들어 \u003cb class=\"key\">다른 \u003c/b>\u003cb class=\"key\">문\u003c/b>과 다른 대기실, 다른 매표소가 있었어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>투표와 이주\u003csmall>결과 · 문장 11–13\u003c/small>\u003c/h4>\u003cp>많은 아프리카계 미국인은 \u003cb class=\"key\">투표\u003c/b>를 할 수 없었어요. 그래서 약 \u003cb class=\"key\">육백만 \u003c/b>\u003cb class=\"key\">명\u003c/b>이 북부와 서부로 \u003cb class=\"key\">이주\u003c/b>했어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>법의 종결\u003csmall>마무리 · 문장 14\u003c/small>\u003c/h4>\u003cp>마침내 1960년대에 Jim Crow laws는 \u003cb class=\"key\">불법\u003c/b>이 되었어요. 그래서 더 이상 합법적인 \u003cb class=\"key\">차별\u003c/b>이 아니게 되었어요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 따라가며 Jim Crow laws가 어떻게 시작되고 바뀌었는지 알아 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 법의 시작이에요. 천구백육십 년대 이전, 미국에는 Jim Crow laws가 있었어요. Jim Crow는 노래 속 아프리카계 미국인 인물 이름이었고, 이 법은 유색 인종에게 아주 불공평했어요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 나뉜 생활이에요. 법은 유색 인종을 백인과 떨어뜨려 놓았어요. 식당, 역, 학교 같은 곳에서 분리된 시설을 써야 했어요. 예를 들어 다른 문과 다른 대기실, 다른 매표소가 있었어요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 투표와 이주예요. 많은 아프리카계 미국인은 투표를 할 수 없었어요. 그래서 약 육백만 명이 북부와 서부로 이주했어요.","hl":"f2"},{"n":7,"text":"네 번째 단계는 법의 종결이에요. 마침내 천구백육십 년대에 Jim Crow laws는 불법이 되었어요. 그래서 더 이상 합법적인 차별이 아니게 되었어요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">설명하기\u003c/span>\u003cspan class=\"lp-pill\">처음\u003c/span>\u003cspan class=\"lp-pill\">주제문 3번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">처음에 \u003cb class=\"key\">Jim \u003c/b>\u003cb class=\"key\">Crow \u003c/b>\u003cb class=\"key\">laws\u003c/b>가 무엇인지 알려 주고, 가운데에서 \u003cb class=\"key\">예시\u003c/b>를 들어 설명해요. 마지막에는 법이 \u003cb class=\"key\">불법\u003c/b>이 되었다는 결과로 끝나요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Before (1)\u003c/b>\u003cspan>때를 알려 줌\u003c/span>\u003cb>For example (5)\u003c/b>\u003cspan>예시를 알려 줌\u003c/span>\u003cb>Because (13)\u003c/b>\u003cspan>이유를 알려 줌\u003c/span>\u003cb>Finally (14)\u003c/b>\u003cspan>마지막을 알려 줌\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Jim Crow laws\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">unfair laws\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the laws\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>백인\u003c/th>\u003cth>유색 인종\u003c/th>\u003c/tr>\u003ctr>\u003ctd>식당을 이용할 수 있었음\u003c/td>\u003ctd>식당을 이용할 수 없었음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>같은 학교에 다님\u003c/td>\u003ctd>다른 학교에 다녀야 했음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>같은 문과 대기실을 씀\u003c/td>\u003ctd>다른 문과 대기실을 씀\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 설명하는 글이에요. 처음에 Jim Crow laws가 무엇인지 알려 주고, 가운데에서 예시를 들어 설명한 뒤, 마지막에 불법이 되었다는 결과로 끝나요. 중심 문장은 글의 처음에 나와요.","hl":"ty"},{"n":9,"text":"길잡이 말을 보면 글의 흐름이 잘 보여요. Before는 때를 알려 주고, For example은 예시를 알려 주고, Because는 이유를 알려 주고, Finally는 마지막을 알려 줘요. 같은 법을 Jim Crow laws, unfair laws, the laws처럼 다르게 부르기도 해요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 단어\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>before\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~전에\u003c/span>\u003c/div>\u003cdiv>\u003cb>law\u003c/b>\u003cem>명사\u003c/em>\u003cspan>법\u003c/span>\u003c/div>\u003cdiv>\u003cb>character\u003c/b>\u003cem>명사\u003c/em>\u003cspan>인물\u003c/span>\u003c/div>\u003cdiv>\u003cb>unfair\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>불공평한\u003c/span>\u003c/div>\u003cdiv>\u003cb>people of color\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>유색 인종\u003c/span>\u003c/div>\u003cdiv>\u003cb>for example\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>예를 들어\u003c/span>\u003c/div>\u003cdiv>\u003cb>keep away from\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에게서 떨어뜨려 놓다\u003c/span>\u003c/div>\u003cdiv>\u003cb>serve\u003c/b>\u003cem>동사\u003c/em>\u003cspan>제공하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>only\u003c/b>\u003cem>부사\u003c/em>\u003cspan>오직\u003c/span>\u003c/div>\u003cdiv>\u003cb>mean\u003c/b>\u003cem>동사\u003c/em>\u003cspan>의미하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>different\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>다른\u003c/span>\u003c/div>\u003cdiv>\u003cb>waiting room\u003c/b>\u003cem>명사\u003c/em>\u003cspan>대기실\u003c/span>\u003c/div>\u003cdiv>\u003cb>ticket office\u003c/b>\u003cem>명사\u003c/em>\u003cspan>매표소\u003c/span>\u003c/div>\u003cdiv>\u003cb>have to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~해야 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>vote\u003c/b>\u003cem>동사\u003c/em>\u003cspan>투표하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>either\u003c/b>\u003cem>부사\u003c/em>\u003cspan>또한(부정문에서)\u003c/span>\u003c/div>\u003cdiv>\u003cb>begin\u003c/b>\u003cem>동사\u003c/em>\u003cspan>시작되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>move\u003c/b>\u003cem>동사\u003c/em>\u003cspan>이주하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>finally\u003c/b>\u003cem>부사\u003c/em>\u003cspan>마침내\u003c/span>\u003c/div>\u003cdiv>\u003cb>illegal\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>불법인\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"오늘의 단어를 소리 내어 읽어 볼게요. unfair는 불공평한, illegal은 불법인, vote는 투표하다는 뜻이에요. keep away from은 누군가에게서 떨어뜨려 놓다라는 뜻으로 기억해요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">unfair\u003c/b>\u003cspan class=\"m\">불공평한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">not fair\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">fair\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">different\u003c/b>\u003cspan class=\"m\">다른\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">not the same\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">same\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">keep away from\u003c/b>\u003cspan class=\"m\">~에게서 떨어뜨려 놓다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">stay away from\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">come near\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">illegal\u003c/b>\u003cspan class=\"m\">불법인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">not allowed\u003c/span>\u003cspan class=\"s\">against the law\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">legal\u003c/span>\u003cspan class=\"a\">allowed\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">finally\u003c/b>\u003cspan class=\"m\">마침내\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">at last\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">first\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"비슷한 말과 반대말도 같이 익혀 볼게요. unfair의 반대말은 fair이고, different의 반대말은 same이에요. illegal은 legal의 반대말이고, finally는 at last와 비슷해요. 이렇게 짝을 지어 외우면 더 오래 기억에 남아요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1960년대 이전에,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Before \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">1960s\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~이 있었어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">were\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Jim Crow 법이\u003c/span>\u003cspan class=\"en\">Jim Crow laws\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미국에는\u003c/span>\u003cspan class=\"en\">in America.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">1960년대 이전에 미국에는 Jim Crow 법이 있었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 미국에 Jim Crow 법이 있었다는 것을 \u003cb class=\"key\">때\u003c/b>와 \u003cb class=\"key\">장소\u003c/b>를 함께 말해 알려 줘요. 이 글에서 다룰 \u003cb class=\"key\">주제\u003c/b>를 처음 꺼내는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">때 짝꿍 말(전치사)\u003c/span> : Before + 때 (~ 이전에) : \"1960년대 이전에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">있었다(There is/are 과거형)\u003c/span> : There were + 복수명사 (~들이 있었다) : \"~이 있었어요\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Before the 1960s, 1960년대 이전에. there were, ~이 있었어요. Jim Crow laws, Jim Crow 법이. in America, 미국에는. 이 문장 전체를 해석하면, 1960년대 이전에 미국에는 Jim Crow 법이 있었습니다.","hl":"m"},{"n":13,"text":"이 문장은 미국에 Jim Crow 법이 있었다는 걸 알려 줘요. 때와 장소를 함께 말해서 이 글이 어떤 주제인지 미리 보여 주는 문장이에요.","hl":"mn"},{"n":14,"text":"문법은 두 가지만 짚어 볼게요. 첫째, there were는 무엇이 있었다고 말할 때 쓰는 표현이에요. 여기서는 지난 일이라서 과거 모양인 were를 썼어요. 둘째, before는 때를 알려 주는 전치사예요. 시간 순서를 콕 집어 주는 짝꿍 말이죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘Jim Crow’는 ~이었어요\u003c/span>\u003cspan class=\"en\">&quot;Jim Crow&quot; \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아프리카계 미국인 인물\u003c/span>\u003cspan class=\"en\">an African American character\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">노래에 나오는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">song\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">'Jim Crow'는 노래에 나오는 아프리카계 미국인 인물이었어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Jim Crow라는 \u003cb class=\"key\">이름\u003c/b>이 어디서 왔는지 알려 줘요. 노래에 나오는 \u003cb class=\"key\">인물\u003c/b> 이름이었다는 걸 쉽게 풀어 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">~이었다(be동사 과거형)\u003c/span> : 주어 + was + 명사 (~이었어요) : \"~이었어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소를 알려 주는 말(전치사)\u003c/span> : in + a song (노래 속에) : \"노래에 나오는\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"\"Jim Crow\" was, ‘Jim Crow’는 ~이었어요. an African American character, 아프리카계 미국인 인물. in a song, 노래에 나오는. 이 문장 전체를 해석하면, 'Jim Crow'는 노래에 나오는 아프리카계 미국인 인물이었어요.","hl":"m"},{"n":16,"text":"이 문장은 Jim Crow라는 이름이 어디서 왔는지 알려 줘요. 노래에 나오는 인물 이름이었다는 걸 알 수 있죠.","hl":"mn"},{"n":17,"text":"문법도 두 가지예요. 첫째, was는 be동사의 과거 모양이에요. 지난 일을 말할 때 am, are, is 대신 was, were를 써요. 둘째, in은 전치사예요. 노래 속에 나오는 인물이라고 알려 주는 짝꿍 말이죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 14\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Jim Crow 법은 ~이었어요\u003c/span>\u003cspan class=\"en\">Jim Crow laws \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">were\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">불공평한 법이었어요\u003c/span>\u003cspan class=\"en\">unfair laws\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유색 인종에게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">color\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들어,\u003c/span>\u003cspan class=\"en\">for example,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아프리카계 미국인들에게요.\u003c/span>\u003cspan class=\"en\">African Americans.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Jim Crow 법은 유색 인종, 예를 들어 아프리카계 미국인들에게 불공평한 법이었어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Jim Crow 법이 어떤 \u003cb class=\"key\">법\u003c/b>이었는지 딱 알려 주는 문장이에요. 유색 인종에게 \u003cb class=\"key\">불공평\u003c/b>한 법이었다는 걸 예를 들어 설명해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">~이었다(be동사 과거형)\u003c/span> : 주어(Jim Crow laws) + were + 명사(unfair laws) : \"불공평한 법이었어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 for\u003c/span> : for + 사람(people of color) (~에게) : \"유색 인종에게\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Jim Crow laws were, Jim Crow 법은 ~이었어요. unfair laws, 불공평한 법이었어요. for people of color, 유색 인종에게. for example, 예를 들어. African Americans, 아프리카계 미국인들에게요.. 이 문장 전체를 해석하면, Jim Crow 법은 유색 인종, 예를 들어 아프리카계 미국인들에게 불공평한 법이었어요.","hl":"m"},{"n":19,"text":"이 문장은 Jim Crow 법이 어떤 법이었는지 딱 알려 줘요. 유색 인종에게 불공평한 법이었다는 걸 예를 들어 설명하고 있어요. 이 문장은 꼭 외워 두면 좋아요.","hl":"mn"},{"n":20,"text":"문법을 두 가지 짚어 볼게요. 첫째, were는 be동사의 과거 모양이에요. 주어가 여러 개라서 were를 썼어요. 둘째, for는 전치사예요. 누구에게 불공평했는지 대상을 알려 주는 말이죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 법은\u003c/span>\u003cspan class=\"en\">The laws\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들을 멀리 떨어지게 했죠\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">kept\u003c/span> them away\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">백인들에게서요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">white \u003c/span>\u003cspan class=\"tgt\">people\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 법은 그들을 백인들에게 가까이 가지 못하게 했죠.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 짐 크로 법이 유색 인종을 백인들과 \u003cb class=\"key\">떨어져\u003c/b> 있게 만들었다는 뜻이에요. 법이 \u003cb class=\"key\">차별\u003c/b>을 만들었다는 걸 보여 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거형(과거형)\u003c/span> : 지난 일: 주어(The laws) + 동사(kept) + 누구를(them) : \"멀리 있게 했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소·시간 짝꿍 말(전치사)\u003c/span> : away from + 무엇(white people) = 무엇에게서 떨어져 : \"백인들에게서 (떨어져)\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"The laws, 그 법은. kept them away, 그들을 멀리 떨어지게 했죠. from white people, 백인들에게서요. 이 문장 전체를 해석하면, 그 법은 그들을 백인들에게 가까이 가지 못하게 했죠.","hl":"m"},{"n":22,"text":"이 문장은 그 법이 유색 인종을 백인들과 떨어져 있게 만들었다는 뜻이에요. 법이 차별을 만들었다는 걸 보여 주는 문장이죠.","hl":"mn"},{"n":23,"text":"첫 번째, kept는 지난 일을 말하는 과거형이에요. keep은 계속 어떤 상태로 두다는 뜻인데, 지난 일이라 kept로 바뀌었어요. 두 번째, from은 ~로부터라는 뜻으로 거리를 나타내요. away from을 붙여서 멀리 떨어져라고 통째로 기억해 두면 좋아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들어\u003c/span>\u003cspan class=\"en\">For example,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몇몇 식당들은\u003c/span>\u003cspan class=\"en\">some restaurants\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">백인들에게만 음식을 제공했습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">served\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">only\u003c/span> white people.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">예를 들어, 몇몇 식당들은 백인들에게만 음식을 제공했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 법 때문에 실제로 식당에서 \u003cb class=\"key\">차별\u003c/b>이 있었다는 것을 보여 주는 \u003cb class=\"key\">예시\u003c/b>예요. 앞 문장을 구체적인 예로 풀어 주는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거형(과거형)\u003c/span> : 지난 일: 주어(restaurants) + 동사(served) + 누구에게(white people) : \"제공했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">더 자세히 알려 주는 말(부사)\u003c/span> : only + 무엇(white people) = 무엇만 : \"오직 백인들에게만\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"For example, 예를 들어. some restaurants, 몇몇 식당들은. served only white people, 백인들에게만 음식을 제공했습니다. 이 문장 전체를 해석하면, 예를 들어, 몇몇 식당들은 백인들에게만 음식을 제공했습니다.","hl":"m"},{"n":25,"text":"이 문장은 법 때문에 실제로 식당에서 차별이 있었다는 것을 보여 주는 예시예요. 예시를 들어서 설명하고 있죠.","hl":"mn"},{"n":26,"text":"첫 번째, served는 지난 일을 말하는 과거형이에요. serve에 -ed를 붙였죠. 두 번째, only는 범위를 좁혀 주는 말이에요. 그래서 백인들에게만이라고 뜻이 딱 정해져요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은 의미했어요\u003c/span>\u003cspan class=\"en\">This \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">meant\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유색 인종이\u003c/span>\u003cspan class=\"en\">people of color\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들을 이용할 수 없다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">could \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">use\u003c/span> them.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것은 유색 인종은 그 식당들을 이용할 수 없다는 것을 의미했어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 말한 식당 규칙 때문에 유색 인종이 그 식당들을 \u003cb class=\"key\">이용\u003c/b>할 수 없었다는 뜻이에요. 법이 어떤 \u003cb class=\"key\">결과\u003c/b>를 만들었는지 알려 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거형(과거형)\u003c/span> : 지난 일: 주어(This) + 동사(meant) : \"의미했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">도와주는 동사(조동사)\u003c/span> : could not + 동사원형(use) = ~할 수 없었다 : \"이용할 수 없었다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"This meant, 이것은 의미했어요. people of color, 유색 인종이. could not use them, 그것들을 이용할 수 없다는 것을. 이 문장 전체를 해석하면, 이것은 유색 인종은 그 식당들을 이용할 수 없다는 것을 의미했어요.","hl":"m"},{"n":28,"text":"앞에서 말한 식당 규칙 때문에 유색 인종이 그 식당들을 이용할 수 없었다는 뜻이에요. 그래서 어떤 결과가 생겼는지 알려 주는 문장이죠.","hl":"mn"},{"n":29,"text":"첫 번째, meant는 mean의 과거형이에요. 규칙대로 -ed를 붙이지 않는 불규칙 동사라서 꼭 외워 두세요. 두 번째, could는 can의 지난 모습이에요. 뒤에는 동사원형 use가 오고, not을 붙이면 할 수 없다는 뜻이 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 장소에는\u003c/span>\u003cspan class=\"en\">Every place\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">있었습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">had\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">두 개의 다른 문이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">two \u003c/span>\u003cspan class=\"tgt\">different \u003c/span>\u003cspan class=\"tgt\">doors\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">모든 장소에는 두 개의 다른 문이 있었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 장소마다 문이 두 개씩 따로 있었다는 말이에요. 흑백이 \u003cb class=\"key\">따로\u003c/b> 나뉘어 있던 생활을 아주 쉽게 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일을 말하는 과거형(과거형)\u003c/span> : 무엇이(Every place) + 가졌다(had) + 무엇을(two different doors) : \"있었습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">여러 개를 말하는 복수(복수)\u003c/span> : 둘 이상이면(doors) 이름 말 끝에 s : \"두 개의 다른 문들\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Every place, 모든 장소에는. had, 있었습니다. two different doors, 두 개의 다른 문이. 이 문장 전체를 해석하면, 모든 장소에는 두 개의 다른 문이 있었습니다.","hl":"m"},{"n":31,"text":"이 문장은 장소마다 문이 두 개씩 따로 있었다는 걸 말해요. 흑백이 따로 나뉘어 있던 생활을 아주 쉽게 보여 주는 거죠.","hl":"mn"},{"n":32,"text":"먼저 had는 지난 일을 말하는 과거형이에요. 지금이 아니라 예전 이야기라서 have가 had로 바뀐 거예요. 그리고 문이 두 개니까 door에 s를 붙여 doors라고 했어요. 여럿을 말할 때는 복수라고 해요. 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">역에는 있었습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Stations\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">had\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">두 개의 다른\u003c/span>\u003cspan class=\"en\">two different\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대기실이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">waiting \u003c/span>\u003cspan class=\"tgt\">rooms\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">역에는 두 개의 다른 대기실이 있었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 역에도 대기실이 두 개로 나뉘어 있었다는 뜻이에요. \u003cb class=\"key\">차별\u003c/b>이 여러 장소에서 똑같이 일어났다는 걸 알려 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">여러 개를 말하는 복수(복수)\u003c/span> : 역이 여럿이면(Stations) 이름 말 끝에 s : \"역들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지난 일을 말하는 과거형(과거형)\u003c/span> : 무엇이(Stations) + 가졌다(had) + 무엇을(two different waiting rooms) : \"있었습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">여러 개를 말하는 복수(복수)\u003c/span> : 대기실이 둘 이상이면(rooms) 이름 말 끝에 s : \"대기실들\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"Stations had, 역에는 있었습니다. two different, 두 개의 다른. waiting rooms, 대기실이. 이 문장 전체를 해석하면, 역에는 두 개의 다른 대기실이 있었습니다.","hl":"m"},{"n":34,"text":"역에도 대기실이 두 개로 나뉘어 있었다는 뜻이에요. 차별이 여러 장소에서 똑같이 일어났다는 걸 알려 주죠.","hl":"mn"},{"n":35,"text":"먼저 Stations에는 s가 붙었어요. 역이 여러 개라서 그런 거예요. 그리고 had는 앞 문장처럼 지난 일을 말하는 과거형이에요. waiting rooms도 대기실이 여러 개라서 s를 붙였어요. 여러분이 다니는 역에는 대기실이 몇 개 있나요? 우리는 하나면 충분하죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또한 있었습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">were\u003c/span> also\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">두 개의 다른\u003c/span>\u003cspan class=\"en\">two different\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매표소가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">ticket \u003c/span>\u003cspan class=\"tgt\">offices\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">두 개의 다른 매표소도 있었지요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 매표소까지 두 개로 나뉘어 있었다는 뜻이에요. \u003cb class=\"key\">차별\u003c/b>이 정말 여러 곳에 있었다는 걸 보여 주는 예예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">‘있다’를 말하는 There is·are(There is/are)\u003c/span> : There + be동사(were) + 무엇이(two different ticket offices) : \"있었습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">여러 개를 말하는 복수(복수)\u003c/span> : 둘 이상이면(offices) 이름 말 끝에 es : \"매표소들\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"There were also, 또한 있었습니다. two different, 두 개의 다른. ticket offices, 매표소가. 이 문장 전체를 해석하면, 두 개의 다른 매표소도 있었지요.","hl":"m"},{"n":37,"text":"매표소까지 두 개로 나뉘어 있었다는 뜻이에요. 차별이 정말 여러 곳에 있었다는 걸 보여 주는 예예요.","hl":"mn"},{"n":38,"text":"먼저 There were는 무엇이 있다고 말할 때 쓰는 표현이에요. 예전 일이라 be동사를 were로 썼죠. 그리고 매표소가 두 개라서 office 뒤에 es를 붙여 offices라고 했어요. 여럿이면 복수, 잊지 마세요. 오늘 세 문장 아주 잘 따라왔어요!","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아이들은 해야 했다\u003c/span>\u003cspan class=\"en\">Children \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">to\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 학교에 가야\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">go \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">different \u003c/span>\u003cspan class=\"tgt\">schools\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또한\u003c/span>\u003cspan class=\"en\">too.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">아이들 또한 다른 학교에 다녀야 했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 법 때문에 아이들도 서로 다른 학교에 가야 했어요. Jim Crow 법이 \u003cb class=\"key\">학교\u003c/b>까지 따로 나눴다는 걸 보여 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">도와주는 동사 have to(조동사 have to)\u003c/span> : 누가(Children) + 해야 했다(had to) + 하기를(go) : \"~해야 했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소 앞에 쓰는 to(전치사)\u003c/span> : 가다(go) + to + 장소(different schools) : \"다른 학교에 가다\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"Children had to, 아이들은 해야 했다. go to different schools, 다른 학교에 가야. too, 또한. 이 문장 전체를 해석하면, 아이들 또한 다른 학교에 다녀야 했습니다.","hl":"m"},{"n":40,"text":"법 때문에 아이들도 학교를 따로 다녀야 했어요. 학교까지 나뉘었다는 뜻이에요.","hl":"mn"},{"n":41,"text":"첫째, had to는 '해야 했다'는 뜻을 도와주는 동사예요. have to가 지난 일이 되면 had to로 바뀌죠. 둘째, go to 다음에는 장소가 와요. go to school은 '학교에 다니다'라는 뜻이 된답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 아프리카계 미국인들은\u003c/span>\u003cspan class=\"en\">Many African Americans\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">투표할 수 없었어요, 또한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">couldn't \u003c/span>\u003cspan class=\"tgt\">vote\u003c/span>, \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">either\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">많은 아프리카계 미국인들은 투표도 할 수 없었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아프리카계 미국인들은 \u003cb class=\"key\">투표\u003c/b>도 할 수 없었어요. 법이 학교뿐 아니라 \u003cb class=\"key\">선거\u003c/b>까지 막았다는 뜻이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">할 수 있다 can의 부정(조동사 부정문)\u003c/span> : 누가(Many African Americans) + 할 수 없었다(couldn't) + 하기를(vote) : \"투표할 수 없었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부정문 끝에 쓰는 either(부사)\u003c/span> : 부정문 + either → '~도 아니다' : \"~도 아니다, 역시\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"Many African Americans, 많은 아프리카계 미국인들은. couldn't vote, either, 투표할 수 없었어요, 또한. 이 문장 전체를 해석하면, 많은 아프리카계 미국인들은 투표도 할 수 없었습니다.","hl":"m"},{"n":43,"text":"많은 아프리카계 미국인들은 투표를 하고 싶어도 할 수 없었어요. either가 붙어서 '투표도 못 했다'는 뜻이 돼요.","hl":"mn"},{"n":44,"text":"첫째, couldn't는 can에 not을 붙인 모양이에요. '할 수 없었다'라고 지난 일을 말하죠. 둘째, 부정문 끝에 either를 붙이면 '너도 안 되고 나도 안 된다'처럼 '역시'라는 뜻이 더해져요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대부분의 Jim Crow 법은\u003c/span>\u003cspan class=\"en\">Most Jim Crow laws\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1800년대 후반에 시작되었어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">began\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">late \u003c/span>\u003cspan class=\"tgt\">1800s\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 1900년대 초반에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">and\u003c/span> early 1900s.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">대부분의 Jim Crow 법은 1800년대 후반과 1900년대 초기에 시작되었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Jim Crow 법은 아주 옛날이 아니라 1800년대 후반에 생기기 시작했어요. 이 법이 언제부터 \u003cb class=\"key\">문제\u003c/b>였는지 알려 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일을 말하는 과거형(불규칙 과거형)\u003c/span> : 법(laws) + 시작되었다(began) : \"시작되었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">시간 앞에 쓰는 in(전치사)\u003c/span> : in + the late 1800s → 1800년대 후반에 : \"1800년대 후반에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">이어 주는 말 and(접속사)\u003c/span> : the late 1800s + and + early 1900s : \"그리고\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"Most Jim Crow laws, 대부분의 Jim Crow 법은. began in the late 1800s, 1800년대 후반에 시작되었어요. and early 1900s, 그리고 1900년대 초반에. 이 문장 전체를 해석하면, 대부분의 Jim Crow 법은 1800년대 후반과 1900년대 초기에 시작되었습니다.","hl":"m"},{"n":46,"text":"Jim Crow 법은 아주 먼 옛날이 아니라 늦은 천팔백 년대에 생기기 시작했어요. 그리고 천구백 년대 초반까지 이어졌어요.","hl":"mn"},{"n":47,"text":"첫째, began은 begin의 지난 모양이에요. '시작되었다'라는 뜻이죠. 둘째, 연도나 시대 앞에는 in을 붙여요. late는 후반, early는 초반이라는 뜻이에요. 셋째, and가 두 시간 표현을 나란히 이어 주고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜냐하면 그 법이 있었기 때문에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Because \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">laws \u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">남부에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">South,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">약 6백만 명의\u003c/span>\u003cspan class=\"en\">about 6 million\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아프리카계 미국인들이\u003c/span>\u003cspan class=\"en\">African Americans\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">북부로 이주했어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">moved\u003c/span> to \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">North \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 서부로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">West\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 법이 남부에 있었기 때문에, 약 6백만 명의 아프리카계 미국인들은 북부와 서부로 이주했어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 짐 크로 법이 남부에 있었기 때문에 많은 아프리카계 미국인들이 북부와 서부로 \u003cb class=\"key\">이주\u003c/b>했어요. 법이 사람들의 생활을 바꾼 \u003cb class=\"key\">결과\u003c/b>를 보여 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이유를 이어 주는 말(접속사)\u003c/span> : 왜냐하면(Because) + 그 법이(the laws) + 있었다(were) + 남부에(in the South) : \"그 법이 남부에 있었기 때문에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지난 일을 말하는 동사(과거형)\u003c/span> : 누가(African Americans) + 했다(moved) + 어디로(to the North) : \"이주했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">낱말을 이어 주는 말(접속사 and)\u003c/span> : 북부(the North) + 그리고(and) + 서부(the West) : \"북부와 서부\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"Because the laws were, 왜냐하면 그 법이 있었기 때문에. in the South, 남부에. about 6 million, 약 6백만 명의. African Americans, 아프리카계 미국인들이. moved to the North, 북부로 이주했어요. and the West, 그리고 서부로. 이 문장 전체를 해석하면, 그 법이 남부에 있었기 때문에, 약 6백만 명의 아프리카계 미국인들은 북부와 서부로 이주했어요.","hl":"m"},{"n":49,"text":"이 문장은 법이 남부에 있어서 많은 아프리카계 미국인들이 북부와 서부로 이주했다는 것을 말해요. 법 때문에 사람들이 살던 곳을 떠나야 했던 결과를 보여 주는 거예요.","hl":"mn"},{"n":50,"text":"먼저 Because는 이유를 알려 주는 이어 주는 말이에요. 법이 남부에 있었던 까닭을 먼저 말해 주죠. 두 번째로 moved는 move에 d를 붙인 과거형이에요. 지난 일이라서 과거형으로 말해요. 세 번째로 and는 북부와 서부를 이어 주는 말이에요. 두 낱말을 한 번에 묶어 주는 아주 착한 친구랍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 14\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마침내 Jim Crow 법은\u003c/span>\u003cspan class=\"en\">Finally, Jim Crow laws\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">불법이 되었어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">became \u003c/span>\u003cspan class=\"tgt\">illegal\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1960년대에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">1960s\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">마침내, 1960년대에 Jim Crow 법은 불법이 되었어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 마침내 1960년대에 짐 크로 법이 \u003cb class=\"key\">불법\u003c/b>이 되었다고 알려 줘요. 이 글의 \u003cb class=\"key\">마지막\u003c/b>을 맺는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일을 말하는 동사(과거형)\u003c/span> : 무엇이(JIm Crow laws) + 되었다(became) + 어떤 상태로(illegal) : \"불법이 되었어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">때를 알려 주는 짝꿍 말(전치사)\u003c/span> : 때(in) + 언제(the 1960s) : \"1960년대에\"\u003c/div>\u003c/div>","segs":[{"n":51,"text":"Finally, Jim Crow laws, 마침내 Jim Crow 법은. became illegal, 불법이 되었어요. in the 1960s, 1960년대에. 이 문장 전체를 해석하면, 마침내, 1960년대에 Jim Crow 법은 불법이 되었어요.","hl":"m"},{"n":52,"text":"이 문장은 글의 마지막을 알려 줘요. 천구백육십 년대에 짐 크로 법이 불법이 되었다는 것, 즉 오래된 차별 법이 끝났다는 뜻이에요.","hl":"mn"},{"n":53,"text":"첫째, became은 become의 과거형이에요. 오래전에 일어난 일이라서 과거형으로 말해요. 둘째, in은 때를 알려 주는 전치사예요. 천구백육십 년대처럼 긴 시간 앞에 붙여서 '그때에'라고 말해 줘요. 여러분도 마지막 문장까지 잘 따라왔죠? 정말 멋져요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">오늘 배운 내용 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>\u003cb class=\"key\">Jim \u003c/b>\u003cb class=\"key\">Crow \u003c/b>\u003cb class=\"key\">laws\u003c/b>는 유색 인종에게 불공평한 법이었어요.\u003c/li>\u003cli>식당, 역, 학교 같은 곳에서 \u003cb class=\"key\">분리\u003c/b>가 있었어요.\u003c/li>\u003cli>많은 아프리카계 미국인은 \u003cb class=\"key\">투표\u003c/b>를 할 수 없었어요.\u003c/li>\u003cli>사람들은 북부와 서부로 \u003cb class=\"key\">이주\u003c/b>했고, 마침내 그 법은 \u003cb class=\"key\">불법\u003c/b>이 되었어요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Jim Crow laws were unfair laws that separated people of color from white people, but they became illegal in the 1960s.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">이 글은 1960년대 이전 미국에 있던 \u003cb class=\"key\">Jim \u003c/b>\u003cb class=\"key\">Crow \u003c/b>\u003cb class=\"key\">laws\u003c/b>가 유색 인종에게 불공평했던 법이라고 설명해요. 식당, 역, 학교에서 \u003cb class=\"key\">분리\u003c/b>가 있었고, 많은 아프리카계 미국인이 \u003cb class=\"key\">투표\u003c/b>를 못 했지만 1960년대에 그 법은 \u003cb class=\"key\">불법\u003c/b>이 되었어요.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":54,"text":"오늘은 Jim Crow laws가 유색 인종에게 얼마나 불공평했는지 배웠어요. 식당과 학교에서 분리가 있었고, 많은 사람이 투표를 못 했으며, 북부와 서부로 이주한 사람들도 있었어요. 마침내 그 법은 불법이 되었어요. 여러분, 오늘도 정말 잘했고 다음에도 멋진 영어 이야기로 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
