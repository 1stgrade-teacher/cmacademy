</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"왓츠 리딩 100A Ch.2 Unit 03 Different Shapes of Us","audioDir":"reading03_audio","preview":false,"count":69,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.400em\">Ch.2 Unit\u003cbr>03 Different\u003cbr>Shapes of Us\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">왓츠 리딩 100A\u003c/div>\u003ch1>Bob Becomes Round: There Is Always Hope\u003c/h1>\u003ch2>둥글게 변한 Bob: 항상 희망은 있어요\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">한 줄 요약\u003c/span>\u003cspan>요약: 언덕 위 바위 친구들 중 한쪽이 \u003cb class=\"key\">평평한\u003c/b> Bob만 구를 수 없었어요. 그런데 친구들이 \u003cb class=\"key\">진흙\u003c/b>을 발라 Bob을 둥글게 만들어 주자, Bob은 처음으로 \u003cb class=\"key\">구를\u003c/b> 수 있었어요.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>If you don't give up, there is always hope.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘도 만나서 반가워요. 오늘 우리가 읽을 이야기는 언덕 위에 사는 바위 친구들의 이야기예요. 제목은 Different Shapes of Us, 우리의 서로 다른 모양이라는 뜻이에요. 한 문장으로 말하면, 포기하지 않으면 희망이 있다는 이야기예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">미리 알면 쉬워요\u003c/span>\u003cdiv class=\"lp-box\">바위(rock)는 단단한 돌로 만들어진 것이에요. 둥근 바위는 언덕에서 데굴데굴 잘 굴러가요. 그런데 한쪽이 평평(flat)한 바위는 굴러가지 못하고 미끄러지기만 해요. 여러분이 동그란 공과 네모난 상자를 언덕에서 굴린다고 생각해 보세요. 공은 잘 굴러가지만 상자는 잘 굴러가지 않죠. 이렇게 \u003cb class=\"key\">모양\u003c/b>이 다르면 할 수 있는 일도 달라져요.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 하나 볼까요. 둥근 바위는 언덕에서 아주 잘 굴러가요. 그런데 한쪽이 평평한 바위는 굴러가지 못하고 미끄러지기만 해요. 여러분이 동그란 공과 네모난 상자를 언덕에서 굴린다고 생각해 보세요. 어느 것이 더 잘 굴러갈까요? 바로 공이죠. 이렇게 모양이 다르면 할 수 있는 일도 달라져요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>둥근 바위들\u003csmall>시작 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>언덕 위에 많은 바위들이 살았어요. 그들은 \u003cb class=\"key\">둥글었기\u003c/b> 때문에 언덕을 잘 굴러 내려갔어요. 놀고 구르는 것을 아주 좋아했지요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>평평한 Bob\u003csmall>문제 · 문장 4–7\u003c/small>\u003c/h4>\u003cp>그런데 Bob은 한쪽 면이 \u003cb class=\"key\">평평\u003c/b>했어요. 그래서 친구들이 같이 구르자고 해도 Bob은 \u003cb class=\"key\">구를 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">없었어요\u003c/b>. Bob은 조용히 앉아 있어야만 했어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>진흙 아이디어\u003csmall>바뀜 · 문장 8–14\u003c/small>\u003c/h4>\u003cp>친구들이 Bob을 언덕 꼭대기로 들고 가서 밀었지만, Bob은 그저 \u003cb class=\"key\">미끄러졌어요\u003c/b>. 갑자기 한 친구가 진흙을 찾아 Bob의 평평한 면에 발랐어요. \u003cb class=\"key\">진흙이 \u003c/b>\u003cb class=\"key\">말랐을 \u003c/b>\u003cb class=\"key\">때\u003c/b> Bob은 둥글게 되었어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>처음으로 구르다\u003csmall>해결 · 문장 15–19\u003c/small>\u003c/h4>\u003cp>친구들이 뒤에 서서 \u003cb class=\"key\">지켜보는\u003c/b> 가운데 Bob은 천천히 움직였어요. 그리고 처음으로 \u003cb class=\"key\">구를\u003c/b> 수 있었어요. Bob은 친구들에게 고맙다고 하며, 포기하지 않으면 희망이 있다고 말했어요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 이야기가 어떤 순서로 흘러가는지 함께 살펴봐요.","hl":null},{"n":4,"text":"먼저 언덕 위에 많은 바위들이 살았어요. 이 바위들은 둥글어서 언덕을 잘 굴러 내려갔어요. 놀고 구르는 것을 아주 좋아했지요.","hl":"f0"},{"n":5,"text":"그런데 Bob은 달랐어요. 한쪽 면이 평평해서 친구들이 같이 구르자고 해도 구를 수 없었어요. 그래서 Bob은 조용히 앉아 있어야만 했어요.","hl":"f1"},{"n":6,"text":"친구들은 Bob을 돕고 싶어 했어요. 언덕 꼭대기로 들고 가서 밀었지만 Bob은 그저 미끄러졌어요. 그때 한 친구가 진흙을 찾아 Bob의 평평한 면에 발랐어요. 진흙이 말랐을 때 Bob은 둥글게 되었어요.","hl":"f2"},{"n":7,"text":"친구들이 뒤에 서서 지켜보았어요. Bob은 천천히 움직이다가 처음으로 구를 수 있었어요. Bob은 고맙다고 말하며, 포기하지 않으면 항상 희망이 있다고 했어요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결\u003c/span>\u003cspan class=\"lp-pill\">끝\u003c/span>\u003cspan class=\"lp-pill\">주제문 19번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">Bob이 구를 수 없다는 \u003cb class=\"key\">문제\u003c/b>가 먼저 나와요. 친구들이 진흙을 발라 Bob을 둥글게 만드는 \u003cb class=\"key\">해결\u003c/b>이 뒤에 나오죠. 그래서 이 글은 문제와 해결의 짜임이고, 중심 문장은 맨 끝 \u003cb class=\"key\">마지막 \u003c/b>\u003cb class=\"key\">문장\u003c/b>에 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Because (3)\u003c/b>\u003cspan>이유를 알려 줌\u003c/span>\u003cb>But (4)\u003c/b>\u003cspan>반대 내용을 알려 줌\u003c/span>\u003cb>Then (10)\u003c/b>\u003cspan>순서를 알려 줌\u003c/span>\u003cb>Suddenly (12)\u003c/b>\u003cspan>갑자기 새 일이 시작됨을 알려 줌\u003c/span>\u003cb>When (14)\u003c/b>\u003cspan>때를 알려 줌\u003c/span>\u003cb>Then (17)\u003c/b>\u003cspan>순서를 알려 줌\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Many rocks\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">They\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Bob\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">poor Bob\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">him\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">He\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>둥근 친구들\u003c/th>\u003cth>평평한 Bob\u003c/th>\u003c/tr>\u003ctr>\u003ctd>둥글어서 잘 굴러감\u003c/td>\u003ctd>한쪽이 평평해 못 굴러감\u003c/td>\u003c/tr>\u003ctr>\u003ctd>놀고 구르는 것을 좋아함\u003c/td>\u003ctd>조용히 앉아 있어야 함\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 문제와 해결의 짜임이에요. Bob이 구를 수 없다는 문제가 나오고, 진흙으로 해결이 돼요. 그리고 중심 문장은 맨 끝에 있어요. 포기하지 않으면 희망이 있다는 마지막 문장이 이 이야기의 주제예요.","hl":"ty"},{"n":9,"text":"길잡이 말도 찾아볼까요. But은 반대 내용을 알려 주고, Because는 이유를 알려 줘요. Then은 순서를, Suddenly는 갑자기 새 일이 시작됨을 알려 주죠. 또 Bob을 가리키는 말이 poor Bob, him, he처럼 계속 바뀌어 나와요. 모두 같은 Bob을 가리키는 말이에요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 단어\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>rock\u003c/b>\u003cem>명사\u003c/em>\u003cspan>바위\u003c/span>\u003c/div>\u003cdiv>\u003cb>hill\u003c/b>\u003cem>명사\u003c/em>\u003cspan>언덕\u003c/span>\u003c/div>\u003cdiv>\u003cb>roll\u003c/b>\u003cem>동사\u003c/em>\u003cspan>구르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>round\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>둥근\u003c/span>\u003c/div>\u003cdiv>\u003cb>through\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~사이로\u003c/span>\u003c/div>\u003cdiv>\u003cb>grass\u003c/b>\u003cem>명사\u003c/em>\u003cspan>풀, 잔디\u003c/span>\u003c/div>\u003cdiv>\u003cb>poor\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>불쌍한\u003c/span>\u003c/div>\u003cdiv>\u003cb>flat\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>평평한\u003c/span>\u003c/div>\u003cdiv>\u003cb>side\u003c/b>\u003cem>명사\u003c/em>\u003cspan>면, 쪽\u003c/span>\u003c/div>\u003cdiv>\u003cb>carry\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(들어서) 나르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>push\u003c/b>\u003cem>동사\u003c/em>\u003cspan>밀다\u003c/span>\u003c/div>\u003cdiv>\u003cb>slide\u003c/b>\u003cem>동사\u003c/em>\u003cspan>미끄러지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>suddenly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>갑자기\u003c/span>\u003c/div>\u003cdiv>\u003cb>mud\u003c/b>\u003cem>명사\u003c/em>\u003cspan>진흙\u003c/span>\u003c/div>\u003cdiv>\u003cb>dry\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>마른\u003c/span>\u003c/div>\u003cdiv>\u003cb>become\u003c/b>\u003cem>동사\u003c/em>\u003cspan>~이 되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>slowly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>천천히\u003c/span>\u003c/div>\u003cdiv>\u003cb>hope\u003c/b>\u003cem>명사\u003c/em>\u003cspan>희망\u003c/span>\u003c/div>\u003cdiv>\u003cb>give up\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>포기하다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"오늘의 단어도 소리 내어 읽어 볼까요. rock은 바위, hill은 언덕이에요. flat은 평평한, mud는 진흙이라는 뜻이에요. give up은 포기하다라는 뜻이고요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">love\u003c/b>\u003cspan class=\"m\">아주 좋아하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">like\u003c/span>\u003cspan class=\"s\">enjoy\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">poor\u003c/b>\u003cspan class=\"m\">불쌍한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">unlucky\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">lucky\u003c/span>\u003cspan class=\"a\">rich\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">flat\u003c/b>\u003cspan class=\"m\">평평한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">even\u003c/span>\u003cspan class=\"s\">level\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">round\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">push\u003c/b>\u003cspan class=\"m\">밀다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">shove\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">pull\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">top\u003c/b>\u003cspan class=\"m\">꼭대기\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">peak\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">bottom\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">give up\u003c/b>\u003cspan class=\"m\">포기하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">quit\u003c/span>\u003cspan class=\"s\">stop\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">keep trying\u003c/span>\u003cspan class=\"a\">go on\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"비슷한 말과 반대말도 정리해 봐요. love는 like와 비슷하고 hate와 반대예요. push는 pull과 반대말이고, flat은 round와 반대예요. give up은 stop과 비슷하지만 keep trying과는 반대예요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 바위들이 살았어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Many \u003c/span>\u003cspan class=\"tgt\">rocks\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">lived\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">언덕 위에\u003c/span>\u003cspan class=\"en\">on a hill.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">언덕 위에 많은 바위들이 살았어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이야기가 시작된다는 것을 알려 주는 문장이에요. \u003cb class=\"key\">언덕\u003c/b> 위에 \u003cb class=\"key\">바위\u003c/b> 친구들이 살고 있다고 소개해 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">여러 개를 말할 때(복수)\u003c/span> : 여러 개면 이름 말 뒤에 s (many rocks) : \"많은 바위들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(Many rocks) + 살았어요(lived) + 언덕 위에(on a hill) : \"살았어요\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Many rocks lived, 많은 바위들이 살았어요. on a hill, 언덕 위에. 이 문장 전체를 해석하면, 언덕 위에 많은 바위들이 살았어요.","hl":"m"},{"n":13,"text":"이야기의 첫 장면이에요. 언덕 위에 바위 친구들이 살고 있었대요. 앞으로 어떤 일이 생길지 궁금해지죠?","hl":"mn"},{"n":14,"text":"먼저, Many rocks처럼 여러 개를 말할 때는 이름 말 뒤에 s를 붙여요. many는 '많은'이라는 뜻이죠. 그리고 lived는 지난 일을 말하는 과거형이에요. live에 -ed를 붙였으니 '살았어요'가 된답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 아주 좋아했어요\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">loved \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">노는 것과 구르는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">play \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">roll\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">언덕 아래로\u003c/span>\u003cspan class=\"en\">down the hill.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 놀고 언덕을 굴러 내려오는 것을 아주 좋아했지요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 바위들이 무엇을 좋아하는지 알려 주는 문장이에요. 놀면서 \u003cb class=\"key\">언덕 \u003c/b>\u003cb class=\"key\">아래로\u003c/b> \u003cb class=\"key\">구르는\u003c/b> 것을 아주 좋아했대요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to + 동사원형(to부정사)\u003c/span> : 누가(They) + 좋아했어요(loved) + 하는 것을(to play) : \"노는 것을 좋아했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 놀다(play) + 그리고(and) + 구르다(roll) : \"놀고 구르는 것\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"They loved, 그들은 아주 좋아했어요. to play and roll, 노는 것과 구르는 것을. down the hill, 언덕 아래로. 이 문장 전체를 해석하면, 그들은 놀고 언덕을 굴러 내려오는 것을 아주 좋아했지요.","hl":"m"},{"n":16,"text":"바위 친구들이 무엇을 좋아하는지 알려 줘요. 노는 것과 언덕 아래로 구르는 것을 아주 좋아했대요.","hl":"mn"},{"n":17,"text":"첫 번째, loved to play에서 to 뒤에는 동사원형 play가 와요. 뜻은 '노는 것을 좋아했어요'예요. 두 번째, and는 play와 roll을 이어 주는 이어 주는 말이에요. 공놀이할 때 '달리고 그리고 멈춰'처럼 쓰는 그 and와 같아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 둥글었기 때문에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Because \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">round\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 구를 수 있었어요\u003c/span>\u003cspan class=\"en\">they \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">could \u003c/span>\u003cspan class=\"tgt\">roll\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">잔디 사이로\u003c/span>\u003cspan class=\"en\">through the grass.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 둥글었기 때문에 잔디 사이로 구를 수 있었어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 둥글면 잘 굴러간다는 것을 알려 주는 문장이에요. 이 \u003cb class=\"key\">까닭\u003c/b>이 뒤에서 밥 이야기와 \u003cb class=\"key\">비교\u003c/b>되어 보여요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이유를 말하는 이어 주는 말(접속사)\u003c/span> : 왜냐하면 ~해서(Because) + 누가(they) + 둥글었어요(were round) : \"그들은 둥글었기 때문에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">할 수 있었다(조동사)\u003c/span> : 누가(they) + 할 수 있었어요(could) + 구르다(roll) : \"구를 수 있었어요\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Because they were round, 그들은 둥글었기 때문에. they could roll, 그들은 구를 수 있었어요. through the grass, 잔디 사이로. 이 문장 전체를 해석하면, 그들은 둥글었기 때문에 잔디 사이로 구를 수 있었어요.","hl":"m"},{"n":19,"text":"둥글면 잘 굴러간다는 것을 알려 줘요. 이 까닭 덕분에 뒤에서 밥이 왜 못 구르는지도 알 수 있답니다.","hl":"mn"},{"n":20,"text":"첫 번째, Because는 까닭을 알려 주는 이어 주는 말이에요. 그래서 뒤에 결과가 와요. 두 번째, could는 지난 일에 '할 수 있었다'라는 뜻이에요. could 뒤에는 동사원형 roll이 와요. 여러분도 이 문장을 소리 내어 읽어 보세요. 아주 잘하고 있어요!","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 불쌍한 Bob은\u003c/span>\u003cspan class=\"en\">But \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">poor \u003c/span>\u003cspan class=\"tgt\">Bob\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">앉아 있어야만 했어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">sit\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">조용히\u003c/span>\u003cspan class=\"en\">quietly.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 불쌍한 Bob은 조용히 앉아 있어야만 했지요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 친구들은 다 신나게 구르는데 Bob만 \u003cb class=\"key\">조용히\u003c/b> 앉아 있어야 해요. Bob이 처한 \u003cb class=\"key\">안타까운 \u003c/b>\u003cb class=\"key\">상황\u003c/b>을 보여 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">꾸며 주는 말(형용사)\u003c/span> : 꾸며 주는 말(poor) + 이름 말(Bob) : \"불쌍한 Bob\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">도와주는 동사(have to)\u003c/span> : 누가(Bob) + 해야 한다(had to) + 하다(sit) : \"앉아 있어야만 했어요\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"But poor Bob, 하지만 불쌍한 Bob은. had to sit, 앉아 있어야만 했어요. quietly, 조용히. 이 문장 전체를 해석하면, 하지만 불쌍한 Bob은 조용히 앉아 있어야만 했지요.","hl":"m"},{"n":22,"text":"친구들은 다 신나게 구르는데 Bob만 조용히 앉아 있어야 해요. 그래서 Bob이 안타까운 상황이라는 걸 알 수 있죠.","hl":"mn"},{"n":23,"text":"첫째, poor는 불쌍한이라는 뜻으로 Bob을 꾸며 주는 형용사예요. 둘째, had to는 해야 한다는 뜻을 가진 도와주는 동사 표현이에요. 그리고 had to 뒤에는 동사원형 sit이 와서 앉아 있어야 한다가 돼요. 오늘은 이 세 가지만 기억해요!","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 19\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 구를 수 없었어요\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">couldn't \u003c/span>\u003cspan class=\"tgt\">roll\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜냐하면 한쪽 면이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">because\u003c/span> one side\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의\u003c/span>\u003cspan class=\"en\">of him\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">평평했거든요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">flat\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 한쪽 면이 평평했기 때문에 구를 수 없었거든요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Bob이 구를 수 없는 \u003cb class=\"key\">이유\u003c/b>를 알려 줘요. 한쪽 면이 \u003cb class=\"key\">평평\u003c/b>해서 굴러가지 못한다는 뜻이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">도와주는 동사(can의 부정)\u003c/span> : 누가(He) + 할 수 없었다(couldn't) + 하다(roll) : \"구를 수 없었어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 앞말(구를 수 없었다) + 왜냐하면(because) + 이유(한쪽이 평평했다) : \"왜냐하면 ~때문에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">be동사 + 꾸며 주는 말\u003c/span> : 무엇이(one side of him) + 이었다(was) + 평평한(flat) : \"평평했어요\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"He couldn't roll, 그는 구를 수 없었어요. because one side, 왜냐하면 한쪽 면이. of him, 그의. was flat, 평평했거든요. 이 문장 전체를 해석하면, 그는 한쪽 면이 평평했기 때문에 구를 수 없었거든요.","hl":"m"},{"n":25,"text":"Bob이 왜 못 구르는지 알려 주는 문장이에요. 한쪽 면이 평평해서 굴러가지 못한다는 뜻이죠.","hl":"mn"},{"n":26,"text":"첫째, can은 할 수 있다, 뒤에 not을 붙이면 할 수 없다가 돼요. 둘째, because는 왜냐하면 하고 이유를 붙여 주는 이어 주는 말이에요. 셋째, was flat은 be동사 was에 평평한이라는 말이 붙어서 평평한 상태였다는 뜻을 만들어요. 참 쉽죠?","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 친구들이 말했어요\u003c/span>\u003cspan class=\"en\">His friends \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">said\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">&quot;우리 구르자!&quot;\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">Let's \u003c/span>\u003cspan class=\"tgt\">roll\u003c/span>!&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그의 친구들이 &quot;우리 구르자!&quot;라고 말했어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 친구들이 Bob에게 같이 구르자고 \u003cb class=\"key\">같이 \u003c/b>\u003cb class=\"key\">구르자\u003c/b> 말을 걸어요. Bob은 못 구르니까 \u003cb class=\"key\">안타까움\u003c/b>이 더 커지는 장면이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(His friends) + 말했다(said) : \"말했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">같이 하자고 말하기(Let's)\u003c/span> : Let's + 동사원형(roll) : \"우리 구르자\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"His friends said, 그의 친구들이 말했어요. \"Let's roll!\", \"우리 구르자!\". 이 문장 전체를 해석하면, 그의 친구들이 \"우리 구르자!\"라고 말했어요.","hl":"m"},{"n":28,"text":"친구들이 Bob에게 같이 구르자고 말하는 장면이에요. 신나는 말이지만 Bob은 못 구르니까 안타까움이 더 커지죠.","hl":"mn"},{"n":29,"text":"첫째, said는 say의 과거형이에요. 지난 일이라서 모양이 바뀌는 불규칙 친구죠. 둘째, Let's roll은 우리 구르자 하고 같이 하자고 권하는 말이에요. Let's 뒤에는 꼭 동사원형이 와요. 여러분도 친구에게 Let's play라고 말해 볼까요?","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Bob은 시도했어요,\u003c/span>\u003cspan class=\"en\">Bob \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">tried\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 그는 할 수 없었어요.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">but\u003c/span> he \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">couldn't\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Bob은 시도해 봤지만 구를 수 없었어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Bob이 구르려고 \u003cb class=\"key\">시도했어요\u003c/b>만 결국 \u003cb class=\"key\">할 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">없었어요\u003c/b>. 친구들은 잘 구르는데 Bob만 못 한다는 걸 보여 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(Bob) + 했어요(tried) : \"시도했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : (앞말) + 하지만(but) + (뒷말) : \"하지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">도와주는 동사(조동사)\u003c/span> : 누가(he) + 할 수 없었어요(couldn't) + 하기를 : \"할 수 없었어요\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Bob tried, Bob은 시도했어요. but he couldn't, 하지만 그는 할 수 없었어요.. 이 문장 전체를 해석하면, Bob은 시도해 봤지만 구를 수 없었어요.","hl":"m"},{"n":31,"text":"Bob이 구르려고 시도했지만 결국 할 수 없었어요. 친구들은 잘 구르는데 Bob만 못 한다는 걸 알려 주는 문장이죠.","hl":"mn"},{"n":32,"text":"여기서 tried는 try의 과거형이에요. 지난 일이라 동사 모양이 바뀌었어요. 그리고 but은 접속사로 두 생각을 반대로 이어 줘요. 시도했어요, 하지만 못 했어요, 이렇게요. 마지막으로 couldn't는 can의 지난 말에 not을 붙인 조동사예요. 조동사 뒤에는 동사원형이 온다는 것도 꼭 기억해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Bob의 친구들은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Bob's\u003c/span> friends\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">원했어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">wanted \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그를 돕기를.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">help\u003c/span> him.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Bob의 친구들은 그를 돕고 싶어 했어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Bob의 친구들이 Bob을 \u003cb class=\"key\">돕고 \u003c/b>\u003cb class=\"key\">싶어\u003c/b> 했어요. 친구들의 \u003cb class=\"key\">따뜻한 \u003c/b>\u003cb class=\"key\">마음\u003c/b>이 느껴지는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">~의(소유격)\u003c/span> : 누구(Bob) + 의('s) + 무엇(friends) : \"Bob의\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to + 동사원형(to부정사)\u003c/span> : 누가(They) + 원했어요(wanted) + ~하기를(to help) : \"돕기를 원했어요\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"Bob's friends, Bob의 친구들은. wanted to, 원했어요. help him, 그를 돕기를.. 이 문장 전체를 해석하면, Bob의 친구들은 그를 돕고 싶어 했어요.","hl":"m"},{"n":34,"text":"Bob의 친구들이 Bob을 돕고 싶어 했어요. 친구들의 따뜻한 마음이 느껴지죠.","hl":"mn"},{"n":35,"text":"먼저 Bob's는 Bob의라는 소유격이에요. 사람 이름 뒤에 's를 붙이면 돼요. 그리고 want 뒤에 to help를 붙이면 돕기를 원했어요, 다시 말해 돕고 싶어 했어요가 돼요. 이렇게 to에 동사원형을 붙인 to부정사는 ~하기라는 뜻이에요. 참 쉽죠?","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 Bob을 들고 갔어요\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">carried\u003c/span> Bob\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">꼭대기로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">top \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">언덕의.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">hill\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 Bob을 언덕 꼭대기로 들고 갔어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 친구들이 Bob을 \u003cb class=\"key\">언덕 \u003c/b>\u003cb class=\"key\">꼭대기\u003c/b>로 \u003cb class=\"key\">들고 \u003c/b>\u003cb class=\"key\">갔어요\u003c/b>. Bob을 돕는 일이 드디어 시작된 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(They) + 했어요(carried) + 누구를(Bob) : \"들고 갔어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소 짝꿍 말(전치사)\u003c/span> : to + 장소(the top of the hill) : \"언덕 꼭대기로\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"They carried Bob, 그들은 Bob을 들고 갔어요. to the top, 꼭대기로. of the hill, 언덕의.. 이 문장 전체를 해석하면, 그들은 Bob을 언덕 꼭대기로 들고 갔어요.","hl":"m"},{"n":37,"text":"친구들이 Bob을 언덕 꼭대기로 들고 갔어요. Bob을 돕는 일이 드디어 시작됐어요.","hl":"mn"},{"n":38,"text":"carried는 carry의 과거형이에요. y를 i로 바꾸고 ed를 붙인 모양이죠. 두 번째로 to는 ~로라는 뜻의 전치사예요. 어디로 가는지 장소를 알려 줄 때 딱이에요. 언덕 꼭대기, top of the hill도 같이 익혀 두면 좋아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 다음에 그들은\u003c/span>\u003cspan class=\"en\">Then they\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그를 밀었어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">pushed\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">him\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 다음에 그들은 그를 밀었어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 친구들이 Bob을 힘껏 밀어 주었어요. Bob을 \u003cb class=\"key\">도와주려는 \u003c/b>\u003cb class=\"key\">마음\u003c/b>이 느껴지는 장면이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(They) + 했다(pushed) + 누구를(him) : \"밀었어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">대신하는 말(대명사)\u003c/span> : 누구를(him) = he의 다른 모양 : \"그를\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"Then they, 그 다음에 그들은. pushed him, 그를 밀었어요. 이 문장 전체를 해석하면, 그 다음에 그들은 그를 밀었어요.","hl":"m"},{"n":40,"text":"친구들이 Bob을 밀어서 굴러가게 해 주려고 했어요. 여기에는 Bob을 도와주려는 마음이 담겨 있어요.","hl":"mn"},{"n":41,"text":"첫째, pushed는 지난 일을 말하는 과거형이에요. 이미 지나간 일이라 동사에 -ed를 붙였죠. 둘째, him은 '그를'이라는 뜻의 목적어예요. 주어일 때는 he, 목적어일 때는 him, 이렇게 모양이 달라진다는 것도 꼭 기억해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Bob은 그저\u003c/span>\u003cspan class=\"en\">Bob \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">just\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미끄러졌어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">slid\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Bob은 그저 미끄러졌을 뿐이었어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Bob은 굴러가지 못하고 그저 미끄러지기만 했어요. \u003cb class=\"key\">아쉬움\u003c/b>이 남는 장면이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">더 자세히 알려 주는 말(부사)\u003c/span> : 그저(just) + 미끄러졌어요(slid) : \"그저\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">불규칙 지난 일 말(불규칙 과거형)\u003c/span> : 누가(Bob) + 미끄러졌어요(slid) : \"미끄러졌어요\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"Bob just, Bob은 그저. slid, 미끄러졌어요. 이 문장 전체를 해석하면, Bob은 그저 미끄러졌을 뿐이었어요.","hl":"m"},{"n":43,"text":"Bob은 굴러가지 못하고 그저 미끄러지기만 했어요. 앞에서 열심히 밀었는데도 잘 안 돼서 조금 아쉬운 장면이에요.","hl":"mn"},{"n":44,"text":"첫째, just는 '그저'라는 뜻으로 동사를 살짝 도와주는 부사예요. 둘째, slid는 slide의 지난 일 말인데 -ed를 붙이지 않는 불규칙 과거형이에요. 그래서 slide가 slid로 딱 바뀐답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">갑자기 한 친구가 말했어요,\u003c/span>\u003cspan class=\"en\">Suddenly, one friend \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">said\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">&quot;내게 생각이 있어!&quot;\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">have\u003c/span> an idea!&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">갑자기 한 친구가 &quot;내게 생각이 있어!&quot;라고 말했어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 한 친구가 좋은 \u003cb class=\"key\">생각\u003c/b>을 떠올려서 말했어요. 이야기가 \u003cb class=\"key\">해결\u003c/b> 쪽으로 바뀌는 중요한 장면이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">불규칙 지난 일 말(불규칙 과거형)\u003c/span> : 누가(one friend) + 말했어요(said) : \"말했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지금 하는 말(현재형)\u003c/span> : 나는(I) + 가지고 있어요(have) + 생각을(an idea) : \"내게 있어요\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"Suddenly, one friend said, 갑자기 한 친구가 말했어요. \"I have an idea!\", \"내게 생각이 있어!\". 이 문장 전체를 해석하면, 갑자기 한 친구가 \"내게 생각이 있어!\"라고 말했어요.","hl":"m"},{"n":46,"text":"한 친구가 좋은 생각을 떠올려서 말했어요. 이 장면부터 이야기가 해결 쪽으로 바뀐답니다.","hl":"mn"},{"n":47,"text":"첫째, said는 say의 지난 일 말이에요. -ed를 붙이지 않는 불규칙 과거형이라 said가 돼요. 둘째, 따옴표 안의 I have는 친구가 지금 하는 말이라 현재형을 썼어요. 친구의 목소리를 그대로 옮겨 적은 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 진흙을 좀 찾아서\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">found\u003c/span> some mud\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그것을 발랐어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">put \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">평평한 면에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">flat \u003c/span>\u003cspan class=\"tgt\">side\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Bob의\u003c/span>\u003cspan class=\"en\">of Bob.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 진흙을 좀 찾아서 그것을 Bob의 평평한 면에 발랐어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Bob의 친구가 \u003cb class=\"key\">진흙\u003c/b>을 찾아 Bob의 \u003cb class=\"key\">평평한 \u003c/b>\u003cb class=\"key\">면\u003c/b>에 발라 줬어요. 친구가 도와주려고 직접 나선 장면이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거형(불규칙 과거형)\u003c/span> : 찾다(find) → 찾았다(found) : \"찾았어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사(이어 주는 말)\u003c/span> : 찾았다(found) + 그리고(and) + 발랐다(put) : \"그리고 그것을 발랐어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사(장소 짝꿍 말)\u003c/span> : 발랐다(put) + 위에(on) + 평평한 면(the flat side) : \"평평한 면 위에\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"He found some mud, 그는 진흙을 좀 찾아서. and put it, 그리고 그것을 발랐어요. on the flat side, 평평한 면에. of Bob, Bob의. 이 문장 전체를 해석하면, 그는 진흙을 좀 찾아서 그것을 Bob의 평평한 면에 발랐어요.","hl":"m"},{"n":49,"text":"친구가 진흙을 찾아서 Bob의 평평한 면에 발라 줬어요. 도와주려는 친구의 행동이 시작된 대목이에요.","hl":"mn"},{"n":50,"text":"첫 번째, found는 find의 과거형이에요. 이미 지난 일이라 found라고 했어요. 두 번째, and는 찾았다와 발랐다, 두 동작을 이어 주는 말이에요. 세 번째, on은 전치사로, 어디에 발랐는지 장소를 알려 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">진흙이 말랐을 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">mud \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">dry\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Bob은 둥글게 되었어요\u003c/span>\u003cspan class=\"en\">Bob \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">became \u003c/span>\u003cspan class=\"tgt\">round\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">진흙이 말랐을 때 Bob은 둥글게 되었답니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 진흙이 마르자 Bob의 모양이 \u003cb class=\"key\">둥글게\u003c/b> 바뀌었어요. 이제 Bob도 굴러갈 준비가 된 거예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사(이어 주는 말) when\u003c/span> : 할 때(When) + 진흙이 말랐다(the mud was dry) : \"진흙이 말랐을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be동사(am·are·is 친구들) 과거형\u003c/span> : 진흙은(the mud) + 말랐다(was dry) : \"말랐어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">과거형(불규칙 과거형)\u003c/span> : Bob은(Bob) + 되었다(became) + 둥글게(round) : \"둥글게 되었어요\"\u003c/div>\u003c/div>","segs":[{"n":51,"text":"When the mud was dry, 진흙이 말랐을 때. Bob became round, Bob은 둥글게 되었어요. 이 문장 전체를 해석하면, 진흙이 말랐을 때 Bob은 둥글게 되었답니다.","hl":"m"},{"n":52,"text":"진흙이 마르자 Bob이 둥글게 변했어요. 드디어 Bob도 굴러갈 수 있게 된 거예요.","hl":"mn"},{"n":53,"text":"첫 번째, when은 이어 주는 말로 언제인지 알려 줘요. 두 번째, was는 is의 과거형이에요. 세 번째, became은 become의 과거형으로 '~이 되었다'는 뜻이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 15 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Bob의 친구들은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Bob's \u003c/span>\u003cspan class=\"tgt\">friends\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">뒤로 물러나 서서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">stood \u003c/span>\u003cspan class=\"tgt\">back\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 지켜보았어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">watched\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Bob의 친구들은 뒤에 서서 지켜보았어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 친구들이 \u003cb class=\"key\">뒤로 \u003c/b>\u003cb class=\"key\">물러나\u003c/b> Bob이 굴러가는지 가만히 지켜봤어요. 두근두근 기다리는 장면이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">소유격(~의)\u003c/span> : Bob의(Bob's) + 친구들(friends) : \"Bob의 친구들은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거형(불규칙 과거형)\u003c/span> : 서다(stand) → 섰다(stood) + 뒤로(back) : \"뒤로 물러나 섰어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">접속사(이어 주는 말)\u003c/span> : 섰다(stood) + 그리고(and) + 지켜봤다(watched) : \"그리고 지켜보았어요\"\u003c/div>\u003c/div>","segs":[{"n":54,"text":"Bob's friends, Bob의 친구들은. stood back, 뒤로 물러나 서서. and watched, 그리고 지켜보았어요. 이 문장 전체를 해석하면, Bob의 친구들은 뒤에 서서 지켜보았어요.","hl":"m"},{"n":55,"text":"친구들이 뒤로 물러나서 Bob이 굴러가는지 가만히 지켜봤어요. 모두 두근두근하며 기다린 거예요.","hl":"mn"},{"n":56,"text":"첫 번째, Bob's처럼 이름 뒤에 's를 붙이면 소유격이 돼요. 두 번째, stood는 stand의 과거형이에요. 세 번째, and는 서다와 지켜보다, 두 동작을 이어 주는 말이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 16 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Bob은 움직였어요\u003c/span>\u003cspan class=\"en\">Bob \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">moved\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">천천히.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">slowly\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Bob은 천천히 움직였어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Bob이 공처럼 빠르게 굴러가지 못하고 아주 느리게 움직였다는 뜻이에요. 바로 다음에 처음으로 굴렀다는 말이 나와서 기대를 키워 주는 \u003cb class=\"key\">장면\u003c/b>이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(Bob) + 움직였다(moved) : \"움직였어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">더 자세히 알려 주는 말(부사)\u003c/span> : 어떻게 움직였어요? + 천천히(slowly) : \"천천히\"\u003c/div>\u003c/div>","segs":[{"n":57,"text":"Bob moved, Bob은 움직였어요. slowly, 천천히.. 이 문장 전체를 해석하면, Bob은 천천히 움직였어요.","hl":"m"},{"n":58,"text":"Bob이 아직은 공처럼 빠르게 굴러가지 못하고 아주 느리게 움직였다는 뜻이에요. 다음 문장에서 처음으로 굴렀다고 하니까, 이 문장은 기대를 키워 주는 장면이에요.","hl":"mn"},{"n":59,"text":"첫 번째, moved는 이미 지난 일이라 과거형으로 썼어요. move에 d만 붙이면 끝나죠. 두 번째, slowly는 부사예요. 어떻게 움직였는지 천천히라고 더 자세히 알려 주는 말이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 17 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러고 나서 처음으로,\u003c/span>\u003cspan class=\"en\">Then \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">first \u003c/span>\u003cspan class=\"tgt\">time\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 굴렀어요!\u003c/span>\u003cspan class=\"en\">he \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">rolled\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그리고 처음으로 그는 굴렀어요!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 계속 굴러보지 못했던 Bob이 마침내 처음으로 굴렀다는 뜻이에요. 이야기가 확 바뀌는 \u003cb class=\"key\">반전\u003c/b> 순간이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간을 나타내는 말(전치사 for)\u003c/span> : for the first time = 처음으로 : \"처음으로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(he) + 굴렀다(rolled) : \"굴렀어요\"\u003c/div>\u003c/div>","segs":[{"n":60,"text":"Then for the first time, 그러고 나서 처음으로. he rolled!, 그는 굴렀어요!. 이 문장 전체를 해석하면, 그리고 처음으로 그는 굴렀어요!","hl":"m"},{"n":61,"text":"계속 굴러보지 못했던 Bob이 드디어 처음으로 굴렀다는 뜻이에요. 앞에서는 자꾸 미끄러지기만 했으니까, 이건 아주 신나는 반전 순간이죠.","hl":"mn"},{"n":62,"text":"첫 번째, rolled는 지난 일이라 과거형이에요. roll에 ed를 붙였죠. 두 번째, for the first time은 처음으로라는 덩어리 표현이에요. 이렇게 몇 단어가 뭉쳐서 하나의 뜻을 만들면 통째로 외워 두면 아주 편해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 18 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Bob은 말했어요, &quot;고마워, 내 친구들아!&quot;\u003c/span>\u003cspan class=\"en\">Bob \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">said\u003c/span>, &quot;Thank you, my friends!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Bob은 &quot;고마워, 내 친구들아!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 친구들이 도와줘서 둥글게 변한 Bob이 고맙다고 인사하는 장면이에요. 친구에게 \u003cb class=\"key\">감사\u003c/b>의 마음을 전하는 말이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(불규칙 과거형)\u003c/span> : 누가(Bob) + 말했다(said) : \"말했어요\"\u003c/div>\u003c/div>","segs":[{"n":63,"text":"Bob said, Bob은 말했어요. \"Thank you, \"고마워. my friends!\", 내 친구들아!\". 이 문장 전체를 해석하면, Bob은 \"고마워, 내 친구들아!","hl":"m"},{"n":64,"text":"친구들이 도와줘서 둥글게 변한 Bob이 고맙다고 인사하는 장면이에요. 짧지만 마음이 아주 따뜻하게 느껴지는 말이죠.","hl":"mn"},{"n":65,"text":"said는 say의 과거형이에요. 보통은 ed를 붙이지만 said는 모양이 확 바뀌는 불규칙 동사라서 통째로 외워야 해요. 그리고 Thank you는 고마울 때 쓰는 아주 좋은 인사 표현이에요. 여러분도 친구에게 오늘 한 번 써 보세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 19 / 19\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">밥이 말했어요, &quot;고마워, 내 친구들! 항상 희망이 있어요 네가 포기하지 않을 때&quot;\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">is\u003c/span> always hope \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003cspan class=\"tgt\">give \u003c/span>\u003cspan class=\"tgt\">up\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">포기하지 않으면 항상 희망이 있구나.&quot;라고 말했어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 밥이 친구들에게 고마움을 전하며, \u003cb class=\"key\">포기\u003c/b>하지 않으면 언제나 \u003cb class=\"key\">희망\u003c/b>이 있다고 말해요. 이 이야기의 \u003cb class=\"key\">중심 \u003c/b>\u003cb class=\"key\">생각\u003c/b>을 담은 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">있어요 표현(There is/are)\u003c/span> : 무엇이(희망이) + 있어요(There is) + 항상(always) : \"희망이 있어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : when + 누가(you) + 안 해요(don't give up) : \"네가 포기하지 않을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(Bob) + 말했어요(said) : \"말했어요\"\u003c/div>\u003c/div>","segs":[{"n":66,"text":"Bob said, 밥이 말했어요. \"Thank you, my friends!, \"고마워, 내 친구들!. There is always hope, 항상 희망이 있어요. when you don't give up.\", 네가 포기하지 않을 때\". 이 문장 전체를 해석하면, 포기하지 않으면 항상 희망이 있구나.\"라고 말했어요.","hl":"m"},{"n":67,"text":"이 문장은 밥이 친구들에게 고맙다고 하면서 전하는 마지막 말이에요. 포기하지 않으면 언제나 희망이 있다는, 이 이야기의 중심 생각을 담고 있죠.","hl":"mn"},{"n":68,"text":"문법은 두 가지만 짚어 볼게요. 첫 번째, said는 이미 지난 일을 말하는 과거형이에요. say가 said로 바뀌었죠. 두 번째, There is는 무엇이 있다고 알려 줄 때 쓰는 표현이에요. 그리고 when은 네가 포기하지 않을 때처럼 때를 이어 주는 말이에요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">오늘 배운 내용 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>둥근 바위들은 언덕을 잘 \u003cb class=\"key\">굴러\u003c/b> 내려갔어요.\u003c/li>\u003cli>Bob은 한쪽이 \u003cb class=\"key\">평평\u003c/b>해서 구를 수 없었어요.\u003c/li>\u003cli>친구들이 \u003cb class=\"key\">진흙\u003c/b>을 발라 Bob을 둥글게 만들어 주었어요.\u003c/li>\u003cli>Bob은 처음으로 구르며 포기하지 않으면 \u003cb class=\"key\">희망\u003c/b>이 있다는 것을 알았어요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>If you don't give up, there is always hope.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: 언덕 위 바위 친구들 중 한쪽이 \u003cb class=\"key\">평평한\u003c/b> Bob만 구를 수 없었어요. 그런데 친구들이 \u003cb class=\"key\">진흙\u003c/b>을 발라 Bob을 둥글게 만들어 주자, Bob은 처음으로 \u003cb class=\"key\">구를\u003c/b> 수 있었어요.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":69,"text":"오늘 우리는 Bob이 친구들의 도움과 진흙 덕분에 둥글게 되어 처음으로 구른 이야기를 읽었어요. 그리고 포기하지 않으면 희망이 있다는 중요한 문장도 배웠죠. 여러분도 힘든 일이 있어도 Bob처럼 포기하지 마세요. 오늘 정말 잘했어요. 다음 시간에 또 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
