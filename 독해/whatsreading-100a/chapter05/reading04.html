</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"왓츠 리딩 100A Ch.5 Unit 04 Countries Full of Waste","audioDir":"reading04_audio","preview":false,"count":54,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.400em\">Ch.5 Unit\u003cbr>04 Countries\u003cbr>Full of Waste\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">왓츠 리딩 100A\u003c/div>\u003ch1>Countries Full of Waste: Where Does Our Trash Go?\u003c/h1>\u003ch2>쓰레기로 가득한 나라들: 우리 쓰레기는 어디로 갈까요?\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">한 줄 요약\u003c/span>\u003cspan>우리는 매일 쓰레기를 만들고 그중 일부만 \u003cb class=\"key\">재활용\u003c/b>해요. 어떤 나라들은 쓰레기를 다른 나라로 보내는데 이것을 \u003cb class=\"key\">쓰레기 \u003c/b>\u003cb class=\"key\">무역\u003c/b>이라고 하고, 쓰레기를 받은 나라 사람들은 \u003cb class=\"key\">쓰레기 \u003c/b>\u003cb class=\"key\">매립지\u003c/b> 근처에서 위험을 견디며 돈을 벌어요.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Some countries send their waste to other countries, and the people there live dangerously near landfills to make money.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘도 만나서 정말 반가워요. 오늘 읽을 글은 Countries Full of Waste, 쓰레기로 가득한 나라들이라는 글이에요. 우리가 버린 쓰레기가 어디로 가는지 상상해 본 적 있나요? 오늘 글은 바로 그 이야기를 들려줘요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">미리 알면 쉬워요\u003c/span>\u003cdiv class=\"lp-box\">우리가 버리는 \u003cb class=\"key\">쓰레기\u003c/b>는 영어로 waste라고 해요. 쓰레기를 땅에 파묻는 곳은 landfill, 우리말로 쓰레기 매립지예요. 재활용이 안 되는 쓰레기는 태우거나 이런 곳에 묻어요. 친구에게 숙제를 몰래 넘기면 친구만 힘들어지죠? \u003cb class=\"key\">쓰레기 \u003c/b>\u003cb class=\"key\">무역\u003c/b>도 똑같아서, 쓰레기를 보낸 나라는 편하지만 받은 나라 사람들은 아파요.\u003c/div>","segs":[{"n":2,"text":"여러분, 아침에 우유 팩을 버리고 점심엔 급식 용기를 버리죠? 우리는 이렇게 매일 쓰레기를 만들어요. 영어로 쓰레기는 waste, 쓰레기를 땅에 파묻는 곳은 landfill, 우리말로 쓰레기 매립지라고 해요. 재활용이 안 되는 쓰레기는 태우거나 이런 곳에 묻어요. 친구에게 숙제를 몰래 넘기면 친구만 힘들어지죠? 쓰레기를 다른 나라로 보내는 쓰레기 무역도 똑같아서, 보낸 나라는 편하지만 받은 나라 사람들은 아파요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>쓰레기의 종류\u003csmall>소개 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>우리 집에서 나오는 쓰레기에는 \u003cb class=\"key\">오래된 \u003c/b>\u003cb class=\"key\">음식\u003c/b>, 종이, 유리, 용기가 있어요. 우리는 이런 쓰레기를 \u003cb class=\"key\">매일\u003c/b> 만들어요. 그래서 쓰레기 문제는 모두의 문제예요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>쓰레기 처리 방법\u003csmall>방법 · 문장 4–6\u003c/small>\u003c/h4>\u003cp>우리는 종이와 플라스틱 용기를 \u003cb class=\"key\">재활용\u003c/b>해요. 다른 쓰레기는 대개 \u003cb class=\"key\">소각\u003c/b>되거나 쓰레기 매립지로 가요. 그런데 우리는 쓰레기를 정말 잘 \u003cb class=\"key\">처리\u003c/b>하고 있을까요?\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>쓰레기 무역\u003csmall>문제 · 문장 7–10\u003c/small>\u003c/h4>\u003cp>몇몇 나라들은 자기 쓰레기를 다른 나라로 보내요. 이것을 \u003cb class=\"key\">쓰레기 \u003c/b>\u003cb class=\"key\">무역\u003c/b>이라고 불러요. 쓰레기를 받은 나라에는 \u003cb class=\"key\">쓰레기 \u003c/b>\u003cb class=\"key\">매립지\u003c/b>가 많고, 많은 사람이 그 근처에 살아요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>사람들의 하루\u003csmall>결과 · 문장 11–14\u003c/small>\u003c/h4>\u003cp>사람들은 매립지에 들어가 팔 물건을 찾아요. 매립지 근처에 사는 것은 \u003cb class=\"key\">위험\u003c/b>하고 건강에 해로워서 사람들은 쓰레기 때문에 \u003cb class=\"key\">병\u003c/b>에 걸려요. 그래도 돈을 벌기 위해 계속 쓰레기를 모으는데, 그것이 그들의 \u003cb class=\"key\">유일한 \u003c/b>\u003cb class=\"key\">선택\u003c/b>이기 때문이에요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 한 번에 살펴볼까요? 쓰레기가 생기는 이야기부터 그 쓰레기가 어디로 가는지 순서대로 따라가면 아주 쉬워요.","hl":null},{"n":4,"text":"첫 번째 단계는 쓰레기의 종류예요. 우리 집에서 나오는 쓰레기에는 오래된 음식, 종이, 유리, 용기가 있어요. 우리는 이런 쓰레기를 매일 만들어요. 그래서 쓰레기 문제는 나만의 문제가 아니라 모두의 문제예요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 쓰레기를 어떻게 처리하는지예요. 우리는 종이와 플라스틱 용기를 재활용해요. 그리고 다른 쓰레기는 대개 소각되거나 쓰레기 매립지로 가요. 그런데 우리는 쓰레기를 정말 잘 처리하고 있을까요? 여기서 잠깐 생각해 보세요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 쓰레기 무역이에요. 몇몇 나라들은 자기 쓰레기를 다른 나라로 보내요. 이것을 waste trade, 쓰레기 무역이라고 불러요. 쓰레기를 받은 나라에는 쓰레기 매립지가 아주 많고, 많은 사람이 그 근처에 살아요.","hl":"f2"},{"n":7,"text":"마지막 단계는 그곳 사람들의 하루예요. 사람들은 매립지에 들어가 팔 물건을 찾아요. 쓰레기 매립지 근처에 사는 것은 위험하고 건강에 해로워서 사람들은 쓰레기로 인해 병에 걸려요. 그래도 그들은 돈을 벌기 위해 계속 쓰레기를 모은대요. 그것이 그들의 유일한 선택이기 때문이에요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">설명하기(질문을 던지고 예를 들어 알려 주는 글)\u003c/span>\u003cspan class=\"lp-pill\">가운데\u003c/span>\u003cspan class=\"lp-pill\">주제문 7번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 쓰레기의 종류와 처리 방법을 소개한 뒤 가운데에서 \u003cb class=\"key\">중심 \u003c/b>\u003cb class=\"key\">문장\u003c/b>을 말해요. 그리고 쓰레기 무역을 하는 나라를 예로 들어 \u003cb class=\"key\">매립지\u003c/b> 근처 사람들의 힘든 생활을 보여 줘요. 마지막에는 그들이 왜 계속 쓰레기를 모으는지 \u003cb class=\"key\">이유\u003c/b>를 알려 줘요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>like (4)\u003c/b>\u003cspan>예를 들 때 씀\u003c/span>\u003cb>But (6)\u003c/b>\u003cspan>생각을 바꾸며 문제를 던짐\u003c/span>\u003cb>It's called (8)\u003c/b>\u003cspan>이름을 붙여 알려 줌\u003c/span>\u003cb>However (14)\u003c/b>\u003cspan>앞 내용과 반대되는 내용\u003c/span>\u003cb>because (14)\u003c/b>\u003cspan>이유를 알려 줌\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Many people\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">They\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">People\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">they\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>쓰레기를 보내는 나라\u003c/th>\u003cth>쓰레기를 받는 나라\u003c/th>\u003c/tr>\u003ctr>\u003ctd>쓰레기를 다른 나라로 보냄\u003c/td>\u003ctd>쓰레기 매립지가 아주 많음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>쓰레기 걱정이 줄어듦\u003c/td>\u003ctd>사람들이 위험하고 아프게 삶\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 설명하는 글이에요. 쓰레기란 무엇인지 알려 주고, 질문을 던진 뒤, 다른 나라로 쓰레기를 보내는 예를 들어요. 중요한 중심 문장은 글 가운데에 있는 일곱 번째 문장이에요.","hl":"ty"},{"n":9,"text":"글의 길잡이 말을 찾아볼까요? But이 나오면 앞 내용과 다른 문제를 던지고, However가 나오면 앞 내용과 반대되는 이야기를 이어 줘요. 또 많은 사람들을 many people, they, people, they처럼 여러 가지 말로 가리키고 있으니 같은 사람을 말하는지 잘 확인해요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 단어\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>different\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>다른\u003c/span>\u003c/div>\u003cdiv>\u003cb>kinds\u003c/b>\u003cem>명사\u003c/em>\u003cspan>종류들\u003c/span>\u003c/div>\u003cdiv>\u003cb>waste\u003c/b>\u003cem>명사\u003c/em>\u003cspan>쓰레기\u003c/span>\u003c/div>\u003cdiv>\u003cb>include\u003c/b>\u003cem>동사\u003c/em>\u003cspan>포함하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>containers\u003c/b>\u003cem>명사\u003c/em>\u003cspan>용기, 그릇\u003c/span>\u003c/div>\u003cdiv>\u003cb>recycle\u003c/b>\u003cem>동사\u003c/em>\u003cspan>재활용하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>burned\u003c/b>\u003cem>동사\u003c/em>\u003cspan>태워지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>landfills\u003c/b>\u003cem>명사\u003c/em>\u003cspan>쓰레기 매립지\u003c/span>\u003c/div>\u003cdiv>\u003cb>manage\u003c/b>\u003cem>동사\u003c/em>\u003cspan>처리하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>send\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>waste trade\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>쓰레기 무역\u003c/span>\u003c/div>\u003cdiv>\u003cb>near\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~근처에\u003c/span>\u003c/div>\u003cdiv>\u003cb>look for\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>찾다\u003c/span>\u003c/div>\u003cdiv>\u003cb>sell\u003c/b>\u003cem>동사\u003c/em>\u003cspan>팔다\u003c/span>\u003c/div>\u003cdiv>\u003cb>dangerous\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>위험한\u003c/span>\u003c/div>\u003cdiv>\u003cb>unhealthy\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>건강에 해로운\u003c/span>\u003c/div>\u003cdiv>\u003cb>get sick\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>병에 걸리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>collect\u003c/b>\u003cem>동사\u003c/em>\u003cspan>모으다\u003c/span>\u003c/div>\u003cdiv>\u003cb>make money\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>돈을 벌다\u003c/span>\u003c/div>\u003cdiv>\u003cb>choice\u003c/b>\u003cem>명사\u003c/em>\u003cspan>선택\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"오늘의 단어도 소리 내어 읽어 볼게요. waste는 쓰레기, landfill는 쓰레기 매립지예요. recycle은 재활용하다, dangerous는 위험한, choice는 선택이라는 뜻이에요. 여러분도 한 번씩 따라 읽어 보세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">waste\u003c/b>\u003cspan class=\"m\">쓰레기\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">trash\u003c/span>\u003cspan class=\"s\">garbage\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">send\u003c/b>\u003cspan class=\"m\">보내다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">ship\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">receive\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">dangerous\u003c/b>\u003cspan class=\"m\">위험한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">unsafe\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">safe\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">sick\u003c/b>\u003cspan class=\"m\">아픈\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">ill\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">healthy\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">collect\u003c/b>\u003cspan class=\"m\">모으다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">gather\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">throw away\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"비슷한 말과 반대말도 함께 익혀요. waste는 trash, garbage와 비슷해요. send는 보내다이고 반대말은 receive, 받다예요. dangerous는 unsafe와 비슷하고 반대말은 safe, 안전한이에요. sick은 ill과 비슷하고 반대말은 healthy예요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">있습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">are\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다양한 종류의\u003c/span>\u003cspan class=\"en\">different kinds\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">쓰레기가\u003c/span>\u003cspan class=\"en\">of waste.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">다양한 종류의 쓰레기가 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글의 주제를 열어요. 세상에는 \u003cb class=\"key\">여러 \u003c/b>\u003cb class=\"key\">가지\u003c/b> \u003cb class=\"key\">쓰레기\u003c/b>가 있다는 것을 알려 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">여러 개 있음 표현(There is/are)\u003c/span> : 여러 개가 + 있다(There are) + 무엇이 : \"다양한 쓰레기가 있습니다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"There are, 있습니다. different kinds, 다양한 종류의. of waste, 쓰레기가. 이 문장 전체를 해석하면, 다양한 종류의 쓰레기가 있습니다.","hl":"m"},{"n":13,"text":"이 문장은 글의 주제를 열어 주는 문장이에요. 세상에는 여러 가지 쓰레기가 있다는 것을 알려 주죠.","hl":"mn"},{"n":14,"text":"여러 개의 것이 있을 때는 There are를 써요. 하나일 때는 There is를 써요. 여기서는 쓰레기 종류가 여러 가지라서 There are를 썼어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가정에서 나오는 쓰레기는 포함합니다\u003c/span>\u003cspan class=\"en\">Waste \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">homes\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">includes\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오래된 음식, 종이,\u003c/span>\u003cspan class=\"en\">old food, paper,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유리, 그릇,\u003c/span>\u003cspan class=\"en\">glass, containers,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 다른 것들을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">other \u003c/span>\u003cspan class=\"tgt\">things\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">가정에서 나오는 쓰레기는 오래된 음식, 종이, 유리, 그릇, 그리고 다른 것들을 포함합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 가정에서 나오는 쓰레기에 어떤 것들이 있는지 알려 줘요. 오래된 음식, 종이, 유리, 그릇처럼 \u003cb class=\"key\">우리 \u003c/b>\u003cb class=\"key\">집\u003c/b>에서 버리는 것들이 \u003cb class=\"key\">쓰레기\u003c/b>가 된다는 뜻이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">장소 짝꿍 말(전치사)\u003c/span> : 어디서(from) + 우리 집(our homes) : \"우리 가정에서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">한 사람·한 개일 때 동사 + s(3인칭 단수)\u003c/span> : 쓰레기(Waste) + 포함한다(includes) + 무엇을 : \"포함합니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 종이, 유리, 그릇 + 그리고(and) + 다른 것들 : \"그리고 다른 것들\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Waste from our homes includes, 가정에서 나오는 쓰레기는 포함합니다. old food, paper, 오래된 음식, 종이. glass, containers, 유리, 그릇. and other things, 그리고 다른 것들을. 이 문장 전체를 해석하면, 가정에서 나오는 쓰레기는 오래된 음식, 종이, 유리, 그릇, 그리고 다른 것들을 포함합니다.","hl":"m"},{"n":16,"text":"이 문장은 가정에서 나오는 쓰레기에 어떤 것들이 있는지 알려 줘요. 오래된 음식, 종이, 유리, 그릇처럼 우리 집에서 버리는 것들이 쓰레기가 된다는 뜻이죠.","hl":"mn"},{"n":17,"text":"먼저 from은 ~에서라는 장소 짝꿍 말이에요. 그래서 Waste from our homes는 우리 가정에서 나오는 쓰레기라는 뜻이죠. 그리고 주어 Waste가 한 덩어리라서 동사에 s를 붙여 includes라고 해요. 마지막으로 and는 종이, 유리, 그릇 같은 것들을 이어 주는 말이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 쓰레기를 만들어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">We \u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">waste\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매일\u003c/span>\u003cspan class=\"en\">every day.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 매일 쓰레기를 만들어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 쓰레기가 \u003cb class=\"key\">매일\u003c/b> 생긴다는 것을 알려 줘요. 우리 생활에서 쓰레기가 계속 나온다는 뜻이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">하는 일 말(일반동사 현재형)\u003c/span> : 우리는(We) + 만들어요(make) + 쓰레기를(waste) : \"우리는 쓰레기를 만들어요\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"We make waste, 우리는 쓰레기를 만들어요. every day, 매일. 이 문장 전체를 해석하면, 우리는 매일 쓰레기를 만들어요.","hl":"m"},{"n":19,"text":"이 문장은 쓰레기가 매일 생긴다는 것을 알려 줘요. 우리 생활에서 쓰레기가 계속 나온다는 뜻이죠.","hl":"mn"},{"n":20,"text":"자주 하는 일은 현재형 동사로 말해요. 주어 We 뒤에는 make를 그대로 써요. 그래서 We make waste는 우리는 쓰레기를 만들어요라는 뜻이 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 재활용해요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">We \u003c/span>\u003cspan class=\"tgt\">recycle\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">종이 같은 것들을\u003c/span>\u003cspan class=\"en\">things \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">paper \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 플라스틱 용기들을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">plastic \u003c/span>\u003cspan class=\"tgt\">containers\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 종이와 플라스틱 용기와 같은 것들을 재활용합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 우리가 재활용하는 것에는 종이와 플라스틱 용기가 있다는 걸 알려 주는 문장이에요. 글에서 \u003cb class=\"key\">재활용\u003c/b>하는 예를 보여 주는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">하는 일 말하기(일반동사 현재형)\u003c/span> : 누가(We) + 해요(recycle) : \"우리는 재활용해요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사(~와 같은) like\u003c/span> : 것들(things) + like(~와 같은) + 예(paper) : \"종이와 플라스틱 용기 같은\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"We recycle, 우리는 재활용해요. things like paper, 종이 같은 것들을. and plastic containers, 그리고 플라스틱 용기들을. 이 문장 전체를 해석하면, 우리는 종이와 플라스틱 용기와 같은 것들을 재활용합니다.","hl":"m"},{"n":22,"text":"이 문장은 우리가 버리는 것 가운데 종이와 플라스틱 용기를 다시 쓰는 물건으로 골라낸다는 뜻이에요. 글에서 재활용하는 예를 보여 주는 문장이죠.","hl":"mn"},{"n":23,"text":"첫 번째, We recycle은 '우리는 재활용해요'라는 뜻이에요. 매일 늘 하는 일이라서 동사를 그대로 썼고, 이걸 현재형이라고 해요. 두 번째, like는 '좋아하다'뿐 아니라 '~와 같은'이라는 뜻도 있어요. 그래서 things like paper는 '종이 같은 것들'이 되죠. 예를 들 때 쓰는 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 것들은\u003c/span>\u003cspan class=\"en\">Other things\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대개 소각돼요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">usually\u003c/span> get burned\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아니면 쓰레기 매립지로 가요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">or\u003c/span> go \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">landfills\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">다른 것들은 대개 소각되거나 쓰레기 매립지로 가지요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 재활용하지 않는 다른 것들은 대개 태워지거나 매립지로 간다는 뜻이에요. 글에서 쓰레기를 처리하는 두 가지 방법을 알려 주는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">더 자세히 알려 주는 말(부사)\u003c/span> : 보통(usually) + 하는 일(get burned) : \"대개\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사) or\u003c/span> : A(get burned) or B(go to landfills) : \"또는, 아니면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">장소 짝꿍 말(전치사) to\u003c/span> : 가다(go) + to + 장소(landfills) : \"매립지로\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Other things, 다른 것들은. usually get burned, 대개 소각돼요. or go to landfills, 아니면 쓰레기 매립지로 가요. 이 문장 전체를 해석하면, 다른 것들은 대개 소각되거나 쓰레기 매립지로 가지요.","hl":"m"},{"n":25,"text":"이 문장은 재활용하지 않는 다른 쓰레기들은 대개 태워지거나 매립지로 간다는 뜻이에요. 두 가지 처리 방법을 알려 주는 문장이죠.","hl":"mn"},{"n":26,"text":"첫 번째, usually는 '대개, 보통'이라는 뜻이에요. 얼마나 자주인지 알려 주는 말이고, 이걸 부사라고 해요. 두 번째, or는 '또는, 아니면'이라는 뜻으로 두 가지를 이어 줘요. 이걸 접속사라고 하죠. 세 번째, to는 '~로'라는 뜻으로 어디로 가는지 알려 주는 전치사예요. 그래서 go to landfills는 '매립지로 가다'가 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 우리는\u003c/span>\u003cspan class=\"en\">But \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">쓰레기를 처리하나요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">manage\u003c/span> waste\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">잘?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">well\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 우리는 쓰레기를 잘 처리하고 있는 걸까요?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 우리가 쓰레기를 잘 처리하고 있는지 물어보는 문장이에요. 글에서 \u003cb class=\"key\">문제\u003c/b>를 던지면서 다음 내용이 궁금해지게 만들어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">질문 만들기(일반동사 의문문)\u003c/span> : Do + 누가(we) + 하다(manage)? : \"우리는 처리하나요?\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">더 자세히 알려 주는 말(부사)\u003c/span> : 하는 일(manage) + 잘(well) : \"잘\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"But do we, 하지만 우리는. manage waste, 쓰레기를 처리하나요. well?, 잘?. 이 문장 전체를 해석하면, 하지만 우리는 쓰레기를 잘 처리하고 있는 걸까요?","hl":"m"},{"n":28,"text":"이 문장은 우리가 쓰레기를 잘 처리하고 있는지 물어보는 문장이에요. 글 가운데에서 문제를 던져서 다음 내용이 궁금해지게 만들어요.","hl":"mn"},{"n":29,"text":"첫 번째, 일반동사로 물어볼 때는 문장 앞에 do를 세워요. 그래서 Do we manage가 '우리는 처리하나요'라는 질문이 되고, 이걸 의문문이라고 해요. 두 번째, well은 '잘'이라는 뜻으로 어떻게 하는지 알려 주는 부사예요. good은 물건이 좋다는 뜻이고, well은 하는 일을 잘한다는 뜻이에요. 이 문장은 꼭 외워 두면 좋아요!","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 14\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몇몇 나라들은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Some \u003c/span>\u003cspan class=\"tgt\">countries\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 쓰레기를 보냅니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">send \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">waste\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 나라들로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">other \u003c/span>\u003cspan class=\"tgt\">countries\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">몇몇 나라들은 쓰레기를 다른 나라로 보냅니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 몇몇 나라가 \u003cb class=\"key\">쓰레기\u003c/b>를 다른 나라로 보낸다는 사실을 말해요. 뒤에 나올 \u003cb class=\"key\">쓰레기 \u003c/b>\u003cb class=\"key\">무역\u003c/b> 이야기의 시작이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">몇몇을 말하는 수량 표현(Some/Any)\u003c/span> : some + 복수 명사 = 몇몇 ~들 : \"몇몇 나라들은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">무엇을 말하는 말(목적어)\u003c/span> : 누가(Some countries) + 보낸다(send) + 무엇을(their waste) : \"그들의 쓰레기를 보냅니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">장소·방향 짝꿍 말(전치사 to)\u003c/span> : 보내다(send) + 어디로(to + 장소) : \"다른 나라들로\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Some countries, 몇몇 나라들은. send their waste, 그들의 쓰레기를 보냅니다. to other countries, 다른 나라들로. 이 문장 전체를 해석하면, 몇몇 나라들은 쓰레기를 다른 나라로 보냅니다.","hl":"m"},{"n":31,"text":"이 문장은 몇몇 나라가 자기 나라 쓰레기를 다른 나라로 보낸다고 말해요. 바로 쓰레기 무역 이야기의 시작이에요.","hl":"mn"},{"n":32,"text":"먼저 Some countries는 여러 나라 중 몇몇을 말해요. countries는 여러 개라서 복수 명사를 썼어요. send their waste는 보내는 무엇을 말하는 목적어가 와요. 마지막으로 to other countries에서 to는 어디로 가는 방향을 알려 주는 전치사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 불려요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It's\u003c/span> called\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">쓰레기 무역이라고\u003c/span>\u003cspan class=\"en\">waste trade.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 쓰레기 무역이라고 불려요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 말한 일의 \u003cb class=\"key\">이름\u003c/b>을 알려 줘요. 그 이름이 바로 \u003cb class=\"key\">쓰레기 \u003c/b>\u003cb class=\"key\">무역\u003c/b>이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사 줄임말(be동사)\u003c/span> : It is → It's : \"그것은 ~예요\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"It's called, 그것은 불려요. waste trade, 쓰레기 무역이라고. 이 문장 전체를 해석하면, 그것은 쓰레기 무역이라고 불려요.","hl":"m"},{"n":34,"text":"이 문장은 앞에서 말한 일의 이름을 알려 줘요. 그 이름이 바로 쓰레기 무역이에요.","hl":"mn"},{"n":35,"text":"It's는 It is를 짧게 줄인 be동사 줄임말이에요. 여기서는 불려요라는 덩어리 표현으로 쓰였어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">있습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">are\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 쓰레기 매립지가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">many \u003c/span>\u003cspan class=\"tgt\">landfills\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그런 나라에는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">those \u003c/span>\u003cspan class=\"tgt\">countries\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그런 나라에는 많은 쓰레기 매립지가 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 쓰레기를 받은 나라들에는 \u003cb class=\"key\">쓰레기 \u003c/b>\u003cb class=\"key\">매립지\u003c/b>가 아주 많다는 뜻이에요. 그래서 다음 문장에서 그곳 사람들 이야기가 이어져요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">있음을 말하는 표현(There is/are)\u003c/span> : There are + 여러 개 = ~이 있습니다 : \"~이 있습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">많은 수 말하기(수량 표현 many)\u003c/span> : many + 셀 수 있는 복수 명사 : \"많은 쓰레기 매립지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">장소 짝꿍 말(전치사 in)\u003c/span> : in + 장소 = ~ 안에/에는 : \"그런 나라에는\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"There are, 있습니다. many landfills, 많은 쓰레기 매립지가. in those countries, 그런 나라에는. 이 문장 전체를 해석하면, 그런 나라에는 많은 쓰레기 매립지가 있습니다.","hl":"m"},{"n":37,"text":"이 문장은 쓰레기를 받은 나라들에 쓰레기 매립지가 아주 많다고 말해요. 그래서 다음 문장에서 그곳 사람들 이야기가 이어져요.","hl":"mn"},{"n":38,"text":"There are는 여러 개가 있다고 말할 때 쓰는 표현이에요. 뒤에는 복수 명사가 와요. many landfills는 셀 수 있는 것이 많을 때 many와 복수 명사를 쓰는 부분이에요. in those countries에서 in은 장소를 알려 주는 전치사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 사람들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Many \u003c/span>\u003cspan class=\"tgt\">people\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">근처에 삽니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">live \u003c/span>\u003cspan class=\"tgt\">near \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">쓰레기 매립지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">landfill\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">많은 사람들이 쓰레기 매립지 근처에 삽니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 \u003cb class=\"key\">쓰레기 \u003c/b>\u003cb class=\"key\">매립지\u003c/b> 가까이 사는 사람들이 많다는 걸 알려 줘요. 그래서 다음 문장이 더 궁금해져요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">많다는 말(many + 복수 명사)\u003c/span> : 많은(Many) + 사람들(people) : \"많은 사람들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지금도 그렇다고 말하기(현재 시제)\u003c/span> : 그들은(They) + 산다(live) + 근처에(near) + 쓰레기 매립지(a landfill) : \"쓰레기 매립지 근처에 산다\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"Many people, 많은 사람들이. live near, 근처에 삽니다. a landfill, 쓰레기 매립지. 이 문장 전체를 해석하면, 많은 사람들이 쓰레기 매립지 근처에 삽니다.","hl":"m"},{"n":40,"text":"이 문장은 쓰레기 매립지 가까이에 사는 사람들이 많다는 걸 알려 줘요. 그래서 다음에 무슨 일이 일어나는지 궁금해지죠.","hl":"mn"},{"n":41,"text":"첫 번째, 셀 수 있는 사람이 많을 때는 many를 써요. 그래서 Many people이라고 말해요. 두 번째, 지금도 그렇다는 사실은 현재형 live로 말해요. people은 여러 명이라서 live에 s를 붙이지 않아요. 아주 잘 따라오고 있어요!","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 들어가요\u003c/span>\u003cspan class=\"en\">They go into\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 쓰레기 매립지에\u003c/span>\u003cspan class=\"en\">the l\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">and\u003c/span>fill\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 찾아요\u003c/span>\u003cspan class=\"en\">and look for\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">팔 물건들을\u003c/span>\u003cspan class=\"en\">things \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">sell\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 쓰레기 매립지에 가서 팔 물건들을 찾습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 사람들이 매립지에 \u003cb class=\"key\">들어가서\u003c/b> 팔 물건을 찾는다는 걸 보여 줘요. 힘든 일이지만 \u003cb class=\"key\">돈을 \u003c/b>\u003cb class=\"key\">벌기 \u003c/b>\u003cb class=\"key\">위해\u003c/b> 하는 거예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 가다(go) + 그리고(and) + 찾다(look for) : \"그리고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to + 동사원형(to부정사)\u003c/span> : things(물건들) + to sell(팔다) : \"팔\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"They go into, 그들은 들어가요. the landfill, 그 쓰레기 매립지에. and look for, 그리고 찾아요. things to sell, 팔 물건들을. 이 문장 전체를 해석하면, 그들은 쓰레기 매립지에 가서 팔 물건들을 찾습니다.","hl":"m"},{"n":43,"text":"이 문장은 사람들이 매립지에 들어가서 팔 물건을 찾는다는 걸 보여 줘요. 힘든 일이지만 돈을 벌기 위해 하는 거예요.","hl":"mn"},{"n":44,"text":"첫 번째, 두 가지 일을 이어 줄 때는 and를 써요. 가는 일과 찾는 일을 자연스럽게 이어 주죠. 두 번째, things to sell처럼 이름 말 뒤에 to와 동사원형을 붙이면 '팔 물건'이라는 뜻이 돼요. 이걸 to부정사라고 불러요. 오늘 배운 표현 꼭 기억해 두세요!","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 14\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">근처에 사는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Living \u003c/span>\u003cspan class=\"tgt\">near \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">쓰레기 매립지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">landfill\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">위험해요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is\u003c/span> dangerous\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 건강에 해로워요\u003c/span>\u003cspan class=\"en\">and unhealthy.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">쓰레기 매립지 근처에 사는 것은 위험하고 건강에 해롭습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 매립지 근처에 사는 것이 \u003cb class=\"key\">위험하고\u003c/b> \u003cb class=\"key\">건강에 \u003c/b>\u003cb class=\"key\">해롭다\u003c/b>는 걸 알려 줘요. 앞 문장의 사람들을 생각하면 마음이 아파요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사-ing가 이름 말처럼 쓰임(동명사)\u003c/span> : Living(사는 것) + near a landfill(매립지 근처에) : \"쓰레기 매립지 근처에 사는 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">am·are·is 친구들(be동사)\u003c/span> : Living(~하는 것) + is(~이다) + dangerous(위험한) : \"~이다\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"Living near, 근처에 사는 것은. a landfill, 쓰레기 매립지. is dangerous, 위험해요. and unhealthy, 그리고 건강에 해로워요. 이 문장 전체를 해석하면, 쓰레기 매립지 근처에 사는 것은 위험하고 건강에 해롭습니다.","hl":"m"},{"n":46,"text":"이 문장은 매립지 근처에 사는 것이 위험하고 건강에 해롭다는 걸 알려 줘요. 앞 문장에서 물건을 찾던 사람들을 생각하면 마음이 아프죠.","hl":"mn"},{"n":47,"text":"첫 번째, 동사에 ing를 붙인 Living은 '사는 것'이라는 이름 말이 돼요. 이렇게 만든 말을 동명사라고 해요. 두 번째, 주어가 하나의 '것'이니까 be동사는 is를 골라요. 그래서 Living near a landfill is라고 말하는 거예요. 오늘 세 문장 모두 멋지게 읽었어요!","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들은 아프게 돼요\u003c/span>\u003cspan class=\"en\">People \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">get \u003c/span>\u003cspan class=\"tgt\">sick\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">쓰레기 때문에요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">waste\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사람들은 쓰레기로 인해 병에 걸리기도 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 쓰레기 때문에 사람들이 아프게 된다는 뜻이에요. 쓰레기장 근처에 사는 것이 얼마나 \u003cb class=\"key\">위험한지\u003c/b> 잘 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">보충하는 말(보어)\u003c/span> : 누가(People) + 된다(get) + 아프게(sick) : \"아프게 되다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">까닭을 알려 주는 말(전치사)\u003c/span> : 아픈 까닭 + 쓰레기로부터(from the waste) : \"쓰레기 때문에\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"People get sick, 사람들은 아프게 돼요. from the waste, 쓰레기 때문에요. 이 문장 전체를 해석하면, 사람들은 쓰레기로 인해 병에 걸리기도 합니다.","hl":"m"},{"n":49,"text":"쓰레기 때문에 사람들이 병에 걸린다는 뜻이에요. 쓰레기장 가까이 사는 사람들에게 일어나는 안타까운 일이지요.","hl":"mn"},{"n":50,"text":"첫 번째, get sick에서 get은 '되다'라는 뜻이에요. sick은 상태를 알려 주는 말이지요. 두 번째, from the waste는 아픈 까닭을 알려 줘요. from은 '~로부터'라는 뜻이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 그들은 계속해요\u003c/span>\u003cspan class=\"en\">However, they \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">keep \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">쓰레기를 모으는 것을요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">collecting\u003c/span> waste\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">돈을 벌기 위해서요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">money\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜냐하면 그것이 이기 때문이에요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">because \u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 유일한 선택권이요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">only \u003c/span>\u003cspan class=\"tgt\">choice\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 그들은 돈을 벌기 위해 계속 쓰레기를 모으는데, 그것이 그들의 유일한 선택권이기 때문입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 돈을 벌기 위해 어쩔 수 없이 계속 쓰레기를 모은다는 뜻이에요. 그들에게는 \u003cb class=\"key\">다른 \u003c/b>\u003cb class=\"key\">방법\u003c/b>이 없다는 안타까운 사정을 전해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사-ing(동명사)\u003c/span> : 그들은(they) + 계속한다(keep) + 모으는 것을(collecting) : \"모으는 것을 계속하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to + 동사원형(to부정사)\u003c/span> : 벌기 위해(to make) + 돈을(money) : \"돈을 벌기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 왜냐하면(because) + 그것이(that) + 이기 때문이다(is) : \"왜냐하면 그것이 ~이기 때문\"\u003c/div>\u003c/div>","segs":[{"n":51,"text":"However, they keep, 하지만 그들은 계속해요. collecting waste, 쓰레기를 모으는 것을요. to make money, 돈을 벌기 위해서요. because that is, 왜냐하면 그것이 이기 때문이에요. their only choice, 그들의 유일한 선택권이요. 이 문장 전체를 해석하면, 하지만 그들은 돈을 벌기 위해 계속 쓰레기를 모으는데, 그것이 그들의 유일한 선택권이기 때문입니다.","hl":"m"},{"n":52,"text":"돈을 벌기 위해 어쩔 수 없이 계속 쓰레기를 모은다는 뜻이에요. 그들에게는 다른 방법이 없다는 안타까운 이야기지요.","hl":"mn"},{"n":53,"text":"첫 번째, keep collecting은 '모으는 것을 계속하다'라는 뜻이에요. 계속한다는 말이 앞에 붙었지요. 두 번째, to make money는 '돈을 벌기 위해'라는 목적을 알려 줘요. 세 번째, because는 이유를 알려 주는 이어 주는 말이에요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">오늘 배운 내용 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>쓰레기에는 오래된 음식, 종이, 유리, 용기 등 \u003cb class=\"key\">여러 \u003c/b>\u003cb class=\"key\">종류\u003c/b>가 있어요.\u003c/li>\u003cli>재활용이 안 되는 쓰레기는 \u003cb class=\"key\">소각\u003c/b>되거나 \u003cb class=\"key\">매립지\u003c/b>로 가요.\u003c/li>\u003cli>자기 나라 쓰레기를 다른 나라로 보내는 것을 \u003cb class=\"key\">쓰레기 \u003c/b>\u003cb class=\"key\">무역\u003c/b>이라고 해요.\u003c/li>\u003cli>매립지 근처 사람들은 아프면서도 돈을 벌기 위해 계속 \u003cb class=\"key\">쓰레기를 \u003c/b>\u003cb class=\"key\">모아요\u003c/b>.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Some countries send their waste to other countries, and the people there live dangerously near landfills to make money.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">우리는 매일 쓰레기를 만들고 그중 일부만 \u003cb class=\"key\">재활용\u003c/b>해요. 어떤 나라들은 쓰레기를 다른 나라로 보내는데 이것을 \u003cb class=\"key\">쓰레기 \u003c/b>\u003cb class=\"key\">무역\u003c/b>이라고 하고, 쓰레기를 받은 나라 사람들은 \u003cb class=\"key\">쓰레기 \u003c/b>\u003cb class=\"key\">매립지\u003c/b> 근처에서 위험을 견디며 돈을 벌어요.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":54,"text":"오늘 우리는 쓰레기 무역에 대해 배웠어요. 쓰레기는 다른 나라로 보내도 사라지지 않고, 그곳 사람들을 아프게 한다는 것도 알았죠. 여러분이 오늘 배운 표현을 한 번씩 소리 내어 말해 보면 정말 멋질 거예요. 오늘도 끝까지 잘 따라와 준 여러분, 정말 대단해요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
