@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"왓츠 리딩 100A Ch.5 Unit 02 Money for Hard Work","audioDir":"reading02_audio","preview":false,"count":43,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.400em\">Ch.5 Unit\u003cbr>02 Money for\u003cbr>Hard Work\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">왓츠 리딩 100A\u003c/div>\u003ch1>The Sweet and Bitter Side of Chocolate\u003c/h1>\u003ch2>초콜릿의 달콤한 면과 씁쓸한 면\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">한 줄 요약\u003c/span>\u003cspan>초콜릿은 무척 달콤하지만, 그 뒤에는 \u003cb class=\"key\">카카오 \u003c/b>\u003cb class=\"key\">열매\u003c/b>를 얻는 힘든 노동과 \u003cb class=\"key\">공정하지 \u003c/b>\u003cb class=\"key\">않은 \u003c/b>\u003cb class=\"key\">돈\u003c/b>이라는 씁쓸한 문제가 숨어 있어요. 그래서 사람들은 \u003cb class=\"key\">Fairtrade\u003c/b>라는 사회 운동으로 농부들이 일한 만큼 공정한 돈을 받도록 돕고 있어요.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Chocolate has a bitter side, so Fairtrade helps farmers get fair money for their hard work.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘도 만나서 정말 반가워요. 오늘은 우리가 아주 좋아하는 초콜릿에 숨은 이야기를 읽어 볼 거예요. 달콤한 초콜릿 뒤에 어떤 씁쓸한 단면이 있는지, 그리고 사람들이 그 문제를 어떻게 해결했는지 함께 알아봐요. 한 줄로 말하면, 초콜릿에는 달콤함과 씁쓸함이 함께 있어요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">미리 알면 쉬워요\u003c/span>\u003cdiv class=\"lp-box\">초콜릿은 \u003cb class=\"key\">카카오 \u003c/b>\u003cb class=\"key\">열매\u003c/b>(cacao beans)라는 씨앗으로 만들어요. 그런데 이 열매를 따고 모으는 일은 아주 힘들어요. 우리가 마트에서 초콜릿을 살 때, 그 돈이 농부에게 공정하게 돌아가지 않을 때도 있어요. 친구들과 간식을 나눠 먹을 때 만든 사람에게 고마운 마음을 전하는 것과 비슷해요. \u003cb class=\"key\">Fairtrade\u003c/b>(fair trade)는 '공정한 거래'라는 뜻으로, 일한 만큼 제값을 주자는 약속이에요.\u003c/div>","segs":[{"n":2,"text":"여러분, 초콜릿이 어떤 재료로 만들어지는지 알고 있나요? 바로 카카오 열매라는 씨앗으로 만들어요. 그런데 이 열매를 따고 모으는 일은 아주 힘들어요. 우리가 마트에서 초콜릿을 살 때, 그 돈이 농부에게 공정하게 돌아가지 않을 때도 있답니다. 친구들과 간식을 나눌 때 만든 사람에게 고마운 마음을 전하는 것처럼, 일한 사람에게 제값을 주는 것이 중요해요. 이걸 fair trade, 공정한 거래라고 불러요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>달콤한 겉모습\u003csmall>시작 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>초콜릿은 아주 \u003cb class=\"key\">달콤\u003c/b>해요. 하지만 우리가 잘 모르는 \u003cb class=\"key\">씁쓸한 \u003c/b>\u003cb class=\"key\">단면\u003c/b>이 숨어 있다고 말해요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>힘든 노동\u003csmall>문제 · 문장 3–6\u003c/small>\u003c/h4>\u003cp>초콜릿은 \u003cb class=\"key\">카카오 \u003c/b>\u003cb class=\"key\">열매\u003c/b>로 만들어요. 그런데 열매를 얻는 일은 아주 \u003cb class=\"key\">힘든 \u003c/b>\u003cb class=\"key\">노동\u003c/b>이에요. 오래전 노예들도, 오늘날 일부 농부들도 일한 만큼 \u003cb class=\"key\">공정한 \u003c/b>\u003cb class=\"key\">돈\u003c/b>을 받지 못했어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>Fairtrade의 시작\u003csmall>해결 · 문장 7–9\u003c/small>\u003c/h4>\u003cp>그래서 한 무리의 사람들이 \u003cb class=\"key\">Fairtrade\u003c/b>를 시작했어요. Fairtrade는 농부들을 돕는 \u003cb class=\"key\">사회 \u003c/b>\u003cb class=\"key\">운동\u003c/b>이에요. 농부들은 이 운동을 통해 \u003cb class=\"key\">공정한 \u003c/b>\u003cb class=\"key\">돈\u003c/b>을 받게 되었어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>나아진 삶\u003csmall>결과 · 문장 10–11\u003c/small>\u003c/h4>\u003cp>그 돈으로 농부들은 자신의 \u003cb class=\"key\">삶\u003c/b>을 더 좋게 만들 수 있어요. 또 자신의 \u003cb class=\"key\">미래\u003c/b>를 계획할 수도 있어요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 달콤한 초콜릿 이야기로 시작해서, 숨어 있는 문제를 보여 주고, 마지막에 해결책을 알려 주는 순서로 되어 있어요.","hl":null},{"n":4,"text":"먼저 첫 번째 문장을 봐요. Chocolate is very sweet. 초콜릿은 무척 달콤하다고 말하고 있죠. 그런데 두 번째 문장에서 But there is a bitter side of chocolate이라고 해요. 달콤한 초콜릿에 우리가 잘 모르는 씁쓸한 단면이 있다는 거예요.","hl":"f0"},{"n":5,"text":"이제 문제가 나와요. 사람들은 카카오 열매로 초콜릿을 만들어요. 하지만 그 열매를 얻는 데는 힘든 노동이 필요해요. 오래전에는 많은 노예들이 오랜 시간 일했지만 돈을 못 받았고, 오늘날에도 일부 농부들은 공정한 돈을 받지 못해요.","hl":"f1"},{"n":6,"text":"그래서 사람들이 움직였어요. 한 무리의 사람들이 Fairtrade를 시작했어요. Fairtrade는 농부들을 돕는 사회 운동이에요. 이 운동을 통해서 농부들은 일한 만큼 공정한 돈을 받게 되었답니다.","hl":"f2"},{"n":7,"text":"마지막으로 좋은 결과가 나와요. 농부들은 그 돈으로 자신의 삶을 더 좋게 만들 수 있어요. 또 자신의 미래를 계획할 수도 있죠. 이 문장을 읽으면 마음이 참 따뜻해져요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결\u003c/span>\u003cspan class=\"lp-pill\">처음\u003c/span>\u003cspan class=\"lp-pill\">주제문 2번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 \u003cb class=\"key\">달콤한 \u003c/b>\u003cb class=\"key\">초콜릿\u003c/b> 이야기로 시작하지만, 두 번째 문장에서 \u003cb class=\"key\">씁쓸한 \u003c/b>\u003cb class=\"key\">단면\u003c/b>이 있다고 알려 줘요. 그다음 농부들이 겪는 \u003cb class=\"key\">문제\u003c/b>를 보여 주고, 마지막에는 \u003cb class=\"key\">Fairtrade\u003c/b>라는 \u003cb class=\"key\">해결책\u003c/b>을 소개해요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>But (2)\u003c/b>\u003cspan>반대 내용 알려 줌\u003c/span>\u003cb>But (4)\u003c/b>\u003cspan>반대 내용 알려 줌\u003c/span>\u003cb>Still today (6)\u003c/b>\u003cspan>지금도 이어진다는 것을 알려 줌\u003c/span>\u003cb>In 1988 (7)\u003c/b>\u003cspan>때를 알려 줌\u003c/span>\u003cb>Through Fairtrade (9)\u003c/b>\u003cspan>해결 방법을 알려 줌\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Chocolate\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">cacao beans\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the beans\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>달콤한 겉모습\u003c/th>\u003cth>씁쓸한 현실\u003c/th>\u003c/tr>\u003ctr>\u003ctd>맛은 달콤함\u003c/td>\u003ctd>일은 아주 힘듦\u003c/td>\u003c/tr>\u003ctr>\u003ctd>우리는 잘 모름\u003c/td>\u003ctd>농부는 공정한 돈을 못 받음\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 문제와 해결로 짜여 있어요. 먼저 농부들이 공정한 돈을 받지 못하는 문제를 보여 주고, Fairtrade라는 해결책을 알려 주죠. 중심 문장은 글의 처음 부분인 두 번째 문장에 있어요. 달콤한 초콜릿에 씁쓸한 단면이 있다는 말이 이 글의 중심 생각이에요.","hl":"ty"},{"n":9,"text":"글의 길잡이 말을 잘 보면 흐름이 보여요. 두 번째 문장과 네 번째 문장은 But으로 시작하는데, 앞 내용과 반대되는 이야기를 꺼낼 때 쓰는 말이에요. 일곱 번째 문장 앞의 In 1988은 때를 알려 주고, 아홉 번째 문장 앞의 Through Fairtrade는 어떤 방법으로 문제를 푸는지 알려 줘요. 또 farmers, the farmers, they처럼 농부를 가리키는 말이 조금씩 달라지는 것도 눈여겨보세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 단어\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>sweet\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>달콤한\u003c/span>\u003c/div>\u003cdiv>\u003cb>bitter\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>쓴, 씁쓸한\u003c/span>\u003c/div>\u003cdiv>\u003cb>side\u003c/b>\u003cem>명사\u003c/em>\u003cspan>면, 단면\u003c/span>\u003c/div>\u003cdiv>\u003cb>cacao beans\u003c/b>\u003cem>명사\u003c/em>\u003cspan>카카오 열매\u003c/span>\u003c/div>\u003cdiv>\u003cb>get\u003c/b>\u003cem>동사\u003c/em>\u003cspan>얻다, 구하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>hard work\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>힘든 노동\u003c/span>\u003c/div>\u003cdiv>\u003cb>a long time ago\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>오래전에\u003c/span>\u003c/div>\u003cdiv>\u003cb>slave\u003c/b>\u003cem>명사\u003c/em>\u003cspan>노예\u003c/span>\u003c/div>\u003cdiv>\u003cb>work long hours\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>오랜 시간 일하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>money\u003c/b>\u003cem>명사\u003c/em>\u003cspan>돈\u003c/span>\u003c/div>\u003cdiv>\u003cb>still\u003c/b>\u003cem>부사\u003c/em>\u003cspan>여전히, 아직도\u003c/span>\u003c/div>\u003cdiv>\u003cb>farmer\u003c/b>\u003cem>명사\u003c/em>\u003cspan>농부\u003c/span>\u003c/div>\u003cdiv>\u003cb>fair\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>공정한\u003c/span>\u003c/div>\u003cdiv>\u003cb>a group of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>한 무리의\u003c/span>\u003c/div>\u003cdiv>\u003cb>social movement\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사회 운동\u003c/span>\u003c/div>\u003cdiv>\u003cb>help\u003c/b>\u003cem>동사\u003c/em>\u003cspan>돕다\u003c/span>\u003c/div>\u003cdiv>\u003cb>through\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~을 통해서\u003c/span>\u003c/div>\u003cdiv>\u003cb>make their lives better\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>그들의 삶을 더 좋게 만들다\u003c/span>\u003c/div>\u003cdiv>\u003cb>plan for\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 계획하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>future\u003c/b>\u003cem>명사\u003c/em>\u003cspan>미래\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"오늘의 단어도 소리 내어 읽어 볼까요? sweet은 달콤한, bitter는 쓴이라는 뜻이에요. cacao beans는 카카오 열매, hard work는 힘든 노동이에요. fair는 공정한이라는 뜻이고, social movement는 사회 운동이에요. through는 무엇을 통해서라는 뜻으로 쓰였어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">sweet\u003c/b>\u003cspan class=\"m\">달콤한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">sugary\u003c/span>\u003cspan class=\"s\">tasty\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">bitter\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">bitter\u003c/b>\u003cspan class=\"m\">쓴, 씁쓸한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">sour\u003c/span>\u003cspan class=\"s\">sharp\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">sweet\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">hard\u003c/b>\u003cspan class=\"m\">힘든\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">difficult\u003c/span>\u003cspan class=\"s\">tough\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">easy\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">fair\u003c/b>\u003cspan class=\"m\">공정한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">right\u003c/span>\u003cspan class=\"s\">just\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unfair\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">help\u003c/b>\u003cspan class=\"m\">돕다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">support\u003c/span>\u003cspan class=\"s\">aid\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hurt\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">better\u003c/b>\u003cspan class=\"m\">더 좋은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">nicer\u003c/span>\u003cspan class=\"s\">improved\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">worse\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"비슷한 말과 반대말도 정리해 봐요. sweet의 반대말은 bitter이고, bitter의 반대말은 sweet이에요. 참 재미있죠? hard는 difficult와 비슷하고 반대말은 easy예요. fair는 right와 비슷하고 반대말은 unfair예요. help는 support와 비슷하고 반대말은 hurt랍니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">초콜릿은 ~이에요\u003c/span>\u003cspan class=\"en\">Chocolate \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무척 달콤해요\u003c/span>\u003cspan class=\"en\">very sweet.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">초콜릿은 무척 달콤해요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 초콜릿은 아주 달콤하다는 걸 먼저 말해요. 뒤에 나올 \u003cb class=\"key\">쓴맛\u003c/b> 이야기와 \u003cb class=\"key\">반대\u003c/b>되는 내용이라서 글의 시작을 열어 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">am·are·is 친구들(be동사)\u003c/span> : 누가(Chocolate) + 이다(is) + 어떤 상태(very sweet) : \"초콜릿은 무척 달콤해요\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Chocolate is, 초콜릿은 ~이에요. very sweet, 무척 달콤해요. 이 문장 전체를 해석하면, 초콜릿은 무척 달콤해요.","hl":"m"},{"n":13,"text":"첫 번째 문장은 초콜릿이 아주 달콤하다고 말해요. 뒤에 나올 쓴맛 이야기와 반대되는 내용이라서, 글의 시작을 부드럽게 열어 주는 문장이에요.","hl":"mn"},{"n":14,"text":"첫 번째로, 주어가 하나일 때는 be동사 중에서 is를 골라요. 초콜릿은 하나니까 is가 와요. 두 번째로, sweet는 달콤하다는 뜻인데, very를 앞에 붙이면 무척 달콤하다는 말이 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 11\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 ~이 있어요\u003c/span>\u003cspan class=\"en\">But \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">is\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">쓴맛이 나는 한쪽 면이\u003c/span>\u003cspan class=\"en\">a bitter side\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">초콜릿의\u003c/span>\u003cspan class=\"en\">of chocolate,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그런데 우리는 ~하지 않아요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and\u003c/span> we \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 잘 알지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">know\u003c/span> it well.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 초콜릿의 씁쓸한 단면이 있는데, 우리는 그것을 잘 알지 못합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 초콜릿에는 달콤한 면만 있는 게 아니라 \u003cb class=\"key\">쓴 \u003c/b>\u003cb class=\"key\">면\u003c/b>도 있다고 말해요. 그런데 우리는 그 사실을 \u003cb class=\"key\">잘 \u003c/b>\u003cb class=\"key\">모른다\u003c/b>는 걸 알려 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">~이 있다(There is/are)\u003c/span> : There + is + 하나의 것 = ~이(가) 있어요 : \"쓴 면이 있어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 내용 + and + 내용 = 두 내용을 이어 줌 : \"그리고, ~인데\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">부정문(do/does/did 부정문)\u003c/span> : 누가(we) + 하지 않는다(don't) + 하다(know) : \"알지 못해요\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"But there is, 하지만 ~이 있어요. a bitter side, 쓴맛이 나는 한쪽 면이. of chocolate, 초콜릿의. and we don't, 그런데 우리는 ~하지 않아요. know it well, 그것을 잘 알지. 이 문장 전체를 해석하면, 하지만 초콜릿의 씁쓸한 단면이 있는데, 우리는 그것을 잘 알지 못합니다.","hl":"m"},{"n":16,"text":"이 문장은 초콜릿에 달콤한 면만 있는 게 아니라고 말해요. 쓴 면이 있다는 사실을 우리가 잘 모른다는 걸 알려 주는, 글의 방향을 바꾸는 문장이에요.","hl":"mn"},{"n":17,"text":"첫 번째로, 처음 나오는 것이 있다고 할 때는 There is를 써요. 두 번째로, and는 두 내용을 이어 주는 말이에요. 세 번째로, 일반동사를 부정할 때는 don't를 동사 앞에 넣어서 알지 못한다고 말해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들은 사용해요\u003c/span>\u003cspan class=\"en\">People \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">use\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">카카오 열매를\u003c/span>\u003cspan class=\"en\">cacao beans\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">초콜릿을 만들기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">make\u003c/span> chocolate.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사람들은 초콜릿을 만들기 위해 카카오 열매를 사용합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 초콜릿이 무엇으로 만들어지는지 알려 줘요. 사람들이 \u003cb class=\"key\">카카오 \u003c/b>\u003cb class=\"key\">열매\u003c/b>로 초콜릿을 \u003cb class=\"key\">만들어요\u003c/b>라는 사실을 말해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지금 하는 일(현재형)\u003c/span> : 여럿(People) + 해요(use) + 무엇을(cacao beans) : \"사용해요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to + 동사원형(to부정사)\u003c/span> : to + 동사원형(make) = ~하기 위해 : \"만들기 위해\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"People use, 사람들은 사용해요. cacao beans, 카카오 열매를. to make chocolate, 초콜릿을 만들기 위해. 이 문장 전체를 해석하면, 사람들은 초콜릿을 만들기 위해 카카오 열매를 사용합니다.","hl":"m"},{"n":19,"text":"이 문장은 초콜릿이 어디서 오는지 알려 줘요. 사람들이 카카오 열매로 초콜릿을 만들어요.","hl":"mn"},{"n":20,"text":"첫 번째로, People처럼 여럿을 가리킬 때는 동사에 -s를 붙이지 않고 use 그대로 써요. 두 번째로, 무엇을 왜 하는지 목적을 말할 때는 동사 앞에 to를 붙여요. 그래서 to make는 만들기 위해가 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 그 열매를 얻는 데는 필요해요\u003c/span>\u003cspan class=\"en\">But \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">getting \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">beans\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">takes\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 힘든 노동이\u003c/span>\u003cspan class=\"en\">a lot of hard work.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 그 열매를 얻는 데는 많은 힘든 노동이 필요해요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 달콤한 초콜릿이지만 \u003cb class=\"key\">카카오 \u003c/b>\u003cb class=\"key\">열매\u003c/b>를 얻는 일에는 \u003cb class=\"key\">힘든 \u003c/b>\u003cb class=\"key\">노동\u003c/b>이 많이 필요하다고 말해요. 초콜릿의 힘든 뒷면을 소개하는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이름처럼 쓰는 동사-ing(동명사)\u003c/span> : 얻는 것(getting) + 그 열매를(the beans) = ~하는 것 : \"그 열매를 얻는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">한 사람·한 개일 때 동사 + s(3인칭 단수)\u003c/span> : 그것(Getting the beans) + 필요해요(takes) + 많은 힘든 노동을(a lot of hard work) : \"필요해요\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"But getting the beans takes, 하지만 그 열매를 얻는 데는 필요해요. a lot of hard work, 많은 힘든 노동이. 이 문장 전체를 해석하면, 하지만 그 열매를 얻는 데는 많은 힘든 노동이 필요해요.","hl":"m"},{"n":22,"text":"이 문장은 달콤한 초콜릿도 카카오 열매를 얻는 데는 힘든 노동이 많이 필요하다고 말해요. 초콜릿의 힘든 뒷면을 소개하는 문장이에요.","hl":"mn"},{"n":23,"text":"첫 번째로, getting the beans는 '그 열매를 얻는 것'이라는 이름 말이에요. 동사에 ing를 붙여서 문장의 주어로 썼어요. 두 번째로, 주어가 하나라서 동사 take에 s를 붙여 takes라고 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오래전에,\u003c/span>\u003cspan class=\"en\">A long time ago,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 노예들은 일했어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">many \u003c/span>\u003cspan class=\"tgt\">slaves\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">worked\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오랜 시간 동안,\u003c/span>\u003cspan class=\"en\">long hours,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 그들은 받지 못했어요\u003c/span>\u003cspan class=\"en\">but they \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">didn't \u003c/span>\u003cspan class=\"tgt\">get\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아무 돈도\u003c/span>\u003cspan class=\"en\">any money\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 노동에 대해\u003c/span>\u003cspan class=\"en\">for their work.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">오래전에, 많은 노예들은 오랜 시간 일했지만 그들의 노동에 대해 아무 돈도 받지 못했어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 오래전에는 \u003cb class=\"key\">노예들\u003c/b>이 오랜 시간 일해도 \u003cb class=\"key\">돈\u003c/b>을 받지 못했어요. 힘든 일을 해도 돈을 못 받는 문제를 보여 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">많은 수를 나타내는 말(수량 표현)\u003c/span> : many + 셀 수 있는 복수(slaves) : \"많은 노예들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지난 일을 말하는 동사(과거형)\u003c/span> : 그들은(they) + 일했어요(worked) + 오랜 시간(long hours) : \"일했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">지난 일을 안 했다고 말하기(과거 부정문)\u003c/span> : 그들은(they) + 받지 못했어요(didn't get) + 아무 돈도(any money) : \"받지 못했어요\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"A long time ago, 오래전에. many slaves worked, 많은 노예들은 일했어요. long hours, 오랜 시간 동안. but they didn't get, 하지만 그들은 받지 못했어요. any money, 아무 돈도. for their work, 그들의 노동에 대해. 이 문장 전체를 해석하면, 오래전에, 많은 노예들은 오랜 시간 일했지만 그들의 노동에 대해 아무 돈도 받지 못했어요.","hl":"m"},{"n":25,"text":"이 문장은 오래전에 노예들이 오랜 시간 일해도 돈을 받지 못했다는 걸 보여 줘요. 초콜릿의 힘든 뒷면을 알려 주는 문장이에요.","hl":"mn"},{"n":26,"text":"첫 번째로, many slaves는 셀 수 있는 노예들이 많다는 뜻이에요. 두 번째로, worked는 work에 ed를 붙인 과거형이에요. 세 번째로, didn't get은 지난 일을 안 했다고 말할 때 쓰고, 뒤에는 동사 원래 모양 get을 써요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오늘날에도 여전히\u003c/span>\u003cspan class=\"en\">Still today,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 농부들은 일을 하고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">some \u003c/span>\u003cspan class=\"tgt\">farmers\u003c/span> work\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 받지 못해요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003cspan class=\"tgt\">get\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공정한 돈을\u003c/span>\u003cspan class=\"en\">fair money\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 노동에 대해\u003c/span>\u003cspan class=\"en\">for their work.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">오늘날에도 여전히 어떤 농부들은 일을 하고 그들의 노동에 대해 공정한 돈을 받지 못합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 오늘날에도 \u003cb class=\"key\">농부들\u003c/b>이 일을 해도 \u003cb class=\"key\">공정한 \u003c/b>\u003cb class=\"key\">돈\u003c/b>을 받지 못한다고 말해요. 그래서 공정 무역이 필요하다는 걸 알려 주는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">몇몇을 나타내는 말(수량 표현)\u003c/span> : some + 셀 수 있는 복수(farmers) : \"어떤 농부들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 일한다(work) + 그리고(and) + 받지 못한다(don't get) : \"그리고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">지금도 안 그렇다고 말하기(현재 부정문)\u003c/span> : 그들은(they) + 받지 않아요(don't get) + 공정한 돈을(fair money) : \"받지 못해요\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Still today, 오늘날에도 여전히. some farmers work, 어떤 농부들은 일을 하고. and don't get, 그리고 받지 못해요. fair money, 공정한 돈을. for their work, 그들의 노동에 대해. 이 문장 전체를 해석하면, 오늘날에도 여전히 어떤 농부들은 일을 하고 그들의 노동에 대해 공정한 돈을 받지 못합니다.","hl":"m"},{"n":28,"text":"이 문장은 오늘날에도 농부들이 일을 해도 공정한 돈을 받지 못한다고 말해요. 그래서 공정 무역이 필요하다는 걸 알려 줘요.","hl":"mn"},{"n":29,"text":"첫 번째로, some farmers는 농부들이 몇몇 있다는 뜻이에요. 두 번째로, and는 두 내용을 이어 주는 접속사예요. 세 번째로, don't get은 지금도 그렇지 않다고 말할 때 쓰고, 뒤에는 동사 원래 모양 get을 써요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1988년에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">In \u003c/span>\u003cspan class=\"tgt\">1988\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 무리의 사람들이\u003c/span>\u003cspan class=\"en\">a group of people\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">'Fairtrade'를 시작했어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">started\u003c/span> &quot;Fairtrade.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">1988년에 한 무리의 사람들이 'Fairtrade'를 시작했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 1988년에 사람들이 뭉쳐 'Fairtrade'를 처음 시작했다는 걸 알려 줘요. 이 글에서 \u003cb class=\"key\">해결책\u003c/b>이 처음 나오는 자리예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간 짝꿍 말(전치사)\u003c/span> : 짝꿍 말(In) + 시간(1988) : \"1988년에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(they) + 했어요(started) + 무엇을(Fairtrade) : \"시작했어요\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"In 1988, 1988년에. a group of people, 한 무리의 사람들이. started \"Fairtrade.\", 'Fairtrade'를 시작했어요. 이 문장 전체를 해석하면, 1988년에 한 무리의 사람들이 'Fairtrade'를 시작했습니다.","hl":"m"},{"n":31,"text":"이 문장은 Fairtrade가 언제 시작되었는지 알려 줘요. 글에서 어려운 문제를 돕는 해결책이 처음 나오는 자리죠.","hl":"mn"},{"n":32,"text":"문법은 두 가지예요. 첫 번째, In 1988에서 In은 시간을 알려 주는 짝꿍 말이에요. 두 번째, started는 지난 일을 말하는 과거형이에요. 이미 지난 일이라서 동사에 -ed를 붙였죠. 여러분이 play를 지난 일로 말할 때 played라고 하는 것과 같아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Fairtrade는\u003c/span>\u003cspan class=\"en\">Fairtrade \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사회 운동이에요\u003c/span>\u003cspan class=\"en\">a social movement\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">농부들을 돕는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">help \u003c/span>\u003cspan class=\"tgt\">farmers\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Fairtrade는 농부들을 돕는 사회 운동이에요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Fairtrade가 무엇인지 딱 알려 주는 문장이에요. 글의 \u003cb class=\"key\">중심\u003c/b>을 잡아 주는 아주 중요한 문장이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사(be동사)\u003c/span> : 주어(Fairtrade) + 이다(is) + 무엇(a social movement) : \"~이에요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사(to부정사)\u003c/span> : to + 동사원형(help) + 무엇을(farmers) : \"농부들을 돕는\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"Fairtrade is, Fairtrade는. a social movement, 사회 운동이에요. to help farmers, 농부들을 돕는. 이 문장 전체를 해석하면, Fairtrade는 농부들을 돕는 사회 운동이에요.","hl":"m"},{"n":34,"text":"이 문장은 Fairtrade가 무엇인지 딱 알려 주는 문장이에요. 글의 중심을 잡아 주는 아주 중요한 문장이죠.","hl":"mn"},{"n":35,"text":"첫 번째, is는 주어와 짝을 지어 주는 be동사예요. Fairtrade가 무엇인지 말해 주죠. 두 번째, to help farmers에서 to와 동사원형을 붙이면 '~하는'이라는 꾸며 주는 뜻이 돼요. 그래서 movement를 꾸며 주는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 11\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Fairtrade를 통해서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Through\u003c/span> Fairtrade,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">농부들은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">farmers \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공정한 돈을 받습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">get\u003c/span> fair money.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Fairtrade를 통해서 농부들은 공정한 돈을 받습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Fairtrade를 통해 농부들이 어떤 도움을 받는지 알려 줘요. 앞에서 나온 \u003cb class=\"key\">운동\u003c/b>이 실제로 \u003cb class=\"key\">결과\u003c/b>를 만든다는 뜻이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">장소·시간 짝꿍 말(전치사)\u003c/span> : 짝꿍 말(Through) + 무엇(Fairtrade) : \"~을 통해서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">여럿일 때 동사 그대로(복수 주어 현재형)\u003c/span> : 농부들은(the farmers) + 받아요(get) + 무엇을(fair money) : \"농부들은 받습니다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Through Fairtrade, Fairtrade를 통해서. the farmers, 농부들은. get fair money, 공정한 돈을 받습니다. 이 문장 전체를 해석하면, Fairtrade를 통해서 농부들은 공정한 돈을 받습니다.","hl":"m"},{"n":37,"text":"이 문장은 Fairtrade를 통해 농부들이 어떤 도움을 받는지 알려 줘요. 앞에서 나온 운동이 실제로 결과를 만든다는 뜻이에요.","hl":"mn"},{"n":38,"text":"첫 번째, Through는 '~을 통해서'라는 짝꿍 말이에요. 두 번째, 주어가 여럿이면 동사에 -s를 붙이지 않아요. 그래서 farmers 뒤에는 get 그대로 써요. 여러분이 친구들과 함께 이야기할 때 they get이라고 하는 것과 같아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 돈으로,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">With \u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">money,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">농부들은 만들 수 있어요\u003c/span>\u003cspan class=\"en\">the farmers \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">make\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 삶을 더 좋게\u003c/span>\u003cspan class=\"en\">their lives better.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 돈으로, 농부들은 자신의 삶을 더 좋게 만들 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 공정한 돈을 받은 농부들이 그 돈으로 자신의 \u003cb class=\"key\">삶\u003c/b>을 \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">좋게\u003c/b> 만들 수 있다는 뜻이에요. 앞에서 말한 공정한 돈의 좋은 결과를 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">장소·시간 짝꿍 말(전치사)\u003c/span> : With + 무엇(that money) = 무엇으로 : \"그 돈으로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">도와주는 동사(조동사)\u003c/span> : 누가(the farmers) + 할 수 있다(can) + 만들다(make) : \"만들 수 있습니다\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"With that money, 그 돈으로. the farmers can make, 농부들은 만들 수 있어요. their lives better, 자신의 삶을 더 좋게. 이 문장 전체를 해석하면, 그 돈으로, 농부들은 자신의 삶을 더 좋게 만들 수 있습니다.","hl":"m"},{"n":40,"text":"공정한 돈을 받은 농부들이 그 돈으로 자신의 삶을 더 좋게 만들 수 있다는 뜻이에요. 앞에서 말한 공정한 돈의 좋은 결과를 보여 줘요.","hl":"mn"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 또한 계획할 수 있어요\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">also \u003c/span>\u003cspan class=\"tgt\">plan\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 미래를 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">futures\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 또한 자신의 미래를 계획할 수도 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 농부들이 공정한 돈으로 자신의 \u003cb class=\"key\">미래\u003c/b>를 \u003cb class=\"key\">계획\u003c/b>할 수 있다는 뜻이에요. 돈이 지금의 생활뿐 아니라 앞으로의 삶에도 도움을 준다는 걸 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">도와주는 동사(조동사)\u003c/span> : 그들은(They) + 할 수 있다(can) + 또한(also) + 계획하다(plan) : \"또한 계획할 수 있습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소·시간 짝꿍 말(전치사)\u003c/span> : for + 무엇(their futures) = 무엇을 위해 : \"자신의 미래를 위해\"\u003c/div>\u003c/div>","segs":[{"n":41,"text":"They can also plan, 그들은 또한 계획할 수 있어요. for their futures, 자신의 미래를 위해. 이 문장 전체를 해석하면, 그들은 또한 자신의 미래를 계획할 수도 있습니다.","hl":"m"},{"n":42,"text":"농부들이 공정한 돈으로 자신의 미래를 계획할 수 있다는 뜻이에요. 돈이 지금의 생활뿐 아니라 앞으로의 삶에도 도움을 준다는 걸 보여 줘요.","hl":"mn"}]},{"html":"\u003cspan class=\"lp-tag\">오늘 배운 내용 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>초콜릿은 달콤하지만 \u003cb class=\"key\">카카오 \u003c/b>\u003cb class=\"key\">열매\u003c/b>를 얻는 일은 아주 힘들어요.\u003c/li>\u003cli>오래전 노예들과 오늘날 일부 농부들은 일해도 \u003cb class=\"key\">공정한 \u003c/b>\u003cb class=\"key\">돈\u003c/b>을 받지 못해요.\u003c/li>\u003cli>\u003cb class=\"key\">Fairtrade\u003c/b>는 농부들을 돕는 사회 운동이에요.\u003c/li>\u003cli>농부들은 공정한 돈으로 \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">나은 \u003c/b>\u003cb class=\"key\">삶\u003c/b>과 미래를 만들어요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Chocolate has a bitter side, so Fairtrade helps farmers get fair money for their hard work.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">초콜릿은 무척 달콤하지만, 그 뒤에는 \u003cb class=\"key\">카카오 \u003c/b>\u003cb class=\"key\">열매\u003c/b>를 얻는 힘든 노동과 \u003cb class=\"key\">공정하지 \u003c/b>\u003cb class=\"key\">않은 \u003c/b>\u003cb class=\"key\">돈\u003c/b>이라는 씁쓸한 문제가 숨어 있어요. 그래서 사람들은 \u003cb class=\"key\">Fairtrade\u003c/b>라는 사회 운동으로 농부들이 일한 만큼 공정한 돈을 받도록 돕고 있어요.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":43,"text":"오늘 우리는 초콜릿의 달콤한 면과 씁쓸한 면을 함께 읽었어요. 힘든 일을 한 농부들이 공정한 돈을 받아야 한다는 것, 그리고 Fairtrade가 그 일을 돕는다는 것을 꼭 기억해요. 여러분이 끝까지 잘 따라와 준 덕분에 아주 멋진 수업이었어요. 다음 시간에도 재미있는 이야기로 만나요, 안녕!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
