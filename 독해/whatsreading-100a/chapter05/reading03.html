</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"왓츠 리딩 100A Ch.5 Unit 03 Banana Farmers","audioDir":"reading03_audio","preview":false,"count":53,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.520em\">Ch.5 Unit\u003cbr>03 Banana\u003cbr>Farmers\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">왓츠 리딩 100A\u003c/div>\u003ch1>Banana Farmers and Fairtrade\u003c/h1>\u003ch2>바나나 농부들과 공정 무역\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">한 줄 요약\u003c/span>\u003cspan>오늘 수업에서 \u003cb class=\"key\">바나나 \u003c/b>\u003cb class=\"key\">농부 \u003c/b>\u003cb class=\"key\">게임\u003c/b>을 했는데 아무도 돈을 벌지 못했어요. 트럭이 없어 바나나를 \u003cb class=\"key\">아주 \u003c/b>\u003cb class=\"key\">값싼 \u003c/b>\u003cb class=\"key\">가격\u003c/b>에 팔 수밖에 없는 농부들을 \u003cb class=\"key\">Fairtrade\u003c/b>가 도와준다는 것을 배웠어요.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Fairtrade helps banana farmers get fair pay for their hard work.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘도 만나서 정말 반가워요. 오늘 읽을 글은 바나나 농부들에 대한 이야기예요. 수업 시간에 특별한 손님 Kate가 와서 재미있는 게임을 했다고 해요. 한 줄로 말하면, 공정한 값을 받는 농부들의 이야기예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">미리 알면 쉬워요\u003c/span>\u003cdiv class=\"lp-box\">바나나는 우리가 자주 먹는 과일이지만, 우리나라에서는 잘 자라지 않아요. 그래서 먼 나라 \u003cb class=\"key\">농부\u003c/b>(farmer)들이 힘들게 길러서 배로 보내 줘요. 바나나는 금방 상해서 빨리 \u003cb class=\"key\">시장\u003c/b>(market)에 가져가야 해요. 트럭이 없으면 다른 사람에게 아주 싼값에 넘겨야 하죠. 여러분이 좋아하는 게임에서 아까운 아이템을 싸게 넘겨야 했던 것과 비슷해요. \u003cb class=\"key\">Fairtrade\u003c/b>는 농부에게 공정한 값을 주자는 약속이에요.\u003c/div>","segs":[{"n":2,"text":"여러분, 바나나는 어디에서 자랄까요? 우리나라에서는 잘 자라지 않아서 먼 나라에서 배를 타고 와요. 바나나를 기르는 농부들은 트럭이 없으면 시장에 갈 수가 없어요. 그리고 바나나는 금방 상해서 서둘러 팔아야 하죠. 여러분이 좋아하는 게임에서 아까운 아이템을 아주 싸게 넘겨야 했던 적 있나요? Fairtrade는 농부들에게 공정한 값을 주자는 약속이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>게임 시작\u003csmall>시작 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>오늘 수업에 \u003cb class=\"key\">특별한 \u003c/b>\u003cb class=\"key\">손님\u003c/b> Kate가 왔어요. Kate는 우리에게 바나나를 \u003cb class=\"key\">기르고 \u003c/b>\u003cb class=\"key\">파는 \u003c/b>\u003cb class=\"key\">게임\u003c/b>을 가져왔어요. 이 게임에서 우리는 바나나를 재배하고 판매해서 \u003cb class=\"key\">돈을 \u003c/b>\u003cb class=\"key\">벌어요\u003c/b>.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>이상한 결과\u003csmall>문제 · 문장 4–7\u003c/small>\u003c/h4>\u003cp>나는 100달러로 시작했는데 \u003cb class=\"key\">이상한 \u003c/b>\u003cb class=\"key\">일\u003c/b>이 일어났어요. 돈을 버는 대신 \u003cb class=\"key\">계속 \u003c/b>\u003cb class=\"key\">잃기만\u003c/b> 했어요. 그래서 \u003cb class=\"key\">손을 \u003c/b>\u003cb class=\"key\">들고\u003c/b> 돈을 벌 수 없다고 말했어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>모두 똑같아요\u003csmall>확인 · 문장 8–10\u003c/small>\u003c/h4>\u003cp>Kate가 \u003cb class=\"key\">미소 \u003c/b>\u003cb class=\"key\">지으며\u003c/b> 돈을 번 사람이 있냐고 물었어요. 하지만 \u003cb class=\"key\">아무도 \u003c/b>\u003cb class=\"key\">손을 \u003c/b>\u003cb class=\"key\">들지\u003c/b> 않았어요. 모두 나처럼 돈을 잃고 있었어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>이유와 해결\u003csmall>이유·해결 · 문장 11–15\u003c/small>\u003c/h4>\u003cp>Kate가 진짜 \u003cb class=\"key\">이유\u003c/b>를 알려 줬어요. 농부들은 \u003cb class=\"key\">트럭이 \u003c/b>\u003cb class=\"key\">없어서\u003c/b> 바나나를 시장에 가져갈 수 없어요. 그래서 \u003cb class=\"key\">아주 \u003c/b>\u003cb class=\"key\">값싼 \u003c/b>\u003cb class=\"key\">가격\u003c/b>에 팔 수밖에 없죠. \u003cb class=\"key\">Fairtrade\u003c/b>를 통하면 농부들이 공정한 보수를 받을 수 있어요. 바나나를 살 때는 \u003cb class=\"key\">Fairtrade \u003c/b>\u003cb class=\"key\">마크\u003c/b>가 있는 것을 골라요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 오늘 글의 흐름을 함께 따라가 볼까요?","hl":null},{"n":4,"text":"먼저 오늘 수업에 특별한 손님 Kate가 왔어요. Kate는 우리에게 바나나를 기르고 파는 게임을 가져왔죠. 이 게임에서 우리는 바나나를 재배하고 판매해서 돈을 버는 연습을 해요.","hl":"f0"},{"n":5,"text":"나는 백 달러를 가지고 시작했는데 이상한 일이 일어났어요. 돈을 버는 대신에 자꾸 돈을 잃기만 했죠. 그래서 손을 들고 뭔가 잘못되었다고 말했어요. 돈을 하나도 벌 수가 없다고요.","hl":"f1"},{"n":6,"text":"Kate가 웃으면서 돈을 번 사람이 있냐고 물었어요. 하지만 아무도 손을 들지 않았어요. 모두 나처럼 돈을 잃고 있었던 거예요.","hl":"f2"},{"n":7,"text":"Kate가 진짜 이유를 알려 줬어요. 많은 바나나 농부들은 트럭이 없어서 바나나를 시장에 가져갈 수가 없대요. 그래서 어느 구매자에게든 아주 값싼 가격에 팔 수밖에 없죠. 하지만 Fairtrade를 통하면 농부들이 자기 노동에 대한 공정한 보수를 받을 수 있어요. 그래서 바나나를 살 때는 Fairtrade 마크가 있는 것을 고르면 된답니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결 이야기(이야기 순서)\u003c/span>\u003cspan class=\"lp-pill\">끝\u003c/span>\u003cspan class=\"lp-pill\">주제문 14번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 게임이 시작되고 문제가 생긴 뒤, 그 이유와 해결 방법을 알려 주는 \u003cb class=\"key\">문제-해결\u003c/b> 짜임이에요. 마지막 부분에서 Fairtrade 이야기가 나오며 \u003cb class=\"key\">중심 \u003c/b>\u003cb class=\"key\">생각\u003c/b>이 드러나요. 그래서 \u003cb class=\"key\">중심 \u003c/b>\u003cb class=\"key\">문장\u003c/b>이 글의 끝에 있다고 볼 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>but (4)\u003c/b>\u003cspan>반대되는 일이 생겼다고 알려 줌\u003c/span>\u003cb>Instead of (5)\u003c/b>\u003cspan>기대와 다른 결과를 알려 줌\u003c/span>\u003cb>so (12)\u003c/b>\u003cspan>이유 다음에 오는 결과를 이어 줌\u003c/span>\u003cb>When (15)\u003c/b>\u003cspan>때를 알려 줌\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Kate\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">She\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">banana farmers\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">they\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">farmers\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Fairtrade가 없을 때\u003c/th>\u003cth>Fairtrade가 있을 때\u003c/th>\u003c/tr>\u003ctr>\u003ctd>트럭이 없어 시장에 못 감\u003c/td>\u003ctd>농부가 공정한 보수를 받음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>아주 싼 가격에 팔아야 함\u003c/td>\u003ctd>노동에 맞는 값을 받음\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 게임이 시작되고 문제가 생긴 뒤, 그 이유와 해결 방법을 알려 주는 문제-해결 짜임이에요. 마지막 부분에서 Fairtrade 이야기가 나오며 중심 생각이 드러나요. 그래서 중심 문장이 글의 끝에 있다고 볼 수 있어요.","hl":"ty"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 단어\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>special\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>특별한\u003c/span>\u003c/div>\u003cdiv>\u003cb>guest\u003c/b>\u003cem>명사\u003c/em>\u003cspan>손님\u003c/span>\u003c/div>\u003cdiv>\u003cb>grow\u003c/b>\u003cem>동사\u003c/em>\u003cspan>기르다, 재배하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>sell\u003c/b>\u003cem>동사\u003c/em>\u003cspan>팔다\u003c/span>\u003c/div>\u003cdiv>\u003cb>make money\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>돈을 벌다\u003c/span>\u003c/div>\u003cdiv>\u003cb>explain\u003c/b>\u003cem>동사\u003c/em>\u003cspan>설명하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>strange\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>이상한\u003c/span>\u003c/div>\u003cdiv>\u003cb>happen\u003c/b>\u003cem>동사\u003c/em>\u003cspan>일어나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>instead of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~대신에\u003c/span>\u003c/div>\u003cdiv>\u003cb>lose\u003c/b>\u003cem>동사\u003c/em>\u003cspan>잃다\u003c/span>\u003c/div>\u003cdiv>\u003cb>raise one's hand\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>손을 들다\u003c/span>\u003c/div>\u003cdiv>\u003cb>no one\u003c/b>\u003cem>대명사\u003c/em>\u003cspan>아무도 (~없다)\u003c/span>\u003c/div>\u003cdiv>\u003cb>farmer\u003c/b>\u003cem>명사\u003c/em>\u003cspan>농부\u003c/span>\u003c/div>\u003cdiv>\u003cb>truck\u003c/b>\u003cem>명사\u003c/em>\u003cspan>트럭\u003c/span>\u003c/div>\u003cdiv>\u003cb>market\u003c/b>\u003cem>명사\u003c/em>\u003cspan>시장\u003c/span>\u003c/div>\u003cdiv>\u003cb>cheap\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>값싼\u003c/span>\u003c/div>\u003cdiv>\u003cb>price\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가격\u003c/span>\u003c/div>\u003cdiv>\u003cb>buyer\u003c/b>\u003cem>명사\u003c/em>\u003cspan>구매자\u003c/span>\u003c/div>\u003cdiv>\u003cb>fair\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>공정한\u003c/span>\u003c/div>\u003cdiv>\u003cb>choose\u003c/b>\u003cem>동사\u003c/em>\u003cspan>고르다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"오늘의 단어도 소리 내어 읽어 볼까요? special은 특별한이라는 뜻이고, guest는 손님이에요. grow는 기르다, sell은 팔다라는 뜻이죠. make money는 돈을 벌다, instead of는 대신에라는 표현이에요. fair는 공정한, choose는 고르다라는 뜻이랍니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">special\u003c/b>\u003cspan class=\"m\">특별한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">unusual\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">common\u003c/span>\u003cspan class=\"a\">usual\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">strange\u003c/b>\u003cspan class=\"m\">이상한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">weird\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">normal\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">lose\u003c/b>\u003cspan class=\"m\">잃다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">miss\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">find\u003c/span>\u003cspan class=\"a\">win\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">cheap\u003c/b>\u003cspan class=\"m\">값싼\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">low\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">expensive\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">sell\u003c/b>\u003cspan class=\"m\">팔다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">trade\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">buy\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">fair\u003c/b>\u003cspan class=\"m\">공정한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">right\u003c/span>\u003cspan class=\"s\">just\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unfair\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"비슷한 말과 반대말도 정리해 봐요. special은 특별한이라는 뜻으로 unusual과 비슷하고 common과 반대예요. strange는 이상한이라는 뜻으로 weird와 비슷하고 normal과 반대죠. lose는 잃다라는 뜻이고 find는 반대말이에요. cheap은 값싼이라는 뜻이고 expensive는 반대말이에요. sell의 반대말은 buy이고, fair는 공정한이라는 뜻으로 unfair와 반대랍니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오늘 수업에\u003c/span>\u003cspan class=\"en\">Today in class,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 모셨어요(가졌어요)\u003c/span>\u003cspan class=\"en\">we \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">had\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">특별한 손님, Kate를\u003c/span>\u003cspan class=\"en\">a special guest, Kate.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">오늘 수업에 특별한 손님으로 Kate가 왔어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 오늘 수업에 \u003cb class=\"key\">특별한 \u003c/b>\u003cb class=\"key\">손님\u003c/b> Kate가 왔다는 걸 알려 주는 문장이에요. 이야기의 \u003cb class=\"key\">시작\u003c/b>을 여는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거형(불규칙 동사)\u003c/span> : 누가(we) + 했다(had) + 무엇을(a special guest) : \"우리는 (손님을) 모셨어요\"\u003c/div>\u003c/div>","segs":[{"n":11,"text":"Today in class, 오늘 수업에. we had, 우리는 모셨어요(가졌어요). a special guest, Kate, 특별한 손님, Kate를. 이 문장 전체를 해석하면, 오늘 수업에 특별한 손님으로 Kate가 왔어요.","hl":"m"},{"n":12,"text":"오늘 수업에 특별한 손님 Kate가 왔다는 뜻이에요. 이야기의 시작을 알려 주는 첫 문장이죠.","hl":"mn"},{"n":13,"text":"여기서 꼭 기억할 건 had예요. had는 have의 과거형으로, 지난 일을 말할 때 써요. 오늘 수업에 손님을 모신 건 이미 지난 일이니까 had를 쓴 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 가졌어요\u003c/span>\u003cspan class=\"en\">She \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">had\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">게임을\u003c/span>\u003cspan class=\"en\">a game\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리를 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">us\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 우리를 위한 게임을 가져왔습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Kate가 우리를 위해 \u003cb class=\"key\">게임\u003c/b>을 준비했다는 뜻이에요. 앞 문장에 이어 \u003cb class=\"key\">손님\u003c/b>이 무엇을 했는지 알려 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거형(불규칙 동사)\u003c/span> : 누가(She) + 했다(had) + 무엇을(a game) : \"그녀는 (게임을) 가졌어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 for(장소·시간 짝꿍 말)\u003c/span> : for + 누구(for us) = ~를 위해 : \"우리를 위해\"\u003c/div>\u003c/div>","segs":[{"n":14,"text":"She had, 그녀는 가졌어요. a game, 게임을. for us, 우리를 위해. 이 문장 전체를 해석하면, 그녀는 우리를 위한 게임을 가져왔습니다.","hl":"m"},{"n":15,"text":"Kate라는 손님이 우리를 위해 게임을 준비했다는 뜻이에요. 손님이 무엇을 했는지 알려 주는 문장이죠.","hl":"mn"},{"n":16,"text":"먼저 had는 아까 배운 과거형이에요. 지난 일이니까 had를 썼어요. 그리고 for us는 전치사 for에 us가 붙은 말이에요. 누구를 위해 게임을 준비했는지, 바로 우리를 위해서라는 걸 알려 주죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 게임에서\u003c/span>\u003cspan class=\"en\">&quot;In this game,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은 재배하고 팔아요\u003c/span>\u003cspan class=\"en\">you \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">grow \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">sell\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바나나를, 그리고 돈을 벌어요\u003c/span>\u003cspan class=\"en\">bananas and make money,&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Kate가 설명했어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">Kate \u003c/span>\u003cspan class=\"tgt\">explained\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">&quot;이 게임에서 여러분은 바나나를 재배하고 판매해서 돈을 법니다.&quot;라고 Kate가 설명했어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 게임의 \u003cb class=\"key\">규칙\u003c/b>을 Kate가 설명해 주는 문장이에요. 바나나를 \u003cb class=\"key\">재배하고 \u003c/b>\u003cb class=\"key\">팔아서\u003c/b> 돈을 버는 게임이라는 걸 알려 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 and(이어 주는 말)\u003c/span> : 한다(grow) + and + 한다(sell) : \"재배하고 팔아요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거형(규칙 동사)\u003c/span> : 누가(Kate) + 했다(explained) : \"Kate가 설명했어요\"\u003c/div>\u003c/div>","segs":[{"n":17,"text":"\"In this game, 이 게임에서. you grow and sell, 여러분은 재배하고 팔아요. bananas and make money,\", 바나나를, 그리고 돈을 벌어요. Kate explained, Kate가 설명했어요. 이 문장 전체를 해석하면, \"이 게임에서 여러분은 바나나를 재배하고 판매해서 돈을 법니다.\"라고 Kate가 설명했어요.","hl":"m"},{"n":18,"text":"게임의 규칙을 Kate가 설명해 주는 문장이에요. 바나나를 재배하고 팔아서 돈을 버는 게임이라는 걸 알려 줘요.","hl":"mn"},{"n":19,"text":"먼저 접속사 and가 grow와 sell을 이어서 재배하고 팔고처럼 두 일을 한 번에 말해 줘요. 그리고 explained는 지난 일이라 동사에 -ed를 붙인 과거형이에요. 이 문장은 따라 쓰기 아주 좋은 문장이니까 꼭 외워 봐요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 시작했어요\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">started\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">100달러를 가지고, 하지만\u003c/span>\u003cspan class=\"en\">with 100 dollars, \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">but\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이상한 일이 일어났어요\u003c/span>\u003cspan class=\"en\">something strange happened.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 100달러를 갖고 시작했지만 이상한 일이 일어났어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 내가 100달러를 가지고 게임을 시작했는데, \u003cb class=\"key\">이상한 \u003c/b>\u003cb class=\"key\">일\u003c/b>이 생겼다는 뜻이에요. 그래서 다음에 어떤 일이 생겼는지 궁금해지게 하는 부분이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거형(과거형)\u003c/span> : 누가(I) + 했다(started) : \"시작했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 문장 + but + 반대되는 문장 : \"하지만\"\u003c/div>\u003c/div>","segs":[{"n":20,"text":"I started, 나는 시작했어요. with 100 dollars, but, 100달러를 가지고, 하지만. something strange happened, 이상한 일이 일어났어요. 이 문장 전체를 해석하면, 나는 100달러를 갖고 시작했지만 이상한 일이 일어났어요.","hl":"m"},{"n":21,"text":"이 문장은 내가 백 달러를 가지고 게임을 시작했는데, 이상한 일이 생겼다는 뜻이에요. 그래서 다음에 어떤 일이 생겼는지 궁금해지죠.","hl":"mn"},{"n":22,"text":"여기서 started는 지난 일을 말하는 과거형이에요. start에 d를 붙여서 시작했어요라는 뜻이 되죠. 그리고 but은 앞 내용과 반대되는 내용을 이어 주는 접속사예요. 돈을 벌 것 같은데 이상한 일이 생겼다고 하니, 두 내용이 반대라서 but을 쓴 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대신에\u003c/span>\u003cspan class=\"en\">Instead of\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">돈을 버는 것\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">making \u003c/span>\u003cspan class=\"tgt\">money\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 계속했어요\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">kept\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 잃는 것을!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">losing\u003c/span> it!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 돈을 버는 대신 계속 잃었어요!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 돈을 버는 \u003cb class=\"key\">대신\u003c/b> 자꾸 돈을 \u003cb class=\"key\">잃었다\u003c/b>는 뜻이에요. 내가 얼마나 답답했는지 잘 보여 주는 부분이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사(동명사)\u003c/span> : 전치사(of) + 동사-ing(making) + 무엇을(money) : \"돈을 버는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거형(과거형)\u003c/span> : 누가(I) + 계속했다(kept) : \"계속했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동사-ing(동사-ing)\u003c/span> : keep + 동사-ing(losing) : \"잃는 것\"\u003c/div>\u003c/div>","segs":[{"n":23,"text":"Instead of, 대신에. making money, 돈을 버는 것. I kept, 나는 계속했어요. losing it!, 그것을 잃는 것을!. 이 문장 전체를 해석하면, 나는 돈을 버는 대신 계속 잃었어요!","hl":"m"},{"n":24,"text":"이 문장은 돈을 버는 대신에 자꾸 돈을 잃었다는 뜻이에요. 그래서 내가 얼마나 답답했는지 느낄 수 있죠.","hl":"mn"},{"n":25,"text":"첫 번째, making money에서 making은 동명사예요. 전치사 of 뒤에서 돈을 버는 것이라는 이름 말처럼 쓰였죠. 두 번째, kept는 keep의 과거형으로 계속했어요라는 뜻이에요. 세 번째, losing은 동사 ing로 잃는 것을 뜻하고, kept losing은 계속 잃었어요라는 말이 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 손을 들었어요\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">raised\u003c/span> my hand\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 말했어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">said\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">뭔가 잘못되었어요\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">There's\u003c/span> something wrong.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 손을 들고 말했어요. &quot;뭔가 잘못되었어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 내가 \u003cb class=\"key\">손을 \u003c/b>\u003cb class=\"key\">들고\u003c/b> &quot;뭔가 \u003cb class=\"key\">잘못\u003c/b>되었어요&quot;라고 말한 장면이에요. 게임에서 돈을 못 버는 문제를 말하며 도움을 청하는 부분이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거형(과거형)\u003c/span> : 누가(I) + 했다(raised) + 무엇을(my hand) : \"들었어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 했다(raised) + and + 말했다(said) : \"그리고 말했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">있어요 표현(There is)\u003c/span> : There is + 무엇이(something wrong) : \"~이 있어요\"\u003c/div>\u003c/div>","segs":[{"n":26,"text":"I raised my hand, 나는 손을 들었어요. and said, 그리고 말했어요. \"There's something wrong, 뭔가 잘못되었어요. 이 문장 전체를 해석하면, 나는 손을 들고 말했어요. \"뭔가 잘못되었어요.","hl":"m"},{"n":27,"text":"이 문장은 내가 손을 들고 뭔가 잘못되었다고 말한 장면이에요. 게임에서 돈을 못 버는 문제를 잘못이라고 말하며 도움을 청하는 부분이죠.","hl":"mn"},{"n":28,"text":"첫 번째, raised는 raise의 과거형이에요. 그래서 손을 들었어요라는 지난 일을 말하죠. 두 번째, and said는 두 가지 행동을 이어 주는 접속사 and로 raised와 said를 이어 줘요. 세 번째, There's는 There is의 줄임말로 있어요라는 표현이에요. 여기서는 뭔가 잘못된 것이 있다는 뜻이죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 벌 수 없어요\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can't \u003c/span>\u003cspan class=\"tgt\">make\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 돈도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">any \u003c/span>\u003cspan class=\"tgt\">money\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">저는 돈을 하나도 벌 수가 없어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 주인공이 게임에서 돈을 \u003cb class=\"key\">벌 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">없다\u003c/b>고 말해요. 계속 돈을 잃는 \u003cb class=\"key\">문제\u003c/b>를 Kate에게 알려 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">할 수 없다(조동사 can't)\u003c/span> : 누가(I) + 할 수 없다(can't) + 하다(make) : \"벌 수 없어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부정문의 any(수량 표현)\u003c/span> : 부정문 + any + 명사(money) : \"어떤 돈도\"\u003c/div>\u003c/div>","segs":[{"n":29,"text":"I can't make, 나는 벌 수 없어요. any money, 어떤 돈도. 이 문장 전체를 해석하면, 저는 돈을 하나도 벌 수가 없어요.","hl":"m"},{"n":30,"text":"여기서 주인공은 게임에서 돈을 벌 수 없다고 말해요. 계속 돈을 잃는 문제를 Kate에게 알려 주는 거예요.","hl":"mn"},{"n":31,"text":"첫 번째 포인트는 can't예요. can't는 할 수 없다는 뜻의 도와주는 동사이고, 뒤에는 동사원형 make가 와요. 두 번째 포인트는 any예요. 부정문에서 any money라고 하면 어떤 돈도, 하나도라는 뜻이 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Kate는 미소 지었어요.\u003c/span>\u003cspan class=\"en\">Kate \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">smiled\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Kate는 미소 지었어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Kate가 \u003cb class=\"key\">미소 \u003c/b>\u003cb class=\"key\">지어요\u003c/b>. 아이들의 말을 듣고 \u003cb class=\"key\">부드럽게\u003c/b> 다음 질문을 하려는 장면이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거형(규칙 동사)\u003c/span> : 지난 일: smile + d = smiled : \"미소 지었어요\"\u003c/div>\u003c/div>","segs":[{"n":32,"text":"Kate smiled, Kate는 미소 지었어요.. 이 문장 전체를 해석하면, Kate는 미소 지었어요.","hl":"m"},{"n":33,"text":"Kate가 미소 지어요. 아이들의 말을 듣고 부드럽게 다음 질문을 하려는 장면이에요.","hl":"mn"},{"n":34,"text":"여기서 smiled는 과거형이에요. 지난 일을 말할 때 동사를 과거형으로 바꾸죠. smile은 e로 끝나서 d만 붙여 smiled가 됐어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">누가\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Did \u003c/span>\u003cspan class=\"tgt\">anybody\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">돈을 벌었나요?\u003c/span>\u003cspan class=\"en\">make money?&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">&quot;돈을 번 사람이 있나요?&quot;\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Kate가 아이들에게 \u003cb class=\"key\">돈을 \u003c/b>\u003cb class=\"key\">번 \u003c/b>\u003cb class=\"key\">사람\u003c/b>이 있는지 물어요. 모두가 힘들었다는 걸 \u003cb class=\"key\">확인\u003c/b>하려는 질문이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문문 만들기(do/does/did)\u003c/span> : Did + 누가(anybody) + 하다(make)? : \"누가 ~했나요?\"\u003c/div>\u003c/div>","segs":[{"n":35,"text":"\"Did anybody, 누가. make money?\", 돈을 벌었나요?. 이 문장 전체를 해석하면, \"돈을 번 사람이 있나요?\"","hl":"m"},{"n":36,"text":"Kate가 아이들에게 돈을 번 사람이 있는지 물어요. 모두가 힘들었다는 걸 확인하려는 질문이에요.","hl":"mn"},{"n":37,"text":"여기서는 지난 일을 묻는 의문문이에요. 문장 앞에 Did를 쓰고, 뒤에는 동사원형 make를 써요. 그래서 지난 일을 묻는 말이 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아무도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">No \u003c/span>\u003cspan class=\"tgt\">one\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 손을 들지 않았어요.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">raised\u003c/span> their hand.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">아무도 손을 들지 않았어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 케이트의 질문에 \u003cb class=\"key\">아무도\u003c/b> 손을 들지 않았어요. 게임에서 모두가 돈을 잃었다는 것을 보여 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정 주어(no one)\u003c/span> : 아무도(No one) + ~하지 않았다(raised) : \"아무도\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거형(규칙 동사 과거형)\u003c/span> : 누가(They) + 했다(raised) + 무엇을(their hand) : \"손을 들었다\"\u003c/div>\u003c/div>","segs":[{"n":38,"text":"No one, 아무도. raised their hand, 그들의 손을 들지 않았어요.. 이 문장 전체를 해석하면, 아무도 손을 들지 않았어요.","hl":"m"},{"n":39,"text":"케이트가 물었는데 아무도 손을 들지 않았어요. 게임에 나온 모두가 돈을 잃었다는 걸 알려 주는 문장이에요.","hl":"mn"},{"n":40,"text":"첫째, raised는 과거형이에요. 동사 끝에 -ed를 붙여서 '들었다'라는 지난 일을 말해요. 둘째, No one은 아무도라는 뜻이라서 not을 또 붙이지 않아요. 아무도 손을 들지 않았다, 이렇게 한 번에 알아 두면 좋아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀가 말했어요,\u003c/span>\u003cspan class=\"en\">She said,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">&quot;이것이 ~하고 있는 것이에요\u003c/span>\u003cspan class=\"en\">&quot;This is what\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일어나고 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">happening\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 바나나 농부들에게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">many \u003c/span>\u003cspan class=\"tgt\">banana \u003c/span>\u003cspan class=\"tgt\">farmers\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀가 말했어요, &quot;이것이 많은 바나나 농부들에게 일어나고 있는 일이에요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 케이트가 말해요. 이런 일은 농부 한 명만 겪는 게 아니라 \u003cb class=\"key\">많은\u003c/b> 바나나 농부들이 겪고 있다는 뜻이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">진행형(현재진행형)\u003c/span> : 무엇이(This) + 지금 ~하는 중이에요(is happening) : \"일어나고 있는 중이에요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사(전치사 to)\u003c/span> : ~에게(to) + 많은(many) + 농부들에게(banana farmers) : \"많은 바나나 농부들에게\"\u003c/div>\u003c/div>","segs":[{"n":41,"text":"She said, 그녀가 말했어요. \"This is what, \"이것이 ~하고 있는 것이에요. is happening, 일어나고 있는. to many banana farmers, 많은 바나나 농부들에게. 이 문장 전체를 해석하면, 그녀가 말했어요, \"이것이 많은 바나나 농부들에게 일어나고 있는 일이에요.","hl":"m"},{"n":42,"text":"케이트가 지금 무슨 일이 벌어지고 있는지 알려 줘요. 이런 일은 한 농부만이 아니라 많은 농부가 겪고 있다는 거예요.","hl":"mn"},{"n":43,"text":"먼저 is happening은 지금 ~하는 중이라는 뜻이에요. be동사 is에 동사 -ing를 붙이면 지금 계속되는 일이 돼요. 그리고 to는 여기서 ~에게라는 뜻으로, 누구에게 일어나는지 알려 줘요. happen to는 꼭 같이 다니는 짝꿍 표현이니까 통째로 기억해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 15\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 ~하지 않아요\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">트럭을 가지고,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">have\u003c/span> trucks,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서 그들은 ~할 수 없어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">so\u003c/span> they \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">can't \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 바나나를 가져갈\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">take\u003c/span> their bananas\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시장에\u003c/span>\u003cspan class=\"en\">to the market.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 트럭이 없어서 바나나를 시장에 가져갈 수 없어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 트럭이 없으니 바나나를 팔러 갈 수 없다는 이야기예요. 농부들이 돈을 못 버는 까닭을 알려 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정문(일반동사 현재 부정문)\u003c/span> : 누가(They) + 하지 않아요(don't have) + 무엇을(trucks) : \"가지고 있지 않아요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사(접속사 so)\u003c/span> : 이유 + 그래서(so) + 결과 : \"그래서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">조동사(조동사 can의 부정)\u003c/span> : 누가(they) + 할 수 없어요(can't) + 가져가다(take) : \"가져갈 수 없어요\"\u003c/div>\u003c/div>","segs":[{"n":44,"text":"They don't, 그들은 ~하지 않아요. have trucks, 트럭을 가지고. so they can't, 그래서 그들은 ~할 수 없어요. take their bananas, 그들의 바나나를 가져갈. to the market, 시장에. 이 문장 전체를 해석하면, 그들은 트럭이 없어서 바나나를 시장에 가져갈 수 없어요.","hl":"m"},{"n":45,"text":"트럭이 없으면 바나나를 시장에 가져갈 수 없다는 걸 알려 주는 문장이에요. 그래서 농부들이 돈을 못 버는 거예요.","hl":"mn"},{"n":46,"text":"첫째, don't have는 부정문이에요. 일반동사 앞에 don't를 넣어서 '가지고 있지 않아요'라고 말해요. 둘째, can't take는 도와주는 동사 can에 not을 붙인 말이에요. 그래서 '가져갈 수 없어요'가 되고, 뒤에는 동사원형 take가 와요. 셋째, so는 그래서라는 뜻으로 이유와 결과를 이어 줘요. 이 문장은 따라 쓰기 정말 좋은 문장이니까 꼭 외워 봐요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 바나나를 팔아요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">They \u003c/span>\u003cspan class=\"tgt\">sell\u003c/span> the bananas\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아주 값싼 가격에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">very \u003c/span>\u003cspan class=\"tgt\">cheap \u003c/span>\u003cspan class=\"tgt\">price\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어느 구매자에게든\u003c/span>\u003cspan class=\"en\">to any buyer.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 어느 구매자에게든 아주 값싼 가격에 바나나를 팝니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 농부들이 트럭이 없어 \u003cb class=\"key\">시장\u003c/b>에 가지 못하니, 아무에게나 \u003cb class=\"key\">값싼 \u003c/b>\u003cb class=\"key\">가격\u003c/b>에 팔 수밖에 없다는 뜻이에요. Kate가 게임에서 본 일이 실제 농부들에게 일어난다고 알려 주는 부분이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재 하는 일(일반동사 현재형)\u003c/span> : 그들은(They) + 팔아요(sell) + 바나나를(the bananas) : \"그들은 팔아요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소·시간 짝꿍 말(전치사)\u003c/span> : at + a very cheap price(아주 값싼 가격) : \"아주 값싼 가격에\"\u003c/div>\u003c/div>","segs":[{"n":47,"text":"They sell the bananas, 그들은 바나나를 팔아요. at a very cheap price, 아주 값싼 가격에. to any buyer, 어느 구매자에게든. 이 문장 전체를 해석하면, 그들은 어느 구매자에게든 아주 값싼 가격에 바나나를 팝니다.","hl":"m"},{"n":48,"text":"농부들이 트럭이 없어 시장에 가지 못하니, 아무에게나 값싼 가격에 팔 수밖에 없다는 뜻이에요. Kate가 게임에서 본 일이 실제 농부들에게 일어난다고 알려 주는 부분이에요.","hl":"mn"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 15\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 설명했어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">She \u003c/span>\u003cspan class=\"tgt\">explained\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Fairtrade를 통해서\u003c/span>\u003cspan class=\"en\">that through Fairtrade,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">농부들이 공정한 보수를 얻을 수 있다고\u003c/span>\u003cspan class=\"en\">farmers \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">get\u003c/span> fair pay\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 노동에 대한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">work\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 Fairtrade를 통해서 농부들이 그들의 노동에 대한 공정한 보수를 얻을 수 있다고 설명했어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 농부들이 \u003cb class=\"key\">Fairtrade\u003c/b>를 이용하면 일한 만큼 \u003cb class=\"key\">공정한 \u003c/b>\u003cb class=\"key\">보수\u003c/b>를 받을 수 있다고 Kate가 알려 주는 문장이에요. 문제를 해결하는 방법을 소개하는 부분이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 그녀는(She) + 설명했어요(explained) : \"그녀는 설명했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">도와주는 동사(조동사)\u003c/span> : 농부들(farmers) + 할 수 있다(can) + 얻다(get) : \"얻을 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">장소·시간 짝꿍 말(전치사)\u003c/span> : for + their work(그들의 노동) : \"그들의 노동에 대한\"\u003c/div>\u003c/div>","segs":[{"n":49,"text":"She explained, 그녀는 설명했어요. that through Fairtrade, Fairtrade를 통해서. farmers can get fair pay, 농부들이 공정한 보수를 얻을 수 있다고. for their work, 그들의 노동에 대한. 이 문장 전체를 해석하면, 그녀는 Fairtrade를 통해서 농부들이 그들의 노동에 대한 공정한 보수를 얻을 수 있다고 설명했어요.","hl":"m"},{"n":50,"text":"농부들이 Fairtrade를 이용하면 일한 만큼 공정한 보수를 받을 수 있다고 Kate가 알려 주는 문장이에요. 문제를 해결하는 방법을 소개하는 부분이에요.","hl":"mn"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 15 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바나나를 살 때\u003c/span>\u003cspan class=\"en\">She said, &quot;\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">buy \u003c/span>\u003cspan class=\"tgt\">bananas\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들을 고르세요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">choose\u003c/span> ones\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Fairtrade 마크가 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">Fairtrade \u003c/span>\u003cspan class=\"tgt\">mark\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">바나나를 구매할 때, Fairtrade 마크가 있는 것을 선택하세요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 바나나를 살 때 \u003cb class=\"key\">Fairtrade \u003c/b>\u003cb class=\"key\">마크\u003c/b>가 있는 것을 고르라고 Kate가 부탁하는 문장이에요. 글의 마지막에서 우리가 할 수 있는 일을 알려 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : When + 너는(you) + 산다(buy) + 바나나를(bananas) : \"바나나를 살 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">시키는 말(명령문)\u003c/span> : 동사원형(choose) + 무엇을(ones) : \"고르세요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">장소·시간 짝꿍 말(전치사)\u003c/span> : with + a Fairtrade mark(마크가 있는) : \"Fairtrade 마크가 있는\"\u003c/div>\u003c/div>","segs":[{"n":51,"text":"When you buy bananas, 바나나를 살 때. choose ones, 그것들을 고르세요. with a Fairtrade mark, Fairtrade 마크가 있는. 이 문장 전체를 해석하면, 바나나를 구매할 때, Fairtrade 마크가 있는 것을 선택하세요.","hl":"m"},{"n":52,"text":"바나나를 살 때 Fairtrade 마크가 있는 것을 고르라고 Kate가 부탁하는 문장이에요. 글의 마지막에서 우리가 할 수 있는 일을 알려 줘요.","hl":"mn"}]},{"html":"\u003cspan class=\"lp-tag\">오늘 배운 내용 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>오늘 수업에서 Kate와 함께 \u003cb class=\"key\">바나나 \u003c/b>\u003cb class=\"key\">농부 \u003c/b>\u003cb class=\"key\">게임\u003c/b>을 했어요.\u003c/li>\u003cli>나는 100달러로 시작했지만 \u003cb class=\"key\">돈을 \u003c/b>\u003cb class=\"key\">잃기만\u003c/b> 했어요.\u003c/li>\u003cli>농부들은 \u003cb class=\"key\">트럭이 \u003c/b>\u003cb class=\"key\">없어서\u003c/b> 바나나를 시장에 가져갈 수 없어요.\u003c/li>\u003cli>\u003cb class=\"key\">Fairtrade\u003c/b>는 농부들이 공정한 보수를 받게 도와줘요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Fairtrade helps banana farmers get fair pay for their hard work.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">오늘 수업에서 \u003cb class=\"key\">바나나 \u003c/b>\u003cb class=\"key\">농부 \u003c/b>\u003cb class=\"key\">게임\u003c/b>을 했는데 아무도 돈을 벌지 못했어요. 트럭이 없어 바나나를 \u003cb class=\"key\">아주 \u003c/b>\u003cb class=\"key\">값싼 \u003c/b>\u003cb class=\"key\">가격\u003c/b>에 팔 수밖에 없는 농부들을 \u003cb class=\"key\">Fairtrade\u003c/b>가 도와준다는 것을 배웠어요.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":53,"text":"오늘 우리는 바나나 농부들의 어려움과 Fairtrade에 대해 배웠어요. 게임을 하면서 왜 농부들이 돈을 못 버는지 직접 느껴 봤죠. 바나나를 살 때 Fairtrade 마크를 한번 찾아보세요. 오늘도 정말 잘했어요, 여러분 최고예요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
