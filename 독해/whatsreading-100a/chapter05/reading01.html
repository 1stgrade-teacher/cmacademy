</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"왓츠 리딩 100A Ch.5 Unit 01 Mike and Milly's Bird","audioDir":"reading01_audio","preview":false,"count":57,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.400em\">Ch.5 Unit\u003cbr>01 Mike and\u003cbr>Milly's Bird\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">왓츠 리딩 100A\u003c/div>\u003ch1>Mike and Milly's Bird: Following the Bird to Freedom\u003c/h1>\u003ch2>Mike와 Milly의 새: 새를 따라 자유로\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">한 줄 요약\u003c/span>\u003cspan>요약: Mike와 Milly는 농장에서 오랜 시간 일하며 새처럼 \u003cb class=\"key\">자유\u003c/b>로워지기를 원했어요. 다친 \u003cb class=\"key\">새\u003c/b>를 숨겨 돌보던 두 사람은 Simon이 Mike를 팔려 한다는 말을 듣고 새를 따라 \u003cb class=\"key\">도망\u003c/b>쳐 마침내 자유로워졌답니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Mike and Milly took care of a hurt bird and followed it to become free at last.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘도 만나서 정말 반가워요. 오늘은 Mike와 Milly가 농장에서 새를 만나 자유를 찾아가는 이야기를 읽어 볼 거예요. 두 친구가 다친 새를 돌보고, 마침내 새처럼 자유로워지는 따뜻한 이야기랍니다. 함께 시작해 볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">미리 알면 쉬워요\u003c/span>\u003cdiv class=\"lp-box\">농장에서는 아침부터 저녁까지 해야 할 일이 참 많아요. 영어로 \u003cb class=\"key\">farm\u003c/b>은 농장, \u003cb class=\"key\">free\u003c/b>는 자유롭다는 뜻이에요. 우리가 숙제 때문에 못 나가는데 친구가 운동장에서 신나게 뛰노는 걸 볼 때 부러운 것처럼, Mike와 Milly도 \u003cb class=\"key\">새\u003c/b>처럼 자유롭고 싶었어요. 그리고 다친 동물을 만나면 함부로 만지지 말고 조용히 도와주는 마음이 중요해요. 새나 강아지가 다치면 어른에게 알려 주는 게 좋답니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 알아 볼게요. 농장에서는 아침부터 저녁까지 해야 할 일이 참 많아요. 영어로 farm은 농장, free는 자유롭다는 뜻이에요. 우리가 숙제 때문에 밖에 못 나가는데 친구가 운동장에서 신나게 뛰노는 걸 볼 때 부러운 것처럼, Mike와 Milly도 새처럼 자유롭고 싶었어요. 여러분은 새처럼 자유롭고 싶은 순간이 있나요? 그리고 다친 동물을 만나면 어떻게 도와줄 수 있을지도 생각해 보세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>농장 생활\u003csmall>시작 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>Mike와 Milly는 농장에서 \u003cb class=\"key\">오랜 \u003c/b>\u003cb class=\"key\">시간\u003c/b> 일했어요. 두 사람은 새처럼 \u003cb class=\"key\">자유\u003c/b>로워지기를 원했답니다. 그러던 어느 날, 큰 새 한 마리가 \u003cb class=\"key\">날아서 \u003c/b>\u003cb class=\"key\">지나갔어요\u003c/b>.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>새를 돌봄\u003csmall>문제 · 문장 4–7\u003c/small>\u003c/h4>\u003cp>농장 주인 Simon이 그 새를 발견해서 \u003cb class=\"key\">다치게 \u003c/b>\u003cb class=\"key\">했어요\u003c/b>. Milly가 다가가자 Simon이 그녀를 막았지요. 그날 밤 두 사람은 새에게 다시 가서 새를 \u003cb class=\"key\">숨기고\u003c/b> 정성껏 \u003cb class=\"key\">돌보았어요\u003c/b>.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>도망 결심\u003csmall>바뀜 · 문장 8–11\u003c/small>\u003c/h4>\u003cp>Milly는 Simon이 Mike를 다른 농장에 \u003cb class=\"key\">팔 \u003c/b>\u003cb class=\"key\">것\u003c/b>이라는 말을 들었어요. 두 사람은 \u003cb class=\"key\">도망치기로 \u003c/b>\u003cb class=\"key\">결심\u003c/b>했지요. 새를 놓아주려 했지만 새가 움직이지 않았고, Simon이 뒤쫓아 와서 새를 두고 \u003cb class=\"key\">뛰기 \u003c/b>\u003cb class=\"key\">시작했어요\u003c/b>.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>새를 따라 자유로\u003csmall>해결 · 문장 12–15\u003c/small>\u003c/h4>\u003cp>머지않아 새가 \u003cb class=\"key\">날개\u003c/b>를 펴고 날았어요. 새는 \u003cb class=\"key\">북쪽\u003c/b>으로 날았고 두 사람은 새를 따라갔어요. Mike와 Milly는 \u003cb class=\"key\">절대 \u003c/b>\u003cb class=\"key\">멈추지 \u003c/b>\u003cb class=\"key\">않았고\u003c/b> 마침내 자유로워졌답니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이야기는 농장 생활에서 시작해서 새를 돌보고, 도망치는 순서로 이어져요.","hl":null},{"n":4,"text":"처음에 Mike와 Milly는 농장에서 오랜 시간 일했어요. 두 사람은 새처럼 자유로워지기를 원했지요. 그런데 어느 날 큰 새 한 마리가 날아서 지나갔어요.","hl":"f0"},{"n":5,"text":"하지만 농장 주인 Simon이 그 새를 발견해서 다치게 했어요. Milly가 새에게 가까이 다가가자 Simon이 그녀를 막았어요. 그날 밤 두 사람은 새에게 다시 가서 새를 숨기고 정성껏 돌보았답니다.","hl":"f1"},{"n":6,"text":"어느 날 Milly는 Simon이 Mike를 다른 농장에 팔 것이라는 말을 들었어요. 그래서 두 사람은 도망치기로 결심했지요. 새를 놓아주려고 했지만 새는 움직이지 않았고, Simon이 뒤쫓아 와서 새를 두고 뛰기 시작했어요.","hl":"f2"},{"n":7,"text":"머지않아 새가 날개를 펴고 날았어요. 새는 북쪽으로 날았고 두 사람은 새를 따라갔어요. Mike와 Milly는 절대 멈추지 않았고 마침내 자유로워졌답니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">이야기 순서(문제-해결)\u003c/span>\u003cspan class=\"lp-pill\">끝\u003c/span>\u003cspan class=\"lp-pill\">주제문 15번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 시간이 흐르는 대로 사건이 이어지는 \u003cb class=\"key\">이야기\u003c/b>예요. 두 사람이 자유를 원하는 장면이 앞에 나오고, 마지막 문장에서 \u003cb class=\"key\">마침내 \u003c/b>\u003cb class=\"key\">자유로워졌다\u003c/b>고 알려 주지요. 그래서 중심 문장은 \u003cb class=\"key\">끝\u003c/b>에 있다고 말할 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>One day (3)\u003c/b>\u003cspan>새로운 일이 시작됨을 알려 줌\u003c/span>\u003cb>But (4)\u003c/b>\u003cspan>앞 내용과 반대되는 일을 알려 줌\u003c/span>\u003cb>because (11)\u003c/b>\u003cspan>왜 그랬는지 이유를 알려 줌\u003c/span>\u003cb>Finally (15)\u003c/b>\u003cspan>이야기를 마무리한다는 신호\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">a big bird\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the bird\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">it\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 일이 일어난 순서대로 쓰인 이야기예요. 처음에는 농장 생활이 나오고, 끝에는 마침내 자유로워졌다는 중심 문장이 나와요. 그래서 중심 문장의 위치는 끝이라고 할 수 있어요.","hl":"ty"},{"n":9,"text":"글의 길잡이 말도 눈여겨보세요. One day는 새로운 일이 시작된다는 것을 알려 주고, But은 앞 내용과 반대되는 일이 생긴다는 것을 알려 줘요. Because는 왜 그랬는지 이유를 알려 주고, Finally는 이야기를 마무리한다는 신호랍니다. 또 a big bird는 뒤에서 the bird나 it으로 바뀌어 나와요. 같은 새를 다르게 부르는 거예요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 단어\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>work on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에서 일하다\u003c/spa 와 Milly는 일했어요\u003c/span>\u003cspan class=\"en\">Mike and Milly \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">worked\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 농장에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">farm\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Mike와 Milly는 한 농장에서 일했어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Mike와 Milly가 농장에서 일한다는 걸 알려 주는 첫 문장이에요. \u003cb class=\"key\">주인공\u003c/b>과 \u003cb class=\"key\">배경\u003c/b>을 소개해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(Mike and Milly) + 했어요(worked) : \"일했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소 짝꿍 말(전치사)\u003c/span> : 어디에서(on) + 장소(a farm) : \"한 농장에서\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Mike and Milly worked, Mike와 Milly는 일했어요. on a farm, 한 농장에서. 이 문장 전체를 해석하면, Mike와 Milly는 한 농장에서 일했어요.","hl":"m"},{"n":13,"text":"이 문장은 이야기의 주인공과 배경을 알려 줘요. Mike와 Milly가 농장에서 일한다는 걸 기억해요.","hl":"mn"},{"n":14,"text":"worked는 지난 일을 말하는 과거형이에요. work 뒤에 -ed를 붙여서 worked가 되었어요. on a farm은 '농장에서'라는 장소를 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 15\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 일했어요\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">worked\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오랜 시간\u003c/span>\u003cspan class=\"en\">long hours,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그들은 원했어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and\u003c/span> they \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">wanted \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자유로워지기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">free\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새처럼\u003c/span>\u003cspan class=\"en\">like birds.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 오랜 시간 일했고 새처럼 자유로워지기를 원했답니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 그들이 오래 일해서 힘들었고, 새처럼 자유롭고 싶어 했다는 걸 보여 줘요. \u003cb class=\"key\">자유\u003c/b>를 바라는 \u003cb class=\"key\">마음\u003c/b>이 이야기의 중심이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(They) + 했어요(worked) : \"일했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 앞 문장(They worked long hours) + and + 뒷 문장(they wanted to be free) : \"그리고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">원하다 + to 하기(to부정사)\u003c/span> : 누가(they) + 원했어요(wanted) + 자유로워지기를(to be free) : \"자유로워지기를 원했어요\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"They worked, 그들은 일했어요. long hours, 오랜 시간. and they wanted, 그리고 그들은 원했어요. to be free, 자유로워지기를. like birds, 새처럼. 이 문장 전체를 해석하면, 그들은 오랜 시간 일했고 새처럼 자유로워지기를 원했답니다.","hl":"m"},{"n":16,"text":"그들이 오랜 시간 일해서 힘들었고, 새처럼 자유롭고 싶었다는 걸 보여 줘요. 자유를 바라는 마음이 이야기의 중심이에요.","hl":"mn"},{"n":17,"text":"첫 번째로, worked는 지난 일을 말하는 과거형이에요. 두 번째로, and는 앞 문장과 뒷 문장을 이어 주는 접속사예요. '그리고'라는 뜻으로 두 가지 사실을 연결하죠. 세 번째로, wanted to be free는 '자유로워지기를 원했어요'라는 뜻이에요. want 뒤에 to be free가 붙어서 그렇게 말해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어느 날,\u003c/span>\u003cspan class=\"en\">One day,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">큰 새가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">big \u003c/span>\u003cspan class=\"tgt\">bird\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">날아서 지나갔어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">flew \u003c/span>\u003cspan class=\"tgt\">by\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어느 날, 큰 새가 날아서 지나갔어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 큰 새가 날아오면서 이야기가 움직이기 시작해요. 이 \u003cb class=\"key\">새\u003c/b>가 뒤에서 중요한 \u003cb class=\"key\">사건\u003c/b>을 만드는 단서가 돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">꾸며 주는 말(형용사)\u003c/span> : a + 꾸며 주는 말(big) + 이름 말(bird) : \"큰 새 한 마리\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 새가(a big bird) + 날아갔어요(flew) + 지나가며(by) : \"날아서 지나갔어요\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"One day, 어느 날. a big bird, 큰 새가. flew by, 날아서 지나갔어요. 이 문장 전체를 해석하면, 어느 날, 큰 새가 날아서 지나갔어요.","hl":"m"},{"n":19,"text":"큰 새가 날아오면서 이야기가 움직이기 시작해요. 이 새가 뒤에서 중요한 사건을 만드는 단서가 돼요.","hl":"mn"},{"n":20,"text":"a big bird에서 big은 bird를 꾸며 주는 형용사예요. 그래서 '큰 새'라고 해요. flew는 fly의 지난 모양인 과거형이에요. flew by는 '날아서 지나갔어요'라는 뜻이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 농장 주인인 Simon은,\u003c/span>\u003cspan class=\"en\">But the farm owner, Simon,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 새를 발견했어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">found\u003c/span> the bird\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그 새를 다치게 했어요.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">hurt \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 농장 주인인 Simon이 그 새를 발견해서 다치게 했지요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 농장 주인 Simon이 새를 \u003cb class=\"key\">발견\u003c/b>하고 다치게 했다는 장면이에요. 새가 다쳐서 \u003cb class=\"key\">자유\u003c/b>를 잃게 되는, 이야기의 나쁜 시작을 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(Simon) + 발견했어요(found) + 무엇을(the bird) : \"발견했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 했어요(found the bird) + 그리고(and) + 했어요(hurt it) : \"그리고 그것을 다치게 했어요\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"But the farm owner, Simon, 하지만 농장 주인인 Simon은. found the bird, 그 새를 발견했어요. and hurt it, 그리고 그 새를 다치게 했어요.. 이 문장 전체를 해석하면, 하지만 농장 주인인 Simon이 그 새를 발견해서 다치게 했지요.","hl":"m"},{"n":22,"text":"이 문장은 농장 주인 Simon이 새를 발견하고 다치게 했다는 이야기예요. 새가 다치니까 Mike와 Milly의 마음도 아프게 되는 중요한 장면이지요.","hl":"mn"},{"n":23,"text":"먼저 found를 봐요. find의 지난 일 모양이라서 발견했어요, 라는 뜻이 돼요. 두 번째로 hurt도 지난 일이라서 다치게 했어요, 로 해석해요. 마지막으로 and는 이어 주는 말이에요. 발견한 일과 다치게 한 일을 한 문장에 담아 줬어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Milly가 다가갔을 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">Milly \u003c/span>\u003cspan class=\"tgt\">got \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 새 가까이로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">near \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">bird\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Simon은 그녀를 막았어요.\u003c/span>\u003cspan class=\"en\">Simon \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">stopped\u003c/span> her.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Milly가 그 새에 가까이 다가갔을 때, Simon은 그녀를 막았어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Milly가 다친 새를 도와주려고 다가갔지만, Simon이 \u003cb class=\"key\">막아섰다\u003c/b>는 뜻이에요. 새를 돕고 싶은 Milly와 그걸 막는 Simon이 \u003cb class=\"key\">부딪히는\u003c/b> 장면이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">~할 때(접속사 when)\u003c/span> : ~할 때(When) + 누가(Milly) + 다가갔어요(got near the bird) : \"Milly가 그 새 가까이 다가갔을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(Simon) + 막았어요(stopped) + 누구를(her) : \"막았어요\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"When Milly got, Milly가 다가갔을 때. near the bird, 그 새 가까이로. Simon stopped her, Simon은 그녀를 막았어요.. 이 문장 전체를 해석하면, Milly가 그 새에 가까이 다가갔을 때, Simon은 그녀를 막았어요.","hl":"m"},{"n":25,"text":"이 문장은 Milly가 다친 새를 도우려고 다가갔는데 Simon이 막았다는 이야기예요. 새를 돕고 싶은 마음과 그것을 막는 사람이 부딪히는 장면이지요.","hl":"mn"},{"n":26,"text":"첫 번째로 when을 봐요. when은 ~할 때라는 뜻으로, 두 일이 언제 일어났는지 알려 줘요. 두 번째로 stopped는 stop에 ed를 붙인 지난 일 말이에요. 세 번째로 her은 Milly를 가리키는 대신하는 말이에요. 그래서 Simon이 Milly를 막았다는 뜻이 되는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그날 밤,\u003c/span>\u003cspan class=\"en\">That night,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Mike와 Milly는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Mike \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">Milly\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 새에게 다시 갔어요.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">went \u003c/span>\u003cspan class=\"tgt\">back\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">bird\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그날 밤, Mike와 Milly는 새에게 다시 갔습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 낮에 막혔지만 밤에 몰래 새에게 \u003cb class=\"key\">다시\u003c/b> 찾아갔다는 뜻이에요. 두 사람이 새를 \u003cb class=\"key\">돌보기\u003c/b> 시작하는 따뜻한 장면이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사 and)\u003c/span> : Mike + 그리고(and) + Milly : \"Mike와 Milly\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지난 일 말(과거형)\u003c/span> : 누가(Mike and Milly) + 갔어요(went) + 다시(back) : \"다시 갔어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">장소 짝꿍 말(전치사 to)\u003c/span> : 갔어요(went back) + ~에게(to) + 그 새에게(the bird) : \"그 새에게\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"That night, 그날 밤. Mike and Milly, Mike와 Milly는. went back to the bird, 그 새에게 다시 갔어요.. 이 문장 전체를 해석하면, 그날 밤, Mike와 Milly는 새에게 다시 갔습니다.","hl":"m"},{"n":28,"text":"이 문장은 낮에 막혔지만 밤에 몰래 새에게 다시 찾아갔다는 이야기예요. 두 사람이 새를 돌보기 시작하는 따뜻한 장면이에요.","hl":"mn"},{"n":29,"text":"먼저 went back을 봐요. go의 지난 일 모양이 went이고, back을 붙이면 다시 갔어요, 가 돼요. 두 번째로 to는 방향을 알려 주는 짝꿍 말이라서 어디로 갔는지 알려 줘요. 세 번째로 and는 Mike와 Milly를 이어 주는 말이에요. 오늘 세 문장 아주 잘 따라왔어요. 멋져요!","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 숨겼어요\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">hid\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 새를\u003c/span>\u003cspan class=\"en\">the bird\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그 새를 돌봤어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and\u003c/span> took care of it.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 그 새를 숨겨서 돌보았답니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Mike와 Milly가 다친 새를 \u003cb class=\"key\">숨기고\u003c/b> \u003cb class=\"key\">돌봤다\u003c/b>는 뜻이에요. 두 사람의 \u003cb class=\"key\">착한 \u003c/b>\u003cb class=\"key\">마음\u003c/b>이 보이는 장면이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말하기(과거형)\u003c/span> : hide(숨기다) → hid(숨겼다) : \"숨겼어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 숨겼어요(hid) + 그리고(and) + 돌봤어요(took care of) : \"그리고\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"They hid, 그들은 숨겼어요. the bird, 그 새를. and took care of it, 그리고 그 새를 돌봤어요. 이 문장 전체를 해석하면, 그들은 그 새를 숨겨서 돌보았답니다.","hl":"m"},{"n":31,"text":"Mike와 Milly가 다친 새를 숨기고 돌봤다는 뜻이에요. 두 사람의 착한 마음이 보이는 장면이죠.","hl":"mn"},{"n":32,"text":"먼저 hid는 지난 일을 말하는 과거형이에요. hide가 hid로 모양이 변하는 불규칙 동사라는 것도 기억해요. 두 번째로 and는 숨긴 일과 돌본 일, 두 가지 행동을 이어 주는 말이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어느 날,\u003c/span>\u003cspan class=\"en\">One day,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Milly는 들었어요\u003c/span>\u003cspan class=\"en\">Milly \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">heard\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Simon이 Mike를 팔 거라고\u003c/span>\u003cspan class=\"en\">Simon \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">sell\u003c/span> Mike\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 농장에\u003c/span>\u003cspan class=\"en\">to another farm.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어느 날, Milly는 Simon이 Mike를 다른 농장에 팔 것이라는 말을 들었어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Simon이 Mike를 다른 농장에 \u003cb class=\"key\">팔 \u003c/b>\u003cb class=\"key\">거라는\u003c/b> 소식을 Milly가 들었다는 뜻이에요. 두 사람이 \u003cb class=\"key\">도망칠 \u003c/b>\u003cb class=\"key\">수밖에 \u003c/b>\u003cb class=\"key\">없는\u003c/b> 이유가 생긴 거예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지난 일 말하기(과거형)\u003c/span> : hear(듣다) → heard(들었어요) : \"들었어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">도와주는 동사(조동사) would\u003c/span> : would + 동사원형(sell) = ~할 거라고 : \"팔 거라고\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"One day, 어느 날. Milly heard, Milly는 들었어요. Simon would sell Mike, Simon이 Mike를 팔 거라고. to another farm, 다른 농장에. 이 문장 전체를 해석하면, 어느 날, Milly는 Simon이 Mike를 다른 농장에 팔 것이라는 말을 들었어요.","hl":"m"},{"n":34,"text":"Simon이 Mike를 다른 농장에 팔 거라는 말을 Milly가 들었어요. 두 사람이 도망칠 수밖에 없는 이유가 생긴 거죠.","hl":"mn"},{"n":35,"text":"첫 번째로 heard는 지난 일을 말하는 과거형이에요. hear가 heard로 변하는 불규칙 동사라는 점도 꼭 기억해요. 두 번째로 would는 동사 앞에서 도와주는 조동사예요. would sell은 팔 거라고라는 미래의 뜻을 담고 있답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Mike와 Milly는\u003c/span>\u003cspan class=\"en\">Mike and Milly\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">도망치기로 결심했어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">decided \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">run \u003c/span>\u003cspan class=\"tgt\">away\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Mike와 Milly는 도망치기로 결심했지요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 두 사람이 함께 \u003cb class=\"key\">도망치기로\u003c/b> 마음을 정했다는 뜻이에요. 이제 \u003cb class=\"key\">행동\u003c/b>으로 옮기는 장면이 시작돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to + 동사원형(to부정사)\u003c/span> : 결심했어요(decided) + to + 도망치다(run away) : \"도망치기로 결심했어요\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Mike and Milly, Mike와 Milly는. decided to run away, 도망치기로 결심했어요. 이 문장 전체를 해석하면, Mike와 Milly는 도망치기로 결심했지요.","hl":"m"},{"n":37,"text":"두 사람이 함께 도망치기로 마음을 정했다는 뜻이에요. 이제 결심이 행동으로 이어지겠죠.","hl":"mn"},{"n":38,"text":"decide 뒤에는 to와 동사원형이 짝으로 와요. 이렇게 쓰면 ~하기로 결심하다라는 뜻이 되죠. 그래서 decided to run away는 도망치기로 결심했어요가 돼요. 무엇을 할지 정했다는 걸 보여 주는 아주 자주 쓰는 표현이랍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 시도했어요\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">tried \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 새가 떠나가게 하려고,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">let\u003c/span> the bird go,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그런데 그 새는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">but\u003c/span> the bird\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">움직이지 않았어요.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">didn't \u003c/span>\u003cspan class=\"tgt\">move\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 그 새가 떠나가게 하려고 했지만, 그 새는 움직이지 않았어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 새를 \u003cb class=\"key\">자유\u003c/b>롭게 보내 주려 했지만 새는 \u003cb class=\"key\">가만히\u003c/b> 있었어요. 그래서 두 사람의 마음과 새의 행동이 서로 달랐다는 뜻이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to + 동사원형(to부정사)\u003c/span> : 누가(They) + 하려고 했다(tried) + 하다(to let) : \"떠나가게 하려고 했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 앞 내용(They tried) + 하지만(but) + 뒤 내용(the bird didn't move) : \"그런데, 하지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">부정문(일반동사 과거 부정문)\u003c/span> : 누가(the bird) + 하지 않았다(didn't) + 하다(move) : \"움직이지 않았어요\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"They tried, 그들은 시도했어요. to let the bird go, 그 새가 떠나가게 하려고. but the bird, 그런데 그 새는. didn't move, 움직이지 않았어요.. 이 문장 전체를 해석하면, 그들은 그 새가 떠나가게 하려고 했지만, 그 새는 움직이지 않았어요.","hl":"m"},{"n":40,"text":"새를 자유롭게 보내 주려고 했는데 새가 가만히 있었어요. 그래서 두 사람의 마음과 새의 행동이 서로 달랐다는 뜻이에요.","hl":"mn"},{"n":41,"text":"첫 번째, tried to let은 하려고 했다는 뜻이에요. try to 다음에는 동사원형이 와요. 두 번째, didn't move는 움직이지 않았어요라는 뜻이에요. didn't 뒤에 동사원형 move가 와서 지난 일을 아니라고 말해요. 세 번째, but은 앞뒤 내용이 반대일 때 이어 주는 말이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Mike와 Milly는\u003c/span>\u003cspan class=\"en\">Mike and Milly\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 새를 두고\u003c/span>\u003cspan class=\"en\">left the bird\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 뛰기 시작했어요\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">started \u003c/span>\u003cspan class=\"tgt\">running\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜냐하면 Simon이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">because\u003c/span> Simon\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들을 뒤쫓아 오고 있었기 때문이에요.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">coming\u003c/span> after them.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Simon이 그들을 뒤쫓고 있었기 때문에, Mike와 Milly는 그 새를 두고 뛰기 시작했어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Simon이 \u003cb class=\"key\">뒤쫓아\u003c/b> 오는 급한 순간이라 새를 \u003cb class=\"key\">두고\u003c/b> 도망쳤어요. 두 사람이 얼마나 다급했는지 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사-ing(동명사)\u003c/span> : 누가(they) + 시작했다(started) + 하기(running) : \"뛰기 시작했어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 왜냐하면(because) + 누가(Simon) + 하고 있었어요(was coming) : \"왜냐하면 ~때문에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">진행형(과거 진행형)\u003c/span> : 누가(Simon) + ~하는 중이었다(was coming) : \"오고 있었어요\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"Mike and Milly, Mike와 Milly는. left the bird, 그 새를 두고. and started running, 그리고 뛰기 시작했어요. because Simon, 왜냐하면 Simon이. was coming after them, 그들을 뒤쫓아 오고 있었기 때문이에요.. 이 문장 전체를 해석하면, Simon이 그들을 뒤쫓고 있었기 때문에, Mike와 Milly는 그 새를 두고 뛰기 시작했어요.","hl":"m"},{"n":43,"text":"Simon이 뒤쫓아 오는 위험한 순간이라서 새를 두고 도망쳤다는 뜻이에요. 두 사람이 얼마나 급했는지 알 수 있어요.","hl":"mn"},{"n":44,"text":"첫 번째, started running은 뛰기 시작했어요라는 뜻이에요. start 다음에 동사-ing를 붙이면 하기 시작하다가 돼요. 두 번째, because는 왜냐하면이라고 이유를 알려 주는 말이에요. 세 번째, was coming은 오고 있었어요라는 뜻이에요. be동사 was에 동사-ing를 붙이면 그때 하고 있던 중이라는 말이 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">머지않아,\u003c/span>\u003cspan class=\"en\">Soon,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 새는 폈어요\u003c/span>\u003cspan class=\"en\">the bird \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">opened\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자기 날개를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">its\u003c/span> wings\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 날았어요.\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">flew\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">머지않아, 그 새는 날개를 펴고 날았어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 새가 마침내 \u003cb class=\"key\">날개\u003c/b>를 펴고 하늘로 날아올랐어요. 두 사람에게 \u003cb class=\"key\">희망\u003c/b>이 생긴 중요한 장면이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거형(규칙 동사 과거형)\u003c/span> : 누가(the bird) + 폈다(opened) + 무엇을(its wings) : \"폈어요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">소유격(대명사)\u003c/span> : 누구의(its) + 무엇을(wings) : \"그 새의\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">과거형(불규칙 동사 과거형)\u003c/span> : 누가(the bird) + 날았다(flew) : \"날았어요\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"Soon, 머지않아. the bird opened, 그 새는 폈어요. its wings, 자기 날개를. and flew, 그리고 날았어요.. 이 문장 전체를 해석하면, 머지않아, 그 새는 날개를 펴고 날았어요.","hl":"m"},{"n":46,"text":"새가 마침내 날개를 펴고 하늘로 날아올랐어요. 두 사람에게 희망이 생긴 아주 중요한 장면이에요.","hl":"mn"},{"n":47,"text":"첫 번째, opened는 폈어요라는 뜻이에요. 동사 뒤에 -ed를 붙여서 지난 일을 말해요. 두 번째, its는 그 새의라고 알려 주는 소유격이에요. 세 번째, flew는 날았어요라는 뜻이에요. fly의 지난 일 말은 규칙과 다르게 flew로 바뀌어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 새는\u003c/span>\u003cspan class=\"en\">The bird\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">북쪽으로 날았고,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">flew\u003c/span> north,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그들은 따라갔어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and\u003c/span> they followed\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 새를.\u003c/span>\u003cspan class=\"en\">the bird.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 새는 북쪽으로 날았고 그들은 그 새를 따라갔어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 새가 북쪽으로 날아가자 Mike와 Milly가 그 새를 따라갔다는 장면이에요. 도망치기로 한 \u003cb class=\"key\">결심\u003c/b>이 드디어 \u003cb class=\"key\">행동\u003c/b>으로 이어지는 대목이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거형(과거 시제)\u003c/span> : 그 새가(The bird) + 날았다(flew) + 북쪽으로(north) : \"날았다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이어 주는 말(접속사)\u003c/span> : 새가 날았다 + 그리고(and) + 그들이 따라갔다 : \"그리고\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"The bird, 그 새는. flew north, 북쪽으로 날았고. and they followed, 그리고 그들은 따라갔어요. the bird, 그 새를.. 이 문장 전체를 해석하면, 그 새는 북쪽으로 날았고 그들은 그 새를 따라갔어요.","hl":"m"},{"n":49,"text":"새가 북쪽으로 날아가니까 두 사람이 그 새를 따라갔다는 뜻이에요. 도망치기로 한 결심이 드디어 행동으로 이어지는 장면이죠.","hl":"mn"},{"n":50,"text":"첫 번째, flew는 fly의 과거형이에요. 이미 지나간 일이라 과거형으로 말해요. 두 번째, and는 이어 주는 말이에요. 새가 날아간 일과 두 사람이 따라간 일을 한 문장으로 이어 줘요. 여러분도 and로 두 가지 일을 이어 말해 볼까요?","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 15\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Mike와 Milly는\u003c/span>\u003cspan class=\"en\">Mike and Milly\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">절대 멈추지 않았어요.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">never\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">stopped\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Mike와 Milly는 절대 멈추지 않았어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Mike와 Milly가 \u003cb class=\"key\">절대\u003c/b> 멈추지 않았다는 뜻이에요. 힘들어도 \u003cb class=\"key\">포기\u003c/b>하지 않은 두 사람의 마음이 보여요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">더 자세히 알려 주는 말(부사)\u003c/span> : 누가(Mike and Milly) + 절대(never) + 하지 않았다(stopped) : \"절대\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거형(과거 시제)\u003c/span> : 그들은(They) + 멈췄다(stopped) : \"멈추지 않았다\"\u003c/div>\u003c/div>","segs":[{"n":51,"text":"Mike and Milly, Mike와 Milly는. never stopped, 절대 멈추지 않았어요.. 이 문장 전체를 해석하면, Mike와 Milly는 절대 멈추지 않았어요.","hl":"m"},{"n":52,"text":"두 사람이 힘들어도 절대 멈추지 않았다는 뜻이에요. 끝까지 포기하지 않은 마음이 느껴지죠.","hl":"mn"},{"n":53,"text":"첫 번째, never는 절대 않는다는 뜻을 더해 주는 부사예요. 동사 앞에서 뜻을 강하게 만들어요. 두 번째, stopped는 과거형이에요. 이미 지나간 일이라 stop에 ed를 붙였어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 15 / 15\u003cspan class=\"es\">꼭 외울 문장\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마침내,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Finally\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 자유로워졌어요.\u003c/span>\u003cspan class=\"en\">they \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">were\u003c/span> free.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">마침내 그들은 자유로워졌답니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 두 사람이 마침내 \u003cb class=\"key\">자유\u003c/b>를 얻었다는 결말이에요. 이야기를 기분 좋게 마무리해 주는 \u003cb class=\"key\">결말\u003c/b> 문장이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">더 자세히 알려 주는 말(부사)\u003c/span> : 마침내(Finally) + 그들은(they) + 자유로웠다(were free) : \"마침내\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be동사(be동사)\u003c/span> : 그들은(they) + 이었다(were) + 자유로운(free) : \"~이었다\"\u003c/div>\u003c/div>","segs":[{"n":54,"text":"Finally, 마침내. they were free, 그들은 자유로워졌어요.. 이 문장 전체를 해석하면, 마침내 그들은 자유로워졌답니다.","hl":"m"},{"n":55,"text":"마침내 두 사람이 자유를 얻었다는 결말이에요. 힘든 이야기가 기분 좋게 끝나는 순간이죠.","hl":"mn"},{"n":56,"text":"첫 번째, Finally는 마침내라는 부사예요. 문장 앞에서 결말을 힘 있게 알려 줘요. 두 번째, were는 be동사예요. they는 여러 명이라 were를 써요. 여러분도 finally로 나만의 결말 문장을 만들어 볼까요? 아주 잘하고 있어요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">오늘 배운 내용 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>Mike와 Milly는 농장에서 \u003cb class=\"key\">오랜 \u003c/b>\u003cb class=\"key\">시간\u003c/b> 일하며 새처럼 \u003cb class=\"key\">자유\u003c/b>를 꿈꿨어요.\u003c/li>\u003cli>Simon이 다치게 한 새를 두 사람은 숨기고 \u003cb class=\"key\">돌보았어요\u003c/b>.\u003c/li>\u003cli>Simon이 Mike를 팔려 하자 두 사람은 \u003cb class=\"key\">도망치기로 \u003c/b>\u003cb class=\"key\">결심\u003c/b>했어요.\u003c/li>\u003cli>새를 따라 북쪽으로 간 두 사람은 \u003cb class=\"key\">마침내 \u003c/b>\u003cb class=\"key\">자유로워졌답니다\u003c/b>.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Mike and Milly took care of a hurt bird and followed it to become free at last.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: Mike와 Milly는 농장에서 오랜 시간 일하며 새처럼 \u003cb class=\"key\">자유\u003c/b>로워지기를 원했어요. 다친 \u003cb class=\"key\">새\u003c/b>를 숨겨 돌보던 두 사람은 Simon이 Mike를 팔려 한다는 말을 듣고 새를 따라 \u003cb class=\"key\">도망\u003c/b>쳐 마침내 자유로워졌답니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":57,"text":"오늘 우리는 Mike와 Milly가 새를 돌보고 새를 따라 자유를 찾은 이야기를 읽었어요. 오랜 시간 일해도 희망을 잃지 않은 두 친구가 정말 멋졌죠? 꼭 외울 문장은 they wanted to be free like birds와 Finally, they were free예요. 여러분도 오늘 배운 단어와 문장을 소리 내어 읽어 보세요. 정말 잘했어요, 다음에 또 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
