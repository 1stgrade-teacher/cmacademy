<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>어휘 - 청명학원 문화본원 +수업저장소</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="../style.css">
<style>
  .box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-top:14px}
  .box h2{font:700 18px var(--font);margin:0 0 10px;color:var(--ink)}
  .sub{color:var(--muted);font-size:14px;line-height:1.6;margin:0}
  .err{color:#A2342A;font-size:14px;margin:8px 0 0;line-height:1.5}
  .btn{border:0;border-radius:12px;background:var(--teal,#0A7E80);color:#fff;font:700 16px var(--font);padding:13px 18px;cursor:pointer}
  .btn[disabled]{opacity:.5;cursor:default}
  .btn.ghost{background:#EEF4F4;color:#0A5F61}
  .btn.sm{font-size:14px;padding:9px 13px;border-radius:10px}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
  .crumb{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
  .crumb button{border:0;background:none;color:#0A5F61;font:600 14px var(--font);text-decoration:underline;cursor:pointer;padding:0}
  /* 단어장 고르기 */
  .books{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:12px}
  .bk{text-align:left;border:1.5px solid var(--border-strong,#d5dde0);background:var(--card);border-radius:14px;padding:14px;cursor:pointer;font:600 15px var(--font);color:var(--ink)}
  .bk:hover{border-color:#0A7E80;background:#F2FAFA}
  .bk small{display:block;color:var(--muted);font-weight:500;font-size:12.5px;margin-top:5px}
  .gr{display:inline-block;font:700 11.5px var(--font);background:#E3F3F3;color:#0A5F61;border-radius:6px;padding:2px 7px;margin-bottom:6px}
  .lnk{border:0;background:none;padding:0;color:#0A5F61;font:600 13px var(--font);text-decoration:underline;cursor:pointer}
  .ch{margin-top:14px}.ch b{font-size:14px;color:var(--ink)}
  .days{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
  .day{border:1.5px solid var(--border-strong,#d5dde0);background:var(--card);border-radius:10px;padding:9px 12px;font:600 14px var(--font);color:var(--ink);cursor:pointer}
  .day.on{background:#0A7E80;border-color:#0A7E80;color:#fff}
  .day small{font-weight:500;opacity:.75;margin-left:4px}
  .sticky{position:sticky;bottom:10px;margin-top:16px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.08)}
  .sticky .n{flex:1;font-size:14px;color:var(--muted)}
  /* 메뉴 */
  .modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
  .md{border:0;border-radius:16px;padding:16px 12px;text-align:left;cursor:pointer;font:700 16px var(--font);color:#16302F;background:#EAF6F5;min-height:96px;display:flex;flex-direction:column;gap:6px}
  .md:hover{filter:brightness(.97)}
  .md .e{font-size:28px;line-height:1}
  .md small{font-weight:500;font-size:12.5px;color:#4D6463;line-height:1.4}
  .md.c1{background:#FFF3DC}.md.c2{background:#E8F0FF}.md.c3{background:#F3E9FF}.md.c4{background:#E6F7EA}.md.c5{background:#FFE9EC}.md.c6{background:#EAF6F5}.md.c7{background:#FFF0E3}.md.c8{background:#EEF1F3}.md.c9{background:#EDE8FF}
  .md[disabled]{opacity:.45;cursor:default}
  .opt{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-top:12px}
  .wl{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
  .wl td{border-top:1px solid var(--border);padding:7px 6px;vertical-align:top}
  .wl td:first-child{font-weight:700;white-space:nowrap}
  .wl .x{color:var(--muted);font-size:12.5px}
  /* 게임 화면 */
  .top{display:flex;align-items:center;gap:10px;margin-top:6px}
  .bar{flex:1;height:10px;background:#E7ECEE;border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;background:#0A7E80;border-radius:99px;transition:width .25s}
  .cnt{font:700 14px var(--font);color:var(--muted);white-space:nowrap}
  .quit{border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted);padding:0 4px}
  .stage{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:26px 18px;margin-top:14px;text-align:center}
  .qlabel{font-size:13.5px;color:var(--muted);font-weight:600}
  .qword{font:800 clamp(30px,8vw,44px) var(--font);color:var(--ink);margin:10px 0 4px;word-break:break-word;line-height:1.15}
  .qmean{font:700 clamp(20px,5.5vw,26px) var(--font);color:var(--ink);margin:12px 0 4px;line-height:1.35;word-break:keep-all}
  .qsent{font:600 clamp(17px,4.6vw,21px) var(--font);color:var(--ink);margin:12px 0 4px;line-height:1.55}
  .qsent u{text-decoration:none;border-bottom:3px solid #0A7E80;padding:0 18px}
  .pos{font-size:13px;color:var(--muted)}
  .say{border:0;background:#EEF4F4;color:#0A5F61;border-radius:99px;padding:7px 13px;font:700 14px var(--font);cursor:pointer;margin-top:6px}
  .choices{display:grid;gap:9px;margin-top:18px}
  .ch2{grid-template-columns:1fr 1fr}
  .cb{border:2px solid #DCE4E6;background:#fff;border-radius:14px;padding:14px 12px;font:600 16px var(--font);color:var(--ink);cursor:pointer;text-align:center;line-height:1.35;word-break:keep-all}
  .cb:hover{border-color:#0A7E80}
  .cb.ok{background:#DFF5E8;border-color:#2E9E5B;color:#1E6B3E}
  .cb.no{background:#FDE3E1;border-color:#D2554A;color:#A2342A}
  .cb[disabled]{cursor:default}
  .ans{margin-top:18px}
  .ans input{width:100%;box-sizing:border-box;text-align:center;font:700 22px var(--font);padding:13px;border:2px solid #DCE4E6;border-radius:14px;letter-spacing:.5px}
  .ans input:focus{outline:none;border-color:#0A7E80}
  .ans input.ok{border-color:#2E9E5B;background:#F1FBF5}.ans input.no{border-color:#D2554A;background:#FFF5F4}
  .fb{min-height:24px;margin-top:12px;font:700 15px var(--font)}
  .fb.ok{color:#1E7A45}.fb.no{color:#A2342A}
  .fb .xp{display:block;font-weight:500;color:var(--muted);font-size:13.5px;margin-top:8px;line-height:1.55;word-break:keep-all}
  .fb .rt{display:block;font-weight:500;color:var(--muted);font-size:13.5px;margin-top:4px}
  .hintl{font:700 20px var(--font);letter-spacing:6px;color:#0A5F61;margin-top:10px}
  .combo{font:800 13px var(--font);color:#C2410C;height:18px;margin-top:6px}
  /* 카드 */
  .flip{perspective:1200px;margin-top:14px;cursor:pointer}
  .card3{position:relative;min-height:290px;transition:transform .45s;transform-style:preserve-3d}
  .flip.back .card3{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:24px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:auto}
  .face.b{transform:rotateY(180deg);justify-content:flex-start}
  .face .ex{font-size:15.5px;line-height:1.55;margin-top:12px;color:var(--ink)}
  .face .ex b{color:#0A7E80}
  .face .exk{font-size:13.5px;color:var(--muted);margin-top:3px}
  .face .more{font-size:13.5px;color:var(--muted);margin-top:10px;line-height:1.6}
  .tap{font-size:12.5px;color:var(--muted);margin-top:14px}
  /* 짝 맞추기 */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
  .tile{border:2px solid #DCE4E6;background:#fff;border-radius:14px;padding:12px 8px;min-height:62px;font:700 15px var(--font);color:var(--ink);cursor:pointer;line-height:1.3;word-break:keep-all;transition:opacity .25s,transform .15s}
  .tile.en{font-size:17px;color:#0A5F61}
  .tile.sel{border-color:#0A7E80;background:#E3F3F3;transform:scale(1.03)}
  .tile.no{border-color:#D2554A;background:#FDE3E1;animation:shake .3s}
  .tile.gone{opacity:0;pointer-events:none}
  @keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .timer{font:800 22px var(--font);color:#0A5F61}
  /* 결과 */
  .result{text-align:center}
  .result .big{font-size:54px;line-height:1}
  .result .sc{font:800 34px var(--font);color:var(--ink);margin-top:8px}
  .stars{font-size:28px;letter-spacing:4px;margin-top:6px}
  .wrongs{text-align:left;margin-top:16px}
  .best{font-size:13.5px;color:#C2410C;font-weight:700;margin-top:6px}
  .rk{margin-top:14px;font-size:15px;background:#FFF7E6;border-radius:12px;padding:10px 12px;color:#7A4B00}
  .rk .lnk{margin-left:6px}
  .rtabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;align-items:center}
  .rt{border:1.5px solid #DCE4E6;background:#fff;border-radius:99px;padding:7px 13px;font:700 13.5px var(--font);color:var(--ink);cursor:pointer}
  .rt.on{background:#0A7E80;border-color:#0A7E80;color:#fff}.rt[disabled]{opacity:.4;cursor:default}
  .rh{font:800 16px var(--font);margin:18px 0 6px;color:var(--ink)}
  .rkt{width:100%;border-collapse:collapse;font-size:15px}
  .rkt td{padding:9px 6px;border-top:1px solid var(--border)}
  .rkt .rn{width:40px;text-align:center;font-weight:800;font-size:17px;color:var(--muted)}
  .rkt .v{text-align:right;font-weight:800;color:#0A5F61;white-space:nowrap}
  .rkt .x{font-size:12px;color:var(--muted)}
  .rkt tr.me td{background:#FFF3C9}
  .mine{margin-top:12px;background:#E3F3F3;border-radius:12px;padding:11px 13px;font-size:15px;color:#0A4F51}
  .rkbox{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:linear-gradient(135deg,#FFF3C9,#FFE3B3);border:0}
  @media (max-width:420px){.ch2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="topbar">
  <a class="back" href="../index.html">&larr; 전체 영역</a>
  <span class="brand" style="margin-left:auto;"><span class="spark">✳</span>청명학원 문화본원 +수업저장소</span>
</div>
<div class="wrap">
  <div class="hero" style="padding-bottom:4px"><div class="hero-text"><p class="eyebrow" style="color:var(--teal);">WORD MASTER</p><h1>📒 단어 마스터</h1><p>내 단어장을 골라 카드로 외우고, 게임으로 확인해요.</p></div></div>
  <div id="app"><div class="box"><p class="sub">불러오는 중…</p></div></div>
  <footer>&copy; 2026 청명학원 문화본원 +수업저장소</footer>
</div>
<script src="../letterbox.js"></script>
<script>
(function () {
  "use strict";
  var API = "/api/monthly", app = document.getElementById("app");
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  function post(b) {
    return fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(b) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { j._s = r.status; return j; }); })
      .catch(function () { return { _s: 0, msg: "인터넷 연결을 확인해 주세요." }; });
  }
  function lsGet(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  var forms = function (w) { return String(w).split(/\s*[\/,;]\s*/).map(function (x) { return x.trim(); }).filter(Boolean); };
  var main = function (w) { return forms(w)[0] || w; };
  var norm = function (s) { return String(s || "").toLowerCase().replace(/[’']/g, "'").replace(/[^a-z' -]/g, "").replace(/\s+/g, " ").trim(); };
  var short = function (m) { m = String(m || ""); return m.length > 34 ? m.slice(0, 33) + "…" : m; };

  // ---------- 상태 ----------
  var BOOKS = [], BOOK = null, SEL = {}, WORDS = [], TITLE = "", UNITS = [];
  var OPT = lsGet("cm-vg-opt", { sound: true, rev: false });
  if (OPT.boxes == null) OPT.boxes = true; // 🔤 글자 칸으로 쓰기 (키보드 추천 방지)
  var WRONG = lsGet("cm-vg-wrong", {}); // key(단어) → {w,m,pos,...,n}
  var BEST = lsGet("cm-vg-best", {});
  function saveWrong() { lsSet("cm-vg-wrong", WRONG); }
  function addWrong(e) { var k = e.w.toLowerCase(); var o = WRONG[k] || Object.assign({}, e, { n: 0 }); o.n = (o.n || 0) + 1; o.t = Date.now(); WRONG[k] = o; saveWrong(); }
  function okWrong(e) { var k = e.w.toLowerCase(); if (WRONG[k]) { WRONG[k].n -= 1; if (WRONG[k].n <= 0) delete WRONG[k]; saveWrong(); } }

  // ---------- 발음 ----------
  var VOICE = null;
  function pickVoice() { try { var vs = speechSynthesis.getVoices().filter(function (v) { return /^en(-|_)/i.test(v.lang); }); VOICE = vs.filter(function (v) { return /en(-|_)US/i.test(v.lang); })[0] || vs[0] || null; } catch (e) {} }
  if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function say(text, rate) {
    if (!("speechSynthesis" in window)) return;
    try { speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(String(text).replace(/[\[\]]/g, "")); u.lang = "en-US"; if (VOICE) u.voice = VOICE; u.rate = rate || 0.9; speechSynthesis.speak(u); } catch (e) {}
  }
  var canSay = "speechSynthesis" in window;

  // ---------- 1. 단어장 고르기 ----------
  function start() {
    var q = new URLSearchParams(location.search), ids = (q.get("u") || "").split(",").filter(Boolean);
    post({ action: "g_books" }).then(function (j) {
      if (!j.ok) { app.innerHTML = '<div class="box"><p class="err">' + esc(j.msg || "단어장을 불러오지 못했어요.") + '</p><div class="row"><button class="btn ghost" onclick="location.reload()">다시 시도</button></div></div>'; return; }
      BOOKS = j.books || [];
      if (ids.length) { loadWords(ids); return; } // 선생님이 보낸 링크
      showBooks();
    });
  }
  function showBooks() {
    BOOK = null; SEL = {};
    var last = lsGet("cm-vg-last", null);
    if (!BOOKS.length) { app.innerHTML = '<div class="box"><h2>아직 단어장이 없어요</h2><p class="sub">선생님이 단어장을 올리면 여기에 나타나요.</p></div>'; return; }
    var wn = Object.keys(WRONG).length;
    app.innerHTML = (last && last.ids && last.ids.length ? '<div class="box" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><div style="flex:1;min-width:180px"><b>최근 공부한 단어장</b><p class="sub">' + esc(last.title) + '</p></div><button class="btn" id="resume">이어서 하기 ▶</button></div>' : "") +
      '<div class="box rkbox"><div style="flex:1;min-width:180px"><b>🏆 단어 랭킹</b><p class="sub" style="color:#6B4A00">' + (ME ? "👤 " + esc(ME.name) + " · " + esc(ME.cls) + " · 게임을 끝내면 점수가 쌓여요" : "로그인하면 게임 점수가 반 랭킹에 쌓여요") + '</p></div>' + (ME ? "" : '<button class="btn ghost" id="rkIn">로그인</button>') + '<button class="btn" id="rkSee">랭킹 보기</button></div>' +
      (wn ? '<div class="box" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><div style="flex:1;min-width:180px"><b>❌ 틀린 단어 노트</b><p class="sub">' + wn + '개 · 맞힐 때마다 줄어들어요</p></div><button class="btn ghost" id="wrongGo">틀린 단어만 공부</button></div>' : "") +
      '<div class="box"><h2>1. 내 단어장 고르기</h2><div class="books">' + BOOKS.map(function (b, i) {
        var nu = b.chapters.reduce(function (a, c) { return a + c.units.length; }, 0);
        return '<button class="bk" data-b="' + i + '">' + (b.grade ? '<span class="gr">' + esc(b.grade) + "</span><br>" : "") + esc(b.name) + "<small>" + nu + "개 Day/Unit</small></button>";
      }).join("") + "</div></div>";
    Array.prototype.forEach.call(app.querySelectorAll("[data-b]"), function (el) { el.onclick = function () { showDays(BOOKS[+el.getAttribute("data-b")]); }; });
    document.getElementById("rkSee").onclick = function () { ranking(); };
    var ri = document.getElementById("rkIn"); if (ri) ri.onclick = function () { login(showBooks); };
    var r = document.getElementById("resume"); if (r) r.onclick = function () { loadWords(last.ids); };
    var w = document.getElementById("wrongGo"); if (w) w.onclick = function () { WORDS = Object.keys(WRONG).map(function (k) { return WRONG[k]; }); TITLE = "❌ 틀린 단어 노트"; UNITS = []; menu(); };
  }
  function dayBtn(u, label) { return '<button class="day" data-u="' + esc(u.id) + '">' + esc(label) + "<small>" + (u.words || "") + "</small></button>"; }
  function showDays(b) {
    BOOK = b; SEL = {};
    var flat = b.chapters.every(function (c) { return c.units.length === 1; }); // Day마다 한 과면 Day 버튼 한 줄로
    app.innerHTML = '<div class="box"><div class="crumb"><button id="bkBack">단어장</button><span>›</span><b>' + esc(b.name) + '</b></div><h2 style="margin-top:10px">2. 공부할 Day 고르기 <span class="sub" style="font-weight:500">(여러 개 골라도 돼요)</span></h2>' +
      (flat ? '<div class="ch"><button class="lnk" data-all="-1">전체 선택</button><div class="days">' + b.chapters.map(function (c) { var u = c.units[0]; return dayBtn(u, c.name + (/^(단어|어휘|words?|vocab)$/i.test(u.name) || u.name === c.name ? "" : " " + u.name)); }).join("") + "</div></div>" :
      b.chapters.map(function (c, ci) {
        return '<div class="ch"><b>' + esc(c.name) + '</b> <button class="lnk" data-all="' + ci + '">전체 선택</button><div class="days">' + c.units.map(function (u) { return dayBtn(u, u.name); }).join("") + "</div></div>";
      }).join("")) + '</div><div class="sticky"><span class="n" id="selN">Day를 골라 주세요</span><button class="btn" id="go" disabled>시작 ▶</button></div>';
    document.getElementById("bkBack").onclick = showBooks;
    function upd() {
      var ids = Object.keys(SEL), n = 0;
      b.chapters.forEach(function (c) { c.units.forEach(function (u) { if (SEL[u.id]) n += u.words || 0; }); });
      Array.prototype.forEach.call(app.querySelectorAll("[data-u]"), function (el) { el.classList.toggle("on", !!SEL[el.getAttribute("data-u")]); });
      document.getElementById("selN").textContent = ids.length ? ids.length + "개 골랐어요 · 단어 " + n + "개" : "Day를 골라 주세요";
      document.getElementById("go").disabled = !ids.length;
    }
    Array.prototype.forEach.call(app.querySelectorAll("[data-u]"), function (el) { el.onclick = function () { var id = el.getAttribute("data-u"); if (SEL[id]) delete SEL[id]; else if (Object.keys(SEL).length < 20) SEL[id] = 1; upd(); }; });
    Array.prototype.forEach.call(app.querySelectorAll("[data-all]"), function (el) { el.onclick = function () { var ci = +el.getAttribute("data-all"), c = ci < 0 ? { units: b.chapters.map(function (x) { return x.units[0]; }) } : b.chapters[ci], all = c.units.every(function (u) { return SEL[u.id]; }); c.units.forEach(function (u) { if (all) delete SEL[u.id]; else if (Object.keys(SEL).length < 20) SEL[u.id] = 1; }); upd(); }; });
    document.getElementById("go").onclick = function () { loadWords(Object.keys(SEL)); };
    window.scrollTo(0, 0);
  }
  function loadWords(ids) {
    app.innerHTML = '<div class="box"><p class="sub">단어를 불러오는 중…</p></div>';
    post({ action: "g_words", ids: ids }).then(function (j) {

          var y = tiles[+sel.getAttribute("data-n")];
          if (x.en === y.en) { sel.classList.remove("sel"); sel = el; el.classList.add("sel"); return; }
          if (x.k === y.k) { el.classList.add("gone"); sel.classList.add("gone"); sel = null; left--; done0++; okWrong(set[x.k]); if (!left) { r++; later(round, 350); } }
          else { miss++; addWrong(set[x.en ? x.k : y.k]); var a = sel; a.classList.remove("sel"); a.classList.add("no"); el.classList.add("no"); sel = null; setTimeout(function () { a.classList.remove("no"); el.classList.remove("no"); }, 350); }
        };
      });
    }
    round();
  }

  // ---------- ⚡ 60초 챌린지 ----------
  function speed() {
    var t0 = Date.now(), left = 60, right = 0, wrong = 0, end = Date.now() + 60000, pool = [], wrongs = [];
    function next() {
      if (!pool.length) pool = shuffle(WORDS);
      var e = pool.pop(), rev = Math.random() < 0.5 && WORDS.length >= 2, W = main(e.w);
      var ans = rev ? W : e.m, opts = shuffle([ans].concat(distract(e, 3, function (x) { return rev ? main(x.w) : x.m; })));
      app.innerHTML = header(60 - left, 60, '⏱ <span class="timer" id="tm">' + left + "</span>초") + '<div class="stage"><div class="qlabel">' + (rev ? "이 뜻의 단어는?" : "이 단어의 뜻은?") + "</div>" +
        (rev ? '<div class="qmean">' + esc(e.m) + "</div>" : '<div class="qword">' + esc(e.w) + "</div>") +
        '<div class="choices' + (opts.every(function (o) { return o.length < 14; }) ? " ch2" : "") + '">' + opts.map(function (o, k) { return '<button class="cb" data-k="' + k + '">' + esc(short(o)) + "</button>"; }).join("") + "</div>" +
        '<div class="fb" style="color:var(--muted)">✅ ' + right + " &nbsp; ❌ " + wrong + "</div></div>";
      bindQuit();
      Array.prototype.forEach.call(app.querySelectorAll(".cb"), function (b) {
        b.onclick = function () {
          var ok = opts[+b.getAttribute("data-k")] === ans;
          if (ok) { right++; okWrong(e); } else { wrong++; wrongs.push(e); addWrong(e); }
          b.classList.add(ok ? "ok" : "no");
          Array.prototype.forEach.call(app.querySelectorAll(".cb"), function (x) { x.disabled = true; if (!ok && opts[+x.getAttribute("data-k")] === ans) x.classList.add("ok"); });
          later(function () { if (TIMER) next(); }, ok ? 250 : 900);
        };
      });
    }
    stopTimer();
    TIMER = setInterval(function () {
      left = Math.max(0, Math.ceil((end - Date.now()) / 1000));
      var tm = document.getElementById("tm"); if (tm) tm.textContent = left;
      if (left <= 0) { stopTimer(); done("speed", { score: right + "개", best: right + "개", highBest: right, sub: "틀림 " + wrong + "개", wrongs: wrongs, rec: { right: right, total: right + wrong, sec: (Date.now() - t0) / 1000 }, retry: speed }); }
    }, 200);
    next();
  }

  // ---------- 결과 ----------
  function done(mode, r) {
    stopTimer();
    var key = mode + "|" + TITLE, old = BEST[key], isBest = false;
    if (mode === "match" && r.lowBest != null) { var ov = parseFloat(old); if (!old || r.lowBest < ov) { BEST[key] = r.best; isBest = !!old; } }
    else if (mode === "speed" && r.highBest != null) { if (!old || r.highBest > parseInt(old, 10)) { BEST[key] = r.best; isBest = !!old; } }
    else if (r.pct != null) { if (!old || r.pct > parseInt(old, 10)) { BEST[key] = r.best; isBest = !!old; } }
    lsSet("cm-vg-best", BEST);
    var pct = r.pct, stars = pct == null ? "" : pct >= 90 ? "⭐⭐⭐" : pct >= 70 ? "⭐⭐☆" : pct >= 40 ? "⭐☆☆" : "☆☆☆";
    var big = mode === "card" ? "🎓" : pct == null ? "🏁" : pct >= 90 ? "🏆" : pct >= 70 ? "🎉" : "💪";
    var ws = []; (r.wrongs || []).forEach(function (e) { if (ws.indexOf(e) < 0) ws.push(e); });
    app.innerHTML = '<div class="stage result"><div class="big">' + big + '</div><div class="sc">' + esc(r.title || r.score || "") + "</div>" +
      (stars ? '<div class="stars">' + stars + "</div>" : "") + (r.sub ? '<p class="sub">' + esc(r.sub) + "</p>" : "") +
      (r.combo >= 3 ? '<p class="sub">🔥 최고 ' + r.combo + "연속 정답</p>" : "") + (isBest ? '<div class="best">🎊 새 최고 기록!</div>' : old && mode !== "card" ? '<p class="sub">최고 기록: ' + esc(BEST[key]) + "</p>" : "") +
      (ws.length ? '<div class="wrongs"><b>틀린 단어 ' + ws.length + "개</b><table class=\"wl\">" + ws.map(function (e) { return "<tr><td>" + esc(e.w) + "</td><td>" + esc(e.m) + "</td></tr>"; }).join("") + "</table></div>" : "") +
      (r.rec && r.rec.total ? '<div class="rk" id="rk">' + (ME ? "🏆 기록하는 중…" : '🏆 로그인하면 포인트가 랭킹에 쌓여요 <button class="lnk" id="rkLogin">로그인하고 기록하기</button>') + "</div>" : "") +
      '<div class="row" style="justify-content:center">' + (ws.length ? '<button class="btn" id="rw">틀린 것만 다시</button>' : "") + (r.retry ? '<button class="btn' + (ws.length ? " ghost" : "") + '" id="again">다시 하기</button>' : "") + '<button class="btn ghost" id="mn">다른 게임</button></div></div>';
    var rw = document.getElementById("rw"); if (rw) rw.onclick = function () { run(mode === "speed" || mode === "match" ? "mean" : mode, ws); };
    var ag = document.getElementById("again"); if (ag) ag.onclick = r.retry;
    document.getElementById("mn").onclick = menu;
    if (r.rec && r.rec.total) {
      var rec = { game: mode, right: r.rec.right, total: r.rec.total, sec: r.rec.sec, title: TITLE };
      if (ME) sendScore(rec); else document.getElementById("rkLogin").onclick = function () { PENDING = rec; login(function () { var rk = document.getElementById("rk"); sendScore(rec); }); };
    }
    window.scrollTo(0, 0);
  }

  // ---------- 🏆 랭킹 ----------
  var ME = lsGet("cm-vg-me", null); if (ME && !(ME.exp > Date.now())) ME = null;
  var PENDING = null;
  function sendScore(rec, el) {
    var rk = el || document.getElementById("rk");
    post({ action: "g_score", token: ME && ME.gtoken, game: rec.game, right: rec.right, total: rec.total, sec: rec.sec, title: rec.title }).then(function (j) {
      rk = document.getElementById("rk") || rk; if (!rk) return;
      if (j.relogin) { ME = null; lsSet("cm-vg-me", null); rk.innerHTML = '🏆 다시 로그인하면 기록돼요 <button class="lnk" id="rkLogin">로그인</button>'; document.getElementById("rkLogin").onclick = function () { login(function () { sendScore(rec); }); }; return; }
      if (!j.ok) { rk.innerHTML = '<span class="err" style="margin:0">' + esc(j.msg || "기록하지 못했어요.") + "</span>"; return; }
      rk.innerHTML = "🏆 <b>+" + j.points + "점</b> 기록했어요 <button class=\"lnk\" id=\"rkGo\">랭킹 보기</button>";
      document.getElementById("rkGo").onclick = function () { ranking(); };
    });
  }
  // 로그인: 반 → 이름 → 번호 (TEST·과제와 같은 4자리). 이 기기에서 30일 동안 기억
  function login(after) {
    var back = function () { after ? after() : showBooks(); };
    function cls(note) {
      app.innerHTML = '<div class="box"><h2>👋 내 반을 골라요</h2><p class="sub">TEST(시험) 볼 때와 같은 이름·번호로 들어가요.</p>' + (note ? '<p class="err">' + esc(note) + "</p>" : "") + '<div class="books" id="pk"><span class="sub">불러오는 중…</span></div><div class="row"><button class="btn ghost" id="cx">취소</button></div></div>';
      document.getElementById("cx").onclick = function () { PENDING = null; showBooks(); };
      post({ action: "classes" }).then(function (j) {
        var pk = document.getElementById("pk"); if (!pk) return; if (!j.classes) { pk.innerHTML = '<span class="err">' + esc(j.msg || "반 목록을 불러오지 못했어요.") + "</span>"; return; }
        pk.innerHTML = j.classes.map(function (c, i) { return '<button class="bk" data-i="' + i + '">' + esc(c) + "</button>"; }).join("");
        Array.prototype.forEach.call(pk.children, function (b) { b.onclick = function () { name(j.classes[+b.getAttribute("data-i")]); }; });
      });
    }
    function name(c) {
      app.innerHTML = '<div class="box"><h2>' + esc(c) + ' · 내 이름을 눌러요</h2><div class="books" id="pk"><span class="sub">명단을 불러오는 중…</span></div><div class="row"><button class="btn ghost" id="bk2">반 다시 고르기</button></div></div>';
      document.getElementById("bk2").onclick = function () { cls(); };
      post({ action: "roster", cls: c }).then(function (j) {
        var pk = document.getElementById("pk"); if (!pk) return; if (!j.students) { pk.innerHTML = '<span class="err">' + esc(j.msg || "명단을 불러오지 못했어요.") + "</span>"; return; }
        pk.innerHTML = j.students.length ? j.students.map(function (s, i) { return '<button class="bk" data-i="' + i + '">' + esc(s.name) + "</button>"; }).join("") : '<span class="sub">명단이 비어 있어요. 선생님께 알려 주세요.</span>';
        Array.prototype.forEach.call(pk.children, function (b) { b.onclick = function () { pin(c, j.students[+b.getAttribute("data-i")]); }; });
      });
    }
    function pin(c, stu) {
      var first = !stu.hasPin;
      app.innerHTML = '<div class="box"><h2>🔒 ' + esc(stu.name) + (first ? " · 나만의 번호 정하기" : " · 내 번호") + '</h2><p class="sub">' + (first ? "숫자 4자리를 정해요. TEST(시험)·과제에서도 같은 번호를 써요." : "TEST(시험) 볼 때 쓰는 숫자 4자리예요.") + "</p>" +
        '<div class="ans"><input id="p1" type="password" inputmode="numeric" maxlength="4" placeholder="숫자 4자리"></div>' + (first ? '<div class="ans" style="margin-top:8px"><input id="p2" type="password" inputmode="numeric" maxlength="4" placeholder="한 번 더"></div>' : "") +
        '<p class="err" id="er"></p><div class="row"><button class="btn" id="go">확인</button><button class="btn ghost" id="bk3">이름 다시 고르기</button></div></div>';
      var p1 = document.getElementById("p1"), p2 = document.getElementById("p2"), er = document.getElementById("er"), go = document.getElementById("go"); p1.focus();
      document.getElementById("bk3").onclick = function () { name(c); };
      go.onclick = function () {
        if (!/^\d{4}$/.test(p1.value)) { er.textContent = "숫자 4자리를 넣어 주세요."; return; }
        if (p2 && p1.value !== p2.value) { er.textContent = "두 번호가 달라요."; return; }
        go.disabled = true; er.textContent = "";
        post({ action: "login", id: stu.id, pin: p1.value, setPin: first, game: true }).then(function (j) {
          go.disabled = false;
          if (j.needSet) { stu.hasPin = false; pin(c, stu); return; }
          if (!j.gtoken) { er.textContent = j.msg || "확인하지 못했어요."; return; }
          ME = { gtoken: j.gtoken, name: j.name, cls: j.cls, exp: Date.now() + 29 * 864e5 }; lsSet("cm-vg-me", ME);
          if (PENDING) { var rec = PENDING; PENDING = null; app.innerHTML = '<div class="stage result"><div class="big">🏆</div><div class="rk" id="rk">기록하는 중…</div><div class="row" style="justify-content:center"><button class="btn" id="rkRank">랭킹 보기</button><button class="btn ghost" id="rkMenu">다른 게임</button></div></div>'; document.getElementById("rkRank").onclick = function () { ranking(); }; document.getElementById("rkMenu").onclick = function () { WORDS.length ? menu() : showBooks(); }; sendScore(rec); return; }
          back();
        });
      };
      p1.onkeydown = function (e) { if (e.key === "Enter") go.click(); };
    }
    cls();
  }
  var RK = { scope: "cls", period: "week" };
  function ranking() {
    GEN++; stopTimer();
    if (!ME) RK.scope = "all";
    var tabs = function (k, opts) { return opts.map(function (o) { return '<button class="rt' + (RK[k] === o[0] ? " on" : "") + '" data-' + k + '="' + o[0] + '"' + (k === "scope" && o[0] === "cls" && !ME ? " disabled" : "") + ">" + o[1] + "</button>"; }).join(""); };
    app.innerHTML = '<div class="box"><div class="crumb"><button id="rkBack">← 돌아가기</button></div><h2 style="margin-top:8px">🏆 단어 랭킹</h2>' +
      (ME ? '<p class="sub">👤 ' + esc(ME.name) + " · " + esc(ME.cls) + ' <button class="lnk" id="lo">내가 아니에요</button></p>' : '<p class="sub">로그인하면 우리 반 랭킹도 보고 내 점수도 쌓여요. <button class="lnk" id="li">로그인</button></p>') +
      '<div class="rtabs">' + tabs("scope", [["cls", "우리 반"], ["all", "학원 전체"]]) + '<span style="flex-basis:100%;height:0"></span>' + tabs("period", [["week", "이번 주"], ["month", "이번 달"]]) + "</div>" +
      '<div id="rkBody"><p class="sub" style="margin-top:12px">불러오는 중…</p></div>' +
      '<p class="sub" style="margin-top:14px;font-size:12.5px">포인트: 고르기 1점 · 철자·듣고 쓰기·문맥 고르기 2점 · 단어 카드 2장에 1점 · 짝 맞추기 짝 하나에 1점 · 60초 챌린지 맞힌 수만큼 (하루 최대 <span id="cap">300</span>점). 주간 랭킹은 매주 월요일에 새로 시작해요.</p></div>';
    document.getElementById("rkBack").onclick = function () { WORDS.length ? menu() : showBooks(); };
    var lo = document.getElementById("lo"); if (lo) lo.onclick = function () { ME = null; lsSet("cm-vg-me", null); ranking(); };
    var li = document.getElementById("li"); if (li) li.onclick = function () { login(ranking); };
    Array.prototype.forEach.call(app.querySelectorAll("[data-scope],[data-period]"), function (b) { b.onclick = function () { if (b.hasAttribute("data-scope")) RK.scope = b.getAttribute("data-scope"); else RK.period = b.getAttribute("data-period"); ranking(); }; });
    var g = GEN;
    post({ action: "g_rank", token: ME && ME.gtoken, scope: RK.scope, period: RK.period, cls: ME ? ME.cls : "" }).then(function (j) {
      var body = document.getElementById("rkBody"); if (!body || g !== GEN) return;
      if (!j.ok) { body.innerHTML = '<p class="err">' + esc(j.msg || "랭킹을 불러오지 못했어요.") + "</p>"; return; }
      document.getElementById("cap").textContent = j.cap;
      var medal = function (r) { return r === 1 ? "🥇" : r === 2 ? "🥈" : r === 3 ? "🥉" : r; };
      var table = function (list, mine, unit, empty) {
        if (!list.length) return '<p class="sub">' + empty + "</p>";
        var rows = list.map(function (x) { return '<tr class="' + (x.me ? "me" : "") + '"><td class="rn">' + medal(x.rank) + "</td><td>" + esc(x.name) + (x.cls ? ' <span class="x">' + esc(x.cls) + "</span>" : "") + '</td><td class="v">' + x.val + unit + "</td></tr>"; }).join("");
        if (mine && !list.some(function (x) { return x.me; })) rows += '<tr class="me"><td class="rn">' + mine.rank + "</td><td>" + esc(mine.name) + '</td><td class="v">' + mine.val + unit + "</td></tr>";
        return '<table class="rkt">' + rows + "</table>";
      };
      body.innerHTML = (ME ? '<div class="mine">' + (j.myPoints ? "내 순위 <b>" + j.myPoints.rank + "등</b> · " + j.myPoints.val + "점" : "아직 " + (RK.period === "week" ? "이번 주" : "이번 달") + " 기록이 없어요. 게임을 하면 점수가 쌓여요!") + (j.mySpeed ? " · ⚡ 최고 " + j.mySpeed.val + "개" : "") + "</div>" : "") +
        '<h3 class="rh">🏅 포인트 랭킹</h3>' + table(j.points, j.myPoints, "점", "아직 기록이 없어요. 첫 번째 주인공이 되어 보세요!") +
        '<h3 class="rh">⚡ 60초 챌린지 최고 기록</h3>' + table(j.speed, j.mySpeed, "개", "아직 60초 챌린지 기록이 없어요.");
    });
    window.scrollTo(0, 0);
  }

  start();
})();
</script>
</body>
</html>
