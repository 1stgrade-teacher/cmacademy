<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>과제 제출 - 청명학원 문화본원 +수업저장소</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="../style.css">
<style>
  .box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-top:14px}
  .box h2{font:700 18px var(--font);margin:0 0 10px;color:var(--ink)}
  .sub{color:var(--muted);font-size:14px;line-height:1.6;margin:0}
  .err{color:#A2342A;font-size:14px;margin:8px 0 0;line-height:1.5}
  .pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:10px}
  .pk{border:1.5px solid var(--border-strong);background:var(--card);border-radius:10px;padding:13px 8px;font:600 15px var(--font);color:var(--ink);cursor:pointer}
  .pk:hover{border-color:var(--accent);background:var(--accent-soft)}
  .btn{border:0;border-radius:10px;background:var(--accent);color:#fff;font:700 16px var(--font);padding:13px 18px;cursor:pointer}
  .btn[disabled]{opacity:.55}
  .btn.ghost{background:var(--accent-bg);color:var(--accent-ink)}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
  input.f,textarea.f{width:100%;box-sizing:border-box;padding:12px;border:1.5px solid var(--border-strong);border-radius:10px;font:500 16px var(--font)}
  .hw{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-top:10px;cursor:pointer}
  .hw:hover{border-color:var(--accent-light)}
  .hw .b{flex:1;min-width:0}.hw .t{font-weight:700;font-size:16px}.hw .m{font-size:13px;color:var(--muted);margin-top:3px}
  .tag{flex:0 0 auto;font:700 12.5px var(--font);padding:6px 10px;border-radius:8px;background:var(--accent-bg);color:var(--accent-ink)}
  .tag.ok{background:#DFF5E8;color:#1E7A45}.tag.late{background:#FFF1D6;color:#8A5A00}.tag.miss{background:#FDE3E1;color:#A2342A}.tag.past{background:#EEF1F3;color:var(--muted)}
  .who{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:14px;color:var(--muted)}
  .who button{border:0;background:none;color:var(--accent-ink);font:600 13.5px var(--font);text-decoration:underline;cursor:pointer}
  .desc{white-space:pre-wrap;background:#F7F9FA;border-radius:10px;padding:12px 14px;font-size:15px;line-height:1.6;margin-top:8px}
  .shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:12px}
  .shot{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#EEF1F3}
  .shot img{width:100%;height:100%;object-fit:cover;display:block}
  .shot button{position:absolute;top:4px;right:4px;border:0;border-radius:999px;width:28px;height:28px;background:rgba(0,0,0,.55);color:#fff;font-size:16px;cursor:pointer}
  .addshot{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;aspect-ratio:1;border:2px dashed var(--accent-light);border-radius:10px;color:var(--accent-ink);font:700 14px var(--font);cursor:pointer;background:var(--accent-soft)}
  .addshot span{font-size:28px}
  .done{text-align:center;padding:26px 18px}.done .big{font-size:46px}
  .seg{display:flex;gap:6px;margin-top:12px}.seg button{flex:1;border:1.5px solid var(--border-strong);background:var(--card);border-radius:10px;padding:10px;font:700 15px var(--font);color:var(--ink);cursor:pointer}.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .mnav{display:flex;align-items:center;justify-content:space-between;gap:8px}.mnav b{font-size:17px}.mnav button{border:0;background:var(--accent-bg);color:var(--accent-ink);border-radius:8px;padding:8px 12px;font:700 15px var(--font);cursor:pointer}
  .cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin-top:10px}
  .cal .wh{font-size:12px;font-weight:700;color:var(--muted);text-align:center}.cal .wh.su{color:#C0392B}
  .cal .cd{min-height:60px;border:1px solid var(--border);border-radius:8px;padding:3px;display:flex;flex-direction:column;gap:2px;cursor:pointer;min-width:0;background:var(--card)}
  .cal .cd.td{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}.cal .cd.sel{background:var(--accent-soft)}
  .cal .dn{font-size:12px;font-weight:700;color:var(--muted)}.cal .su .dn{color:#C0392B}
  .ch{font-size:10.5px;line-height:1.2;padding:1px 3px;border-radius:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:keep-all;overflow-wrap:anywhere}
  .ch.go{background:#E3F0FF;color:#1F5FA8}.ch.ok{background:#DFF5E8;color:#1E7A45}.ch.late{background:#FFF1D6;color:#8A5A00}.ch.miss{background:#FDE3E1;color:#A2342A}.ch.lock{background:#EEF1F3;color:#6B7883}
  .ch.more{background:none;color:var(--muted);padding:0 3px}
  .ch.ev{background:#EDE6FF;color:#4F35A0;font-weight:700}.ch.ev.off{background:#EEF1F3;color:#5F6B72}
  .evs{background:#F6F2FF;border:1px solid #DDD2FB;border-radius:var(--radius);padding:12px 16px;margin-top:14px}
  .evs h3{margin:0 0 6px;font-size:15px;color:#4F35A0}
  .ev1{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px dashed #DDD2FB}.ev1:first-of-type{border-top:0}
  .ev1 .d{min-width:62px;font-weight:800;color:#4F35A0;font-size:14px}.ev1 .t{flex:1;font-size:14.5px;line-height:1.45}.ev1 .r{display:block;color:var(--muted);font-size:13px}
  .ev1 .dd{font-size:12px;font-weight:800;color:#fff;background:#7A5AF8;border-radius:999px;padding:2px 8px;white-space:nowrap}.ev1 .dd.t0{background:#E5484D}
  .lg{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.lg .ch{display:inline-block;font-size:12px;padding:2px 6px}
  .hw.lock{cursor:default;background:#F7F9FA}.hw.lock .t{color:var(--muted)}.tag.lock{background:#EEF1F3;color:#6B7883}
  .dq .dqh{display:flex;align-items:center;gap:10px;margin-bottom:6px}.dq audio{flex:1;min-width:0;height:40px}
  .dl{font-size:16.5px;line-height:2.2;margin:2px 0}
  input.bl{border:0;border-bottom:2px solid var(--accent);background:var(--accent-soft);border-radius:4px 4px 0 0;padding:2px 4px;font:600 16px var(--font);color:var(--ink);text-align:center;max-width:60vw}
  input.bl.ok{border-color:#1E7A45;background:#DFF5E8}input.bl.no{border-color:#A2342A;background:#FDE3E1;text-decoration:line-through}
  .fix{color:#1E7A45;font-weight:800;margin-left:4px}
</style>
</head>
<body>
<div class="topbar">
  <a class="back" href="../index.html">&larr; 홈</a>
  <span class="brand" style="margin-left:auto;"><span class="spark">✳</span>청명학원 문화본원 +수업저장소</span>
</div>
<div class="wrap">
  <p class="breadcrumb"><a href="../index.html">홈</a><span class="sep">/</span>과제 제출</p>
  <div class="hero" style="padding-bottom:6px"><div class="hero-text"><h1>📸 과제 제출</h1><p>과제를 하고 사진을 찍어 올려요. 마감 시간을 꼭 지켜요!</p></div></div>
  <div id="app"><div class="box"><p class="sub">불러오는 중…</p></div></div>
  <footer>&copy; 2026 청명학원 문화본원 +수업저장소</footer>
</div>
<script>
(function () {
  var API = "/api/monthly", app = document.getElementById("app");
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  function post(b) {
    return fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(b) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { j._s = r.status; return j; }); })
      .catch(function () { return { _s: 0, msg: "인터넷 연결을 확인해 주세요." }; });
  }
  var ss = { get: function (k) { try { return JSON.parse(sessionStorage.getItem(k) || "null"); } catch (e) { return null; } }, set: function (k, v) { try { sessionStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }, del: function (k) { try { sessionStorage.removeItem(k); } catch (e) {} } };
  var qs = new URLSearchParams(location.search), CLS = qs.get("c") || "";
  var ME = ss.get("cm-monthly-me"); if (ME && ME.exp < Date.now()) ME = null; // TEST 관리와 같은 본인 확인 (이 탭에서만 기억)
  function logout() { ss.del("cm-monthly-me"); ME = null; }

  // ================= 본인 확인 =================
  function stepCls(note) {
    app.innerHTML = '<div class="box"><h2>👋 내 반을 골라요</h2>' + (note ? '<p class="err">' + esc(note) + "</p>" : "") + '<div class="pick" id="pk"><span class="sub">불러오는 중…</span></div></div>';
    post({ action: "classes" }).then(function (j) {
      var pk = document.getElementById("pk"); if (!j.classes) { pk.innerHTML = '<span class="err">' + esc(j.msg || "반 목록을 불러오지 못했어요.") + "</span>"; return; }
      pk.innerHTML = j.classes.map(function (c, i) { return '<button class="pk" data-i="' + i + '">' + esc(c) + "</button>"; }).join("");
      Array.prototype.forEach.call(pk.children, function (b) { b.onclick = function () { CLS = j.classes[+b.getAttribute("data-i")]; stepName(); }; });
    });
  }
  function stepName() {
    app.innerHTML = '<div class="box"><h2>' + esc(CLS) + " · 내 이름을 눌러요</h2>" + '<div class="pick" id="pk"><span class="sub">명단을 불러오는 중…</span></div><div class="row"><button class="btn ghost" id="bk">반 다시 고르기</button></div></div>';
    document.getElementById("bk").onclick = function () { stepCls(); };
    post({ action: "roster", cls: CLS }).then(function (j) {
      var pk = document.getElementById("pk"); if (!j.students) { pk.innerHTML = '<span class="err">' + esc(j.msg || "명단을 불러오지 못했어요.") + "</span>"; return; }
      if (!j.students.length) { pk.innerHTML = '<span class="sub">명단이 비어 있어요. 선생님께 알려 주세요.</span>'; return; }
      pk.innerHTML = j.students.map(function (s, i) { return '<button class="pk" data-i="' + i + '">' + esc(s.name) + "</button>"; }).join("");
      Array.prototype.forEach.call(pk.children, function (b) { b.onclick = function () { stepPin(j.students[+b.getAttribute("data-i")]); }; });
    });
  }
  function stepPin(stu) {
    var first = !stu.hasPin;
    app.innerHTML = '<div class="box"><h2>🔒 ' + esc(stu.name) + (first ? " · 나만의 번호 정하기" : " · 내 번호") + "</h2>" +
      '<p class="sub">' + (first ? "숫자 4자리를 정해요. TEST(시험)에서도 같은 번호를 써요." : "TEST(시험) 볼 때 쓰는 숫자 4자리예요.") + "</p>" +
      '<input class="f" id="p1" type="password" inputmode="numeric" maxlength="4" style="margin-top:12px" placeholder="숫자 4자리">' + (first ? '<input class="f" id="p2" type="password" inputmode="numeric" maxlength="4" style="margin-top:8px" placeholder="한 번 더">' : "") +
      '<p class="err" id="er"></p><div class="row"><button class="btn" id="go">확인</button><button class="btn ghost" id="bk">이름 다시 고르기</button></div></div>';
    var p1 = document.getElementById("p1"), p2 = document.getElementById("p2"), er = document.getElementById("er"), go = document.getElementById("go"); p1.focus();
    document.getElementById("bk").onclick = stepName;
    go.onclick = function () {
      if (!/^\d{4}$/.test(p1.value)) { er.textContent = "숫자 4자리를 넣어 주세요."; return; }
      if (p2 && p1.value !== p2.value) { er.textContent = "두 번호가 달라요."; return; }
      go.disabled = true; er.textContent = "";
      post({ action: "login", id: stu.id, pin: p1.value, setPin: first }).then(function (j) {
        go.disabled = false;
        if (j.needSet) { stu.hasPin = false; stepPin(stu); return; }
        if (!j.token) { er.textContent = j.msg || "확인하지 못했어요."; return; }
        ME = { token: j.token, name: j.name, cls: j.cls, exp: Date.now() + 3.8 * 3600 * 1000 }; ss.set("cm-monthly-me", ME); showMain();
      });
    };
    p1.onkeydown = function (e) { if (e.key === "Enter") go.click(); };
  }

  // ================= 과제 목록 =================
  var LIST = [];
  function whoBar() { return '<div class="who">👤 ' + esc(ME.name) + " · " + esc(ME.cls) + ' <button id="notme">내가 아니에요</button></div>'; }
  function bindWho() { var b = document.getElementById("notme"); if (b) b.onclick = function () { logout(); stepCls(); }; }
  function tagOf(h) {
    if (h.status === "제출") return '<span class="tag ok">✓ 제출함</span>';
    if (h.status === "지각 제출") return '<span class="tag late">늦게 제출함</span>';
    if (h.past) return '<span class="tag miss">미제출 · 지금 내기</span>';
    return '<span class="tag">내러 가기 →</span>';
  }
  function left(due) {
    var ms = Date.parse(due + ":00+09:00") - Date.now(); if (ms <= 0) return "마감 지남";
    var h = Math.floor(ms / 3600e3), d = Math.floor(h / 24);
    return d >= 1 ? d + "일 " + (h % 24) + "시간 남음" : h >= 1 ? h + "시간 " + Math.floor(ms / 60000) % 60 + "분 남음" : Math.max(1, Math.floor(ms / 60000)) + "분 남음 ⏰";
  }
  // 📋 목록 / 🗓 달력 (고른 쪽을 이 기기에서 기억)
  var VIEW = (function () { try { return localStorage.getItem("cm-hw-view") === "cal" ? "cal" : "list"; } catch (e) { return "list"; } })();
  function viewBar() { return '<div class="seg"><button data-v="list"' + (VIEW === "list" ? ' class="on"' : "") + '>📋 목록</button><button data-v="cal"' + (VIEW === "cal" ? ' class="on"' : "") + ">🗓 달력</button></div>"; }
  function bindView() { Array.prototype.forEach.call(app.querySelectorAll(".seg button"), function (b) { b.onclick = function () { VIEW = b.getAttribute("data-v"); try { localStorage.setItem("cm-hw-view", VIEW); } catch (e) {} showMain(); }; }); }
  function showMain() { if (VIEW === "cal") showCal(); else showList(); }
  // 📅 반 일정 (선생님이 미리 넣어 둔 단어시험·평가·휴원 …)
  var EVI = { "단어시험": "📝", "단어 외우기": "📖", "듣기시험": "🎧", "주간평가": "🧪", "월간평가": "📊", "분기평가": "🏆", "행사": "🎉", "휴원": "🏖️", "기타": "📌" };
  function evName(e) { return (EVI[e.kind] || "📌") + " " + e.title; }
  // 달력 칸은 좁아서 짧게: "워드마스터 Day 2~3 단어시험" → "단어 Day 2~3"
  function evShort(e) {
    var m = /(Day|DAY|day|Unit|UNIT|unit|Lesson|Chapter|L)\s*\d+(\s*[~\-]\s*\d+)?/.exec(e.title + " " + (e.range || "")), ks = { "단어시험": "단어", "단어 외우기": "외우기", "듣기시험": "듣기", "주간평가": "주간", "월간평가": "월간", "분기평가": "분기" }[e.kind];
    return m && ks ? ks + " " + m[0].replace(/\s+/g, " ") : e.title;
  }
  function dday(day) { var n = Math.round((Date.parse(day + "T00:00:00Z") - Date.parse(today() + "T00:00:00Z")) / 864e5); return n === 0 ? "오늘" : n > 0 ? "D-" + n : ""; }
  function evRow(e, withDate) {
    var dd = dday(e.date);
    return '<div class="ev1">' + (withDate ? '<span class="d">' + md(e.date) + "(" + WD[new Date(e.date + "T00:00:00Z").getUTCDay()] + ")</span>" : "") + '<span class="t"><b>' + esc(evName(e)) + "</b>" + (e.range && e.title.indexOf(e.range) < 0 ? '<span class="r">범위: ' + esc(e.range) + "</span>" : "") + (e.memo ? '<span class="r">' + esc(e.memo) + "</span>" : "") + "</span>" + (dd ? '<span class="dd' + (dd === "오늘" ? " t0" : "") + '">' + dd + "</span>" : "") + "</div>";
  }
  function upcomingBox(L) { return L && L.length ? '<div class="evs"><h3>📅 다가오는 일정 <span style="font-weight:500;color:var(--muted);font-size:12.5px">3주 · 더 뒤의 일정은 🗓 달력에서</span></h3>' + L.map(function (e) { return evRow(e, true); }).join("") + "</div>" : ""; }
  function hwRow(h, i, key) {
    if (h.hidden) return '<div class="hw lock"><div class="b"><div class="t">🔒 ' + esc(h.title) + '</div><div class="m">마감 ' + esc(h.dueLabel) + "</div></div>" + '<span class="tag lock">' + esc(md(h.show)) + "에 열려요</span></div>";
    return '<div class="hw" data-' + key + '="' + i + '"><div class="b"><div class="t">' + (h.only ? '<span style="display:inline-block;background:#FFF1D6;color:#8A5300;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:800;margin-right:5px;vertical-align:2px">⭐ 나만의 추가과제</span>' : "") + esc(h.title) + '</div><div class="m">마감 ' + esc(h.dueLabel) + " · " + (h.dict ? "🎧 받아쓰기 · " : "") + (h.status ? esc(h.status) + (h.score ? " " + esc(h.score) : h.n ? " (사진 " + h.n + "장)" : "") : esc(left(h.due))) + "</div></div>" + tagOf(h) + "</div>";
  }
  function showList() {
    app.innerHTML = whoBar() + viewBar() + '<div class="box"><p class="sub">과제를 불러오는 중…</p></div>'; bindWho(); bindView();
    post({ action: "s_hw_list", token: ME.token }).then(function (j) {
      if (VIEW !== "list") return;
      if (j.relogin) { logout(); stepCls(j.msg); return; }
      if (!j.ok) { app.innerHTML = whoBar() + viewBar() + '<div class="box"><p class="err">' + esc(j.msg || "과제 목록을 불러오지 못했어요.") + "</p></div>"; bindWho(); bindView(); return; }
      LIST = j.list;
      app.innerHTML = whoBar() + viewBar() + upcomingBox(j.sched) + (LIST.length ? LIST.map(function (h, i) { return hwRow(h, i, "i"); }).join("") : '<div class="box"><p class="sub">지금 낼 과제가 없어요. 선생님이 과제를 내면 여기에 나와요. 앞으로 나올 과제는 🗓 달력에서 볼 수 있어요.</p></div>');
      bindWho(); bindView();
      Array.prototype.forEach.call(app.querySelectorAll(".hw[data-i]"), function (el) { el.onclick = function () { openHw(LIST[+el.getAttribute("data-i")]); }; });
    });
  }

  // ================= 🗓 달력 =================
  var WD = "일월화수목금토", pad = function (n) { return ("0" + n).slice(-2); };
  var today = function () { return new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10); };
  var CAL = { ym: "", list: [], sched: [], sel: "" };
  function md(s) { return s ? Number(s.slice(5, 7)) + "/" + Number(s.slice(8, 10)) : ""; }
  function chOf(h) { return h.hidden ? "lock" : h.status === "제출" ? "ok" : h.status === "지각 제출" ? "late" : h.past ? "miss" : "go"; }
  function showCal(shift) {
    if (!CAL.ym) { CAL.ym = today().slice(0, 7); CAL.sel = today(); CAL.auto = true; }
    if (shift) { var y = +CAL.ym.slice(0, 4), m = +CAL.ym.slice(5, 7) - 1 + shift; CAL.ym = new Date(Date.UTC(y, m, 1)).toISOString().slice(0, 7); CAL.sel = CAL.ym === today().slice(0, 7) ? today() : CAL.ym + "-01"; CAL.auto = true; }
    var ym = CAL.ym;
    app.innerHTML = whoBar() + viewBar() + '<div class="box"><div class="mnav"><button id="cp" aria-label="지난달">◀</button><b>' + ym.slice(0, 4) + "년 " + Number(ym.slice(5, 7)) + '월</b><button id="cn" aria-label="다음 달">▶</button></div><div id="calg"><p class="sub" style="margin-top:10px">달력을 불러오는 중…</p></div></div><div id="dayl"></div>';
    bindWho(); bindView();
    document.getElementById("cp").onclick = function () { showCal(-1); }; document.getElementById("cn").onclick = function () { showCal(1); };
    post({ action: "s_hw_cal", token: ME.token, ym: ym }).then(function (j) {
      if (VIEW !== "cal" || ym !== CAL.ym) return;
      if (j.relogin) { logout(); stepCls(j.msg); return; }
      if (!j.ok) { document.getElementById("calg").innerHTML = '<p class="err">' + esc(j.msg || "달력을 불러오지 못했어요.") + "</p>"; return; }
      CAL.list = j.list.slice().sort(function (a, b) { return a.due.localeCompare(b.due); });
      CAL.sched = (j.sched || []).slice().sort(function (a, b) { return a.date.localeCompare(b.date); });
      if (CAL.auto) { // 처음 열 때: 고른 날(오늘) 이후 과제나 일정이 있는 첫날을 보여 줘요
        var days = CAL.list.map(function (x) { return x.due.slice(0, 10); }).concat(CAL.sched.map(function (e) { return e.date; })).filter(function (d) { return d >= CAL.sel; }).sort();
        if (days[0]) CAL.sel = days[0]; CAL.auto = false;
      }
      drawCal();
    });
  }
  function drawCal() {
    var ym = CAL.ym, first = new Date(ym + "-01T00:00:00Z").getUTCDay(), n = new Date(Date.UTC(+ym.slice(0, 4), +ym.slice(5, 7), 0)).getUTCDate(), t = today(), h = "";
    for (var w = 0; w < 7; w++) h += '<div class="wh' + (w ? "" : " su") + '">' + WD[w] + "</div>";
    for (var b = 0; b < first; b++) h += "<div></div>";
    for (var d = 1; d <= n; d++) {
      var day = ym + "-" + pad(d), its = CAL.list.filter(function (x) { return x.due.slice(0, 10) === day; }), evs = CAL.sched.filter(function (e) { return e.date === day; });
      var chips = evs.map(function (e) { return '<span class="ch ev' + (e.kind === "휴원" ? " off" : "") + '" title="' + esc(evName(e)) + '">' + esc(evShort(e)) + "</span>"; }).concat(its.map(function (x) { return '<span class="ch ' + chOf(x) + '">' + esc(x.title) + "</span>"; }));
      h += '<div class="cd' + (day === t ? " td" : "") + (day === CAL.sel ? " sel" : "") + ((first + d - 1) % 7 === 0 ? " su" : "") + '" data-day="' + day + '"><span class="dn">' + d + "</span>" +
        chips.slice(0, 2).join("") + (chips.length > 2 ? '<span class="ch more">+' + (chips.length - 2) + "</span>" : "") + "</div>";
    }
    document.getElementById("calg").innerHTML = '<div class="cal">' + h + '</div><div class="lg"><span class="ch go">낼 과제</span><span class="ch ok">제출함</span><span class="ch late">늦게 냄</span><span class="ch miss">미제출</span><span class="ch lock">🔒 아직 안 열림</span><span class="ch ev">📅 일정</span></div>';
    Array.prototype.forEach.call(document.querySelectorAll("#calg .cd"), function (c) { c.onclick = function () { CAL.sel = c.getAttribute("data-day"); CAL.auto = false; drawCal(); }; });
    drawDay();
  }
  function drawDay() {
    var day = CAL.sel, its = CAL.list.filter(function (x) { return x.due.slice(0, 10) === day; }), evs = CAL.sched.filter(function (e) { return e.date === day; }), el = document.getElementById("dayl");
    if (!el) return;
    el.innerHTML = (evs.length ? '<div class="evs"><h3>📅 ' + md(day) + "(" + WD[new Date(day + "T00:00:00Z").getUTCDay()] + ") 일정</h3>" + evs.map(function (e) { return evRow(e, false); }).join("") + "</div>" : "") +
      '<div class="box" style="padding:12px 16px"><h2 style="margin:0">' + md(day) + "(" + WD[new Date(day + "T00:00:00Z").getUTCDay()] + ") 마감 과제</h2>" + (its.length ? "" : '<p class="sub" style="margin-top:6px">이날 마감인 과제가 없어요.</p>') + "</div>" + its.map(function (x, i) { return hwRow(x, i, "k"); }).join("") +
      (its.some(function (x) { return x.hidden; }) ? '<p class="sub" style="margin-top:8px">🔒 과제는 열리는 날부터 설명을 보고 낼 수 있어요.</p>' : "");
    Array.prototype.forEach.call(el.querySelectorAll(".hw[data-k]"), function (r) { r.onclick = function () { openHw(its[+r.getAttribute("data-k")]); }; });
  }

  // ================= 🎧 받아쓰기 숙제 =================
  function openHw(h) { if (h.dict) showDict(h); else showHw(h); }
  function showDict(h) {
    app.innerHTML = whoBar() + '<div class="box"><p class="sub">받아쓰기를 불러오는 중…</p></div>'; bindWho();
    post({ action: "s_dict", token: ME.token, id: h.id }).then(function (j) {
      if (j.relogin) { logout(); stepCls(j.msg); return; }
      if (!j.ok) { app.innerHTML = whoBar() + '<div class="box"><p class="err">' + esc(j.msg || "불러오지 못했어요.") + '</p><div class="row"><button class="btn ghost" id="bk">← 돌아가기</button></div></div>'; bindWho(); document.getElementById("bk").onclick = showMain; return; }
      var done = h.status === "제출" || h.status === "지각 제출", draftKey = "cm-dict:" + h.id, draft = (function () { try { return JSON.parse(localStorage.getItem(draftKey) || "{}"); } catch (e) { return {}; } })();
      var html = whoBar() + '<div class="box"><h2>' + (/^🎧/.test(j.title) ? "" : "🎧 ") + esc(j.title) + '</h2><p class="sub">마감 <b>' + esc(j.dueLabel) + "</b> · " + esc(left(j.due)) + " · 빈칸 " + j.blanks + "개</p>" + (j.desc ? '<div class="desc">' + esc(j.desc) + "</div>" : "") +
        '<p class="sub" style="margin-top:8px">▶ 음성을 들으며 빈칸에 들리는 단어를 써요. 몇 번이든 다시 들어도 돼요. 대문자·마침표는 신경 쓰지 않아도 돼요.' + (done ? "<br><b>이미 냈어요 (" + esc(h.score || "") + ").</b> 다시 풀면 연습이고, 기록은 처음 낸 점수예요." : "") + (j.past && !done ? '</p><p class="err">마감이 지났어요. 지금 내면 「늦게 제출」로 기록돼요.' : "") + "</p></div>";
      j.items.forEach(function (it) {
        html += '<div class="box dq"><div class="dqh"><b>' + it.n + '번</b>' + (it.audio ? '<audio controls preload="none" controlsList="nodownload" src="' + esc(it.audio) + '"></audio>' : "") + "</div>" + it.lines.map(function (l) {
          return '<p class="dl">' + (l.sp ? "<b>" + esc(l.sp) + ":</b> " : "") + l.parts.map(function (p) {
            if (typeof p === "string") return esc(p);
            return esc(p.pre) + '<input class="bl" data-b="' + p.b + '" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" style="width:' + Math.max(4.2, Math.min(12, p.len * 0.72 + 1.6)) + 'em" value="' + esc(draft[p.b] || "") + '" aria-label="빈칸 ' + (p.b + 1) + '">' + esc(p.post);
          }).join("") + "</p>";
        }).join("") + "</div>";
      });
      html += '<p class="err" id="er"></p><div class="row"><button class="btn" id="send">' + (done ? "다시 풀고 채점하기 (연습)" : "제출하고 채점하기") + '</button><button class="btn ghost" id="bk">← 돌아가기</button></div>';
      app.innerHTML = html; bindWho();
      Array.prototype.forEach.call(app.querySelectorAll(".dq audio"), function (a) { a.addEventListener("play", function () { Array.prototype.forEach.call(app.querySelectorAll(".dq audio"), function (o) { if (o !== a) o.pause(); }); }); });
      var ins = Array.prototype.slice.call(app.querySelectorAll("input.bl"));
      ins.forEach(function (x, i) {
        x.oninput = function () { draft[x.getAttribute("data-b")] = x.value; try { localStorage.setItem(draftKey, JSON.stringify(draft)); } catch (e) {} };
        x.onkeydown = function (e) { if (e.key === "Enter") { e.preventDefault(); if (ins[i + 1]) ins[i + 1].focus(); } };
      });
      document.getElementById("bk").onclick = showMain;
      document.getElementById("send").onclick = function () {
        var b = this, ans = []; ins.forEach(function (x) { ans[+x.getAttribute("data-b")] = x.value; });
        var empty = ans.filter(function (x) { return !String(x || "").trim(); }).length;
        if (empty && !confirm("빈칸 " + empty + "개를 아직 안 썼어요. 그래도 낼까요?")) return;
        b.disabled = true; b.textContent = "채점하는 중…";
        post({ action: "s_dict_submit", token: ME.token, id: h.id, answers: ans }).then(function (r) {
          if (r.relogin) { logout(); stepCls(r.msg); return; }
          if (!r.ok) { b.disabled = false; b.textContent = "다시 제출하기"; document.getElementById("er").textContent = r.msg || "제출하지 못했어요."; return; }
          try { localStorage.removeItem(draftKey); } catch (e) {}
          ins.forEach(function (x) { var k = +x.getAttribute("data-b"), ok = r.res[k]; x.readOnly = true; x.classList.add(ok ? "ok" : "no"); if (!ok) { var c = document.createElement("span"); c.className = "fix"; c.textContent = r.key[k]; x.insertAdjacentElement("afterend", c); } });
          var top = document.createElement("div"); top.className = "box done";
          top.innerHTML = '<div class="big">' + (r.pct >= 80 ? "🎉" : r.pct >= 50 ? "🙂" : "💪") + "</div><h2>" + r.right + " / " + r.total + " (" + r.pct + "%)</h2>" + '<p class="sub">' + (r.practice ? "연습으로 채점했어요. 기록은 처음 낸 점수(" + esc(r.first) + ")예요." : r.late ? "늦었지만 제출했어요. 선생님께 기록이 전해졌어요." : "제출 완료! 선생님께 기록이 전해졌어요.") + "<br>틀린 빈칸 옆 초록 글씨가 정답이에요. 음성을 다시 들으며 확인해 보세요.</p>";
          app.insertBefore(top, app.children[1]); window.scrollTo(0, 0);
          b.textContent = "과제로 돌아가기"; b.disabled = false; b.onclick = showMain;
        });
      };
    });
  }

  // ================= 사진 올리기 =================
  // 휴대폰 사진은 커서 가로·세로 1600px, JPEG로 줄여서 올려요 (보통 300~600KB)
  function shrink(file) {
    return new Promise(function (ok, no) {
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        var k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement("canvas");
        c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
        c.toBlob(function (b) { b ? ok(b) : no(new Error("사진을 줄이지 못했어요")); }, "image/jpeg", 0.82);
      };
      img.onerror = function () { URL.revokeObjectURL(url); /(jpe?g|png|webp)$/i.test(file.type) && file.size < 3.4e6 ? ok(file) : no(new Error("이 사진 형식은 열 수 없어요. 카메라 설정을 '높은 호환성'으로 하거나 화면을 캡처해서 올려 주세요.")); };
      img.src = url;
    });
  }
  var MAXSHOT = 100; // 노션 한 칸에 넣을 수 있는 최대 개수
  function b64(blob) { return new Promise(function (ok) { var r = new FileReader(); r.onload = function () { ok(String(r.result).split(",")[1]); }; r.readAsDataURL(blob); }); }
  function showHw(h) {
    var shots = [];
    var again = h.status === "제출" || h.status === "지각 제출";
    app.innerHTML = whoBar() + '<div class="box"><h2>' + esc(h.title) + "</h2>" +
      '<p class="sub">마감 <b>' + esc(h.dueLabel) + "</b> · " + esc(left(h.due)) + "</p>" + (h.desc ? '<div class="desc">' + esc(h.desc) + "</div>" : "") +
      (again ? '<p class="sub" style="margin-top:10px">✓ 이미 냈어요' + (h.at ? " (" + esc(h.at.slice(5, 16).replace("T", " ")) + ")" : "") + '. <b>다시 내면 사진이 새로 바뀌어요.</b></p>' : "") +
      (h.past ? '<p class="err">마감이 지났어요. 지금 내면 「늦게 제출」로 기록돼요.</p>' : "") +
      '<div class="shots" id="shots"></div><input type="file" id="pick" accept="image/*" multiple style="display:none">' +
      '<textarea class="f" id="memo" rows="2" style="margin-top:12px" placeholder="선생님께 한마디 (안 써도 돼요)"></textarea>' +
      '<p class="err" id="er"></p><div class="row"><button class="btn" id="send" disabled>사진 제출하기</button><button class="btn ghost" id="bk">← 돌아가기</button></div></div>';
    bindWho();
    var box = document.getElementById("shots"), pick = document.getElementById("pick"), er = document.getElementById("er"), send = document.getElementById("send");
    function draw() {
      box.innerHTML = shots.map(function (s, i) { return '<div class="shot"><img src="' + s.url + '" alt="사진 ' + (i + 1) + '"><button data-x="' + i + '" aria-label="빼기">×</button></div>'; }).join("") + (shots.length < MAXSHOT ? '<label class="addshot" for="pick"><span>📷</span>' + (shots.length ? "더 찍기" : "사진 찍기·고르기") + "</label>" : "");
      Array.prototype.forEach.call(box.querySelectorAll("[data-x]"), function (b) { b.onclick = function () { shots.splice(+b.getAttribute("data-x"), 1); draw(); }; });
      send.disabled = !shots.length;
    }
    draw();
    pick.onchange = function () {
      var files = Array.prototype.slice.call(pick.files || []).slice(0, MAXSHOT - shots.length); pick.value = ""; er.textContent = ""; if ((pick.files || []).length > files.length) er.textContent = "사진은 한 번에 " + MAXSHOT + "장까지 낼 수 있어요.";
      (function next() {
        if (!files.length) { draw(); return; }
        var f = files.shift();
        shrink(f).then(function (blob) { shots.push({ blob: blob, url: URL.createObjectURL(blob) }); draw(); next(); }, function (e) { er.textContent = e.message; next(); });
      })();
    };
    document.getElementById("bk").onclick = showMain;
    send.onclick = function () {
      if (!shots.length) return;
      send.disabled = true; er.textContent = "";
      // 사진은 3장씩 함께 올려요. 이미 올린 사진은 다시 누를 때 건너뛰어요. (순서는 그대로)
      var todo = shots.filter(function (s) { return !s.fid; }), done = shots.length - todo.length, stop = false, run = 0;
      function finish() {
        send.textContent = "제출하는 중…";
        post({ action: "s_hw_submit", token: ME.token, id: h.id, files: shots.map(function (s) { return { fid: s.fid, name: s.name }; }), memo: document.getElementById("memo").value }).then(function (j) {
          if (j.relogin) { logout(); stepCls(j.msg); return; }
          if (!j.ok) { send.disabled = false; send.textContent = "다시 제출하기"; er.textContent = j.msg || "제출하지 못했어요."; return; }
          app.innerHTML = whoBar() + '<div class="box done"><div class="big">' + (j.late ? "🙂" : "🎉") + "</div><h2>" + (j.late ? "늦었지만 제출했어요" : "제출 완료!") + '</h2><p class="sub">「' + esc(h.title) + "」 사진 " + j.n + "장을 선생님께 보냈어요." + (j.late ? "<br>다음엔 마감 전에 내요!" : "") + '</p><div class="row" style="justify-content:center"><button class="btn" id="bk2">과제로 돌아가기</button></div></div>';
          bindWho(); document.getElementById("bk2").onclick = showMain;
        });
      }
      function fail(msg) { if (stop) return; stop = true; send.disabled = false; send.textContent = "다시 제출하기 (올라간 " + done + "장은 그대로)"; er.textContent = msg || "사진을 올리지 못했어요."; }
      function one(s, tries) {
        return b64(s.blob).then(function (data) { return post({ action: "s_hw_upload", token: ME.token, name: "hw" + (shots.indexOf(s) + 1) + ".jpg", type: s.blob.type || "image/jpeg", b64: data }); })
          .then(function (j) { if (!j.ok && !j.relogin && tries < 2) return one(s, tries + 1); return j; });
      }
      function pump() {
        if (stop) return;
        if (!todo.length && !run) { finish(); return; }
        while (run < 3 && todo.length) (function (s) {
          run++;
          one(s, 1).then(function (j) {
            run--;
            if (j.relogin) { stop = true; logout(); stepCls(j.msg); return; }
            if (!j.ok) { fail(j.msg); return; }
            s.fid = j.fid; s.name = j.name; done++; if (!stop) send.textContent = "사진 올리는 중… (" + done + "/" + shots.length + ")"; pump();
          });
        })(todo.shift());
      }
      send.textContent = "사진 올리는 중… (" + done + "/" + shots.length + ")"; pump();
    };
  }

  if (ME && (!CLS || ME.cls === CLS)) showMain(); else { if (ME) logout(); if (CLS) stepName(); else stepCls(); }
})();
</script>
</body>
</html>
