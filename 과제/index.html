<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>과제 제출 - 청명학원 문화본원 +수업저장소</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="../style.css">
<style>
  .box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-top:14px}
  .box h2{font:700 18px var(--font);margin:0 0 10px;color:var(--ink)}
  .sub{color:var(--muted);font-size:14px;line-height:1.6;margin:0}
  .err{color:#A2342A;font-size:14px;margin:8px 0 0;line-height:1.5}
  .pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:10px}
  .pk{border:1.5px solid var(--border-strong);background:var(--card);border-radius:10px;padding:13px 8px;font:600 15px var(--font);color:var(--ink);cursor:pointer}
  .pk:hover{border-color:var(--accent);background:var(--accent-soft)}
  .btn{border:0;border-radius:10px;background:var(--accent);color:#fff;font:700 16px var(--font);padding:13px 18px;cursor:pointer}
  .btn[disabled]{opacity:.55}
  .btn.ghost{background:var(--accent-bg);color:var(--accent-ink)}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
  input.f,textarea.f{width:100%;box-sizing:border-box;padding:12px;border:1.5px solid var(--border-strong);border-radius:10px;font:500 16px var(--font)}
  .hw{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-top:10px;cursor:pointer}
  .hw:hover{border-color:var(--accent-light)}
  .hw .b{flex:1;min-width:0}.hw .t{font-weight:700;font-size:16px}.hw .m{font-size:13px;color:var(--muted);margin-top:3px}
  .tag{flex:0 0 auto;font:700 12.5px var(--font);padding:6px 10px;border-radius:8px;background:var(--accent-bg);color:var(--accent-ink)}
  .tag.ok{background:#DFF5E8;color:#1E7A45}.tag.late{background:#FFF1D6;color:#8A5A00}.tag.miss{background:#FDE3E1;color:#A2342A}.tag.past{background:#EEF1F3;color:var(--muted)}
  .who{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:14px;color:var(--muted)}
  .who button{border:0;background:none;color:var(--accent-ink);font:600 13.5px var(--font);text-decoration:underline;cursor:pointer}
  .desc{white-space:pre-wrap;background:#F7F9FA;border-radius:10px;padding:12px 14px;font-size:15px;line-height:1.6;margin-top:8px}
  .shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:12px}
  .shot{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#EEF1F3}
  .shot img{width:100%;height:100%;object-fit:cover;display:block}
  .shot button{position:absolute;top:4px;right:4px;border:0;border-radius:999px;width:28px;height:28px;background:rgba(0,0,0,.55);color:#fff;font-size:16px;cursor:pointer}
  .addshot{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;aspect-ratio:1;border:2px dashed var(--accent-light);border-radius:10px;color:var(--accent-ink);font:700 14px var(--font);cursor:pointer;background:var(--accent-soft)}
  .addshot span{font-size:28px}
  .done{text-align:center;padding:26px 18px}.done .big{font-size:46px}
</style>
</head>
<body>
<div class="topbar">
  <a class="back" href="../index.html">&larr; 홈</a>
  <span class="brand" style="margin-left:auto;"><span class="spark">✳</span>청명학원 문화본원 +수업저장소</span>
</div>
<div class="wrap">
  <p class="breadcrumb"><a href="../index.html">홈</a><span class="sep">/</span>과제 제출</p>
  <div class="hero" style="padding-bottom:6px"><div class="hero-text"><h1>📸 과제 제출</h1><p>과제를 하고 사진을 찍어 올려요. 마감 시간을 꼭 지켜요!</p></div></div>
  <div id="app"><div class="box"><p class="sub">불러오는 중…</p></div></div>
  <footer>&copy; 2026 청명학원 문화본원 +수업저장소</footer>
</div>
<script>
(function () {
  var API = "/api/monthly", app = document.getElementById("app");
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  function post(b) {
    return fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(b) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { j._s = r.status; return j; }); })
      .catch(function () { return { _s: 0, msg: "인터넷 연결을 확인해 주세요." }; });
  }
  var ss = { get: function (k) { try { return JSON.parse(sessionStorage.getItem(k) || "null"); } catch (e) { return null; } }, set: function (k, v) { try { sessionStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }, del: function (k) { try { sessionStorage.removeItem(k); } catch (e) {} } };
  var qs = new URLSearchParams(location.search), CLS = qs.get("c") || "";
  var ME = ss.get("cm-monthly-me"); if (ME && ME.exp < Date.now()) ME = null; // TEST 관리와 같은 본인 확인 (이 탭에서만 기억)
  function logout() { ss.del("cm-monthly-me"); ME = null; }

  // ================= 본인 확인 =================
  function stepCls(note) {
    app.innerHTML = '<div class="box"><h2>👋 내 반을 골라요</h2>' + (note ? '<p class="err">' + esc(note) + "</p>" : "") + '<div class="pick" id="pk"><span class="sub">불러오는 중…</span></div></div>';
    post({ action: "classes" }).then(function (j) {
      var pk = document.getElementById("pk"); if (!j.classes) { pk.innerHTML = '<span class="err">' + esc(j.msg || "반 목록을 불러오지 못했어요.") + "</span>"; return; }
      pk.innerHTML = j.classes.map(function (c, i) { return '<button class="pk" data-i="' + i + '">' + esc(c) + "</button>"; }).join("");
      Array.prototype.forEach.call(pk.children, function (b) { b.onclick = function () { CLS = j.classes[+b.getAttribute("data-i")]; stepName(); }; });
    });
  }
  function stepName() {
    app.innerHTML = '<div class="box"><h2>' + esc(CLS) + " · 내 이름을 눌러요</h2>" + '<div class="pick" id="pk"><span class="sub">명단을 불러오는 중…</span></div><div class="row"><button class="btn ghost" id="bk">반 다시 고르기</button></div></div>';
    document.getElementById("bk").onclick = function () { stepCls(); };
    post({ action: "roster", cls: CLS }).then(function (j) {
      var pk = document.getElementById("pk"); if (!j.students) { pk.innerHTML = '<span class="err">' + esc(j.msg || "명단을 불러오지 못했어요.") + "</span>"; return; }
      if (!j.students.length) { pk.innerHTML = '<span class="sub">명단이 비어 있어요. 선생님께 알려 주세요.</span>'; return; }
      pk.innerHTML = j.students.map(function (s, i) { return '<button class="pk" data-i="' + i + '">' + esc(s.name) + "</button>"; }).join("");
      Array.prototype.forEach.call(pk.children, function (b) { b.onclick = function () { stepPin(j.students[+b.getAttribute("data-i")]); }; });
    });
  }
  function stepPin(stu) {
    var first = !stu.hasPin;
    app.innerHTML = '<div class="box"><h2>🔒 ' + esc(stu.name) + (first ? " · 나만의 번호 정하기" : " · 내 번호") + "</h2>" +
      '<p class="sub">' + (first ? "숫자 4자리를 정해요. TEST(시험)에서도 같은 번호를 써요." : "TEST(시험) 볼 때 쓰는 숫자 4자리예요.") + "</p>" +
      '<input class="f" id="p1" type="password" inputmode="numeric" maxlength="4" style="margin-top:12px" placeholder="숫자 4자리">' + (first ? '<input class="f" id="p2" type="password" inputmode="numeric" maxlength="4" style="margin-top:8px" placeholder="한 번 더">' : "") +
      '<p class="err" id="er"></p><div class="row"><button class="btn" id="go">확인</button><button class="btn ghost" id="bk">이름 다시 고르기</button></div></div>';
    var p1 = document.getElementById("p1"), p2 = document.getElementById("p2"), er = document.getElementById("er"), go = document.getElementById("go"); p1.focus();
    document.getElementById("bk").onclick = stepName;
    go.onclick = function () {
      if (!/^\d{4}$/.test(p1.value)) { er.textContent = "숫자 4자리를 넣어 주세요."; return; }
      if (p2 && p1.value !== p2.value) { er.textContent = "두 번호가 달라요."; return; }
      go.disabled = true; er.textContent = "";
      post({ action: "login", id: stu.id, pin: p1.value, setPin: first }).then(function (j) {
        go.disabled = false;
        if (j.needSet) { stu.hasPin = false; stepPin(stu); return; }
        if (!j.token) { er.textContent = j.msg || "확인하지 못했어요."; return; }
        ME = { token: j.token, name: j.name, cls: j.cls, exp: Date.now() + 3.8 * 3600 * 1000 }; ss.set("cm-monthly-me", ME); showList();
      });
    };
    p1.onkeydown = function (e) { if (e.key === "Enter") go.click(); };
  }

  // ================= 과제 목록 =================
  var LIST = [];
  function whoBar() { return '<div class="who">👤 ' + esc(ME.name) + " · " + esc(ME.cls) + ' <button id="notme">내가 아니에요</button></div>'; }
  function bindWho() { var b = document.getElementById("notme"); if (b) b.onclick = function () { logout(); stepCls(); }; }
  function tagOf(h) {
    if (h.status === "제출") return '<span class="tag ok">✓ 제출함</span>';
    if (h.status === "지각 제출") return '<span class="tag late">늦게 제출함</span>';
    if (h.past) return '<span class="tag miss">미제출 · 지금 내기</span>';
    return '<span class="tag">내러 가기 →</span>';
  }
  function left(due) {
    var ms = Date.parse(due + ":00+09:00") - Date.now(); if (ms <= 0) return "마감 지남";
    var h = Math.floor(ms / 3600e3), d = Math.floor(h / 24);
    return d >= 1 ? d + "일 " + (h % 24) + "시간 남음" : h >= 1 ? h + "시간 " + Math.floor(ms / 60000) % 60 + "분 남음" : Math.max(1, Math.floor(ms / 60000)) + "분 남음 ⏰";
  }
  function showList() {
    app.innerHTML = whoBar() + '<div class="box"><p class="sub">과제를 불러오는 중…</p></div>'; bindWho();
    post({ action: "s_hw_list", token: ME.token }).then(function (j) {
      if (j.relogin) { logout(); stepCls(j.msg); return; }
      if (!j.ok) { app.innerHTML = whoBar() + '<div class="box"><p class="err">' + esc(j.msg || "과제 목록을 불러오지 못했어요.") + "</p></div>"; bindWho(); return; }
      LIST = j.list;
      app.innerHTML = whoBar() + (LIST.length ? LIST.map(function (h, i) {
        return '<div class="hw" data-i="' + i + '"><div class="b"><div class="t">' + esc(h.title) + '</div><div class="m">마감 ' + esc(h.dueLabel) + " · " + (h.status ? esc(h.status) + (h.n ? " (사진 " + h.n + "장)" : "") : esc(left(h.due))) + "</div></div>" + tagOf(h) + "</div>";
      }).join("") : '<div class="box"><p class="sub">지금 낼 과제가 없어요. 선생님이 과제를 내면 여기에 나와요.</p></div>');
      bindWho();
      Array.prototype.forEach.call(app.querySelectorAll(".hw"), function (el) { el.onclick = function () { showHw(LIST[+el.getAttribute("data-i")]); }; });
    });
  }

  // ================= 사진 올리기 =================
  // 휴대폰 사진은 커서 가로·세로 1600px, JPEG로 줄여서 올려요 (보통 300~600KB)
  function shrink(file) {
    return new Promise(function (ok, no) {
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        var k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement("canvas");
        c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
        c.toBlob(function (b) { b ? ok(b) : no(new Error("사진을 줄이지 못했어요")); }, "image/jpeg", 0.82);
      };
      img.onerror = function () { URL.revokeObjectURL(url); /(jpe?g|png|webp)$/i.test(file.type) && file.size < 3.4e6 ? ok(file) : no(new Error("이 사진 형식은 열 수 없어요. 카메라 설정을 '높은 호환성'으로 하거나 화면을 캡처해서 올려 주세요.")); };
      img.src = url;
    });
  }
  function b64(blob) { return new Promise(function (ok) { var r = new FileReader(); r.onload = function () { ok(String(r.result).split(",")[1]); }; r.readAsDataURL(blob); }); }
  function showHw(h) {
    var shots = [];
    var again = h.status === "제출" || h.status === "지각 제출";
    app.innerHTML = whoBar() + '<div class="box"><h2>' + esc(h.title) + "</h2>" +
      '<p class="sub">마감 <b>' + esc(h.dueLabel) + "</b> · " + esc(left(h.due)) + "</p>" + (h.desc ? '<div class="desc">' + esc(h.desc) + "</div>" : "") +
      (again ? '<p class="sub" style="margin-top:10px">✓ 이미 냈어요' + (h.at ? " (" + esc(h.at.slice(5, 16).replace("T", " ")) + ")" : "") + '. <b>다시 내면 사진이 새로 바뀌어요.</b></p>' : "") +
      (h.past ? '<p class="err">마감이 지났어요. 지금 내면 「늦게 제출」로 기록돼요.</p>' : "") +
      '<div class="shots" id="shots"></div><input type="file" id="pick" accept="image/*" multiple style="display:none">' +
      '<textarea class="f" id="memo" rows="2" style="margin-top:12px" placeholder="선생님께 한마디 (안 써도 돼요)"></textarea>' +
      '<p class="err" id="er"></p><div class="row"><button class="btn" id="send" disabled>사진 제출하기</button><button class="btn ghost" id="bk">목록으로</button></div></div>';
    bindWho();
    var box = document.getElementById("shots"), pick = document.getElementById("pick"), er = document.getElementById("er"), send = document.getElementById("send");
    function draw() {
      box.innerHTML = shots.map(function (s, i) { return '<div class="shot"><img src="' + s.url + '" alt="사진 ' + (i + 1) + '"><button data-x="' + i + '" aria-label="빼기">×</button></div>'; }).join("") + (shots.length < 5 ? '<label class="addshot" for="pick"><span>📷</span>' + (shots.length ? "더 찍기" : "사진 찍기·고르기") + "</label>" : "");
      Array.prototype.forEach.call(box.querySelectorAll("[data-x]"), function (b) { b.onclick = function () { shots.splice(+b.getAttribute("data-x"), 1); draw(); }; });
      send.disabled = !shots.length;
    }
    draw();
    pick.onchange = function () {
      var files = Array.prototype.slice.call(pick.files || []).slice(0, 5 - shots.length); pick.value = ""; er.textContent = "";
      (function next() {
        if (!files.length) { draw(); return; }
        var f = files.shift();
        shrink(f).then(function (blob) { shots.push({ blob: blob, url: URL.createObjectURL(blob) }); draw(); next(); }, function (e) { er.textContent = e.message; next(); });
      })();
    };
    document.getElementById("bk").onclick = showList;
    send.onclick = function () {
      if (!shots.length) return;
      send.disabled = true; er.textContent = ""; var ids = [], i = 0;
      (function up() {
        if (i >= shots.length) {
          send.textContent = "제출하는 중…";
          post({ action: "s_hw_submit", token: ME.token, id: h.id, files: ids, memo: document.getElementById("memo").value }).then(function (j) {
            if (j.relogin) { logout(); stepCls(j.msg); return; }
            if (!j.ok) { send.disabled = false; send.textContent = "다시 제출하기"; er.textContent = j.msg || "제출하지 못했어요."; return; }
            app.innerHTML = whoBar() + '<div class="box done"><div class="big">' + (j.late ? "🙂" : "🎉") + "</div><h2>" + (j.late ? "늦었지만 제출했어요" : "제출 완료!") + '</h2><p class="sub">「' + esc(h.title) + "」 사진 " + j.n + "장을 선생님께 보냈어요." + (j.late ? "<br>다음엔 마감 전에 내요!" : "") + '</p><div class="row" style="justify-content:center"><button class="btn" id="bk2">과제 목록으로</button></div></div>';
            bindWho(); document.getElementById("bk2").onclick = showList;
          });
          return;
        }
        send.textContent = "사진 올리는 중… (" + (i + 1) + "/" + shots.length + ")";
        b64(shots[i].blob).then(function (data) {
          return post({ action: "s_hw_upload", token: ME.token, name: "hw" + (i + 1) + ".jpg", type: shots[i].blob.type || "image/jpeg", b64: data });
        }).then(function (j) {
          if (j.relogin) { logout(); stepCls(j.msg); return; }
          if (!j.ok) { send.disabled = false; send.textContent = "다시 제출하기"; er.textContent = j.msg || "사진을 올리지 못했어요."; return; }
          ids.push({ fid: j.fid, name: j.name }); i++; up();
        });
      })();
    };
  }

  if (ME && (!CLS || ME.cls === CLS)) showList(); else { if (ME) logout(); if (CLS) stepName(); else stepCls(); }
})();
</script>
</body>
</html>
