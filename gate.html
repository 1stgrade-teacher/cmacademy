<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>입장 코드 · 일등급샘</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F0F8F8;font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;color:#1B2733;padding:16px}
.box{width:min(380px,100%);background:#fff;border-radius:18px;padding:28px 22px;box-shadow:0 12px 40px rgba(10,60,62,.15);text-align:center}
h1{margin:0 0 6px;font-size:21px;color:#0A5F61}p{margin:0 0 18px;font-size:14.5px;line-height:1.6;color:#5F6E7C}
input{width:100%;border:1px solid #CFE5E4;border-radius:12px;padding:13px 14px;font-size:17px;text-align:center;outline:none}
input:focus{border-color:#0E8A8C;box-shadow:0 0 0 3px #DDF2F1}
button{margin-top:12px;width:100%;height:48px;border:0;border-radius:12px;background:#0E8A8C;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
button:disabled{background:#B9CDD0}.err{min-height:20px;margin-top:10px;font-size:13.5px;color:#C0392B}
</style></head><body>
<form class="box" id="f">
<h1>🔒 일등급샘 영어</h1>
<p>학원생과 학부모님만 들어올 수 있어요.<br>선생님께 받은 <b>입장 코드</b>를 넣어 주세요.<br><small>(한 번 넣으면 이 기기에서는 다시 묻지 않아요)</small></p>
<input id="c" type="password" autocomplete="off" placeholder="입장 코드" autofocus>
<button id="b" type="submit">입장하기</button>
<div class="err" id="e"></div>
</form>
<script>
document.getElementById("f").onsubmit=function(ev){
  ev.preventDefault();
  var c=document.getElementById("c").value.trim(),b=document.getElementById("b"),e=document.getElementById("e");
  if(!c){e.textContent="코드를 입력해 주세요.";return;}
  b.disabled=true;e.textContent="";
  fetch("/api/gate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:c})})
   .then(function(r){return r.json().catch(function(){return{};});})
   .then(function(j){
     if(j.ok){var n=new URLSearchParams(location.search).get("next")||"/";if(n.charAt(0)!=="/"||n.indexOf("//")===0)n="/";location.replace(n);}
     else{b.disabled=false;e.textContent=j.msg||"입장하지 못했어요. 다시 시도해 주세요.";}
   }).catch(function(){b.disabled=false;e.textContent="인터넷 연결을 확인해 주세요.";});
};
</script></body></html>
