<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SO 레벨1 19강 적용독해01 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}
.lp-top::before{height:5px;background:linear-gradient(90deg,var(--pk) 0,var(--pk) 80%,var(--am) 80%,var(--am) 100%)}
.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}
.lp-tag{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700;padding:2px 12px}
.lp-qn{flex:0 0 112px;height:112px;align-self:center;background:#fff;color:var(--pk);border:3px solid var(--pk);border-radius:50%;font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;font-size:26px}
.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}

.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}

.lp-sno .es{background:var(--am);border-radius:2px;font-weight:700}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"SO 레벨1 19강 적용독해01","audioDir":"19-01_audio","preview":false,"count":42,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">19강\u003cbr>적용독해01\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">SO 레벨1\u003c/div>\u003ch1>Watching Eyes at the Gas Station\u003c/h1>\u003ch2>주유소의 감시하는 눈길\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>요약: Steve는 MacGill 양이 창문으로 자신을 지켜보며 늘 \u003cb class=\"key\">흠을 \u003c/b>\u003cb class=\"key\">잡으려\u003c/b> 한다고 느낀다. 어제는 자신의 책임이 아닌 공기 펌프 고장으로 주급에서 10달러를 삭감당했고, 그는 \u003cb class=\"key\">돈이 \u003c/b>\u003cb class=\"key\">절실히 \u003c/b>\u003cb class=\"key\">필요해\u003c/b> 그만두지 못할 뿐 그녀의 이런 태도가 더 싫다고 생각한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Steve resents Miss MacGill's constant fault-finding even more than the unfair pay deduction, but he cannot quit because he needs the money so badly.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 주유소에서 일하는 Steve와 그의 상사 MacGill 양的故事이 아니라 이야기예요. Steve가 손님 차에 기름을 넣으면서 창문 너머로 자기를 지켜보는 상사의 시선을 느끼는 장면으로 시작하죠. 이 글은 감시와 흠 잡기, 그리고 부당한 급여 삭감에 대한 직원의 속마음을 담고 있어요. 요지는 상사의 끊임없는 흠 잡기가 삭감보다 더 견디기 어렵지만, 돈이 필요해서 그만둘 수 없다는 것입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">주유소에서 기름을 넣어 주는 일은 손님 응대부터 장비 관리까지 여러 가지가 얽힌 \u003cb class=\"key\">서비스 \u003c/b>\u003cb class=\"key\">노동\u003c/b>이에요. 이런 일을 하는 아르바이트생과 고용주 사이에는 늘 \u003cb class=\"key\">감시와 \u003c/b>\u003cb class=\"key\">신뢰\u003c/b>라는 문제가 따라붙죠. 고용주가 직원을 지나치게 지켜보며 흠을 잡는 것을 영어로 \u003cb class=\"key\">find \u003c/b>\u003cb class=\"key\">fault \u003c/b>\u003cb class=\"key\">with\u003c/b>라고 하는데, 단순한 지적이 아니라 계속 트집을 잡는다는 부정적인 느낌을 담고 있어요. 또 장비 고장 같은 사고에서 임금을 깎는 것은 \u003cb class=\"key\">pay \u003c/b>\u003cb class=\"key\">deduction\u003c/b>이라 하며, 누구에게 책임(responsibility)이 있는지 따지는 \u003cb class=\"key\">책임 \u003c/b>\u003cb class=\"key\">소재\u003c/b>가 핵심 쟁점이 됩니다. 이건 마치 학원 원장이 CCTV로 학생을 계속 들여다보며 사소한 실수를 잡아내는 것과 비슷해요. 결국 힘든 노동보다 더 견디기 어려운 것은 \u003cb class=\"key\">불신과 \u003c/b>\u003cb class=\"key\">감시\u003c/b>라는 점을 이 글은 보여 줍니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 짚어 볼게요. 주유소에서 기름을 넣어 주는 일은 손님 응대부터 장비 관리까지 여러 가지가 얽힌 서비스 노동이에요. 이런 일을 하는 아르바이트생과 고용주 사이에는 늘 감시와 신뢰라는 문제가 따라붙죠. 고용주가 직원을 지나치게 지켜보며 흠을 잡는 것을 find fault with라고 하는데, 단순한 지적이 아니라 계속 트집을 잡는다는 부정적인 느낌을 담고 있어요. 또 장비 고장 같은 사고에서 임금을 깎는 것은 pay deduction이라 하고, 누구에게 responsibility가 있는지 따지는 책임 소재가 핵심 쟁점이 됩니다. 이건 마치 학원 원장이 CCTV로 학생을 계속 들여다보며 사소한 실수를 잡아내는 것과 비슷해요. 결국 힘든 노동보다 더 견디기 어려운 것은 불신과 감시라는 점을 이 글은 보여 줍니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>감시당하는 아침\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>손님 차에 기름을 넣어주면서 Steve는 MacGill 양이 창문으로 자신을 쳐다보고 있는 것을 본다. 그는 그녀가 자신을 그만 좀 보면 좋은 아침일 텐데 하고 생각한다. 하루의 시작부터 \u003cb class=\"key\">감시\u003c/b>를 받는 이 상황이 그의 \u003cb class=\"key\">불만\u003c/b>이 시작되는 지점이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>실수에 대한 두려움\u003csmall>전개 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>그는 몸을 숙여 기름이 잘 들어가는지 살핀다. 한 방울이라도 기름을 흘리면 그녀가 \u003cb class=\"key\">야단\u003c/b>을 칠 것이기 때문이다. 게다가 그녀는 늘 뭔가로 그에게 \u003cb class=\"key\">핀잔\u003c/b>을 주는 사람이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>부당한 삭감\u003csmall>예시 · 문장 6–8\u003c/small>\u003c/h4>\u003cp>어제는 공기 펌프가 작동하지 않는다고 그를 야단쳤다. 사실은 어떤 손님이 펌프를 켜 놓은 채로 두어 모터가 타버린 일이었다. 그런데도 펌프는 \u003cb class=\"key\">그의 \u003c/b>\u003cb class=\"key\">책임\u003c/b>이라면서 MacGill 양은 주급에서 10달러를 제하겠다고 했다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>그만두지 못하는 이유\u003csmall>결론 · 문장 9–10\u003c/small>\u003c/h4>\u003cp>Steve는 그것도 심하지만 늘 \u003cb class=\"key\">자신이 \u003c/b>\u003cb class=\"key\">잘못하는 \u003c/b>\u003cb class=\"key\">것을 \u003c/b>\u003cb class=\"key\">잡아내려는\u003c/b> 태도가 더 싫다고 생각한다. 그래서 돈이 이렇게 절실히 필요하지만 않다면 \u003cb class=\"key\">그만두겠다\u003c/b>고 말한다. 결국 이 글은 부당한 처우보다 더 견디기 힘든 것이 \u003cb class=\"key\">불신\u003c/b>이라는 점을 보여 준다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 네 단계로 나누어 살펴볼게요.","hl":null},{"n":4,"text":"첫 단계는 도입이에요. Steve가 손님 차에 기름을 넣어주면서 MacGill 양이 창문으로 자신을 쳐다보는 것을 발견하죠. 그래서 그녀가 그만 좀 보면 좋은 아침일 텐데 하고 생각해요. 하루 시작부터 감시를 받는다는 느낌, 이것이 그의 불만이 시작되는 지점입니다.","hl":"f0"},{"n":5,"text":"두 번째 단계는 전개예요. 그는 몸을 숙여 기름이 잘 들어가는지 살펴요. 한 방울이라도 흘리면 야단을 맞을 것 같으니까요. 게다가 그녀는 늘 뭔가로 그에게 핀잔을 주는 사람이라는 점이 이어집니다.","hl":"f1"},{"n":6,"text":"세 번째 단계는 예시예요. 어제는 공기 펌프가 작동하지 않는다고 그를 야단쳤는데, 사실은 손님이 펌프를 켜 놓은 채 두어서 모터가 타버린 일이었어요. 그런데도 그녀는 펌프가 그의 책임이라면서 주급에서 십 달러를 빼겠다고 합니다.","hl":"f2"},{"n":7,"text":"네 번째 단계는 결론이에요. Steve는 그것도 심하지만 늘 자신이 잘못하는 것을 잡아내려는 태도가 더 싫다고 생각해요. 그래서 돈이 이렇게 절실히 필요하지만 않다면 그만두겠다고 말하죠. 결국 이 이야기가 말하는 것은 불신이 부당한 처우보다 더 견디기 힘들다는 것입니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순(현재 장면-과거 사건-결론)\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 9번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 주유소에서 벌어지는 현재 장면으로 시작해, 어제 있었던 일을 Yesterday로 끌어오는 \u003cb class=\"key\">시간순\u003c/b> 전개를 보인다. 마지막 두 문장에서야 Steve의 \u003cb class=\"key\">진짜 \u003c/b>\u003cb class=\"key\">불만\u003c/b>과 그 이유가 드러나므로 \u003cb class=\"key\">미괄식\u003c/b> 구조다. 앞부분의 감시 장면과 부당한 삭감은 모두 마지막 결론을 뒷받침하는 \u003cb class=\"key\">근거\u003c/b>로 쓰인다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>As (1)\u003c/b>\u003cspan>동시 상황을 여는 시간 접속사\u003c/span>\u003cb>If (2)\u003c/b>\u003cspan>현재 사실 반대 가정\u003c/span>\u003cb>Yesterday (6)\u003c/b>\u003cspan>과거 사건으로의 시간 전환\u003c/span>\u003cb>but (9)\u003c/b>\u003cspan>앞 내용과 대조하며 강조 이동\u003c/span>\u003cb>If (10)\u003c/b>\u003cspan>가정법으로 결론 제시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">watching me\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">finding fault with him\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">scolded him\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">catch me doing something wrong\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Steve\u003c/th>\u003cth>Miss MacGill\u003c/th>\u003c/tr>\u003ctr>\u003ctd>기름을 흘릴까 봐 조심하며 일함\u003c/td>\u003ctd>창문으로 계속 지켜보며 감시함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>공기 펌프 고장의 책임을 뒤집어씀\u003c/td>\u003ctd>책임이라며 주급에서 10달러를 삭감함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>돈이 필요해 그만두지 못함\u003c/td>\u003ctd>늘 흠을 잡으려는 태도로 압박함\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 현재의 장면에서 시작해 어제 있었던 과거 사건으로 거슬러 올라갔다가 다시 현재의 심정으로 돌아오는 시간순 전개예요. 그래서 시간의 흐름을 놓치지 않는 것이 중요합니다. 마지막 두 문장에서야 Steve의 진짜 불만과 그 이유가 드러나기 때문에 이 글은 미괄식 구조입니다. 주제문은 그가 늘 흠을 잡으려는 태도가 더 싫다고 말하는 아홉 번째 문장이고, 앞부분의 감시 장면과 삭감 사건은 모두 그 결론을 받쳐 주는 근거로 쓰였어요.","hl":"ty"},{"n":9,"text":"신호어도 함께 짚어 볼게요. 첫 번째 문장의 As는 그가 기름을 넣는 동시에 그녀가 그를 본다는 시간적 배경을 만들어 줍니다. 두 번째 문장과 열 번째 문장의 If는 현재 사실과 반대되는 가정을 나타내는 가정법이에요. 여섯 번째 문장의 Yesterday는 현재 장면에서 과거 사건으로 넘어가는 신호이고, 아홉 번째 문장의 but은 삭감도 심하지만 그것보다 더 심한 것이 있다며 강조를 옮겨 줍니다. 또 finding fault with와 scolded, catch me doing something wrong은 모두 그녀가 흠을 잡는다는 같은 개념을 바꿔 말한 재진술 표현입니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>pump\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(기름을) 넣다\u003c/span>\u003c/div>\u003cdiv>\u003cb>customer\u003c/b>\u003cem>명사\u003c/em>\u003cspan>손님\u003c/span>\u003c/div>\u003cdiv>\u003cb>watch\u003c/b>\u003cem>동사\u003c/em>\u003cspan>지켜보다\u003c/span>\u003c/div>\u003cdiv>\u003cb>through\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~을 통해, ~너머로\u003c/span>\u003c/div>\u003cdiv>\u003cb>just\u003c/b>\u003cem>부사\u003c/em>\u003cspan>(강조) 좀, 그저\u003c/span>\u003c/div>\u003cdiv>\u003cb>fine\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>좋은, 괜찮은\u003c/span>\u003c/div>\u003cdiv>\u003cb>bend down\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>몸을 숙이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>check\u003c/b>\u003cem>동사\u003c/em>\u003cspan>살피다, 확인하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>flow\u003c/b>\u003cem>명사\u003c/em>\u003cspan>흐름\u003c/span>\u003c/div>\u003cdiv>\u003cb>spill\u003c/b>\u003cem>동사\u003c/em>\u003cspan>흘리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>drop\u003c/b>\u003cem>명사\u003c/em>\u003cspan>한 방울\u003c/span>\u003c/div>\u003cdiv>\u003cb>find fault with\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~의 흠을 잡다, 트집 잡다\u003c/span>\u003c/div>\u003cdiv>\u003cb>always\u003c/b>\u003cem>부사\u003c/em>\u003cspan>늘, 항상\u003c/span>\u003c/div>\u003cdiv>\u003cb>yesterday\u003c/b>\u003cem>부사\u003c/em>\u003cspan>어제\u003c/span>\u003c/div>\u003cdiv>\u003cb>scold\u003c/b>\u003cem>동사\u003c/em>\u003cspan>야단치다, 꾸짖다\u003c/span>\u003c/div>\u003cdiv>\u003cb>air pump\u003c/b>\u003cem>명사\u003c/em>\u003cspan>공기 펌프\u003c/span>\u003c/div>\u003cdiv>\u003cb>work\u003c/b>\u003cem>동사\u003c/em>\u003cspan>작동하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>leave on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>(전원을) 켜 놓은 채 두다\u003c/span>\u003c/div>\u003cdiv>\u003cb>motor\u003c/b>\u003cem>명사\u003c/em>\u003cspan>모터\u003c/span>\u003c/div>\u003cdiv>\u003cb>burn out\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>타버리다, 고장 나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>responsibility\u003c/b>\u003cem>명사\u003c/em>\u003cspan>책임\u003c/span>\u003c/div>\u003cdiv>\u003cb>take out\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>(돈을) 빼다, 제하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>weekly\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>매주의, 주간의\u003c/span>\u003c/div>\u003cdiv>\u003cb>bad enough\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>충분히 심하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>catch\u003c/b>\u003cem>동사\u003c/em>\u003cspan>잡아내다, 붙잡다\u003c/span>\u003c/div>\u003cdiv>\u003cb>wrong\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>잘못된\u003c/span>\u003c/div>\u003cdiv>\u003cb>worse\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>더 나쁜\u003c/span>\u003c/div>\u003cdiv>\u003cb>badly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>몹시, 절실히\u003c/span>\u003c/div>\u003cdiv>\u003cb>quit\u003c/b>\u003cem>동사\u003c/em>\u003cspan>그만두다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어 몇 개만 짚어 볼게요. pump는 기름을 넣다라는 동사로 쓰였고, find fault with는 흠을 잡다, scold는 야단치다라는 뜻이에요. take out은 돈을 빼다, 즉 급여에서 제하다는 의미로 나오고, 마지막의 quit은 그만두다라는 뜻입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">find fault with\u003c/b>\u003cspan class=\"m\">~의 흠을 잡다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">criticize\u003c/span>\u003cspan class=\"s\">pick on\u003c/span>\u003cspan class=\"s\">complain about\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">praise\u003c/span>\u003cspan class=\"a\">approve of\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">scold\u003c/b>\u003cspan class=\"m\">야단치다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">reprimand\u003c/span>\u003cspan class=\"s\">rebuke\u003c/span>\u003cspan class=\"s\">tell off\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">praise\u003c/span>\u003cspan class=\"a\">compliment\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">watch\u003c/b>\u003cspan class=\"m\">지켜보다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">observe\u003c/span>\u003cspan class=\"s\">monitor\u003c/span>\u003cspan class=\"s\">keep an eye on\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003cspan class=\"a\">overlook\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">responsibility\u003c/b>\u003cspan class=\"m\">책임\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">duty\u003c/span>\u003cspan class=\"s\">obligation\u003c/span>\u003cspan class=\"s\">accountability\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">irresponsibility\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">quit\u003c/b>\u003cspan class=\"m\">그만두다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">resign\u003c/span>\u003cspan class=\"s\">give up\u003c/span>\u003cspan class=\"s\">leave\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">continue\u003c/span>\u003cspan class=\"a\">stay\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">badly\u003c/b>\u003cspan class=\"m\">몹시, 절실히\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">desperately\u003c/span>\u003cspan class=\"s\">greatly\u003c/span>\u003cspan class=\"s\">seriously\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">slightly\u003c/span>\u003cspan class=\"a\">barely\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">fine\u003c/b>\u003cspan class=\"m\">좋은, 괜찮은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">good\u003c/span>\u003cspan class=\"s\">pleasant\u003c/span>\u003cspan class=\"s\">nice\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">bad\u003c/span>\u003cspan class=\"a\">awful\u003c/span>\u003cspan class=\"a\">terrible\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 정리해 볼게요. watch는 observe나 monitor로 바꿔 쓸 수 있고 반대말은 ignore예요. find fault with는 criticize나 pick on과 가깝고 반대말은 praise입니다. scold는 reprimand, rebuke와 같고 반대말은 praise나 compliment죠. quit은 resign이나 give up으로 바꿀 수 있고 반대말은 continue나 stay이고, badly는 desperately, greatly와 비슷하며 반대말은 slightly입니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Steve가 손님 차에 기름을 넣어주면서,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">As \u003c/span>\u003cspan class=\"tgt\">Steve \u003c/span>\u003cspan class=\"tgt\">pumps \u003c/span>\u003cspan class=\"tgt\">gas \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">customer\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 MacGill 양이\u003c/span>\u003cspan class=\"en\">he \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">sees \u003c/span>\u003cspan class=\"tgt\">Miss \u003c/span>\u003cspan class=\"tgt\">MacGill \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">창문으로 자신을 쳐다보고 있는 것을 본다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">watching\u003c/span> him through the window.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">손님 차에 기름을 넣어주면서, Steve 는 MacGill 양이 창문으로 자신을 쳐다보고 있는 것을 본다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 Steve가 손님 차에 주유하는 동안 MacGill 양이 창문 너머로 그를 지켜보는 장면을 제시한다. 두 인물 사이의 \u003cb class=\"key\">시선\u003c/b>을 통해 긴장감을 만들고, 곧이어 Steve가 그 감시를 부담스러워하는 \u003cb class=\"key\">심리\u003c/b>로 자연스럽게 이어진다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 as의 시간 부사절\u003c/span> : As + [주어 + 동사] + , + [주절] : \"Steve가 손님 차에 기름을 넣어주면서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지각동사 see + 목적어 + 현재분사\u003c/span> : see + [목적어] + [watching (현재분사)] : \"MacGill 양이 ... 쳐다보고 있는 것을 본다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"As Steve pumps gas for a customer, Steve가 손님 차에 기름을 넣어주면서. he sees Miss MacGill, 그는 MacGill 양이. watching him through the window, 창문으로 자신을 쳐다보고 있는 것을 본다.. 이 문장 전체를 해석하면, 손님 차에 기름을 넣어주면서, Steve 는 MacGill 양이 창문으로 자신을 쳐다보고 있는 것을 본다.","hl":"m"},{"n":13,"text":"이 문장은 Steve가 손님 차에 주유하는 동안 MacGill 양이 창문 너머로 그를 지켜보는 장면을 보여 줘요. 두 사람 사이의 시선을 통해 긴장감을 만들고, 곧이어 Steve가 그 감시를 부담스러워하는 심리로 이어지게 해요.","hl":"mn"},{"n":14,"text":"첫 번째로 As Steve pumps gas for a customer에서 as는 시간을 나타내는 부사절 접속사예요. 그래서 뒤 절의 동작과 앞 절의 동작이 동시에 일어나는 배경을 만들어 줍니다. 두 번째로 sees Miss MacGill watching에서 see는 지각동사이고, watching은 현재분사 목적격보어로 쓰여 그녀가 보고 있는 중인 모습을 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 생각한다,\u003c/span>\u003cspan class=\"en\">He thinks,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“그녀가 자신을 그만 좀 보면,\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">If \u003c/span>\u003cspan class=\"tgt\">she \u003c/span>\u003cspan class=\"tgt\">just \u003c/span>\u003cspan class=\"tgt\">stopped \u003c/span>\u003cspan class=\"tgt\">watching \u003c/span>\u003cspan class=\"tgt\">me\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">좋은 아침일 텐데.”\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">fine \u003c/span>\u003cspan class=\"tgt\">morning\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 “그녀가 자신을 그만 좀 보면, 좋은 아침일 텐데.”라고 생각한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Steve가 MacGill 양의 감시가 그치기를 바라는 마음을 직접인용으로 보여 준다. 지금 그녀가 계속 보고 있다는 현실을 전제로 한 \u003cb class=\"key\">가정법 \u003c/b>\u003cb class=\"key\">과거\u003c/b>를 써서, \u003cb class=\"key\">현실과 \u003c/b>\u003cb class=\"key\">반대\u003c/b>인 소망과 짜증을 드러낸다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가정법 과거의 if절\u003c/span> : If + [주어] + [과거동사] + , + [주어] + would + [동사원형] : \"그녀가 자신을 그만 좀 본다면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">가정법 과거의 귀결절\u003c/span> : [주어] + would + [동사원형] : \"좋은 아침일 텐데\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"He thinks, 그는 생각한다. \"If she just stopped watching me, “그녀가 자신을 그만 좀 보면. it would be a fine morning.\", 좋은 아침일 텐데.”. 이 문장 전체를 해석하면, 그는 “그녀가 자신을 그만 좀 보면, 좋은 아침일 텐데.”라고 생각한다.","hl":"m"},{"n":16,"text":"Steve가 MacGill 양의 감시가 그치기를 바라는 마음을 직접인용으로 보여 줘요. 지금 그녀가 계속 보고 있다는 현실을 전제로 한 가정법 과거를 써서, 현실과 반대인 소망과 짜증을 드러내요.","hl":"mn"},{"n":17,"text":"첫 번째로 If she just stopped watching me는 가정법 과거의 if절이에요. 현재 그녀가 계속 보고 있다는 사실과 반대되는 현실과 반대 상황을 가정할 때 if절에 과거동사를 씁니다. 두 번째로 it would be a fine morning은 가정법 과거의 귀결절이고, would 다음에 동사원형 be가 와서 소망을 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 몸을 숙여,\u003c/span>\u003cspan class=\"en\">He bends down,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기름이 잘 들어가는지 살핀다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">checking \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">flow \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">gas\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 몸을 숙여 기름이 잘 들어가는지 살핀다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Steve가 주유 중 기름의 흐름을 확인하려고 몸을 숙이는 동작을 묘사한다. 앞의 긴장감과 이어져 실수하지 않으려는 \u003cb class=\"key\">조심스러운 \u003c/b>\u003cb class=\"key\">태도\u003c/b>를 보여 주고, 다음 문장에서 그가 \u003cb class=\"key\">실수\u003c/b>를 두려워하는 이유를 암시한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">분사구문 (동시 상황)\u003c/span> : [주절] + , + [checking (현재분사) ~] : \"기름이 잘 들어가는지 살피면서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">of를 이용한 명사 수식\u003c/span> : [the flow] + of + [gas] : \"기름의 흐름\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"He bends down, 그는 몸을 숙여. checking the flow of gas, 기름이 잘 들어가는지 살핀다.. 이 문장 전체를 해석하면, 그는 몸을 숙여 기름이 잘 들어가는지 살핀다.","hl":"m"},{"n":19,"text":"Steve가 주유 중 기름의 흐름을 확인하려고 몸을 숙이는 동작을 묘사해요. 앞의 긴장감과 이어져 실수하지 않으려는 조심스러운 태도를 보여 주고, 다음 문장에서 그가 실수를 두려워하는 이유를 암시해요.","hl":"mn"},{"n":20,"text":"첫 번째로 checking the flow of gas는 분사구문으로, 앞 절의 주어 He와 같은 주어가 이어지는 구조예요. 몸을 숙이는 동작과 기름의 흐름을 확인하는 동작이 거의 동시에 일어나서 현재분사 checking을 씁니다. 두 번째로 the flow of gas에서 of는 앞의 명사 flow를 뒤의 gas가 설명하도록 수식 관계를 만들어 주고, 여기서는 기름이 흐르는 대상을 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 그가 한 방울이라도 흘리면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">If \u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">spills \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">drop\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 흠을 잡을 것이다\u003c/span>\u003cspan class=\"en\">she will \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">find \u003c/span>\u003cspan class=\"tgt\">fault \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그에게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">him\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">한 방울이라도 기름을 흘리면, 그녀가 야단을 칠 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 기름을 조금이라도 흘리면 MacGill 양이 곧바로 트집을 잡을 것이라는 뜻이에요. 앞에서 몸을 숙여 기름 흐름을 살피는 장면에 이어, Steve가 얼마나 \u003cb class=\"key\">긴장\u003c/b>하고 있는지를 보여 주는 대목이죠. \u003cb class=\"key\">조건\u003c/b>을 제시해 그녀의 \u003cb class=\"key\">트집\u003c/b> 성향을 미리 암시하는 역할도 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조건을 나타내는 접속사 if절의 현재시제\u003c/span> : If + [주어] + [현재시제 동사(spills)] , [주절 will + 동사원형] : \"만약 그가 한 방울이라도 흘리면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관용표현 find fault with\u003c/span> : find fault with + [사람/사물] : \"그의 흠을 잡다, 그에게 트집을 잡다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"If he spills a drop, 만약 그가 한 방울이라도 흘리면. she will find fault, 그녀는 흠을 잡을 것이다. with him, 그에게. 이 문장 전체를 해석하면, 한 방울이라도 기름을 흘리면, 그녀가 야단을 칠 것이다.","hl":"m"},{"n":22,"text":"여기는 스티브가 기름을 넣으면서 얼마나 긴장하고 있는지 보여 주는 문장이에요. 조금이라도 실수하면 맥길 양이 바로 트집을 잡을 거라고 스스로 걱정하는 거죠. 조건을 먼저 던져 놓아서 그녀가 어떤 사람인지도 자연스럽게 드러납니다.","hl":"mn"},{"n":23,"text":"첫 번째 어법 포인트는 조건을 나타내는 if절이에요. 조건절 안에서는 앞으로의 일이라도 현재시제를 씁니다. 그래서 will spill이 아니라 spills가 되는 거죠. 두 번째는 관용표현 find fault with인데, 이건 흠을 잡다, 트집을 잡다라는 뜻으로 덩어리째 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 늘\u003c/span>\u003cspan class=\"en\">She \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">always \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그에게 흠을 잡고 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">finding\u003c/span> fault with him\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">뭔가에 대해\u003c/span>\u003cspan class=\"en\">about something.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 늘 뭔가로 그에게 핀잔을 준다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 어제 일만이 아니라 늘 반복되는 문제라는 점을 강조하는 문장이에요. always와 진행형을 함께 써서 '지금도 또' 하고 있다는 \u003cb class=\"key\">불만\u003c/b>의 감정을 담았죠. 앞 문장의 조건이 결코 우연이 아니라 \u003cb class=\"key\">반복\u003c/b>되는 일상임을 알려 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">always + 현재진행형(습관적 반복에 대한 감정 표현)\u003c/span> : [주어] + be동사 + always + [동사-ing] : \"늘 ~하고 있다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"She is always, 그녀는 늘. finding fault with him, 그에게 흠을 잡고 있다. about something, 뭔가에 대해. 이 문장 전체를 해석하면, 그녀는 늘 뭔가로 그에게 핀잔을 준다.","hl":"m"},{"n":25,"text":"이 문장은 어제 일이 우연이 아니라 늘 반복되는 문제라는 걸 강조해요. always와 진행형을 같이 써서 지금도 또 트집을 잡고 있다는 불만을 담았죠. 그래서 스티브가 느끼는 짜증이 점점 쌓이고 있다는 흐름으로 읽으면 됩니다.","hl":"mn"},{"n":26,"text":"여기서 핵심은 always와 현재진행형의 결합이에요. 원래 진행형은 지금 하고 있는 일을 말하지만, always가 붙으면 반복되는 행동에 대한 짜증이나 불만을 담게 됩니다. 그래서 단순히 '늘 잡는다'가 아니라 못마땅해하는 느낌으로 읽어야 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어제\u003c/span>\u003cspan class=\"en\">Yesterday,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 그를 야단쳤다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">she \u003c/span>\u003cspan class=\"tgt\">scolded \u003c/span>\u003cspan class=\"tgt\">him\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜냐하면 공기 펌프가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">because \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">air \u003c/span>\u003cspan class=\"tgt\">pump \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">작동하지 않고 있었기 때문에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">working\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어제는 공기 펌프가 작동하지 않는다고 야단을 쳤다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 그녀가 트집을 잡는다는 것을 구체적인 사건 하나로 뒷받침하는 문장이에요. 어제 있었던 실제 일을 예로 들어 앞의 \u003cb class=\"key\">불만\u003c/b>을 근거 있게 만들어 주죠. 이 사건이 다음 문장의 \u003cb class=\"key\">책임\u003c/b> 논란과 월급 삭감으로 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">3형식 동사 scold + 목적어\u003c/span> : [주어] + scolded + [목적어(him)] : \"그녀는 그를 야단쳤다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이유를 나타내는 접속사 because + 과거진행형\u003c/span> : [주절] + because + [주어] + was/were + not + [동사-ing] : \"공기 펌프가 작동하지 않고 있었기 때문에\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Yesterday, 어제. she scolded him, 그녀는 그를 야단쳤다. because the air pump, 왜냐하면 공기 펌프가. was not working, 작동하지 않고 있었기 때문에. 이 문장 전체를 해석하면, 어제는 공기 펌프가 작동하지 않는다고 야단을 쳤다.","hl":"m"},{"n":28,"text":"이 문장은 그녀가 트집을 잡는다는 걸 어제 있었던 실제 사건으로 증명해 줍니다. 구체적인 예를 들었기 때문에 스티브의 불만이 훨씬 설득력 있게 느껴지죠. 그리고 이 사건이 바로 다음에 나오는 책임 문제와 월급 삭감으로 이어집니다.","hl":"mn"},{"n":29,"text":"첫 번째는 이유를 나타내는 접속사 because예요. 뒤에 공기 펌프가 작동하지 않았다는 원인이 완전한 절로 옵니다. 두 번째는 과거진행형 was not working인데, 어제 그 시점에 작동이 안 되는 상태가 계속되고 있었다는 걸 보여 줍니다. 그리고 scold는 목적어를 하나만 갖는 3형식 동사라서 him 앞에 전치사가 붙지 않는다는 점도 같이 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 손님이\u003c/span>\u003cspan class=\"en\">A customer\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">(그 전에) 두었어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">left \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">펌프를 켜놓은 채로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">pump \u003c/span>\u003cspan class=\"tgt\">on\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서 모터가\u003c/span>\u003cspan class=\"en\">and the motor\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">타버렸다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">burned \u003c/span>\u003cspan class=\"tgt\">out\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어떤 손님이 펌프를 그대로 켜놓은 채로 두어, 모터가 타버렸다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 Steve가 야단맞은 사건의 \u003cb class=\"key\">원인\u003c/b>을 밝혀 주는 문장이에요. 손님이 펌프를 켜둔 채 자리를 떠나 \u003cb class=\"key\">모터가 \u003c/b>\u003cb class=\"key\">타버렸다\u003c/b>는 것이므로, 결국 \u003cb class=\"key\">Steve의 \u003c/b>\u003cb class=\"key\">잘못이 \u003c/b>\u003cb class=\"key\">아니라는 \u003c/b>\u003cb class=\"key\">점\u003c/b>을 드러내는 대목입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거완료(have + 과거분사)\u003c/span> : had + [과거분사 left] : 과거보다 앞선 시점의 일 : \"(그 전에) 두었었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">5형식 (leave + 목적어 + 목적격보어)\u003c/span> : leave + [목적어 the pump] + [목적격보어 on(형용사)] : \"펌프를 켜놓은 채로 두다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">구동사(phrasal verb)\u003c/span> : burn + out : 완전히 타서 꺼지다 : \"타버렸다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"A customer, 어떤 손님이. had left, (그 전에) 두었어요. the pump on, 펌프를 켜놓은 채로. and the motor, 그래서 모터가. burned out, 타버렸다. 이 문장 전체를 해석하면, 어떤 손님이 펌프를 그대로 켜놓은 채로 두어, 모터가 타버렸다.","hl":"m"},{"n":31,"text":"이 문장은 어제 Steve가 야단맞은 사건의 원인을 알려줘요. 손님이 공기 펌프를 켜둔 채 자리를 떠나서 모터가 타버렸다는 거죠. 즉 Steve의 잘못이 아니라는 점을 보여 주는 대목이에요.","hl":"mn"},{"n":32,"text":"첫 번째로 had left는 과거완료예요. 어제 일어난 일보다 더 이전에 벌어진 손님의 행동이라 과거완료로 표현한 거죠. 두 번째로 left the pump on은 목적어 the pump 뒤에 형용사 on이 와서 상태를 설명하는 목적격보어 구조예요. 세 번째로 burned out은 out이 완전히 끝까지라는 완료의 의미를 더해 주는 구동사입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Steve 에게 말하면서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Telling \u003c/span>\u003cspan class=\"tgt\">Steve\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">펌프는 그의 책임이라고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">pump \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">responsibility\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">MacGill 양은 말했다\u003c/span>\u003cspan class=\"en\">Miss MacGill \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">said \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀가 10 달러를 빼겠다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">she \u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">take\u003c/span> ten dollars\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 주급에서\u003c/span>\u003cspan class=\"en\">out of his weekly pay.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">펌프는 그의 책임이라면서, MacGill 양은 그의 주급에서 10 달러를 제하겠다고 했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> MacGill 양이 펌프 관리 책임을 Steve에게 \u003cb class=\"key\">전가\u003c/b>하고, 주급에서 10달러를 \u003cb class=\"key\">삭감\u003c/b>하겠다고 통보하는 장면이에요. 분사구문으로 이유를 먼저 던진 뒤 본동사 said로 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">발화\u003c/b>를 전달하는 구조입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">분사구문(현재분사)\u003c/span> : [[현재분사]] Telling + 목적어 , 주절 : \"Steve 에게 말하면서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 that 이끄는 명사절(목적어)\u003c/span> : tell + [that + 주어 + 동사 ~ (명사절)] : \"펌프는 그의 책임이라고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">간접화법 &amp; would(미래의 과거)\u003c/span> : said + [(that) + 주어 + would + 동사원형] : \"~하겠다고 말했다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"Telling Steve, Steve 에게 말하면서. that the pump was his responsibility, 펌프는 그의 책임이라고. Miss MacGill said, MacGill 양은 말했다. she would take ten dollars, 그녀가 10 달러를 빼겠다고. out of his weekly pay, 그의 주급에서. 이 문장 전체를 해석하면, 펌프는 그의 책임이라면서, MacGill 양은 그의 주급에서 10 달러를 제하겠다고 했다.","hl":"m"},{"n":34,"text":"MacGill 양이 펌프 관리 책임을 Steve에게 전가하는 장면이에요. 그리고 주급에서 ten dollars를 삭감하겠다고 통보하죠. 이유를 분사구문으로 먼저 말하고, 본동사 said로 핵심 발화를 전달하는 구조입니다.","hl":"mn"},{"n":35,"text":"첫 번째, Telling으로 시작하는 분사구문이에요. 접속사와 주어를 지우고 현재분사로 바꿔서 ~하면서로 해석하고, 주절 주어 Miss MacGill과 주어가 같은 동일 주어 관계예요. 두 번째, that the pump was his responsibility는 tell의 목적어로 온 명사절입니다. 세 번째, said she would take에서 will이 간접화법에서 would로 바뀌어 과거 시점의 미래를 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">&quot;정말 심하다.&quot;고\u003c/span>\u003cspan class=\"en\">&quot;That's bad enough,&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Steve 는 생각한다\u003c/span>\u003cspan class=\"en\">thinks Steve,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">&quot;하지만 ~하는 방식은\u003c/span>\u003cspan class=\"en\">&quot;but \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">way \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀가 늘 애쓰는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">she \u003c/span>\u003cspan class=\"tgt\">always \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">tries \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내가 잘못하는 걸 잡아내려고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">catch \u003c/span>\u003cspan class=\"tgt\">me \u003c/span>\u003cspan class=\"tgt\">doing \u003c/span>\u003cspan class=\"tgt\">something \u003c/span>\u003cspan class=\"tgt\">wrong\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 싫다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">even \u003c/span>\u003cspan class=\"tgt\">worse\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“정말 심하다.”고 Steve 는 생각한다. “하지만 저렇게 늘 내가 잘못하는 걸 잡아내려고 하는 건 더 싫다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Steve의 \u003cb class=\"key\">속마음\u003c/b>을 보여 주는 문장이에요. 돈이 절실해 버티고 있지만, 자기 잘못을 잡아내려고 감시하는 태도가 더 견디기 힘들다는 것이죠. bad enough와 even worse를 대조시켜 불만의 정도를 \u003cb class=\"key\">강조\u003c/b>합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계부사 the way (that/in which) 생략\u003c/span> : the way + [(that/in which) + 주어 + 동사] : \"그녀가 늘 ~하려고 하는 방식\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : try + [to catch (to부정사/목적어)] : \"잡으려고 애쓰다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">발견동사 + 목적어 + 현재분사\u003c/span> : catch + [목적어 me] + [현재분사 doing] : \"내가 뭔가 잘못하는 것을 잡아내다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">비교급 강조 &amp; 주격 보어\u003c/span> : even + [비교급 worse] : \"더 싫다(더 나쁘다)\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"\"That's bad enough,\", \"정말 심하다.\"고. thinks Steve, Steve 는 생각한다. \"but the way, \"하지만 ~하는 방식은. she always tries, 그녀가 늘 애쓰는. to catch me doing something wrong, 내가 잘못하는 걸 잡아내려고. is even worse, 더 싫다. 이 문장 전체를 해석하면, “정말 심하다.”고 Steve 는 생각한다. “하지만 저렇게 늘 내가 잘못하는 걸 잡아내려고 하는 건 더 싫다.","hl":"m"},{"n":37,"text":"Steve의 속마음이 담긴 문장이에요. 돈이 절실해서 버티고 있지만, 자기 잘못을 잡으려고 감시하는 태도가 더 견디기 힘들다는 거죠. bad enough와 even worse를 대조시켜서 불만의 정도를 강조하고 있어요.","hl":"mn"},{"n":38,"text":"첫 번째, the way 뒤에 관계부사가 생략되어 ~하는 방식이라는 관계절이 이어져요. 두 번째, tries 뒤에 to부정사가 목적어로 와서 ~하려고 애쓰다라는 뜻이 되고요. 세 번째, catch me doing에서 현재분사 doing이 목적격보어로 와서 내가 ~하는 중인 것을 잡아낸다는 진행의 의미를 냅니다. 네 번째, even이 비교급 worse를 강조하고, 전체가 주어를 설명하는 주격 보어로 쓰였어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 내가 필요하지 않다면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">If \u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">didn't \u003c/span>\u003cspan class=\"tgt\">need\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 돈이 그렇게 절실히,\u003c/span>\u003cspan class=\"en\">the money so badly,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 그만둘 텐데.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">quit\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">돈이 이렇게 절실히 필요하지만 않다면, 그만둘 텐데.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Steve는 돈이 절실히 필요하기 때문에 당장 일을 그만두지 못한다는 뜻이에요. 'If I didn't need ~, I would quit'는 현재 사실의 반대를 가정하는 \u003cb class=\"key\">가정법 \u003c/b>\u003cb class=\"key\">과거\u003c/b>로, 그만두고 싶은 마음과 현실 사이의 \u003cb class=\"key\">갈등\u003c/b>을 보여 줘요. 앞에서 MacGill 양이 늘 자신의 잘못을 잡으려 한다고 한 데 대한 \u003cb class=\"key\">불만\u003c/b>이 드러난 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가정법 과거(조건절)\u003c/span> : [[If]] + 주어 + [[과거형 동사]], 주어 + [[would + 동사원형]] : \"만약 내가 필요하지 않다면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">가정법 과거(주절)\u003c/span> : 주어 + [[would + 동사원형]] : \"나는 그만둘 텐데\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"If I didn't need, 만약 내가 필요하지 않다면. the money so badly, 그 돈이 그렇게 절실히. I would quit, 나는 그만둘 텐데.. 이 문장 전체를 해석하면, 돈이 이렇게 절실히 필요하지만 않다면, 그만둘 텐데.","hl":"m"},{"n":40,"text":"이 문장은 Steve가 돈이 절실히 필요해서 당장 일을 그만두지 못한다는 뜻이에요. 현재 사실의 반대를 가정하는 가정법 과거를 써서 그만두고 싶은 마음과 현실 사이의 갈등을 보여 주죠. 앞에서 MacGill 양이 늘 자신의 잘못을 잡으려 한다고 한 데 대한 불만도 드러나요.","hl":"mn"},{"n":41,"text":"첫 번째로 If I didn't need는 가정법 과거의 조건절이에요. 현재 사실의 반대를 가정할 때 if절에는 과거형 didn't need를 쓰고, 주절에는 would quit처럼 would 다음에 동사원형을 써서 결과를 나타내요. 그래서 지금 돈이 절실히 필요하지 않다는 현재 사실의 반대를 상상한 표현이죠. 두 번째로 I would quit은 가정법 과거의 주절이에요. would 다음에 동사원형을 써서 현재 사실과 반대되는 결과를 나타내고, 여기서는 그만두고 싶다는 가정의 결과를 표현하죠.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>Steve는 손님 차에 기름을 넣는 중에 MacGill 양이 창문으로 \u003cb class=\"key\">자신을 \u003c/b>\u003cb class=\"key\">지켜보는\u003c/b> 것을 발견한다.\u003c/li>\u003cli>그는 기름을 한 방울이라도 \u003cb class=\"key\">흘리면\u003c/b> 그녀가 야단을 칠 것 같아 몸을 숙여 조심한다.\u003c/li>\u003cli>어제는 손님이 켜 놓은 공기 펌프의 모터가 타버렸는데, MacGill 양은 그것을 \u003cb class=\"key\">Steve의 \u003c/b>\u003cb class=\"key\">책임\u003c/b>이라며 주급에서 10달러를 제했다.\u003c/li>\u003cli>Steve는 삭감도 심하지만 \u003cb class=\"key\">늘 \u003c/b>\u003cb class=\"key\">흠을 \u003c/b>\u003cb class=\"key\">잡으려는\u003c/b> 그녀의 태도가 더 싫고, 돈이 절실히 필요하지 않다면 그만둘 것이라고 생각한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Steve resents Miss MacGill's constant fault-finding even more than the unfair pay deduction, but he cannot quit because he needs the money so badly.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: Steve는 MacGill 양이 창문으로 자신을 지켜보며 늘 \u003cb class=\"key\">흠을 \u003c/b>\u003cb class=\"key\">잡으려\u003c/b> 한다고 느낀다. 어제는 자신의 책임이 아닌 공기 펌프 고장으로 주급에서 10달러를 삭감당했고, 그는 \u003cb class=\"key\">돈이 \u003c/b>\u003cb class=\"key\">절실히 \u003c/b>\u003cb class=\"key\">필요해\u003c/b> 그만두지 못할 뿐 그녀의 이런 태도가 더 싫다고 생각한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":42,"text":"정리해 볼게요. 이 글은 주유소에서 일하는 Steve가 상사의 감시와 흠 잡기에 느끼는 불만을 담은 짧은 이야기예요. 삭감도 심하지만 늘 잘못을 잡아내려는 태도가 더 싫다는 것이 그의 진짜 속마음이고, 돈이 절실히 필요해서 그만두지 못한다는 점이 결론입니다. 오늘도 끝까지 집중해서 읽어 주셔서 고마워요. 다음 시간에 또 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
