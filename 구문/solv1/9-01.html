<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SO 레벨1 9강 적용독해01 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-sno{font-size:13px;color:#8493A1;font-weight:700;margin-bottom:8px}

.lp-chunk{display:flex;flex-direction:column}
.lp-chunk .ko{font-size:13px;color:var(--pk-t);font-weight:700;line-height:1.3;margin-bottom:2px}
.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}
.lp-top::before{height:5px;background:linear-gradient(90deg,var(--pk) 0,var(--pk) 80%,var(--am) 80%,var(--am) 100%)}
.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}
.lp-tag{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700;padding:2px 12px}
.lp-qn{flex:0 0 112px;height:112px;align-self:center;background:#fff;color:var(--pk);border:3px solid var(--pk);border-radius:50%;font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;font-size:26px}
.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}
.lp-qn .qt{display:block;white-space:nowrap;line-height:1.12;letter-spacing:-.02em}
.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}

.lp-st h4 i{border-radius:4px;width:auto;min-width:24px;padding:0 4px}
.lp-pill{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700}
.lp-chain span.c{background:#fff;border:1px solid #AEBBE6;border-radius:3px;font-weight:600}

.lp-vg em{background:#fff;border:1px solid var(--pk-b);border-radius:3px}

.lp-chips .s{border:1px solid #AEBBE6;color:#3A4FA3}
.lp-chips .a{border:1px solid var(--am-b);color:var(--am-d);background:#FFFBF2}
.lp-sno .es{background:var(--am);border-radius:2px;font-weight:700}
.lp-chunk .en{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:600}
.lp-chunk+.lp-chunk{border-left:1px solid var(--pk-b)}
.lp .tgt{background:var(--am-l);border-bottom:2.5px dotted var(--am)}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"SO 레벨1 9강 적용독해01","audioDir":"9-01_audio","preview":false,"count":30,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">9강\u003cbr>적용독해01\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">SO 레벨1\u003c/div>\u003ch1>Fingernails: A Sign of Wealth, Then and Now\u003c/h1>\u003ch2>손톱: 과거와 현재를 잇는 부유함의 표시\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>손톱은 한때 사람이 얼마나 \u003cb class=\"key\">부유\u003c/b>한지를 보여 주는 지표였고, 고대 중국의 부유층은 일할 필요가 없음을 드러내기 위해 손톱을 길게 길렀다. 오늘날에도 긴 손톱은 여전히 여성들에게 인기가 있지만, \u003cb class=\"key\">일하는 \u003c/b>\u003cb class=\"key\">여성\u003c/b>보다 할 일 없는 부자들에게 더 인기가 있다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Long and colored fingernails have long been a sign of wealth, showing that a person does not have to work.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 손톱에 관한 흥미로운 이야기예요. 손톱이 한때 사람이 얼마나 부유한지를 보여 주었다고 하니 조금 뜻밖이죠? 이 글은 고대 중국과 동양의 풍습을 예로 들면서 그 의미가 오늘날까지 이어진다는 것을 보여 줍니다. 요지는 결국 손톱이 부유함의 표시였다는 것, 그리고 지금도 그 의미가 남아 있다는 거예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">손톱을 관리하는 데 시간과 돈을 들일 수 있다는 것은, 곧 생존을 위한 노동에서 벗어나 있다는 신호가 됩니다. 이런 소비를 경제학에서는 conspicuous consumption, 우리말로 \u003cb class=\"key\">과시적 \u003c/b>\u003cb class=\"key\">소비\u003c/b>라고 부릅니다. 다시 말해 비싼 물건이나 여유로운 외모가 '나는 일하지 않아도 된다'는 메시지를 전하는 것이죠. 고대 중국의 부유층이 긴 손톱을 기른 것도, 여성들이 \u003cb class=\"key\">헤나\u003c/b>라는 천연 염료로 손톱을 붉게 물들인 것도 같은 맥락입니다. 마치 오늘날 명품 가방이나 값비싼 시계가 계층을 보여 주는 것과 비슷하다고 생각하면 이해가 쉽습니다. 그래서 손톱 하나에도 \u003cb class=\"key\">계급\u003c/b>과 노동의 의미가 담겨 있다고 볼 수 있습니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식부터 짚어 볼게요. 손톱을 관리하는 데 시간과 돈을 들일 수 있다는 것은 곧 생존을 위한 노동에서 벗어나 있다는 신호가 됩니다. 이런 소비를 경제학에서는 conspicuous consumption, 우리말로 과시적 소비라고 부르죠. 다시 말해 비싼 물건이나 여유로운 외모가 나는 일하지 않아도 된다는 메시지를 전하는 겁니다. 고대 중국의 부유층이 긴 손톱을 기른 것도, 여성들이 헤나라는 천연 염료로 손톱을 붉게 물들인 것도 같은 맥락이에요. 오늘날 명품 가방이나 값비싼 시계가 계층을 보여 주는 것과 비슷하다고 생각하면 이해가 쉬울 거예요. 그래서 손톱 하나에도 계급과 노동의 의미가 담겨 있다고 볼 수 있습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>손톱과 부유함\u003csmall>도입 · 문장 1\u003c/small>\u003c/h4>\u003cp>글은 손톱이 한때 사람이 얼마나 \u003cb class=\"key\">부유\u003c/b>한지를 보여 주었다는 흥미로운 사실로 시작해요. 즉 손톱을 어떻게 관리하는지가 그 사람의 \u003cb class=\"key\">경제력\u003c/b>을 드러내는 지표였다는 거죠. 이 한 문장이 글 전체를 끌고 가는 \u003cb class=\"key\">주제문\u003c/b> 역할을 합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>고대 중국의 긴 손톱\u003csmall>예시 · 문장 2–3\u003c/small>\u003c/h4>\u003cp>고대 중국에서는 손톱을 길게 기르는 것이 부유층 사이에서 인기였어요. 손톱이 길면 실제로 일을 하기 어렵기 때문에, 그것은 그 사람이 \u003cb class=\"key\">일할 \u003c/b>\u003cb class=\"key\">필요\u003c/b>가 없음을 보여 주는 증거가 되었죠. 결국 긴 손톱은 \u003cb class=\"key\">여유\u003c/b> 자체를 과시하는 수단이었어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>붉은 손톱 염색\u003csmall>예시 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>여성들이 손톱을 빨갛게 칠하는 것은 동양의 또 다른 오랜 \u003cb class=\"key\">풍습\u003c/b>이었어요. 매니큐어 대신 \u003cb class=\"key\">헤나\u003c/b>라는 천연 염료를 사용했다는 점이 눈에 띄죠. 손톱 채색 또한 부자들만을 위한 것이었는데, 가난한 사람들은 예쁘게 보일 \u003cb class=\"key\">시간\u003c/b>이 없었기 때문입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>오늘날의 손톱\u003csmall>결론 · 문장 6\u003c/small>\u003c/h4>\u003cp>오늘날에도 긴 손톱은 여전히 여성들에게 인기가 있어요. 그러나 그 인기는 일하는 여성들보다 할 일 없는 \u003cb class=\"key\">부자\u003c/b>들에게 더 강하게 나타납니다. 과거의 의미가 \u003cb class=\"key\">현재\u003c/b>까지 이어진다는 점을 확인하며 글을 맺고 있어요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 네 단계로 나누어 따라가 볼게요.","hl":null},{"n":4,"text":"첫 단계는 도입이에요. 글은 손톱이 한때 사람이 얼마나 부유한지를 보여 주었다는 사실로 시작합니다. 손톱을 어떻게 관리하는지가 그 사람의 경제력을 드러내는 지표였다는 뜻이죠. 이 한 문장이 글 전체를 끌고 가는 주제문 역할을 해요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 고대 중국의 예시입니다. 고대 중국에서는 손톱을 길게 기르는 것이 부유층 사이에서 인기였어요. 손톱이 길면 실제로 일을 하기 어렵기 때문에, 그것은 그 사람이 일할 필요가 없음을 보여 주었습니다. 결국 긴 손톱은 여유 자체를 과시하는 수단이었던 거죠.","hl":"f1"},{"n":6,"text":"세 번째 단계도 예시인데요, 붉은 손톱 염색 이야기입니다. 여성들이 손톱을 빨갛게 칠하는 것은 동양의 또 다른 오랜 풍습이었어요. 매니큐어 대신 헤나라는 천연 염료를 사용했다는 점이 눈에 띕니다. 손톱 채색 또한 부자들만을 위한 것이었는데, 가난한 사람들은 예쁘게 보일 시간이 없었기 때문이에요.","hl":"f2"},{"n":7,"text":"마지막 단계는 결론입니다. 오늘날에도 긴 손톱은 여전히 여성들에게 인기가 있어요. 그러나 그 인기는 일하는 여성들보다 할 일 없는 부자들에게 더 강하게 나타납니다. 과거의 의미가 현재까지 이어진다는 점을 확인하면서 글을 맺고 있습니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">예시(시간순)\u003c/span>\u003cspan class=\"lp-pill\">양괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 손톱이 부유함을 보여 주었다는 \u003cb class=\"key\">주제\u003c/b>를 던지고, 마지막 문장에서 오늘날에도 그 의미가 이어진다고 다시 정리해요. 그래서 처음과 끝이 같은 내용으로 묶이는 \u003cb class=\"key\">양괄식\u003c/b> 구조입니다. 중간에는 고대 중국과 동양의 풍습이라는 \u003cb class=\"key\">예시\u003c/b>가 시간 순서대로 놓여 있죠.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>once (1)\u003c/b>\u003cspan>과거 시점 제시\u003c/span>\u003cb>In ancient China (2)\u003c/b>\u003cspan>구체적 예시 도입\u003c/span>\u003cb>although (4)\u003c/b>\u003cspan>양보·대조\u003c/span>\u003cb>also (5)\u003c/b>\u003cspan>내용 추가\u003c/span>\u003cb>Today (6)\u003c/b>\u003cspan>현재로의 전환\u003c/span>\u003cb>still (6)\u003c/b>\u003cspan>의미의 지속 강조\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">how wealthy a person was\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the wealthy class\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the rich\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the idle rich\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>할 일 없는 부자\u003c/th>\u003cth>가난한 사람·일하는 여성\u003c/th>\u003c/tr>\u003ctr>\u003ctd>일할 필요가 없어 시간이 많음\u003c/td>\u003ctd>생활이 바빠 예쁘게 보일 시간이 없음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>긴 손톱과 손톱 채색이 인기\u003c/td>\u003ctd>손톱을 관리할 여유가 없음\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 예시를 시간 순서대로 늘어놓는 방식으로 전개됩니다. 첫 문장에서 주제를 던지고 마지막 문장에서 오늘날의 상황으로 다시 정리하기 때문에 양괄식 구조예요. 처음과 끝이 같은 내용으로 묶여 있으니, 주제를 놓치지 않으려면 첫 문장과 마지막 문장을 특히 주의해서 읽어야 합니다.","hl":"ty"},{"n":9,"text":"신호어를 짚어 볼게요. 첫 번째 문장의 once는 과거 시점을 열어 주고, 두 번째 문장의 In ancient China는 구체적인 예시로 들어가는 표지입니다. 네 번째 문장의 although는 양보와 대조를 만들고, 다섯 번째 문장의 also는 내용을 하나 더 붙여 줍니다. 마지막 문장의 Today와 still은 현재로 넘어가면서도 의미가 계속된다는 점을 강조하고 있어요. 참고로 how wealthy a person was, the wealthy class, the rich, the idle rich는 모두 같은 대상을 바꿔 부른 재진술 표현입니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>fingernail\u003c/b>\u003cem>명사\u003c/em>\u003cspan>손톱\u003c/span>\u003c/div>\u003cdiv>\u003cb>once\u003c/b>\u003cem>부사\u003c/em>\u003cspan>한때, 예전에\u003c/span>\u003c/div>\u003cdiv>\u003cb>wealthy\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>부유한\u003c/span>\u003c/div>\u003cdiv>\u003cb>ancient\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>고대의\u003c/span>\u003c/div>\u003cdiv>\u003cb>grow\u003c/b>\u003cem>동사\u003c/em>\u003cspan>기르다, 자라게 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>popular\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>인기 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>the wealthy class\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>부유층\u003c/span>\u003c/div>\u003cdiv>\u003cb>show\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보여 주다, 드러내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>have to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~해야 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>paint\u003c/b>\u003cem>동사\u003c/em>\u003cspan>칠하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>custom\u003c/b>\u003cem>명사\u003c/em>\u003cspan>풍습, 관습\u003c/span>\u003c/div>\u003cdiv>\u003cb>oriental\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>동양의\u003c/span>\u003c/div>\u003cdiv>\u003cb>although\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>비록 ~이지만\u003c/span>\u003c/div>\u003cdiv>\u003cb>instead of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~대신에\u003c/span>\u003c/div>\u003cdiv>\u003cb>nail polish\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>매니큐어, 손톱용 도료\u003c/span>\u003c/div>\u003cdiv>\u003cb>natural\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>천연의, 자연의\u003c/span>\u003c/div>\u003cdiv>\u003cb>dye\u003c/b>\u003cem>명사\u003c/em>\u003cspan>염료\u003c/span>\u003c/div>\u003cdiv>\u003cb>coloring\u003c/b>\u003cem>명사\u003c/em>\u003cspan>채색, 염색\u003c/span>\u003c/div>\u003cdiv>\u003cb>rich\u003c/b>\u003cem>명사\u003c/em>\u003cspan>부자들\u003c/span>\u003c/div>\u003cdiv>\u003cb>poor\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>가난한\u003c/span>\u003c/div>\u003cdiv>\u003cb>look pretty\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>예쁘게 보이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>today\u003c/b>\u003cem>부사\u003c/em>\u003cspan>오늘날\u003c/span>\u003c/div>\u003cdiv>\u003cb>still\u003c/b>\u003cem>부사\u003c/em>\u003cspan>여전히\u003c/span>\u003c/div>\u003cdiv>\u003cb>be popular with\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에게 인기가 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>idle\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>할 일 없이 놀고 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>working women\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>일하는 여성들\u003c/span>\u003c/div>\u003cdiv>\u003cb>among\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~사이에서\u003c/span>\u003c/div>\u003cdiv>\u003cb>time\u003c/b>\u003cem>명사\u003c/em>\u003cspan>시간\u003c/span>\u003c/div>\u003cdiv>\u003cb>only\u003c/b>\u003cem>부사\u003c/em>\u003cspan>오직, 단지\u003c/span>\u003c/div>\u003cdiv>\u003cb>person\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사람\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어 몇 개만 짚을게요. wealthy는 부유한, ancient는 고대의라는 뜻이고 custom은 풍습, dye는 염료라는 의미입니다. idle은 할 일 없이 놀고 있는이라는 뜻으로, the idle rich는 할 일 없는 부자들로 해석하면 됩니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">wealthy\u003c/b>\u003cspan class=\"m\">부유한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">rich\u003c/span>\u003cspan class=\"s\">affluent\u003c/span>\u003cspan class=\"s\">well-off\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">poor\u003c/span>\u003cspan class=\"a\">needy\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">popular\u003c/b>\u003cspan class=\"m\">인기 있는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">well-liked\u003c/span>\u003cspan class=\"s\">favored\u003c/span>\u003cspan class=\"s\">in demand\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unpopular\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">ancient\u003c/b>\u003cspan class=\"m\">고대의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">old\u003c/span>\u003cspan class=\"s\">age-old\u003c/span>\u003cspan class=\"s\">antique\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">modern\u003c/span>\u003cspan class=\"a\">recent\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">custom\u003c/b>\u003cspan class=\"m\">풍습\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">tradition\u003c/span>\u003cspan class=\"s\">practice\u003c/span>\u003cspan class=\"s\">convention\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">poor\u003c/b>\u003cspan class=\"m\">가난한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">needy\u003c/span>\u003cspan class=\"s\">impoverished\u003c/span>\u003cspan class=\"s\">penniless\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">rich\u003c/span>\u003cspan class=\"a\">wealthy\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">idle\u003c/b>\u003cspan class=\"m\">할 일 없이 노는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">unoccupied\u003c/span>\u003cspan class=\"s\">inactive\u003c/span>\u003cspan class=\"s\">lazy\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">busy\u003c/span>\u003cspan class=\"a\">active\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">show\u003c/b>\u003cspan class=\"m\">보여 주다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">display\u003c/span>\u003cspan class=\"s\">reveal\u003c/span>\u003cspan class=\"s\">indicate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hide\u003c/span>\u003cspan class=\"a\">conceal\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어로 정리해 볼게요. wealthy의 동의어는 rich, affluent이고 반의어는 poor입니다. popular는 well-liked, favored와 가깝고 ancient는 old, age-old와 같은 뜻이에요. custom은 tradition, practice로 바꿔 쓸 수 있습니다. idle은 unoccupied, inactive와 통하고 반대말은 busy, active입니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">손톱은\u003c/span>\u003cspan class=\"en\">Fingernails\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한때 보여주었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">once \u003c/span>\u003cspan class=\"tgt\">showed\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">얼마나 부유한지를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">wealthy \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람이 ~한지를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">person \u003c/span>\u003cspan class=\"tgt\">was\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">손톱은 한때 사람이 얼마나 부유한지를 보여주었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 손톱이 한때 그 사람의 \u003cb class=\"key\">부유함\u003c/b>을 알려 주는 표시였다는 뜻이에요. 뒤에 나오는 how wealthy a person was는 '사람이 얼마나 부유한지'라는 뜻으로, 문장 속에 들어간 \u003cb class=\"key\">간접의문문\u003c/b>이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부사 once (과거 시점)\u003c/span> : 주어 + [부사 once] + 동사 : \"한때 보여주었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">간접의문문 (의문사 + 형용사 + 주어 + 동사)\u003c/span> : how + 형용사 + 주어 + 동사 (간접의문문 어순) : \"사람이 얼마나 부유한지\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Fingernails, 손톱은. once showed, 한때 보여주었다. how wealthy, 얼마나 부유한지를. a person was, 사람이 ~한지를. 이 문장 전체를 해석하면, 손톱은 한때 사람이 얼마나 부유한지를 보여주었다.","hl":"m"},{"n":13,"text":"이 문장은 손톱이 한때 그 사람의 부유함을 알려 주는 표시였다는 걸 말하고 있어요. 뒤에 나오는 how wealthy a person was는 사람이 얼마나 부유한지라는 뜻으로, 문장 속에 들어간 간접의문문이에요.","hl":"mn"},{"n":14,"text":"첫 번째로 how wealthy a person was를 보세요. how가 이끄는 간접의문문이라서 how 다음에 형용사 wealthy가 오고, 그 뒤에 주어 a person, 동사 was 순서로 가는 어순을 지켜요. 직접의문문이라면 how wealthy was a person처럼 동사가 먼저 나왔겠죠. 두 번째로 once는 한때, 예전에라는 뜻을 가진 부사예요. 그래서 뒤에 오는 동사가 showed라는 과거형으로 쓰인 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고대 중국에서는\u003c/span>\u003cspan class=\"en\">In ancient China,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">손톱을 길게 기르는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">growing \u003c/span>\u003cspan class=\"tgt\">one's \u003c/span>\u003cspan class=\"tgt\">fingernails \u003c/span>\u003cspan class=\"tgt\">long\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인기였다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">popular \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">부유층 사이에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">among\u003c/span> the wealthy class.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">고대 중국에서는 손톱을 길게 기르는 것이 부유층 사이에서 인기였다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 고대 중국에서 손톱을 길게 기르는 풍습이 \u003cb class=\"key\">부유층\u003c/b>에서 유행했다는 걸 알려 줘요. 앞 문장에서 손톱이 부를 보여 준다고 했으니, 여기서는 그 \u003cb class=\"key\">예시\u003c/b>를 들어 주는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사구 주어 + 목적격 보어\u003c/span> : [growing + one's + 목적어 + 형용사(long)] + 단수 동사 : \"손톱을 길게 기르는 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주어-동사 수 일치 &amp; 전치사 among\u003c/span> : 동명사구 주어 + [단수 동사 was] + popular among + 명사 : \"~ 사이에서 인기였다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"In ancient China, 고대 중국에서는. growing one's fingernails long, 손톱을 길게 기르는 것은. was popular, 인기였다. among the wealthy class, 부유층 사이에서. 이 문장 전체를 해석하면, 고대 중국에서는 손톱을 길게 기르는 것이 부유층 사이에서 인기였다.","hl":"m"},{"n":16,"text":"이 문장은 고대 중국에서 손톱을 길게 기르는 풍습이 부유층에서 유행했다는 걸 알려 줘요. 앞 문장에서 손톱이 부를 보여 준다고 했으니, 여기서는 그 예시를 들어 주는 역할을 해요.","hl":"mn"},{"n":17,"text":"먼저 growing one's fingernails long을 보면, 동사 grow가 동명사 growing으로 바뀌어서 문장의 주어 자리에 앉았어요. 그리고 long은 목적어 fingernails를 꾸며 주는 목적격 보어로, 손톱을 길게 기른다는 뜻을 만들어 줍니다. 두 번째로 주어가 동명사구 하나이기 때문에 동사는 단수인 was로 받아야 해요. among은 부유층이라는 집단 사이에서라는 뜻으로 쓰였습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 보여주었다\u003c/span>\u003cspan class=\"en\">It showed\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 사람이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">person \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일할 필요가 없음을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">didn't \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">work\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 그 사람이 일할 필요가 없음을 보여주었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 말한 긴 손톱이 결국 그 사람이 일하지 않아도 된다는 사실을 증명한다는 뜻이에요. so 대신 that절로 내용을 풀어 놓아, 앞 문장의 \u003cb class=\"key\">이유\u003c/b>를 설명해 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that의 명사절 (목적어)\u003c/span> : 주어 + 동사 showed + [that + 주어 + 동사] (명사절/목적어) : \"그 사람이 일할 필요가 없음(을)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">have to의 부정 (필요 없음)\u003c/span> : [didn't have to + 동사원형] = ~할 필요가 없었다 : \"일할 필요가 없었다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"It showed, 그것은 보여주었다. that the person, 그 사람이. didn't have to work, 일할 필요가 없음을. 이 문장 전체를 해석하면, 그것은 그 사람이 일할 필요가 없음을 보여주었다.","hl":"m"},{"n":19,"text":"이 문장은 긴 손톱을 기른 사람이 결국 일하지 않아도 된다는 걸 보여 준다는 뜻이에요. 그래서 앞 문장의 이유를 풀어 주는 역할을 하는 문장입니다.","hl":"mn"},{"n":20,"text":"먼저 that the person didn't have to work에서 that은 ~라는 것이라는 뜻으로 문장을 묶어 주는 접속사예요. 이 that절 전체가 showed의 목적어 자리에 들어가고, 해석할 때 that은 따로 옮기지 않습니다. 두 번째로 didn't have to는 하면 안 된다가 아니라 할 필요가 없다는 뜻이에요. 금지를 뜻하는 must not과 헷갈리면 안 되고, 과거에는 didn't have to로 필요 없음을 표현해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여자들의 손톱을 빨갛게 칠하는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Painting \u003c/span>\u003cspan class=\"tgt\">women's \u003c/span>\u003cspan class=\"tgt\">fingernails \u003c/span>\u003cspan class=\"tgt\">red\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">동양의 또 다른 오랜 풍습이었다\u003c/span>\u003cspan class=\"en\">was another old oriental custom,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">비록 매니큐어 대신\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">although \u003c/span>\u003cspan class=\"tgt\">instead \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">nail \u003c/span>\u003cspan class=\"tgt\">polish, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">(서양과 달리) 여자들이 헤나를 사용하긴 했지만\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">women \u003c/span>\u003cspan class=\"tgt\">used \u003c/span>\u003cspan class=\"tgt\">henna\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">적갈색 천연 염료인\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">natural \u003c/span>\u003cspan class=\"tgt\">red \u003c/span>\u003cspan class=\"tgt\">dye\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">매니큐어 대신 (서양과 달리) 여자들이 적갈색 천연 염료인 헤나를 사용하긴 했지만, 여자들이 손톱을 빨갛게 칠하는 것은 동양의 또 다른 오랜 풍습이었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 중국 이야기를 \u003cb class=\"key\">동양\u003c/b> 전체로 넓혀 주는 문장이에요. 빨간 손톱이 한 나라만의 풍습이 아니라 동양의 오랜 관습이었고, 매니큐어 대신 \u003cb class=\"key\">헤나\u003c/b>라는 천연 염료를 썼다는 점을 덧붙입니다. 결국 손톱 꾸미기가 예로부터 \u003cb class=\"key\">부유함\u003c/b>의 표시였다는 큰 흐름을 이어 주는 역할이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사구 주어(동명사 + 목적어 + 목적격 보어)\u003c/span> : [Painting(동명사) + 목적어 women's fingernails + 목적격 보어 red] + 단수 동사 was : \"여자들의 손톱을 빨갛게 칠하는 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">양보의 접속사 although\u003c/span> : although + [주어 + 동사] , 주절 : \"비록 매니큐어 대신 여자들이 헤나를 사용하긴 했지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동격(콤마 동격)\u003c/span> : [henna] , [a natural red dye(동격어)] : \"적갈색 천연 염료인\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Painting women's fingernails red, 여자들의 손톱을 빨갛게 칠하는 것은. was another old oriental custom, 동양의 또 다른 오랜 풍습이었다. although instead of nail polish, 비록 매니큐어 대신. women used henna, (서양과 달리) 여자들이 헤나를 사용하긴 했지만. a natural red dye, 적갈색 천연 염료인. 이 문장 전체를 해석하면, 매니큐어 대신 (서양과 달리) 여자들이 적갈색 천연 염료인 헤나를 사용하긴 했지만, 여자들이 손톱을 빨갛게 칠하는 것은 동양의 또 다른 오랜 풍습이었다.","hl":"m"},{"n":22,"text":"이 문장은 손톱 이야기를 동양 전체로 넓혀 주는 역할을 해요. 빨간 손톱이 한 나라만의 풍습이 아니라 동양의 오랜 관습이었다는 것, 그리고 매니큐어 대신 헤나라는 천연 염료를 썼다는 내용이죠. 결국 손톱을 꾸미는 일이 예로부터 부유함의 표시였다는 큰 흐름으로 읽으시면 돼요.","hl":"mn"},{"n":23,"text":"첫 번째, 문장 앞에 나온 Painting women's fingernails red는 동명사구 주어예요. 동명사구가 주어가 되면 단수로 보기 때문에 was가 온다는 점을 꼭 받아 적으세요. 두 번째, 콤마로 이어진 a natural red dye는 앞의 henna를 설명하는 동격이에요. 세 번째, although는 비록 그럴지라도라는 양보 접속사로 뒤에 절이 온다는 것도 챙겨 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">손톱을 채색하는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Coloring \u003c/span>\u003cspan class=\"tgt\">one's \u003c/span>\u003cspan class=\"tgt\">nails\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또한 부자들만을 위한 것이었다\u003c/span>\u003cspan class=\"en\">was also only for the rich,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가난한 사람들은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">poor \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예쁘게 보일 시간이 없었기 때문이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">no \u003c/span>\u003cspan class=\"tgt\">time \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">look \u003c/span>\u003cspan class=\"tgt\">pretty\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">손톱 채색 또한 부자들만을 위한 것이었는데, 가난한 사람들은 예쁘게 보일 시간이 없었기 때문이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 내용을 다시 \u003cb class=\"key\">부\u003c/b>와 연결 짓는 문장이에요. 손톱을 채색하는 것 역시 \u003cb class=\"key\">부자들만의 \u003c/b>\u003cb class=\"key\">것\u003c/b>이었고, 그 이유는 가난한 사람들에게 예쁘게 꾸밀 \u003cb class=\"key\">시간\u003c/b>이 없었기 때문이라고 설명합니다. '가난한 사람은 일하느라 바쁘다'는 대비가 글 전체를 관통하죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사구 주어\u003c/span> : [Coloring(동명사) + 목적어 one's nails] + 단수 동사 was : \"손톱을 채색하는 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이유를 나타내는 접속사 as\u003c/span> : 주절 + as + [이유를 나타내는 절] : \"가난한 사람들은 예쁘게 보일 시간이 없었기 때문이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법(명사 수식)\u003c/span> : have no [time] + [to look pretty(to부정사구/형용사적)] : \"예쁘게 보일 시간이 없었다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Coloring one's nails, 손톱을 채색하는 것은. was also only for the rich, 또한 부자들만을 위한 것이었다. as poor people, 가난한 사람들은. had no time to look pretty, 예쁘게 보일 시간이 없었기 때문이다. 이 문장 전체를 해석하면, 손톱 채색 또한 부자들만을 위한 것이었는데, 가난한 사람들은 예쁘게 보일 시간이 없었기 때문이다.","hl":"m"},{"n":25,"text":"이 문장은 앞에서 말한 손톱 채색이 결국 부와 연결된다는 점을 다시 한 번 못 박아 주는 문장이에요. 가난한 사람들은 일하느라 예쁘게 꾸밀 시간이 없었다는 이유까지 붙여서, 부자들만의 것이라는 결론을 더 단단하게 만들어 주죠.","hl":"mn"},{"n":26,"text":"먼저 Coloring one's nails는 동명사구 주어예요. 그래서 뒤에 단수 동사 was가 왔다는 점을 짚어 주세요. 두 번째, as는 여기서 가난한 사람들은 시간이 없었다는 이유를 이끄는 접속사로 쓰였어요. 세 번째, had no time to look pretty에서 to look pretty는 앞의 time을 꾸며 주는 형용사적 용법의 to부정사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오늘날\u003c/span>\u003cspan class=\"en\">Today,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">긴 손톱은 여전히 여자들에게 인기가 있으며\u003c/span>\u003cspan class=\"en\">long nails are still popular with women,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들은 여전히 더 인기가 있다\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">they\u003c/span> are still \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">popular \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">할 일 없는 부자들에게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">idle \u003c/span>\u003cspan class=\"tgt\">rich \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일하는 여성들보다는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">working \u003c/span>\u003cspan class=\"tgt\">women\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">오늘날 긴 손톱은 여자들에게 여전히 인기가 있으며, 일하는 여성들보다는 할 일 없는 부자들에게 더 인기가 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 과거 이야기를 \u003cb class=\"key\">오늘날\u003c/b>로 가져와 마무리하는 문장이에요. 긴 손톱은 여전히 여성들에게 인기가 있지만, \u003cb class=\"key\">일하는 \u003c/b>\u003cb class=\"key\">여성\u003c/b>보다 \u003cb class=\"key\">할 \u003c/b>\u003cb class=\"key\">일 \u003c/b>\u003cb class=\"key\">없는 \u003c/b>\u003cb class=\"key\">부자\u003c/b>들에게 더 인기가 있다는 점에서 옛날과 크게 다르지 않다고 정리합니다. '손톱 = 신분의 표시'라는 처음 주제로 되돌아오는 마무리 역할이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">대명사 지칭(문맥 지시)\u003c/span> : [they] → 앞에 나온 [long nails]를 지칭 : \"그것들은(긴 손톱은)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">비교급 비교(more ~ than ...)\u003c/span> : more + [형용사 popular] + with A + than + with B : \"일하는 여성들보다 할 일 없는 부자들에게 더 인기가 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">the + 형용사(복수 보통명사)\u003c/span> : the + [형용사 idle] + [형용사 rich] = 복수 보통명사 : \"할 일 없는 부자들\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Today, 오늘날. long nails are still popular with women, 긴 손톱은 여전히 여자들에게 인기가 있으며. and they are still more popular, 그것들은 여전히 더 인기가 있다. with the idle rich, 할 일 없는 부자들에게. than with working women, 일하는 여성들보다는. 이 문장 전체를 해석하면, 오늘날 긴 손톱은 여자들에게 여전히 인기가 있으며, 일하는 여성들보다는 할 일 없는 부자들에게 더 인기가 있다.","hl":"m"},{"n":28,"text":"이 문장은 과거 이야기를 오늘날로 가져와 마무리해요. 긴 손톱이 여전히 여성들에게 인기가 있지만, 일하는 여성들보다 할 일 없는 부자들에게 더 인기가 있다는 거죠. 결국 손톱이 신분의 표시라는 처음 주제로 다시 돌아오는 문장이에요.","hl":"mn"},{"n":29,"text":"첫 번째, more popular with the idle rich than with working women은 비교급 비교 표현이에요. more와 than 사이에 형용사 popular가 오고, 비교 대상은 with로 나란히 맞춰 준다는 점을 기억하세요. 두 번째, the idle rich는 the에 형용사가 붙어 부자들이라는 복수 보통명사가 된 표현이에요. 세 번째, they는 앞에 나온 long nails를 가리키는 대명사예요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>손톱은 한때 사람이 얼마나 \u003cb class=\"key\">부유\u003c/b>한지를 보여 주는 지표였다.\u003c/li>\u003cli>고대 중국의 부유층은 \u003cb class=\"key\">일할 \u003c/b>\u003cb class=\"key\">필요\u003c/b>가 없음을 드러내기 위해 손톱을 길게 길렀다.\u003c/li>\u003cli>손톱을 빨갛게 칠하는 것도 동양의 오랜 \u003cb class=\"key\">풍습\u003c/b>이었지만, 가난한 사람들은 예쁘게 보일 \u003cb class=\"key\">시간\u003c/b>이 없어 부자들만의 것이었다.\u003c/li>\u003cli>오늘날에도 긴 손톱은 여전히 인기가 있지만, \u003cb class=\"key\">일하는 \u003c/b>\u003cb class=\"key\">여성\u003c/b>보다 할 일 없는 부자들에게 더 인기가 있다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Long and colored fingernails have long been a sign of wealth, showing that a person does not have to work.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">손톱은 한때 사람이 얼마나 \u003cb class=\"key\">부유\u003c/b>한지를 보여 주는 지표였고, 고대 중국의 부유층은 일할 필요가 없음을 드러내기 위해 손톱을 길게 길렀다. 오늘날에도 긴 손톱은 여전히 여성들에게 인기가 있지만, \u003cb class=\"key\">일하는 \u003c/b>\u003cb class=\"key\">여성\u003c/b>보다 할 일 없는 부자들에게 더 인기가 있다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":30,"text":"오늘 글의 핵심을 다시 정리해 볼게요. 손톱은 과거에 부유함의 표시였고, 그 의미는 오늘날에도 이어지고 있습니다. 시간 표현과 재진술 표현을 잘 따라가면 이런 글은 아주 쉽게 정리됩니다. 오늘도 수고했어요, 다음 강의에서 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
