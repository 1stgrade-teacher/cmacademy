<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SO 레벨1 15강 적용독해01 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-sno{font-size:13px;color:#8493A1;font-weight:700;margin-bottom:8px}

.lp-chunk{display:flex;flex-direction:column}
.lp-chunk .ko{font-size:13px;color:var(--pk-t);font-weight:700;line-height:1.3;margin-bottom:2px}
.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}
.lp-top::before{height:5px;background:linear-gradient(90deg,var(--pk) 0,var(--pk) 80%,var(--am) 80%,var(--am) 100%)}
.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}
.lp-tag{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700;padding:2px 12px}
.lp-qn{flex:0 0 112px;height:112px;align-self:center;background:#fff;color:var(--pk);border:3px solid var(--pk);border-radius:50%;font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;font-size:26px}
.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}
.lp-qn .qt{display:block;white-space:nowrap;line-height:1.12;letter-spacing:-.02em}
.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}

.lp-st h4{color:var(--ink,#1B2733)}
.lp-st h4 i{border-radius:4px;width:auto;min-width:24px;padding:0 4px}
.lp-pill{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700}
.lp-chain span.c{background:#fff;border:1px solid #AEBBE6;border-radius:3px;font-weight:600}

.lp-vg em{background:#fff;border:1px solid var(--pk-b);border-radius:3px}
.lp-sa>div{border-radius:4px;border-color:var(--pk-b)}

.lp-chips .s{border:1px solid #AEBBE6;color:#3A4FA3}
.lp-chips .a{border:1px solid var(--am-b);color:var(--am-d);background:#FFFBF2}
.lp-sno .es{background:var(--am);border-radius:2px;font-weight:700}
.lp-chunk .en{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:600}
.lp-chunk+.lp-chunk{border-left:1px solid var(--pk-b)}
.lp .tgt{background:var(--am-l);border-bottom:2.5px dotted var(--am)}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"SO 레벨1 15강 적용독해01","audioDir":"15-01_audio","preview":false,"count":39,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">15강\u003cbr>적용독해01\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">SO 레벨1\u003c/div>\u003ch1>Teens Need a Consultant, Not a Manager\u003c/h1>\u003ch2>청소년에게는 관리자가 아니라 상담자가 필요하다\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>부모의 충고를 싫어하는 청소년들에게는 관리자가 아니라 상담자가 필요하다. 기업 상담자처럼 주의 깊게 듣고 고객이 문제를 완전히 이해하도록 돕듯, 부모도 아이가 상황을 잘 생각해 보고 \u003cb class=\"key\">스스로 \u003c/b>\u003cb class=\"key\">해결책\u003c/b>을 찾도록 도와주어야 한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Parents should act as consultants who listen carefully and help their teens think through problems and find their own solutions rather than giving advice.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 청소년 자녀와 부모의 소통에 관한 글이에요. 부모가 아무리 좋은 충고를 해도 싫어하는 청소년들에게 정말 필요한 것은 관리자가 아니라 상담자라는 내용이죠. 기업 상담자의 태도를 빌려 부모가 어떻게 행동해야 하는지 알려 주는 글입니다. 그럼 힘차게 시작해 볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">청소년기는 판단과 조절을 담당하는 전두엽, 즉 prefrontal cortex가 아직 발달 중인 시기예요. 그래서 부모가 정답을 알려 주어도 아이는 그것을 지시나 통제로 받아들이기 쉽죠. 심리학에서는 이런 반발을 \u003cb class=\"key\">심리적 \u003c/b>\u003cb class=\"key\">반항\u003c/b>, 영어로 psychological reactance라고 부르는데, 스스로 선택하고 싶은 욕구가 강할수록 커집니다. 기업에서 컨설턴트 consultant는 답을 주는 사람이 아니라 고객이 답을 찾도록 돕는 사람이에요. 마치 요리할 때 완성된 음식을 건네는 것보다 함께 재료를 살펴보며 레시피를 찾아 주는 편이 더 오래 남는 것과 비슷하죠. 그래서 이 글은 부모의 역할을 \u003cb class=\"key\">관리자\u003c/b>에서 \u003cb class=\"key\">상담자\u003c/b>로 바꾸라고 말합니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 조금 알고 가면 훨씬 편해요. 청소년기는 판단과 조절을 담당하는 전두엽, 즉 prefrontal cortex가 아직 발달 중인 시기예요. 그래서 부모가 정답을 알려 주어도 아이는 그것을 지시나 통제로 받아들이기 쉽죠. 심리학에서는 이런 반발을 심리적 반항, 영어로 psychological reactance라고 부르는데, 스스로 선택하고 싶은 욕구가 강할수록 커집니다. 기업에서 컨설턴트 consultant는 답을 주는 사람이 아니라 고객이 답을 찾도록 돕는 사람이에요. 마치 요리할 때 완성된 음식을 건네는 것보다 함께 재료를 살펴보며 레시피를 찾아 주는 편이 더 오래 남는 것과 비슷하죠. 그래서 이 글은 부모의 역할을 관리자에서 상담자로 바꾸라고 말합니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>충고를 싫어하는 청소년\u003csmall>통념 · 문장 1\u003c/small>\u003c/h4>\u003cp>부모가 충고를 하면 그게 좋은 충고라도 청소년들은 싫어한다는 \u003cb class=\"key\">통념\u003c/b>에서 글이 출발해요. 내용이 나쁘지 않아도 방식이 문제라는 뜻이죠. 그래서 이 글은 무엇을 말하느냐보다 어떻게 돕느냐로 논점을 옮겨 갑니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>상담자가 필요하다\u003csmall>주장 · 문장 2\u003c/small>\u003c/h4>\u003cp>청소년들을 연구하는 한 심리학자가 청소년들에게는 관리자가 아니라 \u003cb class=\"key\">상담자\u003c/b>가 필요하다고 말한 바 있다는 내용이에요. manager와 consultant를 \u003cb class=\"key\">대조\u003c/b>하며 글 전체의 핵심 구도를 미리 던져 주죠. 이 한 문장이 글의 방향을 정하는 \u003cb class=\"key\">주제\u003c/b> 역할을 합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>기업 상담자의 방식\u003csmall>예시 · 문장 3–6\u003c/small>\u003c/h4>\u003cp>기업 상담자가 하는 일을 생각해 보라고 하며 \u003cb class=\"key\">비유\u003c/b>를 시작해요. 그들은 무작정 뛰어들어 변화를 제안하지 않고, 주의 깊게 고객의 말에 귀 기울이며 고객이 직면한 문제를 완전히 이해하도록 도와줍니다. 누군가 잘못을 했을 때 충고하겠다고 급하게 뛰어들지 않는 게 중요하다는 점도 짚죠. 결국 좋은 조력자는 답을 주는 사람이 아니라 \u003cb class=\"key\">이해\u003c/b>를 돕는 사람이라는 겁니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>청소년에게 적용\u003csmall>결론 · 문장 7–9\u003c/small>\u003c/h4>\u003cp>마찬가지로 청소년들도 자신의 실수나 그것을 바로잡기 위해 해야 하는 것에 대한 얘기를 듣고 싶어 하지 않는다고 \u003cb class=\"key\">적용\u003c/b>해요. 그보다 부모들은 아이들이 상황을 잘 생각해 보고 \u003cb class=\"key\">스스로\u003c/b> 해결책을 찾도록 도와주어야 합니다. 그러면 종종 아이들이 스스로 찾아낸 해결책으로 부모를 \u003cb class=\"key\">감동\u003c/b>시킨다는 긍정적 결과까지 제시하며 글을 맺죠.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 지금부터 글의 흐름을 네 단계로 나누어 따라가 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 충고를 싫어하는 청소년이라는 통념이에요. 부모가 충고를 하면 그게 좋은 충고라도 청소년들은 싫어한다는 데서 글이 출발하죠. 내용이 나쁘지 않아도 방식이 문제라는 뜻이에요. 그래서 이 글은 무엇을 말하느냐보다 어떻게 돕느냐로 논점을 옮겨 갑니다.","hl":"f0"},{"n":5,"text":"두 번째 단계는 상담자가 필요하다는 주장이에요. 청소년들을 연구하는 한 심리학자가 청소년들에게는 관리자가 아니라 상담자가 필요하다고 말한 바 있다고 하죠. manager와 consultant를 대조하면서 글 전체의 핵심 구도를 미리 던져 줍니다. 이 한 문장이 글의 방향을 정하는 주제 역할을 해요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 기업 상담자의 방식이라는 예시예요. 기업 상담자가 하는 일을 생각해 보라고 하면서 비유를 시작하죠. 그들은 무작정 뛰어들어 변화를 제안하지 않고, 주의 깊게 고객의 말에 귀 기울이며 고객이 직면한 문제를 완전히 이해하도록 도와줍니다. 누군가 잘못을 했을 때 충고하겠다고 급하게 뛰어들지 않는 게 중요하다는 점도 짚어요. 결국 좋은 조력자는 답을 주는 사람이 아니라 이해를 돕는 사람이라는 겁니다.","hl":"f2"},{"n":7,"text":"네 번째 단계는 청소년에게 적용하는 결론이에요. 마찬가지로 청소년들도 자신의 실수나 그것을 바로잡기 위해 해야 하는 것에 대한 얘기를 듣고 싶어 하지 않는다고 적용하죠. 그보다 부모들은 아이들이 상황을 잘 생각해 보고 스스로 해결책을 찾도록 도와주어야 합니다. 그러면 종종 아이들이 스스로 찾아낸 해결책으로 부모를 감동시킨다는 긍정적인 결과까지 제시하며 글을 맺어요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">비유\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 8번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 청소년은 충고를 싫어한다는 통념을 먼저 제시한 뒤, 기업 상담자라는 \u003cb class=\"key\">비유\u003c/b>를 빌려 부모의 바람직한 역할을 설명해요. 상담자의 태도가 마지막에 청소년 상황으로 \u003cb class=\"key\">적용\u003c/b>되면서 주장이 완성되죠. 글의 결론인 부모가 아이의 \u003cb class=\"key\">스스로\u003c/b> 해결을 도와야 한다는 내용이 뒤쪽에 나오므로 \u003cb class=\"key\">미괄식\u003c/b> 구조로 볼 수 있어요. 그래서 마지막 문장까지 읽으며 \u003cb class=\"key\">주제문\u003c/b>을 확정해야 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003c/div>","segs":[{"n":8,"text":"이 글은 통념을 제시한 뒤 비유를 통해 주장을 뒷받침하는 비유 전개 방식이에요. 기업 상담자라는 비유가 부모의 역할을 설명하는 도구로 쓰이고, 마지막에 청소년 상황에 적용됩니다. 글의 결론인 부모가 아이의 스스로 해결을 도와야 한다는 내용이 뒤쪽에 나오니까 미괄식 구조로 보는 게 자연스러워요. 그래서 마지막 문장까지 읽으면서 주제문을 확정해야 합니다.","hl":"ty"},{"n":9,"text":"신호어를 짚어 볼게요. 첫 번째 문장의 even if는 양보를 나타내서, 좋은 충고여도 싫다는 뜻을 만들어 줍니다. 세 번째 문장의 Think about은 예시를 도입하는 표현이고, 일곱 번째 문장의 Likewise는 앞의 기업 상담자 이야기와 청소년 이야기를 나란히 놓는 연결어예요. 여덟 번째 문장의 Rather는 앞 내용을 정정하며 진짜 주장으로 방향을 트는 결정적 신호입니다. 그리고 give them advice, suggest changes, jump in with advice가 모두 같은 개념을 바꿔 말한 재진술이라는 점도 눈여겨보세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>advice\u003c/b>\u003cem>명사\u003c/em>\u003cspan>충고, 조언\u003c/span>\u003c/div>\u003cdiv>\u003cb>psychologist\u003c/b>\u003cem>명사\u003c/em>\u003cspan>심리학자\u003c/span>\u003c/div>\u003cdiv>\u003cb>study\u003c/b>\u003cem>동사\u003c/em>\u003cspan>연구하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>recently\u003c/b>\u003cem>부사\u003c/em>\u003cspan>최근에\u003c/span>\u003c/div>\u003cdiv>\u003cb>manager\u003c/b>\u003cem>명사\u003c/em>\u003cspan>관리자\u003c/span>\u003c/div>\u003cdiv>\u003cb>consultant\u003c/b>\u003cem>명사\u003c/em>\u003cspan>상담자, 컨설턴트\u003c/span>\u003c/div>\u003cdiv>\u003cb>think about\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 생각하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>jump in\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>(말에) 끼어들다, 뛰어들다\u003c/span>\u003c/div>\u003cdiv>\u003cb>suggest\u003c/b>\u003cem>동사\u003c/em>\u003cspan>제안하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>change\u003c/b>\u003cem>명사\u003c/em>\u003cspan>변화\u003c/span>\u003c/div>\u003cdiv>\u003cb>carefully\u003c/b>\u003cem>부사\u003c/em>\u003cspan>주의 깊게\u003c/span>\u003c/div>\u003cdiv>\u003cb>client\u003c/b>\u003cem>명사\u003c/em>\u003cspan>고객\u003c/span>\u003c/div>\u003cdiv>\u003cb>fully\u003c/b>\u003cem>부사\u003c/em>\u003cspan>완전히\u003c/span>\u003c/div>\u003cdiv>\u003cb>understand\u003c/b>\u003cem>동사\u003c/em>\u003cspan>이해하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>problem\u003c/b>\u003cem>명사\u003c/em>\u003cspan>문제\u003c/span>\u003c/div>\u003cdiv>\u003cb>face\u003c/b>\u003cem>동사\u003c/em>\u003cspan>직면하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>important\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>중요한\u003c/span>\u003c/div>\u003cdiv>\u003cb>mistake\u003c/b>\u003cem>명사\u003c/em>\u003cspan>실수, 잘못\u003c/span>\u003c/div>\u003cdiv>\u003cb>likewise\u003c/b>\u003cem>부사\u003c/em>\u003cspan>마찬가지로\u003c/span>\u003c/div>\u003cdiv>\u003cb>tell\u003c/b>\u003cem>동사\u003c/em>\u003cspan>말하다, 알려 주다\u003c/span>\u003c/div>\u003cdiv>\u003cb>fix\u003c/b>\u003cem>동사\u003c/em>\u003cspan>바로잡다, 고치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>rather\u003c/b>\u003cem>부사\u003c/em>\u003cspan>그보다, 오히려\u003c/span>\u003c/div>\u003cdiv>\u003cb>situation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>상황\u003c/span>\u003c/div>\u003cdiv>\u003cb>solution\u003c/b>\u003cem>명사\u003c/em>\u003cspan>해결책\u003c/span>\u003c/div>\u003cdiv>\u003cb>on their own\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>스스로, 혼자 힘으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>often\u003c/b>\u003cem>부사\u003c/em>\u003cspan>종종\u003c/span>\u003c/div>\u003cdiv>\u003cb>impress\u003c/b>\u003cem>동사\u003c/em>\u003cspan>감동시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>find\u003c/b>\u003cem>동사\u003c/em>\u003cspan>찾다, 발견하다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어 몇 개만 짚고 갈게요. consultant는 상담자, 컨설턴트라는 뜻이고 manager는 관리자예요. jump in은 말에 끼어들다, 뛰어들다는 의미로 이 글에서 정말 중요한 표현이고, suggest changes는 변화를 제안하다는 뜻이죠. on their own은 스스로라는 숙어로, 해결의 주체가 부모가 아니라 아이임을 보여 줍니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">advice\u003c/b>\u003cspan class=\"m\">충고, 조언\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">guidance\u003c/span>\u003cspan class=\"s\">counsel\u003c/span>\u003cspan class=\"s\">recommendation\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">suggest\u003c/b>\u003cspan class=\"m\">제안하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">propose\u003c/span>\u003cspan class=\"s\">recommend\u003c/span>\u003cspan class=\"s\">offer\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">mistake\u003c/b>\u003cspan class=\"m\">실수\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">error\u003c/span>\u003cspan class=\"s\">fault\u003c/span>\u003cspan class=\"s\">blunder\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">correction\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">solution\u003c/b>\u003cspan class=\"m\">해결책\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">answer\u003c/span>\u003cspan class=\"s\">resolution\u003c/span>\u003cspan class=\"s\">remedy\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">problem\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">fully\u003c/b>\u003cspan class=\"m\">완전히\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">completely\u003c/span>\u003cspan class=\"s\">entirely\u003c/span>\u003cspan class=\"s\">thoroughly\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">partly\u003c/span>\u003cspan class=\"a\">partially\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">important\u003c/b>\u003cspan class=\"m\">중요한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">significant\u003c/span>\u003cspan class=\"s\">crucial\u003c/span>\u003cspan class=\"s\">essential\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">trivial\u003c/span>\u003cspan class=\"a\">minor\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">face\u003c/b>\u003cspan class=\"m\">직면하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">confront\u003c/span>\u003cspan class=\"s\">encounter\u003c/span>\u003cspan class=\"s\">meet\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">avoid\u003c/span>\u003cspan class=\"a\">evade\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"이제 시험에 자주 나오는 어휘를 동의어와 반의어로 정리해 볼게요. advice는 guidance, counsel과 뜻이 통하고, suggest는 propose, recommend로 바꿔 쓸 수 있어요. mistake는 error, blunder와 가깝고, solution은 answer, remedy와 이어지며 반대 개념은 problem이죠. fully는 completely, entirely와 같고 반대는 partly예요. important는 significant, essential과 같은 뜻이고 trivial, minor와는 반대라는 점도 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">청소년들은 그것을 싫어한다\u003c/span>\u003cspan class=\"en\">Teenagers \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">부모가 그들에게 충고를 할 때\u003c/span>\u003cspan class=\"en\">when parents \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">give \u003c/span>\u003cspan class=\"tgt\">them \u003c/span>\u003cspan class=\"tgt\">advice\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 좋은 충고일지라도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">even \u003c/span>\u003cspan class=\"tgt\">if \u003c/span>\u003cspan class=\"tgt\">it's \u003c/span>\u003cspan class=\"tgt\">good \u003c/span>\u003cspan class=\"tgt\">advice\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">부모가 충고를 하면 그게 좋은 충고라도 청소년들은 싫어한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 청소년들이 부모의 충고를 받아들이지 않는 태도를 제시하며, 뒤에 이어질 ‘상담자형 부모’ 주장의 배경을 만든다. 충고의 내용이 좋은지와 상관없이 \u003cb class=\"key\">조언 \u003c/b>\u003cb class=\"key\">방식\u003c/b> 자체가 문제가 될 수 있음을 강조한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가목적어 it\u003c/span> : like + [가목적어 it] + [when절] : \"그것을 싫어한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">4형식 동사 give\u003c/span> : give + [간접목적어 them] + [직접목적어 advice] : \"그들에게 충고를 해 주다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">양보의 접속사 even if\u003c/span> : even if + [주어 + 동사] : \"그것이 좋은 충고일지라도\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Teenagers don't like it, 청소년들은 그것을 싫어한다. when parents give them advice, 부모가 그들에게 충고를 할 때. even if it's good advice, 그것이 좋은 충고일지라도. 이 문장 전체를 해석하면, 부모가 충고를 하면 그게 좋은 충고라도 청소년들은 싫어한다.","hl":"m"},{"n":13,"text":"이 문장은 청소년들이 부모의 충고를 받아들이지 않는다는 점을 먼저 보여 줘요. 중요한 건 충고의 내용이 좋은지가 아니라, 부모가 일방적으로 조언하는 조언 방식 자체가 청소년에게 부담이 될 수 있다는 거예요. 그래서 뒤에서 상담자처럼 접근하는 부모가 필요하다는 주장의 배경이 됩니다.","hl":"mn"},{"n":14,"text":"첫째, don't like it에서 it은 뒤의 when절 내용을 받는 가목적어예요. 둘째, give them advice는 give가 간접목적어 them과 직접목적어 advice를 함께 데리는 구조죠. 셋째, even if it's good advice에서 even if는 양보를 나타내는 접속사로, 충고가 좋은 경우까지 인정하는 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">청소년들을 연구하는 한 심리학자가\u003c/span>\u003cspan class=\"en\">A psychologist \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">studies \u003c/span>\u003cspan class=\"tgt\">teenagers\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">최근 말한 바 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">recently \u003c/span>\u003cspan class=\"tgt\">said\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">청소년들은 관리자가 필요하지 않다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">teens \u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003cspan class=\"tgt\">need \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">manager\u003c/span>;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 상담자가 필요하다\u003c/span>\u003cspan class=\"en\">they need a consultant.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">청소년들을 연구하는 한 심리학자가 최근 청소년들은 관리자가 필요한 게 아니라 상담자가 필요하다고 말한 바 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글의 중심 주제문으로, 청소년에게 필요한 존재는 통제하는 관리자가 아니라 도움을 주는 상담자라는 관점을 제시한다. 뒤에 이어지는 기업 상담자의 태도 설명이 이 비유를 풀어 주는 근거가 된다. \u003cb class=\"key\">관리자\u003c/b>와 \u003cb class=\"key\">상담자\u003c/b>의 대비가 핵심이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 who\u003c/span> : [선행사] + who + [동사] : \"청소년들을 연구하는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재완료\u003c/span> : have/has + [과거분사] : \"최근 말한 바 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">접속사 that의 명사절\u003c/span> : said + that + [주어 + 동사] : \"청소년들은 관리자가 필요하지 않다고\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"A psychologist who studies teenagers, 청소년들을 연구하는 한 심리학자가. has recently said, 최근 말한 바 있다. that teens don't need a manager, 청소년들은 관리자가 필요하지 않다고. they need a consultant, 그들은 상담자가 필요하다. 이 문장 전체를 해석하면, 청소년들을 연구하는 한 심리학자가 최근 청소년들은 관리자가 필요한 게 아니라 상담자가 필요하다고 말한 바 있다.","hl":"m"},{"n":16,"text":"이 문장은 글의 중심 주제를 잡아 주는 문장이에요. 청소년에게 필요한 사람은 통제하는 관리자가 아니라, 스스로 답을 찾도록 도와주는 상담자라는 거죠. 뒤에서는 기업 상담자가 실제로 어떻게 행동하는지 설명하면서 이 주장을 뒷받침해요. 관리자와 상담자의 대비가 핵심입니다.","hl":"mn"},{"n":17,"text":"첫째, A psychologist who studies teenagers에서 who는 앞의 A psychologist를 꾸며 주는 주격 관계대명사예요. 둘째, has recently said는 현재완료로, 최근에 말했고 그 내용이 지금까지 이어지는 느낌을 줍니다. 셋째, that teens don't need a manager에서 that은 뒤 문장 전체를 목적어처럼 끌어오는 명사절 접속사죠. 그래서 심리학자가 말한 내용 전체가 that절 안에 들어가요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">생각해 보라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Think \u003c/span>\u003cspan class=\"tgt\">about\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기업 상담자가 하는 일을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">business \u003c/span>\u003cspan class=\"tgt\">consultants \u003c/span>\u003cspan class=\"tgt\">do\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">기업 상담자가 하는 일을 생각해 보라.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 독자에게 기업 상담자의 실제 행동을 떠올리게 하는 명령문이다. 추상적인 주장을 구체적인 비유로 바꾸어, 뒤에 나올 상담자의 특징을 자연스럽게 예고한다. \u003cb class=\"key\">기업 \u003c/b>\u003cb class=\"key\">상담자\u003c/b>의 역할이 이후 설명의 기준점이 된다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문\u003c/span> : [동사원형] + about + [목적어] : \"생각해 보라\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">간접의문문\u003c/span> : what + [주어] + [동사] : \"기업 상담자가 하는 일\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Think about, 생각해 보라. what business consultants do, 기업 상담자가 하는 일을. 이 문장 전체를 해석하면, 기업 상담자가 하는 일을 생각해 보라.","hl":"m"},{"n":19,"text":"이 문장은 독자에게 기업 상담자의 실제 행동을 떠올려 보라고 하는 명령문이에요. 앞에서 말한 상담자라는 개념을 구체적인 비유로 바꿔 주는 역할을 하죠. 그래서 뒤에 이어지는 기업 상담자의 특징이 앞으로 나올 부모의 역할을 이해하는 기준점이 됩니다.","hl":"mn"},{"n":20,"text":"첫째, Think about은 동사원형으로 시작하는 명령문이에요. 둘째, what business consultants do는 의문사 what 뒤에 주어와 동사가 오는 간접의문문이고, 전치사 about의 목적어 역할을 합니다. 그래서 기업 상담자가 하는 일이라는 명사처럼 해석돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은\u003c/span>\u003cspan class=\"en\">They\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무작정 준비 없이 뛰어들지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">jump \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 변화를 제안하지 않는다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">suggest\u003c/span> changes.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 무작정 준비 없이 뛰어들어 변화를 제안하지 않는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 꺼낸 \u003cb class=\"key\">비즈니스 \u003c/b>\u003cb class=\"key\">컨설턴트\u003c/b>가 실제로 어떻게 행동하는지 보여 주는 문장이에요. 상대의 상황을 파악하기도 전에 성급하게 \u003cb class=\"key\">끼어들어\u003c/b> 이것저것 바꾸자고 하지 않는다는 뜻이죠. 여기서 jump in은 '생각 없이 뛰어들다'라는 \u003cb class=\"key\">관용 \u003c/b>\u003cb class=\"key\">표현\u003c/b>으로 익혀 두세요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정어의 범위(병렬 동사구)\u003c/span> : don't + [동사구 A] + and + [동사구 B] : \"뛰어들지도, 제안하지도 않는다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">구동사(동사+부사)\u003c/span> : jump + in → 뛰어들다, 끼어들다 : \"무작정 뛰어들다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"They, 그들은. don't jump in, 무작정 준비 없이 뛰어들지. and suggest changes, 그리고 변화를 제안하지 않는다. 이 문장 전체를 해석하면, 그들은 무작정 준비 없이 뛰어들어 변화를 제안하지 않는다.","hl":"m"},{"n":22,"text":"앞에서 말한 컨설턴트가 실제로 어떻게 행동하는지 보여 주는 문장이에요. 상대 상황을 파악하기도 전에 성급하게 끼어들어서 이것저것 바꾸자고 하지 않는다는 뜻이죠. 여기서 jump in은 생각 없이 뛰어들다라는 관용 표현으로 기억해 두세요.","hl":"mn"},{"n":23,"text":"먼저 부정어의 범위를 짚을게요. don't 하나가 jump in과 suggest changes라는 두 동사구에 동시에 걸려요. 그래서 뛰어들지도 않고 제안하지도 않는다, 이렇게 두 가지가 모두 부정된다고 읽어야 합니다. 두 번째로 jump in은 동사 jump에 부사 in이 붙어서 대화나 상황에 성급하게 끼어들다라는 뜻을 만드는 구동사예요. in이 전치사가 아니라 부사라서 뒤에 목적어 없이 쓰인 점도 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 주의 깊게\u003c/span>\u003cspan class=\"en\">They carefully\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고객의 말에 귀 기울이며\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">listen \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">client\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그를 도와\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">help \u003c/span>\u003cspan class=\"tgt\">him \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">완전히 이해하도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">fully \u003c/span>\u003cspan class=\"tgt\">understand\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그가 직면한 문제가 무엇인지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">problem \u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">faces\u003c/span> .\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">주의 깊게 고객의 말에 귀 기울이며, 고객이 직면한 문제가 무엇인지 완전히 이해하도록 도움을 준다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 컨설턴트의 핵심 행동 두 가지를 담은 문장이에요. 먼저 고객의 말을 세심하게 \u003cb class=\"key\">경청\u003c/b>하고, 그다음 고객 스스로 자기 문제를 완전히 \u003cb class=\"key\">이해\u003c/b>하도록 돕는다는 흐름이죠. 답을 던져 주는 사람이 아니라 함께 생각하게 만드는 \u003cb class=\"key\">조력자\u003c/b>라는 점이 이 글 전체의 핵심 비유예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">자동사 listen + 전치사 to\u003c/span> : listen + to + [목적어] : \"고객의 말에 귀 기울이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">help + 목적어 + 동사원형(목적격보어)\u003c/span> : help + [목적어] + [(to 없는) 동사원형] : \"그가 완전히 이해하도록 돕다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 생략\u003c/span> : [선행사] + [(which/that) 생략] + [주어+동사] : \"그가 직면한 문제\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"They carefully, 그들은 주의 깊게. listen to a client, 고객의 말에 귀 기울이며. and help him, 그리고 그를 도와. fully understand, 완전히 이해하도록. the problem he faces, 그가 직면한 문제가 무엇인지. 이 문장 전체를 해석하면, 주의 깊게 고객의 말에 귀 기울이며, 고객이 직면한 문제가 무엇인지 완전히 이해하도록 도움을 준다.","hl":"m"},{"n":25,"text":"컨설턴트의 핵심 행동 두 가지를 담은 문장이에요. 먼저 고객의 말을 세심하게 경청하고, 그다음 고객 스스로 자기 문제를 완전히 이해하도록 돕는다는 흐름이죠. 답을 던져 주는 사람이 아니라 함께 생각하게 만드는 조력자라는 점이 이 글 전체의 핵심 비유예요.","hl":"mn"},{"n":26,"text":"첫 번째로 listen은 자동사라서 목적어를 데리고 올 때 전치사 to가 꼭 필요해요. listen a client처럼 쓰면 어법 오류가 되니 listen to a client로 기억하세요. 두 번째로 help는 목적어 뒤에 동사원형을 목적격보어로 데리는 동사예요. to부정사를 쓰면 to understand가 되지만 원형을 쓰면 to 생략이 일어난 형태랍니다. 세 번째로 the problem he faces에는 목적격 관계대명사가 생략되어 있어요. faces의 목적어가 앞의 선행사 the problem이기 때문에 생략이 가능한 구조예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 안다\u003c/span>\u003cspan class=\"en\">They know\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">중요한 것임을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">it's \u003c/span>\u003cspan class=\"tgt\">important \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">충고하겠다고 급하게 뛰어들지 않는 것이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">jump \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">advice\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">누군가가 잘못을 했을 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">someone \u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">made \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">mistake\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 누군가가 잘못을 했을 때 충고하겠다고 급하게 뛰어들지 않는 게 중요하다는 것을 알고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 컨설턴트가 지키는 원칙을 정리한 문장이에요. 누군가 \u003cb class=\"key\">실수\u003c/b>를 했을 때 충고부터 급하게 쏟아 내는 것은 도움이 되지 않는다는 것을 그들은 안다는 뜻이죠. 이 원칙이 바로 뒤에서 부모가 십 대 자녀에게 \u003cb class=\"key\">충고\u003c/b>를 아껴야 하는 이유로 이어진답니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가주어 it / 진주어 to부정사\u003c/span> : It is + [형용사] + [to부정사구(진주어)] : \"충고하겠다고 뛰어들지 않는 것이 중요하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부정(not + to부정사)\u003c/span> : not + to + [동사원형] : \"충고하겠다고 뛰어들지 않는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">시간 부사절 접속사 when + 현재완료\u003c/span> : when + [주어] + has/have + [과거분사] : \"누군가 잘못을 했을 때\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"They know, 그들은 안다. it's important, 중요한 것임을. not to jump in with advice, 충고하겠다고 급하게 뛰어들지 않는 것이. when someone has made a mistake, 누군가가 잘못을 했을 때. 이 문장 전체를 해석하면, 그들은 누군가가 잘못을 했을 때 충고하겠다고 급하게 뛰어들지 않는 게 중요하다는 것을 알고 있다.","hl":"m"},{"n":28,"text":"컨설턴트가 지키는 원칙을 정리한 문장이에요. 누군가 실수를 했을 때 충고부터 급하게 쏟아 내는 것은 도움이 되지 않는다는 것을 그들은 안다는 뜻이죠. 이 원칙이 바로 뒤에서 부모가 십 대 자녀에게 충고를 아껴야 하는 이유로 이어진답니다.","hl":"mn"},{"n":29,"text":"먼저 it은 해석하지 않는 가주어이고, 진짜 주어는 뒤에 있는 to부정사구예요. 긴 to부정사구를 뒤로 보내서 문장 균형을 맞춘 구조죠. 두 번째로 to부정사를 부정할 때는 not을 to부정사 바로 앞에 둡니다. to not보다 not to 형태가 훨씬 자연스럽고 시험에도 자주 나와요. 세 번째로 when은 ~할 때라는 시간 부사절을 이끌고, has made는 현재완료로 잘못을 해 버린 상태를 표현한 형태예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마찬가지로,\u003c/span>\u003cspan class=\"en\">Likewise,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">청소년들은 ~라는 얘기를 듣고 싶어 하지 않는다\u003c/span>\u003cspan class=\"en\">teenagers \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003cspan class=\"tgt\">want \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">told\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 실수에 대해\u003c/span>\u003cspan class=\"en\">about their mistakes\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또는 무엇을 해야 하는지\u003c/span>\u003cspan class=\"en\">or \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">should \u003c/span>\u003cspan class=\"tgt\">do\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 바로잡기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">fix \u003c/span>\u003cspan class=\"tgt\">them\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">마찬가지로, 청소년들은 자신의 실수나 그것을 바로잡기 위해 그들이 해야 하는 것에 대한 얘기를 듣고 싶어 하지 않는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 청소년은 자신의 실수를 지적받고 고치는 방법을 일방적으로 들으면 \u003cb class=\"key\">거부감\u003c/b>을 느낀다는 뜻이에요. 앞에서 말한 비즈니스 컨설턴트의 태도처럼, 부모도 문제를 곧바로 지적하기보다 아이가 \u003cb class=\"key\">스스로\u003c/b> 해결하도록 도와야 한다는 흐름을 이어 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 수동태\u003c/span> : don't want + [to be told] : \"그런 말을 듣고 싶어 하지 않는다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">간접의문문\u003c/span> : [what + they + should do] : \"그들이 무엇을 해야 하는지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : [to fix] + [them] : \"그것들을 바로잡기 위해\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Likewise, 마찬가지로. teenagers don't want to be told, 청소년들은 ~라는 얘기를 듣고 싶어 하지 않는다. about their mistakes, 자신의 실수에 대해. or what they should do, 또는 무엇을 해야 하는지. to fix them, 그것을 바로잡기 위해. 이 문장 전체를 해석하면, 마찬가지로, 청소년들은 자신의 실수나 그것을 바로잡기 위해 그들이 해야 하는 것에 대한 얘기를 듣고 싶어 하지 않는다.","hl":"m"},{"n":31,"text":"청소년은 자신의 실수를 지적받고 고치는 방법을 일방적으로 들으면 거부감을 느낀다는 뜻이에요. 앞에서 말한 비즈니스 컨설턴트의 태도처럼, 부모도 문제를 곧바로 지적하기보다 아이가 스스로 해결하도록 도와야 한다는 흐름을 이어 줍니다.","hl":"mn"},{"n":32,"text":"첫 번째 어법은 don't want to be told예요. want 뒤에 to be told가 와서 수동태로 듣는 대상이 된다는 뜻을 만들어요. 두 번째는 what they should do로, 의문사 뒤에 주어와 조동사가 오는 간접의문문이에요. 세 번째는 to fix them으로, to부정사가 바로잡기 위해라는 목적을 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그보다\u003c/span>\u003cspan class=\"en\">Rather,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">부모들은 아이들이 ~하도록 도와주어야 한다\u003c/span>\u003cspan class=\"en\">parents \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">need \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">help \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">teens \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상황을 잘 생각해보고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">think \u003c/span>\u003cspan class=\"tgt\">through \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">situation \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">해결책을 찾도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">find \u003c/span>\u003cspan class=\"tgt\">solutions\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">스스로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">own\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그보다 부모들은 아이들이 상황을 잘 생각해보고 스스로 해결책을 찾도록 도와주어야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 부모의 역할은 정답을 알려 주는 관리자가 아니라, 아이가 상황을 \u003cb class=\"key\">스스로\u003c/b> 헤아려 해결책을 찾도록 돕는 조언자라는 핵심 주장이에요. 앞 문장의 부정적 태도와 대비되는 \u003cb class=\"key\">해결 \u003c/b>\u003cb class=\"key\">중심\u003c/b> 태도를 제시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">need + to부정사\u003c/span> : need + [to help] : \"도와야 한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">help + 목적어 + 동사원형\u003c/span> : help + [their teens] + [think] : \"아이들이 생각하도록 돕다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동사구의 병렬\u003c/span> : [think through the situation] and [find solutions] : \"상황을 생각해 보고 해결책을 찾다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">관용표현(on one's own)\u003c/span> : on + [their] + own : \"스스로\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"Rather, 그보다. parents need to help their teens, 부모들은 아이들이 ~하도록 도와주어야 한다. think through the situation, 상황을 잘 생각해보고. and find solutions, 해결책을 찾도록. on their own, 스스로. 이 문장 전체를 해석하면, 그보다 부모들은 아이들이 상황을 잘 생각해보고 스스로 해결책을 찾도록 도와주어야 한다.","hl":"m"},{"n":34,"text":"부모의 역할은 정답을 알려 주는 관리자가 아니라, 아이가 상황을 스스로 헤아려 해결책을 찾도록 돕는 조언자라는 핵심 주장이에요. 앞 문장의 부정적 태도와 대비되는 해결 중심 태도를 제시합니다.","hl":"mn"},{"n":35,"text":"첫 번째는 need to help예요. need 뒤에 to부정사가 와서 해야 한다는 의무를 나타내요. 두 번째는 help their teens think인데, help 뒤에 목적어와 동사원형이 와서 아이들이 생각하도록 돕는다는 구조예요. 세 번째는 think through the situation and find solutions로, 두 동사구가 and로 병렬을 이루고 있어요. 네 번째는 on their own으로, 스스로라는 뜻의 관용표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">종종\u003c/span>\u003cspan class=\"en\">Often\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아이들은 당신에게 감동을 안겨줄 것이다\u003c/span>\u003cspan class=\"en\">they \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">impress \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">해결책으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">solutions \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 찾아내는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">find\u003c/span> .\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">종종 아이들은 스스로 해결책을 찾아내어 감동을 안겨줄 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아이가 스스로 찾은 해결책이 부모를 \u003cb class=\"key\">감동\u003c/b>시킬 수 있다는 뜻이에요. 부모가 정답을 주기보다 아이의 \u003cb class=\"key\">자율성\u003c/b>을 믿고 기다릴 때 좋은 결과가 나온다는 흐름을 마무리합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 will\u003c/span> : will + [impress] : \"감동을 안겨줄 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 with의 수단\u003c/span> : impress + [you] + with + [the solutions] : \"해결책으로 당신을 감동시키다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 생략\u003c/span> : [the solutions] + [(which/that) they find] : \"그들이 찾아내는 해결책\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Often, 종종. they will impress you, 아이들은 당신에게 감동을 안겨줄 것이다. with the solutions, 해결책으로. they find, 그들이 찾아내는. 이 문장 전체를 해석하면, 종종 아이들은 스스로 해결책을 찾아내어 감동을 안겨줄 것이다.","hl":"m"},{"n":37,"text":"아이가 스스로 찾은 해결책이 부모를 감동시킬 수 있다는 뜻이에요. 부모가 정답을 주기보다 아이의 자율성을 믿고 기다릴 때 좋은 결과가 나온다는 흐름을 마무리합니다.","hl":"mn"},{"n":38,"text":"첫 번째는 will impress예요. 조동사 will 뒤에 동사원형이 와서 미래의 의미를 나타내요. 두 번째는 impress you with the solutions인데, with가 감동을 주는 수단을 나타내요. 세 번째는 the solutions they find로, 목적격 관계대명사가 생략된 구조예요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>청소년들은 좋은 충고라도 부모가 \u003cb class=\"key\">충고\u003c/b>하면 싫어한다.\u003c/li>\u003cli>심리학자는 청소년에게 관리자가 아니라 \u003cb class=\"key\">상담자\u003c/b>가 필요하다고 말한다.\u003c/li>\u003cli>기업 상담자처럼 잘 듣고 문제를 완전히 \u003cb class=\"key\">이해\u003c/b>하도록 돕는 태도가 중요하다.\u003c/li>\u003cli>부모는 아이가 상황을 생각해 보고 \u003cb class=\"key\">스스로 \u003c/b>\u003cb class=\"key\">해결책\u003c/b>을 찾도록 도와주어야 한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Parents should act as consultants who listen carefully and help their teens think through problems and find their own solutions rather than giving advice.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">부모의 충고를 싫어하는 청소년들에게는 관리자가 아니라 상담자가 필요하다. 기업 상담자처럼 주의 깊게 듣고 고객이 문제를 완전히 이해하도록 돕듯, 부모도 아이가 상황을 잘 생각해 보고 \u003cb class=\"key\">스스로 \u003c/b>\u003cb class=\"key\">해결책\u003c/b>을 찾도록 도와주어야 한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":39,"text":"오늘 내용 정리해 볼게요. 청소년에게 필요한 것은 지시하는 관리자가 아니라 함께 들어 주는 상담자예요. 부모는 답을 주기 전에 아이가 문제를 완전히 이해하도록 돕고, 상황을 잘 생각해서 스스로 해결책을 찾게 해야 합니다. 그렇게 하면 아이들은 종종 부모를 감동시키는 답을 스스로 찾아낸다는 것도 잊지 마세요. 오늘 수업 잘 따라와 주어서 고맙고, 다음 시간에 또 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
