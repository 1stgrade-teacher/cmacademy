<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SO 레벨1 10강 적용독해02 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-sno{font-size:13px;color:#8493A1;font-weight:700;margin-bottom:8px}

.lp-chunk{display:flex;flex-direction:column}
.lp-chunk .ko{font-size:13px;color:var(--pk-t);font-weight:700;line-height:1.3;margin-bottom:2px}
.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}
.lp-top::before{height:5px;background:linear-gradient(90deg,var(--pk) 0,var(--pk) 80%,var(--am) 80%,var(--am) 100%)}
.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}
.lp-tag{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700;padding:2px 12px}
.lp-qn{flex:0 0 112px;height:112px;align-self:center;background:#fff;color:var(--pk);border:3px solid var(--pk);border-radius:50%;font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;font-size:26px}
.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}
.lp-qn .qt{display:block;white-space:nowrap;line-height:1.12;letter-spacing:-.02em}
.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}

.lp-st h4{color:var(--ink,#1B2733)}
.lp-st h4 i{border-radius:4px;width:auto;min-width:24px;padding:0 4px}
.lp-pill{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700}
.lp-chain span.c{background:#fff;border:1px solid #AEBBE6;border-radius:3px;font-weight:600}

.lp-vg em{background:#fff;border:1px solid var(--pk-b);border-radius:3px}
.lp-sa>div{border-radius:4px;border-color:var(--pk-b)}

.lp-chips .s{border:1px solid #AEBBE6;color:#3A4FA3}
.lp-chips .a{border:1px solid var(--am-b);color:var(--am-d);background:#FFFBF2}
.lp-sno .es{background:var(--am);border-radius:2px;font-weight:700}
.lp-chunk .en{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:600}
.lp-chunk+.lp-chunk{border-left:1px solid var(--pk-b)}
.lp .tgt{background:var(--am-l);border-bottom:2.5px dotted var(--am)}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"SO 레벨1 10강 적용독해02","audioDir":"10-02_audio","preview":false,"count":46,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">10강\u003cbr>적용독해02\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">SO 레벨1\u003c/div>\u003ch1>Michelangelo's Hidden Stone: Understanding the Human Mind\u003c/h1>\u003ch2>미켈란젤로의 숨은 돌: 인간 심리 이해\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>미켈란젤로는 자신이 \u003cb class=\"key\">완벽한 \u003c/b>\u003cb class=\"key\">작업\u003c/b>을 했다고 생각했지만 의뢰인이 코가 너무 크다며 불만을 제기하자, 실제로 코를 고치는 대신 \u003cb class=\"key\">돌조각\u003c/b>을 손에 숨겨 깎는 시늉을 했고 의뢰인은 코가 괜찮아 보인다고 인정했습니다. 이 일화는 그가 \u003cb class=\"key\">인간의 \u003c/b>\u003cb class=\"key\">심리\u003c/b>까지 이해했음을 보여 줍니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Michelangelo satisfied his client not by actually changing the statue's nose but by making him believe he did, showing his deep understanding of the human mind.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 미켈란젤로의 유명한 일화를 통해 인간의 심리를 이해하는 글을 함께 읽어 볼 거예요. 이 글은 조각상의 코를 둘러싼 재미있는 이야기를 들려주면서, 미켈란젤로가 인간의 신체뿐 아니라 인간의 심리까지 이해했다는 점을 보여 줍니다. 요지는 실제로 코를 고치지 않고도 의뢰인을 만족시킨 그의 지혜예요. 그럼 지문을 한 문장씩 살펴보면서 그 비밀을 파헤쳐 볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">미켈란젤로는 이탈리아 \u003cb class=\"key\">르네상스\u003c/b>를 대표하는 예술가로, 조각과 회화, 건축에서 뛰어난 업적을 남겼습니다. 르네상스 시대에는 \u003cb class=\"key\">인간 \u003c/b>\u003cb class=\"key\">중심\u003c/b>의 사고가 확산되면서 인간의 몸과 감정을 정확히 표현하려는 노력이 중요해졌어요. 그래서 예술가들은 \u003cb class=\"key\">해부학\u003c/b>을 공부하며 근육과 비례를 세밀하게 관찰했습니다. 하지만 사람의 마음은 몸처럼 눈에 보이지 않아서, 상대의 \u003cb class=\"key\">믿음\u003c/b>을 움직이는 것이 때로는 실제 기술보다 중요합니다. 이는 마치 요리사가 실제로 간을 바꾸지 않아도 손님 앞에서 양념을 뿌리는 시늉만으로 손님이 더 맛있다고 느끼는 것과 비슷해요. 이 글은 그러한 \u003cb class=\"key\">인간의 \u003c/b>\u003cb class=\"key\">심리\u003c/b>에 대한 이해를 미켈란젤로의 일화로 보여 줍니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 짚어 볼게요. 미켈란젤로는 이탈리아 르네상스를 대표하는 예술가로, 조각과 회화, 건축에서 뛰어난 업적을 남겼습니다. 르네상스 시대에는 인간 중심의 사고가 확산되면서 인간의 몸과 감정을 정확히 표현하려는 노력이 중요해졌어요. 그래서 예술가들은 해부학을 공부하며 근육과 비례를 세밀하게 관찰했습니다. 하지만 사람의 마음은 몸처럼 눈에 보이지 않아서, 상대의 믿음을 움직이는 것이 때로는 실제 기술보다 중요합니다. 이는 마치 요리사가 실제로 간을 바꾸지 않아도 손님 앞에서 양념을 뿌리는 시늉만으로 손님이 더 맛있다고 느끼는 것과 비슷해요. 이 글은 그러한 인간의 심리에 대한 이해를 미켈란젤로의 일화로 보여 줍니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>도입\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>미켈란젤로는 세상에서 가장 위대한 화가 중 한 사람으로 소개됩니다. 그의 가장 유명한 작품 중 일부는 돌로 만든 \u003cb class=\"key\">조각상\u003c/b>이라는 점이 제시되죠. 그리고 그와 그가 조각한 조각상에 관한 유명한 이야기가 있다는 \u003cb class=\"key\">도입\u003c/b>부입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>문제 제기\u003csmall>문제 · 문장 4–7\u003c/small>\u003c/h4>\u003cp>한번은 미켈란젤로가 남자의 얼굴을 조각하고 스스로 \u003cb class=\"key\">완벽한 \u003c/b>\u003cb class=\"key\">작업\u003c/b>을 했다고 생각했습니다. 하지만 조각상 값을 치르는 사람은 코가 너무 크다며 \u003cb class=\"key\">불만\u003c/b>을 제기했어요. 그는 코를 작게 해 달라고 요구했고, 여기서 문제가 발생합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>전환\u003csmall>전환 · 문장 8–9\u003c/small>\u003c/h4>\u003cp>미켈란젤로는 돌조각을 가져다 손에 숨겼습니다. 그리고 코를 작게 하는 대신 그 \u003cb class=\"key\">돌조각\u003c/b>을 깎아내는 \u003cb class=\"key\">시늉\u003c/b>을 했죠. 실제로는 아무것도 바꾸지 않은 \u003cb class=\"key\">전환\u003c/b>의 순간입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>결과\u003csmall>결과 · 문장 10\u003c/small>\u003c/h4>\u003cp>의뢰인은 화가의 바쁜 손놀림과 바닥에 떨어지는 돌조각들을 지켜보았습니다. 그 결과 코가 이제 괜찮아 보인다고 \u003cb class=\"key\">인정\u003c/b>했어요. 실제 변화가 아니라 \u003cb class=\"key\">보이는 \u003c/b>\u003cb class=\"key\">행동\u003c/b>이 만족을 만들었다는 결과입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>결론\u003csmall>결론 · 문장 11\u003c/small>\u003c/h4>\u003cp>마지막 문장은 미켈란젤로가 인간의 신체뿐 아니라 \u003cb class=\"key\">인간의 \u003c/b>\u003cb class=\"key\">심리\u003c/b>까지 이해했던 것 같다고 정리합니다. 이는 앞의 일화를 \u003cb class=\"key\">결론\u003c/b>으로 묶는 문장이에요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 다섯 단계로 나누어 살펴볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 도입이에요. 미켈란젤로는 세상에서 가장 위대한 화가 중 한 사람으로 소개됩니다. 그의 가장 유명한 작품 중 일부는 돌로 만든 조각상이라는 점이 제시되죠. 그리고 그와 그가 조각한 조각상에 관한 유명한 이야기가 있다는 도입부입니다.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 문제가 생겨요. 한번은 미켈란젤로가 남자의 얼굴을 조각하고 스스로 완벽한 작업을 했다고 생각했습니다. 하지만 조각상 값을 치르는 사람은 코가 너무 크다며 불만을 제기했어요. 그는 코를 작게 해 달라고 요구했고, 여기서 갈등이 시작됩니다.","hl":"f1"},{"n":6,"text":"세 번째 단계는 전환이에요. 미켈란젤로는 돌조각을 가져다 손에 숨겼습니다. 그리고 코를 작게 하는 대신 그 돌조각을 깎아내는 시늉을 했죠. 실제로는 아무것도 바꾸지 않은 전환의 순간입니다.","hl":"f2"},{"n":7,"text":"네 번째 단계에서는 결과가 나옵니다. 의뢰인은 화가의 바쁜 손놀림과 바닥에 떨어지는 돌조각들을 지켜보았습니다. 그 결과 코가 이제 괜찮아 보인다고 인정했어요. 실제 변화가 아니라 보이는 행동이 만족을 만들었다는 결과입니다.","hl":"f3"},{"n":8,"text":"다섯 번째 단계는 결론이에요. 마지막 문장은 미켈란젤로가 인간의 신체뿐 아니라 인간의 심리까지 이해했던 것 같다고 정리합니다. 이는 앞의 일화를 결론으로 묶는 문장이에요.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">예시\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 11번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 미켈란젤로의 일화를 \u003cb class=\"key\">예시\u003c/b>로 제시한 뒤, 마지막 문장에서 그가 인간의 심리까지 이해했다는 \u003cb class=\"key\">주제\u003c/b>를 밝히는 미괄식 구조입니다. 앞부분의 구체적인 이야기는 뒤에 나오는 추상적인 결론을 뒷받침하는 근거 역할을 해요. 그래서 마지막 문장에 이르러서야 이 일화를 통해 말하고자 하는 \u003cb class=\"key\">의도\u003c/b>가 분명해집니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Once (4)\u003c/b>\u003cspan>일화 시작\u003c/span>\u003cb>But (6)\u003c/b>\u003cspan>전환·반박\u003c/span>\u003cb>So (8)\u003c/b>\u003cspan>인과·해결\u003c/span>\u003cb>Then (9)\u003c/b>\u003cspan>시간 순서\u003c/span>\u003cb>instead of (9)\u003c/b>\u003cspan>대조\u003c/span>\u003cb>After (10)\u003c/b>\u003cspan>시간 순서·결과\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">the nose was too big\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">make it smaller\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">cut away that piece of stone\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the nose now looked fine\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>실제 조각\u003c/th>\u003cth>의뢰인의 인식\u003c/th>\u003c/tr>\u003ctr>\u003ctd>코를 작게 하지 않음\u003c/td>\u003ctd>코가 작아졌다고 믿음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>돌조각을 숨기고 깎는 시늉\u003c/td>\u003ctd>바쁜 손놀림과 떨어지는 돌만 봄\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글의 전개 방식은 예시예요. 미켈란젤로의 일화를 구체적인 예시로 제시한 뒤, 마지막 문장에서 그가 인간의 심리까지 이해했다는 주제를 밝히는 미괄식 구조입니다. 앞부분의 이야기는 뒤에 나오는 추상적인 결론을 뒷받침하는 근거 역할을 해요. 그래서 마지막 문장에 이르러서야 이 일화를 통해 말하고자 하는 의도가 분명해집니다.","hl":"ty"},{"n":10,"text":"신호어를 살펴볼게요. 네 번째 문장의 Once는 일화가 시작됨을 알려 주고, 여섯 번째 문장의 But은 의뢰인의 불만으로 분위기를 전환합니다. 여덟 번째 문장의 So는 그래서 해결책이 나옴을, 아홉 번째 문장의 Then은 시간의 순서를 보여 주죠. 같은 문장의 instead of는 코를 작게 하는 것과 돌을 깎는 것이 대조된다는 신호이고, 열 번째 문장의 After는 손놀림을 본 뒤 결과가 이어짐을 나타냅니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>greatest\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>가장 위대한\u003c/span>\u003c/div>\u003cdiv>\u003cb>artist\u003c/b>\u003cem>명사\u003c/em>\u003cspan>예술가, 화가\u003c/span>\u003c/div>\u003cdiv>\u003cb>famous\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>유명한\u003c/span>\u003c/div>\u003cdiv>\u003cb>statue\u003c/b>\u003cem>명사\u003c/em>\u003cspan>조각상\u003c/span>\u003c/div>\u003cdiv>\u003cb>stone\u003c/b>\u003cem>명사\u003c/em>\u003cspan>돌\u003c/span>\u003c/div>\u003cdiv>\u003cb>carve\u003c/b>\u003cem>동사\u003c/em>\u003cspan>조각하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>once\u003c/b>\u003cem>부사\u003c/em>\u003cspan>한번은\u003c/span>\u003c/div>\u003cdiv>\u003cb>think\u003c/b>\u003cem>동사\u003c/em>\u003cspan>생각하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>perfect\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>완벽한\u003c/span>\u003c/div>\u003cdiv>\u003cb>pay for\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~의 값을 치르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>too big\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>너무 큰\u003c/span>\u003c/div>\u003cdiv>\u003cb>smaller\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>더 작은\u003c/span>\u003c/div>\u003cdiv>\u003cb>make it smaller\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>그것을 더 작게 만들다\u003c/span>\u003c/div>\u003cdiv>\u003cb>a piece of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>한 조각의\u003c/span>\u003c/div>\u003cdiv>\u003cb>hide\u003c/b>\u003cem>동사\u003c/em>\u003cspan>숨기다\u003c/span>\u003c/div>\u003cdiv>\u003cb>instead of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~ 대신에\u003c/span>\u003c/div>\u003cdiv>\u003cb>cut away\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>잘라내다, 깎아내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>watch\u003c/b>\u003cem>동사\u003c/em>\u003cspan>지켜보다\u003c/span>\u003c/div>\u003cdiv>\u003cb>busy\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>바쁜\u003c/span>\u003c/div>\u003cdiv>\u003cb>fall to the ground\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>바닥에 떨어지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>agree\u003c/b>\u003cem>동사\u003c/em>\u003cspan>인정하다, 동의하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>look fine\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>괜찮아 보이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>seem to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~인 것 같다\u003c/span>\u003c/div>\u003cdiv>\u003cb>understand\u003c/b>\u003cem>동사\u003c/em>\u003cspan>이해하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>not only A but also B\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>A뿐 아니라 B도\u003c/span>\u003c/div>\u003cdiv>\u003cb>human body\u003c/b>\u003cem>명사\u003c/em>\u003cspan>인간의 신체\u003c/span>\u003c/div>\u003cdiv>\u003cb>human mind\u003c/b>\u003cem>명사\u003c/em>\u003cspan>인간의 심리\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"핵심 단어도 짚어 볼게요. statue는 조각상, carve는 조각하다, hide는 숨기다라는 뜻이에요. instead of는 대신에, cut away는 잘라내다, agree는 인정하다로 기억해 두세요. seem to는 인 것 같다라는 표현으로, 마지막 문장에서 미켈란젤로의 이해를 부드럽게 추측하는 역할을 합니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">famous\u003c/b>\u003cspan class=\"m\">유명한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">well-known\u003c/span>\u003cspan class=\"s\">renowned\u003c/span>\u003cspan class=\"s\">celebrated\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unknown\u003c/span>\u003cspan class=\"a\">obscure\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">perfect\u003c/b>\u003cspan class=\"m\">완벽한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">flawless\u003c/span>\u003cspan class=\"s\">ideal\u003c/span>\u003cspan class=\"s\">faultless\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">imperfect\u003c/span>\u003cspan class=\"a\">flawed\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">hide\u003c/b>\u003cspan class=\"m\">숨기다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">conceal\u003c/span>\u003cspan class=\"s\">cover\u003c/span>\u003cspan class=\"s\">secret\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">reveal\u003c/span>\u003cspan class=\"a\">expose\u003c/span>\u003cspan class=\"a\">show\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">agree\u003c/b>\u003cspan class=\"m\">인정하다, 동의하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">accept\u003c/span>\u003cspan class=\"s\">admit\u003c/span>\u003cspan class=\"s\">acknowledge\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">deny\u003c/span>\u003cspan class=\"a\">disagree\u003c/span>\u003cspan class=\"a\">refuse\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">understand\u003c/b>\u003cspan class=\"m\">이해하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">comprehend\u003c/span>\u003cspan class=\"s\">grasp\u003c/span>\u003cspan class=\"s\">perceive\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">misunderstand\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">great\u003c/b>\u003cspan class=\"m\">위대한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">outstanding\u003c/span>\u003cspan class=\"s\">remarkable\u003c/span>\u003cspan class=\"s\">excellent\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ordinary\u003c/span>\u003cspan class=\"a\">mediocre\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">busy\u003c/b>\u003cspan class=\"m\">바쁜\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">active\u003c/span>\u003cspan class=\"s\">occupied\u003c/span>\u003cspan class=\"s\">engaged\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">idle\u003c/span>\u003cspan class=\"a\">inactive\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어도 정리해 볼게요. famous는 well-known, renowned와 가깝고, 반대말은 unknown이에요. perfect는 flawless, ideal과 비슷하며 반대말은 flawed입니다. hide는 conceal, cover와 같은 뜻이고 반대말은 reveal, expose예요. agree는 accept, admit으로 바꿔 쓸 수 있고 반대말은 deny입니다. understand는 comprehend, grasp와 동의어이고 반대말은 misunderstand예요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미켈란젤로는\u003c/span>\u003cspan class=\"en\">Michelangelo\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~ 중의 한 사람이었어요\u003c/span>\u003cspan class=\"en\">was \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세상에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">world's \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가장 위대한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">greatest \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">화가들\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">artists\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">미켈란젤로는 세상에서 가장 위대한 화가 중의 한 사람이었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글의 \u003cb class=\"key\">주제 \u003c/b>\u003cb class=\"key\">인물\u003c/b>인 미켈란젤로를 소개하며, 그가 \u003cb class=\"key\">세계 \u003c/b>\u003cb class=\"key\">최고 \u003c/b>\u003cb class=\"key\">수준\u003c/b>의 예술가임을 강조해요. 뒤에 이어질 그의 작품과 일화에 \u003cb class=\"key\">신뢰\u003c/b>를 더하는 도입 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">one of the + 최상급 + 복수명사\u003c/span> : one of the + [최상급] + [복수명사] : \"세상에서 가장 위대한 화가들 중 한 사람\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"Michelangelo, 미켈란젤로는. was one of, ~ 중의 한 사람이었어요. the world's, 세상에서. greatest, 가장 위대한. artists, 화가들. 이 문장 전체를 해석하면, 미켈란젤로는 세상에서 가장 위대한 화가 중의 한 사람이었다.","hl":"m"},{"n":14,"text":"이 문장은 글의 주제 인물인 미켈란젤로를 소개하면서 그가 세계 최고 수준의 예술가임을 강조해요. 뒤에 이어질 그의 작품과 일화에 신뢰를 더하는 도입 역할을 하죠.","hl":"mn"},{"n":15,"text":"첫 번째 어법 포인트는 one of the 표현이에요. one of the 뒤에는 최상급과 복수명사가 와서 가장 위대한 화가들 중 한 사람이라는 뜻을 만들어요. 그래서 artists처럼 복수명사가 와야 한다는 점을 꼭 기억해 주세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 가장 유명한 예술작품 중 일부는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Some \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">most \u003c/span>\u003cspan class=\"tgt\">famous \u003c/span>\u003cspan class=\"tgt\">art \u003c/span>\u003cspan class=\"tgt\">works\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이다\u003c/span>\u003cspan class=\"en\">are\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">조각상들\u003c/span>\u003cspan class=\"en\">statues\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">돌로 만들어진\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">made \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">stone\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그의 가장 유명한 예술작품 중 일부는 돌로 만든 조각상들이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 미켈란젤로의 대표 작품이 \u003cb class=\"key\">돌로 \u003c/b>\u003cb class=\"key\">만든 \u003c/b>\u003cb class=\"key\">조각상\u003c/b>임을 말해요. 그래서 다음에 나올 \u003cb class=\"key\">조각상\u003c/b>에 관한 이야기로 자연스럽게 이어지는 \u003cb class=\"key\">도입\u003c/b> 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">some of + 복수명사(부분 표현)\u003c/span> : some of + [한정사/소유격] + [복수명사] : \"그의 가장 유명한 예술작품 중 일부\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사구의 형용사적 용법 / be made of\u003c/span> : [명사] + [과거분사구] = ~된 [명사] / be made of + [재료] : \"돌로 만들어진\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"Some of his most famous art works, 그의 가장 유명한 예술작품 중 일부는. are, 이다. statues, 조각상들. made of stone, 돌로 만들어진. 이 문장 전체를 해석하면, 그의 가장 유명한 예술작품 중 일부는 돌로 만든 조각상들이다.","hl":"m"},{"n":17,"text":"이 문장은 미켈란젤로의 대표 작품이 돌로 만든 조각상임을 말해요. 그래서 다음에 나올 조각상에 관한 이야기로 자연스럽게 이어지는 도입 역할을 하죠.","hl":"mn"},{"n":18,"text":"첫 번째로 some of는 중 일부라는 부분 표현이고 뒤에는 복수명사가 와요. 두 번째로 made of stone에서 과거분사 made가 앞의 statues를 뒤에서 꾸며 주는 형용사적 용법이에요. be made of는 재료가 원형을 유지할 때 로 만들어지다라는 뜻으로 써요. 이 두 가지를 함께 기억해 주세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유명한 이야기가 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">is\u003c/span> a famous story\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그와 조각상에 관한\u003c/span>\u003cspan class=\"en\">about him and a statue\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그에 의해 조각된\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">carved \u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">him\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그와 그에 의해 조각된 조각상에 관한 유명한 이야기가 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 미켈란젤로와 그가 조각한 조각상에 관한 \u003cb class=\"key\">유명한 \u003c/b>\u003cb class=\"key\">이야기\u003c/b>를 꺼내며 \u003cb class=\"key\">일화\u003c/b>를 시작해요. 앞에서 말한 조각상이라는 \u003cb class=\"key\">소재\u003c/b>를 구체적인 이야기로 연결하는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">There is 구문(유도부사)\u003c/span> : There is + [단수명사] = [단수명사]가 있다 : \"유명한 이야기가 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사구의 형용사적 용법(수동)\u003c/span> : [명사] + [과거분사] + by + [행위자] = [행위자]에 의해 [과거분사]된 [명사] : \"그에 의해 조각된\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"There is a famous story, 유명한 이야기가 있다. about him and a statue, 그와 조각상에 관한. carved by him, 그에 의해 조각된. 이 문장 전체를 해석하면, 그와 그에 의해 조각된 조각상에 관한 유명한 이야기가 있다.","hl":"m"},{"n":20,"text":"이 문장은 미켈란젤로와 그가 조각한 조각상에 관한 유명한 이야기를 꺼내며 일화를 시작해요. 앞에서 말한 조각상이라는 소재를 구체적인 이야기로 연결하는 역할을 하죠.","hl":"mn"},{"n":21,"text":"첫 번째로 There is는 이 있다라는 존재를 나타내는 구문이고 뒤에는 단수명사 a famous story가 와요. 두 번째로 carved by him에서 과거분사 carved가 앞의 a statue를 뒤에서 꾸며요. by him은 수동의 행위자를 나타내는 표현이에요. 그래서 그에 의해 조각된 조각상이라는 뜻이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한번은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Once\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미켈란젤로가 조각했다\u003c/span>\u003cspan class=\"en\">Michelangelo \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">carved\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 남자의 얼굴을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">man's \u003c/span>\u003cspan class=\"tgt\">face\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">한번은 미켈란젤로가 어떤 남자의 얼굴을 조각했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Once는 '한 번'이라는 횟수가 아니라 옛이야기를 여는 \u003cb class=\"key\">도입\u003c/b> 신호예요. 미켈란젤로가 어떤 남자의 \u003cb class=\"key\">얼굴\u003c/b>을 조각했다는 사실을 먼저 깔아 주면서, 뒤에 이어질 코 이야기의 \u003cb class=\"key\">배경\u003c/b>을 만들어 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부사(이야기 도입)\u003c/span> : [Once] + [주어] + [동사] (문두 부사) : \"한번은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">단순과거 시제\u003c/span> : [주어] + [동사원형 + -ed] : \"조각했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">소유격 ('s)\u003c/span> : [사람 명사] + ['s] + [명사] : \"한 남자의 얼굴\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"Once, 한번은. Michelangelo carved, 미켈란젤로가 조각했다. a man's face, 어떤 남자의 얼굴을. 이 문장 전체를 해석하면, 한번은 미켈란젤로가 어떤 남자의 얼굴을 조각했다.","hl":"m"},{"n":23,"text":"여기서 Once는 '한 번'이라는 횟수가 아니라 옛이야기를 여는 도입 신호예요. 미켈란젤로가 어떤 남자의 얼굴을 조각했다는 배경을 먼저 깔아 주는 문장이죠.","hl":"mn"},{"n":24,"text":"첫째, Once는 문장 맨 앞에서 시간적 배경을 열어 주는 부사예요. 둘째, carved는 이미 끝난 과거 사건을 서술하는 과거시제 형태죠. 셋째, a man's face는 사람 명사 뒤에 's를 붙인 소유격으로 '한 남자의 얼굴'이라는 뜻이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 생각했다\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">thought\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그가 해 두었었다고\u003c/span>\u003cspan class=\"en\">he \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">done\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">완벽한 작업을\u003c/span>\u003cspan class=\"en\">a perfect job.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 완벽한 작업을 수행했다고 생각했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 미켈란젤로가 자기 작업에 스스로 내린 \u003cb class=\"key\">평가\u003c/b>를 보여 주는 문장이에요. 본인은 \u003cb class=\"key\">완벽\u003c/b>하다고 믿었지만, 바로 다음에 값을 치르는 사람이 흠을 잡으면서 \u003cb class=\"key\">긴장\u003c/b>이 생깁니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">think + 목적어절(접속사 that 생략)\u003c/span> : [think] + [(that) + 주어 + 동사] : \"~라고 생각했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거완료(대과거)\u003c/span> : [주어] + [had + 과거분사] : \"해 두었었다, 했었다\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"He thought, 그는 생각했다. he had done, 그가 해 두었었다고. a perfect job, 완벽한 작업을. 이 문장 전체를 해석하면, 그는 완벽한 작업을 수행했다고 생각했다.","hl":"m"},{"n":26,"text":"미켈란젤로가 자기 작업을 스스로 완벽하다고 평가한 대목이에요. 자신만만한 마음과 곧 닥칠 흠잡기 사이에서 긴장이 만들어지죠.","hl":"mn"},{"n":27,"text":"첫째, thought는 뒤에 절을 통째로 목적어로 데려오는 타동사라서 접속사 that이 생략된 채로 이어져요. 둘째, had done은 과거완료인데, 생각한 시점보다 작업을 끝낸 시점이 더 이전이라는 시간 차이를 보여 주는 형태예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만\u003c/span>\u003cspan class=\"en\">But\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">조각상의 값을 치르는 사람은\u003c/span>\u003cspan class=\"en\">the man \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">paying \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">statue\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">말했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">said \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">코가 너무 크다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">nose \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">too \u003c/span>\u003cspan class=\"tgt\">big\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 조각상의 값을 치르는 사람은 코가 너무 크다고 말했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> But이 앞 문장의 \u003cb class=\"key\">자신감\u003c/b>을 정면으로 뒤집는 신호예요. 돈을 내는 \u003cb class=\"key\">의뢰인\u003c/b>이 등장하면서 갈등이 시작되고, '코가 너무 크다'는 \u003cb class=\"key\">불만\u003c/b>이 이 이야기의 문제 상황이 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재분사(형용사적 용법, 명사 수식)\u003c/span> : [명사 the man] + [현재분사 paying + 목적어] : \"조각상의 값을 치르는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 that 생략 + 간접화법\u003c/span> : [say] + [(that) + 주어 + 동사] : \"코가 너무 크다고 말했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">too + 형용사\u003c/span> : [too] + [형용사] : \"너무 크다\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"But, 하지만. the man paying for the statue, 조각상의 값을 치르는 사람은. said, 말했다. the nose was too big, 코가 너무 크다고. 이 문장 전체를 해석하면, 하지만 조각상의 값을 치르는 사람은 코가 너무 크다고 말했다.","hl":"m"},{"n":29,"text":"But이 앞 문장의 자신감을 정면으로 뒤집는 신호예요. 돈을 내는 의뢰인이 등장하면서 갈등이 시작되고, 코가 너무 크다는 불만이 이 이야기의 문제 상황이 됩니다.","hl":"mn"},{"n":30,"text":"첫째, paying for the statue는 the man을 뒤에서 꾸미는 현재분사예요. the man who pays를 줄인 분사구이고 능동이라서 ing를 썼죠. 둘째, said 뒤에는 접속사 that이 생략된 목적어절이 이어지고, 직접화법을 간접화법으로 옮기면서 시제를 과거로 맞췄어요. 셋째, too big에서 too는 필요 이상으로 지나치다는 부정적인 뉘앙스를 담아 불만의 어조를 만들어 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 미켈란젤로에게\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">told \u003c/span>\u003cspan class=\"tgt\">Michelangelo \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 만들라고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 작게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">smaller\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 미켈란젤로에게 코를 좀 작게 해달라고 했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 코가 너무 크다는 지적을 받고 미켈란젤로가 \u003cb class=\"key\">작게 \u003c/b>\u003cb class=\"key\">해 \u003c/b>\u003cb class=\"key\">달라는 \u003c/b>\u003cb class=\"key\">요청\u003c/b>을 받은 장면이에요. tell 뒤에 to부정사가 붙어 '~하라고 말하다'라는 \u003cb class=\"key\">명령\u003c/b>의 뜻이 된다는 점이 핵심이죠. 여기서 it은 앞 문장의 the nose를 가리킵니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">tell + 목적어 + to부정사(목적격보어)\u003c/span> : tell [목적어(Michelangelo)] + [to make ~ (to부정사구/목적격보어)] : \"미켈란젤로에게 ~하라고 말했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">make + 목적어 + 형용사(5형식 목적격보어)\u003c/span> : make [목적어(it)] + [형용사(smaller)] : \"그것을 더 작게 만들다\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"He told Michelangelo, 그는 미켈란젤로에게. to make it, 그것을 만들라고. smaller, 더 작게. 이 문장 전체를 해석하면, 그는 미켈란젤로에게 코를 좀 작게 해달라고 했다.","hl":"m"},{"n":32,"text":"이건 코가 너무 크다는 이야기를 듣고 작게 해 달라는 요청을 받은 장면이에요. 결국 미켈란젤로가 코를 손봐 달라는 부탁을 받은 거죠. 여기서 it이 가리키는 건 앞에 나온 the nose, 코라는 것도 꼭 기억해 두세요.","hl":"mn"},{"n":33,"text":"첫 번째로, tell은 목적어 뒤에 to부정사를 데려와서 명령의 뜻을 만들어요. 그 to부정사는 목적격보어 역할을 합니다. 두 번째로, make it smaller는 목적어 it 뒤에 형용사 smaller가 오는 오형식 구조라서 그것을 더 작게 만들다라고 해석해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서\u003c/span>\u003cspan class=\"en\">So,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미켈란젤로는 돌조각을 가져다\u003c/span>\u003cspan class=\"en\">Michelangelo \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">got \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">piece \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">stone \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그것을 숨겼다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">hid \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 손에\u003c/span>\u003cspan class=\"en\">in his hand.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그래서 미켈란젤로는 돌조각을 가져다 그것을 손에 숨겼다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 미켈란젤로가 실제로는 코를 건드리지 않으려고 \u003cb class=\"key\">돌조각\u003c/b>을 손에 쥐고 있던 장면이에요. 이 장면이 뒤에 나올 \u003cb class=\"key\">속임수\u003c/b>의 준비가 되는 셈이죠. got과 hid 두 \u003cb class=\"key\">과거 \u003c/b>\u003cb class=\"key\">동사\u003c/b>가 and로 나란히 연결된 병렬 구조도 함께 봐 두세요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">등위접속사 and에 의한 동사 병렬\u003c/span> : [got (과거동사)] + and + [hid (과거동사)] : \"돌조각을 가져다가 그것을 숨겼다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수량 표현 a piece of + 명사\u003c/span> : a piece of [불가산 명사(stone)] : \"돌 한 조각\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"So, 그래서. Michelangelo got a piece of stone, 미켈란젤로는 돌조각을 가져다. and hid it, 그리고 그것을 숨겼다. in his hand, 자신의 손에. 이 문장 전체를 해석하면, 그래서 미켈란젤로는 돌조각을 가져다 그것을 손에 숨겼다.","hl":"m"},{"n":35,"text":"실제로는 코를 건드리지 않으려고 돌조각을 손에 쥐고 있던 장면이에요. 이렇게 숨긴 돌조각이 뒤에 나올 속임수의 준비가 되는 거죠. 두 동작이 시간 순서대로 이어진다는 점도 같이 봐 주세요.","hl":"mn"},{"n":36,"text":"첫 번째로, got과 hid, 두 개의 과거 동사가 and로 나란히 이어진 병렬 구조라는 걸 눈여겨보세요. and는 대등한 두 요소를 잇는 등위접속사예요. 두 번째로, a piece of stone은 셀 수 없는 돌을 한 덩어리로 세는 표현입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그런 다음\u003c/span>\u003cspan class=\"en\">Then,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">코를 작게 하는 대신\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">instead \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">making \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">nose \u003c/span>\u003cspan class=\"tgt\">smaller\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 깎아냈다\u003c/span>\u003cspan class=\"en\">he cut away\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 돌조각을\u003c/span>\u003cspan class=\"en\">that piece of stone.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그런 다음, 코를 작게 하는 대신, 그 돌조각을 깎아냈다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 코를 작게 만드는 대신 \u003cb class=\"key\">돌조각\u003c/b>만 깎아내는 \u003cb class=\"key\">반전\u003c/b>이 일어나는 문장이에요. 실제로는 아무것도 달라지지 않았는데 사람은 그것을 보고 착각하게 되죠. instead of 뒤에는 \u003cb class=\"key\">동명사\u003c/b>가 온다는 점과 cut away가 '깎아내다'라는 뜻이라는 점을 꼭 잡아 두세요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 instead of + 동명사\u003c/span> : instead of + [동명사(-ing)] : \"~하는 대신에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">make + 목적어 + 형용사(5형식)\u003c/span> : make [목적어(the nose)] + [형용사(smaller)] : \"코를 더 작게 만들기\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"Then, 그런 다음. instead of making the nose smaller, 코를 작게 하는 대신. he cut away, 그는 깎아냈다. that piece of stone, 그 돌조각을. 이 문장 전체를 해석하면, 그런 다음, 코를 작게 하는 대신, 그 돌조각을 깎아냈다.","hl":"m"},{"n":38,"text":"코를 작게 만드는 대신 돌조각만 깎아내는 반전이 일어나는 장면이에요. 실제로는 코가 전혀 달라지지 않았는데, 사람은 떨어지는 돌조각을 보고 착각하게 되는 거죠. 그래서 이 문장이 이야기의 재미를 만들어 주는 부분이에요.","hl":"mn"},{"n":39,"text":"첫 번째로, instead of는 전치사 덩어리라서 뒤에 동사가 오면 반드시 동명사 형태를 써야 해요. 그래서 to make가 아니라 making이 온 겁니다. 두 번째로, making the nose smaller는 make가 목적어와 형용사를 데리는 오형식 구조가 통째로 명사구로 바뀐 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">화가의 바쁜 손놀림을 본 후\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">After \u003c/span>\u003cspan class=\"tgt\">watching\u003c/span> the artist's busy hands\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 바닥에 떨어지는 돌조각들을\u003c/span>\u003cspan class=\"en\">and the pieces of stone \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">falling \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">ground\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 사람은 인정했다\u003c/span>\u003cspan class=\"en\">the man \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">agreed \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">코가 이제 괜찮아 보인다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> the nose now \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">looked \u003c/span>\u003cspan class=\"tgt\">fine\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">화가의 바쁜 손놀림과 바닥에 떨어지는 돌조각들을 본 후, 그 사람은 코가 이제 괜찮아 보인다고 인정했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 미켈란젤로의 \u003cb class=\"key\">속임수\u003c/b>가 그대로 통한 장면이에요. 그는 코를 실제로 깎지 않고 손에 숨긴 돌조각만 잘라 냈는데, 그 사람은 \u003cb class=\"key\">바쁜 \u003c/b>\u003cb class=\"key\">손놀림\u003c/b>과 떨어지는 돌조각을 보고 코가 작아졌다고 믿었죠. 결국 사람은 \u003cb class=\"key\">보이는 \u003c/b>\u003cb class=\"key\">것\u003c/b>에 쉽게 속는다는 걸 보여 주는 대목이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 after + 동명사\u003c/span> : After [전치사] + [[watching (동명사)]] + 목적어 : \"화가의 바쁜 손놀림을 본 후\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재분사의 형용사적 용법\u003c/span> : 명사 + [[현재분사]] + 수식어 = 명사 + which is/are + -ing : \"바닥에 떨어지는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 명사절(목적어)\u003c/span> : agree + [[that + 주어 + 동사]] (that절이 목적어) : \"~라고 인정했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">감각동사 look + 형용사(2형식)\u003c/span> : [[감각동사]] look + [[형용사]] fine : \"괜찮아 보였다\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"After watching the artist's busy hands, 화가의 바쁜 손놀림을 본 후. and the pieces of stone falling to the ground, 그리고 바닥에 떨어지는 돌조각들을. the man agreed, 그 사람은 인정했다. that the nose now looked fine, 코가 이제 괜찮아 보인다고. 이 문장 전체를 해석하면, 화가의 바쁜 손놀림과 바닥에 떨어지는 돌조각들을 본 후, 그 사람은 코가 이제 괜찮아 보인다고 인정했다.","hl":"m"},{"n":41,"text":"여기서 미켈란젤로가 쓴 건 속임수였어요. 실제로 코를 깎은 게 아니라 손에 숨긴 돌조각만 잘라 냈는데, 그 사람은 바쁜 손놀림과 떨어진 돌조각을 보고 코가 작아졌다고 믿은 거죠. 결국 사람은 보이는 것에 쉽게 속는다는 걸 보여 주는 장면이에요.","hl":"mn"},{"n":42,"text":"먼저 첫 번째로 after 뒤에 동명사 watching이 온 걸 봐야 해요. 전치사 뒤에는 동명사가 온다는 원칙이죠. 두 번째로 falling은 the pieces of stone을 뒤에서 꾸미는 현재분사예요. 돌조각이 능동으로 떨어지고 있으니 현재분사를 쓴 거고요. 세 번째로 agreed 뒤에 접속사 that이 이끄는 명사절이 목적어로 왔어요. 그래서 그 사람이 인정한 내용이 뒤에 통째로 붙는 구조예요. 마지막으로 look은 감각동사라서 뒤에 형용사 fine이 오고, 이게 2형식 문장을 만들어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미켈란젤로는 ~인 것 같다\u003c/span>\u003cspan class=\"en\">Michelangelo \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">seems \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이해했던\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">understood\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인간의 신체뿐 아니라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">only \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">human \u003c/span>\u003cspan class=\"tgt\">body \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인간의 심리까지도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">but \u003c/span>\u003cspan class=\"tgt\">also \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">human \u003c/span>\u003cspan class=\"tgt\">mind\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">미켈란젤로는 인간의 신체뿐 아니라 인간의 심리까지도 이해를 했던 것 같다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글 전체를 \u003cb class=\"key\">요약\u003c/b>하는 결론 문장이에요. 미켈란젤로는 몸의 구조를 꿰뚫는 화가였을 뿐 아니라 \u003cb class=\"key\">사람의 \u003c/b>\u003cb class=\"key\">마음\u003c/b>까지 읽을 줄 아는 사람이었다는 뜻이죠. 신체와 심리를 함께 \u003cb class=\"key\">이해\u003c/b>했다는 점을 강조하며 글을 마무리해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">seem + 완료 to부정사(to have p.p.)\u003c/span> : seem + [[to have p.p.]] = it seems that + 주어 + 과거동사 : \"이해했던 것 같다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">상관접속사 not only A but also B\u003c/span> : [[not only]] + A + [[but also]] + B (A와 B는 같은 품사로 병렬) : \"인간의 신체뿐 아니라 인간의 심리까지도\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"Michelangelo seems, 미켈란젤로는 ~인 것 같다. to have understood, 이해했던. not only the human body, 인간의 신체뿐 아니라. but also the human mind, 인간의 심리까지도. 이 문장 전체를 해석하면, 미켈란젤로는 인간의 신체뿐 아니라 인간의 심리까지도 이해를 했던 것 같다.","hl":"m"},{"n":44,"text":"이 문장은 글 전체를 요약하는 결론이에요. 미켈란젤로가 몸의 구조를 잘 알았을 뿐 아니라 사람의 마음까지 읽었다는 뜻이죠. 신체와 심리를 함께 이해했다는 걸 강조하면서 이야기를 마무리해요.","hl":"mn"},{"n":45,"text":"먼저 seems는 현재형인데 이해한 일은 과거잖아요. 이럴 때 완료부정사 to have understood를 써서 시제 차이를 보여 줍니다. 두 번째로 not only A but also B는 상관접속사로, 두 목적어를 병렬로 묶어서 인간의 신체뿐 아니라 인간의 심리까지도라는 뜻을 만들어요. 의미의 무게는 뒤에 오는 human mind에 실린다는 것도 기억해 두세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>미켈란젤로는 돌로 만든 \u003cb class=\"key\">조각상\u003c/b>으로 유명한 위대한 화가였다.\u003c/li>\u003cli>그는 남자의 얼굴을 조각한 뒤 \u003cb class=\"key\">완벽한 \u003c/b>\u003cb class=\"key\">작업\u003c/b>을 했다고 생각했지만, 의뢰인은 코가 너무 크다고 불만을 말했다.\u003c/li>\u003cli>미켈란젤로는 코를 작게 하는 대신 \u003cb class=\"key\">돌조각\u003c/b>을 손에 숨기고 그것을 깎아내는 시늉을 했다.\u003c/li>\u003cli>이를 지켜본 의뢰인은 코가 괜찮아 보인다고 인정했고, 이는 그가 \u003cb class=\"key\">인간의 \u003c/b>\u003cb class=\"key\">심리\u003c/b>까지 이해했음을 보여 준다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Michelangelo satisfied his client not by actually changing the statue's nose but by making him believe he did, showing his deep understanding of the human mind.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">미켈란젤로는 자신이 \u003cb class=\"key\">완벽한 \u003c/b>\u003cb class=\"key\">작업\u003c/b>을 했다고 생각했지만 의뢰인이 코가 너무 크다며 불만을 제기하자, 실제로 코를 고치는 대신 \u003cb class=\"key\">돌조각\u003c/b>을 손에 숨겨 깎는 시늉을 했고 의뢰인은 코가 괜찮아 보인다고 인정했습니다. 이 일화는 그가 \u003cb class=\"key\">인간의 \u003c/b>\u003cb class=\"key\">심리\u003c/b>까지 이해했음을 보여 줍니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":46,"text":"오늘 우리는 미켈란젤로가 실제로 코를 고치지 않고도 의뢰인을 만족시킨 일화를 읽었어요. 중요한 점은 실제 변화보다 상대방이 보고 믿는 것이 만족을 만든다는 사실이죠. 이 이야기는 그가 인간의 신체뿐 아니라 인간의 심리까지 이해했음을 보여 줍니다. 여러분도 글을 읽을 때 인물의 실제 행동과 상대의 인식을 구분하며 읽어 보세요. 수고했어요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
