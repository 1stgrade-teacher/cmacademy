<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SO 레벨1 7강 적용독해01 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}
.lp *{box-sizing:border-box}

.lp-chips .x{background:none;color:#999;padding:0}
.lp-sno{font-size:13px;color:#8493A1;font-weight:700;margin-bottom:8px}

.lp-chunks{display:flex;flex-wrap:wrap;gap:16px 10px;margin-bottom:12px;align-items:flex-end}
.lp-chunk{display:flex;flex-direction:column}
.lp-chunk .ko{font-size:13px;color:var(--pk-t);font-weight:700;line-height:1.3;margin-bottom:2px}
.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}
.lp-top::before{height:5px;background:linear-gradient(90deg,var(--pk) 0,var(--pk) 80%,var(--am) 80%,var(--am) 100%)}
.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}
.lp-tag{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700;padding:2px 12px}
.lp-qn{flex:0 0 112px;height:112px;align-self:center;background:#fff;color:var(--pk);border:3px solid var(--pk);border-radius:50%;font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;font-size:26px}
.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}
.lp-qn .qt{display:block;white-space:nowrap;line-height:1.12;letter-spacing:-.02em}
.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}
.lp-st{border-radius:4px;border-left:4px solid var(--pk-b)}
.lp-st h4{color:var(--ink,#1B2733)}
.lp-st h4 i{border-radius:4px;width:auto;min-width:24px;padding:0 4px}
.lp-pill{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700}
.lp-chain span.c{background:#fff;border:1px solid #AEBBE6;border-radius:3px;font-weight:600}
.lp-ct th{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif}
.lp-vg em{background:#fff;border:1px solid var(--pk-b);border-radius:3px}
.lp-sa>div{border-radius:4px;border-color:var(--pk-b)}
.lp-chips span{border-radius:3px;background:#fff}
.lp-chips .s{border:1px solid #AEBBE6;color:#3A4FA3}
.lp-chips .a{border:1px solid var(--am-b);color:var(--am-d);background:#FFFBF2}
.lp-sno .es{background:var(--am);border-radius:2px;font-weight:700}
.lp-chunk .en{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:600}
.lp-chunk+.lp-chunk{border-left:1px solid var(--pk-b)}
.lp .tgt{background:var(--am-l);border-bottom:2.5px dotted var(--am)}

.lp-ko{border-radius:0;border-left:4px solid var(--pk);background:none;padding:4px 0 4px 12px}
.lp-mn{border-radius:4px;background:var(--am-l);border-color:var(--am-b);color:#5C4510}
.lp-ap{border-radius:4px;border:1px solid var(--pk-b);border-top:3px solid var(--pk);background:var(--pk-ll)}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"SO 레벨1 7강 적용독해01","audioDir":"7-01_audio","preview":false,"count":33,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">7강\u003cbr>적용독해01\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">SO 레벨1\u003c/div>\u003ch1>A Duck as a Newspaper Seller's Assistant\u003c/h1>\u003ch2>신문 판매업자의 오리 조수\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>요약: 사업주들은 매출 증대를 도와줄 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">아이디어\u003c/b>를 늘 찾는데, 중국 광둥성의 한 신문 판매업자는 오리를 \u003cb class=\"key\">조수\u003c/b>로 활용해 고객을 끄는 독특한 방법을 생각해 냈다. 그 오리는 부리로 돈을 받고 신문을 건네며 \u003cb class=\"key\">자명종\u003c/b> 역할까지 해내고, Wang은 그런 훌륭한 조수를 두어 기뻐하며 오리를 죽이거나 팔 의도가 없다고 밝혔다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Business owners constantly seek new ideas to boost sales, and one newspaper seller shows how a duck can serve as an excellent assistant.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분, 오늘은 아주 흥미로운 지문을 하나 함께 읽어 볼 거예요. 중국 광둥성에서 신문을 파는 한 남자와, 그를 돕는 아주 특별한 조수에 관한 이야기예요. 그 조수가 사람이 아니라 오리라는 점이 이 글의 재미있는 핵심이죠. 요지는 사업주들이 매출을 늘릴 새로운 아이디어를 늘 찾는다는 것, 그리고 그 오리가 훌륭한 조수라는 거예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">먼저 배경지식을 조금 넓혀 볼게요. 광둥성(Guangdong province)은 중국 남부에 있는 상업이 아주 활발한 지역으로, 길거리 장사와 소규모 판매가 흔한 곳이에요. 가판대(kiosk)는 길에서 신문이나 잡지, 간식을 파는 작은 매점을 말하고, 그 앞의 카운터(counter)에서 돈을 주고받죠. 이런 가판대 사장들은 매출(sales)을 늘리기 위해 늘 새로운 marketing 아이디어를 고민합니다. 오리는 원래 사람을 잘 따라오는 동물로 유명한데, 마치 단골 카페에서 주인을 알아보고 졸졸 따라오는 강아지처럼 사람 뒤를 잘 따른답니다. 그래서 오리를 조수(assistant)로 쓴다는 발상이 더욱 \u003cb class=\"key\">독특한\u003c/b> 아이디어로 느껴지는 거예요.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 조금 알려 드릴게요. Guangdong province, 즉 광둥성은 중국 남부에 있는 상업이 아주 활발한 지역이에요. kiosk는 길거리에서 신문이나 잡지, 간식을 파는 작은 가판대를 말하고, 그 앞의 counter에서 돈을 주고받죠. 이런 가판대 사장님들은 sales, 즉 매출을 늘리기 위해 늘 새로운 marketing 아이디어를 고민해요. 오리는 원래 사람을 잘 따라오는 동물로 유명한데, 마치 단골 카페에서 주인을 알아보고 졸졸 따라오는 강아지처럼 사람 뒤를 잘 따른답니다. 그래서 오리를 assistant, 즉 조수로 쓴다는 발상이 더욱 독특하게 느껴지는 거예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>새 아이디어 찾기\u003csmall>도입 · 문장 1\u003c/small>\u003c/h4>\u003cp>사업을 하는 사람들은 언제나 매출을 늘릴 방법을 고민합니다. 그래서 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">아이디어\u003c/b>를 끊임없이 찾는다고 일반적인 이야기로 글을 엽니다. 이 문장은 글 전체를 이끄는 \u003cb class=\"key\">주제문\u003c/b> 역할을 해요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>오리 조수 등장\u003csmall>예시 · 문장 2\u003c/small>\u003c/h4>\u003cp>중국 광둥성의 한 신문 판매업자가 등장합니다. 그는 고객을 끌기 위해 \u003cb class=\"key\">독특한 \u003c/b>\u003cb class=\"key\">방법\u003c/b>을 생각해 냈어요. 바로 오리를 \u003cb class=\"key\">조수\u003c/b>로 활용하는 방법입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>오리의 활약\u003csmall>근거 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>오리는 가판대 카운터 뒤 의자 위에 서서 부리로 돈을 받고 신문을 건넵니다. 심지어 \u003cb class=\"key\">자명종\u003c/b> 역할까지 해요. 주인 Wang이 \u003cb class=\"key\">낮잠\u003c/b>을 자는 동안 누군가 신문을 사러 오면 크게 꽥 소리를 내서 그를 깨워 줍니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>만족과 다짐\u003csmall>결론 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>Wang은 그토록 훌륭한 조수를 두어서 무척 기뻐합니다. 그는 오리를 죽이거나 팔 \u003cb class=\"key\">의도\u003c/b>가 전혀 없다고 확실히 밝혀요. 오리가 단순한 도구가 아니라 소중한 동료로 대접받는다는 점이 인상적입니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 이제 글의 흐름을 단계별로 따라가 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 도입이에요. 사업주들은 항상 매출을 늘려 줄 새로운 아이디어를 찾는다고 이야기하면서 글을 시작하죠. 이 문장이 글 전체를 이끄는 주제문이에요. 아주 일반적인 이야기로 문을 여는 겁니다.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 구체적인 예시가 등장해요. 중국 광둥성의 한 신문 판매업자가 고객을 끌 독특한 방법을 생각해 냈다는 내용이죠. 그 방법은 바로 오리를 조수로 활용하는 거예요.","hl":"f1"},{"n":6,"text":"세 번째 단계에서는 그 오리가 실제로 무엇을 하는지 알려 줘요. 가판대 카운터 뒤 의자 위에 서서 부리로 돈을 받고 신문을 건네준답니다. 심지어 주인인 Wang이 낮잠을 자다가도 누군가 신문을 사러 오면 크게 꽥 소리를 내서 그를 깨워 주는 자명종 역할까지 해요.","hl":"f2"},{"n":7,"text":"네 번째 단계는 결론이에요. Wang은 그토록 훌륭한 조수를 두어서 아주 기뻐하고, 그 오리를 죽이거나 팔 의도가 전혀 없다고 확실히 밝혀요. 오리를 돈벌이 도구가 아니라 소중한 동료로 대한다는 뜻이죠.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">예시\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 번째 문장에서 사업주들은 매출을 늘릴 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">아이디어\u003c/b>를 찾는다는 일반적인 주제를 먼저 제시합니다. 이어서 두 번째 문장부터는 광둥성의 신문 판매업자라는 구체적인 \u003cb class=\"key\">예시\u003c/b>를 들어 그 주제를 뒷받침해요. 주제가 맨 앞에 나오고 사례가 뒤따르므로 \u003cb class=\"key\">두괄식\u003c/b> 구조입니다. 마지막 문장은 판매업자의 태도로 사례를 깔끔하게 맺어 줍니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003c/div>","segs":[{"n":8,"text":"이 글은 예시를 통해 주제를 뒷받침하는 전개 방식이에요. 첫 번째 문장에서 일반적인 주제를 먼저 던지고, 두 번째 문장부터 구체적인 사례를 보여 주죠. 그래서 주제가 앞에 나오는 두괄식 구조예요. 첫 번째 문장이 주제문이라는 점을 꼭 기억해 두세요.","hl":"ty"},{"n":9,"text":"신호어도 함께 짚어 볼게요. 두 번째 문장의 One newspaper seller라는 표현은 구체적인 예시를 시작한다는 신호예요. 네 번째 문장의 even은 심지어라는 뜻으로 정보를 한 단계 더 강조하죠. 여섯 번째 문장의 As for Wang은 화제를 판매업자 쪽으로 돌리는 전환이고, 마지막 문장의 made it clear는 결론을 힘 있게 맺는 표현이에요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>business owner\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사업주, 사장\u003c/span>\u003c/div>\u003cdiv>\u003cb>look for\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>찾다\u003c/span>\u003c/div>\u003cdiv>\u003cb>increase\u003c/b>\u003cem>동사\u003c/em>\u003cspan>늘리다, 증가시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>sales\u003c/b>\u003cem>명사\u003c/em>\u003cspan>매출, 판매량\u003c/span>\u003c/div>\u003cdiv>\u003cb>province\u003c/b>\u003cem>명사\u003c/em>\u003cspan>주, 성(행정 구역)\u003c/span>\u003c/div>\u003cdiv>\u003cb>come up with\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>생각해 내다, 마련하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>unique\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>독특한, 유일한\u003c/span>\u003c/div>\u003cdiv>\u003cb>attract\u003c/b>\u003cem>동사\u003c/em>\u003cspan>끌다, 유인하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>customer\u003c/b>\u003cem>명사\u003c/em>\u003cspan>고객, 손님\u003c/span>\u003c/div>\u003cdiv>\u003cb>assistant\u003c/b>\u003cem>명사\u003c/em>\u003cspan>조수, 보조원\u003c/span>\u003c/div>\u003cdiv>\u003cb>counter\u003c/b>\u003cem>명사\u003c/em>\u003cspan>계산대, 카운터\u003c/span>\u003c/div>\u003cdiv>\u003cb>kiosk\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가판대, 매점\u003c/span>\u003c/div>\u003cdiv>\u003cb>beak\u003c/b>\u003cem>명사\u003c/em>\u003cspan>(새의) 부리\u003c/span>\u003c/div>\u003cdiv>\u003cb>collect\u003c/b>\u003cem>동사\u003c/em>\u003cspan>받다, 거두어들이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>hand out\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>건네주다, 나눠주다\u003c/span>\u003c/div>\u003cdiv>\u003cb>even\u003c/b>\u003cem>부사\u003c/em>\u003cspan>심지어\u003c/span>\u003c/div>\u003cdiv>\u003cb>act as\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 활약하다, ~역할을 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>alarm clock\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자명종 시계\u003c/span>\u003c/div>\u003cdiv>\u003cb>nap\u003c/b>\u003cem>명사\u003c/em>\u003cspan>낮잠\u003c/span>\u003c/div>\u003cdiv>\u003cb>take a nap\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>낮잠을 자다\u003c/span>\u003c/div>\u003cdiv>\u003cb>quack\u003c/b>\u003cem>동사\u003c/em>\u003cspan>꽥 소리를 내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>loudly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>크게, 큰 소리로\u003c/span>\u003c/div>\u003cdiv>\u003cb>wake up\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>깨우다, 깨다\u003c/span>\u003c/div>\u003cdiv>\u003cb>come by\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>들르다, 찾아오다\u003c/span>\u003c/div>\u003cdiv>\u003cb>as for\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 관해서는, ~로서는\u003c/span>\u003c/div>\u003cdiv>\u003cb>quite\u003c/b>\u003cem>부사\u003c/em>\u003cspan>꽤, 상당히\u003c/span>\u003c/div>\u003cdiv>\u003cb>glad\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>기쁜\u003c/span>\u003c/div>\u003cdiv>\u003cb>excellent\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>훌륭한, 뛰어난\u003c/span>\u003c/div>\u003cdiv>\u003cb>make it clear\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>확실히 밝히다\u003c/span>\u003c/div>\u003cdiv>\u003cb>intention\u003c/b>\u003cem>명사\u003c/em>\u003cspan>의도, 의향\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"단어도 몇 개 짚고 갈게요. come up with는 생각해 내다, hand out은 건네주다라는 뜻이에요. take a nap은 낮잠을 자다, wake up은 깨우다라는 뜻이고요. make it clear는 확실히 밝히다라는 숙어니까 꼭 외워 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">unique\u003c/b>\u003cspan class=\"m\">독특한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">distinctive\u003c/span>\u003cspan class=\"s\">unusual\u003c/span>\u003cspan class=\"s\">uncommon\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">common\u003c/span>\u003cspan class=\"a\">ordinary\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">increase\u003c/b>\u003cspan class=\"m\">늘리다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">raise\u003c/span>\u003cspan class=\"s\">boost\u003c/span>\u003cspan class=\"s\">grow\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">decrease\u003c/span>\u003cspan class=\"a\">reduce\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">attract\u003c/b>\u003cspan class=\"m\">끌다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">draw\u003c/span>\u003cspan class=\"s\">appeal to\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">repel\u003c/span>\u003cspan class=\"a\">drive away\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">assistant\u003c/b>\u003cspan class=\"m\">조수\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">helper\u003c/span>\u003cspan class=\"s\">aide\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">excellent\u003c/b>\u003cspan class=\"m\">훌륭한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">superb\u003c/span>\u003cspan class=\"s\">outstanding\u003c/span>\u003cspan class=\"s\">remarkable\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">poor\u003c/span>\u003cspan class=\"a\">inferior\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">glad\u003c/b>\u003cspan class=\"m\">기쁜\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">pleased\u003c/span>\u003cspan class=\"s\">happy\u003c/span>\u003cspan class=\"s\">delighted\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">sad\u003c/span>\u003cspan class=\"a\">upset\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">intention\u003c/b>\u003cspan class=\"m\">의도\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">purpose\u003c/span>\u003cspan class=\"s\">aim\u003c/span>\u003cspan class=\"s\">plan\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 정리해 볼게요. unique는 독특한이라는 뜻으로 distinctive나 unusual와 가깝고, 반대말은 common이에요. increase는 늘리다는 뜻으로 raise, boost와 비슷하고 decrease가 반대말이죠. attract는 끌다라는 뜻으로 draw, appeal to와 통하고, excellent는 superb나 outstanding과 같은 뜻이에요. glad는 pleased, happy와 비슷하고, intention은 purpose, aim과 바꿔 쓸 수 있답니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사장들은\u003c/span>\u003cspan class=\"en\">Business owners\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">항상 찾고 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">always \u003c/span>\u003cspan class=\"tgt\">looking \u003c/span>\u003cspan class=\"tgt\">for\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새로운 아이디어를\u003c/span>\u003cspan class=\"en\">new ideas\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들을 도와줄\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">help \u003c/span>\u003cspan class=\"tgt\">them \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매출을 늘리도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">increase\u003c/span> their sales.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사장들은 항상 매출 증대를 도와줄 새로운 아이디어를 찾는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글의 첫 시작으로, 모든 사장이 매출을 늘릴 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">아이디어\u003c/b>를 늘 찾는다는 일반적인 상황을 깔아 주는 \u003cb class=\"key\">도입부\u003c/b> 역할을 해요. 이렇게 넓은 \u003cb class=\"key\">배경\u003c/b>을 먼저 제시해 두면, 뒤이어 나오는 오리 조수라는 엉뚱한 사례가 훨씬 신선하게 다가옵니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재진행형(always와 결합한 습관 강조)\u003c/span> : [be동사] + always + [동사-ing] : \"항상 찾고 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : [선행사 ideas] + that + [동사 will help] : \"그들을 도와줄 (아이디어)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">help + 목적어 + 원형부정사\u003c/span> : help + [목적어] + [(to) increase] : \"그들이 늘리도록 돕다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Business owners, 사장들은. are always looking for, 항상 찾고 있다. new ideas, 새로운 아이디어를. that will help them, 그들을 도와줄. increase their sales, 매출을 늘리도록. 이 문장 전체를 해석하면, 사장들은 항상 매출 증대를 도와줄 새로운 아이디어를 찾는다.","hl":"m"},{"n":13,"text":"이 문장은 글의 첫 문장이에요. 세상 모든 사장이 매출을 늘려 줄 새로운 아이디어를 늘 찾고 있다는 일반적인 도입부를 깔아 주는 거죠. 이렇게 배경을 먼저 잡아 주면, 뒤에 나오는 오리 조수 이야기가 얼마나 엉뚱하고 신선한지 더 잘 느껴집니다.","hl":"mn"},{"n":14,"text":"첫 번째로 are always looking for를 보세요. be동사에 always가 붙으면 '항상 하고 있다'는 습관을 강조하는 현재진행형이 돼요. 두 번째, that will help them에서 that은 앞의 new ideas를 받는 주격 관계대명사입니다. 세 번째, help them increase는 help 뒤에 목적어, 그리고 동사원형이 오는 형태로 목적어가 하는 행동을 이어 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 신문 판매업자는\u003c/span>\u003cspan class=\"en\">One newspaper seller\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">중국의 광동 주에서\u003c/span>\u003cspan class=\"en\">in the Chinese province of Guangdong\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">독특한 방법을 생각해 냈다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">come \u003c/span>\u003cspan class=\"tgt\">up \u003c/span>\u003cspan class=\"tgt\">with\u003c/span> a unique way\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고객을 끌 (방법을)\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">attracting\u003c/span> customers\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 오리를 조수로 활용한다\u003c/span>\u003cspan class=\"en\">— he uses a duck \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">assistant\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">중국의 광동의 한 신문 판매업자는 고객을 끌 독특한 방법을 생각해 냈다. 오리를 조수로 활용하는 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 말한 '새로운 아이디어'가 무엇인지 바로 보여 주는 \u003cb class=\"key\">구체적 \u003c/b>\u003cb class=\"key\">사례\u003c/b> 문장이에요. 오리를 조수로 쓴다는 \u003cb class=\"key\">독특한 \u003c/b>\u003cb class=\"key\">방법\u003c/b>을 내세워 독자의 흥미를 확 끌어당기는 역할을 합니다. 뒤에 이어질 오리 조수의 구체적인 활약을 예고하는 \u003cb class=\"key\">전환점\u003c/b>이기도 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재완료(have/has + 과거분사)\u003c/span> : [주어] + has + [과거분사] : \"생각해 냈다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사의 목적어로 쓰인 동명사\u003c/span> : [전치사 of] + [동명사(-ing)] : \"끄는 (방법)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 as(~로서)\u003c/span> : use + [목적어] + as + [명사] : \"그의 조수로서\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"One newspaper seller, 한 신문 판매업자는. in the Chinese province of Guangdong, 중국의 광동 주에서. has come up with a unique way, 독특한 방법을 생각해 냈다. of attracting customers, 고객을 끌 (방법을). — he uses a duck as his assistant, 그는 오리를 조수로 활용한다. 이 문장 전체를 해석하면, 중국의 광동의 한 신문 판매업자는 고객을 끌 독특한 방법을 생각해 냈다. 오리를 조수로 활용하는 것이다.","hl":"m"},{"n":16,"text":"이 문장은 앞에서 말한 새로운 아이디어가 무엇인지 구체적 사례로 보여 주는 문장이에요. 오리를 조수로 쓴다는 독특한 방법을 던져서 독자의 흥미를 확 끌어당기죠. 그리고 뒤에서 오리가 어떤 일을 하는지 자세히 풀어 줄 준비를 하는 전환점 역할도 합니다.","hl":"mn"},{"n":17,"text":"첫 번째, has come up with는 현재완료예요. 과거에 생각해 낸 일이 지금까지 결과로 남아 있다는 느낌을 줍니다. 두 번째, of attracting에서 of는 전치사라서 뒤에 동명사 attracting이 온 거예요. way of -ing로 '~하는 방법'이라고 외워 두면 좋습니다. 세 번째, as his assistant에서 as는 '~로서'라는 자격의 전치사로, use A as B, A를 B로 활용하다는 구조를 만들어 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 오리는 의자 위에 서서\u003c/span>\u003cspan class=\"en\">The duck stands on a chair\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가판대 카운터 뒤에 있는\u003c/span>\u003cspan class=\"en\">behind the counter of the kiosk\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">부리를 이용해서\u003c/span>\u003cspan class=\"en\">and uses its beak\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">돈을 받고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">collect \u003c/span>\u003cspan class=\"tgt\">money \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">손님들에게 신문을 건네준다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">hand \u003c/span>\u003cspan class=\"tgt\">out \u003c/span>\u003cspan class=\"tgt\">newspapers \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">customers\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 오리는 가판대 카운터 뒤에 있는 의자 위에 서서 부리를 이용해서 손님들에게 돈을 받고 신문을 건네준다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 예고한 오리 조수의 활약을 구체적으로 그려 주는 \u003cb class=\"key\">세부 \u003c/b>\u003cb class=\"key\">묘사\u003c/b> 문장이에요. 의자 위에 서서 부리로 돈을 받고 신문까지 건넨다는 \u003cb class=\"key\">구체적 \u003c/b>\u003cb class=\"key\">장면\u003c/b>을 통해 독특한 방법이 실제로 가능하다는 인상을 줍니다. 이 장면 덕분에 글 전체가 \u003cb class=\"key\">이야기\u003c/b>처럼 생생하게 느껴져요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : [동사구 uses its beak] + [to + 동사원형] : \"돈을 받기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동사원형의 병렬 구조\u003c/span> : to [collect] and [(to) hand out] : \"돈을 받고 신문을 건네주기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">구동사 hand out + 목적어 + to + 대상\u003c/span> : hand out + [목적어] + to + [대상] : \"손님들에게 신문을 건네주다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"The duck stands on a chair, 그 오리는 의자 위에 서서. behind the counter of the kiosk, 가판대 카운터 뒤에 있는. and uses its beak, 부리를 이용해서. to collect money, 돈을 받고. and hand out newspapers to customers, 손님들에게 신문을 건네준다. 이 문장 전체를 해석하면, 그 오리는 가판대 카운터 뒤에 있는 의자 위에 서서 부리를 이용해서 손님들에게 돈을 받고 신문을 건네준다.","hl":"m"},{"n":19,"text":"이 문장은 앞에서 예고했던 오리 조수의 활약을 아주 구체적으로 그려 주는 세부 묘사예요. 의자 위에 올라서서 부리로 돈을 받고 신문까지 건넨다는 장면을 보여 주면서, 이 독특한 방법이 실제로 가능하다는 인상을 줍니다. 덕분에 글 전체가 딱딱한 설명이 아니라 생생한 이야기처럼 읽히게 됩니다.","hl":"mn"},{"n":20,"text":"첫 번째, to collect money는 '돈을 받기 위해'라는 목적을 나타내는 to부정사의 부사적 용법이에요. 두 번째, collect money and hand out을 보세요. 하나의 to부정사 안에서 두 동사가 and로 나란히 묶인 병렬 구조입니다. 세 번째, hand out newspapers to customers는 나눠주다라는 구동사에 목적어와 to로 대상을 붙인 형태로, 무엇을 누구에게 주는지가 분명하게 드러납니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은\u003c/span>\u003cspan class=\"en\">It\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">심지어 활약한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">even\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">acts \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자명종 시계로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">alarm \u003c/span>\u003cspan class=\"tgt\">clock\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">심지어 그 오리는 자명종 시계로도 활약한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 세 번째 문장에서 오리가 부리로 돈을 받고 신문을 건넨다고 했는데, 여기에 \u003cb class=\"key\">추가\u003c/b>로 자명종 기능까지 있다는 뜻이에요. even은 '\u003cb class=\"key\">심지어\u003c/b>'라는 뜻으로 앞의 놀라운 재주에 하나 더 \u003cb class=\"key\">강조\u003c/b>를 더해 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부사 even (강조)\u003c/span> : even + [강조하고 싶은 말(동사·명사·구)] → '심지어 ~조차' : \"심지어\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 as (~로서), act as 관용표현\u003c/span> : act [자동사] + as + [명사(역할)] → '~로서 역할하다' : \"자명종 시계로 활약한다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"It, 그것은. even acts, 심지어 활약한다. as an alarm clock, 자명종 시계로. 이 문장 전체를 해석하면, 심지어 그 오리는 자명종 시계로도 활약한다.","hl":"m"},{"n":22,"text":"세 번째 문장에서 오리가 부리로 돈을 받고 신문을 건넨다고 했죠. 그런데 그게 끝이 아니에요. even이 '심지어'라는 뜻으로, 앞의 놀라운 재주에 자명종 기능까지 더해진다는 걸 강조하고 있습니다.","hl":"mn"},{"n":23,"text":"여기서 눈여겨볼 표현은 act as예요. act는 '행동하다, 역할을 하다'라는 자동사이고, 뒤에 전치사 as가 붙으면 '로서'라는 뜻이 더해져서 '로 활약하다'가 됩니다. 그리고 even은 '심지어'라는 부사인데, 강조하고 싶은 말 바로 앞에 놓인다는 것도 함께 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">신문 판매업자가,\u003c/span>\u003cspan class=\"en\">When the newspaper seller,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이름이 Wang이라는 사람인데,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">man \u003c/span>\u003cspan class=\"tgt\">named \u003c/span>\u003cspan class=\"tgt\">Wang\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">낮잠을 자는 중에,\u003c/span>\u003cspan class=\"en\">takes a nap,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오리가 크게 꽥 소리를 낸다\u003c/span>\u003cspan class=\"en\">the duck quacks loudly\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그를 깨우기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">wake \u003c/span>\u003cspan class=\"tgt\">him \u003c/span>\u003cspan class=\"tgt\">up\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">누군가 들르면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">if \u003c/span>\u003cspan class=\"tgt\">someone \u003c/span>\u003cspan class=\"tgt\">comes \u003c/span>\u003cspan class=\"tgt\">by\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">신문을 사러.\u003c/span>\u003cspan class=\"en\">to buy a newspaper.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">신문 판매업자가, 이름이 Wang 이라는 사람인데, 낮잠을 자는 중에 누군가 신문을 사러오면 오리가 그를 깨우기 위해 크게 꽥 소리를 낸다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 네 번째 문장에서 말한 '자명종'이 실제로 어떻게 작동하는지 \u003cb class=\"key\">구체적\u003c/b>으로 보여 주는 문장이에요. Wang이 낮잠을 자는 \u003cb class=\"key\">상황\u003c/b>에서 손님이 오면 오리가 소리쳐 주인을 깨운다는 \u003cb class=\"key\">예시\u003c/b>를 담고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사 named의 형용사적 용법(동격 삽입구)\u003c/span> : [명사 a man] + [named + 이름 (과거분사구)] → '이름이 ~인 사람' : \"이름이 Wang이라는 사람\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : [동사 quacks] + [to + 동사원형 (to부정사구/목적)] : \"그를 깨우기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">조건의 부사절 접속사 if + 현재시제\u003c/span> : If + [주어] + [현재동사], [주어] + [동사] (미래의 일도 현재로) : \"누군가 들르면\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"When the newspaper seller, 신문 판매업자가. a man named Wang, 이름이 Wang이라는 사람인데. takes a nap, 낮잠을 자는 중에. the duck quacks loudly, 오리가 크게 꽥 소리를 낸다. to wake him up, 그를 깨우기 위해. if someone comes by, 누군가 들르면. to buy a newspaper, 신문을 사러.. 이 문장 전체를 해석하면, 신문 판매업자가, 이름이 Wang 이라는 사람인데, 낮잠을 자는 중에 누군가 신문을 사러오면 오리가 그를 깨우기 위해 크게 꽥 소리를 낸다.","hl":"m"},{"n":25,"text":"네 번째 문장에서 자명종이라고 했죠. 이 문장이 그 자명종이 실제로 어떻게 작동하는지 알려 줍니다. Wang이 낮잠을 자는 동안 누군가 신문을 사러 오면, 오리가 크게 꽥꽥 울어서 주인을 깨워 주는 거예요.","hl":"mn"},{"n":26,"text":"첫 번째로 a man named Wang을 보세요. name은 '이름을 짓다'라는 타동사이고, 사람은 이름이 붙여지는 대상이죠. 그래서 수동의 의미를 가진 과거분사 named가 man 뒤에서 꾸며 주는 겁니다. 두 번째로 to wake him up은 '그를 깨우기 위해'라는 목적을 나타내는 to부정사예요. wake up처럼 동사와 부사가 붙은 구동사는 him 같은 대명사가 오면 반드시 wake him up처럼 가운데에 넣어야 한다는 것도 꼭 기억하세요. 세 번째로 if someone comes by는 조건을 나타내는 부사절인데, 미래의 일이어도 부사절 안에서는 현재시제 comes를 씁니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Wang으로서는,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">As \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">Wang\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 정말 기뻐한다\u003c/span>\u003cspan class=\"en\">he is quite \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">glad \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그토록 훌륭한 조수를 두어서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">have\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">such \u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">excellent \u003c/span>\u003cspan class=\"tgt\">assistant\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Wang 으로서는 그토록 훌륭한 조수를 두어서 정말 기뻤다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 오리에 대한 설명에서 \u003cb class=\"key\">화제\u003c/b>를 주인 Wang의 \u003cb class=\"key\">감정\u003c/b>으로 옮기며 글을 마무리하는 문장이에요. quite glad는 '\u003cb class=\"key\">정말\u003c/b> 기쁘다'는 뜻으로, 훌륭한 조수를 둔 데 대한 만족을 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구 관용표현 As for (~에 관해서는)\u003c/span> : As for + [명사/목적격], [주어] + [동사] (화제 전환) : \"Wang으로서는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(감정의 원인)\u003c/span> : [감정 형용사 glad] + [to + 동사원형 (감정의 원인)] : \"조수를 두어서 (기쁜)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">such + a/an + 형용사 + 명사 어순\u003c/span> : such + [a/an] + [형용사] + [명사] : \"그토록 훌륭한 조수\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"As for Wang, Wang으로서는. he is quite glad, 그는 정말 기뻐한다. to have such an excellent assistant, 그토록 훌륭한 조수를 두어서. 이 문장 전체를 해석하면, Wang 으로서는 그토록 훌륭한 조수를 두어서 정말 기뻤다.","hl":"m"},{"n":28,"text":"오리에 대한 이야기에서 화제를 주인 Wang의 감정으로 옮기면서 글을 마무리하는 문장이에요. 그만큼 오리가 자기에게 얼마나 큰 도움이 되는지 만족스러워한다는 뜻이죠.","hl":"mn"},{"n":29,"text":"먼저 As for Wang을 보세요. as for는 '에 관해서는, 로서는'이라는 뜻으로 화제를 바꿀 때 쓰는 표현이고, for는 전치사라서 뒤에 목적격 Wang이 옵니다. 다음으로 glad to have에서 glad처럼 감정을 나타내는 감정 형용사 뒤의 to부정사는 그 감정의 원인을 나타내요. 마지막으로 such an excellent assistant, such는 강조의 뜻이고 부정관사 an은 such 뒤, 형용사 앞에 온다는 어순을 꼭 외워 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는\u003c/span>\u003cspan class=\"en\">He\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">확실히 밝혔다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">made \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">clear\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그가 전혀 의도가 없다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">no \u003c/span>\u003cspan class=\"tgt\">intentions\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">죽이거나 파는\u003c/span>\u003cspan class=\"en\">of \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">killing \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">selling\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 오리를\u003c/span>\u003cspan class=\"en\">the duck.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 그 오리를 죽이거나 팔 의도가 전혀 없다는 것을 확실히 밝혔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Wang이 오리를 \u003cb class=\"key\">소중한 \u003c/b>\u003cb class=\"key\">조수\u003c/b>로 여기며, 죽이거나 팔 생각이 전혀 없음을 분명히 밝히는 문장이에요. 앞에서 오리의 활약을 보여 준 뒤, 그 오리를 계속 \u003cb class=\"key\">함께할 \u003c/b>\u003cb class=\"key\">존재\u003c/b>로 두겠다는 태도로 글을 맺어요. made it clear that은 무엇을 분명히 했다는 뜻을 전달하는 \u003cb class=\"key\">표현\u003c/b>이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재완료와 가목적어 it 구문\u003c/span> : has + made + [가목적어 it] + [목적격보어 clear] + [진목적어 that절] : \"확실히 밝혔다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 that의 명사절\u003c/span> : [make + it + clear] + [that + 주어 + 동사 ~] : \"그가 전혀 의도가 없다는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 of 뒤 동명사와 병렬\u003c/span> : intentions of [동명사 killing] or [동명사 selling] : \"죽이거나 파는\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"He, 그는. has made it clear, 확실히 밝혔다. that he has no intentions, 그가 전혀 의도가 없다는 것을. of killing or selling, 죽이거나 파는. the duck, 그 오리를. 이 문장 전체를 해석하면, 그는 그 오리를 죽이거나 팔 의도가 전혀 없다는 것을 확실히 밝혔다.","hl":"m"},{"n":31,"text":"이 문장은 Wang이 오리를 소중한 조수로 여기며 죽이거나 팔 생각이 전혀 없음을 분명히 밝히는 문장이에요. 앞에서 오리의 활약을 보여 준 뒤 그 오리를 계속 함께할 존재로 두겠다는 태도로 글을 맺고 있죠. made it clear that은 무엇을 분명히 했다는 뜻을 전달하는 표현이에요.","hl":"mn"},{"n":32,"text":"첫 번째로, has made it clear에서 make는 목적어와 목적격보어를 취하는데 that절이 길어지면 가목적어 it을 먼저 쓰고 clear를 붙인 뒤 진짜 목적어인 that절을 뒤로 보내며, has made는 현재완료로 지금까지 그렇게 밝혀 온 상태를 나타내요. 두 번째로, that he has no intentions에서 that은 무엇이라는 것으로 해석되는 명사절 접속사이고 앞의 가목적어 it이 가리키는 진목적어 역할을 하며, that절 안에는 he has no intentions라는 완전한 절이 와요. 세 번째로, killing or selling에서 전치사 of 뒤에는 동사원형이 아니라 동명사가 오고, killing과 selling이 or로 연결된 병렬 구조라서 죽이거나 파는 뜻을 함께 만들어요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>사업주들은 매출 증대를 도와줄 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">아이디어\u003c/b>를 항상 찾는다.\u003c/li>\u003cli>중국 광둥성의 한 신문 판매업자는 오리를 \u003cb class=\"key\">조수\u003c/b>로 활용해 고객을 끄는 독특한 방법을 생각해 냈다.\u003c/li>\u003cli>그 오리는 부리로 돈을 받고 신문을 건네며, 손님이 오면 꽥 소리를 내 \u003cb class=\"key\">자명종\u003c/b> 역할까지 해낸다.\u003c/li>\u003cli>Wang은 그런 \u003cb class=\"key\">훌륭한 \u003c/b>\u003cb class=\"key\">조수\u003c/b>를 두어 기뻐하며, 오리를 죽이거나 팔 의도가 전혀 없다고 밝혔다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Business owners constantly seek new ideas to boost sales, and one newspaper seller shows how a duck can serve as an excellent assistant.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: 사업주들은 매출 증대를 도와줄 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">아이디어\u003c/b>를 늘 찾는데, 중국 광둥성의 한 신문 판매업자는 오리를 \u003cb class=\"key\">조수\u003c/b>로 활용해 고객을 끄는 독특한 방법을 생각해 냈다. 그 오리는 부리로 돈을 받고 신문을 건네며 \u003cb class=\"key\">자명종\u003c/b> 역할까지 해내고, Wang은 그런 훌륭한 조수를 두어 기뻐하며 오리를 죽이거나 팔 의도가 없다고 밝혔다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":33,"text":"오늘 지문은 오리 한 마리가 훌륭한 조수가 된 이야기였어요. 사업주는 새로운 아이디어를 찾고, 그 아이디어가 독특한 예시로 이어진다는 구조를 기억하면 돼요. 두괄식 주제문과 예시 신호어, 그리고 핵심 어휘까지 잘 챙겨 가세요. 수고했어요, 다음 시간에 또 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
