<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SO 레벨1 12강 적용독해01 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-chips .x{background:none;color:#999;padding:0}
.lp-sno{font-size:13px;color:#8493A1;font-weight:700;margin-bottom:8px}

.lp-chunk{display:flex;flex-direction:column}
.lp-chunk .ko{font-size:13px;color:var(--pk-t);font-weight:700;line-height:1.3;margin-bottom:2px}
.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}
.lp-top::before{height:5px;background:linear-gradient(90deg,var(--pk) 0,var(--pk) 80%,var(--am) 80%,var(--am) 100%)}
.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}
.lp-tag{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700;padding:2px 12px}
.lp-qn{flex:0 0 112px;height:112px;align-self:center;background:#fff;color:var(--pk);border:3px solid var(--pk);border-radius:50%;font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;font-size:26px}
.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}
.lp-qn .qt{display:block;white-space:nowrap;line-height:1.12;letter-spacing:-.02em}
.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}

.lp-st h4{color:var(--ink,#1B2733)}
.lp-st h4 i{border-radius:4px;width:auto;min-width:24px;padding:0 4px}
.lp-pill{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700}
.lp-chain span.c{background:#fff;border:1px solid #AEBBE6;border-radius:3px;font-weight:600}
.lp-ct th{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif}
.lp-vg em{background:#fff;border:1px solid var(--pk-b);border-radius:3px}
.lp-sa>div{border-radius:4px;border-color:var(--pk-b)}

.lp-chips .s{border:1px solid #AEBBE6;color:#3A4FA3}
.lp-chips .a{border:1px solid var(--am-b);color:var(--am-d);background:#FFFBF2}
.lp-sno .es{background:var(--am);border-radius:2px;font-weight:700}
.lp-chunk .en{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:600}
.lp-chunk+.lp-chunk{border-left:1px solid var(--pk-b)}
.lp .tgt{background:var(--am-l);border-bottom:2.5px dotted var(--am)}

.lp-ko{border-radius:0;border-left:4px solid var(--pk);background:none;padding:4px 0 4px 12px}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"SO 레벨1 12강 적용독해01","audioDir":"12-01_audio","preview":false,"count":30,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">12강\u003cbr>적용독해01\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">SO 레벨1\u003c/div>\u003ch1>The Romeo and Juliet Effect: Why Barriers Increase Attraction\u003c/h1>\u003ch2>로미오와 줄리엣 효과: 장벽이 끌림을 키우는 이유\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>사람들은 자신에게 관심이 없어 보이거나 ‘손에 넣기’ 어려운 상대에게 더 끌릴 수 있으며, 이는 \u003cb class=\"key\">장벽\u003c/b>이 오히려 \u003cb class=\"key\">열정\u003c/b>을 키우는 \u003cb class=\"key\">로미오와 \u003c/b>\u003cb class=\"key\">줄리엣\u003c/b> 효과 때문이다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>People can be more attracted to someone who seems uninterested or difficult to get because barriers may increase passion, which is called the Romeo and Juliet effect.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 적용독해 지문을 함께 읽어 볼게요. 이 글은 관심 없는 상대나 손에 넣기 어려운 상대에게 왜 더 끌리는지, 그 이유를 로미오와 줄리엣 효과로 설명합니다. 핵심은 장벽이 오히려 열정을 키울 수 있다는 점이에요. 그럼 지문을 한 문장씩 따라가며 정확히 이해해 봅시다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">로미오와 줄리엣은 셰익스피어의 비극에 나오는 두 젊은이로, 서로 적대하는 가문 사이에서 사랑에 빠집니다. 두 사람을 갈라놓으려는 주변의 방해가 오히려 관계를 더 강렬하게 만드는 경우가 많죠. 심리학에서는 부모나 주변의 간섭이 오히려 애정을 키우는 현상을 \u003cb class=\"key\">로미오와 \u003c/b>\u003cb class=\"key\">줄리엣 \u003c/b>\u003cb class=\"key\">효과\u003c/b>라고 부릅니다. 이와 관련해 금지나 압박을 받을수록 그 행동을 더 하고 싶어지는 마음을 \u003cb class=\"key\">심리적 \u003c/b>\u003cb class=\"key\">반발\u003c/b>이라고 해요. \u003cb class=\"key\">장벽\u003c/b>이 있으면 상대가 더 특별해 보이고 열정이 커질 수 있다는 것이죠. 일상에서도 빨간 버튼을 누르지 말라고 하면 오히려 더 눌러 보고 싶어지는 마음과 비슷합니다.\u003c/div>","segs":[{"n":2,"text":"로미오와 줄리엣은 셰익스피어의 비극에 나오는 두 젊은이입니다. 두 사람은 가문끼리 적대하는 상황에서 사랑에 빠지고, 가족들이 갈라놓으려 할수록 관계는 더 강렬해지죠. 심리학에서는 부모나 주변의 간섭이 오히려 애정을 키우는 현상을 로미오와 줄리엣 효과라고 부릅니다. 이와 관련해 금지나 압박을 받으면 오히려 그 행동을 더 하고 싶어지는 마음을 심리적 반발이라고 해요. 장벽이 있으면 상대가 더 특별해 보이고 열정이 커질 수 있다는 것이죠. 일상에서도 빨간 버튼을 누르지 말라고 하면 더 눌러 보고 싶어지는 것과 비슷합니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>관심 없는 상대\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>글은 당신에게 관심이 없어 보이는 사람을 사랑한 적이 있는지 묻습니다. 이어 어쩌면 그런 \u003cb class=\"key\">관심 \u003c/b>\u003cb class=\"key\">없음\u003c/b> 때문에 오히려 그 사람을 좋아했을 수 있다고 되묻습니다. 상대의 무관심이 \u003cb class=\"key\">끌림\u003c/b>의 이유가 될 수 있다는 문제를 던지는 도입부입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>어려운 상대의 매력\u003csmall>개념 제시 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>더 ‘\u003cb class=\"key\">손에 \u003c/b>\u003cb class=\"key\">넣기\u003c/b>’ 어려운 사람이 더 특별해 보인다고 말합니다. 그러면서 이런 현상에 \u003cb class=\"key\">로미오와 \u003c/b>\u003cb class=\"key\">줄리엣\u003c/b> 효과라는 이름을 붙입니다. 접근이 어려울수록 매력이 커진다는 \u003cb class=\"key\">개념\u003c/b>을 소개하는 단계입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>장벽과 열정\u003csmall>근거·예시 · 문장 5\u003c/small>\u003c/h4>\u003cp>셰익스피어의 희곡처럼 가족이 두 사람을 갈라놓으려 하면 \u003cb class=\"key\">장벽\u003c/b>이 생깁니다. 이 장벽이 오히려 두 사람의 \u003cb class=\"key\">열정\u003c/b>을 증가시킬 수 있다고 설명합니다. 로미오와 줄리엣의 예를 통해 \u003cb class=\"key\">로미오와 \u003c/b>\u003cb class=\"key\">줄리엣 \u003c/b>\u003cb class=\"key\">효과\u003c/b>를 뒷받침합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>금지된 사랑\u003csmall>결론 · 문장 6\u003c/small>\u003c/h4>\u003cp>그래서 많은 사람이 사랑에 빠져서는 안 되는 사람에게 \u003cb class=\"key\">끌림\u003c/b>을 느낀다고 정리합니다. 금지나 장벽이 오히려 \u003cb class=\"key\">사랑\u003c/b>을 키울 수 있다는 결론입니다. 앞의 개념과 예시를 한 문장으로 묶어 주는 마무리입니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 네 단계로 나누어 살펴볼게요.","hl":null},{"n":4,"text":"먼저 글은 당신에게 관심이 없어 보이는 사람을 사랑한 적이 있는지 묻습니다. 그리고 그런 경우 어쩌면 그 사람의 관심 없음 때문에 오히려 그를 좋아했을 수 있다고 되묻죠. 상대의 무관심이 끌림의 이유가 될 수 있다는 문제를 던지는 도입부입니다.","hl":"f0"},{"n":5,"text":"이어서 더 손에 넣기 어려운 사람이 더 특별해 보인다고 말합니다. 그러면서 이런 현상에 로미오와 줄리엣 효과라는 이름을 붙이죠. 접근이 어려울수록 매력이 커진다는 개념을 소개하는 단계입니다.","hl":"f1"},{"n":6,"text":"다음으로 셰익스피어의 희곡처럼 가족이 두 사람을 갈라놓으려 하면 장벽이 생긴다고 설명합니다. 이 장벽이 오히려 두 사람의 열정을 증가시킬 수 있다는 것이죠. 로미오와 줄리엣의 예를 통해 로미오와 줄리엣 효과를 분명히 뒷받침합니다.","hl":"f2"},{"n":7,"text":"마지막으로 그래서 많은 사람이 사랑에 빠져서는 안 되는 사람에게 끌림을 느낀다고 정리합니다. 금지나 장벽이 오히려 사랑을 키울 수 있다는 결론이에요. 앞에서 설명한 개념과 예시를 한 문장으로 묶어 주는 마무리입니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">질문-답변\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 6번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 관심 없는 상대에 대한 질문으로 시작해, 어려운 상대가 더 특별해 보인다는 개념을 제시하고, 로미오와 줄리엣의 예시로 설명한 뒤 마지막에 결론을 내립니다. 핵심 내용이 끝부분에서 정리되므로 \u003cb class=\"key\">미괄식\u003c/b>으로 볼 수 있습니다. \u003cb class=\"key\">장벽\u003c/b>이 \u003cb class=\"key\">열정\u003c/b>을 증가시킨다는 인과가 글의 중심입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>If so (2)\u003c/b>\u003cspan>앞 질문의 답을 이어 주는 연결\u003c/span>\u003cb>known as (4)\u003c/b>\u003cspan>현상의 명칭 제시\u003c/span>\u003cb>like in the case of (5)\u003c/b>\u003cspan>구체적 예시 제시\u003c/span>\u003cb>For this reason (6)\u003c/b>\u003cspan>이유에서 결론으로 연결\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">didn't seem interested in you\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">didn't notice you\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">more difficult to get\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">barrier\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">increase your passion\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">be attracted to\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">shouldn't fall in love with\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>장벽이 있는 관계\u003c/th>\u003cth>장벽이 없는 관계\u003c/th>\u003c/tr>\u003ctr>\u003ctd>상대가 더 특별해 보임\u003c/td>\u003ctd>상대가 덜 특별해 보임\u003c/td>\u003c/tr>\u003ctr>\u003ctd>열정이 증가함\u003c/td>\u003ctd>열정이 약해짐\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 질문으로 시작해 개념을 소개하고 예시로 설명한 뒤 결론을 내리는 질문과 답변의 구조입니다. 도입에서 던진 질문의 답을 중반에 제시하고, 마지막 문장에서 전체 내용을 정리하므로 미괄식이라고 볼 수 있죠. 그래서 글을 읽을 때는 마지막 문장의 결론을 중심으로 장벽과 열정의 관계를 잡아야 합니다.","hl":"ty"},{"n":9,"text":"신호어를 보면 두 번째 문장의 If so는 앞 질문에 대한 답을 이어 주는 역할을 합니다. 네 번째 문장의 known as는 현상의 이름을 붙여 주고, 다섯 번째 문장의 like in the case of는 구체적인 예시를 끌어옵니다. 마지막 문장의 For this reason은 앞의 이유에서 결론으로 넘어가게 해 줍니다. 이런 신호어를 따라가면 글의 전개가 훨씬 선명해져요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>be in love with\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~와 사랑에 빠져 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>seem\u003c/b>\u003cem>동사\u003c/em>\u003cspan>~처럼 보이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>interested in\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 관심 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>if so\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>그렇다면\u003c/span>\u003c/div>\u003cdiv>\u003cb>consider\u003c/b>\u003cem>동사\u003c/em>\u003cspan>고려하다, 생각하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>precisely\u003c/b>\u003cem>부사\u003c/em>\u003cspan>바로, 정확히\u003c/span>\u003c/div>\u003cdiv>\u003cb>notice\u003c/b>\u003cem>동사\u003c/em>\u003cspan>주목하다, 알아차리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>often times\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>종종\u003c/span>\u003c/div>\u003cdiv>\u003cb>difficult\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>어려운\u003c/span>\u003c/div>\u003cdiv>\u003cb>get\u003c/b>\u003cem>동사\u003c/em>\u003cspan>얻다, 손에 넣다\u003c/span>\u003c/div>\u003cdiv>\u003cb>special\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>특별한\u003c/span>\u003c/div>\u003cdiv>\u003cb>phenomenon\u003c/b>\u003cem>명사\u003c/em>\u003cspan>현상\u003c/span>\u003c/div>\u003cdiv>\u003cb>be known as\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 알려져 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>barrier\u003c/b>\u003cem>명사\u003c/em>\u003cspan>장벽\u003c/span>\u003c/div>\u003cdiv>\u003cb>between\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~ 사이에\u003c/span>\u003c/div>\u003cdiv>\u003cb>in the case of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~의 경우에\u003c/span>\u003c/div>\u003cdiv>\u003cb>teen\u003c/b>\u003cem>명사\u003c/em>\u003cspan>십대\u003c/span>\u003c/div>\u003cdiv>\u003cb>family\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가족\u003c/span>\u003c/div>\u003cdiv>\u003cb>try to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~하려고 노력하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>keep apart\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>갈라놓다, 떼어놓다\u003c/span>\u003c/div>\u003cdiv>\u003cb>increase\u003c/b>\u003cem>동사\u003c/em>\u003cspan>증가시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>passion\u003c/b>\u003cem>명사\u003c/em>\u003cspan>열정\u003c/span>\u003c/div>\u003cdiv>\u003cb>for this reason\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>이런 이유로\u003c/span>\u003c/div>\u003cdiv>\u003cb>be attracted to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에게 끌리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>fall in love with\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~와 사랑에 빠지다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어도 꼭 챙겨 볼게요. be in love with는 사랑에 빠져 있다, be attracted to는 끌리다, keep apart는 갈라놓다라는 뜻이에요. 특히 barrier는 장벽, passion은 열정으로 기억해 두면 글의 주제가 바로 잡힙니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">interested in\u003c/b>\u003cspan class=\"m\">~에 관심 있는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">curious about\u003c/span>\u003cspan class=\"s\">concerned with\u003c/span>\u003cspan class=\"s\">attracted to\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">indifferent to\u003c/span>\u003cspan class=\"a\">uninterested in\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">consider\u003c/b>\u003cspan class=\"m\">고려하다, 생각하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">think about\u003c/span>\u003cspan class=\"s\">regard\u003c/span>\u003cspan class=\"s\">contemplate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003cspan class=\"a\">dismiss\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">precisely\u003c/b>\u003cspan class=\"m\">바로, 정확히\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">exactly\u003c/span>\u003cspan class=\"s\">just\u003c/span>\u003cspan class=\"s\">specifically\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">vaguely\u003c/span>\u003cspan class=\"a\">roughly\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">special\u003c/b>\u003cspan class=\"m\">특별한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">unique\u003c/span>\u003cspan class=\"s\">exceptional\u003c/span>\u003cspan class=\"s\">remarkable\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ordinary\u003c/span>\u003cspan class=\"a\">common\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">barrier\u003c/b>\u003cspan class=\"m\">장벽\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">obstacle\u003c/span>\u003cspan class=\"s\">hurdle\u003c/span>\u003cspan class=\"s\">block\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">opening\u003c/span>\u003cspan class=\"a\">passage\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">increase\u003c/b>\u003cspan class=\"m\">증가시키다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">raise\u003c/span>\u003cspan class=\"s\">boost\u003c/span>\u003cspan class=\"s\">grow\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">decrease\u003c/span>\u003cspan class=\"a\">reduce\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">passion\u003c/b>\u003cspan class=\"m\">열정\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">enthusiasm\u003c/span>\u003cspan class=\"s\">desire\u003c/span>\u003cspan class=\"s\">fervor\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">indifference\u003c/span>\u003cspan class=\"a\">apathy\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">attracted to\u003c/b>\u003cspan class=\"m\">~에게 끌리는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">drawn to\u003c/span>\u003cspan class=\"s\">interested in\u003c/span>\u003cspan class=\"s\">charmed by\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">repelled by\u003c/span>\u003cspan class=\"a\">indifferent to\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 함께 정리해 봅시다. interested in은 curious about이나 attracted to와 비슷하고, 반대로 indifferent to나 uninterested in이에요. barrier는 obstacle이나 hurdle로 바꿔 쓸 수 있고, 반대말은 opening이나 passage 정도가 됩니다. increase는 raise나 boost와 가깝고, 반대말은 decrease나 reduce예요. attracted to는 drawn to나 charmed by로 바꿀 수 있고, 반대는 repelled by나 indifferent to입니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 사랑에 빠져 본 적이 있는가 당신에게 관심이 없어 보이는 사람과?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Have \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">ever \u003c/span>\u003cspan class=\"tgt\">been\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">love\u003c/span> with someone/ \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">didn't \u003c/span>\u003cspan class=\"tgt\">seem \u003c/span>\u003cspan class=\"tgt\">interested \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">you\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">당신에게 관심이 없는 것처럼 보인 사람을 사랑해본 적이 있는가?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 상대에게 관심이 없는 것처럼 보이는 사람을 사랑해 본 경험을 떠올리게 하는 도입 질문입니다. 핵심 표현은 \u003cb class=\"key\">사랑에 \u003c/b>\u003cb class=\"key\">빠져 \u003c/b>\u003cb class=\"key\">있다\u003c/b>와 \u003cb class=\"key\">관심이 \u003c/b>\u003cb class=\"key\">없어 \u003c/b>\u003cb class=\"key\">보이다\u003c/b>이며, 뒤에서 설명할 ‘Romeo and Juliet’ effect의 출발점을 만들어 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재완료의 경험 용법\u003c/span> : have/has + p.p. : \"~해 본 적이 있는가\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be in love with 관용표현\u003c/span> : be in love with + 대상 : \"사랑에 빠진\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 who + seem + 형용사\u003c/span> : 선행사 + who + [seem + 형용사] : \"당신에게 관심이 없어 보이는\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Have you ever been in love, 당신은 사랑에 빠져 본 적이 있는가. with someone who didn't seem interested in you?, 당신에게 관심이 없어 보이는 사람과?. 이 문장 전체를 해석하면, 당신에게 관심이 없는 것처럼 보인 사람을 사랑해본 적이 있는가?","hl":"m"},{"n":13,"text":"이 문장은 상대가 관심이 없어 보여도 그런 사람을 사랑해 본 경험을 떠올리게 하는 도입 질문이에요. be in love with는 사랑에 빠져 있다로, seem interested는 관심이 없어 보이다로 기억하면 좋아요.","hl":"mn"},{"n":14,"text":"첫 번째로 Have you ever been은 현재완료의 경험을 묻는 형태예요. 두 번째로 in love with는 사랑에 빠져 있다라는 관용표현이고요. 세 번째로 who는 앞의 someone을 받는 주격 관계대명사이며, seem 뒤에는 형용사가 와서 관심이 없어 보이다라는 뜻을 만들어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그렇다면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">If \u003c/span>\u003cspan class=\"tgt\">so,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 생각해 본 적이 있는가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">did \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">ever \u003c/span>\u003cspan class=\"tgt\">consider\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어쩌면 당신이 그들을 좋아한 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">maybe \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">liked \u003c/span>\u003cspan class=\"tgt\">them\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바로 그들이 당신을 주목하지 않았기 때문이라고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">precisely \u003c/span>\u003cspan class=\"tgt\">because \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">didn't \u003c/span>\u003cspan class=\"tgt\">notice \u003c/span>\u003cspan class=\"tgt\">you\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그렇다면 어쩌면 그들이 당신한테 주목하지 않은 바로 그 이유 때문에 그들을 좋아한 거라고 생각해봤나?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞의 질문에 이어, 상대가 나를 \u003cb class=\"key\">주목하지 \u003c/b>\u003cb class=\"key\">않음\u003c/b>이 오히려 그 사람을 좋아하게 된 \u003cb class=\"key\">바로 \u003c/b>\u003cb class=\"key\">그 \u003c/b>\u003cb class=\"key\">이유\u003c/b>일 수 있는지 스스로 돌아보게 합니다. consider that은 ‘~라고 생각하다’로, precisely because는 ‘바로 ~ 때문에’로 이해하면 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">앞 내용을 받는 조건 표현\u003c/span> : If + so : \"그렇다면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거시제 의문문 + ever(경험)\u003c/span> : Did + 주어 + ever + 동사원형? : \"~해 본 적이 있는가\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">접속사 that의 명사절\u003c/span> : consider + that + 주어 + 동사 : \"어쩌면 ...라고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">이유를 나타내는 부사절 because\u003c/span> : because + 주어 + 동사 : \"바로 ... 때문에\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"If so, 그렇다면. did you ever consider, 당신은 생각해 본 적이 있는가. that maybe you liked them, 어쩌면 당신이 그들을 좋아한 것은. precisely because they didn't notice you?, 바로 그들이 당신을 주목하지 않았기 때문이라고. 이 문장 전체를 해석하면, 그렇다면 어쩌면 그들이 당신한테 주목하지 않은 바로 그 이유 때문에 그들을 좋아한 거라고 생각해봤나?","hl":"m"},{"n":16,"text":"이 문장은 상대가 나를 주목하지 않음이 오히려 그 사람을 좋아하게 된 바로 그 이유일 수 있는지 스스로 돌아보게 해요. consider that은 생각하다라는 흐름으로, precisely because는 바로 그 이유 때문에라는 흐름으로 이해하면 됩니다.","hl":"mn"},{"n":17,"text":"첫 번째로 If so는 앞 문장의 내용을 받아 그렇다면이라는 조건을 만들어요. 두 번째로 did you ever consider는 과거시제 의문문에 ever가 더해져 지금까지 생각해 본 적이 있는가라는 경험의 느낌을 줍니다. 세 번째로 that은 consider 뒤에서 명사절을 이끄는 접속사 that이고요. 네 번째로 because는 이유를 이끄는 접속사이며 precisely가 바로라는 강조를 더해 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">때로 “손에 넣기” 더 힘든 사람이 더 특별해 보인다.\u003c/span>\u003cspan class=\"en\">Often times, a person/ \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">difficult\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">&quot;get&quot;\u003c/span>/ \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">seems \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">special\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">때로 “손에 넣기” 더 힘든 사람이 더 특별해 보인다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사람은 \u003cb class=\"key\">손에 \u003c/b>\u003cb class=\"key\">넣기\u003c/b> 어려운 대상일수록 \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">특별해 \u003c/b>\u003cb class=\"key\">보인다\u003c/b>는 일반적 심리를 제시합니다. 이는 뒤에 나오는 ‘Romeo and Juliet’ effect, 즉 장애물이 오히려 열정을 키울 수 있다는 설명의 배경이 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 who + 비교급\u003c/span> : 선행사 + who + be동사 + 비교급 형용사 : \"더 힘든 사람\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">형용사 + to부정사\u003c/span> : be + difficult + to + 동사원형 : \"손에 넣기 힘든\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">seem + 형용사 보어\u003c/span> : seem + 형용사 : \"더 특별해 보인다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Often times, 때로. a person who is more difficult to \"get\", “손에 넣기” 더 힘든 사람이. seems more special, 더 특별해 보인다.. 이 문장 전체를 해석하면, 때로 “손에 넣기” 더 힘든 사람이 더 특별해 보인다.","hl":"m"},{"n":19,"text":"이 문장은 사람이 손에 넣기 어려운 대상일수록 더 특별해 보인다는 일반적 심리를 제시해요. 뒤에 나오는 Romeo and Juliet effect, 즉 장애물이 오히려 열정을 키울 수 있다는 설명의 배경이 됩니다.","hl":"mn"},{"n":20,"text":"첫 번째로 who는 앞의 a person을 받는 주격 관계대명사이고 more difficult는 비교급이에요. 두 번째로 difficult 뒤의 to get은 손에 넣다라는 동사구로 손에 넣기 힘들다는 의미를 구체화해요. 세 번째로 seem은 형용사 보어를 취해서 더 특별해 보인다라는 뜻을 만들어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 현상은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">This \u003c/span>\u003cspan class=\"tgt\">phenomenon \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">알려져 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">known\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘로미오와 줄리엣’ 효과로.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">&quot;Romeo \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">Juliet&quot; \u003c/span>\u003cspan class=\"tgt\">effect\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이런 현상은 ‘로미오와 줄리엣’ 효과로 알려져 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 말한 ‘어려운 상대일수록 더 특별해 보인다’는 현상에 \u003cb class=\"key\">로미오와 \u003c/b>\u003cb class=\"key\">줄리엣 \u003c/b>\u003cb class=\"key\">효과\u003c/b>라는 이름을 붙이는 문장이에요. 이 표현은 이후 문장에서 장벽이 열정을 키운다는 설명의 \u003cb class=\"key\">근거\u003c/b>가 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태(be동사 + 과거분사)\u003c/span> : [주어 This phenomenon] + [be동사 is] + [과거분사 known] : \"이 현상은 알려져 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 as의 의미(~로)\u003c/span> : be known + as + [명사] : \"‘로미오와 줄리엣’ 효과로\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"This phenomenon, 이 현상은. is known, 알려져 있다. as the \"Romeo and Juliet\" effect, ‘로미오와 줄리엣’ 효과로.. 이 문장 전체를 해석하면, 이런 현상은 ‘로미오와 줄리엣’ 효과로 알려져 있다.","hl":"m"},{"n":22,"text":"이 문장은 앞에서 말한 현상에 로미오와 줄리엣 효과라는 이름을 붙이는 역할을 해요. 어려운 상대일수록 더 특별하게 느껴진다는 내용이 이런 이름의 근거가 된다고 기억해 두세요.","hl":"mn"},{"n":23,"text":"첫 번째 어법 포인트는 수동태예요. This phenomenon is known은 이 현상은 알려져 있다는 뜻으로 be동사와 과거분사가 결합한 수동태죠. 두 번째는 as의 쓰임이에요. be known as는 로미오와 줄리엣 효과로 알려져 있다처럼 명칭을 나타내는 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 장벽이 있다면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">If \u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">barrier\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신과 누군가 사이에,\u003c/span>\u003cspan class=\"en\">between you and someone,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">십대들의 경우처럼\u003c/span>\u003cspan class=\"en\">like in the case of the teens/\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 가족이 그들을 갈라놓으려 했던\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">whose \u003c/span>\u003cspan class=\"tgt\">families \u003c/span>\u003cspan class=\"tgt\">tried \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">keep \u003c/span>\u003cspan class=\"tgt\">them \u003c/span>\u003cspan class=\"tgt\">apart\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">셰익스피어의 희곡에서,\u003c/span>\u003cspan class=\"en\">in Shakespeare's play,/\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 증가시킬 수 있다\u003c/span>\u003cspan class=\"en\">it \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">increase\u003c/span>(← decrease)\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신의 열정을.\u003c/span>\u003cspan class=\"en\">your passion.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">셰익스피어의 희곡에서 가족이 갈라놓으려 했던 십대들의 경우처럼 당신과 누군가와의 사이에 장벽이 있다면, 그것이 당신의 열정을 증가시킬 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 장벽이 있을 때 오히려 사랑의 \u003cb class=\"key\">열정\u003c/b>이 커질 수 있다는 뜻이에요. 셰익스피어의 『로미오와 줄리엣』처럼 가족이 둘을 갈라놓는 \u003cb class=\"key\">장벽\u003c/b>이 바로 그 예입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">if 조건절\u003c/span> : If + [주어 there] + [동사 is] + [보어 a barrier] : \"만약 장벽이 있다면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">소유격 관계대명사 whose\u003c/span> : [선행사 the teens] + whose + [명사 families] + [동사 tried] : \"그들의 가족이 그들을 갈라놓으려 했던\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">5형식 동사 keep + 목적어 + 형용사\u003c/span> : keep + [목적어 them] + [목적격 보어 apart] : \"그들을 떨어져 있게 하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">조동사 can + 동사원형\u003c/span> : can + [동사원형 increase] : \"증가시킬 수 있다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"If there is a barrier, 만약 장벽이 있다면. between you and someone, 당신과 누군가 사이에. like in the case of the teens/, 십대들의 경우처럼. whose families tried to keep them apart, 그들의 가족이 그들을 갈라놓으려 했던. in Shakespeare's play,/, 셰익스피어의 희곡에서. it can increase(← decrease), 그것은 증가시킬 수 있다. your passion, 당신의 열정을.. 이 문장 전체를 해석하면, 셰익스피어의 희곡에서 가족이 갈라놓으려 했던 십대들의 경우처럼 당신과 누군가와의 사이에 장벽이 있다면, 그것이 당신의 열정을 증가시킬 수 있다.","hl":"m"},{"n":25,"text":"장벽이 있을 때 오히려 사랑의 열정이 커질 수 있다는 뜻이에요. 셰익스피어의 로미오와 줄리엣처럼 가족이 둘을 갈라놓는 장벽이 바로 그 예라는 점을 기억하세요.","hl":"mn"},{"n":26,"text":"첫 번째 어법 포인트는 조건을 나타내는 if절이에요. If there is a barrier는 만약 장벽이 있다면이라는 조건을 제시하죠. 두 번째는 소유격 관계대명사 whose예요. the teens의 가족 관계를 이어 주면서 families를 수식해요. 세 번째는 목적어의 상태를 설명하는 구조예요. keep them apart는 목적어 them의 상태를 apart로 유지하게 하는 표현이고, apart가 목적격 보어예요. 네 번째는 조동사 can이에요. can 뒤에는 동사원형 increase가 와서 증가시킬 수 있다는 뜻을 만들어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이런 이유로,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">For \u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">reason\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 사람들이 끌린다\u003c/span>\u003cspan class=\"en\">many people \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">attracted \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">누군가에게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to\u003c/span> someone/\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 사랑에 빠져서는 안 되는.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">shouldn't \u003c/span>\u003cspan class=\"tgt\">fall \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">love \u003c/span>\u003cspan class=\"tgt\">with\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이런 이유로 많은 사람들이 사랑에 빠져서는 안 되는 사람에게 끌리는 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞의 ‘로미오와 줄리엣 효과’ 때문에 사람들이 \u003cb class=\"key\">금지된 \u003c/b>\u003cb class=\"key\">사랑\u003c/b>에 더 끌린다는 결론이에요. 사랑해서는 안 되는 상대라는 \u003cb class=\"key\">장벽\u003c/b>이 오히려 끌림을 강화한다는 흐름을 정리합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이유를 나타내는 전치사구\u003c/span> : For this reason, + [주절] : \"이런 이유로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태 be attracted to\u003c/span> : [주어 many people] + [be동사 are] + [과거분사 attracted] + to + [대상] : \"끌리다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 that\u003c/span> : [선행사 someone] + that + [주어 they] + [동사 shouldn't fall in love with] : \"그들이 사랑에 빠져서는 안 되는\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"For this reason, 이런 이유로. many people are attracted, 많은 사람들이 끌린다. to someone/, 누군가에게. that they shouldn't fall in love with, 그들이 사랑에 빠져서는 안 되는.. 이 문장 전체를 해석하면, 이런 이유로 많은 사람들이 사랑에 빠져서는 안 되는 사람에게 끌리는 것이다.","hl":"m"},{"n":28,"text":"앞의 로미오와 줄리엣 효과 때문에 사람들이 금지된 사랑에 더 끌린다는 결론이에요. 사랑해서는 안 되는 상대라는 장벽이 오히려 끌림을 강화한다는 흐름을 정리합니다.","hl":"mn"},{"n":29,"text":"첫 번째 어법 포인트는 이유를 나타내는 전치사구예요. For this reason은 앞 문장의 내용을 이유로 받아 뒤 문장을 연결하죠. 두 번째는 수동태예요. are attracted to는 끌리다는 뜻으로 be동사와 과거분사가 결합한 수동태예요. 세 번째는 목적격 관계대명사 that이에요. 선행사 someone을 수식하면서 전치사 with의 목적어 역할을 합니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>상대가 자신에게 \u003cb class=\"key\">관심 \u003c/b>\u003cb class=\"key\">없음\u003c/b>을 보이거나 ‘\u003cb class=\"key\">손에 \u003c/b>\u003cb class=\"key\">넣기\u003c/b>’ 어려울수록 더 매력적으로 느껴질 수 있다.\u003c/li>\u003cli>이런 현상은 \u003cb class=\"key\">로미오와 \u003c/b>\u003cb class=\"key\">줄리엣 \u003c/b>\u003cb class=\"key\">효과\u003c/b>로 불리며, 두 사람 사이의 \u003cb class=\"key\">장벽\u003c/b>이 오히려 \u003cb class=\"key\">열정\u003c/b>을 키운다.\u003c/li>\u003cli>셰익스피어의 희곡에서 가족이 십대들을 갈라놓으려 한 사례가 \u003cb class=\"key\">장벽\u003c/b>과 \u003cb class=\"key\">열정\u003c/b>의 관계를 보여 준다.\u003c/li>\u003cli>결국 많은 사람이 사랑해서는 안 되는 사람에게 \u003cb class=\"key\">끌림\u003c/b>을 느끼는 것은 \u003cb class=\"key\">금지된 \u003c/b>\u003cb class=\"key\">사랑\u003c/b>이 주는 긴장 때문이다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>People can be more attracted to someone who seems uninterested or difficult to get because barriers may increase passion, which is called the Romeo and Juliet effect.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">사람들은 자신에게 관심이 없어 보이거나 ‘손에 넣기’ 어려운 상대에게 더 끌릴 수 있으며, 이는 \u003cb class=\"key\">장벽\u003c/b>이 오히려 \u003cb class=\"key\">열정\u003c/b>을 키우는 \u003cb class=\"key\">로미오와 \u003c/b>\u003cb class=\"key\">줄리엣\u003c/b> 효과 때문이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":30,"text":"정리해 볼게요. 사람은 관심 없음이나 손에 넣기 어려움, 그리고 장벽 때문에 오히려 상대에게 더 끌릴 수 있습니다. 이런 현상을 로미오와 줄리엣 효과라고 하며, 금지된 사랑이 열정을 키우는 경우를 보여 주죠. 오늘 배운 장벽과 열정의 관계, 꼭 기억해 주세요. 다음 강의에서 또 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
