<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SO 레벨1 20강 적용독해01 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-chips .x{background:none;color:#999;padding:0}
.lp-sno{font-size:13px;color:#8493A1;font-weight:700;margin-bottom:8px}

.lp-chunk{display:flex;flex-direction:column}
.lp-chunk .ko{font-size:13px;color:var(--pk-t);font-weight:700;line-height:1.3;margin-bottom:2px}
.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}
.lp-top::before{height:5px;background:linear-gradient(90deg,var(--pk) 0,var(--pk) 80%,var(--am) 80%,var(--am) 100%)}
.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}
.lp-tag{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700;padding:2px 12px}
.lp-qn{flex:0 0 112px;height:112px;align-self:center;background:#fff;color:var(--pk);border:3px solid var(--pk);border-radius:50%;font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;font-size:26px}
.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}
.lp-qn .qt{display:block;white-space:nowrap;line-height:1.12;letter-spacing:-.02em}
.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}

.lp-st h4{color:var(--ink,#1B2733)}
.lp-st h4 i{border-radius:4px;width:auto;min-width:24px;padding:0 4px}
.lp-pill{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700}
.lp-chain span.c{background:#fff;border:1px solid #AEBBE6;border-radius:3px;font-weight:600}

.lp-vg em{background:#fff;border:1px solid var(--pk-b);border-radius:3px}
.lp-sa>div{border-radius:4px;border-color:var(--pk-b)}

.lp-chips .s{border:1px solid #AEBBE6;color:#3A4FA3}
.lp-chips .a{border:1px solid var(--am-b);color:var(--am-d);background:#FFFBF2}
.lp-sno .es{background:var(--am);border-radius:2px;font-weight:700}
.lp-chunk .en{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:600}
.lp-chunk+.lp-chunk{border-left:1px solid var(--pk-b)}
.lp .tgt{background:var(--am-l);border-bottom:2.5px dotted var(--am)}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"SO 레벨1 20강 적용독해01","audioDir":"20-01_audio","preview":false,"count":40,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">20강\u003cbr>적용독해01\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">SO 레벨1\u003c/div>\u003ch1>Cheap Tickets, the Biggest Mistake of My Life\u003c/h1>\u003ch2>값싼 항공권, 내 생애 최대의 실수\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>신혼여행을 위해 인터넷에서 프랑스행 \u003cb class=\"key\">저가 \u003c/b>\u003cb class=\"key\">항공권\u003c/b>을 구입한 화자는 항공권의 \u003cb class=\"key\">조건\u003c/b>을 확인하지 않아 홍콩과 두바이 등에서 오랜 대기와 지연을 겪었다. 그는 그 사실을 미리 알았더라면 표를 사지 않았을 것이라며, 조금만 더 \u003cb class=\"key\">조사\u003c/b>했더라면 좋았을 걸 그랬다고 후회한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Not checking the conditions of cheap tickets turned a honeymoon trip into the biggest mistake of his life.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 신혼여행을 준비하던 한 남자의 뼈아픈 경험담이에요. 그는 인터넷에서 프랑스행 저가 항공권을 샀다가 그것이 내 생애 최대의 실수였다고 말하죠. 글의 요지는 싼 가격만 보고 항공권을 고르면 조건 때문에 더 큰 대가를 치를 수 있다는 것이고, 결국 구입 전에 조건을 확인하고 조사를 해야 한다는 교훈을 담고 있어요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">인터넷에서 항공권을 살 때 가장 싼 표를 고르면 대개 경유가 많고 대기 시간이 길어요. 항공권에는 가격뿐 아니라 출발·도착 시간, 환승 횟수, 대기 시간 같은 \u003cb class=\"key\">조건\u003c/b>(conditions)이 함께 붙어 있는데, 저가 항공권(low-cost ticket)은 이런 조건이 불리한 경우가 많죠. 환승을 위해 공항에서 기다리는 시간을 \u003cb class=\"key\">경유 \u003c/b>\u003cb class=\"key\">대기\u003c/b>(layover)라고 하고, 연결 항공편(connecting flight)을 놓치면 일정 전체가 무너질 수 있어요. 이건 마치 지도 앱에서 '최소 비용' 경로를 골랐더니 환승이 다섯 번이라 하루 종일 버스만 타게 되는 것과 비슷해요. 그리고 이 글에는 \u003cb class=\"key\">가정법 \u003c/b>\u003cb class=\"key\">과거완료\u003c/b>(If I had p.p., I would have p.p. / I wish I had p.p.)가 쓰여서 과거에 하지 않은 일에 대한 후회를 표현하고 있답니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식부터 짚어 볼게요. 인터넷에서 항공권을 살 때 가장 싼 표를 고르면 대개 경유가 많고 대기 시간이 길어요. 항공권에는 가격뿐 아니라 출발과 도착 시간, 환승 횟수, 대기 시간 같은 조건이 함께 붙어 있는데, 저가 항공권은 이런 조건이 불리한 경우가 많죠. 공항에서 환승을 위해 기다리는 시간을 경유 대기라고 부르고, 연결 항공편을 놓치면 일정 전체가 무너질 수 있어요. 이건 마치 지도 앱에서 최소 비용 경로를 골랐더니 환승이 다섯 번이라 하루 종일 버스만 타게 되는 것과 비슷해요. 그리고 이 글에는 가정법 과거완료가 쓰여서 과거에 하지 않은 일에 대한 후회를 표현하고 있답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>저가 항공권 구입\u003csmall>도입·주장 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>화자는 신혼여행을 가기 위해 인터넷에서 프랑스행 \u003cb class=\"key\">저가 \u003c/b>\u003cb class=\"key\">항공권\u003c/b>을 구입했어요. 그런데 곧바로 그것이 \u003cb class=\"key\">내 \u003c/b>\u003cb class=\"key\">생애 \u003c/b>\u003cb class=\"key\">최대의 \u003c/b>\u003cb class=\"key\">실수\u003c/b>였다고 고백하죠. 싼 가격에 끌린 선택이 왜 실수가 되었는지 독자를 궁금하게 만드는 도입이에요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>조건 미확인\u003csmall>원인·근거 · 문장 3\u003c/small>\u003c/h4>\u003cp>그 이유는 간단해요. 그는 항공권의 \u003cb class=\"key\">조건\u003c/b>을 보지 않았어요. 조건을 봤더라면 절대 사지 않았을 것이라고 \u003cb class=\"key\">가정법 \u003c/b>\u003cb class=\"key\">과거완료\u003c/b>로 말하고 있죠. 즉 실수의 원인은 가격만 보고 조건 확인을 건너뛴 것이에요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>환승과 지연\u003csmall>예시·근거 · 문장 4–7\u003c/small>\u003c/h4>\u003cp>이어서 실제 여정이 구체적으로 나열돼요. 홍콩에서는 \u003cb class=\"key\">환승 \u003c/b>\u003cb class=\"key\">비행기\u003c/b>를 여덟 시간 동안 기다려야 했고 두바이에서는 여섯 시간이 또 \u003cb class=\"key\">지연\u003c/b>되었어요. 마드리드와 취리히, 프랑크푸르트까지 \u003cb class=\"key\">경유\u003c/b>한 끝에야 프랑스로 날아갈 수 있었죠.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>알았더라면\u003csmall>반례·가정 · 문장 8\u003c/small>\u003c/h4>\u003cp>여기서 \u003cb class=\"key\">가정법 \u003c/b>\u003cb class=\"key\">과거완료\u003c/b>가 한 번 더 나와요. 이틀이 걸릴 줄 알았다면 절대 그 표를 사지 않았을 것이라는 문장이죠. 정보가 있었다면 선택이 달라졌을 것이라는 \u003cb class=\"key\">반사실적 \u003c/b>\u003cb class=\"key\">가정\u003c/b>이고, 결국 문제는 정보 부족이었다는 인정이기도 해요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>더 알아볼 걸\u003csmall>결론·후회 · 문장 9\u003c/small>\u003c/h4>\u003cp>마지막으로 그는 조사를 조금만 더 했더라면 좋았을 걸 그랬다고 \u003cb class=\"key\">후회\u003c/b>해요. I wish I had done a little more research는 과거의 \u003cb class=\"key\">아쉬움\u003c/b>을 담은 대표적인 가정법 표현이에요. 사소해 보이는 확인 하나가 여행 전체를 바꾼다는 교훈으로 글을 맺습니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 글의 흐름을 다섯 단계로 나눠서 따라가 볼게요.","hl":null},{"n":4,"text":"첫 단계는 도입이에요. 화자는 신혼여행을 가기 위해 인터넷에서 프랑스행 저가 항공권을 구입했어요. 그런데 바로 다음 문장에서 그것이 내 생애 최대의 실수였다고 고백하죠. 싼 가격에 끌린 선택이 왜 실수가 되었는지 궁금하게 만드는 부분이에요.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 그 이유가 나와요. 그는 항공권의 조건을 보지 않았어요. 조건을 봤더라면 절대 사지 않았을 것이라고 가정법 과거완료로 말하고 있죠. 결국 실수의 원인은 가격만 보고 조건 확인을 건너뛴 것이에요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 실제 여정을 보여 줘요. 아내와 함께 홍콩으로 가서 환승 비행기를 여덟 시간 동안 기다려야 했고, 두바이에서는 여섯 시간이 또 지연되었어요. 마드리드와 취리히, 프랑크푸르트까지 경유한 끝에야 프랑스에 도착했죠.","hl":"f2"},{"n":7,"text":"네 번째 단계에서는 가정이 한 번 더 나와요. 이틀이 걸릴 줄 알았다면 절대 그 표를 사지 않았을 것이라는 문장이에요. 정보가 있었다면 선택이 달라졌을 것이라는 반사실적 가정이죠. 결국 문제는 정보 부족이었다는 점을 스스로 인정하는 셈이에요.","hl":"f3"},{"n":8,"text":"다섯 번째 단계는 후회로 끝나요. 조사를 조금만 더 했더라면 좋았을 걸 그랬다고 말하죠. I wish I had done a little more research라는 표현은 과거의 아쉬움을 담은 대표적인 가정법이에요. 사소해 보이는 확인 하나가 여행 전체를 바꾼다는 교훈으로 글을 맺고 있어요.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거(시간순 나열)\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 2번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">두 번째 문장에서 \u003cb class=\"key\">내 \u003c/b>\u003cb class=\"key\">생애 \u003c/b>\u003cb class=\"key\">최대의 \u003c/b>\u003cb class=\"key\">실수\u003c/b>라는 주장이 먼저 제시되고, 이후 문장들이 그 이유를 차례로 뒷받침해요. 원인은 \u003cb class=\"key\">조건 \u003c/b>\u003cb class=\"key\">미확인\u003c/b>으로 밝혀지고, 홍콩과 두바이, 마드리드로 이어지는 실제 여정이 구체적인 근거로 제시되죠. 마지막에는 가정법 표현을 반복하며 후회로 마무리하기 때문에 주장이 앞에 놓이는 \u003cb class=\"key\">두괄식\u003c/b> 구조로 판단할 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>otherwise (3)\u003c/b>\u003cspan>가정적 대조 제시\u003c/span>\u003cb>First (4)\u003c/b>\u003cspan>나열의 시작\u003c/span>\u003cb>There (5)\u003c/b>\u003cspan>장소 연결\u003c/span>\u003cb>where (6)\u003c/b>\u003cspan>장소 부연\u003c/span>\u003cb>Finally (7)\u003c/b>\u003cspan>나열의 마무리\u003c/span>\u003cb>If I had known (8)\u003c/b>\u003cspan>가정 조건 제시\u003c/span>\u003cb>I wish (9)\u003c/b>\u003cspan>후회·결론\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">the biggest mistake of my life\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">would never have bought them\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">would never have bought the tickets\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">I wish I had done a little more research\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"이 글의 전개방식은 주장과 근거예요. 두 번째 문장에서 내 생애 최대의 실수라는 주장이 먼저 나오고, 그 뒤에 조건을 확인하지 않은 일과 홍콩, 두바이, 마드리드를 거친 실제 여정이 근거로 이어지죠. 그래서 주제문이 글 앞부분에 놓이는 두괄식 구조예요. 뒤로 갈수록 가정법 표현이 반복되면서 처음의 주장을 더 강하게 뒷받침합니다.","hl":"ty"},{"n":10,"text":"신호어를 눈여겨보면 흐름이 훨씬 잘 보여요. 세 번째 문장의 otherwise는 그렇지 않았으면이라는 뜻으로 가정적 대조를 만들어 주고, 네 번째 문장의 First는 나열의 시작을 알리죠. 마지막 문장의 I wish는 후회를 담은 결론 신호이고요. 그리고 would never have bought라는 표현이 두 번 반복되면서 실수라는 개념이 계속 재진술되고 있어요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>honeymoon\u003c/b>\u003cem>명사\u003c/em>\u003cspan>신혼여행\u003c/span>\u003c/div>\u003cdiv>\u003cb>cheap\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>값싼, 저가의\u003c/span>\u003c/div>\u003cdiv>\u003cb>on the Internet\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>인터넷에서\u003c/span>\u003c/div>\u003cdiv>\u003cb>mistake\u003c/b>\u003cem>명사\u003c/em>\u003cspan>실수\u003c/span>\u003c/div>\u003cdiv>\u003cb>look at\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 보다, 살펴보다\u003c/span>\u003c/div>\u003cdiv>\u003cb>condition\u003c/b>\u003cem>명사\u003c/em>\u003cspan>조건\u003c/span>\u003c/div>\u003cdiv>\u003cb>otherwise\u003c/b>\u003cem>부사\u003c/em>\u003cspan>그렇지 않으면\u003c/span>\u003c/div>\u003cdiv>\u003cb>would never have bought\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>결코 사지 않았을 것이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>first\u003c/b>\u003cem>부사\u003c/em>\u003cspan>먼저\u003c/span>\u003c/div>\u003cdiv>\u003cb>have to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~해야 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>fly\u003c/b>\u003cem>동사\u003c/em>\u003cspan>날아가다, 비행하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>there\u003c/b>\u003cem>부사\u003c/em>\u003cspan>거기서\u003c/span>\u003c/div>\u003cdiv>\u003cb>wait for\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 기다리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>connecting flight\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>환승 비행기, 연결 항공편\u003c/span>\u003c/div>\u003cdiv>\u003cb>from there\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>그곳에서\u003c/span>\u003c/div>\u003cdiv>\u003cb>delay\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지연\u003c/span>\u003c/div>\u003cdiv>\u003cb>another\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>또 다른, 한 번 더의\u003c/span>\u003c/div>\u003cdiv>\u003cb>finally\u003c/b>\u003cem>부사\u003c/em>\u003cspan>마지막으로, 결국\u003c/span>\u003c/div>\u003cdiv>\u003cb>stop\u003c/b>\u003cem>명사\u003c/em>\u003cspan>경유(지), 정류장\u003c/span>\u003c/div>\u003cdiv>\u003cb>take\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(시간이) 걸리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>get to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 도착하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>know\u003c/b>\u003cem>동사\u003c/em>\u003cspan>알다\u003c/span>\u003c/div>\u003cdiv>\u003cb>research\u003c/b>\u003cem>명사\u003c/em>\u003cspan>조사, 알아보기\u003c/span>\u003c/div>\u003cdiv>\u003cb>wish\u003c/b>\u003cem>동사\u003c/em>\u003cspan>바라다, 소망하다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"핵심 단어 몇 개만 짚어 볼게요. honeymoon은 신혼여행, condition은 조건이라는 뜻이고, otherwise는 그렇지 않으면이라는 연결어예요. connecting flight는 환승 비행기, delay는 지연, research는 조사라는 뜻으로 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">mistake\u003c/b>\u003cspan class=\"m\">실수\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">error\u003c/span>\u003cspan class=\"s\">blunder\u003c/span>\u003cspan class=\"s\">fault\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">accuracy\u003c/span>\u003cspan class=\"a\">correctness\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">cheap\u003c/b>\u003cspan class=\"m\">값싼\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">inexpensive\u003c/span>\u003cspan class=\"s\">affordable\u003c/span>\u003cspan class=\"s\">low-cost\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">expensive\u003c/span>\u003cspan class=\"a\">costly\u003c/span>\u003cspan class=\"a\">pricey\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">condition\u003c/b>\u003cspan class=\"m\">조건\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">term\u003c/span>\u003cspan class=\"s\">requirement\u003c/span>\u003cspan class=\"s\">provision\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">delay\u003c/b>\u003cspan class=\"m\">지연\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">holdup\u003c/span>\u003cspan class=\"s\">postponement\u003c/span>\u003cspan class=\"s\">lag\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">finally\u003c/b>\u003cspan class=\"m\">마지막으로\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">eventually\u003c/span>\u003cspan class=\"s\">ultimately\u003c/span>\u003cspan class=\"s\">at last\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">initially\u003c/span>\u003cspan class=\"a\">first\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">research\u003c/b>\u003cspan class=\"m\">조사\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">investigation\u003c/span>\u003cspan class=\"s\">study\u003c/span>\u003cspan class=\"s\">inquiry\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">know\u003c/b>\u003cspan class=\"m\">알다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">be aware of\u003c/span>\u003cspan class=\"s\">realize\u003c/span>\u003cspan class=\"s\">understand\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어도 정리해 볼게요. mistake는 error나 blunder로 바꿔 쓸 수 있고 반대쪽에는 accuracy가 있어요. cheap은 inexpensive, affordable과 가깝고 expensive와는 반대죠. delay는 holdup이나 postponement로 표현할 수 있어요. finally는 eventually, ultimately로 바꿀 수 있고 처음이라는 의미의 initially와 반대된답니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">신혼여행을 가기 위해,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">For \u003c/span>\u003cspan class=\"tgt\">my \u003c/span>\u003cspan class=\"tgt\">honeymoon\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 저가 항공권을 구입했다\u003c/span>\u003cspan class=\"en\">I bought cheap \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">tickets \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">프랑스행\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">France\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인터넷에서.\u003c/span>\u003cspan class=\"en\">on the Internet.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">신혼여행을 가기 위해, 나는 인터넷에서 프랑스행 저가 항공권을 구입했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 신혼여행을 위해 인터넷에서 프랑스행 \u003cb class=\"key\">저가 \u003c/b>\u003cb class=\"key\">항공권\u003c/b>을 샀다는 내용이에요. 값이 싼 티켓을 골랐다는 이 정보가 뒤에 이어질 \u003cb class=\"key\">후회\u003c/b>의 출발점이 되는 문장이죠. 글 전체가 '싼 표 때문에 생긴 고생담'으로 흘러가기 때문에 \u003cb class=\"key\">원인\u003c/b>을 깔아 주는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 for의 부사적 용법(목적)\u003c/span> : [For + 명사(구)] + [주어 + 동사] : \"신혼여행을 가기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 to(목적지·방향)\u003c/span> : [명사 + to + 장소명사] : \"프랑스행 항공권\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"For my honeymoon, 신혼여행을 가기 위해. I bought cheap tickets, 나는 저가 항공권을 구입했다. to France, 프랑스행. on the Internet, 인터넷에서.. 이 문장 전체를 해석하면, 신혼여행을 가기 위해, 나는 인터넷에서 프랑스행 저가 항공권을 구입했다.","hl":"m"},{"n":14,"text":"이 문장은 신혼여행을 가려고 인터넷에서 프랑스행 저가 항공권을 샀다고 말하고 있어요. 여기서 저가 항공권이라는 정보가 뒤에 벌어질 고생의 원인이 되죠. 그러니까 이 문장은 뒤 내용의 원인을 깔아 주는 역할이라고 기억해 두세요.","hl":"mn"},{"n":15,"text":"먼저 For my honeymoon은 목적을 나타내는 전치사구예요. for가 목적의 의미로 쓰여서 '신혼여행을 가기 위해'가 되는 거죠. 그리고 tickets to France에서 to는 전치사예요. to부정사가 아니라 뒤에 명사 France가 왔으니까 목적지를 나타내는 전치사로 봐야 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 ~였다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It \u003c/span>\u003cspan class=\"tgt\">was\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">최대의 실수\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">biggest \u003c/span>\u003cspan class=\"tgt\">mistake\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내 생애의!\u003c/span>\u003cspan class=\"en\">of my life!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 내 생애 최대의 실수였다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 인터넷에서 티켓을 산 그 행동이 \u003cb class=\"key\">최대의 \u003c/b>\u003cb class=\"key\">실수\u003c/b>였다고 강하게 선언하는 문장이에요. It은 앞 문장의 내용을 통째로 받는 \u003cb class=\"key\">지시대명사\u003c/b>이고, 감탄부호로 후회의 감정을 드러냅니다. 독자의 관심을 끌어 뒤의 구체적인 이유 설명으로 넘어가게 하는 \u003cb class=\"key\">도입\u003c/b> 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">앞 문장을 받는 지시대명사 It\u003c/span> : [It(앞 내용 지칭) + be동사 + 명사] : \"그것은 ~였다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">최상급 형용사\u003c/span> : [the + 최상급 + 명사] : \"최대의 실수\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"It was, 그것은 ~였다. the biggest mistake, 최대의 실수. of my life!, 내 생애의!. 이 문장 전체를 해석하면, 그것은 내 생애 최대의 실수였다!","hl":"m"},{"n":17,"text":"이 문장은 인터넷에서 티켓을 산 그 행동이 내 생애 최대의 실수였다고 강하게 말하고 있어요. 감탄부호가 붙어서 후회의 감정이 확 드러나죠. 그래서 독자는 왜 그게 실수였는지 궁금해지고, 뒤의 설명으로 자연스럽게 넘어가게 됩니다.","hl":"mn"},{"n":18,"text":"첫째, It은 앞 문장 전체를 받는 지시대명사예요. 그래서 '그것은'으로 해석하는 겁니다. 둘째, the biggest는 최상급이라 the를 꼭 붙여야 해요. 최상급 앞에 the가 빠지면 어법 문제로 바로 나옵니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 보지 않았다\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">never \u003c/span>\u003cspan class=\"tgt\">looked \u003c/span>\u003cspan class=\"tgt\">at\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">항공권의 (구입) 조건들을\u003c/span>\u003cspan class=\"en\">the conditions of the tickets;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그렇지 않았으면,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">otherwise, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 절대 그걸 사지 않았을 것이다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">never \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">bought \u003c/span>\u003cspan class=\"tgt\">them\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 항공권의 (구입) 조건들을 보지 않았다. 그렇지 않았으면 절대 그걸 사지 않았을 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 티켓의 세부 \u003cb class=\"key\">조건\u003c/b>을 확인하지 않은 것을 후회하는 문장이에요. semicolon 뒤의 otherwise가 '만약 조건을 봤더라면'이라는 \u003cb class=\"key\">가정법\u003c/b> 조건절을 대신하고 있어서, 실제로는 보지 않았고 그래서 샀다는 현실이 드러나죠. 앞에서 말한 실수의 \u003cb class=\"key\">이유\u003c/b>를 처음으로 구체적으로 밝히는 부분입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">빈도 부정어 never + 일반동사\u003c/span> : [주어 + never + 일반동사(과거) + 목적어] : \"결코 ~을 보지 않았다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">otherwise + 가정법 과거완료\u003c/span> : [otherwise] + [주어 + would have + p.p.] : \"그렇지 않았으면 절대 그걸 사지 않았을 것이다\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"I never looked at, 나는 보지 않았다. the conditions of the tickets, 항공권의 (구입) 조건들을. otherwise, 그렇지 않았으면. I would never have bought them, 나는 절대 그걸 사지 않았을 것이다.. 이 문장 전체를 해석하면, 나는 항공권의 (구입) 조건들을 보지 않았다. 그렇지 않았으면 절대 그걸 사지 않았을 것이다.","hl":"m"},{"n":20,"text":"이 문장은 항공권의 세부 조건을 확인하지 않은 걸 후회하고 있어요. otherwise가 '만약 조건을 봤더라면'이라는 가정을 대신하면서, 실제로는 안 봤고 그래서 샀다는 현실을 보여 줍니다. 앞에서 말한 실수가 왜 실수였는지 이유를 처음으로 밝히는 대목이죠.","hl":"mn"},{"n":21,"text":"첫째, never는 빈도를 나타내는 부정어라서 일반동사 looked 앞에 와요. 그래서 '결코 보지 않았다'라는 강한 부정이 됩니다. 둘째, otherwise는 조건절을 대신하는 표현이라서 뒤에 가정법 과거완료가 와요. 그래서 would have bought, 즉 would have p.p. 형태가 나오는 겁니다. 셋째, the conditions of the tickets에서 of는 '~의'로 앞 명사를 뒤에서 꾸며 주는 전치사로 익혀 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">먼저,\u003c/span>\u003cspan class=\"en\">First,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아내와 나는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">my \u003c/span>\u003cspan class=\"tgt\">wife \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">I\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">날아가야 했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">fly\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">홍콩으로\u003c/span>\u003cspan class=\"en\">to Hong Kong.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">먼저, 아내와 나는 홍콩으로 가야 했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 신혼여행 첫 구간부터 바로 프랑스로 가지 못하고 홍콩을 거쳐야 했음을 말합니다. \u003cb class=\"key\">경유\u003c/b>의 시작을 알리는 대목으로, 3번 문장에서 말한 '조건을 안 본 대가'가 구체적으로 드러나기 시작하는 지점입니다. First는 나열의 출발을 알리는 \u003cb class=\"key\">전환어\u003c/b>입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">인칭대명사 주격과 and 병렬\u003c/span> : [my wife] + and + [I (주격)] : \"아내와 나는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 had to (과거의 의무)\u003c/span> : [주어] + had to + [동사원형] : \"~해야 했다\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"First, 먼저. my wife and I, 아내와 나는. had to fly, 날아가야 했다. to Hong Kong, 홍콩으로. 이 문장 전체를 해석하면, 먼저, 아내와 나는 홍콩으로 가야 했다.","hl":"m"},{"n":23,"text":"드디어 첫 번째 문제가 나오죠. 신혼여행인데 프랑스로 바로 못 가고 홍콩을 먼저 들른다는 거예요. 앞에서 항공권 조건을 안 본 게 여기서부터 하나씩 드러나는 겁니다.","hl":"mn"},{"n":24,"text":"첫 번째 포인트, my wife and I에서 왜 I를 쓸까요. 주어 자리니까 주격을 쓴 거예요. 두 번째 포인트, had to fly는 과거에 꼭 해야 했던 의무를 말하는 표현이고, 조동사 뒤에는 동사원형이 와서 fly가 그대로 온 겁니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거기서\u003c/span>\u003cspan class=\"en\">There,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 기다려야 했다\u003c/span>\u003cspan class=\"en\">we \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">wait\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">8시간 동안\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">eight \u003c/span>\u003cspan class=\"tgt\">hours\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 환승 비행기를\u003c/span>\u003cspan class=\"en\">for our \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">connecting\u003c/span> flight.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">거기서 환승 비행기를 8 시간 동안 기다려야 했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 홍콩에 내린 뒤 환승 비행기를 기다리는 데만 여덟 시간이 걸렸다는 뜻입니다. 앞 문장에 이어 \u003cb class=\"key\">지연\u003c/b>이 얼마나 긴 시간이었는지 구체적인 숫자로 보여 주며, 독자에게 '저가 항공권의 대가'를 실감하게 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 had to + 동사원형\u003c/span> : [주어] + had to + [동사원형 wait] : \"기다려야 했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">시간의 목적어 (기간 표현)\u003c/span> : [wait] + [eight hours (기간)] : \"8시간 동안\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">현재분사 형용사적 용법\u003c/span> : [connecting (현재분사)] + [flight (명사)] : \"환승하는 (연결되는)\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"There, 거기서. we had to wait, 우리는 기다려야 했다. eight hours, 8시간 동안. for our connecting flight, 우리 환승 비행기를. 이 문장 전체를 해석하면, 거기서 환승 비행기를 8 시간 동안 기다려야 했다.","hl":"m"},{"n":26,"text":"홍콩에 도착해서 환승편을 기다리는데만 여덟 시간이 걸렸다는 거예요. 숫자가 딱 나오니까 지연이 얼마나 심했는지 바로 와닿죠. 저가 항공권의 대가가 이렇게 현실로 다가옵니다.","hl":"mn"},{"n":27,"text":"첫 번째 포인트, had to wait는 과거의 의무를 말하는 표현이고 조동사 뒤라서 wait이 동사원형으로 왔어요. 두 번째 포인트, wait 뒤에 eight hours를 붙여서 기간의 의미를 만들었습니다. 세 번째 포인트, connecting은 동사에 ing를 붙여서 flight를 꾸미는 현재분사예요. 그래서 환승하는 비행기, 즉 환승편이라는 뜻이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그곳에서\u003c/span>\u003cspan class=\"en\">From there\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 두바이까지 가야 했고,\u003c/span>\u003cspan class=\"en\">we \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">fly\u003c/span> to Dubai,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거기서 우리는 6시간의 지연을 또 겪었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">where \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">another \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">six-hour \u003c/span>\u003cspan class=\"tgt\">delay\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그곳에서 우리는 두바이까지 가서, 거기서 6 시간이 또 지연되었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 홍콩 다음 경유지인 두바이에서도 여섯 시간 지연이 또 발생했다는 내용입니다. 앞의 'eight hours'에 이어 여기서는 'another'로 \u003cb class=\"key\">반복\u003c/b>을 강조해, 문제가 한 번으로 끝나지 않는다는 점을 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 had to + 동사원형\u003c/span> : [주어] + had to + [동사원형 fly] : \"가야 했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관계부사 where의 계속적 용법\u003c/span> : , where + [완전한 문장] : \"그곳에서 우리는 또 6시간의 지연을 겪었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">복합형용사 (하이픈 연결)\u003c/span> : [숫자] + [단수 명사] + [명사] : \"6시간짜리\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"From there, 그곳에서. we had to fly to Dubai, 우리는 두바이까지 가야 했고. where we had another six-hour delay, 거기서 우리는 6시간의 지연을 또 겪었다. 이 문장 전체를 해석하면, 그곳에서 우리는 두바이까지 가서, 거기서 6 시간이 또 지연되었다.","hl":"m"},{"n":29,"text":"홍콩에 이어 이번엔 두바이에서 또 지연이 생겼다는 거예요. another라는 단어가 '또 한 번'이라는 반복을 콕 짚어 주죠. 그래서 이 항공권이 얼마나 힘든 여정이었는지 점점 쌓여 갑니다.","hl":"mn"},{"n":30,"text":"첫 번째 포인트, had to fly는 앞 문장과 똑같이 과거의 의무를 나타내고 조동사 뒤라서 fly가 동사원형입니다. 두 번째 포인트, where는 앞의 장소 Dubai를 받아 '그리고 거기서'로 이어 주는 계속적 용법의 관계부사예요. 뒤에 주어와 목적어가 다 있는 완전한 절이 온다는 점을 꼭 기억하세요. 세 번째 포인트, six-hour는 숫자와 명사를 하이픈으로 묶은 복합형용사라서 hour에 s를 붙이지 않습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마지막으로,\u003c/span>\u003cspan class=\"en\">Finally,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 프랑스로 날아갔다\u003c/span>\u003cspan class=\"en\">we flew into France\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마드리드와 취리히, 프랑크푸르트를 경유한 후에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">after \u003c/span>\u003cspan class=\"tgt\">stops\u003c/span> in \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">Madrid, \u003c/span>\u003cspan class=\"tgt\">Zurich, \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">Frankfurt\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">마지막으로, 우리는 마드리드와 취리히, 프랑크푸르트를 경유하여 프랑스로 날아갔다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 여러 번의 \u003cb class=\"key\">지연\u003c/b>과 환승 끝에 마침내 프랑스에 도착했다는 뜻이에요. 중간에 여러 도시에 들러 멈춘 것을 \u003cb class=\"key\">경유\u003c/b>라고 하며, 저가 항공권의 이동 경로가 얼마나 번거로웠는지 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 after + 명사\u003c/span> : after + [명사(구)] : \"경유한 후에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명사 병렬 구조\u003c/span> : [A], [B], and [C] : \"마드리드와 취리히, 프랑크푸르트\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"Finally, 마지막으로. we flew into France, 우리는 프랑스로 날아갔다. after stops in Madrid, Zurich, and Frankfurt!, 마드리드와 취리히, 프랑크푸르트를 경유한 후에. 이 문장 전체를 해석하면, 마지막으로, 우리는 마드리드와 취리히, 프랑크푸르트를 경유하여 프랑스로 날아갔다!","hl":"m"},{"n":32,"text":"이 문장은 여러 번의 지연과 환승 끝에 마침내 프랑스에 도착했다는 뜻이에요. 중간에 도시에 들러 멈춘 것을 경유라고 하죠. 앞에서 겪은 고생을 다시 정리하며 저가 항공권의 이동 경로가 얼마나 번거로웠는지 보여 줍니다.","hl":"mn"},{"n":33,"text":"첫 번째로, after는 전치사로 뒤에 명사 stops를 받아 시간 관계를 나타내요. 두 번째로, Madrid, Zurich, and Frankfurt는 and로 연결한 병렬 구조예요. 세 도시를 같은 자격으로 나열한 표현이죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 내가 알았더라면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">If \u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">known\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">파리에 가는 데 이틀이 걸릴 것이라는 것을\u003c/span>\u003cspan class=\"en\">it would take two days to get to Paris,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 절대 사지 않았을 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">never \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">bought\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 표를\u003c/span>\u003cspan class=\"en\">the tickets.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">파리까지 가는 데 이틀이 걸릴 줄 알았다면, 나는 절대 그 표를 사지 않았을 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 파리에 도착하는 데 이틀이나 걸린다는 사실을 미리 알았더라면 표를 사지 않았을 것이라는 \u003cb class=\"key\">후회\u003c/b>를 담고 있어요. 실제로는 알지 못했기 때문에 표를 샀고, 그 결과가 큰 실수였다는 앞 문장의 흐름을 이어 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가정법 과거완료의 if절\u003c/span> : If + [주어] + had + [과거분사], [주어] + would have + [과거분사] : \"만약 내가 알았더라면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">가정법 과거완료의 주절\u003c/span> : [주어] + would never have + [과거분사] : \"나는 절대 사지 않았을 것이다\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"If I had known, 만약 내가 알았더라면. it would take two days to get to Paris, 파리에 가는 데 이틀이 걸릴 것이라는 것을. I would never have bought, 나는 절대 사지 않았을 것이다. the tickets, 그 표를. 이 문장 전체를 해석하면, 파리까지 가는 데 이틀이 걸릴 줄 알았다면, 나는 절대 그 표를 사지 않았을 것이다.","hl":"m"},{"n":35,"text":"이 문장은 파리에 가는 데 이틀이나 걸린다는 사실을 미리 알았더라면 표를 사지 않았을 거라는 후회를 담고 있어요. 실제로는 알지 못해서 표를 샀고, 그 선택이 큰 실수였다는 흐름을 이어 줍니다.","hl":"mn"},{"n":36,"text":"첫 번째로, If I had known은 과거 사실의 반대를 가정하는 if절이라서 had known을 써요. 두 번째로, I would never have bought는 그 가정의 결과를 나타내는 주절이에요. if절에 had p.p.를 쓰고 주절에 would have p.p.를 쓰는 이것이 가정법 과거완료예요. never가 부정의 뜻을 강하게 더해 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내가 했더라면 좋았을 텐데\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">wish \u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">done\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">조금 더 많은 연구를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">little \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">research\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">좀 더 알아봤더라면 좋았을 걸 그랬다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이미 일이 끝난 뒤에 더 알아보지 않은 자신의 선택을 \u003cb class=\"key\">후회\u003c/b>하는 문장이에요. I wish 뒤에 had done이 와서 과거에 하지 못한 일을 아쉬워하며, 저가 항공권을 고르기 전에 조사를 더 했어야 했다는 \u003cb class=\"key\">교훈\u003c/b>을 남깁니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">I wish + 가정법 과거완료\u003c/span> : I wish + [주어] + had + [과거분사] : \"내가 했더라면 좋았을 텐데\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">비교급 more + 명사\u003c/span> : a little + [more] + [불가산명사] : \"조금 더 많은 연구\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"I wish I had done, 내가 했더라면 좋았을 텐데. a little more research, 조금 더 많은 연구를. 이 문장 전체를 해석하면, 좀 더 알아봤더라면 좋았을 걸 그랬다.","hl":"m"},{"n":38,"text":"이 문장은 이미 일이 끝난 뒤에 더 알아보지 않은 자신의 선택을 후회하는 말이에요. 저가 항공권을 고르기 전에 조사를 더 했어야 했다는 교훈을 남기죠.","hl":"mn"},{"n":39,"text":"첫 번째로, I wish 뒤에 I had done처럼 had p.p.를 쓰면 과거 사실의 반대에 대한 소망을 나타내는 가정법 과거완료가 돼요. 두 번째로, a little more research에서 more는 research 같은 불가산명사 앞에서 더 많은을 뜻해요. a little이 비교급 more를 수식해서 조금 더라는 정도를 더해 주죠.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>화자는 신혼여행을 위해 인터넷에서 프랑스행 \u003cb class=\"key\">저가 \u003c/b>\u003cb class=\"key\">항공권\u003c/b>을 구입했지만 그것이 내 생애 최대의 실수였다고 말한다.\u003c/li>\u003cli>그는 항공권의 \u003cb class=\"key\">조건\u003c/b>을 보지 않았고, 조건을 알았더라면 절대 사지 않았을 것이라고 가정법 과거완료로 표현한다.\u003c/li>\u003cli>홍콩에서 여덟 시간, 두바이에서 여섯 시간을 기다리고 마드리드·취리히·프랑크푸르트를 \u003cb class=\"key\">경유\u003c/b>한 끝에야 프랑스에 도착했다.\u003c/li>\u003cli>그는 정보를 미리 알았더라면 표를 사지 않았을 것이라며 조금만 더 \u003cb class=\"key\">조사\u003c/b>했더라면 좋았을 걸 그랬다고 후회한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Not checking the conditions of cheap tickets turned a honeymoon trip into the biggest mistake of his life.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">신혼여행을 위해 인터넷에서 프랑스행 \u003cb class=\"key\">저가 \u003c/b>\u003cb class=\"key\">항공권\u003c/b>을 구입한 화자는 항공권의 \u003cb class=\"key\">조건\u003c/b>을 확인하지 않아 홍콩과 두바이 등에서 오랜 대기와 지연을 겪었다. 그는 그 사실을 미리 알았더라면 표를 사지 않았을 것이라며, 조금만 더 \u003cb class=\"key\">조사\u003c/b>했더라면 좋았을 걸 그랬다고 후회한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":40,"text":"오늘 글은 값싼 항공권 하나가 신혼여행 전체를 얼마나 힘들게 만들 수 있는지 보여 줬어요. 핵심은 가격만 보지 말고 조건을 확인하고 조사를 조금 더 하라는 것이었죠. 시험에서도 두괄식 주제문과 가정법 과거완료 표현은 자주 출제되니 꼭 챙겨 두세요. 오늘 수업은 여기까지입니다. 수고했어요, 여러분.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
