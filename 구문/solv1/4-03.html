<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SO 레벨1 4강 적용독해03 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-chips .x{background:none;color:#999;padding:0}
.lp-sno{font-size:13px;color:#8493A1;font-weight:700;margin-bottom:8px}

.lp-chunk{display:flex;flex-direction:column}
.lp-chunk .ko{font-size:13px;color:var(--pk-t);font-weight:700;line-height:1.3;margin-bottom:2px}
.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}
.lp-top::before{height:5px;background:linear-gradient(90deg,var(--pk) 0,var(--pk) 80%,var(--am) 80%,var(--am) 100%)}
.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}
.lp-tag{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700;padding:2px 12px}
.lp-qn{flex:0 0 112px;height:112px;align-self:center;background:#fff;color:var(--pk);border:3px solid var(--pk);border-radius:50%;font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;font-size:26px}
.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}
.lp-qn .qt{display:block;white-space:nowrap;line-height:1.12;letter-spacing:-.02em}
.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}

.lp-st h4{color:var(--ink,#1B2733)}
.lp-st h4 i{border-radius:4px;width:auto;min-width:24px;padding:0 4px}
.lp-pill{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700}
.lp-chain span.c{background:#fff;border:1px solid #AEBBE6;border-radius:3px;font-weight:600}
.lp-ct th{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif}
.lp-vg em{background:#fff;border:1px solid var(--pk-b);border-radius:3px}
.lp-sa>div{border-radius:4px;border-color:var(--pk-b)}

.lp-chips .s{border:1px solid #AEBBE6;color:#3A4FA3}
.lp-chips .a{border:1px solid var(--am-b);color:var(--am-d);background:#FFFBF2}
.lp-sno .es{background:var(--am);border-radius:2px;font-weight:700}
.lp-chunk .en{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:600}
.lp-chunk+.lp-chunk{border-left:1px solid var(--pk-b)}
.lp .tgt{background:var(--am-l);border-bottom:2.5px dotted var(--am)}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"SO 레벨1 4강 적용독해03","audioDir":"4-03_audio","preview":false,"count":45,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">4강\u003cbr>적용독해03\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">SO 레벨1\u003c/div>\u003ch1>A Recommendation Letter with a Secret Note\u003c/h1>\u003ch2>숨은 쪽지가 붙은 추천서\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>겉으로는 Hansen을 최고의 직원으로 칭찬하는 \u003cb class=\"key\">추천서\u003c/b>이지만, 뒤에 붙은 \u003cb class=\"key\">두 \u003c/b>\u003cb class=\"key\">번째 \u003c/b>\u003cb class=\"key\">쪽지\u003c/b>는 그가 옆에 있었기에 진짜 의견을 숨겼음을 암시하며 특정 행만 읽으라고 말한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Although the recommendation letter praises Mr. Hansen, the secret note suggests that the writer could not reveal his true opinion because Hansen was beside him and tells the reader to read only certain lines.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"여러분, 안녕하세요. 오늘은 추천서에 숨겨진 쪽지를 읽는 재미있는 지문을 함께 보겠습니다. 이 글은 Hansen 씨를 칭찬하는 추천서처럼 시작하지만, 마지막에 붙은 두 번째 쪽지가 글의 의미를 완전히 바꿔 놓아요. 겉으로 드러난 칭찬과 숨은 의도가 어떻게 다른지, 함께 차근차근 살펴보겠습니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">추천서(recommendation letter)는 지원자의 성품과 능력을 제삼자가 보증하는 문서예요. 좋은 추천서는 구체적인 근거와 신뢰를 담아야 하지만, 때로는 \u003cb class=\"key\">표면적 \u003c/b>\u003cb class=\"key\">칭찬\u003c/b>과 \u003cb class=\"key\">숨은 \u003c/b>\u003cb class=\"key\">의도\u003c/b>가 다를 수 있어요. 특히 추천서를 쓰는 사람이 지원자와 같은 공간에 있으면 불편한 말을 직접 쓰기 어려워 대신 완곡한 표현(euphemism)이나 아이러니(irony)를 사용하기도 하죠. 이 지문은 추천서 뒤에 붙은 쪽지(secret note)를 통해 그런 \u003cb class=\"key\">이중적 \u003c/b>\u003cb class=\"key\">상황\u003c/b>을 보여 줍니다. 친구에게 문자를 보내는데 그 친구가 옆에서 화면을 보고 있다고 생각해 보세요. 그때는 좋은 말만 쓰고, 진짜 속마음은 나중에 따로 전하게 되죠.\u003c/div>","segs":[{"n":2,"text":"먼저 추천서라는 말을 영어로 recommendation letter라고 해요. 추천서는 지원자의 성품과 능력을 다른 사람이 보증해 주는 문서인데, 좋은 추천서는 구체적인 근거와 신뢰를 담아야 하죠. 그런데 추천서를 쓰는 사람이 지원자 옆에 있다면 불편한 말을 직접 쓰기 어려울 수 있어요. 그래서 완곡한 표현인 euphemism이나 아이러니인 irony를 사용해 진짜 속마음을 숨기기도 합니다. 이 지문은 추천서 뒤에 붙은 secret note, 즉 숨은 쪽지를 통해 표면적 칭찬과 숨은 의도가 다를 수 있다는 이중적 상황을 보여 줘요. 친구에게 문자를 보내는데 그 친구가 옆에서 화면을 보고 있는 상황을 떠올려 보면 이해가 쉬울 거예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>표면적 칭찬\u003csmall>도입 · 문장 1–4\u003c/small>\u003c/h4>\u003cp>추천서는 Hansen 씨와 일하면서 그가 사무실에서 시간을 낭비하거나 잡담하지 않고 책상에서 열심히 일하는 모습을 보았다고 시작해요. 그는 쓸데없는 일에 시간을 쓰지 않고 늘 제시간에 일을 마친다고 평가받죠. 또한 나쁜 버릇이 전혀 없고 자기 분야에 해박하다는 칭찬이 이어집니다. 이 단계는 겉으로 드러난 \u003cb class=\"key\">긍정 \u003c/b>\u003cb class=\"key\">평가\u003c/b>를 쌓는 부분이에요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>최고 직원이라는 주장\u003csmall>주장 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>이어서 화자는 Hansen 씨를 단연코 가장 우수한 직원이라고 할 수 있다고 \u003cb class=\"key\">강한 \u003c/b>\u003cb class=\"key\">주장\u003c/b>을 해요. 그리고 절대 다른 사람으로 교체되어서는 안 된다고 덧붙이죠. 이 부분까지 읽으면 추천서는 매우 긍정적이고 확신에 찬 문서처럼 보입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>두 번째 쪽지의 등장\u003csmall>전환 · 문장 7–8\u003c/small>\u003c/h4>\u003cp>추천서는 지점장의 서명으로 끝나지만, 곧바로 또 다른 쪽지가 뒤따른다는 사실이 제시돼요. 이 \u003cb class=\"key\">두 \u003c/b>\u003cb class=\"key\">번째 \u003c/b>\u003cb class=\"key\">쪽지\u003c/b>는 앞의 추천서만으로는 다 설명되지 않는 상황을 암시합니다. 글의 분위기가 갑자기 바뀌는 \u003cb class=\"key\">전환\u003c/b>의 지점이에요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>숨은 의도\u003csmall>반전 · 문장 9–11\u003c/small>\u003c/h4>\u003cp>쪽지는 추천서를 쓰고 있을 때 Hansen 씨가 옆에 앉아 있었다고 고백해요. 그래서 화자는 자신의 진짜 생각을 알려면 1, 3, 5, 7행만 읽으라고 지시하죠. 이는 추천서의 \u003cb class=\"key\">표면적 \u003c/b>\u003cb class=\"key\">칭찬\u003c/b>이 진짜 의견과 다를 수 있음을 보여 줍니다. 결국 글의 핵심은 \u003cb class=\"key\">숨은 \u003c/b>\u003cb class=\"key\">의도\u003c/b>를 읽어 내는 것이에요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 차례대로 살펴볼게요.","hl":null},{"n":4,"text":"먼저 추천서는 Hansen 씨와 일하면서 그가 사무실에서 시간을 낭비하거나 다른 사람들과 잡담하지 않고 자기 책상에서 열심히 일하는 모습을 늘 보아왔다고 말해요. 그는 쓸데없는 일에 좀처럼 시간을 낭비하지 않고 늘 제시간에 일을 마친다고 평가받죠. 또한 나쁜 버릇이 전혀 없고 자기 분야에 대한 해박한 지식이 인상적이라는 칭찬이 이어집니다. 이 부분은 겉으로 드러난 긍정 평가를 차곡차곡 쌓는 단계예요.","hl":"f0"},{"n":5,"text":"그다음 화자는 Hansen 씨를 단연코 가장 우수한 직원이라고 할 수 있다고 강한 주장을 해요. 그리고 절대 다른 사람으로 교체되어서는 안 된다고 덧붙이죠. 여기까지 읽으면 추천서는 아주 긍정적이고 확신에 찬 문서처럼 보입니다.","hl":"f1"},{"n":6,"text":"그런데 추천서는 지점장의 서명으로 끝나는 듯하다가 곧바로 또 다른 쪽지가 뒤따른다는 사실이 제시돼요. 이 두 번째 쪽지는 앞의 추천서만으로는 설명되지 않는 상황을 암시합니다. 바로 이 지점에서 글의 분위기가 바뀌는 전환이 일어나죠.","hl":"f2"},{"n":7,"text":"쪽지는 추천서를 쓰고 있을 때 Hansen 씨가 옆에 앉아 있었다고 고백해요. 그래서 화자는 자신의 진짜 생각을 알려면 첫 번째, 세 번째, 다섯 번째, 일곱 번째 행만 읽으라고 지시하죠. 이는 추천서의 표면적 칭찬이 진짜 의견과 다를 수 있음을 보여 줍니다. 결국 이 글의 핵심은 겉에 드러난 말 너머의 숨은 의도를 읽어 내는 것이에요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">표면-반전\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 10번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 먼저 Hansen 씨에 대한 칭찬을 길게 나열한 뒤, 마지막에 두 번째 쪽지를 제시하며 \u003cb class=\"key\">분위기\u003c/b>를 바꿔요. 앞부분만 보면 전형적인 추천서지만, 10번 문장의 'READ ONLY LINES...'라는 지시가 \u003cb class=\"key\">반전\u003c/b>을 만들어 냅니다. 따라서 중심 내용이 글 끝에서 드러나는 \u003cb class=\"key\">미괄식\u003c/b> 구조로 볼 수 있어요. 표면적 칭찬과 숨은 쪽지의 대비를 통해 글의 진짜 의도를 파악해야 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>always (1)\u003c/b>\u003cspan>긍정 평가의 반복\u003c/span>\u003cb>absolutely (4)\u003c/b>\u003cspan>강한 긍정 강조\u003c/span>\u003cb>A second note followed (7)\u003c/b>\u003cspan>전환 신호\u003c/span>\u003cb>READ ONLY (10)\u003c/b>\u003cspan>핵심 지시\u003c/span>\u003cb>true opinion (10)\u003c/b>\u003cspan>반전 단서\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Letter of Recommendation\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">working hard at his desk\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">without wasting time\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">seldom spends his time on useless things\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">finishes his work on time\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">no bad habits\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">deep knowledge of his field\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">best worker\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">never be replaced\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">true opinion\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>추천서 본문\u003c/th>\u003cth>두 번째 쪽지\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Hansen을 공개적으로 칭찬함\u003c/td>\u003ctd>Hansen이 옆에 있었다고 고백함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>겉으로는 확신에 찬 평가\u003c/td>\u003ctd>특정 행만 읽으라고 지시함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>표면적 의미가 긍정적임\u003c/td>\u003ctd>숨은 의도를 따로 밝힘\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 앞부분에서 Hansen 씨에 대한 칭찬을 길게 나열한 뒤, 마지막에 두 번째 쪽지를 제시하며 분위기를 바꿔요. 앞만 보면 전형적인 추천서지만, 특정 행만 읽으라는 지시가 반전을 만들어 냅니다. 그래서 중심 내용이 글 끝에서 드러나는 미괄식 구조로 볼 수 있어요. 표면적 칭찬과 숨은 쪽지의 대비를 통해 진짜 의도를 파악해야 합니다.","hl":"ty"},{"n":9,"text":"글 초반에는 always나 absolutely 같은 표현이 반복되며 긍정 평가를 강조해요. 그리고 A second note followed this letter라는 문장이 나오면서 앞의 추천서와 뒤의 쪽지를 갈라 주는 전환 신호가 됩니다. 마지막 쪽지의 READ ONLY와 true opinion은 독자에게 숨은 의도를 읽으라고 강하게 지시하는 표현이에요. 이런 신호어를 따라가면 겉으로 드러난 칭찬과 실제로 전달하려는 메시지를 구분할 수 있습니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>letter of recommendation\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>추천서\u003c/span>\u003c/div>\u003cdiv>\u003cb>work with\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~와 일하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>find\u003c/b>\u003cem>동사\u003c/em>\u003cspan>발견하다, 알다\u003c/span>\u003c/div>\u003cdiv>\u003cb>work hard\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>열심히 일하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>at one's desk\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>책상에서\u003c/span>\u003c/div>\u003cdiv>\u003cb>without\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~없이\u003c/span>\u003c/div>\u003cdiv>\u003cb>waste time\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>시간을 낭비하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>chat with\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~와 잡담하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>office\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사무실\u003c/span>\u003c/div>\u003cdiv>\u003cb>seldom\u003c/b>\u003cem>부사\u003c/em>\u003cspan>좀처럼 ~하지 않다\u003c/span>\u003c/div>\u003cdiv>\u003cb>spend time on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 시간을 쓰다\u003c/span>\u003c/div>\u003cdiv>\u003cb>useless\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>쓸모없는\u003c/span>\u003c/div>\u003cdiv>\u003cb>finish\u003c/b>\u003cem>동사\u003c/em>\u003cspan>끝내다, 마치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>on time\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>제시간에\u003c/span>\u003c/div>\u003cdiv>\u003cb>absolutely\u003c/b>\u003cem>부사\u003c/em>\u003cspan>전혀, 완전히\u003c/span>\u003c/div>\u003cdiv>\u003cb>bad habit\u003c/b>\u003cem>명사\u003c/em>\u003cspan>나쁜 버릇\u003c/span>\u003c/div>\u003cdiv>\u003cb>be impressed by\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 감명받다\u003c/span>\u003c/div>\u003cdiv>\u003cb>deep\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>깊은, 해박한\u003c/span>\u003c/div>\u003cdiv>\u003cb>knowledge\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지식\u003c/span>\u003c/div>\u003cdiv>\u003cb>field\u003c/b>\u003cem>명사\u003c/em>\u003cspan>분야\u003c/span>\u003c/div>\u003cdiv>\u003cb>surely\u003c/b>\u003cem>부사\u003c/em>\u003cspan>확실히, 단연코\u003c/span>\u003c/div>\u003cdiv>\u003cb>be called\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~라고 불리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>best worker\u003c/b>\u003cem>명사\u003c/em>\u003cspan>최고의 직원\u003c/span>\u003c/div>\u003cdiv>\u003cb>be replaced by\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 교체되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>branch manager\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지점장\u003c/span>\u003c/div>\u003cdiv>\u003cb>follow\u003c/b>\u003cem>동사\u003c/em>\u003cspan>뒤따르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>sit beside\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>옆에 앉다\u003c/span>\u003c/div>\u003cdiv>\u003cb>read\u003c/b>\u003cem>동사\u003c/em>\u003cspan>읽다\u003c/span>\u003c/div>\u003cdiv>\u003cb>line\u003c/b>\u003cem>명사\u003c/em>\u003cspan>행, 줄\u003c/span>\u003c/div>\u003cdiv>\u003cb>true opinion\u003c/b>\u003cem>명사\u003c/em>\u003cspan>진짜 의견\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어로는 waste time, 즉 시간을 낭비하다라는 표현과 on time, 즉 제시간에라는 숙어를 꼭 기억해 두세요. 또 be impressed by는 감명받다라는 뜻이고, be replaced by는 교체되다라는 뜻으로 쓰여요. branch manager는 지점장, true opinion은 진짜 의견이라는 의미로 정리해 둡시다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">waste\u003c/b>\u003cspan class=\"m\">낭비하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">squander\u003c/span>\u003cspan class=\"s\">misuse\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">save\u003c/span>\u003cspan class=\"a\">conserve\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">seldom\u003c/b>\u003cspan class=\"m\">좀처럼 ~하지 않는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">rarely\u003c/span>\u003cspan class=\"s\">hardly ever\u003c/span>\u003cspan class=\"s\">infrequently\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">often\u003c/span>\u003cspan class=\"a\">frequently\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">useless\u003c/b>\u003cspan class=\"m\">쓸모없는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">pointless\u003c/span>\u003cspan class=\"s\">worthless\u003c/span>\u003cspan class=\"s\">futile\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">useful\u003c/span>\u003cspan class=\"a\">valuable\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">finish\u003c/b>\u003cspan class=\"m\">끝내다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">complete\u003c/span>\u003cspan class=\"s\">conclude\u003c/span>\u003cspan class=\"s\">end\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">begin\u003c/span>\u003cspan class=\"a\">start\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">absolutely\u003c/b>\u003cspan class=\"m\">전혀, 완전히\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">completely\u003c/span>\u003cspan class=\"s\">totally\u003c/span>\u003cspan class=\"s\">entirely\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">partly\u003c/span>\u003cspan class=\"a\">partially\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">impressed\u003c/b>\u003cspan class=\"m\">감명받은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">moved\u003c/span>\u003cspan class=\"s\">touched\u003c/span>\u003cspan class=\"s\">struck\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unimpressed\u003c/span>\u003cspan class=\"a\">indifferent\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">deep\u003c/b>\u003cspan class=\"m\">깊은, 해박한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">profound\u003c/span>\u003cspan class=\"s\">extensive\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">shallow\u003c/span>\u003cspan class=\"a\">superficial\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">replace\u003c/b>\u003cspan class=\"m\">교체하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">substitute\u003c/span>\u003cspan class=\"s\">supplant\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">keep\u003c/span>\u003cspan class=\"a\">retain\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"시험에 자주 나오는 어휘도 함께 정리해 볼게요. waste는 squander나 misuse로 바꿔 쓸 수 있고, 반대말은 save나 conserve예요. seldom은 rarely나 hardly ever와 가깝고, 반대말은 often이나 frequently입니다. useless는 pointless나 worthless와 비슷하며 반대말은 useful이나 valuable이고, replace는 substitute나 supplant로 바꿀 수 있어요. 이렇게 동의어와 반의어를 함께 묶어 두면 어휘 문제에서 훨씬 빠르게 답을 찾을 수 있습니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">추천서\u003c/span>\u003cspan class=\"en\">Letter of Recommendation\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Hansen 씨와 일하면서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">working \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">Mr. \u003c/span>\u003cspan class=\"tgt\">Hansen\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 그를 늘 보아왔습니다\u003c/span>\u003cspan class=\"en\">I've always \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">found \u003c/span>\u003cspan class=\"tgt\">him \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자기 책상에서 열심히 일하는 모습을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">working \u003c/span>\u003cspan class=\"tgt\">hard \u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">desk\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시간을 낭비하는 일 없이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">without \u003c/span>\u003cspan class=\"tgt\">wasting \u003c/span>\u003cspan class=\"tgt\">time \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">혹은 다른 사람들과 잡담하는 일 없이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">chatting \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">other \u003c/span>\u003cspan class=\"tgt\">people\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사무실에서\u003c/span>\u003cspan class=\"en\">in the office.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">추천서. Hansen 씨와 일하면서, 저는 그가 사무실에서 시간을 낭비하거나 다른 사람들과 잡담하는 일 없이 자기 책상에서 열심히 일하는 모습을 늘 보아왔습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 추천서의 첫 문장으로, Hansen 씨가 \u003cb class=\"key\">시간\u003c/b>을 낭비하거나 잡담하지 않고 열심히 일한다는 점을 칭찬하고 있어요. \u003cb class=\"key\">without\u003c/b>을 이용해 '그런 일 없이'라는 조건을 덧붙여 그의 \u003cb class=\"key\">근무 \u003c/b>\u003cb class=\"key\">태도\u003c/b>를 강하게 긍정하고 있죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">분사구문(접속사 when + 현재분사)\u003c/span> : When + [현재분사 working] = When [I was] working with Mr. Hansen : \"Hansen 씨와 일할 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">5형식 목적격보어(현재분사)\u003c/span> : find + [목적어 him] + [현재분사 working (목적격보어)] : \"그가 자기 책상에서 열심히 일하는 모습을 보다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 + 동명사 / 동명사 병렬\u003c/span> : without + [동명사 wasting] + or + [동명사 chatting] : \"시간을 낭비하거나 다른 사람들과 잡담하는 일 없이\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Letter of Recommendation, 추천서. When working with Mr. Hansen, Hansen 씨와 일하면서. I've always found him, 저는 그를 늘 보아왔습니다. working hard at his desk, 자기 책상에서 열심히 일하는 모습을. without wasting time, 시간을 낭비하는 일 없이. or chatting with other people, 혹은 다른 사람들과 잡담하는 일 없이. in the office, 사무실에서. 이 문장 전체를 해석하면, 추천서. Hansen 씨와 일하면서, 저는 그가 사무실에서 시간을 낭비하거나 다른 사람들과 잡담하는 일 없이 자기 책상에서 열심히 일하는 모습을 늘 보아왔습니다.","hl":"m"},{"n":13,"text":"추천서의 첫 문장이에요. Hansen 씨가 시간을 낭비하거나 잡담하지 않고 열심히 일한다는 점을 칭찬하고 있죠. without을 이용해서 그런 일 없이라는 조건을 덧붙여서 그의 근무 태도를 강하게 긍정하고 있습니다.","hl":"mn"},{"n":14,"text":"먼저 When working with Mr. Hansen을 보면, 접속사 when을 그대로 두고 주어와 be동사를 생략한 분사구문이에요. 두 절의 주어가 같으니까 이렇게 줄여서 쓴다고 이해하면 됩니다. 두 번째로 found him working hard at his desk는 지각동사 find 뒤에 목적어 him이 오고, 현재분사 working이 목적격보어로 붙은 구조예요. 현재분사를 쓰면 일하는 모습이 진행 중인 장면으로 그려진다는 게 핵심이죠. 세 번째로 without wasting time or chatting with other people은 전치사 without 뒤에 동명사 wasting과 chatting이 온 구조예요. 전치사 뒤에는 동명사, 그리고 두 동명사를 or로 나란히 묶는 병렬, 이 두 가지만 확실히 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 좀처럼 쓰지 않습니다\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">seldom \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">spends \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자기 시간을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">time \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">쓸데없는 일에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">useless \u003c/span>\u003cspan class=\"tgt\">things\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 쓸데없는 일에는 좀처럼 시간을 낭비하지 않습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 말한 '시간을 낭비하지 않는다'는 내용을 \u003cb class=\"key\">seldom\u003c/b>을 써서 한 번 더 정리한 문장이에요. 쓸데없는 일에 시간을 쓰지 않는다는 뜻으로 his \u003cb class=\"key\">근무 \u003c/b>\u003cb class=\"key\">태도\u003c/b>를 강조해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">빈도부사의 위치\u003c/span> : [주어 He] + [빈도부사 seldom] + [본동사 spends] : \"좀처럼 쓰지 않는다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">spend + 목적어 + on + 명사\u003c/span> : spend + [목적어 his time] + [on + 명사 useless things] : \"쓸데없는 일에 시간을 쓰다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"He seldom spends, 그는 좀처럼 쓰지 않습니다. his time, 자기 시간을. on useless things, 쓸데없는 일에. 이 문장 전체를 해석하면, 그는 쓸데없는 일에는 좀처럼 시간을 낭비하지 않습니다.","hl":"m"},{"n":16,"text":"이 문장은 앞에서 한 말을 한 번 더 정리해 주는 역할이에요. seldom이라는 부사로 시간을 낭비하지 않는 습관을 강조하고 있죠. 쓸데없는 일에 시간을 쓰지 않는다는 뜻으로 그의 근무 태도를 뒷받침합니다.","hl":"mn"},{"n":17,"text":"먼저 seldom spends를 보면, 빈도부사 seldom이 일반동사 spends 앞에 와서 얼마나 자주 그러는지를 나타내요. 다음으로 spends his time on useless things는 spend가 목적어 his time을 받고, 무엇에 썼는지를 전치사 on 뒤에 명사로 붙이는 구조예요. 시간이나 돈을 어디에 썼는지 말할 때 자주 쓰는 패턴이니까 통째로 익혀 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 늘 마칩니다\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">always \u003c/span>\u003cspan class=\"tgt\">finishes\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자기 일을\u003c/span>\u003cspan class=\"en\">his work\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제 시간에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">time\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">늘 제 시간에 일을 마칩니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 일을 \u003cb class=\"key\">제 \u003c/b>\u003cb class=\"key\">시간에\u003c/b> 끝낸다는 점을 통해 그가 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">관리\u003c/b>를 잘하는 사람임을 보여줘요. 앞의 두 문장과 함께 성실함을 뒷받침하는 근거가 되죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">빈도부사의 위치와 주어 인칭에 따른 현재형\u003c/span> : [주어 He] + [빈도부사 always] + [동사 finishes(현재형)] : \"늘 마친다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 관용표현(on time)\u003c/span> : on time = [정해진 시각]에 맞춰 / in time = [늦지 않게] 때맞춰 : \"제 시간에, 정시에\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"He always finishes, 그는 늘 마칩니다. his work, 자기 일을. on time, 제 시간에. 이 문장 전체를 해석하면, 늘 제 시간에 일을 마칩니다.","hl":"m"},{"n":19,"text":"일을 늘 제 시간에 끝낸다는 건 약속을 잘 지킨다는 뜻이에요. 시간 관리를 잘하는 사람이라는 점을 보여 주는 근거가 되죠. 앞의 두 문장과 묶어서 그의 성실함을 완성해 주는 문장입니다.","hl":"mn"},{"n":20,"text":"먼저 always finishes를 보면, 빈도부사 always가 일반동사 finishes 앞에 와서 늘 그런다는 습관을 나타내요. 주어 He가 한 사람을 가리키니까 동사에 -es를 붙인 현재시제 형태라는 것도 같이 기억해 두세요. 다음으로 on time은 정해진 시각에 맞춰라는 뜻이고, in time은 늦지 않게 때맞춰라는 뜻이라서 서로 바꿔 쓰면 안 돼요. 시험에서 on time과 in time을 바꿔 놓는 함정이 자주 나오니까 꼭 구별해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 나쁜 버릇이 전혀 없으며,\u003c/span>\u003cspan class=\"en\">He has \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">absolutely \u003c/span>\u003cspan class=\"tgt\">no \u003c/span>\u003cspan class=\"tgt\">bad \u003c/span>\u003cspan class=\"tgt\">habits\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 저는 감동을 받습니다\u003c/span>\u003cspan class=\"en\">and I \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">am \u003c/span>\u003cspan class=\"tgt\">impressed \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자기 분야에 대한 그의 해박한 지식에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">by\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">deep \u003c/span>\u003cspan class=\"tgt\">knowledge \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">field\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나쁜 버릇도 전혀 없으며, 자기 분야에 대한 그의 해박한 지식에 저는 감동 받습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Hansen 씨의 인격과 실력을 동시에 칭찬하는 문장입니다. '나쁜 버릇이 전혀 없다'와 '자기 분야에 대한 \u003cb class=\"key\">해박한 \u003c/b>\u003cb class=\"key\">지식\u003c/b>에 \u003cb class=\"key\">감동\u003c/b> 받았다'를 and로 병렬 연결했죠. 다만 맨 뒤 쪽지에서 네 번째 줄은 '진짜 의견'에서 빼라고 했으니, 이 문장은 겉치레용 \u003cb class=\"key\">칭찬\u003c/b>으로 읽는 반전이 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">no를 강조하는 부사\u003c/span> : [[absolutely]] + no + 명사 : \"나쁜 버릇이 전혀 없다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">감정을 나타내는 수동태\u003c/span> : [[주어]] + be + [[과거분사]] + by + 감정의 원인 : \"~에 감동 받는다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 수식\u003c/span> : [명사 knowledge] + [of + 명사] → 앞의 명사를 꾸밈 : \"자기 분야에 대한 그의 해박한 지식\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"He has absolutely no bad habits, 그는 나쁜 버릇이 전혀 없으며. and I am impressed, 그리고 저는 감동을 받습니다. by his deep knowledge of his field, 자기 분야에 대한 그의 해박한 지식에. 이 문장 전체를 해석하면, 나쁜 버릇도 전혀 없으며, 자기 분야에 대한 그의 해박한 지식에 저는 감동 받습니다.","hl":"m"},{"n":22,"text":"이 문장은 Hansen 씨의 인격과 실력을 한꺼번에 칭찬하는 부분이에요. 나쁜 버릇이 전혀 없다는 말과, 자기 분야에 대한 해박한 지식에 감동 받았다는 말을 and로 나란히 이어 붙였죠. 그런데 맨 뒤 쪽지에서 네 번째 줄은 진짜 의견에서 빼라고 했으니, 이 문장은 겉치레용 칭찬으로 읽는 재미가 있어요.","hl":"mn"},{"n":23,"text":"먼저 am impressed by를 보세요. 감정을 느끼는 수동 표현이고, 감정의 원인은 by로 연결해요. 다음으로 knowledge of his field에서 of his field는 앞의 명사 knowledge를 꾸며 주는 형용사 역할을 합니다. 마지막으로 absolutely no는 전면 부정을 더 세게 만드는 표현이에요. '전혀 없다'로 해석하시면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 생각합니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">think\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그가 단연코 불릴 수 있다고\u003c/span>\u003cspan class=\"en\">he \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">surely \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">called\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가장 우수한 직원이라고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">best \u003c/span>\u003cspan class=\"tgt\">worker\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 단연코 가장 우수한 직원이라고 할 수 있을 것입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 추천서의 결론에 해당하는 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">주장\u003c/b> 문장입니다. I think로 완곡하게 말하면서도 '가장 우수한 직원'이라는 \u003cb class=\"key\">최고\u003c/b> 평가를 분명히 밝히고 있죠. 뒤 쪽지에서도 다섯 번째 줄은 '진짜 의견'에 포함되므로, 이 문장만은 진심으로 볼 수 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that의 생략\u003c/span> : I think + [[(that)]] + 주어 + 동사 : \"~라고 나는 생각한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사가 있는 수동태\u003c/span> : [[조동사 can]] + (부사 surely) + [[be + 과거분사]] : \"단연코 불릴 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">call A B의 수동태\u003c/span> : A is called + [[B(주격보어)]] : \"가장 우수한 직원이라고 불리다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"I think, 저는 생각합니다. he can surely be called, 그가 단연코 불릴 수 있다고. our best worker, 가장 우수한 직원이라고. 이 문장 전체를 해석하면, 그는 단연코 가장 우수한 직원이라고 할 수 있을 것입니다.","hl":"m"},{"n":25,"text":"이 문장은 추천서의 결론에 해당하는 핵심 주장이에요. I think로 살짝 완곡하게 말하면서도, 그가 가장 우수한 직원이라는 최고 평가를 분명히 남기고 있죠. 게다가 뒤 쪽지에서 다섯 번째 줄은 진짜 의견에 들어가니까, 이 문장만은 진심이라고 봐도 좋아요.","hl":"mn"},{"n":26,"text":"첫 번째, I think 뒤에는 접속사 that이 생략된 목적절이 이어져요. 두 번째, can surely be called는 조동사가 들어간 수동태이고, 부사 surely는 조동사와 be 사이에 자리를 잡습니다. 세 번째, call A B가 수동태가 되면 B가 주격보어로 남는데, 바로 our best worker가 그 자리예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 절대 교체되어서는 안 됩니다\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">should \u003c/span>\u003cspan class=\"tgt\">never \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">replaced\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 어떤 사람에 의해서도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">anyone \u003c/span>\u003cspan class=\"tgt\">else\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">절대 다른 사람으로 교체되어서는 안 됩니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 그를 대신할 사람이 없다는 \u003cb class=\"key\">강한 \u003c/b>\u003cb class=\"key\">확신\u003c/b>을 담은 문장입니다. never와 anyone else를 함께 써서 '다른 어떤 사람으로도 \u003cb class=\"key\">교체\u003c/b>되어서는 안 된다'는 뜻을 만들었죠. 다만 이 줄은 뒤 쪽지에서 '진짜 의견'에서 빠지는 줄이니, \u003cb class=\"key\">과장\u003c/b>된 표현으로 읽을 수도 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 + 부사 + 수동태\u003c/span> : [[조동사 should]] + [[never]] + be + 과거분사 : \"절대 교체되어서는 안 된다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태의 행위자 표현\u003c/span> : by + [[anyone else]] : \"다른 어떤 사람에 의해서도\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"He should never be replaced, 그는 절대 교체되어서는 안 됩니다. by anyone else, 다른 어떤 사람에 의해서도. 이 문장 전체를 해석하면, 절대 다른 사람으로 교체되어서는 안 됩니다.","hl":"m"},{"n":28,"text":"이 문장은 그를 대신할 사람이 없다는 강한 확신을 담고 있어요. never와 anyone else를 함께 써서 다른 어떤 사람으로도 교체되면 안 된다는 뜻을 만들었죠. 다만 이 줄은 뒤 쪽지에서 진짜 의견에서 빠지는 줄이니, 과장된 표현으로 읽을 수도 있습니다.","hl":"mn"},{"n":29,"text":"첫 번째, should never be replaced에서 never는 조동사 뒤, be 앞에 와서 금지의 뜻을 강하게 눌러 줍니다. 두 번째, by anyone else는 수동태에서 행위자를 이끄는 by에 anyone else가 붙은 모양이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지점장\u003c/span>\u003cspan class=\"en\">Branch Manager\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">(또 다른 글이\u003c/span>\u003cspan class=\"en\">(A second note\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 추천장 뒤에 이어졌다.)\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">followed\u003c/span> this letter.)\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">지점장(이 추천장 뒤에 또 다른 글이 이어졌다.)\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 추천장의 서명 부분이에요. 서명은 \u003cb class=\"key\">지점장\u003c/b>이 했고, 괄호 안에는 이 추천장 뒤에 또 다른 글이 붙어 있었다는 사실이 담겨 있어요. 이 \u003cb class=\"key\">두 \u003c/b>\u003cb class=\"key\">번째 \u003c/b>\u003cb class=\"key\">글\u003c/b>이 뒤에서 결정적인 반전을 만들어 냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">3형식 타동사(follow)\u003c/span> : A second note [주어] + followed [타동사] + this letter [목적어] : \"이 추천장 뒤에 또 다른 글이 이어졌다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Branch Manager, 지점장. (A second note, (또 다른 글이. followed this letter.), 이 추천장 뒤에 이어졌다.). 이 문장 전체를 해석하면, 지점장(이 추천장 뒤에 또 다른 글이 이어졌다.)","hl":"m"},{"n":31,"text":"이 문장은 추천장의 서명 부분이에요. 서명은 지점장이 했고, 괄호 안에는 이 추천장 뒤에 또 다른 글이 붙어 있었다는 사실이 담겨 있죠. 바로 그 두 번째 글이 뒤에서 결정적인 반전을 만들어 냅니다.","hl":"mn"},{"n":32,"text":"여기서 눈여겨볼 동사는 followed예요. A second note가 주어, followed가 동사, this letter가 목적어인 3형식 문장이죠. follow는 뒤따르다라는 뜻의 타동사라서 전치사 없이 바로 목적어가 옵니다. 그리고 괄호 안의 이 문장은 본문 흐름에 정보를 덧붙이는 삽입 표현이라는 것도 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">MR.(뒤 문장의 HANSEN과 붙여 'Hansen 씨')\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">MR.\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">MR. — 'Hansen 씨'의 '씨'에 해당하는 부분\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 원문이 줄바꿈 때문에 MR.과 HANSEN이 두 문장으로 갈라졌어요. 실제로는 하나로 붙여 읽어야 하는 \u003cb class=\"key\">호칭\u003c/b> 표현이죠. 그래서 뒤 문장의 HANSEN과 함께 'Hansen 씨'로 해석합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">약어(abbreviation)와 경칭\u003c/span> : MR. [Mister의 약어] + 성(HANSEN) : \"~씨\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"MR, MR.(뒤 문장의 HANSEN과 붙여 'Hansen 씨'). 이 문장 전체를 해석하면, MR. — 'Hansen 씨'의 '씨'에 해당하는 부분","hl":"m"},{"n":34,"text":"원문이 줄바꿈 때문에 MR.과 HANSEN이 두 문장으로 갈라져 있어요. 실제로는 하나로 붙여 읽는 호칭 표현이죠. 그래서 뒤 문장의 HANSEN과 함께 Hansen 씨로 해석합니다.","hl":"mn"},{"n":35,"text":"MR.은 Mister를 줄인 약어예요. 성 앞에 붙어서 공손함을 나타내죠. 줄이 바뀌어도 호칭은 한 덩어리로 붙여 읽는다는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Hansen 씨가 앉아 있었습니다\u003c/span>\u003cspan class=\"en\">HANSEN \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">WAS \u003c/span>\u003cspan class=\"tgt\">SITTING\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제 옆에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">BESIDE \u003c/span>\u003cspan class=\"tgt\">ME\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제가 작성하고 있을 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">WHEN \u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">WAS \u003c/span>\u003cspan class=\"tgt\">WRITING\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">귀사에 보낼 이 추천장을\u003c/span>\u003cspan class=\"en\">THE LETTER FOR YOU\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오늘\u003c/span>\u003cspan class=\"en\">TODAY.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">제가 오늘 귀사에 보낼 이 추천장을 작성하고 있을 때 Hansen 씨가 옆에 앉아 있었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장이 글의 \u003cb class=\"key\">반전\u003c/b>을 완성해요. 편지를 쓰는 동안 Hansen 씨가 바로 옆에 앉아 있었다는 사실이 드러나니까요. 칭찬을 늘어놓는 그 순간에도 그가 옆에서 지켜보고 있었다는 설정 때문에, 앞의 칭찬이 진심이 아니었을 수 있다는 \u003cb class=\"key\">아이러니\u003c/b>가 생깁니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거진행형(be동사 + 현재분사)\u003c/span> : was [be동사 과거] + sitting [현재분사] : \"앉아 있었습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 + 대명사 목적격\u003c/span> : beside [전치사] + me [목적격] : \"제 옆에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">접속사 when의 시간 부사절\u003c/span> : when + [주어 I] + [동사 was writing] : \"제가 작성하고 있을 때\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"HANSEN WAS SITTING, Hansen 씨가 앉아 있었습니다. BESIDE ME, 제 옆에. WHEN I WAS WRITING, 제가 작성하고 있을 때. THE LETTER FOR YOU, 귀사에 보낼 이 추천장을. TODAY, 오늘. 이 문장 전체를 해석하면, 제가 오늘 귀사에 보낼 이 추천장을 작성하고 있을 때 Hansen 씨가 옆에 앉아 있었습니다.","hl":"m"},{"n":37,"text":"이 문장이 글의 반전을 완성해요. 편지를 쓰는 동안 Hansen 씨가 바로 옆에 앉아 있었다는 사실이 드러나니까요. 칭찬을 늘어놓는 그 순간에도 그가 옆에서 지켜보고 있었다는 설정 때문에, 앞의 칭찬이 진심이 아니었을 수 있다는 아이러니가 생깁니다.","hl":"mn"},{"n":38,"text":"먼저 WAS SITTING은 be동사 was에 현재분사 sitting이 붙은 과거진행형이에요. 그래서 앉아 있었다는 진행의 의미가 되죠. 두 번째로 BESIDE ME에서는 전치사 뒤에 목적격 me가 온다는 규칙을 확인하세요. 세 번째로 WHEN I WAS WRITING은 when이 이끄는 시간 부사절이고, 주절도 과거진행이라 두 동작이 같은 시점에 일어난 동시 동작임을 보여줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오직 행들만 읽어주세요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">READ \u003c/span>\u003cspan class=\"tgt\">ONLY \u003c/span>\u003cspan class=\"tgt\">LINES\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1, 3, 5, 그리고 7\u003c/span>\u003cspan class=\"en\">1,3,5, AND 7\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Hansen 씨에 대한 저의 진짜 생각을 아시려면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">FOR \u003c/span>\u003cspan class=\"tgt\">MY \u003c/span>\u003cspan class=\"tgt\">TRUE \u003c/span>\u003cspan class=\"tgt\">OPINION \u003c/span>\u003cspan class=\"tgt\">OF \u003c/span>\u003cspan class=\"tgt\">HIM.\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Hansen 씨에 대한 저의 진짜 생각을 아시려면 1 , 3 , 5 , 7 행만 읽어주세요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 추천장 뒤에 붙은 비밀 쪽지의 핵심 지시로, 표면적인 추천장 전체가 아니라 특정 행만 읽어야 지점장의 \u003cb class=\"key\">진짜 \u003c/b>\u003cb class=\"key\">의견\u003c/b>을 알 수 있다고 말해요. Hansen 씨가 글을 쓰는 자리에 함께 있었기 때문에 겉으로는 좋은 말을 썼지만, \u003cb class=\"key\">선별된 \u003c/b>\u003cb class=\"key\">행\u003c/b>을 통해 속내가 드러난다는 반전을 준비하는 역할이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문과 한정 부사 only\u003c/span> : [동사원형 Read] + only + [목적어 lines] : \"오직 행들만 읽어주세요\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 for의 목적 용법과 전치사구 수식\u003c/span> : for + [my true opinion of him] = ~을 위해 : \"Hansen 씨에 대한 저의 진짜 생각을 아시려면\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"READ ONLY LINES, 오직 행들만 읽어주세요. 1,3,5, AND 7, 1, 3, 5, 그리고 7. FOR MY TRUE OPINION OF HIM, Hansen 씨에 대한 저의 진짜 생각을 아시려면. 이 문장 전체를 해석하면, Hansen 씨에 대한 저의 진짜 생각을 아시려면 1 , 3 , 5 , 7 행만 읽어주세요.","hl":"m"},{"n":40,"text":"여기서 핵심은 지점장이 추천장 전체가 아니라 선별된 행만 보라는 거죠. 그래서 진짜 의견이 숨어 있다는 반전을 준비하는 문장이에요.","hl":"mn"},{"n":41,"text":"문법 첫 번째로 READ ONLY LINES에서 Read는 명령문이라 동사원형으로 시작하고, only는 뒤의 목적어를 한정해서 오직 그 행들만이라는 뜻을 만들어요. 두 번째로 FOR MY TRUE OPINION OF HIM에서 for는 목적을 나타내고, of him은 opinion을 뒤에서 꾸미는 전치사구예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지점\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Branch \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">관리자\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">Manager\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">-지점장\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 비밀 쪽지의 마지막에 붙은 \u003cb class=\"key\">서명\u003c/b>으로, 앞의 지시가 지점장이 남긴 것임을 확인해 줘요. 짧은 직함이지만 추천장과 뒷면 쪽지를 하나의 사건으로 묶어 주는 마무리 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">복합명사(직함)\u003c/span> : [수식어 Branch] + [중심명사 Manager] : \"지점장\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"Branch, 지점. Manager, 관리자. 이 문장 전체를 해석하면, -지점장","hl":"m"},{"n":43,"text":"앞에서 길게 이어진 비밀 쪽지의 마지막에 붙는 서명이라서, 이 글을 쓴 사람이 지점장이라는 사실을 다시 확인해 주는 역할이에요.","hl":"mn"},{"n":44,"text":"Branch는 지점, Manager는 관리자라는 뜻이지만, 직함으로 붙으면 지점장으로 해석해요. 문법으로는 Branch가 Manager를 앞에서 꾸미는 복합명사이고, 이런 직함은 대문자로 시작해요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>추천서 본문은 Hansen을 열심히 일하고 시간을 낭비하지 않으며 제시간에 일을 마치는 \u003cb class=\"key\">최고의 \u003c/b>\u003cb class=\"key\">직원\u003c/b>으로 칭찬한다.\u003c/li>\u003cli>그러나 글 끝에는 추천서가 진짜 의견을 그대로 담지 못했음을 암시하는 \u003cb class=\"key\">두 \u003c/b>\u003cb class=\"key\">번째 \u003c/b>\u003cb class=\"key\">쪽지\u003c/b>가 붙어 있다.\u003c/li>\u003cli>쪽지는 Hansen이 옆에 있었기 때문에 쓴 글임을 밝히고, 자신의 진짜 생각은 \u003cb class=\"key\">특정 \u003c/b>\u003cb class=\"key\">행\u003c/b>만 읽으면 알 수 있다고 지시한다.\u003c/li>\u003cli>따라서 표면적으로 드러난 칭찬과 그 뒤에 숨은 \u003cb class=\"key\">숨은 \u003c/b>\u003cb class=\"key\">의도\u003c/b>를 구분하며 읽어야 한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Although the recommendation letter praises Mr. Hansen, the secret note suggests that the writer could not reveal his true opinion because Hansen was beside him and tells the reader to read only certain lines.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">겉으로는 Hansen을 최고의 직원으로 칭찬하는 \u003cb class=\"key\">추천서\u003c/b>이지만, 뒤에 붙은 \u003cb class=\"key\">두 \u003c/b>\u003cb class=\"key\">번째 \u003c/b>\u003cb class=\"key\">쪽지\u003c/b>는 그가 옆에 있었기에 진짜 의견을 숨겼음을 암시하며 특정 행만 읽으라고 말한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":45,"text":"오늘 글은 겉으로는 Hansen 씨를 칭찬하는 추천서처럼 보이지만, 뒤에 붙은 두 번째 쪽지가 진짜 의도를 숨기고 있음을 보여 줬어요. 추천서 본문의 긍정 평가와 쪽지의 지시를 구분해서 읽는 것이 핵심입니다. 시험에서는 마지막 전환 문장과 true opinion 같은 표현을 놓치지 말고, 표면적 의미와 숨은 의도를 함께 생각해 보세요. 오늘도 수고 많았고, 다음 강의에서 또 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
