<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SO 레벨1 18강 적용독해03 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}
.lp-top::before{height:5px;background:linear-gradient(90deg,var(--pk) 0,var(--pk) 80%,var(--am) 80%,var(--am) 100%)}
.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}
.lp-tag{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700;padding:2px 12px}
.lp-qn{flex:0 0 112px;height:112px;align-self:center;background:#fff;color:var(--pk);border:3px solid var(--pk);border-radius:50%;font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;font-size:26px}
.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}

.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}

.lp-sno .es{background:var(--am);border-radius:2px;font-weight:700}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"SO 레벨1 18강 적용독해03","audioDir":"18-03_audio","preview":false,"count":39,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">18강\u003cbr>적용독해03\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">SO 레벨1\u003c/div>\u003ch1>Why Do Mosquitoes Bite Some People More Than Others?\u003c/h1>\u003ch2>모기는 왜 어떤 사람을 다른 사람보다 더 많이 무는가?\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>모기가 어떤 사람을 더 많이 무는 것은 단지 운이 좋지 않아서가 아니라, 옷의 \u003cb class=\"key\">색깔\u003c/b>과 \u003cb class=\"key\">움직임\u003c/b>, 그리고 몸집에 따라 달라지는 \u003cb class=\"key\">이산화탄소\u003c/b> 배출량 때문이다. 그래서 밝은 색상의 옷을 입고 가능한 한 가만히 있으면 물릴 확률이 적다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Mosquitoes are attracted by color, movement, and the carbon dioxide we emit, so people who wear light clothing, keep still, and are smaller are less likely to be bitten.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"자, 여러분 안녕하세요. 오늘은 모기가 왜 어떤 사람은 많이 물고 어떤 사람은 덜 무는지에 대한 흥미로운 지문을 함께 읽어 볼 거예요. 이 글은 단지 운이 좋지 않아서가 아니라, 옷의 색깔과 움직임, 그리고 우리가 내뿜는 이산화탄소 때문에 그런 거라고 말하고 있죠. 핵심은 모기를 덜 끄는 조건이 무엇인지 잡아내는 거예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">모기는 사람의 체온과 냄새, 그리고 우리가 숨을 쉴 때 나오는 \u003cb class=\"key\">이산화탄소\u003c/b>(carbon dioxide)를 감지해 먹잇감을 찾습니다. 그래서 몸집이 크거나 많이 움직이는 사람은 자연스럽게 더 많은 이산화탄소와 냄새를 내뿜게 되고, 모기는 그쪽으로 더 강하게 이끌립니다. 또 모기는 \u003cb class=\"key\">어두운 \u003c/b>\u003cb class=\"key\">색\u003c/b>(dark color)과 \u003cb class=\"key\">움직이는 \u003c/b>\u003cb class=\"key\">물체\u003c/b>(movement)를 잘 알아보는 습성이 있어요. 이는 마치 어두운 옷을 입고 뛰어다니는 사람이 밝은 옷을 입고 가만히 서 있는 사람보다 훨씬 눈에 잘 띄는 것과 비슷합니다. 이 지문은 그런 생물학적 습성을 이용해 왜 어떤 사람이 더 자주 물리는지를 설명하고, 이를 일상에서 실천할 수 있는 행동 요령으로 연결하고 있습니다.\u003c/div>","segs":[{"n":2,"text":"모기는 사람의 체온과 냄새, 그리고 우리가 숨을 쉴 때 나오는 이산화탄소, 즉 carbon dioxide를 감지해서 먹잇감을 찾아요. 그래서 몸집이 크거나 많이 움직이는 사람은 자연스럽게 더 많은 이산화탄소와 냄새를 내뿜게 되고, 모기는 그쪽으로 더 강하게 이끌리죠. 또 모기는 어두운 색, dark color와 움직이는 물체, movement를 잘 알아보는 습성이 있어요. 이건 마치 어두운 옷을 입고 뛰어다니는 사람이 밝은 옷을 입고 가만히 서 있는 사람보다 훨씬 눈에 잘 띄는 것과 비슷해요. 이 지문은 그런 습성을 이용해서 왜 어떤 사람이 더 자주 물리는지를 설명하고, 마지막에는 일상에서 실천할 수 있는 행동 요령으로 연결하고 있습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>질문과 통념\u003csmall>도입·통념 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>글은 모기가 왜 어떤 사람을 다른 사람보다 더 많이 무는지 \u003cb class=\"key\">의문\u003c/b>을 던지며 시작한다. 이어서 그것이 단지 \u003cb class=\"key\">운\u003c/b>이 좋지 않아서가 아니라고 말하며 통념을 부정한다. 실제로 어떤 사람들이 다른 사람들에 비해 모기에게 \u003cb class=\"key\">매력적\u003c/b>이지 않은 흥미로운 이유가 있다고 주제를 제시한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>색깔과 움직임\u003csmall>근거 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>밝은 색상의 옷을 입고 가능한 한 가만히 있으면 \u003cb class=\"key\">물릴 \u003c/b>\u003cb class=\"key\">확률\u003c/b>이 적다고 설명한다. 그 까닭은 모기가 \u003cb class=\"key\">색깔\u003c/b>과 \u003cb class=\"key\">움직임\u003c/b>에 이끌리기 때문이며, 여기에 우리가 내뿜는 이산화탄소까지 더해진다고 밝힌다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>이산화탄소와 덩치\u003csmall>근거·예시 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>모기를 이끄는 요소인 \u003cb class=\"key\">이산화탄소\u003c/b>는 덩치가 클수록 더 많이 배출된다는 점을 든다. 그래서 이런 이유 때문에 \u003cb class=\"key\">여자\u003c/b>들이 대개 남자보다 덜 물린다는 구체적인 사례를 제시한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>재치 있는 조언\u003csmall>결론 · 문장 8–9\u003c/small>\u003c/h4>\u003cp>그러므로 밖에 나갈 때는 꼭 어두운 옷을 입고 많이 움직이는 \u003cb class=\"key\">덩치 \u003c/b>\u003cb class=\"key\">큰 \u003c/b>\u003cb class=\"key\">사람\u003c/b>을 부르라고 조언한다. 그가 모기를 대부분 끌어들일 것이라는 \u003cb class=\"key\">유머\u003c/b>로 글을 맺는다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 이제 글의 흐름을 처음부터 끝까지 따라가 볼게요.","hl":null},{"n":4,"text":"먼저 글은 모기가 왜 어떤 사람을 다른 사람보다 더 많이 무는지 의문을 던지며 시작해요. 그러면서 이건 단지 운이 좋지 않아서가 아니라고, 통념을 딱 잘라 부정하죠. 실제로 어떤 사람들이 다른 사람들에 비해 모기에게 매력적이지 않은 흥미로운 이유가 있다고 주제를 밝혀 줍니다.","hl":"f0"},{"n":5,"text":"그다음에는 근거가 이어져요. 밝은 색상의 옷을 입고 가능한 한 가만히 있으면 물릴 확률이 적다고 하죠. 왜냐하면 모기는 색깔과 움직임에 이끌리는데, 거기에 우리가 내뿜는 이산화탄소까지 더해지기 때문이에요.","hl":"f1"},{"n":6,"text":"여기서 덩치 이야기가 나옵니다. 모기를 이끄는 이산화탄소는 덩치가 클수록 더 많이 배출되니까, 이런 이유 때문에 여자들이 대개 남자보다 덜 물린다는 거죠.","hl":"f2"},{"n":7,"text":"마지막은 재치 있는 조언이에요. 밖에 나갈 때는 꼭 어두운 옷을 입고 많이 움직이는 덩치 큰 사람을 부르라고 합니다. 그가 모기를 대부분 끌어들일 거라는 유머로 글을 맺고 있어요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">질문-답변\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 3번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 왜 모기가 어떤 사람을 더 많이 무는지 \u003cb class=\"key\">질문\u003c/b>을 던지고, 곧바로 운이 아니라고 \u003cb class=\"key\">통념\u003c/b>을 부정한다. 세 번째 문장에서 흥미로운 \u003cb class=\"key\">이유\u003c/b>가 있다고 주제를 먼저 밝힌 뒤, 색깔과 움직임, 이산화탄소라는 근거를 차례로 제시한다. 마지막에는 그 근거를 생활 속 조언으로 재치 있게 적용하므로 \u003cb class=\"key\">질문-답변\u003c/b> 구조의 두괄식 글로 볼 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Why (1)\u003c/b>\u003cspan>질문 제기\u003c/span>\u003cb>not just (2)\u003c/b>\u003cspan>통념 부정\u003c/span>\u003cb>actually (3)\u003c/b>\u003cspan>주제 강조·전환\u003c/span>\u003cb>not only ... but also (5)\u003c/b>\u003cspan>정보 추가\u003c/span>\u003cb>the 비교급, the 비교급 (6)\u003c/b>\u003cspan>비례 관계\u003c/span>\u003cb>For this reason (7)\u003c/b>\u003cspan>인과 연결\u003c/span>\u003cb>So (8)\u003c/b>\u003cspan>결론 도출\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">attractive to mosquitoes\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">be attracted by\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">emit\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">give off\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">be likely to be bitten\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">get bitten\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>모기를 덜 끄는 사람\u003c/th>\u003cth>모기를 더 끄는 사람\u003c/th>\u003c/tr>\u003ctr>\u003ctd>밝은 색상의 옷을 입음\u003c/td>\u003ctd>어두운 옷을 입음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>가만히 있음\u003c/td>\u003ctd>많이 움직임\u003c/td>\u003c/tr>\u003ctr>\u003ctd>몸집이 작음(여성)\u003c/td>\u003ctd>덩치가 큼(남성)\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 질문-답변 구조이면서 두괄식으로 전개돼요. 첫 문장에서 질문을 던지고 바로 다음 문장에서 통념을 부정한 뒤, 세 번째 문장에서 흥미로운 이유가 있다고 주제를 먼저 제시하죠. 그다음 색깔과 움직임, 이산화탄소라는 근거를 차례로 붙여 나가고, 마지막에 그 근거를 생활 속 조언으로 적용합니다. 그래서 결론이 뒤에 있어도 중심 내용은 앞부분에 이미 나와 있는 두괄식 글로 보는 거예요.","hl":"ty"},{"n":9,"text":"신호어를 눈여겨보세요. Why로 질문을 열고, not just로 통념을 부정하고, actually로 주제를 강조하죠. 다섯 번째 문장에서는 not only A but also B로 정보를 하나 더 붙이고, 여섯 번째 문장에서는 the 비교급, the 비교급으로 덩치와 이산화탄소의 비례 관계를 보여 줍니다. 그리고 For this reason과 So가 인과와 결론을 이어 주고, emit과 give off처럼 같은 뜻을 바꿔 말한 재진술도 놓치지 마세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>bite\u003c/b>\u003cem>동사\u003c/em>\u003cspan>물다\u003c/span>\u003c/div>\u003cdiv>\u003cb>bad luck\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>운이 좋지 않음, 불운\u003c/span>\u003c/div>\u003cdiv>\u003cb>actually\u003c/b>\u003cem>부사\u003c/em>\u003cspan>실제로\u003c/span>\u003c/div>\u003cdiv>\u003cb>interesting\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>흥미로운\u003c/span>\u003c/div>\u003cdiv>\u003cb>reason\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이유\u003c/span>\u003c/div>\u003cdiv>\u003cb>attractive\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>매력적인, 끄는\u003c/span>\u003c/div>\u003cdiv>\u003cb>light clothing\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>밝은 색상의 옷\u003c/span>\u003c/div>\u003cdiv>\u003cb>keep still\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>가만히 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>as ... as possible\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>가능한 한 ~하게\u003c/span>\u003c/div>\u003cdiv>\u003cb>be likely to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~할 것 같다, ~할 확률이 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>be attracted by\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 이끌리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>not only A but also B\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>A뿐만 아니라 B도\u003c/span>\u003c/div>\u003cdiv>\u003cb>color\u003c/b>\u003cem>명사\u003c/em>\u003cspan>색깔\u003c/span>\u003c/div>\u003cdiv>\u003cb>movement\u003c/b>\u003cem>명사\u003c/em>\u003cspan>움직임\u003c/span>\u003c/div>\u003cdiv>\u003cb>carbon dioxide\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이산화탄소\u003c/span>\u003c/div>\u003cdiv>\u003cb>emit\u003c/b>\u003cem>동사\u003c/em>\u003cspan>내뿜다, 배출하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>obviously\u003c/b>\u003cem>부사\u003c/em>\u003cspan>확실히, 분명히\u003c/span>\u003c/div>\u003cdiv>\u003cb>the 비교급, the 비교급\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~할수록 더 ~하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>give off\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>배출하다, 내뿜다\u003c/span>\u003c/div>\u003cdiv>\u003cb>for this reason\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>이런 이유 때문에\u003c/span>\u003c/div>\u003cdiv>\u003cb>usually\u003c/b>\u003cem>부사\u003c/em>\u003cspan>대개, 보통\u003c/span>\u003c/div>\u003cdiv>\u003cb>get bitten\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>물리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>outdoors\u003c/b>\u003cem>부사\u003c/em>\u003cspan>밖에, 야외에서\u003c/span>\u003c/div>\u003cdiv>\u003cb>be sure to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>꼭 ~하도록 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>invite\u003c/b>\u003cem>동사\u003c/em>\u003cspan>부르다, 초대하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>large\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>덩치 큰\u003c/span>\u003c/div>\u003cdiv>\u003cb>move around\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>움직이다, 돌아다니다\u003c/span>\u003c/div>\u003cdiv>\u003cb>a lot\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>많이\u003c/span>\u003c/div>\u003cdiv>\u003cb>attract\u003c/b>\u003cem>동사\u003c/em>\u003cspan>끌어들이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>most\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>대부분의\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"먼저 attractive는 매력적인, 끄는이라는 뜻으로 모기가 사람에게 끌린다는 의미로 쓰였어요. emit은 내뿜다, 배출하다라는 뜻이고 give off도 같은 뜻으로 바꿔 쓴 표현입니다. keep still은 가만히 있다, as possible은 가능한 한이라는 뜻이니 함께 외워 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">attractive\u003c/b>\u003cspan class=\"m\">매력적인, 끄는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">appealing\u003c/span>\u003cspan class=\"s\">tempting\u003c/span>\u003cspan class=\"s\">inviting\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">repellent\u003c/span>\u003cspan class=\"a\">unattractive\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">reason\u003c/b>\u003cspan class=\"m\">이유\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">cause\u003c/span>\u003cspan class=\"s\">ground\u003c/span>\u003cspan class=\"s\">basis\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">emit\u003c/b>\u003cspan class=\"m\">내뿜다, 배출하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">give off\u003c/span>\u003cspan class=\"s\">release\u003c/span>\u003cspan class=\"s\">discharge\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">absorb\u003c/span>\u003cspan class=\"a\">take in\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">obviously\u003c/b>\u003cspan class=\"m\">확실히, 분명히\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">clearly\u003c/span>\u003cspan class=\"s\">evidently\u003c/span>\u003cspan class=\"s\">certainly\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">doubtfully\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">usually\u003c/b>\u003cspan class=\"m\">대개, 보통\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">gen ss=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">others\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">모기는 왜 어떤 사람을 다른 사람보다 더 많이 무는가?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 모기가 어떤 사람을 다른 사람보다 더 많이 무는 이유를 묻는 \u003cb class=\"key\">도입 \u003c/b>\u003cb class=\"key\">질문\u003c/b>이에요. 글의 \u003cb class=\"key\">주제\u003c/b>를 자연스럽게 꺼내는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문문의 Do-지원(조동사 do)\u003c/span> : Why + do + [주어] + [동사원형]? : \"모기가 무나요?\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">비교급 more ~ than\u003c/span> : [more] + [명사/부사] + than + [비교 대상] : \"다른 사람들보다 더 많이\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Why do, 왜 ~하나요. mosquitoes bite, 모기가 무나요. some people, 어떤 사람들을. more than others?, 다른 사람들보다 더. 이 문장 전체를 해석하면, 모기는 왜 어떤 사람을 다른 사람보다 더 많이 무는가?","hl":"m"},{"n":13,"text":"이 문장은 모기가 어떤 사람을 다른 사람보다 더 많이 무는 이유를 묻는 도입 질문이에요. 글의 주제를 자연스럽게 꺼내는 역할을 합니다.","hl":"mn"},{"n":14,"text":"첫 번째, Why do 뒤에는 주어 mosquitoes와 동사원형 bite가 오는 의문문 구조예요. 일반동사 의문문이라서 조동사 do가 주어 앞에 나오고 본동사는 동사원형 bite로 씁니다. 두 번째, more than others는 some people과 others를 비교하는 비교급 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 단지 ~이 아니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It's\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">just\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">운이 좋지 않은 것\u003c/span>\u003cspan class=\"en\">bad luck.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것은 단지 운이 좋지 않아서가 아니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞의 질문에 대해 단순한 \u003cb class=\"key\">운\u003c/b> 때문이 아니라고 못 박는 \u003cb class=\"key\">부정\u003c/b>의 문장이에요. 그래서 뒤에 구체적인 이유가 나올 것임을 알려 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">it is의 축약형\u003c/span> : [It is]의 축약: It's : \"그것은 ~이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부정어 not + 강조 부사 just\u003c/span> : not just + [명사] : \"단지 ~가 아니다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"It's not just, 그것은 단지 ~이 아니다. bad luck, 운이 좋지 않은 것. 이 문장 전체를 해석하면, 이것은 단지 운이 좋지 않아서가 아니다.","hl":"m"},{"n":16,"text":"이 문장은 앞의 질문에 대해 단순한 운 때문이 아니라고 못 박는 부정의 문장이에요. 그래서 뒤에 구체적인 이유가 나올 것임을 알려 줍니다.","hl":"mn"},{"n":17,"text":"첫 번째, It's는 It is의 축약형이에요. 주어 It은 앞의 상황 전체를 가리키는 비인칭 대명사로 볼 수 있습니다. 두 번째, not just는 부정어 not과 강조 부사 just가 만나 '단지 그런 것이 아니다'라는 부분 부정을 만드는 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~이 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">are\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">실제로\u003c/span>\u003cspan class=\"en\">actually\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몇 가지 흥미로운 이유가\u003c/span>\u003cspan class=\"en\">some interesting \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">reasons \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜 어떤 사람들은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">why\u003c/span> some people\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~만큼 매력적이지 않다\u003c/span>\u003cspan class=\"en\">are \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">attractive \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모기에게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">mosquitoes \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 사람들만큼\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">others\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">실제로 어떤 사람들이 다른 사람들에 비해 모기에게 매력적이지 않은 몇 가지 흥미로운 이유가 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 운이 아니라고 한 흐름을 이어 받아, 모기에게 덜 끌리는 데에는 실제로 \u003cb class=\"key\">이유\u003c/b>가 있음을 밝혀요. as attractive as 구조로 사람들 사이의 \u003cb class=\"key\">매력도 \u003c/b>\u003cb class=\"key\">차이\u003c/b>를 비교하며 구체적인 설명을 예고합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">There is/are 구문(유도부사)\u003c/span> : There + be동사 + [주어] ~ : \"~이 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관계부사 why\u003c/span> : [reason(s)] + why + [완전한 절] : \"~하는 이유\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">as ~ as 원급 비교의 부정\u003c/span> : not as + [형용사/부사] + as + [비교 대상] : \"다른 사람들만큼 모기에게 매력적이지 않은\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"There are, ~이 있다. actually, 실제로. some interesting reasons, 몇 가지 흥미로운 이유가. why some people, 왜 어떤 사람들은. are not as attractive, ~만큼 매력적이지 않다. to mosquitoes, 모기에게. as others, 다른 사람들만큼. 이 문장 전체를 해석하면, 실제로 어떤 사람들이 다른 사람들에 비해 모기에게 매력적이지 않은 몇 가지 흥미로운 이유가 있다.","hl":"m"},{"n":19,"text":"이 문장은 앞에서 운 때문이 아니라고 했던 흐름을 이어 받아, 모기에게 덜 끌리는 데에는 실제로 이유가 있다고 밝혀요. as attractive as 구조로 사람들 사이의 매력도 차이를 비교하면서, 뒤에 구체적인 설명이 나올 것을 예고합니다.","hl":"mn"},{"n":20,"text":"첫 번째, There are는 유도부사 there가 주어 앞에 와서 있다는 존재를 나타내는 구문이고, 진짜 주어는 뒤에 오는 복수명사 reasons라서 are를 씁니다. 두 번째, reasons why는 선행사 reasons를 받아 이유를 만드는 관계부사 why이며, why 뒤에는 완전한 절이 옵니다. 세 번째, not as attractive to mosquitoes as others는 as와 as 사이의 원급 attractive를 not으로 부정해 다른 사람들만큼 모기에게 매력적이지 않다는 비교를 나타냅니다. 여기서 to mosquitoes는 attractive의 대상이 되는 말이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 당신이 밝은 색상의 옷을 입는다면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">If \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">wear \u003c/span>\u003cspan class=\"tgt\">light \u003c/span>\u003cspan class=\"tgt\">clothing \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 가능한 한 가만히 있는다면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">keep \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">still \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">possible,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 더 적은 가능성이 있다\u003c/span>\u003cspan class=\"en\">you \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">less \u003c/span>\u003cspan class=\"tgt\">likely \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">물릴\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">bitten\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">밝은 색상의 옷을 입고 있고, 가능한 한 가만히 있으면, 물릴 확률이 적다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 모기를 덜 물리는 실전 방법을 알려 주는 문장이에요. 밝은 색 옷을 입고 가만히 있으면 \u003cb class=\"key\">물릴 \u003c/b>\u003cb class=\"key\">가능성\u003c/b>이 낮아진다고 두 가지 \u003cb class=\"key\">조건\u003c/b>을 제시하죠. 뒤에 나올 색깔과 움직임 설명을 행동 지침으로 미리 보여 주는 역할도 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조건의 부사절 접속사 if\u003c/span> : If + [주어] + [동사] , [주어] + [동사] : \"만약 네가 밝은 색상의 옷을 입고 가능한 한 가만히 있으면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">원급 비교 (as ~ as possible)\u003c/span> : as + [형용사/부사] + as possible : \"가능한 한 가만히\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">비교급 + to부정사 / 수동태 부정사\u003c/span> : be less likely + to be p.p. : \"물릴 가능성이 더 적다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"If you wear light clothing, 만약 당신이 밝은 색상의 옷을 입는다면. and keep as still as possible, 그리고 가능한 한 가만히 있는다면. you are less likely, 당신은 더 적은 가능성이 있다. to be bitten, 물릴. 이 문장 전체를 해석하면, 밝은 색상의 옷을 입고 있고, 가능한 한 가만히 있으면, 물릴 확률이 적다.","hl":"m"},{"n":22,"text":"이 문장은 모기를 덜 물리는 방법을 알려 주는 부분이에요. 밝은 색 옷을 입고 가만히 있는 두 가지 조건을 제시하면서 물릴 가능성이 낮아진다고 말하고 있죠. 뒤에서 색깔과 움직임이 모기를 부른다고 설명할 내용을 행동 지침으로 미리 보여 주는 셈이에요.","hl":"mn"},{"n":23,"text":"먼저 If you wear light clothing에서 if는 조건의 부사절을 이끄는 접속사예요. if절 안에서는 앞으로의 일이라도 현재 시제로 쓴다는 점을 꼭 기억해 두세요. 두 번째로 as still as possible은 as와 as 사이에 형용사 still을 넣은 원급 비교로, 가능한 한 가만히라는 뜻이 돼요. 마지막으로 are less likely to be bitten에서 be likely to는 할 가능성이 있다는 뜻이고 여기에 less가 붙어 비교급이 되었어요. 뒤의 to be bitten은 수동태 부정사로 물리다는 의미를 담고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모기는 이끌린다\u003c/span>\u003cspan class=\"en\">Mosquitoes \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">attracted\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">색깔과 움직임뿐만 아니라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">only \u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">color \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">movement, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그뿐만 아니라 이산화탄소에 의해서도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">but \u003c/span>\u003cspan class=\"tgt\">also \u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">carbon \u003c/span>\u003cspan class=\"tgt\">dioxide \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 내뿜는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">emit\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">모기는 색깔과 움직임뿐만 아니라 우리가 내뿜는 이산화탄소에 이끌린다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 모기를 부르는 요인이 색깔과 움직임만이 아니라는 점을 밝히는 문장이에요. 우리가 내뿜는 \u003cb class=\"key\">이산화탄소\u003c/b>도 모기를 \u003cb class=\"key\">유인\u003c/b>한다는 것이 핵심이죠. 이 내용이 다음 문장의 덩치 이야기로 자연스럽게 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태 (be + 과거분사)\u003c/span> : [주어] + be + p.p. (+ by [행위자]) : \"이끌린다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">상관접속사 not only A but also B\u003c/span> : not only + [A] + but also + [B] : \"색깔과 움직임뿐만 아니라 이산화탄소에 의해서도\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 생략\u003c/span> : [선행사] + (which/that) + [주어] + [동사] : \"우리가 내뿜는 이산화탄소\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Mosquitoes are attracted, 모기는 이끌린다. not only by color and movement, 색깔과 움직임뿐만 아니라. but also by the carbon dioxide, 그뿐만 아니라 이산화탄소에 의해서도. we emit, 우리가 내뿜는. 이 문장 전체를 해석하면, 모기는 색깔과 움직임뿐만 아니라 우리가 내뿜는 이산화탄소에 이끌린다.","hl":"m"},{"n":25,"text":"모기를 부르는 요인이 색깔과 움직임만이 아니라는 걸 알려 주는 문장이에요. 우리가 내뿜는 이산화탄소도 모기를 유인한다는 점이 핵심이죠. 이 내용이 다음 문장의 덩치 이야기로 자연스럽게 이어집니다.","hl":"mn"},{"n":26,"text":"첫 번째로 are attracted는 be동사에 과거분사가 붙은 수동태예요. 모기는 우리를 끄는 쪽이 아니라 끌리는 쪽이니까 수동태로 쓴 겁니다. 두 번째로 not only by color and movement, but also by the carbon dioxide는 색깔과 움직임뿐만 아니라 이산화탄소에 의해서도라는 뜻의 상관접속사 구조예요. 세 번째로 the carbon dioxide we emit에서는 목적격 관계대명사 which가 생략되어 우리가 내뿜는 이산화탄소로 해석됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">확실히\u003c/span>\u003cspan class=\"en\">Obviously,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 덩치가 클수록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">bigger \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">are\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 많은 이산화탄소를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">carbon \u003c/span>\u003cspan class=\"tgt\">dioxide \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 배출한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">give \u003c/span>\u003cspan class=\"tgt\">off\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">확실히 덩치가 클수록, 더 많은 이산화탄소를 배출한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 몸집이 클수록 \u003cb class=\"key\">이산화탄소\u003c/b>를 더 많이 내뿜는다는 사실을 말하는 문장이에요. 앞 문장의 이산화탄소 이야기를 \u003cb class=\"key\">덩치\u003c/b>와 연결 지어 설명하는 거죠. 그래서 다음 문장에서 여성이 남성보다 덜 물린다는 결론이 나옵니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">the 비교급, the 비교급 (전반부)\u003c/span> : The + [비교급] + [주어] + [동사] , the + [비교급] + [주어] + [동사] : \"당신이 덩치가 클수록\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">목적어 도치 (비교급 + 명사)\u003c/span> : the + [비교급] + [명사] + [주어] + [동사] : \"더 많은 이산화탄소를 배출한다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Obviously, 확실히. the bigger you are, 당신이 덩치가 클수록. the more carbon dioxide, 더 많은 이산화탄소를. you give off, 당신은 배출한다. 이 문장 전체를 해석하면, 확실히 덩치가 클수록, 더 많은 이산화탄소를 배출한다.","hl":"m"},{"n":28,"text":"몸집이 클수록 이산화탄소를 더 많이 내뿜는다는 사실을 말하는 문장이에요. 앞 문장의 이산화탄소 이야기를 덩치와 연결 지어 설명하는 거죠. 그래서 다음 문장에서 여성이 남성보다 덜 물린다는 결론이 자연스럽게 따라옵니다.","hl":"mn"},{"n":29,"text":"첫 번째로 the bigger you are는 the 비교급, the 비교급 구문의 앞부분이에요. the 뒤에 비교급을 두고 주어와 동사를 이어서 덩치가 클수록이라는 뜻을 만들어요. 두 번째로 the more carbon dioxide you give off에서는 the more carbon dioxide라는 목적어가 문장 앞으로 나왔어요. 원래 어순은 you give off more carbon dioxide이고, 비교급 덩어리를 강조하려고 앞으로 끌어올린 겁니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이런 이유 때문에\u003c/span>\u003cspan class=\"en\">For this reason,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여자들이 대개 물린다\u003c/span>\u003cspan class=\"en\">women usually \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">get \u003c/span>\u003cspan class=\"tgt\">bitten\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">남자보다 덜 자주\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">less \u003c/span>\u003cspan class=\"tgt\">often \u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">men\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이런 이유 때문에 여자들이 대개 남자보다 덜 물린다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 덩치가 클수록 이산화탄소를 많이 배출한다고 했으니, 그 \u003cb class=\"key\">결과\u003c/b>로 여성이 남성보다 모기에 덜 물린다는 \u003cb class=\"key\">일반화\u003c/b>를 제시하는 문장이에요. 'get bitten'은 '물리다'라는 \u003cb class=\"key\">수동\u003c/b> 표현이고, 'less often than'은 '~보다 덜 자주'라는 비교 표현이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">get + 과거분사 (수동태)\u003c/span> : [get (수동 조동사 역할)] + [bitten (과거분사)] : \"물리다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">비교급 표현 (less + 부사 + than)\u003c/span> : [less + often (비교급 부사구)] + [than men (비교 대상)] : \"남자보다 덜 자주\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"For this reason, 이런 이유 때문에. women usually get bitten, 여자들이 대개 물린다. less often than men, 남자보다 덜 자주. 이 문장 전체를 해석하면, 이런 이유 때문에 여자들이 대개 남자보다 덜 물린다.","hl":"m"},{"n":31,"text":"앞에서 덩치가 클수록 이산화탄소를 많이 내뿜는다고 했죠. 그 결과로 여성들이 남성보다 모기에 덜 물린다는 걸 일반화해서 말하는 문장이에요. 글의 흐름에서 '그래서 결론적으로 이렇다'를 정리해 주는 역할이니까 앞 문장과 연결해서 기억해 두세요.","hl":"mn"},{"n":32,"text":"첫 번째, get bitten에서 get은 과거분사 bitten과 만나 수동의 뜻을 만들어요. 그래서 '물리다'로 해석하는 겁니다. 두 번째, less often than men은 비교급 표현으로 '남자보다 덜 자주'라는 뜻이에요. 결과와 수동, 그리고 비교급 이 세 가지만 잡으면 해석이 아주 깔끔해집니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러므로\u003c/span>\u003cspan class=\"en\">So,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">밖에 나갈 때는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">going \u003c/span>\u003cspan class=\"tgt\">outdoors\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">꼭 덩치 큰 사람을 부르도록 하라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">sure \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">invite\u003c/span> a large man\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어두운 옷을 입고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">wears \u003c/span>\u003cspan class=\"tgt\">dark \u003c/span>\u003cspan class=\"tgt\">clothes \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많이 움직이는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">moves \u003c/span>\u003cspan class=\"tgt\">around \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">lot\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러므로 밖에 나갈 때는 꼭 어두운 옷을 입고 많이 움직이는 덩치 큰 사람을 부르도록 하라.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 밝은 옷을 입고 가만히 있으면 덜 물린다고 했으니, 그 반대로 하면 어떻게 되는지 \u003cb class=\"key\">위트\u003c/b> 있게 뒤집어 말하는 문장이에요. 'be sure to'는 '반드시 ~하라'라는 \u003cb class=\"key\">강조\u003c/b>의 명령 표현이고, who절은 '어두운 옷을 입고 많이 움직이는'이라는 \u003cb class=\"key\">관계대명사\u003c/b> 수식이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간 부사절 (접속사 when)\u003c/span> : [when + 주어 + 동사 (시간 부사절)] , [주절 (명령문)] : \"밖에 나갈 때는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be sure to부정사 (강조 명령)\u003c/span> : [be sure] + [to invite (to부정사)] : \"반드시 부르도록 하라\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 + 병렬\u003c/span> : [선행사 a large man] + [who (주격 관계대명사)] + [wears ~] and [moves ~] : \"어두운 옷을 입고 많이 움직이는\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"So, 그러므로. when you are going outdoors, 밖에 나갈 때는. be sure to invite a large man, 꼭 덩치 큰 사람을 부르도록 하라. who wears dark clothes, 어두운 옷을 입고. and moves around a lot, 많이 움직이는. 이 문장 전체를 해석하면, 그러므로 밖에 나갈 때는 꼭 어두운 옷을 입고 많이 움직이는 덩치 큰 사람을 부르도록 하라.","hl":"m"},{"n":34,"text":"앞에서 밝은 옷을 입고 가만히 있으면 덜 물린다고 했죠. 그걸 그대로 뒤집어서, 반대로 하면 큰 덩치가 대신 물릴 거라는 재미있는 위트로 연결하는 문장이에요. 그래서 이 문장은 글의 결론을 향한 핵심 문장이니까 서술형으로도 충분히 나올 수 있습니다.","hl":"mn"},{"n":35,"text":"첫 번째, when you are going outdoors는 시간을 나타내는 부사절이에요. 그래서 뒤에 오는 명령문과 함께 '밖에 나갈 때는 이렇게 하라'로 해석합니다. 두 번째, be sure to invite는 be sure to 부정사로 '반드시 ~하도록 하라'라는 강조 명령 표현이고, 그래서 동사원형 invite가 온 거예요. 세 번째, who wears dark clothes and moves around a lot에서 who는 a large man을 받는 주격 관계대명사이고, wears와 moves가 and로 병렬 연결되어 있으니까 두 동작을 나란히 이어서 해석하면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그가 끌어들일 것이다\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">attract\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모기를 대부분\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">most \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">mosquitoes\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그가 모기를 대부분 끌어들일 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 추천한 덩치 크고 어두운 옷을 입고 많이 움직이는 남자가 결국 모기를 대신 끌어들일 거라는 \u003cb class=\"key\">유머\u003c/b>로 글을 마무리하는 문장이에요. 'most of the mosquitoes'의 most는 \u003cb class=\"key\">최상급\u003c/b>이 아니라 '대부분'이라는 뜻으로, of 뒤에 복수명사가 오는 \u003cb class=\"key\">수량 \u003c/b>\u003cb class=\"key\">표현\u003c/b>이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 will (미래·추측)\u003c/span> : [will (조동사)] + [attract (동사원형)] : \"끌어들일 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">most of + 복수명사 (수량 표현)\u003c/span> : [most of] + [the mosquitoes (한정사 + 복수명사)] : \"모기를 대부분\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"He will attract, 그가 끌어들일 것이다. most of the mosquitoes!, 모기를 대부분. 이 문장 전체를 해석하면, 그가 모기를 대부분 끌어들일 것이다.","hl":"m"},{"n":37,"text":"앞에서 추천한 덩치 크고 어두운 옷을 입고 많이 움직이는 남자가 결국 모기를 대신 끌어들일 거라는 유머로 글을 마무리하는 문장이에요. 앞 문장의 명령과 자연스럽게 이어지니까 글의 결론 역할을 한다고 기억해 두면 됩니다.","hl":"mn"},{"n":38,"text":"첫 번째, will attract에서 will은 조동사라서 뒤에 동사원형 attract가 왔어요. 그래서 '끌어들일 것이다'라는 추측의 뜻이 됩니다. 두 번째, most of the mosquitoes에서 most는 최상급이 아니라 '대부분'이라는 수량 표현이에요. 정관사 the가 붙은 복수명사 앞에서는 most of 형태로 쓰는 것, 꼭 구별해 두세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>모기가 어떤 사람을 더 많이 무는 것은 단지 \u003cb class=\"key\">운\u003c/b>이 좋지 않아서가 아니라 실제로 흥미로운 이유가 있다.\u003c/li>\u003cli>모기는 \u003cb class=\"key\">색깔\u003c/b>과 \u003cb class=\"key\">움직임\u003c/b>에 이끌리기 때문에 밝은 색상의 옷을 입고 가능한 한 가만히 있으면 물릴 확률이 적다.\u003c/li>\u003cli>모기는 우리가 내뿜는 \u003cb class=\"key\">이산화탄소\u003c/b>에도 이끌리며, 덩치가 클수록 더 많이 배출하므로 여자들이 대개 남자보다 덜 물린다.\u003c/li>\u003cli>그래서 밖에 나갈 때는 어두운 옷을 입고 많이 움직이는 \u003cb class=\"key\">덩치 \u003c/b>\u003cb class=\"key\">큰 \u003c/b>\u003cb class=\"key\">사람\u003c/b>을 부르면 그가 모기를 대부분 끌어들일 것이다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Mosquitoes are attracted by color, movement, and the carbon dioxide we emit, so people who wear light clothing, keep still, and are smaller are less likely to be bitten.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">모기가 어떤 사람을 더 많이 무는 것은 단지 운이 좋지 않아서가 아니라, 옷의 \u003cb class=\"key\">색깔\u003c/b>과 \u003cb class=\"key\">움직임\u003c/b>, 그리고 몸집에 따라 달라지는 \u003cb class=\"key\">이산화탄소\u003c/b> 배출량 때문이다. 그래서 밝은 색상의 옷을 입고 가능한 한 가만히 있으면 물릴 확률이 적다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":39,"text":"정리해 볼게요. 모기가 사람을 무는 정도는 운이 아니라 색깔과 움직임, 그리고 이산화탄소 배출량이 만드는 차이예요. 밝은 옷을 입고 가만히 있고 몸집이 작을수록 모기에게 덜 매력적이라는 점, 꼭 기억해 두세요. 오늘 수업도 끝까지 잘 따라와 줘서 고마워요. 다음 시간에 또 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
