<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SO 레벨1 5강 적용독해02 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-chips .x{background:none;color:#999;padding:0}
.lp-sno{font-size:13px;color:#8493A1;font-weight:700;margin-bottom:8px}

.lp-chunk{display:flex;flex-direction:column}
.lp-chunk .ko{font-size:13px;color:var(--pk-t);font-weight:700;line-height:1.3;margin-bottom:2px}
.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}
.lp-top::before{height:5px;background:linear-gradient(90deg,var(--pk) 0,var(--pk) 80%,var(--am) 80%,var(--am) 100%)}
.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}
.lp-tag{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700;padding:2px 12px}
.lp-qn{flex:0 0 112px;height:112px;align-self:center;background:#fff;color:var(--pk);border:3px solid var(--pk);border-radius:50%;font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;font-size:26px}
.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}
.lp-qn .qt{display:block;white-space:nowrap;line-height:1.12;letter-spacing:-.02em}
.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}

.lp-st h4{color:var(--ink,#1B2733)}
.lp-st h4 i{border-radius:4px;width:auto;min-width:24px;padding:0 4px}
.lp-pill{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700}
.lp-chain span.c{background:#fff;border:1px solid #AEBBE6;border-radius:3px;font-weight:600}
.lp-ct th{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif}
.lp-vg em{background:#fff;border:1px solid var(--pk-b);border-radius:3px}
.lp-sa>div{border-radius:4px;border-color:var(--pk-b)}

.lp-chips .s{border:1px solid #AEBBE6;color:#3A4FA3}
.lp-chips .a{border:1px solid var(--am-b);color:var(--am-d);background:#FFFBF2}
.lp-sno .es{background:var(--am);border-radius:2px;font-weight:700}
.lp-chunk .en{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:600}
.lp-chunk+.lp-chunk{border-left:1px solid var(--pk-b)}
.lp .tgt{background:var(--am-l);border-bottom:2.5px dotted var(--am)}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"SO 레벨1 5강 적용독해02","audioDir":"5-02_audio","preview":false,"count":34,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">5강\u003cbr>적용독해02\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">SO 레벨1\u003c/div>\u003ch1>The Ocean: A Treasure Chest of New Medicines\u003c/h1>\u003ch2>바다, 신약이 숨은 보물 상자\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>인류는 \u003cb class=\"key\">신약\u003c/b>을 찾아 육지를 사실상 다 뒤진 뒤, 탐색의 무대를 \u003cb class=\"key\">대양\u003c/b>으로 옮겼다. 심해 생물에서 얻은 \u003cb class=\"key\">화학물질\u003c/b>이 새로운 의약품으로 전환될 수 있다는 기대가 커지고 있다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Drug hunters who have searched dry land everywhere have now turned to the oceans, where special chemicals from marine creatures are expected to become new kinds of medicine.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 신약을 찾아 나선 사람들이 육지를 넘어 바다로 눈을 돌리게 된 이야기예요. 지난 세기 초 Alexander Fleming 이 페니실린을 발견한 사건에서 시작해서, 지금은 바다가 약의 보물 상자로 주목받고 있다는 내용이죠. 요약하면 인류가 신약을 찾아 육지를 다 뒤진 뒤 대양으로 탐색의 무대를 옮겼고, 심해 생물의 화학물질이 새로운 의약품이 될 것으로 기대된다는 겁니다. 그럼 지문을 한 문장씩 따라가 볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">지난 세기 초 알렉산더 플레밍이 페니실린을 발견한 뒤, 인류는 \u003cb class=\"key\">항생제\u003c/b>의 시대를 열었습니다. 하지만 박테리아는 시간이 지나면 약에 적응해 \u003cb class=\"key\">내성\u003c/b>을 갖기 때문에, 인류는 계속해서 새로운 약을 개발해야 합니다. 그래서 연구자들은 토양 미생물, 식물, 곰팡이 같은 \u003cb class=\"key\">육지\u003c/b> 자원을 샅샅이 뒤졌고, 이제는 그 한계에 부딪혔습니다. 바다는 아직 손대지 않은 거대한 보고로, 해면·산호·심해 무척추동물 같은 \u003cb class=\"key\">해양 \u003c/b>\u003cb class=\"key\">생물\u003c/b>은 자신을 보호하려고 독특한 화학물질을 만들어 냅니다. 이런 화학물질을 의약품으로 바꾸는 분야를 \u003cb class=\"key\">해양 \u003c/b>\u003cb class=\"key\">천연물\u003c/b> 연구, 영어로 marine natural products 라고 부릅니다. 육지라는 도서관은 책을 거의 다 읽었지만, 바다 도서관은 아직 문조차 열지 않은 셈이죠.\u003c/div>","segs":[{"n":2,"text":"배경부터 짚고 갈게요. Alexander Fleming 이 페니실린을 발견한 뒤 인류는 항생제의 시대를 열었습니다. 그런데 박테리아는 시간이 지나면 약에 적응해서 내성을 갖기 때문에, 우리는 계속 새로운 약을 만들어야 하죠. 그래서 연구자들이 토양 미생물이나 식물 같은 육지 자원을 샅샅이 뒤졌지만 이제는 거의 한계에 다다랐어요. 반면 바다는 아직 손대지 않은 거대한 보고입니다. 해면이나 산호, 심해 무척추동물 같은 해양 생물은 자신을 보호하려고 독특한 화학물질을 만들어 내거든요. 이런 걸 해양 천연물, 영어로 marine natural products 라고 부르는데, 육지 도서관은 책을 다 읽었지만 바다 도서관은 아직 문조차 열지 않은 셈이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>페니실린의 발견\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>1928년 알렉산더 플레밍이 \u003cb class=\"key\">페니실린\u003c/b>이 박테리아를 죽인다는 중요한 발견을 했습니다. 그 이후로 전 세계의 \u003cb class=\"key\">의학 \u003c/b>\u003cb class=\"key\">연구자\u003c/b>들은 새로운 종류의 의약품을 끊임없이 찾아왔습니다. 이 두 문장이 글 전체의 출발점입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>육지의 한계\u003csmall>전환 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>연구자들은 육지의 \u003cb class=\"key\">모든 \u003c/b>\u003cb class=\"key\">곳\u003c/b>을 사실상 다 뒤져 보았습니다. 더 이상 남은 곳이 없다고 판단한 약 사냥꾼들은 이제 지구의 \u003cb class=\"key\">대양\u003c/b>으로 관심을 돌렸습니다. 화제가 육지에서 바다로 넘어가는 결정적인 대목입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>바다라는 보고\u003csmall>주장 · 문장 5\u003c/small>\u003c/h4>\u003cp>바다야말로 발견되기를 기다리는 약으로 가득 찬 \u003cb class=\"key\">보물 \u003c/b>\u003cb class=\"key\">상자\u003c/b>라고 믿는 이들이 있다고 말합니다. 여기서 글의 \u003cb class=\"key\">주제\u003c/b>가 분명하게 드러납니다. 앞의 배경과 전환을 한데 묶어 주는 문장입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>전문가의 설명\u003csmall>근거 · 문장 6\u003c/small>\u003c/h4>\u003cp>해양 화학자 윌리엄 페니컬은 특별한 \u003cb class=\"key\">화학물질\u003c/b>이 바다 \u003cb class=\"key\">표면\u003c/b> 아래 깊은 곳에 사는 해양 생물로부터 개발되어 왔다고 설명합니다. 심해 생물이 실제로 약의 재료를 준다는 \u003cb class=\"key\">전문가 \u003c/b>\u003cb class=\"key\">근거\u003c/b>가 제시된 것입니다. 앞의 주장을 뒷받침하는 역할을 합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>미래에 대한 기대\u003csmall>결론 · 문장 7\u003c/small>\u003c/h4>\u003cp>과학자들이 이 화학물질의 \u003cb class=\"key\">작용 \u003c/b>\u003cb class=\"key\">방식\u003c/b>을 더 많이 알게 될수록, 그것을 \u003cb class=\"key\">신종 \u003c/b>\u003cb class=\"key\">의약품\u003c/b>으로 전환할 수 있으리라는 기대가 커집니다. 아직 실현되지 않은 미래의 가능성으로 글을 맺고 있습니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 과거에서 현재로 시간을 따라가면서 신약 탐색의 무대가 육지에서 바다로 옮겨 가는 과정을 보여 줍니다.","hl":null},{"n":4,"text":"첫 번째 단계는 도입이에요. 지난 세기 초에 Alexander Fleming 이 페니실린이 박테리아를 죽인다는 중요한 발견을 했죠. 그 이후로 전 세계의 의학 연구자들은 새로운 종류의 의약품을 계속 찾아왔습니다.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 전환이 일어납니다. 연구자들은 육지의 사실상 모든 곳을 다 뒤져 보았어요. 더 뒤질 곳이 없다는 걸 안 약 사냥꾼들은 이제 지구의 대양으로 눈을 돌렸습니다.","hl":"f1"},{"n":6,"text":"세 번째 단계에서 글의 주제가 나옵니다. 바다야말로 발견되기를 기다리는 약으로 가득 찬 보물 상자라고 믿는 사람들이 있다는 거죠. 여기서 ocean 이 곧 medicine 의 보고라는 주장이 분명해집니다.","hl":"f2"},{"n":7,"text":"네 번째 단계는 근거를 대는 부분이에요. 해양 화학자 William Fenical 은 특별한 화학물질이 바다 표면 아래 깊은 곳에 사는 해양 생물로부터 개발되어 왔다고 설명합니다. 심해 생물이 실제로 약의 재료를 준다는 전문가의 증언인 셈이죠.","hl":"f3"},{"n":8,"text":"마지막 단계는 결론입니다. 과학자들이 이 화학물질이 어떻게 작용하는지를 더 많이 알게 될수록, 그것을 신종 의약품으로 전환할 수 있으리라는 기대가 커져요. 그래서 이 글은 바다가 미래의 약창고라는 희망으로 끝납니다.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결(시간순 전개)\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 5번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 페니실린 발견이라는 \u003cb class=\"key\">과거\u003c/b> 사건을 제시하며 신약이 계속 필요하다는 \u003cb class=\"key\">문제\u003c/b>를 깔아 둡니다. 육지를 다 뒤졌다는 \u003cb class=\"key\">한계\u003c/b>를 밝힌 뒤 대양으로 눈을 돌렸다는 \u003cb class=\"key\">해결\u003c/b>의 전환을 보여 주죠. 주제문인 다섯 번째 문장 뒤에 해양 화학자의 발언과 기대가 이어지므로 \u003cb class=\"key\">미괄식\u003c/b>으로 볼 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Since that time (2)\u003c/b>\u003cspan>시간 연결(과거에서 현재로)\u003c/span>\u003cb>Now (4)\u003c/b>\u003cspan>화제 전환 표시\u003c/span>\u003cb>In fact (5)\u003c/b>\u003cspan>주장 강조·부연\u003c/span>\u003cb>As (7)\u003c/b>\u003cspan>비례·조건의 연결\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">medical researchers\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">drug hunters\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">new kinds of drugs\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">medicine\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">new kinds of medicine\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Dry Land (육지)\u003c/th>\u003cth>Oceans (대양)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>이미 샅샅이 탐색되어 한계에 이름\u003c/td>\u003ctd>아직 미개척 상태로 남아 있음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>새로운 약을 찾기 어려움\u003c/td>\u003ctd>약으로 가득 찬 보물 상자로 여겨짐\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"구조부터 볼게요. 이 글은 신약이 필요하다는 문제를 던지고, 육지의 한계를 밝힌 다음 바다라는 해결책을 제시하는 문제와 해결의 구조예요. 동시에 지난 세기 초에서 현재로 흐르는 시간순 전개를 따르고 있죠. 주제문이 다섯 번째 문장에 놓여 있으니 미괄식이라고 정리하면 됩니다.","hl":"ty"},{"n":10,"text":"신호어를 짚어 볼게요. Since that time 은 과거에서 현재로 시간을 이어 주고, Now 는 화제가 바다로 넘어가는 전환을 알려 줍니다. In fact 는 바다가 약의 보물 상자라는 주장을 강조해서 받쳐 주고, As 는 배우면 배울수록 기대가 커진다는 비례의 의미를 담고 있어요. 또 new kinds of drugs 가 medicine 으로, dry land 가 oceans 로 바뀌어 표현되는 재진술과 대조도 꼭 표시해 두세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>make a discovery\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>발견하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>important\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>중요한\u003c/span>\u003c/div>\u003cdiv>\u003cb>bacteria\u003c/b>\u003cem>명사\u003c/em>\u003cspan>박테리아(복수형)\u003c/span>\u003c/div>\u003cdiv>\u003cb>since that time\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>그 이후로\u003c/span>\u003c/div>\u003cdiv>\u003cb>medical\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>의학의\u003c/span>\u003c/div>\u003cdiv>\u003cb>researcher\u003c/b>\u003cem>명사\u003c/em>\u003cspan>연구자\u003c/span>\u003c/div>\u003cdiv>\u003cb>around the globe\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>전 세계에서\u003c/span>\u003c/div>\u003cdiv>\u003cb>look for\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>찾다\u003c/span>\u003c/div>\u003cdiv>\u003cb>virtually\u003c/b>\u003cem>부사\u003c/em>\u003cspan>사실상, 거의\u003c/span>\u003c/div>\u003cdiv>\u003cb>dry land\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>육지\u003c/span>\u003c/div>\u003cdiv>\u003cb>turn to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 관심을 돌리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>in fact\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>사실은\u003c/span>\u003c/div>\u003cdiv>\u003cb>treasure chest\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>보물 상자\u003c/span>\u003c/div>\u003cdiv>\u003cb>be full of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 가득 차다\u003c/span>\u003c/div>\u003cdiv>\u003cb>medicine\u003c/b>\u003cem>명사\u003c/em>\u003cspan>의약품, 약\u003c/span>\u003c/div>\u003cdiv>\u003cb>wait to be discovered\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>발견되기를 기다리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>marine\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>바다의, 해양의\u003c/span>\u003c/div>\u003cdiv>\u003cb>chemist\u003c/b>\u003cem>명사\u003c/em>\u003cspan>화학자\u003c/span>\u003c/div>\u003cdiv>\u003cb>explain\u003c/b>\u003cem>동사\u003c/em>\u003cspan>설명하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>chemical\u003c/b>\u003cem>명사\u003c/em>\u003cspan>화학물질\u003c/span>\u003c/div>\u003cdiv>\u003cb>develop\u003c/b>\u003cem>동사\u003c/em>\u003cspan>개발하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>creature\u003c/b>\u003cem>명사\u003c/em>\u003cspan>생물\u003c/span>\u003c/div>\u003cdiv>\u003cb>surface\u003c/b>\u003cem>명사\u003c/em>\u003cspan>표면\u003c/span>\u003c/div>\u003cdiv>\u003cb>function\u003c/b>\u003cem>동사\u003c/em>\u003cspan>작용하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>convert A into B\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>A를 B로 전환하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>it is hoped that\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~가 기대된다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"단어 몇 개만 짚을게요. virtually 는 사실상, 거의라는 뜻으로 virtually everywhere 처럼 쓰입니다. turn to 는 시선이나 관심을 다른 곳으로 돌린다는 뜻이고, convert A into B 는 A 를 B 로 전환한다는 숙어예요. discovery 와 develop 처럼 명사형과 동사형을 함께 외워 두면 좋습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">important\u003c/b>\u003cspan class=\"m\">중요한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">significant\u003c/span>\u003cspan class=\"s\">crucial\u003c/span>\u003cspan class=\"s\">essential\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">trivial\u003c/span>\u003cspan class=\"a\">minor\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">discovery\u003c/b>\u003cspan class=\"m\">발견\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">finding\u003c/span>\u003cspan class=\"s\">detection\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">loss\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">virtually\u003c/b>\u003cspan class=\"m\">사실상\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">practically\u003c/span>\u003cspan class=\"s\">almost\u003c/span>\u003cspan class=\"s\">nearly\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">exactly\u003c/span>\u003cspan class=\"a\">precisely\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">look for\u003c/b>\u003cspan class=\"m\">찾다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">seek\u003c/span>\u003cspan class=\"s\">search for\u003c/span>\u003cspan class=\"s\">hunt for\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003cspan class=\"a\">overlook\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">marine\u003c/b>\u003cspan class=\"m\">바다의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">oceanic\u003c/span>\u003cspan class=\"s\">maritime\u003c/span>\u003cspan class=\"s\">sea\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">terrestrial\u003c/span>\u003cspan class=\"a\">inland\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">explain\u003c/b>\u003cspan class=\"m\">설명하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">clarify\u003c/span>\u003cspan class=\"s\">describe\u003c/span>\u003cspan class=\"s\">account for\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">confuse\u003c/span>\u003cspan class=\"a\">obscure\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">convert\u003c/b>\u003cspan class=\"m\">전환하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">change\u003c/span>\u003cspan class=\"s\">transform\u003c/span>\u003cspan class=\"s\">turn\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">preserve\u003c/span>\u003cspan class=\"a\">retain\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어로 정리해 볼게요. important 는 significant, crucial 과 가깝고 trivial 과는 반대입니다. virtually 는 practically, almost 와 같은 뜻으로 읽어 두세요. marine 은 oceanic, maritime 과 동의어이고 terrestrial, inland 와는 반대말이에요. explain 은 clarify, account for 로 바꿔 쓸 수 있고, convert 는 change, transform 과 같은 뜻으로 preserve 와는 반대됩니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1928년에,\u003c/span>\u003cspan class=\"en\">In 1928,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Alexander Fleming은 했다\u003c/span>\u003cspan class=\"en\">Alexander Fleming \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">made \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 중요한 발견을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">important \u003c/span>\u003cspan class=\"tgt\">discovery\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">페니실린이 박테리아를 죽인다는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">penicillin \u003c/span>\u003cspan class=\"tgt\">kills \u003c/span>\u003cspan class=\"tgt\">bacteria\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">1928 년, Alexander Fleming 은 페니실린이 박테리아를 죽인다는 중요한 발견을 했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글 전체의 \u003cb class=\"key\">배경\u003c/b>을 깔아 주며 문을 여는 문장이에요. 페니실린이 박테리아를 죽인다는 사실을 알아낸 사건이 이후 \u003cb class=\"key\">신약 \u003c/b>\u003cb class=\"key\">탐색\u003c/b> 이야기의 출발점이 됩니다. 동격의 that절이 '발견'의 내용을 뒤에서 풀어 준다는 점이 핵심이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">3형식(make + 목적어)\u003c/span> : make + [목적어(the important discovery)] : \"중요한 발견을 했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동격의 that절\u003c/span> : [선행 명사 the discovery] + that + [주어+동사+목적어의 완전한 절] : \"페니실린이 박테리아를 죽인다는\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"In 1928, 1928년에. Alexander Fleming made, Alexander Fleming은 했다. the important discovery, 그 중요한 발견을. that penicillin kills bacteria, 페니실린이 박테리아를 죽인다는. 이 문장 전체를 해석하면, 1928 년, Alexander Fleming 은 페니실린이 박테리아를 죽인다는 중요한 발견을 했다.","hl":"m"},{"n":14,"text":"이 문장은 글 전체의 배경을 깔아 주는 문장이에요. 페니실린이 박테리아를 죽인다는 걸 플레밍이 알아냈다는 점이 핵심이죠. 이 배경 덕분에 뒤에서 신약 탐색 이야기가 자연스럽게 이어집니다.","hl":"mn"},{"n":15,"text":"첫 번째 어법 포인트는 made the important discovery인데요, make는 여기서 만들다가 아니라 삼 형식 동사로 발견을 하다라는 뜻이에요. 그래서 뒤에 목적어인 the important discovery가 옵니다. 두 번째는 that penicillin kills bacteria로, 앞의 the important discovery 내용을 동격으로 풀어 주는 절이에요. that절 안에 주어와 동사, 목적어가 다 들어 있는 완전한 절이라는 점, 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 이후로,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Since \u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">time\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전 세계의 의학 연구자들은\u003c/span>\u003cspan class=\"en\">medical researchers \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">around \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">globe\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">찾아오고 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">been \u003c/span>\u003cspan class=\"tgt\">looking \u003c/span>\u003cspan class=\"tgt\">for\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새로운 종류의 의약품을\u003c/span>\u003cspan class=\"en\">new kinds of drugs.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 이후로 전 세계 의학 연구자들은 새로운 종류의 의약품을 찾아왔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 발견 이후 이어진 흐름을 받아 주는 문장이에요. 전 세계 연구자들이 \u003cb class=\"key\">신약\u003c/b>을 찾는 일을 지금까지 \u003cb class=\"key\">계속\u003c/b>해 왔다는 점을 강조합니다. 이 노력이 다음 문장의 '바다'로 시선을 옮기는 발판이 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 since + 시점\u003c/span> : since + [과거의 시점 명사(that time)] : \"그 이후로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 용법(명사 수식)\u003c/span> : [명사 researchers] + [전치사구 around the globe] : \"전 세계의\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">현재완료진행(have been -ing)\u003c/span> : have/has + been + [현재분사(-ing)] : \"찾아오고 있다\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"Since that time, 그 이후로. medical researchers around the globe, 전 세계의 의학 연구자들은. have been looking for, 찾아오고 있다. new kinds of drugs, 새로운 종류의 의약품을. 이 문장 전체를 해석하면, 그 이후로 전 세계 의학 연구자들은 새로운 종류의 의약품을 찾아왔다.","hl":"m"},{"n":17,"text":"이 문장은 첫 번째 문장의 발견 이후에 이어진 흐름을 이어받아요. 전 세계 의학 연구자들이 새로운 신약을 찾는 노력을 계속해 왔다는 점을 강조하는 거죠. 그래서 뒤에 나올 바다 이야기로 넘어가는 발판이 되는 문장입니다.","hl":"mn"},{"n":18,"text":"첫 번째 어법은 have been looking for인데요, 과거의 어느 시점부터 지금까지 동작이 계속 이어짐을 나타내는 현재완료진행이에요. 두 번째는 Since that time으로, since가 기준 시점을 잡아 주는 전치사라서 주절의 시제가 현재완료 계열과 자연스럽게 어울립니다. 세 번째는 around the globe로, 전치사구가 앞의 명사 researchers를 뒤에서 수식하는 형용사 역할을 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 뒤져왔다\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">searched\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사실상 모든 곳을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">virtually \u003c/span>\u003cspan class=\"tgt\">everywhere\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">육지에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">dry \u003c/span>\u003cspan class=\"tgt\">land\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 사실상 육지의 모든 곳을 다 뒤져왔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 연구자들이 신약을 찾아왔다고 했죠. 이 문장은 그 탐색의 \u003cb class=\"key\">범위\u003c/b>가 육지 전체에 이를 만큼 넓었다는 걸 보여 줘요. 육지는 사실상 다 뒤졌으니 이제 바다로 눈을 돌린다는 다음 흐름이 자연스러워집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재완료(have + 과거분사)\u003c/span> : have/has + [과거분사(searched)] : \"뒤져왔다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부사 virtually의 수식\u003c/span> : [부사 virtually] + [everywhere] : \"사실상 모든 곳을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 용법(장소)\u003c/span> : search + [전치사구 on dry land] : \"육지에서\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"They have searched, 그들은 뒤져왔다. virtually everywhere, 사실상 모든 곳을. on dry land, 육지에서. 이 문장 전체를 해석하면, 그들은 사실상 육지의 모든 곳을 다 뒤져왔다.","hl":"m"},{"n":20,"text":"앞 문장에서 연구자들이 신약을 찾아왔다고 했죠. 이 문장은 그 탐색의 범위가 육지 전체에 이를 만큼 넓었다는 걸 보여 줘요. 육지는 사실상 다 뒤졌으니 이제 바다로 눈을 돌린다는 다음 흐름이 자연스러워집니다.","hl":"mn"},{"n":21,"text":"첫 번째는 have searched인데, 지금까지 쭉 뒤져왔다는 현재완료이고 지금까지 해 온 일의 결과를 현재와 연결해 줍니다. 두 번째는 virtually everywhere로, virtually가 부사로서 everywhere를 수식해서 사실상 모든 곳이라는 뜻을 만들어요. 세 번째는 on dry land로, 장소를 나타내는 전치사구가 searched를 수식해서 탐색의 범위를 육지로 한정해 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이제\u003c/span>\u003cspan class=\"en\">Now\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">약을 찾는 사람들은\u003c/span>\u003cspan class=\"en\">the drug hunters\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">관심을 돌렸다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">turned \u003c/span>\u003cspan class=\"tgt\">to\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지구의 대양으로\u003c/span>\u003cspan class=\"en\">the planet's oceans.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이제 약을 찾는 사람들은 지구의 대양으로 관심을 돌렸다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 연구자들이 땅 곳곳을 뒤졌다는 흐름을 이어, 이제 시선을 바다로 옮겼다는 것을 알려 주는 문장이에요. \u003cb class=\"key\">have \u003c/b>\u003cb class=\"key\">turned \u003c/b>\u003cb class=\"key\">to\u003c/b>는 '관심을 돌리다'라는 뜻으로, 탐색의 \u003cb class=\"key\">방향 \u003c/b>\u003cb class=\"key\">전환\u003c/b>을 표시하는 표현이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재완료(완료·결과)\u003c/span> : [[주어]] + have/has + [[과거분사]] : \"(~로) 돌려왔다 → (이제) 돌렸다\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"Now, 이제. the drug hunters, 약을 찾는 사람들은. have turned to, 관심을 돌렸다. the planet's oceans, 지구의 대양으로. 이 문장 전체를 해석하면, 이제 약을 찾는 사람들은 지구의 대양으로 관심을 돌렸다.","hl":"m"},{"n":23,"text":"앞에서 연구자들이 땅에서 약을 찾아봤다는 흐름을 이어받은 문장이에요. 이제는 시선을 바다로 옮겼다는 방향 전환을 알려 주고 있죠.","hl":"mn"},{"n":24,"text":"have turned to는 현재완료인데, 여기서는 지금까지 해 온 일이 방금 마무리되어 결과가 현재에 남아 있다는 뜻으로 쓰였어요. 그래서 단순히 '돌려왔다'가 아니라 '이제 돌렸다'로 자연스럽게 해석되는 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사실,\u003c/span>\u003cspan class=\"en\">In fact,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~한 이들이 있다\u003c/span>\u003cspan class=\"en\">there are \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">some \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">믿는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">believe\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바다가 보물 상자라고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">ocean \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">treasure \u003c/span>\u003cspan class=\"tgt\">chest \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">약으로 가득 찬\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">full \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">medicine\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">발견되기를 기다리는\u003c/span>\u003cspan class=\"en\">just \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">waiting \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">discovered\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사실, 바다야말로 발견되기를 기다리는 약들로 가득 차 있는 보물 상자라고 믿는 이들이 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 바다를 \u003cb class=\"key\">보물 \u003c/b>\u003cb class=\"key\">상자\u003c/b>에 비유해서, 아직 발견되지 않은 약이 가득하다는 기대를 담은 문장이에요. \u003cb class=\"key\">there \u003c/b>\u003cb class=\"key\">are \u003c/b>\u003cb class=\"key\">some \u003c/b>\u003cb class=\"key\">who \u003c/b>\u003cb class=\"key\">believe \u003c/b>\u003cb class=\"key\">that\u003c/b>은 '~라고 믿는 이들이 있다'로, 주장을 부드럽게 꺼내는 \u003cb class=\"key\">도입 \u003c/b>\u003cb class=\"key\">표현\u003c/b>이죠. 글의 흐름에서는 연구자들이 바다로 눈을 돌린 이유를 제시하는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 who\u003c/span> : [[선행사]] some + who + [[동사]] believe : \"믿는 이들이\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 that(목적어절)\u003c/span> : [[동사]] believe + that + [[주어]] + [[동사]] : \"바다가 보물 상자라고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">형용사구의 후치수식\u003c/span> : [[명사]] + full of + [[명사]] : \"약으로 가득 찬 보물 상자\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">현재분사구 후치수식 + to부정사 수동태\u003c/span> : [[명사]] + waiting + to be + [[과거분사]] : \"발견되기를 기다리는\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"In fact, 사실. there are some, ~한 이들이 있다. who believe, 믿는. that the ocean is a treasure chest, 바다가 보물 상자라고. full of medicine, 약으로 가득 찬. just waiting to be discovered, 발견되기를 기다리는. 이 문장 전체를 해석하면, 사실, 바다야말로 발견되기를 기다리는 약들로 가득 차 있는 보물 상자라고 믿는 이들이 있다.","hl":"m"},{"n":26,"text":"이 문장은 바다를 보물 상자에 비유해서, 아직 발견되지 않은 약이 잔뜩 숨어 있다는 기대를 표현하고 있어요. there are some who believe that은 주장을 강하게 밀어붙이지 않고 부드럽게 꺼낼 때 아주 즐겨 쓰는 표현이죠.","hl":"mn"},{"n":27,"text":"첫 번째로, some who believe에서 who는 앞의 some을 받아 뒤에 동사를 이끄는 주격 관계대명사예요. 두 번째로, believe 뒤의 that은 절을 목적어로 이끄는 접속사라서 해석되지 않아요. 세 번째로, full of medicine은 treasure chest를 뒤에서 꾸며 주는 형용사구예요. 네 번째로, waiting to be discovered는 현재분사구가 앞의 명사를 꾸미면서 그 안에 to be discovered라는 수동의 의미가 들어 있는 구조죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">해양 화학자 William Fenical은 설명한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Marine \u003c/span>\u003cspan class=\"tgt\">chemist \u003c/span>\u003cspan class=\"tgt\">William \u003c/span>\u003cspan class=\"tgt\">Fenical\u003c/span> explains\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">특별한 화학물질이 개발되어 왔다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">special \u003c/span>\u003cspan class=\"tgt\">chemicals\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">been \u003c/span>\u003cspan class=\"tgt\">developed\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">해양 생물로부터\u003c/span>\u003cspan class=\"en\">from marine creatures\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바다 표면 아래 깊은 곳에 사는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">live \u003c/span>\u003cspan class=\"tgt\">deep \u003c/span>\u003cspan class=\"tgt\">below \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">surface \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">ocean\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">해양 화학자 William Fenical 은 특별한 화학물질이 바다 표면 아래 깊은 곳에 사는 해양 생물로부터 개발되어왔다고 설명한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 해양 화학자 William Fenical의 말을 빌려, 깊은 바다 생물에서 특별한 화학물질이 개발되어 왔다는 \u003cb class=\"key\">근거\u003c/b>를 제시하는 문장이에요. \u003cb class=\"key\">have \u003c/b>\u003cb class=\"key\">been \u003c/b>\u003cb class=\"key\">developed\u003c/b>는 '개발되어 왔다'로, 연구가 계속 진행되고 있음을 보여 주죠. 앞 문장에서 말한 기대가 실제 성과로 이어진다는 흐름을 만들어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동격(직함 + 고유명사)\u003c/span> : [[직함]] + [[고유명사]] : \"해양 화학자 William Fenical은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 that(목적어절 도입)\u003c/span> : [[동사]] explains + that + [[주어]] + [[동사]] : \"특별한 화학물질이 ~라고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">현재완료 수동태\u003c/span> : have/has been + [[과거분사]] : \"개발되어 왔다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : [[선행사]] marine creatures + that + [[동사]] live : \"바다 표면 아래 깊은 곳에 사는\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"Marine chemist William Fenical explains, 해양 화학자 William Fenical은 설명한다. that special chemicals have been developed, 특별한 화학물질이 개발되어 왔다고. from marine creatures, 해양 생물로부터. that live deep below the surface of the ocean, 바다 표면 아래 깊은 곳에 사는. 이 문장 전체를 해석하면, 해양 화학자 William Fenical 은 특별한 화학물질이 바다 표면 아래 깊은 곳에 사는 해양 생물로부터 개발되어왔다고 설명한다.","hl":"m"},{"n":29,"text":"이 문장은 해양 화학자 William Fenical의 말을 빌려서, 깊은 바다 생물에서 특별한 화학물질이 개발되어 왔다는 근거를 제시하고 있어요. 앞 문장에서 바다가 약의 보고라는 기대를 말했으니, 여기서는 실제로 그런 물질이 나오고 있다는 걸 보여 주는 거죠.","hl":"mn"},{"n":30,"text":"첫 번째로, Marine chemist William Fenical은 직함과 이름을 나란히 붙인 동격 표현이에요. 두 번째로, explains 뒤의 that은 설명의 내용을 이끄는 접속사라서 해석하지 않고 '~라고'로 붙여 줍니다. 세 번째로, have been developed는 현재완료 수동태로 '개발되어 왔다'라는 뜻이에요. 네 번째로, 뒤에 나오는 that live는 marine creatures를 받는 주격 관계대명사죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">과학자들이 더 많이 배우고 있기에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">As\u003c/span> scientists learn more\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떻게 이 화학물질들이 작용하는가에 대해\u003c/span>\u003cspan class=\"en\">about \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">these \u003c/span>\u003cspan class=\"tgt\">chemicals \u003c/span>\u003cspan class=\"tgt\">function\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 전망된다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">hoped\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 그 화학물질들을 전환시켜 낼 수 있다는\u003c/span>\u003cspan class=\"en\">that they can \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">convert \u003c/span>\u003cspan class=\"tgt\">them \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">신종 의약품으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">into\u003c/span> new kinds of medicine.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어떻게 이 화학물질들이 작용하는가에 대해 과학자들이 더 많이 배우고 있기에, 그들이 그 화학물질들을 신종 의약품으로 전환시켜 낼 수 있을 것으로 전망된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 해양 생물에서 얻은 화학물질의 \u003cb class=\"key\">작용 \u003c/b>\u003cb class=\"key\">원리\u003c/b>를 더 알게 되면 그것을 \u003cb class=\"key\">신약\u003c/b>으로 전환할 수 있다는 \u003cb class=\"key\">전망\u003c/b>을 제시합니다. 앞에서 바다를 '의약품의 보고'라고 소개한 흐름을 미래의 가능성으로 마무리하는 결론 역할을 합니다. it is hoped that은 직역하면 '~라는 것이 희망된다'이지만, 글의 맥락에서는 '~할 것으로 전망된다'로 자연스럽게 풀어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 as의 용법(이유·비례)\u003c/span> : As + 주어 + 동사, 주절 : \"과학자들이 더 많이 배우고 있기에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">간접의문문(의문사절)\u003c/span> : 전치사 about + [how + 주어 + 동사] : \"이 화학물질들이 어떻게 작용하는지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">가주어 it과 수동태\u003c/span> : It is hoped + that + 주어 + 동사 : \"~라는 것이 희망된다, ~할 것으로 전망된다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">convert A into B(전환 표현)\u003c/span> : convert + 목적어 + into + 결과 : \"그것들을 ~으로 전환시키다\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"As scientists learn more, 과학자들이 더 많이 배우고 있기에. about how these chemicals function, 어떻게 이 화학물질들이 작용하는가에 대해. it is hoped, 그것이 전망된다. that they can convert them, 그들이 그 화학물질들을 전환시켜 낼 수 있다는. into new kinds of medicine, 신종 의약품으로. 이 문장 전체를 해석하면, 어떻게 이 화학물질들이 작용하는가에 대해 과학자들이 더 많이 배우고 있기에, 그들이 그 화학물질들을 신종 의약품으로 전환시켜 낼 수 있을 것으로 전망된다.","hl":"m"},{"n":32,"text":"이 문장은 해양 생물에서 얻은 화학물질의 작용 원리를 더 알게 되면 그것을 신약으로 전환할 수 있다는 전망을 제시해요. 앞에서 바다를 의약품의 보고라고 소개한 흐름을 미래의 가능성으로 마무리하는 결론 역할을 하죠. it is hoped that은 직역하면 그것이 희망된다는 뜻이지만, 여기서는 할 것으로 전망된다로 자연스럽게 풀어 주면 됩니다.","hl":"mn"},{"n":33,"text":"어법 포인트는 순서대로 짚어 볼게요. 첫 번째, As는 두 절을 이어 주는 접속사로 여기서는 과학자들이 더 많이 배우는 것과 관련된 이유를 나타내요. 두 번째, about 뒤의 how these chemicals function은 how가 이끄는 간접의문문이고, 통째로 명사절 역할을 하죠. 세 번째, it is hoped는 진짜 주어인 that절을 뒤로 보내고 앞에 가주어 it을 둔 수동태 표현이에요. 네 번째, convert them into는 convert A into B 형태로 A를 B로 바꾸다라는 뜻의 관용표현이고, 여기서는 화학물질을 의약품으로 전환하다로 해석해요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>1928년 알렉산더 플레밍의 \u003cb class=\"key\">페니실린\u003c/b> 발견 이후, 전 세계 의학 연구자들은 새로운 종류의 의약품을 찾아왔다.\u003c/li>\u003cli>그들은 육지의 \u003cb class=\"key\">모든 \u003c/b>\u003cb class=\"key\">곳\u003c/b>을 사실상 다 뒤졌고, 이제 탐색의 무대를 \u003cb class=\"key\">대양\u003c/b>으로 옮겼다.\u003c/li>\u003cli>바다는 발견되기를 기다리는 약으로 가득 찬 \u003cb class=\"key\">보물 \u003c/b>\u003cb class=\"key\">상자\u003c/b>라고 믿는 이들이 있다.\u003c/li>\u003cli>심해 생물에서 개발된 \u003cb class=\"key\">화학물질\u003c/b>의 \u003cb class=\"key\">작용 \u003c/b>\u003cb class=\"key\">방식\u003c/b>을 더 알게 되면, 그것을 \u003cb class=\"key\">신종 \u003c/b>\u003cb class=\"key\">의약품\u003c/b>으로 전환할 수 있을 것으로 기대된다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Drug hunters who have searched dry land everywhere have now turned to the oceans, where special chemicals from marine creatures are expected to become new kinds of medicine.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">인류는 \u003cb class=\"key\">신약\u003c/b>을 찾아 육지를 사실상 다 뒤진 뒤, 탐색의 무대를 \u003cb class=\"key\">대양\u003c/b>으로 옮겼다. 심해 생물에서 얻은 \u003cb class=\"key\">화학물질\u003c/b>이 새로운 의약품으로 전환될 수 있다는 기대가 커지고 있다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":34,"text":"오늘 글의 핵심은 아주 단순합니다. 신약을 찾는 사람들이 육지를 다 뒤지고 바다로 간 이유는, 바다가 아직 열리지 않은 거대한 약의 보고이기 때문이에요. 심해 생물의 화학물질이 신종 의약품이 될 수 있다는 기대, 그 한 문장으로 오늘 지문을 정리해 두세요. 긴 글도 흐름과 신호어만 잡으면 이렇게 짧아집니다. 다음 시간에 또 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
