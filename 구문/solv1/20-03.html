<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SO 레벨1 20강 적용독해03 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-sno{font-size:13px;color:#8493A1;font-weight:700;margin-bottom:8px}

.lp-chunk{display:flex;flex-direction:column}
.lp-chunk .ko{font-size:13px;color:var(--pk-t);font-weight:700;line-height:1.3;margin-bottom:2px}
.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}
.lp-top::before{height:5px;background:linear-gradient(90deg,var(--pk) 0,var(--pk) 80%,var(--am) 80%,var(--am) 100%)}
.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}
.lp-tag{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700;padding:2px 12px}
.lp-qn{flex:0 0 112px;height:112px;align-self:center;background:#fff;color:var(--pk);border:3px solid var(--pk);border-radius:50%;font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;font-size:26px}
.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}

.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}

.lp-st h4{color:var(--ink,#1B2733)}
.lp-st h4 i{border-radius:4px;width:auto;min-width:24px;padding:0 4px}
.lp-pill{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700}

.lp-vg em{background:#fff;border:1px solid var(--pk-b);border-radius:3px}

.lp-chips .s{border:1px solid #AEBBE6;color:#3A4FA3}
.lp-chips .a{border:1px solid var(--am-b);color:var(--am-d);background:#FFFBF2}
.lp-sno .es{background:var(--am);border-radius:2px;font-weight:700}
.lp-chunk .en{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:600}
.lp-chunk+.lp-chunk{border-left:1px solid var(--pk-b)}
.lp .tgt{background:var(--am-l);border-bottom:2.5px dotted var(--am)}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"SO 레벨1 20강 적용독해03","audioDir":"20-03_audio","preview":false,"count":30,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">20강\u003cbr>적용독해03\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">SO 레벨1\u003c/div>\u003ch1>All Roads Lead to Rome: The Roads That Destroyed the Empire\u003c/h1>\u003ch2>모든 길은 로마로 통한다: 제국을 무너뜨린 도로\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>로마는 뛰어난 도로 건설 능력으로 대 부대를 신속히 이동시켜 정복 전쟁을 벌였지만, \u003cb class=\"key\">지나치게 \u003c/b>\u003cb class=\"key\">잘 \u003c/b>\u003cb class=\"key\">만들어진 \u003c/b>\u003cb class=\"key\">도로\u003c/b>를 적군도 그대로 이용하면서 결국 \u003cb class=\"key\">제국의 \u003c/b>\u003cb class=\"key\">멸망\u003c/b>을 맞았다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The Romans' talent for building roads ultimately helped their enemies destroy the empire, which is one of history's great ironies.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 볼 지문은 ‘모든 길은 로마로 통한다’라는 오래된 표현에서 출발하는 글이에요. 로마의 뛰어난 도로 건설이 결국 로마 자신을 무너뜨렸다는 이야기를 담고 있죠. 요약하면 잘 만들어진 도로 덕분에 로마는 빠르게 정복 전쟁을 벌였지만, 그 같은 도로를 적군이 그대로 이용하면서 제국의 멸망을 맞았다는 겁니다. 요지는 뛰어난 기술이 언제나 자기 편만을 위한 것이 되지는 않는다는 점이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">로마인들은 군사적 목적과 물류 이동을 위해 제국 전역에 촘촘한 도로망(a network of roads)을 깔았습니다. 대표적인 것이 아피아 가도(Via Appia)로, 로마군은 이 길을 통해 대 부대를 빠르게 이동시켜 정복 전쟁(conquest)을 벌였습니다. 잘 닦인 길은 곧 군대의 속도였고, 속도는 곧 승리였던 셈입니다. 그런데 도로는 아군만 쓰는 것이 아니었습니다. 적군도 같은 길을 따라 로마로 진군할 수 있었고, 결국 도로는 침입로가 되었습니다. 이처럼 애초의 의도와 정반대의 결과가 나오는 것을 아이러니(irony)라고 합니다. 우리 집 대문 열쇠를 아주 튼튼하게 만들어 두었더니 도둑도 그 열쇠로 들어온 셈이죠. 기술의 \u003cb class=\"key\">부작용\u003c/b>은 늘 그 기술을 만든 사람에게 되돌아올 수 있다는 점을 이 글은 보여 줍니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식부터 짚어 볼게요. 로마인들은 제국 전역에 촘촘한 도로망을 깔았고, 대표적인 것이 아피아 가도예요. 로마군은 이 길을 통해 대 부대를 빠르게 이동시켜 정복 전쟁을 벌였습니다. 그런데 잘 닦인 길은 아군만 쓰는 것이 아니었어요. 적군도 같은 길을 따라 로마로 진군할 수 있었고, 결국 도로가 침입로가 된 거죠. 애초의 의도와 정반대의 결과가 나오는 것을 irony, 즉 역설이라고 합니다. 우리 집 대문 열쇠를 아주 튼튼하게 만들어 두었더니 도둑도 그 열쇠로 들어온 셈이에요. 기술의 부작용은 늘 그 기술을 만든 사람에게 되돌아올 수 있다는 점을 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>표현이 말해 주는 솜씨\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>‘모든 길은 로마로 통한다’라는 오래된 표현은 고대 로마인들이 \u003cb class=\"key\">도로 \u003c/b>\u003cb class=\"key\">건설\u003c/b>에 얼마나 탁월했는지를 일깨워 줍니다. 이 도로들은 로마제국의 \u003cb class=\"key\">대 \u003c/b>\u003cb class=\"key\">부대\u003c/b>가 다른 나라를 정복하러 출정할 때 신속하고 쉽게 이동하도록 만들었습니다. 즉 도로는 처음부터 \u003cb class=\"key\">정복 \u003c/b>\u003cb class=\"key\">전쟁\u003c/b>을 위한 핵심 수단이었던 셈입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>지나치게 잘 만들어진 도로\u003csmall>전환 · 문장 3\u003c/small>\u003c/h4>\u003cp>그런데 글은 세 번째 문장에서 곧바로 \u003cb class=\"key\">전환\u003c/b>을 시도합니다. 도로들은 사실상 \u003cb class=\"key\">지나치게\u003c/b> 잘 만들어졌다는 것입니다. 여기서 too는 단순히 ‘매우’가 아니라 \u003cb class=\"key\">부정적 \u003c/b>\u003cb class=\"key\">결과\u003c/b>를 암시하는 표현으로, 뒤에 올 반전을 미리 알려 줍니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>적군이 쓴 같은 도로\u003csmall>근거 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>문제는 로마의 \u003cb class=\"key\">적군\u003c/b>들도 같은 길을 로마를 공격하는 데 이용할 수 있었다는 점입니다. 그 결과 도로는 로마에게 \u003cb class=\"key\">타격\u003c/b>을 주고 결국 제국을 멸망시키는 통로가 되었습니다. 글쓴이는 잘 만들어진 \u003cb class=\"key\">도로망\u003c/b>이 없었더라면 로마 제국의 멸망이 모면될 수도 있었다는 가정까지 제시합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>역사가 남긴 아이러니\u003csmall>결론 · 문장 6\u003c/small>\u003c/h4>\u003cp>마지막 문장은 고대 로마인들의 도로 건설 \u003cb class=\"key\">재능\u003c/b>이 궁극적으로 그들 자신의 \u003cb class=\"key\">파멸\u003c/b>을 이끌었다고 정리합니다. 이것이 역사상의 대단한 \u003cb class=\"key\">아이러니\u003c/b> 가운데 하나라는 것입니다. 애초에 자랑거리였던 것이 마지막에는 \u003cb class=\"key\">몰락\u003c/b>의 원인이 되었다는 결론입니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 처음부터 끝까지 따라가 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 도입이에요. ‘모든 길은 로마로 통한다’라는 오래된 표현은 고대 로마인들이 도로 건설에 얼마나 탁월했는지를 일깨워 줍니다. 이 도로들은 로마제국의 대 부대가 다른 나라를 정복하러 출정할 때 신속하고 쉽게 이동하는 것을 가능하게 해 주었어요. 그래서 도로는 처음부터 정복 전쟁의 핵심 수단이었던 셈이죠.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 전환이 일어납니다. 하지만 도로들은 사실상 지나치게 잘 만들어졌다고 말하죠. 여기서 too는 그냥 매우라는 뜻이 아니라 부정적 결과를 암시하는 표현이에요. 그래서 이 한 문장이 뒤에 올 반전을 알리는 신호탄이 됩니다.","hl":"f1"},{"n":6,"text":"세 번째 단계는 그 반전의 근거예요. 문제는 로마의 적군들도 같은 길을 로마를 공격하는 데 이용할 수 있었다는 것이었죠. 결국 도로는 로마에게 타격을 주고 제국을 멸망시키는 통로가 되었어요. 심지어 잘 만들어진 도로망이 없었더라면 로마 제국의 멸망이 모면될 수도 있었을 것이라는 가정까지 나옵니다.","hl":"f2"},{"n":7,"text":"마지막 단계는 결론이에요. 고대 로마인들의 도로 건설 재능이 궁극적으로 그들 자신의 파멸을 이끌었다는 것이죠. 이것이 역사상의 대단한 아이러니 가운데 하나라는 말로 글을 맺습니다. 자랑거리였던 것이 결국 몰락의 원인이 되었다는 정리예요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">통념-반박\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 6번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 로마의 도로가 훌륭하다는 \u003cb class=\"key\">통념\u003c/b>으로 시작해, 그 도로가 오히려 제국을 무너뜨렸다는 \u003cb class=\"key\">반박\u003c/b>으로 끝납니다. 결정적인 \u003cb class=\"key\">주제문\u003c/b>이 마지막 문장에 놓여 있으므로 전개 방식은 \u003cb class=\"key\">미괄식\u003c/b>입니다. 세 번째 문장의 But이 칭찬과 반전을 갈라 주고, 네 번째 문장이 \u003cb class=\"key\">문제\u003c/b>를 구체화하며, 다섯 번째 문장이 가정의 형태로 \u003cb class=\"key\">결과\u003c/b>를 강화합니다. 마지막 문장의 irony가 글 전체를 하나의 \u003cb class=\"key\">역설\u003c/b>로 묶어 줍니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>But (3)\u003c/b>\u003cspan>통념에서 반전으로 전환\u003c/span>\u003cb>The problem was that (4)\u003c/b>\u003cspan>구체적 문제 제시\u003c/span>\u003cb>Without (5)\u003c/b>\u003cspan>가정을 통한 결과 강조\u003c/span>\u003cb>ironies (6)\u003c/b>\u003cspan>결론이자 역설 강조\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">excellent at building highways\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">built too well\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">well-made roads\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a network of well-made roads\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">talent for building roads\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>도로를 이용한 로마군\u003c/th>\u003cth>도로를 이용한 적군\u003c/th>\u003c/tr>\u003ctr>\u003ctd>다른 나라를 정복하러 신속히 이동\u003c/td>\u003ctd>로마를 공격하러 그대로 진군\u003c/td>\u003c/tr>\u003ctr>\u003ctd>제국의 확장에 기여\u003c/td>\u003ctd>제국의 약화와 멸망을 초래\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 통념과 반박의 구조예요. 로마의 도로가 훌륭하다는 통념으로 시작해서, 그 도로가 오히려 제국을 무너뜨렸다는 반박으로 끝나죠. 결정적인 주제문이 맨 마지막 문장에 놓여 있으니 미괄식 구조입니다. 그래서 이 글은 끝까지 읽어야 글쓴이의 진짜 주장이 보인다는 점을 꼭 기억해 두세요.","hl":"ty"},{"n":9,"text":"신호어를 짚어 볼게요. 세 번째 문장이 But으로 시작하면서 앞의 칭찬을 뒤집습니다. 이어서 The problem was that이 구체적인 문제를 꺼내고, Without이 가정의 상황을 만들어 내죠. 마지막 문장의 irony라는 단어는 글 전체를 역설로 묶어 주는 결정적인 표현이고요. 또 well-made roads라는 표현이 talent for building roads라는 말로 다시 진술되는 재진술의 흐름도 눈여겨보세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>expression\u003c/b>\u003cem>명사\u003c/em>\u003cspan>표현\u003c/span>\u003c/div>\u003cdiv>\u003cb>lead to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 통하다, ~로 이어지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>remind\u003c/b>\u003cem>동사\u003c/em>\u003cspan>일깨워 주다, 상기시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>excellent\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>탁월한, 뛰어난\u003c/span>\u003c/div>\u003cdiv>\u003cb>ancient\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>고대의\u003c/span>\u003c/div>\u003cdiv>\u003cb>highway\u003c/b>\u003cem>명사\u003c/em>\u003cspan>고속도로, 간선도로\u003c/span>\u003c/div>\u003cdiv>\u003cb>make it possible for O to V\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>O가 ~하는 것을 가능하게 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>army\u003c/b>\u003cem>명사\u003c/em>\u003cspan>군대, 부대\u003c/span>\u003c/div>\u003cdiv>\u003cb>empire\u003c/b>\u003cem>명사\u003c/em>\u003cspan>제국\u003c/span>\u003c/div>\u003cdiv>\u003cb>conquer\u003c/b>\u003cem>동사\u003c/em>\u003cspan>정복하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>head out\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>출정하다, 출발하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>actually\u003c/b>\u003cem>부사\u003c/em>\u003cspan>실제로, 사실은\u003c/span>\u003c/div>\u003cdiv>\u003cb>enemy\u003c/b>\u003cem>명사\u003c/em>\u003cspan>적, 적군\u003c/span>\u003c/div>\u003cdiv>\u003cb>attack\u003c/b>\u003cem>동사\u003c/em>\u003cspan>공격하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>weaken\u003c/b>\u003cem>동사\u003c/em>\u003cspan>약화시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>eventually\u003c/b>\u003cem>부사\u003c/em>\u003cspan>결국, 마침내\u003c/span>\u003c/div>\u003cdiv>\u003cb>destroy\u003c/b>\u003cem>동사\u003c/em>\u003cspan>파괴하다, 멸망시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>network\u003c/b>\u003cem>명사\u003c/em>\u003cspan>망, 네트워크\u003c/span>\u003c/div>\u003cdiv>\u003cb>well-made\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>잘 만들어진\u003c/span>\u003c/div>\u003cdiv>\u003cb>it is possible that\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~일 가능성이 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>avoid\u003c/b>\u003cem>동사\u003c/em>\u003cspan>피하다, 모면하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>accelerate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>가속시키다, 촉진하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>fall\u003c/b>\u003cem>명사\u003c/em>\u003cspan>몰락, 붕괴\u003c/span>\u003c/div>\u003cdiv>\u003cb>irony\u003c/b>\u003cem>명사\u003c/em>\u003cspan>아이러니, 역설\u003c/span>\u003c/div>\u003cdiv>\u003cb>talent\u003c/b>\u003cem>명사\u003c/em>\u003cspan>재능\u003c/span>\u003c/div>\u003cdiv>\u003cb>ultimately\u003c/b>\u003cem>부사\u003c/em>\u003cspan>궁극적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>destruction\u003c/b>\u003cem>명사\u003c/em>\u003cspan>파괴, 멸망\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어도 몇 개 짚을게요. conquer는 정복하다, weaken은 약화시키다, eventually는 결국이라는 뜻이에요. 또 ultimately는 궁극적으로, destroy는 파괴하다, 멸망시키다로 기억해 두세요. irony는 역설, 아이러니라는 뜻으로 이 글의 열쇠말입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">excellent\u003c/b>\u003cspan class=\"m\">탁월한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">outstanding\u003c/span>\u003cspan class=\"s\">superb\u003c/span>\u003cspan class=\"s\">remarkable\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">inferior\u003c/span>\u003cspan class=\"a\">poor\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">conquer\u003c/b>\u003cspan class=\"m\">정복하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">defeat\u003c/span>\u003cspan class=\"s\">overcome\u003c/span>\u003cspan class=\"s\">vanquish\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">surrender\u003c/span>\u003cspan class=\"a\">lose\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">weaken\u003c/b>\u003cspan class=\"m\">약화시키다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">undermine\u003c/span>\u003cspan class=\"s\">impair\u003c/span>\u003cspan class=\"s\">cripple\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">strengthen\u003c/span>\u003cspan class=\"a\">reinforce\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">eventually\u003c/b>\u003cspan class=\"m\">결국\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">ultimately\u003c/span>\u003cspan class=\"s\">finally\u003c/span>\u003cspan class=\"s\">in the end\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">initially\u003c/span>\u003cspan class=\"a\">immediately\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">destroy\u003c/b>\u003cspan class=\"m\">파괴하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">ruin\u003c/span>\u003cspan class=\"s\">demolish\u003c/span>\u003cspan class=\"s\">wreck\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">build\u003c/span>\u003cspan class=\"a\">preserve\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">avoid\u003c/b>\u003cspan class=\"m\">모면하다, 피하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">prevent\u003c/span>\u003cspan class=\"s\">escape\u003c/span>\u003cspan class=\"s\">evade\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">cause\u003c/span>\u003cspan class=\"a\">invite\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">talent\u003c/b>\u003cspan class=\"m\">재능\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">gift\u003c/span>\u003cspan class=\"s\">aptitude\u003c/span>\u003cspan class=\"s\">skill\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">inability\u003c/span>\u003cspan class=\"a\">incompetence\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">fall\u003c/b>\u003cspan class=\"m\">몰락\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">collapse\u003c/span>\u003cspan class=\"s\">decline\u003c/span>\u003cspan class=\"s\">downfall\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">rise\u003c/span>\u003cspan class=\"a\">growth\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어로 정리해 볼게요. excellent는 outstanding, superb와 가깝고 반대말은 inferior예요. conquer는 defeat, overcome과 통하고 반대는 surrender입니다. weaken은 undermine, impair와 가깝고 반대는 strengthen죠. eventually는 ultimately, finally와 같고 반대는 initially이고요. destroy의 동의어는 ruin, demolish, 반의어는 build나 preserve예요. 마지막으로 talent는 gift, aptitude와 가깝고 반대말은 inability입니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오래된 표현인\u003c/span>\u003cspan class=\"en\">The old expression\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“모든 길은 로마로 통한다.”는\u003c/span>\u003cspan class=\"en\">&quot;All roads lead to Rome&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리에게 일깨워준다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">reminds \u003c/span>\u003cspan class=\"tgt\">us \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고대 로마인들이 얼마나 탁월했는지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">excellent \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">ancient \u003c/span>\u003cspan class=\"tgt\">Romans \u003c/span>\u003cspan class=\"tgt\">were\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고속도로를 건설하는 데\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">building \u003c/span>\u003cspan class=\"tgt\">highways\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">오래된 표현인 “모든 길은 로마로 통한다.”는 고대 로마가 고속도로를 건설하는 데 얼마나 탁월했던가를 우리에게 일깨워준다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> ‘모든 길은 로마로 통한다’는 \u003cb class=\"key\">속담\u003c/b>을 통해 고대 로마의 뛰어난 \u003cb class=\"key\">도로 \u003c/b>\u003cb class=\"key\">건설\u003c/b> 능력을 소개하는 문장이에요. 이 표현은 로마 도로망의 위대함을 보여 주며, 뒤에서 도로가 제국에 양날의 검이 된다는 내용을 이끄는 \u003cb class=\"key\">도입\u003c/b> 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">remind + 목적어 + 간접의문문\u003c/span> : remind + [목적어 us] + [how + 형용사 + 주어 + 동사] : \"우리에게 고대 로마인들이 얼마나 탁월했는지 일깨워준다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 at + 동명사\u003c/span> : be excellent + [at] + [building(동명사)] : \"고속도로를 건설하는 데 탁월했다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"The old expression, 오래된 표현인. \"All roads lead to Rome\", “모든 길은 로마로 통한다.”는. reminds us, 우리에게 일깨워준다. how excellent the ancient Romans were, 고대 로마인들이 얼마나 탁월했는지. at building highways, 고속도로를 건설하는 데. 이 문장 전체를 해석하면, 오래된 표현인 “모든 길은 로마로 통한다.”는 고대 로마가 고속도로를 건설하는 데 얼마나 탁월했던가를 우리에게 일깨워준다.","hl":"m"},{"n":13,"text":"이 문장은 모든 길은 로마로 통한다는 속담을 빌려 로마의 뛰어난 도로 건설 능력을 소개해요. 독자에게 로마 도로가 얼마나 대단했는지를 먼저 보여 주는 도입 역할을 하죠. 뒤에서 도로가 로마를 위협하는 아이러니로 이어질 수 있도록 관심을 잡아 주는 문장이에요.","hl":"mn"},{"n":14,"text":"첫 번째로 remind us 뒤에 how excellent the ancient Romans were가 와서 간접의문문이 목적어 역할을 해요. 간접의문문은 의문사가 있어도 평서문 어순을 쓴다는 점을 기억하세요. 두 번째로 at building highways에서 전치사 at 뒤에 동명사 building이 온 이유를 봐요. be excellent at building은 ~하는 데 탁월하다라는 관용 표현으로 굳어져 있답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 도로들은\u003c/span>\u003cspan class=\"en\">These roads\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가능하게 해주었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">made \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">possible\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">로마 제국의 대 부대가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">large \u003c/span>\u003cspan class=\"tgt\">armies \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">Roman \u003c/span>\u003cspan class=\"tgt\">Empire \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">신속하고 쉽게 이동하는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">move \u003c/span>\u003cspan class=\"tgt\">quickly \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">easily\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 나라를 정복하러 출정할 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">heading \u003c/span>\u003cspan class=\"tgt\">out \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">conquer \u003c/span>\u003cspan class=\"tgt\">other \u003c/span>\u003cspan class=\"tgt\">countries\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 도로들은 로마제국의 대 부대가 다른 나라를 정복하러 출정할 때 신속하고 쉽게 이동하는 것을 가능하게 해주었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 잘 만든 도로가 로마 군대의 \u003cb class=\"key\">군사적 \u003c/b>\u003cb class=\"key\">이동\u003c/b>을 얼마나 빠르고 쉽게 했는지 보여 줘요. 도로가 다른 나라 \u003cb class=\"key\">정복\u003c/b>에 결정적인 \u003cb class=\"key\">도로의 \u003c/b>\u003cb class=\"key\">효용\u003c/b>을 제공했음을 설명하죠. 앞 문장의 도로 칭찬을 구체적인 군사적 이점으로 뒷받침하는 역할이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가목적어 it을 쓰는 make 구문\u003c/span> : make + [it(가목적어)] + [possible(목적격 보어)] + [to부정사(진목적어)] : \"…을 가능하게 만들었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 의미상 주어(for + 명사)\u003c/span> : for + [의미상 주어] + [to move(to부정사)] : \"로마 제국의 대 부대가 신속하고 쉽게 이동하는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">접속사 when + 분사구문\u003c/span> : when + [heading(현재분사)] + [to conquer(목적의 to부정사)] : \"다른 나라를 정복하러 출정할 때\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"These roads, 이 도로들은. made it possible, 가능하게 해주었다. for the large armies of the Roman Empire, 로마 제국의 대 부대가. to move quickly and easily, 신속하고 쉽게 이동하는 것을. when heading out to conquer other countries, 다른 나라를 정복하러 출정할 때. 이 문장 전체를 해석하면, 이 도로들은 로마제국의 대 부대가 다른 나라를 정복하러 출정할 때 신속하고 쉽게 이동하는 것을 가능하게 해주었다.","hl":"m"},{"n":16,"text":"이 문장은 잘 만든 도로가 로마 군대의 군사적 이동을 얼마나 빠르고 쉽게 했는지 보여 줘요. 그 덕분에 도로는 다른 나라 정복에 결정적인 도로의 효용을 제공했죠. 앞 문장의 도로 칭찬을 구체적인 이점으로 뒷받침하는 역할을 해요.","hl":"mn"},{"n":17,"text":"첫 번째로 made it possible에서 possible 뒤의 to move가 진짜 목적어라서 it을 가목적어로 세운 구조를 봐요. 이 it은 해석하지 않는 형식 목적어라는 점이 중요해요. 두 번째로 for the large armies of the Roman Empire to move에서 for 이하가 to move의 의미상 주어예요. 즉 로마 제국의 대 부대가라는 행위의 주체를 밝혀 주는 거죠. 세 번째로 when heading out to conquer other countries는 when they head out을 줄인 분사구문이고, to conquer는 정복하러라는 목적을 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만\u003c/span>\u003cspan class=\"en\">But\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">도로들은\u003c/span>\u003cspan class=\"en\">the roads\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사실상 지나치게 잘 만들어졌다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">actually \u003c/span>\u003cspan class=\"tgt\">built\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">too \u003c/span>\u003cspan class=\"tgt\">well\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 도로들은 사실상 지나치게 잘 만들어졌다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> But이 앞의 긍정적 평가를 뒤집는 \u003cb class=\"key\">역접\u003c/b> 표지예요. 도로가 ‘지나치게 잘’ 만들어졌다는 \u003cb class=\"key\">과잉\u003c/b>이 훗날 제국을 위협한다는 점을 암시하는 글의 \u003cb class=\"key\">전환점\u003c/b>이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태(과거시제)\u003c/span> : [주어 the roads] + [were] + [과거분사 built] : \"사실상 만들어졌다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">too + 부사\u003c/span> : too + [well(부사)] : \"지나치게 잘\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"But, 하지만. the roads, 도로들은. were actually built too well, 사실상 지나치게 잘 만들어졌다. 이 문장 전체를 해석하면, 하지만 도로들은 사실상 지나치게 잘 만들어졌다.","hl":"m"},{"n":19,"text":"이 문장은 앞의 긍정적 평가를 뒤집는 역접 표지로 시작해요. 도로가 지나치게 잘 만들어졌다는 과잉이 훗날 제국을 위협한다는 점을 암시하는 전환점이죠. 그래서 앞으로 아이러니가 전개될 것을 예고해요.","hl":"mn"},{"n":20,"text":"첫 번째로 were actually built는 도로가 사람들에 의해 만들어지는 대상이라서 수동태로 쓴 거예요. actually가 were와 built 사이에서 강조 역할을 한다는 점도 기억하세요. 두 번째로 too well에서 too는 단순히 매우가 아니라 필요 이상이라는 부정적 함의를 담아요. 그래서 잘 만든 도로가 오히려 문제가 된다는 흐름을 암시한답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">문제는 ~였다\u003c/span>\u003cspan class=\"en\">The problem was\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">로마의 적군들도 같은 길을 이용할 수 있었다는 것이고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">Rome's \u003c/span>\u003cspan class=\"tgt\">enemies \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">able \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">use \u003c/span>\u003cspan class=\"tgt\">these \u003c/span>\u003cspan class=\"tgt\">same \u003c/span>\u003cspan class=\"tgt\">roads\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">로마를 공격하는 데\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">attack \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">Romans\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서 로마에게 타격을 주고 결국은 그 제국을 멸망시켰던 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">weakening \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">eventually \u003c/span>\u003cspan class=\"tgt\">destroying \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">empire\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">문제는 로마의 적군들도 같은 길을 로마를 공격하는 데 이용할 수 있었다는 것이고 그래서 로마에게 타격을 주고 결국은 그 제국을 멸망시켰던 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 도로를 '너무 잘 지었다'고 한 이유를 구체적으로 풀어 주는 문장이에요. 로마가 만든 길이 그대로 적군의 공격로가 되었다는 \u003cb class=\"key\">원인\u003c/b>을 제시해서, 뒤에 나오는 역사의 아이러니로 자연스럽게 이어지죠. weakening은 따로 '약화되면서'로 끊지 말고 앞 절 전체의 \u003cb class=\"key\">결과\u003c/b>로 묶어 '결국 제국을 약화시키고 멸망시켰다'로 읽는 것이 핵심이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that의 명사절(주격 보어)\u003c/span> : The problem was [that + 주어 + 동사 ~ : 명사절] : \"문제는 로마의 적군들이 이 같은 길들을 이용할 수 있었다는 것이고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be able to + 동사원형\u003c/span> : be able to [동사원형] = can : \"이용할 수 있었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : [to + 동사원형] ~하기 위해 : \"로마를 공격하기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">분사구문(결과)\u003c/span> : , [현재분사 ~ing] : 주절 전체를 받아 결과를 덧붙임 : \"로마에게 타격을 주고 결국은 그 제국을 멸망시켰던 것이다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"The problem was, 문제는 ~였다. that Rome's enemies were able to use these same roads, 로마의 적군들도 같은 길을 이용할 수 있었다는 것이고. to attack the Romans, 로마를 공격하는 데. weakening and eventually destroying the empire, 그래서 로마에게 타격을 주고 결국은 그 제국을 멸망시켰던 것이다. 이 문장 전체를 해석하면, 문제는 로마의 적군들도 같은 길을 로마를 공격하는 데 이용할 수 있었다는 것이고 그래서 로마에게 타격을 주고 결국은 그 제국을 멸망시켰던 것이다.","hl":"m"},{"n":22,"text":"이 문장은 앞에서 도로를 너무 잘 지었다고 말한 이유를 구체적으로 풀어 주는 부분이에요. 로마가 만든 길이 그대로 적군의 공격로가 되었다는 원인을 제시하고, 그래서 뒤에 나오는 역사의 아이러니로 자연스럽게 이어지죠. weakening은 약화되면서로 따로 끊지 말고 앞 절 전체의 결과로 묶어서 결국 제국을 약화시키고 멸망시켰다고 읽어 주세요.","hl":"mn"},{"n":23,"text":"첫 번째, The problem was 뒤에 that절이 와서 문제의 내용을 채워 주는 주격 보어 역할을 하고 있어요. 두 번째, were able to use는 be able to 다음에 동사원형이 와서 이용할 수 있었다는 능력을 나타내죠. 세 번째, to attack the Romans는 로마를 공격하기 위해라는 목적의 to부정사예요. 네 번째, weakening and eventually destroying the empire는 앞 절 전체를 받아 결과를 덧붙이는 분사구문이고, 의미상 주어가 Rome's enemies라는 점을 꼭 기억해 주세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">잘 만들어진 도로망이 없었더라면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Without \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">network \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">well-made \u003c/span>\u003cspan class=\"tgt\">roads\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공격군이 사용할 수 있도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">attacking \u003c/span>\u003cspan class=\"tgt\">armies \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">use\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 가능하다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">possible\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">로마 제국의 멸망이 모면될 수도 있었을 것이다\u003c/span>\u003cspan class=\"en\">that the fall of the Roman Empire \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">could \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">been \u003c/span>\u003cspan class=\"tgt\">avoided\u003c/span>(←accelerated).\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">공격군이 사용할 수 있도록 잘 만들어진 도로망이 없었더라면 로마 제국의 멸망이 모면될 수도 있었을 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 도로가 없었다면 로마의 멸망을 막을 수 있었을지도 모른다는 \u003cb class=\"key\">가정\u003c/b>을 담은 문장이에요. 길이 너무 잘 만들어져 적에게 이용당했다는 앞 문장의 흐름을 가정법으로 한 번 더 정리해 주는 역할을 하죠. avoided는 '모면되다'라는 뜻으로, 만약 accelerated가 들어가면 '앞당겨지다'가 되어 문장의 \u003cb class=\"key\">의미\u003c/b>가 정반대가 된다는 점도 함께 기억해 두세요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 Without을 이용한 가정법 표현\u003c/span> : Without + 명사 = If it had not been for + 명사 : \"잘 만들어진 도로망이 없었더라면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">for + 목적격 + to부정사(의미상 주어)\u003c/span> : for [목적격] + to + 동사원형 : \"공격군이 사용할 수 있도록\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">가주어 it / 진주어 that절\u003c/span> : It is + 형용사 + [that + 완전한 절] : \"~일 수도 있었을 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">가정법 과거완료 + 수동태\u003c/span> : could have been + 과거분사 : \"모면될 수도 있었을 것이다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Without a network of well-made roads, 잘 만들어진 도로망이 없었더라면. for attacking armies to use, 공격군이 사용할 수 있도록. it is possible, 그것은 가능하다. that the fall of the Roman Empire could have been avoided(←accelerated), 로마 제국의 멸망이 모면될 수도 있었을 것이다. 이 문장 전체를 해석하면, 공격군이 사용할 수 있도록 잘 만들어진 도로망이 없었더라면 로마 제국의 멸망이 모면될 수도 있었을 것이다.","hl":"m"},{"n":25,"text":"이 문장은 도로가 없었다면 로마의 멸망을 막을 수 있었을지도 모른다는 가정을 담고 있어요. 길이 너무 잘 만들어져서 적에게 이용당했다는 앞 문장의 흐름을 가정법으로 한 번 더 정리해 주는 역할이죠. avoided는 모면되다는 뜻이고, 만약 accelerated가 들어가면 앞당겨지다가 되어 의미가 정반대가 된다는 점도 함께 기억해 두세요.","hl":"mn"},{"n":26,"text":"첫 번째, Without a network of well-made roads는 if it had not been for로 바꿔 쓸 수 있는 가정법 표현이에요. 두 번째, for attacking armies to use는 for 다음에 목적격이 오고 to부정사가 붙어서 공격군이 사용하도록이라는 의미상 주어 구조를 만들어 줍니다. 세 번째, it is possible의 it은 가주어이고 진짜 주어는 뒤에 오는 that절이에요. 네 번째, could have been avoided는 가정법 과거완료에 수동태가 결합된 형태로 모면될 수도 있었을 것이라는 뜻을 만들어 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 대단한 역사상의 아이러니 가운데 하나이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">great \u003c/span>\u003cspan class=\"tgt\">ironies \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">history\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고대 로마인들의 도로 건설 재능이\u003c/span>\u003cspan class=\"en\">that the ancient Romans' \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">talent \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">building \u003c/span>\u003cspan class=\"tgt\">roads\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">궁극엔 그들 자신의 파멸을 이끌었다는 것은\u003c/span>\u003cspan class=\"en\">ultimately \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">led \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">own \u003c/span>\u003cspan class=\"tgt\">destruction\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">고대 로마인들의 도로 건설 재능이 궁극엔 그들 자신의 파멸을 이끌었다는 것은 대단한 역사상의 아이러니 가운데 하나이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글 전체를 마무리하는 \u003cb class=\"key\">결론\u003c/b> 문장이에요. 로마인들의 뛰어난 도로 건설 재능이 결과적으로 자기 제국을 무너뜨렸다는 역사의 \u003cb class=\"key\">역설\u003c/b>을 한 문장으로 정리하고 있죠. irony는 단순히 웃긴 상황이 아니라 기대와 정반대의 결과가 나오는 경우를 뜻한다는 점을 꼭 잡아 두세요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가주어 It / 진주어 that절\u003c/span> : It is + 명사구 + [that + 완전한 절] : \"그것은 역사상의 대단한 아이러니 가운데 하나이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 for + 동명사\u003c/span> : talent for + [동명사(-ing)] : \"도로를 짓는 재능\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">lead to + 명사\u003c/span> : lead to + [명사] : \"그들 자신의 파멸을 이끌었다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"It is one of the great ironies of history, 그것은 대단한 역사상의 아이러니 가운데 하나이다. that the ancient Romans' talent for building roads, 고대 로마인들의 도로 건설 재능이. ultimately led to their own destruction, 궁극엔 그들 자신의 파멸을 이끌었다는 것은. 이 문장 전체를 해석하면, 고대 로마인들의 도로 건설 재능이 궁극엔 그들 자신의 파멸을 이끌었다는 것은 대단한 역사상의 아이러니 가운데 하나이다.","hl":"m"},{"n":28,"text":"이 문장은 글 전체를 마무리하는 결론 문장이에요. 로마인들의 뛰어난 도로 건설 재능이 결과적으로 자기 제국을 무너뜨렸다는 역사의 역설을 한 문장으로 정리하고 있죠. irony는 단순히 웃긴 상황이 아니라 기대와 정반대의 결과가 나오는 경우라는 점을 꼭 잡아 주세요.","hl":"mn"},{"n":29,"text":"첫 번째, It is one of the great ironies of history에서 it은 가주어이고 진짜 주어는 뒤에 오는 that절이에요. 그래서 that절 내용이 역사상 대단한 아이러니 가운데 하나라는 뜻이 됩니다. 두 번째, talent for building roads에서 for 뒤에 동명사 building이 와서 도로를 짓는 것에 대한 재능이라는 의미를 만들어요. 세 번째, led to their own destruction에서 lead to의 to는 전치사라서 뒤에 명사가 온다는 점을 꼭 기억해 주세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>‘모든 길은 로마로 통한다’는 표현은 고대 로마인들의 뛰어난 \u003cb class=\"key\">도로 \u003c/b>\u003cb class=\"key\">건설\u003c/b> 솜씨를 보여 준다.\u003c/li>\u003cli>도로는 로마제국의 대 부대가 정복 전쟁에 나설 때 신속한 \u003cb class=\"key\">이동 \u003c/b>\u003cb class=\"key\">수단\u003c/b>이 되었다.\u003c/li>\u003cli>그러나 \u003cb class=\"key\">지나치게 \u003c/b>\u003cb class=\"key\">잘 \u003c/b>\u003cb class=\"key\">만들어진 \u003c/b>\u003cb class=\"key\">도로\u003c/b>는 적군에게도 이용되어 로마를 약화시키고 멸망시켰다.\u003c/li>\u003cli>로마의 도로 건설 재능이 결국 자신들의 \u003cb class=\"key\">파멸\u003c/b>을 이끌었다는 점이 역사의 큰 아이러니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The Romans' talent for building roads ultimately helped their enemies destroy the empire, which is one of history's great ironies.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">로마는 뛰어난 도로 건설 능력으로 대 부대를 신속히 이동시켜 정복 전쟁을 벌였지만, \u003cb class=\"key\">지나치게 \u003c/b>\u003cb class=\"key\">잘 \u003c/b>\u003cb class=\"key\">만들어진 \u003c/b>\u003cb class=\"key\">도로\u003c/b>를 적군도 그대로 이용하면서 결국 \u003cb class=\"key\">제국의 \u003c/b>\u003cb class=\"key\">멸망\u003c/b>을 맞았다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":30,"text":"오늘 글은 잘 만든 것이 때로는 나를 찌르는 칼이 될 수 있다는 걸 보여 줍니다. 도로 건설이라는 로마의 재능이 제국의 몰락으로 이어진 아이러니, 꼭 기억해 두세요. 시험에서는 But 뒤의 전환과 마지막 문장의 주제문을 특히 조심해서 읽으면 좋아요. 오늘 수업 여기까지입니다, 모두 수고했어요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
