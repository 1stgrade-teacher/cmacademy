<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SO 레벨1 11강 적용독해01 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-sno{font-size:13px;color:#8493A1;font-weight:700;margin-bottom:8px}

.lp-chunk{display:flex;flex-direction:column}
.lp-chunk .ko{font-size:13px;color:var(--pk-t);font-weight:700;line-height:1.3;margin-bottom:2px}
.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}
.lp-top::before{height:5px;background:linear-gradient(90deg,var(--pk) 0,var(--pk) 80%,var(--am) 80%,var(--am) 100%)}
.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}
.lp-tag{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700;padding:2px 12px}
.lp-qn{flex:0 0 112px;height:112px;align-self:center;background:#fff;color:var(--pk);border:3px solid var(--pk);border-radius:50%;font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;font-size:26px}
.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}
.lp-qn .qt{display:block;white-space:nowrap;line-height:1.12;letter-spacing:-.02em}
.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}

.lp-st h4{color:var(--ink,#1B2733)}
.lp-st h4 i{border-radius:4px;width:auto;min-width:24px;padding:0 4px}
.lp-pill{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700}
.lp-chain span.c{background:#fff;border:1px solid #AEBBE6;border-radius:3px;font-weight:600}

.lp-vg em{background:#fff;border:1px solid var(--pk-b);border-radius:3px}
.lp-sa>div{border-radius:4px;border-color:var(--pk-b)}

.lp-chips .s{border:1px solid #AEBBE6;color:#3A4FA3}
.lp-chips .a{border:1px solid var(--am-b);color:var(--am-d);background:#FFFBF2}
.lp-sno .es{background:var(--am);border-radius:2px;font-weight:700}
.lp-chunk .en{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:600}
.lp-chunk+.lp-chunk{border-left:1px solid var(--pk-b)}
.lp .tgt{background:var(--am-l);border-bottom:2.5px dotted var(--am)}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"SO 레벨1 11강 적용독해01","audioDir":"11-01_audio","preview":false,"count":34,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">11강\u003cbr>적용독해01\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">SO 레벨1\u003c/div>\u003ch1>Downshifting to a Simpler Life in the Countryside\u003c/h1>\u003ch2>시골에서의 더 단순한 삶으로의 다운시프트\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>런던의 대부분의 근로자는 커다란 집과 멋진 차를 꿈꾸지만, 영국 근로자의 6퍼센트는 그런 삶이 더 이상 \u003cb class=\"key\">꼭 \u003c/b>\u003cb class=\"key\">필요한 \u003c/b>\u003cb class=\"key\">것\u003c/b>으로 보이지 않아 \u003cb class=\"key\">삶의 \u003c/b>\u003cb class=\"key\">속도를 \u003c/b>\u003cb class=\"key\">줄이기\u003c/b>로 한다. 그들은 시골에서 단순하게 살며 작은 집과 뜰, 자전거를 즐기고, 시골생활이 자신들을 훨씬 더 행복하게 만들었다고 생각한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Some workers leave their big houses, nice cars and good jobs behind to downshift, and they find greater happiness in a simpler country life.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 런던의 근로자들이 도시의 화려한 삶을 뒤로하고 시골로 향하는 이야기예요. 내용을 한 줄로 정리하면, 일부 근로자들이 삶의 속도를 줄이는 선택을 통해 더 단순한 삶에서 행복을 찾는다는 거죠. 그럼 지문을 함께 꼼꼼히 뜯어 보면서 요지와 흐름을 잡아 볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">\u003cb class=\"key\">다운시프트\u003c/b>는 더 많은 돈이나 지위를 좇는 대신 일과 소비를 줄여 시간과 여유를 얻는 삶의 방식입니다. 영국은 주당 근무 시간이 길고 집값이 비싸서 높은 소득을 위해 \u003cb class=\"key\">과로\u003c/b>를 택하는 사람이 많습니다. 그런데 소득이 늘어도 \u003cb class=\"key\">삶의 \u003c/b>\u003cb class=\"key\">질\u003c/b>이 좋아지지 않는다면 그 선택을 다시 생각해 볼 수 있겠죠. 그래서 요즘은 워라밸(work-life balance)이나 미니멀리즘(minimalism)이라는 말을 자주 씁니다. 자동차로 막힌 도로를 달리는 것보다 자전거로 시골길을 달리는 게 더 즐거울 수 있다는 것이고, 이는 비싼 명품 가방 대신 가벼운 가방 하나로 여행을 떠나는 것과 비슷합니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식부터 짚고 갈게요. 다운시프트는 돈이나 지위를 더 좇기보다 일과 소비를 줄여서 시간과 여유를 얻는 삶의 방식을 말해요. 영국은 주당 근무 시간이 길고 집값도 비싸서, 높은 소득을 위해 과로를 택하는 사람이 많아요. 그런데 소득이 늘어도 삶의 질이 좋아지지 않는다면 그 선택을 다시 생각해 볼 수 있겠죠. 그래서 요즘은 워라밸이나 미니멀리즘 같은 말을 자주 씁니다. 자동차로 막힌 도로를 달리는 것보다 자전거로 시골길을 달리는 게 더 즐거울 수 있다는 거예요. 비싼 명품 가방 대신 가벼운 가방 하나로 여행을 떠나는 것과 비슷한 이치죠.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>도시의 꿈\u003csmall>통념 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>런던의 대부분의 근로자는 주당 쉰 시간씩 많은 시간을 근무하며 커다란 집과 멋진 차, 집안일을 모두 해 줄 가정부를 꿈꿉니다. 하지만 영국 근로자의 육 퍼센트에게는 결코 많은 시간을 보내지 못하는 집이나 교통체증으로 늘 막히는 차가 더 이상 \u003cb class=\"key\">꼭 \u003c/b>\u003cb class=\"key\">필요한 \u003c/b>\u003cb class=\"key\">것\u003c/b>으로 보이지 않습니다. 앞부분은 이렇게 일반적인 \u003cb class=\"key\">통념\u003c/b>을 제시합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>삶의 전환\u003csmall>주장 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>자신들이 잘 살고 있지 못하다고 느낀 이들 근로자는 \u003cb class=\"key\">삶의 \u003c/b>\u003cb class=\"key\">속도를 \u003c/b>\u003cb class=\"key\">줄이기\u003c/b>로 했습니다. 그들은 커다란 집과 멋진 차, 심지어 좋은 직업에도 \u003cb class=\"key\">안녕을 \u003c/b>\u003cb class=\"key\">고하고\u003c/b> 시골에서 보다 단순하게 살기로 결심합니다. 여기서 이 글의 \u003cb class=\"key\">주제\u003c/b>가 분명하게 드러납니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>적응의 시간\u003csmall>근거 · 문장 5\u003c/small>\u003c/h4>\u003cp>새로운 생활에 \u003cb class=\"key\">익숙해지는 \u003c/b>\u003cb class=\"key\">데\u003c/b>는 약간의 시간이 필요했습니다. 삶의 방식을 바꾸는 일이 하루아침에 이루어지지는 않는다는 뜻입니다. 짧지만 이 문장은 앞의 \u003cb class=\"key\">전환\u003c/b>을 자연스럽게 뒷받침합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>시골의 일상\u003csmall>예시 · 문장 6\u003c/small>\u003c/h4>\u003cp>그들 대부분은 일주일에 한 번씩 이웃과 디너파티가 벌어지는 \u003cb class=\"key\">작은 \u003c/b>\u003cb class=\"key\">집\u003c/b>, 당근과 양배추를 키우는 \u003cb class=\"key\">뜰\u003c/b>, 확 트인 시골길을 따라 달릴 수 있는 \u003cb class=\"key\">자전거\u003c/b>를 즐깁니다. 앞에서 버린 커다란 집·멋진 차와 정확히 대비되는 구체적인 예시들입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>더 행복해진 삶\u003csmall>결론 · 문장 7\u003c/small>\u003c/h4>\u003cp>그들은 시골생활이 자신들을 훨씬 더 행복하게 만들었다고 생각합니다. 결국 이 글은 물질의 크기가 아니라 \u003cb class=\"key\">행복\u003c/b>이라는 감정적 결과로 마무리됩니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 다섯 단계로 나눠서 살펴볼게요.","hl":null},{"n":4,"text":"먼저 도시의 꿈 단계예요. 런던의 근로자들은 커다란 집과 멋진 차, 집안일을 다 해 줄 가정부를 꿈꾸죠. 그런데 영국 근로자의 육 퍼센트에게는 그런 집과 차가 더 이상 꼭 필요한 것으로 보이지 않는다고 해요. 여기까지가 일반적인 통념을 보여 주는 부분입니다.","hl":"f0"},{"n":5,"text":"다음은 삶의 전환 단계예요. 자신들이 잘 살고 있지 못하다고 느낀 근로자들이 삶의 속도를 줄이기로 결심합니다. 커다란 집과 멋진 차, 심지어 좋은 직업에도 안녕을 고하고 시골에서 단순하게 살기로 한 거죠. 바로 여기서 이 글의 주제가 드러납니다.","hl":"f1"},{"n":6,"text":"세 번째는 적응의 시간 단계예요. 새로운 생활에 익숙해지는 데는 약간의 시간이 필요했다고 하죠. 삶의 방식을 바꾸는 일이 하루아침에 끝나지는 않는다는 뜻이에요. 짧은 문장이지만 이 전환을 든든하게 받쳐 주는 근거가 됩니다.","hl":"f2"},{"n":7,"text":"네 번째는 시골의 일상 단계예요. 그들은 일주일에 한 번 이웃과 디너파티가 열리는 작은 집을 즐기고, 당근과 양배추를 키우는 뜰도 즐깁니다. 그리고 확 트인 시골길을 달릴 수 있는 자전거도 즐기죠. 앞에서 버린 커다란 집과 멋진 차에 정확히 대응되는 예시들이에요.","hl":"f3"},{"n":8,"text":"마지막은 더 행복해진 삶 단계예요. 그들은 시골생활이 자신들을 훨씬 더 행복하게 만들었다고 생각합니다. 결국 이 글은 물질의 크기가 아니라 행복이라는 감정으로 끝을 맺는 거예요.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">통념-반박\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 3번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장과 두 번째 문장에서 커다란 집과 멋진 차를 꿈꾸는 \u003cb class=\"key\">통념\u003c/b>을 먼저 제시합니다. 그러나 세 번째 문장에서 자신들이 잘 살고 있지 못하다고 느꼈다며 이를 뒤집고 \u003cb class=\"key\">삶의 \u003c/b>\u003cb class=\"key\">속도를 \u003c/b>\u003cb class=\"key\">줄이기\u003c/b>라는 주장을 내세웁니다. 이어 다섯 번째와 여섯 번째 문장에서 적응 과정과 시골 일상의 예시를 들고, 마지막 문장에서 더 행복해졌다는 결론으로 마무리합니다. 주제문이 글의 중간에 놓여 있으므로 \u003cb class=\"key\">중괄식\u003c/b>으로 판단할 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>But (2)\u003c/b>\u003cspan>통념 전환\u003c/span>\u003cb>Feeling they were not living a good life (3)\u003c/b>\u003cspan>전환의 이유 제시\u003c/span>\u003cb>even (4)\u003c/b>\u003cspan>극단적 선택 강조\u003c/span>\u003cb>But (6)\u003c/b>\u003cspan>예시로의 전환\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">a big house, a nice car and a housekeeper\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">having a big house and a nice car\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">downshift\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">live a simpler life in the countryside\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a cottage, a garden, and bicycles\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">country life\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>도시의 삶\u003c/th>\u003cth>시골의 삶\u003c/th>\u003c/tr>\u003ctr>\u003ctd>커다란 집·멋진 차·가정부\u003c/td>\u003ctd>작은 집·뜰·자전거\u003c/td>\u003c/tr>\u003ctr>\u003ctd>교통체증과 집안일\u003c/td>\u003ctd>이웃과의 디너파티, 텃밭 가꾸기\u003c/td>\u003c/tr>\u003ctr>\u003ctd>시간에 쫓기고 불만족\u003c/td>\u003ctd>단순하지만 더 행복\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글은 통념을 먼저 제시하고 그것을 뒤집는 통념 반박 구조예요. 도시의 화려한 삶을 꿈꾼다는 일반적인 생각을 앞에 놓고, 그 뒤에서 그런 삶이 더 이상 꼭 필요한 것이 아니라고 말하죠. 주제문이 글의 중간에 있으니까 중괄식이라고 정리할 수 있어요. 그래서 첫 두 문장은 배경으로 가볍게 읽고, 세 번째 문장부터 힘을 줘서 읽으면 됩니다.","hl":"ty"},{"n":10,"text":"신호어를 짚어 볼게요. 두 번째 문장은 But으로 시작하면서 앞의 통념을 곧바로 뒤집어요. 세 번째 문장에서는 자신들이 잘 살고 있지 못하다고 느꼈다는 표현으로 전환의 이유를 대 주고요. 네 번째 문장의 even은 좋은 직업까지 포기했다는 점을 강조하는 장치예요. 그리고 여섯 번째 문장에서도 But이 나오는데, 여기서는 새로운 삶의 예시 쪽으로 방향을 틀어 줍니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>worker\u003c/b>\u003cem>명사\u003c/em>\u003cspan>근로자\u003c/span>\u003c/div>\u003cdiv>\u003cb>dream of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 꿈꾸다\u003c/span>\u003c/div>\u003cdiv>\u003cb>housekeeper\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가정부\u003c/span>\u003c/div>\u003cdiv>\u003cb>household\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>가정의, 집안의\u003c/span>\u003c/div>\u003cdiv>\u003cb>chore\u003c/b>\u003cem>명사\u003c/em>\u003cspan>집안일\u003c/span>\u003c/div>\u003cdiv>\u003cb>spend\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(시간을) 보내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>essential\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>필수적인, 꼭 필요한\u003c/span>\u003c/div>\u003cdiv>\u003cb>stuck\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>막힌, 꼼짝 못 하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>traffic\u003c/b>\u003cem>명사\u003c/em>\u003cspan>교통, 교통체증\u003c/span>\u003c/div>\u003cdiv>\u003cb>downshift\u003c/b>\u003cem>동사\u003c/em>\u003cspan>삶의 속도를 줄이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>countryside\u003c/b>\u003cem>명사\u003c/em>\u003cspan>시골, 전원\u003c/span>\u003c/div>\u003cdiv>\u003cb>say goodbye to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에게 안녕을 고하다, 포기하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>get used to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 익숙해지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>cottage\u003c/b>\u003cem>명사\u003c/em>\u003cspan>작은 시골집, 오두막\u003c/span>\u003c/div>\u003cdiv>\u003cb>dinner party\u003c/b>\u003cem>명사\u003c/em>\u003cspan>디너파티\u003c/span>\u003c/div>\u003cdiv>\u003cb>take place\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>일어나다, 열리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>neighbor\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이웃\u003c/span>\u003c/div>\u003cdiv>\u003cb>garden\u003c/b>\u003cem>명사\u003c/em>\u003cspan>정원, 뜰\u003c/span>\u003c/div>\u003cdiv>\u003cb>grow\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(식물을) 키우다\u003c/span>\u003c/div>\u003cdiv>\u003cb>carrot\u003c/b>\u003cem>명사\u003c/em>\u003cspan>당근\u003c/span>\u003c/div>\u003cdiv>\u003cb>cabbage\u003c/b>\u003cem>명사\u003c/em>\u003cspan>양배추\u003c/span>\u003c/div>\u003cdiv>\u003cb>bicycle\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자전거\u003c/span>\u003c/div>\u003cdiv>\u003cb>ride\u003c/b>\u003cem>동사\u003c/em>\u003cspan>타다, 달리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>wide-open\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>확 트인\u003c/span>\u003c/div>\u003cdiv>\u003cb>country road\u003c/b>\u003cem>명사\u003c/em>\u003cspan>시골길\u003c/span>\u003c/div>\u003cdiv>\u003cb>happy\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>행복한\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"단어도 몇 개만 짚고 갈게요. essential은 꼭 필요한이라는 뜻이고, be stuck in traffic은 교통체증으로 꼼짝 못 한다는 표현이에요. downshift는 삶의 속도를 줄이다, get used to는 익숙해지다는 뜻으로 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">essential\u003c/b>\u003cspan class=\"m\">필수적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">necessary\u003c/span>\u003cspan class=\"s\">vital\u003c/span>\u003cspan class=\"s\">crucial\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unnecessary\u003c/span>\u003cspan class=\"a\">optional\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">stuck\u003c/b>\u003cspan class=\"m\">막힌\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">jammed\u003c/span>\u003cspan class=\"s\">blocked\u003c/span>\u003cspan class=\"s\">caught\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">free\u003c/span>\u003cspan class=\"a\">moving\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">downshift\u003c/b>\u003cspan class=\"m\">삶의 속도를 줄이다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">simplify\u003c/span>\u003cspan class=\"s\">slow down\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">speed up\u003c/span>\u003cspan class=\"a\">accelerate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">simple\u003c/b>\u003cspan class=\"m\">단순한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">plain\u003c/span>\u003cspan class=\"s\">basic\u003c/span>\u003cspan class=\"s\">uncomplicated\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">complex\u003c/span>\u003cspan class=\"a\">complicated\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">get used to\u003c/b>\u003cspan class=\"m\">~에 익숙해지다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">adapt to\u003c/span>\u003cspan class=\"s\">adjust to\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">enjoy\u003c/b>\u003cspan class=\"m\">즐기다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">relish\u003c/span>\u003cspan class=\"s\">appreciate\u003c/span>\u003cspan class=\"s\">delight in\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">dislike\u003c/span>\u003cspan class=\"a\">hate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">take place\u003c/b>\u003cspan class=\"m\">열리다, 일어나다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">happen\u003c/span>\u003cspan class=\"s\">occur\u003c/span>\u003cspan class=\"s\">be held\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"비슷한 말과 반대말도 함께 정리해 볼게요. essential의 동의어는 necessary, vital이고 반의어는 unnecessary예요. stuck은 jammed, blocked와 비슷하고 free와는 반대됩니다. simple은 plain, basic과 가깝고 complex, complicated와는 반대죠. get used to는 adapt to, adjust to로 바꿔 쓸 수 있고, enjoy는 relish, appreciate와 비슷해요. take place는 happen, occur와 같은 뜻으로 알아 두면 좋습니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">주당 50 시간씩 많은 시간을 근무하면서,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Working \u003c/span>\u003cspan class=\"tgt\">fifty \u003c/span>\u003cspan class=\"tgt\">long \u003c/span>\u003cspan class=\"tgt\">hours \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">week\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">런던의 대부분의 근로자들은\u003c/span>\u003cspan class=\"en\">most workers in London\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">커다란 집을 꿈꾼다,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">dream \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">big \u003c/span>\u003cspan class=\"tgt\">house\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">멋진 차,\u003c/span>\u003cspan class=\"en\">a nice car\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 가정부를\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">housekeeper \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 집안일을 해줄\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">all \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">household \u003c/span>\u003cspan class=\"tgt\">chores\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">주당 50 시간씩 많은 시간을 근무하는 런던의 대부분의 근로자들은 커다란 집과 멋진 차, 그리고 집안일을 모두 해줄 가정부를 꿈꾼다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 런던 근로자들이 꿈꾸는 전형적인 삶의 기준을 제시하는 문장이에요. 오래 일하는 만큼 \u003cb class=\"key\">큰 \u003c/b>\u003cb class=\"key\">집\u003c/b>과 \u003cb class=\"key\">멋진 \u003c/b>\u003cb class=\"key\">차\u003c/b>, 집안일을 대신해 줄 가정부를 바란다는 일반적인 인식을 먼저 깔아 두는 거죠. 뒤에서 소수의 근로자가 이 기준을 버린다는 내용과 \u003cb class=\"key\">대조\u003c/b>를 이루도록 준비하는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">분사구문(현재분사, ~하면서)\u003c/span> : [[현재분사]] Working + 주절의 주어 most workers (능동 관계) : \"주당 50 시간씩 많은 시간을 근무하면서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 of + 명사(꿈꾸는 대상)\u003c/span> : dream [자동사] + [[of]] + 명사구 a big house : \"커다란 집을 꿈꾼다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법(명사 수식)\u003c/span> : 명사 a housekeeper + [[to do]] (to부정사구가 앞의 명사를 수식) : \"모든 집안일을 해줄 가정부\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"Working fifty long hours a week, 주당 50 시간씩 많은 시간을 근무하면서. most workers in London, 런던의 대부분의 근로자들은. dream of a big house, 커다란 집을 꿈꾼다. a nice car, 멋진 차. and a housekeeper, 그리고 가정부를. to do all the household chores, 모든 집안일을 해줄. 이 문장 전체를 해석하면, 주당 50 시간씩 많은 시간을 근무하는 런던의 대부분의 근로자들은 커다란 집과 멋진 차, 그리고 집안일을 모두 해줄 가정부를 꿈꾼다.","hl":"m"},{"n":14,"text":"이 문장은 런던 근로자들이 꿈꾸는 전형적인 삶의 기준을 제시해요. 오래 일하는 만큼 큰 집과 멋진 차, 그리고 집안일을 대신해 줄 가정부를 바란다는 일반적인 인식을 깔아 두는 거죠. 뒤에서 소수의 근로자가 이 기준을 버린다는 내용과 대조를 이루도록 준비하는 역할을 한답니다.","hl":"mn"},{"n":15,"text":"첫 번째로 문장 앞에 나온 Working fifty long hours a week를 보세요. 주어와 시제가 없는 분사구문이라서 주절의 주어인 most workers가 일하는 주체라는 걸 자연스럽게 연결해 줍니다. 두 번째로 dream of a big house에서 dream은 전치사 of와 함께 쓰여 '~을 꿈꾸다'라는 표현을 만든다는 점을 기억하세요. 세 번째로 to do all the household chores는 앞에 있는 a housekeeper를 꾸며 주는 형용사적 용법의 to부정사예요. 그래서 '모든 집안일을 해 줄 가정부'라는 뜻이 된답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 영국의 근로자 6 %에게는,\u003c/span>\u003cspan class=\"en\">But for six percent of the workers in England,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">결코 많은 시간을 보내지 못하는 커다란 집을 가지고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">having \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">big \u003c/span>\u003cspan class=\"tgt\">house\u003c/span>/ \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">where \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">never \u003c/span>\u003cspan class=\"tgt\">spend \u003c/span>\u003cspan class=\"tgt\">much \u003c/span>\u003cspan class=\"tgt\">time\u003c/span>/\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 교통체증으로 늘 막히는 멋진 차를 가지고\u003c/span>\u003cspan class=\"en\">and a nice car/ \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">always \u003c/span>\u003cspan class=\"tgt\">stuck \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">traffic\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">있다는 게 더 이상 꼭 필요한 것으로 보이지 않는다.\u003c/span>\u003cspan class=\"en\">just \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">doesn't \u003c/span>\u003cspan class=\"tgt\">seem \u003c/span>\u003cspan class=\"tgt\">essential\u003c/span> anymore.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 영국의 근로자 6 %에게는, 결코 많은 시간을 보내지 못하는 커다란 집이나 교통체증으로 늘 막히는 멋진 차가 있다는 게 더 이상 꼭 필요한 것으로 보이지 않는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 큰 집과 멋진 차가 더 이상 꼭 필요한 것이 아니라고 말하며 앞 문장의 일반적 기준을 \u003cb class=\"key\">반박\u003c/b>하는 문장이에요. having에서 시작하는 긴 동명사구가 주어라서 a nice car까지를 한 덩어리로 묶어 읽는 게 핵심이죠. 영국 근로자의 6 %라는 소수 집단의 시각을 내세우며 글의 방향을 \u003cb class=\"key\">전환\u003c/b>합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사 주어(having ~)\u003c/span> : [[동명사]] having + 목적어 → 문장의 주어(단수 취급) : \"커다란 집을 가지고 있는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관계부사 where\u003c/span> : 선행사 a big house + [[where]] + 완전한 절 : \"결코 많은 시간을 보내지 못하는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that + 수동태\u003c/span> : 선행사 a nice car + [[that]] + is stuck (be + p.p.) : \"교통체증으로 늘 막히는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">seem + 형용사 보어\u003c/span> : 주어 + [[seem]] + 형용사 essential : \"꼭 필요한 것으로 보이지 않는다\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"But for six percent of the workers in England, 하지만 영국의 근로자 6 %에게는. having a big house/ where they never spend much time/, 결코 많은 시간을 보내지 못하는 커다란 집을 가지고. and a nice car/ that is always stuck in traffic, 그리고 교통체증으로 늘 막히는 멋진 차를 가지고. just doesn't seem essential anymore, 있다는 게 더 이상 꼭 필요한 것으로 보이지 않는다.. 이 문장 전체를 해석하면, 하지만 영국의 근로자 6 %에게는, 결코 많은 시간을 보내지 못하는 커다란 집이나 교통체증으로 늘 막히는 멋진 차가 있다는 게 더 이상 꼭 필요한 것으로 보이지 않는다.","hl":"m"},{"n":17,"text":"이 문장은 큰 집과 멋진 차가 더 이상 꼭 필요한 것이 아니라고 말하면서 앞 문장의 일반적 기준을 반박해요. having에서 시작하는 긴 동명사구가 주어라서 a nice car까지를 하나의 덩어리로 묶어 읽는 게 핵심이죠. 영국 근로자의 육 퍼센트라는 소수 집단의 시각을 제시하면서 글의 방향을 전환하는 역할을 합니다.","hl":"mn"},{"n":18,"text":"첫 번째 어법은 having a big house예요. having 이하 전체가 문장의 주어로 쓰인 동명사구이고, 동명사구 주어는 단수로 보기 때문에 뒤에 doesn't seem이 오는 거죠. 두 번째는 where they never spend much time인데, 앞의 a big house를 받으면서 뒤에 완전한 절이 오니까 관계부사 where를 씁니다. 세 번째는 that is always stuck in traffic으로, 앞의 a nice car를 받는 주격 관계대명사 that과 be stuck in의 수동태가 함께 쓰였어요. 네 번째는 doesn't seem essential인데, seem은 형용사를 보어로 데려오는 동사라서 '꼭 필요한 것으로 보이지 않는다'로 해석한답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">느끼면서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Feeling\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신들이 잘 살고 있지 못하다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">living \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">good \u003c/span>\u003cspan class=\"tgt\">life\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이들 근로자들은\u003c/span>\u003cspan class=\"en\">these workers\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">삶을 (속도, 규모 등에서) 줄이기로 했다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">decided \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">downshift\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">자신들이 잘 살고 있지 못하다고 느낀 이들 근로자들은 삶을 (속도, 규모 등에서) 줄이기로 했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 제시된 문제의식이 실제 \u003cb class=\"key\">행동\u003c/b>으로 이어지는 문장이에요. '잘 살지 못한다'는 \u003cb class=\"key\">자각\u003c/b>이 이들 근로자를 downshift, 즉 삶의 속도와 규모를 줄이는 선택으로 이끌었다는 흐름이죠. 글의 \u003cb class=\"key\">전환점\u003c/b>에서 주제어 downshift가 처음 등장한다는 점도 중요합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">분사구문(현재분사, 이유)\u003c/span> : [[현재분사]] Feeling + 목적어절 → 주절 주어 these workers와 동일 주어 : \"느끼면서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 that이 생략된 목적어절\u003c/span> : Feeling + (that) + [[주어]] they + were not living + 목적어 : \"자신들이 잘 살고 있지 못하다고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">현재완료 + to부정사 목적어\u003c/span> : have decided ([[현재완료]]) + [[to downshift]] (to부정사 목적어) : \"삶을 줄이기로 했다\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"Feeling, 느끼면서. they were not living a good life, 자신들이 잘 살고 있지 못하다고. these workers, 이들 근로자들은. have decided to downshift, 삶을 (속도, 규모 등에서) 줄이기로 했다.. 이 문장 전체를 해석하면, 자신들이 잘 살고 있지 못하다고 느낀 이들 근로자들은 삶을 (속도, 규모 등에서) 줄이기로 했다.","hl":"m"},{"n":20,"text":"이 문장은 앞에서 제시된 문제의식이 실제 행동으로 이어지는 대목이에요. 잘 살지 못한다는 자각이 이들 근로자를 downshift, 즉 삶의 속도와 규모를 줄이는 선택으로 이끌었다는 흐름이죠. 글의 전환점에서 주제어인 downshift가 처음 등장한다는 점도 꼭 기억해 두세요.","hl":"mn"},{"n":21,"text":"첫 번째는 문장 앞의 Feeling이에요. 접속사와 주어를 생략하고 동사를 현재분사로 바꾼 분사구문으로, 주절의 주어인 these workers가 느끼는 주체라서 능동형으로 쓴 거죠. 두 번째는 they were not living a good life인데, feel의 목적어 자리에 접속사 that이 생략된 완전한 절이 온 형태예요. 세 번째는 have decided to downshift로, decide는 to부정사를 목적어로 데려오는 동사이고 현재완료가 붙어 지금까지 이어진 결정을 보여 준답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 커다란 집에 안녕을 고했다,\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">said \u003c/span>\u003cspan class=\"tgt\">goodbye \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">big \u003c/span>\u003cspan class=\"tgt\">house\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">멋진 차, 심지어 좋은 직업에까지\u003c/span>\u003cspan class=\"en\">nice car, and \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">even\u003c/span> to the good jobs\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보다 단순하게 살기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">live \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">simpler \u003c/span>\u003cspan class=\"tgt\">life\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시골에서\u003c/span>\u003cspan class=\"en\">in the countryside.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 시골에서 보다 단순하게 살기 위해 커다란 집과 멋진 차, 심지어 좋은 직업에까지 안녕을 고했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 다운시프트를 결심한 사람들이 실제로 무엇을 포기했는지 보여 주는 문장입니다. said goodbye to는 '~에게 안녕을 고하다', 곧 \u003cb class=\"key\">포기하다\u003c/b>라는 뜻으로 집·차·직업을 \u003cb class=\"key\">병렬\u003c/b>로 나열하며 강조합니다. 맨 뒤의 to live는 '살기 위해'라는 \u003cb class=\"key\">목적\u003c/b>의 to부정사로, 포기의 이유를 알려 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">say goodbye to + 명사(전치사 to의 목적어)\u003c/span> : say goodbye [to + 목적어] / say goodbye to + 명사 → ~와 작별하다 : \"커다란 집에 안녕을 고했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">강조 부사 even\u003c/span> : even + [강조할 대상] → 심지어 ~까지 : \"심지어 ~에까지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : [to + 동사원형] + 목적어 → ~하기 위해 : \"보다 단순하게 살기 위해\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"They said goodbye to the big house, 그들은 커다란 집에 안녕을 고했다. nice car, and even to the good jobs, 멋진 차, 심지어 좋은 직업에까지. to live a simpler life, 보다 단순하게 살기 위해. in the countryside, 시골에서. 이 문장 전체를 해석하면, 그들은 시골에서 보다 단순하게 살기 위해 커다란 집과 멋진 차, 심지어 좋은 직업에까지 안녕을 고했다.","hl":"m"},{"n":23,"text":"이 문장은 다운시프트를 결심한 사람들이 무엇을 포기했는지 보여 줘요. said goodbye to는 안녕을 고하다, 즉 포기하다라는 뜻으로 집과 차와 직업을 병렬로 죽 나열하죠. 그리고 맨 뒤의 to live는 왜 그렇게 살려고 하는지 목적을 알려 주는 부분이에요.","hl":"mn"},{"n":24,"text":"첫 번째로 say goodbye to는 to가 ~에게라는 방향을 이끌어서 ~에게 작별을 고하다, 즉 포기하다라는 관용 표현이에요. 두 번째로 even은 심지어라는 강조 부사예요. 앞의 내용에 하나를 더 첨가하면서 좋은 직업까지 버렸다는 점을 콕 집어 주죠. 세 번째로 to live a simpler life는 목적을 나타내는 to부정사이고, live 뒤에 a simpler life가 목적어로 와요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 새로운 생활에 익숙해지는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Getting \u003c/span>\u003cspan class=\"tgt\">used \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">new \u003c/span>\u003cspan class=\"tgt\">lives\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">약간의 시간이 필요했다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">taken \u003c/span>\u003cspan class=\"tgt\">some \u003c/span>\u003cspan class=\"tgt\">time\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">새로운 생활에 익숙해지는 데는 약간의 시간이 필요했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 새로운 삶에 적응하는 데 시간이 걸렸음을 솔직하게 \u003cb class=\"key\">인정\u003c/b>하는 문장입니다. \u003cb class=\"key\">Getting \u003c/b>\u003cb class=\"key\">used \u003c/b>\u003cb class=\"key\">to\u003c/b>는 동명사구로 문장의 \u003cb class=\"key\">주어\u003c/b>가 되고, 그 주어를 단수로 보아 has taken이 이어집니다. 변화가 한 번에 이루어지지 않았다는 점을 짚어 주며 다음 문장의 '하지만'으로 흐름을 넘겨 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사구 주어\u003c/span> : [Getting used to + 명사 (동명사구)] + [has taken (단수 동사)] : \"그들의 새로운 생활에 익숙해지는 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재완료(have + p.p.)\u003c/span> : have/has + [p.p.] + 목적어 → ~해 왔다, ~했다 : \"약간의 시간이 필요했다\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"Getting used to their new lives, 그들의 새로운 생활에 익숙해지는 것은. has taken some time, 약간의 시간이 필요했다.. 이 문장 전체를 해석하면, 새로운 생활에 익숙해지는 데는 약간의 시간이 필요했다.","hl":"m"},{"n":26,"text":"새로운 삶에 적응하는 데 시간이 걸렸다는 걸 솔직하게 인정하는 문장이에요. 다운시프트가 한 번에 잘된 게 아니라 적응에 시간이 필요했다는 흐름을 만들어 주죠.","hl":"mn"},{"n":27,"text":"첫 번째, Getting used to their new lives는 익숙해지는 것이라는 행위를 주어로 만든 동명사구예요. 동명사구 주어는 단수로 보기 때문에 뒤에 has taken이 와요. 두 번째, has taken은 현재완료로, 과거에 시작된 일이 지금까지 이어져 시간이 걸려 왔다는 뜻을 만들어 줍니다. 참고로 get used to는 익숙해지다, be used to는 익숙하다라는 차이가 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 그들 대부분은 즐긴다\u003c/span>\u003cspan class=\"en\">But most of them enjoy\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일주일에 한 번씩 이웃과 디너파티가 벌어지는 작은 집,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">cottage \u003c/span>\u003cspan class=\"tgt\">where \u003c/span>\u003cspan class=\"tgt\">dinner \u003c/span>\u003cspan class=\"tgt\">parties \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">neighbors \u003c/span>\u003cspan class=\"tgt\">take \u003c/span>\u003cspan class=\"tgt\">place \u003c/span>\u003cspan class=\"tgt\">once \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">week\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신들이 당근과 양배추를 키우는 뜰,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">garden \u003c/span>\u003cspan class=\"tgt\">where \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">grow \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">carrots \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">cabbages\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그들이 탈 수 있는 자전거를\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">bicycles \u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">ride\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">확 트인 시골길을 따라\u003c/span>\u003cspan class=\"en\">along wide-open country roads.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 그들 대부분은 일주일에 한 번씩 이웃과 디너파티가 벌어지는 작은 집, 자신들이 당근과 양배추를 키우는 뜰, 그리고 확 트인 시골길을 따라 달릴 수 있는 자전거를 즐긴다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> But으로 도시 생활과 \u003cb class=\"key\">대조\u003c/b>하며, 다운시프트한 사람들이 얻은 소박한 삶의 모습을 세 가지로 \u003cb class=\"key\">병렬\u003c/b> 나열합니다. cottage, garden, bicycles 뒤에 각각 where, where, that의 \u003cb class=\"key\">관계사\u003c/b>가 붙어 설명을 덧붙입니다. 작은 집·텃밭·자전거라는 구체적인 대상으로 도시의 큰 집·멋진 차와 대비되는 행복을 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계부사 where\u003c/span> : [장소 명사] + where + [주어 + 동사 + (수식어)] → ~하는 장소 : \"일주일에 한 번씩 이웃과 디너파티가 벌어지는 작은 집\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관계부사 where(두 번째)\u003c/span> : [장소 명사] + where + [주어 + 동사 + 목적어] : \"자신들이 당근과 양배추를 키우는 뜰\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">등위접속사 and의 병렬\u003c/span> : [명사 A] + and + [명사 B] : \"당근과 양배추\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 that\u003c/span> : [선행사] + that + [주어 + 동사] (that = 목적어) : \"그들이 탈 수 있는 자전거\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"But most of them enjoy, 하지만 그들 대부분은 즐긴다. a cottage where dinner parties with neighbors take place once a week, 일주일에 한 번씩 이웃과 디너파티가 벌어지는 작은 집. a garden where they grow carrots and cabbages, 자신들이 당근과 양배추를 키우는 뜰. and bicycles that they can ride, 그리고 그들이 탈 수 있는 자전거를. along wide-open country roads, 확 트인 시골길을 따라. 이 문장 전체를 해석하면, 하지만 그들 대부분은 일주일에 한 번씩 이웃과 디너파티가 벌어지는 작은 집, 자신들이 당근과 양배추를 키우는 뜰, 그리고 확 트인 시골길을 따라 달릴 수 있는 자전거를 즐긴다.","hl":"m"},{"n":29,"text":"But으로 시작해서 도시 생활과 대조되는 소박한 삶의 모습을 보여 주는 문장이에요. 작은 집, 텃밭, 자전거 이렇게 세 가지를 병렬로 나란히 놓고 각각에 관계사로 설명을 붙였죠. 그래서 도시의 큰 집이나 멋진 차보다 훨씬 단순하고 여유로운 삶이 그려집니다.","hl":"mn"},{"n":30,"text":"첫 번째, a cottage 뒤의 where는 앞의 장소 명사를 선행사로 받아서 그곳에서 일주일에 한 번 이웃과 디너파티가 열린다는 설명을 보충해 줘요. where 뒤에는 빠진 성분이 없는 완전한 절이 온다는 점을 기억하세요. 두 번째, a garden where도 장소를 설명하는 where이고 앞의 cottage와 병렬로 이어지는 목적어예요. where는 in which로 바꿔 쓸 수 있답니다. 세 번째, carrots and cabbages는 and로 대등하게 연결된 병렬 구조라서 두 명사의 품사와 형태가 같아요. 네 번째, bicycles that they can ride에서 that은 ride의 목적어 역할을 하는 목적격 관계대명사이고, 뒤에는 목적어가 빠진 불완전한 절이 와요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 생각한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">They \u003c/span>\u003cspan class=\"tgt\">think\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시골 생활이\u003c/span>\u003cspan class=\"en\">country life\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들을 만들었다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">made \u003c/span>\u003cspan class=\"tgt\">them \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">훨씬 더 행복하게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">much \u003c/span>\u003cspan class=\"tgt\">happier\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 시골생활이 자신들을 훨씬 더 튼튼하고 행복하게 만들었다고 생각한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 시골로 내려간 사람들이 느끼는 \u003cb class=\"key\">만족감\u003c/b>을 정리하며 글을 맺는 역할을 해요. \u003cb class=\"key\">시골 \u003c/b>\u003cb class=\"key\">생활\u003c/b>이 이들을 더 \u003cb class=\"key\">행복\u003c/b>하게 만들었다는 주장으로, 앞에서 말한 단순한 삶의 긍정적 결과를 강조해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that의 생략\u003c/span> : think + (that) + 완전한 절 : \"그들은 ~라고 생각한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">목적격 보어를 취하는 make와 현재완료\u003c/span> : have/has + made + 목적어 + 목적격 보어 : \"그들을 훨씬 더 행복하게 만들었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">비교급 강조 부사 much\u003c/span> : much + 비교급 : \"훨씬 더 행복하게\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"They think, 그들은 생각한다. country life, 시골 생활이. has made them, 그들을 만들었다고. much happier, 훨씬 더 행복하게. 이 문장 전체를 해석하면, 그들은 시골생활이 자신들을 훨씬 더 튼튼하고 행복하게 만들었다고 생각한다.","hl":"m"},{"n":32,"text":"이 문장은 시골로 내려간 사람들이 느끼는 만족감을 정리하며 글을 맺는 역할을 해요. 시골 생활이 이들을 더 행복하게 만들었다는 주장으로, 앞에서 말한 단순한 삶의 긍정적 결과를 강조해요.","hl":"mn"},{"n":33,"text":"첫 번째로 They think에서 think 뒤에 완전한 절이 오면 접속사 that을 생략할 수 있고, country life 이하가 think의 목적절로 이어져요. 두 번째로 has made them much happier에서 make는 목적어 them 뒤에 목적격 보어 happier를 취하고, has made는 현재완료로 변화의 결과가 현재까지 이어짐을 나타내요. 세 번째로 much happier에서 much는 비교급 happier를 강조하는 부사이고, very는 비교급을 수식하지 못하므로 much를 써야 해요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>런던의 대부분의 근로자는 커다란 집과 멋진 차, 가정부를 꿈꾸지만, 영국 근로자의 육 퍼센트는 그런 삶이 더 이상 \u003cb class=\"key\">꼭 \u003c/b>\u003cb class=\"key\">필요한 \u003c/b>\u003cb class=\"key\">것\u003c/b>으로 보이지 않는다고 말한다.\u003c/li>\u003cli>자신들이 잘 살고 있지 못하다고 느낀 이들 근로자는 \u003cb class=\"key\">삶의 \u003c/b>\u003cb class=\"key\">속도를 \u003c/b>\u003cb class=\"key\">줄이기\u003c/b>로 하고 커다란 집과 멋진 차, 좋은 직업에도 안녕을 고했다.\u003c/li>\u003cli>새로운 생활에 \u003cb class=\"key\">익숙해지는 \u003c/b>\u003cb class=\"key\">데\u003c/b>는 시간이 걸렸지만, 그들 대부분은 이웃과 디너파티가 열리는 작은 집과 당근·양배추를 키우는 뜰, 시골길을 달리는 자전거를 즐긴다.\u003c/li>\u003cli>결국 이들에게 \u003cb class=\"key\">시골생활\u003c/b>은 훨씬 더 큰 행복을 안겨 주었다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Some workers leave their big houses, nice cars and good jobs behind to downshift, and they find greater happiness in a simpler country life.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">런던의 대부분의 근로자는 커다란 집과 멋진 차를 꿈꾸지만, 영국 근로자의 6퍼센트는 그런 삶이 더 이상 \u003cb class=\"key\">꼭 \u003c/b>\u003cb class=\"key\">필요한 \u003c/b>\u003cb class=\"key\">것\u003c/b>으로 보이지 않아 \u003cb class=\"key\">삶의 \u003c/b>\u003cb class=\"key\">속도를 \u003c/b>\u003cb class=\"key\">줄이기\u003c/b>로 한다. 그들은 시골에서 단순하게 살며 작은 집과 뜰, 자전거를 즐기고, 시골생활이 자신들을 훨씬 더 행복하게 만들었다고 생각한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":34,"text":"오늘 지문은 도시의 화려한 삶 대신 시골에서 단순하게 사는 사람들의 이야기였어요. 통념을 뒤집는 But과 구체적인 예시가 이어지는 흐름만 잡으면 내용이 아주 쉽게 정리됩니다. 여러분도 노트에 downshift, get used to, take place 같은 표현을 꼭 받아 적어 두세요. 오늘 수업은 여기까지예요, 수고했어요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
