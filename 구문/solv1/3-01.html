<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SO 레벨1 3강 적용독해01 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-chips .x{background:none;color:#999;padding:0}
.lp-sno{font-size:13px;color:#8493A1;font-weight:700;margin-bottom:8px}

.lp-chunks{display:flex;flex-wrap:wrap;gap:16px 10px;margin-bottom:12px;align-items:flex-end}
.lp-chunk{display:flex;flex-direction:column}
.lp-chunk .ko{font-size:13px;color:var(--pk-t);font-weight:700;line-height:1.3;margin-bottom:2px}
.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}
.lp-top::before{height:5px;background:linear-gradient(90deg,var(--pk) 0,var(--pk) 80%,var(--am) 80%,var(--am) 100%)}
.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}
.lp-tag{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700;padding:2px 12px}
.lp-qn{flex:0 0 112px;height:112px;align-self:center;background:#fff;color:var(--pk);border:3px solid var(--pk);border-radius:50%;font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;font-size:26px}
.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}
.lp-qn .qt{display:block;white-space:nowrap;line-height:1.12;letter-spacing:-.02em}
.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}
.lp-st{border-radius:4px;border-left:4px solid var(--pk-b)}
.lp-st h4{color:var(--ink,#1B2733)}
.lp-st h4 i{border-radius:4px;width:auto;min-width:24px;padding:0 4px}
.lp-pill{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700}
.lp-chain span.c{background:#fff;border:1px solid #AEBBE6;border-radius:3px;font-weight:600}
.lp-ct th{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif}
.lp-vg em{background:#fff;border:1px solid var(--pk-b);border-radius:3px}
.lp-sa>div{border-radius:4px;border-color:var(--pk-b)}
.lp-chips span{border-radius:3px;background:#fff}
.lp-chips .s{border:1px solid #AEBBE6;color:#3A4FA3}
.lp-chips .a{border:1px solid var(--am-b);color:var(--am-d);background:#FFFBF2}
.lp-sno .es{background:var(--am);border-radius:2px;font-weight:700}
.lp-chunk .en{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:600}
.lp-chunk+.lp-chunk{border-left:1px solid var(--pk-b)}
.lp .tgt{background:var(--am-l);border-bottom:2.5px dotted var(--am)}

.lp-ko{border-radius:0;border-left:4px solid var(--pk);background:none;padding:4px 0 4px 12px}
.lp-mn{border-radius:4px;background:var(--am-l);border-color:var(--am-b);color:#5C4510}
.lp-ap{border-radius:4px;border:1px solid var(--pk-b);border-top:3px solid var(--pk);background:var(--pk-ll)}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"SO 레벨1 3강 적용독해01","audioDir":"3-01_audio","preview":false,"count":45,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">3강\u003cbr>적용독해01\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">SO 레벨1\u003c/div>\u003ch1>Bait and Switch: How a Sale Can Cost You More\u003c/h1>\u003ch2>미끼와 전환: 세일이 오히려 돈을 더 쓰게 하는 이유\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>요약: 돈을 아끼려고 세일 중인 물건을 사지만, 광고한 상품이 \u003cb class=\"key\">품절\u003c/b>이면 더 비싼 다른 모델로 \u003cb class=\"key\">전환\u003c/b>되는 '미끼와 전환' 판매술 때문에 계획했던 것보다 더 많은 돈을 쓰게 될 수 있다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>A sales offer can bait buyers with an attractive price and then switch them to a costlier item, making them spend more than planned.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 세일이 오히려 지갑을 얇게 만들 수 있다는 재미있는 지문을 함께 읽을 거예요. 광고에 끌려 가게에 갔더니 그 물건은 없고 더 비싼 물건만 남아 있는 상황, 바로 bait and switch라는 판매 방식 이야기예요. 요지는 구매자를 싼 상품으로 유인한 다음 더 비싼 상품으로 전환시킨다는 것, 이제 차근차근 짚어 볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">우리가 흔히 보는 세일 광고는 \u003cb class=\"key\">마케팅\u003c/b>의 대표적인 유인 장치예요. 특히 bait and switch는 값싼 \u003cb class=\"key\">미끼\u003c/b> 상품으로 손님을 모은 뒤 실제로는 더 비싼 상품을 팔아 \u003cb class=\"key\">매출\u003c/b>을 올리는 전술이죠. 소비자는 이 과정에서 계획하지 않은 \u003cb class=\"key\">충동구매\u003c/b>를 하기 쉽고, 광고 가격과 실제 결제 가격의 \u003cb class=\"key\">간격\u003c/b>을 알아차리지 못하면 손해를 보게 돼요. 빵집에서 '오늘의 빵 반값'이라고 해서 갔더니 이미 팔렸다며 더 비싼 케이크를 권하는 상황을 떠올리면 이해가 쉬워요. 그래서 소비자 보호 차원에서 이런 판매 방식을 \u003cb class=\"key\">규제\u003c/b>하는 나라도 있어요. 결국 광고 속 가격과 계산대 앞 가격이 다르지 않은지 확인하는 습관이 중요하답니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 조금 깔아 볼게요. 이런 판매 방식은 마케팅에서 아주 고전적인 전술로, 영어로는 bait and switch, 우리말로는 미끼와 전환 전략이라고 불러요. 광고는 손님을 가게로 불러들이는 역할만 하고, 실제 매출은 다른 상품에서 나는 구조죠. 소비자 입장에서는 살 물건을 정하고 들어갔는데도 impulse buying, 그러니까 충동구매로 이어지기 쉬워요. 빵집에서 오늘의 빵이 반값이라고 해서 달려갔더니 벌써 팔렸다며 더 비싼 케이크를 권하는 상황을 떠올리면 이해가 빨라요. 그래서 소비자 보호 차원에서 이런 판매 방식을 규제하는 나라도 있고, 결국 광고 가격과 실제 결제 가격 사이의 간격을 의심하는 습관이 중요한 거죠.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>세일의 역설\u003csmall>통념 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>사람들은 보통 돈을 아끼려고 \u003cb class=\"key\">세일\u003c/b> 중인 물건을 사요. 하지만 이 글은 그 선택이 오히려 \u003cb class=\"key\">계획\u003c/b>했던 것보다 더 많은 지출로 이어질 수 있다고 말하며 통념을 흔들어요. 여기서 독자는 '어떻게?'라는 \u003cb class=\"key\">의문\u003c/b>을 갖게 되죠.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>광고의 유혹\u003csmall>예시 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>자전거가 필요한 상황을 가정하고 \u003cb class=\"key\">광고\u003c/b>를 제시해요. 단돈 구십구 달러에 이틀간만 판다는 문구는 아주 강한 \u003cb class=\"key\">유인\u003c/b>이 되죠. Hurry라는 말이 \u003cb class=\"key\">희소성\u003c/b>을 자극해 서두르게 만든다는 점도 눈여겨볼 부분이에요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>품절과 전환\u003csmall>반전 · 문장 6–8\u003c/small>\u003c/h4>\u003cp>가게에 도착하면 광고하던 자전거는 이미 \u003cb class=\"key\">품절\u003c/b> 상태예요. 그때 점원이 '당신에게 딱 맞는' 다른 \u003cb class=\"key\">모델\u003c/b>이 있다고 말하고, 가격은 삼백오십구 달러로 뛰죠. 결국 손님은 계획보다 훨씬 비싼 \u003cb class=\"key\">지출\u003c/b>을 하게 돼요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>미끼와 전환\u003csmall>결론 · 문장 9–11\u003c/small>\u003c/h4>\u003cp>이 판매 방식을 부르는 이름이 \u003cb class=\"key\">bait \u003c/b>\u003cb class=\"key\">and \u003c/b>\u003cb class=\"key\">switch\u003c/b>예요. 먼저 세일 제안으로 구매자를 \u003cb class=\"key\">유인\u003c/b>하고, 그다음 더 비싼 제품으로 \u003cb class=\"key\">전환\u003c/b>시킨다는 뜻이죠. First와 Then이 이 과정의 순서를 깔끔하게 정리해 줘요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 네 단계로 나눠서 따라가 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 통념이에요. 사람들은 보통 돈을 아끼려고 세일 중인 물건을 사죠. 그런데 이 글은 그 선택이 계획했던 것보다 더 많은 돈을 쓰게 만들 수도 있다고 말해요. 그래서 독자는 왜 그런지 궁금해지는 의문을 갖게 돼요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 예시예요. 자전거가 필요한 사람을 등장시켜서 광고 한 줄을 보여 주죠. 단돈 구십구 달러에 이틀간만 판다, 서두르라는 문구는 아주 강한 유인으로 작동해요. 이때 Hurry 같은 말이 희소성을 자극한다는 점도 꼭 기억해 두세요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 반전이에요. 가게에 도착해 보니 광고하던 자전거는 이미 품절이죠. 그 순간 점원이 당신에게 딱 맞는 다른 모델이 있다고 말하고, 가격은 삼백오십구 달러로 확 올라가요. 결과적으로 손님은 계획보다 훨씬 큰 지출을 하게 되는 거예요.","hl":"f2"},{"n":7,"text":"네 번째 단계는 개념 정리예요. 이런 판매 방식을 가리키는 이름이 바로 bait and switch예요. 먼저 세일 제안으로 구매자를 유인하고, 그다음 더 비싼 제품으로 전환시킨다는 뜻이죠. First와 Then이라는 표지가 이 과정의 순서를 아주 깔끔하게 보여 줘요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">통념-반박\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 9번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 번째와 두 번째 문장에서 '세일로 돈을 아낀다'는 \u003cb class=\"key\">통념\u003c/b>을 꺼낸 뒤 But으로 곧바로 \u003cb class=\"key\">반박\u003c/b>해요. 이어서 자전거 광고라는 구체적인 \u003cb class=\"key\">예시\u003c/b>를 길게 제시해 독자가 그 상황을 생생하게 겪도록 만들죠. 마지막에 이 판매 방식을 bait and switch라고 \u003cb class=\"key\">개념화\u003c/b>하며 First와 Then으로 순서를 정리하기 때문에, 핵심 개념이 글 뒤쪽에서 완성되는 \u003cb class=\"key\">미괄식\u003c/b> 구조예요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>But (2)\u003c/b>\u003cspan>통념을 뒤집는 반박\u003c/span>\u003cb>Imagine (3)\u003c/b>\u003cspan>가정·예시 도입\u003c/span>\u003cb>However (6)\u003c/b>\u003cspan>기대가 깨지는 반전\u003c/span>\u003cb>Then (7)\u003c/b>\u003cspan>시간적 순서 연결\u003c/span>\u003cb>First (10)\u003c/b>\u003cspan>과정의 첫 단계 제시\u003c/span>\u003cb>Then (11)\u003c/b>\u003cspan>과정의 다음 단계 제시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">items on sale\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a sales offer\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">baited\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">another model\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">another costlier item\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">switched\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>미끼 상품(bait)\u003c/th>\u003cth>전환 상품(switch)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>싸고 매력적인 가격\u003c/td>\u003ctd>더 비싼 가격\u003c/td>\u003c/tr>\u003ctr>\u003ctd>광고로 손님을 유인\u003c/td>\u003ctd>판매 직전에 다른 제품으로 전환\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"전개 방식을 보면 통념을 먼저 던지고 곧바로 반박하는 통념과 반박의 구조예요. 그 뒤에 자전거 광고라는 구체적인 예시를 길게 붙여서 개념화를 도와주죠. 주제어인 bait and switch는 글의 뒤쪽, 아홉 번째 문장에서야 등장해요. 그래서 이 글은 핵심이 마지막에 정리되는 미괄식 구조라고 볼 수 있어요.","hl":"ty"},{"n":9,"text":"신호어를 짚어 볼게요. 두 번째 문장의 But은 앞의 통념을 뒤집는 결정적인 신호예요. 여섯 번째 문장의 However는 기대가 깨지는 반전을 알려 주고, Then은 시간의 순서를 이어 줘요. 마지막으로 First와 Then이 미끼와 전환의 단계를 차례로 정리한다는 점도 놓치지 마세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>item\u003c/b>\u003cem>명사\u003c/em>\u003cspan>물건, 품목\u003c/span>\u003c/div>\u003cdiv>\u003cb>on sale\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>세일 중인, 할인 판매 중인\u003c/span>\u003c/div>\u003cdiv>\u003cb>save\u003c/b>\u003cem>동사\u003c/em>\u003cspan>아끼다, 절약하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>spend\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(돈·시간을) 쓰다\u003c/span>\u003c/div>\u003cdiv>\u003cb>more\u003c/b>\u003cem>부사\u003c/em>\u003cspan>더, 더 많이\u003c/span>\u003c/div>\u003cdiv>\u003cb>than\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>~보다\u003c/span>\u003c/div>\u003cdiv>\u003cb>plan\u003c/b>\u003cem>동사\u003c/em>\u003cspan>계획하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>imagine\u003c/b>\u003cem>동사\u003c/em>\u003cspan>상상하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>need\u003c/b>\u003cem>동사\u003c/em>\u003cspan>필요로 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>advertisement\u003c/b>\u003cem>명사\u003c/em>\u003cspan>광고\u003c/span>\u003c/div>\u003cdiv>\u003cb>attract\u003c/b>\u003cem>동사\u003c/em>\u003cspan>끌다, 유인하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>attention\u003c/b>\u003cem>명사\u003c/em>\u003cspan>주의, 관심\u003c/span>\u003c/div>\u003cdiv>\u003cb>speed\u003c/b>\u003cem>명사\u003c/em>\u003cspan>속도\u003c/span>\u003c/div>\u003cdiv>\u003cb>sale\u003c/b>\u003cem>명사\u003c/em>\u003cspan>판매, 세일\u003c/span>\u003c/div>\u003cdiv>\u003cb>hurry\u003c/b>\u003cem>동사\u003c/em>\u003cspan>서두르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>however\u003c/b>\u003cem>부사\u003c/em>\u003cspan>그러나, 하지만\u003c/span>\u003c/div>\u003cdiv>\u003cb>discover\u003c/b>\u003cem>동사\u003c/em>\u003cspan>발견하다, 알게 되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>advertise\u003c/b>\u003cem>동사\u003c/em>\u003cspan>광고하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>sold out\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>다 팔린, 품절된\u003c/span>\u003c/div>\u003cdiv>\u003cb>salesman\u003c/b>\u003cem>명사\u003c/em>\u003cspan>점원, 판매원\u003c/span>\u003c/div>\u003cdiv>\u003cb>model\u003c/b>\u003cem>명사\u003c/em>\u003cspan>모델, 제품\u003c/span>\u003c/div>\u003cdiv>\u003cb>just right for\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에게 딱 맞는\u003c/span>\u003c/div>\u003cdiv>\u003cb>cost\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(비용이) 들다\u003c/span>\u003c/div>\u003cdiv>\u003cb>method\u003c/b>\u003cem>명사\u003c/em>\u003cspan>방법, 방식\u003c/span>\u003c/div>\u003cdiv>\u003cb>call\u003c/b>\u003cem>동사\u003c/em>\u003cspan>부르다, 일컫다\u003c/span>\u003c/div>\u003cdiv>\u003cb>bait\u003c/b>\u003cem>명사\u003c/em>\u003cspan>미끼\u003c/span>\u003c/div>\u003cdiv>\u003cb>buyer\u003c/b>\u003cem>명사\u003c/em>\u003cspan>구매자\u003c/span>\u003c/div>\u003cdiv>\u003cb>offer\u003c/b>\u003cem>명사\u003c/em>\u003cspan>제안\u003c/span>\u003c/div>\u003cdiv>\u003cb>switch\u003c/b>\u003cem>동사\u003c/em>\u003cspan>전환하다, 바꾸다\u003c/span>\u003c/div>\u003cdiv>\u003cb>costlier\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>더 비싼\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"단어도 몇 개만 짚을게요. on sale은 세일 중인, spend는 돈을 쓰다, attract는 주의를 끌다는 뜻이에요. sold out은 다 팔려서 없다, costlier는 더 비싼이라는 의미이니 꼭 외워 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">save\u003c/b>\u003cspan class=\"m\">아끼다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">economize\u003c/span>\u003cspan class=\"s\">conserve\u003c/span>\u003cspan class=\"s\">preserve\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">waste\u003c/span>\u003cspan class=\"a\">squander\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">spend\u003c/b>\u003cspan class=\"m\">쓰다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">pay\u003c/span>\u003cspan class=\"s\">expend\u003c/span>\u003cspan class=\"s\">use up\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">save\u003c/span>\u003cspan class=\"a\">earn\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">attract\u003c/b>\u003cspan class=\"m\">끌다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">draw\u003c/span>\u003cspan class=\"s\">lure\u003c/span>\u003cspan class=\"s\">appeal to\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">repel\u003c/span>\u003cspan class=\"a\">deter\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">discover\u003c/b>\u003cspan class=\"m\">알게 되다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">find out\u003c/span>\u003cspan class=\"s\">realize\u003c/span>\u003cspan class=\"s\">notice\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003cspan class=\"a\">overlook\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">costlier\u003c/b>\u003cspan class=\"m\">더 비싼\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">more expensive\u003c/span>\u003cspan class=\"s\">pricier\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">cheaper\u003c/span>\u003cspan class=\"a\">less expensive\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">offer\u003c/b>\u003cspan class=\"m\">제안\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">proposal\u003c/span>\u003cspan class=\"s\">deal\u003c/span>\u003cspan class=\"s\">bid\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">refusal\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">hurry\u003c/b>\u003cspan class=\"m\">서두르다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">rush\u003c/span>\u003cspan class=\"s\">hasten\u003c/span>\u003cspan class=\"s\">race\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">delay\u003c/span>\u003cspan class=\"a\">linger\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어로 정리해 볼게요. save는 economize, conserve와 가깝고 waste와는 반대말이에요. spend는 pay, expend와 비슷하고 save와 반대되는 개념이죠. attract는 draw, lure와 통하고 repel, deter와는 반대예요. costlier는 more expensive와 같은 뜻이고 cheaper와는 정반대고요. discover는 find out, realize와 가깝고 ignore와는 반대라는 것까지 챙겨 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 물건을 산다\u003c/span>\u003cspan class=\"en\">You buy items\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세일 중인\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">sale\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">돈을 아끼려고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">save \u003c/span>\u003cspan class=\"tgt\">money\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">당신은 돈을 아끼려고 세일 중인 물건을 산다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 글의 \u003cb class=\"key\">주제문\u003c/b>으로, 사람들이 세일 상품을 사는 이유가 돈을 아끼기 위해서라는 일반적인 생각을 먼저 제시해요. 뒤에서 이 상식이 뒤집히는 \u003cb class=\"key\">반전\u003c/b>이 기다리고 있기 때문에, 그 반전을 더 또렷하게 만들어 주는 출발점 역할을 하는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 수식\u003c/span> : [명사 items] + [전치사구 on sale (명사 뒤 수식)] : \"세일 중인\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : [주어 + 동사 + 목적어] + [to save money (to부정사구/목적의 부사구)] : \"돈을 아끼려고\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"You buy items, 당신은 물건을 산다. on sale, 세일 중인. to save money, 돈을 아끼려고. 이 문장 전체를 해석하면, 당신은 돈을 아끼려고 세일 중인 물건을 산다.","hl":"m"},{"n":13,"text":"이 문장은 이 글의 주제문이에요. 사람들이 세일 상품을 사는 이유는 돈을 아끼기 위해서라는 아주 상식적인 이야기로 시작하죠. 그런데 뒤에서 이 상식이 뒤집히는 반전이 기다리고 있으니, 그 반전을 더 도드라지게 만들어 주는 출발점이라고 보면 됩니다.","hl":"mn"},{"n":14,"text":"첫 번째, to save money에서 to부정사는 목적을 나타내는 부사적 용법이에요. 그래서 돈을 아끼기 위해서라고 해석하고, 물건을 사는 이유를 알려 주는 역할을 하죠. 두 번째, on sale은 전치사구인데 items를 뒤에서 꾸며 주는 형용사 역할을 해요. 우리말은 세일 중인 물건처럼 앞에서 꾸미지만 영어는 명사 뒤에서 꾸민다는 점, 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 당신은 쓸지도 모른다\u003c/span>\u003cspan class=\"en\">But you \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">may \u003c/span>\u003cspan class=\"tgt\">spend\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 많이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">계획했던 것보다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">planned\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 당신은 계획했던 것보다 더 많이 돈을 쓰게 될지도 모른다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 생각을 \u003cb class=\"key\">반박\u003c/b>하는 문장으로, 세일이 오히려 \u003cb class=\"key\">과소비\u003c/b>로 이어질 수 있다는 글의 핵심 방향을 열어 줘요. may를 써서 단정하지 않고 '그럴 수도 있다'고 부드럽게 말하는 점이 중요해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 may (추측)\u003c/span> : [주어 + may + 동사원형] : \"쓸지도 모른다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">비교급 more than + 접속사절\u003c/span> : [more (비교급)] + [than + you planned (비교 대상 절)] : \"계획했던 것보다 더 많이\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"But you may spend, 그러나 당신은 쓸지도 모른다. more, 더 많이. than you planned, 계획했던 것보다. 이 문장 전체를 해석하면, 그러나 당신은 계획했던 것보다 더 많이 돈을 쓰게 될지도 모른다.","hl":"m"},{"n":16,"text":"앞 문장에서는 세일이 돈을 아껴 준다고 했죠. 그런데 이 문장이 But으로 시작하면서 그 생각을 시원하게 뒤집어요. 세일이 오히려 계획보다 더 많은 지출로 이어질 수 있다는 것, 이게 바로 이 글의 핵심 흐름입니다.","hl":"mn"},{"n":17,"text":"첫 번째, may spend에서 may는 추측의 조동사예요. 단정하지 않고 쓸지도 모른다라고 가능성만 열어 두는 표현이죠. 두 번째, more than you planned는 비교급 표현이에요. than은 접속사니까 뒤에 you planned라는 주어와 동사가 그대로 오고, 우리말로는 계획했던 것보다 더 많이라고 해석하면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상상해 보라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Imagine \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 자전거 한 대가 필요한데\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">need \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">bike\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 광고가 당신의 주의를 끈다고\u003c/span>\u003cspan class=\"en\">and an advertisement \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">attracts\u003c/span> your attention:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“10단 자전거, 단돈 99불,\u003c/span>\u003cspan class=\"en\">&quot;Ten speed bike, only $99.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">당신이 자전거 한 대가 필요한데 한 광고가 당신 주의를 끈다고 상상해 보라. “10단 자전거, 단돈 99불,\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 가상의 상황을 \u003cb class=\"key\">예시\u003c/b>로 들어 독자를 이야기 속으로 끌어들이는 문장이에요. 자전거가 필요한 사람에게 99불짜리 광고가 눈에 확 들어오는 장면을 그려 보라고 하죠. 이 99불짜리 광고가 바로 뒤에 나오는 \u003cb class=\"key\">미끼\u003c/b>의 정체가 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문 + 접속사 that 생략 (동사 imagine의 목적절)\u003c/span> : Imagine [(that) + you need a bike (목적절)] : \"당신이 자전거 한 대가 필요하다고 상상해 보라\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주어-동사 수의 일치 (3인칭 단수 현재)\u003c/span> : [단수 주어 an advertisement] + [동사 attracts] : \"(주의를) 끈다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Imagine, 상상해 보라. you need a bike, 당신이 자전거 한 대가 필요한데. and an advertisement attracts your attention, 한 광고가 당신의 주의를 끈다고. \"Ten speed bike, only $99, “10단 자전거, 단돈 99불. 이 문장 전체를 해석하면, 당신이 자전거 한 대가 필요한데 한 광고가 당신 주의를 끈다고 상상해 보라. “10단 자전거, 단돈 99불,","hl":"m"},{"n":19,"text":"본격적인 이야기에 들어가기 전에 독자를 가상의 상황에 세워 두는 문장이에요. 자전거가 필요한 사람에게 99불짜리 광고가 딱 눈에 들어오는 장면을 그려 보라고 하는 거죠. 여기 나오는 그 광고가 바로 뒤에서 이야기할 미끼의 정체라는 점, 기억해 두세요.","hl":"mn"},{"n":20,"text":"첫 번째, Imagine you need a bike에서 Imagine은 상상하다라는 타동사라서 뒤에 절이 통째로 목적어로 와요. 이때 접속사 that이 생략되어 바로 you need a bike가 이어지는 거죠. 두 번째, attracts를 보세요. 주어가 an advertisement 하나라서 단수 취급을 받아 동사에 s가 붙은 형태예요. and로 절이 두 개 이어져도 각 절의 주어와 동사를 짝지어 보는 습관이 아주 중요합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이틀간\u003c/spa \">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간 부사절 접속사 when\u003c/span> : when + 주어 + 동사, 주절 : \"가게에 도착했을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that\u003c/span> : 동사 + that + 주어 + 동사 : \"당신은 ...라는 것을 발견한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">과거분사의 형용사적 용법\u003c/span> : 과거분사 + 명사 : \"광고된\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">수동태(be + p.p.)\u003c/span> : 주어 + be동사 + p.p. + out : \"다 팔리고 없다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"However, 하지만. when you get to the store, 가게에 도착했을 때. you discover, 당신은 발견한다. that the advertised bike, 광고하던 그 자전거가. is sold out, 다 팔리고 없다는 것을. 이 문장 전체를 해석하면, 하지만 가게에 도착했을 때는 광고하던 그 자전거는 다 팔리고 없다.","hl":"m"},{"n":28,"text":"이 문장은 광고한 자전거가 매진되었다는 상황을 통해 미끼가 실제 구매로 이어지지 않음을 보여 줘요. 그래서 소비자가 다른 제품으로 눈을 돌리게 만드는 전환의 발판이 되는 거죠.","hl":"mn"},{"n":29,"text":"여기서 when은 뒤에 주어와 동사가 오는 부사절을 이끌어 가게에 도착했을 때라는 시간을 나타내요. discover 뒤의 that절은 목적어 역할을 하고, advertised는 bike를 꾸미는 과거분사예요. 마지막으로 is sold out은 be동사와 함께 쓰인 수동태로 매진된 상태를 나타냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 다음엔\u003c/span>\u003cspan class=\"en\">Then\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">점원이 당신에게 말한다\u003c/span>\u003cspan class=\"en\">the salesman tells you\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그에게 다른 모델이 있다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">another \u003c/span>\u003cspan class=\"tgt\">model\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 '당신에게 딱 맞는' 것이라고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that's \u003c/span>\u003cspan class=\"tgt\">&quot;just \u003c/span>\u003cspan class=\"tgt\">right \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">you.&quot;\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">점원이‘당신에게 딱 맞는’ 다른 모델이 있다고 말한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 광고한 자전거가 없다는 말에 이어 점원이 다른 모델을 꺼내는 장면으로, 미끼 판매의 \u003cb class=\"key\">전환\u003c/b> 단계가 시작됨을 보여 준다. &quot;just right for you&quot;는 '당신에게 딱 맞는다'는 뜻으로 손님의 \u003cb class=\"key\">구매 \u003c/b>\u003cb class=\"key\">심리\u003c/b>를 자극해 관심을 다른 제품으로 돌리는 표현이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 명사절(목적어)\u003c/span> : tell + [간접목적어 you] + [that절 (직접목적어)] : \"그에게 다른 모델이 있다고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관계대명사 that (주격, 선행사 another model)\u003c/span> : [선행사 another model] + [that's = that is + 형용사구] : \"당신에게 딱 맞는\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Then, 그 다음엔. the salesman tells you, 점원이 당신에게 말한다. that he has another model, 그에게 다른 모델이 있다고. that's \"just right for you.\", 그것이 '당신에게 딱 맞는' 것이라고. 이 문장 전체를 해석하면, 점원이‘당신에게 딱 맞는’ 다른 모델이 있다고 말한다.","hl":"m"},{"n":31,"text":"여기서 핵심은 전환 단계예요. 광고한 자전거가 없다고 하니까 점원이 곧바로 다른 모델을 꺼내면서 그게 당신에게 딱 맞는다고 말하죠. 바로 이 순간 손님의 관심이 미끼 상품에서 훨씬 비싼 제품으로 옮겨 가고, 구매 심리를 자극받게 되는 겁니다.","hl":"mn"},{"n":32,"text":"첫 번째로, tells you 뒤에 나오는 that은 접속사예요. 그가 다른 모델을 가지고 있다는 내용 전체를 목적어로 묶어 주는 역할을 하죠. 두 번째로, another model 뒤의 that's는 관계대명사 that에 is가 줄어든 형태로, 앞의 선행사 another model을 뒤에서 꾸며 주는 형용사절을 이끕니다. 마지막으로 just right for you는 당신에게 바로 알맞다는 뜻으로, 손님의 마음을 움직이는 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 비용이 든다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">costs \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">359 불\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">$359\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 359 불이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞의 another model이 359달러, 즉 광고 가격의 몇 배에 달하는 \u003cb class=\"key\">고가 \u003c/b>\u003cb class=\"key\">제품\u003c/b>임을 숫자로 못 박는 문장이다. 짧은 문장 하나로 \u003cb class=\"key\">가격 \u003c/b>\u003cb class=\"key\">차이\u003c/b>가 얼마나 큰지를 강조해 미끼와 전환의 구조를 분명히 드러낸다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지시대명사 it\u003c/span> : [It = 앞 문장의 another model] : \"그것은 (다른 모델은)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">3형식 타동사 cost\u003c/span> : cost + [금액 (목적어)] : 비용이 ~만큼 들다 : \"359 불의 비용이 든다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"It costs, 그것은 비용이 든다. $359, 359 불. 이 문장 전체를 해석하면, 그것은 359 불이다.","hl":"m"},{"n":34,"text":"앞에서 말한 다른 모델의 가격이 삼백오십구 달러라는 뜻이에요. 광고에 나온 구십구 달러와 비교하면 가격 차이가 얼마나 큰지 바로 느껴지죠. 짧은 문장 하나로 고가 제품으로 유도하는 구조를 아주 분명하게 보여 줍니다.","hl":"mn"},{"n":35,"text":"첫 번째로, It은 앞 문장에 나온 another model을 가리키는 지시대명사예요. 그래서 문맥상 다른 모델로 받아 주시면 됩니다. 두 번째로, cost는 비용이 들다라는 뜻으로 뒤에 금액을 목적어로 바로 데리고 오는 타동사예요. 전치사 없이 금액이 온다는 점이 시험에 자주 나오니까 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 판매술은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">This \u003c/span>\u003cspan class=\"tgt\">sales \u003c/span>\u003cspan class=\"tgt\">method\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">불린다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">called \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">'미끼와 전환'이라고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">&quot;bait \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">switch.&quot;\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 판매술은 일명 ‘미끼와 전환’이라고 불린다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞의 사례 전체에 \u003cb class=\"key\">이름\u003c/b>을 붙이는 정의 문장으로, bait and switch는 '미끼를 던져 끌어들인 뒤 다른 것으로 바꾼다'는 뜻의 \u003cb class=\"key\">관용 \u003c/b>\u003cb class=\"key\">표현\u003c/b>이다. 이 표현이 글의 \u003cb class=\"key\">주제어\u003c/b>가 되어 뒤에 이어지는 설명의 기준이 된다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">복합명사(명사 + 명사)\u003c/span> : [sales (앞에서 꾸미는 명사)] + [method (중심 명사)] : \"이 판매 술법은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">5형식 동사 call의 수동태\u003c/span> : call + A + B (A를 B라고 부르다) → A is called B (A는 B라고 불린다) : \"미끼와 전환이라고 불린다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"This sales method, 이 판매술은. is called, 불린다. \"bait and switch.\", '미끼와 전환'이라고. 이 문장 전체를 해석하면, 이 판매술은 일명 ‘미끼와 전환’이라고 불린다.","hl":"m"},{"n":37,"text":"앞에서 본 장면 전체에 이름을 붙이는 정의 문장이에요. 싼 미끼로 손님을 끌어들인 뒤 다른 물건으로 바꾸는 판매 방식을 가리키는 관용 표현이죠. 이 표현이 글 전체의 주제어가 되니까 반드시 기억해 두세요.","hl":"mn"},{"n":38,"text":"첫 번째로, This sales method는 명사 두 개가 붙어 판매 술법이라는 하나의 복합명사를 이뤄요. 뒤에 오는 명사가 중심 명사라는 점도 함께 알아 두세요. 두 번째로, is called는 부르다라는 뜻의 call을 수동태로 만든 형태예요. call은 목적어와 목적격 보어를 함께 쓰는 동사라서, 수동태가 되면 이름이 주격 보어 자리에 그대로 남는다는 원리를 이해하시면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">첫째,\u003c/span>\u003cspan class=\"en\">First,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">구매자는 유혹된다\u003c/span>\u003cspan class=\"en\">buyers \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">baited\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세일 제안(미끼)으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">sales \u003c/span>\u003cspan class=\"tgt\">offer\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">첫째, 구매자는 세일 제안(미끼)에 유혹된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 미끼 판매의 첫 단계를 설명하는 문장이에요. \u003cb class=\"key\">수동태\u003c/b> 'are baited'를 써서 구매자가 세일 제안에 \u003cb class=\"key\">유혹되는\u003c/b> 쪽, 즉 당하는 입장임을 드러내죠. 'bait'는 낚시의 \u003cb class=\"key\">미끼\u003c/b>라는 뜻에서 '유혹하다'로 확장된 표현이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태(be + 과거분사)\u003c/span> : buyers [주어] + are baited [be동사 + 과거분사] + with a sales offer : \"유혹된다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 with (수단·도구)\u003c/span> : bait A [with B (수단을 나타내는 전치사구)] : \"세일 제안으로\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"First, 첫째. buyers are baited, 구매자는 유혹된다. with a sales offer, 세일 제안(미끼)으로. 이 문장 전체를 해석하면, 첫째, 구매자는 세일 제안(미끼)에 유혹된다.","hl":"m"},{"n":40,"text":"이 문장은 미끼 판매의 첫 단계를 알려 주고 있어요. 구매자가 세일 제안에 유혹을 당하는 쪽이라는 걸 수동태로 보여 주죠. bait는 낚시의 미끼라는 뜻에서 유혹하다로 쓰인 표현이에요.","hl":"mn"},{"n":41,"text":"먼저 are baited를 보세요. 주어 buyers가 유혹하는 쪽이 아니라 유혹을 당하는 쪽이니까 수동태를 쓴 겁니다. 두 번째로 with a sales offer에서 with는 수단을 나타내는 전치사예요. bait A with B, B로 A를 유혹하다라는 관용 표현으로 같이 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 다음엔,\u003c/span>\u003cspan class=\"en\">Then,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 전환된다\u003c/span>\u003cspan class=\"en\">they \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">switched\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 비싼 다른 제품으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">another \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">costlier \u003c/span>\u003cspan class=\"tgt\">item\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 다음엔 더 비싼 제품으로 전환된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 미끼 판매의 두 번째 단계를 정리하는 문장이에요. 앞 문장의 'baited'와 짝을 이루는 \u003cb class=\"key\">수동태\u003c/b> 'are switched'로 구매자가 더 비싼 제품으로 \u003cb class=\"key\">전환되는\u003c/b> 과정을 보여 주죠. 'another costlier item'에서 \u003cb class=\"key\">비교급\u003c/b> costlier가 '미끼 상품보다 더 비싼'이라는 핵심을 전달합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태(be + 과거분사)\u003c/span> : they [주어] + are switched [be동사 + 과거분사] + to another item : \"전환된다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 to (전환의 도착점)\u003c/span> : switch A [to B (전환의 도착점)] → A be switched to B : \"더 비싼 다른 제품으로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">비교급 형용사(-er)\u003c/span> : another + [비교급 형용사 costlier] + [명사 item] : \"더 비싼\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"Then, 그 다음엔. they are switched, 그들은 전환된다. to another costlier item, 더 비싼 다른 제품으로. 이 문장 전체를 해석하면, 그 다음엔 더 비싼 제품으로 전환된다.","hl":"m"},{"n":43,"text":"이 문장은 미끼 판매의 두 번째 단계예요. 앞 문장의 baited와 짝을 이루는 수동태 are switched로 구매자가 더 비싼 제품으로 전환되는 과정을 보여 줍니다. another costlier item에서 비교급 costlier가 원래 것보다 더 비싸다는 핵심을 전달하죠.","hl":"mn"},{"n":44,"text":"먼저 are switched, 여기도 수동태예요. 구매자가 전환시키는 주체가 아니라 전환되는 대상이기 때문이죠. 두 번째로 to another costlier item에서 to는 전환의 도착점을 나타내요. switch A to B를 수동태로 바꾸면 A be switched to B가 된다는 점을 꼭 기억하세요. 마지막으로 costlier는 costly의 비교급으로, -ly로 끝나도 형용사면 -er을 붙인다는 규칙을 보여 줍니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>돈을 아끼려고 세일 중인 물건을 사도, 계획했던 것보다 더 많은 돈을 쓰게 될 수 있어요. 이것이 \u003cb class=\"key\">세일의 \u003c/b>\u003cb class=\"key\">역설\u003c/b>이에요.\u003c/li>\u003cli>자전거 광고는 단돈 구십구 달러라는 가격으로 손님을 \u003cb class=\"key\">유인\u003c/b>하지만, 매장에 도착하면 그 상품은 이미 \u003cb class=\"key\">품절\u003c/b> 상태예요.\u003c/li>\u003cli>점원은 '당신에게 딱 맞는' 다른 모델을 권하고, 결국 손님은 훨씬 비싼 \u003cb class=\"key\">지출\u003c/b>을 하게 되죠.\u003c/li>\u003cli>이렇게 세일 제안으로 구매자를 유인한 뒤 더 비싼 제품으로 전환시키는 판매술을 \u003cb class=\"key\">bait \u003c/b>\u003cb class=\"key\">and \u003c/b>\u003cb class=\"key\">switch\u003c/b>라고 불러요.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>A sales offer can bait buyers with an attractive price and then switch them to a costlier item, making them spend more than planned.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: 돈을 아끼려고 세일 중인 물건을 사지만, 광고한 상품이 \u003cb class=\"key\">품절\u003c/b>이면 더 비싼 다른 모델로 \u003cb class=\"key\">전환\u003c/b>되는 '미끼와 전환' 판매술 때문에 계획했던 것보다 더 많은 돈을 쓰게 될 수 있다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":45,"text":"오늘 내용 정리해 볼게요. 세일은 언제나 이득처럼 보이지만, 광고한 상품이 품절이고 더 비싼 대안만 남아 있다면 그건 이미 bait and switch일 수 있어요. 미끼와 전환의 구조를 알고 있으면 충동구매를 한 번쯤 멈출 수 있겠죠. 오늘 배운 표현들 꼭 복습하시고요, 다음 시간에 또 만나요. 수고했어요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
