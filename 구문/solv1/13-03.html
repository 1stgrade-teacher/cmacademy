<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SO 레벨1 13강 적용독해03 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}

.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}
.lp-tag{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700;padding:2px 12px}

.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}

.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}

.lp-sno .es{background:var(--am);border-radius:2px;font-weight:700}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"SO 레벨1 13강 적용독해03","audioDir":"13-03_audio","preview":false,"count":34,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">13강\u003cbr>적용독해03\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">SO 레벨1\u003c/div>\u003ch1>Changing the Atmosphere to Change Someone's Mood\u003c/h1>\u003ch2>분위기를 바꿔 상대의 기분을 움직이기\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>주변 환경의 \u003cb class=\"key\">분위기\u003c/b>를 바꿈으로써 다른 사람의 \u003cb class=\"key\">기분\u003c/b>에 영향을 끼치려는 상황은 흔하며, 촛불이 켜진 저녁식사처럼 은은한 조명과 낭만적인 음악은 상대를 편안한 기분으로 만들어 \u003cb class=\"key\">사과\u003c/b>를 더 기꺼이 받아들이게 한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>We can influence other people's moods by changing the atmosphere of the environment, just as a candlelit dinner with romantic music makes a wife relaxed and more willing to accept her husband's apology.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 주변 환경의 분위기를 바꿔서 다른 사람의 기분에 영향을 주는 방법에 관한 글이에요. 결혼기념일을 잊어버린 남편이 촛불 저녁식사와 낭만적인 음악으로 아내의 마음을 움직이는 장면이 나오죠. 이 글의 요지는 우리가 주변 환경의 분위기를 바꿈으로써 다른 사람의 기분에 영향을 끼칠 수 있다는 것이에요. 그럼 차근차근 들어가 볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">우리는 주변의 \u003cb class=\"key\">분위기\u003c/b>(atmosphere)에 생각보다 크게 영향을 받습니다. 조명·음악·냄새 같은 환경 자극은 우리의 \u003cb class=\"key\">감정\u003c/b>과 행동을 조용히 바꾸죠. 심리학에서는 이런 현상을 \u003cb class=\"key\">환경 \u003c/b>\u003cb class=\"key\">심리\u003c/b>(environmental psychology)와 관련지어 설명하는데, 공간의 밝기나 소리가 사람의 각성 수준을 낮추거나 높인다고 봅니다. 일상 비유를 들면, 같은 라면도 형광등 아래에서 먹을 때와 은은한 조명 아래에서 먹을 때 느껴지는 만족감이 다르죠. 그래서 사람들은 상대의 \u003cb class=\"key\">기분\u003c/b>을 좋게 만들기 위해 일부러 공간의 분위기를 바꾸는 전략을 씁니다. 이 글의 촛불 저녁식사도 바로 그런 \u003cb class=\"key\">분위기 \u003c/b>\u003cb class=\"key\">조성\u003c/b>의 대표적인 예입니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식부터 짚어 볼게요. 우리는 주변의 분위기, 즉 atmosphere에 생각보다 크게 영향을 받아요. 조명이나 음악, 냄새 같은 환경 자극은 우리의 감정과 행동을 조용히 바꾸죠. 심리학에서는 이런 현상을 environmental psychology, 즉 환경 심리와 관련지어 설명하는데, 공간의 밝기나 소리가 사람의 각성 수준을 낮추거나 높인다고 봐요. 일상 비유를 하나 들어 볼까요? 같은 라면도 형광등 아래에서 먹을 때와 은은한 조명 아래에서 먹을 때 느껴지는 만족감이 다르잖아요. 그래서 사람들은 상대의 기분을 좋게 만들기 위해 일부러 공간의 분위기를 바꾸는 전략을 쓰곤 합니다. 이 글에 나오는 촛불 저녁식사도 바로 그런 분위기 조성의 대표적인 예예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>상황 제시\u003csmall>도입·통념 · 문장 1\u003c/small>\u003c/h4>\u003cp>주변 환경의 \u003cb class=\"key\">분위기\u003c/b>를 바꿈으로써 우리의 기분에 영향을 끼치려고 다른 사람들이 노력하는 많은 상황들이 있다고 말합니다. 그리고 아마도 당신은 이미 그와 동일한 것을 했을 수도 있다고 덧붙이며 독자에게 \u003cb class=\"key\">공감\u003c/b>을 불러일으킵니다. 이 문장이 글 전체의 \u003cb class=\"key\">주제\u003c/b>를 먼저 던지는 역할을 해요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>사례 제시\u003csmall>예시 · 문장 2–3\u003c/small>\u003c/h4>\u003cp>한 남자가 결혼기념일을 잊어버린 \u003cb class=\"key\">난처한 \u003c/b>\u003cb class=\"key\">상황\u003c/b>에 놓여 있다고 상상해 보자고 합니다. 그 남자는 낭만적인 배경 음악과 함께 아내를 위해 촛불이 켜진 저녁식사를 준비함으로써 그 상황을 \u003cb class=\"key\">구해내려고\u003c/b> 노력합니다. 앞의 주제를 구체적인 이야기로 보여 주는 대목이에요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>원리 재진술\u003csmall>전환·주장 · 문장 4\u003c/small>\u003c/h4>\u003cp>그가 그것을 알든 모르든, 촛불이 켜진 저녁식사는 한 사람의 \u003cb class=\"key\">기분\u003c/b>에 영향을 끼칠 수 있는 환상적인 방법이라고 정리합니다. Whether or not he is aware of it이라는 표현으로 의도 여부와 상관없이 \u003cb class=\"key\">환경의 \u003c/b>\u003cb class=\"key\">힘\u003c/b>이 작동한다는 점을 짚어 주죠. 예시가 다시 주제와 연결되는 지점입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>효과의 구체화\u003csmall>근거 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>아내가 방에 들어오면 그가 준비한 멋진 저녁식사의 맛있는 냄새에 놀라게 됩니다. 이어서 은은한 촛불 조명이 그녀를 \u003cb class=\"key\">편안한 \u003c/b>\u003cb class=\"key\">기분\u003c/b>이 들도록 한다고 말합니다. 감각 자극이 실제 \u003cb class=\"key\">감정 \u003c/b>\u003cb class=\"key\">변화\u003c/b>로 이어지는 과정을 보여 주는 부분이에요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>결과 정리\u003csmall>결론 · 문장 7\u003c/small>\u003c/h4>\u003cp>끝으로 낭만적인 음악이 나머지 역할을 하면서 아내로 하여금 그 실수에 대한 남편의 \u003cb class=\"key\">사과\u003c/b>를 더 기꺼이 받아들이게 한다고 마무리합니다. 결국 환경의 분위기가 \u003cb class=\"key\">관계 \u003c/b>\u003cb class=\"key\">회복\u003c/b>이라는 결과까지 만들어 낸다는 뜻이죠. And finally가 결론을 알리는 신호입니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 따라가 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 도입이에요. 주변 환경의 분위기를 바꿈으로써 우리의 기분에 영향을 끼치려고 다른 사람들이 노력하는 많은 상황들이 있다고 말하죠. 그리고 아마도 당신은 이미 그와 동일한 것을 했을 수도 있다고 덧붙여요. 독자에게 자연스럽게 공감을 불러일으키는 부분입니다.","hl":"f0"},{"n":5,"text":"두 번째 단계는 예시예요. 한 남자가 결혼기념일을 잊어버린 난처한 상황에 놓여 있다고 상상해 보자고 하죠. 그 남자는 낭만적인 배경 음악과 함께 아내를 위해 촛불이 켜진 저녁식사를 준비하면서 그 상황을 구해내려고 노력해요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 원리를 짚어 주는 부분이에요. 그가 그것을 알든 모르든, 촛불이 켜진 저녁식사는 한 사람의 기분에 영향을 끼칠 수 있는 환상적인 방법이라고 말합니다. 여기서 앞에서 든 예시가 주제와 다시 연결되는 거죠.","hl":"f2"},{"n":7,"text":"네 번째 단계는 효과가 구체적으로 나타나는 장면이에요. 아내가 방에 들어오면 그가 준비한 멋진 저녁식사의 맛있는 냄새에 놀라고, 이어서 은은한 촛불 조명이 그녀를 편안한 기분이 들도록 해요.","hl":"f3"},{"n":8,"text":"다섯 번째 단계는 마무리예요. 끝으로 낭만적인 음악이 나머지 역할을 해서 아내로 하여금 그 실수에 대한 남편의 사과를 더 기꺼이 받아들이게 만든다고 정리합니다. 환경의 분위기가 결국 관계 회복으로 이어진다는 결론이죠.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">예시\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 번째 문장에서 다른 사람의 기분에 영향을 끼치려고 \u003cb class=\"key\">주변 \u003c/b>\u003cb class=\"key\">환경의 \u003c/b>\u003cb class=\"key\">분위기\u003c/b>를 바꾸는 상황이 많다는 \u003cb class=\"key\">주제\u003c/b>를 먼저 제시합니다. 이어서 두 번째와 세 번째 문장에서 결혼기념일을 잊은 남자의 사례로 \u003cb class=\"key\">예시\u003c/b>를 들고, 네 번째 문장에서 촛불 저녁식사가 기분에 영향을 끼치는 환상적인 방법이라고 \u003cb class=\"key\">재진술\u003c/b>합니다. 다섯 번째부터 일곱 번째 문장은 조명과 음악이 실제로 아내의 기분을 바꾸는 과정을 구체적으로 보여 줍니다. 주제가 맨 앞에 나오고 예시가 뒤따르므로 \u003cb class=\"key\">두괄식\u003c/b> 예시 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>For example (2)\u003c/b>\u003cspan>예시 도입\u003c/span>\u003cb>Whether or not he is aware of it (4)\u003c/b>\u003cspan>양보·전환\u003c/span>\u003cb>And finally (7)\u003c/b>\u003cspan>마무리·결과 제시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">influence our moods\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">changing the atmosphere of the environment\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">influence the way that a person feels\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">puts her in a relaxed mood\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">more willing to accept the husband's apology\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"이 글의 전개 방식은 예시예요. 첫 문장에서 주변 환경의 분위기를 바꿔 기분에 영향을 준다는 주제를 먼저 던지고, 이어서 결혼기념일을 잊은 남자의 사례로 그것을 뒷받침하죠. 주제가 맨 앞에 나오고 예시가 뒤따르는 두괄식 구조입니다. 그래서 첫 문장만 제대로 잡아도 글의 절반은 이해한 셈이에요.","hl":"ty"},{"n":10,"text":"신호어도 꼭 챙겨 보세요. 두 번째 문장 앞에 나오는 For example은 예시가 시작된다는 신호예요. 네 번째 문장의 Whether or not he is aware of it은 그가 알든 모르든, 즉 의도와 상관없이 받아들이라는 양보의 표현이고, 마지막 문장의 And finally는 마무리와 결과를 알려 주죠. 또 influence our moods가 influence the way that a person feels로, 다시 puts her in a relaxed mood로 이어지면서 같은 개념이 재진술되는 흐름도 눈에 담아 두세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>situation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>상황\u003c/span>\u003c/div>\u003cdiv>\u003cb>influence\u003c/b>\u003cem>동사\u003c/em>\u003cspan>영향을 끼치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>mood\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기분\u003c/span>\u003c/div>\u003cdiv>\u003cb>atmosphere\u003c/b>\u003cem>명사\u003c/em>\u003cspan>분위기\u003c/span>\u003c/div>\u003cdiv>\u003cb>environment\u003c/b>\u003cem>명사\u003c/em>\u003cspan>환경\u003c/span>\u003c/div>\u003cdiv>\u003cb>probably\u003c/b>\u003cem>부사\u003c/em>\u003cspan>아마도\u003c/span>\u003c/div>\u003cdiv>\u003cb>imagine\u003c/b>\u003cem>동사\u003c/em>\u003cspan>상상하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>unfortunate\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>불행한, 난처한\u003c/span>\u003c/div>\u003cdiv>\u003cb>wedding anniversary\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>결혼기념일\u003c/span>\u003c/div>\u003cdiv>\u003cb>fix\u003c/b>\u003cem>동사\u003c/em>\u003cspan>해결하다, 고치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>mistake\u003c/b>\u003cem>명사\u003c/em>\u003cspan>실수\u003c/span>\u003c/div>\u003cdiv>\u003cb>prepare\u003c/b>\u003cem>동사\u003c/em>\u003cspan>준비하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>candlelit\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>촛불이 켜진\u003c/span>\u003c/div>\u003cdiv>\u003cb>romantic\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>낭만적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>background music\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>배경 음악\u003c/span>\u003c/div>\u003cdiv>\u003cb>whether or not\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~이든 아니든\u003c/span>\u003c/div>\u003cdiv>\u003cb>be aware of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 알다, 인식하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>fantastic\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>환상적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>the way\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>방식, 방법\u003c/span>\u003c/div>\u003cdiv>\u003cb>be surprised by\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 놀라다\u003c/span>\u003c/div>\u003cdiv>\u003cb>delicious\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>맛있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>aroma\u003c/b>\u003cem>명사\u003c/em>\u003cspan>냄새, 향\u003c/span>\u003c/div>\u003cdiv>\u003cb>outstanding\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>뛰어난, 멋진\u003c/span>\u003c/div>\u003cdiv>\u003cb>low-level\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>낮은 수준의, 은은한\u003c/span>\u003c/div>\u003cdiv>\u003cb>relaxed\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>편안한\u003c/span>\u003c/div>\u003cdiv>\u003cb>do the rest\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>나머지 역할을 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>be willing to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>기꺼이 ~하려고 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>accept\u003c/b>\u003cem>동사\u003c/em>\u003cspan>받아들이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>apology\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사과\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"핵심 단어도 몇 개 짚어 볼게요. atmosphere는 분위기, influence는 영향을 끼치다, aroma는 맛있는 냄새라는 뜻이에요. unfortunate는 난처한, outstanding은 멋진, willing은 기꺼이 하려는이라는 의미로 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">influence\u003c/b>\u003cspan class=\"m\">영향을 끼치다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">affect\u003c/span>\u003cspan class=\"s\">impact\u003c/span>\u003cspan class=\"s\">shape\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">atmosphere\u003c/b>\u003cspan class=\"m\">분위기\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">mood\u003c/span>\u003cspan class=\"s\">ambience\u003c/span>\u003cspan class=\"s\">environment\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">unfortunate\u003c/b>\u003cspan class=\"m\">불행한, 난처한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">unlucky\u003c/span>\u003cspan class=\"s\">hapless\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">fortunate\u003c/span>\u003cspan class=\"a\">lucky\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">aware\u003c/b>\u003cspan class=\"m\">인식하는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">conscious\u003c/span>\u003cspan class=\"s\">mindful\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unaware\u003c/span>\u003cspan class=\"a\">oblivious\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">fantastic\u003c/b>\u003cspan class=\"m\">환상적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">wonderful\u003c/span>\u003cspan class=\"s\">amazing\u003c/span>\u003cspan class=\"s\">excellent\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">terrible\u003c/span>\u003cspan class=\"a\">awful\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">accept\u003c/b>\u003cspan class=\"m\">받아들이다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">receive\u003c/span>\u003cspan class=\"s\">take\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">refuse\u003c/span>\u003cspan class=\"a\">reject\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">willing\u003c/b>\u003cspan class=\"m\">기꺼이 하는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">ready\u003c/span>\u003cspan class=\"s\">eager\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unwilling\u003c/span>\u003cspan class=\"a\">reluctant\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어로 정리해 볼게요. influence는 affect, impact와 가까워요. unfortunate는 unlucky와 비슷하고 반대말은 fortunate, lucky죠. aware는 conscious와 같고 반대는 unaware예요. fantastic은 wonderful, amazing과 통하고 반대는 terrible입니다. accept는 receive와 가깝고 반대는 refuse, reject이고요. willing의 반대는 unwilling, reluctant라는 점도 함께 기억해 주세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 상황들이 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">many \u003c/span>\u003cspan class=\"tgt\">situations\u003c/span>/\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 사람들이 우리의 기분에 영향을 끼치려고 노력하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">where \u003c/span>\u003cspan class=\"tgt\">other \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">try \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">influence \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">moods\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">주변 환경의 분위기를 바꿈으로써\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">changing \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">atmosphere \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">environment\u003c/span>;/\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아마도 당신은 이미 그와 동일한 것을 했을 수도 있다\u003c/span>\u003cspan class=\"en\">you \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">probably \u003c/span>\u003cspan class=\"tgt\">done \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">yourself\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">주변 환경의 분위기를 바꿈으로써 우리의 기분에 영향을 끼치려고 다른 사람들이 노력하는 많은 상황들이 있다. 아마도 당신은 이미 그와 동일한 것을 했을 수도 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글 전체를 여는 \u003cb class=\"key\">주제문\u003c/b>으로, 다른 사람이 환경의 \u003cb class=\"key\">분위기\u003c/b>를 바꿔 우리 기분에 영향을 줄 수 있다는 큰 주제를 먼저 던집니다. 뒤의 'you have probably done it yourself'는 독자에게 말을 거는 표현으로, 우리 모두가 \u003cb class=\"key\">경험\u003c/b>해 본 일이라고 강조해 주제에 친근하게 다가갑니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">there be 구문(유도부사 there)\u003c/span> : [There + be동사 + 주어] → '~이 있다' : \"많은 상황들이 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관계부사 where (선행사 situations)\u003c/span> : [선행사(situations) + where + 주어·동사·목적어를 갖춘 절] : \"다른 사람들이 우리의 기분에 영향을 끼치려고 노력하는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 by + 동명사(수단·방법)\u003c/span> : [by + 동명사(~ing)] → '~함으로써' : \"주변 환경의 분위기를 바꿈으로써\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">현재완료(경험) + 재귀대명사 강조\u003c/span> : [have + 과거분사] → '~해 본 적이 있다' / [재귀대명사 yourself] → '당신 스스로' : \"아마도 당신은 이미 그와 동일한 것을 했을 수도 있다\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"There are many situations/, 많은 상황들이 있다. where other people try to influence our moods, 다른 사람들이 우리의 기분에 영향을 끼치려고 노력하는. by changing the atmosphere of the environment;/, 주변 환경의 분위기를 바꿈으로써. you have probably done it yourself, 아마도 당신은 이미 그와 동일한 것을 했을 수도 있다. 이 문장 전체를 해석하면, 주변 환경의 분위기를 바꿈으로써 우리의 기분에 영향을 끼치려고 다른 사람들이 노력하는 많은 상황들이 있다. 아마도 당신은 이미 그와 동일한 것을 했을 수도 있다.","hl":"m"},{"n":14,"text":"이 문장은 글 전체를 여는 주제문이에요. 다른 사람이 환경의 분위기를 바꿔서 우리 기분에 영향을 주는 일이 아주 흔하다는 걸 말하고 있죠. 마지막에 you have probably done it yourself라고 하면서 독자에게 말을 거는 것도 잊지 않았어요. 우리 모두가 해 봤을 일이라고 친근하게 끌어들이는 거예요.","hl":"mn"},{"n":15,"text":"먼저 There are many situations는 유도부사 there를 쓴 존재 구문이에요. 주어 many situations를 동사 뒤로 보내서 많은 상황들이 있다는 도입 느낌을 살린 거죠. 두 번째로 where other people try to influence our moods에서 where는 관계부사예요. 선행사가 장소가 아니라 상황이어도 where를 쓸 수 있고, 뒤에 목적어까지 갖춘 완전한 절이 오기 때문에 which가 아니라 where인 거예요. 세 번째로 by changing the atmosphere of the environment는 전치사 by 뒤에 동명사가 온 수단 표현이에요. 전치사 뒤에는 동사원형이 올 수 없으니까 changing이 된 거고, 분위기를 바꿈으로써라는 뜻이 됩니다. 마지막으로 have probably done은 현재완료로 지금까지의 경험을 말하고, yourself는 당신 스스로라고 강조해 주는 재귀대명사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들어\u003c/span>\u003cspan class=\"en\">(B) For example,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 상상해 보자\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">let \u003c/span>\u003cspan class=\"tgt\">us \u003c/span>\u003cspan class=\"tgt\">imagine\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 남자가 난처한 상황에 놓여 있다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">man \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">unfortunate \u003c/span>\u003cspan class=\"tgt\">situation\u003c/span>/\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그가 자신의 결혼기념일을 잊어버린\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">where \u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">forgot \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">wedding \u003c/span>\u003cspan class=\"tgt\">anniversary\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">( B ) 예를 들어 한 남자가 그의 결혼기념일을 잊어버린 난처한 상황에 놓여 있다고 상상해 보자.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞의 주제를 구체적인 \u003cb class=\"key\">예시\u003c/b>로 풀어 주는 부분이에요. 결혼기념일을 잊어버린 남자가 \u003cb class=\"key\">난처한 \u003c/b>\u003cb class=\"key\">상황\u003c/b>에 놓였다는 설정을 독자에게 상상하게 하죠. 이 설정이 다음 문장에서 분위기를 바꾸는 시도로 이어진다는 점을 기억해 두면 좋아요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">청유문 Let's (제안·권유)\u003c/span> : [Let + 목적어(us) + 동사원형] → '~하자' : \"우리가 상상해 보자\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 that (명사절, 동사의 목적어)\u003c/span> : [imagine + that + 주어 + 동사 ~] → '~라고 상상하다' : \"한 남자가 난처한 상황에 놓여 있다고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">관계부사 where (선행사 situation)\u003c/span> : [선행사(situation) + where + 완전한 절] : \"그가 자신의 결혼기념일을 잊어버린\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"(B) For example, 예를 들어. let us imagine, 우리가 상상해 보자. that a man is in the unfortunate situation/, 한 남자가 난처한 상황에 놓여 있다고. where he forgot his wedding anniversary, 그가 자신의 결혼기념일을 잊어버린. 이 문장 전체를 해석하면, ( B ) 예를 들어 한 남자가 그의 결혼기념일을 잊어버린 난처한 상황에 놓여 있다고 상상해 보자.","hl":"m"},{"n":17,"text":"이 문장은 앞에서 말한 주제를 구체적인 예로 풀어 주는 부분이에요. 결혼기념일을 잊어버린 남자가 난처한 상황에 놓였다는 설정을 우리가 상상하게 만드는 거죠. 바로 이 상황이 다음 문장에서 분위기를 바꾸는 시도로 이어진다고 생각하면서 읽으면 흐름이 아주 자연스러워요.","hl":"mn"},{"n":18,"text":"먼저 let us imagine은 함께 상상해 보자고 제안하는 청유 구문이에요. Let 다음에 목적어 us가 오고 to 없이 동사원형 imagine이 오죠. 두 번째로 that a man is in the unfortunate situation에서 that은 imagine의 목적어 자리에 온 명사절을 이끄는 접속사예요. that절 안은 주어와 동사가 다 갖춰진 완전한 문장 구조입니다. 세 번째로 where he forgot his wedding anniversary의 where는 앞의 the unfortunate situation을 받는 관계부사예요. 뒤에 목적어 his wedding anniversary까지 있는 완전한 절이 오니까 관계부사 where를 쓴 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 남자는 자신의 실수를 바로잡으려고 노력한다\u003c/span>\u003cspan class=\"en\">The man \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">tries \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">fix \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">mistake\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아내를 위해 촛불이 켜진 저녁식사를 준비함으로써\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">preparing \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">candlelit \u003c/span>\u003cspan class=\"tgt\">dinner \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">wife\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">낭만적인 배경 음악과 함께\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">romantic \u003c/span>\u003cspan class=\"tgt\">background \u003c/span>\u003cspan class=\"tgt\">music\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 남자는 낭만적인 배경 음악과 함께 아내를 위해 직접 요리를 하고 촛불이 켜진 저녁식사를 준비함으로써 그 상황을 구해내려고 노력한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞에서 상상한 남자가 실제로 어떤 \u003cb class=\"key\">행동\u003c/b>을 하는지 보여 줘요. 실수를 바로잡는 방법이 말이 아니라 \u003cb class=\"key\">분위기\u003c/b>를 만드는 것이라는 점이 핵심이죠. 촛불과 음악이라는 환경 요소가 등장하면서 글의 \u003cb class=\"key\">주제\u003c/b>와 자연스럽게 연결됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(try의 목적어)\u003c/span> : [try + to + 동사원형] → '~하려고 노력하다' : \"자신의 실수를 바로잡으려고 노력한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 by + 동명사(수단·방법)\u003c/span> : [by + 동명사(~ing)] → '~함으로써' : \"아내를 위해 촛불이 켜진 저녁식사를 준비함으로써\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">과거분사형 형용사(명사 수식)\u003c/span> : [명사 candle + 과거분사 lit → a candlelit dinner] : \"촛불이 켜진 저녁식사\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">전치사 with (동반·수반)\u003c/span> : [with + 명사] → '~와 함께' : \"낭만적인 배경 음악과 함께\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"The man tries to fix his mistake, 그 남자는 자신의 실수를 바로잡으려고 노력한다. by preparing a candlelit dinner for his wife, 아내를 위해 촛불이 켜진 저녁식사를 준비함으로써. with romantic background music, 낭만적인 배경 음악과 함께. 이 문장 전체를 해석하면, 그 남자는 낭만적인 배경 음악과 함께 아내를 위해 u003cb class=\"key\">주제\u003c/b>를 예시 안에서 다시 확인해 주고, 뒤에 나오는 빛·냄새·음악이 왜 효과적인지 알려 주는 \u003cb class=\"key\">근거\u003c/b> 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">양보의 부사절(whether or not)\u003c/span> : Whether or not + [주어 + 동사], + [주절] : \"그가 그것을 알든 모르든\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : [명사 way] + to + [동사원형] (to부정사구가 way를 수식) : \"영향을 끼치는 환상적인 방법\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">관계부사 that\u003c/span> : the way + that + [주어 + 동사 (완전한 절)] : \"한 사람이 느끼는 방식\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"Whether or not he is aware of it, 그가 그것을 알든 모르든. a candlelit dinner is a fantastic way, 촛불이 켜진 저녁식사는 환상적인 방법이다. to influence, 영향을 끼치는. the way that a person feels, 한 사람이 느끼는 방식에. 이 문장 전체를 해석하면, 그가 그것을 알든 모르든, 촛불이 켜진 저녁식사는 한 사람의 기분에 영향을 끼칠 수 있는 환상적인 방법이다.","hl":"m"},{"n":23,"text":"이 문장은 남편이 그 사실을 알고 있든 모르든 상관없이, 촛불 켜진 저녁식사 자체가 아내의 기분을 바꾸는 훌륭한 수단이라는 걸 말하고 있어요. 여기서 주제는 결국 주변 분위기로 기분을 바꾼다는 것이고, 이 문장이 뒤에 나오는 빛과 냄새, 음악이 왜 효과가 있는지 알려 주는 근거가 되는 거죠.","hl":"mn"},{"n":24,"text":"어법은 세 군데만 짚을게요. 첫 번째, Whether or not he is aware of it에서 whether or not은 양보의 뜻을 만드는 표현이에요. 두 번째, a fantastic way to influence에서 to부정사는 앞의 way를 꾸며 주는 형용사적 용법이죠. 세 번째, the way that a person feels에서 that은 관계부사로, 선행사 the way 뒤에서 how와 같은 역할을 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 남자의 아내가 그 방에 들어오면,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">man's \u003c/span>\u003cspan class=\"tgt\">wife \u003c/span>\u003cspan class=\"tgt\">enters \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan clas  + [주어 he + has prepared] : \"그가 준비한 멋진 저녁식사\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"When the man's wife enters the room, 그 남자의 아내가 그 방에 들어오면. she is surprised by, 그녀는 놀라게 된다. the delicious aroma, 맛있는 냄새에. of the outstanding dinner, 멋진 저녁식사의. he has prepared, 그가 준비한. 이 문장 전체를 해석하면, 그 남자의 아내가 그 방에 들어오면, 그가 준비했던 멋진 저녁식사의 맛있는 냄새에 놀라게 된다.","hl":"m"},{"n":26,"text":"아내가 방에 들어오는 순간, 후각이 먼저 작용하는 장면이에요. 촛불 같은 시각 요소보다 음식 냄새가 먼저 기분을 흔드는 구체적인 예시라는 점을 잡아 주세요.","hl":"mn"},{"n":27,"text":"어법 첫 번째, When the man's wife enters the room은 시간의 부사절이에요. 두 번째, she is surprised by는 수동태로, 냄새가 그녀를 놀라게 한 거니까 be surprised by 형태를 쓴 거죠. 세 번째, the outstanding dinner he has prepared에서는 목적격 관계대명사가 생략되어 있고, has prepared는 현재완료로 그가 준비를 마쳐 둔 상태를 보여 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">은은한 촛불 조명은\u003c/span>\u003cspan class=\"en\">(A) The low-level light of the candle\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀를 두게 한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">puts \u003c/span>\u003cspan class=\"tgt\">her \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">편안한 기분에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">relaxed \u003c/span>\u003cspan class=\"tgt\">mood\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">은은한 촛불 조명은 그녀를 편안한 기분이 들도록 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 촛불의 은은한 빛이 아내를 편안한 상태로 만들어 준다고 정리하는 문장입니다. 앞 문장의 냄새에 이어 \u003cb class=\"key\">시각\u003c/b> 요소가 \u003cb class=\"key\">기분\u003c/b>을 바꾸는 원리를 보여 주고, 마지막 문장의 음악으로 자연스럽게 흐름을 넘겨 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">목적어 + 목적격보어를 데리는 동사 put\u003c/span> : put + [목적어 her] + [전치사구 in a relaxed mood (목적격보어)] : \"그녀를 편안한 기분이 들게 한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">감정을 나타내는 분사 형용사\u003c/span> : [감정을 느끼는 대상] + 과거분사(relaxed) / [감정을 일으키는 대상] + 현재분사(relaxing) : \"편안해진 기분\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"The low-level light of the candle, 은은한 촛불 조명은. puts her, 그녀를 두게 한다. in a relaxed mood, 편안한 기분에. 이 문장 전체를 해석하면, 은은한 촛불 조명은 그녀를 편안한 기분이 들도록 한다.","hl":"m"},{"n":29,"text":"촛불의 은은한 빛이 아내를 편안한 상태로 만든다는 정리 문장이에요. 냄새에 이어 시각 요소가 기분을 바꾸는 원리를 보여 주고, 다음 문장의 음악으로 자연스럽게 넘어가는 흐름을 만들어 줍니다.","hl":"mn"},{"n":30,"text":"어법 첫 번째, puts her in a relaxed mood는 put이 목적어 뒤에 목적격보어를 데리고 오는 구조예요. 두 번째, relaxed는 과거분사형 형용사입니다. 편안함을 느끼는 쪽이 사람이기 때문에 relaxing이 아니라 relaxed를 쓰는 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 끝으로,\u003c/span>\u003cspan class=\"en\">And finally,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">낭만적인 음악은 나머지 역할을 하게 된다,\u003c/span>\u003cspan class=\"en\">the romantic music does the rest,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아내로 하여금 더 기꺼이 하도록 만들면서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">making \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">wife \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">willing \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 실수에 대한 남편의 사과를 받아들이게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">accept \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">husband's \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">apology \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">mistake\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그리고 끝으로, 낭만적인 음악은 아내로 하여금 그 실수에 대한 남편의 사과를 더 기꺼이 받아들이게 하는 나머지 역할을 하게 된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 언급한 촛불의 조명에 이어 마지막 요소인 음악의 효과를 정리하는 문장입니다. \u003cb class=\"key\">does \u003c/b>\u003cb class=\"key\">the \u003c/b>\u003cb class=\"key\">rest\u003c/b>는 '남은 역할을 다 해 준다', 즉 앞선 분위기 조성에 힘입어 결정적인 한몫을 해낸다는 뜻의 \u003cb class=\"key\">비유적 \u003c/b>\u003cb class=\"key\">표현\u003c/b>이에요. 결국 이 문장은 주변 환경의 분위기가 사람의 기분과 판단에 영향을 준다는 글의 \u003cb class=\"key\">주제\u003c/b>를 구체적인 사례로 마무리 짓는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">분사구문(현재분사, 결과)\u003c/span> : [주절] , making + [목적어] + [목적격보어] (주절 전체를 받아 결과를 나타내는 분사구문) : \"아내로 하여금 …을 더 기꺼이 받아들이게 만들면서(→ 그 결과 …하게 된다)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">비교급 + be willing to부정사\u003c/span> : more + [형용사 willing] + [to accept (to부정사/명사적 용법)] : \"더 기꺼이 받아들일\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 for (~에 대한)\u003c/span> : [명사 apology] + for + [명사 the mistake] : \"그 실수에 대한 사과\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"And finally, 그리고 끝으로. the romantic music does the rest, 낭만적인 음악은 나머지 역할을 하게 된다. making the wife more willing, 아내로 하여금 더 기꺼이 하도록 만들면서. to accept the husband's apology for the mistake, 그 실수에 대한 남편의 사과를 받아들이게. 이 문장 전체를 해석하면, 그리고 끝으로, 낭만적인 음악은 아내로 하여금 그 실수에 대한 남편의 사과를 더 기꺼이 받아들이게 하는 나머지 역할을 하게 된다.","hl":"m"},{"n":32,"text":"이 문장은 촛불 조명에 이어 마지막 장치인 음악의 효과를 정리하는 문장이에요. does the rest는 '남은 역할을 다 해 준다'는 뜻으로, 앞에서 만든 분위기에 힘입어 음악이 결정적인 한몫을 한다는 비유적 표현이죠. 결국 분위기가 사람의 기분과 판단에 영향을 준다는 주제를 이 사례로 마무리하는 겁니다.","hl":"mn"},{"n":33,"text":"먼저 making은 분사구문이에요. 접속사와 주어가 생략되었고 의미상 주어가 주절의 주어인 the romantic music과 같아서 그대로 이어지죠. 앞 절의 내용이 낳은 결과를 덧붙이는 결과의 분사구문입니다. 두 번째로 more willing to accept인데요, willing은 to부정사를 받아 '기꺼이 ~할'이라는 뜻을 만드는 형용사예요. 거기에 비교급 more가 붙어서 '더 기꺼이'라는 정도 차이를 나타냅니다. 세 번째로 apology for the mistake에서 전치사 for는 '~에 대한'이라는 뜻으로, apology for가 하나로 굳어진 관용적 결합이라는 점을 기억해 두세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>다른 사람들은 주변 환경의 \u003cb class=\"key\">분위기\u003c/b>를 바꿈으로써 우리의 기분에 영향을 끼치려고 하며, 우리도 이미 그와 동일한 것을 했을 수 있다.\u003c/li>\u003cli>결혼기념일을 잊은 남자는 낭만적인 배경 음악과 함께 촛불이 켜진 \u003cb class=\"key\">저녁식사\u003c/b>를 준비해 그 상황을 구해내려고 노력한다.\u003c/li>\u003cli>그가 그것을 알든 모르든, 촛불이 켜진 저녁식사는 한 사람의 \u003cb class=\"key\">기분\u003c/b>에 영향을 끼칠 수 있는 환상적인 방법이다.\u003c/li>\u003cli>맛있는 냄새와 은은한 조명이 아내를 \u003cb class=\"key\">편안한 \u003c/b>\u003cb class=\"key\">기분\u003c/b>으로 만들고, 낭만적인 음악이 그녀로 하여금 남편의 \u003cb class=\"key\">사과\u003c/b>를 더 기꺼이 받아들이게 한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>We can influence other people's moods by changing the atmosphere of the environment, just as a candlelit dinner with romantic music makes a wife relaxed and more willing to accept her husband's apology.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">주변 환경의 \u003cb class=\"key\">분위기\u003c/b>를 바꿈으로써 다른 사람의 \u003cb class=\"key\">기분\u003c/b>에 영향을 끼치려는 상황은 흔하며, 촛불이 켜진 저녁식사처럼 은은한 조명과 낭만적인 음악은 상대를 편안한 기분으로 만들어 \u003cb class=\"key\">사과\u003c/b>를 더 기꺼이 받아들이게 한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":34,"text":"오늘 글은 환경의 분위기가 사람의 기분을 바꾼다는 아주 단순하지만 강력한 이야기였어요. 촛불의 은은한 조명, 맛있는 냄새, 낭만적인 음악이 하나씩 더해지면서 아내의 마음이 열리는 과정을 꼭 기억해 두세요. 시험에서는 예시가 어떤 주제를 뒷받침하는지, 그리고 influence나 mood 같은 핵심 어휘의 의미를 묻는 형태로 나올 수 있어요. 오늘도 수고했어요, 다음 강의에서 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
