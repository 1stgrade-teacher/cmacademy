<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SO 레벨1 2강 적용독해03 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-chips .x{background:none;color:#999;padding:0}
.lp-sno{font-size:13px;color:#8493A1;font-weight:700;margin-bottom:8px}

.lp-chunks{display:flex;flex-wrap:wrap;gap:16px 10px;margin-bottom:12px;align-items:flex-end}
.lp-chunk{display:flex;flex-direction:column}
.lp-chunk .ko{font-size:13px;color:var(--pk-t);font-weight:700;line-height:1.3;margin-bottom:2px}
.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}
.lp-top::before{height:5px;background:linear-gradient(90deg,var(--pk) 0,var(--pk) 80%,var(--am) 80%,var(--am) 100%)}
.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}
.lp-tag{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700;padding:2px 12px}
.lp-qn{flex:0 0 112px;height:112px;align-self:center;background:#fff;color:var(--pk);border:3px solid var(--pk);border-radius:50%;font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;font-size:26px}
.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}
.lp-qn .qt{display:block;white-space:nowrap;line-height:1.12;letter-spacing:-.02em}
.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}

.lp-st h4{color:var(--ink,#1B2733)}
.lp-st h4 i{border-radius:4px;width:auto;min-width:24px;padding:0 4px}
.lp-pill{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700}
.lp-chain span.c{background:#fff;border:1px solid #AEBBE6;border-radius:3px;font-weight:600}
.lp-ct th{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif}
.lp-vg em{background:#fff;border:1px solid var(--pk-b);border-radius:3px}
.lp-sa>div{border-radius:4px;border-color:var(--pk-b)}
.lp-chips span{border-radius:3px;background:#fff}
.lp-chips .s{border:1px solid #AEBBE6;color:#3A4FA3}
.lp-chips .a{border:1px solid var(--am-b);color:var(--am-d);background:#FFFBF2}
.lp-sno .es{background:var(--am);border-radius:2px;font-weight:700}
.lp-chunk .en{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:600}
.lp-chunk+.lp-chunk{border-left:1px solid var(--pk-b)}
.lp .tgt{background:var(--am-l);border-bottom:2.5px dotted var(--am)}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"SO 레벨1 2강 적용독해03","audioDir":"2-03_audio","preview":false,"count":34,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">2강\u003cbr>적용독해03\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">SO 레벨1\u003c/div>\u003ch1>Step Beyond Your Comfort Zone\u003c/h1>\u003ch2>당신의 안전지대를 넘어서라\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>사람들은 흔히 자신의 삶을 \u003cb class=\"key\">좁은 \u003c/b>\u003cb class=\"key\">한계\u003c/b> 안에 가두고 편안한 환경에 머물며 기회를 피한다. 그러나 이런 태도는 \u003cb class=\"key\">큰 \u003c/b>\u003cb class=\"key\">실수\u003c/b>이므로, 항상 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">도전\u003c/b>을 환영하고 가능한 한 자주 받아들여야 한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Instead of limiting ourselves to a narrow comfort zone, we should welcome new challenges and say yes as often as possible.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 제한된 안전지대에 머무는 태도를 다룬 짧은 지문을 함께 읽겠습니다. 이 글은 많은 사람이 자기 삶을 좁은 한계 안에 가두고 편안한 안전지대에 머문다고 말해요. 그리고 마지막에 새로운 도전을 환영하라고 주장합니다. 요지는 결국 한계를 정하는 태도 자체를 바꾸라는 것이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">우리가 흔히 말하는 \u003cb class=\"key\">comfort \u003c/b>\u003cb class=\"key\">zone\u003c/b>은 편안함을 느끼는 심리적 안전지대를 뜻합니다. 그 안에 머무는 동안에는 불안이 줄어들지만, 동시에 배움의 폭도 함께 줄어들죠. 심리학자 캐럴 드웩은 이것을 \u003cb class=\"key\">fixed \u003c/b>\u003cb class=\"key\">mindset\u003c/b>과 \u003cb class=\"key\">growth \u003c/b>\u003cb class=\"key\">mindset\u003c/b>이라는 두 가지 사고방식으로 설명합니다. 고정된 사고방식은 능력이 타고난다고 믿어 실패를 피하려 하고, 성장의 사고방식은 능력이 노력으로 늘어난다고 믿어 실패를 배움의 재료로 씁니다. 자전거를 배울 때를 떠올려 보세요. 처음에는 넘어질까 봐 두렵지만, 그 두려움을 넘어 페달을 밟는 순간에만 실제로 실력이 늘어납니다. 그래서 도전은 위험이 아니라 성장의 조건입니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식부터 짚어 볼게요. 우리가 흔히 말하는 comfort zone은 편안함을 느끼는 심리적 안전지대를 뜻합니다. 그 안에 있는 동안에는 불안이 줄어들지만, 배움의 폭도 함께 줄어들죠. 심리학자 캐럴 드웩은 이것을 fixed mindset과 growth mindset, 두 가지 사고방식으로 설명합니다. 고정된 사고방식은 능력이 타고난다고 믿어 실패를 피하려 하고, 성장의 사고방식은 능력이 노력으로 늘어난다고 믿어 실패를 배움의 재료로 씁니다. 자전거를 배울 때를 떠올려 보세요. 넘어질까 봐 두렵지만, 그 두려움을 넘어 페달을 밟는 순간에만 실력이 늘어납니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>한계 속의 삶\u003csmall>도입·통념 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>글은 우리 모두가 한 번쯤 만난 유형의 사람들로 시작합니다. 그들은 자신의 삶을 가능한 한 \u003cb class=\"key\">좁은 \u003c/b>\u003cb class=\"key\">한계\u003c/b> 안에서 한정시키는 사람들이죠. 그리고 그런 사람들은 제한되고 편안한 \u003cb class=\"key\">안전지대\u003c/b>에 머물러 있습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>회피의 예시\u003csmall>예시 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>이런 태도가 실제로 어떤 모습인지 구체적인 예시가 이어집니다. 어떤 사람들은 대중 앞 발표가 자신을 \u003cb class=\"key\">긴장\u003c/b>시키기 때문에 그 기회를 피합니다. 또 다른 사람들은 자신을 \u003cb class=\"key\">도전적인 \u003c/b>\u003cb class=\"key\">유형\u003c/b>의 사람이 아니라고 생각하여 유학의 기회를 거부하죠.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>스스로 만든 감옥\u003csmall>문제 심화 · 문장 5\u003c/small>\u003c/h4>\u003cp>회피가 반복되면 사람들은 자기 머릿속의 \u003cb class=\"key\">한계 \u003c/b>\u003cb class=\"key\">개념\u003c/b>에 갇히게 됩니다. 그래서 그 한계를 넘어서도록 요청받을 때 오히려 \u003cb class=\"key\">분노\u003c/b>하게 되죠. 스스로 세운 울타리를 지키려는 반응인 셈입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>방향 전환\u003csmall>전환·반박 · 문장 6\u003c/small>\u003c/h4>\u003cp>여기서 however라는 신호어와 함께 글이 확 꺾입니다. 삶에 대한 이런 태도는 \u003cb class=\"key\">큰 \u003c/b>\u003cb class=\"key\">실수\u003c/b>라고 단호하게 말합니다. 앞의 사례들을 긍정할 수 없다고 \u003cb class=\"key\">반박\u003c/b>하는 지점입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>도전을 환영하라\u003csmall>주장·결론 · 문장 7\u003c/small>\u003c/h4>\u003cp>마지막으로 필자는 명령문으로 자신의 \u003cb class=\"key\">주장\u003c/b>을 던집니다. 항상 새로운 \u003cb class=\"key\">도전을 \u003c/b>\u003cb class=\"key\">환영\u003c/b>하고 가능한 한 자주 yes라고 말하라는 것이죠. 결국 한계를 넘어서는 능동적 태도가 답이라는 이야기입니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 다섯 단계로 따라가 볼게요.","hl":null},{"n":4,"text":"먼저 글은 우리 모두가 한 번쯤 만난 사람들로 시작해요. 자기 삶을 가능한 한 좁은 한계 안에서 한정시키는 사람들이죠. 그런 사람들은 제한되고 편안한 환경, 다시 말해 안전지대에 머물러 있습니다.","hl":"f0"},{"n":5,"text":"그다음에는 구체적인 예시가 나옵니다. 어떤 사람들은 대중 앞에서 발표하는 것이 자신을 긴장시키기 때문에 그 기회를 피해요. 또 다른 사람들은 자신을 도전적인 유형의 사람이 아니라고 생각해서 유학의 기회를 거부하죠.","hl":"f1"},{"n":6,"text":"이런 회피가 쌓이면 어떻게 될까요. 사람들은 자기만의 한계 개념에 갇히게 되고, 그 한계를 넘어서도록 요청받을 때 오히려 분노합니다. 스스로 세운 울타리를 지키려는 반응인 거죠.","hl":"f2"},{"n":7,"text":"바로 여기서 however가 등장합니다. 필자는 삶에 대한 이런 태도가 큰 실수라고 단호하게 반박해요. 앞에서 늘어놓은 사례들을 긍정할 수 없다고 못 박는 대목입니다.","hl":"f3"},{"n":8,"text":"마지막 문장에서 필자는 명령문으로 주장을 던집니다. 항상 새로운 도전을 환영하고, 가능한 한 자주 yes라고 말하라고 하죠. 결국 한계를 넘어서는 능동적 태도가 답이라는 이야기예요.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">통념-반박\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 7번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 사람들이 흔히 가지는 태도를 예시로 보여 준 뒤 그것을 \u003cb class=\"key\">반박\u003c/b>하고 대안을 제시합니다. 앞부분은 회피 사례들로 채워지지만 however를 기점으로 필자의 평가가 완전히 뒤집힙니다. 필자의 주장이 맨 마지막 문장에 나오므로 \u003cb class=\"key\">미괄식\u003c/b> 구조로 보는 것이 자연스럽습니다. 그래서 주제문은 마지막 문장입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Some ... Others ... (3)\u003c/b>\u003cspan>예시를 병렬로 나열하는 표지\u003c/span>\u003cb>because (3)\u003c/b>\u003cspan>발표를 피하는 이유를 붙이는 근거 표지\u003c/span>\u003cb>so (5)\u003c/b>\u003cspan>한계 인식이 분노로 이어지는 결과 표시\u003c/span>\u003cb>however (6)\u003c/b>\u003cspan>통념을 뒤집는 전환 신호\u003c/span>\u003cb>Welcome ... saying yes (7)\u003c/b>\u003cspan>주장을 구체적 행동으로 풀어 주는 명령문\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">limit their lives in the narrowest possible terms\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a limited comfort zone\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">their own conception of their limits\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">step beyond them\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">welcome new challenges\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>한계에 갇힌 삶\u003c/th>\u003cth>도전을 받아들이는 삶\u003c/th>\u003c/tr>\u003ctr>\u003ctd>좁은 안전지대에 머묾\u003c/td>\u003ctd>새로운 도전을 환영함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>발표·유학의 기회를 거부\u003c/td>\u003ctd>기회마다 yes라고 말함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한계를 넘으라는 요청에 분노\u003c/td>\u003ctd>한계를 넘어서며 성장함\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글은 흔한 태도를 보여 주고 그것을 뒤집은 다음 대안을 제시하는 통념-반박 방식이에요. 앞부분은 회피 사례로 채워져 있고, however 이후에 필자의 평가가 완전히 뒤집히죠. 그리고 주장이 맨 끝 문장에 나오니까 미괄식 구조입니다. 그래서 주제문은 마지막 문장이에요.","hl":"ty"},{"n":10,"text":"신호어는 세 개만 잡아도 충분합니다. however는 앞 내용을 뒤집는 전환이라는 표시예요. so는 한계 인식이 분노로 이어지는 인과를 보여 주고요. limit, limited, limits처럼 같은 개념이 반복되며 바꿔 표현되는 재진술의 흐름을 따라가면 글의 중심이 잡힙니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>limit\u003c/b>\u003cem>동사\u003c/em>\u003cspan>제한하다, 한정하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>narrow\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>좁은\u003c/span>\u003c/div>\u003cdiv>\u003cb>in the narrowest possible terms\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>가능한 한 가장 좁은 관점에서\u003c/span>\u003c/div>\u003cdiv>\u003cb>comfort zone\u003c/b>\u003cem>명사\u003c/em>\u003cspan>편안한 환경, 안전지대\u003c/span>\u003c/div>\u003cdiv>\u003cb>stay\u003c/b>\u003cem>동사\u003c/em>\u003cspan>머물다\u003c/span>\u003c/div>\u003cdiv>\u003cb>limited\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>제한된\u003c/span>\u003c/div>\u003cdiv>\u003cb>avoid\u003c/b>\u003cem>동사\u003c/em>\u003cspan>피하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>opportunity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기회\u003c/span>\u003c/div>\u003cdiv>\u003cb>public presentation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>대중 앞에서의 발표\u003c/span>\u003c/div>\u003cdiv>\u003cb>nervous\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>긴장한, 불안한\u003c/span>\u003c/div>\u003cdiv>\u003cb>reject\u003c/b>\u003cem>동사\u003c/em>\u003cspan>거부하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>chance\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기회, 가망\u003c/span>\u003c/div>\u003cdiv>\u003cb>study abroad\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>유학하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>consider\u003c/b>\u003cem>동사\u003c/em>\u003cspan>여기다, 생각하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>adventurous\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>모험심이 강한, 도전적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>stuck\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>갇힌, 꼼짝 못 하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>conception\u003c/b>\u003cem>명사\u003c/em>\u003cspan>개념, 인식\u003c/span>\u003c/div>\u003cdiv>\u003cb>limits\u003c/b>\u003cem>명사\u003c/em>\u003cspan>한계\u003c/span>\u003c/div>\u003cdiv>\u003cb>be asked to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~하도록 요청받다\u003c/span>\u003c/div>\u003cdiv>\u003cb>step beyond\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 넘어서다\u003c/span>\u003c/div>\u003cdiv>\u003cb>attitude\u003c/b>\u003cem>명사\u003c/em>\u003cspan>태도\u003c/span>\u003c/div>\u003cdiv>\u003cb>toward\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~에 대한, ~쪽으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>huge\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>거대한, 큰\u003c/span>\u003c/div>\u003cdiv>\u003cb>mistake\u003c/b>\u003cem>명사\u003c/em>\u003cspan>실수\u003c/span>\u003c/div>\u003cdiv>\u003cb>welcome\u003c/b>\u003cem>동사\u003c/em>\u003cspan>환영하다, 기꺼이 받아들이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>at every turn\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>매번, 어느 때든\u003c/span>\u003c/div>\u003cdiv>\u003cb>as often as possible\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>가능한 한 자주\u003c/span>\u003c/div>\u003cdiv>\u003cb>however\u003c/b>\u003cem>부사\u003c/em>\u003cspan>그러나, 하지만\u003c/span>\u003c/div>\u003cdiv>\u003cb>turn\u003c/b>\u003cem>명사\u003c/em>\u003cspan>(at every turn에서) 국면, 때\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"단어는 몇 개만 확실히 챙겨도 좋아요. comfort zone은 편안한 환경, 즉 안전지대라는 뜻이고, adventurous는 모험심이 강한, 도전적이라는 형용사입니다. step beyond는 한계를 넘어서다, at every turn은 매번이라는 숙어로 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">limit\u003c/b>\u003cspan class=\"m\">제한하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">restrict\u003c/span>\u003cspan class=\"s\">confine\u003c/span>\u003cspan class=\"s\">constrain\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">expand\u003c/span>\u003cspan class=\"a\">liberate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">avoid\u003c/b>\u003cspan class=\"m\">피하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">evade\u003c/span>\u003cspan class=\"s\">shun\u003c/span>\u003cspan class=\"s\">dodge\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">face\u003c/span>\u003cspan class=\"a\">confront\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">reject\u003c/b>\u003cspan class=\"m\">거부하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">refuse\u003c/span>\u003cspan class=\"s\">decline\u003c/span>\u003cspan class=\"s\">turn down\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">accept\u003c/span>\u003cspan class=\"a\">embrace\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">nervous\u003c/b>\u003cspan class=\"m\">긴장한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">anxious\u003c/span>\u003cspan class=\"s\">tense\u003c/span>\u003cspan class=\"s\">uneasy\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">calm\u003c/span>\u003cspan class=\"a\">relaxed\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">adventurous\u003c/b>\u003cspan class=\"m\">도전적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">daring\u003c/span>\u003cspan class=\"s\">bold\u003c/span>\u003cspan class=\"s\">venturesome\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">cautious\u003c/span>\u003cspan class=\"a\">timid\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">stuck\u003c/b>\u003cspan class=\"m\">갇힌\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">trapped\u003c/span>\u003cspan class=\"s\">confined\u003c/span>\u003cspan class=\"s\">immobilized\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">free\u003c/span>\u003cspan class=\"a\">liberated\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">welcome\u003c/b>\u003cspan class=\"m\">환영하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">embrace\u003c/span>\u003cspan class=\"s\">accept\u003c/span>\u003cspan class=\"s\">receive\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">refuse\u003c/span>\u003cspan class=\"a\">reject\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어도 정리해 볼게요. limit은 restrict, confine과 가깝고 반대말은 expand입니다. avoid는 evade, shun이고 반대말은 face, confront예요. reject는 refuse, decline이고 반대말은 accept, embrace입니다. welcome도 embrace, accept로 바꿔 쓸 수 있으니 함께 외워 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 모두는 만난 적이 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">We've \u003c/span>\u003cspan class=\"tgt\">all \u003c/span>\u003cspan class=\"tgt\">met\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들을\u003c/span>\u003cspan class=\"en\">people\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 삶을 한정시키는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">limit \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">lives\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가능한 한 좁은 한계 안에서\u003c/span>\u003cspan class=\"en\">in \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">narrowest \u003c/span>\u003cspan class=\"tgt\">possible \u003c/span>\u003cspan class=\"tgt\">terms\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리 모두는 가능한 한 좁은 한계 안에서 자신의 삶을 한정시키는 사람들을 만난 적이 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글의 도입부로, 스스로의 한계를 지나치게 좁게 정해 버리는 사람들이 흔히 있다는 사실을 환기하는 문장입니다. 삶의 범위를 \u003cb class=\"key\">최소화\u003c/b>하는 태도가 얼마나 흔한지 보여 주어, 뒤에 이어질 '편안한 환경에 머무는 사람들'의 예시를 자연스럽게 준비합니다. in ... terms는 '~한 관점에서, ~한 범위 안에서'라는 뜻의 \u003cb class=\"key\">관용 \u003c/b>\u003cb class=\"key\">표현\u003c/b>입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재완료(경험)\u003c/span> : have/has + [과거분사 met] : \"만난 적이 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 who\u003c/span> : [선행사 people] + who + [동사 limit] + [목적어 their lives] : \"자신의 삶을 한정시키는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">최상급 + possible (가능한 한 ~한)\u003c/span> : the + [최상급] + possible + [명사] : \"가능한 한 좁은 한계\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"We've all met, 우리 모두는 만난 적이 있다. people, 사람들을. who limit their lives, 자신의 삶을 한정시키는. in the narrowest possible terms, 가능한 한 좁은 한계 안에서. 이 문장 전체를 해석하면, 우리 모두는 가능한 한 좁은 한계 안에서 자신의 삶을 한정시키는 사람들을 만난 적이 있다.","hl":"m"},{"n":14,"text":"이 문장은 글의 첫 문장으로, 자기 삶의 범위를 스스로 아주 좁게 정해 버리는 사람들이 우리 주변에 흔히 있다는 걸 알려 줘요. 여기서 한계를 최소화하는 태도가 문제라는 걸 미리 깔아 두는 거죠. in terms처럼 전치사와 함께 쓰는 표현은 관용 표현으로 '어떤 관점이나 범위 안에서'라고 이해하시면 됩니다.","hl":"mn"},{"n":15,"text":"첫 번째로 We've all met은 지금까지의 경험을 말하는 현재완료이고, all이 조동사와 본동사 사이에 들어가 모두라는 강조를 더해요. 두 번째로 who limit their lives에서 who는 앞의 people을 꾸며 주는 관계대명사로, 관계사절 안에서 주어 역할을 하니까 바로 뒤에 동사 limit이 오는 겁니다. 세 번째로 the narrowest possible terms는 최상급 뒤에 possible을 붙여 가능한 한 가장 좁은이라는 강조를 만든 표현이고, terms는 여기서 범위나 한계라는 문맥적 의미로 쓰였어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 머물러 있다\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">stay\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제한된 편안한 환경에\u003c/span>\u003cspan class=\"en\">in \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">limited \u003c/span>\u003cspan class=\"tgt\">comfort \u003c/span>\u003cspan class=\"tgt\">zone\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 제한되고 편안한 환경에 머물러 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 말한 '좁은 한계'를 구체화한 문장으로, 그런 사람들이 \u003cb class=\"key\">안전지대\u003c/b>를 벗어나지 않는다는 점을 지적합니다. limited는 스스로 \u003cb class=\"key\">제한\u003c/b>을 걸어 둔 상태를, comfort zone은 변화를 피하게 만드는 익숙하고 편한 \u003cb class=\"key\">환경\u003c/b>을 뜻합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">상태 유지 동사 stay (1형식)\u003c/span> : stay + [전치사구 in a limited comfort zone] : \"머물러 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사의 형용사적 용법(수동)\u003c/span> : [과거분사 limited] + [명사 comfort zone] : \"제한된 편안한 환경\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"They stay, 그들은 머물러 있다. in a limited comfort zone, 제한된 편안한 환경에. 이 문장 전체를 해석하면, 그들은 제한되고 편안한 환경에 머물러 있다.","hl":"m"},{"n":17,"text":"이 문장은 앞에서 말한 좁은 한계를 좀 더 구체적으로 보여 줘요. 그런 사람들은 결국 제한된 편안한 환경, 다시 말해 안전지대에 머물러 있다는 거죠. limited에는 스스로 제한을 걸어 둔 상태라는 뉘앙스가 담겨 있습니다.","hl":"mn"},{"n":18,"text":"먼저 stay는 상태 유지 동사로, 뒤에 오는 전치사구가 어디에 머무는지를 보충해 줘요. 두 번째로 a limited comfort zone에서 limited는 동사 limit의 과거분사가 명사 앞에서 제한된이라는 수동의 의미로 명사를 꾸미는 형태입니다. 그래서 제한된 편안한 환경, 곧 안전지대라는 뜻이 되고, 스스로에게 제한을 걸어 둔 뉘앙스까지 살아 있게 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 사람들은 피한다\u003c/span>\u003cspan class=\"en\">Some people avoid\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대중 앞에서 발표할 기회를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">opportunity \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">public \u003c/span>\u003cspan class=\"tgt\">presentation\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들을 긴장시킨다는 이유로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">because \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">makes \u003c/span>\u003cspan class=\"tgt\">them \u003c/span>\u003cspan class=\"tgt\">nervous\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어떤 사람들은 그들을 긴장시킨다는 이유로 대중 앞에서 발표할 기회를 피한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 주장을 뒷받침하는 첫 번째 \u003cb class=\"key\">예시\u003c/b> 문장입니다. 발표를 '실력'이 아니라 '긴장감' 때문에 피한다는 점을 보여 주어, 사람들이 \u003cb class=\"key\">이유 \u003c/b>\u003cb class=\"key\">없이\u003c/b> 스스로 기회를 포기한다는 글의 흐름을 만들어 줍니다. it은 앞의 to make a public presentation을 가리키는 \u003cb class=\"key\">대명사\u003c/b>입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법(명사 수식)\u003c/span> : [명사 opportunity] + [to부정사구 to make a public presentation] : \"대중 앞에서 발표할 기회\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이유의 접속사 because + 5형식 make\u003c/span> : because + [주어 it] + makes + [목적어 them] + [목적격보어 nervous] : \"그들을 긴장시킨다는 이유로\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"Some people avoid, 어떤 사람들은 피한다. the opportunity to make a public presentation, 대중 앞에서 발표할 기회를. because it makes them nervous, 그들을 긴장시킨다는 이유로. 이 문장 전체를 해석하면, 어떤 사람들은 그들을 긴장시킨다는 이유로 대중 앞에서 발표할 기회를 피한다.","hl":"m"},{"n":20,"text":"이 문장은 앞 문장의 주장을 뒷받침하는 첫 번째 예시예요. 발표를 실력이 아니라 긴장감 때문에 피한다는 걸 보여 주면서, 사람들이 이유 없이 스스로 기회를 포기한다는 흐름을 만들어 줍니다. 그리고 it은 앞에 나온 to make a public presentation을 가리키는 대명사입니다.","hl":"mn"},{"n":21,"text":"먼저 the opportunity to make a public presentation에서 to부정사가 앞의 명사 opportunity를 뒤에서 꾸며 주는 수식 관계를 만듭니다. 이 to부정사는 발표할이라는 미래의 느낌을 담고 있죠. 두 번째로 because it makes them nervous에서 because는 앞 절에 대한 이유를 제시하는 접속사이고, make는 목적어 them 뒤에 형용사 목적격보어 nervous를 데려와 그들을 긴장하게 만든다는 구조를 만듭니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또 다른 사람들은\u003c/span>\u003cspan class=\"en\">Others\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유학의 기회를 거부한다\u003c/span>\u003cspan class=\"en\">reject a chance \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">study \u003c/span>\u003cspan class=\"tgt\">abroad\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜냐하면 그들은 자신을 여기지 않기 때문이다\u003c/span>\u003cspan class=\"en\">because they \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003cspan class=\"tgt\">consider \u003c/span>\u003cspan class=\"tgt\">themselves \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">도전적인 유형의 사람이라고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">adventurous\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">또 다른 사람들은 자신을 도전적인 유형의 사람이 아니라고 생각하여 유학의 기회를 거부한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 발표를 피하는 사람들처럼, 유학이라는 기회 앞에서도 자신을 도전적인 사람이 아니라고 여겨 스스로 기회를 포기하는 또 다른 예시예요. 결국 사람들이 \u003cb class=\"key\">자기 \u003c/b>\u003cb class=\"key\">한계\u003c/b>를 스스로 정해 버린다는 글 전체 흐름을 뒷받침하는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : a chance + [to study abroad] (to부정사구가 앞의 명사를 수식) : \"유학할 (기회)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">5형식 동사 consider (목적어 + 목적격 보어)\u003c/span> : consider + [목적어(themselves)] + [목적격 보어(adventurous)] : \"자신을 도전적인 사람이라고 생각하지 않는다\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"Others, 또 다른 사람들은. reject a chance to study abroad, 유학의 기회를 거부한다. because they don't consider themselves, 왜냐하면 그들은 자신을 여기지 않기 때문이다. adventurous, 도전적인 유형의 사람이라고. 이 문장 전체를 해석하면, 또 다른 사람들은 자신을 도전적인 유형의 사람이 아니라고 생각하여 유학의 기회를 거부한다.","hl":"m"},{"n":23,"text":"이 문장은 앞에서 나온 사람들과는 또 다른 유형의 사람들을 보여 주고 있어요. 자신을 도전적인 사람이 아니라고 여기면서 유학이라는 기회를 스스로 거부한다는 거죠. 결국 사람들이 자기 한계를 자기 손으로 정해 버린다는 흐름의 예시예요.","hl":"mn"},{"n":24,"text":"먼저 to study abroad를 보면 to부정사가 앞의 명사 chance를 뒤에서 꾸며 주는 형용사적 용법이에요. 그래서 '유학의 기회'가 아니라 '유학할 기회'라는 명사 수식으로 해석해요. 두 번째로 don't consider themselves adventurous에서는 consider가 'A를 B라고 여기다'라는 5형식 동사라서 목적어 뒤에 목적격 보어 adventurous가 와요. 그래서 '자신을 도전적인 사람이 아니라고 여긴다'가 되는 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들은 갇히게 된다\u003c/span>\u003cspan class=\"en\">People \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">become \u003c/span>\u003cspan class=\"tgt\">stuck\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들 자신만의 한계에 대한 생각 속에\u003c/span>\u003cspan class=\"en\">in their own conception of their limits,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서 그들은 분노하게 된다\u003c/span>\u003cspan class=\"en\">so they become angry\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">요청받을 때\u003c/span>\u003cspan class=\"en\">when they \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">asked\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 한계를 넘어서도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">step \u003c/span>\u003cspan class=\"tgt\">beyond \u003c/span>\u003cspan class=\"tgt\">them\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사람들은 그들 자신만의 한계에 갇혀서, 그 한계를 넘어서도록 요청받을 때 분노하게 된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사람들은 자기 머릿속에 그려 놓은 한계 안에 갇혀서, 그 선을 넘어 보라고 요청받으면 오히려 화를 내게 된다는 뜻이에요. 익숙한 자기 생각이 감옥처럼 작동하는 셈이죠. 그래서 다음 문장에서 이런 \u003cb class=\"key\">삶의 \u003c/b>\u003cb class=\"key\">태도\u003c/b>가 큰 실수라고 지적하게 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">become + 과거분사(상태 변화)\u003c/span> : become + [과거분사(stuck)] (~한 상태가 되다) : \"갇히게 된다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태(be + 과거분사)\u003c/span> : ask A to B → A [be asked] to B (수동태) : \"요청받는다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사(수동태 뒤 주격 보어)\u003c/span> : be asked + [to + 동사원형] (~하도록 요청받다) : \"그 한계를 넘어서도록\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"People become stuck, 사람들은 갇히게 된다. in their own conception of their limits, 그들 자신만의 한계에 대한 생각 속에. so they become angry, 그래서 그들은 분노하게 된다. when they are asked, 요청받을 때. to step beyond them, 그 한계를 넘어서도록. 이 문장 전체를 해석하면, 사람들은 그들 자신만의 한계에 갇혀서, 그 한계를 넘어서도록 요청받을 때 분노하게 된다.","hl":"m"},{"n":26,"text":"사람들은 자기 머릿속에 그려 놓은 한계 안에 갇혀서, 그 한계를 넘어 보라고 요청받으면 오히려 화를 낸다는 뜻이에요. 익숙한 자기 생각이 감옥처럼 작동하는 셈이죠. 그래서 이어지는 문장에서 이런 태도가 큰 실수라고 말하게 됩니다.","hl":"mn"},{"n":27,"text":"첫 번째로 become stuck에서 stuck은 과거분사로 형용사처럼 쓰여 '갇힌'이라는 상태를 나타내고, become과 만나 상태 변화를 표현해요. 두 번째로 are asked는 ask A to B에서 주어가 요청을 받는 쪽이라 수동태로 바뀐 형태예요. 세 번째로 to step beyond them은 수동태 뒤에 남은 to부정사로, 요청받아서 하게 되는 행동을 보충해 준다고 보면 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">삶에 대한 이러한 태도는,\u003c/span>\u003cspan class=\"en\">This attitude \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">toward \u003c/span>\u003cspan class=\"tgt\">life\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">however\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">큰 실수이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">huge \u003c/span>\u003cspan class=\"tgt\">mistake\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 삶에 대한 이러한 태도는 큰 실수이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 말한 '한계에 갇힌 태도'를 한 문장으로 묶어 정면으로 반박하는 문장이에요. however가 앞 내용과 방향을 반대로 뒤집어 주죠. '그러나 그건 큰 실수다'라고 선을 그은 뒤, 다음 문장에서 새로운 태도를 권하는 \u003cb class=\"key\">전환점\u003c/b> 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 용법\u003c/span> : 명사 attitude + [전치사 toward + 명사 life] : \"삶에 대한\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속부사(전환)\u003c/span> : 문장 중간의 [however,] = '그러나' : \"그러나\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">2형식 문장(주어 + be동사 + 주격보어)\u003c/span> : This attitude(주어) + is(동사) + [a huge mistake(주격보어)] : \"큰 실수이다\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"This attitude toward life, 삶에 대한 이러한 태도는. however, 그러나. is a huge mistake, 큰 실수이다. 이 문장 전체를 해석하면, 그러나 삶에 대한 이러한 태도는 큰 실수이다.","hl":"m"},{"n":29,"text":"앞에서 말한 한계에 갇힌 태도를 한 문장으로 묶으면서 정면으로 반박하는 문장이에요. however가 들어가면서 앞의 내용과 방향이 반대로 뒤집히죠. '그러나 그건 큰 실수다'라고 선을 긋고, 다음 문장에서 새로운 태도를 권하게 됩니다.","hl":"mn"},{"n":30,"text":"먼저 toward life는 전치사구가 앞의 명사 attitude를 뒤에서 꾸며 주는 형용사구로, '삶에 대한'이라는 뜻을 만들어요. 두 번째로 however는 앞 내용과 반대 방향으로 전환할 때 쓰는 접속부사로, 콤마 사이에 들어가 앞과 뒤를 대조시켜요. 세 번째로 is a huge mistake는 주어의 상태를 설명하는 주격보어를 끌어오는 2형식 문장이고, 주어가 단수라서 is가 온다는 점도 함께 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">환영해라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Welcome\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새로운 도전을\u003c/span>\u003cspan class=\"en\">new challenges\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">항상\u003c/span>\u003cspan class=\"en\">at every turn,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 도전을 받아들이면서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">saying \u003c/span>\u003cspan class=\"tgt\">yes\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가능한 한 자주\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">often \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">possible\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">항상 새로운 도전을 환영해라 그리고 가능한 한 자주 그 도전을 받아들여라.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글의 결론으로, 한계에 갇히지 말고 새로운 도전을 \u003cb class=\"key\">적극적으로\u003c/b> 받아들이라는 \u003cb class=\"key\">명령\u003c/b>이에요. 'at every turn'은 '매 순간마다', 'saying yes'는 도전에 대해 긍정하고 \u003cb class=\"key\">수락한다\u003c/b>는 뜻으로, 두려움 대신 기회를 선택하라는 메시지를 전해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문(동사원형)\u003c/span> : [동사원형 Welcome] + [목적어 new challenges] : 명령문 : \"환영해라\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">분사구문(현재분사)\u003c/span> : [명령문] + [현재분사 saying ~] : 분사구문 : \"그 도전을 받아들이면서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">as ~ as possible 구문\u003c/span> : as + [부사 often] + as possible : 가능한 한 ~하게 : \"가능한 한 자주\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"Welcome, 환영해라. new challenges, 새로운 도전을. at every turn, 항상. saying yes, 그 도전을 받아들이면서. as often as possible, 가능한 한 자주. 이 문장 전체를 해석하면, 항상 새로운 도전을 환영해라 그리고 가능한 한 자주 그 도전을 받아들여라.","hl":"m"},{"n":32,"text":"이 문장은 글의 결론에서 새로운 도전을 적극적으로 받아들이라고 하는 명령이에요. at every turn은 매 순간마다라는 뜻이고, saying yes는 도전을 수락한다는 뜻이죠. 그래서 두려움에 머물지 말고 기회가 올 때마다 긍정적으로 선택하라는 메시지를 전해요.","hl":"mn"},{"n":33,"text":"첫 번째, Welcome은 주어 You를 생략한 명령문이라 동사원형으로 시작해요. 두 번째, saying은 앞의 명령과 함께 이어지는 행동을 나타내는 현재분사이고, 이렇게 만들어진 분사구문이에요. 세 번째, as often as possible은 as와 as possible 사이에 often을 넣어 가능한 한 자주, 즉 최대한 자주라는 의미를 만드는 표현이에요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>사람들은 자신의 삶을 \u003cb class=\"key\">좁은 \u003c/b>\u003cb class=\"key\">한계\u003c/b> 안에서 한정하고 제한된 편안한 환경에 머문다.\u003c/li>\u003cli>발표가 긴장된다는 이유로 그 기회를 피하고, 자신이 \u003cb class=\"key\">도전적인 \u003c/b>\u003cb class=\"key\">유형\u003c/b>이 아니라고 생각해 유학의 기회를 거부한다.\u003c/li>\u003cli>결국 자신만의 \u003cb class=\"key\">한계 \u003c/b>\u003cb class=\"key\">개념\u003c/b>에 갇혀 그 한계를 넘으라는 요청에 분노하는 태도는 큰 실수이다.\u003c/li>\u003cli>그러므로 항상 새로운 도전을 환영하고 가능한 한 자주 yes라고 말하는 \u003cb class=\"key\">능동적 \u003c/b>\u003cb class=\"key\">태도\u003c/b>가 필요하다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Instead of limiting ourselves to a narrow comfort zone, we should welcome new challenges and say yes as often as possible.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">사람들은 흔히 자신의 삶을 \u003cb class=\"key\">좁은 \u003c/b>\u003cb class=\"key\">한계\u003c/b> 안에 가두고 편안한 환경에 머물며 기회를 피한다. 그러나 이런 태도는 \u003cb class=\"key\">큰 \u003c/b>\u003cb class=\"key\">실수\u003c/b>이므로, 항상 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">도전\u003c/b>을 환영하고 가능한 한 자주 받아들여야 한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":34,"text":"정리해 볼게요. 이 글은 좁은 한계와 편안한 환경에 머무는 회피의 태도를 비판하고, 새로운 도전을 환영하라고 말합니다. 핵심은 한계를 남이 정해 주기 전에 내가 먼저 넓히는 능동적 태도예요. 오늘 배운 표현들 꼭 복습하시고요, 다음 시간에 또 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
