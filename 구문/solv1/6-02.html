<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SO 레벨1 6강 적용독해02 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-chips .x{background:none;color:#999;padding:0}
.lp-sno{font-size:13px;color:#8493A1;font-weight:700;margin-bottom:8px}

.lp-chunk{display:flex;flex-direction:column}
.lp-chunk .ko{font-size:13px;color:var(--pk-t);font-weight:700;line-height:1.3;margin-bottom:2px}
.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}
.lp-top::before{height:5px;background:linear-gradient(90deg,var(--pk) 0,var(--pk) 80%,var(--am) 80%,var(--am) 100%)}
.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}
.lp-tag{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700;padding:2px 12px}
.lp-qn{flex:0 0 112px;height:112px;align-self:center;background:#fff;color:var(--pk);border:3px solid var(--pk);border-radius:50%;font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;font-size:26px}
.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}
.lp-qn .qt{display:block;white-space:nowrap;line-height:1.12;letter-spacing:-.02em}
.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}

.lp-st h4{color:var(--ink,#1B2733)}
.lp-st h4 i{border-radius:4px;width:auto;min-width:24px;padding:0 4px}
.lp-pill{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700}
.lp-chain span.c{background:#fff;border:1px solid #AEBBE6;border-radius:3px;font-weight:600}
.lp-ct th{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif}
.lp-vg em{background:#fff;border:1px solid var(--pk-b);border-radius:3px}
.lp-sa>div{border-radius:4px;border-color:var(--pk-b)}

.lp-chips .s{border:1px solid #AEBBE6;color:#3A4FA3}
.lp-chips .a{border:1px solid var(--am-b);color:var(--am-d);background:#FFFBF2}
.lp-sno .es{background:var(--am);border-radius:2px;font-weight:700}
.lp-chunk .en{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:600}
.lp-chunk+.lp-chunk{border-left:1px solid var(--pk-b)}
.lp .tgt{background:var(--am-l);border-bottom:2.5px dotted var(--am)}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"SO 레벨1 6강 적용독해02","audioDir":"6-02_audio","preview":false,"count":33,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">6강\u003cbr>적용독해02\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">SO 레벨1\u003c/div>\u003ch1>A New Role Restores a Retired Executive's Reason to Get Up\u003c/h1>\u003ch2>새 역할이 되찾아 준 은퇴 임원의 아침\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>요약: \u003cb class=\"key\">은퇴\u003c/b> 후 아무도 자신을 찾지 않아 괴로워하던 임원이, 친구의 격려로 초등학교 \u003cb class=\"key\">교통안전 \u003c/b>\u003cb class=\"key\">지킴이\u003c/b>가 되어 더 곧은 자세와 자신감을 되찾고 아침에 잠자리에서 나올 \u003cb class=\"key\">이유\u003c/b>를 찾게 된다는 이야기입니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Even after losing his position, a retired executive regains confidence and a reason to get out of bed in the morning by taking on a new role as a crossing guard.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘도 함께 독해 지문 하나를 뜯어볼게요. 오늘 다룰 글은 은퇴한 임원의 하루를 담은 짧은 이야기입니다. 은퇴 후 아무도 찾지 않아 괴로워하던 사람이 새로운 역할을 만나 다시 살아나는 과정이 담백하게 그려져 있어요. 요지는 역할이 사라져도 새 역할이 삶의 이유를 만들어 준다는 것, 자, 함께 시작해 볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">사람은 직장에서 맡은 \u003cb class=\"key\">역할\u003c/b>과 직함을 통해 존재감과 하루의 리듬을 얻는 경우가 많습니다. 은퇴는 그 역할이 갑자기 사라지는 사건으로, 영어로는 \u003cb class=\"key\">role \u003c/b>\u003cb class=\"key\">loss\u003c/b>라고 부르는 정체성의 공백을 만들어 줍니다. 사회학에서는 이를 사회적 역할 이론(social role theory)으로 설명하는데, 역할이 끊기면 대화 상대와 일과의 리듬도 함께 끊긴다고 봅니다. 실제로 은퇴 후 우울감이나 수면 습관의 변화가 나타나는 사람이 많아, 학자들은 새로운 \u003cb class=\"key\">purpose\u003c/b>를 찾는 일이 중요하다고 말합니다. 마치 즐겨 듣던 라디오 주파수가 갑자기 사라지면 하루 전체가 텅 빈 것처럼 느껴지는 것과 비슷하죠. 이 지문의 주인공은 교통안전 지킴이(crossing guard)라는 작은 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">역할\u003c/b>을 통해 다시 하루를 시작할 이유를 얻습니다.\u003c/div>","segs":[{"n":2,"text":"본격적으로 들어가기 전에 배경지식을 조금만 얘기할게요. 사람은 직장에서 맡은 역할과 직함을 통해서 존재감과 하루의 리듬을 얻는 경우가 많습니다. 그런데 은퇴는 그 역할이 갑자기 사라지는 사건이라서, 영어로는 role loss라고 부르는 정체성의 공백을 만들어요. 사회학에서는 이를 사회적 역할 이론, 즉 social role theory로 설명하는데, 역할이 끊기면 대화 상대도 일과의 리듬도 함께 끊긴다고 봅니다. 즐겨 듣던 라디오 주파수가 갑자기 사라지면 하루 전체가 텅 빈 것처럼 느껴지는 것과 비슷한 이치죠. 그래서 학자들은 은퇴 후에 새로운 purpose, 그러니까 삶의 목적을 찾는 일이 중요하다고 말합니다. 이 지문의 주인공도 교통안전 지킴이라는 작은 사회적 역할을 통해 다시 하루를 시작할 이유를 얻는 겁니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>사라진 전화 목록\u003csmall>도입·문제 제시 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>막 은퇴한 임원은 더 이상 아무도 전화하지 않는다는 사실에 \u003cb class=\"key\">괴로움\u003c/b>을 느낍니다. 이전에는 몇 페이지나 길었던 \u003cb class=\"key\">답해야 \u003c/b>\u003cb class=\"key\">할 \u003c/b>\u003cb class=\"key\">통화 \u003c/b>\u003cb class=\"key\">목록\u003c/b>이 완전히 사라져 버렸죠. 직함이 사라지자 그를 찾는 연락도 함께 끊긴 것입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>같은 사람, 다른 대접\u003csmall>예시·구체화 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>사무실에서 그를 대신한 \u003cb class=\"key\">후임\u003c/b>은 점심 제안을 정중히 사양하며 자신은 일을 잘 터득하고 있다고 말합니다. 68세의 그는 6개월 전과 똑같은 사람인데도 은퇴 후에는 아무도 그를 찾지 않습니다. 문제는 사람이 아니라 그가 맡던 \u003cb class=\"key\">역할\u003c/b>이 사라진 데 있었던 것이죠.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>친구의 지적과 격려\u003csmall>전환 · 문장 5\u003c/small>\u003c/h4>\u003cp>어느 날 친구가 그가 점점 \u003cb class=\"key\">우울\u003c/b>해지고 있고 늦잠을 자고 있다고 지적합니다. 그러면서 초등학교 \u003cb class=\"key\">교통안전 \u003c/b>\u003cb class=\"key\">지킴이\u003c/b>로 활동해 보라고 격려합니다. 이 한마디가 글의 방향을 바꾸는 \u003cb class=\"key\">전환점\u003c/b>이 됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>자세와 시선의 변화\u003csmall>결론 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>오는 자동차에 신호를 보내 정지선 앞에서 멈추게 하는 일에 \u003cb class=\"key\">능숙\u003c/b>해지면서 그는 더 곧은 자세와 자신감 있는 시선을 갖게 됩니다. 남을 \u003cb class=\"key\">보호\u003c/b>하는 역할이 생기자 몸가짐과 표정이 함께 달라진 것이죠. 결국 그는 아침에 잠자리에서 나올 \u003cb class=\"key\">충분한 \u003c/b>\u003cb class=\"key\">이유\u003c/b>를 찾았다는 문장으로 글을 맺습니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 지문은 문제 하나가 제시되고 그것이 해결되는 과정을 따라가면 아주 쉽게 읽힙니다.","hl":null},{"n":4,"text":"첫 번째 단계는 은퇴 직후의 상황이에요. 막 은퇴한 임원은 더 이상 아무도 전화하지 않는다는 사실에 괴로움을 느낍니다. 이전에는 몇 페이지나 길었던 답해야 할 통화 목록이 완전히 사라져 버렸죠. 직함이 사라지자 그를 찾는 연락도 함께 끊긴 겁니다.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 이 상황이 얼마나 씁쓸한지 구체적인 예로 보여 줍니다. 사무실에서 그를 대신한 젊은 후임은 점심을 함께하자는 제안을 정중히 사양하면서, 자신은 일을 잘 터득하고 있다고 말해요. 예순여덟 살의 그는 육 개월 전과 똑같은 사람인데도 은퇴 후에는 아무도 그를 찾지 않습니다. 문제는 사람이 아니라 그가 맡던 역할이 사라진 데 있었던 거죠.","hl":"f1"},{"n":6,"text":"세 번째 단계는 분위기를 바꾸는 전환점입니다. 어느 날 한 친구가 그가 점점 우울해지고 있고, 점점 늦잠을 자고 있다고 지적해요. 그러면서 초등학교 교통안전 지킴이로 활동해 보라고 격려합니다. 이 한마디가 글의 방향을 완전히 뒤집는 전환점이 되는 겁니다.","hl":"f2"},{"n":7,"text":"마지막 단계에서는 실제 변화가 나타납니다. 오는 자동차에 신호를 보내고, 자동차가 정지선 몇 야드 앞에서 멈추게 하는 일에 능숙해지면서 그는 더 곧은 자세와 더 자신감 있는 시선을 갖게 돼요. 남을 보호하는 역할이 생기자 몸가짐부터 달라진 겁니다. 결국 그는 아침에 잠자리에서 나올 충분한 이유를 찾았다는 문장으로 글을 맺습니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 7번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 처음 두 문장에서 은퇴 후 소외라는 \u003cb class=\"key\">문제\u003c/b>를 제시하고, 다섯 번째 문장에서 친구의 격려라는 \u003cb class=\"key\">해결의 \u003c/b>\u003cb class=\"key\">실마리\u003c/b>를 놓습니다. 이어서 여섯, 일곱 번째 문장에서 회복이라는 \u003cb class=\"key\">결과\u003c/b>를 보여 주므로 문제와 해결이 시간 순서대로 이어지는 전개 방식입니다. 핵심 결론이 마지막 문장에 제시되므로 \u003cb class=\"key\">미괄식\u003c/b> 구조로 판단합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>but (4)\u003c/b>\u003cspan>대조\u003c/span>\u003cb>after his retirement (4)\u003c/b>\u003cspan>시간·계기\u003c/span>\u003cb>One day (5)\u003c/b>\u003cspan>전환·새 사건 도입\u003c/span>\u003cb>began (6)\u003c/b>\u003cspan>변화의 시작\u003c/span>\u003cb>had found (7)\u003c/b>\u003cspan>결론·결과\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">was bothered\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">getting more and more depressed\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a straighter posture\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a more confident gaze\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>은퇴 전, 직함이 있던 시절\u003c/th>\u003cth>은퇴 후, 역할이 사라진 시절\u003c/th>\u003c/tr>\u003ctr>\u003ctd>답해야 할 통화가 몇 페이지\u003c/td>\u003ctd>통화 목록이 완전히 사라짐\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사무실의 후임이 점심 제안을 사양\u003c/td>\u003ctd>아무도 그를 찾아주지 않음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>직함이 주던 존재감\u003c/td>\u003ctd>우울과 늦잠, 무기력\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식을 보면 문제와 해결 구조예요. 앞부분에서는 은퇴 후 소외라는 문제를 제시하고, 중간에 친구의 격려라는 해결의 실마리를 놓고, 마지막에 회복이라는 결과를 보여 줍니다. 결론이 맨 마지막 문장에 오니까 두괄식이 아니라 미괄식으로 정리하면 됩니다.","hl":"ty"},{"n":9,"text":"신호어를 같이 짚어 볼게요. 네 번째 문장의 but은 그가 여전히 같은 사람인데 대접이 달라졌다는 대조를 만들어 줍니다. 다섯 번째 문장의 One day는 새로운 사건이 시작된다는 전환 신호이고, 여섯 번째 문장의 began은 변화의 시작을, 마지막 문장의 had found는 결론이자 결과를 알려 줘요. 또 no one called him anymore와 no one sought him out은 같은 내용을 표현만 바꿔 반복한 재진술이라는 점도 기억해 주세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>retired\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>은퇴한\u003c/span>\u003c/div>\u003cdiv>\u003cb>executive\u003c/b>\u003cem>명사\u003c/em>\u003cspan>임원, 경영진\u003c/span>\u003c/div>\u003cdiv>\u003cb>bother\u003c/b>\u003cem>동사\u003c/em>\u003cspan>괴롭히다, 신경 쓰이게 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>calls to return\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>답해야 할 전화\u003c/span>\u003c/div>\u003cdiv>\u003cb>previously\u003c/b>\u003cem>부사\u003c/em>\u003cspan>이전에, 전에는\u003c/span>\u003c/div>\u003cdiv>\u003cb>vanish\u003c/b>\u003cem>동사\u003c/em>\u003cspan>사라지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>altogether\u003c/b>\u003cem>부사\u003c/em>\u003cspan>완전히, 전부\u003c/span>\u003c/div>\u003cdiv>\u003cb>replace\u003c/b>\u003cem>동사\u003c/em>\u003cspan>대신하다, 대체하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>politely\u003c/b>\u003cem>부사\u003c/em>\u003cspan>정중하게\u003c/span>\u003c/div>\u003cdiv>\u003cb>decline\u003c/b>\u003cem>동사\u003c/em>\u003cspan>사양하다, 거절하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>offer\u003c/b>\u003cem>명사\u003c/em>\u003cspan>제안\u003c/span>\u003c/div>\u003cdiv>\u003cb>claim\u003c/b>\u003cem>동사\u003c/em>\u003cspan>주장하다, 말하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>master\u003c/b>\u003cem>동사\u003c/em>\u003cspan>터득하다, 숙달하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>seek out\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>찾아내다, 찾다\u003c/span>\u003c/div>\u003cdiv>\u003cb>retirement\u003c/b>\u003cem>명사\u003c/em>\u003cspan>은퇴\u003c/span>\u003c/div>\u003cdiv>\u003cb>encourage\u003c/b>\u003cem>동사\u003c/em>\u003cspan>격려하다, 권하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>serve as\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 활동하다, 역할을 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>crossing guard\u003c/b>\u003cem>명사\u003c/em>\u003cspan>교통안전 지킴이\u003c/span>\u003c/div>\u003cdiv>\u003cb>point out\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>지적하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>depressed\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>우울한, 의기소침한\u003c/span>\u003c/div>\u003cdiv>\u003cb>sleep in\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>늦잠을 자다\u003c/span>\u003c/div>\u003cdiv>\u003cb>skilled in\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 능숙한\u003c/span>\u003c/div>\u003cdiv>\u003cb>signal\u003c/b>\u003cem>동사\u003c/em>\u003cspan>신호를 보내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>oncoming\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>다가오는, 마주 오는\u003c/span>\u003c/div>\u003cdiv>\u003cb>halt\u003c/b>\u003cem>동사\u003c/em>\u003cspan>멈추다, 정지시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>yard\u003c/b>\u003cem>명사\u003c/em>\u003cspan>야드(약 0.9미터)\u003c/span>\u003c/div>\u003cdiv>\u003cb>take on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>띠다, 갖추다\u003c/span>\u003c/div>\u003cdiv>\u003cb>posture\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자세\u003c/span>\u003c/div>\u003cdiv>\u003cb>gaze\u003c/b>\u003cem>명사\u003c/em>\u003cspan>시선, 응시\u003c/span>\u003c/div>\u003cdiv>\u003cb>compelling\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>강력한, 마음을 움직이는\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"단어도 몇 개만 짚고 갈게요. decline은 제안을 정중히 사양한다는 뜻이고, seek out은 누군가를 찾아 나선다는 의미예요. halt는 멈추다, take on은 자세나 태도를 띠다라는 뜻으로 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">decline\u003c/b>\u003cspan class=\"m\">사양하다, 거절하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">refuse\u003c/span>\u003cspan class=\"s\">reject\u003c/span>\u003cspan class=\"s\">turn down\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">accept\u003c/span>\u003cspan class=\"a\">approve\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">vanish\u003c/b>\u003cspan class=\"m\">사라지다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">disappear\u003c/span>\u003cspan class=\"s\">fade away\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">appear\u003c/span>\u003cspan class=\"a\">emerge\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">bother\u003c/b>\u003cspan class=\"m\">괴롭히다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">disturb\u003c/span>\u003cspan class=\"s\">trouble\u003c/span>\u003cspan class=\"s\">upset\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">comfort\u003c/span>\u003cspan class=\"a\">soothe\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">encourage\u003c/b>\u003cspan class=\"m\">격려하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">urge\u003c/span>\u003cspan class=\"s\">motivate\u003c/span>\u003cspan class=\"s\">support\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">discourage\u003c/span>\u003cspan class=\"a\">deter\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">depressed\u003c/b>\u003cspan class=\"m\">우울한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">gloomy\u003c/span>\u003cspan class=\"s\">miserable\u003c/span>\u003cspan class=\"s\">down\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">cheerful\u003c/span>\u003cspan class=\"a\">hopeful\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">confident\u003c/b>\u003cspan class=\"m\">자신감 있는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">assured\u003c/span>\u003cspan class=\"s\">self-assured\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">insecure\u003c/span>\u003cspan class=\"a\">doubtful\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">halt\u003c/b>\u003cspan class=\"m\">멈추다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">stop\u003c/span>\u003cspan class=\"s\">cease\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">proceed\u003c/span>\u003cspan class=\"a\">continue\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"핵심 어휘를 동의어와 반의어로 묶어 볼게요. decline은 refuse, reject, turn down과 가깝고 반대말은 accept예요. vanish는 disappear, fade away와 같고 반대는 appear죠. encourage는 urge, motivate와 통하고 반대는 discourage입니다. depressed는 gloomy, miserable과 가깝고 반대는 cheerful이고, confident의 반대는 insecure로 정리해 두면 좋아요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">막 은퇴한 임원은\u003c/span>\u003cspan class=\"en\">A newly retired executive\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">괴로웠다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">bothered\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 이상 아무도 그에게 전화하지 않을 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">no \u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">called \u003c/span>\u003cspan class=\"tgt\">him \u003c/span>\u003cspan class=\"tgt\">anymore\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">막 은퇴한 임원은 더 이상 자신에게 아무도 전화하지 않는다는 사실에 괴로웠다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글의 상황을 여는 첫 문장으로, 은퇴 직후 세상이 자신을 잊은 듯한 신호를 받은 장면을 제시합니다. 전화 한 통 오지 않는다는 사소한 사건이 이 임원에게는 \u003cb class=\"key\">상실감\u003c/b>으로 다가왔다는 점이 핵심이에요. 그래서 이 문장은 은퇴 후의 \u003cb class=\"key\">소외\u003c/b>라는 글 전체 주제를 암시하는 도입 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태(be동사 + 과거분사)\u003c/span> : 주어 + [be동사] + [과거분사] → '~하게 되다, ~을 당하다' : \"괴로웠다(마음이 상했다)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 when의 시간 부사절\u003c/span> : [when + 주어 + 동사] → 주절의 상황이 일어난 때를 제시하는 부사절 : \"더 이상 아무도 그에게 전화하지 않을 때\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"A newly retired executive, 막 은퇴한 임원은. was bothered, 괴로웠다. when no one called him anymore, 더 이상 아무도 그에게 전화하지 않을 때. 이 문장 전체를 해석하면, 막 은퇴한 임원은 더 이상 자신에게 아무도 전화하지 않는다는 사실에 괴로웠다.","hl":"m"},{"n":13,"text":"이 문장은 글의 상황을 여는 첫 문장이에요. 은퇴하자마자 세상이 자신을 잊은 것 같은 신호를 받은 거죠. 전화 한 통 오지 않는다는 작은 사건이 이 임원에게는 커다란 상실감으로 다가왔다는 점을 꼭 잡아 주세요.","hl":"mn"},{"n":14,"text":"첫 번째 어법 포인트는 수동태예요. was bothered는 be동사에 과거분사가 붙은 수동태로, 스스로 괴로운 게 아니라 상황 때문에 마음이 상한 상태를 보여 줘요. 두 번째는 접속사 when이 이끄는 시간 부사절이에요. 이 부사절이 주절의 괴로움이 일어난 때를 알려 주고, no one과 anymore가 만나 더 이상 아무도라는 뜻을 만든다는 것도 같이 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 답해야 할 통화 목록은\u003c/span>\u003cspan class=\"en\">His list of \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">calls \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">return\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이전에는 몇 페이지로 길었는데\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">previously \u003c/span>\u003cspan class=\"tgt\">pages \u003c/span>\u003cspan class=\"tgt\">long\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">완전히 사라져 버렸다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">vanished\u003c/span> altogether.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이전에는 몇 페이지로 길었던 답해야 할 통화 목록이 모두 사라졌다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 과거에 몇 페이지나 되던 목록과 지금 완전히 사라진 목록을 대비시켜 은퇴 후의 \u003cb class=\"key\">소외\u003c/b>를 강조하는 문장이에요. previously pages long이라는 삽입구가 과거의 \u003cb class=\"key\">위상\u003c/b>을, had vanished altogether가 현재의 단절을 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : [명사 + to부정사] → to부정사가 앞의 명사를 뒤에서 수식 : \"답해야 할(돌려줘야 할) 전화\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">삽입 수식어구(콤마 삽입)\u003c/span> : [주어 , 부사 + 형용사구 , 동사] → 주어에 대한 부가 설명 : \"이전에는 몇 페이지로 길었던\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">과거완료(have + 과거분사)\u003c/span> : had + [과거분사] → 과거의 어떤 시점보다 [[더 이전]]에 이미 완료된 일 : \"완전히 사라져 버렸다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"His list of calls to return, 그의 답해야 할 통화 목록은. previously pages long, 이전에는 몇 페이지로 길었는데. had vanished altogether, 완전히 사라져 버렸다. 이 문장 전체를 해석하면, 이전에는 몇 페이지로 길었던 답해야 할 통화 목록이 모두 사라졌다.","hl":"m"},{"n":16,"text":"이 문장은 과거에 몇 페이지나 되던 목록과 지금 완전히 사라진 목록을 나란히 놓아서 은퇴 후의 소외를 강조해요. 앞부분의 삽입구가 과거의 위상을 보여 주고, 뒤의 had vanished altogether가 현재의 단절을 보여 주는 구조죠.","hl":"mn"},{"n":17,"text":"첫 번째는 to부정사의 형용사적 용법이에요. calls to return에서 to return이 앞의 명사 calls를 형용사처럼 꾸며 줍니다. 두 번째는 콤마 사이에 끼어든 삽입구예요. previously pages long이 주어 his list를 부가 설명하는 삽입구이고, 문장 뼈대는 his list와 had vanished라는 점을 놓치지 마세요. 세 번째는 과거완료예요. had vanished는 은퇴보다 더 이전에 이미 목록이 사라졌음을 보여 주고, altogether가 완전히라는 뜻으로 사라짐을 강조합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사무실에서 그를 대신한 젊은 후임이\u003c/span>\u003cspan class=\"en\">The younger man \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">replaced \u003c/span>\u003cspan class=\"tgt\">him \u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">office\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정중히 그의 제안을 사양했다\u003c/span>\u003cspan class=\"en\">had politely \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">declined \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">offer \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">점심을 함께 하자는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">having \u003c/span>\u003cspan class=\"tgt\">lunch \u003c/span>\u003cspan class=\"tgt\">together\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신이 그 일을 터득하고 있다고 말하며\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">claiming \u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">mastering \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">job\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“잘”\u003c/span>\u003cspan class=\"en\">&quot;just fine.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사무실에서 그를 대신한 젊은 후임이 점심을 함께하자는 그의 제안을, 자신이 일을 “잘” 터득하고 있다고 말하며 정중히 사양했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 후임의 정중한 거절은 겉으로는 예의 바르지만, 그 속에는 더 이상 자신이 필요 없다는 신호가 담겨 있어요. 특히 just fine이라는 말이 오히려 그의 \u003cb class=\"key\">존재감\u003c/b> 상실을 부각시킵니다. 은퇴가 관계의 단절로 이어진다는 흐름을 보여 주는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 who\u003c/span> : [선행사(사람) + who + 동사] → 앞의 명사를 수식하는 절 : \"사무실에서 그를 대신한\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 of + 동명사\u003c/span> : [명사 offer + of + 동명사구] → 제안의 내용을 설명 : \"점심을 함께 하자는 그의 제안을 사양했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">분사구문(현재분사)\u003c/span> : [ , 현재분사 ~ ] → 접속사와 주어를 지운 부사구 : \"자신이 그 일을 터득하고 있다고 말하며\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"The younger man who replaced him at the office, 사무실에서 그를 대신한 젊은 후임이. had politely declined his offer, 정중히 그의 제안을 사양했다. of having lunch together, 점심을 함께 하자는. claiming he was mastering the job, 자신이 그 일을 터득하고 있다고 말하며. \"just fine.\", “잘”. 이 문장 전체를 해석하면, 사무실에서 그를 대신한 젊은 후임이 점심을 함께하자는 그의 제안을, 자신이 일을 “잘” 터득하고 있다고 말하며 정중히 사양했다.","hl":"m"},{"n":19,"text":"후임의 이 정중한 거절은 겉으로는 예의 바르지만, 그 속에는 더 이상 자신이 필요 없다는 신호가 담겨 있어요. especially라는 말 대신 just fine이라는 표현이 오히려 그의 존재감 상실을 부각시킨다는 점을 짚어 주세요.","hl":"mn"},{"n":20,"text":"첫 번째는 주격 관계대명사예요. who replaced him at the office에서 who는 선행사 the younger man을 꾸미면서 절 안에서 주어 역할을 합니다. 두 번째는 전치사 of 뒤에 동명사가 온 구조예요. offer of having lunch together처럼 제안의 내용을 of와 동명사로 이어 주죠. 세 번째는 분사구문이에요. claiming은 주절과 같은 주어가 동시에 한 동작을 나타내고, 그 뒤에는 접속사 that이 생략된 목적절 he was mastering이 이어집니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 68세의 남자는\u003c/span>\u003cspan class=\"en\">This \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">68-year-old\u003c/span> man\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">같은 바로 그 사람이었다\u003c/span>\u003cspan class=\"en\">was the same person\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그가 6개월 전에 그랬던\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">been\u003c/span> six months earlier,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 누구도 그를 찾지 않았다\u003c/span>\u003cspan class=\"en\">but no one \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">sought \u003c/span>\u003cspan class=\"tgt\">him \u003c/span>\u003cspan class=\"tgt\">out\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">은퇴 후에는\u003c/span>\u003cspan class=\"en\">after his retirement.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 68 세의 남자는 6 개월 전과 같은 바로 그 사람이지만, 은퇴 후에는 누구도 그를 찾지 않았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 겉모습도 사람됨도 은퇴 전과 똑같은데, 그를 필요로 하는 사람만 사라진 상황이에요. 이 남자의 문제가 \u003cb class=\"key\">은퇴\u003c/b> 그 자체가 아니라 '아무도 찾지 않는 것'임을 보여 주며, 뒤에 나오는 \u003cb class=\"key\">교통안전 \u003c/b>\u003cb class=\"key\">지킴이\u003c/b> 제안의 이유가 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">복합 형용사(하이픈으로 연결된 형용사)\u003c/span> : [숫자 + 단수명사 + 형용사] + 명사 : \"68세의\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거완료(대과거)\u003c/span> : had + [과거분사] : \"(그가 6개월 전에) 그랬었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">구동사(동사 + 부사)의 어순\u003c/span> : seek + [목적어(대명사)] + out : \"그를 찾아냈다, 그를 찾았다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"This 68-year-old man, 이 68세의 남자는. was the same person, 같은 바로 그 사람이었다. he had been six months earlier, 그가 6개월 전에 그랬던. but no one sought him out, 그러나 누구도 그를 찾지 않았다. after his retirement, 은퇴 후에는. 이 문장 전체를 해석하면, 이 68 세의 남자는 6 개월 전과 같은 바로 그 사람이지만, 은퇴 후에는 누구도 그를 찾지 않았다.","hl":"m"},{"n":22,"text":"이 문장은 겉모습도 사람됨도 은퇴 전과 똑같은데 아무도 그를 찾지 않는다는 걸 보여 줘요. 문제는 은퇴 자체가 아니라 더 이상 필요 없는 사람이 되었다는 느낌이라는 거죠. 그래서 뒤에 교통안전 지킴이 제안이 나오면 왜 그게 중요한 해결책인지 바로 이해가 돼요.","hl":"mn"},{"n":23,"text":"첫 번째로, 문장 앞의 sixty-eight-year-old는 숫자와 명사가 하이픈으로 묶여 하나의 형용사처럼 man을 꾸며요. 이때 year는 단수형으로 써야 하죠. 두 번째로, he had been은 대과거예요. 은퇴 이후보다 더 앞선 시점의 상태를 말하니까 had been을 쓰고, 그 앞에는 the same person을 받는 관계대명사가 생략되어 있어요. 세 번째로, sought him out에서 seek out은 찾아내다라는 뜻의 구동사인데, 목적어가 him처럼 대명사일 때는 동사와 부사 사이에 넣어야 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어느 날,\u003c/span>\u003cspan class=\"en\">One day,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 친구가 그를 격려했다\u003c/span>\u003cspan class=\"en\">a friend \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">encouraged \u003c/span>\u003cspan class=\"tgt\">him \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">교통안전 지킴이로 활동하도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">serve\u003c/span> as a crossing guard\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">초등학교를 위해\u003c/span>\u003cspan class=\"en\">for the elementary school,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지적하며\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">pointing \u003c/span>\u003cspan class=\"tgt\">out\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그가 점점 우울해지고 있는 것 같고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">seemed \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">getting\u003c/span> \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">depressed\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">점점 늦잠을 자고 있다고\u003c/span>\u003cspan class=\"en\">and was sleeping in later and later.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어느 날, 한 친구가 그가 점점 우울해지고 있는 것 같고, 점점 늦잠을 자고 있다고 지적하며, 초등학교 교통안전 지킴이로 활동하도록 격려했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 친구가 남자의 달라진 상태를 정확히 \u003cb class=\"key\">지적\u003c/b>하고 구체적인 대안까지 \u003cb class=\"key\">제안\u003c/b>하는 장면이에요. 원래 문제가 '아무도 그를 찾지 않는 것'이었으니, 누군가에게 꼭 필요한 역할을 맡기는 것이 해결책이 된다는 흐름을 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">5형식(목적격보어 to부정사)\u003c/span> : encourage + [목적어] + [to부정사(목적격보어)] : \"그가 활동하도록 격려했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">분사구문(부대상황, ~하며)\u003c/span> : [주절] + , + [현재분사 ~ing (분사구문)] : \"지적하며\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 명사절(목적어)\u003c/span> : point out + [that + 주어 + 동사 ~ (명사절)] : \"그가 ~인 것 같다고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">비교급 and 비교급(점진적 변화)\u003c/span> : more and more + [형용사] : \"점점 더 우울해지는\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"One day, 어느 날. a friend encouraged him, 한 친구가 그를 격려했다. to serve as a crossing guard, 교통안전 지킴이로 활동하도록. for the elementary school, 초등학교를 위해. pointing out that, 지적하며. he seemed to be getting more and more depressed, 그가 점점 우울해지고 있는 것 같고. and was sleeping in later and later, 점점 늦잠을 자고 있다고. 이 문장 전체를 해석하면, 어느 날, 한 친구가 그가 점점 우울해지고 있는 것 같고, 점점 늦잠을 자고 있다고 지적하며, 초등학교 교통안전 지킴이로 활동하도록 격려했다.","hl":"m"},{"n":25,"text":"이 장면은 친구가 남자의 달라진 모습을 지적하고 동시에 구체적인 역할을 제안하는 부분이에요. 은퇴 후 아무도 찾지 않던 사람에게 초등학교 교통안전 지킴이라는 새로운 자리가 생긴다는 흐름의 출발점이죠.","hl":"mn"},{"n":26,"text":"첫 번째로, encouraged him to serve에서 encourage는 목적어 뒤에 to부정사를 목적격보어로 데려오는 동사예요. 그래서 him 다음에 to serve가 오는 거죠. 두 번째로, pointing out은 현재분사로 시작하는 분사구문이에요. 주절의 주어인 a friend가 지적하는 주체이니까 ~하면서로 이어지는 부대상황으로 해석해요. 세 번째로, pointing out 뒤의 that은 접속사예요. 뒤에 he seemed라는 주어와 동사를 데려와서 ~라고라는 명사절 목적어를 만들어 주죠. 네 번째로, more and more depressed는 비교급 and 비교급 형태로 점점 더 우울해지는이라는 뜻이고, 뒤의 later and later도 똑같은 방식이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오는 자동차에 신호를 보내는 일에 능숙해지면서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Skilled \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">signaling \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">oncoming \u003c/span>\u003cspan class=\"tgt\">cars \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 자동차가 멈추게 하는 일에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">getting \u003c/span>\u003cspan class=\"tgt\">them \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">halt\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정지선 몇 야드 앞에서\u003c/span>\u003cspan class=\"en\">yards before the white lines,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 갖기 시작했다\u003c/span>\u003cspan class=\"en\">he \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">began \u003c/span>\u003cspan class=\"tgt\">taking \u003c/span>\u003cspan class=\"tgt\">on\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 곧은 자세와\u003c/span>\u003cspan class=\"en\">a straighter posture\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 자신감 있는 시선을\u003c/span>\u003cspan class=\"en\">and a more confident gaze.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">오는 자동차에 신호를 보내고, 자동차가 정지선 몇 야드 앞에서 멈추게 하는 일에 능숙해지면서, 그는 더 곧은 자세와 더 자신감 있는 시선을 갖게 되었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 능숙함이 자신감으로 이어지는 \u003cb class=\"key\">인과\u003c/b> 관계를 보여 주는 문장이에요. 아무도 찾지 않던 사람이 누군가에게 꼭 필요한 일을 맡으면서 \u003cb class=\"key\">자세\u003c/b>와 표정까지 달라졌다는 점이 이 글의 결론이 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">분사구문(Being이 생략된 형태)\u003c/span> : [Being] + [과거분사] ~ , 주어 + 동사 : \"~에 능숙해지면서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사의 병렬(전치사 in의 목적어)\u003c/span> : in + [동명사 A] and [동명사 B] : \"신호를 보내고 멈추게 하는 일에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">5형식(get + 목적어 + to부정사)\u003c/span> : get + [목적어] + [to부정사(목적격보어)] : \"자동차가 멈추게 하는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">동명사를 목적어로 취하는 동사\u003c/span> : begin + [동명사(목적어)] : \"갖기 시작했다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Skilled in signaling the oncoming cars, 오는 자동차에 신호를 보내는 일에 능숙해지면서. and getting them to halt, 그리고 자동차가 멈추게 하는 일에. yards before the white lines, 정지선 몇 야드 앞에서. he began taking on, 그는 갖기 시작했다. a straighter posture, 더 곧은 자세와. and a more confident gaze, 더 자신감 있는 시선을. 이 문장 전체를 해석하면, 오는 자동차에 신호를 보내고, 자동차가 정지선 몇 야드 앞에서 멈추게 하는 일에 능숙해지면서, 그는 더 곧은 자세와 더 자신감 있는 시선을 갖게 되었다.","hl":"m"},{"n":28,"text":"이 문장은 능숙함이 자신감으로 이어지는 인과 관계를 담고 있어요. 아무도 찾지 않던 은퇴자가 누군가에게 꼭 필요한 일을 맡으면서 자세와 표정까지 달라졌다는 게 이 글의 결론이죠.","hl":"mn"},{"n":29,"text":"첫 번째로, 문장 맨 앞의 Skilled in은 원래 Being skilled in이었는데 Being이 생략된 분사구문이에요. 과거분사로 시작해서 주어 he의 상태를 설명해 주죠. 두 번째로, signaling the oncoming cars and getting them to halt에서 signaling과 getting은 전치사 in 뒤에 온 동명사이고 and로 병렬을 이루고 있어요. 세 번째로, getting them to halt는 get이 목적어 them 뒤에 to부정사를 목적격보어로 데려오는 구조예요. 네 번째로, began taking on에서 begin은 동명사를 목적어로 취해서 갖기 시작했다는 의미를 만들어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 (그 전에 이미) 찾아냈다\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">found\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">설득력 있는 이유를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">compelling \u003c/span>\u003cspan class=\"tgt\">reason \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">잠자리에서 나올\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">get \u003c/span>\u003cspan class=\"tgt\">out \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">bed\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아침에.\u003c/span>\u003cspan class=\"en\">in the morning.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그리고 그는 아침에 잠자리에서 나올 충분한 이유를 찾았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 지문의 결론 문장으로, 은퇴 후 무기력했던 남자가 횡단보도 안전요원 활동을 통해 아침에 일어날 만한 \u003cb class=\"key\">설득력 \u003c/b>\u003cb class=\"key\">있는 \u003c/b>\u003cb class=\"key\">이유\u003c/b>, 곧 삶의 목적을 되찾았음을 보여 줍니다. 여기서 \u003cb class=\"key\">compelling\u003c/b>은 '강제적인'이 아니라 마음이 움직일 만큼 '충분한, 설득력 있는'이라는 뉘앙스로, 그가 다시 활기를 얻었음을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거완료(have + p.p.)\u003c/span> : had + [[과거분사]] → 과거의 어떤 시점보다 더 이전에 완료된 일 : \"(그 전에 이미) 찾아냈다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : [[명사]] + to부정사 → 앞의 명사를 뒤에서 수식 : \"잠자리에서 나올 설득력 있는 이유\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"He had found, 그는 (그 전에 이미) 찾아냈다. a compelling reason, 설득력 있는 이유를. to get out of bed, 잠자리에서 나올. in the morning, 아침에.. 이 문장 전체를 해석하면, 그리고 그는 아침에 잠자리에서 나올 충분한 이유를 찾았다.","hl":"m"},{"n":31,"text":"이 문장은 글의 마지막 결론이에요. 은퇴하고 나서 아무도 찾지 않아 무기력했던 남자가 횡단보도 안전요원 일을 하면서 아침에 일어날 설득력 있는 이유, 다시 말해 삶의 목적을 되찾았다는 뜻이죠. compelling은 '강제적인'이 아니라 마음이 움직일 만큼 충분한이라는 뉘앙스로 잡아 주세요.","hl":"mn"},{"n":32,"text":"먼저 had found는 과거완료예요. 이야기 속 과거 시점보다 더 앞서 이미 완료된 일을 나타내서 '찾아낸 상태였다'는 느낌을 줍니다. 두 번째로 to get out of bed는 to부정사의 형용사적 용법으로, 앞에 있는 명사 reason을 뒤에서 꾸며 주는 거예요. '나올 이유'처럼 우리말 어순과 똑같아서 자연스럽게 느껴지지만, reason to를 한 덩어리로 묶어서 기억해 두면 좋아요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>막 은퇴한 임원은 아무도 전화하지 않고 \u003cb class=\"key\">답해야 \u003c/b>\u003cb class=\"key\">할 \u003c/b>\u003cb class=\"key\">통화 \u003c/b>\u003cb class=\"key\">목록\u003c/b>마저 사라진 현실에 괴로움을 느낀다.\u003c/li>\u003cli>사무실의 후임은 점심 제안을 정중히 사양했고, 6개월 전과 같은 사람인데도 아무도 그를 \u003cb class=\"key\">찾지 \u003c/b>\u003cb class=\"key\">않는다\u003c/b>.\u003c/li>\u003cli>친구는 그가 \u003cb class=\"key\">우울\u003c/b>해지고 늦잠을 잔다고 지적하며 초등학교 교통안전 지킴이 활동을 격려한다.\u003c/li>\u003cli>차를 멈추게 하는 일에 능숙해진 그는 곧은 자세와 자신감을 되찾고 아침에 일어날 \u003cb class=\"key\">충분한 \u003c/b>\u003cb class=\"key\">이유\u003c/b>를 찾는다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Even after losing his position, a retired executive regains confidence and a reason to get out of bed in the morning by taking on a new role as a crossing guard.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: \u003cb class=\"key\">은퇴\u003c/b> 후 아무도 자신을 찾지 않아 괴로워하던 임원이, 친구의 격려로 초등학교 \u003cb class=\"key\">교통안전 \u003c/b>\u003cb class=\"key\">지킴이\u003c/b>가 되어 더 곧은 자세와 자신감을 되찾고 아침에 잠자리에서 나올 \u003cb class=\"key\">이유\u003c/b>를 찾게 된다는 이야기입니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":33,"text":"오늘 글은 작은 역할 하나가 사람을 다시 일으킨다는 이야기였어요. 은퇴로 사라진 것은 직함이지 그 사람 자체가 아니었다는 점, 그리고 새로운 역할이 삶의 이유를 만들어 준다는 점을 꼭 기억해 주세요. 문제와 해결 구조에 미괄식 결론, 그리고 decline과 encourage 같은 핵심 어휘까지 챙겼으면 합니다. 오늘도 수고했어요, 다음 강의에서 만나요!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
