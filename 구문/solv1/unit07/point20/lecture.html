</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio(),think=null;
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function reveal(k){var e=sl.querySelectorAll('[data-rv="'+k+'"]');for(var x=0;x<e.length;x++)e[x].classList.add("rv");var b=sl.querySelector('[data-act="show"]');if(b)b.hidden=true;}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}if(think){think.remove();think=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function pause(sec){var left=sec,t0=Date.now();think=document.createElement("div");think.className="lp-think";think.textContent="생각할 시간 "+left+"초";sl.appendChild(think);
    tick=setInterval(function(){left=Math.max(0,sec-Math.floor((Date.now()-t0)/1000));if(think)think.textContent="생각할 시간 "+left+"초";setFill(Math.min(1,(Date.now()-t0)/(sec*1000)));},250);
    timer=setTimeout(function(){stopAll();segEnd();},sec*1000/Math.max(.5,rate));}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(s.reveal)reveal(s.reveal);if(!playing)return;
    if(s.pause){pause(s.pause);return;}
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s||s.pause)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){var s=segs()[j];if(!noAudio&&s&&!s.pause&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  sl.addEventListener("click",function(e){var t=e.target.closest?e.target.closest(".g-opt,[data-act]"):null;if(!t)return;
    if(t.getAttribute("data-act")==="show"){reveal("ans");return;}
    var g=t.parentNode;if(g&&g.classList.contains("rv"))return;[].forEach.call(g.querySelectorAll(".g-opt"),function(o){if(o!==t)o.classList.remove("picked");});t.classList.toggle("picked");});
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"if가 없는 가정법","title":"if가 없는 가정법 완전 정복","audioDir":"lecture_audio","preview":false,"count":22,"slides":[{"html":"\u003cdiv class=\"g-cover\">\u003cdiv class=\"g-unit\">20강 if가 없는 가정법\u003c/div>\u003ch1>if가 없는 가정법 완전 정복\u003c/h1>\u003cdiv class=\"lp-box\" data-hl=\"goal\">\u003cb class=\"h\">오늘의 목표\u003c/b>if 없이도 비현실적인 소망이나 가상의 상황을 표현하는 가정법을 정확하게 이해하고 활용한다.\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분. 오늘 은 if가 눈에 보이지 않아도 가정법의 의미를 나타내는 특별한 표현들을 함께 공부해 볼 거예요. 우리가 평소에 소망을 말하거나 숨겨진 전제 조건을 표현할 때 아주 자주 쓰이는 내용이니까 집중해서 잘 들어 주세요. 자 그럼 첫 번째 시간으로 wish를 사용한 가정법부터 시작해 볼게요.","hl":"goal"}]},{"html":"\u003cspan class=\"lp-tag\">개념 1 / 2\u003c/span>\u003ch2 class=\"g-h\">A. wish 가정법의 의미와 형태\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">\u003cb class=\"key\">wish\u003c/b> 뒤에는 비현실적인 상황이 오는 경우가 많으며, 실제는 아니지만 \u003cb class=\"key\">~하다면 좋겠는데\u003c/b> 또는 \u003cb class=\"key\">~했더라면 좋았을 걸\u003c/b>이라는 의미를 나타낸다.\u003cdiv>\u003cspan class=\"g-formula\">wish + 주어 + 과거동사 / 과거완료\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">I wish I \u003cspan class=\"fx\">had someone to talk to\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">누군가 말 붙일 사람이 있으면 좋을 텐데.\u003c/div>\u003cdiv class=\"g-note\">현재 사실과 반대되는 소망을 나타내는 wish 가정법 문장\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">I wish you \u003cspan class=\"fx\">had told me before\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">네가 전에 내게 말을 했더라면 좋았을 걸.\u003c/div>\u003cdiv class=\"g-note\">과거 사실에 아쉬움을 나타내는 wish 가정법 과거완료\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">He wishes his neighbor \u003cspan class=\"fx\">would stop playing the piano\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">그는 이웃이 피아노 연주를 멈추면 좋을 텐데 하고 바란다.\u003c/div>\u003cdiv class=\"g-note\">미래의 변화를 바라는 wish와 조동사 과거형\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-3\">\u003cdiv class=\"g-en\">We wish you \u003cspan class=\"fx\">had been there to speak for us\u003c/span>.\u003c/div>\u003cdiv class=\"g-ko\">우리는 네가 우리를 대변하기 위해 그곳에 있었다면 좋았겠다고 생각한다.\u003c/div>\u003cdiv class=\"g-note\">과거에 그러지 못했던 상황에 대한 아쉬움\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>\u003cb class=\"key\">wish\u003c/b> 다음의 절에서는 시제가 한 단계 과거로 이동한다는 것을 잊지 마세요.\u003c/div>","segs":[{"n":2,"text":"먼저 wish 가정법에 대해 알아볼게요. wish 뒤에는 비현실적인 상황이 오며 실제로는 그렇지 않지만 그렇다면 참 좋겠다고 바라는 마음을 나타내요. 현재 사실을 반대로 바랄 때는 과거동사를 쓰고 과거 사실을 반대로 바랄 때는 과거완료를 쓴다는 점을 꼭 기억해 두세요.","hl":"rule"},{"n":3,"text":"첫 번째 예문을 소리 내어 읽어 볼게요. I wish I had someone to talk to라고 했어요. 이 문장은 누군가 말 붙일 사람이 지금 있으면 참 좋을 텐데 하고 현재의 소망을 나타내는 문장이에요.","hl":"ex-0"},{"n":4,"text":"두 번째 예문을 볼까요. I wish you had told me before라고 했어요. 이것은 네가 전에 내게 말을 했더라면 참 좋았을 텐데 하고 지나간 과거 일을 아쉬워하는 표현이에요.","hl":"ex-1"},{"n":5,"text":"세 번째 예문을 함께 읽어 보죠. He wishes his neighbor would stop playing the piano라고 했어요. 그는 이웃이 피아노 연주를 앞으로 멈추어 주면 참 좋을 텐데 하고 바란다는 뜻이에요.","hl":"ex-2"},{"n":6,"text":"네 번째 예문이에요. We wish you had been there to speak for us라고 했어요. 우리는 네가 우리를 대변하기 위해 그곳에 있었다면 참 좋았겠다고 생각한다는 뜻으로 과거의 아쉬움을 나타내요.","hl":"ex-3"},{"n":7,"text":"여기서 주의할 점은 wish 뒤에 나오는 절의 시제가 현재를 말할 때는 과거로, 과거를 말할 때는 과거완료로 한 단계씩 과거로 이동한다는 거예요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">개념 2 / 2\u003c/span>\u003ch2 class=\"g-h\">B. 숨어있는 가상 상황과 조동사\u003c/h2>\u003cdiv class=\"g-rule\" data-hl=\"rule\">if 절이 표면에 없어도 \u003cb class=\"key\">전제 조건\u003c/b>이 다양한 어구에 함축되며, 추정과 추측의 \u003cb class=\"key\">조동사\u003c/b>가 쓰여 비현실적인 상황임을 알려준다.\u003cdiv>\u003cspan class=\"g-formula\">전제 조건 어구 + 주어 + would / might / could + 동사원형(또는 완료형)\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"g-exs\">\u003cdiv class=\"g-ex\" data-hl=\"ex-0\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Without music\u003c/span>, the world would be a dull place.\u003c/div>\u003cdiv class=\"g-ko\">음악이 없다면 세상은 지루한 곳이 될 것이다.\u003c/div>\u003cdiv class=\"g-note\">Without으로 전제 조건을 나타낸 가정법\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-1\">\u003cdiv class=\"g-en\">I am very busy this week; \u003cspan class=\"fx\">otherwise\u003c/span>, I would come to your party.\u003c/div>\u003cdiv class=\"g-ko\">나는 이번 주에 매우 바쁘다. 그렇지 않다면 너의 party에 갈 텐데.\u003c/div>\u003cdiv class=\"g-note\">otherwise를 통해 가상의 상황을 이끌어내는 문장\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-2\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">A true friend\u003c/span> would act differently.\u003c/div>\u003cdiv class=\"g-ko\">진정한 친구라면 다르게 행동할 것이다.\u003c/div>\u003cdiv class=\"g-note\">주어 명사구에 전제 조건이 숨어 있는 형태\u003c/div>\u003c/div>\u003cdiv class=\"g-ex\" data-hl=\"ex-3\">\u003cdiv class=\"g-en\">\u003cspan class=\"fx\">Without the heavy traffic\u003c/span>, we would have been on time.\u003c/div>\u003cdiv class=\"g-ko\">교통체증이 없었다면 우리는 제 시간에 맞추어 갔었을 텐데.\u003c/div>\u003cdiv class=\"g-note\">과거 사실에 대한 가상을 나타내는 Without 표현\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"g-tip\" data-hl=\"tip\">\u003cb>주의\u003c/b>추정의 \u003cb class=\"key\">조동사 would, might, could\u003c/b>는 숨어 있는 가정법을 찾는 가장 확실한 단서이다.\u003c/div>","segs":[{"n":8,"text":"이번에는 if가 겉으로 드러나지 않는 숨어 있는 가상 상황을 공부해 볼게요. 문장 속에 if가 없더라도 비현실적인 전제 조건이 다른 어구에 숨어 있을 수 있어요. 이때 문장에 would나 might나 could 같은 추측의 조동사가 들어 있다면 그것이 바로 가정법이라는 결정적인 신호예요.","hl":"rule"},{"n":9,"text":"첫 번째 예문을 읽어 볼게요. Without music, the world would be a dull place라고 했어요. 여기서 Without music이라는 표현이 음악이 없다면 이라는 가정의 의미를 담고 있어요.","hl":"ex-0"},{"n":10,"text":"두 번째 예문을 볼까요. I am very busy this week; otherwise, I would come to your party라고 했어요. otherwise가 그렇지 않다면 이라는 뜻으로 숨겨진 가정 상황을 대신하고 있죠.","hl":"ex-1"},{"n":11,"text":"세 번째 예문이에요. A true friend would act differently라고 했어요. 진정한 친구라는 주어 속에 만약 진정한 친구라면 이라는 전제 조건이 멋지게 숨어 있어요.","hl":"ex-2"},{"n":12,"text":"네 번째 예문을 보죠. Without the heavy traffic, we would have been on time이라고 했어요. 교통 체증이 없었더라면 하고 과거의 상황을 가정하고 있네요.","hl":"ex-3"},{"n":13,"text":"이러한 문장들을 볼 때는 문장 속의 would나 might나 could 같은 조동사를 눈여겨보는 것이 아주 중요한 팁이에요.","hl":"tip"}]},{"html":"\u003cspan class=\"lp-tag\">자주 하는 실수\u003c/span>\u003ch2 class=\"g-h\">이렇게 쓰면 틀려요\u003c/h2>\u003cdiv class=\"g-mk\" data-hl=\"mk-0\">\u003cdiv class=\"g-wrong\">✗ \u003cs>I wish I have someone to talk to.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ I wish I had someone to talk to.\u003c/div>\u003cdiv class=\"g-why\">wish 가정법에서는 현재 사실과 반대되는 소망을 나타낼 때 현재형이 아니라 과거형 동사를 써야 하기 때문이다.\u003c/div>\u003c/div>\u003cdiv class=\"g-mk\" data-hl=\"mk-1\">\u003cdiv class=\"g-wrong\">✗ \u003cs>Without music, the world will be a dull place.\u003c/s>\u003c/div>\u003cdiv class=\"g-right\">✓ Without music, the world would be a dull place.\u003c/div>\u003cdiv class=\"g-why\">if가 없는 가정법 문장에서 가상의 결과를 나타낼 때는 단순 미래 조동사 will 대신 추정의 조동사 would를 써야 하기 때문이다.\u003c/div>\u003c/div>","segs":[{"n":14,"text":"학생들이 자주 틀리는 첫 번째 문장을 볼게요. I wish I have someone to talk to라고 쓰면 틀려요. wish 뒤에는 현재 사실의 반대를 나타내기 위해 과거형 동사 had를 써야 하므로 I wish I had someone to talk to가 올바른 문장이에요.","hl":"mk-0"},{"n":15,"text":"두 번째로 자주 틀리는 문장을 살펴볼게요. Without music, the world will be a dull place라고 쓰면 어색해요. 숨어 있는 가정법 구문에서 결과를 나타낼 때는 will이 아니라 추정의 조동사 would를 써서 would be로 써야 맞아요.","hl":"mk-1"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 1 / 2\u003c/span>\u003cspan class=\"g-kind\">객관식\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 빈칸에 들어가기에 가장 알맞은 것을 고르시오.\nI am very busy this week; ____________, I would come to your party.\u003c/div>\u003cdiv class=\"g-qs\">I am very busy this week; ____________, I would come to your party.\u003c/div>\u003cdiv class=\"g-opts\" data-rv=\"ans\">\u003cbutton class=\"g-opt\">\u003cb>①\u003c/b>therefore\u003c/button>\u003cbutton class=\"g-opt\" data-ok=\"1\">\u003cb>②\u003c/b>otherwise\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>③\u003c/b>meanwhile\u003c/button>\u003cbutton class=\"g-opt\">\u003cb>④\u003c/b>furthermore\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">otherwise\u003c/span>\u003cdiv class=\"g-exp\">이번 주에 매우 바쁘지만 그렇지 않다면 파티에 갈 텐데 라는 가상의 의미를 연결해야 하므로 그렇지 않다면 이라는 뜻의 otherwise가 정답이다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":16,"text":"첫 번째 문제입니다. 빈칸에 들어갈 알맞은 단어를 고르는 문제예요. I am very busy this week; 빈칸, I would come to your party라는 문장이에요. 네 개의 보기 중에서 알맞은 것을 직접 골라 보세요.","hl":"q"},{"n":17,"text":"","hl":"q","pause":6},{"n":18,"text":"정답은 두 번째 보기인 otherwise예요. 이번 주에 매우 바쁘지만 그렇지 않다면 파티에 갈 수 있을 텐데 라는 가정의 의미를 부드럽게 이어 주는 역할을 한답니다.","hl":"ans","reveal":"ans"}]},{"html":"\u003cdiv class=\"g-tags\">\u003cspan class=\"lp-tag\">확인 문제 2 / 2\u003c/span>\u003cspan class=\"g-kind\">오류 수정\u003c/span>\u003c/div>\u003cdiv data-hl=\"q\">\u003cdiv class=\"g-q\">다음 문장에서 어법상 틀린 부분을 찾아 바르게 고쳐 전체 문장을 다시 쓰시오.\nI wish you tell me the truth before.\u003c/div>\u003cdiv class=\"g-qs\">I wish you tell me the truth before.\u003c/div>\u003c/div>\u003cdiv class=\"g-ans\" data-rv=\"ans\" data-hl=\"ans\">\u003cb>정답\u003c/b>\u003cspan class=\"a\">I wish you had told me the truth before.\u003c/span>\u003cdiv class=\"g-exp\">과거 사실에 대한 아쉬움을 나타내는 wish 가정법이므로 tell을 과거완료 형태인 had told로 고쳐야 한다.\u003c/div>\u003c/div>\u003cbutton class=\"g-show\" data-act=\"show\">정답 보기\u003c/button>","segs":[{"n":19,"text":"두 번째 문제입니다. 오류 수정 문제인데요. I wish you tell me the truth before라는 문장에서 어법상 틀린 부분을 찾아 바르게 고쳐 보세요.","hl":"q"},{"n":20,"text":"","hl":"q","pause":6},{"n":21,"text":"정답은 tell을 had told로 고친 I wish you had told me the truth before예요. 과거에 진실을 말해 주었더라면 좋았을 텐데 라는 아쉬움을 나타내므로 과거완료를 써야 하기 때문이에요.","hl":"ans","reveal":"ans"}]},{"html":"\u003cspan class=\"lp-tag\">오늘의 정리\u003c/span>\u003ch2 class=\"g-h\">20강 if가 없는 가정법\u003c/h2>\u003cul class=\"g-sum\" data-hl=\"sum\">\u003cli>\u003cb class=\"key\">wish\u003c/b> 가정법은 현재나 과거의 사실과 반대되는 소망이나 아쉬움을 나타낸다.\u003c/li>\u003cli>if가 없더라도 \u003cb class=\"key\">Without\u003c/b>이나 \u003cb class=\"key\">otherwise\u003c/b> 같은 어구와 조동사로 가정법을 표현할 수 있다.\u003c/li>\u003c/ul>","segs":[{"n":22,"text":"오늘 우리는 if가 없는 가정법의 두 가지 핵심을 멋지게 마스터했어요. wish 뒤에 비현실적인 소망을 나타내는 방법과 여러 가지 어구 속에 숨어 있는 가상 상황을 조동사와 함께 쓰는 방법을 잘 기억해 두세요. 오늘 공부한 내용을 복습하면서 오늘 수업을 마무리할게요. 수고하셨어요.","hl":"sum"}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
