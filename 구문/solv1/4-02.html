<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SO 레벨1 4강 적용독해02 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-chips .x{background:none;color:#999;padding:0}
.lp-sno{font-size:13px;color:#8493A1;font-weight:700;margin-bottom:8px}

.lp-chunk{display:flex;flex-direction:column}
.lp-chunk .ko{font-size:13px;color:var(--pk-t);font-weight:700;line-height:1.3;margin-bottom:2px}
.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}
.lp-top::before{height:5px;background:linear-gradient(90deg,var(--pk) 0,var(--pk) 80%,var(--am) 80%,var(--am) 100%)}
.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}
.lp-tag{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700;padding:2px 12px}
.lp-qn{flex:0 0 112px;height:112px;align-self:center;background:#fff;color:var(--pk);border:3px solid var(--pk);border-radius:50%;font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;font-size:26px}
.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}
.lp-qn .qt{display:block;white-space:nowrap;line-height:1.12;letter-spacing:-.02em}
.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}

.lp-st h4{color:var(--ink,#1B2733)}
.lp-st h4 i{border-radius:4px;width:auto;min-width:24px;padding:0 4px}
.lp-pill{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700}
.lp-chain span.c{background:#fff;border:1px solid #AEBBE6;border-radius:3px;font-weight:600}

.lp-vg em{background:#fff;border:1px solid var(--pk-b);border-radius:3px}
.lp-sa>div{border-radius:4px;border-color:var(--pk-b)}

.lp-chips .s{border:1px solid #AEBBE6;color:#3A4FA3}
.lp-chips .a{border:1px solid var(--am-b);color:var(--am-d);background:#FFFBF2}
.lp-sno .es{background:var(--am);border-radius:2px;font-weight:700}
.lp-chunk .en{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:600}
.lp-chunk+.lp-chunk{border-left:1px solid var(--pk-b)}
.lp .tgt{background:var(--am-l);border-bottom:2.5px dotted var(--am)}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"SO 레벨1 4강 적용독해02","audioDir":"4-02_audio","preview":false,"count":33,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">4강\u003cbr>적용독해02\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">SO 레벨1\u003c/div>\u003ch1>Nothing Can Possibly Go Wrong?\u003c/h1>\u003ch2>어떤 것도 잘못될 수 없다고?\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>조종사도 승무원도 없이 컴퓨터로만 조종되는 특별한 비행에서, 안내 방송은 사람의 \u003cb class=\"key\">실수\u003c/b> 가능성이 전혀 없다고 낙관적으로 장담합니다. 그러나 마지막에 '잘못될 수가'라는 말이 계속 반복되면서 최신 \u003cb class=\"key\">기술\u003c/b>의 오류 가능성이 암시됩니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The proud claim that a computer-controlled flight cannot go wrong is ironically undercut when the announcement keeps repeating &quot;go wrong.&quot;\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 컴퓨터가 완전히 조종하는 비행기에 대한 짧은 이야기예요. 조종사도 승무원도 없는 비행에서 안내 방송은 아무것도 잘못될 수 없다고 큰소리치지만, 마지막에 그 말이 계속 반복되면서 분위기가 확 뒤집히죠. 요지는 사람의 실수를 없앤 기술이라도 기계의 오류에서는 자유롭지 않다는 거예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">컴퓨터가 사람 대신 판단하고 움직이는 \u003cb class=\"key\">자동화\u003c/b>(automation)는 오늘날 비행기와 자동차, 공장에 이미 깊이 들어와 있습니다. 비행기의 오토파일럿(autopilot)처럼 기계가 스스로 상황을 판단하는 무인 시스템이 대표적인 예입니다. 이런 기술이 발전한 이유는 사람이 피곤하거나 당황하면 \u003cb class=\"key\">인적 \u003c/b>\u003cb class=\"key\">오류\u003c/b>(human error)를 내기 쉽기 때문입니다. 하지만 사람의 실수를 없앤다고 해서 실패가 사라지는 것은 아닙니다. 소프트웨어에는 언제든 버그(bug)가 생길 수 있고, 기계는 예상하지 못한 방식으로 \u003cb class=\"key\">오류\u003c/b>를 반복하기도 합니다. 자동 주차를 믿고 핸들에서 손을 뗐는데 차가 같은 자리에서 계속 후진만 하는 상황을 떠올려 보세요. 이 지문은 '인적 오류 제로'라는 낙관적 광고 문구를 마지막 한 줄의 \u003cb class=\"key\">반전\u003c/b>으로 비꼬고 있습니다.\u003c/div>","segs":[{"n":2,"text":"배경지식을 조금만 짚고 갈게요. 요즘 비행기나 자동차에는 사람 대신 판단하는 자동화 기술이 이미 깊이 들어와 있어요. 비행기의 autopilot을 떠올리면 이해가 빠르죠. 이런 기술이 발전한 이유는 사람이 피곤하거나 당황하면 human error, 즉 인적 오류를 내기 쉽기 때문이에요. 그런데 사람의 실수를 없앤다고 해서 실패가 사라지는 건 아니에요. 소프트웨어에는 언제든 bug가 생길 수 있고, 기계는 예상 못 한 방식으로 오류를 반복하기도 하죠. 자동 주차를 믿고 손을 뗐는데 차가 같은 자리에서 계속 후진만 하는 상황을 떠올리면 딱 이해가 될 거예요. 이 지문은 그런 낙관을 마지막 한 줄의 반전으로 비꼬고 있는 거예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>이륙과 안내 방송\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>비행기가 시카고 오헤어 공항에서 이륙할 때 스피커에서 안내 방송이 흘러나옵니다. 방송은 비스타 항공 탑승을 환영하며 이번 비행이 \u003cb class=\"key\">특별\u003c/b>하다고 말합니다. 독자는 왜 특별한지에 대한 \u003cb class=\"key\">궁금증\u003c/b>을 갖게 됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>완전 자동 조종\u003csmall>근거 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>이 비행은 컴퓨터로 완전히 \u003cb class=\"key\">조종\u003c/b>되는 최초의 비행이라고 밝힙니다. 기내에 조종사나 승무원이 없기 때문에 사람이 \u003cb class=\"key\">실수\u003c/b>할 가능성은 전혀 없다고 강조합니다. 인간의 약점을 기술로 없앴다는 \u003cb class=\"key\">낙관\u003c/b>이 깔려 있는 대목입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>최신 기술에 대한 신뢰\u003csmall>근거 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>승객의 모든 요구는 최신식 \u003cb class=\"key\">기술\u003c/b>이 처리하고 비상사태에도 대비가 되어 있다고 말합니다. 그러니 그냥 편히 비행을 \u003cb class=\"key\">즐기\u003c/b>라고 권합니다. 기술에 모든 것을 맡기라는 \u003cb class=\"key\">안내\u003c/b>입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>반복되는 이상 신호\u003csmall>반전 · 문장 7\u003c/small>\u003c/h4>\u003cp>마지막 문장에서 '어떤 것도 잘못될 수가 없다'는 말이 '잘못될 수가'로 \u003cb class=\"key\">반복\u003c/b>됩니다. 이 반복은 컴퓨터가 \u003cb class=\"key\">오류\u003c/b>를 일으켜 같은 말을 계속 되뇌는 상황을 암시합니다. 기술 만능에 대한 \u003cb class=\"key\">아이러니\u003c/b>가 드러나는 순간입니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 지금부터 이 이야기가 어떤 순서로 흘러가는지 한 단계씩 따라가 볼게요.","hl":null},{"n":4,"text":"먼저 비행기가 시카고 오헤어 공항에서 이륙하는 장면으로 시작해요. 그때 스피커에서 목소리가 흘러나오면서 비스타 항공에 탑승한 것을 환영한다고 말하죠. 그리고 이번 비행은 아주 특별하다고 소개해요. 독자는 왜 특별한지에 대한 궁금증이 생기면서 글 속으로 들어가게 됩니다.","hl":"f0"},{"n":5,"text":"다음에는 그 특별함의 정체가 나와요. 이 비행은 컴퓨터가 완전히 조종하는 최초의 비행이라는 거죠. 기내에 조종사도 승무원도 없기 때문에 사람이 실수할 가능성은 전혀 없다고 강조해요. 사람의 약점을 기술로 지워 버렸다는 낙관이 깔려 있는 대목이에요.","hl":"f1"},{"n":6,"text":"이어서 승객에게 필요한 모든 것은 최신식 기술이 처리한다고 말해요. 비상사태에도 대비가 되어 있으니 그냥 편히 비행을 즐기라고 권하죠. 기술을 완전히 믿고 몸을 맡기라는 안내인 셈이에요.","hl":"f2"},{"n":7,"text":"그런데 마지막 문장에서 분위기가 확 뒤집혀요. 어떤 것도 잘못될 수 없다던 그 말이 go wrong, go wrong 하고 반복되거든요. 이건 컴퓨터가 오류를 일으켜 같은 말만 되뇌는 상황을 암시해요. 기술 만능을 믿었던 순간에 아이러니가 터지는 거죠.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순(상황 제시 후 반전)\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 7번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 이륙 장면에서 시작해 안내 방송의 내용을 순서대로 전달하는 \u003cb class=\"key\">시간순\u003c/b> 전개를 따릅니다. 앞부분에서는 컴퓨터 조종과 최신 기술을 \u003cb class=\"key\">칭찬\u003c/b>하듯 말해 독자의 긴장을 풀어 놓습니다. 그러나 마지막 문장에서 같은 말이 반복되며 \u003cb class=\"key\">반전\u003c/b>이 일어나 주제가 드러납니다. 그래서 핵심이 맨 끝에 오는 \u003cb class=\"key\">미괄식\u003c/b> 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>As (1)\u003c/b>\u003cspan>시간 배경 제시\u003c/span>\u003cb>because (4)\u003c/b>\u003cspan>이유·원인 제시\u003c/span>\u003cb>go wrong ... go wrong ... go wrong (7)\u003c/b>\u003cspan>반복을 통한 반전·주제 암시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">controlled completely by a computer\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">no pilot or crew aboard\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">All of your needs will be taken care of by the very latest technology\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Every possible emergency is prepared for\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">nothing can possibly go wrong\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>사람이 조종하는 비행\u003c/th>\u003cth>컴퓨터가 조종하는 비행\u003c/th>\u003c/tr>\u003ctr>\u003ctd>조종사·승무원 탑승\u003c/td>\u003ctd>조종사·승무원 없음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사람의 실수 가능성 있음\u003c/td>\u003ctd>사람의 실수 가능성 없음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>예측 가능한 실수\u003c/td>\u003ctd>반복되는 시스템 오류\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"구조를 보면 이 글은 시간의 흐름을 그대로 따라가는 시간순 전개예요. 방송이 나오고, 비행의 원리가 설명되고, 마지막에 문제가 암시되는 순서죠. 앞부분은 기술에 대한 칭찬처럼 들리지만 진짜 핵심인 반전은 맨 끝에 나오기 때문에 미괄식 구조라고 합니다. 그래서 마지막 문장을 읽기 전까지는 이 글이 기술 자랑인지 아이러니인지 판단하기 어려워요.","hl":"ty"},{"n":9,"text":"신호어를 보면 첫 문장의 As가 시간 배경을 열어 주고, 네 번째 문장의 because가 이유를 붙여 줘요. 그리고 마지막 문장에서 go wrong이 반복되는 것이 이 글의 결정적인 신호예요. 앞에서 한 말을 그대로 되풀이하는 이 반복을 놓치면 반전을 발견할 수 없어요. 서술자가 따로 평가하지 않아도 반복과 말줄임표만으로 주제가 드러난다는 점을 기억하세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>as\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>~할 때\u003c/span>\u003c/div>\u003cdiv>\u003cb>take off\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>이륙하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>loudspeaker\u003c/b>\u003cem>명사\u003c/em>\u003cspan>확성기, 스피커\u003c/span>\u003c/div>\u003cdiv>\u003cb>voice\u003c/b>\u003cem>명사\u003c/em>\u003cspan>목소리\u003c/span>\u003c/div>\u003cdiv>\u003cb>welcome\u003c/b>\u003cem>동사\u003c/em>\u003cspan>환영하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>aboard\u003c/b>\u003cem>부사\u003c/em>\u003cspan>탑승하여\u003c/span>\u003c/div>\u003cdiv>\u003cb>special\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>특별한\u003c/span>\u003c/div>\u003cdiv>\u003cb>flight\u003c/b>\u003cem>명사\u003c/em>\u003cspan>비행, 항공편\u003c/span>\u003c/div>\u003cdiv>\u003cb>first\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>최초의\u003c/span>\u003c/div>\u003cdiv>\u003cb>control\u003c/b>\u003cem>동사\u003c/em>\u003cspan>조종하다, 통제하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>completely\u003c/b>\u003cem>부사\u003c/em>\u003cspan>완전히\u003c/span>\u003c/div>\u003cdiv>\u003cb>possibility\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가능성\u003c/span>\u003c/div>\u003cdiv>\u003cb>human error\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>인적 오류, 사람의 실수\u003c/span>\u003c/div>\u003cdiv>\u003cb>pilot\u003c/b>\u003cem>명사\u003c/em>\u003cspan>조종사\u003c/span>\u003c/div>\u003cdiv>\u003cb>crew\u003c/b>\u003cem>명사\u003c/em>\u003cspan>승무원\u003c/span>\u003c/div>\u003cdiv>\u003cb>take care of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>처리하다, 돌보다\u003c/span>\u003c/div>\u003cdiv>\u003cb>latest\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>최신의\u003c/span>\u003c/div>\u003cdiv>\u003cb>technology\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기술\u003c/span>\u003c/div>\u003cdiv>\u003cb>relax\u003c/b>\u003cem>동사\u003c/em>\u003cspan>편히 쉬다, 긴장을 풀다\u003c/span>\u003c/div>\u003cdiv>\u003cb>enjoy\u003c/b>\u003cem>동사\u003c/em>\u003cspan>즐기다\u003c/span>\u003c/div>\u003cdiv>\u003cb>possible\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>가능한\u003c/span>\u003c/div>\u003cdiv>\u003cb>emergency\u003c/b>\u003cem>명사\u003c/em>\u003cspan>비상사태\u003c/span>\u003c/div>\u003cdiv>\u003cb>prepare for\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>대비하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>go wrong\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>잘못되다, 고장 나다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"단어도 몇 개 짚어 볼게요. take off는 이륙하다, crew는 승무원, take care of는 처리하다라는 뜻이에요. go wrong은 잘못되다, 고장 나다라는 뜻으로 마지막 문장의 핵심이죠.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">control\u003c/b>\u003cspan class=\"m\">조종하다, 통제하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">operate\u003c/span>\u003cspan class=\"s\">manage\u003c/span>\u003cspan class=\"s\">regulate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">release\u003c/span>\u003cspan class=\"a\">free\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">completely\u003c/b>\u003cspan class=\"m\">완전히\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">entirely\u003c/span>\u003cspan class=\"s\">totally\u003c/span>\u003cspan class=\"s\">fully\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">partly\u003c/span>\u003cspan class=\"a\">partially\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">possibility\u003c/b>\u003cspan class=\"m\">가능성\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">chance\u003c/span>\u003cspan class=\"s\">likelihood\u003c/span>\u003cspan class=\"s\">potential\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">impossibility\u003c/span>\u003cspan class=\"a\">certainty\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">error\u003c/b>\u003cspan class=\"m\">실수, 오류\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">mistake\u003c/span>\u003cspan class=\"s\">fault\u003c/span>\u003cspan class=\"s\">slip\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">accuracy\u003c/span>\u003cspan class=\"a\">correctness\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">relax\u003c/b>\u003cspan class=\"m\">긴장을 풀다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">unwind\u003c/span>\u003cspan class=\"s\">rest\u003c/span>\u003cspan class=\"s\">loosen\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">tense\u003c/span>\u003cspan class=\"a\">stress\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">possible\u003c/b>\u003cspan class=\"m\">가능한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">feasible\u003c/span>\u003cspan class=\"s\">likely\u003c/span>\u003cspan class=\"s\">achievable\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">impossible\u003c/span>\u003cspan class=\"a\">unlikely\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">go wrong\u003c/b>\u003cspan class=\"m\">잘못되다, 고장 나다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">malfunction\u003c/span>\u003cspan class=\"s\">fail\u003c/span>\u003cspan class=\"s\">break down\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">function\u003c/span>\u003cspan class=\"a\">work\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"비슷한 말과 반대말도 함께 정리해 볼게요. completely는 entirely, totally와 가깝고 반대로는 partly가 있어요. possibility는 chance, likelihood와 비슷하고 반대말은 impossibility예요. error는 mistake, fault와 같은 뜻이고 반대말은 accuracy쯤이 되겠죠. relax는 unwind, rest와 통하고 반대말은 tense예요. go wrong은 malfunction, fail과 가깝고 반대로는 function이 있어요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">비행기가 이륙할 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">As \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">airplane \u003c/span>\u003cspan class=\"tgt\">took \u003c/span>\u003cspan class=\"tgt\">off\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시카고 오헤어 공항에서\u003c/span>\u003cspan class=\"en\">from Chicago's O'Hare Airport,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">소리가 흘러나왔다\u003c/span>\u003cspan class=\"en\">a voice \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">came \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">스피커에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">over \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">loudspeaker\u003c/span>:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“신사 숙녀 여러분,\u003c/span>\u003cspan class=\"en\">&quot;Ladies and gentlemen,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">비스타 항공에 탑승하신 걸 환영합니다.\u003c/span>\u003cspan class=\"en\">welcome aboard Vista Airlines.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">비행기가 시카고 오헤어 공항에서 이륙할 때, 스피커에서 소리가 흘러나왔다. “신사 숙녀 여러분, 비스타 항공에 탑승하신 걸 환영합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 비행기 이륙이라는 \u003cb class=\"key\">상황 \u003c/b>\u003cb class=\"key\">설정\u003c/b>과 함께 기내 안내 방송이 시작되는 장면을 제시하는 도입 문장이에요. \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">접속사 \u003c/b>\u003cb class=\"key\">as\u003c/b>는 '~할 때'라는 뜻으로, 이륙하는 순간과 방송이 동시에 일어남을 자연스럽게 이어 줍니다. 친절한 \u003cb class=\"key\">탑승 \u003c/b>\u003cb class=\"key\">인사\u003c/b>로 시작하는 이 방송은 뒤에 이어질 사고를 생각하면 오히려 반어적으로 들리는 장치예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간 접속사 as(~할 때)\u003c/span> : As + [주어 + 동사] , [주어 + 동사] (부사절을 이끄는 [[접속사]]) : \"비행기가 이륙할 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 over(~을 통해) + 매체 명사\u003c/span> : come + over + [the loudspeaker] ([[통로]]를 나타내는 전치사구) : \"스피커에서 (소리가) 흘러나왔다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"As the airplane took off, 비행기가 이륙할 때. from Chicago's O'Hare Airport, 시카고 오헤어 공항에서. a voice came, 소리가 흘러나왔다. over the loudspeaker, 스피커에서. \"Ladies and gentlemen, “신사 숙녀 여러분. welcome aboard Vista Airlines, 비스타 항공에 탑승하신 걸 환영합니다.. 이 문장 전체를 해석하면, 비행기가 시카고 오헤어 공항에서 이륙할 때, 스피커에서 소리가 흘러나왔다. “신사 숙녀 여러분, 비스타 항공에 탑승하신 걸 환영합니다.","hl":"m"},{"n":13,"text":"이 첫 번째 문장은 비행기가 이륙하는 상황 설정을 아주 생생하게 보여 주는 도입부예요. 앞에 나온 시간 접속사 as는 '~할 때'라는 뜻으로, 비행기가 뜨는 순간과 기내 방송이 동시에 일어난다는 걸 자연스럽게 이어 줘요. 그리고 스피커에서 흘러나오는 탑승 인사는 아주 친절하고 편안한 분위기라서, 뒤에 나올 사고를 생각하면 오히려 묘하게 느껴지죠.","hl":"mn"},{"n":14,"text":"먼저 첫 번째 포인트는 시간 접속사 as예요. as가 이끄는 절이 '비행기가 이륙할 때'라는 배경을 만들어 주고, 뒤에 주절이 따라오는 구조죠. 두 번째로 봐야 할 부분은 came over the loudspeaker인데요, over는 스피커라는 통로를 타고 소리가 나왔다는 뜻을 만들어 주는 전치사예요. 그래서 '스피커에서 소리가 흘러나왔다'라고 자연스럽게 해석하면 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이번 비행은 ~이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">This \u003c/span>\u003cspan class=\"tgt\">is\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">특별한 비행입니다.\u003c/span>\u003cspan class=\"en\">a special flight.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이번 비행은 특별합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 짧은 문장이지만 흐름에서는 아주 중요한 역할을 하는 \u003cb class=\"key\">화제 \u003c/b>\u003cb class=\"key\">전환\u003c/b>의 신호예요. 이제부터 이 비행이 왜 \u003cb class=\"key\">특별한 \u003c/b>\u003cb class=\"key\">비행\u003c/b>인지 구체적으로 설명하겠다는 예고입니다. 바로 다음 문장의 근거 제시로 자연스럽게 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지시대명사 This(앞 문장 지칭)\u003c/span> : This [지시대명사] + be동사 + [명사] : \"이번 비행은 ~이다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"This is, 이번 비행은 ~이다. a special flight, 특별한 비행입니다.. 이 문장 전체를 해석하면, 이번 비행은 특별합니다.","hl":"m"},{"n":16,"text":"짧은 문장이지만 흐름에서 아주 중요한 역할을 해요. 방송의 화제 전환이라고 할 수 있죠. 이제부터 이 비행이 얼마나 특별한 비행인지 설명하겠다는 신호예요.","hl":"mn"},{"n":17,"text":"여기서 This는 앞 문장의 비행 상황을 통째로 받는 지시대명사예요. 이미 나온 대상을 길게 반복하지 않고 지시대명사로 짧게 받는 게 영어의 자연스러운 흐름이죠. 그래서 해석도 '이것은'이 아니라 '이번 비행은'으로 받아 주면 훨씬 매끄러워요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 ~이다\u003c/span>\u003cspan class=\"en\">It is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">최초의 비행\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">first \u003c/span>\u003cspan class=\"tgt\">flight \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">조종되는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">controlled\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">완전히\u003c/span>\u003cspan class=\"en\">completely\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">컴퓨터에 의해\u003c/span>\u003cspan class=\"en\">by a computer.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이번 비행은 완전히 컴퓨터로만 조종되는 최초의 비행입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞의 '특별합니다'를 구체적으로 풀어 주는 문장으로, 이 비행이 특별한 \u003cb class=\"key\">특별한 \u003c/b>\u003cb class=\"key\">이유\u003c/b>를 밝히는 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">근거\u003c/b>예요. 즉 인간이 아니라 컴퓨터가 전부 조종하는 첫 비행이라는 점을 말하고 있죠. 그래서 다음 문장의 '인간의 실수가 없다'는 주장이 여기서 힘을 얻게 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that(서수 선행사)\u003c/span> : the first + [명사] + that + [동사] (관계사절이 [[선행사]]를 뒤에서 수식) : \"(컴퓨터에 의해) 조종되는 최초의 비행\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태(be + 과거분사)\u003c/span> : [목적어] + be + [[과거분사]] (+ by 행위자) : \"조종된다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"It is, 그것은 ~이다. the first flight, 최초의 비행. that is controlled, 조종되는. completely, 완전히. by a computer, 컴퓨터에 의해. 이 문장 전체를 해석하면, 이번 비행은 완전히 컴퓨터로만 조종되는 최초의 비행입니다.","hl":"m"},{"n":19,"text":"이 문장은 앞에서 말한 특별한 이유를 구체적으로 알려 주는 핵심 근거예요. 컴퓨터가 전부 조종하는 첫 비행이라는 점을 밝히고 있죠. 그래서 다음에 나올 '인간의 실수가 없다'는 말이 여기서 힘을 얻습니다.","hl":"mn"},{"n":20,"text":"첫 번째 어법 포인트는 주격 관계대명사 that이에요. 선행사에 the first처럼 서수가 붙으면 관계대명사로 that을 쓰는 게 자연스럽고, 이 that절이 앞의 the first flight를 뒤에서 꾸며 주죠. 두 번째는 수동태인데요, 조종하는 주체는 컴퓨터이고 비행기는 조종을 당하는 대상이라 be동사에 과거분사를 붙인 수동태로 표현했어요. 행위자는 뒤에 by a computer로 붙여 주면 '컴퓨터에 의해 조종된다'가 완성됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가능성은 전혀 없습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">no \u003c/span>\u003cspan class=\"tgt\">possibility\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인간이 실수할 가능성 말이죠\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">human \u003c/span>\u003cspan class=\"tgt\">error\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜냐하면 조종사도 승무원도 없기 때문입니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">because \u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">no \u003c/span>\u003cspan class=\"tgt\">pilot \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">crew \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기내에 탑승한 사람이 없기 때문이에요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">aboard\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">기내에는 조종사나 승무원이 한 명도 탑승하지 않았기 때문에 사람이 실수할 가능성은 전혀 없습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 기내 방송에서 승객을 안심시키는 대목입니다. 컴퓨터가 모든 것을 조종하니 조종사도 승무원도 없고, 그래서 \u003cb class=\"key\">인간의 \u003c/b>\u003cb class=\"key\">실수\u003c/b> 가능성이 없다고 단정하죠. 그런데 이 단정은 뒤에서 모든 것이 잘못되는 \u003cb class=\"key\">반전\u003c/b>을 위한 장치라는 점을 함께 기억해 두세요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">There is 구문(유도부사)\u003c/span> : There + be동사 + 주어 + [수식어] (주어가 ~이 있다/없다) : \"가능성은 전혀 없다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 of + 명사 (명사 뒤 수식)\u003c/span> : possibility [of + 명사] — 추상명사를 뒤에서 한정하는 전치사구 : \"인간의 실수의 (가능성)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">이유의 접속사 because + 부정어 no와 or\u003c/span> : 주절 + because + 주어 + 동사 (이유를 나타내는 부사절) : \"왜냐하면 조종사도 승무원도 기내에 없기 때문에\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"There is no possibility, 가능성은 전혀 없습니다. of human error, 인간이 실수할 가능성 말이죠. because there is no pilot or crew, 왜냐하면 조종사도 승무원도 없기 때문입니다. aboard, 기내에 탑승한 사람이 없기 때문이에요. 이 문장 전체를 해석하면, 기내에는 조종사나 승무원이 한 명도 탑승하지 않았기 때문에 사람이 실수할 가능성은 전혀 없습니다.","hl":"m"},{"n":22,"text":"이 문장은 기내 방송에서 승객을 안심시키는 대목이에요. 컴퓨터가 다 알아서 하니까 조종사도 승무원도 없고, 그래서 인간의 실수 가능성은 없다고 단정하는 겁니다. 그런데 이 단정이 뒤에서 모든 게 잘못되는 반전을 준비하는 장치라는 점, 꼭 기억해 두세요.","hl":"mn"},{"n":23,"text":"첫 번째, There is 구문부터 볼게요. there는 해석하지 않고 '무엇이 있다 없다'를 먼저 알려 주는 유도부사예요. 진짜 주어는 be동사 뒤에 있는 no possibility라는 점을 꼭 잡아 두세요. 두 번째, of human error는 앞의 possibility를 뒤에서 채워 주는 전치사구예요. 무엇의 가능성인지를 뒤에서 알려 주니까 명사 바로 뒤에 붙는다는 원리로 기억하세요. 세 번째, because는 이유를 이끄는 접속사예요. 뒤에 there is no pilot or crew가 와서 앞의 '가능성이 없다'에 대한 이유를 만들어 주고, no 뒤에서는 and가 아니라 or를 써서 '조종사도 승무원도 없다'가 된다는 것도 챙겨 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분에게 필요한 모든 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">All \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">needs\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">처리될 것입니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">taken \u003c/span>\u003cspan class=\"tgt\">care \u003c/span>\u003cspan class=\"tgt\">of\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가장 최신식 기술에 의해서요\u003c/span>\u003cspan class=\"en\">by \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">very \u003c/span>\u003cspan class=\"tgt\">latest \u003c/span>\u003cspan class=\"tgt\">technology\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여러분에게 필요한 모든 것은 최신식 기술로 처리될 것입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 승객이 걱정할 필요가 없다는 점을 기술의 힘으로 강조합니다. 필요한 것은 무엇이든 \u003cb class=\"key\">최신 \u003c/b>\u003cb class=\"key\">기술\u003c/b>이 알아서 처리한다는 말로 승객을 \u003cb class=\"key\">안심\u003c/b>시키는 것이죠. 앞에서 말한 '인간의 실수 없음'을 기술에 대한 신뢰로 다시 한번 뒷받침하는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">All of + 한정사 + 복수명사\u003c/span> : All of + the/소유격 + 복수명사 (…의 전부) : \"여러분에게 필요한 모든 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태 (조동사 will + be + 과거분사)\u003c/span> : 주어 + will + be + p.p. (+ by 행위자) / take care of → be taken care of : \"처리될 것입니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">최상급 강조의 very\u003c/span> : the + very + 최상급 + 명사 : \"가장 최신식의 기술\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"All of your needs, 여러분에게 필요한 모든 것은. will be taken care of, 처리될 것입니다. by the very latest technology, 가장 최신식 기술에 의해서요. 이 문장 전체를 해석하면, 여러분에게 필요한 모든 것은 최신식 기술로 처리될 것입니다.","hl":"m"},{"n":25,"text":"이 문장은 승객이 걱정할 필요가 없다는 걸 기술의 힘으로 강조해요. 필요한 건 뭐든 최신 기술이 알아서 처리한다는 말로 승객을 안심시키는 거죠. 앞에서 말한 인간의 실수가 없다는 주장을 기술에 대한 믿음으로 한 번 더 받쳐 주는 역할을 합니다.","hl":"mn"},{"n":26,"text":"첫 번째, will be taken care of는 수동태예요. 주어인 All of your needs가 처리하는 주체가 아니라 처리되는 대상이기 때문에 be동사 뒤에 과거분사가 오는 수동태를 씁니다. take care of처럼 동사와 전치사가 붙은 덩어리는 통째로 be taken care of로 바뀐다는 것도 기억하세요. 두 번째, All of your needs에서 All of는 전체를 나타내고 뒤에는 한정사가 붙은 복수명사가 옵니다. 세 번째, the very latest technology에서 very는 '매우'가 아니라 최상급을 강조해서 '가장 최신의'라는 뜻을 만드는 최상급 강조 표현이에요. 그리고 문장 끝의 by는 수동태에서 '누구에 의해서'라는 행위자를 알려 주는 역할을 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그냥 편히 쉬시고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Just \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">relax \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분의 비행을 즐기십시오\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">enjoy\u003c/span> your flight.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그냥 편히 비행을 즐기십시오.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 기내 방송의 마무리로, 승객에게 아무 걱정 말고 편하게 있으라고 권하는 말입니다. 짧은 \u003cb class=\"key\">명령문\u003c/b> 두 개를 이어 붙여 부드럽게 \u003cb class=\"key\">안심\u003c/b>시키는 것이죠. 그런데 안심시키는 이 말이 곧바로 뒤에서 무너지기 때문에 \u003cb class=\"key\">반어\u003c/b>의 효과가 커진다는 점도 눈여겨보세요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문 + 강조 부사 Just\u003c/span> : Just + 동사원형 (~하세요) : \"그냥 편히 쉬십시오\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동사원형 병렬 (and)\u003c/span> : 동사원형 + and + 동사원형 : \"쉬시고 즐기십시오\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Just relax, 그냥 편히 쉬시고. and enjoy your flight, 여러분의 비행을 즐기십시오. 이 문장 전체를 해석하면, 그냥 편히 비행을 즐기십시오.","hl":"m"},{"n":28,"text":"이 문장은 기내 방송의 마무리로, 승객에게 아무 걱정 말고 편하게 있으라고 권하는 말이에요. 짧은 명령문 두 개를 이어 붙여 부드럽게 안심시키는 거죠. 그런데 이렇게 안심시키는 말이 바로 뒤에서 무너지기 때문에 반어의 효과가 훨씬 커진다는 점도 눈여겨보세요.","hl":"mn"},{"n":29,"text":"첫 번째, Just relax에서 주어 없이 동사원형으로 시작했으니 명령문이에요. 여기에 Just를 붙이면 '그냥, 그저'라고 가볍게 권하는 강조 부사가 됩니다. 두 번째, relax and enjoy처럼 and로 두 동사를 이으면 뒤의 동사도 반드시 동사원형이어야 하는 병렬 구조예요. 두 동작을 하나로 묶어 '쉬면서 즐기라'는 하나의 명령으로 만들어 주죠. 그리고 이렇게 편안하라고 하는 말이 바로 뒤에서 비행기가 고장 나는 상황과 부딪히면서 반어가 완성된다는 것도 함께 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일어날 수 있는 모든 비상사태\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Every \u003c/span>\u003cspan class=\"tgt\">possible \u003c/span>\u003cspan class=\"tgt\">emergency\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">에 대한 대비가 되어 있으며,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">prepared \u003c/span>\u003cspan class=\"tgt\">for\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 어떤 것도\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">nothing \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">잘못될 수가 없습니다 …\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">possibly \u003c/span>\u003cspan class=\"tgt\">go \u003c/span>\u003cspan class=\"tgt\">wrong\u003c/span> ...\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">잘못될 수가 …\u003c/span>\u003cspan class=\"en\">go wrong ...\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">잘못될 수가 …\u003c/span>\u003cspan class=\"en\">go wrong ...&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">일어날 수 있는 모든 비상사태에 대한 대비가 되어 있으며, 어떤 것도 잘못될 수가 없습니다 … 잘못될 수가 … 잘못될 수가 …\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 모든 비상사태에 대비했고 아무 문제도 없을 것이라는 안내 방송의 장담을 담고 있어요. 하지만 go wrong이 기계적으로 반복되며 \u003cb class=\"key\">시스템 \u003c/b>\u003cb class=\"key\">오류\u003c/b>를 암시하고, 앞선 \u003cb class=\"key\">과장된 \u003c/b>\u003cb class=\"key\">확신\u003c/b>이 무너지는 \u003cb class=\"key\">아이러니\u003c/b>를 만들어요. 글의 결말에서 컴퓨터가 통제하는 비행의 불안을 드러내는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">every + 단수명사\u003c/span> : Every + [형용사] + [단수명사] : \"일어날 수 있는 모든 비상사태\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태(be+p.p.)와 전치사 for\u003c/span> : [주어] + is prepared for [be+p.p.+전치사] : \"에 대한 대비가 되어 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">부정대명사 nothing과 조동사 can\u003c/span> : nothing [부정대명사 주어] + can [조동사] + possibly [부사] + go wrong [동사원형] : \"어떤 것도 잘못될 수 없다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Every possible emergency, 일어날 수 있는 모든 비상사태. is prepared for, 에 대한 대비가 되어 있으며. and nothing, 그리고 어떤 것도. can possibly go wrong, 잘못될 수가 없습니다 …. go wrong, 잘못될 수가 …. go wrong, 잘못될 수가 …. 이 문장 전체를 해석하면, 일어날 수 있는 모든 비상사태에 대한 대비가 되어 있으며, 어떤 것도 잘못될 수가 없습니다 … 잘못될 수가 … 잘못될 수가 …","hl":"m"},{"n":31,"text":"이 문장은 모든 비상사태에 대비했고 아무 문제도 없을 것이라는 안내 방송의 장담을 담고 있어요. 하지만 go wrong이 기계적으로 반복되며 시스템 오류를 암시하고, 앞선 과장된 확신이 무너지는 아이러니를 만들어요. 글의 결말에서 컴퓨터가 통제하는 비행의 불안을 드러내는 역할을 합니다.","hl":"mn"},{"n":32,"text":"첫 번째로 Every possible emergency에서 every는 셀 수 있는 단수명사와 함께 쓰여 '모든'이라는 뜻을 만들어요. 그래서 emergency를 복수형으로 쓰지 않은 거죠. 두 번째로 is prepared for는 주어가 준비를 받는 대상이라서 수동태로 쓰였고, prepare for의 for가 전치사로 남아 있는 구조예요. 세 번째로 nothing can possibly go wrong에서 nothing은 부정대명사라서 '아무것도 없다'는 부정 의미를 만들고, can 뒤에는 동사원형 go가 오며 possibly는 '도저히, 결코'를 강조해요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>컴퓨터로만 조종되는 특별한 비행에서 안내 방송은 사람의 \u003cb class=\"key\">실수\u003c/b> 가능성이 전혀 없다고 장담한다.\u003c/li>\u003cli>승객의 모든 요구는 최신식 \u003cb class=\"key\">기술\u003c/b>이 처리하고 비상사태에도 대비가 되어 있다고 말한다.\u003c/li>\u003cli>그러나 마지막에 '잘못될 수가'라는 말이 \u003cb class=\"key\">반복\u003c/b>되며 컴퓨터의 \u003cb class=\"key\">오류\u003c/b> 가능성이 암시된다.\u003c/li>\u003cli>사람의 실수를 없앤 기술도 기계의 \u003cb class=\"key\">고장\u003c/b>에서는 자유롭지 않다는 아이러니를 보여 준다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The proud claim that a computer-controlled flight cannot go wrong is ironically undercut when the announcement keeps repeating &quot;go wrong.&quot;\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">조종사도 승무원도 없이 컴퓨터로만 조종되는 특별한 비행에서, 안내 방송은 사람의 \u003cb class=\"key\">실수\u003c/b> 가능성이 전혀 없다고 낙관적으로 장담합니다. 그러나 마지막에 '잘못될 수가'라는 말이 계속 반복되면서 최신 \u003cb class=\"key\">기술\u003c/b>의 오류 가능성이 암시됩니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":33,"text":"정리해 볼게요. 이 글은 컴퓨터가 모든 것을 처리하는 비행을 통해 사람의 실수를 없앤 기술도 완벽하지 않다는 점을 유쾌하게 보여 줘요. 낙관적인 안내 방송과 마지막의 반복이 만나 아이러니가 완성되죠. 오늘 지문에서 반복과 반전을 찾는 연습을 꼭 기억해 두세요. 수고 많았습니다, 다음 시간에 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
