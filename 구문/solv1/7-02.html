<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SO 레벨1 7강 적용독해02 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-sno{font-size:13px;color:#8493A1;font-weight:700;margin-bottom:8px}

.lp-chunk{display:flex;flex-direction:column}
.lp-chunk .ko{font-size:13px;color:var(--pk-t);font-weight:700;line-height:1.3;margin-bottom:2px}
.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}
.lp-top::before{height:5px;background:linear-gradient(90deg,var(--pk) 0,var(--pk) 80%,var(--am) 80%,var(--am) 100%)}
.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}
.lp-tag{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700;padding:2px 12px}
.lp-qn{flex:0 0 112px;height:112px;align-self:center;background:#fff;color:var(--pk);border:3px solid var(--pk);border-radius:50%;font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;font-size:26px}
.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}
.lp-qn .qt{display:block;white-space:nowrap;line-height:1.12;letter-spacing:-.02em}
.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}

.lp-st h4{color:var(--ink,#1B2733)}
.lp-st h4 i{border-radius:4px;width:auto;min-width:24px;padding:0 4px}
.lp-pill{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700}
.lp-chain span.c{background:#fff;border:1px solid #AEBBE6;border-radius:3px;font-weight:600}

.lp-vg em{background:#fff;border:1px solid var(--pk-b);border-radius:3px}
.lp-sa>div{border-radius:4px;border-color:var(--pk-b)}

.lp-chips .s{border:1px solid #AEBBE6;color:#3A4FA3}
.lp-chips .a{border:1px solid var(--am-b);color:var(--am-d);background:#FFFBF2}
.lp-sno .es{background:var(--am);border-radius:2px;font-weight:700}
.lp-chunk .en{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:600}
.lp-chunk+.lp-chunk{border-left:1px solid var(--pk-b)}
.lp .tgt{background:var(--am-l);border-bottom:2.5px dotted var(--am)}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"SO 레벨1 7강 적용독해02","audioDir":"7-02_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">7강\u003cbr>적용독해02\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">SO 레벨1\u003c/div>\u003ch1>Think Like a Child: The Birth of Disneyland\u003c/h1>\u003ch2>아이처럼 생각하기: 디즈니랜드의 탄생\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>많은 성공적인 사업가들의 공통된 특성은 다른 사람들과 다르게 생각한다는 것이다. 월트 디즈니는 \u003cb class=\"key\">아이처럼 \u003c/b>\u003cb class=\"key\">생각하기\u003c/b>를 결코 멈추지 않았고, 놀이공원에서 가족 전체를 위한 거대한 공원을 상상해 모든 아이디어를 \u003cb class=\"key\">머릿속\u003c/b>에서 만들어 냈으며, 그의 \u003cb class=\"key\">미래를 \u003c/b>\u003cb class=\"key\">상상하는 \u003c/b>\u003cb class=\"key\">능력\u003c/b>이 디즈니랜드의 탄생을 이끌어 냈다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Successful businesspeople think differently, and Walt Disney's childlike imagination and ability to picture the future led to the birth of Disneyland.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 성공한 사업가들의 공통된 사고방식과 디즈니랜드의 탄생 이야기예요. 많은 성공적인 사업가들은 다른 사람들과는 다르게 생각하고, 월트 디즈니는 아이처럼 생각하기를 결코 멈추지 않았다는 내용이죠. 요지는 남다른 상상력과 미래를 그리는 능력이 새로운 것을 만들어 낸다는 거예요. 그럼 차근차근 같이 읽어 볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">월트 디즈니(Walt Disney)는 미국의 애니메이션 제작자이자 기업가로, 미키 마우스(Mickey Mouse) 같은 캐릭터를 만들고 디즈니랜드(Disneyland)라는 테마파크(theme park)를 세운 인물이에요. 그가 디즈니랜드를 구상하던 시기에는 가족 전체가 함께 즐길 수 있는 공간이라는 개념이 거의 없었고, 놀이공원은 아이들이나 가는 곳이라는 인식이 강했어요. 그래서 그는 기존의 틀에서 아이디어를 가져오지 않고 자기 머릿속에서 새로 만들어 내야 했죠. 이 상황은 요리사가 레시피 없이 완전히 새로운 요리를 만들어 내는 것과 비슷해요. 이렇게 머릿속으로 미래의 모습을 그려 보는 힘을 \u003cb class=\"key\">상상력\u003c/b>(imagination)이라고 부르고, 이것이 \u003cb class=\"key\">창의적 \u003c/b>\u003cb class=\"key\">사고\u003c/b>(creative thinking)의 출발점이 된답니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 짚어 볼게요. Walt Disney는 미국의 애니메이션 제작자이자 기업가로, Mickey Mouse 같은 캐릭터를 만들고 Disneyland라는 테마파크를 세운 사람이에요. 그가 Disneyland를 구상하던 시기에는 가족 전체가 함께 즐길 수 있는 공간이라는 개념이 거의 없었어요. 놀이공원은 아이들이나 가는 곳이라는 인식이 강했거든요. 그래서 그는 기존의 틀에서 아이디어를 가져오지 않고 자기 머릿속에서 새로 만들어 내야 했어요. 이건 요리사가 레시피 없이 완전히 새로운 요리를 만들어 내는 상황과 비슷하죠. 이렇게 머릿속으로 미래의 모습을 그려 보는 힘을 imagination, 즉 상상력이라고 부르고, 이것이 창의적 사고의 출발점이 된답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>남다른 사고\u003csmall>도입·주장 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>글은 많은 성공적인 사업가들의 \u003cb class=\"key\">공통된 \u003c/b>\u003cb class=\"key\">특성\u003c/b>이 다른 모든 사람들과는 다르게 생각한다는 점이라고 밝혀요. 그리고 그 근거로 월트 디즈니가 \u003cb class=\"key\">아이처럼 \u003c/b>\u003cb class=\"key\">생각하기\u003c/b>를 결코 멈추지 않았다는 사례를 들어요. 주장을 먼저 던지고 예시로 넘어가는 \u003cb class=\"key\">두괄식\u003c/b> 흐름이에요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>상상력 발동\u003csmall>예시 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>디즈니는 자기 딸들을 회전목마를 태워 주기 위해 \u003cb class=\"key\">동네 \u003c/b>\u003cb class=\"key\">놀이공원\u003c/b>에 데려가기를 좋아했어요. 하루는 공원에 앉아 자녀들이 노는 것을 바라보다가 그의 \u003cb class=\"key\">상상력\u003c/b>이 발동하기 시작하죠. 평범한 나들이가 위대한 창조의 출발점이 된 거예요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>머릿속에서 시작\u003csmall>근거·구체화 · 문장 5–7\u003c/small>\u003c/h4>\u003cp>그는 단지 아이들뿐 아니라 \u003cb class=\"key\">가족 \u003c/b>\u003cb class=\"key\">전체\u003c/b>에게 즐거움을 주는 거대한 공원을 상상해 보았어요. 하지만 아이디어를 얻을 \u003cb class=\"key\">기존의 \u003c/b>\u003cb class=\"key\">장소\u003c/b>는 존재하지 않았죠. 그래서 세세한 부분까지 모든 아이디어를 그의 머릿속으로부터 생각해 내야 했어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>디즈니랜드 탄생\u003csmall>결론 · 문장 8\u003c/small>\u003c/h4>\u003cp>결국 그의 \u003cb class=\"key\">미래를 \u003c/b>\u003cb class=\"key\">상상하는 \u003c/b>\u003cb class=\"key\">능력\u003c/b>이 디즈니랜드의 탄생을 이끌어 낸 핵심 요소였다고 정리해요. 남다른 사고가 실제 결과물로 이어진다는 \u003cb class=\"key\">결론\u003c/b>이에요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 지문의 흐름을 따라가 볼게요.","hl":null},{"n":4,"text":"먼저 첫 번째 문장에서 많은 성공적인 사업가들의 공통된 특성은 다른 모든 사람들과는 다르게 생각한다는 점을 말해요. 이어서 두 번째 문장에서 월트 디즈니가 아이처럼 생각하기를 결코 멈추지 않았다는 사례를 꺼내죠. 주장을 먼저 던지고 예시로 넘어가는 아주 전형적인 두괄식 흐름이에요.","hl":"f0"},{"n":5,"text":"세 번째 문장부터는 구체적인 일화가 시작돼요. 디즈니는 자기 딸들을 회전목마를 태워 주려고 동네 놀이공원에 데려가기를 좋아했어요. 그리고 네 번째 문장에서 공원에 앉아 자녀들이 노는 것을 바라보다가 그의 상상력이 발동하기 시작했다고 하죠. 평범한 나들이가 위대한 창조의 출발점이 된 순간이에요.","hl":"f1"},{"n":6,"text":"다섯 번째 문장에서 그는 단지 아이들뿐 아니라 가족 전체에게 즐거움을 주는 거대한 공원을 상상해 보아요. 그런데 여섯 번째 문장을 보면 아이디어를 얻을 기존의 장소는 존재하지 않았대요. 그래서 일곱 번째 문장에서 세세한 부분까지 모든 아이디어를 그의 머릿속으로부터 생각해 내야 했다고 말하죠.","hl":"f2"},{"n":7,"text":"마지막 문장에서 그의 미래를 상상하는 능력이 디즈니랜드의 탄생을 이끌어 낸 핵심 요소였다고 정리해요. 결국 남다른 사고가 실제 결과물로 이어진다는 결론이에요. 여기서 the key factor라는 표현이 결론을 딱 표시해 주고 있죠.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거(예시)\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 번째 문장에서 성공한 사업가들의 \u003cb class=\"key\">공통된 \u003c/b>\u003cb class=\"key\">특성\u003c/b>을 먼저 제시하고, 곧바로 월트 디즈니라는 \u003cb class=\"key\">예시\u003c/b>를 들어요. 이후 그 예시의 구체적인 일화가 이어지고 마지막 문장에서 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">요소\u003c/b>로 다시 정리하죠. 주장이 글 앞부분에 놓여 있으므로 \u003cb class=\"key\">두괄식\u003c/b> 전개로 볼 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>for example (2)\u003c/b>\u003cspan>예시 제시\u003c/span>\u003cb>So (7)\u003c/b>\u003cspan>인과·결과\u003c/span>\u003cb>the key factor (8)\u003c/b>\u003cspan>결론 강조\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">don't think like everyone else\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">never stopped thinking like a child\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">his imagination began to work\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">imagine the details of the park\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">his ability to picture the future\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 주장과 예시로 짜인 전개 방식이에요. 첫 번째 문장에서 성공한 사업가들의 공통된 특성을 먼저 주장하고, 월트 디즈니라는 구체적인 인물을 예시로 세워요. 그리고 마지막 문장에서 다시 핵심 요소로 정리하기 때문에 주장이 앞에 놓이는 두괄식 구조라고 볼 수 있어요.","hl":"ty"},{"n":9,"text":"신호어를 짚어 볼게요. 두 번째 문장의 for example은 앞의 주장을 예시로 받아 주는 표지예요. 일곱 번째 문장의 So는 기존의 장소가 없었다는 사실이 머릿속에서 아이디어를 만들어 내야 했다는 결과로 이어진다는 걸 보여 주죠. 그리고 마지막 문장의 the key factor는 결론을 강조하는 표현이에요. 이렇게 예시와 인과와 결론의 신호를 따라가면 글의 뼈대가 그대로 보인답니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>common\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>공통된\u003c/span>\u003c/div>\u003cdiv>\u003cb>trait\u003c/b>\u003cem>명사\u003c/em>\u003cspan>특성, 특징\u003c/span>\u003c/div>\u003cdiv>\u003cb>successful\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>성공적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>businesspeople\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사업가들\u003c/span>\u003c/div>\u003cdiv>\u003cb>everyone else\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>다른 모든 사람들\u003c/span>\u003c/div>\u003cdiv>\u003cb>It is said that\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~라고 한다\u003c/span>\u003c/div>\u003cdiv>\u003cb>for example\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>예를 들면\u003c/span>\u003c/div>\u003cdiv>\u003cb>stop\u003c/b>\u003cem>동사\u003c/em>\u003cspan>멈추다\u003c/span>\u003c/div>\u003cdiv>\u003cb>local\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>동네의, 지역의\u003c/span>\u003c/div>\u003cdiv>\u003cb>amusement park\u003c/b>\u003cem>명사\u003c/em>\u003cspan>놀이공원\u003c/span>\u003c/div>\u003cdiv>\u003cb>ride\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(탈것을) 타다\u003c/span>\u003c/div>\u003cdiv>\u003cb>merry-go-round\u003c/b>\u003cem>명사\u003c/em>\u003cspan>회전목마\u003c/span>\u003c/div>\u003cdiv>\u003cb>while\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>~하는 동안\u003c/span>\u003c/div>\u003cdiv>\u003cb>watch\u003c/b>\u003cem>동사\u003c/em>\u003cspan>지켜보다, 바라보다\u003c/span>\u003c/div>\u003cdiv>\u003cb>imagination\u003c/b>\u003cem>명사\u003c/em>\u003cspan>상상력\u003c/span>\u003c/div>\u003cdiv>\u003cb>begin\u003c/b>\u003cem>동사\u003c/em>\u003cspan>시작하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>imagine\u003c/b>\u003cem>동사\u003c/em>\u003cspan>상상하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>create\u003c/b>\u003cem>동사\u003c/em>\u003cspan>창조하다, 만들어 내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>huge\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>거대한\u003c/span>\u003c/div>\u003cdiv>\u003cb>pleasure\u003c/b>\u003cem>명사\u003c/em>\u003cspan>즐거움\u003c/span>\u003c/div>\u003cdiv>\u003cb>whole\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>전체의\u003c/span>\u003c/div>\u003cdiv>\u003cb>existing\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>기존의, 현존하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>draw ideas from\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에서 아이디어를 얻다\u003c/span>\u003c/div>\u003cdiv>\u003cb>detail\u003c/b>\u003cem>명사\u003c/em>\u003cspan>세부 사항\u003c/span>\u003c/div>\u003cdiv>\u003cb>come up with\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>생각해 내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>ability\u003c/b>\u003cem>명사\u003c/em>\u003cspan>능력\u003c/span>\u003c/div>\u003cdiv>\u003cb>picture\u003c/b>\u003cem>동사\u003c/em>\u003cspan>머릿속에 그리다, 상상하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>key\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>핵심적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>factor\u003c/b>\u003cem>명사\u003c/em>\u003cspan>요소\u003c/span>\u003c/div>\u003cdiv>\u003cb>lead to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 이끌어 내다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"단어도 몇 개 짚어 볼게요. trait은 특성이라는 뜻이고, come up with는 생각해 내다는 뜻의 아주 중요한 숙어예요. picture는 보통 그림이라는 명사지만 여기서는 동사로 쓰여서 미래를 머릿속에 그려 보다는 의미가 돼요. lead to는 이끌어 내다, birth는 탄생이라는 뜻이니 함께 외워 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">trait\u003c/b>\u003cspan class=\"m\">특성\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">characteristic\u003c/span>\u003cspan class=\"s\">quality\u003c/span>\u003cspan class=\"s\">feature\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">imagine\u003c/b>\u003cspan class=\"m\">상상하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">envision\u003c/span>\u003cspan class=\"s\">picture\u003c/span>\u003cspan class=\"s\">conceive\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">huge\u003c/b>\u003cspan class=\"m\">거대한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">enormous\u003c/span>\u003cspan class=\"s\">massive\u003c/span>\u003cspan class=\"s\">gigantic\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">tiny\u003c/span>\u003cspan class=\"a\">small\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">pleasure\u003c/b>\u003cspan class=\"m\">즐거움\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">joy\u003c/span>\u003cspan class=\"s\">delight\u003c/span>\u003cspan class=\"s\">enjoyment\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">pain\u003c/span>\u003cspan class=\"a\">sorrow\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">ability\u003c/b>\u003cspan class=\"m\">능력\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">capability\u003c/span>\u003cspan class=\"s\">capacity\u003c/span>\u003cspan class=\"s\">skill\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">inability\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">key\u003c/b>\u003cspan class=\"m\">핵심적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">crucial\u003c/span>\u003cspan class=\"s\">essential\u003c/span>\u003cspan class=\"s\">vital\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">minor\u003c/span>\u003cspan class=\"a\">trivial\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">create\u003c/b>\u003cspan class=\"m\">창조하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">make\u003c/span>\u003cspan class=\"s\">produce\u003c/span>\u003cspan class=\"s\">generate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">destroy\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어로 정리해 볼게요. trait은 characteristic이나 quality로 바꿔 쓸 수 있어요. imagine은 envision, picture와 같은 뜻이고, huge는 enormous, massive로 대체할 수 있죠. pleasure는 joy, delight의 동의어이고 반의어로는 pain, sorrow가 있어요. ability는 capability, capacity로 바꿀 수 있고 반대말은 inability예요. key는 crucial, essential로 바꿔 쓸 수 있으니 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 가지 공통된 특성은\u003c/span>\u003cspan class=\"en\">One common trait\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 성공적인 사업가들의\u003c/span>\u003cspan class=\"en\">of many successful businesspeople\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이다\u003c/span>\u003cspan class=\"en\">is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 생각하지 않는다는 것\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003cspan class=\"tgt\">think \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 모든 사람들과는 다르게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">everyone \u003c/span>\u003cspan class=\"tgt\">else\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">많은 성공적인 사업가들의 한 가지 공통된 특성은 그들이 다른 모든 사람들과는 다르게 생각한다는 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글의 주제문으로, 많은 성공적인 사업가들이 공통으로 가진 \u003cb class=\"key\">공통된 \u003c/b>\u003cb class=\"key\">특성\u003c/b>을 제시합니다. 그 특성은 다른 사람들과 똑같이 생각하지 않고 \u003cb class=\"key\">다르게 \u003c/b>\u003cb class=\"key\">생각\u003c/b>한다는 것이에요. 뒤에 이어지는 월트 디즈니의 예시를 이해하는 기준점이 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절 that (보어절)\u003c/span> : 주어 + be동사 + [that + 주어 + 동사 ...] : \"그들이 다른 모든 사람들과는 다르게 생각한다는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 like의 양태 표현\u003c/span> : [동사] + like + [명사구] : \"다른 모든 사람들처럼\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"One common trait, 한 가지 공통된 특성은. of many successful businesspeople, 많은 성공적인 사업가들의. is, 이다. that they don't think, 그들이 생각하지 않는다는 것. like everyone else, 다른 모든 사람들과는 다르게. 이 문장 전체를 해석하면, 많은 성공적인 사업가들의 한 가지 공통된 특성은 그들이 다른 모든 사람들과는 다르게 생각한다는 것이다.","hl":"m"},{"n":13,"text":"이 문장은 글의 주제문으로, 많은 성공적인 사업가들의 공통된 특성이 무엇인지 제시하고 있어요. 그 특성은 다른 사람들과 똑같이 생각하지 않고 다르게 생각한다는 것이죠. 그래서 뒤에서 월트 디즈니의 예를 들며 이 공통된 특성을 구체적으로 보여 준다고 이해하면 됩니다.","hl":"mn"},{"n":14,"text":"먼저 that they don't think like everyone else에서 that은 is 뒤에서 주어의 보어 역할을 하는 절을 이끌어요. 그래서 그들이 다르게 생각한다는 것이라는 의미로 연결되죠. 그리고 like everyone else의 like는 좋아하다가 아니라 ~처럼이라는 뜻의 전치사예요. 이 표현들만 잡으면 문장 구조가 아주 선명해집니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~라고 한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">said \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들면 월트 디즈니는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> Walt Disney, for example,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">결코 멈추지 않았다\u003c/span>\u003cspan class=\"en\">never \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">stopped \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아이처럼 생각하는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">thinking\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">child\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">예를 들면 월트 디즈니는 아이처럼 생각하는 것을 결코 멈추지 않았다고 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞에서 말한 성공한 사업가의 공통된 특성을 월트 디즈니의 \u003cb class=\"key\">예시\u003c/b>로 보여 줍니다. 그가 아이처럼 생각하는 것을 멈추지 않았다는 점이 바로 \u003cb class=\"key\">다르게 \u003c/b>\u003cb class=\"key\">생각\u003c/b>의 구체적인 모습이에요. 다음 문장부터 이어지는 디즈니의 일화를 자연스럽게 예고합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">It is said that 관용구(수동태)\u003c/span> : It is said + [that + 주어 + 동사 ...] : \"~라고 한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">stop + 동명사\u003c/span> : stop + [동명사] : \"생각하는 것을 멈추다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 like\u003c/span> : like + [명사구] : \"아이처럼\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"It is said, ~라고 한다. that Walt Disney, for example, 예를 들면 월트 디즈니는. never stopped, 결코 멈추지 않았다. thinking like a child, 아이처럼 생각하는 것을. 이 문장 전체를 해석하면, 예를 들면 월트 디즈니는 아이처럼 생각하는 것을 결코 멈추지 않았다고 한다.","hl":"m"},{"n":16,"text":"이 문장은 앞에서 말한 성공한 사업가의 공통된 특성을 월트 디즈니의 예시로 보여 줘요. 디즈니가 아이처럼 생각하는 것을 멈추지 않았다는 점이 바로 다른 사람들과 다르게 생각한 모습이죠. 그래서 예시를 통해 글의 주제를 자연스럽게 이어 준다고 보면 됩니다.","hl":"mn"},{"n":17,"text":"먼저 It is said that은 수동태를 이용해 ~라고 한다는 뜻을 만드는 표현이에요. 여기서 It은 that절 내용을 받아 주는 형식 주어 역할을 하죠. 그다음 stopped thinking에서 stop 뒤에는 동명사가 와서 생각하는 것을 멈추다라는 뜻이 돼요. 마지막으로 like a child의 like는 ~처럼이라는 뜻의 전치사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 좋아했다\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">loved \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자기 딸들을 데려가기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">take\u003c/span> his daughters\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">동네 놀이공원에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">local \u003c/span>\u003cspan class=\"tgt\">amusement \u003c/span>\u003cspan class=\"tgt\">park\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">회전목마를 태워주기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">ride \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">merry-go-round\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 자기 딸들을 회전목마를 태워주기 위해 동네 놀이공원에 데려가기를 좋아했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 디즈니가 아이처럼 생각한 구체적인 장면을 보여 줍니다. 딸들을 동네 놀이공원에 데려가 회전목마를 태워 주는 일상이 이후 디즈니랜드 구상의 \u003cb class=\"key\">배경\u003c/b>이 됩니다. 그의 \u003cb class=\"key\">아이 \u003c/b>\u003cb class=\"key\">같은 \u003c/b>\u003cb class=\"key\">사고\u003c/b>가 실제 행동으로 드러나는 대목이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : love + [to + 동사원형] : \"~하기를 좋아하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 to의 도착점\u003c/span> : take + 목적어 + [to + 장소] : \"동네 놀이공원에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : [to + 동사원형] = ~하기 위해 : \"회전목마를 태워주기 위해\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"He loved, 그는 좋아했다. to take his daughters, 자기 딸들을 데려가기를. to the local amusement park, 동네 놀이공원에. to ride the merry-go-round, 회전목마를 태워주기 위해. 이 문장 전체를 해석하면, 그는 자기 딸들을 회전목마를 태워주기 위해 동네 놀이공원에 데려가기를 좋아했다.","hl":"m"},{"n":19,"text":"이 문장은 디즈니가 아이처럼 생각한 구체적인 장면을 보여 줘요. 딸들을 동네 놀이공원에 데려가 회전목마를 태워 주는 일상이 이후 디즈니랜드 구상의 배경이 된다는 점을 기억하면 됩니다. 그의 아이 같은 사고가 실제 행동으로 드러나는 대목이에요.","hl":"mn"},{"n":20,"text":"먼저 loved to take에서 to take는 love의 목적어로 쓰인 명사적 용법이에요. 그래서 데려가기를 좋아했다고 해석하죠. 그다음 to the local amusement park에서 to는 딸들을 데려가는 도착점을 나타내는 전치사예요. 마지막 to ride the merry-go-round는 데려간 목적을 설명하는 부사적 용법으로, 회전목마를 태워주기 위해라고 이해하면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어느 날,\u003c/span>\u003cspan class=\"en\">One day,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공원에 앉아 있는 동안에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">while \u003c/span>\u003cspan class=\"tgt\">sitting \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">park \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자녀들이 노는 것을 바라보다가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">watching \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">children \u003c/span>\u003cspan class=\"tgt\">play\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 상상력이\u003c/span>\u003cspan class=\"en\">his imagination\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">발동하기 시작했다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">began \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">work\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하루는 공원에 앉아 자녀들이 노는 것을 바라보다가 그의 상상력이 발동하기 시작했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 디즈니가 공원에서 아이들을 바라보던 순간 상상력이 움직이기 시작했다는 \u003cb class=\"key\">계기\u003c/b>를 보여 주는 문장이에요. while sitting은 '앉아 있는 동안'이라는 \u003cb class=\"key\">분사구문\u003c/b>이고, began to work는 '작동하기 시작했다', 즉 \u003cb class=\"key\">상상이 \u003c/b>\u003cb class=\"key\">시작되다\u003c/b>로 자연스럽게 풀면 됩니다. 이 장면이 뒤에 나오는 디즈니랜드 탄생으로 이어지는 흐름의 출발점이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">분사구문(while + 현재분사)\u003c/span> : while + [현재분사(~ing)] , [주절] → '~하는 동안' : \"공원에 앉아 자녀들이 노는 것을 바라보는 동안\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지각동사 + 목적어 + 원형부정사\u003c/span> : watch + [목적어] + [동사원형] → '~가 …하는 것을 보다' : \"자녀들이 노는 것을 바라보면서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사를 목적어로 취하는 동사\u003c/span> : begin + [to부정사] → '~하기 시작하다' : \"발동하기 시작했다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"One day, 어느 날. while sitting in the park, 공원에 앉아 있는 동안에. and watching his children play, 자녀들이 노는 것을 바라보다가. his imagination, 그의 상상력이. began to work, 발동하기 시작했다.. 이 문장 전체를 해석하면, 하루는 공원에 앉아 자녀들이 노는 것을 바라보다가 그의 상상력이 발동하기 시작했다.","hl":"m"},{"n":22,"text":"여기서는 '하루는'이라는 말로 장면이 시작되죠. 디즈니가 공원에 앉아 아이들을 바라보는 동안 그의 상상력이 움직이기 시작했다는 뜻이에요. 이 장면이 뒤에 나오는 디즈니랜드 탄생의 계기가 된다는 흐름을 기억해 두세요.","hl":"mn"},{"n":23,"text":"먼저 while sitting in the park에서 while 뒤에 주어 he와 be동사가 생략된 분사구문이 나와요. 여기서 의미상 주어가 주절의 his imagination이 아니라 앞 문장의 he라는 점을 꼭 기억하세요. 그다음 watching his children play는 지각동사 watch 뒤에 목적어와 동사원형이 온 구조로, 아이들이 노는 동작 전체를 본다는 뜻이에요. 마지막으로 began to work는 begin 뒤에 to부정사가 와서 '하기 시작했다'를 만드는 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 상상해보았다\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">imagined \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거대한 공원을 만드는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">creating\u003c/span> a huge park\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가족 전체에게 즐거움을 주기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">give \u003c/span>\u003cspan class=\"tgt\">pleasure \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">whole \u003c/span>\u003cspan class=\"tgt\">families\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단지 그들의 아이들에게만이 아니라.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">just \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">children\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 단지 아이들뿐 아니라 가족 전체에게 즐거움을 주는 거대한 공원을 만드는 것에 대해 상상해보았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 디즈니가 꿈꾼 공원이 어떤 공원이었는지 알려 주는 문장이에요. 아이들만이 아니라 가족 전체를 즐겁게 하려는 \u003cb class=\"key\">목적\u003c/b>이 담겨 있죠. 이 발상이 바로 '다른 사람들과 다르게 생각하기'라는 글 전체의 \u003cb class=\"key\">핵심\u003c/b>과 연결돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사를 목적어로 취하는 동사(imagine)\u003c/span> : imagine + [동명사(~ing)] → '~하는 것을 상상하다' : \"만드는 것을 상상해보았다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : [to부정사] → '~하기 위해' : \"가족 전체에게 즐거움을 주기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">병렬 구조(not just ~)\u003c/span> : [to whole families] , not just [to their children] → 대조를 이루는 병렬 : \"단지 그들의 아이들에게만이 아니라\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"He imagined, 그는 상상해보았다. creating a huge park, 거대한 공원을 만드는 것을. to give pleasure to whole families, 가족 전체에게 즐거움을 주기 위해. not just to their children, 단지 그들의 아이들에게만이 아니라.. 이 문장 전체를 해석하면, 그는 단지 아이들뿐 아니라 가족 전체에게 즐거움을 주는 거대한 공원을 만드는 것에 대해 상상해보았다.","hl":"m"},{"n":25,"text":"이 문장은 디즈니가 어떤 공원을 꿈꿨는지 알려 줘요. 아이들만이 아니라 가족 전체가 즐길 수 있는 공원을 상상했다는 점이 핵심이에요. 바로 이 발상이 남들과 다른 생각의 출발점이 된다는 흐름으로 읽어 두세요.","hl":"mn"},{"n":26,"text":"먼저 imagine은 동명사를 목적어로 취하는 동사라서 creating이 와야 해요. 여기에 to create를 쓰면 어색하다는 점을 기억하세요. 그다음 to give pleasure to whole families는 공원을 만드는 목적을 나타내는 to부정사의 부사적 용법이에요. 마지막으로 not just to their children은 앞의 to whole families와 짝을 이루면서 '아이들만이 아니라'라는 대조를 만드는 병렬 구조예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">존재하지 않았다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">were\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 기존의 장소도\u003c/span>\u003cspan class=\"en\">no existing \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">places \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아이디어를 얻을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">draw \u003c/span>\u003cspan class=\"tgt\">ideas \u003c/span>\u003cspan class=\"tgt\">from\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">아이디어를 얻을 기존의 장소는 존재하지 않았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 디즈니가 참고할 만한 기존 공원이 없었다는 사실을 전하는 문장이에요. 그래서 모든 것을 자기 머릿속에서 새로 만들어 내야 했다는 \u003cb class=\"key\">다음 \u003c/b>\u003cb class=\"key\">문장\u003c/b>으로 자연스럽게 이어지죠. '기존의'라는 existing이 글의 \u003cb class=\"key\">차별성\u003c/b>을 강조하는 열쇠말이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">there be 구문(유도부사)\u003c/span> : There + be동사 + [주어] → '~이 있다/없다' : \"존재하지 않았다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법 + 전치사 목적어\u003c/span> : [명사] + to부정사 → '~할 명사' (전치사 from의 목적어는 앞의 places) : \"아이디어를 얻을 장소\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"There were, 존재하지 않았다. no existing places, 어떤 기존의 장소도. to draw ideas from, 아이디어를 얻을. 이 문장 전체를 해석하면, 아이디어를 얻을 기존의 장소는 존재하지 않았다.","hl":"m"},{"n":28,"text":"이 문장은 디즈니가 참고할 만한 기존 공원이 없었다는 사실을 전해요. 그래서 모든 것을 자기 머릿속에서 새로 만들어 내야 했다는 다음 문장으로 이어지죠. 기존의라는 뜻의 existing이 이 글의 차별성을 강조하는 열쇠말이에요.","hl":"mn"},{"n":29,"text":"먼저 There were는 유도부사 there가 들어간 구문으로 '있었다, 없었다'를 표현해요. 여기서는 no가 붙어 '아무것도 없었다'는 부정의 뜻이 된다는 점을 확인하세요. 그다음 places to draw ideas from에서 to부정사가 앞의 places를 꾸며 주는 형용사적 용법으로 쓰였어요. 마지막에 남은 전치사 from은 원래 목적어가 앞의 places로 올라간 자국이라고 이해하면 쉬워요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서\u003c/span>\u003cspan class=\"en\">So\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그가 상상하기 시작했을 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">began \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">imagine \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 공원의 세세한 부분들을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">details \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">park\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 생각해 내야 했다\u003c/span>\u003cspan class=\"en\">he \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">come \u003c/span>\u003cspan class=\"tgt\">up \u003c/span>\u003cspan class=\"tgt\">with\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 아이디어를\u003c/span>\u003cspan class=\"en\">all of the ideas\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 머릿속으로부터\u003c/span>\u003cspan class=\"en\">from his mind.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그래서 그가 그 공원의 세세한 부분들을 상상하기 시작했을 때, 그는 모든 아이디어를 그의 머릿속으로부터 생각해 내야 했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 디즈니가 참고할 만한 \u003cb class=\"key\">기존\u003c/b> 장소를 찾지 못했기 때문에, 공원의 \u003cb class=\"key\">세부 \u003c/b>\u003cb class=\"key\">요소\u003c/b>를 전부 자기 \u003cb class=\"key\">머릿속\u003c/b>에서 길어 올려야 했음을 말해요. 바로 앞 문장의 no existing places와 자연스럽게 이어지면서, 다음 문장에서 디즈니랜드가 탄생하게 되는 \u003cb class=\"key\">원인\u003c/b>을 제시하는 역할을 하죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 when의 시간 부사절\u003c/span> : [when + 주어 + 동사 ~], 주어 + 동사 : \"그가 그 공원의 세세한 부분들을 상상하기 시작했을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : began + [to imagine (to부정사구/목적어)] : \"상상하기 시작했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 수식\u003c/span> : the details + [of the park (전치사구)] : \"그 공원의 세세한 부분들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">조동사 have to(의무)\u003c/span> : had to + [come up with (동사원형)] : \"생각해 내야 했다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"So, 그래서. when he began to imagine, 그가 상상하기 시작했을 때. the details of the park, 그 공원의 세세한 부분들을. he had to come up with, 그는 생각해 내야 했다. all of the ideas, 모든 아이디어를. from his mind, 그의 머릿속으로부터. 이 문장 전체를 해석하면, 그래서 그가 그 공원의 세세한 부분들을 상상하기 시작했을 때, 그는 모든 아이디어를 그의 머릿속으로부터 생각해 내야 했다.","hl":"m"},{"n":31,"text":"이 문장은 디즈니가 공원을 구상하기 시작한 상황을 설명해요. 참고할 만한 기존 장소가 없었기 때문에, 그는 공원의 세부 요소를 오직 자기 머릿속에서만 만들어 낼 수밖에 없었죠. 앞 문장의 There were no existing places to draw ideas from와 이어지면서, 뒤에 나올 디즈니랜드 탄생의 원인을 미리 깔아 주는 문장이에요.","hl":"mn"},{"n":32,"text":"첫 번째 어법 포인트는 접속사 when이에요. when은 시간을 나타내면서 뒤에 주어와 동사가 오는 부사절을 이끌고, 이 시간 부사절 전체가 언제 그 일이 일어났는지를 알려 줘요. 두 번째는 began to imagine인데, begin은 뒤에 to부정사를 목적어로 데려가는 동사라서 상상하기 시작했다는 뜻이 되죠. 세 번째는 had to come up with예요. have to는 의무를 나타내는 조동사 표현이고, 과거 이야기라서 과거형 had to가 되었으며 뒤에는 반드시 동사원형이 옵니다. 네 번째로 the details of the park에서 of the park는 앞의 명사를 꾸미는 전치사구이고, 이 명사구 전체가 imagine의 목적어 자리에 들어가 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 미래를 상상하는 능력은\u003c/span>\u003cspan class=\"en\">His \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">ability \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">picture \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">future\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">핵심 요소였다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">key \u003c/span>\u003cspan class=\"tgt\">factor\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">디즈니랜드의 탄생을 이끌어 낸\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">led \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">birth \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">Disneyland\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그의 미래를 상상하는 능력은 디즈니랜드의 탄생을 이끌어 낸 핵심 요소였다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글 전체를 \u003cb class=\"key\">요약\u003c/b>하는 \u003cb class=\"key\">결론\u003c/b> 문장이에요. 디즈니의 성공 요인을 '미래를 머릿속에 그려 보는 능력'으로 정리하며, 앞에서 말한 아이 같은 상상력이 결국 디즈니랜드를 만들었다는 흐름을 마무리하죠. 여기서 picture는 사진을 찍는다는 뜻이 아니라 '머릿속에 그리다'라는 \u003cb class=\"key\">비유적\u003c/b> 의미로 쓰였어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법(명사 수식)\u003c/span> : ability + [to picture the future (to부정사구 → ability 수식)] : \"미래를 상상하는 능력\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">2형식 문장(주어 + be동사 + 주격 보어)\u003c/span> : His ability(주어) + was(동사) + the key factor(주격 보어) : \"핵심 요소였다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : [선행사 the key factor] + that + [동사 led ~] : \"디즈니랜드의 탄생을 이끌어 낸\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">관용표현 lead to + 명사\u003c/span> : led + [to the birth of Disneyland (전치사구)] : \"디즈니랜드의 탄생을 이끌어 냈다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"His ability to picture the future, 그의 미래를 상상하는 능력은. was the key factor, 핵심 요소였다. that led to the birth of Disneyland, 디즈니랜드의 탄생을 이끌어 낸. 이 문장 전체를 해석하면, 그의 미래를 상상하는 능력은 디즈니랜드의 탄생을 이끌어 낸 핵심 요소였다.","hl":"m"},{"n":34,"text":"이 문장은 글 전체를 요약하는 결론 문장이에요. 디즈니의 성공 요인을 미래를 머릿속에 그려 보는 능력으로 정리하면서, 앞에서 이야기한 아이 같은 상상력이 결국 디즈니랜드를 만들었다는 흐름을 마무리하죠. 여기서 picture는 사진이 아니라 상상하다, 머릿속에 그리다는 비유적인 의미로 쓰였어요.","hl":"mn"},{"n":35,"text":"첫 번째 어법 포인트는 ability to picture the future예요. to picture the future는 앞의 명사 ability를 뒤에서 꾸며 주는 형용사적 용법의 to부정사이고, 명사 뒤에서 그 내용을 구체적으로 설명해 주죠. 두 번째로 was the key factor는 be동사 뒤에 주격 보어가 온 이 형식 구조예요. 세 번째, that은 앞의 the key factor를 받는 주격 관계대명사로, 관계대명사절 안에서 주어 역할을 하면서 동사 led를 이끌고 있어요. 네 번째, lead to는 결과로 이어진다는 관용표현이라서 뒤에 결과를 나타내는 명사구가 옵니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>많은 성공적인 사업가들의 \u003cb class=\"key\">공통된 \u003c/b>\u003cb class=\"key\">특성\u003c/b>은 다른 모든 사람들과는 다르게 생각한다는 것이다.\u003c/li>\u003cli>월트 디즈니는 \u003cb class=\"key\">아이처럼 \u003c/b>\u003cb class=\"key\">생각하기\u003c/b>를 결코 멈추지 않았고, 딸들과 놀이공원에 가서 상상력이 발동했다.\u003c/li>\u003cli>그는 단지 아이들뿐 아니라 가족 전체에게 즐거움을 주는 거대한 공원을 상상했지만, 아이디어를 얻을 \u003cb class=\"key\">기존의 \u003c/b>\u003cb class=\"key\">장소\u003c/b>가 없어 모든 것을 머릿속에서 생각해 내야 했다.\u003c/li>\u003cli>그의 \u003cb class=\"key\">미래를 \u003c/b>\u003cb class=\"key\">상상하는 \u003c/b>\u003cb class=\"key\">능력\u003c/b>이 디즈니랜드의 탄생을 이끌어 낸 핵심 요소였다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Successful businesspeople think differently, and Walt Disney's childlike imagination and ability to picture the future led to the birth of Disneyland.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">많은 성공적인 사업가들의 공통된 특성은 다른 사람들과 다르게 생각한다는 것이다. 월트 디즈니는 \u003cb class=\"key\">아이처럼 \u003c/b>\u003cb class=\"key\">생각하기\u003c/b>를 결코 멈추지 않았고, 놀이공원에서 가족 전체를 위한 거대한 공원을 상상해 모든 아이디어를 \u003cb class=\"key\">머릿속\u003c/b>에서 만들어 냈으며, 그의 \u003cb class=\"key\">미래를 \u003c/b>\u003cb class=\"key\">상상하는 \u003c/b>\u003cb class=\"key\">능력\u003c/b>이 디즈니랜드의 탄생을 이끌어 냈다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":36,"text":"오늘 글의 핵심은 아주 간단해요. 남들과 다르게 생각하고 아이처럼 상상하는 힘이 디즈니랜드를 만들었다는 거죠. 공통된 특성, 상상력, 미래를 그리는 능력이라는 세 가지만 붙잡아도 이 지문은 완벽하게 정리돼요. 여러분도 일상에서 본 것을 그냥 지나치지 말고 한 번 더 상상해 보세요. 오늘 수업도 여기까지예요, 수고했어요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
