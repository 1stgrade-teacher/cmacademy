<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SO 레벨1 4강 적용독해01 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}
.lp *{box-sizing:border-box}

.lp-top::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--pk),#7CCBC8)}

.lp-chips .a{background:#FFF1D8;color:#8A5A00}
.lp-chips .x{background:none;color:#999;padding:0}
.lp-sno{font-size:13px;color:#8493A1;font-weight:700;margin-bottom:8px}

.lp-chunks{display:flex;flex-wrap:wrap;gap:16px 10px;margin-bottom:12px;align-items:flex-end}
.lp-chunk{display:flex;flex-direction:column}
.lp-chunk .ko{font-size:13px;color:var(--pk-t);font-weight:700;line-height:1.3;margin-bottom:2px}
.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}
.lp-top::before{height:5px;background:linear-gradient(90deg,var(--pk) 0,var(--pk) 80%,var(--am) 80%,var(--am) 100%)}
.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}
.lp-tag{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700;padding:2px 12px}
.lp-qn{flex:0 0 112px;height:112px;align-self:center;background:#fff;color:var(--pk);border:3px solid var(--pk);border-radius:50%;font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;font-size:26px}
.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}
.lp-qn .qt{display:block;white-space:nowrap;line-height:1.12;letter-spacing:-.02em}
.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}
.lp-st{border-radius:4px;border-left:4px solid var(--pk-b)}
.lp-st h4{color:var(--ink,#1B2733)}
.lp-st h4 i{border-radius:4px;width:auto;min-width:24px;padding:0 4px}
.lp-pill{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700}
.lp-chain span.c{background:#fff;border:1px solid #AEBBE6;border-radius:3px;font-weight:600}
.lp-ct th{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif}
.lp-vg em{background:#fff;border:1px solid var(--pk-b);border-radius:3px}
.lp-sa>div{border-radius:4px;border-color:var(--pk-b)}
.lp-chips span{border-radius:3px;background:#fff}
.lp-chips .s{border:1px solid #AEBBE6;color:#3A4FA3}
.lp-chips .a{border:1px solid var(--am-b);color:var(--am-d);background:#FFFBF2}
.lp-sno .es{background:var(--am);border-radius:2px;font-weight:700}
.lp-chunk .en{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:600}
.lp-chunk+.lp-chunk{border-left:1px solid var(--pk-b)}
.lp .tgt{background:var(--am-l);border-bottom:2.5px dotted var(--am)}

.lp-ko{border-radius:0;border-left:4px solid var(--pk);background:none;padding:4px 0 4px 12px}
.lp-mn{border-radius:4px;background:var(--am-l);border-color:var(--am-b);color:#5C4510}
.lp-ap{border-radius:4px;border:1px solid var(--pk-b);border-top:3px solid var(--pk);background:var(--pk-ll)}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"SO 레벨1 4강 적용독해01","audioDir":"4-01_audio","preview":false,"count":33,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">4강\u003cbr>적용독해01\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">SO 레벨1\u003c/div>\u003ch1>Edison's Light Bulb: The Invention That Took Away Our Sleep\u003c/h1>\u003ch2>에디슨의 전구: 우리의 잠을 빼앗아 간 발명\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>발명왕 \u003cb class=\"key\">에디슨\u003c/b>은 잠을 좋아하는 사람들에 대한 저주로 \u003cb class=\"key\">전구\u003c/b>를 발명했고, 그 결과 오늘날 우리는 과거보다 하루 1시간 30분, 일 년에 총 \u003cb class=\"key\">547시간\u003c/b>을 덜 자게 되었다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Thomas Edison's invention of the light bulb reduced people's average sleep by one and a half hours a day.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 발명왕 에디슨과 우리의 잠에 관한 아주 흥미로운 이야기예요. 에디슨이 전구를 발명해서 우리가 잠을 덜 자게 되었다는, 조금은 도발적인 주장을 담고 있죠. 이 글의 요지는 전구라는 발명이 사람들의 평균 수면 시간을 하루에 한 시간 삼십 분씩 줄였다는 거예요. 그럼 차근차근 들어가 볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">수면 시간은 시대와 환경에 따라 크게 달라지는 사회적 지표예요. 전기가 없던 시절 사람들은 해가 지면 자연스럽게 잠자리에 들었고, 그래서 하루 평균 수면 시간이 지금보다 길었죠. 전구(light bulb)와 같은 인공 조명(artificial light)이 보급되면서 밤 시간은 활동 시간으로 바뀌었고, 이는 곧 수면 시간의 감소로 이어졌어요. 오늘날 스마트폰 화면의 블루라이트(blue light)가 잠을 미루게 만든다는 이야기도 같은 맥락이에요. 예를 들어 시험 기간에 형광등을 켜 두고 밤새 공부해 본 경험이 있다면, 빛이 사람의 잠을 얼마나 쉽게 밀어낼 수 있는지 바로 이해할 수 있을 거예요. 이 지문은 그 변화를 발명왕 \u003cb class=\"key\">에디슨\u003c/b>의 일화와 수면 시간 \u003cb class=\"key\">수치\u003c/b>로 보여 주고 있어요.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 조금 쌓아 볼게요. 에디슨은 천구백십삼 년 무렵 실용적인 전구를 보급한 발명가로 유명하죠. 그런데 전구가 밝혀 주는 빛은 단순히 어둠을 밝히는 것을 넘어서, 사람들이 밤에도 활동할 수 있게 만들어 주었어요. 그래서 전등이 보급되면서 사람들의 하루 일과와 수면 시간이 크게 바뀌었죠. 예를 들어 시험 기간에 형광등 아래에서 밤새 공부해 본 경험이 있다면, 빛이 잠을 미루게 만든다는 걸 바로 이해할 수 있을 거예요. 이 지문은 바로 그 변화를 수면 시간이라는 숫자로 보여 주고 있어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>잠을 빼앗은 발명왕\u003csmall>도입·주장 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>글은 발명왕 \u003cb class=\"key\">토머스 \u003c/b>\u003cb class=\"key\">에디슨\u003c/b>이 우리한테서 잠을 빼앗아 간 것에 대해 비난받을 수 있다는 도발적인 주장으로 시작해요. 그는 하루에 4시간씩만 자면서 잠꾸러기들을 \u003cb class=\"key\">경멸\u003c/b>했고, 하루 8시간 이상 자는 것은 잘못된 것이라고 \u003cb class=\"key\">믿었\u003c/b>어요. 짧은 세 문장 안에 에디슨의 수면 습관과 가치관이 모두 담겨 있죠.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>저주로 만든 전구\u003csmall>근거·예시 · 문장 4\u003c/small>\u003c/h4>\u003cp>자는 것을 좋아하는 사람들에 대한 \u003cb class=\"key\">저주\u003c/b>로 그는 텅스텐 전구를 발명했다는 문장이 이어져요. 여기서 전구는 단순한 발명품이 아니라 잠을 좋아하는 사람들을 \u003cb class=\"key\">벌\u003c/b>하려는 장치로 표현되어 있어요. 그래서 이 문장은 글의 \u003cb class=\"key\">주장\u003c/b>을 재미있게 뒷받침하는 근거가 돼요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>9시간 30분에서 8시간으로\u003csmall>비교·대조 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>1913년 그에 의해서 전구가 도입될 때까지 사람들은 대개 하루 평균 \u003cb class=\"key\">9시간 \u003c/b>\u003cb class=\"key\">30분\u003c/b>씩 잠을 잤어요. 그런데 오늘날 사람들은 평균 \u003cb class=\"key\">8시간\u003c/b>을 자고 있죠. 전구가 등장한 시점을 기준으로 수면 시간이 얼마나 줄었는지를 \u003cb class=\"key\">수치\u003c/b>로 보여 주는 대목이에요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>일 년에 547시간\u003csmall>결론 · 문장 7\u003c/small>\u003c/h4>\u003cp>마지막 문장은 우리가 하루 1시간 30분씩, 일 년에 총 \u003cb class=\"key\">547시간\u003c/b>을 어쩔 수 없이 덜 자고 있다고 정리해요. 앞에서 제시한 과거와 현재의 수면 시간 차이를 \u003cb class=\"key\">계산\u003c/b>해 결론으로 끌어낸 것이죠. 즉 전구라는 발명이 우리의 \u003cb class=\"key\">잠\u003c/b>을 실제로 줄였다는 주장이 여기서 완성돼요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 따라가 볼 텐데, 크게 네 단계로 나누어 볼 수 있어요.","hl":null},{"n":4,"text":"첫 단계는 첫 번째 문장부터 세 번째 문장까지예요. 글은 발명왕 토머스 에디슨이 우리한테서 잠을 빼앗아 간 것에 대해 비난받을 수 있다는 도발적인 주장으로 시작해요. 그는 하루에 네 시간씩만 자면서 잠꾸러기들을 경멸했고, 하루에 여덟 시간 이상 자는 것은 잘못된 것이라고 믿었어요. 짧은 세 문장 안에 에디슨의 수면 습관과 가치관이 모두 담겨 있죠.","hl":"f0"},{"n":5,"text":"두 번째 단계는 네 번째 문장 하나예요. 자는 것을 좋아하는 사람들에 대한 저주로 그는 텅스텐 전구를 발명했다는 내용이 나오죠. 여기서 전구는 단순한 발명품이 아니라 잠을 좋아하는 사람들을 벌하려는 장치로 표현되어 있어요. 그래서 이 문장이 글의 주장을 재미있게 뒷받침해 주는 근거가 되는 거예요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 다섯 번째와 여섯 번째 문장이에요. 천구백십삼 년 그에 의해서 전구가 도입될 때까지 사람들은 대개 하루 평균 구 시간 삼십 분씩 잠을 잤다고 해요. 그런데 오늘날 사람들은 평균 여덟 시간을 자고 있죠. 전구가 등장한 시점을 기준으로 수면 시간이 얼마나 줄었는지를 숫자로 보여 주는 대목이에요.","hl":"f2"},{"n":7,"text":"마지막 단계는 일곱 번째 문장이에요. 우리가 하루에 한 시간 삼십 분씩, 일 년에 총 오백사십칠 시간을 어쩔 수 없이 덜 자고 있다고 정리하죠. 앞에서 제시한 과거와 현재의 수면 시간 차이를 계산해서 결론으로 끌어낸 거예요. 이렇게 해서 전구라는 발명이 우리의 잠을 실제로 줄였다는 주장이 완성돼요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 첫 문장에서 에디슨이 우리의 \u003cb class=\"key\">잠\u003c/b>을 빼앗았다고 비난받을 수 있다는 \u003cb class=\"key\">주장\u003c/b>을 먼저 던지고, 뒤에서 그 근거를 차례로 늘어놓는 두괄식 구조예요. 2~3번 문장은 그의 수면 습관과 가치관이라는 근거를, 4번 문장은 전구 발명이라는 \u003cb class=\"key\">예시\u003c/b>를 제시하죠. 이어서 5~6번 문장이 과거와 현재의 수면 시간을 \u003cb class=\"key\">수치\u003c/b>로 비교하며 주장을 뒷받침하고, 7번 문장이 그 차이를 계산해 결론으로 마무리해요. 그래서 \u003cb class=\"key\">주제문\u003c/b>은 1번 문장이고 나머지는 모두 이를 떠받치는 근거라고 볼 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>could be blamed (1)\u003c/b>\u003cspan>글쓴이의 주장 제시\u003c/span>\u003cb>Until (5)\u003c/b>\u003cspan>과거와 현재를 가르는 시간적 기준\u003c/span>\u003cb>Today (6)\u003c/b>\u003cspan>과거와 현재의 대조\u003c/span>\u003cb>a total of (7)\u003c/b>\u003cspan>차이를 수치로 확정하는 결론\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">taking sleep away from us\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">looked down on sleepyheads\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a curse on those people who like to sleep\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">sleep one and a half hours less a day\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>발명왕 에디슨\u003c/th>\u003cth>일반 사람들\u003c/th>\u003c/tr>\u003ctr>\u003ctd>하루 4시간 수면\u003c/td>\u003ctd>하루 9시간 30분 수면\u003c/td>\u003c/tr>\u003ctr>\u003ctd>잠꾸러기를 경멸\u003c/td>\u003ctd>잠을 좋아함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>전구를 발명해 잠을 줄임\u003c/td>\u003ctd>전구 도입 후 8시간으로 감소\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 주장과 근거로 이루어진 두괄식 글이라고 볼 수 있어요. 첫 번째 문장에서 에디슨이 우리의 잠을 빼앗았다고 비난받을 수 있다는 주장을 먼저 던지고, 그다음에 그의 수면 습관과 전구 발명, 그리고 수면 시간의 변화라는 근거를 차례로 늘어놓죠. 그래서 주제문은 첫 번째 문장이고, 마지막 문장은 그 근거들을 숫자로 마무리하는 결론 역할을 해요.","hl":"ty"},{"n":9,"text":"신호어를 눈여겨보면 구조가 더 또렷해져요. 첫 번째 문장의 could be blamed라는 표현이 글쓴이의 주장을 먼저 던지는 신호가 되죠. 다섯 번째 문장의 Until은 과거와 현재를 가르는 시간적 기준을 만들어 주고, 여섯 번째 문장의 Today가 과거와 오늘을 정확히 대조시켜요. 그리고 마지막 문장의 a total of는 앞에서 말한 차이가 얼마나 큰지 수치로 확정해 주는 표현이에요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>king\u003c/b>\u003cem>명사\u003c/em>\u003cspan>왕\u003c/span>\u003c/div>\u003cdiv>\u003cb>inventor\u003c/b>\u003cem>명사\u003c/em>\u003cspan>발명가\u003c/span>\u003c/div>\u003cdiv>\u003cb>blame\u003c/b>\u003cem>동사\u003c/em>\u003cspan>비난하다, 탓하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>take away\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>빼앗다, 가져가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>sleep\u003c/b>\u003cem>동사\u003c/em>\u003cspan>자다\u003c/span>\u003c/div>\u003cdiv>\u003cb>look down on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>경멸하다, 얕보다\u003c/span>\u003c/div>\u003cdiv>\u003cb>sleepyhead\u003c/b>\u003cem>명사\u003c/em>\u003cspan>잠꾸러기\u003c/span>\u003c/div>\u003cdiv>\u003cb>believe\u003c/b>\u003cem>동사\u003c/em>\u003cspan>믿다, 생각하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>more than\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~보다 많은, ~이상\u003c/span>\u003c/div>\u003cdiv>\u003cb>wrong\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>잘못된, 틀린\u003c/span>\u003c/div>\u003cdiv>\u003cb>curse\u003c/b>\u003cem>명사\u003c/em>\u003cspan>저주\u003c/span>\u003c/div>\u003cdiv>\u003cb>invent\u003c/b>\u003cem>동사\u003c/em>\u003cspan>발명하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>tungsten\u003c/b>\u003cem>명사\u003c/em>\u003cspan>텅스텐\u003c/span>\u003c/div>\u003cdiv>\u003cb>light bulb\u003c/b>\u003cem>명사\u003c/em>\u003cspan>전구\u003c/span>\u003c/div>\u003cdiv>\u003cb>until\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~까지\u003c/span>\u003c/div>\u003cdiv>\u003cb>introduce\u003c/b>\u003cem>동사\u003c/em>\u003cspan>도입하다, 소개하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>usually\u003c/b>\u003cem>부사\u003c/em>\u003cspan>대개, 보통\u003c/span>\u003c/div>\u003cdiv>\u003cb>average\u003c/b>\u003cem>명사\u003c/em>\u003cspan>평균\u003c/span>\u003c/div>\u003cdiv>\u003cb>today\u003c/b>\u003cem>부사\u003c/em>\u003cspan>오늘날\u003c/span>\u003c/div>\u003cdiv>\u003cb>force\u003c/b>\u003cem>동사\u003c/em>\u003cspan>강요하다, 억지로 하게 만들다\u003c/span>\u003c/div>\u003cdiv>\u003cb>total\u003c/b>\u003cem>명사\u003c/em>\u003cspan>총계, 합계\u003c/span>\u003c/div>\u003cdiv>\u003cb>less\u003c/b>\u003cem>부사\u003c/em>\u003cspan>더 적게\u003c/span>\u003c/div>\u003cdiv>\u003cb>a day\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>하루에\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어 몇 개만 짚고 갈게요. look down on은 경멸하다, 얕보다라는 뜻이고, curse는 저주라는 명사예요. introduce는 여기서 소개하다가 아니라 도입하다라는 뜻으로 쓰였고, force는 어쩔 수 없이 하게 만들다, 강요하다는 의미죠.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">blame\u003c/b>\u003cspan class=\"m\">비난하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">criticize\u003c/span>\u003cspan class=\"s\">condemn\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">praise\u003c/span>\u003cspan class=\"a\">compliment\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">look down on\u003c/b>\u003cspan class=\"m\">경멸하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">despise\u003c/span>\u003cspan class=\"s\">disdain\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">respect\u003c/span>\u003cspan class=\"a\">admire\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">believe\u003c/b>\u003cspan class=\"m\">믿다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">think\u003c/span>\u003cspan class=\"s\">consider\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">doubt\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">wrong\u003c/b>\u003cspan class=\"m\">잘못된\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">incorrect\u003c/span>\u003cspan class=\"s\">mistaken\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">right\u003c/span>\u003cspan class=\"a\">correct\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">invent\u003c/b>\u003cspan class=\"m\">발명하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">create\u003c/span>\u003cspan class=\"s\">devise\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">imitate\u003c/span>\u003cspan class=\"a\">copy\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">average\u003c/b>\u003cspan class=\"m\">평균의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">typical\u003c/span>\u003cspan class=\"s\">ordinary\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">exceptional\u003c/span>\u003cspan class=\"a\">unusual\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">force\u003c/b>\u003cspan class=\"m\">강요하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">compel\u003c/span>\u003cspan class=\"s\">oblige\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">allow\u003c/span>\u003cspan class=\"a\">permit\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 함께 정리해 볼게요. blame은 criticize나 condemn과 비슷하고, 반대말은 praise나 compliment예요. look down on은 despise, disdain과 가깝고, 반대는 respect나 admire죠. believe는 think, consider로 바꿔 쓸 수 있고, doubt가 반대말이에요. force는 compel, oblige와 같은 뜻이고, allow나 permit이 반대편에 있어요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">토머스 에디슨은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Thomas \u003c/span>\u003cspan class=\"tgt\">Edison, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">발명왕인\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">king \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">inventors,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">비난받을 수 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">could \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">blamed\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">잠을 빼앗아 간 것에 대해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">taking \u003c/span>\u003cspan class=\"tgt\">sleep \u003c/span>\u003cspan class=\"tgt\">away \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리한테서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">us\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">발명왕인 토머스 에디슨은 우리한테서 잠을 빼앗아 간 것에 대해 비난받을 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글의 \u003cb class=\"key\">화제\u003c/b>를 여는 첫 문장으로, 발명왕 에디슨을 잠 부족의 원흉으로 지목하며 흥미를 유발해요. 콤마 사이의 the king of inventors는 Thomas Edison을 풀어 주는 \u003cb class=\"key\">동격\u003c/b> 표현이라 앞뒤가 같은 대상을 가리켜요. be blamed for는 '~에 대해 비난받다'라는 \u003cb class=\"key\">수동\u003c/b> 표현이고, for 뒤에는 taking이라는 동명사가 와서 '잠을 빼앗는 행위' 자체를 가리켜요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동격(콤마 동격)\u003c/span> : [고유명사], [관사+명사], → 앞 명사를 뒤 표현이 부연 : \"토머스 에디슨, 즉 발명왕은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사가 있는 수동태\u003c/span> : [조동사 could] + [be + 과거분사 blamed] : \"비난받을 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 for + 동명사(이유)\u003c/span> : blame A for [동명사구] → A를 ~한 일로 비난하다 : \"우리한테서 잠을 빼앗아 간 것에 대해\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Thomas Edison, 토머스 에디슨은. the king of inventors, 발명왕인. could be blamed, 비난받을 수 있다. for taking sleep away, 잠을 빼앗아 간 것에 대해. from us, 우리한테서. 이 문장 전체를 해석하면, 발명왕인 토머스 에디슨은 우리한테서 잠을 빼앗아 간 것에 대해 비난받을 수 있다.","hl":"m"},{"n":13,"text":"첫 번째 문장은 글의 화제를 던지는 문장이에요. 발명왕 에디슨을 우리의 잠을 빼앗아 간 장본인으로 지목하면서 이야기를 시작하죠. 여기서 the king of inventors는 에디슨을 그대로 풀어 주는 동격 표현이라는 점만 잡아 두면 문장이 아주 단순해져요.","hl":"mn"},{"n":14,"text":"첫 번째로 Thomas Edison 뒤의 콤마 묶음을 보세요. the king of inventors가 앞의 이름과 같은 사람을 가리키는 동격이에요. 두 번째로 could be blamed는 주어가 비난을 받는 쪽이라는 걸 보여 주는 수동태예요. 세 번째로 for 뒤에 taking이 온 것, 전치사 뒤에는 동명사가 온다는 원리예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 잤다\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">slept \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하루에 4시간씩\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">four \u003c/span>\u003cspan class=\"tgt\">hours \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">day \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 경멸했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">looked \u003c/span>\u003cspan class=\"tgt\">down \u003c/span>\u003cspan class=\"tgt\">on\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">잠꾸러기들을\u003c/span>\u003cspan class=\"en\">sleepyheads.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 하루에 4 시간씩 잤고, 잠꾸러기들을 경멸했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 에디슨을 지목한 데 이어, 그의 \u003cb class=\"key\">수면 \u003c/b>\u003cb class=\"key\">습관\u003c/b>과 태도를 구체적으로 보여 주는 문장이에요. 하루 네 시간만 자는 극단적인 습관과 잠꾸러기를 얕보는 \u003cb class=\"key\">태도\u003c/b>가 나란히 제시되면서, 뒤에 나올 그의 신념으로 자연스럽게 이어져요. look down on은 '~을 깔보다, 경멸하다'라는 \u003cb class=\"key\">숙어\u003c/b>예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">등위접속사 and에 의한 동사 병렬\u003c/span> : [주어] + [동사1 과거] and [동사2 과거] : \"잤고 … 경멸했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">구동사(동사+부사+전치사)\u003c/span> : look down on + [목적어] → ~을 얕보다 : \"경멸했다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"He slept, 그는 잤다. four hours a day, 하루에 4시간씩. and looked down on, 그리고 경멸했다. sleepyheads, 잠꾸러기들을. 이 문장 전체를 해석하면, 그는 하루에 4 시간씩 잤고, 잠꾸러기들을 경멸했다.","hl":"m"},{"n":16,"text":"두 번째 문장은 에디슨이 실제로 얼마나 잤는지, 그리고 잠을 좋아하는 사람들을 어떻게 봤는지를 보여 줘요. 하루 네 시간이라는 극단적인 습관과 잠꾸러기를 얕보는 태도가 한 문장 안에 나란히 놓여 있죠. 이 태도가 바로 다음 문장의 신념으로 이어져요.","hl":"mn"},{"n":17,"text":"첫 번째로 and 앞뒤의 slept와 looked down on을 보세요. 주어 He를 함께 쓰면서 시제를 똑같이 맞춘 동사 병렬 구조예요. 두 번째로 look down on은 세 단어가 합쳐져 하나의 뜻을 만드는 숙어로, 뒤에 목적어 sleepyheads가 붙어 완성된다는 점을 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 믿었다\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">believed \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~라고, 잠자는 것이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">sleeping \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하루에 8시간 이상\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">eight \u003c/span>\u003cspan class=\"tgt\">hours \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">day \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">잘못된 것이라고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">wrong\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 하루에 8 시간 이상 자는 것은 잘못된 것이라고 믿었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 에디슨의 \u003cb class=\"key\">신념\u003c/b>을 that절로 풀어 보여 주는 문장이에요. 잠을 많이 자는 것을 도덕적으로 '틀렸다'고까지 단정하는 강한 태도가 드러나죠. that절 안에서는 동명사 sleeping이 \u003cb class=\"key\">주어\u003c/b> 역할을 하고, more than이 '~이상'이라는 \u003cb class=\"key\">비교\u003c/b> 표현으로 수면 시간의 기준을 제시해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 명사절(목적어)\u003c/span> : believe + [that + 주어 + 동사] → ~라고 믿다 : \"하루에 8시간 이상 자는 것은 잘못이라고 믿었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사구 주어\u003c/span> : [동명사 sleeping + 수식어] + [동사 was] → ~하는 것은 : \"하루에 8시간 이상 자는 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">비교 표현 more than\u003c/span> : more than + [수량] → ~보다 많은, 즉 ~이상 : \"하루에 8시간 이상\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"He believed, 그는 믿었다. that sleeping, ~라고, 잠자는 것이. more than eight hours a day, 하루에 8시간 이상. was wrong, 잘못된 것이라고. 이 문장 전체를 해석하면, 그는 하루에 8 시간 이상 자는 것은 잘못된 것이라고 믿었다.","hl":"m"},{"n":19,"text":"세 번째 문장은 에디슨이 어떤 신념을 가졌는지 알려 줘요. 잠을 많이 자는 걸 단순히 게으름이 아니라 잘못된 일이라고 단정했다는 점이 핵심이에요. 이렇게 잠을 깎아내리는 태도가 뒤에서 그가 전구를 발명한 이유로 연결돼요.","hl":"mn"},{"n":20,"text":"첫 번째로 believed 뒤의 that을 보세요. 뒤에 완전한 절이 통째로 목적어로 들어가는 명사절 접속사예요. 두 번째로 that절 안의 sleeping은 동사 sleep이 동명사로 바뀌어 주어 자리에 앉은 것이고, 그래서 뒤에 was가 온다는 점을 짚어 주세요. 세 번째로 more than은 수량 앞에서 '이상'이라는 비교의 뜻을 만든다는 것도 함께 기억해 두면 좋아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저주로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">As \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">curse \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저런 사람들에 대한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">those \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자는 것을 좋아하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">sleep\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 발명했다\u003c/span>\u003cspan class=\"en\">he invented\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">텅스텐 전구를\u003c/span>\u003cspan class=\"en\">the tungsten light bulb.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">자는 것을 좋아하는 사람들에 대한 저주로 그는 텅스텐 전구를 발명했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 에디슨이 전구를 만든 이유를 \u003cb class=\"key\">저주\u003c/b>라는 과장된 비유로 표현한 문장이에요. 잠을 좋아하는 사람들을 괴롭히려고 일부러 밤을 밝히는 전구를 만들었다는 뜻이죠. 앞 문장에서 그를 '잠을 빼앗은 장본인'으로 소개한 흐름을 \u003cb class=\"key\">비유\u003c/b>로 이어 주는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 as(~로서, ~로)\u003c/span> : As + [명사(구)] : '~로서, ~로' : \"저런 사람들에 대한 저주로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관계대명사 who(주격)\u003c/span> : [선행사 people] + who + [동사] : '~하는 사람들' : \"자는 것을 좋아하는 사람들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : like + [to sleep (to부정사/목적어)] : \"자는 것\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"As a curse, 저주로. on those people, 저런 사람들에 대한. who like to sleep, 자는 것을 좋아하는. he invented, 그는 발명했다. the tungsten light bulb, 텅스텐 전구를. 이 문장 전체를 해석하면, 자는 것을 좋아하는 사람들에 대한 저주로 그는 텅스텐 전구를 발명했다.","hl":"m"},{"n":22,"text":"이 문장은 에디슨이 전구를 만든 이유를 저주라는 과장된 비유로 표현하고 있어요. 잠을 좋아하는 사람들을 일부러 괴롭히려고 밤을 밝히는 전구를 발명했다는 뜻이죠. 바로 앞 문장에서 그를 잠을 빼앗은 장본인으로 소개한 흐름을 자연스럽게 이어 주는 문장입니다.","hl":"mn"},{"n":23,"text":"먼저 as는 여기서 로서라는 뜻의 전치사로 쓰여서 발명의 목적을 나타내요. 두 번째로 those people 뒤의 who는 주격 관계대명사로, 자는 것을 좋아하는 사람들을 꾸며 줍니다. 그리고 like 뒤의 to sleep은 목적어로 쓰인 to부정사라서 자는 것이라고 해석하면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전구가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Until \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">light \u003c/span>\u003cspan class=\"tgt\">bulb \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그에 의해서 도입되었을 때까지는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">introduced \u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">him \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1913년에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">1913\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들은 대개 잤다\u003c/span>\u003cspan class=\"en\">people usually \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">slept \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">평균 9시간 30분을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">average \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">nine \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">half \u003c/span>\u003cspan class=\"tgt\">hours\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하루에\u003c/span>\u003cspan class=\"en\">a day.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">1913 년 그에 의해서 전구가 도입될 때까지, 사람들은 대개 하루 평균 9 시간 30 분씩 잠을 잤다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 전구가 보급되기 전과 후의 수면 시간을 \u003cb class=\"key\">대조\u003c/b>하기 위해 과거의 기준을 먼저 제시하는 문장이에요. 1913년 이전에는 하루 평균 9시간 30분을 잤다는 \u003cb class=\"key\">과거 \u003c/b>\u003cb class=\"key\">사실\u003c/b>을 보여 주죠. 이 값이 뒤에 나오는 오늘날 8시간과 비교되는 \u003cb class=\"key\">기준\u003c/b>이 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간 부사절 접속사 Until\u003c/span> : Until + [주어 + 동사] , [주절] : '~할 때까지' : \"1913년 그에 의해서 전구가 도입될 때까지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태(be + p.p. + by)\u003c/span> : [주어] + be동사 + [[p.p.]] + by + [행위자] : \"그에 의해서 도입되었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">시간의 양을 나타내는 부사적 목적어\u003c/span> : [자동사 slept] + [an average of nine and a half hours] : \"평균 9시간 30분을 잤다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Until the light bulb, 전구가. was introduced by him, 그에 의해서 도입되었을 때까지는. in 1913, 1913년에. people usually slept, 사람들은 대개 잤다. an average of nine and a half hours, 평균 9시간 30분을. a day, 하루에. 이 문장 전체를 해석하면, 1913 년 그에 의해서 전구가 도입될 때까지, 사람들은 대개 하루 평균 9 시간 30 분씩 잠을 잤다.","hl":"m"},{"n":25,"text":"이 문장은 전구가 보급되기 전과 후의 수면 시간을 대조하려고 과거의 기준을 먼저 깔아 주고 있어요. 천구백십삼 년 이전에는 하루 평균 아홉 시간 삼십 분을 잤다는 과거 사실을 보여 주는 거죠. 이 값이 바로 뒤에 나오는 오늘날 여덟 시간과 비교되는 기준이 됩니다.","hl":"mn"},{"n":26,"text":"먼저 until 뒤에는 주어와 동사를 갖춘 절이 와서 언제까지라는 시간의 범위를 정해 준다고 설명드렸죠. 두 번째로 was introduced by him은 수동태로, 능동태에서 목적어였던 the light bulb가 주어 자리로 올라온 형태예요. 세 번째로 slept 뒤의 an average of nine and a half hours는 자동사 sleep이 받는 시간의 양 표현이라서 평균 아홉 시간 삼십 분을 잤다고 해석합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오늘날\u003c/span>\u003cspan class=\"en\">Today,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들은 잔다\u003c/span>\u003cspan class=\"en\">people \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">sleep \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">8시간을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">eight \u003c/span>\u003cspan class=\"tgt\">hours\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">평균적으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">average\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">오늘날 사람들은 평균 8 시간을 잔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 과거 수면 시간과 \u003cb class=\"key\">비교\u003c/b>되는 현재의 모습을 보여 주는 문장이에요. 하루 평균 8시간으로 줄었다는 \u003cb class=\"key\">현재 \u003c/b>\u003cb class=\"key\">사실\u003c/b>을 제시하죠. 이 값 덕분에 다음 문장에서 '1시간 30분이나 줄었다'는 \u003cb class=\"key\">손실\u003c/b>을 계산할 수 있게 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간의 양을 나타내는 부사적 목적어\u003c/span> : [자동사 sleep] + [eight hours] : \"8시간을 자다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 관용표현 on average\u003c/span> : on average : '평균적으로' : \"평균적으로\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Today, 오늘날. people sleep, 사람들은 잔다. eight hours, 8시간을. on average, 평균적으로. 이 문장 전체를 해석하면, 오늘날 사람들은 평균 8 시간을 잔다.","hl":"m"},{"n":28,"text":"이 문장은 앞에서 본 과거의 수면 시간과 비교해서 오늘날의 모습을 보여 주고 있어요. 하루 평균 여덟 시간으로 줄었다는 현재 사실을 제시하는 거죠. 그래서 다음 문장에서 한 시간 삼십 분이나 줄었다는 계산이 자연스럽게 이어집니다.","hl":"mn"},{"n":29,"text":"먼저 sleep은 자동사지만 여덟 시간이라는 시간의 양을 목적어처럼 받을 수 있어요. 두 번째로 on average는 평균적으로라는 뜻의 부사구이고, in average가 아니라 on average라는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 어쩔 수 없이 강요당하고 있다\u003c/span>\u003cspan class=\"en\">We \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">being \u003c/span>\u003cspan class=\"tgt\">forced\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">sleep\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1시간 30분 덜\u003c/span>\u003cspan class=\"en\">one and a half hours \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">less\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하루에\u003c/span>\u003cspan class=\"en\">a day,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">총 547시간\u003c/span>\u003cspan class=\"en\">a total of 547 hours\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일 년에\u003c/span>\u003cspan class=\"en\">a year.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 하루 1 시간 30 분씩 일 년에 총 547 시간을 어쩔 수 없이 덜 자고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 현대인이 하루에 얼마나 덜 자게 되었는지를 숫자로 정리하는 \u003cb class=\"key\">결론\u003c/b> 문장이에요. are being forced는 '어쩔 수 없이 강요당하고 있다'는 \u003cb class=\"key\">수동태\u003c/b> 표현으로, 수면 감소가 개인의 선택이 아니라 사회적 압력의 결과임을 보여 줘요. 하루 한 시간 반의 차이가 일 년 총 오백 사십칠 시간이라는 큰 손실로 이어진다는 점을 \u003cb class=\"key\">비교급\u003c/b> less와 a total of로 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재진행 수동태\u003c/span> : 주어 + be동사 + being + 과거분사 (+ by 행위자) : \"어쩔 수 없이 강요당하고 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 보어 역할\u003c/span> : be forced + to + 동사원형 : \"자도록\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">비교급 부사\u003c/span> : less + 수량 표현 = 더 적게, 덜 : \"덜, 더 적게\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"We are being forced, 우리는 어쩔 수 없이 강요당하고 있다. to sleep, 자도록. one and a half hours less, 1시간 30분 덜. a day, 하루에. a total of 547 hours, 총 547시간. a year, 일 년에. 이 문장 전체를 해석하면, 우리는 하루 1 시간 30 분씩 일 년에 총 547 시간을 어쩔 수 없이 덜 자고 있다.","hl":"m"},{"n":31,"text":"이 문장은 현대인의 수면 부족을 숫자로 정리하는 결론 문장이에요. are being forced는 어쩔 수 없이 강요당하고 있다는 수동태 표현이고, less는 비교급으로 하루에 한 시간 반씩 덜 자는 상황을 보여 줘요. 그 차이가 일 년 동안 총 오백 사십칠 시간이라는 큰 손실로 이어진다는 뜻입니다.","hl":"mn"},{"n":32,"text":"첫 번째, are being forced는 진행 중인 수동태예요. be being 과거분사 형태로 강요당하고 있는 중이라는 뜻을 만들어요. 두 번째, to sleep은 to부정사로 be forced to do 형태에서 자도록이라는 보어 역할을 해요. 세 번째, less는 비교급 표현으로 더 적게, 덜이라는 뜻을 더해 줍니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>발명왕 \u003cb class=\"key\">에디슨\u003c/b>은 우리한테서 잠을 빼앗아 간 것에 대해 비난받을 수 있는 인물로 소개된다.\u003c/li>\u003cli>그는 하루 4시간만 자고 잠꾸러기들을 \u003cb class=\"key\">경멸\u003c/b>했으며, 하루 8시간 이상 자는 것은 잘못이라고 믿었다.\u003c/li>\u003cli>자는 것을 좋아하는 사람들에 대한 \u003cb class=\"key\">저주\u003c/b>로 그는 텅스텐 전구를 발명했다.\u003c/li>\u003cli>전구가 도입되기 전 사람들은 하루 평균 9시간 30분을 잤지만 오늘날에는 8시간을 자, 우리는 일 년에 총 \u003cb class=\"key\">547시간\u003c/b>을 덜 자고 있다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Thomas Edison's invention of the light bulb reduced people's average sleep by one and a half hours a day.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">발명왕 \u003cb class=\"key\">에디슨\u003c/b>은 잠을 좋아하는 사람들에 대한 저주로 \u003cb class=\"key\">전구\u003c/b>를 발명했고, 그 결과 오늘날 우리는 과거보다 하루 1시간 30분, 일 년에 총 \u003cb class=\"key\">547시간\u003c/b>을 덜 자게 되었다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":33,"text":"오늘 글은 에디슨이라는 한 발명가의 선택이 우리 모두의 잠을 바꾸었다는 이야기였어요. 주장이 먼저 나오고 근거와 수치가 뒤따르는 두괄식 구조, 그리고 과거와 현재를 대조하는 신호어를 꼭 기억해 두세요. 다음에 비슷한 글을 만나면 숫자와 대조 표현부터 찾아보면 훨씬 빨리 읽을 수 있을 거예요. 오늘도 수고 많았어요, 다음 시간에 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
