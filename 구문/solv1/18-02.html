<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SO 레벨1 18강 적용독해02 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-sno{font-size:13px;color:#8493A1;font-weight:700;margin-bottom:8px}

.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}
.lp-top::before{height:5px;background:linear-gradient(90deg,var(--pk) 0,var(--pk) 80%,var(--am) 80%,var(--am) 100%)}
.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}
.lp-tag{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700;padding:2px 12px}
.lp-qn{flex:0 0 112px;height:112px;align-self:center;background:#fff;color:var(--pk);border:3px solid var(--pk);border-radius:50%;font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;font-size:26px}
.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}

.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}

.lp-sno .es{background:var(--am);border-radius:2px;font-weight:700}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"SO 레벨1 18강 적용독해02","audioDir":"18-02_audio","preview":false,"count":46,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">18강\u003cbr>적용독해02\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">SO 레벨1\u003c/div>\u003ch1>Walk Your Talk: Parents Are Children's Most Important Teachers\u003c/h1>\u003ch2>말한 대로 행동하라: 아이들에게 가장 중요한 스승은 부모다\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>부모는 학교 교육을 강조하며 아이를 가르치기 쉽지만, 아이들에게 가장 중요한 스승은 바로 부모이며 집에서의 배움도 학교 못지않게 중요하다. 아이들은 들어서 배우는 것보다 보면서 더 많이 배우므로, 부모는 \u003cb class=\"key\">모범\u003c/b>을 보여 말과 행동이 일치하는 \u003cb class=\"key\">말한 \u003c/b>\u003cb class=\"key\">대로 \u003c/b>\u003cb class=\"key\">행동하기\u003c/b>를 실천해야 한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Parents must set a proper example and walk their talk, because children learn more by watching than by listening.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 부모의 가르침과 모범에 관한 글이에요. 많은 부모가 학교 교육을 강조하지만, 아이들에게 가장 중요한 스승은 바로 부모라는 이야기죠. 이 글은 아이들이 들어서 배우는 것보다 보면서 더 많이 배운다는 점을 짚으면서, 결국 부모가 말한 대로 행동해야 한다는 요지로 끝이 나요. 그럼 천천히 함께 읽어 볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">아이들은 어른의 말보다 어른의 행동을 먼저 관찰하고 그대로 따라 하는 존재예요. 심리학에서는 이런 방식을 \u003cb class=\"key\">관찰 \u003c/b>\u003cb class=\"key\">학습\u003c/b>(observational learning)이라고 부르는데, 반두라의 보보 인형 실험이 대표적인 사례죠. 부모는 아이에게 가장 가까운 \u003cb class=\"key\">역할 \u003c/b>\u003cb class=\"key\">모델\u003c/b>(role model)이라서, 말로 하는 훈육보다 매일 보여 주는 행동이 훨씬 강한 영향력을 남겨요. 예를 들어 부모가 '휴대폰 그만 봐'라고 말하면서 자신은 계속 화면만 들여다보면, 아이는 그 모순을 금세 알아차리고 말을 믿지 않게 되죠. 이렇게 말과 행동이 어긋나는 것을 \u003cb class=\"key\">이중 \u003c/b>\u003cb class=\"key\">메시지\u003c/b>(double message)라고 하는데, 이는 부모에 대한 신뢰를 떨어뜨려요. 그래서 가정 교육에서 가장 중요한 것은 \u003cb class=\"key\">일관성\u003c/b>(consistency)이고, 부모가 먼저 실천하는 모습이 결국 최고의 가르침이 돼요.\u003c/div>","segs":[{"n":2,"text":"본격적으로 들어가기 전에 배경지식을 조금 쌓아 볼게요. 아이들은 어른의 말보다 어른의 행동을 먼저 관찰하고 그대로 따라 하는 존재예요. 심리학에서는 이런 방식을 observational learning, 우리말로 관찰 학습이라고 부르는데, 반두라의 보보 인형 실험이 아주 유명하죠. 부모는 아이에게 가장 가까운 role model, 즉 역할 모델이어서 말로 하는 훈육보다 매일 보여 주는 행동이 훨씬 강한 영향력을 남겨요. 예를 들어 부모가 휴대폰 그만 보라고 말하면서 자신은 계속 화면만 들여다보면, 아이는 그 모순을 금세 알아차리고 부모의 말을 믿지 않게 되죠. 이렇게 말과 행동이 어긋나는 것을 double message, 이중 메시지라고 하고, 그래서 가정 교육에서는 consistency, 즉 일관성이 무엇보다 중요해요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>학교 교육만 강조하는 조언\u003csmall>통념 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>많은 부모가 아이들에게 \u003cb class=\"key\">교육\u003c/b>을 잘 받으라고 말하고 학교에 가서 \u003cb class=\"key\">공부 \u003c/b>\u003cb class=\"key\">열심히 \u003c/b>\u003cb class=\"key\">하기\u003c/b>를 강조한다. 이 조언은 유익하지만, 집에서 배우는 것이 학교에서 배우는 것보다 덜 중요하다는 \u003cb class=\"key\">잘못된 \u003c/b>\u003cb class=\"key\">암시\u003c/b>를 줄 수 있다. 흔한 생각을 먼저 꺼내 놓고 곧바로 그 한계를 짚는 도입 단계다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>부모가 첫 스승\u003csmall>주장 · 문장 4–6\u003c/small>\u003c/h4>\u003cp>아버지는 아이들의 가장 큰 스승이 부모라고 말했고, 글쓴이는 이것이 명확한 진실이라고 받아들인다. 부모가 하는 가장 중요한 \u003cb class=\"key\">역할\u003c/b> 중 하나가 바로 \u003cb class=\"key\">스승의 \u003c/b>\u003cb class=\"key\">역할\u003c/b>이다. 학교라는 공간보다 부모라는 사람이 더 결정적인 교육자라는 점을 못 박는 대목이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>보면서 배우는 아이들\u003csmall>전환 · 문장 7–8\u003c/small>\u003c/h4>\u003cp>그러나 아버지는 아이들이 들어서 배우는 것보다 \u003cb class=\"key\">보면서\u003c/b> 더 많이 배운다고도 하셨다. 그래서 부모는 \u003cb class=\"key\">모범\u003c/b>을 보임으로써 아이들을 \u003cb class=\"key\">바른 \u003c/b>\u003cb class=\"key\">방향\u003c/b>으로 이끌도록 주의해야 한다. 가르침의 수단이 말에서 행동으로 옮겨 가는 전환의 지점이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>말과 행동의 차이\u003csmall>근거 · 문장 9–10\u003c/small>\u003c/h4>\u003cp>아이들은 항상 \u003cb class=\"key\">말과 \u003c/b>\u003cb class=\"key\">행동\u003c/b> 간의 차이를 주시하고 있다. 그들은 부모가 말은 이렇게 하고 행동은 다르게 하는 것을 \u003cb class=\"key\">재빨리 \u003c/b>\u003cb class=\"key\">잡아낸다\u003c/b>. 말로만 강조한 가르침이 왜 힘을 잃는지 보여 주는 근거다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>말한 대로 행동하기\u003csmall>결론 · 문장 11\u003c/small>\u003c/h4>\u003cp>아버지의 마지막 인용은 좋은 부모가 되려면 \u003cb class=\"key\">말한 \u003c/b>\u003cb class=\"key\">대로 \u003c/b>\u003cb class=\"key\">행동하기\u003c/b>, 즉 walk your talk를 실천해야 한다는 것이다. 앞에서 이어진 말과 행동에 대한 논의를 한 문장으로 압축한 결론이다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 이 글의 흐름을 다섯 단계로 나눠서 따라가 볼게요.","hl":null},{"n":4,"text":"먼저 글은 많은 부모가 아이들에게 교육을 잘 받으라고 말하고 학교에 가서 공부 열심히 하라고 한다는 이야기로 시작해요. 이 조언 자체는 유익하지만, 집에서 배우는 것이 학교에서 배우는 것보다 덜 중요하다는 잘못된 암시를 줄 수 있다는 점을 짚죠. 흔한 통념을 소개하고 그 한계를 바로 지적하는 도입부예요.","hl":"f0"},{"n":5,"text":"이어서 글쓴이가 아버지에게 들은 말씀이 나와요. 아이들의 가장 큰 스승은 부모라는 말이죠. 글쓴이는 이것이 명확한 진실이라면서, 부모가 하는 가장 중요한 역할 중 하나가 스승의 역할이라고 정리해요. 학교라는 공간보다 부모라는 사람이 더 결정적인 교육자라는 주장인 거예요.","hl":"f1"},{"n":6,"text":"그런데 여기서 방향이 한 번 바뀌어요. 아버지는 아이들이 들어서 배우는 것보다 보면서 더 많이 배운다고도 하셨거든요. 그래서 부모는 모범을 보여서 아이들을 바른 방향으로 이끌도록 주의해야 한다고 말해요. 가르침의 수단이 말에서 행동으로 옮겨 가는 대목이에요.","hl":"f2"},{"n":7,"text":"그 이유도 바로 뒤에 나와요. 아이들은 항상 말과 행동 간의 차이를 주시하고 있다는 거예요. 부모가 말은 이렇게 하고 행동은 다르게 하면 아이들이 그걸 재빨리 잡아낸다고 해요. 말로만 강조한 가르침이 왜 힘을 잃는지 보여 주는 근거예요.","hl":"f3"},{"n":8,"text":"마지막으로 아버지의 말씀을 한 번 더 인용하면서 글을 맺어요. 좋은 부모가 되고 싶으면 말한 대로 행동해야 한다는 것이죠. walk your talk, 즉 말과 행동을 일치시키는 것이 이 글의 결론이에요.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">통념-반박\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 8번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 학교 교육을 강조하는 흔한 \u003cb class=\"key\">통념\u003c/b>을 먼저 소개한 뒤, 집에서의 배움과 부모의 스승 역할을 들어 이를 \u003cb class=\"key\">반박\u003c/b>한다. 이어지는 아버지의 두 번째 말씀은 '듣기보다 보기'라는 \u003cb class=\"key\">전환\u003c/b>을 만들고, 말과 행동의 차이를 근거로 제시한다. 마지막 문장에서 \u003cb class=\"key\">말한 \u003c/b>\u003cb class=\"key\">대로 \u003c/b>\u003cb class=\"key\">행동하기\u003c/b>라는 결론이 제시되므로 주제가 글 끝에서 완성되는 \u003cb class=\"key\">미괄식\u003c/b> 구조다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>While (3)\u003c/b>\u003cspan>양보하며 반박을 예고\u003c/span>\u003cb>And this is clearly true (5)\u003c/b>\u003cspan>앞 내용에 대한 확언·동의\u003c/span>\u003cb>However (7)\u003c/b>\u003cspan>앞 내용을 뒤집는 전환\u003c/span>\u003cb>Because of this (8)\u003c/b>\u003cspan>원인과 결과 연결\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">learning at home\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">parents are teachers\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">learn by watching\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">set a proper example\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">walk your talk\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>말로만 가르치는 부모\u003c/th>\u003cth>행동으로 보여 주는 부모\u003c/th>\u003c/tr>\u003ctr>\u003ctd>말은 이렇게, 행동은 다르게\u003c/td>\u003ctd>말과 행동이 일치\u003c/td>\u003c/tr>\u003ctr>\u003ctd>아이들이 차이를 재빨리 잡아냄\u003c/td>\u003ctd>아이들이 바른 방향으로 자람\u003c/td>\u003c/tr>\u003ctr>\u003ctd>가르침의 힘이 약해짐\u003c/td>\u003ctd>모범으로 더 많이 배움\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글은 통념을 먼저 제시하고 그것을 반박하는 통념 반박 구조예요. 학교 교육을 강조하는 흔한 이야기를 꺼낸 뒤, 집에서의 배움과 부모의 역할을 들어 그 생각을 뒤집죠. 주제문은 부모가 모범을 보여 아이들을 바른 방향으로 이끌어야 한다는 문장이고, 글의 결론이 맨 끝 문장에서 완성되기 때문에 미괄식 구조로 보면 돼요.","hl":"ty"},{"n":10,"text":"신호어를 눈여겨보세요. While이 나오면 유익한 조언이지만 그렇지는 않다는 반박이 뒤따르겠다는 예고예요. However는 앞의 내용을 정면으로 뒤집는 전환이고, Because of this는 원인과 결과를 이어 주는 표현이죠. 그리고 And this is clearly true처럼 글쓴이가 앞의 말에 동의하고 확언하는 문장도 흐름을 잡는 데 큰 도움이 돼요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>education\u003c/b>\u003cem>명사\u003c/em>\u003cspan>교육\u003c/span>\u003c/div>\u003cdiv>\u003cb>important\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>중요한\u003c/span>\u003c/div>\u003cdiv>\u003cb>study hard\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>공부 열심히 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>useful\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>유익한, 쓸모 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>advice\u003c/b>\u003cem>명사\u003c/em>\u003cspan>조언, 충고\u003c/span>\u003c/div>\u003cdiv>\u003cb>falsely\u003c/b>\u003cem>부사\u003c/em>\u003cspan>잘못되게, 사실과 다르게\u003c/span>\u003c/div>\u003cdiv>\u003cb>suggest\u003c/b>\u003cem>동사\u003c/em>\u003cspan>암시하다, 시사하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>less\u003c/b>\u003cem>부사\u003c/em>\u003cspan>덜, 더 적게\u003c/span>\u003c/div>\u003cdiv>\u003cb>often\u003c/b>\u003cem>부사\u003c/em>\u003cspan>자주, 종종\u003c/span>\u003c/div>\u003cdiv>\u003cb>clearly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>명확히, 분명히\u003c/span>\u003c/div>\u003cdiv>\u003cb>true\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>진실인, 사실인\u003c/span>\u003c/div>\u003cdiv>\u003cb>role\u003c/b>\u003cem>명사\u003c/em>\u003cspan>역할\u003c/span>\u003c/div>\u003cdiv>\u003cb>play a role\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>역할을 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>however\u003c/b>\u003cem>부사\u003c/em>\u003cspan>그러나, 하지만\u003c/span>\u003c/div>\u003cdiv>\u003cb>watch\u003c/b>\u003cem>동사\u003c/em>\u003cspan>지켜보다, 보다\u003c/span>\u003c/div>\u003cdiv>\u003cb>listen\u003c/b>\u003cem>동사\u003c/em>\u003cspan>듣다\u003c/span>\u003c/div>\u003cdiv>\u003cb>because of\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~ 때문에\u003c/span>\u003c/div>\u003cdiv>\u003cb>be careful to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~하도록 주의하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>lead\u003c/b>\u003cem>동사\u003c/em>\u003cspan>이끌다, 인도하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>direction\u003c/b>\u003cem>명사\u003c/em>\u003cspan>방향\u003c/span>\u003c/div>\u003cdiv>\u003cb>set an example\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>모범을 보이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>proper\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>적절한, 올바른\u003c/span>\u003c/div>\u003cdiv>\u003cb>always\u003c/b>\u003cem>부사\u003c/em>\u003cspan>항상, 늘\u003c/span>\u003c/div>\u003cdiv>\u003cb>difference\u003c/b>\u003cem>명사\u003c/em>\u003cspan>차이\u003c/span>\u003c/div>\u003cdiv>\u003cb>action\u003c/b>\u003cem>명사\u003c/em>\u003cspan>행동\u003c/span>\u003c/div>\u003cdiv>\u003cb>be quick to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~하기가 빠르다, 재빨리 ~하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>catch\u003c/b>\u003cem>동사\u003c/em>\u003cspan>잡아내다, 알아차리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>quote\u003c/b>\u003cem>동사\u003c/em>\u003cspan>인용하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>walk your talk\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>말한 대로 행동하다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"단어도 몇 개 짚어 볼게요. advice는 조언, suggest는 암시하다, proper는 올바르다는 뜻이에요. set an example은 모범을 보이다, walk your talk는 말한 대로 행동하다라는 뜻이니 꼭 외워 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">important\u003c/b>\u003cspan class=\"m\">중요한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">significant\u003c/span>\u003cspan class=\"s\">essential\u003c/span>\u003cspan class=\"s\">crucial\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">trivial\u003c/span>\u003cspan class=\"a\">unimportant\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">useful\u003c/b>\u003cspan class=\"m\">유익한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">helpful\u003c/span>\u003cspan class=\"s\">beneficial\u003c/span>\u003cspan class=\"s\">valuable\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">useless\u003c/span>\u003cspan class=\"a\">harmful\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">suggest\u003c/b>\u003cspan class=\"m\">암시하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">imply\u003c/span>\u003cspan class=\"s\">indicate\u003c/span>\u003cspan class=\"s\">hint\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">assert\u003c/span>\u003cspan class=\"a\">declare\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">proper\u003c/b>\u003cspan class=\"m\">올바른\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">appropriate\u003c/span>\u003cspan class=\"s\">suitable\u003c/span>\u003cspan class=\"s\">right\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">improper\u003c/span>\u003cspan class=\"a\">wrong\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">be careful to\u003c/b>\u003cspan class=\"m\">~하도록 주의하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">be cautious to\u003c/span>\u003cspan class=\"s\">take care to\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">be careless to\u003c/span>\u003cspan class=\"a\">neglect to\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">difference\u003c/b>\u003cspan class=\"m\">차이\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">distinction\u003c/span>\u003cspan class=\"s\">gap\u003c/span>\u003cspan class=\"s\">contrast\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">similarity\u003c/span>\u003cspan class=\"a\">sameness\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">catch\u003c/b>\u003cspan class=\"m\">알아차리다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">notice\u003c/span>\u003cspan class=\"s\">spot\u003c/span>\u003cspan class=\"s\">detect\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">miss\u003c/span>\u003cspan class=\"a\">overlook\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"핵심 어휘의 동의어와 반의어도 정리해 볼게요. important는 significant, essential과 가깝고 trivial은 반대말이에요. useful은 helpful, beneficial과 통하고 useless는 반대죠. suggest는 imply, indicate로 바꿔 쓸 수 있고, proper는 appropriate, suitable과 같은 뜻이에요. difference는 distinction, gap과 가깝고 similarity는 반대말이며, catch는 notice, spot으로 바꿔 쓸 수 있어요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 부모들이\u003c/span>\u003cspan class=\"en\">Many parents\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아이들에게 말한다,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">say \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">children\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“교육을 잘 받는 게\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">A \u003c/span>\u003cspan class=\"tgt\">good \u003c/span>\u003cspan class=\"tgt\">education \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">중요해.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">important\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">많은 부모들이 아이들에게 “교육을 잘 받는 게 중요해.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 부모들이 아이에게 \u003cb class=\"key\">교육\u003c/b>의 중요성을 강조하며 건네는 말로, 글 전체의 출발점이 되는 인용문입니다. 여기서 education은 \u003cb class=\"key\">불가산명사\u003c/b>라서 A good education처럼 하나의 덩어리 표현으로 쓰였고, say는 사람을 목적어로 바로 받지 않아 \u003cb class=\"key\">say \u003c/b>\u003cb class=\"key\">to \u003c/b>\u003cb class=\"key\">사람\u003c/b> 형태로 씁니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">say + to + 사람 (전치사 to가 필요한 동사)\u003c/span> : say [자동사] + to + [사람] (~에게 말하다) : \"아이들에게 말한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">직접화법(인용문)과 불가산명사 education\u003c/span> : [A good education] + [is] + [important] : \"교육을 잘 받는 게 중요해\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"Many parents, 많은 부모들이. say to their children, 아이들에게 말한다. \"A good education, “교육을 잘 받는 게. is important, 중요해.. 이 문장 전체를 해석하면, 많은 부모들이 아이들에게 “교육을 잘 받는 게 중요해.","hl":"m"},{"n":14,"text":"부모들이 아이들에게 교육이 중요하다고 말하는 장면이에요. 글 전체가 바로 이 말에서 시작되죠. 그리고 education은 불가산명사라서 A good education처럼 한 덩어리로 표현한다는 점도 함께 기억해 주세요.","hl":"mn"},{"n":15,"text":"첫 번째로 say는 사람을 바로 목적어로 받지 않고 say to 사람 형태로 쓴다는 점을 보세요. tell이었다면 to 없이 사람이 바로 왔을 거예요. 두 번째로 인용 부호 안의 말은 직접화법이에요. 부모가 실제로 한 말을 그대로 옮긴 것이죠. 그리고 education은 불가산명사라서 함부로 복수로 만들지 않는다는 점도 꼭 챙겨 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">학교에 가서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">Go \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">school \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공부 열심히 해.”\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">study \u003c/span>\u003cspan class=\"tgt\">hard\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">학교에 가서 공부 열심히 해.”라고 말한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 인용이 이어지면서 부모가 아이에게 직접 건네는 명령형 조언입니다. 동사원형으로 시작하는 \u003cb class=\"key\">명령문\u003c/b> 두 개가 and로 이어져 「학교에 가서 공부하라」는 \u003cb class=\"key\">병렬\u003c/b> 구조를 이룹니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문(동사원형으로 시작)\u003c/span> : [동사원형] + ~ (주어 You 생략) : \"학교에 가라\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">and로 연결된 동사원형 병렬\u003c/span> : [동사원형 A] and [동사원형 B] : \"학교에 가서 공부 열심히 해\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"Go to school, 학교에 가서. and study hard.\", 공부 열심히 해.”. 이 문장 전체를 해석하면, 학교에 가서 공부 열심히 해.”라고 말한다.","hl":"m"},{"n":17,"text":"앞 문장에 이어서 부모가 아이에게 직접 하는 말이에요. 학교에 가서 열심히 공부하라는 아주 익숙한 조언이죠.","hl":"mn"},{"n":18,"text":"첫 번째로 Go to school은 주어 You가 생략된 명령문이에요. 그래서 동사원형으로 시작하죠. 두 번째로 and 뒤의 study도 동사원형이에요. go와 study가 동사원형끼리 병렬을 이루고 있다는 점, 시험에 자주 나오니까 꼭 챙기세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것이 유익한 조언이기는 하지만,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">While \u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">useful \u003c/span>\u003cspan class=\"tgt\">advice\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은 잘못된 암시를 준다\u003c/span>\u003cspan class=\"en\">it falsely \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">suggests \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">집에서 배우는 것이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">learning \u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">home\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">덜 중요하다고\u003c/span>\u003cspan class=\"en\">is \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">less \u003c/span>\u003cspan class=\"tgt\">important \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">학교에서 배우는 것보다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">learning \u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">school\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것이 유익한 조언이기는 하지만, 이것은 집에서 배우는 것이 학교에서 배우는 것보다 덜 중요하다는 잘못된 암시를 줄 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞의 조언 자체가 틀렸다는 뜻이 아니라, 그 말이 집에서 배우는 것을 덜 중요하게 여기게 만드는 \u003cb class=\"key\">잘못된 \u003c/b>\u003cb class=\"key\">암시\u003c/b>를 줄 수 있다고 지적합니다. while로 \u003cb class=\"key\">대조\u003c/b>를 만들고, suggest that절로 암시의 내용을 풀어 놓았습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">양보의 접속사 while\u003c/span> : While + [주어 + 동사], [주어 + 동사] (~이기는 하지만) : \"이것이 유익한 조언이기는 하지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">suggest + that절(목적어)\u003c/span> : suggest + that + [주어 + 동사] (~라고 암시하다) : \"~라는 암시를 준다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동명사 주어\u003c/span> : [동명사구 learning at home] + [동사 is] : \"집에서 배우는 것이\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">비교급 less + than\u003c/span> : [less + 형용사] + than + [비교 대상] : \"학교에서 배우는 것보다 덜 중요하다\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"While this is useful advice, 이것이 유익한 조언이기는 하지만. it falsely suggests, 이것은 잘못된 암시를 준다. that learning at home, 집에서 배우는 것이. is less important, 덜 중요하다고. than learning at school, 학교에서 배우는 것보다.. 이 문장 전체를 해석하면, 이것이 유익한 조언이기는 하지만, 이것은 집에서 배우는 것이 학교에서 배우는 것보다 덜 중요하다는 잘못된 암시를 줄 수 있다.","hl":"m"},{"n":20,"text":"앞에서 한 조언이 나쁘다는 게 아니라, 그 말이 집에서 배우는 것의 가치를 낮춰 들리게 할 수 있다는 지적이에요. 그래서 이 문장은 잘못된 암시를 콕 집어 주는 역할을 하죠. 글의 방향이 가정에서의 배움으로 옮겨 가는 다리 역할도 합니다.","hl":"mn"},{"n":21,"text":"첫 번째로 While은 앞뒤 내용이 대조될 때 「~이지만」이라는 양보의 뜻으로 쓰여요. 두 번째로 suggests는 that절을 목적어로 데리고 가서 「~라고 암시한다」를 만들어요. 여기서는 falsely가 붙어서 잘못 암시한다는 뜻이 되었죠. 세 번째로 learning at home에서 learning은 동명사 주어라서 동사가 is가 되는 거예요. 동명사 주어는 단수로 취급한다는 점, 꼭 기억하세요. 네 번째로 less와 형용사를 써서 「덜 ~하다」를 만들고, 비교 대상은 than 뒤에 둬요. than 뒤에도 learning이 나와서 병렬을 이루고 있죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나의 아버지는\u003c/span>\u003cspan class=\"en\">My dad\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자주 말씀하셨다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">often \u003c/span>\u003cspan class=\"tgt\">said,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">&quot;아이들의 가장 큰 스승은\u003c/span>\u003cspan class=\"en\">&quot;Children's most important teachers\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">부모다.&quot;\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">parents\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나의 아버지는 “아이들의 가장 큰 스승은 부모다.”라고 자주 말씀하셨다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아버지의 말을 그대로 인용해, 아이에게 가장 큰 가르침을 주는 존재가 부모임을 강조하는 문장이다. 앞에서 학교 교육만이 전부가 아니라고 한 흐름을 이어 받아 가정에서의 \u003cb class=\"key\">교육\u003c/b>의 가치를 뒷받침해 준다. 직접 인용을 써서 그 말에 \u003cb class=\"key\">신뢰감\u003c/b>을 실어 주는 역할도 한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">say + 직접화법(인용문)\u003c/span> : [주어] + say/said + [[&quot;인용문&quot;]] : \"자주 말씀하셨다, &quot;……&quot;라고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주어-동사 수 일치\u003c/span> : [복수 주어 Children's most important teachers] + [be동사 are] + [주격보어 their parents] : \"부모다\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"My dad, 나의 아버지는. often said, 자주 말씀하셨다. \"Children's most important teachers, \"아이들의 가장 큰 스승은. are their parents.\", 부모다.\". 이 문장 전체를 해석하면, 나의 아버지는 “아이들의 가장 큰 스승은 부모다.”라고 자주 말씀하셨다.","hl":"m"},{"n":23,"text":"이 문장은 아버지의 말씀을 그대로 인용해서 가정에서 이루어지는 교육이 얼마나 중요한지를 전해 줘요. 앞에서 학교 교육만 강조하면 안 된다고 했죠. 그 흐름을 이어서 부모가 주는 교육에 신뢰감을 실어 주는 문장이에요.","hl":"mn"},{"n":24,"text":"첫 번째 어법 포인트는 직접화법이에요. say나 said 다음에 따옴표로 말을 그대로 붙여 주면 된답니다. tell은 사람 목적어가 필요하지만 say는 그렇지 않다는 차이도 같이 기억해 두세요. 두 번째는 수 일치예요. 주어인 Children's most important teachers가 복수라서 동사가 are로 온다는 점을 꼭 챙기세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 이것이\u003c/span>\u003cspan class=\"en\">And \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">this\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">분명히\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">clearly \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">진실이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">true\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것이 명확한 진실이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 바로 앞에서 하신 아버지의 말씀이 옳다는 것을 \u003cb class=\"key\">확인\u003c/b>해 주는 문장이다. 아주 짧은 문장으로 \u003cb class=\"key\">강조\u003c/b>의 효과를 내며, 뒤에 이어질 부모의 역할 설명에 대한 근거를 마련해 준다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지시대명사 this\u003c/span> : [지시대명사 this] + [be동사] + [보어] : \"이것이\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부사에 의한 형용사 보어 수식\u003c/span> : [be동사 is] + [부사 clearly] + [보어 true] : \"분명히 진실이다\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"And this, 그리고 이것이. is clearly, 분명히. true, 진실이다. 이 문장 전체를 해석하면, 이것이 명확한 진실이다.","hl":"m"},{"n":26,"text":"이 문장은 앞에서 아버지가 하신 말씀이 옳다는 걸 확인해 주는 역할을 해요. 짧게 끊어서 강조하는 효과도 있죠. 그래서 뒤에 이어지는 부모의 역할 설명에 단단한 근거가 되어 줍니다.","hl":"mn"},{"n":27,"text":"첫 번째는 지시대명사 this예요. 바로 앞 문장의 내용 전체를 하나로 받아 준답니다. 두 번째는 부사 clearly의 자리예요. be동사와 형용사 보어 사이에 들어가서 true를 꾸며 주죠. 그래서 '분명히 진실이다'라는 해석이 자연스럽게 나와요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가장 중요한 역할 중 하나\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">One \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">most \u003c/span>\u003cspan class=\"tgt\">important \u003c/span>\u003cspan class=\"tgt\">roles\u003c/span>/\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">부모들이 하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">parents \u003c/span>\u003cspan class=\"tgt\">play\u003c/span>/\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">스승의 역할이다\u003c/span>\u003cspan class=\"en\">is \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">teacher\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">부모들이 하는 가장 중요한 역할 중 하나가 스승의 역할이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 부모가 맡는 여러 역할 가운데 \u003cb class=\"key\">핵심\u003c/b>이 '스승'임을 분명히 밝히는 문장이다. one of the 최상급 구문으로 여럿 중 하나를 골라 강조하고, that of를 써서 role이 되풀이되는 것을 피했다. 앞 문장에서 이어진 아버지의 말씀을 문장으로 정리해 주는 위치에 있다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch n class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">watching\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">듣는 것보다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">listening\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 우리 아버지는 또한 “아이들은 들어서 배우는 것보다 보면서 더 많이 배운다.”고도 하셨다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아버지의 말을 빌려 \u003cb class=\"key\">보기\u003c/b>(watching)가 \u003cb class=\"key\">듣기\u003c/b>(listening)보다 학습 효과가 크다는 점을 못 박는 문장이에요. 앞 문장에서 부모가 곧 선생님이라고 했으니, 여기서는 '어떻게' 가르치는지가 문제라는 흐름으로 넘어갑니다. 즉 부모의 \u003cb class=\"key\">행동\u003c/b>이 교재가 된다는 다음 내용의 근거가 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속부사(전환)\u003c/span> : [접속부사], + [주어 + 동사] : \"그러나\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">비교급(more) 구문\u003c/span> : [동사] + more + than = 더 많이 ~하다 : \"보면서 더 많이 배운다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 by + 동명사(수단·방법)\u003c/span> : by + [동명사(-ing)] = ~함으로써 : \"보면서, 봄으로써\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">비교급 than + 대동사 do\u003c/span> : [비교급] + than + [주어] + do(대동사) : \"그들이 듣는 것보다\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"However, 그러나. my dad also said, 우리 아버지는 또한 말씀하셨다. \"Children learn more, 아이들은 더 많이 배운다. by watching, 보면서. than they do by listening.\", 듣는 것보다. 이 문장 전체를 해석하면, 그러나 우리 아버지는 또한 “아이들은 들어서 배우는 것보다 보면서 더 많이 배운다.”고도 하셨다.","hl":"m"},{"n":32,"text":"이 문장은 아버지의 말을 그대로 인용해서, 아이들에게는 귀으로 듣는 것보다 눈으로 보는 것이 학습에 더 크게 작용한다는 걸 강조하고 있어요. 앞에서 부모가 곧 선생님이라고 했으니, 이제는 어떻게 가르쳐야 하는지가 핵심이라는 흐름으로 넘어가는 거죠.","hl":"mn"},{"n":33,"text":"어법 포인트 첫 번째, However는 앞 문장과 방향을 바꾸는 접속부사이고, 의미만 연결해 줄 뿐 문법적으로 문장을 잇지는 않아요. 두 번째, more는 much의 비교급으로 '더 많이'라는 정도를 나타냅니다. 세 번째, by watching에서 by 뒤에는 동명사가 와서 방법을 나타내요. 네 번째, than they do의 do는 앞의 learn을 대신하는 대동사이고, 뒤에 by listening이 와서 듣는 방법과 비교된다는 것, 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것 때문에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Because \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">this,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">부모는 주의해야 한다\u003c/span>\u003cspan class=\"en\">parents \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">must \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">careful \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아이들을 이끌도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">lead \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">kids \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바른 방향으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">right \u003c/span>\u003cspan class=\"tgt\">direction\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모범을 보임으로써\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">setting \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">proper \u003c/span>\u003cspan class=\"tgt\">example\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것 때문에 부모는 모범을 보임으로써 아이들을 바른 방향으로 이끌도록 주의해야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 결론이에요. 아이들은 보면서 배우니 부모가 먼저 \u003cb class=\"key\">모범\u003c/b>을 보여야 아이들이 \u003cb class=\"key\">바른 \u003c/b>\u003cb class=\"key\">방향\u003c/b>으로 간다는 뜻이죠. 결국 부모의 역할은 말이 아니라 \u003cb class=\"key\">행동\u003c/b>으로 증명된다는 글의 중심 주장이 담긴 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구(이유)\u003c/span> : Because of + [명사/대명사] = ~ 때문에 : \"이것 때문에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 must + be careful + to부정사\u003c/span> : [조동사 must] + [동사원형 be] + [to + 동사원형] : \"~하도록 주의해야 한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(주의의 대상)\u003c/span> : [형용사 careful] + to + [동사원형] : \"아이들을 바른 방향으로 이끌도록\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">전치사 by + 동명사(수단)\u003c/span> : by + [동명사(-ing)] = ~함으로써 : \"모범을 보임으로써\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"Because of this, 이것 때문에. parents must be careful, 부모는 주의해야 한다. to lead their kids, 아이들을 이끌도록. in the right direction, 바른 방향으로. by setting a proper example, 모범을 보임으로써. 이 문장 전체를 해석하면, 이것 때문에 부모는 모범을 보임으로써 아이들을 바른 방향으로 이끌도록 주의해야 한다.","hl":"m"},{"n":35,"text":"이 문장은 아버지 말씀의 결론이에요. 아이들은 보면서 배우니까 부모가 직접 모범을 보여야 아이들이 바른 방향으로 간다는 뜻이죠. 그래서 부모의 역할은 말이 아니라 행동으로 증명된다는 이 글의 주장이 그대로 담겨 있습니다.","hl":"mn"},{"n":36,"text":"어법 포인트 첫 번째, Because of는 전치사구라서 뒤에 명사나 대명사가 오고 이것이 이유를 나타내요. 두 번째, must 뒤에는 동사원형이 와서 be동사가 그대로 쓰였고, be careful to do는 주의하다는 관용 표현입니다. 세 번째, to lead는 형용사 careful을 받쳐 주는 to부정사로 대상이 무엇인지 알려 줘요. 네 번째, by setting에서 by 뒤에는 동명사가 와서 방법을 나타낸다는 것도 꼭 챙기세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아이들은 항상 주시하고 있다\u003c/span>\u003cspan class=\"en\">Children \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">always \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">watching \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">차이를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">for\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">differences \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">말과 행동 간의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">between \u003c/span>\u003cspan class=\"tgt\">words \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">actions\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">아이들은 항상 말과 행동 간의 차이를(말과 행동이 다른 것을) 주시하고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아이들은 어른이 하는 \u003cb class=\"key\">말\u003c/b>과 실제 \u003cb class=\"key\">행동\u003c/b>을 늘 비교하며 살핀다는 뜻이에요. 그래서 말과 행동이 어긋나면 아이들이 금방 알아채므로 부모는 \u003cb class=\"key\">일관성\u003c/b>을 지켜야 한다는 다음 문장의 근거가 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재진행형 + always(습관 강조)\u003c/span> : [be동사] + always + [동명사(-ing)] : \"항상 주시하고 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">구동사 watch for\u003c/span> : watch for + [목적어] = ~을 주시하다 : \"주시하고 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 between (A and B)\u003c/span> : between + [A] + and + [B] = A와 B 사이의 : \"말과 행동 간의 차이\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"Children are always watching, 아이들은 항상 주시하고 있다. for differences, 차이를. between words and actions, 말과 행동 간의. 이 문장 전체를 해석하면, 아이들은 항상 말과 행동 간의 차이를(말과 행동이 다른 것을) 주시하고 있다.","hl":"m"},{"n":38,"text":"아이들은 어른이 말하는 것과 실제로 하는 것을 늘 비교하면서 살펴본다는 뜻이에요. 그래서 말과 행동이 다르면 아이들이 금방 알아챈다는 거죠. 결국 부모에게는 일관성이 필요하다는 다음 문장으로 자연스럽게 이어집니다.","hl":"mn"},{"n":39,"text":"어법 포인트 첫 번째, are always watching은 현재진행형에 always를 붙여 늘 반복되는 습관을 강조한 형태예요. 두 번째, watch for는 그냥 보는 것이 아니라 눈여겨 주시한다는 뜻의 숙어입니다. 세 번째, differences between A and B는 두 대상 사이의 차이를 말할 때 쓰는 짝 표현이니 통째로 익혀 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 재빠르다\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">quick \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">부모를 잡아내는 데\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">catch\u003c/span> parents\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">말은 이렇게 하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">say \u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">thing \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 행동은 다르게 하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">something \u003c/span>\u003cspan class=\"tgt\">else\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 부모가 말은 이렇게 하고 행동은 다르게 하는 것을(말 따로 행동 따로 하는 것을) 재빨리 잡아낸다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아이들은 부모의 말과 행동이 서로 일치하는지를 늘 지켜보고 있다는 뜻이에요. 그래서 앞 문장에서 강조한 '부모가 \u003cb class=\"key\">모범\u003c/b>을 보여야 한다'는 조언의 근거가 되어 주는 문장이죠. say one thing and do something else는 '말 따로 \u003cb class=\"key\">행동\u003c/b> 따로 하다'로 풀어 이해하면 쉬워요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(형용사 quick 수식)\u003c/span> : [주어] + be quick + [to do (~하는 데)] : \"잡아내는 데 재빠르다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 who + 병렬 구조\u003c/span> : [선행사 parents] + who + [동사 say] ~ and [동사 do] ~ : \"말은 이렇게 하고 행동은 다르게 하는 (부모)\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"They are quick, 그들은 재빠르다. to catch parents, 부모를 잡아내는 데. who say one thing, 말은 이렇게 하는. and do something else, 그리고 행동은 다르게 하는. 이 문장 전체를 해석하면, 그들은 부모가 말은 이렇게 하고 행동은 다르게 하는 것을(말 따로 행동 따로 하는 것을) 재빨리 잡아낸다.","hl":"m"},{"n":41,"text":"이 문장은 아이들이 부모의 말과 행동이 다른지를 아주 민감하게 지켜본다는 뜻이에요. 그래서 앞에서 부모가 모범을 보여야 한다고 했던 이야기를 다시 한 번 뒷받침해 주고 있죠. say one thing and do something else는 '말 따로 행동 따로 하는 거'라고 정리해 두면 좋아요.","hl":"mn"},{"n":42,"text":"첫 번째, are quick to catch에서 to catch는 to부정사의 부사적 용법이에요. 형용사 quick과 묶여서 '잡아내는 데 재빠르다'라는 뜻을 만들어요. 두 번째, parents who say one thing에서 who는 parents를 받아 주는 주격 관계대명사예요. 세 번째, say one thing and do something else는 병렬 구조예요. say와 do 두 동사가 and로 나란히 놓여 있으니 똑같은 무게로 읽어 주세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 아버지의 말을 인용할 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I'm \u003c/span>\u003cspan class=\"tgt\">going \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">quote\u003c/span> my father\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마지막으로 한 번\u003c/span>\u003cspan class=\"en\">one last time,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 좋은 부모가 되고 싶다면\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">If \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">want \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">good \u003c/span>\u003cspan class=\"tgt\">parent\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">말한 대로 행동해야 한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">need \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">walk \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">talk\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">아버지의 말을 마지막으로 인용한다면 “좋은 부모가 되고 싶으면, 말한 대로 행동해야 한다.”\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글을 마무리하면서 아버지의 말을 마지막으로 인용하는 문장이에요. 이 글 전체의 핵심인 '\u003cb class=\"key\">walk \u003c/b>\u003cb class=\"key\">your \u003c/b>\u003cb class=\"key\">talk\u003c/b>, 즉 말한 대로 행동하기'를 한마디로 압축해서 보여 주죠. 부모에게는 말보다 \u003cb class=\"key\">모범\u003c/b>이 더 중요하다는 앞의 내용이 이 문장으로 깔끔하게 마무리돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be going to (예정·의도)\u003c/span> : [주어] + be going to + [동사원형] : \"(나는) 인용할 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조건을 나타내는 접속사 if\u003c/span> : If + [주어] + [동사], + [주절] : \"만약 좋은 부모가 되고 싶다면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">need + to부정사 / 관용표현 walk one's talk\u003c/span> : need + [to do (to부정사)] / walk + [one's talk] : \"말한 대로 행동해야 한다\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"I'm going to quote my father, 나는 아버지의 말을 인용할 것이다. one last time, 마지막으로 한 번. \"If you want to be a good parent, 만약 좋은 부모가 되고 싶다면. you need to walk your talk.\", 말한 대로 행동해야 한다. 이 문장 전체를 해석하면, 아버지의 말을 마지막으로 인용한다면 “좋은 부모가 되고 싶으면, 말한 대로 행동해야 한다.”","hl":"m"},{"n":44,"text":"이 문장은 글을 맺으면서 아버지의 말씀을 마지막으로 인용하는 부분이에요. 지금까지 말한 부모의 모범에 대한 이야기를 한 문장으로 정리해 주고 있죠. 특히 walk your talk는 '말한 대로 행동하다'라는 뜻으로, 이 글의 주제를 그대로 담고 있는 표현이에요.","hl":"mn"},{"n":45,"text":"첫 번째, I'm going to quote에서 be going to는 앞으로 할 일에 대한 의도를 나타내요. 그래서 '인용할 거예요'라고 자연스럽게 해석하면 돼요. 두 번째, If you want to be a good parent에서 if는 조건을 이끄는 접속사예요. 조건이 먼저 나오고 결론이 뒤따르는 구조라는 걸 기억해 주세요. 세 번째, you need to walk your talk에서 need 뒤에는 to부정사가 와서 '~해야 한다'는 의무를 만들어요. 그리고 walk your talk는 말한 대로 행동하다라는 관용표현이니까 통째로 익혀 두면 좋아요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>부모들은 학교 교육이 중요하다고 말하지만, 이것은 집에서 배우는 것이 학교에서 배우는 것보다 덜 중요하다는 \u003cb class=\"key\">잘못된 \u003c/b>\u003cb class=\"key\">암시\u003c/b>를 줄 수 있다.\u003c/li>\u003cli>아버지는 아이들의 가장 큰 스승이 부모이며, 부모가 하는 가장 중요한 \u003cb class=\"key\">역할\u003c/b> 중 하나가 스승의 역할이라고 말했다.\u003c/li>\u003cli>아이들은 들어서 배우는 것보다 \u003cb class=\"key\">보면서\u003c/b> 더 많이 배우므로, 부모는 \u003cb class=\"key\">모범\u003c/b>을 보여 아이들을 바른 방향으로 이끌어야 한다.\u003c/li>\u003cli>아이들은 말과 행동의 \u003cb class=\"key\">차이\u003c/b>를 재빨리 잡아내기 때문에, 좋은 부모는 결국 \u003cb class=\"key\">말한 \u003c/b>\u003cb class=\"key\">대로 \u003c/b>\u003cb class=\"key\">행동\u003c/b>해야 한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Parents must set a proper example and walk their talk, because children learn more by watching than by listening.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">부모는 학교 교육을 강조하며 아이를 가르치기 쉽지만, 아이들에게 가장 중요한 스승은 바로 부모이며 집에서의 배움도 학교 못지않게 중요하다. 아이들은 들어서 배우는 것보다 보면서 더 많이 배우므로, 부모는 \u003cb class=\"key\">모범\u003c/b>을 보여 말과 행동이 일치하는 \u003cb class=\"key\">말한 \u003c/b>\u003cb class=\"key\">대로 \u003c/b>\u003cb class=\"key\">행동하기\u003c/b>를 실천해야 한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":46,"text":"정리해 볼게요. 집에서의 배움도 학교 못지않게 중요하고, 아이들에게 가장 큰 스승은 부모예요. 아이들은 말보다 행동을 보고 더 많이 배우기 때문에 부모의 모범과 말과 행동의 일치가 무엇보다 중요하죠. 오늘 배운 표현들 꼭 복습하시고, 다음 시간에 또 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
