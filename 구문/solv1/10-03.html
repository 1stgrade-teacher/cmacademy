<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SO 레벨1 10강 적용독해03 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-sno{font-size:13px;color:#8493A1;font-weight:700;margin-bottom:8px}

.lp-chunk{display:flex;flex-direction:column}
.lp-chunk .ko{font-size:13px;color:var(--pk-t);font-weight:700;line-height:1.3;margin-bottom:2px}
.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}
.lp-top::before{height:5px;background:linear-gradient(90deg,var(--pk) 0,var(--pk) 80%,var(--am) 80%,var(--am) 100%)}
.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}
.lp-tag{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700;padding:2px 12px}
.lp-qn{flex:0 0 112px;height:112px;align-self:center;background:#fff;color:var(--pk);border:3px solid var(--pk);border-radius:50%;font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;font-size:26px}
.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}
.lp-qn .qt{display:block;white-space:nowrap;line-height:1.12;letter-spacing:-.02em}
.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}

.lp-st h4{color:var(--ink,#1B2733)}
.lp-st h4 i{border-radius:4px;width:auto;min-width:24px;padding:0 4px}
.lp-pill{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700}
.lp-chain span.c{background:#fff;border:1px solid #AEBBE6;border-radius:3px;font-weight:600}

.lp-vg em{background:#fff;border:1px solid var(--pk-b);border-radius:3px}
.lp-sa>div{border-radius:4px;border-color:var(--pk-b)}

.lp-chips .s{border:1px solid #AEBBE6;color:#3A4FA3}
.lp-chips .a{border:1px solid var(--am-b);color:var(--am-d);background:#FFFBF2}
.lp-sno .es{background:var(--am);border-radius:2px;font-weight:700}
.lp-chunk .en{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:600}
.lp-chunk+.lp-chunk{border-left:1px solid var(--pk-b)}
.lp .tgt{background:var(--am-l);border-bottom:2.5px dotted var(--am)}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"SO 레벨1 10강 적용독해03","audioDir":"10-03_audio","preview":false,"count":30,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">10강\u003cbr>적용독해03\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">SO 레벨1\u003c/div>\u003ch1>The Boy Who Slowed His Aging to Reach a New Earth\u003c/h1>\u003ch2>새로운 지구에 닿기 위해 노화를 늦춘 소년\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>Adam은 유전자 변형을 통해 노화 과정이 늦추어진 100명 중 한 명으로, 앞으로 30년 동안 태양계를 가로질러 여행하며 보낼 것이다. 그들은 마침내 목적지에 도착해 과학자들이 우주 반대편에서 발견한 \u003cb class=\"key\">지구처럼 \u003c/b>\u003cb class=\"key\">생긴 \u003c/b>\u003cb class=\"key\">행성\u003c/b>에서 사는 최초의 사람들이 될 것이다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Adam is one of 100 genetically modified travelers who will spend 30 years crossing the solar system so that they can survive the journey and become the first people to live on an Earth-like planet.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 우주선에 오르는 소년 Adam의 이야기를 함께 읽어 볼게요. 이 글은 유전자 변형으로 노화를 늦춘 사람들이 긴 우주여행을 떠나는 과정을 시간 순서대로 담고 있어요. 정리하면 Adam은 백 명 중 한 명으로서 삼십 년 동안 태양계를 가로지르는 여행을 하게 되고, 마침내 지구처럼 생긴 행성에서 사는 최초의 사람들이 된다는 내용이에요. 오늘의 요지는 긴 우주여행에서 살아남기 위해 노화를 늦추는 선택을 했다는 점이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">우주는 넓고 별 사이의 거리는 상상하기 어려울 만큼 멉니다. 그래서 다른 행성까지 가려면 수십 년이 걸릴 수 있고, 이때 가장 큰 걸림돌이 바로 \u003cb class=\"key\">노화\u003c/b>입니다. 사람의 몸은 시간이 지나면 자연스럽게 늙기 때문에 긴 여행을 버티려면 \u003cb class=\"key\">수명 \u003c/b>\u003cb class=\"key\">연장\u003c/b>이 필요합니다. 그래서 과학자들은 \u003cb class=\"key\">유전자 \u003c/b>\u003cb class=\"key\">변형\u003c/b>(genetic modification)을 통해 노화 과정(aging process)을 늦추는 연구를 하고 있습니다. 어떤 동물은 \u003cb class=\"key\">동면\u003c/b>(hibernation)이나 대사 활동 감소로 오래 살아남기도 합니다. 긴 자동차 여행에서 연료 소모를 줄여야 목적지까지 갈 수 있는 것처럼, 미래에는 \u003cb class=\"key\">오래 \u003c/b>\u003cb class=\"key\">살 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">있는 \u003c/b>\u003cb class=\"key\">능력\u003c/b>이 우주여행의 필수 조건이 될 수 있습니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 짚어 볼게요. 우주는 정말 넓고 별 사이의 거리는 상상하기 어려울 만큼 멀어요. 그래서 다른 행성까지 가려면 수십 년이 걸릴 수 있고, 이때 가장 큰 걸림돌이 바로 노화예요. 사람의 몸은 시간이 지나면 자연스럽게 늙기 때문에 긴 여행을 버티려면 수명 연장이 필요하죠. 그래서 과학자들은 genetic modification, 즉 유전자 변형을 통해 aging process를 늦추는 연구를 하고 있어요. 어떤 동물은 동면을 하거나 대사 활동을 줄여서 아주 오래 살아남기도 합니다. 긴 자동차 여행에서 연료 소모를 줄여야 목적지까지 갈 수 있는 것과 같은 이치예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>작별과 탑승\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>Adam은 자기 이름을 부르는 소리를 듣고 고개를 돌려 부모님이 손을 흔들어 \u003cb class=\"key\">작별인사\u003c/b>를 하는 것을 지켜보았다. 그는 그들에게 \u003cb class=\"key\">키스를 \u003c/b>\u003cb class=\"key\">보내고\u003c/b> 재빨리 거대한 우주선에 올라탔다. 짧은 장면으로 독자를 이야기 속으로 끌어들이는 \u003cb class=\"key\">도입\u003c/b>부이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>30년의 여정\u003csmall>전환 · 문장 3\u003c/small>\u003c/h4>\u003cp>우주선에서 Adam은 앞으로 30년 동안을 \u003cb class=\"key\">태양계\u003c/b>를 가로질러 여행하며 보낼 것이다. 이 한 문장이 앞의 장면을 설명하며 \u003cb class=\"key\">여정의 \u003c/b>\u003cb class=\"key\">규모\u003c/b>를 알려 준다. 독자는 왜 이런 긴 여행이 가능한지 \u003cb class=\"key\">의문\u003c/b>을 품게 된다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>노화를 늦춘 이유\u003csmall>근거 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>Adam은 \u003cb class=\"key\">유전자 \u003c/b>\u003cb class=\"key\">변형\u003c/b>을 통해 노화 과정이 늦추어진 100명 중 한 명이다. 그들은 우주여행에서 \u003cb class=\"key\">살아남을 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">있을 \u003c/b>\u003cb class=\"key\">만큼\u003c/b> 오래 살 수 있도록 이와 같이 한 것이다. 앞에서 품었던 의문에 대한 \u003cb class=\"key\">이유\u003c/b>가 제시되는 부분이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>도착 이후의 미래\u003csmall>결론 · 문장 6\u003c/small>\u003c/h4>\u003cp>그들이 마침내 \u003cb class=\"key\">목적지\u003c/b>에 도착하면, 그들은 과학자들에 의해 발견된 우주 반대편에 있는 \u003cb class=\"key\">지구처럼 \u003c/b>\u003cb class=\"key\">생긴 \u003c/b>\u003cb class=\"key\">행성\u003c/b>에서 사는 최초의 사람들이 될 것이다. 여행의 목적과 \u003cb class=\"key\">미래의 \u003c/b>\u003cb class=\"key\">결과\u003c/b>를 함께 보여 주며 글을 맺는다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 네 단계로 나누어서 따라가 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 작별과 탑승 장면이에요. Adam은 자기 이름을 부르는 소리를 듣고 고개를 돌려 부모님이 손을 흔들어 작별인사를 하는 것을 지켜봐요. 그리고 그들에게 키스를 보내고 재빨리 거대한 우주선에 올라탑니다. 짧은 장면으로 독자를 이야기 속으로 끌어들이는 도입부예요.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 여정의 규모가 드러나요. 우주선에서 Adam은 앞으로 삼십 년 동안 태양계를 가로질러 여행하며 보낼 거예요. 이 한 문장이 앞의 장면을 설명하면서 여행이 얼마나 긴지 알려 주죠. 그러면 독자는 왜 이런 긴 여행이 가능한지 궁금해지게 됩니다.","hl":"f1"},{"n":6,"text":"세 번째 단계는 그 이유를 밝히는 부분이에요. Adam은 genetic modification을 통해 노화 과정이 늦추어진 백 명 중 한 명이에요. 그들은 우주여행에서 살아남을 수 있을 만큼 오래 살 수 있도록 이와 같이 한 거죠. 앞에서 품었던 의문에 대한 답이 여기에서 나옵니다.","hl":"f2"},{"n":7,"text":"마지막 단계는 도착 이후의 미래예요. 그들이 마침내 목적지에 도착하면, 과학자들에 의해 발견된 우주 반대편에 있는 지구처럼 생긴 행성에서 사는 최초의 사람들이 될 거예요. 여행의 목적과 결과를 함께 보여 주면서 글을 맺고 있습니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 5번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 Adam이 우주선에 오르는 \u003cb class=\"key\">장면\u003c/b>으로 시작해, 30년 여정이라는 \u003cb class=\"key\">규모\u003c/b>를 제시한 뒤, 4~5번 문장에서 노화를 늦춘 \u003cb class=\"key\">이유\u003c/b>를 밝히고, 마지막 문장에서 도착 후의 \u003cb class=\"key\">미래\u003c/b>를 보여 준다. 사건이 시간의 흐름을 따라 이어지므로 전개 방식은 \u003cb class=\"key\">시간순\u003c/b>이다. 핵심이 되는 정보가 글의 뒤쪽에서 드러나므로 \u003cb class=\"key\">미괄식\u003c/b> 구조로 볼 수 있다. 장면이 먼저 나오고 설명이 뒤따르기 때문에 끝까지 읽으며 주제를 확정해야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>On the spaceship (3)\u003c/b>\u003cspan>장소·상황 전환\u003c/span>\u003cb>You see (4)\u003c/b>\u003cspan>배경 설명 제시\u003c/span>\u003cb>to be able to (5)\u003c/b>\u003cspan>목적·이유 제시\u003c/span>\u003cb>When they finally arrive (6)\u003c/b>\u003cspan>시간 경과 후 결과 제시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">boarded the huge spaceship\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">traveling across the solar system\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the journey through space\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">their destination\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">an Earth-like planet\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>현재의 이별 장면\u003c/th>\u003cth>미래의 정착 결과\u003c/th>\u003c/tr>\u003ctr>\u003ctd>부모님과의 작별, 우주선 탑승\u003c/td>\u003ctd>우주 반대편 행성에서의 정착\u003c/td>\u003c/tr>\u003ctr>\u003ctd>30년의 여행이 시작되는 시점\u003c/td>\u003ctd>최초의 사람이 되는 도착 이후\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 사건이 일어난 시간 순서를 따라가면서 뒤로 갈수록 정보가 구체해지는 미괄식 구조예요. 처음에는 장면만 보여 주고, 중간에 삼십 년이라는 여정의 규모를 알려 준 다음, 뒤에서 노화를 늦춘 이유를 밝히죠. 그래서 핵심이 되는 주제문은 다섯 번째 문장이라고 볼 수 있어요. 장면이 먼저 나오고 설명이 뒤따르는 방식이니까 처음부터 주제를 붙잡기보다 끝까지 읽으면서 정리하는 게 좋아요.","hl":"ty"},{"n":9,"text":"신호어를 눈여겨보세요. 세 번째 문장 앞의 On the spaceship은 장소와 상황이 바뀐다는 신호이고, 네 번째 문장의 You see는 배경 설명을 시작한다는 신호예요. 다섯 번째 문장의 to be able to는 목적과 이유를 이끌고, 마지막 문장의 When they finally arrive는 시간이 흐른 뒤의 결과를 알려 줍니다. 그리고 traveling across the solar system, the journey through space, their destination 같은 표현이 같은 여정을 계속 바꿔 말하고 있다는 점도 확인해 두세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>turn one's head\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>고개를 돌리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>call\u003c/b>\u003cem>동사\u003c/em>\u003cspan>부르다\u003c/span>\u003c/div>\u003cdiv>\u003c  것을 듣다 : \"자기 이름이 불리는 소리를 들었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">지각동사 + 목적어 + 현재분사\u003c/span> : watch + [목적어] + [현재분사] : 목적어가 ~하는 것을 보다 : \"부모님이 손을 흔들어 작별인사를 하는 것을 보았다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Adam turned his head, Adam은 고개를 돌렸다. as he heard his name called, 자기 이름이 불리는 소리를 듣자. and watched his parents waving goodbye, 그리고 부모님이 손을 흔들어 작별인사를 하는 것을 지켜보았다.. 이 문장 전체를 해석하면, Adam 은 자기 이름을 부르는 소리를 듣고 고개를 돌려 부모님이 손을 흔들어 작별인사를 하는 것을 지켜보았다.","hl":"m"},{"n":13,"text":"이 장면은 Adam이 이름이 불리는 소리를 듣고 돌아보면서 출발의 긴장감을 시작하는 대목이에요. as는 하자나 할 때로 장면을 이어 주고 heard his name called는 지각동사 구문으로 이름이 불리는 것을 들었다는 뜻이에요. watched his parents waving goodbye는 부모님이 손 흔드는 모습을 지켜보았다는 뜻으로 이별 장면을 또렷하게 보여 줍니다.","hl":"mn"},{"n":14,"text":"첫 번째로 as는 두 일이 거의 동시에 일어날 때 쓰는 접속사예요. 여기서는 이름이 불리는 순간을 나타내며 시간의 흐름을 이어 줍니다. 두 번째로 heard his name called는 지각동사 hear 뒤에 목적어 his name과 과거분사 called가 온 구조예요. his name이 불리는 쪽이므로 과거분사가 목적격 보어로 쓰였고 hear가 수동의 의미를 만듭니다. 세 번째로 watched his parents waving goodbye는 지각동사 watch 뒤에 목적어와 현재분사가 온 구조예요. parents가 직접 손을 흔드는 능동의 상황이라 현재분사를 씁니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 그들에게 키스를 보냈다\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">blew \u003c/span>\u003cspan class=\"tgt\">them \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">kiss\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 재빨리 올라탔다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">quickly \u003c/span>\u003cspan class=\"tgt\">boarded\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거대한 우주선에\u003c/span>\u003cspan class=\"en\">the huge spaceship.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 그들에게 키스를 보내고 재빨리 거대한 우주선에 올라탔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Adam이 부모님의 작별 인사에 키스로 화답하고 곧바로 우주선에 오르는 장면이다. blew them a kiss는 '그들에게 키스를 날려 보냈다'는 \u003cb class=\"key\">관용 \u003c/b>\u003cb class=\"key\">표현\u003c/b>이고, boarded는 '배나 비행기 따위에 \u003cb class=\"key\">탑승했다\u003c/b>'는 뜻이다. and로 두 동작이 이어져 출발이 \u003cb class=\"key\">신속하게\u003c/b> 진행됨을 보여 준다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">4형식 수여동사 blow\u003c/span> : blow + [간접목적어] + [직접목적어] : ~에게 ...을 날려 보내다 : \"그들에게 키스를 보냈다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 and의 병렬\u003c/span> : [동사구] + and + [동사구] : ...하고 ...하다 : \"그리고 재빨리 올라탔다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"He blew them a kiss, 그는 그들에게 키스를 보냈다. and quickly boarded, 그리고 재빨리 올라탔다. the huge spaceship, 거대한 우주선에. 이 문장 전체를 해석하면, 그는 그들에게 키스를 보내고 재빨리 거대한 우주선에 올라탔다.","hl":"m"},{"n":16,"text":"이 문장은 Adam이 부모님의 작별 인사에 키스로 화답하고 곧바로 우주선에 오르는 장면이에요. blew them a kiss는 그들에게 키스를 날려 보냈다는 관용 표현이고 boarded는 우주선에 탑승했다는 뜻이에요. and로 두 동작이 이어져 출발이 신속하게 진행됨을 보여 줍니다.","hl":"mn"},{"n":17,"text":"첫 번째로 blew them a kiss는 blow 뒤에 간접목적어 them과 직접목적어 a kiss가 온 네 형식 구조예요. 여기서 blow는 키스를 보내다라는 뜻의 수여동사로 쓰였어요. 두 번째로 and quickly boarded는 앞의 blew와 boarded를 and로 이어 준 병렬 구조예요. 그래서 두 동작이 대등하게 연결됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우주선에서\u003c/span>\u003cspan class=\"en\">On the spaceship,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Adam 은 앞으로 30 년 동안을 보낼 것이다\u003c/span>\u003cspan class=\"en\">Adam \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">will\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">spend \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">next \u003c/span>\u003cspan class=\"tgt\">30 \u003c/span>\u003cspan class=\"tgt\">years \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">태양계를 가로질러 여행하며\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">traveling\u003c/span> across the solar system.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우주선에서 Adam 은 앞으로 30 년 동안을 태양계를 가로질러 여행하며 보낼 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 우주선에서 Adam이 앞으로 30년 동안 태양계를 가로질러 여행하며 지낼 것임을 말한다. spend 뒤에 시간 표현과 ing형이 와서 '~하면서 시간을 보내다'라는 \u003cb class=\"key\">관용 \u003c/b>\u003cb class=\"key\">구문\u003c/b>을 만든다. 이 문장은 뒤에 나올 유전자 변형과 긴 우주 여행의 \u003cb class=\"key\">배경\u003c/b>을 제시한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">미래시제 조동사 will\u003c/span> : will + [동사원형] : ~할 것이다 : \"보낼 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">spend + 시간 + ing 구문\u003c/span> : spend + [시간 표현] + [ing형] : ~하면서 시간을 보내다 : \"앞으로 30년 동안 여행하며 보내다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"On the spaceship, 우주선에서. Adam will spend the next 30 years, Adam 은 앞으로 30 년 동안을 보낼 것이다. traveling across the solar system, 태양계를 가로질러 여행하며. 이 문장 전체를 해석하면, 우주선에서 Adam 은 앞으로 30 년 동안을 태양계를 가로질러 여행하며 보낼 것이다.","hl":"m"},{"n":19,"text":"이 문장은 Adam이 우주선에서 앞으로 삼십 년 동안 태양계를 여행하며 지낼 것을 알려 줘요. spend 뒤에 시간 표현과 ing형이 오는 관용 구문으로 여행하며 시간을 보낸다는 뜻을 만들어요. 이 표현은 뒤에 나올 유전자 변형과 긴 우주 여행의 배경을 제시합니다.","hl":"mn"},{"n":20,"text":"첫 번째로 will은 앞으로 일어날 일을 나타내는 조동사예요. 여기서는 Adam이 앞으로 삼십 년을 보낼 미래의 계획을 표현합니다. 두 번째로 spend the next thirty years traveling은 spend 뒤에 시간 표현과 ing형이 이어지는 구문이에요. traveling은 Adam이 여행하는 동시 동작을 나타냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">알다시피,\u003c/span>\u003cspan class=\"en\">You see,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Adam은 100명 중 한 명이다\u003c/span>\u003cspan class=\"en\">Adam is \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">100 \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 노화 과정이 늦추어지게 만든\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">aging \u003c/span>\u003cspan class=\"tgt\">process \u003c/span>\u003cspan class=\"tgt\">slowed \u003c/span>\u003cspan class=\"tgt\">down\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유전자 변형을 통해서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">through \u003c/span>\u003cspan class=\"tgt\">genetic \u003c/span>\u003cspan class=\"tgt\">modification\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">알다시피 Adam 은 유전자 변형을 통해 노화 과정이 늦추어진 100 명 중 한 명이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글쓴이가 독자에게 배경지식을 깔아 주는 \u003cb class=\"key\">설명\u003c/b> 문장이에요. Adam이 유전자 변형으로 노화가 늦춰진 100명 중 한 사람이라는 \u003cb class=\"key\">근거\u003c/b>를 제시하죠. 바로 앞의 '우주선에 올랐다'는 사실에 자연스러운 \u003cb class=\"key\">이유\u003c/b>를 붙여 주는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">one of + 복수명사 + 주격 관계대명사 who + 복수동사\u003c/span> : one of [복수명사] + [who + 복수동사] : \"…중 한 명인데, 그들은 …한\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">have + 목적어 + 과거분사(목적격보어)\u003c/span> : have + [목적어] + [과거분사] : \"그들의 노화 과정이 늦추어지게 했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">수단을 나타내는 전치사 through\u003c/span> : through + [명사] : \"유전자 변형을 통해\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"You see, 알다시피. Adam is one of 100 people, Adam은 100명 중 한 명이다. who had their aging process slowed down, 그들의 노화 과정이 늦추어지게 만든. through genetic modification, 유전자 변형을 통해서. 이 문장 전체를 해석하면, 알다시피 Adam 은 유전자 변형을 통해 노화 과정이 늦추어진 100 명 중 한 명이다.","hl":"m"},{"n":22,"text":"이 문장은 아담이 어떤 사람인지 배경을 깔아 주는 설명 문장이에요. 백 명 중 한 명이 유전자 변형을 통해 노화가 늦춰졌다는 근거를 제시하고 있죠. 앞에서 우주선에 탔다는 이야기에 자연스러운 이유를 붙여 주는 거예요.","hl":"mn"},{"n":23,"text":"먼저 one of 100 people who had, 여기서 one of 뒤에는 복수명사가 오고 관계대명사 who의 동사는 선행사에 맞춰 복수인 had로 써요. 두 번째로 had their aging process slowed down, have 다음에 목적어, 그 뒤에 과거분사가 오면 목적어가 그런 상태가 되게 한다는 수동의 의미가 되죠. 세 번째로 through genetic modification, through는 수단을 나타내는 전치사로 유전자 변형을 통해서라고 해석해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 이와 같이 (노화 과정이 늦추어지게) 한 것이다\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">done\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">충분히 오래 살 수 있도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">able \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">live \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">long \u003c/span>\u003cspan class=\"tgt\">enough \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우주여행에서 살아남기 위해서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">survive\u003c/span> the journey through space.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 우주여행에서 살아남을 수 있을 만큼 오래 살 수 있도록 이와 같이 (노화 과정이 늦추어진 것) 한 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 내용을 이어 받아 '그렇게 한 \u003cb class=\"key\">목적\u003c/b>'을 밝히는 문장이에요. 노화를 늦춘 까닭이 우주여행에서 살아남을 만큼 오래 살기 \u003cb class=\"key\">위해서\u003c/b>라는 인과 관계를 완성하죠. to부정사가 두 번 이어지면서 목적의 \u003cb class=\"key\">연쇄\u003c/b>를 만드는 구조예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">have + 목적어 + 과거분사(수동 의미)\u003c/span> : have + [목적어] + [과거분사] : \"이것이 (늦추어지)게 했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : [주절] + to + [동사원형] : \"~할 수 있도록\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">형용사·부사 + enough + to부정사\u003c/span> : [long] + enough + [to survive] : \"살아남을 만큼 충분히 오래\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"They had this done, 그들은 이와 같이 (노화 과정이 늦추어지게) 한 것이다. to be able to live long enough, 충분히 오래 살 수 있도록. to survive the journey through space, 우주여행에서 살아남기 위해서. 이 문장 전체를 해석하면, 그들은 우주여행에서 살아남을 수 있을 만큼 오래 살 수 있도록 이와 같이 (노화 과정이 늦추어진 것) 한 것이다.","hl":"m"},{"n":25,"text":"이 문장은 앞 문장에서 노화를 늦춘 목적을 밝혀 주는 문장이에요. 우주여행에서 살아남을 만큼 오래 살기 위해서 그렇게 했다는 인과 관계를 완성하죠. to부정사가 두 번 이어지면서 목적이 목적으로 이어지는 연쇄 구조를 보여 줘요.","hl":"mn"},{"n":26,"text":"첫 번째로 had this done, have 다음에 목적어, 그 뒤에 과거분사가 오면 목적어가 그런 상태가 되게 한다는 수동의 의미가 돼요. 두 번째로 to be able to live long enough, to부정사의 부사적 용법으로 목적을 나타내서 살 수 있도록이라고 해석하죠. 세 번째로 long enough to survive, enough는 형용사나 부사 뒤에 오고 그 뒤에 to부정사가 와서 살아남을 만큼 충분히 오래라는 뜻이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 마침내 목적지에 도착하면,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">finally \u003c/span>\u003cspan class=\"tgt\">arrive \u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">destination\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 최초의 사람들이 될 것이다\u003c/span>\u003cspan class=\"en\">they will become \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">first \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지구처럼 생긴 행성에서 살\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">live \u003c/span>\u003cspan class=\"tgt\">on\u003c/span> an Earth-like planet\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">과학자들에 의해 발견된\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">discovered \u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">scientists\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우주 반대편에 있는\u003c/span>\u003cspan class=\"en\">on the other side of the universe.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들이 마침내 목적지에 도착하면, 그들은 과학자들에 의해 발견된 우주 반대편에 있는 지구처럼 생긴 행성에서 사는 최초의 사람들이 될 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 우주여행의 \u003cb class=\"key\">결말\u003c/b>을 제시하며 글을 마무리하는 문장이에요. 도착하면 지구 같은 행성에 사는 첫 사람이 된다는 미래를 보여 주죠. 앞에서 설명한 노화 지연과 긴 여행이 모두 이 \u003cb class=\"key\">보상\u003c/b>을 위한 준비였음이 드러나요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간 부사절의 현재시제(미래 대용)\u003c/span> : When + [주어] + [현재동사], [주어] + will + [동사원형] : \"~하면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">the first + 명사 + to부정사(형용사적 용법)\u003c/span> : the first + [명사] + to + [동사원형] : \"~에서 살 최초의 사람들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">과거분사구의 형용사적 수식(수동)\u003c/span> : [명사] + [과거분사] + by + [행위자] : \"과학자들에 의해 발견된\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"When they finally arrive at their destination, 그들이 마침내 목적지에 도착하면. they will become the first people, 그들은 최초의 사람들이 될 것이다. to live on an Earth-like planet, 지구처럼 생긴 행성에서 살. discovered by scientists, 과학자들에 의해 발견된. on the other side of the universe, 우주 반대편에 있는. 이 문장 전체를 해석하면, 그들이 마침내 목적지에 도착하면, 그들은 과학자들에 의해 발견된 우주 반대편에 있는 지구처럼 생긴 행성에서 사는 최초의 사람들이 될 것이다.","hl":"m"},{"n":28,"text":"이 문장은 우주여행의 결말을 제시하면서 글을 마무리하는 문장이에요. 도착하면 지구 같은 행성에 사는 첫 사람이 된다는 미래를 보여 주죠. 앞에서 설명한 노화 지연과 긴 여행이 모두 이 보상을 위한 준비였음이 드러나요.","hl":"mn"},{"n":29,"text":"첫 번째로 When they finally arrive at their destination, 시간을 나타내는 부사절에서는 미래의 일도 현재시제로 써요. 두 번째로 the first people to live on, 서수 뒤에 to부정사가 와서 살 최초의 사람들이라는 형용사 역할을 하죠. 세 번째로 discovered by scientists, 과거분사구가 앞의 행성을 뒤에서 꾸미면서 과학자들에 의해 발견된이라는 수동의 의미를 더해 줘요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>Adam은 자기 이름을 부르는 소리에 고개를 돌려 부모님의 \u003cb class=\"key\">작별인사\u003c/b>를 지켜보고 우주선에 올라탄다.\u003c/li>\u003cli>그는 앞으로 30년 동안 \u003cb class=\"key\">태양계\u003c/b>를 가로질러 여행하며 보낼 것이다.\u003c/li>\u003cli>Adam은 \u003cb class=\"key\">유전자 \u003c/b>\u003cb class=\"key\">변형\u003c/b>으로 노화 과정이 늦추어진 100명 중 한 명이며, 이는 우주여행에서 \u003cb class=\"key\">살아남기\u003c/b> 위해서였다.\u003c/li>\u003cli>그들은 \u003cb class=\"key\">지구처럼 \u003c/b>\u003cb class=\"key\">생긴 \u003c/b>\u003cb class=\"key\">행성\u003c/b>에 도착해 그곳에서 사는 최초의 사람들이 될 것이다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Adam is one of 100 genetically modified travelers who will spend 30 years crossing the solar system so that they can survive the journey and become the first people to live on an Earth-like planet.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">Adam은 유전자 변형을 통해 노화 과정이 늦추어진 100명 중 한 명으로, 앞으로 30년 동안 태양계를 가로질러 여행하며 보낼 것이다. 그들은 마침내 목적지에 도착해 과학자들이 우주 반대편에서 발견한 \u003cb class=\"key\">지구처럼 \u003c/b>\u003cb class=\"key\">생긴 \u003c/b>\u003cb class=\"key\">행성\u003c/b>에서 사는 최초의 사람들이 될 것이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":30,"text":"오늘 내용을 정리해 볼게요. 이 글은 우주선에 오르는 Adam의 장면에서 시작해서, 삼십 년에 걸친 태양계 여행, 유전자 변형으로 노화를 늦춘 이유, 그리고 지구처럼 생긴 행성에 정착할 미래로 이어집니다. 핵심은 긴 우주여행에서 살아남기 위해 노화를 늦추는 선택을 했다는 것이었어요. 시간 순서와 그 이유를 함께 잡는 연습이 꼭 필요하답니다. 오늘도 수고 많았어요, 다음 시간에 또 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
