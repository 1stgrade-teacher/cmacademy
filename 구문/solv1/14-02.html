<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SO 레벨1 14강 적용독해02 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}
.lp-top::before{height:5px;background:linear-gradient(90deg,var(--pk) 0,var(--pk) 80%,var(--am) 80%,var(--am) 100%)}
.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}
.lp-tag{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700;padding:2px 12px}
.lp-qn{flex:0 0 112px;height:112px;align-self:center;background:#fff;color:var(--pk);border:3px solid var(--pk);border-radius:50%;font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;font-size:26px}
.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}

.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}

.lp-sno .es{background:var(--am);border-radius:2px;font-weight:700}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"SO 레벨1 14강 적용독해02","audioDir":"14-02_audio","preview":false,"count":45,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">14강\u003cbr>적용독해02\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">SO 레벨1\u003c/div>\u003ch1>The Longer List: A Father's Humble Lesson\u003c/h1>\u003ch2>더 긴 목록: 아버지의 겸허한 깨달음\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>아버지는 허락 없이 사흘 동안 집을 비운 아들에게 집에 남으려면 \u003cb class=\"key\">고쳐야 \u003c/b>\u003cb class=\"key\">할 \u003c/b>\u003cb class=\"key\">것\u003c/b>들을 나열했지만, 쪽지를 뒤집어 자신이 \u003cb class=\"key\">개선해야 \u003c/b>\u003cb class=\"key\">할 \u003c/b>\u003cb class=\"key\">것\u003c/b>들을 적어 보니 그 목록이 아들의 것보다 더 길었다. 그는 이 깨달음을 염두에 두고 아들을 \u003cb class=\"key\">겸허하게\u003c/b> 맞이해 의미 있는 대화를 시작했다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>When a father listed the changes he himself had to make, his list turned out longer than his son's, and that realization led him to greet his son humbly and begin a meaningful talk.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"여러분, 안녕하세요. 오늘 함께 읽을 지문은 한 아버지와 아들에 관한 짧은 이야기예요. 아들이 허락 없이 사흘 동안 집을 비우고 돌아온 뒤, 아버지가 쪽지 한 장을 꺼내면서 이야기가 시작돼요. 아버지는 아들에게 요구할 것들을 적었다가 쪽지를 뒤집어 자신이 고쳐야 할 것들을 적었고, 그 목록이 오히려 더 길었다는 사실에 놀라죠. 그래서 이 글의 요지는 자신을 먼저 돌아보는 겸허함이 진짜 대화를 연다는 것이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">가정에서 부모와 자녀의 갈등은 흔히 \u003cb class=\"key\">권위\u003c/b>(authority)와 \u003cb class=\"key\">신뢰\u003c/b>(trust) 사이의 줄다리기로 나타납니다. 부모는 자녀에게 먼저 규칙을 요구하는데, 자녀가 그 규칙이 자신에게만 적용된다고 느끼면 곧바로 반발하게 됩니다. 심리학에서는 상대에게 요구하기 전에 자신을 먼저 점검하는 태도를 \u003cb class=\"key\">자기 \u003c/b>\u003cb class=\"key\">성찰\u003c/b>(self-reflection)이라고 부릅니다. 이는 시험지를 채점할 때 남의 답만 표시하다가, 나중에 내 답안도 똑같은 기준으로 고쳐 보는 것과 비슷합니다. 상대에게 요구한 기준을 나 자신에게도 적용하면 설득력은 훨씬 커지고, 관계는 \u003cb class=\"key\">대등한 \u003c/b>\u003cb class=\"key\">관계\u003c/b>로 바뀝니다. 이 지문의 아버지는 바로 그 과정을 쪽지 한 장으로 보여 줍니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경을 조금 깔아 볼게요. 가정에서 부모와 자녀의 갈등은 흔히 권위와 신뢰 사이의 줄다리기로 나타나요. 부모는 자녀에게 먼저 규칙을 요구하는데, 자녀가 그 규칙이 자신에게만 적용된다고 느끼면 바로 반발하게 되죠. 심리학에서는 상대에게 요구하기 전에 자신을 먼저 점검하는 태도를 자기 성찰이라고 불러요. 이건 시험지를 채점할 때 남의 답만 표시하다가, 나중에 내 답안도 똑같은 기준으로 고쳐 보는 것과 비슷해요. 상대에게 요구한 기준을 나 자신에게도 적용하면 설득력이 훨씬 커지고 관계는 대등한 관계로 바뀐답니다. 이 지문의 아버지는 바로 그 과정을 쪽지 한 장으로 보여 주고 있어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>문제 행동과 한계\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>한 가정에서 아들의 \u003cb class=\"key\">행동\u003c/b>이 너무 나빠져 가정을 망칠 지경에 놓였다. 어느 날 아들은 허락도 없이 친구들과 사흘 동안 집을 비웠고, 아버지는 더 이상 \u003cb class=\"key\">참을 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">없는\u003c/b> 상태가 되었다. 이 도입부는 갈등의 원인과 아버지의 한계를 동시에 보여 준다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>요구할 것의 나열\u003csmall>전개 · 문장 4–6\u003c/small>\u003c/h4>\u003cp>아버지는 아들이 삶에 변화를 가져오든지 집에서 나가든지 \u003cb class=\"key\">선택\u003c/b>하도록 마음먹었다. 아버지는 기다리는 동안 메모지를 꺼냈다. 거기에 그는 아들이 집에 계속 살고 싶을 경우 해야 할 \u003cb class=\"key\">변화\u003c/b>들을 쭉 나열했다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>쪽지를 뒤집다\u003csmall>전환 · 문장 7–9\u003c/small>\u003c/h4>\u003cp>슬프고 무거운 마음으로 아버지는 쪽지를 \u003cb class=\"key\">뒤집었다\u003c/b>. 뒷면에는 자기가 요구하는 변화를 아들이 받아들일 경우 자신이 \u003cb class=\"key\">개선\u003c/b>해야 할 것들을 적기 시작했다. 그러다 자신이 적은 것이 아들의 것보다 더 길다는 것을 깨닫고 깜짝 놀랐다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>겸허한 대화\u003csmall>결론 · 문장 10–11\u003c/small>\u003c/h4>\u003cp>이것을 \u003cb class=\"key\">염두에 \u003c/b>\u003cb class=\"key\">두고\u003c/b>, 아버지는 아들이 돌아왔을 때 \u003cb class=\"key\">겸허하게\u003c/b> 아들을 맞이했다. 그 두 사람은 쪽지의 아버지 면을 시작으로 \u003cb class=\"key\">대화\u003c/b>를 이어 갔다. 마지막 두 문장에서 이 이야기의 주제가 완성된다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 이야기가 어떤 순서로 흘러가는지 네 단계로 나눠서 살펴볼게요.","hl":null},{"n":4,"text":"첫 단계는 문제 행동과 한계예요. 아들의 행동이 너무 나빠져서 가정을 망칠 지경이었고, 아들은 허락도 없이 친구들과 사흘 동안 집을 비웠어요. 그래서 아버지는 더 이상 참을 수 없는 상태가 되었죠. 이 도입부가 갈등의 원인과 아버지의 한계를 동시에 보여 준다는 점을 꼭 받아 적어 두세요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 요구할 것의 나열이에요. 아버지는 아들이 삶에 변화를 가져오든지 집에서 나가든지 선택하도록 마음먹었어요. 그리고 기다리는 동안 메모지를 꺼내서, 아들이 집에 계속 살고 싶을 경우 해야 할 변화들을 쭉 나열했죠. 여기까지는 흔히 생각하는 부모의 모습 그대로예요.","hl":"f1"},{"n":6,"text":"세 번째 단계가 이 글의 전환이에요. 슬프고 무거운 마음으로 아버지는 쪽지를 뒤집었어요. 뒷면에는 자신이 요구하는 변화를 아들이 받아들일 경우 자신이 개선해야 할 것들을 적기 시작했죠. 그러다 자신이 적은 것이 아들의 것보다 더 길다는 것을 깨닫고 깜짝 놀랐어요.","hl":"f2"},{"n":7,"text":"마지막 단계는 겸허한 대화예요. 이것을 염두에 두고 아버지는 아들이 돌아왔을 때 겸허하게 아들을 맞이했어요. 그 두 사람은 쪽지의 아버지 면을 시작으로 대화를 이어 갔죠. 짧은 두 문장 안에 이 이야기의 주제가 다 담겨 있으니 마지막 문장까지 꼭 붙잡아 두세요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순(사건 전개)\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 10번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 사건이 시간 순서를 따라 이어지는 \u003cb class=\"key\">이야기\u003c/b> 형식이지만, 쪽지를 뒤집는 장면에서 내용이 한 번 \u003cb class=\"key\">반전\u003c/b>된다. 아들에게 요구하던 아버지가 자신을 먼저 돌아보는 쪽으로 관점이 바뀌고, 마지막 부분에서 \u003cb class=\"key\">겸허\u003c/b>라는 주제가 드러난다. 그래서 주제문이 결말에 놓인 \u003cb class=\"key\">미괄식\u003c/b> 구조로 읽는 것이 자연스럽다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>One day (2)\u003c/b>\u003cspan>시간 전환\u003c/span>\u003cb>While the father waited (5)\u003c/b>\u003cspan>동시 상황 제시\u003c/span>\u003cb>On the back (8)\u003c/b>\u003cspan>장소 전환·반전\u003c/span>\u003cb>With this in mind (10)\u003c/b>\u003cspan>깨달음의 행동 연결\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">make changes to his life\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the changes his son had to make\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the demanded changes\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the improvements he would make\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>아들의 쪽지\u003c/th>\u003cth>아버지의 쪽지\u003c/th>\u003c/tr>\u003ctr>\u003ctd>아들이 고쳐야 할 것을 나열\u003c/td>\u003ctd>아버지가 개선해야 할 것을 나열\u003c/td>\u003c/tr>\u003ctr>\u003ctd>목록이 상대적으로 짧음\u003c/td>\u003ctd>목록이 아들의 것보다 더 김\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 사건이 시간 순서를 따라 흘러가는 이야기 구조예요. 그런데 쪽지를 뒤집는 장면에서 관점이 한 번 반전되죠. 주제문이 결말에 놓이는 미괄식 구조라서, 마지막 문장에서 주제를 잡아야 해요. 그래서 처음부터 결론을 찾기보다 마지막 두 문장을 특히 집중해서 읽어야 합니다.","hl":"ty"},{"n":9,"text":"신호어부터 짚어 볼게요. One day는 시간을 넘기는 신호이고, While the father waited는 동시에 벌어진 상황을 알려 줘요. On the back은 장소가 바뀌는 지점이자 반전의 신호이고, With this in mind는 앞의 깨달음을 행동으로 연결해 주는 표현이에요. 그리고 make changes to his life가 the demanded changes로, 다시 the improvements로 바뀌어 표현되면서 같은 개념이 재진술되고 있다는 것도 눈여겨보세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>behavior\u003c/b>\u003cem>명사\u003c/em>\u003cspan>행동, 처신\u003c/span>\u003c/div>\u003cdiv>\u003cb>get bad\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>나빠지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>destroy\u003c/b>\u003cem>동사\u003c/em>\u003cspan>망치다, 파괴하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>permission\u003c/b>\u003cem>명사\u003c/em>\u003cspan>허락, 허가\u003c/span>\u003c/div>\u003cdiv>\u003cb>without permission\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>허락 없이\u003c/span>\u003c/div>\u003cdiv>\u003cb>have had enough\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>더 이상 참을 수 없다, 진저리가 났다\u003c/span>\u003c/div>\u003cdiv>\u003cb>decide\u003c/b>\u003cem>동사\u003c/em>\u003cspan>결정하다, 마음먹다\u003c/span>\u003c/div>\u003cdiv>\u003cb>make a choice\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>선택하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>make changes\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>변화를 만들다, 변화를 가져오다\u003c/span>\u003c/div>\u003cdiv>\u003cb>leave home\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>집을 떠나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>wait\u003c/b>\u003cem>동사\u003c/em>\u003cspan>기다리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>take out\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>꺼내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>note card\u003c/b>\u003cem>명사\u003c/em>\u003cspan>메모지, 쪽지\u003c/span>\u003c/div>\u003cdiv>\u003cb>list\u003c/b>\u003cem>동사\u003c/em>\u003cspan>나열하다, 열거하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>stay\u003c/b>\u003cem>동사\u003c/em>\u003cspan>머무르다, 계속 살다\u003c/span>\u003c/div>\u003cdiv>\u003cb>sad\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>슬픈\u003c/span>\u003c/div>\u003cdiv>\u003cb>heavy heart\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>무거운 마음\u003c/span>\u003c/div>\u003cdiv>\u003cb>turn over\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>뒤집다\u003c/span>\u003c/div>\u003cdiv>\u003cb>improvement\u003c/b>\u003cem>명사\u003c/em>\u003cspan>개선, 향상\u003c/span>\u003c/div>\u003cdiv>\u003cb>agree to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 동의하다, 받아들이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>demanded\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>요구된, 요구하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>surprised\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>놀란\u003c/span>\u003c/div>\u003cdiv>\u003cb>realize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>깨닫다, 알아차리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>longer than\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~보다 더 긴\u003c/span>\u003c/div>\u003cdiv>\u003cb>with this in mind\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>이것을 염두에 두고\u003c/span>\u003c/div>\u003cdiv>\u003cb>humbly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>겸허하게, 겸손하게\u003c/span>\u003c/div>\u003cdiv>\u003cb>greet\u003c/b>\u003cem>동사\u003c/em>\u003cspan>맞이하다, 인사하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>meaningful\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>의미 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>talk\u003c/b>\u003cem>명사\u003c/em>\u003cspan>대화, 이야기\u003c/span>\u003c/div>\u003cdiv>\u003cb>side\u003c/b>\u003cem>명사\u003c/em>\u003cspan>면, 쪽\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어 몇 개만 짚을게요. behavior는 행동이나 처신이라는 뜻이고, have had enough는 더 이상 참을 수 없다는 관용 표현이에요. improvement는 개선이라는 뜻으로 아버지가 쪽지 뒷면에 적은 내용을 가리키고, realize는 깨닫다, humbly는 겸허하게라는 뜻으로 결론의 분위기를 만들어 줍니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">destroy\u003c/b>\u003cspan class=\"m\">망치다, 파괴하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">ruin\u003c/span>\u003cspan class=\"s\">wreck\u003c/span>\u003cspan class=\"s\">demolish\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">build\u003c/span>\u003cspan class=\"a\">create\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">permission\u003c/b>\u003cspan class=\"m\">허락, 허가\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">consent\u003c/span>\u003cspan class=\"s\">approval\u003c/span>\u003cspan class=\"s\">authorization\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">prohibition\u003c/span>\u003cspan class=\"a\">refusal\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">decide\u003c/b>\u003cspan class=\"m\">결정하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">determine\u003c/span>\u003cspan class=\"s\">resolve\u003c/span>\u003cspan class=\"s\">choose\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hesitate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">improvement\u003c/b>\u003cspan class=\"m\">개선, 향상\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">enhancement\u003c/span>\u003cspan class=\"s\">betterment\u003c/span>\u003cspan class=\"s\">progress\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">deterioration\u003c/span>\u003cspan class=\"a\">decline\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">realize\u003c/b>\u003cspan class=\"m\">깨닫다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">recognize\u003c/span>\u003cspan class=\"s\">notice\u003c/span>\u003cspan class=\"s\">perceive\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">overlook\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">humble\u003c/b>\u003cspan class=\"m\">겸허한, 겸손한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">modest\u003c/span>\u003cspan class=\"s\">meek\u003c/span>\u003cspan class=\"s\">unassuming\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">arrogant\u003c/span>\u003cspan class=\"a\">proud\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">meaningful\u003c/b>\u003cspan class=\"m\">의미 있는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">significant\u003c/span>\u003cspan class=\"s\">profound\u003c/span>\u003cspan class=\"s\">important\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">trivial\u003c/span>\u003cspan class=\"a\">insignificant\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 함께 정리해 볼게요. destroy는 ruin, wreck으로 바꿔 쓸 수 있고 반대말은 build나 create예요. permission은 consent, approval과 동의어이고 반대는 refusal이죠. improvement는 enhancement, progress로 바꿔 쓸 수 있고 반대말은 deterioration이에요. humble은 modest, unassuming과 가깝고 반대말은 arrogant, proud이고, 마지막으로 meaningful은 significant, profound와 동의어, 반대말은 trivial이에요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 부모가\u003c/span>\u003cspan class=\"en\">Some parents\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아들이 있었다\u003c/span>\u003cspan class=\"en\">had a son\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 아들의 행동이 너무 빗나가서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">whose \u003c/span>\u003cspan class=\"tgt\">behavior\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">gotten\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">so \u003c/span>\u003cspan class=\"tgt\">bad \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가정을 망칠 지경이었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> it was destroying the family.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">아들의 행동이 너무 빗나가서 가정을 망칠 지경에 놓인 부모가 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이야기의 배경을 깔아 주는 첫 문장이에요. 아들의 행동이 \u003cb class=\"key\">가정 \u003c/b>\u003cb class=\"key\">전체\u003c/b>를 흔들 만큼 심각하다는 것을 so bad that으로 강하게 보여 주죠. 뒤에 이어질 아버지의 결심이 왜 필요했는지 이유를 미리 제시하는 역할도 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계대명사 whose(소유격)\u003c/span> : 선행사(a son) + whose + 명사(behavior) + 동사 : \"그 아들의 행동이\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거완료(have + p.p.)\u003c/span> : had + p.p.(gotten) : \"(그 전에 이미) 빗나가게 되어 있었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">so ~ that 구문(정도·결과)\u003c/span> : so + 형용사(bad) + that + 주어 + 동사 : \"너무 빗나가서 ~할 지경이었다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Some parents, 어떤 부모가. had a son, 아들이 있었다. whose behavior had gotten so bad, 그 아들의 행동이 너무 빗나가서. that it was destroying the family, 가정을 망칠 지경이었다. 이 문장 전체를 해석하면, 아들의 행동이 너무 빗나가서 가정을 망칠 지경에 놓인 부모가 있었다.","hl":"m"},{"n":13,"text":"이 문장은 이야기의 배경을 깔아 주는 첫 문장이에요. 아들의 행동이 가정 전체를 흔들 만큼 심각하다는 걸 so bad that으로 강하게 보여 주죠. 그래서 뒤에 아버지가 왜 결심하게 되는지 자연스럽게 이해가 됩니다.","hl":"mn"},{"n":14,"text":"먼저 whose behavior에서 whose는 소유격 관계대명사예요. 앞의 a son을 받아서 그 아들의 행동이라고 이어 주는 거죠. 두 번째로 had gotten은 과거완료로, 이야기가 시작되기 전에 더 이전부터 이미 행동이 나빠져 있었다는 걸 보여 줍니다. 세 번째로 so bad that은 so와 that 사이에 형용사를 넣어 정도와 결과를 한꺼번에 말하는 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어느 날\u003c/span>\u003cspan class=\"en\">One day,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아들이 가버렸다\u003c/span>\u003cspan class=\"en\">the son \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">went \u003c/span>\u003cspan class=\"tgt\">away\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">친구들이랑\u003c/span>\u003cspan class=\"en\">with his friends\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">3일 동안\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">three \u003c/span>\u003cspan class=\"tgt\">days\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">허락도 없이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">without \u003c/span>\u003cspan class=\"tgt\">permission\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어느 날, 아들이 허락도 없이 친구들이랑 3 일 동안 어디론가 가버렸다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아들이 허락 없이 사흘 동안 집을 비운 사건을 담은 문장이에요. 앞 문장에서 쌓인 문제가 실제 사건으로 터진 장면이라, 아버지가 결심하게 되는 \u003cb class=\"key\">직접적인 \u003c/b>\u003cb class=\"key\">계기\u003c/b>가 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">구동사(동사 + 부사)\u003c/span> : go away = go(동사) + away(부사) : \"가버렸다, 떠나 버렸다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 for + 기간\u003c/span> : for + 기간 명사(three days) : \"3일 동안\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 without + 무관사 명사\u003c/span> : without + 명사(permission) : \"허락 없이\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"One day, 어느 날. the son went away, 아들이 가버렸다. with his friends, 친구들이랑. for three days, 3일 동안. without permission, 허락도 없이. 이 문장 전체를 해석하면, 어느 날, 아들이 허락도 없이 친구들이랑 3 일 동안 어디론가 가버렸다.","hl":"m"},{"n":16,"text":"이 문장은 아들이 허락 없이 사흘 동안 집을 비운 사건을 담고 있어요. 앞에서 쌓인 문제가 실제 사건으로 터진 장면이라서, 아버지가 결심하게 되는 직접적인 계기가 됩니다.","hl":"mn"},{"n":17,"text":"첫 번째로 went away는 go에 away가 붙은 구동사예요. away가 떠나 버림의 느낌을 더해 주죠. 두 번째로 for three days에서 for는 기간의 길이를 말하는 전치사예요. 세 번째로 without permission에서 permission은 불가산명사라서 관사 없이 쓰인다는 점도 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아버지는\u003c/span>\u003cspan class=\"en\">The father\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 이상 참을 수가 없었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">had\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">enough\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">아버지는 더 이상 참을 수가 없었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> have had enough는 '충분히 가졌다'에서 나온 관용 표현으로, 참을 만큼 참아 \u003cb class=\"key\">한계\u003c/b>에 이르렀다는 뜻이에요. 아주 짧은 문장이지만 아버지의 인내가 바닥났다는 감정을 강하게 전달하며, 다음 문장의 결심으로 자연스럽게 넘어가는 연결 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거완료(have의 과거완료)\u003c/span> : had(조동사) + p.p.(had) : \"(그때 이미) 충분히 가져 버렸다 → 더는 못 참았다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">enough의 명사적 용법\u003c/span> : have(타동사) + enough(목적어) : \"충분한 것, 충분한 양\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"The father, 아버지는. had had enough, 더 이상 참을 수가 없었다. 이 문장 전체를 해석하면, 아버지는 더 이상 참을 수가 없었다.","hl":"m"},{"n":19,"text":"have had enough는 충분히 가졌다는 말에서 나온 관용 표현으로, 참을 만큼 참아 한계에 이르렀다는 뜻이에요. 짧은 문장이지만 아버지의 인내가 바닥났다는 감정이 강하게 느껴지고, 바로 다음에 어떤 결심이 이어질지 궁금하게 만듭니다.","hl":"mn"},{"n":20,"text":"첫 번째로 had had를 보면 앞의 had는 조동사이고 뒤의 had는 have의 과거분사예요. 그래서 충분히 가져 버렸다, 즉 더는 못 참겠다는 뜻이 되죠. 두 번째로 enough는 여기서 충분한 양이라는 명사로 목적어 역할을 하고 있어요. 형용사를 꾸밀 때 뒤에서 쓰이는 enough와 헷갈리지 않게 정리해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 마음먹었다\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">decided \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아들이 선택을 해야 한다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">son \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">choice\u003c/span>:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">삶에 변화를 가져오든지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">changes \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">life \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">집에서 나가든지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">leave \u003c/span>\u003cspan class=\"tgt\">home\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 아들이 삶에 변화를 가져오든지 집에서 나가든지 선택을 하도록 해야겠다고 마음먹었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아버지가 더는 참지 못하고 아들에게 \u003cb class=\"key\">선택\u003c/b>을 요구하는 장면이에요. 콜론(:) 뒤에 삶의 변화와 집을 떠나는 두 갈래가 \u003cb class=\"key\">동사원형\u003c/b>으로 나란히 제시되어, 결심의 무게가 딱 떨어지는 느낌으로 전달됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that의 생략(목적어절)\u003c/span> : decide + [(that) + 주어 + would + 동사] : \"아들이 선택을 해야 한다고 마음먹었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 would + have to(의무)\u003c/span> : [주어] + would have to + [동사원형] : \"~해야 할 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동사원형의 병렬(A or B)\u003c/span> : [동사원형 A] or [동사원형 B] : \"삶에 변화를 가져오든지 집에서 나가든지\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"He decided, 그는 마음먹었다. his son would have to make a choice, 아들이 선택을 해야 한다고. make changes to his life, 삶에 변화를 가져오든지. or leave home, 집에서 나가든지. 이 문장 전체를 해석하면, 그는 아들이 삶에 변화를 가져오든지 집에서 나가든지 선택을 하도록 해야겠다고 마음먹었다.","hl":"m"},{"n":22,"text":"아버지가 더는 참지 못하고 아들에게 선택을 요구하는 장면이에요. 콜론 뒤에 두 가지 선택지가 나오는데, 둘 다 동사원형으로 시작해서 명령처럼 딱 떨어지는 느낌을 줍니다. 그래서 이 문장은 가족 이야기의 갈림길을 보여 주는 핵심 문장이에요.","hl":"mn"},{"n":23,"text":"첫 번째로 decided 뒤에 접속사 that이 생략된 목적어절이 바로 이어진다는 점을 보세요. 두 번째로 would have to는 will의 과거형 would에 have to가 붙어서 해야 한다는 의무를 간접적으로 표현한 형태예요. 세 번째로 콜론 뒤에서 make와 leave가 동사원형으로 나란히 이어지면서 두 선택지를 병렬로 제시하고 있죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아버지가 기다리는 동안,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">While \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">father \u003c/span>\u003cspan class=\"tgt\">waited\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 꺼냈다\u003c/span>\u003cspan class=\"en\">he \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">took \u003c/span>\u003cspan class=\"tgt\">out\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">메모지를\u003c/span>\u003cspan class=\"en\">a note card.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">아버지는 기다리는 동안, 메모지를 꺼냈다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 결심을 마친 아버지가 실제로 무언가를 준비하는 장면이에요. 기다리는 동안 \u003cb class=\"key\">메모지\u003c/b>를 꺼냈다는 이 짧은 문장이 다음 문장의 나열로 자연스럽게 이어지는 \u003cb class=\"key\">디딤돌\u003c/b> 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 while의 시간 부사절\u003c/span> : While + [주어 + 동사], [주어 + 동사] : \"아버지가 기다리는 동안\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">구동사(take out)와 목적어 위치\u003c/span> : take + [목적어] + out / take out + [목적어] : \"꺼냈다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"While the father waited, 아버지가 기다리는 동안. he took out, 그는 꺼냈다. a note card, 메모지를. 이 문장 전체를 해석하면, 아버지는 기다리는 동안, 메모지를 꺼냈다.","hl":"m"},{"n":25,"text":"결심을 마친 아버지가 실제로 무언가를 준비하는 장면이에요. 기다리는 동안 메모지를 꺼냈다는 이 짧은 문장이 바로 다음 문장의 나열로 이어지는 디딤돌이 되는 거죠.","hl":"mn"},{"n":26,"text":"첫 번째로 while이 이끄는 시간 부사절은 아버지가 기다리는 동안이라는 배경 시간을 만들어 줍니다. 두 번째로 took out은 동사와 부사가 굳어진 구동사라서, 목적어가 대명사일 때는 반드시 사이에 넣어야 한다는 것도 같이 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것에(메모지에)\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">On \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 쭉 나열했다\u003c/spa 을 적으려는 \u003cb class=\"key\">전환\u003c/b>을 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">with + 명사구(양태·부대상황)\u003c/span> : with + [a sad and heavy heart (명사구)] : \"슬프고 무거운 마음으로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">구동사 turn over의 목적어 분리\u003c/span> : turn + [목적어] + over : \"쪽지를 뒤집다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"With a sad and heavy heart, 슬프고 무거운 마음으로. the father, 아버지는. turned, 뒤집었다. the card, 쪽지를. over, 완전히.. 이 문장 전체를 해석하면, 슬프고 무거운 마음으로, 아버지는 쪽지를 뒤집었다.","hl":"m"},{"n":31,"text":"아버지가 슬프고 무거운 심정으로 쪽지를 뒤집는 장면이에요. 앞면에는 아들에게 요구할 변화가 적혀 있고, 이제 뒷면에 자신이 바꿀 점을 적으려는 전환이죠.","hl":"mn"},{"n":32,"text":"첫 번째로 With a sad and heavy heart는 with 뒤에 명사구가 와서 슬프고 무거운 마음이라는 양태를 나타내요. 두 번째로 turned the card over는 turn over라는 구동사에서 목적어 the card가 over 앞에 들어간 형태예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">뒷면에\u003c/span>\u003cspan class=\"en\">On the back,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 시작했다\u003c/span>\u003cspan class=\"en\">he \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">began \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">적기\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">write \u003c/span>\u003cspan class=\"tgt\">down\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">개선해야 할 것들을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">improvements \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신이 할\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">make\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아들이 받아들인다면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">if \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">boy \u003c/span>\u003cspan class=\"tgt\">agreed\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">요구하는 변화들에\u003c/span>\u003cspan class=\"en\">to \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">demanded \u003c/span>\u003cspan class=\"tgt\">changes\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">뒷면에 그는 자신이 요구하는 변화를 아들이 받아들일 경우 자신이 개선해야 할 것들을 적기 시작했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아버지가 쪽지 뒷면에, 아들이 요구된 변화를 받아들이는 경우 자신이 개선할 점을 적기 시작했다는 뜻이에요. 앞면이 아들에게 요구하는 조건이라면, 뒷면은 아버지 자신의 \u003cb class=\"key\">반성\u003c/b>과 \u003cb class=\"key\">변화 \u003c/b>\u003cb class=\"key\">의지\u003c/b>를 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : begin + [to write down (to부정사구/목적어)] : \"적기 시작했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 생략\u003c/span> : [the improvements (that/which) + he would make] : \"자신이 개선할 것들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">if 조건의 부사절\u003c/span> : if + [주어 + 동사] : \"아들이 받아들인다면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">과거분사의 형용사적 용법(수동)\u003c/span> : [the + demanded (과거분사) + changes] : \"요구하는 변화들\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"On the back, 뒷면에. he began, 그는 시작했다. to write down, 적기. the improvements, 개선해야 할 것들을. he would make, 자신이 할. if his boy agreed, 아들이 받아들인다면. to the demanded changes, 요구하는 변화들에. 이 문장 전체를 해석하면, 뒷면에 그는 자신이 요구하는 변화를 아들이 받아들일 경우 자신이 개선해야 할 것들을 적기 시작했다.","hl":"m"},{"n":34,"text":"이 문장은 아버지가 쪽지 뒷면에 자신이 개선할 점을 적기 시작했다는 뜻이에요. 앞면은 아들에게 요구하는 조건이고, 뒷면은 아버지 자신의 반성과 변화 의지가 담긴 거죠.","hl":"mn"},{"n":35,"text":"첫 번째로 began to write down은 begin 뒤에 to부정사가 목적어로 온 표현이에요. 두 번째로 the improvements he would make에서는 목적격 관계대명사가 생략되어 improvements를 꾸며 줘요. 세 번째로 if his boy agreed는 if가 조건을 이끄는 접속사로 쓰인 조건의 부사절이에요. 네 번째로 the demanded changes에서 demanded는 과거분사로 수동의 의미를 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 놀랐다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">He \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">surprised\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">깨달았을 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">realized\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 목록이 더 길다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">list \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">longer\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아들의 것보다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">son's\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 자신이 적은 게 아들의 것보다 더 길다는 것을 깨닫고 깜짝 놀랐다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아버지가 자신의 개선 목록이 아들의 목록보다 더 길다는 사실을 깨닫고 놀랐다는 뜻이에요. 이 장면은 아버지가 자기 \u003cb class=\"key\">반성\u003c/b>의 분량이 더 크다는 것을 인정하는 \u003cb class=\"key\">전환점\u003c/b>이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">감정을 나타내는 수동태\u003c/span> : [be + surprised (과거분사)] : \"그는 놀랐다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 when의 시간 부사절\u003c/span> : when + [주어 + 동사] : \"깨달았을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">접속사 that의 명사절(목적어)\u003c/span> : realize + [that + 주어 + 동사] : \"자신의 목록이 더 길다는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">비교급 than과 소유대명사\u003c/span> : longer + than + [his son's] : \"아들의 것보다 더 긴\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"He was surprised, 그는 놀랐다. when he realized, 깨달았을 때. that his list was longer, 자신의 목록이 더 길다는 것을. than his son's, 아들의 것보다. 이 문장 전체를 해석하면, 그는 자신이 적은 게 아들의 것보다 더 길다는 것을 깨닫고 깜짝 놀랐다.","hl":"m"},{"n":37,"text":"이 문장은 아버지가 자기 개선 목록이 아들의 목록보다 더 길다는 걸 깨닫고 놀랐다는 뜻이에요. 여기서 아버지는 자신의 반성이 더 크다는 사실을 인정하는 전환점을 맞는 거죠.","hl":"mn"},{"n":38,"text":"첫 번째로 He was surprised는 surprise가 놀라게 하다라는 타동사라서 be surprised라는 수동태로 놀라다를 표현해요. 두 번째로 when he realized는 when이 이끄는 시간의 부사절이에요. 세 번째로 that his list was longer에서는 that절이 realize의 목적어로 깨달은 내용을 담고, 네 번째로 than his son's에서 his son's는 list를 반복하지 않은 소유대명사로 아들의 것을 뜻해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것을 염두에 두고,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">With \u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">mind\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아버지는 겸허하게 아들을 맞이했다\u003c/span>\u003cspan class=\"en\">the father \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">humbly \u003c/span>\u003cspan class=\"tgt\">greeted\u003c/span> his son\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그가 돌아왔을 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">returned\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것을 염두에 두고, 아버지는 아들이 돌아왔을 때 겸허하게 아들을 맞이했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 아버지는 자기 목록이 아들 목록보다 길다는 사실을 깨닫고 자신을 돌아봤어요. 그 깨달음을 \u003cb class=\"key\">마음에 \u003c/b>\u003cb class=\"key\">담은 \u003c/b>\u003cb class=\"key\">채\u003c/b> 아들을 \u003cb class=\"key\">겸허한 \u003c/b>\u003cb class=\"key\">태도\u003c/b>로 맞이하는 장면이라, 이 문장은 이야기의 \u003cb class=\"key\">전환점\u003c/b> 역할을 합니다. 'with this in mind'는 바로 앞 내용을 그대로 이어받는 연결 표현이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">with + 목적어 + 전치사구(부대상황 구문)\u003c/span> : with + [this (목적어)] + [in mind (전치사구/상태 설명)] : \"이것을 염두에 두고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부사가 동사를 수식\u003c/span> : [humbly (부사)] + [greeted (동사)] : \"겸허하게 맞이했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">시간의 접속사 when이 이끄는 부사절\u003c/span> : when + [he returned (주어+동사)] : \"그가 돌아왔을 때\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"With this in mind, 이것을 염두에 두고. the father humbly greeted his son, 아버지는 겸허하게 아들을 맞이했다. when he returned, 그가 돌아왔을 때. 이 문장 전체를 해석하면, 이것을 염두에 두고, 아버지는 아들이 돌아왔을 때 겸허하게 아들을 맞이했다.","hl":"m"},{"n":40,"text":"앞에서 아버지가 자기 목록이 아들 목록보다 길다는 걸 깨달았죠. 그 깨달음을 마음에 담은 채, 다시 말해 이것을 염두에 두고 아들을 맞이한 거예요. 그래서 이 문장은 아버지의 태도가 완전히 달라지는 전환점이에요. 겸허한 태도로 아들을 맞이하는 모습이 참 인상적이죠.","hl":"mn"},{"n":41,"text":"첫 번째, With this in mind는 with 뒤에 목적어 this가 오고 in mind가 그 상태를 설명하는 부대상황 구문이에요. 그래서 이것을 염두에 두고라고 해석합니다. 두 번째, humbly는 humble에 ly가 붙은 부사로 동사 greeted를 꾸며 주면서 아버지의 태도를 보여 줘요. 세 번째, when은 시간을 이끄는 접속사로 he returned라는 부사절을 만들고, 여기서 he는 아들을 가리킨다는 것도 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 두 사람은 의미 있는 대화를 시작했다\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">began \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">meaningful \u003c/span>\u003cspan class=\"tgt\">talk\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">쪽지의 아버지 면을 시작으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">starting \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">father's \u003c/span>\u003cspan class=\"tgt\">side \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">card\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 두 사람은 쪽지의 아버지 면을 시작으로 의미 있는 대화를 시작했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아버지가 아들에게 요구할 것만 적은 것이 아니라 자기 쪽 쪽지를 먼저 꺼내 대화를 열었다는 장면이에요. 'starting with ~'는 \u003cb class=\"key\">~을 \u003c/b>\u003cb class=\"key\">시작으로\u003c/b>라는 뜻으로, 대화가 \u003cb class=\"key\">아버지의 \u003c/b>\u003cb class=\"key\">변화\u003c/b>에서 출발했음을 강조합니다. 이 문장이 가족이 회복되는 \u003cb class=\"key\">결말\u003c/b>을 맺어 주는 부분이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">타동사 begin + 목적어\u003c/span> : began [타동사] + [a meaningful talk (목적어)] : \"의미 있는 대화를 시작했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재분사의 분사구문(동시동작·부대상황)\u003c/span> : [They began a meaningful talk], starting with [the father's side of the card] : \"쪽지의 아버지 면을 시작으로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">소유격과 전치사구에 의한 명사 수식\u003c/span> : the father's + [side (명사)] + of the card [전치사구] : \"쪽지의 아버지 면\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"They began a meaningful talk, 그 두 사람은 의미 있는 대화를 시작했다. starting with the father's side of the card, 쪽지의 아버지 면을 시작으로. 이 문장 전체를 해석하면, 그 두 사람은 쪽지의 아버지 면을 시작으로 의미 있는 대화를 시작했다.","hl":"m"},{"n":43,"text":"아버지가 아들 몫의 쪽지만 내미는 게 아니라, 자기 쪽 쪽지를 먼저 꺼내서 대화를 시작했어요. 이걸 보고 대화가 아버지의 변화에서 출발했다는 걸 알 수 있죠. 그래서 이 문장이 가족이 다시 회복되는 결말을 맺어 주는 부분이에요.","hl":"mn"},{"n":44,"text":"먼저 starting with 이하는 주어가 They와 같아서 접속사와 주어를 지우고 동사를 현재분사로 바꾼 분사구문이에요. 그래서 ~을 시작으로, 혹은 ~로 시작하면서라는 동시동작으로 해석합니다. 그리고 began은 뒤에 목적어를 바로 받는 타동사라서 a meaningful talk가 전치사 없이 그대로 목적어로 온다는 점도 챙겨 두세요. 마지막으로 the father's가 명사 side를 꾸미고 of the card가 그 대상이 되는 면을 한정해 준다고 이해하면 됩니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>아들의 \u003cb class=\"key\">행동\u003c/b>이 너무 나빠져 가정을 망칠 지경이었고, 아들은 허락 없이 사흘 동안 집을 비웠다.\u003c/li>\u003cli>아버지는 더 이상 참을 수 없어 아들에게 삶의 \u003cb class=\"key\">변화\u003c/b>를 만들든지 집을 떠나든지 선택하라고 했다.\u003c/li>\u003cli>아버지는 아들에게 요구할 것을 적은 쪽지를 뒤집어 자신이 \u003cb class=\"key\">개선\u003c/b>해야 할 것도 적었고, 그 목록이 아들의 것보다 더 길다는 것을 깨달았다.\u003c/li>\u003cli>그는 \u003cb class=\"key\">겸허하게\u003c/b> 아들을 맞이했고, 두 사람은 쪽지의 아버지 면부터 시작해 의미 있는 대화를 나누었다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>When a father listed the changes he himself had to make, his list turned out longer than his son's, and that realization led him to greet his son humbly and begin a meaningful talk.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">아버지는 허락 없이 사흘 동안 집을 비운 아들에게 집에 남으려면 \u003cb class=\"key\">고쳐야 \u003c/b>\u003cb class=\"key\">할 \u003c/b>\u003cb class=\"key\">것\u003c/b>들을 나열했지만, 쪽지를 뒤집어 자신이 \u003cb class=\"key\">개선해야 \u003c/b>\u003cb class=\"key\">할 \u003c/b>\u003cb class=\"key\">것\u003c/b>들을 적어 보니 그 목록이 아들의 것보다 더 길었다. 그는 이 깨달음을 염두에 두고 아들을 \u003cb class=\"key\">겸허하게\u003c/b> 맞이해 의미 있는 대화를 시작했다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":45,"text":"오늘 지문은 쪽지 한 장이 가정의 분위기를 바꾼 이야기였어요. 아버지는 아들에게 요구할 것만 적는 데서 멈추지 않고, 쪽지를 뒤집어 자신이 개선해야 할 것을 먼저 적었죠. 그 목록이 더 길다는 깨달음이 그를 겸허하게 만들었고, 결국 의미 있는 대화로 이어졌어요. 시험에서 이런 이야기 글은 결말의 대조와 마지막 문장의 주제를 꼭 확인하는 습관을 기억해 주세요. 오늘 수업은 여기까지입니다, 수고했어요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
