<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SO 레벨1 18강 적용독해01 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-sno{font-size:13px;color:#8493A1;font-weight:700;margin-bottom:8px}

.lp-chunk{display:flex;flex-direction:column}
.lp-chunk .ko{font-size:13px;color:var(--pk-t);font-weight:700;line-height:1.3;margin-bottom:2px}
.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}
.lp-top::before{height:5px;background:linear-gradient(90deg,var(--pk) 0,var(--pk) 80%,var(--am) 80%,var(--am) 100%)}
.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}
.lp-tag{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700;padding:2px 12px}
.lp-qn{flex:0 0 112px;height:112px;align-self:center;background:#fff;color:var(--pk);border:3px solid var(--pk);border-radius:50%;font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;font-size:26px}
.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}
.lp-qn .qt{display:block;white-space:nowrap;line-height:1.12;letter-spacing:-.02em}
.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}

.lp-st h4{color:var(--ink,#1B2733)}
.lp-st h4 i{border-radius:4px;width:auto;min-width:24px;padding:0 4px}
.lp-pill{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700}
.lp-chain span.c{background:#fff;border:1px solid #AEBBE6;border-radius:3px;font-weight:600}

.lp-vg em{background:#fff;border:1px solid var(--pk-b);border-radius:3px}
.lp-sa>div{border-radius:4px;border-color:var(--pk-b)}

.lp-chips .s{border:1px solid #AEBBE6;color:#3A4FA3}
.lp-chips .a{border:1px solid var(--am-b);color:var(--am-d);background:#FFFBF2}
.lp-sno .es{background:var(--am);border-radius:2px;font-weight:700}
.lp-chunk .en{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:600}
.lp-chunk+.lp-chunk{border-left:1px solid var(--pk-b)}
.lp .tgt{background:var(--am-l);border-bottom:2.5px dotted var(--am)}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"SO 레벨1 18강 적용독해01","audioDir":"18-01_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">18강\u003cbr>적용독해01\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">SO 레벨1\u003c/div>\u003ch1>Transport: Not Always Taken for Granted\u003c/h1>\u003ch2>운송: 언제나 당연했던 것은 아니다\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>운송은 오늘날 모든 사람이 \u003cb class=\"key\">당연하게 \u003c/b>\u003cb class=\"key\">여기는\u003c/b> 것이지만, 과거에는 \u003cb class=\"key\">보편적으로\u003c/b> 이용 가능하지 않았다. 속도와 필요의 한계 때문에 \u003cb class=\"key\">기동성\u003c/b>이 제한되었고, \u003cb class=\"key\">대다수\u003c/b>는 평생 집 가까이에서 살며 단체 여행이나 \u003cb class=\"key\">통근\u003c/b>을 경험하지 못했다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Transport has not always been so universally available, and past limits on speed and need kept most people close to home.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 볼 지문은 교통과 이동을 주제로 한 글이에요. 우리가 늘 당연하게 쓰는 교통수단이 사실은 아주 최근에야 보편해졌다는 이야기죠. 이 글은 과거의 제한된 이동을 근거로 삼아 오늘날의 이동이 얼마나 특별한지 되짚어 줍니다. 요지는 교통과 기동성이 항상 보편적으로 이용 가능했던 것은 아니라는 점이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">오늘날 우리는 버스나 지하철, 비행기를 타고 하루에도 수십 킬로미터를 움직여요. 이렇게 사람이 다른 장소로 쉽고 빠르게 옮겨 갈 수 있는 능력을 \u003cb class=\"key\">기동성\u003c/b>(mobility)이라고 불러요. 과거에는 도로 사정이 나쁘고 동력원이 사람과 말뿐이라서 \u003cb class=\"key\">운송 \u003c/b>\u003cb class=\"key\">수단\u003c/b>(vehicle)이 시속 십 마일을 넘기 어려웠어요. 그래서 대부분의 사람은 평생 집 근처에서 살았고 일터도 걸어서 갈 수 있는 곳이었죠. 마치 엘리베이터가 없던 시절을 상상하기 어려운 것처럼, 과거 사람들은 매일 먼 곳으로 \u003cb class=\"key\">통근\u003c/b>하는 삶을 상상하기 어려웠어요. 기술이 발달하며 \u003cb class=\"key\">교통\u003c/b>이 보편화되었고, 그 결과 이동은 특권이 아니라 \u003cb class=\"key\">당연한 \u003c/b>\u003cb class=\"key\">것\u003c/b>이 되었습니다.\u003c/div>","segs":[{"n":2,"text":"오늘날 우리는 버스나 지하철, 비행기를 타고 하루에도 수십 킬로미터를 움직이죠. 이렇게 사람이 다른 장소로 쉽고 빠르게 옮겨 갈 수 있는 능력을 우리는 기동성, 영어로 mobility라고 불러요. 과거에는 도로 사정이 나쁘고 동력원이 사람과 말뿐이어서 운송 수단의 속도가 시속 십 마일을 넘기 어려웠어요. 그래서 대부분의 사람은 평생 집 근처에서 살았고 일터도 걸어서 갈 수 있는 곳이었죠. 마치 엘리베이터가 없던 시절을 상상하기 어려운 것처럼, 과거 사람들은 매일 먼 곳으로 통근하는 삶을 상상하기 어려웠어요. 기술이 발달하면서 교통이 보편화되었고, 그 결과 이동은 특권이 아니라 당연한 것이 되었습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>당연함과 반박\u003csmall>도입·통념 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>글은 운송이 모든 사람이 \u003cb class=\"key\">당연하게 \u003c/b>\u003cb class=\"key\">여기는\u003c/b> 것이라는 통념으로 시작해요. 그러나 곧바로 However를 써서 그것이 항상 \u003cb class=\"key\">보편적으로\u003c/b> 이용 가능했던 것은 아니라고 \u003cb class=\"key\">반박\u003c/b>합니다. 오늘날의 당연함을 과거에 그대로 대입하면 안 된다는 문제 제기인 셈이에요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>속도의 한계\u003csmall>근거 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>이백오십 년 전에는 육지에서 시속 십 마일을 넘는 \u003cb class=\"key\">운송 \u003c/b>\u003cb class=\"key\">수단\u003c/b>이 없었다는 근거를 제시해요. 그래서 여행을 한 사람은 \u003cb class=\"key\">소수\u003c/b>에 불과했죠. 그보다 더 빨리 이동해야 할 \u003cb class=\"key\">필요\u003c/b>조차 거의 없었다고 덧붙입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>가치의 부재\u003csmall>부연 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>Indeed로 강조하며 \u003cb class=\"key\">기동성\u003c/b>이 이용 가능하지도, 오늘날처럼 \u003cb class=\"key\">가치 \u003c/b>\u003cb class=\"key\">있게 \u003c/b>\u003cb class=\"key\">여겨지지\u003c/b>도 않았다고 말해요. 그래서 \u003cb class=\"key\">대다수\u003c/b>의 사람들은 전 생애를 집 가까이에서 보냈습니다. 이동 자체가 일상의 선택지가 아니었던 셈이죠.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>일상의 모습\u003csmall>예시·결론 · 문장 7–8\u003c/small>\u003c/h4>\u003cp>관광 여행도 \u003cb class=\"key\">단체 \u003c/b>\u003cb class=\"key\">여행\u003c/b>도 없었다는 예시가 이어져요. 근로자들은 일터에서 \u003cb class=\"key\">걸어서 \u003c/b>\u003cb class=\"key\">갈 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">있는 \u003c/b>\u003cb class=\"key\">거리\u003c/b>에 살았기 때문에 \u003cb class=\"key\">통근\u003c/b>할 필요가 없었죠. 결국 이동이 필요 없는 삶이 당시의 평범한 일상이었다고 정리할 수 있습니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 네 단계로 나눠서 따라가 볼게요.","hl":null},{"n":4,"text":"첫 단계는 통념과 반박이에요. 글은 운송이 모든 사람이 당연하게 여기는 것이라는 이야기로 시작합니다. 그런데 두 번째 문장에서 However를 써서 그것이 항상 보편적으로 이용 가능했던 것은 아니라고 반박하죠. 오늘날의 당연함을 과거에 그대로 적용하면 안 된다는 문제 제기인 셈이에요.","hl":"f0"},{"n":5,"text":"다음은 근거 단계예요. 이백오십 년 전에는 육지에서 시속 십 마일을 넘는 운송 수단이 없었다는 사실을 제시합니다. 그래서 여행을 한 사람은 소수에 불과했죠. 그보다 더 빨리 이동해야 할 필요조차 거의 없었다고 덧붙여요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 부연이에요. Indeed로 강조하면서 기동성은 이용 가능하지도 않았고 오늘날처럼 가치 있게 여겨지지도 않았다고 말합니다. 그래서 대다수의 사람들은 전 생애를 집 가까이에서 보냈죠. 이동이 일상의 선택지가 아니었던 거예요.","hl":"f2"},{"n":7,"text":"마지막 단계는 예시와 마무리예요. 관광 여행도, 단체 여행도 없었다는 예시가 이어집니다. 그리고 근로자들은 일터에서 걸어서 갈 수 있는 거리에 살았기 때문에 통근할 필요가 없었다고 정리해요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">통념-반박\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 2번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 '교통은 당연하다'는 \u003cb class=\"key\">통념\u003c/b>을 첫 문장에 놓고, 두 번째 문장에서 However로 \u003cb class=\"key\">반박\u003c/b>하는 \u003cb class=\"key\">통념-반박\u003c/b> 전개 방식을 취해요. 핵심 \u003cb class=\"key\">주제문\u003c/b>이 글 앞부분에 있으므로 \u003cb class=\"key\">두괄식\u003c/b>이라고 볼 수 있습니다. 이후에는 과거의 속도, 필요, 가치, 생활 모습을 \u003cb class=\"key\">근거\u003c/b>로 늘어놓아 주제를 뒷받침해요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>takes for granted (1)\u003c/b>\u003cspan>통념 제시\u003c/span>\u003cb>However (2)\u003c/b>\u003cspan>반박·전환\u003c/span>\u003cb>because (3)\u003c/b>\u003cspan>원인 제시\u003c/span>\u003cb>Indeed (5)\u003c/b>\u003cspan>강조·부연\u003c/span>\u003cb>because (8)\u003c/b>\u003cspan>원인 제시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">universally available\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">neither available nor as valued as it is today\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">no tourism\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">no mass travel\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>과거 (이백오십 년 전)\u003c/th>\u003cth>오늘날\u003c/th>\u003c/tr>\u003ctr>\u003ctd>시속 십 마일을 넘기 어려움\u003c/td>\u003ctd>빠른 이동 수단이 보편화됨\u003c/td>\u003c/tr>\u003ctr>\u003ctd>더 빨리 이동할 필요가 거의 없음\u003c/td>\u003ctd>통근과 여행이 일상이 됨\u003c/td>\u003c/tr>\u003ctr>\u003ctd>기동성이 이용 가능하지도, 가치 있게 여겨지지도 않음\u003c/td>\u003ctd>기동성이 당연하게 여겨짐\u003c/td>\u003c/tr>\u003ctr>\u003ctd>관광·단체 여행·통근이 없음\u003c/td>\u003ctd>관광·단체 여행·통근이 일반적임\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 통념과 반박이에요. 교통은 당연하다는 통념을 첫 문장에 놓고, However가 들어간 두 번째 문장에서 그것을 뒤집습니다. 핵심 주제문이 글 앞부분에 있으니 두괄식이라고 보면 돼요. 뒤에 나오는 과거의 속도, 필요, 가치, 생활 모습은 모두 이 주제문을 받쳐 주는 근거입니다.","hl":"ty"},{"n":9,"text":"신호어를 짚어 볼게요. 첫 문장의 takes for granted는 통념을 깔아 주는 표현이고, 두 번째 문장의 However는 반박으로 방향을 트는 신호예요. 다섯 번째 문장의 Indeed는 앞의 주장을 한 번 더 밀어 주는 강조어죠. 또 because가 나오면 원인과 결과를 연결해서 읽어야 하고요. 재진술도 눈여겨보세요. universally available이 나왔다가 mobility was neither available nor as valued로 같은 생각을 바꿔 말합니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>transport\u003c/b>\u003cem>명사\u003c/em>\u003cspan>운송, 수송\u003c/span>\u003c/div>\u003cdiv>\u003cb>take for granted\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>당연하게 여기다\u003c/span>\u003c/div>\u003cdiv>\u003cb>universally\u003c/b>\u003cem>부사\u003c/em>\u003cspan>보편적으로, 일반적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>available\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>이용 가능한\u003c/span>\u003c/div>\u003cdiv>\u003cb>century\u003c/b>\u003cem>명사\u003c/em>\u003cspan>세기, 백 년\u003c/span>\u003c/div>\u003cdiv>\u003cb>vehicle\u003c/b>\u003cem>명사\u003c/em>\u003cspan>운송 수단, 탈것\u003c/span>\u003c/div>\u003cdiv>\u003cb>exceed\u003c/b>\u003cem>동사\u003c/em>\u003cspan>초과하다, 넘다\u003c/span>\u003c/div>\u003cdiv>\u003cb>overland\u003c/b>\u003cem>부사\u003c/em>\u003cspan>육로로, 육지로\u003c/span>\u003c/div>\u003cdiv>\u003cb>rarely\u003c/b>\u003cem>부사\u003c/em>\u003cspan>좀처럼 ~하지 않는\u003c/span>\u003c/div>\u003cdiv>\u003cb>need\u003c/b>\u003cem>명사\u003c/em>\u003cspan>필요, 필요성\u003c/span>\u003c/div>\u003cdiv>\u003cb>indeed\u003c/b>\u003cem>부사\u003c/em>\u003cspan>실제로, 정말로\u003c/span>\u003c/div>\u003cdiv>\u003cb>mobility\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기동성, 이동성\u003c/span>\u003c/div>\u003cdiv>\u003cb>neither A nor B\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>A도 B도 아닌\u003c/span>\u003c/div>\u003cdiv>\u003cb>value\u003c/b>\u003cem>동사\u003c/em>\u003cspan>가치 있게 여기다\u003c/span>\u003c/div>\u003cdiv>\u003cb>vast\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>거대한, 막대한\u003c/span>\u003c/div>\u003cdiv>\u003cb>majority\u003c/b>\u003cem>명사\u003c/em>\u003cspan>대다수\u003c/span>\u003c/div>\u003cdiv>\u003cb>entire\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>전체의, 전 생애의\u003c/span>\u003c/div>\u003cdiv>\u003cb>close to\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~가까이에\u003c/span>\u003c/div>\u003cdiv>\u003cb>tourism\u003c/b>\u003cem>명사\u003c/em>\u003cspan>관광 (여행)\u003c/span>\u003c/div>\u003cdiv>\u003cb>mass\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>대중의, 단체의\u003c/span>\u003c/div>\u003cdiv>\u003cb>working people\u003c/b>\u003cem>명사\u003c/em>\u003cspan>근로자들\u003c/span>\u003c/div>\u003cdiv>\u003cb>commute\u003c/b>\u003cem>동사\u003c/em>\u003cspan>통근하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>within\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~이내에, ~안에\u003c/span>\u003c/div>\u003cdiv>\u003cb>walking distance\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>걸어서 갈 수 있는 거리\u003c/span>\u003c/div>\u003cdiv>\u003cb>place of work\u003c/b>\u003cem>명사\u003c/em>\u003cspan>일터, 직장\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어 몇 개만 짚을게요. take for granted는 당연하게 여기다라는 숙어이고, exceed는 넘다, 초과하다라는 뜻이에요. mobility는 기동성, commute는 통근하다, vast majority는 대다수라는 표현도 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">available\u003c/b>\u003cspan class=\"m\">이용 가능한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">accessible\u003c/span>\u003cspan class=\"s\">obtainable\u003c/span>\u003cspan class=\"s\">at hand\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unavailable\u003c/span>\u003cspan class=\"a\">inaccessible\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">exceed\u003c/b>\u003cspan class=\"m\">넘다, 초과하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">surpass\u003c/span>\u003cspan class=\"s\">go beyond\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">fall short of\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">mobility\u003c/b>\u003cspan class=\"m\">기동성, 이동성\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">movement\u003c/span>\u003cspan class=\"s\">travel\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">immobility\u003c/span>\u003cspan class=\"a\">stagnation\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">rarely\u003c/b>\u003cspan class=\"m\">좀처럼 ~않게\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">seldom\u003c/span>\u003cspan class=\"s\">hardly ever\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">often\u003c/span>\u003cspan class=\"a\">frequently\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">vast\u003c/b>\u003cspan class=\"m\">거대한, 막대한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">huge\u003c/span>\u003cspan class=\"s\">enormous\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">tiny\u003c/span>\u003cspan class=\"a\">small\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">universally\u003c/b>\u003cspan class=\"m\">보편적으로\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">widely\u003c/span>\u003cspan class=\"s\">generally\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">narrowly\u003c/span>\u003cspan class=\"a\">rarely\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">commute\u003c/b>\u003cspan class=\"m\">통근하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">travel to work\u003c/span>\u003cspan class=\"s\">journey to work\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어로 정리해 볼게요. available은 accessible이나 obtainable과 뜻이 가깝고 반대말은 unavailable이나 inaccessible이에요. exceed는 surpass와 연결되고, rarely는 seldom이나 hardly ever와 같은 편이죠. mobility의 반대말은 immobility이고, vast는 huge나 enormous로 바꿔 쓸 수 있습니다. universally는 widely나 generally와 가깝고, value는 prize나 cherish처럼 가치 있게 여긴다는 뜻으로 이어집니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">운송은\u003c/span>\u003cspan class=\"en\">Transport\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 것이다\u003c/span>\u003cspan class=\"en\">is something\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 사람들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">everyone \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당연하게 여기는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">takes \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">granted\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">운송은 모든 사람들이 당연하게 여기는 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 운송은 모든 사람이 당연하게 여기는 대상이라는 뜻으로, 글의 화제를 제시하는 \u003cb class=\"key\">도입 \u003c/b>\u003cb class=\"key\">문장\u003c/b>이에요. \u003cb class=\"key\">take \u003c/b>\u003cb class=\"key\">for \u003c/b>\u003cb class=\"key\">granted\u003c/b>는 당연하게 여기다라는 관용 표현으로, 여기서는 운송이 너무 익숙해 의식하지 못함을 강조해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계대명사 that의 목적격 용법\u003c/span> : 선행사 something + [that everyone takes for granted (목적격 관계대명사절)] : \"모든 사람이 당연하게 여기는 것\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Transport, 운송은. is something, 어떤 것이다. that everyone, 모든 사람들이. takes for granted, 당연하게 여기는. 이 문장 전체를 해석하면, 운송은 모든 사람들이 당연하게 여기는 것이다.","hl":"m"},{"n":13,"text":"이 문장은 글의 화제를 여는 도입 문장이에요. 운송이라는 것이 우리에게 얼마나 익숙한지, 그래서 take for granted, 즉 당연하게 여기는 대상이라는 점을 짚고 있어요.","hl":"mn"},{"n":14,"text":"여기서 that은 something을 꾸며 주는 관계대명사예요. 뒤에 everyone takes for granted가 이어지면서 모든 사람이 당연하게 여기는 것이라는 뜻을 만들어요. 관계사절 안에서 that은 takes의 목적어 역할을 하는 목적격 관계대명사라는 점을 기억해 주세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만,\u003c/span>\u003cspan class=\"en\">However,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 항상 그렇게 되어 온 것은 아니다\u003c/span>\u003cspan class=\"en\">it \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">always \u003c/span>\u003cspan class=\"tgt\">been\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그렇게 보편적으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">so \u003c/span>\u003cspan class=\"tgt\">universally \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이용 가능한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">available\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만, 이것이 항상 그렇게 보편적으로 이용 가능했었던 것은 아니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞의 당연한 것이라는 일반화를 \u003cb class=\"key\">However\u003c/b>로 반전시켜, 운송이 언제나 보편적으로 이용 가능했던 것은 아니라고 말해요. 과거와 현재를 대비하며 \u003cb class=\"key\">보편성\u003c/b>의 한계를 제시하는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재완료의 부정형\u003c/span> : 주어 + [has not always been (현재완료 부정)] + 주격보어 : \"항상 그렇게 되어 온 것은 아니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부사에 의한 형용사 수식과 강조\u003c/span> : so + [부사 universally] + [형용사 available] : \"그렇게 보편적으로 이용 가능한\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"However, 하지만. it has not always been, 그것은 항상 그렇게 되어 온 것은 아니다. so universally, 그렇게 보편적으로. available, 이용 가능한. 이 문장 전체를 해석하면, 하지만, 이것이 항상 그렇게 보편적으로 이용 가능했었던 것은 아니다.","hl":"m"},{"n":16,"text":"이 문장은 앞에서 말한 당연함을 However로 한 번 뒤집는 역할을 해요. 운송이 언제나 보편적으로 이용 가능했던 것은 아니라는 점을 분명히 하면서 과거와 현재를 대비시키죠. 그래서 여기서는 보편성의 한계를 짚는 흐름으로 이해하면 돼요.","hl":"mn"},{"n":17,"text":"has not always been은 현재완료 부정이에요. 과거부터 지금까지의 상태를 놓고 항상 그런 것은 아니라고 말할 때 쓰죠. always와 함께 쓰이면 부분 부정의 느낌이 나요. 그리고 so universally available에서는 universally가 available이라는 형용사를 꾸미고 so가 그 부사를 강조해요. 그래서 그렇게 보편적으로 이용 가능한이라는 뜻이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">2 세기 반 전에는\u003c/span>\u003cspan class=\"en\">Two and a half centuries ago\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">소수의 사람들만이 여행을 했다\u003c/span>\u003cspan class=\"en\">only a few people traveled\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 운송 수단도 없었기 때문에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">because \u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">no \u003c/span>\u003cspan class=\"tgt\">vehicle\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시속 10 마일을 넘을 수 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">could \u003c/span>\u003cspan class=\"tgt\">exceed \u003c/span>\u003cspan class=\"tgt\">ten \u003c/span>\u003cspan class=\"tgt\">miles \u003c/span>\u003cspan class=\"tgt\">per \u003c/span>\u003cspan class=\"tgt\">hour\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">육지에서\u003c/span>\u003cspan class=\"en\">overland.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">2 세기 반 전에는 육지에서 시속 10 마일 이상의 속도를 낼 수 있는 운송 수단이 없었기 때문에 소수의 사람들만이 여행을 했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 2세기 반 전에는 육로에서 시속 10마일을 넘는 운송 수단이 없어서 \u003cb class=\"key\">소수\u003c/b>의 사람들만 여행했다는 과거 상황을 제시해요. 앞 문장의 보편적이지 않았음을 구체적인 \u003cb class=\"key\">속도\u003c/b>와 \u003cb class=\"key\">여행 \u003c/b>\u003cb class=\"key\">인구\u003c/b>로 뒷받침하는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이유의 부사절 접속사 because와 there 구문\u003c/span> : [because + 주어 + 동사 (이유의 부사절)] + there was no vehicle : \"운송 수단이 없었기 때문에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : 선행사 no vehicle + [that could exceed ten miles per hour (주격 관계대명사절)] : \"시속 10마일을 넘을 수 있는\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Two and a half centuries ago, 2 세기 반 전에는. only a few people traveled, 소수의 사람들만이 여행을 했다. because there was no vehicle, 어떤 운송 수단도 없었기 때문에. that could exceed ten miles per hour, 시속 10 마일을 넘을 수 있는. overland, 육지에서. 이 문장 전체를 해석하면, 2 세기 반 전에는 육지에서 시속 10 마일 이상의 속도를 낼 수 있는 운송 수단이 없었기 때문에 소수의 사람들만이 여행을 했다.","hl":"m"},{"n":19,"text":"이 문장은 앞에서 말한 보편적이지 않았던 상황을 구체적으로 보여 줘요. 당시에는 육로에서 시속 십 마일을 넘는 운송 수단이 없었기 때문에 여행하는 사람이 소수에 불과했다는 거죠. 속도와 여행 인구라는 두 가지 근거로 과거의 제한된 이동성을 설명하는 문장이에요.","hl":"mn"},{"n":20,"text":"because there was no vehicle은 이유를 나타내는 부사절이에요. 앞 문장의 결과에 대한 이유를 붙여 주고, 그 안의 there was no vehicle은 무엇이 없었다는 뜻의 there 구문이죠. 그다음 that could exceed ten miles per hour에서 that은 vehicle을 꾸미는 주격 관계대명사예요. 관계사절 안에서 주어 역할을 하면서 could로 과거의 능력을 나타내고, 그래서 시속 십 마일을 넘을 수 있는 운송 수단이라는 뜻이 완성됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거의 없었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">rarely \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 필요도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">any \u003c/span>\u003cspan class=\"tgt\">need\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그보다 더 빨리 이동해야 할\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">move \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">any \u003c/span>\u003cspan class=\"tgt\">faster\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그보다 더 빨리 이동해야 할 필요도 거의 없었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 당시 이동 속도가 느렸다는 사실을 받아, 사람들이 더 빨리 움직여야 할 이유 자체가 거의 없었다고 덧붙이는 문장이에요. 교통수단이 느려도 생활에 급한 일이 없었던 시대임을 보여 주며, 다음 문장의 \u003cb class=\"key\">기동성\u003c/b>이 낮았던 이유로 자연스럽게 이어져요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">There is 구문(유도부사 there + be동사)\u003c/span> : There + [be동사] + [주어(any need)] + [수식어] : \"필요가 거의 없었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : need [명사] + [to move (to부정사구/수식어)] : \"더 빨리 이동해야 할\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">비교급 강조의 any\u003c/span> : any + [비교급(faster)] : \"조금이라도 더 빨리\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"There was rarely, 거의 없었다. any need, 어떤 필요도. to move any faster, 그보다 더 빨리 이동해야 할. 이 문장 전체를 해석하면, 그보다 더 빨리 이동해야 할 필요도 거의 없었다.","hl":"m"},{"n":22,"text":"이 문장은 앞에서 말한 대로 당시에는 더 빨리 이동해야 할 이유 자체가 거의 없었다는 걸 강조해요. 교통수단이 느려도 딱히 급할 일이 없었던 시대라는 뜻이죠. 그래서 다음 문장의 기동성 이야기로 자연스럽게 이어집니다.","hl":"mn"},{"n":23,"text":"첫 번째로 There was rarely any need에서 there는 주어의 존재를 이끌어 내는 유도부사예요. 진짜 주어는 any need이고, rarely는 빈도부사로 부정의 뜻을 더한다는 것도 챙기세요. 두 번째로 to move는 앞의 명사 need를 꾸며 주는 형용사적 용법이에요. 세 번째로 any faster에서 any는 비교급 앞에서 조금이라도라는 뜻으로, 주로 부정문에서 강조할 때 쓰여요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">실제로,\u003c/span>\u003cspan class=\"en\">Indeed,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기동성은 이용 가능하지도 않았고\u003c/span>\u003cspan class=\"en\">mobility was \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">neither \u003c/span>\u003cspan class=\"tgt\">available \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가치 있게 여겨지지도 않았으며\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">nor \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">valued \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오늘날처럼\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">today\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">실제로, 기동성은 이용 가능하지도 않았고 오늘날처럼 가치 있게 여겨지지도 않았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 말한 더 빨리 갈 필요가 없었다는 내용을 정리하며, 당시에는 이동성 자체가 없었고 중요하게 여겨지지도 않았다고 못 박는 문장이에요. 과거와 오늘날을 \u003cb class=\"key\">대조\u003c/b>시켜 글의 핵심 차이를 분명히 만들어 주는 중심 문장이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">상관접속사 neither A nor B (병렬)\u003c/span> : neither + [A(available)] + nor + [B(as valued)] : \"이용 가능하지도, 가치 있게 여겨지지도 않았다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">원급 비교 as ~ as\u003c/span> : as + [원급(valued)] + as + [비교 대상(it is today)] : \"오늘날만큼 가치 있게 여겨지는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">수동 의미의 과거분사\u003c/span> : [be동사] + [과거분사(valued)] : \"가치 있게 여겨지는\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Indeed, 실제로. mobility was neither available, 기동성은 이용 가능하지도 않았고. nor as valued, 가치 있게 여겨지지도 않았으며. as it is today, 오늘날처럼. 이 문장 전체를 해석하면, 실제로, 기동성은 이용 가능하지도 않았고 오늘날처럼 가치 있게 여겨지지도 않았다.","hl":"m"},{"n":25,"text":"이 문장은 앞 문장에 이어 당시에는 이동성 자체가 없었고 중요하게 여겨지지도 않았다고 정리해요. 과거와 오늘날을 대조하면서 글의 핵심 차이를 분명히 만드는 역할을 하죠.","hl":"mn"},{"n":26,"text":"먼저 neither available nor as valued에서 neither와 nor가 두 요소를 같은 자격으로 묶는 상관접속사예요. 그래서 병렬 구조로 읽어야 하고, A도 아니고 B도 아니다로 해석합니다. 다음으로 as valued as it is today는 원급 비교로, 앞의 as 뒤에는 원급이, 뒤의 as 뒤에는 비교 대상이 와서 과거와 현재를 비교해요. 마지막으로 valued는 타동사 value의 과거분사로, 주어 mobility가 가치 있게 여겨지는 수동 관계라서 과거분사가 쓰였어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대다수의 사람들은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">The \u003c/span>\u003cspan class=\"tgt\">vast \u003c/span>\u003cspan class=\"tgt\">majority \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">people\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 전 생애를 보냈다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">spent\u003c/span> their entire lives\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">집 가까이에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">close \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">home\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">대다수의 사람들은 그들의 전 생애를 집 가까이에서 보냈다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 말한 낮은 이동성을 구체적인 삶의 모습으로 보여 주는 문장이에요. 대부분의 사람이 평생 집 근처를 벗어나지 않았다는 사실로, 당시 삶의 범위가 얼마나 좁았는지 \u003cb class=\"key\">구체화\u003c/b>해 줘요. 바로 뒤의 '관광도 대중적 이동도 없었다'는 내용의 근거가 되기도 하죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">the majority of + 복수명사 (주어 수 일치)\u003c/span> : The majority of + [복수명사] + [복수동사] : \"대다수의 사람들은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">단순과거시제(불규칙 동사 spend)\u003c/span> : spend + [목적어] → 과거형 [spent] : \"보냈다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 to를 동반하는 close (부사구)\u003c/span> : close + [to + 명사(home)] : \"집 가까이에서\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"The vast majority of people, 대다수의 사람들은. spent their entire lives, 그들의 전 생애를 보냈다. close to home, 집 가까이에서. 이 문장 전체를 해석하면, 대다수의 사람들은 그들의 전 생애를 집 가까이에서 보냈다.","hl":"m"},{"n":28,"text":"이 문장은 앞에서 말한 낮은 이동성을 구체적인 삶의 모습으로 보여 줘요. 대부분의 사람이 평생 집 근처를 벗어나지 않았다는 걸 통해 당시 삶의 범위가 얼마나 좁았는지 드러내죠. 바로 뒤에 관광도 대중적 이동도 없었다는 내용의 근거가 됩니다.","hl":"mn"},{"n":29,"text":"먼저 The vast majority of people에서 the majority of는 대다수라는 뜻이고, 뒤에 복수명사 people이 와서 동사도 복수 주어에 맞춰요. 두 번째로 spent는 spend의 불규칙 과거형이라 이미 끝난 과거 사실을 단순과거로 표현했어요. 세 번째로 close to home에서 close는 거리를 나타낼 때 to를 동반하고, 여기서는 동사 spent를 꾸미는 부사구로 집 가까이에서라는 뜻을 더해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">관광 여행은 없었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">was\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">no \u003c/span>\u003cspan class=\"tgt\">tourism \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 단체 여행도 없었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">no \u003c/span>\u003cspan class=\"tgt\">mass \u003c/span>\u003cspan class=\"tgt\">travel\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">관광 여행도 없었으며 단체 여행도 없었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 대부분의 사람들이 평생 집 근처에서 살았다고 했으므로, 이 문장은 당시에 관광 여행이나 단체 여행이 존재하지 않았음을 덧붙입니다. 이동이 거의 필요 없던 시대였기 때문에 \u003cb class=\"key\">관광\u003c/b>과 \u003cb class=\"key\">단체 \u003c/b>\u003cb class=\"key\">여행\u003c/b> 같은 대규모 이동도 없었다는 뜻이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">There is/are 구문(존재 구문)\u003c/span> : There + be동사 + 주어 = ~이 있다/없다 : \"있었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">no + 명사의 병렬 구조\u003c/span> : no + [명사] and no + [명사] = [명사]도 없고 [명사]도 없다 : \"관광 여행도 없고 단체 여행도 없었다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"There was no tourism, 관광 여행은 없었다. and no mass travel, 그리고 단체 여행도 없었다. 이 문장 전체를 해석하면, 관광 여행도 없었으며 단체 여행도 없었다.","hl":"m"},{"n":31,"text":"이 문장은 앞에서 사람들이 평생 집 근처에서 살았다는 내용을 이어 받아요. 그래서 당시에는 관광 여행도 없었고 단체 여행도 없었다는 점을 덧붙이는 거죠. 이동이 거의 필요 없던 시절이었으니 관광과 단체 여행 같은 큰 이동은 당연히 없었던 거예요.","hl":"mn"},{"n":32,"text":"첫 번째 어법은 There was예요. 무엇이 있다 없다를 말할 때 주어를 앞에 두지 않고 There 뒤에 be동사를 두는 존재 구문이죠. 두 번째는 no tourism and no mass travel인데, no가 각 명사 앞에서 부정을 만들고 and로 두 명사구를 병렬로 연결한 구조예요. 그래서 관광 여행도 없고 단체 여행도 없다는 뜻이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">근로자들은\u003c/span>\u003cspan class=\"en\">Working people\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">통근할 필요가 없었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">did \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">commute\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜냐하면 그들은 살았기 때문에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">because \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">lived\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">걸어서 이동할 수 있는 거리 안에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">within \u003c/span>\u003cspan class=\"tgt\">walking \u003c/span>\u003cspan class=\"tgt\">distance \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 일터에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">place \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">work\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">근로자들은 그들의 일터에서 걸어서 이동할 수 있는 거리에 살았기 때문에 통근을 할 필요가 없었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 근로자들이 일터에서 걸어서 이동할 수 있는 거리에 살았기 때문에 굳이 통근할 필요가 없었다는 뜻입니다. 이는 앞 문장에서 관광 여행과 단체 여행이 없었다고 한 내용을 뒷받침하며, 당시 사람들의 이동이 일상생활 범위에 머물렀음을 보여 주는 \u003cb class=\"key\">구체적 \u003c/b>\u003cb class=\"key\">예\u003c/b>입니다. 현대의 \u003cb class=\"key\">통근\u003c/b> 같은 이동조차 필요 없을 만큼 생활 반경이 좁았음을 강조해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">have to의 부정형(불필요)\u003c/span> : did not have to + [동사원형] = ~할 필요가 없었다 : \"통근할 필요가 없었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이유를 나타내는 접속사 because\u003c/span> : because + [주어 + 동사] = 왜냐하면 ~이기 때문에 : \"왜냐하면 그들은 살았기 때문에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사구(within + 명사)\u003c/span> : within + [거리/범위] + of + [장소] = [장소]에서 ~ 안에 : \"그들의 일터에서 걸어서 이동할 수 있는 거리 안에\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"Working people, 근로자들은. did not have to commute, 통근할 필요가 없었다. because they lived, 왜냐하면 그들은 살았기 때문에. within walking distance, 걸어서 이동할 수 있는 거리 안에. of their place of work, 그들의 일터에서. 이 문장 전체를 해석하면, 근로자들은 그들의 일터에서 걸어서 이동할 수 있는 거리에 살았기 때문에 통근을 할 필요가 없었다.","hl":"m"},{"n":34,"text":"이 문장은 근로자들이 일터에서 걸어서 갈 수 있는 거리에 살았기 때문에 통근할 필요가 없었다는 뜻이에요. 앞에서 관광 여행과 단체 여행이 없었다고 했는데, 이 문장은 그 내용을 받쳐 주는 구체적 예로 당시 사람들의 이동이 일상생활 범위에 머물렀음을 보여 줘요. 현대의 통근 같은 이동조차 필요 없을 만큼 생활 반경이 좁았다는 점을 강조합니다.","hl":"mn"},{"n":35,"text":"첫 번째 어법은 did not have to commute예요. have to는 해야 한다는 뜻인데 not이 붙으면 필요가 없다는 뜻이 되고 과거라서 did를 쓴 거죠. 두 번째는 because they lived인데, because 뒤에 주어와 동사가 있는 절을 이끌어 앞 문장의 이유를 설명해요. 세 번째는 within walking distance of their place of work로, within이 범위 안에라는 뜻으로 걸어서 갈 수 있는 거리를 나타내는 구조예요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>운송은 모든 사람이 \u003cb class=\"key\">당연하게 \u003c/b>\u003cb class=\"key\">여기는\u003c/b> 대상이지만, 항상 \u003cb class=\"key\">보편적으로\u003c/b> 이용 가능했던 것은 아니다.\u003c/li>\u003cli>이백오십 년 전에는 육지에서 시속 십 마일을 넘는 \u003cb class=\"key\">운송 \u003c/b>\u003cb class=\"key\">수단\u003c/b>이 없어 여행하는 사람이 \u003cb class=\"key\">소수\u003c/b>에 불과했다.\u003c/li>\u003cli>그보다 빨리 이동할 \u003cb class=\"key\">필요\u003c/b>가 거의 없었고, \u003cb class=\"key\">기동성\u003c/b>은 이용 가능하지도 가치 있게 여겨지지도 않았다.\u003c/li>\u003cli>\u003cb class=\"key\">대다수\u003c/b>는 전 생애를 집 가까이에서 보냈고, 관광이나 \u003cb class=\"key\">단체 \u003c/b>\u003cb class=\"key\">여행\u003c/b>, \u003cb class=\"key\">통근\u003c/b>도 없었다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Transport has not always been so universally available, and past limits on speed and need kept most people close to home.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">운송은 오늘날 모든 사람이 \u003cb class=\"key\">당연하게 \u003c/b>\u003cb class=\"key\">여기는\u003c/b> 것이지만, 과거에는 \u003cb class=\"key\">보편적으로\u003c/b> 이용 가능하지 않았다. 속도와 필요의 한계 때문에 \u003cb class=\"key\">기동성\u003c/b>이 제한되었고, \u003cb class=\"key\">대다수\u003c/b>는 평생 집 가까이에서 살며 단체 여행이나 \u003cb class=\"key\">통근\u003c/b>을 경험하지 못했다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":36,"text":"오늘 글은 교통이 언제나 당연한 것이 아니었다는 사실을 일깨워 줍니다. 과거에는 속도도, 필요도, 가치도 모두 달랐고 그래서 사람들은 집 근처에서 평생을 살았어요. 통념을 반박하는 However 뒤의 문장을 중심으로 다시 한 번 읽어 보세요. 수고했어요, 다음 강의에서 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
