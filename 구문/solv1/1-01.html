<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SO 레벨1 1강 적용독해01 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-top::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--pk),#7CCBC8)}

.lp-chips .x{background:none;color:#999;padding:0}
.lp-sno{font-size:13px;color:#8493A1;font-weight:700;margin-bottom:8px}

.lp-chunks{display:flex;flex-wrap:wrap;gap:16px 10px;margin-bottom:12px;align-items:flex-end}
.lp-chunk{display:flex;flex-direction:column}
.lp-chunk .ko{font-size:13px;color:var(--pk-t);font-weight:700;line-height:1.3;margin-bottom:2px}
.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}
.lp-top::before{height:5px;background:linear-gradient(90deg,var(--pk) 0,var(--pk) 80%,var(--am) 80%,var(--am) 100%)}
.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}
.lp-tag{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700;padding:2px 12px}
.lp-qn{flex:0 0 112px;height:112px;align-self:center;background:#fff;color:var(--pk);border:3px solid var(--pk);border-radius:50%;font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;font-size:26px}
.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}
.lp-qn .qt{display:block;white-space:nowrap;line-height:1.12;letter-spacing:-.02em}
.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}
.lp-st{border-radius:4px;border-left:4px solid var(--pk-b)}
.lp-st h4{color:var(--ink,#1B2733)}
.lp-st h4 i{border-radius:4px;width:auto;min-width:24px;padding:0 4px}
.lp-pill{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700}
.lp-chain span.c{background:#fff;border:1px solid #AEBBE6;border-radius:3px;font-weight:600}
.lp-ct th{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif}
.lp-vg em{background:#fff;border:1px solid var(--pk-b);border-radius:3px}
.lp-sa>div{border-radius:4px;border-color:var(--pk-b)}
.lp-chips span{border-radius:3px;background:#fff}
.lp-chips .s{border:1px solid #AEBBE6;color:#3A4FA3}
.lp-chips .a{border:1px solid var(--am-b);color:var(--am-d);background:#FFFBF2}
.lp-sno .es{background:var(--am);border-radius:2px;font-weight:700}
.lp-chunk .en{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:600}
.lp-chunk+.lp-chunk{border-left:1px solid var(--pk-b)}
.lp .tgt{background:var(--am-l);border-bottom:2.5px dotted var(--am)}

.lp-ko{border-radius:0;border-left:4px solid var(--pk);background:none;padding:4px 0 4px 12px}

.lp-ap{border-radius:4px;border:1px solid var(--pk-b);border-top:3px solid var(--pk);background:var(--pk-ll)}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"SO 레벨1 1강 적용독해01","audioDir":"1-01_audio","preview":false,"count":45,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">1강\u003cbr>적용독해01\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">SO 레벨1\u003c/div>\u003ch1>The Water Cycle: From the Ground to the Sky and Back\u003c/h1>\u003ch2>물의 순환: 땅에서 하늘로, 다시 땅으로\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>태양열로 물이 \u003cb class=\"key\">증발\u003c/b>해 수증기가 되고, 구름이 되어 이동한 뒤 \u003cb class=\"key\">응결\u003c/b>과 \u003cb class=\"key\">강수\u003c/b>를 거쳐 다시 땅과 바다로 돌아오는 \u003cb class=\"key\">물의 \u003c/b>\u003cb class=\"key\">순환\u003c/b> 과정을 설명한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The passage explains the water cycle, in which water evaporates, forms clouds, falls to the ground, and flows back to the sea.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 오늘은 물의 순환에 관한 지문을 함께 읽어 볼게요. 이 글은 지구의 물이 태양열로 증발하고 구름이 되어 이동한 뒤 다시 땅과 바다로 돌아오는 과정을 설명하고 있어요. 핵심은 증발, 응결, 강수, 그리고 물의 순환이라는 개념이에요. 전체 요지는 물이 끊임없이 상태와 위치를 바꾸며 순환한다는 것이죠.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">지구의 물은 바다, 호수, 강 같은 \u003cb class=\"key\">지표수\u003c/b>뿐 아니라 공기 중의 수증기와 얼음으로도 존재합니다. 태양열은 물을 데워 \u003cb class=\"key\">증발\u003c/b>(evaporation)하게 만들고, 상승한 수증기는 높은 곳에서 차가워져 \u003cb class=\"key\">응결\u003c/b>(condensation)해 구름이 됩니다. 구름 속 물방울이 커지면 비나 눈으로 내려오는데 이를 \u003cb class=\"key\">강수\u003c/b>(precipitation)라고 합니다. 이렇게 물은 액체, 기체, 고체 상태를 오가며 지표와 대기 사이를 끊임없이 이동합니다. 빨래가 마르는 것도 증발, 차가운 창문에 물방울이 맺히는 것도 응결의 일상적 예이며, 이 반복 전체가 \u003cb class=\"key\">물의 \u003c/b>\u003cb class=\"key\">순환\u003c/b>(water cycle)입니다.\u003c/div>","segs":[{"n":2,"text":"배경지식을 조금 더해 볼게요. 지구의 물은 대부분 바다와 호수, 강 같은 지표수로 존재하지만 공기 중에도 수증기로 숨어 있어요. 태양열은 물을 데워 증발시키고, 상승한 수증기는 높은 곳에서 차가워지며 응결해 구름이 됩니다. 구름 속 물방울이 커지면 비나 눈으로 내려오는데 이것을 강수라고 하죠. 빨래가 마르는 것도 물이 증발하기 때문이고, 창문에 물방울이 맺히는 것도 응결의 예예요. 이렇게 물은 상태를 바꾸며 계속 이동하는데, 이를 water cycle이라고 불러요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>물이 있는 곳\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>지구의 물 대부분은 땅 위에 있고, 우리는 그 물을 강, 호수, 바다에서 찾을 수 있어요. 이 문장들은 물이 어디에 있는지 보여 주며 \u003cb class=\"key\">지표수\u003c/b>의 범위를 소개합니다. 강과 호수와 바다라는 구체적 장소가 제시되어 글의 출발점이 됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>증발과 구름\u003csmall>과정 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>태양이 비출 때 그것이 물을 덥히고, 물의 일부는 \u003cb class=\"key\">증발\u003c/b>하여 수증기로 변합니다. 이 수증기는 공중으로 올라가 \u003cb class=\"key\">구름\u003c/b>을 형성하죠. 즉 액체 상태의 물이 기체 상태로 바뀌고 하늘로 이동하는 과정이 이어집니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>이동과 응결\u003csmall>전환 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>바람이 구름을 불어 육지 위로 오게 하고, \u003cb class=\"key\">기온\u003c/b>이 떨어지면 수증기는 다시 \u003cb class=\"key\">물방울\u003c/b>로 변하기 시작합니다. 이는 수증기가 차가운 공기에서 응결하는 단계입니다. 구름이 이동한 뒤 냉각되어 물방울이 만들어지는 흐름이 드러납니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>강수와 순환\u003csmall>결론 · 문장 8–11\u003c/small>\u003c/h4>\u003cp>물방울은 땅으로 떨어지고, 그중 일부는 땅 위를 흘러 바다로 들어갑니다. 그 후 모든 것이 다시 시작되며, 이 전체 과정을 \u003cb class=\"key\">물의 \u003c/b>\u003cb class=\"key\">순환\u003c/b>이라고 부릅니다. 강수와 유출을 거쳐 물이 제자리로 돌아가 순환이 완성되는 단계입니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 문장을 따라가며 물의 이동 과정을 단계별로 살펴볼게요.","hl":null},{"n":4,"text":"첫 단계는 물이 어디에 있는지 확인하는 도입이에요. 지구의 물 대부분은 땅 위에 있고, 우리는 그 물을 강과 호수, 바다에서 볼 수 있죠. 여기서 말하는 지표수는 땅 위에 드러난 물을 뜻해요. 글의 출발점을 잡아 주는 부분입니다.","hl":"f0"},{"n":5,"text":"다음으로 태양이 비출 때 물이 데워지면서 증발이 일어나요. 물의 일부가 수증기로 변하고, 이 수증기는 공중으로 올라가 구름을 형성하죠. 액체 상태의 물이 기체 상태로 바뀌는 장면이라고 이해하면 됩니다.","hl":"f1"},{"n":6,"text":"이어서 바람이 구름을 불어 육지 위로 오게 해요. 기온이 떨어지면 수증기는 다시 물방울로 변하기 시작하죠. 차가운 공기에서 수증기가 응결해 작은 물방울이 만들어지는 단계입니다.","hl":"f2"},{"n":7,"text":"마지막으로 물방울이 땅으로 떨어지고, 그중 일부는 땅 위를 흘러 바다로 들어가요. 그 후 모든 것이 다시 시작되며, 이 전체 과정을 물의 순환이라고 부릅니다. 강수와 유출을 거쳐 물이 제자리로 돌아가 순환이 완성되는 거죠.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 11번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 물이 어디에 있는지에서 시작해 태양열에 의한 \u003cb class=\"key\">증발\u003c/b>, 바람에 의한 이동, 기온 하강에 따른 \u003cb class=\"key\">응결\u003c/b>, 땅으로의 강수로 이어지는 과정을 차례로 설명합니다. when, until, then, after 같은 시간·순서 신호가 단계를 연결하므로 전개 방식은 \u003cb class=\"key\">시간순\u003c/b>입니다. 마지막 문장에서 이 전체 과정을 \u003cb class=\"key\">물의 \u003c/b>\u003cb class=\"key\">순환\u003c/b>이라고 이름 붙이므로 핵심 개념이 글 끝에 제시되는 \u003cb class=\"key\">미괄식\u003c/b> 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>When (3)\u003c/b>\u003cspan>시간·조건 제시\u003c/span>\u003cb>until (6)\u003c/b>\u003cspan>이동의 종료 지점 제시\u003c/span>\u003cb>Then (8)\u003c/b>\u003cspan>다음 단계로의 전환\u003c/span>\u003cb>After it does (10)\u003c/b>\u003cspan>반복과 시간순 연결\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">water\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">it\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">some of the water\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">vapor\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">water vapor\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">clouds\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">drops of water\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">this water\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">it\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 시간순이에요. 물이 어디에 있는지에서 시작해 증발, 이동, 응결, 강수로 차례로 이어지죠. When, until, Then, After 같은 표현이 단계를 연결해 줍니다. 그리고 마지막 문장에서 전체 과정을 물의 순환이라고 이름 붙이므로 미괄식 구조로 볼 수 있어요.","hl":"ty"},{"n":9,"text":"신호어를 보면 단계의 순서가 더 분명해져요. when은 태양이 비출 때라는 조건과 시간을 제시하고, until은 구름이 육지 위에 이르는 종료 지점을 보여 줍니다. then은 다음 단계로 넘어가는 전환을 알려 주고, after it does는 과정이 반복된다는 흐름을 만들어요. 이 글에는 뚜렷한 대조 구도는 없고, water와 vapor, drops of water 같은 재진술이 상태 변화를 이어 줍니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>most of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>대부분의\u003c/span>\u003c/div>\u003cdiv>\u003cb>Earth\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지구\u003c/span>\u003c/div>\u003cdiv>\u003cb>ground\u003c/b>\u003cem>명사\u003c/em>\u003cspan>땅, 지면\u003c/span>\u003c/div>\u003cdiv>\u003cb>river\u003c/b>\u003cem>명사\u003c/em>\u003cspan>강\u003c/span>\u003c/div>\u003cdiv>\u003cb>lake\u003c/b>\u003cem>명사\u003c/em>\u003cspan>호수\u003c/span>\u003c/div>\u003cdiv>\u003cb>ocean\u003c/b>\u003cem>명사\u003c/em>\u003cspan>바다\u003c/span>\u003c/div>\u003cdiv>\u003cb>shine\u003c/b>\u003cem>동사\u003c/em>\u003cspan>빛나다, 비추다\u003c/span>\u003c/div>\u003cdiv>\u003cb>heat\u003c/b>\u003cem>동사\u003c/em>\u003cspan>데우다, 가열하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>evaporate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>증발하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>mean\u003c/b>\u003cem>동사\u003c/em>\u003cspan>의미하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>turn into\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 변하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>vapor\u003c/b>\u003cem>명사\u003c/em>\u003cspan>수증기\u003c/span>\u003c/div>\u003cdiv>\u003cb>rise up\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>올라가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>air\u003c/b>\u003cem>명사\u003c/em>\u003cspan>공기\u003c/span>\u003c/div>\u003cdiv>\u003cb>form\u003c/b>\u003cem>동사\u003c/em>\u003cspan>형성하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>cloud\u003c/b>\u003cem>명사\u003c/em>\u003cspan>구름\u003c/span>\u003c/div>\u003cdiv>\u003cb>wind\u003c/b>\u003cem>명사\u003c/em>\u003cspan>바람\u003c/span>\u003c/div>\u003cdiv>\u003cb>blow\u003c/b>\u003cem>동사\u003c/em>\u003cspan>불다\u003c/span>\u003c/div>\u003cdiv>\u003cb>until\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>~까지\u003c/span>\u003c/div>\u003cdiv>\u003cb>land\u003c/b>\u003cem>명사\u003c/em>\u003cspan>육지, 땅\u003c/span>\u003c/div>\u003cdiv>\u003cb>temperature\u003c/b>\u003cem>명사\u003c/em>\u003cspan>온도, 기온\u003c/span>\u003c/div>\u003cdiv>\u003cb>fall\u003c/b>\u003cem>동사\u003c/em>\u003cspan>떨어지다, 내려가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>turn back into\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>다시 ~로 변하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>drop\u003c/b>\u003cem>명사\u003c/em>\u003cspan>방울\u003c/span>\u003c/div>\u003cdiv>\u003cb>flow\u003c/b>\u003cem>동사\u003c/em>\u003cspan>흐르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>sea\u003c/b>\u003cem>명사\u003c/em>\u003cspan>바다\u003c/span>\u003c/div>\u003cdiv>\u003cb>begin\u003c/b>\u003cem>동사\u003c/em>\u003cspan>시작되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>once again\u003c/b>\u003cem>부사\u003c/em>\u003cspan>다시 한 번\u003c/span>\u003c/div>\u003cdiv>\u003cb>be known as\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 알려져 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>water cycle\u003c/b>\u003cem>명사\u003c/em>\u003cspan>물의 순환\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어를 몇 개 짚어 볼게요. evaporate는 증발하다, vapor는 수증기, turn back into는 다시 변하다는 뜻이에요. flow는 흐르다, be known as는 알려져 있다는 의미로 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">evaporate\u003c/b>\u003cspan class=\"m\">증발하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">vaporize\u003c/span>\u003cspan class=\"s\">turn into vapor\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">condense\u003c/span>\u003cspan class=\"a\">liquefy\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">rise\u003c/b>\u003cspan class=\"m\">오르다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">go up\u003c/span>\u003cspan class=\"s\">ascend\u003c/span>\u003cspan class=\"s\">climb\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">fall\u003c/span>\u003cspan class=\"a\">descend\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">form\u003c/b>\u003cspan class=\"m\">형성하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">create\u003c/span>\u003cspan class=\"s\">make\u003c/span>\u003cspan class=\"s\">develop\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">destroy\u003c/span>\u003cspan class=\"a\">break\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">fall\u003c/b>\u003cspan class=\"m\">떨어지다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">drop\u003c/span>\u003cspan class=\"s\">descend\u003c/span>\u003cspan class=\"s\">come down\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">rise\u003c/span>\u003cspan class=\"a\">ascend\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">flow\u003c/b>\u003cspan class=\"m\">흐르다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">run\u003c/span>\u003cspan class=\"s\">stream\u003c/span>\u003cspan class=\"s\">move\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">stop\u003c/span>\u003cspan class=\"a\">stagnate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">begin\u003c/b>\u003cspan class=\"m\">시작되다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">start\u003c/span>\u003cspan class=\"s\">commence\u003c/span>\u003cspan class=\"s\">initiate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">end\u003c/span>\u003cspan class=\"a\">finish\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">be known as\u003c/b>\u003cspan class=\"m\">~로 알려져 있다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">be called\u003c/span>\u003cspan class=\"s\">be referred to as\u003c/span>\u003cspan class=\"s\">be named\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"시험에 자주 나오는 어휘도 동의어와 반의어로 정리해 볼게요. evaporate의 동의어는 vaporize이고 반의어로는 condense를 기억하면 좋아요. rise는 go up이나 ascend와 가깝고, 반대말은 fall이나 descend입니다. form은 create나 develop으로 바꿔 말할 수 있고, flow는 run이나 stream과 연결됩니다. begin은 start나 commence와 같은 뜻이며, 반대말은 end나 finish예요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지구의 물 대부분은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Most \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">Earth's \u003c/span>\u003cspan class=\"tgt\">water\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">땅 위에\u003c/span>\u003cspan class=\"en\">on the ground.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">지구의 물 대부분은 땅 위에 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글 전체의 화제를 여는 첫 문장으로, 지구의 물이 어디에 있는지를 먼저 알려 줘요. most of는 '전체 중 대부분'을 뜻하는 \u003cb class=\"key\">부분 \u003c/b>\u003cb class=\"key\">표현\u003c/b>이라 물 전체를 다 말하는 것이 아니라 그 대부분이라는 점을 짚어 주죠. 이렇게 물의 위치를 제시한 뒤 글은 물의 순환 이야기로 넘어갑니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부분 표현 most of + 명사\u003c/span> : most of + [한정사] + 명사 : \"지구의 물 대부분은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주어-동사 수 일치(불가산명사)\u003c/span> : [불가산명사 주어] + is(단수 동사) : \"있다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Most of the Earth's water, 지구의 물 대부분은. is, 있다. on the ground, 땅 위에. 이 문장 전체를 해석하면, 지구의 물 대부분은 땅 위에 있다.","hl":"m"},{"n":13,"text":"이 문장은 글의 첫 문장으로, 지구에 있는 물이 어디에 있는지를 먼저 알려 줘요. 지구의 물 대부분이 땅 위에 있다는 사실로 물의 순환 이야기를 시작하는 거죠.","hl":"mn"},{"n":14,"text":"먼저 Most of the Earth's water에서 most of는 전체 중 일부를 뜻하는 부분 표현이에요. 그리고 주어의 핵심은 water이고 셀 수 없는 불가산명사라서 동사는 단수인 is를 쓴다는 점을 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 물을 볼 수 있다\u003c/span>\u003cspan class=\"en\">You \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">find\u003c/span> it\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">강이나,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">rivers, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">호수,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">lakes, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바다에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">oceans\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 물을 강이나, 호수, 바다에서 볼 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 말한 물이 구체적으로 어디에 있는지를 \u003cb class=\"key\">예시\u003c/b>로 보여 주는 문장이에요. rivers, lakes, and oceans처럼 세 명사를 A, B, and C 형태로 늘어놓아 강과 호수와 바다를 \u003cb class=\"key\">병렬\u003c/b>로 묶었죠. it은 앞에 나온 water를 가리키는 대명사예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 can(가능)\u003c/span> : 주어 + can + [동사원형] : \"볼 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 in + 명사 병렬\u003c/span> : in + A, B, and C(명사 병렬) : \"강이나, 호수, 바다에서\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"You can find it, 우리는 물을 볼 수 있다. in rivers, 강이나. lakes, 호수. and oceans, 바다에서. 이 문장 전체를 해석하면, 우리는 물을 강이나, 호수, 바다에서 볼 수 있다.","hl":"m"},{"n":16,"text":"앞 문장에서 말한 물이 구체적으로 어디에 있는지를 예시로 보여 주는 문장이에요. 강과 호수와 바다를 차례로 늘어놓아 물이 있는 장소를 쉽게 그려 볼 수 있게 해 줍니다.","hl":"mn"},{"n":17,"text":"먼저 can find에서 can은 '~할 수 있다'는 가능을 나타내는 조동사라서 뒤에 동사원형 find가 온다는 점을 기억하세요. 두 번째로 in rivers, lakes, and oceans는 전치사 in 하나가 세 명사를 함께 이끄는 병렬 구조예요. 마지막 명사 앞에 and를 붙여 나열을 마무리한다는 것도 챙겨 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">태양이 비출 때면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">sun \u003c/span>\u003cspan class=\"tgt\">shines\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 덥힌다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">heats\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">물을\u003c/span>\u003cspan class=\"en\">the water.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">태양이 비출 때면 그것이 물을 덥힌다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 태양이 비추면 그 열로 물이 데워진다는 \u003cb class=\"key\">원인과 \u003c/b>\u003cb class=\"key\">결과\u003c/b>를 담은 문장이에요. 여기서 it은 앞에 나온 the sun을 가리키고, 데워진 물은 바로 다음 문장에서 증발하게 되죠. 물의 순환에서 '가열' 단계를 여는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 when(시간 부사절)\u003c/span> : When + 주어 + 동사, 주어 + 동사 : \"태양이 비출 때면\"\u003c/ 는 도착점을 나타내는 전치사로 떨어지는 방향이 땅임을 보여줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 중 일부는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Some \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">땅 위를 흘러\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">flows \u003c/span>\u003cspan class=\"tgt\">across \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">land\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바다로 들어간다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">into \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">sea\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 중 일부는 땅 위를 흘러 바다로 들어간다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Some of it은 앞에서 땅에 떨어진 \u003cb class=\"key\">물\u003c/b> 중 일부를 가리켜요. flows across the land는 땅 위를 흘러가고, and into the sea는 결국 \u003cb class=\"key\">바다로 \u003c/b>\u003cb class=\"key\">들어감\u003c/b>을 뜻하며 \u003cb class=\"key\">물의 \u003c/b>\u003cb class=\"key\">순환\u003c/b>이 이어지는 장면을 보여줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부분을 나타내는 대명사 표현\u003c/span> : Some of + [it (앞 문장의 물)] : \"그중 일부\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 across의 공간적 의미\u003c/span> : flow + across + [the land (장소)] : \"땅 위를 흘러\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사구의 병렬\u003c/span> : [across the land] and [into the sea] (전치사구 and 전치사구) : \"그리고 바다로\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Some of it, 그 중 일부는. flows across the land, 땅 위를 흘러. and into the sea, 바다로 들어간다. 이 문장 전체를 해석하면, 그 중 일부는 땅 위를 흘러 바다로 들어간다.","hl":"m"},{"n":37,"text":"Some of it은 앞에서 땅에 떨어진 물 중 일부를 가리켜요. flows across the land는 땅 위를 흘러가고, and into the sea는 결국 바다로 들어감을 뜻하며 물의 순환이 이어지는 장면을 보여줘요.","hl":"mn"},{"n":38,"text":"첫 번째, Some of it은 앞에 나온 물 전체 중 일부를 가리키는 부분 표현이에요. 두 번째, flows across the land에서 across는 가로질러라는 뜻으로 물이 땅 위를 지나가는 방향을 나타내요. 세 번째, and into the sea는 전치사구 across the land와 into the sea를 병렬로 연결해 흐르는 두 방향을 함께 보여줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 후에는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">After \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">does\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 것이 시작된다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">everything \u003c/span>\u003cspan class=\"tgt\">begins\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다시\u003c/span>\u003cspan class=\"en\">once again.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 후에는 모든 것이 다시 시작된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 물이 육지를 가로질러 바다로 흘러간 뒤, 그 과정이 처음 상태로 되돌아가 \u003cb class=\"key\">반복\u003c/b>된다는 것을 말하는 문장이에요. 앞 문장에서 설명한 흐름이 끝이 아니라 \u003cb class=\"key\">물의 \u003c/b>\u003cb class=\"key\">순환\u003c/b>이라는 하나의 고리로 이어진다는 점을 짚어 주는 역할을 해요. once again은 '한 번 더, 다시'라는 뜻으로 순환이 계속된다는 느낌을 살려 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간 부사절 접속사 After + 대동사 does\u003c/span> : [접속사 After] + [주어 it] + [대동사 does (앞 문장의 동사구 대신)] : \"그 후에 (그것이 그러면)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">단수 취급 주어 everything + 3인칭 단수 동사\u003c/span> : [주어 everything] + [동사 begins (3인칭 단수형)] : \"모든 것이 시작된다\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"After it does, 그 후에는. everything begins, 모든 것이 시작된다. once again, 다시. 이 문장 전체를 해석하면, 그 후에는 모든 것이 다시 시작된다.","hl":"m"},{"n":40,"text":"이 문장은 물이 바다까지 흘러간 다음에 그 과정이 다시 처음으로 돌아간다는 걸 말하고 있어요. 그러니까 물의 움직임이 한 번으로 끝나는 게 아니라 계속 반복되는 하나의 고리라는 거죠. once again이 그 반복의 느낌을 딱 잡아 주는 표현이에요.","hl":"mn"},{"n":41,"text":"첫 번째로 After it does를 볼게요. After는 ~후에라는 뜻으로 절을 이끄는 시간 부사절 접속사이고, does는 앞 문장의 flows across the land and into the sea를 또 쓰기 싫어서 대신 쓴 대동사예요. 두 번째로 everything begins에서 everything은 모든 것이라는 뜻이지만 단수 취급을 하는 주어라서 동사가 begins처럼 s가 붙은 삼인칭 단수 형태로 온다는 점 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">This\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">알려져 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">known \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">물의 순환으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">as\u003c/span> the water cycle.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것이 물의 순환이라고 알려져 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 길게 설명한 물의 이동 과정 전체에 이름을 붙여 주는 \u003cb class=\"key\">마무리\u003c/b> 문장이에요. be known as는 '~로 알려져 있다'라는 뜻으로, 어떤 현상에 \u003cb class=\"key\">용어\u003c/b>를 정의해 줄 때 자주 쓰는 표현이에요. 이 문장 덕분에 지문 전체가 '물의 순환'이라는 하나의 \u003cb class=\"key\">주제\u003c/b>로 묶입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지시대명사 This\u003c/span> : [지시대명사 This] + [동사 is] : \"이것이\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태 관용표현 be known as\u003c/span> : [주어 This] + [be동사 is] + [과거분사 known] + [as + 명사] : \"~로 알려져 있다\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"This, 이것이. is known, 알려져 있다. as the water cycle, 물의 순환으로. 이 문장 전체를 해석하면, 이것이 물의 순환이라고 알려져 있다.","hl":"m"},{"n":43,"text":"이 문장은 앞에서 쭉 설명한 물의 이동 과정에 이름표를 붙여 주는 문장이에요. 물이 증발하고 구름이 되고 다시 비로 내리는 그 모든 과정을 묶어서 물의 순환이라고 부르는 거죠. 그래서 이 문장이 지문 전체의 주제를 정리해 주는 마무리 역할을 해요.","hl":"mn"},{"n":44,"text":"첫 번째로 This를 볼게요. This는 바로 앞에서 설명한 과정 전체를 하나로 받아 주는 지시대명사예요. 두 번째로 is known as인데요, be동사 뒤에 과거분사 known이 와서 수동태가 만들어졌고, as를 붙여서 ~로 알려져 있다라는 관용 표현이 된 거예요. 이름을 소개할 때 꼭 나오는 형태니까 통째로 익혀 두세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>지구의 물은 강, 호수, 바다 등 \u003cb class=\"key\">땅 \u003c/b>\u003cb class=\"key\">위\u003c/b>에 대부분 존재한다.\u003c/li>\u003cli>태양열이 물을 데우면 일부가 \u003cb class=\"key\">증발\u003c/b>하여 수증기가 되고 구름을 형성한다.\u003c/li>\u003cli>바람이 구름을 육지로 옮기고 기온이 떨어지면 수증기가 \u003cb class=\"key\">응결\u003c/b>해 물방울이 된다.\u003c/li>\u003cli>물이 땅으로 내려 바다로 흐른 뒤 과정이 반복되며, 이것이 \u003cb class=\"key\">물의 \u003c/b>\u003cb class=\"key\">순환\u003c/b>이다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The passage explains the water cycle, in which water evaporates, forms clouds, falls to the ground, and flows back to the sea.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">태양열로 물이 \u003cb class=\"key\">증발\u003c/b>해 수증기가 되고, 구름이 되어 이동한 뒤 \u003cb class=\"key\">응결\u003c/b>과 \u003cb class=\"key\">강수\u003c/b>를 거쳐 다시 땅과 바다로 돌아오는 \u003cb class=\"key\">물의 \u003c/b>\u003cb class=\"key\">순환\u003c/b> 과정을 설명한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":45,"text":"오늘 글은 물이 증발하고 구름이 되어 이동한 뒤 다시 땅과 바다로 돌아오는 과정을 담고 있었어요. 지표수에서 시작해 증발, 응결, 강수, 유출로 이어지는 흐름을 꼭 기억하세요. 마지막에는 이 모든 과정이 물의 순환이라는 이름으로 묶인다는 점이 핵심입니다. 오늘도 수고했어요, 다음 시간에 또 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
