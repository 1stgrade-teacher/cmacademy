<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SO 레벨1 15강 적용독해03 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-chunk .ko{font-size:13px;color:var(--pk-t);font-weight:700;line-height:1.3;margin-bottom:2px}
.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}
.lp-top::before{height:5px;background:linear-gradient(90deg,var(--pk) 0,var(--pk) 80%,var(--am) 80%,var(--am) 100%)}
.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}
.lp-tag{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700;padding:2px 12px}
.lp-qn{flex:0 0 112px;height:112px;align-self:center;background:#fff;color:var(--pk);border:3px solid var(--pk);border-radius:50%;font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;font-size:26px}
.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}

.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}

.lp-chips .s{border:1px solid #AEBBE6;color:#3A4FA3}

.lp-sno .es{background:var(--am);border-radius:2px;font-weight:700}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"SO 레벨1 15강 적용독해03","audioDir":"15-03_audio","preview":false,"count":31,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">15강\u003cbr>적용독해03\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">SO 레벨1\u003c/div>\u003ch1>Drink Your Coffee Within 20 Minutes\u003c/h1>\u003ch2>커피는 만든 뒤 이십 분 안에 마셔라\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>커피가 건강에 해롭다는 통념과 달리, 뜨거운 커피에서 올라오는 김에는 감기나 암 같은 병으로부터 몸을 보호하는 \u003cb class=\"key\">산화방지제\u003c/b>가 들어 있다. 그러나 이 산화방지제는 공기 중으로 빠르게 날아가 효력을 잃으므로, 커피는 만들어진 후 약 이십 분 안에 마셔 \u003cb class=\"key\">치유 \u003c/b>\u003cb class=\"key\">효능\u003c/b>을 극대화해야 한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>To maximize coffee's healing properties, you should drink it within about twenty minutes after it is made, before its antioxidants escape into the air.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 커피에 관한 흥미로운 지문을 함께 읽어 볼 거예요. 이 글은 커피가 건강에 해롭다는 통념을 뒤집고, 커피의 항산화제와 마시는 시점에 대해 이야기하고 있어요. 요약하면 커피의 치유 효능을 살리려면 만든 뒤 이십 분 안에 마셔야 한다는 것이죠. 그럼 지문을 함께 뜯어 볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">우리 몸이 산소를 이용해 에너지를 만드는 과정에서는 활성산소(free radicals)라는 물질이 생깁니다. 이 활성산소가 세포를 공격하면 몸이 늙고 병들기 쉬워지는데, 이를 막아 주는 물질이 바로 \u003cb class=\"key\">산화방지제\u003c/b>(antioxidant)입니다. 커피에 들어 있는 산화방지제는 뜨거운 커피에서 올라오는 김, 즉 증기(steam)에도 함께 실려 나옵니다. 문제는 이런 성분이 휘발성(volatile)이 강해 공기 중으로 쉽게 날아가 버린다는 점입니다. 사과를 깎아 두면 금세 갈색으로 변하듯 산화는 늘 우리 주변에서 일어나고, 탄산음료의 기포가 시간이 지나면 빠져나가듯 휘발성 성분도 순식간에 사라집니다. 그래서 커피는 언제 마시느냐가 효능을 좌우하게 됩니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식부터 짚어 볼게요. 우리 몸에서는 산소를 이용하는 과정에서 활성산소라는 것이 생기는데, 이것이 세포를 공격하면 몸이 늙고 병들기 쉬워져요. 이때 활성산소와 먼저 결합해서 세포를 지켜 주는 물질이 바로 항산화제예요. 커피에 들어 있는 항산화제는 뜨거운 커피에서 올라오는 김, 즉 증기에도 함께 실려 나온답니다. 문제는 이런 성분이 휘발성이 강해서 공기 중으로 쉽게 날아가 버린다는 거예요. 사과를 깎아 두면 금세 갈색으로 변하듯 산화는 늘 우리 주변에서 일어나고, 탄산음료의 기포가 시간이 지나면 빠져나가듯 휘발성 성분도 순식간에 사라지죠. 그래서 언제 마시느냐가 중요해지는 거예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>널리 퍼진 통념\u003csmall>통념 · 문장 1\u003c/small>\u003c/h4>\u003cp>지난 몇 년간 많은 과학자와 연구가들이 커피는 \u003cb class=\"key\">건강에 \u003c/b>\u003cb class=\"key\">해롭다\u003c/b>고 말하며 마시지 말라고 \u003cb class=\"key\">경고\u003c/b>해 왔습니다. 글은 이렇게 널리 퍼진 \u003cb class=\"key\">통념\u003c/b>을 먼저 꺼내 놓으며 시작합니다. 독자는 자연스럽게 커피가 나쁘다는 생각을 하게 됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>생각이 다른 화학자\u003csmall>전환 · 문장 2\u003c/small>\u003c/h4>\u003cp>그러나 커피 마시는 걸 정말 좋아했던 식품 화학자 Takayuki Shibamoto는 \u003cb class=\"key\">생각이 \u003c/b>\u003cb class=\"key\">달랐습니다\u003c/b>. 그는 기존 주장에 \u003cb class=\"key\">반박\u003c/b>하며 직접 \u003cb class=\"key\">연구\u003c/b>를 시작합니다. 여기서 But이 글의 방향을 바꾸는 신호입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>김에서 찾은 항산화제\u003csmall>근거 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>그는 뜨거운 커피에서 올라오는 \u003cb class=\"key\">김\u003c/b>에 강력한 \u003cb class=\"key\">산화방지제\u003c/b>가 들어 있음을 알아냈습니다. 이 산화방지제는 감기나 심지어 암과 같은 병으로부터 몸을 보호하는 것을 돕습니다. 그러나 이 성분은 공기 중으로 빠르게 날아가 \u003cb class=\"key\">효력\u003c/b>을 잃는다는 한계도 함께 밝혀집니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>마시는 시점의 기준\u003csmall>근거 · 문장 5\u003c/small>\u003c/h4>\u003cp>그는 또한 잠자기 세 시간 전에는 커피를 \u003cb class=\"key\">피하는\u003c/b> 게 건강에 더 좋다는 것을 알아냈습니다. 이는 언제 마시느냐가 효능을 좌우한다는 \u003cb class=\"key\">근거\u003c/b>가 됩니다. 앞의 발견과 함께 실천 지침을 만들어 주는 대목입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>이십 분 안에 마시기\u003csmall>결론 · 문장 6\u003c/small>\u003c/h4>\u003cp>그러므로 커피는 만들어진 후 약 이십 분 안에 마셔야 합니다. 그래야 커피의 \u003cb class=\"key\">치유 \u003c/b>\u003cb class=\"key\">효능\u003c/b>이 \u003cb class=\"key\">극대화\u003c/b>됩니다. 글은 이 \u003cb class=\"key\">결론\u003c/b>을 마지막 문장에 놓으며 앞의 근거들을 하나로 묶습니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 다섯 단계로 나눠서 따라가 볼게요.","hl":null},{"n":4,"text":"첫 번째 문장에서는 지난 몇 년간 많은 과학자와 연구가들이 커피가 건강에 해롭다며 마시지 말라고 경고해 왔다고 합니다. 글은 이렇게 널리 퍼진 통념을 먼저 꺼내 놓아요. 독자는 자연스럽게 커피가 나쁘다는 생각을 하게 되죠.","hl":"f0"},{"n":5,"text":"두 번째 문장에서 But이 나오면서 분위기가 바뀝니다. 커피 마시는 걸 정말 좋아했던 식품 화학자 Takayuki Shibamoto는 이 주장에 동의하지 않았어요. 그는 생각이 달랐고, 그래서 직접 연구를 시작합니다.","hl":"f1"},{"n":6,"text":"세 번째와 네 번째 문장은 그 연구의 결과예요. 뜨거운 커피에서 올라오는 김에 강력한 항산화제가 들어 있고, 이것이 감기나 심지어 암 같은 병으로부터 몸을 보호하는 것을 돕는다는 거죠. 다만 이 산화방지제는 공기 중으로 빠르게 날아가 효력을 잃는다는 한계도 함께 밝혀요.","hl":"f2"},{"n":7,"text":"다섯 번째 문장에서는 또 하나의 발견이 나옵니다. 잠자기 세 시간 전에는 커피를 피하는 게 건강에 더 좋다는 것이죠. 이는 언제 마시느냐가 효능을 좌우한다는 근거가 됩니다.","hl":"f3"},{"n":8,"text":"마지막 문장에서 Thus로 결론을 맺습니다. 커피는 만들어진 후 약 이십 분 안에 마셔야 하고, 그렇게 해야 치유 효능이 극대화된다는 거예요. 결국 이 글의 주제문은 마지막 문장인 셈이죠.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">통념-반박\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 6번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 커피가 건강에 해롭다는 널리 퍼진 \u003cb class=\"key\">통념\u003c/b>을 먼저 제시한 뒤 But으로 \u003cb class=\"key\">반박\u003c/b>합니다. 이어서 식품 화학자의 연구 결과라는 \u003cb class=\"key\">근거\u003c/b>를 두 문장에 걸쳐 쌓아 올립니다. 마지막 문장에서 Thus로 \u003cb class=\"key\">결론\u003c/b>을 내리며 실천 지침을 제시하므로 주제문은 마지막 문장에 있습니다. 따라서 전개방식은 통념-반박, 문장 배치는 \u003cb class=\"key\">미괄식\u003c/b>입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>But (2)\u003c/b>\u003cspan>통념을 뒤집는 전환\u003c/span>\u003cb>however (4)\u003c/b>\u003cspan>좋은 점과 한계의 대조\u003c/span>\u003cb>Thus (6)\u003c/b>\u003cspan>근거를 묶는 결론\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">bad for their health\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">help protect the body against illnesses\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">lose their power\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">healing properties\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>통념: 커피는 건강에 해롭다\u003c/th>\u003cth>반박: 커피의 항산화제는 몸을 보호한다\u003c/th>\u003c/tr>\u003ctr>\u003ctd>마시지 말라고 경고\u003c/td>\u003ctd>만든 뒤 이십 분 안에 마시라고 권함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>김의 항산화제가 빨리 사라지는 점을 모름\u003c/td>\u003ctd>사라지기 전에 마셔 치유 효능을 극대화하려 함\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글은 통념을 먼저 제시하고 그것을 반박하는 통념과 반박의 구조예요. 동시에 주제문이 마지막 문장에 놓여 있으니 미괄식이라고 볼 수 있죠. 처음에는 커피가 나쁘다는 이야기로 시작하지만, 끝에서는 이십 분 안에 마시라는 실천 지침으로 마무리해요. 그래서 결론까지 읽어야 글쓴이의 진짜 주장이 보입니다.","hl":"ty"},{"n":10,"text":"방향을 바꾸는 신호어는 두 번째 문장의 But이에요. 그리고 네 번째 문장의 however는 산화방지제의 좋은 점과 사라지는 한계를 대조시켜 주죠. 마지막 문장의 Thus는 앞의 근거들을 하나로 묶어 결론으로 이끄는 신호입니다. 이렇게 전환과 대조와 결론의 신호어를 따라가면 글의 뼈대가 그대로 보여요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>in the last few years\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>지난 몇 년간\u003c/span>\u003c/div>\u003cdiv>\u003cb>researcher\u003c/b>\u003cem>명사\u003c/em>\u003cspan>연구가, 연구원\u003c/span>\u003c/div>\u003cdiv>\u003cb>warn\u003c/b>\u003cem>동사\u003c/em>\u003cspan>경고하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>chemist\u003c/b>\u003cem>명사\u003c/em>\u003cspan>화학자\u003c/span>\u003c/div>\u003cdiv>\u003cb>disagree\u003c/b>\u003cem>동사\u003c/em>\u003cspan>의견이 다르다, 반대하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>research\u003c/b>\u003cem>명사\u003c/em>\u003cspan>연구\u003c/span>\u003c/div>\u003cdiv>\u003cb>discover\u003c/b>\u003cem>동사\u003c/em>\u003cspan>발견하다, 알아내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>steam\u003c/b>\u003cem>명사\u003c/em>\u003cspan>김, 증기\u003c/span>\u003c/div>\u003cdiv>\u003cb>rise\u003c/b>\u003cem>동사\u003c/em>\u003cspan>올라오다, 상승하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>contain\u003c/b>\u003cem>동사\u003c/em>\u003cspan>함유하다, 포함하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>powerful\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>강력한\u003c/span>\u003c/div>\u003cdiv>\u003cb>antioxidant\u003c/b>\u003cem>명사\u003c/em>\u003cspan>산화방지제\u003c/span>\u003c/div>\u003cdiv>\u003cb>protect\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보호하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>against\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~에 대항하여, ~로부터\u003c/span>\u003c/div>\u003cdiv>\u003cb>illness\u003c/b>\u003cem>명사\u003c/em>\u003cspan>병, 질병\u003c/span>\u003c/div>\u003cdiv>\u003cb>escape\u003c/b>\u003cem>동사\u003c/em>\u003cspan>빠져나가다, 달아나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>quickly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>빠르게\u003c/span>\u003c/div>\u003cdiv>\u003cb>lose\u003c/b>\u003cem>동사\u003c/em>\u003cspan>잃다\u003c/span>\u003c/div>\u003cdiv>\u003cb>power\u003c/b>\u003cem>명사\u003c/em>\u003cspan>힘, 효력\u003c/span>\u003c/div>\u003cdiv>\u003cb>find out\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>알아내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>avoid\u003c/b>\u003cem>동사\u003c/em>\u003cspan>피하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>go to bed\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>잠자리에 들다\u003c/span>\u003c/div>\u003cdiv>\u003cb>thus\u003c/b>\u003cem>부사\u003c/em>\u003cspan>그러므로\u003c/span>\u003c/div>\u003cdiv>\u003cb>within\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~ 이내에\u003c/span>\u003c/div>\u003cdiv>\u003cb>make\u003c/b>\u003cem>동사\u003c/em>\u003cspan>만들다\u003c/span>\u003c/div>\u003cdiv>\u003cb>maximize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>극대화하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>healing\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>치유의\u003c/span>\u003c/div>\u003cdiv>\u003cb>property\u003c/b>\u003cem>명사\u003c/em>\u003cspan>성질, 특성\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"핵심 단어 몇 개만 짚어 볼게요. contain은 함유하다, escape는 빠져나가다, avoid는 피하다라는 뜻이에요. property는 성질이나 특성이라는 뜻으로 healing properties라고 하면 치유 효능이 되고, maximize는 극대화하다라는 동사입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">contain\u003c/b>\u003cspan class=\"m\">함유하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">include\u003c/span>\u003cspan class=\"s\">hold\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">exclude\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">discover\u003c/b>\u003cspan class=\"m\">발견하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">find out\u003c/span>\u003cspan class=\"s\">uncover\u003c/span>\u003cspan class=\"s\">detect\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">miss\u003c/span>\u003cspan class=\"a\">overlook\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">powerful\u003c/b>\u003cspan class=\"m\">강력한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">strong\u003c/span>\u003cspan class=\"s\">mighty\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">weak\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">protect\u003c/b>\u003cspan class=\"m\">보호하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">guard\u003c/span>\u003cspan class=\"s\">defend\u003c/span>\u003cspan class=\"s\">shield\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">harm\u003c/span>\u003cspan class=\"a\">attack\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">escape\u003c/b>\u003cspan class=\"m\">빠져나가다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">flee\u003c/span>\u003cspan class=\"s\">get away\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">remain\u003c/span>\u003cspan class=\"a\">stay\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">avoid\u003c/b>\u003cspan class=\"m\">피하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">stay away from\u003c/span>\u003cspan class=\"s\">keep away from\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">approach\u003c/span>\u003cspan class=\"a\">seek\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">illness\u003c/b>\u003cspan class=\"m\">병\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">disease\u003c/span>\u003cspan class=\"s\">sickness\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">health\u003c/span>\u003cspan class=\"a\">wellness\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">disagree\u003c/b>\u003cspan class=\"m\">반대하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">oppose\u003c/span>\u003cspan class=\"s\">differ\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">agree\u003c/span>\u003cspan class=\"a\">consent\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어도 함께 정리해 둘게요. contain은 include, hold와 비슷하고 exclude와 반대돼요. powerful은 strong과 가깝고 weak와 반대이며, protect는 guard나 defend와 비슷하고 harm과 반대됩니다. escape는 flee와 가깝고 remain과 반대이고, avoid는 stay away from과 비슷하고 approach와 반대예요. illness는 disease나 sickness와 같고 health와 반대이며, disagree는 oppose와 가깝고 agree와 반대라는 점도 기억해 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지난 몇 년간,\u003c/span>\u003cspan class=\"en\">In the last few years,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 과학자들과 연구가들이\u003c/span>\u003cspan class=\"en\">many scientists and researchers\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들에게 말해 왔다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">been \u003c/span>\u003cspan class=\"tgt\">telling\u003c/span> people\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">커피는 그들의 건강에 해롭다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">coffee \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">bad \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">health\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그들에게 그것을 마시지 말라고 경고해 왔다\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">warning \u003c/span>\u003cspan class=\"tgt\">them \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">drink \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">지난 몇 년간, 많은 과학자들과 연구가들이 사람들에게 커피는 건강에 해롭다고 하면서 마시지 말라고 경고해 왔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 커피에 대한 부정적인 인식이 퍼지던 배경을 제시하는 문장이에요. 지난 몇 년간 과학자들이 계속 커피를 나쁘다고 말해 왔다는 점을 \u003cb class=\"key\">현재완료진행\u003c/b>으로 표현했고, tell과 warn 뒤에 각각 \u003cb class=\"key\">목적어\u003c/b>와 \u003cb class=\"key\">목적격보어\u003c/b>가 붙는 구조를 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재완료진행형\u003c/span> : have/has been + [동사-ing] : \"(계속) 말해 와 왔다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 명사절(목적어)\u003c/span> : tell + [목적어] + that + [주어 + 동사 ~] : \"커피는 그들의 건강에 해롭다고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">warn + 목적어 + to부정사(부정형)\u003c/span> : warn + [목적어] + not + [to부정사] : \"그들에게 그것을 마시지 말라고 경고해 왔다\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"In the last few years, 지난 몇 년간. many scientists and researchers, 많은 과학자들과 연구가들이. have been telling people, 사람들에게 말해 왔다. that coffee is bad for their health, 커피는 그들의 건강에 해롭다고. and warning them not to drink it, 그리고 그들에게 그것을 마시지 말라고 경고해 왔다. 이 문장 전체를 해석하면, 지난 몇 년간, 많은 과학자들과 연구가들이 사람들에게 커피는 건강에 해롭다고 하면서 마시지 말라고 경고해 왔다.","hl":"m"},{"n":14,"text":"이 문장은 커피에 대한 부정적인 분위기를 깔아 주는 배경 문장이에요. 지난 몇 년 동안 과학자들이 계속 커피를 나쁘다고 말해 왔다는 흐름을 잡으면 됩니다.","hl":"mn"},{"n":15,"text":"첫 번째로 have been telling은 현재완료진행이에요. 과거에 시작한 말하기가 지금까지 계속 이어지고 있다는 지속의 느낌을 줍니다. 두 번째로 that coffee is bad for their health에서 that은 접속사로 이끄는 명사절이고, 뒤에 완전한 절이 와서 tell의 목적어 역할을 해요. 세 번째로 warning them not to drink it은 warn 뒤에 목적어가 오고 그 뒤에 to부정사가 오는 구조인데, 부정은 to 앞에 not을 붙여서 not to drink처럼 목적격보어 자리에 써요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나\u003c/span>\u003cspan class=\"en\">But\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">식품을 연구하는 화학자 Takayuki Shibamoto는\u003c/span>\u003cspan class=\"en\">food chemist Takayuki Shibamoto,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">커피 마시는 걸 정말 좋아하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">really \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">enjoyed \u003c/span>\u003cspan class=\"tgt\">drinking \u003c/span>\u003cspan class=\"tgt\">coffee\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">생각이 달랐다\u003c/span>\u003cspan class=\"en\">disagreed.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 커피 마시는 걸 정말 좋아하는, 식품을 연구하는 화학자 Takayuki Shibamoto 는 생각이 달랐다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 주장에 정면으로 반대하는 인물을 소개하며 글의 방향을 트는 문장이에요. 커피를 좋아하는 화학자를 주인공으로 세워 다음에 어떤 발견이 나올지 기대하게 만들죠. who는 \u003cb class=\"key\">관계대명사\u003c/b>로 그 인물에 대한 \u003cb class=\"key\">부가 \u003c/b>\u003cb class=\"key\">설명\u003c/b>을 덧붙이는 장치입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">계속적 용법의 주격 관계대명사\u003c/span> : [선행사] + , who + [동사] ~ : \"커피 마시는 걸 정말 좋아하는 (그인데)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사를 목적어로 취하는 동사\u003c/span> : enjoy + [동사-ing] : \"마시는 것을 즐겼다\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"But, 그러나. food chemist Takayuki Shibamoto, 식품을 연구하는 화학자 Takayuki Shibamoto는. who really enjoyed drinking coffee, 커피 마시는 걸 정말 좋아하는. disagreed, 생각이 달랐다. 이 문장 전체를 해석하면, 그러나 커피 마시는 걸 정말 좋아하는, 식품을 연구하는 화학자 Takayuki Shibamoto 는 생각이 달랐다.","hl":"m"},{"n":17,"text":"앞에서 커피가 나쁘다고 했죠. 그런데 커피를 좋아하는 화학자는 그 말에 동의하지 않았다는 거예요. 그래서 다음에 그가 무엇을 했는지가 궁금해지도록 만드는 연결 문장입니다.","hl":"mn"},{"n":18,"text":"첫 번째로 who really enjoyed drinking coffee는 계속적 용법의 주격 관계대명사예요. 앞의 사람에 대한 부가 설명을 덧붙여 주는 역할이죠. 두 번째로 enjoyed drinking에서 enjoy는 동명사를 목적어로 데려가는 동사라는 것, 시험에 정말 자주 나옵니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 연구를 시작해서\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">began \u003c/span>\u003cspan class=\"tgt\">doing \u003c/span>\u003cspan class=\"tgt\">research\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 알아냈다\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">discovered \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">뜨거운 커피 한 잔에서 올라오는 김이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> the steam \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">rising \u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">hot \u003c/span>\u003cspan class=\"tgt\">cup \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">coffee\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">강력한 산화방지제를 함유하고 있음을\u003c/span>\u003cspan class=\"en\">contains powerful antioxidants,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 산화방지제는 감기나 심지어 암과 같은 병으로부터 몸을 보호하는 것을 돕는다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">which \u003c/span>\u003cspan class=\"tgt\">help \u003c/span>\u003cspan class=\"tgt\">protect \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">body \u003c/span>\u003cspan class=\"tgt\">against \u003c/span>\u003cspan class=\"tgt\">illnesses\u003c/span> like colds or even cancer.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 연구를 시작해서 뜨거운 커피에서 올라오는 김에 강력한 산화방지제가 들어있음을 알아냈는데, 이 산화방지제는 감기나 심지어 암과 같은 병으로부터 몸을 보호하는 것을 돕는 역할을 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 그가 연구 끝에 밝혀낸 핵심 발견을 담은 문장이에요. 뜨거운 커피의 \u003cb class=\"key\">김\u003c/b>에 몸을 보호하는 \u003cb class=\"key\">산화방지제\u003c/b>가 들어 있다는 내용으로, 글 전체의 중심 근거가 됩니다. 뒤의 which는 그 산화방지제를 다시 받아 \u003cb class=\"key\">부가 \u003c/b>\u003cb class=\"key\">설명\u003c/b>해 주는 장치예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사를 목적어로 취하는 동사\u003c/span> : begin + [동사-ing] : \"연구를 시작했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 명사절(목적어)\u003c/span> : discover + that + [주어 + 동사 ~] : \"~라는 것을 알아냈다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">현재분사의 후치수식\u003c/span> : [명사] + [동사-ing ~] : \"뜨거운 커피에서 올라오는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">계속적 용법의 주격 관계대명사 which\u003c/span> : [선행사] + , which + [동사] ~ : \"그것(산화방지제)은 ~로부터 몸을 보호하는 것을 돕는다\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"He began doing research, 그는 연구를 시작해서. and discovered, 그리고 알아냈다. that the steam rising from a hot cup of coffee, 뜨거운 커피 한 잔에서 올라오는 김이. contains powerful antioxidants, 강력한 산화방지제를 함유하고 있음을. which help protect the body against illnesses like colds or even cancer, 그 산화방지제는 감기나 심지어 암과 같은 병으로부터 몸을 보호하는 것을 돕는다. 이 문장 전체를 해석하면, 그는 연구를 시작해서 뜨거운 커피에서 올라오는 김에 강력한 산화방지제가 들어있음을 알아냈는데, 이 산화방지제는 감기나 심지어 암과 같은 병으로부터 몸을 보호하는 것을 돕는 역할을 한다.","hl":"m"},{"n":20,"text":"그가 연구 끝에 찾아낸 핵심 사실을 담은 문장이에요. 뜨거운 커피의 김에 몸을 지켜 주는 산화방지제가 들어 있다는 내용이죠. 그래서 이 문장을 글 전체에서 가장 중요한 발견으로 봐도 좋아요.","hl":"mn"},{"n":21,"text":"먼저 began doing research에서 begin은 동명사를 목적어로 쓸 수 있는 동사예요. 두 번째로 discovered that에서 that은 접속사로 이끄는 명사절이고, 뒤에 주어와 동사가 다 있는 완전한 절이 와서 discover의 목적어 역할을 합니다. 세 번째로 the steam rising from a hot cup of coffee에서 rising은 앞의 명사 the steam을 뒤에서 꾸며 주는 현재분사예요, 이렇게 명사 뒤에서 꾸미는 걸 후치수식이라고 하죠. 마지막으로 which help protect the body는 계속적 용법의 관계대명사 which로 앞의 antioxidants를 받아 부가 설명을 해 주는데, help가 복수동사 형태로 쓰인 것도 눈여겨보세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 산화방지제들은, 그러나\u003c/span>\u003cspan class=\"en\">These antioxidants, \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">however\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공기 중으로 빠르게 날아가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">escape \u003c/span>\u003cspan class=\"tgt\">quickly \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">into \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">air \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그 효력을 잃는다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">lose \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">power\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 이 산화방지제는 공기 중으로 빠르게 날아가 그 효력을 잃는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 산화방지제가 몸을 보호한다고 했지만, 이 문장은 그 \u003cb class=\"key\">한계\u003c/b>를 짚어 줍니다. 항산화제가 공기 중으로 빠르게 빠져나가 \u003cb class=\"key\">효력\u003c/b>을 잃는다는 이 사실이, 뒤에 나오는 '20분 안에 마셔라'는 결론의 근거가 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">연결부사 however의 삽입\u003c/span> : 주어 + [, however,] + 동사 : 문장 중간에 끼어든 [[연결부사]] : \"그러나\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 and에 의한 동사 병렬\u003c/span> : [escape (동사원형)] + ~ + and + [lose (동사원형)] : 주어를 공유하는 [[동사 병렬]] : \"공기 중으로 빠르게 날아가 (그리고) 효력을 잃는다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">방향을 나타내는 전치사구\u003c/span> : escape + [into + the air] : 동사를 꾸미는 [[전치사구]] : \"공기 속으로\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"These antioxidants, however, 이 산화방지제들은, 그러나. escape quickly into the air, 공기 중으로 빠르게 날아가. and lose their power, 그리고 그 효력을 잃는다. 이 문장 전체를 해석하면, 그러나 이 산화방지제는 공기 중으로 빠르게 날아가 그 효력을 잃는다.","hl":"m"},{"n":23,"text":"이 문장은 앞에서 좋다고 했던 산화방지제의 약점을 알려 주는 문장이에요. 항산화제는 공기 중으로 빠르게 날아가 버려서 효력을 잃기 때문에, 커피를 오래 두고 마시면 소용이 없다는 흐름으로 이어지죠.","hl":"mn"},{"n":24,"text":"첫 번째로 however는 앞 문장과 반대되는 내용을 이어 주는 연결부사예요. 두 번째로 escape와 lose는 주어 These antioxidants를 똑같이 공유하는 동사 병렬이라서, and 뒤에도 동사원형 lose가 와요. 세 번째로 into the air는 '공기 속으로'라는 방향을 알려 주는 전치사구로 동사 escape를 꾸며 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 또한 알아냈다\u003c/span>\u003cspan class=\"en\">He also \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">found \u003c/span>\u003cspan class=\" 3cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">after \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">made\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 치유 효능을 극대화한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">which \u003c/span>\u003cspan class=\"tgt\">maximizes \u003c/span>\u003cspan class=\"tgt\">its \u003c/span>\u003cspan class=\"tgt\">healing \u003c/span>\u003cspan class=\"tgt\">properties\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러므로 커피를 만들어진 후 약 20 분 안에 마셔야 한다. 그것이 커피의 치유 효능을 극대화한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Thus로 앞의 발견들을 묶어 결론을 내리는 문장입니다. 산화방지제가 날아가기 전에 마셔야 하므로 \u003cb class=\"key\">20분\u003c/b>이라는 시간 제한이 붙고, 그렇게 마실 때 \u003cb class=\"key\">치유 \u003c/b>\u003cb class=\"key\">효능\u003c/b>이 최대가 된다는 것을 말합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 have to (의무)\u003c/span> : [have to + 동사원형] : [[의무]]를 나타내는 조동사구 : \"마셔야 한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">시간 부사절의 수동태 현재시제\u003c/span> : after + 주어 + [is + 과거분사] : [[수동태]] 현재시제가 미래를 대신함 : \"그것이 만들어진 후에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">계속적 용법의 관계대명사 which\u003c/span> : [, which + 동사 ~] : 앞 [[절 전체]]를 받는 계속적 관계대명사 : \"그리고 그것이 치유 효능을 극대화한다\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"Thus, 그러므로. you have to drink the coffee, 당신은 커피를 마셔야 한다. within about 20 minutes, 약 20분 안에. after it is made, 그것이 만들어진 후. which maximizes its healing properties, 그것이 치유 효능을 극대화한다. 이 문장 전체를 해석하면, 그러므로 커피를 만들어진 후 약 20 분 안에 마셔야 한다. 그것이 커피의 치유 효능을 극대화한다.","hl":"m"},{"n":29,"text":"이 문장은 글 전체를 마무리하는 결론이에요. 산화방지제가 날아가 버리기 전에 마셔야 하니까 이십 분이라는 시간 제한이 생기고, 그렇게 마실 때 치유 효능이 최대가 된다는 거죠. 앞 문장들의 발견이 모두 이 결론으로 모입니다.","hl":"mn"},{"n":30,"text":"첫 번째로 have to drink는 의무를 나타내는 조동사구라서 뒤에 동사원형 drink가 왔어요. 두 번째로 after it is made는 커피가 만들어지는 대상이라 수동태를 썼고, 시간 부사절에서는 미래 일도 현재시제로 쓰기 때문에 is made로 된 거예요. 세 번째로 콤마 뒤 which는 앞에 나온 절 전체를 받아서 '그리고 그것은 ~합니다'로 이어지는 계속적 용법이에요. 그래서 이 which는 that으로 바꿀 수 없다는 점, 시험에 정말 자주 나오니까 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>많은 과학자와 연구가들이 커피는 건강에 해롭다며 마시지 말라고 \u003cb class=\"key\">경고\u003c/b>해 왔다.\u003c/li>\u003cli>커피를 좋아하던 식품 화학자 Shibamoto는 뜨거운 커피의 \u003cb class=\"key\">김\u003c/b>에 강력한 \u003cb class=\"key\">산화방지제\u003c/b>가 들어 있음을 알아냈다.\u003c/li>\u003cli>그러나 이 산화방지제는 공기 중으로 빠르게 날아가 \u003cb class=\"key\">효력\u003c/b>을 잃고, 잠자기 세 시간 전에는 커피를 \u003cb class=\"key\">피하는\u003c/b> 게 좋다.\u003c/li>\u003cli>그러므로 커피는 만들어진 후 약 이십 분 안에 마셔 \u003cb class=\"key\">치유 \u003c/b>\u003cb class=\"key\">효능\u003c/b>을 극대화해야 한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>To maximize coffee's healing properties, you should drink it within about twenty minutes after it is made, before its antioxidants escape into the air.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">커피가 건강에 해롭다는 통념과 달리, 뜨거운 커피에서 올라오는 김에는 감기나 암 같은 병으로부터 몸을 보호하는 \u003cb class=\"key\">산화방지제\u003c/b>가 들어 있다. 그러나 이 산화방지제는 공기 중으로 빠르게 날아가 효력을 잃으므로, 커피는 만들어진 후 약 이십 분 안에 마셔 \u003cb class=\"key\">치유 \u003c/b>\u003cb class=\"key\">효능\u003c/b>을 극대화해야 한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":31,"text":"오늘 글의 핵심은 세 가지예요. 커피의 김에는 항산화제가 들어 있지만 금세 날아가 버린다는 것, 그래서 만든 뒤 이십 분 안에 마셔야 한다는 것, 그리고 잠자기 세 시간 전에는 피하는 게 좋다는 것이죠. 통념을 반박하고 근거를 쌓아 마지막에 결론을 내리는 구조, 꼭 눈에 익혀 두세요. 수고했어요, 다음 시간에 또 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
