<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SO 레벨1 7강 적용독해03 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-sno{font-size:13px;color:#8493A1;font-weight:700;margin-bottom:8px}

.lp-chunk{display:flex;flex-direction:column}
.lp-chunk .ko{font-size:13px;color:var(--pk-t);font-weight:700;line-height:1.3;margin-bottom:2px}
.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}
.lp-top::before{height:5px;background:linear-gradient(90deg,var(--pk) 0,var(--pk) 80%,var(--am) 80%,var(--am) 100%)}
.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}
.lp-tag{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700;padding:2px 12px}
.lp-qn{flex:0 0 112px;height:112px;align-self:center;background:#fff;color:var(--pk);border:3px solid var(--pk);border-radius:50%;font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;font-size:26px}
.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}
.lp-qn .qt{display:block;white-space:nowrap;line-height:1.12;letter-spacing:-.02em}
.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}

.lp-st h4{color:var(--ink,#1B2733)}
.lp-st h4 i{border-radius:4px;width:auto;min-width:24px;padding:0 4px}
.lp-pill{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700}
.lp-chain span.c{background:#fff;border:1px solid #AEBBE6;border-radius:3px;font-weight:600}

.lp-vg em{background:#fff;border:1px solid var(--pk-b);border-radius:3px}
.lp-sa>div{border-radius:4px;border-color:var(--pk-b)}

.lp-chips .s{border:1px solid #AEBBE6;color:#3A4FA3}
.lp-chips .a{border:1px solid var(--am-b);color:var(--am-d);background:#FFFBF2}
.lp-sno .es{background:var(--am);border-radius:2px;font-weight:700}
.lp-chunk .en{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:600}
.lp-chunk+.lp-chunk{border-left:1px solid var(--pk-b)}
.lp .tgt{background:var(--am-l);border-bottom:2.5px dotted var(--am)}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"SO 레벨1 7강 적용독해03","audioDir":"7-03_audio","preview":false,"count":37,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">7강\u003cbr>적용독해03\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">SO 레벨1\u003c/div>\u003ch1>Traffic Calming: Making Driving Harder to Keep Cars at Home\u003c/h1>\u003ch2>교통 진정: 운전을 어렵게 만들어 차를 집에 두게 하기\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>한국 대도시들은 교통 체증을 해결하려고 \u003cb class=\"key\">도로를 \u003c/b>\u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">넓히고\u003c/b> 새 도로를 만들지만, 유럽의 도시들은 오히려 운전을 \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">어렵게 \u003c/b>\u003cb class=\"key\">만드는\u003c/b> 장치들을 설치한다. 이런 노력은 'traffic calming'이라는 프로그램의 일환으로, 도시 설계자들은 이를 통해 운전자들이 차를 집에 두고 \u003cb class=\"key\">버스·도보·자전거\u003c/b>를 택하기를 기대한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>European cities use a program called &quot;traffic calming&quot; to make driving more difficult, hoping that drivers will leave their cars at home and take a bus, walk, or bike instead.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 한국과 유럽 도시의 아주 다른 교통 정책을 비교한 글이에요. 한국의 대도시들은 교통 체증을 겪으면서 도로를 더 넓히고 새 도로를 만들지만, 유럽의 도시들은 오히려 운전을 더 어렵게 만드는 쪽을 선택하죠. 이 글의 요지는 유럽 도시들이 traffic calming이라는 프로그램으로 일부러 운전을 불편하게 만들어 사람들이 차를 두고 버스나 자전거, 도보를 택하게 한다는 거예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">도시에 차가 너무 많아지면 사람들은 흔히 도로를 넓히는 \u003cb class=\"key\">공급 \u003c/b>\u003cb class=\"key\">확대\u003c/b>를 떠올려요. 하지만 도로를 넓혀도 시간이 지나면 차가 더 늘어 다시 막히는데, 이를 \u003cb class=\"key\">유발 \u003c/b>\u003cb class=\"key\">수요\u003c/b>(induced demand)라고 불러요. 그래서 등장한 개념이 traffic calming, 우리말로 \u003cb class=\"key\">교통 \u003c/b>\u003cb class=\"key\">진정\u003c/b> 또는 차량 운행 억제예요. 과속방지턱(speed bump)이나 좁은 도로, 굴곡진 길처럼 일부러 \u003cb class=\"key\">불편함\u003c/b>을 만들어 속도를 줄이고 차를 덜 타게 하는 정책이죠. 비유하자면 엘리베이터가 편하면 아무도 계단을 쓰지 않듯, 운전을 편하게 만들어 주면 사람들은 더 차를 타게 돼요. 그래서 유럽의 도시 설계자들은 편의를 줄이는 쪽이 오히려 \u003cb class=\"key\">도시 \u003c/b>\u003cb class=\"key\">교통\u003c/b>을 살리는 길이라고 보는 거예요.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식부터 짚어 볼게요. 도시에 차가 너무 많아지면 흔히 도로를 넓히는 공급 확대를 떠올리는데, 이렇게 길을 늘려도 시간이 지나면 차가 더 늘어 다시 막히는 현상이 생겨요. 이걸 유발 수요, 영어로 induced demand라고 불러요. 그래서 등장한 개념이 traffic calming, 우리말로 교통 진정, 다시 말해 차량 운행 억제예요. 과속방지턱이나 좁은 도로, 굴곡진 길처럼 일부러 불편함을 만들어 속도를 줄이고 차를 덜 타게 하는 정책이죠. 엘리베이터가 편하면 아무도 계단을 쓰지 않듯, 운전을 편하게 만들어 주면 사람들은 더 차를 타게 된다는 발상의 전환이에요. 그래서 유럽의 도시 설계자들은 편의를 줄이는 쪽이 오히려 도시 교통을 살리는 길이라고 보는 거예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>한국의 통념\u003csmall>도입·통념 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>한국의 대도시들은 대부분 \u003cb class=\"key\">교통 \u003c/b>\u003cb class=\"key\">체증\u003c/b>을 겪고 있어요. 그래서 도시 설계자들은 운전자들의 요구를 충족시키기 위해 \u003cb class=\"key\">도로를 \u003c/b>\u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">넓히고\u003c/b> 새로운 도로를 만들죠. 차가 많으면 길을 늘린다는 아주 자연스러운 \u003cb class=\"key\">통념\u003c/b>이 여기서 제시돼요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>유럽의 반박\u003csmall>전환·주장 · 문장 3\u003c/small>\u003c/h4>\u003cp>세 번째 문장에서 however가 등장하며 글의 방향이 완전히 바뀌어요. 유럽의 많은 도시 설계자들은 운전을 더 쉽게 만드는 것이 \u003cb class=\"key\">좋은 \u003c/b>\u003cb class=\"key\">생각이 \u003c/b>\u003cb class=\"key\">아니라고\u003c/b> 믿어요. 앞의 통념을 정면으로 뒤집는 \u003cb class=\"key\">반박\u003c/b>인 셈이죠.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>구체적 방법\u003csmall>근거·예시 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>유럽의 도시들은 도로를 더 \u003cb class=\"key\">좁게\u003c/b> 만들고, 제한속도를 낮추고, 과속방지턱을 설치해서 차들이 속도를 줄이게 해요. 어떤 도시는 길에 \u003cb class=\"key\">굴곡\u003c/b>을 만들고 나무를 심어서 운전자들이 전방을 멀리 볼 수 없게 하기도 하죠. 모두 운전을 불편하게 만드는 \u003cb class=\"key\">구체적 \u003c/b>\u003cb class=\"key\">근거\u003c/b>들이에요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>이름과 요지\u003csmall>명명·주제 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>이러한 노력들은 모두 traffic calming, 즉 \u003cb class=\"key\">교통 \u003c/b>\u003cb class=\"key\">진정\u003c/b>이라는 새로운 프로그램의 일환이에요. 그리고 이 프로그램의 \u003cb class=\"key\">요지\u003c/b>는 운전하는 것을 더 어렵게 만드는 것이라고 분명히 밝히죠. 앞의 예시들이 하나의 개념으로 \u003cb class=\"key\">묶이는\u003c/b> 지점이에요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>기대 효과\u003csmall>결론 · 문장 8\u003c/small>\u003c/h4>\u003cp>도시 설계자들은 이런 조치를 취함으로써 더 많은 운전자들이 차를 집에 두고 버스를 타거나 걸어서, 혹은 자전거를 타고 출근하는 쪽을 \u003cb class=\"key\">택하기를 \u003c/b>\u003cb class=\"key\">기대\u003c/b>해요. 결국 운전을 어렵게 만드는 것이 \u003cb class=\"key\">행동 \u003c/b>\u003cb class=\"key\">변화\u003c/b>로 이어지기를 바라는 거죠.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 처음부터 끝까지 따라가 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 한국의 통념이에요. 한국의 대도시들은 대부분 교통 체증을 겪고 있죠. 그래서 도시 설계자들은 운전자들의 요구를 충족시키기 위해 도로를 더 넓히고 새로운 도로를 만들어요. 차가 많으면 길을 늘린다는 아주 자연스러운 생각이 여기서 제시됩니다.","hl":"f0"},{"n":5,"text":"두 번째 단계에서 글은 however라는 말로 방향을 확 틀어요. 유럽의 많은 도시 설계자들은 운전을 더 쉽게 만드는 것이 좋은 생각이 아니라고 믿어요. 앞의 통념을 정면으로 뒤집는 반박인 셈이죠.","hl":"f1"},{"n":6,"text":"세 번째 단계는 구체적인 방법들이에요. 유럽의 도시들은 도로를 더 좁게 만들고 제한 속도를 낮추고 과속방지턱을 설치해서 차들이 속도를 줄이게 해요. 어떤 도시는 길에 굴곡을 만들고 나무를 심어서 운전자들이 전방을 멀리 볼 수 없게 하기도 하죠. 모두 운전을 불편하게 만드는 구체적 근거들이에요.","hl":"f2"},{"n":7,"text":"네 번째 단계에서 이 모든 노력에 이름이 붙어요. 바로 traffic calming, 교통 진정이라는 새로운 프로그램이에요. 그리고 이 프로그램의 요지는 운전하는 것을 더 어렵게 만드는 것이라고 분명히 밝히죠. 앞에서 늘어놓은 예시들이 하나의 개념으로 묶이는 지점이에요.","hl":"f3"},{"n":8,"text":"마지막 단계는 기대 효과예요. 도시 설계자들은 이런 조치를 취함으로써 더 많은 운전자들이 차를 집에 두고 버스를 타거나 걸어서, 또는 자전거를 타고 출근하는 쪽을 택하기를 기대해요. 결국 운전을 어렵게 만드는 일이 행동 변화로 이어지기를 바라는 거죠.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">통념-반박 (비교·대조)\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 3번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">도입부인 첫 번째와 두 번째 문장에서 한국 도시의 \u003cb class=\"key\">도로 \u003c/b>\u003cb class=\"key\">확장\u003c/b>이라는 통념이 먼저 제시돼요. 이어 세 번째 문장에서 however로 \u003cb class=\"key\">반박\u003c/b>이 나오면서 '운전을 쉽게 만드는 것은 좋은 생각이 아니다'라는 \u003cb class=\"key\">주제문\u003c/b>이 등장하죠. 그 뒤 네 번째와 다섯 번째 문장이 좁은 도로, 제한속도, 과속방지턱, 굴곡과 나무 같은 \u003cb class=\"key\">구체적 \u003c/b>\u003cb class=\"key\">근거\u003c/b>를 대고, 여섯 번째와 일곱 번째 문장이 이를 traffic calming으로 \u003cb class=\"key\">명명\u003c/b>하며 주제를 한 번 더 못박아요. 마지막 문장은 기대 효과로 글을 닫기 때문에 주제문이 글 중간에 놓인 중괄식 전개로 보는 것이 자연스러워요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>however (3)\u003c/b>\u003cspan>통념에서 반박으로 방향을 트는 전환 신호\u003c/span>\u003cb>even (5)\u003c/b>\u003cspan>앞의 조치보다 강한 사례를 덧붙이는 강조\u003c/span>\u003cb>All of these efforts (6)\u003c/b>\u003cspan>앞의 방법들을 하나로 묶는 요약 지시어\u003c/span>\u003cb>The main idea of this program (7)\u003c/b>\u003cspan>주제를 직접 제시하는 표현\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">making roads wider and building new roads\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">making roads narrower and lowering speed limits\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">putting bends in road and planting trees\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">make driving more difficult\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">leave their cars at home\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>한국 대도시\u003c/th>\u003cth>유럽의 도시\u003c/th>\u003c/tr>\u003ctr>\u003ctd>도로를 넓히고 새 도로를 만든다\u003c/td>\u003ctd>도로를 좁히고 제한속도를 낮춘다\u003c/td>\u003c/tr>\u003ctr>\u003ctd>운전을 더 쉽게 만든다\u003c/td>\u003ctd>운전을 더 어렵게 만든다\u003c/td>\u003c/tr>\u003ctr>\u003ctd>차가 늘어 교통 체증이 심해진다\u003c/td>\u003ctd>차를 두고 버스·도보·자전거를 택한다\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글은 통념과 반박이 맞서는 비교 대조 구조예요. 앞에서 한국의 도로 확장이라는 통념을 깔고 however로 유럽의 반대 관점을 끌어오죠. 주제문은 however가 들어간 세 번째 문장, 즉 운전을 더 쉽게 만드는 것은 좋은 생각이 아니라는 문장이에요. 앞에 통념이 있고 주제문이 글 중간에 놓인 뒤 근거와 기대 효과가 이어지니까 중괄식 전개로 보면 됩니다.","hl":"ty"},{"n":10,"text":"신호어를 하나씩 짚어 볼게요. 세 번째 문장의 however는 앞의 한국 사례와 뒤의 유럽 사례를 정확히 갈라 주는 전환 신호예요. 다섯 번째 문장의 even은 어떤 도시는 굴곡과 나무까지 만든다는 점을 강조하고, 여섯 번째 문장의 All of these efforts는 앞의 방법들을 한데 묶어 주는 요약 표현이죠. 그리고 일곱 번째 문장에서는 main idea라는 말로 주제를 콕 집어 줍니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>suffer from\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 고통받다, ~을 겪다\u003c/span>\u003c/div>\u003cdiv>\u003cb>traffic jam\u003c/b>\u003cem>명사\u003c/em>\u003cspan>교통 체증\u003c/span>\u003c/div>\u003cdiv>\u003cb>meet the needs of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~의 요구를 충족시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>driver\u003c/b>\u003cem>명사\u003c/em>\u003cspan>운전자\u003c/span>\u003c/div>\u003cdiv>\u003cb>city planner\u003c/b>\u003cem>명사\u003c/em>\u003cspan>도시 설계자\u003c/span>\u003c/div>\u003cdiv>\u003cb>widen\u003c/b>\u003cem>동사\u003c/em>\u003cspan>넓히다\u003c/span>\u003c/div>\u003cdiv>\u003cb>however\u003c/b>\u003cem>부사\u003c/em>\u003cspan>그러나, 하지만\u003c/span>\u003c/div>\u003cdiv>\u003cb>believe\u003c/b>\u003cem>동사\u003c/em>\u003cspan>믿다, 생각하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>narrow\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>좁은\u003c/span>\u003c/div>\u003cdiv>\u003cb>lower\u003c/b>\u003cem>동사\u003c/em>\u003cspan>낮추다\u003c/span>\u003c/div>\u003cdiv>\u003cb>speed limit\u003c/b>\u003cem>명사\u003c/em>\u003cspan>제한 속도\u003c/span>\u003c/div>\u003cdiv>\u003cb>speed bump\u003c/b>\u003cem>명사\u003c/em>\u003cspan>과속방지턱\u003c/span>\u003c/div>\u003cdiv>\u003cb>slow down\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>속도를 줄이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>even\u003c/b>\u003cem>부사\u003c/em>\u003cspan>심지어\u003c/span>\u003c/div>\u003cdiv>\u003cb>bend\u003c/b>\u003cem>명사\u003c/em>\u003cspan>굴곡, 굽은 길\u003c/span>\u003c/div>\u003cdiv>\u003cb>plant\u003c/b>\u003cem>동사\u003c/em>\u003cspan>심다\u003c/span>\u003c/div>\u003cdiv>\u003cb>ahead\u003c/b>\u003cem>부사\u003c/em>\u003cspan>앞으로, 전방에\u003c/span>\u003c/div>\u003cdiv>\u003cb>effort\u003c/b>\u003cem>명사\u003c/em>\u003cspan>노력, 시도\u003c/span>\u003c/div>\u003cdiv>\u003cb>be part of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~의 일부이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>program\u003c/b>\u003cem>명사\u003c/em>\u003cspan>프로그램, 제도\u003c/span>\u003c/div>\u003cdiv>\u003cb>traffic calming\u003c/b>\u003cem>명사\u003c/em>\u003cspan>교통 진정(차량 운행 억제)\u003c/span>\u003c/div>\u003cdiv>\u003cb>main idea\u003c/b>\u003cem>명사\u003c/em>\u003cspan>요지, 핵심 생각\u003c/span>\u003c/div>\u003cdiv>\u003cb>difficult\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>어려운\u003c/span>\u003c/div>\u003cdiv>\u003cb>take steps\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>조치를 취하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>leave\u003c/b>\u003cem>동사\u003c/em>\u003cspan>두고 가다, 남겨 두다\u003c/span>\u003c/div>\u003cdiv>\u003cb>decide to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~하기로 결정하다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"단어도 몇 개 짚을게요. suffer from은 교통 체증을 겪는다는 뜻이고, widen은 넓히다, narrow는 좁히다, lower는 낮추다예요. speed bump는 과속방지턱, bend는 굴곡, take steps는 조치를 취하다라는 숙어로 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">suffer from\u003c/b>\u003cspan class=\"m\">~을 겪다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">be troubled by\u003c/span>\u003cspan class=\"s\">be afflicted with\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">benefit from\u003c/span>\u003cspan class=\"a\">be free from\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">widen\u003c/b>\u003cspan class=\"m\">넓히다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">broaden\u003c/span>\u003cspan class=\"s\">expand\u003c/span>\u003cspan class=\"s\">enlarge\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">narrow\u003c/span>\u003cspan class=\"a\">tighten\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">however\u003c/b>\u003cspan class=\"m\">그러나\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">but\u003c/span>\u003cspan class=\"s\">nevertheless\u003c/span>\u003cspan class=\"s\">on the other hand\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">lower\u003c/b>\u003cspan class=\"m\">낮추다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">reduce\u003c/span>\u003cspan class=\"s\">decrease\u003c/span>\u003cspan class=\"s\">cut\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">raise\u003c/span>\u003cspan class=\"a\">increase\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">difficult\u003c/b>\u003cspan class=\"m\">어려운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">hard\u003c/span>\u003cspan class=\"s\">tough\u003c/span>\u003cspan class=\"s\">demanding\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">easy\u003c/span>\u003cspan class=\"a\">simple\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">effort\u003c/b>\u003cspan class=\"m\">노력\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">attempt\u003c/span>\u003cspan class=\"s\">endeavor\u003c/span>\u003cspan class=\"s\">try\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">leave\u003c/b>\u003cspan class=\"m\">두고 가다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">abandon\u003c/span>\u003cspan class=\"s\">desert\u003c/span>\u003cspan class=\"s\">keep behind\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">take\u003c/span>\u003cspan class=\"a\">carry\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어도 정리해 볼게요. widen은 broaden, expand와 가깝고 narrow, tighten과 반대예요. lower는 reduce, decrease와 같은 뜻이고 raise, increase의 반대죠. difficult는 hard, tough와 동의어이고 easy, simple과 반대예요. suffer from은 be troubled by로 바꿔 쓸 수 있고 benefit from과는 반대 방향이고요. effort는 attempt, endeavor로 바꿔 말할 수 있어요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대부분의 큰 도시들은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Most \u003c/span>\u003cspan class=\"tgt\">big \u003c/span>\u003cspan class=\"tgt\">cities \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한국의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">Korea\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">겪는다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">suffer \u003c/span>\u003cspan class=\"tgt\">from\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">교통 체증을\u003c/span>\u003cspan class=\"en\">traffic jams.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">한국의 대도시들은 대부분 교통 체증을 겪는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 한국 대도시들이 \u003cb class=\"key\">교통 \u003c/b>\u003cb class=\"key\">체증\u003c/b>으로 고통받는다는 현실을 먼저 깔아 두는 문장이에요. suffer from은 '~로 고통받다'라는 뜻으로, 문제의 \u003cb class=\"key\">원인\u003c/b>을 from 뒤에 붙여 표현해요. 글 전체가 교통 문제를 다룬다는 신호를 주는 도입 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 수식\u003c/span> : [명사구 big cities] + [전치사구 in Korea] → 앞 명사를 뒤에서 꾸밈 : \"한국의 대도시들은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">자동사 + 전치사 결합(숙어)\u003c/span> : suffer [자동사] + from + [전치사 목적어(원인)] : \"~을 겪다, ~로 고통받다\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"Most big cities, 대부분의 큰 도시들은. in Korea, 한국의. suffer from, 겪는다. traffic jams, 교통 체증을. 이 문장 전체를 해석하면, 한국의 대도시들은 대부분 교통 체증을 겪는다.","hl":"m"},{"n":14,"text":"이 문장은 글의 출발점이에요. 한국의 큰 도시들이 교통 체증으로 고통받고 있다는 현실을 먼저 깔아 두는 거죠. 여기서 traffic jam은 차들이 꽉 막혀 거의 움직이지 못하는 상태를 말하고, suffer from은 from 뒤에 문제의 원인을 붙여 '그것으로 고통받는다'고 말하는 표현이에요.","hl":"mn"},{"n":15,"text":"첫 번째, in Korea는 앞에 있는 big cities를 뒤에서 꾸며 주는 전치사구예요. 두 번째, Most는 복수 명사 앞에서 '대부분의'라는 뜻을 더하는 형용사로 쓰였어요. 세 번째, suffer는 혼자서 목적어를 가질 수 없는 자동사라서 from과 짝을 이뤄 '겪다'라는 뜻이 되고, 그래서 from 뒤에 traffic jams가 옵니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">필요를 충족시키기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">To \u003c/span>\u003cspan class=\"tgt\">meet \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">needs \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">운전자들의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">drivers\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">도시 설계자들은\u003c/span>\u003cspan class=\"en\">city planners\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">도로를 더 넓히고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">making \u003c/span>\u003cspan class=\"tgt\">roads \u003c/span>\u003cspan class=\"tgt\">wider\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새로운 도로를 만든다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">building \u003c/span>\u003cspan class=\"tgt\">new \u003c/span>\u003cspan class=\"tgt\">roads\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">늘어나는 교통량에 대처하려고 도시 설계자들은 도로를 더 넓히고 새로운 도로를 만든다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 도시 설계자들이 지금 무엇을 하고 있는지 보여 주는 문장이에요. 원문을 그대로 살리면 '\u003cb class=\"key\">운전자\u003c/b>들의 필요를 충족시키기 위해'라는 뜻이고, 학생용 해석처럼 '늘어나는 교통량에 대처하려고'로 이해해도 흐름은 같아요. 차 중심으로 문제를 푸는 태도가 뒤에 나오는 유럽의 \u003cb class=\"key\">정반대\u003c/b> 접근과 대비된다는 점이 중요해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : To + [동사원형 meet] + [목적어 the needs of drivers] → '~하기 위해' : \"운전자들의 필요를 충족시키기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">5형식 make + 목적어 + 목적격 보어\u003c/span> : make + [목적어 roads] + [목적격 보어 wider(형용사)] → '도로를 더 넓게 만들다' : \"도로를 더 넓히고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동사구의 병렬 구조\u003c/span> : are [making ~] + and + [building ~] → 같은 주어의 두 동작 연결 : \"그리고 새로운 도로를 만든다\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"To meet the needs, 필요를 충족시키기 위해. of drivers, 운전자들의. city planners, 도시 설계자들은. are making roads wider, 도로를 더 넓히고. and building new roads, 새로운 도로를 만든다. 이 문장 전체를 해석하면, 늘어나는 교통량에 대처하려고 도시 설계자들은 도로를 더 넓히고 새로운 도로를 만든다.","hl":"m"},{"n":17,"text":"도시 설계자들이 지금 무엇을 하고 있는지 보여 주는 문장이에요. 원문은 운전자들의 필요를 충족시키기 위해라는 뜻이고, 학생용 해석처럼 늘어나는 교통량에 대처하려고로 받아들여도 흐름은 같아요. 차 중심으로 문제를 푸는 이 태도가 뒤에 나오는 유럽의 정반대 접근과 대비된다는 점을 꼭 기억해 두세요.","hl":"mn"},{"n":18,"text":"첫 번째, 문장 맨 앞의 To meet은 '하기 위해'라는 목적을 나타내는 to부정사의 부사적 용법이에요. 두 번째, are making roads wider는 make가 목적어 roads와 목적격 보어 wider를 데리고 '도로를 더 넓게 만들다'가 되는 구조예요. 세 번째, are making과 building이 and로 나란히 연결된 병렬 구조라서 두 동작 모두 도시 설계자들의 행동임을 알 수 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 유럽의 도시 설계자들은\u003c/span>\u003cspan class=\"en\">(C) Many European city planners,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">however\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">믿는다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">believe \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">운전을 더 쉽게 만드는 것이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">driving \u003c/span>\u003cspan class=\"tgt\">easier \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">좋은 생각이 아니라고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">good \u003c/span>\u003cspan class=\"tgt\">idea\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">( C ) 그러나 유럽의 도시 설계자들은 운전을 더 쉽게 만드는 것이 좋은 생각이 아니라고 믿는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> however 하나로 앞 문장과 \u003cb class=\"key\">대조\u003c/b>되는 유럽의 시각이 등장해요. believe 뒤에 that절이 와서 '무엇을 믿는지'를 채워 주고, 그 안에서 to make driving easier가 문장의 \u003cb class=\"key\">주어\u003c/b> 역할을 해요. 통념을 뒤집는 이 전환이 traffic calming 이야기로 넘어가는 다리가 돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속부사의 양보·전환 기능\u003c/span> : [앞 문장] + However, + [반대 내용의 문장] : \"그러나\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 목적어절\u003c/span> : believe [타동사] + that + [주어 + 동사 ~ (명사절/목적어)] : \"~라는 것을 믿는다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사 주어(가주어 it 대체 가능)\u003c/span> : [To + 동사원형 ~ (주어)] + [동사] → It is ~ to make ... 형태로 전환 : \"운전을 더 쉽게 만드는 것은 좋은 생각이 아니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">5형식 make + 목적어(동명사) + 목적격 보어\u003c/span> : make + [목적어 driving(동명사)] + [목적격 보어 easier(형용사)] : \"운전을 더 쉽게 만들다\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"Many European city planners, 많은 유럽의 도시 설계자들은. however, 그러나. believe, 믿는다. that to make driving easier, 운전을 더 쉽게 만드는 것이. is not a good idea, 좋은 생각이 아니라고. 이 문장 전체를 해석하면, ( C ) 그러나 유럽의 도시 설계자들은 운전을 더 쉽게 만드는 것이 좋은 생각이 아니라고 믿는다.","hl":"m"},{"n":20,"text":"however 하나로 앞 문장과 대조되는 유럽의 시각이 등장해요. believe 뒤에 that절이 와서 무엇을 믿는지를 채워 주고, 그 안에서 to make driving easier가 문장의 주어 역할을 합니다. 통념을 뒤집는 이 전환이 바로 traffic calming 이야기로 넘어가는 다리가 돼요.","hl":"mn"},{"n":21,"text":"첫 번째, however는 앞 내용과 반대되는 말을 이어 주는 접속부사예요. 두 번째, believe 뒤의 that은 절을 목적어로 이끄는 접속사로, 운전을 더 쉽게 만드는 것이 좋은 생각이 아니다라는 내용 전체를 믿는 대상으로 만들어 줍니다. 세 번째, to make driving easier는 to부정사가 문장의 주어로 나온 형태이고, 그 안의 driving은 make의 목적어로 쓰인 동명사예요. 이 주어는 길어서 보통 가주어 it으로 바꿔 쓸 수 있다는 점도 함께 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그곳의 도시들은\u003c/span>\u003cspan class=\"en\">Cities there\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">도로를 더 좁게 만들고,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">making \u003c/span>\u003cspan class=\"tgt\">roads \u003c/span>\u003cspan class=\"tgt\">narrower,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제한속도를 낮추고,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">lowering \u003c/span>\u003cspan class=\"tgt\">speed \u003c/span>\u003cspan class=\"tgt\">limits, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 도로에 과속방지턱을 만들어\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">building \u003c/span>\u003cspan class=\"tgt\">speed \u003c/span>\u003cspan class=\"tgt\">bumps\u003c/span> in the roads\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">차들이 속도를 줄이도록 하고 있다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">cars \u003c/span>\u003cspan class=\"tgt\">slow \u003c/span>\u003cspan class=\"tgt\">down\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">유럽의 도시들은 도로를 더 좁게 만들고, 제한속도를 낮추고, 도로에 과속방지턱을 만들어 차들이 속도를 줄이도록 하고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 한국 도시들이 운전을 편하게 해 주려 한다면, 유럽 도시들은 정반대로 \u003cb class=\"key\">불편하게 \u003c/b>\u003cb class=\"key\">만들기\u003c/b>를 선택한다는 흐름을 잇는 문장이에요. 도로를 넓히는 대신 좁히고, 속도를 높이는 대신 낮추고, 과속방지턱까지 설치해 \u003cb class=\"key\">속도 \u003c/b>\u003cb class=\"key\">줄이기\u003c/b>를 유도한다는 구체적 실천이 담겨 있어요. 즉 이 문장은유럽식 발상의 첫 번째 근거를 제시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재진행형 + 5형식(목적격 보어)\u003c/span> : be동사 + [making (현재분사)] + [목적어 roads] + [목적격 보어 narrower] : \"도로를 더 좁게 만들고 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">병렬 구조(동명사구의 나열)\u003c/span> : are [making] ..., [lowering] ..., and [building] ... : \"제한속도를 낮추고, 과속방지턱을 만들어\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적) + 사역동사 make\u003c/span> : [to make (to부정사/목적)] + [목적어 cars] + [동사원형 slow down] : \"차들이 속도를 줄이도록\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"Cities there, 그곳의 도시들은. are making roads narrower, 도로를 더 좁게 만들고. lowering speed limits, 제한속도를 낮추고. and building speed bumps in the roads, 그리고 도로에 과속방지턱을 만들어. to make cars slow down, 차들이 속도를 줄이도록 하고 있다.. 이 문장 전체를 해석하면, 유럽의 도시들은 도로를 더 좁게 만들고, 제한속도를 낮추고, 도로에 과속방지턱을 만들어 차들이 속도를 줄이도록 하고 있다.","hl":"m"},{"n":23,"text":"이 문장은 유럽 도시들이 교통 문제를 푸는 방식이 우리와 정반대라는 걸 보여 줘요. 운전을 편하게 해 주는 대신 일부러 불편하게 만들어서 차를 덜 타게 하려는 거죠. 그래서 도로를 좁히고 제한속도를 낮추고 과속방지턱까지 설치한다는 내용입니다.","hl":"mn"},{"n":24,"text":"첫 번째로, are making roads narrower는 지금 하고 있는 일이라 현재진행형으로 썼고, make 뒤에 목적어 roads와 목적격 보어 narrower가 나란히 오는 구조예요. 두 번째로, lowering speed limits와 building speed bumps는 앞의 making과 and로 연결된 병렬 구조라서 세 동작 모두 하고 있다로 해석해요. 세 번째로, to make cars slow down에서 to는 목적을 나타내는 부정사이고, make는 사역동사라서 뒤에 동사원형 slow down이 옵니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 도시는 심지어 길에 굴곡을 만들고\u003c/span>\u003cspan class=\"en\">(B) Some cities \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">even \u003c/span>\u003cspan class=\"tgt\">putting \u003c/span>\u003cspan class=\"tgt\">bends \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">road \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나무를 심고 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">planting \u003c/span>\u003cspan class=\"tgt\">trees\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">운전자들이 전방을 멀리 볼 수 없도록.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">so \u003c/span>\u003cspan class=\"tgt\">drivers \u003c/span>\u003cspan class=\"tgt\">cannot \u003c/span>\u003cspan class=\"tgt\">see \u003c/span>\u003cspan class=\"tgt\">very \u003c/span>\u003cspan class=\"tgt\">far \u003c/span>\u003cspan class=\"tgt\">ahead\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">( B ) 어떤 도시는 심지어 운전자들이 전방을 멀리 볼 수 없도록 길에 굴곡을 만들고 나무를 심고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 방법을 한 단계 더 밀어붙인 사례예요. 길을 구불구불하게 만들고 나무를 심어서 \u003cb class=\"key\">시야 \u003c/b>\u003cb class=\"key\">확보\u003c/b>를 일부러 막는 거죠. 멀리 볼 수 없으면 운전자는 자연스럽게 \u003cb class=\"key\">속도 \u003c/b>\u003cb class=\"key\">줄이기\u003c/b>를 하게 되니, 결국 같은 목적을 향한 다른 수단입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">병렬 구조(동명사구의 병렬)\u003c/span> : are [putting ...] and [planting ...] : \"심지어 길에 굴곡을 만들고 나무를 심고 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">so (that)절 (목적·결과)\u003c/span> : [so (that)] + [주어 drivers] + [cannot see ...] : \"운전자들이 전방을 멀리 볼 수 없도록\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"Some cities are even putting bends in road, 어떤 도시는 심지어 길에 굴곡을 만들고. and planting trees, 나무를 심고 있다. so drivers cannot see very far ahead, 운전자들이 전방을 멀리 볼 수 없도록.. 이 문장 전체를 해석하면, ( B ) 어떤 도시는 심지어 운전자들이 전방을 멀리 볼 수 없도록 길에 굴곡을 만들고 나무를 심고 있다.","hl":"m"},{"n":26,"text":"여기서는 운전자의 시야를 일부러 막는 방법이 나와요. 길을 구불구불하게 만들고 나무를 심어서 멀리까지 훤히 보이지 않게 하는 거죠. 앞이 잘 안 보이면 운전자가 자연스럽게 속도를 줄이게 되니까요.","hl":"mn"},{"n":27,"text":"첫 번째로, are even putting과 planting은 and로 묶인 병렬 구조라서 한 주어가 두 가지 일을 한다는 걸 보여 줘요. 두 번째로, so drivers cannot see very far ahead에서 so는 앞의 행동을 하는 목적을 이끄는 접속사이고, 조동사 cannot 뒤에는 동사원형 see가 와요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 노력들은 모두\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">All \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">these \u003c/span>\u003cspan class=\"tgt\">efforts\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새로운 프로그램의 일부이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">part \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">new \u003c/span>\u003cspan class=\"tgt\">program\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“교통 진정시키기(차량 운행 억제)”라고 불리는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">called \u003c/span>\u003cspan class=\"tgt\">&quot;traffic \u003c/span>\u003cspan class=\"tgt\">calming.&quot;\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이러한 노력들은 모두 “교통 진정시키기(차량 운행 억제)”라고 하는 새로운 프로그램의 일환이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 나열한 여러 시도들을 하나로 묶어 이름을 붙여 주는 문장이에요. 도로 좁히기, 제한속도 낮추기, 과속방지턱, 굴곡과 나무 심기가 모두 \u003cb class=\"key\">traffic \u003c/b>\u003cb class=\"key\">calming\u003c/b>이라는 한 프로그램 안에 있다는 정리죠. 글의 흐름에서는 개념을 \u003cb class=\"key\">정의\u003c/b>하며 다음 문장의 근거를 마련하는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주어와 동사의 수 일치\u003c/span> : [All of these efforts (복수 주어)] + [are (복수 동사)] : \"이러한 노력들은 모두\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be part of 관용 표현\u003c/span> : be동사 + [part of + 명사] : \"새로운 프로그램의 일부이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">과거분사의 형용사적 용법(후치 수식)\u003c/span> : [a new program] + [called ... (과거분사구)] : \"“교통 진정시키기”라고 불리는\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"All of these efforts, 이러한 노력들은 모두. are part of a new program, 새로운 프로그램의 일부이다. called \"traffic calming.\", “교통 진정시키기(차량 운행 억제)”라고 불리는. 이 문장 전체를 해석하면, 이러한 노력들은 모두 “교통 진정시키기(차량 운행 억제)”라고 하는 새로운 프로그램의 일환이다.","hl":"m"},{"n":29,"text":"이 문장은 앞에서 나온 여러 시도들을 하나로 묶어 주는 역할을 해요. 도로를 좁히고 과속방지턱을 만들고 나무를 심는 것 모두가 교통 진정시키기라는 하나의 프로그램 안에 있다는 거죠. 그래서 이 문장이 글의 흐름에서 일종의 이름표 역할을 합니다.","hl":"mn"},{"n":30,"text":"첫 번째로, All of these efforts는 복수 주어라서 동사가 are로 수 일치가 된 점을 꼭 기억하세요. 두 번째로, are part of는 일부이다라는 관용 표현으로 관사 없이 part of로 쓴다는 점도 챙겨 두세요. 세 번째로, called traffic calming은 a new program을 뒤에서 꾸며 주는 과거분사구예요. 불리다라는 수동의 의미라서 called 하나로 충분합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">요지는\u003c/span>\u003cspan class=\"en\">(A) The main idea\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 프로그램의\u003c/span>\u003cspan class=\"en\">of this program\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~이다\u003c/span>\u003cspan class=\"en\">is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">운전하는 것을 더 어렵게 만드는 것\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">driving \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">difficult\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">( A ) 이 프로그램의 요지는 운전하는 것을 더 어렵게 만드는 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 좁은 도로, 과속방지턱, 커브, 가로수 같은 구체적 조치를 나열한 뒤, 그 모든 것의 공통 목표가 \u003cb class=\"key\">운전을 \u003c/b>\u003cb class=\"key\">어렵게 \u003c/b>\u003cb class=\"key\">만드는 \u003c/b>\u003cb class=\"key\">것\u003c/b>임을 한 줄로 정의하는 문장입니다. 운전을 편하게 해 주자는 한국식 발상과 정반대로 가는 \u003cb class=\"key\">역발상\u003c/b>이 이 글의 핵심이며, 그래서 이 문장이 'traffic calming'의 개념을 규정하는 중심축이 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(주격 보어)\u003c/span> : 주어 + be동사 + [to부정사구 (주격 보어)] : \"운전하는 것을 더 어렵게 만드는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">5형식 make + 목적어 + 목적격 보어(형용사)\u003c/span> : make + [목적어 driving] + [형용사 more difficult (목적격 보어)] : \"운전하는 것을 더 어렵게 만들다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동명사(목적어)\u003c/span> : make + [동명사 driving (목적어)] + [형용사 보어] : \"운전하는 것\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"The main idea, 요지는. of this program, 이 프로그램의. is, ~이다. to make driving more difficult, 운전하는 것을 더 어렵게 만드는 것. 이 문장 전체를 해석하면, ( A ) 이 프로그램의 요지는 운전하는 것을 더 어렵게 만드는 것이다.","hl":"m"},{"n":32,"text":"이 문장은 traffic calming 프로그램의 요지를 한 줄로 딱 정의하고 있어요. 앞에서 좁은 도로나 과속방지턱, 커브 같은 조치를 쭉 나열했는데, 그 모든 것의 공통 목표가 바로 운전을 어렵게 만드는 것이에요. 편하게 달리게 하자는 우리나라 방식과는 정반대로 간다는 역발상이 이 글의 핵심 포인트예요.","hl":"mn"},{"n":33,"text":"첫 번째, be동사 뒤에 나온 to make는 to부정사의 명사적 용법으로 주격 보어 자리에 왔어요. 그래서 이 프로그램의 요지는 운전하는 것을 더 어렵게 만드는 것이다, 이렇게 해석되는 거죠. 두 번째, make driving more difficult는 5형식 구조예요. make가 목적어 driving을 데리고 목적격 보어로 more difficult를 붙여서 운전하는 것을 더 어렵게 만들다가 됩니다. 세 번째, 여기서 driving은 동명사 목적어라는 점도 꼭 챙겨 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">도시 설계자들은 바란다\u003c/span>\u003cspan class=\"en\">City planners \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">hope \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 조치를 취함으로써\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">taking \u003c/span>\u003cspan class=\"tgt\">these \u003c/span>\u003cspan class=\"tgt\">steps\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">점점 더 많은 운전자들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">drivers\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">차를 집에 두고\u003c/span>\u003cspan class=\"en\">will leave their cars at home\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">버스를 타거나 걸어서, 혹은 자전거를 타고 출근하는 쪽을 택하기를\u003c/span>\u003cspan class=\"en\">and decide \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">take \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">bus, \u003c/span>\u003cspan class=\"tgt\">walk, \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">bike \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">work\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">도시 설계자들은 이러한 조치를 취함으로써 더욱 더 많은 운전자들이 차를 집에 두고 버스를 타거나 걸어서, 혹은 자전거를 타고 출근하는 쪽을 택하기를 기대한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 나열한 모든 조치가 왜 필요한지, 그 \u003cb class=\"key\">기대 \u003c/b>\u003cb class=\"key\">효과\u003c/b>를 밝히는 마무리 문장입니다. 운전을 불편하게 만들어 두면 운전자들이 \u003cb class=\"key\">자발적\u003c/b>으로 차를 두고 대중교통이나 두 발, 자전거를 선택할 것이라는 기대를 담고 있습니다. 결국 이 프로그램의 진짜 목표는 도로가 아니라 사람들의 \u003cb class=\"key\">행동 \u003c/b>\u003cb class=\"key\">변화\u003c/b>라는 점이 핵심입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 명사절(목적어)\u003c/span> : hope + [that + 주어 + 동사 ~ (명사절)] : \"~라고 바라다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 by + 동명사(수단·방법)\u003c/span> : by + [동명사구 taking these steps] : \"이러한 조치를 취함으로써\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">비교급 and 비교급(점점 더 ~한)\u003c/span> : [비교급] and [비교급] + 명사 : \"점점 더 많은 운전자들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">to부정사와 동사원형의 병렬\u003c/span> : decide + [to take a bus, (to) walk, or (to) bike] : \"버스를 타거나 걷거나 자전거를 타기로 결정하다\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"City planners hope, 도시 설계자들은 바란다. that by taking these steps, 이러한 조치를 취함으로써. more and more drivers, 점점 더 많은 운전자들이. will leave their cars at home, 차를 집에 두고. and decide to take a bus, walk, or bike to work, 버스를 타거나 걸어서, 혹은 자전거를 타고 출근하는 쪽을 택하기를. 이 문장 전체를 해석하면, 도시 설계자들은 이러한 조치를 취함으로써 더욱 더 많은 운전자들이 차를 집에 두고 버스를 타거나 걸어서, 혹은 자전거를 타고 출근하는 쪽을 택하기를 기대한다.","hl":"m"},{"n":35,"text":"이 문장은 앞에서 소개한 여러 조치를 왜 하는지, 그 기대 효과를 밝혀 주는 문장이에요. 운전을 일부러 불편하게 만들어 두면 사람들이 자발적 의지로 차를 집에 두고 버스나 자전거, 혹은 두 발을 이용하게 될 거라는 기대죠. 결국 이 프로그램의 진짜 목표는 도로가 아니라 사람들의 행동 변화라는 점을 꼭 기억하세요.","hl":"mn"},{"n":36,"text":"첫 번째, hope 뒤에 온 that은 접속사로 명사절을 이끌고 그 절 전체가 hope의 목적어가 돼요. 두 번째, by taking these steps에서 by 다음에 동명사가 와서 수단과 방법을 나타냅니다. 세 번째, more and more는 비교급을 and로 이어 붙인 표현으로 점점 더 많아지는 증가의 느낌을 줘요. 네 번째, decide 뒤에 to take a bus, walk, or bike to work가 이어지는데 walk와 bike는 앞의 to를 함께 받는 동사원형들이에요. 그래서 to부정사와 동사원형이 or로 병렬을 이루는 구조, 이게 바로 시험 포인트입니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>한국의 대도시들은 교통 체증을 겪으면서 \u003cb class=\"key\">도로를 \u003c/b>\u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">넓히고\u003c/b> 새로운 도로를 만든다.\u003c/li>\u003cli>유럽의 도시 설계자들은 운전을 더 쉽게 만드는 것이 \u003cb class=\"key\">좋은 \u003c/b>\u003cb class=\"key\">생각이 \u003c/b>\u003cb class=\"key\">아니라고\u003c/b> 믿는다.\u003c/li>\u003cli>유럽의 도시들은 도로를 좁히고 제한속도를 낮추고 굴곡과 나무로 \u003cb class=\"key\">전방 \u003c/b>\u003cb class=\"key\">시야\u003c/b>를 막는다.\u003c/li>\u003cli>이 모든 노력은 traffic calming, 즉 운전을 \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">어렵게 \u003c/b>\u003cb class=\"key\">만드는\u003c/b> 프로그램의 일환이며, 설계자들은 운전자들이 차를 두고 대중교통과 도보를 택하기를 기대한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>European cities use a program called &quot;traffic calming&quot; to make driving more difficult, hoping that drivers will leave their cars at home and take a bus, walk, or bike instead.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">한국 대도시들은 교통 체증을 해결하려고 \u003cb class=\"key\">도로를 \u003c/b>\u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">넓히고\u003c/b> 새 도로를 만들지만, 유럽의 도시들은 오히려 운전을 \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">어렵게 \u003c/b>\u003cb class=\"key\">만드는\u003c/b> 장치들을 설치한다. 이런 노력은 'traffic calming'이라는 프로그램의 일환으로, 도시 설계자들은 이를 통해 운전자들이 차를 집에 두고 \u003cb class=\"key\">버스·도보·자전거\u003c/b>를 택하기를 기대한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":37,"text":"오늘 글의 핵심은 아주 선명해요. 문제를 도로 확장으로 풀지 않고 운전을 더 어렵게 만들어 차 타는 수요 자체를 줄이는 발상, 그게 바로 traffic calming이라는 점이죠. 시험에서는 however를 기준으로 두 관점을 갈라 놓고, 마지막 문장의 기대 효과까지 함께 기억해 주세요. 오늘 수업도 수고 많았어요, 다음 시간에 또 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
