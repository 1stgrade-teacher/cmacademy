<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SO 레벨1 15강 적용독해02 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}

.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}
.lp-tag{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700;padding:2px 12px}

.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}

.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}

.lp-sno .es{background:var(--am);border-radius:2px;font-weight:700}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"SO 레벨1 15강 적용독해02","audioDir":"15-02_audio","preview":false,"count":30,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">15강\u003cbr>적용독해02\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">SO 레벨1\u003c/div>\u003ch1>The Supermarket's Checkout Trap: From Shopping List to Impulse Buying\u003c/h1>\u003ch2>슈퍼마켓 계산대의 함정: 쇼핑 목록에서 충동 구매로\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>고객은 \u003cb class=\"key\">쇼핑 \u003c/b>\u003cb class=\"key\">목록\u003c/b>에 따라 계획적으로 물건을 사지만, 계산대 근처에서 \u003cb class=\"key\">기쁘고 \u003c/b>\u003cb class=\"key\">편안한 \u003c/b>\u003cb class=\"key\">마음\u003c/b>이 되면 목록에 없는 값싸고 매력적인 물건을 \u003cb class=\"key\">충동적으로 \u003c/b>\u003cb class=\"key\">구매\u003c/b>하게 된다. 슈퍼마켓 주인은 바로 이런 고객의 행동을 기대한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Supermarkets place attractive, inexpensive items near the checkout counter to trigger impulse buying in relaxed customers who have almost finished shopping.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 슈퍼마켓 계산대 앞에서 벌어지는 흥미로운 소비 심리를 읽어 볼게요. 글은 고객이 쇼핑 목록을 만들고 계획대로 쇼핑하다가도 계산대 근처에서 기쁘고 편안한 마음이 되면 목록에 없는 물건을 충동적으로 구매할 수 있다는 내용을 담고 있어요. 핵심은 이런 충동적으로 구매하는 행동이 바로 슈퍼마켓 주인이 바라는 결과라는 점이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">슈퍼마켓 계산대 근처에는 작고 값싼 물건이 자주 놓인다. 이는 \u003cb class=\"key\">충동 \u003c/b>\u003cb class=\"key\">구매\u003c/b>(impulse buying)를 노린 진열 전략으로, 소비자가 계획하지 않은 물건을 갑자기 사도록 만든다. 사람은 쇼핑을 거의 끝내고 \u003cb class=\"key\">편안한 \u003c/b>\u003cb class=\"key\">마음\u003c/b>이 될 때 작은 지출을 쉽게 허락한다. 편의점 계산대 앞의 껌이나 사탕을 떠올리면 이해하기 쉽다. 이런 \u003cb class=\"key\">매장 \u003c/b>\u003cb class=\"key\">진열\u003c/b>(point-of-purchase display)은 소비자의 심리와 동선을 이용한 마케팅이다.\u003c/div>","segs":[{"n":2,"text":"계산대 근처에 작고 값싼 물건을 두는 건 충동 구매를 노린 전략이에요. 이걸 영어로는 impulse buying이라고 하죠. 사람은 쇼핑을 거의 끝내고 편안한 마음이 될 때 작은 지출을 쉽게 허락해요. 편의점 계산대 앞의 껌이나 사탕을 떠올리면 이해가 쉬워요. 이런 매장 진열은 영어로 point of purchase display라고 부르고, 소비자의 심리와 동선을 이용한 마케팅이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>목록 쇼핑\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>대부분의 고객은 슈퍼마켓에 가기 전에 \u003cb class=\"key\">쇼핑 \u003c/b>\u003cb class=\"key\">목록\u003c/b>을 작성한다. 그들은 무엇을 사야 할지 정확히 알고, 목록에 따라 물건을 산다. 이 단계에서 쇼핑은 계획적이고 이성적인 일에 가깝다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>계산대의 심리\u003csmall>전환 · 문장 3\u003c/small>\u003c/h4>\u003cp>계산대에 도착할 때쯤이면 물건을 사는 일이 거의 끝나 있다. 그래서 고객은 \u003cb class=\"key\">기쁘고 \u003c/b>\u003cb class=\"key\">편안한 \u003c/b>\u003cb class=\"key\">마음\u003c/b>이 된다. 이런 긍정적 감정이 다음 행동의 배경이 된다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>충동 구매\u003csmall>핵심 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>행복한 기분 속에서 고객은 계산대 옆에 진열된 \u003cb class=\"key\">값싸고 \u003c/b>\u003cb class=\"key\">매력적인 \u003c/b>\u003cb class=\"key\">물건\u003c/b>을 본다. 그것들은 목록에 없지만, 고객은 단지 즐거움을 위해 무언가를 사고 싶은 \u003cb class=\"key\">충동\u003c/b>을 느낀다. 계획에 없던 구매가 감정에 의해 촉발되는 것이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>주인의 의도\u003csmall>결론 · 문장 6\u003c/small>\u003c/h4>\u003cp>이것이 바로 슈퍼마켓 주인이 손님이 하기를 바라는 일이다. 계산대 옆 진열은 우연이 아니라 \u003cb class=\"key\">매출을 \u003c/b>\u003cb class=\"key\">높이려는 \u003c/b>\u003cb class=\"key\">전략\u003c/b>이다. 결국 글은 고객의 심리를 이용한 매장 연출의 의도를 밝힌다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 단계별로 살펴볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 목록 쇼핑이에요. 대부분의 고객은 슈퍼마켓에 가기 전에 쇼핑 목록을 작성하고, 무엇을 사야 할지 정확히 알고 목록에 따라 물건을 사요. 이때 쇼핑은 계획적이고 이성적인 일에 가까워요.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 계산대에 도착할 때쯤 쇼핑이 거의 끝나 있기 때문에 고객이 기쁘고 편안한 마음을 느껴요. 이런 긍정적인 감정이 다음 행동의 배경이 되죠. 편안한 마음이 작은 지출을 허락하는 분위기를 만들어요.","hl":"f1"},{"n":6,"text":"세 번째 단계에서는 행복한 기분 속에서 고객이 계산대 옆에 진열된 값싸고 매력적인 물건을 봐요. 그 물건들은 목록에 없지만, 고객은 단지 즐거움을 위해 무언가를 사고 싶은 충동을 느껴요. 계획에 없던 구매가 감정에 의해 촉발되는 거죠.","hl":"f2"},{"n":7,"text":"마지막 단계는 주인의 의도예요. 이것이 바로 슈퍼마켓 주인이 손님이 하기를 바라는 일이고, 계산대 옆 진열은 우연이 아니라 매출을 높이려는 전략이에요. 결국 글은 고객의 심리를 이용한 매장 연출의 의도를 밝히고 있어요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">인과\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 6번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 고객이 목록에 따라 쇼핑하는 장면에서 시작해 계산대에서의 \u003cb class=\"key\">편안한 \u003c/b>\u003cb class=\"key\">감정\u003c/b>과 \u003cb class=\"key\">충동\u003c/b>이 목록에 없는 구매를 낳는 과정을 설명한다. 마지막 문장에서 그 구매가 슈퍼마켓 주인이 바라는 결과임을 밝히므로 주제는 끝에 제시된다. 따라서 원인과 결과가 이어지는 \u003cb class=\"key\">인과 \u003c/b>\u003cb class=\"key\">구조\u003c/b>이자 결론이 마지막에 오는 미괄식이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>By the time (3)\u003c/b>\u003cspan>시간적 전환\u003c/span>\u003cb>because (3)\u003c/b>\u003cspan>원인 제시\u003c/span>\u003cb>Although (5)\u003c/b>\u003cspan>양보·대조\u003c/span>\u003cb>This is exactly what (6)\u003c/b>\u003cspan>결론 강조\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">make a shopping list\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the list\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">pleased and relaxed\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">happy mood\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">attractive and inexpensive things\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">these goods\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">an impulse that drives them to buy\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">buy something simply for enjoyment\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>목록에 따른 계획 구매\u003c/th>\u003cth>계산대 옆 즉흥 구매\u003c/th>\u003c/tr>\u003ctr>\u003ctd>이성적·계획적\u003c/td>\u003ctd>감정적·충동적\u003c/td>\u003c/tr>\u003ctr>\u003ctd>목록에 있는 물건\u003c/td>\u003ctd>목록에 없는 물건\u003c/td>\u003c/tr>\u003ctr>\u003ctd>고객이 통제\u003c/td>\u003ctd>매장이 유도\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 원인과 결과가 이어지는 인과 구조로 되어 있어요. 고객이 쇼핑을 거의 끝내며 편안한 감정을 느끼고, 그 감정 속에서 충동이 생겨 목록에 없는 구매가 일어나는 흐름이죠. 주제를 밝히는 마지막 문장이 결론에 오기 때문에 미괄식 구조로 볼 수 있어요. 그래서 글을 읽을 때는 마지막 문장을 주제문으로 잡는 것이 중요해요.","hl":"ty"},{"n":9,"text":"신호어를 보면 By the time이 시간적 전환을 알려 주고, because가 원인을 제시해요. Although는 목록에 없다는 점과 구매 충동이 생긴다는 점을 대조시키는 양보의 신호이고, This is exactly what은 결론을 강조하는 표현이에요. 또한 pleased and relaxed가 happy mood로 이어지고, an impulse that drives them to buy가 buy something simply for enjoyment로 다시 풀어지는 재진술을 확인할 수 있어요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>customer\u003c/b>\u003cem>명사\u003c/em>\u003cspan>손님, 고객\u003c/span>\u003c/div>\u003cdiv>\u003cb>make a shopping list\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>쇼핑 목록을 작성하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>supermarket\u003c/b>\u003cem>명사\u003c/em>\u003cspan>슈퍼마켓\u003c/span>\u003c/div>\u003cdiv>\u003cb>exactly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>정확히\u003c/span>\u003c/div>\u003cdiv>\u003cb>need\u003c/b>\u003cem>동사\u003c/em>\u003cspan>필요로 하다, 사야 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>buy\u003c/b>\u003cem>동사\u003c/em>\u003cspan>사다\u003c/span>\u003c/div>\u003cdiv>\u003cb>according to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 따라\u003c/span>\u003c/div>\u003cdiv>\u003cb>reach\u003c/b>\u003cem>동사\u003c/em>\u003cspan>도착하다, 이르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>checkout counter\u003c/b>\u003cem>명사\u003c/em>\u003cspan>계산대\u003c/span>\u003c/div>\u003cdiv>\u003cb>pleased\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>기쁜, 만족한\u003c/span>\u003c/div>\u003cdiv>\u003cb>relaxed\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>편안한, 느긋한\u003c/span>\u003c/div>\u003cdiv>\u003cb>task\u003c/b>\u003cem>명사\u003c/em>\u003cspan>일, 과업\u003c/span>\u003c/div>\u003cdiv>\u003cb>almost\u003c/b>\u003cem>부사\u003c/em>\u003cspan>거의\u003c/span>\u003c/div>\u003cdiv>\u003cb>finished\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>끝난, 완료된\u003c/span>\u003c/div>\u003cdiv>\u003cb>mood\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기분, 분위기\u003c/span>\u003c/div>\u003cdiv>\u003cb>attractive\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>매력적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>inexpensive\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>값싼, 저렴한\u003c/span>\u003c/div>\u003cdiv>\u003cb>display\u003c/b>\u003cem>동사\u003c/em>\u003cspan>진열하다, 전시하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>beside\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~ 옆에\u003c/span>\u003c/div>\u003cdiv>\u003cb>although\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>비록 ~이지만\u003c/span>\u003c/div>\u003cdiv>\u003cb>goods\u003c/b>\u003cem>명사\u003c/em>\u003cspan>상품, 물건\u003c/span>\u003c/div>\u003cdiv>\u003cb>impulse\u003c/b>\u003cem>명사\u003c/em>\u003cspan>충동\u003c/span>\u003c/div>\u003cdiv>\u003cb>drive\u003c/b>\u003cem>동사\u003c/em>\u003cspan>몰아가다, 이끌다\u003c/span>\u003c/div>\u003cdiv>\u003cb>simply\u003c/b>\u003cem>부사\u003c/em>\u003cspan>단지, 그저\u003c/span>\u003c/div>\u003cdiv>\u003cb>enjoyment\u003c/b>\u003cem>명사\u003c/em>\u003cspan>즐거움, 재미\u003c/span>\u003c/div>\u003cdiv>\u003cb>owner\u003c/b>\u003cem>명사\u003c/em>\u003cspan>주인\u003c/span>\u003c/div>\u003cdiv>\u003cb>hope\u003c/b>\u003cem>동사\u003c/em>\u003cspan>바라다, 기대하다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어를 몇 개 짚어 볼게요. impulse는 충동, attractive는 매력적인, inexpensive는 값싼이라는 뜻이고, according to는 무엇에 따라라는 숙어예요. checkout counter는 계산대, goods는 물건이나 상품을 뜻하니 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">impulse\u003c/b>\u003cspan class=\"m\">충동\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">urge\u003c/span>\u003cspan class=\"s\">desire\u003c/span>\u003cspan class=\"s\">whim\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">restraint\u003c/span>\u003cspan class=\"a\">control\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">attractive\u003c/b>\u003cspan class=\"m\">매력적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">appealing\u003c/span>\u003cspan class=\"s\">inviting\u003c/span>\u003cspan class=\"s\">charming\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unattractive\u003c/span>\u003cspan class=\"a\">repellent\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">inexpensive\u003c/b>\u003cspan class=\"m\">값싼\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">cheap\u003c/span>\u003cspan class=\"s\">affordable\u003c/span>\u003cspan class=\"s\">low-cost\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">expensive\u003c/span>\u003cspan class=\"a\">costly\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">pleased\u003c/b>\u003cspan class=\"m\">기쁜\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">happy\u003c/span>\u003cspan class=\"s\">delighted\u003c/span>\u003cspan class=\"s\">satisfied\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">displeased\u003c/span>\u003cspan class=\"a\">unhappy\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">relaxed\u003c/b>\u003cspan class=\"m\">편안한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">calm\u003c/span>\u003cspan class=\"s\">comfortable\u003c/span>\u003cspan class=\"s\">at ease\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">tense\u003c/span>\u003cspan class=\"a\">anxious\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">display\u003c/b>\u003cspan class=\"m\">진열하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">show\u003c/span>\u003cspan class=\"s\">exhibit\u003c/span>\u003cspan class=\"s\">present\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hide\u003c/span>\u003cspan class=\"a\">conceal\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">enjoyment\u003c/b>\u003cspan class=\"m\">즐거움\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">pleasure\u003c/span>\u003cspan class=\"s\">delight\u003c/span>\u003cspan class=\"s\">fun\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">displeasure\u003c/span>\u003cspan class=\"a\">sorrow\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 정리해 볼게요. impulse는 urge나 desire로 바꿔 쓸 수 있고, 반대말로는 restraint나 control이 있어요. attractive는 appealing이나 inviting과 가깝고, inexpensive는 affordable나 low cost로 표현할 수 있어요. pleased는 happy나 delighted, relaxed는 calm이나 comfortable과 연결해서 외워 두세요. display는 show나 exhibit의 뜻으로 쓰이고, enjoyment는 pleasure나 delight로 바꿔 말할 수 있어요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대부분의 손님들은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Most \u003c/span>\u003cspan class=\"tgt\">customers\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">쇼핑목록을 작성한다\u003c/span>\u003cspan class=\"en\">make a shopping list\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 가기 전에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">before \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">go \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">슈퍼마켓에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">supermarket\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">슈퍼마켓에 가는 손님들은 대부분 가기 전에 쇼핑목록을 작성한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 손님들이 슈퍼마켓에 가기 전에 쇼핑목록을 미리 작성한다는 사실을 전하는 문장입니다. 글의 \u003cb class=\"key\">도입\u003c/b> 부분에서 손님이 \u003cb class=\"key\">목록\u003c/b>에 따라 움직이는 계획적인 상태임을 깔아 주는 \u003cb class=\"key\">배경\u003c/b> 역할을 합니다. 뒤에서 이 계획이 흔들리는 장면과 대비되도록 준비한 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">most + 복수명사(대부분의)\u003c/span> : most + [복수 가산명사] → 복수 취급 : \"대부분의 손님들은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 before의 시간 부사절\u003c/span> : [주절] + before + [주어 + 동사] ~ : \"그들이 슈퍼마켓에 가기 전에\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Most customers, 대부분의 손님들은. make a shopping list, 쇼핑목록을 작성한다. before they go, 그들이 가기 전에. to the supermarket, 슈퍼마켓에. 이 문장 전체를 해석하면, 슈퍼마켓에 가는 손님들은 대부분 가기 전에 쇼핑목록을 작성한다.","hl":"m"},{"n":13,"text":"이 문장은 손님들이 슈퍼마켓에 가기 전에 쇼핑목록을 미리 작성한다는 사실을 전해요. 글의 도입에서 손님이 목록에 따라 움직이는 계획적인 상태라는 배경을 깔아 주는 거죠. 뒤에 나올 충동구매 장면과 대비되는 장면이라고 생각하면 이해가 쉬워요.","hl":"mn"},{"n":14,"text":"첫 번째로 most customers를 보세요. most가 복수명사 앞에 오면 대부분의라는 뜻이 되고 뒤 명사를 복수로 해석해요. 두 번째로 before they go to the supermarket, 여기서 before는 접속사로 주어와 동사가 있는 절을 이끌어요. 시간 부사절에서는 미래의 일도 현재시제로 쓴다는 것, 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 정확히 안다\u003c/span>\u003cspan class=\"en\">They know exactly\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무엇을 사야 할지를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">need \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">buy\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그들은 물건을 산다\u003c/span>\u003cspan class=\"en\">and they shop\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">목록에 따라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">according \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">list\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 무엇을 사야 할지 정확히 알고 있고, 목록에 따라 물건을 산다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 손님이 사야 할 것을 정확히 알고 \u003cb class=\"key\">목록\u003c/b>대로만 움직인다는 뜻으로, 앞 문장의 계획적인 태도를 이어 받는 문장입니다. '사야 할 것'에 대한 \u003cb class=\"key\">확신\u003c/b>이 있다는 점을 강조해, 뒤에 나올 예상 밖의 \u003cb class=\"key\">충동\u003c/b>과 선명하게 대비시킵니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">간접의문문(의문사절)\u003c/span> : [의문사 what + 주어 they + 동사 need] → 명사절 : \"무엇을 사야 할지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">need + to부정사(목적어)\u003c/span> : need [타동사] + [to buy (to부정사구/목적어)] : \"사야 한다 / 사는 것이 필요하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사구 according to\u003c/span> : according to + [명사] → '~에 따라' : \"목록에 따라\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"They know exactly, 그들은 정확히 안다. what they need to buy, 무엇을 사야 할지를. and they shop, 그리고 그들은 물건을 산다. according to the list, 목록에 따라. 이 문장 전체를 해석하면, 그들은 무엇을 사야 할지 정확히 알고 있고, 목록에 따라 물건을 산다.","hl":"m"},{"n":16,"text":"손님들이 사야 할 것을 정확히 알고 목록대로만 움직인다는 내용이에요. 앞 문장에서 말한 계획적인 태도를 그대로 이어 받는 문장이죠. 사야 할 것에 대한 확신이 있다는 점을 강조해서, 뒤에 나올 예상 밖의 충동과 선명하게 대비시켜 줍니다.","hl":"mn"},{"n":17,"text":"첫 번째로 what they need to buy를 보세요. 의문사가 이끄는 절이 명사절이 되어서 know의 목적어 역할을 하고, 의문사 다음에 주어와 동사 순서로 평서문 어순을 쓴다는 게 포인트예요. 두 번째로 need to buy, need 뒤에 to부정사가 목적어로 와서 사야 한다는 뜻이 되죠. 세 번째로 according to the list, according to는 그 자체가 전치사 역할을 해서 뒤에 명사가 바로 오고 목록이라는 근거를 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 도착할 때쯤에는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">By \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">time \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">reach \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">계산대에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">checkout \u003c/span>\u003cspan class=\"tgt\">counter\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 기쁘고 편안한 마음이 된다\u003c/span>\u003cspan class=\"en\">they \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">feel \u003c/span>\u003cspan class=\"tgt\">pleased \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">relaxed\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜냐하면 물건을 사는 일이\u003c/span>\u003cspan class=\"en\">because the task of shopping\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거의 끝났기 때문에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">almost \u003c/span>\u003cspan class=\"tgt\">finished\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">손님이 계산대에 도착할 때쯤에는 물건을 사는 일이 거의 끝났기 때문에 기쁘고 편안한 마음이 된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 계산대에 도착할 때쯤 쇼핑이라는 \u003cb class=\"key\">과업\u003c/b>이 거의 끝나 기쁘고 편안한 감정을 느낀다는 문장입니다. 이 \u003cb class=\"key\">편안한 \u003c/b>\u003cb class=\"key\">마음\u003c/b>이 바로 다음에 나올 충동구매의 \u003cb class=\"key\">원인\u003c/b>이 되기 때문에, 글 흐름에서 감정적 \u003cb class=\"key\">전환점\u003c/b> 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">by the time + 주어 + 동사(시간 부사절)\u003c/span> : By the time + [주어 + 동사] → '~할 때쯤이면' : \"그들이 계산대에 도착할 때쯤에는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">감각동사 + 형용사 보어(주격보어)\u003c/span> : feel [감각동사] + pleased and relaxed [형용사 보어] : \"기쁘고 편안한 마음이 된다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">수동태(be + p.p.)\u003c/span> : be동사 + [과거분사 finished] → 수동태 : \"거의 끝났다 / 거의 끝나 있다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"By the time they reach, 그들이 도착할 때쯤에는. the checkout counter, 계산대에. they feel pleased and relaxed, 그들은 기쁘고 편안한 마음이 된다. because the task of shopping, 왜냐하면 물건을 사는 일이. is almost finished, 거의 끝났기 때문에. 이 문장 전체를 해석하면, 손님이 계산대에 도착할 때쯤에는 물건을 사는 일이 거의 끝났기 때문에 기쁘고 편안한 마음이 된다.","hl":"m"},{"n":19,"text":"계산대에 도착할 때쯤이면 물건을 사는 일이 거의 끝나서 손님이 기쁘고 편안한 마음을 느낀다는 내용이에요. 이 편안한 마음이 바로 다음에 나올 충동구매의 원인이 되죠. 그래서 이 문장은 글 흐름에서 감정적인 전환점 역할을 해요.","hl":"mn"},{"n":20,"text":"첫 번째로 By the time they reach the checkout counter를 보세요. by the time은 접속사구라서 뒤에 주어와 동사가 오고, 시간 부사절이니까 미래의 일도 현재시제로 써요. 두 번째로 feel pleased and relaxed, feel은 감각동사라서 뒤에 부사가 아니라 형용사가 주격보어로 오고, pleased와 relaxed가 and로 병렬 연결돼요. 세 번째로 is almost finished는 수동태예요. 주어 the task of shopping이 끝나는 대상이니까 be동사와 과거분사를 쓴 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이렇게 행복한 기분에서,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">In \u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">happy \u003c/span>\u003cspan class=\"tgt\">mood\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 보게 된다\u003c/span>\u003cspan class=\"en\">they see\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">값싸고 매력적인 물건들을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">attractive \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">inexpensive \u003c/span>\u003cspan class=\"tgt\">things\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">진열되어 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">displayed\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">계산대 옆에\u003c/span>\u003cspan class=\"en\">beside the checkout counter.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이렇게 행복한 기분에서, 그들은 계산대 옆에 진열되어 있는 값싸고 매력적인 물건들을 보게 된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 계산을 거의 끝내 기분이 좋다는 \u003cb class=\"key\">상황\u003c/b>을 먼저 제시해요. 그 \u003cb class=\"key\">행복한 \u003c/b>\u003cb class=\"key\">기분\u003c/b> 속에서 계산대 옆 물건들이 눈에 들어온다는 흐름이고, 뒤에 나올 충동 구매 이야기의 발판이 되는 문장이에요. 값싸고 매력적이라는 두 형용사를 and로 묶어 물건의 성격을 한 번에 보여 준다는 점도 눈여겨보세요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 문두 배치(연결·강조)\u003c/span> : In this happy mood [전치사구] + they see [주어 + 동사] : \"이렇게 행복한 기분에서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">형용사 병렬(and)\u003c/span> : the [attractive] and [inexpensive] things : \"값싸고 매력적인 물건들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that + 수동태\u003c/span> : things [선행사] + that + are displayed [관계대명사 + be동사 + 과거분사] : \"진열되어 있는\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"In this happy mood, 이렇게 행복한 기분에서. they see, 그들은 보게 된다. the attractive and inexpensive things, 값싸고 매력적인 물건들을. that are displayed, 진열되어 있는. beside the checkout counter, 계산대 옆에. 이 문장 전체를 해석하면, 이렇게 행복한 기분에서, 그들은 계산대 옆에 진열되어 있는 값싸고 매력적인 물건들을 보게 된다.","hl":"m"},{"n":22,"text":"앞 문장에서 계산을 거의 끝내서 기분이 좋다고 했죠? 그 행복한 기분이라는 상황을 한 번 더 짚어 주고, 그 기분 속에서 계산대 옆 물건들이 눈에 들어온다는 흐름이에요. 여기서 형용사 두 개를 and로 묶어서 물건의 성격을 한꺼번에 보여 주고 있다는 것도 기억해 두세요.","hl":"mn"},{"n":23,"text":"첫 번째로 In this happy mood는 전치사구가 문장 앞으로 나온 형태예요. 이렇게 앞에 나오면 앞 문장과의 문장 연결이 자연스러워지고, 이 기분이라는 점을 강조하는 효과도 있죠. 두 번째로 the attractive and inexpensive things를 보면 and가 두 형용사를 대등하게 묶는 병렬 구조예요. 병렬에서는 품사와 형태를 꼭 맞춰야 한다는 점, 시험에 자주 나옵니다. 세 번째로 that are displayed는 주격 관계대명사 that이 앞의 things를 받아서 절을 이끄는 구조예요. 물건은 진열되는 대상이니까 수동태 are displayed를 쓴다는 것도 같이 외워 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것들은 비록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Although \u003c/span>\u003cspan class=\"tgt\">these \u003c/span>\u003cspan class=\"tgt\">goods \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">쇼핑목록에 없는 것들이지만\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">shopping \u003c/span>\u003cspan class=\"tgt\">list\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">손님은 이제 느낀다\u003c/span>\u003cspan class=\"en\">these customers now feel\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들을 몰아가는 충동을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">impulse \u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">drives \u003c/span>\u003cspan class=\"tgt\">them \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">뭔가를 사도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">buy \u003c/span>\u003cspan class=\"tgt\">something\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단지 즐거움을 위해\u003c/span>\u003cspan class=\"en\">simply for enjoyment.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것들은 쇼핑목록에 없는 것들이지만 손님은 단지 즐거움을 위해 뭔가를 사게 만드는 충동을 느낀다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 목록에 없는 물건인데도 손님이 사고 싶어진다는 것이 이 문장의 핵심이에요. 여기서 impulse는 필요한 게 아니라 \u003cb class=\"key\">즐거움\u003c/b>을 위해 생기는 \u003cb class=\"key\">충동\u003c/b>을 뜻해요. 결국 주인이 노린 계산대 옆 진열의 효과가 드러나는 대목입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">양보의 접속사 although\u003c/span> : Although + 주어 + 동사 ~, 주어 + 동사 ... : \"이것들은 쇼핑목록에 없는 것들이지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : an impulse [선행사] + that + drives [관계대명사 + 동사] : \"그들을 몰아가는 충동\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">5형식 동사 drive + 목적어 + to부정사(목적격 보어)\u003c/span> : drive + [목적어 them] + [to buy (to부정사/목적격 보어)] : \"그들이 뭔가를 사도록 몰아가다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Although these goods, 이것들은 비록. are not on their shopping list, 쇼핑목록에 없는 것들이지만. these customers now feel, 손님은 이제 느낀다. an impulse that drives them, 그들을 몰아가는 충동을. to buy something, 뭔가를 사도록. simply for enjoyment, 단지 즐거움을 위해. 이 문장 전체를 해석하면, 이것들은 쇼핑목록에 없는 것들이지만 손님은 단지 즐거움을 위해 뭔가를 사게 만드는 충동을 느낀다.","hl":"m"},{"n":25,"text":"쇼핑목록에 없는 물건인데도 손님이 사고 싶어진다는 게 이 문장의 핵심이에요. 여기서 impulse는 필요한 물건이라서가 아니라 즐거움을 위해 생기는 충동이라는 뜻이죠. 결국 주인이 계산대 옆에 물건을 진열해 둔 효과가 여기서 드러납니다.","hl":"mn"},{"n":26,"text":"첫 번째로 Although은 양보의 접속사예요. 비록 그렇지만이라는 뜻으로, 뒤에는 주어와 동사가 다 들어 있는 완전한 절이 와야 하고 콤마로 주절과 나눠 줍니다. 두 번째로 that drives them에서 that은 앞에 있는 an impulse를 받는 주격 관계대명사예요. 바로 뒤에 동사 drives가 오니까 목적격이 아니라 주격이라는 걸 알 수 있죠. 관계대명사가 선행사를 받아 절 안에서 주어 노릇을 한다, 이게 포인트입니다. 세 번째로 drive는 목적어 뒤에 to부정사를 데려오는 동사예요. 목적격 보어로 to부정사가 와서 목적어가 할 행동을 나타내 준답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것이 바로\u003c/span>\u003cspan class=\"en\">This is exactly\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">슈퍼마켓 주인이 바라는 것\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">supermarket \u003c/span>\u003cspan class=\"tgt\">owner \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">hopes \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">손님들이 하기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">do\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것이 바로 슈퍼마켓 주인이 손님들이 하기를 바라는 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글 전체를 마무리하는 \u003cb class=\"key\">요약\u003c/b> 문장이에요. 계산대 옆에서 충동적으로 물건을 사는 것이 바로 주인이 원하는 \u003cb class=\"key\">결과\u003c/b>라는 걸 This is exactly로 강하게 못 박고 있죠. 그래서 주인이 바라는 바를 기준으로 앞의 내용을 한 번에 정리해 주는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계대명사 what(선행사 포함)\u003c/span> : This is + [what + 주어 + 동사] (보어로 쓰인 명사절) : \"슈퍼마켓 주인이 바라는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 that의 명사절(목적어)\u003c/span> : hopes + [that + they will do (that절/목적어)] : \"그들이 하기를 바란다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">대동사 do\u003c/span> : will + do [앞에 나온 동사 대신 쓰는 대동사] : \"그들이 그렇게 할 것이다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"This is exactly, 이것이 바로. what the supermarket owner hopes, 슈퍼마켓 주인이 바라는 것. that they will do, 손님들이 하기를. 이 문장 전체를 해석하면, 이것이 바로 슈퍼마켓 주인이 손님들이 하기를 바라는 것이다.","hl":"m"},{"n":28,"text":"이 문장은 글 전체를 마무리하는 요약 문장이에요. 계산대 옆에서 충동적으로 물건을 사는 것이 바로 주인이 원하는 결과라는 걸 This is exactly로 강하게 못 박고 있죠. 그래서 손님 시점이 아니라 주인 시점에서 앞의 내용을 한 번에 정리해 주는 겁니다.","hl":"mn"},{"n":29,"text":"첫 번째로 what the supermarket owner hopes는 관계대명사 what이 이끄는 명사절이에요. what은 선행사를 품고 있어서 슈퍼마켓 주인이 바라는 것이라는 명사절을 만들고, be동사 뒤 보어 자리에 딱 앉아 있죠. 두 번째로 hopes that they will do에서 that은 뒤에 완전한 절을 데려오는 명사절 접속사예요. hopes의 목적어 역할을 하고, 관계대명사 that처럼 뒤가 불완전하지 않다는 차이를 꼭 구별하세요. 세 번째로 they will do의 do는 대동사예요. 앞에 나온 buy something simply for enjoyment를 또 쓰기 싫으니까 반복을 피하려고 do를 쓴 겁니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>고객은 대부분 슈퍼마켓에 가기 전에 \u003cb class=\"key\">쇼핑 \u003c/b>\u003cb class=\"key\">목록\u003c/b>을 작성하고 목록에 따라 물건을 산다.\u003c/li>\u003cli>계산대에 도착할 때쯤 쇼핑이 거의 끝나므로 고객은 \u003cb class=\"key\">기쁘고 \u003c/b>\u003cb class=\"key\">편안한 \u003c/b>\u003cb class=\"key\">마음\u003c/b>이 된다.\u003c/li>\u003cli>이 행복한 기분 속에서 고객은 계산대 옆의 값싸고 매력적인 물건을 보고 \u003cb class=\"key\">충동\u003c/b>을 느껴 즐거움을 위해 구매한다.\u003c/li>\u003cli>이것은 슈퍼마켓 주인이 바라는 일로, 계산대 옆 진열이 \u003cb class=\"key\">매출을 \u003c/b>\u003cb class=\"key\">높이려는 \u003c/b>\u003cb class=\"key\">전략\u003c/b>임을 보여 준다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Supermarkets place attractive, inexpensive items near the checkout counter to trigger impulse buying in relaxed customers who have almost finished shopping.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">고객은 \u003cb class=\"key\">쇼핑 \u003c/b>\u003cb class=\"key\">목록\u003c/b>에 따라 계획적으로 물건을 사지만, 계산대 근처에서 \u003cb class=\"key\">기쁘고 \u003c/b>\u003cb class=\"key\">편안한 \u003c/b>\u003cb class=\"key\">마음\u003c/b>이 되면 목록에 없는 값싸고 매력적인 물건을 \u003cb class=\"key\">충동적으로 \u003c/b>\u003cb class=\"key\">구매\u003c/b>하게 된다. 슈퍼마켓 주인은 바로 이런 고객의 행동을 기대한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":30,"text":"정리해 볼게요. 고객은 쇼핑 목록을 가지고 계획적으로 쇼핑하지만, 계산대 앞에서 기쁘고 편안한 마음이 되면 값싸고 매력적인 물건에 대한 충동을 느껴 즉흥 구매를 하게 돼요. 이런 충동적으로 구매하는 행동을 슈퍼마켓 주인이 기대한다는 점이 글의 핵심이에요. 오늘 내용 잘 정리해 두고, 다음 강의에서 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
