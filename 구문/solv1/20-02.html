<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SO 레벨1 20강 적용독해02 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-sno{font-size:13px;color:#8493A1;font-weight:700;margin-bottom:8px}

.lp-chunk{display:flex;flex-direction:column}
.lp-chunk .ko{font-size:13px;color:var(--pk-t);font-weight:700;line-height:1.3;margin-bottom:2px}
.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}
.lp-top::before{height:5px;background:linear-gradient(90deg,var(--pk) 0,var(--pk) 80%,var(--am) 80%,var(--am) 100%)}
.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}
.lp-tag{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700;padding:2px 12px}
.lp-qn{flex:0 0 112px;height:112px;align-self:center;background:#fff;color:var(--pk);border:3px solid var(--pk);border-radius:50%;font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;font-size:26px}
.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}
.lp-qn .qt{display:block;white-space:nowrap;line-height:1.12;letter-spacing:-.02em}
.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}

.lp-st h4 i{border-radius:4px;width:auto;min-width:24px;padding:0 4px}
.lp-pill{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700}
.lp-chain span.c{background:#fff;border:1px solid #AEBBE6;border-radius:3px;font-weight:600}

.lp-chips .s{border:1px solid #AEBBE6;color:#3A4FA3}
.lp-chips .a{border:1px solid var(--am-b);color:var(--am-d);background:#FFFBF2}
.lp-sno .es{background:var(--am);border-radius:2px;font-weight:700}
.lp-chunk .en{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:600}
.lp-chunk+.lp-chunk{border-left:1px solid var(--pk-b)}
.lp .tgt{background:var(--am-l);border-bottom:2.5px dotted var(--am)}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"SO 레벨1 20강 적용독해02","audioDir":"20-02_audio","preview":false,"count":54,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">20강\u003cbr>적용독해02\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">SO 레벨1\u003c/div>\u003ch1>The Present Is a Gift: Make the Fullest Use of Now\u003c/h1>\u003ch2>현재는 선물이다: 지금을 최대한 활용하라\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>우리 중 많은 사람들은 과거를 후회하거나 미래를 걱정하며 시간을 보내지만, \u003cb class=\"key\">과거\u003c/b>는 바꿀 수 없고 미래는 알 수 없으므로 정말 중요한 것은 지금 살아가는 \u003cb class=\"key\">현재\u003c/b>이다. 그러므로 현재를 \u003cb class=\"key\">최대한 \u003c/b>\u003cb class=\"key\">활용\u003c/b>해야 한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Since the past cannot be changed and the future is unknown, what really matters is the present, so make the fullest use of it.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 과거와 미래, 그리고 현재에 관한 짧지만 아주 인상적인 글이에요. 우리가 대부분의 시간을 과거를 생각하거나 미래를 걱정하며 보낸다는 통념에서 시작해서, 결국 정말 중요한 것은 지금 살아가는 현재라는 주장으로 끝이 나죠. 요지는 현재를 최대한 활용하라는 것이고, 마지막에는 현재를 선물에 빗대는 멋진 언어유희가 기다리고 있어요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">카르페 디엠(Carpe diem)은 '현재를 잡아라'라는 뜻의 라틴어 표현으로, 로마 시인 호라티우스의 시에서 유래했어요. 심리학에서는 과거의 후회를 계속 곱씹는 것을 \u003cb class=\"key\">되새김\u003c/b>(rumination), 미래의 불확실성에 대한 걱정을 불안(anxiety)이라고 부르는데, 둘 다 지금 이 순간에 집중하는 힘을 빼앗아 가요. 마인드풀니스(mindfulness)는 의도적으로 지금 여기의 감각과 생각에 주의를 두는 훈련으로, 과거나 미래로 달아나는 마음을 되돌리는 연습이에요. 영화에 비유하면 과거는 이미 지나간 필름이고 미래는 아직 개봉하지 않은 예고편이라서, 우리가 실제로 볼 수 있는 화면은 오직 \u003cb class=\"key\">현재\u003c/b>라는 장면 하나뿐이에요. 그래서 시간 관리에서도 '지금 할 수 있는 일'에 에너지를 쓰는 것이 가장 효율적이에요.\u003c/div>","segs":[{"n":2,"text":"본격적으로 들어가기 전에 배경지식을 조금 쌓아 볼게요. 카르페 디엠, 즉 Carpe diem은 현재를 잡아라라는 뜻의 라틴어 표현이고, 고대 로마 시인 호라티우스의 시에서 나온 말이에요. 심리학에서는 과거의 후회를 계속 곱씹는 것을 되새김, 영어로 rumination이라고 부르고, 미래의 불확실성에 대한 걱정은 불안, anxiety라고 불러요. 이 둘은 모두 지금 이 순간에 집중하는 힘을 빼앗아 가죠. 최근에는 마인드풀니스, mindfulness라는 이름으로 지금 여기의 감각과 생각에 주의를 두는 훈련도 많이 합니다. 영화에 비유하면 과거는 이미 지나간 필름이고 미래는 아직 개봉하지 않은 예고편이라서, 우리가 실제로 볼 수 있는 화면은 현재라는 장면 하나뿐이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>과거와 미래에 붙잡힌 시간\u003csmall>도입·예시 · 문장 1–4\u003c/small>\u003c/h4>\u003cp>우리 중 많은 사람들은 대부분의 시간을 과거를 생각하거나 미래에 대한 \u003cb class=\"key\">기대와 \u003c/b>\u003cb class=\"key\">걱정\u003c/b>으로 보낸다. 글은 '그렇게 말하지 말았을 걸', '시간이 조금만 더 있었으면 성공할 수 있었는데' 같은 후회의 말과 '안 좋은 일이 닥칠 텐데 어떻게 하지' 같은 걱정의 말을 예로 든다. 이런 내용은 계속 이어진다는 문장으로 우리가 흔히 갖는 \u003cb class=\"key\">통념\u003c/b>을 정리한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>현재를 잃는 실수\u003csmall>전환·문제 · 문장 5–7\u003c/small>\u003c/h4>\u003cp>그렇게 걱정하면서 우리는 가장 중요한 것, 즉 \u003cb class=\"key\">현재\u003c/b>를 잃어버리는 커다란 실수를 범하고 있다. 지나간 것(과거)은 끝난 것이고 우리는 그것을 바꿀 수 없다. 그래서 과거는 붙잡을 대상이 아니라 \u003cb class=\"key\">되돌릴 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">없는\u003c/b> 대상으로 정리된다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>미래가 아니라 현재\u003csmall>주장·근거 · 문장 8–10\u003c/small>\u003c/h4>\u003cp>미래를 계획하되 그것에 대해 너무 오래 생각하지는 말라며 \u003cb class=\"key\">균형\u003c/b>을 제시한다. 우리는 지금 현재에 살고 있으므로 정말 중요한 건 현재라는 것이 그 근거다. 그래서 그 현재를 \u003cb class=\"key\">최대한 \u003c/b>\u003cb class=\"key\">활용\u003c/b>하라고 힘 있게 주장한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>현재라는 선물\u003csmall>결론·비유 · 문장 11–14\u003c/small>\u003c/h4>\u003cp>과거는 역사(history)고 미래는 알 수 없는 것(mystery)이라는 대구로 두 시간을 정리한다. '그럼 현재는?'이라는 질문에 '그것은 선물이다'라고 답하며 \u003cb class=\"key\">선물\u003c/b>이라는 비유를 완성한다. 마지막으로 present가 '현재'와 '선물' 두 뜻을 가진 \u003cb class=\"key\">중의적 \u003c/b>\u003cb class=\"key\">표현\u003c/b>임을 밝히며 글을 맺는다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 네 단계로 나누어 따라가 볼게요.","hl":null},{"n":4,"text":"첫 단계는 도입이자 예시예요. 우리 중 많은 사람들이 대부분의 시간을 과거를 생각하거나 미래에 대한 기대와 걱정으로 보낸다고 말하죠. 그리고 그렇게 말하지 말았을 걸, 시간이 조금만 더 있었으면 성공할 수 있었는데, 안 좋은 일이 닥칠 텐데 어떻게 하지 같은 말들을 실제로 인용해서 보여 줍니다. 이런 내용은 계속 이어진다는 문장으로 우리가 흔히 갖는 통념을 정리해요.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 분위기가 바뀝니다. 그렇게 걱정하면서 우리는 가장 중요한 것, 즉 현재를 잃어버리는 커다란 실수를 범하고 있다고 지적하죠. 이어서 지나간 것은 끝난 것이고 우리는 그것을 바꿀 수 없다고 말합니다. 과거는 되돌릴 수 없는 대상이라고 정리하는 셈이에요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 주장과 근거입니다. 미래를 계획하되 그것에 대해 너무 오래 생각하지는 말라고 균형을 잡아 주죠. 왜냐하면 우리는 지금 현재에 살고 있으므로 정말 중요한 건 현재이기 때문입니다. 그래서 그 현재를 최대한 활용하라고 힘 있게 주장해요.","hl":"f2"},{"n":7,"text":"마지막 단계는 결론이자 비유입니다. 과거는 역사, 미래는 신비라는 대구로 두 시간을 정리하고, 그럼 현재는 하고 물은 뒤에 그것은 선물이라고 답합니다. 그리고 present가 현재와 선물이라는 두 가지 뜻을 가진 중의적 표현이라서 그렇게 불린다는 것을 밝히며 글을 닫아요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">통념-반박\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 9번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 우리가 과거와 미래에 시간을 쓴다는 \u003cb class=\"key\">통념\u003c/b>을 예시로 먼저 제시한 뒤, 그 태도가 현재를 잃는 실수라고 \u003cb class=\"key\">반박\u003c/b>한다. 주제문인 아홉 번째 문장이 글의 뒤쪽에 놓여 있으므로 \u003cb class=\"key\">미괄식\u003c/b> 전개다. 마지막에는 과거·미래와 현재를 대조하는 \u003cb class=\"key\">대구\u003c/b>와 언어유희로 결론을 강하게 마무리한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>before long (4)\u003c/b>\u003cspan>예시 나열 마무리\u003c/span>\u003cb>but (8)\u003c/b>\u003cspan>대조·전환\u003c/span>\u003cb>because (9)\u003c/b>\u003cspan>근거 제시\u003c/span>\u003cb>What really matters is (9)\u003c/b>\u003cspan>주제 강조\u003c/span>\u003cb>That's why (14)\u003c/b>\u003cspan>결론·인과\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">the present\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">now\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a gift\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the present\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>과거·미래 (past &amp; future)\u003c/th>\u003cth>현재 (the present)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>바꿀 수 없고 알 수 없음\u003c/td>\u003ctd>지금 살아가고 있음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>후회와 걱정의 대상\u003c/td>\u003ctd>최대한 활용할 대상\u003c/td>\u003c/tr>\u003ctr>\u003ctd>history &amp; mystery\u003c/td>\u003ctd>a gift\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 통념을 먼저 보여 주고 그것을 반박하는 통념 반박 구조예요. 도입에서 우리가 과거와 미래에 시간을 쓴다는 익숙한 모습을 예시로 깔고, 뒤에서 그것이 현재를 잃는 실수라고 뒤집죠. 주제문인 아홉 번째 문장이 글의 뒤쪽에 놓여 있으므로 미괄식 전개입니다. 마지막에는 과거와 미래, 그리고 현재를 대조하는 대구와 언어유희로 결론을 단단하게 마무리해요.","hl":"ty"},{"n":9,"text":"신호어를 짚어 볼게요. 여덟 번째 문장의 but은 계획은 하되 집착하지 말라는 대조와 전환을 알려 주고, 아홉 번째 문장의 because는 주제문에 대한 근거를 붙여 줍니다. What really matters is라는 표현은 주제를 강하게 강조하는 표지이고, 마지막 문장의 That's why는 앞의 내용을 결론으로 묶어 주는 인과의 신호어예요. 그리고 the present가 now로, 다시 a gift로 이어지면서 같은 개념이 재진술되는 흐름도 꼭 눈여겨보세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>spend\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(시간을) 보내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>most of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>대부분의\u003c/span>\u003c/div>\u003cdiv>\u003cb>look forward to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>기대하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>worry about\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 대해 걱정하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>say\u003c/b>\u003cem>동사\u003c/em>\u003cspan>말하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>like that\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>그런 식으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>successful\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>성공한\u003c/span>\u003c/div>\u003cdiv>\u003cb>could have made\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>만들 수 있었을 텐데\u003c/span>\u003c/div>\u003cdiv>\u003cb>approach\u003c/b>\u003cem>동사\u003c/em>\u003cspan>다가오다\u003c/span>\u003c/div>\u003cdiv>\u003cb>go on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>계속 이어지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>mistake\u003c/b>\u003cem>명사\u003c/em>\u003cspan>실수\u003c/span>\u003c/div>\u003cdiv>\u003cb>lose\u003c/b>\u003cem>동사\u003c/em>\u003cspan>잃다\u003c/span>\u003c/div>\u003cdiv>\u003cb>what's past\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>지나간 것, 과거\u003c/span>\u003c/div>\u003cdiv>\u003cb>be over\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>끝나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>change\u003c/b>\u003cem>동사\u003c/em>\u003cspan>바꾸다\u003c/span>\u003c/div>\u003cdiv>\u003cb>plan\u003c/b>\u003cem>동사\u003c/em>\u003cspan>계획하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>dwell on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 오래 생각하다, 집착하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>matter\u003c/b>\u003cem>동사\u003c/em>\u003cspan>중요하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>live\u003c/b>\u003cem>동사\u003c/em>\u003cspan>살다\u003c/span>\u003c/div>\u003cdiv>\u003cb>make the fullest use of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 최대한 활용하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>fullest\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>최대한의\u003c/span>\u003c/div>\u003cdiv>\u003cb>history\u003c/b>\u003cem>명사\u003c/em>\u003cspan>역사\u003c/span>\u003c/div>\u003cdiv>\u003cb>mystery\u003c/b>\u003cem>명사\u003c/em>\u003cspan>신비, 알 수 없는 것\u003c/span>\u003c/div>\u003cdiv>\u003cb>gift\u003c/b>\u003cem>명사\u003c/em>\u003cspan>선물\u003c/span>\u003c/div>\u003cdiv>\u003cb>That's why\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>그래서 ~인 것이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>the present\u003c/b>\u003cem>명사\u003c/em>\u003cspan>현재, 선물\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"단어도 몇 개만 짚고 갈게요. look forward to는 기대하다, worry about은 걱정하다라는 뜻의 숙어이고, approach는 다가오다라는 동사예요. dwell on은 어떤 생각을 오래 곱씹는다는 뜻이고, matter는 동사로 중요하다라는 의미로 쓰였어요. make the fullest use of는 최대한 활용하다, That's why는 그래서 그런 것이다라는 표현으로 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">look forward to\u003c/b>\u003cspan class=\"m\">기대하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">anticipate\u003c/span>\u003cspan class=\"s\">expect\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">dread\u003c/span>\u003cspan class=\"a\">fear\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">worry about\u003c/b>\u003cspan class=\"m\">~에 대해 걱정하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">be anxious about\u003c/span>\u003cspan class=\"s\">be concerned about\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">be relieved\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">approach\u003c/b>\u003cspan class=\"m\">다가오다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">come near\u003c/span>\u003cspan class=\"s\">draw near\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">depart\u003c/span>\u003cspan class=\"a\">recede\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">change\u003c/b>\u003cspan class=\"m\">바꾸다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">alter\u003c/span>\u003cspan class=\"s\">modify\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">keep\u003c/span>\u003cspan class=\"a\">maintain\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">dwell on\u003c/b>\u003cspan class=\"m\">~을 오래 곱씹다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">linger on\u003c/span>\u003cspan class=\"s\">brood over\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">let go of\u003c/span>\u003cspan class=\"a\">dismiss\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">matter\u003c/b>\u003cspan class=\"m\">중요하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">be important\u003c/span>\u003cspan class=\"s\">count\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">be insignificant\u003c/span>\u003cspan class=\"a\">be trivial\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">gift\u003c/b>\u003cspan class=\"m\">선물\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">present\u003c/span>\u003cspan class=\"s\">offering\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"시험에 자주 나오는 어휘를 동의어와 반의어로 정리해 볼게요. look forward to의 동의어는 anticipate와 expect이고, 반의어는 dread와 fear예요. worry about은 be anxious about, be concerned about과 가깝고, 반대말은 be relieved나 ignore입니다. approach는 come near, draw near와 같고 depart, recede와 반대돼요. change는 alter, modify로 바꿔 쓸 수 있고 keep이나 maintain은 반대말이에요. dwell on은 linger on, brood over이고, 반대로 let go of나 dismiss는 집착을 놓는 표현이죠. matter는 be important, count와 같고 be insignificant와 반대이며, gift는 present, offering과 동의어예요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리들 중 많은 사람들은\u003c/span>\u003cspan class=\"en\">Many of us\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대부분의 시간을 보낸다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">spend \u003c/span>\u003cspan class=\"tgt\">most \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">time \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">과거를 생각하면서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">thinking\u003c/span> of the past,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">혹은 기대하면서\u003c/span>\u003cspan class=\"en\">or *\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">looking \u003c/span>\u003cspan class=\"tgt\">forward \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 미래에 대해 걱정하면서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">worrying \u003c/span>\u003cspan class=\"tgt\">about\u003c/span> the future.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리들 중 많은 사람들은 대부분의 시간을 과거를 생각하거나 미래에 대한 기대와 걱정으로 보낸다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글의 화제를 던지는 도입 문장이에요. 많은 사람이 시간을 과거 회상과 미래 걱정에 쏟고 있다는 \u003cb class=\"key\">문제 \u003c/b>\u003cb class=\"key\">상황\u003c/b>을 깔아 두고, 뒤에 나올 '현재의 중요성'과 대비시키는 역할을 합니다. spend most of our time thinking은 '대부분의 시간을 ~하면서 보낸다', looking forward to는 '기대하다', worrying about은 '걱정하다'라는 뜻이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">spend + 시간 + -ing(현재분사)\u003c/span> : spend + [시간 표현] + [동사-ing] (…하면서 시간을 보내다) : \"과거를 생각하면서 대부분의 시간을 보낸다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 to + 동명사, 동명사의 병렬\u003c/span> : look forward to + [명사/동명사] and worry about + [명사] : \"(미래를) 기대하고 걱정하는 것\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Many of us, 우리들 중 많은 사람들은. spend most of our time, 대부분의 시간을 보낸다. thinking of the past, 과거를 생각하면서. or *looking forward to, 혹은 기대하면서. and worrying about the future, 그리고 미래에 대해 걱정하면서. 이 문장 전체를 해석하면, 우리들 중 많은 사람들은 대부분의 시간을 과거를 생각하거나 미래에 대한 기대와 걱정으로 보낸다.","hl":"m"},{"n":13,"text":"이 문장은 글 전체의 화제를 던지는 도입 문장이에요. 우리들 중 많은 사람이 대부분의 시간을 과거를 생각하거나 미래를 기대하고 걱정하면서 보낸다고 말하고 있죠. 이렇게 과거와 미래에 마음을 빼앗긴 모습이, 뒤에서 강조할 현재의 중요성과 대비되는 문제 상황을 만들어 줍니다.","hl":"mn"},{"n":14,"text":"첫 번째로 spend most of our time thinking을 보세요. spend는 시간을 목적어로 받고 그 뒤에 동사 ing를 붙여서 두 가지 일이 동시에 일어나는 동시 상황을 나타내요. 두 번째로 looking forward to and worrying about을 보면, look forward to의 to는 부정사가 아니라 전치사예요. 그래서 뒤에는 동사원형이 아니라 명사 the future가 오고, worrying about과 병렬을 이루면서 the future를 함께 목적어로 가져요. 시험에서 to를 보고 무조건 동사원형을 쓰면 틀린다는 점, 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 이런 말을 해요\u003c/span>\u003cspan class=\"en\">We say things like\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">&quot;그렇게 말하지 말았을 걸.&quot;\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">wish \u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">hadn't \u003c/span>\u003cspan class=\"tgt\">said \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">that\u003c/span>.&quot;;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">&quot;시간이 조금만 더 있었으면 성공할 수 있었는데.&quot;\u003c/span>\u003cspan class=\"en\">&quot;A little more time \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">could \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">made \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">successful\u003c/span>.&quot;;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">&quot;안 좋은 일이 닥칠 텐데\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">Something \u003c/span>\u003cspan class=\"tgt\">bad \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">approaching\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 “그렇게 말하지 말았을 걸.” “시간이 조금만 더 있었으면 성공할 수 있었는데.” “안 좋은 일이 닥칠 텐데,”와 같은 말을 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 말한 '과거와 미래에 마음을 쓰는 모습'을 실제 대사로 보여 주는 문장이에요. 후회, 아쉬움, 불안이라는 세 가지 말버릇을 나열해 \u003cb class=\"key\">구체적 \u003c/b>\u003cb class=\"key\">예시\u003c/b>를 제시하고 있죠. 첫 번째는 과거를 후회하는 \u003cb class=\"key\">가정법 \u003c/b>\u003cb class=\"key\">과거완료\u003c/b>, 두 번째는 '성공할 수 있었을 텐데'라는 과거 사실의 반대 가정, 세 번째는 현재진행형으로 표현한 불안이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">wish + 가정법 과거완료\u003c/span> : I wish + [주어 + had + p.p.] (…하지 않았더라면 좋았을 텐데) : \"그렇게 말하지 말았을 걸\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 + have p.p. (과거 사실에 대한 가정)\u003c/span> : could + [have + p.p.] (…할 수 있었을 텐데) : \"그것을 성공하게 만들 수 있었을 텐데\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">현재진행형 (be + -ing)\u003c/span> : [주어] + is + [동사-ing] (…하고 있다, …가 다가오고 있다) : \"안 좋은 일이 닥치고 있다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"We say things like, 우리는 이런 말을 해요. \"I wish I hadn't said it like that.\", \"그렇게 말하지 말았을 걸.\". \"A little more time could have made it successful.\", \"시간이 조금만 더 있었으면 성공할 수 있었는데.\". \"Something bad is approaching, \"안 좋은 일이 닥칠 텐데. 이 문장 전체를 해석하면, 우리는 “그렇게 말하지 말았을 걸.” “시간이 조금만 더 있었으면 성공할 수 있었는데.” “안 좋은 일이 닥칠 텐데,”와 같은 말을 한다.","hl":"m"},{"n":16,"text":"이 문장은 앞에서 말한 과거와 미래에 대한 집착을 실제 대사로 보여 주는 부분이에요. 후회와 아쉬움과 불안, 이 세 가지 말버릇을 쭉 나열해서 구체적 예시를 제시하고 있죠. 이런 생각들이 머릿속을 떠나지 않는다는 걸 감각적으로 보여 주는 문장입니다.","hl":"mn"},{"n":17,"text":"첫 번째로 I wish I hadn't said it like that을 보세요. 이미 지나간 일을 후회할 때는 wish 뒤에 과거완료를 씁니다. 지금 사실의 반대는 가정법 과거로, 과거 사실의 반대는 가정법 과거완료로 표현한다는 원리를 기억하세요. 두 번째로 could have made it successful은 조동사 뒤에 have p.p.가 온 형태로, 과거 사실을 반대로 가정하는 표현이에요. 실제로는 시간이 더 있지 않았기 때문에 성공하지 못했다는 아쉬움이 담겨 있죠. 세 번째로 Something bad is approaching은 be동사에 ing를 붙인 현재진행형으로, 안 좋은 일이 지금 진행 중이라는, 다시 말해 다가오는 중이라는 불안감을 보여 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무엇을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">What \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내가 해야 하지?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">should \u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">do\u003c/span>?&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어떻게 하지?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 말한 불안이 마지막에 터져 나오는 짧은 외침이에요. 미래에 대한 걱정이 결국 '지금 내가 뭘 해야 하나'라는 \u003cb class=\"key\">당혹감\u003c/b>으로 이어진다는 걸 보여 주죠. 다음 문장에서 '이런 내용은 계속 이어진다'고 받아 주기 때문에, 이 말은 한 사람의 대사이면서 동시에 많은 사람의 \u003cb class=\"key\">입버릇\u003c/b>을 대표해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문사 + 조동사 도치 (의문문 어순)\u003c/span> : [의문사 What] + [조동사 should] + [주어 I] + [동사 do]? : \"내가 무엇을 해야 하지?\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"What, 무엇을. should I do?, 내가 해야 하지?. 이 문장 전체를 해석하면, 어떻게 하지?","hl":"m"},{"n":19,"text":"이 문장은 앞에서 말한 불안이 마지막에 터져 나오는 짧은 외침이에요. 미래에 대한 걱정이 결국 지금 내가 뭘 해야 하나라는 당혹감으로 이어진다는 걸 보여 주죠. 바로 다음 문장에서 이런 내용이 계속 이어진다고 받아 주기 때문에, 이 말은 한 사람의 대사이면서 많은 사람의 입버릇을 대표하는 표현입니다.","hl":"mn"},{"n":20,"text":"여기서는 의문사 What과 조동사 should의 순서를 꼭 확인하세요. 의문문에서는 조동사가 주어 앞으로 나오는 도치가 일어나요. 그리고 What은 do의 목적어인 의문사인데, 의문문이니까 문장 맨 앞으로 끌어올려진 형태라는 것도 함께 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 목록은\u003c/span>\u003cspan class=\"en\">The list\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">계속 이어진다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">goes \u003c/span>\u003cspan class=\"tgt\">on\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이런 내용은 계속 이어진다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 예로 든 걱정과 후회의 말들이 하나로 끝나지 않고 계속 이어진다는 뜻이에요. the list는 '목록'이라기보다 그런 말들의 \u003cb class=\"key\">열거\u003c/b>를 가리키고, go on은 '계속되다'라는 \u003cb class=\"key\">동사구\u003c/b>예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사구 go on + 3인칭 단수 현재형\u003c/span> : [주어 The list] + [goes on (동사구/3인칭 단수 현재)] : \"계속 이어진다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"The list, 그 목록은. goes on, 계속 이어진다. 이 문장 전체를 해석하면, 이런 내용은 계속 이어진다.","hl":"m"},{"n":22,"text":"여기서 the list는 앞에서 나온 '그렇게 말하지 말았을 걸' 같은 말들의 열거를 가리켜요. 걱정과 후회의 말이 하나둘로 끝나지 않고 계속 이어진다는 뜻이죠. go on은 동사구로 '계속되다, 이어지다'라는 뜻이에요.","hl":"mn"},{"n":23,"text":"첫 번째로 goes on을 보면 주어 The list가 단수라서 go에 es가 붙어 goes가 된 형태예요. 그리고 go on은 계속된다는 뜻의 동사구로 통째로 익혀 두시면 좋아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그렇게 걱정하면서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">worrying \u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">that\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 커다란 실수를 범하고 있다\u003c/span>\u003cspan class=\"en\">we are making the big mistake\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">잃어버리는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">losing\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가장 중요한 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">most \u003c/span>\u003cspan class=\"tgt\">important\u003c/span>:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">현재를\u003c/span>\u003cspan class=\"en\">the present.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그렇게 걱정하면서 우리는 가장 중요한 것, 즉 현재를 잃어버리는 커다란 실수를 범하고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 예로 든 걱정과 후회가 습관이 되면 정작 가장 중요한 현재를 놓친다는, 이 글의 핵심 경고 문장이에요. mistake of losing은 '~을 잃는 실수'로, of 뒤에 \u003cb class=\"key\">동명사\u003c/b>가 와서 실수의 내용을 채워요. what is the most important는 '가장 중요한 것'이라는 \u003cb class=\"key\">관계대명사 \u003c/b>\u003cb class=\"key\">what\u003c/b>절이고, 콜론 뒤의 the present가 그 내용을 \u003cb class=\"key\">동격\u003c/b>으로 풀어 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">분사구문(접속사 When이 남은 시간 부사절)\u003c/span> : [When + 현재분사구(worrying like that)], [주절 we are making ~] : \"그렇게 걱정하면서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 of + 동명사(동명사구)\u003c/span> : make a mistake of [losing (동명사/전치사 of의 목적어)] : \"잃어버리는 (실수)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">관계대명사 what(선행사 포함)절\u003c/span> : [what (= the thing that) + is + the most important] : 명사절 : \"가장 중요한 것\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"When worrying like that, 그렇게 걱정하면서. we are making the big mistake, 우리는 커다란 실수를 범하고 있다. of losing, 잃어버리는. what is the most important, 가장 중요한 것을. the present, 현재를. 이 문장 전체를 해석하면, 그렇게 걱정하면서 우리는 가장 중요한 것, 즉 현재를 잃어버리는 커다란 실수를 범하고 있다.","hl":"m"},{"n":25,"text":"이 문장은 글의 핵심 경고예요. 그렇게 걱정하고 후회하다 보면 정작 가장 중요한 현재를 놓친다는 거죠. mistake of losing에서 of 뒤에 오는 동명사가 실수의 내용을 채워 주고, what is the most important는 관계대명사 what이 이끄는 '가장 중요한 것'이라는 뜻의 절이에요. 콜론 뒤의 the present는 바로 그 내용을 동격으로 풀어 주는 표현이고요.","hl":"mn"},{"n":26,"text":"먼저 When worrying like that은 주절 주어 we와 같은 주어라서 반복을 생략하고 접속사 When만 남긴 분사구문이에요. 두 번째로 mistake of losing은 전치사 of 뒤에 동명사가 와서 '~을 잃는 실수'라는 의미를 만들고, 이 표현은 덩어리로 익혀 두면 좋아요. 세 번째로 what is the most important에서 what은 선행사를 포함한 관계대명사라서 '가장 중요한 것'이라는 명사절이 되고, 이 절 전체가 losing의 목적어 역할을 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지나간 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">What's \u003c/span>\u003cspan class=\"tgt\">past\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">끝난 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">over\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">지나간 것(과거)은 끝난 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 과거는 이미 지나가서 바꿀 수 없다는 걸 짧고 단호하게 정리한 문장이에요. What's past는 '지나간 것'이라는 \u003cb class=\"key\">주어절\u003c/b>이고, is over는 be동사 뒤에 형용사가 오는 \u003cb class=\"key\">서술\u003c/b> 구조예요. What's가 What is의 \u003cb class=\"key\">축약\u003c/b>이라는 점도 기억해 두세요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계대명사 what(선행사 포함)절 + is의 축약\u003c/span> : [What (= the thing that) + is + past] : 명사절(문장의 주어) : \"지나간 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be동사 + 형용사 보어(2형식)\u003c/span> : [주어 What's past] + [is (be동사)] + [over (형용사 보어)] : \"끝났다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"What's past, 지나간 것은. is over, 끝난 것이다. 이 문장 전체를 해석하면, 지나간 것(과거)은 끝난 것이다.","hl":"m"},{"n":28,"text":"이 문장은 과거는 이미 지나가서 바꿀 수 없다는 걸 짧고 단호하게 정리한 거예요. What's past는 '지나간 것'이라는 주어절이고, is over는 be동사 뒤에 형용사가 오는 서술 구조죠. What's는 What is의 축약이라는 점도 꼭 기억해 두세요.","hl":"mn"},{"n":29,"text":"첫 번째로 What's past에서 what은 선행사를 포함한 관계대명사로 'the thing that'처럼 쓰였어요. What's는 What is의 축약형이고, past는 '지나간'이라는 형용사로 주격 보어 역할을 합니다. 두 번째로 is over에서 over는 '끝난'이라는 형용사로 주어의 상태를 설명하는 주격 보어예요. 그래서 '과거는 끝났다'라는 자연스러운 해석이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 할 수 없다\u003c/span>\u003cspan class=\"en\">We \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can't \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 바꾸다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">change\u003c/span> it.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것을 바꿀 수는 없다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 과거는 이미 끝났다고 했죠. 이 문장은 그 사실을 \u003cb class=\"key\">바꿀 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">없음\u003c/b>으로 못 박아 과거에 대한 \u003cb class=\"key\">미련\u003c/b>을 끊어 주는 역할을 해요. 짧은 문장이지만 현재에 집중하라는 글 전체 흐름의 \u003cb class=\"key\">근거\u003c/b>가 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 can의 부정 + 동사원형\u003c/span> : [주어 We] + [조동사 can't] + [동사원형 change] + [목적어 it] : \"그것을 바꿀 수는 없다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"We can't, 우리는 할 수 없다. change it, 그것을 바꾸다. 이 문장 전체를 해석하면, 그것을 바꿀 수는 없다.","hl":"m"},{"n":31,"text":"과거는 이미 끝난 일이에요. 그래서 아무리 애를 써도 그것을 바꿀 수는 없죠. 이 문장은 그 사실을 아주 짧게 못 박아 주는 역할을 해요.","hl":"mn"},{"n":32,"text":"여기서 can't는 조동사 can에 not이 붙은 형태예요. 조동사 뒤에는 반드시 동사원형이 와야 하죠. 그래서 can't changed가 아니라 can't change라고 써야 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미래를 계획하라,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Plan \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">future\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 너무 많이 머물지 말라\u003c/span>\u003cspan class=\"en\">but \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003cspan class=\"tgt\">dwell \u003c/span>\u003cspan class=\"tgt\">too \u003c/span>\u003cspan class=\"tgt\">much \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것에 대해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">미래를 계획하라. 하지만 그것에 대해 너무 오래 생각하지는 말라.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 미래를 위한 \u003cb class=\"key\">계획\u003c/b>은 허용하지만 미래에 대한 \u003cb class=\"key\">집착\u003c/b>은 경계하는 문장이에요. Plan과 don't dwell이 \u003cb class=\"key\">대조\u003c/b>를 이루며 균형을 잡아 주죠. 덕분에 글은 '미래를 생각하지 말라'가 아니라 '지나치게 붙잡지 말라'는 \u003cb class=\"key\">중용\u003c/b>의 태도를 갖게 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문(동사원형으로 시작)\u003c/span> : [동사원형 Plan] + [전치사구 for the future] : \"미래를 계획하라\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부정 명령문 + 자동사 dwell on\u003c/span> : don't + [동사원형 dwell] + [부사구 too much] + [전치사 on + 목적어 it] : \"그것에 대해 너무 많이 생각하지 말라\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"Plan for the future, 미래를 계획하라. but don't dwell too much, 하지만 너무 많이 머물지 말라. on it, 그것에 대해. 이 문장 전체를 해석하면, 미래를 계획하라. 하지만 그것에 대해 너무 오래 생각하지는 말라.","hl":"m"},{"n":34,"text":"미래를 준비하는 것 자체는 나쁘지 않아요. 다만 그것에 대해 지나치게 오래 붙잡고 있지는 말라는 뜻이죠. 계획은 하되 걱정으로 시간을 다 쓰지 말라는 균형 잡힌 조언이에요.","hl":"mn"},{"n":35,"text":"먼저 Plan for the future는 동사원형으로 시작하는 명령문이에요. 주어 you가 생략된 형태죠. 두 번째로 don't dwell은 부정 명령문이고요. dwell은 자동사라서 뒤에 전치사 on을 붙여 dwell on it, 즉 그것에 대해 생각하다라는 표현으로 써요. too much는 정도를 나타내는 부사구로 동사 dwell을 꾸며 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정말로 중요한 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">What \u003c/span>\u003cspan class=\"tgt\">really \u003c/span>\u003cspan class=\"tgt\">matters\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">현재이다,\u003c/span>\u003cspan class=\"en\">is the present,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜냐하면 우리는 지금 그것을 살고 있기 때문이다\u003c/span>\u003cspan class=\"en\">because we \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">living\u003c/span> it now.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 지금 현재에 살고 있으므로 정말 중요한 건 현재이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글의 \u003cb class=\"key\">주제\u003c/b>를 정면으로 밝히는 문장이에요. 과거도 미래도 아닌 \u003cb class=\"key\">현재\u003c/b>가 가장 중요하다는 결론이죠. because 이하가 그 이유를 받쳐 주는데, 우리가 지금 살아가고 있는 시간이 바로 현재이기 때문입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계대명사 what(선행사 포함) 주어절\u003c/span> : [What + 부사 really + 동사 matters] + 동사 is + 보어 the present : \"정말로 중요한 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재진행형\u003c/span> : [be동사 are] + [현재분사 living] : \"살고 있다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"What really matters, 정말로 중요한 것은. is the present, 현재이다. because we are living it now, 왜냐하면 우리는 지금 그것을 살고 있기 때문이다. 이 문장 전체를 해석하면, 우리는 지금 현재에 살고 있으므로 정말 중요한 건 현재이다.","hl":"m"},{"n":37,"text":"이 문장이 글의 핵심 주제를 정리하는 문장이에요. 과거도 미래도 아닌 현재가 가장 중요하다는 결론이죠. 이유는 단순해요. 우리가 지금 살아가고 있는 시간이 바로 현재이기 때문입니다.","hl":"mn"},{"n":38,"text":"먼저 What really matters에서 what은 선행사를 포함한 관계대명사예요. 정말로 중요한 것이라는 절 전체가 주어가 되고, 그 뒤에 동사 is가 와서 the present가 보어가 되죠. 그다음 because는 이유를 이끄는 접속사이고, are living은 현재진행형이에요. be동사 are에 현재분사 living이 붙어서 지금 이 순간 살고 있다는 뜻을 나타냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">최대한 활용하라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Make\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">fullest\u003c/span> use\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을\u003c/span>\u003cspan class=\"en\">of it.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것을 최대한 활용하라.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 현재가 정말 중요하다고 한 앞 내용을 행동으로 옮기라는 명령이에요. 망설이지 말고 지금 이 순간을 \u003cb class=\"key\">최대한 \u003c/b>\u003cb class=\"key\">활용\u003c/b>하라는 핵심 메시지죠. it은 앞 문장의 the present, 즉 \u003cb class=\"key\">현재\u003c/b>를 가리켜요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문(동사원형으로 시작)\u003c/span> : [동사원형] + 목적어/보어 (주어 You 생략) : \"활용하라\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">최상급 형용사\u003c/span> : the + [최상급 형용사] + 명사 : \"가장 충분한/최대한의\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"Make the fullest use, 최대한 활용하라. of it, 그것을. 이 문장 전체를 해석하면, 그것을 최대한 활용하라.","hl":"m"},{"n":40,"text":"이 문장은 현재가 정말 중요하다고 한 앞 내용을 행동으로 옮기라는 명령이에요. 망설이지 말고 지금 이 순간을 최대한 활용하라는 핵심 메시지죠. 여기서 it은 앞 문장의 the present, 즉 현재를 가리킵니다.","hl":"mn"},{"n":41,"text":"첫 번째로 Make로 시작해서 주어 없이 동사원형으로 행동을 지시하는 명령문이에요. 두 번째로 the fullest는 full의 최상급 표현으로, the와 함께 쓰여 use를 꾸미는 최상급 역할을 하죠. 그래서 make use of가 활용하다라는 숙어로 쓰여서 the fullest use of it은 그것을 최대한 활용하라는 뜻이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">과거는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">The \u003c/span>\u003cspan class=\"tgt\">past \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">역사이고,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">history\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미래는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">future \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">알 수 없는 것이다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">mystery\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">과거는 역사고, 미래는 알 수 없는 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 과거는 이미 정해진 역사이고 미래는 알 수 없는 수수께끼라는 \u003cb class=\"key\">비유\u003c/b>로 두 시간을 \u003cb class=\"key\">대조\u003c/b>한 문장이에요. 과거와 미래에 마음을 빼앗기지 말고 현재로 시선을 돌리게 하려는 장치죠. 뒤에 이어지는 '현재는 선물'이라는 말을 더 돋보이게 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">2형식 문장(주어 + be동사 + 주격 보어)\u003c/span> : [주어] + is + [명사 보어] : \"과거는 역사이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">2형식 문장의 대조 병렬\u003c/span> : [the future] + is + [a mystery] : \"미래는 알 수 없는 것이다\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"The past, 과거는. is history, 역사이고. the future, 미래는. is a mystery, 알 수 없는 것이다.. 이 문장 전체를 해석하면, 과거는 역사고, 미래는 알 수 없는 것이다.","hl":"m"},{"n":43,"text":"이 문장은 과거는 이미 정해진 역사이고 미래는 알 수 없는 수수께끼라는 비유로 두 시간을 대조해요. 그래서 과거와 미래에 마음을 빼앗기지 말고 현재로 시선을 돌리게 하려는 역할을 하죠. 뒤에 이어지는 현재는 선물이라는 말을 더 돋보이게 합니다.","hl":"mn"},{"n":44,"text":"첫 번째로 The past is history는 주어 The past를 is로 연결하고 history가 주어의 정체를 설명하는 주격 보어가 되는 2형식 문장이에요. 두 번째로 the future is a mystery도 같은 2형식 구조를 반복하면서 과거와 미래를 대조하고 병렬로 묶어 리듬을 만들어요. 그래서 두 절이 짧고 균형 있게 이어지는 문장이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그럼\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">And \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">현재는?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">now?\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그럼 현재는?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 과거와 미래를 길게 말한 뒤 '그럼 현재는?' 하고 되묻는 \u003cb class=\"key\">수사 \u003c/b>\u003cb class=\"key\">의문문\u003c/b>이에요. 대답을 요구하는 질문이 아니라, 현재를 \u003cb class=\"key\">선물\u003c/b>에 비유하는 다음 문장으로 넘어가기 위한 \u003cb class=\"key\">전환\u003c/b> 장치죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">생략 의문문(수사 의문문)\u003c/span> : [And] + [now]? (What about now?의 생략) : \"그럼 현재는?\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"And, 그럼. now?, 현재는?. 이 문장 전체를 해석하면, 그럼 현재는?","hl":"m"},{"n":46,"text":"이 문장은 과거와 미래를 길게 말한 뒤 그럼 현재는 하고 되묻는 수사 의문문이에요. 대답을 요구하는 질문이 아니라, 현재를 선물에 비유하는 다음 문장으로 넘어가기 위한 전환 장치죠.","hl":"mn"},{"n":47,"text":"And now?는 What about now? 같은 표현에서 일부가 빠진 생략 표현이에요. 여기서는 대답을 듣기 위한 질문이 아니라 흐름을 바꾸는 수사 의문문으로 쓰였죠. 그래서 다음 문장에서 현재를 선물이라고 말하는 결론을 자연스럽게 끌어냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">음,\u003c/span>\u003cspan class=\"en\">Well,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 ~이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">it's\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">선물\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">gift\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 선물이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞의 ‘현재는?’이라는 질문에 대한 짧은 대답으로, 현재를 \u003cb class=\"key\">선물\u003c/b>에 비유한다. Well은 ‘음, 그렇다면’ 정도로 말을 부드럽게 잇는 \u003cb class=\"key\">감탄사\u003c/b>이고, it은 현재를 가리킨다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사 축약형(It is)\u003c/span> : [It] + [is] + [보어] : \"그것은 ~이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 보어\u003c/span> : [주어 It] + [동사 is] + [보어 a gift] : \"선물\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"Well, 음. it's, 그것은 ~이다. a gift, 선물. 이 문장 전체를 해석하면, 그것은 선물이다.","hl":"m"},{"n":49,"text":"여기서 it은 바로 앞에 나온 now, 즉 현재를 가리켜요. 현재를 선물이라고 말하며 분위기를 부드럽게 바꾸는 짧은 대답이죠. Well은 음, 그렇다면 정도로 말을 잇는 감탄사이고, gift가 뒤 문장의 present와 연결된다는 점도 기억해 두세요.","hl":"mn"},{"n":50,"text":"첫 번째, it's는 it is의 축약형으로 주어 it의 상태를 설명하는 be동사 문장을 만들어요. 두 번째, a gift는 주격 보어로 주어가 무엇인지 알려 주는 말이에요. 그래서 이 문장은 현재가 선물이라는 비유를 완성하죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">That's \u003c/span>\u003cspan class=\"tgt\">why\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 불린다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">it's \u003c/span>\u003cspan class=\"tgt\">called\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">현재[선물]로\u003c/span>\u003cspan class=\"en\">the present.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그래서 그것이 현재[선물]로 불리는 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> That's why는 앞 문장을 받아 ‘그래서 ~인 것이다’라는 \u003cb class=\"key\">결론\u003c/b>을 만든다. present는 ‘현재’와 ‘선물’의 \u003cb class=\"key\">중의\u003c/b>를 살려, 현재가 선물이라 불리는 이유를 밝히는 마무리 문장이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">That is why + 절 관용 표현\u003c/span> : [That is why] + [주어 + 동사] : \"그래서 ~이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태(현재시제)\u003c/span> : [it] + [is called] + [the present] : \"그것은 ~로 불린다\"\u003c/div>\u003c/div>","segs":[{"n":51,"text":"That's why, 그래서. it's called, 그것이 불린다. the present, 현재[선물]로. 이 문장 전체를 해석하면, 그래서 그것이 현재[선물]로 불리는 것이다.","hl":"m"},{"n":52,"text":"That's why는 앞 문장을 받아 그래서 그런 이유라는 결론을 만들어요. 여기서 present는 현재라는 뜻과 선물이라는 뜻을 동시에 살린 중의적 표현이에요. 그래서 이 문장은 현재가 선물로 불리는 이유를 밝히는 마무리 역할을 하죠.","hl":"mn"},{"n":53,"text":"첫 번째, That's why는 That is why의 축약으로 뒤에 절이 와서 그래서 그런 이유라는 관용 표현을 만들어요. 두 번째, it's called는 it is called의 수동태로, call의 목적어였던 it이 주어로 올라간 형태예요. 행위자는 일반 사람이라 생략되어 있습니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>우리 중 많은 사람들은 과거를 생각하거나 미래에 대한 \u003cb class=\"key\">기대와 \u003c/b>\u003cb class=\"key\">걱정\u003c/b>으로 대부분의 시간을 보낸다.\u003c/li>\u003cli>그렇게 걱정하면서 우리는 가장 중요한 것인 \u003cb class=\"key\">현재\u003c/b>를 잃어버리는 커다란 실수를 범한다.\u003c/li>\u003cli>과거는 바꿀 수 없고 미래는 알 수 없으므로, 우리가 지금 살고 있는 \u003cb class=\"key\">현재\u003c/b>를 최대한 활용해야 한다.\u003c/li>\u003cli>과거는 역사, 미래는 신비이며, 현재는 '현재'와 '선물'을 함께 뜻하는 \u003cb class=\"key\">중의적 \u003c/b>\u003cb class=\"key\">표현\u003c/b>으로 불린다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Since the past cannot be changed and the future is unknown, what really matters is the present, so make the fullest use of it.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">우리 중 많은 사람들은 과거를 후회하거나 미래를 걱정하며 시간을 보내지만, \u003cb class=\"key\">과거\u003c/b>는 바꿀 수 없고 미래는 알 수 없으므로 정말 중요한 것은 지금 살아가는 \u003cb class=\"key\">현재\u003c/b>이다. 그러므로 현재를 \u003cb class=\"key\">최대한 \u003c/b>\u003cb class=\"key\">활용\u003c/b>해야 한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":54,"text":"정리해 볼게요. 우리는 과거를 후회하고 미래를 걱정하며 시간을 쓰지만, 과거는 바꿀 수 없고 미래는 알 수 없어요. 정말 중요한 것은 지금 살아가는 현재이고, 그래서 현재를 최대한 활용해야 합니다. 과거는 역사, 미래는 신비, 그리고 지금 이 순간은 선물이라는 마지막 문장을 꼭 기억해 주세요. 오늘도 수고했어요, 다음 시간에 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
