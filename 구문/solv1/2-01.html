<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SO 레벨1 2강 적용독해01 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-chips .x{background:none;color:#999;padding:0}
.lp-sno{font-size:13px;color:#8493A1;font-weight:700;margin-bottom:8px}

.lp-chunks{display:flex;flex-wrap:wrap;gap:16px 10px;margin-bottom:12px;align-items:flex-end}
.lp-chunk{display:flex;flex-direction:column}
.lp-chunk .ko{font-size:13px;color:var(--pk-t);font-weight:700;line-height:1.3;margin-bottom:2px}
.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}
.lp-top::before{height:5px;background:linear-gradient(90deg,var(--pk) 0,var(--pk) 80%,var(--am) 80%,var(--am) 100%)}
.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}
.lp-tag{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700;padding:2px 12px}
.lp-qn{flex:0 0 112px;height:112px;align-self:center;background:#fff;color:var(--pk);border:3px solid var(--pk);border-radius:50%;font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;font-size:26px}
.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}
.lp-qn .qt{display:block;white-space:nowrap;line-height:1.12;letter-spacing:-.02em}
.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}

.lp-st h4{color:var(--ink,#1B2733)}
.lp-st h4 i{border-radius:4px;width:auto;min-width:24px;padding:0 4px}
.lp-pill{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700}
.lp-chain span.c{background:#fff;border:1px solid #AEBBE6;border-radius:3px;font-weight:600}
.lp-ct th{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif}
.lp-vg em{background:#fff;border:1px solid var(--pk-b);border-radius:3px}
.lp-sa>div{border-radius:4px;border-color:var(--pk-b)}

.lp-chips .s{border:1px solid #AEBBE6;color:#3A4FA3}
.lp-chips .a{border:1px solid var(--am-b);color:var(--am-d);background:#FFFBF2}
.lp-sno .es{background:var(--am);border-radius:2px;font-weight:700}
.lp-chunk .en{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:600}
.lp-chunk+.lp-chunk{border-left:1px solid var(--pk-b)}
.lp .tgt{background:var(--am-l);border-bottom:2.5px dotted var(--am)}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"SO 레벨1 2강 적용독해01","audioDir":"2-01_audio","preview":false,"count":34,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">2강\u003cbr>적용독해01\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">SO 레벨1\u003c/div>\u003ch1>Money Is Not the Key to Happiness\u003c/h1>\u003ch2>돈은 행복의 열쇠가 아니다\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>많은 사람들이 \u003cb class=\"key\">돈\u003c/b>이 행복의 열쇠라고 믿지만, 복권 당첨자처럼 갑자기 부자가 된 사람들은 여가 시간을 어떻게 보낼지 몰라 하고 친구들과 멀어져 오히려 \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">외로움\u003c/b>을 느낀다. 멋진 행운으로 보였던 일이 결국 \u003cb class=\"key\">정반대\u003c/b>가 되어 버린다는 내용이다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Sudden wealth does not guarantee happiness; it can even leave people lonelier than they ever were before.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 돈과 행복의 관계를 다룬 글이에요. 많은 사람들이 돈이 행복의 열쇠라고 믿지만, 경험은 그것이 사실이 아니라고 말해 주죠. 복권 당첨자처럼 갑자기 부자가 된 사람들의 이야기를 통해 왜 그런지 살펴볼 거예요. 요지는 돈이 행복을 보장하지 않는다는 것, 오히려 더 외로워질 수 있다는 것입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">심리학에서는 돈과 행복의 관계를 \u003cb class=\"key\">주관적 \u003c/b>\u003cb class=\"key\">안녕감\u003c/b>(subjective well-being)이라는 개념으로 연구한다. 소득이 일정 수준에 도달할 때까지는 돈이 행복에 도움을 주지만, 그 이후에는 그 영향이 크게 줄어든다고 알려져 있다. 이를 흔히 \u003cb class=\"key\">적응\u003c/b>(hedonic adaptation)이라고 부르는데, 사람은 좋아진 환경에 곧 익숙해져서 예전과 비슷한 수준의 만족감으로 돌아간다는 뜻이다. 또한 갑자기 큰돈을 얻으면 인간관계의 \u003cb class=\"key\">균형\u003c/b>이 흔들릴 수 있다. 마치 새 신발을 사면 처음 며칠은 신나지만 곧 아무 느낌이 없어지는 것과 비슷하다. 그래서 중요한 것은 돈의 양보다 그것을 어떻게 쓰고 누구와 나누는가이다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 조금 이야기해 볼게요. 심리학에서는 돈과 행복의 관계를 주관적 안녕감, 영어로 subjective well-being이라는 개념으로 연구해요. 소득이 일정 수준에 도달할 때까지는 돈이 행복에 도움을 주지만, 그 이후에는 영향이 크게 줄어든다고 알려져 있죠. 이걸 적응, 영어로 hedonic adaptation이라고 부르는데, 좋아진 환경에 곧 익숙해져서 예전과 비슷한 만족감으로 돌아간다는 뜻이에요. 또 갑자기 큰돈을 얻으면 인간관계의 균형이 흔들릴 수 있어요. 새 신발을 사면 처음 며칠은 신나지만 곧 아무 느낌이 없어지는 것과 비슷하죠. 그래서 중요한 것은 돈의 양보다 그것을 어떻게 쓰고 누구와 나누는가랍니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>통념 제시\u003csmall>도입·통념 · 문장 1\u003c/small>\u003c/h4>\u003cp>많은 사람들이 \u003cb class=\"key\">돈\u003c/b>이 행복의 열쇠라고 믿는다는 일반적인 생각을 먼저 꺼낸다. 여기서 key는 실제 열쇠가 아니라 '핵심'이라는 뜻의 \u003cb class=\"key\">비유\u003c/b>로 쓰였다. 독자가 고개를 끄덕일 만한 \u003cb class=\"key\">통념\u003c/b>을 깔아 두는 도입부이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>정면 반박\u003csmall>전환·주장 · 문장 2\u003c/small>\u003c/h4>\u003cp>글쓴이는 경험을 근거로 앞의 통념을 곧바로 부정한다. But이라는 \u003cb class=\"key\">역접\u003c/b> 신호가 통념과 반박을 갈라 놓는다. simply라는 부사가 '정말로 단순히 사실이 아니다'라는 \u003cb class=\"key\">강조\u003c/b>를 더해 준다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>부유해진 뒤\u003csmall>예시 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>복권 당첨자처럼 \u003cb class=\"key\">갑자기 \u003c/b>\u003cb class=\"key\">부자가 \u003c/b>\u003cb class=\"key\">된 \u003c/b>\u003cb class=\"key\">사람\u003c/b>들을 예로 든다. 이들은 직업을 그만두고 더 좋은 동네의 더 큰 집으로 이사한다. 그러나 이렇게 한 뒤에 그들은 대체로 \u003cb class=\"key\">여가 \u003c/b>\u003cb class=\"key\">시간\u003c/b>을 어떻게 보낼지 모른다는 것이 however로 이어지는 반전이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>멀어지는 친구\u003csmall>근거·심화 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>더 나쁜 것은 \u003cb class=\"key\">친한 \u003c/b>\u003cb class=\"key\">친구\u003c/b>들이 점점 멀어지고 더 이상 찾아오지 않을 수 있다는 점이다. 새로운 동네에서 갑자기 \u003cb class=\"key\">친구를 \u003c/b>\u003cb class=\"key\">사귀는 \u003c/b>\u003cb class=\"key\">것\u003c/b>도 매우 어려울 수 있다. 그래서 그들은 부자가 되기 전의 어느 때보다 \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">외로움\u003c/b>을 느낀다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>뒤집힌 결말\u003csmall>결론 · 문장 7\u003c/small>\u003c/h4>\u003cp>멋진 행운으로 보였던 일이 \u003cb class=\"key\">정반대\u003c/b>가 되어 버린다고 정리한다. turn out은 결과적으로 드러나다, 판명되다는 뜻이다. 앞에서 쌓아 온 기대를 한 문장으로 완전히 뒤집는 \u003cb class=\"key\">결론\u003c/b>이다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 단계별로 따라가 볼게요.","hl":null},{"n":4,"text":"첫 단계는 통념을 꺼내는 부분이에요. 첫 번째 문장에서 많은 사람들이 돈이 행복의 열쇠라고 믿는다고 말하죠. 여기서 key는 실제 열쇠가 아니라 핵심이라는 뜻의 비유로 쓰였어요. 글쓴이는 독자가 공감할 만한 일반적인 생각을 먼저 깔아 줍니다.","hl":"f0"},{"n":5,"text":"두 번째 단계에서 글쓴이는 곧바로 그 통념을 반박해요. 두 번째 문장의 But이 결정적인 신호인데, 경험은 이것이 진실이 아니라고 보여 준다고 말하죠. simply라는 부사가 붙어서 정말 단순하게 사실이 아니라는 점을 강조합니다.","hl":"f1"},{"n":6,"text":"세 번째 단계는 예시예요. 세 번째 문장에서 복권 당첨자처럼 갑자기 부자가 된 사람들은 직업을 그만두고 더 좋은 동네의 더 큰 집으로 이사한다고 하죠. 그런데 네 번째 문장에서 however가 나오면서 분위기가 바뀌어요. 이렇게 한 후에 그들은 대체로 여가 시간을 어떻게 보낼지 모른다는 거예요.","hl":"f2"},{"n":7,"text":"네 번째 단계는 인간관계의 변화를 다뤄요. 다섯 번째 문장에서 Even worse, 즉 더 나쁜 것은 친한 친구들이 점점 멀어지고 더 이상 찾아오지 않을 수 있다는 점이에요. 여섯 번째 문장에서는 새로운 동네에서 갑자기 친구를 사귀는 것이 매우 어려울 수 있다고 덧붙이죠. 그래서 그들은 부자가 되기 전의 어느 때보다 더 외로움을 느낀다고 합니다.","hl":"f3"},{"n":8,"text":"마지막 단계는 결론이에요. 일곱 번째 문장에서 멋진 행운으로 보였던 일이 정반대가 되어 버린다고 정리하죠. turn out은 결과적으로 드러나다, 판명되다는 뜻이에요. 앞에서 쌓아 온 기대를 한 문장으로 완전히 뒤집는 마무리입니다.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">통념-반박\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 2번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 흔한 믿음을 제시하고 두 번째 문장에서 곧바로 부정하기 때문에 \u003cb class=\"key\">통념-반박\u003c/b> 전개이다. 필자의 주장이 글 앞부분에 나오므로 \u003cb class=\"key\">두괄식\u003c/b>으로 판단한다. 이후에는 복권 당첨자라는 구체적 \u003cb class=\"key\">예시\u003c/b>가 이어지고, 친구들이 멀어진다는 근거가 심화되며, 마지막 문장이 결론을 받는다. 즉 주장을 먼저 던지고 사례와 결과로 뒷받침하는 \u003cb class=\"key\">주장-근거\u003c/b> 구조이기도 하다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>But (2)\u003c/b>\u003cspan>통념 반박 신호\u003c/span>\u003cb>such as (3)\u003c/b>\u003cspan>예시 제시\u003c/span>\u003cb>however (4)\u003c/b>\u003cspan>전환·역접\u003c/span>\u003cb>Even worse (5)\u003c/b>\u003cspan>부정적 심화\u003c/span>\u003cb>so (6)\u003c/b>\u003cspan>인과·결과\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">the key to happiness\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">become very rich\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">wonderful luck\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">turns out the opposite\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>기대 (통념)\u003c/th>\u003cth>실제 (경험)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>돈 = 행복의 열쇠\u003c/td>\u003ctd>돈 = 외로움의 시작\u003c/td>\u003c/tr>\u003ctr>\u003ctd>자유 시간과 새 집\u003c/td>\u003ctd>무료함과 멀어진 친구\u003c/td>\u003c/tr>\u003ctr>\u003ctd>멋진 행운\u003c/td>\u003ctd>정반대의 결과\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글의 전개 방식은 통념과 반박이에요. 흔한 믿음을 먼저 제시하고 경험을 근거로 그것을 부정하는 구조죠. 주제문은 두 번째 문장이고, 글의 핵심 주장이 맨 앞에 나오기 때문에 두괄식이라고 볼 수 있어요. 통념과 반박, 그리고 예시가 앞쪽에 몰려 있고 마지막 문장이 결론을 받아 주는 형태입니다.","hl":"ty"},{"n":10,"text":"신호어를 짚어 볼게요. 두 번째 문장의 But은 통념을 뒤집는 반박 신호이고, 세 번째 문장의 such as는 예시를 끌어오는 표현이에요. 네 번째 문장의 however는 기대가 무너지는 지점을 알려 주고, 다섯 번째 문장의 Even worse는 부정적인 내용을 한 단계 더 밀어붙입니다. 여섯 번째 문장의 so는 앞의 어려움이 외로움이라는 결과로 이어지는 인과의 연결고리이고요. 재진술도 눈여겨보세요. the key to happiness가 wonderful luck으로 이어지고, 결국 turns out the opposite로 뒤집히는 흐름이 이 글의 뼈대입니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>believe\u003c/b>\u003cem>동사\u003c/em>\u003cspan>믿다\u003c/span>\u003c/div>\u003cdiv>\u003cb>key\u003c/b>\u003cem>명사\u003c/em>\u003cspan>열쇠, 핵심\u003c/span>\u003c/div>\u003cdiv>\u003cb>happiness\u003c/b>\u003cem>명사\u003c/em>\u003cspan>행복\u003c/span>\u003c/div>\u003cdiv>\u003cb>experience\u003c/b>\u003cem>명사\u003c/em>\u003cspan>경험\u003c/span>\u003c/div>\u003cdiv>\u003cb>simply\u003c/b>\u003cem>부사\u003c/em>\u003cspan>단순히, 그저\u003c/span>\u003c/div>\u003cdiv>\u003cb>true\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>사실인, 진실한\u003c/span>\u003c/div>\u003cdiv>\u003cb>suddenly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>갑자기\u003c/span>\u003c/div>\u003cdiv>\u003cb>rich\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>부유한\u003c/span>\u003c/div>\u003cdiv>\u003cb>such as\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>예를 들어, ~와 같은\u003c/span>\u003c/div>\u003cdiv>\u003cb>lottery\u003c/b>\u003cem>명사\u003c/em>\u003cspan>복권\u003c/span>\u003c/div>\u003cdiv>\u003cb>winner\u003c/b>\u003cem>명사\u003c/em>\u003cspan>당첨자, 승자\u003c/span>\u003c/div>\u003cdiv>\u003cb>often\u003c/b>\u003cem>부사\u003c/em>\u003cspan>종종\u003c/span>\u003c/div>\u003cdiv>\u003cb>quit\u003c/b>\u003cem>동사\u003c/em>\u003cspan>그만두다\u003c/span>\u003c/div>\u003cdiv>\u003cb>move\u003c/b>\u003cem>동사\u003c/em>\u003cspan>이사하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>neighborhood\u003c/b>\u003cem>명사\u003c/em>\u003cspan>동네, 이웃\u003c/span>\u003c/div>\u003cdiv>\u003cb>however\u003c/b>\u003cem>부사\u003c/em>\u003cspan>그러나\u003c/span>\u003c/div>\u003cdiv>\u003cb>usually\u003c/b>\u003cem>부사\u003c/em>\u003cspan>대개, 보통\u003c/span>\u003c/div>\u003cdiv>\u003cb>free time\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>여가 시간\u003c/span>\u003c/div>\u003cdiv>\u003cb>even worse\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>더 나쁜 것은\u003c/span>\u003c/div>\u003cdiv>\u003cb>grow distant\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>멀어지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>come over\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>(집에) 들르다, 찾아오다\u003c/span>\u003c/div>\u003cdiv>\u003cb>difficult\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>어려운\u003c/span>\u003c/div>\u003cdiv>\u003cb>make friends\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>친구를 사귀다\u003c/span>\u003c/div>\u003cdiv>\u003cb>lonely\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>외로운\u003c/span>\u003c/div>\u003cdiv>\u003cb>ever\u003c/b>\u003cem>부사\u003c/em>\u003cspan>어느 때보다, 지금까지\u003c/span>\u003c/div>\u003cdiv>\u003cb>wonderful\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>멋진, 훌륭한\u003c/span>\u003c/div>\u003cdiv>\u003cb>luck\u003c/b>\u003cem>명사\u003c/em>\u003cspan>행운\u003c/span>\u003c/div>\u003cdiv>\u003cb>turn out\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>결과적으로 드러나다, 판명되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>opposite\u003c/b>\u003cem>명사\u003c/em>\u003cspan>정반대\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"단어도 몇 개 짚을게요. quit은 직업을 그만두다는 뜻이고, grow distant는 친구 사이가 멀어진다는 뜻이에요. come over는 집으로 찾아오다, make friends는 친구를 사귀다라는 숙어이고요. turn out은 결과적으로 판명되다로 마지막 문장을 이해하는 열쇠입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">true\u003c/b>\u003cspan class=\"m\">사실인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">accurate\u003c/span>\u003cspan class=\"s\">correct\u003c/span>\u003cspan class=\"s\">factual\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">false\u003c/span>\u003cspan class=\"a\">untrue\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">happiness\u003c/b>\u003cspan class=\"m\">행복\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">joy\u003c/span>\u003cspan class=\"s\">delight\u003c/span>\u003cspan class=\"s\">pleasure\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">sadness\u003c/span>\u003cspan class=\"a\">sorrow\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">rich\u003c/b>\u003cspan class=\"m\">부유한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">wealthy\u003c/span>\u003cspan class=\"s\">affluent\u003c/span>\u003cspan class=\"s\">well-off\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">poor\u003c/span>\u003cspan class=\"a\">needy\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">quit\u003c/b>\u003cspan class=\"m\">그만두다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">give up\u003c/span>\u003cspan class=\"s\">resign\u003c/span>\u003cspan class=\"s\">leave\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">continue\u003c/span>\u003cspan class=\"a\">keep\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">distant\u003c/b>\u003cspan class=\"m\">멀어진\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">faraway\u003c/span>\u003cspan class=\"s\">remote\u003c/span>\u003cspan class=\"s\">aloof\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">close\u003c/span>\u003cspan class=\"a\">near\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">lonely\u003c/b>\u003cspan class=\"m\">외로운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">isolated\u003c/span>\u003cspan class=\"s\">lonesome\u003c/span>\u003cspan class=\"s\">solitary\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">accompanied\u003c/span>\u003cspan class=\"a\">sociable\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">luck\u003c/b>\u003cspan class=\"m\">행운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">fortune\u003c/span>\u003cspan class=\"s\">chance\u003c/span>\u003cspan class=\"s\">blessing\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">misfortune\u003c/span>\u003cspan class=\"a\">bad luck\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어도 정리해 볼게요. rich는 wealthy, affluent와 비슷하고 poor와 반대돼요. quit은 give up, resign과 가깝고 continue와는 반대죠. lonely는 isolated, lonesome과 비슷하고 accompanied와 반대됩니다. luck은 fortune, chance와 같은 뜻이고 misfortune과 반대예요. true는 accurate, correct와 가깝고 false와 반대라는 점도 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 사람들이\u003c/span>\u003cspan class=\"en\">Many people\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">믿는다, 라고\u003c/span>\u003cspan class=\"en\">believe \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">돈이 열쇠라고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">money \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">key \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">행복에 대한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">happiness\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">많은 사람들이 돈이 행복의 열쇠라고 믿는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 돈이 행복을 준다는 일반적인 \u003cb class=\"key\">통념\u003c/b>을 꺼내 놓은 문장이에요. 글 전체의 \u003cb class=\"key\">주제\u003c/b>를 여는 도입부 역할을 하죠. 뒤에서 이 믿음이 정면으로 뒤집히기 때문에, 여기서는 독자가 고개를 끄덕일 만한 생각을 일부러 먼저 깔아 두는 겁니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that (명사절·목적어)\u003c/span> : believe [타동사] + [that + 주어 + 동사 (완전한 절)] : \"돈이 행복의 열쇠라는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 to (소유·관계의 to)\u003c/span> : [the key] + [to + 명사] : \"행복의 열쇠\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"Many people, 많은 사람들이. believe that, 믿는다, 라고. money is the key, 돈이 열쇠라고. to happiness, 행복에 대한. 이 문장 전체를 해석하면, 많은 사람들이 돈이 행복의 열쇠라고 믿는다.","hl":"m"},{"n":14,"text":"이 문장은 돈이 행복의 열쇠라는 아주 흔한 통념을 꺼내 놓고 있어요. 글의 주제를 여는 도입부인데, 뒤에서 이 믿음이 정면으로 뒤집히니까 여기서는 독자가 고개를 끄덕일 만한 통념을 일부러 먼저 깔아 둔 거죠.","hl":"mn"},{"n":15,"text":"첫 번째 어법 포인트는 believe 뒤의 that이에요. that절 안에 주어 money와 동사 is가 다 있으니까 완전한 절이고, 그래서 이 that은 관계대명사가 아니라 명사절을 이끄는 접속사예요. 두 번째는 the key to happiness인데, key나 answer, solution 뒤에는 에 대한이라는 뜻으로 전치사 to를 쓴다는 점 꼭 기억해 두세요. for를 쓰면 틀리는 관용 표현이니까요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 경험은 보여준다\u003c/span>\u003cspan class=\"en\">But experience shows\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단순히 사실이 아니라고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">simply \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">true\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 경험은 이것이 진실이 아님을 보여준다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 통념을 \u003cb class=\"key\">반박\u003c/b>하는 문장이에요. But으로 방향을 틀고 \u003cb class=\"key\">경험\u003c/b>을 근거로 내세워, 돈이 행복의 열쇠라는 믿음이 사실이 아니라고 못 박습니다. 글의 흐름이 여기서 정반대로 바뀌죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that (명사절·목적어)\u003c/span> : show [타동사] + [that + 주어 + 동사 (완전한 절)] : \"이것이 단순히 사실이 아니라는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">강조 부사 simply + be동사 어순\u003c/span> : [simply] + [be동사] + [not + 형용사] : \"단순히 사실이 아닌\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"But experience shows, 그러나 경험은 보여준다. that this, 이것이. simply is not true, 단순히 사실이 아니라고. 이 문장 전체를 해석하면, 그러나 경험은 이것이 진실이 아님을 보여준다.","hl":"m"},{"n":17,"text":"앞에서 꺼낸 통념을 But으로 딱 끊어서 반박하는 문장이에요. 경험을 근거로 세우니까 돈이 행복의 열쇠라는 말이 힘을 잃죠. 글의 방향이 여기서 완전히 뒤집힌다고 보시면 돼요.","hl":"mn"},{"n":18,"text":"먼저 show 뒤의 that을 보세요. that절 안에 주어 this와 동사 is가 다 있으니까 완전한 절이고, 그래서 명사절을 이끄는 접속사 that이에요. 두 번째로 simply is not true인데, 원래는 is simply not true가 자연스러운 어순인데 여기서는 부사 simply를 be동사 앞에 끌어다 놓아서 결코 사실이 아니다라는 강조를 만들었어요. 이 어순 그대로 시험에 나올 수 있으니 눈여겨보세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">갑자기 매우 부자가 된 사람들은\u003c/span>\u003cspan class=\"en\">People \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">suddenly \u003c/span>\u003cspan class=\"tgt\">become \u003c/span>\u003cspan class=\"tgt\">very \u003c/span>\u003cspan class=\"tgt\">rich\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">복권 당첨자처럼\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">such \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">lottery \u003c/span>\u003cspan class=\"tgt\">winners\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">종종 직업을 그만두고\u003c/span>\u003cspan class=\"en\">often \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">quit \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">jobs \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 큰 집으로 이사한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">move \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">bigger \u003c/span>\u003cspan class=\"tgt\">house\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 좋은 동네에 있는\u003c/span>\u003cspan class=\"en\">in a nicer neighborhood.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">복권 당첨자처럼 갑자기 부자가 된 사람들은 종종 직업을 그만두고 더 좋은 동네의 더 큰 집으로 이사한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞의 반박을 구체적인 \u003cb class=\"key\">예시\u003c/b>로 뒷받침하는 문장이에요. 복권 당첨자라는 사례를 들어 갑자기 부자가 된 사람들의 \u003cb class=\"key\">전형적인 \u003c/b>\u003cb class=\"key\">행동\u003c/b>을 보여 줍니다. 직업을 그만두고 더 좋은 동네로 이사한다는 두 가지 선택으로, 부가 삶을 어떻게 바꾸는지 그림을 그려 주고 있죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 who\u003c/span> : [선행사 People] + [who + 동사 (주격 관계대명사절)] : \"갑자기 매우 부자가 되는 사람들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">such as (예시의 전치사구)\u003c/span> : [명사] + [, such as + 예시 명사] : \"복권 당첨자처럼\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동사원형의 병렬 (and)\u003c/span> : [quit + 목적어] + and + [move + to + 명사] : \"직업을 그만두고 더 큰 집으로 이사한다\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"People who suddenly become very rich, 갑자기 매우 부자가 된 사람들은. such as lottery winners, 복권 당첨자처럼. often quit their jobs, 종종 직업을 그만두고. and move to a bigger house, 더 큰 집으로 이사한다. in a nicer neighborhood, 더 좋은 동네에 있는. 이 문장 전체를 해석하면, 복권 당첨자처럼 갑자기 부자가 된 사람들은 종종 직업을 그만두고 더 좋은 동네의 더 큰 집으로 이사한다.","hl":"m"},{"n":20,"text":"앞에서 사실이 아니라고 반박만 하고 끝내면 설득력이 약하죠. 그래서 복권 당첨자라는 구체적인 예시를 가져와 갑자기 부자가 된 사람들의 전형적인 행동을 보여 줍니다. 직업을 그만두고 더 좋은 동네로 이사한다는 두 가지 선택을 통해 부가 삶을 어떻게 바꾸는지 그림을 그려 주는 거예요.","hl":"mn"},{"n":21,"text":"먼저 People 뒤의 who를 보세요. 선행사 People을 뒤에서 꾸며 주는 주격 관계대명사이고, who 뒤에는 주어가 빠진 불완전한 절이 와요. 두 번째는 such as lottery winners인데, 앞의 사람들을 복권 당첨자라는 예시로 풀어 주면서 동격처럼 설명해 주는 표현이에요. 세 번째는 quit their jobs and move to a bigger house로, often이라는 부사 하나가 두 동사를 같이 꾸미면서 동사원형 quit과 move가 and로 병렬을 이루는 구조예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이렇게 한 후에,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">After \u003c/span>\u003cspan class=\"tgt\">doing \u003c/span>\u003cspan class=\"tgt\">so\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나,\u003c/span>\u003cspan class=\"en\">however,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 대체로 모른다\u003c/span>\u003cspan class=\"en\">they usually don't know\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 모든 여가 시간을 가지고 뭘 할지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">do\u003c/span> with all of their free time.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 이렇게 한 후에 그들은 대체로 그 모든 여가 시간을 가지고 뭘 할지 모르곤 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 부자가 된 사람들이 직장을 그만두고 좋은 동네 큰 집으로 이사한다고 했죠. 이 문장은 그다음에 벌어지는 \u003cb class=\"key\">빈 \u003c/b>\u003cb class=\"key\">시간\u003c/b> 문제를 지적해요. 돈은 생겼지만 시간을 쓸 \u003cb class=\"key\">목적\u003c/b>이 사라져서 오히려 막막해진다는 흐름이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 + 동명사(시간 부사구)\u003c/span> : After [전치사] + doing (동명사) : \"이렇게 한 후에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">의문사 + to부정사\u003c/span> : what + to do (의문사 + to부정사 = 무엇을 해야 할지) : \"무엇을 해야 할지, 뭘 할지\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"After doing so, 이렇게 한 후에. however, 그러나. they usually don't know, 그들은 대체로 모른다. what to do with all of their free time, 그 모든 여가 시간을 가지고 뭘 할지. 이 문장 전체를 해석하면, 그러나 이렇게 한 후에 그들은 대체로 그 모든 여가 시간을 가지고 뭘 할지 모르곤 한다.","hl":"m"},{"n":23,"text":"돈이 생기면 시간도 생기는데, 문제는 그 시간을 쓸 목적이 사라진다는 거예요. 이 문장은 부자가 된 사람들이 겪는 공허함을 콕 집어 주는 역할을 해요. 앞에서 이사 이야기를 했으니, 이제는 그 결과로 생긴 빈 시간 이야기로 넘어가는 거죠.","hl":"mn"},{"n":24,"text":"첫 번째로 After doing so를 보면, after가 전치사라서 뒤에 동명사 doing이 온 거예요. 앞에서 한 행동을 동명사로 받아서 시간 의미를 만든다고 기억해 주세요. 두 번째로 what to do는 무엇을 해야 할지라는 뜻으로, what they should do를 줄인 의문사와 to부정사 결합이에요. 이 덩어리가 know의 목적어 자리에 통째로 들어가 있답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 나쁜 것은,\u003c/span>\u003cspan class=\"en\">Even worse,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 ~을 알게 될지도 모른다\u003c/span>\u003cspan class=\"en\">they \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">may \u003c/span>\u003cspan class=\"tgt\">find \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 친한 친구들이 점점 멀어진다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> their best friends \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">grow \u003c/span>\u003cspan class=\"tgt\">distant\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 더 이상 찾아오지 않는다는 것을\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">stop \u003c/span>\u003cspan class=\"tgt\">coming \u003c/span>\u003cspan class=\"tgt\">over\u003c/span> to visit.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">더 나쁜 것은, 그들의 친한 친구들이 점점 멀어지고 더 이상 찾아오지 않을 수 있다는 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 여기서는 이사 뒤에 찾아오는 두 번째 부작용, 즉 \u003cb class=\"key\">인간관계\u003c/b>의 손실을 말해요. 'Even worse'는 앞의 문제보다 더 심각한 문제를 덧붙이는 \u003cb class=\"key\">첨가\u003c/b> 표현이에요. 형용사 병렬 구조로 친구가 멀어지는 것과 찾아오지 않는 것을 한 묶음으로 묶었습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 목적어절\u003c/span> : find [타동사] + that + 주어 + 동사 (목적어절) : \"~라는 것을 알게 될지도 모른다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">2형식 동사(grow) + 주격보어\u003c/span> : grow [2형식 동사] + [형용사 (주격보어)] : \"점점 멀어지다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">stop + 동명사(중지)\u003c/span> : stop + [동명사 (하던 행동을 멈추다)] : \"찾아오는 것을 멈추다, 더 이상 찾아오지 않다\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"Even worse, 더 나쁜 것은. they may find, 그들은 ~을 알게 될지도 모른다. that their best friends grow distant, 그들의 친한 친구들이 점점 멀어진다는 것을. and stop coming over to visit, 그리고 더 이상 찾아오지 않는다는 것을. 이 문장 전체를 해석하면, 더 나쁜 것은, 그들의 친한 친구들이 점점 멀어지고 더 이상 찾아오지 않을 수 있다는 것이다.","hl":"m"},{"n":26,"text":"이사해서 좋은 집에 살아도 친구가 안 오면 외롭겠죠. 이 문장은 앞의 빈 시간 문제보다 더 심각한 인간관계의 손실을 덧붙이고 있어요. Even worse라는 말로 문제의 심각성이 한 단계 올라간다고 봐 주세요.","hl":"mn"},{"n":27,"text":"첫 번째로 may find that을 보면, that 뒤에 주어와 동사가 다 있는 완전한 절이 와요. 그래서 that은 목적어절을 이끄는 접속사이고, find의 목적어가 절 통째로 들어간 구조예요. 두 번째로 grow distant에서 grow는 자라다가 아니라 상태 변화를 나타내는 동사라서 뒤에 형용사가 와서 주어를 설명해요. 세 번째로 stop coming over는 stop 뒤에 동명사가 와서 하던 행동을 멈춘다는 뜻이 되고, 앞의 grow distant와 and로 병렬 연결되어 있다는 점도 꼭 챙겨 주세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 매우 어려울 수 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It \u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">very \u003c/span>\u003cspan class=\"tgt\">difficult \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새로운 동네에서 갑자기 친구를 사귀는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">suddenly \u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">friends\u003c/span> in a new neighborhood,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서 그들은 종종 더 외로움을 느낀다\u003c/span>\u003cspan class=\"en\">so they often feel \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">lonelier \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">부자가 되기 전의 그 어느 때보다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">ever \u003c/span>\u003cspan class=\"tgt\">did\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">before \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">got \u003c/span>\u003cspan class=\"tgt\">rich\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">새로운 동네에서 갑자기 친구를 사귄다는 것은 매우 어려울 수 있다. 그래서 그들은 종종 더 부자가 되기 전의 그 어느 때보다 더 외로움을 느낀다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞에서 말한 두 문제를 하나로 묶어 결론을 내려요. 새 동네에서 친구 사귀기가 어렵다는 \u003cb class=\"key\">이유\u003c/b>가 제시되고, 그래서 부자가 되기 전보다 더 외롭다는 \u003cb class=\"key\">결과\u003c/b>가 따라옵니다. 결국 돈이 행복의 열쇠라는 믿음을 뒤집는 핵심 근거가 되는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가주어 it / 진주어 to부정사\u003c/span> : It [가주어] + be + 형용사 + to부정사 [진주어] : \"갑자기 친구를 사귀는 것은 매우 어려울 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">비교급 + 대동사 did\u003c/span> : 비교급 + than + 주어 + did (= 앞의 동사 반복을 피한 대동사) : \"그들이 그랬던 어느 때보다 더 외롭게\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">시간 부사절 접속사 before\u003c/span> : before + 주어 + 동사 (시간 부사절) : \"그들이 부자가 되기 전에\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"It can be very difficult, 그것은 매우 어려울 수 있다. to suddenly make friends in a new neighborhood, 새로운 동네에서 갑자기 친구를 사귀는 것은. so they often feel lonelier, 그래서 그들은 종종 더 외로움을 느낀다. than they ever did before they got rich, 부자가 되기 전의 그 어느 때보다. 이 문장 전체를 해석하면, 새로운 동네에서 갑자기 친구를 사귄다는 것은 매우 어려울 수 있다. 그래서 그들은 종종 더 부자가 되기 전의 그 어느 때보다 더 외로움을 느낀다.","hl":"m"},{"n":29,"text":"이 문장은 앞에서 늘어놓은 문제들을 하나로 묶어 결론을 내는 역할을 해요. 새 동네에서 친구를 사귀기가 어렵다는 이유가 먼저 나오고, 그래서 예전보다 더 외롭다는 결과가 뒤따르죠. 결국 부자가 된다고 행복해지는 게 아니라는 글 전체의 주장을 뒷받침하는 핵심 문장이에요.","hl":"mn"},{"n":30,"text":"첫 번째로 문장 앞의 it을 주목해 주세요. 해석하지 않는 가주어이고, 진짜 주어는 뒤에 있는 to suddenly make friends, 즉 진주어예요. 주어가 너무 길어서 it으로 자리를 잡아 둔 구조라고 이해하면 돼요. 두 번째로 lonelier than they ever did에서 did는 앞의 feel을 대신하는 대동사예요. 같은 동사를 또 쓰지 않으려고 did로 받아 준 거고, ever가 붙어서 그 어느 때보다라는 비교 강조를 만듭니다. 세 번째로 before they got rich는 부자가 되기 전에라는 시간 부사절이에요. 이 시간 표현 덕분에 예전과 지금의 외로움이 비교되는 거랍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">멋진 행운으로 보였던 일이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">What \u003c/span>\u003cspan class=\"tgt\">seemed \u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">wonderful \u003c/span>\u003cspan class=\"tgt\">luck\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정반대가 되어 버린다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">turns \u003c/span>\u003cspan class=\"tgt\">out \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">opposite\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">멋진 행운으로 보였던 일이 정반대가 되어 버린다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞의 복권 당첨자 사례를 한 줄로 정리하며, \u003cb class=\"key\">겉으로 \u003c/b>\u003cb class=\"key\">보이는 \u003c/b>\u003cb class=\"key\">행운\u003c/b>이 실제로는 \u003cb class=\"key\">정반대의 \u003c/b>\u003cb class=\"key\">결과\u003c/b>를 낳을 수 있음을 강조해요. 'What seemed like wonderful luck'은 '멋진 행운처럼 보였던 것'이라는 명사절 주어이고, 'turns out the opposite'는 '결국 정반대임이 드러난다'는 뜻이에요. 즉 돈이나 행운 자체보다 그로 인해 생기는 \u003cb class=\"key\">실제 \u003c/b>\u003cb class=\"key\">삶의 \u003c/b>\u003cb class=\"key\">변화\u003c/b>가 행복을 좌우한다는 흐름을 마무리하는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계대명사 what(선행사 포함 명사절)\u003c/span> : [[What]] + [불완전한 절] = '~한 것' : \"멋진 행운처럼 보였던 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">turn out + 명사 보어\u003c/span> : [[turn out]] + [명사 보어] = '결국 ~임이 드러나다' : \"정반대임이 드러나다\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"What seemed like wonderful luck, 멋진 행운으로 보였던 일이. turns out the opposite, 정반대가 되어 버린다. 이 문장 전체를 해석하면, 멋진 행운으로 보였던 일이 정반대가 되어 버린다.","hl":"m"},{"n":32,"text":"이 문장은 앞에서 본 복권 당첨자 이야기를 한 줄로 정리하는 결론이에요. 겉으로 보이는 행운이 실제로는 정반대의 결과를 낳을 수 있다는 뜻이죠. 그래서 돈이나 행운 자체보다 그 뒤에 생기는 실제 삶의 변화가 행복을 좌우한다는 흐름으로 글을 마무리해요.","hl":"mn"},{"n":33,"text":"첫 번째로 What은 선행사를 포함해 명사절을 만들고, 이 명사절 전체가 주어 역할을 해요. 그래서 What seemed like wonderful luck은 멋진 행운처럼 보였던 것이라는 주어가 되죠. 두 번째로 turn out은 결국 무엇임이 드러나다는 뜻으로 뒤에 명사 보어 the opposite를 취해요. 이 표현이 겉으로 보인 모습과 실제 결과가 다르다는 반전을 보여 줍니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>많은 사람들은 \u003cb class=\"key\">돈\u003c/b>이 행복의 열쇠라고 믿는다.\u003c/li>\u003cli>그러나 경험은 이것이 \u003cb class=\"key\">사실이 \u003c/b>\u003cb class=\"key\">아님\u003c/b>을 보여 주며, 복권 당첨자처럼 갑자기 부자가 된 사람들은 직업을 그만두고 더 좋은 동네의 더 큰 집으로 이사한다.\u003c/li>\u003cli>이들은 여가 시간을 어떻게 보낼지 몰라 하고, 친한 친구들이 멀어지며 새 동네에서 친구를 사귀기 어려워 \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">외로움\u003c/b>을 느낀다.\u003c/li>\u003cli>결국 멋진 행운으로 보였던 일이 \u003cb class=\"key\">정반대\u003c/b>가 되어 버린다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Sudden wealth does not guarantee happiness; it can even leave people lonelier than they ever were before.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">많은 사람들이 \u003cb class=\"key\">돈\u003c/b>이 행복의 열쇠라고 믿지만, 복권 당첨자처럼 갑자기 부자가 된 사람들은 여가 시간을 어떻게 보낼지 몰라 하고 친구들과 멀어져 오히려 \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">외로움\u003c/b>을 느낀다. 멋진 행운으로 보였던 일이 결국 \u003cb class=\"key\">정반대\u003c/b>가 되어 버린다는 내용이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":34,"text":"오늘 글은 돈이 행복의 열쇠라는 통념을 경험으로 반박한 짧지만 단단한 지문이었어요. 통념, 반박, 예시, 심화, 결론의 다섯 단계를 머릿속에 그려 두면 비슷한 글도 쉽게 읽힐 거예요. 특히 But, however, Even worse 같은 신호어를 표시하면서 읽는 습관을 들이면 좋습니다. 수고했어요, 다음 시간에 또 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
