<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SO 레벨1 11강 적용독해03 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-sno{font-size:13px;color:#8493A1;font-weight:700;margin-bottom:8px}

.lp-chunk .ko{font-size:13px;color:var(--pk-t);font-weight:700;line-height:1.3;margin-bottom:2px}
.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}
.lp-top::before{height:5px;background:linear-gradient(90deg,var(--pk) 0,var(--pk) 80%,var(--am) 80%,var(--am) 100%)}
.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}
.lp-tag{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700;padding:2px 12px}
.lp-qn{flex:0 0 112px;height:112px;align-self:center;background:#fff;color:var(--pk);border:3px solid var(--pk);border-radius:50%;font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;font-size:26px}
.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}

.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}

.lp-st h4 i{border-radius:4px;width:auto;min-width:24px;padding:0 4px}

.lp-chips .s{border:1px solid #AEBBE6;color:#3A4FA3}

.lp-sno .es{background:var(--am);border-radius:2px;font-weight:700}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"SO 레벨1 11강 적용독해03","audioDir":"11-03_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">11강\u003cbr>적용독해03\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">SO 레벨1\u003c/div>\u003ch1>Pompeii: A Prosperous City Buried by Vesuvius\u003c/h1>\u003ch2>폼페이: 베수비우스에 묻힌 번창한 도시\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>번창한 로마 도시 \u003cb class=\"key\">폼페이\u003c/b>는 부유한 로마인들이 시골 별장을 짓던 곳이었지만, \u003cb class=\"key\">베수비우스 \u003c/b>\u003cb class=\"key\">화산\u003c/b> 기슭이라는 결함을 안고 있었다. 서기 79년 화산 폭발로 \u003cb class=\"key\">화산재\u003c/b>와 유독 가스가 도시를 덮으면서 많은 사람이 죽고 폼페이는 \u003cb class=\"key\">완전히 \u003c/b>\u003cb class=\"key\">사라졌다\u003c/b>.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Even a prosperous city like Pompeii could not escape destruction when Mount Vesuvius erupted and buried it in fire and ash.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 오늘은 폼페이의 몰락을 다룬 지문을 함께 읽어 볼 거예요. 이 글은 로마제국의 번창한 도시 폼페이가 베수비우스 화산의 폭발로 어떻게 사라졌는지를 보여 줍니다. 핵심은 아무리 번창한 도시도 화산이라는 자연의 위험 앞에서는 속수무책이었다는 점이에요. 그럼 지문의 흐름을 차근차근 따라가 볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">폼페이는 이탈리아 남부 나폴리 근처에 있던 고대 도시로, \u003cb class=\"key\">로마제국\u003c/b>(Roman Empire)의 번영을 보여 주는 대표적인 장소였다. 부유한 로마인들은 이곳에 시골 별장을 짓고 휴식을 즐겼지만, 도시 바로 옆에는 베수비우스 화산(Mount Vesuvius)이 있었다. 화산은 오랫동안 조용했지만 서기 79년에 격렬하게 폭발했고, \u003cb class=\"key\">화산재\u003c/b>(volcanic ash)와 \u003cb class=\"key\">유독 \u003c/b>\u003cb class=\"key\">가스\u003c/b>(toxic fumes)가 도시를 순식간에 덮었다. 이 사건은 화산 활동이 도시 문명을 얼마나 빠르게 파괴할 수 있는지 보여 준다. 오늘날에도 화산 주변에 사는 것은 \u003cb class=\"key\">잠자는 \u003c/b>\u003cb class=\"key\">거인\u003c/b> 옆에 집을 짓는 일과 비슷하다고 말할 수 있다.\u003c/div>","segs":[{"n":2,"text":"폼페이는 이탈리아 남부 나폴리 근처에 있던 고대 도시로, 로마제국의 번영을 보여 주는 대표적인 장소였어요. 당시 부유한 로마인들은 이곳에 시골 별장을 짓고 휴식을 즐겼죠. 하지만 도시 바로 옆에는 Mount Vesuvius라는 화산이 있었어요. 화산은 오랫동안 조용했지만 서기 칠십구 년에 격렬하게 폭발했습니다. 이때 쏟아진 화산재와 유독 가스가 도시를 순식간에 덮었고, 많은 사람이 목숨을 잃었어요. 마치 잠자는 거인 옆에 집을 지은 셈이었죠.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>번창한 폼페이\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>폼페이는 수백 년 동안 로마제국의 \u003cb class=\"key\">중요한 \u003c/b>\u003cb class=\"key\">도시\u003c/b>였다. 이탈리아 남부 해안에 위치해 부유한 로마인들이 시골 별장을 짓고 싶어 하는 \u003cb class=\"key\">가장 \u003c/b>\u003cb class=\"key\">좋아하는 \u003c/b>\u003cb class=\"key\">곳\u003c/b>이었다. 가게와 집, 신전이 늘어선 도시는 \u003cb class=\"key\">분주하고 \u003c/b>\u003cb class=\"key\">번창했다\u003c/b>.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>치명적 결함\u003csmall>전환 · 문장 4\u003c/small>\u003c/h4>\u003cp>그러나 이 \u003cb class=\"key\">꿈의 \u003c/b>\u003cb class=\"key\">도시\u003c/b>에는 한 가지 결함이 있었다. 바로 도시가 \u003cb class=\"key\">베수비우스 \u003c/b>\u003cb class=\"key\">화산\u003c/b> 기슭에 자리했다는 점이다. 번영 뒤에 숨은 \u003cb class=\"key\">자연적 \u003c/b>\u003cb class=\"key\">위험\u003c/b>이 드러나는 대목이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>폭발과 매몰\u003csmall>사건 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>서기 79년, 더 이상 조용하지 않은 베수비우스산이 \u003cb class=\"key\">격렬하게 \u003c/b>\u003cb class=\"key\">폭발했다\u003c/b>. 불과 \u003cb class=\"key\">화산재\u003c/b>가 하늘을 가득 채웠다. 그 결과 아름다운 도시는 \u003cb class=\"key\">묻혀 \u003c/b>\u003cb class=\"key\">버렸다\u003c/b>.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>사망과 소멸\u003csmall>결론 · 문장 7–8\u003c/small>\u003c/h4>\u003cp>대부분의 사람들은 낙석과 건물 붕괴, 또는 화산의 \u003cb class=\"key\">유독 \u003c/b>\u003cb class=\"key\">가스\u003c/b>로 죽었다. 도시는 순식간에 완전히 \u003cb class=\"key\">파묻혔다\u003c/b>. 결국 거대한 폼페이는 \u003cb class=\"key\">완전히 \u003c/b>\u003cb class=\"key\">사라졌다\u003c/b>.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"글은 번창한 도시 소개에서 시작해 숨은 결함, 화산 폭발, 그리고 도시의 소멸로 이어집니다.","hl":null},{"n":4,"text":"먼저 폼페이가 얼마나 번창했는지 보여 줘요. 수백 년 동안 폼페이는 로마제국의 중요한 도시였어요. 이탈리아 남부 해안에 위치한 이 도시는 시골 별장을 짓고 싶어 하는 부유한 로마인들이 가장 좋아하는 곳이었죠. 가게와 집, 신전이 늘어선 도시는 분주하고 번창했다고 해요.","hl":"f0"},{"n":5,"text":"그런데 이 꿈의 도시에는 한 가지 결함이 있었어요. 바로 도시가 베수비우스 화산 기슭에 자리했다는 점입니다. 번영 뒤에 숨은 자연적 위험이 드러나는 대목이죠.","hl":"f1"},{"n":6,"text":"그리고 서기 칠십구 년, 더 이상 조용하지 않은 베수비우스산이 격렬하게 폭발했다고 전해요. 불과 화산재가 하늘을 가득 채웠고, 그 결과 아름다운 도시는 묻혀 버렸다고 설명합니다.","hl":"f2"},{"n":7,"text":"대부분의 사람들은 낙석과 건물 붕괴, 또는 화산의 유독 가스로 죽었습니다. 도시는 순식간에 완전히 파묻혔다고 해요. 결국 거대한 폼페이는 완전히 사라졌다고 말할 수 있죠.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 8번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 사건이 일어난 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">순서\u003c/b>대로 도시의 번영, 결함, 폭발, 소멸을 배열한다. 핵심 내용이 마지막 문장에 제시되므로 \u003cb class=\"key\">미괄식\u003c/b> 구조로 볼 수 있다. 번영이라는 배경과 화산이라는 결함이 폭발과 소멸이라는 결과로 이어지므로 \u003cb class=\"key\">인과 \u003c/b>\u003cb class=\"key\">관계\u003c/b>도 분명하다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>But (4)\u003c/b>\u003cspan>전환\u003c/span>\u003cb>In 79 A.D. (5)\u003c/b>\u003cspan>시간\u003c/span>\u003cb>either ... or (7)\u003c/b>\u003cspan>원인 선택\u003c/span>\u003cb>Covered quickly and completely (8)\u003c/b>\u003cspan>결과 정리\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">important city\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">favorite spot\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">busy and prosperous\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">dream city\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">great city\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>번창한 폼페이\u003c/th>\u003cth>화산의 위협\u003c/th>\u003c/tr>\u003ctr>\u003ctd>가게·집·신전으로 번성\u003c/td>\u003ctd>기슭에 자리한 베수비우스\u003c/td>\u003c/tr>\u003ctr>\u003ctd>부유한 로마인의 별장지\u003c/td>\u003ctd>화산재와 유독 가스\u003c/td>\u003c/tr>\u003ctr>\u003ctd>꿈의 도시\u003c/td>\u003ctd>한 가지 결함\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 사건이 일어난 시간 순서에 따라 도시의 번영, 결함, 폭발, 소멸을 배열해요. 처음에는 도시의 번영을 보여 주고, 중간에 결함을 제시한 뒤, 화산 폭발과 도시의 소멸로 나아가죠. 결정적인 내용이 마지막에 나오므로 미괄식이라고 볼 수 있어요. 번영이라는 배경과 화산이라는 결함이 폭발과 소멸로 이어지는 인과 관계도 함께 가지고 있습니다.","hl":"ty"},{"n":9,"text":"네 번째 문장의 But은 앞의 번영과 뒤의 결함을 갈라 주는 전환 신호예요. 다섯 번째 문장의 In seventy-nine A.D.는 사건의 시간을 알려 주고, 일곱 번째 문장의 either와 or는 사망 원인을 나열하죠. 마지막 문장의 Covered quickly and completely는 도시가 완전히 사라진 결과를 정리해 줍니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>For hundreds of years\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>수백 년 동안\u003c/span>\u003c/div>\u003cdiv>\u003cb>important\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>중요한\u003c/span>\u003c/div>\u003cdiv>\u003cb>empire\u003c/b>\u003cem>명사\u003c/em>\u003cspan>제국\u003c/span>\u003c/div>\u003cdiv>\u003cb>be located on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 위치하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>coast\u003c/b>\u003cem>명사\u003c/em>\u003cspan>해안\u003c/span>\u003c/div>\u003cdiv>\u003cb>favorite\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>가장 좋아하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>wealthy\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>부유한\u003c/span>\u003c/div>\u003cdiv>\u003cb>build\u003c/b>\u003cem>동사\u003c/em>\u003cspan>짓다\u003c/span>\u003c/div>\u003cdiv>\u003cb>country villa\u003c/b>\u003cem>명사\u003c/em>\u003cspan>시골 별장\u003c/span>\u003c/div>\u003cdiv>\u003cb>be lined with\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~이 늘어서 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>shop\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가게\u003c/span>\u003c/div>\u003cdiv>\u003cb>temple\u003c/b>\u003cem>명사\u003c/em>\u003cspan>신전\u003c/span>\u003c/div>\u003cdiv>\u003cb>busy\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>분주한\u003c/span>\u003c/div>\u003cdiv>\u003cb>prosperous\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>번창한\u003c/span>\u003c/div>\u003cdiv>\u003cb>flaw\u003c/b>\u003cem>명사\u003c/em>\u003cspan>결함\u003c/span>\u003c/div>\u003cdiv>\u003cb>merit\u003c/b>\u003cem>명사\u003c/em>\u003cspan>장점\u003c/span>\u003c/div>\u003cdiv>\u003cb>at the foot of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~기슭에\u003c/span>\u003c/div>\u003cdiv>\u003cb>volcano\u003c/b>\u003cem>명사\u003c/em>\u003cspan>화산\u003c/span>\u003c/div>\u003cdiv>\u003cb>silent\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>조용한\u003c/span>\u003c/div>\u003cdiv>\u003cb>no longer\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>더 이상 ~아닌\u003c/span>\u003c/div>\u003cdiv>\u003cb>erupt\u003c/b>\u003cem>동사\u003c/em>\u003cspan>폭발하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>violently\u003c/b>\u003cem>부사\u003c/em>\u003cspan>격렬하게\u003c/span>\u003c/div>\u003cdiv>\u003cb>ash\u003c/b>\u003cem>명사\u003c/em>\u003cspan>화산재\u003c/span>\u003c/div>\u003cdiv>\u003cb>bury\u003c/b>\u003cem>동사\u003c/em>\u003cspan>묻다\u003c/span>\u003c/div>\u003cdiv>\u003cb>falling rock\u003c/b>\u003cem>명사\u003c/em>\u003cspan>낙석\u003c/span>\u003c/div>\u003cdiv>\u003cb>collapse\u003c/b>\u003cem>동사\u003c/em>\u003cspan>붕괴하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>poisonous\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>유독한\u003c/span>\u003c/div>\u003cdiv>\u003cb>fumes\u003c/b>\u003cem>명사\u003c/em>\u003cspan>유독 가스\u003c/span>\u003c/div>\u003cdiv>\u003cb>completely\u003c/b>\u003cem>부사\u003c/em>\u003cspan>완전히\u003c/span>\u003c/div>\u003cdiv>\u003cb>disappear\u003c/b>\u003cem>동사\u003c/em>\u003cspan>사라지다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"중요한 단어로는 prosperous, flaw, erupt, bury, poisonous를 꼭 기억해 두세요. prosperous는 번창한, flaw는 결함, erupt는 폭발하다, bury는 묻다, poisonous는 유독한이라는 뜻이에요. 특히 dream city had one flaw처럼 번영 003cb class=\"w\">erupt\u003c/b>\u003cspan class=\"m\">폭발하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">explode\u003c/span>\u003cspan class=\"s\">burst\u003c/span>\u003cspan class=\"s\">blow up\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">be dormant\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">violently\u003c/b>\u003cspan class=\"m\">격렬하게\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">fiercely\u003c/span>\u003cspan class=\"s\">forcefully\u003c/span>\u003cspan class=\"s\">intensely\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">gently\u003c/span>\u003cspan class=\"a\">peacefully\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">disappear\u003c/b>\u003cspan class=\"m\">사라지다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">vanish\u003c/span>\u003cspan class=\"s\">fade away\u003c/span>\u003cspan class=\"s\">go away\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">appear\u003c/span>\u003cspan class=\"a\">emerge\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"시험에 자주 나오는 어휘도 정리해 볼게요. important의 동의어는 significant, crucial, essential이고 반의어는 trivial이나 unimportant입니다. prosperous는 thriving, flourishing과 가깝고, 반대말은 poor나 declining이에요. flaw는 defect, weakness, fault와 바꿔 쓸 수 있고 반대말은 merit나 strength죠. disappear는 vanish, fade away로 바꿀 수 있고 반의어는 appear, emerge입니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수백 년 동안\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">For \u003c/span>\u003cspan class=\"tgt\">hundreds \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">years\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">폼페이는 중요한 도시였다\u003c/span>\u003cspan class=\"en\">Pompeii \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">important \u003c/span>\u003cspan class=\"tgt\">city\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">로마 제국에서\u003c/span>\u003cspan class=\"en\">in the Roman Empire.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">수백 년 동안 폼페이는 로마제국의 중요한 도시였다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 폼페이가 얼마나 오래, 어떤 위상을 지닌 도시였는지 소개하는 문장이에요. \u003cb class=\"key\">로마 \u003c/b>\u003cb class=\"key\">제국\u003c/b> 안에서 \u003cb class=\"key\">수백 \u003c/b>\u003cb class=\"key\">년\u003c/b> 동안 중요한 도시였다는 배경을 먼저 깔아 주는 거죠. 뒤에 이어질 몰락 이야기와 대비되도록 도시의 화려한 과거를 강조하는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 for + 기간 표현\u003c/span> : for + [hundreds of] + [복수명사 years] (기간의 길이) : \"수백 년 동안\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">2형식 문장(주격 보어)\u003c/span> : [주어 Pompeii] + [동사 was] + [보어 an important city] : \"중요한 도시였다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"For hundreds of years, 수백 년 동안. Pompeii was an important city, 폼페이는 중요한 도시였다. in the Roman Empire, 로마 제국에서. 이 문장 전체를 해석하면, 수백 년 동안 폼페이는 로마제국의 중요한 도시였다.","hl":"m"},{"n":13,"text":"이 문장은 폼페이가 얼마나 오래, 어떤 위상을 가진 도시였는지 소개하고 있어요. 로마 제국 안에서 수백 년 동안 중요한 도시였다는 배경을 먼저 깔아 주는 거죠. 뒤에 나올 몰락 이야기와 대비되도록 도시의 화려한 과거를 강조하는 역할을 해요.","hl":"mn"},{"n":14,"text":"첫 번째로, For hundreds of years에서 전치사 for는 얼마 동안이라는 기간의 폭을 나타내요. 그래서 수백 년 동안이라는 시간 전체를 표현하죠. 두 번째로, Pompeii was an important city는 be동사가 주어의 상태를 설명하는 불완전자동사라서 뒤에 주격 보어가 꼭 필요해요. 여기서는 an important city가 폼페이가 어떤 도시인지 알려 주는 주격 보어예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이탈리아 남부 해안에 위치한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Located \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">coast \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">southern \u003c/span>\u003cspan class=\"tgt\">Italy\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">폼페이는 가장 좋아하는 곳이었다\u003c/span>\u003cspan class=\"en\">Pompeii was a favorite spot\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">부유한 로마인들이\u003c/span>\u003cspan class=\"en\">for wealthy Romans\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시골 별장을 짓고 싶어 하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">wanting \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">build \u003c/span>\u003cspan class=\"tgt\">country \u003c/span>\u003cspan class=\"tgt\">villas\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이탈리아 남부 해안에 위치한 폼페이는 시골 별장을 짓고 싶어 하는 부유한 로마인들이 가장 좋아하는 곳이었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 폼페이가 부유한 로마인들에게 얼마나 인기 있는 곳이었는지 보여 주는 문장이에요. \u003cb class=\"key\">남부 \u003c/b>\u003cb class=\"key\">해안\u003c/b>이라는 지리적 이점 덕분에 \u003cb class=\"key\">별장\u003c/b>을 짓고 싶어 하는 사람들이 몰렸다는 거죠. 앞 문장의 '중요한 도시'라는 말을 구체적인 장면으로 풀어 주는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사구의 부대상황(분사구문)\u003c/span> : [Being] + [과거분사 located] + [전치사구] → Located on the coast ~ : \"이탈리아 남부 해안에 위치한\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재분사구의 형용사적 용법(후치 수식)\u003c/span> : [명사 wealthy Romans] + [현재분사 wanting] + [목적어 to build country villas] : \"시골 별장을 짓고 싶어 하는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(want의 목적어)\u003c/span> : want + [to + 동사원형] (to부정사를 목적어로 취하는 동사) : \"시골 별장을 짓는 것\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Located on the coast of southern Italy, 이탈리아 남부 해안에 위치한. Pompeii was a favorite spot, 폼페이는 가장 좋아하는 곳이었다. for wealthy Romans, 부유한 로마인들이. wanting to build country villas, 시골 별장을 짓고 싶어 하는. 이 문장 전체를 해석하면, 이탈리아 남부 해안에 위치한 폼페이는 시골 별장을 짓고 싶어 하는 부유한 로마인들이 가장 좋아하는 곳이었다.","hl":"m"},{"n":16,"text":"이 문장은 폼페이가 부유한 로마인들에게 얼마나 인기 있는 곳이었는지 보여 줘요. 남부 해안이라는 지리적 이점 덕분에 별장을 짓고 싶어 하는 사람들이 몰렸다는 거죠. 앞 문장에서 중요한 도시라고 한 내용을 구체적인 장면으로 풀어 주는 역할을 해요.","hl":"mn"},{"n":17,"text":"첫 번째로, 문장 앞의 Located on the coast of southern Italy는 주어 Pompeii가 위치되어진 대상이라 수동의 의미여서 과거분사 located를 써요. Being이 생략된 분사구문으로 이탈리아 남부 해안에 위치한 이라고 해석하죠. 두 번째로, wanting to build country villas에서 wealthy Romans가 원하는 주체이므로 능동의 의미를 가진 현재분사 wanting이 명사 뒤에서 꾸며 줘요. 세 번째로, want는 뒤에 to부정사를 목적어로 데려오는 동사라서 want to build가 짓고 싶어 하다로 해석돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 도시는\u003c/span>\u003cspan class=\"en\">The city,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가게와 집, 신전들이 쭉 늘어선\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">lined \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">shops, \u003c/span>\u003cspan class=\"tgt\">houses \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">temples\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">분주하고 번창했다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">busy \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">prosperous\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">가게와 집, 신전들이 쭉 늘어선 그 도시는 분주하고 번창했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 폼페이가 얼마나 번화한 도시였는지 구체적으로 그려 주는 문장이에요. 가게와 집, 신전이 늘어선 모습으로 도시의 \u003cb class=\"key\">활기\u003c/b>를 보여 주는 거죠. 이렇게 화려한 도시가 곧 사라진다는 뒤 내용과 대비를 이루도록 준비하는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사구의 삽입(주어 부연 설명)\u003c/span> : [주어 The city], + [과거분사 lined with + 명사] + , [동사] : \"가게와 집, 신전들이 쭉 늘어선\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">형용사 병렬 구조\u003c/span> : [형용사 busy] + and + [형용사 prosperous] (보어 병렬) : \"분주하고 번창했다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"The city, 그 도시는. lined with shops, houses and temples, 가게와 집, 신전들이 쭉 늘어선. was busy and prosperous, 분주하고 번창했다.. 이 문장 전체를 해석하면, 가게와 집, 신전들이 쭉 늘어선 그 도시는 분주하고 번창했다.","hl":"m"},{"n":19,"text":"이 문장은 폼페이가 얼마나 번화한 도시였는지 구체적으로 그려 줘요. 가게와 집, 신전이 늘어선 모습을 통해 도시의 활기를 보여 주는 거죠. 이렇게 화려한 도시가 곧 사라진다는 뒤 내용과 대비를 이루도록 준비하는 문장이에요.","hl":"mn"},{"n":20,"text":"첫 번째로, lined with shops, houses and temples에서 be lined with는 무엇으로 늘어서 있다라는 수동 표현이라 과거분사 lined를 써요. 주어 The city를 콤마 사이에서 부연 설명하는 삽입구 역할을 하죠. 두 번째로, was busy and prosperous는 busy와 prosperous 두 형용사가 and로 나란히 연결된 병렬 구조예요. 그래서 분주하고 번창했다처럼 두 상태를 한꺼번에 설명해 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 이 꿈의 도시에는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">But\u003c/span> this dream city\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 가지 결함(장점의 반대)이 있었는데,\u003c/span>\u003cspan class=\"en\">had one flaw(← merit):\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 위치해 있었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">It \u003c/span>\u003cspan class=\"tgt\">sat\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">화산, 즉 베수비우스산의 기슭에\u003c/span>\u003cspan class=\"en\">at the foot of a volcano, \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">Mount \u003c/span>\u003cspan class=\"tgt\">Vesuvius\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 이 꿈의 도시에는 한 가지 결함이 있었는데, 바로 베수비우스 화산 기슭에 위치한 것이었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 폼페이의 번영을 길게 설명한 뒤 but으로 흐름을 \u003cb class=\"key\">반전\u003c/b>시켜, 이 도시의 치명적인 \u003cb class=\"key\">결함\u003c/b> 하나를 꺼내는 문장이에요. 그 결함은 도시가 화산 기슭에 \u003cb class=\"key\">위치\u003c/b>했다는 점이고, 콤마 뒤 Mount Vesuvius로 화산 이름까지 \u003cb class=\"key\">동격\u003c/b>으로 못 박아 줍니다. 뒤에 나올 폭발 사건을 예고하는 \u003cb class=\"key\">복선\u003c/b> 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">등위접속사 but(역접)\u003c/span> : [앞 문장] + but + [뒷 문장] → 앞 내용을 [[반전]]시키는 연결 : \"하지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">대명사 it의 지시(조응)\u003c/span> : [[It]] + [동사] → 앞에 나온 [명사(구)]를 대신 받음 : \"그것(도시)은 위치해 있었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동격(콤마 동격)\u003c/span> : [a volcano], [Mount Vesuvius] → 앞 명사를 [[부연 설명]] : \"즉 베수비우스산\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"But this dream city, 하지만 이 꿈의 도시에는. had one flaw(← merit), 한 가지 결함(장점의 반대)이 있었는데. It sat, 그것은 위치해 있었다. at the foot of a volcano, Mount Vesuvius, 화산, 즉 베수비우스산의 기슭에. 이 문장 전체를 해석하면, 하지만 이 꿈의 도시에는 한 가지 결함이 있었는데, 바로 베수비우스 화산 기슭에 위치한 것이었다.","hl":"m"},{"n":22,"text":"이 문장은 앞에서 폼페이가 얼마나 번화했는지 길게 설명하다가 but으로 흐름을 반전시키는 문장이에요. 번영 이야기 뒤에 결함 하나를 꺼내면서 긴장을 만들죠. 그리고 그 결함이 바로 도시가 화산 기슭에 위치했다는 점이라는 걸, 콤마 뒤에 Mount Vesuvius를 붙여 동격으로 확실하게 못 박아 줍니다. 이게 뒤에 나올 폭발 사건의 복선이라는 것도 꼭 기억해 두세요.","hl":"mn"},{"n":23,"text":"어법 포인트 첫 번째, 문장 맨 앞 but은 역접 접속사예요. 앞 내용을 뒤집으면서 결함을 강조하는 장치죠. 두 번째, It sat의 It은 바로 앞에 나온 this dream city, 즉 폼페이를 받는 대명사예요. 그래서 도시가 위치했다고 읽어야 자연스러워요. 세 번째, 콤마 뒤 Mount Vesuvius는 앞의 a volcano를 부연 설명하는 동격 표현입니다. 화산, 즉 베수비우스산이라고 해석하면 끝이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">서기 79년에,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">In \u003c/span>\u003cspan class=\"tgt\">79 \u003c/span>\u003cspan class=\"tgt\">A.D.\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">베수비우스산은,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">Vesuvius, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 이상 조용하지 않고,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">silent \u003c/span>\u003cspan class=\"tgt\">no \u003c/span>\u003cspan class=\"tgt\">longer,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">격렬하게 폭발했다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">erupted \u003c/span>\u003cspan class=\"tgt\">violently\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">79 년 베수비우스산은 더 이상 조용하지 않고 격렬하게 폭발했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> In 79 A.D.라는 시간 표현으로 사건의 \u003cb class=\"key\">시점\u003c/b>을 먼저 못 박아요. 이어서 silent no longer를 주어 뒤에 \u003cb class=\"key\">삽입\u003c/b>해, 화산이 더 이상 잠잠하지 않다는 상태 변화를 먼저 보여주죠. 그다음 erupted violently로 \u003cb class=\"key\">폭발\u003c/b>을 강하게 던지는데, 앞 문장의 결함이 현실이 되는 \u003cb class=\"key\">전환\u003c/b> 지점이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 용법(시간)\u003c/span> : [[In]] + [시간 명사] → 문장 전체를 수식하는 [[시간]] 부사구 : \"서기 79년에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">형용사구의 삽입(주어의 상태 부연)\u003c/span> : [주어], [형용사구], [동사] → 주어의 상태를 [[삽입]]해 설명 : \"베수비우스산은, 더 이상 조용하지 않은 상태로,\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">자동사 + 부사(정도)\u003c/span> : [자동사] + [부사] → 동작의 [[정도]]를 꾸밈 : \"격렬하게 폭발했다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"In 79 A.D, 서기 79년에. Vesuvius, 베수비우스산은. silent no longer, 더 이상 조용하지 않고. erupted violently, 격렬하게 폭발했다.. 이 문장 전체를 해석하면, 79 년 베수비우스산은 더 이상 조용하지 않고 격렬하게 폭발했다.","hl":"m"},{"n":25,"text":"In A.D. seventy nine이라는 시간 표현으로 사건의 시점을 먼저 못 박아요. 그리고 Vesuvius 뒤에 silent no longer를 끼워 넣어서, 화산이 더 이상 잠잠하지 않다는 상태 변화를 먼저 보여주죠. 그다음 erupted violently로 폭발을 강하게 던지는데, 이 문장이 앞에서 말한 결함이 현실이 되는 전환 지점이에요.","hl":"mn"},{"n":26,"text":"어법 포인트 첫 번째, In A.D. seventy nine은 전치사 In이 이끄는 시간 부사구로 문장 전체를 꾸며요. 두 번째, Vesuvius, silent no longer,에서 콤마 사이의 silent no longer는 주어의 상태를 부연하는 형용사구가 삽입된 형태예요. 그래서 주어 바로 뒤에서 상태를 먼저 말해 주고 동사로 넘어갑니다. 세 번째, erupt는 목적어가 필요 없는 자동사라서 뒤에 부사 violently가 와서 폭발의 정도를 알려줘요. 과거형이니까 폭발했다로 해석하면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">불과 화산재가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Fire \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">ash\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하늘을 가득 채우고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">filled \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">sky \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 묻어버렸다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">buried\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 아름다운 도시를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">beautiful \u003c/span>\u003cspan class=\"tgt\">city\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">불과 화산재가 하늘을 가득 채우면서 그 아름다운 도시를 묻어버렸다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 불과 화산재가 하는 두 가지 일, 하늘을 채우는 것과 도시를 묻는 것을 \u003cb class=\"key\">병렬\u003c/b>로 이어 붙여 재앙의 규모를 한 문장에 \u003cb class=\"key\">압축\u003c/b>했어요. the beautiful city라는 표현으로 아름다웠던 도시가 사라지는 \u003cb class=\"key\">대비\u003c/b>를 만들어 주죠. 이 문장은 다음 문장의 '도시가 사라졌다'로 이어지는 직접적인 \u003cb class=\"key\">원인\u003c/b>이 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">등위접속사 and로 연결된 주어(복수 취급)\u003c/span> : [A] and [B] + [복수 동사] → 두 개를 [[병렬]]로 묶은 주어 : \"불과 화산재가\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동사구의 병렬(등위접속사 and)\u003c/span> : [동사구 1] and [동사구 2] → 같은 주어의 두 동작을 [[병렬]] : \"하늘을 채우고 ~을 묻었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">정관사 the의 지시 기능\u003c/span> : [[the]] + [명사] → 앞서 언급된 특정 대상 : \"그 아름다운 도시\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Fire and ash, 불과 화산재가. filled the sky, 하늘을 가득 채우고. and buried, 그리고 묻어버렸다. the beautiful city, 그 아름다운 도시를. 이 문장 전체를 해석하면, 불과 화산재가 하늘을 가득 채우면서 그 아름다운 도시를 묻어버렸다.","hl":"m"},{"n":28,"text":"불과 화산재가 하는 두 가지 일, 하늘을 채우는 것과 도시를 묻는 것을 병렬로 이어 붙여서 재앙의 규모를 한 문장에 압축했어요. 그리고 the beautiful city라고 표현해서 아름다웠던 도시가 사라진다는 대비를 만들어 주죠. 이 문장은 바로 다음에 나오는 도시가 사라졌다는 내용의 원인이 됩니다.","hl":"mn"},{"n":29,"text":"어법 포인트 첫 번째, Fire and ash는 and로 연결된 병렬 주어라서 두 개가 묶여 복수로 취급되고, 동사도 filled, buried처럼 과거 복수형이 와요. 두 번째, filled the sky and buried는 같은 주어가 하는 두 동작을 and로 병렬한 구조예요. 세 번째, the beautiful city에서 the는 앞에서 이야기한 폼페이를 가리키는 정관사입니다. 그래서 그 아름다운 도시, 즉 폼페이로 해석하면 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대부분의 사람들이\u003c/span>\u003cspan class=\"en\">Most people\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사망했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">died\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">낙석이나 건물의 붕괴로 인해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">either \u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">falling \u003c/span>\u003cspan class=\"tgt\">rocks \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">collapsing \u003c/span>\u003cspan class=\"tgt\">buildings \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">혹은 화산의 유독 가스로 인해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">volcano's \u003c/span>\u003cspan class=\"tgt\">poisonous \u003c/span>\u003cspan class=\"tgt\">fumes\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">대부분의 사람들이 낙석이나 건물의 붕괴, 혹은 화산의 유독 가스로 인해 사망했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 화산 폭발로 사람들이 어떤 방식으로 목숨을 잃었는지 두 가지 \u003cb class=\"key\">원인\u003c/b>으로 정리한 문장입니다. 낙석과 건물 붕괴라는 물리적 사고, 그리고 유독 가스라는 화학적 원인을 either A or B로 나란히 제시해 피해가 얼마나 치명적이었는지 보여 줍니다. 앞 문장의 '도시가 묻혔다'에 이어 '사람들의 죽음'으로 내용을 \u003cb class=\"key\">구체화\u003c/b>하는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">die + 전치사 from (원인 표시)\u003c/span> : die + from + [원인] = '~로 인해 죽다' : \"사망했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">상관접속사 either A or B\u003c/span> : either + [전치사구 A] + or + [전치사구 B] = 'A나 B 둘 중 하나' : \"낙석이나 건물의 붕괴로 인해, 혹은 화산의 유독 가스로 인해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">현재분사의 형용사적 용법(능동)\u003c/span> : [현재분사(-ing)] + [명사] = '~하는 명사' : \"떨어지는 돌과 무너지는 건물, 즉 낙석과 건물의 붕괴\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Most people, 대부분의 사람들이. died, 사망했다. either from falling rocks and collapsing buildings, 낙석이나 건물의 붕괴로 인해. or from the volcano's poisonous fumes, 혹은 화산의 유독 가스로 인해. 이 문장 전체를 해석하면, 대부분의 사람들이 낙석이나 건물의 붕괴, 혹은 화산의 유독 가스로 인해 사망했다.","hl":"m"},{"n":31,"text":"이 문장은 폼페이 사람들이 어떻게 목숨을 잃었는지를 두 가지 원인으로 정리해 주고 있어요. 하나는 낙석과 건물 붕괴라는 물리적인 원인이고, 다른 하나는 화산의 유독 가스라는 화학적인 원인이죠. 앞에서 화산이 폭발해 도시가 묻혔다는 이야기를 했으니, 여기서는 그 결과로 사람들이 어떤 방식으로 죽었는지를 구체적으로 보여 주는 겁니다.","hl":"mn"},{"n":32,"text":"먼저 either from 그리고 or from을 눈여겨보세요. either와 or가 짝을 이루면 둘 중 하나를 고르는 상관접속사가 되고, 이때 either 뒤와 or 뒤에는 똑같은 모양의 덩어리가 와야 해요. 여기서는 from으로 시작하는 전치사구가 나란히 놓여 있죠. 다음으로 falling rocks와 collapsing buildings를 보면, 동사 fall과 collapse가 ing를 달고 명사 앞에서 떨어지는 돌, 무너지는 건물처럼 능동의 의미로 명사를 꾸며 주고 있어요. 그리고 died 뒤에 from이 붙은 것은 죽음의 원인을 from으로 받는 관용적인 짝이라는 점도 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">순식간에 그리고 완전하게 파묻혀\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Covered \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">quickly \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">completely\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거대한 폼페이 시는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">great \u003c/span>\u003cspan class=\"tgt\">city \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">Pompeii\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">완전히 사라져버렸다\u003c/span>\u003cspan class=\"en\">simply disappeared.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">순식간에 그리고 완전하게 파묻혀 거대한 폼페이 시는 완전히 사라져버렸다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 폼페이가 완전히 사라졌다는 결말을 알려 주는 문장입니다. 화산재에 덮인 결과를 \u003cb class=\"key\">과거분사\u003c/b> Covered로 먼저 제시하고, 이어서 도시가 simply disappeared라고 마무리해 '덮임 → 소멸'의 \u003cb class=\"key\">인과\u003c/b> 흐름이 자연스럽게 이어집니다. great와 simply의 대비가 한때 위대했던 도시의 허무한 \u003cb class=\"key\">소멸\u003c/b>을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사의 부사적 용법(수동)\u003c/span> : [과거분사(p.p.) + 부사구], [주어] + [동사] = '주어가 ~되어 / ~된 채로' : \"순식간에 그리고 완전하게 파묻혀\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부사의 병렬(and)\u003c/span> : [부사 A] + and + [부사 B] : \"순식간에 그리고 완전하게\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동격의 of\u003c/span> : [the city] + of + [Pompeii] = '폼페이라는 도시' : \"거대한 폼페이 시는\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"Covered quickly and completely, 순식간에 그리고 완전하게 파묻혀. the great city of Pompeii, 거대한 폼페이 시는. simply disappeared, 완전히 사라져버렸다. 이 문장 전체를 해석하면, 순식간에 그리고 완전하게 파묻혀 거대한 폼페이 시는 완전히 사라져버렸다.","hl":"m"},{"n":34,"text":"이 문장은 폼페이가 완전히 사라졌다는 결말을 담고 있어요. 앞에서 화산재가 도시를 덮었다고 했으니, 여기서는 그 결과를 Covered로 먼저 제시하고 도시가 사라졌다고 마무리하는 거죠. great와 simply가 나란히 쓰여서 한때 위대했던 도시가 허무하게 사라진 느낌을 살려 줍니다.","hl":"mn"},{"n":35,"text":"먼저 문장이 왜 Covered로 시작하는지 보세요. 주어인 the great city of Pompeii는 덮는 쪽이 아니라 덮이는 쪽이기 때문에 수동의 의미를 담은 과거분사가 필요해요. 그래서 Covered quickly and completely가 순식간에 완전히 파묻혀라는 부사적 의미로 문장 전체를 꾸며 주는 겁니다. 두 번째로 the great city of Pompeii에서 of는 폼페이라는 도시처럼 앞뒤가 같은 대상을 가리키는 동격의 of예요. 마지막으로 quickly and completely는 and로 묶인 부사 병렬이라서 두 단어가 같은 모양으로 나란히 온다는 점도 챙겨 두세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>폼페이는 수백 년 동안 로마제국의 \u003cb class=\"key\">중요한 \u003c/b>\u003cb class=\"key\">도시\u003c/b>였고 부유한 로마인들이 시골 별장을 짓던 \u003cb class=\"key\">가장 \u003c/b>\u003cb class=\"key\">좋아하는 \u003c/b>\u003cb class=\"key\">곳\u003c/b>이었다.\u003c/li>\u003cli>가게와 집, 신전이 늘어선 도시는 \u003cb class=\"key\">분주하고 \u003c/b>\u003cb class=\"key\">번창했다\u003c/b>. 하지만 베수비우스 화산 기슭에 자리한 \u003cb class=\"key\">결함\u003c/b>이 있었다.\u003c/li>\u003cli>서기 79년 베수비우스산이 \u003cb class=\"key\">격렬하게 \u003c/b>\u003cb class=\"key\">폭발\u003c/b>해 불과 \u003cb class=\"key\">화산재\u003c/b>가 도시를 덮었다.\u003c/li>\u003cli>많은 사람이 낙석, 건물 붕괴, \u003cb class=\"key\">유독 \u003c/b>\u003cb class=\"key\">가스\u003c/b>로 죽었고 폼페이는 \u003cb class=\"key\">완전히 \u003c/b>\u003cb class=\"key\">사라졌다\u003c/b>.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Even a prosperous city like Pompeii could not escape destruction when Mount Vesuvius erupted and buried it in fire and ash.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">번창한 로마 도시 \u003cb class=\"key\">폼페이\u003c/b>는 부유한 로마인들이 시골 별장을 짓던 곳이었지만, \u003cb class=\"key\">베수비우스 \u003c/b>\u003cb class=\"key\">화산\u003c/b> 기슭이라는 결함을 안고 있었다. 서기 79년 화산 폭발로 \u003cb class=\"key\">화산재\u003c/b>와 유독 가스가 도시를 덮으면서 많은 사람이 죽고 폼페이는 \u003cb class=\"key\">완전히 \u003c/b>\u003cb class=\"key\">사라졌다\u003c/b>.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":36,"text":"정리해 보면 폼페이는 번창한 로마의 도시였지만 화산 기슭이라는 결함 때문에 재앙을 피하지 못했어요. 화산 폭발과 화산재, 유독 가스가 도시를 덮었고 결국 폼페이는 완전히 사라졌습니다. 오늘 배운 시간 순서와 인과 관계를 기억하면 비슷한 역사 지문도 쉽게 읽을 수 있을 거예요. 수고했어요, 다음 시간에 또 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
