<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SO 레벨1 16강 적용독해01 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-sno{font-size:13px;color:#8493A1;font-weight:700;margin-bottom:8px}

.lp-chunk{display:flex;flex-direction:column}
.lp-chunk .ko{font-size:13px;color:var(--pk-t);font-weight:700;line-height:1.3;margin-bottom:2px}
.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}
.lp-top::before{height:5px;background:linear-gradient(90deg,var(--pk) 0,var(--pk) 80%,var(--am) 80%,var(--am) 100%)}
.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}
.lp-tag{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700;padding:2px 12px}
.lp-qn{flex:0 0 112px;height:112px;align-self:center;background:#fff;color:var(--pk);border:3px solid var(--pk);border-radius:50%;font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;font-size:26px}
.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}
.lp-qn .qt{display:block;white-space:nowrap;line-height:1.12;letter-spacing:-.02em}
.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}

.lp-st h4 i{border-radius:4px;width:auto;min-width:24px;padding:0 4px}
.lp-pill{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700}
.lp-chain span.c{background:#fff;border:1px solid #AEBBE6;border-radius:3px;font-weight:600}

.lp-vg em{background:#fff;border:1px solid var(--pk-b);border-radius:3px}
.lp-sa>div{border-radius:4px;border-color:var(--pk-b)}

.lp-chips .s{border:1px solid #AEBBE6;color:#3A4FA3}
.lp-chips .a{border:1px solid var(--am-b);color:var(--am-d);background:#FFFBF2}
.lp-sno .es{background:var(--am);border-radius:2px;font-weight:700}
.lp-chunk .en{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:600}
.lp-chunk+.lp-chunk{border-left:1px solid var(--pk-b)}
.lp .tgt{background:var(--am-l);border-bottom:2.5px dotted var(--am)}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"SO 레벨1 16강 적용독해01","audioDir":"16-01_audio","preview":false,"count":40,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">16강\u003cbr>적용독해01\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">SO 레벨1\u003c/div>\u003ch1>Red: The Color That Helps Athletes Win\u003c/h1>\u003ch2>빨강: 선수의 승리를 돕는 색\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>요약: 빨간색을 입는 것은 경기 승리에 도움을 줄 수 있으며, 그 이유는 빨강이 상대 선수에게 \u003cb class=\"key\">경고와 \u003c/b>\u003cb class=\"key\">위험\u003c/b>의 강한 메시지를 전달하는 \u003cb class=\"key\">인체 \u003c/b>\u003cb class=\"key\">생리학\u003c/b>적 반응이기 때문이다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Gist: Wearing red can give athletes a competitive advantage by sending a warning signal to opponents, a response rooted in human biology.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 빨간색이 스포츠에서 왜 승리에 도움을 줄 수 있는지 다룬 지문을 함께 읽겠습니다. 이 글은 빨간색을 입은 선수들이 경기에서 더 좋은 결과를 얻었다는 연구를 소개하고, 그 이유를 경고와 위험의 신호라는 관점에서 설명합니다. 핵심은 빨강이 상대 선수에게 심리적 압박을 주는 경고 신호로 작용한다는 점입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">\u003cb class=\"key\">붉은색\u003c/b>은 인간에게 단순한 색이 아니라 경고와 위험, 그리고 지배력(dominance)을 알리는 신호로 작용합니다. 동물의 세계에서도 붉은색은 힘이나 건강을 과시하는 표시로 쓰이기도 합니다. 사람이 화가 나면 얼굴이 붉어지고, 그 모습은 주변 사람들에게 조심하라는 \u003cb class=\"key\">위험 \u003c/b>\u003cb class=\"key\">신호\u003c/b>를 보냅니다. 이런 반응은 단순한 습관이 아니라 \u003cb class=\"key\">인체 \u003c/b>\u003cb class=\"key\">생리학\u003c/b>(human biology)에 뿌리를 둔 기본 반응으로 설명됩니다. 스포츠에서는 상대가 빨간색을 보는 순간 무의식적으로 긴장하거나 위축될 수 있어, 빨간 유니폼이 작은 심리적 우위를 만들 수 있다는 해석이 나옵니다. 일상에서 빨간 경고등이나 정지 표지판을 보면 본능적으로 멈추거나 조심하게 되는 것도 같은 원리입니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 짚어 볼게요. 사람에게 빨간색은 단순한 색이 아니라 경고와 위험, 그리고 지배력, 즉 dominance를 알리는 신호로 작용합니다. 동물의 세계에서도 붉은색은 힘이나 건강을 과시하는 표시로 쓰이기도 하죠. 사람이 화가 나면 얼굴이 붉어지고, 그 모습은 주변 사람들에게 조심하라는 위험 신호를 보냅니다. 이런 반응은 단순한 습관이 아니라 human biology, 즉 인체 생리학에 뿌리를 둔 기본 반응으로 설명됩니다. 일상에서 빨간 경고등이나 정지 표지판을 보면 본능적으로 멈추거나 조심하게 되는 것도 같은 원리예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>특이한 충고\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>글은 승리가 전부라면 \u003cb class=\"key\">빨간색\u003c/b>을 입으라는 특이한 충고로 시작합니다. 이 충고는 아테네에서 열린 하계 올림픽의 다양한 경기 결과를 분석한 \u003cb class=\"key\">영국 \u003c/b>\u003cb class=\"key\">심리학자들\u003c/b>에게서 나온 것입니다. 즉 일상적 조언이 아니라 실제 \u003cb class=\"key\">경기 \u003c/b>\u003cb class=\"key\">결과 \u003c/b>\u003cb class=\"key\">분석\u003c/b>에 근거한 주장임을 밝힙니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>놀라운 연구 결과\u003csmall>근거 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>연구자들이 밝혀낸 결과는 꽤 놀라웠습니다. 빨간색을 입은 선수들이 연구자들이 관찰한 \u003cb class=\"key\">스물한 \u003c/b>\u003cb class=\"key\">번의 \u003c/b>\u003cb class=\"key\">경기\u003c/b> 중 열여섯 번을 이겼다는 것입니다. 이는 빨강이 승리에 영향을 줄 수 있음을 보여 주는 \u003cb class=\"key\">통계적 \u003c/b>\u003cb class=\"key\">근거\u003c/b>입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>경고 메시지\u003csmall>해석 · 문장 5\u003c/small>\u003c/h4>\u003cp>빨강이 선수들을 돕는 정확한 방식은 아직 알려져 있지 않습니다. 다만 빨강이 상대 선수에게 \u003cb class=\"key\">경고와 \u003c/b>\u003cb class=\"key\">위험\u003c/b>이라는 강한 메시지를 전달한다고 믿어집니다. 그래서 빨강은 상대의 심리를 위축시키는 \u003cb class=\"key\">심리적 \u003c/b>\u003cb class=\"key\">신호\u003c/b>로 해석됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>생리학적 근거\u003csmall>근거 · 문장 6–8\u003c/small>\u003c/h4>\u003cp>빨강에 대한 반응은 \u003cb class=\"key\">인체 \u003c/b>\u003cb class=\"key\">생리학\u003c/b>의 기본적인 부분으로 알려져 있습니다. 사람이 화가 나면 얼굴이 붉어지고, 이것은 다른 사람들에게 \u003cb class=\"key\">조심하라\u003c/b>는 경고가 됩니다. 즉 빨강은 학습된 문화만이 아니라 인간의 \u003cb class=\"key\">본능적 \u003c/b>\u003cb class=\"key\">반응\u003c/b>과 연결되어 있습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>일상 속 예시\u003csmall>예시 · 문장 9\u003c/small>\u003c/h4>\u003cp>정지 신호가 빨간색인 이유도 같은 원리로 설명됩니다. 빨간 정지 표지판은 사람들에게 \u003cb class=\"key\">멈춤\u003c/b>과 주의를 요구하는 신호입니다. 이 예시는 빨강의 \u003cb class=\"key\">경고 \u003c/b>\u003cb class=\"key\">기능\u003c/b>이 일상에서도 반복된다는 점을 보여 줍니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 단계별로 따라가 볼게요.","hl":null},{"n":4,"text":"첫 단계는 특이한 충고로 시작합니다. 글은 승리가 전부라면 빨간색을 입으라고 말하죠. 그리고 이 충고가 아테네에서 열린 하계 올림픽의 다양한 경기 결과를 분석한 영국 심리학자들에게서 나왔다고 밝힙니다. 그래서 이 글은 단순한 속설이 아니라 실제 경기 결과 분석에 근거한 주장이라는 점을 먼저 잡아 주세요.","hl":"f0"},{"n":5,"text":"다음은 놀라운 연구 결과입니다. 연구자들이 밝혀낸 바에 따르면 빨간색을 입은 선수들은 관찰된 스물한 번의 경기 중 열여섯 번을 이겼습니다. 이 결과는 빨강이 승리에 영향을 줄 수 있다는 통계적 근거로 쓰입니다. 숫자를 외우기보다 결과의 의미에 집중하면 좋아요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 그 이유에 대한 해석입니다. 빨강이 선수들을 돕는 정확한 방식은 아직 알려져 있지 않습니다. 하지만 빨강이 상대 선수에게 경고와 위험이라는 강한 메시지를 전달한다고 믿어집니다. 그래서 빨강은 상대의 심리를 위축시키는 심리적 신호로 해석됩니다.","hl":"f2"},{"n":7,"text":"네 번째 단계는 생리학적 근거입니다. 빨강에 대한 우리의 반응은 인체 생리학의 기본적인 부분으로 알려져 왔습니다. 사람이 화가 나면 얼굴이 붉어지고, 이것은 다른 사람들에게 조심하라는 경고가 됩니다. 즉 빨강은 학습된 문화만이 아니라 본능적 반응과 연결되어 있다는 거죠.","hl":"f3"},{"n":8,"text":"마지막 단계는 일상 속 예시입니다. 정지 신호가 빨간색인 이유도 같은 원리로 설명됩니다. 빨간 정지 표지판은 사람들에게 멈춤과 주의를 요구하는 신호입니다. 이 예시는 빨강의 경고 기능이 일상에서도 반복된다는 점을 보여 줍니다.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 승리하려면 빨간색을 입으라는 \u003cb class=\"key\">주장\u003c/b>을 먼저 제시합니다. 이어서 영국 심리학자들의 올림픽 분석을 \u003cb class=\"key\">근거\u003c/b>로 제시하고, 빨강이 경고와 위험의 메시지를 준다는 해석을 덧붙입니다. 마지막으로 화난 얼굴과 정지 신호의 예를 들어 빨강에 대한 반응이 \u003cb class=\"key\">생리학\u003c/b>적이라는 점을 뒷받침합니다. 따라서 주제가 앞에 나오는 \u003cb class=\"key\">두괄식\u003c/b> 주장-근거 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>If (1)\u003c/b>\u003cspan>조건 제시\u003c/span>\u003cb>What they found (3)\u003c/b>\u003cspan>연구 결과 도입\u003c/span>\u003cb>but (5)\u003c/b>\u003cspan>전환과 해석 제시\u003c/span>\u003cb>In fact (6)\u003c/b>\u003cspan>근거 강화\u003c/span>\u003cb>For example (7)\u003c/b>\u003cspan>예시 제시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">winning\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">won 16 of the 21 events\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">wear red\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">wearing the color red\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the color red\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">warning and danger\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">warns other people to be careful\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">response to the color red\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">basic part of human biology\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"이 글은 주장과 근거로 이루어진 전개 방식입니다. 첫 문장에서 승리하려면 빨간색을 입으라는 주장을 먼저 내세우고, 이어서 올림픽 분석 결과와 생리학적 예시로 그것을 뒷받침합니다. 주제가 글 앞부분에 나오므로 두괄식 구조라고 볼 수 있습니다. 따라서 읽을 때는 첫 문장의 주장을 잡고 뒤의 근거가 어떻게 연결되는지 확인해야 합니다.","hl":"ty"},{"n":10,"text":"신호어를 보면 글의 뼈대가 더 선명해집니다. In fact는 앞의 해석을 더 강한 근거로 밀어 주는 역할을 하고, For example은 생리학적 원리를 구체적인 예시로 풀어 줍니다. but은 정확히 알려지지 않았다는 부분과 그래도 믿어진다는 해석을 이어 주는 전환 표지입니다. 또 같은 개념이 the color red, warning and danger, warns other people to be careful처럼 반복되고 바뀌어 표현되는 점도 함께 짚어 주세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>winning\u003c/b>\u003cem>명사\u003c/em>\u003cspan>승리, 이기는 것\u003c/span>\u003c/div>\u003cdiv>\u003cb>unusual\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>특이한, 이례적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>advice\u003c/b>\u003cem>명사\u003c/em>\u003cspan>충고, 조언\u003c/span>\u003c/div>\u003cdiv>\u003cb>come from\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에서 나오다, 비롯되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>psychologist\u003c/b>\u003cem>명사\u003c/em>\u003cspan>심리학자\u003c/span>\u003c/div>\u003cdiv>\u003cb>analyze\u003c/b>\u003cem>동사\u003c/em>\u003cspan>분석하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>result\u003c/b>\u003cem>명사\u003c/em>\u003cspan>결과\u003c/span>\u003c/div>\u003cdiv>\u003cb>various\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>다양한\u003c/span>\u003c/div>\u003cdiv>\u003cb>event\u003c/b>\u003cem>명사\u003c/em>\u003cspan>경기, 사건\u003c/span>\u003c/div>\u003cdiv>\u003cb>surprising\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>놀라운\u003c/span>\u003c/div>\u003cdiv>\u003cb>athlete\u003c/b>\u003cem>명사\u003c/em>\u003cspan>선수\u003c/span>\u003c/div>\u003cdiv>\u003cb>wear\u003c/b>\u003cem>동사\u003c/em>\u003cspan>입다, 착용하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>win\u003c/b>\u003cem>동사\u003c/em>\u003cspan>이기다, 승리하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>observe\u003c/b>\u003cem>동사\u003c/em>\u003cspan>관찰하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>exactly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>정확히\u003c/span>\u003c/div>\u003cdiv>\u003cb>believe\u003c/b>\u003cem>동사\u003c/em>\u003cspan>믿다, 여기다\u003c/span>\u003c/div>\u003cdiv>\u003cb>deliver\u003c/b>\u003cem>동사\u003c/em>\u003cspan>전달하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>warning\u003c/b>\u003cem>명사\u003c/em>\u003cspan>경고\u003c/span>\u003c/div>\u003cdiv>\u003cb>danger\u003c/b>\u003cem>명사\u003c/em>\u003cspan>위험\u003c/span>\u003c/div>\u003cdiv>\u003cb>competitor\u003c/b>\u003cem>명사\u003c/em>\u003cspan>경쟁자, 상대 선수\u003c/span>\u003c/div>\u003cdiv>\u003cb>in fact\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>사실, 실제로\u003c/span>\u003c/div>\u003cdiv>\u003cb>response\u003c/b>\u003cem>명사\u003c/em>\u003cspan>반응\u003c/span>\u003c/div>\u003cdiv>\u003cb>basic\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>기본적인\u003c/span>\u003c/div>\ \u003c/span>\u003cspan class=\"a\">uniform\u003c/span>\u003cspan class=\"a\">identical\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">surprising\u003c/b>\u003cspan class=\"m\">놀라운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">astonishing\u003c/span>\u003cspan class=\"s\">amazing\u003c/span>\u003cspan class=\"s\">unexpected\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">predictable\u003c/span>\u003cspan class=\"a\">ordinary\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">competitor\u003c/b>\u003cspan class=\"m\">경쟁자\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">rival\u003c/span>\u003cspan class=\"s\">opponent\u003c/span>\u003cspan class=\"s\">contender\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ally\u003c/span>\u003cspan class=\"a\">partner\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">careful\u003c/b>\u003cspan class=\"m\">조심하는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">cautious\u003c/span>\u003cspan class=\"s\">attentive\u003c/span>\u003cspan class=\"s\">watchful\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">careless\u003c/span>\u003cspan class=\"a\">reckless\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">basic\u003c/b>\u003cspan class=\"m\">기본적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">fundamental\u003c/span>\u003cspan class=\"s\">essential\u003c/span>\u003cspan class=\"s\">elementary\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">advanced\u003c/span>\u003cspan class=\"a\">secondary\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어도 함께 정리해 볼게요. unusual은 uncommon, extraordinary와 가깝고 usual, common과 반대됩니다. analyze는 examine, study로 바꿔 쓸 수 있고, careful은 cautious, attentive와 비슷하지만 careless, reckless와는 반대예요. competitor는 rival, opponent와 동의어이고 ally, partner와는 대조됩니다. basic은 fundamental, essential과 가깝고 advanced, secondary와 반대된다는 점도 기억해 주세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만일 승리가 당신에게 전부라면,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">If \u003c/span>\u003cspan class=\"tgt\">winning \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">everything \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">you\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 붉은 색을 입어야 한다!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">should \u003c/span>\u003cspan class=\"tgt\">wear \u003c/span>\u003cspan class=\"tgt\">red\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">만일 당신에게 승리가 전부라면, 당신은 붉은 색을 입어야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글 전체의 \u003cb class=\"key\">주제문\u003c/b>이에요. 승리를 무엇보다 중요하게 여기는 사람에게 \u003cb class=\"key\">붉은색\u003c/b>을 입으라고 권하는, 조금 독특한 주장을 던지고 있죠. 이렇게 꺼낸 red가 뒤에서 심리학적으로 설명될 \u003cb class=\"key\">열쇠말\u003c/b>이라는 점을 꼭 기억해 두세요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조건의 부사절(if)과 동명사 주어\u003c/span> : If + [주어 winning] + [동사 is] , [주절] : \"만일 당신에게 승리가 전부라면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 should(충고·권유)\u003c/span> : [주어] + should + [동사원형] : \"당신은 붉은 색을 입어야 한다\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"If winning is everything to you, 만일 승리가 당신에게 전부라면. you should wear red!, 당신은 붉은 색을 입어야 한다!. 이 문장 전체를 해석하면, 만일 당신에게 승리가 전부라면, 당신은 붉은 색을 입어야 한다.","hl":"m"},{"n":14,"text":"이 문장은 글 전체의 주제문이에요. 승리를 가장 중요하게 여기는 사람에게 붉은색을 입으라고 권하는 독특한 주장으로 글을 시작하죠. 여기서 나온 red가 뒤에서 심리학으로 풀릴 열쇠말이라는 점, 꼭 잡아 두세요.","hl":"mn"},{"n":15,"text":"어법은 두 가지만 짚을게요. 첫 번째, If winning is everything to you에서 if는 조건을 만드는 접속사예요. 그리고 winning은 동명사로 문장의 주어 자리에 앉아 있죠. 두 번째, you should wear red에서 should는 충고를 나타내는 조동사라서 뒤에 동사원형 wear가 그대로 왔어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 특이한 충고는\u003c/span>\u003cspan class=\"en\">This unusual advice\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">영국 심리학자들로부터 나온다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">comes \u003c/span>\u003cspan class=\"tgt\">from\u003c/span> British psychologists\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다양한 경기들의 결과를 분석한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">analyzed \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">results \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">various \u003c/span>\u003cspan class=\"tgt\">events\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">2004년 아테네에서 열린 하계 올림픽에서의\u003c/span>\u003cspan class=\"en\">at the 2004 Summer Olympic Games in Athens.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 특이한 충고는, 2004 년 아테네에서 열린 하계 올림픽의 다양한 경기 결과를 분석한 영국 심리학자들로부터 나온다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 던진 조언이 어디서 나왔는지 \u003cb class=\"key\">출처\u003c/b>를 밝히는 문장이에요. 영국 심리학자들이 2004년 아테네 하계 올림픽의 여러 경기 결과를 \u003cb class=\"key\">분석\u003c/b>해서 얻은 결론이라는 거죠. 이렇게 근거를 콕 집어 제시하면 앞의 주장이 훨씬 \u003cb class=\"key\">신뢰\u003c/b> 있게 들립니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class ass=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">turn \u003c/span>\u003cspan class=\"tgt\">red\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">예를 들면, 사람들이 화를 낼 때 그들의 얼굴은 종종 빨개진다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 빨간색에 대한 인간의 반응이 생물학적 기본 요소임을 보여 주는 첫 번째 예시예요. 화를 내면 얼굴이 빨개지는 \u003cb class=\"key\">신체 \u003c/b>\u003cb class=\"key\">반응\u003c/b>이 나타나고, 이것이 주변 사람에게 위험 신호를 보내는 \u003cb class=\"key\">경고\u003c/b>의 역할을 한다는 흐름이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 when의 시간 부사절\u003c/span> : [when] + [주어 + 동사] (…할 때) : \"사람들이 화를 낼 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">get + 형용사(상태 변화)\u003c/span> : get + [형용사] (…하게 되다, …해지다) : \"화를 내다, 화가 나다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">turn + 형용사(상태 변화)\u003c/span> : turn + [형용사] (…하게 변하다) : \"빨개지다\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"For example, 예를 들면. when people get angry, 사람들이 화를 낼 때. their faces, 그들의 얼굴은. often turn red, 종종 빨개진다.. 이 문장 전체를 해석하면, 예를 들면, 사람들이 화를 낼 때 그들의 얼굴은 종종 빨개진다.","hl":"m"},{"n":32,"text":"여기는 빨간색에 대한 우리 몸의 반응을 보여 주는 예시예요. 사람이 화를 내면 얼굴에 신체 반응이 나타나서 빨개지고, 그 모습이 주변 사람에게 경고 신호가 된다는 거죠.","hl":"mn"},{"n":33,"text":"첫 번째로 when people get angry에서 when은 '~할 때'라는 시간을 나타내는 접속사예요. 두 번째로 get angry는 get이 형용사 angry와 결합해 상태 변화를 나타내는 구조죠. 세 번째로 turn red는 turn이 변화를 나타내는 연결동사로 쓰여서 '빨개지다'라는 뜻이 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은\u003c/span>\u003cspan class=\"en\">This\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 이들에게 경고한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">warns \u003c/span>\u003cspan class=\"tgt\">other \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">조심하도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">careful\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것은 다른 이들로 하여금 조심하도록 경고한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 말한 얼굴이 빨개지는 현상이 주변 사람들에게 \u003cb class=\"key\">경고\u003c/b>를 보낸다는 뜻이에요. 즉, 화난 사람을 보고 다른 사람들이 \u003cb class=\"key\">조심\u003c/b>하도록 만드는 신호라는 거죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">warn + 목적어 + to부정사(목적격 보어)\u003c/span> : warn + [목적어] + [to부정사] (목적어가 ~하도록 경고하다) : \"다른 이들이 조심하도록 경고한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 목적격 보어 용법\u003c/span> : warn + [목적어] + [to be + 형용사] : \"조심하도록\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"This, 이것은. warns other people, 다른 이들에게 경고한다. to be careful, 조심하도록. 이 문장 전체를 해석하면, 이것은 다른 이들로 하여금 조심하도록 경고한다.","hl":"m"},{"n":35,"text":"앞에서 말한 얼굴이 빨개지는 현상이 주변 사람들에게 경고를 보낸다는 뜻이에요. 다시 말해 화난 사람을 보고 다른 사람들이 조심하도록 만드는 신호라는 거죠.","hl":"mn"},{"n":36,"text":"첫 번째로 warns other people to be careful은 warn이 목적어 other people 뒤에 to부정사를 목적격 보어로 취하는 구조예요. 두 번째로 to be careful에서 be careful은 조심하는 상태를 나타내고, to부정사가 목적어의 행동을 이끌어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜 정지 신호가 빨간색인지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Why \u003c/span>\u003cspan class=\"tgt\">stop \u003c/span>\u003cspan class=\"tgt\">signs \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">red\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또한 설명될 수 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">also \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">explained\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것에 의해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">this\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">왜 정지 신호가 빨간색인지도 또한 이렇게 설명될 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 정지 신호가 빨간 이유도 앞에서 말한 빨간색의 \u003cb class=\"key\">경고\u003c/b> 기능으로 설명할 수 있다는 뜻이에요. 즉, 빨간색이 위험과 \u003cb class=\"key\">주의\u003c/b>를 떠올리게 해서 사람들이 멈추도록 만든다는 흐름이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">간접의문문(의문사 + 주어 + 동사)의 명사절 주어\u003c/span> : [Why + 주어 + 동사] + 동사 (…인지가 …되다) : \"왜 정지 신호가 빨간색인지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사가 포함된 수동태\u003c/span> : [can] + [be + 과거분사] (…될 수 있다) : \"또한 설명될 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 by의 수단·원인\u003c/span> : by + [명사/대명사] (…에 의해, …로써) : \"이것에 의해, 이로써\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"Why stop signs are red, 왜 정지 신호가 빨간색인지. can also be explained, 또한 설명될 수 있다. by this, 이것에 의해. 이 문장 전체를 해석하면, 왜 정지 신호가 빨간색인지도 또한 이렇게 설명될 수 있다.","hl":"m"},{"n":38,"text":"정지 신호가 빨간 이유도 앞에서 말한 빨간색의 경고 기능으로 설명할 수 있다는 뜻이에요. 다시 말해 빨간색이 위험과 주의를 떠올리게 해서 사람들이 멈추도록 만든다는 흐름이죠.","hl":"mn"},{"n":39,"text":"첫 번째로 Why stop signs are red는 의문사 why 뒤에 주어와 동사가 오는 간접의문문으로, '왜 ~인지'라는 명사절이 문장의 주어 역할을 해요. 두 번째로 can also be explained는 조동사 can 뒤에 be explained가 와서 '설명될 수 있다'라는 수동의 의미를 나타내고, also는 부사로 '또한'을 더해 줘요. 세 번째로 by this에서 by는 앞의 설명을 가능하게 하는 수단을 나타내는 전치사예요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>승리가 전부라면 \u003cb class=\"key\">빨간색\u003c/b>을 입으라는 충고가 아테네 올림픽 분석에서 나온다.\u003c/li>\u003cli>빨간색을 입은 선수들이 관찰된 \u003cb class=\"key\">스물한 \u003c/b>\u003cb class=\"key\">번의 \u003c/b>\u003cb class=\"key\">경기\u003c/b> 중 열여섯 번을 이겼다는 점이 놀라운 근거로 제시된다.\u003c/li>\u003cli>빨강은 상대 선수에게 \u003cb class=\"key\">경고와 \u003c/b>\u003cb class=\"key\">위험\u003c/b>의 강한 메시지를 전달하는 것으로 믿어진다.\u003c/li>\u003cli>화난 얼굴과 정지 신호의 예는 빨강에 대한 반응이 \u003cb class=\"key\">인체 \u003c/b>\u003cb class=\"key\">생리학\u003c/b>적 기본 반응임을 보여 준다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Gist: Wearing red can give athletes a competitive advantage by sending a warning signal to opponents, a response rooted in human biology.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: 빨간색을 입는 것은 경기 승리에 도움을 줄 수 있으며, 그 이유는 빨강이 상대 선수에게 \u003cb class=\"key\">경고와 \u003c/b>\u003cb class=\"key\">위험\u003c/b>의 강한 메시지를 전달하는 \u003cb class=\"key\">인체 \u003c/b>\u003cb class=\"key\">생리학\u003c/b>적 반응이기 때문이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":40,"text":"오늘 글의 핵심은 빨강이 단순한 색이 아니라 경고와 위험을 알리는 강한 신호라는 점입니다. 그래서 빨간색을 입은 선수는 상대에게 심리적 압박을 주고 경쟁에서 작은 우위를 얻을 수 있다는 설명으로 이어집니다. 글을 다시 읽을 때는 첫 문장의 주장, 올림픽 분석 결과, 인체 생리학적 근거를 연결해서 보세요. 수고했어요, 다음 강의에서 또 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
