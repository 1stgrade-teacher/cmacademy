<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SO 레벨1 8강 적용독해02 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-sno{font-size:13px;color:#8493A1;font-weight:700;margin-bottom:8px}

.lp-chunk{display:flex;flex-direction:column}
.lp-chunk .ko{font-size:13px;color:var(--pk-t);font-weight:700;line-height:1.3;margin-bottom:2px}
.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}
.lp-top::before{height:5px;background:linear-gradient(90deg,var(--pk) 0,var(--pk) 80%,var(--am) 80%,var(--am) 100%)}
.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}
.lp-tag{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700;padding:2px 12px}
.lp-qn{flex:0 0 112px;height:112px;align-self:center;background:#fff;color:var(--pk);border:3px solid var(--pk);border-radius:50%;font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;font-size:26px}
.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}

.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}

.lp-st h4 i{border-radius:4px;width:auto;min-width:24px;padding:0 4px}
.lp-pill{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700}

.lp-chips .s{border:1px solid #AEBBE6;color:#3A4FA3}
.lp-chips .a{border:1px solid var(--am-b);color:var(--am-d);background:#FFFBF2}
.lp-sno .es{background:var(--am);border-radius:2px;font-weight:700}
.lp-chunk .en{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:600}
.lp-chunk+.lp-chunk{border-left:1px solid var(--pk-b)}
.lp .tgt{background:var(--am-l);border-bottom:2.5px dotted var(--am)}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"SO 레벨1 8강 적용독해02","audioDir":"8-02_audio","preview":false,"count":39,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">8강\u003cbr>적용독해02\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">SO 레벨1\u003c/div>\u003ch1>Teenagers Need More Sleep: Why School Should Start Later\u003c/h1>\u003ch2>청소년에게는 더 많은 잠이 필요하다: 학교는 왜 더 늦게 시작해야 할까\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>사람들은 청소년이 커가면서 잠이 덜 필요하다고 생각하지만, 의사들은 청소년에게 매일 \u003cb class=\"key\">여덟 \u003c/b>\u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">반\u003c/b>의 수면이 필요하다고 경고한다. 수업 시작 시간이 빨라 \u003cb class=\"key\">수면 \u003c/b>\u003cb class=\"key\">부족\u003c/b>이 생기면 학생들은 아침 수업 내내 졸고 좋지 않은 성적을 거둘 수 있어, 정부가 학교의 \u003cb class=\"key\">시작 \u003c/b>\u003cb class=\"key\">시간\u003c/b>을 늦추도록 압력을 넣어야 한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Doctors warn that early school start times deprive teenagers of needed sleep and urge the government to push schools to start later.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 청소년의 수면과 학교 수업 시작 시간에 관한 글을 함께 읽어 볼 거예요. 이 글은 청소년에게 잠이 정말 덜 필요한지, 그리고 이른 등교가 어떤 문제를 만드는지 다루고 있죠. 핵심은 청소년에게 충분한 수면이 필요하며 학교 시작 시간을 늦춰야 한다는 주장이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">청소년기는 몸의 \u003cb class=\"key\">생체 \u003c/b>\u003cb class=\"key\">리듬\u003c/b>(circadian rhythm)이 뒤로 밀리는 시기예요. 이 시기에는 잠을 부르는 호르몬인 멜라토닌(melatonin)의 분비 시점이 늦어져, 일찍 자라고 해도 쉽게 잠들지 못하죠. 그래서 성인보다 늦게 자고 늦게 일어나는 패턴이 자연스럽게 나타나며, 필요한 수면량도 줄지 않아요. 이는 마치 시차가 있는 공항에 도착한 여행자가 시계는 일찍 맞춰야 하지만 몸은 아직 밤이라고 느끼는 것과 비슷해요. 그런데 학교가 이른 시간에 시작하면 청소년은 \u003cb class=\"key\">수면 \u003c/b>\u003cb class=\"key\">부족\u003c/b> 상태로 하루를 시작하게 되고, 집중력과 학습 효율이 떨어질 수 있어요. 이 글은 이런 \u003cb class=\"key\">청소년 \u003c/b>\u003cb class=\"key\">수면\u003c/b> 문제를 사회적 정책으로 다뤄야 한다고 말합니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 짚어 볼게요. 청소년기는 몸의 생체 리듬, 영어로 circadian rhythm이 뒤로 밀리는 시기예요. 이때 잠을 부르는 호르몬인 melatonin의 분비 시점이 늦어져서 일찍 자려 해도 쉽게 잠들지 못하죠. 그래서 성인보다 늦게 자고 늦게 일어나는 패턴이 자연스럽게 나타나는데, 필요한 수면량은 줄지 않아요. 이건 마치 시차가 있는 공항에 도착한 여행자가 시계는 일찍 맞춰야 하지만 몸은 아직 밤이라고 느끼는 것과 비슷해요. 학교가 너무 일찍 시작하면 청소년은 수면 부족 상태로 하루를 시작하게 되고, 결국 청소년 수면 문제는 개인의 의지가 아니라 사회적 정책으로 다뤄야 할 일이 됩니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>수면에 대한 통념\u003csmall>통념 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>사람들은 청소년이 커가면서 잠이 덜 필요하다고 \u003cb class=\"key\">믿음\u003c/b>을 제시한다. 심지어 밤에 여섯 시간만 자면 충분하다고 생각하는 이들도 있다. 이 통념은 뒤에서 의사들의 경고와 \u003cb class=\"key\">대조\u003c/b>를 이룬다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>이른 등교와 의사 경고\u003csmall>전환·문제 제기 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>이러한 믿음 때문에 많은 학교가 수업을 아침 일곱 시 삼십 분이나 그보다 일찍 시작하게 되었다. 그러나 의사들은 이른 등교가 청소년의 건강과 교육을 \u003cb class=\"key\">위험\u003c/b>에 빠뜨린다고 경고한다. 여기서 However가 통념을 반박하는 \u003cb class=\"key\">전환\u003c/b> 신호로 쓰인다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>전문가의 경고\u003csmall>근거·예시 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>한 전문가에 따르면 청소년은 매일 여덟 시간 반씩 자야 하지만, 이른 수업 시작 시간 때문에 거의 그렇게 자지 못한다. 그 결과 아침 수업 내내 졸고 결국 \u003cb class=\"key\">성적 \u003c/b>\u003cb class=\"key\">저하\u003c/b>를 겪게 된다. 이는 통념과 반대되는 \u003cb class=\"key\">전문가 \u003c/b>\u003cb class=\"key\">근거\u003c/b>이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>정부에 요구하다\u003csmall>주장·해결 · 문장 7–9\u003c/small>\u003c/h4>\u003cp>이제 의사들은 정부에 \u003cb class=\"key\">조치\u003c/b>를 취해 달라고 요청한다. 구체적으로 학교의 수업 시작 시간을 \u003cb class=\"key\">늦출 \u003c/b>\u003cb class=\"key\">것\u003c/b>을 요구한다. 이는 학생들이 충분한 휴식을 취하고 공부를 더 잘할 수 있게 하려는 \u003cb class=\"key\">해결책\u003c/b>이다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 네 단계로 나누어 살펴볼게요.","hl":null},{"n":4,"text":"첫 단계는 수면에 대한 통념이에요. 사람들은 청소년이 커가면서 잠이 덜 필요하다는 믿음을 가지고 있고, 심지어 밤에 여섯 시간만 자면 충분하다고 생각하는 이들도 있죠. 이 믿음은 뒤에서 나오는 의사들의 경고와 대조를 이루기 때문에, 읽을 때 꼭 기억해 두세요.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 이 믿음이 학교 현실로 이어진 모습을 봐요. 많은 학교가 수업을 아침 일곱 시 삼십 분이나 그보다 일찍 시작하게 되었죠. 그런데 의사들은 이런 이른 등교가 청소년의 건강과 교육을 위험에 빠뜨린다고 경고해요. 여기서 However가 통념을 반박하는 전환 신호로 쓰인다는 점도 눈여겨보세요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 전문가의 말로 근거를 보강하는 부분이에요. 한 전문가에 따르면 청소년은 매일 여덟 시간 반씩 자야 하지만, 이른 수업 시작 시간 때문에 거의 그렇게 자지 못한다고 해요. 그 결과 아침 수업 내내 졸고 결국 성적 저하를 겪게 된다는 거죠. 이 내용은 통념과 반대되는 전문가 근거로 정리할 수 있어요.","hl":"f2"},{"n":7,"text":"마지막 단계에서는 의사들이 정부에 조치를 취해 달라고 요청해요. 구체적으로는 학교가 수업 시작 시간을 늦출 것을 요구하죠. 그렇게 하면 학생들이 충분한 휴식을 취하고 공부를 더 잘할 수 있다는 희망까지 제시해요. 그래서 이 부분을 글의 해결책으로 잡으면 됩니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">통념-반박\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 4번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 처음에 청소년 수면에 대한 \u003cb class=\"key\">통념\u003c/b>과 그로 인한 이른 등교를 제시하고, 넷째 문장에서 However로 의사들의 \u003cb class=\"key\">경고\u003c/b>를 내세워 통념을 반박한다. 이어 전문가 인용으로 근거를 보강하고, 정부에 수업 시작 시간을 늦추라는 요구로 나아간다. 중심 주장이 글 중간에서 제시되고 앞의 통념과 뒤의 해결 요구를 연결하므로 \u003cb class=\"key\">중괄식\u003c/b>으로 볼 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>However (4)\u003c/b>\u003cspan>통념을 반박하는 전환\u003c/span>\u003cb>According to (5)\u003c/b>\u003cspan>전문가 근거 제시\u003c/span>\u003cb>So (6)\u003c/b>\u003cspan>원인과 결과 연결\u003c/span>\u003cb>Now (7)\u003c/b>\u003cspan>해결 요구로 전환\u003c/span>\u003cb>demand (8)\u003c/b>\u003cspan>강한 요구·주장\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">believe that teenagers need less sleep\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">six hours of sleep a night is enough\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">early school starting times\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">doctors warn\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">need eight and a half hours of sleep\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">rarely get that much\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">snooze through morning classes\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">get poor grades\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">move back their starting times\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">get enough rest and do better in school\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>사회의 통념\u003c/th>\u003cth>의사와 전문가의 경고\u003c/th>\u003c/tr>\u003ctr>\u003ctd>청소년은 잠이 덜 필요하다고 봄\u003c/td>\u003ctd>청소년은 매일 여덟 시간 반의 수면이 필요하다고 봄\u003c/td>\u003c/tr>\u003ctr>\u003ctd>여섯 시간 수면이면 충분하다고 생각\u003c/td>\u003ctd>수면 부족이 건강과 교육을 위험에 빠뜨린다고 경고\u003c/td>\u003c/tr>\u003ctr>\u003ctd>학교 수업을 이른 시간에 시작\u003c/td>\u003ctd>학교 수업 시작 시간을 늦출 것을 요구\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 통념과 반박으로 볼 수 있어요. 처음에는 청소년 수면에 대한 통념을 보여 주고, However 이후에는 의사들의 경고를 내세워 그 통념을 흔들죠. 중심 주장이 글의 중간에 놓여 앞의 통념과 뒤의 해결 요구를 연결하므로 중괄식 구조로 이해하면 좋아요. 즉, 통념을 먼저 깔고 반박과 해결로 나아가는 방식입니다.","hl":"ty"},{"n":9,"text":"신호어를 보면 흐름이 더 선명해져요. However는 앞의 통념을 뒤집는 전환 신호이고, According to는 전문가의 말을 끌어오는 근거 신호예요. So는 수면 부족이 졸음과 성적 저하로 이어지는 인과를 보여 주고, Now와 demand는 정부에 요구하는 해결 단계로 넘어가게 해 줍니다. 또 belief와 doctors warn처럼 통념과 경고가 대조를 이루는 재진술에도 주목하세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>believe\u003c/b>\u003cem>동사\u003c/em>\u003cspan>믿다\u003c/span>\u003c/div>\u003cdiv>\u003cb>teenager\u003c/b>\u003cem>명사\u003c/em>\u003cspan>청소년\u003c/span>\u003c/div>\u003cdiv>\u003cb>less\u003c/b>\u003cem>부사\u003c/em>\u003cspan>덜, 더 적게\u003c/span>\u003c/div>\u003cdiv>\u003cb>as\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>~함에 따라, ~하면서\u003c/span>\u003c/div>\u003cdiv>\u003cb>even\u003c/b>\u003cem>부사\u003c/em>\u003cspan>심지어\u003c/span>\u003c/div>\u003cdiv>\u003cb>enough\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>충분한\u003c/span>\u003c/div>\u003cdiv>\u003cb>belief\u003c/b>\u003cem>명사\u003c/em>\u003cspan>믿음, 신념\u003c/span>\u003c/div>\u003cdiv>\u003cb>lead to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 이끌다, 초래하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>schedule\u003c/b>\u003cem>동사\u003c/em>\u003cspan>일정을 잡다, 계획하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>start\u003c/b>\u003cem>동사\u003c/em>\u003cspan>시작하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>earlier\u003c/b>\u003cem>부사\u003c/em>\u003cspan>더 일찍\u003c/span>\u003c/div>\u003cdiv>\u003cb>however\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>그러나\u003c/span>\u003c/div>\u003cdiv>\u003cb>warn\u003c/b>\u003cem>동사\u003c/em>\u003cspan>경고하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>society\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사회\u003c/span>\u003c/div>\u003cdiv>\u003cb>put ... at risk\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 위험에 빠뜨리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>health\u003c/b>\u003cem>명사\u003c/em>\u003cspan>건강\u003c/span>\u003c/div>\u003cdiv>\u003cb>education\u003c/b>\u003cem>명사\u003c/em>\u003cspan>교육\u003c/span>\u003c/div>\u003cdiv>\u003cb>according to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 따르면\u003c/span>\u003c/div>\u003cdiv>\u003cb>expert\u003c/b>\u003cem>명사\u003c/em>\u003cspan>전문가\u003c/span>\u003c/div>\u003cdiv>\u003cb>rarely\u003c/b>\u003cem>부사\u003c/em>\u003cspan>거의 ~하지 않다\u003c/span>\u003c/div>\u003cdiv>\u003cb>due to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~ 때문에\u003c/span>\u003c/div>\u003cdiv>\u003cb>starting time\u003c/b>\u003cem>명사\u003c/em>\u003cspan>시작 시간\u003c/span>\u003c/div>\u003cdiv>\u003cb>snooze\u003c/b>\u003cem>동사\u003c/em>\u003cspan>졸다, 선잠 자다\u003c/span>\u003c/div>\u003cdiv>\u003cb>end up\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>결국 ~하게 되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>poor grade\u003c/b>\u003cem>명사\u003c/em>\u003cspan>좋지 않은 성적\u003c/span>\u003c/div>\u003cdiv>\u003cb>government\u003c/b>\u003cem>명사\u003c/em>\u003cspan>정부\u003c/span>\u003c/div>\u003cdiv>\u003cb>take steps\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>조치를 취하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>demand\u003c/b>\u003cem>동사\u003c/em>\u003cspan>요구하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>push\u003c/b>\u003cem>동사\u003c/em>\u003cspan>압력을 넣다, 밀어붙이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>move back\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>늦추다, 뒤로 미루다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어도 몇 개 짚을게요. lead to는 초래하다, put at risk는 위험에 빠뜨리다, take steps는 조치를 취하다라는 뜻이에요. demand는 요구하다, move back은 늦추다로 기억해 두면 문장이 훨씬 잘 보일 거예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">believe\u003c/b>\u003cspan class=\"m\">믿다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">think\u003c/span>\u003cspan class=\"s\">consider\u003c/span>\u003cspan class=\"s\">hold\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">doubt\u003c/span>\u003cspan class=\"a\">disbelieve\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">enough\u003c/b>\u003cspan class=\"m\">충분한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">sufficient\u003c/span>\u003cspan class=\"s\">adequate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">insufficient\u003c/span>\u003cspan class=\"a\">inadequate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">expert\u003c/b>\u003cspan class=\"m\">전문가\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">specialist\u003c/span>\u003cspan class=\"s\">authority\u003c/span>\u003cspan class=\"s\">professional\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">novice\u003c/span>\u003cspan class=\"a\">amateur\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">rarely\u003c/b>\u003cspan class=\"m\">거의 ~하지 않다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">seldom\u003c/span>\u003cspan class=\"s\">hardly ever\u003c/span>\u003cspan class=\"s\">infrequently\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">often\u003c/span>\u003cspan class=\"a\">frequently\u003c/span>\u003cspan class=\"a\">always\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">poor\u003c/b>\u003cspan class=\"m\">좋지 않은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">bad\u003c/span>\u003cspan class=\"s\">weak\u003c/span>\u003cspan class=\"s\">low\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">good\u003c/span>\u003cspan class=\"a\">excellent\u003c/span>\u003cspan class=\"a\">strong\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">risk\u003c/b>\u003cspan class=\"m\">위험\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">danger\u003c/span>\u003cspan class=\"s\">hazard\u003c/span>\u003cspan class=\"s\">threat\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">safety\u003c/span>\u003cspan class=\"a\">security\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">allow\u003c/b>\u003cspan class=\"m\">허락하다, 가능하게 하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">permit\u003c/span>\u003cspan class=\"s\">let\u003c/span>\u003cspan class=\"s\">enable\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">forbid\u003c/span>\u003cspan class=\"a\">prevent\u003c/span>\u003cspan class=\"a\">prohibit\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">move back\u003c/b>\u003cspan class=\"m\">늦추다, 뒤로 미루다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">postpone\u003c/span>\u003cspan class=\"s\">delay\u003c/span>\u003cspan class=\"s\">defer\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">advance\u003c/span>\u003cspan class=\"a\">bring forward\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 함께 정리해 볼게요. believe는 think나 consider와 비슷하고, 반대로 doubt와는 반대돼요. enough는 sufficient나 adequate로 바꿔 쓸 수 있고, 반대말은 insufficient나 inadequate예요. rarely는 seldom, hardly ever와 가깝고 often과는 반대이며, poor는 bad나 weak와 비슷하지만 good이나 excellent와는 반대죠. allow는 permit, let과 가깝고 forbid나 prevent와 반대되고, move back은 delay나 postpone과 비슷하며 bring forward와 반대됩니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들은\u003c/span>\u003cspan class=\"en\">People\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">생각한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">believe \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">청소년들이 잠이 덜 필요하다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">teenagers \u003c/span>\u003cspan class=\"tgt\">need \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">less \u003c/span>\u003cspan class=\"tgt\">sleep\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 커가면서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">get \u003c/span>\u003cspan class=\"tgt\">older\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사람들은 청소년들이 커가면서 잠이 덜 필요하다고 생각한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사람들이 흔히 가지고 있는 \u003cb class=\"key\">통념\u003c/b>을 먼저 깔아 주는 도입 문장이에요. '청소년은 자라면서 잠이 덜 필요하다'는 생각이 글 전체에서 반박될 대상이라는 점을 알려 주죠. as는 '~하면서, ~할수록'이라서 나이와 잠의 필요량이 \u003cb class=\"key\">비례\u003c/b>한다는 인식이 담겨 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 명사절(목적어)\u003c/span> : believe + [that + 주어 + 동사 ~ (명사절/목적어)] : \"청소년들이 잠이 덜 필요하다고 생각한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">비교급 형용사 (little - less - least)\u003c/span> : less + [명사] (더 적은 ~) : \"더 적은 잠\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">접속사 as (시간·비례)\u003c/span> : as + 주어 + 동사 (~하면서 / ~할수록) : \"그들이 커가면서\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"People, 사람들은. believe, 생각한다. that teenagers need less sleep, 청소년들이 잠이 덜 필요하다고. as they get older, 그들이 커가면서. 이 문장 전체를 해석하면, 사람들은 청소년들이 커가면서 잠이 덜 필요하다고 생각한다.","hl":"m"},{"n":13,"text":"이 문장은 글의 통념을 깔아 주는 도입이에요. 사람들이 청소년은 자라면서 잠이 덜 필요하다고 믿는다는 거죠. 여기서 as는 ~할수록이라는 뜻이라서 나이와 잠의 필요량이 비례한다는 생각이 담겨 있어요.","hl":"mn"},{"n":14,"text":"첫 번째, believe that teenagers need less sleep에서 that은 접속사예요. 뒤에 완전한 문장이 와서 통째로 목적어 역할을 하는 명사절을 만듭니다. 두 번째, as they get older에서 as는 시간의 접속사로 ~하면서, ~할수록이라는 뜻이에요. 세 번째, less sleep은 little의 비교급 less가 sleep을 꾸며 주는 비교급 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일부는 심지어 생각한다\u003c/span>\u003cspan class=\"en\">Some even \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">think \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">밤에 6시간의 잠이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">six \u003c/span>\u003cspan class=\"tgt\">hours \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">sleep \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">night \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">청소년들에게 충분하다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">enough \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">teenagers\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">심지어 청소년들이 밤에 6 시간만 자면 충분하다고 생각하는 이들도 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 믿음을 더 세게 밀어 주는 문장이에요. even이 '심지어'라는 뜻으로 들어와서 여섯 시간이면 \u003cb class=\"key\">충분\u003c/b>하다는 생각이 꽤 퍼져 있음을 강조하죠. 이렇게 통념을 극단까지 밀어 줘야 뒤에 나오는 의사들의 \u003cb class=\"key\">경고\u003c/b>가 훨씬 강하게 들립니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 명사절(목적어)\u003c/span> : think + [that + 주어 + 동사 ~ (명사절/목적어)] : \"밤에 6시간의 잠이면 충분하다고 생각한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">시간 표현의 부사적 대격 (a = per)\u003c/span> : [숫자] + 시간 단위 + a + 시간 단위 (하룻밤에 ~) : \"하룻밤에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">형용사 + for + 대상\u003c/span> : be enough [for + 명사] (~에게 충분하다) : \"청소년들에게 충분하다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Some even think, 일부는 심지어 생각한다. that six hours of sleep a night, 밤에 6시간의 잠이. is enough for teenagers, 청소년들에게 충분하다고. 이 문장 전체를 해석하면, 심지어 청소년들이 밤에 6 시간만 자면 충분하다고 생각하는 이들도 있다.","hl":"m"},{"n":16,"text":"앞의 믿음을 더 세게 밀어 주는 문장이에요. even이 심지어라는 뜻으로 들어와서 여섯 시간이면 충분하다는 생각이 꽤 퍼져 있다는 걸 보여 주죠. 이렇게 통념을 과장해서 보여 줘야 뒤에 나오는 의사들의 경고가 더 강하게 들립니다.","hl":"mn"},{"n":17,"text":"첫 번째, think that six hours of sleep a night is enough에서 that은 접속사이고 뒤 문장 전체가 think의 목적어로 들어가는 명사절이에요. 두 번째, a night은 하룻밤이라는 명사가 아니라 밤마다, 하룻밤에라는 빈도 표현으로 쓰였어요. 세 번째, is enough for teenagers는 be enough for somebody, 즉 누구에게 충분하다라는 형용사 구문이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 믿음이\u003c/span>\u003cspan class=\"en\">This belief\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 학교들이 ~하도록 이끌어 왔다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">led \u003c/span>\u003cspan class=\"tgt\">many \u003c/span>\u003cspan class=\"tgt\">schools \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수업을 계획하도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">schedule \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">classes \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">7시 30분이나 그보다 일찍 시작하도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">start\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">7:30 \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">earlier\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아침에\u003c/span>\u003cspan class=\"en\">in the morning.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이러한 믿음이 많은 학교에서 수업을 아침 7 시 30 분이나 그보다 일찍 시작하도록 만들었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 나온 \u003cb class=\"key\">통념\u003c/b>이 실제 학교 제도까지 바꾸었다는 것을 보여 주는 문장이에요. 믿음이 등교 시각을 앞당기는 \u003cb class=\"key\">결과\u003c/b>로 이어졌다는 뜻이죠. 그래서 뒤에 나오는 의사들의 경고와 정면으로 부딪히는 근거가 되어 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">lead + 목적어 + to부정사 (목적격 보어)\u003c/span> : lead + [목적어] + [to부정사] (~가 …하도록 이끌다) : \"많은 학교들이 계획하도록 이끌어 왔다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">schedule + 목적어 + to부정사 (목적격 보어)\u003c/span> : schedule + [목적어] + [to부정사] (~가 …하도록 일정을 잡다) : \"수업이 시작되도록 계획하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">비교급 (early - earlier - earliest)\u003c/span> : or + [비교급] (~이나 그보다 더 ~한) : \"7시 30분이나 그보다 더 일찍\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"This belief, 이러한 믿음이. has led many schools, 많은 학교들이 ~하도록 이끌어 왔다. to schedule their classes, 수업을 계획하도록. to start at 7:30 or earlier, 7시 30분이나 그보다 일찍 시작하도록. in the morning, 아침에. 이 문장 전체를 해석하면, 이러한 믿음이 많은 학교에서 수업을 아침 7 시 30 분이나 그보다 일찍 시작하도록 만들었다.","hl":"m"},{"n":19,"text":"이 문장은 통념이 실제 학교 제도까지 바꿨다는 걸 보여 줘요. 믿음이 등교 시각을 앞당기는 결과로 이어졌다는 거죠. 그래서 뒤에 나오는 의사들의 경고와 정면으로 부딪히는 근거가 됩니다.","hl":"mn"},{"n":20,"text":"첫 번째, has led many schools to schedule은 lead 다음에 목적어, 그다음에 to부정사가 오는 구조예요. has led는 현재완료로 지금까지 이어진 결과를 나타냅니다. 두 번째, schedule their classes to start는 schedule 목적어 to부정사로, 수업이 시작되도록 일정을 잡는다는 뜻이에요. 세 번째, at seven thirty or earlier에서 earlier는 early의 비교급으로, 일곱 시 삼십 분이나 그보다 더 이르게라는 의미를 더해 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나\u003c/span>\u003cspan class=\"en\">However,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">의사들은 경고한다\u003c/span>\u003cspan class=\"en\">doctors \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">warn \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 사회가 빠뜨리고 있다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">society \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">putting\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">청소년들의 건강과 교육을\u003c/span>\u003cspan class=\"en\">teenagers' health and education\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">위험에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">risk\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 의사들은 우리 사회가 청소년들의 건강과 교육을 위험에 빠뜨리고 있다고 경고한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장까지 이어진 '청소년은 잠이 적어도 된다'는 통념을 정면으로 뒤집는 \u003cb class=\"key\">전환\u003c/b> 문장이에요. however 하나로 글의 흐름이 믿음에서 경고로 바뀌죠. put A at risk는 'A를 \u003cb class=\"key\">위험\u003c/b>에 빠뜨리다'라는 뜻으로, 건강과 교육 두 가지를 동시에 건드린다는 점이 핵심이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 명사절(목적어)\u003c/span> : warn + [that + 주어 + 동사 ~ (명사절/목적어)] : \"우리 사회가 ~을 빠뜨리고 있다고 경고한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재진행형\u003c/span> : be동사 + [현재분사(-ing)] : \"빠뜨리고 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사구 관용표현\u003c/span> : put + [목적어] + at risk : \"위험에 빠뜨리다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"However, 그러나. doctors warn, 의사들은 경고한다. that our society is putting, 우리 사회가 빠뜨리고 있다고. teenagers' health and education, 청소년들의 건강과 교육을. at risk, 위험에. 이 문장 전체를 해석하면, 그러나 의사들은 우리 사회가 청소년들의 건강과 교육을 위험에 빠뜨리고 있다고 경고한다.","hl":"m"},{"n":22,"text":"이 문장은 글의 방향이 확 바뀌는 자리예요. 앞에서는 청소년은 잠이 적어도 된다는 믿음을 말했는데, however로 시작하면서 의사들의 경고를 꺼내죠. 즉 앞의 통념을 정면으로 뒤집는 전환 문장이고, 건강과 교육을 동시에 위험에 빠뜨린다고 해서 문제의 심각성을 강조합니다.","hl":"mn"},{"n":23,"text":"첫 번째 어법 포인트는 warn 뒤에 온 접속사 that이에요. that절이 통째로 목적어 자리에 들어간 명사절이죠. 두 번째는 is putting, 현재진행형이에요. 지금도 계속되고 있는 상황이라 진행형으로 쓴 겁니다 \">3\u003c/span>\u003cspan class=\"tgt\">starting \u003c/span>\u003cspan class=\"tgt\">times\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 정부가 학교에 압력을 넣어 수업 시작 시간을 늦출 것을 요구한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 의사들의 요구가 한 단계 구체화되는 문장이에요. 막연히 조치를 취하라는 게 아니라 \u003cb class=\"key\">demand\u003c/b> 뒤 that절로 '학교 시작 시간을 늦추게 하라'는 내용을 분명히 밝히죠. 글의 흐름에서 \u003cb class=\"key\">해결책 \u003c/b>\u003cb class=\"key\">제시\u003c/b>에 해당하는 부분이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">demand + that절(당위성 that절, should 생략)\u003c/span> : demand + that + [주어] + [(should) + 동사원형] : \"정부가 학교를 압박하기를\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">push + 목적어 + to부정사(목적격보어)\u003c/span> : push + [목적어] + [to + 동사원형] : \"학교가 늦추도록 압력을 넣다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">현재분사(형용사적 용법)\u003c/span> : [동사-ing] + [명사] : \"시작하는 시간들, 즉 수업 시작 시간\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"They demand, 그들은 요구한다. that the government push schools, 정부가 학교에 압력을 넣어. to move back their starting times, 그들의 시작 시간을 늦추도록. 이 문장 전체를 해석하면, 그들은 정부가 학교에 압력을 넣어 수업 시작 시간을 늦출 것을 요구한다.","hl":"m"},{"n":34,"text":"의사들의 요구가 한 단계 구체화돼요. 막연히 조치를 취하라는 게 아니라, 학교 시작 시간을 실제로 늦추라고 압력을 넣으라는 겁니다. 글의 흐름에서 해결책을 제시하는 부분이에요.","hl":"mn"},{"n":35,"text":"첫 번째, demand 뒤에 오는 that절을 보세요. the government인데도 push가 그대로 동사원형이죠. 요구나 주장을 나타내는 동사 뒤에서 should가 생략되면 동사원형이 오기 때문이에요. 두 번째, push schools to move back은 push 다음에 목적어, 그다음에 to부정사가 온 목적격보어 구조예요. 밀어서 ~하게 만들다, 압력을 넣다라는 뜻이죠. 세 번째, starting은 현재분사로 뒤의 times를 꾸며서 시작하는 시간, 즉 수업 시작 시각을 뜻합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 기대한다\u003c/span>\u003cspan class=\"en\">They hope\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것이 학생들이 ~하게 해 주기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">allow \u003c/span>\u003cspan class=\"tgt\">students \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">충분한 휴식을 얻도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">get \u003c/span>\u003cspan class=\"tgt\">enough \u003c/span>\u003cspan class=\"tgt\">rest \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 공부를 더 잘하도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">better\u003c/span> in school.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 이것이 학생들이 충분한 휴식을 취하고, 공부를 더 잘할 수 있게 하리라고 기대한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞의 요구가 가져올 결과를 기대하는 마무리 문장이에요. \u003cb class=\"key\">this\u003c/b>는 바로 앞 문장 전체, 즉 시작 시간을 늦추는 일을 가리키고, 그 결과로 '충분한 휴식'과 '더 나은 성적'이라는 두 가지 이득을 제시하죠. 글 전체가 문제 제기에서 해결과 기대로 마무리되는 구조예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지시대명사 this\u003c/span> : this(단수 지시대명사) + will + 동사원형 : \"이것이 ~하게 할 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">allow + 목적어 + to부정사(목적격보어)\u003c/span> : allow + [목적어] + [to + 동사원형] : \"학생들이 ~하는 것을 가능하게 하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 병렬(and)\u003c/span> : [to + 동사원형 A] and [(to) + 동사원형 B] : \"충분한 휴식을 얻고 더 잘하도록\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"They hope, 그들은 기대한다. this will allow students, 이것이 학생들이 ~하게 해 주기를. to get enough rest, 충분한 휴식을 얻도록. and do better in school, 그리고 공부를 더 잘하도록. 이 문장 전체를 해석하면, 그들은 이것이 학생들이 충분한 휴식을 취하고, 공부를 더 잘할 수 있게 하리라고 기대한다.","hl":"m"},{"n":37,"text":"마지막 문장은 앞의 요구가 가져올 결과를 기대하는 부분이에요. 시작 시간이 늦춰지면 학생들이 충분히 자고 성적도 올라간다는 긍정적인 그림을 그립니다.","hl":"mn"},{"n":38,"text":"첫 번째, allow 뒤에 students라는 목적어가 오고 to get이 이어지죠. allow는 목적격보어로 to부정사를 데려오는 대표 동사예요. 두 번째, to get과 do가 and로 나란히 연결되어 있어요. 동사원형 두 개가 하나의 to를 함께 쓰는 병렬 구조이고, 뒤의 to는 생략된 거예요. 세 번째, 맨 앞의 this는 바로 앞 문장 전체, 그러니까 시작 시간을 늦추는 일을 가리키는 지시대명사입니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>사람들은 청소년이 커가면서 잠이 덜 필요하고 \u003cb class=\"key\">여섯 \u003c/b>\u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">수면\u003c/b>이면 충분하다고 믿는다.\u003c/li>\u003cli>이러한 믿음은 많은 학교가 수업을 아침 일곱 시 삼십 분이나 그보다 일찍 시작하는 \u003cb class=\"key\">이른 \u003c/b>\u003cb class=\"key\">등교\u003c/b>로 이어진다.\u003c/li>\u003cli>그러나 의사들은 이른 등교가 청소년의 건강과 교육을 위험에 빠뜨린다고 경고하며, 전문가들은 청소년에게 \u003cb class=\"key\">여덟 \u003c/b>\u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">반\u003c/b>의 수면이 필요하다고 말한다.\u003c/li>\u003cli>의사들은 정부가 학교의 \u003cb class=\"key\">시작 \u003c/b>\u003cb class=\"key\">시간\u003c/b>을 늦추도록 압력을 넣어, 학생들이 충분한 휴식을 취하고 공부를 더 잘하기를 기대한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Doctors warn that early school start times deprive teenagers of needed sleep and urge the government to push schools to start later.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">사람들은 청소년이 커가면서 잠이 덜 필요하다고 생각하지만, 의사들은 청소년에게 매일 \u003cb class=\"key\">여덟 \u003c/b>\u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">반\u003c/b>의 수면이 필요하다고 경고한다. 수업 시작 시간이 빨라 \u003cb class=\"key\">수면 \u003c/b>\u003cb class=\"key\">부족\u003c/b>이 생기면 학생들은 아침 수업 내내 졸고 좋지 않은 성적을 거둘 수 있어, 정부가 학교의 \u003cb class=\"key\">시작 \u003c/b>\u003cb class=\"key\">시간\u003c/b>을 늦추도록 압력을 넣어야 한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":39,"text":"오늘 글을 한 문장으로 정리하면, 청소년은 잠이 덜 필요한 것이 아니라 오히려 충분한 잠이 필요한데 이른 등교가 그 잠을 빼앗고 있다는 거예요. 사람들은 여섯 시간 수면이면 충분하다고 믿지만, 의사들은 청소년에게 여덟 시간 반의 수면이 필요하다고 말하죠. 그래서 이른 등교를 그대로 두면 건강과 교육이 위험해질 수 있으니, 정부가 학교의 시작 시간을 늦추도록 압력을 넣어야 합니다. 오늘 내용 잘 정리해 두고, 다음 글에서 또 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
