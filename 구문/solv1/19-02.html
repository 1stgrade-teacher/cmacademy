<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SO 레벨1 19강 적용독해02 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}

.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}
.lp-tag{background:#fff;border:1px solid var(--pk-b);border-radius:3px;font-weight:700;padding:2px 12px}

.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}

.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}
.lp-box{border-radius:4px;border-left:4px solid var(--pk)}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"SO 레벨1 19강 적용독해02","audioDir":"19-02_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">19강\u003cbr>적용독해02\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">SO 레벨1\u003c/div>\u003ch1>Satisfied with a Good Deal: Seeing Both Sides\u003c/h1>\u003ch2>잘된 거래: 양면을 보는 만족\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>한 사업가는 회사 주식을 모두 판 직후 주가가 크게 올랐지만, \u003cb class=\"key\">후회\u003c/b> 대신 \u003cb class=\"key\">만족\u003c/b>을 택했다. 더 벌 수도 있었지만 더 못했을 수도 있다는 양면적 사고가 만족의 근거였다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>True satisfaction comes not from the best possible result but from seeing both the better and the worse possibilities.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 읽을 지문은 한 사업가의 인터뷰 이야기예요. 회사 주식을 모두 판 직후에 주가가 크게 올랐는데도, 그는 후회하지 않고 만족한다고 말하죠. 이 글의 요지는 결과보다 그 결과를 해석하는 태도가 중요하다는 거예요. 그럼 차근차근 들어가 볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">주식 시장에서는 \u003cb class=\"key\">주가\u003c/b>(stock price)가 하루에도 몇 번씩 오르내리기 때문에, 언제 사고 언제 팔지 결정하는 일은 매우 어렵습니다. 팔고 나서 주가가 오르면 우리는 자연스럽게 \u003cb class=\"key\">기회비용\u003c/b>(opportunity cost)을 떠올리며 후회하죠. 이 지문에는 \u003cb class=\"key\">가정법 \u003c/b>\u003cb class=\"key\">과거완료\u003c/b>(past perfect subjunctive)가 나오는데, 이는 과거 사실과 반대되는 상황을 가정할 때 쓰는 표현입니다. If I had sold it later, I might have done better는 '나중에 팔았다면 더 잘할 수도 있었을 텐데'라는 뜻으로, 실제로는 그렇게 팔지 않았다는 사실을 전제로 합니다. 일상 비유로 말하면, 엘리베이터를 놓쳤을 때 다음 엘리베이터가 더 빨리 올 수도 있지만 그 안에 갇혔을 수도 있다고 생각하는 것과 같습니다. 결과는 이미 하나로 정해져 있지만 가능성은 여러 갈래이므로, \u003cb class=\"key\">만족\u003c/b>은 결과 자체가 아니라 결과를 해석하는 태도에서 나옵니다.\u003c/div>","segs":[{"n":2,"text":"주식 시장에서는 주가가 하루에도 몇 번씩 오르내리기 때문에 언제 사고팔지 결정하는 일이 참 어렵죠. 팔고 나서 주가가 오르면 우리는 자연스럽게 기회비용을 떠올리며 후회하게 됩니다. 이 지문에는 가정법 과거완료가 나오는데, 이건 과거 사실과 반대되는 상황을 가정할 때 쓰는 표현이에요. If I had sold it later, I might have done better는 나중에 팔았다면 더 잘할 수도 있었을 텐데라는 뜻이고, 실제로는 그렇게 팔지 않았다는 사실을 깔고 있죠. 일상 비유로 말하면 엘리베이터를 놓쳤을 때 다음 엘리베이터가 더 빨리 올 수도 있지만 그 안에 갇혔을 수도 있다고 생각하는 것과 같아요. 결과는 이미 하나로 정해져 있지만 가능성은 여러 갈래이기 때문에, 만족은 결과가 아니라 해석에서 나온다는 점을 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>인터뷰 속 사업가\u003csmall>도입 · 문장 1\u003c/small>\u003c/h4>\u003cp>글은 한 \u003cb class=\"key\">사업가\u003c/b>의 인터뷰를 보았다는 말로 시작합니다. 그는 최근에 회사의 \u003cb class=\"key\">주식\u003c/b>을 모두 팔아버린 사람입니다. 독자는 왜 이런 인물이 등장하는지 궁금해하게 됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>사흘 뒤의 반전\u003csmall>전환 · 문장 2–3\u003c/small>\u003c/h4>\u003cp>그런데 사흘 뒤 \u003cb class=\"key\">주가\u003c/b>가 크게 올랐습니다. 만약 그가 며칠만 \u003cb class=\"key\">기다렸다면\u003c/b> 훨씬 더 많은 돈을 벌었을 것입니다. 이 \u003cb class=\"key\">가정법 \u003c/b>\u003cb class=\"key\">과거완료\u003c/b> 표현이 독자에게 후회스러운 상황을 먼저 각인시킵니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>질문과 부정\u003csmall>반전 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>그래서 글쓴이는 그가 \u003cb class=\"key\">의기소침\u003c/b>했는지 묻습니다. 그리고 곧바로 아니라고 \u003cb class=\"key\">부정\u003c/b>하죠. 짧은 질문과 답의 대비로 독자의 예상을 한 번 뒤집는 단계입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>만족의 근거\u003csmall>주장·근거 · 문장 6–8\u003c/small>\u003c/h4>\u003cp>실제로 사업가는 \u003cb class=\"key\">만족\u003c/b>한다고 말하며 \u003cb class=\"key\">잘된 \u003c/b>\u003cb class=\"key\">거래\u003c/b>였다고 밝힙니다. 근거는 마지막 문장에 있습니다. 나중에 팔았다면 더 잘할 수도 있었지만 훨씬 더 못했을 수도 있다는 것이죠. 즉 \u003cb class=\"key\">양면\u003c/b>을 함께 보는 사고가 만족의 근거입니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"자, 이제 이 글의 흐름을 네 단계로 나누어서 살펴볼게요.","hl":null},{"n":4,"text":"먼저 글은 한 사업가의 인터뷰를 보았다는 이야기로 시작해요. 그는 회사의 주식을 전부 팔아버린 사람이죠. 독자는 왜 이런 인물이 등장하는지 궁금해하게 됩니다.","hl":"f0"},{"n":5,"text":"그런데 사흘 뒤에 주가가 크게 올랐어요. 만약 그가 며칠만 기다렸다면 훨씬 더 많은 돈을 벌었을 거예요. 여기서 가정법 과거완료가 쓰이면서 후회스러운 상황이 먼저 강조되죠.","hl":"f1"},{"n":6,"text":"그래서 글쓴이가 그에게 의기소침했는지 물어요. 그리고 곧바로 아니라고 부정하죠. 짧은 질문과 답을 대비시켜서 독자의 예상을 뒤집는 단계예요.","hl":"f2"},{"n":7,"text":"실제로 그는 만족한다고 말하고, 잘된 거래였다고 밝혀요. 나중에 팔았다면 더 잘할 수도 있었지만 훨씬 더 못했을 수도 있다는 거죠. 이렇게 양면을 함께 보는 사고가 만족의 근거가 됩니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">질문-답변\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 6번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 사업가의 상황을 제시한 뒤 \u003cb class=\"key\">질문\u003c/b>을 던지고 바로 답하는 방식으로 전개됩니다. 그는 의기소침했을까라는 물음에 아니라고 답하면서 \u003cb class=\"key\">주제\u003c/b>가 드러나죠. 핵심이 되는 만족 선언이 뒤쪽에 놓여 있으므로 \u003cb class=\"key\">미괄식\u003c/b> 구조입니다. 마지막 문장은 그 만족을 뒷받침하는 \u003cb class=\"key\">근거\u003c/b>로 쓰였습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Three days later (2)\u003c/b>\u003cspan>시간 전환\u003c/span>\u003cb>If the businessman had waited (3)\u003c/b>\u003cspan>가정법 과거완료(반사실 가정)\u003c/span>\u003cb>In fact (6)\u003c/b>\u003cspan>앞의 부정을 구체화·강조\u003c/span>\u003cb>but (8)\u003c/b>\u003cspan>양면 대조\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">sold all his stock\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the deal\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">sold it\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>후회하는 관점\u003c/th>\u003cth>만족하는 관점\u003c/th>\u003c/tr>\u003ctr>\u003ctd>더 많은 돈을 벌 수 있었음에 집중\u003c/td>\u003ctd>훨씬 더 못할 수도 있었음을 함께 봄\u003c/td>\u003c/tr>\u003ctr>\u003ctd>이미 지나간 결과에 매임\u003c/td>\u003ctd>이루어진 거래를 좋게 해석함\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 질문과 답변으로 이어지는 전개 방식이에요. 상황을 제시한 뒤 의기소침했을까 하고 물어보고, 바로 아니라고 답하면서 주제가 드러나죠. 핵심이 되는 만족 선언이 글 뒤쪽에 놓여 있으니 미괄식 구조라고 보면 됩니다. 마지막 문장은 그 만족을 뒷받침하는 근거 역할을 해요.","hl":"ty"},{"n":9,"text":"먼저 Three days later라는 표현이 시간을 넘겨 주는 신호예요. 그다음 If the businessman had waited가 나오는데, 이건 과거 사실의 반대를 가정하는 가정법 과거완료 표시죠. In fact는 앞에서 아니라고 한 말을 구체적으로 받아 주는 신호이고, 마지막의 but은 더 잘할 수도 있었다와 더 못할 수도 있었다를 나란히 놓는 대조 신호예요. 이 신호어들만 표시해도 글의 뼈대가 그대로 보입니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>see\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보다\u003c/span>\u003c/div>\u003cdiv>\u003cb>interview\u003c/b>\u003cem>명사\u003c/em>\u003cspan>인터뷰\u003c/span>\u003c/div>\u003cdiv>\u003cb>businessman\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사업가\u003c/span>\u003c/div>\u003cdiv>\u003cb>recently\u003c/b>\u003cem>부사\u003c/em>\u003cspan>최근에\u003c/span>\u003c/div>\u003cdiv>\u003cb>sell\u003c/b>\u003cem>동사\u003c/em>\u003cspan>팔다\u003c/span>\u003c/div>\u003cdiv>\u003cb>stock\u003c/b>\u003cem>명사\u003c/em>\u003cspan>주식\u003c/span>\u003c/div>\u003cdiv>\u003cb>company\u003c/b>\u003cem>명사\u003c/em>\u003cspan>회사\u003c/span>\u003c/div>\u003cdiv>\u003cb>major\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>큰, 중대한\u003c/span>\u003c/div>\u003cdiv>\u003cb>rise\u003c/b>\u003cem>명사\u003c/em>\u003cspan>상승, 증가\u003c/span>\u003c/div>\u003cdiv>\u003cb>market\u003c/b>\u003cem>명사\u003c/em>\u003cspan>시장\u003c/span>\u003c/div>\u003cdiv>\u003cb>wait\u003c/b>\u003cem>동사\u003c/em>\u003cspan>기다리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>earn\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(돈을) 벌다\u003c/span>\u003c/div>\u003cdiv>\u003cb>depressed\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>의기소침한, 우울한\u003c/span>\u003c/div>\u003cdiv>\u003cb>in fact\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>실제로, 사실은\u003c/span>\u003c/div>\u003cdiv>\u003cb>reporter\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기자\u003c/span>\u003c/div>\u003cdiv>\u003cb>ask\u003c/b>\u003cem>동사\u003c/em>\u003cspan>묻다\u003c/span>\u003c/div>\u003cdiv>\u003cb>feel about\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 대해 어떻게 느끼다(생각하다)\u003c/span>\u003c/div>\u003cdiv>\u003cb>deal\u003c/b>\u003cem>명사\u003c/em>\u003cspan>거래\u003c/span>\u003c/div>\u003cdiv>\u003cb>reply\u003c/b>\u003cem>동사\u003c/em>\u003cspan>대답하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>satisfied\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>만족하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>later\u003c/b>\u003cem>부사\u003c/em>\u003cspan>나중에, 뒤에\u003c/span>\u003c/div>\u003cdiv>\u003cb>might\u003c/b>\u003cem>조동사\u003c/em>\u003cspan>~할 수도 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>do better\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>더 잘하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>could\u003c/b>\u003cem>조동사\u003c/em>\u003cspan>~할 수도 있었다\u003c/span>\u003c/div>\u003cdiv>\u003cb>worse\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>더 나쁜, 더 못한\u003c/span>\u003c/div>\u003cdiv>\u003cb>how\u003c/b>\u003cem>부사\u003c/em>\u003cspan>어떻게\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어부터 짚어 볼게요. satisfied는 만족하는, deal은 거래라는 뜻이고요. depressed는 의기소침한, earn은 돈을 벌다라는 뜻으로 꼭 외워 두세요. reply는 대답하다라는 동사로, ask와 짝을 지어 기억하면 좋아요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">satisfied\u003c/b>\u003cspan class=\"m\">만족하는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">content\u003c/span>\u003cspan class=\"s\">pleased\u003c/span>\u003cspan class=\"s\">fulfilled\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">dissatisfied\u003c/span>\u003cspan class=\"a\">disappointed\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">major\u003c/b>\u003cspan class=\"m\">큰, 중대한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">significant\u003c/span>\u003cspan class=\"s\">considerable\u003c/span>\u003cspan class=\"s\">big\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">minor\u003c/span>\u003cspan class=\"a\">slight\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">rise\u003c/b>\ 바꿔 쓸 수 있다는 점도 함께 기억해 주세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 보았다\u003c/span>\u003cspan class=\"en\">I saw\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 사업가와의 인터뷰를\u003c/span>\u003cspan class=\"en\">an interview with a businessman\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">최근에 팔아버린\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">recently \u003c/span>\u003cspan class=\"tgt\">sold\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 회사의 모든 주식을\u003c/span>\u003cspan class=\"en\">all his stock in a company.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 최근에 한 회사의 주식을 모두 팔아버린 사업가가 인터뷰하는 것을 보았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이야기의 인물을 소개하며 글을 여는 \u003cb class=\"key\">도입\u003c/b> 문장이에요. 사업가가 '최근에' 주식을 모두 팔았다는 정보가 뒤에 나오는 \u003cb class=\"key\">주가 \u003c/b>\u003cb class=\"key\">상승\u003c/b>과 짝을 이루며 흥미를 만들죠. who had recently sold는 앞의 a businessman을 꾸미는 \u003cb class=\"key\">관계사절\u003c/b>이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 who + 과거완료\u003c/span> : [선행사 a businessman] + [[who]] + had + [[과거분사]](sold) : \"최근에 팔아버린\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거완료(대과거)\u003c/span> : had + [[과거분사]] + 목적어 : \"최근에 팔아버린\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"I saw, 나는 보았다. an interview with a businessman, 한 사업가와의 인터뷰를. who had recently sold, 최근에 팔아버린. all his stock in a company, 한 회사의 모든 주식을. 이 문장 전체를 해석하면, 나는 최근에 한 회사의 주식을 모두 팔아버린 사업가가 인터뷰하는 것을 보았다.","hl":"m"},{"n":13,"text":"이 문장은 이야기의 인물을 소개하는 도입 문장이에요. 이 사업가가 최근에 회사 주식을 전부 팔았다는 정보가 뒤에 나오는 주가 상승과 맞물리면서 흥미를 만들어요. who절은 사업가를 꾸미는 관계사절이라고 생각하시면 돼요.","hl":"mn"},{"n":14,"text":"먼저 who had recently sold를 보세요. 앞에 있는 a businessman을 뒤에서 꾸며 주는 관계대명사예요. 관계사절 안에서 who가 주어 역할을 하고 바로 뒤에 동사가 오죠. 그리고 had sold는 과거완료인데, 인터뷰를 본 시점보다 더 이전에 주식을 팔았기 때문에 시제를 한 칸 당겨 쓴 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">3일 뒤에,\u003c/span>\u003cspan class=\"en\">Three days later,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">큰 상승이 있었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">was\u003c/span> a major rise\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시장에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">market\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">3 일 뒤, 주식 시장에서 주가가 크게 올랐다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 '주식을 판 시점'에서 얼마 지나지 않아 벌어진 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">흐름\u003c/b>과 \u003cb class=\"key\">결과\u003c/b>를 보여 줘요. 사업가가 팔고 나서 곧장 시장이 올랐다는 점이 뒤의 \u003cb class=\"key\">가정법\u003c/b> 문장으로 이어지는 발판이 되죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">there be 구문(유도부사)\u003c/span> : [[There]] + be동사 + 진주어(a major rise) : \"~이 있었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 수식\u003c/span> : [명사 a rise] + [[in]] + [명사 the market] : \"시장에서(의)\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Three days later, 3일 뒤에. there was a major rise, 큰 상승이 있었다. in the market, 시장에서. 이 문장 전체를 해석하면, 3 일 뒤, 주식 시장에서 주가가 크게 올랐다.","hl":"m"},{"n":16,"text":"이 문장은 주식을 판 시점에서 얼마 지나지 않은 시간 흐름을 보여 줘요. 그 결과로 시장이 크게 올랐다는 사실을 전달하죠. 바로 이 결과가 뒤에 나오는 가정법 문장의 발판이 됩니다.","hl":"mn"},{"n":17,"text":"there was는 무엇이 존재한다는 걸 도입하는 there be 구문이에요. 동사 뒤에 있는 a major rise가 진짜 주어라는 점을 꼭 기억하세요. 그리고 in the market은 앞의 a major rise를 뒤에서 꾸며 주는 전치사구로, 명사를 수식하고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 그 사업가가 기다렸다면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">If \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">businessman \u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">waited\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단 며칠만\u003c/span>\u003cspan class=\"en\">just a few days,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 벌었을 것이다\u003c/span>\u003cspan class=\"en\">he \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">earned\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">훨씬 더 많은 돈을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">much \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">money\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 사업가가 며칠만 기다렸으면, 훨씬 더 많은 돈을 벌었을 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이미 지나간 일을 반대로 상상하는 \u003cb class=\"key\">가정법 \u003c/b>\u003cb class=\"key\">과거완료\u003c/b> 문장이에요. 남들은 '돈을 더 벌 수 있었는데'라고 아쉬워할 상황을 \u003cb class=\"key\">객관적\u003c/b>으로 짚어 주죠. 뒤에 나올 사업가의 담담한 대답과 \u003cb class=\"key\">대비\u003c/b>를 이루는 부분이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가정법 과거완료(if절)\u003c/span> : [[If]] + 주어 + had + [[과거분사]] : \"만약 그 사업가가 기다렸다면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">가정법 과거완료(주절)\u003c/span> : 주어 + [[would have]] + [[과거분사]] : \"벌었을 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">비교급 강조 much\u003c/span> : [[much]] + 비교급(more) : \"훨씬 더 많은 돈\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"If the businessman had waited, 만약 그 사업가가 기다렸다면. just a few days, 단 며칠만. he would have earned, 그는 벌었을 것이다. much more money, 훨씬 더 많은 돈을. 이 문장 전체를 해석하면, 그 사업가가 며칠만 기다렸으면, 훨씬 더 많은 돈을 벌었을 것이다.","hl":"m"},{"n":19,"text":"이 문장은 이미 지나간 일을 반대로 상상하는 문장이에요. 남들이라면 돈을 더 벌 수 있었는데 하고 아쉬워할 상황을 객관적으로 짚어 주고 있죠. 뒤에 나오는 사업가의 담담한 대답과 대비를 이루는 부분입니다.","hl":"mn"},{"n":20,"text":"먼저 if the businessman had waited는 과거 사실의 반대를 상상하는 가정법 과거완료예요. if절에는 had와 과거분사를 써서 실제로는 기다리지 않았다는 걸 드러냅니다. 그 결과는 주절에서 would have earned로 받아 주고요. 마지막으로 much more money에서 much는 비교급 more를 강조해서 훨씬이라는 뜻을 더해 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 ~였나\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Was \u003c/span>\u003cspan class=\"tgt\">he\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">의기소침했나?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">depressed\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 의기소침했을까?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 주가가 크게 올랐으니, 주식을 일찍 판 사업가가 \u003cb class=\"key\">의기소침\u003c/b>했을지 독자에게 묻는 문장이에요. 다음 문장의 ‘No’라는 답을 끌어내는 \u003cb class=\"key\">질문\u003c/b> 역할을 하죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사 의문문(도치)\u003c/span> : [Be동사] + [주어] ~? : \"그는 ~였나?\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">감정 형용사(주격 보어)\u003c/span> : [주어] + be + [감정 형용사] : \"의기소침한\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Was he, 그는 ~였나. depressed?, 의기소침했나?. 이 문장 전체를 해석하면, 그는 의기소침했을까?","hl":"m"},{"n":22,"text":"앞에서 주가가 크게 올랐으니 주식을 일찍 판 사업가가 의기소침했는지 독자에게 묻는 문장이에요. 이 질문이 바로 다음의 No라는 답을 끌어냅니다.","hl":"mn"},{"n":23,"text":"첫 번째로 Was는 be동사가 주어 앞으로 도치된 의문문을 만들고 있어요. 두 번째로 depressed는 감정 상태를 나타내는 주격 보어로, 주어 he의 상태를 설명하죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아니다,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">No\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 그렇지 않았다.\u003c/span>\u003cspan class=\"en\">he \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">wasn't\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">아니다. 그렇지 않았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞의 질문 ‘그는 의기소침했을까?’에 대해 사업가가 \u003cb class=\"key\">의기소침\u003c/b>하지 않았다고 단호히 부정하는 문장이에요. 이 짧은 \u003cb class=\"key\">부정\u003c/b>이 뒤에서 그의 만족감을 설명하는 흐름의 출발점이 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정 대답의 No\u003c/span> : No, + [주어] + [be동사] + not. : \"아니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be동사의 부정 축약형\u003c/span> : was + not = wasn't : \"그렇지 않았다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"No, 아니다. he wasn't, 그는 그렇지 않았다.. 이 문장 전체를 해석하면, 아니다. 그렇지 않았다.","hl":"m"},{"n":25,"text":"앞에서 사업가가 의기소침했는지 물었는데, 이 문장은 그렇지 않다고 분명히 부정해요. 이 부정이 뒤에서 그의 만족감을 설명하는 출발점이 됩니다.","hl":"mn"},{"n":26,"text":"첫 번째로 No는 앞 질문에 대한 부정 대답으로 쓰였어요. 두 번째로 wasn't는 he was not을 줄인 축약형이고, 앞의 be동사 의문문에 맞춰 시제와 주어를 그대로 받아 주죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">실제로 기자가 물었을 때 그가 거래에 대해 어떻게 생각하는지를 그는 답했다 “만족합니다.”\u003c/span>\u003cspan class=\"en\">In fact, \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">reporter \u003c/span>\u003cspan class=\"tgt\">asked\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">felt \u003c/span>\u003cspan class=\"tgt\">about \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">deal\u003c/span>, he replied, &quot;I'm satisfied.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">실제로 기자가 거래에 대해 어떻게 생각하는지를 물었을 때, 그는 “만족합니다.”라고 답했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 주가가 더 오른 뒤에도 사업가는 후회하지 않고 \u003cb class=\"key\">만족\u003c/b>한다고 말하는 장면이에요. ‘In fact’는 앞의 예상과 달리 실제 반응을 강조하며, \u003cb class=\"key\">직접 \u003c/b>\u003cb class=\"key\">인용\u003c/b>으로 그의 태도를 생생하게 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간 부사절 when\u003c/span> : when + [주어] + [동사] ~ : \"기자가 물었을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">간접의문문(의문사 + 주어 + 동사)\u003c/span> : how + [주어] + [동사] ~ : \"그가 거래에 대해 어떻게 생각하는지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">직접화법(인용문)\u003c/span> : replied, &quot;[인용문]&quot; : \"“만족합니다.”\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"In fact, 실제로. when a reporter asked, 기자가 물었을 때. how he felt about the deal, 그가 거래에 대해 어떻게 생각하는지를. he replied, 그는 답했다. \"I'm satisfied.\", “만족합니다.”. 이 문장 전체를 해석하면, 실제로 기자가 거래에 대해 어떻게 생각하는지를 물었을 때, 그는 “만족합니다.”라고 답했다.","hl":"m"},{"n":28,"text":"주가가 더 오른 뒤에도 사업가는 후회하지 않고 만족한다고 말하는 장면이에요. In fact는 앞의 예상과 달리 실제 반응을 강조하고, 직접 인용은 그의 태도를 생생하게 보여 줍니다.","hl":"mn"},{"n":29,"text":"첫 번째로 when은 접속사로 쓰여 ‘~할 때’라는 시간을 나타내는 부사절을 이끌어요. 두 번째로 how he felt about the deal은 의문사 how 뒤에 주어 he와 동사 felt가 온 간접의문문으로, 기자가 물은 내용을 asked의 목적어로 담고 있죠. 세 번째로 I'm satisfied는 replied 뒤에 직접화법으로 그대로 인용되어 사업가의 실제 발화를 전달합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 거래는\u003c/span>\u003cspan class=\"en\">The deal\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">좋은 거래였다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">good \u003c/span>\u003cspan class=\"tgt\">one\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">잘된 거래였어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사업가가 자신의 거래를 스스로 평가하며 만족하는 이유를 제시하는 문장이에요. 여기서 \u003cb class=\"key\">one\u003c/b>은 앞의 deal을 반복하지 않으려고 쓴 대명사이고, \u003cb class=\"key\">a \u003c/b>\u003cb class=\"key\">good \u003c/b>\u003cb class=\"key\">one\u003c/b>은 ‘좋은 거래’라는 명사구 역할을 합니다. 그래서 ‘그 거래는 잘된 거래였다’라는 뜻으로, 뒤에 이어지는 만족의 근거가 돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">2형식 동사와 주격 보어\u003c/span> : The deal [was] + [a good one (주격 보어)] : \"~이었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">대명사 one(앞 명사 반복 회피)\u003c/span> : a good + [one (앞의 셀 수 있는 명사 대신)] : \"좋은 거래\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"The deal, 그 거래는. was a good one, 좋은 거래였다. 이 문장 전체를 해석하면, 잘된 거래였어요.","hl":"m"},{"n":31,"text":"이 문장은 사업가가 왜 만족하는지 그 이유를 밝혀 주는 문장이에요. 여기서 one은 앞에 나온 deal을 다시 말하지 않기 위해 쓴 대명사이고, a good one 전체가 좋은 거래라는 뜻을 만들어요. 그래서 The deal was a good one은 그 거래는 잘된 거래였다는 자기 평가가 됩니다.","hl":"mn"},{"n":32,"text":"먼저 was 뒤에 a good one이 와서 주어 The deal의 상태를 보충하는 주격 보어 역할을 해요. 그래서 The deal was a good one은 그 거래가 좋은 거래였다는 뜻이 됩니다. 두 번째로 a good one에서 one은 앞의 deal을 반복하지 않으려고 쓴 대명사예요. 이렇게 one을 쓰면 문장이 간결해지고, a good one 전체가 좋은 거래라는 명사구로 남습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내가 그것을 나중에 팔았더라면,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">If \u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">sold \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">later\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 더 잘했을 수도 있었다,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">might \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">done \u003c/span>\u003cspan class=\"tgt\">better\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 나는 또한 훨씬 더 못했을 수도 있었지요.\u003c/span>\u003cspan class=\"en\">but I also \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">could \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">done \u003c/span>\u003cspan class=\"tgt\">much \u003c/span>\u003cspan class=\"tgt\">worse\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나중에 팔았다면, 더 잘 할 수도 있었겠지만, 훨씬 더 못했을 수도 있지요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 과거에 다른 선택을 했을 때의 결과를 상상하며, 더 좋았을 수도 있고 더 나빴을 수도 있었다고 말하는 문장이에요. 여기에는 \u003cb class=\"key\">가정법 \u003c/b>\u003cb class=\"key\">과거완료\u003c/b>가 쓰여 과거 사실의 반대를 가정하고, could have done은 \u003cb class=\"key\">과거 \u003c/b>\u003cb class=\"key\">가능성\u003c/b>을 나타냅니다. 이 말은 후회 대신 현재의 \u003cb class=\"key\">만족\u003c/b>을 지키려는 사업가의 태도를 뒷받침해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가정법 과거완료(if절)\u003c/span> : If + 주어 + had + p.p., 주어 + might/could + have + p.p. : \"내가 그것을 나중에 팔았더라면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 + have p.p.(과거 가능성)\u003c/span> : might + have + p.p. : \"더 잘했을 수도 있었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">could + have + p.p.(과거 가능성)\u003c/span> : could + have + p.p. : \"훨씬 더 못했을 수도 있었다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"If I had sold it later, 내가 그것을 나중에 팔았더라면. I might have done better, 나는 더 잘했을 수도 있었다. but I also could have done much worse, 그러나 나는 또한 훨씬 더 못했을 수도 있었지요.. 이 문장 전체를 해석하면, 나중에 팔았다면, 더 잘 할 수도 있었겠지만, 훨씬 더 못했을 수도 있지요.","hl":"m"},{"n":34,"text":"이 문장은 가정법 과거완료를 써서 다른 선택의 결과가 더 좋았을 수도 있고 더 나빴을 수도 있었음을 말해요. 즉 그는 후회에 빠지지 않고 만족을 유지하는 태도를 보여 주죠. could have done은 과거 가능성을 나타내는 표현이에요.","hl":"mn"},{"n":35,"text":"첫 번째로 If I had sold it later는 과거 사실의 반대를 가정하는 가정법 과거완료예요. if절에 had p.p.가 쓰였고, 뒤에는 조동사 have p.p.가 와서 과거의 결과를 나타냅니다. 두 번째로 I might have done better에서 might have p.p.는 더 잘했을 수도 있다는 가능성을 표현해요. 세 번째로 could have done much worse에서 could have p.p.는 능력이 아니라 과거 가능성을 나타내므로 훨씬 더 못했을 수도 있었다고 해석합니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>사업가는 회사 \u003cb class=\"key\">주식\u003c/b>을 모두 판 직후 시장에서 큰 상승이 일어난 상황에 놓였다.\u003c/li>\u003cli>만약 조금만 \u003cb class=\"key\">기다렸다면\u003c/b> 훨씬 더 많은 돈을 벌었을 것이므로, 누구라면 후회할 만한 상황이었다.\u003c/li>\u003cli>그러나 그는 \u003cb class=\"key\">의기소침\u003c/b>하지 않고 오히려 거래에 \u003cb class=\"key\">만족\u003c/b>한다고 말했다.\u003c/li>\u003cli>더 잘할 수도 있었지만 더 못했을 수도 있다는 \u003cb class=\"key\">양면\u003c/b>적 사고가 만족의 근거였다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>True satisfaction comes not from the best possible result but from seeing both the better and the worse possibilities.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">한 사업가는 회사 주식을 모두 판 직후 주가가 크게 올랐지만, \u003cb class=\"key\">후회\u003c/b> 대신 \u003cb class=\"key\">만족\u003c/b>을 택했다. 더 벌 수도 있었지만 더 못했을 수도 있다는 양면적 사고가 만족의 근거였다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":36,"text":"오늘 글은 팔고 나서 주가가 오른 상황에서도 만족한다고 말한 사업가의 이야기였어요. 더 잘할 수도 있었지만 더 못할 수도 있었다는 양면적 사고가 핵심이죠. 여러분도 결과 하나에 매달리기보다 가능성을 함께 보는 태도를 가져 보면 좋겠어요. 오늘 수업도 끝까지 잘 따라와 주셔서 고맙습니다.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
