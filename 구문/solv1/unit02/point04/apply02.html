=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">이 글을 읽기 전에 먼저 이해해야 할 개념은 바로 무인 항공 시스템(Unmanned Aerial System)과 이에 대한 기술적 신뢰도(Technological Reliability)입니다. 흔히 우리는 자율주행 자동차나 드론처럼 인간의 개입 없이 작동하는 인공지능 기술이 완벽한 안전을 보장할 것이라고 기대하곤 하죠. 하지만 실제로는 기술적 오류뿐만 아니라 예기치 못한 상황에서 시스템이 멈추는 시스템 결함(System Failure) 문제가 발생할 수 있는데, 이는 마치 컴퓨터가 &#39;응답 없음&#39; 상태에 빠지는 것과 비슷한 원리예요. 따라서 이 지문은 인간의 조종 없이 오직 최첨단 기술(Latest Technology)에만 의존했을 때 발생할 수 있는 잠재적 위험과 아이러니를 다루고 있습니다. 결국, 완벽해 보이는 기술 뒤에 숨겨진 인간의 통제력 상실(Loss of Human Control)에 대한 두려움이 이 글의 핵심적인 맥락이 된답니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01상황 제시</div><ul><li>시카고 오헤어 공항에서 이륙한 비스타 항공의 특별한 비행이 시작된다.</li><li>비스타 항공(Vista Airlines)의 첫 완전 자동 비행</li><li>조종사와 승무원이 없는 무인 시스템 도입</li><li>핵심 키워드: 비스타 항공(Vista Airlines), 무인 시스템(unmanned system)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02기술의 강조</div><ul><li>기내 방송은 인간의 실수를 배제한 최신 기술의 완벽함을 강조한다.</li><li>인간의 실수(human error) 가능성 원천 차단</li><li>최신 기술(latest technology)에 의한 완벽한 승객 서비스 제공</li><li>핵심 키워드: 인간의 실수(human error), 최신 기술(latest technology)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03신뢰의 균열</div><ul><li>완벽함을 자신하던 기내 방송이 반복되는 오류를 일으키며 긴장감을 조성한다.</li><li>모든 비상 상황에 대한 철저한 대비 언급</li><li>기계의 오작동을 암시하는 음성 반복(go wrong)</li><li>핵심 키워드: 오작동(malfunction), 비상 상황(emergency)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">take off</td><td class=\"m\">이륙하다, 떠나다</td></tr><tr><td class=\"w\">come over</td><td class=\"m\">(방송이나 장치를 통해) 들려오다, 전달되다</td></tr><tr><td class=\"w\">aboard</td><td class=\"m\">탑승한, 기내에</td></tr><tr><td class=\"w\">controlled</td><td class=\"m\">통제되는, 제어되는</td></tr><tr><td class=\"w\">possibility</td><td class=\"m\">가능성, 기회</td></tr><tr><td class=\"w\">human error</td><td class=\"m\">인적 오류, 사람의 실수</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">take care of</td><td class=\"m\">~을 책임지다, ~을 처리하다</td></tr><tr><td class=\"w\">the very latest</td><td class=\"m\">최신의, 가장 최근의</td></tr><tr><td class=\"w\">relax</td><td class=\"m\">긴장을 풀다, 휴식을 취하다</td></tr><tr><td class=\"w\">emergency</td><td class=\"m\">비상사태, 위급 상황</td></tr><tr><td class=\"w\">prepare for</td><td class=\"m\">~을 대비하다, ~을 준비하다</td></tr><tr><td class=\"w\">go wrong</td><td class=\"m\">잘못되다, 실패하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">비행기가 이륙할 때</span><span class=\"en\"><b><span class=\"grammar-hl\">As the airplane took off</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">시카고 오헤어 공항으로부터</span><span class=\"en\"><b>from Chicago’s O’Hare Airport,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한 목소리가 나왔다</span><span class=\"en\"><b>a voice came</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">확성기를 통해</span><span class=\"en\"><b>over the loudspeaker:</b></span></div></div><div class=\"lec-sent-ko\">(비행기가 시카고 오헤어 공항에서 이륙할 때, 스피커에서 소리가 흘러나왔다.)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 비행의 시작을 알리며, 곧이어 들려올 안내 방송의 상황적 배경을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">As the airplane took off 접속사(As) + 주어(the airplane) + 동사(took off) 구조의 부사절입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">신사 숙녀 여러분,</span><span class=\"en\"><b>“Ladies and gentlemen,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">비스타 항공에 탑승하신 것을 환영합니다.</span><span class=\"en\"><b><span class=\"grammar-hl\">welcome aboard</span> Vista Airlines.</b></span></div></div><div class=\"lec-sent-ko\">(신사 숙녀 여러분, 비스타 항공에 탑승하신 걸 환영합니다.)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 안내 방송이 일반적인 기내 방송과 다름을 암시하며, 승객들의 주의를 집중시키는 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">welcome aboard (관용표현): &#39;~에 탑승하신 것을 환영합니다&#39;라는 의미로 사용되는 정형화된 인사 표현입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">aboard</td><td class=\"m\">탑승한, 기내에</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것은 특별한 비행입니다.</span><span class=\"en\"><b><span class=\"grammar-hl\">This is a special flight</span>.</b></span></div></div><div class=\"lec-sent-ko\">이번 비행은 특별합니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 안내 방송이 일반적인 기내 방송과 다름을 암시하며, 승객들의 주의를 집중시키는 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">This is a special flight 2형식 구조: 주어(This) + 동사(is) + 주격보어(a special flight)로 구성된 문장입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것은 첫 번째 비행입니다</span><span class=\"en\"><b>It is <span class=\"grammar-hl\">the first flight</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">완전히 컴퓨터에 의해 조종되는</span><span class=\"en\"><b><span class=\"grammar-hl\">that is controlled</span> completely by a computer.</b></span></div></div><div class=\"lec-sent-ko\">이번 비행은 완전히 컴퓨터로만 조종되는 최초의 비행입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 기내 안내 방송의 핵심 내용으로, 인간 조종사가 없는 자동화된 비행임을 밝혀 앞으로 전개될 상황의 긴장감을 조성합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the first flight that is controlled (관계대명사(that)): 앞의 명사(the first flight)를 수식하는 주격 관계대명사절입니다. 뒤에 동사(is controlled)가 바로 이어지며, that은 절 내에서 주어 역할을 합니다.</div><div class=\"lec-gr-item\">is controlled (수동태): be동사(is) + p.p.(controlled) 구조입니다. control은 타동사인데 목적어가 없어서 수동구조 is controlled 형태로 씁니다. 기본구조: control + O(목적어) + (부사).</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">controlled</td><td class=\"m\">통제되는, 제어되는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">가능성이 전혀 없습니다</span><span class=\"en\"><b><span class=\"grammar-hl\">There is no possibility</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인간의 실수라는</span><span class=\"en\"><b><span class=\"grammar-hl\">of human error</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">조종사나 승무원이 탑승하지 않았기 때문에</span><span class=\"en\"><b><span class=\"grammar-hl\">because there is no pilot or crew aboard</span>.</b></span></div></div><div class=\"lec-sent-ko\">기내에는 조종사나 승무원이 한 명도 탑승하지 않았기 때문에 사람이 실수할 가능성은 전혀 없습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 조종사가 없다는 앞 문장의 사실이 승객에게 안전하다는 논리로 이어지게끔 설명하는 대목입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">There is no possibility of human error 유도부사(There) + 동사(is) + 주어(no possibility) 구조의 1형식 문장입니다.</div><div class=\"lec-gr-item\">because there is no pilot or crew aboard 접속사(because) + 주어(there) + 동사(is) 구조의 이유를 나타내는 부사절입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">aboard</td><td class=\"m\">탑승한, 기내에</td></tr><tr><td class=\"w\">possibility</td><td class=\"m\">가능성, 기회</td></tr><tr><td class=\"w\">human error</td><td class=\"m\">인적 오류, 사람의 실수</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여러분의 모든 필요는</span><span class=\"en\"><b>All of your needs</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">처리될 것입니다</span><span class=\"en\"><b><span class=\"grammar-hl\">will be taken care of</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아주 최신식 기술에 의해</span><span class=\"en\"><b>by the very latest technology.</b></span></div></div><div class=\"lec-sent-ko\">여러분에게 필요한 모든 것은 최신식 기술로 처리될 것입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 인적 서비스의 부재를 기술적 완벽함으로 대체하겠다는 방송의 논리입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">will be taken care of (수동태): be동사(will be) + p.p.(taken) 구조입니다. &#39;take care of&#39;는 &#39;take care of + O(목적어)&#39;라는 타동사구(구동사)인데 목적어가 주어로 올라가면서 수동구조 will be taken care of가 됩니다. 기본구조: take care of + O(목적어).</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">the very latest</td><td class=\"m\">최신의, 가장 최근의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그냥 편히 쉬고</span><span class=\"en\"><b><span class=\"grammar-hl\">Just relax</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분의 비행을 즐기십시오.</span><span class=\"en\"><b><span class=\"grammar-hl\">and enjoy your flight</span>.</b></span></div></div><div class=\"lec-sent-ko\">그냥 편히 비행을 즐기십시오.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 승객에게 안심하고 비행을 즐기라는 권유를 통해, 기술에 대한 완벽한 신뢰를 강조하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Just relax and enjoy your flight (명령문): 주어(You)가 생략된 동사원형(relax, enjoy)으로 시작하는 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">relax</td><td class=\"m\">긴장을 풀다, 휴식을 취하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">가능한 모든 비상사태는</span><span class=\"en\"><b>Every possible emergency</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">대비되어 있습니다</span><span class=\"en\"><b><span class=\"grammar-hl\">is prepared for</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 어떤 것도 잘못될 리 없습니다</span><span class=\"en\"><b>and nothing can possibly go wrong</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">... 잘못될 리가</span><span class=\"en\"><b>... go wrong</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">... 잘못될 리가”</span><span class=\"en\"><b>... go wrong ...”</b></span></div></div><div class=\"lec-sent-ko\">일어날 수 있는 모든 비상사태에 대한 대비가 되어 있으며, 어떤 것도 잘못될 수가 없습니다 … 잘못될 수가 … 잘못될 수가 …”</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 기술에 대한 과도한 확신을 보여주다가, 마지막에 방송이 반복되며 오류를 일으키는 모습으로 바뀌면서 기술의 완벽함에 대한 의구심을 극대화합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is prepared for (수동태): be동사(is) + p.p.(prepared) 구조입니다. &#39;prepare for&#39;는 &#39;prepare for + O(목적어)&#39;의 구조를 가지는 타동사구인데, 목적어가 주어로 올라가면서 수동구조 is prepared for가 됩니다. 기본구조: prepare for + O(목적어).</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">emergency</td><td class=\"m\">비상사태, 위급 상황</td></tr><tr><td class=\"w\">go wrong</td><td class=\"m\">잘못되다, 실패하다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>최첨단 자동화 기술을 자랑하며 출발한 비스타 항공의 특별 비행 안내 방송이 시작된다.</li><li>조종사 없는 완벽한 자동 조종 시스템이라며 인간의 실수 가능성을 전면 차단한다.</li><li>모든 서비스가 최첨단 기술로 제공되니 안심하고 즐기라는 안내가 이어진다.</li><li>하지만 방송 마지막에 기계적 오류로 보이는 반복 현상이 나타나며 기술의 완벽성에 대한 공포를 암시한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">An automated flight claims to be perfectly safe through advanced technology, but it reveals the terrifying reality of potential system failure.</div>\n              <div class=\"lec-final-sum-ko\">자동화된 비행은 첨단 기술을 통해 완벽하게 안전하다고 주장하지만, 시스템 실패의 가능성이라는 공포스러운 현실을 드러낸다.</div></div></div>"],"segs":[[{"audio":"./apply02_audio/1.mp3","hl":null}],[{"audio":"./apply02_audio/2.mp3","hl":null}],[{"audio":"./apply02_audio/3.mp3","hl":null},{"audio":"./apply02_audio/4.mp3","hl":"stage-0"},{"audio":"./apply02_audio/5.mp3","hl":"stage-1"},{"audio":"./apply02_audio/6.mp3","hl":"stage-2"}],[{"audio":"./apply02_audio/7.mp3","hl":null}],[{"audio":"./apply02_audio/8.mp3","hl":"main"},{"audio":"./apply02_audio/9.mp3","hl":"meaning"},{"audio":"./apply02_audio/10.mp3","hl":"grammar"}],[{"audio":"./apply02_audio/11.mp3","hl":"main"},{"audio":"./apply02_audio/12.mp3","hl":"meaning"},{"audio":"./apply02_audio/13.mp3","hl":"grammar"}],[{"audio":"./apply02_audio/14.mp3","hl":"main"},{"audio":"./apply02_audio/15.mp3","hl":"meaning"},{"audio":"./apply02_audio/16.mp3","hl":"grammar"}],[{"audio":"./apply02_audio/17.mp3","hl":"main"},{"audio":"./apply02_audio/18.mp3","hl":"meaning"},{"audio":"./apply02_audio/19.mp3","hl":"grammar"}],[{"audio":"./apply02_audio/20.mp3","hl":"main"},{"audio":"./a
