NtNvTXqxCoJz6npn/AB6Dkc8cgHqKO+O/p79PTt7evI6U4qepIwT/AHh1Pbk9fr17ZphIBPQHv8wx064B7e/OPoMve/l+Gy/yX/DD5W+jXnbTfq3std/xQpxxgf8A6z/nr7k8DgGff+uOOPpwKMemCCcZBGOg657H1PH4chSp+YgdAeflI4HrnBPA3Z7c9M0R3Xm1v6rvsa2i48q1tFdVdPRq7a0u7X29ep//2Q==\" alt=\"\"></div>","<div class=\"lec-cover-title\">How Edison’s Light Bulb Reduced Our Sleeping Hours<small>에디슨의 전구가 우리의 수면 시간을 줄인 방식</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">본격적으로 글을 읽기 전에, 전등의 발명(Invention of light bulb)이 인류의 수면 패턴에 미친 영향을 이해할 필요가 있어요. 과거에는 해가 지면 자연스럽게 잠자리에 들었지만, 에디슨의 전구 발명 이후 인간은 생체 리듬(Circadian rhythm)을 인위적으로 조절할 수 있게 되었답니다. 이는 단순히 밤을 밝히는 것을 넘어, 현대 사회가 24시간 돌아가는 산업화(Industrialization) 체제로 급격히 전환되는 계기가 되었죠. 마치 스마트폰의 등장이 현대인의 수면 시간을 뺏어간 것처럼, 당시 전등의 보급은 밤이라는 개념을 재정의하며 우리 생활 양식을 근본적으로 변화(Fundamental change)시켰다는 점을 염두에 두고 읽어보세요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01에디슨의 수면 철학</div><ul><li>에디슨은 수면을 부정적으로 보았으며 스스로 짧은 수면을 실천했다.</li><li>하루 4시간의 짧은 수면(sleep) 실천</li><li>잠을 많이 자는 사람들을 낮게 평가함(looked down on)</li><li>핵심 키워드: 수면 시간(sleeping hours)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02전구의 발명과 영향</div><ul><li>에디슨은 자신의 신념을 바탕으로 텅스텐 전구를 발명하여 수면 문화를 변화시켰다.</li><li>1913년 텅스텐 전구(tungsten light bulb) 도입</li><li>빛의 발명으로 수면 시간 단축의 계기 마련</li><li>핵심 키워드: 발명가(inventor)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03수면 시간의 변화와 현대의 현실</div><ul><li>전구의 도입 이후 인류의 평균 수면 시간은 유의미하게 감소하였다.</li><li>발명 전 평균 수면 시간: 9.5시간</li><li>현대인 평균 수면 시간: 8시간</li><li>핵심 키워드: 평균(average)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04수면 시간의 손실</div><ul><li>현대인은 과거에 비해 매년 상당한 수면 시간을 잃어버리고 있다.</li><li>하루 1.5시간의 수면 감소</li><li>연간 총 547시간의 수면 손실(less sleep) 발생</li><li>핵심 키워드: 강요된 감소(forced to sleep less)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">inventor</td><td class=\"m\">발명가, 고안자</td></tr><tr><td class=\"w\">look down on</td><td class=\"m\">~을 깔보다, ~을 얕보다</td></tr><tr><td class=\"w\">sleepyhead</td><td class=\"m\">잠이 많은 사람, 잠꾸러기</td></tr><tr><td class=\"w\">curse</td><td class=\"m\">저주, 재앙</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">introduce</td><td class=\"m\">도입하다, 소개하다</td></tr><tr><td class=\"w\">on average</td><td class=\"m\">평균적으로</td></tr><tr><td class=\"w\">force</td><td class=\"m\">강요하다, 억지로 시키다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">토머스 에디슨은,</span><span class=\"en\"><b>Thomas Edison,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">발명왕인,</span><span class=\"en\"><b>the king of inventors,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">비난받을 수 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">could be blamed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리로부터 잠을 빼앗아 간 것에 대해.</span><span class=\"en\"><b>for <span class=\"grammar-hl\">taking sleep away from us</span>.</b></span></div></div><div class=\"lec-sent-ko\">발명왕인 토머스 에디슨은 우리한테서 잠을 빼앗아 간 것에 대해 비난받을 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 글 전체의 주제를 도입합니다. 에디슨이 발명한 어떤 것이 현대인의 수면 습관에 부정적인 영향을 미쳤다는 인과관계를 설정하며 글을 시작합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">could be blamed (수동태): 조동사(could) + be + p.p.(blamed) 구조. blame은 타동사인데 목적어가 없어서 수동구조 be blamed 형태로 쓴다. 기본구조: blame A on B(A를 B의 탓으로 돌리다) 또는 blame A for B(A를 B의 이유로 비난하다).</div><div class=\"lec-gr-item\">taking sleep away from us (동명사): 전치사(for)의 목적어 자리에 쓰인 동명사(taking)구이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">inventor</td><td class=\"m\">발명가, 고안자</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 하루에 4시간씩 잤고</span><span class=\"en\"><b>He <span class=\"grammar-hl\">slept</span> four hours a day</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">잠꾸러기들을 경멸했다.</span><span class=\"en\"><b>and <span class=\"grammar-hl\">looked down on</span> sleepyheads.</b></span></div></div><div class=\"lec-sent-ko\">그는 하루에 4시간씩 잤고, 잠꾸러기들을 경멸했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급된 에디슨의 태도를 구체적인 일화로 뒷받침합니다. 그가 왜 수면을 줄이는 문화를 퍼뜨렸는지 그의 개인적인 신념을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">slept (관용표현): sleep four hours a day는 &#39;하루에 4시간을 자다&#39;라는 시간을 나타내는 일반적인 구문이다.</div><div class=\"lec-gr-item\">looked down on (관용표현): look down on은 &#39;무시하다, 경시하다&#39;라는 뜻의 구동사이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sleepyhead</td><td class=\"m\">잠이 많은 사람, 잠꾸러기</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 믿었다</span><span class=\"en\"><b>He believed</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하루 8시간 넘게 자는 것이</span><span class=\"en\"><b>that <span class=\"grammar-hl\">sleeping more than eight hours a day</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">잘못된 것이라고.</span><span class=\"en\"><b>was wrong.</b></span></div></div><div class=\"lec-sent-ko\">그는 하루에 8시간 이상 자는 것은 잘못된 것이라고 믿었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에 이어 그가 가진 수면에 대한 편협한 가치관을 강조합니다. 이러한 신념이 결국 그가 발명품을 만들게 된 근본적인 동기가 되었음을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">sleeping more than eight hours a day (동명사): that절 내부에서 주어 역할을 하는 동명사구(sleeping ~)이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">저주로서 그 사람들에 대한</span><span class=\"en\"><b>As a curse <span class=\"grammar-hl\">on those people</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">잠자는 것을 좋아하는,</span><span class=\"en\"><b><span class=\"grammar-hl\">who like to sleep</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는 발명했다</span><span class=\"en\"><b>he invented</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">텅스텐 전구를.</span><span class=\"en\"><b>the tungsten light bulb.</b></span></div></div><div class=\"lec-sent-ko\">자는 것을 좋아하는 사람들에 대한 저주로 그는 텅스텐 전구를 발명했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞의 신념이 에디슨의 행동으로 구체화된 예시입니다. 그가 전구를 발명한 목적이 단지 편리함을 위해서가 아니라, 수면 시간을 줄이려는 의도가 담겨 있었음을 비유적으로 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">on those people who like to sleep (관계대명사): 주격 관계대명사(who)가 이끄는 절이 앞의 명사(those people)를 수식한다. 관계대명사 who 뒤에는 동사(like)가 바로 이어지며 주어 자리가 비어 있는 불완전한 구조이다.</div><div class=\"lec-gr-item\">to sleep (to부정사): 앞의 동사(like)의 목적어로 쓰인 명사적 용법의 to부정사이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">curse</td><td class=\"m\">저주, 재앙</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">전구가 그에 의해 1913년에 도입되기 전까지,</span><span class=\"en\"><b>Until the light bulb <span class=\"grammar-hl\">was introduced</span> by him in 1913,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들은 대개 잤다</span><span class=\"en\"><b>people usually slept</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하루 평균 9시간 30분을.</span><span class=\"en\"><b>an average of nine and a half hours a day.</b></span></div></div><div class=\"lec-sent-ko\">1913년 그에 의해서 전구가 도입될 때까지, 사람들은 대개 하루 평균 9시간 30분씩 잠을 잤다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 전구 발명 전후의 상황을 대비시킵니다. 전구가 도입되기 이전의 자연스러운 수면 패턴을 보여주며, 이후 발생할 변화의 기준점을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was introduced (수동태): be동사(was) + p.p.(introduced) 구조. introduce는 타동사인데 목적어가 없어서 수동구조 was introduced 형태로 쓴다. 기본구조: introduce O(목적어) to B(O를 B에게 소개하다/도입하다).</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">introduce</td><td class=\"m\">도입하다, 소개하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">오늘날,</span><span class=\"en\"><b>Today,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들은 잔다</span><span class=\"en\"><b>people sleep</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">평균 8시간을.</span><span class=\"en\"><b>eight hours <span class=\"grammar-hl\">on average</span>.</b></span></div></div><div class=\"lec-sent-ko\">오늘날 사람들은 평균 8시간을 잔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 수치와 비교하여 전구 보급 이후 실질적으로 수면 시간이 줄어들었음을 객관적인 지표로 확인시켜 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">on average (관용표현): &#39;평균적으로&#39;라는 뜻을 가진 관용구이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">on average</td><td class=\"m\">평균적으로</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 강요받고 있다</span><span class=\"en\"><b>We <span class=\"grammar-hl\">are being forced</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하루에 1시간 반씩 덜 자도록,</span><span class=\"en\"><b><span class=\"grammar-hl\">to sleep</span> one and a half hours less a day,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">일 년에 총 547시간을.</span><span class=\"en\"><b>a total of 547 hours a year.</b></span></div></div><div class=\"lec-sent-ko\">우리는 하루 1시간 30분씩 일 년에 총 547 시간을 어쩔 수 없이 덜 자고 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 에디슨의 발명이 현대인에게 미친 구체적인 결과이자 결론입니다. 개별적인 시간이 모여 큰 수치가 됨을 보여줌으로써, 기술이 인간의 삶을 통제하게 되었음을 시사합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are being forced to sleep (수동태): 현재진행 수동태(be+being+p.p.) 구조. force는 타동사로 force+O+toV(5형식) 구조인데 목적어가 주어로 올라가 수동구조 be forced가 되고, toV는 그대로 남는다. 기본구조: force A to V(A에게 V하도록 강요하다).</div><div class=\"lec-gr-item\">to sleep (to부정사): 5형식 문장의 수동태 전환 후 남은 목적격 보어 자리의 to부정사이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">force</td><td class=\"m\">강요하다, 억지로 시키다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>에디슨은 잠을 적게 자는 것을 미덕으로 여긴 인물이었다.</li><li>그는 자신의 신념에 따라 잠을 줄이기 위해 텅스텐 전구를 발명했다.</li><li>전구의 보급 이후 인류의 평균 수면 시간은 현저하게 줄어들었다.</li><li>결과적으로 우리는 기술 발전으로 인해 강제적인 수면 단축을 겪게 되었다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Thomas Edison viewed sleep negatively and promoted his light bulb, which subsequently led to a significant reduction in the average person&#39;s daily sleep time.</div>\n              <div class=\"lec-final-sum-ko\">토머스 에디슨은 잠을 부정적으로 보며 전구를 보급했고, 이는 결과적으로 사람들의 일일 평균 수면 시간을 크게 감소시켰다.</div></div></div>"],"segs":[[{"audio":"./apply01_audio/1.mp3","hl":null}],[{"audio":"./apply01_audio/2.mp3","hl":null}],[{"audio":"./apply01_audio/3.mp3","hl":null},{"audio":"./apply01_audio/4.mp3","hl":"stage-0"},{"audio":"./apply01_audio/5.mp3","hl":"stage-1"},{"audio":"./apply01_audio/6.mp3","hl":"stage-2"},{"audio":"./apply01_audio/7.mp3","hl":"stage-3"}],[{"audio":"./apply01_audio/8.mp3","hl":null}],[{"audio":"./apply01_audio/9.mp3","hl":"main"},{"audio":"./apply01_audio/10.mp3","hl":"meaning"},{"audio":"./apply01_audio/11.mp3","hl":"grammar"}],[{"audio":"./apply01_audio/12.mp3","hl":"main"},{"audio":"./apply01_audio/13.mp3","hl":"meaning"},{"audio":"./apply01_audio/14.mp3","hl":"grammar"}],[{"audio":"./apply01_audio/15.mp3","hl":"main"},{"audio":"./apply01_audio/16.mp3","hl":"meaning"},{"audio":"./apply01_audio/17.mp3","hl":"grammar"}],[{"audio":"./apply01_audio/18.mp3","hl":"main"},{"audio":"./apply01_audio/19.mp3","hl":"meaning"},{"audio":"./apply01_audio/20.mp3","hl":"grammar"}],[{"audio":"./apply01_audio/21.mp3","hl":"main"},{"audio":"./apply01_audio/22.mp3","hl":"meaning"},{"audio":"./apply01_audio/23.mp3","hl":"grammar"}],[{"audio":"./apply01_audio/24.mp3","hl":"main"},{"audio":"./apply01_audio/25.mp3","hl":"meaning"},{"audio":"./apply01_audio/26.mp3","hl":"grammar"}],[{"audio":"./apply01_audio/27.mp3","hl":"main"},{"audio":"./apply01_audio/28.mp3","hl":"meaning"},{"audio":"./apply01_audio/29.mp3","hl":"grammar"}],[{"audio":"./apply01_audio/30.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.
