/n6+3fLHztIHoemPTp/nHr2wXbhnqPzGOf8P857Byec44PfIwRjkdxjpk4A698VTbvF30vFv0ultr36kSaaaTUpbLrZpp28tk3b80f//Z\" alt=\"\"></div>","<div class=\"lec-cover-title\">The Hidden Truth Behind a Deceptive Recommendation<small>기만적인 추천서 뒤에 숨겨진 진실</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">추천서(Letter of Recommendation)는 특정 인물의 능력이나 성품을 보증하기 위해 작성하는 공식 문서로, 주로 채용이나 진학 과정에서 객관적인 평가 기준으로 활용되곤 해요. 하지만 이 지문처럼 행간의 의미를 파악해야 하는 글을 이해하려면 문학적 기법인 복선(Foreshadowing)과 반전(Twist)의 개념을 알면 좋은데, 이는 작가가 의도적으로 앞부분에 모순된 정보를 심어두어 독자로 하여금 결말에서 예상치 못한 충격을 느끼게 만드는 장치예요. 마치 영화에서 주인공이 겉으로는 친절해 보이지만 실제로는 숨겨진 의도가 있는 것과 비슷하죠. 특히 이 글에서는 추천서의 격식 있는 형식을 빌려 비판적인 메시지를 감추는 역설적인 방식을 취하고 있는데, 읽는 이가 문장을 선택적으로 해석하게 함으로써 진실을 드러내는 흥미로운 서술 기법이 사용되었답니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01표면적인 긍정적 평가</div><ul><li>한센 씨에 대한 추천서의 첫 번째 본문은 그의 성실함과 능력을 매우 높게 평가하고 있다.</li><li>근무 중 낭비 없는 태도와 집중력 발휘</li><li>업무 마감 기한 준수와 뛰어난 직무 지식</li><li>핵심 키워드: 추천서(Recommendation), 성실함(Hard-working)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02절대적 신뢰의 표명</div><ul><li>작성자는 한센 씨가 대체 불가능한 최고의 인재임을 강조한다.</li><li>나쁜 습관이 전혀 없는 완벽한 직원</li><li>타인으로 대체되어서는 안 될 존재로 묘사</li><li>핵심 키워드: 최고의 인재(Best worker), 대체 불가능(Irreplaceable)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03반전의 단서 제공</div><ul><li>추천서 하단에 첨부된 짧은 메모를 통해 앞선 내용과는 다른 진실이 드러난다.</li><li>한센 씨가 옆에 있는 상황에서 작성됨</li><li>특정 줄(1, 3, 5, 7)만 읽어야 진짜 의견을 알 수 있음</li><li>핵심 키워드: 반전(Twist), 진실(True opinion)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04숨겨진 부정적 평가</div><ul><li>지시대로 1, 3, 5, 7행만 연결해서 읽으면 한센 씨에 대한 작성자의 실제 속마음이 나타난다.</li><li>“When I’ve found him working hard, he seldom spends his time, he has no bad habits, he should never be replaced.” (원문 해석의 왜곡된 실체)</li><li>실제로 이 문장들을 조합하면 그의 업무 태도에 대한 비판적 메시지가 숨겨져 있음</li><li>핵심 키워드: 숨겨진 의미(Hidden meaning), 실제 평가(Real evaluation)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">work with</td><td class=\"m\">~와 함께 일하다, ~와 협력하다</td></tr><tr><td class=\"w\">waste time</td><td class=\"m\">시간을 낭비하다</td></tr><tr><td class=\"w\">seldom</td><td class=\"m\">좀처럼 ~않는, 드물게</td></tr><tr><td class=\"w\">on time</td><td class=\"m\">정각에, 시간에 맞추어</td></tr><tr><td class=\"w\">be impressed by</td><td class=\"m\">~에 깊은 인상을 받다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">be called</td><td class=\"m\">~라고 불리다, ~로 여겨지다</td></tr><tr><td class=\"w\">be replaced by</td><td class=\"m\">~로 대체되다, ~로 교체되다</td></tr><tr><td class=\"w\">sit beside</td><td class=\"m\">~의 옆에 앉다</td></tr><tr><td class=\"w\">true opinion</td><td class=\"m\">진심, 진실된 의견</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">추천장</span><span class=\"en\"><b><span class=\"grammar-hl\">Letter of Recommendation</span></b></span></div></div><div class=\"lec-sent-ko\">(추천장)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞부분의 추천서 내용을 시작하며, 글쓴이가 한센 씨의 근면함을 칭찬하고 있음을 보여줍니다. 사무적인 환경에서 자신의 업무에만 몰입하는 태도를 강조하여 그를 성실한 직원으로 묘사하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Letter of Recommendation (관용표현): 추천서라는 의미로 쓰이는 명사구이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Hansen 씨와 일하면서,</span><span class=\"en\"><b><span class=\"grammar-hl\">When working with Mr. Hansen</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저는 그가 ~하는 모습을 늘 보아왔는데</span><span class=\"en\"><b>I’ve always <span class=\"grammar-hl\">found him</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자기책상에서 열심히 일하며</span><span class=\"en\"><b><span class=\"grammar-hl\">working</span> hard at his desk</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">시간을 낭비하거나</span><span class=\"en\"><b>without <span class=\"grammar-hl\">wasting time</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또는</span><span class=\"en\"><b>or</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 사람들과 잡담하는 일 없이</span><span class=\"en\"><b><span class=\"grammar-hl\">chatting</span> with other people</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사무실에서.</span><span class=\"en\"><b>in the office.</b></span></div></div><div class=\"lec-sent-ko\">Hansen 씨와 일하면서, 저는 그가 사무실에서 시간을 낭비하거나 다른 사람들과 잡담하는 일 없이 자기책상에서 열심히 일하는 모습을 늘 보아왔습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞부분의 추천서 내용을 시작하며, 글쓴이가 한센 씨의 근면함을 칭찬하고 있음을 보여줍니다. 사무적인 환경에서 자신의 업무에만 몰입하는 태도를 강조하여 그를 성실한 직원으로 묘사하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">When working with Mr. Hansen (분사구문): 접속사(When) + 주어(I) + be동사(am) + 현재분사(working)가 축약된 형태이다. 부사적 기능으로 ‘그와 함께 일할 때’라는 의미를 가진다.</div><div class=\"lec-gr-item\">found him working 5형식(SVOC) 구조: find + O + OC(현재분사) 형태이다. 목적어(him)가 어떤 동작(working)을 하고 있음을 발견했다는 의미이다.</div><div class=\"lec-gr-item\">working hard (현재분사): 앞에 있는 목적어(him)의 상태를 설명하는 목적보어 역할을 하며, 목적어와 능동 관계에 있다.</div><div class=\"lec-gr-item\">wasting time (동명사): 전치사(without)의 목적어로 쓰인 명사적 용법이다.</div><div class=\"lec-gr-item\">chatting (동명사): 전치사(without)의 목적어 자리에 병렬 구조로 연결된 명사적 용법이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 좀처럼 ~하지 않는데</span><span class=\"en\"><b>He <span class=\"grammar-hl\">seldom</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">시간을 낭비하며</span><span class=\"en\"><b>spends his time</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">쓸데없는 일에는.</span><span class=\"en\"><b>on useless things.</b></span></div></div><div class=\"lec-sent-ko\">그는 쓸데없는 일에는 좀처럼 시간을 낭비하지 않습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이전 문장에서 언급한 성실함을 뒷받침하며, 그가 생산적인 활동에만 집중하는 효율적인 인물임을 부각하는 내용입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">seldom (도치): 부정어구(seldom)가 문두에 올 경우 주어와 동사의 위치가 바뀌는 도치가 발생할 수 있으나, 이 문장에서는 일반적인 어순을 따르고 있다. 빈도부사로서 동사 spends 앞에 위치했다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">seldom</td><td class=\"m\">좀처럼 ~않는, 드물게</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 늘</span><span class=\"en\"><b>He always</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">일을 마치며</span><span class=\"en\"><b><span class=\"grammar-hl\">finishes</span> his work</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">제 시간에.</span><span class=\"en\"><b>on time.</b></span></div></div><div class=\"lec-sent-ko\">늘 제 시간에 일을 마칩니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 한센 씨의 업무 처리 능력을 구체적으로 제시합니다. 시간 엄수를 통해 그가 동료들에게 신뢰를 줄 수 있는 책임감 있는 사람이라는 점을 강조하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">finishes (현재시제): 주어(He)가 3인칭 단수이므로 동사에 -es를 붙인 형태이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">on time</td><td class=\"m\">정각에, 시간에 맞추어</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 전혀 없는</span><span class=\"en\"><b>He has absolutely no</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나쁜 버릇도</span><span class=\"en\"><b>bad habits,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">없으며,</span><span class=\"en\"><b>and</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저는 감동 받는데</span><span class=\"en\"><b>I <span class=\"grammar-hl\">am impressed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그의 해박한</span><span class=\"en\"><b>by his deep</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자기 분야에 대한 지식에.</span><span class=\"en\"><b>knowledge of his field.</b></span></div></div><div class=\"lec-sent-ko\">나쁜 버릇도 전혀 없으며, 자기 분야에 대한 그의 해박한 지식에 저는 감동 받습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 한센 씨의 인성과 전문성을 동시에 치켜세우는 대목입니다. 그가 흠잡을 데 없는 인격과 전문가로서의 역량을 모두 갖추었음을 역설합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">am impressed (수동태): be동사(am) + p.p.(impressed) 구조이다. impress는 타동사(A에게 깊은 인상을 주다)인데 뒤에 목적어가 없어서 수동구조로 쓴다. 기본 능동구조: impress A (A에게 깊은 인상을 주다).</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">저는 생각하는데</span><span class=\"en\"><b>I think</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그가 단연코 ~될 수 있다고</span><span class=\"en\"><b>he <span class=\"grammar-hl\">can surely be</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">불릴 수 있다고</span><span class=\"en\"><b><span class=\"grammar-hl\">called</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가장 우수한 직원이라고.</span><span class=\"en\"><b>our best worker.</b></span></div></div><div class=\"lec-sent-ko\">그는 단연코 가장 우수한 직원이라고 할 수 있을 것입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 나열한 성실함과 전문성에 근거하여 한센 씨를 조직 내 최우수 인재로 인정하는 결론을 내리고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">can surely be called (수동태): 조동사(can) + be + p.p.(called) 구조이다. call은 타동사(A를 B라고 부르다)인데 목적어가 없어서 수동구조가 되었다. 기본 능동구조: call A B (A를 B라고 부르다).</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">be called</td><td class=\"m\">~라고 불리다, ~로 여겨지다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 절대 ~되어서는 안 되는데</span><span class=\"en\"><b>He <span class=\"grammar-hl\">should never be</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">교체되어서는</span><span class=\"en\"><b><span class=\"grammar-hl\">replaced</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 사람으로.</span><span class=\"en\"><b>by anyone else.</b></span></div></div><div class=\"lec-sent-ko\">절대 다른 사람으로 교체되어서는 안 됩니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 회사에서 한센 씨가 갖는 대체 불가능한 가치를 강조하며, 강력한 추천의 의지를 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">should never be replaced (수동태): 조동사(should) + be + p.p.(replaced) 구조이다. replace는 타동사(A를 B로 교체하다)인데 목적어가 없어서 수동구조로 쓴다. 기본 능동구조: replace A with B (A를 B로 교체하다).</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">be replaced by</td><td class=\"m\">~로 대체되다, ~로 교체되다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">지점장</span><span class=\"en\"><b><span class=\"grammar-hl\">Branch Manager</span></b></span></div></div><div class=\"lec-sent-ko\">지점장</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 추천서의 작성자가 책임 있는 위치에 있는 사람임을 명시하여 글의 공신력을 높이는 장치입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Branch Manager (관용표현): 지점장을 뜻하는 직함 명사구이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">또 다른 글이</span><span class=\"en\"><b>(A second note <span class=\"grammar-hl\">followed</span> this letter.)</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이어졌다</span><span class=\"en\"></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 추천장 뒤에.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">(이 추천장 뒤에 또 다른 글이 이어졌다.)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 본문 뒤에 반전이 있음을 예고하는 안내 문구로, 앞서 작성된 추천서가 진실이 아닐 수 있음을 암시하며 글의 분위기를 전환합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">followed (과거분사): 명사(note)를 뒤에서 수식하며 &#39;뒤따르는&#39;이라는 의미를 갖는다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Hansen 씨가 옆에 앉아 있었는데</span><span class=\"en\"><b>MR. HANSEN <span class=\"grammar-hl\">WAS SITTING</span> BESIDE ME</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">제가 오늘 귀사에 보낼 이 추천장을 작성하고 있을 때.</span><span class=\"en\"><b><span class=\"grammar-hl\">WHEN I WAS WRITING</span> THE LETTER FOR YOU TODAY.</b></span></div></div><div class=\"lec-sent-ko\">제가 오늘 귀사에 보낼 이 추천장을 작성하고 있을 때 Hansen 씨가 옆에 앉아 있었습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 추천서가 강요된 상황에서 작성되었음을 알리며, 겉으로 드러난 내용과 실제 속마음이 다를 수밖에 없었던 배경을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">WAS SITTING (과거진행): be동사(was) + 현재분사(sitting) 구조로 과거의 특정 시점에 진행 중이던 동작을 나타낸다.</div><div class=\"lec-gr-item\">WHEN I WAS WRITING (관계부사): 문장에서 시간을 나타내는 부사절을 이끌며, I WAS WRITING은 과거진행 시제이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 11 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">1, 3, 5, 7행만 읽어주세요</span><span class=\"en\"><b><span class=\"grammar-hl\">READ ONLY LINES 1, 3, 5, AND 7</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Hansen 씨에 대한 저의 진짜 생각을 아시려면.</span><span class=\"en\"><b>FOR MY TRUE OPINION OF HIM.</b></span></div></div><div class=\"lec-sent-ko\">Hansen 씨에 대한 저의 진짜 생각을 아시려면 1, 3, 5, 7행만 읽어주세요.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 추천서의 행을 건너뛰어 읽게 함으로써, 사실은 그를 부정적으로 평가하고 있음을 반전의 방식으로 드러내는 핵심 지시 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">READ ONLY LINES 1, 3, 5, AND 7 (도치): 강조를 위해 목적어구(ONLY LINES...)가 동사(READ) 앞으로 도치되어 강조구문과 유사한 효과를 준다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">true opinion</td><td class=\"m\">진심, 진실된 의견</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 12 / 12</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">지점장</span><span class=\"en\"><b><span class=\"grammar-hl\">Branch Manager</span></b></span></div></div><div class=\"lec-sent-ko\">지점장</div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Branch Manager (관용표현): 지점장을 의미하는 직함이다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>지점장이 한센 씨의 성실함과 능력을 칭찬하며 최고의 직원으로 추천하는 글을 썼다.</li><li>하지만 이는 한센 씨가 바로 옆에 있었기 때문에 어쩔 수 없이 쓴 거짓 내용이었다.</li><li>뒤이어 붙은 쪽지를 통해, 실제로는 추천서의 특정 줄만 골라 읽어야 진심을 알 수 있다고 반전의 메시지를 전한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The manager initially provides a positive recommendation to save face, but clarifies his true disapproval through selective reading instructions.</div>\n              <div class=\"lec-final-sum-ko\">관리자는 체면을 위해 처음에 긍정적인 추천서를 제공하지만, 선택적 읽기 지시를 통해 자신의 실제 불만족을 분명히 밝힌다.</div></div></div>"],"segs":[[{"audio":"./apply03_audio/1.mp3","hl":null}],[{"audio":"./apply03_audio/2.mp3","hl":null}],[{"audio":"./apply03_audio/3.mp3","hl":null},{"audio":"./apply03_audio/4.mp3","hl":"stage-0"},{"audio":"./apply03_audio/5.mp3","hl":"stage-1"},{"audio":"./apply03_audio/6.mp3","hl":"stage-2"},{"audio":"./apply03_audio/7.mp3","hl":"stage-3"}],[{"audio":"./apply03_audio/8.mp3","hl":null}],[{"audio":"./apply03_audio/9.mp3","hl":"main"},{"audio":"./apply03_audio/10.mp3","hl":"meaning"},{"audio":"./apply03_audio/11.mp3","hl":"grammar"}],[{"audio":"./apply03_audio/12.mp3","hl":"main"},{"audio":"./apply03_audio/13.mp3","hl":"meaning"},{"audio":"./apply03_audio/14.mp3","hl":"grammar"}],[{"audio":"./apply03_audio/15.mp3","hl":"main"},{"audio":"./apply03_audio/16.mp3","hl":"meaning"},{"audio":"./apply03_audio/17.mp3","hl":"grammar"}],[{"audio":"./apply03_audio/18.mp3","hl":"main"},{"audio":"./apply03_audio/19.mp3","hl":"meaning"},{"audio":"./apply03_audio/20.mp3","hl":"grammar"}],[{"audio":"./apply03_a
