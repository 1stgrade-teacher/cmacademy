tic Ocean) 침몰</li><li>구명정(lifeboats) 부족으로 인한 생존자 선택의 문제 발생</li><li>핵심 키워드: 타이타닉(Titanic), 생존(survival)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02사회적 계급에 따른 생존율</div><ul><li>승객의 생존 여부는 의외로 개인의 사회적 계급(social class)에 의해 결정되었다.</li><li>1등석 승객의 사망률은 매우 낮은 3% 수준</li><li>2등석과 3등석의 사망률은 각각 16%, 45%로 급격히 증가</li><li>핵심 키워드: 사회적 계급(social class), 사망률(drowned)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03차별적인 구조 조치</div><ul><li>구조 과정에서 계급에 따라 극명한 차별적 대우가 행해졌다.</li><li>1등석 승객 전원에게 구명정 탑승 기회 제공</li><li>3등석 승객은 갑판 아래에 머물도록 강요받음</li><li>일부 승객은 총구(gunpoint) 위협을 받으며 통제됨</li><li>핵심 키워드: 구조 기회(opportunity), 차별(discrimination)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sink</td><td class=\"m\">가라앉다, 침몰하다</td></tr><tr><td class=\"w\">available</td><td class=\"m\">이용 가능한, 구할 수 있는</td></tr><tr><td class=\"w\">contrary to</td><td class=\"m\">~와는 반대로, ~에 반하여</td></tr><tr><td class=\"w\">be based on</td><td class=\"m\">~에 근거하다, ~에 기초하다</td></tr><tr><td class=\"w\">passenger</td><td class=\"m\">승객, 탑승객</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">drown</td><td class=\"m\">익사하다, 물에 빠져 죽다</td></tr><tr><td class=\"w\">opportunity</td><td class=\"m\">기회, 호기</td></tr><tr><td class=\"w\">below deck</td><td class=\"m\">갑판 아래에, 선실 내부에</td></tr><tr><td class=\"w\">at gunpoint</td><td class=\"m\">총구를 겨누고, 총으로 위협하여</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">1912년 어느 날 밤에,</span><span class=\"en\"><b>One night in 1912,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">타이타닉 호가</span><span class=\"en\"><b>the Titanic</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가라앉았다</span><span class=\"en\"><b><span class=\"grammar-hl\">sank</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">대서양 속으로</span><span class=\"en\"><b>into the Atlantic Ocean.</b></span></div></div><div class=\"lec-sent-ko\">1912년 어느 날 밤, 타이타닉 호가 대서양에 가라앉았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 글의 배경이 되는 사건을 제시합니다. 대서양 한복판에서 발생한 재난이라는 상황을 설정하여 이후 이어질 구조 과정의 불평등함을 강조하기 위한 도입부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">sank (자동사): 문장의 주어인 the Titanic이 스스로 가라앉는 동작을 수행하므로 능동태로 쓰였습니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이용 가능한 구명보트의 수가</span><span class=\"en\"><b>Since the number of lifeboats <span class=\"grammar-hl\">available</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매우 적었기 때문에,</span><span class=\"en\"><b>was very small,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">승무원들은</span><span class=\"en\"><b>the crew</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">결정해야 했다</span><span class=\"en\"><b>had <span class=\"grammar-hl\">to decide</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">누가 살아남을지를</span><span class=\"en\"><b><span class=\"grammar-hl\">who would survive</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 누가 죽을지를</span><span class=\"en\"><b>and <span class=\"grammar-hl\">who would die</span>.</b></span></div></div><div class=\"lec-sent-ko\">이용할 수 있는 구명보트의 수가 매우 적었기 때문에, 승무원들은 누가 살아남고 누가 죽을지를 결정해야 했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 침몰 사고라는 상황에서 발생한 구체적인 문제 상황을 보여줍니다. 구조 장비가 턱없이 부족했기에 누군가는 희생되어야만 했던 비극적인 선택의 순간을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">available 현재분사(축약 관계절): &#39;available&#39;은 &#39;which were available&#39;에서 관계대명사+be동사가 생략된 형태로, 앞에 있는 명사구 &#39;the number of lifeboats&#39;를 수식하는 형용사적 기능입니다.</div><div class=\"lec-gr-item\">to decide (to부정사): &#39;had to&#39;의 목적어로서 &#39;결정해야 했다&#39;는 의미의 명사적 용법으로 쓰였습니다.</div><div class=\"lec-gr-item\">who would survive (간접의문문): &#39;decide&#39;라는 타동사의 목적어 절로 쓰였으며, 의문사(who)+주어(who)+동사(would survive)의 어순을 취합니다.</div><div class=\"lec-gr-item\">who would die (간접의문문): 앞선 &#39;who would survive&#39;와 대구를 이루며 &#39;decide&#39;의 목적어 역할을 하는 명사절입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">available</td><td class=\"m\">이용 가능한, 구할 수 있는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신이 예상할지도 모르는 것과는 반대로,</span><span class=\"en\"><b>Contrary to <span class=\"grammar-hl\">what you might expect</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 결정은</span><span class=\"en\"><b>the decision</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">근거했다</span><span class=\"en\"><b><span class=\"grammar-hl\">was based on</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사회적 계층에</span><span class=\"en\"><b>social class.</b></span></div></div><div class=\"lec-sent-ko\">당신이 기대하는 것과 반대로, 그 결정은 사회적 계층을 바탕으로 이루어졌다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 구조의 기준이 도덕적 우선순위가 아닌 계급이라는 차별적 요소였음을 밝히며 글의 핵심 논지를 드러냅니다. 독자가 가졌을 법한 &#39;구조의 공정함&#39;에 대한 통념을 반전시키는 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">what you might expect (관계대명사): &#39;what&#39;은 &#39;~하는 것&#39;이라는 뜻의 선행사를 포함한 관계대명사로, 전치사 &#39;to&#39;의 목적어 역할을 하는 명사절을 이끕니다.</div><div class=\"lec-gr-item\">was based on (수동태): be동사(was)+p.p.(based) 구조입니다. &#39;base&#39;는 타동사인데 목적어가 없어 수동구조로 썼으며, 기본구조는 &#39;base A on B (A를 B에 근거시키다)&#39;입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">contrary to</td><td class=\"m\">~와는 반대로, ~에 반하여</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">탑승한 1,500명의 승객 중,</span><span class=\"en\"><b>Of the 1,500 passengers <span class=\"grammar-hl\">on board</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">1등 칸 승객의 단지 3퍼센트만이</span><span class=\"en\"><b>only three percent of the first-class passengers</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">익사했다,</span><span class=\"en\"><b>drowned,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">반면 2등 칸의 16퍼센트와</span><span class=\"en\"><b>while 16 percent of the second-class</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">3등 칸 승객의 45퍼센트가</span><span class=\"en\"><b>and 45 percent of the third-class passengers</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">죽었다</span><span class=\"en\"><b>died</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">얼음처럼 차가운 물속에서</span><span class=\"en\"><b>in the ice-cold water.</b></span></div></div><div class=\"lec-sent-ko\">배에 타고 있던 1,500명의 승객 중, 1등 칸 승객은 3%만 물에 빠져 죽은 반면, 2등 칸은 16%, 3등 칸 승객의 45%가 차가운 바닷물에서 죽었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 주장을 뒷받침하는 구체적인 수치 데이터입니다. 계급이 낮을수록 사망 확률이 급격히 높아지는 비인도적인 구조 현황을 통계로 입증합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">on board (관용표현): &#39;승선 중인&#39;이라는 뜻의 전치사구로, 앞의 명사 &#39;passengers&#39;를 후치 수식합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">passenger</td><td class=\"m\">승객, 탑승객</td></tr><tr><td class=\"w\">drown</td><td class=\"m\">익사하다, 물에 빠져 죽다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">1등 칸 구역의 모든 승객들은</span><span class=\"en\"><b>All the passengers in the first-class section</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">받았다</span><span class=\"en\"><b><span class=\"grammar-hl\">were given</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">기회를</span><span class=\"en\"><b>the opportunity</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">구명보트에 탈,</span><span class=\"en\"><b><span class=\"grammar-hl\">to get</span> into a lifeboat,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 3등 칸 구역의 사람들은</span><span class=\"en\"><b>but those in the third-class section</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">명령받았다</span><span class=\"en\"><b><span class=\"grammar-hl\">were ordered</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">갑판 아래에 머물라고,</span><span class=\"en\"><b><span class=\"grammar-hl\">to stay</span> below deck,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들 중 일부는</span><span class=\"en\"><b><span class=\"grammar-hl\">some of them</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">총구가 겨눠진 채로</span><span class=\"en\"><b><span class=\"grammar-hl\">at gunpoint</span>.</b></span></div></div><div class=\"lec-sent-ko\">모든 1등 칸 승객에게는 구명보트를 탈 기회가 주어졌지만, 3등 칸에 있던 사람들은 갑판 밑에 그대로 있으라는 명령을 받았다, 일부는 총구가 겨눠진 채로.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 제시한 사망률 차이의 원인을 보여주는 실제 사례입니다. 1등석 승객을 우선시한 구조 관행과 3등석 승객을 강압적으로 제압하여 구조에서 배제했던 구체적인 상황을 묘사합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">were given (수동태): be동사(were)+p.p.(given) 구조입니다. &#39;give&#39;는 타동사로 &#39;give+O(간접목적어)+O(직접목적어)&#39;의 4형식 구조인데, 간접목적어가 주어로 올라가면서 수동태가 되었고 직접목적어인 &#39;the opportunity&#39;가 그대로 남은 형태입니다.</div><div class=\"lec-gr-item\">to get (to부정사): 앞에 있는 명사 &#39;the opportunity&#39;를 수식하는 형용사적 용법으로, &#39;할 기회&#39;라는 의미를 가집니다.</div><div class=\"lec-gr-item\">were ordered to stay (수동태): be동사(were)+p.p.(ordered) 구조입니다. &#39;order&#39;는 &#39;order+O+toV&#39;의 5형식 구조인데, 목적어가 주어로 이동하여 수동태가 되고 보어인 to부정사가 남은 구조입니다.</div><div class=\"lec-gr-item\">some of them at gunpoint (분사구문): &#39;some of them being at gunpoint&#39;에서 주어와 be동사가 생략된 축약형태이며, 원래 절로 변환하면 &#39;while they were at gunpoint&#39;으로 해석될 수 있는 부사적 기능입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">passenger</td><td class=\"m\">승객, 탑승객</td></tr><tr><td class=\"w\">opportunity</td><td class=\"m\">기회, 호기</td></tr><tr><td class=\"w\">below deck</td><td class=\"m\">갑판 아래에, 선실 내부에</td></tr><tr><td class=\"w\">at gunpoint</td><td class=\"m\">총구를 겨누고, 총으로 위협하여</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>1912년 타이타닉호 침몰 당시, 구명보트 부족으로 인해 구조 대상 선별이 필요했다.</li><li>구조의 기준은 평등하지 않았으며, 철저히 사회적 계급에 따라 결정되었다.</li><li>계급이 낮을수록 사망률이 현저히 높았으며, 3등석 승객들은 강압적인 배제 속에 놓였다.</li><li>이 비극적 사건은 재난 상황에서조차 사회적 계급이 생존의 결정적 요인이었음을 보여준다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The Titanic sinking resulted in vastly different survival rates across social classes, because the crew prioritized first-class passengers while restricting the third-class.</div>\n              <div class=\"lec-final-sum-ko\">타이타닉 침몰은 사회 계급에 따라 생존율에 큰 차이를 가져왔는데, 이는 승무원들이 1등석 승객을 우선시하고 3등석 승객을 제한했기 때문이다.</div></div></div>"],"segs":[[{"audio":"./apply02_audio/1.mp3","hl":null}],[{"audio":"./apply02_aud
