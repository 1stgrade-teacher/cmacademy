iv>","<div class=\"lec-cover-title\">The Cycle of Kindness: How Giving Saves Lives<small>친절의 순환: 나눔이 생명을 구하는 방법</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">우리가 살아가면서 헌혈(Blood donation)을 하는 것은 단순히 남을 돕는 행위를 넘어, 일종의 &#39;생명 보험&#39;과 같은 역할을 합니다. 특히 패트리샤처럼 희귀 혈액형(Rare blood type)을 가진 경우, 의료 기관은 국가 희귀 혈액 기증자 등록소(National Rare Donor Registry)를 통해 전국의 재고를 실시간으로 확인하고 관리하는 시스템을 활용하게 되죠. 이는 마치 &#39;온라인 클라우드에 데이터를 백업해 두는 것&#39;과 비슷해서, 언제 어디서 발생할지 모르는 응급 상황에 대비해 내 혈액을 안전하게 보관했다가 필요할 때 다시 찾는 과정이라고 이해하시면 됩니다. 헌혈은 이처럼 우리 사회가 &#39;서로의 생명을 보호하기 위해 연결된 안전망&#39;을 유지하는 아주 중요한 사회적 상부상조 시스템입니다. 오늘 지문은 바로 이 시스템 덕분에 헌혈했던 본인의 피가 다시 본인을 살리는 기적 같은 순간을 보여주며, 우리 모두가 잠재적 기증자이자 수혜자가 될 수 있음을 시사합니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01희귀 혈액형과 이동</div><ul><li>희귀 혈액형을 가진 패트리샤 웨스트는 평소 지역 혈액원에 헌혈을 해왔으나, 플로리다에서 미시간으로 이주하게 되었다.</li><li>희귀 혈액형(rare blood type) 보유자 패트리샤</li><li>고향 플로리다에서 미시간(Michigan)으로 거주지 이전</li><li>핵심 키워드: 희귀 혈액형(rare blood type)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02예기치 못한 사고와 위기</div><ul><li>미시간에서 교통사고를 당해 긴급 수술을 받던 중 과다 출혈이 발생했으나, 해당 지역에서 그녀의 혈액형을 찾을 수 없었다.</li><li>길을 건너다 차에 치이는 사고(hit by a car) 발생</li><li>응급 수술(emergency surgery) 중 과다 출혈</li><li>미시간 내에 일치하는 혈액이 없는 위기 상황</li><li>핵심 키워드: 과다 출혈(bleed heavily)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03긴급 수색과 발견</div><ul><li>국립 희귀 기증자 등록소에 구조 요청을 보낸 결과, 플로리다에서 기적적으로 필요한 혈액을 확보하였다.</li><li>전국적인 긴급 요청(desperate call) 발송</li><li>국립 희귀 기증자 등록소(National Rare Donor Registry)의 대응</li><li>플로리다에서 필요한 혈액 확인</li><li>핵심 키워드: 희귀 기증자 등록소(Rare Donor Registry)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04기적적인 생존</div><ul><li>발견된 혈액의 정체는 과거 패트리샤 본인이 플로리다에서 기증했던 자신의 혈액이었다.</li><li>발견된 혈액은 패트리샤가 수개월 전 기증한 자신의 것(own blood)</li><li>과거의 헌혈이 생명을 구하는 결과로 이어짐</li><li>헌혈의 가치를 증명하며 환자가 생존함</li><li>핵심 키워드: 헌혈(donated)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">rare</td><td class=\"m\">드문, 희귀한</td></tr><tr><td class=\"w\">donate</td><td class=\"m\">기부하다, 기증하다</td></tr><tr><td class=\"w\">hit</td><td class=\"m\">치다, 부딪히다</td></tr><tr><td class=\"w\">emergency</td><td class=\"m\">비상사태, 응급 상황</td></tr><tr><td class=\"w\">surgery</td><td class=\"m\">수술, 외과</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">bleed</td><td class=\"m\">피를 흘리다, 출혈하다</td></tr><tr><td class=\"w\">heavily</td><td class=\"m\">심하게, 대량으로</td></tr><tr><td class=\"w\">surgeon</td><td class=\"m\">외과 의사</td></tr><tr><td class=\"w\">desperate</td><td class=\"m\">절박한, 필사적인</td></tr><tr><td class=\"w\">available</td><td class=\"m\">이용 가능한, 구할 수 있는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Patricia West는</span><span class=\"en\"><b>Patricia West</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">희귀한 혈액형 때문에</span><span class=\"en\"><b>has a rare blood type,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">요청을 늘 받았는데</span><span class=\"en\"><b>so she <span class=\"grammar-hl\">was always asked</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">헌혈을 하라는</span><span class=\"en\"><b><span class=\"grammar-hl\">to donate</span> blood</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신이 사는 고장의 혈액은행으로부터</span><span class=\"en\"><b>by her local blood bank.</b></span></div></div><div class=\"lec-sent-ko\">Patricia West는 희귀한 혈액형 때문에 자신이 사는 고장의 혈액은행으로부터 헌혈을 하라는 요청을 늘 받았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 주인공인 패트리샤가 가진 특별한 신체적 조건을 제시하며, 그녀가 평소 헌혈에 익숙한 상황이었음을 보여줍니다. 이는 나중에 그녀가 겪게 될 위기 상황에서 중요한 복선 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was always asked (수동태): be동사(was)+p.p.(asked) 구조. ask는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 be동사+p.p. 형태로 쓴다. 기본구조: ask + O + toV(5형식)로, 목적어(O)가 주어로 올라가 수동태가 되고 toV는 그대로 남는다.</div><div class=\"lec-gr-item\">to donate (to부정사): ask+O+toV(5형식) 구조에서 목적어(O)가 주어로 이동한 수동태 문장의 목적격 보어로 쓰여 &#39;~할 것을 요청받다&#39;라는 의미를 형성한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">rare</td><td class=\"m\">드문, 희귀한</td></tr><tr><td class=\"w\">donate</td><td class=\"m\">기부하다, 기증하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">후에</span><span class=\"en\"><b>Later,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Patricia는 이사를 했는데</span><span class=\"en\"><b>Patricia moved</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">고향인 플로리다 주에서</span><span class=\"en\"><b>from her home state of Florida</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">미시간 주로</span><span class=\"en\"><b>to Michigan,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그곳에서 그녀는 갑자기 차에 치였고</span><span class=\"en\"><b><span class=\"grammar-hl\">where</span> she <span class=\"grammar-hl\">was suddenly hit</span> by a car</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">길을 건너다</span><span class=\"en\"><b>while <span class=\"grammar-hl\">crossing</span> the street</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">옮겨져야 했다</span><span class=\"en\"><b>and <span class=\"grammar-hl\">had to be taken</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">병원으로</span><span class=\"en\"><b>to the hospital</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">응급 수술을 받기 위해.</span><span class=\"en\"><b>for emergency surgery.</b></span></div></div><div class=\"lec-sent-ko\">후에 Patricia는 고향인 플로리다 주에서 미시간 주로 이사를 했는데, 그곳에서 그녀는 길을 건너다 갑자기 차에 치여 병원으로 옮겨져 응급 수술을 받아야 했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 주인공이 환경을 바꾼 뒤 예기치 못한 사고라는 위기에 처했음을 알리며, 사건의 긴박함을 고조시키는 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">where (관계부사): 선행사(Michigan)를 수식하며, 뒤에 주어+동사+수동태가 포함된 완전한 절(she was hit...)이 이어져 장소적 배경을 설명한다.</div><div class=\"lec-gr-item\">was suddenly hit (수동태): be동사(was)+p.p.(hit) 구조. hit은 타동사인데, 뒤에 목적어가 없어서 수동구조 be동사+p.p. 형태로 쓴다. 기본구조: hit + O (A가 B를 치다).</div><div class=\"lec-gr-item\">crossing (현재분사): 분사구문으로 쓰임. 원래 절로 변환하면 &#39;while she was crossing the street&#39;이며, 시간적 동시동작을 나타낸다.</div><div class=\"lec-gr-item\">had to be taken (수동태): be동사(be)+p.p.(taken) 구조. take는 타동사인데 목적어가 없어서 수동구조 be동사+p.p. 형태로 쓴다. 기본구조: take + O + to + 장소 (A를 B로 데려가다).</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">hit</td><td class=\"m\">치다, 부딪히다</td></tr><tr><td class=\"w\">emergency</td><td class=\"m\">비상사태, 응급 상황</td></tr><tr><td class=\"w\">surgery</td><td class=\"m\">수술, 외과</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">수술 도중,</span><span class=\"en\"><b>During the surgery,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀는 시작했다</span><span class=\"en\"><b>she began <span class=\"grammar-hl\">to bleed</span> heavily.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">피를 많이 흘리기.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">수술 도중, 그녀는 피를 많이 흘리기 시작했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 사고의 결과로 생명이 위급한 상황임을 나타내며, 수술실 안에서의 긴박한 국면을 전환합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to bleed (to부정사): began의 목적어 역할을 하는 명사적 용법으로, &#39;피를 흘리기 시작했다&#39;는 동작을 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">surgery</td><td class=\"m\">수술, 외과</td></tr><tr><td class=\"w\">bleed</td><td class=\"m\">피를 흘리다, 출혈하다</td></tr><tr><td class=\"w\">heavily</td><td class=\"m\">심하게, 대량으로</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">외과의사는 긴급 요청을 했다</span><span class=\"en\"><b>The surgeon made an emergency call</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀의 혈액형에 대한</span><span class=\"en\"><b>for her blood type,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 전혀 발견되지 않았다</span><span class=\"en\"><b>but none <span class=\"grammar-hl\">was found</span>.</b></span></div></div><div class=\"lec-sent-ko\">의사는 그녀와 혈액형이 같은 혈액을 긴급 요청했지만, 전혀 구할 수가 없었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 주인공의 희귀 혈액형이라는 조건이 이제는 생명을 위협하는 장애물로 작용하고 있음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was found (수동태): be동사(was)+p.p.(found) 구조. find는 타동사인데 목적어가 없어서 수동구조 be동사+p.p. 형태로 쓴다. 기본구조: find + O (A가 B를 찾다).</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">emergency</td><td class=\"m\">비상사태, 응급 상황</td></tr><tr><td class=\"w\">surgeon</td><td class=\"m\">외과 의사</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">미시간 전체에서</span><span class=\"en\"><b>In all of Michigan,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">혈액은 없었다</span><span class=\"en\"><b>there was no blood</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Patricia와 같은 유형의</span><span class=\"en\"><b>of <span class=\"grammar-hl\">Patricia’s type</span>.</b></span></div></div><div class=\"lec-sent-ko\">미시건 전체에서, Patricia와 같은 혈액형의 혈액은 없었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 구조의 희망이 사라져 가는 절망적인 상황을 강조하며, 해결책이 매우 요원해진 상태를 구체적으로 묘사합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Patricia’s type (관용표현): 소유격 대명사 &#39;Patricia&#39;s&#39; 뒤에 앞서 언급된 &#39;blood type&#39;이 생략된 형태.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">마침내</span><span class=\"en\"><b>Finally,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">절박한 요청이 보내졌다</span><span class=\"en\"><b>a desperate call <span class=\"grammar-hl\">was sent</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">국립 희귀 혈액 기증자 등록 협회로</span><span class=\"en\"><b>to the National Rare Donor Registry.</b></span></div></div><div class=\"lec-sent-ko\">마침내 국립 희귀 혈액 기증자 등록 협회에 절박한 요청이 전해졌다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 상황이 최악에 다다랐을 때, 외부의 더 큰 체계를 통해 도움을 구하려는 마지막 노력을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was sent (수동태): be동사(was)+p.p.(sent) 구조. send는 타동사인데 목적어가 없어서 수동구조 be동사+p.p. 형태로 쓴다. 기본구조: send + O + to + 목적지 (A를 B로 보내다).</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">rare</td><td class=\"m\">드문, 희귀한</td></tr><tr><td class=\"w\">desperate</td><td class=\"m\">절박한, 필사적인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">곧</span><span class=\"en\"><b>Soon</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 대답을 보냈는데</span><span class=\"en\"><b>they responded</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">찾았다는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">that they had found</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">필요한 혈액을</span><span class=\"en\"><b>the <span class=\"grammar-hl\">needed</span> blood</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">플로리다에서.</span><span class=\"en\"><b>in Florida.</b></span></div></div><div class=\"lec-sent-ko\">그들은 곧 플로리다에서 필요한 혈액을 찾았다는 대답을 보냈다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 멀리 떨어진 장소에서 실마리를 발견하며, 위기 상황에서 반전이 일어날 것임을 암시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that they had found (간접의문문/명사절): responded의 목적어 역할을 하는 that절로, 내용상 그들이 혈액을 찾았다는 사실을 전달한다.</div><div class=\"lec-gr-item\">needed (과거분사(형용사)): 명사(blood)를 수식. &#39;p.p.된 N&#39;의 구조로 &#39;필요로 되어지는(확보된) 혈액&#39;이라는 의미를 갖는다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이용할 수 있는 유일한 혈액은</span><span class=\"en\"><b>The only blood <span class=\"grammar-hl\">available</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Patricia가 자신의 혈액이었다</span><span class=\"en\"><b>was Patricia’s own,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀가 헌혈한</span><span class=\"en\"><b><span class=\"grammar-hl\">which she had donated</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">몇 달 전에.</span><span class=\"en\"><b>several months before.</b></span></div></div><div class=\"lec-sent-ko\">이용할 수 있는 유일한 혈액은 Patricia가 몇 달 전에 헌혈한 그녀 자신의 혈액이었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 아이러니한 상황이 드러나는 대목으로, 과거의 선행이 현재의 자신을 구하는 원동력이 되었음을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">available (현재분사/형용사): 명사(blood) 뒤에서 후치 수식하며, &#39;이용 가능한 혈액&#39;이라는 의미를 형성한다.</div><div class=\"lec-gr-item\">which she had donated (관계대명사): 선행사(Patricia’s own blood)를 부연 설명하며, 절 내부에서 목적어 역할을 하므로 뒤에 불완전한 문장이 온다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">donate</td><td class=\"m\">기부하다, 기증하다</td></tr><tr><td class=\"w\">available</td><td class=\"m\">이용 가능한, 구할 수 있는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Patricia West는 오늘날 살아 있다</span><span class=\"en\"><b>Patricia West lives today</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀가 헌혈했기 때문에</span><span class=\"en\"><b><span class=\"grammar-hl\">because she gave blood</span>.</b></span></div></div><div class=\"lec-sent-ko\">Patricia West는 헌혈한 덕분에 지금 살아 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 전체 글을 마무리하는 결론으로, 헌혈이라는 작은 실천이 돌고 돌아 결국 자신의 생명을 지켰다는 인과관계를 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">because she gave blood (관용표현): &#39;give blood&#39;는 &#39;헌혈하다&#39;라는 뜻의 숙어로 사용된다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>패트리샤는 희귀 혈액형을 가져 평소 꾸준히 헌혈을 해왔다.</li><li>미시간으로 이사 후 큰 사고를 당해 위급한 수술을 받게 되었다.</li><li>그녀의 희귀 혈액을 구할 수 없었으나, 예전에 본인이 기증했던 혈액을 찾게 되었다.</li><li>과거의 헌혈이 현재의 그녀를 살리는 기적을 만들었다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Patricia West’s consistent blood donations became her only lifeline during a medical emergency, proving that altruistic actions can ultimately ensure one&#39;s own survival.</div>\n              <div class=\"lec-final-sum-ko\">패트리샤 웨스트의 꾸준한 헌혈은 응급 상황에서 유일한 생명줄이 되었으며, 이타적인 행동이 결과적으로 자신의 생존을 보장할 수 있음을 보여준다.</div></div></div>"],"segs":[[{"audio":"./apply03_audio/1.mp3","hl":null}],[{"audio":"./apply03_audio/2.mp3","hl":null}],[{"audio":"./apply03_audio/3.mp3","hl":null},{"audio":"./apply03_audio/4.mp3","hl":"stage-0"},{"audio":"./apply03_audio/5.mp3","hl":"stage-1"},{"audio":"./apply03_audio/6.mp3","hl":"stage-2"},{"audio":"./apply03_audio/7.mp3","hl":"stage-3"}],[{"audio":"./apply03_audio/8.mp3","hl":null}],[{"audio":"./apply03_audio/9.mp3","hl":"main"},{"audio":"./apply03_audio/10.mp3","hl":"meaning"},{"audio":"./apply03_audio/11.mp3","hl":"grammar"}],[{"audio":"./apply03_audio/12.mp3","hl":"main"},{"audio":"./apply03_audio/13.mp3","hl":"meaning"},{"audio":"./apply03_audio/14.mp3","hl":"grammar"}],[{"audio":"./apply03_audio/15.mp3","hl":"main"},{"audio":"./apply03_audio/16.mp3","hl":"meaning"},{"audio":"./apply03_audio/17.mp3","hl":"grammar"}],[{"audio":"./apply03_audio/18.mp3","hl":"main"},{"audio":"./apply03_audio/19.mp3","hl":"meaning"},{"audio":"./apply03_audio/20.mp3","hl":"grammar"}],[{"audio":"./apply03_audio/21.mp3","hl":"main"},{"audio":"./apply03_audio/22.mp3","hl":"meaning"},{"audio":"./apply03_audio/23.mp3","hl":"grammar"}],[{"audio":"./apply03_audio/24.mp3","hl":"main"},{"audio":"./apply03_audio/25.mp3","hl":"meaning"},{"audio":"./apply03_audio/26.mp3","hl":"grammar"}],[{"audio":"./apply03_audio/27.mp3","hl":"main"},{"audio":"./apply03_audio/28.mp3","hl":"meaning"},{"audio":"./apply0
