두는 상황을 상상하시면 이해하기가 훨씬 쉬울 거예요. 이 과정에서 사람들은 원래 사려던 것보다 더 큰 지출을 하게 되는데, 이를 방지하기 위해서는 자신의 합리적인 소비 기준을 명확히 세우는 것이 무엇보다 중요하답니다. 여러분도 쇼핑할 때 이런 판매 방식에 휘둘리지 않도록 미리 경각심을 가지면 좋을 것 같아요!</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01소비자의 절약 심리 이용</div><ul><li>사람들은 돈을 아끼기 위해 세일 상품을 찾지만, 실제로는 계획보다 많은 돈을 지출하게 되기도 한다.</li><li>저렴한 상품에 반응하는 소비자의 구매 본능</li><li>광고를 보고 합리적 소비를 기대하며 매장을 방문함</li><li>핵심 키워드: 세일(Sale), 절약(Save money)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02미끼 전략의 실행</div><ul><li>판매자는 저렴한 가격으로 광고하여 손님을 끌어들인 뒤, 해당 상품이 없다는 핑계로 다른 상품을 권한다.</li><li>매장 방문 시 광고된 저렴한 상품은 품절(Sold out) 상태</li><li>판매자가 더 비싼 다른 모델을 제안함</li><li>핵심 키워드: 광고(Advertisement), 품절(Sold out)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03미끼와 교체 전략의 정체</div><ul><li>이처럼 낮은 가격으로 유인한 후 더 비싼 물건으로 바꾸어 파는 판매 기법을 미끼와 교체라고 부른다.</li><li>구매자를 유인하는 미끼(Bait) 단계</li><li>더 비싼 상품으로 교체(Switch)하는 단계</li><li>핵심 키워드: 미끼와 교체(Bait and switch)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">on sale</td><td class=\"m\">할인 중인, 염가 판매 중인</td></tr><tr><td class=\"w\">attract one&#39;s attention</td><td class=\"m\">~의 관심을 끌다</td></tr><tr><td class=\"w\">sold out</td><td class=\"m\">매진된, 다 팔린</td></tr><tr><td class=\"w\">just right</td><td class=\"m\">딱 알맞은, 안성맞춤인</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">bait and switch</td><td class=\"m\">미끼 상술(유인 후 다른 상품으로 유도하는 상술)</td></tr><tr><td class=\"w\">bait</td><td class=\"m\">유인하다, 꾀다</td></tr><tr><td class=\"w\">switch</td><td class=\"m\">바꾸다, 전환하다</td></tr><tr><td class=\"w\">costlier</td><td class=\"m\">더 비싼, 가격이 더 나가는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신은 세일 중인 물건을 산다</span><span class=\"en\"><b>You buy items on sale</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">돈을 아끼려고.</span><span class=\"en\"><b><span class=\"grammar-hl\">to save</span> money.</b></span></div></div><div class=\"lec-sent-ko\">당신은 돈을 아끼려고 세일 중인 물건을 산다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 도입부로서, 소비자가 일반적으로 합리적인 경제 활동을 추구하는 상황을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to save (to부정사): 부사적 용법(목적)으로, 문장의 주절 동작(buy)의 목적을 나타내어 &#39;~하기 위해&#39;로 해석되는 구조입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">on sale</td><td class=\"m\">할인 중인, 염가 판매 중인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러나 당신은 더 많이 쓰게 될지도 모른다</span><span class=\"en\"><b>But you may spend more</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신이 계획했던 것보다.</span><span class=\"en\"><b><span class=\"grammar-hl\">than you planned</span>.</b></span></div></div><div class=\"lec-sent-ko\">그러나 당신은 계획했던 것보다 더 많이 돈을 쓰게 될지도 모른다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 소비자의 의도와 달리 실제로는 더 큰 지출이 발생할 수 있음을 언급하며, 글의 소재인 소비 현장의 문제점을 암시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">than you planned 관계대명사(생략된 목적격): 비교급 뒤에서 생략된 관계대명사(which/that)가 &#39;the amount&#39;를 수식하며, 절 내부에서 planned의 목적어 역할을 하는 구조입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">상상해 보라</span><span class=\"en\"><b><span class=\"grammar-hl\">Imagine</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신이 자전거 한 대가 필요한데</span><span class=\"en\"><b>you need a bike</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한 광고가 당신 주의를 끈다고</span><span class=\"en\"><b>and an advertisement <span class=\"grammar-hl\">attracts your attention</span>:</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">10단 자전거,</span><span class=\"en\"><b>“Ten speed bike,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">단돈 99불,</span><span class=\"en\"><b>only $99.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">단 이틀간,</span><span class=\"en\"><b>Two-day sale.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">서두르세요!</span><span class=\"en\"><b>Hurry!”</b></span></div></div><div class=\"lec-sent-ko\">(당신이 자전거 한 대가 필요한데 한 광고가 당신 주의를 끈다고 상상해 보라. “10단 자전거, 단돈 99불, 단 이틀간, 서두르세요!”)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 일반적인 상황을 구체적인 예시로 연결하여 독자가 상황을 생생하게 그리도록 유도합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Imagine 5형식(SVOC) 구조: &#39;Imagine + O + OC&#39;의 형태로, 뒤에 오는 명사절(you need...)을 목적어로 취하는 동사 구조입니다.</div><div class=\"lec-gr-item\">attracts your attention 5형식(SVOC) 구조: &#39;advertisement(S) + attracts(V) + your attention(O)&#39;로 구성된 문장입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만</span><span class=\"en\"><b>However,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가게에 도착했을 때는</span><span class=\"en\"><b><span class=\"grammar-hl\">when you get to the store</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">발견한다</span><span class=\"en\"><b>you discover</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">광고하던 그 자전거가</span><span class=\"en\"><b>that the <span class=\"grammar-hl\">advertised bike</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다 팔리고 없다는 것을.</span><span class=\"en\"><b><span class=\"grammar-hl\">is sold out</span>.</b></span></div></div><div class=\"lec-sent-ko\">하지만 가게에 도착했을 때는 광고하던 그 자전거는 다 팔리고 없다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 유인책에 이끌려 찾아온 손님에게 실제로 물건이 없는 상황을 보여줌으로써, 판매 전략의 첫 단계가 진행되었음을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">when you get to the store (관계부사(접속사)): when은 시간의 흐름을 나타내는 부사절을 이끄는 접속사로, 주절의 사건이 일어나는 시점을 정의합니다.</div><div class=\"lec-gr-item\">advertised bike (과거분사(형용사)): advertised가 뒤의 명사(bike)를 수식하는 구조로, &#39;광고된 자전거&#39;라는 의미를 가집니다.</div><div class=\"lec-gr-item\">is sold out (수동태): be동사(is) + p.p.(sold) 구조입니다. sell은 타동사인데 목적어가 없어서 수동구조 is sold out 형태로 씁니다. 기본구조: sell + O(물건) (물건을 팔다).</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sold out</td><td class=\"m\">매진된, 다 팔린</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그다음 점원이 당신에게 말한다</span><span class=\"en\"><b>Then the salesman tells you</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그가 다른 모델을 가지고 있다는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">that he has another model</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">‘당신에게 딱 맞는’.</span><span class=\"en\"><b><span class=\"grammar-hl\">that’s “just right for you.”</span></b></span></div></div><div class=\"lec-sent-ko\">점원이 ‘당신에게 딱 맞는’ 다른 모델이 있다고 말한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 싼 물건을 미끼로 손님을 매장으로 불러들인 후, 더 비싼 물건으로 관심을 돌리게 만드는 구체적인 판매 방식의 전환 과정을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that he has another model (간접의문문(명사절)): 동사(tells)의 목적어 역할을 하는 명사절로, &#39;그가 모델을 가지고 있다는 것&#39;을 의미합니다.</div><div class=\"lec-gr-item\">that’s “just right for you.” (관계대명사): that이 주격 관계대명사로, 선행사(another model)를 수식하며 절 내부에서 주어 역할을 합니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">just right</td><td class=\"m\">딱 알맞은, 안성맞춤인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 359불이다.</span><span class=\"en\"><b><span class=\"grammar-hl\">It costs $359.</span></b></span></div></div><div class=\"lec-sent-ko\">그것은 359불이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 저렴한 광고 상품과 대비되는 높은 가격을 제시하여, 소비자가 당초 계획보다 훨씬 많은 돈을 쓰게 되는 지점을 구체적으로 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It costs $359. 5형식(SVOC) 구조: 주어(It) + 동사(costs) + 목적어/보어(price)의 3형식 문형을 기본으로 합니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 판매술은</span><span class=\"en\"><b>This sales method</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">일명 ‘미끼와 전환’이라고 불린다.</span><span class=\"en\"><b><span class=\"grammar-hl\">is called</span> “bait and switch.”</b></span></div></div><div class=\"lec-sent-ko\">이 판매술은 일명 ‘미끼와 전환’이라고 불린다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 일련의 과정을 전문적인 용어로 정리하며 이 글의 핵심 주제를 규정합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is called (수동태): be동사(is) + p.p.(called) 구조입니다. call은 타동사인데 목적어가 없어서 수동구조 is called 형태로 씁니다. 기본구조: call + O + C (O를 C라고 부르다).</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">bait and switch</td><td class=\"m\">미끼 상술(유인 후 다른 상품으로 유도하는 상술)</td></tr><tr><td class=\"w\">bait</td><td class=\"m\">유인하다, 꾀다</td></tr><tr><td class=\"w\">switch</td><td class=\"m\">바꾸다, 전환하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">첫째,</span><span class=\"en\"><b>First,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">구매자는 유혹된다</span><span class=\"en\"><b>buyers <span class=\"grammar-hl\">are baited</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">세일 제안(미끼)에.</span><span class=\"en\"><b>with a sales offer.</b></span></div></div><div class=\"lec-sent-ko\">첫째, 구매자는 세일 제안(미끼)에 유혹된다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> &#39;미끼와 교체&#39; 전략의 첫 번째 단계인 유인 과정을 요약하여 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are baited (수동태): be동사(are) + p.p.(baited) 구조입니다. bait는 타동사인데 목적어가 없어서 수동구조 are baited 형태로 씁니다. 기본구조: bait + O (O를 미끼로 꾀다).</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">bait</td><td class=\"m\">유인하다, 꾀다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 다음엔</span><span class=\"en\"><b>Then,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 전환된다</span><span class=\"en\"><b>they <span class=\"grammar-hl\">are switched</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 비싼 제품으로.</span><span class=\"en\"><b>to another costlier item.</b></span></div></div><div class=\"lec-sent-ko\">그 다음엔 더 비싼 제품으로 전환된다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 전략의 두 번째 단계인 상품 교체 과정을 설명하며, 소비자가 결국 원래 의도와 다른 선택을 하게 됨을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are switched (수동태): be동사(are) + p.p.(switched) 구조입니다. switch는 타동사인데 목적어가 없어서 수동구조 are switched 형태로 씁니다. 기본구조: switch + A + to + B (A를 B로 바꾸다).</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">switch</td><td class=\"m\">바꾸다, 전환하다</td></tr><tr><td class=\"w\">costlier</td><td class=\"m\">더 비싼, 가격이 더 나가는</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>소비자는 돈을 아끼려 하지만, 종종 계획보다 더 많은 돈을 쓰게 된다.</li><li>&#39;미끼와 교체&#39; 기법은 싼 물건 광고로 손님을 매장으로 유인하는 방식이다.</li><li>광고 상품이 품절되었다고 속인 뒤, 훨씬 비싼 상품을 구매하도록 유도한다.</li><li>이 과정을 통해 소비자는 당초 계획보다 더 큰 지출을 하게 된다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Retailers use attractive bait advertisements to lure customers into the store, but they switch them to higher-priced items once the original product is unavailable.</div>\n              <div class=\"lec-final-sum-ko\">소매업체들은 매력적인 미끼 광고로 고객을 유인하지만, 원래 상품을 구할 수 없게 되면 더 비싼 상품으로 교체하도록 유도한다.</div></div></div>"],"segs":[[{"audio":"./apply01_audio/1.mp3","hl":null}],[{"audio":"./apply01_audio/2.mp3","hl":null}],[{"audio":"./apply01_audio/3.mp3","hl":null},{"audio":"./apply01_audio/4.mp3","hl":"stage-0"},{"audio":"./apply01_audio/5.mp3","hl":"stage-1"},{"audio":"./apply01_audio/6.mp3","hl":"stage-2"}],[{"audio":"./apply01_audio/7.mp3"," tNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||typeof requestAnimationFrame!=="function"){c.scrollTop=to;return;}var t0=0;var step=function(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/260);var e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;c.scrollTop=fr+(to-fr)*e;if(k<1)requestAnimationFrame(step);};requestAnimationFrame(step);}catch(_){try{el.scrollIntoView({block:"start"});}catch(__){}}}function applyHl(key){clearHl();if(!key)return;var el=s.querySelector("[data-hl=\""+key+"\"]");if(el){el.classList.add("lec-hl");scrollHl(el);}}function clrTmr(){if(tmr){clearTimeout(tmr);tmr=null;}}function setSeg(){clrTmr();fill.style.width="0%";var seg=segsOf(i)[j];clearHl();if(!seg||!seg.audio){a.removeAttribute("src");if(seg)applyHl(seg.hl);if(playing){tmr=setTimeout(segEnd,1500);}return;}applyHl(seg.hl);a.src=seg.audio;a.playbackRate=rate;if(playing){a.play().catch(function(){});}}function segEnd(){if(!playing)return;var segs=segsOf(i);if(j<segs.length-1){j++;setSeg();}else if(i<D.slides.length-1){go(1);}else{playing=false;pp.textContent="\u25b6 \uc7ac\uc0dd";clearHl();}}var rsel=document.getElementById("rate");if(rsel){rsel.onchange=function(){rate=parseFloat(rsel.value)||1;try{a.playbackRate=rate;}catch(_){}};}function show(){s.innerHTML=D.slides[i]||"";s.scrollTop=0;c.textContent=(i+1)+" / "+D.slides.length;j=0;setSeg();}a.ontimeupdate=function(){fill.style.width=(a.duration?(a.currentTime/a.duration*100):0)+"%";};function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}function toggle(){playing=!playing;pp.textContent=playing?"\u23f8 \uc77c\uc2dc\uc815\uc9c0":"\u25b6 \uc7ac\uc0dd";if(playing){if(!a.src){setSeg();}else{a.play().catch(function(){});}}else{clrTmr();a.pause();}}tl.onclick=function(e){if(!a.duration)return;var r=tl.getBoundingClientR
